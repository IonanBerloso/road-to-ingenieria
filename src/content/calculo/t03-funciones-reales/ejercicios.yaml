ejercicios:
  # ═══════════════════════════════════════════════════════════════════
  # Ejemplos introductorios del tema 3.
  #
  # Nuestros, no de examen ni del boletín, y su `fuente` lo dice. Mismo
  # criterio que en complejos y sucesiones: una sola idea, números que salen a
  # mano, tres o cuatro pasos.
  # ═══════════════════════════════════════════════════════════════════

  - id: ej-dominio-con-arcoseno
    titulo: Un dominio con una restricción que no se ve
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Hallar el dominio de $f(x) = \arcsin(2x)$.
    pide: El intervalo de valores de x para los que la función existe.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué operación de esta fórmula puede fallar?
        opciones:
          - texto: El arcoseno, que solo acepta argumentos entre −1 y 1
            correcta: true
            mensaje: |
              Eso es, y es **la prohibición que casi nadie mira**. Se buscan
              divisiones entre cero, raíces pares y logaritmos, y se olvida que
              el arcoseno y el arcocoseno también restringen.
          - texto: Ninguna, es un polinomio
            mensaje: |
              El $2x$ de dentro sí es un polinomio y no da problemas. El
              problema es la función que lo envuelve: $\arcsin$ no acepta
              cualquier número.
          - texto: La multiplicación por 2
            mensaje: |
              Multiplicar siempre se puede. Lo que restringe es el arcoseno, y
              el 2 lo único que hace es cambiar dónde queda el límite.
      - tipo: calcular
        titulo: El extremo derecho
        pregunta: |
          De $-1 \le 2x \le 1$, ¿cuál es el mayor valor que puede tomar $x$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.001
          formato: en forma exacta, o con dos decimales
        distractores:
          - valor: '1'
            mensaje: |
              1 es la cota del **argumento**, no de $x$. El argumento es $2x$,
              así que hay que dividir entre 2 para saber hasta dónde llega $x$.
          - valor: '2'
            mensaje: |
              Has multiplicado en vez de dividir. Si $2x \le 1$, entonces $x$ es
              como mucho la mitad de 1, no el doble.
        pista: |
          Resuelve $2x \le 1$. El 2 pasa dividiendo.
        desarrollo: |
          $$
          -1 \le 2x \le 1
          \;\Longleftrightarrow\;
          -\frac12 \le x \le \frac12
          $$

          El mayor valor es $\frac12$. Fíjate en que ese número **no aparece en
          ninguna parte de la fórmula**: sale de la restricción del arcoseno.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: $\arcsin$ solo está definido para argumentos en $[-1,1]$.
          - texto: Aquí el argumento es $2x$, luego se exige $-1 \le 2x \le 1$.
          - texto: Dividiendo entre 2, el dominio es $\left[-\frac12,\frac12\right]$.
          - texto: Los extremos entran, porque $\arcsin(\pm1)$ sí existe.
          - texto: Como no hay denominadores ni raíces, el dominio es todo $\mathbb{R}$.
            trampa: true
            mensaje: |
              Ese es exactamente el razonamiento que falla. Divisiones, raíces y
              logaritmos son tres prohibiciones, pero **no son las únicas**: las
              trigonométricas inversas también restringen, y sin avisar.
    resolucion: |
      **El dominio no se calcula: se descarta.** Se recorre la fórmula buscando
      lo que no siempre se puede hacer.

      Aquí no hay denominadores, ni raíces de índice par, ni logaritmos. Pero
      hay un **arcoseno**, y el arcoseno solo acepta argumentos entre $-1$ y
      $1$. Como el argumento es $2x$:

      $$
      -1 \le 2x \le 1
      \;\Longrightarrow\;
      -\frac12 \le x \le \frac12
      $$

      $$
      \operatorname{Dom} f = \left[-\tfrac12, \tfrac12\right]
      $$

      **Comprobación.** Con $x = \frac12$ queda $\arcsin(1) = \frac{\pi}{2}$,
      que existe. Con $x = 1$ quedaría $\arcsin(2)$, que no.

  - id: ej-inversa-con-signo
    titulo: Una inversa, y el signo que hay que elegir
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Hallar la inversa de $f(x) = x^{2}$ definida en $(-\infty, 0]$.
    pide: La fórmula de la inversa, con el signo correcto.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el enunciado se molesta en decir el dominio?
        opciones:
          - texto: Porque en todo $\mathbb{R}$ la función no sería inyectiva y no habría inversa
            correcta: true
            mensaje: |
              Exacto. $2$ y $-2$ tienen la misma imagen, así que en $\mathbb{R}$
              no hay inversa. Restringiendo el dominio se elimina el empate. **La
              inversa depende del dominio, no de la fórmula.**
          - texto: Para que la inversa dé números positivos
            mensaje: |
              Al revés: como el dominio de partida son los negativos, la inversa
              tiene que **devolver** negativos. Ese es justo el detalle del
              signo.
          - texto: Es un dato de más, no cambia nada
            mensaje: |
              Cambia todo. Sin restringir el dominio no hay inversa en absoluto,
              y con otro dominio la inversa sería otra fórmula.
      - tipo: calcular
        titulo: Un valor de comprobación
        pregunta: |
          Si $f^{-1}$ es la inversa, ¿cuánto vale $f^{-1}(9)$?
        respuesta:
          tipo: numero
          valor: '-3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              $3$ también cumple $3^{2}=9$, pero **no está en el dominio de
              partida**, que son los negativos. La inversa tiene que devolverte
              al sitio de donde saliste.
          - valor: '81'
            mensaje: |
              Has elevado al cuadrado en vez de sacar la raíz. La inversa
              deshace lo que la función hace.
        pista: |
          Busca el número **del dominio** $(-\infty,0]$ cuyo cuadrado es 9.
        desarrollo: |
          $$
          f(x) = 9 \;\Longleftrightarrow\; x^{2} = 9 \;\Longleftrightarrow\; x = \pm 3
          $$

          De los dos, solo $-3$ está en $(-\infty, 0]$. Luego
          $f^{-1}(9) = -3$, y eso ya te dice que la inversa lleva el signo
          menos delante de la raíz.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza sobra.
        piezas:
          - texto: En $(-\infty,0]$ la función es inyectiva, así que tiene inversa.
          - texto: De $y = x^{2}$ se despeja $x = \pm\sqrt{y}$.
          - texto: Como el dominio de partida son los negativos, se toma la raíz negativa.
          - texto: $f^{-1}(x) = -\sqrt{x}$, definida para $x \ge 0$.
          - texto: Al despejar siempre se toma la raíz positiva, que es la principal.
            trampa: true
            mensaje: |
              Esa costumbre es la que hace fallar el ejercicio. La raíz
              principal es positiva **como convenio de notación**, pero la
              inversa tiene que devolver valores del dominio de partida, y aquí
              son negativos.
    resolucion: |
      **Por qué hay inversa.** En todo $\mathbb{R}$ no la habría: $2$ y $-2$
      empatan. Restringido a $(-\infty,0]$ no hay dos valores con la misma
      imagen, así que sí.

      **Despejar.** De $y = x^{2}$ sale $x = \pm\sqrt{y}$, y hay que **elegir**.
      Como todos los valores del dominio de partida son negativos o cero, la
      inversa tiene que devolver negativos:

      $$
      f^{-1}(x) = -\sqrt{x}
      $$

      **El dominio de la inversa** es el rango de $f$, que aquí es $[0,\infty)$.
      Esa igualdad es la comprobación que caza casi todos los errores: si el
      dominio que te sale no coincide con el rango que calculaste, algo falla.

      **Comprobación.** $f^{-1}(9) = -3$, y $f(-3) = 9$. Vuelve al punto de
      partida, que es lo que una inversa tiene que hacer.

  - id: ej-continuidad-parametro
    titulo: Un parámetro que pega dos trozos
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Hallar el valor de $k$ para que la función
      $$
      f(x) = \begin{cases} x + k & x < 2 \\[4pt] x^{2} & x \ge 2 \end{cases}
      $$
      sea continua en todo $\mathbb{R}$.
    pide: El valor de k.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde puede fallar la continuidad de esta función?
        opciones:
          - texto: Solo en $x = 2$, el punto de empalme
            correcta: true
            mensaje: |
              Eso es. Dentro de cada trozo son un polinomio y una parábola, que
              son continuas siempre. **Toda la pregunta se juega en la
              frontera**, y por eso este tipo de ejercicio se resuelve en tres
              líneas.
          - texto: En todos los puntos, hay que comprobarlos uno a uno
            mensaje: |
              No hace falta: los polinomios son continuos en todo su dominio, y
              cada trozo lo es. Lo único que hay que comprobar es dónde se pegan.
          - texto: En $x = 0$, donde la función cambia de signo
            mensaje: |
              Cambiar de signo no rompe la continuidad. Lo que la puede romper
              es un salto, y aquí el único sitio donde podría haberlo es donde
              cambia la definición.
      - tipo: calcular
        titulo: El límite por la derecha
        pregunta: |
          ¿Cuánto vale $\lim_{x\to 2^{+}} f(x)$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es el valor de $x$, no el de la función. Por la derecha manda la
              rama $x^{2}$, así que hay que elevar al cuadrado.
          - valor: '0'
            mensaje: |
              Parece que has usado la rama de la izquierda con $k=0$. Por la
              derecha, con $x \ge 2$, la función vale $x^{2}$.
        pista: |
          Por la derecha de 2 la función es $x^{2}$. Sustituye.
        desarrollo: |
          $$
          \lim_{x\to 2^{+}} f(x) = 2^{2} = 4
          $$
      - tipo: calcular
        titulo: El parámetro
        pregunta: |
          Igualando los dos límites laterales, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              4 es el valor común de los dos límites, no el parámetro. De
              $2 + k = 4$ hay que despejar $k$.
          - valor: '-2'
            mensaje: |
              Signo cambiado al despejar: de $2+k=4$ sale $k = 4-2$, positivo.
          - valor: '6'
            mensaje: |
              Has sumado en vez de restar. La ecuación es $2+k=4$, así que
              $k = 4-2$.
        pista: |
          Por la izquierda el límite es $2+k$. Iguálalo a 4 y despeja.
        desarrollo: |
          $$
          \lim_{x\to 2^{-}} f(x) = 2 + k,
          \qquad
          \lim_{x\to 2^{+}} f(x) = 4
          $$

          Para que haya límite los dos tienen que coincidir, y además valer lo
          que vale la función en el punto, que es $f(2) = 4$:

          $$
          2 + k = 4 \;\Longrightarrow\; k = 2
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: Cada trozo es un polinomio, luego solo puede fallar en $x=2$.
          - texto: Por la izquierda el límite vale $2+k$; por la derecha, 4.
          - texto: Además $f(2) = 4$, porque el 2 pertenece a la segunda rama.
          - texto: Igualando las tres cosas, $k = 2$.
          - texto: Basta con que los dos límites laterales coincidan.
            trampa: true
            mensaje: |
              No basta: la continuidad son **tres** condiciones, y la tercera es
              que ese límite valga lo mismo que la función en el punto. Aquí
              coinciden, pero podrían no hacerlo, y entonces habría una
              discontinuidad evitable.
    resolucion: |
      **Dónde mirar.** Dentro de cada trozo la función es un polinomio, y los
      polinomios son continuos siempre. La única frontera es $x = 2$.

      **Las tres condiciones.** Existe $f(2) = 2^{2} = 4$, porque el 2
      pertenece a la segunda rama. Y los límites laterales:

      $$
      \lim_{x\to 2^{-}} f(x) = 2+k,
      \qquad
      \lim_{x\to 2^{+}} f(x) = 4
      $$

      Para que la función sea continua hacen falta las tres a la vez:

      $$
      2 + k = 4 = f(2)
      \;\Longrightarrow\;
      k = 2
      $$

      **Comprobación.** Con $k=2$, por la izquierda la función se acerca a
      $2+2=4$ y por la derecha a $4$, que es lo que vale. No hay salto.

  - id: ej-bolzano-una-raiz
    titulo: Bolzano, y por qué la raíz existe
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Demostrar que la ecuación $x^{3} + x - 1 = 0$ tiene una solución en el
      intervalo $[0,1]$.
    pide: La comprobación de las hipótesis y la conclusión.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué garantiza el teorema de Bolzano?
        opciones:
          - texto: Que existe al menos una raíz, pero no dice dónde
            correcta: true
            mensaje: |
              Eso es. Es un teorema de **existencia**: te asegura que la hay,
              no te la calcula. Si el enunciado pide además que sea única, hace
              falta un argumento aparte.
          - texto: Que existe exactamente una raíz
            mensaje: |
              La unicidad es otra cosa y hay que demostrarla aparte, casi
              siempre viendo que la derivada no cambia de signo. Bolzano solo
              da «al menos una».
          - texto: El valor aproximado de la raíz
            mensaje: |
              Bolzano no calcula nada. Te dice que en ese intervalo hay un
              corte con el eje, y nada más.
      - tipo: calcular
        titulo: El extremo izquierdo
        pregunta: |
          Con $f(x) = x^{3}+x-1$, ¿cuánto vale $f(0)$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Signo cambiado. Con $x=0$ los dos primeros términos se anulan y
              queda el $-1$ suelto.
          - valor: '0'
            mensaje: |
              Se anulan $x^{3}$ y $x$, pero el término independiente $-1$ sigue
              ahí.
        pista: |
          Sustituye $x=0$ en los tres términos.
        desarrollo: |
          $$
          f(0) = 0^{3}+0-1 = -1 < 0
          $$
      - tipo: calcular
        titulo: El extremo derecho
        pregunta: |
          ¿Y cuánto vale $f(1)$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-1'
            mensaje: |
              Ese es $f(0)$. Con $x=1$ los dos primeros términos valen 1 cada
              uno, y suman 2 antes de restar el 1.
          - valor: '3'
            mensaje: |
              Has sumado el $-1$ como si fuera $+1$: $1+1-1 = 1$.
        pista: |
          $1^{3} + 1 - 1$.
        desarrollo: |
          $$
          f(1) = 1 + 1 - 1 = 1 > 0
          $$

          Los dos valores tienen signos distintos, que es exactamente lo que
          Bolzano necesita.
      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una pieza no debe entrar.
        piezas:
          - texto: $f(x) = x^{3}+x-1$ es un polinomio, luego es continua en $[0,1]$.
          - texto: $f(0) = -1 < 0$ y $f(1) = 1 > 0$, signos distintos.
          - texto: Por Bolzano existe $c \in (0,1)$ con $f(c) = 0$.
          - texto: Ese $c$ es la solución de la ecuación que se pedía.
          - texto: Como la función cambia de signo, la raíz está en el punto medio.
            trampa: true
            mensaje: |
              Bolzano no dice dónde está. El punto medio es solo una
              aproximación posible, y aquí ni siquiera es la buena: la raíz
              está cerca de 0,68.
    resolucion: |
      **Nombrar la función.** Se pasa todo a un lado y se le llama $f$:

      $$
      f(x) = x^{3}+x-1
      $$

      Resolver la ecuación es encontrar un cero de $f$.

      **Comprobar las hipótesis.** $f$ es un polinomio, luego es continua en
      $[0,1]$ — y en todas partes.

      **Los signos en los extremos.**

      $$
      f(0) = -1 < 0, \qquad f(1) = 1 > 0
      $$

      **La conclusión.** Por el teorema de Bolzano existe al menos un
      $c \in (0,1)$ con $f(c) = 0$, es decir, la ecuación tiene solución en ese
      intervalo.

      **Si además pidieran unicidad**, haría falta otro argumento:
      $f'(x) = 3x^{2}+1 > 0$ siempre, así que la función es estrictamente
      creciente y no puede cortar el eje dos veces.

  - id: ej-velocidades-relacionadas
    titulo: Dos magnitudes que cambian a la vez
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un cuadrado crece de forma que su lado aumenta a razón de 2 cm/s.
      ¿A qué velocidad crece su área en el instante en que el lado mide 5 cm?
    pide: La velocidad de crecimiento del área, en cm²/s.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es el primer paso?
        opciones:
          - texto: Escribir la relación entre las magnitudes en general, sin sustituir nada
            correcta: true
            mensaje: |
              Eso es, y es **lo único que se falla** en estos problemas. Primero
              la relación general, luego derivar, y los números al final.
          - texto: Sustituir el lado por 5 y luego derivar
            mensaje: |
              Ese es exactamente el error. Si sustituyes antes, el área se
              convierte en la constante 25 y su derivada es cero. Congelas justo
              lo que tenía que variar.
          - texto: Calcular el área en ese instante
            mensaje: |
              El área en ese instante es un dato intermedio útil, pero no
              contesta a la pregunta: se pregunta a qué **velocidad** cambia,
              que es una derivada.
      - tipo: calcular
        titulo: La derivada de la relación
        pregunta: |
          De $A = L^{2}$, derivando respecto del tiempo sale
          $A' = k \cdot L \cdot L'$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Falta el factor que baja del exponente. Al derivar $L^{2}$
              respecto del tiempo, la regla de la cadena da $2L\,L'$.
          - valor: '0.5'
            mensaje: |
              Has invertido el exponente. Derivar un cuadrado **multiplica** por
              2, no divide.
        pista: |
          Regla de la cadena: la derivada de $L^{2}$ respecto del tiempo es
          $2L$ por la derivada de $L$.
        desarrollo: |
          $$
          A = L^{2}
          \;\Longrightarrow\;
          \frac{dA}{dt} = 2L\,\frac{dL}{dt}
          $$

          El $2L$ viene de derivar el cuadrado, y el $\frac{dL}{dt}$ de la
          regla de la cadena, porque $L$ depende del tiempo.
      - tipo: calcular
        titulo: El resultado
        pregunta: |
          Ahora sí, sustituye $L = 5$ y $L' = 2$. ¿Cuánto vale $A'$, en cm²/s?
        respuesta:
          tipo: numero
          valor: '20'
          tolerancia: 0.001
          formato: un número, en centímetros cuadrados por segundo
        distractores:
          - valor: '10'
            mensaje: |
              Te has dejado un factor: son $2 \cdot 5 \cdot 2$, tres números,
              no dos.
          - valor: '25'
            mensaje: |
              25 es el **área** en ese instante, no su velocidad de cambio. La
              pregunta es a qué ritmo crece.
          - valor: '4'
            mensaje: |
              Parece que has elevado la velocidad del lado al cuadrado. Las
              velocidades no se elevan: entran en la fórmula tal cual.
        pista: |
          $A' = 2 \cdot L \cdot L'$, con $L=5$ y $L'=2$.
        desarrollo: |
          $$
          \frac{dA}{dt} = 2 \cdot 5 \cdot 2 = 20 \ \text{cm}^{2}/\text{s}
          $$

          Y fíjate en que el resultado depende de $L$: cuando el cuadrado sea
          más grande, el área crecerá más deprisa aunque el lado siga creciendo
          igual de rápido.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: La relación entre las magnitudes es $A = L^{2}$, con las dos dependiendo del tiempo.
          - texto: Derivando respecto de $t$, $\frac{dA}{dt} = 2L\frac{dL}{dt}$.
          - texto: En el instante pedido, $L = 5$ y $\frac{dL}{dt} = 2$.
          - texto: Luego $\frac{dA}{dt} = 20$ cm² por segundo.
          - texto: Como el lado crece a ritmo constante, el área también.
            trampa: true
            mensaje: |
              No: el ritmo del área depende de $L$, que va cambiando. Con el
              lado a 10 cm, el área crecería a 40 cm²/s con la misma velocidad
              de lado. Es el mismo motivo por el que hay que derivar antes de
              sustituir.
    resolucion: |
      **El orden es todo.** Primero la relación en general, después derivar, y
      los números del instante concreto **al final**.

      **La relación.** El área de un cuadrado de lado $L$ es

      $$
      A = L^{2}
      $$

      y aquí las dos son funciones del tiempo, aunque no se escriba.

      **Derivar respecto del tiempo**, con la regla de la cadena:

      $$
      \frac{dA}{dt} = 2L\,\frac{dL}{dt}
      $$

      **Ahora los datos.** En ese instante $L = 5$ cm y
      $\frac{dL}{dt} = 2$ cm/s:

      $$
      \frac{dA}{dt} = 2 \cdot 5 \cdot 2 = 20 \ \text{cm}^{2}/\text{s}
      $$

      **Por qué no se puede sustituir antes.** Si pones $L=5$ en $A = L^{2}$
      obtienes $A = 25$, una constante, y su derivada es cero. Habrías
      congelado la magnitud que precisamente estaba cambiando.

  - id: dominio-y-rango
    titulo: Seis dominios y seis rangos
    fuente: >-
      Ejercicio 3.1 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Determinar el dominio y el rango de las siguientes funciones.

      **(a)** $f(x) = x^{2}-3x+2$ · **(b)** $f(x) = 1+2\,\mathrm{sen}\,x$ ·
      **(c)** $f(x) = 2+\left|x+1\right|$

      **(d)** $f(x) = \sqrt{x-1}-2$ ·
      **(e)** $f(x) = \frac{3\pi}{2}+3\arcsin(2x)$ ·
      **(f)** $f(x) = -\pi+\arccos(x)$
    pide: Dar el dominio y el rango de las seis.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se busca un dominio?
        opciones:
          - texto: >-
              **Prohibiendo**: se buscan las operaciones que no siempre se
              pueden hacer y se descarta lo que las rompe
            correcta: true
            mensaje: |
              Eso es. El dominio no se calcula de frente: se recorre la fórmula
              buscando divisiones, raíces de índice par, logaritmos y
              trigonométricas inversas, y se excluye lo que las hace
              imposibles. Lo que queda es el dominio.
          - texto: Resolviendo la ecuación $f(x)=0$
            mensaje: |
              Eso da los **ceros** de la función, que es otra cosa. El dominio
              es dónde la fórmula tiene sentido, no dónde vale cero.
          - texto: Mirando hasta dónde llegan los valores de $f$
            mensaje: |
              Eso es el **rango**, no el dominio. El dominio está en el eje de
              las $x$ y el rango en el de las $y$.
          - texto: >-
              Es siempre $\mathbb{R}$ salvo que haya una fracción
            mensaje: |
              Las fracciones no son lo único que restringe. Las raíces pares,
              los logaritmos y las trigonométricas inversas también, y estas
              últimas son las que más se olvidan.

      - tipo: calcular
        titulo: El caso que casi nadie ve
        pregunta: |
          En $f(x) = \frac{3\pi}{2}+3\arcsin(2x)$, ¿cuál es el extremo derecho
          del dominio?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 sería el extremo si el argumento fuera $x$ a secas. Pero es
              $2x$, y la condición $2x \le 1$ da $x \le \frac12$. El factor 2
              **encoge** el dominio a la mitad.
          - valor: '2'
            mensaje: |
              Has multiplicado por 2 en vez de dividir. De $-1 \le 2x \le 1$ se
              despeja $x$ dividiendo: $-\frac12 \le x \le \frac12$.
          - valor: '4.712389'
            mensaje: |
              $\frac{3\pi}{2}$ es el término que se suma **fuera**, y ese no
              toca el dominio: desplaza el rango hacia arriba. El dominio lo fija
              solo lo que hay dentro del arcoseno.
        pista: |
          $\arcsin$ solo acepta argumentos entre $-1$ y 1. Aquí el argumento es
          $2x$.
        desarrollo: |
          El arcoseno solo está definido para argumentos en $[-1,1]$:

          $$
          -1 \le 2x \le 1
          \;\Longleftrightarrow\;
          -\frac12 \le x \le \frac12
          $$

          Luego $D = \left[-\frac12,\frac12\right]$, y el extremo derecho es
          $\frac12$.

          El $\frac{3\pi}{2}$ y el 3 que multiplica no afectan al dominio: solo
          estiran y desplazan el **rango**.
        veredicto: |
          Ese $\frac12$ no aparece escrito en ninguna parte de la fórmula. Sale
          de saber qué acepta el arcoseno.

      - tipo: calcular
        titulo: Un rango con vértice
        pregunta: |
          ¿Cuál es el menor valor que toma $f(x) = x^{2}-3x+2$?
        respuesta:
          tipo: numero
          valor: '-0.25'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es $f(0)$, el término independiente. El mínimo de una parábola
              está en su vértice, no en $x=0$.
          - valor: '1.5'
            mensaje: |
              $\frac32$ es la **abscisa** del vértice, $x = \frac{-b}{2a}$. El
              valor mínimo es la ordenada: $f\left(\frac32\right)$.
          - valor: '0'
            mensaje: |
              0 sería el mínimo si la parábola fuera tangente al eje, es decir
              si tuviera raíz doble. Aquí tiene dos raíces distintas, 1 y 2, así
              que baja por debajo del eje entre ellas.
        pista: |
          El vértice está en $x = \frac{-b}{2a} = \frac32$. Evalúa ahí.
        desarrollo: |
          La parábola abre hacia arriba ($a=1>0$), así que su mínimo está en el
          vértice:

          $$
          x_v = \frac{-b}{2a} = \frac{3}{2}
          $$

          $$
          f\!\left(\frac32\right) = \frac94-\frac92+2 = \frac{9-18+8}{4}
          = -\frac14
          $$

          Luego $R = \left[-\frac14,\;\infty\right)$, y el dominio es todo
          $\mathbb{R}$.
        veredicto: |
          Dominio y rango son independientes: aquí el dominio es todo
          $\mathbb{R}$ y el rango solo la mitad de arriba de una recta.

      - tipo: justificar
        pregunta: |
          Ordena el criterio para las seis funciones. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **(a)** Parábola: $D = \mathbb{R}$, y el rango arranca en el
              vértice, $R = \left[-\frac14,\infty\right)$.
          - texto: |
              **(b)** El seno oscila entre $-1$ y 1, así que $1+2\,\mathrm{sen}\,x$
              oscila entre $-1$ y 3: $D = \mathbb{R}$, $R = [-1,3]$.
          - texto: |
              **(c)** El valor absoluto nunca es negativo, así que
              $2+\left|x+1\right| \ge 2$: $D = \mathbb{R}$, $R = [2,\infty)$.
          - texto: |
              **(d)** La raíz exige $x \ge 1$, y $\sqrt{x-1} \ge 0$ da
              $f \ge -2$: $D = [1,\infty)$, $R = [-2,\infty)$.
          - texto: |
              **(e)** y **(f)** las restringen las trigonométricas inversas:
              $D = \left[-\frac12,\frac12\right]$ con $R = [0,3\pi]$, y
              $D = [-1,1]$ con $R = [-\pi,0]$.
          - texto: |
              En **(b)** el dominio es $[-1,3]$, porque el seno solo toma
              valores ahí.
            trampa: true
            mensaje: |
              Eso confunde dominio con rango. El seno **acepta** cualquier
              número real —su dominio es $\mathbb{R}$— y **devuelve** valores en
              $[-1,1]$. Lo que está entre $-1$ y 3 es el rango de
              $1+2\,\mathrm{sen}\,x$, no su dominio.
        veredicto: |
          Es el intercambio más común del tema: el dominio vive en el eje
          horizontal y el rango en el vertical. Confundirlos cambia el
          ejercicio entero.

    resolucion: |
      **Datos.** Seis funciones. Se piden dominio y rango de cada una.

      ### 1 · Las dos preguntas se hacen al revés

      **El dominio se busca prohibiendo.** Se recorre la fórmula buscando las
      operaciones que no siempre se pueden hacer:

      | operación | restricción |
      |---|---|
      | dividir | el denominador no puede anularse |
      | raíz de índice par | el radicando no puede ser negativo |
      | logaritmo | el argumento tiene que ser positivo |
      | $\arcsin$, $\arccos$ | el argumento tiene que estar en $[-1,1]$ |

      **El rango se busca componiendo.** Se parte de lo que devuelve la pieza
      básica y se le aplican los estiramientos y desplazamientos de fuera.

      ### 2 · (a) $f(x) = x^{2}-3x+2$

      Un polinomio no prohíbe nada: $D = \mathbb{R}$.

      Es una parábola que abre hacia arriba, con vértice en

      $$
      x_v = \frac{3}{2},
      \qquad
      f\!\left(\frac32\right) = \frac94-\frac92+2 = -\frac14
      $$

      $$
      R = \left[-\frac14,\;\infty\right)
      $$

      ### 3 · (b) $f(x) = 1+2\,\mathrm{sen}\,x$

      El seno acepta cualquier real: $D = \mathbb{R}$.

      Devuelve valores en $[-1,1]$. Multiplicar por 2 lo estira a $[-2,2]$ y
      sumar 1 lo desplaza:

      $$
      R = [-1,\;3]
      $$

      ### 4 · (c) $f(x) = 2+\left|x+1\right|$

      El valor absoluto acepta todo: $D = \mathbb{R}$.

      Y nunca es negativo, con mínimo 0 alcanzado en $x=-1$:

      $$
      R = [2,\;\infty)
      $$

      ### 5 · (d) $f(x) = \sqrt{x-1}-2$

      La raíz es de índice par, así que el radicando no puede ser negativo:

      $$
      x-1 \ge 0 \;\Longrightarrow\; D = [1,\;\infty)
      $$

      Y $\sqrt{x-1}$ recorre $[0,\infty)$, así que restando 2:

      $$
      R = [-2,\;\infty)
      $$

      ### 6 · (e) $f(x) = \frac{3\pi}{2}+3\arcsin(2x)$

      Aquí está el apartado que se falla. El arcoseno solo acepta argumentos en
      $[-1,1]$, y el argumento es $2x$:

      $$
      -1 \le 2x \le 1 \;\Longrightarrow\; D = \left[-\frac12,\;\frac12\right]
      $$

      El factor 2 **encoge el dominio a la mitad**, y ese $\frac12$ no está
      escrito en ninguna parte de la fórmula.

      Para el rango: $\arcsin$ devuelve valores en
      $\left[-\frac{\pi}{2},\frac{\pi}{2}\right]$. Multiplicando por 3 queda
      $\left[-\frac{3\pi}{2},\frac{3\pi}{2}\right]$, y sumando
      $\frac{3\pi}{2}$:

      $$
      R = \left[0,\;3\pi\right]
      $$

      ### 7 · (f) $f(x) = -\pi+\arccos(x)$

      El argumento es $x$ a secas:

      $$
      D = [-1,\;1]
      $$

      $\arccos$ devuelve valores en $[0,\pi]$, y restando $\pi$:

      $$
      R = [-\pi,\;0]
      $$

      ### 8 · Comprobación

      La comprobación más rápida de un rango es evaluar en los extremos del
      dominio y en los puntos singulares:

      | | punto | valor |
      |---|---|---|
      | (a) | $x=\frac32$ | $-\frac14$, el mínimo ✔ |
      | (d) | $x=1$ | $-2$, el mínimo ✔ |
      | (e) | $x=\pm\frac12$ | $\frac{3\pi}{2}\pm\frac{3\pi}{2}$, o sea $3\pi$ y 0 ✔ |
      | (f) | $x=-1$ | $-\pi+\pi = 0$; $x=1$ da $-\pi+0 = -\pi$ ✔ |

      En (f) conviene fijarse en que el arcocoseno es **decreciente**: el
      extremo izquierdo del dominio da el valor más grande del rango.

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \text{(a)}\; & D=\mathbb{R},\; R=\left[-\tfrac14,\infty\right) &
      \text{(d)}\; & D=[1,\infty),\; R=[-2,\infty) \\
      \text{(b)}\; & D=\mathbb{R},\; R=[-1,3] &
      \text{(e)}\; & D=\left[-\tfrac12,\tfrac12\right],\; R=[0,3\pi] \\
      \text{(c)}\; & D=\mathbb{R},\; R=[2,\infty) &
      \text{(f)}\; & D=[-1,1],\; R=[-\pi,0]
      \end{aligned}}
      $$

  - id: funcion-inversa
    titulo: Seis inversas, y el signo que decide una de ellas
    fuente: >-
      Ejercicio 3.2 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU ·
      El apartado (e) cayó en 2015/2016 5E
    nivel: practica
    enunciado: |
      Calcular la función inversa de las siguientes funciones en los dominios
      indicados, y el dominio de dicha función inversa.

      **(a)** $f(x) = 1+e^{2x}$, $D = \mathbb{R}$ ·
      **(b)** $f(x) = x^{2}-1$, $D = (-\infty,0]$ ·
      **(c)** $f(x) = \ln(x+3)$, $D = (-3,\infty)$

      **(d)** $f(x) = \cos(x-1)$, $D = [1,\pi+1]$ ·
      **(e)** $f(x) = \cosh x$, $D = [0,\infty)$ ·
      **(f)** $f(x) = \mathrm{senh}\,x$, $D = \mathbb{R}$
    pide: Calcular las seis inversas y sus dominios.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el enunciado especifica el dominio en cada apartado?
        opciones:
          - texto: >-
              Porque la inversa **solo existe donde la función es inyectiva**, y
              eso depende del dominio en el que se mire
            correcta: true
            mensaje: |
              Eso es. $x^{2}-1$ no tiene inversa en $\mathbb{R}$ —2 y $-2$ dan lo
              mismo—, pero en $(-\infty,0]$ sí. El dominio no es un adorno del
              enunciado: es lo que hace posible el ejercicio.
          - texto: Para que el cálculo sea más corto
            mensaje: |
              No lo acorta: lo hace posible. Sin restringir el dominio, en tres
              de los seis apartados la inversa **no existiría**.
          - texto: Porque la inversa siempre tiene el mismo dominio que la función
            mensaje: |
              Al revés: el dominio de la inversa es el **rango** de la función.
              Rara vez coinciden.
          - texto: Para indicar dónde hay que dibujarla
            mensaje: |
              El enunciado no pide dibujar nada. El dominio está ahí por una
              razón matemática: garantizar la inyectividad.

      - tipo: calcular
        titulo: El apartado del signo
        pregunta: |
          Para $f(x) = x^{2}-1$ en $D = (-\infty,0]$, ¿cuánto vale
          $f^{-1}(3)$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Signo cambiado, y es el error que define el ejercicio. La inversa
              tiene que **devolver valores del dominio de partida**, y ese
              dominio es $(-\infty,0]$: todos negativos. Luego
              $f^{-1}(3) = -2$, no $+2$.
          - valor: '8'
            mensaje: |
              8 es $f(3) = 9-1$, la función aplicada al 3. Se pide la
              **inversa**: qué $x$ del dominio cumple $f(x)=3$.
          - valor: '4'
            mensaje: |
              4 sería $x^{2}$, un paso antes de terminar. De $x^{2}-1=3$ sale
              $x^{2}=4$ y luego $x=-2$, tomando la raíz que cae en el dominio.
        pista: |
          De $y = x^{2}-1$ sale $x = \pm\sqrt{1+y}$. ¿Cuál de los dos signos
          está en $(-\infty,0]$?
        desarrollo: |
          Despejando:

          $$
          y = x^{2}-1 \;\Longrightarrow\; x^{2} = 1+y
          \;\Longrightarrow\; x = \pm\sqrt{1+y}
          $$

          Y ahora hay que **elegir**. El dominio de $f$ es $(-\infty,0]$, así
          que la inversa tiene que devolver números negativos o cero:

          $$
          f^{-1}(x) = -\sqrt{1+x}
          $$

          Con $x=3$: $f^{-1}(3) = -\sqrt4 = -2$.

          Comprobación: $f(-2) = 4-1 = 3$ ✔
        veredicto: |
          El dominio de la inversa es $[-1,\infty)$, que es exactamente el rango
          de $f$ en $(-\infty,0]$. Esa coincidencia es la comprobación gratis.

      - tipo: calcular
        titulo: La inversa del coseno hiperbólico
        pregunta: |
          Para $f(x) = \cosh x$ en $[0,\infty)$, ¿cuál es el extremo izquierdo
          del dominio de $f^{-1}$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              0 es el extremo izquierdo del dominio de $f$, no del de
              $f^{-1}$. El dominio de la inversa es el **rango** de $f$, y
              $\cosh 0 = 1$: el coseno hiperbólico nunca baja de 1.
          - valor: '-1'
            mensaje: |
              El coseno hiperbólico es siempre **positivo**:
              $\cosh x = \frac{e^{x}+e^{-x}}{2} > 0$. No tiene nada que ver con
              el coseno ordinario, que sí llega a $-1$.
          - valor: '2.718282'
            mensaje: |
              $e \approx 2{,}718$ aparece en la fórmula, pero el mínimo de
              $\cosh$ es $\cosh 0 = \frac{1+1}{2} = 1$.
        pista: |
          El dominio de la inversa es el rango de $f$. ¿Cuál es el menor valor
          de $\cosh x$ para $x \ge 0$?
        desarrollo: |
          $$
          \cosh x = \frac{e^{x}+e^{-x}}{2}
          $$

          En $x=0$ vale $\frac{1+1}{2} = 1$, y crece a partir de ahí. Luego su
          rango en $[0,\infty)$ es $[1,\infty)$, y ese es el **dominio de la
          inversa**.

          Para la fórmula, con $u = e^{x}$:

          $$
          y = \frac{u+u^{-1}}{2}
          \;\Longrightarrow\;
          u^{2}-2yu+1 = 0
          \;\Longrightarrow\;
          u = y \pm \sqrt{y^{2}-1}
          $$

          Como $x \ge 0$ implica $u = e^{x} \ge 1$, se toma el signo $+$:

          $$
          f^{-1}(x) = \ln\left(x+\sqrt{x^{2}-1}\right), \qquad D = [1,\infty)
          $$
        veredicto: |
          Otra vez el mismo mecanismo que en (b): salen dos signos y el dominio
          de partida elige. Aquí el $+$; allí el $-$.

      - tipo: justificar
        pregunta: |
          Ordena el método y las seis respuestas. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              El método es siempre el mismo: escribir $y = f(x)$, **despejar
              $x$** y renombrar. Lo que cambia de un apartado a otro es qué
              hacer cuando el despeje da dos posibilidades.
          - texto: |
              **(a)** De $y = 1+e^{2x}$ sale
              $f^{-1}(x) = \frac12\ln(x-1)$, con $D = (1,\infty)$.
          - texto: |
              **(b)** De $y = x^{2}-1$ salen dos signos, y el dominio
              $(-\infty,0]$ elige el negativo:
              $f^{-1}(x) = -\sqrt{1+x}$, con $D = [-1,\infty)$.
          - texto: |
              **(c)** y **(d)** son directos:
              $f^{-1}(x) = e^{x}-3$ con $D=\mathbb{R}$, y
              $f^{-1}(x) = 1+\arccos x$ con $D=[-1,1]$.
          - texto: |
              **(e)** y **(f)** salen resolviendo una ecuación de segundo grado
              en $e^{x}$:
              $\ln\left(x+\sqrt{x^{2}-1}\right)$ con $D=[1,\infty)$, y
              $\ln\left(x+\sqrt{x^{2}+1}\right)$ con $D=\mathbb{R}$.
          - texto: |
              El dominio de cada inversa es el mismo que el de la función de
              partida.
            trampa: true
            mensaje: |
              Es el **rango** de la función de partida, no su dominio. En (b) la
              función va de $(-\infty,0]$ a $[-1,\infty)$, y la inversa va al
              revés. Confundirlos hace que la comprobación más útil del
              ejercicio deje de funcionar.
        veredicto: |
          «Dominio de la inversa = rango de la función» es la comprobación que
          caza casi todos los errores de este ejercicio, incluido el del signo.

    resolucion: |
      **Datos.** Seis funciones con su dominio. Se pide la inversa de cada una y
      el dominio de esa inversa.

      ### 1 · Por qué el enunciado da los dominios

      Una función tiene inversa donde es **inyectiva**: donde no hay dos $x$
      distintas con la misma imagen. Y eso **depende del dominio**, no solo de
      la fórmula.

      $x^{2}-1$ no tiene inversa en $\mathbb{R}$ porque $2$ y $-2$ empatan. En
      $(-\infty,0]$ sí. Por eso el enunciado especifica: sin esa restricción,
      tres de los seis apartados no tendrían respuesta.

      ### 2 · El método, y la comprobación que lo acompaña

      Siempre igual: se escribe $y = f(x)$, se **despeja $x$** y se renombran
      las variables.

      Y siempre se comprueba lo mismo:

      $$
      \text{dominio de } f^{-1} = \text{rango de } f
      $$

      Si el dominio que sale no coincide con el rango de la función, hay un
      error en alguno de los dos.

      ### 3 · (a) $f(x) = 1+e^{2x}$ en $\mathbb{R}$

      $$
      y = 1+e^{2x}
      \;\Longrightarrow\;
      e^{2x} = y-1
      \;\Longrightarrow\;
      2x = \ln(y-1)
      $$

      $$
      f^{-1}(x) = \frac{1}{2}\ln(x-1)
      $$

      El logaritmo exige $x-1>0$, así que $D = (1,\infty)$. Y en efecto:
      $e^{2x}>0$ siempre, así que $f$ toma valores estrictamente mayores que 1.
      Coincide ✔

      ### 4 · (b) $f(x) = x^{2}-1$ en $(-\infty,0]$

      $$
      y = x^{2}-1 \;\Longrightarrow\; x = \pm\sqrt{1+y}
      $$

      **Aquí hay que elegir**, y es el apartado que decide el ejercicio. El
      dominio de partida es $(-\infty,0]$: todos los valores son negativos o
      cero. La inversa tiene que devolver valores de ahí, luego el signo es el
      **negativo**:

      $$
      f^{-1}(x) = -\sqrt{1+x}, \qquad D = [-1,\infty)
      $$

      Comprobación: en $(-\infty,0]$ la función $x^{2}-1$ decrece desde
      $+\infty$ hasta $-1$, así que su rango es $[-1,\infty)$ ✔

      ### 5 · (c) y (d), directos

      $$
      y = \ln(x+3) \;\Longrightarrow\; x = e^{y}-3
      \;\Longrightarrow\;
      f^{-1}(x) = e^{x}-3, \qquad D = \mathbb{R}
      $$

      $$
      y = \cos(x-1) \;\Longrightarrow\; x = 1+\arccos y
      \;\Longrightarrow\;
      f^{-1}(x) = 1+\arccos x, \qquad D = [-1,1]
      $$

      En (d) el dominio $[1,\pi+1]$ está elegido para que $x-1$ recorra
      exactamente $[0,\pi]$, que es donde el coseno es inyectivo. Otra vez: el
      dominio no es decorativo.

      ### 6 · (e) y (f), las hiperbólicas

      Las dos se resuelven igual: con el cambio $u = e^{x}$ la ecuación se
      vuelve de segundo grado.

      **(e)** $y = \cosh x = \frac{e^{x}+e^{-x}}{2}$:

      $$
      2y = u+\frac1u
      \;\Longrightarrow\;
      u^{2}-2yu+1 = 0
      \;\Longrightarrow\;
      u = y \pm \sqrt{y^{2}-1}
      $$

      Como $x \ge 0$ implica $u = e^{x} \ge 1$, se toma el signo $+$:

      $$
      f^{-1}(x) = \ln\left(x+\sqrt{x^{2}-1}\right), \qquad D = [1,\infty)
      $$

      El dominio sale del rango: $\cosh$ vale 1 en $x=0$ y crece, y además la
      raíz exige $x^{2} \ge 1$. Las dos condiciones dicen lo mismo ✔

      **(f)** $y = \mathrm{senh}\,x = \frac{e^{x}-e^{-x}}{2}$:

      $$
      u^{2}-2yu-1 = 0
      \;\Longrightarrow\;
      u = y \pm \sqrt{y^{2}+1}
      $$

      Aquí $\sqrt{y^{2}+1} > \left|y\right|$, así que el signo $-$ daría un $u$
      **negativo**, imposible para una exponencial. Se toma el $+$:

      $$
      f^{-1}(x) = \ln\left(x+\sqrt{x^{2}+1}\right), \qquad D = \mathbb{R}
      $$

      Y el dominio es todo $\mathbb{R}$ porque $x^{2}+1$ nunca es negativo: el
      seno hiperbólico es biyectivo de $\mathbb{R}$ en $\mathbb{R}$, sin
      restringir nada.

      ### 7 · La diferencia entre (e) y (f), que es todo el tema

      Las dos ecuaciones de segundo grado se parecen y el signo se elige por
      motivos **distintos**:

      - En (e), porque el dominio de partida obliga a $u \ge 1$.
      - En (f), porque un $u$ negativo sería imposible: $e^{x}>0$ siempre.

      En el primero manda el enunciado; en el segundo, la propia exponencial.

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \text{(a)}\; & \tfrac12\ln(x-1),\; D=(1,\infty) &
      \text{(d)}\; & 1+\arccos x,\; D=[-1,1] \\
      \text{(b)}\; & -\sqrt{1+x},\; D=[-1,\infty) &
      \text{(e)}\; & \ln\!\left(x+\sqrt{x^{2}-1}\right),\; D=[1,\infty) \\
      \text{(c)}\; & e^{x}-3,\; D=\mathbb{R} &
      \text{(f)}\; & \ln\!\left(x+\sqrt{x^{2}+1}\right),\; D=\mathbb{R}
      \end{aligned}}
      $$

  - id: continuidad-parametro-k
    titulo: Dos parámetros para pegar dos trozos
    fuente: >-
      Ejercicio 3.3 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Determinar $k \in \mathbb{R}$ para que las siguientes funciones sean
      continuas:

      **(a)**
      $f(x) = \begin{cases} x^{2}, & x<1 \\ kx-3, & x\ge1 \end{cases}$
      · **(b)**
      $g(x) = \begin{cases} k^{2}x^{2}, & x\le2 \\ (1-k)x, & x>2 \end{cases}$
    pide: Determinar el valor de $k$ en los dos casos.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde se juega la continuidad de una función a trozos?
        opciones:
          - texto: >-
              Solo en los **puntos de empalme**: dentro de cada trozo ya es
              continua por ser un polinomio
            correcta: true
            mensaje: |
              Eso es. Los polinomios son continuos en todo $\mathbb{R}$, así que
              el único sitio donde puede romperse es la frontera entre trozos.
              Todo el ejercicio se reduce a igualar los límites laterales ahí.
          - texto: En todo el dominio, punto por punto
            mensaje: |
              Sería agotador e innecesario. Dentro de cada trozo la función es
              un polinomio, y los polinomios son continuos siempre. Solo hay que
              mirar la costura.
          - texto: En los puntos donde la función vale cero
            mensaje: |
              Los ceros no tienen nada que ver con la continuidad. Una función
              puede valer cero y ser continua, o no valer nunca cero y tener un
              salto.
          - texto: En los extremos del dominio
            mensaje: |
              Aquí el dominio es todo $\mathbb{R}$ y no tiene extremos. El punto
              crítico es interno: donde cambia la fórmula.

      - tipo: calcular
        titulo: Apartado (a)
        pregunta: |
          ¿Para qué valor de $k$ es continua la primera función?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 saldría de $k-3 = -1$. Pero el límite por la izquierda es
              $1^{2} = 1$, no $-1$. La ecuación es $1 = k-3$.
          - valor: '-2'
            mensaje: |
              Signo cambiado al despejar. De $1 = k-3$ se pasa el 3 sumando:
              $k = 4$.
          - valor: '3'
            mensaje: |
              3 es el término independiente del segundo trozo. Hay que
              **resolver** la ecuación $1 = k-3$, no leer un coeficiente.
        pista: |
          Iguala el límite por la izquierda en $x=1$ con el valor por la
          derecha.
        desarrollo: |
          El único punto conflictivo es $x=1$.

          **Límite por la izquierda** —donde manda $x^{2}$—:

          $$
          \lim_{x\to1^{-}} f(x) = 1^{2} = 1
          $$

          **Valor y límite por la derecha** —donde manda $kx-3$—:

          $$
          f(1) = \lim_{x\to1^{+}} f(x) = k-3
          $$

          Para que sea continua los tres tienen que coincidir:

          $$
          1 = k-3 \;\Longrightarrow\; k = 4
          $$

          Comprobación: con $k=4$, el segundo trozo en $x=1$ vale
          $4-3 = 1$ ✔
        veredicto: |
          Fíjate en que $f(1)$ se calcula con el **segundo** trozo, porque el
          enunciado pone ahí el $\ge$. Ese detalle decide de qué lado está el
          punto.

      - tipo: calcular
        titulo: Apartado (b), el que tiene dos soluciones
        pregunta: |
          ¿Cuál es el valor **negativo** de $k$ que hace continua la segunda
          función?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              $\frac12$ **también** es solución, pero es la positiva. El
              enunciado del paso pide la negativa. Que haya dos es lo
              característico de este apartado: la ecuación es de segundo grado.
          - valor: '-0.5'
            mensaje: |
              Las dos soluciones son $-1$ y $+\frac12$. De
              $2k^{2}+k-1 = 0$ salen esas dos, no $-\frac12$.
          - valor: '1'
            mensaje: |
              Con $k=1$ el segundo trozo sería $(1-1)x = 0$, y el primero
              valdría $4$ en $x=2$. No pegan.
        pista: |
          Iguala en $x=2$: $4k^{2} = 2(1-k)$. Sale una ecuación de segundo
          grado.
        desarrollo: |
          El punto de empalme es $x=2$.

          $$
          \lim_{x\to2^{-}} g(x) = g(2) = k^{2}\cdot 4 = 4k^{2}
          $$

          $$
          \lim_{x\to2^{+}} g(x) = (1-k)\cdot 2 = 2-2k
          $$

          Igualando:

          $$
          4k^{2} = 2-2k
          \;\Longleftrightarrow\;
          4k^{2}+2k-2 = 0
          \;\Longleftrightarrow\;
          2k^{2}+k-1 = 0
          $$

          $$
          k = \frac{-1\pm\sqrt{1+8}}{4} = \frac{-1\pm3}{4}
          \;\Longrightarrow\;
          k = \frac12 \;\text{ o }\; k = -1
          $$

          Las **dos** valen. La negativa es $k=-1$.
        veredicto: |
          Que la $k$ aparezca al cuadrado es lo que multiplica las soluciones.
          Dar solo una es medio apartado.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Dentro de cada trozo la función es un polinomio, y los polinomios
              son continuos en todo $\mathbb{R}$: el único punto conflictivo es
              el empalme.
          - texto: |
              Continuidad en un punto significa tres cosas: que exista el valor,
              que exista el límite y que **coincidan**. En un empalme, que
              exista el límite equivale a que los dos laterales sean iguales.
          - texto: |
              **(a)** En $x=1$: $\lim_{x\to1^{-}} = 1$ y $f(1) = k-3$. De
              $1 = k-3$ sale $k=4$, único.
          - texto: |
              **(b)** En $x=2$: $4k^{2} = 2-2k$, es decir $2k^{2}+k-1 = 0$, con
              **dos** soluciones: $k=-1$ y $k=\frac12$.
          - texto: |
              Como en (b) hay dos valores de $k$, hay **dos** funciones
              continuas distintas, y las dos son respuesta válida.
          - texto: |
              En (b) hay que quedarse con $k=\frac12$, porque $k$ debe ser
              positivo para que $k^{2}x^{2}$ tenga sentido.
            trampa: true
            mensaje: |
              $k^{2}$ es no negativo **sea cual sea el signo de $k$**: ese es el
              efecto de elevar al cuadrado. No hay ninguna razón para descartar
              $k=-1$, y el enunciado tampoco la da. Inventarse una restricción
              para quedarse con una sola solución es perder media respuesta.
        veredicto: |
          Cuando el parámetro aparece elevado al cuadrado hay que esperar más de
          una solución, y hay que darlas todas salvo que el enunciado descarte
          alguna.

    resolucion: |
      **Datos.** Dos funciones a trozos con un parámetro $k$. Se pide el valor
      de $k$ que las hace continuas.

      ### 1 · Dónde se juega el ejercicio

      Los polinomios son continuos en todo $\mathbb{R}$, así que dentro de cada
      trozo no hay nada que discutir. **El único punto conflictivo es el
      empalme**, y todo el ejercicio se reduce a lo que pasa ahí.

      Continuidad en un punto $a$ significa tres cosas:

      $$
      \exists f(a), \qquad \exists \lim_{x\to a} f(x), \qquad
      \lim_{x\to a} f(x) = f(a)
      $$

      Y en un empalme, que el límite exista equivale a que **los dos laterales
      coincidan**.

      ### 2 · Apartado (a)

      El empalme es $x=1$. Conviene fijarse en de qué lado cae el punto: el
      enunciado pone $x \ge 1$ en el segundo trozo, así que **$f(1)$ se calcula
      con $kx-3$**.

      $$
      \lim_{x\to1^{-}} f(x) = \lim_{x\to1^{-}} x^{2} = 1
      $$

      $$
      \lim_{x\to1^{+}} f(x) = f(1) = k\cdot1-3 = k-3
      $$

      Igualando:

      $$
      1 = k-3 \;\Longrightarrow\; \boxed{k = 4}
      $$

      Es una ecuación de primer grado y tiene **una** solución.

      ### 3 · Apartado (b)

      El empalme es $x=2$, y aquí el punto cae en el **primer** trozo, porque
      lleva el $\le$.

      $$
      \lim_{x\to2^{-}} g(x) = g(2) = k^{2}\cdot 2^{2} = 4k^{2}
      $$

      $$
      \lim_{x\to2^{+}} g(x) = (1-k)\cdot 2 = 2-2k
      $$

      Igualando:

      $$
      4k^{2} = 2-2k
      \;\Longleftrightarrow\;
      4k^{2}+2k-2 = 0
      \;\Longleftrightarrow\;
      2k^{2}+k-1 = 0
      $$

      $$
      k = \frac{-1\pm\sqrt{1+8}}{4} = \frac{-1\pm3}{4}
      $$

      $$
      \boxed{k = \frac12 \quad\text{y}\quad k = -1}
      $$

      **Las dos son válidas**, y hay que darlas las dos. El parámetro aparece
      elevado al cuadrado, así que la ecuación es de segundo grado y no hay
      ninguna condición en el enunciado que descarte la negativa.

      ### 4 · Comprobación

      **(a)** con $k=4$: el primer trozo tiende a 1 y el segundo vale
      $4-3 = 1$ ✔

      **(b)** con $k=\frac12$: primer trozo $4\cdot\frac14 = 1$; segundo
      $\left(1-\frac12\right)\cdot2 = 1$ ✔

      **(b)** con $k=-1$: primer trozo $4\cdot1 = 4$; segundo
      $\left(1+1\right)\cdot2 = 4$ ✔

      Las dos pegan, en alturas distintas: con $k=\frac12$ la función pasa por
      $(2,1)$ y con $k=-1$ por $(2,4)$. Son dos funciones continuas diferentes,
      y el enunciado no pide elegir.

      ### Resultado

      $$
      \boxed{\;\text{(a) } k = 4
      \qquad\qquad
      \text{(b) } k = -1 \;\text{ y }\; k = \tfrac12\;}
      $$

  - id: limite-que-no-existe
    titulo: Dos sucesiones que discrepan
    fuente: >-
      Ejercicio 3.4 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU ·
      Cayó en 2018/2019 3E
    nivel: practica
    enunciado: |
      Estudiar el límite de la función $f(x) = \cos\left(\frac{\pi}{x}\right)$
      en el punto $x=0$ utilizando las sucesiones
      $\{a_n\}_{n\in\mathbb{N}} = \left\{\frac{1}{2n}\right\}$ y
      $\{b_n\}_{n\in\mathbb{N}} = \left\{\frac{2}{2n+1}\right\}$.
    pide: Estudiar si existe el límite en $x=0$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el enunciado regala **dos** sucesiones y no una?
        opciones:
          - texto: >-
              Porque para demostrar que un límite **no existe** hacen falta dos
              caminos que discrepen
            correcta: true
            mensaje: |
              Exacto. Con una sola sucesión no se prueba nada: el límite podría
              existir y valer eso. Lo que refuta la existencia es encontrar
              **dos** formas de acercarse a 0 cuyas imágenes tiendan a cosas
              distintas.
          - texto: Porque una sola no tiende a cero
            mensaje: |
              Las dos tienden a cero: $\frac{1}{2n} \to 0$ y
              $\frac{2}{2n+1} \to 0$. Esa es la condición para poder usarlas, y
              las dos la cumplen.
          - texto: Para calcular el límite por la izquierda y por la derecha
            mensaje: |
              Las dos sucesiones son **positivas**, así que las dos se acercan a
              0 por la derecha. La discrepancia no es entre lados, es entre
              caminos distintos por el mismo lado.
          - texto: Para comprobar el resultado dos veces
            mensaje: |
              No es una comprobación: es el argumento entero. Si las dos dieran
              lo mismo no se habría demostrado nada.

      - tipo: calcular
        titulo: El primer camino
        pregunta: |
          ¿A qué tiende $f(a_n) = \cos\left(\frac{\pi}{1/(2n)}\right)$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              0 es lo que da la **otra** sucesión, $b_n$. Con $a_n$ el argumento
              del coseno es $2\pi n$, un múltiplo entero de $2\pi$, y ahí el
              coseno vale 1.
          - valor: '-1'
            mensaje: |
              $-1$ sería $\cos(\pi n)$ con $n$ impar. Aquí el argumento es
              $2\pi n$, siempre múltiplo **par** de $\pi$.
          - valor: '3.141593'
            mensaje: |
              $\pi$ es el argumento antes de dividir, no el valor del coseno. Hay
              que sustituir y evaluar.
        pista: |
          $\frac{\pi}{1/(2n)} = 2\pi n$. ¿Cuánto vale el coseno de un múltiplo
          entero de $2\pi$?
        desarrollo: |
          $$
          \frac{\pi}{a_n} = \frac{\pi}{\frac{1}{2n}} = 2\pi n
          $$

          $$
          f(a_n) = \cos(2\pi n) = 1 \qquad \text{para todo } n
          $$

          No es que tienda a 1: **vale exactamente 1 siempre**. Así que la
          sucesión de imágenes es constante y su límite es 1.
        veredicto: |
          La sucesión $a_n$ está elegida para caer justo en los máximos del
          coseno. La otra caerá justo en sus ceros.

      - tipo: calcular
        titulo: El segundo camino
        pregunta: |
          ¿A qué tiende $f(b_n)$ con $b_n = \frac{2}{2n+1}$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es lo que daba $a_n$. Con $b_n$ el argumento es
              $\frac{(2n+1)\pi}{2}$, que es un múltiplo **impar** de
              $\frac{\pi}{2}$: ahí el coseno se anula.
          - valor: '-1'
            mensaje: |
              $-1$ requeriría un argumento múltiplo impar de $\pi$. Aquí el
              argumento es $\frac{\pi}{2}$, $\frac{3\pi}{2}$, $\frac{5\pi}{2}$…
              y en todos ellos el coseno vale 0.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es $\cos\frac{\pi}{3}$, que no aparece aquí. Sustituye
              y simplifica: el argumento sale $\frac{(2n+1)\pi}{2}$.
        pista: |
          $\frac{\pi}{2/(2n+1)} = \frac{(2n+1)\pi}{2}$. Evalúa el coseno ahí.
        desarrollo: |
          $$
          \frac{\pi}{b_n} = \frac{\pi}{\frac{2}{2n+1}} = \frac{(2n+1)\pi}{2}
          $$

          Con $n=1,2,3,\dots$ el argumento es
          $\frac{3\pi}{2}$, $\frac{5\pi}{2}$, $\frac{7\pi}{2}$… todos múltiplos
          **impares** de $\frac{\pi}{2}$, y ahí el coseno vale 0:

          $$
          f(b_n) = 0 \qquad \text{para todo } n
          $$
        veredicto: |
          Otra sucesión constante, esta vez en 0. Dos caminos hacia el mismo
          punto y dos destinos distintos.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Herramienta.** Si $\lim_{x\to a} f(x) = L$, entonces para
              **toda** sucesión $x_n \to a$ con $x_n \neq a$ se cumple
              $f(x_n) \to L$.
          - texto: |
              Las dos sucesiones cumplen la hipótesis: $a_n \to 0$ y
              $b_n \to 0$, y ninguna vale 0.
          - texto: |
              $f(a_n) = \cos(2\pi n) = 1$ para todo $n$, luego
              $f(a_n) \to 1$.
          - texto: |
              $f(b_n) = \cos\frac{(2n+1)\pi}{2} = 0$ para todo $n$, luego
              $f(b_n) \to 0$.
          - texto: |
              Si el límite existiera, las dos sucesiones de imágenes tendrían
              que tender a **él**, y por unicidad del límite $1 = 0$: absurdo.
              **El límite no existe.**
          - texto: |
              Como las dos sucesiones dan valores distintos, el límite vale la
              media de los dos, $\frac12$.
            trampa: true
            mensaje: |
              Los límites no promedian. Si dos caminos dan resultados distintos,
              la conclusión es que **no hay límite**, no que valga algo
              intermedio. La definición exige que **todos** los caminos den lo
              mismo, y aquí ya hay dos que no.
        veredicto: |
          El argumento no necesita dibujar la función. Un dibujo sugiere que
          oscila; dos sucesiones lo demuestran.

    resolucion: |
      **Datos.** $f(x) = \cos\left(\frac{\pi}{x}\right)$ y el punto $x=0$. Se
      dan las sucesiones $a_n = \frac{1}{2n}$ y $b_n = \frac{2}{2n+1}$.

      ### 1 · La herramienta, y por qué el enunciado da dos sucesiones

      La caracterización del límite por sucesiones dice:

      $$
      \lim_{x\to a} f(x) = L
      \iff
      \forall \{x_n\} \text{ con } x_n \to a,\ x_n \neq a:\quad f(x_n) \to L
      $$

      Léase el «para toda»: el límite existe solo si **todos** los caminos
      llevan al mismo sitio. En contrapositivo, para demostrar que **no**
      existe basta exhibir **dos** sucesiones cuyas imágenes discrepen.

      Por eso el enunciado da dos: una sola no demostraría nada.

      Lo primero, comprobar que las dos son admisibles:

      $$
      a_n = \frac{1}{2n} \to 0, \qquad b_n = \frac{2}{2n+1} \to 0
      $$

      y ninguna vale 0, así que $f$ está definida en todos sus términos —el
      punto $x=0$ es justamente donde no lo está—.

      ### 2 · El primer camino

      $$
      \frac{\pi}{a_n} = \frac{\pi}{\frac{1}{2n}} = 2\pi n
      $$

      $$
      f(a_n) = \cos(2\pi n) = 1 \qquad \forall n \in \mathbb{N}
      $$

      La sucesión de imágenes es **constante igual a 1**, así que su límite es 1.

      ### 3 · El segundo camino

      $$
      \frac{\pi}{b_n} = \frac{\pi(2n+1)}{2}
      $$

      Los valores son $\frac{3\pi}{2}$, $\frac{5\pi}{2}$, $\frac{7\pi}{2}$…:
      todos múltiplos **impares** de $\frac{\pi}{2}$, y ahí el coseno se anula.

      $$
      f(b_n) = 0 \qquad \forall n \in \mathbb{N}
      $$

      Su límite es 0.

      ### 4 · Conclusión

      Si el límite de $f$ en 0 existiera y valiera $L$, las dos sucesiones de
      imágenes tendrían que converger a $L$. Pero una converge a 1 y la otra a
      0, y por la **unicidad del límite** eso obligaría a $1 = 0$.

      $$
      \boxed{\;\text{El límite } \lim_{x\to0}\cos\frac{\pi}{x} \text{ no existe}\;}
      $$

      ### 5 · Qué está pasando de verdad

      Conviene decirlo, porque explica por qué el ejercicio funciona: cuando
      $x \to 0^{+}$, el argumento $\frac{\pi}{x}$ se va a $+\infty$, y el coseno
      **oscila cada vez más rápido** entre $-1$ y 1 sin estabilizarse.

      Las dos sucesiones del enunciado están elegidas para caer siempre en el
      mismo sitio de esa oscilación: $a_n$ en los máximos y $b_n$ en los ceros.
      De hecho, escogiendo bien la sucesión se puede hacer que las imágenes
      tiendan a **cualquier** valor de $[-1,1]$.

      ### 6 · Comprobación

      Los primeros términos, para ver que no es un artificio asintótico sino que
      ocurre desde el principio:

      | $n$ | $a_n$ | $f(a_n)$ | $b_n$ | $f(b_n)$ |
      |---|---|---|---|---|
      | 1 | $0{,}5$ | $\cos 2\pi = 1$ | $0{,}667$ | $\cos\frac{3\pi}{2} = 0$ |
      | 2 | $0{,}25$ | $\cos 4\pi = 1$ | $0{,}4$ | $\cos\frac{5\pi}{2} = 0$ |
      | 3 | $0{,}167$ | $\cos 6\pi = 1$ | $0{,}286$ | $\cos\frac{7\pi}{2} = 0$ |

      Las dos columnas de $x$ bajan hacia 0 y las dos de $f$ se quedan clavadas
      en valores distintos ✔

  - id: bolzano-raiz-unica
    titulo: Una raíz que existe, y que además es la única
    fuente: >-
      Ejercicio 3.5 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU ·
      Cayó en 2016/2017 5E
    nivel: practica
    enunciado: |
      Demostrar que la función $y(x) = xe^{x}-1$ tiene al menos una raíz real
      positiva. ¿Tiene alguna raíz más?
    pide: Demostrar que hay una raíz positiva y decidir si hay más.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué teorema garantiza que una función continua tiene una raíz?
        opciones:
          - texto: >-
              El de **Bolzano**: si es continua y cambia de signo en un
              intervalo, se anula dentro
            correcta: true
            mensaje: |
              Eso es. Bolzano es un teorema de **existencia**: dice que la raíz
              está ahí, no dónde. Sus dos hipótesis son continuidad en el
              intervalo cerrado y signos opuestos en los extremos.
          - texto: El de Rolle
            mensaje: |
              Rolle habla de dónde se anula la **derivada**, no la función, y
              exige que la función valga lo mismo en los dos extremos. Es otro
              teorema.
          - texto: El del valor medio
            mensaje: |
              El del valor medio da un punto donde la derivada iguala a la
              pendiente media. Tampoco garantiza raíces de la función.
          - texto: El fundamental del álgebra
            mensaje: |
              Ese cuenta raíces de **polinomios**, y $xe^{x}-1$ no lo es: tiene
              una exponencial. Además contaría raíces complejas, y aquí se
              piden reales.

      - tipo: calcular
        titulo: El extremo derecho del intervalo
        pregunta: |
          Para aplicar Bolzano se toma el intervalo $[0,b]$. ¿Cuál es el menor
          entero $b$ que sirve?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '0'
            mensaje: |
              En $x=0$ la función vale $-1$, negativo igual que en el extremo
              izquierdo. Un intervalo degenerado no sirve: hacen falta **signos
              opuestos** en los dos extremos.
          - valor: '2'
            mensaje: |
              Con $b=2$ también funciona —$y(2) = 2e^{2}-1 \approx 13{,}8 > 0$—,
              pero se pide el **menor** entero, y con $b=1$ ya cambia el signo.
          - valor: '-1'
            mensaje: |
              El enunciado pide una raíz **positiva**, así que el intervalo tiene
              que estar en el semieje positivo. Además $y(-1) = -e^{-1}-1 < 0$,
              del mismo signo que $y(0)$.
        pista: |
          $y(0) = -1$. Busca el primer entero donde $y$ se haga positiva.
          Recuerda que $e \approx 2{,}72$.
        desarrollo: |
          $$
          y(0) = 0\cdot e^{0}-1 = -1 < 0
          $$

          $$
          y(1) = 1\cdot e^{1}-1 = e-1 \approx 1{,}718 > 0
          $$

          Hay cambio de signo en $[0,1]$, así que ese intervalo ya sirve y $b=1$
          es el menor entero posible.
        veredicto: |
          Bolzano no dice dónde está la raíz dentro de $(0,1)$. Solo dice que
          está. Para localizarla harían falta métodos numéricos.

      - tipo: justificar
        pregunta: |
          Ordena la demostración completa. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Continuidad.** $y(x) = xe^{x}-1$ es producto y suma de funciones
              continuas en todo $\mathbb{R}$, así que es continua en $[0,1]$.
          - texto: |
              **Cambio de signo.** $y(0) = -1 < 0$ y
              $y(1) = e-1 \approx 1{,}72 > 0$.
          - texto: |
              Por el **teorema de Bolzano** existe $c \in (0,1)$ con $y(c) = 0$:
              hay al menos una raíz, y es positiva.
          - texto: |
              **Para la unicidad** se mira la derivada:
              $y'(x) = e^{x}+xe^{x} = e^{x}(1+x)$.
          - texto: |
              Para $x>-1$ se tiene $e^{x}>0$ y $1+x>0$, luego $y'(x)>0$: la
              función es **estrictamente creciente** ahí y no puede cortar el eje
              dos veces. La raíz es única en $(-1,\infty)$, y para
              $x \le -1$ la función es negativa. **La raíz es única.**
          - texto: |
              Como Bolzano garantiza una raíz en $(0,1)$, y la función es
              continua en todo $\mathbb{R}$, hay una raíz en cada intervalo.
            trampa: true
            mensaje: |
              Bolzano necesita **cambio de signo**, no solo continuidad. En un
              intervalo donde la función no cambie de signo el teorema no dice
              nada, y de hecho aquí no hay ninguna otra raíz. Continuidad sola
              no produce raíces.
        veredicto: |
          Existencia y unicidad son dos preguntas con dos herramientas
          distintas: Bolzano para la primera, la monotonía para la segunda.

    resolucion: |
      **Datos.** $y(x) = xe^{x}-1$. Hay que demostrar que tiene al menos una
      raíz real positiva y decidir si tiene más.

      ### 1 · La herramienta y sus hipótesis

      El **teorema de Bolzano**: si $f$ es continua en $[a,b]$ y
      $f(a)\cdot f(b) < 0$, entonces existe $c \in (a,b)$ con $f(c) = 0$.

      Es un teorema de **existencia**: garantiza que la raíz está, no dónde.
      Antes de usarlo hay que comprobar sus dos hipótesis, y eso es la mitad de
      la nota.

      ### 2 · Continuidad

      $y(x) = xe^{x}-1$ es producto y suma de funciones continuas en todo
      $\mathbb{R}$ —un polinomio y una exponencial—, así que es continua en
      cualquier intervalo cerrado. En particular en $[0,1]$.

      ### 3 · Cambio de signo

      $$
      y(0) = 0\cdot e^{0}-1 = -1 < 0
      $$

      $$
      y(1) = 1\cdot e^{1}-1 = e-1 \approx 1{,}718 > 0
      $$

      Los dos extremos tienen signos opuestos.

      ### 4 · Conclusión de existencia

      Por Bolzano, existe $c \in (0,1)$ con $y(c) = 0$. Como $c>0$, **la raíz es
      positiva**, que es lo que se pedía. $\blacksquare$

      ### 5 · ¿Hay alguna más?

      Bolzano dice «al menos una». Para saber si es **exactamente una** hace
      falta otro argumento, y el habitual es la monotonía.

      $$
      y'(x) = e^{x}+x e^{x} = e^{x}(1+x)
      $$

      Como $e^{x}>0$ siempre, el signo de $y'$ es el de $1+x$:

      | intervalo | signo de $y'$ | comportamiento |
      |---|---|---|
      | $x < -1$ | negativo | decreciente |
      | $x > -1$ | positivo | creciente |

      En $(-1,\infty)$ la función es **estrictamente creciente**, así que corta
      el eje como mucho una vez: la raíz $c$ es única ahí.

      Y en $(-\infty,-1]$ no hay ninguna. El mínimo de $y$ está en $x=-1$ y
      vale

      $$
      y(-1) = -e^{-1}-1 \approx -1{,}37 < 0
      $$

      Como en ese tramo la función decrece hacia $y(-1)$ y
      $\lim_{x\to-\infty} xe^{x} = 0$, allí $y$ se acerca a $-1$ por arriba sin
      llegar nunca a cero: **siempre negativa**.

      $$
      \boxed{\;\text{Hay exactamente una raíz real, y está en } (0,1)\;}
      $$

      ### 6 · Comprobación

      Acotando la raíz un poco más, para ver que el argumento es sólido:

      | $x$ | $y(x) = xe^{x}-1$ |
      |---|---|
      | $0{,}5$ | $0{,}5\cdot1{,}649-1 = -0{,}176 < 0$ |
      | $0{,}6$ | $0{,}6\cdot1{,}822-1 = +0{,}093 > 0$ |

      La raíz está entre $0{,}5$ y $0{,}6$. Bolzano vuelve a aplicarse en ese
      intervalo más pequeño, y ese es justamente el fundamento del método de
      bisección.

      Y la unicidad se ve en la tabla: entre $0{,}5$ y $0{,}6$ la función sube,
      y sigue subiendo después. No vuelve a bajar nunca.

  - id: continuidad-y-derivabilidad-trozos
    titulo: Continua en dos puntos, derivable solo en uno
    fuente: >-
      Ejercicio 3.6 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Sea la función

      $$
      f(x) = \begin{cases}
      0 & x \le -1 \\[4pt]
      ax^{3}+bx & -1 < x < 2 \\[4pt]
      11x-16 & x \ge 2
      \end{cases}
      $$

      **(a)** Determinar $a$ y $b$ para que $f$ sea continua.

      **(b)** Estudiar la derivabilidad de $f$.
    pide: Determinar $a$ y $b$, y estudiar dónde es derivable.

    pasos:
      - tipo: reconocer
        pregunta: |
          Hay dos empalmes y dos incógnitas. ¿Es casualidad?
        opciones:
          - texto: >-
              No: cada empalme da **una ecuación**, y con dos ecuaciones se
              determinan las dos incógnitas
            correcta: true
            mensaje: |
              Eso es. La continuidad en $x=-1$ da una ecuación y la continuidad
              en $x=2$ da otra. Dos ecuaciones, dos incógnitas: el sistema queda
              determinado y el apartado (a) tiene solución única.
          - texto: Sí, y por eso hay infinitas soluciones
            mensaje: |
              Con dos condiciones independientes y dos incógnitas la solución es
              única. Habría infinitas si sobraran incógnitas, y aquí no sobran.
          - texto: >-
              No, porque la derivabilidad también aporta ecuaciones
            mensaje: |
              La derivabilidad se **estudia** en el apartado (b), no se impone.
              El enunciado no pide que $f$ sea derivable: pregunta dónde lo es,
              que es distinto.
          - texto: Sí, y el sistema es incompatible
            mensaje: |
              No lo es: las dos ecuaciones son compatibles y dan $a=1$, $b=-1$.
              Basta resolverlo para verlo.

      - tipo: calcular
        titulo: El primer parámetro
        pregunta: |
          ¿Cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '-1'
            mensaje: |
              $-1$ es el valor de $b$, no el de $a$. Del sistema
              $-a-b = 0$ y $8a+2b = 6$ sale $a=1$ y $b=-1$.
          - valor: '11'
            mensaje: |
              11 es la pendiente del tercer trozo, un dato del enunciado. Hay que
              **resolver** el sistema, no leer un coeficiente.
          - valor: '0'
            mensaje: |
              Con $a=0$ el segundo trozo sería $bx$, una recta, y en $x=2$
              valdría $2b$. De $2b = 6$ saldría $b=3$, pero entonces en $x=-1$
              el trozo valdría $-3 \neq 0$. No pega.
        pista: |
          Continuidad en $x=-1$ da $-a-b = 0$; en $x=2$ da $8a+2b = 6$.
        desarrollo: |
          **Empalme en $x=-1$.** El primer trozo vale 0 y el segundo tiende a
          $a(-1)^{3}+b(-1) = -a-b$:

          $$
          -a-b = 0 \;\Longleftrightarrow\; b = -a
          $$

          **Empalme en $x=2$.** El segundo trozo tiende a $8a+2b$ y el tercero
          vale $11\cdot2-16 = 6$:

          $$
          8a+2b = 6
          $$

          Sustituyendo $b=-a$:

          $$
          8a-2a = 6 \;\Longrightarrow\; 6a = 6 \;\Longrightarrow\; a = 1
          $$

          y por tanto $b = -1$. El trozo central es $x^{3}-x$.
        veredicto: |
          Con $a=1$ y $b=-1$ el segundo trozo es $x^{3}-x$, que en $x=-1$ vale
          $-1+1 = 0$ ✔ y en $x=2$ vale $8-2 = 6$ ✔.

      - tipo: calcular
        titulo: La derivada por la izquierda en el punto malo
        pregunta: |
          En $x=-1$, ¿cuánto vale la derivada por la **derecha**, es decir la
          del trozo $x^{3}-x$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              0 es la derivada por la **izquierda**, la del trozo constante. La
              de la derecha sale de $3x^{2}-1$ evaluada en $-1$.
          - valor: '-2'
            mensaje: |
              Signo cambiado. $3(-1)^{2}-1 = 3-1 = 2$: el cuadrado hace positivo
              el $-1$.
          - valor: '4'
            mensaje: |
              4 saldría de $3+1$. La derivada de $x^{3}-x$ es $3x^{2}-1$, con
              un **menos** delante del 1.
        pista: |
          La derivada de $x^{3}-x$ es $3x^{2}-1$. Evalúala en $x=-1$.
        desarrollo: |
          $$
          \left(x^{3}-x\right)' = 3x^{2}-1
          $$

          En $x=-1$:

          $$
          3(-1)^{2}-1 = 3-1 = 2
          $$

          Mientras que por la izquierda la función es constante, y su derivada
          es 0.

          $$
          f'(-1^{-}) = 0 \neq 2 = f'(-1^{+})
          $$

          **No es derivable en $x=-1$**: ahí hay un pico.
        veredicto: |
          Continua y no derivable a la vez. Los dos trozos se tocan pero llegan
          con pendientes distintas.

      - tipo: justificar
        pregunta: |
          Ordena el estudio de la derivabilidad. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              Con $a=1$ y $b=-1$ la función es $0$, $x^{3}-x$ y $11x-16$ en los
              tres tramos, y ya es continua en todo $\mathbb{R}$.
          - texto: |
              Dentro de cada tramo es derivable por ser un polinomio: los únicos
              puntos que hay que mirar son $x=-1$ y $x=2$.
          - texto: |
              **En $x=-1$:** por la izquierda la derivada es 0 y por la derecha
              $3(-1)^{2}-1 = 2$. Distintas, luego **no es derivable**.
          - texto: |
              **En $x=2$:** por la izquierda $3\cdot4-1 = 11$ y por la derecha
              la pendiente de la recta, también 11. Coinciden, luego **sí es
              derivable**.
          - texto: |
              Como $f$ es continua en $x=-1$, también es derivable ahí.
            trampa: true
            mensaje: |
              La implicación va **solo en un sentido**: derivable implica
              continua, nunca al revés. Este mismo ejercicio es el contraejemplo:
              en $x=-1$ es continua y no derivable. El valor absoluto en 0 es el
              otro ejemplo de siempre.
        veredicto: |
          Que en $x=2$ la derivada salga exactamente 11 no es casualidad: el
          enunciado eligió esa pendiente para que uno de los dos empalmes fuera
          suave y el otro no.

    resolucion: |
      **Datos.** Una función definida en tres tramos con dos parámetros. Se pide
      hacerla continua y estudiar dónde es derivable.

      ### 1 · Apartado (a): dos empalmes, dos ecuaciones

      Dentro de cada tramo la función es un polinomio, así que es continua ahí
      sin más. Los únicos puntos conflictivos son $x=-1$ y $x=2$.

      **En $x=-1$**, el punto pertenece al primer tramo —lleva el $\le$—, así
      que $f(-1) = 0$. Y el segundo tramo tiende a

      $$
      \lim_{x\to-1^{+}}\left(ax^{3}+bx\right) = -a-b
      $$

      $$
      -a-b = 0 \;\Longleftrightarrow\; b = -a
      $$

      **En $x=2$**, el punto pertenece al tercer tramo, así que
      $f(2) = 11\cdot2-16 = 6$. Y el segundo tiende a

      $$
      \lim_{x\to2^{-}}\left(ax^{3}+bx\right) = 8a+2b
      $$

      $$
      8a+2b = 6
      $$

      **El sistema.** Sustituyendo $b=-a$ en la segunda:

      $$
      8a-2a = 6 \;\Longrightarrow\; 6a = 6 \;\Longrightarrow\; a = 1,
      \quad b = -1
      $$

      $$
      \boxed{a = 1, \qquad b = -1}
      $$

      Dos condiciones y dos incógnitas: la solución es única. El tramo central
      queda $x^{3}-x$.

      ### 2 · Apartado (b): la derivabilidad se estudia, no se impone

      Conviene subrayarlo porque cambia el ejercicio: el enunciado **no** pide
      que $f$ sea derivable. Pregunta dónde lo es. Los parámetros ya están
      fijados por la continuidad, y ahora solo hay que mirar qué sale.

      Dentro de cada tramo es derivable por ser polinómica. Quedan los dos
      empalmes.

      ### 3 · En $x=-1$: no derivable

      $$
      f'(-1^{-}) = 0
      \qquad\text{(el trozo constante)}
      $$

      $$
      f'(-1^{+}) = \left.3x^{2}-1\right|_{x=-1} = 3-1 = 2
      $$

      Las derivadas laterales no coinciden, así que **no es derivable en
      $x=-1$**. Geométricamente: los dos trozos se tocan, pero uno llega
      horizontal y el otro subiendo con pendiente 2. Hay un **pico**.

      ### 4 · En $x=2$: sí derivable

      $$
      f'(2^{-}) = \left.3x^{2}-1\right|_{x=2} = 12-1 = 11
      $$

      $$
      f'(2^{+}) = 11
      \qquad\text{(la pendiente de la recta)}
      $$

      Coinciden, así que **sí es derivable en $x=2$**, con $f'(2) = 11$. Ahí la
      cúbica y la recta se empalman **suavemente**: la recta es justamente la
      tangente a la cúbica en ese punto.

      ### 5 · Lo que enseña el contraste

      El mismo ejercicio tiene los dos casos, y esa es su gracia:

      | punto | continua | derivable |
      |---|---|---|
      | $x=-1$ | sí | **no** |
      | $x=2$ | sí | sí |

      **Continua no implica derivable.** La implicación va solo en el otro
      sentido. Y este ejercicio lo demuestra sin necesidad de recurrir al valor
      absoluto, que es el ejemplo de siempre.

      ### 6 · Comprobación

      Los valores en los empalmes, con $a=1$ y $b=-1$:

      | | tramo izquierdo | tramo derecho | ¿pega? |
      |---|---|---|---|
      | $x=-1$, valor | $0$ | $(-1)^{3}-(-1) = 0$ | ✔ |
      | $x=-1$, pendiente | $0$ | $2$ | ✗ pico |
      | $x=2$, valor | $8-2 = 6$ | $22-16 = 6$ | ✔ |
      | $x=2$, pendiente | $11$ | $11$ | ✔ suave |

      Y una comprobación de coherencia: si la recta $11x-16$ es tangente a
      $x^{3}-x$ en $x=2$, debe pasar por el punto $(2,6)$ y tener la pendiente
      de la cúbica ahí. $11\cdot2-16 = 6$ ✔ y $3\cdot4-1 = 11$ ✔.

      ### Resultado

      $$
      \boxed{\;\text{(a) } a=1,\; b=-1
      \qquad
      \text{(b) no derivable en } x=-1;\ \text{derivable en } x=2\;}
      $$

  - id: derivada-por-definicion
    titulo: Dos derivadas calculadas como manda la definición
    fuente: >-
      Ejercicio 3.7 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU ·
      El apartado (a) cayó en 2016/2017 3E
    nivel: practica
    enunciado: |
      **(a)** Demostrar que la derivada de la función $f(x) = x$ es
      $f'(x) = 1$.

      **(b)** Demostrar que la derivada de la función $f(x) = x^{3}$ es
      $f'(x) = 3x^{2}$.
    pide: Demostrar las dos derivadas por definición.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice «demostrar». ¿Qué excluye eso?
        opciones:
          - texto: >-
              Excluye usar las **reglas de derivación**: hay que partir de la
              definición como límite
            correcta: true
            mensaje: |
              Eso es. Escribir «la derivada de $x^{3}$ es $3x^{2}$ por la regla
              de la potencia» sería usar el resultado que se pide demostrar. Hay
              que ir al cociente incremental y calcular el límite.
          - texto: Excluye usar números concretos
            mensaje: |
              Los números concretos no están prohibidos: sirven para comprobar.
              Lo que está prohibido es apoyarse en la regla que se quiere
              demostrar.
          - texto: Excluye dibujar la función
            mensaje: |
              Un dibujo puede acompañar, pero tampoco demostraría nada por sí
              solo. El problema no es el dibujo: es de dónde se parte.
          - texto: Nada, «demostrar» y «calcular» son lo mismo
            mensaje: |
              No lo son, y el reparto de puntos de los exámenes lo confirma:
              «demostrar» es COMP4 y se puntúa el razonamiento, no el resultado.

      - tipo: calcular
        titulo: El cociente incremental de la cúbica
        pregunta: |
          Al desarrollar $\frac{(x+h)^{3}-x^{3}}{h}$ y simplificar, ¿cuál es el
          coeficiente de $x^{2}$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es el coeficiente de $x^{3}$ en el binomio antes de restar, y
              justo ese término **se cancela** con el $-x^{3}$. El que sobrevive
              y no lleva $h$ es $3x^{2}$.
          - valor: '2'
            mensaje: |
              2 sería el coeficiente si la función fuera $x^{2}$. Para $x^{3}$ el
              binomio da $3x^{2}h$, y al dividir entre $h$ queda $3x^{2}$.
          - valor: '6'
            mensaje: |
              6 aparece en la **segunda** derivada, $6x$. Aquí el desarrollo del
              cubo da coeficientes 1, 3, 3, 1.
        pista: |
          $(x+h)^{3} = x^{3}+3x^{2}h+3xh^{2}+h^{3}$. Resta $x^{3}$ y divide
          entre $h$.
        desarrollo: |
          $$
          (x+h)^{3} = x^{3}+3x^{2}h+3xh^{2}+h^{3}
          $$

          $$
          (x+h)^{3}-x^{3} = 3x^{2}h+3xh^{2}+h^{3} = h\left(3x^{2}+3xh+h^{2}\right)
          $$

          $$
          \frac{(x+h)^{3}-x^{3}}{h} = 3x^{2}+3xh+h^{2}
          $$

          Al hacer $h\to0$ los dos últimos términos se anulan y queda
          $3x^{2}$.
        veredicto: |
          El paso clave es **sacar factor común $h$**: sin eso el cociente es
          $\frac00$ y no se puede evaluar. Con eso, la $h$ se simplifica y el
          límite es inmediato.

      - tipo: justificar
        pregunta: |
          Ordena las dos demostraciones. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Definición.**
              $f'(x) = \lim_{h\to0}\dfrac{f(x+h)-f(x)}{h}$, siempre que el
              límite exista.
          - texto: |
              **(a)** $\dfrac{(x+h)-x}{h} = \dfrac{h}{h} = 1$ para todo
              $h \neq 0$, así que el límite es 1.
          - texto: |
              **(b)** $(x+h)^{3}-x^{3} = h\left(3x^{2}+3xh+h^{2}\right)$, y al
              dividir entre $h$ queda $3x^{2}+3xh+h^{2}$.
          - texto: |
              Haciendo $h\to0$, los términos con $h$ se anulan y el límite es
              $3x^{2}$.
          - texto: |
              En los dos casos hace falta **sacar factor común $h$** antes de
              pasar al límite: sin eso el cociente es una indeterminación
              $\frac00$.
          - texto: |
              En (a) se puede sustituir $h=0$ directamente en
              $\frac{(x+h)-x}{h}$, porque el límite es lo mismo que evaluar.
            trampa: true
            mensaje: |
              Sustituir $h=0$ daría $\frac{0}{0}$, que no es un número. El límite
              **no** es «evaluar en el punto»: es el valor al que se acerca la
              expresión cuando $h$ se acerca a 0, y para calcularlo hay que
              simplificar primero. Confundir las dos cosas invalida la
              demostración entera.
        veredicto: |
          Las dos demostraciones tienen la misma forma: desarrollar, cancelar,
          sacar $h$ factor común, simplificar y entonces sí pasar al límite.

    resolucion: |
      **Datos.** Demostrar, por definición, que $(x)' = 1$ y que
      $\left(x^{3}\right)' = 3x^{2}$.

      ### 1 · De dónde hay que partir

      El enunciado dice **demostrar**, y eso excluye usar la regla de la
      potencia: sería dar por cierto lo que se pide probar. Hay que partir de la
      definición:

      $$
      f'(x) = \lim_{h\to0}\frac{f(x+h)-f(x)}{h}
      $$

      siempre que ese límite exista. Y hay un detalle que conviene decir antes
      de empezar: el cociente **no está definido en $h=0$**. Por eso hace falta
      simplificar antes de pasar al límite; sustituir directamente daría
      $\frac00$, que no es un número.

      ### 2 · Apartado (a): la identidad

      $$
      \frac{f(x+h)-f(x)}{h} = \frac{(x+h)-x}{h} = \frac{h}{h} = 1
      $$

      La simplificación es válida porque $h \neq 0$ —el límite mira valores
      cercanos a 0, nunca el propio 0—.

      El cociente vale **exactamente 1** para todo $h\neq0$, así que es una
      función constante y su límite es trivialmente 1:

      $$
      f'(x) = \lim_{h\to0} 1 = 1 \qquad \blacksquare
      $$

      Geométricamente era de esperar: $f(x)=x$ es una recta de pendiente 1, y su
      pendiente es la misma en todos los puntos.

      ### 3 · Apartado (b): la cúbica

      Desarrollando el cubo del binomio:

      $$
      (x+h)^{3} = x^{3}+3x^{2}h+3xh^{2}+h^{3}
      $$

      Al restar $x^{3}$, **ese término se cancela** —y es lo que hace que el
      numerador sea divisible por $h$—:

      $$
      (x+h)^{3}-x^{3} = 3x^{2}h+3xh^{2}+h^{3}
      $$

      Sacando factor común $h$:

      $$
      = h\left(3x^{2}+3xh+h^{2}\right)
      $$

      $$
      \frac{(x+h)^{3}-x^{3}}{h} = 3x^{2}+3xh+h^{2}
      \qquad (h \neq 0)
      $$

      Y ahora sí se puede pasar al límite, porque ya no hay indeterminación:

      $$
      f'(x) = \lim_{h\to0}\left(3x^{2}+3xh+h^{2}\right) = 3x^{2}
      \qquad \blacksquare
      $$

      ### 4 · La estructura común

      Las dos demostraciones son el mismo esquema, y merece la pena verlo porque
      se repite en cualquier derivada por definición:

      1. Escribir el cociente incremental.
      2. Desarrollar y **cancelar** el término que no lleva $h$.
      3. **Sacar $h$ factor común** y simplificar.
      4. Solo entonces, pasar al límite.

      El paso 3 es el que hace posible el 4. Sin él, el cociente sigue siendo
      $\frac00$.

      ### 5 · Comprobación

      Numéricamente, con $x=2$ y valores cada vez más pequeños de $h$, el
      cociente de (b) debería acercarse a $3\cdot4 = 12$:

      | $h$ | $\frac{(2+h)^{3}-8}{h}$ |
      |---|---|
      | $1$ | $\frac{27-8}{1} = 19$ |
      | $0{,}1$ | $\frac{9{,}261-8}{0{,}1} = 12{,}61$ |
      | $0{,}01$ | $12{,}0601$ |
      | $0{,}001$ | $12{,}006$ |

      Baja hacia 12 ✔. Y encaja con la fórmula simplificada:
      $3x^{2}+3xh+h^{2} = 12+6h+h^{2}$, que en $h=0{,}01$ da
      $12+0{,}06+0{,}0001 = 12{,}0601$, exactamente el valor de la tabla ✔

      ### Resultado

      $$
      \boxed{\;\left(x\right)' = 1
      \qquad\qquad
      \left(x^{3}\right)' = 3x^{2}\;}
      $$

  - id: segunda-derivada-composicion
    titulo: La segunda derivada de una composición
    fuente: >-
      Ejercicio 3.8 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU ·
      Cayó en 2018/2019 3E
    nivel: practica
    enunciado: |
      Sea la función compuesta $h(x) = f[g(x)]$. Calcular $h''(x)$.
    pide: Calcular la segunda derivada de la composición.

    pasos:
      - tipo: reconocer
        pregunta: |
          Al derivar $h'(x) = f'[g(x)]\cdot g'(x)$ otra vez, ¿qué regla hace
          falta primero?
        opciones:
          - texto: >-
              La del **producto**, porque $h'$ es un producto de dos funciones
              de $x$
            correcta: true
            mensaje: |
              Exacto, y ese es el paso que se olvida. $h'$ tiene dos factores:
              $f'[g(x)]$ y $g'(x)$. Hay que derivar el primero por el segundo
              más el primero por la derivada del segundo. Y al derivar el primer
              factor vuelve a aparecer la regla de la cadena.
          - texto: Solo la de la cadena, otra vez
            mensaje: |
              La cadena hace falta, pero **dentro**: para derivar $f'[g(x)]$.
              Antes hay que aplicar la del producto, porque $h'$ ya no es una
              composición simple sino un producto.
          - texto: La del cociente
            mensaje: |
              No hay ninguna división en $h'$. Son dos factores multiplicándose.
          - texto: 'Ninguna: basta derivar cada factor'
            mensaje: |
              Derivar factor a factor no es una regla válida: la derivada de un
              producto **no** es el producto de las derivadas. Hace falta la
              regla del producto.

      - tipo: calcular
        titulo: Cuántos sumandos tiene el resultado
        pregunta: |
          ¿Cuántos sumandos tiene $h''(x)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Uno solo saldría si se olvidara la regla del producto y se
              derivara solo el primer factor. Ese es exactamente el error que el
              ejercicio busca.
          - valor: '3'
            mensaje: |
              Tres saldrían con una composición de tres funciones. Aquí son dos,
              $f$ y $g$, y la regla del producto sobre dos factores da dos
              sumandos.
          - valor: '4'
            mensaje: |
              Cuatro sería el resultado de aplicar mal la regla del producto y
              desarrollar de más. La cuenta correcta da exactamente dos
              sumandos.
        pista: |
          $h' = f'[g]\cdot g'$. La regla del producto sobre dos factores da dos
          términos.
        desarrollo: |
          $$
          h'(x) = f'[g(x)]\cdot g'(x)
          $$

          Aplicando la regla del producto:

          $$
          h''(x) = \underbrace{\left(f'[g(x)]\right)'\cdot g'(x)}_{\text{primero}}
          + \underbrace{f'[g(x)]\cdot g''(x)}_{\text{segundo}}
          $$

          Y el primer factor se deriva otra vez con la cadena:
          $\left(f'[g(x)]\right)' = f''[g(x)]\cdot g'(x)$.

          $$
          h''(x) = f''[g(x)]\left[g'(x)\right]^{2} + f'[g(x)]\,g''(x)
          $$

          **Dos** sumandos.
        veredicto: |
          El $\left[g'(x)\right]^{2}$ del primer sumando no se escribe a mano:
          aparece solo, porque $g'$ ya estaba ahí y la cadena trae otro.

      - tipo: justificar
        pregunta: |
          Ordena el cálculo. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Primera derivada**, por la regla de la cadena:
              $h'(x) = f'[g(x)]\cdot g'(x)$.
          - texto: |
              Para derivar otra vez hay que ver que $h'$ es un **producto** de
              dos funciones de $x$: $f'[g(x)]$ y $g'(x)$.
          - texto: |
              Regla del producto:
              $h'' = \left(f'[g(x)]\right)'g'(x) + f'[g(x)]\,g''(x)$.
          - texto: |
              Y el primer factor se deriva con la cadena otra vez:
              $\left(f'[g(x)]\right)' = f''[g(x)]\,g'(x)$.
          - texto: |
              Juntando:
              $h''(x) = f''[g(x)]\left[g'(x)\right]^{2}+f'[g(x)]\,g''(x)$.
          - texto: |
              Como $h' = f'[g]\,g'$, derivando otra vez sale
              $h'' = f''[g]\,g''$.
            trampa: true
            mensaje: |
              Eso es derivar cada factor por separado, y la derivada de un
              producto **no** es el producto de las derivadas. Falta el sumando
              cruzado, y además el primero lleva $\left[g'\right]^{2}$ y no
              $g''$. Es el error que este ejercicio está diseñado para provocar.
        veredicto: |
          Con $f(u)=u^{2}$ y $g(x)=x^{3}$ se puede comprobar la fórmula con
          números y ver que la versión abreviada falla.

    resolucion: |
      **Datos.** $h(x) = f[g(x)]$. Se pide $h''(x)$.

      ### 1 · La primera derivada

      Regla de la cadena:

      $$
      h'(x) = f'[g(x)]\cdot g'(x)
      $$

      Nada nuevo. Lo interesante empieza al derivar otra vez.

      ### 2 · Reconocer que ahora hay un producto

      Este es el paso que decide el ejercicio. $h'$ **ya no es una composición
      simple**: es un **producto** de dos funciones de $x$,

      $$
      \underbrace{f'[g(x)]}_{\text{compuesta}}
      \quad\text{y}\quad
      \underbrace{g'(x)}_{\text{normal}}
      $$

      así que hay que aplicar la regla del producto, y **dentro** de ella la
      cadena otra vez.

      ### 3 · Derivar

      $$
      h''(x) = \left(f'[g(x)]\right)'\cdot g'(x) + f'[g(x)]\cdot g''(x)
      $$

      El primer factor es de nuevo una composición: la función $f'$ evaluada en
      $g(x)$. Su derivada, por la cadena, es

      $$
      \left(f'[g(x)]\right)' = f''[g(x)]\cdot g'(x)
      $$

      Sustituyendo:

      $$
      h''(x) = f''[g(x)]\,g'(x)\,g'(x) + f'[g(x)]\,g''(x)
      $$

      $$
      \boxed{\;h''(x) = f''[g(x)]\left[g'(x)\right]^{2} + f'[g(x)]\,g''(x)\;}
      $$

      ### 4 · Por qué aparece el cuadrado

      El $\left[g'(x)\right]^{2}$ no se escribe a mano: sale de multiplicar dos
      $g'$ que vienen de sitios distintos. Uno estaba ya en $h'$, de la primera
      aplicación de la cadena; el otro lo trae la segunda aplicación al derivar
      $f'[g(x)]$.

      Ese cuadrado es la seña de identidad de la fórmula, y su ausencia delata
      inmediatamente un error.

      ### 5 · Comprobación con un caso concreto

      La forma de asegurarse es probar con funciones donde la cuenta se puede
      hacer de las dos maneras. Con

      $$
      f(u) = u^{2}, \qquad g(x) = x^{3}
      \;\Longrightarrow\;
      h(x) = \left(x^{3}\right)^{2} = x^{6}
      $$

      **Directo:** $h'(x) = 6x^{5}$ y $h''(x) = 30x^{4}$.

      **Por la fórmula:** $f'(u) = 2u$, $f''(u) = 2$, $g'(x) = 3x^{2}$,
      $g''(x) = 6x$.

      $$
      h'' = 2\cdot\left(3x^{2}\right)^{2} + 2x^{3}\cdot 6x
      = 2\cdot9x^{4} + 12x^{4}
      = 18x^{4}+12x^{4} = 30x^{4} \quad\checkmark
      $$

      **Y la versión equivocada**, la que olvida el producto:

      $$
      f''[g]\,g'' = 2\cdot 6x = 12x \quad\times
      $$

      que no se parece en nada a $30x^{4}$. La comprobación no solo confirma la
      fórmula: enseña de un vistazo lo lejos que queda el atajo.

      ### 6 · La estructura general

      Merece la pena quedarse con la forma, porque se repite en cualquier
      derivada segunda de una composición:

      $$
      h'' = \underbrace{f''\left[g\right]\left[g'\right]^{2}}_{\text{curvatura de } f}
      + \underbrace{f'\left[g\right]g''}_{\text{curvatura de } g}
      $$

      Un sumando por cada forma de curvarse: la de la función de fuera y la de
      la de dentro. Si $g$ es una recta, $g''=0$ y el segundo desaparece; si $f$
      es una recta, $f''=0$ y desaparece el primero.

  - id: segunda-derivada-inversa
    titulo: La segunda derivada de la función inversa
    fuente: >-
      Ejercicio 3.9 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU ·
      Cayó en 2016/2017 2E
    nivel: practica
    enunciado: |
      Sea $f^{-1}(x)$ la función inversa de la función $f(x)$. Calcular
      $\left[f^{-1}(x)\right]''$.
    pide: Calcular la segunda derivada de la inversa.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De dónde sale la fórmula de la **primera** derivada de la inversa?
        opciones:
          - texto: >-
              De derivar la identidad $f\left[f^{-1}(x)\right] = x$ con la regla
              de la cadena
            correcta: true
            mensaje: |
              Eso es. Componer una función con su inversa da la identidad, y
              derivar los dos miembros da
              $f'\left[f^{-1}\right]\cdot\left[f^{-1}\right]' = 1$, de donde se
              despeja. Todo el ejercicio sale de derivar esa misma identidad dos
              veces.
          - texto: De invertir la fracción $\frac{dy}{dx}$
            mensaje: |
              Esa es la forma de recordarla —$\frac{dx}{dy} = 1/\frac{dy}{dx}$—,
              pero no es una demostración: las derivadas no son fracciones que
              se puedan dar la vuelta sin justificación. La justificación es
              derivar la identidad.
          - texto: De la regla del cociente
            mensaje: |
              No hay ningún cociente de partida. El cociente **aparece** al
              despejar, pero no es el punto de partida.
          - texto: Es una definición, no se deduce
            mensaje: |
              Se deduce, y la deducción es justo lo que hace falta aquí: el
              mismo método aplicado dos veces da la segunda derivada.

      - tipo: calcular
        titulo: El exponente del denominador
        pregunta: |
          En $\left[f^{-1}(x)\right]'' = -\frac{f''(x)}{\left[f'(x)\right]^{n}}$,
          ¿cuánto vale $n$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 sería el exponente si solo se aplicara la regla del cociente sin
              la cadena. Falta un factor $f'$ más, que viene de derivar
              $f'\left[f^{-1}(x)\right]$ por dentro.
          - valor: '1'
            mensaje: |
              1 es el exponente en la **primera** derivada,
              $\left[f^{-1}\right]' = \frac{1}{f'}$. La segunda sube dos
              escalones.
          - valor: '4'
            mensaje: |
              4 saldría de elevar al cuadrado el denominador de la primera
              derivada y multiplicar otra vez. La cuenta correcta da 3:
              dos del cociente y uno de la cadena.
        pista: |
          Deriva $\left[f^{-1}\right]' = \frac{1}{f'\left[f^{-1}(x)\right]}$ con
          la regla del cociente, y no olvides la cadena en el denominador.
        desarrollo: |
          Partiendo de

          $$
          \left[f^{-1}(x)\right]' = \frac{1}{f'\left[f^{-1}(x)\right]}
          $$

          y derivando con la regla del cociente —el numerador es constante—:

          $$
          \left[f^{-1}(x)\right]''
          = -\frac{\left(f'\left[f^{-1}(x)\right]\right)'}
                 {\left(f'\left[f^{-1}(x)\right]\right)^{2}}
          $$

          La derivada de arriba necesita la cadena:

          $$
          \left(f'\left[f^{-1}(x)\right]\right)'
          = f''\left[f^{-1}(x)\right]\cdot\left[f^{-1}(x)\right]'
          = \frac{f''\left[f^{-1}(x)\right]}{f'\left[f^{-1}(x)\right]}
          $$

          Sustituyendo, los denominadores se acumulan:

          $$
          \left[f^{-1}(x)\right]''
          = -\frac{f''\left[f^{-1}(x)\right]}{\left(f'\left[f^{-1}(x)\right]\right)^{3}}
          $$

          **Exponente 3**: dos de la regla del cociente y uno de la cadena.
        veredicto: |
          Escrito en el punto $x$ de la función original, la fórmula queda
          $-\frac{f''(x)}{\left[f'(x)\right]^{3}}$, que es como suele darse.

      - tipo: justificar
        pregunta: |
          Ordena la deducción. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Punto de partida:** $f\left[f^{-1}(x)\right] = x$, que es lo que
              significa ser inversa.
          - texto: |
              Derivando con la cadena:
              $f'\left[f^{-1}(x)\right]\cdot\left[f^{-1}(x)\right]' = 1$, de
              donde
              $\left[f^{-1}(x)\right]' = \dfrac{1}{f'\left[f^{-1}(x)\right]}$.
          - texto: |
              Derivando otra vez, con la regla del cociente y numerador
              constante:
              $\left[f^{-1}\right]'' =
              -\dfrac{\left(f'\left[f^{-1}\right]\right)'}
              {\left(f'\left[f^{-1}\right]\right)^{2}}$.
          - texto: |
              Y el numerador necesita la cadena:
              $\left(f'\left[f^{-1}\right]\right)' =
              f''\left[f^{-1}\right]\cdot\left[f^{-1}\right]'
              = \dfrac{f''\left[f^{-1}\right]}{f'\left[f^{-1}\right]}$.
          - texto: |
              Juntando, el denominador queda elevado al cubo:
              $\left[f^{-1}(x)\right]'' =
              -\dfrac{f''\left[f^{-1}(x)\right]}
              {\left(f'\left[f^{-1}(x)\right]\right)^{3}}$.
          - texto: |
              Como $\left[f^{-1}\right]' = \frac{1}{f'}$, derivando otra vez sale
              $\left[f^{-1}\right]'' = \frac{1}{f''}$.
            trampa: true
            mensaje: |
              La derivada de $\frac1u$ no es $\frac{1}{u'}$: es
              $-\frac{u'}{u^{2}}$. Ese atajo pierde el signo menos, pierde el
              factor $f''$ del numerador y pone el exponente 1 donde debe ir 3.
              Es tentador porque la primera derivada sí «invierte», pero eso no
              se hereda.
        veredicto: |
          El signo menos es el otro detalle que se cae: viene de derivar un
          inverso, y si la función original es cóncava la inversa es convexa.

    resolucion: |
      **Datos.** $f^{-1}$ es la inversa de $f$. Se pide
      $\left[f^{-1}(x)\right]''$.

      ### 1 · Todo sale de una identidad

      Ser inversa significa exactamente esto:

      $$
      f\left[f^{-1}(x)\right] = x
      $$

      y **derivando esa igualdad** salen las dos fórmulas del ejercicio. No hace
      falta ninguna herramienta nueva: solo la cadena, el cociente y paciencia.

      ### 2 · La primera derivada

      Derivando los dos miembros respecto de $x$, con la regla de la cadena en
      el izquierdo:

      $$
      f'\left[f^{-1}(x)\right]\cdot\left[f^{-1}(x)\right]' = 1
      $$

      $$
      \left[f^{-1}(x)\right]' = \frac{1}{f'\left[f^{-1}(x)\right]}
      $$

      con la hipótesis, que hay que decir, de que
      $f'\left[f^{-1}(x)\right] \neq 0$. Si la derivada de $f$ se anula en un
      punto, la inversa no es derivable en su imagen — ahí la gráfica de la
      inversa tiene tangente vertical.

      ### 3 · La segunda derivada

      Se deriva otra vez. El numerador es constante, así que la regla del
      cociente se reduce a

      $$
      \left(\frac{1}{u}\right)' = -\frac{u'}{u^{2}}
      $$

      con $u = f'\left[f^{-1}(x)\right]$:

      $$
      \left[f^{-1}(x)\right]''
      = -\frac{\left(f'\left[f^{-1}(x)\right]\right)'}
             {\left(f'\left[f^{-1}(x)\right]\right)^{2}}
      $$

      Y ese numerador es otra composición, que necesita la cadena:

      $$
      \left(f'\left[f^{-1}(x)\right]\right)'
      = f''\left[f^{-1}(x)\right]\cdot\left[f^{-1}(x)\right]'
      = \frac{f''\left[f^{-1}(x)\right]}{f'\left[f^{-1}(x)\right]}
      $$

      Sustituyendo, los denominadores se acumulan:

      $$
      \left[f^{-1}(x)\right]''
      = -\frac{f''\left[f^{-1}(x)\right]}
             {\left(f'\left[f^{-1}(x)\right]\right)^{3}}
      $$

      Y evaluado en el punto correspondiente de la función original, que es como
      suele escribirse:

      $$
      \boxed{\;\left[f^{-1}(x)\right]'' = -\frac{f''(x)}{\left[f'(x)\right]^{3}}\;}
      $$

      ### 4 · De dónde sale cada pieza

      | pieza | de dónde viene |
      |---|---|
      | el signo $-$ | de derivar $\frac1u$ |
      | el $f''$ del numerador | de la regla de la cadena |
      | dos factores del denominador | del cuadrado de la regla del cociente |
      | el tercero | de la cadena, otra vez |

      El exponente 3 es la suma de dos aportaciones distintas. Ese es el
      contenido del ejercicio.

      ### 5 · Lo que dice la fórmula

      El signo menos tiene una lectura geométrica que merece la pena escribir:
      la gráfica de $f^{-1}$ es la de $f$ **reflejada** respecto de la recta
      $y=x$, y esa reflexión **invierte la concavidad**. Si $f$ es convexa y
      creciente, su inversa es cóncava.

      Se ve en la fórmula: con $f'>0$, el denominador es positivo y
      $\left[f^{-1}\right]''$ tiene el signo contrario a $f''$.

      ### 6 · Comprobación

      Con $f(x) = e^{x}$, cuya inversa es $\ln x$ y se conoce:

      $$
      f'(x) = e^{x}, \qquad f''(x) = e^{x}
      $$

      La fórmula, evaluada en el punto $y=f(x)$, da

      $$
      \left[f^{-1}\right]''(y) = -\frac{e^{x}}{\left(e^{x}\right)^{3}}
      = -\frac{1}{e^{2x}} = -\frac{1}{y^{2}}
      $$

      Y directamente: $\left(\ln y\right)'' = \left(\frac1y\right)' =
      -\frac{1}{y^{2}}$ ✔

      Coinciden. Y se ve la inversión de concavidad: $e^{x}$ es convexa
      —$f''>0$— y $\ln$ es cóncava —segunda derivada negativa—.

  - id: derivada-de-las-inversas
    titulo: Las seis derivadas de las inversas, en dos variables
    fuente: >-
      Ejercicio 3.10 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Para cada función $f(x)$ del ejercicio 3.2 calcular la derivada de la
      función inversa, $\left[f^{-1}(x)\right]'$, y expresar el resultado en
      función tanto de $x$ como de $y$.
    pide: Calcular las seis derivadas y expresarlas en las dos variables.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué significa «expresar el resultado en función tanto de $x$ como de
          $y$»?
        opciones:
          - texto: >-
              Dar la derivada de dos formas: en función del punto **de la
              inversa** y en función del punto **de la función original**
            correcta: true
            mensaje: |
              Eso es. La fórmula $\frac{dx}{dy} = \frac{1}{dy/dx}$ sale
              naturalmente en función de $x$ —la variable de la función
              original—, y luego hay que sustituir para dejarla en función de
              $y$, que es la variable de la inversa. Las dos formas son la
              misma derivada.
          - texto: Calcular dos derivadas distintas
            mensaje: |
              Es **una sola** derivada escrita de dos maneras. Lo que cambia es
              en qué variable se expresa el resultado, no la función que se
              deriva.
          - texto: Derivar respecto de $x$ y luego respecto de $y$
            mensaje: |
              Solo se deriva una vez. Lo que se hace después es un cambio de
              variable en el resultado, no otra derivación.
          - texto: Dar el resultado con y sin simplificar
            mensaje: |
              No es cuestión de simplificar: son dos expresiones genuinamente
              distintas de lo mismo, y una de ellas suele ser mucho más útil que
              la otra.

      - tipo: calcular
        titulo: El caso (a)
        pregunta: |
          Para $f(x) = 1+e^{2x}$, la derivada de la inversa en función de $y$ es
          $\frac{1}{k(y-1)}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Falta el 2 que viene del exponente. $f'(x) = 2e^{2x}$, y ese 2
              sobrevive hasta el final: la inversa es
              $\frac12\ln(x-1)$ y su derivada, $\frac{1}{2(x-1)}$.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es el coeficiente de la **inversa**,
              $f^{-1}(x) = \frac12\ln(x-1)$, no el del denominador de su
              derivada. Al derivar, ese $\frac12$ pasa arriba y equivale a un 2
              abajo.
          - valor: '4'
            mensaje: |
              4 saldría de elevar el 2 al cuadrado. La derivada de $e^{2x}$ es
              $2e^{2x}$, con un 2 lineal.
        pista: |
          $f'(x) = 2e^{2x}$, y $e^{2x} = y-1$ despejando del enunciado.
        desarrollo: |
          $$
          f(x) = 1+e^{2x} \;\Longrightarrow\; f'(x) = 2e^{2x}
          $$

          **En función de $x$:**

          $$
          \left[f^{-1}\right]' = \frac{dx}{dy} = \frac{1}{f'(x)}
          = \frac{1}{2e^{2x}} = \frac{1}{2}e^{-2x}
          $$

          **En función de $y$:** como $y = 1+e^{2x}$, se tiene
          $e^{2x} = y-1$, y sustituyendo:

          $$
          \left[f^{-1}\right]' = \frac{1}{2(y-1)}
          $$

          Luego $k=2$.
        veredicto: |
          La forma en $y$ es la útil: es la que permite evaluar la derivada de
          la inversa sin resolver antes ninguna ecuación.

      - tipo: justificar
        pregunta: |
          Ordena el método y sus consecuencias. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **La fórmula.** De $f\left[f^{-1}(y)\right] = y$ sale
              $\dfrac{dx}{dy} = \dfrac{1}{f'(x)}$, siempre que
              $f'(x) \neq 0$.
          - texto: |
              Aplicada tal cual, da el resultado **en función de $x$**, la
              variable de la función original.
          - texto: |
              Para pasarlo a $y$ se usa la relación $y = f(x)$ y se sustituye
              lo que haga falta. Por ejemplo en (a):
              $e^{2x} = y-1$.
          - texto: |
              Las dos formas describen la misma derivada; la de $y$ es la que
              sirve para evaluar sin despejar nada.
          - texto: |
              En (e) y (f) el paso de $x$ a $y$ usa las identidades
              hiperbólicas: $\cosh^{2}-\mathrm{senh}^{2} = 1$ convierte
              $\frac{1}{\mathrm{senh}\,x}$ en $\frac{1}{\sqrt{y^{2}-1}}$.
          - texto: |
              Como la derivada de la inversa es el inverso de la derivada,
              basta escribir $\frac{1}{f'(y)}$.
            trampa: true
            mensaje: |
              Es $\frac{1}{f'(x)}$, no $\frac{1}{f'(y)}$: la derivada de $f$ hay
              que evaluarla en el punto de **$f$**, no en el de la inversa.
              Escribir $f'(y)$ mezcla los dos mundos y da un resultado
              equivocado. Ese es exactamente el motivo de que el enunciado pida
              las dos formas.
        veredicto: |
          Distinguir en qué punto se evalúa cada cosa es todo el ejercicio. El
          enunciado pide las dos expresiones precisamente para forzar a
          separarlas.

    resolucion: |
      **Datos.** Las seis funciones del ejercicio 3.2. Se pide la derivada de
      cada inversa, en función de $x$ y en función de $y$.

      ### 1 · La herramienta

      De la identidad $f\left[f^{-1}(y)\right] = y$, derivando, sale

      $$
      \frac{dx}{dy} = \frac{1}{\dfrac{dy}{dx}} = \frac{1}{f'(x)},
      \qquad f'(x) \neq 0
      $$

      La fórmula da el resultado **en función de $x$**, porque $f'$ está escrita
      en esa variable. Para pasarlo a $y$ hay que usar la relación $y=f(x)$ y
      sustituir.

      Y hay que tener claro dónde se evalúa cada cosa: **$f'$ se evalúa en el
      punto de $f$**, no en el de la inversa. Escribir $\frac{1}{f'(y)}$ es el
      error que el enunciado quiere prevenir pidiendo las dos formas.

      ### 2 · (a) $f(x) = 1+e^{2x}$

      $$
      f'(x) = 2e^{2x}
      \;\Longrightarrow\;
      \frac{dx}{dy} = \frac{1}{2e^{2x}} = \frac{1}{2}e^{-2x}
      $$

      Y como $y = 1+e^{2x}$, es decir $e^{2x} = y-1$:

      $$
      \frac{dx}{dy} = \frac{1}{2(y-1)}
      $$

      ### 3 · (b) $f(x) = x^{2}-1$ en $(-\infty,0]$

      $$
      f'(x) = 2x
      \;\Longrightarrow\;
      \frac{dx}{dy} = \frac{1}{2x}
      $$

      Y como $y = x^{2}-1$ con $x \le 0$, se tiene $x = -\sqrt{1+y}$:

      $$
      \frac{dx}{dy} = -\frac{1}{2\sqrt{1+y}}
      $$

      **El signo menos vuelve a aparecer**, y por el mismo motivo que en el
      ejercicio 3.2: el dominio de partida es el semieje negativo. La derivada
      de la inversa es negativa porque la inversa es decreciente.

      ### 4 · (c) $f(x) = \ln(x+3)$

      $$
      f'(x) = \frac{1}{x+3}
      \;\Longrightarrow\;
      \frac{dx}{dy} = x+3
      $$

      Y como $y = \ln(x+3)$, es decir $x+3 = e^{y}$:

      $$
      \frac{dx}{dy} = e^{y}
      $$

      Que es lo esperable: la inversa es $e^{y}-3$ y su derivada, $e^{y}$.

      ### 5 · (d) $f(x) = \cos(x-1)$

      $$
      f'(x) = -\,\mathrm{sen}(x-1)
      \;\Longrightarrow\;
      \frac{dx}{dy} = -\frac{1}{\mathrm{sen}(x-1)}
      $$

      Para pasarlo a $y$: con $y = \cos(x-1)$ y $x-1 \in [0,\pi]$ —donde el seno
      es no negativo—, la identidad fundamental da
      $\mathrm{sen}(x-1) = \sqrt{1-y^{2}}$:

      $$
      \frac{dx}{dy} = -\frac{1}{\sqrt{1-y^{2}}}
      $$

      que es, en efecto, la derivada del arcocoseno.

      ### 6 · (e) y (f), las hiperbólicas

      **(e)** $f(x) = \cosh x$, con $f'(x) = \mathrm{senh}\,x$:

      $$
      \frac{dx}{dy} = \frac{1}{\mathrm{senh}\,x}
      $$

      Y con la identidad $\cosh^{2}x-\mathrm{senh}^{2}x = 1$, y
      $\mathrm{senh}\,x \ge 0$ en $[0,\infty)$:

      $$
      \mathrm{senh}\,x = \sqrt{\cosh^{2}x-1} = \sqrt{y^{2}-1}
      \;\Longrightarrow\;
      \frac{dx}{dy} = \frac{1}{\sqrt{y^{2}-1}}
      $$

      **(f)** $f(x) = \mathrm{senh}\,x$, con $f'(x) = \cosh x$:

      $$
      \frac{dx}{dy} = \frac{1}{\cosh x} = \frac{1}{\sqrt{1+\mathrm{senh}^{2}x}}
      = \frac{1}{\sqrt{y^{2}+1}}
      $$

      Aquí no hay que discutir signos: $\cosh$ es siempre positivo.

      ### 7 · Comprobación

      La forma de asegurarse es derivar directamente las inversas calculadas en
      el ejercicio 3.2 y ver que coinciden:

      | | inversa (del 3.2) | su derivada | lo obtenido aquí |
      |---|---|---|---|
      | (a) | $\frac12\ln(x-1)$ | $\frac{1}{2(x-1)}$ | ✔ |
      | (b) | $-\sqrt{1+x}$ | $-\frac{1}{2\sqrt{1+x}}$ | ✔ |
      | (c) | $e^{x}-3$ | $e^{x}$ | ✔ |
      | (d) | $1+\arccos x$ | $-\frac{1}{\sqrt{1-x^{2}}}$ | ✔ |
      | (e) | $\ln\left(x+\sqrt{x^{2}-1}\right)$ | $\frac{1}{\sqrt{x^{2}-1}}$ | ✔ |
      | (f) | $\ln\left(x+\sqrt{x^{2}+1}\right)$ | $\frac{1}{\sqrt{x^{2}+1}}$ | ✔ |

      Las seis coinciden. Y eso enseña algo útil: **hay dos caminos** —invertir
      y luego derivar, o derivar y luego invertir— y el segundo suele ser mucho
      más corto. En (e) y (f), derivar el logaritmo con la raíz dentro es
      bastante más trabajo que aplicar la fórmula.

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \text{(a)}\; & \tfrac{1}{2}e^{-2x} = \tfrac{1}{2(y-1)} &
      \text{(d)}\; & \tfrac{-1}{\mathrm{sen}(1-x)} = \tfrac{-1}{\sqrt{1-y^{2}}} \\
      \text{(b)}\; & \tfrac{1}{2x} = \tfrac{-1}{2\sqrt{1+y}} &
      \text{(e)}\; & \tfrac{1}{\mathrm{senh}\,x} = \tfrac{1}{\sqrt{y^{2}-1}} \\
      \text{(c)}\; & x+3 = e^{y} &
      \text{(f)}\; & \tfrac{1}{\cosh x} = \tfrac{1}{\sqrt{y^{2}+1}}
      \end{aligned}}
      $$

  - id: derivacion-implicita
    titulo: Seis derivadas sin despejar la y
    fuente: >-
      Ejercicio 3.11 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU ·
      El apartado (a) cayó en 2019/2020 3E AT
    nivel: practica
    enunciado: |
      *Derivación implícita.* Suponiendo que $y$ es función de $x$, calcular en
      cada caso $y'(x) = \frac{dy}{dx}$.

      **(a)** $y = e^{xy}$ · **(b)** $x^{2}+y^{2} = 1$ ·
      **(c)** $10x^{4}-18xy^{2}+10y^{3} = 48$

      **(d)** $x^{3}+y^{3} = 4$ · **(e)** $y = \mathrm{sen}(3x+4y)$ ·
      **(f)** $x = 3-\sqrt{x^{2}+y^{2}}$
    pide: Calcular $y'$ en los seis casos.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué cambia al derivar una $y$ si $y$ es función de $x$?
        opciones:
          - texto: >-
              Que aparece un factor $y'$ por la **regla de la cadena**
            correcta: true
            mensaje: |
              Eso es todo el método. $\left(y^{2}\right)' = 2y\,y'$, no $2y$:
              hay una función dentro de otra y la cadena obliga a multiplicar
              por la derivada de dentro. Cada vez que se deriva algo con $y$,
              sale un $y'$.
          - texto: 'Nada: $y$ se deriva como una variable normal'
            mensaje: |
              Si $y$ fuera independiente, sí. Pero el enunciado dice que $y$ es
              función de $x$, así que derivar respecto de $x$ obliga a la regla
              de la cadena. Sin el $y'$ el método no funciona.
          - texto: Que hay que despejar $y$ antes
            mensaje: |
              Justo lo que se evita. En varios de estos apartados —(a), (c),
              (e)— despejar es imposible, y ese es el motivo de existir de la
              derivación implícita.
          - texto: Que $y$ se trata como constante
            mensaje: |
              Eso sería derivar respecto de otra variable. Como constante, su
              derivada sería 0 y la ecuación perdería toda la información.

      - tipo: calcular
        titulo: El caso más limpio
        pregunta: |
          Para $x^{2}+y^{2} = 1$, ¿cuánto vale $y'$ en el punto
          $\left(\frac{3}{5},\frac{4}{5}\right)$?
        respuesta:
          tipo: numero
          valor: '-0.75'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.75'
            mensaje: |
              Falta el signo. $y' = -\frac{x}{y}$, con un menos: en el primer
              cuadrante la circunferencia **baja**, así que la pendiente tiene
              que ser negativa.
          - valor: '-1.3333333'
            mensaje: |
              $-\frac43$ es $-\frac{y}{x}$, la fracción al revés. La fórmula es
              $y' = -\frac{x}{y}$.
          - valor: '-0.6'
            mensaje: |
              $-0{,}6$ es $-x$, sin dividir entre $y$. La derivada implícita
              deja un cociente.
        pista: |
          Deriva los dos miembros: $2x+2y\,y' = 0$.
        desarrollo: |
          Derivando la ecuación entera respecto de $x$:

          $$
          2x+2y\,y' = 0
          \;\Longrightarrow\;
          y' = -\frac{x}{y}
          $$

          En $\left(\frac35,\frac45\right)$:

          $$
          y' = -\frac{3/5}{4/5} = -\frac{3}{4} = -0{,}75
          $$

          Coherente con el dibujo: en el primer cuadrante la circunferencia
          desciende.
        veredicto: |
          Que el resultado dependa de $x$ **y** de $y$ es normal en derivación
          implícita: la ecuación describe una curva, y hace falta el punto
          entero para saber la pendiente.

      - tipo: calcular
        titulo: El apartado con exponencial
        pregunta: |
          Para $y = e^{xy}$, la derivada es $y' = \frac{y^{2}}{k-xy}$. ¿Cuánto
          vale $k$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Con $k=0$ quedaría $-\frac{y}{x}$, que no es. El 1 sale de
              agrupar: $y'\left(1-xy\right) = y^{2}$, y ese 1 viene de derivar
              la $y$ del primer miembro.
          - valor: '2'
            mensaje: |
              El 2 no aparece por ninguna parte: no hay ningún cuadrado que
              derivar en el exponente.
          - valor: '-1'
            mensaje: |
              Signo cambiado al agrupar. De $y' = y^{2}+xy\,y'$ se pasa el
              término con $y'$ restando: $y'(1-xy) = y^{2}$.
        pista: |
          Deriva: $y' = e^{xy}(y+xy')$. Y usa que $e^{xy} = y$.
        desarrollo: |
          Derivando los dos miembros, con la cadena en la exponencial y la regla
          del producto en el exponente:

          $$
          y' = e^{xy}\cdot\left(y+x\,y'\right)
          $$

          Y aquí el atajo del ejercicio: **el propio enunciado dice que
          $e^{xy} = y$**, así que se sustituye en vez de arrastrar la
          exponencial:

          $$
          y' = y\left(y+x\,y'\right) = y^{2}+xy\,y'
          $$

          Agrupando los términos con $y'$:

          $$
          y'-xy\,y' = y^{2}
          \;\Longrightarrow\;
          y'\left(1-xy\right) = y^{2}
          \;\Longrightarrow\;
          y' = \frac{y^{2}}{1-xy}
          $$

          Luego $k=1$.
        veredicto: |
          Sustituir $e^{xy}$ por $y$ no es obligatorio, pero deja el resultado
          mucho más limpio. Merece la pena mirar si el enunciado regala una
          igualdad así.

      - tipo: justificar
        pregunta: |
          Ordena el método. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Paso 1.** Derivar los **dos miembros** de la ecuación respecto
              de $x$, tratando $y$ como función de $x$.
          - texto: |
              **Paso 2.** Cada vez que se deriva algo que contiene $y$, la
              cadena obliga a multiplicar por $y'$:
              $\left(y^{3}\right)' = 3y^{2}y'$.
          - texto: |
              **Paso 3.** Donde haya productos de $x$ e $y$, la regla del
              producto: $\left(xy^{2}\right)' = y^{2}+2xy\,y'$.
          - texto: |
              **Paso 4.** Agrupar todos los términos con $y'$ a un lado, sacar
              factor común y despejar.
          - texto: |
              El resultado depende en general de $x$ **y** de $y$, y eso es
              normal: la ecuación describe una curva, y la pendiente cambia de
              un punto a otro.
          - texto: |
              Si la ecuación no se puede despejar en $y$, la derivada implícita
              tampoco existe.
            trampa: true
            mensaje: |
              Al revés: la derivación implícita existe **precisamente** para
              esos casos. En (a), (c) y (e) despejar $y$ es imposible o
              impracticable, y aun así la derivada sale en tres líneas. Poder
              despejar no es requisito de nada.
        veredicto: |
          El método no necesita que la ecuación defina una función global: basta
          que la defina localmente cerca del punto, que es lo que garantiza el
          teorema de la función implícita.

    resolucion: |
      **Datos.** Seis ecuaciones que ligan $x$ e $y$. Se pide $y'$ en cada una,
      suponiendo que $y$ es función de $x$.

      ### 1 · Por qué existe este método

      En (b) y (d) se podría despejar $y$ y derivar como siempre. En **(a), (c)
      y (e) no**: no hay forma de aislar la $y$. Y sin embargo la ecuación
      define una curva con tangente en cada punto, así que la pendiente existe.

      La derivación implícita la calcula sin despejar. La idea es una sola:
      **derivar los dos miembros tratando $y$ como función de $x$**, con lo que
      cada aparición de $y$ arrastra un $y'$ por la regla de la cadena.

      ### 2 · (a) $y = e^{xy}$

      $$
      y' = e^{xy}\cdot\left(y+x\,y'\right)
      $$

      —cadena para la exponencial, producto para el exponente—. Y ahora el
      detalle que limpia el resultado: el enunciado dice que $e^{xy} = y$, así
      que se sustituye:

      $$
      y' = y^{2}+xy\,y'
      \;\Longrightarrow\;
      y'\left(1-xy\right) = y^{2}
      \;\Longrightarrow\;
      \boxed{y' = \frac{y^{2}}{1-xy}}
      $$

      ### 3 · (b) $x^{2}+y^{2} = 1$

      $$
      2x+2y\,y' = 0
      \;\Longrightarrow\;
      \boxed{y' = -\frac{x}{y}}
      $$

      El resultado tiene una lectura geométrica limpia: la tangente a la
      circunferencia es **perpendicular al radio**. La pendiente del radio en
      $(x,y)$ es $\frac{y}{x}$, y $-\frac{x}{y}$ es su opuesta inversa.

      ### 4 · (c) $10x^{4}-18xy^{2}+10y^{3} = 48$

      El término del medio necesita la regla del producto **y** la cadena:

      $$
      40x^{3}-18\left(y^{2}+2xy\,y'\right)+30y^{2}y' = 0
      $$

      $$
      40x^{3}-18y^{2}-36xy\,y'+30y^{2}y' = 0
      $$

      Agrupando:

      $$
      y'\left(30y^{2}-36xy\right) = 18y^{2}-40x^{3}
      $$

      $$
      \boxed{y' = \frac{18y^{2}-40x^{3}}{30y^{2}-36xy}
      = \frac{9y^{2}-20x^{3}}{3\left(5y^{2}-6xy\right)}}
      $$

      ### 5 · (d) $x^{3}+y^{3} = 4$

      $$
      3x^{2}+3y^{2}y' = 0
      \;\Longrightarrow\;
      \boxed{y' = -\frac{x^{2}}{y^{2}}}
      $$

      ### 6 · (e) $y = \mathrm{sen}(3x+4y)$

      $$
      y' = \cos(3x+4y)\cdot\left(3+4y'\right)
      $$

      $$
      y' = 3\cos(3x+4y)+4y'\cos(3x+4y)
      $$

      $$
      y'\left[1-4\cos(3x+4y)\right] = 3\cos(3x+4y)
      $$

      $$
      \boxed{y' = \frac{3\cos(3x+4y)}{1-4\cos(3x+4y)}}
      $$

      ### 7 · (f) $x = 3-\sqrt{x^{2}+y^{2}}$

      $$
      1 = -\frac{2x+2y\,y'}{2\sqrt{x^{2}+y^{2}}}
      = -\frac{x+y\,y'}{\sqrt{x^{2}+y^{2}}}
      $$

      $$
      \sqrt{x^{2}+y^{2}} = -x-y\,y'
      \;\Longrightarrow\;
      y\,y' = -x-\sqrt{x^{2}+y^{2}}
      $$

      $$
      \boxed{y' = -\frac{\sqrt{x^{2}+y^{2}}+x}{y}}
      $$

      ### 8 · Comprobación

      Los apartados que **sí** se pueden despejar sirven para validar el método.

      **(b)** En el semiplano superior, $y = \sqrt{1-x^{2}}$, y derivando
      directamente:

      $$
      y' = \frac{-2x}{2\sqrt{1-x^{2}}} = -\frac{x}{\sqrt{1-x^{2}}}
      = -\frac{x}{y} \quad\checkmark
      $$

      **(d)** $y = \sqrt[3]{4-x^{3}}$, y derivando:

      $$
      y' = \frac{1}{3}\left(4-x^{3}\right)^{-2/3}\cdot\left(-3x^{2}\right)
      = -\frac{x^{2}}{\left(4-x^{3}\right)^{2/3}}
      = -\frac{x^{2}}{y^{2}} \quad\checkmark
      $$

      Las dos coinciden con lo obtenido implícitamente, y de paso enseñan lo
      que se ahorra: por el camino explícito hay que manejar raíces y exponentes
      fraccionarios; por el implícito, dos líneas.

      **(b) numéricamente**, en $\left(\frac35,\frac45\right)$, que está en la
      circunferencia porque $\frac{9}{25}+\frac{16}{25} = 1$ ✔:

      $$
      y' = -\frac{3/5}{4/5} = -\frac34
      $$

      Negativa, como corresponde a un arco que baja en el primer cuadrante ✔

  - id: tangente-a-la-cuadrifolia
    titulo: Una tangente a una curva con forma de flor
    fuente: >-
      Ejercicio 3.12 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular la recta tangente a la curva
      $\left(x^{2}+y^{2}\right)^{3} = 8x^{2}y^{2}$ en el punto $P(-1,1)$.
    pide: Calcular la ecuación de la recta tangente.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que comprobar **antes** de derivar?
        opciones:
          - texto: >-
              Que el punto $P$ **pertenece a la curva**
            correcta: true
            mensaje: |
              Eso es, y cuesta una línea. Si $P$ no estuviera en la curva, la
              recta tangente «en $P$» no significaría nada. Aquí
              $\left(1+1\right)^{3} = 8$ y $8\cdot1\cdot1 = 8$: coincide.
          - texto: Que la curva se puede despejar en $y$
            mensaje: |
              No hace falta, y aquí sería imposible: es una ecuación de grado 6.
              Para eso está la derivación implícita.
          - texto: Que la curva es una función
            mensaje: |
              No lo es —la flor pasa varias veces por la misma $x$— y no importa.
              Basta que defina una curva con tangente en el punto que interesa.
          - texto: Nada, se deriva directamente
            mensaje: |
              Derivar sin comprobar el punto es arriesgado: si $P$ no estuviera
              en la curva, todo el cálculo posterior sería una respuesta a una
              pregunta sin sentido.

      - tipo: calcular
        titulo: La pendiente
        pregunta: |
          ¿Cuál es la pendiente de la tangente en $P(-1,1)$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '-1'
            mensaje: |
              Signo cambiado. Sustituyendo $x=-1$, $y=1$ en la derivada
              implícita, el numerador y el denominador salen con el mismo signo
              y el cociente es $+1$.
          - valor: '0'
            mensaje: |
              Pendiente 0 significaría tangente horizontal, y en $P$ la curva
              claramente sube: la recta pasa por $(-1,1)$ y por $(0,2)$.
          - valor: '2'
            mensaje: |
              2 es la ordenada en el origen de la recta, $y = x+2$. La pendiente
              es el coeficiente de $x$.
        pista: |
          Deriva implícitamente y sustituye $x=-1$, $y=1$. Por la simetría del
          punto, muchos términos se simplifican.
        desarrollo: |
          Derivando los dos miembros:

          $$
          3\left(x^{2}+y^{2}\right)^{2}\left(2x+2y\,y'\right)
          = 16xy^{2}+16x^{2}y\,y'
          $$

          Sustituyendo $x=-1$, $y=1$, con $x^{2}+y^{2} = 2$:

          $$
          3\cdot4\cdot\left(-2+2y'\right) = -16+16\,y'
          $$

          $$
          12\left(-2+2y'\right) = -16+16y'
          \;\Longrightarrow\;
          -24+24y' = -16+16y'
          $$

          $$
          8y' = 8 \;\Longrightarrow\; y' = 1
          $$
        veredicto: |
          Sustituir el punto **antes** de despejar $y'$ ahorra arrastrar una
          expresión enorme. Es el atajo estándar cuando solo interesa un punto.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Comprobar el punto.** Con $x=-1$, $y=1$:
              $\left(1+1\right)^{3} = 8$ y $8\cdot1\cdot1 = 8$. $P$ está en la
              curva.
          - texto: |
              **Derivar implícitamente**, con la cadena en el primer miembro y
              el producto en el segundo:
              $3\left(x^{2}+y^{2}\right)^{2}\left(2x+2yy'\right)
              = 16xy^{2}+16x^{2}y\,y'$.
          - texto: |
              **Sustituir el punto antes de despejar**, que ahorra manejar la
              expresión general: queda $-24+24y' = -16+16y'$.
          - texto: |
              De ahí $y' = 1$: la pendiente de la tangente.
          - texto: |
              **Punto-pendiente:** $y-1 = 1\cdot(x+1)$, es decir
              $y = x+2$.
          - texto: |
              Como la curva no es una función, no tiene recta tangente en $P$.
            trampa: true
            mensaje: |
              Una curva puede tener tangente sin ser gráfica de una función. La
              circunferencia tampoco lo es y tiene tangente en todos sus puntos.
              Lo que hace falta es que la curva sea suave **cerca de $P$**, y lo
              es: el problema solo aparecería en el origen, donde los cuatro
              pétalos se cruzan.
        veredicto: |
          En el origen sí habría problema: ahí se cortan los cuatro pétalos y no
          hay una sola tangente. Pero $P(-1,1)$ está en mitad de un pétalo.

    resolucion: |
      **Datos.** La curva $\left(x^{2}+y^{2}\right)^{3} = 8x^{2}y^{2}$ y el
      punto $P(-1,1)$. Se pide la recta tangente.

      ### 1 · Comprobar que el punto está en la curva

      Un paso de una línea que casi nadie escribe y que en un examen vale
      puntos de COMP4:

      $$
      \left((-1)^{2}+1^{2}\right)^{3} = 2^{3} = 8
      $$

      $$
      8\cdot(-1)^{2}\cdot 1^{2} = 8
      $$

      Coinciden: $P$ **pertenece a la curva**. Si no fuera así, hablar de «la
      tangente en $P$» no tendría sentido.

      ### 2 · Por qué hay que derivar implícitamente

      La ecuación es de **grado 6** y no hay forma razonable de despejar $y$. Ni
      falta: la derivación implícita da la pendiente sin necesidad.

      Conviene además señalar que la curva **no es la gráfica de una función**
      —es una cuadrifolia, con cuatro pétalos, y una misma $x$ tiene varias
      $y$—. Eso no impide que tenga tangente: solo obliga a trabajar
      localmente, cerca del punto.

      ### 3 · Derivar

      Primer miembro, con la cadena:

      $$
      \left[\left(x^{2}+y^{2}\right)^{3}\right]'
      = 3\left(x^{2}+y^{2}\right)^{2}\cdot\left(2x+2y\,y'\right)
      $$

      Segundo miembro, con el producto y la cadena:

      $$
      \left[8x^{2}y^{2}\right]' = 16xy^{2}+8x^{2}\cdot 2y\,y'
      = 16xy^{2}+16x^{2}y\,y'
      $$

      Igualando:

      $$
      3\left(x^{2}+y^{2}\right)^{2}\left(2x+2y\,y'\right)
      = 16xy^{2}+16x^{2}y\,y'
      $$

      ### 4 · Sustituir el punto antes de despejar

      Este es el atajo que conviene tener: como solo interesa **un** punto, se
      sustituye ya y se evita arrastrar la expresión general.

      Con $x=-1$, $y=1$ y por tanto $x^{2}+y^{2} = 2$:

      $$
      3\cdot 2^{2}\cdot\left(-2+2y'\right) = 16(-1)(1)+16(1)(1)\,y'
      $$

      $$
      12\left(-2+2y'\right) = -16+16y'
      $$

      $$
      -24+24y' = -16+16y'
      \;\Longrightarrow\;
      8y' = 8
      \;\Longrightarrow\;
      y' = 1
      $$

      ### 5 · La recta

      Punto-pendiente con $P(-1,1)$ y $m=1$:

      $$
      y-1 = 1\cdot\left(x-(-1)\right) = x+1
      $$

      $$
      \boxed{\;y = x+2\;}
      $$

      ### 6 · Representación gráfica

      La curva es una **cuadrifolia**: cuatro pétalos que salen del origen, uno
      en cada cuadrante, simétricos respecto de los dos ejes y de las
      bisectrices. El punto $P(-1,1)$ está en la punta del pétalo del **segundo
      cuadrante** —sobre la bisectriz $y=-x$—, y la recta $y=x+2$ lo toca ahí
      pasando por $(0,2)$ y por $(-2,0)$.

      ### 7 · Comprobación

      **De la pendiente, por simetría.** La curva es simétrica respecto de la
      bisectriz $y=-x$, y $P$ está justo sobre ella. En el extremo de un pétalo
      la tangente es **perpendicular** al radio que va del origen al punto. Ese
      radio va de $(0,0)$ a $(-1,1)$ y tiene pendiente $-1$; la perpendicular
      tiene pendiente $+1$ ✔

      Esa comprobación geométrica confirma el resultado sin repetir la cuenta,
      que es lo que se busca de una comprobación.

      **Del punto:** la recta $y=x+2$ pasa por $(-1,1)$ porque
      $-1+2 = 1$ ✔

      **De que $P$ es el extremo del pétalo:** su distancia al origen es
      $\sqrt2$, y en la curva, escribiendo $x = r\cos\theta$,
      $y = r\,\mathrm{sen}\,\theta$, sale
      $r^{6} = 8r^{4}\cos^{2}\theta\,\mathrm{sen}^{2}\theta$, es decir
      $r^{2} = 2\,\mathrm{sen}^{2}(2\theta)$. El máximo de $r$ es $\sqrt2$, y se
      alcanza cuando $\mathrm{sen}(2\theta) = \pm1$: en las bisectrices ✔

  - id: derivada-parametrica
    titulo: Tres derivadas en función del parámetro
    fuente: >-
      Ejercicio 3.13 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular la derivada $\frac{dy}{dx}$ de las siguientes curvas en forma
      paramétrica en función del parámetro $t$.

      **(a)** $\begin{cases} x = t^{3}-t \\ y = 4-t^{2} \end{cases}$ ·
      **(b)** $\begin{cases} x = 2t^{3}+1 \\ y = t^{2}\cos t \end{cases}$ ·
      **(c)** $\begin{cases} x = 3\cos t \\ y = 2\,\mathrm{sen}\,t \end{cases}$
    pide: Calcular las tres derivadas en función de $t$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De dónde sale la fórmula
          $\frac{dy}{dx} = \frac{dy/dt}{dx/dt}$?
        opciones:
          - texto: >-
              De la **regla de la cadena**:
              $\frac{dy}{dt} = \frac{dy}{dx}\cdot\frac{dx}{dt}$, y se despeja
            correcta: true
            mensaje: |
              Eso es. No es «simplificar los $dt$»: es la cadena aplicada a
              $y$ como función de $x$ y $x$ como función de $t$. Y de ahí sale la
              hipótesis que hay que decir: hace falta $\frac{dx}{dt} \neq 0$.
          - texto: De simplificar los diferenciales como fracciones
            mensaje: |
              Es la forma de recordarla, pero no es una demostración: los
              diferenciales no son fracciones que se puedan cancelar sin
              justificación. La justificación es la regla de la cadena.
          - texto: De la definición de derivada como límite
            mensaje: |
              Se puede llegar así, pero es mucho más largo. El camino corto es la
              cadena.
          - texto: Es una definición nueva para curvas paramétricas
            mensaje: |
              No es una definición: es un **resultado** que se deduce de la
              cadena. Por eso arrastra la condición $\frac{dx}{dt}\neq0$.

      - tipo: calcular
        titulo: El instante donde falla la fórmula
        pregunta: |
          En el apartado (a), la fórmula deja de valer donde
          $\frac{dx}{dt} = 0$. ¿Cuál es el valor **positivo** de $t$ ahí?
        respuesta:
          tipo: numero
          valor: '0.5773503'
          tolerancia: 0.0005
          formato: un número, o una expresión como 1/√3
        distractores:
          - valor: '0'
            mensaje: |
              Con $t=0$ sale $\frac{dx}{dt} = 3\cdot0-1 = -1 \neq 0$. La
              ecuación es $3t^{2}-1 = 0$, no $3t^{2} = 0$.
          - valor: '1'
            mensaje: |
              Con $t=1$ sale $3-1 = 2 \neq 0$. Hay que resolver
              $3t^{2} = 1$, que da $t = \pm\frac{1}{\sqrt3} \approx 0{,}577$.
          - valor: '0.3333333'
            mensaje: |
              $\frac13$ es $t^{2}$, no $t$. Falta la raíz cuadrada:
              $t = \frac{1}{\sqrt3}$.
        pista: |
          $\frac{dx}{dt} = 3t^{2}-1$. Iguala a cero y despeja.
        desarrollo: |
          $$
          x(t) = t^{3}-t \;\Longrightarrow\; \frac{dx}{dt} = 3t^{2}-1
          $$

          $$
          3t^{2}-1 = 0 \;\Longrightarrow\; t = \pm\frac{1}{\sqrt3}
          \approx \pm0{,}577
          $$

          En esos dos valores la fórmula no se puede aplicar. Geométricamente,
          ahí la curva tiene **tangente vertical**: $x$ deja de variar mientras
          $y$ sigue cambiando.
        veredicto: |
          Señalar dónde falla la fórmula es parte de la respuesta. En esos
          puntos la derivada no es que valga infinito: es que $\frac{dy}{dx}$ no
          existe, aunque la curva sí tenga tangente.

      - tipo: justificar
        pregunta: |
          Ordena las tres derivadas y sus hipótesis. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **La fórmula.** Por la regla de la cadena,
              $\frac{dy}{dt} = \frac{dy}{dx}\frac{dx}{dt}$, de donde
              $\frac{dy}{dx} = \frac{dy/dt}{dx/dt}$ **siempre que**
              $\frac{dx}{dt}\neq0$.
          - texto: |
              **(a)** $\frac{dx}{dt} = 3t^{2}-1$ y $\frac{dy}{dt} = -2t$, luego
              $\frac{dy}{dx} = \dfrac{-2t}{3t^{2}-1}$.
          - texto: |
              **(b)** $\frac{dx}{dt} = 6t^{2}$ y
              $\frac{dy}{dt} = 2t\cos t - t^{2}\,\mathrm{sen}\,t$, luego
              $\frac{dy}{dx} = \dfrac{2\cos t - t\,\mathrm{sen}\,t}{6t}$ tras
              simplificar una $t$.
          - texto: |
              **(c)** $\frac{dx}{dt} = -3\,\mathrm{sen}\,t$ y
              $\frac{dy}{dt} = 2\cos t$, luego
              $\frac{dy}{dx} = -\dfrac{2\cos t}{3\,\mathrm{sen}\,t}$.
          - texto: |
              En cada caso hay que decir **dónde falla**: en (a) para
              $t = \pm\frac{1}{\sqrt3}$, en (b) para $t=0$ y en (c) para
              $t = k\pi$.
          - texto: |
              En (b) se puede simplificar la $t$ del numerador y el denominador
              sin más, porque el resultado es válido para todo $t$.
            trampa: true
            mensaje: |
              Simplificar es correcto **para $t\neq0$**, y hay que decirlo: en
              $t=0$ el denominador original $6t^{2}$ se anula y la fórmula no
              se puede aplicar. La expresión simplificada parece definida ahí
              —$\frac{2\cos t - t\,\mathrm{sen}\,t}{6t}$ tampoco lo está, mira el
              $6t$— pero el punto sigue fuera. Cancelar factores esconde
              restricciones.
        veredicto: |
          Cancelar una $t$ es legítimo y conveniente, pero la restricción
          $t\neq0$ viaja con el resultado. Es el mismo cuidado que con cualquier
          simplificación de un cociente.

    resolucion: |
      **Datos.** Tres curvas en paramétricas. Se pide $\frac{dy}{dx}$ en función
      de $t$.

      ### 1 · La fórmula y su hipótesis

      Si $y$ depende de $x$ y $x$ depende de $t$, la regla de la cadena da

      $$
      \frac{dy}{dt} = \frac{dy}{dx}\cdot\frac{dx}{dt}
      $$

      y despejando:

      $$
      \frac{dy}{dx} = \frac{dy/dt}{dx/dt},
      \qquad\text{siempre que}\qquad \frac{dx}{dt} \neq 0
      $$

      Esa condición no es un detalle: donde $\frac{dx}{dt}=0$ la curva tiene
      **tangente vertical** y $\frac{dy}{dx}$ no existe. Señalar esos puntos
      forma parte de la respuesta.

      ### 2 · (a) $x = t^{3}-t$, $y = 4-t^{2}$

      $$
      \frac{dx}{dt} = 3t^{2}-1, \qquad \frac{dy}{dt} = -2t
      $$

      $$
      \boxed{\frac{dy}{dx} = \frac{-2t}{3t^{2}-1}}
      $$

      **Dónde falla:** $3t^{2}-1 = 0$, es decir
      $t = \pm\frac{1}{\sqrt3} \approx \pm0{,}577$. Ahí la curva tiene tangente
      vertical.

      Y hay otro punto interesante: en $t=0$ el numerador se anula, así que
      $\frac{dy}{dx} = 0$ y la tangente es **horizontal**. La curva pasa por
      $(0,4)$ con tangente horizontal, que es su punto más alto.

      ### 3 · (b) $x = 2t^{3}+1$, $y = t^{2}\cos t$

      $$
      \frac{dx}{dt} = 6t^{2}
      $$

      Para $y$ hace falta la regla del producto:

      $$
      \frac{dy}{dt} = 2t\cos t + t^{2}\left(-\mathrm{sen}\,t\right)
      = 2t\cos t - t^{2}\,\mathrm{sen}\,t
      $$

      $$
      \frac{dy}{dx} = \frac{2t\cos t - t^{2}\,\mathrm{sen}\,t}{6t^{2}}
      $$

      Sacando factor común $t$ arriba y simplificando **para $t\neq0$**:

      $$
      \boxed{\frac{dy}{dx} = \frac{2\cos t - t\,\mathrm{sen}\,t}{6t}}
      $$

      **Dónde falla:** en $t=0$, donde $\frac{dx}{dt} = 0$. La simplificación no
      lo arregla: el $6t$ del denominador sigue anulándose ahí.

      ### 4 · (c) $x = 3\cos t$, $y = 2\,\mathrm{sen}\,t$

      $$
      \frac{dx}{dt} = -3\,\mathrm{sen}\,t, \qquad \frac{dy}{dt} = 2\cos t
      $$

      $$
      \boxed{\frac{dy}{dx} = \frac{2\cos t}{-3\,\mathrm{sen}\,t}
      = -\frac{2\cos t}{3\,\mathrm{sen}\,t}
      = -\frac{2}{3}\cot t}
      $$

      **Dónde falla:** $\mathrm{sen}\,t = 0$, es decir $t = k\pi$. Esos son los
      puntos $(\pm3,0)$, los extremos del eje mayor, donde la tangente es
      vertical.

      ### 5 · Qué curva es cada una

      La (c) merece un comentario porque se reconoce: eliminando el parámetro,

      $$
      \left(\frac{x}{3}\right)^{2}+\left(\frac{y}{2}\right)^{2}
      = \cos^{2}t+\mathrm{sen}^{2}t = 1
      $$

      es una **elipse** de semiejes 3 y 2. Y la derivada obtenida coincide con
      la que da la derivación implícita sobre esa ecuación:

      $$
      \frac{2x}{9}+\frac{2y\,y'}{4} = 0
      \;\Longrightarrow\;
      y' = -\frac{4x}{9y}
      = -\frac{4\cdot3\cos t}{9\cdot2\,\mathrm{sen}\,t}
      = -\frac{2\cos t}{3\,\mathrm{sen}\,t} \quad\checkmark
      $$

      Los dos métodos dan lo mismo, como tiene que ser.

      ### 6 · Comprobación

      **(a)** en $t=1$: el punto es $x = 0$, $y = 3$, y la derivada
      $\frac{-2}{2} = -1$.

      Se puede contrastar viendo por dónde pasa la curva cerca: en $t=1{,}1$,
      $x = 0{,}231$ e $y = 2{,}79$. La pendiente aproximada es

      $$
      \frac{2{,}79-3}{0{,}231-0} \approx -0{,}91
      $$

      cerca de $-1$, y se acerca más cuanto menor sea el salto ✔

      **(c)** en $t = \frac{\pi}{4}$: el punto es
      $\left(\frac{3\sqrt2}{2},\sqrt2\right) \approx (2{,}12,\,1{,}41)$ y la
      derivada vale $-\frac23$.

      Sustituyendo en la fórmula implícita:
      $-\frac{4\cdot2{,}12}{9\cdot1{,}41} = -\frac{8{,}49}{12{,}73}
      \approx -0{,}667 = -\frac23$ ✔

  - id: dos-tangentes-en-un-punto
    titulo: Un punto por el que la curva pasa dos veces
    fuente: >-
      Ejercicio 3.14 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular la ecuación de la recta tangente (o tangentes) de la curva

      $$
      \begin{cases}
      x = t^{5}-4t^{3} \\
      y = t^{2}
      \end{cases}
      $$

      en el punto $P(0,4)$.
    pide: Calcular la recta tangente o tangentes en $P$.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice «la recta tangente (o tangentes)». ¿Qué está
          avisando?
        opciones:
          - texto: >-
              Que el punto puede alcanzarse con **varios valores del parámetro**,
              y entonces hay varias tangentes
            correcta: true
            mensaje: |
              Exacto, y ese paréntesis es la pista del ejercicio. En una curva
              paramétrica un mismo punto del plano puede corresponder a dos $t$
              distintas: la curva pasa dos veces por ahí, con pendientes
              distintas.
          - texto: Que la tangente podría no existir
            mensaje: |
              El plural no sugiere ausencia sino multiplicidad. Y aquí existen:
              son dos.
          - texto: Que hay que dar la tangente y la normal
            mensaje: |
              La normal no se pide. El plural se refiere a varias **tangentes**,
              no a otra recta distinta.
          - texto: Que la curva no es derivable en $P$
            mensaje: |
              Sí lo es, en los dos pasos por el punto. Lo que ocurre es que hay
              dos pasos, cada uno con su derivada.

      - tipo: calcular
        titulo: Los valores del parámetro
        pregunta: |
          ¿Cuál es el valor **positivo** de $t$ para el que la curva pasa por
          $P(0,4)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              4 es la **ordenada** del punto, y $y = t^{2}$: hay que sacar la
              raíz. De $t^{2} = 4$ salen $t=2$ y $t=-2$.
          - valor: '0'
            mensaje: |
              Con $t=0$ sale $y=0$, no 4. El $t=0$ sí anula la $x$, pero hay que
              cumplir **las dos** ecuaciones a la vez.
          - valor: '1.4142136'
            mensaje: |
              $\sqrt2$ saldría de $t^{2}=2$. Aquí la ordenada es 4, así que
              $t^{2} = 4$ y $t = \pm2$.
        pista: |
          Hay que resolver **el sistema**: $t^{5}-4t^{3} = 0$ y $t^{2} = 4$ a la
          vez.
        desarrollo: |
          Hay que imponer las dos coordenadas:

          $$
          t^{2} = 4 \;\Longrightarrow\; t = \pm2
          $$

          $$
          t^{5}-4t^{3} = t^{3}\left(t^{2}-4\right) = 0
          \;\Longrightarrow\;
          t = 0 \;\text{ o }\; t = \pm2
          $$

          Los valores que cumplen **las dos** son $t = 2$ y $t = -2$. El
          positivo es $t=2$.

          El $t=0$ satisface la primera pero no la segunda: da el punto
          $(0,0)$, no $(0,4)$.
        veredicto: |
          Dos valores de $t$ para un mismo punto del plano: la curva pasa dos
          veces por $(0,4)$. De ahí las dos tangentes.

      - tipo: calcular
        titulo: La pendiente en uno de los pasos
        pregunta: |
          ¿Cuál es la pendiente de la tangente correspondiente a $t=2$?
        respuesta:
          tipo: numero
          valor: '0.125'
          tolerancia: 0.0005
          formato: un número, o una fracción como 1/8
        distractores:
          - valor: '-0.125'
            mensaje: |
              $-\frac18$ es la pendiente del **otro** paso, el de $t=-2$. Con
              $t=2$ el numerador $2t = 4$ es positivo y el denominador
              $5\cdot16-12\cdot4 = 32$ también.
          - valor: '8'
            mensaje: |
              8 es el inverso. La derivada es
              $\frac{dy/dt}{dx/dt} = \frac{4}{32} = \frac18$, no al revés.
          - valor: '0.25'
            mensaje: |
              $\frac14$ saldría de $\frac{4}{16}$. El denominador es
              $5t^{4}-12t^{2} = 80-48 = 32$, no 16.
        pista: |
          $\frac{dx}{dt} = 5t^{4}-12t^{2}$ y $\frac{dy}{dt} = 2t$. Evalúa en
          $t=2$.
        desarrollo: |
          $$
          \frac{dx}{dt} = 5t^{4}-12t^{2}, \qquad \frac{dy}{dt} = 2t
          $$

          $$
          \frac{dy}{dx} = \frac{2t}{5t^{4}-12t^{2}}
          $$

          En $t=2$:

          $$
          \frac{dy}{dx} = \frac{4}{5\cdot16-12\cdot4} = \frac{4}{80-48}
          = \frac{4}{32} = \frac{1}{8}
          $$

          Y en $t=-2$ sale $\frac{-4}{32} = -\frac18$, la opuesta.
        veredicto: |
          Las dos pendientes son opuestas, y no por casualidad: la curva es
          simétrica respecto del eje $OY$, porque $x$ es impar en $t$ e $y$ es
          par.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Buscar los parámetros.** Hay que resolver el sistema
              $t^{5}-4t^{3} = 0$ **y** $t^{2} = 4$. Sale $t = 2$ y $t = -2$: la
              curva pasa **dos veces** por $P$.
          - texto: |
              El $t=0$ cumple la primera ecuación pero no la segunda: da el
              punto $(0,0)$, no $(0,4)$. Hay que imponer **las dos**
              coordenadas.
          - texto: |
              **La derivada:**
              $\frac{dy}{dx} = \frac{2t}{5t^{4}-12t^{2}}$.
          - texto: |
              En $t=2$ vale $\frac{4}{32} = \frac18$, y en $t=-2$ vale
              $-\frac18$.
          - texto: |
              **Dos tangentes**, por punto-pendiente desde $(0,4)$:
              $y = 4+\frac{x}{8}$ y $y = 4-\frac{x}{8}$, o en compacto
              $y = 4 \pm \frac{x}{8}$.
          - texto: |
              Como el punto es uno solo, hay una sola tangente, y las dos
              pendientes obtenidas son la misma recta vista de dos formas.
            trampa: true
            mensaje: |
              $\frac18$ y $-\frac18$ son pendientes **distintas**, así que las
              rectas son distintas: una sube y otra baja. Que el punto sea uno no
              obliga a que la tangente lo sea — la curva se cruza consigo misma
              ahí, y en un punto de autointersección hay tantas tangentes como
              ramas pasen.
        veredicto: |
          $P(0,4)$ es un **punto doble** de la curva. Es exactamente lo que el
          «(o tangentes)» del enunciado estaba avisando.

    resolucion: |
      **Datos.** La curva $x = t^{5}-4t^{3}$, $y = t^{2}$, y el punto $P(0,4)$.
      Se piden las tangentes ahí.

      ### 1 · El aviso del enunciado

      «La recta tangente **(o tangentes)**». Ese paréntesis es la pista: en una
      curva paramétrica, un mismo punto del plano puede alcanzarse con **varios
      valores del parámetro**. Cada uno es un paso distinto de la curva por ese
      punto, y cada paso tiene su propia pendiente.

      ### 2 · Buscar los parámetros

      Hay que imponer **las dos** coordenadas a la vez:

      $$
      \begin{cases}
      t^{5}-4t^{3} = 0 \\
      t^{2} = 4
      \end{cases}
      $$

      De la segunda: $t = \pm2$.

      De la primera: $t^{3}\left(t^{2}-4\right) = 0$, que da $t=0$ y
      $t=\pm2$.

      Los valores comunes son $t=2$ y $t=-2$.

      **El $t=0$ hay que descartarlo explícitamente**: cumple la primera
      ecuación pero no la segunda, y corresponde al punto $(0,0)$. Es el error
      que se comete al resolver solo una de las dos.

      ### 3 · La derivada

      $$
      \frac{dx}{dt} = 5t^{4}-12t^{2},
      \qquad
      \frac{dy}{dt} = 2t
      $$

      $$
      \frac{dy}{dx} = \frac{2t}{5t^{4}-12t^{2}}
      $$

      Conviene comprobar que el denominador no se anula en los dos parámetros
      que interesan: $5\cdot16-12\cdot4 = 32 \neq 0$ ✔ para los dos, porque
      solo aparecen potencias pares de $t$.

      ### 4 · Las dos pendientes

      $$
      t=2: \quad \frac{dy}{dx} = \frac{4}{80-48} = \frac{4}{32} = \frac18
      $$

      $$
      t=-2: \quad \frac{dy}{dx} = \frac{-4}{80-48} = -\frac{4}{32} = -\frac18
      $$

      Son **opuestas**, y hay una razón: $x(t)$ es una función **impar** de $t$
      e $y(t)$ es **par**. Cambiar $t$ por $-t$ refleja la curva respecto del
      eje $OY$, y la curva es simétrica.

      ### 5 · Las rectas

      Punto-pendiente desde $P(0,4)$, que además es la ordenada en el origen:

      $$
      y = 4+\frac{1}{8}x
      \qquad\text{y}\qquad
      y = 4-\frac{1}{8}x
      $$

      $$
      \boxed{\;y = 4 \pm \frac{x}{8}\;}
      $$

      ### 6 · Qué está pasando en ese punto

      $P(0,4)$ es un **punto doble** de la curva: un punto donde se cruza
      consigo misma. La curva llega ahí una vez con $t=-2$ y otra con $t=2$, y
      en cada pasada lleva una dirección distinta.

      No es una singularidad ni un fallo: en cada rama por separado la curva es
      perfectamente suave. Simplemente hay **dos** ramas.

      ### 7 · Comprobación

      **De que los dos parámetros dan el mismo punto:**

      $$
      t=2: \quad x = 32-32 = 0, \quad y = 4 \quad\checkmark
      $$

      $$
      t=-2: \quad x = -32+32 = 0, \quad y = 4 \quad\checkmark
      $$

      **De las pendientes, numéricamente.** Cerca de $t=2$, con
      $t = 2{,}05$:

      $$
      x = 2{,}05^{5}-4\cdot2{,}05^{3} = 36{,}2-34{,}5 = 1{,}72,
      \qquad y = 4{,}20
      $$

      Pendiente aproximada:

      $$
      \frac{4{,}20-4}{1{,}72-0} \approx 0{,}116
      $$

      cerca de $\frac18 = 0{,}125$, y se acerca más cuanto menor sea el salto ✔

      **De la simetría:** con $t=-2{,}05$ sale $x = -1{,}72$ e $y = 4{,}20$, el
      punto reflejado. La pendiente aproximada es $-0{,}116$, la opuesta ✔

  - id: aproximar-con-el-diferencial
    titulo: Cuatro valores aproximados sin calculadora
    fuente: >-
      Ejercicio 3.15 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Utilizando el diferencial, aproximar los siguientes valores:

      **(a)** $e^{0,2}$ · **(b)** $\ln 0{,}9$ · **(c)** $\sqrt{27}$ ·
      **(d)** $\mathrm{sen}\,58^{\circ}$
    pide: Aproximar los cuatro valores con el diferencial.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que elegir antes de aplicar la fórmula del diferencial?
        opciones:
          - texto: >-
              El **punto de apoyo**: el más cercano donde la función se sepa de
              memoria
            correcta: true
            mensaje: |
              Eso es toda la técnica. La fórmula
              $f(a+h) \approx f(a)+f'(a)h$ solo sirve si $f(a)$ y $f'(a)$ se
              conocen exactamente. Para $\sqrt{27}$ el apoyo es 25, no 27 ni 30:
              es el cuadrado perfecto más cercano.
          - texto: El número de decimales que se quieren
            mensaje: |
              La precisión no se elige: sale de lo cerca que esté el punto de
              apoyo. Lo que se elige es el apoyo, y de ahí sale la precisión.
          - texto: Si usar la derivada primera o la segunda
            mensaje: |
              El diferencial usa **solo la primera**: es la aproximación por la
              recta tangente. Con la segunda se pasaría al polinomio de Taylor de
              orden 2, que es otro tema.
          - texto: Nada, la fórmula se aplica directamente
            mensaje: |
              Sin elegir el punto no hay fórmula que aplicar: $a$ y $h$ son
              justamente lo que hay que decidir.

      - tipo: calcular
        titulo: La raíz
        pregunta: |
          ¿Cuánto sale $\sqrt{27}$ aproximado por el diferencial desde $a=25$?
        respuesta:
          tipo: numero
          valor: '5.2'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              4 es $\sqrt{16}$: has elegido el otro cuadrado perfecto cercano y
              además no has corregido nada. Con $a=16$ habría que sumar
              $f'(16)\cdot11 = \frac{11}{8}$, y saldría $5{,}375$ — peor
              aproximación que desde 25, porque 16 está mucho más lejos de 27.
          - valor: '5'
            mensaje: |
              5 es $\sqrt{25}$, el punto de apoyo sin corregir. Falta sumar
              $f'(25)\cdot2$.
          - valor: '5.4'
            mensaje: |
              $5{,}4$ saldría de usar $f'(25) = \frac15$ en vez de
              $\frac{1}{10}$. La derivada de $\sqrt x$ es
              $\frac{1}{2\sqrt x}$, con el 2 en el denominador.
        pista: |
          $f(x) = \sqrt x$, $a = 25$, $h = 2$. Y
          $f'(x) = \frac{1}{2\sqrt x}$.
        desarrollo: |
          $$
          f(x) = \sqrt x, \qquad f'(x) = \frac{1}{2\sqrt x}
          $$

          Se apoya en $a=25$, el cuadrado perfecto más cercano, con $h = 2$:

          $$
          f(25) = 5, \qquad f'(25) = \frac{1}{2\cdot5} = \frac{1}{10}
          $$

          $$
          \sqrt{27} \approx 5+\frac{1}{10}\cdot 2 = 5+0{,}2 = \frac{26}{5} = 5{,}2
          $$

          El valor exacto es $5{,}19615$: el error es de $0{,}004$, menos del
          0,1 %.
        veredicto: |
          La aproximación sale **por encima**. No es casualidad: $\sqrt x$ es
          cóncava y su recta tangente queda siempre por arriba de la curva.

      - tipo: calcular
        titulo: El ángulo
        pregunta: |
          Para aproximar $\mathrm{sen}\,58^{\circ}$ hay que apoyarse en
          $60^{\circ}$. ¿Cuánto vale $h$ en radianes?
        respuesta:
          tipo: numero
          valor: '-0.0349066'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              $-2$ es el salto en **grados**, y la fórmula de la derivada del
              seno solo vale en **radianes**. Hay que convertir:
              $-2^{\circ} = -\frac{2\pi}{180} = -\frac{\pi}{90}$.
          - valor: '0.0349066'
            mensaje: |
              El valor absoluto es correcto, pero falta el signo: se va de
              $60^{\circ}$ **hacia abajo**, a $58^{\circ}$, así que $h$ es
              negativo.
          - valor: '-0.0174533'
            mensaje: |
              $-\frac{\pi}{180}$ es **un** grado en radianes. El salto es de dos
              grados, así que el doble.
        pista: |
          $58^{\circ}-60^{\circ} = -2^{\circ}$, y un grado son
          $\frac{\pi}{180}$ radianes.
        desarrollo: |
          El punto de apoyo es $60^{\circ}$, cuyo seno y coseno se saben de
          memoria. El salto es

          $$
          h = 58^{\circ}-60^{\circ} = -2^{\circ}
          = -\frac{2\pi}{180} = -\frac{\pi}{90} \approx -0{,}0349
          $$

          **En radianes**, porque la fórmula $\left(\mathrm{sen}\,x\right)' =
          \cos x$ solo vale ahí.

          $$
          \mathrm{sen}\,58^{\circ} \approx \mathrm{sen}\,60^{\circ}
          + \cos 60^{\circ}\cdot\left(-\frac{\pi}{90}\right)
          = \frac{\sqrt3}{2}-\frac{1}{2}\cdot\frac{\pi}{90}
          = \frac{\sqrt3}{2}-\frac{\pi}{180}
          $$

          $$
          \approx 0{,}8660-0{,}0175 = 0{,}8485
          $$
        veredicto: |
          Convertir a radianes es el paso que más se olvida, y no es un detalle:
          con grados la corrección saldría 115 veces más grande.

      - tipo: justificar
        pregunta: |
          Ordena el método y los cuatro resultados. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **La idea.** Cerca de un punto, la función y su recta tangente casi
              coinciden: $f(a+h) \approx f(a)+f'(a)\,h$.
          - texto: |
              **El punto de apoyo** se elige donde $f(a)$ y $f'(a)$ se sepan
              exactamente, y lo más cerca posible del valor buscado.
          - texto: |
              **(a)** $f=e^{x}$, $a=0$, $h=0{,}2$:
              $e^{0,2} \approx 1+1\cdot0{,}2 = 1{,}2$.
          - texto: |
              **(b)** $f=\ln x$, $a=1$, $h=-0{,}1$:
              $\ln0{,}9 \approx 0+1\cdot(-0{,}1) = -0{,}1$.
          - texto: |
              **(c)** $f=\sqrt x$, $a=25$, $h=2$:
              $\sqrt{27} \approx 5+\frac{2}{10} = \frac{26}{5} = 5{,}2$.
              **(d)** $f=\mathrm{sen}\,x$, $a=\frac{\pi}{3}$,
              $h=-\frac{\pi}{90}$:
              $\mathrm{sen}\,58^{\circ} \approx \frac{\sqrt3}{2}-\frac{\pi}{180}
              \approx 0{,}8485$.
          - texto: |
              Cuanto más lejos esté el punto de apoyo, mejor es la
              aproximación, porque la recta tangente abarca más.
            trampa: true
            mensaje: |
              Justo al revés: la aproximación es **local**. Cuanto más se aleja
              uno del punto de apoyo, más se separan la curva y su tangente. Por
              eso en (c) se elige 25 y no 16, aunque los dos sean cuadrados
              perfectos: 25 está más cerca de 27.
        veredicto: |
          El error del diferencial crece con $h^{2}$, así que duplicar la
          distancia multiplica el error por cuatro. Cerca siempre.

    resolucion: |
      **Datos.** Cuatro valores que aproximar con el diferencial.

      ### 1 · La herramienta

      Cerca de un punto, la función y su recta tangente casi no se distinguen:

      $$
      f(a+h) \approx f(a)+f'(a)\,h
      $$

      Para que sirva hacen falta dos cosas: que $f(a)$ y $f'(a)$ se conozcan
      **exactamente**, y que $h$ sea **pequeño**. Elegir bien el punto de apoyo
      es todo el ejercicio.

      ### 2 · (a) $e^{0,2}$

      $$
      f(x) = e^{x}, \qquad f'(x) = e^{x}, \qquad a = 0, \qquad h = 0{,}2
      $$

      $$
      e^{0,2} \approx e^{0}+e^{0}\cdot0{,}2 = 1+0{,}2 = 1{,}2
      $$

      Valor exacto: $1{,}2214$. Error: $0{,}021$, un 1,8 %.

      ### 3 · (b) $\ln 0{,}9$

      $$
      f(x) = \ln x, \qquad f'(x) = \frac{1}{x}, \qquad a = 1, \qquad h = -0{,}1
      $$

      El apoyo es 1 porque $\ln 1 = 0$ es el único logaritmo que se sabe sin
      pensar.

      $$
      \ln 0{,}9 \approx 0+1\cdot(-0{,}1) = -0{,}1
      $$

      Valor exacto: $-0{,}10536$. Error: $0{,}005$.

      El signo negativo era de esperar: $0{,}9 < 1$ y el logaritmo de un número
      menor que 1 es negativo.

      ### 4 · (c) $\sqrt{27}$

      $$
      f(x) = \sqrt x, \qquad f'(x) = \frac{1}{2\sqrt x}
      $$

      El apoyo es $a = 25$: el **cuadrado perfecto más cercano** a 27. Con
      $h=2$:

      $$
      \sqrt{27} \approx 5+\frac{1}{2\cdot5}\cdot2 = 5+\frac{2}{10}
      = \frac{26}{5} = 5{,}2
      $$

      Valor exacto: $5{,}19615$. Error: $0{,}004$, menos del 0,1 %.

      Conviene decir por qué no se elige 16, que también es cuadrado perfecto:
      está mucho más lejos, y el error crece con el cuadrado de la distancia.

      ### 5 · (d) $\mathrm{sen}\,58^{\circ}$

      El apoyo natural es $60^{\circ}$, cuyo seno y coseno se saben de memoria.
      Y aquí está el paso que más se falla:

      $$
      h = 58^{\circ}-60^{\circ} = -2^{\circ}
      = -\frac{2\pi}{180} = -\frac{\pi}{90} \approx -0{,}0349
      $$

      **En radianes.** La fórmula $\left(\mathrm{sen}\,x\right)' = \cos x$ solo
      es cierta con el ángulo en radianes; con grados habría un factor
      $\frac{\pi}{180}$ escondido.

      $$
      \mathrm{sen}\,58^{\circ}
      \approx \mathrm{sen}\,\frac{\pi}{3}+\cos\frac{\pi}{3}\cdot\left(-\frac{\pi}{90}\right)
      = \frac{\sqrt3}{2}-\frac{1}{2}\cdot\frac{\pi}{90}
      = \frac{\sqrt3}{2}-\frac{\pi}{180}
      $$

      $$
      \approx 0{,}86603-0{,}01745 = 0{,}84858
      $$

      Valor exacto: $0{,}84805$. Error: $0{,}0005$.

      ### 6 · Comprobación y sentido del error

      | | aproximado | exacto | error | ¿por encima o por debajo? |
      |---|---|---|---|---|
      | (a) $e^{0,2}$ | $1{,}2$ | $1{,}2214$ | $0{,}021$ | por debajo |
      | (b) $\ln0{,}9$ | $-0{,}1$ | $-0{,}10536$ | $0{,}005$ | por encima |
      | (c) $\sqrt{27}$ | $5{,}2$ | $5{,}19615$ | $0{,}004$ | por encima |
      | (d) $\mathrm{sen}\,58^{\circ}$ | $0{,}84858$ | $0{,}84805$ | $0{,}0005$ | por encima |

      El sentido del error **no es aleatorio**, y saberlo es una comprobación en
      sí misma: la tangente queda por debajo de la curva donde la función es
      **convexa** ($f''>0$) y por encima donde es **cóncava** ($f''<0$).

      - $e^{x}$ es convexa, así que la aproximación se queda corta ✔
      - $\ln x$, $\sqrt x$ y $\mathrm{sen}\,x$ en el primer cuadrante son
        cóncavas, así que la aproximación se pasa ✔

      Los cuatro casos encajan. Si alguno no lo hiciera, habría un error de
      signo en algún sitio.

      ### Resultado

      $$
      \boxed{\;e^{0,2} \approx 1{,}2 \qquad \ln0{,}9 \approx -0{,}1
      \qquad \sqrt{27} \approx \tfrac{26}{5} = 5{,}2
      \qquad \mathrm{sen}\,58^{\circ} \approx \tfrac{\sqrt3}{2}-\tfrac{\pi}{180}
      \approx 0{,}8485\;}
      $$

  - id: carretera-con-tramo-parabolico
    titulo: Tres tramos de carretera que tienen que empalmar suave
    fuente: >-
      Ejercicio 3.16 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU ·
      Cayó en 2014/2015 5E
    nivel: practica
    enunciado: |
      Se van a construir tres tramos de carretera, dos de ellos rectos, con
      pendientes del 6 % y el 4 % respectivamente, y un tramo central
      parabólico. El tramo parabólico mide 2 km en horizontal, y empalma con la
      recta de subida en su extremo izquierdo, $A$, y con la de bajada en el
      derecho, $B$.

      Calcular las ecuaciones de los tres tramos.
    pide: Calcular las ecuaciones de los tres tramos.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué significa que una carretera «empalme» con otra en un punto?
        opciones:
          - texto: >-
              Que coinciden la **altura** y la **pendiente**: continuidad y
              derivabilidad
            correcta: true
            mensaje: |
              Eso es. Si solo coincidiera la altura habría un cambio brusco de
              inclinación —un pico, imposible de conducir—. Empalmar suave es
              exactamente ser derivable, y ahí está el contenido físico del
              ejercicio.
          - texto: Solo que coinciden las alturas
            mensaje: |
              Con solo la altura habría un vértice: el coche pasaría de subir al
              6 % a subir al 2 % de golpe. Una carretera necesita que también
              coincida la pendiente.
          - texto: Que las dos tienen la misma longitud
            mensaje: |
              Las longitudes no tienen por qué coincidir, y el enunciado no las
              da. Lo que se empalma son altura y pendiente.
          - texto: Que se cortan en un punto
            mensaje: |
              Cortarse es solo la continuidad. Dos rectas que se cruzan se cortan
              y no empalman: forman un pico.

      - tipo: calcular
        titulo: El coeficiente cuadrático
        pregunta: |
          Si el tramo parabólico es $y = ax^{2}+bx$ con origen en $A$, ¿cuánto
          vale $a$?
        respuesta:
          tipo: numero
          valor: '-0.025'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0.025'
            mensaje: |
              Falta el signo. La parábola tiene que **girar hacia abajo** para
              pasar de subir al 6 % a bajar al 4 %, así que $a<0$.
          - valor: '-0.05'
            mensaje: |
              $-0{,}05$ saldría de olvidar el 2 del denominador. De
              $2a\cdot2 = -0{,}10$ sale $a = -0{,}025$.
          - valor: '-0.01'
            mensaje: |
              $-0{,}01$ es la diferencia entre las pendientes dividida entre 10.
              La cuenta es $\frac{-0{,}04-0{,}06}{2\cdot2} = -0{,}025$.
        pista: |
          La pendiente en $x=0$ es $0{,}06$ y en $x=2$ es $-0{,}04$. Y la
          derivada de $ax^{2}+bx$ es $2ax+b$.
        desarrollo: |
          Poniendo el origen en $A$, el tramo parabólico es $y = ax^{2}+bx$ —sin
          término independiente, porque pasa por el origen— y su derivada es

          $$
          y' = 2ax+b
          $$

          **En $A$ ($x=0$)** la pendiente tiene que ser la de la recta de
          subida, el 6 %:

          $$
          y'(0) = b = 0{,}06
          $$

          **En $B$ ($x=2$)** tiene que ser la de la recta de bajada, el 4 % pero
          **descendiendo**:

          $$
          y'(2) = 4a+0{,}06 = -0{,}04
          \;\Longrightarrow\;
          4a = -0{,}10
          \;\Longrightarrow\;
          a = -0{,}025
          $$
        veredicto: |
          El signo del 4 % es la trampa del enunciado: la carretera **baja**,
          así que su pendiente es $-0{,}04$, no $+0{,}04$.

      - tipo: calcular
        titulo: La altura de B
        pregunta: |
          ¿A qué altura está $B$ respecto de $A$, en kilómetros?
        respuesta:
          tipo: numero
          valor: '0.02'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0.12'
            mensaje: |
              $0{,}12$ sería la altura si la carretera siguiera subiendo al 6 %
              durante los 2 km. Pero la parábola se va aplanando y luego baja:
              gana bastante menos.
          - valor: '0.1'
            mensaje: |
              $0{,}1$ es la ordenada en el origen de la **tercera** recta,
              escrita en el sistema original. No es la altura de $B$ sobre $A$.
          - valor: '0'
            mensaje: |
              Si $B$ estuviera a la misma altura que $A$, la parábola sería
              simétrica respecto del punto medio y las dos pendientes serían
              opuestas: $+6\%$ y $-6\%$. Aquí son $6\%$ y $4\%$.
        pista: |
          Evalúa $y = -0{,}025x^{2}+0{,}06x$ en $x=2$.
        desarrollo: |
          $$
          y(2) = -0{,}025\cdot4+0{,}06\cdot2 = -0{,}1+0{,}12 = 0{,}02
          $$

          $B$ está **20 metros por encima** de $A$.

          Tiene sentido: durante los 2 km la carretera sube cada vez menos
          —pasa del 6 % a $-4$ %— y acaba bajando, así que gana mucho menos que
          los 120 m que ganaría al 6 % constante.
        veredicto: |
          La cima está donde $y'=0$, es decir en $x = \frac{0{,}06}{0{,}05}
          = 1{,}2$ km, y ahí la altura es $0{,}036$ km: el punto más alto de la
          carretera.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Elegir el sistema de referencia.** Se pone el origen en $A$, el
              principio del tramo parabólico: así el tramo central no tiene
              término independiente.
          - texto: |
              **Pendientes en porcentaje.** Un 6 % significa pendiente
              $0{,}06$, y el tramo que baja al 4 % tiene pendiente
              $-0{,}04$.
          - texto: |
              **Empalme suave en $A$:** $y'(0) = b = 0{,}06$.
              **Empalme suave en $B$:** $y'(2) = 4a+b = -0{,}04$, de donde
              $a = -0{,}025$.
          - texto: |
              El tramo central es $y = -0{,}025x^{2}+0{,}06x$ para
              $0<x<2$, y el primero es la recta $y = 0{,}06x$ para $x<0$.
          - texto: |
              El tercero pasa por $B = (2,\;0{,}02)$ con pendiente $-0{,}04$:
              $y = -0{,}04x+0{,}1$ para $x>2$.
          - texto: |
              Como los tres tramos empalman, basta imponer que las alturas
              coincidan en $A$ y en $B$.
            trampa: true
            mensaje: |
              Con solo las alturas la carretera tendría **picos** en $A$ y en
              $B$: el vehículo pasaría de una inclinación a otra de golpe. Lo
              que se impone —y lo que da las ecuaciones— es que coincidan
              también las **pendientes**, es decir que la función sea derivable.
              Las alturas salen después, como consecuencia.
        veredicto: |
          Este ejercicio es el 3.6 con un contexto físico: allí se pedía
          derivabilidad en abstracto, aquí es que el coche no pegue un salto.

    resolucion: |
      **Datos.** Dos tramos rectos con pendientes del 6 % y del 4 %, unidos por
      un tramo parabólico de 2 km de longitud horizontal.

      ### 1 · Qué significa «empalmar» en una carretera

      Este es el contenido del ejercicio, y es físico antes que matemático.

      Si dos tramos solo coincidieran en **altura**, el vehículo pasaría de una
      inclinación a otra de golpe: un vértice. Para que la carretera sea
      transitable las pendientes también tienen que coincidir.

      $$
      \text{empalmar suave} \iff \text{misma altura} \;\wedge\;
      \text{misma pendiente} \iff \text{derivable}
      $$

      **Y son las pendientes las que dan las ecuaciones.** Las alturas salen
      después, como consecuencia.

      ### 2 · Elegir el sistema de referencia

      Conviene poner el **origen en $A$**, donde empieza el tramo parabólico.
      Así:

      - el tramo central pasa por $(0,0)$ y no tiene término independiente,
      - $B$ está en $x=2$.

      Elegir bien el origen ahorra una incógnita. Con el origen en otro sitio
      el problema sale igual, pero con más cuentas.

      ### 3 · Las pendientes, con su signo

      Un **6 %** significa que se sube 6 m por cada 100 m horizontales, es decir
      pendiente $0{,}06$.

      Y el 4 % es de **bajada**, así que su pendiente es $-0{,}04$. Ese signo es
      la trampa del enunciado: el dibujo lo deja claro, el texto no.

      ### 4 · El tramo parabólico

      $$
      y = ax^{2}+bx, \qquad y' = 2ax+b
      $$

      **En $A$**, es decir $x=0$:

      $$
      y'(0) = b = 0{,}06
      $$

      **En $B$**, es decir $x=2$:

      $$
      y'(2) = 4a+0{,}06 = -0{,}04
      \;\Longrightarrow\;
      4a = -0{,}10
      \;\Longrightarrow\;
      a = -0{,}025
      $$

      $$
      \boxed{y = -0{,}025x^{2}+0{,}06x \qquad 0<x<2}
      $$

      El signo de $a$ es negativo, como tenía que ser: la parábola abre hacia
      abajo para poder pasar de subir a bajar.

      ### 5 · Los tramos rectos

      **El primero** pasa por el origen con pendiente $0{,}06$:

      $$
      \boxed{y = 0{,}06x \qquad x<0}
      $$

      **El tercero** pasa por $B$ con pendiente $-0{,}04$. La altura de $B$:

      $$
      y(2) = -0{,}025\cdot4+0{,}06\cdot2 = -0{,}1+0{,}12 = 0{,}02
      $$

      Punto-pendiente desde $B = (2,\;0{,}02)$:

      $$
      y-0{,}02 = -0{,}04(x-2)
      \;\Longrightarrow\;
      y = -0{,}04x+0{,}08+0{,}02
      $$

      $$
      \boxed{y = -0{,}04x+0{,}1 \qquad x>2}
      $$

      ### 6 · Lo que sale de propina

      **La cima.** El punto más alto está donde $y'=0$:

      $$
      -0{,}05x+0{,}06 = 0 \;\Longrightarrow\; x = 1{,}2 \text{ km}
      $$

      $$
      y(1{,}2) = -0{,}025\cdot1{,}44+0{,}06\cdot1{,}2 = -0{,}036+0{,}072
      = 0{,}036 \text{ km}
      $$

      La carretera alcanza su altura máxima 1,2 km después de $A$, 36 m por
      encima de él.

      **El desnivel neto.** $B$ está solo 20 m por encima de $A$, cuando al 6 %
      constante habría ganado 120 m. La diferencia es lo que se «pierde» al
      aplanar y empezar a bajar.

      ### 7 · Comprobación

      Los dos empalmes, altura y pendiente:

      | | tramo izquierdo | tramo derecho | ¿pega? |
      |---|---|---|---|
      | $A$ ($x=0$), altura | $0$ | $0$ | ✔ |
      | $A$, pendiente | $0{,}06$ | $0{,}06$ | ✔ |
      | $B$ ($x=2$), altura | $0{,}02$ | $-0{,}08+0{,}1 = 0{,}02$ | ✔ |
      | $B$, pendiente | $-0{,}05\cdot2+0{,}06 = -0{,}04$ | $-0{,}04$ | ✔ |

      Los cuatro cuadran. Y una comprobación de sentido común: la parábola llega
      a su cima en $x=1{,}2$, que está **dentro** del tramo $(0,2)$. Si la cima
      hubiera caído fuera, el diseño sería incoherente con el dibujo.

      ### Resultado

      $$
      \boxed{\;y(x) = \begin{cases}
      0{,}06x & x<0 \\[4pt]
      -0{,}025x^{2}+0{,}06x & 0<x<2 \\[4pt]
      -0{,}04x+0{,}1 & x>2
      \end{cases}\;}
      $$

  - id: coche-y-edificio
    titulo: A qué velocidad se aleja el coche del incendio
    fuente: >-
      Ejercicio 3.17 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      El coche de la figura se desplaza hacia la derecha a una velocidad
      constante de 5 km/h por una carretera recta. El edificio en llamas está
      al final de una carretera perpendicular, a 3 km del cruce, y en ese
      instante el coche está a 4 km del cruce.

      ¿A qué velocidad se está alejando del edificio en llamas?
    pide: Calcular la velocidad de alejamiento.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es el error que hay que evitar en este tipo de problema?
        opciones:
          - texto: >-
              **Sustituir los datos antes de derivar**: eso congela lo que debía
              variar
            correcta: true
            mensaje: |
              Ese es exactamente el error. Si se pone $x=4$ en
              $d^{2} = x^{2}+9$ queda $d^{2}=25$, una constante, y su derivada
              es 0. Primero se deriva la relación **general**, y los números del
              instante se meten al final.
          - texto: Olvidar el teorema de Pitágoras
            mensaje: |
              Pitágoras se usa, y casi nadie lo olvida: es lo primero que se ve.
              El error está en **cuándo** se sustituyen los números, no en la
              relación.
          - texto: Confundir kilómetros con metros
            mensaje: |
              Todas las magnitudes están en km y la velocidad en km/h: las
              unidades son coherentes y no hay que convertir nada.
          - texto: Derivar respecto de $x$ en vez de respecto de $d$
            mensaje: |
              Hay que derivar respecto del **tiempo**, que es la variable que
              gobierna el movimiento. Ni $x$ ni $d$ son la variable
              independiente aquí: las dos dependen de $t$.

      - tipo: calcular
        titulo: La distancia en ese instante
        pregunta: |
          ¿A qué distancia del edificio está el coche en ese instante, en km?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '7'
            mensaje: |
              7 es $3+4$, la suma de los dos catetos. Pero el coche no va por la
              esquina: está en línea recta con el edificio, y esa recta es la
              **hipotenusa**.
          - valor: '4'
            mensaje: |
              4 km es lo que el coche ha recorrido por su carretera, uno de los
              catetos. Falta combinarlo con los 3 km del otro.
          - valor: '25'
            mensaje: |
              25 es $d^{2}$. Falta la raíz cuadrada.
        pista: |
          Los dos tramos son perpendiculares: Pitágoras con catetos 3 y 4.
        desarrollo: |
          Las dos carreteras son perpendiculares, así que la distancia en línea
          recta es la hipotenusa:

          $$
          d = \sqrt{3^{2}+4^{2}} = \sqrt{9+16} = \sqrt{25} = 5 \text{ km}
          $$

          Un triángulo 3-4-5, que es lo que el enunciado ha elegido para que las
          cuentas salgan redondas.
        veredicto: |
          Ese 5 es un dato del **instante**, no una constante: dentro de un rato
          la distancia será otra. Por eso no se puede sustituir antes de
          derivar.

      - tipo: calcular
        titulo: La velocidad de alejamiento
        pregunta: |
          ¿A qué velocidad se aleja el coche del edificio, en km/h?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '5'
            mensaje: |
              5 km/h es la velocidad del **coche por su carretera**. Alejarse
              del edificio es más lento, porque parte del movimiento es
              «lateral» respecto de la línea que los une.
          - valor: '3'
            mensaje: |
              3 es el cateto fijo, la distancia del edificio al cruce. La
              velocidad sale de $\frac{x}{d}\cdot v = \frac45\cdot5$.
          - valor: '6.25'
            mensaje: |
              $6{,}25$ sería $\frac{5\cdot5}{4}$, la fracción invertida. La
              fórmula es $d' = \frac{x}{d}x'$, con $x$ arriba.
        pista: |
          Deriva $d^{2} = x^{2}+9$ respecto del tiempo y **luego** sustituye.
        desarrollo: |
          **Relación general**, con $x(t)$ la distancia del coche al cruce y
          $d(t)$ la distancia al edificio:

          $$
          d^{2} = x^{2}+3^{2}
          $$

          **Derivando respecto del tiempo**, con la regla de la cadena en los
          dos lados —el 9 es constante y desaparece—:

          $$
          2d\,\frac{dd}{dt} = 2x\,\frac{dx}{dt}
          \;\Longrightarrow\;
          \frac{dd}{dt} = \frac{x}{d}\cdot\frac{dx}{dt}
          $$

          **Y solo ahora** se sustituyen los datos del instante: $x=4$, $d=5$ y
          $\frac{dx}{dt} = 5$:

          $$
          \frac{dd}{dt} = \frac{4}{5}\cdot5 = 4 \text{ km/h}
          $$
        veredicto: |
          Menos que los 5 km/h del coche, y tiene sentido: solo la componente
          del movimiento **en la dirección** que une coche y edificio cuenta
          para alejarse.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Nombrar las magnitudes como funciones del tiempo:** $x(t)$ es la
              distancia del coche al cruce y $d(t)$ la distancia al edificio. El
              3 es constante.
          - texto: |
              **Relación geométrica**, por Pitágoras:
              $d(t)^{2} = x(t)^{2}+9$.
          - texto: |
              **Derivar respecto del tiempo**, sin sustituir todavía:
              $2d\,d' = 2x\,x'$, es decir $d' = \frac{x}{d}\,x'$.
          - texto: |
              **Ahora sí, los datos del instante:** $x=4$, $x'=5$, y
              $d = \sqrt{16+9} = 5$.
          - texto: |
              $d' = \frac45\cdot5 = 4$ km/h, menor que la velocidad del coche.
          - texto: |
              Como en ese instante $d=5$, se sustituye en la relación antes de
              derivar y queda $d^{2}=25$.
            trampa: true
            mensaje: |
              Ese es el error que define el ejercicio. Sustituir antes de
              derivar convierte una relación **entre funciones del tiempo** en
              una igualdad numérica, y la derivada de una constante es 0: saldría
              que el coche no se aleja. El 5 vale solo en ese instante, no
              siempre.
        veredicto: |
          La regla, en una frase: **deriva la relación, sustituye después**. Los
          datos del instante son la última línea, nunca la primera.

    resolucion: |
      **Datos.** Coche a 5 km/h por una carretera recta, edificio a 3 km del
      cruce en la perpendicular, coche a 4 km del cruce en ese instante.

      ### 1 · Nombrar las magnitudes como funciones del tiempo

      Es el paso que hace posible todo lo demás:

      | símbolo | qué es | ¿varía? |
      |---|---|---|
      | $x(t)$ | distancia del coche al cruce | sí, $x' = 5$ km/h |
      | $d(t)$ | distancia del coche al edificio | sí, es la incógnita |
      | $3$ | distancia del edificio al cruce | **no**, es constante |

      Que el 3 sea constante y el 4 no lo sea es toda la diferencia. El 4 es un
      **valor en un instante**; el 3 es un dato del problema.

      ### 2 · La relación geométrica

      Las dos carreteras son perpendiculares, así que el coche, el cruce y el
      edificio forman un triángulo rectángulo. Por Pitágoras:

      $$
      d(t)^{2} = x(t)^{2}+3^{2} = x(t)^{2}+9
      $$

      **Escrita en general**, con las funciones del tiempo. Sin sustituir nada.

      ### 3 · Derivar respecto del tiempo

      $$
      2d\,\frac{dd}{dt} = 2x\,\frac{dx}{dt}
      $$

      —el 9 es constante y su derivada es 0—. Simplificando:

      $$
      \frac{dd}{dt} = \frac{x}{d}\cdot\frac{dx}{dt}
      $$

      ### 4 · Ahora sí: los datos del instante

      $$
      x = 4, \qquad \frac{dx}{dt} = 5, \qquad
      d = \sqrt{4^{2}+3^{2}} = 5
      $$

      $$
      \frac{dd}{dt} = \frac{4}{5}\cdot 5 = 4 \text{ km/h}
      $$

      $$
      \boxed{\;v = 4 \text{ km/h}\;}
      $$

      ### 5 · El error que este problema está diseñado para provocar

      Si se sustituye **antes** de derivar:

      $$
      d^{2} = 4^{2}+9 = 25 \;\Longrightarrow\; d = 5
      $$

      una constante. Y su derivada es **cero**: saldría que el coche no se aleja
      del edificio, lo cual es absurdo.

      El fallo es conceptual, no de cuentas: al sustituir se congela lo que
      debía variar. Los números del instante describen **una foto**, y la
      derivada mide el cambio entre fotos.

      **La regla: deriva la relación, sustituye después.**

      ### 6 · Por qué 4 y no 5

      El resultado es **menor** que la velocidad del coche, y eso tiene una
      explicación geométrica que merece la pena escribir.

      Solo la componente del movimiento **en la dirección que une coche y
      edificio** contribuye a alejarse. La otra componente lo hace girar
      alrededor del edificio sin cambiar la distancia.

      El factor $\frac{x}{d} = \frac45$ es justamente el coseno del ángulo entre
      la carretera y la línea coche-edificio:

      $$
      \frac{dd}{dt} = v\cos\theta = 5\cdot\frac45 = 4
      $$

      ### 7 · Comprobación

      **Casos límite**, que confirman la fórmula sin repetir la cuenta:

      - Si el coche estuviera **en el cruce** ($x=0$), sería
        $\frac{dd}{dt} = 0$: en ese instante se mueve perpendicularmente a la
        línea que lo une con el edificio, así que no se aleja nada ✔
      - Si estuviera **muy lejos** ($x \to \infty$), entonces
        $\frac{x}{d} \to 1$ y $\frac{dd}{dt} \to 5$: de lejos, la carretera y la
        línea al edificio son casi paralelas ✔

      Los dos extremos encajan, y el caso del problema queda entre ellos.

      **Numéricamente**, con un salto pequeño: un minuto después
      —$\frac{1}{60}$ h— el coche ha avanzado $\frac{5}{60} = 0{,}0833$ km, y
      entonces

      $$
      d = \sqrt{4{,}0833^{2}+9} = \sqrt{16{,}6733+9} = 5{,}0669
      $$

      $$
      \frac{5{,}0669-5}{1/60} \approx 4{,}01 \text{ km/h} \quad\checkmark
      $$

  - id: avion-y-radar
    titulo: La velocidad de un avión medida por su ángulo
    fuente: >-
      Ejercicio 3.18 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Un avión vuela con una velocidad y una altitud de $h = 6$ km constantes
      hacia una estación de radar que se encuentra en la superficie de la
      tierra. En un momento dado, desde la estación se ve el avión con un ángulo
      de $30^{\circ}$, y este ángulo crece a un ritmo de $0{,}5^{\circ}$ por
      segundo.

      Calcular la velocidad del avión.
    pide: Calcular la velocidad del avión.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué relación conviene usar entre el ángulo $\alpha$ y la distancia
          horizontal $x$?
        opciones:
          - texto: >-
              $\tan\alpha = \frac{h}{x}$, porque relaciona el ángulo con lo que
              varía y con lo que es constante
            correcta: true
            mensaje: |
              Eso es. La altura $h=6$ es constante y $x$ es lo que cambia; la
              tangente los liga directamente. Con el seno o el coseno
              intervendría la distancia oblicua, que también varía, y habría dos
              incógnitas en vez de una.
          - texto: $\mathrm{sen}\,\alpha = \frac{h}{r}$, con $r$ la distancia al avión
            mensaje: |
              Se puede, pero introduce $r$, que **también varía**: habría dos
              magnitudes cambiando y haría falta otra ecuación. La tangente evita
              ese rodeo.
          - texto: El teorema de Pitágoras
            mensaje: |
              Pitágoras liga distancias, pero aquí el dato que varía es un
              **ángulo**. Hace falta una relación trigonométrica que lo
              involucre.
          - texto: $\cos\alpha = \frac{x}{h}$
            mensaje: |
              El coseno es cateto contiguo entre **hipotenusa**, no entre el otro
              cateto. Esa fórmula no es correcta, y además volvería a meter la
              distancia oblicua.

      - tipo: calcular
        titulo: El ritmo del ángulo, en radianes
        pregunta: |
          $0{,}5^{\circ}$ por segundo, ¿cuántos radianes por segundo son?
        respuesta:
          tipo: numero
          valor: '0.0087266'
          tolerancia: 0.00005
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              $0{,}5$ es el dato en **grados**. Las fórmulas de derivación
              trigonométrica solo valen en radianes, así que hay que convertir:
              $0{,}5^{\circ} = \frac{0{,}5\pi}{180} = \frac{\pi}{360}$.
          - valor: '0.0174533'
            mensaje: |
              $\frac{\pi}{180} \approx 0{,}01745$ es **un grado** en radianes.
              Aquí es medio grado, la mitad.
          - valor: '28.647890'
            mensaje: |
              Has multiplicado por $\frac{180}{\pi}$ en vez de dividir. La
              conversión de grados a radianes multiplica por
              $\frac{\pi}{180}$.
        pista: |
          Un grado son $\frac{\pi}{180}$ radianes.
        desarrollo: |
          $$
          \frac{d\alpha}{dt} = 0{,}5^{\circ}/\text{s}
          = 0{,}5\cdot\frac{\pi}{180} = \frac{\pi}{360}
          \approx 0{,}008727 \text{ rad/s}
          $$

          La conversión es obligatoria: la fórmula
          $\left(\tan\alpha\right)' = \sec^{2}\alpha$ solo es cierta con el
          ángulo en radianes.
        veredicto: |
          Es el mismo cuidado que en el ejercicio 3.15 con
          $\mathrm{sen}\,58^{\circ}$. Siempre que se derive algo
          trigonométrico, radianes.

      - tipo: calcular
        titulo: La velocidad
        pregunta: |
          ¿Cuál es el valor absoluto de la velocidad del avión, en km/s?
        respuesta:
          tipo: numero
          valor: '0.2094395'
          tolerancia: 0.0005
          formato: un número, o una expresión como π/15
        distractores:
          - valor: '0.0698132'
            mensaje: |
              $\frac{\pi}{45}$ sale de usar $\cos^{2}30^{\circ}=\frac34$ en vez
              de $\mathrm{sen}^{2}30^{\circ}=\frac14$: queda
              $\frac{6}{3/4}=8$ en vez de $24$. Al derivar
              $\frac{h}{\tan\alpha}$ aparece $\frac{1}{\mathrm{sen}^{2}\alpha}$,
              no el coseno.
          - valor: '0.0349066'
            mensaje: |
              $\frac{\pi}{90}$ sale de olvidar el $6$ de la altura: la fórmula es
              $x' = -\frac{h}{\mathrm{sen}^{2}\alpha}\alpha'$ y esa $h$ vale 6,
              así que el factor es $24$ y no $4$.
          - valor: '12'
            mensaje: |
              Te has dejado la conversión a radianes. $24 \cdot 0{,}5 = 12$
              usaría los grados por segundo tal cual, y las fórmulas de
              derivación trigonométrica solo valen en radianes:
              $0{,}5^{\circ}/\mathrm{s} = \frac{\pi}{360}$ rad/s.
        pista: |
          De $x = \frac{h}{\tan\alpha}$, derivando sale
          $x' = -\frac{h}{\mathrm{sen}^{2}\alpha}\,\alpha'$. Y
          $\mathrm{sen}\,30^{\circ} = \frac12$.
        desarrollo: |
          De $\tan\alpha = \frac{h}{x}$ se despeja
          $x = \frac{h}{\tan\alpha} = h\cot\alpha$, y derivando respecto del
          tiempo:

          $$
          \frac{dx}{dt} = -\frac{h}{\mathrm{sen}^{2}\alpha}\cdot
          \frac{d\alpha}{dt}
          $$

          Con $h=6$, $\mathrm{sen}\,30^{\circ} = \frac12$ y
          $\frac{d\alpha}{dt} = \frac{\pi}{360}$:

          $$
          \frac{dx}{dt} = -\frac{6}{\left(\frac12\right)^{2}}\cdot\frac{\pi}{360}
          = -24\cdot\frac{\pi}{360} = -\frac{\pi}{15}
          \approx -0{,}2094 \text{ km/s}
          $$

          En valor absoluto, $\frac{\pi}{15} \approx 0{,}209$ km/s.
        veredicto: |
          El signo negativo **es parte de la respuesta**: $x$ disminuye porque el
          avión se acerca al radar. Que salga negativo confirma el planteamiento.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Elegir la relación.** Con $x(t)$ la distancia horizontal al
              radar y $\alpha(t)$ el ángulo de elevación,
              $\tan\alpha = \frac{h}{x}$ con $h=6$ constante.
          - texto: |
              **Despejar lo que se busca:** $x = \dfrac{h}{\tan\alpha}
              = h\cot\alpha$.
          - texto: |
              **Convertir el ritmo a radianes**, porque la derivada
              trigonométrica solo vale ahí:
              $\alpha' = 0{,}5^{\circ}/\text{s} = \frac{\pi}{360}$ rad/s.
          - texto: |
              **Derivar respecto del tiempo:**
              $x' = -\dfrac{h}{\mathrm{sen}^{2}\alpha}\,\alpha'$.
          - texto: |
              **Sustituir el instante:** $\alpha = 30^{\circ}$,
              $\mathrm{sen}\,30^{\circ} = \frac12$, y sale
              $x' = -\frac{\pi}{15} \approx -0{,}209$ km/s. El signo negativo
              dice que se acerca.
          - texto: |
              Como el ángulo se da en grados y el resultado en km/s, no hace
              falta convertir: las unidades se cancelan.
            trampa: true
            mensaje: |
              No se cancelan: la fórmula
              $\left(\tan\alpha\right)' = \sec^{2}\alpha$ **presupone**
              radianes. Con grados habría un factor $\frac{\pi}{180}$ escondido,
              y la velocidad saldría 57 veces mayor: unos 12 km/s, que es una
              barbaridad para un avión. El disparate del resultado es la señal
              de que faltó convertir.
        veredicto: |
          $0{,}209$ km/s son 754 km/h, plausible para un avión comercial. Ese
          contraste con la realidad es la mejor comprobación del ejercicio.

    resolucion: |
      **Datos.** Avión a $h=6$ km de altura constante, acercándose al radar. En
      el instante considerado el ángulo de elevación es $30^{\circ}$ y crece a
      $0{,}5^{\circ}$ por segundo.

      ### 1 · Elegir bien la relación

      Hay varias relaciones trigonométricas posibles y **no todas sirven
      igual**. La clave es elegir la que ligue el ángulo con la magnitud
      constante y la que varía, sin meter una tercera.

      Con $x(t)$ la distancia horizontal del avión al radar:

      $$
      \tan\alpha = \frac{h}{x} = \frac{6}{x}
      $$

      Aquí $h$ es constante y $x$ es lo que se busca. Si en cambio se usara
      $\mathrm{sen}\,\alpha = \frac{h}{r}$, aparecería la distancia oblicua $r$,
      que **también varía**, y haría falta otra ecuación.

      ### 2 · Despejar la magnitud que interesa

      $$
      x = \frac{h}{\tan\alpha} = h\cot\alpha
      $$

      ### 3 · Convertir el ritmo a radianes

      Paso obligatorio, y el que más se olvida:

      $$
      \frac{d\alpha}{dt} = 0{,}5^{\circ}/\text{s}
      = 0{,}5\cdot\frac{\pi}{180} = \frac{\pi}{360} \text{ rad/s}
      $$

      La fórmula $\left(\cot\alpha\right)' = -\frac{1}{\mathrm{sen}^{2}\alpha}$
      **presupone** el ángulo en radianes. Con grados hay un factor
      $\frac{\pi}{180}$ escondido.

      ### 4 · Derivar respecto del tiempo

      $$
      \frac{dx}{dt} = h\cdot\left(-\frac{1}{\mathrm{sen}^{2}\alpha}\right)
      \cdot\frac{d\alpha}{dt}
      = -\frac{h}{\mathrm{sen}^{2}\alpha}\cdot\frac{d\alpha}{dt}
      $$

      Escrita en general, sin sustituir todavía.

      ### 5 · Sustituir el instante

      $$
      \alpha = 30^{\circ}, \qquad \mathrm{sen}\,30^{\circ} = \frac12,
      \qquad \mathrm{sen}^{2}30^{\circ} = \frac14
      $$

      $$
      \frac{dx}{dt} = -\frac{6}{\frac14}\cdot\frac{\pi}{360}
      = -24\cdot\frac{\pi}{360} = -\frac{24\pi}{360} = -\frac{\pi}{15}
      $$

      $$
      \boxed{\;\frac{dx}{dt} = -\frac{\pi}{15} \approx -0{,}209 \text{ km/s}\;}
      $$

      ### 6 · El signo es parte de la respuesta

      $\frac{dx}{dt}$ sale **negativo**, y eso no es un error: significa que $x$
      **disminuye**, es decir que el avión se acerca al radar. Coincide con el
      enunciado, que dice que el ángulo crece — y el ángulo crece justamente
      porque el avión se acerca.

      Si hubiera salido positivo, habría un error de signo en algún sitio.

      ### 7 · Comprobación con la realidad

      La mejor comprobación de este problema es traducir el resultado a unidades
      que uno pueda juzgar:

      $$
      0{,}209 \text{ km/s} \times 3600 \frac{\text{s}}{\text{h}}
      \approx 754 \text{ km/h}
      $$

      Perfectamente plausible para un avión comercial de pasajeros.

      Y sirve para cazar el error de las unidades: **sin convertir a radianes**
      el resultado habría sido

      $$
      -\frac{6}{1/4}\cdot 0{,}5 = -12 \text{ km/s} = 43\,200 \text{ km/h}
      $$

      unas 35 veces la velocidad del sonido. El disparate delata el fallo al
      instante, y por eso conviene siempre acabar preguntándose si el número es
      creíble.

      ### 8 · Comprobación numérica

      Con un salto de un segundo: el ángulo pasa a $30{,}5^{\circ}$ y entonces

      $$
      x = \frac{6}{\tan 30{,}5^{\circ}} = \frac{6}{0{,}5890} = 10{,}187 \text{ km}
      $$

      mientras que antes era

      $$
      x = \frac{6}{\tan 30^{\circ}} = \frac{6}{0{,}5774} = 10{,}392 \text{ km}
      $$

      La diferencia es $-0{,}205$ km en un segundo, cerca de los $-0{,}209$
      km/s calculados ✔ — y la pequeña discrepancia es justo el error de usar
      un salto finito en vez de una derivada.
