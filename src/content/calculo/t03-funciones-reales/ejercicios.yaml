  - id: continuidad-parametro-k
    titulo: Dos parámetros para pegar dos trozos
    fuente: >-
      Ejercicio 3.3 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Determinar $k \in \mathbb{R}$ para que las siguientes funciones sean
      continuas:

      **(a)**
      $f(x) = \begin{cases} x^{2}, & x<1 \\ kx-3, & x\ge1 \end{cases}$
      · **(b)**
      $g(x) = \begin{cases} k^{2}x^{2}, & x\le2 \\ (1-k)x, & x>2 \end{cases}$
    pide: Determinar el valor de $k$ en los dos casos.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde se juega la continuidad de una función a trozos?
        opciones:
          - texto: >-
              Solo en los **puntos de empalme**: dentro de cada trozo ya es
              continua por ser un polinomio
            correcta: true
            mensaje: |
              Eso es. Los polinomios son continuos en todo $\mathbb{R}$, así que
              el único sitio donde puede romperse es la frontera entre trozos.
              Todo el ejercicio se reduce a igualar los límites laterales ahí.
          - texto: En todo el dominio, punto por punto
            mensaje: |
              Sería agotador e innecesario. Dentro de cada trozo la función es
              un polinomio, y los polinomios son continuos siempre. Solo hay que
              mirar la costura.
          - texto: En los puntos donde la función vale cero
            mensaje: |
              Los ceros no tienen nada que ver con la continuidad. Una función
              puede valer cero y ser continua, o no valer nunca cero y tener un
              salto.
          - texto: En los extremos del dominio
            mensaje: |
              Aquí el dominio es todo $\mathbb{R}$ y no tiene extremos. El punto
              crítico es interno: donde cambia la fórmula.

      - tipo: calcular
        titulo: Apartado (a)
        pregunta: |
          ¿Para qué valor de $k$ es continua la primera función?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 saldría de $k-3 = -1$. Pero el límite por la izquierda es
              $1^{2} = 1$, no $-1$. La ecuación es $1 = k-3$.
          - valor: '-2'
            mensaje: |
              Signo cambiado al despejar. De $1 = k-3$ se pasa el 3 sumando:
              $k = 4$.
          - valor: '3'
            mensaje: |
              3 es el término independiente del segundo trozo. Hay que
              **resolver** la ecuación $1 = k-3$, no leer un coeficiente.
        pista: |
          Iguala el límite por la izquierda en $x=1$ con el valor por la
          derecha.
        desarrollo: |
          El único punto conflictivo es $x=1$.

          **Límite por la izquierda** —donde manda $x^{2}$—:

          $$
          \lim_{x\to1^{-}} f(x) = 1^{2} = 1
          $$

          **Valor y límite por la derecha** —donde manda $kx-3$—:

          $$
          f(1) = \lim_{x\to1^{+}} f(x) = k-3
          $$

          Para que sea continua los tres tienen que coincidir:

          $$
          1 = k-3 \;\Longrightarrow\; k = 4
          $$

          Comprobación: con $k=4$, el segundo trozo en $x=1$ vale
          $4-3 = 1$ ✔
        veredicto: |
          Fíjate en que $f(1)$ se calcula con el **segundo** trozo, porque el
          enunciado pone ahí el $\ge$. Ese detalle decide de qué lado está el
          punto.

      - tipo: calcular
        titulo: Apartado (b), el que tiene dos soluciones
        pregunta: |
          ¿Cuál es el valor **negativo** de $k$ que hace continua la segunda
          función?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              $\frac12$ **también** es solución, pero es la positiva. El
              enunciado del paso pide la negativa. Que haya dos es lo
              característico de este apartado: la ecuación es de segundo grado.
          - valor: '-0.5'
            mensaje: |
              Las dos soluciones son $-1$ y $+\frac12$. De
              $2k^{2}+k-1 = 0$ salen esas dos, no $-\frac12$.
          - valor: '1'
            mensaje: |
              Con $k=1$ el segundo trozo sería $(1-1)x = 0$, y el primero
              valdría $4$ en $x=2$. No pegan.
        pista: |
          Iguala en $x=2$: $4k^{2} = 2(1-k)$. Sale una ecuación de segundo
          grado.
        desarrollo: |
          El punto de empalme es $x=2$.

          $$
          \lim_{x\to2^{-}} g(x) = g(2) = k^{2}\cdot 4 = 4k^{2}
          $$

          $$
          \lim_{x\to2^{+}} g(x) = (1-k)\cdot 2 = 2-2k
          $$

          Igualando:

          $$
          4k^{2} = 2-2k
          \;\Longleftrightarrow\;
          4k^{2}+2k-2 = 0
          \;\Longleftrightarrow\;
          2k^{2}+k-1 = 0
          $$

          $$
          k = \frac{-1\pm\sqrt{1+8}}{4} = \frac{-1\pm3}{4}
          \;\Longrightarrow\;
          k = \frac12 \;\text{ o }\; k = -1
          $$

          Las **dos** valen. La negativa es $k=-1$.
        veredicto: |
          Que la $k$ aparezca al cuadrado es lo que multiplica las soluciones.
          Dar solo una es medio apartado.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Dentro de cada trozo la función es un polinomio, y los polinomios
              son continuos en todo $\mathbb{R}$: el único punto conflictivo es
              el empalme.
          - texto: |
              Continuidad en un punto significa tres cosas: que exista el valor,
              que exista el límite y que **coincidan**. En un empalme, que
              exista el límite equivale a que los dos laterales sean iguales.
          - texto: |
              **(a)** En $x=1$: $\lim_{x\to1^{-}} = 1$ y $f(1) = k-3$. De
              $1 = k-3$ sale $k=4$, único.
          - texto: |
              **(b)** En $x=2$: $4k^{2} = 2-2k$, es decir $2k^{2}+k-1 = 0$, con
              **dos** soluciones: $k=-1$ y $k=\frac12$.
          - texto: |
              Como en (b) hay dos valores de $k$, hay **dos** funciones
              continuas distintas, y las dos son respuesta válida.
          - texto: |
              En (b) hay que quedarse con $k=\frac12$, porque $k$ debe ser
              positivo para que $k^{2}x^{2}$ tenga sentido.
            trampa: true
            mensaje: |
              $k^{2}$ es no negativo **sea cual sea el signo de $k$**: ese es el
              efecto de elevar al cuadrado. No hay ninguna razón para descartar
              $k=-1$, y el enunciado tampoco la da. Inventarse una restricción
              para quedarse con una sola solución es perder media respuesta.
        veredicto: |
          Cuando el parámetro aparece elevado al cuadrado hay que esperar más de
          una solución, y hay que darlas todas salvo que el enunciado descarte
          alguna.

    resolucion: |
      **Datos.** Dos funciones a trozos con un parámetro $k$. Se pide el valor
      de $k$ que las hace continuas.

      ### 1 · Dónde se juega el ejercicio

      Los polinomios son continuos en todo $\mathbb{R}$, así que dentro de cada
      trozo no hay nada que discutir. **El único punto conflictivo es el
      empalme**, y todo el ejercicio se reduce a lo que pasa ahí.

      Continuidad en un punto $a$ significa tres cosas:

      $$
      \exists f(a), \qquad \exists \lim_{x\to a} f(x), \qquad
      \lim_{x\to a} f(x) = f(a)
      $$

      Y en un empalme, que el límite exista equivale a que **los dos laterales
      coincidan**.

      ### 2 · Apartado (a)

      El empalme es $x=1$. Conviene fijarse en de qué lado cae el punto: el
      enunciado pone $x \ge 1$ en el segundo trozo, así que **$f(1)$ se calcula
      con $kx-3$**.

      $$
      \lim_{x\to1^{-}} f(x) = \lim_{x\to1^{-}} x^{2} = 1
      $$

      $$
      \lim_{x\to1^{+}} f(x) = f(1) = k\cdot1-3 = k-3
      $$

      Igualando:

      $$
      1 = k-3 \;\Longrightarrow\; \boxed{k = 4}
      $$

      Es una ecuación de primer grado y tiene **una** solución.

      ### 3 · Apartado (b)

      El empalme es $x=2$, y aquí el punto cae en el **primer** trozo, porque
      lleva el $\le$.

      $$
      \lim_{x\to2^{-}} g(x) = g(2) = k^{2}\cdot 2^{2} = 4k^{2}
      $$

      $$
      \lim_{x\to2^{+}} g(x) = (1-k)\cdot 2 = 2-2k
      $$

      Igualando:

      $$
      4k^{2} = 2-2k
      \;\Longleftrightarrow\;
      4k^{2}+2k-2 = 0
      \;\Longleftrightarrow\;
      2k^{2}+k-1 = 0
      $$

      $$
      k = \frac{-1\pm\sqrt{1+8}}{4} = \frac{-1\pm3}{4}
      $$

      $$
      \boxed{k = \frac12 \quad\text{y}\quad k = -1}
      $$

      **Las dos son válidas**, y hay que darlas las dos. El parámetro aparece
      elevado al cuadrado, así que la ecuación es de segundo grado y no hay
      ninguna condición en el enunciado que descarte la negativa.

      ### 4 · Comprobación

      **(a)** con $k=4$: el primer trozo tiende a 1 y el segundo vale
      $4-3 = 1$ ✔

      **(b)** con $k=\frac12$: primer trozo $4\cdot\frac14 = 1$; segundo
      $\left(1-\frac12\right)\cdot2 = 1$ ✔

      **(b)** con $k=-1$: primer trozo $4\cdot1 = 4$; segundo
      $\left(1+1\right)\cdot2 = 4$ ✔

      Las dos pegan, en alturas distintas: con $k=\frac12$ la función pasa por
      $(2,1)$ y con $k=-1$ por $(2,4)$. Son dos funciones continuas diferentes,
      y el enunciado no pide elegir.

      ### Resultado

      $$
      \boxed{\;\text{(a) } k = 4
      \qquad\qquad
      \text{(b) } k = -1 \;\text{ y }\; k = \tfrac12\;}
      $$

