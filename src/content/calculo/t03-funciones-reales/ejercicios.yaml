  - id: ej-inversa-con-signo
    titulo: Una inversa, y el signo que hay que elegir
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Hallar la inversa de $f(x) = x^{2}$ definida en $(-\infty, 0]$.
    pide: La fórmula de la inversa, con el signo correcto.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el enunciado se molesta en decir el dominio?
        opciones:
          - texto: Porque en todo $\mathbb{R}$ la función no sería inyectiva y no habría inversa
            correcta: true
            mensaje: |
              Exacto. $2$ y $-2$ tienen la misma imagen, así que en $\mathbb{R}$
              no hay inversa. Restringiendo el dominio se elimina el empate. **La
              inversa depende del dominio, no de la fórmula.**
          - texto: Para que la inversa dé números positivos
            mensaje: |
              Al revés: como el dominio de partida son los negativos, la inversa
              tiene que **devolver** negativos. Ese es justo el detalle del
              signo.
          - texto: Es un dato de más, no cambia nada
            mensaje: |
              Cambia todo. Sin restringir el dominio no hay inversa en absoluto,
              y con otro dominio la inversa sería otra fórmula.
      - tipo: calcular
        titulo: Un valor de comprobación
        pregunta: |
          Si $f^{-1}$ es la inversa, ¿cuánto vale $f^{-1}(9)$?
        respuesta:
          tipo: numero
          valor: '-3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              $3$ también cumple $3^{2}=9$, pero **no está en el dominio de
              partida**, que son los negativos. La inversa tiene que devolverte
              al sitio de donde saliste.
          - valor: '81'
            mensaje: |
              Has elevado al cuadrado en vez de sacar la raíz. La inversa
              deshace lo que la función hace.
        pista: |
          Busca el número **del dominio** $(-\infty,0]$ cuyo cuadrado es 9.
        desarrollo: |
          $$
          f(x) = 9 \;\Longleftrightarrow\; x^{2} = 9 \;\Longleftrightarrow\; x = \pm 3
          $$

          De los dos, solo $-3$ está en $(-\infty, 0]$. Luego
          $f^{-1}(9) = -3$, y eso ya te dice que la inversa lleva el signo
          menos delante de la raíz.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza sobra.
        piezas:
          - texto: En $(-\infty,0]$ la función es inyectiva, así que tiene inversa.
          - texto: De $y = x^{2}$ se despeja $x = \pm\sqrt{y}$.
          - texto: Como el dominio de partida son los negativos, se toma la raíz negativa.
          - texto: $f^{-1}(x) = -\sqrt{x}$, definida para $x \ge 0$.
          - texto: Al despejar siempre se toma la raíz positiva, que es la principal.
            trampa: true
            mensaje: |
              Esa costumbre es la que hace fallar el ejercicio. La raíz
              principal es positiva **como convenio de notación**, pero la
              inversa tiene que devolver valores del dominio de partida, y aquí
              son negativos.
    resolucion: |
      **Por qué hay inversa.** En todo $\mathbb{R}$ no la habría: $2$ y $-2$
      empatan. Restringido a $(-\infty,0]$ no hay dos valores con la misma
      imagen, así que sí.

      **Despejar.** De $y = x^{2}$ sale $x = \pm\sqrt{y}$, y hay que **elegir**.
      Como todos los valores del dominio de partida son negativos o cero, la
      inversa tiene que devolver negativos:

      $$
      f^{-1}(x) = -\sqrt{x}
      $$

      **El dominio de la inversa** es el rango de $f$, que aquí es $[0,\infty)$.
      Esa igualdad es la comprobación que caza casi todos los errores: si el
      dominio que te sale no coincide con el rango que calculaste, algo falla.

      **Comprobación.** $f^{-1}(9) = -3$, y $f(-3) = 9$. Vuelve al punto de
      partida, que es lo que una inversa tiene que hacer.

      <figure class="figura-examen">
