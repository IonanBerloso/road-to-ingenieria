  - id: ej-continuidad-parametro
    titulo: Un parámetro que pega dos trozos
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Hallar el valor de $k$ para que la función
      $$
      f(x) = \begin{cases} x + k & x < 2 \\[4pt] x^{2} & x \ge 2 \end{cases}
      $$
      sea continua en todo $\mathbb{R}$.
    pide: El valor de k.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde puede fallar la continuidad de esta función?
        opciones:
          - texto: Solo en $x = 2$, el punto de empalme
            correcta: true
            mensaje: |
              Eso es. Dentro de cada trozo son un polinomio y una parábola, que
              son continuas siempre. **Toda la pregunta se juega en la
              frontera**, y por eso este tipo de ejercicio se resuelve en tres
              líneas.
          - texto: En todos los puntos, hay que comprobarlos uno a uno
            mensaje: |
              No hace falta: los polinomios son continuos en todo su dominio, y
              cada trozo lo es. Lo único que hay que comprobar es dónde se pegan.
          - texto: En $x = 0$, donde la función cambia de signo
            mensaje: |
              Cambiar de signo no rompe la continuidad. Lo que la puede romper
              es un salto, y aquí el único sitio donde podría haberlo es donde
              cambia la definición.
      - tipo: calcular
        titulo: El límite por la derecha
        pregunta: |
          ¿Cuánto vale $\lim_{x\to 2^{+}} f(x)$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es el valor de $x$, no el de la función. Por la derecha manda la
              rama $x^{2}$, así que hay que elevar al cuadrado.
          - valor: '0'
            mensaje: |
              Parece que has usado la rama de la izquierda con $k=0$. Por la
              derecha, con $x \ge 2$, la función vale $x^{2}$.
        pista: |
          Por la derecha de 2 la función es $x^{2}$. Sustituye.
        desarrollo: |
          $$
          \lim_{x\to 2^{+}} f(x) = 2^{2} = 4
          $$
      - tipo: calcular
        titulo: El parámetro
        pregunta: |
          Igualando los dos límites laterales, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              4 es el valor común de los dos límites, no el parámetro. De
              $2 + k = 4$ hay que despejar $k$.
          - valor: '-2'
            mensaje: |
              Signo cambiado al despejar: de $2+k=4$ sale $k = 4-2$, positivo.
          - valor: '6'
            mensaje: |
              Has sumado en vez de restar. La ecuación es $2+k=4$, así que
              $k = 4-2$.
        pista: |
          Por la izquierda el límite es $2+k$. Iguálalo a 4 y despeja.
        desarrollo: |
          $$
          \lim_{x\to 2^{-}} f(x) = 2 + k,
          \qquad
          \lim_{x\to 2^{+}} f(x) = 4
          $$

          Para que haya límite los dos tienen que coincidir, y además valer lo
          que vale la función en el punto, que es $f(2) = 4$:

          $$
          2 + k = 4 \;\Longrightarrow\; k = 2
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: Cada trozo es un polinomio, luego solo puede fallar en $x=2$.
          - texto: Por la izquierda el límite vale $2+k$; por la derecha, 4.
          - texto: Además $f(2) = 4$, porque el 2 pertenece a la segunda rama.
          - texto: Igualando las tres cosas, $k = 2$.
          - texto: Basta con que los dos límites laterales coincidan.
            trampa: true
            mensaje: |
              No basta: la continuidad son **tres** condiciones, y la tercera es
              que ese límite valga lo mismo que la función en el punto. Aquí
              coinciden, pero podrían no hacerlo, y entonces habría una
              discontinuidad evitable.
    resolucion: |
      **Dónde mirar.** Dentro de cada trozo la función es un polinomio, y los
      polinomios son continuos siempre. La única frontera es $x = 2$.

      **Las tres condiciones.** Existe $f(2) = 2^{2} = 4$, porque el 2
      pertenece a la segunda rama. Y los límites laterales:

      $$
      \lim_{x\to 2^{-}} f(x) = 2+k,
      \qquad
      \lim_{x\to 2^{+}} f(x) = 4
      $$

      Para que la función sea continua hacen falta las tres a la vez:

      $$
      2 + k = 4 = f(2)
      \;\Longrightarrow\;
      k = 2
      $$

      **Comprobación.** Con $k=2$, por la izquierda la función se acerca a
      $2+2=4$ y por la derecha a $4$, que es lo que vale. No hay salto.

      <figure class="figura-examen">
