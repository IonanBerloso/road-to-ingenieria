  - id: ej-velocidades-relacionadas
    titulo: Dos magnitudes que cambian a la vez
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un cuadrado crece de forma que su lado aumenta a razón de 2 cm/s.
      ¿A qué velocidad crece su área en el instante en que el lado mide 5 cm?
    pide: La velocidad de crecimiento del área, en cm²/s.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es el primer paso?
        opciones:
          - texto: Escribir la relación entre las magnitudes en general, sin sustituir nada
            correcta: true
            mensaje: |
              Eso es, y es **lo único que se falla** en estos problemas. Primero
              la relación general, luego derivar, y los números al final.
          - texto: Sustituir el lado por 5 y luego derivar
            mensaje: |
              Ese es exactamente el error. Si sustituyes antes, el área se
              convierte en la constante 25 y su derivada es cero. Congelas justo
              lo que tenía que variar.
          - texto: Calcular el área en ese instante
            mensaje: |
              El área en ese instante es un dato intermedio útil, pero no
              contesta a la pregunta: se pregunta a qué **velocidad** cambia,
              que es una derivada.
      - tipo: calcular
        titulo: La derivada de la relación
        pregunta: |
          De $A = L^{2}$, derivando respecto del tiempo sale
          $A' = k \cdot L \cdot L'$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Falta el factor que baja del exponente. Al derivar $L^{2}$
              respecto del tiempo, la regla de la cadena da $2L\,L'$.
          - valor: '0.5'
            mensaje: |
              Has invertido el exponente. Derivar un cuadrado **multiplica** por
              2, no divide.
        pista: |
          Regla de la cadena: la derivada de $L^{2}$ respecto del tiempo es
          $2L$ por la derivada de $L$.
        desarrollo: |
          $$
          A = L^{2}
          \;\Longrightarrow\;
          \frac{dA}{dt} = 2L\,\frac{dL}{dt}
          $$

          El $2L$ viene de derivar el cuadrado, y el $\frac{dL}{dt}$ de la
          regla de la cadena, porque $L$ depende del tiempo.
      - tipo: calcular
        titulo: El resultado
        pregunta: |
          Ahora sí, sustituye $L = 5$ y $L' = 2$. ¿Cuánto vale $A'$, en cm²/s?
        respuesta:
          tipo: numero
          valor: '20'
          tolerancia: 0.001
          formato: un número, en centímetros cuadrados por segundo
        distractores:
          - valor: '10'
            mensaje: |
              Te has dejado un factor: son $2 \cdot 5 \cdot 2$, tres números,
              no dos.
          - valor: '25'
            mensaje: |
              25 es el **área** en ese instante, no su velocidad de cambio. La
              pregunta es a qué ritmo crece.
          - valor: '4'
            mensaje: |
              Parece que has elevado la velocidad del lado al cuadrado. Las
              velocidades no se elevan: entran en la fórmula tal cual.
        pista: |
          $A' = 2 \cdot L \cdot L'$, con $L=5$ y $L'=2$.
        desarrollo: |
          $$
          \frac{dA}{dt} = 2 \cdot 5 \cdot 2 = 20 \ \text{cm}^{2}/\text{s}
          $$

          Y fíjate en que el resultado depende de $L$: cuando el cuadrado sea
          más grande, el área crecerá más deprisa aunque el lado siga creciendo
          igual de rápido.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: La relación entre las magnitudes es $A = L^{2}$, con las dos dependiendo del tiempo.
          - texto: Derivando respecto de $t$, $\frac{dA}{dt} = 2L\frac{dL}{dt}$.
          - texto: En el instante pedido, $L = 5$ y $\frac{dL}{dt} = 2$.
          - texto: Luego $\frac{dA}{dt} = 20$ cm² por segundo.
          - texto: Como el lado crece a ritmo constante, el área también.
            trampa: true
            mensaje: |
              No: el ritmo del área depende de $L$, que va cambiando. Con el
              lado a 10 cm, el área crecería a 40 cm²/s con la misma velocidad
              de lado. Es el mismo motivo por el que hay que derivar antes de
              sustituir.
    resolucion: |
      **El orden es todo.** Primero la relación en general, después derivar, y
      los números del instante concreto **al final**.

      **La relación.** El área de un cuadrado de lado $L$ es

      $$
      A = L^{2}
      $$

      y aquí las dos son funciones del tiempo, aunque no se escriba.

      **Derivar respecto del tiempo**, con la regla de la cadena:

      $$
      \frac{dA}{dt} = 2L\,\frac{dL}{dt}
      $$

      **Ahora los datos.** En ese instante $L = 5$ cm y
      $\frac{dL}{dt} = 2$ cm/s:

      $$
      \frac{dA}{dt} = 2 \cdot 5 \cdot 2 = 20 \ \text{cm}^{2}/\text{s}
      $$

      **Por qué no se puede sustituir antes.** Si pones $L=5$ en $A = L^{2}$
      obtienes $A = 25$, una constante, y su derivada es cero. Habrías
      congelado la magnitud que precisamente estaba cambiando.

      <figure class="figura-examen">
      <svg viewBox="0 0 300 270" role="img" width="300" height="270"
           aria-labelledby="f-ej-velocidades-relacionadas-t f-ej-velocidades-relacionadas-d">
        <title id="f-ej-velocidades-relacionadas-t">El cuadrado de lado cinco y la escuadra que se le añade al crecer el lado</title>
        <desc id="f-ej-velocidades-relacionadas-d">Un cuadrado de lado cinco, sombreado, con el vértice inferior izquierdo en el origen. Alrededor de él, por arriba y por la derecha, se añade una franja en forma de escuadra que corresponde al crecimiento del lado: dos tiras rectangulares largas y estrechas, cada una de cinco por el incremento, más un cuadradito pequeño en la esquina superior derecha donde las dos se encuentran. Las dos tiras están sombreadas con un tono y el cuadradito de la esquina con otro más claro, porque es el término que se desprecia al hacer el incremento pequeño.</desc>
