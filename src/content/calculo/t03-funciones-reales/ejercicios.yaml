  - id: limite-que-no-existe
    titulo: Dos sucesiones que discrepan
    fuente: >-
      Ejercicio 3.4 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU ·
      Cayó en 2018/2019 3E
    nivel: practica
    enunciado: |
      Estudiar el límite de la función $f(x) = \cos\left(\frac{\pi}{x}\right)$
      en el punto $x=0$ utilizando las sucesiones
      $\{a_n\}_{n\in\mathbb{N}} = \left\{\frac{1}{2n}\right\}$ y
      $\{b_n\}_{n\in\mathbb{N}} = \left\{\frac{2}{2n+1}\right\}$.
    pide: Estudiar si existe el límite en $x=0$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el enunciado regala **dos** sucesiones y no una?
        opciones:
          - texto: >-
              Porque para demostrar que un límite **no existe** hacen falta dos
              caminos que discrepen
            correcta: true
            mensaje: |
              Exacto. Con una sola sucesión no se prueba nada: el límite podría
              existir y valer eso. Lo que refuta la existencia es encontrar
              **dos** formas de acercarse a 0 cuyas imágenes tiendan a cosas
              distintas.
          - texto: Porque una sola no tiende a cero
            mensaje: |
              Las dos tienden a cero: $\frac{1}{2n} \to 0$ y
              $\frac{2}{2n+1} \to 0$. Esa es la condición para poder usarlas, y
              las dos la cumplen.
          - texto: Para calcular el límite por la izquierda y por la derecha
            mensaje: |
              Las dos sucesiones son **positivas**, así que las dos se acercan a
              0 por la derecha. La discrepancia no es entre lados, es entre
              caminos distintos por el mismo lado.
          - texto: Para comprobar el resultado dos veces
            mensaje: |
              No es una comprobación: es el argumento entero. Si las dos dieran
              lo mismo no se habría demostrado nada.

      - tipo: calcular
        titulo: El primer camino
        pregunta: |
          ¿A qué tiende $f(a_n) = \cos\left(\frac{\pi}{1/(2n)}\right)$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              0 es lo que da la **otra** sucesión, $b_n$. Con $a_n$ el argumento
              del coseno es $2\pi n$, un múltiplo entero de $2\pi$, y ahí el
              coseno vale 1.
          - valor: '-1'
            mensaje: |
              $-1$ sería $\cos(\pi n)$ con $n$ impar. Aquí el argumento es
              $2\pi n$, siempre múltiplo **par** de $\pi$.
          - valor: '3.141593'
            mensaje: |
              $\pi$ es el argumento antes de dividir, no el valor del coseno. Hay
              que sustituir y evaluar.
        pista: |
          $\frac{\pi}{1/(2n)} = 2\pi n$. ¿Cuánto vale el coseno de un múltiplo
          entero de $2\pi$?
        desarrollo: |
          $$
          \frac{\pi}{a_n} = \frac{\pi}{\frac{1}{2n}} = 2\pi n
          $$

          $$
          f(a_n) = \cos(2\pi n) = 1 \qquad \text{para todo } n
          $$

          No es que tienda a 1: **vale exactamente 1 siempre**. Así que la
          sucesión de imágenes es constante y su límite es 1.
        veredicto: |
          La sucesión $a_n$ está elegida para caer justo en los máximos del
          coseno. La otra caerá justo en sus ceros.

      - tipo: calcular
        titulo: El segundo camino
        pregunta: |
          ¿A qué tiende $f(b_n)$ con $b_n = \frac{2}{2n+1}$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es lo que daba $a_n$. Con $b_n$ el argumento es
              $\frac{(2n+1)\pi}{2}$, que es un múltiplo **impar** de
              $\frac{\pi}{2}$: ahí el coseno se anula.
          - valor: '-1'
            mensaje: |
              $-1$ requeriría un argumento múltiplo impar de $\pi$. Aquí el
              argumento es $\frac{\pi}{2}$, $\frac{3\pi}{2}$, $\frac{5\pi}{2}$…
              y en todos ellos el coseno vale 0.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es $\cos\frac{\pi}{3}$, que no aparece aquí. Sustituye
              y simplifica: el argumento sale $\frac{(2n+1)\pi}{2}$.
        pista: |
          $\frac{\pi}{2/(2n+1)} = \frac{(2n+1)\pi}{2}$. Evalúa el coseno ahí.
        desarrollo: |
          $$
          \frac{\pi}{b_n} = \frac{\pi}{\frac{2}{2n+1}} = \frac{(2n+1)\pi}{2}
          $$

          Con $n=1,2,3,\dots$ el argumento es
          $\frac{3\pi}{2}$, $\frac{5\pi}{2}$, $\frac{7\pi}{2}$… todos múltiplos
          **impares** de $\frac{\pi}{2}$, y ahí el coseno vale 0:

          $$
          f(b_n) = 0 \qquad \text{para todo } n
          $$
        veredicto: |
          Otra sucesión constante, esta vez en 0. Dos caminos hacia el mismo
          punto y dos destinos distintos.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Herramienta.** Si $\lim_{x\to a} f(x) = L$, entonces para
              **toda** sucesión $x_n \to a$ con $x_n \neq a$ se cumple
              $f(x_n) \to L$.
          - texto: |
              Las dos sucesiones cumplen la hipótesis: $a_n \to 0$ y
              $b_n \to 0$, y ninguna vale 0.
          - texto: |
              $f(a_n) = \cos(2\pi n) = 1$ para todo $n$, luego
              $f(a_n) \to 1$.
          - texto: |
              $f(b_n) = \cos\frac{(2n+1)\pi}{2} = 0$ para todo $n$, luego
              $f(b_n) \to 0$.
          - texto: |
              Si el límite existiera, las dos sucesiones de imágenes tendrían
              que tender a **él**, y por unicidad del límite $1 = 0$: absurdo.
              **El límite no existe.**
          - texto: |
              Como las dos sucesiones dan valores distintos, el límite vale la
              media de los dos, $\frac12$.
            trampa: true
            mensaje: |
              Los límites no promedian. Si dos caminos dan resultados distintos,
              la conclusión es que **no hay límite**, no que valga algo
              intermedio. La definición exige que **todos** los caminos den lo
              mismo, y aquí ya hay dos que no.
        veredicto: |
          El argumento no necesita dibujar la función. Un dibujo sugiere que
          oscila; dos sucesiones lo demuestran.

    resolucion: |
      **Datos.** $f(x) = \cos\left(\frac{\pi}{x}\right)$ y el punto $x=0$. Se
      dan las sucesiones $a_n = \frac{1}{2n}$ y $b_n = \frac{2}{2n+1}$.

      ### 1 · La herramienta, y por qué el enunciado da dos sucesiones

      La caracterización del límite por sucesiones dice:

      $$
      \lim_{x\to a} f(x) = L
      \iff
      \forall \{x_n\} \text{ con } x_n \to a,\ x_n \neq a:\quad f(x_n) \to L
      $$

      Léase el «para toda»: el límite existe solo si **todos** los caminos
      llevan al mismo sitio. En contrapositivo, para demostrar que **no**
      existe basta exhibir **dos** sucesiones cuyas imágenes discrepen.

      Por eso el enunciado da dos: una sola no demostraría nada.

      Lo primero, comprobar que las dos son admisibles:

      $$
      a_n = \frac{1}{2n} \to 0, \qquad b_n = \frac{2}{2n+1} \to 0
      $$

      y ninguna vale 0, así que $f$ está definida en todos sus términos —el
      punto $x=0$ es justamente donde no lo está—.

      ### 2 · El primer camino

      $$
      \frac{\pi}{a_n} = \frac{\pi}{\frac{1}{2n}} = 2\pi n
      $$

      $$
      f(a_n) = \cos(2\pi n) = 1 \qquad \forall n \in \mathbb{N}
      $$

      La sucesión de imágenes es **constante igual a 1**, así que su límite es 1.

      ### 3 · El segundo camino

      $$
      \frac{\pi}{b_n} = \frac{\pi(2n+1)}{2}
      $$

      Los valores son $\frac{3\pi}{2}$, $\frac{5\pi}{2}$, $\frac{7\pi}{2}$…:
      todos múltiplos **impares** de $\frac{\pi}{2}$, y ahí el coseno se anula.

      $$
      f(b_n) = 0 \qquad \forall n \in \mathbb{N}
      $$

      Su límite es 0.

      ### 4 · Conclusión

      Si el límite de $f$ en 0 existiera y valiera $L$, las dos sucesiones de
      imágenes tendrían que converger a $L$. Pero una converge a 1 y la otra a
      0, y por la **unicidad del límite** eso obligaría a $1 = 0$.

      $$
      \boxed{\;\text{El límite } \lim_{x\to0}\cos\frac{\pi}{x} \text{ no existe}\;}
      $$

      ### 5 · Qué está pasando de verdad

      Conviene decirlo, porque explica por qué el ejercicio funciona: cuando
      $x \to 0^{+}$, el argumento $\frac{\pi}{x}$ se va a $+\infty$, y el coseno
      **oscila cada vez más rápido** entre $-1$ y 1 sin estabilizarse.

      Las dos sucesiones del enunciado están elegidas para caer siempre en el
      mismo sitio de esa oscilación: $a_n$ en los máximos y $b_n$ en los ceros.
      De hecho, escogiendo bien la sucesión se puede hacer que las imágenes
      tiendan a **cualquier** valor de $[-1,1]$.

      ### 6 · Comprobación

      Los primeros términos, para ver que no es un artificio asintótico sino que
      ocurre desde el principio:

      | $n$ | $a_n$ | $f(a_n)$ | $b_n$ | $f(b_n)$ |
      |---|---|---|---|---|
      | 1 | $0{,}5$ | $\cos 2\pi = 1$ | $0{,}667$ | $\cos\frac{3\pi}{2} = 0$ |
      | 2 | $0{,}25$ | $\cos 4\pi = 1$ | $0{,}4$ | $\cos\frac{5\pi}{2} = 0$ |
      | 3 | $0{,}167$ | $\cos 6\pi = 1$ | $0{,}286$ | $\cos\frac{7\pi}{2} = 0$ |

      Las dos columnas de $x$ bajan hacia 0 y las dos de $f$ se quedan clavadas
      en valores distintos ✔

