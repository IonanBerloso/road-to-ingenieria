      <svg viewBox="0 0 330 250" role="img" width="330" height="250"
           aria-labelledby="f-bolzano-unica-t f-bolzano-unica-d">
        <title id="f-bolzano-unica-t">La función x por e elevado a x menos uno, creciente y con una sola raíz</title>
        <desc id="f-bolzano-unica-d">La curva entra por abajo a la izquierda con el valor menos uno en x igual a cero, sube sin pararse nunca y sale por arriba a la derecha con un valor cercano a uno coma ocho en x igual a uno. Cruza el eje horizontal una sola vez, en un punto cercano a cero coma cincuenta y siete, marcado con un círculo. Dos puntos más marcan los valores en los extremos del intervalo, uno por debajo del eje y otro por encima: son los que Bolzano necesita para garantizar el cruce.</desc>
