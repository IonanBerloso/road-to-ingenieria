        <title id="f-cuadrifolia-t">La cuadrifolia con la tangente en el punto menos uno coma uno</title>
        <desc id="f-cuadrifolia-d">Una curva con cuatro pétalos iguales que salen del origen, uno hacia cada cuadrante en diagonal. El punto de coordenadas menos uno y uno está en el extremo del pétalo de arriba a la izquierda, que es su punto más alejado del origen. Por ese punto pasa una recta de pendiente uno, la tangente, que corta el eje vertical en dos. Una línea de puntos une el origen con el punto de tangencia y se ve que es perpendicular a la recta.</desc>
