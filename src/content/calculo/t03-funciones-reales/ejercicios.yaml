      <figcaption>Los cuatro se resuelven igual: se elige un punto de apoyo donde la función se sepa de memoria y se avanza por la tangente. El error es el hueco entre la recta y la curva, y por eso conviene que el punto de apoyo esté lo más cerca posible del que se busca.</figcaption>
      </figure>

  - id: carretera-con-tramo-parabolico
    titulo: Tres tramos de carretera que tienen que empalmar suave
    fuente: >-
      Ejercicio 3.16 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU ·
      Cayó en 2014/2015 5E
    nivel: practica
    enunciado: |
      Se van a construir tres tramos de carretera, dos de ellos rectos, con
      pendientes del 6 % y el 4 % respectivamente, y un tramo central
      parabólico. El tramo parabólico mide 2 km en horizontal, y empalma con la
      recta de subida en su extremo izquierdo, $A$, y con la de bajada en el
      derecho, $B$.

      Calcular las ecuaciones de los tres tramos.
    pide: Calcular las ecuaciones de los tres tramos.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué significa que una carretera «empalme» con otra en un punto?
        opciones:
          - texto: >-
              Que coinciden la **altura** y la **pendiente**: continuidad y
              derivabilidad
            correcta: true
            mensaje: |
              Eso es. Si solo coincidiera la altura habría un cambio brusco de
              inclinación —un pico, imposible de conducir—. Empalmar suave es
              exactamente ser derivable, y ahí está el contenido físico del
              ejercicio.
          - texto: Solo que coinciden las alturas
            mensaje: |
              Con solo la altura habría un vértice: el coche pasaría de subir al
              6 % a subir al 2 % de golpe. Una carretera necesita que también
              coincida la pendiente.
          - texto: Que las dos tienen la misma longitud
            mensaje: |
              Las longitudes no tienen por qué coincidir, y el enunciado no las
              da. Lo que se empalma son altura y pendiente.
          - texto: Que se cortan en un punto
            mensaje: |
              Cortarse es solo la continuidad. Dos rectas que se cruzan se cortan
              y no empalman: forman un pico.

      - tipo: calcular
        titulo: El coeficiente cuadrático
        pregunta: |
          Si el tramo parabólico es $y = ax^{2}+bx$ con origen en $A$, ¿cuánto
          vale $a$?
        respuesta:
          tipo: numero
          valor: '-0.025'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0.025'
            mensaje: |
              Falta el signo. La parábola tiene que **girar hacia abajo** para
              pasar de subir al 6 % a bajar al 4 %, así que $a<0$.
          - valor: '-0.05'
            mensaje: |
              $-0{,}05$ saldría de olvidar el 2 del denominador. De
              $2a\cdot2 = -0{,}10$ sale $a = -0{,}025$.
          - valor: '-0.01'
            mensaje: |
              $-0{,}01$ es la diferencia entre las pendientes dividida entre 10.
              La cuenta es $\frac{-0{,}04-0{,}06}{2\cdot2} = -0{,}025$.
        pista: |
          La pendiente en $x=0$ es $0{,}06$ y en $x=2$ es $-0{,}04$. Y la
          derivada de $ax^{2}+bx$ es $2ax+b$.
        desarrollo: |
          Poniendo el origen en $A$, el tramo parabólico es $y = ax^{2}+bx$ —sin
          término independiente, porque pasa por el origen— y su derivada es

          $$
          y' = 2ax+b
          $$

          **En $A$ ($x=0$)** la pendiente tiene que ser la de la recta de
          subida, el 6 %:

          $$
          y'(0) = b = 0{,}06
          $$

          **En $B$ ($x=2$)** tiene que ser la de la recta de bajada, el 4 % pero
          **descendiendo**:

          $$
          y'(2) = 4a+0{,}06 = -0{,}04
          \;\Longrightarrow\;
          4a = -0{,}10
          \;\Longrightarrow\;
          a = -0{,}025
          $$
        veredicto: |
          El signo del 4 % es la trampa del enunciado: la carretera **baja**,
          así que su pendiente es $-0{,}04$, no $+0{,}04$.

      - tipo: calcular
        titulo: La altura de B
        pregunta: |
          ¿A qué altura está $B$ respecto de $A$, en kilómetros?
        respuesta:
          tipo: numero
          valor: '0.02'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0.12'
            mensaje: |
              $0{,}12$ sería la altura si la carretera siguiera subiendo al 6 %
              durante los 2 km. Pero la parábola se va aplanando y luego baja:
              gana bastante menos.
          - valor: '0.1'
            mensaje: |
              $0{,}1$ es la ordenada en el origen de la **tercera** recta,
              escrita en el sistema original. No es la altura de $B$ sobre $A$.
          - valor: '0'
            mensaje: |
              Si $B$ estuviera a la misma altura que $A$, la parábola sería
              simétrica respecto del punto medio y las dos pendientes serían
              opuestas: $+6\%$ y $-6\%$. Aquí son $6\%$ y $4\%$.
        pista: |
          Evalúa $y = -0{,}025x^{2}+0{,}06x$ en $x=2$.
        desarrollo: |
          $$
          y(2) = -0{,}025\cdot4+0{,}06\cdot2 = -0{,}1+0{,}12 = 0{,}02
          $$

          $B$ está **20 metros por encima** de $A$.

          Tiene sentido: durante los 2 km la carretera sube cada vez menos
          —pasa del 6 % a $-4$ %— y acaba bajando, así que gana mucho menos que
          los 120 m que ganaría al 6 % constante.
        veredicto: |
          La cima está donde $y'=0$, es decir en $x = \frac{0{,}06}{0{,}05}
          = 1{,}2$ km, y ahí la altura es $0{,}036$ km: el punto más alto de la
          carretera.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Elegir el sistema de referencia.** Se pone el origen en $A$, el
              principio del tramo parabólico: así el tramo central no tiene
              término independiente.
          - texto: |
              **Pendientes en porcentaje.** Un 6 % significa pendiente
              $0{,}06$, y el tramo que baja al 4 % tiene pendiente
              $-0{,}04$.
          - texto: |
              **Empalme suave en $A$:** $y'(0) = b = 0{,}06$.
              **Empalme suave en $B$:** $y'(2) = 4a+b = -0{,}04$, de donde
              $a = -0{,}025$.
          - texto: |
              El tramo central es $y = -0{,}025x^{2}+0{,}06x$ para
              $0<x<2$, y el primero es la recta $y = 0{,}06x$ para $x<0$.
          - texto: |
              El tercero pasa por $B = (2,\;0{,}02)$ con pendiente $-0{,}04$:
              $y = -0{,}04x+0{,}1$ para $x>2$.
          - texto: |
              Como los tres tramos empalman, basta imponer que las alturas
              coincidan en $A$ y en $B$.
            trampa: true
            mensaje: |
              Con solo las alturas la carretera tendría **picos** en $A$ y en
              $B$: el vehículo pasaría de una inclinación a otra de golpe. Lo
              que se impone —y lo que da las ecuaciones— es que coincidan
              también las **pendientes**, es decir que la función sea derivable.
              Las alturas salen después, como consecuencia.
        veredicto: |
          Este ejercicio es el 3.6 con un contexto físico: allí se pedía
          derivabilidad en abstracto, aquí es que el coche no pegue un salto.

    resolucion: |
      **Datos.** Dos tramos rectos con pendientes del 6 % y del 4 %, unidos por
      un tramo parabólico de 2 km de longitud horizontal.

      ### 1 · Qué significa «empalmar» en una carretera

      Este es el contenido del ejercicio, y es físico antes que matemático.

      Si dos tramos solo coincidieran en **altura**, el vehículo pasaría de una
      inclinación a otra de golpe: un vértice. Para que la carretera sea
      transitable las pendientes también tienen que coincidir.

      $$
      \text{empalmar suave} \iff \text{misma altura} \;\wedge\;
      \text{misma pendiente} \iff \text{derivable}
      $$

      **Y son las pendientes las que dan las ecuaciones.** Las alturas salen
      después, como consecuencia.

      ### 2 · Elegir el sistema de referencia

      Conviene poner el **origen en $A$**, donde empieza el tramo parabólico.
      Así:

      - el tramo central pasa por $(0,0)$ y no tiene término independiente,
      - $B$ está en $x=2$.

      Elegir bien el origen ahorra una incógnita. Con el origen en otro sitio
      el problema sale igual, pero con más cuentas.

      ### 3 · Las pendientes, con su signo

      Un **6 %** significa que se sube 6 m por cada 100 m horizontales, es decir
      pendiente $0{,}06$.

      Y el 4 % es de **bajada**, así que su pendiente es $-0{,}04$. Ese signo es
      la trampa del enunciado: el dibujo lo deja claro, el texto no.

      ### 4 · El tramo parabólico

      $$
      y = ax^{2}+bx, \qquad y' = 2ax+b
      $$

      **En $A$**, es decir $x=0$:

      $$
      y'(0) = b = 0{,}06
      $$

      **En $B$**, es decir $x=2$:

      $$
      y'(2) = 4a+0{,}06 = -0{,}04
      \;\Longrightarrow\;
      4a = -0{,}10
      \;\Longrightarrow\;
      a = -0{,}025
      $$

      $$
      \boxed{y = -0{,}025x^{2}+0{,}06x \qquad 0<x<2}
      $$

      El signo de $a$ es negativo, como tenía que ser: la parábola abre hacia
      abajo para poder pasar de subir a bajar.

      ### 5 · Los tramos rectos

      **El primero** pasa por el origen con pendiente $0{,}06$:

      $$
      \boxed{y = 0{,}06x \qquad x<0}
      $$

      **El tercero** pasa por $B$ con pendiente $-0{,}04$. La altura de $B$:

      $$
      y(2) = -0{,}025\cdot4+0{,}06\cdot2 = -0{,}1+0{,}12 = 0{,}02
      $$

      Punto-pendiente desde $B = (2,\;0{,}02)$:

      $$
      y-0{,}02 = -0{,}04(x-2)
      \;\Longrightarrow\;
      y = -0{,}04x+0{,}08+0{,}02
      $$

      $$
      \boxed{y = -0{,}04x+0{,}1 \qquad x>2}
      $$

      ### 6 · Lo que sale de propina

      **La cima.** El punto más alto está donde $y'=0$:

      $$
      -0{,}05x+0{,}06 = 0 \;\Longrightarrow\; x = 1{,}2 \text{ km}
      $$

      $$
      y(1{,}2) = -0{,}025\cdot1{,}44+0{,}06\cdot1{,}2 = -0{,}036+0{,}072
      = 0{,}036 \text{ km}
      $$

      La carretera alcanza su altura máxima 1,2 km después de $A$, 36 m por
      encima de él.

      **El desnivel neto.** $B$ está solo 20 m por encima de $A$, cuando al 6 %
      constante habría ganado 120 m. La diferencia es lo que se «pierde» al
      aplanar y empezar a bajar.

      ### 7 · Comprobación

      Los dos empalmes, altura y pendiente:

      | | tramo izquierdo | tramo derecho | ¿pega? |
      |---|---|---|---|
      | $A$ ($x=0$), altura | $0$ | $0$ | ✔ |
      | $A$, pendiente | $0{,}06$ | $0{,}06$ | ✔ |
      | $B$ ($x=2$), altura | $0{,}02$ | $-0{,}08+0{,}1 = 0{,}02$ | ✔ |
      | $B$, pendiente | $-0{,}05\cdot2+0{,}06 = -0{,}04$ | $-0{,}04$ | ✔ |

      Los cuatro cuadran. Y una comprobación de sentido común: la parábola llega
      a su cima en $x=1{,}2$, que está **dentro** del tramo $(0,2)$. Si la cima
      hubiera caído fuera, el diseño sería incoherente con el dibujo.

      ### Resultado

      $$
      \boxed{\;y(x) = \begin{cases}
      0{,}06x & x<0 \\[4pt]
      -0{,}025x^{2}+0{,}06x & 0<x<2 \\[4pt]
      -0{,}04x+0{,}1 & x>2
      \end{cases}\;}
      $$

