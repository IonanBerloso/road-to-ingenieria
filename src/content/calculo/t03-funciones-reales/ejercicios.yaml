  - id: aproximar-con-el-diferencial
    titulo: Cuatro valores aproximados sin calculadora
    fuente: >-
      Ejercicio 3.15 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Utilizando el diferencial, aproximar los siguientes valores:

      **(a)** $e^{0,2}$ · **(b)** $\ln 0{,}9$ · **(c)** $\sqrt{27}$ ·
      **(d)** $\mathrm{sen}\,58^{\circ}$
    pide: Aproximar los cuatro valores con el diferencial.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que elegir antes de aplicar la fórmula del diferencial?
        opciones:
          - texto: >-
              El **punto de apoyo**: el más cercano donde la función se sepa de
              memoria
            correcta: true
            mensaje: |
              Eso es toda la técnica. La fórmula
              $f(a+h) \approx f(a)+f'(a)h$ solo sirve si $f(a)$ y $f'(a)$ se
              conocen exactamente. Para $\sqrt{27}$ el apoyo es 25, no 27 ni 30:
              es el cuadrado perfecto más cercano.
          - texto: El número de decimales que se quieren
            mensaje: |
              La precisión no se elige: sale de lo cerca que esté el punto de
              apoyo. Lo que se elige es el apoyo, y de ahí sale la precisión.
          - texto: Si usar la derivada primera o la segunda
            mensaje: |
              El diferencial usa **solo la primera**: es la aproximación por la
              recta tangente. Con la segunda se pasaría al polinomio de Taylor de
              orden 2, que es otro tema.
          - texto: Nada, la fórmula se aplica directamente
            mensaje: |
              Sin elegir el punto no hay fórmula que aplicar: $a$ y $h$ son
              justamente lo que hay que decidir.

      - tipo: calcular
        titulo: La raíz
        pregunta: |
          ¿Cuánto sale $\sqrt{27}$ aproximado por el diferencial desde $a=25$?
        respuesta:
          tipo: numero
          valor: '5.2'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              4 es $\sqrt{16}$: has elegido el otro cuadrado perfecto cercano y
              además no has corregido nada. Con $a=16$ habría que sumar
              $f'(16)\cdot11 = \frac{11}{8}$, y saldría $5{,}375$ — peor
              aproximación que desde 25, porque 16 está mucho más lejos de 27.
          - valor: '5'
            mensaje: |
              5 es $\sqrt{25}$, el punto de apoyo sin corregir. Falta sumar
              $f'(25)\cdot2$.
          - valor: '5.4'
            mensaje: |
              $5{,}4$ saldría de usar $f'(25) = \frac15$ en vez de
              $\frac{1}{10}$. La derivada de $\sqrt x$ es
              $\frac{1}{2\sqrt x}$, con el 2 en el denominador.
        pista: |
          $f(x) = \sqrt x$, $a = 25$, $h = 2$. Y
          $f'(x) = \frac{1}{2\sqrt x}$.
        desarrollo: |
          $$
          f(x) = \sqrt x, \qquad f'(x) = \frac{1}{2\sqrt x}
          $$

          Se apoya en $a=25$, el cuadrado perfecto más cercano, con $h = 2$:

          $$
          f(25) = 5, \qquad f'(25) = \frac{1}{2\cdot5} = \frac{1}{10}
          $$

          $$
          \sqrt{27} \approx 5+\frac{1}{10}\cdot 2 = 5+0{,}2 = \frac{26}{5} = 5{,}2
          $$

          El valor exacto es $5{,}19615$: el error es de $0{,}004$, menos del
          0,1 %.
        veredicto: |
          La aproximación sale **por encima**. No es casualidad: $\sqrt x$ es
          cóncava y su recta tangente queda siempre por arriba de la curva.

      - tipo: calcular
        titulo: El ángulo
        pregunta: |
          Para aproximar $\mathrm{sen}\,58^{\circ}$ hay que apoyarse en
          $60^{\circ}$. ¿Cuánto vale $h$ en radianes?
        respuesta:
          tipo: numero
          valor: '-0.0349066'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              $-2$ es el salto en **grados**, y la fórmula de la derivada del
              seno solo vale en **radianes**. Hay que convertir:
              $-2^{\circ} = -\frac{2\pi}{180} = -\frac{\pi}{90}$.
          - valor: '0.0349066'
            mensaje: |
              El valor absoluto es correcto, pero falta el signo: se va de
              $60^{\circ}$ **hacia abajo**, a $58^{\circ}$, así que $h$ es
              negativo.
          - valor: '-0.0174533'
            mensaje: |
              $-\frac{\pi}{180}$ es **un** grado en radianes. El salto es de dos
              grados, así que el doble.
        pista: |
          $58^{\circ}-60^{\circ} = -2^{\circ}$, y un grado son
          $\frac{\pi}{180}$ radianes.
        desarrollo: |
          El punto de apoyo es $60^{\circ}$, cuyo seno y coseno se saben de
          memoria. El salto es

          $$
          h = 58^{\circ}-60^{\circ} = -2^{\circ}
          = -\frac{2\pi}{180} = -\frac{\pi}{90} \approx -0{,}0349
          $$

          **En radianes**, porque la fórmula $\left(\mathrm{sen}\,x\right)' =
          \cos x$ solo vale ahí.

          $$
          \mathrm{sen}\,58^{\circ} \approx \mathrm{sen}\,60^{\circ}
          + \cos 60^{\circ}\cdot\left(-\frac{\pi}{90}\right)
          = \frac{\sqrt3}{2}-\frac{1}{2}\cdot\frac{\pi}{90}
          = \frac{\sqrt3}{2}-\frac{\pi}{180}
          $$

          $$
          \approx 0{,}86603-0{,}01745 \approx 0{,}8486
          $$
        veredicto: |
          Convertir a radianes es el paso que más se olvida, y no es un detalle:
          con grados la corrección saldría 115 veces más grande.

      - tipo: justificar
        pregunta: |
          Ordena el método y los cuatro resultados. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **La idea.** Cerca de un punto, la función y su recta tangente casi
              coinciden: $f(a+h) \approx f(a)+f'(a)\,h$.
          - texto: |
              **El punto de apoyo** se elige donde $f(a)$ y $f'(a)$ se sepan
              exactamente, y lo más cerca posible del valor buscado.
          - texto: |
              **(a)** $f=e^{x}$, $a=0$, $h=0{,}2$:
              $e^{0,2} \approx 1+1\cdot0{,}2 = 1{,}2$.
          - texto: |
              **(b)** $f=\ln x$, $a=1$, $h=-0{,}1$:
              $\ln0{,}9 \approx 0+1\cdot(-0{,}1) = -0{,}1$.
          - texto: |
              **(c)** $f=\sqrt x$, $a=25$, $h=2$:
              $\sqrt{27} \approx 5+\frac{2}{10} = \frac{26}{5} = 5{,}2$.
              **(d)** $f=\mathrm{sen}\,x$, $a=\frac{\pi}{3}$,
              $h=-\frac{\pi}{90}$:
              $\mathrm{sen}\,58^{\circ} \approx \frac{\sqrt3}{2}-\frac{\pi}{180}
              \approx 0{,}84857$.
          - texto: |
              Cuanto más lejos esté el punto de apoyo, mejor es la
              aproximación, porque la recta tangente abarca más.
            trampa: true
            mensaje: |
              Justo al revés: la aproximación es **local**. Cuanto más se aleja
              uno del punto de apoyo, más se separan la curva y su tangente. Por
              eso en (c) se elige 25 y no 16, aunque los dos sean cuadrados
              perfectos: 25 está más cerca de 27.
        veredicto: |
          El error del diferencial crece con $h^{2}$, así que duplicar la
          distancia multiplica el error por cuatro. Cerca siempre.

    resolucion: |
      **Datos.** Cuatro valores que aproximar con el diferencial.

      ### 1 · La herramienta

      Cerca de un punto, la función y su recta tangente casi no se distinguen:

      $$
      f(a+h) \approx f(a)+f'(a)\,h
      $$

      Para que sirva hacen falta dos cosas: que $f(a)$ y $f'(a)$ se conozcan
      **exactamente**, y que $h$ sea **pequeño**. Elegir bien el punto de apoyo
      es todo el ejercicio.

      ### 2 · (a) $e^{0,2}$

      $$
      f(x) = e^{x}, \qquad f'(x) = e^{x}, \qquad a = 0, \qquad h = 0{,}2
      $$

      $$
      e^{0,2} \approx e^{0}+e^{0}\cdot0{,}2 = 1+0{,}2 = 1{,}2
      $$

      Valor exacto: $1{,}2214$. Error: $0{,}021$, un 1,8 %.

      ### 3 · (b) $\ln 0{,}9$

      $$
      f(x) = \ln x, \qquad f'(x) = \frac{1}{x}, \qquad a = 1, \qquad h = -0{,}1
      $$

      El apoyo es 1 porque $\ln 1 = 0$ es el único logaritmo que se sabe sin
      pensar.

      $$
      \ln 0{,}9 \approx 0+1\cdot(-0{,}1) = -0{,}1
      $$

      Valor exacto: $-0{,}10536$. Error: $0{,}005$.

      El signo negativo era de esperar: $0{,}9 < 1$ y el logaritmo de un número
      menor que 1 es negativo.

      ### 4 · (c) $\sqrt{27}$

      $$
      f(x) = \sqrt x, \qquad f'(x) = \frac{1}{2\sqrt x}
      $$

      El apoyo es $a = 25$: el **cuadrado perfecto más cercano** a 27. Con
      $h=2$:

      $$
      \sqrt{27} \approx 5+\frac{1}{2\cdot5}\cdot2 = 5+\frac{2}{10}
      = \frac{26}{5} = 5{,}2
      $$

      Valor exacto: $5{,}19615$. Error: $0{,}004$, menos del 0,1 %.

      Conviene decir por qué no se elige 16, que también es cuadrado perfecto:
      está mucho más lejos, y el error crece con el cuadrado de la distancia.

      ### 5 · (d) $\mathrm{sen}\,58^{\circ}$

      El apoyo natural es $60^{\circ}$, cuyo seno y coseno se saben de memoria.
      Y aquí está el paso que más se falla:

      $$
      h = 58^{\circ}-60^{\circ} = -2^{\circ}
      = -\frac{2\pi}{180} = -\frac{\pi}{90} \approx -0{,}0349
      $$

      **En radianes.** La fórmula $\left(\mathrm{sen}\,x\right)' = \cos x$ solo
      es cierta con el ángulo en radianes; con grados habría un factor
      $\frac{\pi}{180}$ escondido.

      $$
      \mathrm{sen}\,58^{\circ}
      \approx \mathrm{sen}\,\frac{\pi}{3}+\cos\frac{\pi}{3}\cdot\left(-\frac{\pi}{90}\right)
      = \frac{\sqrt3}{2}-\frac{1}{2}\cdot\frac{\pi}{90}
      = \frac{\sqrt3}{2}-\frac{\pi}{180}
      $$

      $$
      \approx 0{,}866025-0{,}017453 = 0{,}848572
      $$

      Valor exacto: $0{,}84805$. Error: $0{,}0005$.

      ### 6 · Comprobación y sentido del error

      | | aproximado | exacto | error | ¿por encima o por debajo? |
      |---|---|---|---|---|
      | (a) $e^{0,2}$ | $1{,}2$ | $1{,}2214$ | $0{,}021$ | por debajo |
      | (b) $\ln0{,}9$ | $-0{,}1$ | $-0{,}10536$ | $0{,}005$ | por encima |
      | (c) $\sqrt{27}$ | $5{,}2$ | $5{,}19615$ | $0{,}004$ | por encima |
      | (d) $\mathrm{sen}\,58^{\circ}$ | $0{,}84857$ | $0{,}84805$ | $0{,}0005$ | por encima |

      El sentido del error **no es aleatorio**, y saberlo es una comprobación en
      sí misma: la tangente queda por debajo de la curva donde la función es
      **convexa** ($f''>0$) y por encima donde es **cóncava** ($f''<0$).

      - $e^{x}$ es convexa, así que la aproximación se queda corta ✔
      - $\ln x$, $\sqrt x$ y $\mathrm{sen}\,x$ en el primer cuadrante son
        cóncavas, así que la aproximación se pasa ✔

      Los cuatro casos encajan. Si alguno no lo hiciera, habría un error de
      signo en algún sitio.

      ### Resultado

      $$
      \boxed{\;e^{0,2} \approx 1{,}2 \qquad \ln0{,}9 \approx -0{,}1
      \qquad \sqrt{27} \approx \tfrac{26}{5} = 5{,}2
      \qquad \mathrm{sen}\,58^{\circ} \approx \tfrac{\sqrt3}{2}-\tfrac{\pi}{180}
      \approx 0{,}84857\;}
      $$

      <figure class="figura-examen">
      <svg viewBox="0 0 426 358" role="img" width="426" height="358"
           aria-labelledby="f-aproximar-diferencial-t f-aproximar-diferencial-d">
        <title id="f-aproximar-diferencial-t">Los cuatro valores aproximados con la recta tangente en un punto cómodo</title>
        <desc id="f-aproximar-diferencial-d">Cuatro recuadros. En cada uno se ve la curva de la función y, tocándola en un punto donde su valor se conoce de memoria, la recta tangente. Una línea vertical de puntos sube desde el eje horizontal en el valor que se quiere aproximar hasta cortar la recta, y ahí hay un punto marcado: esa altura es la aproximación. El hueco que queda entre la recta y la curva en ese mismo sitio es el error que se comete, y se ve que es tanto menor cuanto más cerca está el valor buscado del punto de apoyo.</desc>
