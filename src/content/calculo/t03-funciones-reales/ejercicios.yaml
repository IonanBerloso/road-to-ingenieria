  - id: derivada-parametrica
    titulo: Tres derivadas en función del parámetro
    fuente: >-
      Ejercicio 3.13 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular la derivada $\frac{dy}{dx}$ de las siguientes curvas en forma
      paramétrica en función del parámetro $t$.

      **(a)** $\begin{cases} x = t^{3}-t \\ y = 4-t^{2} \end{cases}$ ·
      **(b)** $\begin{cases} x = 2t^{3}+1 \\ y = t^{2}\cos t \end{cases}$ ·
      **(c)** $\begin{cases} x = 3\cos t \\ y = 2\,\mathrm{sen}\,t \end{cases}$
    pide: Calcular las tres derivadas en función de $t$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De dónde sale la fórmula
          $\frac{dy}{dx} = \frac{dy/dt}{dx/dt}$?
        opciones:
          - texto: >-
              De la **regla de la cadena**:
              $\frac{dy}{dt} = \frac{dy}{dx}\cdot\frac{dx}{dt}$, y se despeja
            correcta: true
            mensaje: |
              Eso es. No es «simplificar los $dt$»: es la cadena aplicada a
              $y$ como función de $x$ y $x$ como función de $t$. Y de ahí sale la
              hipótesis que hay que decir: hace falta $\frac{dx}{dt} \neq 0$.
          - texto: De simplificar los diferenciales como fracciones
            mensaje: |
              Es la forma de recordarla, pero no es una demostración: los
              diferenciales no son fracciones que se puedan cancelar sin
              justificación. La justificación es la regla de la cadena.
          - texto: De la definición de derivada como límite
            mensaje: |
              Se puede llegar así, pero es mucho más largo. El camino corto es la
              cadena.
          - texto: Es una definición nueva para curvas paramétricas
            mensaje: |
              No es una definición: es un **resultado** que se deduce de la
              cadena. Por eso arrastra la condición $\frac{dx}{dt}\neq0$.

      - tipo: calcular
        titulo: El instante donde falla la fórmula
        pregunta: |
          En el apartado (a), la fórmula deja de valer donde
          $\frac{dx}{dt} = 0$. ¿Cuál es el valor **positivo** de $t$ ahí?
        respuesta:
          tipo: numero
          valor: '0.5773503'
          tolerancia: 0.0005
          formato: un número, o una expresión como 1/√3
        distractores:
          - valor: '0'
            mensaje: |
              Con $t=0$ sale $\frac{dx}{dt} = 3\cdot0-1 = -1 \neq 0$. La
              ecuación es $3t^{2}-1 = 0$, no $3t^{2} = 0$.
          - valor: '1'
            mensaje: |
              Con $t=1$ sale $3-1 = 2 \neq 0$. Hay que resolver
              $3t^{2} = 1$, que da $t = \pm\frac{1}{\sqrt3} \approx 0{,}577$.
          - valor: '0.3333333'
            mensaje: |
              $\frac13$ es $t^{2}$, no $t$. Falta la raíz cuadrada:
              $t = \frac{1}{\sqrt3}$.
        pista: |
          $\frac{dx}{dt} = 3t^{2}-1$. Iguala a cero y despeja.
        desarrollo: |
          $$
          x(t) = t^{3}-t \;\Longrightarrow\; \frac{dx}{dt} = 3t^{2}-1
          $$

          $$
          3t^{2}-1 = 0 \;\Longrightarrow\; t = \pm\frac{1}{\sqrt3}
          \approx \pm0{,}577
          $$

          En esos dos valores la fórmula no se puede aplicar. Geométricamente,
          ahí la curva tiene **tangente vertical**: $x$ deja de variar mientras
          $y$ sigue cambiando.
        veredicto: |
          Señalar dónde falla la fórmula es parte de la respuesta. En esos
          puntos la derivada no es que valga infinito: es que $\frac{dy}{dx}$ no
          existe, aunque la curva sí tenga tangente.

      - tipo: justificar
        pregunta: |
          Ordena las tres derivadas y sus hipótesis. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **La fórmula.** Por la regla de la cadena,
              $\frac{dy}{dt} = \frac{dy}{dx}\frac{dx}{dt}$, de donde
              $\frac{dy}{dx} = \frac{dy/dt}{dx/dt}$ **siempre que**
              $\frac{dx}{dt}\neq0$.
          - texto: |
              **(a)** $\frac{dx}{dt} = 3t^{2}-1$ y $\frac{dy}{dt} = -2t$, luego
              $\frac{dy}{dx} = \dfrac{-2t}{3t^{2}-1}$.
          - texto: |
              **(b)** $\frac{dx}{dt} = 6t^{2}$ y
              $\frac{dy}{dt} = 2t\cos t - t^{2}\,\mathrm{sen}\,t$, luego
              $\frac{dy}{dx} = \dfrac{2\cos t - t\,\mathrm{sen}\,t}{6t}$ tras
              simplificar una $t$.
          - texto: |
              **(c)** $\frac{dx}{dt} = -3\,\mathrm{sen}\,t$ y
              $\frac{dy}{dt} = 2\cos t$, luego
              $\frac{dy}{dx} = -\dfrac{2\cos t}{3\,\mathrm{sen}\,t}$.
          - texto: |
              En cada caso hay que decir **dónde falla**: en (a) para
              $t = \pm\frac{1}{\sqrt3}$, en (b) para $t=0$ y en (c) para
              $t = k\pi$.
          - texto: |
              En (b) se puede simplificar la $t$ del numerador y el denominador
              sin más, porque el resultado es válido para todo $t$.
            trampa: true
            mensaje: |
              Simplificar es correcto **para $t\neq0$**, y hay que decirlo: en
              $t=0$ el denominador original $6t^{2}$ se anula y la fórmula no
              se puede aplicar. La expresión simplificada parece definida ahí
              —$\frac{2\cos t - t\,\mathrm{sen}\,t}{6t}$ tampoco lo está, mira el
              $6t$— pero el punto sigue fuera. Cancelar factores esconde
              restricciones.
        veredicto: |
          Cancelar una $t$ es legítimo y conveniente, pero la restricción
          $t\neq0$ viaja con el resultado. Es el mismo cuidado que con cualquier
          simplificación de un cociente.

    resolucion: |
      **Datos.** Tres curvas en paramétricas. Se pide $\frac{dy}{dx}$ en función
      de $t$.

      ### 1 · La fórmula y su hipótesis

      Si $y$ depende de $x$ y $x$ depende de $t$, la regla de la cadena da

      $$
      \frac{dy}{dt} = \frac{dy}{dx}\cdot\frac{dx}{dt}
      $$

      y despejando:

      $$
      \frac{dy}{dx} = \frac{dy/dt}{dx/dt},
      \qquad\text{siempre que}\qquad \frac{dx}{dt} \neq 0
      $$

      Esa condición no es un detalle: donde $\frac{dx}{dt}=0$ la curva tiene
      **tangente vertical** y $\frac{dy}{dx}$ no existe. Señalar esos puntos
      forma parte de la respuesta.

      ### 2 · (a) $x = t^{3}-t$, $y = 4-t^{2}$

      $$
      \frac{dx}{dt} = 3t^{2}-1, \qquad \frac{dy}{dt} = -2t
      $$

      $$
      \boxed{\frac{dy}{dx} = \frac{-2t}{3t^{2}-1}}
      $$

      **Dónde falla:** $3t^{2}-1 = 0$, es decir
      $t = \pm\frac{1}{\sqrt3} \approx \pm0{,}577$. Ahí la curva tiene tangente
      vertical.

      Y hay otro punto interesante: en $t=0$ el numerador se anula, así que
      $\frac{dy}{dx} = 0$ y la tangente es **horizontal**. La curva pasa por
      $(0,4)$ con tangente horizontal, que es su punto más alto.

      ### 3 · (b) $x = 2t^{3}+1$, $y = t^{2}\cos t$

      $$
      \frac{dx}{dt} = 6t^{2}
      $$

      Para $y$ hace falta la regla del producto:

      $$
      \frac{dy}{dt} = 2t\cos t + t^{2}\left(-\mathrm{sen}\,t\right)
      = 2t\cos t - t^{2}\,\mathrm{sen}\,t
      $$

      $$
      \frac{dy}{dx} = \frac{2t\cos t - t^{2}\,\mathrm{sen}\,t}{6t^{2}}
      $$

      Sacando factor común $t$ arriba y simplificando **para $t\neq0$**:

      $$
      \boxed{\frac{dy}{dx} = \frac{2\cos t - t\,\mathrm{sen}\,t}{6t}}
      $$

      **Dónde falla:** en $t=0$, donde $\frac{dx}{dt} = 0$. La simplificación no
      lo arregla: el $6t$ del denominador sigue anulándose ahí.

      ### 4 · (c) $x = 3\cos t$, $y = 2\,\mathrm{sen}\,t$

      $$
      \frac{dx}{dt} = -3\,\mathrm{sen}\,t, \qquad \frac{dy}{dt} = 2\cos t
      $$

      $$
      \boxed{\frac{dy}{dx} = \frac{2\cos t}{-3\,\mathrm{sen}\,t}
      = -\frac{2\cos t}{3\,\mathrm{sen}\,t}
      = -\frac{2}{3}\cot t}
      $$

      **Dónde falla:** $\mathrm{sen}\,t = 0$, es decir $t = k\pi$. Esos son los
      puntos $(\pm3,0)$, los extremos del eje mayor, donde la tangente es
      vertical.

      ### 5 · Qué curva es cada una

      La (c) merece un comentario porque se reconoce: eliminando el parámetro,

      $$
      \left(\frac{x}{3}\right)^{2}+\left(\frac{y}{2}\right)^{2}
      = \cos^{2}t+\mathrm{sen}^{2}t = 1
      $$

      es una **elipse** de semiejes 3 y 2. Y la derivada obtenida coincide con
      la que da la derivación implícita sobre esa ecuación:

      $$
      \frac{2x}{9}+\frac{2y\,y'}{4} = 0
      \;\Longrightarrow\;
      y' = -\frac{4x}{9y}
      = -\frac{4\cdot3\cos t}{9\cdot2\,\mathrm{sen}\,t}
      = -\frac{2\cos t}{3\,\mathrm{sen}\,t} \quad\checkmark
      $$

      Los dos métodos dan lo mismo, como tiene que ser.

      ### 6 · Comprobación

      **(a)** en $t=1$: el punto es $x = 0$, $y = 3$, y la derivada
      $\frac{-2}{2} = -1$.

      Se puede contrastar viendo por dónde pasa la curva cerca: en $t=1{,}1$,
      $x = 0{,}231$ e $y = 2{,}79$. La pendiente aproximada es

      $$
      \frac{2{,}79-3}{0{,}231-0} \approx -0{,}91
      $$

      cerca de $-1$, y se acerca más cuanto menor sea el salto ✔

      **(c)** en $t = \frac{\pi}{4}$: el punto es
      $\left(\frac{3\sqrt2}{2},\sqrt2\right) \approx (2{,}12,\,1{,}41)$ y la
      derivada vale $-\frac23$.

      Sustituyendo en la fórmula implícita:
      $-\frac{4\cdot2{,}12}{9\cdot1{,}41} = -\frac{8{,}49}{12{,}73}
      \approx -0{,}667 = -\frac23$ ✔

