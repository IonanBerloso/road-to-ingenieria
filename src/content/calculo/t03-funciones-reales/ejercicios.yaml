  - id: ej-diferencial-el-punto-de-apoyo
    titulo: Aproximar una raíz, y elegir dónde apoyarse
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Aproximar $\sqrt{52}$ con la recta tangente, sin calculadora.
    pide: El valor aproximado, y sobre todo el punto de apoyo que lo hace bueno.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para aproximar $\sqrt{52}$ con $f(a+h) \approx f(a) + f'(a)\,h$,
          ¿dónde conviene poner el punto de apoyo $a$?
        opciones:
          - texto: En 49, que es el cuadrado perfecto más cercano
            correcta: true
            mensaje: |
              Eso es. El punto de apoyo tiene que cumplir **dos** cosas a la
              vez: que sepas su valor de memoria y que esté cerca. 49 cumple
              las dos, y por eso $h$ sale valiendo solo 3.
          - texto: En 52, que es el número del que queremos la raíz
            mensaje: |
              Ahí está justo lo que no sabemos. El punto de apoyo es el sitio
              **conocido** desde el que se salta; si supieras $\sqrt{52}$ no
              harías nada de esto.
          - texto: En 25, que es el que usa el ejemplo del tema
            mensaje: |
              25 tiene raíz exacta, sí, pero está a 27 de distancia. La
              aproximación de la tangente empeora deprisa al alejarse, y desde
              ahí saldría 7,7 en vez de 7,21.
          - texto: En 100, que es el más cómodo de todos
            mensaje: |
              Cómodo sí, cercano no: $h$ valdría $-48$. Lo cómodo del punto de
              apoyo no es que su raíz sea redonda, es que esté cerca.

      - tipo: calcular
        titulo: El valor aproximado
        pregunta: |
          Con $a = 49$ y $h = 3$, y sabiendo que la derivada de $\sqrt{x}$ es
          $1/(2\sqrt{x})$, ¿cuánto vale la aproximación?
        respuesta:
          tipo: numero
          valor: '7.2142857'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '7.0714286'
            mensaje: |
              Te has dejado la $h$. La derivada vale $1/14$, pero eso es lo que
              sube la tangente **por cada unidad**: hay que multiplicarla por
              los 3 que avanzas.
          - valor: '7.7'
            mensaje: |
              Ese es el resultado de apoyarte en 25. Sale de una cuenta
              correcta desde un punto malo, y por eso este ejercicio va de
              elegir el punto: el error pasa de tres milésimas a medio punto.
          - valor: '7.25'
            mensaje: |
              Ese es el resultado de apoyarte en 64, con $h = -12$. No está mal
              del todo —64 también tiene raíz exacta— pero está más lejos que
              49, y se nota.
        pista: |
          $\sqrt{52} \approx 7 + \dfrac{1}{2\cdot 7}\cdot 3$.
        desarrollo: |
          $$
          \sqrt{52} \approx \sqrt{49} + \frac{1}{2\sqrt{49}}\cdot 3
          = 7 + \frac{3}{14} = \frac{101}{14} = 7{,}2142857
          $$

          El valor de verdad es $7{,}2111$, así que la aproximación se pasa en
          **tres milésimas** — y se pasa, no se queda corta, porque la raíz es
          cóncava y su tangente va por encima.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'Se busca el cuadrado perfecto más cercano a 52: es 49, y su raíz es 7.'
          - texto: 'Con $a=49$ y $h=3$ queda $\sqrt{52} \approx 7 + \frac{3}{14} = \frac{101}{14}$.'
          - texto: Como la raíz es cóncava, la tangente va por encima y la aproximación se pasa.
          - texto: 'También sirve $a=64$, pero está más lejos: da 7,25 en vez de 7,2143.'
          - texto: Y da igual dónde apoyarse, porque la fórmula de la tangente es exacta.
            trampa: true
            mensaje: |
              No es exacta: es una aproximación, y su error crece con el
              **cuadrado** de la distancia. Por eso apoyarse en 25 —que es el
              punto que el tema usa para $\sqrt{27}$— aquí da 7,7: casi medio
              punto de error donde había tres milésimas.
    resolucion: |
      **La idea.** Cerca de un punto, una función y su recta tangente casi no
      se distinguen. Eso convierte la tangente en una calculadora de bolsillo:
      $f(a+h) \approx f(a) + f'(a)\,h$.

      **Lo que decide el resultado no es la fórmula, es el punto.** Aquí hay
      tres candidatos con raíz exacta —25, 49 y 64— y los tres dan una cuenta
      correcta con resultados que no se parecen:

      | apoyo | $h$ | aproximación | error |
      |---|---|---|---|
      | 25 | 27 | 7,7 | 0,49 |
      | **49** | **3** | **7,2143** | **0,0032** |
      | 64 | −12 | 7,25 | 0,039 |

      El error va con el **cuadrado** de $h$: desde el mismo punto de apoyo,
      acercarse a la mitad lo hace cuatro veces menor. En la tabla cambian las
      dos cosas a la vez —la distancia y el punto—, y por eso el salto de 25 a
      49 no divide el error por 81 sino por más de 150. La regla que sale de
      aquí es la que hay que llevar al examen: **el más cercano de los que te
      sabes de memoria**, no el más redondo.

      **Y el signo.** La raíz cuadrada es cóncava, así que su tangente va
      siempre por encima: con este método una raíz sale siempre pasada. Saberlo
      sirve para comprobar el resultado sin volver a hacer la cuenta.

      <figure class="figura-examen">
      <svg viewBox="0 0 335 235" role="img" width="335" height="235"
