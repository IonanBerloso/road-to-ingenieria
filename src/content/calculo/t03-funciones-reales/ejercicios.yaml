      <figcaption>Las tres curvas del enunciado. En la primera hay dos puntos con tangente vertical —donde dx/dt se anula— y en ellos dy/dx no existe; en la tercera, la elipse, pasa lo mismo en los extremos del eje horizontal. Saberlo evita dividir por cero sin darse cuenta.</figcaption>
      </figure>

  - id: dos-tangentes-en-un-punto
    titulo: Un punto por el que la curva pasa dos veces
    fuente: >-
      Ejercicio 3.14 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular la ecuación de la recta tangente (o tangentes) de la curva

      $$
      \begin{cases}
      x = t^{5}-4t^{3} \\
      y = t^{2}
      \end{cases}
      $$

      en el punto $P(0,4)$.
    pide: Calcular la recta tangente o tangentes en $P$.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice «la recta tangente (o tangentes)». ¿Qué está
          avisando?
        opciones:
          - texto: >-
              Que el punto puede alcanzarse con **varios valores del parámetro**,
              y entonces hay varias tangentes
            correcta: true
            mensaje: |
              Exacto, y ese paréntesis es la pista del ejercicio. En una curva
              paramétrica un mismo punto del plano puede corresponder a dos $t$
              distintas: la curva pasa dos veces por ahí, con pendientes
              distintas.
          - texto: Que la tangente podría no existir
            mensaje: |
              El plural no sugiere ausencia sino multiplicidad. Y aquí existen:
              son dos.
          - texto: Que hay que dar la tangente y la normal
            mensaje: |
              La normal no se pide. El plural se refiere a varias **tangentes**,
              no a otra recta distinta.
          - texto: Que la curva no es derivable en $P$
            mensaje: |
              Sí lo es, en los dos pasos por el punto. Lo que ocurre es que hay
              dos pasos, cada uno con su derivada.

      - tipo: calcular
        titulo: Los valores del parámetro
        pregunta: |
          ¿Cuál es el valor **positivo** de $t$ para el que la curva pasa por
          $P(0,4)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              4 es la **ordenada** del punto, y $y = t^{2}$: hay que sacar la
              raíz. De $t^{2} = 4$ salen $t=2$ y $t=-2$.
          - valor: '0'
            mensaje: |
              Con $t=0$ sale $y=0$, no 4. El $t=0$ sí anula la $x$, pero hay que
              cumplir **las dos** ecuaciones a la vez.
          - valor: '1.4142136'
            mensaje: |
              $\sqrt2$ saldría de $t^{2}=2$. Aquí la ordenada es 4, así que
              $t^{2} = 4$ y $t = \pm2$.
        pista: |
          Hay que resolver **el sistema**: $t^{5}-4t^{3} = 0$ y $t^{2} = 4$ a la
          vez.
        desarrollo: |
          Hay que imponer las dos coordenadas:

          $$
          t^{2} = 4 \;\Longrightarrow\; t = \pm2
          $$

          $$
          t^{5}-4t^{3} = t^{3}\left(t^{2}-4\right) = 0
          \;\Longrightarrow\;
          t = 0 \;\text{ o }\; t = \pm2
          $$

          Los valores que cumplen **las dos** son $t = 2$ y $t = -2$. El
          positivo es $t=2$.

          El $t=0$ satisface la primera pero no la segunda: da el punto
          $(0,0)$, no $(0,4)$.
        veredicto: |
          Dos valores de $t$ para un mismo punto del plano: la curva pasa dos
          veces por $(0,4)$. De ahí las dos tangentes.

      - tipo: calcular
        titulo: La pendiente en uno de los pasos
        pregunta: |
          ¿Cuál es la pendiente de la tangente correspondiente a $t=2$?
        respuesta:
          tipo: numero
          valor: '0.125'
          tolerancia: 0.0005
          formato: un número, o una fracción como 1/8
        distractores:
          - valor: '-0.125'
            mensaje: |
              $-\frac18$ es la pendiente del **otro** paso, el de $t=-2$. Con
              $t=2$ el numerador $2t = 4$ es positivo y el denominador
              $5\cdot16-12\cdot4 = 32$ también.
          - valor: '8'
            mensaje: |
              8 es el inverso. La derivada es
              $\frac{dy/dt}{dx/dt} = \frac{4}{32} = \frac18$, no al revés.
          - valor: '0.25'
            mensaje: |
              $\frac14$ saldría de $\frac{4}{16}$. El denominador es
              $5t^{4}-12t^{2} = 80-48 = 32$, no 16.
        pista: |
          $\frac{dx}{dt} = 5t^{4}-12t^{2}$ y $\frac{dy}{dt} = 2t$. Evalúa en
          $t=2$.
        desarrollo: |
          $$
          \frac{dx}{dt} = 5t^{4}-12t^{2}, \qquad \frac{dy}{dt} = 2t
          $$

          $$
          \frac{dy}{dx} = \frac{2t}{5t^{4}-12t^{2}}
          $$

          En $t=2$:

          $$
          \frac{dy}{dx} = \frac{4}{5\cdot16-12\cdot4} = \frac{4}{80-48}
          = \frac{4}{32} = \frac{1}{8}
          $$

          Y en $t=-2$ sale $\frac{-4}{32} = -\frac18$, la opuesta.
        veredicto: |
          Las dos pendientes son opuestas, y no por casualidad: la curva es
          simétrica respecto del eje $OY$, porque $x$ es impar en $t$ e $y$ es
          par.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Buscar los parámetros.** Hay que resolver el sistema
              $t^{5}-4t^{3} = 0$ **y** $t^{2} = 4$. Sale $t = 2$ y $t = -2$: la
              curva pasa **dos veces** por $P$.
          - texto: |
              El $t=0$ cumple la primera ecuación pero no la segunda: da el
              punto $(0,0)$, no $(0,4)$. Hay que imponer **las dos**
              coordenadas.
          - texto: |
              **La derivada:**
              $\frac{dy}{dx} = \frac{2t}{5t^{4}-12t^{2}}$.
          - texto: |
              En $t=2$ vale $\frac{4}{32} = \frac18$, y en $t=-2$ vale
              $-\frac18$.
          - texto: |
              **Dos tangentes**, por punto-pendiente desde $(0,4)$:
              $y = 4+\frac{x}{8}$ y $y = 4-\frac{x}{8}$, o en compacto
              $y = 4 \pm \frac{x}{8}$.
          - texto: |
              Como el punto es uno solo, hay una sola tangente, y las dos
              pendientes obtenidas son la misma recta vista de dos formas.
            trampa: true
            mensaje: |
              $\frac18$ y $-\frac18$ son pendientes **distintas**, así que las
              rectas son distintas: una sube y otra baja. Que el punto sea uno no
              obliga a que la tangente lo sea — la curva se cruza consigo misma
              ahí, y en un punto de autointersección hay tantas tangentes como
              ramas pasen.
        veredicto: |
          $P(0,4)$ es un **punto doble** de la curva. Es exactamente lo que el
          «(o tangentes)» del enunciado estaba avisando.

    resolucion: |
      **Datos.** La curva $x = t^{5}-4t^{3}$, $y = t^{2}$, y el punto $P(0,4)$.
      Se piden las tangentes ahí.

      ### 1 · El aviso del enunciado

      «La recta tangente **(o tangentes)**». Ese paréntesis es la pista: en una
      curva paramétrica, un mismo punto del plano puede alcanzarse con **varios
      valores del parámetro**. Cada uno es un paso distinto de la curva por ese
      punto, y cada paso tiene su propia pendiente.

      ### 2 · Buscar los parámetros

      Hay que imponer **las dos** coordenadas a la vez:

      $$
      \begin{cases}
      t^{5}-4t^{3} = 0 \\
      t^{2} = 4
      \end{cases}
      $$

      De la segunda: $t = \pm2$.

      De la primera: $t^{3}\left(t^{2}-4\right) = 0$, que da $t=0$ y
      $t=\pm2$.

      Los valores comunes son $t=2$ y $t=-2$.

      **El $t=0$ hay que descartarlo explícitamente**: cumple la primera
      ecuación pero no la segunda, y corresponde al punto $(0,0)$. Es el error
      que se comete al resolver solo una de las dos.

      ### 3 · La derivada

      $$
      \frac{dx}{dt} = 5t^{4}-12t^{2},
      \qquad
      \frac{dy}{dt} = 2t
      $$

      $$
      \frac{dy}{dx} = \frac{2t}{5t^{4}-12t^{2}}
      $$

      Conviene comprobar que el denominador no se anula en los dos parámetros
      que interesan: $5\cdot16-12\cdot4 = 32 \neq 0$ ✔ para los dos, porque
      solo aparecen potencias pares de $t$.

      ### 4 · Las dos pendientes

      $$
      t=2: \quad \frac{dy}{dx} = \frac{4}{80-48} = \frac{4}{32} = \frac18
      $$

      $$
      t=-2: \quad \frac{dy}{dx} = \frac{-4}{80-48} = -\frac{4}{32} = -\frac18
      $$

      Son **opuestas**, y hay una razón: $x(t)$ es una función **impar** de $t$
      e $y(t)$ es **par**. Cambiar $t$ por $-t$ refleja la curva respecto del
      eje $OY$, y la curva es simétrica.

      ### 5 · Las rectas

      Punto-pendiente desde $P(0,4)$, que además es la ordenada en el origen:

      $$
      y = 4+\frac{1}{8}x
      \qquad\text{y}\qquad
      y = 4-\frac{1}{8}x
      $$

      $$
      \boxed{\;y = 4 \pm \frac{x}{8}\;}
      $$

      ### 6 · Qué está pasando en ese punto

      $P(0,4)$ es un **punto doble** de la curva: un punto donde se cruza
      consigo misma. La curva llega ahí una vez con $t=-2$ y otra con $t=2$, y
      en cada pasada lleva una dirección distinta.

      No es una singularidad ni un fallo: en cada rama por separado la curva es
      perfectamente suave. Simplemente hay **dos** ramas.

      ### 7 · Comprobación

      **De que los dos parámetros dan el mismo punto:**

      $$
      t=2: \quad x = 32-32 = 0, \quad y = 4 \quad\checkmark
      $$

      $$
      t=-2: \quad x = -32+32 = 0, \quad y = 4 \quad\checkmark
      $$

      **De las pendientes, numéricamente.** Cerca de $t=2$, con
      $t = 2{,}05$:

      $$
      x = 2{,}05^{5}-4\cdot2{,}05^{3} = 36{,}2-34{,}5 = 1{,}72,
      \qquad y = 4{,}20
      $$

      Pendiente aproximada:

      $$
      \frac{4{,}20-4}{1{,}72-0} \approx 0{,}116
      $$

      cerca de $\frac18 = 0{,}125$, y se acerca más cuanto menor sea el salto ✔

      **De la simetría:** con $t=-2{,}05$ sale $x = -1{,}72$ e $y = 4{,}20$, el
      punto reflejado. La pendiente aproximada es $-0{,}116$, la opuesta ✔

