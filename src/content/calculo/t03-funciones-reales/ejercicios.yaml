ejercicios:
  - id: dominio-y-rango
    titulo: Seis dominios y seis rangos
    fuente: >-
      Ejercicio 3.1 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU
    enunciado: |
      Determinar el dominio y el rango de las siguientes funciones.

      **(a)** $f(x) = x^{2}-3x+2$ · **(b)** $f(x) = 1+2\,\mathrm{sen}\,x$ ·
      **(c)** $f(x) = 2+\left|x+1\right|$

      **(d)** $f(x) = \sqrt{x-1}-2$ ·
      **(e)** $f(x) = \frac{3\pi}{2}+3\arcsin(2x)$ ·
      **(f)** $f(x) = -\pi+\arccos(x)$
    pide: Dar el dominio y el rango de las seis.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se busca un dominio?
        opciones:
          - texto: >-
              **Prohibiendo**: se buscan las operaciones que no siempre se
              pueden hacer y se descarta lo que las rompe
            correcta: true
            mensaje: |
              Eso es. El dominio no se calcula de frente: se recorre la fórmula
              buscando divisiones, raíces de índice par, logaritmos y
              trigonométricas inversas, y se excluye lo que las hace
              imposibles. Lo que queda es el dominio.
          - texto: Resolviendo la ecuación $f(x)=0$
            mensaje: |
              Eso da los **ceros** de la función, que es otra cosa. El dominio
              es dónde la fórmula tiene sentido, no dónde vale cero.
          - texto: Mirando hasta dónde llegan los valores de $f$
            mensaje: |
              Eso es el **rango**, no el dominio. El dominio está en el eje de
              las $x$ y el rango en el de las $y$.
          - texto: >-
              Es siempre $\mathbb{R}$ salvo que haya una fracción
            mensaje: |
              Las fracciones no son lo único que restringe. Las raíces pares,
              los logaritmos y las trigonométricas inversas también, y estas
              últimas son las que más se olvidan.

      - tipo: calcular
        titulo: El caso que casi nadie ve
        pregunta: |
          En $f(x) = \frac{3\pi}{2}+3\arcsin(2x)$, ¿cuál es el extremo derecho
          del dominio?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 sería el extremo si el argumento fuera $x$ a secas. Pero es
              $2x$, y la condición $2x \le 1$ da $x \le \frac12$. El factor 2
              **encoge** el dominio a la mitad.
          - valor: '2'
            mensaje: |
              Has multiplicado por 2 en vez de dividir. De $-1 \le 2x \le 1$ se
              despeja $x$ dividiendo: $-\frac12 \le x \le \frac12$.
          - valor: '4.712389'
            mensaje: |
              $\frac{3\pi}{2}$ es el término que se suma **fuera**, y ese no
              toca el dominio: desplaza el rango hacia arriba. El dominio lo fija
              solo lo que hay dentro del arcoseno.
        pista: |
          $\arcsin$ solo acepta argumentos entre $-1$ y 1. Aquí el argumento es
          $2x$.
        desarrollo: |
          El arcoseno solo está definido para argumentos en $[-1,1]$:

          $$
          -1 \le 2x \le 1
          \;\Longleftrightarrow\;
          -\frac12 \le x \le \frac12
          $$

          Luego $D = \left[-\frac12,\frac12\right]$, y el extremo derecho es
          $\frac12$.

          El $\frac{3\pi}{2}$ y el 3 que multiplica no afectan al dominio: solo
          estiran y desplazan el **rango**.
        veredicto: |
          Ese $\frac12$ no aparece escrito en ninguna parte de la fórmula. Sale
          de saber qué acepta el arcoseno.

      - tipo: calcular
        titulo: Un rango con vértice
        pregunta: |
          ¿Cuál es el menor valor que toma $f(x) = x^{2}-3x+2$?
        respuesta:
          tipo: numero
          valor: '-0.25'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es $f(0)$, el término independiente. El mínimo de una parábola
              está en su vértice, no en $x=0$.
          - valor: '1.5'
            mensaje: |
              $\frac32$ es la **abscisa** del vértice, $x = \frac{-b}{2a}$. El
              valor mínimo es la ordenada: $f\left(\frac32\right)$.
          - valor: '0'
            mensaje: |
              0 sería el mínimo si la parábola fuera tangente al eje, es decir
              si tuviera raíz doble. Aquí tiene dos raíces distintas, 1 y 2, así
              que baja por debajo del eje entre ellas.
        pista: |
          El vértice está en $x = \frac{-b}{2a} = \frac32$. Evalúa ahí.
        desarrollo: |
          La parábola abre hacia arriba ($a=1>0$), así que su mínimo está en el
          vértice:

          $$
          x_v = \frac{-b}{2a} = \frac{3}{2}
          $$

          $$
          f\!\left(\frac32\right) = \frac94-\frac92+2 = \frac{9-18+8}{4}
          = -\frac14
          $$

          Luego $R = \left[-\frac14,\;\infty\right)$, y el dominio es todo
          $\mathbb{R}$.
        veredicto: |
          Dominio y rango son independientes: aquí el dominio es todo
          $\mathbb{R}$ y el rango solo la mitad de arriba de una recta.

      - tipo: justificar
        pregunta: |
          Ordena el criterio para las seis funciones. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **(a)** Parábola: $D = \mathbb{R}$, y el rango arranca en el
              vértice, $R = \left[-\frac14,\infty\right)$.
          - texto: |
              **(b)** El seno oscila entre $-1$ y 1, así que $1+2\,\mathrm{sen}\,x$
              oscila entre $-1$ y 3: $D = \mathbb{R}$, $R = [-1,3]$.
          - texto: |
              **(c)** El valor absoluto nunca es negativo, así que
              $2+\left|x+1\right| \ge 2$: $D = \mathbb{R}$, $R = [2,\infty)$.
          - texto: |
              **(d)** La raíz exige $x \ge 1$, y $\sqrt{x-1} \ge 0$ da
              $f \ge -2$: $D = [1,\infty)$, $R = [-2,\infty)$.
          - texto: |
              **(e)** y **(f)** las restringen las trigonométricas inversas:
              $D = \left[-\frac12,\frac12\right]$ con $R = [0,3\pi]$, y
              $D = [-1,1]$ con $R = [-\pi,0]$.
          - texto: |
              En **(b)** el dominio es $[-1,3]$, porque el seno solo toma
              valores ahí.
            trampa: true
            mensaje: |
              Eso confunde dominio con rango. El seno **acepta** cualquier
              número real —su dominio es $\mathbb{R}$— y **devuelve** valores en
              $[-1,1]$. Lo que está entre $-1$ y 3 es el rango de
              $1+2\,\mathrm{sen}\,x$, no su dominio.
        veredicto: |
          Es el intercambio más común del tema: el dominio vive en el eje
          horizontal y el rango en el vertical. Confundirlos cambia el
          ejercicio entero.

    resolucion: |
      **Datos.** Seis funciones. Se piden dominio y rango de cada una.

      ### 1 · Las dos preguntas se hacen al revés

      **El dominio se busca prohibiendo.** Se recorre la fórmula buscando las
      operaciones que no siempre se pueden hacer:

      | operación | restricción |
      |---|---|
      | dividir | el denominador no puede anularse |
      | raíz de índice par | el radicando no puede ser negativo |
      | logaritmo | el argumento tiene que ser positivo |
      | $\arcsin$, $\arccos$ | el argumento tiene que estar en $[-1,1]$ |

      **El rango se busca componiendo.** Se parte de lo que devuelve la pieza
      básica y se le aplican los estiramientos y desplazamientos de fuera.

      ### 2 · (a) $f(x) = x^{2}-3x+2$

      Un polinomio no prohíbe nada: $D = \mathbb{R}$.

      Es una parábola que abre hacia arriba, con vértice en

      $$
      x_v = \frac{3}{2},
      \qquad
      f\!\left(\frac32\right) = \frac94-\frac92+2 = -\frac14
      $$

      $$
      R = \left[-\frac14,\;\infty\right)
      $$

      ### 3 · (b) $f(x) = 1+2\,\mathrm{sen}\,x$

      El seno acepta cualquier real: $D = \mathbb{R}$.

      Devuelve valores en $[-1,1]$. Multiplicar por 2 lo estira a $[-2,2]$ y
      sumar 1 lo desplaza:

      $$
      R = [-1,\;3]
      $$

      ### 4 · (c) $f(x) = 2+\left|x+1\right|$

      El valor absoluto acepta todo: $D = \mathbb{R}$.

      Y nunca es negativo, con mínimo 0 alcanzado en $x=-1$:

      $$
      R = [2,\;\infty)
      $$

      ### 5 · (d) $f(x) = \sqrt{x-1}-2$

      La raíz es de índice par, así que el radicando no puede ser negativo:

      $$
      x-1 \ge 0 \;\Longrightarrow\; D = [1,\;\infty)
      $$

      Y $\sqrt{x-1}$ recorre $[0,\infty)$, así que restando 2:

      $$
      R = [-2,\;\infty)
      $$

      ### 6 · (e) $f(x) = \frac{3\pi}{2}+3\arcsin(2x)$

      Aquí está el apartado que se falla. El arcoseno solo acepta argumentos en
      $[-1,1]$, y el argumento es $2x$:

      $$
      -1 \le 2x \le 1 \;\Longrightarrow\; D = \left[-\frac12,\;\frac12\right]
      $$

      El factor 2 **encoge el dominio a la mitad**, y ese $\frac12$ no está
      escrito en ninguna parte de la fórmula.

      Para el rango: $\arcsin$ devuelve valores en
      $\left[-\frac{\pi}{2},\frac{\pi}{2}\right]$. Multiplicando por 3 queda
      $\left[-\frac{3\pi}{2},\frac{3\pi}{2}\right]$, y sumando
      $\frac{3\pi}{2}$:

      $$
      R = \left[0,\;3\pi\right]
      $$

      ### 7 · (f) $f(x) = -\pi+\arccos(x)$

      El argumento es $x$ a secas:

      $$
      D = [-1,\;1]
      $$

      $\arccos$ devuelve valores en $[0,\pi]$, y restando $\pi$:

      $$
      R = [-\pi,\;0]
      $$

      ### 8 · Comprobación

      La comprobación más rápida de un rango es evaluar en los extremos del
      dominio y en los puntos singulares:

      | | punto | valor |
      |---|---|---|
      | (a) | $x=\frac32$ | $-\frac14$, el mínimo ✔ |
      | (d) | $x=1$ | $-2$, el mínimo ✔ |
      | (e) | $x=\pm\frac12$ | $\frac{3\pi}{2}\pm\frac{3\pi}{2}$, o sea $3\pi$ y 0 ✔ |
      | (f) | $x=-1$ | $-\pi+\pi = 0$; $x=1$ da $-\pi+0 = -\pi$ ✔ |

      En (f) conviene fijarse en que el arcocoseno es **decreciente**: el
      extremo izquierdo del dominio da el valor más grande del rango.

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \text{(a)}\; & D=\mathbb{R},\; R=\left[-\tfrac14,\infty\right) &
      \text{(d)}\; & D=[1,\infty),\; R=[-2,\infty) \\
      \text{(b)}\; & D=\mathbb{R},\; R=[-1,3] &
      \text{(e)}\; & D=\left[-\tfrac12,\tfrac12\right],\; R=[0,3\pi] \\
      \text{(c)}\; & D=\mathbb{R},\; R=[2,\infty) &
      \text{(f)}\; & D=[-1,1],\; R=[-\pi,0]
      \end{aligned}}
      $$

  - id: funcion-inversa
    titulo: Seis inversas, y el signo que decide una de ellas
    fuente: >-
      Ejercicio 3.2 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU ·
      El apartado (e) cayó en 2015/2016 5E
    enunciado: |
      Calcular la función inversa de las siguientes funciones en los dominios
      indicados, y el dominio de dicha función inversa.

      **(a)** $f(x) = 1+e^{2x}$, $D = \mathbb{R}$ ·
      **(b)** $f(x) = x^{2}-1$, $D = (-\infty,0]$ ·
      **(c)** $f(x) = \ln(x+3)$, $D = (-3,\infty)$

      **(d)** $f(x) = \cos(x-1)$, $D = [1,\pi+1]$ ·
      **(e)** $f(x) = \cosh x$, $D = [0,\infty)$ ·
      **(f)** $f(x) = \mathrm{senh}\,x$, $D = \mathbb{R}$
    pide: Calcular las seis inversas y sus dominios.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el enunciado especifica el dominio en cada apartado?
        opciones:
          - texto: >-
              Porque la inversa **solo existe donde la función es inyectiva**, y
              eso depende del dominio en el que se mire
            correcta: true
            mensaje: |
              Eso es. $x^{2}-1$ no tiene inversa en $\mathbb{R}$ —2 y $-2$ dan lo
              mismo—, pero en $(-\infty,0]$ sí. El dominio no es un adorno del
              enunciado: es lo que hace posible el ejercicio.
          - texto: Para que el cálculo sea más corto
            mensaje: |
              No lo acorta: lo hace posible. Sin restringir el dominio, en tres
              de los seis apartados la inversa **no existiría**.
          - texto: Porque la inversa siempre tiene el mismo dominio que la función
            mensaje: |
              Al revés: el dominio de la inversa es el **rango** de la función.
              Rara vez coinciden.
          - texto: Para indicar dónde hay que dibujarla
            mensaje: |
              El enunciado no pide dibujar nada. El dominio está ahí por una
              razón matemática: garantizar la inyectividad.

      - tipo: calcular
        titulo: El apartado del signo
        pregunta: |
          Para $f(x) = x^{2}-1$ en $D = (-\infty,0]$, ¿cuánto vale
          $f^{-1}(3)$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Signo cambiado, y es el error que define el ejercicio. La inversa
              tiene que **devolver valores del dominio de partida**, y ese
              dominio es $(-\infty,0]$: todos negativos. Luego
              $f^{-1}(3) = -2$, no $+2$.
          - valor: '8'
            mensaje: |
              8 es $f(3) = 9-1$, la función aplicada al 3. Se pide la
              **inversa**: qué $x$ del dominio cumple $f(x)=3$.
          - valor: '4'
            mensaje: |
              4 sería $x^{2}$, un paso antes de terminar. De $x^{2}-1=3$ sale
              $x^{2}=4$ y luego $x=-2$, tomando la raíz que cae en el dominio.
        pista: |
          De $y = x^{2}-1$ sale $x = \pm\sqrt{1+y}$. ¿Cuál de los dos signos
          está en $(-\infty,0]$?
        desarrollo: |
          Despejando:

          $$
          y = x^{2}-1 \;\Longrightarrow\; x^{2} = 1+y
          \;\Longrightarrow\; x = \pm\sqrt{1+y}
          $$

          Y ahora hay que **elegir**. El dominio de $f$ es $(-\infty,0]$, así
          que la inversa tiene que devolver números negativos o cero:

          $$
          f^{-1}(x) = -\sqrt{1+x}
          $$

          Con $x=3$: $f^{-1}(3) = -\sqrt4 = -2$.

          Comprobación: $f(-2) = 4-1 = 3$ ✔
        veredicto: |
          El dominio de la inversa es $[-1,\infty)$, que es exactamente el rango
          de $f$ en $(-\infty,0]$. Esa coincidencia es la comprobación gratis.

      - tipo: calcular
        titulo: La inversa del coseno hiperbólico
        pregunta: |
          Para $f(x) = \cosh x$ en $[0,\infty)$, ¿cuál es el extremo izquierdo
          del dominio de $f^{-1}$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              0 es el extremo izquierdo del dominio de $f$, no del de
              $f^{-1}$. El dominio de la inversa es el **rango** de $f$, y
              $\cosh 0 = 1$: el coseno hiperbólico nunca baja de 1.
          - valor: '-1'
            mensaje: |
              El coseno hiperbólico es siempre **positivo**:
              $\cosh x = \frac{e^{x}+e^{-x}}{2} > 0$. No tiene nada que ver con
              el coseno ordinario, que sí llega a $-1$.
          - valor: '2.718282'
            mensaje: |
              $e \approx 2{,}718$ aparece en la fórmula, pero el mínimo de
              $\cosh$ es $\cosh 0 = \frac{1+1}{2} = 1$.
        pista: |
          El dominio de la inversa es el rango de $f$. ¿Cuál es el menor valor
          de $\cosh x$ para $x \ge 0$?
        desarrollo: |
          $$
          \cosh x = \frac{e^{x}+e^{-x}}{2}
          $$

          En $x=0$ vale $\frac{1+1}{2} = 1$, y crece a partir de ahí. Luego su
          rango en $[0,\infty)$ es $[1,\infty)$, y ese es el **dominio de la
          inversa**.

          Para la fórmula, con $u = e^{x}$:

          $$
          y = \frac{u+u^{-1}}{2}
          \;\Longrightarrow\;
          u^{2}-2yu+1 = 0
          \;\Longrightarrow\;
          u = y \pm \sqrt{y^{2}-1}
          $$

          Como $x \ge 0$ implica $u = e^{x} \ge 1$, se toma el signo $+$:

          $$
          f^{-1}(x) = \ln\left(x+\sqrt{x^{2}-1}\right), \qquad D = [1,\infty)
          $$
        veredicto: |
          Otra vez el mismo mecanismo que en (b): salen dos signos y el dominio
          de partida elige. Aquí el $+$; allí el $-$.

      - tipo: justificar
        pregunta: |
          Ordena el método y las seis respuestas. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              El método es siempre el mismo: escribir $y = f(x)$, **despejar
              $x$** y renombrar. Lo que cambia de un apartado a otro es qué
              hacer cuando el despeje da dos posibilidades.
          - texto: |
              **(a)** De $y = 1+e^{2x}$ sale
              $f^{-1}(x) = \frac12\ln(x-1)$, con $D = (1,\infty)$.
          - texto: |
              **(b)** De $y = x^{2}-1$ salen dos signos, y el dominio
              $(-\infty,0]$ elige el negativo:
              $f^{-1}(x) = -\sqrt{1+x}$, con $D = [-1,\infty)$.
          - texto: |
              **(c)** y **(d)** son directos:
              $f^{-1}(x) = e^{x}-3$ con $D=\mathbb{R}$, y
              $f^{-1}(x) = 1+\arccos x$ con $D=[-1,1]$.
          - texto: |
              **(e)** y **(f)** salen resolviendo una ecuación de segundo grado
              en $e^{x}$:
              $\ln\left(x+\sqrt{x^{2}-1}\right)$ con $D=[1,\infty)$, y
              $\ln\left(x+\sqrt{x^{2}+1}\right)$ con $D=\mathbb{R}$.
          - texto: |
              El dominio de cada inversa es el mismo que el de la función de
              partida.
            trampa: true
            mensaje: |
              Es el **rango** de la función de partida, no su dominio. En (b) la
              función va de $(-\infty,0]$ a $[-1,\infty)$, y la inversa va al
              revés. Confundirlos hace que la comprobación más útil del
              ejercicio deje de funcionar.
        veredicto: |
          «Dominio de la inversa = rango de la función» es la comprobación que
          caza casi todos los errores de este ejercicio, incluido el del signo.

    resolucion: |
      **Datos.** Seis funciones con su dominio. Se pide la inversa de cada una y
      el dominio de esa inversa.

      ### 1 · Por qué el enunciado da los dominios

      Una función tiene inversa donde es **inyectiva**: donde no hay dos $x$
      distintas con la misma imagen. Y eso **depende del dominio**, no solo de
      la fórmula.

      $x^{2}-1$ no tiene inversa en $\mathbb{R}$ porque $2$ y $-2$ empatan. En
      $(-\infty,0]$ sí. Por eso el enunciado especifica: sin esa restricción,
      tres de los seis apartados no tendrían respuesta.

      ### 2 · El método, y la comprobación que lo acompaña

      Siempre igual: se escribe $y = f(x)$, se **despeja $x$** y se renombran
      las variables.

      Y siempre se comprueba lo mismo:

      $$
      \text{dominio de } f^{-1} = \text{rango de } f
      $$

      Si el dominio que sale no coincide con el rango de la función, hay un
      error en alguno de los dos.

      ### 3 · (a) $f(x) = 1+e^{2x}$ en $\mathbb{R}$

      $$
      y = 1+e^{2x}
      \;\Longrightarrow\;
      e^{2x} = y-1
      \;\Longrightarrow\;
      2x = \ln(y-1)
      $$

      $$
      f^{-1}(x) = \frac{1}{2}\ln(x-1)
      $$

      El logaritmo exige $x-1>0$, así que $D = (1,\infty)$. Y en efecto:
      $e^{2x}>0$ siempre, así que $f$ toma valores estrictamente mayores que 1.
      Coincide ✔

      ### 4 · (b) $f(x) = x^{2}-1$ en $(-\infty,0]$

      $$
      y = x^{2}-1 \;\Longrightarrow\; x = \pm\sqrt{1+y}
      $$

      **Aquí hay que elegir**, y es el apartado que decide el ejercicio. El
      dominio de partida es $(-\infty,0]$: todos los valores son negativos o
      cero. La inversa tiene que devolver valores de ahí, luego el signo es el
      **negativo**:

      $$
      f^{-1}(x) = -\sqrt{1+x}, \qquad D = [-1,\infty)
      $$

      Comprobación: en $(-\infty,0]$ la función $x^{2}-1$ decrece desde
      $+\infty$ hasta $-1$, así que su rango es $[-1,\infty)$ ✔

      ### 5 · (c) y (d), directos

      $$
      y = \ln(x+3) \;\Longrightarrow\; x = e^{y}-3
      \;\Longrightarrow\;
      f^{-1}(x) = e^{x}-3, \qquad D = \mathbb{R}
      $$

      $$
      y = \cos(x-1) \;\Longrightarrow\; x = 1+\arccos y
      \;\Longrightarrow\;
      f^{-1}(x) = 1+\arccos x, \qquad D = [-1,1]
      $$

      En (d) el dominio $[1,\pi+1]$ está elegido para que $x-1$ recorra
      exactamente $[0,\pi]$, que es donde el coseno es inyectivo. Otra vez: el
      dominio no es decorativo.

      ### 6 · (e) y (f), las hiperbólicas

      Las dos se resuelven igual: con el cambio $u = e^{x}$ la ecuación se
      vuelve de segundo grado.

      **(e)** $y = \cosh x = \frac{e^{x}+e^{-x}}{2}$:

      $$
      2y = u+\frac1u
      \;\Longrightarrow\;
      u^{2}-2yu+1 = 0
      \;\Longrightarrow\;
      u = y \pm \sqrt{y^{2}-1}
      $$

      Como $x \ge 0$ implica $u = e^{x} \ge 1$, se toma el signo $+$:

      $$
      f^{-1}(x) = \ln\left(x+\sqrt{x^{2}-1}\right), \qquad D = [1,\infty)
      $$

      El dominio sale del rango: $\cosh$ vale 1 en $x=0$ y crece, y además la
      raíz exige $x^{2} \ge 1$. Las dos condiciones dicen lo mismo ✔

      **(f)** $y = \mathrm{senh}\,x = \frac{e^{x}-e^{-x}}{2}$:

      $$
      u^{2}-2yu-1 = 0
      \;\Longrightarrow\;
      u = y \pm \sqrt{y^{2}+1}
      $$

      Aquí $\sqrt{y^{2}+1} > \left|y\right|$, así que el signo $-$ daría un $u$
      **negativo**, imposible para una exponencial. Se toma el $+$:

      $$
      f^{-1}(x) = \ln\left(x+\sqrt{x^{2}+1}\right), \qquad D = \mathbb{R}
      $$

      Y el dominio es todo $\mathbb{R}$ porque $x^{2}+1$ nunca es negativo: el
      seno hiperbólico es biyectivo de $\mathbb{R}$ en $\mathbb{R}$, sin
      restringir nada.

      ### 7 · La diferencia entre (e) y (f), que es todo el tema

      Las dos ecuaciones de segundo grado se parecen y el signo se elige por
      motivos **distintos**:

      - En (e), porque el dominio de partida obliga a $u \ge 1$.
      - En (f), porque un $u$ negativo sería imposible: $e^{x}>0$ siempre.

      En el primero manda el enunciado; en el segundo, la propia exponencial.

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \text{(a)}\; & \tfrac12\ln(x-1),\; D=(1,\infty) &
      \text{(d)}\; & 1+\arccos x,\; D=[-1,1] \\
      \text{(b)}\; & -\sqrt{1+x},\; D=[-1,\infty) &
      \text{(e)}\; & \ln\!\left(x+\sqrt{x^{2}-1}\right),\; D=[1,\infty) \\
      \text{(c)}\; & e^{x}-3,\; D=\mathbb{R} &
      \text{(f)}\; & \ln\!\left(x+\sqrt{x^{2}+1}\right),\; D=\mathbb{R}
      \end{aligned}}
      $$

  - id: continuidad-parametro-k
    titulo: Dos parámetros para pegar dos trozos
    fuente: >-
      Ejercicio 3.3 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU
    enunciado: |
      Determinar $k \in \mathbb{R}$ para que las siguientes funciones sean
      continuas:

      **(a)**
      $f(x) = \begin{cases} x^{2}, & x<1 \\ kx-3, & x\ge1 \end{cases}$
      · **(b)**
      $g(x) = \begin{cases} k^{2}x^{2}, & x\le2 \\ (1-k)x, & x>2 \end{cases}$
    pide: Determinar el valor de $k$ en los dos casos.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde se juega la continuidad de una función a trozos?
        opciones:
          - texto: >-
              Solo en los **puntos de empalme**: dentro de cada trozo ya es
              continua por ser un polinomio
            correcta: true
            mensaje: |
              Eso es. Los polinomios son continuos en todo $\mathbb{R}$, así que
              el único sitio donde puede romperse es la frontera entre trozos.
              Todo el ejercicio se reduce a igualar los límites laterales ahí.
          - texto: En todo el dominio, punto por punto
            mensaje: |
              Sería agotador e innecesario. Dentro de cada trozo la función es
              un polinomio, y los polinomios son continuos siempre. Solo hay que
              mirar la costura.
          - texto: En los puntos donde la función vale cero
            mensaje: |
              Los ceros no tienen nada que ver con la continuidad. Una función
              puede valer cero y ser continua, o no valer nunca cero y tener un
              salto.
          - texto: En los extremos del dominio
            mensaje: |
              Aquí el dominio es todo $\mathbb{R}$ y no tiene extremos. El punto
              crítico es interno: donde cambia la fórmula.

      - tipo: calcular
        titulo: Apartado (a)
        pregunta: |
          ¿Para qué valor de $k$ es continua la primera función?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 saldría de $k-3 = -1$. Pero el límite por la izquierda es
              $1^{2} = 1$, no $-1$. La ecuación es $1 = k-3$.
          - valor: '-2'
            mensaje: |
              Signo cambiado al despejar. De $1 = k-3$ se pasa el 3 sumando:
              $k = 4$.
          - valor: '3'
            mensaje: |
              3 es el término independiente del segundo trozo. Hay que
              **resolver** la ecuación $1 = k-3$, no leer un coeficiente.
        pista: |
          Iguala el límite por la izquierda en $x=1$ con el valor por la
          derecha.
        desarrollo: |
          El único punto conflictivo es $x=1$.

          **Límite por la izquierda** —donde manda $x^{2}$—:

          $$
          \lim_{x\to1^{-}} f(x) = 1^{2} = 1
          $$

          **Valor y límite por la derecha** —donde manda $kx-3$—:

          $$
          f(1) = \lim_{x\to1^{+}} f(x) = k-3
          $$

          Para que sea continua los tres tienen que coincidir:

          $$
          1 = k-3 \;\Longrightarrow\; k = 4
          $$

          Comprobación: con $k=4$, el segundo trozo en $x=1$ vale
          $4-3 = 1$ ✔
        veredicto: |
          Fíjate en que $f(1)$ se calcula con el **segundo** trozo, porque el
          enunciado pone ahí el $\ge$. Ese detalle decide de qué lado está el
          punto.

      - tipo: calcular
        titulo: Apartado (b), el que tiene dos soluciones
        pregunta: |
          ¿Cuál es el valor **negativo** de $k$ que hace continua la segunda
          función?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              $\frac12$ **también** es solución, pero es la positiva. El
              enunciado del paso pide la negativa. Que haya dos es lo
              característico de este apartado: la ecuación es de segundo grado.
          - valor: '-0.5'
            mensaje: |
              Las dos soluciones son $-1$ y $+\frac12$. De
              $2k^{2}+k-1 = 0$ salen esas dos, no $-\frac12$.
          - valor: '1'
            mensaje: |
              Con $k=1$ el segundo trozo sería $(1-1)x = 0$, y el primero
              valdría $4$ en $x=2$. No pegan.
        pista: |
          Iguala en $x=2$: $4k^{2} = 2(1-k)$. Sale una ecuación de segundo
          grado.
        desarrollo: |
          El punto de empalme es $x=2$.

          $$
          \lim_{x\to2^{-}} g(x) = g(2) = k^{2}\cdot 4 = 4k^{2}
          $$

          $$
          \lim_{x\to2^{+}} g(x) = (1-k)\cdot 2 = 2-2k
          $$

          Igualando:

          $$
          4k^{2} = 2-2k
          \;\Longleftrightarrow\;
          4k^{2}+2k-2 = 0
          \;\Longleftrightarrow\;
          2k^{2}+k-1 = 0
          $$

          $$
          k = \frac{-1\pm\sqrt{1+8}}{4} = \frac{-1\pm3}{4}
          \;\Longrightarrow\;
          k = \frac12 \;\text{ o }\; k = -1
          $$

          Las **dos** valen. La negativa es $k=-1$.
        veredicto: |
          Que la $k$ aparezca al cuadrado es lo que multiplica las soluciones.
          Dar solo una es medio apartado.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Dentro de cada trozo la función es un polinomio, y los polinomios
              son continuos en todo $\mathbb{R}$: el único punto conflictivo es
              el empalme.
          - texto: |
              Continuidad en un punto significa tres cosas: que exista el valor,
              que exista el límite y que **coincidan**. En un empalme, que
              exista el límite equivale a que los dos laterales sean iguales.
          - texto: |
              **(a)** En $x=1$: $\lim_{x\to1^{-}} = 1$ y $f(1) = k-3$. De
              $1 = k-3$ sale $k=4$, único.
          - texto: |
              **(b)** En $x=2$: $4k^{2} = 2-2k$, es decir $2k^{2}+k-1 = 0$, con
              **dos** soluciones: $k=-1$ y $k=\frac12$.
          - texto: |
              Como en (b) hay dos valores de $k$, hay **dos** funciones
              continuas distintas, y las dos son respuesta válida.
          - texto: |
              En (b) hay que quedarse con $k=\frac12$, porque $k$ debe ser
              positivo para que $k^{2}x^{2}$ tenga sentido.
            trampa: true
            mensaje: |
              $k^{2}$ es no negativo **sea cual sea el signo de $k$**: ese es el
              efecto de elevar al cuadrado. No hay ninguna razón para descartar
              $k=-1$, y el enunciado tampoco la da. Inventarse una restricción
              para quedarse con una sola solución es perder media respuesta.
        veredicto: |
          Cuando el parámetro aparece elevado al cuadrado hay que esperar más de
          una solución, y hay que darlas todas salvo que el enunciado descarte
          alguna.

    resolucion: |
      **Datos.** Dos funciones a trozos con un parámetro $k$. Se pide el valor
      de $k$ que las hace continuas.

      ### 1 · Dónde se juega el ejercicio

      Los polinomios son continuos en todo $\mathbb{R}$, así que dentro de cada
      trozo no hay nada que discutir. **El único punto conflictivo es el
      empalme**, y todo el ejercicio se reduce a lo que pasa ahí.

      Continuidad en un punto $a$ significa tres cosas:

      $$
      \exists f(a), \qquad \exists \lim_{x\to a} f(x), \qquad
      \lim_{x\to a} f(x) = f(a)
      $$

      Y en un empalme, que el límite exista equivale a que **los dos laterales
      coincidan**.

      ### 2 · Apartado (a)

      El empalme es $x=1$. Conviene fijarse en de qué lado cae el punto: el
      enunciado pone $x \ge 1$ en el segundo trozo, así que **$f(1)$ se calcula
      con $kx-3$**.

      $$
      \lim_{x\to1^{-}} f(x) = \lim_{x\to1^{-}} x^{2} = 1
      $$

      $$
      \lim_{x\to1^{+}} f(x) = f(1) = k\cdot1-3 = k-3
      $$

      Igualando:

      $$
      1 = k-3 \;\Longrightarrow\; \boxed{k = 4}
      $$

      Es una ecuación de primer grado y tiene **una** solución.

      ### 3 · Apartado (b)

      El empalme es $x=2$, y aquí el punto cae en el **primer** trozo, porque
      lleva el $\le$.

      $$
      \lim_{x\to2^{-}} g(x) = g(2) = k^{2}\cdot 2^{2} = 4k^{2}
      $$

      $$
      \lim_{x\to2^{+}} g(x) = (1-k)\cdot 2 = 2-2k
      $$

      Igualando:

      $$
      4k^{2} = 2-2k
      \;\Longleftrightarrow\;
      4k^{2}+2k-2 = 0
      \;\Longleftrightarrow\;
      2k^{2}+k-1 = 0
      $$

      $$
      k = \frac{-1\pm\sqrt{1+8}}{4} = \frac{-1\pm3}{4}
      $$

      $$
      \boxed{k = \frac12 \quad\text{y}\quad k = -1}
      $$

      **Las dos son válidas**, y hay que darlas las dos. El parámetro aparece
      elevado al cuadrado, así que la ecuación es de segundo grado y no hay
      ninguna condición en el enunciado que descarte la negativa.

      ### 4 · Comprobación

      **(a)** con $k=4$: el primer trozo tiende a 1 y el segundo vale
      $4-3 = 1$ ✔

      **(b)** con $k=\frac12$: primer trozo $4\cdot\frac14 = 1$; segundo
      $\left(1-\frac12\right)\cdot2 = 1$ ✔

      **(b)** con $k=-1$: primer trozo $4\cdot1 = 4$; segundo
      $\left(1+1\right)\cdot2 = 4$ ✔

      Las dos pegan, en alturas distintas: con $k=\frac12$ la función pasa por
      $(2,1)$ y con $k=-1$ por $(2,4)$. Son dos funciones continuas diferentes,
      y el enunciado no pide elegir.

      ### Resultado

      $$
      \boxed{\;\text{(a) } k = 4
      \qquad\qquad
      \text{(b) } k = -1 \;\text{ y }\; k = \tfrac12\;}
      $$

  - id: limite-que-no-existe
    titulo: Dos sucesiones que discrepan
    fuente: >-
      Ejercicio 3.4 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU ·
      Cayó en 2018/2019 3E
    enunciado: |
      Estudiar el límite de la función $f(x) = \cos\left(\frac{\pi}{x}\right)$
      en el punto $x=0$ utilizando las sucesiones
      $\{a_n\}_{n\in\mathbb{N}} = \left\{\frac{1}{2n}\right\}$ y
      $\{b_n\}_{n\in\mathbb{N}} = \left\{\frac{2}{2n+1}\right\}$.
    pide: Estudiar si existe el límite en $x=0$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el enunciado regala **dos** sucesiones y no una?
        opciones:
          - texto: >-
              Porque para demostrar que un límite **no existe** hacen falta dos
              caminos que discrepen
            correcta: true
            mensaje: |
              Exacto. Con una sola sucesión no se prueba nada: el límite podría
              existir y valer eso. Lo que refuta la existencia es encontrar
              **dos** formas de acercarse a 0 cuyas imágenes tiendan a cosas
              distintas.
          - texto: Porque una sola no tiende a cero
            mensaje: |
              Las dos tienden a cero: $\frac{1}{2n} \to 0$ y
              $\frac{2}{2n+1} \to 0$. Esa es la condición para poder usarlas, y
              las dos la cumplen.
          - texto: Para calcular el límite por la izquierda y por la derecha
            mensaje: |
              Las dos sucesiones son **positivas**, así que las dos se acercan a
              0 por la derecha. La discrepancia no es entre lados, es entre
              caminos distintos por el mismo lado.
          - texto: Para comprobar el resultado dos veces
            mensaje: |
              No es una comprobación: es el argumento entero. Si las dos dieran
              lo mismo no se habría demostrado nada.

      - tipo: calcular
        titulo: El primer camino
        pregunta: |
          ¿A qué tiende $f(a_n) = \cos\left(\frac{\pi}{1/(2n)}\right)$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              0 es lo que da la **otra** sucesión, $b_n$. Con $a_n$ el argumento
              del coseno es $2\pi n$, un múltiplo entero de $2\pi$, y ahí el
              coseno vale 1.
          - valor: '-1'
            mensaje: |
              $-1$ sería $\cos(\pi n)$ con $n$ impar. Aquí el argumento es
              $2\pi n$, siempre múltiplo **par** de $\pi$.
          - valor: '3.141593'
            mensaje: |
              $\pi$ es el argumento antes de dividir, no el valor del coseno. Hay
              que sustituir y evaluar.
        pista: |
          $\frac{\pi}{1/(2n)} = 2\pi n$. ¿Cuánto vale el coseno de un múltiplo
          entero de $2\pi$?
        desarrollo: |
          $$
          \frac{\pi}{a_n} = \frac{\pi}{\frac{1}{2n}} = 2\pi n
          $$

          $$
          f(a_n) = \cos(2\pi n) = 1 \qquad \text{para todo } n
          $$

          No es que tienda a 1: **vale exactamente 1 siempre**. Así que la
          sucesión de imágenes es constante y su límite es 1.
        veredicto: |
          La sucesión $a_n$ está elegida para caer justo en los máximos del
          coseno. La otra caerá justo en sus ceros.

      - tipo: calcular
        titulo: El segundo camino
        pregunta: |
          ¿A qué tiende $f(b_n)$ con $b_n = \frac{2}{2n+1}$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es lo que daba $a_n$. Con $b_n$ el argumento es
              $\frac{(2n+1)\pi}{2}$, que es un múltiplo **impar** de
              $\frac{\pi}{2}$: ahí el coseno se anula.
          - valor: '-1'
            mensaje: |
              $-1$ requeriría un argumento múltiplo impar de $\pi$. Aquí el
              argumento es $\frac{\pi}{2}$, $\frac{3\pi}{2}$, $\frac{5\pi}{2}$…
              y en todos ellos el coseno vale 0.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es $\cos\frac{\pi}{3}$, que no aparece aquí. Sustituye
              y simplifica: el argumento sale $\frac{(2n+1)\pi}{2}$.
        pista: |
          $\frac{\pi}{2/(2n+1)} = \frac{(2n+1)\pi}{2}$. Evalúa el coseno ahí.
        desarrollo: |
          $$
          \frac{\pi}{b_n} = \frac{\pi}{\frac{2}{2n+1}} = \frac{(2n+1)\pi}{2}
          $$

          Con $n=1,2,3,\dots$ el argumento es
          $\frac{3\pi}{2}$, $\frac{5\pi}{2}$, $\frac{7\pi}{2}$… todos múltiplos
          **impares** de $\frac{\pi}{2}$, y ahí el coseno vale 0:

          $$
          f(b_n) = 0 \qquad \text{para todo } n
          $$
        veredicto: |
          Otra sucesión constante, esta vez en 0. Dos caminos hacia el mismo
          punto y dos destinos distintos.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Herramienta.** Si $\lim_{x\to a} f(x) = L$, entonces para
              **toda** sucesión $x_n \to a$ con $x_n \neq a$ se cumple
              $f(x_n) \to L$.
          - texto: |
              Las dos sucesiones cumplen la hipótesis: $a_n \to 0$ y
              $b_n \to 0$, y ninguna vale 0.
          - texto: |
              $f(a_n) = \cos(2\pi n) = 1$ para todo $n$, luego
              $f(a_n) \to 1$.
          - texto: |
              $f(b_n) = \cos\frac{(2n+1)\pi}{2} = 0$ para todo $n$, luego
              $f(b_n) \to 0$.
          - texto: |
              Si el límite existiera, las dos sucesiones de imágenes tendrían
              que tender a **él**, y por unicidad del límite $1 = 0$: absurdo.
              **El límite no existe.**
          - texto: |
              Como las dos sucesiones dan valores distintos, el límite vale la
              media de los dos, $\frac12$.
            trampa: true
            mensaje: |
              Los límites no promedian. Si dos caminos dan resultados distintos,
              la conclusión es que **no hay límite**, no que valga algo
              intermedio. La definición exige que **todos** los caminos den lo
              mismo, y aquí ya hay dos que no.
        veredicto: |
          El argumento no necesita dibujar la función. Un dibujo sugiere que
          oscila; dos sucesiones lo demuestran.

    resolucion: |
      **Datos.** $f(x) = \cos\left(\frac{\pi}{x}\right)$ y el punto $x=0$. Se
      dan las sucesiones $a_n = \frac{1}{2n}$ y $b_n = \frac{2}{2n+1}$.

      ### 1 · La herramienta, y por qué el enunciado da dos sucesiones

      La caracterización del límite por sucesiones dice:

      $$
      \lim_{x\to a} f(x) = L
      \iff
      \forall \{x_n\} \text{ con } x_n \to a,\ x_n \neq a:\quad f(x_n) \to L
      $$

      Léase el «para toda»: el límite existe solo si **todos** los caminos
      llevan al mismo sitio. En contrapositivo, para demostrar que **no**
      existe basta exhibir **dos** sucesiones cuyas imágenes discrepen.

      Por eso el enunciado da dos: una sola no demostraría nada.

      Lo primero, comprobar que las dos son admisibles:

      $$
      a_n = \frac{1}{2n} \to 0, \qquad b_n = \frac{2}{2n+1} \to 0
      $$

      y ninguna vale 0, así que $f$ está definida en todos sus términos —el
      punto $x=0$ es justamente donde no lo está—.

      ### 2 · El primer camino

      $$
      \frac{\pi}{a_n} = \frac{\pi}{\frac{1}{2n}} = 2\pi n
      $$

      $$
      f(a_n) = \cos(2\pi n) = 1 \qquad \forall n \in \mathbb{N}
      $$

      La sucesión de imágenes es **constante igual a 1**, así que su límite es 1.

      ### 3 · El segundo camino

      $$
      \frac{\pi}{b_n} = \frac{\pi(2n+1)}{2}
      $$

      Los valores son $\frac{3\pi}{2}$, $\frac{5\pi}{2}$, $\frac{7\pi}{2}$…:
      todos múltiplos **impares** de $\frac{\pi}{2}$, y ahí el coseno se anula.

      $$
      f(b_n) = 0 \qquad \forall n \in \mathbb{N}
      $$

      Su límite es 0.

      ### 4 · Conclusión

      Si el límite de $f$ en 0 existiera y valiera $L$, las dos sucesiones de
      imágenes tendrían que converger a $L$. Pero una converge a 1 y la otra a
      0, y por la **unicidad del límite** eso obligaría a $1 = 0$.

      $$
      \boxed{\;\text{El límite } \lim_{x\to0}\cos\frac{\pi}{x} \text{ no existe}\;}
      $$

      ### 5 · Qué está pasando de verdad

      Conviene decirlo, porque explica por qué el ejercicio funciona: cuando
      $x \to 0^{+}$, el argumento $\frac{\pi}{x}$ se va a $+\infty$, y el coseno
      **oscila cada vez más rápido** entre $-1$ y 1 sin estabilizarse.

      Las dos sucesiones del enunciado están elegidas para caer siempre en el
      mismo sitio de esa oscilación: $a_n$ en los máximos y $b_n$ en los ceros.
      De hecho, escogiendo bien la sucesión se puede hacer que las imágenes
      tiendan a **cualquier** valor de $[-1,1]$.

      ### 6 · Comprobación

      Los primeros términos, para ver que no es un artificio asintótico sino que
      ocurre desde el principio:

      | $n$ | $a_n$ | $f(a_n)$ | $b_n$ | $f(b_n)$ |
      |---|---|---|---|---|
      | 1 | $0{,}5$ | $\cos 2\pi = 1$ | $0{,}667$ | $\cos\frac{3\pi}{2} = 0$ |
      | 2 | $0{,}25$ | $\cos 4\pi = 1$ | $0{,}4$ | $\cos\frac{5\pi}{2} = 0$ |
      | 3 | $0{,}167$ | $\cos 6\pi = 1$ | $0{,}286$ | $\cos\frac{7\pi}{2} = 0$ |

      Las dos columnas de $x$ bajan hacia 0 y las dos de $f$ se quedan clavadas
      en valores distintos ✔

  - id: bolzano-raiz-unica
    titulo: Una raíz que existe, y que además es la única
    fuente: >-
      Ejercicio 3.5 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU ·
      Cayó en 2016/2017 5E
    enunciado: |
      Demostrar que la función $y(x) = xe^{x}-1$ tiene al menos una raíz real
      positiva. ¿Tiene alguna raíz más?
    pide: Demostrar que hay una raíz positiva y decidir si hay más.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué teorema garantiza que una función continua tiene una raíz?
        opciones:
          - texto: >-
              El de **Bolzano**: si es continua y cambia de signo en un
              intervalo, se anula dentro
            correcta: true
            mensaje: |
              Eso es. Bolzano es un teorema de **existencia**: dice que la raíz
              está ahí, no dónde. Sus dos hipótesis son continuidad en el
              intervalo cerrado y signos opuestos en los extremos.
          - texto: El de Rolle
            mensaje: |
              Rolle habla de dónde se anula la **derivada**, no la función, y
              exige que la función valga lo mismo en los dos extremos. Es otro
              teorema.
          - texto: El del valor medio
            mensaje: |
              El del valor medio da un punto donde la derivada iguala a la
              pendiente media. Tampoco garantiza raíces de la función.
          - texto: El fundamental del álgebra
            mensaje: |
              Ese cuenta raíces de **polinomios**, y $xe^{x}-1$ no lo es: tiene
              una exponencial. Además contaría raíces complejas, y aquí se
              piden reales.

      - tipo: calcular
        titulo: El extremo derecho del intervalo
        pregunta: |
          Para aplicar Bolzano se toma el intervalo $[0,b]$. ¿Cuál es el menor
          entero $b$ que sirve?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '0'
            mensaje: |
              En $x=0$ la función vale $-1$, negativo igual que en el extremo
              izquierdo. Un intervalo degenerado no sirve: hacen falta **signos
              opuestos** en los dos extremos.
          - valor: '2'
            mensaje: |
              Con $b=2$ también funciona —$y(2) = 2e^{2}-1 \approx 13{,}8 > 0$—,
              pero se pide el **menor** entero, y con $b=1$ ya cambia el signo.
          - valor: '-1'
            mensaje: |
              El enunciado pide una raíz **positiva**, así que el intervalo tiene
              que estar en el semieje positivo. Además $y(-1) = -e^{-1}-1 < 0$,
              del mismo signo que $y(0)$.
        pista: |
          $y(0) = -1$. Busca el primer entero donde $y$ se haga positiva.
          Recuerda que $e \approx 2{,}72$.
        desarrollo: |
          $$
          y(0) = 0\cdot e^{0}-1 = -1 < 0
          $$

          $$
          y(1) = 1\cdot e^{1}-1 = e-1 \approx 1{,}718 > 0
          $$

          Hay cambio de signo en $[0,1]$, así que ese intervalo ya sirve y $b=1$
          es el menor entero posible.
        veredicto: |
          Bolzano no dice dónde está la raíz dentro de $(0,1)$. Solo dice que
          está. Para localizarla harían falta métodos numéricos.

      - tipo: justificar
        pregunta: |
          Ordena la demostración completa. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Continuidad.** $y(x) = xe^{x}-1$ es producto y suma de funciones
              continuas en todo $\mathbb{R}$, así que es continua en $[0,1]$.
          - texto: |
              **Cambio de signo.** $y(0) = -1 < 0$ y
              $y(1) = e-1 \approx 1{,}72 > 0$.
          - texto: |
              Por el **teorema de Bolzano** existe $c \in (0,1)$ con $y(c) = 0$:
              hay al menos una raíz, y es positiva.
          - texto: |
              **Para la unicidad** se mira la derivada:
              $y'(x) = e^{x}+xe^{x} = e^{x}(1+x)$.
          - texto: |
              Para $x>-1$ se tiene $e^{x}>0$ y $1+x>0$, luego $y'(x)>0$: la
              función es **estrictamente creciente** ahí y no puede cortar el eje
              dos veces. La raíz es única en $(-1,\infty)$, y para
              $x \le -1$ la función es negativa. **La raíz es única.**
          - texto: |
              Como Bolzano garantiza una raíz en $(0,1)$, y la función es
              continua en todo $\mathbb{R}$, hay una raíz en cada intervalo.
            trampa: true
            mensaje: |
              Bolzano necesita **cambio de signo**, no solo continuidad. En un
              intervalo donde la función no cambie de signo el teorema no dice
              nada, y de hecho aquí no hay ninguna otra raíz. Continuidad sola
              no produce raíces.
        veredicto: |
          Existencia y unicidad son dos preguntas con dos herramientas
          distintas: Bolzano para la primera, la monotonía para la segunda.

    resolucion: |
      **Datos.** $y(x) = xe^{x}-1$. Hay que demostrar que tiene al menos una
      raíz real positiva y decidir si tiene más.

      ### 1 · La herramienta y sus hipótesis

      El **teorema de Bolzano**: si $f$ es continua en $[a,b]$ y
      $f(a)\cdot f(b) < 0$, entonces existe $c \in (a,b)$ con $f(c) = 0$.

      Es un teorema de **existencia**: garantiza que la raíz está, no dónde.
      Antes de usarlo hay que comprobar sus dos hipótesis, y eso es la mitad de
      la nota.

      ### 2 · Continuidad

      $y(x) = xe^{x}-1$ es producto y suma de funciones continuas en todo
      $\mathbb{R}$ —un polinomio y una exponencial—, así que es continua en
      cualquier intervalo cerrado. En particular en $[0,1]$.

      ### 3 · Cambio de signo

      $$
      y(0) = 0\cdot e^{0}-1 = -1 < 0
      $$

      $$
      y(1) = 1\cdot e^{1}-1 = e-1 \approx 1{,}718 > 0
      $$

      Los dos extremos tienen signos opuestos.

      ### 4 · Conclusión de existencia

      Por Bolzano, existe $c \in (0,1)$ con $y(c) = 0$. Como $c>0$, **la raíz es
      positiva**, que es lo que se pedía. $\blacksquare$

      ### 5 · ¿Hay alguna más?

      Bolzano dice «al menos una». Para saber si es **exactamente una** hace
      falta otro argumento, y el habitual es la monotonía.

      $$
      y'(x) = e^{x}+x e^{x} = e^{x}(1+x)
      $$

      Como $e^{x}>0$ siempre, el signo de $y'$ es el de $1+x$:

      | intervalo | signo de $y'$ | comportamiento |
      |---|---|---|
      | $x < -1$ | negativo | decreciente |
      | $x > -1$ | positivo | creciente |

      En $(-1,\infty)$ la función es **estrictamente creciente**, así que corta
      el eje como mucho una vez: la raíz $c$ es única ahí.

      Y en $(-\infty,-1]$ no hay ninguna. El mínimo de $y$ está en $x=-1$ y
      vale

      $$
      y(-1) = -e^{-1}-1 \approx -1{,}37 < 0
      $$

      Como en ese tramo la función decrece hacia $y(-1)$ y
      $\lim_{x\to-\infty} xe^{x} = 0$, allí $y$ se acerca a $-1$ por arriba sin
      llegar nunca a cero: **siempre negativa**.

      $$
      \boxed{\;\text{Hay exactamente una raíz real, y está en } (0,1)\;}
      $$

      ### 6 · Comprobación

      Acotando la raíz un poco más, para ver que el argumento es sólido:

      | $x$ | $y(x) = xe^{x}-1$ |
      |---|---|
      | $0{,}5$ | $0{,}5\cdot1{,}649-1 = -0{,}176 < 0$ |
      | $0{,}6$ | $0{,}6\cdot1{,}822-1 = +0{,}093 > 0$ |

      La raíz está entre $0{,}5$ y $0{,}6$. Bolzano vuelve a aplicarse en ese
      intervalo más pequeño, y ese es justamente el fundamento del método de
      bisección.

      Y la unicidad se ve en la tabla: entre $0{,}5$ y $0{,}6$ la función sube,
      y sigue subiendo después. No vuelve a bajar nunca.
