  - id: derivada-por-definicion
    titulo: Dos derivadas calculadas como manda la definición
    fuente: >-
      Ejercicio 3.7 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU ·
      El apartado (a) cayó en 2016/2017 3E
    nivel: practica
    enunciado: |
      **(a)** Demostrar que la derivada de la función $f(x) = x$ es
      $f'(x) = 1$.

      **(b)** Demostrar que la derivada de la función $f(x) = x^{3}$ es
      $f'(x) = 3x^{2}$.
    pide: Demostrar las dos derivadas por definición.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice «demostrar». ¿Qué excluye eso?
        opciones:
          - texto: >-
              Excluye usar las **reglas de derivación**: hay que partir de la
              definición como límite
            correcta: true
            mensaje: |
              Eso es. Escribir «la derivada de $x^{3}$ es $3x^{2}$ por la regla
              de la potencia» sería usar el resultado que se pide demostrar. Hay
              que ir al cociente incremental y calcular el límite.
          - texto: Excluye usar números concretos
            mensaje: |
              Los números concretos no están prohibidos: sirven para comprobar.
              Lo que está prohibido es apoyarse en la regla que se quiere
              demostrar.
          - texto: Excluye dibujar la función
            mensaje: |
              Un dibujo puede acompañar, pero tampoco demostraría nada por sí
              solo. El problema no es el dibujo: es de dónde se parte.
          - texto: Nada, «demostrar» y «calcular» son lo mismo
            mensaje: |
              No lo son, y el reparto de puntos de los exámenes lo confirma:
              «demostrar» es COMP4 y se puntúa el razonamiento, no el resultado.

      - tipo: calcular
        titulo: El cociente incremental de la cúbica
        pregunta: |
          Al desarrollar $\frac{(x+h)^{3}-x^{3}}{h}$ y simplificar, ¿cuál es el
          coeficiente de $x^{2}$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es el coeficiente de $x^{3}$ en el binomio antes de restar, y
              justo ese término **se cancela** con el $-x^{3}$. El que sobrevive
              y no lleva $h$ es $3x^{2}$.
          - valor: '2'
            mensaje: |
              2 sería el coeficiente si la función fuera $x^{2}$. Para $x^{3}$ el
              binomio da $3x^{2}h$, y al dividir entre $h$ queda $3x^{2}$.
          - valor: '6'
            mensaje: |
              6 aparece en la **segunda** derivada, $6x$. Aquí el desarrollo del
              cubo da coeficientes 1, 3, 3, 1.
        pista: |
          $(x+h)^{3} = x^{3}+3x^{2}h+3xh^{2}+h^{3}$. Resta $x^{3}$ y divide
          entre $h$.
        desarrollo: |
          $$
          (x+h)^{3} = x^{3}+3x^{2}h+3xh^{2}+h^{3}
          $$

          $$
          (x+h)^{3}-x^{3} = 3x^{2}h+3xh^{2}+h^{3} = h\left(3x^{2}+3xh+h^{2}\right)
          $$

          $$
          \frac{(x+h)^{3}-x^{3}}{h} = 3x^{2}+3xh+h^{2}
          $$

          Al hacer $h\to0$ los dos últimos términos se anulan y queda
          $3x^{2}$.
        veredicto: |
          El paso clave es **sacar factor común $h$**: sin eso el cociente es
          $\frac00$ y no se puede evaluar. Con eso, la $h$ se simplifica y el
          límite es inmediato.

      - tipo: justificar
        pregunta: |
          Ordena las dos demostraciones. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Definición.**
              $f'(x) = \lim_{h\to0}\dfrac{f(x+h)-f(x)}{h}$, siempre que el
              límite exista.
          - texto: |
              **(a)** $\dfrac{(x+h)-x}{h} = \dfrac{h}{h} = 1$ para todo
              $h \neq 0$, así que el límite es 1.
          - texto: |
              **(b)** $(x+h)^{3}-x^{3} = h\left(3x^{2}+3xh+h^{2}\right)$, y al
              dividir entre $h$ queda $3x^{2}+3xh+h^{2}$.
          - texto: |
              Haciendo $h\to0$, los términos con $h$ se anulan y el límite es
              $3x^{2}$.
          - texto: |
              En los dos casos hace falta **sacar factor común $h$** antes de
              pasar al límite: sin eso el cociente es una indeterminación
              $\frac00$.
          - texto: |
              En (a) se puede sustituir $h=0$ directamente en
              $\frac{(x+h)-x}{h}$, porque el límite es lo mismo que evaluar.
            trampa: true
            mensaje: |
              Sustituir $h=0$ daría $\frac{0}{0}$, que no es un número. El límite
              **no** es «evaluar en el punto»: es el valor al que se acerca la
              expresión cuando $h$ se acerca a 0, y para calcularlo hay que
              simplificar primero. Confundir las dos cosas invalida la
              demostración entera.
        veredicto: |
          Las dos demostraciones tienen la misma forma: desarrollar, cancelar,
          sacar $h$ factor común, simplificar y entonces sí pasar al límite.

    resolucion: |
      **Datos.** Demostrar, por definición, que $(x)' = 1$ y que
      $\left(x^{3}\right)' = 3x^{2}$.

      ### 1 · De dónde hay que partir

      El enunciado dice **demostrar**, y eso excluye usar la regla de la
      potencia: sería dar por cierto lo que se pide probar. Hay que partir de la
      definición:

      $$
      f'(x) = \lim_{h\to0}\frac{f(x+h)-f(x)}{h}
      $$

      siempre que ese límite exista. Y hay un detalle que conviene decir antes
      de empezar: el cociente **no está definido en $h=0$**. Por eso hace falta
      simplificar antes de pasar al límite; sustituir directamente daría
      $\frac00$, que no es un número.

      ### 2 · Apartado (a): la identidad

      $$
      \frac{f(x+h)-f(x)}{h} = \frac{(x+h)-x}{h} = \frac{h}{h} = 1
      $$

      La simplificación es válida porque $h \neq 0$ —el límite mira valores
      cercanos a 0, nunca el propio 0—.

      El cociente vale **exactamente 1** para todo $h\neq0$, así que es una
      función constante y su límite es trivialmente 1:

      $$
      f'(x) = \lim_{h\to0} 1 = 1 \qquad \blacksquare
      $$

      Geométricamente era de esperar: $f(x)=x$ es una recta de pendiente 1, y su
      pendiente es la misma en todos los puntos.

      ### 3 · Apartado (b): la cúbica

      Desarrollando el cubo del binomio:

      $$
      (x+h)^{3} = x^{3}+3x^{2}h+3xh^{2}+h^{3}
      $$

      Al restar $x^{3}$, **ese término se cancela** —y es lo que hace que el
      numerador sea divisible por $h$—:

      $$
      (x+h)^{3}-x^{3} = 3x^{2}h+3xh^{2}+h^{3}
      $$

      Sacando factor común $h$:

      $$
      = h\left(3x^{2}+3xh+h^{2}\right)
      $$

      $$
      \frac{(x+h)^{3}-x^{3}}{h} = 3x^{2}+3xh+h^{2}
      \qquad (h \neq 0)
      $$

      Y ahora sí se puede pasar al límite, porque ya no hay indeterminación:

      $$
      f'(x) = \lim_{h\to0}\left(3x^{2}+3xh+h^{2}\right) = 3x^{2}
      \qquad \blacksquare
      $$

      ### 4 · La estructura común

      Las dos demostraciones son el mismo esquema, y merece la pena verlo porque
      se repite en cualquier derivada por definición:

      1. Escribir el cociente incremental.
      2. Desarrollar y **cancelar** el término que no lleva $h$.
      3. **Sacar $h$ factor común** y simplificar.
      4. Solo entonces, pasar al límite.

      El paso 3 es el que hace posible el 4. Sin él, el cociente sigue siendo
      $\frac00$.

      ### 5 · Comprobación

      Numéricamente, con $x=2$ y valores cada vez más pequeños de $h$, el
      cociente de (b) debería acercarse a $3\cdot4 = 12$:

      | $h$ | $\frac{(2+h)^{3}-8}{h}$ |
      |---|---|
      | $1$ | $\frac{27-8}{1} = 19$ |
      | $0{,}1$ | $\frac{9{,}261-8}{0{,}1} = 12{,}61$ |
      | $0{,}01$ | $12{,}0601$ |
      | $0{,}001$ | $12{,}006$ |

      Baja hacia 12 ✔. Y encaja con la fórmula simplificada:
      $3x^{2}+3xh+h^{2} = 12+6h+h^{2}$, que en $h=0{,}01$ da
      $12+0{,}06+0{,}0001 = 12{,}0601$, exactamente el valor de la tabla ✔

      ### Resultado

      $$
      \boxed{\;\left(x\right)' = 1
      \qquad\qquad
      \left(x^{3}\right)' = 3x^{2}\;}
      $$

