  - id: dominio-y-rango
    titulo: Seis dominios y seis rangos
    fuente: >-
      Ejercicio 3.1 · Problemas complementarios, tema 3 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Determinar el dominio y el rango de las siguientes funciones.

      **(a)** $f(x) = x^{2}-3x+2$ · **(b)** $f(x) = 1+2\,\mathrm{sen}\,x$ ·
      **(c)** $f(x) = 2+\left|x+1\right|$

      **(d)** $f(x) = \sqrt{x-1}-2$ ·
      **(e)** $f(x) = \frac{3\pi}{2}+3\arcsin(2x)$ ·
      **(f)** $f(x) = -\pi+\arccos(x)$
    pide: Dar el dominio y el rango de las seis.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se busca un dominio?
        opciones:
          - texto: >-
              **Prohibiendo**: se buscan las operaciones que no siempre se
              pueden hacer y se descarta lo que las rompe
            correcta: true
            mensaje: |
              Eso es. El dominio no se calcula de frente: se recorre la fórmula
              buscando divisiones, raíces de índice par, logaritmos y
              trigonométricas inversas, y se excluye lo que las hace
              imposibles. Lo que queda es el dominio.
          - texto: Resolviendo la ecuación $f(x)=0$
            mensaje: |
              Eso da los **ceros** de la función, que es otra cosa. El dominio
              es dónde la fórmula tiene sentido, no dónde vale cero.
          - texto: Mirando hasta dónde llegan los valores de $f$
            mensaje: |
              Eso es el **rango**, no el dominio. El dominio está en el eje de
              las $x$ y el rango en el de las $y$.
          - texto: >-
              Es siempre $\mathbb{R}$ salvo que haya una fracción
            mensaje: |
              Las fracciones no son lo único que restringe. Las raíces pares,
              los logaritmos y las trigonométricas inversas también, y estas
              últimas son las que más se olvidan.

      - tipo: calcular
        titulo: El caso que casi nadie ve
        pregunta: |
          En $f(x) = \frac{3\pi}{2}+3\arcsin(2x)$, ¿cuál es el extremo derecho
          del dominio?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 sería el extremo si el argumento fuera $x$ a secas. Pero es
              $2x$, y la condición $2x \le 1$ da $x \le \frac12$. El factor 2
              **encoge** el dominio a la mitad.
          - valor: '2'
            mensaje: |
              Has multiplicado por 2 en vez de dividir. De $-1 \le 2x \le 1$ se
              despeja $x$ dividiendo: $-\frac12 \le x \le \frac12$.
          - valor: '4.712389'
            mensaje: |
              $\frac{3\pi}{2}$ es el término que se suma **fuera**, y ese no
              toca el dominio: desplaza el rango hacia arriba. El dominio lo fija
              solo lo que hay dentro del arcoseno.
        pista: |
          $\arcsin$ solo acepta argumentos entre $-1$ y 1. Aquí el argumento es
          $2x$.
        desarrollo: |
          El arcoseno solo está definido para argumentos en $[-1,1]$:

          $$
          -1 \le 2x \le 1
          \;\Longleftrightarrow\;
          -\frac12 \le x \le \frac12
          $$

          Luego $D = \left[-\frac12,\frac12\right]$, y el extremo derecho es
          $\frac12$.

          El $\frac{3\pi}{2}$ y el 3 que multiplica no afectan al dominio: solo
          estiran y desplazan el **rango**.
        veredicto: |
          Ese $\frac12$ no aparece escrito en ninguna parte de la fórmula. Sale
          de saber qué acepta el arcoseno.

      - tipo: calcular
        titulo: Un rango con vértice
        pregunta: |
          ¿Cuál es el menor valor que toma $f(x) = x^{2}-3x+2$?
        respuesta:
          tipo: numero
          valor: '-0.25'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es $f(0)$, el término independiente. El mínimo de una parábola
              está en su vértice, no en $x=0$.
          - valor: '1.5'
            mensaje: |
              $\frac32$ es la **abscisa** del vértice, $x = \frac{-b}{2a}$. El
              valor mínimo es la ordenada: $f\left(\frac32\right)$.
          - valor: '0'
            mensaje: |
              0 sería el mínimo si la parábola fuera tangente al eje, es decir
              si tuviera raíz doble. Aquí tiene dos raíces distintas, 1 y 2, así
              que baja por debajo del eje entre ellas.
        pista: |
          El vértice está en $x = \frac{-b}{2a} = \frac32$. Evalúa ahí.
        desarrollo: |
          La parábola abre hacia arriba ($a=1>0$), así que su mínimo está en el
          vértice:

          $$
          x_v = \frac{-b}{2a} = \frac{3}{2}
          $$

          $$
          f\!\left(\frac32\right) = \frac94-\frac92+2 = \frac{9-18+8}{4}
          = -\frac14
          $$

          Luego $R = \left[-\frac14,\;\infty\right)$, y el dominio es todo
          $\mathbb{R}$.
        veredicto: |
          Dominio y rango son independientes: aquí el dominio es todo
          $\mathbb{R}$ y el rango solo la mitad de arriba de una recta.

      - tipo: justificar
        pregunta: |
          Ordena el criterio para las seis funciones. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **(a)** Parábola: $D = \mathbb{R}$, y el rango arranca en el
              vértice, $R = \left[-\frac14,\infty\right)$.
          - texto: |
              **(b)** El seno oscila entre $-1$ y 1, así que $1+2\,\mathrm{sen}\,x$
              oscila entre $-1$ y 3: $D = \mathbb{R}$, $R = [-1,3]$.
          - texto: |
              **(c)** El valor absoluto nunca es negativo, así que
              $2+\left|x+1\right| \ge 2$: $D = \mathbb{R}$, $R = [2,\infty)$.
          - texto: |
              **(d)** La raíz exige $x \ge 1$, y $\sqrt{x-1} \ge 0$ da
              $f \ge -2$: $D = [1,\infty)$, $R = [-2,\infty)$.
          - texto: |
              **(e)** y **(f)** las restringen las trigonométricas inversas:
              $D = \left[-\frac12,\frac12\right]$ con $R = [0,3\pi]$, y
              $D = [-1,1]$ con $R = [-\pi,0]$.
          - texto: |
              En **(b)** el dominio es $[-1,3]$, porque el seno solo toma
              valores ahí.
            trampa: true
            mensaje: |
              Eso confunde dominio con rango. El seno **acepta** cualquier
              número real —su dominio es $\mathbb{R}$— y **devuelve** valores en
              $[-1,1]$. Lo que está entre $-1$ y 3 es el rango de
              $1+2\,\mathrm{sen}\,x$, no su dominio.
        veredicto: |
          Es el intercambio más común del tema: el dominio vive en el eje
          horizontal y el rango en el vertical. Confundirlos cambia el
          ejercicio entero.

    resolucion: |
      **Datos.** Seis funciones. Se piden dominio y rango de cada una.

      ### 1 · Las dos preguntas se hacen al revés

      **El dominio se busca prohibiendo.** Se recorre la fórmula buscando las
      operaciones que no siempre se pueden hacer:

      | operación | restricción |
      |---|---|
      | dividir | el denominador no puede anularse |
      | raíz de índice par | el radicando no puede ser negativo |
      | logaritmo | el argumento tiene que ser positivo |
      | $\arcsin$, $\arccos$ | el argumento tiene que estar en $[-1,1]$ |

      **El rango se busca componiendo.** Se parte de lo que devuelve la pieza
      básica y se le aplican los estiramientos y desplazamientos de fuera.

      ### 2 · (a) $f(x) = x^{2}-3x+2$

      Un polinomio no prohíbe nada: $D = \mathbb{R}$.

      Es una parábola que abre hacia arriba, con vértice en

      $$
      x_v = \frac{3}{2},
      \qquad
      f\!\left(\frac32\right) = \frac94-\frac92+2 = -\frac14
      $$

      $$
      R = \left[-\frac14,\;\infty\right)
      $$

      ### 3 · (b) $f(x) = 1+2\,\mathrm{sen}\,x$

      El seno acepta cualquier real: $D = \mathbb{R}$.

      Devuelve valores en $[-1,1]$. Multiplicar por 2 lo estira a $[-2,2]$ y
      sumar 1 lo desplaza:

      $$
      R = [-1,\;3]
      $$

      ### 4 · (c) $f(x) = 2+\left|x+1\right|$

      El valor absoluto acepta todo: $D = \mathbb{R}$.

      Y nunca es negativo, con mínimo 0 alcanzado en $x=-1$:

      $$
      R = [2,\;\infty)
      $$

      ### 5 · (d) $f(x) = \sqrt{x-1}-2$

      La raíz es de índice par, así que el radicando no puede ser negativo:

      $$
      x-1 \ge 0 \;\Longrightarrow\; D = [1,\;\infty)
      $$

      Y $\sqrt{x-1}$ recorre $[0,\infty)$, así que restando 2:

      $$
      R = [-2,\;\infty)
      $$

      ### 6 · (e) $f(x) = \frac{3\pi}{2}+3\arcsin(2x)$

      Aquí está el apartado que se falla. El arcoseno solo acepta argumentos en
      $[-1,1]$, y el argumento es $2x$:

      $$
      -1 \le 2x \le 1 \;\Longrightarrow\; D = \left[-\frac12,\;\frac12\right]
      $$

      El factor 2 **encoge el dominio a la mitad**, y ese $\frac12$ no está
      escrito en ninguna parte de la fórmula.

      Para el rango: $\arcsin$ devuelve valores en
      $\left[-\frac{\pi}{2},\frac{\pi}{2}\right]$. Multiplicando por 3 queda
      $\left[-\frac{3\pi}{2},\frac{3\pi}{2}\right]$, y sumando
      $\frac{3\pi}{2}$:

      $$
      R = \left[0,\;3\pi\right]
      $$

      ### 7 · (f) $f(x) = -\pi+\arccos(x)$

      El argumento es $x$ a secas:

      $$
      D = [-1,\;1]
      $$

      $\arccos$ devuelve valores en $[0,\pi]$, y restando $\pi$:

      $$
      R = [-\pi,\;0]
      $$

      ### 8 · Comprobación

      La comprobación más rápida de un rango es evaluar en los extremos del
      dominio y en los puntos singulares:

      | | punto | valor |
      |---|---|---|
      | (a) | $x=\frac32$ | $-\frac14$, el mínimo ✔ |
      | (d) | $x=1$ | $-2$, el mínimo ✔ |
      | (e) | $x=\pm\frac12$ | $\frac{3\pi}{2}\pm\frac{3\pi}{2}$, o sea $3\pi$ y 0 ✔ |
      | (f) | $x=-1$ | $-\pi+\pi = 0$; $x=1$ da $-\pi+0 = -\pi$ ✔ |

      En (f) conviene fijarse en que el arcocoseno es **decreciente**: el
      extremo izquierdo del dominio da el valor más grande del rango.

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \text{(a)}\; & D=\mathbb{R},\; R=\left[-\tfrac14,\infty\right) &
      \text{(d)}\; & D=[1,\infty),\; R=[-2,\infty) \\
      \text{(b)}\; & D=\mathbb{R},\; R=[-1,3] &
      \text{(e)}\; & D=\left[-\tfrac12,\tfrac12\right],\; R=[0,3\pi] \\
      \text{(c)}\; & D=\mathbb{R},\; R=[2,\infty) &
      \text{(f)}\; & D=[-1,1],\; R=[-\pi,0]
      \end{aligned}}
      $$

