  - id: ej-derivada-por-definicion-en-un-pico
    titulo: Una derivada que hay que calcular como límite
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Estudiar si la función $f\left(x\right)=\left|x\right|$ es derivable en
      $x=0$.
    pide: Las dos derivadas laterales, y si la función es derivable ahí.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué no vale aquí la regla de derivación de siempre?
        opciones:
          - texto: Porque en $x=0$ la función cambia de definición, y no hay una sola fórmula que derivar
            correcta: true
            mensaje: |
              Eso es. A la derecha vale $x$ y a la izquierda $-x$: son dos
              fórmulas distintas y el punto de empalme no pertenece del todo a
              ninguna. Ahí solo sirve la definición.
          - texto: Porque el valor absoluto no es una función continua
            mensaje: |
              Sí lo es: $\left|x\right|$ es continua en todo $\mathbb{R}$,
              también en el origen. Continua y derivable no son lo mismo, y este
              ejemplo existe justamente para separarlos.
          - texto: Porque la función no está definida en $x=0$
            mensaje: |
              Está definida y vale $0$. El problema no es que falte el valor,
              sino que la pendiente no es la misma al llegar por un lado que por
              el otro.
      - tipo: calcular
        titulo: La derivada por la derecha
        pregunta: |
          Calculando
          $\lim_{h\to 0^{+}}\frac{\left|0+h\right|-\left|0\right|}{h}$, ¿cuánto
          vale la derivada lateral por la derecha?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número entero, con su signo
        distractores:
          - valor: '-1'
            mensaje: |
              Ese es el valor por la **izquierda**. Con $h>0$ el valor absoluto
              de $h$ es $h$, y el cociente vale $+1$.
          - valor: '0'
            mensaje: |
              El cero es el valor de la función en el punto, no su pendiente. El
              cociente incremental vale $h/h=1$ para todo $h>0$.
        pista: |
          Con $h>0$, $\left|h\right|=h$. Sustituye y simplifica antes de tomar el
          límite.
        desarrollo: |
          **Por la derecha**, con $h>0$ es $\left|h\right|=h$:

          $$
          f'\left(0^{+}\right)=\lim_{h\to 0^{+}}\frac{h}{h}=1
          $$

          **Por la izquierda**, con $h<0$ es $\left|h\right|=-h$:

          $$
          f'\left(0^{-}\right)=\lim_{h\to 0^{-}}\frac{-h}{h}=-1
          $$

          Las dos derivadas laterales existen pero **no coinciden**, así que
          $f$ no es derivable en $0$. Gráficamente: hay un pico.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: En el punto de empalme no hay una sola fórmula que derivar, así que hay que ir a la definición.
          - texto: Por la derecha el cociente incremental vale $h/h=1$.
          - texto: Por la izquierda vale $-h/h=-1$.
          - texto: Las dos laterales existen y son distintas, así que la función no es derivable ahí.
          - texto: Basta derivar cada trozo por separado y comparar las dos fórmulas en el punto.
            trampa: true
            mensaje: |
              Es el atajo tentador, y no vale. Derivar cada trozo da la pendiente
              **dentro** de cada tramo, no en el empalme. Aquí coincide porque
              las dos derivadas son constantes, pero con trozos curvos puede
              fallar, y lo que se corrige es el límite.
    resolucion: |
      La regla no se puede aplicar porque en el empalme no hay **una** fórmula:
      hay dos, y el punto está en la frontera. Ahí solo sirve la definición.

      $$
      f'\left(0^{+}\right)=\lim_{h\to 0^{+}}\frac{\left|h\right|}{h}
      =\lim_{h\to 0^{+}}\frac{h}{h}=1
      $$

      $$
      f'\left(0^{-}\right)=\lim_{h\to 0^{-}}\frac{\left|h\right|}{h}
      =\lim_{h\to 0^{-}}\frac{-h}{h}=-1
      $$

      Las dos existen, valen $+1$ y $-1$, y **no coinciden**: la función no es
      derivable en el origen aunque sea continua. Esa es la diferencia que este
      ejemplo existe para dejar clara — continuidad y derivabilidad no son lo
      mismo, y el valor absoluto es el contraejemplo de toda la vida.

      **Los dos casos en que la definición es obligatoria**: cuando el enunciado
      lo dice, y cuando el punto es un empalme. Fuera de ahí, se deriva con las
      reglas.

