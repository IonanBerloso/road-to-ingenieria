  # ═══════════════════════════════════════════════════════════════════
  # Ejemplos introductorios del tema 10. Nuestros, no de examen ni del boletín.
  # ═══════════════════════════════════════════════════════════════════

  - id: ej-transformada-con-la-tabla
    titulo: La primera transformada, con la tabla
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Calcular la transformada de Laplace de $f(t) = 3 + 2t - e^{4t}$.
    pide: La transformada F(s).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué se puede transformar cada sumando por separado?
        opciones:
          - texto: Porque la transformada es lineal
            correcta: true
            mensaje: |
              Eso es. $\mathcal{L}$ es una integral, y las integrales respetan
              sumas y constantes. Por eso la tabla basta para casi todo.
          - texto: Porque los tres sumandos son independientes
            mensaje: |
              La razón de fondo es la linealidad de la integral, no que los
              términos sean «independientes» — eso no es una propiedad de la
              transformada.
          - texto: No se puede; hay que aplicar la definición al conjunto
            mensaje: |
              Se puede, y es lo que se hace siempre. Aplicar la definición
              —integrar de 0 a infinito— solo se hace cuando el enunciado lo
              exige expresamente.
      - tipo: calcular
        titulo: La transformada del término lineal
        pregunta: |
          Con $\mathcal{L}\{t^{n}\} = n!/s^{n+1}$, ¿cuánto vale el numerador de
          $\mathcal{L}\{2t\}$, si el denominador es $s^{2}$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Te has dejado el coeficiente 2 que multiplica a la $t$. Con $n=1$
              sale $1!/s^{2} = 1/s^{2}$, y por el 2 queda $2/s^{2}$.
          - valor: '4'
            mensaje: |
              Parece que has multiplicado el 2 del enunciado por otro 2. Con
              $n=1$, el factorial vale 1, así que el numerador es solo el 2 del
              coeficiente.
        pista: |
          Con n=1, $1!/s^2 = 1/s^2$. Multiplícalo por el coeficiente 2.
        desarrollo: |
          $$
          \mathcal{L}\{2t\} = 2\cdot\frac{1!}{s^{2}} = \frac{2}{s^{2}}
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'Por linealidad, se transforma cada sumando por separado.'
          - texto: '$\mathcal{L}\{3\} = 3/s$, porque $\mathcal{L}\{1\}=1/s$.'
          - texto: '$\mathcal{L}\{2t\} = 2/s^{2}$.'
          - texto: '$\mathcal{L}\{e^{4t}\} = 1/(s-4)$, con el signo cambiado en el denominador.'
          - texto: '$\mathcal{L}\{e^{4t}\} = 1/(s+4)$, porque la definición lleva $e^{-st}$.'
            trampa: true
            mensaje: |
              El signo va al revés. La tabla dice
              $\mathcal{L}\{e^{at}\} = 1/(s-a)$, así que con $a=4$ sale
              $1/(s-4)$. Es un signo que se confunde precisamente por lo que
              dice la pieza — pero al integrar $e^{4t}e^{-st}$ queda
              $e^{-(s-4)t}$, y de ahí el $s-4$.
    resolucion: |
      **La linealidad hace todo el trabajo.** La transformada es una integral, y
      las integrales reparten sumas y sacan constantes:

      $$
      \mathcal{L}\{3 + 2t - e^{4t}\}
      = 3\,\mathcal{L}\{1\} + 2\,\mathcal{L}\{t\} - \mathcal{L}\{e^{4t}\}
      $$

      **Cada trozo, de la tabla:**

      | término | transformada |
      |---|---|
      | $3$ | $3/s$ |
      | $2t$ | $2/s^{2}$ |
      | $e^{4t}$ | $1/(s-4)$ |

      $$
      \boxed{\;F(s) = \frac{3}{s} + \frac{2}{s^{2}} - \frac{1}{s-4}\;}
      $$

      **El signo del denominador**, que es lo único con trampa aquí. La
      definición lleva $e^{-st}$, y al multiplicar por $e^{4t}$ el exponente
      queda $-(s-4)t$: por eso sale $s-4$ y no $s+4$. Si te sale con el signo
      cambiado, la antitransformada te dará $e^{-4t}$, que crece o decrece justo
      al revés.

  - id: ej-inversa-fracciones-simples
    titulo: Volver, descomponiendo en fracciones simples
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Calcular la transformada inversa de $F(s) = \dfrac{3s}{s^{2}-s-6}$.
    pide: La función f(t) cuya transformada es F(s).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es el primer paso para antitransformar un cociente de polinomios?
        opciones:
          - texto: Factorizar el denominador y descomponer en fracciones simples
            correcta: true
            mensaje: |
              Sí. La tabla solo tiene entradas sencillas, así que hay que partir
              la fracción hasta que cada trozo se reconozca.
          - texto: Derivar el numerador
            mensaje: |
              Eso no tiene nada que ver. Antitransformar no es derivar: es
              reconocer la fracción en la tabla, y para eso hay que romperla en
              trozos reconocibles.
          - texto: Aplicar la definición de la transformada inversa
            mensaje: |
              Existe una fórmula integral para la inversa, pero es una integral
              en el plano complejo que no se usa en este curso. En la práctica
              se antitransforma por reconocimiento.
      - tipo: calcular
        titulo: La raíz positiva del denominador
        pregunta: |
          ¿Cuál es la raíz positiva de $s^{2}-s-6=0$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 no es raíz: $4-2-6 = -4 \neq 0$. La otra raíz es $-2$, negativa.
          - valor: '6'
            mensaje: |
              6 es el término independiente con el signo cambiado, no una raíz.
              Factoriza: $(s-3)(s+2)$.
        pista: |
          Busca dos números que multiplicados den −6 y sumados den −1.
        desarrollo: |
          $$
          s^{2}-s-6 = (s-3)(s+2)
          $$

          Las raíces son $3$ y $-2$. Al ser **reales y distintas**, la
          antitransformada serán dos exponenciales.
      - tipo: calcular
        titulo: El coeficiente de la primera fracción
        pregunta: |
          En $\dfrac{3s}{(s-3)(s+2)} = \dfrac{A}{s-3}+\dfrac{B}{s+2}$, ¿cuánto
          vale $A$?
        respuesta:
          tipo: numero
          valor: '1.8'
          tolerancia: 0.01
          formato: en forma exacta (9/5) o con un decimal
        distractores:
          - valor: '3'
            mensaje: |
              3 es el coeficiente del numerador original, no el de la fracción
              simple. Con el método de cubrir: $A = 3\cdot 3/(3+2) = 9/5$.
          - valor: '1.2'
            mensaje: |
              $1{,}2$ es $B$, el coeficiente de la otra fracción:
              $3(-2)/(-2-3) = 6/5$. Cuidado con cuál es cuál.
        pista: |
          Multiplica por (s−3) y evalúa en s=3: sale $3(3)/(3+2)$.
        desarrollo: |
          Con el método de cubrir, multiplicando por $(s-3)$ y evaluando en
          $s=3$:

          $$
          A = \frac{3s}{s+2}\bigg|_{s=3} = \frac{9}{5} = 1{,}8
          $$

          Y análogamente $B = \dfrac{3s}{s-3}\bigg|_{s=-2} = \dfrac{-6}{-5} = \dfrac{6}{5} = 1{,}2$.
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El denominador factoriza como $(s-3)(s+2)$.'
          - texto: 'Se descompone en $\frac{9/5}{s-3}+\frac{6/5}{s+2}$.'
          - texto: 'Cada trozo se reconoce en la tabla como una exponencial.'
          - texto: 'Luego $f(t) = \frac{9}{5}e^{3t}+\frac{6}{5}e^{-2t}$.'
          - texto: 'Como los dos coeficientes son positivos, la función es creciente en todo t.'
            trampa: true
            mensaje: |
              El signo de los coeficientes no decide el crecimiento: lo decide el
              exponente. Aquí el término $e^{-2t}$ decrece, aunque su coeficiente
              sea positivo. La suma acaba creciendo por culpa del $e^{3t}$, pero
              no por lo que dice la pieza.
    resolucion: |
      **Factorizar el denominador**, que es siempre lo primero:

      $$
      s^{2}-s-6 = (s-3)(s+2)
      $$

      Raíces reales y distintas, así que la respuesta serán dos exponenciales.

      **Descomponer:**

      $$
      \frac{3s}{(s-3)(s+2)} = \frac{A}{s-3}+\frac{B}{s+2}
      $$

      Con el método de cubrir —multiplicar por un factor y evaluar en su raíz—:

      $$
      A = \frac{3s}{s+2}\bigg|_{s=3} = \frac{9}{5},
      \qquad
      B = \frac{3s}{s-3}\bigg|_{s=-2} = \frac{6}{5}
      $$

      **Antitransformar cada trozo** con $\mathcal{L}^{-1}\{1/(s-a)\} = e^{at}$:

      $$
      \boxed{\;f(t) = \frac{9}{5}e^{3t} + \frac{6}{5}e^{-2t}\;}
      $$

      **La comprobación que cuesta nada:** en $t=0$ la función vale
      $9/5+6/5 = 3$. Y por otro lado, el teorema del valor inicial dice que
      $f(0) = \lim_{s\to\infty} sF(s) = \lim 3s^{2}/(s^{2}-s-6) = 3$. ✓ Coincide.

