  - id: sistema-de-edos-con-laplace
    titulo: Un sistema de dos EDOs, resuelto con Laplace
    fuente: Ejercicio 10.10a · Problemas complementarios, tema 10 · Cálculo, UPV/EHU (2016/2017 7E)
    nivel: practica
    enunciado: |
      Utilizando la transformada de Laplace resolver el sistema de EDOs

      $$
      \begin{cases}
      x' + y = 2\\
      y' + x = t
      \end{cases}
      \qquad x(0)=1,\; y(0)=0
      $$
    pide: Las funciones x(t) e y(t).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué se convierte un sistema de dos EDOs al transformarlo?
        opciones:
          - texto: En un sistema lineal de dos ecuaciones con incógnitas X(s) e Y(s)
            correcta: true
            mensaje: |
              Exacto, y ahí está la ventaja: se resuelve por reducción, como
              cualquier sistema de bachillerato. Sin Laplace habría que derivar
              una ecuación y sustituir en la otra.
          - texto: En una sola EDO de segundo orden
            mensaje: |
              Eso es lo que sale si atacas el sistema **sin** Laplace, derivando
              y sustituyendo. Es un camino válido y más largo, y no es lo que
              pide el enunciado.
          - texto: En dos ecuaciones independientes
            mensaje: |
              No se desacoplan: la $X$ y la $Y$ siguen apareciendo en las dos
              ecuaciones. Lo que cambia es que ahora son incógnitas algebraicas.
      - tipo: calcular
        titulo: El término independiente de la primera ecuación
        pregunta: |
          Transformando $x'+y=2$ con $x(0)=1$, queda $sX - 1 + Y = 2/s$.
          ¿Cuánto vale el lado derecho si lo pasamos todo junto, es decir
          $sX+Y = 2/s + 1$, evaluado en $s=2$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es solo el término que viene de la condición inicial. Falta
              sumarle $2/s$, que en $s=2$ vale 1.
          - valor: '3'
            mensaje: |
              Parece que has usado $2/s$ como si valiera 2. En $s=2$ ese término
              vale $2/2 = 1$, y sumado al 1 de la condición inicial da 2.
        pista: |
          $2/2 + 1$.
        desarrollo: |
          $$
          \mathcal{L}\{x'\} = sX - x(0) = sX - 1
          $$

          $$
          sX - 1 + Y = \frac{2}{s}
          \qquad\Longrightarrow\qquad
          sX + Y = \frac{2}{s}+1
          $$

          En $s=2$ el lado derecho vale $1+1 = 2$. **Fíjate en que la condición
          inicial ya está dentro**: no habrá que ajustarla al final.
      - tipo: justificar
        pregunta: |
          Ordena el procedimiento. Una pieza es falsa.
        piezas:
          - texto: 'Se transforman las dos ecuaciones, metiendo las condiciones iniciales.'
          - texto: 'Queda el sistema $sX+Y = 2/s+1$ y $X+sY = 1/s^{2}$.'
          - texto: 'Se resuelve por reducción, despejando $X(s)$ e $Y(s)$.'
          - texto: 'Se antitransforma cada una por fracciones simples.'
          - texto: 'Al final hay que imponer $x(0)=1$ e $y(0)=0$ para fijar las constantes.'
            trampa: true
            mensaje: |
              Ya están impuestas. Las condiciones iniciales entraron en el primer
              paso, al transformar las derivadas, y por eso lo que sale es
              directamente la solución particular. No queda ninguna constante
              libre que ajustar — esa es la ventaja del método.
    resolucion: |
      **Transformar las dos ecuaciones**, con las condiciones iniciales dentro:

      $$
      \mathcal{L}\{x'\} = sX - x(0) = sX-1,
      \qquad
      \mathcal{L}\{y'\} = sY - y(0) = sY
      $$

      $$
      \begin{cases}
      sX - 1 + Y = \dfrac{2}{s}\\[6pt]
      sY + X = \dfrac{1}{s^{2}}
      \end{cases}
      \qquad\Longrightarrow\qquad
      \begin{cases}
      sX + Y = \dfrac{2}{s}+1\\[6pt]
      X + sY = \dfrac{1}{s^{2}}
      \end{cases}
      $$

      **Ya no hay derivadas.** Es un sistema lineal de dos ecuaciones con dos
      incógnitas, $X(s)$ e $Y(s)$, y se resuelve por reducción.

      Multiplicando la segunda por $s$ y restando:

      $$
      (s^{2}-1)\,Y = \frac{1}{s} - \frac{2}{s} - 1
      \qquad\Longrightarrow\qquad
      Y(s) = \frac{-1/s - 1}{s^{2}-1}
      $$

      El $(1+s)$ se simplifica y queda mucho más corto de lo que parecía:

      $$
      Y(s) = \frac{1+s}{s\left(1-s^{2}\right)}
      = \frac{1+s}{s(1-s)(1+s)}
      = \frac{1}{s(1-s)}
      = \frac{1}{s} - \frac{1}{s-1}
      $$

      **Volviendo:**

      $$
      y(t) = 1 - e^{t}
      $$

      Y $X(s)$ sale de la segunda ecuación, $X = \dfrac{1}{s^{2}} - sY$:

      $$
      X(s) = \frac{1}{s^{2}} - \frac{s}{s(1-s)}
      = \frac{1}{s^{2}} + \frac{1}{s-1}
      \qquad\Longrightarrow\qquad
      x(t) = t + e^{t}
      $$

      $$
      \boxed{\;x(t) = t + e^{t}, \qquad y(t) = 1 - e^{t}\;}
      $$

      **La comprobación**, y aquí sí sirve porque son dos ecuaciones:
      $x(0)=1$ ✓, $y(0)=0$ ✓, $x'+y = (1+e^{t}) + (1-e^{t}) = 2$ ✓ y
      $y'+x = -e^{t} + t + e^{t} = t$ ✓

      > **Lo que este ejercicio evalúa** no es el álgebra del sistema, que es de
      > bachillerato. Es reconocer que un sistema acoplado de ecuaciones
      > diferenciales se desacopla al transformarlo — y que las condiciones
      > iniciales viajan dentro y no hay que volver a por ellas.

      <figure class="figura-examen">
      <svg viewBox="0 0 335 250" role="img" width="335" height="250"
