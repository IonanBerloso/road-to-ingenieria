ejercicios:
  # ═══════════════════════════════════════════════════════════════════
  # Ejemplos introductorios del tema 10. Nuestros, no de examen ni del boletín.
  # ═══════════════════════════════════════════════════════════════════

  - id: ej-transformada-con-la-tabla
    titulo: La primera transformada, con la tabla
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Calcular la transformada de Laplace de $f(t) = 3 + 2t - e^{4t}$.
    pide: La transformada F(s).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué se puede transformar cada sumando por separado?
        opciones:
          - texto: Porque la transformada es lineal
            correcta: true
            mensaje: |
              Eso es. $\mathcal{L}$ es una integral, y las integrales respetan
              sumas y constantes. Por eso la tabla basta para casi todo.
          - texto: Porque los tres sumandos son independientes
            mensaje: |
              La razón de fondo es la linealidad de la integral, no que los
              términos sean «independientes» — eso no es una propiedad de la
              transformada.
          - texto: No se puede; hay que aplicar la definición al conjunto
            mensaje: |
              Se puede, y es lo que se hace siempre. Aplicar la definición
              —integrar de 0 a infinito— solo se hace cuando el enunciado lo
              exige expresamente.
      - tipo: calcular
        titulo: La transformada del término lineal
        pregunta: |
          Con $\mathcal{L}\{t^{n}\} = n!/s^{n+1}$, ¿cuánto vale el numerador de
          $\mathcal{L}\{2t\}$, si el denominador es $s^{2}$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Te has dejado el coeficiente 2 que multiplica a la $t$. Con $n=1$
              sale $1!/s^{2} = 1/s^{2}$, y por el 2 queda $2/s^{2}$.
          - valor: '4'
            mensaje: |
              Parece que has multiplicado el 2 del enunciado por otro 2. Con
              $n=1$, el factorial vale 1, así que el numerador es solo el 2 del
              coeficiente.
        pista: |
          Con n=1, $1!/s^2 = 1/s^2$. Multiplícalo por el coeficiente 2.
        desarrollo: |
          $$
          \mathcal{L}\{2t\} = 2\cdot\frac{1!}{s^{2}} = \frac{2}{s^{2}}
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'Por linealidad, se transforma cada sumando por separado.'
          - texto: '$\mathcal{L}\{3\} = 3/s$, porque $\mathcal{L}\{1\}=1/s$.'
          - texto: '$\mathcal{L}\{2t\} = 2/s^{2}$.'
          - texto: '$\mathcal{L}\{e^{4t}\} = 1/(s-4)$, con el signo cambiado en el denominador.'
          - texto: '$\mathcal{L}\{e^{4t}\} = 1/(s+4)$, porque la definición lleva $e^{-st}$.'
            trampa: true
            mensaje: |
              El signo va al revés. La tabla dice
              $\mathcal{L}\{e^{at}\} = 1/(s-a)$, así que con $a=4$ sale
              $1/(s-4)$. Es un signo que se confunde precisamente por lo que
              dice la pieza — pero al integrar $e^{4t}e^{-st}$ queda
              $e^{-(s-4)t}$, y de ahí el $s-4$.
    resolucion: |
      **La linealidad hace todo el trabajo.** La transformada es una integral, y
      las integrales reparten sumas y sacan constantes:

      $$
      \mathcal{L}\{3 + 2t - e^{4t}\}
      = 3\,\mathcal{L}\{1\} + 2\,\mathcal{L}\{t\} - \mathcal{L}\{e^{4t}\}
      $$

      **Cada trozo, de la tabla:**

      | término | transformada |
      |---|---|
      | $3$ | $3/s$ |
      | $2t$ | $2/s^{2}$ |
      | $e^{4t}$ | $1/(s-4)$ |

      $$
      \boxed{\;F(s) = \frac{3}{s} + \frac{2}{s^{2}} - \frac{1}{s-4}\;}
      $$

      **El signo del denominador**, que es lo único con trampa aquí. La
      definición lleva $e^{-st}$, y al multiplicar por $e^{4t}$ el exponente
      queda $-(s-4)t$: por eso sale $s-4$ y no $s+4$. Si te sale con el signo
      cambiado, la antitransformada te dará $e^{-4t}$, que crece o decrece justo
      al revés.

  - id: ej-inversa-fracciones-simples
    titulo: Volver, descomponiendo en fracciones simples
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Calcular la transformada inversa de $F(s) = \dfrac{3s}{s^{2}-s-6}$.
    pide: La función f(t) cuya transformada es F(s).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es el primer paso para antitransformar un cociente de polinomios?
        opciones:
          - texto: Factorizar el denominador y descomponer en fracciones simples
            correcta: true
            mensaje: |
              Sí. La tabla solo tiene entradas sencillas, así que hay que partir
              la fracción hasta que cada trozo se reconozca.
          - texto: Derivar el numerador
            mensaje: |
              Eso no tiene nada que ver. Antitransformar no es derivar: es
              reconocer la fracción en la tabla, y para eso hay que romperla en
              trozos reconocibles.
          - texto: Aplicar la definición de la transformada inversa
            mensaje: |
              Existe una fórmula integral para la inversa, pero es una integral
              en el plano complejo que no se usa en este curso. En la práctica
              se antitransforma por reconocimiento.
      - tipo: calcular
        titulo: La raíz positiva del denominador
        pregunta: |
          ¿Cuál es la raíz positiva de $s^{2}-s-6=0$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 no es raíz: $4-2-6 = -4 \neq 0$. La otra raíz es $-2$, negativa.
          - valor: '6'
            mensaje: |
              6 es el término independiente con el signo cambiado, no una raíz.
              Factoriza: $(s-3)(s+2)$.
        pista: |
          Busca dos números que multiplicados den −6 y sumados den −1.
        desarrollo: |
          $$
          s^{2}-s-6 = (s-3)(s+2)
          $$

          Las raíces son $3$ y $-2$. Al ser **reales y distintas**, la
          antitransformada serán dos exponenciales.
      - tipo: calcular
        titulo: El coeficiente de la primera fracción
        pregunta: |
          En $\dfrac{3s}{(s-3)(s+2)} = \dfrac{A}{s-3}+\dfrac{B}{s+2}$, ¿cuánto
          vale $A$?
        respuesta:
          tipo: numero
          valor: '1.8'
          tolerancia: 0.01
          formato: en forma exacta (9/5) o con un decimal
        distractores:
          - valor: '3'
            mensaje: |
              3 es el coeficiente del numerador original, no el de la fracción
              simple. Con el método de cubrir: $A = 3\cdot 3/(3+2) = 9/5$.
          - valor: '1.2'
            mensaje: |
              $1{,}2$ es $B$, el coeficiente de la otra fracción:
              $3(-2)/(-2-3) = 6/5$. Cuidado con cuál es cuál.
        pista: |
          Multiplica por (s−3) y evalúa en s=3: sale $3(3)/(3+2)$.
        desarrollo: |
          Con el método de cubrir, multiplicando por $(s-3)$ y evaluando en
          $s=3$:

          $$
          A = \frac{3s}{s+2}\bigg|_{s=3} = \frac{9}{5} = 1{,}8
          $$

          Y análogamente $B = \dfrac{3s}{s-3}\bigg|_{s=-2} = \dfrac{-6}{-5} = \dfrac{6}{5} = 1{,}2$.
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El denominador factoriza como $(s-3)(s+2)$.'
          - texto: 'Se descompone en $\frac{9/5}{s-3}+\frac{6/5}{s+2}$.'
          - texto: 'Cada trozo se reconoce en la tabla como una exponencial.'
          - texto: 'Luego $f(t) = \frac{9}{5}e^{3t}+\frac{6}{5}e^{-2t}$.'
          - texto: 'Como los dos coeficientes son positivos, la función es creciente en todo t.'
            trampa: true
            mensaje: |
              El signo de los coeficientes no decide el crecimiento: lo decide el
              exponente. Aquí el término $e^{-2t}$ decrece, aunque su coeficiente
              sea positivo. La suma acaba creciendo por culpa del $e^{3t}$, pero
              no por lo que dice la pieza.
    resolucion: |
      **Factorizar el denominador**, que es siempre lo primero:

      $$
      s^{2}-s-6 = (s-3)(s+2)
      $$

      Raíces reales y distintas, así que la respuesta serán dos exponenciales.

      **Descomponer:**

      $$
      \frac{3s}{(s-3)(s+2)} = \frac{A}{s-3}+\frac{B}{s+2}
      $$

      Con el método de cubrir —multiplicar por un factor y evaluar en su raíz—:

      $$
      A = \frac{3s}{s+2}\bigg|_{s=3} = \frac{9}{5},
      \qquad
      B = \frac{3s}{s-3}\bigg|_{s=-2} = \frac{6}{5}
      $$

      **Antitransformar cada trozo** con $\mathcal{L}^{-1}\{1/(s-a)\} = e^{at}$:

      $$
      \boxed{\;f(t) = \frac{9}{5}e^{3t} + \frac{6}{5}e^{-2t}\;}
      $$

      **La comprobación que cuesta nada:** en $t=0$ la función vale
      $9/5+6/5 = 3$. Y por otro lado, el teorema del valor inicial dice que
      $f(0) = \lim_{s\to\infty} sF(s) = \lim 3s^{2}/(s^{2}-s-6) = 3$. ✓ Coincide.

  - id: ej-escalon-y-retraso
    titulo: Escribir con el escalón una función que empieza tarde
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Escribir con la función escalón, y transformar,
      $$
      f(t)=
      \begin{cases}
      0 & t<3\\
      \left(t-3\right)^{2} & t\ge3
      \end{cases}
      $$
    pide: La función en una sola fórmula, y su transformada.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Para qué sirve multiplicar por $u(t-3)$?
        opciones:
          - texto: >-
              Para apagar la función hasta el instante $3$ y dejarla encendida
              a partir de ahí, todo en una sola fórmula
            correcta: true
            mensaje: |
              Eso es. El escalón no calcula: **traduce**. Una definición a
              trozos se convierte en un producto, y un producto sí tiene
              transformada de una línea.
          - texto: Para desplazar la gráfica tres unidades a la derecha
            mensaje: |
              Eso lo hace el $(t-3)$ de dentro, no el escalón. El escalón solo
              decide **desde cuándo** existe la función; el desplazamiento es
              cosa del argumento. En este enunciado están las dos cosas, y por
              eso encaja tan bien con la fórmula del retraso.
          - texto: >-
              Para que la transformada exista, porque si no la integral diverge
            mensaje: |
              La transformada de $t^{2}$ existe perfectamente y vale
              $2/s^{3}$. El escalón no arregla ninguna convergencia: solo
              escribe a trozos en una línea.

      - tipo: calcular
        titulo: El retraso
        pregunta: |
          La transformada es $e^{-as}\cdot\dfrac{n!}{s^{n+1}}$. ¿Cuánto vale
          $a$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              El $2$ es el exponente del cuadrado, no el retraso. El retraso es
              el número que aparece **dentro del escalón**, $u(t-3)$.
          - valor: '-3'
            mensaje: |
              Signo. La regla es
              $\mathcal{L}\{f(t-a)u(t-a)\}=e^{-as}F(s)$ con $a=3$: el menos ya
              está puesto en el exponente, no hay que ponerlo dos veces.
          - valor: '0'
            mensaje: |
              Si $a$ fuera cero no habría retraso y la función empezaría en el
              origen. Aquí no existe hasta el segundo $3$.
        pista: |
          Es el número que aparece dentro del escalón.
        desarrollo: |
          $$
          f(t)=\left(t-3\right)^{2}u(t-3)
          \;\Longrightarrow\;
          a=3
          $$

      - tipo: calcular
        titulo: El numerador
        pregunta: |
          En $e^{-3s}\cdot\dfrac{n!}{s^{n+1}}$ con $n=2$, ¿cuánto vale el
          numerador $n!$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              $1$ sería el numerador si la tabla dijera $1/s^{n+1}$, y no lo
              dice: $\mathcal{L}\{t^{n}\}=n!/s^{n+1}$. Con $n=2$, $2!=2$.
          - valor: '6'
            mensaje: |
              $6=3!$, y el $3$ de aquí es el retraso, no el exponente. El
              exponente es el $2$ del cuadrado.
          - valor: '4'
            mensaje: |
              $4$ sería $2^{2}$. El factorial de $2$ es $2\cdot1=2$.
        pista: |
          $\mathcal{L}\{t^{2}\}=\dfrac{2!}{s^{3}}$.
        desarrollo: |
          $$
          \mathcal{L}\left\{\left(t-3\right)^{2}u(t-3)\right\}
          =e^{-3s}\cdot\frac{2}{s^{3}}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La función vale cero hasta $t=3$, así que se escribe multiplicando
              por el escalón: $f(t)=\left(t-3\right)^{2}u(t-3)$.
          - texto: >-
              Tiene exactamente la forma $g(t-a)\,u(t-a)$ con $g(t)=t^{2}$ y
              $a=3$, así que se le puede aplicar la traslación en $t$.
          - texto: >-
              Como $\mathcal{L}\{t^{2}\}=2/s^{3}$, la transformada es
              $e^{-3s}\cdot 2/s^{3}$.
          - texto: >-
              Si el enunciado hubiera dicho $t^{2}$ en vez de
              $\left(t-3\right)^{2}$, la respuesta sería la misma con el mismo
              factor $e^{-3s}$.
            trampa: true
            mensaje: |
              No: $t^{2}u(t-3)$ **no** tiene la forma $g(t-a)u(t-a)$, porque el
              argumento de dentro no está retrasado. Habría que reescribirlo
              como $\bigl((t-3)+3\bigr)^{2}$ y desarrollar el cuadrado, lo que
              da tres términos y tres transformadas. Mirar si el argumento
              lleva el mismo retraso que el escalón es lo primero que hay que
              comprobar.
    resolucion: |
      **En una sola fórmula.** El escalón $u(t-3)$ vale cero hasta el segundo
      $3$ y uno a partir de ahí, así que multiplicar por él apaga lo que haya
      delante:

      $$
      f(t)=\left(t-3\right)^{2}u(t-3)
      $$

      Y eso ya no es una definición a trozos: es un producto, que sí se puede
      transformar de un tirón.

      **La transformada.** La regla del retraso dice
      $\mathcal{L}\{g(t-a)\,u(t-a)\}=e^{-as}G(s)$. Aquí $g(t)=t^{2}$ y $a=3$:

      $$
      \mathcal{L}\{f\}=e^{-3s}\cdot\frac{2!}{s^{3}}=\frac{2\,e^{-3s}}{s^{3}}
      $$

      **Lo que hay que comprobar antes de aplicar la regla**, y es lo único con
      trampa: que el argumento de dentro lleve **el mismo** retraso que el
      escalón. Aquí sí, $(t-3)$ y $u(t-3)$. Si el enunciado hubiera escrito
      $t^{2}u(t-3)$, la regla no valdría tal cual y habría que reescribir
      $t^{2}=\bigl((t-3)+3\bigr)^{2}=(t-3)^{2}+6(t-3)+9$, transformar los tres
      sumandos y sacar el $e^{-3s}$ factor común. Es más largo, pero se puede.

      **Y al revés.** Cuando en una antitransformada aparezca un $e^{-3s}$, se
      aparta, se antitransforma el resto, y al final se sustituye $t$ por $t-3$
      y se multiplica por $u(t-3)$. El factor exponencial nunca entra en las
      fracciones simples.

  - id: ej-edo-entera-con-laplace
    titulo: El rodeo completo, de la EDO a la solución
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Resolver $y' + 3y = 0$ con $y(0) = 2$ usando la transformada de Laplace.
    pide: La función y(t).
    pasos:
      - tipo: reconocer
        pregunta: |
          Al transformar $y'$, ¿qué aparece además de $sY$?
        opciones:
          - texto: >-
              La condición inicial, con signo menos: $\mathcal{L}\{y'\} = sY - y(0)$
            correcta: true
            mensaje: |
              Eso es, y es **la** ventaja del método: la condición inicial entra
              en la primera línea. Con los métodos del tema 9 se resuelve la
              general y se impone al final; aquí ya está dentro.
          - texto: Nada más, es simplemente $sY$
            mensaje: |
              Falta $y(0)$. Sale de integrar por partes en la definición, y es
              lo que hace que Laplace no necesite imponer condiciones al final.
          - texto: La constante de integración
            mensaje: |
              No hay constante de integración: el método nunca integra la
              ecuación. Lo que aparece es el valor inicial, que es un dato del
              enunciado y no una incógnita.
      - tipo: calcular
        titulo: El polo de Y(s)
        pregunta: |
          Despejando queda $Y(s) = \dfrac{2}{s+3}$. ¿En qué valor de $s$ se
          anula su denominador?
        respuesta:
          tipo: numero
          valor: '-3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              Signo cambiado. El denominador es $s+3$, que se anula en $s=-3$.
              Y ese signo decide todo: con $s-3$ la solución crecería, con
              $s+3$ decae.
          - valor: '2'
            mensaje: |
              $2$ es el numerador, que viene de $y(0)$. Lo que decide la forma
              de la solución es el denominador.
          - valor: '0'
            mensaje: |
              En $s=0$ el denominador vale 3, no cero. Buscas dónde $s+3=0$.
        pista: |
          Resuelve $s+3=0$.
        desarrollo: |
          $$
          Y(s) = \frac{2}{s+3}
          \qquad\Longrightarrow\qquad
          s+3 = 0
          \qquad\Longrightarrow\qquad
          s = -3
          $$

          Y de la tabla, $\mathcal{L}^{-1}\!\left[\frac{1}{s-a}\right] = e^{at}$
          con $a=-3$: la solución es $2e^{-3t}$, que **decae**.
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Transformando: $sY - 2 + 3Y = 0$, con el 2 que es $y(0)$.'
          - texto: 'Agrupando: $Y(s+3) = 2$, y de ahí $Y = \dfrac{2}{s+3}$.'
          - texto: 'De la tabla, $\mathcal{L}^{-1}\!\left[\frac{1}{s-a}\right]=e^{at}$ con $a=-3$.'
          - texto: 'Luego $y(t) = 2e^{-3t}$, y en $t=0$ vale 2 ✓'
          - texto: 'Al final hay que imponer $y(0)=2$ sobre la solución obtenida.'
            trampa: true
            mensaje: |
              Ya está impuesta: entró en la primera línea, en el $-y(0)$ de la
              transformada de la derivada. Por eso el resultado sale sin
              constantes libres. Volver a imponerla no está mal, pero delata
              que no se ha visto dónde entró — y en los sistemas de dos
              ecuaciones esa es justamente la ventaja que hace ganar tiempo.
    resolucion: |
      **El rodeo, de principio a fin y sobre la ecuación más corta posible.**

      **1 · Transformar.** La derivada se lleva la condición inicial dentro:

      $$
      \mathcal{L}\{y'\} = sY - y(0) = sY - 2
      \qquad\Longrightarrow\qquad
      sY - 2 + 3Y = 0
      $$

      **2 · Despejar**, que ya no es cálculo sino álgebra de bachillerato:

      $$
      Y(s+3) = 2
      \qquad\Longrightarrow\qquad
      Y(s) = \frac{2}{s+3}
      $$

      **3 · Volver.** De la tabla, $\mathcal{L}^{-1}\!\left[\frac{1}{s-a}\right] = e^{at}$,
      y aquí $a = -3$:

      $$
      \boxed{\;y(t) = 2e^{-3t}\;}
      $$

      **La comprobación:** $y(0) = 2$ ✓ y $y' + 3y = -6e^{-3t} + 6e^{-3t} = 0$ ✓

      > **Lo que hay que llevarse.** Esta ecuación se resuelve en dos líneas
      > separando variables, y con Laplace cuesta más. **El método no compensa
      > aquí**, y verlo en el caso donde no compensa es lo que deja claro dónde
      > sí: cuando hay un escalón, una convolución, o dos ecuaciones acopladas.
      > Ahí separar variables no llega y el rodeo es el único camino.
      >
      > Y fíjate en el signo del denominador, porque es lo que más se falla:
      > $s+3$ da $e^{-3t}$ y decae; $s-3$ daría $e^{3t}$ y explota. Un signo
      > cambiado no da un número distinto, da una física distinta.

