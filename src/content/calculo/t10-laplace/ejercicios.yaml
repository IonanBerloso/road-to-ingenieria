  - id: ej-multiplicar-por-t-es-derivar-la-transformada
    titulo: Multiplicar por t es derivar la transformada
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre la propiedad de que
      multiplicar por te equivale a derivar la transformada y cambiarle el
      signo, del tema 10. Es el peldaño que faltaba antes del ejercicio de
      coeficientes variables del examen de 2025-2026. No es de examen ni del
      boletín.
    nivel: ejemplo
    enunciado: |
      a) Comprobar, derivando la transformada, que
      $\mathcal{L}\{t\,e^{3t}\}$ coincide con lo que dice la tabla.

      b) Resolver con Laplace la ecuación $t\,y' - y = 0$ sabiendo que
      $y'(0) = 2$.
    pide: La transformada de t por una exponencial, y la solución de la ecuación.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué le hace a la transformada multiplicar la función por $t$?
        opciones:
          - texto: >-
              La deriva respecto de $s$ y le cambia el signo:
              $\mathcal{L}\{t\,f\} = -F'(s)$
            correcta: true
            mensaje: |
              Eso es, y es la propiedad que hace útil a Laplace cuando aparece
              una $t$ delante de una derivada. Fíjate en el precio: la ecuación
              **deja de ser algebraica** en $Y$ y pasa a ser una ecuación
              diferencial de primer orden en $Y(s)$.
          - texto: >-
              La divide entre $s$
            mensaje: |
              Dividir entre $s$ es lo que hace **integrar** la función, no
              multiplicarla por $t$. Son propiedades distintas y las dos están
              en la tabla; conviene no mezclarlas.
          - texto: >-
              La desplaza: $F(s-1)$
            mensaje: |
              El desplazamiento en $s$ lo produce multiplicar por una
              **exponencial**, $e^{at}$, no por $t$. Multiplicar por $t$
              deriva.

      - tipo: calcular
        titulo: La comprobación con la exponencial
        pregunta: |
          Sabiendo que $\mathcal{L}\{e^{3t}\} = 1/(s-3)$, ¿cuánto vale
          $\mathcal{L}\{t\,e^{3t}\}$ en $s=5$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.001
          formato: un número, en forma exacta o decimal
        distractores:
          - valor: '0.5'
            mensaje: |
              Eso es $\mathcal{L}\{e^{3t}\}$ en $s=5$: no has aplicado la
              propiedad. Multiplicar por $t$ **sube el exponente del
              denominador en uno**.
          - valor: '0.125'
            mensaje: |
              Has elevado al cubo. Derivar $1/(s-3)$ una vez da
              $-1/(s-3)^{2}$, con exponente 2; el cubo saldría de multiplicar
              por $t^{2}$.
        pista: |
          Deriva $1/(s-3)$ respecto de $s$, cámbiale el signo y evalúa.
        desarrollo: |
          $$
          -\frac{d}{ds}\left(\frac{1}{s-3}\right)
          = -\left(-\frac{1}{(s-3)^{2}}\right) = \frac{1}{(s-3)^{2}}
          $$

          En $s=5$ eso vale $1/4 = 0{,}25$. Y coincide con la tabla, que trae
          $\mathcal{L}\{t\,e^{at}\} = 1/(s-a)^{2}$: **los dos signos menos se
          cancelan**, y por eso el resultado sale positivo aunque la propiedad
          lleve uno delante.

      - tipo: calcular
        titulo: El exponente que sale de la ecuación
        pregunta: |
          Al transformar $t\,y' - y = 0$ queda una ecuación en $Y$ cuya
          solución es $Y = K/s^{n}$. ¿Cuánto vale $n$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              Te has dejado uno de los dos términos en $Y$. Al derivar
              $sY - y(0)$ aparece $Y + sY'$, y ese $Y$ se suma al $-Y$ del
              segundo término del enunciado: son **dos**, no uno.
          - valor: '-2'
            mensaje: |
              El signo. De $s\,Y' = -2Y$ sale $Y'/Y = -2/s$, o sea
              $\ln Y = -2\ln s$: el menos ya está en que $s$ va **debajo**.
        pista: |
          $\mathcal{L}\{t\,y'\} = -\frac{d}{ds}\bigl(sY-y(0)\bigr)$, y la
          constante $y(0)$ desaparece al derivar.
        desarrollo: |
          $$
          \mathcal{L}\{t\,y'\} = -\frac{d}{ds}\Bigl(sY - y(0)\Bigr)
          = -\left(Y + sY'\right)
          $$

          Sustituyendo en la ecuación:

          $$
          -Y - sY' - Y = 0
          \;\Longrightarrow\;
          s\,Y' = -2Y
          \;\Longrightarrow\;
          \frac{Y'}{Y} = -\frac{2}{s}
          \;\Longrightarrow\;
          Y = \frac{K}{s^{2}}
          $$

          Y fíjate en algo que conviene tener visto antes del examen: **la
          condición $y(0)$ se ha esfumado al derivar**, porque era una
          constante. Así que la constante que queda no sale de ahí — tiene que
          salir de otro dato.

      - tipo: calcular
        titulo: La solución
        pregunta: |
          Antitransformando y usando $y'(0)=2$, ¿cuánto vale $y(4)$?
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Eso es la constante $K$, no $y(4)$. La antitransformada de
              $K/s^{2}$ es $K\,t$, así que hay que evaluar en $t=4$.
          - valor: '32'
            mensaje: |
              Has antitransformado $K/s^{2}$ como si diera $K\,t^{2}$. La
              tabla dice que $1/s^{2}$ es $t$, y $t^{2}$ corresponde a
              $2/s^{3}$.
        pista: |
          $\mathcal{L}^{-1}\{1/s^{2}\} = t$. Y si $y = Kt$, ¿cuánto vale
          $y'(0)$?
        desarrollo: |
          $$
          Y = \frac{K}{s^{2}} \;\Longrightarrow\; y = K\,t
          $$

          Como $y' = K$ para todo $t$, la condición $y'(0)=2$ da $K=2$, así que
          $y = 2t$ y $y(4) = 8$.

          **Y se comprueba en una línea**, que es lo que hay que hacer siempre
          en este apartado: $t\,y' - y = t\cdot 2 - 2t = 0$. Cumple.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con una $t$ delante de la derivada los métodos del tema 9 no
              arrancan, y Laplace sí, porque tiene una propiedad para eso.
          - texto: >-
              Esa propiedad convierte la ecuación algebraica en $Y$ en una
              ecuación diferencial de primer orden en $Y(s)$, que es separable.
          - texto: >-
              Sale $Y = K/s^{2}$, o sea $y = Kt$, y la constante la fija
              $y'(0)$ porque $y(0)$ se perdió al derivar.
          - texto: >-
              Y por eso este método necesita siempre **dos** condiciones
              iniciales, igual que cualquier ecuación de segundo orden.
            trampa: true
            mensaje: |
              Aquí la ecuación es de **primer** orden y ha bastado una
              condición — y ni siquiera la habitual: $y(0)$ no sirve, porque
              desaparece al derivar la transformada. Lo que decide cuántas
              condiciones hacen falta es el orden de la ecuación, no el método;
              lo que Laplace cambia es **cuál** de ellas acaba siendo útil.
    resolucion: |
      **a) La comprobación.** La propiedad dice
      $\mathcal{L}\{t\,f\} = -F'(s)$, así que

      $$
      \mathcal{L}\{t\,e^{3t}\}
      = -\frac{d}{ds}\left(\frac{1}{s-3}\right)
      = \frac{1}{(s-3)^{2}}
      $$

      que es exactamente lo que trae la tabla. En $s=5$, $0{,}25$.

      **b) La ecuación.** Transformando término a término, con la constante
      $y(0)$ desapareciendo al derivar:

      $$
      -\left(Y + sY'\right) - Y = 0
      \;\Longrightarrow\;
      s\,Y' = -2Y
      \;\Longrightarrow\;
      Y = \frac{K}{s^{2}}
      \;\Longrightarrow\;
      y = K\,t
      $$

      Con $y'(0) = 2$ queda $y = 2t$, y $y(4) = 8$. Comprobación:
      $t\,y' - y = 2t - 2t = 0$.

      **Lo que hay que llevarse.** Tres cosas, y las tres reaparecen en el
      ejercicio de examen de 2025-2026, que es el mismo método con una
      ecuación de segundo orden:

      1. **Multiplicar por $t$ deriva la transformada**, con un signo menos
         que es el error más repetido del apartado.
      2. **La ecuación en $Y$ deja de ser algebraica.** Sale una ecuación
         diferencial de primer orden, y por suerte siempre separable en los
         casos que caen: dos líneas.
      3. **Las condiciones iniciales se comportan raro.** Al derivar, las
         constantes $y(0)$ se van, así que la que fija $K$ suele ser la otra.
         En el examen de 2025-2026 pasa lo mismo al revés: sobra una, y que
         las dos se cumplan con una sola constante es la señal de que el
         camino era bueno.

  - id: sistema-de-edos-con-laplace
    titulo: Un sistema de dos EDOs, resuelto con Laplace
    fuente: Ejercicio 10.10a · Problemas complementarios, tema 10 · Cálculo, UPV/EHU (2016/2017 7E)
    nivel: practica
    enunciado: |
      Utilizando la transformada de Laplace resolver el sistema de EDOs

      $$
      \begin{cases}
      x' + y = 2\\
      y' + x = t
      \end{cases}
      \qquad x(0)=1,\; y(0)=0
      $$
    pide: Las funciones x(t) e y(t).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué se convierte un sistema de dos EDOs al transformarlo?
        opciones:
          - texto: En un sistema lineal de dos ecuaciones con incógnitas X(s) e Y(s)
            correcta: true
            mensaje: |
              Exacto, y ahí está la ventaja: se resuelve por reducción, como
              cualquier sistema de bachillerato. Sin Laplace habría que derivar
              una ecuación y sustituir en la otra.
          - texto: En una sola EDO de segundo orden
            mensaje: |
              Eso es lo que sale si atacas el sistema **sin** Laplace, derivando
              y sustituyendo. Es un camino válido y más largo, y no es lo que
              pide el enunciado.
          - texto: En dos ecuaciones independientes
            mensaje: |
              No se desacoplan: la $X$ y la $Y$ siguen apareciendo en las dos
              ecuaciones. Lo que cambia es que ahora son incógnitas algebraicas.
      - tipo: calcular
        titulo: El término independiente de la primera ecuación
        pregunta: |
          Transformando $x'+y=2$ con $x(0)=1$, queda $sX - 1 + Y = 2/s$.
          ¿Cuánto vale el lado derecho si lo pasamos todo junto, es decir
          $sX+Y = 2/s + 1$, evaluado en $s=2$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es solo el término que viene de la condición inicial. Falta
              sumarle $2/s$, que en $s=2$ vale 1.
          - valor: '3'
            mensaje: |
              Parece que has usado $2/s$ como si valiera 2. En $s=2$ ese término
              vale $2/2 = 1$, y sumado al 1 de la condición inicial da 2.
        pista: |
          $2/2 + 1$.
        desarrollo: |
          $$
          \mathcal{L}\{x'\} = sX - x(0) = sX - 1
          $$

          $$
          sX - 1 + Y = \frac{2}{s}
          \qquad\Longrightarrow\qquad
          sX + Y = \frac{2}{s}+1
          $$

          En $s=2$ el lado derecho vale $1+1 = 2$. **Fíjate en que la condición
          inicial ya está dentro**: no habrá que ajustarla al final.
      - tipo: justificar
        pregunta: |
          Ordena el procedimiento. Una pieza es falsa.
        piezas:
          - texto: 'Se transforman las dos ecuaciones, metiendo las condiciones iniciales.'
          - texto: 'Queda el sistema $sX+Y = 2/s+1$ y $X+sY = 1/s^{2}$.'
          - texto: 'Se resuelve por reducción, despejando $X(s)$ e $Y(s)$.'
          - texto: 'Se antitransforma cada una por fracciones simples.'
          - texto: 'Al final hay que imponer $x(0)=1$ e $y(0)=0$ para fijar las constantes.'
            trampa: true
            mensaje: |
              Ya están impuestas. Las condiciones iniciales entraron en el primer
              paso, al transformar las derivadas, y por eso lo que sale es
              directamente la solución particular. No queda ninguna constante
              libre que ajustar — esa es la ventaja del método.
    resolucion: |
      **Transformar las dos ecuaciones**, con las condiciones iniciales dentro:

      $$
      \mathcal{L}\{x'\} = sX - x(0) = sX-1,
      \qquad
      \mathcal{L}\{y'\} = sY - y(0) = sY
      $$

      $$
      \begin{cases}
      sX - 1 + Y = \dfrac{2}{s}\\[6pt]
      sY + X = \dfrac{1}{s^{2}}
      \end{cases}
      \qquad\Longrightarrow\qquad
      \begin{cases}
      sX + Y = \dfrac{2}{s}+1\\[6pt]
      X + sY = \dfrac{1}{s^{2}}
      \end{cases}
      $$

      **Ya no hay derivadas.** Es un sistema lineal de dos ecuaciones con dos
      incógnitas, $X(s)$ e $Y(s)$, y se resuelve por reducción.

      Multiplicando la segunda por $s$ y restando:

      $$
      (s^{2}-1)\,Y = \frac{1}{s} - \frac{2}{s} - 1
      \qquad\Longrightarrow\qquad
      Y(s) = \frac{-1/s - 1}{s^{2}-1}
      $$

      El $(1+s)$ se simplifica y queda mucho más corto de lo que parecía:

      $$
      Y(s) = \frac{1+s}{s\left(1-s^{2}\right)}
      = \frac{1+s}{s(1-s)(1+s)}
      = \frac{1}{s(1-s)}
      = \frac{1}{s} - \frac{1}{s-1}
      $$

      **Volviendo:**

      $$
      y(t) = 1 - e^{t}
      $$

      Y $X(s)$ sale de la segunda ecuación, $X = \dfrac{1}{s^{2}} - sY$:

      $$
      X(s) = \frac{1}{s^{2}} - \frac{s}{s(1-s)}
      = \frac{1}{s^{2}} + \frac{1}{s-1}
      \qquad\Longrightarrow\qquad
      x(t) = t + e^{t}
      $$

      $$
      \boxed{\;x(t) = t + e^{t}, \qquad y(t) = 1 - e^{t}\;}
      $$

      **La comprobación**, y aquí sí sirve porque son dos ecuaciones:
      $x(0)=1$ ✓, $y(0)=0$ ✓, $x'+y = (1+e^{t}) + (1-e^{t}) = 2$ ✓ y
      $y'+x = -e^{t} + t + e^{t} = t$ ✓

      > **Lo que este ejercicio evalúa** no es el álgebra del sistema, que es de
      > bachillerato. Es reconocer que un sistema acoplado de ecuaciones
      > diferenciales se desacopla al transformarlo — y que las condiciones
      > iniciales viajan dentro y no hay que volver a por ellas.

  - id: ecuacion-integral-convolucion
    titulo: Una ecuación integral, y la convolución
    fuente: Ejercicio 10.12d · Problemas complementarios, tema 10 · Cálculo, UPV/EHU (2015/2016 7E)
    nivel: practica
    enunciado: |
      Utilizando la transformada de Laplace, resolver la ecuación integral

      $$
      y(t) = t + \int_{0}^{t}\text{sen}(t-u)\,y(u)\,du
      $$
    pide: La función y(t).
    pasos:
      - tipo: reconocer
        pregunta: |
          La integral $\int_0^t \text{sen}(t-u)\,y(u)\,du$ tiene una forma
          reconocible. ¿Cuál?
        opciones:
          - texto: Es una convolución de sen t con y(t)
            correcta: true
            mensaje: |
              Sí, y esa es toda la clave. Los límites de 0 a $t$ y el argumento
              $(t-u)$ junto a $u$ son la firma de una convolución, aunque el
              enunciado nunca use la palabra.
          - texto: Es una integral por partes disfrazada
            mensaje: |
              No se puede integrar por partes: la incógnita $y$ está **dentro**
              de la integral, así que no hay nada que integrar todavía.
          - texto: Es la definición de la transformada de Laplace
            mensaje: |
              La definición va de 0 a infinito y lleva $e^{-st}$. Esta va de 0 a
              $t$ y lleva un seno: es otra cosa.
      - tipo: calcular
        titulo: Despejar la transformada
        pregunta: |
          La ecuación transformada es $Y = \frac{1}{s^{2}} + \frac{1}{s^{2}+1}Y$.
          Al despejar sale $Y = \frac{s^{2}+1}{s^{4}}$. ¿Cuánto vale $Y$ en
          $s = 1$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Parece que has evaluado solo el $s^{2}$ del numerador. En $s=1$ el
              numerador es $1+1=2$ y el denominador es 1.
          - valor: '0.5'
            mensaje: |
              Has dado la vuelta a la fracción. Es $(s^{2}+1)/s^{4}$, no al
              revés.
        pista: |
          $(1+1)/1$.
        desarrollo: |
          $$
          Y\left(1 - \frac{1}{s^{2}+1}\right) = \frac{1}{s^{2}}
          \;\Longrightarrow\;
          Y\cdot\frac{s^{2}}{s^{2}+1} = \frac{1}{s^{2}}
          \;\Longrightarrow\;
          Y = \frac{s^{2}+1}{s^{4}}
          $$

          En $s=1$ vale $2/1 = 2$.
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La integral es una convolución, así que su transformada es el producto.'
          - texto: '$\mathcal{L}\{\text{sen}\,t\} = \frac{1}{s^{2}+1}$ y $\mathcal{L}\{t\} = \frac{1}{s^{2}}$.'
          - texto: 'La ecuación transformada queda $Y = \frac{1}{s^{2}} + \frac{1}{s^{2}+1}Y$.'
          - texto: 'Despejando, $Y = \frac{s^{2}+1}{s^{4}} = \frac{1}{s^{2}}+\frac{1}{s^{4}}$.'
          - texto: 'Antitransformando sale $y(t) = t + t^{3}$.'
            trampa: true
            mensaje: |
              Falta el factorial. $\mathcal{L}\{t^{n}\} = n!/s^{n+1}$, así que
              $1/s^{4}$ corresponde a $t^{3}/3!= t^{3}/6$, no a $t^{3}$. La
              respuesta correcta es $y(t) = t + t^{3}/6$.
    resolucion: |
      **Reconocer la convolución** es el ejercicio entero. La integral

      $$
      \int_{0}^{t}\text{sen}(t-u)\,y(u)\,du
      $$

      es $(\text{sen}\,t) * y(t)$, y la propiedad clave dice que la transformada
      de una convolución es el **producto** de las transformadas.

      **Transformando toda la ecuación:**

      $$
      Y(s) = \frac{1}{s^{2}} + \frac{1}{s^{2}+1}\,Y(s)
      $$

      Y aquí ha pasado lo importante: **la incógnita ha salido de la integral**.
      Ahora es una ecuación algebraica.

      **Despejando:**

      $$
      Y\left(1-\frac{1}{s^{2}+1}\right) = \frac{1}{s^{2}}
      \;\Longrightarrow\;
      Y\cdot\frac{s^{2}}{s^{2}+1} = \frac{1}{s^{2}}
      \;\Longrightarrow\;
      Y = \frac{s^{2}+1}{s^{4}} = \frac{1}{s^{2}}+\frac{1}{s^{4}}
      $$

      **Antitransformando**, con cuidado con los factoriales:

      $$
      \mathcal{L}^{-1}\left\{\frac{1}{s^{2}}\right\} = t,
      \qquad
      \mathcal{L}^{-1}\left\{\frac{1}{s^{4}}\right\} = \frac{t^{3}}{3!} = \frac{t^{3}}{6}
      $$

      $$
      \boxed{\;y(t) = t + \frac{t^{3}}{6}\;}
      $$

      **La comprobación**, que aquí sale barata: sustituyendo en la ecuación
      original, con $y(0)=0$, los dos lados coinciden. Y hay un control más
      rápido: en $t=0$ la integral vale 0, así que la ecuación exige $y(0)=0$.
      Nuestra solución cumple. ✓

      > **El factorial de la tabla es el error silencioso del tema.**
      > $1/s^{4}$ no es $t^{3}$: es $t^{3}/6$. Y como la forma de la respuesta
      > parece correcta, se cuela con facilidad.

  - id: retraso-en-el-tiempo
    titulo: Un retraso escondido en una exponencial
    fuente: Ejercicio 10.7a · Problemas complementarios, tema 10 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Utilizando la propiedad de traslación del tiempo, calcular la
      transformada inversa de Laplace de

      $$
      F(s) = \frac{2(s-1)\,e^{-2s}}{s^{2}-2s+2}
      $$
    pide: La función f(t), definida a trozos.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué se hace con el factor $e^{-2s}$?
        opciones:
          - texto: Se aparta; indica un retraso de 2 unidades en la respuesta
            correcta: true
            mensaje: |
              Eso es. Se antitransforma el resto como si no estuviera, y al
              final se sustituye $t$ por $t-2$ y se multiplica por el escalón.
          - texto: Se descompone en fracciones simples junto con el resto
            mensaje: |
              No es parte de la fracción: es un factor exponencial en $s$. Meterlo
              en las fracciones simples produce un sinsentido algebraico sin
              avisar, y es el error que más descoloca del tema.
          - texto: Se antitransforma como e^{-2t}
            mensaje: |
              Cuidado: $e^{-2s}$ vive en el dominio de $s$, no en el de $t$. Una
              exponencial **en $s$** significa retraso; una exponencial en $t$ es
              otra cosa.
      - tipo: calcular
        titulo: Completar el cuadrado
        pregunta: |
          El denominador $s^{2}-2s+2$ no factoriza. Escrito como
          $(s-a)^{2}+b^{2}$, ¿cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es el coeficiente del término lineal con el signo cambiado, pero
              hay que repartirlo: $s^{2}-2s = (s-1)^{2}-1$, así que $a=1$.
          - valor: '-1'
            mensaje: |
              Signo cambiado. Completando, $s^{2}-2s+2 = (s-1)^{2}+1$, con
              $a = +1$.
        pista: |
          $s^2-2s+2 = (s-1)^2 + 1$. Compara con $(s-a)^2+b^2$.
        desarrollo: |
          $$
          s^{2}-2s+2 = (s-1)^{2}+1
          \qquad\Longrightarrow\qquad
          a = 1,\; b = 1
          $$

          Con eso, $\dfrac{2(s-1)}{(s-1)^{2}+1}$ es un **coseno trasladado**:
          $2e^{t}\cos t$.
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Se aparta el factor $e^{-2s}$, que solo indica un retraso.'
          - texto: 'El resto, $\dfrac{2(s-1)}{(s-1)^{2}+1}$, es la transformada de $2e^{t}\cos t$.'
          - texto: 'El retraso convierte eso en $2e^{t-2}\cos(t-2)$, válido a partir de $t=2$.'
          - texto: 'Antes de $t=2$ la función vale 0, porque el escalón todavía no se ha encendido.'
          - texto: 'El factor $e^{-2s}$ multiplica la respuesta por $e^{-2}$.'
            trampa: true
            mensaje: |
              No es un factor multiplicativo: es un **desplazamiento**. La
              propiedad dice que $e^{-as}F(s)$ corresponde a $f(t-a)u(t-a)$, o
              sea la misma función corrida hacia la derecha, no escalada.
    resolucion: |
      **Tres piezas, y hay que separarlas antes de tocar nada.**

      **1 · El retraso.** El factor $e^{-2s}$ no entra en las fracciones
      simples. Se aparta y se recupera al final.

      **2 · Completar el cuadrado**, porque el denominador no factoriza:

      $$
      s^{2}-2s+2 = (s-1)^{2}+1
      $$

      $$
      \frac{2(s-1)}{(s-1)^{2}+1}
      \;\longrightarrow\;
      2e^{t}\cos t
      $$

      El $(s-1)$ arriba y abajo es la firma del **coseno trasladado en $s$**: la
      traslación $s\to s-1$ equivale a multiplicar por $e^{t}$.

      **3 · Aplicar el retraso.** Se sustituye $t$ por $t-2$:

      $$
      \boxed{\;
      f(t) = \begin{cases}
      0 & t < 2\\[4pt]
      2e^{t-2}\cos(t-2) & t \ge 2
      \end{cases}\;}
      $$

      > **La respuesta es una función a trozos, y hay que escribirla así.** Dar
      > solo $2e^{t-2}\cos(t-2)$ deja fuera la mitad: la función no existe antes
      > de $t=2$, y eso es justo lo que el factor exponencial estaba diciendo.

  - id: sistema-que-sale-en-espiral
    titulo: Un sistema cuya solución gira
    fuente: Ejercicio 10.10c · Problemas complementarios, tema 10 · Cálculo, UPV/EHU (2018/2019 7E)
    nivel: practica
    enunciado: |
      Utilizando la transformada de Laplace resolver el sistema

      $$
      \begin{cases}
      x' = x + 2y\\
      y' = -2x + y
      \end{cases}
      \qquad x(0)=1,\; y(0)=0
      $$
    pide: Las funciones x(t) e y(t).
    pasos:
      - tipo: reconocer
        pregunta: |
          Los coeficientes cruzados son $+2$ y $-2$, opuestos. ¿Qué suele
          anunciar eso?
        opciones:
          - texto: Que la solución llevará senos y cosenos, o sea que girará
            correcta: true
            mensaje: |
              Sí. Esa antisimetría produce raíces complejas al resolver, y las
              raíces complejas son senos y cosenos. La trayectoria en el plano
              será una espiral.
          - texto: Que el sistema no tiene solución
            mensaje: |
              La tiene, y es única con esas condiciones iniciales. Lo que
              anuncian los signos opuestos es la **forma** de la solución, no su
              existencia.
          - texto: Que las dos funciones son iguales
            mensaje: |
              Serían iguales con coeficientes simétricos y las mismas
              condiciones. Aquí las condiciones ya son distintas —$x(0)=1$ e
              $y(0)=0$— y los signos cruzados son opuestos.
      - tipo: calcular
        titulo: El valor inicial de x
        pregunta: |
          La solución resulta ser $x(t) = e^{t}\cos 2t$ e
          $y(t) = -e^{t}\,\text{sen}\,2t$. Comprobando, ¿cuánto vale $x(0)$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              0 es $y(0)$, la otra condición. En $t=0$ tanto la exponencial como
              el coseno valen 1, así que $x(0)=1$.
          - valor: '2'
            mensaje: |
              2 es el coeficiente de dentro del coseno, no el valor de la
              función. En $t=0$ el coseno vale 1.
        pista: |
          $e^{0}\cos 0 = 1\cdot 1$.
        desarrollo: |
          $$
          x(0) = e^{0}\cos 0 = 1,
          \qquad
          y(0) = e^{0}\,\text{sen}\,0 = 0
          $$

          **Las dos condiciones iniciales se cumplen.** Comprobar esto cuesta
          cinco segundos y es lo primero que hay que hacer con cualquier
          solución de un problema con condiciones iniciales.
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Transformando: $sX-1 = X+2Y$ y $sY-0 = -2X+Y$.'
          - texto: 'Reordenando queda el sistema lineal $(s-1)X - 2Y = 1$ y $2X + (s-1)Y = 0$.'
          - texto: 'Resolviéndolo, $X = \dfrac{s-1}{(s-1)^{2}+4}$ e $Y = \dfrac{-2}{(s-1)^{2}+4}$.'
          - texto: 'Antitransformando sale $x = e^{t}\cos 2t$ e $y = -e^{t}\,\text{sen}\,2t$.'
          - texto: 'Como el denominador es $(s-1)^{2}+4$, la solución decrece con el tiempo.'
            trampa: true
            mensaje: |
              El $(s-1)$ significa una traslación que produce el factor $e^{+t}$,
              que **crece**. Si decreciera sería $(s+1)$. La solución es una
              espiral que se aleja del origen, no una que se acerca.
    resolucion: |
      **Transformar las dos ecuaciones**, metiendo las condiciones iniciales:

      $$
      \begin{cases}
      sX - 1 = X + 2Y\\
      sY - 0 = -2X + Y
      \end{cases}
      \qquad\Longrightarrow\qquad
      \begin{cases}
      (s-1)X - 2Y = 1\\
      2X + (s-1)Y = 0
      \end{cases}
      $$

      **Ya no hay derivadas.** Es un sistema lineal con determinante
      $(s-1)^{2}+4$, y resolviéndolo:

      $$
      X(s) = \frac{s-1}{(s-1)^{2}+4},
      \qquad
      Y(s) = \frac{-2}{(s-1)^{2}+4}
      $$

      **Antitransformando.** El $(s-1)$ es traslación en $s$, o sea un factor
      $e^{t}$; y el 4 del denominador es $2^{2}$, o sea frecuencia 2:

      $$
      \boxed{\;x(t) = e^{t}\cos 2t,
      \qquad
      y(t) = -e^{t}\,\text{sen}\,2t\;}
      $$

      **La comprobación:** $x(0)=1$ e $y(0)=0$. ✓

      > **Cuidado con qué compruebas.** Las condiciones iniciales y la relación
      > $x^{2}+y^{2} = e^{2t}$ **se cumplen igual con $y = +e^{t}\,\text{sen}\,2t$**,
      > que es el error más fácil de cometer aquí: el menos de
      > $Y = \frac{-2}{(s-1)^{2}+4}$ se pierde al antitransformar y ninguna de
      > esas dos comprobaciones lo delata. La única que sirve es **sustituir en
      > una de las dos ecuaciones**. Con $y = -e^{t}\,\text{sen}\,2t$:
      >
      > $$
      > y' = -e^{t}\,\text{sen}\,2t - 2e^{t}\cos 2t
      > \qquad\text{y}\qquad
      > -2x + y = -2e^{t}\cos 2t - e^{t}\,\text{sen}\,2t
      > $$
      >
      > que coinciden. Con el signo positivo, no.

      > **Lo que dice la forma de la respuesta.** $x^{2}+y^{2} = e^{2t}$, así
      > que el punto $(x,y)$ gira alrededor del origen alejándose: una espiral
      > que se abre. Los signos cruzados opuestos del sistema eran la pista, y
      > reconocerlos antes de calcular te dice qué esperar.

  - id: ecuacion-integral-que-da-un-seno
    titulo: Una ecuación integral cuya solución es un seno
    fuente: Ejercicio 10.12e · Problemas complementarios, tema 10 · Cálculo, UPV/EHU (2017/2018 6E)
    nivel: practica
    enunciado: |
      Utilizando la transformada de Laplace, resolver la ecuación integral

      $$
      y(t) + \int_{0}^{t}(t-z)\,y(z)\,dz = t
      $$
    pide: La función y(t).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la transformada de la convolución $\int_0^t (t-z)\,y(z)\,dz$?
        opciones:
          - texto: El producto de la transformada de t por la de y, o sea Y/s²
            correcta: true
            mensaje: |
              Sí. La convolución de $t$ con $y$ transforma en
              $\frac{1}{s^{2}}\cdot Y(s)$. Ahí está toda la gracia: la integral
              se convierte en un producto.
          - texto: La transformada de t menos la de y
            mensaje: |
              La convolución no es una resta aunque lleve un $(t-z)$ dentro. El
              $(t-z)$ es el argumento de la primera función, no una diferencia
              de funciones.
          - texto: No tiene transformada conocida
            mensaje: |
              Sí la tiene, y es la propiedad que hace resolubles estas
              ecuaciones. Sin ella no habría forma de sacar la $y$ de dentro de
              la integral.
      - tipo: calcular
        titulo: Despejar Y
        pregunta: |
          La ecuación transformada es $Y + \frac{Y}{s^{2}} = \frac{1}{s^{2}}$.
          Despejando sale $Y = \frac{1}{s^{2}+1}$. ¿Cuánto vale $Y$ en $s=1$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.01
          formato: en forma exacta (1/2) o con un decimal
        distractores:
          - valor: '1'
            mensaje: |
              1 es el numerador. En $s=1$ el denominador vale $1+1=2$, así que
              sale $1/2$.
          - valor: '2'
            mensaje: |
              Has dado la vuelta a la fracción. Es $1/(s^{2}+1)$, no
              $(s^{2}+1)/1$.
        pista: |
          $1/(1+1)$.
        desarrollo: |
          $$
          Y\left(1+\frac{1}{s^{2}}\right) = \frac{1}{s^{2}}
          \;\Longrightarrow\;
          Y\cdot\frac{s^{2}+1}{s^{2}} = \frac{1}{s^{2}}
          \;\Longrightarrow\;
          Y = \frac{1}{s^{2}+1}
          $$

          Y esa fracción es una entrada directa de la tabla.
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La integral es la convolución de $t$ con $y$, así que transforma en $Y/s^{2}$.'
          - texto: 'La ecuación transformada queda $Y + Y/s^{2} = 1/s^{2}$.'
          - texto: 'Despejando, $Y = \dfrac{1}{s^{2}+1}$.'
          - texto: 'Esa es la transformada del seno, luego $y(t) = \text{sen}\,t$.'
          - texto: 'Como el segundo miembro era $t$, la solución también tiene que ser un polinomio.'
            trampa: true
            mensaje: |
              No hay ninguna razón para eso. La convolución mezcla la incógnita
              consigo misma a través de la integral, y el resultado puede ser de
              otra familia. Aquí un segundo miembro polinómico produce un seno —
              y comprobarlo sustituyendo lo confirma.
    resolucion: |
      **Reconocer la convolución** es todo el ejercicio. La integral

      $$
      \int_{0}^{t}(t-z)\,y(z)\,dz
      $$

      es $t * y(t)$: el argumento $(t-z)$ junto a $z$, con límites de 0 a $t$,
      es la firma.

      **Transformando**, con $\mathcal{L}\{t\} = 1/s^{2}$:

      $$
      Y(s) + \frac{1}{s^{2}}\,Y(s) = \frac{1}{s^{2}}
      $$

      **La incógnita ha salido de la integral.** Despejando:

      $$
      Y\cdot\frac{s^{2}+1}{s^{2}} = \frac{1}{s^{2}}
      \qquad\Longrightarrow\qquad
      Y(s) = \frac{1}{s^{2}+1}
      $$

      **Antitransformando**, que es una entrada de tabla:

      $$
      \boxed{\;y(t) = \text{sen}\,t\;}
      $$

      **La comprobación**, que aquí sale redonda. Sustituyendo en la ecuación
      original, $\int_0^t (t-z)\,\text{sen}\,z\,dz = t - \text{sen}\,t$, así que

      $$
      \text{sen}\,t + \bigl(t-\text{sen}\,t\bigr) = t \quad ✓
      $$

      > **Fíjate en lo que ha pasado.** Un segundo miembro polinómico —una
      > simple $t$— ha producido una solución trigonométrica. Es lo normal en
      > estas ecuaciones: la convolución realimenta la incógnita consigo misma,
      > y eso genera oscilación. Esperar que la solución «se parezca» al segundo
      > miembro es una intuición del tema 9 que aquí no vale.

  - id: la-bola-que-rueda
    titulo: La bola que rueda por la superficie
    fuente: Ejercicio 10.16 · Problemas complementarios, tema 10 · Cálculo, UPV/EHU (2023/2024 6E)
    nivel: practica
    enunciado: |
      Considerar la superficie definida por la función
      $f(x,y) = 5 - \dfrac{x^{2}}{2} - y^{2}$. Se suelta una bola en el punto
      $P\left(1,1,\frac{7}{2}\right)$ y rueda por la superficie hasta terminar
      en algún punto $S$ del plano horizontal $XY$. La bola no está sometida a
      ninguna otra fuerza más que a la de la gravedad. Se pide:

      a) Plantear la ecuación diferencial y la condición inicial que debe
      cumplir la trayectoria de la bola.
      b) Resolver dicha ecuación.
      c) Determinar el punto $S$.
    pide: La EDO de la trayectoria, su solución y el punto final.
    pasos:
      - tipo: reconocer
        pregunta: |
          «Rueda por la superficie sometida solo a la gravedad». ¿Qué dirección
          sigue su proyección en el plano $XY$?
        opciones:
          - texto: La de máxima pendiente de bajada, o sea la del gradiente cambiado de signo
            correcta: true
            mensaje: |
              Exacto. Es la primera pregunta del tema 6, aplicada: la bola baja
              por donde más pende, y esa es la dirección de $-\nabla f$.
          - texto: La tangente a la curva de nivel
            mensaje: |
              Por ahí la altura **no cambia**: la bola no bajaría nada. Sería la
              trayectoria de una bola sobre una ladera perfectamente horizontal.
          - texto: Una recta hacia el origen
            mensaje: |
              Solo si la superficie fuera simétrica en las dos variables. Aquí
              los coeficientes de $x^{2}$ y de $y^{2}$ son distintos, así que la
              bola se desvía.
      - tipo: calcular
        titulo: La constante de la trayectoria
        pregunta: |
          La EDO sale $\dfrac{dy}{dx} = \dfrac{2y}{x}$, cuya solución general es
          $y = Kx^{2}$. Con la bola soltada en $(1,1)$, ¿cuánto vale $K$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es el coeficiente que aparece en la ecuación, no la constante.
              Sustituyendo $(1,1)$ en $y=Kx^{2}$ sale $1 = K\cdot 1$.
          - valor: '3.5'
            mensaje: |
              $7/2$ es la **altura** del punto de partida, la coordenada $z$. La
              trayectoria vive en el plano $XY$ y solo usa $x$ e $y$.
        pista: |
          Sustituye x=1, y=1 en $y = Kx^2$.
        desarrollo: |
          $$
          1 = K\cdot 1^{2} \qquad\Longrightarrow\qquad K = 1
          $$

          La trayectoria en el plano es la **parábola $y = x^{2}$**.
      - tipo: calcular
        titulo: Dónde toca el suelo
        pregunta: |
          La bola para donde la superficie corta al plano $z=0$. Sustituyendo
          $y=x^{2}$ en $5 - \frac{x^{2}}{2} - y^{2} = 0$ sale $x^{2}=2$.
          ¿Cuánto vale la coordenada $y$ del punto $S$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1.4142'
            mensaje: |
              $\sqrt2$ es la coordenada $x$. La $y$ sale de la trayectoria:
              $y = x^{2} = 2$.
          - valor: '5'
            mensaje: |
              5 es la altura de la superficie en el origen, su punto más alto.
              No tiene que ver con dónde toca el suelo.
        pista: |
          $y = x^2$, y $x^2 = 2$.
        desarrollo: |
          Con $y=x^{2}$, la condición $z=0$ es

          $$
          5 - \frac{x^{2}}{2} - x^{4} = 0
          $$

          Llamando $u=x^{2}$: $u^{2} + \frac{u}{2} - 5 = 0$, cuya raíz positiva
          es $u=2$. Así que $x=\sqrt2$ e $y = x^{2} = 2$.

          $$
          S = \left(\sqrt2,\; 2,\; 0\right)
          $$
      - tipo: justificar
        pregunta: |
          Ordena la resolución completa. Una pieza es falsa.
        piezas:
          - texto: 'a) La bola sigue $-\nabla f = (x,\,2y)$, así que $\dfrac{dy}{dx} = \dfrac{2y}{x}$, con $y(1)=1$.'
          - texto: 'b) Es separable: $\dfrac{dy}{y} = \dfrac{2\,dx}{x}$, y sale $y = Kx^{2}$.'
          - texto: 'La condición inicial da $K=1$, luego la trayectoria es $y=x^{2}$.'
          - texto: 'c) Sustituyendo en $z=0$ sale $x=\sqrt2$, y por tanto $S=(\sqrt2,\,2,\,0)$.'
          - texto: 'a) La condición inicial es $z(1)=7/2$, la altura del punto de partida.'
            trampa: true
            mensaje: |
              La ecuación diferencial es de la **trayectoria en el plano $XY$**,
              así que su condición inicial relaciona $x$ con $y$: es $y(1)=1$.
              La altura $7/2$ es un dato coherente —se comprueba que $P$ está en
              la superficie— pero no es la condición de la EDO.
    resolucion: |
      **Este es el ejercicio que cruza tres temas**, y por eso cae en la
      convocatoria ordinaria y no en un parcial: ningún parcial puede pedirlo
      porque solo entran dos temas.

      **a) Plantear la EDO.** La bola baja por la dirección de máxima pendiente,
      que es $-\nabla f$ (tema 6):

      $$
      \nabla f = \left(-x,\; -2y\right)
      \qquad\Longrightarrow\qquad
      -\nabla f = (x,\; 2y)
      $$

      La trayectoria en el plano es tangente a esa dirección en cada punto, así
      que

      $$
      \frac{dy}{dx} = \frac{2y}{x},
      \qquad y(1) = 1
      $$

      **Y conviene comprobar que $P$ está en la superficie**, que es gratis:
      $f(1,1) = 5 - \frac12 - 1 = \frac72$. ✓ Coincide con la $z$ del enunciado.

      **b) Resolver** (tema 9): es separable.

      $$
      \frac{dy}{y} = \frac{2\,dx}{x}
      \;\Longrightarrow\;
      \ln|y| = 2\ln|x| + C
      \;\Longrightarrow\;
      y = Kx^{2}
      $$

      Con $y(1)=1$ sale $K=1$:

      $$
      y = x^{2}
      $$

      **c) El punto final.** La bola para al llegar al plano $z=0$. Sustituyendo
      la trayectoria en la superficie:

      $$
      5 - \frac{x^{2}}{2} - (x^{2})^{2} = 0
      \;\Longrightarrow\;
      u^{2}+\frac{u}{2}-5 = 0 \;\; (u=x^{2})
      \;\Longrightarrow\;
      u = 2
      $$

      $$
      \boxed{\;S = \left(\sqrt2,\; 2,\; 0\right)\;}
      $$

      > **La costura es lo que se evalúa.** Cada apartado por separado es un
      > ejercicio corto de un tema que ya sabes: el a) es el gradiente del tema
      > 6, el b) una separable del tema 9, y el c) sustituir. Lo difícil —y lo
      > que puntúa— es ver que el gradiente **produce** una ecuación diferencial,
      > y que su solución es una curva del plano que hay que meter otra vez en
      > la superficie.

  # ═══════════════════════════════════════════════════════════════════
  # Boletín «Transformada de Laplace. Problemas» · los siete ejercicios.
  # ═══════════════════════════════════════════════════════════════════

  - id: dos-transformadas-con-desplazamiento
    titulo: Dos transformadas que solo piden desplazar la s
    fuente: >-
      Ejercicio 1 · Boletín «Transformada de Laplace. Problemas» · Cálculo,
      UPV/EHU · Departamento de Matemática Aplicada. El boletín publica los dos
      resultados y el desarrollo está contrastado contra ellos.
    nivel: practica
    enunciado: |
      Calcular la transformada de Laplace de las siguientes funciones:

      (a) $f(t) = e^{-2t}\operatorname{sen}4t$

      (b) $f(t) = e^{-2t}\left(3\cos 6t - 5\operatorname{sen}6t\right)$
    pide: La transformada de Laplace de las dos funciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos funciones son $e^{-2t}$ por algo. ¿Qué propiedad se aplica?
        opciones:
          - texto: >-
              La traslación en $s$: si
              $\mathcal{L}\left(g\right)=G(s)$, entonces
              $\mathcal{L}\left(e^{at}g\right)=G(s-a)$
            correcta: true
            mensaje: |
              Eso es. Multiplicar por una exponencial en el tiempo es
              **desplazar** la variable $s$. Con $a=-2$, todo lo que era $s$
              pasa a ser $s+2$.
          - texto: >-
              La traslación en el tiempo, con un factor $e^{-2s}$
            mensaje: |
              Esa es la otra: se aplica cuando la función **arranca tarde**, y
              produce un $e^{-cs}$ multiplicando. Aquí la exponencial está en
              $t$, no en el argumento.
          - texto: >-
              La derivada de la transformada
            mensaje: |
              Esa propiedad la pide un factor $t$, no una exponencial.

      - tipo: calcular
        titulo: El apartado (a), evaluado
        pregunta: |
          $\mathcal{L}\left(e^{-2t}\operatorname{sen}4t\right)
          = \dfrac{4}{(s+2)^{2}+16}$. ¿Cuánto vale en $s=2$?
        respuesta:
          tipo: numero
          valor: '0.125'
          tolerancia: 0.0006
          formato: en forma exacta (1/8) o con tres decimales
        distractores:
          - valor: '0.2'
            mensaje: |
              $\tfrac{4}{20}$ sale de no desplazar: con $s^{2}+16$ en el
              denominador, en $s=2$ daría $\tfrac{4}{20}$. El desplazamiento
              convierte $s$ en $s+2$.
          - valor: '0.0625'
            mensaje: |
              $\tfrac{1}{16}$ olvida el $4$ del numerador, que es la $\omega$
              de $\operatorname{sen}\omega t$.
        pista: |
          $(2+2)^{2}+16 = 32$.
        desarrollo: |
          $$
          \mathcal{L}\left(\operatorname{sen}4t\right) = \frac{4}{s^{2}+16}
          \;\xrightarrow{\;s\to s+2\;}\;
          \frac{4}{(s+2)^{2}+16}
          $$

          $$
          \left.\right|_{s=2} = \frac{4}{16+16} = \frac18 = 0{,}125
          $$

      - tipo: calcular
        titulo: El apartado (b), evaluado
        pregunta: |
          $\mathcal{L}\left(f\right)
          = \dfrac{3(s+2)}{(s+2)^{2}+36}-\dfrac{30}{(s+2)^{2}+36}$.
          ¿Cuánto vale en $s=2$?
        respuesta:
          tipo: numero
          valor: '-0.3462'
          tolerancia: 0.0008
          formato: en forma exacta (-18/52) o con cuatro decimales
        distractores:
          - valor: '0.3462'
            mensaje: |
              El signo. $\tfrac{12}{52}-\tfrac{30}{52}$ es negativo: el término
              del seno pesa más.
          - valor: '0.2308'
            mensaje: |
              $\tfrac{12}{52}$ es solo el término del coseno. Falta restarle el
              del seno.
        pista: |
          En $s=2$, el denominador común es $(2+2)^{2}+36 = 52$ y el numerador
          del primer término es $3\cdot4=12$.
        desarrollo: |
          $$
          \frac{12}{52}-\frac{30}{52} = -\frac{18}{52}
          = -\frac{9}{26} \approx -0{,}3462
          $$

          Y el motivo de los numeradores: $\mathcal{L}(\cos6t)$ lleva $s$
          arriba —que al desplazar es $s+2$— y
          $\mathcal{L}(\operatorname{sen}6t)$ lleva el $6$, que por el $5$ del
          enunciado da $30$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              De la tabla:
              $\mathcal{L}(\operatorname{sen}\omega t)=\tfrac{\omega}{s^{2}+\omega^{2}}$
              y $\mathcal{L}(\cos\omega t)=\tfrac{s}{s^{2}+\omega^{2}}$.
          - texto: >-
              Multiplicar por $e^{at}$ desplaza: en la transformada, toda $s$
              se sustituye por $s-a$.
          - texto: >-
              Con $a=-2$, todas las $s$ pasan a ser $s+2$, **también la del
              numerador** del coseno.
          - texto: >-
              Y como la transformada es lineal, el $3$ y el $-5$ del apartado
              (b) salen fuera sin más, igual que las $s$ del denominador.
            trampa: true
            mensaje: |
              La linealidad saca las constantes, sí, pero **las $s$ del
              denominador no salen de ninguna parte**: forman parte de la
              función y hay que desplazarlas. La frase mete dos cosas
              distintas en la misma: una es cierta y la otra no significa
              nada.
        veredicto: |
          El error que más se comete aquí es desplazar el denominador y
          olvidar el numerador. En $\mathcal{L}(\cos\omega t)$ hay una $s$
          arriba, y también se convierte en $s+2$.
    resolucion: |
      **Los dos resultados.**

      $$
      \text{(a)}\quad
      \mathcal{L}\left(e^{-2t}\operatorname{sen}4t\right)
      = \frac{4}{(s+2)^{2}+16}
      $$

      $$
      \text{(b)}\quad
      \mathcal{L}\left(f\right)
      = \frac{3(s+2)}{(s+2)^{2}+36}-\frac{30}{(s+2)^{2}+36}
      $$

      ### 1 · La propiedad

      $$
      \mathcal{L}\left(e^{at}g(t)\right) = G(s-a)
      $$

      Multiplicar por una exponencial en el tiempo **traslada** la
      transformada en $s$. Con $a=-2$: todas las $s$ pasan a $s+2$.

      ### 2 · Paso a paso

      | de la tabla | al desplazar |
      |---|---|
      | $\tfrac{4}{s^{2}+16}$ | $\tfrac{4}{(s+2)^{2}+16}$ |
      | $\tfrac{s}{s^{2}+36}$ | $\tfrac{s+2}{(s+2)^{2}+36}$ |
      | $\tfrac{6}{s^{2}+36}$ | $\tfrac{6}{(s+2)^{2}+36}$ |

      Y con los coeficientes $3$ y $-5$ del enunciado:

      $$
      \frac{3(s+2)}{(s+2)^{2}+36} - \frac{5\cdot 6}{(s+2)^{2}+36}
      $$

      **Lo que hay que llevarse.** El desplazamiento alcanza a **toda** la
      expresión, numerador incluido. Y el aviso de la vuelta: cuando se
      invierte una transformada con $(s-a)^{2}+\omega^{2}$ abajo, hay que
      escribir el numerador en función de $s-a$ antes de leer la tabla.

  - id: la-transformada-de-una-funcion-que-arranca-tarde
    titulo: Una función que arranca tarde, y el factor exponencial que la delata
    fuente: >-
      Ejercicio 2 · Boletín «Transformada de Laplace. Problemas» · Cálculo,
      UPV/EHU · Departamento de Matemática Aplicada. El resultado impreso no
      lleva la s del numerador; aquí se publica el que cuadra, con el aviso
      escrito en la resolución.
    nivel: practica
    enunciado: |
      Calcular la transformada de Laplace de la función

      $$
      f(t) = \begin{cases}
      \cos\left(t-\dfrac{2\pi}{3}\right) & t>\dfrac{2\pi}{3}\\[6pt]
      0 & t<\dfrac{2\pi}{3}
      \end{cases}
      $$
    pide: La transformada de Laplace de la función.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tiene de especial que el argumento del coseno sea
          $t-\tfrac{2\pi}{3}$, el mismo desplazamiento que el del salto?
        opciones:
          - texto: >-
              Que la función es exactamente $\cos t$ **retrasada**, y eso es lo
              que pide la propiedad de traslación en el tiempo
            correcta: true
            mensaje: |
              Eso es. $f(t)=\theta(t-c)g(t-c)$ con $g=\cos$ y
              $c=\tfrac{2\pi}{3}$, y su transformada es $e^{-cs}G(s)$ sin más.
          - texto: >-
              Nada: es una casualidad
            mensaje: |
              No lo es, y si no coincidieran la propiedad no se podría aplicar
              directamente: habría que reescribir el argumento primero.
          - texto: >-
              Que la función es periódica
            mensaje: |
              El coseno lo es, pero esta función vale $0$ antes de
              $\tfrac{2\pi}{3}$: no se repite.

      - tipo: calcular
        titulo: La transformada, evaluada
        pregunta: |
          $\mathcal{L}(f) = \dfrac{s\,e^{-2\pi s/3}}{s^{2}+1}$. ¿Cuánto vale en
          $s=2$?
        respuesta:
          tipo: numero
          valor: '0.0060658'
          tolerancia: 0.00002
          formato: en forma exacta (2e^(-4pi/3)/5) o con siete decimales
        distractores:
          - valor: '0.4'
            mensaje: |
              $\tfrac{2}{5}$ es $\mathcal{L}(\cos t)$ en $s=2$ **sin** el
              retraso. El factor $e^{-2\pi s/3}$ es lo que cuesta arrancar
              tarde, y a estas alturas ya ha dividido por más de sesenta.
          - valor: '0.0030329'
            mensaje: |
              Te has dejado la $s$ del numerador —y es justo la que falta en el
              resultado impreso del boletín: ver el aviso de la resolución.
        pista: |
          $e^{-4\pi/3}\approx0{,}015165$ y $s^{2}+1=5$.
        desarrollo: |
          $$
          \mathcal{L}(f)\Big|_{s=2}
          = \frac{2\,e^{-4\pi/3}}{5}
          \approx \frac{2\cdot 0{,}015165}{5}
          \approx 0{,}0060658
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La función es $\theta\left(t-\tfrac{2\pi}{3}\right)
              \cos\left(t-\tfrac{2\pi}{3}\right)$: el escalón multiplicando a
              un coseno retrasado.
          - texto: >-
              La propiedad de traslación en el tiempo dice
              $\mathcal{L}\left(\theta(t-c)g(t-c)\right)=e^{-cs}G(s)$.
          - texto: >-
              Con $G(s)=\tfrac{s}{s^{2}+1}$… no: aquí sale
              $\tfrac{1}{s^{2}+1}$, porque el resultado publicado no lleva $s$
              arriba.
          - texto: >-
              Y eso significa que la función retrasada no es un coseno sino un
              seno.
            trampa: true
            mensaje: |
              La función **es** un coseno retrasado, y su transformada
              **debería** ser $\tfrac{s\,e^{-2\pi s/3}}{s^{2}+1}$. El resultado
              publicado, $\tfrac{e^{-2\pi s/3}}{s^{2}+1}$, corresponde a
              $\operatorname{sen}\left(t-\tfrac{2\pi}{3}\right)$
              retrasado. Es la clase de detalle que hay que comprobar
              contra la tabla en vez de copiar. Ver el aviso al final de la
              resolución.
        veredicto: |
          La traslación en el tiempo produce un factor $e^{-cs}$ **por
          delante**; la traslación en $s$, un desplazamiento **dentro**. Son
          las dos propiedades que más se confunden entre sí, y aquí se ve por
          qué: las dos hablan de «trasladar».
    resolucion: |
      **Datos.** $f$ vale $0$ hasta $t=\tfrac{2\pi}{3}$ y
      $\cos\left(t-\tfrac{2\pi}{3}\right)$ a partir de ahí.

      ### 1 · La propiedad

      $$
      \mathcal{L}\left(\theta(t-c)\,g(t-c)\right) = e^{-cs}\,G(s)
      $$

      Aquí $c=\tfrac{2\pi}{3}$ y $g=\cos$, así que

      $$
      \mathcal{L}(f) = e^{-\frac{2\pi}{3}s}\cdot\frac{s}{s^{2}+1}
      $$

      ### 2 · El aviso sobre el impreso

      El boletín publica

      $$
      \mathcal{L}(f) = \frac{e^{-\frac{2\pi}{3}s}}{s^{2}+1}
      $$

      **sin la $s$ del numerador**. Esa expresión es la transformada de
      $\operatorname{sen}\left(t-\tfrac{2\pi}{3}\right)$ retrasada, no la del
      coseno. Se comprueba en un segundo con el teorema del valor inicial:

      $$
      f\left(\tfrac{2\pi}{3}^{+}\right) = \cos 0 = 1
      $$

      y una transformada cuyo numerador no crece con $s$ corresponde a una
      función que arranca en $0$, no en $1$.

      Aquí se publica la que cuadra:

      $$
      \boxed{\ \mathcal{L}(f) = \frac{s\,e^{-\frac{2\pi}{3}s}}{s^{2}+1}\ }
      $$

      ### 3 · Las dos traslaciones, para no confundirlas

      | propiedad | qué la dispara | qué produce |
      |---|---|---|
      | traslación en $s$ | un factor $e^{at}$ | $G(s-a)$ |
      | traslación en $t$ | la función arranca en $t=c$ | $e^{-cs}G(s)$ |

      **Lo que hay que llevarse.** Cuando el argumento de la función y el
      instante del salto **coinciden**, la traslación en el tiempo se aplica
      sin tocar nada. Cuando no coinciden hay que reescribir primero, y ese es
      el caso que de verdad cae en el examen.

  - id: la-media-onda-de-seno
    titulo: La media onda de seno, dibujada y transformada
    fuente: >-
      Ejercicio 3 · Boletín «Transformada de Laplace. Problemas» · Cálculo,
      UPV/EHU · Departamento de Matemática Aplicada. El boletín no publica el
      resultado de este ejercicio; el que aparece aquí está calculado y
      comprobado sumando la serie numéricamente.
    nivel: practica
    enunciado: |
      Dibujar la función periódica de periodo $2\pi$

      $$
      f(t) = \begin{cases}
      \operatorname{sen}t & 0<t<\pi\\
      0 & \pi<t<2\pi
      \end{cases}
      $$

      y calcular su transformada de Laplace $\mathcal{L}(f(t))$.
    pide: El dibujo de la función y su transformada de Laplace.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la fórmula de la transformada de una función periódica de
          periodo $T$?
        opciones:
          - texto: >-
              $\mathcal{L}(f)=\dfrac{1}{1-e^{-Ts}}
              \displaystyle\int_0^{T}e^{-st}f(t)\,dt$
            correcta: true
            mensaje: |
              Eso es. Se integra **un solo periodo** y el factor de delante
              suma la serie geométrica de todos los demás.
          - texto: >-
              $\displaystyle\int_0^{T}e^{-st}f(t)\,dt$ a secas
            mensaje: |
              Eso es solo el primer periodo. Falta sumar los infinitos que
              vienen detrás, y esa suma es la geométrica de razón $e^{-Ts}$.
          - texto: >-
              $T\displaystyle\int_0^{T}e^{-st}f(t)\,dt$
            mensaje: |
              El periodo no multiplica: aparece dentro de la exponencial del
              denominador, porque cada repetición llega retrasada $T$.

      - tipo: dibujar
        consigna: |
          Dibuja tres periodos completos de $f$ en unos ejes $t$–$f$, con las
          escalas marcadas. El enunciado lo pide como primer apartado.
        comprueba:
          - punto: >-
              Cada periodo son **dos** tramos: un arco de seno completo entre
              $0$ y $\pi$, y luego una recta pegada al eje entre $\pi$ y
              $2\pi$.
            porque: >-
              Es lo que dice la definición, y es el error más común: dibujar
              el seno entero, con su parte negativa, en vez de cortarlo en
              $\pi$. Esta función **nunca** baja de cero.
          - punto: >-
              El arco alcanza la altura $1$ en $t=\tfrac{\pi}{2}$, y otra vez
              en $\tfrac{5\pi}{2}$ y en $\tfrac{9\pi}{2}$.
            porque: >-
              Marcar los máximos con su abscisa es lo que demuestra que has
              entendido el periodo. Si los pones cada $\pi$ en vez de cada
              $2\pi$, has dibujado $\left|\operatorname{sen}t\right|$, que es
              otra función con otra transformada.
          - punto: >-
              En $t=\pi$, $2\pi$, $3\pi$… la curva llega a cero y se queda
              plana, sin salto.
            porque: >-
              La función es continua: el seno vale $0$ en $\pi$ y el tramo
              siguiente también. Dibujar un salto ahí es afirmar algo que la
              definición no dice, y cambiaría el comportamiento de la
              transformada para $s$ grande.
        figura: >-
          Tres arcos de seno de altura $1$, en $[0,\pi]$, $[2\pi,3\pi]$ y
          $[4\pi,5\pi]$, separados por tramos planos sobre el eje.
        veredicto: |
          Es la **media onda rectificada**: lo que sale de un rectificador de
          media onda en un circuito. Por eso aparece en el tema, y por eso su
          transformada tiene nombre propio en las tablas de electrónica.

      - tipo: calcular
        titulo: La transformada, evaluada
        pregunta: |
          La transformada es
          $\mathcal{L}(f)=\dfrac{1}{\left(1-e^{-\pi s}\right)\left(s^{2}+1\right)}$.
          ¿Cuánto vale en $s=1$?
        respuesta:
          tipo: numero
          valor: '0.5226'
          tolerancia: 0.0008
          formato: con cuatro decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              $\tfrac12$ es $\mathcal{L}(\operatorname{sen}t)$ en $s=1$, o sea
              **una sola** onda. La periodicidad añade un poco más: el factor
              $\tfrac{1}{1-e^{-\pi}}\approx1{,}045$.
          - valor: '0.4784'
            mensaje: |
              Has multiplicado por $1-e^{-\pi}$ en vez de dividir. El factor de
              la periodicidad siempre **aumenta** la transformada: hay más
              función que antes.
        pista: |
          $e^{-\pi}\approx0{,}04321$, así que $1-e^{-\pi}\approx0{,}95679$, y
          $s^{2}+1=2$.
        desarrollo: |
          $$
          \mathcal{L}(f)\Big|_{s=1}
          = \frac{1}{0{,}95679\cdot 2} \approx 0{,}5226
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Para una función periódica de periodo $T$, la transformada es la
              integral sobre un periodo dividida por $1-e^{-Ts}$.
          - texto: >-
              Aquí $T=2\pi$ y la integral del periodo es
              $\displaystyle\int_0^{\pi}e^{-st}\operatorname{sen}t\,dt
              = \frac{1+e^{-\pi s}}{s^{2}+1}$.
          - texto: >-
              El factor $1+e^{-\pi s}$ se cancela con parte del
              $1-e^{-2\pi s}$, porque
              $1-e^{-2\pi s}=\left(1-e^{-\pi s}\right)\left(1+e^{-\pi s}\right)$.
          - texto: >-
              Y por eso la transformada final es la misma que la de
              $\operatorname{sen}t$, multiplicada por el periodo.
            trampa: true
            mensaje: |
              No es «multiplicada por el periodo»: es
              $\mathcal{L}(\operatorname{sen}t)$ dividida por
              $1-e^{-\pi s}$. El periodo no aparece como factor por ninguna
              parte, solo dentro de la exponencial.
        veredicto: |
          La cancelación de $1+e^{-\pi s}$ es lo bonito de este ejercicio: la
          transformada de la media onda periódica acaba siendo la del seno con
          **un solo** factor de corrección, y no dos.
    resolucion: |
      **Datos.** $f$ periódica de periodo $2\pi$, igual a
      $\operatorname{sen}t$ en $(0,\pi)$ y a $0$ en $(\pi,2\pi)$.

      ### 1 · El dibujo

      Arcos de seno de altura $1$ separados por tramos planos de longitud
      $\pi$. Es la **media onda rectificada**: la salida de un rectificador
      que deja pasar los semiciclos positivos y bloquea los negativos.

      ### 2 · La fórmula de las periódicas

      $$
      \mathcal{L}(f) = \frac{1}{1-e^{-Ts}}\int_0^{T}e^{-st}f(t)\,dt
      $$

      El factor de delante es la suma de la geométrica
      $1+e^{-Ts}+e^{-2Ts}+\dots$: cada repetición llega retrasada $T$, y la
      traslación en el tiempo la multiplica por $e^{-Ts}$.

      ### 3 · La integral del periodo

      $$
      \int_0^{\pi}e^{-st}\operatorname{sen}t\,dt
      = \left[\frac{e^{-st}\left(-s\operatorname{sen}t-\cos t\right)}
      {s^{2}+1}\right]_0^{\pi}
      = \frac{1+e^{-\pi s}}{s^{2}+1}
      $$

      ### 4 · La cancelación

      $$
      \mathcal{L}(f)
      = \frac{1}{1-e^{-2\pi s}}\cdot\frac{1+e^{-\pi s}}{s^{2}+1}
      = \frac{1+e^{-\pi s}}
      {\left(1-e^{-\pi s}\right)\left(1+e^{-\pi s}\right)\left(s^{2}+1\right)}
      $$

      $$
      \boxed{\ \mathcal{L}(f)
      = \frac{1}{\left(1-e^{-\pi s}\right)\left(s^{2}+1\right)}\ }
      $$

      ### 5 · La comprobación

      El boletín no publica el resultado de este ejercicio, así que hay que
      comprobarlo por cuenta propia. Sumando la serie numéricamente en $s=1$:

      $$
      \sum_{k\ge0} e^{-2k\pi}\int_0^{\pi}e^{-u}\operatorname{sen}u\,du
      = \frac{1}{1-e^{-2\pi}}\cdot\frac{1+e^{-\pi}}{2}
      = 0{,}5225829
      $$

      y la fórmula da $\tfrac{1}{(1-e^{-\pi})\cdot2} = 0{,}5225829$. Cuadra.

      **Lo que hay que llevarse.** En una función periódica se integra **un
      solo periodo** y el factor $\tfrac{1}{1-e^{-Ts}}$ hace el resto. Y
      cuando el periodo tiene una mitad nula, como aquí, conviene mirar si el
      $1\pm e^{-Ts/2}$ que sale de la integral se cancela con el denominador:
      casi siempre lo hace, y deja la respuesta mucho más corta.

  - id: onda-cuadrada-y-diente-de-sierra
    titulo: Onda cuadrada y diente de sierra, las dos periódicas de siempre
    fuente: >-
      Ejercicio 4 · Boletín «Transformada de Laplace. Problemas» · Cálculo,
      UPV/EHU · Departamento de Matemática Aplicada. Las dos ondas las da el
      boletín en figuras; aquí se describen con palabras, y las descripciones
      las confirman los resultados publicados.
    nivel: practica
    enunciado: |
      Calcular las transformadas de Laplace de las funciones siguientes:

      (a) **Onda cuadrada**: periódica de periodo $2$, que vale $1$ en
      $(0,1)$ y $-1$ en $(1,2)$.

      (b) **Onda diente de sierra**: periódica de periodo $1$, que vale $t$
      en $(0,1)$.
    pide: La transformada de Laplace de las dos ondas.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos son periódicas. ¿Qué las distingue a la hora de integrar el
          periodo?
        opciones:
          - texto: >-
              Que la cuadrada se integra a trozos —dos constantes— y la sierra
              pide integración por partes
            correcta: true
            mensaje: |
              Eso es. La fórmula de las periódicas es la misma; lo único que
              cambia es la integral del periodo, y en la sierra hay una $t$
              que obliga a partes.
          - texto: >-
              Que la cuadrada no es periódica
            mensaje: |
              Lo es, con periodo $2$: sube y baja indefinidamente.
          - texto: >-
              Que la sierra no tiene transformada porque es discontinua
            mensaje: |
              La discontinuidad no impide nada: la transformada es una
              integral, y una integral no se entera de un salto aislado. La
              cuadrada también es discontinua.

      - tipo: calcular
        titulo: La onda cuadrada, evaluada
        pregunta: |
          $\mathcal{L}(f) = \dfrac{1-e^{-s}}{s\left(1+e^{-s}\right)}$. ¿Cuánto
          vale en $s=1$?
        respuesta:
          tipo: numero
          valor: '0.4621'
          tolerancia: 0.0008
          formato: con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $\tfrac1s$ es la transformada de la constante $1$: la de una
              onda que **no** baja nunca. El factor
              $\tfrac{1-e^{-s}}{1+e^{-s}}$ es lo que descuenta los semiciclos
              negativos.
          - valor: '0.6321'
            mensaje: |
              $1-e^{-1}$ es solo el numerador. Falta dividir entre
              $s\left(1+e^{-s}\right)$.
        pista: |
          $e^{-1}\approx0{,}36788$, así que arriba queda $0{,}63212$ y abajo
          $1\cdot1{,}36788$.
        desarrollo: |
          $$
          \mathcal{L}(f)\Big|_{s=1}
          = \frac{1-e^{-1}}{1+e^{-1}}
          = \frac{0{,}63212}{1{,}36788} \approx 0{,}4621
          $$

          De paso, eso es $\tanh\tfrac12$: la transformada de la onda cuadrada
          es $\tfrac{1}{s}\tanh\tfrac{s}{2}$.

      - tipo: calcular
        titulo: El diente de sierra, evaluado
        pregunta: |
          $\mathcal{L}(f) = \dfrac{(s+1)e^{-s}-1}{s^{2}\left(e^{-s}-1\right)}$.
          ¿Cuánto vale en $s=1$?
        respuesta:
          tipo: numero
          valor: '0.418'
          tolerancia: 0.0008
          formato: con tres decimales
        distractores:
          - valor: '1'
            mensaje: |
              $\tfrac{1}{s^{2}}$ es la transformada de $t$ **sin** cortar: una
              rampa que sube para siempre. La sierra vuelve a cero cada
              unidad, y por eso su transformada es menor.
          - valor: '-0.418'
            mensaje: |
              El signo. Numerador y denominador son los dos negativos
              —$e^{-1}(1+1)-1 = -0{,}2642$ y $e^{-1}-1 = -0{,}6321$—, así que
              el cociente es positivo.
        pista: |
          Numerador: $2e^{-1}-1 \approx -0{,}26424$. Denominador:
          $e^{-1}-1 \approx -0{,}63212$.
        desarrollo: |
          $$
          \mathcal{L}(f)\Big|_{s=1}
          = \frac{2e^{-1}-1}{e^{-1}-1}
          = \frac{-0{,}26424}{-0{,}63212} \approx 0{,}418
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La fórmula de las periódicas es
              $\tfrac{1}{1-e^{-Ts}}\int_0^{T}e^{-st}f\,dt$, y aquí $T$ vale $2$
              y $1$ respectivamente.
          - texto: >-
              En la cuadrada, la integral del periodo es
              $\tfrac{1-2e^{-s}+e^{-2s}}{s}=\tfrac{\left(1-e^{-s}\right)^{2}}{s}$,
              un cuadrado perfecto.
          - texto: >-
              Ese cuadrado se simplifica con
              $1-e^{-2s}=\left(1-e^{-s}\right)\left(1+e^{-s}\right)$ y deja
              $\tfrac{1-e^{-s}}{s\left(1+e^{-s}\right)}$.
          - texto: >-
              Y en la sierra, como el periodo es $1$, el denominador
              $1-e^{-s}$ se cancela igual que en la cuadrada.
            trampa: true
            mensaje: |
              No se cancela: en la sierra la integral del periodo es
              $\tfrac{1-e^{-s}-se^{-s}}{s^{2}}$, que **no** tiene un factor
              $1-e^{-s}$. Por eso el resultado conserva ese denominador y es
              más feo que el de la cuadrada. Las simplificaciones no se dan
              por supuestas: se comprueban.
        veredicto: |
          La cuadrada simplifica y la sierra no, y las dos usan la misma
          fórmula. La diferencia está en si la integral del periodo comparte
          factor con $1-e^{-Ts}$ — y eso solo se sabe haciéndola.
    resolucion: |
      **Las dos ondas.**

      | onda | periodo | valor en el periodo |
      |---|---|---|
      | cuadrada | $2$ | $1$ en $(0,1)$, $-1$ en $(1,2)$ |
      | sierra | $1$ | $t$ |

      ### 1 · La onda cuadrada

      $$
      \int_0^{2}e^{-st}f\,dt
      = \int_0^{1}e^{-st}dt - \int_1^{2}e^{-st}dt
      = \frac{1-2e^{-s}+e^{-2s}}{s}
      = \frac{\left(1-e^{-s}\right)^{2}}{s}
      $$

      $$
      \mathcal{L}(f)
      = \frac{\left(1-e^{-s}\right)^{2}}
      {s\left(1-e^{-s}\right)\left(1+e^{-s}\right)}
      = \frac{1-e^{-s}}{s\left(1+e^{-s}\right)}
      = \frac{1}{s}\tanh\frac{s}{2}
      $$

      ### 2 · El diente de sierra

      $$
      \int_0^{1}te^{-st}dt
      = \left[-\frac{te^{-st}}{s}\right]_0^{1}
      + \frac1s\int_0^{1}e^{-st}dt
      = \frac{1-e^{-s}-se^{-s}}{s^{2}}
      $$

      $$
      \mathcal{L}(f) = \frac{1-e^{-s}-se^{-s}}{s^{2}\left(1-e^{-s}\right)}
      = \frac{(s+1)e^{-s}-1}{s^{2}\left(e^{-s}-1\right)}
      $$

      —la segunda forma es la del boletín, con numerador y denominador
      multiplicados por $-1$.

      ### 3 · Cómo se comprueban

      Las dos tienen un límite fácil. Cuando $s\to\infty$, $e^{-s}\to0$ y

      | onda | límite | qué significa |
      |---|---|---|
      | cuadrada | $\tfrac1s$ | para $s$ grande solo cuenta el primer tramo, que vale $1$ |
      | sierra | $\tfrac{1}{s^{2}}$ | solo cuenta la primera rampa, que es $t$ |

      Es el teorema del valor inicial en acción: para $s$ grande, la
      transformada solo ve lo que pasa cerca de $t=0$.

      **Lo que hay que llevarse.** Estas dos ondas son las que aparecen en
      todos los problemas de circuitos con señal periódica, y sus
      transformadas conviene reconocerlas. Y la comprobación de siempre: hacer
      $s\to\infty$ y ver si sale la transformada del primer tramo.

  - id: seis-transformadas-inversas
    titulo: Seis inversas, y los cuatro moldes que hay que reconocer
    fuente: >-
      Ejercicio 5 · Boletín «Transformada de Laplace. Problemas» · Cálculo,
      UPV/EHU. El resultado impreso del apartado (f) repite el del (c); aquí
      se publica el que cuadra, con el aviso escrito en la resolución y
      confirmado por el 10.5(b) de los problemas complementarios.
    nivel: practica
    enunciado: |
      Calcular las siguientes transformadas:

      (a) $\mathcal{L}^{-1}\left(\dfrac{3s+1}{(s-1)(s^{2}+1)}\right)$
      &nbsp;&nbsp;&nbsp;
      (b) $\mathcal{L}^{-1}\left(\dfrac{2s^{2}-4}{(s+1)(s-2)(s-3)}\right)$

      (c) $\mathcal{L}^{-1}\left(\dfrac{2s+2}{s^{2}+2s+5}\right)$
      &nbsp;&nbsp;&nbsp;
      (d) $\mathcal{L}^{-1}\left(\dfrac{2s+1}{s^{2}-2s+2}\right)$

      (e) $\mathcal{L}^{-1}\left(\dfrac{2(s-1)e^{-2s}}{s^{2}-2s+2}\right)$
      &nbsp;&nbsp;&nbsp;
      (f) $\mathcal{L}^{-1}\left(\dfrac{4}{(s-1)^{3}}\right)$
    pide: La antitransformada de las seis funciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los apartados (c), (d) y (e) tienen un trinomio de segundo grado
          abajo que **no** se factoriza. ¿Qué hay que hacer?
        opciones:
          - texto: >-
              Completar cuadrados: $s^{2}+2s+5=(s+1)^{2}+4$, y escribir el
              numerador en función de $s+1$
            correcta: true
            mensaje: |
              Eso es, y el segundo paso es el que se olvida: no basta con
              completar el cuadrado abajo, hay que **reescribir el numerador**
              en función de $s+1$ para poder leer la tabla.
          - texto: >-
              Fracciones simples con raíces complejas
            mensaje: |
              Se puede, pero acaba en exponenciales complejas que hay que
              volver a juntar en senos y cosenos. Completar cuadrados llega
              antes.
          - texto: >-
              Dividir el numerador entre el denominador
            mensaje: |
              El numerador es de grado menor, así que la división no hace
              nada.

      - tipo: calcular
        titulo: El valor inicial del apartado (b)
        pregunta: |
          $f(t)=-\tfrac16 e^{-t}-\tfrac43 e^{2t}+\tfrac72 e^{3t}$. ¿Cuánto
          vale $f(0)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '0'
            mensaje: |
              Suma otra vez: $-\tfrac16-\tfrac43+\tfrac72
              = \tfrac{-1-8+21}{6} = 2$.
          - valor: '5'
            mensaje: |
              Has sumado los tres sin sus signos. Dos de los tres restan.
        pista: |
          Pon todo sobre $6$: $\tfrac{-1-8+21}{6}$.
        desarrollo: |
          $$
          f(0) = -\frac16-\frac43+\frac72 = \frac{-1-8+21}{6} = 2
          $$

          Y eso **es** la comprobación del ejercicio: por el teorema del valor
          inicial,

          $$
          f(0) = \lim_{s\to\infty} s\,F(s)
          = \lim_{s\to\infty}\frac{2s^{3}-4s}{s^{3}+\dots} = 2
          $$

          Los dos caminos dan $2$: las fracciones simples están bien.

      - tipo: calcular
        titulo: El apartado (f), evaluado
        pregunta: |
          $\mathcal{L}^{-1}\left(\tfrac{4}{(s-1)^{3}}\right) = 2t^{2}e^{t}$.
          ¿Cuánto vale en $t=1$?
        respuesta:
          tipo: numero
          valor: '5.4366'
          tolerancia: 0.006
          formato: en forma exacta (2e) o con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es el coeficiente. Falta el $t^{2}e^{t}$, que en $t=1$ vale
              $e$.
          - valor: '2.7183'
            mensaje: |
              $e$ es $t^{2}e^{t}$ en $t=1$. Falta el $2$ de delante, que sale
              de $\tfrac{4}{2!}$.
        pista: |
          $\mathcal{L}\left(t^{n}e^{at}\right)=\dfrac{n!}{(s-a)^{n+1}}$, así
          que $\tfrac{4}{(s-1)^{3}} = \tfrac{4}{2!}\cdot\tfrac{2!}{(s-1)^{3}}$.
        desarrollo: |
          $$
          \mathcal{L}\left(t^{2}e^{t}\right) = \frac{2}{(s-1)^{3}}
          \;\Longrightarrow\;
          \mathcal{L}^{-1}\left(\frac{4}{(s-1)^{3}}\right) = 2t^{2}e^{t}
          $$

          En $t=1$: $2e\approx5{,}4366$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con raíces reales distintas —(a) y (b)— se hacen fracciones
              simples y cada trozo es una exponencial o un seno.
          - texto: >-
              Con un trinomio irreducible —(c) y (d)— se completa el cuadrado y
              se reescribe el numerador en función de $s-a$.
          - texto: >-
              Con un factor $e^{-cs}$ —(e)— se antitransforma lo demás y se
              retrasa el resultado $c$ unidades, poniendo $0$ antes.
          - texto: >-
              Y con una potencia $(s-a)^{n}$ —(f)— sale $t^{n}e^{at}$
              directamente, sin más constantes.
            trampa: true
            mensaje: |
              Hay un factorial de por medio:
              $\mathcal{L}\left(t^{n}e^{at}\right)=\tfrac{n!}{(s-a)^{n+1}}$.
              Con $n=2$ el numerador de la tabla es $2$, no $1$, y por eso
              $\tfrac{4}{(s-1)^{3}}$ da $2t^{2}e^{t}$ y no $4t^{2}e^{t}$.
        veredicto: |
          Cuatro moldes cubren los seis apartados: fracciones simples,
          completar cuadrados, retraso y potencia. Clasificar la expresión
          antes de tocarla es lo que decide el camino, y se hace mirando el
          **denominador**.
    resolucion: |
      **Los seis resultados.**

      | apartado | molde | resultado |
      |---|---|---|
      | (a) | fracciones simples | $2e^{t}-2\cos t+\operatorname{sen}t$ |
      | (b) | fracciones simples | $-\tfrac16e^{-t}-\tfrac43e^{2t}+\tfrac72e^{3t}$ |
      | (c) | completar cuadrados | $2e^{-t}\cos 2t$ |
      | (d) | completar cuadrados | $2e^{t}\cos t+3e^{t}\operatorname{sen}t$ |
      | (e) | retraso | $0$ si $t<2$; $2e^{t-2}\cos(t-2)$ si $t>2$ |
      | (f) | potencia | $2t^{2}e^{t}$ |

      ### 1 · Completar cuadrados, paso a paso en (d)

      $$
      \frac{2s+1}{s^{2}-2s+2} = \frac{2s+1}{(s-1)^{2}+1}
      $$

      Ahora el numerador, en función de $s-1$:

      $$
      2s+1 = 2(s-1)+3
      $$

      $$
      \frac{2(s-1)}{(s-1)^{2}+1} + \frac{3}{(s-1)^{2}+1}
      \;\longrightarrow\;
      2e^{t}\cos t + 3e^{t}\operatorname{sen}t
      $$

      **El paso que se olvida es el segundo**: sin reescribir el numerador, la
      tabla no se puede leer.

      ### 2 · El aviso sobre el impreso

      El boletín publica para (f) el mismo resultado que para (c),
      $2e^{-t}\cos2t$. No puede ser: $\tfrac{4}{(s-1)^{3}}$ no tiene ningún
      $s^{2}+4$ por ninguna parte, y su antitransformada sale de la fórmula de
      la potencia:

      $$
      \mathcal{L}\left(t^{2}e^{t}\right)=\frac{2!}{(s-1)^{3}}
      \;\Longrightarrow\;
      \mathcal{L}^{-1}\left(\frac{4}{(s-1)^{3}}\right) = 2t^{2}e^{t}
      $$

      Y hay confirmación independiente: **el mismo problema es el 10.5(b) de
      los problemas complementarios**, y allí se publica $2t^{2}e^{t}$.

      ### 3 · La comprobación que sirve para los seis

      El teorema del valor inicial, $f(0^{+})=\lim_{s\to\infty}sF(s)$:

      | apartado | $\lim sF(s)$ | $f(0)$ |
      |---|---|---|
      | (a) | $0$ | $2-2+0=0$ ✓ |
      | (b) | $2$ | $-\tfrac16-\tfrac43+\tfrac72=2$ ✓ |
      | (c) | $2$ | $2$ ✓ |
      | (d) | $2$ | $2$ ✓ |
      | (f) | $0$ | $0$ ✓ |

      Y para el impreso de (f), $2e^{-t}\cos2t$, daría $f(0)=2$ frente al
      $\lim sF(s)=0$ de $\tfrac{4}{(s-1)^{3}}$: **no cuadra**. Esa es la
      comprobación que caza la errata en diez segundos.

      **Lo que hay que llevarse.** El teorema del valor inicial es el
      contraste gratis de todo el tema: multiplicar la transformada por $s$,
      hacer $s\to\infty$, y comparar con el valor en $0$ de la respuesta. Si
      no coincide, la antitransformada está mal.

  - id: dos-identidades-por-convolucion
    titulo: Dos identidades que hay que demostrar por convolución
    fuente: >-
      Ejercicio 6 · Boletín «Transformada de Laplace. Problemas» · Cálculo,
      UPV/EHU · Departamento de Matemática Aplicada. Las dos identidades están
      comprobadas también por fracciones simples.
    nivel: practica
    enunciado: |
      Utilizando la propiedad de convolución demostrar las siguientes
      igualdades:

      (a) $\mathcal{L}^{-1}\left(\dfrac{s}{\left(s^{2}+a^{2}\right)^{2}}\right)
      = \dfrac{t\operatorname{sen}at}{2a}$

      (b) $\mathcal{L}^{-1}\left(\dfrac{1}{s^{2}(s+1)^{2}}\right)
      = te^{-t}+2e^{-t}+t-2$
    pide: Las dos demostraciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dice la propiedad de convolución?
        opciones:
          - texto: >-
              Que $\mathcal{L}^{-1}\left(F\cdot G\right)
              = \displaystyle\int_0^{t}f(u)g(t-u)\,du$: el **producto** de
              transformadas es la convolución de las funciones
            correcta: true
            mensaje: |
              Eso es, y es lo que hace útil este ejercicio: un denominador al
              cuadrado es un producto de dos factores iguales, y por eso la
              convolución lo ataca directamente.
          - texto: >-
              Que $\mathcal{L}(fg) = F\cdot G$
            mensaje: |
              Justo lo contrario de lo que pasa: la transformada de un
              **producto** no es el producto de las transformadas. Esa es la
              razón de que exista la convolución.
          - texto: >-
              Que $\mathcal{L}^{-1}(F+G)=f+g$
            mensaje: |
              Eso es la linealidad, que también vale, pero no ayuda con un
              denominador al cuadrado.

      - tipo: redactar
        consigna: |
          Escribe en papel la demostración del apartado (a): separa la
          expresión como producto de dos transformadas conocidas, monta la
          integral de convolución, y resuélvela con la fórmula del producto de
          senos y cosenos.
        rubrica:
          - punto: >-
              La separación explícita:
              $\dfrac{s}{\left(s^{2}+a^{2}\right)^{2}}
              = \dfrac{s}{s^{2}+a^{2}}\cdot\dfrac{1}{s^{2}+a^{2}}$, y qué
              función es cada factor.
            porque: >-
              Es la decisión del ejercicio, y hay más de una forma de
              repartir: también valdría $\tfrac{1}{s^{2}+a^{2}}$ por
              $\tfrac{s}{s^{2}+a^{2}}$ al revés, o meter el $a$ de otra manera.
              Sin decir cuál eliges, la integral que escribes después no se
              puede seguir.
          - punto: >-
              La integral montada con los argumentos bien:
              $\displaystyle\int_0^{t}\cos(au)\cdot
              \frac{\operatorname{sen}\left(a(t-u)\right)}{a}\,du$.
            porque: >-
              El $t-u$ es donde se equivoca casi todo el mundo. Y el
              $\tfrac1a$ también: $\mathcal{L}^{-1}\left(\tfrac{1}{s^{2}+a^{2}}
              \right)$ es $\tfrac{\operatorname{sen}at}{a}$, no
              $\operatorname{sen}at$.
          - punto: >-
              La transformación del producto en suma:
              $\operatorname{sen}A\cos B
              = \tfrac12\left[\operatorname{sen}(A+B)+\operatorname{sen}(A-B)\right]$.
            porque: >-
              Es lo que hace la integral posible. Y de paso explica de dónde
              sale el $t$ del resultado: el término
              $\operatorname{sen}(at)$ no depende de $u$, así que al integrar
              en $[0,t]$ se multiplica por $t$.
          - punto: >-
              Una frase final diciendo que el otro sumando se anula, y por
              qué.
            porque: >-
              $\int_0^{t}\operatorname{sen}\left(a(t-2u)\right)du = 0$ por
              simetría respecto de $u=\tfrac{t}{2}$. Sin esa frase, la
              demostración deja un término suelto y parece que se ha perdido
              por el camino.
        veredicto: |
          El $t$ que multiplica al seno en el resultado no sale de ninguna
          integración por partes: sale de que uno de los dos sumandos de la
          fórmula del producto **no depende de $u$**. Ver eso es entender el
          ejercicio.

      - tipo: calcular
        titulo: La identidad (a), comprobada en un punto
        pregunta: |
          Con $a=2$ y $t=1$, ¿cuánto vale $\dfrac{t\operatorname{sen}at}{2a}$?
        respuesta:
          tipo: numero
          valor: '0.2273'
          tolerancia: 0.0006
          formato: en forma exacta (sen(2)/4) o con cuatro decimales
        distractores:
          - valor: '0.4546'
            mensaje: |
              $\tfrac{\operatorname{sen}2}{2}$ olvida uno de los dos factores
              del $2a=4$.
          - valor: '0.1137'
            mensaje: |
              $\tfrac{\operatorname{sen}2}{8}$ divide de más: $2a$ con $a=2$ es
              $4$, no $8$.
        pista: |
          $\operatorname{sen}2 \approx 0{,}9093$ y $2a=4$.
        desarrollo: |
          $$
          \frac{1\cdot\operatorname{sen}2}{4} = \frac{0{,}90930}{4}
          \approx 0{,}2273
          $$

      - tipo: calcular
        titulo: La identidad (b), comprobada en un punto
        pregunta: |
          En $t=1$, ¿cuánto vale $te^{-t}+2e^{-t}+t-2$?
        respuesta:
          tipo: numero
          valor: '0.1036'
          tolerancia: 0.0006
          formato: en forma exacta (3/e - 1) o con cuatro decimales
        distractores:
          - valor: '-0.1036'
            mensaje: |
              El signo. $3e^{-1}\approx1{,}1036$, y al restarle $1$ queda
              positivo.
          - valor: '1.1036'
            mensaje: |
              $3e^{-1}$ es solo la parte exponencial. Falta el $t-2$, que en
              $t=1$ vale $-1$.
        pista: |
          En $t=1$ los dos primeros términos suman $3e^{-1}$, y los dos
          últimos, $-1$.
        desarrollo: |
          $$
          e^{-1}+2e^{-1}+1-2 = 3e^{-1}-1 \approx 1{,}1036-1 = 0{,}1036
          $$

          Y la comprobación estructural: en $t=0$ la expresión vale
          $0+2+0-2=0$, que es lo que exige
          $\lim_{s\to\infty}s\cdot\tfrac{1}{s^{2}(s+1)^{2}} = 0$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Un denominador **al cuadrado** es un producto de dos factores
              iguales, y eso es la señal de que la convolución ataca
              directamente.
          - texto: >-
              En (a), los dos factores son $\tfrac{s}{s^{2}+a^{2}}$ y
              $\tfrac{1}{s^{2}+a^{2}}$, o sea $\cos at$ y
              $\tfrac{\operatorname{sen}at}{a}$.
          - texto: >-
              La fórmula del producto de seno por coseno parte la integral en
              dos, y uno de los sumandos no depende de $u$: de ahí sale el
              $t$ que multiplica.
          - texto: >-
              Y como la convolución es la única forma de invertir un producto,
              el apartado (b) no se puede hacer por fracciones simples.
            trampa: true
            mensaje: |
              Sí se puede, y de hecho es más rápido:
              $\tfrac{1}{s^{2}(s+1)^{2}}
              = -\tfrac2s+\tfrac{1}{s^{2}}+\tfrac{2}{s+1}+\tfrac{1}{(s+1)^{2}}$,
              que da la identidad directamente. La convolución es
              **imprescindible** cuando el denominador no se factoriza en
              polinomios o cuando la ecuación viene ya como integral, no
              aquí.
        veredicto: |
          El enunciado dice «utilizando la propiedad de convolución» porque
          está entrenando esa herramienta, no porque sea la única. Y eso es
          bueno: se puede contrastar el resultado por el otro camino.
    resolucion: |
      ### 1 · La propiedad

      $$
      \mathcal{L}^{-1}\left(F(s)G(s)\right)
      = \left(f * g\right)(t) = \int_0^{t} f(u)\,g(t-u)\,du
      $$

      Un denominador **al cuadrado** es un producto de dos factores iguales:
      esa es la señal de que toca convolución.

      ### 2 · El apartado (a)

      $$
      \frac{s}{\left(s^{2}+a^{2}\right)^{2}}
      = \underbrace{\frac{s}{s^{2}+a^{2}}}_{\cos at}
      \cdot\underbrace{\frac{1}{s^{2}+a^{2}}}_{\operatorname{sen}at/a}
      $$

      $$
      \left(f*g\right)(t)
      = \frac1a\int_0^{t}\cos(au)\operatorname{sen}\left(a(t-u)\right)du
      $$

      Con
      $\operatorname{sen}A\cos B=\tfrac12\left[\operatorname{sen}(A+B)
      +\operatorname{sen}(A-B)\right]$:

      $$
      = \frac{1}{2a}\int_0^{t}\left[\operatorname{sen}(at)
      + \operatorname{sen}\left(a(t-2u)\right)\right]du
      $$

      El primer sumando no depende de $u$ y da $t\operatorname{sen}(at)$; el
      segundo se anula por simetría respecto de $u=\tfrac{t}{2}$.

      $$
      \boxed{\ \frac{t\operatorname{sen}at}{2a}\ }
      $$

      ### 3 · El apartado (b), por los dos caminos

      **Por convolución**, con $f=t$ y $g=te^{-t}$:

      $$
      \int_0^{t} u\,(t-u)e^{-(t-u)}du
      $$

      **Por fracciones simples**, que es la comprobación:

      $$
      \frac{1}{s^{2}(s+1)^{2}}
      = -\frac{2}{s}+\frac{1}{s^{2}}+\frac{2}{s+1}+\frac{1}{(s+1)^{2}}
      $$

      $$
      \longrightarrow\; -2+t+2e^{-t}+te^{-t}
      $$

      que es la identidad del enunciado.

      ### 4 · Por qué merece la pena saber los dos caminos

      | método | cuándo conviene |
      |---|---|
      | fracciones simples | siempre que el denominador se factorice en polinomios |
      | convolución | cuando uno de los factores no es racional, o cuando la ecuación viene ya como integral |

      En este ejercicio los dos funcionan, y por eso es un buen sitio para
      practicar el que menos se usa.

      **Lo que hay que llevarse.** La convolución es la única herramienta
      cuando aparece una **ecuación integral** —el ejercicio 10.12 del boletín
      complementario está lleno de ellas— y ahí no hay fracciones simples que
      valgan. Practicarla aquí, donde se puede contrastar, es lo que la deja
      lista para cuando no haya alternativa.

  - id: tres-problemas-con-laplace
    titulo: Una EDO y dos sistemas, resueltos con la transformada
    fuente: >-
      Ejercicio 7 · Boletín «Transformada de Laplace. Problemas» · Cálculo,
      UPV/EHU. Los resultados impresos de (b) y (c) están intercambiados, y el
      de (b) además con los exponentes cambiados de signo; aquí se publican los
      que cuadran, con el aviso en la resolución y confirmados por el 10.10(d)
      de los problemas complementarios.
    nivel: practica
    enunciado: |
      Resolver los siguientes problemas utilizando la transformada de Laplace:

      (a) $\begin{cases} y''+2y'+4y=0\\ y(0)=1,\; y'(0)=1\end{cases}$

      (b) $\begin{cases} x'=2x+y\\ y'=3x+4y\\ x(0)=1,\; y(0)=0\end{cases}$

      (c) $\begin{cases} x'-x-y=0\\ y'-2x=0\\ x(0)=0,\; y(0)=1\end{cases}$
    pide: La solución de la EDO y de los dos sistemas.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace la transformada con un sistema de dos EDOs?
        opciones:
          - texto: >-
              Lo convierte en un **sistema lineal de dos ecuaciones** con
              incógnitas $X(s)$ e $Y(s)$, que se resuelve como cualquier otro
            correcta: true
            mensaje: |
              Eso es, y ahí está la gracia: las derivadas desaparecen y queda
              álgebra. Después hay que antitransformar las dos soluciones, que
              es la parte con trabajo.
          - texto: >-
              Lo desacopla en dos EDOs independientes
            mensaje: |
              No las desacopla: el sistema algebraico sigue estando acoplado.
              Lo que hace es cambiar derivadas por multiplicaciones.
          - texto: >-
              Lo reduce a una EDO de segundo orden
            mensaje: |
              Ese es el método clásico de sustitución, sin Laplace. Con
              Laplace se va directo al sistema algebraico.

      - tipo: calcular
        titulo: El coeficiente del seno en (a)
        pregunta: |
          La solución de (a) es
          $y = e^{-t}\cos\sqrt3\,t + C\,e^{-t}\operatorname{sen}\sqrt3\,t$.
          ¿Cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '1.1547'
          tolerancia: 0.002
          formato: en forma exacta (2/sqrt(3)) o con cuatro decimales
        distractores:
          - valor: '0.5774'
            mensaje: |
              $\tfrac{1}{\sqrt3}$ olvida el $2$. De $y'(0)=1$ sale
              $-1+\sqrt3\,C=1$, o sea $C=\tfrac{2}{\sqrt3}$.
          - valor: '1.7321'
            mensaje: |
              $\sqrt3$ es la frecuencia, no el coeficiente. El coeficiente sale
              de imponer $y'(0)=1$.
        pista: |
          Deriva $y$ y evalúa en $t=0$: de los cuatro términos que salen, solo
          sobreviven el $-1$ del coseno y el $\sqrt3\,C$ del seno. Queda
          $y'(0)=-1+\sqrt3\,C$.
        desarrollo: |
          $$
          y'(0) = -1 + \sqrt3\,C = 1
          \;\Longrightarrow\;
          C = \frac{2}{\sqrt3} \approx 1{,}1547
          $$

      - tipo: calcular
        titulo: El autovalor mayor del sistema (b)
        pregunta: |
          Transformando el sistema (b), el denominador común de $X(s)$ e
          $Y(s)$ es $s^{2}-6s+5$. ¿Cuál es su raíz mayor?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es la otra raíz, la menor. Las dos aparecen en la solución,
              como $e^{t}$ y $e^{5t}$.
          - valor: '6'
            mensaje: |
              $6$ es la **suma** de las dos raíces, que es el coeficiente
              cambiado de signo. El producto es $5$.
        pista: |
          $s^{2}-6s+5=(s-1)(s-5)$.
        desarrollo: |
          $$
          s^{2}-6s+5 = (s-1)(s-5) = 0
          \;\Longrightarrow\;
          s = 1,\ 5
          $$

          Y por eso la solución lleva $e^{t}$ y $e^{5t}$:

          $$
          x(t) = \frac{3e^{t}}{4}+\frac{e^{5t}}{4},
          \qquad
          y(t) = -\frac{3e^{t}}{4}+\frac{3e^{5t}}{4}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Al transformar, $\mathcal{L}(x')=sX(s)-x(0)$: las condiciones
              iniciales entran solas, sin tener que imponerlas al final.
          - texto: >-
              El sistema queda algebraico, y su determinante es el polinomio
              característico de la matriz.
          - texto: >-
              En (b) ese polinomio es $s^{2}-6s+5$, con raíces $1$ y $5$; en
              (c) es $s^{2}-s-2$, con raíces $2$ y $-1$.
          - texto: >-
              Y por eso las dos soluciones se pueden comprobar mirando solo si
              cumplen las condiciones iniciales.
            trampa: true
            mensaje: |
              Las condiciones iniciales son **necesarias pero no
              suficientes**: hay infinitas funciones que valen $1$ y $0$ en
              $t=0$. Hay que comprobar también las ecuaciones. Y eso es
              justamente lo que caza la errata del boletín: la solución que
              publica para (b) cumple las condiciones iniciales de (c) pero no
              su sistema.
        veredicto: |
          La ventaja de Laplace en un sistema es que las condiciones iniciales
          entran al principio, no al final. La desventaja es que hay que
          antitransformar dos funciones en vez de una — y ahí es donde está
          todo el trabajo.
    resolucion: |
      **Los tres resultados.**

      | apartado | solución |
      |---|---|
      | (a) | $y = e^{-t}\cos\sqrt3\,t + \tfrac{2}{\sqrt3}e^{-t}\operatorname{sen}\sqrt3\,t$ |
      | (b) | $x = \tfrac34 e^{t}+\tfrac14 e^{5t}$, &nbsp; $y = -\tfrac34 e^{t}+\tfrac34 e^{5t}$ |
      | (c) | $x = \tfrac13 e^{2t}-\tfrac13 e^{-t}$, &nbsp; $y = \tfrac13 e^{2t}+\tfrac23 e^{-t}$ |

      ### 1 · El método, en (a)

      $$
      \left(s^{2}Y - s\,y(0) - y'(0)\right)
      + 2\left(sY - y(0)\right) + 4Y = 0
      $$

      $$
      Y\left(s^{2}+2s+4\right) = s+3
      \;\Longrightarrow\;
      Y = \frac{s+3}{(s+1)^{2}+3}
      $$

      Reescribiendo el numerador en función de $s+1$:

      $$
      Y = \frac{(s+1)}{(s+1)^{2}+3} + \frac{2}{(s+1)^{2}+3}
      $$

      $$
      y = e^{-t}\cos\sqrt3\,t + \frac{2}{\sqrt3}e^{-t}\operatorname{sen}\sqrt3\,t
      $$

      ### 2 · Los sistemas

      Transformando (b):

      $$
      \begin{cases}
      sX-1 = 2X+Y\\
      sY = 3X+4Y
      \end{cases}
      \;\Longrightarrow\;
      \begin{cases}
      (s-2)X - Y = 1\\
      -3X + (s-4)Y = 0
      \end{cases}
      $$

      con determinante $(s-2)(s-4)-3 = s^{2}-6s+5 = (s-1)(s-5)$.

      $$
      X = \frac{s-4}{(s-1)(s-5)},
      \qquad
      Y = \frac{3}{(s-1)(s-5)}
      $$

      y por fracciones simples salen los $\tfrac34$ y $\tfrac14$.

      ### 3 · El aviso sobre el impreso

      El boletín publica

      $$
      \text{(b)}\;
      \begin{cases}
      x = -\tfrac13 e^{-2t}+\tfrac13 e^{t}\\
      y = \tfrac13 e^{-2t}+\tfrac23 e^{t}
      \end{cases}
      \qquad
      \text{(c)}\;
      \begin{cases}
      x = \tfrac34 e^{t}+\tfrac14 e^{5t}\\
      y = -\tfrac34 e^{t}+\tfrac34 e^{5t}
      \end{cases}
      $$

      **Están intercambiadas**, y se ve en un segundo: la de (b) da
      $x(0)=0$, y el sistema (b) exige $x(0)=1$. La que el boletín pone en
      (c) es la que cumple $x(0)=1$.

      Y la que aparece bajo (b) **tampoco es exactamente la de (c)**: tiene
      los exponentes cambiados de signo. El sistema (c) tiene polinomio
      característico $s^{2}-s-2$, con raíces $2$ y $-1$, así que la solución
      lleva $e^{2t}$ y $e^{-t}$, no $e^{-2t}$ y $e^{t}$. Sustituyendo se
      comprueba: con la del boletín, $x'\ne x+y$.

      Confirmación independiente: **el sistema (b) es el 10.10(d) de los
      problemas complementarios**, y allí se publica
      $x=\tfrac34 e^{t}+\tfrac14 e^{5t}$,
      $y=-\tfrac34 e^{t}+\tfrac34 e^{5t}$ — la misma que aquí.

      ### 4 · La comprobación que hay que hacer siempre

      | qué comprobar | en (b) |
      |---|---|
      | condiciones iniciales | $x(0)=\tfrac34+\tfrac14=1$ ✓, $y(0)=-\tfrac34+\tfrac34=0$ ✓ |
      | la primera ecuación | $x' = \tfrac34 e^{t}+\tfrac54 e^{5t}$ y $2x+y = \tfrac64 e^{t}-\tfrac34 e^{t}+\tfrac24 e^{5t}+\tfrac34 e^{5t}$ ✓ |

      **Lo que hay que llevarse.** Comprobar las condiciones iniciales cuesta
      cinco segundos y **no basta**: hay que sustituir también en las
      ecuaciones. Las dos comprobaciones juntas son lo que ha detectado que las
      soluciones publicadas de (b) y (c) estaban cambiadas de sitio.

  # ═══════════════════════════════════════════════════════════════════
  # Problemas complementarios del tema 10. Los que ya estaban —10.7(a),
  # 10.10(a), 10.10(c), 10.12(d), 10.12(e) y 10.16— no se repiten, y el
  # 10.4 es el mismo ejercicio que el 4 del boletín básico.
