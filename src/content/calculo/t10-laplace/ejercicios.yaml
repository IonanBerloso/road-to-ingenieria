  - id: seis-transformadas-por-definicion
    titulo: Las seis de la tabla, deducidas de la definición
    fuente: Ejercicio 10.1 · Problemas complementarios, tema 10 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular, utilizando la definición de la transformada de Laplace, las
      transformadas de las siguientes funciones ($a\in\mathbb{R}$):

      (a) $y(t)=a$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (c) $y(t)=t$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (e) $y(t)=\operatorname{sen}at$

      (b) $y(t)=e^{at}$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (d) $y(t)=t^{2}$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (f) $y(t)=\cos at$
    pide: Las seis transformadas, calculadas desde la definición.
    pasos:
      - tipo: reconocer
        pregunta: |
          $\mathcal{L}(y)=\displaystyle\int_0^{\infty}e^{-st}y(t)\,dt$. ¿Qué
          hace falta para que esa integral converja en el apartado (b)?
        opciones:
          - texto: >-
              Que $s>a$: el integrando es $e^{(a-s)t}$, y una exponencial solo
              converge en $[0,\infty)$ si su exponente es negativo
            correcta: true
            mensaje: |
              Eso es. Toda transformada tiene un **dominio de convergencia**, y
              en los ejercicios se da por supuesto —pero forma parte de la
              respuesta cuando se calcula desde la definición.
          - texto: >-
              Que $a>0$
            mensaje: |
              El signo de $a$ solo no decide nada: lo que importa es
              $a-s$. Con $a=5$ y $s=10$ converge; con $a=-1$ y $s=-2$, no.
          - texto: >-
              Nada: la integral siempre converge
            mensaje: |
              Con $s\le a$ el integrando no tiende a cero y la integral
              diverge. La transformada existe solo para $s$ suficientemente
              grande.

      - tipo: calcular
        titulo: El apartado (d), evaluado
        pregunta: |
          $\mathcal{L}\left(t^{2}\right) = \dfrac{2}{s^{3}}$. ¿Cuánto vale en
          $s=2$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.002
          formato: en forma exacta (1/4) o con dos decimales
        distractores:
          - valor: '0.125'
            mensaje: |
              $\tfrac18$ olvida el $2$ del numerador, que es el $2!$ de la
              fórmula general $\mathcal{L}(t^{n})=\tfrac{n!}{s^{n+1}}$.
          - valor: '0.5'
            mensaje: |
              $\tfrac{2}{s^{2}}$ deja el exponente en $2$. Para $t^{n}$ el
              denominador es $s^{n+1}$: aquí, $s^{3}$.
        pista: |
          $2^{3}=8$.
        desarrollo: |
          $$
          \mathcal{L}\left(t^{2}\right)\Big|_{s=2} = \frac{2}{8} = \frac14
          $$

      - tipo: calcular
        titulo: El apartado (e), evaluado
        pregunta: |
          $\mathcal{L}\left(\operatorname{sen}at\right)
          = \dfrac{a}{s^{2}+a^{2}}$. Con $a=3$, ¿cuánto vale en $s=1$?
        respuesta:
          tipo: numero
          valor: '0.3'
          tolerancia: 0.002
          formato: en forma exacta (3/10) o con un decimal
        distractores:
          - valor: '0.1'
            mensaje: |
              $\tfrac{1}{10}$ pone $s$ arriba: esa es la del **coseno**. La del
              seno lleva la $a$.
          - valor: '0.9'
            mensaje: |
              $\tfrac{9}{10}$ pone $a^{2}$ arriba. El numerador es $a$, sin
              elevar.
        pista: |
          $s^{2}+a^{2} = 1+9 = 10$.
        desarrollo: |
          $$
          \frac{3}{1+9} = \frac{3}{10} = 0{,}3
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La constante y la exponencial salen directas de la definición;
              $t$ y $t^{2}$, integrando por partes una y dos veces.
          - texto: >-
              El seno y el coseno se pueden hacer a la vez integrando
              $e^{-st}e^{iat}$ y separando parte real e imaginaria.
          - texto: >-
              Todas las transformadas tienen un semiplano de convergencia:
              $s>0$ para las cuatro primeras, $s>a$ para $e^{at}$.
          - texto: >-
              Y como toda función tiene transformada, cualquier $y(t)$ se puede
              transformar y luego antitransformar.
            trampa: true
            mensaje: |
              No toda función la tiene. $e^{t^{2}}$, por ejemplo, crece más
              deprisa que cualquier $e^{st}$ y su integral diverge para todo
              $s$. La transformada existe para funciones de **orden
              exponencial**, y ese es el requisito que se da por supuesto en
              todo el tema.
        veredicto: |
          Estas seis son las que hay que saber de memoria, y calcularlas una
          vez desde la definición es lo que hace que no se olviden. Los
          factoriales de $t^{n}$ y el reparto de $s$ y $a$ entre seno y coseno
          son los dos detalles que más se confunden.
    resolucion: |
      **Las seis.**

      | $y(t)$ | $Y(s)$ | convergencia |
      |---|---|---|
      | $a$ | $\tfrac{a}{s}$ | $s>0$ |
      | $e^{at}$ | $\tfrac{1}{s-a}$ | $s>a$ |
      | $t$ | $\tfrac{1}{s^{2}}$ | $s>0$ |
      | $t^{2}$ | $\tfrac{2}{s^{3}}$ | $s>0$ |
      | $\operatorname{sen}at$ | $\tfrac{a}{s^{2}+a^{2}}$ | $s>0$ |
      | $\cos at$ | $\tfrac{s}{s^{2}+a^{2}}$ | $s>0$ |

      ### 1 · Las dos inmediatas

      $$
      \mathcal{L}(a) = a\int_0^{\infty}e^{-st}dt
      = a\left[\frac{-e^{-st}}{s}\right]_0^{\infty} = \frac{a}{s}
      $$

      $$
      \mathcal{L}\left(e^{at}\right) = \int_0^{\infty}e^{(a-s)t}dt
      = \frac{1}{s-a} \quad (s>a)
      $$

      ### 2 · Las potencias, por partes

      $$
      \mathcal{L}(t) = \left[\frac{-te^{-st}}{s}\right]_0^{\infty}
      + \frac1s\int_0^{\infty}e^{-st}dt = \frac{1}{s^{2}}
      $$

      Repitiendo, $\mathcal{L}(t^{2})=\tfrac{2}{s^{3}}$, y en general

      $$
      \mathcal{L}\left(t^{n}\right) = \frac{n!}{s^{n+1}}
      $$

      ### 3 · Seno y coseno, de una vez

      $$
      \int_0^{\infty}e^{-st}e^{iat}dt = \frac{1}{s-ia}
      = \frac{s+ia}{s^{2}+a^{2}}
      $$

      La parte real es $\mathcal{L}(\cos at)$ y la imaginaria,
      $\mathcal{L}(\operatorname{sen}at)$. Sale más rápido que integrar dos
      veces por partes, y de paso explica por qué el coseno lleva $s$ arriba y
      el seno lleva $a$.

      **Lo que hay que llevarse.** Estas seis son el punto de partida de toda
      la tabla, y las demás salen de ellas por las propiedades. Y el detalle
      que se da por supuesto luego: **la transformada solo existe en un
      semiplano**, y eso es lo que hace que la antitransformada esté bien
      definida.

  - id: cuatro-a-trozos-por-definicion
    titulo: Cuatro funciones a trozos, integrando tramo a tramo
    fuente: Ejercicio 10.2 · Problemas complementarios, tema 10 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular, utilizando la definición de la transformada de Laplace, las
      transformadas de las siguientes funciones definidas a trozos:

      (a) $f(t)=\begin{cases}1 & t\in[0,1]\\ e^{t} & t\in(1,\infty)\end{cases}$
      &nbsp;&nbsp;&nbsp;
      (c) $f(t)=\begin{cases}t & t\in[0,2)\\ 1 & t\in[2,\infty)\end{cases}$

      (b) $f(t)=\begin{cases}t & t\in[0,1]\\ 0 & t\in(1,\infty)\end{cases}$
      &nbsp;&nbsp;&nbsp;
      (d) $f(t)=\begin{cases}0 & t\in[0,1)\\ 1 & t\in[1,2)\\ 0 & t\in[2,\infty)\end{cases}$
    pide: Las cuatro transformadas, calculadas desde la definición.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se parte la integral de la definición cuando la función va a
          trozos?
        opciones:
          - texto: >-
              En tantas integrales como tramos, cada una con sus límites y su
              fórmula
            correcta: true
            mensaje: |
              Eso es. La definición es una integral de $0$ a $\infty$, y una
              integral se parte por donde haga falta. En (d), dos de los tres
              tramos valen $0$ y desaparecen.
          - texto: >-
              Se toma el trozo más grande
            mensaje: |
              Todos los trozos contribuyen. En (a), el tramo infinito aporta
              casi todo, pero el primero también cuenta.
          - texto: >-
              Se usa la función escalón y no hace falta partir
            mensaje: |
              Con el escalón se puede, y es más elegante, pero el enunciado
              pide hacerlo **desde la definición**: partir la integral.

      - tipo: calcular
        titulo: El apartado (d), evaluado
        pregunta: |
          $\mathcal{L}(f)=\dfrac{e^{-s}-e^{-2s}}{s}$. ¿Cuánto vale en $s=1$?
        respuesta:
          tipo: numero
          valor: '0.2325'
          tolerancia: 0.0006
          formato: en forma exacta (1/e - 1/e²) o con cuatro decimales
        distractores:
          - valor: '0.3679'
            mensaje: |
              $e^{-1}$ solo. Hay que restarle $e^{-2}$: el pulso acaba en
              $t=2$, y esa resta es lo que lo apaga.
          - valor: '0.5032'
            mensaje: |
              Has sumado en vez de restar. El tramo que vale $1$ va de $1$ a
              $2$: la integral es $\int_1^{2}$, o sea la primitiva en $2$
              menos la primitiva en $1$.
        pista: |
          $e^{-1}\approx0{,}36788$ y $e^{-2}\approx0{,}13534$.
        desarrollo: |
          $$
          \mathcal{L}(f) = \int_1^{2}e^{-st}dt
          = \left[\frac{-e^{-st}}{s}\right]_1^{2}
          = \frac{e^{-s}-e^{-2s}}{s}
          $$

          En $s=1$: $0{,}36788-0{,}13534 = 0{,}23254$.

      - tipo: calcular
        titulo: El apartado (a), evaluado
        pregunta: |
          $\mathcal{L}(f)=\dfrac{1-e^{-s}}{s}+\dfrac{e^{1-s}}{s-1}$. ¿Cuánto
          vale en $s=2$?
        respuesta:
          tipo: numero
          valor: '0.8002'
          tolerancia: 0.0008
          formato: con cuatro decimales
        distractores:
          - valor: '0.4323'
            mensaje: |
              Ese es solo el primer tramo, el de la constante $1$. Falta el
              segundo, que es el que dura hasta el infinito.
          - valor: '0.3679'
            mensaje: |
              Ese es solo el segundo tramo, $\tfrac{e^{1-s}}{s-1}$ con $s=2$.
              Falta el primero.
        pista: |
          Primer término: $\tfrac{1-e^{-2}}{2}$. Segundo:
          $\tfrac{e^{-1}}{1}$.
        desarrollo: |
          $$
          \frac{1-e^{-2}}{2} + \frac{e^{-1}}{1}
          = 0{,}43233 + 0{,}36788 = 0{,}80021
          $$

          Y el segundo término solo converge si $s>1$: para $s\le1$ el
          integrando $e^{(1-s)t}$ no se apaga.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La definición es una integral de $0$ a $\infty$, y se parte por
              los puntos donde cambia la fórmula.
          - texto: >-
              Los tramos que valen $0$ no aportan nada, así que en (b) y en
              (d) solo hay una integral de verdad.
          - texto: >-
              El tramo infinito de (a) obliga a $s>1$ para converger; los
              demás convergen para $s>0$.
          - texto: >-
              Y como todas las funciones son discontinuas, sus transformadas
              también lo son.
            trampa: true
            mensaje: |
              Las transformadas son funciones **analíticas** de $s$ en su
              semiplano de convergencia, por discontinua que sea la función de
              partida. La integral suaviza: un salto en $f$ ni siquiera se ve
              en $F$.
        veredicto: |
          Lo único específico aquí es partir bien y llevar los límites a la
          vez. Y el detalle que conviene anotar: cuando un tramo llega al
          infinito, la convergencia impone una condición sobre $s$.
    resolucion: |
      **Las cuatro transformadas.**

      | apartado | $\mathcal{L}(f)$ |
      |---|---|
      | (a) | $\dfrac{1-e^{-s}}{s}+\dfrac{e^{1-s}}{s-1}$ &nbsp;$(s>1)$ |
      | (b) | $\dfrac{1-e^{-s}-se^{-s}}{s^{2}}$ |
      | (c) | $\dfrac{1-e^{-2s}-se^{-2s}}{s^{2}}$ |
      | (d) | $\dfrac{e^{-s}-e^{-2s}}{s}$ |

      ### 1 · El método

      $$
      \mathcal{L}(f) = \int_0^{c_1}e^{-st}f_1 + \int_{c_1}^{c_2}e^{-st}f_2
      + \dots
      $$

      ### 2 · El apartado (b), paso a paso

      $$
      \int_0^{1}te^{-st}dt
      = \left[\frac{-te^{-st}}{s}\right]_0^{1} + \frac1s\int_0^{1}e^{-st}dt
      = \frac{-e^{-s}}{s} + \frac{1-e^{-s}}{s^{2}}
      $$

      $$
      = \frac{1-e^{-s}-se^{-s}}{s^{2}}
      $$

      ### 3 · Por qué (b) y (c) se parecen tanto

      Los dos integran $t$ sobre un intervalo y después algo constante. En
      (b) esa constante es $0$ y no aporta; en (c) es $1$ y aporta
      $\tfrac{e^{-2s}}{s}$, que se combina con el resto. Las dos transformadas
      tienen la misma forma con $1$ y $2$ intercambiados:

      $$
      \text{(b)}\;\frac{1-e^{-s}-se^{-s}}{s^{2}},
      \qquad
      \text{(c)}\;\frac{1-e^{-2s}-se^{-2s}}{s^{2}}
      $$

      ### 4 · La comprobación

      Teorema del valor inicial, $f(0^{+})=\lim_{s\to\infty}sF(s)$:

      | apartado | $\lim sF(s)$ | $f(0^{+})$ |
      |---|---|---|
      | (a) | $1$ | $1$ ✓ |
      | (b) | $0$ | $0$ ✓ |
      | (c) | $0$ | $0$ ✓ |
      | (d) | $0$ | $0$ ✓ |

      **Lo que hay que llevarse.** Partir la integral es todo el método, y lo
      único que hay que cuidar son los límites. Y una vez hecho esto desde la
      definición, lo suyo es hacerlo otra vez con la función escalón: es más
      corto y es lo que se usa en el resto del tema.

  - id: siete-transformadas-por-propiedades
    titulo: Siete transformadas, una por propiedad
    fuente: >-
      Ejercicio 10.3 · Problemas complementarios, tema 10 · Cálculo, UPV/EHU.
      El apartado (e) es de la convocatoria 2019/2020 7E.
    nivel: practica
    enunciado: |
      Utilizando las propiedades de la transformada de Laplace calcular las
      transformadas de las siguientes funciones:

      (a) $f(t)=te^{t}$
      &nbsp;&nbsp;&nbsp;
      (e) $f(t)=\begin{cases}0 & t<2\\ \cos(t-2) & t\ge2\end{cases}$

      (b) $f(t)=e^{-2t}\operatorname{sen}3t$
      &nbsp;&nbsp;&nbsp;
      (f) $f(t)=\begin{cases}0 & t<2\\ (t-2)^{2} & t\ge2\end{cases}$

      (c) $f(t)=te^{t}\operatorname{sen}t$
      &nbsp;&nbsp;&nbsp;
      (g) $f(t)=\displaystyle\int_0^{t}\operatorname{sen}4z\,dz$

      (d) $f(t)=t^{2}\cos t$
    pide: Las siete transformadas.
    pasos:
      - tipo: reconocer
        pregunta: |
          Cada apartado usa una propiedad distinta. ¿Cuál corresponde a (d),
          $t^{2}\cos t$?
        opciones:
          - texto: >-
              La derivada de la transformada:
              $\mathcal{L}\left(t^{n}f\right)=(-1)^{n}F^{(n)}(s)$
            correcta: true
            mensaje: |
              Eso es. Multiplicar por $t$ en el tiempo es **derivar** en $s$,
              con un signo menos. Con $t^{2}$ hay que derivar dos veces y los
              dos signos se cancelan.
          - texto: >-
              La traslación en $s$
            mensaje: |
              Esa la pide una exponencial multiplicando, como en (a), (b) y
              (c). Aquí lo que multiplica es una potencia de $t$.
          - texto: >-
              La transformada de la derivada
            mensaje: |
              Esa se usa cuando aparece $f'$, y es la que hace útil el método
              para resolver EDOs. Aquí no hay ninguna derivada de $f$.

      - tipo: calcular
        titulo: El apartado (d), evaluado
        pregunta: |
          $\mathcal{L}\left(t^{2}\cos t\right)
          = \dfrac{2s\left(s^{2}-3\right)}{\left(s^{2}+1\right)^{3}}$. ¿Cuánto
          vale en $s=1$?
        respuesta:
          tipo: numero
          valor: '-0.5'
          tolerancia: 0.004
          formato: en forma exacta (-1/2) o con un decimal
        distractores:
          - valor: '0.5'
            mensaje: |
              El signo. En $s=1$, $s^{2}-3 = -2$: el paréntesis es negativo.
          - valor: '-0.25'
            mensaje: |
              $\left(s^{2}+1\right)^{3}$ con $s=1$ vale $2^{3}=8$, no $16$.
        pista: |
          Numerador: $2\cdot1\cdot(1-3) = -4$. Denominador: $2^{3}=8$.
        desarrollo: |
          $$
          \frac{2\cdot1\cdot\left(1-3\right)}{\left(1+1\right)^{3}}
          = \frac{-4}{8} = -\frac12
          $$

      - tipo: calcular
        titulo: El apartado (g), evaluado
        pregunta: |
          $\mathcal{L}\left(\displaystyle\int_0^{t}\operatorname{sen}4z\,dz\right)
          = \dfrac{4}{s\left(s^{2}+16\right)}$. ¿Cuánto vale en $s=1$?
        respuesta:
          tipo: numero
          valor: '0.2353'
          tolerancia: 0.0006
          formato: en forma exacta (4/17) o con cuatro decimales
        distractores:
          - valor: '0.0588'
            mensaje: |
              $\tfrac{1}{17}$ olvida el $4$ del numerador, que es la $\omega$
              del seno.
          - valor: '4'
            mensaje: |
              Te has dejado el denominador entero. En $s=1$ vale
              $1\cdot17=17$.
        pista: |
          $s\left(s^{2}+16\right)$ con $s=1$ vale $17$.
        desarrollo: |
          $$
          \frac{4}{1\cdot 17} = \frac{4}{17} \approx 0{,}2353
          $$

          La propiedad es
          $\mathcal{L}\left(\int_0^{t}f\right)=\tfrac{F(s)}{s}$: **integrar en
          el tiempo es dividir por $s$**, la inversa de que derivar sea
          multiplicar.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Multiplicar por $e^{at}$ traslada en $s$: (a), (b) y (c).
          - texto: >-
              Multiplicar por $t^{n}$ deriva $n$ veces en $s$, con signo
              $(-1)^{n}$: (c) y (d).
          - texto: >-
              Que la función arranque en $t=c$ produce un factor $e^{-cs}$:
              (e) y (f).
          - texto: >-
              E integrar en el tiempo multiplica por $s$: (g).
            trampa: true
            mensaje: |
              **Divide** por $s$. Derivar multiplica y integrar divide, que es
              lo coherente con que sean operaciones inversas. Con el resultado
              publicado se ve: $\tfrac{4}{s^{2}+16}$ pasa a
              $\tfrac{4}{s\left(s^{2}+16\right)}$.
        veredicto: |
          Las cuatro propiedades cubren los siete apartados, y el apartado (c)
          usa dos a la vez: primero $t\operatorname{sen}t$ derivando, y luego
          el $e^{t}$ desplazando. **El orden da igual**, pero conviene hacer
          primero la derivada y desplazar al final.
    resolucion: |
      **Las siete.**

      | apartado | propiedad | resultado |
      |---|---|---|
      | (a) | traslación en $s$ | $\dfrac{1}{(s-1)^{2}}$ |
      | (b) | traslación en $s$ | $\dfrac{3}{(s+2)^{2}+9}$ |
      | (c) | derivada en $s$ + traslación | $\dfrac{2(s-1)}{\left(s^{2}-2s+2\right)^{2}}$ |
      | (d) | derivada en $s$, dos veces | $\dfrac{2s\left(s^{2}-3\right)}{\left(s^{2}+1\right)^{3}}$ |
      | (e) | traslación en $t$ | $\dfrac{s\,e^{-2s}}{s^{2}+1}$ |
      | (f) | traslación en $t$ | $\dfrac{2e^{-2s}}{s^{3}}$ |
      | (g) | integral en $t$ | $\dfrac{4}{s\left(s^{2}+16\right)}$ |

      ### 1 · Las cuatro propiedades, en una tabla

      | en el tiempo | en $s$ |
      |---|---|
      | $e^{at}f(t)$ | $F(s-a)$ |
      | $t^{n}f(t)$ | $(-1)^{n}F^{(n)}(s)$ |
      | $\theta(t-c)f(t-c)$ | $e^{-cs}F(s)$ |
      | $\displaystyle\int_0^{t}f$ | $\dfrac{F(s)}{s}$ |

      ### 2 · El apartado (c), que usa dos

      Primero la derivada:
      $\mathcal{L}\left(t\operatorname{sen}t\right)
      = -\dfrac{d}{ds}\dfrac{1}{s^{2}+1} = \dfrac{2s}{\left(s^{2}+1\right)^{2}}$.

      Después el desplazamiento $s\to s-1$:

      $$
      \frac{2(s-1)}{\left((s-1)^{2}+1\right)^{2}}
      = \frac{2(s-1)}{\left(s^{2}-2s+2\right)^{2}}
      $$

      ### 3 · El apartado (d), derivando dos veces

      $$
      F = \frac{s}{s^{2}+1},
      \qquad
      F' = \frac{1-s^{2}}{\left(s^{2}+1\right)^{2}},
      \qquad
      F'' = \frac{2s\left(s^{2}-3\right)}{\left(s^{2}+1\right)^{3}}
      $$

      y como $n=2$, el signo $(-1)^{2}$ es $+1$.

      ### 4 · El apartado (e), que confirma algo

      Este es el mismo tipo que el ejercicio 2 del boletín básico, con
      $c=2$ en vez de $\tfrac{2\pi}{3}$. Y aquí el resultado publicado **sí**
      lleva la $s$ del numerador:

      $$
      \mathcal{L}(f) = \frac{s\,e^{-2s}}{s^{2}+1}
      $$

      que es lo que confirma que al del boletín básico le falta.

      **Lo que hay que llevarse.** Cuatro propiedades y siete ejercicios: la
      destreza es **clasificar antes de calcular**. Mirar qué multiplica a qué
      —una exponencial, una potencia, un escalón— decide la propiedad en dos
      segundos.

  - id: seis-inversas-del-complementario
    titulo: Seis inversas más, y la que se hace de memoria
    fuente: >-
      Ejercicio 10.5 · Problemas complementarios, tema 10 · Cálculo, UPV/EHU.
      Los apartados (b), (e) y (f) son los mismos que el 5 (f), (c) y (d) del
      boletín básico.
    nivel: practica
    enunciado: |
      Calcular la transformada inversa de Laplace de las funciones siguientes:

      (a) $F(s)=\dfrac{3}{s^{2}+4}$
      &nbsp;&nbsp;&nbsp;
      (c) $F(s)=\dfrac{2}{s^{2}+3s-4}$
      &nbsp;&nbsp;&nbsp;
      (e) $F(s)=\dfrac{2s+2}{s^{2}+2s+5}$

      (b) $F(s)=\dfrac{4}{(s-1)^{3}}$
      &nbsp;&nbsp;&nbsp;
      (d) $F(s)=\dfrac{3s}{s^{2}-s-6}$
      &nbsp;&nbsp;&nbsp;
      (f) $F(s)=\dfrac{2s+1}{s^{2}-2s+2}$
    pide: La antitransformada de las seis funciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          Ante $F(s)=\dfrac{2}{s^{2}+3s-4}$, ¿qué es lo primero?
        opciones:
          - texto: >-
              Mirar si el denominador **factoriza**: $s^{2}+3s-4=(s+4)(s-1)$,
              y entonces van fracciones simples
            correcta: true
            mensaje: |
              Eso es. El discriminante decide todo el camino: si es positivo,
              fracciones simples; si es negativo, completar cuadrados.
          - texto: >-
              Completar cuadrados
            mensaje: |
              Solo si no factoriza. Aquí $\Delta = 9+16 = 25 > 0$: hay dos
              raíces reales y las fracciones simples llegan antes.
          - texto: >-
              Buscarlo en la tabla tal cual
            mensaje: |
              Con un denominador de segundo grado hay que decidir primero de
              cuál de las dos familias es. La tabla no tiene una entrada
              directa para $\tfrac{2}{s^{2}+3s-4}$.

      - tipo: calcular
        titulo: El valor inicial del apartado (d)
        pregunta: |
          $f(t)=\tfrac95 e^{3t}+\tfrac65 e^{-2t}$. ¿Cuánto vale $f(0)$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '1.8'
            mensaje: |
              $\tfrac95$ es solo el primer término. Hay dos, y en $t=0$ los dos
              valen su coeficiente.
          - valor: '0.6'
            mensaje: |
              $\tfrac95-\tfrac65$ resta los dos. Los dos son positivos y se
              suman.
        pista: |
          $\tfrac95+\tfrac65 = \tfrac{15}{5}$.
        desarrollo: |
          $$
          f(0) = \frac95+\frac65 = 3
          $$

          Y esa **es** la comprobación: por el teorema del valor inicial,

          $$
          \lim_{s\to\infty} s\cdot\frac{3s}{s^{2}-s-6} = 3
          $$

          Los dos caminos dan $3$: las fracciones simples están bien.

      - tipo: calcular
        titulo: El apartado (c), evaluado
        pregunta: |
          $f(t)=\tfrac25 e^{t}-\tfrac25 e^{-4t}$. ¿Cuánto vale en $t=1$?
        respuesta:
          tipo: numero
          valor: '1.08'
          tolerancia: 0.003
          formato: con dos decimales
        distractores:
          - valor: '1.0873'
            mensaje: |
              Te has dejado el $-\tfrac25 e^{-4}$, que vale $-0{,}0073$. Es
              pequeño pero no es cero.
          - valor: '-1.08'
            mensaje: |
              El signo. El término positivo es $\tfrac25 e^{t}$, que en $t=1$
              vale $1{,}087$, y el negativo es mucho menor.
        pista: |
          $e^{1}\approx2{,}71828$ y $e^{-4}\approx0{,}01832$.
        desarrollo: |
          $$
          \frac25\left(e - e^{-4}\right)
          = 0{,}4\cdot\left(2{,}71828 - 0{,}01832\right)
          = 0{,}4\cdot2{,}69996 \approx 1{,}08
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El discriminante del denominador decide el camino: positivo,
              fracciones simples; negativo, completar cuadrados.
          - texto: >-
              Con una potencia $(s-a)^{n}$ se usa
              $\mathcal{L}\left(t^{n-1}e^{at}\right)=\tfrac{(n-1)!}{(s-a)^{n}}$,
              que en (b) da $2t^{2}e^{t}$.
          - texto: >-
              En (e) y (f) hay que reescribir el numerador en función de
              $s-a$ después de completar cuadrados.
          - texto: >-
              Y en (a), como el denominador es $s^{2}+4$, la antitransformada
              es $3\operatorname{sen}2t$.
            trampa: true
            mensaje: |
              Falta dividir entre $2$. La tabla dice
              $\mathcal{L}\left(\operatorname{sen}\omega t\right)
              =\tfrac{\omega}{s^{2}+\omega^{2}}$: el numerador tiene que ser
              $\omega=2$, así que
              $\tfrac{3}{s^{2}+4} = \tfrac32\cdot\tfrac{2}{s^{2}+4}$ y la
              respuesta es $\tfrac32\operatorname{sen}2t$.
        veredicto: |
          El error más repetido de todo el tema es ese: olvidar que el
          numerador de la tabla para el seno **es la frecuencia**, no un $1$.
          Si el numerador que tienes no es $\omega$, hay que ajustarlo
          multiplicando y dividiendo.
    resolucion: |
      **Los seis resultados.**

      | apartado | camino | resultado |
      |---|---|---|
      | (a) | tabla, ajustando el numerador | $\tfrac32\operatorname{sen}2t$ |
      | (b) | potencia | $2t^{2}e^{t}$ |
      | (c) | fracciones simples | $\tfrac25 e^{t}-\tfrac25 e^{-4t}$ |
      | (d) | fracciones simples | $\tfrac95 e^{3t}+\tfrac65 e^{-2t}$ |
      | (e) | completar cuadrados | $2e^{-t}\cos 2t$ |
      | (f) | completar cuadrados | $2e^{t}\cos t+3e^{t}\operatorname{sen}t$ |

      ### 1 · El árbol de decisión

      Mirando **el denominador**:

      | qué es | qué hacer |
      |---|---|
      | $s^{2}+\omega^{2}$ | tabla, ajustando el numerador |
      | $(s-a)^{n}$ | fórmula de la potencia, con $(n-1)!$ |
      | grado 2 con $\Delta>0$ | fracciones simples |
      | grado 2 con $\Delta<0$ | completar cuadrados |

      ### 2 · Las dos fracciones simples

      **(c)** $s^{2}+3s-4=(s+4)(s-1)$:

      $$
      \frac{2}{(s+4)(s-1)} = \frac{A}{s+4}+\frac{B}{s-1},
      \qquad A = \frac{2}{-5},\; B = \frac{2}{5}
      $$

      **(d)** $s^{2}-s-6=(s-3)(s+2)$, y evaluando el numerador en cada raíz:

      $$
      A = \frac{3\cdot3}{5} = \frac95,
      \qquad
      B = \frac{3\cdot(-2)}{-5} = \frac65
      $$

      ### 3 · La comprobación de siempre

      | apartado | $\lim_{s\to\infty}sF(s)$ | $f(0)$ |
      |---|---|---|
      | (a) | $0$ | $0$ ✓ |
      | (b) | $0$ | $0$ ✓ |
      | (c) | $0$ | $\tfrac25-\tfrac25=0$ ✓ |
      | (d) | $3$ | $\tfrac95+\tfrac65=3$ ✓ |
      | (e) | $2$ | $2$ ✓ |
      | (f) | $2$ | $2$ ✓ |

      **Lo que hay que llevarse.** El denominador decide el camino y el
      numerador decide las constantes. Y el teorema del valor inicial comprueba
      las dos cosas de golpe: si $f(0)$ no coincide con $\lim sF(s)$, algo está
      mal antes.

  - id: una-inversa-por-tres-caminos-y-un-retraso
    titulo: Una inversa por tres caminos, y un retraso que sale seno hiperbólico
    fuente: >-
      Ejercicios 10.6 y 10.7(b) · Problemas complementarios, tema 10 ·
      Cálculo, UPV/EHU. El 10.6 es de la convocatoria 2012/2013 7E, y el
      10.7(a) ya estaba en el sitio.
    nivel: practica
    enunciado: |
      **10.6** Calcular de dos formas distintas
      $\mathcal{L}^{-1}\left[\dfrac{1}{(s+1)^{2}}\right]$.

      **10.7(b)** Utilizando la propiedad de traslación del tiempo, calcular
      la transformada inversa de Laplace de
      $F(s)=\dfrac{2e^{-s}}{s^{2}-4}$.
    pide: La antitransformada de las dos funciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuáles son los tres caminos para invertir
          $\dfrac{1}{(s+1)^{2}}$?
        opciones:
          - texto: >-
              La fórmula de la potencia, la traslación en $s$ aplicada a
              $\tfrac{1}{s^{2}}$, y la convolución de
              $\tfrac{1}{s+1}$ consigo misma
            correcta: true
            mensaje: |
              Los tres dan $te^{-t}$, y por eso el enunciado pide «de dos
              formas distintas»: es un ejercicio para comprobar que las
              propiedades son coherentes entre sí.
          - texto: >-
              Fracciones simples, tabla y derivada
            mensaje: |
              Las fracciones simples no ayudan: $(s+1)^{2}$ ya está
              factorizado, y descomponerlo devolvería lo mismo.
          - texto: >-
              Solo hay uno
            mensaje: |
              El enunciado pide **dos**, y hay al menos tres. Que un resultado
              se pueda obtener por varios caminos es lo que permite
              comprobarlo.

      - tipo: calcular
        titulo: La inversa del 10.6, evaluada
        pregunta: |
          $\mathcal{L}^{-1}\left[\tfrac{1}{(s+1)^{2}}\right] = te^{-t}$.
          ¿Cuánto vale en $t=1$?
        respuesta:
          tipo: numero
          valor: '0.3679'
          tolerancia: 0.0006
          formato: en forma exacta (1/e) o con cuatro decimales
        distractores:
          - valor: '2.7183'
            mensaje: |
              $e$ es $te^{t}$, con el signo del exponente cambiado. El
              denominador es $(s+1)^{2}$, o sea $a=-1$.
          - valor: '1'
            mensaje: |
              $1$ es solo la $t$. Falta la exponencial.
        pista: |
          $1\cdot e^{-1}$.
        desarrollo: |
          $$
          te^{-t}\Big|_{t=1} = e^{-1} \approx 0{,}3679
          $$

      - tipo: calcular
        titulo: La inversa del 10.7(b), evaluada
        pregunta: |
          $\mathcal{L}^{-1}(F) = \operatorname{senh}\left[2(t-1)\right]$ para
          $t\ge1$, y $0$ antes. ¿Cuánto vale en $t=2$?
        respuesta:
          tipo: numero
          valor: '3.6269'
          tolerancia: 0.004
          formato: en forma exacta (senh(2)) o con cuatro decimales
        distractores:
          - valor: '0'
            mensaje: |
              $0$ es el valor **antes** de $t=1$. En $t=2$ ya ha arrancado, y
              hace una unidad de tiempo.
          - valor: '7.2537'
            mensaje: |
              $e^{2}-e^{-2}$ es $2\operatorname{senh}2$: falta dividir entre
              $2$. El $2$ del numerador de $F$ es justo el que hace que la
              respuesta sea el seno hiperbólico sin coeficiente.
        pista: |
          $\operatorname{senh}2 = \tfrac{e^{2}-e^{-2}}{2}$, con
          $e^{2}\approx7{,}389$ y $e^{-2}\approx0{,}135$.
        desarrollo: |
          $$
          \operatorname{senh}2 = \frac{7{,}38906-0{,}13534}{2}
          \approx 3{,}6269
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $\tfrac{2}{s^{2}-4}$ es la transformada de
              $\operatorname{senh}2t$, porque
              $\mathcal{L}\left(\operatorname{senh}\omega t\right)
              = \tfrac{\omega}{s^{2}-\omega^{2}}$.
          - texto: >-
              El factor $e^{-s}$ retrasa la función una unidad y la pone a
              cero antes: $\theta(t-1)\operatorname{senh}\left[2(t-1)\right]$.
          - texto: >-
              El signo menos del denominador es lo que distingue el seno
              hiperbólico del trigonométrico.
          - texto: >-
              Y como el retraso no cambia la forma de la función, tampoco
              cambia su valor en cualquier instante.
            trampa: true
            mensaje: |
              Cambia el valor en todos los instantes: la función retrasada vale
              en $t$ lo que la original valía en $t-1$, y **cero** antes de
              $t=1$. Lo que no cambia es la forma de la gráfica, que es otra
              cosa.
        veredicto: |
          Dos cosas de tabla que conviene no confundir: $s^{2}+\omega^{2}$ da
          seno y coseno, y $s^{2}-\omega^{2}$ da los hiperbólicos. Un signo, y
          cambia la familia entera.
    resolucion: |
      ### 1 · El 10.6, por los tres caminos

      **Por la fórmula de la potencia.**

      $$
      \mathcal{L}\left(t^{n}e^{at}\right) = \frac{n!}{(s-a)^{n+1}}
      \;\xrightarrow{\;n=1,\;a=-1\;}\;
      \mathcal{L}\left(te^{-t}\right) = \frac{1}{(s+1)^{2}}
      $$

      **Por la traslación en $s$.**
      $\mathcal{L}^{-1}\left(\tfrac{1}{s^{2}}\right)=t$, y el
      desplazamiento $s\to s+1$ multiplica por $e^{-t}$.

      **Por convolución.**

      $$
      \frac{1}{(s+1)^{2}} = \frac{1}{s+1}\cdot\frac{1}{s+1}
      \;\longrightarrow\;
      \int_0^{t}e^{-u}e^{-(t-u)}du = e^{-t}\int_0^{t}du = te^{-t}
      $$

      La convolución es la más instructiva: se ve por qué sale una $t$
      multiplicando —el integrando no depende de $u$— y es la misma idea del
      ejercicio 6 del boletín básico.

      ### 2 · El 10.7(b)

      $$
      \frac{2}{s^{2}-4}
      \;\longrightarrow\;
      \operatorname{senh}2t
      $$

      y el factor $e^{-s}$ retrasa una unidad:

      $$
      \boxed{\
      f(t) = \begin{cases}
      0 & t<1\\
      \operatorname{senh}\left[2(t-1)\right] & t\ge1
      \end{cases}\ }
      $$

      ### 3 · Las dos familias de la tabla

      | denominador | familia |
      |---|---|
      | $s^{2}+\omega^{2}$ | $\operatorname{sen}$, $\cos$ |
      | $s^{2}-\omega^{2}$ | $\operatorname{senh}$, $\cosh$ |

      Y el numerador manda igual en las dos: $\omega$ arriba da el seno —o el
      seno hiperbólico—, y $s$ arriba da el coseno.

      **Lo que hay que llevarse.** Que un mismo resultado salga por tres
      caminos no es un adorno: es la forma de comprobarlo cuando no hay
      solución publicada. Y el signo del denominador decide entre funciones
      que oscilan y funciones que se disparan.

  - id: seis-edos-con-laplace
    titulo: Seis EDOs con Laplace, y el dato inicial que entra solo
    fuente: >-
      Ejercicio 10.8 · Problemas complementarios, tema 10 · Cálculo, UPV/EHU.
      Los apartados (c) y (d) son de las convocatorias 2016/2017 6E y
      2019/2020 6E. El resultado impreso de (d) lleva el seno con el signo
      cambiado; ver el aviso de la resolución.
    nivel: practica
    enunciado: |
      Utilizando la transformada de Laplace resolver las siguientes EDOs
      lineales de coeficientes constantes:

      (a) $y''+2y'+5y=0$, $y(0)=2$, $y'(0)=-4$

      (b) $y''-2y'+y=e^{t}+t$, $y(0)=1$, $y'(0)=0$

      (c) $y''+2y'+y=\operatorname{sen}t$, $y(0)=0$, $y'(0)=1$

      (d) $y''+2y'+4y=e^{-3t}$, $y(0)=1$, $y'(0)=-2$

      (e) $y'=5y+3e^{-3t}$, $y'(0)=-7$

      (f) $y''+y=2t$, $y\left(\tfrac{\pi}{4}\right)=\tfrac{\pi}{2}$,
      $y'\left(\tfrac{\pi}{4}\right)=2-\sqrt2$
    pide: La solución de las seis ecuaciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado (f) da los datos en $t=\tfrac{\pi}{4}$, no en $t=0$.
          ¿Qué problema plantea eso para Laplace?
        opciones:
          - texto: >-
              Que la transformada de la derivada usa $y(0)$ y $y'(0)$, y aquí
              no se conocen: hay que hallarlos antes, o resolver por otro
              método
            correcta: true
            mensaje: |
              Eso es. Laplace está hecho para problemas de valor inicial **en
              cero**. Con datos en otro punto, o se trasladan o se resuelve la
              general y se imponen al final.
          - texto: >-
              Ninguno: la fórmula vale igual
            mensaje: |
              La fórmula $\mathcal{L}(y')=sY-y(0)$ pide $y(0)$
              explícitamente. Con datos en $\tfrac{\pi}{4}$ no se tiene.
          - texto: >-
              Que la ecuación no tiene solución
            mensaje: |
              La tiene, y es $y=\cos t-\operatorname{sen}t+2t$. Lo que falla
              es el atajo, no el problema.

      - tipo: calcular
        titulo: El coeficiente del seno en (d)
        pregunta: |
          La solución de (d) es $y = \tfrac17 e^{-3t} + \tfrac67 e^{-t}\cos\sqrt3\,t + C\,e^{-t}\operatorname{sen}\sqrt3\,t$. Imponiendo $y'(0)=-2$, ¿cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '-0.4124'
          tolerancia: 0.002
          formato: en forma exacta (-5/(7sqrt(3))) o con cuatro decimales
        distractores:
          - valor: '0.4124'
            mensaje: |
              El signo, y es justo el que el boletín publica cambiado. Con
              $C=+\tfrac{5}{7\sqrt3}$ sale $y'(0)=-\tfrac47$, no $-2$.
          - valor: '-0.7143'
            mensaje: |
              $-\tfrac57$ olvida dividir entre $\sqrt3$: la derivada del seno
              trae ese factor.
        pista: |
          $y'(0) = -\tfrac67 + \sqrt3\,C - \tfrac37$, y eso tiene que valer
          $-2$.
        desarrollo: |
          $$
          y'(0) = -\frac67 + \sqrt3\,C - \frac37 = -2
          $$

          $$
          \sqrt3\,C = -2 + \frac97 = -\frac57
          \;\Longrightarrow\;
          C = -\frac{5}{7\sqrt3} \approx -0{,}4124
          $$

      - tipo: calcular
        titulo: El valor inicial de (e)
        pregunta: |
          La solución de (e) es
          $y = -\tfrac38 e^{-3t}-\tfrac{13}{8}e^{5t}$. ¿Cuánto vale $y(0)$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '-7'
            mensaje: |
              $-7$ es $y'(0)$, que es el dato que da el enunciado. Fíjate: la
              condición **no** es sobre $y$ sino sobre su derivada, y eso es
              raro en una EDO de primer orden.
          - valor: '2'
            mensaje: |
              El signo. Los dos coeficientes son negativos.
        pista: |
          $-\tfrac38-\tfrac{13}{8} = -\tfrac{16}{8}$.
        desarrollo: |
          $$
          y(0) = -\frac38-\frac{13}{8} = -\frac{16}{8} = -2
          $$

          Y se comprueba con la ecuación: $y'(0) = 5y(0)+3 = -10+3 = -7$,
          que es el dato del enunciado ✓

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $\mathcal{L}(y')=sY-y(0)$ y
              $\mathcal{L}(y'')=s^{2}Y-sy(0)-y'(0)$: los datos iniciales entran
              al transformar, no al final.
          - texto: >-
              Despejando $Y(s)$ queda una función racional, y
              antitransformarla es el trabajo que queda.
          - texto: >-
              En (b) y (c) hay resonancia con la raíz doble, y eso se ve en el
              denominador de $Y$: aparece $(s-1)^{3}$ o $(s+1)^{3}$.
          - texto: >-
              Y por eso Laplace evita tener que buscar la solución particular:
              el método no distingue entre homogénea y particular.
            trampa: true
            mensaje: |
              La primera mitad es cierta y la segunda no la explica: Laplace no
              distingue **porque resuelve el problema completo de una vez**,
              no porque el método sea ciego a la estructura. De hecho la
              estructura reaparece en las fracciones simples: cada raíz del
              denominador es un término de la homogénea, y los polos que
              vienen del segundo miembro son la particular.
        veredicto: |
          La ventaja real de Laplace sobre el método clásico es que **las
          condiciones iniciales entran al principio**. La desventaja es que
          hay que antitransformar una racional que puede ser fea. En (b), con
          $(s-1)^{3}$ en el denominador, esa parte es la mitad del trabajo.
    resolucion: |
      **Los seis resultados.**

      | apartado | solución |
      |---|---|
      | (a) | $e^{-t}\left(2\cos2t-\operatorname{sen}2t\right)$ |
      | (b) | $-e^{t}+\tfrac12 t^{2}e^{t}+t+2$ |
      | (c) | $\tfrac12 e^{-t}-\tfrac12\cos t+\tfrac32 te^{-t}$ |
      | (d) | $\tfrac17 e^{-3t}+\tfrac67 e^{-t}\cos\sqrt3\,t-\tfrac{5}{7\sqrt3}e^{-t}\operatorname{sen}\sqrt3\,t$ |
      | (e) | $-\tfrac38 e^{-3t}-\tfrac{13}{8}e^{5t}$ |
      | (f) | $\cos t-\operatorname{sen}t+2t$ |

      ### 1 · El método

      $$
      \mathcal{L}(y')=sY-y(0),
      \qquad
      \mathcal{L}(y'')=s^{2}Y-s\,y(0)-y'(0)
      $$

      Se transforma la ecuación, se despeja $Y(s)$, y se antitransforma.

      ### 2 · El aviso sobre el impreso

      El boletín publica para (d)

      $$
      \frac17 e^{-3t}+\frac67 e^{-t}\cos\sqrt3\,t
      + \frac{5}{7\sqrt3}e^{-t}\operatorname{sen}\sqrt3\,t
      $$

      con el seno **positivo**. Esa función cumple la ecuación y $y(0)=1$,
      pero su derivada en cero vale $-\tfrac47$ y el enunciado pide $-2$.
      Imponiendo bien la condición sale

      $$
      \sqrt3\,C = -2+\frac97 = -\frac57
      \;\Longrightarrow\;
      C = -\frac{5}{7\sqrt3}
      $$

      Comprobado analíticamente y por derivación numérica. Aquí se publica el
      signo que cuadra.

      ### 3 · El apartado (e), que tiene truco

      El enunciado da $y'(0)=-7$, no $y(0)$: una condición sobre la
      **derivada** en una ecuación de primer orden. Se convierte en una sobre
      $y$ usando la propia ecuación:

      $$
      y'(0) = 5y(0)+3 \;\Longrightarrow\; -7 = 5y(0)+3
      \;\Longrightarrow\; y(0) = -2
      $$

      ### 4 · El apartado (f), donde Laplace no es el camino

      Los datos están en $t=\tfrac{\pi}{4}$, y la transformada de la derivada
      pide $y(0)$. Lo más corto es resolver por el método clásico —la
      particular es $2t$ y la homogénea $k_1\cos t+k_2\operatorname{sen}t$— e
      imponer los datos al final.

      **Lo que hay que llevarse.** Laplace es el método de los problemas de
      valor inicial **en cero**. Cuando los datos están en otro punto, o hay
      que trasladarlos o conviene otro método, y reconocerlo de entrada ahorra
      el rato de intentar forzarlo.

  - id: dos-edos-de-coeficientes-no-constantes
    titulo: Dos EDOs con una t delante, y la derivada de la transformada
    fuente: Ejercicio 10.9 · Problemas complementarios, tema 10 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Utilizando la transformada de Laplace resolver las siguientes EDOs
      lineales de coeficientes no constantes:

      (a) $ty'-2y=2t$, $y(1)=3$

      (b) $ty''+2ty'+2y=0$, $y(0)=0$, $y'(0)=3$
    pide: La solución de las dos ecuaciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué propiedad convierte un coeficiente $t$ en algo manejable?
        opciones:
          - texto: >-
              La derivada de la transformada:
              $\mathcal{L}\left(t\,g(t)\right) = -G'(s)$, así que una $t$
              delante se vuelve una **derivada en $s$**
            correcta: true
            mensaje: |
              Eso es, y tiene una consecuencia grande: la ecuación transformada
              ya no es algebraica, es **otra ecuación diferencial** —en $s$—.
              Lo que se gana es que suele ser de orden menor.
          - texto: >-
              La traslación en $s$
            mensaje: |
              Esa la pide una exponencial. Una $t$ multiplicando pide derivar.
          - texto: >-
              No hay ninguna: con coeficientes no constantes Laplace no sirve
            mensaje: |
              Sirve, y en estos dos casos muy bien. Lo que pasa es que en vez
              de una ecuación algebraica sale una diferencial de primer orden
              en $s$, que se resuelve con lo del tema 9.

      - tipo: calcular
        titulo: El apartado (a), evaluado
        pregunta: |
          La solución de (a) es $y=5t^{2}-2t$. ¿Cuánto vale en $t=2$?
        respuesta:
          tipo: numero
          valor: '16'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '20'
            mensaje: |
              $5t^{2}$ solo. Falta restar $2t$, que en $t=2$ vale $4$.
          - valor: '18'
            mensaje: |
              Has restado $2$ en vez de $2t$. El término es lineal en $t$.
        pista: |
          $5\cdot4-2\cdot2$.
        desarrollo: |
          $$
          y(2) = 20-4 = 16
          $$

          Y la comprobación: $ty'-2y = t(10t-2)-2(5t^{2}-2t)
          = 10t^{2}-2t-10t^{2}+4t = 2t$ ✓, con $y(1)=5-2=3$ ✓

      - tipo: calcular
        titulo: El apartado (b), evaluado
        pregunta: |
          La solución de (b) es $y=3te^{-2t}$. ¿Cuánto vale en $t=1$?
        respuesta:
          tipo: numero
          valor: '0.406'
          tolerancia: 0.001
          formato: en forma exacta (3/e²) o con tres decimales
        distractores:
          - valor: '3'
            mensaje: |
              $3$ es $y'(0)$, y también el coeficiente. En $t=1$ la exponencial
              ya ha dividido por $e^{2}\approx7{,}39$.
          - valor: '1.104'
            mensaje: |
              $3e^{-1}$: el exponente es $-2t$, no $-t$.
        pista: |
          $e^{-2}\approx0{,}1353$.
        desarrollo: |
          $$
          y(1) = 3e^{-2} \approx 3\cdot0{,}13534 \approx 0{,}406
          $$

          El máximo de $3te^{-2t}$ está en $t=\tfrac12$ y vale
          $\tfrac{3}{2e}\approx0{,}552$: en $t=1$ ya está bajando.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $\mathcal{L}(tg)=-G'(s)$, un coeficiente $t$ convierte la
              ecuación transformada en una diferencial de primer orden en $s$.
          - texto: >-
              En (a), transformando sale
              $-\left(sY-y(0)\right)'-2Y = \tfrac{2}{s^{2}}$, y ordenando,
              una lineal en $Y(s)$.
          - texto: >-
              Esa lineal se resuelve con factor integrante, se antitransforma y
              se impone el dato $y(1)=3$ al final.
          - texto: >-
              Y como la ecuación transformada es de primer orden, siempre es
              más fácil que la original.
            trampa: true
            mensaje: |
              No siempre: si la original es de primer orden con coeficiente
              $t$, la transformada también lo es y no se gana nada; y si la
              original tiene $t^{2}$ delante, la transformada es de **segundo**
              orden y se empeora. El método compensa cuando el coeficiente $t$
              acompaña a la derivada de orden más alto, como en (b).
        veredicto: |
          Es el caso menos habitual de Laplace y el más elegante: multiplicar
          por $t$ en el tiempo es derivar en $s$, así que una ecuación con
          coeficientes polinómicos se convierte en otra ecuación diferencial.
          A veces se gana y a veces no — y mirar de antemano cuál es cuál es
          parte del ejercicio.
    resolucion: |
      **Los dos resultados.**

      | apartado | solución |
      |---|---|
      | (a) | $y = 5t^{2}-2t$ |
      | (b) | $y = 3te^{-2t}$ |

      ### 1 · La propiedad que lo hace posible

      $$
      \mathcal{L}\left(t\,g(t)\right) = -\frac{dG}{ds}
      $$

      Un coeficiente $t$ en la ecuación se convierte en una derivada respecto
      de $s$: la ecuación transformada es **diferencial**, no algebraica.

      ### 2 · El apartado (b), paso a paso

      $$
      \mathcal{L}\left(ty''\right) = -\frac{d}{ds}\left(s^{2}Y-sy(0)-y'(0)\right)
      = -2sY - s^{2}Y' + y(0)
      $$

      $$
      \mathcal{L}\left(2ty'\right) = -2\frac{d}{ds}\left(sY-y(0)\right)
      = -2Y-2sY'
      $$

      Sumando con $2Y$ y usando $y(0)=0$:

      $$
      -\left(s^{2}+2s\right)Y' - 2sY = 0
      \;\Longrightarrow\;
      \frac{Y'}{Y} = \frac{-2s}{s(s+2)} = \frac{-2}{s+2}
      $$

      $$
      Y = \frac{K}{(s+2)^{2}}
      \;\longrightarrow\;
      y = K\,te^{-2t}
      $$

      Y con $y'(0)=3$: $K=3$.

      ### 3 · Las comprobaciones

      | apartado | sustituyendo | dato inicial |
      |---|---|---|
      | (a) | $t(10t-2)-2(5t^{2}-2t)=2t$ ✓ | $y(1)=3$ ✓ |
      | (b) | $3e^{-2t}\left[t(4t-4)+2t(1-2t)+2t\right]=0$ ✓ | $y(0)=0$, $y'(0)=3$ ✓ |

      **Lo que hay que llevarse.** Este es el único caso del tema en que la
      ecuación transformada no es algebraica, y por eso conviene reconocerlo
      antes de empezar: **si hay una $t$ multiplicando, va a salir una
      diferencial en $s$**. Suele ser de orden menor que la original, que es lo
      que compensa.

  - id: dos-sistemas-mas-con-laplace
    titulo: Dos sistemas más, y el que resulta tener la misma solución dos veces
    fuente: >-
      Ejercicio 10.10, apartados (b) y (d) · Problemas complementarios, tema 10
      · Cálculo, UPV/EHU. El (b) es de la convocatoria 2017/2018 7E. Los
      apartados (a) y (c) ya estaban en el sitio, y el (d) es el mismo sistema
      que el 7(b) del boletín básico.
    nivel: practica
    enunciado: |
      Utilizando la transformada de Laplace resolver los siguientes sistemas
      de EDOs:

      (b) $\begin{cases} x'=x+y-e^{t}\\ y'=x-y+e^{t}\\ x(0)=y(0)=1\end{cases}$

      (d) $\begin{cases} x'=2x+y\\ y'=3x+4y\\ x(0)=1,\; y(0)=0\end{cases}$
    pide: Las funciones x(t) e y(t) de los dos sistemas.
    pasos:
      - tipo: reconocer
        pregunta: |
          En (b), los términos $-e^{t}$ y $+e^{t}$ son opuestos y las
          condiciones iniciales, iguales. ¿Qué sugiere eso?
        opciones:
          - texto: >-
              Que conviene mirar la **suma** $x+y$: al sumar las dos
              ecuaciones, los $e^{t}$ se cancelan y queda
              $(x+y)'=2(x+y)$… casi
            correcta: true
            mensaje: |
              Buena intuición, y es la que lleva a la respuesta: sumando sale
              $(x+y)' = 2x$, y restando $(x-y)' = 2y - 2e^{t}$. Con
              $x(0)=y(0)$ el sistema es simétrico y la solución sale
              $x=y=e^{t}$.
          - texto: >-
              Que el sistema no tiene solución
            mensaje: |
              Un sistema lineal con condiciones iniciales siempre tiene
              solución única. La simetría es una pista, no un obstáculo.
          - texto: >-
              Que hay que resolverlas por separado
            mensaje: |
              No se puede: cada ecuación tiene las dos incógnitas. Lo que sí se
              puede es cambiar de variables a la suma y la diferencia.

      - tipo: calcular
        titulo: El apartado (b), evaluado
        pregunta: |
          La solución de (b) es $x(t)=y(t)=e^{t}$. ¿Cuánto vale $x(1)$?
        respuesta:
          tipo: numero
          valor: '2.7183'
          tolerancia: 0.003
          formato: en forma exacta (e) o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es $x(0)$. La solución crece.
          - valor: '0'
            mensaje: |
              $x-y$ vale $0$ siempre, pero $x$ no: las dos funciones crecen
              juntas.
        pista: |
          $x(t)=e^{t}$ evaluada en $t=1$ es $e$.
        desarrollo: |
          $$
          x(1) = e \approx 2{,}7183
          $$

          Y la comprobación, que es de dos líneas: con $x=y=e^{t}$,

          $$
          x' = e^{t}
          \quad\text{y}\quad
          x+y-e^{t} = e^{t}+e^{t}-e^{t} = e^{t} \;\checkmark
          $$

      - tipo: calcular
        titulo: El apartado (d), evaluado
        pregunta: |
          La solución de (d) es $x(t)=\tfrac34 e^{t}+\tfrac14 e^{5t}$. ¿Cuánto
          vale en $t=1$?
        respuesta:
          tipo: numero
          valor: '39.142'
          tolerancia: 0.05
          formato: con tres decimales
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es $x(0)$. Con un $e^{5t}$ dentro, en $t=1$ la solución ya ha
              crecido mucho.
          - valor: '37.103'
            mensaje: |
              $\tfrac{e^{5}}{4}$ solo. Falta el $\tfrac34 e$, que vale
              $2{,}04$: poco comparado con el otro, pero no cero.
        pista: |
          $e\approx2{,}71828$ y $e^{5}\approx148{,}41316$.
        desarrollo: |
          $$
          x(1) = \frac34\cdot2{,}71828 + \frac14\cdot148{,}41316
          = 2{,}03871 + 37{,}10329 \approx 39{,}142
          $$

          El término de $e^{5t}$ se lleva el $95\%$: con dos autovalores
          positivos manda siempre el mayor, y cada vez más.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Transformando, cada sistema de EDOs se vuelve un sistema
              algebraico en $X(s)$ e $Y(s)$, con las condiciones iniciales ya
              dentro.
          - texto: >-
              El determinante de ese sistema es el polinomio característico de
              la matriz de coeficientes.
          - texto: >-
              En (d) ese polinomio es $s^{2}-6s+5$, con raíces $1$ y $5$, y
              por eso la solución lleva $e^{t}$ y $e^{5t}$.
          - texto: >-
              Y en (b), como el segundo miembro es $\pm e^{t}$, el
              denominador tiene además una raíz en $s=1$ que produce un
              $te^{t}$.
            trampa: true
            mensaje: |
              No hay $te^{t}$ en la solución: es $x=y=e^{t}$ a secas. La raíz
              del segundo miembro coincide con una del sistema, sí, pero los
              numeradores se cancelan y no llega a producirse resonancia.
              Conviene comprobarlo en vez de darlo por hecho.
        veredicto: |
          El apartado (d) es el mismo sistema que el ejercicio 7(b) del
          boletín básico, y ahí las soluciones publicadas de (b) y (c) están
          intercambiadas. **Esta es la buena**, y sirve de confirmación.
    resolucion: |
      **Los dos resultados.**

      | apartado | solución |
      |---|---|
      | (b) | $x(t)=y(t)=e^{t}$ |
      | (d) | $x=\tfrac34 e^{t}+\tfrac14 e^{5t}$, &nbsp; $y=-\tfrac34 e^{t}+\tfrac34 e^{5t}$ |

      ### 1 · El apartado (d), paso a paso

      $$
      \begin{cases}
      sX-1 = 2X+Y\\
      sY = 3X+4Y
      \end{cases}
      \;\Longrightarrow\;
      \begin{cases}
      (s-2)X-Y = 1\\
      -3X+(s-4)Y = 0
      \end{cases}
      $$

      Determinante: $(s-2)(s-4)-3 = s^{2}-6s+5 = (s-1)(s-5)$.

      $$
      X = \frac{s-4}{(s-1)(s-5)},
      \qquad
      Y = \frac{3}{(s-1)(s-5)}
      $$

      Fracciones simples, evaluando el numerador en cada raíz:

      $$
      X: \; \frac{1-4}{1-5} = \frac34 \;\text{(en }s=1),
      \qquad \frac{5-4}{5-1} = \frac14 \;\text{(en }s=5)
      $$

      ### 2 · El apartado (b), por simetría

      Sumando y restando las dos ecuaciones:

      $$
      (x+y)' = 2x,
      \qquad
      (x-y)' = 2y-2e^{t}
      $$

      Con $x(0)=y(0)=1$, la solución $x=y=e^{t}$ cumple las dos y es única.
      Sustituyéndola:

      $$
      x' = e^{t} = x+y-e^{t},
      \qquad
      y' = e^{t} = x-y+e^{t} \;\checkmark
      $$

      ### 3 · La confirmación cruzada

      El sistema (d) es exactamente el del ejercicio **7(b) del boletín
      básico**, donde los resultados de (b) y (c) están intercambiados. La
      solución que aquí se publica es la que cuadra, y sirve de comprobación
      externa para la corrección que se declara allí.

      **Lo que hay que llevarse.** Antes de transformar, mirar si el sistema
      tiene simetría: en (b), la suma y la diferencia lo desacoplan y la
      solución se ve casi a ojo. Y después de resolver, sustituir siempre —es
      lo único que distingue una solución de otra que cumple las condiciones
      iniciales por casualidad.

  - id: una-edo-vuelta-sistema
    titulo: Una EDO de segundo orden convertida en sistema
    fuente: >-
      Ejercicio 10.11 · Problemas complementarios, tema 10 · Cálculo, UPV/EHU
      (2013/2014 6E). El resultado impreso no cumple ni la ecuación ni las
      condiciones iniciales; ver el aviso de la resolución.
    nivel: practica
    enunciado: |
      Transformar el problema de EDO con condición inicial
      $x''(t)-x'(t)-2x(t)=4$, $x(0)=3$, $x'(0)=1$ en un sistema de dos EDOs y
      resolverlo utilizando la transformada de Laplace.
    pide: El sistema equivalente y su solución.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se convierte una EDO de segundo orden en un sistema de dos de
          primer orden?
        opciones:
          - texto: >-
              Llamando $y=x'$: entonces $x'=y$ e
              $y'=x''=y+2x+4$, con $x(0)=3$ e $y(0)=1$
            correcta: true
            mensaje: |
              Eso es. El truco es **bautizar la derivada**: la primera ecuación
              es la definición y la segunda es la ecuación original despejada.
          - texto: >-
              Derivando la ecuación otra vez
            mensaje: |
              Eso la sube a tercer orden. Lo que hace falta es bajar el orden
              añadiendo una incógnita.
          - texto: >-
              Separando la parte homogénea de la particular
            mensaje: |
              Eso es otra descomposición, la del método clásico, y no produce
              ningún sistema.

      - tipo: calcular
        titulo: La solución, evaluada
        pregunta: |
          La solución es $x(t)=-2+2e^{2t}+3e^{-t}$. ¿Cuánto vale en $t=1$?
        respuesta:
          tipo: numero
          valor: '13.882'
          tolerancia: 0.02
          formato: con tres decimales
        distractores:
          - valor: '3'
            mensaje: |
              $3$ es $x(0)$. En $t=1$ el $2e^{2t}$ ya vale casi $15$.
          - valor: '14.778'
            mensaje: |
              $2e^{2}$ solo. Faltan el $-2$ y el $3e^{-1}$, que casi se
              cancelan entre sí pero no del todo.
        pista: |
          $e^{2}\approx7{,}38906$ y $e^{-1}\approx0{,}36788$.
        desarrollo: |
          $$
          x(1) = -2 + 2\cdot7{,}38906 + 3\cdot0{,}36788
          = -2 + 14{,}77811 + 1{,}10364 \approx 13{,}882
          $$

      - tipo: calcular
        titulo: El valor de equilibrio
        pregunta: |
          Si en vez de $x(0)=3$, $x'(0)=1$ los datos fueran tales que la
          solución no creciera, ¿cuál sería el valor constante que resuelve
          $x''-x'-2x=4$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '4'
            mensaje: |
              $4$ es el segundo miembro. Para una solución constante,
              $x''=x'=0$ y queda $-2x=4$.
          - valor: '2'
            mensaje: |
              El signo. De $-2x=4$ sale $x=-2$: hay que dividir entre $-2$, y
              eso cambia el signo del $4$.
        pista: |
          Una solución constante tiene $x''=x'=0$.
        desarrollo: |
          $$
          -2x = 4 \;\Longrightarrow\; x = -2
          $$

          Ese $-2$ es la **solución particular** de la ecuación, y es el
          término independiente de la respuesta. No es un equilibrio estable:
          la raíz $s=2$ es positiva, así que cualquier desviación se dispara.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $y=x'$, el sistema es $x'=y$, $y'=y+2x+4$, con $x(0)=3$ e
              $y(0)=1$.
          - texto: >-
              El polinomio característico es $s^{2}-s-2=(s-2)(s+1)$, así que
              la solución lleva $e^{2t}$ y $e^{-t}$.
          - texto: >-
              La particular constante es $-2$, y las constantes salen de
              $x(0)=3$ y $x'(0)=1$: $x=-2+2e^{2t}+3e^{-t}$.
          - texto: >-
              Y como hay una raíz positiva y otra negativa, la solución tiende
              a un valor finito.
            trampa: true
            mensaje: |
              Con una raíz positiva la solución **se dispara**: el $e^{2t}$
              domina y $x\to+\infty$. Que haya también una raíz negativa solo
              significa que uno de los términos se apaga; basta con que una
              sea positiva para que no haya límite finito.
        veredicto: |
          Convertir una EDO de orden $n$ en un sistema de $n$ ecuaciones de
          primer orden es lo que hacen todos los métodos numéricos, y aquí
          sirve para ver que Laplace da lo mismo por los dos caminos.
    resolucion: |
      **Datos.** $x''-x'-2x=4$, $x(0)=3$, $x'(0)=1$.

      ### 1 · El sistema

      Con $y=x'$:

      $$
      \begin{cases}
      x' = y\\
      y' = y+2x+4
      \end{cases}
      \qquad x(0)=3,\; y(0)=1
      $$

      La primera ecuación es la definición de $y$; la segunda, la original
      despejada.

      ### 2 · La solución

      $$
      \left(s^{2}-s-2\right)X = \frac4s + 3s - 2
      $$

      con $s^{2}-s-2=(s-2)(s+1)$. Descomponiendo,

      $$
      \boxed{\ x(t) = -2 + 2e^{2t} + 3e^{-t}\ }
      $$

      ### 3 · El aviso sobre el impreso

      El boletín publica $x(t)=2+e^{-t}+e^{t}$. No puede ser, por dos razones
      independientes:

      1. $x(0) = 2+1+1 = 4$, y el enunciado pide $3$.
      2. El polinomio característico es $(s-2)(s+1)$: la solución puede llevar
         $e^{2t}$ y $e^{-t}$, pero **no $e^{t}$**, que no es solución de la
         homogénea.

      Sustituyendo la impresa en la ecuación se comprueba: no da $4$.

      La que se publica aquí cumple las dos cosas:

      | qué | comprobación |
      |---|---|
      | $x(0)$ | $-2+2+3 = 3$ ✓ |
      | $x'(0)$ | $4-3 = 1$ ✓ |
      | la ecuación | $x''-x'-2x = 4$ ✓ |

      ### 4 · Qué hace la solución

      | término | qué es |
      |---|---|
      | $-2$ | la particular constante |
      | $3e^{-t}$ | transitorio, se apaga |
      | $2e^{2t}$ | el que manda a la larga |

      **Lo que hay que llevarse.** Un resultado publicado se comprueba con dos
      cosas: las condiciones iniciales y **las raíces que puede llevar**. Un
      término $e^{t}$ en una ecuación cuyo polinomio característico no tiene
      raíz en $1$ es imposible, y eso se ve sin sustituir nada.

  - id: cinco-ecuaciones-integrales
    titulo: Cinco ecuaciones con la incógnita dentro de una integral
    fuente: >-
      Ejercicio 10.12, apartados (a), (b), (c), (f) y (g) · Problemas
      complementarios, tema 10 · Cálculo, UPV/EHU. Los apartados (d) y (e) ya
      estaban en el sitio. El (f) y el (g) son de la convocatoria 2019/2020 7E.
    nivel: practica
    enunciado: |
      Utilizando la transformada de Laplace resolver las siguientes ecuaciones
      integrales:

      (a) $\displaystyle\int_0^{t}u(z)\,dz + u(t) = 2t$

      (b) $\displaystyle\int_0^{t}z\,u(z)\,dz = 1 + t\,u(t) - e^{t}$

      (c) $y(t) + \displaystyle\int_0^{t}y(z)\,dz = e^{2t}$

      (f) $y = t + 2\displaystyle\int_0^{t}\operatorname{sen}(t-u)\,y(u)\,du$

      (g) $y' + y - 2\displaystyle\int_0^{t}y(u)\,du = t$, &nbsp; $y(0)=0$
    pide: La función incógnita de las cinco ecuaciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué distingue el apartado (f) de los otros cuatro?
        opciones:
          - texto: >-
              Que su integral es una **convolución**,
              $\operatorname{sen}*y$, mientras que las demás son
              $\int_0^{t}y$, que es la convolución con $1$
            correcta: true
            mensaje: |
              Eso es. Y las dos se transforman igual de fácil:
              $\mathcal{L}\left(f*g\right)=F\,G$, y
              $\mathcal{L}\left(\int_0^{t}y\right)=\tfrac{Y}{s}$ es el caso
              $f=1$.
          - texto: >-
              Que no se puede resolver con Laplace
            mensaje: |
              Es justamente el caso para el que Laplace está hecho: la
              convolución se vuelve un producto, y la ecuación, algebraica.
          - texto: >-
              Que tiene dos incógnitas
            mensaje: |
              Solo hay una, $y$. La $u$ es la variable de integración.

      - tipo: calcular
        titulo: El apartado (a), evaluado
        pregunta: |
          La solución de (a) es $u(t)=2-2e^{-t}$. ¿Cuánto vale en $t=1$?
        respuesta:
          tipo: numero
          valor: '1.2642'
          tolerancia: 0.002
          formato: en forma exacta (2-2/e) o con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es el límite cuando $t\to\infty$. En $t=1$ la exponencial
              todavía resta $0{,}74$.
          - valor: '0'
            mensaje: |
              $0$ es $u(0)$, y tiene sentido: en $t=0$ la ecuación dice
              $0+u(0)=0$.
        pista: |
          $e^{-1}\approx0{,}36788$.
        desarrollo: |
          $$
          u(1) = 2-2\cdot0{,}36788 = 2-0{,}73576 \approx 1{,}2642
          $$

          Y la comprobación directa:

          $$
          \int_0^{1}\left(2-2e^{-z}\right)dz + u(1)
          = \left(2+2e^{-1}-2\right) + \left(2-2e^{-1}\right) = 2 \;\checkmark
          $$

      - tipo: calcular
        titulo: El apartado (f), evaluado
        pregunta: |
          La solución de (f) es $y = e^{t}-e^{-t}-t$. ¿Cuánto vale en $t=1$?
        respuesta:
          tipo: numero
          valor: '1.3504'
          tolerancia: 0.002
          formato: con cuatro decimales
        distractores:
          - valor: '2.3504'
            mensaje: |
              Te has dejado el $-t$, que en $t=1$ resta exactamente $1$.
          - valor: '2.7015'
            mensaje: |
              $e-e^{-1}$ es $2\operatorname{senh}1$, sin restar la $t$.
              Ese es el mismo error visto de otra forma.
        pista: |
          $e\approx2{,}71828$ y $e^{-1}\approx0{,}36788$.
        desarrollo: |
          $$
          y(1) = 2{,}71828 - 0{,}36788 - 1 \approx 1{,}3504
          $$

          Fíjate en la forma: $y = 2\operatorname{senh}t - t$. La ecuación
          tenía un seno dentro y la solución sale con un seno **hiperbólico**,
          porque el denominador acaba siendo $s^{2}-1$ y no $s^{2}+1$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $\mathcal{L}\left(\int_0^{t}y\right)=\tfrac{Y(s)}{s}$, y
              $\mathcal{L}\left(f*y\right)=F(s)\,Y(s)$: la integral se vuelve
              un producto.
          - texto: >-
              Con eso, cada ecuación integral se convierte en una **algebraica**
              en $Y(s)$, que se despeja de una línea.
          - texto: >-
              En (g) hay además una derivada, así que la condición inicial
              $y(0)=0$ entra por $\mathcal{L}(y')=sY-y(0)$.
          - texto: >-
              Y en (b), como la incógnita aparece multiplicada por $t$ dentro
              y fuera de la integral, hay que derivar la ecuación antes de
              transformar.
            trampa: true
            mensaje: |
              No hace falta derivar nada: las dos $t$ se tratan con la
              propiedad de la derivada de la transformada,
              $\mathcal{L}(tu)=-U'(s)$, y la ecuación transformada sale
              diferencial en $s$ —de primer orden— igual que en el ejercicio
              10.9. Derivar la ecuación original es otro camino, más largo.
        veredicto: |
          Las ecuaciones integrales son **el** motivo de que la convolución
          esté en el temario. Sin ella, una ecuación con la incógnita dentro
          de una integral no se puede atacar; con ella, es una línea de
          álgebra.
    resolucion: |
      **Los cinco resultados.**

      | apartado | solución |
      |---|---|
      | (a) | $u = 2-2e^{-t}$ |
      | (b) | $u = e^{t}$ |
      | (c) | $y = \tfrac{e^{-t}}{3}+\tfrac{2e^{2t}}{3}$ |
      | (f) | $y = e^{t}-e^{-t}-t$ |
      | (g) | $y = \tfrac{e^{t}}{3}+\tfrac{e^{-2t}}{6}-\tfrac12$ |

      ### 1 · Las dos propiedades que lo resuelven todo

      $$
      \mathcal{L}\left(\int_0^{t}y(z)\,dz\right) = \frac{Y(s)}{s},
      \qquad
      \mathcal{L}\left(\int_0^{t}f(t-u)y(u)\,du\right) = F(s)\,Y(s)
      $$

      La primera es el caso $f=1$ de la segunda.

      ### 2 · Paso a paso, en (c)

      $$
      Y + \frac{Y}{s} = \frac{1}{s-2}
      \;\Longrightarrow\;
      Y\,\frac{s+1}{s} = \frac{1}{s-2}
      \;\Longrightarrow\;
      Y = \frac{s}{(s+1)(s-2)}
      $$

      $$
      = \frac{1/3}{s+1} + \frac{2/3}{s-2}
      \;\longrightarrow\;
      y = \frac{e^{-t}}{3}+\frac{2e^{2t}}{3}
      $$

      ### 3 · El apartado (f), con convolución de verdad

      $$
      Y = \frac{1}{s^{2}} + 2\cdot\frac{1}{s^{2}+1}\cdot Y
      \;\Longrightarrow\;
      Y\,\frac{s^{2}-1}{s^{2}+1} = \frac{1}{s^{2}}
      $$

      $$
      Y = \frac{s^{2}+1}{s^{2}\left(s^{2}-1\right)}
      = -\frac{1}{s^{2}}+\frac{1}{s-1}-\frac{1}{s+1}
      \;\longrightarrow\;
      y = e^{t}-e^{-t}-t
      $$

      **El detalle que hay que ver**: el $s^{2}+1$ del seno acaba en el
      numerador y el denominador se vuelve $s^{2}-1$. Por eso una ecuación con
      un seno dentro tiene por solución un seno **hiperbólico**.

      ### 4 · El apartado (g), con derivada e integral a la vez

      $$
      sY + Y - \frac{2Y}{s} = \frac{1}{s^{2}}
      \;\Longrightarrow\;
      Y = \frac{1}{s(s+2)(s-1)}
      $$

      $$
      = -\frac{1/2}{s}+\frac{1/6}{s+2}+\frac{1/3}{s-1}
      \;\longrightarrow\;
      y = \frac{e^{t}}{3}+\frac{e^{-2t}}{6}-\frac12
      $$

      ### 5 · La comprobación

      Todas cumplen su ecuación en $t=0$, que es el contraste más barato:

      | apartado | en $t=0$ | la ecuación pide |
      |---|---|---|
      | (a) | $u(0)=0$ | $0+u(0)=0$ ✓ |
      | (c) | $y(0)=1$ | $y(0)+0=1$ ✓ |
      | (f) | $y(0)=0$ | $0+0=0$ ✓ |
      | (g) | $y(0)=0$ | dado ✓ |

      **Lo que hay que llevarse.** Una ecuación integral se transforma en una
      algebraica, y ahí Laplace no tiene rival: ningún otro método del temario
      sabe qué hacer con una incógnita dentro de una integral. Reconocer la
      convolución —el argumento $t-u$— es lo único que hay que entrenar.

  - id: el-circuito-rlc-y-la-fuente-que-llega-tarde
    titulo: Un circuito RLC, y la misma respuesta dos segundos después
    fuente: Ejercicio 10.13 · Problemas complementarios, tema 10 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular la carga $q(t)$ en el condensador de un circuito RLC en serie
      para los siguientes casos:

      (a) $e(t)=150\,\text{V}$

      (b) $e(t)=150\,\theta(t-2)\,\text{V}$

      Datos: $R=20\,\Omega$, $L=1\,\text{H}$, $C=0{,}005\,\text{F}$.
      Condiciones iniciales: $q(0)=0$ e $i(0)=q'(0)=0$. La EDO que describe la
      carga es $Lq''(t)+Rq'(t)+\tfrac{1}{C}q(t)=e(t)$.
    pide: La carga q(t) en los dos casos.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con los datos, la ecuación es $q''+20q'+200q=150$. ¿Qué tipo de
          respuesta va a tener el circuito?
        opciones:
          - texto: >-
              Oscilatoria amortiguada: las raíces son $-10\pm10i$, con parte
              real negativa y parte imaginaria no nula
            correcta: true
            mensaje: |
              Eso es. En un RLC, el discriminante $R^{2}-\tfrac{4L}{C}$ decide
              entre sobreamortiguado, crítico y oscilatorio. Aquí
              $400-800<0$: oscila y se apaga.
          - texto: >-
              Exponencial pura, sin oscilar
            mensaje: |
              Eso sería si $R^{2}>\tfrac{4L}{C}$, o sea con más resistencia.
              Con $R=20$ y $\tfrac{4L}{C}=800$, el discriminante es negativo.
          - texto: >-
              Oscilatoria sin amortiguar
            mensaje: |
              Eso exigiría $R=0$. Con resistencia siempre hay una parte real
              negativa, y la oscilación se apaga.

      - tipo: calcular
        titulo: La carga final
        pregunta: |
          ¿A qué valor tiende $q(t)$ cuando $t\to\infty$ en el caso (a)?
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.005
          formato: en culombios, en forma exacta (3/4) o con dos decimales
        distractores:
          - valor: '150'
            mensaje: |
              $150$ es la tensión de la fuente, en voltios. La carga final es
              $C\,e = 0{,}005\cdot150$.
          - valor: '0'
            mensaje: |
              $0$ es la carga inicial. El condensador se va cargando hasta
              equilibrar la fuente.
        pista: |
          En régimen permanente $q''=q'=0$, así que $200q=150$.
        desarrollo: |
          $$
          200\,q_{\infty} = 150 \;\Longrightarrow\; q_{\infty} = \frac34
          \text{ C}
          $$

          Y eso es $C\cdot e = 0{,}005\cdot150 = 0{,}75$: el condensador acaba
          con la tensión de la fuente, que es lo que tiene que pasar cuando la
          corriente se detiene.

      - tipo: calcular
        titulo: La carga a la décima de segundo
        pregunta: |
          $q_1(t)=\tfrac34-\tfrac34 e^{-10t}\left(\cos10t+\operatorname{sen}10t\right)$.
          ¿Cuánto vale en $t=0{,}1$ s?
        respuesta:
          tipo: numero
          valor: '0.3688'
          tolerancia: 0.0008
          formato: en culombios, con cuatro decimales
        distractores:
          - valor: '0.75'
            mensaje: |
              $0{,}75$ es el valor final. A la décima de segundo el transitorio
              todavía resta la mitad.
          - valor: '0'
            mensaje: |
              $0$ es el valor inicial, y también lo que daría el paréntesis si
              $\cos$ y $\operatorname{sen}$ se cancelaran. En $t=0{,}1$ el
              argumento es $1$ radián y los dos son positivos.
        pista: |
          $e^{-1}\approx0{,}36788$, $\cos1\approx0{,}54030$ y
          $\operatorname{sen}1\approx0{,}84147$.
        desarrollo: |
          $$
          q_1(0{,}1) = 0{,}75 - 0{,}75\cdot0{,}36788\cdot1{,}38177
          = 0{,}75 - 0{,}38122 \approx 0{,}3688 \text{ C}
          $$

          A la décima de segundo lleva la mitad de la carga final: el
          transitorio dura del orden de $\tfrac{1}{10}$ s, que es el inverso de
          la parte real de las raíces.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con los datos, $q''+20q'+200q = e(t)$, y las raíces
              características son $-10\pm10i$.
          - texto: >-
              Para $e=150$ constante, la particular es $\tfrac34$ y las dos
              condiciones iniciales nulas fijan los coeficientes.
          - texto: >-
              Para $e=150\,\theta(t-2)$, la fuente es la misma retrasada dos
              segundos, así que la respuesta es la misma retrasada dos
              segundos: $q_2(t)=\theta(t-2)\,q_1(t-2)$.
          - texto: >-
              Y eso vale porque el sistema es lineal, aunque las condiciones
              iniciales no fuesen nulas.
            trampa: true
            mensaje: |
              **Hace falta que sean nulas.** Si el condensador tuviera carga en
              $t=0$, entre $0$ y $2$ el circuito ya estaría evolucionando por
              su cuenta, y la respuesta después de $t=2$ no sería la misma
              curva trasladada. La invariancia temporal exige partir del
              reposo.
        veredicto: |
          El apartado (b) no tiene ninguna cuenta: es el (a) desplazado. Y esa
          es exactamente la propiedad que hace útil la transformada de Laplace
          en ingeniería — que un retraso en la entrada es un factor
          $e^{-cs}$ y nada más.
    resolucion: |
      **Datos.** $R=20$, $L=1$, $C=0{,}005$, de donde
      $\tfrac1C = 200$ y la ecuación es

      $$
      q''+20q'+200q = e(t),
      \qquad q(0)=q'(0)=0
      $$

      ### 1 · El régimen del circuito

      $$
      r^{2}+20r+200 = 0 \;\Longrightarrow\; r = -10\pm10i
      $$

      | discriminante | régimen |
      |---|---|
      | $R^{2}>\tfrac{4L}{C}$ | sobreamortiguado |
      | $R^{2}=\tfrac{4L}{C}$ | crítico |
      | $R^{2}<\tfrac{4L}{C}$ | **oscilatorio amortiguado** ← este |

      Aquí $400 < 800$.

      ### 2 · El apartado (a)

      Particular: $q_p=\tfrac{150}{200}=\tfrac34$.

      $$
      q = \frac34 + e^{-10t}\left(A\cos10t+B\operatorname{sen}10t\right)
      $$

      De $q(0)=0$ sale $A=-\tfrac34$; de $q'(0)=0$, $-10A+10B=0$, o sea
      $B=A$:

      $$
      \boxed{\
      q_1(t) = \frac34-\frac34 e^{-10t}
      \left(\cos10t+\operatorname{sen}10t\right)\ }
      $$

      ### 3 · El apartado (b), sin cuentas

      La fuente es la misma retrasada dos segundos. Como el sistema es lineal
      e invariante y parte del reposo:

      $$
      \boxed{\ q_2(t) = \theta(t-2)\,q_1(t-2)\ }
      $$

      Con Laplace se ve de inmediato: el segundo miembro se multiplica por
      $e^{-2s}$, y eso es exactamente un retraso.

      ### 4 · La lectura física

      | tiempo | carga | qué pasa |
      |---|---|---|
      | $0$ | $0$ | el condensador está descargado |
      | $0{,}1$ s | $0{,}369$ C | va por la mitad, oscilando |
      | $\to\infty$ | $0{,}75$ C | $Ce = 0{,}005\cdot150$ |

      La carga final es la que corresponde a la tensión de la fuente. Y la
      duración del transitorio es del orden de $\tfrac{1}{10}$ s, el inverso
      de la parte real de las raíces.

      **Lo que hay que llevarse.** En un circuito, **el discriminante decide el
      régimen** y la parte real de las raíces decide cuánto dura el
      transitorio. Y un retraso en la fuente es un retraso en la respuesta, sin
      recalcular nada — siempre que se parta del reposo.

  - id: dos-trayectorias-de-maxima-pendiente
    titulo: Por dónde bajaría una bola en una silla de montar
    fuente: >-
      Ejercicio 10.14 · Problemas complementarios, tema 10 · Cálculo, UPV/EHU.
      El resultado impreso del apartado (b) no pasa por el punto que da el
      enunciado; ver el aviso de la resolución.
    nivel: practica
    enunciado: |
      Calcular las trayectorias de máxima pendiente de la superficie
      $z=y^{2}-2x^{2}$, partiendo de los siguientes puntos:

      (a) $(1,1)$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (b) $(3,-1)$
    pide: La trayectoria de máxima pendiente por cada punto.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué ecuación diferencial cumple una trayectoria de máxima
          pendiente?
        opciones:
          - texto: >-
              Que su vector tangente sea paralelo al gradiente:
              $\dfrac{dy}{dx}=\dfrac{z_y}{z_x}$
            correcta: true
            mensaje: |
              Eso es. El gradiente apunta en la dirección de máxima subida, y
              la trayectoria de máxima pendiente —suba o baje— va siempre
              paralela a él. El sentido lo decide el signo, pero la curva es
              la misma.
          - texto: >-
              Que sea perpendicular al gradiente
            mensaje: |
              Eso son las **curvas de nivel**: por donde no se sube ni se baja.
              La máxima pendiente es la dirección contraria, la paralela.
          - texto: >-
              Que $z$ sea constante
            mensaje: |
              Eso es otra vez la curva de nivel. Por la trayectoria de máxima
              pendiente, $z$ cambia todo lo posible.

      - tipo: calcular
        titulo: La trayectoria de (a), evaluada
        pregunta: |
          La trayectoria por $(1,1)$ es $y=\dfrac{1}{\sqrt{x}}$. ¿Cuánto vale
          $y$ en $x=4$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.004
          formato: en forma exacta (1/2) o con un decimal
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es $\sqrt{x}$, no su inverso. La trayectoria baja: al alejarse
              del eje $y$, la $y$ disminuye.
          - valor: '0.25'
            mensaje: |
              $\tfrac14$ sería $\tfrac{1}{x}$. El exponente es $-\tfrac12$.
        pista: |
          $\sqrt4 = 2$.
        desarrollo: |
          $$
          y(4) = \frac{1}{\sqrt4} = \frac12
          $$

          La curva $y\sqrt{x}=1$ se acerca al eje $x$ conforme $x$ crece: la
          bola se aleja del centro de la silla por el lado que baja.

      - tipo: calcular
        titulo: La constante de la trayectoria de (b)
        pregunta: |
          La familia es $y=\dfrac{K}{\sqrt{x}}$. Para la que pasa por
          $(3,-1)$, ¿cuánto vale $K$?
        respuesta:
          tipo: numero
          valor: '-1.7321'
          tolerancia: 0.003
          formato: en forma exacta (-sqrt(3)) o con cuatro decimales
        distractores:
          - valor: '1.7321'
            mensaje: |
              El signo. La curva pasa por un punto con $y=-1$, así que $K$
              tiene que ser negativo.
          - valor: '-0.5774'
            mensaje: |
              $-\tfrac{1}{\sqrt3}$ invierte la relación: de
              $-1 = \tfrac{K}{\sqrt3}$ sale $K=-\sqrt3$, no
              $-\tfrac{1}{\sqrt3}$.
        pista: |
          $-1 = \dfrac{K}{\sqrt3}$.
        desarrollo: |
          $$
          K = -\sqrt3 \approx -1{,}7321
          $$

          $$
          y = -\frac{\sqrt3}{\sqrt{x}},
          \qquad\text{o en forma explícita en }x,\quad x = \frac{3}{y^{2}}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $\nabla z = (-4x,\,2y)$, así que la trayectoria cumple
              $\dfrac{dy}{dx}=\dfrac{2y}{-4x}=-\dfrac{y}{2x}$.
          - texto: >-
              Es separable: $\dfrac{dy}{y}=-\dfrac{dx}{2x}$, de donde
              $y\sqrt{x}=K$.
          - texto: >-
              El punto de partida fija $K$: vale $1$ en (a) y $-\sqrt3$ en
              (b).
          - texto: >-
              Y como el gradiente apunta hacia arriba, las dos trayectorias
              suben.
            trampa: true
            mensaje: |
              La **curva** es la misma suba o baje; lo que decide el sentido es
              si se sigue $+\nabla z$ o $-\nabla z$. Y en una silla de montar
              como esta, a lo largo de la trayectoria la $z$ baja hacia los
              lados del eje $x$ y sube hacia los del eje $y$: no hay una
              respuesta única para «sube» o «baja» sin decir el sentido.
        veredicto: |
          La trayectoria de máxima pendiente es una EDO separable del tema 9
          con el gradiente del tema 6 delante. El ejercicio no es de Laplace
          —está en este boletín porque el 10.15 y el 10.16 sí lo usan— y
          conviene tenerlo claro por separado.
    resolucion: |
      **Datos.** $z=y^{2}-2x^{2}$, una silla de montar.

      ### 1 · La ecuación diferencial

      $$
      \nabla z = \left(-4x,\;2y\right)
      \;\Longrightarrow\;
      \frac{dy}{dx} = \frac{2y}{-4x} = -\frac{y}{2x}
      $$

      Separando,

      $$
      \frac{dy}{y} = -\frac{dx}{2x}
      \;\Longrightarrow\;
      \ln\lvert y\rvert = -\frac12\ln\lvert x\rvert + c
      \;\Longrightarrow\;
      y\sqrt{x} = K
      $$

      ### 2 · Las dos trayectorias

      | punto | $K$ | trayectoria |
      |---|---|---|
      | $(1,1)$ | $1$ | $y=\dfrac{1}{\sqrt{x}}$ |
      | $(3,-1)$ | $-\sqrt3$ | $y=-\dfrac{\sqrt3}{\sqrt{x}}$, o $x=\dfrac{3}{y^{2}}$ |

      ### 3 · El aviso sobre el impreso

      El boletín publica para (b) «en forma explícita $x=0$». Esa sí es una
      trayectoria de la superficie —sobre el eje $y$ el gradiente es
      $(0,2y)$, vertical, y la curva $x=0$ se mantiene— pero **no pasa por
      $(3,-1)$**, que es el punto que pide el enunciado. La que pasa por ahí es
      $y\sqrt{x}=-\sqrt3$.

      ### 4 · Qué se ve en la figura

      La superficie es una silla de montar: sube a lo largo del eje $y$ y baja
      a lo largo del eje $x$. Las trayectorias $y\sqrt{x}=K$ son hipérbolas
      generalizadas que se acercan al eje $x$ por un lado y al eje $y$ por el
      otro — es decir, huyen del punto de silla en el origen.

      **Lo que hay que llevarse.** Trayectoria de máxima pendiente y curva de
      nivel son perpendiculares, y las dos salen de la misma EDO con el
      cociente invertido. Confundirlas es el error que convierte este
      ejercicio en otro.

  - id: la-bola-en-la-loma-elipsoidal
    titulo: Una bola que rueda por una loma, y dónde para
    fuente: >-
      Ejercicio 10.15 · Problemas complementarios, tema 10 · Cálculo, UPV/EHU
      (2011/2012 7E). La ordenada del punto S impresa es 3,01 y la que sale es
      3,10; ver el aviso de la resolución.
    nivel: practica
    enunciado: |
      Considerar la superficie definida por la función
      $F(x,y)=-0{,}1\left(y^{2}+2y+x^{2}\right)+2$. Una bola se suelta en el
      punto $P(1,\,1,\,1{,}6)$ y rueda por la superficie hasta terminar en
      algún punto $S$ del plano horizontal $XY$. La bola no está sometida a
      ninguna otra fuerza más que la de la gravedad. Se pide:

      (a) Plantear la ecuación diferencial y la condición inicial que debe
      verificar la trayectoria de la bola.

      (b) Resolver dicha ecuación.

      (c) Determinar el punto $S$.
    pide: La ecuación de la trayectoria, su solución y el punto S.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por dónde baja una bola que solo obedece a la gravedad?
        opciones:
          - texto: >-
              Por la trayectoria de **máxima pendiente**, o sea siguiendo
              $-\nabla F$ en cada punto
            correcta: true
            mensaje: |
              Eso es. Y en proyección sobre el plano $XY$, esa condición es la
              EDO $\dfrac{dy}{dx}=\dfrac{F_y}{F_x}$.
          - texto: >-
              Por la curva de nivel
            mensaje: |
              Por una curva de nivel la bola no bajaría nada: es la dirección
              en la que la altura no cambia.
          - texto: >-
              En línea recta hacia el punto más bajo
            mensaje: |
              Solo si la superficie fuera un plano. En general la trayectoria
              se curva, porque la dirección de máxima pendiente cambia en cada
              punto.

      - tipo: calcular
        titulo: La abscisa del punto S
        pregunta: |
          La trayectoria es $y=2x-1$, y $S$ está donde $F=0$. ¿Cuánto vale la
          $x$ de $S$?
        respuesta:
          tipo: numero
          valor: '2.0494'
          tolerancia: 0.004
          formato: en forma exacta (sqrt(21/5)) o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es la abscisa del punto de partida. La bola avanza mientras
              baja.
          - valor: '4.2'
            mensaje: |
              $4{,}2$ es $x^{2}$, no $x$. Falta la raíz.
        pista: |
          $F=0$ es $y^{2}+2y+x^{2}=20$. Sustituyendo $y=2x-1$ queda
          $5x^{2}-1=20$.
        desarrollo: |
          $$
          (2x-1)^{2}+2(2x-1)+x^{2} = 20
          $$

          $$
          4x^{2}-4x+1+4x-2+x^{2} = 5x^{2}-1 = 20
          \;\Longrightarrow\;
          x^{2} = \frac{21}{5} = 4{,}2
          $$

          $$
          x = \sqrt{4{,}2} \approx 2{,}0494
          $$

      - tipo: calcular
        titulo: Y la ordenada
        pregunta: |
          ¿Cuánto vale la $y$ de $S$?
        respuesta:
          tipo: numero
          valor: '3.0988'
          tolerancia: 0.006
          formato: con cuatro decimales
        distractores:
          - valor: '3.01'
            mensaje: |
              $3{,}01$ es lo que publica el boletín, y no cuadra: con
              $x=2{,}0494$ y $y=2x-1$, la $y$ sale $3{,}0988$. Parece una
              transposición de cifras.
          - valor: '1.0494'
            mensaje: |
              Eso sería $x-1$. La recta es $y=2x-1$: la $x$ va multiplicada por
              $2$.
        pista: |
          $y = 2\cdot2{,}0494-1$.
        desarrollo: |
          $$
          y = 2\cdot 2{,}0494 - 1 = 3{,}0988
          $$

          Comprobación: $y^{2}+2y+x^{2} = 9{,}602+6{,}198+4{,}2 = 20$ ✓

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $\nabla F = \left(-0{,}2x,\;-0{,}2(y+1)\right)$, así que la
              trayectoria cumple
              $\dfrac{dy}{dx}=\dfrac{y+1}{x}$, con $y(1)=1$.
          - texto: >-
              Es separable y da $y+1=Kx$; con el punto de partida, $K=2$ y
              $y=2x-1$.
          - texto: >-
              $S$ está donde la superficie corta al plano $XY$, o sea donde
              $F=0$: $y^{2}+2y+x^{2}=20$.
          - texto: >-
              Y como la trayectoria es una recta, la bola baja con pendiente
              constante.
            trampa: true
            mensaje: |
              La **proyección** sobre el plano $XY$ es una recta, pero la
              trayectoria en el espacio no: la altura va bajando según
              $F(x,2x-1)$, que es una parábola en $x$. Que la sombra sea recta
              no dice nada sobre la pendiente.
        veredicto: |
          Es el mismo ejercicio que el 10.16, con otra superficie. Los tres
          pasos son siempre: gradiente, EDO separable, y cortar con el plano
          $z=0$.
    resolucion: |
      **Datos.** $F(x,y)=-0{,}1\left(y^{2}+2y+x^{2}\right)+2$, bola en
      $P(1,1,1{,}6)$.

      Comprobación previa: $F(1,1) = -0{,}1(1+2+1)+2 = 1{,}6$ ✓, el punto está
      sobre la superficie.

      ### 1 · La ecuación diferencial

      $$
      \nabla F = \left(-0{,}2x,\;-0{,}2\left(y+1\right)\right)
      $$

      $$
      \frac{dy}{dx} = \frac{F_y}{F_x} = \frac{y+1}{x},
      \qquad y(1)=1
      $$

      ### 2 · La trayectoria

      $$
      \frac{dy}{y+1} = \frac{dx}{x}
      \;\Longrightarrow\;
      y+1 = Kx
      \;\Longrightarrow\;
      \boxed{\ y = 2x-1\ }
      $$

      ### 3 · El punto S

      $S$ está en el plano $XY$, o sea donde $F=0$:

      $$
      y^{2}+2y+x^{2} = 20
      $$

      Con $y=2x-1$:

      $$
      5x^{2}-1 = 20
      \;\Longrightarrow\;
      x = \sqrt{4{,}2} \approx 2{,}0494,
      \qquad
      y = 2x-1 \approx 3{,}0988
      $$

      $$
      \boxed{\ S \approx (2{,}05,\; 3{,}10,\; 0)\ }
      $$

      ### 4 · El aviso sobre el impreso

      El boletín publica $S(2{,}05,\,3{,}01)$. La abscisa coincide, pero la
      ordenada no: con $x=2{,}0494$ y la recta $y=2x-1$, la $y$ es
      $3{,}0988$, no $3{,}01$. Parece una transposición de cifras. Se comprueba
      en un segundo: **$3{,}01$ no cumple $y=2x-1$** con esa $x$.

      ### 5 · El esquema, que se repite

      | paso | qué se hace |
      |---|---|
      | 1 | gradiente de la superficie |
      | 2 | EDO $\tfrac{dy}{dx}=\tfrac{F_y}{F_x}$, separable |
      | 3 | imponer el punto de partida |
      | 4 | cortar con $F=0$ para hallar $S$ |

      **Lo que hay que llevarse.** Los cuatro pasos son siempre los mismos, y
      el único que varía es la integral del segundo. Y la comprobación final es
      inmediata: **el punto $S$ tiene que cumplir las dos cosas a la vez**, la
      ecuación de la trayectoria y $F=0$. Comprobarlo caza la errata de arriba
      sin esfuerzo.
