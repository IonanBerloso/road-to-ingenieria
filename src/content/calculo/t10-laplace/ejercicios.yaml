  - id: ecuacion-integral-que-da-un-seno
    titulo: Una ecuación integral cuya solución es un seno
    fuente: Ejercicio 10.12e · Problemas complementarios, tema 10 · Cálculo, UPV/EHU (2017/2018 6E)
    nivel: practica
    enunciado: |
      Utilizando la transformada de Laplace, resolver la ecuación integral

      $$
      y(t) + \int_{0}^{t}(t-z)\,y(z)\,dz = t
      $$
    pide: La función y(t).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la transformada de la convolución $\int_0^t (t-z)\,y(z)\,dz$?
        opciones:
          - texto: El producto de la transformada de t por la de y, o sea Y/s²
            correcta: true
            mensaje: |
              Sí. La convolución de $t$ con $y$ transforma en
              $\frac{1}{s^{2}}\cdot Y(s)$. Ahí está toda la gracia: la integral
              se convierte en un producto.
          - texto: La transformada de t menos la de y
            mensaje: |
              La convolución no es una resta aunque lleve un $(t-z)$ dentro. El
              $(t-z)$ es el argumento de la primera función, no una diferencia
              de funciones.
          - texto: No tiene transformada conocida
            mensaje: |
              Sí la tiene, y es la propiedad que hace resolubles estas
              ecuaciones. Sin ella no habría forma de sacar la $y$ de dentro de
              la integral.
      - tipo: calcular
        titulo: Despejar Y
        pregunta: |
          La ecuación transformada es $Y + \frac{Y}{s^{2}} = \frac{1}{s^{2}}$.
          Despejando sale $Y = \frac{1}{s^{2}+1}$. ¿Cuánto vale $Y$ en $s=1$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.01
          formato: en forma exacta (1/2) o con un decimal
        distractores:
          - valor: '1'
            mensaje: |
              1 es el numerador. En $s=1$ el denominador vale $1+1=2$, así que
              sale $1/2$.
          - valor: '2'
            mensaje: |
              Has dado la vuelta a la fracción. Es $1/(s^{2}+1)$, no
              $(s^{2}+1)/1$.
        pista: |
          $1/(1+1)$.
        desarrollo: |
          $$
          Y\left(1+\frac{1}{s^{2}}\right) = \frac{1}{s^{2}}
          \;\Longrightarrow\;
          Y\cdot\frac{s^{2}+1}{s^{2}} = \frac{1}{s^{2}}
          \;\Longrightarrow\;
          Y = \frac{1}{s^{2}+1}
          $$

          Y esa fracción es una entrada directa de la tabla.
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La integral es la convolución de $t$ con $y$, así que transforma en $Y/s^{2}$.'
          - texto: 'La ecuación transformada queda $Y + Y/s^{2} = 1/s^{2}$.'
          - texto: 'Despejando, $Y = \dfrac{1}{s^{2}+1}$.'
          - texto: 'Esa es la transformada del seno, luego $y(t) = \text{sen}\,t$.'
          - texto: 'Como el segundo miembro era $t$, la solución también tiene que ser un polinomio.'
            trampa: true
            mensaje: |
              No hay ninguna razón para eso. La convolución mezcla la incógnita
              consigo misma a través de la integral, y el resultado puede ser de
              otra familia. Aquí un segundo miembro polinómico produce un seno —
              y comprobarlo sustituyendo lo confirma.
    resolucion: |
      **Reconocer la convolución** es todo el ejercicio. La integral

      $$
      \int_{0}^{t}(t-z)\,y(z)\,dz
      $$

      es $t * y(t)$: el argumento $(t-z)$ junto a $z$, con límites de 0 a $t$,
      es la firma.

      **Transformando**, con $\mathcal{L}\{t\} = 1/s^{2}$:

      $$
      Y(s) + \frac{1}{s^{2}}\,Y(s) = \frac{1}{s^{2}}
      $$

      **La incógnita ha salido de la integral.** Despejando:

      $$
      Y\cdot\frac{s^{2}+1}{s^{2}} = \frac{1}{s^{2}}
      \qquad\Longrightarrow\qquad
      Y(s) = \frac{1}{s^{2}+1}
      $$

      **Antitransformando**, que es una entrada de tabla:

      $$
      \boxed{\;y(t) = \text{sen}\,t\;}
      $$

      **La comprobación**, que aquí sale redonda. Sustituyendo en la ecuación
      original, $\int_0^t (t-z)\,\text{sen}\,z\,dz = t - \text{sen}\,t$, así que

      $$
      \text{sen}\,t + \bigl(t-\text{sen}\,t\bigr) = t \quad ✓
      $$

      > **Fíjate en lo que ha pasado.** Un segundo miembro polinómico —una
      > simple $t$— ha producido una solución trigonométrica. Es lo normal en
      > estas ecuaciones: la convolución realimenta la incógnita consigo misma,
      > y eso genera oscilación. Esperar que la solución «se parezca» al segundo
      > miembro es una intuición del tema 9 que aquí no vale.

      <figure class="figura-examen">
      <svg viewBox="0 0 340 220" role="img" width="340" height="220"
           aria-labelledby="f-integral-seno-t f-integral-seno-d">
        <title id="f-integral-seno-t">La solución de la ecuación integral, que resulta ser el seno</title>
        <desc id="f-integral-seno-d">Una onda que sale del origen, sube hasta uno, baja hasta menos uno y sigue oscilando sin apagarse ni crecer a lo largo de todo el dibujo: es la función seno. Con trazo fino se dibuja también la recta y igual a t, que es el término del enunciado, para ver que las dos coinciden solo cerca del origen y se separan en seguida.</desc>
