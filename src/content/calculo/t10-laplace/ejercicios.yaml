  - id: seis-transformadas-inversas
    titulo: Seis inversas, y los cuatro moldes que hay que reconocer
    fuente: >-
      Ejercicio 5 · Boletín «Transformada de Laplace. Problemas» · Cálculo,
      UPV/EHU. El resultado impreso del apartado (f) repite el del (c); aquí
      se publica el que cuadra, con el aviso escrito en la resolución y
      confirmado por el 10.5(b) de los problemas complementarios.
    nivel: practica
    enunciado: |
      Calcular las siguientes transformadas:

      (a) $\mathcal{L}^{-1}\left(\dfrac{3s+1}{(s-1)(s^{2}+1)}\right)$
      &nbsp;&nbsp;&nbsp;
      (b) $\mathcal{L}^{-1}\left(\dfrac{2s^{2}-4}{(s+1)(s-2)(s-3)}\right)$

      (c) $\mathcal{L}^{-1}\left(\dfrac{2s+2}{s^{2}+2s+5}\right)$
      &nbsp;&nbsp;&nbsp;
      (d) $\mathcal{L}^{-1}\left(\dfrac{2s+1}{s^{2}-2s+2}\right)$

      (e) $\mathcal{L}^{-1}\left(\dfrac{2(s-1)e^{-2s}}{s^{2}-2s+2}\right)$
      &nbsp;&nbsp;&nbsp;
      (f) $\mathcal{L}^{-1}\left(\dfrac{4}{(s-1)^{3}}\right)$
    pide: La antitransformada de las seis funciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los apartados (c), (d) y (e) tienen un trinomio de segundo grado
          abajo que **no** se factoriza. ¿Qué hay que hacer?
        opciones:
          - texto: >-
              Completar cuadrados: $s^{2}+2s+5=(s+1)^{2}+4$, y escribir el
              numerador en función de $s+1$
            correcta: true
            mensaje: |
              Eso es, y el segundo paso es el que se olvida: no basta con
              completar el cuadrado abajo, hay que **reescribir el numerador**
              en función de $s+1$ para poder leer la tabla.
          - texto: >-
              Fracciones simples con raíces complejas
            mensaje: |
              Se puede, pero acaba en exponenciales complejas que hay que
              volver a juntar en senos y cosenos. Completar cuadrados llega
              antes.
          - texto: >-
              Dividir el numerador entre el denominador
            mensaje: |
              El numerador es de grado menor, así que la división no hace
              nada.

      - tipo: calcular
        titulo: El valor inicial del apartado (b)
        pregunta: |
          $f(t)=-\tfrac16 e^{-t}-\tfrac43 e^{2t}+\tfrac72 e^{3t}$. ¿Cuánto
          vale $f(0)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '0'
            mensaje: |
              Suma otra vez: $-\tfrac16-\tfrac43+\tfrac72
              = \tfrac{-1-8+21}{6} = 2$.
          - valor: '5'
            mensaje: |
              Has sumado los tres sin sus signos. Dos de los tres restan.
        pista: |
          Pon todo sobre $6$: $\tfrac{-1-8+21}{6}$.
        desarrollo: |
          $$
          f(0) = -\frac16-\frac43+\frac72 = \frac{-1-8+21}{6} = 2
          $$

          Y eso **es** la comprobación del ejercicio: por el teorema del valor
          inicial,

          $$
          f(0) = \lim_{s\to\infty} s\,F(s)
          = \lim_{s\to\infty}\frac{2s^{3}-4s}{s^{3}+\dots} = 2
          $$

          Los dos caminos dan $2$: las fracciones simples están bien.

      - tipo: calcular
        titulo: El apartado (f), evaluado
        pregunta: |
          $\mathcal{L}^{-1}\left(\tfrac{4}{(s-1)^{3}}\right) = 2t^{2}e^{t}$.
          ¿Cuánto vale en $t=1$?
        respuesta:
          tipo: numero
          valor: '5.4366'
          tolerancia: 0.006
          formato: en forma exacta (2e) o con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es el coeficiente. Falta el $t^{2}e^{t}$, que en $t=1$ vale
              $e$.
          - valor: '2.7183'
            mensaje: |
              $e$ es $t^{2}e^{t}$ en $t=1$. Falta el $2$ de delante, que sale
              de $\tfrac{4}{2!}$.
        pista: |
          $\mathcal{L}\left(t^{n}e^{at}\right)=\dfrac{n!}{(s-a)^{n+1}}$, así
          que $\tfrac{4}{(s-1)^{3}} = \tfrac{4}{2!}\cdot\tfrac{2!}{(s-1)^{3}}$.
        desarrollo: |
          $$
          \mathcal{L}\left(t^{2}e^{t}\right) = \frac{2}{(s-1)^{3}}
          \;\Longrightarrow\;
          \mathcal{L}^{-1}\left(\frac{4}{(s-1)^{3}}\right) = 2t^{2}e^{t}
          $$

          En $t=1$: $2e\approx5{,}4366$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con raíces reales distintas —(a) y (b)— se hacen fracciones
              simples y cada trozo es una exponencial o un seno.
          - texto: >-
              Con un trinomio irreducible —(c) y (d)— se completa el cuadrado y
              se reescribe el numerador en función de $s-a$.
          - texto: >-
              Con un factor $e^{-cs}$ —(e)— se antitransforma lo demás y se
              retrasa el resultado $c$ unidades, poniendo $0$ antes.
          - texto: >-
              Y con una potencia $(s-a)^{n}$ —(f)— sale $t^{n}e^{at}$
              directamente, sin más constantes.
            trampa: true
            mensaje: |
              Hay un factorial de por medio:
              $\mathcal{L}\left(t^{n}e^{at}\right)=\tfrac{n!}{(s-a)^{n+1}}$.
              Con $n=2$ el numerador de la tabla es $2$, no $1$, y por eso
              $\tfrac{4}{(s-1)^{3}}$ da $2t^{2}e^{t}$ y no $4t^{2}e^{t}$.
        veredicto: |
          Cuatro moldes cubren los seis apartados: fracciones simples,
          completar cuadrados, retraso y potencia. Clasificar la expresión
          antes de tocarla es lo que decide el camino, y se hace mirando el
          **denominador**.
    resolucion: |
      **Los seis resultados.**

      | apartado | molde | resultado |
      |---|---|---|
      | (a) | fracciones simples | $2e^{t}-2\cos t+\operatorname{sen}t$ |
      | (b) | fracciones simples | $-\tfrac16e^{-t}-\tfrac43e^{2t}+\tfrac72e^{3t}$ |
      | (c) | completar cuadrados | $2e^{-t}\cos 2t$ |
      | (d) | completar cuadrados | $2e^{t}\cos t+3e^{t}\operatorname{sen}t$ |
      | (e) | retraso | $0$ si $t<2$; $2e^{t-2}\cos(t-2)$ si $t>2$ |
      | (f) | potencia | $2t^{2}e^{t}$ |

      ### 1 · Completar cuadrados, paso a paso en (d)

      $$
      \frac{2s+1}{s^{2}-2s+2} = \frac{2s+1}{(s-1)^{2}+1}
      $$

      Ahora el numerador, en función de $s-1$:

      $$
      2s+1 = 2(s-1)+3
      $$

      $$
      \frac{2(s-1)}{(s-1)^{2}+1} + \frac{3}{(s-1)^{2}+1}
      \;\longrightarrow\;
      2e^{t}\cos t + 3e^{t}\operatorname{sen}t
      $$

      **El paso que se olvida es el segundo**: sin reescribir el numerador, la
      tabla no se puede leer.

      ### 2 · El aviso sobre el impreso

      El boletín publica para (f) el mismo resultado que para (c),
      $2e^{-t}\cos2t$. No puede ser: $\tfrac{4}{(s-1)^{3}}$ no tiene ningún
      $s^{2}+4$ por ninguna parte, y su antitransformada sale de la fórmula de
      la potencia:

      $$
      \mathcal{L}\left(t^{2}e^{t}\right)=\frac{2!}{(s-1)^{3}}
      \;\Longrightarrow\;
      \mathcal{L}^{-1}\left(\frac{4}{(s-1)^{3}}\right) = 2t^{2}e^{t}
      $$

      Y hay confirmación independiente: **el mismo problema es el 10.5(b) de
      los problemas complementarios**, y allí se publica $2t^{2}e^{t}$.

      ### 3 · La comprobación que sirve para los seis

      El teorema del valor inicial, $f(0^{+})=\lim_{s\to\infty}sF(s)$:

      | apartado | $\lim sF(s)$ | $f(0)$ |
      |---|---|---|
      | (a) | $0$ | $2-2+0=0$ ✓ |
      | (b) | $2$ | $-\tfrac16-\tfrac43+\tfrac72=2$ ✓ |
      | (c) | $2$ | $2$ ✓ |
      | (d) | $2$ | $2$ ✓ |
      | (f) | $0$ | $0$ ✓ |

      Y para el impreso de (f), $2e^{-t}\cos2t$, daría $f(0)=2$ frente al
      $\lim sF(s)=0$ de $\tfrac{4}{(s-1)^{3}}$: **no cuadra**. Esa es la
      comprobación que caza la errata en diez segundos.

      **Lo que hay que llevarse.** El teorema del valor inicial es el
      contraste gratis de todo el tema: multiplicar la transformada por $s$,
      hacer $s\to\infty$, y comparar con el valor en $0$ de la respuesta. Si
      no coincide, la antitransformada está mal.

  - id: dos-identidades-por-convolucion
    titulo: Dos identidades que hay que demostrar por convolución
    fuente: >-
      Ejercicio 6 · Boletín «Transformada de Laplace. Problemas» · Cálculo,
      UPV/EHU · Departamento de Matemática Aplicada. Las dos identidades están
      comprobadas también por fracciones simples.
    nivel: practica
    enunciado: |
      Utilizando la propiedad de convolución demostrar las siguientes
      igualdades:

      (a) $\mathcal{L}^{-1}\left(\dfrac{s}{\left(s^{2}+a^{2}\right)^{2}}\right)
      = \dfrac{t\operatorname{sen}at}{2a}$

      (b) $\mathcal{L}^{-1}\left(\dfrac{1}{s^{2}(s+1)^{2}}\right)
      = te^{-t}+2e^{-t}+t-2$
    pide: Las dos demostraciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dice la propiedad de convolución?
        opciones:
          - texto: >-
              Que $\mathcal{L}^{-1}\left(F\cdot G\right)
              = \displaystyle\int_0^{t}f(u)g(t-u)\,du$: el **producto** de
              transformadas es la convolución de las funciones
            correcta: true
            mensaje: |
              Eso es, y es lo que hace útil este ejercicio: un denominador al
              cuadrado es un producto de dos factores iguales, y por eso la
              convolución lo ataca directamente.
          - texto: >-
              Que $\mathcal{L}(fg) = F\cdot G$
            mensaje: |
              Justo lo contrario de lo que pasa: la transformada de un
              **producto** no es el producto de las transformadas. Esa es la
              razón de que exista la convolución.
          - texto: >-
              Que $\mathcal{L}^{-1}(F+G)=f+g$
            mensaje: |
              Eso es la linealidad, que también vale, pero no ayuda con un
              denominador al cuadrado.

      - tipo: redactar
        consigna: |
          Escribe en papel la demostración del apartado (a): separa la
          expresión como producto de dos transformadas conocidas, monta la
          integral de convolución, y resuélvela con la fórmula del producto de
          senos y cosenos.
        rubrica:
          - punto: >-
              La separación explícita:
              $\dfrac{s}{\left(s^{2}+a^{2}\right)^{2}}
              = \dfrac{s}{s^{2}+a^{2}}\cdot\dfrac{1}{s^{2}+a^{2}}$, y qué
              función es cada factor.
            porque: >-
              Es la decisión del ejercicio, y hay más de una forma de
              repartir: también valdría $\tfrac{1}{s^{2}+a^{2}}$ por
              $\tfrac{s}{s^{2}+a^{2}}$ al revés, o meter el $a$ de otra manera.
              Sin decir cuál eliges, la integral que escribes después no se
              puede seguir.
          - punto: >-
              La integral montada con los argumentos bien:
              $\displaystyle\int_0^{t}\cos(au)\cdot
              \frac{\operatorname{sen}\left(a(t-u)\right)}{a}\,du$.
            porque: >-
              El $t-u$ es donde se equivoca casi todo el mundo. Y el
              $\tfrac1a$ también: $\mathcal{L}^{-1}\left(\tfrac{1}{s^{2}+a^{2}}
              \right)$ es $\tfrac{\operatorname{sen}at}{a}$, no
              $\operatorname{sen}at$.
          - punto: >-
              La transformación del producto en suma:
              $\operatorname{sen}A\cos B
              = \tfrac12\left[\operatorname{sen}(A+B)+\operatorname{sen}(A-B)\right]$.
            porque: >-
              Es lo que hace la integral posible. Y de paso explica de dónde
              sale el $t$ del resultado: el término
              $\operatorname{sen}(at)$ no depende de $u$, así que al integrar
              en $[0,t]$ se multiplica por $t$.
          - punto: >-
              Una frase final diciendo que el otro sumando se anula, y por
              qué.
            porque: >-
              $\int_0^{t}\operatorname{sen}\left(a(t-2u)\right)du = 0$ por
              simetría respecto de $u=\tfrac{t}{2}$. Sin esa frase, la
              demostración deja un término suelto y parece que se ha perdido
              por el camino.
        veredicto: |
          El $t$ que multiplica al seno en el resultado no sale de ninguna
          integración por partes: sale de que uno de los dos sumandos de la
          fórmula del producto **no depende de $u$**. Ver eso es entender el
          ejercicio.

      - tipo: calcular
        titulo: La identidad (a), comprobada en un punto
        pregunta: |
          Con $a=2$ y $t=1$, ¿cuánto vale $\dfrac{t\operatorname{sen}at}{2a}$?
        respuesta:
          tipo: numero
          valor: '0.2273'
          tolerancia: 0.0006
          formato: en forma exacta (sen(2)/4) o con cuatro decimales
        distractores:
          - valor: '0.4546'
            mensaje: |
              $\tfrac{\operatorname{sen}2}{2}$ olvida uno de los dos factores
              del $2a=4$.
          - valor: '0.1137'
            mensaje: |
              $\tfrac{\operatorname{sen}2}{8}$ divide de más: $2a$ con $a=2$ es
              $4$, no $8$.
        pista: |
          $\operatorname{sen}2 \approx 0{,}9093$ y $2a=4$.
        desarrollo: |
          $$
          \frac{1\cdot\operatorname{sen}2}{4} = \frac{0{,}90930}{4}
          \approx 0{,}2273
          $$

      - tipo: calcular
        titulo: La identidad (b), comprobada en un punto
        pregunta: |
          En $t=1$, ¿cuánto vale $te^{-t}+2e^{-t}+t-2$?
        respuesta:
          tipo: numero
          valor: '0.1036'
          tolerancia: 0.0006
          formato: en forma exacta (3/e - 1) o con cuatro decimales
        distractores:
          - valor: '-0.1036'
            mensaje: |
              El signo. $3e^{-1}\approx1{,}1036$, y al restarle $1$ queda
              positivo.
          - valor: '1.1036'
            mensaje: |
              $3e^{-1}$ es solo la parte exponencial. Falta el $t-2$, que en
              $t=1$ vale $-1$.
        pista: |
          En $t=1$ los dos primeros términos suman $3e^{-1}$, y los dos
          últimos, $-1$.
        desarrollo: |
          $$
          e^{-1}+2e^{-1}+1-2 = 3e^{-1}-1 \approx 1{,}1036-1 = 0{,}1036
          $$

          Y la comprobación estructural: en $t=0$ la expresión vale
          $0+2+0-2=0$, que es lo que exige
          $\lim_{s\to\infty}s\cdot\tfrac{1}{s^{2}(s+1)^{2}} = 0$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Un denominador **al cuadrado** es un producto de dos factores
              iguales, y eso es la señal de que la convolución ataca
              directamente.
          - texto: >-
              En (a), los dos factores son $\tfrac{s}{s^{2}+a^{2}}$ y
              $\tfrac{1}{s^{2}+a^{2}}$, o sea $\cos at$ y
              $\tfrac{\operatorname{sen}at}{a}$.
          - texto: >-
              La fórmula del producto de seno por coseno parte la integral en
              dos, y uno de los sumandos no depende de $u$: de ahí sale el
              $t$ que multiplica.
          - texto: >-
              Y como la convolución es la única forma de invertir un producto,
              el apartado (b) no se puede hacer por fracciones simples.
            trampa: true
            mensaje: |
              Sí se puede, y de hecho es más rápido:
              $\tfrac{1}{s^{2}(s+1)^{2}}
              = -\tfrac2s+\tfrac{1}{s^{2}}+\tfrac{2}{s+1}+\tfrac{1}{(s+1)^{2}}$,
              que da la identidad directamente. La convolución es
              **imprescindible** cuando el denominador no se factoriza en
              polinomios o cuando la ecuación viene ya como integral, no
              aquí.
        veredicto: |
          El enunciado dice «utilizando la propiedad de convolución» porque
          está entrenando esa herramienta, no porque sea la única. Y eso es
          bueno: se puede contrastar el resultado por el otro camino.
    resolucion: |
      ### 1 · La propiedad

      $$
      \mathcal{L}^{-1}\left(F(s)G(s)\right)
      = \left(f * g\right)(t) = \int_0^{t} f(u)\,g(t-u)\,du
      $$

      Un denominador **al cuadrado** es un producto de dos factores iguales:
      esa es la señal de que toca convolución.

      ### 2 · El apartado (a)

      $$
      \frac{s}{\left(s^{2}+a^{2}\right)^{2}}
      = \underbrace{\frac{s}{s^{2}+a^{2}}}_{\cos at}
      \cdot\underbrace{\frac{1}{s^{2}+a^{2}}}_{\operatorname{sen}at/a}
      $$

      $$
      \left(f*g\right)(t)
      = \frac1a\int_0^{t}\cos(au)\operatorname{sen}\left(a(t-u)\right)du
      $$

      Con
      $\operatorname{sen}A\cos B=\tfrac12\left[\operatorname{sen}(A+B)
      +\operatorname{sen}(A-B)\right]$:

      $$
      = \frac{1}{2a}\int_0^{t}\left[\operatorname{sen}(at)
      + \operatorname{sen}\left(a(t-2u)\right)\right]du
      $$

      El primer sumando no depende de $u$ y da $t\operatorname{sen}(at)$; el
      segundo se anula por simetría respecto de $u=\tfrac{t}{2}$.

      $$
      \boxed{\ \frac{t\operatorname{sen}at}{2a}\ }
      $$

      ### 3 · El apartado (b), por los dos caminos

      **Por convolución**, con $f=t$ y $g=te^{-t}$:

      $$
      \int_0^{t} u\,(t-u)e^{-(t-u)}du
      $$

      **Por fracciones simples**, que es la comprobación:

      $$
      \frac{1}{s^{2}(s+1)^{2}}
      = -\frac{2}{s}+\frac{1}{s^{2}}+\frac{2}{s+1}+\frac{1}{(s+1)^{2}}
      $$

      $$
      \longrightarrow\; -2+t+2e^{-t}+te^{-t}
      $$

      que es la identidad del enunciado.

      ### 4 · Por qué merece la pena saber los dos caminos

      | método | cuándo conviene |
      |---|---|
      | fracciones simples | siempre que el denominador se factorice en polinomios |
      | convolución | cuando uno de los factores no es racional, o cuando la ecuación viene ya como integral |

      En este ejercicio los dos funcionan, y por eso es un buen sitio para
      practicar el que menos se usa.

      **Lo que hay que llevarse.** La convolución es la única herramienta
      cuando aparece una **ecuación integral** —el ejercicio 10.12 del boletín
      complementario está lleno de ellas— y ahí no hay fracciones simples que
      valgan. Practicarla aquí, donde se puede contrastar, es lo que la deja
      lista para cuando no haya alternativa.

  - id: tres-problemas-con-laplace
    titulo: Una EDO y dos sistemas, resueltos con la transformada
    fuente: >-
      Ejercicio 7 · Boletín «Transformada de Laplace. Problemas» · Cálculo,
      UPV/EHU. Los resultados impresos de (b) y (c) están intercambiados, y el
      de (b) además con los exponentes cambiados de signo; aquí se publican los
      que cuadran, con el aviso en la resolución y confirmados por el 10.10(d)
      de los problemas complementarios.
    nivel: practica
    enunciado: |
      Resolver los siguientes problemas utilizando la transformada de Laplace:

      (a) $\begin{cases} y''+2y'+4y=0\\ y(0)=1,\; y'(0)=1\end{cases}$

      (b) $\begin{cases} x'=2x+y\\ y'=3x+4y\\ x(0)=1,\; y(0)=0\end{cases}$

      (c) $\begin{cases} x'-x-y=0\\ y'-2x=0\\ x(0)=0,\; y(0)=1\end{cases}$
    pide: La solución de la EDO y de los dos sistemas.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace la transformada con un sistema de dos EDOs?
        opciones:
          - texto: >-
              Lo convierte en un **sistema lineal de dos ecuaciones** con
              incógnitas $X(s)$ e $Y(s)$, que se resuelve como cualquier otro
            correcta: true
            mensaje: |
              Eso es, y ahí está la gracia: las derivadas desaparecen y queda
              álgebra. Después hay que antitransformar las dos soluciones, que
              es la parte con trabajo.
          - texto: >-
              Lo desacopla en dos EDOs independientes
            mensaje: |
              No las desacopla: el sistema algebraico sigue estando acoplado.
              Lo que hace es cambiar derivadas por multiplicaciones.
          - texto: >-
              Lo reduce a una EDO de segundo orden
            mensaje: |
              Ese es el método clásico de sustitución, sin Laplace. Con
              Laplace se va directo al sistema algebraico.

      - tipo: calcular
        titulo: El coeficiente del seno en (a)
        pregunta: |
          La solución de (a) es
          $y = e^{-t}\cos\sqrt3\,t + C\,e^{-t}\operatorname{sen}\sqrt3\,t$.
          ¿Cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '1.1547'
          tolerancia: 0.002
          formato: en forma exacta (2/sqrt(3)) o con cuatro decimales
        distractores:
          - valor: '0.5774'
            mensaje: |
              $\tfrac{1}{\sqrt3}$ olvida el $2$. De $y'(0)=1$ sale
              $-1+\sqrt3\,C=1$, o sea $C=\tfrac{2}{\sqrt3}$.
          - valor: '1.7321'
            mensaje: |
              $\sqrt3$ es la frecuencia, no el coeficiente. El coeficiente sale
              de imponer $y'(0)=1$.
        pista: |
          Deriva $y$ y evalúa en $t=0$: de los cuatro términos que salen, solo
          sobreviven el $-1$ del coseno y el $\sqrt3\,C$ del seno. Queda
          $y'(0)=-1+\sqrt3\,C$.
        desarrollo: |
          $$
          y'(0) = -1 + \sqrt3\,C = 1
          \;\Longrightarrow\;
          C = \frac{2}{\sqrt3} \approx 1{,}1547
          $$

      - tipo: calcular
        titulo: El autovalor mayor del sistema (b)
        pregunta: |
          Transformando el sistema (b), el denominador común de $X(s)$ e
          $Y(s)$ es $s^{2}-6s+5$. ¿Cuál es su raíz mayor?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es la otra raíz, la menor. Las dos aparecen en la solución,
              como $e^{t}$ y $e^{5t}$.
          - valor: '6'
            mensaje: |
              $6$ es la **suma** de las dos raíces, que es el coeficiente
              cambiado de signo. El producto es $5$.
        pista: |
          $s^{2}-6s+5=(s-1)(s-5)$.
        desarrollo: |
          $$
          s^{2}-6s+5 = (s-1)(s-5) = 0
          \;\Longrightarrow\;
          s = 1,\ 5
          $$

          Y por eso la solución lleva $e^{t}$ y $e^{5t}$:

          $$
          x(t) = \frac{3e^{t}}{4}+\frac{e^{5t}}{4},
          \qquad
          y(t) = -\frac{3e^{t}}{4}+\frac{3e^{5t}}{4}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Al transformar, $\mathcal{L}(x')=sX(s)-x(0)$: las condiciones
              iniciales entran solas, sin tener que imponerlas al final.
          - texto: >-
              El sistema queda algebraico, y su determinante es el polinomio
              característico de la matriz.
          - texto: >-
              En (b) ese polinomio es $s^{2}-6s+5$, con raíces $1$ y $5$; en
              (c) es $s^{2}-s-2$, con raíces $2$ y $-1$.
          - texto: >-
              Y por eso las dos soluciones se pueden comprobar mirando solo si
              cumplen las condiciones iniciales.
            trampa: true
            mensaje: |
              Las condiciones iniciales son **necesarias pero no
              suficientes**: hay infinitas funciones que valen $1$ y $0$ en
              $t=0$. Hay que comprobar también las ecuaciones. Y eso es
              justamente lo que caza la errata del boletín: la solución que
              publica para (b) cumple las condiciones iniciales de (c) pero no
              su sistema.
        veredicto: |
          La ventaja de Laplace en un sistema es que las condiciones iniciales
          entran al principio, no al final. La desventaja es que hay que
          antitransformar dos funciones en vez de una — y ahí es donde está
          todo el trabajo.
    resolucion: |
      **Los tres resultados.**

      | apartado | solución |
      |---|---|
      | (a) | $y = e^{-t}\cos\sqrt3\,t + \tfrac{2}{\sqrt3}e^{-t}\operatorname{sen}\sqrt3\,t$ |
      | (b) | $x = \tfrac34 e^{t}+\tfrac14 e^{5t}$, &nbsp; $y = -\tfrac34 e^{t}+\tfrac34 e^{5t}$ |
      | (c) | $x = \tfrac13 e^{2t}-\tfrac13 e^{-t}$, &nbsp; $y = \tfrac13 e^{2t}+\tfrac23 e^{-t}$ |

      ### 1 · El método, en (a)

      $$
      \left(s^{2}Y - s\,y(0) - y'(0)\right)
      + 2\left(sY - y(0)\right) + 4Y = 0
      $$

      $$
      Y\left(s^{2}+2s+4\right) = s+3
      \;\Longrightarrow\;
      Y = \frac{s+3}{(s+1)^{2}+3}
      $$

      Reescribiendo el numerador en función de $s+1$:

      $$
      Y = \frac{(s+1)}{(s+1)^{2}+3} + \frac{2}{(s+1)^{2}+3}
      $$

      $$
      y = e^{-t}\cos\sqrt3\,t + \frac{2}{\sqrt3}e^{-t}\operatorname{sen}\sqrt3\,t
      $$

      ### 2 · Los sistemas

      Transformando (b):

      $$
      \begin{cases}
      sX-1 = 2X+Y\\
      sY = 3X+4Y
      \end{cases}
      \;\Longrightarrow\;
      \begin{cases}
      (s-2)X - Y = 1\\
      -3X + (s-4)Y = 0
      \end{cases}
      $$

      con determinante $(s-2)(s-4)-3 = s^{2}-6s+5 = (s-1)(s-5)$.

      $$
      X = \frac{s-4}{(s-1)(s-5)},
      \qquad
      Y = \frac{3}{(s-1)(s-5)}
      $$

      y por fracciones simples salen los $\tfrac34$ y $\tfrac14$.

      ### 3 · El aviso sobre el impreso

      El boletín publica

      $$
      \text{(b)}\;
      \begin{cases}
      x = -\tfrac13 e^{-2t}+\tfrac13 e^{t}\\
      y = \tfrac13 e^{-2t}+\tfrac23 e^{t}
      \end{cases}
      \qquad
      \text{(c)}\;
      \begin{cases}
      x = \tfrac34 e^{t}+\tfrac14 e^{5t}\\
      y = -\tfrac34 e^{t}+\tfrac34 e^{5t}
      \end{cases}
      $$

      **Están intercambiadas**, y se ve en un segundo: la de (b) da
      $x(0)=0$, y el sistema (b) exige $x(0)=1$. La que el boletín pone en
      (c) es la que cumple $x(0)=1$.

      Y la que aparece bajo (b) **tampoco es exactamente la de (c)**: tiene
      los exponentes cambiados de signo. El sistema (c) tiene polinomio
      característico $s^{2}-s-2$, con raíces $2$ y $-1$, así que la solución
      lleva $e^{2t}$ y $e^{-t}$, no $e^{-2t}$ y $e^{t}$. Sustituyendo se
      comprueba: con la del boletín, $x'\ne x+y$.

      Confirmación independiente: **el sistema (b) es el 10.10(d) de los
      problemas complementarios**, y allí se publica
      $x=\tfrac34 e^{t}+\tfrac14 e^{5t}$,
      $y=-\tfrac34 e^{t}+\tfrac34 e^{5t}$ — la misma que aquí.

      ### 4 · La comprobación que hay que hacer siempre

      | qué comprobar | en (b) |
      |---|---|
      | condiciones iniciales | $x(0)=\tfrac34+\tfrac14=1$ ✓, $y(0)=-\tfrac34+\tfrac34=0$ ✓ |
      | la primera ecuación | $x' = \tfrac34 e^{t}+\tfrac54 e^{5t}$ y $2x+y = \tfrac64 e^{t}-\tfrac34 e^{t}+\tfrac24 e^{5t}+\tfrac34 e^{5t}$ ✓ |

      **Lo que hay que llevarse.** Comprobar las condiciones iniciales cuesta
      cinco segundos y **no basta**: hay que sustituir también en las
      ecuaciones. Las dos comprobaciones juntas son lo que ha detectado que las
      soluciones publicadas de (b) y (c) estaban cambiadas de sitio.

