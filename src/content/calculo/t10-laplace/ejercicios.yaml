      <figcaption>El e^{−2s} del numerador no es parte de la fracción: es el retraso. Se aparta, se invierte lo que queda —2e^{t}cos t— y al final se desplaza todo dos unidades y se pone a cero antes. El dibujo hace visible lo que el factor exponencial quiere decir.</figcaption>
      </figure>

  - id: sistema-que-sale-en-espiral
    titulo: Un sistema cuya solución gira
    fuente: Ejercicio 10.10c · Problemas complementarios, tema 10 · Cálculo, UPV/EHU (2018/2019 7E)
    nivel: practica
    enunciado: |
      Utilizando la transformada de Laplace resolver el sistema

      $$
      \begin{cases}
      x' = x + 2y\\
      y' = -2x + y
      \end{cases}
      \qquad x(0)=1,\; y(0)=0
      $$
    pide: Las funciones x(t) e y(t).
    pasos:
      - tipo: reconocer
        pregunta: |
          Los coeficientes cruzados son $+2$ y $-2$, opuestos. ¿Qué suele
          anunciar eso?
        opciones:
          - texto: Que la solución llevará senos y cosenos, o sea que girará
            correcta: true
            mensaje: |
              Sí. Esa antisimetría produce raíces complejas al resolver, y las
              raíces complejas son senos y cosenos. La trayectoria en el plano
              será una espiral.
          - texto: Que el sistema no tiene solución
            mensaje: |
              La tiene, y es única con esas condiciones iniciales. Lo que
              anuncian los signos opuestos es la **forma** de la solución, no su
              existencia.
          - texto: Que las dos funciones son iguales
            mensaje: |
              Serían iguales con coeficientes simétricos y las mismas
              condiciones. Aquí las condiciones ya son distintas —$x(0)=1$ e
              $y(0)=0$— y los signos cruzados son opuestos.
      - tipo: calcular
        titulo: El valor inicial de x
        pregunta: |
          La solución resulta ser $x(t) = e^{t}\cos 2t$ e
          $y(t) = -e^{t}\,\text{sen}\,2t$. Comprobando, ¿cuánto vale $x(0)$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              0 es $y(0)$, la otra condición. En $t=0$ tanto la exponencial como
              el coseno valen 1, así que $x(0)=1$.
          - valor: '2'
            mensaje: |
              2 es el coeficiente de dentro del coseno, no el valor de la
              función. En $t=0$ el coseno vale 1.
        pista: |
          $e^{0}\cos 0 = 1\cdot 1$.
        desarrollo: |
          $$
          x(0) = e^{0}\cos 0 = 1,
          \qquad
          y(0) = e^{0}\,\text{sen}\,0 = 0
          $$

          **Las dos condiciones iniciales se cumplen.** Comprobar esto cuesta
          cinco segundos y es lo primero que hay que hacer con cualquier
          solución de un problema con condiciones iniciales.
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Transformando: $sX-1 = X+2Y$ y $sY-0 = -2X+Y$.'
          - texto: 'Reordenando queda el sistema lineal $(s-1)X - 2Y = 1$ y $2X + (s-1)Y = 0$.'
          - texto: 'Resolviéndolo, $X = \dfrac{s-1}{(s-1)^{2}+4}$ e $Y = \dfrac{-2}{(s-1)^{2}+4}$.'
          - texto: 'Antitransformando sale $x = e^{t}\cos 2t$ e $y = -e^{t}\,\text{sen}\,2t$.'
          - texto: 'Como el denominador es $(s-1)^{2}+4$, la solución decrece con el tiempo.'
            trampa: true
            mensaje: |
              El $(s-1)$ significa una traslación que produce el factor $e^{+t}$,
              que **crece**. Si decreciera sería $(s+1)$. La solución es una
              espiral que se aleja del origen, no una que se acerca.
    resolucion: |
      **Transformar las dos ecuaciones**, metiendo las condiciones iniciales:

      $$
      \begin{cases}
      sX - 1 = X + 2Y\\
      sY - 0 = -2X + Y
      \end{cases}
      \qquad\Longrightarrow\qquad
      \begin{cases}
      (s-1)X - 2Y = 1\\
      2X + (s-1)Y = 0
      \end{cases}
      $$

      **Ya no hay derivadas.** Es un sistema lineal con determinante
      $(s-1)^{2}+4$, y resolviéndolo:

      $$
      X(s) = \frac{s-1}{(s-1)^{2}+4},
      \qquad
      Y(s) = \frac{-2}{(s-1)^{2}+4}
      $$

      **Antitransformando.** El $(s-1)$ es traslación en $s$, o sea un factor
      $e^{t}$; y el 4 del denominador es $2^{2}$, o sea frecuencia 2:

      $$
      \boxed{\;x(t) = e^{t}\cos 2t,
      \qquad
      y(t) = -e^{t}\,\text{sen}\,2t\;}
      $$

      **La comprobación:** $x(0)=1$ e $y(0)=0$. ✓

      > **Cuidado con qué compruebas.** Las condiciones iniciales y la relación
      > $x^{2}+y^{2} = e^{2t}$ **se cumplen igual con $y = +e^{t}\,\text{sen}\,2t$**,
      > que es el error más fácil de cometer aquí: el menos de
      > $Y = \frac{-2}{(s-1)^{2}+4}$ se pierde al antitransformar y ninguna de
      > esas dos comprobaciones lo delata. La única que sirve es **sustituir en
      > una de las dos ecuaciones**. Con $y = -e^{t}\,\text{sen}\,2t$:
      >
      > $$
      > y' = -e^{t}\,\text{sen}\,2t - 2e^{t}\cos 2t
      > \qquad\text{y}\qquad
      > -2x + y = -2e^{t}\cos 2t - e^{t}\,\text{sen}\,2t
      > $$
      >
      > que coinciden. Con el signo positivo, no.

      > **Lo que dice la forma de la respuesta.** $x^{2}+y^{2} = e^{2t}$, así
      > que el punto $(x,y)$ gira alrededor del origen alejándose: una espiral
      > que se abre. Los signos cruzados opuestos del sistema eran la pista, y
      > reconocerlos antes de calcular te dice qué esperar.

