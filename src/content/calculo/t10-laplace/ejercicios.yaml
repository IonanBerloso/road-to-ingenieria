  - id: siete-transformadas-por-propiedades
    titulo: Siete transformadas, una por propiedad
    fuente: >-
      Ejercicio 10.3 · Problemas complementarios, tema 10 · Cálculo, UPV/EHU.
      El apartado (e) es de la convocatoria 2019/2020 7E.
    nivel: practica
    enunciado: |
      Utilizando las propiedades de la transformada de Laplace calcular las
      transformadas de las siguientes funciones:

      (a) $f(t)=te^{t}$
      &nbsp;&nbsp;&nbsp;
      (e) $f(t)=\begin{cases}0 & t<2\\ \cos(t-2) & t\ge2\end{cases}$

      (b) $f(t)=e^{-2t}\operatorname{sen}3t$
      &nbsp;&nbsp;&nbsp;
      (f) $f(t)=\begin{cases}0 & t<2\\ (t-2)^{2} & t\ge2\end{cases}$

      (c) $f(t)=te^{t}\operatorname{sen}t$
      &nbsp;&nbsp;&nbsp;
      (g) $f(t)=\displaystyle\int_0^{t}\operatorname{sen}4z\,dz$

      (d) $f(t)=t^{2}\cos t$
    pide: Las siete transformadas.
    pasos:
      - tipo: reconocer
        pregunta: |
          Cada apartado usa una propiedad distinta. ¿Cuál corresponde a (d),
          $t^{2}\cos t$?
        opciones:
          - texto: >-
              La derivada de la transformada:
              $\mathcal{L}\left(t^{n}f\right)=(-1)^{n}F^{(n)}(s)$
            correcta: true
            mensaje: |
              Eso es. Multiplicar por $t$ en el tiempo es **derivar** en $s$,
              con un signo menos. Con $t^{2}$ hay que derivar dos veces y los
              dos signos se cancelan.
          - texto: >-
              La traslación en $s$
            mensaje: |
              Esa la pide una exponencial multiplicando, como en (a), (b) y
              (c). Aquí lo que multiplica es una potencia de $t$.
          - texto: >-
              La transformada de la derivada
            mensaje: |
              Esa se usa cuando aparece $f'$, y es la que hace útil el método
              para resolver EDOs. Aquí no hay ninguna derivada de $f$.

      - tipo: calcular
        titulo: El apartado (d), evaluado
        pregunta: |
          $\mathcal{L}\left(t^{2}\cos t\right)
          = \dfrac{2s\left(s^{2}-3\right)}{\left(s^{2}+1\right)^{3}}$. ¿Cuánto
          vale en $s=1$?
        respuesta:
          tipo: numero
          valor: '-0.5'
          tolerancia: 0.004
          formato: en forma exacta (-1/2) o con un decimal
        distractores:
          - valor: '0.5'
            mensaje: |
              El signo. En $s=1$, $s^{2}-3 = -2$: el paréntesis es negativo.
          - valor: '-0.25'
            mensaje: |
              $\left(s^{2}+1\right)^{3}$ con $s=1$ vale $2^{3}=8$, no $16$.
        pista: |
          Numerador: $2\cdot1\cdot(1-3) = -4$. Denominador: $2^{3}=8$.
        desarrollo: |
          $$
          \frac{2\cdot1\cdot\left(1-3\right)}{\left(1+1\right)^{3}}
          = \frac{-4}{8} = -\frac12
          $$

      - tipo: calcular
        titulo: El apartado (g), evaluado
        pregunta: |
          $\mathcal{L}\left(\displaystyle\int_0^{t}\operatorname{sen}4z\,dz\right)
          = \dfrac{4}{s\left(s^{2}+16\right)}$. ¿Cuánto vale en $s=1$?
        respuesta:
          tipo: numero
          valor: '0.2353'
          tolerancia: 0.0006
          formato: en forma exacta (4/17) o con cuatro decimales
        distractores:
          - valor: '0.0588'
            mensaje: |
              $\tfrac{1}{17}$ olvida el $4$ del numerador, que es la $\omega$
              del seno.
          - valor: '4'
            mensaje: |
              Te has dejado el denominador entero. En $s=1$ vale
              $1\cdot17=17$.
        pista: |
          $s\left(s^{2}+16\right)$ con $s=1$ vale $17$.
        desarrollo: |
          $$
          \frac{4}{1\cdot 17} = \frac{4}{17} \approx 0{,}2353
          $$

          La propiedad es
          $\mathcal{L}\left(\int_0^{t}f\right)=\tfrac{F(s)}{s}$: **integrar en
          el tiempo es dividir por $s$**, la inversa de que derivar sea
          multiplicar.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Multiplicar por $e^{at}$ traslada en $s$: (a), (b) y (c).
          - texto: >-
              Multiplicar por $t^{n}$ deriva $n$ veces en $s$, con signo
              $(-1)^{n}$: (c) y (d).
          - texto: >-
              Que la función arranque en $t=c$ produce un factor $e^{-cs}$:
              (e) y (f).
          - texto: >-
              E integrar en el tiempo multiplica por $s$: (g).
            trampa: true
            mensaje: |
              **Divide** por $s$. Derivar multiplica y integrar divide, que es
              lo coherente con que sean operaciones inversas. Con el resultado
              publicado se ve: $\tfrac{4}{s^{2}+16}$ pasa a
              $\tfrac{4}{s\left(s^{2}+16\right)}$.
        veredicto: |
          Las cuatro propiedades cubren los siete apartados, y el apartado (c)
          usa dos a la vez: primero $t\operatorname{sen}t$ derivando, y luego
          el $e^{t}$ desplazando. **El orden da igual**, pero conviene hacer
          primero la derivada y desplazar al final.
    resolucion: |
      **Las siete.**

      | apartado | propiedad | resultado |
      |---|---|---|
      | (a) | traslación en $s$ | $\dfrac{1}{(s-1)^{2}}$ |
      | (b) | traslación en $s$ | $\dfrac{3}{(s+2)^{2}+9}$ |
      | (c) | derivada en $s$ + traslación | $\dfrac{2(s-1)}{\left(s^{2}-2s+2\right)^{2}}$ |
      | (d) | derivada en $s$, dos veces | $\dfrac{2s\left(s^{2}-3\right)}{\left(s^{2}+1\right)^{3}}$ |
      | (e) | traslación en $t$ | $\dfrac{s\,e^{-2s}}{s^{2}+1}$ |
      | (f) | traslación en $t$ | $\dfrac{2e^{-2s}}{s^{3}}$ |
      | (g) | integral en $t$ | $\dfrac{4}{s\left(s^{2}+16\right)}$ |

      ### 1 · Las cuatro propiedades, en una tabla

      | en el tiempo | en $s$ |
      |---|---|
      | $e^{at}f(t)$ | $F(s-a)$ |
      | $t^{n}f(t)$ | $(-1)^{n}F^{(n)}(s)$ |
      | $\theta(t-c)f(t-c)$ | $e^{-cs}F(s)$ |
      | $\displaystyle\int_0^{t}f$ | $\dfrac{F(s)}{s}$ |

      ### 2 · El apartado (c), que usa dos

      Primero la derivada:
      $\mathcal{L}\left(t\operatorname{sen}t\right)
      = -\dfrac{d}{ds}\dfrac{1}{s^{2}+1} = \dfrac{2s}{\left(s^{2}+1\right)^{2}}$.

      Después el desplazamiento $s\to s-1$:

      $$
      \frac{2(s-1)}{\left((s-1)^{2}+1\right)^{2}}
      = \frac{2(s-1)}{\left(s^{2}-2s+2\right)^{2}}
      $$

      ### 3 · El apartado (d), derivando dos veces

      $$
      F = \frac{s}{s^{2}+1},
      \qquad
      F' = \frac{1-s^{2}}{\left(s^{2}+1\right)^{2}},
      \qquad
      F'' = \frac{2s\left(s^{2}-3\right)}{\left(s^{2}+1\right)^{3}}
      $$

      y como $n=2$, el signo $(-1)^{2}$ es $+1$.

      ### 4 · El apartado (e), que confirma algo

      Este es el mismo tipo que el ejercicio 2 del boletín básico, con
      $c=2$ en vez de $\tfrac{2\pi}{3}$. Y aquí el resultado publicado **sí**
      lleva la $s$ del numerador:

      $$
      \mathcal{L}(f) = \frac{s\,e^{-2s}}{s^{2}+1}
      $$

      que es lo que confirma que al del boletín básico le falta.

      **Lo que hay que llevarse.** Cuatro propiedades y siete ejercicios: la
      destreza es **clasificar antes de calcular**. Mirar qué multiplica a qué
      —una exponencial, una potencia, un escalón— decide la propiedad en dos
      segundos.

  - id: seis-inversas-del-complementario
    titulo: Seis inversas más, y la que se hace de memoria
    fuente: >-
      Ejercicio 10.5 · Problemas complementarios, tema 10 · Cálculo, UPV/EHU.
      Los apartados (b), (e) y (f) son los mismos que el 5 (f), (c) y (d) del
      boletín básico.
    nivel: practica
    enunciado: |
      Calcular la transformada inversa de Laplace de las funciones siguientes:

      (a) $F(s)=\dfrac{3}{s^{2}+4}$
      &nbsp;&nbsp;&nbsp;
      (c) $F(s)=\dfrac{2}{s^{2}+3s-4}$
      &nbsp;&nbsp;&nbsp;
      (e) $F(s)=\dfrac{2s+2}{s^{2}+2s+5}$

      (b) $F(s)=\dfrac{4}{(s-1)^{3}}$
      &nbsp;&nbsp;&nbsp;
      (d) $F(s)=\dfrac{3s}{s^{2}-s-6}$
      &nbsp;&nbsp;&nbsp;
      (f) $F(s)=\dfrac{2s+1}{s^{2}-2s+2}$
    pide: La antitransformada de las seis funciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          Ante $F(s)=\dfrac{2}{s^{2}+3s-4}$, ¿qué es lo primero?
        opciones:
          - texto: >-
              Mirar si el denominador **factoriza**: $s^{2}+3s-4=(s+4)(s-1)$,
              y entonces van fracciones simples
            correcta: true
            mensaje: |
              Eso es. El discriminante decide todo el camino: si es positivo,
              fracciones simples; si es negativo, completar cuadrados.
          - texto: >-
              Completar cuadrados
            mensaje: |
              Solo si no factoriza. Aquí $\Delta = 9+16 = 25 > 0$: hay dos
              raíces reales y las fracciones simples llegan antes.
          - texto: >-
              Buscarlo en la tabla tal cual
            mensaje: |
              Con un denominador de segundo grado hay que decidir primero de
              cuál de las dos familias es. La tabla no tiene una entrada
              directa para $\tfrac{2}{s^{2}+3s-4}$.

      - tipo: calcular
        titulo: El valor inicial del apartado (d)
        pregunta: |
          $f(t)=\tfrac95 e^{3t}+\tfrac65 e^{-2t}$. ¿Cuánto vale $f(0)$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '1.8'
            mensaje: |
              $\tfrac95$ es solo el primer término. Hay dos, y en $t=0$ los dos
              valen su coeficiente.
          - valor: '0.6'
            mensaje: |
              $\tfrac95-\tfrac65$ resta los dos. Los dos son positivos y se
              suman.
        pista: |
          $\tfrac95+\tfrac65 = \tfrac{15}{5}$.
        desarrollo: |
          $$
          f(0) = \frac95+\frac65 = 3
          $$

          Y esa **es** la comprobación: por el teorema del valor inicial,

          $$
          \lim_{s\to\infty} s\cdot\frac{3s}{s^{2}-s-6} = 3
          $$

          Los dos caminos dan $3$: las fracciones simples están bien.

      - tipo: calcular
        titulo: El apartado (c), evaluado
        pregunta: |
          $f(t)=\tfrac25 e^{t}-\tfrac25 e^{-4t}$. ¿Cuánto vale en $t=1$?
        respuesta:
          tipo: numero
          valor: '1.08'
          tolerancia: 0.003
          formato: con dos decimales
        distractores:
          - valor: '1.0873'
            mensaje: |
              Te has dejado el $-\tfrac25 e^{-4}$, que vale $-0{,}0073$. Es
              pequeño pero no es cero.
          - valor: '-1.08'
            mensaje: |
              El signo. El término positivo es $\tfrac25 e^{t}$, que en $t=1$
              vale $1{,}087$, y el negativo es mucho menor.
        pista: |
          $e^{1}\approx2{,}71828$ y $e^{-4}\approx0{,}01832$.
        desarrollo: |
          $$
          \frac25\left(e - e^{-4}\right)
          = 0{,}4\cdot\left(2{,}71828 - 0{,}01832\right)
          = 0{,}4\cdot2{,}69996 \approx 1{,}08
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El discriminante del denominador decide el camino: positivo,
              fracciones simples; negativo, completar cuadrados.
          - texto: >-
              Con una potencia $(s-a)^{n}$ se usa
              $\mathcal{L}\left(t^{n-1}e^{at}\right)=\tfrac{(n-1)!}{(s-a)^{n}}$,
              que en (b) da $2t^{2}e^{t}$.
          - texto: >-
              En (e) y (f) hay que reescribir el numerador en función de
              $s-a$ después de completar cuadrados.
          - texto: >-
              Y en (a), como el denominador es $s^{2}+4$, la antitransformada
              es $3\operatorname{sen}2t$.
            trampa: true
            mensaje: |
              Falta dividir entre $2$. La tabla dice
              $\mathcal{L}\left(\operatorname{sen}\omega t\right)
              =\tfrac{\omega}{s^{2}+\omega^{2}}$: el numerador tiene que ser
              $\omega=2$, así que
              $\tfrac{3}{s^{2}+4} = \tfrac32\cdot\tfrac{2}{s^{2}+4}$ y la
              respuesta es $\tfrac32\operatorname{sen}2t$.
        veredicto: |
          El error más repetido de todo el tema es ese: olvidar que el
          numerador de la tabla para el seno **es la frecuencia**, no un $1$.
          Si el numerador que tienes no es $\omega$, hay que ajustarlo
          multiplicando y dividiendo.
    resolucion: |
      **Los seis resultados.**

      | apartado | camino | resultado |
      |---|---|---|
      | (a) | tabla, ajustando el numerador | $\tfrac32\operatorname{sen}2t$ |
      | (b) | potencia | $2t^{2}e^{t}$ |
      | (c) | fracciones simples | $\tfrac25 e^{t}-\tfrac25 e^{-4t}$ |
      | (d) | fracciones simples | $\tfrac95 e^{3t}+\tfrac65 e^{-2t}$ |
      | (e) | completar cuadrados | $2e^{-t}\cos 2t$ |
      | (f) | completar cuadrados | $2e^{t}\cos t+3e^{t}\operatorname{sen}t$ |

      ### 1 · El árbol de decisión

      Mirando **el denominador**:

      | qué es | qué hacer |
      |---|---|
      | $s^{2}+\omega^{2}$ | tabla, ajustando el numerador |
      | $(s-a)^{n}$ | fórmula de la potencia, con $(n-1)!$ |
      | grado 2 con $\Delta>0$ | fracciones simples |
      | grado 2 con $\Delta<0$ | completar cuadrados |

      ### 2 · Las dos fracciones simples

      **(c)** $s^{2}+3s-4=(s+4)(s-1)$:

      $$
      \frac{2}{(s+4)(s-1)} = \frac{A}{s+4}+\frac{B}{s-1},
      \qquad A = \frac{2}{-5},\; B = \frac{2}{5}
      $$

      **(d)** $s^{2}-s-6=(s-3)(s+2)$, y evaluando el numerador en cada raíz:

      $$
      A = \frac{3\cdot3}{5} = \frac95,
      \qquad
      B = \frac{3\cdot(-2)}{-5} = \frac65
      $$

      ### 3 · La comprobación de siempre

      | apartado | $\lim_{s\to\infty}sF(s)$ | $f(0)$ |
      |---|---|---|
      | (a) | $0$ | $0$ ✓ |
      | (b) | $0$ | $0$ ✓ |
      | (c) | $0$ | $\tfrac25-\tfrac25=0$ ✓ |
      | (d) | $3$ | $\tfrac95+\tfrac65=3$ ✓ |
      | (e) | $2$ | $2$ ✓ |
      | (f) | $2$ | $2$ ✓ |

      **Lo que hay que llevarse.** El denominador decide el camino y el
      numerador decide las constantes. Y el teorema del valor inicial comprueba
      las dos cosas de golpe: si $f(0)$ no coincide con $\lim sF(s)$, algo está
      mal antes.

  - id: una-inversa-por-tres-caminos-y-un-retraso
    titulo: Una inversa por tres caminos, y un retraso que sale seno hiperbólico
    fuente: >-
      Ejercicios 10.6 y 10.7(b) · Problemas complementarios, tema 10 ·
      Cálculo, UPV/EHU. El 10.6 es de la convocatoria 2012/2013 7E, y el
      10.7(a) ya estaba en el sitio.
    nivel: practica
    enunciado: |
      **10.6** Calcular de dos formas distintas
      $\mathcal{L}^{-1}\left[\dfrac{1}{(s+1)^{2}}\right]$.

      **10.7(b)** Utilizando la propiedad de traslación del tiempo, calcular
      la transformada inversa de Laplace de
      $F(s)=\dfrac{2e^{-s}}{s^{2}-4}$.
    pide: La antitransformada de las dos funciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuáles son los tres caminos para invertir
          $\dfrac{1}{(s+1)^{2}}$?
        opciones:
          - texto: >-
              La fórmula de la potencia, la traslación en $s$ aplicada a
              $\tfrac{1}{s^{2}}$, y la convolución de
              $\tfrac{1}{s+1}$ consigo misma
            correcta: true
            mensaje: |
              Los tres dan $te^{-t}$, y por eso el enunciado pide «de dos
              formas distintas»: es un ejercicio para comprobar que las
              propiedades son coherentes entre sí.
          - texto: >-
              Fracciones simples, tabla y derivada
            mensaje: |
              Las fracciones simples no ayudan: $(s+1)^{2}$ ya está
              factorizado, y descomponerlo devolvería lo mismo.
          - texto: >-
              Solo hay uno
            mensaje: |
              El enunciado pide **dos**, y hay al menos tres. Que un resultado
              se pueda obtener por varios caminos es lo que permite
              comprobarlo.

      - tipo: calcular
        titulo: La inversa del 10.6, evaluada
        pregunta: |
          $\mathcal{L}^{-1}\left[\tfrac{1}{(s+1)^{2}}\right] = te^{-t}$.
          ¿Cuánto vale en $t=1$?
        respuesta:
          tipo: numero
          valor: '0.3679'
          tolerancia: 0.0006
          formato: en forma exacta (1/e) o con cuatro decimales
        distractores:
          - valor: '2.7183'
            mensaje: |
              $e$ es $te^{t}$, con el signo del exponente cambiado. El
              denominador es $(s+1)^{2}$, o sea $a=-1$.
          - valor: '1'
            mensaje: |
              $1$ es solo la $t$. Falta la exponencial.
        pista: |
          $1\cdot e^{-1}$.
        desarrollo: |
          $$
          te^{-t}\Big|_{t=1} = e^{-1} \approx 0{,}3679
          $$

      - tipo: calcular
        titulo: La inversa del 10.7(b), evaluada
        pregunta: |
          $\mathcal{L}^{-1}(F) = \operatorname{senh}\left[2(t-1)\right]$ para
          $t\ge1$, y $0$ antes. ¿Cuánto vale en $t=2$?
        respuesta:
          tipo: numero
          valor: '3.6269'
          tolerancia: 0.004
          formato: en forma exacta (senh(2)) o con cuatro decimales
        distractores:
          - valor: '0'
            mensaje: |
              $0$ es el valor **antes** de $t=1$. En $t=2$ ya ha arrancado, y
              hace una unidad de tiempo.
          - valor: '7.2537'
            mensaje: |
              $e^{2}-e^{-2}$ es $2\operatorname{senh}2$: falta dividir entre
              $2$. El $2$ del numerador de $F$ es justo el que hace que la
              respuesta sea el seno hiperbólico sin coeficiente.
        pista: |
          $\operatorname{senh}2 = \tfrac{e^{2}-e^{-2}}{2}$, con
          $e^{2}\approx7{,}389$ y $e^{-2}\approx0{,}135$.
        desarrollo: |
          $$
          \operatorname{senh}2 = \frac{7{,}38906-0{,}13534}{2}
          \approx 3{,}6269
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $\tfrac{2}{s^{2}-4}$ es la transformada de
              $\operatorname{senh}2t$, porque
              $\mathcal{L}\left(\operatorname{senh}\omega t\right)
              = \tfrac{\omega}{s^{2}-\omega^{2}}$.
          - texto: >-
              El factor $e^{-s}$ retrasa la función una unidad y la pone a
              cero antes: $\theta(t-1)\operatorname{senh}\left[2(t-1)\right]$.
          - texto: >-
              El signo menos del denominador es lo que distingue el seno
              hiperbólico del trigonométrico.
          - texto: >-
              Y como el retraso no cambia la forma de la función, tampoco
              cambia su valor en cualquier instante.
            trampa: true
            mensaje: |
              Cambia el valor en todos los instantes: la función retrasada vale
              en $t$ lo que la original valía en $t-1$, y **cero** antes de
              $t=1$. Lo que no cambia es la forma de la gráfica, que es otra
              cosa.
        veredicto: |
          Dos cosas de tabla que conviene no confundir: $s^{2}+\omega^{2}$ da
          seno y coseno, y $s^{2}-\omega^{2}$ da los hiperbólicos. Un signo, y
          cambia la familia entera.
    resolucion: |
      ### 1 · El 10.6, por los tres caminos

      **Por la fórmula de la potencia.**

      $$
      \mathcal{L}\left(t^{n}e^{at}\right) = \frac{n!}{(s-a)^{n+1}}
      \;\xrightarrow{\;n=1,\;a=-1\;}\;
      \mathcal{L}\left(te^{-t}\right) = \frac{1}{(s+1)^{2}}
      $$

      **Por la traslación en $s$.**
      $\mathcal{L}^{-1}\left(\tfrac{1}{s^{2}}\right)=t$, y el
      desplazamiento $s\to s+1$ multiplica por $e^{-t}$.

      **Por convolución.**

      $$
      \frac{1}{(s+1)^{2}} = \frac{1}{s+1}\cdot\frac{1}{s+1}
      \;\longrightarrow\;
      \int_0^{t}e^{-u}e^{-(t-u)}du = e^{-t}\int_0^{t}du = te^{-t}
      $$

      La convolución es la más instructiva: se ve por qué sale una $t$
      multiplicando —el integrando no depende de $u$— y es la misma idea del
      ejercicio 6 del boletín básico.

      ### 2 · El 10.7(b)

      $$
      \frac{2}{s^{2}-4}
      \;\longrightarrow\;
      \operatorname{senh}2t
      $$

      y el factor $e^{-s}$ retrasa una unidad:

      $$
      \boxed{\
      f(t) = \begin{cases}
      0 & t<1\\
      \operatorname{senh}\left[2(t-1)\right] & t\ge1
      \end{cases}\ }
      $$

      ### 3 · Las dos familias de la tabla

      | denominador | familia |
      |---|---|
      | $s^{2}+\omega^{2}$ | $\operatorname{sen}$, $\cos$ |
      | $s^{2}-\omega^{2}$ | $\operatorname{senh}$, $\cosh$ |

      Y el numerador manda igual en las dos: $\omega$ arriba da el seno —o el
      seno hiperbólico—, y $s$ arriba da el coseno.

      **Lo que hay que llevarse.** Que un mismo resultado salga por tres
      caminos no es un adorno: es la forma de comprobarlo cuando no hay
      solución publicada. Y el signo del denominador decide entre funciones
      que oscilan y funciones que se disparan.

      <figure class="figura-examen">
      <svg viewBox="0 0 426 184" role="img" width="426" height="184"
           aria-labelledby="f-inversa-tres-caminos-t f-inversa-tres-caminos-d">
