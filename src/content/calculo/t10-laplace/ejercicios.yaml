  - id: retraso-en-el-tiempo
    titulo: Un retraso escondido en una exponencial
    fuente: Ejercicio 10.7a · Problemas complementarios, tema 10 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Utilizando la propiedad de traslación del tiempo, calcular la
      transformada inversa de Laplace de

      $$
      F(s) = \frac{2(s-1)\,e^{-2s}}{s^{2}-2s+2}
      $$
    pide: La función f(t), definida a trozos.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué se hace con el factor $e^{-2s}$?
        opciones:
          - texto: Se aparta; indica un retraso de 2 unidades en la respuesta
            correcta: true
            mensaje: |
              Eso es. Se antitransforma el resto como si no estuviera, y al
              final se sustituye $t$ por $t-2$ y se multiplica por el escalón.
          - texto: Se descompone en fracciones simples junto con el resto
            mensaje: |
              No es parte de la fracción: es un factor exponencial en $s$. Meterlo
              en las fracciones simples produce un sinsentido algebraico sin
              avisar, y es el error que más descoloca del tema.
          - texto: Se antitransforma como e^{-2t}
            mensaje: |
              Cuidado: $e^{-2s}$ vive en el dominio de $s$, no en el de $t$. Una
              exponencial **en $s$** significa retraso; una exponencial en $t$ es
              otra cosa.
      - tipo: calcular
        titulo: Completar el cuadrado
        pregunta: |
          El denominador $s^{2}-2s+2$ no factoriza. Escrito como
          $(s-a)^{2}+b^{2}$, ¿cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es el coeficiente del término lineal con el signo cambiado, pero
              hay que repartirlo: $s^{2}-2s = (s-1)^{2}-1$, así que $a=1$.
          - valor: '-1'
            mensaje: |
              Signo cambiado. Completando, $s^{2}-2s+2 = (s-1)^{2}+1$, con
              $a = +1$.
        pista: |
          $s^2-2s+2 = (s-1)^2 + 1$. Compara con $(s-a)^2+b^2$.
        desarrollo: |
          $$
          s^{2}-2s+2 = (s-1)^{2}+1
          \qquad\Longrightarrow\qquad
          a = 1,\; b = 1
          $$

          Con eso, $\dfrac{2(s-1)}{(s-1)^{2}+1}$ es un **coseno trasladado**:
          $2e^{t}\cos t$.
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Se aparta el factor $e^{-2s}$, que solo indica un retraso.'
          - texto: 'El resto, $\dfrac{2(s-1)}{(s-1)^{2}+1}$, es la transformada de $2e^{t}\cos t$.'
          - texto: 'El retraso convierte eso en $2e^{t-2}\cos(t-2)$, válido a partir de $t=2$.'
          - texto: 'Antes de $t=2$ la función vale 0, porque el escalón todavía no se ha encendido.'
          - texto: 'El factor $e^{-2s}$ multiplica la respuesta por $e^{-2}$.'
            trampa: true
            mensaje: |
              No es un factor multiplicativo: es un **desplazamiento**. La
              propiedad dice que $e^{-as}F(s)$ corresponde a $f(t-a)u(t-a)$, o
              sea la misma función corrida hacia la derecha, no escalada.
    resolucion: |
      **Tres piezas, y hay que separarlas antes de tocar nada.**

      **1 · El retraso.** El factor $e^{-2s}$ no entra en las fracciones
      simples. Se aparta y se recupera al final.

      **2 · Completar el cuadrado**, porque el denominador no factoriza:

      $$
      s^{2}-2s+2 = (s-1)^{2}+1
      $$

      $$
      \frac{2(s-1)}{(s-1)^{2}+1}
      \;\longrightarrow\;
      2e^{t}\cos t
      $$

      El $(s-1)$ arriba y abajo es la firma del **coseno trasladado en $s$**: la
      traslación $s\to s-1$ equivale a multiplicar por $e^{t}$.

      **3 · Aplicar el retraso.** Se sustituye $t$ por $t-2$:

      $$
      \boxed{\;
      f(t) = \begin{cases}
      0 & t < 2\\[4pt]
      2e^{t-2}\cos(t-2) & t \ge 2
      \end{cases}\;}
      $$

      > **La respuesta es una función a trozos, y hay que escribirla así.** Dar
      > solo $2e^{t-2}\cos(t-2)$ deja fuera la mitad: la función no existe antes
      > de $t=2$, y eso es justo lo que el factor exponencial estaba diciendo.

