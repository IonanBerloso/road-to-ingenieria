  - id: seis-edos-con-laplace
    titulo: Seis EDOs con Laplace, y el dato inicial que entra solo
    fuente: >-
      Ejercicio 10.8 · Problemas complementarios, tema 10 · Cálculo, UPV/EHU.
      Los apartados (c) y (d) son de las convocatorias 2016/2017 6E y
      2019/2020 6E. El resultado impreso de (d) lleva el seno con el signo
      cambiado; ver el aviso de la resolución.
    nivel: practica
    enunciado: |
      Utilizando la transformada de Laplace resolver las siguientes EDOs
      lineales de coeficientes constantes:

      (a) $y''+2y'+5y=0$, $y(0)=2$, $y'(0)=-4$

      (b) $y''-2y'+y=e^{t}+t$, $y(0)=1$, $y'(0)=0$

      (c) $y''+2y'+y=\operatorname{sen}t$, $y(0)=0$, $y'(0)=1$

      (d) $y''+2y'+4y=e^{-3t}$, $y(0)=1$, $y'(0)=-2$

      (e) $y'=5y+3e^{-3t}$, $y'(0)=-7$

      (f) $y''+y=2t$, $y\left(\tfrac{\pi}{4}\right)=\tfrac{\pi}{2}$,
      $y'\left(\tfrac{\pi}{4}\right)=2-\sqrt2$
    pide: La solución de las seis ecuaciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado (f) da los datos en $t=\tfrac{\pi}{4}$, no en $t=0$.
          ¿Qué problema plantea eso para Laplace?
        opciones:
          - texto: >-
              Que la transformada de la derivada usa $y(0)$ y $y'(0)$, y aquí
              no se conocen: hay que hallarlos antes, o resolver por otro
              método
            correcta: true
            mensaje: |
              Eso es. Laplace está hecho para problemas de valor inicial **en
              cero**. Con datos en otro punto, o se trasladan o se resuelve la
              general y se imponen al final.
          - texto: >-
              Ninguno: la fórmula vale igual
            mensaje: |
              La fórmula $\mathcal{L}(y')=sY-y(0)$ pide $y(0)$
              explícitamente. Con datos en $\tfrac{\pi}{4}$ no se tiene.
          - texto: >-
              Que la ecuación no tiene solución
            mensaje: |
              La tiene, y es $y=\cos t-\operatorname{sen}t+2t$. Lo que falla
              es el atajo, no el problema.

      - tipo: calcular
        titulo: El coeficiente del seno en (d)
        pregunta: |
          La solución de (d) es $y = \tfrac17 e^{-3t} + \tfrac67 e^{-t}\cos\sqrt3\,t + C\,e^{-t}\operatorname{sen}\sqrt3\,t$. Imponiendo $y'(0)=-2$, ¿cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '-0.4124'
          tolerancia: 0.002
          formato: en forma exacta (-5/(7sqrt(3))) o con cuatro decimales
        distractores:
          - valor: '0.4124'
            mensaje: |
              El signo, y es justo el que el boletín publica cambiado. Con
              $C=+\tfrac{5}{7\sqrt3}$ sale $y'(0)=-\tfrac47$, no $-2$.
          - valor: '-0.7143'
            mensaje: |
              $-\tfrac57$ olvida dividir entre $\sqrt3$: la derivada del seno
              trae ese factor.
        pista: |
          $y'(0) = -\tfrac67 + \sqrt3\,C - \tfrac37$, y eso tiene que valer
          $-2$.
        desarrollo: |
          $$
          y'(0) = -\frac67 + \sqrt3\,C - \frac37 = -2
          $$

          $$
          \sqrt3\,C = -2 + \frac97 = -\frac57
          \;\Longrightarrow\;
          C = -\frac{5}{7\sqrt3} \approx -0{,}4124
          $$

      - tipo: calcular
        titulo: El valor inicial de (e)
        pregunta: |
          La solución de (e) es
          $y = -\tfrac38 e^{-3t}-\tfrac{13}{8}e^{5t}$. ¿Cuánto vale $y(0)$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '-7'
            mensaje: |
              $-7$ es $y'(0)$, que es el dato que da el enunciado. Fíjate: la
              condición **no** es sobre $y$ sino sobre su derivada, y eso es
              raro en una EDO de primer orden.
          - valor: '2'
            mensaje: |
              El signo. Los dos coeficientes son negativos.
        pista: |
          $-\tfrac38-\tfrac{13}{8} = -\tfrac{16}{8}$.
        desarrollo: |
          $$
          y(0) = -\frac38-\frac{13}{8} = -\frac{16}{8} = -2
          $$

          Y se comprueba con la ecuación: $y'(0) = 5y(0)+3 = -10+3 = -7$,
          que es el dato del enunciado ✓

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $\mathcal{L}(y')=sY-y(0)$ y
              $\mathcal{L}(y'')=s^{2}Y-sy(0)-y'(0)$: los datos iniciales entran
              al transformar, no al final.
          - texto: >-
              Despejando $Y(s)$ queda una función racional, y
              antitransformarla es el trabajo que queda.
          - texto: >-
              En (b) y (c) hay resonancia con la raíz doble, y eso se ve en el
              denominador de $Y$: aparece $(s-1)^{3}$ o $(s+1)^{3}$.
          - texto: >-
              Y por eso Laplace evita tener que buscar la solución particular:
              el método no distingue entre homogénea y particular.
            trampa: true
            mensaje: |
              La primera mitad es cierta y la segunda no la explica: Laplace no
              distingue **porque resuelve el problema completo de una vez**,
              no porque el método sea ciego a la estructura. De hecho la
              estructura reaparece en las fracciones simples: cada raíz del
              denominador es un término de la homogénea, y los polos que
              vienen del segundo miembro son la particular.
        veredicto: |
          La ventaja real de Laplace sobre el método clásico es que **las
          condiciones iniciales entran al principio**. La desventaja es que
          hay que antitransformar una racional que puede ser fea. En (b), con
          $(s-1)^{3}$ en el denominador, esa parte es la mitad del trabajo.
    resolucion: |
      **Los seis resultados.**

      | apartado | solución |
      |---|---|
      | (a) | $e^{-t}\left(2\cos2t-\operatorname{sen}2t\right)$ |
      | (b) | $-e^{t}+\tfrac12 t^{2}e^{t}+t+2$ |
      | (c) | $\tfrac12 e^{-t}-\tfrac12\cos t+\tfrac32 te^{-t}$ |
      | (d) | $\tfrac17 e^{-3t}+\tfrac67 e^{-t}\cos\sqrt3\,t-\tfrac{5}{7\sqrt3}e^{-t}\operatorname{sen}\sqrt3\,t$ |
      | (e) | $-\tfrac38 e^{-3t}-\tfrac{13}{8}e^{5t}$ |
      | (f) | $\cos t-\operatorname{sen}t+2t$ |

      ### 1 · El método

      $$
      \mathcal{L}(y')=sY-y(0),
      \qquad
      \mathcal{L}(y'')=s^{2}Y-s\,y(0)-y'(0)
      $$

      Se transforma la ecuación, se despeja $Y(s)$, y se antitransforma.

      ### 2 · El aviso sobre el impreso

      El boletín publica para (d)

      $$
      \frac17 e^{-3t}+\frac67 e^{-t}\cos\sqrt3\,t
      + \frac{5}{7\sqrt3}e^{-t}\operatorname{sen}\sqrt3\,t
      $$

      con el seno **positivo**. Esa función cumple la ecuación y $y(0)=1$,
      pero su derivada en cero vale $-\tfrac47$ y el enunciado pide $-2$.
      Imponiendo bien la condición sale

      $$
      \sqrt3\,C = -2+\frac97 = -\frac57
      \;\Longrightarrow\;
      C = -\frac{5}{7\sqrt3}
      $$

      Comprobado analíticamente y por derivación numérica. Aquí se publica el
      signo que cuadra.

      ### 3 · El apartado (e), que tiene truco

      El enunciado da $y'(0)=-7$, no $y(0)$: una condición sobre la
      **derivada** en una ecuación de primer orden. Se convierte en una sobre
      $y$ usando la propia ecuación:

      $$
      y'(0) = 5y(0)+3 \;\Longrightarrow\; -7 = 5y(0)+3
      \;\Longrightarrow\; y(0) = -2
      $$

      ### 4 · El apartado (f), donde Laplace no es el camino

      Los datos están en $t=\tfrac{\pi}{4}$, y la transformada de la derivada
      pide $y(0)$. Lo más corto es resolver por el método clásico —la
      particular es $2t$ y la homogénea $k_1\cos t+k_2\operatorname{sen}t$— e
      imponer los datos al final.

      **Lo que hay que llevarse.** Laplace es el método de los problemas de
      valor inicial **en cero**. Cuando los datos están en otro punto, o hay
      que trasladarlos o conviene otro método, y reconocerlo de entrada ahorra
      el rato de intentar forzarlo.

  - id: dos-edos-de-coeficientes-no-constantes
    titulo: Dos EDOs con una t delante, y la derivada de la transformada
    fuente: Ejercicio 10.9 · Problemas complementarios, tema 10 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Utilizando la transformada de Laplace resolver las siguientes EDOs
      lineales de coeficientes no constantes:

      (a) $ty'-2y=2t$, $y(1)=3$

      (b) $ty''+2ty'+2y=0$, $y(0)=0$, $y'(0)=3$
    pide: La solución de las dos ecuaciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué propiedad convierte un coeficiente $t$ en algo manejable?
        opciones:
          - texto: >-
              La derivada de la transformada:
              $\mathcal{L}\left(t\,g(t)\right) = -G'(s)$, así que una $t$
              delante se vuelve una **derivada en $s$**
            correcta: true
            mensaje: |
              Eso es, y tiene una consecuencia grande: la ecuación transformada
              ya no es algebraica, es **otra ecuación diferencial** —en $s$—.
              Lo que se gana es que suele ser de orden menor.
          - texto: >-
              La traslación en $s$
            mensaje: |
              Esa la pide una exponencial. Una $t$ multiplicando pide derivar.
          - texto: >-
              No hay ninguna: con coeficientes no constantes Laplace no sirve
            mensaje: |
              Sirve, y en estos dos casos muy bien. Lo que pasa es que en vez
              de una ecuación algebraica sale una diferencial de primer orden
              en $s$, que se resuelve con lo del tema 9.

      - tipo: calcular
        titulo: El apartado (a), evaluado
        pregunta: |
          La solución de (a) es $y=5t^{2}-2t$. ¿Cuánto vale en $t=2$?
        respuesta:
          tipo: numero
          valor: '16'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '20'
            mensaje: |
              $5t^{2}$ solo. Falta restar $2t$, que en $t=2$ vale $4$.
          - valor: '18'
            mensaje: |
              Has restado $2$ en vez de $2t$. El término es lineal en $t$.
        pista: |
          $5\cdot4-2\cdot2$.
        desarrollo: |
          $$
          y(2) = 20-4 = 16
          $$

          Y la comprobación: $ty'-2y = t(10t-2)-2(5t^{2}-2t)
          = 10t^{2}-2t-10t^{2}+4t = 2t$ ✓, con $y(1)=5-2=3$ ✓

      - tipo: calcular
        titulo: El apartado (b), evaluado
        pregunta: |
          La solución de (b) es $y=3te^{-2t}$. ¿Cuánto vale en $t=1$?
        respuesta:
          tipo: numero
          valor: '0.406'
          tolerancia: 0.001
          formato: en forma exacta (3/e²) o con tres decimales
        distractores:
          - valor: '3'
            mensaje: |
              $3$ es $y'(0)$, y también el coeficiente. En $t=1$ la exponencial
              ya ha dividido por $e^{2}\approx7{,}39$.
          - valor: '1.104'
            mensaje: |
              $3e^{-1}$: el exponente es $-2t$, no $-t$.
        pista: |
          $e^{-2}\approx0{,}1353$.
        desarrollo: |
          $$
          y(1) = 3e^{-2} \approx 3\cdot0{,}13534 \approx 0{,}406
          $$

          El máximo de $3te^{-2t}$ está en $t=\tfrac12$ y vale
          $\tfrac{3}{2e}\approx0{,}552$: en $t=1$ ya está bajando.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $\mathcal{L}(tg)=-G'(s)$, un coeficiente $t$ convierte la
              ecuación transformada en una diferencial de primer orden en $s$.
          - texto: >-
              En (a), transformando sale
              $-\left(sY-y(0)\right)'-2Y = \tfrac{2}{s^{2}}$, y ordenando,
              una lineal en $Y(s)$.
          - texto: >-
              Esa lineal se resuelve con factor integrante, se antitransforma y
              se impone el dato $y(1)=3$ al final.
          - texto: >-
              Y como la ecuación transformada es de primer orden, siempre es
              más fácil que la original.
            trampa: true
            mensaje: |
              No siempre: si la original es de primer orden con coeficiente
              $t$, la transformada también lo es y no se gana nada; y si la
              original tiene $t^{2}$ delante, la transformada es de **segundo**
              orden y se empeora. El método compensa cuando el coeficiente $t$
              acompaña a la derivada de orden más alto, como en (b).
        veredicto: |
          Es el caso menos habitual de Laplace y el más elegante: multiplicar
          por $t$ en el tiempo es derivar en $s$, así que una ecuación con
          coeficientes polinómicos se convierte en otra ecuación diferencial.
          A veces se gana y a veces no — y mirar de antemano cuál es cuál es
          parte del ejercicio.
    resolucion: |
      **Los dos resultados.**

      | apartado | solución |
      |---|---|
      | (a) | $y = 5t^{2}-2t$ |
      | (b) | $y = 3te^{-2t}$ |

      ### 1 · La propiedad que lo hace posible

      $$
      \mathcal{L}\left(t\,g(t)\right) = -\frac{dG}{ds}
      $$

      Un coeficiente $t$ en la ecuación se convierte en una derivada respecto
      de $s$: la ecuación transformada es **diferencial**, no algebraica.

      ### 2 · El apartado (b), paso a paso

      $$
      \mathcal{L}\left(ty''\right) = -\frac{d}{ds}\left(s^{2}Y-sy(0)-y'(0)\right)
      = -2sY - s^{2}Y' + y(0)
      $$

      $$
      \mathcal{L}\left(2ty'\right) = -2\frac{d}{ds}\left(sY-y(0)\right)
      = -2Y-2sY'
      $$

      Sumando con $2Y$ y usando $y(0)=0$:

      $$
      -\left(s^{2}+2s\right)Y' - 2sY = 0
      \;\Longrightarrow\;
      \frac{Y'}{Y} = \frac{-2s}{s(s+2)} = \frac{-2}{s+2}
      $$

      $$
      Y = \frac{K}{(s+2)^{2}}
      \;\longrightarrow\;
      y = K\,te^{-2t}
      $$

      Y con $y'(0)=3$: $K=3$.

      ### 3 · Las comprobaciones

      | apartado | sustituyendo | dato inicial |
      |---|---|---|
      | (a) | $t(10t-2)-2(5t^{2}-2t)=2t$ ✓ | $y(1)=3$ ✓ |
      | (b) | $3e^{-2t}\left[t(4t-4)+2t(1-2t)+2t\right]=0$ ✓ | $y(0)=0$, $y'(0)=3$ ✓ |

      **Lo que hay que llevarse.** Este es el único caso del tema en que la
      ecuación transformada no es algebraica, y por eso conviene reconocerlo
      antes de empezar: **si hay una $t$ multiplicando, va a salir una
      diferencial en $s$**. Suele ser de orden menor que la original, que es lo
      que compensa.

  - id: dos-sistemas-mas-con-laplace
    titulo: Dos sistemas más, y el que resulta tener la misma solución dos veces
    fuente: >-
      Ejercicio 10.10, apartados (b) y (d) · Problemas complementarios, tema 10
      · Cálculo, UPV/EHU. El (b) es de la convocatoria 2017/2018 7E. Los
      apartados (a) y (c) ya estaban en el sitio, y el (d) es el mismo sistema
      que el 7(b) del boletín básico.
    nivel: practica
    enunciado: |
      Utilizando la transformada de Laplace resolver los siguientes sistemas
      de EDOs:

      (b) $\begin{cases} x'=x+y-e^{t}\\ y'=x-y+e^{t}\\ x(0)=y(0)=1\end{cases}$

      (d) $\begin{cases} x'=2x+y\\ y'=3x+4y\\ x(0)=1,\; y(0)=0\end{cases}$
    pide: Las funciones x(t) e y(t) de los dos sistemas.
    pasos:
      - tipo: reconocer
        pregunta: |
          En (b), los términos $-e^{t}$ y $+e^{t}$ son opuestos y las
          condiciones iniciales, iguales. ¿Qué sugiere eso?
        opciones:
          - texto: >-
              Que conviene mirar la **suma** $x+y$: al sumar las dos
              ecuaciones, los $e^{t}$ se cancelan y queda
              $(x+y)'=2(x+y)$… casi
            correcta: true
            mensaje: |
              Buena intuición, y es la que lleva a la respuesta: sumando sale
              $(x+y)' = 2x$, y restando $(x-y)' = 2y - 2e^{t}$. Con
              $x(0)=y(0)$ el sistema es simétrico y la solución sale
              $x=y=e^{t}$.
          - texto: >-
              Que el sistema no tiene solución
            mensaje: |
              Un sistema lineal con condiciones iniciales siempre tiene
              solución única. La simetría es una pista, no un obstáculo.
          - texto: >-
              Que hay que resolverlas por separado
            mensaje: |
              No se puede: cada ecuación tiene las dos incógnitas. Lo que sí se
              puede es cambiar de variables a la suma y la diferencia.

      - tipo: calcular
        titulo: El apartado (b), evaluado
        pregunta: |
          La solución de (b) es $x(t)=y(t)=e^{t}$. ¿Cuánto vale $x(1)$?
        respuesta:
          tipo: numero
          valor: '2.7183'
          tolerancia: 0.003
          formato: en forma exacta (e) o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es $x(0)$. La solución crece.
          - valor: '0'
            mensaje: |
              $x-y$ vale $0$ siempre, pero $x$ no: las dos funciones crecen
              juntas.
        pista: |
          $x(t)=e^{t}$ evaluada en $t=1$ es $e$.
        desarrollo: |
          $$
          x(1) = e \approx 2{,}7183
          $$

          Y la comprobación, que es de dos líneas: con $x=y=e^{t}$,

          $$
          x' = e^{t}
          \quad\text{y}\quad
          x+y-e^{t} = e^{t}+e^{t}-e^{t} = e^{t} \;\checkmark
          $$

      - tipo: calcular
        titulo: El apartado (d), evaluado
        pregunta: |
          La solución de (d) es $x(t)=\tfrac34 e^{t}+\tfrac14 e^{5t}$. ¿Cuánto
          vale en $t=1$?
        respuesta:
          tipo: numero
          valor: '39.142'
          tolerancia: 0.05
          formato: con tres decimales
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es $x(0)$. Con un $e^{5t}$ dentro, en $t=1$ la solución ya ha
              crecido mucho.
          - valor: '37.103'
            mensaje: |
              $\tfrac{e^{5}}{4}$ solo. Falta el $\tfrac34 e$, que vale
              $2{,}04$: poco comparado con el otro, pero no cero.
        pista: |
          $e\approx2{,}71828$ y $e^{5}\approx148{,}41316$.
        desarrollo: |
          $$
          x(1) = \frac34\cdot2{,}71828 + \frac14\cdot148{,}41316
          = 2{,}03871 + 37{,}10329 \approx 39{,}142
          $$

          El término de $e^{5t}$ se lleva el $95\%$: con dos autovalores
          positivos manda siempre el mayor, y cada vez más.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Transformando, cada sistema de EDOs se vuelve un sistema
              algebraico en $X(s)$ e $Y(s)$, con las condiciones iniciales ya
              dentro.
          - texto: >-
              El determinante de ese sistema es el polinomio característico de
              la matriz de coeficientes.
          - texto: >-
              En (d) ese polinomio es $s^{2}-6s+5$, con raíces $1$ y $5$, y
              por eso la solución lleva $e^{t}$ y $e^{5t}$.
          - texto: >-
              Y en (b), como el segundo miembro es $\pm e^{t}$, el
              denominador tiene además una raíz en $s=1$ que produce un
              $te^{t}$.
            trampa: true
            mensaje: |
              No hay $te^{t}$ en la solución: es $x=y=e^{t}$ a secas. La raíz
              del segundo miembro coincide con una del sistema, sí, pero los
              numeradores se cancelan y no llega a producirse resonancia.
              Conviene comprobarlo en vez de darlo por hecho.
        veredicto: |
          El apartado (d) es el mismo sistema que el ejercicio 7(b) del
          boletín básico, y ahí las soluciones publicadas de (b) y (c) están
          intercambiadas. **Esta es la buena**, y sirve de confirmación.
    resolucion: |
      **Los dos resultados.**

      | apartado | solución |
      |---|---|
      | (b) | $x(t)=y(t)=e^{t}$ |
      | (d) | $x=\tfrac34 e^{t}+\tfrac14 e^{5t}$, &nbsp; $y=-\tfrac34 e^{t}+\tfrac34 e^{5t}$ |

      ### 1 · El apartado (d), paso a paso

      $$
      \begin{cases}
      sX-1 = 2X+Y\\
      sY = 3X+4Y
      \end{cases}
      \;\Longrightarrow\;
      \begin{cases}
      (s-2)X-Y = 1\\
      -3X+(s-4)Y = 0
      \end{cases}
      $$

      Determinante: $(s-2)(s-4)-3 = s^{2}-6s+5 = (s-1)(s-5)$.

      $$
      X = \frac{s-4}{(s-1)(s-5)},
      \qquad
      Y = \frac{3}{(s-1)(s-5)}
      $$

      Fracciones simples, evaluando el numerador en cada raíz:

      $$
      X: \; \frac{1-4}{1-5} = \frac34 \;\text{(en }s=1),
      \qquad \frac{5-4}{5-1} = \frac14 \;\text{(en }s=5)
      $$

      ### 2 · El apartado (b), por simetría

      Sumando y restando las dos ecuaciones:

      $$
      (x+y)' = 2x,
      \qquad
      (x-y)' = 2y-2e^{t}
      $$

      Con $x(0)=y(0)=1$, la solución $x=y=e^{t}$ cumple las dos y es única.
      Sustituyéndola:

      $$
      x' = e^{t} = x+y-e^{t},
      \qquad
      y' = e^{t} = x-y+e^{t} \;\checkmark
      $$

      ### 3 · La confirmación cruzada

      El sistema (d) es exactamente el del ejercicio **7(b) del boletín
      básico**, donde los resultados de (b) y (c) están intercambiados. La
      solución que aquí se publica es la que cuadra, y sirve de comprobación
      externa para la corrección que se declara allí.

      **Lo que hay que llevarse.** Antes de transformar, mirar si el sistema
      tiene simetría: en (b), la suma y la diferencia lo desacoplan y la
      solución se ve casi a ojo. Y después de resolver, sustituir siempre —es
      lo único que distingue una solución de otra que cumple las condiciones
      iniciales por casualidad.

  - id: una-edo-vuelta-sistema
    titulo: Una EDO de segundo orden convertida en sistema
    fuente: >-
      Ejercicio 10.11 · Problemas complementarios, tema 10 · Cálculo, UPV/EHU
      (2013/2014 6E). El resultado impreso no cumple ni la ecuación ni las
      condiciones iniciales; ver el aviso de la resolución.
    nivel: practica
    enunciado: |
      Transformar el problema de EDO con condición inicial
      $x''(t)-x'(t)-2x(t)=4$, $x(0)=3$, $x'(0)=1$ en un sistema de dos EDOs y
      resolverlo utilizando la transformada de Laplace.
    pide: El sistema equivalente y su solución.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se convierte una EDO de segundo orden en un sistema de dos de
          primer orden?
        opciones:
          - texto: >-
              Llamando $y=x'$: entonces $x'=y$ e
              $y'=x''=y+2x+4$, con $x(0)=3$ e $y(0)=1$
            correcta: true
            mensaje: |
              Eso es. El truco es **bautizar la derivada**: la primera ecuación
              es la definición y la segunda es la ecuación original despejada.
          - texto: >-
              Derivando la ecuación otra vez
            mensaje: |
              Eso la sube a tercer orden. Lo que hace falta es bajar el orden
              añadiendo una incógnita.
          - texto: >-
              Separando la parte homogénea de la particular
            mensaje: |
              Eso es otra descomposición, la del método clásico, y no produce
              ningún sistema.

      - tipo: calcular
        titulo: La solución, evaluada
        pregunta: |
          La solución es $x(t)=-2+2e^{2t}+3e^{-t}$. ¿Cuánto vale en $t=1$?
        respuesta:
          tipo: numero
          valor: '13.882'
          tolerancia: 0.02
          formato: con tres decimales
        distractores:
          - valor: '3'
            mensaje: |
              $3$ es $x(0)$. En $t=1$ el $2e^{2t}$ ya vale casi $15$.
          - valor: '14.778'
            mensaje: |
              $2e^{2}$ solo. Faltan el $-2$ y el $3e^{-1}$, que casi se
              cancelan entre sí pero no del todo.
        pista: |
          $e^{2}\approx7{,}38906$ y $e^{-1}\approx0{,}36788$.
        desarrollo: |
          $$
          x(1) = -2 + 2\cdot7{,}38906 + 3\cdot0{,}36788
          = -2 + 14{,}77811 + 1{,}10364 \approx 13{,}882
          $$

      - tipo: calcular
        titulo: El valor de equilibrio
        pregunta: |
          Si en vez de $x(0)=3$, $x'(0)=1$ los datos fueran tales que la
          solución no creciera, ¿cuál sería el valor constante que resuelve
          $x''-x'-2x=4$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '4'
            mensaje: |
              $4$ es el segundo miembro. Para una solución constante,
              $x''=x'=0$ y queda $-2x=4$.
          - valor: '2'
            mensaje: |
              El signo. De $-2x=4$ sale $x=-2$: hay que dividir entre $-2$, y
              eso cambia el signo del $4$.
        pista: |
          Una solución constante tiene $x''=x'=0$.
        desarrollo: |
          $$
          -2x = 4 \;\Longrightarrow\; x = -2
          $$

          Ese $-2$ es la **solución particular** de la ecuación, y es el
          término independiente de la respuesta. No es un equilibrio estable:
          la raíz $s=2$ es positiva, así que cualquier desviación se dispara.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $y=x'$, el sistema es $x'=y$, $y'=y+2x+4$, con $x(0)=3$ e
              $y(0)=1$.
          - texto: >-
              El polinomio característico es $s^{2}-s-2=(s-2)(s+1)$, así que
              la solución lleva $e^{2t}$ y $e^{-t}$.
          - texto: >-
              La particular constante es $-2$, y las constantes salen de
              $x(0)=3$ y $x'(0)=1$: $x=-2+2e^{2t}+3e^{-t}$.
          - texto: >-
              Y como hay una raíz positiva y otra negativa, la solución tiende
              a un valor finito.
            trampa: true
            mensaje: |
              Con una raíz positiva la solución **se dispara**: el $e^{2t}$
              domina y $x\to+\infty$. Que haya también una raíz negativa solo
              significa que uno de los términos se apaga; basta con que una
              sea positiva para que no haya límite finito.
        veredicto: |
          Convertir una EDO de orden $n$ en un sistema de $n$ ecuaciones de
          primer orden es lo que hacen todos los métodos numéricos, y aquí
          sirve para ver que Laplace da lo mismo por los dos caminos.
    resolucion: |
      **Datos.** $x''-x'-2x=4$, $x(0)=3$, $x'(0)=1$.

      ### 1 · El sistema

      Con $y=x'$:

      $$
      \begin{cases}
      x' = y\\
      y' = y+2x+4
      \end{cases}
      \qquad x(0)=3,\; y(0)=1
      $$

      La primera ecuación es la definición de $y$; la segunda, la original
      despejada.

      ### 2 · La solución

      $$
      \left(s^{2}-s-2\right)X = \frac4s + 3s - 2
      $$

      con $s^{2}-s-2=(s-2)(s+1)$. Descomponiendo,

      $$
      \boxed{\ x(t) = -2 + 2e^{2t} + 3e^{-t}\ }
      $$

      ### 3 · El aviso sobre el impreso

      El boletín publica $x(t)=2+e^{-t}+e^{t}$. No puede ser, por dos razones
      independientes:

      1. $x(0) = 2+1+1 = 4$, y el enunciado pide $3$.
      2. El polinomio característico es $(s-2)(s+1)$: la solución puede llevar
         $e^{2t}$ y $e^{-t}$, pero **no $e^{t}$**, que no es solución de la
         homogénea.

      Sustituyendo la impresa en la ecuación se comprueba: no da $4$.

      La que se publica aquí cumple las dos cosas:

      | qué | comprobación |
      |---|---|
      | $x(0)$ | $-2+2+3 = 3$ ✓ |
      | $x'(0)$ | $4-3 = 1$ ✓ |
      | la ecuación | $x''-x'-2x = 4$ ✓ |

      ### 4 · Qué hace la solución

      | término | qué es |
      |---|---|
      | $-2$ | la particular constante |
      | $3e^{-t}$ | transitorio, se apaga |
      | $2e^{2t}$ | el que manda a la larga |

      **Lo que hay que llevarse.** Un resultado publicado se comprueba con dos
      cosas: las condiciones iniciales y **las raíces que puede llevar**. Un
      término $e^{t}$ en una ecuación cuyo polinomio característico no tiene
      raíz en $1$ es imposible, y eso se ve sin sustituir nada.

  - id: cinco-ecuaciones-integrales
    titulo: Cinco ecuaciones con la incógnita dentro de una integral
    fuente: >-
      Ejercicio 10.12, apartados (a), (b), (c), (f) y (g) · Problemas
      complementarios, tema 10 · Cálculo, UPV/EHU. Los apartados (d) y (e) ya
      estaban en el sitio. El (f) y el (g) son de la convocatoria 2019/2020 7E.
    nivel: practica
    enunciado: |
      Utilizando la transformada de Laplace resolver las siguientes ecuaciones
      integrales:

      (a) $\displaystyle\int_0^{t}u(z)\,dz + u(t) = 2t$

      (b) $\displaystyle\int_0^{t}z\,u(z)\,dz = 1 + t\,u(t) - e^{t}$

      (c) $y(t) + \displaystyle\int_0^{t}y(z)\,dz = e^{2t}$

      (f) $y = t + 2\displaystyle\int_0^{t}\operatorname{sen}(t-u)\,y(u)\,du$

      (g) $y' + y - 2\displaystyle\int_0^{t}y(u)\,du = t$, &nbsp; $y(0)=0$
    pide: La función incógnita de las cinco ecuaciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué distingue el apartado (f) de los otros cuatro?
        opciones:
          - texto: >-
              Que su integral es una **convolución**,
              $\operatorname{sen}*y$, mientras que las demás son
              $\int_0^{t}y$, que es la convolución con $1$
            correcta: true
            mensaje: |
              Eso es. Y las dos se transforman igual de fácil:
              $\mathcal{L}\left(f*g\right)=F\,G$, y
              $\mathcal{L}\left(\int_0^{t}y\right)=\tfrac{Y}{s}$ es el caso
              $f=1$.
          - texto: >-
              Que no se puede resolver con Laplace
            mensaje: |
              Es justamente el caso para el que Laplace está hecho: la
              convolución se vuelve un producto, y la ecuación, algebraica.
          - texto: >-
              Que tiene dos incógnitas
            mensaje: |
              Solo hay una, $y$. La $u$ es la variable de integración.

      - tipo: calcular
        titulo: El apartado (a), evaluado
        pregunta: |
          La solución de (a) es $u(t)=2-2e^{-t}$. ¿Cuánto vale en $t=1$?
        respuesta:
          tipo: numero
          valor: '1.2642'
          tolerancia: 0.002
          formato: en forma exacta (2-2/e) o con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es el límite cuando $t\to\infty$. En $t=1$ la exponencial
              todavía resta $0{,}74$.
          - valor: '0'
            mensaje: |
              $0$ es $u(0)$, y tiene sentido: en $t=0$ la ecuación dice
              $0+u(0)=0$.
        pista: |
          $e^{-1}\approx0{,}36788$.
        desarrollo: |
          $$
          u(1) = 2-2\cdot0{,}36788 = 2-0{,}73576 \approx 1{,}2642
          $$

          Y la comprobación directa:

          $$
          \int_0^{1}\left(2-2e^{-z}\right)dz + u(1)
          = \left(2+2e^{-1}-2\right) + \left(2-2e^{-1}\right) = 2 \;\checkmark
          $$

      - tipo: calcular
        titulo: El apartado (f), evaluado
        pregunta: |
          La solución de (f) es $y = e^{t}-e^{-t}-t$. ¿Cuánto vale en $t=1$?
        respuesta:
          tipo: numero
          valor: '1.3504'
          tolerancia: 0.002
          formato: con cuatro decimales
        distractores:
          - valor: '2.3504'
            mensaje: |
              Te has dejado el $-t$, que en $t=1$ resta exactamente $1$.
          - valor: '2.7015'
            mensaje: |
              $e-e^{-1}$ es $2\operatorname{senh}1$, sin restar la $t$.
              Ese es el mismo error visto de otra forma.
        pista: |
          $e\approx2{,}71828$ y $e^{-1}\approx0{,}36788$.
        desarrollo: |
          $$
          y(1) = 2{,}71828 - 0{,}36788 - 1 \approx 1{,}3504
          $$

          Fíjate en la forma: $y = 2\operatorname{senh}t - t$. La ecuación
          tenía un seno dentro y la solución sale con un seno **hiperbólico**,
          porque el denominador acaba siendo $s^{2}-1$ y no $s^{2}+1$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $\mathcal{L}\left(\int_0^{t}y\right)=\tfrac{Y(s)}{s}$, y
              $\mathcal{L}\left(f*y\right)=F(s)\,Y(s)$: la integral se vuelve
              un producto.
          - texto: >-
              Con eso, cada ecuación integral se convierte en una **algebraica**
              en $Y(s)$, que se despeja de una línea.
          - texto: >-
              En (g) hay además una derivada, así que la condición inicial
              $y(0)=0$ entra por $\mathcal{L}(y')=sY-y(0)$.
          - texto: >-
              Y en (b), como la incógnita aparece multiplicada por $t$ dentro
              y fuera de la integral, hay que derivar la ecuación antes de
              transformar.
            trampa: true
            mensaje: |
              No hace falta derivar nada: las dos $t$ se tratan con la
              propiedad de la derivada de la transformada,
              $\mathcal{L}(tu)=-U'(s)$, y la ecuación transformada sale
              diferencial en $s$ —de primer orden— igual que en el ejercicio
              10.9. Derivar la ecuación original es otro camino, más largo.
        veredicto: |
          Las ecuaciones integrales son **el** motivo de que la convolución
          esté en el temario. Sin ella, una ecuación con la incógnita dentro
          de una integral no se puede atacar; con ella, es una línea de
          álgebra.
    resolucion: |
      **Los cinco resultados.**

      | apartado | solución |
      |---|---|
      | (a) | $u = 2-2e^{-t}$ |
      | (b) | $u = e^{t}$ |
      | (c) | $y = \tfrac{e^{-t}}{3}+\tfrac{2e^{2t}}{3}$ |
      | (f) | $y = e^{t}-e^{-t}-t$ |
      | (g) | $y = \tfrac{e^{t}}{3}+\tfrac{e^{-2t}}{6}-\tfrac12$ |

      ### 1 · Las dos propiedades que lo resuelven todo

      $$
      \mathcal{L}\left(\int_0^{t}y(z)\,dz\right) = \frac{Y(s)}{s},
      \qquad
      \mathcal{L}\left(\int_0^{t}f(t-u)y(u)\,du\right) = F(s)\,Y(s)
      $$

      La primera es el caso $f=1$ de la segunda.

      ### 2 · Paso a paso, en (c)

      $$
      Y + \frac{Y}{s} = \frac{1}{s-2}
      \;\Longrightarrow\;
      Y\,\frac{s+1}{s} = \frac{1}{s-2}
      \;\Longrightarrow\;
      Y = \frac{s}{(s+1)(s-2)}
      $$

      $$
      = \frac{1/3}{s+1} + \frac{2/3}{s-2}
      \;\longrightarrow\;
      y = \frac{e^{-t}}{3}+\frac{2e^{2t}}{3}
      $$

      ### 3 · El apartado (f), con convolución de verdad

      $$
      Y = \frac{1}{s^{2}} + 2\cdot\frac{1}{s^{2}+1}\cdot Y
      \;\Longrightarrow\;
      Y\,\frac{s^{2}-1}{s^{2}+1} = \frac{1}{s^{2}}
      $$

      $$
      Y = \frac{s^{2}+1}{s^{2}\left(s^{2}-1\right)}
      = -\frac{1}{s^{2}}+\frac{1}{s-1}-\frac{1}{s+1}
      \;\longrightarrow\;
      y = e^{t}-e^{-t}-t
      $$

      **El detalle que hay que ver**: el $s^{2}+1$ del seno acaba en el
      numerador y el denominador se vuelve $s^{2}-1$. Por eso una ecuación con
      un seno dentro tiene por solución un seno **hiperbólico**.

      ### 4 · El apartado (g), con derivada e integral a la vez

      $$
      sY + Y - \frac{2Y}{s} = \frac{1}{s^{2}}
      \;\Longrightarrow\;
      Y = \frac{1}{s(s+2)(s-1)}
      $$

      $$
      = -\frac{1/2}{s}+\frac{1/6}{s+2}+\frac{1/3}{s-1}
      \;\longrightarrow\;
      y = \frac{e^{t}}{3}+\frac{e^{-2t}}{6}-\frac12
      $$

      ### 5 · La comprobación

      Todas cumplen su ecuación en $t=0$, que es el contraste más barato:

      | apartado | en $t=0$ | la ecuación pide |
      |---|---|---|
      | (a) | $u(0)=0$ | $0+u(0)=0$ ✓ |
      | (c) | $y(0)=1$ | $y(0)+0=1$ ✓ |
      | (f) | $y(0)=0$ | $0+0=0$ ✓ |
      | (g) | $y(0)=0$ | dado ✓ |

      **Lo que hay que llevarse.** Una ecuación integral se transforma en una
      algebraica, y ahí Laplace no tiene rival: ningún otro método del temario
      sabe qué hacer con una incógnita dentro de una integral. Reconocer la
      convolución —el argumento $t-u$— es lo único que hay que entrenar.

  - id: el-circuito-rlc-y-la-fuente-que-llega-tarde
    titulo: Un circuito RLC, y la misma respuesta dos segundos después
    fuente: Ejercicio 10.13 · Problemas complementarios, tema 10 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular la carga $q(t)$ en el condensador de un circuito RLC en serie
      para los siguientes casos:

      (a) $e(t)=150\,\text{V}$

      (b) $e(t)=150\,\theta(t-2)\,\text{V}$

      Datos: $R=20\,\Omega$, $L=1\,\text{H}$, $C=0{,}005\,\text{F}$.
      Condiciones iniciales: $q(0)=0$ e $i(0)=q'(0)=0$. La EDO que describe la
      carga es $Lq''(t)+Rq'(t)+\tfrac{1}{C}q(t)=e(t)$.
    pide: La carga q(t) en los dos casos.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con los datos, la ecuación es $q''+20q'+200q=150$. ¿Qué tipo de
          respuesta va a tener el circuito?
        opciones:
          - texto: >-
              Oscilatoria amortiguada: las raíces son $-10\pm10i$, con parte
              real negativa y parte imaginaria no nula
            correcta: true
            mensaje: |
              Eso es. En un RLC, el discriminante $R^{2}-\tfrac{4L}{C}$ decide
              entre sobreamortiguado, crítico y oscilatorio. Aquí
              $400-800<0$: oscila y se apaga.
          - texto: >-
              Exponencial pura, sin oscilar
            mensaje: |
              Eso sería si $R^{2}>\tfrac{4L}{C}$, o sea con más resistencia.
              Con $R=20$ y $\tfrac{4L}{C}=800$, el discriminante es negativo.
          - texto: >-
              Oscilatoria sin amortiguar
            mensaje: |
              Eso exigiría $R=0$. Con resistencia siempre hay una parte real
              negativa, y la oscilación se apaga.

      - tipo: calcular
        titulo: La carga final
        pregunta: |
          ¿A qué valor tiende $q(t)$ cuando $t\to\infty$ en el caso (a)?
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.005
          formato: en culombios, en forma exacta (3/4) o con dos decimales
        distractores:
          - valor: '150'
            mensaje: |
              $150$ es la tensión de la fuente, en voltios. La carga final es
              $C\,e = 0{,}005\cdot150$.
          - valor: '0'
            mensaje: |
              $0$ es la carga inicial. El condensador se va cargando hasta
              equilibrar la fuente.
        pista: |
          En régimen permanente $q''=q'=0$, así que $200q=150$.
        desarrollo: |
          $$
          200\,q_{\infty} = 150 \;\Longrightarrow\; q_{\infty} = \frac34
          \text{ C}
          $$

          Y eso es $C\cdot e = 0{,}005\cdot150 = 0{,}75$: el condensador acaba
          con la tensión de la fuente, que es lo que tiene que pasar cuando la
          corriente se detiene.

      - tipo: calcular
        titulo: La carga a la décima de segundo
        pregunta: |
          $q_1(t)=\tfrac34-\tfrac34 e^{-10t}\left(\cos10t+\operatorname{sen}10t\right)$.
          ¿Cuánto vale en $t=0{,}1$ s?
        respuesta:
          tipo: numero
          valor: '0.3688'
          tolerancia: 0.0008
          formato: en culombios, con cuatro decimales
        distractores:
          - valor: '0.75'
            mensaje: |
              $0{,}75$ es el valor final. A la décima de segundo el transitorio
              todavía resta la mitad.
          - valor: '0'
            mensaje: |
              $0$ es el valor inicial, y también lo que daría el paréntesis si
              $\cos$ y $\operatorname{sen}$ se cancelaran. En $t=0{,}1$ el
              argumento es $1$ radián y los dos son positivos.
        pista: |
          $e^{-1}\approx0{,}36788$, $\cos1\approx0{,}54030$ y
          $\operatorname{sen}1\approx0{,}84147$.
        desarrollo: |
          $$
          q_1(0{,}1) = 0{,}75 - 0{,}75\cdot0{,}36788\cdot1{,}38177
          = 0{,}75 - 0{,}38122 \approx 0{,}3688 \text{ C}
          $$

          A la décima de segundo lleva la mitad de la carga final: el
          transitorio dura del orden de $\tfrac{1}{10}$ s, que es el inverso de
          la parte real de las raíces.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con los datos, $q''+20q'+200q = e(t)$, y las raíces
              características son $-10\pm10i$.
          - texto: >-
              Para $e=150$ constante, la particular es $\tfrac34$ y las dos
              condiciones iniciales nulas fijan los coeficientes.
          - texto: >-
              Para $e=150\,\theta(t-2)$, la fuente es la misma retrasada dos
              segundos, así que la respuesta es la misma retrasada dos
              segundos: $q_2(t)=\theta(t-2)\,q_1(t-2)$.
          - texto: >-
              Y eso vale porque el sistema es lineal, aunque las condiciones
              iniciales no fuesen nulas.
            trampa: true
            mensaje: |
              **Hace falta que sean nulas.** Si el condensador tuviera carga en
              $t=0$, entre $0$ y $2$ el circuito ya estaría evolucionando por
              su cuenta, y la respuesta después de $t=2$ no sería la misma
              curva trasladada. La invariancia temporal exige partir del
              reposo.
        veredicto: |
          El apartado (b) no tiene ninguna cuenta: es el (a) desplazado. Y esa
          es exactamente la propiedad que hace útil la transformada de Laplace
          en ingeniería — que un retraso en la entrada es un factor
          $e^{-cs}$ y nada más.
    resolucion: |
      **Datos.** $R=20$, $L=1$, $C=0{,}005$, de donde
      $\tfrac1C = 200$ y la ecuación es

      $$
      q''+20q'+200q = e(t),
      \qquad q(0)=q'(0)=0
      $$

      ### 1 · El régimen del circuito

      $$
      r^{2}+20r+200 = 0 \;\Longrightarrow\; r = -10\pm10i
      $$

      | discriminante | régimen |
      |---|---|
      | $R^{2}>\tfrac{4L}{C}$ | sobreamortiguado |
      | $R^{2}=\tfrac{4L}{C}$ | crítico |
      | $R^{2}<\tfrac{4L}{C}$ | **oscilatorio amortiguado** ← este |

      Aquí $400 < 800$.

      ### 2 · El apartado (a)

      Particular: $q_p=\tfrac{150}{200}=\tfrac34$.

      $$
      q = \frac34 + e^{-10t}\left(A\cos10t+B\operatorname{sen}10t\right)
      $$

      De $q(0)=0$ sale $A=-\tfrac34$; de $q'(0)=0$, $-10A+10B=0$, o sea
      $B=A$:

      $$
      \boxed{\
      q_1(t) = \frac34-\frac34 e^{-10t}
      \left(\cos10t+\operatorname{sen}10t\right)\ }
      $$

      ### 3 · El apartado (b), sin cuentas

      La fuente es la misma retrasada dos segundos. Como el sistema es lineal
      e invariante y parte del reposo:

      $$
      \boxed{\ q_2(t) = \theta(t-2)\,q_1(t-2)\ }
      $$

      Con Laplace se ve de inmediato: el segundo miembro se multiplica por
      $e^{-2s}$, y eso es exactamente un retraso.

      ### 4 · La lectura física

      | tiempo | carga | qué pasa |
      |---|---|---|
      | $0$ | $0$ | el condensador está descargado |
      | $0{,}1$ s | $0{,}369$ C | va por la mitad, oscilando |
      | $\to\infty$ | $0{,}75$ C | $Ce = 0{,}005\cdot150$ |

      La carga final es la que corresponde a la tensión de la fuente. Y la
      duración del transitorio es del orden de $\tfrac{1}{10}$ s, el inverso
      de la parte real de las raíces.

      **Lo que hay que llevarse.** En un circuito, **el discriminante decide el
      régimen** y la parte real de las raíces decide cuánto dura el
      transitorio. Y un retraso en la fuente es un retraso en la respuesta, sin
      recalcular nada — siempre que se parta del reposo.

