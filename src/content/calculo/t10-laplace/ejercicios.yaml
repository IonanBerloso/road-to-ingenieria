  - id: ecuacion-integral-convolucion
    titulo: Una ecuación integral, y la convolución
    fuente: Ejercicio 10.12d · Problemas complementarios, tema 10 · Cálculo, UPV/EHU (2015/2016 7E)
    nivel: practica
    enunciado: |
      Utilizando la transformada de Laplace, resolver la ecuación integral

      $$
      y(t) = t + \int_{0}^{t}\text{sen}(t-u)\,y(u)\,du
      $$
    pide: La función y(t).
    pasos:
      - tipo: reconocer
        pregunta: |
          La integral $\int_0^t \text{sen}(t-u)\,y(u)\,du$ tiene una forma
          reconocible. ¿Cuál?
        opciones:
          - texto: Es una convolución de sen t con y(t)
            correcta: true
            mensaje: |
              Sí, y esa es toda la clave. Los límites de 0 a $t$ y el argumento
              $(t-u)$ junto a $u$ son la firma de una convolución, aunque el
              enunciado nunca use la palabra.
          - texto: Es una integral por partes disfrazada
            mensaje: |
              No se puede integrar por partes: la incógnita $y$ está **dentro**
              de la integral, así que no hay nada que integrar todavía.
          - texto: Es la definición de la transformada de Laplace
            mensaje: |
              La definición va de 0 a infinito y lleva $e^{-st}$. Esta va de 0 a
              $t$ y lleva un seno: es otra cosa.
      - tipo: calcular
        titulo: Despejar la transformada
        pregunta: |
          La ecuación transformada es $Y = \frac{1}{s^{2}} + \frac{1}{s^{2}+1}Y$.
          Al despejar sale $Y = \frac{s^{2}+1}{s^{4}}$. ¿Cuánto vale $Y$ en
          $s = 1$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Parece que has evaluado solo el $s^{2}$ del numerador. En $s=1$ el
              numerador es $1+1=2$ y el denominador es 1.
          - valor: '0.5'
            mensaje: |
              Has dado la vuelta a la fracción. Es $(s^{2}+1)/s^{4}$, no al
              revés.
        pista: |
          $(1+1)/1$.
        desarrollo: |
          $$
          Y\left(1 - \frac{1}{s^{2}+1}\right) = \frac{1}{s^{2}}
          \;\Longrightarrow\;
          Y\cdot\frac{s^{2}}{s^{2}+1} = \frac{1}{s^{2}}
          \;\Longrightarrow\;
          Y = \frac{s^{2}+1}{s^{4}}
          $$

          En $s=1$ vale $2/1 = 2$.
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La integral es una convolución, así que su transformada es el producto.'
          - texto: '$\mathcal{L}\{\text{sen}\,t\} = \frac{1}{s^{2}+1}$ y $\mathcal{L}\{t\} = \frac{1}{s^{2}}$.'
          - texto: 'La ecuación transformada queda $Y = \frac{1}{s^{2}} + \frac{1}{s^{2}+1}Y$.'
          - texto: 'Despejando, $Y = \frac{s^{2}+1}{s^{4}} = \frac{1}{s^{2}}+\frac{1}{s^{4}}$.'
          - texto: 'Antitransformando sale $y(t) = t + t^{3}$.'
            trampa: true
            mensaje: |
              Falta el factorial. $\mathcal{L}\{t^{n}\} = n!/s^{n+1}$, así que
              $1/s^{4}$ corresponde a $t^{3}/3!= t^{3}/6$, no a $t^{3}$. La
              respuesta correcta es $y(t) = t + t^{3}/6$.
    resolucion: |
      **Reconocer la convolución** es el ejercicio entero. La integral

      $$
      \int_{0}^{t}\text{sen}(t-u)\,y(u)\,du
      $$

      es $(\text{sen}\,t) * y(t)$, y la propiedad clave dice que la transformada
      de una convolución es el **producto** de las transformadas.

      **Transformando toda la ecuación:**

      $$
      Y(s) = \frac{1}{s^{2}} + \frac{1}{s^{2}+1}\,Y(s)
      $$

      Y aquí ha pasado lo importante: **la incógnita ha salido de la integral**.
      Ahora es una ecuación algebraica.

      **Despejando:**

      $$
      Y\left(1-\frac{1}{s^{2}+1}\right) = \frac{1}{s^{2}}
      \;\Longrightarrow\;
      Y\cdot\frac{s^{2}}{s^{2}+1} = \frac{1}{s^{2}}
      \;\Longrightarrow\;
      Y = \frac{s^{2}+1}{s^{4}} = \frac{1}{s^{2}}+\frac{1}{s^{4}}
      $$

      **Antitransformando**, con cuidado con los factoriales:

      $$
      \mathcal{L}^{-1}\left\{\frac{1}{s^{2}}\right\} = t,
      \qquad
      \mathcal{L}^{-1}\left\{\frac{1}{s^{4}}\right\} = \frac{t^{3}}{3!} = \frac{t^{3}}{6}
      $$

      $$
      \boxed{\;y(t) = t + \frac{t^{3}}{6}\;}
      $$

      **La comprobación**, que aquí sale barata: sustituyendo en la ecuación
      original, con $y(0)=0$, los dos lados coinciden. Y hay un control más
      rápido: en $t=0$ la integral vale 0, así que la ecuación exige $y(0)=0$.
      Nuestra solución cumple. ✓

      > **El factorial de la tabla es el error silencioso del tema.**
      > $1/s^{4}$ no es $t^{3}$: es $t^{3}/6$. Y como la forma de la respuesta
      > parece correcta, se cuela con facilidad.

