        <title id="f-bola-loma-t">Los niveles circulares de la loma y la trayectoria recta de la bola</title>
        <desc id="f-bola-loma-d">Varias circunferencias concéntricas centradas en el punto de coordenadas cero y menos uno son las curvas de nivel de la loma: la más pequeña es la cima y la más grande, dibujada a trazos, es el nivel del suelo. Desde el centro sale una recta que pasa por el punto uno coma uno y llega hasta la circunferencia exterior; ahí acaba, en un punto marcado de coordenadas dos coma cero cinco y tres coma diez. La recta es radial, es decir, corta todas las circunferencias en ángulo recto.</desc>
