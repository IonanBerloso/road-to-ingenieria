      <figcaption>Al descomponer, F(s) se parte en dos trozos con denominador s−3 y s+2, y cada uno vuelve a una exponencial. La de exponente positivo crece y la de exponente negativo se apaga; la suma, que es la respuesta, se parece a la primera en cuanto t pasa de 1.</figcaption>
