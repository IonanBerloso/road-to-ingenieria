        </g>
        <text class="lag16-l" x="100.6" y="108.7" fill="var(--alt)">la cuerda</text>
        <text class="lag16-l" x="257.2" y="155.1" text-anchor="end" fill="var(--flag)">tangente en c</text>
        <text class="lag16-l" x="47.8" y="37.6" fill="var(--live)">y = f(x)</text>
