      <figcaption>
      El teorema, en un dibujo: en algún punto interior la tangente a la curva es
      paralela a la cuerda que une los extremos. La demostración consiste en
      restarle la cuerda a la función y aplicar Rolle a lo que queda.
      </figcaption>
      </figure>

      **La demostración.** La idea es reducirlo a Rolle, y para eso hay que
      fabricar una función que valga lo mismo en los dos extremos. La distancia
      vertical entre la curva y la cuerda hace ese papel:

      $$
      g\left(x\right)=f\left(x\right)-\underbrace{\left[f\left(a\right)
      +\frac{f\left(b\right)-f\left(a\right)}{b-a}\left(x-a\right)\right]}
      _{\text{la cuerda}}
      $$

      **Se comprueban las tres hipótesis de Rolle:**

      | hipótesis | por qué |
      |---|---|
      | $g$ continua en $\left[a,b\right]$ | $f$ lo es, y la cuerda es un polinomio |
      | $g$ derivable en $\left(a,b\right)$ | igual |
      | $g\left(a\right)=g\left(b\right)$ | los dos valen **cero**, y se comprueba |

      $$
      g\left(a\right)=f\left(a\right)-f\left(a\right)-0=0
      $$

      $$
      g\left(b\right)=f\left(b\right)-f\left(a\right)
      -\frac{f\left(b\right)-f\left(a\right)}{b-a}\left(b-a\right)
      =f\left(b\right)-f\left(a\right)-\left(f\left(b\right)-f\left(a\right)\right)=0
      $$

      **Rolle** da entonces un $c\in\left(a,b\right)$ con
      $g'\left(c\right)=0$. Y derivando $g$:

      $$
      g'\left(x\right)=f'\left(x\right)
      -\frac{f\left(b\right)-f\left(a\right)}{b-a}
      $$

      $$
      g'\left(c\right)=0
      \;\Longleftrightarrow\;
      f'\left(c\right)=\frac{f\left(b\right)-f\left(a\right)}{b-a}
      \qquad\blacksquare
      $$

      **Un ejemplo para comprobar que se ha entendido.** Con
      $f\left(x\right)=x^{3}-2x+1$ en $\left[0,2\right]$, la cuerda tiene
      pendiente $\frac{5-1}{2}=2$, y $f'\left(c\right)=3c^{2}-2=2$ da
      $c=\frac{2}{\sqrt3}\approx1{,}155$, dentro del intervalo.

      **Dos avisos que suman puntos.**

      - **Las hipótesis no sobran.** $f\left(x\right)=\left|x\right|$ en
        $\left[-1,1\right]$ es continua pero no derivable en el interior, y la
        cuerda tiene pendiente $0$ sin que exista ningún $c$ con $f'=0$.
      - **El teorema no dice dónde está $c$**, ni que sea único. Es un teorema de
        existencia, y de ahí sale su utilidad: casi todo lo que se demuestra con
        él —que derivada nula implica constante, que derivada positiva implica
        creciente— solo necesita que ese $c$ exista.

  - id: ex1516-ext-4-el-agujero-que-rompe-green
    titulo: El agujero de un punto que rompe el teorema de Green
    fuente: >-
      Ejercicio 1 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 20 de
      junio de 2016 · Cálculo – Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 4
      comp4: 4
    enunciado: |
      Sea $C$ la circunferencia de centro $\left(0,0\right)$ y radio $R$.
      Calcular
      $\displaystyle\oint_{C}\frac{-y\,dx+x\,dy}{x^{2}+y^{2}}$

      a) Parametrizando la curva.

      b) Aplicando, si es posible, la fórmula de Green.
    pide: El valor por parametrización, y si Green se puede aplicar o no.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hipótesis del teorema de Green hay que comprobar aquí antes de
          nada?
        opciones:
          - texto: >-
              Que $P$ y $Q$ sean de clase $C^{1}$ en **todo** el recinto
              encerrado, incluido su interior
            correcta: true
            mensaje: |
              Esa es la que falla. El campo no está definido en el origen, y el
              origen está dentro de la circunferencia. Green no se puede aplicar,
              y el enunciado lo insinúa con ese «si es posible».
          - texto: Que la curva sea cerrada y simple
            mensaje: |
              Eso sí se cumple: una circunferencia es cerrada y no se corta a sí
              misma. El problema está dentro, no en el borde.
          - texto: Que el campo sea conservativo
            mensaje: |
              Green no exige nada de eso; vale para cualquier campo $C^{1}$. De
              hecho este campo es irrotacional y **no** es conservativo, que es
              justo lo que el ejercicio enseña.

      - tipo: calcular
        titulo: El valor por parametrización
        pregunta: |
          Con $R=3$, ¿cuánto vale la integral?
        respuesta:
          tipo: numero
          valor: '6.2831853'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0'
            mensaje: |
              Cero es lo que daría Green aplicado a lo bruto, y es precisamente
              la respuesta equivocada que el ejercicio busca. Parametrizando sale
              $2\pi$.
          - valor: '18.8495664'
            mensaje: |
              $6\pi$ sale de no dividir entre $x^{2}+y^{2}=R^{2}$. Ese
              denominador es el que hace que el resultado no dependa de $R$.
          - valor: '56.5486678'
            mensaje: |
              $18\pi$ es $2\pi R^{2}$: has olvidado el denominador **y**
              multiplicado por el radio al cuadrado dos veces.
        pista: |
          Con $x=R\cos\theta$, $y=R\operatorname{sen}\theta$, el numerador vale
          $R^{2}d\theta$ y el denominador $R^{2}$.
        desarrollo: |
          $$
          -y\,dx+x\,dy
          =R^{2}\operatorname{sen}^{2}\theta\,d\theta
          +R^{2}\cos^{2}\theta\,d\theta=R^{2}d\theta
          $$

          $$
          x^{2}+y^{2}=R^{2}
          \;\Longrightarrow\;
          \oint_{C}=\int_{0}^{2\pi}\frac{R^{2}}{R^{2}}d\theta=2\pi
          $$

          **Sea cual sea $R$.** El $R$ se cancela entero.

      - tipo: calcular
        titulo: El rotacional
        pregunta: |
          ¿Cuánto vale $\frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}$
          en el punto $\left(1,2\right)$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es lo que sale con el campo $\left(-y,x\right)$ **sin** el
              denominador. Al dividir entre $x^{2}+y^{2}$ el rotacional pasa a
              ser cero.
          - valor: '0.2'
            mensaje: |
              Parece $\frac{1}{x^{2}+y^{2}}$ en ese punto. Las dos derivadas
              cruzadas valen lo mismo, $\frac{y^{2}-x^{2}}{\left(x^{2}+y^{2}\right)^{2}}$,
              y su diferencia es cero.
          - valor: '-2'
            mensaje: |
              Signo del caso sin denominador. Con el denominador, cero.
        pista: |
          Las dos derivadas cruzadas valen
          $\frac{y^{2}-x^{2}}{\left(x^{2}+y^{2}\right)^{2}}$.
        desarrollo: |
          $$
          \frac{\partial Q}{\partial x}
          =\frac{\partial}{\partial x}\frac{x}{x^{2}+y^{2}}
          =\frac{\left(x^{2}+y^{2}\right)-x\cdot2x}{\left(x^{2}+y^{2}\right)^{2}}
          =\frac{y^{2}-x^{2}}{\left(x^{2}+y^{2}\right)^{2}}
          $$

          $$
          \frac{\partial P}{\partial y}
          =\frac{\partial}{\partial y}\frac{-y}{x^{2}+y^{2}}
          =\frac{-\left(x^{2}+y^{2}\right)+y\cdot2y}{\left(x^{2}+y^{2}\right)^{2}}
          =\frac{y^{2}-x^{2}}{\left(x^{2}+y^{2}\right)^{2}}
          $$

          Iguales, así que la diferencia es **cero en todo punto donde el campo
          está definido**. Que es en todas partes menos el origen.

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              El campo es irrotacional: $Q_{x}-P_{y}=0$ en todo punto distinto
              del origen.
          - texto: >-
              Pero el origen está **dentro** de $C$, y ahí $P$ y $Q$ ni siquiera
              están definidos: falla la hipótesis de Green.
          - texto: >-
              Así que Green no se puede aplicar, y el apartado a) lo confirma: la
              integral vale $2\pi$ y no $0$.
          - texto: >-
              Como el rotacional es cero en todos los puntos del recinto salvo
              uno, y un punto tiene área nula, la integral doble vale cero y Green
              sí se puede usar.
            trampa: true
            mensaje: |
              El argumento del «área nula» es tentador y falso. La hipótesis de
              Green no es que el integrando sea cero casi por todas partes, sino
              que el campo sea de clase $C^{1}$ en **todo** el recinto. Cerca del
              origen el campo no está acotado, y ese punto solo no se puede
              ignorar: su presencia es exactamente lo que hace que la integral
              valga $2\pi$.
    resolucion: |
      **a) Parametrizando.** Con $x=R\cos\theta$, $y=R\operatorname{sen}\theta$,
      $\theta\in\left[0,2\pi\right]$:

      $$
      dx=-R\operatorname{sen}\theta\,d\theta,
      \qquad
      dy=R\cos\theta\,d\theta
      $$

      $$
      -y\,dx+x\,dy
      =R^{2}\operatorname{sen}^{2}\theta\,d\theta+R^{2}\cos^{2}\theta\,d\theta
      =R^{2}\,d\theta
      $$

      y el denominador es constante sobre la curva, $x^{2}+y^{2}=R^{2}$:

      $$
      \oint_{C}\frac{-y\,dx+x\,dy}{x^{2}+y^{2}}
      =\int_{0}^{2\pi}\frac{R^{2}}{R^{2}}\,d\theta
      =\boxed{\;2\pi\;}
      $$

      **Y no depende de $R$**, lo cual ya es sospechoso: si la integral midiera
      algo proporcional al área, crecería con el radio. No lo hace, porque lo que
      mide es **cuántas vueltas da la curva alrededor del origen**.

      **b) Green: la respuesta es que no se puede.** Con
      $P=\frac{-y}{x^{2}+y^{2}}$ y $Q=\frac{x}{x^{2}+y^{2}}$, las dos derivadas
      cruzadas coinciden:

      $$
      \frac{\partial Q}{\partial x}=\frac{\partial P}{\partial y}
      =\frac{y^{2}-x^{2}}{\left(x^{2}+y^{2}\right)^{2}}
      \;\Longrightarrow\;
      \frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}=0
      $$

      Si Green fuese aplicable, la integral valdría
      $\iint_{D}0\,dA=0$. Y el apartado a) dice que vale $2\pi$.

      **La contradicción se resuelve mirando las hipótesis.** Green exige que
      $P$ y $Q$ sean de clase $C^{1}$ en **todo** el recinto encerrado por $C$,
      y ese recinto contiene el origen, donde el campo ni siquiera está definido:
      el denominador se anula.

      $$
      \boxed{\;\text{Green no se puede aplicar: el campo no es }C^{1}
      \text{ en el origen}\;}
      $$

      <figure class="figura-examen">
      <svg viewBox="0 0 300 265" role="img" width="300" height="265"
           aria-labelledby="agu16-t agu16-d">
        <title id="agu16-t">La circunferencia y el punto que el campo no cubre</title>
        <desc id="agu16-d">Una circunferencia centrada en el origen con el interior
        sombreado, y unas flechas que giran alrededor del centro. En el centro mismo hay
        un circulo hueco pequeño: el punto donde el campo no esta definido.</desc>
