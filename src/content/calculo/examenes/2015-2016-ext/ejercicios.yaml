ejercicios:
  - id: ex1516-ext-1-el-logaritmo-que-sale-real
    titulo: Un logaritmo complejo cuyo resultado es real
    fuente: >-
      Ejercicio 1 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 20 de
      junio de 2016 · Cálculo – Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 5
      comp4: 4
    enunciado: |
      Calcular y representar el lugar geométrico de los afijos de los complejos
      que verifican la siguiente ecuación:

      $$
      z=\frac{2}{i}\ln\left(\frac{1+i}{1-i}\right)
      $$
    pide: Todos los valores de z, y su representación.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el resultado no es un solo número?
        opciones:
          - texto: >-
              Porque el logaritmo complejo es multivaluado: el argumento está
              definido salvo múltiplos de $2\pi$
            correcta: true
            mensaje: |
              Eso es. $\operatorname{Ln}w=\ln\left|w\right|
              +i\left(\arg w+2k\pi\right)$, y cada $k$ da un valor. Por eso el
              enunciado habla de **lugar geométrico** y no de «el número».
          - texto: Porque el cociente $\frac{1+i}{1-i}$ tiene varios valores
            mensaje: |
              El cociente de dos complejos es un solo complejo. Aquí vale
              exactamente $i$. Lo que se ramifica es el logaritmo.
          - texto: >-
              Porque hay que elegir entre $\frac{2}{i}$ y $-\frac{2}{i}$
            mensaje: |
              $\frac{2}{i}$ es un número concreto, $-2i$. No hay ninguna
              elección de signo ahí.

      - tipo: calcular
        titulo: El cociente de dentro
        pregunta: |
          ¿Cuánto vale $\dfrac{1+i}{1-i}$?
        respuesta:
          tipo: complejo
          valor: '0+1i'
          tolerancia: 0.01
          formato: forma binómica, por ejemplo 0+1i
        distractores:
          - valor: '0-1i'
            mensaje: |
              Signo. Multiplicando arriba y abajo por $1+i$:
              $\frac{\left(1+i\right)^{2}}{2}=\frac{2i}{2}=i$, con más.
          - valor: '1'
            mensaje: |
              Los módulos sí son iguales —los dos valen $\sqrt2$—, pero los
              argumentos no se cancelan: se **restan**, y
              $\frac{\pi}{4}-\left(-\frac{\pi}{4}\right)=\frac{\pi}{2}$.
          - valor: '1+1i'
            mensaje: |
              Ese es el numerador tal cual. Falta dividir.
        pista: |
          Multiplica arriba y abajo por el conjugado del denominador, $1+i$.
        desarrollo: |
          $$
          \frac{1+i}{1-i}=\frac{\left(1+i\right)^{2}}
          {\left(1-i\right)\left(1+i\right)}
          =\frac{1+2i-1}{2}=\frac{2i}{2}=i
          $$

          En polar se ve igual de rápido: los dos tienen módulo $\sqrt2$, y los
          argumentos son $\frac{\pi}{4}$ y $-\frac{\pi}{4}$, así que el cociente
          tiene módulo $1$ y argumento $\frac{\pi}{2}$.

      - tipo: calcular
        titulo: El valor principal
        pregunta: |
          Tomando el valor principal del logaritmo, ¿cuánto vale $z$?
        respuesta:
          tipo: numero
          valor: '3.1415927'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '1.5707963'
            mensaje: |
              $\frac{\pi}{2}$ es el argumento de $i$, o sea la parte imaginaria
              de $\ln i$. Falta multiplicar por $\frac{2}{i}$, que es $-2i$ y
              convierte ese imaginario en un real **doble**.
          - valor: '6.2831853'
            mensaje: |
              $2\pi$ es el doble de lo que sale. Con
              $\ln i=\frac{\pi}{2}i$ queda $\frac{2}{i}\cdot\frac{\pi}{2}i=\pi$.
          - valor: '0'
            mensaje: |
              El módulo de $i$ es $1$ y su logaritmo real vale $0$, sí, pero el
              logaritmo complejo tiene además la parte imaginaria del argumento,
              que aquí es lo único que sobrevive.
        pista: |
          $\ln i=0+i\frac{\pi}{2}$, y $\frac{2}{i}=-2i$.
        desarrollo: |
          $$
          \ln i=\ln\left|i\right|+i\arg i=0+i\frac{\pi}{2}
          $$

          $$
          z=\frac{2}{i}\cdot i\frac{\pi}{2}=2\cdot\frac{\pi}{2}=\pi
          $$

          El $i$ de arriba y el de abajo se cancelan, y el resultado sale
          **real**. Ese es el punto del ejercicio.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\frac{1+i}{1-i}=i$, así que la ecuación es
              $z=\frac{2}{i}\operatorname{Ln}i$.
          - texto: >-
              $\operatorname{Ln}i=0+i\left(\frac{\pi}{2}+2k\pi\right)$, porque el
              módulo vale $1$ y el argumento está definido salvo $2\pi$.
          - texto: >-
              Multiplicando por $\frac{2}{i}$ los dos íes se cancelan y queda
              $z=2\left(\frac{\pi}{2}+2k\pi\right)=\left(4k+1\right)\pi$: puntos
              del eje real separados por $4\pi$.
          - texto: >-
              Como $z$ sale real, la representación gráfica es una recta: todo el
              eje real.
            trampa: true
            mensaje: |
              Los valores son **reales**, pero no son todos los reales: forman una
              sucesión discreta, $\ldots,-7\pi,-3\pi,\pi,5\pi,9\pi,\ldots$, con
              huecos de $4\pi$ entre uno y el siguiente. Un lugar geométrico
              formado por puntos sueltos también es un lugar geométrico, y hay que
              dibujarlo como puntos, no como una línea.
    resolucion: |
      **Primero, simplificar lo de dentro.** Multiplicando por el conjugado del
      denominador:

      $$
      \frac{1+i}{1-i}=\frac{\left(1+i\right)^{2}}{\left(1-i\right)\left(1+i\right)}
      =\frac{2i}{2}=i
      $$

      Merece la pena hacerlo antes de tocar el logaritmo: sin esa simplificación
      hay que restar dos argumentos y el riesgo de error se dispara.

      **El logaritmo complejo, con todas sus ramas.**

      $$
      \operatorname{Ln}i=\ln\left|i\right|+i\left(\arg i+2k\pi\right)
      =0+i\left(\frac{\pi}{2}+2k\pi\right),\qquad k\in\mathbb{Z}
      $$

      El módulo de $i$ es $1$, así que la parte real del logaritmo se anula:
      **todo lo que queda es imaginario puro**.

      **Y el factor de fuera lo convierte en real.**

      $$
      z=\frac{2}{i}\cdot i\left(\frac{\pi}{2}+2k\pi\right)
      =2\left(\frac{\pi}{2}+2k\pi\right)
      $$

      $$
      \boxed{\;z=\pi+4k\pi=\left(4k+1\right)\pi,\qquad k\in\mathbb{Z}\;}
      $$

      Los dos íes se cancelan porque $\frac{2}{i}=-2i$ y $-2i\cdot i=2$. Ese es
      todo el truco del ejercicio: **un logaritmo complejo que da un resultado
      real**.

      <figure class="figura-examen">
      <svg viewBox="0 0 300 155" role="img" width="300" height="155"
           aria-labelledby="pun16-t pun16-d">
        <title id="pun16-t">Los valores de z, puntos sueltos del eje real</title>
        <desc id="pun16-d">Cuatro puntos marcados sobre el eje horizontal, igualmente
        espaciados, con los rotulos menos siete pi, menos tres pi, pi y cinco pi. La
        serie sigue hacia los dos lados. No hay ningun punto fuera del eje.</desc>
        <style>
          .pun16-p { fill: var(--live); }
          .pun16-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
          .pun16-sep { stroke: var(--flag); stroke-width: 1.4; fill: none; }
          .pun16-n { fill: var(--faint); font-size: 10px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
          .pun16-l { font-size: 10.5px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
        </style>
        <path class="pun16-eje" d="M9.9 92L290.4 92M165 117.6L165 56.8"/>
        <path class="pun16-sep" d="M185.7 78.4L268.7 78.4"/>
        <g class="pun16-p"><circle cx="19.9" cy="92" r="4"/><circle cx="102.8" cy="92" r="4"/><circle cx="185.7" cy="92" r="4"/><circle cx="268.7" cy="92" r="4"/></g>
        <g class="pun16-n"><text x="19.9" y="108" text-anchor="middle">−7π</text><text x="102.8" y="108" text-anchor="middle">−3π</text><text x="185.7" y="108" text-anchor="middle">π</text><text x="268.7" y="108" text-anchor="middle">5π</text><text x="290.4" y="84" text-anchor="end">Re</text><text x="171" y="66.8">Im</text></g>
        <text class="pun16-l" x="227.2" y="73.6" text-anchor="middle" fill="var(--flag)">4π</text>
        <text class="pun16-l" x="13.2" y="61.6" fill="var(--live)">z = (4k + 1)π</text>
      </svg>
      <figcaption>
      El lugar geométrico no es una recta: son puntos sueltos del eje real, uno cada
      4π, empezando en π. Cada uno viene de una rama distinta del logaritmo.
      </figcaption>
      </figure>

      **La representación.** No es una recta: son **puntos sueltos del eje
      real**, uno cada $4\pi\approx12{,}57$ unidades, empezando en $\pi$ y
      siguiendo en las dos direcciones. Los primeros:

      $$
      \ldots,\;-7\pi,\;-3\pi,\;\pi,\;5\pi,\;9\pi,\;\ldots
      $$

      **Por qué el salto es $4\pi$ y no $2\pi$.** El logaritmo salta de $2\pi$ en
      el argumento, y luego se multiplica por $2$. Es fácil escribir $2k\pi$ por
      inercia; hay que arrastrar el factor.

      **Si solo se pide el valor principal**, la respuesta es $z=\pi$ y ya está.
      El enunciado, al hablar de «lugar geométrico» y de «los afijos» en plural,
      pide todas las ramas.

  - id: ex1516-ext-2-la-funcion-valor-medio
    titulo: La función que promedia lo que lleva detrás
    fuente: >-
      Ejercicio 2 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 20 de
      junio de 2016 · Cálculo – Industriales, UPV/EHU · La figura está
      redibujada del original · Es copia literal del ejercicio 2 de la TERCERA
      EVALUACIÓN DEL MISMO CURSO, del 13 de enero de 2016: el único caso
      detectado en que una extraordinaria repite un parcial de su propio año. El
      examen no publica solución: la resolución es propuesta nuestra, pendiente
      de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3
    enunciado: |
      Sea la función continua $y\left(x\right)$ de la figura, definida en el
      intervalo $\left[1,3\right]$. Se pide:

      a) Calcular $\overline{y}\left(x\right)$, la función valor medio de
      $y\left(x\right)$.

      b) Estudiar el crecimiento/decrecimiento y concavidad/convexidad de
      $\overline{y}\left(x\right)$.

      c) Calcular el valor medio de $y\left(x\right)$ en el intervalo
      $\left[1,\frac32\right]$.

      <figure class="figura-examen">
      <svg viewBox="0 0 300 190" role="img" width="300" height="190"
           aria-labelledby="yde16-t yde16-d">
        <title id="yde16-t">La funcion y de x del enunciado</title>
        <desc id="yde16-d">Una linea quebrada continua definida entre uno y tres. Vale
        cero en uno, sube en linea recta hasta valer uno en dos, y de dos a tres se
        queda horizontal en uno.</desc>
        <style>
          .yde16-c { stroke: var(--d1); stroke-width: 3; fill: none; }
          .yde16-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
          .yde16-g { stroke: var(--faint); stroke-width: 1.1; fill: none; stroke-dasharray: 3 3; }
          .yde16-n { fill: var(--faint); font-size: 10px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
        </style>
        <path class="yde16-eje" d="M27.4 150L269.2 150M46 165.5L46 50.8"/>
        <path class="yde16-g" d="M46 88L232 88M170 150L170 88"/>
        <path class="yde16-c" d="M108 150L170 88L232 88"/>
        <g class="yde16-n">
          <text x="108" y="165" text-anchor="middle">1</text>
          <text x="170" y="165" text-anchor="middle">2</text>
          <text x="232" y="165" text-anchor="middle">3</text>
          <text x="39" y="92" text-anchor="end">1</text>
          <text x="39" y="154" text-anchor="end">0</text>
          <text x="269.2" y="143" text-anchor="end">x</text>
          <text x="52" y="60.8">y</text>
        </g>
      </svg>
      <figcaption>
      Figura redibujada del enunciado. La función vale 0 en x = 1, sube en línea
      recta hasta valer 1 en x = 2, y de ahí a x = 3 se queda constante.
      </figcaption>
      </figure>
    pide: La función valor medio, su forma, y un valor concreto.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es la «función valor medio» de $y$?
        opciones:
          - texto: >-
              $\overline{y}\left(x\right)=\frac{1}{x-1}\int_{1}^{x}
              y\left(t\right)dt$: el promedio de $y$ desde el principio del
              intervalo hasta $x$
            correcta: true
            mensaje: |
              Eso es. Es el valor medio de la parte de la función que queda a la
              izquierda de $x$, y por eso depende de $x$: es una función, no un
              número.
          - texto: >-
              La constante $\frac{1}{2}\int_{1}^{3}y$, el valor medio en todo el
              intervalo
            mensaje: |
              Eso es **un** valor medio, un número. El enunciado pide la
              **función** valor medio, que depende del extremo superior.
          - texto: >-
              La media aritmética de $y\left(1\right)$ e $y\left(x\right)$
            mensaje: |
              Eso solo coincidiría con el valor medio si $y$ fuese lineal. Aquí
              lo es en un tramo y no en el otro, y el promedio de verdad se
              calcula integrando.

      - tipo: calcular
        titulo: El promedio hasta x = 2
        pregunta: |
          ¿Cuánto vale $\overline{y}\left(2\right)$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es $y\left(2\right)$, el valor de la función ahí. El promedio
              de un tramo que sube de $0$ a $1$ es la mitad.
          - valor: '0.25'
            mensaje: |
              $\frac14$ es la **integral** $\int_{1}^{2}y$… no: la integral vale
              $\frac12$. El $\frac14$ saldría de dividir esa integral entre $2$
              en vez de entre la longitud del intervalo, que es $1$.
          - valor: '0.75'
            mensaje: |
              $\frac34$ es $\overline{y}\left(3\right)$, el promedio en todo el
              intervalo. Hasta $x=2$ solo se ha promediado la rampa.
        pista: |
          En $\left[1,2\right]$ la función es la recta $y=x-1$, que va de $0$ a
          $1$.
        desarrollo: |
          $$
          \int_{1}^{2}\left(t-1\right)dt=\left[\frac{\left(t-1\right)^{2}}{2}
          \right]_{1}^{2}=\frac12
          $$

          $$
          \overline{y}\left(2\right)=\frac{1}{2-1}\cdot\frac12=\frac12
          $$

          Y se ve sin integrar: el promedio de una recta entre dos puntos es la
          media de sus valores, $\frac{0+1}{2}$.

      - tipo: calcular
        titulo: El apartado c)
        pregunta: |
          ¿Cuál es el valor medio de $y$ en $\left[1,\frac32\right]$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              $\frac12$ es $y\left(\frac32\right)$, el valor de la función en el
              extremo. El promedio de la rampa entre $0$ y $\frac12$ es la mitad
              de eso.
          - valor: '0.125'
            mensaje: |
              $\frac18$ es la **integral** $\int_{1}^{3/2}y$. Falta dividir entre
              la longitud del intervalo, que es $\frac12$.
          - valor: '0.375'
            mensaje: |
              $\frac38$ sería el promedio si el intervalo llegara hasta
              $x=1{,}75$. Con $\frac32$ el extremo de la rampa está en
              $y=\frac12$.
        pista: |
          Es exactamente $\overline{y}\left(\frac32\right)$, y en la rampa
          $\overline{y}\left(x\right)=\frac{x-1}{2}$.
        desarrollo: |
          $$
          \overline{y}\!\left(\tfrac32\right)=\frac{\frac32-1}{2}
          =\frac{1/2}{2}=\frac14
          $$

          O directamente:
          $\frac{1}{1/2}\int_{1}^{3/2}\left(t-1\right)dt
          =2\cdot\frac{\left(1/2\right)^{2}}{2}=2\cdot\frac18=\frac14$.

          El apartado c) es el apartado a) evaluado en un punto: si la función
          $\overline{y}$ está bien calculada, esto son diez segundos.

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              En $\left(1,2\right)$ es
              $\overline{y}\left(x\right)=\frac{x-1}{2}$: una recta de pendiente
              $\frac12$, creciente y sin concavidad.
          - texto: >-
              En $\left(2,3\right)$ es
              $\overline{y}\left(x\right)=\frac{x-\frac32}{x-1}
              =1-\frac{1}{2\left(x-1\right)}$.
          - texto: >-
              Ahí $\overline{y}'=\frac{1}{2\left(x-1\right)^{2}}>0$ y
              $\overline{y}''=-\frac{1}{\left(x-1\right)^{3}}<0$: sigue creciendo,
              pero ahora es **cóncava**.
          - texto: >-
              Como $y$ deja de crecer en $x=2$, $\overline{y}$ también deja de
              crecer a partir de ahí.
            trampa: true
            mensaje: |
              $\overline{y}$ crece mientras el valor nuevo que entra en el
              promedio sea mayor que el promedio acumulado, y eso pasa en todo
              $\left(1,3\right)$: a partir de $x=2$ entra el valor $1$, que es
              mayor que el promedio —$\frac12$ al principio, $\frac34$ al final—.
              La media sigue subiendo aunque la función se haya estancado. Es la
              misma idea que la nota media de un curso.
    resolucion: |
      **La función del dibujo.** Es continua y lineal a trozos:

      $$
      y\left(x\right)=
      \begin{cases}
      x-1 & 1\le x\le2\\
      1 & 2\le x\le3
      \end{cases}
      $$

      Sube desde $0$ hasta $1$ en el primer tramo y se queda plana en el segundo.

      **a) La función valor medio.** Por definición,

      $$
      \overline{y}\left(x\right)=\frac{1}{x-1}\int_{1}^{x}y\left(t\right)dt
      $$

      y hay que calcularla **por tramos**, porque la integral cambia de fórmula
      al pasar por $x=2$.

      *En $\left[1,2\right]$:*

      $$
      \int_{1}^{x}\left(t-1\right)dt=\frac{\left(x-1\right)^{2}}{2}
      \;\Longrightarrow\;
      \overline{y}\left(x\right)=\frac{x-1}{2}
      $$

      *En $\left[2,3\right]$:* lo acumulado hasta $2$ más el trozo plano,

      $$
      \int_{1}^{x}y=\frac12+\left(x-2\right)=x-\frac32
      \;\Longrightarrow\;
      \overline{y}\left(x\right)=\frac{x-\frac32}{x-1}
      $$

      $$
      \boxed{\;\overline{y}\left(x\right)=
      \begin{cases}
      \dfrac{x-1}{2} & 1<x\le2\\[8pt]
      \dfrac{2x-3}{2\left(x-1\right)} & 2\le x\le3
      \end{cases}\;}
      $$

      **Dos comprobaciones que hay que hacer y decir.**

      - **En $x=2$ las dos fórmulas dan $\frac12$**, así que $\overline{y}$ es
        continua. Y las dos derivadas laterales valen $\frac12$: además es
        derivable, aunque $y$ tenga ahí un pico.
      - **En $x=1$** la fórmula es $\frac00$, pero el límite existe y vale $0$,
        que es $y\left(1\right)$. Se extiende con continuidad.

      **b) Crecimiento y concavidad.** Conviene reescribir el segundo tramo:

      $$
      \overline{y}\left(x\right)=\frac{x-\frac32}{x-1}
      =1-\frac{1}{2\left(x-1\right)}
      $$

      | tramo | $\overline{y}'$ | $\overline{y}''$ | qué es |
      |---|---|---|---|
      | $\left(1,2\right)$ | $\frac12>0$ | $0$ | crece; es una **recta** |
      | $\left(2,3\right)$ | $\frac{1}{2\left(x-1\right)^{2}}>0$ | $-\frac{1}{\left(x-1\right)^{3}}<0$ | crece y es **cóncava** |

      $$
      \boxed{\;\overline{y}\text{ crece en todo }\left[1,3\right];
      \text{ es recta en }\left[1,2\right]\text{ y cóncava en }\left[2,3\right]\;}
      $$

      <figure class="figura-examen">
      <svg viewBox="0 0 340 215" role="img" width="340" height="215"
           aria-labelledby="med16-t med16-d">
        <title id="med16-t">La funcion y su promedio acumulado</title>
        <desc id="med16-d">Dos curvas sobre los mismos ejes. La primera es la linea
        quebrada del enunciado, que sube y se aplana en uno. La segunda, mas baja, es su
        promedio: sube en linea recta hasta el dos y despues sigue subiendo cada vez mas
        despacio, curvandose hacia abajo, sin llegar a alcanzar a la primera.</desc>
        <style>
          .med16-y { stroke: var(--d1); stroke-width: 2.6; fill: none; }
          .med16-m { stroke: var(--live); stroke-width: 3; fill: none; }
          .med16-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
          .med16-g { stroke: var(--faint); stroke-width: 1.1; fill: none; stroke-dasharray: 3 3; }
          .med16-p { fill: var(--flag); }
          .med16-n { fill: var(--faint); font-size: 10px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
          .med16-l { font-size: 10.5px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
        </style>
        <path class="med16-eje" d="M26.5 168L319 168M46 184.2L46 22.2"/>
