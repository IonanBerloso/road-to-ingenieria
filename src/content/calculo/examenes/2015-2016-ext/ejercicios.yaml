      </svg>
      <figcaption>
      El campo gira alrededor del origen y tiene rotacional nulo en todos los puntos
      donde existe. Pero en el origen no existe, y el origen está dentro de C: por
      eso Green no se puede aplicar y la integral no vale cero.
      </figcaption>
      </figure>

      **Lo que este ejercicio enseña, y por qué es un clásico.** Este campo es el
      contraejemplo estándar de que

      > **irrotacional no implica conservativo** si el dominio tiene agujeros.

      En $\mathbb{R}^{2}$ menos el origen, el campo tiene rotacional nulo y sin
      embargo su circulación alrededor del origen no es cero. Lo que falla no es
      el campo: es la **topología del dominio**, que ya no es simplemente conexo.

      **Dónde sí se puede usar Green.** Si la curva **no** rodea al origen —una
      circunferencia pequeña centrada en $\left(5,0\right)$, por ejemplo—,
      entonces el recinto no contiene el punto malo, las hipótesis se cumplen y
      la integral sí vale cero. Es la misma fórmula y el mismo campo: lo único
      que cambia es dónde está el agujero.

      **Y una lectura de propina.** La cantidad
      $\frac{1}{2\pi}\oint\frac{-y\,dx+x\,dy}{x^{2}+y^{2}}$ cuenta las vueltas
      que la curva da alrededor del origen. Aquí da una, y por eso sale $2\pi$.
      Recorriendo la circunferencia dos veces saldría $4\pi$, y al revés,
      $-2\pi$.

  - id: ex1516-ext-5-el-factor-integrante-exponencial
    titulo: Comprobar un factor integrante y resolver con él
    fuente: >-
      Ejercicio 2 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 20 de
      junio de 2016 · Cálculo – Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3
    enunciado: |
      Utilizando la función $g\left(x,y\right)=e^{x}$,

      a) Demostrar que es factor integrante de la ecuación diferencial

      $$
      \left(2xy+x^{2}y+\frac{y^{3}}{3}\right)dx+\left(x^{2}+y^{2}\right)dy=0
      $$

      b) Resolver la ecuación.
    pide: La comprobación del factor y la solución general.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué hace falta un factor integrante aquí?
        opciones:
          - texto: >-
              Porque la ecuación no es exacta: $M_{y}=2x+x^{2}+y^{2}$ y
              $N_{x}=2x$ no coinciden
            correcta: true
            mensaje: |
              Eso es. Sin el factor no existe ninguna $F$ con
              $\nabla F=\left(M,N\right)$, y todo el método de las exactas se
              cae. El factor la arregla.
          - texto: >-
              Porque la ecuación no es lineal
            mensaje: |
              No lo es, pero eso no obliga a nada por sí solo: hay ecuaciones no
              lineales exactas y ecuaciones lineales que no lo son. Lo que decide
              es la igualdad de las derivadas cruzadas.
          - texto: >-
              Porque tiene un término de grado tres en $y$
            mensaje: |
              El grado no interviene. Una ecuación de grado veinte puede ser
              exacta perfectamente.

      - tipo: calcular
        titulo: La derivada cruzada, sin factor
        pregunta: |
          ¿Cuánto vale $M_{y}$ en el punto $\left(1,2\right)$, con
          $M=2xy+x^{2}y+\frac{y^{3}}{3}$?
        respuesta:
          tipo: numero
          valor: '7'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es $N_{x}$ en ese punto, y precisamente por ser distinto de
              $M_{y}$ la ecuación no es exacta.
          - valor: '3'
            mensaje: |
              $3$ es $2x+x^{2}$ en $x=1$, o sea $M_{y}$ sin el término $y^{2}$.
              La derivada de $\frac{y^{3}}{3}$ respecto de $y$ es $y^{2}$, que en
              $y=2$ vale $4$.
          - valor: '11'
            mensaje: |
              $11$ sería $M_{y}$ con $y^{3}$ en vez de $y^{2}$: la derivada de
              $\frac{y^{3}}{3}$ baja el grado.
        pista: |
          $M_{y}=2x+x^{2}+y^{2}$.
        desarrollo: |
          $$
          M_{y}=\frac{\partial}{\partial y}
          \left(2xy+x^{2}y+\frac{y^{3}}{3}\right)=2x+x^{2}+y^{2}
          $$

          En $\left(1,2\right)$: $2+1+4=7$. Y $N_{x}=2x=2$. No coinciden: **no es
          exacta**.

      - tipo: calcular
        titulo: La constante de la solución
        pregunta: |
          La solución es $e^{x}\left(x^{2}y+\frac{y^{3}}{3}\right)=C$. ¿Qué
          constante corresponde a la curva que pasa por $\left(0,3\right)$?
        respuesta:
          tipo: numero
          valor: '9'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '27'
            mensaje: |
              $27$ es $y^{3}$ sin dividir entre $3$. El término es
              $\frac{y^{3}}{3}$.
          - valor: '0'
            mensaje: |
              En $x=0$ se anula el término $x^{2}y$, pero no el otro:
              $\frac{27}{3}=9$. Y $e^{0}=1$, así que no anula nada.
          - valor: '3'
            mensaje: |
              $3$ es el valor de $y$. Hay que meterlo en la expresión completa.
        pista: |
          $e^{0}=1$, $x^{2}y=0$ y $\frac{y^{3}}{3}=\frac{27}{3}$.
        desarrollo: |
          $$
          e^{0}\left(0+\frac{27}{3}\right)=9
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Multiplicada por $e^{x}$, la ecuación tiene
              $M=e^{x}\left(2xy+x^{2}y+\frac{y^{3}}{3}\right)$ y
              $N=e^{x}\left(x^{2}+y^{2}\right)$.
          - texto: >-
              $M_{y}=e^{x}\left(2x+x^{2}+y^{2}\right)$ y
              $N_{x}=e^{x}\left(x^{2}+y^{2}\right)+e^{x}\cdot2x$: coinciden, así
              que ya es exacta.
          - texto: >-
              Integrando $N$ respecto de $y$ sale
              $F=e^{x}\left(x^{2}y+\frac{y^{3}}{3}\right)+g\left(x\right)$, y al
              derivar respecto de $x$ resulta $g'=0$.
          - texto: >-
              Como se ha multiplicado por $e^{x}$, la solución hay que dividirla
              después entre $e^{x}$ para volver a la ecuación original.
            trampa: true
            mensaje: |
              El factor integrante no se deshace: multiplicar una ecuación
              igualada a cero por algo que no se anula nunca no cambia sus
              soluciones. Y $e^{x}>0$ siempre, así que aquí ni siquiera hay que
              vigilar ningún caso perdido — cosa que sí ocurre con factores del
              tipo $\left(x+y\right)^{2}$.
    resolucion: |
      **a) Por qué hace falta el factor.** Con $M_{0}=2xy+x^{2}y+\frac{y^{3}}{3}$
      y $N_{0}=x^{2}+y^{2}$:

      $$
      \frac{\partial M_{0}}{\partial y}=2x+x^{2}+y^{2},
      \qquad
      \frac{\partial N_{0}}{\partial x}=2x
      $$

      No coinciden, así que **no es exacta** y no existe ninguna $F$ con
      $\nabla F=\left(M_{0},N_{0}\right)$.

      **La comprobación.** Multiplicando todo por $e^{x}$:

      $$
      M=e^{x}\left(2xy+x^{2}y+\frac{y^{3}}{3}\right),
      \qquad
      N=e^{x}\left(x^{2}+y^{2}\right)
      $$

      $$
      \frac{\partial M}{\partial y}=e^{x}\left(2x+x^{2}+y^{2}\right)
      $$

      $$
      \frac{\partial N}{\partial x}
      =\underbrace{e^{x}\left(x^{2}+y^{2}\right)}_{\text{derivando }e^{x}}
      +\underbrace{e^{x}\cdot 2x}_{\text{derivando el paréntesis}}
      =e^{x}\left(x^{2}+y^{2}+2x\right)
      $$

      $$
      \boxed{\;M_{y}=N_{x}\;}
      $$

      Los dos paréntesis son el mismo con los sumandos en otro orden. **Ya es
      exacta.**

      **Por qué funciona, dicho en general.** El factor $\mu\left(x\right)$
      depende solo de $x$ cuando el cociente
      $\frac{M_{0y}-N_{0x}}{N_{0}}$ depende solo de $x$. Aquí

      $$
      \frac{M_{0y}-N_{0x}}{N_{0}}
      =\frac{\left(2x+x^{2}+y^{2}\right)-2x}{x^{2}+y^{2}}
      =\frac{x^{2}+y^{2}}{x^{2}+y^{2}}=1
      $$

      y de $\frac{\mu'}{\mu}=1$ sale $\mu=e^{x}$. El enunciado da el factor
      hecho, pero decir de dónde viene son puntos de COMP 4.

      **b) La solución.** Conviene integrar $N$ respecto de $y$, que es el lado
      corto:

      $$
      F=\int e^{x}\left(x^{2}+y^{2}\right)dy
      =e^{x}\left(x^{2}y+\frac{y^{3}}{3}\right)+g\left(x\right)
      $$

      Y se ajusta con la otra componente:

      $$
      F_{x}=e^{x}\left(x^{2}y+\frac{y^{3}}{3}\right)+e^{x}\cdot 2xy+g'\left(x\right)
      =e^{x}\left(x^{2}y+\frac{y^{3}}{3}+2xy\right)+g'\left(x\right)
      $$

      que es exactamente $M$ si $g'\left(x\right)=0$:

      $$
      \boxed{\;e^{x}\left(x^{2}y+\frac{y^{3}}{3}\right)=C\;}
      $$

      **La comprobación.** Derivando implícitamente,
      $\frac{dy}{dx}=-\frac{F_{x}}{F_{y}}$, y eso tiene que coincidir con
      $-\frac{M_{0}}{N_{0}}$ de la ecuación original. En $\left(1,2\right)$ las
      dos dan $-\frac{23{,}558}{13{,}591}\cdot\frac{1}{e}$… o mejor, sin
      exponenciales: $-\frac{M_{0}}{N_{0}}
      =-\frac{2+2+\frac83}{1+4}=-\frac{20/3}{5}=-\frac43$.

      **Lo que hay que decir sobre el factor.** Multiplicar una ecuación
      igualada a cero por algo **que no se anula nunca** no cambia sus
      soluciones, y $e^{x}>0$ para todo $x$. Con factores que sí se anulan —como
      el $\left(x+y\right)^{2}$ de otras convocatorias— hay que mirar aparte la
      curva donde se anulan; aquí no hace falta, y decirlo es lo que demuestra
      que se sabe por qué.

  - id: ex1516-ext-6-la-ecuacion-integral-por-convolucion
    titulo: Una ecuación con la incógnita dentro de la integral
    fuente: >-
      Ejercicio 3 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 20 de
      junio de 2016 · Cálculo – Industriales, UPV/EHU · La misma ecuación
      integral volvió a caer, palabra por palabra, en la extraordinaria de
      2022-2023, seis años después. El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 4
      comp4: 4
    enunciado: |
      Resolver la siguiente ecuación integral utilizando la transformada de
      Laplace:

      $$
      y\left(t\right)=t+\int_{0}^{t}
      \operatorname{sen}\left(t-u\right)y\left(u\right)du
      $$
    pide: La función y(t).

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es la integral que aparece en el segundo miembro?
        opciones:
          - texto: >-
              Una **convolución**, $\left(\operatorname{sen}*y\right)
              \left(t\right)$, cuya transformada es el producto de las dos
              transformadas
            correcta: true
            mensaje: |
              Esa es la clave. La forma $\int_{0}^{t}f\left(t-u\right)
              g\left(u\right)du$ es la definición de convolución, y
              $\mathcal{L}\left\{f*g\right\}=F\left(s\right)G\left(s\right)$: el
              producto, no la integral de un producto.
          - texto: >-
              Una integral definida corriente, que da un número
            mensaje: |
              No da un número: el extremo superior es $t$ y el integrando lleva
              $t$ dentro. Es una función de $t$.
          - texto: >-
              El producto de $\operatorname{sen}t$ por $y\left(t\right)$
            mensaje: |
              La transformada de un **producto** de funciones no es el producto
              de las transformadas. Lo que sí lo es es la de una convolución, y
              esto es una convolución.

      - tipo: calcular
        titulo: La transformada del núcleo
        pregunta: |
          ¿Cuánto vale $\mathcal{L}\left\{\operatorname{sen}t\right\}$ evaluada
          en $s=2$?
        respuesta:
          tipo: numero
          valor: '0.2'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              $\frac12$ es $\frac{1}{s}$, la transformada de la constante $1$.
              La del seno es $\frac{1}{s^{2}+1}$.
          - valor: '0.4'
            mensaje: |
              $\frac{2}{5}$ sería $\frac{s}{s^{2}+1}$, que es la transformada del
              **coseno**. El seno lleva $1$ arriba, el coseno lleva $s$.
          - valor: '0.25'
            mensaje: |
              $\frac{1}{s^{2}}$ es la transformada de $t$. El $+1$ del
              denominador es lo que distingue al seno.
        pista: |
          $\mathcal{L}\left\{\operatorname{sen}\omega t\right\}
          =\frac{\omega}{s^{2}+\omega^{2}}$, con $\omega=1$.
        desarrollo: |
          $$
          \mathcal{L}\left\{\operatorname{sen}t\right\}=\frac{1}{s^{2}+1}
          \;\Longrightarrow\;
          \text{en }s=2:\;\frac{1}{5}=0{,}2
          $$

      - tipo: calcular
        titulo: El valor de la solución
        pregunta: |
          ¿Cuánto vale $y\left(3\right)$?
        respuesta:
          tipo: numero
          valor: '7.5'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '12'
            mensaje: |
              $3+\frac{27}{3}=12$ sale de antitransformar $\frac{1}{s^{4}}$ como
              $\frac{t^{3}}{3}$. El factorial es $3!=6$, no $3$.
          - valor: '3'
            mensaje: |
              $3$ es solo el término $t$. La integral aporta $\frac{t^{3}}{6}$,
              que en $t=3$ vale $4{,}5$.
          - valor: '16.5'
            mensaje: |
              Parece $3+\frac{81}{6}$, con $t^{4}$ en vez de $t^{3}$.
              $\mathcal{L}^{-1}\left\{\frac{1}{s^{n+1}}\right\}
              =\frac{t^{n}}{n!}$, y con $s^{4}$ el exponente es $3$.
        pista: |
          $y\left(t\right)=t+\frac{t^{3}}{6}$.
        desarrollo: |
          $$
          y\left(3\right)=3+\frac{27}{6}=3+4{,}5=7{,}5
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La integral es la convolución $\operatorname{sen}*y$, así que su
              transformada es $\frac{1}{s^{2}+1}\,Y\left(s\right)$.
          - texto: >-
              Transformando la ecuación:
              $Y=\frac{1}{s^{2}}+\frac{Y}{s^{2}+1}$, y despejando
              $Y\left(1-\frac{1}{s^{2}+1}\right)=\frac{1}{s^{2}}$.
          - texto: >-
              $1-\frac{1}{s^{2}+1}=\frac{s^{2}}{s^{2}+1}$, así que
              $Y=\frac{s^{2}+1}{s^{4}}=\frac{1}{s^{2}}+\frac{1}{s^{4}}$ y
              $y\left(t\right)=t+\frac{t^{3}}{6}$.
          - texto: >-
              Como la incógnita aparece dentro de una integral, primero hay que
              derivar los dos miembros para convertirla en una ecuación
              diferencial.
            trampa: true
            mensaje: |
              Se puede hacer —derivando dos veces sale $y''=y+\ldots$— pero es el
              camino largo, y el enunciado pide expresamente Laplace. La gracia de
              la transformada es justamente que convierte la convolución en un
              producto y despeja $Y$ con álgebra de primero: no hace falta salir
              del mundo algebraico en ningún momento.
    resolucion: |
      **Reconocer la convolución.** La forma

      $$
      \int_{0}^{t}f\left(t-u\right)g\left(u\right)du
      $$

      es la definición de $\left(f*g\right)\left(t\right)$, y lo que la hace
      valiosa es que su transformada es un **producto**:

      $$
      \mathcal{L}\left\{f*g\right\}=F\left(s\right)G\left(s\right)
      $$

      Aquí $f=\operatorname{sen}$ y $g=y$, así que la integral transforma a
      $\frac{1}{s^{2}+1}\,Y\left(s\right)$.

      **Transformar la ecuación entera.**

      $$
      Y=\frac{1}{s^{2}}+\frac{1}{s^{2}+1}\,Y
      $$

      Y ahora ya es álgebra:

      $$
      Y\left(1-\frac{1}{s^{2}+1}\right)=\frac{1}{s^{2}}
      \;\Longrightarrow\;
      Y\cdot\frac{s^{2}}{s^{2}+1}=\frac{1}{s^{2}}
      $$

      $$
      Y=\frac{s^{2}+1}{s^{4}}=\frac{1}{s^{2}}+\frac{1}{s^{4}}
      $$

      **Antitransformar**, con
      $\mathcal{L}^{-1}\left\{\frac{1}{s^{n+1}}\right\}=\frac{t^{n}}{n!}$:

      $$
      \boxed{\;y\left(t\right)=t+\frac{t^{3}}{6}\;}
      $$

      **El factorial es donde se pierde el ejercicio.** $\frac{1}{s^{4}}$
      corresponde a $\frac{t^{3}}{3!}=\frac{t^{3}}{6}$, no a $\frac{t^{3}}{3}$.
      El $n$ del numerador es uno menos que el exponente de $s$, y el factorial
      es del exponente de $t$.

      **La comprobación, que aquí es obligada** porque la ecuación no tiene
      condiciones iniciales que verificar. Sustituyendo $y\left(t\right)
      =t+\frac{t^{3}}{6}$ en el segundo miembro:

      | $t$ | $t+\int_{0}^{t}\operatorname{sen}\left(t-u\right)y\left(u\right)du$ | $y\left(t\right)$ |
      |---|---|---|
      | $0{,}5$ | $0{,}520833$ | $0{,}520833$ |
      | $1$ | $1{,}166667$ | $1{,}166667$ |
      | $2$ | $3{,}333333$ | $3{,}333333$ |
      | $3$ | $7{,}500000$ | $7{,}500000$ |

      **Por qué la respuesta es un polinomio, si hay un seno de por medio.** La
      convolución con el seno actúa como una «doble integración con corrección»:
      su transformada, $\frac{1}{s^{2}+1}$, se parece a $\frac{1}{s^{2}}$ para
      $s$ grande. Al despejar, el $s^{2}+1$ del denominador se cancela contra el
      del numerador y solo quedan potencias de $s$ — es decir, polinomios. Si el
      término independiente fuese otro, el seno sí aparecería.

  - id: ex1516-ext-7-el-semicirculo-y-los-dos-ordenes
    titulo: El semicírculo, y la integral que solo sale en polares
    fuente: >-
      Ejercicio 4 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 20 de
      junio de 2016 · Cálculo – Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 5
      comp4: 4
    enunciado: |
      Considerar la integral

      $$
      \int_{-a}^{a}\left(\int_{0}^{\sqrt{a^{2}-x^{2}}}
      \left(x^{2}+y^{2}\right)dy\right)dx
      $$

      Se pide:

      a) Representar el recinto de integración.

      b) Invertir el orden de integración.

      c) Calcular el valor de la integral.
    pide: El recinto, la integral con el orden cambiado, y su valor.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué recinto describen los límites?
        opciones:
          - texto: >-
              El **semicírculo superior** de radio $a$ centrado en el origen
            correcta: true
            mensaje: |
              Eso es. La $x$ recorre el diámetro de $-a$ a $a$, y para cada $x$ la
              $y$ va de $0$ —el eje— hasta la semicircunferencia
              $y=\sqrt{a^{2}-x^{2}}$.
          - texto: El círculo completo de radio $a$
            mensaje: |
              El límite inferior de $y$ es $0$, no $-\sqrt{a^{2}-x^{2}}$: solo
              entra la mitad de arriba.
          - texto: El cuadrado de lado $2a$
            mensaje: |
              Sería un cuadrado si el límite superior de $y$ fuese constante.
              Aquí depende de $x$, y esa dependencia es la que curva el borde.

      - tipo: calcular
        titulo: El coeficiente del resultado
        pregunta: |
          El valor de la integral es $k\,a^{4}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.7853982'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '1.5707963'
            mensaje: |
              $\frac{\pi}{2}$ es el resultado del **círculo entero**. Aquí solo
              entra el semicírculo, y $\theta$ va de $0$ a $\pi$, no a $2\pi$.
          - valor: '3.1415927'
            mensaje: |
              $\pi$ saldría de $\int_{0}^{\pi}\int_{0}^{a}r^{2}dr\,d\theta$ sin el
              jacobiano. El $r$ de $dA=r\,dr\,d\theta$ es el que sube el exponente
              a $4$.
          - valor: '0.3926991'
            mensaje: |
              $\frac{\pi}{8}$ es la mitad de lo que sale. Con
              $\int_{0}^{a}r^{3}dr=\frac{a^{4}}{4}$ y $\int_{0}^{\pi}d\theta=\pi$
              queda $\frac{\pi}{4}$.
        pista: |
          En polares, $x^{2}+y^{2}=r^{2}$ y $dA=r\,dr\,d\theta$, con $\theta$ de
          $0$ a $\pi$.
        desarrollo: |
          $$
          \int_{0}^{\pi}\!\!\int_{0}^{a}r^{2}\cdot r\,dr\,d\theta
          =\pi\cdot\frac{a^{4}}{4}
          $$

          $$
          k=\frac{\pi}{4}\approx0{,}7854
          $$

      - tipo: calcular
        titulo: El valor con a = 2
        pregunta: |
          ¿Cuánto vale la integral si $a=2$?
        respuesta:
          tipo: numero
          valor: '12.5663706'
          tolerancia: 0.01
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '3.1415927'
            mensaje: |
              $\pi$ es el valor con $a=1$. La dependencia es $a^{4}$, así que
              doblar el radio multiplica por $16$.
          - valor: '6.2831853'
            mensaje: |
              $2\pi$ saldría de una dependencia $a^{2}$. El integrando ya lleva un
              $r^{2}$, y el jacobiano otro $r$: el exponente final es $4$.
          - valor: '25.1327412'
            mensaje: |
              $8\pi$ es el doble: el círculo entero en vez del semicírculo.
        pista: |
          $\frac{\pi a^{4}}{4}$ con $a=2$.
        desarrollo: |
          $$
          \frac{\pi\cdot2^{4}}{4}=\frac{16\pi}{4}=4\pi\approx12{,}566
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El recinto es el semicírculo superior de radio $a$: para cada
              $x\in\left[-a,a\right]$, la $y$ va de $0$ a
              $\sqrt{a^{2}-x^{2}}$.
          - texto: >-
              Invirtiendo, la $y$ recorre $\left[0,a\right]$ y para cada $y$ la
              $x$ va de $-\sqrt{a^{2}-y^{2}}$ a $\sqrt{a^{2}-y^{2}}$.
          - texto: >-
              En polares el recinto es $0\le r\le a$, $0\le\theta\le\pi$, y la
              integral vale $\int_{0}^{\pi}\int_{0}^{a}r^{3}dr\,d\theta
              =\frac{\pi a^{4}}{4}$.
          - texto: >-
              Al invertir el orden, los límites de $y$ pasan a ser
              $\left[0,a\right]$ y los de $x$ siguen siendo $\left[-a,a\right]$,
              porque el recinto está contenido en ese rectángulo.
            trampa: true
            mensaje: |
              Estar contenido en un rectángulo no autoriza a usarlo como límites:
              eso integraría sobre el rectángulo entero, que es más grande que el
              semicírculo. Los límites de la variable interior tienen que
              **describir el recinto**, y para una $y$ fija la $x$ solo llega
              hasta $\pm\sqrt{a^{2}-y^{2}}$.
    resolucion: |
      **a) El recinto.** Los límites se leen de dentro afuera:

      | variable | de | a |
      |---|---|---|
      | $y$ (interior) | $0$ | $\sqrt{a^{2}-x^{2}}$ |
      | $x$ (exterior) | $-a$ | $a$ |

      La curva $y=\sqrt{a^{2}-x^{2}}$ es la mitad superior de la circunferencia
      $x^{2}+y^{2}=a^{2}$, así que el recinto es el **semicírculo superior de
      radio $a$**.

