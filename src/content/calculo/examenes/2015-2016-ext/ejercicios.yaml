      </figcaption>
      </figure>

      **Por qué la media sigue subiendo cuando la función ya no sube.** A partir
      de $x=2$ entra en el promedio el valor $1$, que es mayor que lo acumulado
      —$\frac12$ en ese momento—, así que la media tira hacia arriba. Sube cada
      vez menos, y de ahí la concavidad, pero sube: en $x=3$ vale $\frac34$ y su
      límite si el tramo plano siguiera sería $1$.

      **c) El valor medio en $\left[1,\frac32\right]$.** Es
      $\overline{y}\left(\frac32\right)$, y $\frac32$ está en el primer tramo:

      $$
      \boxed{\;\overline{y}\!\left(\tfrac32\right)=\frac{\frac32-1}{2}
      =\frac14\;}
      $$

  - id: ex1516-ext-3-enunciar-y-demostrar-lagrange
    titulo: Enunciar y demostrar el teorema del valor medio
    fuente: >-
      Ejercicio 3 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 20 de
      junio de 2016 · Cálculo – Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 2
      comp4: 8
    enunciado: |
      Enunciar y demostrar el Teorema de Lagrange (teorema del valor medio).
    pide: El enunciado con sus hipótesis, y la demostración.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Sobre qué función auxiliar se aplica el teorema de Rolle?
        opciones:
          - texto: >-
              Sobre la diferencia entre $f$ y la cuerda:
              $g\left(x\right)=f\left(x\right)-f\left(a\right)
              -\frac{f\left(b\right)-f\left(a\right)}{b-a}\left(x-a\right)$
            correcta: true
            mensaje: |
              Eso es. Esa $g$ mide la distancia vertical de la curva a la cuerda,
              y se anula en los dos extremos por construcción. Ahí Rolle da un
              punto con $g'=0$, que es justo lo que se busca.
          - texto: Sobre la propia $f$
            mensaje: |
              Rolle exige $f\left(a\right)=f\left(b\right)$, y en general no lo
              es. Restar la cuerda es exactamente lo que arregla eso.
          - texto: >-
              Sobre $f\left(x\right)-f\left(a\right)$
            mensaje: |
              Esa se anula en $a$ pero no en $b$: vale
              $f\left(b\right)-f\left(a\right)$, que no tiene por qué ser cero.
              Falta quitarle la parte lineal.

      - tipo: calcular
        titulo: La pendiente que hay que igualar
        pregunta: |
          Para $f\left(x\right)=x^{3}-2x+1$ en $\left[0,2\right]$, ¿cuál es la
          pendiente de la cuerda?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              $f\left(2\right)-f\left(0\right)=5-1=4$ es el **incremento**, no la
              pendiente. Falta dividir entre $b-a=2$.
          - valor: '10'
            mensaje: |
              $10$ es $f'\left(2\right)=3\cdot4-2$, la pendiente **en el
              extremo**. La cuerda tiene otra.
          - valor: '-2'
            mensaje: |
              $-2$ es $f'\left(0\right)$, la pendiente en el otro extremo. Y de
              paso: la cuerda tiene una pendiente intermedia entre esas dos, lo
              cual ya adelanta que el $c$ existe.
        pista: |
          $f\left(0\right)=1$ y $f\left(2\right)=8-4+1=5$.
        desarrollo: |
          $$
          \frac{f\left(2\right)-f\left(0\right)}{2-0}=\frac{5-1}{2}=2
          $$

          Y el teorema garantiza un $c$ con $f'\left(c\right)=2$:
          $3c^{2}-2=2$, o sea $c=\sqrt{4/3}\approx1{,}155$, que está dentro de
          $\left(0,2\right)$ ✓.

      - tipo: justificar
        pregunta: Ordena la demostración. Una pieza es falsa.
        piezas:
          - texto: >-
              Se define $g\left(x\right)=f\left(x\right)-f\left(a\right)
              -\frac{f\left(b\right)-f\left(a\right)}{b-a}\left(x-a\right)$, que
              es continua en $\left[a,b\right]$ y derivable en
              $\left(a,b\right)$ por serlo $f$.
          - texto: >-
              $g\left(a\right)=0$ por construcción, y
              $g\left(b\right)=f\left(b\right)-f\left(a\right)
              -\left(f\left(b\right)-f\left(a\right)\right)=0$: se cumplen las
              hipótesis de Rolle.
          - texto: >-
              Rolle da un $c\in\left(a,b\right)$ con $g'\left(c\right)=0$, y
              como $g'\left(x\right)=f'\left(x\right)
              -\frac{f\left(b\right)-f\left(a\right)}{b-a}$, eso es
              exactamente la tesis.
          - texto: >-
              El punto $c$ es único, porque una función derivable no puede tener
              dos tangentes con la misma pendiente.
            trampa: true
            mensaje: |
              Sí puede, y a menudo las tiene: en $f\left(x\right)=\operatorname{sen}x$
              sobre $\left[0,2\pi\right]$ la cuerda es horizontal y hay **dos**
              puntos con tangente horizontal. El teorema afirma que existe **al
              menos uno**, y decir «el punto» en vez de «un punto» es un error de
              enunciado que cuesta puntos.
    resolucion: |
      **El enunciado, con las hipótesis separadas.** Son dos, y son distintas:

      > Si $f$ es **continua en el cerrado** $\left[a,b\right]$ y **derivable en
      > el abierto** $\left(a,b\right)$, entonces existe al menos un
      > $c\in\left(a,b\right)$ tal que
      > $$
      > f'\left(c\right)=\frac{f\left(b\right)-f\left(a\right)}{b-a}
      > $$

      Los dos puntos de COMP 2 son por esto, y hay que escribirlo con cuidado:

      - **continua en el cerrado**, para poder hablar de $f\left(a\right)$ y
        $f\left(b\right)$;
      - **derivable solo en el abierto**, porque en los extremos no hace falta —y
        eso permite aplicarlo a funciones con tangente vertical en un extremo,
        como $\sqrt x$ en $\left[0,1\right]$—;
      - **existe al menos un** $c$, no «el» $c$.

      **La lectura geométrica**, que ayuda a no olvidar la fórmula: en algún
      punto interior la **tangente es paralela a la cuerda** que une los
      extremos.

      <figure class="figura-examen">
      <svg viewBox="0 0 300 245" role="img" width="300" height="245"
