      **b) El orden invertido.** Ahora la $y$ es la variable exterior y recorre
      todo su rango, $\left[0,a\right]$. Para cada $y$ fija, la $x$ va de un lado
      de la circunferencia al otro:

      $$
      x^{2}+y^{2}\le a^{2}
      \;\Longrightarrow\;
      -\sqrt{a^{2}-y^{2}}\le x\le\sqrt{a^{2}-y^{2}}
      $$

      $$
      \boxed{\;\int_{0}^{a}\left(\int_{-\sqrt{a^{2}-y^{2}}}^{\sqrt{a^{2}-y^{2}}}
      \left(x^{2}+y^{2}\right)dx\right)dy\;}
      $$

      **c) El valor.** En los dos órdenes cartesianos la cuenta es fea —salen
      raíces al cubo—, y el integrando está pidiendo polares a gritos:
      $x^{2}+y^{2}=r^{2}$.

      $$
      \int_{0}^{\pi}\!\!\int_{0}^{a}r^{2}\underbrace{\cdot\,r\,dr\,d\theta}
      _{dA=r\,dr\,d\theta}
      =\int_{0}^{\pi}d\theta\int_{0}^{a}r^{3}dr
      =\pi\cdot\frac{a^{4}}{4}
      $$

      $$
      \boxed{\;\frac{\pi a^{4}}{4}\;}
      $$

      **El jacobiano no es decoración.** Sin el $r$ de $dA=r\,dr\,d\theta$
      saldría $\frac{\pi a^{3}}{3}$, con el exponente equivocado. Una forma de
      cazarlo sin recordar la fórmula: el integrando tiene dimensiones de
      longitud al cuadrado y el área otras dos, así que el resultado tiene que ir
      con $a^{4}$.

      **Por qué el enunciado pide invertir el orden si luego se resuelve en
      polares.** Porque son tres competencias distintas: leer un recinto a partir
      de unos límites (COMP 1), reescribirlos (COMP 2) y elegir el sistema de
      coordenadas que hace la cuenta viable (COMP 2 otra vez). El apartado b) se
      puede responder sin calcular nada, y vale sus puntos igual.

      **Comprobación numérica.** Con $a=2$ la integral doble en cartesianas, por
      sumas de Riemann sobre una malla de $2000\times2000$, da $12{,}5665$, y
      $\frac{\pi\cdot16}{4}=4\pi=12{,}5664$.
