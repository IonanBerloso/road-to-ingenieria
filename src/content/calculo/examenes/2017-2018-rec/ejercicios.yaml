ejercicios:
  - id: ex1718-rec-1-la-elipse-cortada-por-el-sector
    titulo: Una elipse escrita con distancias, y un sector que la recorta
    fuente: >-
      Ejercicio 1 · Cuarta evaluación, PRIMER CUATRIMESTRAL, 12 de febrero de
      2018 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3
    enunciado: |
      Calcular y representar geométricamente los afijos de los números
      complejos $z$ que verifican las condiciones

      $$
      |z-4i| + |z+4i| < 10
      \qquad \wedge \qquad
      \frac{\pi}{6} \le \arg z \le \frac{\pi}{3}
      $$
    pide: La región del plano y su dibujo.

    pasos:
      - tipo: reconocer
        pregunta: |
          «La suma de las distancias a dos puntos fijos es constante». ¿Qué
          lugar geométrico es?
        opciones:
          - texto: Una elipse, con esos dos puntos como focos
            correcta: true
            mensaje: |
              Esa es la definición de elipse, y aquí los focos son $4i$ y
              $-4i$. Con «$<$» en vez de «$=$» se queda el interior.
          - texto: Una circunferencia
            mensaje: |
              La circunferencia es «distancia a **un** punto constante»:
              $|z-z_{0}| = r$. Aquí hay dos puntos y una suma, que es otra
              cosa.
          - texto: Una hipérbola
            mensaje: |
              La hipérbola sale de la **diferencia** de distancias a dos focos,
              no de la suma. Cambia el $+$ por un $-$ y sí.
          - texto: >-
              Una recta, la mediatriz del segmento que une los dos puntos
            mensaje: |
              La mediatriz es «distancias **iguales**»: $|z-a| = |z-b|$. Aquí
              lo que se fija es la suma, no la igualdad.

      - tipo: calcular
        titulo: El semieje horizontal de la elipse
        pregunta: |
          Puesta como $\frac{x^{2}}{b^{2}} + \frac{y^{2}}{a^{2}} = 1$, ¿cuánto
          vale $b$, el semieje sobre el eje real?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '5'
            mensaje: |
              5 es el semieje **mayor**, el que va en la dirección de los
              focos: $2a=10$, así que $a=5$ sobre el eje imaginario. El
              horizontal es el otro.
          - valor: '4'
            mensaje: |
              4 es la semidistancia focal $c$, la coordenada de los focos $\pm
              4i$. Es el cateto de la relación, no un semieje.
          - valor: '6.4031'
            mensaje: |
              $\sqrt{25+16}$: has sumado donde hay que restar. La relación es
              $a^{2} = b^{2} + c^{2}$, así que $b^{2} = a^{2}-c^{2}$.
        pista: |
          De $2a = 10$ sale $a=5$, y los focos dan $c=4$. Ahora usa
          $a^{2} = b^{2}+c^{2}$.
        desarrollo: |
          La suma de distancias es $2a$, luego $a = 5$; los focos están en
          $\pm 4i$, luego $c = 4$. Y en una elipse

          $$
          a^{2} = b^{2} + c^{2}
          \;\Longrightarrow\;
          b^{2} = 25 - 16 = 9
          \;\Longrightarrow\;
          b = 3
          $$

          Como los focos están sobre el eje imaginario, el semieje mayor es el
          vertical:

          $$
          \frac{x^{2}}{9} + \frac{y^{2}}{25} < 1
          $$

      - tipo: calcular
        titulo: La pendiente del borde superior del sector
        pregunta: |
          La condición $\arg z \le \frac{\pi}{3}$ recorta con una semirrecta
          desde el origen. ¿Cuál es su pendiente?
        respuesta:
          tipo: numero
          valor: '1.7320508'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.5773503'
            mensaje: |
              $\tan\frac{\pi}{6}$, que es la pendiente del borde **inferior**
              del sector. La de arriba es la del ángulo mayor.
          - valor: '1.0471976'
            mensaje: |
              Eso es $\frac{\pi}{3}$ en radianes, o sea el ángulo. La pendiente
              es su tangente, no el ángulo.
          - valor: '0.8660254'
            mensaje: |
              $\operatorname{sen}\frac{\pi}{3}$. La pendiente de una recta que
              pasa por el origen con ángulo $\theta$ es $\tan\theta$, no el
              seno.
        pista: |
          Una semirrecta desde el origen con argumento $\theta$ es
          $y = x\tan\theta$ con $x>0$.
        desarrollo: |
          $$
          \tan\frac{\pi}{3} = \sqrt{3} \approx 1{,}7320508
          $$

          Y el borde inferior es $y = x\tan\frac{\pi}{6} = \frac{x}{\sqrt3}$.
          Las dos son **semirrectas**, no rectas: solo la parte con $x>0$,
          porque el argumento de un número del segundo o tercer cuadrante no
          está entre $\frac\pi6$ y $\frac\pi3$.

      - tipo: justificar
        titulo: Cómo se describe la región
        pregunta: Ordena la descripción de la región. Una pieza es falsa.
        piezas:
          - texto: >-
              La primera condición es la definición de elipse de focos $\pm4i$
              con $2a=10$; como es una desigualdad estricta, se queda el
              **interior**, sin el borde.
          - texto: >-
              De $a=5$ y $c=4$ sale $b=3$, así que en cartesianas es
              $\frac{x^{2}}{9}+\frac{y^{2}}{25}<1$: una elipse alargada en
              vertical.
          - texto: >-
              La segunda condición es un sector angular cerrado con vértice en
              el origen, entre las semirrectas de pendientes
              $\tan\frac\pi6$ y $\tan\frac\pi3$, ambas incluidas.
          - texto: >-
              El origen queda fuera: $\arg 0$ no está definido, así que $z=0$
              no cumple la segunda condición.
          - texto: >-
              La región es la intersección: el trozo del sector que queda
              dentro de la elipse, con los dos lados rectos incluidos y el
              arco elíptico excluido.
          - texto: >-
              Como la elipse tiene semieje horizontal 3 y el sector está en el
              primer cuadrante, la intersección es un triángulo.
            trampa: true
            mensaje: |
              No es un triángulo: dos de sus lados son rectos —las
              semirrectas— pero el tercero es el **arco de la elipse**, que es
              curvo. Es un sector elíptico. La confusión sale de dibujar a
              mano alzada y cerrar la figura con una recta; en un ejercicio
              donde tres puntos son COMP4, el dibujo es parte de la respuesta.

    resolucion: |
      ## La primera condición: una elipse

      $|z-4i| + |z+4i|$ es la suma de las distancias de $z$ a los puntos $4i$ y
      $-4i$. Que esa suma sea constante es **la definición de elipse**, con
      esos dos puntos como focos. Aquí la constante es 10, así que

      $$
      2a = 10 \;\Rightarrow\; a = 5,
      \qquad
      c = 4,
      \qquad
      b^{2} = a^{2}-c^{2} = 9 \;\Rightarrow\; b = 3
      $$

      Los focos están sobre el eje imaginario, así que el eje mayor es el
      vertical:

      $$
      \frac{x^{2}}{9} + \frac{y^{2}}{25} < 1
      $$

      Y la desigualdad es **estricta**: el borde no entra.

      Conviene decir de dónde sale la relación $a^{2}=b^{2}+c^{2}$ en vez de
      soltarla: en el extremo del eje menor, las distancias a los dos focos son
      iguales y valen $a$ cada una, y con el semieje menor $b$ y la
      semidistancia focal $c$ forman un triángulo rectángulo.

      ## La segunda: un sector

      $\frac\pi6 \le \arg z \le \frac\pi3$ es un sector angular con vértice en
      el origen, limitado por las semirrectas

      $$
      y = \frac{x}{\sqrt3} \quad (x>0)
      \qquad\text{y}\qquad
      y = \sqrt3\,x \quad (x>0)
      $$

      Las dos **incluidas**, porque las desigualdades no son estrictas. Y el
      origen **no**: $\arg 0$ no está definido.

      ## La región

      La intersección: el trozo de sector que cae dentro de la elipse. Tres
      lados, y no todos rectos:

      | borde | ¿entra? |
      |---|---|
      | semirrecta $y = x/\sqrt3$ | sí |
      | semirrecta $y = \sqrt3\,x$ | sí |
      | arco de elipse | no |
      | vértice $z=0$ | no |

      Es un **sector elíptico**, no un triángulo: el lado exterior es curvo. Y
      como el sector vive en el primer cuadrante, el trozo que se queda es el
      que va del origen hacia arriba y a la derecha, cortado por la elipse.

      ## Lo que evalúa la COMP4

      Tres puntos, y se los lleva el dibujo hecho con criterio: la elipse
      alargada en vertical —no una circunferencia—, los dos bordes rectos
      trazados con sus pendientes distintas, el arco en discontinuo por ser
      estricto, y el origen marcado como excluido. Un dibujo a ojo con una
      elipse redonda pierde esos puntos aunque las cuentas estén bien.

  - id: ex1718-rec-2-el-coseno-del-doble
    titulo: Una identidad de siempre, ahora en todo el plano complejo
    fuente: >-
      Ejercicio 2 · Cuarta evaluación, PRIMER CUATRIMESTRAL, 12 de febrero de
      2018 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3
    enunciado: |
      Demostrar la propiedad
      $\cos^{2} z - \operatorname{sen}^{2} z = \cos 2z$ para todo $z \in \mathbb{C}$.
    pide: La demostración, válida en todo el plano complejo.

    pasos:
      - tipo: reconocer
        pregunta: |
          La identidad se sabe de bachillerato para ángulos reales. ¿Por qué
          hay que demostrarla otra vez?
        opciones:
          - texto: >-
              Porque en $\mathbb{C}$ el seno y el coseno son **otra
              definición**, y hay que comprobar que la propiedad sobrevive
            correcta: true
            mensaje: |
              Exacto. En $\mathbb{C}$ no hay triángulos ni circunferencia
              goniométrica: $\cos z$ y $\operatorname{sen} z$ se definen con la
              exponencial. Que una identidad geométrica siga valiendo hay que
              verificarlo, y aquí se verifica en tres líneas.
          - texto: >-
              Porque en $\mathbb{C}$ la identidad es distinta y hay que
              corregirle un signo
            mensaje: |
              No: esta identidad vale igual. Lo que sí cambia son otras cosas
              —el seno y el coseno dejan de estar acotados—, pero las
              identidades algebraicas se conservan porque salen de la
              exponencial.
          - texto: >-
              Porque los ángulos complejos no existen y hay que redefinirlos
            mensaje: |
              El argumento no es que falte el ángulo, es que la **definición**
              de las funciones es otra. La demostración no habla de ángulos en
              ningún momento.
          - texto: >-
              No hace falta demostrarla: se hereda de $\mathbb{R}$ por
              continuidad
            mensaje: |
              Ese salto es justo lo que el ejercicio quiere ver justificado, y
              tal cual está dicho es falso: $|\cos x|\le 1$ también es cierto
              en $\mathbb{R}$ y no se hereda. El principio de prolongación
              analítica existe, pero tiene hipótesis y no se invoca de pasada.

      - tipo: calcular
        titulo: El denominador que aparece al elevar el seno al cuadrado
        pregunta: |
          Al escribir $\operatorname{sen}^{2}z = \frac{\left(e^{iz}-e^{-iz}\right)^{2}}{k}$,
          ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '-4'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              Falta el signo. El denominador del seno es $2i$, y
              $(2i)^{2} = 4i^{2} = -4$. Ese menos es lo que hace que al restar
              los dos cuadrados se cancelen los términos cruzados.
          - valor: '2'
            mensaje: |
              El 2 es el denominador del **coseno**. El del seno es $2i$, y
              además hay que elevarlo al cuadrado.
          - valor: '-2'
            mensaje: |
              Has puesto el signo pero no has elevado: $(2i)^{2}$ son cuatro
              unidades, no dos.
        pista: |
          $\operatorname{sen} z = \frac{e^{iz}-e^{-iz}}{2i}$. Al elevar al
          cuadrado, el denominador es $(2i)^{2}$.
        desarrollo: |
          $$
          (2i)^{2} = 4i^{2} = -4
          \qquad\Longrightarrow\qquad
          \operatorname{sen}^{2} z = \frac{\left(e^{iz}-e^{-iz}\right)^{2}}{-4}
          = -\frac{e^{2iz} - 2 + e^{-2iz}}{4}
          $$

          Ese signo es el motor de toda la demostración: al restar
          $\cos^{2}z - \operatorname{sen}^{2}z$, los dos $-2$ y $+2$ del
          desarrollo se cancelan y quedan solo $e^{2iz}$ y $e^{-2iz}$.

      - tipo: justificar
        titulo: La demostración
        pregunta: Ordena la demostración. Una pieza es falsa.
        piezas:
          - texto: >-
              Por definición,
              $\cos z = \frac{e^{iz}+e^{-iz}}{2}$ y
              $\operatorname{sen} z = \frac{e^{iz}-e^{-iz}}{2i}$, para todo
              $z\in\mathbb{C}$.
          - texto: >-
              Elevando al cuadrado:
              $\cos^{2}z = \frac{e^{2iz}+2+e^{-2iz}}{4}$ y
              $\operatorname{sen}^{2}z = \frac{e^{2iz}-2+e^{-2iz}}{-4}$.
          - texto: >-
              Restando, los dos denominadores se juntan y queda
              $\cos^{2}z - \operatorname{sen}^{2}z = \frac{2e^{2iz}+2e^{-2iz}}{4}
              = \frac{e^{2iz}+e^{-2iz}}{2}$.
          - texto: >-
              Y eso es exactamente $\cos(2z)$, sin más que leer la definición
              del coseno con $2z$ en lugar de $z$.
          - texto: >-
              Todos los pasos son álgebra sobre la exponencial compleja, que
              está definida en todo $\mathbb{C}$: la identidad vale para todo
              $z$.
          - texto: >-
              Como $\cos^{2}z + \operatorname{sen}^{2}z = 1$, basta despejar
              $\operatorname{sen}^{2}z$ y sustituir.
            trampa: true
            mensaje: |
              La identidad fundamental sí vale en $\mathbb{C}$, pero usarla
              aquí es **circular**: se demuestra por el mismo camino que esta,
              y el ejercicio pide precisamente ese camino. Además, sustituir
              solo convierte el enunciado en $2\cos^{2}z-1 = \cos 2z$, que
              sigue sin estar demostrado.

    resolucion: |
      ## Por qué no basta con «ya lo sé de bachillerato»

      En $\mathbb{R}$ esta identidad se dibuja en la circunferencia
      goniométrica. En $\mathbb{C}$ no hay circunferencia que valga: el seno y
      el coseno **se definen** a partir de la exponencial,

      $$
      \cos z = \frac{e^{iz}+e^{-iz}}{2},
      \qquad
      \operatorname{sen} z = \frac{e^{iz}-e^{-iz}}{2i}
      $$

      y con esa definición hay propiedades reales que se pierden — el coseno
      complejo no está acotado, y $\cos z = 2$ tiene solución. Así que
      comprobar cuáles sobreviven no es un trámite.

      ## La demostración

      $$
      \cos^{2} z = \frac{\left(e^{iz}+e^{-iz}\right)^{2}}{4}
      = \frac{e^{2iz} + 2 + e^{-2iz}}{4}
      $$

      $$
      \operatorname{sen}^{2} z = \frac{\left(e^{iz}-e^{-iz}\right)^{2}}{(2i)^{2}}
      = \frac{e^{2iz} - 2 + e^{-2iz}}{-4}
      = -\,\frac{e^{2iz} - 2 + e^{-2iz}}{4}
      $$

      Restando —y aquí el signo del $-4$ hace que en realidad se **sumen**:

      $$
      \cos^{2}z - \operatorname{sen}^{2}z
      = \frac{e^{2iz}+2+e^{-2iz}}{4} + \frac{e^{2iz}-2+e^{-2iz}}{4}
      = \frac{2e^{2iz} + 2e^{-2iz}}{4}
      = \frac{e^{2iz}+e^{-2iz}}{2}
      $$

      Y esa última expresión es la definición del coseno evaluada en $2z$:

      $$
      \boxed{\cos^{2}z - \operatorname{sen}^{2}z = \cos 2z \quad \forall z\in\mathbb{C}}
      $$

      ## Los tres puntos de COMP4

      No se los lleva la cuenta, que es corta. Se los lleva **decir en qué
      momento se usa que $z$ es complejo**: en ninguno. Todos los pasos son
      álgebra sobre $e^{w}$, que está definida en todo el plano, así que la
      identidad vale en todo el plano. Esa frase, escrita, es la diferencia
      entre un 7 y un 10.

  - id: ex1718-rec-3-dos-sucesiones-a-trozos
    titulo: Dos sucesiones casi idénticas, y solo una converge
    fuente: >-
      Ejercicio 3 · Cuarta evaluación, PRIMER CUATRIMESTRAL, 12 de febrero de
      2018 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 1
      comp4: 7
    enunciado: |
      a) Definir el concepto de convergencia de una sucesión.

      b) Estudiar, de forma argumentada, la convergencia de las siguientes
      sucesiones:

      $$
      \text{b.1)}\quad
      \{a_{n}\}_{n\in\mathbb{N}} =
      \begin{cases}
      2 + \dfrac{1}{n} & n \text{ impar} \\[2mm]
      -2 - \dfrac{1}{n} & n \text{ par}
      \end{cases}
      \qquad
      \text{b.2)}\quad
      \{a_{n}\}_{n\in\mathbb{N}} =
      \begin{cases}
      2 + \dfrac{1}{n} & n < 50 \\[2mm]
      -2 - \dfrac{1}{n} & n \ge 50
      \end{cases}
      $$
    pide: La definición y el estudio argumentado de las dos sucesiones.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos sucesiones usan **las mismas dos fórmulas**. ¿Qué las
          diferencia?
        opciones:
          - texto: >-
              Que en b.1 los dos trozos se alternan para siempre y en b.2 uno
              de ellos se acaba
            correcta: true
            mensaje: |
              Ahí está todo. En b.1 hay infinitos términos cerca de $2$ e
              infinitos cerca de $-2$; en b.2, a partir de $n=50$ solo queda un
              trozo, y los 49 primeros son un número **finito** de términos
              que no afecta al límite.
          - texto: Que b.2 empieza más tarde
            mensaje: |
              Las dos empiezan en $n=1$. Lo que cambia es dónde está la
              frontera entre los trozos: en b.1 no hay frontera, hay
              alternancia.
          - texto: Que en b.2 el segundo trozo tiene más términos
            mensaje: |
              Los dos trozos de b.1 tienen también infinitos términos cada uno.
              La diferencia no es cuántos hay, es que en b.2 uno de los dos se
              **agota**.
          - texto: >-
              Que b.1 no es una sucesión bien definida, porque da dos valores
              para el mismo $n$
            mensaje: |
              Sí lo está: cada $n$ es par o impar, nunca las dos cosas, así que
              cada término tiene un único valor. Definir por casos es legítimo
              mientras los casos no se solapen ni dejen huecos.

      - tipo: calcular
        titulo: El límite de la segunda
        pregunta: |
          ¿A qué converge la sucesión b.2?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Ese es el valor al que se acercan los **primeros** términos, pero
              se acaban en $n=49$. El límite solo mira lo que pasa a partir de
              un $n$ en adelante, y a partir de 50 la sucesión vale
              $-2-\frac1n$.
          - valor: '0'
            mensaje: |
              0 sería el promedio de los dos valores, y el límite no promedia
              nada: es el valor al que se acerca la **cola** de la sucesión.
          - valor: '-2.02'
            mensaje: |
              Ese es $a_{50} = -2-\frac{1}{50}$, un término concreto, no el
              límite. Según crece $n$, $\frac1n$ se va a cero y el término se
              acerca a $-2$ desde abajo.
        pista: |
          Para $n\ge 50$ la sucesión es exactamente $-2-\frac1n$. ¿A dónde va
          eso cuando $n$ crece?
        desarrollo: |
          Para todo $n \ge 50$,

          $$
          a_{n} = -2 - \frac{1}{n}
          \qquad\Longrightarrow\qquad
          \lim_{n\to\infty} a_{n} = -2
          $$

          Los 49 primeros términos no intervienen. Y eso no es un atajo: es
          exactamente lo que dice la definición, porque la condición
          $|a_{n}-l|<\varepsilon$ solo se exige **a partir de** un cierto $m$,
          y siempre se puede tomar $m \ge 50$.

          Formalmente: dado $\varepsilon>0$, basta con
          $m = \max\left(50,\ \left\lfloor\frac1\varepsilon\right\rfloor+1\right)$,
          y para $n\ge m$ se tiene $|a_{n}+2| = \frac1n < \varepsilon$.

      - tipo: justificar
        titulo: Por qué la primera no converge
        pregunta: >-
          Ordena la demostración de que b.1 no converge. Una pieza es falsa.
        piezas:
          - texto: >-
              Si una sucesión converge a $l$, **toda** subsucesión suya
              converge también a $l$.
          - texto: >-
              La subsucesión de los índices impares es $2+\frac1n$, que
              converge a 2.
          - texto: >-
              La de los índices pares es $-2-\frac1n$, que converge a $-2$.
          - texto: >-
              Dos subsucesiones con límites distintos, así que la sucesión no
              puede converger: si convergiera, las dos tendrían que ir al mismo
              sitio.
          - texto: >-
              Además está acotada —todos los términos están en $[-3,3]$—, lo
              que confirma que estar acotada no basta para converger.
          - texto: >-
              Y como no converge, la sucesión tiende a infinito.
            trampa: true
            mensaje: |
              No converger y tender a infinito son cosas distintas. Esta
              sucesión está acotada entre $-3$ y $3$, así que no tiende a
              infinito de ninguna manera: **oscila**. Divergir es simplemente
              «no converger», y hay dos formas de hacerlo — irse a infinito, u
              oscilar sin decidirse.

    resolucion: |
      Siete de los diez puntos son COMP4: lo que se corrige es el argumento,
      no el resultado.

      ## a) La definición

      > $\{a_{n}\}$ **converge** a $l$ si para todo $\varepsilon>0$ existe
      > $m\in\mathbb{N}$ tal que $|a_{n}-l|<\varepsilon$ para todo $n\ge m$.

      Dos detalles que este ejercicio va a cobrar:

      - la condición se exige **a partir de** un $m$, no para todos los $n$;
      - $|a_{n}-l|$ es una **distancia**, así que no distingue si la sucesión
        se acerca por arriba o por abajo.

      ## b.1) No converge

      El truco no es calcular, es partirla:

      | subsucesión | vale | tiende a |
      |---|---|---|
      | índices impares | $2 + \frac1n$ | $2$ |
      | índices pares | $-2 - \frac1n$ | $-2$ |

      Si la sucesión convergiera a un $l$, toda subsucesión suya convergería a
      ese mismo $l$. Aquí hay dos que van a sitios distintos, luego **no
      converge**.

      Se puede decir también con la definición, y conviene saberlo: tomando
      $\varepsilon = 1$, ningún $l$ puede estar a distancia menor que 1 de $2$
      y de $-2$ a la vez, porque esos dos puntos distan 4.

      Y una observación que vale puntos: la sucesión **está acotada**, entre
      $-3$ y $3$. Es el contraejemplo de manual a «acotada implica
      convergente».

      ## b.2) Converge a −2

      A partir de $n=50$ la sucesión es exactamente $-2-\frac1n$. Los 49
      primeros términos son un número **finito** y no intervienen: la
      definición solo pide que la condición se cumpla a partir de algún $m$, y
      basta tomar $m\ge 50$.

      $$
      \lim_{n\to\infty} a_{n} = \lim_{n\to\infty}\left(-2-\frac1n\right) = -2
      $$

      Con $\varepsilon$: dado $\varepsilon>0$, tómese
      $m = \max\left(50, \left\lfloor\frac1\varepsilon\right\rfloor+1\right)$;
      para $n\ge m$, $|a_{n}-(-2)| = \frac1n < \varepsilon$.

      ## Lo que el ejercicio está enseñando

      Que **el límite es un asunto de la cola**. Las dos sucesiones toman los
      mismos dos valores y solo cambia cómo se reparten los índices: en una,
      los dos trozos se alternan para siempre y no hay cola que valga; en la
      otra, uno se agota y la cola es limpia. Cambiar 49 términos —o 49
      millones— no cambia el límite; cambiar infinitos, sí.
