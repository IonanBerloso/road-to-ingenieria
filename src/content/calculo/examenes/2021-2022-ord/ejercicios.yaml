  - id: ex2122-ord-2-cinco-afirmaciones-sobre-dos-graficas
    titulo: Cinco afirmaciones sobre dos gráficas, y las cuatro que fallan
    fuente: >-
      Ejercicio 2 del PRIMER PARCIAL · Convocatoria ordinaria, 10 de junio de 2022 ·
      Cálculo, UPV/EHU · Es literalmente el mismo ejercicio, figura incluida, que
      el 2 de la ordinaria de 2023-2024 · El examen no publica solución: la
      resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Sean $f(x)$ y $g(x)$ las funciones cuyas gráficas se muestran en la
      figura. Decir, razonando formalmente, si las siguientes afirmaciones son
      ciertas o falsas:

