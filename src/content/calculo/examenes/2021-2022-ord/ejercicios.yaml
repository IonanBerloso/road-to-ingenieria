          <text x="294" y="106" text-anchor="end">6</text>
          <text x="294" y="89" text-anchor="end">7</text>
          <text x="294" y="72" text-anchor="end">8</text>
          <text x="294" y="55" text-anchor="end">9</text>
          <text x="294" y="38" text-anchor="end">10</text>
        </g>
        <text class="fg22-et" x="157" y="75">f(x)</text>
        <text class="fg22-et" x="402.5" y="103">g(x)</text>
        <text class="fg22-n" x="217.2" y="218">x</text>
        <text class="fg22-n" x="45" y="33.6">y</text>
        <text class="fg22-n" x="488" y="218">x</text>
        <text class="fg22-n" x="305" y="27.7">y</text>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original. Las dos curvas pasan por nudos
      enteros de la cuadrícula, así que aquí se dibujan con las parábolas que
      los unen: f(x) = 6 − (x−3)² y g(u) = 1 + (u−5)².
      </figcaption>
      </figure>

      a) La función $f^{-1}(x)$ definida en el intervalo $(3,4)$ es decreciente.

      b) La función $f^{-1}(x)$ definida en el intervalo $(3,4)$ es convexa.

      c) La función $h(x)=g(f(x))$ es creciente en el intervalo $(1,2)$.

      d) La función $h(x)=g(f(x))$ es cóncava en el intervalo $(1,2)$.

      e) Sea $P_{2}(x)=a+b(x-4)+c\left(x-4\right)^{2}$ el polinomio de Taylor de
      orden 2 de $f(x)$. Entonces $a>0$, $b<0$, $c>0$.
    pide: Verdadero o falso en las cinco, con el argumento.

    pasos:
      - tipo: reconocer
        pregunta: |
          Para decidir si $f^{-1}$ es decreciente en $(3,4)$, ¿qué hay que
          mirar?
        opciones:
          - texto: >-
              El signo de $f'$ en $(3,4)$, porque
              $\left(f^{-1}\right)'(y)=\dfrac{1}{f'(x)}$
            correcta: true
            mensaje: |
              Eso es. La derivada de la inversa es el inverso de la derivada, y
              un inverso tiene el mismo signo que el original: si $f$ decrece,
              su inversa decrece. En $(3,4)$ la parábola ya ha pasado su máximo
              y baja, así que las dos decrecen.
          - texto: El signo de $f$ en $(3,4)$
            mensaje: |
              El signo de la función no dice nada de su monotonía. Aquí $f$ es
              positiva en todo el intervalo y sin embargo está bajando; una cosa
              es dónde está la gráfica y otra hacia dónde va.
          - texto: Solo si $f$ es inyectiva en ese intervalo
            mensaje: |
              Hace falta para que la inversa **exista**, y por eso el enunciado
              restringe a $(3,4)$, donde la parábola es inyectiva. Pero una vez
              que existe, que sea creciente o decreciente lo decide el signo de
              $f'$.

      - tipo: calcular
        titulo: El coeficiente de segundo grado
        pregunta: |
          En el polinomio del apartado e), ¿cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Signo. $f(x)=6-(x-3)^{2}$ es una parábola **hacia abajo**, así que
              $f''=-2$ en todas partes y $c=f''(4)/2=-1$.
          - valor: '-2'
            mensaje: |
              Ese es $f''(4)$, sin dividir entre $2!$. El coeficiente de
              $(x-4)^{2}$ en Taylor lleva el factorial.
          - valor: '5'
            mensaje: |
              Ese es $a=f(4)$. El enunciado pide el coeficiente del término
              cuadrático, que es $f''(4)/2$.
        pista: |
          $c=\dfrac{f''(4)}{2}$, y en una parábola la segunda derivada es
          constante.
        desarrollo: |
          Con $f(x)=6-(x-3)^{2}$:

          $$
          a=f(4)=5>0\ \checkmark,
          \qquad
          b=f'(4)=-2<0\ \checkmark,
          \qquad
          c=\frac{f''(4)}{2}=\frac{-2}{2}=-1
          $$

          Los dos primeros signos que pide e) se cumplen; el tercero no. Por eso
          la afirmación es **falsa**, y falla solo por $c$.

      - tipo: calcular
        titulo: La derivada de la composición
        pregunta: |
          ¿Cuánto vale $h'(1{,}5)$, con $h=g\circ f$?
        respuesta:
          tipo: numero
          valor: '-7.5'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '7.5'
            mensaje: |
              Signo. $f'(1{,}5)=3>0$ pero $g'\!\left(f(1{,}5)\right)=
              2(3{,}75-5)=-2{,}5<0$: el producto es negativo y $h$ **decrece**.
          - valor: '-2.5'
            mensaje: |
              Eso es solo $g'$ evaluada en $f(1{,}5)$. Falta multiplicar por
              $f'(1{,}5)$, que es la regla de la cadena.
          - valor: '3'
            mensaje: |
              Eso es solo $f'(1{,}5)$. La derivada de la composición es el
              producto de las dos, y la de fuera se evalúa en el valor de la de
              dentro.
        pista: |
          $h'=g'(f(x))\cdot f'(x)$, con $f(1{,}5)=3{,}75$ y
          $g'(u)=2(u-5)$.
        desarrollo: |
          $$
          f(1{,}5)=6-(1{,}5-3)^{2}=3{,}75,
          \qquad
          f'(1{,}5)=-2(1{,}5-3)=3
          $$

          $$
          g'(u)=2(u-5)
          \;\Longrightarrow\;
          g'(3{,}75)=-2{,}5
          $$

          $$
          h'(1{,}5)=(-2{,}5)\cdot 3=-7{,}5<0
          $$

          Así que c) es **falsa**: $h$ decrece en $(1,2)$. Y no es casualidad:
          en todo $(1,2)$ se tiene $f<5$, donde $g$ decrece, mientras que $f$
          crece.

      - tipo: justificar
        pregunta: Ordena el estudio de la curvatura de $h$ en $(1,2)$. Una pieza es falsa.
        piezas:
          - texto: >-
              $h'=g'(f)\,f'$, y derivando otra vez
              $h''=g''(f)\left(f'\right)^{2}+g'(f)\,f''$.
          - texto: >-
              $g''=2>0$ siempre y $\left(f'\right)^{2}\ge0$, así que el primer
              sumando no es negativo.
          - texto: >-
              En $(1,2)$ se tiene $f<5$, luego $g'(f)<0$; y $f''=-2<0$, así que
              el segundo sumando también es positivo. $h''>0$: **convexa**, no
              cóncava, y d) es falsa.
          - texto: >-
              Como $f$ es cóncava y $g$ es convexa, la composición $g\circ f$ no
              tiene curvatura definida y el apartado d) no se puede decidir.
            trampa: true
            mensaje: |
              Sí se puede, y la fórmula de arriba lo decide en tres líneas. Es
              cierto que «cóncava compuesta con convexa» no tiene una regla
              automática, pero eso no impide calcular: se deriva dos veces y se
              mira el signo de cada sumando. Aquí los dos salen positivos y el
              resultado es limpio.
    resolucion: |
      **De entrada, algo que conviene saber:** este ejercicio es el mismo, con
      la misma figura y el mismo reparto de puntos, que el ejercicio 2 de la
      convocatoria ordinaria de 2023-2024. Si ya lo has hecho allí, aquí lo que
      cambia son las preguntas guiadas, no el problema.

      **a) CIERTA.** En $(3,4)$ la parábola ya pasó su máximo y decrece, así que
      es inyectiva y tiene inversa. Y

      $$
      \left(f^{-1}\right)'(y)=\frac{1}{f'\!\left(f^{-1}(y)\right)}
      $$

      un inverso tiene el signo de lo que invierte: $f'<0$ implica
      $\left(f^{-1}\right)'<0$.

      **b) FALSA.** Derivando otra vez,

      $$
      \left(f^{-1}\right)''=-\frac{f''}{\left(f'\right)^{3}}
      $$

      En $(3,4)$ se tiene $f''=-2<0$ y $f'<0$, luego $\left(f'\right)^{3}<0$ y
      el cociente $\frac{f''}{(f')^{3}}$ es positivo; con el menos delante,
      $\left(f^{-1}\right)''<0$: **cóncava**, no convexa.

      **c) FALSA.** $h'=g'(f)\,f'$. En $(1,2)$, $f$ crece —$f'>0$— pero toma
      valores por debajo de $5$, donde $g$ decrece —$g'<0$—. El producto es
      negativo: $h$ decrece.

      **d) FALSA.**

      $$
      h''=g''(f)\left(f'\right)^{2}+g'(f)\,f''
      $$

      El primer sumando es $2\left(f'\right)^{2}\ge0$. El segundo es producto de
      dos negativos, $g'(f)<0$ y $f''=-2<0$, así que es positivo. Total:
      $h''>0$, **convexa**.

      **e) FALSA.** $a=f(4)=5>0$ y $b=f'(4)=-2<0$ se cumplen, pero
      $c=f''(4)/2=-1<0$. La afirmación falla solo por el tercer signo, y merece
      la pena decirlo así: en un examen, «falsa» a secas vale menos que «falsa,
      y falla solo en $c$».

      **Lo que hay que llevarse.** De las cinco, cuatro son falsas. El ejercicio
      no premia la intuición sino el hábito de escribir la fórmula de la
      derivada correspondiente y mirar el signo de cada factor por separado.

  - id: ex2122-ord-3-dos-series-de-mclaurin-y-dos-derivadas
    titulo: Dos series conocidas, y una derivada número veinticinco sin derivar
    fuente: >-
      Ejercicio 3 del PRIMER PARCIAL · Convocatoria ordinaria, 10 de junio de 2022 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      a) Calcular el desarrollo en serie de McLaurin de $f(x)=e^{\left|x\right|}$.

      b) Calcular el desarrollo en serie de McLaurin de $g(x)=x^{2}\sin x$.

      c) Obtener $g^{24)}(0)$ y $g^{25)}(0)$.
    pide: Las dos series y las dos derivadas en el origen.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué le pasa a $e^{\left|x\right|}$ en el origen?
        opciones:
          - texto: >-
              Que no es derivable ahí: por la derecha la derivada vale $1$ y por
              la izquierda $-1$
            correcta: true
            mensaje: |
              Eso es, y tiene consecuencias. Un desarrollo de McLaurin en
              potencias de $x$ necesita todas las derivadas en $0$, y aquí no
              existe ni la primera. Lo que sí se puede escribir es la serie en
              potencias de $\left|x\right|$, que converge a la función en todo
              punto.
          - texto: Que no es continua
            mensaje: |
              Continua sí es: $\left|x\right|\to0$ cuando $x\to0$ y la
              exponencial es continua, así que $f(x)\to1=f(0)$. Lo que falla es
              la derivabilidad, que es más fina.
          - texto: >-
              Nada; la serie de $e^{u}$ vale para cualquier $u$ y aquí basta
              poner $u=\left|x\right|$
            mensaje: |
              La sustitución es correcta y la serie converge, sí. Pero lo que
              sale no es una serie de **potencias de $x$**: los términos
              $\left|x\right|^{n}$ con $n$ impar no son polinomios. Merece la
              pena decirlo, porque es justo lo que distingue esta serie de una
              de McLaurin de verdad.

      - tipo: calcular
        titulo: El primer término de la otra serie
        pregunta: |
          En el desarrollo de $g(x)=x^{2}\sin x$, ¿cuál es el exponente del
          primer término no nulo?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Ese es el primer término de $\sin x$ a secas. Al multiplicar por
              $x^{2}$ todos los exponentes suben en dos.
          - valor: '2'
            mensaje: |
              Ese sería el exponente si el otro factor empezara en una
              constante. Pero $\sin x$ empieza en $x$, no en $1$: $\sin 0=0$.
          - valor: '5'
            mensaje: |
              Ese es el **segundo** término, $-x^{5}/6$. El primero sale de
              multiplicar $x^{2}$ por el $x$ de $\sin x$.
        pista: |
          $\sin x = x-\frac{x^{3}}{3!}+\cdots$, y todo se multiplica por
          $x^{2}$.
        desarrollo: |
          $$
          g(x)=x^{2}\left(x-\frac{x^{3}}{3!}+\frac{x^{5}}{5!}-\cdots\right)
          =x^{3}-\frac{x^{5}}{3!}+\frac{x^{7}}{5!}-\cdots
          =\sum_{k=0}^{\infty}\frac{(-1)^{k}x^{2k+3}}{(2k+1)!}
          $$

          Solo hay potencias impares, y la menor es la tercera.

      - tipo: calcular
        titulo: La derivada veinticinco
        pregunta: |
          ¿Cuánto vale $g^{25)}(0)$?
        respuesta:
          tipo: numero
          valor: '-600'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '600'
            mensaje: |
              Signo. El término en $x^{25}$ corresponde a $2k+3=25$, o sea
              $k=11$, y $(-1)^{11}=-1$.
          - valor: '0'
            mensaje: |
              Cero es $g^{24)}(0)$: no hay término en $x^{24}$ porque la serie
              solo tiene potencias impares. El $25$ sí existe.
          - valor: '-25'
            mensaje: |
              Has dividido entre $24!$ en vez de entre $23!$. El coeficiente de
              $x^{25}$ es $\frac{-1}{(2\cdot11+1)!}=\frac{-1}{23!}$, y
              $\frac{25!}{23!}=25\cdot24$.
        pista: |
          El coeficiente de $x^{n}$ en la serie de McLaurin es
          $\frac{g^{n)}(0)}{n!}$. Despeja.
        desarrollo: |
          El término de exponente $25$ sale de $2k+3=25$, es decir $k=11$:

          $$
          \frac{(-1)^{11}}{23!}\,x^{25}=\frac{g^{25)}(0)}{25!}\,x^{25}
          $$

          $$
          g^{25)}(0)=\frac{25!}{23!}\cdot(-1)=-25\cdot24=-600
          $$

          Y $g^{24)}(0)=0$, porque en la serie no hay ningún término en
          $x^{24}$.

      - tipo: justificar
        pregunta: Ordena el apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              La serie de McLaurin de $g$ es
              $\sum_{k\ge0}\frac{(-1)^{k}}{(2k+1)!}x^{2k+3}$, y por unicidad del
              desarrollo el coeficiente de $x^{n}$ es $\frac{g^{n)}(0)}{n!}$.
          - texto: >-
              Como todos los exponentes son impares, el coeficiente de $x^{24}$
              es cero y por tanto $g^{24)}(0)=0$.
          - texto: >-
              Para $x^{25}$ se resuelve $2k+3=25$, sale $k=11$ y el coeficiente
              es $\frac{-1}{23!}$.
          - texto: >-
              Ese coeficiente es directamente el valor de la derivada, así que
              $g^{25)}(0)=-\frac{1}{23!}$.
            trampa: true
            mensaje: |
              Falta el factorial. El coeficiente **es** $\frac{g^{n)}(0)}{n!}$,
              no $g^{n)}(0)$: hay que multiplicar por $25!$. Y ahí está la
              gracia del ejercicio: un número minúsculo, $-1/23!\approx
              -3{,}9\cdot10^{-23}$, se convierte en $-600$ al deshacer el
              factorial. Si el resultado te sale del orden de $10^{-23}$, has
              caído aquí.
    resolucion: |
      **a) La serie de $e^{\left|x\right|}$, y la advertencia que la acompaña.**
      Sustituyendo $u=\left|x\right|$ en $e^{u}=\sum u^{n}/n!$:

      $$
      e^{\left|x\right|}=\sum_{n=0}^{\infty}\frac{\left|x\right|^{n}}{n!}
      =1+\left|x\right|+\frac{x^{2}}{2!}+\frac{\left|x\right|^{3}}{3!}+\cdots
      $$

      y converge para todo $x$, porque la de $e^{u}$ converge en todo
      $\mathbb{R}$.

      Ahora la parte que vale COMP 4: **esto no es una serie de potencias de
      $x$.** Un desarrollo de McLaurin de verdad necesita todas las derivadas en
      el origen, y $e^{\left|x\right|}$ no es derivable ahí: por la derecha vale
      $e^{x}$, con derivada $1$; por la izquierda $e^{-x}$, con derivada $-1$.
      Lo que sí se puede decir, y es equivalente, es que

      $$
      e^{\left|x\right|}=
      \begin{cases}
      \sum_{n\ge0}\frac{x^{n}}{n!} & x\ge0\\[4pt]
      \sum_{n\ge0}\frac{(-x)^{n}}{n!} & x\le0
      \end{cases}
      $$

      dos series de potencias distintas, una a cada lado.

      **b) La serie de $x^{2}\sin x$.** Aquí no hay ninguna trampa: se toma la
      de $\sin x$ y se multiplica.

      $$
      g(x)=\sum_{k=0}^{\infty}\frac{(-1)^{k}}{(2k+1)!}\,x^{2k+3}
      =x^{3}-\frac{x^{5}}{6}+\frac{x^{7}}{120}-\cdots
      $$

      **c) Las dos derivadas, sin derivar ni una vez.** La unicidad del
      desarrollo dice que el coeficiente de $x^{n}$ vale $\frac{g^{n)}(0)}{n!}$.
      Entonces:

      - **$g^{24)}(0)=0$**, porque no hay término en $x^{24}$: todos los
        exponentes son impares. Otra forma de verlo: $g$ es impar, y las
        derivadas de orden par de una función impar se anulan en el origen.
      - **$g^{25)}(0)$**: el exponente $25$ aparece con $k=11$ y coeficiente
        $\frac{-1}{23!}$, luego

      $$
      g^{25)}(0)=25!\cdot\frac{-1}{23!}=-25\cdot24=-600
      $$

      Derivar veinticinco veces $x^{2}\sin x$ con la regla de Leibniz también
      funciona y es un ejercicio perfectamente resoluble, pero en un examen sin
      calculadora cuesta media hora. La serie lo resuelve en dos líneas, y esa
      es exactamente la razón de que los apartados a) y b) vayan delante.

  - id: ex2122-ord-4-el-volumen-del-cono-por-integracion
    titulo: De dónde sale el tercio de la fórmula del cono
    fuente: >-
      Ejercicio 4 del PRIMER PARCIAL · Convocatoria ordinaria, 10 de junio de 2022 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Utilizando la integral definida calcular el volumen de un cono de radio
      $r$ y altura $h$.
    pide: El volumen, deducido con una integral y no citado de memoria.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué función hay que integrar, y respecto de qué variable?
        opciones:
          - texto: >-
              El área de las secciones circulares perpendiculares al eje,
              respecto de la altura
            correcta: true
            mensaje: |
              Eso es: el método de las secciones. Se corta el sólido por planos
              perpendiculares al eje, cada corte es un disco de área
              $\pi\rho(z)^{2}$, y el volumen es la integral de esas áreas a lo
              largo del eje. Todo se reduce a saber cómo cambia el radio con la
              altura.
          - texto: La longitud de la generatriz, respecto del radio
            mensaje: |
              Eso daría una longitud o, con el factor adecuado, un área lateral,
              pero no un volumen. Un volumen sale de integrar áreas, y un área
              de integrar longitudes.
          - texto: >-
              El perímetro de las secciones, respecto de la altura
            mensaje: |
              Integrar perímetros a lo largo del eje daría algo con dimensiones
              de área, no de volumen. El perímetro sirve para el área lateral, y
              aun así hace falta el elemento de arco, no $dz$.

      - tipo: calcular
        titulo: El radio de una sección
        pregunta: |
          En un cono de radio $6$ y altura $10$ con el vértice arriba, ¿cuánto
          mide el radio de la sección a la altura $z=4$?
        respuesta:
          tipo: numero
          valor: '3.6'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2.4'
            mensaje: |
              Has usado $r\cdot\frac{z}{h}$ en vez de
              $r\left(1-\frac{z}{h}\right)$. Con el vértice arriba el radio
              **disminuye** con la altura: vale $6$ en la base y $0$ en el
              vértice.
          - valor: '6'
            mensaje: |
              Ese es el radio de la base. Si fuera constante el sólido sería un
              cilindro, y su volumen $\pi r^{2}h$ — el triple.
          - valor: '4'
            mensaje: |
              Has puesto la altura donde va el radio. La sección a la altura $4$
              tiene radio $6\left(1-\frac{4}{10}\right)$.
        pista: |
          El radio va de $r$ en $z=0$ a $0$ en $z=h$, y lo hace en línea recta.
        desarrollo: |
          $$
          \rho(z)=r\left(1-\frac{z}{h}\right)
          =6\left(1-\frac{4}{10}\right)=3{,}6
          $$

      - tipo: calcular
        titulo: El factor de la fórmula
        pregunta: |
          El volumen sale de la forma $V=k\,\pi r^{2}h$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.3333333'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              Ese es el cilindro de la misma base y la misma altura. El cono
              cabe tres veces dentro de él, y ese tercio es justo lo que produce
              la integral.
          - valor: '0.5'
            mensaje: |
              Un medio sería el resultado de integrar el **radio**, que decrece
              linealmente. Lo que se integra es el área, que va con el radio al
              cuadrado, y la integral de un cuadrado deja un $3$ abajo.
          - valor: '0.6666667'
            mensaje: |
              Dos tercios es el factor de la media esfera,
              $\frac{2}{3}\pi R^{3}$. Aquí la integral de $(1-z/h)^{2}$ entre
              $0$ y $h$ vale $h/3$.
        pista: |
          $\displaystyle\int_{0}^{h}\left(1-\frac{z}{h}\right)^{2}dz$ — hazla con
          el cambio $u=1-z/h$.
        desarrollo: |
          $$
          V=\int_{0}^{h}\pi\,\rho(z)^{2}\,dz
          =\pi r^{2}\int_{0}^{h}\left(1-\frac{z}{h}\right)^{2}dz
          $$

          Con $u=1-\frac{z}{h}$, $dz=-h\,du$, y los límites $u=1\to0$:

          $$
          \int_{0}^{h}\left(1-\frac{z}{h}\right)^{2}dz
          =h\int_{0}^{1}u^{2}\,du=\frac{h}{3}
          $$

          $$
          V=\frac{\pi r^{2}h}{3}
          $$

      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Se coloca el cono con la base en $z=0$ y el vértice en $z=h$, y se
              corta por planos horizontales.
          - texto: >-
              Cada corte es un disco cuyo radio va de $r$ a $0$ en línea recta,
              es decir $\rho(z)=r\left(1-\frac{z}{h}\right)$.
          - texto: >-
              El volumen es la integral de las áreas de esos discos,
              $V=\int_{0}^{h}\pi\rho(z)^{2}dz=\frac{\pi r^{2}h}{3}$.
          - texto: >-
              Como el radio medio de las secciones es $r/2$, el volumen es el de
              un cilindro de ese radio, $\pi\left(\frac r2\right)^{2}h$.
            trampa: true
            mensaje: |
              Daría $\frac{\pi r^{2}h}{4}$, y el resultado es $\frac{\pi
              r^{2}h}{3}$. El fallo es promediar el radio cuando lo que se
              integra es el **área**: el cuadrado de la media no es la media de
              los cuadrados. Este error concreto —promediar antes de elevar—
              reaparece en cuanto un enunciado dice «radio medio» o «altura
              media», y siempre da de menos.
    resolucion: |
      **Por qué el enunciado insiste en «utilizando la integral definida».**
      Porque la respuesta $\frac{\pi r^{2}h}{3}$ se sabe de memoria desde el
      instituto, y aquí lo que se evalúa es de dónde sale el tercio. Escribir la
      fórmula sin deducirla no puntúa.

      **El montaje.** Cono con la base en $z=0$ y el vértice en $z=h$. Se corta
      por planos perpendiculares al eje: cada corte es un disco.

      **El radio de cada corte.** El perfil del cono es una recta que va de
      $(0,r)$ a $(h,0)$ en el plano $(z,\rho)$:

      $$
      \rho(z)=r\left(1-\frac{z}{h}\right)
      $$

      **La integral.**

      $$
      V=\int_{0}^{h}\pi\rho(z)^{2}\,dz
      =\pi r^{2}\int_{0}^{h}\left(1-\frac{z}{h}\right)^{2}dz
      =\pi r^{2}\cdot\frac{h}{3}
      =\frac{\pi r^{2}h}{3}
      $$

      **De dónde viene el tres.** De integrar un cuadrado: $\int u^{2}=u^{3}/3$.
      Ese tres es el mismo que aparece en el volumen de la pirámide, y por el
      mismo motivo: la sección decrece linealmente y el área va con el cuadrado.
      Si el radio decreciera como una raíz, o como cualquier otra cosa, el
      denominador sería otro.

      **La comprobación de sentido.** El cilindro que envuelve al cono tiene
      volumen $\pi r^{2}h$, así que el cono se lleva exactamente un tercio. Vale
      la pena tenerlo como referencia: cualquier resultado que dé más de
      $\pi r^{2}h$ o menos de cero está mal sin necesidad de revisar la cuenta.

  - id: ex2122-ord-5-el-area-del-paraboloide-rematado-en-cono
    titulo: Un cuenco parabólico rematado en punta, y su superficie
    fuente: >-
      Ejercicio 1 del SEGUNDO PARCIAL · Convocatoria ordinaria, 10 de junio de 2022 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Sea $S$ el sólido definido por las condiciones
      $x^{2}+y^{2}\le z$; $x^{2}+y^{2}\le(z-6)^{2}$; $0\le z\le6$.

      a) Dibujar el sólido $S$.

      b) Calcular el área de la superficie de $S$.
    pide: El dibujo del sólido y el área total de su superficie.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿A qué altura se cortan las dos superficies que limitan el sólido?
        opciones:
          - texto: >-
              En $z=4$, con radio $2$: es donde $\sqrt{z}=6-z$
            correcta: true
            mensaje: |
              Eso es. El paraboloide tiene radio $\sqrt{z}$ y el cono
              $\left|z-6\right|=6-z$; igualando sale $z^{2}-13z+36=0$, con
              raíces $4$ y $9$. Solo $z=4$ cae dentro del intervalo permitido, y
              ahí el radio común vale $2$.
          - texto: En $z=9$
            mensaje: |
              Es la otra raíz de la ecuación, y hay que descartarla en voz alta:
              el enunciado impone $0\le z\le6$. Además, en $z=9$ el cono ya está
              del otro lado de su vértice.
          - texto: En $z=6$
            mensaje: |
              En $z=6$ está el vértice del cono, donde su radio es cero,
              mientras que el paraboloide tiene ahí radio $\sqrt6\approx2{,}45$.
              No se tocan: el cono va por dentro.

      - tipo: calcular
        titulo: El área del casquete parabólico
        pregunta: |
          ¿Cuánto mide el área de la parte de paraboloide que limita el sólido?
        respuesta:
          tipo: numero
          valor: '36.1769'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '12.5664'
            mensaje: |
              Eso es $4\pi$, el área del **disco** de radio $2$, o sea la sombra
              del casquete. Una superficie curva mide más que su proyección: el
              factor que lo corrige es $\sqrt{1+4r^{2}}$.
          - valor: '29.1980'
            mensaje: |
              Te has dejado la $r$ del elemento de área en polares. El integrando
              es $\sqrt{1+4r^{2}}\;r\,dr\,d\theta$, y sin esa $r$ la integral ni
              siquiera es elemental.
          - valor: '33.5103'
            mensaje: |
              Has quitado el $1$ de dentro de la raíz:
              $\sqrt{4r^{2}}=2r$ da $2\pi\int_{0}^{2}2r^{2}dr=\frac{32\pi}{3}$.
              Ese $1$ es el que representa la parte «plana» de la superficie y
              no se puede despreciar cerca del origen, donde el paraboloide es
              casi horizontal.
        pista: |
          Para $z=g(x,y)$, $dS=\sqrt{1+g_{x}^{2}+g_{y}^{2}}\;dA$, y en polares
          $dA=r\,dr\,d\theta$.
        desarrollo: |
          Con $z=x^{2}+y^{2}$ se tiene $g_{x}=2x$, $g_{y}=2y$, así que

          $$
          dS=\sqrt{1+4x^{2}+4y^{2}}\;dA=\sqrt{1+4r^{2}}\;r\,dr\,d\theta
          $$

          $$
          A_{1}=\int_{0}^{2\pi}\!\!\int_{0}^{2}\sqrt{1+4r^{2}}\;r\,dr\,d\theta
          =2\pi\left[\frac{(1+4r^{2})^{3/2}}{12}\right]_{0}^{2}
          =\frac{\pi\left(17\sqrt{17}-1\right)}{6}
          \approx36{,}177
          $$

      - tipo: calcular
        titulo: El área total
        pregunta: |
          ¿Cuánto mide la superficie completa de $S$?
        respuesta:
          tipo: numero
          valor: '53.9484'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '36.1769'
            mensaje: |
              Ese es solo el casquete parabólico. Falta el cono que lo remata,
              que aporta $4\sqrt2\,\pi\approx17{,}77$.
          - valor: '17.7715'
            mensaje: |
              Ese es solo el cono. El sólido está cerrado por abajo con el
              paraboloide, que es la parte grande.
          - valor: '66.5148'
            mensaje: |
              Has sumado también el disco de radio $2$ a la altura $z=4$. Ese
              disco es **interior** al sólido: no es una cara, es donde se
              encuentran las dos superficies. Añadirlo cuenta como pared algo
              que está por dentro.
        pista: |
          El cono tiene radio de base $2$ y altura $2$; su área lateral es
          $\pi R g$ con $g$ la generatriz.
        desarrollo: |
          El cono va de $r=2$ en $z=4$ hasta el vértice en $z=6$: altura $2$ y
          radio $2$, luego generatriz $g=\sqrt{2^{2}+2^{2}}=2\sqrt2$ y

          $$
          A_{2}=\pi R g=\pi\cdot2\cdot2\sqrt2=4\sqrt2\,\pi\approx17{,}772
          $$

          $$
          A=\frac{\pi\left(17\sqrt{17}-1\right)}{6}+4\sqrt2\,\pi\approx53{,}948
          $$

      - tipo: justificar
        pregunta: Ordena el planteamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La primera condición pone el sólido **dentro** del paraboloide
              $z=x^{2}+y^{2}$, es decir, por encima de él; la segunda lo pone
              dentro del cono $r=6-z$; y la tercera lo corta entre $z=0$ y
              $z=6$.
          - texto: >-
              Las dos superficies se cortan en $z=4$, $r=2$: por debajo manda el
              paraboloide, que es más estrecho, y por encima manda el cono.
          - texto: >-
              La frontera es entonces el casquete de paraboloide con $r\le2$ más
              la parte de cono entre $z=4$ y el vértice; no hay ninguna cara
              plana, porque el paraboloide se cierra en el origen y el cono en
              su vértice.
          - texto: >-
              Como el sólido apoya en el plano $z=0$, hay que sumar además el
              disco de la base.
            trampa: true
            mensaje: |
              No hay base. En $z=0$ la condición $x^{2}+y^{2}\le0$ deja un solo
              punto, el origen: el paraboloide se cierra en punta, igual que el
              cono arriba. El sólido toca el plano $z=0$ en un punto, y un punto
              no tiene área.
    resolucion: |
      **a) Qué sólido es.** Tres condiciones, y conviene traducirlas una a una:

      - $x^{2}+y^{2}\le z$ deja los puntos **por encima** del paraboloide
        $z=r^{2}$: el interior del cuenco.
      - $x^{2}+y^{2}\le(z-6)^{2}$ es el interior del cono de vértice
        $(0,0,6)$; con $z\le6$ la condición es $r\le6-z$.
      - $0\le z\le6$ recorta la franja.

      Se cortan donde $\sqrt z=6-z$, o sea $z^{2}-13z+36=0$, con raíces $4$ y
      $9$. La buena es $z=4$, y ahí el radio común es $2$. Por debajo de esa
      altura el paraboloide es más estrecho y es él quien limita; por encima lo
      es el cono.

