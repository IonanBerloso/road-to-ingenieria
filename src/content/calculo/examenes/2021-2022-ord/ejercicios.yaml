      La onda cuadrada. Punto lleno donde el valor se alcanza y hueco donde no:
      en cada salto la función vale 1, según el enunciado.
      </figcaption>
      </figure>

      **b) La serie.** El camino corto es restar la media:

      $$
      u(t)=f(t)-\frac12=
      \begin{cases}+\frac12&0\le t\le\pi\\[2pt]-\frac12&\pi<t<2\pi\end{cases}
      $$

      que es impar, y por tanto solo tiene senos. La media vuelve como término
      constante:

      $$
      \frac{a_{0}}{2}=\frac12,
      \qquad
      a_{n}=0\ (n\ge1),
      \qquad
      b_{n}=\frac{1-(-1)^{n}}{n\pi}
      $$

      $$
      S(t)=\frac12+\frac{2}{\pi}
      \left(\sin t+\frac{\sin 3t}{3}+\frac{\sin 5t}{5}+\cdots\right)
      $$

      **c) Los dos puntos, que son distintos a propósito.**

      $$
      t=4\pi\equiv0:\qquad S=\frac{0+1}{2}=\frac12,\qquad f(4\pi)=1
      $$

      $$
      t=\frac\pi2:\qquad S=f=1
      $$

      El primero es un salto y el segundo un punto de continuidad. Que la serie
      **no** reproduzca la función en $t=4\pi$ no es un fallo del cálculo: es lo
      que dice Dirichlet, y decirlo con esas palabras es lo que puntúa.

      **d) La suma.** El apartado c) no estaba ahí por gusto: ha localizado el
      punto donde $S=f$. En $t=\frac\pi2$ los senos impares valen $(-1)^{k}$, y

      $$
      1=\frac12+\frac{2}{\pi}\sum_{k=0}^{\infty}\frac{(-1)^{k}}{2k+1}
      \;\Longrightarrow\;
      \sum_{k=0}^{\infty}\frac{(-1)^{k}}{2k+1}=\frac{\pi}{4}
      $$

      que es la serie de Leibniz. La del enunciado lleva $(-1)^{n+1}$, es decir,
      es esta con todos los signos cambiados:

      $$
      \sum_{n=0}^{\infty}\frac{(-1)^{n+1}}{2n+1}=-\frac{\pi}{4}
      $$

      Dos cuidados que cuestan la mitad del apartado: elegir un punto de
      **continuidad** para poder igualar $S=f$ —en $t=0$ la igualdad sería
      falsa—, y mirar el exponente del $(-1)$ antes de escribir el resultado.
