      <figcaption>
      La sección meridiana del sólido. El sólido es lo que sale de girar este
      perfil alrededor del eje vertical: un cuenco parabólico hasta la altura 4,
      donde el radio vale 2, y desde ahí un cono que se cierra en punta en la
      altura 6.
      </figcaption>
      </figure>

      **b) La superficie, que son dos trozos y ninguna tapa.** Merece la pena
      pararse en esto antes de integrar: el sólido no tiene ninguna cara plana.
      Abajo el paraboloide se cierra en el origen, arriba el cono se cierra en
      su vértice, y el disco de radio $2$ a la altura $4$ es **interior**, no
      frontera.

      **El casquete parabólico.** Para una superficie $z=g(x,y)$,

      $$
      dS=\sqrt{1+g_{x}^{2}+g_{y}^{2}}\,dA
      =\sqrt{1+4r^{2}}\;r\,dr\,d\theta
      $$

      $$
      A_{1}=2\pi\int_{0}^{2}\sqrt{1+4r^{2}}\;r\,dr
      =2\pi\left[\frac{(1+4r^{2})^{3/2}}{12}\right]_{0}^{2}
      =\frac{\pi\left(17\sqrt{17}-1\right)}{6}
      $$

      **El cono.** Se puede integrar igual —para $z=6-r$ el factor es
      $\sqrt2$, y $A_{2}=2\pi\sqrt2\int_{0}^{2}r\,dr=4\sqrt2\,\pi$— o usar
      directamente la fórmula del área lateral, $\pi Rg$, con $R=2$ y
      generatriz $g=2\sqrt2$. Sale lo mismo, y en un examen sin calculadora la
      segunda vía ahorra tiempo si se justifica.

      **El total.**

      $$
      A=\frac{\pi\left(17\sqrt{17}-1\right)}{6}+4\sqrt2\,\pi
      \approx36{,}18+17{,}77=53{,}95
      $$

      **Comprobación de sentido.** La esfera que envolvería al sólido tendría
      radio algo más de $3$ y área del orden de $110$; una superficie de $54$
      para un cuerpo que cabe holgadamente dentro es razonable. Y el casquete
      parabólico, que es más ancho y más curvado, pesa el doble que el cono:
      también encaja.

  - id: ex2122-ord-6-una-edo-con-resonancia-y-un-polinomio
    titulo: Un segundo miembro con dos partes, y una de ellas resuena
    fuente: >-
      Ejercicio 2 del SEGUNDO PARCIAL · Convocatoria ordinaria, 10 de junio de 2022 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Resolver la EDO $y''+y'-6y=-e^{2x}+12x^{2}+2x+3$.
    pide: La solución general.

    pasos:
      - tipo: reconocer
        pregunta: |
          Para el trozo $-e^{2x}$ del segundo miembro, ¿por qué no sirve el
          ensayo $y_{p}=Ae^{2x}$?
        opciones:
          - texto: >-
              Porque $2$ es raíz de la ecuación característica, así que
              $Ae^{2x}$ ya es solución de la homogénea y al sustituirlo da cero
            correcta: true
            mensaje: |
              Eso es. La característica es $r^{2}+r-6=0$, con raíces $2$ y $-3$.
              Cuando el exponente del segundo miembro coincide con una raíz
              simple, el ensayo se multiplica por $x$: $y_{p}=Axe^{2x}$.
          - texto: >-
              Porque el segundo miembro tiene también un polinomio
            mensaje: |
              Eso no estorba: por superposición se busca una particular para
              cada trozo y se suman. El problema del $e^{2x}$ es solo suyo, y
              está en el exponente.
          - texto: Porque el coeficiente es negativo
            mensaje: |
              El signo del coeficiente se arrastra hasta el final y no cambia la
              forma del ensayo. Si $2$ no fuera raíz, $y_{p}=Ae^{2x}$ funcionaría
              con $A$ negativa y ya está.

      - tipo: calcular
        titulo: El coeficiente de la parte exponencial
        pregunta: |
          Con el ensayo $y_{p}=A\,x\,e^{2x}$, ¿cuánto vale $A$?
        respuesta:
          tipo: numero
          valor: '-0.2'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.2'
            mensaje: |
              Signo. El segundo miembro es $-e^{2x}$, con el menos delante, y de
              $5A=-1$ sale $A=-\frac15$.
          - valor: '-0.3333333'
            mensaje: |
              Parece que has usado $2r-1=3$ en vez de $2r+1=5$. Al sustituir
              $Axe^{2x}$ queda $A\,e^{2x}(2r+1)$ con $r=2$, es decir $5A$: el
              factor es la **derivada** del polinomio característico evaluada en
              la raíz.
          - valor: '-1'
            mensaje: |
              Ese sería el coeficiente si $Ae^{2x}$ hubiera funcionado y el
              polinomio característico valiera $1$ en $r=2$. Vale cero, que es
              justo el motivo de multiplicar por $x$.
        pista: |
          Sustituye $y_{p}=Axe^{2x}$: $y_{p}'=Ae^{2x}(1+2x)$ y
          $y_{p}''=Ae^{2x}(4+4x)$.
        desarrollo: |
          $$
          y_{p}''+y_{p}'-6y_{p}
          =A e^{2x}\bigl[(4+4x)+(1+2x)-6x\bigr]
          =5A\,e^{2x}
          $$

          Los términos en $x$ se cancelan —tienen que hacerlo, porque $xe^{2x}$
          es lo único que puede sobrar—, y queda

          $$
          5A=-1\;\Longrightarrow\;A=-\frac15
          $$

      - tipo: calcular
        titulo: El término independiente del polinomio
        pregunta: |
          Con el ensayo $y_{q}=\alpha x^{2}+\beta x+\gamma$ para la parte
          polinómica, ¿cuánto vale $\gamma$?
        respuesta:
          tipo: numero
          valor: '-1.3333333'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.3333333'
            mensaje: |
              Signo. De $2\alpha+\beta-6\gamma=3$ con $\alpha=-2$ y $\beta=-1$
              sale $-5-6\gamma=3$, o sea $\gamma=-\frac43$.
          - valor: '-0.5'
            mensaje: |
              Has resuelto $-6\gamma=3$, olvidando que $y_{q}''$ y $y_{q}'$
              también aportan término independiente: $2\alpha$ y $\beta$.
          - valor: '-0.6666667'
            mensaje: |
              Te has dejado el $2\alpha$. La ecuación del término independiente
              es $2\alpha+\beta-6\gamma=3$, y $2\alpha=-4$ pesa más que
              $\beta$.
        pista: |
          Primero $\alpha$ con el término en $x^{2}$, luego $\beta$ con el de
          $x$, y solo entonces $\gamma$.
        desarrollo: |
          Sustituyendo $y_{q}=\alpha x^{2}+\beta x+\gamma$:

          $$
          2\alpha+(2\alpha x+\beta)-6(\alpha x^{2}+\beta x+\gamma)
          =12x^{2}+2x+3
          $$

          Igualando coeficientes, de arriba abajo:

          $$
          -6\alpha=12\;\Rightarrow\;\alpha=-2
          $$
          $$
          2\alpha-6\beta=2\;\Rightarrow\;-4-6\beta=2\;\Rightarrow\;\beta=-1
          $$
          $$
          2\alpha+\beta-6\gamma=3\;\Rightarrow\;-5-6\gamma=3\;\Rightarrow\;
          \gamma=-\frac43
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La característica $r^{2}+r-6=0$ tiene raíces $2$ y $-3$, así que
              la homogénea es $C_{1}e^{2x}+C_{2}e^{-3x}$.
          - texto: >-
              Por superposición se busca una particular para cada trozo del
              segundo miembro y se suman.
          - texto: >-
              Para $-e^{2x}$, como $2$ es raíz simple, el ensayo es $Axe^{2x}$ y
              sale $A=-\frac15$; para el polinomio de grado dos, el ensayo es un
              polinomio de grado dos y sale $-2x^{2}-x-\frac43$.
          - texto: >-
              Como el segundo miembro tiene dos partes distintas, hay que
              resolver las dos ecuaciones por separado y quedarse con la
              solución que verifique las dos.
            trampa: true
            mensaje: |
              No se elige: se **suman**. La ecuación es lineal, y eso significa
              exactamente que si $y_{p}$ resuelve con segundo miembro $f_{1}$ e
              $y_{q}$ resuelve con $f_{2}$, entonces $y_{p}+y_{q}$ resuelve con
              $f_{1}+f_{2}$. Ninguna de las dos por separado cumple la ecuación
              completa, así que quedarse con una es quedarse sin solución.
    resolucion: |
      **La homogénea.** $r^{2}+r-6=(r-2)(r+3)=0$, luego

      $$
      y_{h}=C_{1}e^{2x}+C_{2}e^{-3x}
      $$

      **El segundo miembro tiene dos partes**, y la ecuación es lineal: se busca
      una particular para cada una y se suman. Eso es el principio de
      superposición, y conviene enunciarlo, porque es lo que autoriza a partir
      el problema.

      **Parte exponencial, $-e^{2x}$.** Aquí está la única dificultad del
      ejercicio: $2$ **es** raíz de la característica, así que $Ae^{2x}$ es
      solución de la homogénea y al sustituirlo daría $0=-e^{2x}$, imposible.
      Se multiplica por $x$:

      $$
      y_{p}=A\,x\,e^{2x}
      \;\Longrightarrow\;
      y_{p}''+y_{p}'-6y_{p}=5A\,e^{2x}
      \;\Longrightarrow\;
      A=-\frac15
      $$

      El $5$ no es casual: es $p'(2)$, la derivada del polinomio característico
      en la raíz. Siempre sale eso con una raíz simple, y sirve de comprobación
      rápida.

      **Parte polinómica, $12x^{2}+2x+3$.** Como $0$ no es raíz de la
      característica, el ensayo es un polinomio del mismo grado:

      $$
      y_{q}=-2x^{2}-x-\frac43
      $$

      **La solución general.**

      $$
      y=C_{1}e^{2x}+C_{2}e^{-3x}-\frac{1}{5}x\,e^{2x}-2x^{2}-x-\frac43
      $$

      **Cómo comprobarlo sin rehacerlo.** Basta sustituir la particular y ver
      que reproduce el segundo miembro; la homogénea está garantizada por las
      raíces. Un atajo útil: el término independiente de la ecuación,
      $-6\gamma$, tiene que absorber lo que dejan $2\alpha$ y $\beta$, así que
      si $\gamma$ sale un número redondo desconfía — aquí sale $-4/3$, y ese
      tercio incómodo es señal de que la cadena de coeficientes se ha resuelto
      en el orden correcto.

  - id: ex2122-ord-7-la-antitransformada-de-un-cociente
    titulo: Un denominador sin raíces reales, y qué hacer con él
    fuente: >-
      Ejercicio 3 del SEGUNDO PARCIAL · Convocatoria ordinaria, 10 de junio de 2022 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Calcular $\mathcal{L}^{-1}\left(\dfrac{s+3}{s^{2}+4s+5}\right)$.
    pide: La función del tiempo cuya transformada es ese cociente.

    pasos:
      - tipo: reconocer
        pregunta: |
          El denominador $s^{2}+4s+5$ no tiene raíces reales. ¿Qué se hace?
        opciones:
          - texto: >-
              Completar cuadrados: $s^{2}+4s+5=(s+2)^{2}+1$
            correcta: true
            mensaje: |
              Eso es. Con esa forma se reconocen de golpe las dos
              transformadas de la tabla —la del coseno y la del seno— y el
              $+2$ se traduce en un factor $e^{-2t}$ por el teorema de
              desplazamiento.
          - texto: >-
              Descomponer en fracciones simples con las dos raíces complejas
            mensaje: |
              Se puede, y da el mismo resultado, pero obliga a manejar
              $-2\pm i$ y a recomponer exponenciales complejas al final. En un
              examen sin calculadora es el camino largo y el que más signos
              tiene donde equivocarse.
          - texto: Dividir el numerador entre el denominador
            mensaje: |
              La división solo hace falta cuando el grado del numerador es mayor
              o igual que el del denominador. Aquí es $1$ contra $2$: la
              fracción ya es propia.

      - tipo: calcular
        titulo: El resto tras separar el coseno
        pregunta: |
          Escrito como
          $\dfrac{s+2}{(s+2)^{2}+1}+\dfrac{k}{(s+2)^{2}+1}$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              Ese es el $3$ del numerador original. Al escribirlo como
              $(s+2)+1$ se separa lo que acompaña al coseno; lo que sobra es
              $3-2=1$.
          - valor: '5'
            mensaje: |
              El $5$ es el término independiente del denominador, no del
              numerador. Se ha ido al completar cuadrados: $5=4+1$.
          - valor: '-1'
            mensaje: |
              Signo. Hay que **restar** el $2$ que se añade al numerador para
              formar $s+2$: $s+3=(s+2)+1$, no $(s+2)-1$.
        pista: |
          Escribe $s+3$ en función de $s+2$.
        desarrollo: |
          $$
          \frac{s+3}{s^{2}+4s+5}
          =\frac{(s+2)+1}{(s+2)^{2}+1}
          =\frac{s+2}{(s+2)^{2}+1}+\frac{1}{(s+2)^{2}+1}
          $$

      - tipo: calcular
        titulo: Un valor de la antitransformada
        pregunta: |
          ¿Cuánto vale $f(1)$?
        respuesta:
          tipo: numero
          valor: '0.1869755'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.1353353'
            mensaje: |
              Eso es $e^{-2}$ a secas. Falta el paréntesis
              $\cos 1+\sin 1\approx1{,}382$, que multiplica.
          - valor: '1.3817733'
            mensaje: |
              Eso es $\cos 1+\sin 1$ sin la exponencial. El $+2$ del
              $(s+2)^{2}$ es justo lo que produce el factor $e^{-2t}$; sin él la
              función no decaería.
          - valor: '-0.0407637'
            mensaje: |
              Signo en el seno: sale $e^{-2t}(\cos t+\sin t)$, con más. El menos
              aparecería si el numerador fuera $s+1$, es decir, si al escribir
              $s+3=(s+2)+k$ hubieras tomado $k=-1$.
        pista: |
          $\mathcal{L}^{-1}\!\left[\frac{s+a}{(s+a)^{2}+1}\right]=e^{-at}\cos t$
          y $\mathcal{L}^{-1}\!\left[\frac{1}{(s+a)^{2}+1}\right]=e^{-at}\sin t$.
        desarrollo: |
          $$
          f(t)=e^{-2t}\cos t+e^{-2t}\sin t=e^{-2t}\left(\cos t+\sin t\right)
          $$

          $$
          f(1)=e^{-2}\left(\cos1+\sin1\right)
          \approx0{,}135335\cdot1{,}381773\approx0{,}186976
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Se completan cuadrados en el denominador,
              $s^{2}+4s+5=(s+2)^{2}+1$, y se escribe el numerador en función de
              $s+2$: $s+3=(s+2)+1$.
          - texto: >-
              El primer sumando,
              $\frac{s+2}{(s+2)^{2}+1}$, es la transformada de
              $e^{-2t}\cos t$ por el teorema de desplazamiento en $s$.
          - texto: >-
              El segundo, $\frac{1}{(s+2)^{2}+1}$, es la de $e^{-2t}\sin t$, y
              por linealidad
              $f(t)=e^{-2t}\left(\cos t+\sin t\right)$.
          - texto: >-
              El factor $e^{-2t}$ sale de la parte imaginaria de las raíces
              $-2\pm i$, y la frecuencia $1$ de la parte real.
            trampa: true
            mensaje: |
              Está cambiado. La parte **real** de las raíces, $-2$, es la que
              da la exponencial $e^{-2t}$ —cuánto se amortigua—, y la parte
              **imaginaria**, $1$, la que da la frecuencia de la oscilación.
              Cambiarlas produce un $e^{-t}$ y un $\cos 2t$, que además no
              cuadran con el $(s+2)^{2}$ que se acaba de escribir.
    resolucion: |
      **El único paso que hay que ver.** El denominador no factoriza en
      $\mathbb{R}$, así que se completa cuadrados:

      $$
      s^{2}+4s+5=(s+2)^{2}+1
      $$

      Y en cuanto aparece $(s+2)^{2}+1$, la tabla de transformadas ya está
      diciendo el resultado: algo con $e^{-2t}$ multiplicando a un seno o un
      coseno de frecuencia $1$.

      **Ajustar el numerador.** Para reconocer el coseno hace falta $s+2$
      arriba, así que se escribe $s+3=(s+2)+1$:

      $$
      \frac{s+3}{s^{2}+4s+5}
      =\underbrace{\frac{s+2}{(s+2)^{2}+1}}_{e^{-2t}\cos t}
      +\underbrace{\frac{1}{(s+2)^{2}+1}}_{e^{-2t}\sin t}
      $$

      **El resultado.**

      $$
      f(t)=e^{-2t}\left(\cos t+\sin t\right)
      $$

      **Cómo leerlo.** Las raíces del denominador son $-2\pm i$. La parte real,
      $-2$, es el amortiguamiento: la amplitud cae como $e^{-2t}$. La parte
      imaginaria, $1$, es la frecuencia. Esa lectura vale para cualquier
      denominador cuadrático sin raíces reales, y es la comprobación más rápida
      de que el resultado tiene sentido.

      **Dos comprobaciones baratas.** $f(0)=e^{0}(1+0)=1$, y por el teorema del
      valor inicial $\lim_{s\to\infty}sF(s)=\lim
      \frac{s^{2}+3s}{s^{2}+4s+5}=1$: coinciden. Y $f$ tiende a cero cuando
      $t\to\infty$, como corresponde a un $F(s)$ cuyos polos tienen parte real
      negativa.

  - id: ex2122-ord-8-el-barco-que-sigue-al-gradiente
    titulo: El barco que persigue la mancha, resuelto con Laplace
    fuente: >-
      Ejercicio 4 del SEGUNDO PARCIAL · Convocatoria ordinaria, 10 de junio de 2022 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Un petrolero ha naufragado y contaminado la superficie de cierta región
      marina. Las embarcaciones de limpieza que operan en la zona tienen la
      misión de ir recogiendo crudo de la superficie, pero moviéndose siempre en
      la trayectoria en la que mayor concentración de crudo encuentren. Se ha
      estimado que la concentración de crudo en cada punto $(x,y)$ de esa zona
      viene dada por la función $F(x,y)=x^{2}+y^{2}+x\,y$. Supongamos que una
      embarcación de limpieza se encuentra en el punto $(1,1)$ y que se desea
      calcular la trayectoria $\left(x(t),y(t)\right)$ que deberá seguir.

      a) Plantear el sistema de ecuaciones diferenciales y las condiciones
      iniciales que deben verificar $x(t)$ e $y(t)$.

      b) Utilizando la transformada de Laplace resolver el sistema anterior y
      obtener $x(t)$ e $y(t)$.
    pide: El sistema con sus condiciones iniciales, y las dos funciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué sistema hay que plantear?
        opciones:
          - texto: >-
              $\left(x',y'\right)=\nabla F$, es decir $x'=2x+y$, $y'=x+2y$, con
              $x(0)=y(0)=1$
            correcta: true
            mensaje: |
              Eso es. «Moverse hacia donde más crece» es seguir el gradiente, y
              la trayectoria que en cada instante lleva la dirección del
              gradiente cumple ese sistema. Las condiciones iniciales son el
              punto de partida.
          - texto: $\left(x',y'\right)=-\nabla F$
            mensaje: |
              Ese es el descenso, no el ascenso: el barco iría hacia donde
              **menos** crudo hay. El menos aparece en los problemas de bolas
              que ruedan cuesta abajo, no en este.
          - texto: $x'=F(x,y)$ y $y'=F(x,y)$
            mensaje: |
              Eso iguala una velocidad a una concentración, que ni siquiera
              tienen las mismas unidades. Lo que da la dirección de máximo
              crecimiento no es el valor de $F$, sino su gradiente.

      - tipo: calcular
        titulo: La velocidad inicial
        pregunta: |
          ¿Cuánto vale $x'(0)$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Te has dejado el término $xy$ al derivar. $F_{x}=2x+y$, y en
              $(1,1)$ eso vale $3$, no $2$.
          - valor: '1'
            mensaje: |
              Ese es el valor de $x(0)$, no el de su derivada. La derivada la da
              el gradiente.
          - valor: '4'
            mensaje: |
              Parece que has derivado $x^{2}+y^{2}+xy$ tratando el $xy$ como si
              aportara $2x$. Su derivada respecto de $x$ es $y$, que en $(1,1)$
              vale $1$.
        pista: |
          $F_{x}=2x+y$, evaluada en el punto de partida.
        desarrollo: |
          $$
          \nabla F=(2x+y,\;x+2y)
          \;\Longrightarrow\;
          \nabla F(1,1)=(3,3)
          $$

          El barco arranca en la dirección de la bisectriz, con las dos
          componentes iguales. Eso ya adelanta la respuesta: por simetría de
          $F$ en $x$ e $y$, y con un punto de partida simétrico, la trayectoria
          no se puede salir de la recta $y=x$.

      - tipo: calcular
        titulo: Dónde está el barco al cabo de una unidad de tiempo
        pregunta: |
          ¿Cuánto vale $x(1)$?
        respuesta:
          tipo: numero
          valor: '20.0855369'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '2.7182818'
            mensaje: |
              Eso es $e$, o sea $X(s)=\frac{1}{s-1}$. El $s-1$ del determinante
              se **cancela** con el numerador; el polo que queda es $s=3$.
          - valor: '7.3890561'
            mensaje: |
              Eso es $e^{2}$. El $2$ sale de los términos $2x$ y $2y$ del
              gradiente, pero el acoplamiento entre las dos ecuaciones lo sube a
              $3$: sumando las dos, $(x+y)'=3(x+y)$.
          - valor: '54.5981500'
            mensaje: |
              Eso es $e^{4}$. Si sumas los cuatro coeficientes del sistema te
              sales: el exponente es el autovalor de la matriz
              $\begin{pmatrix}2&1\\1&2\end{pmatrix}$ que corresponde al vector
              $(1,1)$, y vale $2+1=3$.
        pista: |
          Suma las dos ecuaciones: $(x+y)'=3(x+y)$.
        desarrollo: |
          Transformando, con $x(0)=y(0)=1$:

          $$
          \left\{
          \begin{aligned}
          (s-2)X-Y&=1\\
          -X+(s-2)Y&=1
          \end{aligned}
          \right.
          $$

          El determinante es $(s-2)^{2}-1=(s-1)(s-3)$, y por Cramer

          $$
          X=\frac{(s-2)+1}{(s-1)(s-3)}=\frac{s-1}{(s-1)(s-3)}=\frac{1}{s-3}
          $$

          Igual para $Y$. Antitransformando,
          $x(t)=y(t)=e^{3t}$, y $x(1)=e^{3}\approx20{,}09$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              «Moverse siempre hacia donde más concentración hay» significa que
              el vector velocidad lleva en cada instante la dirección del
              gradiente, así que $x'=F_{x}$ e $y'=F_{y}$.
          - texto: >-
              Con $F=x^{2}+y^{2}+xy$ eso es $x'=2x+y$, $y'=x+2y$, y el barco
              parte de $(1,1)$, luego $x(0)=y(0)=1$.
          - texto: >-
              Transformando y resolviendo, el determinante $(s-1)(s-3)$ se
              simplifica con el numerador y queda $X=Y=\frac{1}{s-3}$, es decir
              $x(t)=y(t)=e^{3t}$.
          - texto: >-
              El barco se mueve hacia donde más crudo hay, que es la dirección
              de las curvas de nivel de $F$.
            trampa: true
            mensaje: |
              Es justo la dirección contraria, y en el sentido literal: sobre
              una curva de nivel la concentración **no cambia**, así que
              moverse a lo largo de ella es lo peor que puede hacer el barco. El
              gradiente es perpendicular a las curvas de nivel, y es la
              dirección en la que $F$ crece más deprisa.
    resolucion: |
      **a) De la frase al sistema.** «Moverse siempre en la trayectoria en la
      que mayor concentración encuentren» es la definición de seguir el
      gradiente: en cada punto, la dirección de máximo crecimiento de $F$ es
      $\nabla F$. Si el barco lleva esa dirección en todo instante,

      $$
      \left\{
      \begin{aligned}
      x'(t)&=F_{x}=2x+y\\
      y'(t)&=F_{y}=x+2y\\
      x(0)&=y(0)=1
      \end{aligned}
      \right.
      $$

      Un apunte que vale COMP 4: el enunciado fija la **dirección**, no la
      rapidez. Tomar $\left(x',y'\right)=\nabla F$ es la elección natural —la
      velocidad es el propio gradiente— y con ella la trayectoria geométrica
      queda determinada; cualquier otra parametrización de la misma curva
      también valdría.

      **b) Laplace.** Con $\mathcal{L}\{x'\}=sX-1$:

      $$
      \left\{
      \begin{aligned}
      (s-2)X-Y&=1\\
      -X+(s-2)Y&=1
      \end{aligned}
      \right.
      \qquad
      \det=(s-2)^{2}-1=(s-1)(s-3)
      $$

      $$
      X=\frac{(s-2)\cdot1+1\cdot1}{(s-1)(s-3)}
      =\frac{s-1}{(s-1)(s-3)}
      =\frac{1}{s-3}
      $$

      y lo mismo para $Y$. Por tanto

      $$
      x(t)=y(t)=e^{3t}
      $$

      **La simplificación importa.** Si uno no ve que el numerador y el
      determinante comparten el factor $s-1$ y se lanza a las fracciones
      simples, aparece un término en $e^{t}$ con coeficiente cero, y con él la
      oportunidad de equivocarse. La señal es la de siempre: antes de
      descomponer, mira si numerador y denominador tienen algo en común.

      **Qué dice el resultado.** La trayectoria es $x=y=e^{3t}$: la recta
      $y=x$, recorrida cada vez más deprisa. Tiene sentido, porque $F$ es
      simétrica en $x$ e $y$ y el punto de partida está sobre la bisectriz;
      cualquier desvío rompería una simetría que nada rompe. Y el $3$ es el
      autovalor de $\begin{pmatrix}2&1\\1&2\end{pmatrix}$ asociado al vector
      $(1,1)$, que es la dirección de arranque.

      **Un detalle físico honesto:** el modelo manda al barco al infinito,
      porque $F$ no tiene máximo. Es lo que pasa cuando se toma una parábola
      como modelo de una mancha real: sirve cerca del punto de partida y deja
      de servir lejos.

  - id: ex2122-ord-9-fourier-de-la-onda-cuadrada
    titulo: La onda cuadrada, y de dónde sale la serie de Leibniz
    fuente: >-
      Ejercicio 5 del SEGUNDO PARCIAL · Convocatoria ordinaria, 10 de junio de 2022 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Sea $f(t)$ la función periódica de período $T=2\pi$ definida de la
      siguiente forma:

      $$
      f(t)=
      \begin{cases}
      1 & 0\le t\le\pi\\[2pt]
      0 & \pi<t<2\pi
      \end{cases}
      $$

      a) Dibujar la función periódica $f(t)$.

      b) Calcular la serie de Fourier, $S(t)$, de $f(t)$.

      c) Calcular los valores de $S(t)$ y $f(t)$ en los puntos $t=4\pi$ y
      $t=\dfrac{\pi}{2}$.

      d) Obtener la suma de la serie
      $\displaystyle\sum_{n=0}^{\infty}\frac{(-1)^{n+1}}{2n+1}$.
    pide: La serie, los valores del apartado c) y la suma pedida.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los coeficientes $a_{n}$ con $n\ge1$ salen todos cero. ¿Por qué?
        opciones:
          - texto: >-
              Porque $f(t)-\frac12$ es impar, y una función impar solo tiene
              senos
            correcta: true
            mensaje: |
              Eso es. Restar la media convierte la escalera en la onda cuadrada
              clásica, que vale $+\frac12$ en la primera mitad del periodo y
              $-\frac12$ en la segunda: impar de libro. La media vuelve al final
              como término constante.
          - texto: Porque $f$ es par
            mensaje: |
              No lo es. Justo a la derecha del origen $f$ vale $1$ y justo a la
              izquierda vale $0$ —por periodicidad, $f(-0{,}1)=f(2\pi-0{,}1)=0$—.
              Si fuera par, los que se anularían serían los $b_{n}$.
          - texto: Porque el periodo es $2\pi$
            mensaje: |
              El periodo fija las frecuencias, $\cos nt$ y $\sin nt$, pero no
              dice nada de qué coeficientes se anulan. Con periodo $2\pi$ hay
              funciones con todos los $a_{n}$ distintos de cero.

      - tipo: calcular
        titulo: El término constante
        pregunta: |
          ¿Cuánto vale $\dfrac{a_{0}}{2}$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              Ese es $a_{0}=\frac1\pi\int_{0}^{2\pi}f=1$. El término
              independiente de la serie es $a_{0}/2$, que es la **media** de la
              función en un periodo.
          - valor: '0.25'
            mensaje: |
              Has dividido entre dos una vez de más. La media entre $1$ durante
              medio periodo y $0$ durante el otro medio es $\frac12$.
          - valor: '0.3183099'
            mensaje: |
              Eso es $\frac1\pi$. El $\pi$ aparece en los $b_{n}$, no en el
              término constante: la media no lleva ningún $\pi$ porque el
              periodo se cancela con la longitud del intervalo.
        pista: |
          El término independiente es el valor medio de $f$ en un periodo.
        desarrollo: |
          $$
          \frac{a_{0}}{2}=\frac{1}{2\pi}\int_{0}^{2\pi}f(t)\,dt
          =\frac{1}{2\pi}\int_{0}^{\pi}1\,dt=\frac{\pi}{2\pi}=\frac12
          $$

      - tipo: calcular
        titulo: El primer armónico
        pregunta: |
          ¿Cuánto vale $b_{1}$?
        respuesta:
          tipo: numero
          valor: '0.6366198'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.3183099'
            mensaje: |
              Eso es $\frac1\pi$, la mitad. Con periodo $2\pi$ la fórmula es
              $b_{n}=\frac1\pi\int_{0}^{2\pi}f\sin(nt)\,dt$, y la integral de
              $\sin t$ entre $0$ y $\pi$ vale $2$, no $1$.
          - valor: '1.2732395'
            mensaje: |
              Eso es $\frac4\pi$, el doble. Probablemente has usado la fórmula
              del desarrollo en senos de media onda, que lleva $\frac2L$ con
              $L=\pi$; aquí la función se desarrolla en su periodo completo.
          - valor: '0'
            mensaje: |
              Los $b_{n}$ **impares** no se anulan: son los únicos que
              sobreviven. Los que valen cero son los pares, porque
              $1-\cos n\pi=0$ cuando $n$ es par.
        pista: |
          $b_{n}=\frac1\pi\int_{0}^{\pi}\sin(nt)\,dt=\frac{1-\cos
          n\pi}{n\pi}$.
        desarrollo: |
          $$
          b_{n}=\frac1\pi\int_{0}^{\pi}\sin(nt)\,dt
          =\frac{1}{\pi}\left[\frac{-\cos nt}{n}\right]_{0}^{\pi}
          =\frac{1-(-1)^{n}}{n\pi}
          $$

          $$
          b_{n}=\begin{cases}\dfrac{2}{n\pi}&n\text{ impar}\\[6pt]0&n\text{ par}\end{cases}
          \qquad
          b_{1}=\frac{2}{\pi}\approx0{,}6366
          $$

          $$
          S(t)=\frac12+\frac{2}{\pi}\sum_{k=0}^{\infty}
          \frac{\sin\bigl((2k+1)t\bigr)}{2k+1}
          $$

      - tipo: calcular
        titulo: La suma pedida
        pregunta: |
          ¿Cuánto vale $\displaystyle\sum_{n=0}^{\infty}\frac{(-1)^{n+1}}{2n+1}$?
        respuesta:
          tipo: numero
          valor: '-0.7853982'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.7853982'
            mensaje: |
              Eso es $\frac\pi4$, que es la suma con $(-1)^{n}$. El enunciado
              pone $(-1)^{n+1}$, que cambia el signo de todos los términos: el
              primero es $-1$, no $+1$.
          - valor: '-1.5707963'
            mensaje: |
              Eso es $-\frac\pi2$. Sale de usar $\frac1\pi$ en vez de
              $\frac2\pi$ delante del sumatorio: de $1=\frac12+\frac1\pi\Sigma$
              saldría $\Sigma=\frac\pi2$.
          - valor: '-0.25'
            mensaje: |
              Te has quedado antes de deshacer el factor. De
              $\frac{2}{\pi}\Sigma=\frac12$ sale $\Sigma=\frac\pi4$, no
              $\frac14$: hay que multiplicar por $\frac\pi2$.
        pista: |
          Evalúa la serie en $t=\frac\pi2$, donde $f$ es continua y los senos
          impares valen $\pm1$ alternando.
        desarrollo: |
          En $t=\frac\pi2$ se tiene
          $\sin\!\left((2k+1)\frac\pi2\right)=(-1)^{k}$, y $f$ es continua ahí,
          de modo que $S(\pi/2)=f(\pi/2)=1$:

          $$
          1=\frac12+\frac{2}{\pi}\sum_{k=0}^{\infty}\frac{(-1)^{k}}{2k+1}
          \;\Longrightarrow\;
          \sum_{k=0}^{\infty}\frac{(-1)^{k}}{2k+1}=\frac{\pi}{4}
          $$

          La serie del enunciado lleva $(-1)^{n+1}$, o sea la misma con el signo
          cambiado:

          $$
          \sum_{n=0}^{\infty}\frac{(-1)^{n+1}}{2n+1}=-\frac{\pi}{4}
          \approx-0{,}7854
          $$

      - tipo: justificar
        pregunta: Ordena el apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              El teorema de Dirichlet dice que en un punto de salto la serie
              converge a la semisuma de los límites laterales, y en un punto de
              continuidad al valor de la función.
          - texto: >-
              $4\pi$ es congruente con $0$ módulo $2\pi$, y ahí hay salto: por
              la izquierda $f$ vale $0$ y por la derecha $1$, luego
              $S(4\pi)=\frac12$.
          - texto: >-
              En cambio $f(4\pi)=f(0)=1$, porque el enunciado cierra el
              intervalo por la izquierda: la función y su serie **no** coinciden
              en ese punto.
          - texto: >-
              En $t=4\pi$ la serie converge a $f(4\pi)=1$, porque $4\pi$ es un
              múltiplo del periodo y allí la función vale $1$.
            trampa: true
            mensaje: |
              Ser múltiplo del periodo no cambia nada: la serie no sabe en qué
              vuelta estás, solo ve la función. Y en $t\equiv0$ hay un salto de
              $0$ a $1$, así que la serie converge a $\frac12$, la semisuma. De
              hecho ese es el interés del apartado: enseñar un punto donde
              $S\neq f$.
    resolucion: |
      **a) El dibujo.** Un peldaño de altura $1$ durante media vuelta y cero
      durante la otra media, repetido cada $2\pi$. El enunciado cierra el
      intervalo por los dos lados en el peldaño de arriba —$0\le t\le\pi$—, así
      que en los saltos el valor alcanzado es el $1$.

