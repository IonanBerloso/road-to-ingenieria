ejercicios:
  - id: ex2122-ord-1-imaginario-puro-y-un-lugar-geometrico
    titulo: Un parámetro que se despeja y una región que sale de dos condiciones
    fuente: >-
      Ejercicio 1 del PRIMER PARCIAL · Convocatoria ordinaria, 10 de junio de 2022 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      a) Calcular el valor de $a\in\mathbb{R}$ para que el número complejo
      $z=\dfrac{8+8i}{a-2i}$ sea imaginario puro.

      b) Sea $z_{1}=3+a\,i$, donde $a$ es el valor obtenido en el apartado
      anterior. Calcular y representar gráficamente el lugar geométrico de los
      afijos de los números complejos $z$ que verifican las siguientes
      condiciones:

      $$
      \left\{
      \begin{aligned}
      \left|z-z_{1}\right| &\le \left|\overline{z}+\overline{z_{1}}\right|\\
      \left|z-\left(\overline{z_{1}}-i\right)\right| &\ge 2
      \end{aligned}
      \right.
      $$
    pide: El valor de a, y la región del plano que cumple las dos condiciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que imponer para que $z$ sea imaginario puro?
        opciones:
          - texto: >-
              Que su parte real sea cero, y comprobar además que la imaginaria
              no lo es
            correcta: true
            mensaje: |
              Eso es, y la segunda mitad no es un adorno: si las dos partes
              fueran cero, $z$ sería el cero, que no cuenta como imaginario
              puro. Aquí sale $z=4i$, con parte imaginaria $4\neq0$, así que
              vale.
          - texto: Que su módulo sea $1$
            mensaje: |
              El módulo no dice nada de la dirección. Hay infinitos complejos de
              módulo $1$ que no son imaginarios puros —el propio $1$, sin ir más
              lejos— y hay imaginarios puros de cualquier módulo.
          - texto: Que el numerador sea imaginario puro
            mensaje: |
              No basta, y aquí ni siquiera se puede: el numerador es $8+8i$,
              fijo, y no es imaginario puro. Al dividir, el argumento cambia; lo
              que hay que mirar es el cociente ya calculado.

      - tipo: calcular
        titulo: El parámetro
        pregunta: |
          ¿Cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              Ese es el valor que anula la parte **imaginaria**, no la real. Al
              multiplicar por el conjugado, $(8+8i)(a+2i)=(8a-16)+i(16+8a)$: el
              $-16$ viene de $8i\cdot2i=16i^{2}$ y se queda en la parte real.
          - valor: '0'
            mensaje: |
              Con $a=0$ el denominador queda imaginario puro, pero el cociente
              no lo es: sale $\frac{8+8i}{-2i}=-4+4i$, con parte real $-4$.
              Dividir entre un imaginario puro **gira** noventa grados, no
              alinea con el eje.
          - valor: '16'
            mensaje: |
              Te has quedado a medias: de $8a-16=0$ sale $8a=16$ y de ahí
              $a=2$. El $16$ es el término que hay que pasar al otro lado, no la
              solución.
        pista: |
          Multiplica numerador y denominador por $a+2i$ y anula la parte real
          del resultado.
        desarrollo: |
          $$
          z=\frac{(8+8i)(a+2i)}{a^{2}+4}
          =\frac{(8a-16)+i(16+8a)}{a^{2}+4}
          $$

          $$
          8a-16=0 \;\Longrightarrow\; a=2
          $$

          Y hay que comprobar que la parte imaginaria no se anula: con $a=2$
          vale $\frac{32}{8}=4\neq0$. Así que $z=4i$ y $z_{1}=3+2i$.

      - tipo: calcular
        titulo: El centro del disco excluido
        pregunta: |
          La segunda condición habla del punto $\overline{z_{1}}-i$. ¿Cuál es su
          parte imaginaria?
        respuesta:
          tipo: numero
          valor: '-3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Has usado $z_{1}$ sin conjugar: $z_{1}-i=3+2i-i=3+i$. El enunciado
              pone la barra encima, y conjugar cambia el signo de la parte
              imaginaria **antes** de restar la $i$.
          - valor: '-1'
            mensaje: |
              Parece que has conjugado también la $i$ que se resta. La barra
              está solo sobre $z_{1}$: $\overline{z_{1}}-i=(3-2i)-i=3-3i$.
          - valor: '3'
            mensaje: |
              Ese es la parte **real**. El punto es $3-3i$: abscisa $3$,
              ordenada $-3$.
        pista: |
          $\overline{z_{1}}=3-2i$, y todavía hay que restarle $i$.
        desarrollo: |
          $$
          \overline{z_{1}}-i=(3-2i)-i=3-3i
          $$

          y $\left|z-(3-3i)\right|\ge2$ es el **exterior** del disco de centro
          $(3,-3)$ y radio $2$, con la circunferencia incluida.

      - tipo: verificar
        pregunta: |
          Escribe el lugar geométrico en $x$ e $y$, ya simplificado. La figura
          comprobará si es la misma región que la del enunciado.
        condicion: '|z-(3+2i)| <= |conj(z)+(3-2i)| & |z-(3-3i)| >= 2'
        ventana:
          x: [-5, 8]
          y: [-7, 5]
        formato: en x e y; usa & para juntar las dos condiciones y ^2 para los cuadrados
        pista: |
          Para la primera, date cuenta de que
          $\left|\overline{z}+\overline{z_{1}}\right|=\left|\overline{z+z_{1}}\right|
          =\left|z+z_{1}\right|$, y eleva al cuadrado los dos lados.
        desarrollo: |
          **La primera condición.** El conjugado no cambia el módulo, y la suma
          de conjugados es el conjugado de la suma:

          $$
          \left|\overline{z}+\overline{z_{1}}\right|
          =\left|\overline{z+z_{1}}\right|
          =\left|z+z_{1}\right|
          $$

          así que la condición es $\left|z-z_{1}\right|\le\left|z+z_{1}\right|$:
          los puntos que están al menos tan cerca de $z_{1}$ como de $-z_{1}$.
          Eso es el semiplano que limita la mediatriz del segmento
          $[-z_{1},z_{1}]$, que pasa por el origen y es perpendicular a
          $z_{1}=3+2i$. En coordenadas, elevando al cuadrado:

          $$
          (x-3)^{2}+(y-2)^{2}\le(x+3)^{2}+(y+2)^{2}
          \;\Longrightarrow\;
          3x+2y\ge0
          $$

          **La segunda.** $(x-3)^{2}+(y+3)^{2}\ge4$.

          Las dos con igualdad permitida, así que las dos fronteras pertenecen
          al lugar.

      - tipo: justificar
        pregunta: Ordena el razonamiento del apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              Como $\overline{z}+\overline{z_{1}}=\overline{z+z_{1}}$ y conjugar
              no cambia el módulo, la primera condición es
              $\left|z-z_{1}\right|\le\left|z+z_{1}\right|$.
          - texto: >-
              Escrita así, dice que $z$ está al menos tan cerca de $z_{1}$ como
              de $-z_{1}$: es el semiplano que deja la mediatriz de esos dos
              puntos, que pasa por el origen y es perpendicular a $z_{1}$.
          - texto: >-
              En coordenadas esa mediatriz es $3x+2y=0$, y el semiplano bueno es
              $3x+2y\ge0$, el que contiene a $z_{1}$.
          - texto: >-
              La segunda condición es $\left|z-(3-3i)\right|\ge2$, de modo que
              la circunferencia de centro $3-3i$ y radio $2$ **no** pertenece al
              lugar geométrico.
            trampa: true
            mensaje: |
              Sí pertenece. La desigualdad es $\ge$, no $>$: los puntos que
              están exactamente a distancia $2$ la cumplen. Lo que se quita es
              el **interior** del disco. Esta distinción vale puntos de COMP 4
              y se pierde por escribir el dibujo con línea de puntos donde va
              línea continua.
    resolucion: |
      **a) El parámetro.** Se multiplica por el conjugado del denominador y se
      anula la parte real:

      $$
      z=\frac{(8+8i)(a+2i)}{a^{2}+4}
      =\frac{(8a-16)+i(8a+16)}{a^{2}+4}
      $$

      $$
      8a-16=0\;\Longrightarrow\;a=2,
      \qquad z=\frac{32i}{8}=4i
      $$

      Conviene decir en voz alta que la parte imaginaria no se anula, porque
      «imaginario puro» excluye el cero.

      **b) La primera condición, sin cuentas.** Con $z_{1}=3+2i$:

      $$
      \left|\overline{z}+\overline{z_{1}}\right|
      =\left|\overline{z+z_{1}}\right|
      =\left|z+z_{1}\right|
      $$

      porque la suma de conjugados es el conjugado de la suma y el conjugado
      tiene el mismo módulo. La condición se convierte en

      $$
      \left|z-z_{1}\right|\le\left|z+z_{1}\right|
      $$

      que se lee sola: **estar más cerca de $z_{1}$ que de $-z_{1}$**. Eso es un
      semiplano, el que limita la mediatriz del segmento que une $-z_{1}$ con
      $z_{1}$; y como ese segmento tiene su punto medio en el origen, la
      mediatriz pasa por el origen y es perpendicular a $z_{1}$.

      Haciendo la cuenta, que es la comprobación:

      $$
      (x-3)^{2}+(y-2)^{2}\le(x+3)^{2}+(y+2)^{2}
      \;\Longrightarrow\;
      -12x-8y\le0
      \;\Longrightarrow\;
      3x+2y\ge0
      $$

      **La segunda.** $\overline{z_{1}}-i=3-3i$, así que

      $$
      \left|z-(3-3i)\right|\ge2
      \;\Longrightarrow\;
      (x-3)^{2}+(y+3)^{2}\ge4
      $$

      el exterior del disco de centro $(3,-3)$ y radio $2$, **con** su
      circunferencia.

      **El dibujo.** El centro del disco está a distancia
      $\frac{\left|3\cdot3+2\cdot(-3)\right|}{\sqrt{13}}=\frac{3}{\sqrt{13}}
      \approx0{,}83$ de la recta, menos que el radio: la recta corta al disco,
      así que el agujero se come un trozo del borde del semiplano.

