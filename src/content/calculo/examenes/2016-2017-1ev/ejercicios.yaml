ejercicios:
  - id: ex1617-1-triangulo-isosceles
    titulo: El tercer vértice de un triángulo rectángulo isósceles
    fuente: >-
      Ejercicio 1 · Primera evaluación, 10 de octubre de 2016 · Cálculo
      (Industriales), UPV/EHU · Enunciado idéntico al ejercicio 1.15 del
      boletín del tema 1. El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3

    enunciado: |
      Hallar el número complejo $z_3$ (el de mayor componente imaginaria) tal
      que los afijos de los números complejos
      $z_1 = \dfrac{\sqrt{3}}{2}-\dfrac{i}{2}$, $z_2 = i$ y $z_3$ formen un
      triángulo rectángulo isósceles; los vértices de la hipotenusa son los
      afijos de $z_1$ y $z_2$.
    pide: Hallar el tercer vértice.

    pasos:
      - tipo: reconocer
        pregunta: |
          «Rectángulo isósceles con la hipotenusa dada» son dos condiciones.
          ¿Qué obliga cada una?
        opciones:
          - texto: >-
              Isósceles pone $z_3$ en la **mediatriz**; rectángulo lo pone en la
              **circunferencia de diámetro** la hipotenusa
            correcta: true
            mensaje: |
              Exacto. Los catetos iguales significan que $z_3$ equidista de
              $z_1$ y $z_2$; el ángulo recto en $z_3$ significa, por el teorema
              del ángulo inscrito, que está en la circunferencia que tiene la
              hipotenusa como diámetro. Las dos juntas dejan **dos** puntos.
          - texto: Las dos dicen lo mismo, que los catetos son iguales
            mensaje: |
              No: un triángulo puede ser isósceles sin ser rectángulo, y
              rectángulo sin ser isósceles. Cada condición aporta una curva
              distinta, y la solución está donde se cortan.
          - texto: Que $z_3$ es el punto medio de la hipotenusa
            mensaje: |
              El punto medio está **dentro** de la hipotenusa: con él no hay
              triángulo, solo un segmento. $z_3$ está a un lado, sobre la
              perpendicular.
          - texto: Que hay infinitas soluciones
            mensaje: |
              Las dos condiciones juntas dejan exactamente **dos** puntos,
              simétricos respecto de la hipotenusa. Por eso el enunciado añade
              «el de mayor componente imaginaria»: para quedarse con uno.

      - tipo: calcular
        titulo: La hipotenusa
        pregunta: |
          ¿Cuánto mide la hipotenusa, $\left|z_2-z_1\right|$?
        respuesta:
          tipo: numero
          valor: '1.7320508'
          tolerancia: 0.005
          formato: un número, o una expresión como √3
        distractores:
          - valor: '1'
            mensaje: |
              1 es el módulo de $z_1$ y también el de $z_2$: los dos están en la
              circunferencia unidad. Pero la hipotenusa es la distancia **entre
              ellos**, no su módulo.
          - valor: '1.2247449'
            mensaje: |
              $\sqrt{3/2} \approx 1{,}2247$ es la longitud de cada **cateto**,
              no de la hipotenusa. La hipotenusa es $\sqrt2$ veces mayor.
          - valor: '3'
            mensaje: |
              3 es el cuadrado de la hipotenusa. Falta la raíz:
              $\left|h\right| = \sqrt3$.
        pista: |
          $h = z_2-z_1 = -\frac{\sqrt3}{2}+\frac32 i$. Calcula su módulo.
        desarrollo: |
          $$
          h = z_2-z_1 = i-\left(\frac{\sqrt3}{2}-\frac{i}{2}\right)
            = -\frac{\sqrt3}{2}+\frac{3}{2}i
          $$

          $$
          \left|h\right| = \sqrt{\frac34+\frac94} = \sqrt{3} \approx 1{,}732
          $$

          De paso, cada cateto mide
          $\frac{\left|h\right|}{\sqrt2} = \sqrt{\frac32} \approx 1{,}225$, por
          Pitágoras con los dos catetos iguales.
        veredicto: |
          Los dos vértices dados están en la circunferencia unidad, pero la
          hipotenusa no es un diámetro: mide $\sqrt3$, no 2.

      - tipo: calcular
        titulo: El tercer vértice
        pregunta: |
          ¿Cuál es $z_3$, el de mayor componente imaginaria? Da su parte real
          con tres decimales.
        respuesta:
          tipo: numero
          valor: '1.183'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '-0.317'
            mensaje: |
              Ese es el **otro** vértice posible,
              $\frac{\sqrt3-3}{4} \approx -0{,}317$, el que sale con el signo
              contrario del giro. Su componente imaginaria es $-0{,}183$, menor
              que la del bueno.
          - valor: '0.433'
            mensaje: |
              $\frac{\sqrt3}{4} \approx 0{,}433$ es la parte real del **punto
              medio** de la hipotenusa, no del vértice. Falta desplazarse desde
              ahí.
          - valor: '0.866'
            mensaje: |
              $\frac{\sqrt3}{2} \approx 0{,}866$ es la parte real de $z_1$, no
              la de $z_3$.
        pista: |
          $z_3 = m \pm \frac{ih}{2}$, con $m$ el punto medio. Prueba los dos
          signos y quédate con el de mayor parte imaginaria.
        desarrollo: |
          Punto medio de la hipotenusa:

          $$
          m = \frac{z_1+z_2}{2}
            = \frac{\frac{\sqrt3}{2}+\frac{i}{2}}{2}
            = \frac{\sqrt3}{4}+\frac{i}{4}
          $$

          Un vector perpendicular a $h$ y de la mitad de su longitud es
          $\frac{ih}{2}$, porque multiplicar por $i$ gira $90^{\circ}$ sin
          cambiar el módulo:

          $$
          \frac{ih}{2} = \frac{i}{2}\left(-\frac{\sqrt3}{2}+\frac32 i\right)
          = -\frac{3}{4}-\frac{\sqrt3}{4}i
          $$

          Los dos vértices posibles son $m \pm \frac{ih}{2}$:

          $$
          m+\frac{ih}{2} = \frac{\sqrt3-3}{4}+\frac{1-\sqrt3}{4}i
          \approx -0{,}317-0{,}183\,i
          $$

          $$
          m-\frac{ih}{2} = \frac{3+\sqrt3}{4}+\frac{1+\sqrt3}{4}i
          \approx 1{,}183+0{,}683\,i
          $$

          El de **mayor** componente imaginaria es el segundo, con parte real
          $\frac{3+\sqrt3}{4} \approx 1{,}183$.
        veredicto: |
          El enunciado dice «el de mayor componente imaginaria» precisamente
          porque hay dos. Sin ese dato la respuesta no sería única.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Isósceles** significa que los dos catetos miden lo mismo, así
              que $z_3$ equidista de $z_1$ y $z_2$: está en la **mediatriz** de
              la hipotenusa.
          - texto: |
              **Rectángulo en $z_3$** significa, por el teorema del ángulo
              inscrito, que $z_3$ está en la circunferencia de **diámetro** la
              hipotenusa: centro $m$ y radio $\frac{\left|h\right|}{2}$.
          - texto: |
              Las dos condiciones juntas dejan exactamente dos puntos,
              $z_3 = m \pm \frac{ih}{2}$, simétricos respecto de la hipotenusa.
          - texto: |
              Multiplicar por $i$ gira un cuarto de vuelta sin tocar el módulo,
              y por eso $\frac{ih}{2}$ es perpendicular a $h$ y mide justo el
              radio.
          - texto: |
              El enunciado desempata con «el de mayor componente imaginaria»:
              $z_3 = \frac{3+\sqrt3}{4}+\frac{1+\sqrt3}{4}i$.
          - texto: |
              Como el triángulo es isósceles, $z_3$ está a la misma distancia de
              $z_1$ y $z_2$ **que la que hay entre ellos**.
            trampa: true
            mensaje: |
              Eso describiría un triángulo **equilátero**, no un rectángulo
              isósceles. Aquí los catetos son iguales entre sí, pero **menores**
              que la hipotenusa: cada uno mide
              $\frac{\left|h\right|}{\sqrt2} \approx 1{,}22$ frente a los
              $1{,}73$ de la hipotenusa.
        veredicto: |
          Que los catetos midan $\frac{\left|h\right|}{\sqrt2}$ y no
          $\left|h\right|$ es lo que distingue el rectángulo isósceles del
          equilátero. Y es Pitágoras: $2c^{2} = h^{2}$.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** $z_1 = \frac{\sqrt3}{2}-\frac{i}{2}$ y $z_2 = i$ son los
      extremos de la hipotenusa de un triángulo rectángulo isósceles. Se pide
      el tercer vértice, el de mayor componente imaginaria.

      **Reparto de puntos del examen:** COMP1 1 · COMP2 6 · COMP4 3. Este examen
      tiene **tres ejercicios y 30 puntos**.

      > Este enunciado es el **ejercicio 1.15 del boletín** del tema 1.

      ### 1 · Qué obligan las dos condiciones

      **Isósceles.** Los dos catetos miden lo mismo, así que $z_3$ equidista de
      $z_1$ y de $z_2$: está en la **mediatriz** de la hipotenusa.

      **Rectángulo en $z_3$.** Por el teorema del ángulo inscrito, los puntos
      desde los que un segmento se ve bajo $90^{\circ}$ forman la
      circunferencia que tiene ese segmento como **diámetro**. Su centro es el
      punto medio $m$ y su radio, $\frac{\left|h\right|}{2}$ con $h = z_2-z_1$.

      Las dos condiciones juntas dejan exactamente **dos** puntos: los extremos
      del diámetro perpendicular a la hipotenusa, simétricos respecto de ella.
      Por eso el enunciado añade «el de mayor componente imaginaria».

      ### 2 · Punto medio y vector de la hipotenusa

      $$
      m = \frac{z_1+z_2}{2}
        = \frac{\frac{\sqrt3}{2}-\frac{i}{2}+i}{2}
        = \frac{\frac{\sqrt3}{2}+\frac{i}{2}}{2}
        = \frac{\sqrt3}{4}+\frac{i}{4}
      $$

      $$
      h = z_2-z_1 = -\frac{\sqrt3}{2}+\frac{3}{2}i,
      \qquad
      \left|h\right| = \sqrt{\frac34+\frac94} = \sqrt3
      $$

      ### 3 · El giro

      Un vector perpendicular a $h$ y de la mitad de su longitud es
      $\frac{ih}{2}$: multiplicar por $i$ **gira $90^{\circ}$ y no toca el
      módulo**.

      $$
      \frac{i\,h}{2} = \frac{i}{2}\left(-\frac{\sqrt3}{2}+\frac{3}{2}i\right)
      = -\frac{3}{4}-\frac{\sqrt3}{4}i
      $$

      Y los dos vértices posibles son

      $$
      z_3 = m \pm \frac{i\,h}{2}
      $$

      ### 4 · Elegir el que pide el enunciado

      Con el signo $+$:

      $$
      z_3 = \frac{\sqrt3-3}{4}+\frac{1-\sqrt3}{4}i \approx -0{,}317-0{,}183\,i
      $$

      Con el signo $-$:

      $$
      z_3 = \frac{3+\sqrt3}{4}+\frac{1+\sqrt3}{4}i \approx 1{,}183+0{,}683\,i
      $$

      El de mayor componente imaginaria es el segundo:

      $$
      \boxed{\;z_3 = \frac{3+\sqrt3}{4}+\frac{1+\sqrt3}{4}\,i\;}
      $$

      ### 5 · Representación gráfica

      $z_1$ y $z_2$ están los dos en la **circunferencia unidad** —sus módulos
      valen 1—, $z_1$ en el cuarto cuadrante a $-30^{\circ}$ y $z_2$ en el
      semieje imaginario positivo. La hipotenusa los une, y el vértice recto
      queda fuera de la circunferencia unidad, a la derecha, a distancia
      $\left|z_3\right| \approx 1{,}37$ del origen.

      ### 6 · Comprobación

      Los dos catetos tienen que medir lo mismo, y por Pitágoras cada uno vale
      $\frac{\left|h\right|}{\sqrt2}$:

      $$
      \left|z_3-z_1\right| = \left|z_3-z_2\right|
      = \frac{\sqrt3}{\sqrt2} = \sqrt{\frac32} \approx 1{,}2247
      $$

      Y Pitágoras cierra la comprobación:

      $$
      2\left(\sqrt{\tfrac32}\right)^{2} = 2\cdot\frac32 = 3 = \left|h\right|^{2}
      \quad\checkmark
      $$

      Numéricamente, con $z_3 \approx 1{,}183+0{,}683i$ y
      $z_1 \approx 0{,}866-0{,}5i$:

      $$
      \left|z_3-z_1\right| = \left|0{,}317+1{,}183i\right|
      = \sqrt{0{,}100+1{,}400} \approx 1{,}2247 \quad\checkmark
      $$

      y con $z_2 = i$:

      $$
      \left|z_3-z_2\right| = \left|1{,}183-0{,}317i\right|
      = \sqrt{1{,}400+0{,}100} \approx 1{,}2247 \quad\checkmark
      $$

  - id: ex1617-2-elipse-por-definicion
    titulo: Una elipse escrita con su definición
    fuente: >-
      Ejercicio 2 · Primera evaluación, 10 de octubre de 2016 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3

    enunciado: |
      Hallar la ecuación del lugar geométrico de los afijos de los números
      complejos $z$ cuya suma de distancias a los números $z_1 = 1+i$ y
      $z_2 = 1-i$ es igual a 4. Representar gráficamente el lugar geométrico
      obtenido.
    pide: Hallar la ecuación del lugar geométrico y representarlo.

    pasos:
      - tipo: reconocer
        pregunta: |
          «Suma de distancias a dos puntos, constante», ¿qué figura es?
        opciones:
          - texto: >-
              Una **elipse**, con esos dos puntos como focos. Es su definición
            correcta: true
            mensaje: |
              Eso es, y aquí el enunciado la da literalmente en su forma de
              definición. Los dos puntos son los focos y la constante es el eje
              mayor, $2a$.
          - texto: Una circunferencia
            mensaje: |
              La circunferencia sale cuando lo constante es la distancia a **un
              solo** punto. Con dos y una suma, sale una elipse — que se
              convierte en circunferencia solo si los dos focos coinciden.
          - texto: Una hipérbola
            mensaje: |
              La hipérbola es el lugar donde es constante la **diferencia** de
              distancias, no la suma.
          - texto: Una circunferencia de Apolonio
            mensaje: |
              Apolonio sale con el **cociente** de distancias. Suma, diferencia
              y cociente dan tres figuras distintas, y conviene tenerlas
              separadas.

      - tipo: calcular
        titulo: El semieje menor
        pregunta: |
          ¿Cuánto vale el semieje menor $b$? Da tres decimales.
        respuesta:
          tipo: numero
          valor: '1.732'
          tolerancia: 0.005
          formato: un número, o una expresión como √3
        distractores:
          - valor: '2'
            mensaje: |
              2 es el semieje **mayor**, $a$, que sale de $2a=4$. El menor es
              más corto: $b = \sqrt{a^{2}-c^{2}} = \sqrt{4-1} = \sqrt3$.
          - valor: '1'
            mensaje: |
              1 es la **semidistancia focal** $c$: los focos están en $(1,1)$ y
              $(1,-1)$, separados 2. El semieje menor sale de
              $b^{2} = a^{2}-c^{2}$.
          - valor: '3'
            mensaje: |
              3 es $b^{2}$, no $b$. Falta la raíz.
        pista: |
          $2a = 4$ y $2c = \left|z_1-z_2\right| = 2$. Luego
          $b^{2} = a^{2}-c^{2}$.
        desarrollo: |
          $$
          2a = 4 \;\Longrightarrow\; a = 2
          $$

          Los focos son $(1,1)$ y $(1,-1)$, separados

          $$
          2c = \left|z_1-z_2\right| = \left|2i\right| = 2
          \;\Longrightarrow\; c = 1
          $$

          $$
          b^{2} = a^{2}-c^{2} = 4-1 = 3
          \;\Longrightarrow\; b = \sqrt3 \approx 1{,}732
          $$

          Antes de seguir, la comprobación que hay que hacer siempre:
          $a > c$ —es decir, $2 > 1$—, así que la elipse **existe**. Si la suma
          de distancias fuera menor que la separación entre focos, no habría
          ningún punto.
        veredicto: |
          Los focos están en vertical, así que el eje mayor es el vertical y el
          $a=2$ va debajo de $y^{2}$, no de $x^{2}$.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              La condición «suma de distancias a dos puntos igual a una
              constante» es la **definición de elipse**, con $z_1$ y $z_2$ como
              focos.
          - texto: |
              $2a = 4 \Rightarrow a = 2$, y
              $2c = \left|z_1-z_2\right| = 2 \Rightarrow c = 1$. Como $a>c$, la
              elipse existe.
          - texto: |
              $b^{2} = a^{2}-c^{2} = 3$, luego $b = \sqrt3$.
          - texto: |
              El centro es el punto medio de los focos, $(1,0)$, y como los
              focos están **alineados verticalmente**, el eje mayor es el
              vertical.
          - texto: |
              La ecuación es
              $\dfrac{(x-1)^{2}}{3}+\dfrac{y^{2}}{4} = 1$.
          - texto: |
              Como $a=2$ es el semieje mayor, va debajo de $(x-1)^{2}$.
            trampa: true
            mensaje: |
              El $a^{2}$ va debajo de la variable del **eje mayor**, y aquí el
              eje mayor es el vertical porque los focos están uno encima del
              otro. Así que $a^{2}=4$ va debajo de $y^{2}$ y $b^{2}=3$ debajo de
              $(x-1)^{2}$. Ponerlo al revés da una elipse tumbada donde debería
              estar de pie.
        veredicto: |
          La colocación de los focos decide la orientación, y la orientación
          decide qué denominador es cuál. Es el error más frecuente del
          ejercicio.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** Se pide el lugar de los $z$ cuya suma de distancias a
      $z_1 = 1+i$ y $z_2 = 1-i$ vale 4.

      **Reparto de puntos del examen:** COMP1 2 · COMP2 5 · COMP4 3. Los dos
      puntos de COMP1 son por **reconocer que es una elipse**: si eso se ve, el
      resto es mecánico.

      ### 1 · La condición es la definición de elipse

      En lenguaje de complejos, la condición es

      $$
      \left|z-(1+i)\right| + \left|z-(1-i)\right| = 4
      $$

      $\left|z-w\right|$ es la distancia del afijo de $z$ al punto $w$, así que
      lo que se pide es que la **suma de las distancias a dos puntos fijos** sea
      constante. Esa es, literalmente, la definición de **elipse**, con esos
      dos puntos como **focos**.

      Conviene tener separadas las tres:

      | lo que es constante | figura |
      |---|---|
      | la suma de distancias | elipse |
      | la diferencia | hipérbola |
      | el cociente | circunferencia de Apolonio |

      ### 2 · Los parámetros

      **Semieje mayor.** La constante es $2a$:

      $$
      2a = 4 \;\Longrightarrow\; a = 2
      $$

      **Semidistancia focal.** Los focos son $(1,1)$ y $(1,-1)$:

      $$
      2c = \left|z_1-z_2\right| = \left|2i\right| = 2
      \;\Longrightarrow\; c = 1
      $$

      **Comprobación de existencia**, que hay que hacer y casi nadie hace:

      $$
      a > c \quad\text{es decir}\quad 2 > 1 \quad\checkmark
      $$

      Si la suma de distancias fuera **menor** que la separación entre focos, no
      habría ningún punto: por la desigualdad triangular, la suma de distancias
      a dos puntos nunca baja de la distancia entre ellos. Y si fueran iguales,
      el lugar sería el segmento que los une, no una elipse.

      **Semieje menor.**

      $$
      b^{2} = a^{2}-c^{2} = 4-1 = 3
      \;\Longrightarrow\; b = \sqrt3
      $$

      ### 3 · Centro y orientación

      El **centro** es el punto medio de los focos:

      $$
      c_0 = \frac{z_1+z_2}{2} = \frac{2}{2} = 1
      \quad\text{es decir}\quad (1,\,0)
      $$

      Y aquí está el paso que más se falla: los focos están **uno encima del
      otro**, alineados verticalmente sobre la recta $x=1$. Por tanto el **eje
      mayor es el vertical**, y el $a^{2}$ va debajo de $y^{2}$:

      $$
      \boxed{\;\frac{(x-1)^{2}}{3}+\frac{y^{2}}{4} = 1\;}
      $$

      Ponerlo al revés daría una elipse tumbada, con los focos en horizontal:
      otra figura.

      ### 4 · Representación gráfica

      Una elipse centrada en $(1,0)$, **de pie**: llega hasta $y=\pm2$ por
      arriba y por abajo, y hasta $x = 1\pm\sqrt3$ —es decir, aproximadamente
      $-0{,}73$ y $2{,}73$— por los lados.

      Los focos, $(1,1)$ y $(1,-1)$, quedan dentro, sobre el eje mayor y a
      distancia 1 del centro.

      ### 5 · Comprobación

      **Con el vértice del eje mayor**, $z = 1+2i$:

      $$
      \left|z-z_1\right| = \left|i\right| = 1,
      \qquad
      \left|z-z_2\right| = \left|3i\right| = 3
      $$

      $$
      1+3 = 4 \quad\checkmark
      $$

      **Con el vértice del eje menor**, $z = 1+\sqrt3$:

      $$
      \left|z-z_1\right| = \left|\sqrt3-i\right| = \sqrt{3+1} = 2
      $$

      $$
      \left|z-z_2\right| = \left|\sqrt3+i\right| = 2
      $$

      $$
      2+2 = 4 \quad\checkmark
      $$

      Este segundo caso es especialmente cómodo: en el extremo del eje menor
      las dos distancias son iguales y valen $a$, que es una propiedad general
      de la elipse y sirve de comprobación en cualquier ejercicio de este tipo.

      **Y uno que debe fallar**, el centro $z=1$:

      $$
      \left|z-z_1\right|+\left|z-z_2\right| = 1+1 = 2 \neq 4 \quad\times
      $$

      El centro no está en la elipse, como debe ser.

  - id: ex1617-3-limite-no-negativo
    titulo: El límite de una sucesión de términos no negativos
    fuente: >-
      Ejercicio 3 · Primera evaluación, 10 de octubre de 2016 · Cálculo
      (Industriales), UPV/EHU · Enunciado idéntico al ejercicio 2.3 del boletín
      del tema 2. El examen no publica solución: la demostración es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 0
      comp4: 8

    enunciado: |
      Demostrar la siguiente propiedad:

      $$
      \text{Si } a_n \ge 0 \;\;\forall n \in \mathbb{N}
      \;\text{ y }\; \{a_n\}_{n\in\mathbb{N}} \text{ converge hacia } L,
      \text{ entonces } L \ge 0
      $$
    pide: Demostrar la propiedad.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se demuestra que un número **no** puede ser negativo?
        opciones:
          - texto: >-
              Suponiendo que sí lo es y llegando a una contradicción
            correcta: true
            mensaje: |
              Eso es. Es una desigualdad no estricta, y esas se demuestran casi
              siempre por reducción al absurdo: se supone $L<0$ y se busca el
              choque con la hipótesis.
          - texto: Calculando el límite y viendo que sale positivo
            mensaje: |
              No hay ninguna sucesión concreta que calcular: el enunciado habla
              de **cualquier** sucesión con esa propiedad. Una demostración no
              puede depender de un caso.
          - texto: Comprobándolo con varios ejemplos
            mensaje: |
              Los ejemplos no demuestran una propiedad universal. Sirven para
              entenderla o para refutarla, no para probarla.
          - texto: Aplicando que el límite de una suma es la suma de límites
            mensaje: |
              Aquí no hay ninguna suma que descomponer: hay una desigualdad
              sobre los términos.

      - tipo: calcular
        titulo: El épsilon
        pregunta: |
          Si se supone $L = -0{,}5$, ¿qué $\varepsilon$ conviene tomar?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              Con $\varepsilon = \left|L\right|$ el intervalo llega justo hasta
              0 y la desigualdad $a_n<0$ deja de ser estricta: podría ser
              $a_n=0$, que el enunciado permite. Con la mitad el choque es
              limpio.
          - valor: '-0.25'
            mensaje: |
              $\varepsilon$ tiene que ser **positivo**: la definición dice «para
              todo $\varepsilon>0$». Un épsilon negativo no describe ningún
              entorno.
          - valor: '1'
            mensaje: |
              Un épsilon mayor que $\left|L\right|$ deja el 0 dentro del entorno
              y no contradice nada.
        pista: |
          La distancia de $L$ a 0 es $0{,}5$. Toma la mitad.
        desarrollo: |
          $$
          \varepsilon = \frac{\left|L\right|}{2} = \frac{0{,}5}{2} = 0{,}25
          $$

          Con ese valor, a partir de cierto $m$:

          $$
          a_n < L+\varepsilon = -0{,}5+0{,}25 = -0{,}25 < 0
          $$

          y eso contradice $a_n \ge 0$ para todo $n$.
        veredicto: |
          Este mismo épsilon aparece en cinco de los once exámenes de la
          colección. Es la herramienta más rentable del tema.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Por reducción al absurdo, supongamos que $L<0$.
          - texto: |
              Se toma $\varepsilon = \dfrac{\left|L\right|}{2} = -\dfrac{L}{2} > 0$,
              positivo precisamente porque $L$ es negativo.
          - texto: |
              Por definición de límite existe $m$ tal que
              $\left|a_n-L\right| < \varepsilon$ para todo $n>m$; en particular
              $a_n < L+\varepsilon = \dfrac{L}{2} < 0$.
          - texto: |
              Pero la hipótesis dice $a_n \ge 0$ para todo $n$. Contradicción,
              luego $L \ge 0$.
          - texto: |
              Como todos los términos son no negativos, su límite es
              estrictamente positivo.
            trampa: true
            mensaje: |
              El límite puede ser **exactamente cero**: $a_n = \frac1n$ tiene
              todos sus términos positivos y tiende a 0. Por eso el enunciado
              dice $L \ge 0$ y no $L>0$. Al pasar al límite, las desigualdades
              estrictas se debilitan.
        veredicto: |
          Esa es la moraleja del ejercicio, y la razón de que el enunciado esté
          escrito con «$\ge$» en las dos puntas.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > demostración propuesta, pendiente de revisión.

      **Datos.** $a_n \ge 0$ para todo $n$ y $a_n \to L$. Demostrar que
      $L \ge 0$.

      **Reparto de puntos del examen:** COMP1 2 · COMP4 8. **Ni un punto de
      cálculo.**

      > Este enunciado es el **ejercicio 2.3 del boletín** del tema 2, y su
      > reflejo —con $a_n \le 0$— cayó en 2017-2018 y en 2024-2025. Es de los
      > que más se repiten.

      ### 1 · Estrategia

      Se trata de descartar que $L$ sea negativo. Como la conclusión es una
      desigualdad **no estricta**, el camino natural es la reducción al
      absurdo.

      La definición, escrita, porque forma parte de lo que se puntúa:

      $$
      \lim a_n = L \iff
      \forall\varepsilon>0\;\exists\, m \in \mathbb{N} :\;
      n>m \Rightarrow \left|a_n-L\right| < \varepsilon
      $$

      ### 2 · La demostración

      Supongamos $L<0$. Entonces $-L>0$ y se puede tomar

      $$
      \varepsilon = \frac{-L}{2} = \frac{\left|L\right|}{2} > 0
      $$

      —positivo **precisamente porque** $L$ es negativo; conviene decirlo—.

      Por la definición de límite existe $m \in \mathbb{N}$ tal que para todo
      $n>m$

      $$
      \left|a_n-L\right| < \varepsilon
      \;\Longrightarrow\;
      a_n < L+\varepsilon = L-\frac{L}{2} = \frac{L}{2} < 0
      $$

      Es decir: **todos** los términos a partir de $m$ serían estrictamente
      negativos. Pero la hipótesis dice que $a_n \ge 0$ para todo $n$.
      Contradicción.

      Por tanto la suposición era falsa y

      $$
      L \ge 0 \qquad \blacksquare
      $$

      ### 3 · Por qué $\ge$ y no $>$

      La conclusión no se puede reforzar: $a_n = \frac1n$ tiene todos sus
      términos **estrictamente** positivos y su límite es exactamente 0.

      La regla general: al pasar al límite, **las desigualdades estrictas se
      debilitan**. De $a_n>0$ solo se deduce $L \ge 0$.

      ### 4 · Sobre la elección de $\varepsilon$

      Se ha tomado la mitad de la distancia de $L$ a 0. Con
      $\varepsilon = \left|L\right|$ el intervalo llegaría justo hasta 0 y la
      desigualdad $a_n<0$ dejaría de ser estricta, con lo que el choque no
      sería limpio: podría darse $a_n = 0$, que la hipótesis permite.

      Ese «tomar la mitad» aparece en **cinco de los once exámenes** de esta
      colección y en cuatro ejercicios seguidos del boletín. Conviene tenerlo
      como reflejo.

      ### 5 · Comprobación

      No sustituye a la demostración, pero detecta signos cambiados. Se
      construye una sucesión que tienda a un límite negativo y se cuenta cuántos
      términos consigue mantener no negativos:

      $$
      a_n = -0{,}5+\frac{1}{n} \;\longrightarrow\; -0{,}5
      $$

      $$
      a_1 = 0{,}5 \ge 0, \qquad a_2 = 0 \ge 0, \qquad
      a_3 = -0{,}167 < 0, \qquad a_4 = -0{,}25 < 0,\;\dots
      $$

      Solo dos. Y con el $\varepsilon = 0{,}25$ de la demostración: desde
      $\frac1n < 0{,}25$, o sea $n \ge 5$, todos son menores que $-0{,}25$.

      Por muy despacio que se construya la sucesión, los términos no negativos
      son siempre **finitos**, que es justo lo que la hipótesis —«para todo
      $n$»— prohíbe.

      ### Resultado

      $$
      \boxed{\;a_n \ge 0 \;\;\forall n \;\;\text{y}\;\; a_n \to L
      \;\;\Longrightarrow\;\; L \ge 0\;}
      $$
