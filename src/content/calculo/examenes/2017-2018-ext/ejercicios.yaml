      <figcaption>
      Arriba f y abajo h. Donde f se para —el máximo y el mínimo— h toca el cero, y
      donde f baja más deprisa —la inflexión— h tiene su máximo local. h mide cuánto
      cambia f, sin importar hacia dónde.
      </figcaption>
      </figure>

      **b) Los extremos.** Tres, y de dos clases distintas:

      - En $x_{1}$ y en $x_{3}$, donde $f'=0$: ahí $h=0$, y como $h$ es un
        cuadrado no puede bajar de cero. Son **mínimos, y además absolutos**.
      - En $x_{2}$, el punto de inflexión: ahí $f''=0$ pero $f'\neq0$, así que
        $h'$ se anula cambiando de $+$ a $-$. Es un **máximo local**, y su valor
        es $\left(f'\left(x_{2}\right)\right)^{2}$, el cuadrado de la pendiente
        más pronunciada del tramo intermedio.

      **La lectura corta.** $h$ mide **cuánto** cambia $f$, sin importar hacia
      dónde. Es cero donde $f$ se para y grande donde $f$ va deprisa, suba o baje.
      Contado así, la tabla de arriba se puede recitar mirando el dibujo: $h$ baja
      hasta el máximo de $f$, sube hasta el punto de máxima pendiente de bajada,
      vuelve a bajar hasta el mínimo y se dispara.

      **Ocho de los diez puntos son COMP 4**, y con razón: aquí no hay ni un
      número. Lo que se puntúa es nombrar los tres puntos, justificar cada signo
      con lo que se ve, y decir por qué los mínimos son absolutos.

  - id: ex1718-ext-3-la-raiz-de-cero-nueve
    titulo: La raíz de 0,9 sin calculadora, y cuánto te puedes equivocar
    fuente: >-
      Ejercicio 3 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 25 de
      junio de 2018 · Cálculo. Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea la función $f\left(x\right)=\sqrt{1+x}$.

      a) Calcular el desarrollo de McLaurin de orden 2 de $f\left(x\right)$.

      b) Utilizando el desarrollo anterior calcular el valor aproximado de
      $\sqrt{0{,}9}$.

      c) Acotar el error cometido en dicho cálculo.
    pide: El polinomio, la aproximación y una cota del error.

    pasos:
      - tipo: reconocer
        pregunta: |
          Para aproximar $\sqrt{0{,}9}$ con el desarrollo de
          $\sqrt{1+x}$ alrededor de $0$, ¿qué valor de $x$ hay que tomar?
        opciones:
          - texto: $x=-0{,}1$, porque $0{,}9=1+\left(-0{,}1\right)$
            correcta: true
            mensaje: |
              Eso es, y el signo importa: el desarrollo es en potencias de $x$,
              así que hay que escribir el número **como $1$ más algo pequeño**.
              Ese algo es negativo aquí.
          - texto: $x=0{,}9$
            mensaje: |
              Con $x=0{,}9$ se aproximaría $\sqrt{1{,}9}$. Y además $0{,}9$ no es
              pequeño: el polinomio de orden 2 ya no sirve de mucho tan lejos del
              origen.
          - texto: $x=0{,}1$, y luego se cambia el signo del resultado
            mensaje: |
              Cambiar el signo del resultado daría un número negativo, y una raíz
              cuadrada no lo es. El signo va **dentro**, en la $x$.

      - tipo: calcular
        titulo: El coeficiente de x²
        pregunta: |
          ¿Cuál es el coeficiente de $x^{2}$ en el polinomio de McLaurin?
        respuesta:
          tipo: numero
          valor: '-0.125'
          tolerancia: 0.0001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '-0.25'
            mensaje: |
              $-\frac14$ es $f''\left(0\right)$ sin dividir entre $2!$. El
              coeficiente del término de grado $n$ es
              $\frac{f^{(n)}\left(0\right)}{n!}$.
          - valor: '0.125'
            mensaje: |
              Signo. $f''\left(x\right)=-\frac{1}{4\left(1+x\right)^{3/2}}$ es
              **negativa**: la raíz cuadrada es cóncava hacia abajo, y su
              parábola de Taylor también.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es el coeficiente de $x$, que sale de
              $f'\left(0\right)$.
        pista: |
          $f''\left(x\right)=-\frac{1}{4}\left(1+x\right)^{-3/2}$, y hay que
          dividir entre $2!$.
        desarrollo: |
          $$
          f'\left(x\right)=\tfrac12\left(1+x\right)^{-1/2},
          \qquad
          f''\left(x\right)=-\tfrac14\left(1+x\right)^{-3/2}
          $$

          $$
          f\left(0\right)=1,\quad
          f'\left(0\right)=\tfrac12,\quad
          f''\left(0\right)=-\tfrac14
          \;\Longrightarrow\;
          \frac{f''\left(0\right)}{2!}=-\tfrac18
          $$

          $$
          P_{2}\left(x\right)=1+\frac{x}{2}-\frac{x^{2}}{8}
          $$

      - tipo: calcular
        titulo: La aproximación
        pregunta: |
          ¿Qué valor da el polinomio para $\sqrt{0{,}9}$?
        respuesta:
          tipo: numero
          valor: '0.94875'
          tolerancia: 0.00001
          formato: en forma exacta, o con cinco decimales
        distractores:
          - valor: '1.04875'
            mensaje: |
              Ese es $P_{2}\left(0{,}1\right)$, la aproximación de
              $\sqrt{1{,}1}$. Aquí $x$ vale $-0{,}1$, con signo menos.
          - valor: '0.9'
            mensaje: |
              $0{,}9$ es el número del que hay que sacar la raíz, no la raíz. Y
              como $0{,}9<1$, su raíz cuadrada es **mayor** que él.
        pista: |
          $P_{2}\left(-0{,}1\right)=1-0{,}05-\frac{0{,}01}{8}$.
        desarrollo: |
          $$
          P_{2}\left(-0{,}1\right)
          =1-\frac{0{,}1}{2}-\frac{\left(0{,}1\right)^{2}}{8}
          =1-0{,}05-0{,}00125=0{,}94875
          $$

          El valor exacto es $0{,}9486833\ldots$, así que el error real es de
          unas siete cienmilésimas.

          Los dos resbalones que más cuestan aquí no se pueden poner como
          respuesta alternativa porque están demasiado cerca de la buena, y
          conviene nombrarlos: quedarse en el polinomio de orden 1 da
          $0{,}95$, y **sumar** el término cuadrático en vez de restarlo da
          $0{,}95125$. Los dos se detectan igual: la raíz de un número menor
          que $1$ tiene que quedar por debajo de la aproximación lineal, porque
          la raíz es cóncava.

      - tipo: justificar
        pregunta: Ordena la acotación del error del apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              El resto de Lagrange de orden 2 es
              $R_{2}\left(x\right)=\frac{f'''\left(\xi\right)}{3!}x^{3}$ con
              $\xi$ entre $0$ y $x$.
          - texto: >-
              $f'''\left(x\right)=\frac{3}{8\left(1+x\right)^{5/2}}$, que en
              $\left[-0{,}1,\,0\right]$ es decreciente, así que su máximo está en
              $x=-0{,}1$ y vale $\frac{3}{8\cdot0{,}9^{5/2}}$.
          - texto: >-
              Con $\left|x\right|=0{,}1$ queda
              $\left|R_{2}\right|\le\frac{3}{8\cdot0{,}9^{5/2}}\cdot
              \frac{0{,}001}{6}\approx8{,}1\cdot10^{-5}$.
          - texto: >-
              Como $\xi$ es desconocido, no se puede acotar el error y hay que
              conformarse con decir que el resto es pequeño.
            trampa: true
            mensaje: |
              Que $\xi$ sea desconocido es justamente el motivo de **acotar** en
              vez de calcular: no hace falta saber dónde está, basta con saber
              entre qué dos números vive y quedarse con el peor caso. Eso es lo
              que se pide en el apartado c), y es la mitad de sus tres puntos de
              COMP 4.
    resolucion: |
      **a) El desarrollo.** Tres derivadas en el origen y ya está.

      | | fórmula | en $x=0$ |
      |---|---|---|
      | $f$ | $\left(1+x\right)^{1/2}$ | $1$ |
      | $f'$ | $\frac12\left(1+x\right)^{-1/2}$ | $\frac12$ |
      | $f''$ | $-\frac14\left(1+x\right)^{-3/2}$ | $-\frac14$ |

      $$
      \boxed{\;P_{2}\left(x\right)=1+\frac{x}{2}-\frac{x^{2}}{8}\;}
      $$

      El signo menos del término cuadrático tiene lectura: la raíz cuadrada es
      **cóncava**, crece cada vez más despacio, y la parábola que la imita tiene
      que abrir hacia abajo.

      **b) La aproximación.** Lo único que hay que decidir es el valor de $x$, y
      se decide escribiendo el número como $1$ más algo pequeño:

      $$
      0{,}9=1+\left(-0{,}1\right)
      \;\Longrightarrow\;
      x=-0{,}1
      $$

      $$
      \sqrt{0{,}9}\approx P_{2}\left(-0{,}1\right)
      =1-0{,}05-\frac{0{,}01}{8}
      =\boxed{\;0{,}94875\;}
      $$

      Tres restas de cabeza, que es exactamente el punto: en este examen no hay
      calculadora, y la cabecera lo dice por escrito.

      **c) La cota.** El resto de Lagrange de un desarrollo de orden 2 es

      $$
      R_{2}\left(x\right)=\frac{f'''\left(\xi\right)}{3!}\,x^{3},
      \qquad \xi \text{ entre } 0 \text{ y } x
      $$

      No se sabe dónde está $\xi$, y no hace falta: basta con acotar
      $\left|f'''\right|$ en todo el intervalo.

      $$
      f'''\left(x\right)=\frac{3}{8}\left(1+x\right)^{-5/2}
      $$

      es decreciente, así que en $\left[-0{,}1,\,0\right]$ su máximo está en el
      extremo izquierdo:

      $$
      \max\left|f'''\right|=\frac{3}{8\cdot\left(0{,}9\right)^{5/2}}
      \approx0{,}488
      $$

      $$
      \left|R_{2}\right|\le
      \frac{3}{8\left(0{,}9\right)^{5/2}}\cdot\frac{\left(0{,}1\right)^{3}}{6}
      =\frac{1}{16\,000\left(0{,}9\right)^{5/2}}
      \approx8{,}1\cdot10^{-5}
      $$

      $$
      \boxed{\;\left|\sqrt{0{,}9}-0{,}94875\right|<10^{-4}\;}
      $$

      **La comprobación.** El error de verdad es
      $0{,}94875-0{,}9486833=6{,}7\cdot10^{-5}$, y la cota daba
      $8{,}1\cdot10^{-5}$: la cota es correcta y además ajustada, apenas un
      $22\,\%$ por encima. Una cota que saliera **por debajo** del error real
      sería un error de cuentas, y merece la pena hacer esta comparación siempre
      que se pueda.

      **Cuántos decimales se pueden dar.** Como el error es menor que
      $10^{-4}$, de $0{,}94875$ se pueden defender las tres primeras cifras
      decimales: $\sqrt{0{,}9}=0{,}949$ con seguridad. Decir «$0{,}94875$» sin
      más es prometer cinco cifras que el método no garantiza.

  - id: ex1718-ext-4-hacia-donde-nadar-para-calentarse
    titulo: Hacia dónde nadar para calentarse
    fuente: >-
      Ejercicio 1 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 25 de
      junio de 2018 · Cálculo. Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3
    enunciado: |
      La temperatura en la superficie de un lago viene dada por la función
      $T\left(x,y\right)=y^{2}x+x^{2}\ln x$.

      a) Un bañista se encuentra en el punto $\left(1,3\right)$ y se da cuenta de
      que se está quedando frío. ¿En qué dirección debe nadar para calentarse lo
      más rápido posible?

      b) Si se dirigiese al punto $P\left(5,5\right)$, ¿qué le pasaría, se
      calentaría o se enfriaría?
    pide: La dirección de máximo crecimiento, y el signo de la variación hacia P.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué dirección crece más deprisa una función de dos variables?
        opciones:
          - texto: >-
              En la del gradiente, $\nabla T$, y la tasa de crecimiento es
              $\left|\nabla T\right|$
            correcta: true
            mensaje: |
              Eso es. La derivada direccional es
              $D_{\vec u}T=\nabla T\cdot\vec u$, y con $\vec u$ unitario eso es
              máximo cuando $\vec u$ apunta como $\nabla T$.
          - texto: En la de la curva de nivel que pasa por el punto
            mensaje: |
              A lo largo de una curva de nivel la temperatura **no cambia**: esa
              es la dirección en la que la derivada direccional vale cero.
          - texto: >-
              En la que une el punto con el máximo de la función
            mensaje: |
              Esa es la dirección en la que hay que ir *a la larga*, y ni
              siquiera: el gradiente es una respuesta **local**, la de la
              pendiente más empinada aquí y ahora.

      - tipo: calcular
        titulo: La componente x del gradiente
        pregunta: |
          ¿Cuánto vale $T_{x}\left(1,3\right)$?
        respuesta:
          tipo: numero
          valor: '10'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '9'
            mensaje: |
              Te has dejado la derivada de $x^{2}\ln x$. Vale
              $2x\ln x+x$, y en $x=1$ el logaritmo se anula pero **el $x$ no**:
              aporta $1$.
          - valor: '11'
            mensaje: |
              $2x\ln x+x$ en $x=1$ vale $0+1=1$, no $2$. El término
              $2x\ln x$ se anula porque $\ln1=0$.
          - valor: '6'
            mensaje: |
              $6$ es $T_{y}$, la otra componente.
        pista: |
          $T_{x}=y^{2}+\frac{\partial}{\partial x}\left(x^{2}\ln x\right)$, y esa
          derivada es un producto.
        desarrollo: |
          $$
          T_{x}=y^{2}+2x\ln x+x^{2}\cdot\frac1x=y^{2}+2x\ln x+x
          $$

          $$
          T_{x}\left(1,3\right)=9+2\cdot1\cdot0+1=10
          $$

      - tipo: calcular
        titulo: La rapidez con la que se calienta
        pregunta: |
          Nadando en la mejor dirección, ¿a qué ritmo sube la temperatura por
          unidad de distancia?
        respuesta:
          tipo: numero
          valor: '11.6619'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '16'
            mensaje: |
              $10+6$ suma las componentes. La tasa es el **módulo** del
              gradiente, $\sqrt{10^{2}+6^{2}}$.
          - valor: '10'
            mensaje: |
              $10$ es solo la componente $x$. Nadando en diagonal se gana más que
              nadando en horizontal.
          - valor: '60'
            mensaje: |
              $60$ es el producto de las componentes, que no significa nada
              geométricamente.
        pista: |
          $\left|\nabla T\right|=\sqrt{100+36}$.
        desarrollo: |
          $$
          \left|\nabla T\left(1,3\right)\right|=\sqrt{10^{2}+6^{2}}
          =\sqrt{136}=2\sqrt{34}\approx11{,}66
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta del apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              El vector que va de $\left(1,3\right)$ a $P\left(5,5\right)$ es
              $\left(4,2\right)$, y normalizado
              $\vec u=\frac{1}{\sqrt{20}}\left(4,2\right)$.
          - texto: >-
              La derivada direccional es
              $D_{\vec u}T=\nabla T\cdot\vec u
              =\frac{10\cdot4+6\cdot2}{\sqrt{20}}=\frac{52}{\sqrt{20}}$.
          - texto: >-
              Sale positiva, unas $11{,}6$ unidades de temperatura por unidad de
              distancia, así que **se calentaría**.
          - texto: >-
              Como $\left(4,2\right)$ no es paralelo al gradiente
              $\left(10,6\right)$, la derivada direccional es negativa y se
              enfriaría.
            trampa: true
            mensaje: |
              No ser paralelo al gradiente solo significa que **no es la mejor**
              dirección posible, no que sea mala. La derivada direccional es
              negativa cuando el ángulo con el gradiente pasa de $90°$, y aquí el
              producto escalar $40+12$ es claramente positivo: el ángulo es
              pequeño.
    resolucion: |
      **a) El gradiente.** Hay que derivar $x^{2}\ln x$ como un producto, y ahí
      está el único sitio donde se puede resbalar:

      $$
      \frac{\partial}{\partial x}\left(x^{2}\ln x\right)
      =2x\ln x+x^{2}\cdot\frac1x=2x\ln x+x
      $$

      $$
      T_{x}=y^{2}+2x\ln x+x,
      \qquad
      T_{y}=2xy
      $$

      En $\left(1,3\right)$, con $\ln 1=0$:

      $$
      \nabla T\left(1,3\right)=\left(9+0+1,\;6\right)=\left(10,\,6\right)
      $$

      **La dirección**, unitaria, es

      $$
      \boxed{\;\vec u=\frac{\left(10,6\right)}{\sqrt{136}}
      =\frac{\left(5,3\right)}{\sqrt{34}}
      \approx\left(0{,}857;\,0{,}514\right)\;}
      $$

      y nadando así la temperatura sube a razón de
      $\left|\nabla T\right|=2\sqrt{34}\approx11{,}66$ grados por unidad de
      distancia, que es lo máximo posible desde ese punto.

      **Merece la pena decir por qué es el máximo**, porque son puntos de COMP 4:
      para $\vec u$ unitario,

      $$
      D_{\vec u}T=\nabla T\cdot\vec u
      =\left|\nabla T\right|\cos\theta
      $$

      y eso es máximo cuando $\cos\theta=1$, es decir cuando $\vec u$ apunta como
      el gradiente.

      **b) Hacia $P\left(5,5\right)$.** Lo que decide es el signo de la derivada
      direccional en el punto de partida:

      $$
      \vec v=P-\left(1,3\right)=\left(4,2\right),
      \qquad
      \left|\vec v\right|=\sqrt{20}=2\sqrt5
      $$

      $$
      D_{\vec v/\left|\vec v\right|}T
      =\frac{\left(10,6\right)\cdot\left(4,2\right)}{2\sqrt5}
      =\frac{52}{2\sqrt5}=\frac{26}{\sqrt5}\approx11{,}63
      $$

      $$
      \boxed{\;\text{positiva: se calentaría}\;}
      $$

      **Y casi tan deprisa como en la mejor dirección**, $11{,}63$ frente a
      $11{,}66$. No es casualidad: $\left(4,2\right)$ y $\left(10,6\right)$
      apuntan casi al mismo sitio —el ángulo entre ellos es de unos $4°$—, así
      que el coseno vale $0{,}997$.

      **Un aviso sobre lo que se ha contestado.** La derivada direccional es una
      respuesta **en el punto de partida**: dice qué pasa en los primeros metros.
      Que el bañista siga calentándose durante todo el trayecto es otra pregunta,
      y aquí la respuesta también es que sí —a lo largo de todo el segmento la
      derivada direccional se mantiene positiva—, pero eso hay que comprobarlo
      aparte, no se deduce del cálculo anterior. Y de hecho $T\left(1,3\right)=9$
      mientras que $T\left(5,5\right)=125+25\ln5\approx165$.

  - id: ex1718-ext-5-el-paraboloide-con-tapa-de-cono
    titulo: Un paraboloide con tapa de cono, y dónde está su centro
    fuente: >-
      Ejercicio 2 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 25 de
      junio de 2018 · Cálculo. Industriales, UPV/EHU · Es el mismo sólido que el
      ejercicio 6 de la ordinaria de 2013-2014 y el 5 de la de 2021-2022, pero
      con el vértice del cono en 2 en vez de en 6, y aquí además se pide el
      centro de gravedad. El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea $S$ el sólido delimitado por las condiciones
      $x^{2}+y^{2}\le z$; $x^{2}+y^{2}\le\left(z-2\right)^{2}$; $z\le2$.

      a) Dibujar $S$ y calcular el área de su superficie.

      b) Suponiendo que la densidad en cada punto es constante, calcular las
      coordenadas del centro de gravedad de $S$.
    pide: El dibujo, el área de la superficie y el centro de gravedad.

    pasos:
      - tipo: reconocer
        pregunta: |
          Con $z\le2$, ¿qué superficie es
          $x^{2}+y^{2}=\left(z-2\right)^{2}$?
        opciones:
          - texto: >-
              Un cono con el vértice en $\left(0,0,2\right)$ que se abre hacia
              abajo, o sea $r=2-z$
            correcta: true
            mensaje: |
              Eso es. La ecuación dice $r=\left|z-2\right|$, y con $z\le2$ el
              valor absoluto se quita como $2-z$. El vértice está en la altura
              $2$ y el cono baja abriéndose.
          - texto: Un cono que se abre hacia arriba desde el origen
            mensaje: |
              Ese sería $x^{2}+y^{2}=z^{2}$. El $-2$ desplaza el vértice a la
              altura $2$, y la condición $z\le2$ se queda con la hoja de abajo.
          - texto: Una esfera de centro $\left(0,0,2\right)$
            mensaje: |
              En una esfera la $z$ también iría al cuadrado **sumando**:
              $x^{2}+y^{2}+\left(z-2\right)^{2}=R^{2}$. Aquí el cuadrado de $z-2$
              está al otro lado del igual.

      - tipo: calcular
        titulo: Dónde se cortan las dos superficies
        pregunta: |
          ¿A qué distancia del eje se tocan el paraboloide y el cono?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              $r=2$ es donde el cono corta al plano $z=0$, pero el paraboloide ya
              va por $z=4$ ahí. La condición es $r^{2}=2-r$.
          - valor: '1.4142'
            mensaje: |
              $\sqrt2$ saldría de $r^{2}=2$, olvidando el $-r$ del cono. La
              ecuación completa es $r^{2}+r-2=0$.
          - valor: '0.7321'
            mensaje: |
              $\sqrt3-1$ sale de resolver $r^{2}+2r-2=0$. El coeficiente de $r$
              es $1$, no $2$: el cono es $z=2-r$.
        pista: |
          Igualar las dos alturas: $r^{2}=2-r$.
        desarrollo: |
          $$
          r^{2}=2-r
          \;\Longrightarrow\;
          r^{2}+r-2=0
          \;\Longrightarrow\;
          \left(r+2\right)\left(r-1\right)=0
          $$

          La raíz negativa no vale como radio, así que $r=1$, y ahí las dos
          superficies están a la altura $z=1$.

      - tipo: calcular
        titulo: El área total de la superficie
        pregunta: |
          ¿Cuánto mide la superficie de $S$?
        respuesta:
          tipo: numero
          valor: '9.7733'
          tolerancia: 0.01
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '5.3304'
            mensaje: |
              $\frac{\pi\left(5\sqrt5-1\right)}{6}$ es solo la parte del
              paraboloide. La tapa cónica también es superficie de $S$.
          - valor: '4.4429'
            mensaje: |
              $\pi\sqrt2$ es solo la tapa cónica. Falta el fondo parabólico.
          - valor: '6.2832'
            mensaje: |
              $2\pi$ sería el área si las dos superficies fuesen planas, es decir
              si el factor $\sqrt{1+\left|\nabla z\right|^{2}}$ valiese $1$. Ese
              factor es lo que distingue una superficie curva de su sombra.
        pista: |
          $dS=\sqrt{1+z_{x}^{2}+z_{y}^{2}}\;dA$. Para el paraboloide el factor es
          $\sqrt{1+4r^{2}}$ y para el cono, $\sqrt2$.
        desarrollo: |
          **Paraboloide** $z=r^{2}$:

          $$
          A_{1}=\int_{0}^{2\pi}\!\!\int_{0}^{1}\sqrt{1+4r^{2}}\;r\,dr\,d\theta
          =2\pi\left[\frac{\left(1+4r^{2}\right)^{3/2}}{12}\right]_{0}^{1}
          =\frac{\pi\left(5\sqrt5-1\right)}{6}
          $$

          **Cono** $z=2-r$, con $z_{x}^{2}+z_{y}^{2}=1$:

          $$
          A_{2}=\int_{0}^{2\pi}\!\!\int_{0}^{1}\sqrt2\;r\,dr\,d\theta
          =\pi\sqrt2
          $$

          $$
          A=\frac{\pi\left(5\sqrt5-1\right)}{6}+\pi\sqrt2
          \approx5{,}3304+4{,}4429=9{,}7733
          $$

      - tipo: justificar
        pregunta: Ordena el cálculo del centro de gravedad. Una pieza es falsa.
        piezas:
          - texto: >-
              Por simetría de revolución alrededor del eje OZ,
              $\overline{x}=\overline{y}=0$.
          - texto: >-
              En cilíndricas el sólido es $0\le r\le1$, $0\le\theta\le2\pi$,
              $r^{2}\le z\le2-r$, y
              $V=2\pi\int_{0}^{1}\left(2-r-r^{2}\right)r\,dr=\frac{5\pi}{6}$.
          - texto: >-
              $\int_{S}z\,dV=\pi\int_{0}^{1}\left[\left(2-r\right)^{2}-r^{4}\right]
              r\,dr=\frac{3\pi}{4}$, así que
              $\overline{z}=\frac{3\pi/4}{5\pi/6}=\frac{9}{10}$.
          - texto: >-
              Como el sólido se toca a sí mismo en $r=1$, el centro de gravedad
              está a esa altura, $z=1$.
            trampa: true
            mensaje: |
              La altura donde se cortan las dos superficies no tiene por qué ser
              la del centro de gravedad, y aquí no lo es: sale $0{,}9$. Y tiene
              sentido que quede por debajo de $1$, porque el sólido es más ancho
              cerca de la base parabólica y se estrecha hacia el vértice del cono.
    resolucion: |
      **a) Qué sólido es.** Las tres condiciones, traducidas a cilíndricas
      $\left(r,\theta,z\right)$ con $r^{2}=x^{2}+y^{2}$:

      | condición | qué dice |
      |---|---|
      | $x^{2}+y^{2}\le z$ | por **encima** del paraboloide $z=r^{2}$ |
      | $x^{2}+y^{2}\le\left(z-2\right)^{2}$ | dentro del cono $r\le\left\|z-2\right\|$ |
      | $z\le2$ | y por debajo de la altura del vértice |

      Las dos últimas juntas dicen $r\le2-z$, o sea $z\le2-r$: **por debajo** del
      cono que baja desde $\left(0,0,2\right)$. Así que

      $$
      S=\left\{r^{2}\le z\le 2-r\right\}
      $$

      y eso solo tiene sentido mientras $r^{2}\le2-r$:

      $$
      r^{2}+r-2=\left(r+2\right)\left(r-1\right)\le0
      \;\Longrightarrow\;
      0\le r\le1
      $$

      Las dos superficies se encuentran exactamente en $r=1$, $z=1$, así que el
      sólido queda cerrado con solo dos tapas y sin pared lateral.

