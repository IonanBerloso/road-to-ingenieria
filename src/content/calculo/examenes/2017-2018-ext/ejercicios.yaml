      **b) La serie.** $f\left(-t\right)=-f\left(t\right)$: la función es
      **impar**, así que todos los $a_{n}$ —incluido $a_{0}$— se anulan sin
      integrar nada. Merece la pena decirlo con esas palabras: es medio ejercicio.

      $$
      b_{n}=\frac{1}{\pi}\int_{-\pi}^{\pi}\frac{t}{2}
      \operatorname{sen}\left(nt\right)dt
      =\frac{1}{\pi}\int_{0}^{\pi}t\operatorname{sen}\left(nt\right)dt
      $$

      —el $\frac12$ se cancela con el $2$ que aparece al doblar la integral por
      simetría—. Por partes:

      $$
      \int_{0}^{\pi}t\operatorname{sen}\left(nt\right)dt
      =\left[-\frac{t\cos nt}{n}+\frac{\operatorname{sen}nt}{n^{2}}\right]_{0}^{\pi}
      =-\frac{\pi\cos\left(n\pi\right)}{n}
      =\frac{\pi\left(-1\right)^{n+1}}{n}
      $$

      $$
      \boxed{\;S\left(t\right)=\sum_{n=1}^{\infty}
      \frac{\left(-1\right)^{n+1}}{n}\operatorname{sen}\left(nt\right)
      =\operatorname{sen}t-\frac{\operatorname{sen}2t}{2}
      +\frac{\operatorname{sen}3t}{3}-\ldots\;}
      $$

      **c) Los dos valores.** Por el teorema de Dirichlet, donde $f$ es continua
      la serie converge a $f$:

      | $t$ | $f\left(t\right)$ | $S\left(t\right)$ | por qué |
      |---|---|---|---|
      | $0$ | $0$ | $0$ | continua; y todos los senos valen $0$ |
      | $\frac{\pi}{2}$ | $\frac{\pi}{4}$ | $\frac{\pi}{4}$ | continua |

      Y de propina, el punto que el enunciado no pide y que conviene mencionar:
      en $t=\pi$ hay salto, $f\left(\pi^{-}\right)=\frac{\pi}{2}$ y
      $f\left(\pi^{+}\right)=-\frac{\pi}{2}$, así que $S\left(\pi\right)=0$, la
      semisuma. La función ni siquiera está definida ahí por el enunciado
      —el intervalo es $\left[-\pi,\pi\right)$—, y la serie sí lo está.

      **d) El espectro.** La amplitud del armónico $n$ es
      $\left|b_{n}\right|=\frac1n$:

