ejercicios:
  - id: ex1718-ext-1-el-circulo-y-la-mediatriz
    titulo: Una circunferencia y una recta, y los dos puntos que quedan
    fuente: >-
      Ejercicio 1 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 25 de
      junio de 2018 · Cálculo. Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 8
      comp4: 1
    enunciado: |
      Obtener y representar geométricamente los afijos de los números complejos
      $z$ que verifican las siguientes condiciones:

      $$
      \begin{cases}
      \left|z\right|=\left|\dfrac{1}{z}\right|\\[8pt]
      \left|z\right|=\left|1-z\right|
      \end{cases}
      $$
    pide: Los complejos que cumplen las dos a la vez, y su dibujo.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué lugar geométrico describe la segunda condición,
          $\left|z\right|=\left|1-z\right|$?
        opciones:
          - texto: >-
              La mediatriz del segmento que une $0$ con $1$: la recta vertical
              $x=\frac12$
            correcta: true
            mensaje: |
              Eso es. $\left|z-0\right|=\left|z-1\right|$ dice que $z$ equidista
              de $0$ y de $1$, y el lugar de los puntos que equidistan de dos
              puntos fijos es la mediatriz del segmento que los une.
          - texto: La circunferencia de centro $1$ y radio $\left|z\right|$
            mensaje: |
              El radio no puede depender del propio punto: eso no define un
              lugar geométrico, define una identidad que cumple todo el plano.
          - texto: >-
              El eje imaginario, porque $\left|1-z\right|$ es la distancia al
              origen
            mensaje: |
              $\left|1-z\right|$ es la distancia de $z$ al punto $1$, no al
              origen. La distancia al origen es $\left|z\right|$, que es el otro
              miembro.

      - tipo: calcular
        titulo: El módulo
        pregunta: |
          De la primera condición, ¿cuánto vale $\left|z\right|$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              $z=0$ no vale: $\frac{1}{z}$ no existe. Y aunque existiera,
              $\left|z\right|^{2}=1$ no admite el cero.
          - valor: '2'
            mensaje: |
              De $\left|z\right|=\frac{1}{\left|z\right|}$ sale
              $\left|z\right|^{2}=1$. El único módulo positivo que lo cumple es
              $1$.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es la parte **real** que impone la segunda condición, no
              el módulo. Son dos datos distintos y hay que usar los dos.
        pista: |
          $\left|\frac1z\right|=\frac{1}{\left|z\right|}$, porque el módulo de un
          cociente es el cociente de los módulos.
        desarrollo: |
          $$
          \left|z\right|=\frac{1}{\left|z\right|}
          \;\Longrightarrow\;
          \left|z\right|^{2}=1
          \;\Longrightarrow\;
          \left|z\right|=1
          $$

          (El módulo es positivo, así que la raíz negativa se descarta sola.)

      - tipo: calcular
        titulo: Una de las dos soluciones
        pregunta: |
          ¿Cuál es la solución con parte imaginaria positiva?
        respuesta:
          tipo: complejo
          valor: '0.5+0.8660254i'
          tolerancia: 0.01
          formato: forma binómica, por ejemplo 0.5+0.866i
        distractores:
          - valor: '0.5+0.5i'
            mensaje: |
              Ese punto está en la recta $x=\frac12$, pero su módulo es
              $\frac{\sqrt2}{2}\approx0{,}707$, no $1$. Hay que cumplir **las
              dos** condiciones.
          - valor: '-0.5+0.8660254i'
            mensaje: |
              Ese cumple $\left|z\right|=1$, pero está en $x=-\frac12$: es la
              mediatriz de $0$ y $-1$, que saldría de
              $\left|z\right|=\left|1+z\right|$.
          - valor: '1i'
            mensaje: |
              $i$ tiene módulo $1$, sí, pero su parte real es $0$ y hace falta
              $\frac12$. Comprueba: $\left|1-i\right|=\sqrt2\neq1$.
        pista: |
          $x=\frac12$ y $x^{2}+y^{2}=1$.
        desarrollo: |
          $$
          \left(\tfrac12\right)^{2}+y^{2}=1
          \;\Longrightarrow\;
          y^{2}=\tfrac34
          \;\Longrightarrow\;
          y=\pm\tfrac{\sqrt3}{2}
          $$

          $$
          z=\tfrac12+\tfrac{\sqrt3}{2}\,i
          \qquad\text{y}\qquad
          z=\tfrac12-\tfrac{\sqrt3}{2}\,i
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: >-
              De $\left|z\right|=\left|\frac1z\right|=\frac{1}{\left|z\right|}$
              sale $\left|z\right|^{2}=1$: la circunferencia unidad.
          - texto: >-
              De $\left|z-0\right|=\left|z-1\right|$ sale la mediatriz de $0$ y
              $1$, que es la recta $x=\frac12$.
          - texto: >-
              La recta corta a la circunferencia en dos puntos:
              $\frac12\pm\frac{\sqrt3}{2}i$, que en polar son $e^{\pm i\pi/3}$.
          - texto: >-
              Como la primera condición se cumple para todo $z\neq0$, el lugar
              geométrico es toda la recta $x=\frac12$.
            trampa: true
            mensaje: |
              La primera condición **no** se cumple para todo $z$: solo para los
              de módulo $1$. En $z=2$, por ejemplo, $\left|z\right|=2$ y
              $\left|\frac1z\right|=\frac12$. Confundir «la ecuación se simplifica»
              con «la ecuación es una identidad» es lo que convierte dos puntos en
              una recta entera.
    resolucion: |
      **La primera condición: un módulo.** El módulo de un cociente es el
      cociente de los módulos, así que

      $$
      \left|z\right|=\left|\frac{1}{z}\right|=\frac{1}{\left|z\right|}
      \;\Longrightarrow\;
      \left|z\right|^{2}=1
      \;\Longrightarrow\;
      \left|z\right|=1
      $$

      **la circunferencia unidad**, con el origen excluido de oficio porque
      $\frac1z$ no existe ahí — y de todos modos no la cumple.

      **La segunda condición: una distancia contra otra.** Escribir
      $\left|1-z\right|=\left|z-1\right|$ deja la lectura a la vista:

      $$
      \left|z-0\right|=\left|z-1\right|
      $$

      $z$ equidista de $0$ y de $1$, así que está en la **mediatriz** del
      segmento que los une: la recta vertical $x=\frac12$.

      Y con coordenadas sale lo mismo, por si hace falta escribirlo:

      $$
      x^{2}+y^{2}=\left(1-x\right)^{2}+y^{2}
      \;\Longrightarrow\;
      0=1-2x
      \;\Longrightarrow\;
      x=\tfrac12
      $$

      **El corte.** Se sustituye $x=\frac12$ en $x^{2}+y^{2}=1$:

      $$
      y^{2}=1-\tfrac14=\tfrac34
      \;\Longrightarrow\;
      y=\pm\tfrac{\sqrt3}{2}
      $$

      $$
      \boxed{\;z=\tfrac12\pm\tfrac{\sqrt3}{2}\,i
      \;=\;e^{\pm i\pi/3}\;}
      $$

      <figure class="figura-examen">
      <svg viewBox="0 0 280 260" role="img" width="280" height="260"
           aria-labelledby="cir18-t cir18-d">
        <title id="cir18-t">La circunferencia unidad cortada por la recta x igual a un medio</title>
        <desc id="cir18-d">Una circunferencia de radio uno centrada en el origen y una
        recta vertical que pasa por el medio del radio derecho. Se cortan en dos puntos
        simetricos respecto del eje horizontal, arriba y abajo. Desde el origen hasta el
        punto de arriba se marca un angulo de sesenta grados.</desc>
        <style>
          .cir18-c { stroke: var(--live); stroke-width: 2.8; fill: none; }
          .cir18-m { stroke: var(--alt); stroke-width: 2.4; fill: none; }
          .cir18-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
          .cir18-ray { stroke: var(--flag); stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; }
          .cir18-arc { stroke: var(--flag); stroke-width: 1.4; fill: none; }
          .cir18-p { fill: var(--flag); }
          .cir18-n { fill: var(--faint); font-size: 10px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
          .cir18-l { font-size: 10.5px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
        </style>
        <path class="cir18-eje" d="M8.9 128L258.5 128M122 245L122 11"/>
