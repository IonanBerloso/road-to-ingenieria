        <circle class="gra18-mk" cx="220" cy="201" r="3.4"/>
        <circle class="gra18-inf" cx="160" cy="187.5" r="3.4"/>
        <g class="gra18-n">
          <text x="60" y="232" text-anchor="middle">a</text>
          <text x="340" y="232" text-anchor="middle">b</text>
        </g>
        <text class="gra18-l" x="100" y="164" text-anchor="middle" fill="var(--live)">máx</text>
        <text class="gra18-l" x="220" y="219" text-anchor="middle" fill="var(--live)">mín</text>
        <text class="gra18-l" x="168" y="179.5" fill="var(--alt)">inflexión</text>
        <text class="gra18-l" x="310" y="132.7" text-anchor="end" fill="var(--ink)">f(x)</text>
      </svg>
      <figcaption>
      Figura redibujada del enunciado. La curva sube desde a hasta un máximo,
      baja hasta un mínimo y vuelve a subir con fuerza hasta b. No hay escala:
      lo único que se puede leer son los signos.
      </figcaption>
      </figure>
    pide: Dónde crece h y dónde tiene extremos, leyéndolo en la gráfica de f.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que mirar en la gráfica de $f$ para saber dónde crece $h$?
        opciones:
          - texto: >-
              El signo de $f'$ y el de $f''$ a la vez, porque
              $h'=2f'f''$
            correcta: true
            mensaje: |
              Exacto. Regla de la cadena:
              $h'=2f'\left(x\right)f''\left(x\right)$. En la gráfica, $f'$ se lee
              en la pendiente y $f''$ en la concavidad, así que hacen falta las
              dos lecturas.
          - texto: Solo el signo de $f$, porque $h$ es su cuadrado
            mensaje: |
              $h$ no es el cuadrado de $f$ sino el de su **derivada**. El valor
              de $f$ no interviene en ningún sitio.
          - texto: >-
              Solo dónde crece $f$: si $f$ crece, $f'>0$ y $h$ también crece
            mensaje: |
              Que $f'$ sea positiva no dice si está **aumentando**. $h$ crece
              cuando $\left|f'\right|$ aumenta, y eso lo decide la concavidad.

      - tipo: calcular
        titulo: El número de extremos de h
        pregunta: |
          ¿Cuántos extremos locales tiene $h$ dentro de $\left(a,b\right)$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              Los dos ceros de $f'$ dan dos, sí, pero falta el punto de
              inflexión: ahí $f''=0$ y $h'$ también se anula, cambiando de signo.
          - valor: '1'
            mensaje: |
              $h'=2f'f''$ se anula en tres sitios distintos: los dos máximos y
              mínimos de $f$, y su punto de inflexión.
          - valor: '0'
            mensaje: |
              $h$ es continua en un intervalo y no es monótona —baja, sube, baja
              y sube—, así que por fuerza tiene extremos interiores.
        pista: |
          $h'=2f'f''$ se anula donde se anula $f'$ **o** donde se anula $f''$.
        desarrollo: |
          En la gráfica, $f'$ se anula dos veces —en el máximo y en el mínimo— y
          $f''$ una, en el punto de inflexión que hay entre los dos. Son tres
          puntos, y en los tres $h'$ cambia de signo.

      - tipo: calcular
        titulo: El valor de h en los extremos de f
        pregunta: |
          ¿Cuánto vale $h$ en el máximo y en el mínimo de $f$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Ahí la tangente es horizontal: $f'=0$, y su cuadrado también.
          - valor: '2'
            mensaje: |
              El $2$ es el factor de la derivada, $h'=2f'f''$, no el valor de
              $h$.
        pista: |
          En un extremo de $f$ la tangente es horizontal.
        desarrollo: |
          $$
          f'\left(x\right)=0
          \;\Longrightarrow\;
          h\left(x\right)=\left(f'\left(x\right)\right)^{2}=0
          $$

          Y como $h\ge0$ siempre, esos dos ceros son **mínimos absolutos** de
          $h$, no solo locales. Eso es más de lo que el enunciado pide, y es
          gratis.

      - tipo: justificar
        pregunta: Ordena el estudio de $h$. Una pieza es falsa.
        piezas:
          - texto: >-
              $h'=2f'f''$, así que el signo de $h'$ es el producto de los signos
              de la pendiente y de la concavidad de $f$.
          - texto: >-
              Entre $a$ y el máximo, $f$ crece y es cóncava hacia abajo: $f'>0$ y
              $f''<0$, luego $h$ **decrece**. Entre el máximo y la inflexión,
              $f'<0$ y $f''<0$: $h$ **crece**.
          - texto: >-
              Entre la inflexión y el mínimo, $f'<0$ y $f''>0$: $h$ decrece. Y de
              ahí a $b$, los dos son positivos: $h$ crece.
          - texto: >-
              Como $h$ es un cuadrado, es siempre creciente, y por eso no puede
              tener máximos locales.
            trampa: true
            mensaje: |
              Un cuadrado es siempre **no negativo**, que es otra cosa muy
              distinta de creciente. $\left(f'\right)^{2}$ crece o decrece según
              se aleje o se acerque $f'$ de cero, y aquí hace las dos cosas dos
              veces. El máximo local de $h$ está justo en el punto de inflexión de
              $f$, donde la pendiente es más pronunciada dentro de ese tramo.
    resolucion: |
      **La derivada, que es todo el ejercicio.**

      $$
      h\left(x\right)=\left(f'\left(x\right)\right)^{2}
      \;\Longrightarrow\;
      h'\left(x\right)=2\,f'\left(x\right)\,f''\left(x\right)
      $$

      El $2$ no decide nada; el signo de $h'$ es el **producto** de dos signos
      que se leen directamente en el dibujo:

      | en la gráfica | qué se lee |
      |---|---|
      | la pendiente sube o baja | el signo de $f'$ |
      | la curva abre hacia arriba o hacia abajo | el signo de $f''$ |

      **Los puntos que parten el intervalo.** En la gráfica hay tres, y hay que
      nombrarlos: el máximo $x_{1}$, el punto de inflexión $x_{2}$ y el mínimo
      $x_{3}$, con $a<x_{1}<x_{2}<x_{3}<b$.

      | tramo | $f'$ | $f''$ | $h'$ | $h$ |
      |---|---|---|---|---|
      | $\left(a,x_{1}\right)$ | $+$ | $-$ | $-$ | decrece |
      | $\left(x_{1},x_{2}\right)$ | $-$ | $-$ | $+$ | crece |
      | $\left(x_{2},x_{3}\right)$ | $-$ | $+$ | $-$ | decrece |
      | $\left(x_{3},b\right)$ | $+$ | $+$ | $+$ | crece |

      <figure class="figura-examen">
      <svg viewBox="0 0 310 300" role="img" width="310" height="300"
           aria-labelledby="hac18-t hac18-d">
        <title id="hac18-t">Arriba f, abajo el cuadrado de su derivada</title>
        <desc id="hac18-d">Dos graficas alineadas verticalmente. Arriba, una curva que
        sube hasta un maximo, baja pasando por un punto de inflexion y llega a un minimo
