      La caída como $\frac1n$ es la firma de una función con **salto**: cuanto más
      brusca es la discontinuidad, más despacio se apagan los armónicos. Una
      función continua a trozos con derivada continua cae como $\frac{1}{n^{2}}$.

      **e) La suma.** Se usa el apartado c) al revés. En $t=\frac{\pi}{2}$:

      $$
      \operatorname{sen}\frac{n\pi}{2}=
      \begin{cases}
      0 & n \text{ par}\\
      \left(-1\right)^{k} & n=2k+1
      \end{cases}
      $$

      y como para $n=2k+1$ el factor $\left(-1\right)^{n+1}$ vale $1$:

      $$
      S\!\left(\frac{\pi}{2}\right)
      =\sum_{k=0}^{\infty}\frac{\left(-1\right)^{k}}{2k+1}
      =1-\frac13+\frac15-\frac17+\ldots
      $$

      Y por el apartado c) eso vale $\frac{\pi}{4}$. Es la **serie de Leibniz**,
      que aparece aquí sola.

      La serie del enunciado es la misma, pero **empezando en $n=1$**, así que le
      falta el primer término:

      $$
      \sum_{n=1}^{\infty}\frac{\left(-1\right)^{n}}{2n+1}
      =\left(\sum_{n=0}^{\infty}\frac{\left(-1\right)^{n}}{2n+1}\right)-1
      $$

      $$
      \boxed{\;\sum_{n=1}^{\infty}\frac{\left(-1\right)^{n}}{2n+1}
      =\frac{\pi}{4}-1\approx-0{,}2146\;}
      $$

      **Que salga negativa es la comprobación de bolsillo.** El primer término es
      $-\frac13$ y la serie es alternada decreciente, así que su suma está entre
      $-\frac13$ y $-\frac13+\frac15=-\frac{2}{15}$. Y $-0{,}2146$ está justo ahí
      en medio.
