      <figcaption>
      La sección del sólido por un plano que contiene al eje OZ. El fondo es el
      paraboloide z = r² y la tapa el cono z = 2 − r; se encuentran en r = 1, a la
      altura 1. Girando esta figura alrededor del eje vertical se obtiene S.
      </figcaption>
      </figure>

      **El área, superficie a superficie.** La fórmula es
      $dS=\sqrt{1+z_{x}^{2}+z_{y}^{2}}\,dA$, y ese factor es lo que distingue una
      superficie curva de su sombra sobre el plano.

      *El fondo parabólico*, $z=r^{2}$: $z_{x}=2x$, $z_{y}=2y$, así que
      $\sqrt{1+4r^{2}}$.

      $$
      A_{1}=2\pi\int_{0}^{1}r\sqrt{1+4r^{2}}\;dr
      =2\pi\left[\frac{\left(1+4r^{2}\right)^{3/2}}{12}\right]_{0}^{1}
      =\frac{\pi\left(5\sqrt5-1\right)}{6}\approx5{,}33
      $$

      *La tapa cónica*, $z=2-r$: el factor es constante. Para un cono de
      pendiente $1$, $z_{x}^{2}+z_{y}^{2}=1$ y el factor vale $\sqrt2$.

      $$
      A_{2}=2\pi\sqrt2\int_{0}^{1}r\,dr=\pi\sqrt2\approx4{,}44
      $$

      $$
      \boxed{\;A=\frac{\pi\left(5\sqrt5-1\right)}{6}+\pi\sqrt2\approx9{,}77\;}
      $$

      **La comprobación del cono, sin integrar.** El área lateral de un cono de
      radio $R$ y generatriz $g$ es $\pi R g$. Aquí $R=1$ y la generatriz, con
      altura $1$ y radio $1$, mide $\sqrt2$: $\pi\sqrt2$ ✓.

      **b) El centro de gravedad.** Densidad constante, así que es el centroide, y
      por simetría de revolución $\overline{x}=\overline{y}=0$. Queda una
      integral:

      $$
      V=\int_{0}^{2\pi}\!\!\int_{0}^{1}\!\!\int_{r^{2}}^{2-r}r\,dz\,dr\,d\theta
      =2\pi\int_{0}^{1}\left(2-r-r^{2}\right)r\,dr
      $$

      $$
      =2\pi\left[r^{2}-\frac{r^{3}}{3}-\frac{r^{4}}{4}\right]_{0}^{1}
      =2\pi\left(1-\frac13-\frac14\right)=\frac{5\pi}{6}
      $$

      El momento respecto del plano $z=0$ sale de integrar primero en $z$, que
      deja un cuadrado:

      $$
      \int_{r^{2}}^{2-r}z\,dz=\frac{\left(2-r\right)^{2}-r^{4}}{2}
      $$

      $$
      \int_{S}z\,dV=\pi\int_{0}^{1}\left[\left(2-r\right)^{2}-r^{4}\right]r\,dr
      =\pi\int_{0}^{1}\left(4r-4r^{2}+r^{3}-r^{5}\right)dr
      $$

      $$
      =\pi\left(2-\frac43+\frac14-\frac16\right)=\frac{3\pi}{4}
      $$

      $$
      \overline{z}=\frac{3\pi/4}{5\pi/6}=\frac{3}{4}\cdot\frac{6}{5}=\frac{9}{10}
      $$

      $$
      \boxed{\;G=\left(0,\,0,\,\tfrac{9}{10}\right)\;}
      $$

      **¿Es razonable?** El sólido va de $z=0$ a $z=2$, y su parte ancha está
      abajo: en $z=1$ ya tiene el radio máximo, y de ahí arriba se cierra en punta.
      Un centroide en $0{,}9$ —por debajo de la altura del encuentro, y muy por
      debajo de la mitad de $2$— es justo lo que cabe esperar.

  - id: ex1718-ext-6-el-factor-que-hace-exacta-la-edo
    titulo: El factor que convierte una EDO cualquiera en una exacta
    fuente: >-
      Ejercicio 3 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 25 de
      junio de 2018 · Cálculo. Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      a) Demostrar que $g\left(x,y\right)=\left(x+y\right)^{2}$ es un factor
      integrante de la EDO $3y\,dx+\left(x+4y\right)dy=0$.

      b) Resolver la EDO anterior utilizando el factor integrante.
    pide: La comprobación del factor y la solución general.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que comprobar para demostrar que $g$ es factor integrante?
        opciones:
          - texto: >-
              Que al multiplicar por $g$ la ecuación se vuelve exacta, es decir
              que $\frac{\partial\left(gM\right)}{\partial y}
              =\frac{\partial\left(gN\right)}{\partial x}$
            correcta: true
            mensaje: |
              Eso es, y hay que derivar **el producto entero**, no $M$ y $N$ por
              separado. Es la definición de factor integrante: lo que hace exacta
              una ecuación que no lo era.
          - texto: >-
              Que $g$ no se anula nunca
            mensaje: |
              Hace falta que no se anule para poder dividir después, sí, pero eso
              no es lo que se demuestra: lo que hay que ver es que la ecuación
              multiplicada **es exacta**.
          - texto: >-
              Que $\frac{\partial M}{\partial y}=\frac{\partial N}{\partial x}$
            mensaje: |
              Eso es que la ecuación **original** sea exacta, y aquí no lo es:
              $M_{y}=3$ y $N_{x}=1$. Si lo fuera, no haría falta ningún factor.

      - tipo: calcular
        titulo: La derivada cruzada, ya multiplicada
        pregunta: |
          Con $M=3y\left(x+y\right)^{2}$, ¿cuánto vale $M_{y}$ en el punto
          $\left(1,2\right)$?
        respuesta:
          tipo: numero
          valor: '63'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '27'
            mensaje: |
              $27$ es $3\left(x+y\right)^{2}$, el primer sumando de la regla del
              producto. Falta $3y\cdot2\left(x+y\right)$, que aporta $36$.
          - valor: '36'
            mensaje: |
              $36$ es el segundo sumando, $3y\cdot2\left(x+y\right)$. Falta el
              primero.
          - valor: '3'
            mensaje: |
              $3$ es $M_{y}$ **sin** el factor integrante. Aquí $M$ ya lleva el
              $\left(x+y\right)^{2}$ pegado.
        pista: |
          Regla del producto: $M_{y}=3\left(x+y\right)^{2}
          +3y\cdot2\left(x+y\right)$.
        desarrollo: |
          $$
          M_{y}=3\left(x+y\right)^{2}+6y\left(x+y\right)
          =3\left(x+y\right)\left(x+3y\right)
          $$

          En $\left(1,2\right)$: $3\cdot3\cdot7=63$. Y

          $$
          N_{x}=\left(x+y\right)^{2}+2\left(x+4y\right)\left(x+y\right)
          =3\left(x+y\right)\left(x+3y\right)
          $$

          da lo mismo, que es lo que había que demostrar.

      - tipo: calcular
        titulo: El potencial en un punto
        pregunta: |
          La solución es $F\left(x,y\right)=C$ con
          $F=y\left(x+y\right)^{3}$. ¿Qué constante corresponde a la curva que
          pasa por $\left(1,2\right)$?
        respuesta:
          tipo: numero
          valor: '54'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '27'
            mensaje: |
              $27$ es $\left(x+y\right)^{3}$ sin el factor $y$. La primitiva de
              $3y\left(x+y\right)^{2}$ respecto de $x$ es $y\left(x+y\right)^{3}$,
              y la $y$ va delante porque es constante al integrar en $x$.
          - valor: '18'
            mensaje: |
              $18$ es $2\cdot9=y\left(x+y\right)^{2}$, con el exponente sin subir.
              Al integrar en $x$ el exponente pasa de $2$ a $3$.
          - valor: '81'
            mensaje: |
              $81$ es $F_{y}$ en ese punto, no $F$.
        pista: |
          $F\left(1,2\right)=2\cdot3^{3}$.
        desarrollo: |
          $$
          F\left(1,2\right)=2\left(1+2\right)^{3}=2\cdot27=54
          $$

      - tipo: justificar
        pregunta: Ordena la resolución del apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              Multiplicada por $\left(x+y\right)^{2}$, la ecuación es exacta, así
              que existe $F$ con $F_{x}=3y\left(x+y\right)^{2}$ y
              $F_{y}=\left(x+4y\right)\left(x+y\right)^{2}$.
          - texto: >-
              Integrando la primera respecto de $x$:
              $F=y\left(x+y\right)^{3}+g\left(y\right)$.
          - texto: >-
              Derivando eso respecto de $y$ sale
              $\left(x+y\right)^{2}\left(x+4y\right)+g'\left(y\right)$, que ya
              coincide con $F_{y}$: luego $g'=0$ y la solución es
              $y\left(x+y\right)^{3}=C$.
          - texto: >-
              Como se ha multiplicado por $\left(x+y\right)^{2}$, hay que dividir
              la solución final entre ese factor para deshacer el cambio.
            trampa: true
            mensaje: |
              El factor integrante no se «deshace»: no es un cambio de variable,
              es una multiplicación de la ecuación por algo que no se anula, y las
              soluciones son las mismas. Lo único que hay que vigilar es la recta
              $y=-x$, donde el factor **sí** se anula y podría haber soluciones
              introducidas o perdidas.
    resolucion: |
      **a) Por qué hace falta un factor.** La ecuación de partida es
      $M_{0}\,dx+N_{0}\,dy=0$ con $M_{0}=3y$ y $N_{0}=x+4y$:

      $$
      \frac{\partial M_{0}}{\partial y}=3,
      \qquad
      \frac{\partial N_{0}}{\partial x}=1
      $$

      No coinciden: la ecuación **no es exacta**, así que no hay ninguna $F$ cuyo
      gradiente sea $\left(M_{0},N_{0}\right)$.

      **La comprobación.** Multiplicando todo por
      $g=\left(x+y\right)^{2}$:

      $$
      M=3y\left(x+y\right)^{2},
      \qquad
      N=\left(x+4y\right)\left(x+y\right)^{2}
      $$

      $$
      M_{y}=3\left(x+y\right)^{2}+3y\cdot2\left(x+y\right)
      =3\left(x+y\right)\left[\left(x+y\right)+2y\right]
      =3\left(x+y\right)\left(x+3y\right)
      $$

      $$
      N_{x}=\left(x+y\right)^{2}+\left(x+4y\right)\cdot2\left(x+y\right)
      =\left(x+y\right)\left[\left(x+y\right)+2x+8y\right]
      =3\left(x+y\right)\left(x+3y\right)
      $$

      $$
      \boxed{\;M_{y}=N_{x}\;}
      $$

      Sacar factor común $\left(x+y\right)$ en los dos casos ahorra desarrollar
      polinomios de grado tres, y deja las dos expresiones idénticas a la vista
      sin operar.

      **b) La función potencial.** Se integra $M$ respecto de $x$, tratando $y$
      como constante:

      $$
      F=\int 3y\left(x+y\right)^{2}dx
      =3y\cdot\frac{\left(x+y\right)^{3}}{3}+g\left(y\right)
      =y\left(x+y\right)^{3}+g\left(y\right)
      $$

      Y se ajusta con la otra componente:

      $$
      F_{y}=\left(x+y\right)^{3}+y\cdot3\left(x+y\right)^{2}+g'\left(y\right)
      =\left(x+y\right)^{2}\left[\left(x+y\right)+3y\right]+g'\left(y\right)
      $$

      $$
      =\left(x+y\right)^{2}\left(x+4y\right)+g'\left(y\right)
      $$

      Comparando con $N$, sale $g'\left(y\right)=0$:

      $$
      \boxed{\;y\left(x+y\right)^{3}=C\;}
      $$

      **La comprobación, derivando implícitamente.** Si $y\left(x+y\right)^{3}=C$,
      entonces $\frac{dy}{dx}=-\frac{F_{x}}{F_{y}}$, y eso tiene que coincidir con
      lo que dice la ecuación original, $-\frac{3y}{x+4y}$. En
      $\left(1,2\right)$ las dos dan $-\frac{2}{3}$.

      **La letra pequeña: la recta $y=-x$.** El factor se anula ahí, y en esa
      recta la ecuación multiplicada se vuelve $0=0$, que no dice nada. Conviene
      mirarla aparte: sobre $y=-x$ es $dy=-dx$, y la ecuación original queda
      $3y\,dx+\left(x-4x\right)\left(-dx\right)=-3x\,dx+3x\,dx=0$, que se cumple.
      Así que $y=-x$ **sí** es solución, y además está contenida en la familia
      con $C=0$. No se pierde nada, pero eso hay que verlo, no suponerlo.

  - id: ex1718-ext-7-el-sistema-cuya-respuesta-es-la-mas-simple
    titulo: Un sistema acoplado cuya respuesta es la más simple posible
    fuente: >-
      Ejercicio 4 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 25 de
      junio de 2018 · Cálculo. Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Utilizando la transformada de Laplace, resolver el sistema

      $$
      \begin{cases}
      x'\left(t\right)=x\left(t\right)+y\left(t\right)-e^{t}\\
      y'\left(t\right)=x\left(t\right)-y\left(t\right)+e^{t}\\
      x\left(0\right)=y\left(0\right)=1
      \end{cases}
      $$
    pide: Las dos funciones x(t) e y(t).

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la transformada del segundo miembro $-e^{t}$?
        opciones:
          - texto: $-\dfrac{1}{s-1}$
            correcta: true
            mensaje: |
              Eso es. $\mathcal{L}\left\{e^{at}\right\}=\frac{1}{s-a}$, y el signo
              sale fuera por linealidad. El $s-1$ del denominador es la pista de
              que la solución va a llevar $e^{t}$.
          - texto: $-\dfrac{1}{s+1}$
            mensaje: |
              $\frac{1}{s+1}$ es la transformada de $e^{-t}$. El signo del
              exponente pasa al denominador **cambiado**.
          - texto: $-e^{t}$, porque la exponencial es su propia transformada
            mensaje: |
              La que es su propia derivada es la exponencial, no su transformada.
              $\mathcal{L}\left\{e^{t}\right\}=\frac{1}{s-1}$, que es una función
              racional de $s$.

      - tipo: calcular
        titulo: El determinante del sistema
        pregunta: |
          Al transformar queda $\left(s-1\right)X-Y=\ldots$ y
          $-X+\left(s+1\right)Y=\ldots$ ¿Cuál es el determinante de la matriz de
          coeficientes, evaluado en $s=3$?
        respuesta:
          tipo: numero
          valor: '7'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '8'
            mensaje: |
              $\left(s-1\right)\left(s+1\right)=s^{2}-1$ vale $8$ en $s=3$, pero
              falta restar el producto de la diagonal secundaria,
              $\left(-1\right)\left(-1\right)=1$.
          - valor: '9'
            mensaje: |
              $9$ es $s^{2}$. El determinante es $s^{2}-2$.
          - valor: '10'
            mensaje: |
              $10$ saldría de **sumar** el $1$ en vez de restarlo. En un
              determinante de orden dos se resta el producto cruzado.
        pista: |
          $\Delta=\left(s-1\right)\left(s+1\right)-\left(-1\right)\left(-1\right)$.
        desarrollo: |
          $$
          \Delta=\begin{vmatrix}s-1 & -1\\ -1 & s+1\end{vmatrix}
          =\left(s^{2}-1\right)-1=s^{2}-2
          $$

          En $s=3$: $9-2=7$.

      - tipo: calcular
        titulo: La solución en t = 1
        pregunta: |
          ¿Cuánto valen $x\left(1\right)$ e $y\left(1\right)$? (las dos valen lo
          mismo)
        respuesta:
          tipo: numero
          valor: '2.7182818'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es el valor en $t=0$. En $t=1$ la solución ya ha crecido: es
              $e^{t}$.
          - valor: '0.3678794'
            mensaje: |
              $e^{-1}$ saldría si la solución fuese $e^{-t}$. El denominador que
              queda es $s-1$, con menos, y eso corresponde a $e^{+t}$.
          - valor: '7.3890561'
            mensaje: |
              $e^{2}$ saldría de $\frac{1}{s-2}$. Aquí el único polo que sobrevive
              está en $s=1$.
        pista: |
          $X=Y=\frac{1}{s-1}$.
        desarrollo: |
          $$
          X\left(s\right)=Y\left(s\right)=\frac{1}{s-1}
          \;\Longrightarrow\;
          x\left(t\right)=y\left(t\right)=e^{t}
          $$

          $$
          x\left(1\right)=y\left(1\right)=e\approx2{,}7183
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Transformando con $x\left(0\right)=y\left(0\right)=1$:
              $\left(s-1\right)X-Y=1-\frac{1}{s-1}=\frac{s-2}{s-1}$ y
              $-X+\left(s+1\right)Y=1+\frac{1}{s-1}=\frac{s}{s-1}$.
          - texto: >-
              El determinante es $s^{2}-2$, y por Cramer el numerador de $X$ es
              $\frac{\left(s-2\right)\left(s+1\right)+s}{s-1}
              =\frac{s^{2}-2}{s-1}$.
          - texto: >-
              El $s^{2}-2$ se cancela entero, así que $X=Y=\frac{1}{s-1}$ y
              $x\left(t\right)=y\left(t\right)=e^{t}$.
          - texto: >-
              Como el determinante $s^{2}-2$ tiene raíces $\pm\sqrt2$, la solución
              lleva términos $e^{\pm\sqrt2\,t}$.
            trampa: true
            mensaje: |
              Las raíces del determinante son polos **candidatos**, no polos
              seguros: si el numerador se anula en ellas, el factor se cancela y no
              aparece en la solución. Aquí pasa exactamente eso, en las dos
              incógnitas a la vez, y por eso la respuesta sale limpia. Dar por
              hecho que toda raíz del denominador aparece en la solución es el
              atajo que estropea este ejercicio.
    resolucion: |
      **Transformar.** Con $\mathcal{L}\left\{x'\right\}=sX-x\left(0\right)$,
      $x\left(0\right)=y\left(0\right)=1$ y
      $\mathcal{L}\left\{e^{t}\right\}=\frac{1}{s-1}$:

      $$
      \begin{cases}
      sX-1=X+Y-\frac{1}{s-1}\\
      sY-1=X-Y+\frac{1}{s-1}
      \end{cases}
      \;\Longrightarrow\;
      \begin{cases}
      \left(s-1\right)X-Y=\dfrac{s-2}{s-1}\\[6pt]
      -X+\left(s+1\right)Y=\dfrac{s}{s-1}
      \end{cases}
      $$

      donde $1-\frac{1}{s-1}=\frac{s-2}{s-1}$ y $1+\frac{1}{s-1}=\frac{s}{s-1}$.

      **Resolver el sistema.**

      $$
      \Delta=\begin{vmatrix}s-1 & -1\\ -1 & s+1\end{vmatrix}
      =s^{2}-1-1=s^{2}-2
      $$

      $$
      X=\frac{1}{\Delta}
      \begin{vmatrix}\frac{s-2}{s-1} & -1\\[4pt] \frac{s}{s-1} & s+1\end{vmatrix}
      =\frac{1}{s^{2}-2}\cdot
      \frac{\left(s-2\right)\left(s+1\right)+s}{s-1}
      $$

      Y ahora el numerador:

      $$
      \left(s-2\right)\left(s+1\right)+s=s^{2}-s-2+s=s^{2}-2
      $$

      $$
      X=\frac{1}{s^{2}-2}\cdot\frac{s^{2}-2}{s-1}=\frac{1}{s-1}
      $$

      Con $Y$ pasa lo mismo:

      $$
      Y=\frac{1}{s^{2}-2}\cdot\frac{s\left(s-1\right)+\left(s-2\right)}{s-1}
      =\frac{1}{s^{2}-2}\cdot\frac{s^{2}-2}{s-1}=\frac{1}{s-1}
      $$

      **Antitransformar.**

      $$
      \boxed{\;x\left(t\right)=y\left(t\right)=e^{t}\;}
      $$

      **La comprobación, que aquí es inmediata.**

      | qué | cuenta |
      |---|---|
      | $x\left(0\right)=y\left(0\right)$ | $e^{0}=1$ ✓ |
      | $x'=x+y-e^{t}$ | $e^{t}=e^{t}+e^{t}-e^{t}$ ✓ |
      | $y'=x-y+e^{t}$ | $e^{t}=e^{t}-e^{t}+e^{t}$ ✓ |

      **Lo que este ejercicio está midiendo.** El determinante $s^{2}-2$ invita a
      escribir $\pm\sqrt2$ y a montar una solución con $e^{\sqrt2 t}$ y
      $e^{-\sqrt2 t}$. Es falso: los polos de la solución son las raíces del
      denominador **que no cancele el numerador**, y aquí el $s^{2}-2$ se va
      entero en las dos incógnitas. El único polo que sobrevive es $s=1$.

      Visto al revés, el enunciado está construido para que la solución sea la
      más simple posible: si $x=y=e^{t}$, entonces $x+y-e^{t}=e^{t}$ y
      $x-y+e^{t}=e^{t}$, que es justo la derivada. Comprobarlo cuesta dos líneas,
      y quien lo intuya puede escribir la respuesta antes de transformar nada —
      aunque el enunciado pide hacerlo por Laplace, y por Laplace hay que
      escribirlo.

  - id: ex1718-ext-8-la-rampa-y-la-serie-de-leibniz
    titulo: La rampa, su espectro y la serie de Leibniz
    fuente: >-
      Ejercicio 5 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 25 de
      junio de 2018 · Cálculo. Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3
    enunciado: |
      Sea $f\left(t\right)$ la función periódica de periodo $2\pi$,
      $f\left(t\right)=\dfrac{t}{2}$, $-\pi\le t<\pi$.

      a) Representar gráficamente la función.

      b) Obtener la serie de Fourier, $S\left(t\right)$, de la función.

      c) Calcular los valores de $S\left(t\right)$ y $f\left(t\right)$ en los
      puntos $t=0$ y $t=\dfrac{\pi}{2}$.

      d) Dibujar el espectro discreto correspondiente a los cinco primeros
      armónicos.

      e) Calcular la suma de la serie
      $\displaystyle\sum_{n=1}^{\infty}\frac{\left(-1\right)^{n}}{2n+1}$.
    pide: El dibujo, la serie, dos valores, el espectro y la suma.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de integrar nada, ¿qué se puede decir de los coeficientes
          $a_{n}$?
        opciones:
          - texto: >-
              Que son todos cero, porque $f\left(t\right)=\frac{t}{2}$ es una
              función **impar**
            correcta: true
            mensaje: |
              Eso es, y ahorra la mitad del trabajo. $f$ impar por $\cos$ par da
              impar, y la integral de una función impar en un intervalo simétrico
              vale cero. Incluido $a_{0}$.
          - texto: >-
              Que son todos cero porque la función es continua
            mensaje: |
              La continuidad no dice nada sobre los coeficientes del coseno. Lo
              que los anula aquí es la **simetría impar**.
          - texto: >-
              Que hay que calcularlos, porque la función no tiene ninguna simetría
            mensaje: |
              Sí la tiene: $f\left(-t\right)=-\frac{t}{2}=-f\left(t\right)$ en
              todo el periodo. Es impar de libro.

      - tipo: calcular
        titulo: El primer coeficiente del seno
        pregunta: |
          ¿Cuánto vale $b_{1}$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '-1'
            mensaje: |
              Signo. $b_{n}=\frac{\left(-1\right)^{n+1}}{n}$, y en $n=1$ el
              exponente es par: sale $+1$. El menos aparece en $b_{2}$.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es el factor de la función, $f=\frac{t}{2}$, pero al
              integrar $\frac{1}{\pi}\int_{-\pi}^{\pi}\frac{t}{2}
              \operatorname{sen}t\,dt$ ese medio se cancela con el $2$ que sale de
              la simetría.
          - valor: '2'
            mensaje: |
              $2$ saldría de la serie de $f=t$ en vez de $f=\frac{t}{2}$. El
              factor $\frac12$ del enunciado divide todos los coeficientes.
        pista: |
          $b_{n}=\frac{1}{\pi}\int_{-\pi}^{\pi}\frac{t}{2}
          \operatorname{sen}\left(nt\right)dt$, y por paridad es
          $\frac{1}{\pi}\int_{0}^{\pi}t\operatorname{sen}\left(nt\right)dt$.
        desarrollo: |
          $$
          b_{n}=\frac{1}{2\pi}\int_{-\pi}^{\pi}t\operatorname{sen}\left(nt\right)dt
          =\frac{1}{\pi}\int_{0}^{\pi}t\operatorname{sen}\left(nt\right)dt
          $$

          Por partes, con $u=t$ y $dv=\operatorname{sen}\left(nt\right)dt$:

          $$
          \int_{0}^{\pi}t\operatorname{sen}\left(nt\right)dt
          =\left[-\frac{t\cos\left(nt\right)}{n}
          +\frac{\operatorname{sen}\left(nt\right)}{n^{2}}\right]_{0}^{\pi}
          =-\frac{\pi\left(-1\right)^{n}}{n}
          $$

          $$
          b_{n}=\frac{\left(-1\right)^{n+1}}{n}
          \;\Longrightarrow\;
          b_{1}=1
          $$

      - tipo: calcular
        titulo: La suma del apartado e)
        pregunta: |
          ¿Cuánto vale
          $\sum_{n=1}^{\infty}\frac{\left(-1\right)^{n}}{2n+1}$?
        respuesta:
          tipo: numero
          valor: '-0.2146018'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.7853982'
            mensaje: |
              $\frac{\pi}{4}$ es la serie de Leibniz **empezando en $n=0$**. El
              enunciado empieza en $n=1$, así que hay que quitarle el primer
              término, que vale $1$.
          - valor: '1.7853982'
            mensaje: |
              Has **sumado** el término que sobra en vez de restarlo:
              $\frac{\pi}{4}+1$.
          - valor: '-0.7853982'
            mensaje: |
              $-\frac{\pi}{4}$ sería la serie con todos los signos cambiados. Los
              signos son los del enunciado; lo que hay que corregir es el índice
              de arranque.
        pista: |
          $\frac{\pi}{4}=1-\frac13+\frac15-\frac17+\ldots$, que es la misma serie
          empezando en $n=0$.
        desarrollo: |
          Evaluando la serie de Fourier en $t=\frac{\pi}{2}$, donde $f$ es
          continua y vale $\frac{\pi}{4}$:

          $$
          \sum_{n=1}^{\infty}\frac{\left(-1\right)^{n+1}}{n}
          \operatorname{sen}\frac{n\pi}{2}
          =\sum_{k=0}^{\infty}\frac{\left(-1\right)^{k}}{2k+1}
          =\frac{\pi}{4}
          $$

          porque los términos de índice par se anulan. Y quitando el término
          $k=0$, que vale $1$:

          $$
          \sum_{n=1}^{\infty}\frac{\left(-1\right)^{n}}{2n+1}
          =\frac{\pi}{4}-1\approx-0{,}2146
          $$

      - tipo: justificar
        pregunta: Ordena el apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              El teorema de Dirichlet dice que donde $f$ es continua la serie
              converge a $f$, y donde hay un salto, a la semisuma de los límites
              laterales.
          - texto: >-
              En $t=0$ la función es continua y vale $0$, así que
              $S\left(0\right)=f\left(0\right)=0$. Y se ve directamente: todos los
              senos valen cero.
          - texto: >-
              En $t=\frac{\pi}{2}$ también es continua y vale $\frac{\pi}{4}$, así
              que $S\left(\frac{\pi}{2}\right)=\frac{\pi}{4}$.
          - texto: >-
              Como $f$ tiene un salto en $t=\pi$, la serie no converge en ningún
              punto del intervalo.
            trampa: true
            mensaje: |
              Un salto aislado no estropea la convergencia en los demás puntos.
              Dirichlet es un teorema **puntual**: en cada punto de continuidad la
              serie converge a $f$, y en el salto converge a la semisuma —aquí a
              $\frac{\pi/2+\left(-\pi/2\right)}{2}=0$—. Lo que sí se pierde cerca
              del salto es la convergencia uniforme, que es el fenómeno de Gibbs, y
              eso es otra cosa.
    resolucion: |
      **a) La función.** Es una **rampa periódica**: en cada periodo sube
      linealmente de $-\frac{\pi}{2}$ a $\frac{\pi}{2}$ y en los múltiplos impares
      de $\pi$ pega un salto de altura $\pi$ hacia abajo.

