        <circle class="cir18-p" cx="161" cy="60.5" r="4"/>
        <circle class="cir18-p" cx="161" cy="195.5" r="4"/>
        <g class="cir18-n">
          <text x="200" y="142" text-anchor="middle">1</text>
          <text x="44" y="142" text-anchor="middle">−1</text>
          <text x="258.5" y="121" text-anchor="end">x</text>
          <text x="128" y="22">y</text>
        </g>
        <text class="cir18-l" x="170.4" y="56.5" fill="var(--flag)">½ + (√3/2)i</text>
        <text class="cir18-l" x="170.4" y="207.5" fill="var(--flag)">½ − (√3/2)i</text>
        <text class="cir18-l" x="164.9" y="17.2" fill="var(--alt)">x = ½</text>
        <text class="cir18-l" x="12.8" y="53.9" fill="var(--live)">|z| = 1</text>
        <text class="cir18-l" x="161" y="117.1" fill="var(--flag)">60°</text>
      </svg>
      <figcaption>
      Las dos condiciones a la vez: la circunferencia de radio uno y la mediatriz de
      0 y 1. Se cortan en dos puntos, que en polar son e elevado a más y menos i por
      pi tercios.
      </figcaption>
      </figure>

      **Lo que se ve al pasarlos a polar.** Los dos tienen módulo $1$ y argumento
      $\pm60°$: son dos de los seis vértices del hexágono regular inscrito en la
      circunferencia unidad, y también dos de las seis raíces sextas de la
      unidad. No es casualidad: el triángulo que forman $0$, $1$ y
      $\frac12+\frac{\sqrt3}{2}i$ tiene los tres lados de longitud $1$, o sea que
      es equilátero, y por eso el ángulo en el origen es $60°$.

      **La comprobación.** Para $z=\frac12+\frac{\sqrt3}{2}i$:

      | | |
      |---|---|
      | $\left\|z\right\|$ | $\sqrt{\frac14+\frac34}=1$ ✓ |
      | $\left\|\frac1z\right\|$ | $\frac11=1$ ✓ |
      | $\left\|1-z\right\|$ | $\left\|\frac12-\frac{\sqrt3}{2}i\right\|=1$ ✓ |

  - id: ex1718-ext-2-el-cuadrado-de-la-derivada
    titulo: El cuadrado de la derivada, leído solo en el dibujo
    fuente: >-
      Ejercicio 2 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 25 de
      junio de 2018 · Cálculo. Industriales, UPV/EHU · Enunciado y figura
      idénticos al ejercicio 2 del primer parcial de la extraordinaria de
      2023-2024; la figura está redibujada del original. El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 1
      comp4: 8
    enunciado: |
      Sea $f(x)$ la función dos veces derivable en $\left(a,b\right)$ cuya
      gráfica se muestra en la figura. Consideremos la función
      $h(x)=\left(f'(x)\right)^{2}$.

      a) Estudiar el crecimiento de $h(x)$.

      b) Estudiar la existencia de extremos locales de $h(x)$.

      <figure class="figura-examen">
      <svg viewBox="0 0 400 250" role="img" width="400" height="250"
           aria-labelledby="gra18-t gra18-d">
        <title id="gra18-t">La grafica de f entre a y b</title>
        <desc id="gra18-d">Una curva definida entre a y b. Sube desde a hasta un
        maximo, baja hasta un minimo que queda por debajo del punto de partida, y a
        partir de ahi se dispara hacia arriba hasta b. Entre el maximo y el minimo hay
        un punto de inflexion.</desc>
        <style>
          .gra18-eje { stroke: var(--rule); stroke-width: 1.2; fill: none; }
          .gra18-c { stroke: var(--ink); stroke-width: 2.8; fill: none; }
          .gra18-lim { stroke: var(--graphite); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
          .gra18-mk { fill: var(--live); }
          .gra18-inf { fill: var(--alt); }
          .gra18-n { fill: var(--faint); font-size: 11px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
          .gra18-l { font-size: 11px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
        </style>
        <path class="gra18-eje" d="M30 215L375 215M60 232L60 45"/>
        <path class="gra18-lim" d="M60 185L60 215M340 66L340 215"/>
        <path class="gra18-c" d="M60 185L62 183.8L64 182.7L66 181.7L68 180.8L70 179.9L72 179.1L74 178.4L76 177.7L78 177.1L80 176.5L82 176L84 175.6L86 175.2L88 174.9L90 174.6L92 174.4L94 174.2L96 174.1L98 174L100 174L102 174L104 174.1L106 174.2L108 174.3L110 174.5L112 174.8L114 175L116 175.3L118 175.6L120 176L122 176.4L124 176.8L126 177.3L128 177.7L130 178.2L132 178.7L134 179.3L136 179.8L138 180.4L140 181L142 181.6L144 182.2L146 182.9L148 183.5L150 184.2L152 184.8L154 185.5L156 186.2L158 186.8L160 187.5L162 188.2L164 188.8L166 189.5L168 190.2L170 190.8L172 191.5L174 192.1L176 192.8L178 193.4L180 194L182 194.6L184 195.2L186 195.7L188 196.3L190 196.8L192 197.3L194 197.7L196 198.2L198 198.6L200 199L202 199.4L204 199.7L206 200L208 200.2L210 200.5L212 200.7L214 200.8L216 200.9L218 201L220 201L222 201L224 200.9L226 200.8L228 200.6L230 200.4L232 200.1L234 199.8L236 199.4L238 199L240 198.5L242 197.9L244 197.3L246 196.6L248 195.9L250 195.1L252 194.2L254 193.3L256 192.3L258 191.2L260 190L262 188.8L264 187.4L266 186.1L268 184.6L270 183L272 181.4L274 179.7L276 177.9L278 176L280 174L282 171.9L284 169.8L286 167.5L288 165.2L290 162.7L292 160.2L294 157.5L296 154.8L298 151.9L300 149L302 145.9L304 142.8L306 139.5L308 136.1L310 132.7L312 129.1L314 125.3L316 121.5L318 117.6L320 113.5L322 109.3L324 105L326 100.6L328 96L330 91.3L332 86.5L334 81.6L336 76.5L338 71.3L340 66"/>
