      Figura nuestra: el enunciado pide representarla. En negro la parabola, en
      rojo la recta paralela a y=x, y sombreado el recinto, que se apoya en el
      eje horizontal entre menos uno y uno.
      </figcaption>
      </figure>

      ### 2 · Apartado (b): el área

      **Conviene integrar en $y$.** Las dos curvas se despejan como $x$ en
      función de $y$ sin partir nada:

      | borde | expresión |
      |---|---|
      | derecha (recta) | $x = y+1$ |
      | izquierda (parábola) | $x = y^{2}-1$ |

      Integrando en $x$ habría que partir en $x=1$, porque el borde inferior
      cambia de la parábola al eje.

      $$
      A = \int_0^{2}\left[(y+1)-\left(y^{2}-1\right)\right]dy
      = \int_0^{2}\left(y+2-y^{2}\right)dy
      $$

      $$
      = \left[\frac{y^{2}}{2}+2y-\frac{y^{3}}{3}\right]_0^{2}
      = 2+4-\frac83
      $$

      $$
      \boxed{A = \frac{10}{3} \approx 3{,}3333}
      $$

      ### 3 · Apartado (c): el volumen al girar sobre OX

      El eje de giro es **horizontal** y el recinto se describe cómodamente en
      $y$: el método de las **capas cilíndricas** evita partir.

      Cada franja horizontal a altura $y$, de anchura
      $\left(y+2-y^{2}\right)$, genera al girar un cilindro de radio $y$ y
      superficie lateral $2\pi y$:

      $$
      V = 2\pi\int_0^{2}y\left(y+2-y^{2}\right)dy
      = 2\pi\int_0^{2}\left(y^{2}+2y-y^{3}\right)dy
      $$

      $$
      = 2\pi\left[\frac{y^{3}}{3}+y^{2}-\frac{y^{4}}{4}\right]_0^{2}
      = 2\pi\left[\frac83+4-4\right]
      $$

      $$
      \boxed{V = \frac{16\pi}{3} \approx 16{,}755}
      $$

      **No hay hueco central:** el recinto se apoya en el eje $OX$ a lo largo
      del segmento de $(-1,0)$ a $(1,0)$, así que el sólido es macizo.

      ### 4 · Comprobación del volumen por discos

      Por la otra vía, integrando en $x$ y partiendo en $x=1$:

      **Tramo $x \in [-1,1]$.** El recinto va de $y=0$ hasta la parábola
      $y = \sqrt{x+1}$:

      $$
      \pi\int_{-1}^{1}(x+1)\,dx
      = \pi\left[\frac{x^{2}}{2}+x\right]_{-1}^{1}
      = \pi\left[\frac32-\left(-\frac12\right)\right] = 2\pi
      $$

      **Tramo $x \in [1,3]$.** De la recta $y=x-1$ hasta la parábola:

      $$
      \pi\int_1^{3}\left[(x+1)-(x-1)^{2}\right]dx
      = \pi\int_1^{3}\left(3x-x^{2}\right)dx
      $$

      $$
      = \pi\left[\frac{3x^{2}}{2}-\frac{x^{3}}{3}\right]_1^{3}
      = \pi\left[\left(\frac{27}{2}-9\right)
      -\left(\frac32-\frac13\right)\right]
      = \pi\left[\frac92-\frac76\right] = \frac{10\pi}{3}
      $$

      $$
      V = 2\pi+\frac{10\pi}{3} = \frac{6\pi+10\pi}{3} = \frac{16\pi}{3}
      \quad\checkmark
      $$

      Coincide, y por un camino completamente distinto.

      ### 5 · Más comprobaciones

      **Del punto de corte.** $(3,2)$ en la parábola: $4-3 = 1$ ✔ En la recta:
      $2 = 3-1$ ✔

      **Del área, por acotación.** El recinto cabe en el rectángulo
      $[-1,3]\times[0,2]$, de área 8, y contiene el triángulo de vértices
      $(-1,0)$, $(1,0)$, $(3,2)$, de área $\frac{2\cdot2}{2} = 2$:

      $$
      2 < 3{,}33 < 8 \quad\checkmark
      $$

      **Del volumen, por acotación.** Está dentro del cilindro de radio 2 y
      longitud 4 —$\pi\cdot4\cdot4 = 16\pi \approx 50{,}3$— y es
      $16{,}76$: un tercio del cilindro ✔ Coherente con que la sección se
      estreche mucho hacia la izquierda.

      **Del teorema de Pappus, como tercera vía del volumen.** El centroide del
      recinto está a altura

      $$
      \overline{y} = \frac{1}{A}\int_0^{2}y\left(y+2-y^{2}\right)dy
      = \frac{1}{10/3}\cdot\frac83 = \frac{8}{10} = 0{,}8
      $$

      y Pappus da

      $$
      V = 2\pi\overline{y}\,A = 2\pi\cdot0{,}8\cdot\frac{10}{3}
      = \frac{16\pi}{3} \quad\checkmark
      $$
