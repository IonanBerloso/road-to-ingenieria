ejercicios:
  - id: ex2122-3ev-1-semirrecta-cortada
    titulo: Una semirrecta a la que un semiplano le corta el principio
    fuente: >-
      Ejercicio 1 · Tercera evaluación, 18 de enero de 2022 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3

    enunciado: |
      Calcular y representar gráficamente los afijos de los números complejos
      $z$ que verifican las siguientes condiciones:

      $$
      \begin{cases}
      \arg\left(\dfrac{1}{z-2-3i}\right) = \dfrac{\pi}{4}\\[10pt]
      \left|z\right| \le \left|\overline{z}+i\right|
      \end{cases}
      $$
    pide: Calcular la región y representarla.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué relación hay entre $\arg\left(\frac1w\right)$ y $\arg(w)$?
        opciones:
          - texto: >-
              Son **opuestos**: $\arg\left(\frac1w\right) = -\arg(w)$
            correcta: true
            mensaje: |
              Exacto. En polar, $\frac{1}{r\,\mathrm{e}^{i\theta}}
              = \frac1r\mathrm{e}^{-i\theta}$: invertir un complejo invierte el
              módulo y **cambia el signo** del argumento.
          - texto: >-
              Son iguales
            mensaje: |
              Solo lo serían si el argumento fuera 0 o $\pi$. Invertir refleja
              respecto del eje real.
          - texto: >-
              $\arg\left(\frac1w\right) = \frac{1}{\arg(w)}$
            mensaje: |
              El argumento no se invierte como un número: se **niega**. Es un
              ángulo, y en el producto los ángulos se suman.
          - texto: >-
              $\arg\left(\frac1w\right) = \pi-\arg(w)$
            mensaje: |
              Eso sería el argumento de $-\overline{w}$. La inversión da
              $-\arg(w)$.

      - tipo: calcular
        titulo: El semiplano de la segunda condición
        pregunta: |
          La segunda condición es $y \le k$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es el coeficiente del $i$ que se suma. Al elevar al cuadrado y
              simplificar queda $0 \le 1-2y$, es decir $y \le \frac12$.
          - valor: '-0.5'
            mensaje: |
              Signo cambiado. De $y^{2} \le 1-2y+y^{2}$ sale $2y \le 1$.
          - valor: '2'
            mensaje: |
              2 es el denominador que aparece al despejar, no el valor de la
              cota.
        pista: |
          $\overline z+i = x+(1-y)i$. Eleva los dos módulos al cuadrado.
        desarrollo: |
          Con $z = x+yi$:

          $$
          \overline z+i = x-yi+i = x+(1-y)i
          $$

          Elevando al cuadrado los dos módulos —los dos son no negativos, así
          que la desigualdad se conserva—:

          $$
          x^{2}+y^{2} \le x^{2}+(1-y)^{2}
          $$

          $$
          y^{2} \le 1-2y+y^{2}
          \;\Longrightarrow\;
          0 \le 1-2y
          \;\Longrightarrow\;
          y \le \frac12
          $$

          **Semiplano cerrado** por debajo de la recta $y = \frac12$.
        veredicto: |
          Los $x^{2}$ y los $y^{2}$ se cancelan: la condición es lineal. Y tiene
          lectura geométrica: los puntos que están más cerca de 0 que de $-i$,
          es decir el semiplano de la mediatriz entre $0$ y $-i$.

      - tipo: calcular
        titulo: Dónde empieza la semirrecta
        pregunta: |
          La región es una semirrecta. ¿Cuál es la abscisa de su punto inicial?
        respuesta:
          tipo: numero
          valor: '4.5'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es la abscisa del vértice $2+3i$, donde arranca la semirrecta
              **antes** de aplicar la segunda condición. El semiplano le corta
              el principio.
          - valor: '5'
            mensaje: |
              5 es donde la recta $y = 5-x$ corta al eje $OX$. La cota es
              $y \le \frac12$, no $y \le 0$.
          - valor: '3'
            mensaje: |
              3 es la ordenada del vértice, no una abscisa.
        pista: |
          La semirrecta está sobre $y = 5-x$. ¿Dónde vale $y = \frac12$?
        desarrollo: |
          De la primera condición:

          $$
          \arg\left(\frac{1}{z-2-3i}\right) = \frac{\pi}{4}
          \;\Longrightarrow\;
          \arg\left(z-2-3i\right) = -\frac{\pi}{4}
          $$

          Semirrecta que **parte** de $2+3i$ en dirección $-45°$:

          $$
          x = 2+s, \quad y = 3-s \quad (s>0)
          \;\Longrightarrow\;
          y = 5-x, \quad x>2
          $$

          Imponiendo $y \le \frac12$:

          $$
          5-x \le \frac12
          \;\Longrightarrow\;
          x \ge \frac92 = 4{,}5
          $$

          El punto inicial es $\left(\frac92,\frac12\right)$, y sí pertenece:
          la segunda condición es $\le$.
        veredicto: |
          La condición $x>2$ queda absorbida: $4{,}5 > 2$. La restricción que
          manda es la del semiplano.

      - tipo: verificar
        pregunta: |
          Escribe las dos condiciones en $x$ e $y$. La figura comprobará si el trozo
          de semirrecta que queda coincide con el del enunciado.
        condicion: 'arg(1/(z-2-3i)) = pi/4 & |z| <= |conj(z)+i|'
        ventana:
          x: [0, 10]
          y: [-5, 5]
        formato: en x e y; usa & para juntar las dos condiciones
        pista: |
          El inverso cambia el signo del argumento, así que la semirrecta sale de
          $2+3i$ con pendiente $-1$. Después, la segunda condición le corta el
          principio.
        desarrollo: |
          La primera condición equivale a $\arg(z-2-3i) = -\frac{\pi}{4}$: la
          semirrecta que sale de $2+3i$ bajando a $45^\circ$, es decir los puntos con

          $$
          x+y = 5, \qquad x > 2
          $$

          La segunda, elevando al cuadrado los dos módulos, deja $y \le \frac12$.
          Combinada con la recta, eso obliga a $x \ge \frac92$.
        veredicto: |
          El trozo de la semirrecta $x+y=5$ que empieza en $\left(\frac92,
          \frac12\right)$ y se va hacia abajo a la derecha. La segunda condición no
          cambia la recta: le **corta el principio**.
      - tipo: justificar
        pregunta: |
          Ordena la descripción del resultado. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Invertir el argumento.**
              $\arg\left(\frac1w\right) = -\arg(w)$, luego
              $\arg(z-2-3i) = -\frac{\pi}{4}$.
          - texto: |
              **Es una semirrecta**, no una recta: el argumento fija una
              dirección concreta, la de $-45°$, y el vértice $2+3i$ queda
              **excluido** porque ahí el cociente no existe.
          - texto: |
              **En cartesianas:** $y = 5-x$ con $x>2$.
          - texto: |
              **La segunda condición** es $y \le \frac12$, un semiplano cerrado.
          - texto: |
              **Intersecando:** la semirrecta cerrada que arranca en
              $\frac92+\frac12i$ y baja hacia la derecha, con el punto inicial
              incluido.
          - texto: |
              El punto $2+3i$ hay que excluirlo expresamente del resultado
              final, porque el cociente no está definido allí.
            trampa: true
            mensaje: |
              Ya no hace falta: el semiplano $y\le\frac12$ lo deja fuera por su
              cuenta —$3 > \frac12$—. La exclusión importa al describir la
              **primera** condición por separado, pero al intersecar deja de ser
              un punto especial. Arrastrarla al resultado final sugiere que el
              vértice estaba dentro, que es justo lo contrario.
        veredicto: |
          El vértice excluido y el punto inicial de la región son puntos
          **distintos**: uno está en $2+3i$ y otro en $\frac92+\frac12i$. Y el
          segundo sí pertenece, porque la desigualdad no es estricta.

    resolucion: |
      **Datos.** Un argumento fijado y una desigualdad entre módulos.

      ### 1 · La primera condición

      Invertir un complejo cambia el signo de su argumento:

      $$
      \frac{1}{r\,\mathrm{e}^{i\theta}} = \frac1r\,\mathrm{e}^{-i\theta}
      \;\Longrightarrow\;
      \arg\left(\frac1w\right) = -\arg(w)
      $$

      Por tanto:

      $$
      \arg\left(\frac{1}{z-2-3i}\right) = \frac{\pi}{4}
      \;\Longleftrightarrow\;
      \arg\left(z-2-3i\right) = -\frac{\pi}{4}
      $$

      **Qué conjunto es.** Fijar el argumento de $z-w_0$ define una
      **semirrecta** que parte de $w_0$ en esa dirección —no una recta entera:
      la dirección opuesta tendría argumento $\frac{3\pi}{4}$—.

      Aquí $w_0 = 2+3i$ y la dirección es $-45°$, es decir $(1,-1)$:

      $$
      x = 2+s,\qquad y = 3-s,\qquad s>0
      $$

      $$
      \boxed{y = 5-x, \qquad x>2}
      $$

      **El vértice $2+3i$ se excluye** por dos motivos: ahí el cociente no está
      definido, y el argumento de 0 no existe.

      ### 2 · La segunda condición

      $$
      \overline z+i = (x-yi)+i = x+(1-y)i
      $$

      Los dos módulos son no negativos, así que elevar al cuadrado conserva la
      desigualdad:

      $$
      x^{2}+y^{2} \le x^{2}+(1-y)^{2}
      $$

      $$
      y^{2} \le 1-2y+y^{2}
      \;\Longrightarrow\;
      2y \le 1
      $$

      $$
      \boxed{y \le \frac12}
      $$

      **Semiplano cerrado.** Y tiene una lectura geométrica limpia, si se ve
      que el conjugado se puede sacar entero:

      $$
      \overline z+i = \overline{z-i}
      \;\Longrightarrow\;
      \left|\overline z+i\right| = \left|z-i\right|
      $$

      Así que la condición es $\left|z-0\right| \le \left|z-i\right|$: **los
      puntos más cerca del origen que de $i$**. La frontera es la mediatriz del
      segmento que los une, es decir $y=\frac12$, y el semiplano bueno es el de
      abajo ✔ Coincide con la cuenta.

      ### 3 · Intersecar

      Sobre la semirrecta, $y = 5-x$. Imponiendo $y\le\frac12$:

      $$
      5-x \le \frac12
      \;\Longrightarrow\;
      x \ge \frac92
      $$

      Y $\frac92 > 2$, así que la condición $x>2$ ya está incluida: no aporta
      nada.

      $$
      \boxed{
      \begin{aligned}
      &\text{Semirrecta CERRADA sobre } y = 5-x,\\
      &\text{desde } \left(\tfrac92,\tfrac12\right)
      \text{ hacia la derecha y abajo}
      \end{aligned}}
      $$

      **El punto inicial sí pertenece**, porque la segunda condición es $\le$.

      <figure class="figura-examen">
      <svg viewBox="0 0 500 440" role="img" width="480" height="422"
           aria-labelledby="f2122c1t f2122c1d">
