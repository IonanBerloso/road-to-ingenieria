        </g>

        <g stroke="var(--live)" stroke-width="2" stroke-dasharray="8 6"
           fill="none">
          <path d="M30 270 L480 270"></path>
        </g>

        <g stroke="var(--rule)" stroke-width="2.2" stroke-dasharray="7 6"
           fill="none">
          <path d="M160 150 L280 270"></path>
        </g>

        <g stroke="var(--flag)" stroke-width="3.2" fill="none"
           stroke-linecap="round">
          <path d="M280 270 L430 420"></path>
        </g>

        <circle cx="160" cy="150" r="6" fill="var(--paper)"
                stroke="var(--graphite)" stroke-width="2.4"></circle>
        <circle cx="280" cy="270" r="6" fill="var(--flag)"></circle>

        <g fill="var(--graphite)" font-size="13" font-family="var(--mono)">
