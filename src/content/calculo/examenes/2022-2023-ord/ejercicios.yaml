          .esp23-eje { stroke: var(--graphite); stroke-width: 1.2; fill: none; }
          .esp23-c { stroke: var(--live); stroke-width: 2.4; fill: none; }
          .esp23-seg { stroke: var(--live); stroke-width: 2.4; fill: none; stroke-dasharray: 7 4; }
          .esp23-pt { fill: var(--alt); }
          .esp23-n { fill: var(--faint); font-size: 11px; font-family: var(--mono); }
