        <desc id="esp23-d">Una espiral que arranca en el origen, da una vuelta
        completa —sube hacia la izquierda, baja por abajo y vuelve por la derecha— y
        termina en el punto dos pi, cero. La region sombreada es la que queda entre la
        espiral y el segmento del eje horizontal que une el final con el origen.</desc>
