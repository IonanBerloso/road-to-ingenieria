ejercicios:
  - id: ex2223-ord-1-el-tercer-vertice-del-isosceles
    titulo: Un triángulo muy alto y una base muy corta
    fuente: >-
      Ejercicio 1 del PRIMER PARCIAL · Convocatoria ordinaria, 12 de junio de 2023 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      $z_{1}=1+3i$ y $z_{2}=3+4i$ son dos vértices de un triángulo isósceles.
      Calcular el tercer vértice del triángulo ($z_{3}$), sabiendo que la
      longitud de la altura ($h$) es el triple de la longitud de la base ($o$).

      <figure class="figura-examen">
      <svg viewBox="0 0 340 300" role="img" width="340" height="300"
           aria-labelledby="tri23-t tri23-d">
        <title id="tri23-t">El triangulo isosceles con sus tres vertices</title>
        <desc id="tri23-d">Un triangulo muy alargado: la base une los dos puntos
        dados, que estan cerca uno de otro y abajo a la derecha, y el tercer vertice
        esta arriba a la izquierda. Una linea de puntos une ese vertice con el punto
        medio de la base y marca la altura, que es el triple de la base.</desc>
        <style>
          .tri23-r { fill: var(--live); fill-opacity: .13; stroke: var(--live); stroke-width: 2; }
          .tri23-eje { stroke: var(--graphite); stroke-width: 1.2; fill: none; }
          .tri23-h { stroke: var(--alt); stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
          .tri23-pt { fill: var(--live); }
          .tri23-n { fill: var(--faint); font-size: 11px; font-family: var(--mono); }
          .tri23-et { fill: var(--alt); font-size: 13px; font-family: var(--mono); font-weight: 700; }
          .tri23-z { fill: var(--live); font-size: 12px; font-family: var(--mono); font-weight: 700; }
        </style>
        <path class="tri23-eje" d="M40 265L310 265M130 278.2L130 23"/>
        <path class="tri23-r" d="M160 199L220 177L100 56Z"/>
        <path class="tri23-h" d="M100 56L190 188"/>
        <circle class="tri23-pt" cx="160" cy="199" r="3.4"/>
        <circle class="tri23-pt" cx="220" cy="177" r="3.4"/>
        <circle class="tri23-pt" cx="100" cy="56" r="3.4"/>
        <g class="tri23-z">
          <text x="160" y="215" text-anchor="middle">z₁</text>
          <text x="228" y="181">z₂</text>
          <text x="94" y="50" text-anchor="end">z₃</text>
        </g>
        <g class="tri23-n">
          <text x="314" y="279">x</text>
          <text x="136" y="32">y</text>
          <text x="160" y="279" text-anchor="middle">1</text>
          <text x="124" y="159" text-anchor="end">5</text>
        </g>
        <text class="tri23-et" x="76" y="128.6">h = 3o</text>
        <text class="tri23-et" x="200.5" y="194.6">o</text>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original. El vértice que dibuja el examen
      es el de arriba a la izquierda; el simétrico respecto de la base, abajo a
      la derecha, cumple las dos condiciones igual de bien.
      </figcaption>
      </figure>
    pide: El tercer vértice, en forma binómica.

    pasos:
      - tipo: reconocer
        pregunta: |
          En un triángulo isósceles con base $z_{1}z_{2}$, ¿dónde está obligado
          a estar el tercer vértice?
        opciones:
          - texto: >-
              En la mediatriz de la base, a distancia $h$ del punto medio
            correcta: true
            mensaje: |
              Eso es. «Isósceles con base $z_{1}z_{2}$» significa que los otros
              dos lados miden igual, y el lugar de los puntos que equidistan de
              $z_{1}$ y $z_{2}$ es justo la mediatriz. La altura se mide desde
              el punto medio, que es donde la mediatriz corta a la base.
          - texto: A distancia $h$ de $z_{1}$
            mensaje: |
              La altura no se mide desde un vértice de la base, sino desde la
              base. Desde $z_{1}$ el tercer vértice está a
              $\sqrt{h^{2}+(o/2)^{2}}$, que es más.
          - texto: >-
              En cualquier punto que esté a distancia $3o$ de la recta que pasa
              por $z_{1}$ y $z_{2}$
            mensaje: |
              Eso da toda una recta paralela a la base, y solo uno de sus puntos
              hace el triángulo isósceles. Falta la condición de equidistar de
              los dos vértices.

      - tipo: calcular
        titulo: La base
        pregunta: |
          ¿Cuánto mide la base, $o=\left|z_{2}-z_{1}\right|$?
        respuesta:
          tipo: numero
          valor: '2.2360680'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '5'
            mensaje: |
              Te has quedado en $\left|2+i\right|^{2}=4+1=5$. El módulo es la
              raíz de esa suma, $\sqrt{5}$.
          - valor: '1.8377223'
            mensaje: |
              Has restado los módulos, $\left|z_{2}\right|-\left|z_{1}\right|=
              5-\sqrt{10}$. El módulo de la diferencia no es la diferencia de
              los módulos: primero se resta, y luego se toma módulo.
          - valor: '4.4721360'
            mensaje: |
              Eso es $2\sqrt{5}$. Revisa la resta: $z_{2}-z_{1}=2+i$, no
              $4+2i$.
        pista: |
          $z_{2}-z_{1}=(3-1)+(4-3)i$.
        desarrollo: |
          $$
          z_{2}-z_{1}=2+i
          \;\Longrightarrow\;
          o=\left|2+i\right|=\sqrt{4+1}=\sqrt{5}
          $$

          Y por tanto $h=3o=3\sqrt{5}$.

      - tipo: calcular
        titulo: El tercer vértice
        pregunta: |
          ¿Cuál es el vértice $z_{3}$ que dibuja la figura, el de arriba a la
          izquierda?
        respuesta:
          tipo: complejo
          valor: -1+9.5i
          tolerancia: 0.01
          formato: forma binómica, por ejemplo -1+9.5i
        distractores:
          - valor: 5-2.5i
            mensaje: |
              Es la **otra** solución, y es igual de válida como triángulo: la
              mediatriz tiene dos lados. Pero la figura del enunciado dibuja el
              vértice por encima de la base, así que el signo que toca es el
              contrario.
          - valor: 2+3.5i
            mensaje: |
              Ese es el punto medio de la base, el pie de la altura. Desde ahí
              todavía hay que avanzar $3\sqrt{5}$ en dirección perpendicular.
          - valor: 8+6.5i
            mensaje: |
              Has avanzado en la dirección **de** la base en vez de en la
              perpendicular. El vector unitario de la base es
              $\frac{2+i}{\sqrt5}$; el que necesitas es el girado un cuarto de
              vuelta, $\frac{-1+2i}{\sqrt5}$.
        pista: |
          Multiplicar por $i$ gira un cuarto de vuelta. Si el vector de la base
          es $2+i$, el perpendicular es $i(2+i)=-1+2i$.
        desarrollo: |
          El punto medio de la base es

          $$
          M=\frac{z_{1}+z_{2}}{2}=2+\tfrac{7}{2}i
          $$

          El vector unitario perpendicular a la base sale de girar
          $z_{2}-z_{1}=2+i$ un cuarto de vuelta y normalizar:

          $$
          u=\frac{i(2+i)}{\sqrt5}=\frac{-1+2i}{\sqrt5}
          $$

          Y se avanza la altura entera:

          $$
          z_{3}=M+3\sqrt{5}\,u
          =2+\tfrac{7}{2}i+3\sqrt5\cdot\frac{-1+2i}{\sqrt5}
          =2+\tfrac{7}{2}i-3+6i
          =-1+\tfrac{19}{2}i
          $$

      - tipo: justificar
        pregunta: Ordena la comprobación de que ese vértice sirve. Una pieza es falsa.
        piezas:
          - texto: >-
              El punto medio de la base es $M=2+\frac72 i$, y la mediatriz es la
              recta que pasa por $M$ con dirección $-1+2i$.
          - texto: >-
              Sobre esa recta, $z_{3}$ equidista de $z_{1}$ y de $z_{2}$, así que
              el triángulo es isósceles sea cual sea la distancia recorrida.
          - texto: >-
              Con $z_{3}=-1+\frac{19}{2}i$ sale
              $\left|z_{3}-z_{1}\right|=\left|z_{3}-z_{2}\right|=\frac{\sqrt{185}}{2}$,
              y la altura mide $3\sqrt5$, que es el triple de $\sqrt5$.
          - texto: >-
              Como la altura vale $3\sqrt5$ y la base $\sqrt5$, los dos lados
              iguales miden también $3\sqrt5$.
            trampa: true
            mensaje: |
              Eso confundiría la altura con el lado. El lado es la hipotenusa
              del triángulo rectángulo que forman la altura y media base:
              $\sqrt{(3\sqrt5)^{2}+\left(\frac{\sqrt5}{2}\right)^{2}}=
              \sqrt{45+\frac54}=\frac{\sqrt{185}}{2}\approx 6{,}80$, algo más
              que $3\sqrt5\approx 6{,}71$.
    resolucion: |
      **De qué va.** Hay dos condiciones y solo parecen una: «isósceles» fija a
      $z_{3}$ en la mediatriz de la base, y «la altura es el triple de la base»
      fija cuánto hay que avanzar por ella. Nada más. Todo el ejercicio es
      montar ese avance con números complejos en vez de con vectores.

      **La base.** $z_{2}-z_{1}=2+i$, de modo que $o=\sqrt5$ y $h=3\sqrt5$.

      **La dirección.** Girar un cuarto de vuelta es multiplicar por $i$, y esa
      es la ventaja de trabajar en complejos: $i(2+i)=-1+2i$, que tiene el mismo
      módulo $\sqrt5$. Normalizado, $u=\frac{-1+2i}{\sqrt5}$.

      **El vértice.** Desde el punto medio $M=2+\frac72 i$,

      $$
      z_{3}=M\pm 3\sqrt5\,u
      \;\Longrightarrow\;
      z_{3}=-1+\tfrac{19}{2}i
      \quad\text{o}\quad
      z_{3}=5-\tfrac52 i
      $$

      **Las dos valen.** El enunciado no da nada que distinga una de otra: son
      simétricas respecto de la base y las dos hacen un triángulo isósceles con
      la altura pedida. Lo único que rompe el empate es la figura, que dibuja el
      vértice por encima de la base. En el examen conviene dar las dos y decir
      cuál corresponde al dibujo; dar solo una sin mencionar la otra deja fuera
      media respuesta.

  - id: ex2223-ord-2-el-cohete-y-el-angulo-de-la-camara
    titulo: La cámara que gira para seguir al cohete
    fuente: >-
      Ejercicio 2 del PRIMER PARCIAL · Convocatoria ordinaria, 12 de junio de 2023 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3
    enunciado: |
      Se lanza un cohete que asciende verticalmente a una velocidad no
      constante. Se coloca una cámara a 5000 m de la plataforma de lanzamiento
      que gira con una velocidad angular adecuada para enfocar al cohete.
      Calcular la velocidad a la que cambia el ángulo de la cámara cuando el
      cohete se encuentra a 1000 m sobre la plataforma de lanzamiento, sabiendo
      que en ese instante la velocidad del cohete es de 600 m/s.

      <figure class="figura-examen">
      <svg viewBox="0 0 400 260" role="img" width="400" height="260"
           aria-labelledby="coh23-t coh23-d">
        <title id="coh23-t">El cohete, la camara y el triangulo rectangulo que forman</title>
        <desc id="coh23-d">Un triangulo rectangulo: el cateto horizontal mide cinco
        mil metros y va de la camara a la plataforma de lanzamiento; el vertical es la
        altura h del cohete; y la hipotenusa es la linea de vision de la camara, que
        forma un angulo theta con el suelo.</desc>
        <style>
          .coh23-l { stroke: var(--ink); stroke-width: 2; fill: none; }
          .coh23-v { stroke: var(--live); stroke-width: 2.2; fill: none; }
          .coh23-ang { stroke: var(--alt); stroke-width: 1.6; fill: none; }
          .coh23-n { fill: var(--faint); font-size: 11px; font-family: var(--mono); }
          .coh23-et { fill: var(--live); font-size: 13px; font-family: var(--mono); font-weight: 700; }
          .coh23-alt { fill: var(--alt); font-size: 13px; font-family: var(--mono); font-weight: 700; }
        </style>
        <path class="coh23-l" d="M60 215L320 215"/>
        <path class="coh23-v" d="M320 215L320 48.6"/>
        <path class="coh23-l" d="M60 215L320 48.6"/>
        <path class="coh23-ang" d="M117.2 215A57.2 57.2 0 0 0 108.2 184.2"/>
        <path class="coh23-l" d="M310 215L310 205L320 205"/>
        <g class="coh23-n">
          <text x="190" y="231" text-anchor="middle">5000 m</text>
        </g>
        <text class="coh23-et" x="328" y="126.6">h</text>
        <text class="coh23-alt" x="132.8" y="209">θ</text>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original, sin los dibujos decorativos del
      cohete y de la cámara. Lo único que hace falta es el triángulo rectángulo:
      el cateto fijo de 5000 m, el cateto variable h y el ángulo θ en la cámara.
      </figcaption>
      </figure>
    pide: La velocidad angular de la cámara en ese instante, en radianes por segundo.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué relación liga el ángulo $\theta$ de la cámara con la altura $h$
          del cohete?
        opciones:
          - texto: $\tan\theta=\dfrac{h}{5000}$
            correcta: true
            mensaje: |
              Eso es. El cateto opuesto al ángulo es la altura y el contiguo es
              la distancia fija de 5000 m, así que lo que aparece es la
              tangente. Y es la relación buena precisamente porque el 5000 es
              constante: al derivar no estorba.
          - texto: $\sin\theta=\dfrac{h}{5000}$
            mensaje: |
              El seno sería altura entre **hipotenusa**, y la hipotenusa aquí no
              es 5000: es la línea de visión, que cambia con el tiempo. Usarla
              mete una segunda función desconocida en la ecuación.
          - texto: $\theta=\dfrac{h}{5000}$
            mensaje: |
              Esa es la aproximación de ángulo pequeño, y aquí el ángulo no es
              pequeño$—$vale unos $11^{\circ}$ y crece. Además, si fuera cierta,
              el ángulo crecería a ritmo constante y el ejercicio no tendría
              gracia.

      - tipo: calcular
        titulo: El factor que aparece al derivar
        pregunta: |
          Derivando $\tan\theta=h/5000$ respecto del tiempo aparece
          $\sec^{2}\theta$. ¿Cuánto vale en el instante del enunciado?
        respuesta:
          tipo: numero
          valor: '1.04'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $\sec^{2}\theta=1$ solo si $\theta=0$, es decir, con el cohete
              todavía en la plataforma. Aquí $\tan\theta=1/5$, y
              $\sec^{2}\theta=1+\tan^{2}\theta$.
          - valor: '26'
            mensaje: |
              Te has dejado el denominador. $\tan\theta=1000/5000=1/5$, no $5$,
              así que $1+\tan^{2}\theta=1+\frac1{25}=\frac{26}{25}$.
          - valor: '0.9615385'
            mensaje: |
              Eso es $\cos^{2}\theta$, el inverso de lo que buscas. Al derivar
              $\tan\theta$ aparece $\sec^{2}\theta$ multiplicando a
              $\theta'$, y $\sec^{2}=1/\cos^{2}$.
        pista: |
          $\sec^{2}\theta=1+\tan^{2}\theta$, y la tangente ya la tienes.
        desarrollo: |
          $$
          \tan\theta=\frac{1000}{5000}=\frac15
          \;\Longrightarrow\;
          \sec^{2}\theta=1+\frac{1}{25}=\frac{26}{25}=1{,}04
          $$

      - tipo: calcular
        titulo: La velocidad angular
        pregunta: |
          ¿A qué velocidad cambia el ángulo de la cámara en ese instante?
        respuesta:
          tipo: numero
          valor: '0.1153846'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales, en rad/s
        distractores:
          - valor: '0.12'
            mensaje: |
              Te has dejado el $\sec^{2}\theta$. Eso sería la velocidad angular
              si el ángulo fuera $h/5000$ en vez de su arcotangente; con el
              cohete a 1000 m ya se nota la diferencia, un 4 %.
          - valor: '0.1248'
            mensaje: |
              Has multiplicado por $\sec^{2}\theta$ en vez de dividir. El factor
              acompaña a $\theta'$ en el lado izquierdo, así que al despejar
              pasa dividiendo.
          - valor: '0.6'
            mensaje: |
              Has dividido entre la altura, 1000, en lugar de entre la distancia
              a la plataforma. El 5000 es el cateto fijo, y es el que aparece en
              la relación.
        pista: |
          $\sec^{2}\theta\cdot\theta'=\dfrac{h'}{5000}$, y $h'=600$.
        desarrollo: |
          $$
          \tan\theta=\frac{h}{5000}
          \;\Longrightarrow\;
          \sec^{2}\theta\,\frac{d\theta}{dt}=\frac{1}{5000}\frac{dh}{dt}
          $$

          $$
          \frac{d\theta}{dt}
          =\frac{600/5000}{26/25}
          =\frac{0{,}12}{1{,}04}
          =\frac{3}{26}\approx 0{,}1154\ \text{rad/s}
          $$

          Que son unos $6{,}61$ grados por segundo.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La distancia de la cámara a la plataforma es constante, así que la
              única variable geométrica es la altura $h(t)$, y el ángulo queda
              determinado por ella.
          - texto: >-
              Derivando $\tan\theta(t)=h(t)/5000$ respecto de $t$ con la regla de
              la cadena sale $\sec^{2}\theta\cdot\theta'=h'/5000$.
          - texto: >-
              En el instante pedido $\tan\theta=1/5$, luego $\sec^{2}\theta=26/25$
              y $\theta'=\frac{600/5000}{26/25}=\frac{3}{26}$ rad/s.
          - texto: >-
              Como el cohete sube a 600 m/s y la cámara gira para seguirlo, el
              ángulo crece proporcionalmente a la altura.
            trampa: true
            mensaje: |
              No lo hace. La proporcionalidad valdría si $\theta$ fuera
              $h/5000$, pero es $\arctan(h/5000)$, que crece cada vez más
              despacio: con el cohete muy alto la cámara casi no se mueve
              aunque el cohete siga acelerando. De hecho $\theta'$ tiende a
              cero cuando $h\to\infty$.
    resolucion: |
      **Qué se está pidiendo.** No la velocidad del cohete, que la dan, sino la
      del ángulo. Es un problema de razones relacionadas: dos magnitudes ligadas
      por una relación geométrica, y una de las dos derivadas conocida.

      **La relación.** El triángulo rectángulo tiene el cateto contiguo fijo
      —los 5000 m del suelo— y el opuesto variable —la altura—. Eso es una
      tangente:

      $$
      \tan\theta(t)=\frac{h(t)}{5000}
      $$

      Merece la pena parar aquí. Si se elige el seno, la hipotenusa también
      cambia con el tiempo y aparece una segunda función desconocida. La
      tangente es la única de las tres razones que deja el dato constante en el
      denominador.

      **Derivar.** Los dos lados dependen de $t$, así que la regla de la cadena
      actúa en el izquierdo:

      $$
      \sec^{2}\theta\cdot\frac{d\theta}{dt}=\frac{1}{5000}\cdot\frac{dh}{dt}
      $$

      **Sustituir, y solo entonces.** Los valores del instante concreto se meten
      **después** de derivar, nunca antes: si se sustituye $h=1000$ en la
      relación y luego se deriva, se está derivando una constante y sale cero.
      Con $h=1000$ se tiene $\tan\theta=\frac15$ y $\sec^{2}\theta=\frac{26}{25}$,
      y con $h'=600$,

      $$
      \frac{d\theta}{dt}=\frac{600/5000}{26/25}=\frac{3}{26}\approx0{,}1154\ \text{rad/s}
      $$

      **La comprobación de sentido.** Unos $6{,}6$ grados por segundo: la cámara
      barre el ángulo recto en poco más de trece segundos. Razonable para un
      cohete que acaba de despegar, y que irá frenando conforme suba.

  - id: ex2223-ord-3-cual-es-la-funcion-y-cual-la-derivada
    titulo: Dos curvas, y averiguar cuál deriva a cuál
    fuente: >-
      Ejercicio 3 del PRIMER PARCIAL · Convocatoria ordinaria, 12 de junio de 2023 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      La siguiente figura muestra las gráficas de las funciones $f(x)$ y $g(x)$
      definidas en el intervalo $[0{,}5,\,3{,}5]$.

      <figure class="figura-examen">
      <svg viewBox="0 0 400 400" role="img" width="400" height="400"
           aria-labelledby="fg23-t fg23-d">
        <title id="fg23-t">Las graficas de f y de g sobre el intervalo de cero coma cinco a tres coma cinco</title>
        <desc id="fg23-d">Dos curvas sobre una cuadricula. La primera, f, tiene forma
        de U muy abierta: entra por arriba a la izquierda, corta al eje horizontal
        poco despues de uno, baja hasta su minimo en x igual a dos y vuelve a subir
        cortando al eje cerca de dos coma ocho cinco. La segunda, g, es una
        ondulacion suave: sale justo por debajo del eje, lo cruza enseguida, sube a
        un maximo alli donde f corta al eje la primera vez, baja pasando por cero en
        x igual a dos, llega a su minimo donde f corta la segunda vez y vuelve a
        subir, cruzando el eje otra vez muy cerca del extremo derecho.</desc>
        <style>
          .fg23-men { stroke: var(--rule); stroke-width: 0.6; fill: none; opacity: .55; }
          .fg23-may { stroke: var(--rule); stroke-width: 1; fill: none; }
          .fg23-eje { stroke: var(--graphite); stroke-width: 1.6; fill: none; }
          .fg23-f { stroke: var(--d2); stroke-width: 2.6; fill: none; }
          .fg23-g { stroke: var(--d3); stroke-width: 2.6; fill: none; }
          .fg23-n { fill: var(--faint); font-size: 11px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
          .fg23-ef { fill: var(--d2); font-size: 14px; font-family: var(--mono); font-weight: 700; }
          .fg23-eg { fill: var(--d3); font-size: 14px; font-family: var(--mono); font-weight: 700; }
        </style>
