        <g class="fg23-n">
          <text x="58" y="260" text-anchor="middle">0,5</text>
          <text x="108" y="260" text-anchor="middle">1</text>
          <text x="158" y="260" text-anchor="middle">1,5</text>
          <text x="208" y="260" text-anchor="middle">2</text>
          <text x="258" y="260" text-anchor="middle">2,5</text>
          <text x="308" y="260" text-anchor="middle">3</text>
          <text x="358" y="260" text-anchor="middle">3,5</text>
          <text x="51" y="349" text-anchor="end">−1</text>
          <text x="51" y="149" text-anchor="end">1</text>
          <text x="51" y="49" text-anchor="end">2</text>
          <text x="376" y="249">x</text>
        </g>
        <text class="fg23-ef" x="70" y="83">f(x)</text>
        <text class="fg23-eg" x="70" y="290">g(x)</text>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original. Las dos curvas se dibujan aquí
      con la pareja exacta f(x) = 1,35(x − 1,15)(x − 2,85) y g su primitiva con
      g(2) = 0, que reproduce el trazado del examen.
      </figcaption>
      </figure>

      a) Una de las gráficas corresponde a una función $y(x)$ y la otra a su
      derivada $y'(x)$. Identificar de forma razonada qué gráfica corresponde a
      cada una de las funciones.

      b) Consideremos la función $h(x)=\ln(y(x))$. Obtener su dominio de
      definición y calcular su derivada.

      c) Estudiar los intervalos de crecimiento/decrecimiento y los extremos de
      $h(x)$.

      d) Sabiendo que $y''(x)<0$ en el intervalo $(1,2)$, estudiar la
      concavidad/convexidad de $h(x)$ en dicho intervalo.
    pide: Quién es quién, el dominio y la derivada de h, sus extremos y su curvatura.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál de las dos gráficas es $y$ y cuál es $y'$?
        opciones:
          - texto: >-
              $g$ es $y$ y $f$ es $y'$
            correcta: true
            mensaje: |
              Eso es. Donde $f$ está por encima del eje, $g$ sube; donde $f$
              está por debajo, $g$ baja; y los dos cortes de $f$ con el eje caen
              exactamente en el máximo y en el mínimo de $g$. Esa es la relación
              entre una función y su derivada, en ese orden.
          - texto: >-
              $f$ es $y$ y $g$ es $y'$
            mensaje: |
              Tentador, porque $g$ se anula en $x=2$ y ahí $f$ tiene su mínimo.
              Pero mira **cómo** cruza: para que $f$ tuviera un mínimo en $x=2$,
              su derivada tendría que pasar de negativa a positiva, y $g$ hace
              justo lo contrario, baja al cruzar. Además $g$ se anula en otros
              dos puntos donde $f$ no tiene ningún extremo.
          - texto: >-
              Con la gráfica sola no se puede decidir
            mensaje: |
              Sí se puede, y es lo que pide el apartado a). Basta comparar el
              signo de una con la monotonía de la otra: si el candidato a
              derivada es positivo justo donde el candidato a función sube, la
              pareja encaja; y solo encaja en un sentido.

      - tipo: calcular
        titulo: El dominio de h
        pregunta: |
          El dominio de $h(x)=\ln(y(x))$ es el conjunto donde $y>0$. Dentro del
          intervalo $[0{,}5,\,3{,}5]$, ¿en cuántos trozos separados queda?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Solo has contado el trozo grande. $g$ vuelve a cortar al eje cerca
              del extremo derecho y a partir de ahí es otra vez positiva, así
              que hay un segundo trozo, corto pero real.
          - valor: '3'
            mensaje: |
              Parece que has contado los tres cortes de $g$ con el eje. Tres
              cortes dentro del intervalo dejan cuatro trozos, y solo dos de
              ellos son de signo positivo: los de los extremos.
          - valor: '4'
            mensaje: |
              Cuatro son los trozos en que los tres cortes parten el intervalo,
              contando los negativos. El dominio de un logaritmo solo se queda
              con los positivos.
        pista: |
          Cuenta cuántas veces $g$ cruza el eje dentro del intervalo, y quédate
          con los tramos que quedan por encima.
        desarrollo: |
          $g$ corta al eje tres veces: una poco después de $x=0{,}5$, otra en
          $x=2$ y otra poco antes de $x=3{,}5$. Entre el primer corte y $x=2$ es
          positiva, entre $x=2$ y el tercer corte es negativa, y después del
          tercero vuelve a ser positiva.

          $$
          \mathrm{Dom}(h)=(x_{0},2)\cup(x_{1},3{,}5]
          $$

          El trozo que importa para el resto del ejercicio es el primero, que es
          donde caen el intervalo $(1,2)$ del apartado d) y el extremo.

      - tipo: calcular
        titulo: El extremo de h
        pregunta: |
          Con la pareja de la figura, $f(x)=1{,}35(x-1{,}15)(x-2{,}85)$. ¿En qué
          punto alcanza $h$ su extremo dentro del trozo grande del dominio?
        respuesta:
          tipo: numero
          valor: '1.15'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              En $x=2$ es donde se anula $y$, no $y'$: ahí $h$ no está definida
              —el logaritmo se va a $-\infty$—, así que no puede haber extremo.
          - valor: '2.85'
            mensaje: |
              Es el otro cero de $y'$, sí, pero cae donde $y<0$ y $h$ no existe.
              Un cero de la derivada solo es candidato si está en el dominio.
          - valor: '3.5'
            mensaje: |
              Un extremo del intervalo no es un punto crítico interior, y
              además el apartado pregunta por el trozo grande del dominio, que
              termina en $x=2$.
        pista: |
          $h'=\dfrac{y'}{y}=\dfrac{f}{g}$, y una fracción se anula donde se
          anula el numerador.
        desarrollo: |
          $$
          h'(x)=\frac{y'(x)}{y(x)}=\frac{f(x)}{g(x)}
          $$

          En el dominio $g>0$, así que el signo de $h'$ es el de $f$. Y $f$ es
          positiva antes de $x=1{,}15$ y negativa después:

          $$
          h'>0 \text{ en } (x_{0},1{,}15),
          \qquad
          h'<0 \text{ en } (1{,}15,\,2)
          $$

          Crece y luego decrece: en $x=1{,}15$ hay un **máximo** relativo.

      - tipo: justificar
        pregunta: Ordena el estudio de la curvatura en $(1,2)$. Una pieza es falsa.
        piezas:
          - texto: >-
              En $(1,2)$ se tiene $y>0$, así que $h=\ln y$ está definida y
              $h'=y'/y$.
          - texto: >-
              Derivando otra vez,
              $h''=\dfrac{y''y-(y')^{2}}{y^{2}}$.
          - texto: >-
              El enunciado da $y''<0$ en $(1,2)$, y ahí $y>0$, luego $y''y<0$;
              además $-(y')^{2}\le 0$ siempre. El numerador es negativo y el
              denominador positivo.
          - texto: >-
              Como $y''<0$ y $(y')^{2}>0$, el numerador $y''y-(y')^{2}$ es
              positivo y $h$ resulta convexa.
            trampa: true
            mensaje: |
              Los dos sumandos son negativos, así que su suma no puede ser
              positiva: $y''y<0$ porque $y''<0$ e $y>0$, y $-(y')^{2}\le0$
              porque va con signo menos delante de un cuadrado. El numerador es
              negativo y $h$ es **cóncava** en todo $(1,2)$.
    resolucion: |
      **a) Quién es quién.** La regla es la de siempre —la derivada dice si la
      función sube o baja—, pero aquí hay una trampa preparada: $g$ se anula en
      $x=2$, que es justo donde $f$ tiene su mínimo. Quien mire solo los
      «ceros contra extremos» se queda con la pareja equivocada.

      Lo que decide es el **sentido** del cruce. Si $f$ fuera $y$ y $g$ su
      derivada, en el mínimo de $f$ la derivada tendría que pasar de negativa a
      positiva; y $g$, en $x=2$, pasa de positiva a negativa. Imposible. Al
      revés todo encaja: $f>0$ exactamente donde $g$ sube, $f<0$ exactamente
      donde $g$ baja, y los dos ceros de $f$ son el máximo y el mínimo de $g$.

      $$
      y=g,\qquad y'=f
      $$

      **b) Dominio y derivada.** El logaritmo pide argumento positivo:

      $$
      \mathrm{Dom}(h)=\{x\in[0{,}5,\,3{,}5] : y(x)>0\}
      $$

      que en la figura son dos trozos: el que va del primer corte de $g$ hasta
      $x=2$, y un rabito final después del tercer corte. Y

      $$
      h'(x)=\frac{y'(x)}{y(x)}=\frac{f(x)}{g(x)}
      $$

      **c) Monotonía y extremos.** En el dominio el denominador es positivo, así
      que **el signo de $h'$ es el signo de $f$**. En el trozo grande, $f$ es
      positiva hasta su primer cero y negativa después: $h$ crece, luego
      decrece, y en ese cero —alrededor de $x=1{,}15$— tiene un máximo relativo.
      Al acercarse a $x=2$ la función $h$ se despeña hacia $-\infty$, porque el
      argumento del logaritmo tiende a cero.

      **d) Curvatura en $(1,2)$.**

      $$
      h''=\left(\frac{y'}{y}\right)'=\frac{y''y-(y')^{2}}{y^{2}}
      $$

      En ese intervalo el enunciado regala $y''<0$, y la figura da $y>0$. Los
      dos términos del numerador son entonces negativos —o nulos—, el
      denominador es positivo, y $h''<0$: **cóncava** en todo $(1,2)$.

      Merece la pena quedarse con esto: para que $\ln y$ sea convexa no basta
      con que $y$ lo sea; hay que ganarle al término $-(y')^{2}$, que juega
      siempre en contra. El logaritmo de una función cóncava y positiva es
      siempre cóncavo, y aquí eso resuelve el apartado sin cuentas.

  - id: ex2223-ord-4-mclaurin-para-el-logaritmo-de-nueve-decimas
    titulo: Un polinomio de grado dos para ln 0,9
    fuente: >-
      Ejercicio 4 del PRIMER PARCIAL · Convocatoria ordinaria, 12 de junio de 2023 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      a) Calcular el polinomio de McLaurin de orden 2 de la función
      $f(x)=\ln(x+3)$.

      b) Utilizando el polinomio anterior calcular el valor aproximado
      $\ln 0{,}9$.

      c) Acotar el error cometido en dicho cálculo.
    pide: El polinomio, la aproximación y una cota del error.

    pasos:
      - tipo: reconocer
        pregunta: |
          El polinomio está centrado en $x=0$, donde $f(0)=\ln 3$. ¿Cómo se
          llega desde ahí a $\ln 0{,}9$?
        opciones:
          - texto: >-
              Escribiendo $0{,}9=\frac{2{,}7}{3}$, de modo que
              $\ln 0{,}9=\ln 2{,}7-\ln 3=f(-0{,}3)-\ln 3$
            correcta: true
            mensaje: |
              Eso es. El truco es que $2{,}7=x+3$ con $x=-0{,}3$, un punto muy
              cerca del centro, que es donde el polinomio aproxima bien. El
              $\ln 3$ que sobra se cancela con el término independiente.
          - texto: >-
              Resolviendo $x+3=0{,}9$, es decir, evaluando el polinomio en
              $x=-2{,}1$
            mensaje: |
              Se puede escribir, pero no sirve para nada: $-2{,}1$ está a un
              suspiro del borde del dominio —en $x=-3$ el logaritmo revienta— y
              el error del polinomio crece como $\left|x\right|^{3}$. La cota en
              $-2{,}1$ es enorme comparada con el valor que se quiere calcular.
          - texto: >-
              Aproximando $\ln 0{,}9\approx\ln 1=0$, que es el valor más cercano
              conocido
            mensaje: |
              Eso da cero y no usa el polinomio para nada. Además el error sería
              de una milésima larga en términos absolutos, pero del 100 % en
              términos relativos: se pierde toda la información.

      - tipo: calcular
        titulo: El coeficiente de segundo grado
        pregunta: |
          En $P_{2}(x)=\ln 3+\alpha x+\beta x^{2}$, ¿cuánto vale $\beta$?
        respuesta:
          tipo: numero
          valor: '-0.0555556'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.0555556'
            mensaje: |
              Signo. $f'(x)=(x+3)^{-1}$ y $f''(x)=-(x+3)^{-2}$, así que
              $f''(0)=-\frac19$ y el coeficiente es negativo.
          - valor: '-0.1111111'
            mensaje: |
              Ese es $f''(0)=-\frac19$ sin dividir entre $2!$. El coeficiente de
              $x^{2}$ en Taylor es $\frac{f''(0)}{2}$.
          - valor: '-0.1666667'
            mensaje: |
              Parece la serie de $\ln(1+u)$ con $u=x$ y sin cuidar el cambio:
              con $\ln(1+x/3)$ el término cuadrático es
              $-\frac{(x/3)^{2}}{2}=-\frac{x^{2}}{18}$, no $-\frac{x^{2}}{6}$.
        pista: |
          $\ln(x+3)=\ln 3+\ln\!\left(1+\frac{x}{3}\right)$, y de
          $\ln(1+u)=u-\frac{u^{2}}{2}+\cdots$ ya sabes lo que sale.
        desarrollo: |
          $$
          f(x)=\ln 3+\ln\!\left(1+\frac{x}{3}\right)
          =\ln 3+\frac{x}{3}-\frac{x^{2}}{18}+\cdots
          $$

          $$
          P_{2}(x)=\ln 3+\frac{x}{3}-\frac{x^{2}}{18}
          $$

          Y $\beta=-\frac{1}{18}\approx-0{,}0556$.

      - tipo: calcular
        titulo: La aproximación
        pregunta: |
          ¿Qué valor da el polinomio para $\ln 0{,}9$?
        respuesta:
          tipo: numero
          valor: '-0.105'
          tolerancia: 0.0005
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '-0.1'
            mensaje: |
              Te has quedado en el término lineal, $-0{,}3/3$. Falta el
              cuadrático, $-\frac{(-0{,}3)^{2}}{18}=-0{,}005$, que aquí vale un
              5 % del total.
          - valor: '-0.095'
            mensaje: |
              Signo en el término cuadrático. Como $x=-0{,}3$ es negativo pero
              va al cuadrado, $-\frac{x^{2}}{18}$ resta, no suma.
          - valor: '0.105'
            mensaje: |
              El logaritmo de un número menor que $1$ es negativo, así que la
              respuesta tiene que salir por debajo de cero. Revisa el signo de
              $x=-0{,}3$.
        pista: |
          $\ln 0{,}9=P_{2}(-0{,}3)-\ln 3$, y el $\ln 3$ se cancela con el
          término independiente.
        desarrollo: |
          $$
          \ln 0{,}9=\ln\frac{2{,}7}{3}=\ln 2{,}7-\ln 3=f(-0{,}3)-\ln 3
          $$

          $$
          \approx P_{2}(-0{,}3)-\ln 3
          =\frac{-0{,}3}{3}-\frac{(-0{,}3)^{2}}{18}
          =-0{,}1-0{,}005=-0{,}105
          $$

          El valor real es $-0{,}1053605\ldots$, así que se han acertado tres
          cifras sin calculadora.

      - tipo: calcular
        titulo: La cota del error
        pregunta: |
          Usando el resto de Lagrange, ¿cuál es la cota del error cometido?
        respuesta:
          tipo: numero
          valor: '0.0004572'
          tolerancia: 0.000005
          formato: en forma exacta o con siete decimales
        distractores:
          - valor: '0.0027434'
            mensaje: |
              Te falta el $3!$ del denominador. El resto es
              $\frac{f'''(\xi)}{3!}x^{3}$, y $3!=6$.
          - valor: '0.0013717'
            mensaje: |
              Has dividido entre $2$ en vez de entre $6$. En el resto de un
              polinomio de orden $2$ el factorial que aparece es el del orden
              siguiente$—3!$, no $2!$.
          - valor: '0.0003333'
            mensaje: |
              Has acotado $\left|f'''\right|$ en $x=0$, que es donde **menos**
              vale. La cota tiene que valer para todo el intervalo entre $0$ y
              $-0{,}3$, y el máximo se alcanza en el extremo $x=-0{,}3$.
        pista: |
          $f'''(x)=\dfrac{2}{(x+3)^{3}}$, y en $[-0{,}3,\,0]$ el denominador es
          más pequeño cuanto más a la izquierda.
        desarrollo: |
          $$
          R_{2}(x)=\frac{f'''(\xi)}{3!}\,x^{3},
          \qquad
          f'''(x)=\frac{2}{(x+3)^{3}}
          $$

          En el intervalo entre $-0{,}3$ y $0$, el mayor valor de
          $\left|f'''\right|$ está donde el denominador es menor, o sea en
          $x=-0{,}3$:

          $$
          \left|f'''(\xi)\right|\le\frac{2}{2{,}7^{3}}\approx0{,}101610
          $$

          $$
          \left|R_{2}\right|\le
          \frac{2}{2{,}7^{3}}\cdot\frac{0{,}3^{3}}{6}
          \approx 4{,}572\cdot10^{-4}
          $$

          El error real es $3{,}6\cdot10^{-4}$, así que la cota se cumple y no
          va sobrada.

      - tipo: justificar
        pregunta: Ordena la acotación del error. Una pieza es falsa.
        piezas:
          - texto: >-
              El teorema de Taylor con resto de Lagrange dice que existe un
              $\xi$ entre $0$ y $x$ tal que
              $f(x)-P_{2}(x)=\frac{f'''(\xi)}{3!}x^{3}$.
          - texto: >-
              Aquí $x=-0{,}3$, así que $\xi\in(-0{,}3,\,0)$ y
              $\left|x\right|^{3}=0{,}027$.
          - texto: >-
              En ese intervalo $\left|f'''(\xi)\right|=\frac{2}{(\xi+3)^{3}}$ se
              hace máxima en $\xi=-0{,}3$, donde vale $\frac{2}{2{,}7^{3}}$.
          - texto: >-
              El resto se evalúa en $\xi=0$, que es el punto en el que está
              centrado el polinomio.
            trampa: true
            mensaje: |
              El punto $\xi$ del resto **no se conoce**: el teorema solo
              garantiza que está en algún sitio entre $0$ y $x$. Por eso la
              única salida es acotar $\left|f'''\right|$ en todo el intervalo y
              quedarse con el peor caso. Si se pudiera evaluar en un punto
              concreto no sería una cota: sería el error exacto.
    resolucion: |
      **a) El polinomio.** Se puede derivar tres veces, pero sale antes usando
      lo que ya se sabe:

      $$
      \ln(x+3)=\ln\!\left[3\left(1+\frac{x}{3}\right)\right]
      =\ln 3+\ln\!\left(1+\frac{x}{3}\right)
      $$

      y con $\ln(1+u)=u-\frac{u^{2}}{2}+\frac{u^{3}}{3}-\cdots$ para
      $u=\frac{x}{3}$:

      $$
      P_{2}(x)=\ln 3+\frac{x}{3}-\frac{x^{2}}{18}
      $$

      **b) La aproximación, y el truco que la hace posible.** La tentación es
      resolver $x+3=0{,}9$, que da $x=-2{,}1$; y ahí el polinomio no vale nada,
      porque está a punto de salirse del dominio. Lo que se hace es sacar el
      $0{,}9$ de un punto **cercano al centro**:

      $$
      0{,}9=\frac{2{,}7}{3}
      \;\Longrightarrow\;
      \ln 0{,}9=\ln 2{,}7-\ln 3=f(-0{,}3)-\ln 3
      $$

      Y ahora $x=-0{,}3$ sí está cerca de cero:

      $$
      \ln 0{,}9\approx P_{2}(-0{,}3)-\ln 3=-0{,}1-0{,}005=-0{,}105
      $$

      Fíjate en que el $\ln 3$ se cancela: no hace falta conocer su valor, que
      es justo lo que se necesita en un examen sin calculadora.

      **c) La cota.**

      $$
      f'''(x)=\frac{2}{(x+3)^{3}},
      \qquad
      \left|R_{2}\right|=\left|\frac{f'''(\xi)}{6}(-0{,}3)^{3}\right|
      \le\frac{2}{2{,}7^{3}}\cdot\frac{0{,}027}{6}\approx4{,}6\cdot10^{-4}
      $$

      Se acota en el extremo más desfavorable del intervalo, $\xi=-0{,}3$,
      porque el $\xi$ del teorema es desconocido. El error verdadero,
      $3{,}6\cdot10^{-4}$, queda por debajo: la cota funciona y además es
      ajustada, señal de que se ha acotado bien y no a lo bruto.

  - id: ex2223-ord-5-la-esfera-cortada-por-el-cilindro
    titulo: La media bola recortada por un cilindro que la toca por dentro
    fuente: >-
      Ejercicio 1 del SEGUNDO PARCIAL · Convocatoria ordinaria, 12 de junio de 2023 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Calcular el volumen del sólido limitado por las condiciones
      $x^{2}+y^{2}+z^{2}\le 16$, $x^{2}+y^{2}\le 4y$, $z\ge 0$.

      <figure class="figura-examen">
      <svg viewBox="0 0 320 310" role="img" width="320" height="310"
           aria-labelledby="base23-t base23-d">
        <title id="base23-t">La base del solido y su radio polar</title>
        <desc id="base23-d">Una circunferencia grande de radio cuatro centrada en el
        origen, dibujada a trazos, y dentro de ella un disco relleno de radio dos con
        centro en el punto cero coma dos: pasa por el origen y toca a la grande por
        dentro en el punto cero coma cuatro. Un rayo sale del origen formando un
        angulo con el eje horizontal y termina en el borde del disco; su longitud es
        cuatro por el seno de ese angulo.</desc>
        <style>
          .b23-sombra { fill: none; stroke: var(--graphite); stroke-width: 1.4; stroke-dasharray: 6 5; }
          .b23-disco { fill: var(--live); fill-opacity: .16; stroke: var(--live); stroke-width: 2.2; }
          .b23-eje { stroke: var(--graphite); stroke-width: 1.2; fill: none; }
          .b23-rayo { stroke: var(--alt); stroke-width: 2; fill: none; }
          .b23-arco { stroke: var(--alt); stroke-width: 1.4; fill: none; }
          .b23-pt { fill: var(--alt); }
          .b23-n { fill: var(--faint); font-size: 11px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
          .b23-et { fill: var(--live); font-size: 12px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round; }
          .b23-ea { fill: var(--alt); font-size: 12px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round; }
          .b23-eg { fill: var(--graphite); font-size: 12px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round; }
        </style>
        <path class="b23-eje" d="M14 160L296 160M155 301L155 13"/>
        <circle class="b23-sombra" cx="155" cy="160" r="120"/>
        <circle class="b23-disco" cx="155" cy="100" r="60"/>
        <path class="b23-rayo" d="M155 160L207 70"/>
        <path class="b23-arco" d="M188 160A33 33 0 0 0 171.5 131.4"/>
        <circle class="b23-pt" cx="207" cy="70" r="3.2"/>
        <circle class="b23-pt" cx="155" cy="40" r="3.2"/>
        <g class="b23-n">
          <text x="300" y="174">x</text>
          <text x="161" y="22">y</text>
          <text x="148" y="104" text-anchor="end">2</text>
          <text x="163" y="34">(0, 4)</text>
          <text x="31" y="174" text-anchor="middle">−4</text>
        </g>
        <text class="b23-et" x="155" y="128.5" text-anchor="middle">x² + y² ≤ 4y</text>
        <text class="b23-eg" x="72.5" y="260.5">x² + y² = 16</text>
        <text class="b23-ea" x="215" y="66">r = 4 sen θ</text>
        <text class="b23-ea" x="195.5" y="151.6">θ</text>
      </svg>
      <figcaption>
      Figura nuestra; el enunciado no trae ninguna. Responde a por qué el ángulo
      barre solo media vuelta: el disco está entero en el semiplano de arriba, y
      el radio polar que lo describe es 4 sen θ, que se anula en 0 y en π.
      </figcaption>
      </figure>
    pide: El volumen, en forma exacta.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué región del plano describe $x^{2}+y^{2}\le 4y$?
        opciones:
          - texto: El disco de centro $(0,2)$ y radio $2$
            correcta: true
            mensaje: |
              Eso es. Completando cuadrados, $x^{2}+(y-2)^{2}\le 4$. Es un disco
              que pasa por el origen y es tangente por dentro a la
              circunferencia de radio $4$ en el punto $(0,4)$: cabe justo dentro
              de la sombra de la esfera.
          - texto: El disco de centro el origen y radio $2$
            mensaje: |
              Ese sería $x^{2}+y^{2}\le 4$. Aquí el $4y$ del lado derecho lleva
              una $y$, y al pasarla al otro lado aparece $-4y$, que es lo que
              desplaza el centro hacia arriba.
          - texto: El disco de centro $(0,4)$ y radio $4$
            mensaje: |
              Has leído el $4$ como el radio y la $y$ como el centro. Completa
              cuadrados con cuidado: $x^{2}+y^{2}-4y\le0$ es
              $x^{2}+(y-2)^{2}\le4$, centro $(0,2)$ y radio $2$.

      - tipo: calcular
        titulo: El radio en polares
        pregunta: |
          En polares, la condición $x^{2}+y^{2}\le 4y$ se convierte en
          $r\le k\sin\theta$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              El $2$ es el radio del disco, no el coeficiente. Sustituye:
              $r^{2}\le 4r\sin\theta$, y dividiendo entre $r$ queda
              $r\le 4\sin\theta$. En $\theta=\pi/2$ eso da $r=4$, que es el
              diámetro del disco, correcto.
          - valor: '16'
            mensaje: |
              Has elevado al cuadrado de más. La conversión es directa:
              $x^{2}+y^{2}=r^{2}$ e $y=r\sin\theta$, así que
              $r^{2}\le 4r\sin\theta$.
          - valor: '8'
            mensaje: |
              Parece que has duplicado el $4$ pensando en el diámetro. No hace
              falta: el $4\sin\theta$ ya alcanza su máximo $4$ en
              $\theta=\pi/2$, y ese máximo **es** el diámetro.
        pista: |
          $x^{2}+y^{2}=r^{2}$ e $y=r\sin\theta$; luego divide entre $r$.
        desarrollo: |
          $$
          r^{2}\le 4r\sin\theta
          \;\Longrightarrow\;
          r\le 4\sin\theta
          $$

          Y para que haya región hace falta $\sin\theta\ge0$, es decir,
          $\theta\in[0,\pi]$: el disco está entero en el semiplano superior.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen del sólido?
        respuesta:
          tipo: numero
          valor: '38.5762'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '67.0206'
            mensaje: |
              Eso es $\frac{64\pi}{3}$, lo que saldría si el corchete de la
              integral fuera solo el $64$. Falta restar
              $(16-r^{2})^{3/2}$ evaluado en $r=4\sin\theta$, que vale
              $64\left|\cos\theta\right|^{3}$ y aporta $-\frac{256}{9}$.
          - valor: '19.2881'
            mensaje: |
              Justo la mitad. Has integrado $\theta$ solo de $0$ a $\pi/2$. El
              disco ocupa **medio plano**, de $0$ a $\pi$: es tangente al eje
              $x$ en el origen, no simétrico respecto del eje $y$ nada más.
          - valor: '77.1524'
            mensaje: |
              El doble. Probablemente has aplicado una simetría que ya estaba
              contada: el intervalo $[0,\pi]$ recorre el disco entero una sola
              vez.
        pista: |
          $\displaystyle\int_{0}^{R}\sqrt{16-r^{2}}\,r\,dr=
          \frac13\left[64-(16-R^{2})^{3/2}\right]$, y con $R=4\sin\theta$ el
          paréntesis se convierte en $16\cos^{2}\theta$.
        desarrollo: |
          $$
          V=\int_{0}^{\pi}\!\!\int_{0}^{4\sin\theta}\sqrt{16-r^{2}}\;r\,dr\,d\theta
          $$

          La integral de dentro:

          $$
          \int_{0}^{4\sin\theta}\!\!\sqrt{16-r^{2}}\,r\,dr
          =\frac13\Big[64-(16\cos^{2}\theta)^{3/2}\Big]
          =\frac{64}{3}\left(1-\left|\cos\theta\right|^{3}\right)
          $$

          Y como $\displaystyle\int_{0}^{\pi}\left|\cos\theta\right|^{3}d\theta
          =2\int_{0}^{\pi/2}\cos^{3}\theta\,d\theta=\frac43$:

          $$
          V=\frac{64}{3}\left(\pi-\frac43\right)
          =\frac{64\pi}{3}-\frac{256}{9}\approx38{,}576
          $$

      - tipo: justificar
        pregunta: Ordena el planteamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El sólido se proyecta sobre el plano $z=0$ en el disco
              $x^{2}+(y-2)^{2}\le4$, y sobre cada punto de él la altura va de
              $z=0$ hasta la semiesfera $z=\sqrt{16-x^{2}-y^{2}}$.
          - texto: >-
              El disco cabe entero dentro de la circunferencia $x^{2}+y^{2}=16$
              —es tangente interior en $(0,4)$—, así que el radicando nunca se
              hace negativo y la semiesfera es de verdad la tapa en todo el
              recinto.
          - texto: >-
              En polares el recinto es $0\le\theta\le\pi$, $0\le r\le4\sin\theta$,
              y el elemento de área lleva su $r$.
          - texto: >-
              Como la tapa es la semiesfera de radio $4$, el volumen es el de la
              media bola, $\frac{2}{3}\pi\cdot 4^{3}$.
            trampa: true
            mensaje: |
              Eso sería si la base fuera el disco entero de radio $4$. La base
              es el disco pequeño, que ocupa
              $\frac{\pi\cdot2^{2}}{\pi\cdot4^{2}}=\frac14$ de la sombra, y
              además la parte que recorta es la de más altura —la del centro—,
              así que el volumen no es ni la cuarta parte de la media bola:
              $\frac23\pi\,64\approx134$ frente a los $38{,}6$ que salen.
    resolucion: |
      **Traducir las tres condiciones.** La primera es la bola de radio $4$; la
      tercera la corta por la mitad y deja la de arriba; la segunda es la que
      hay que descifrar. Completando cuadrados:

      $$
      x^{2}+y^{2}-4y\le 0
      \;\Longleftrightarrow\;
      x^{2}+(y-2)^{2}\le 4
      $$

      un disco de centro $(0,2)$ y radio $2$, apoyado en el origen y tangente
      por dentro a la circunferencia de radio $4$. Ese detalle importa: como
      cabe entero dentro de la sombra de la esfera, la semiesfera es la tapa en
      **todo** el recinto y no hay que partir la integral en trozos.

      **Por qué polares.** Porque la frontera del disco pasa por el origen. Un
      disco descentrado que pasa por el polo tiene en polares una ecuación
      cortísima:

      $$
      r^{2}\le 4r\sin\theta
      \;\Longrightarrow\;
      r\le 4\sin\theta,
      \qquad \theta\in[0,\pi]
      $$

      El barrido completo es de $0$ a $\pi$, no de $0$ a $2\pi$: para
      $\theta>\pi$ el seno es negativo y no hay radio que valga.

      **La integral.**

      $$
      V=\int_{0}^{\pi}\!\!\int_{0}^{4\sin\theta}\sqrt{16-r^{2}}\;r\,dr\,d\theta
      $$

      La de dentro es inmediata con el cambio $u=16-r^{2}$:

      $$
      \int_{0}^{R}\sqrt{16-r^{2}}\,r\,dr
      =\frac13\left[64-(16-R^{2})^{3/2}\right]
      $$

      y aquí $16-R^{2}=16-16\sin^{2}\theta=16\cos^{2}\theta$, de donde
      $(16\cos^{2}\theta)^{3/2}=64\left|\cos\theta\right|^{3}$. El valor
      absoluto **no es un adorno**: en $(\pi/2,\pi)$ el coseno es negativo y sin
      él la integral sale mal.

      $$
      V=\frac{64}{3}\int_{0}^{\pi}\left(1-\left|\cos\theta\right|^{3}\right)d\theta
      =\frac{64}{3}\left(\pi-\frac43\right)
      =\frac{64\pi}{3}-\frac{256}{9}
      $$

      **El número.** $\approx 38{,}58$. Comprobación de sentido: la media bola
      entera vale $\frac23\pi\,4^{3}\approx134$, y el disco base ocupa la cuarta
      parte de la sombra; como además se lleva la zona alta, salir en torno a un
      tercio de $134$ es exactamente lo que cabe esperar. Este sólido tiene
      nombre, por cierto: es la **bóveda de Viviani** cuando el cilindro tiene
      radio la mitad que la esfera.

  - id: ex2223-ord-6-el-trabajo-en-la-espiral-y-su-area
    titulo: Un trabajo que resulta ser un área
    fuente: >-
      Ejercicio 2 del SEGUNDO PARCIAL · Convocatoria ordinaria, 12 de junio de 2023 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Sean el campo vectorial $\vec{V}=\left(-\dfrac{y}{2},\,\dfrac{x}{2}\right)$
      y la espiral definida por las ecuaciones paramétricas
      $x=t\cos t$, $y=t\sin t$.

