        <circle class="esp23-pt" cx="150" cy="100" r="3.6"/>
        <circle class="esp23-pt" cx="363.6" cy="100" r="3.6"/>
        <g class="esp23-n">
          <text x="388.6" y="114">x</text>
          <text x="156" y="30.8">y</text>
          <text x="252" y="114" text-anchor="middle">3</text>
        </g>
        <text class="esp23-et" x="142" y="92" text-anchor="end">A</text>
        <text class="esp23-et" x="357.6" y="90" text-anchor="end">B(2π, 0)</text>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original. La espiral va de A, en el origen,
      hasta B, en 2π; la zona sombreada es la que encierra con el segmento del
      eje horizontal que cierra el camino.
      </figcaption>
      </figure>

      a) Calcular el trabajo efectuado por $\vec{V}$ al trasladar una partícula
      desde el punto $A=(0,0)$ hasta el punto $B=(2\pi,0)$ siguiendo la espiral.

      b) Calcular el área de la figura sombreada.
    pide: El trabajo a lo largo de la espiral, y el área que encierra con el eje.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el apartado b) se puede resolver con lo hecho en el a)?
        opciones:
          - texto: >-
              Porque para este campo $\frac{\partial Q}{\partial x}-
              \frac{\partial P}{\partial y}=1$, y entonces el teorema de Green
              convierte la circulación por la frontera cerrada en el área
              encerrada
            correcta: true
            mensaje: |
              Eso es, y es la razón de que el enunciado elija precisamente
              $\left(-\frac y2,\frac x2\right)$. Con esa constante $1$, la
              integral doble de Green es $\iint 1\,dA$, que es el área. Solo
              falta cerrar el camino volviendo por el eje $x$, y ese tramo
              aporta cero.
          - texto: Porque el campo es conservativo
            mensaje: |
              No lo es: si lo fuera, el rotacional sería nulo y aquí vale $1$.
              De hecho, si fuera conservativo el trabajo dependería solo de los
              extremos y no tendría nada que ver con el área encerrada.
          - texto: >-
              Porque el trabajo de cualquier campo es el área bajo la curva
            mensaje: |
              Eso mezcla dos cosas distintas. El área bajo una curva es la
              integral de una función de una variable; el trabajo es una
              integral de línea de un campo vectorial. Coinciden aquí por lo que
              vale el rotacional de **este** campo, no en general.

      - tipo: calcular
        titulo: El trabajo
        pregunta: |
          ¿Cuánto vale el trabajo a lo largo de la espiral, de $A$ a $B$?
        respuesta:
          tipo: numero
          valor: '41.3417'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '82.6834'
            mensaje: |
              El doble. Te has dejado los dos $\frac12$ del campo: el integrando
              es $\frac12(xy'-yx')$, y ese $\frac12$ está en las dos
              componentes.
          - valor: '9.8696'
            mensaje: |
              Eso es $\pi^{2}$, y sale de integrar $t$ en vez de $t^{2}$.
              Comprueba la cuenta: $xy'-yx'=t\cos t(\sin t+t\cos t)-
              t\sin t(\cos t-t\sin t)=t^{2}$.
          - valor: '124.0251'
            mensaje: |
              Has integrado mal la potencia: $\int t^{2}dt=\frac{t^{3}}{3}$, no
              $t^{3}$. El $3$ del denominador es el que deja
              $\frac{(2\pi)^{3}}{6}$.
        pista: |
          $W=\frac12\displaystyle\int_{0}^{2\pi}\left(x\,y'-y\,x'\right)dt$, y esa
          combinación se simplifica muchísimo.
        desarrollo: |
          Con $x=t\cos t$ e $y=t\sin t$:

          $$
          x'=\cos t-t\sin t,
          \qquad
          y'=\sin t+t\cos t
          $$

          $$
          x\,y'-y\,x'
          =t\cos t(\sin t+t\cos t)-t\sin t(\cos t-t\sin t)
          =t^{2}
          $$

          $$
          W=\int_{0}^{2\pi}\left(-\frac y2\,x'+\frac x2\,y'\right)dt
          =\frac12\int_{0}^{2\pi}t^{2}\,dt
          =\frac{(2\pi)^{3}}{6}
          =\frac{4\pi^{3}}{3}\approx41{,}342
          $$

      - tipo: calcular
        titulo: El área sombreada
        pregunta: |
          ¿Cuánto vale el área de la figura sombreada?
        respuesta:
          tipo: numero
          valor: '41.3417'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '20.6709'
            mensaje: |
              Has dividido entre dos algo que ya lo estaba. El $\frac12$ de la
              fórmula del área ya viene dentro del campo: por eso la
              circulación **es** el área, sin más factores.
          - valor: '82.6834'
            mensaje: |
              El doble. Probablemente has usado
              $\oint(x\,dy-y\,dx)$ olvidando que el campo del enunciado ya trae
              los $\frac12$ puestos.
          - valor: '39.4784'
            mensaje: |
              Eso es $4\pi^{2}$. El resultado lleva $\pi^{3}$: viene de
              $\frac{(2\pi)^{3}}{6}$, con el cubo del $2\pi$.
        pista: |
          Cierra el camino con el segmento de $B$ a $A$ por el eje $x$ y mira
          cuánto aporta ese tramo.
        desarrollo: |
          El recinto sombreado está limitado por la espiral y por el segmento
          del eje $x$ que une $B=(2\pi,0)$ con $A=(0,0)$. En ese segmento
          $y=0$ y $dy=0$, luego

          $$
          \int_{B}^{A}\left(-\frac y2\,dx+\frac x2\,dy\right)=0
          $$

          Así que la circulación por la frontera cerrada coincide con el trabajo
          calculado. Y por Green, con
          $\frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}
          =\frac12+\frac12=1$:

          $$
          \oint_{\partial D}\vec V\cdot d\vec r=\iint_{D}1\,dA=\text{área}(D)
          $$

          $$
          \text{área}=\frac{4\pi^{3}}{3}\approx41{,}342
          $$

      - tipo: justificar
        pregunta: Ordena el paso del trabajo al área. Una pieza es falsa.
        piezas:
          - texto: >-
              La frontera del recinto sombreado es la espiral de $A$ a $B$
              seguida del segmento del eje $x$ de $B$ a $A$.
          - texto: >-
              Sobre ese segmento $y=0$ y $dy=0$, así que las dos componentes del
              campo aportan cero y la circulación cerrada vale lo mismo que el
              trabajo pedido en a).
          - texto: >-
              Green transforma esa circulación en
              $\iint_{D}\left(\frac{\partial Q}{\partial x}-
              \frac{\partial P}{\partial y}\right)dA=\iint_{D}1\,dA$, que es el
              área.
          - texto: >-
              El campo $\vec V$ es conservativo, así que el trabajo solo depende
              de los extremos y vale cero porque $A$ y $B$ están los dos sobre
              el eje $x$.
            trampa: true
            mensaje: |
              Si eso fuera cierto el apartado b) no tendría sentido: un área no
              puede salir de un trabajo que vale cero. Y no lo es:
              $\frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}=1
              \neq0$, así que el campo **no** es conservativo. Es justo lo
              contrario de lo que hace falta aquí: precisamente porque el
              rotacional vale $1$, el trabajo mide el área.
    resolucion: |
      **a) El trabajo, y la simplificación que lo salva.** Parametrizando,

      $$
      W=\int_{0}^{2\pi}\left(-\frac{y}{2}\,x'+\frac{x}{2}\,y'\right)dt
      =\frac12\int_{0}^{2\pi}\left(x\,y'-y\,x'\right)dt
      $$

      Y esa combinación, con $x=t\cos t$ e $y=t\sin t$, se derrumba:

      $$
      x\,y'-y\,x'
      =t\cos t\,(\sin t+t\cos t)-t\sin t\,(\cos t-t\sin t)
      =t^{2}\left(\cos^{2}t+\sin^{2}t\right)=t^{2}
      $$

      Todos los productos cruzados se cancelan. De ahí:

      $$
      W=\frac12\int_{0}^{2\pi}t^{2}\,dt=\frac{(2\pi)^{3}}{6}=\frac{4\pi^{3}}{3}
      \approx41{,}34
      $$

      **b) El área, sin integrar otra vez.** La clave está en el campo que han
      elegido. Para $\vec V=\left(-\frac y2,\frac x2\right)$,

      $$
      \frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}
      =\frac12-\left(-\frac12\right)=1
      $$

      así que Green dice que la circulación por cualquier curva cerrada simple
      es exactamente el área encerrada. Solo hay que cerrar el camino, y el
      cierre natural es el segmento del eje $x$ de $B$ a $A$: allí $y=0$ y
      $dy=0$, con lo que las dos componentes del campo se anulan y el tramo no
      aporta nada.

      $$
      \text{área}=\oint_{\partial D}\vec V\cdot d\vec r=W=\frac{4\pi^{3}}{3}
      $$

      **Lo que hay que llevarse.** El apartado a) y el b) son el mismo número, y
      no por casualidad: el enunciado ha construido el campo para que lo sean.
      Cuando en un examen aparezca $\left(-\frac y2,\frac x2\right)$, o
      $(-y,x)$, o $(0,x)$, conviene calcular el rotacional antes de nada: si
      sale $1$, lo que se está calculando es un área disfrazada.

  - id: ex2223-ord-7-un-factor-integrante-que-te-dan-hecho
    titulo: Comprobar un factor integrante y usarlo
    fuente: >-
      Ejercicio 3 del SEGUNDO PARCIAL · Convocatoria ordinaria, 12 de junio de 2023 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      a) Demostrar que la función $g(y)=\dfrac{1}{1-y}$ es un factor integrante
      de la EDO $(1-y)\cos x\,dx-dy=0$.

      b) Resolver la EDO anterior utilizando el factor integrante.
    pide: La comprobación de exactitud y la solución general.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que comprobar exactamente para demostrar que $g$ es factor
          integrante?
        opciones:
          - texto: >-
              Que al multiplicar la ecuación por $g$, la nueva pareja
              $(M^{*},N^{*})$ cumple
              $\frac{\partial M^{*}}{\partial y}=\frac{\partial N^{*}}{\partial x}$
            correcta: true
            mensaje: |
              Eso es. «Factor integrante» significa exactamente eso: que
              convierte la ecuación en exacta. Y hay que comprobarlo **después**
              de multiplicar, no antes: la original no lo es, que es el motivo
              de que haga falta el factor.
          - texto: Que $g$ sea solución de la ecuación diferencial
            mensaje: |
              Un factor integrante no es una solución: es un multiplicador. De
              hecho $g(y)=\frac1{1-y}$ ni siquiera tiene la forma de una
              solución $y(x)$ del problema.
          - texto: Que $g$ no se anule en ningún punto
            mensaje: |
              Hace falta que no se anule para poder dividir de vuelta, sí, pero
              eso no basta ni de lejos: cualquier constante cumple eso y no
              arregla nada. Lo que define al factor integrante es que la
              ecuación multiplicada sea exacta.

      - tipo: calcular
        titulo: La constante de una solución concreta
        pregunta: |
          La solución general es $\sin x+\ln\left|1-y\right|=C$. Para la
          solución que pasa por $\left(0,\,1-e\right)$, ¿cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Has hecho $\sin 0=0$ y te has dejado el logaritmo. Con
              $y=1-e$ se tiene $1-y=e$, y $\ln e=1$.
          - valor: '2.7182818'
            mensaje: |
              Eso es $e$, sin el logaritmo. El término que aparece en la
              solución es $\ln\left|1-y\right|$, y $\ln e=1$.
          - valor: '-1'
            mensaje: |
              Signo. $1-y=1-(1-e)=e$, que es positivo y mayor que $1$, así que
              su logaritmo es positivo.
        pista: |
          Sustituye $x=0$ e $y=1-e$ y calcula $1-y$ antes de meterlo en el
          logaritmo.
        desarrollo: |
          $$
          \sin 0+\ln\left|1-(1-e)\right|=0+\ln e=1
          $$

      - tipo: calcular
        titulo: Un valor de esa solución
        pregunta: |
          Con esa condición inicial, ¿cuánto vale $y(\pi/6)$?
        respuesta:
          tipo: numero
          valor: '-0.6487213'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.6487213'
            mensaje: |
              Signo al despejar. De $1-y=e^{1/2}$ sale $y=1-e^{1/2}$, que es
              negativo porque $e^{1/2}>1$; lo que has escrito es
              $e^{1/2}-1$.
          - valor: '-1.6487213'
            mensaje: |
              Te has dejado el $1$. De $1-y=e^{1/2}$ sale $y=1-e^{1/2}$, no
              $y=-e^{1/2}$.
          - valor: '0.3934693'
            mensaje: |
              Parece que has usado $C=0$ en vez de $C=1$: eso da
              $\ln\left|1-y\right|=-\frac12$ y $y=1-e^{-1/2}$. La constante la
              fija la condición inicial, y aquí vale $1$.
        pista: |
          Despeja: $\ln\left|1-y\right|=1-\sin x$, y en $x=\pi/6$ el seno vale
          $\frac12$.
        desarrollo: |
          $$
          \ln\left|1-y\right|=1-\sin x
          \;\Longrightarrow\;
          1-y=e^{\,1-\sin x}
          \;\Longrightarrow\;
          y=1-e^{\,1-\sin x}
          $$

          El valor absoluto se resuelve con la condición inicial: en $x=0$ se
          tiene $y=1-e<1$, así que $1-y>0$ y ahí se queda —la solución no puede
          cruzar la recta $y=1$, que es a su vez una solución—.

          $$
          y(\pi/6)=1-e^{\,1-\frac12}=1-\sqrt{e}\approx-0{,}6487
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $M=(1-y)\cos x$ y $N=-1$ se tiene $M_{y}=-\cos x$ y $N_{x}=0$,
              distintos: la ecuación no es exacta.
          - texto: >-
              Multiplicando por $g(y)=\frac{1}{1-y}$ queda $M^{*}=\cos x$ y
              $N^{*}=-\frac{1}{1-y}$, y ahora $M^{*}_{y}=0=N^{*}_{x}$: exacta.
          - texto: >-
              Entonces existe $F$ con $F_{x}=\cos x$ y $F_{y}=-\frac1{1-y}$, y
              es $F(x,y)=\sin x+\ln\left|1-y\right|$; la solución general es
              $F=C$.
          - texto: >-
              La recta $y=1$ también sale de esa familia, sin más que elegir la
              constante adecuada.
            trampa: true
            mensaje: |
              No sale: en $y=1$ el logaritmo se va a $-\infty$, y no hay ningún
              valor de $C$ que lo dé. $y\equiv1$ **sí** es solución de la
              ecuación original —sustituye y comprueba que los dos términos se
              anulan—, pero es una solución **singular**, perdida justo al
              dividir entre $1-y$. Es el precio de usar este factor integrante,
              y hay que decirlo aparte.
    resolucion: |
      **a) Que no es exacta, y que con el factor sí lo es.** Con
      $M(x,y)=(1-y)\cos x$ y $N(x,y)=-1$:

      $$
      \frac{\partial M}{\partial y}=-\cos x,
      \qquad
      \frac{\partial N}{\partial x}=0
      $$

      Distintos, así que no es exacta. Multiplicando la ecuación entera por
      $g(y)=\frac{1}{1-y}$:

      $$
      \cos x\,dx-\frac{1}{1-y}\,dy=0
      \;\Longrightarrow\;
      M^{*}=\cos x,\quad N^{*}=-\frac{1}{1-y}
      $$

      $$
      \frac{\partial M^{*}}{\partial y}=0=\frac{\partial N^{*}}{\partial x}
      $$

      Ahora sí. Y se ve por qué funciona: el factor **separa las variables**, la
      $x$ en un término y la $y$ en el otro, que es el caso más cómodo de
      ecuación exacta.

      **b) La solución.** Se busca $F$ con $F_{x}=M^{*}$ y $F_{y}=N^{*}$:

      $$
      F(x,y)=\int\cos x\,dx=\sin x+\varphi(y)
      $$

      $$
      F_{y}=\varphi'(y)=-\frac{1}{1-y}
      \;\Longrightarrow\;
      \varphi(y)=\ln\left|1-y\right|
      $$

      —ojo al signo: $\int\frac{-dy}{1-y}=+\ln\left|1-y\right|$, porque la
      derivada de $1-y$ es $-1$ y se cancela con el menos—. Luego

      $$
      \boxed{\;\sin x+\ln\left|1-y\right|=C\;}
      $$

      o, despejada, $y=1-Ke^{-\sin x}$ con $K=e^{C}>0$ (o $K<0$ según el signo
      de $1-y$).

      **La solución que se pierde.** Al multiplicar por $\frac{1}{1-y}$ se está
      suponiendo $y\neq1$. Y $y\equiv1$ es solución de la ecuación original:
      sustituyendo, $(1-1)\cos x\,dx-0=0$. No aparece en la familia para ningún
      $C$, así que es una **solución singular** y hay que enunciarla aparte.
      Este es el descuido más frecuente del ejercicio, y cuesta puntos de COMP 4
      precisamente porque no cuesta nada de cálculo: solo hay que mirar entre
      qué se ha dividido.

  - id: ex2223-ord-8-un-sistema-de-dos-ecuaciones-por-laplace
    titulo: Dos ecuaciones acopladas que dan la misma respuesta
    fuente: >-
      Ejercicio 4 del SEGUNDO PARCIAL · Convocatoria ordinaria, 12 de junio de 2023 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Utilizando la transformada de Laplace, resolver el sistema

      $$
      \left\{
      \begin{aligned}
      x'(t)&=x(t)+y(t)-e^{t}\\
      y'(t)&=x(t)-y(t)+e^{t}\\
      x(0)&=y(0)=1
      \end{aligned}
      \right.
      $$
    pide: Las funciones x(t) e y(t).

    pasos:
      - tipo: reconocer
        pregunta: |
          Al transformar $x'(t)$, ¿qué aparece?
        opciones:
          - texto: $sX(s)-x(0)$
            correcta: true
            mensaje: |
              Eso es, y el $-x(0)$ es la mitad del interés del método: la
              condición inicial entra sola, en el mismo paso, sin tener que
              resolver primero la general y ajustar constantes después.
          - texto: $sX(s)$
            mensaje: |
              Te falta la condición inicial. $\mathcal{L}\{x'\}=sX(s)-x(0)$, y
              aquí $x(0)=1$, así que ese término no es despreciable: es
              precisamente lo que hace que el sistema tenga solución única.
          - texto: $\dfrac{X(s)}{s}$
            mensaje: |
              Dividir entre $s$ corresponde a **integrar**, no a derivar.
              Derivar en el tiempo es multiplicar por $s$ en la transformada,
              menos el valor inicial.

      - tipo: calcular
        titulo: El determinante del sistema algebraico
        pregunta: |
          Transformando y agrupando queda
          $\left\{(s-1)X-Y=1-\frac{1}{s-1},\ -X+(s+1)Y=1+\frac{1}{s-1}\right\}$.
          ¿Cuánto vale el determinante de ese sistema en $s=3$?
        respuesta:
          tipo: numero
          valor: '7'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '8'
            mensaje: |
              Has hecho solo el producto de la diagonal principal,
              $(s-1)(s+1)=8$. Falta restar el producto de la otra, que es
              $(-1)(-1)=1$.
          - valor: '9'
            mensaje: |
              Eso es $s^{2}$. El determinante es
              $(s-1)(s+1)-(-1)(-1)=s^{2}-1-1=s^{2}-2$.
          - valor: '10'
            mensaje: |
              Has **sumado** el $1$ en vez de restarlo: $s^{2}-1-1$, no
              $s^{2}-1+1$. El menor de la antidiagonal ya lleva su propio signo
              en la fórmula del determinante.
        pista: |
          $\det=\begin{vmatrix}s-1&-1\\-1&s+1\end{vmatrix}$, y en $s=3$ los
          números son pequeños.
        desarrollo: |
          $$
          \det=(s-1)(s+1)-(-1)(-1)=s^{2}-1-1=s^{2}-2
          $$

          En $s=3$ vale $9-2=7$. Y el detalle importante es que ese
          $s^{2}-2$ acaba **cancelándose** con el numerador, de modo que en la
          solución no aparece ningún $\sqrt2$.

      - tipo: calcular
        titulo: El valor de la solución
        pregunta: |
          ¿Cuánto vale $x(1)$?
        respuesta:
          tipo: numero
          valor: '2.7182818'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              Eso es $x(0)$. Si $x$ fuera constante, $x'=0$, y la primera
              ecuación pediría $x+y=e^{t}$, que no se cumple con constantes.
          - valor: '7.3890561'
            mensaje: |
              Eso es $e^{2}$. Sale de despejar $X=\frac{1}{s-2}$, que no es lo
              que da el sistema: el numerador y el denominador comparten el
              factor $s^{2}-2$ y al simplificar queda $\frac{1}{s-1}$.
          - valor: '0.3678794'
            mensaje: |
              Eso es $e^{-1}$. El polo está en $s=+1$, no en $s=-1$:
              $\frac{1}{s-1}$ antitransforma a $e^{t}$, y $\frac{1}{s+1}$ a
              $e^{-t}$.
        pista: |
          Resuelve el sistema en $X$ y mira qué queda tras simplificar.
        desarrollo: |
          $$
          X=\frac{\left(1-\frac{1}{s-1}\right)(s+1)+\left(1+\frac{1}{s-1}\right)}
                 {s^{2}-2}
          =\frac{(s+2)-\frac{s}{s-1}}{s^{2}-2}
          =\frac{s^{2}-2}{(s-1)(s^{2}-2)}
          =\frac{1}{s-1}
          $$

          e igual para $Y$. Antitransformando, $x(t)=y(t)=e^{t}$, y
          $x(1)=e\approx2{,}718$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Transformando las dos ecuaciones con
              $\mathcal{L}\{x'\}=sX-1$, $\mathcal{L}\{y'\}=sY-1$ y
              $\mathcal{L}\{e^{t}\}=\frac{1}{s-1}$ queda un sistema **algebraico**
              de dos ecuaciones en $X(s)$ e $Y(s)$.
          - texto: >-
              Su determinante es $s^{2}-2$, y al resolver por Cramer ese factor
              aparece también en los dos numeradores y se cancela.
          - texto: >-
              Queda $X(s)=Y(s)=\frac{1}{s-1}$, cuya antitransformada es
              $x(t)=y(t)=e^{t}$, y se comprueba que cumple las dos ecuaciones y
              las dos condiciones iniciales.
          - texto: >-
              Como las dos incógnitas salen iguales, el sistema estaba
              desacoplado desde el principio y se podía haber resuelto cada
              ecuación por separado.
            trampa: true
            mensaje: |
              No lo estaba: la primera ecuación lleva una $y$ y la segunda una
              $x$. Que las soluciones coincidan es un resultado del cálculo, no
              un dato de partida, y sale de que los términos cruzados
              $+y-e^{t}$ y $+x+e^{t}$ están construidos para compensarse cuando
              $x=y=e^{t}$. Sin resolver no había forma de saberlo.
    resolucion: |
      **El método, en una frase.** Laplace convierte un sistema de ecuaciones
      diferenciales en un sistema de ecuaciones **algebraicas**, con las
      condiciones iniciales ya metidas dentro. Se resuelve como cualquier
      sistema de dos por dos y luego se antitransforma.

      **Transformar.** Con $x(0)=y(0)=1$ y
      $\mathcal{L}\{e^{t}\}=\frac{1}{s-1}$:

      $$
      \left\{
      \begin{aligned}
      sX-1&=X+Y-\tfrac{1}{s-1}\\
      sY-1&=X-Y+\tfrac{1}{s-1}
      \end{aligned}
      \right.
      \;\Longrightarrow\;
      \left\{
      \begin{aligned}
      (s-1)X-Y&=1-\tfrac{1}{s-1}\\
      -X+(s+1)Y&=1+\tfrac{1}{s-1}
      \end{aligned}
      \right.
      $$

      **Resolver.** El determinante es

      $$
      \begin{vmatrix}s-1&-1\\-1&s+1\end{vmatrix}=s^{2}-2
      $$

      y por Cramer,

      $$
      X=\frac{\left(1-\frac{1}{s-1}\right)(s+1)+\left(1+\frac{1}{s-1}\right)}{s^{2}-2}
      $$

      El numerador se junta sobre $s-1$:

      $$
      (s+2)-\frac{s}{s-1}=\frac{(s+2)(s-1)-s}{s-1}=\frac{s^{2}-2}{s-1}
      $$

      y el $s^{2}-2$ se va con el del denominador:

      $$
      X(s)=\frac{1}{s-1}
      $$

      La misma cuenta para $Y$ da $Y(s)=\frac{1}{s-1}$.

      **Antitransformar.**

      $$
      x(t)=y(t)=e^{t}
      $$

      **Por qué merece la pena la simplificación.** Si uno no junta el numerador
      y se lanza a descomponer $\frac{\text{algo}}{s^{2}-2}$ en fracciones
      simples, aparecen $\pm\sqrt2$ y con ellos senos y cosenos hiperbólicos:
      una solución correcta pero irreconocible, que en un examen sin calculadora
      es media hora perdida. La señal de alarma es que el determinante y el
      numerador compartan factor; conviene mirarlo antes de descomponer.

      **La comprobación, que aquí es gratis.** Con $x=y=e^{t}$:
      $x'=e^{t}$ y $x+y-e^{t}=e^{t}+e^{t}-e^{t}=e^{t}$ ✓;
      $y'=e^{t}$ y $x-y+e^{t}=0+e^{t}=e^{t}$ ✓; y en $t=0$ las dos valen $1$ ✓.

  - id: ex2223-ord-9-fourier-de-la-escalera-de-dos-peldanos
    titulo: Una escalera de dos peldaños, y la suma de Leibniz
    fuente: >-
      Ejercicio 5 del SEGUNDO PARCIAL · Convocatoria ordinaria, 12 de junio de 2023 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea $f(t)$ la función periódica de periodo $T=2$ definida de la siguiente
      forma:

      $$
      f(t)=
      \begin{cases}
      1 & 0<t\le 1\\[2pt]
      \dfrac12 & 1<t\le 2
      \end{cases}
      $$

      a) Dibujar la función periódica $f(t)$.

      b) Calcular la serie de Fourier, $S(t)$, de $f(t)$.

      c) Calcular los valores de $S(t)$ y $f(t)$ en los puntos $t=0$ y
      $t=\dfrac32$.

      d) Obtener la suma de la serie
      $\displaystyle\sum_{n=0}^{\infty}\frac{(-1)^{n}}{2n+1}$.

      <figure class="figura-examen">
      <svg viewBox="0 0 340 240" role="img" width="340" height="240"
           aria-labelledby="pe23-t pe23-d">
        <title id="pe23-t">La funcion periodica de periodo dos</title>
        <desc id="pe23-d">Una escalera de dos peldanos que se repite cada dos
        unidades: la funcion vale uno en la primera mitad de cada periodo y un medio
        en la segunda. En cada cambio hay un salto, con el extremo alcanzado marcado
        con un punto lleno y el no alcanzado con un circulito hueco.</desc>
        <style>
          .pe23-eje { stroke: var(--graphite); stroke-width: 1.2; fill: none; }
          .pe23-c { stroke: var(--live); stroke-width: 2.6; fill: none; }
          .pe23-h { fill: var(--paper); stroke: var(--live); stroke-width: 1.6; }
          .pe23-p { fill: var(--live); }
          .pe23-n { fill: var(--faint); font-size: 11px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round; }
          .pe23-et { fill: var(--live); font-size: 14px; font-family: var(--mono); font-weight: 700; }
        </style>
        <path class="pe23-eje" d="M8.8 190L312.4 190M306.4 186L312.4 190L306.4 194"/>
        <path class="pe23-eje" d="M110 209.5L110 73M106 79L110 73L114 79"/>
        <path class="pe23-c" d="M22 112L66 112M66 151L110 151M110 112L154 112M154 151L198 151M198 112L242 112M242 151L286 151"/>
        <circle class="pe23-h" cx="22" cy="112" r="3"/><circle class="pe23-h" cx="66" cy="151" r="3"/><circle class="pe23-h" cx="110" cy="112" r="3"/><circle class="pe23-h" cx="154" cy="151" r="3"/><circle class="pe23-h" cx="198" cy="112" r="3"/><circle class="pe23-h" cx="242" cy="151" r="3"/>
        <circle class="pe23-p" cx="66" cy="112" r="3"/><circle class="pe23-p" cx="110" cy="151" r="3"/><circle class="pe23-p" cx="154" cy="112" r="3"/><circle class="pe23-p" cx="198" cy="151" r="3"/><circle class="pe23-p" cx="242" cy="112" r="3"/><circle class="pe23-p" cx="286" cy="151" r="3"/>
        <g class="pe23-n">
          <text x="22" y="205" text-anchor="middle">-2</text>
          <text x="66" y="205" text-anchor="middle">-1</text>
          <text x="154" y="205" text-anchor="middle">1</text>
          <text x="198" y="205" text-anchor="middle">2</text>
          <text x="242" y="205" text-anchor="middle">3</text>
          <text x="286" y="205" text-anchor="middle">4</text>
          <text x="101" y="116" text-anchor="end">1</text>
          <text x="101" y="155" text-anchor="end">1/2</text>
          <text x="316.4" y="204">t</text>
        </g>
        <text class="pe23-et" x="121" y="88.6">f(t)</text>
      </svg>
      <figcaption>
      Figura nuestra, y es la respuesta al apartado a): conviene mirarla después
      de haberla dibujado. Punto lleno donde el valor se alcanza, hueco donde no.
      </figcaption>
      </figure>
    pide: La serie, los dos valores del apartado c) y la suma de la serie numérica.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los coeficientes $a_{n}$ con $n\ge1$ salen todos cero. ¿Por qué?
        opciones:
          - texto: >-
              Porque $f(t)-\frac34$ es impar, y una función impar solo tiene
              senos
            correcta: true
            mensaje: |
              Eso es. La media de $f$ es $\frac34$, y lo que queda al restarla
              vale $+\frac14$ en la primera mitad del periodo y $-\frac14$ en la
              segunda: es la onda cuadrada impar de toda la vida. La media se va
              al término $a_{0}/2$ y el resto son senos.
          - texto: Porque $f$ es par
            mensaje: |
              No lo es. $f$ vale $1$ justo a la derecha del origen y $\frac12$
              justo a la izquierda —por periodicidad, $f(-0{,}5)=f(1{,}5)=
              \frac12$—, así que no hay simetría respecto del eje vertical. Si
              la hubiera, los que se anularían serían los $b_{n}$.
          - texto: Porque el periodo es $2$
            mensaje: |
              El periodo fija las frecuencias $n\pi t$, pero no dice nada de qué
              coeficientes se anulan. Con periodo $2$ hay funciones con todos
              los $a_{n}$ distintos de cero.

      - tipo: calcular
        titulo: El término constante
        pregunta: |
          ¿Cuánto vale $\dfrac{a_{0}}{2}$?
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.5'
            mensaje: |
              Ese es $a_{0}$, no $a_{0}/2$. El término independiente de la serie
              es la **media** de la función en un periodo, y aquí la media entre
              $1$ y $\frac12$ es $\frac34$.
          - valor: '0.5'
            mensaje: |
              Has tomado el valor del segundo peldaño en vez de la media de los
              dos. El término constante promedia el periodo entero.
          - valor: '0.375'
            mensaje: |
              Has dividido entre dos una vez de más: $\frac{a_0}{2}=\frac34$, y
              $\frac38$ sería dividirlo otra vez.
        pista: |
          El término independiente de una serie de Fourier es el valor medio de
          la función en un periodo.
        desarrollo: |
          $$
          \frac{a_{0}}{2}=\frac{1}{T}\int_{0}^{T}f
          =\frac12\left(\int_{0}^{1}1\,dt+\int_{1}^{2}\tfrac12\,dt\right)
          =\frac12\left(1+\tfrac12\right)=\frac34
          $$

      - tipo: calcular
        titulo: El primer armónico
        pregunta: |
          ¿Cuánto vale $b_{1}$?
        respuesta:
          tipo: numero
          valor: '0.3183099'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.6366198'
            mensaje: |
              Eso es $\frac{2}{\pi}$, el doble. Con semiperiodo $L=1$ la fórmula
              es $b_{n}=\frac{2}{T}\int_{0}^{T}f\sin\frac{2\pi n t}{T}\,dt$, y
              ese $\frac{2}{T}$ vale $1$, no $2$.
          - valor: '0.1591549'
            mensaje: |
              Eso es $\frac{1}{2\pi}$, la mitad. Revisa el factor: el salto de
              la onda cuadrada es $\frac12$ y el resultado sale
              $\frac{1}{n\pi}$ para $n$ impar.
          - valor: '0'
            mensaje: |
              Los $b_{n}$ **impares** no se anulan: son justo los que quedan.
              Los que valen cero son los pares, y los $a_{n}$ con $n\ge1$.
        pista: |
          Trabaja con $f-\frac34$, que vale $\pm\frac14$: es una onda cuadrada, y
          su desarrollo es conocido.
        desarrollo: |
          Con $u(t)=f(t)-\frac34$, que vale $\frac14$ en $(0,1]$ y $-\frac14$ en
          $(1,2]$:

          $$
          b_{n}=\int_{0}^{2}u(t)\sin(n\pi t)\,dt
          =\frac14\left[\int_{0}^{1}\!\!-\int_{1}^{2}\right]\sin(n\pi t)\,dt
          =\frac{1-\cos n\pi}{2n\pi}\cdot\ldots
          $$

          y operando,

          $$
          b_{n}=\begin{cases}\dfrac{1}{n\pi}&n\text{ impar}\\[6pt]0&n\text{ par}\end{cases}
          $$

          de modo que $b_{1}=\frac1\pi\approx0{,}3183$ y

          $$
          S(t)=\frac34+\frac1\pi\sum_{k=0}^{\infty}
          \frac{\sin\bigl((2k+1)\pi t\bigr)}{2k+1}
          $$

      - tipo: calcular
        titulo: La suma de la serie numérica
        pregunta: |
          ¿Cuánto vale $\displaystyle\sum_{n=0}^{\infty}\frac{(-1)^{n}}{2n+1}$?
        respuesta:
          tipo: numero
          valor: '0.7853982'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '3.1415927'
            mensaje: |
              Te has dejado el término constante. En $t=\frac12$ la serie vale
              $\frac34+\frac1\pi\Sigma$, y eso tiene que igualar a $f(1/2)=1$;
              si se olvida el $\frac34$ sale $\Sigma=\pi$.
          - valor: '0.25'
            mensaje: |
              Has despejado $\frac1\pi\Sigma=1-\frac34$ y te has quedado ahí.
              Falta multiplicar por $\pi$.
          - valor: '0.6931472'
            mensaje: |
              Eso es $\ln 2$, que es la suma de $\sum\frac{(-1)^{n}}{n+1}$, la
              alternada armónica. Esta lleva $2n+1$ en el denominador y su suma
              es $\frac\pi4$.
        pista: |
          Evalúa la serie en un punto donde los senos valgan $\pm1$ y donde $f$
          sea continua, para poder igualar $S=f$.
        desarrollo: |
          En $t=\frac12$ los senos valen
          $\sin\left((2k+1)\frac\pi2\right)=(-1)^{k}$, y $f$ es continua ahí, de
          modo que $S(1/2)=f(1/2)=1$:

          $$
          1=\frac34+\frac1\pi\sum_{k=0}^{\infty}\frac{(-1)^{k}}{2k+1}
          \;\Longrightarrow\;
          \sum_{k=0}^{\infty}\frac{(-1)^{k}}{2k+1}=\frac{\pi}{4}\approx0{,}7854
          $$

      - tipo: justificar
        pregunta: Ordena el apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              El teorema de Dirichlet dice que en un punto de discontinuidad de
              salto la serie converge a la semisuma de los límites laterales.
          - texto: >-
              En $t=0$ hay salto: por la izquierda $f$ vale $\frac12$ —es el
              final del periodo anterior— y por la derecha $1$. Luego
              $S(0)=\frac{3}{4}$, mientras que $f(0)=\frac12$ según el
              enunciado, que cierra el intervalo por la derecha.
          - texto: >-
              En $t=\frac32$ la función es continua, así que la serie converge al
              valor de la función y $S(3/2)=f(3/2)=\frac12$.
          - texto: >-
              Como $f$ es discontinua en $t=0$, la serie de Fourier no converge
              en ese punto.
            trampa: true
            mensaje: |
              Converge perfectamente; lo único que pasa es que **no converge al
              valor de la función**. En un salto la serie se queda en el punto
              medio, aquí $\frac34$, que no coincide con $f(0)=\frac12$. Que la
              serie no reproduzca la función en un puñado de puntos aislados es
              lo normal, y es exactamente lo que dice Dirichlet.
    resolucion: |
      **a) El dibujo.** Dos peldaños que se repiten cada dos unidades: vale $1$
      en la primera mitad del periodo y $\frac12$ en la segunda. En cada salto,
      el enunciado cierra el intervalo por la derecha —$0<t\le1$—, así que el
      valor alcanzado es el del peldaño que termina. La figura de arriba lo
      dibuja con punto lleno donde se alcanza y hueco donde no.

      **b) La serie, por el camino corto.** En vez de atacar las integrales
      directamente, se resta la media:

      $$
      u(t)=f(t)-\frac34=
      \begin{cases}+\frac14&0<t\le1\\[2pt]-\frac14&1<t\le2\end{cases}
      $$

      que es una onda cuadrada impar de amplitud $\frac14$. Impar significa que
      todos los $a_{n}$ con $n\ge1$ se anulan sin calcular nada, y la media se
      recupera al final como término constante:

      $$
      \frac{a_{0}}{2}=\frac34,
      \qquad
      a_{n}=0\ (n\ge1),
      \qquad
      b_{n}=\begin{cases}\frac{1}{n\pi}&n\text{ impar}\\0&n\text{ par}\end{cases}
      $$

      $$
      S(t)=\frac34+\frac1\pi\sum_{k=0}^{\infty}
      \frac{\sin\bigl((2k+1)\pi t\bigr)}{2k+1}
      $$

      **c) Los dos puntos.** En $t=0$ hay un salto: por la izquierda la función
      vale $\frac12$ y por la derecha $1$. Dirichlet manda, y

      $$
      S(0)=\frac{\frac12+1}{2}=\frac34,
      \qquad
      f(0)=\frac12
      $$

      —la función y su serie **no** coinciden ahí, y eso no es un error: es lo
      que ocurre en todo salto—. En $t=\frac32$ la función es continua, así que

      $$
      S\!\left(\tfrac32\right)=f\!\left(\tfrac32\right)=\frac12
      $$

      **d) La suma, que es el premio.** El apartado d) no es un ejercicio
      aparte: es la razón de ser de los tres anteriores. Se busca un punto donde
      los senos impares valgan $\pm1$ alternando, y ese punto es $t=\frac12$:

      $$
      \sin\!\left((2k+1)\frac\pi2\right)=(-1)^{k}
      $$

      Como $f$ es continua en $\frac12$, allí $S=f=1$:

      $$
      1=\frac34+\frac1\pi\sum_{k=0}^{\infty}\frac{(-1)^{k}}{2k+1}
      \;\Longrightarrow\;
      \sum_{n=0}^{\infty}\frac{(-1)^{n}}{2n+1}=\frac\pi4
      $$

      Es la serie de Leibniz. Fíjate en la condición que hay que comprobar antes
      de igualar: el punto elegido tiene que ser de **continuidad**. Si se
      hubiera elegido $t=0$, donde $S$ y $f$ discrepan, la igualdad sería falsa
      y la suma saldría mal.
