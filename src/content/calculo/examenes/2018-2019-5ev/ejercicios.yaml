ejercicios:
  - id: ex1819-5ev-1-el-cuarto-de-disco-mordido
    titulo: Un cuarto de disco con un cuadrado quitado
    fuente: >-
      Ejercicio 1 · Quinta evaluación, SEGUNDO CUATRIMESTRAL, 6 de mayo de 2019
      · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Calcular el centro de gravedad del dominio plano que aparece sombreado en
      la figura (la densidad es constante).

      <figure class="figura-examen">
      <svg viewBox="0 0 340 300" role="img" width="340" height="300"
           aria-labelledby="cd-t cd-d">
        <title id="cd-t">El dominio sombreado</title>
        <desc id="cd-d">Un cuarto de disco de radio dos en el primer cuadrante,
        al que se le ha quitado el cuadrado unidad de la esquina, el que va de
        cero a uno en las dos coordenadas. Lo que queda tiene forma de escuadra
        con el borde exterior curvo, y es simetrico respecto de la recta y igual
        a x.</desc>
        <style>
          .cd-eje { stroke: var(--graphite); stroke-width: 1.2; fill: none; }
          .cd-r { fill: var(--graphite); opacity: .18; }
          .cd-b { stroke: var(--ink); stroke-width: 2.2; fill: none; }
          .cd-num { fill: var(--faint); font-size: 12px; font-family: var(--mono); text-anchor: middle; }
          .cd-g { fill: var(--flag); }
          .cd-g-et { fill: var(--flag); font-size: 13px; font-family: var(--mono); font-weight: 700; }
          .cd-sim { stroke: var(--faint); stroke-width: 1.1; fill: none; stroke-dasharray: 5 4; }
        </style>
        <path class="cd-r" d="M60 50A200 200 0 0 1 260 250L160 250L160 150L60 150Z"/>
        <path class="cd-eje" d="M40 250L300 250M60 275L60 30"/>
        <path class="cd-sim" d="M60 250L235 75"/>
        <path class="cd-b" d="M60 50A200 200 0 0 1 260 250L160 250L160 150L60 150Z"/>
        <circle class="cd-g" cx="161.2" cy="148.8" r="4.5"/>
        <text class="cd-g-et" x="172" y="140">G</text>
        <g class="cd-num">
          <text x="160" y="268">1</text>
          <text x="260" y="268">2</text>
          <text x="48" y="154">1</text>
          <text x="48" y="54">2</text>
          <text x="50" y="268">0</text>
        </g>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original. La discontinua es el eje de
      simetría y = x, que obliga a que las dos coordenadas del centro de
      gravedad coincidan. El punto G marca dónde cae, muy cerca de la esquina
      del cuadrado.
      </figcaption>
      </figure>
    pide: Las dos coordenadas del centro de gravedad.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de integrar nada, ¿qué se puede afirmar de las dos coordenadas?
        opciones:
          - texto: >-
              Que son iguales, porque la región es simétrica respecto de la
              recta $y=x$
            correcta: true
            mensaje: |
              Exacto, y eso ahorra la mitad del trabajo. Tanto el cuarto de
              disco como el cuadrado que se le quita son simétricos al
              intercambiar $x$ por $y$, así que la región también lo es y
              $\overline{x} = \overline{y}$. Solo hay que calcular una.
          - texto: >-
              Que el centro de gravedad está dentro de la región
            mensaje: |
              No tiene por qué: en regiones cóncavas o con agujeros el
              centroide puede caer fuera. Aquí cae **justo en el borde**, en la
              esquina del cuadrado, lo cual es una coincidencia bonita pero no
              una regla.
          - texto: >-
              Que valen lo mismo que las del cuarto de disco entero
            mensaje: |
              Quitar el cuadrado, que está pegado al origen, empuja el centroide
              hacia fuera. El del cuarto de disco entero está en
              $\frac{8}{3\pi}\approx 0{,}849$; el de la región, más lejos.
          - texto: >-
              Que hay que usar coordenadas polares obligatoriamente
            mensaje: |
              Ayudan para el cuarto de disco, pero el cuadrado sale mejor en
              cartesianas. Lo cómodo es tratar cada trozo con las coordenadas
              que le van y restar.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área de la región sombreada?
        respuesta:
          tipo: numero
          valor: '2.1415927'
          tolerancia: 0.002
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '3.1415927'
            mensaje: |
              $\pi$ es el área del cuarto de disco de radio 2 —$\frac{\pi\cdot 2^{2}}{4}$—
              sin quitarle el cuadrado. Falta restar 1.
          - valor: '12.5663706'
            mensaje: |
              $4\pi$ es el área del disco **entero** de radio 2. Aquí solo hay
              un cuarto.
          - valor: '0.7853982'
            mensaje: |
              $\frac\pi4$ sería el cuarto de disco de radio **1**. El radio es 2,
              así que el área del cuarto es $\frac{\pi\cdot 4}{4} = \pi$.
        pista: |
          Cuarto de disco de radio 2 menos el cuadrado de lado 1.
        desarrollo: |
          $$
          A = \frac{\pi\cdot 2^{2}}{4} - 1\cdot 1 = \pi - 1 \approx 2{,}1416
          $$

      - tipo: calcular
        titulo: La coordenada del centro de gravedad
        pregunta: |
          ¿Cuánto vale $\overline{x}$?
        respuesta:
          tipo: numero
          valor: '1.0117076'
          tolerancia: 0.002
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.8488264'
            mensaje: |
              $\frac{8}{3\pi}$ es el centroide del cuarto de disco **entero**,
              sin quitarle el cuadrado. Quitar un trozo pegado al origen empuja
              el centroide hacia fuera, así que tiene que salir mayor.
          - valor: '0.3488264'
            mensaje: |
              Eso es restar los **centroides**: $\frac{8}{3\pi}-\frac12$. No se
              pueden restar. Lo que se resta son los momentos y las áreas, y
              el centroide sale al dividir uno entre la otra.
          - valor: '2.1666667'
            mensaje: |
              $\frac{13}{6}$ es el **momento** de la región, no su centroide.
              Falta dividirlo entre el área, $\pi-1$.
        pista: |
          Resta momentos, no centroides:
          $\overline{x} = \frac{\iint_{\text{disco}}x\,dA - \iint_{\text{cuadrado}}x\,dA}{A}$.
        desarrollo: |
          **El momento del cuarto de disco**, en polares:

          $$
          \iint x\,dA = \int_{0}^{\pi/2}\!\!\int_{0}^{2}r\cos\theta\cdot r\,dr\,d\theta
          = \left[\operatorname{sen}\theta\right]_{0}^{\pi/2}\left[\frac{r^{3}}{3}\right]_{0}^{2}
          = \frac83
          $$

          **El del cuadrado**, en cartesianas:

          $$
          \int_{0}^{1}\!\!\int_{0}^{1}x\,dx\,dy = \frac12
          $$

          **La resta**, y dividir por el área:

          $$
          \overline{x} = \frac{\frac83-\frac12}{\pi-1} = \frac{13/6}{\pi-1}
          = \frac{13}{6(\pi-1)} \approx 1{,}0117
          $$

          Y por simetría $\overline{y}$ vale lo mismo.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La densidad es constante, así que el centro de masa coincide con
              el **centroide** y la densidad se cancela al dividir.
          - texto: >-
              La región es simétrica respecto de $y=x$ —lo son el cuarto de
              disco y el cuadrado que se le quita—, así que
              $\overline{x}=\overline{y}$ y basta con calcular una.
          - texto: >-
              El área es $\pi - 1$: el cuarto de disco de radio 2 menos el
              cuadrado unidad.
          - texto: >-
              Los momentos **sí** se restan: el del cuarto de disco vale
              $\frac83$ y el del cuadrado $\frac12$, así que el de la región es
              $\frac{13}{6}$.
          - texto: >-
              $\overline{x} = \frac{13}{6(\pi-1)} \approx 1{,}0117$, y lo mismo
              $\overline{y}$.
          - texto: >-
              Sale un poco mayor que el del cuarto de disco entero,
              $\frac{8}{3\pi}\approx 0{,}849$, y tiene sentido: se ha quitado
              masa pegada al origen.
          - texto: >-
              Como la región es la diferencia de dos figuras, su centroide es la
              diferencia de los dos centroides.
            trampa: true
            mensaje: |
              Los centroides no se restan. Lo que se resta son los **momentos**
              y las **áreas**, y el centroide sale al dividir uno entre la otra.
              Con este ejemplo se ve: los centroides son $\frac{8}{3\pi}\approx
              0{,}849$ y $\frac12$, cuya diferencia es $0{,}349$ — nada que ver
              con el $1{,}012$ correcto.

    resolucion: |
      ## Lo que se puede decir sin integrar

      **La densidad es constante**, así que se cancela: el centro de masa
      coincide con el centroide geométrico.

      **La región es simétrica respecto de $y=x$.** El cuarto de disco lo es, y
      el cuadrado que se le quita también, así que lo que queda también. Por
      tanto

      $$
      \overline{x} = \overline{y}
      $$

      y solo hay que calcular una de las dos. Decirlo vale uno de los dos
      puntos de COMP4 y ahorra la mitad del trabajo.

      ## El área

      $$
      A = \underbrace{\frac{\pi\cdot 2^{2}}{4}}_{\text{cuarto de disco}} - \underbrace{1}_{\text{cuadrado}} = \pi - 1
      $$

      ## El momento, por diferencia

      La regla que este ejercicio evalúa: **se restan los momentos, no los
      centroides**.

      | pieza | área | $\iint x\,dA$ |
      |---|---|---|
      | cuarto de disco, $r\le 2$ | $\pi$ | $\frac83$ |
      | cuadrado $[0,1]^{2}$ | $1$ | $\frac12$ |
      | **región** | $\pi-1$ | $\frac{13}{6}$ |

      El del cuarto de disco sale cómodo en polares:

      $$
      \int_{0}^{\pi/2}\!\!\int_{0}^{2}r\cos\theta\cdot r\,dr\,d\theta
      = 1\cdot\frac{8}{3} = \frac83
      $$

      y el del cuadrado, en cartesianas, es $\frac12$. Cada trozo con las
      coordenadas que le van.

      ## El resultado

      $$
      \boxed{\;\overline{x} = \overline{y} = \frac{13}{6(\pi-1)} \approx 1{,}012\;}
      $$

      ## Dos comprobaciones

      **Comparar con el cuarto de disco entero**, cuyo centroide está en
      $\frac{8}{3\pi}\approx 0{,}849$. Quitar el cuadrado —que está pegado al
      origen— tiene que empujar el centroide **hacia fuera**, y en efecto
      $1{,}012 > 0{,}849$.

      **Mirar dónde cae.** El punto $(1{,}012,\,1{,}012)$ está prácticamente en
      la esquina del cuadrado que se ha quitado, un pelo por fuera. Es
      plausible a ojo, que es lo que se pide de un dibujo aclaratorio.

  - id: ex1819-5ev-2-la-semielipse-que-minimiza
    titulo: Elegir la forma del camino para que el trabajo sea mínimo
    fuente: >-
      Ejercicio 2 · Quinta evaluación, SEGUNDO CUATRIMESTRAL, 6 de mayo de 2019
      · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Hallar el valor $b>0$ que minimiza el trabajo realizado al mover una
      partícula, sometida a la fuerza $F(x,y) = \left(3y^{2},\,16x\right)$,
      desde el punto $(-1,0)$ hasta el punto $(1,0)$ a lo largo de la
      semielipse

      $$
      x^{2}+\frac{y^{2}}{b^{2}} = 1, \qquad y \ge 0
      $$
    pide: El valor de b que hace mínimo el trabajo.

    pasos:
      - tipo: reconocer
        pregunta: |
          El camino cambia con $b$. ¿Qué hay que hacer?
        opciones:
          - texto: >-
              Calcular el trabajo **en función de $b$** y después minimizar esa
              función de una variable
            correcta: true
            mensaje: |
              Exacto: es un problema de integral de línea seguido de uno de
              optimización de primero. La integral da $W(b) = 4b^{2}-8\pi b$, y
              a partir de ahí es derivar e igualar a cero.
          - texto: >-
              Comprobar si el campo es conservativo: si lo es, el trabajo no
              depende de $b$
            mensaje: |
              Merece la pena comprobarlo —y no lo es: $M_{y}=6y$ y $N_{x}=16$—,
              pero si lo fuera el problema no tendría sentido: todos los
              caminos darían lo mismo y no habría ningún $b$ mejor. Que el
              enunciado pregunte ya sugiere que no lo es.
          - texto: >-
              Aplicar Green cerrando con el segmento de $(1,0)$ a $(-1,0)$
            mensaje: |
              Se puede, y da lo mismo: el área de la semielipse es
              $\frac{\pi b}{2}$ y el integrando $16-6y$ no es constante, así que
              hay que integrar igualmente. Aquí parametrizar es más corto.
          - texto: >-
              Tomar $b$ lo más pequeño posible, porque el camino más corto da
              menos trabajo
            mensaje: |
              La longitud no decide el trabajo de un campo vectorial. De hecho
              el mínimo está en $b=\pi\approx 3{,}14$, que es una semielipse
              bastante alta.

      - tipo: calcular
        titulo: El coeficiente del término cuadrático
        pregunta: |
          Escribiendo $W(b) = \alpha b^{2} + \beta b$, ¿cuánto vale $\alpha$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              3 es el coeficiente de $y^{2}$ en el campo. Al integrar aparece
              además $\int_{0}^{\pi}\operatorname{sen}^{3}t\,dt = \frac43$, y
              $3\cdot\frac43 = 4$.
          - valor: '-4'
            mensaje: |
              Signo. El término en $b^{2}$ sale **positivo**, y es lo que hace
              que la parábola $W(b)$ abra hacia arriba y tenga mínimo. Con
              $-4$ tendría máximo.
          - valor: '1.3333333'
            mensaje: |
              $\frac43$ es la integral $\int_{0}^{\pi}\operatorname{sen}^{3}t\,dt$,
              pero falta multiplicarla por el 3 del campo.
        pista: |
          Con $x=\cos t$, $y=b\operatorname{sen}t$ y $t$ de $\pi$ a 0, el
          término $3y^{2}dx$ da
          $3b^{2}\int_{0}^{\pi}\operatorname{sen}^{3}t\,dt$.
        desarrollo: |
          Parametrizando de $(-1,0)$ a $(1,0)$, o sea $t$ de $\pi$ a $0$:

          $$
          x=\cos t,\quad y = b\operatorname{sen}t,\quad
          dx = -\operatorname{sen}t\,dt,\quad dy = b\cos t\,dt
          $$

          $$
          W = \int_{\pi}^{0}\left[3b^{2}\operatorname{sen}^{2}t\left(-\operatorname{sen}t\right)
          + 16\cos t\cdot b\cos t\right]dt
          $$
          $$
          = 3b^{2}\int_{0}^{\pi}\operatorname{sen}^{3}t\,dt - 16b\int_{0}^{\pi}\cos^{2}t\,dt
          $$

          Con $\int_{0}^{\pi}\operatorname{sen}^{3}t\,dt = \frac43$ y
          $\int_{0}^{\pi}\cos^{2}t\,dt = \frac{\pi}{2}$:

          $$
          W(b) = 4b^{2} - 8\pi b
          $$

      - tipo: calcular
        titulo: La b que minimiza
        pregunta: |
          ¿Para qué $b>0$ es mínimo el trabajo?
        respuesta:
          tipo: numero
          valor: '3.1415927'
          tolerancia: 0.002
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '6.2831853'
            mensaje: |
              $2\pi$ es donde $W$ vuelve a valer cero, no donde es mínimo. El
              vértice de la parábola está en el punto medio de sus dos raíces,
              0 y $2\pi$.
          - valor: '1.5707963'
            mensaje: |
              $\frac\pi2$ sale de $8b = 4\pi$. Cuidado con la derivada:
              $W' = 8b - 8\pi$, no $8b-4\pi$.
          - valor: '0'
            mensaje: |
              En $b=0$ la semielipse degenera en un segmento y $W$ vale 0, que
              es **mayor** que el mínimo $-4\pi^{2}$. Además el enunciado pide
              $b>0$.
        pista: |
          $W(b) = 4b^{2}-8\pi b$ es una parábola. Deriva e iguala a cero.
        desarrollo: |
          $$
          W'(b) = 8b - 8\pi = 0 \;\Longrightarrow\; b = \pi
          $$

          Y es mínimo porque $W''(b) = 8 > 0$: la parábola abre hacia arriba.

          $$
          W(\pi) = 4\pi^{2}-8\pi^{2} = -4\pi^{2} \approx -39{,}48
          $$

          Negativo, o sea que la fuerza frena a la partícula — y con $b=\pi$ la
          frena todo lo que puede.

      - tipo: justificar
        titulo: La resolución
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $M_{y} = 6y$ y $N_{x} = 16$ no coinciden, así que el campo no es
              conservativo y el camino importa. Si no, no habría ninguna $b$
              mejor que otra.
          - texto: >-
              La semielipse se parametriza con $x=\cos t$,
              $y=b\operatorname{sen}t$, y para ir de $(-1,0)$ a $(1,0)$ el
              parámetro va de $\pi$ a $0$.
          - texto: >-
              Sustituyendo, $W(b) = 3b^{2}\int_{0}^{\pi}\operatorname{sen}^{3}t\,dt
              - 16b\int_{0}^{\pi}\cos^{2}t\,dt = 4b^{2}-8\pi b$.
          - texto: >-
              Es una parábola en $b$ que abre hacia arriba, así que tiene
              mínimo donde se anula la derivada: $8b-8\pi=0$, es decir $b=\pi$.
          - texto: >-
              $W''(b) = 8 > 0$ confirma que es mínimo, y el valor mínimo es
              $-4\pi^{2}$.
          - texto: >-
              Como $b>0$ por enunciado y el vértice cae en $b=\pi>0$, el mínimo
              está dentro del dominio permitido y no hay que mirar la frontera.
          - texto: >-
              Al ser $W$ negativo en el mínimo, la partícula gana energía a lo
              largo del camino.
            trampa: true
            mensaje: |
              Al revés: un trabajo **negativo** significa que la fuerza se opone
              al movimiento, así que la partícula **pierde** energía cinética,
              no la gana. Minimizar el trabajo aquí es maximizar lo que hay que
              empujar en contra — el enunciado dice «minimiza» y eso es lo que
              hay que resolver, pero conviene no traducirlo mal al lenguaje
              físico.

    resolucion: |
      ## Primero, ¿tiene sentido la pregunta?

      $$
      M = 3y^{2},\quad N = 16x
      \;\Longrightarrow\;
      M_{y} = 6y, \quad N_{x} = 16
      $$

      No coinciden: el campo **no es conservativo** y el camino importa. Si lo
      fuera, todas las semielipses darían el mismo trabajo y no habría ninguna
      $b$ mejor. Comprobarlo es el punto de COMP1.

      ## El trabajo en función de b

      $$
      x = \cos t, \qquad y = b\operatorname{sen}t, \qquad t: \pi \to 0
      $$

      —de $\pi$ a $0$ porque se va de $(-1,0)$ a $(1,0)$.

      $$
      W = \int_{\pi}^{0}\left[3b^{2}\operatorname{sen}^{2}t\left(-\operatorname{sen}t\right)
      + 16\cos t\cdot b\cos t\right]dt
      $$

      Cambiando el sentido de los límites y separando:

      $$
      W(b) = 3b^{2}\underbrace{\int_{0}^{\pi}\operatorname{sen}^{3}t\,dt}_{4/3}
      - 16b\underbrace{\int_{0}^{\pi}\cos^{2}t\,dt}_{\pi/2}
      = 4b^{2} - 8\pi b
      $$

      Las dos integrales conviene tenerlas: la del seno al cubo sale con
      $\operatorname{sen}^{3} = \operatorname{sen}(1-\cos^{2})$, y la del coseno
      al cuadrado con el ángulo doble.

      ## Minimizar

      $W(b)$ es una **parábola en $b$** que abre hacia arriba:

      $$
      W'(b) = 8b - 8\pi = 0 \;\Longrightarrow\; \boxed{b = \pi}
      $$

      $$
      W''(b) = 8 > 0 \quad\text{(mínimo)}, \qquad W(\pi) = -4\pi^{2} \approx -39{,}48
      $$

      Y el vértice cae dentro del dominio $b>0$ que pide el enunciado, así que
      no hay que examinar ninguna frontera.

      ## Lo que hace el ejercicio interesante

      Junta dos partes de la asignatura que se estudian por separado: una
      **integral de línea** que produce una función, y una **optimización de
      una variable** sobre esa función. Y el resultado no es intuitivo: la
      semielipse óptima tiene semieje vertical $\pi\approx 3{,}14$, mucho más
      alta que ancha. Ni el camino más corto ni el más «redondo».

      Una nota sobre el signo: $W<0$ significa que la fuerza se opone al
      movimiento. Minimizar el trabajo es, físicamente, buscar el camino donde
      más hay que empujar en contra.

  - id: ex1819-5ev-3-lineal-con-condicion-inicial
    titulo: Una lineal que se resuelve casi mirándola
    fuente: >-
      Ejercicio 3 · Quinta evaluación, SEGUNDO CUATRIMESTRAL, 6 de mayo de 2019
      · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp2: 8
      comp4: 2
    enunciado: |
      Resolver la EDO

      $$
      \begin{cases}
      x\,y' - y = x^{3} \\[1mm]
      y(1) = \dfrac{3}{2}
      \end{cases}
      $$
    pide: La solución particular que cumple la condición inicial.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tipo de ecuación es $x\,y' - y = x^{3}$?
        opciones:
          - texto: >-
              Lineal de primer orden: dividiendo entre $x$ queda
              $y' - \frac{1}{x}y = x^{2}$
            correcta: true
            mensaje: |
              Eso es. $y$ e $y'$ aparecen a la primera potencia y sin
              multiplicarse entre sí. El factor integrante es
              $e^{-\int dx/x} = \frac1x$, y con él el lado izquierdo se
              convierte en la derivada de $\frac{y}{x}$.
          - texto: Homogénea, porque $x^{3}$ y $xy'$ tienen el mismo grado
            mensaje: |
              El grado de $xy'$ no se cuenta así: $y'$ no es una potencia de
              $y$. Y despejada, $y' = \frac{y}{x}+x^{2}$, el término $x^{2}$ no
              es función de $y/x$.
          - texto: Exacta, tal como está escrita
            mensaje: |
              Escrita como $\left(y+x^{3}\right)dx - x\,dy = 0$ se tiene
              $M_{y}=1$ y $N_{x}=-1$: no coinciden. Sí se vuelve exacta al
              multiplicar por el factor integrante $\frac{1}{x^{2}}$, que es
              otra forma de resolverla.
          - texto: De variables separables
            mensaje: |
              No se pueden separar: al despejar queda
              $y' = \frac{y}{x}+x^{2}$, y ese segundo sumando impide agrupar
              todas las $y$ a un lado.

      - tipo: calcular
        titulo: El factor integrante
        pregunta: |
          Para $y' - \frac{1}{x}y = x^{2}$, el factor integrante es
          $\mu(x) = x^{k}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Signo. $\mu = e^{\int P\,dx}$ con $P = -\frac1x$, así que el
              exponente es $-\ln x$ y $\mu = x^{-1}$.
          - valor: '2'
            mensaje: |
              2 es el exponente del término independiente, no del factor. El
              factor sale solo del coeficiente de $y$.
          - valor: '-2'
            mensaje: |
              $x^{-2}$ es el factor que convierte la ecuación en **exacta** si
              se escribe en forma diferencial, que es otro camino válido. Para
              la forma canónica $y'+Py=Q$, el factor es $x^{-1}$.
        pista: |
          $\mu(x) = e^{\int P(x)dx}$, y aquí $P(x) = -\frac1x$.
        desarrollo: |
          $$
          \mu(x) = e^{\int\left(-\frac1x\right)dx} = e^{-\ln x} = \frac1x
          $$

          Y multiplicando la ecuación por él, el lado izquierdo se convierte en
          una derivada exacta:

          $$
          \frac{y'}{x} - \frac{y}{x^{2}} = x
          \;\Longleftrightarrow\;
          \left(\frac{y}{x}\right)' = x
          $$

          Reconocer esa derivada es lo que hace que el resto sea inmediato.

      - tipo: calcular
        titulo: La solución en un punto
        pregunta: |
          La solución es $y = \frac{x^{3}}{2} + x$. ¿Cuánto vale $y(2)$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              4 es solo $\frac{x^{3}}{2}$. Falta sumar el término $Cx$ con
              $C=1$, que en $x=2$ vale 2.
          - valor: '8'
            mensaje: |
              8 es $x^{3}$ sin dividir entre 2.
          - valor: '2'
            mensaje: |
              2 es solo el término $x$. Falta $\frac{8}{2}=4$.
        pista: |
          $y(2) = \frac{2^{3}}{2} + 2$.
        desarrollo: |
          $$
          y(2) = \frac{8}{2} + 2 = 6
          $$

          Y la comprobación de la condición inicial:
          $y(1) = \frac12 + 1 = \frac32$ ✓

      - tipo: justificar
        titulo: La resolución
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Dividiendo entre $x$, la ecuación queda en forma canónica:
              $y' - \frac1x y = x^{2}$.
          - texto: >-
              El factor integrante es $\mu = e^{-\int dx/x} = \frac1x$.
          - texto: >-
              Multiplicando, el lado izquierdo es exactamente
              $\left(\frac{y}{x}\right)'$, y la ecuación se reduce a
              $\left(\frac{y}{x}\right)' = x$.
          - texto: >-
              Integrando, $\frac{y}{x} = \frac{x^{2}}{2}+C$, o sea
              $y = \frac{x^{3}}{2}+Cx$.
          - texto: >-
              La condición $y(1)=\frac32$ da $\frac12+C=\frac32$, luego $C=1$ y
              $y = \frac{x^{3}}{2}+x$.
          - texto: >-
              La solución vale en el intervalo que contiene a $x=1$ sin pasar
              por $x=0$, o sea en $x>0$: al dividir entre $x$ se ha excluido el
              origen.
          - texto: >-
              Como la condición inicial es $y(1)=\frac32$, la constante $C$ vale
              $\frac32$.
            trampa: true
            mensaje: |
              $C$ no es el valor de $y$ en el punto: es la constante de la
              solución general, y hay que despejarla sustituyendo. Aquí
              $y(1) = \frac{1}{2}+C\cdot 1 = \frac32$ da $C=1$, no
              $C=\frac32$. Confundir la condición inicial con el valor de la
              constante solo funciona cuando el término particular se anula en
              ese punto, que aquí no pasa.

    resolucion: |
      ## El tipo, y el factor

      $$
      x\,y' - y = x^{3}
      \;\xrightarrow{\;\div\,x\;}\;
      y' - \frac{1}{x}\,y = x^{2}
      $$

      **Lineal de primer orden**, con $P(x) = -\frac1x$ y $Q(x)=x^{2}$.

      $$
      \mu(x) = e^{\int P\,dx} = e^{-\ln x} = \frac1x
      $$

      ## El paso que lo resuelve

      Multiplicando por $\mu$:

      $$
      \frac{y'}{x} - \frac{y}{x^{2}} = x
      $$

      y el lado izquierdo es **exactamente** la derivada de un cociente:

      $$
      \left(\frac{y}{x}\right)' = x
      $$

      Eso es lo que hace un factor integrante, y verlo escrito así ahorra
      cualquier fórmula:

      $$
      \frac{y}{x} = \frac{x^{2}}{2} + C
      \;\Longrightarrow\;
      y = \frac{x^{3}}{2} + Cx
      $$

      ## La condición inicial

      $$
      y(1) = \frac12 + C = \frac32 \;\Longrightarrow\; C = 1
      $$

      $$
      \boxed{\;y = \frac{x^{3}}{2} + x\;}
      $$

      ## Dónde vale

      Al dividir entre $x$ se ha excluido el origen, así que la solución del
      problema de valor inicial vive en el intervalo que contiene a $x=1$ sin
      cruzar el 0: **$x>0$**. Decirlo es el punto de COMP4 que más se olvida en
      los problemas de valor inicial.

      Curiosamente la fórmula $y = \frac{x^{3}}{2}+x$ sí está definida en todo
      $\mathbb{R}$ y también satisface la ecuación en $x<0$ — pero eso es otra
      solución, de otro problema: la teoría garantiza unicidad solo en el
      intervalo donde los coeficientes son continuos.

  - id: ex1819-5ev-4-coseno-que-resuena-y-exponencial
    titulo: Uno resuena y el otro no, y hay que verlo antes de ensayar
    fuente: >-
      Ejercicio 4 · Quinta evaluación, SEGUNDO CUATRIMESTRAL, 6 de mayo de 2019
      · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp2: 8
      comp4: 2
    enunciado: |
      Resolver la EDO
      $y'' + 25y = 4\cos 5x - 7e^{5x}$.
    pide: La solución general.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos sumandos llevan un 5. ¿Los dos resuenan?
        opciones:
          - texto: >-
              No: solo el coseno. Las raíces son $\pm 5i$, y $e^{5x}$ vendría de
              la raíz real $5$, que no está
            correcta: true
            mensaje: |
              Exacto, y es la distinción que el ejercicio mide. Resonar es
              **ser solución de la homogénea**, no compartir un número.
              $\cos 5x$ lo es; $e^{5x}$ no — sustituido en $y''+25y$ da
              $50e^{5x}$, no cero.
          - texto: 'Sí, los dos: el 5 aparece en la característica'
            mensaje: |
              Aparece como $\pm 5i$, imaginario puro. Las soluciones homogéneas
              son $\cos 5x$ y $\operatorname{sen}5x$, no $e^{5x}$. Multiplicar
              el ensayo exponencial por $x$ sin necesidad da coeficientes
              contradictorios.
          - texto: >-
              No resuena ninguno, porque el segundo miembro tiene dos términos
            mensaje: |
              El número de términos no cambia nada: por superposición se tratan
              por separado, y cada uno se compara con la homogénea por su
              cuenta.
          - texto: >-
              Solo la exponencial, porque crece y el coseno está acotado
            mensaje: |
              Estar acotado o no es irrelevante. Lo único que cuenta es si el
              término es solución de $y''+25y=0$, y $\cos 5x$ lo es.

      - tipo: calcular
        titulo: El coeficiente de la exponencial
        pregunta: |
          Ensayando $y_{p} = Ce^{5x}$ para el sumando $-7e^{5x}$, ¿cuánto vale
          $C$?
        respuesta:
          tipo: numero
          valor: '-0.14'
          tolerancia: 0.0005
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '-0.28'
            mensaje: |
              $-\frac{7}{25}$: te has dejado uno de los dos sumandos. Al
              sustituir, $y_{p}'' = 25Ce^{5x}$ y $25y_{p} = 25Ce^{5x}$, así que
              el total es $50C$.
          - valor: '0.14'
            mensaje: |
              Signo. El término del enunciado es $-7e^{5x}$, con el menos
              delante.
          - valor: '-7'
            mensaje: |
              $-7$ es el coeficiente del enunciado. Hay que dividirlo entre lo
              que salga al sustituir el ensayo, que es 50.
        pista: |
          $y_{p} = Ce^{5x}$ tiene $y_{p}'' = 25Ce^{5x}$. Súmale $25y_{p}$ e
          iguala a $-7e^{5x}$.
        desarrollo: |
          $$
          25Ce^{5x} + 25Ce^{5x} = 50Ce^{5x} = -7e^{5x}
          \;\Longrightarrow\;
          C = -\frac{7}{50} = -0{,}14
          $$

          Sin resonancia: $e^{5x}$ no es solución de la homogénea, así que el
          ensayo más simple funciona.

      - tipo: calcular
        titulo: El coeficiente del término que resuena
        pregunta: |
          Ensayando $y_{p} = x\left(A\cos 5x + B\operatorname{sen}5x\right)$
          para $4\cos 5x$, ¿cuánto vale $B$?
        respuesta:
          tipo: numero
          valor: '0.4'
          tolerancia: 0.0005
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '4'
            mensaje: |
              4 es el coeficiente del enunciado. Al sustituir queda
              $10B\cos 5x = 4\cos 5x$, así que hay que dividir entre 10.
          - valor: '0'
            mensaje: |
              El que vale 0 es $A$, el del coseno del ensayo. Los papeles se
              cruzan al derivar dos veces.
          - valor: '2.5'
            mensaje: |
              $\frac{10}{4}$: has dividido al revés.
        pista: |
          Con ese ensayo, los términos con $x$ se cancelan y queda
          $y_{p}''+25y_{p} = -10A\operatorname{sen}5x + 10B\cos 5x$.
        desarrollo: |
          $$
          y_{p}''+25y_{p} = -10A\operatorname{sen}5x + 10B\cos 5x = 4\cos 5x
          $$

          $$
          -10A = 0 \;\Rightarrow\; A = 0,
          \qquad
          10B = 4 \;\Rightarrow\; B = \frac{2}{5}
          $$

          $$
          y_{p_{1}} = \frac{2}{5}\,x\operatorname{sen}5x
          $$

      - tipo: justificar
        titulo: La solución general
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $r^{2}+25=0$ da $r=\pm 5i$, así que
              $y_{h} = C_{1}\cos 5x + C_{2}\operatorname{sen}5x$.
          - texto: >-
              Por superposición se busca una particular para cada sumando del
              segundo miembro.
          - texto: >-
              $4\cos 5x$ resuena, porque $\cos 5x$ está en la homogénea: el
              ensayo lleva una $x$ y da $A=0$, $B=\frac25$.
          - texto: >-
              $-7e^{5x}$ no resuena, porque las raíces son imaginarias puras y
              $e^{5x}$ no es solución: el ensayo $Ce^{5x}$ da $C=-\frac{7}{50}$.
          - texto: >-
              La solución general es
              $y = C_{1}\cos 5x + C_{2}\operatorname{sen}5x
              + \frac25 x\operatorname{sen}5x - \frac{7}{50}e^{5x}$.
          - texto: >-
              El término resonante crece linealmente y el exponencial crece
              mucho más rápido, así que a la larga domina la exponencial.
          - texto: >-
              Como $e^{5x}$ y $\cos 5x$ comparten el 5, sus dos particulares se
              pueden juntar en un solo ensayo.
            trampa: true
            mensaje: |
              No comparten nada relevante: uno viene de una raíz **real** que no
              está en la característica y el otro de las **imaginarias** que sí
              están. Por eso uno necesita la $x$ delante y el otro no.
              Juntarlos en un solo ensayo produce un sistema sin solución — y
              es el error que este enunciado está construido para provocar,
              poniendo el mismo número en los dos sitios.

    resolucion: |
      ## La homogénea

      $$
      r^{2}+25 = 0 \;\Longrightarrow\; r = \pm 5i
      \;\Longrightarrow\;
      y_{h} = C_{1}\cos 5x + C_{2}\operatorname{sen}5x
      $$

      ## El 5 que engaña

      El segundo miembro es $4\cos 5x - 7e^{5x}$: los dos sumandos llevan un 5,
      y **solo uno resuena**.

      | sumando | ¿es solución de la homogénea? | ensayo |
      |---|---|---|
      | $4\cos 5x$ | **sí** | $x\left(A\cos 5x+B\operatorname{sen}5x\right)$ |
      | $-7e^{5x}$ | no | $Ce^{5x}$ |

      La raíz $5i$ produce $\cos 5x$ y $\operatorname{sen}5x$; para que
      $e^{5x}$ estuviera en la homogénea haría falta la raíz **real** 5, que no
      lo es. Sustituyéndolo se comprueba: $y''+25y = 50e^{5x} \neq 0$.

      ## Las dos particulares

      $$
      y_{p_{1}}''+25y_{p_{1}} = -10A\operatorname{sen}5x + 10B\cos 5x = 4\cos 5x
      \;\Longrightarrow\;
      A = 0,\; B = \frac25
      $$

      $$
      50C\,e^{5x} = -7e^{5x} \;\Longrightarrow\; C = -\frac{7}{50}
      $$

      ## La solución

      $$
      \boxed{\;y = C_{1}\cos 5x + C_{2}\operatorname{sen}5x
      + \frac{2}{5}\,x\operatorname{sen}5x - \frac{7}{50}e^{5x}\;}
      $$

      ## Cómo se comporta

      Tres regímenes distintos conviviendo, y merece la pena decirlo:

      - la **oscilación libre**, acotada;
      - la **resonancia**, $\frac25 x\operatorname{sen}5x$, que oscila con
        amplitud creciente en línea recta;
      - la **exponencial**, que a la larga se come a las otras dos.

      Para $x$ grande la solución es esencialmente $-\frac{7}{50}e^{5x}$: la
      resonancia crece, pero linealmente, y contra una exponencial eso no es
      nada.
