            <desc id="f-ex2425-nivel-d">La parábola y igual a dos menos x al cuadrado pasa por el punto P(−1,1). La tangente en P tiene pendiente dos y va en la dirección (1,2). Las dos flechas del gradiente son perpendiculares a ella y de longitud diez a escala: una apunta hacia abajo a la derecha y la otra hacia arriba a la izquierda. El vector b igual a (−2,3), dibujado también desde P, forma ángulo agudo con una de las dos y obtuso con la otra.</desc>
