ejercicios:
  - id: ex2425-4ev-1-curva-de-nivel-dada
    titulo: La curva de nivel dada, y el gradiente que se deduce
    fuente: >-
      Ejercicio 1 · Cuarta evaluación, 24 de marzo de 2025 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3
    enunciado: |
      La curva de nivel de una función $f(x,y)$ que pasa por el punto $P(-1,1)$
      tiene por ecuación $x^{2}+y=2$.

      a) ¿En qué dirección es 0 la velocidad de cambio de la función en el
      punto $P$?

      b) Calcular el gradiente en el punto $P$ sabiendo que la tasa máxima de
      cambio de $f$ en $P$ es 10.

      c) Siguiendo la dirección del vector $b=(-2,3)$, ¿cuál es la velocidad de
      cambio de la función en el punto $P$?

      d) Dibujar el punto $P$, la curva de nivel, y el gradiente y el vector
      $b$ en $P$.
    pide: La dirección de cambio nulo, el gradiente, la velocidad hacia b y el dibujo.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da la **curva de nivel**, no la función. ¿Basta con eso
          para contestar el apartado a)?
        opciones:
          - texto: Sí, porque la dirección de cambio nulo es la tangente a la curva de nivel
            correcta: true
            mensaje: |
              Exacto. La curva de nivel es, por definición, por donde la función
              no cambia. Su tangente en $P$ es la respuesta, y para eso basta
              derivar la ecuación de la curva.
          - texto: No; hace falta conocer f para calcular su gradiente
            mensaje: |
              Para el apartado b) hará falta un dato más —la tasa máxima—, pero
              el a) sale solo de la curva. Y de hecho el ejercicio entero se
              resuelve **sin saber quién es $f$**.
          - texto: Sí, porque la curva de nivel es perpendicular al gradiente y eso da la dirección buscada
            mensaje: |
              La perpendicular al gradiente **es** la tangente, así que la
              conclusión es correcta, pero el camino está del revés: aquí lo que
              se conoce primero es la curva, y de ella se deduce el gradiente.
      - tipo: calcular
        titulo: La pendiente de la curva de nivel en P
        pregunta: |
          Derivando $x^{2}+y=2$, o sea $y = 2-x^{2}$, ¿cuánto vale la pendiente
          en $x=-1$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              Signo cambiado. $y' = -2x$, y en $x=-1$ eso es $-2(-1) = +2$. Los
              dos negativos se cancelan.
          - valor: '1'
            mensaje: |
              1 es la coordenada $y$ del punto, no la pendiente. La pendiente
              sale de derivar la ecuación de la curva.
        pista: |
          $y = 2-x^{2}$, así que $y' = -2x$. Sustituye x = −1.
        desarrollo: |
          $$
          y = 2 - x^{2}
          \qquad\Longrightarrow\qquad
          y' = -2x
          \qquad\Longrightarrow\qquad
          y'(-1) = 2
          $$

          La dirección de cambio nulo es la del vector $(1,2)$ — o su opuesta,
          $(-1,-2)$, que sirve igual.
      - tipo: calcular
        titulo: La primera componente del gradiente
        pregunta: |
          El gradiente es perpendicular a $(1,2)$ y su módulo vale 10. Tomando
          la rama con primera componente positiva, ¿cuánto vale esa componente?
        respuesta:
          tipo: numero
          valor: '8.9443'
          tolerancia: 0.02
          formato: en forma exacta (4√5) o con cuatro decimales
        distractores:
          - valor: '10'
            mensaje: |
              10 es el **módulo** del gradiente, no una de sus componentes. Hay
              que repartirlo entre las dos según la dirección perpendicular.
          - valor: '4.4721'
            mensaje: |
              $2\sqrt5$ es la **segunda** componente en valor absoluto. La
              perpendicular a $(1,2)$ es $(2,-1)$, y el 2 va delante.
        pista: |
          El unitario perpendicular a (1,2) es (2,−1)/√5. Multiplícalo por 10.
        desarrollo: |
          La perpendicular a $(1,2)$ es $(2,-1)$, de módulo $\sqrt5$. El
          unitario es $\left(\frac{2}{\sqrt5},\frac{-1}{\sqrt5}\right)$, y
          multiplicando por el módulo 10:

          $$
          \nabla f(-1,1) = \left(\frac{20}{\sqrt5},\,\frac{-10}{\sqrt5}\right)
          = \bigl(4\sqrt5,\; -2\sqrt5\bigr) \approx (8{,}944,\; -4{,}472)
          $$

          **Y la opuesta también cumple todo lo pedido**: el enunciado fija el
          módulo y la recta, no el sentido.
      - tipo: calcular
        titulo: La velocidad hacia el vector b
        pregunta: |
          Con $\nabla f = (4\sqrt5,\,-2\sqrt5)$ y $b=(-2,3)$ de módulo
          $\sqrt{13}$, ¿cuánto vale la derivada direccional, en valor absoluto?
        respuesta:
          tipo: numero
          valor: '8.6824'
          tolerancia: 0.03
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '31.305'
            mensaje: |
              Ese es el producto escalar **sin normalizar**: $-14\sqrt5$ en valor
              absoluto. Falta dividir entre $\lVert b\rVert = \sqrt{13}$.
          - valor: '10'
            mensaje: |
              10 es el módulo del gradiente, o sea la velocidad **máxima**. La
              derivada direccional hacia $b$ es menor en valor absoluto, y aquí
              sale $8{,}68$.
        pista: |
          $(4\sqrt5)(-2) + (-2\sqrt5)(3) = -14\sqrt5$. Divide entre √13.
        desarrollo: |
          $$
          \nabla f\cdot b = 4\sqrt5\,(-2) + (-2\sqrt5)(3) = -14\sqrt5
          $$

          $$
          D_{\vec u}f = \frac{-14\sqrt5}{\sqrt{13}} = -14\sqrt{\tfrac{5}{13}}
          \approx -8{,}68
          $$

          Y con la otra rama del gradiente, $+8{,}68$. **El control de siempre:**
          $8{,}68 < 10$, que es el módulo del gradiente. ✓
      - tipo: justificar
        pregunta: |
          Ordena la respuesta completa. Una pieza es falsa.
        piezas:
          - texto: 'a) La curva $y=2-x^{2}$ tiene pendiente 2 en $P$, así que la dirección de cambio nulo es $(1,2)$.'
          - texto: 'b) El gradiente es perpendicular a esa dirección y de módulo 10, luego $\nabla f = \pm(4\sqrt5,\,-2\sqrt5)$.'
          - texto: 'El enunciado no fija el sentido, así que **las dos ramas son solución** y hay que darlas.'
          - texto: 'c) La derivada direccional hacia $b=(-2,3)$ vale $\mp 14\sqrt{5/13}\approx \mp 8{,}68$.'
          - texto: 'b) Como la tasa máxima es 10, el gradiente es $(10,0)$.'
            trampa: true
            mensaje: |
              $(10,0)$ tiene módulo 10, sí, pero **no es perpendicular** a la
              tangente $(1,2)$: su producto escalar vale 10, no 0. El módulo
              solo fija la longitud; la dirección la fija la curva de nivel.
    resolucion: |
      **Todo el ejercicio se resuelve sin saber quién es $f$.** Ese es su
      interés: la curva de nivel y un solo dato numérico bastan.

      **a) La dirección de cambio nulo.** Es la tangente a la curva de nivel.
      Derivando $y = 2-x^{2}$:

      $$
      y'(-1) = -2(-1) = 2
      $$

      Dirección $(1,2)$, o cualquier múltiplo suyo.

      **b) El gradiente.** Es perpendicular a la curva de nivel, o sea a
      $(1,2)$. Una perpendicular es $(2,-1)$, de módulo $\sqrt5$; el unitario es
      $\frac{1}{\sqrt5}(2,-1)$. Como la tasa máxima de cambio es el **módulo**
      del gradiente:

      $$
      \boxed{\;\nabla f(-1,1) = \pm\,\frac{10}{\sqrt5}\,(2,-1) = \pm\bigl(4\sqrt5,\,-2\sqrt5\bigr)\;}
      $$

      **Las dos ramas son correctas y hay que darlas**, porque el enunciado fija
      la recta y la longitud pero no hacia qué lado crece la función.

      **c) La velocidad hacia $b=(-2,3)$**, normalizando:

      $$
      D_{\vec u}f(-1,1) = \frac{\nabla f\cdot b}{\lVert b\rVert}
      = \frac{\mp 14\sqrt5}{\sqrt{13}} \approx \mp 8{,}68
      $$

      **d) El dibujo.** La curva de nivel es la parábola $y=2-x^{2}$, con las
      ramas hacia abajo y vértice en $(0,2)$; $P(-1,1)$ está en su rama
      izquierda. El gradiente sale perpendicular a la parábola en $P$, y el
      vector $b=(-2,3)$ apunta hacia arriba y a la izquierda.

      > **El control que cierra el ejercicio.** La derivada direccional tiene
      > que estar entre $-10$ y $10$, que es el módulo del gradiente. Sale
      > $8{,}68$: dentro. Y es bastante grande, lo que dice que $b$ está bastante
      > alineado con el gradiente — coherente con el dibujo.

  - id: ex2425-4ev-2-cono-y-paraboloide-invertidos
    titulo: El sólido entre un cono y un paraboloide, boca abajo
    fuente: >-
      Ejercicio 2 · Cuarta evaluación, 24 de marzo de 2025 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp2: 6
      comp4: 4
    enunciado: |
      Sea $S$ el sólido definido por las condiciones $x^{2}+y^{2}\le z^{2}$,
      $x^{2}+y^{2}\le 6+z$, $z\le 0$.

      a) Dibujar el sólido $S$.
      b) Calcular el volumen de $S$.
      c) Calcular el área de la superficie de $S$.
    pide: El dibujo del sólido, su volumen y el área de su superficie.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con $z\le 0$, ¿qué parte del cono $x^{2}+y^{2}= z^{2}$ interviene?
        opciones:
          - texto: La hoja de abajo, donde z = −ρ
            correcta: true
            mensaje: |
              Sí. El cono tiene dos hojas; la condición $z\le 0$ se queda con la
              inferior, y ahí $z = -\rho$ en cilíndricas.
          - texto: La hoja de arriba, donde z = ρ
            mensaje: |
              Esa tiene $z\ge 0$, que la tercera condición excluye. El sólido
              está entero por debajo del plano horizontal.
          - texto: Las dos, porque el cono es simétrico
            mensaje: |
              Es simétrico, pero $z\le 0$ corta esa simetría y deja solo la
              mitad de abajo.
      - tipo: calcular
        titulo: Dónde se cortan las dos superficies
        pregunta: |
          Igualando $z^{2} = 6+z$ y quedándose con la raíz que cumple $z\le 0$,
          ¿cuánto vale $z$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              3 es la otra raíz de $z^{2}-z-6=0$, pero es positiva y la tercera
              condición del enunciado la excluye.
          - valor: '-3'
            mensaje: |
              Signo mal. Factorizando, $z^{2}-z-6 = (z-3)(z+2)$, así que las
              raíces son $3$ y $-2$.
        pista: |
          $z^2 - z - 6 = 0$ factoriza como (z−3)(z+2).
        desarrollo: |
          $$
          z^{2} = 6+z
          \;\Longrightarrow\;
          (z-3)(z+2)=0
          \;\Longrightarrow\;
          z = -2
          $$

          A esa altura, $\rho^{2} = z^{2} = 4$, o sea $\rho=2$: la sombra del
          sólido es el círculo de radio 2.
      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Integrando en cilíndricas, el volumen sale $\frac{32\pi}{3}$. ¿Cuánto
          vale con cuatro decimales?
        respuesta:
          tipo: numero
          valor: '33.5103'
          tolerancia: 0.03
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '25.1327'
            mensaje: |
              $8\pi$ saldría de olvidar uno de los dos términos de la altura. La
              altura en cada punto es cono menos paraboloide, y los dos aportan.
          - valor: '16.755'
            mensaje: |
              $16\pi/3$ es la mitad. Comprueba el reparto de la integral: los
              tres términos de $-\rho^{2}-\rho^{3}+6\rho$ dan $-8/3$, $-4$ y $12$.
        pista: |
          $32\pi/3$, con pi = 3,14159...
        desarrollo: |
          La altura en cada punto de la sombra es **el cono menos el
          paraboloide**:

          $$
          h(\rho) = (-\rho) - (\rho^{2}-6) = 6-\rho-\rho^{2}
          $$

          $$
          V = \int_{0}^{2\pi}\!\!\int_{0}^{2}\bigl(6-\rho-\rho^{2}\bigr)\rho\;d\rho\,d\theta
          = 2\pi\left(12 - \tfrac{8}{3} - 4\right) = \frac{32\pi}{3}
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'a) Es una lente boca abajo: por arriba la hoja inferior del cono, por abajo el paraboloide $z=\rho^{2}-6$.'
          - texto: 'Se cortan en $z=-2$, donde $\rho=2$: la sombra es el círculo de radio 2.'
          - texto: 'b) La altura es $(-\rho)-(\rho^{2}-6)$, y el volumen sale $32\pi/3$.'
          - texto: 'c) El área son **dos** trozos, el del cono y el del paraboloide, cada uno con su elemento de superficie.'
          - texto: 'b) En $\rho=0$ el sólido tiene altura nula, porque el vértice del cono está en el origen.'
            trampa: true
            mensaje: |
              Al revés: en $\rho=0$ el sólido es **más alto** que en ningún sitio.
              El cono vale 0 y el paraboloide $-6$, así que la altura es 6. Donde
              la altura se anula es en el borde, en $\rho=2$.
    resolucion: |
      **a) El sólido.** Todo por debajo del plano $z=0$. La tapa de arriba es la
      **hoja inferior del cono**, $z=-\rho$, que baja desde el origen; la de
      abajo es el **paraboloide** $z = \rho^{2}-6$, con el vértice en $z=-6$.
      Entre las dos queda una lente apuntando hacia abajo.

      **El borde.** Igualando $z^{2}=6+z$ con $z\le 0$:

      $$
      z = -2,
      \qquad \rho^{2} = 4,
      \qquad \rho = 2
      $$

      **b) El volumen.** La altura en cada punto de la sombra:

      $$
      h(\rho) = (-\rho) - (\rho^{2}-6) = 6 - \rho - \rho^{2}
      $$

      que vale 6 en el eje y 0 en el borde, como tiene que ser.

      $$
      V = 2\pi\int_{0}^{2}\bigl(6\rho - \rho^{2} - \rho^{3}\bigr)d\rho
      = 2\pi\left(12 - \frac{8}{3} - 4\right)
      = \boxed{\frac{32\pi}{3} \approx 33{,}51}
      $$

      **c) El área**, que son **dos** superficies curvas y hay que enumerarlas
      antes de integrar.

      Del **cono**, con $z=-\sqrt{x^{2}+y^{2}}$, el elemento es $\sqrt2$:

      $$
      A_{\text{cono}} = \sqrt2\int_{0}^{2\pi}\!\!\int_{0}^{2}\rho\,d\rho\,d\theta
      = 4\sqrt2\,\pi \approx 17{,}77
      $$

      Del **paraboloide**, con $z_x=2x$ y $z_y=2y$, el elemento es
      $\sqrt{1+4\rho^{2}}$:

      $$
      A_{\text{par}} = \int_{0}^{2\pi}\!\!\int_{0}^{2}\sqrt{1+4\rho^{2}}\;\rho\,d\rho\,d\theta
      = \frac{\pi}{6}\bigl(17\sqrt{17}-1\bigr) \approx 36{,}18
      $$

      $$
      \boxed{\;A = 4\sqrt2\,\pi + \frac{\pi}{6}\bigl(17\sqrt{17}-1\bigr) \approx 53{,}95\;}
      $$

      > **Lo que separa el volumen del área.** El volumen es **una** integral
      > sobre la sombra, con la diferencia de alturas. El área obliga a recorrer
      > **cada superficie por separado**, con su propio elemento. Enumerar los
      > trozos antes de empezar es lo que evita dejarse uno — y aquí, con COMP4
      > valiendo 4 de 10, dejarse el paraboloide cuesta más que equivocarse en
      > una cuenta.
