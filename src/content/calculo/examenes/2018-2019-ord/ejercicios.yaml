        <text class="cuc19-et" x="94.5" y="148.5" text-anchor="end">ρ = 3</text>
      </svg>
      <figcaption>
      La sección meridiana. Al girarla alrededor del eje vertical sale el
      sólido: cono de 45 grados desde el origen, cerrado arriba por el casquete
      de la esfera de radio 3.
      </figcaption>
      </figure>

      **Por qué esféricas.** Porque las dos condiciones se convierten en
      **rangos constantes**: la esfera fija $\rho\le3$ y el cono fija
      $\varphi\le\frac\pi4$, sin que ninguna dependa de la otra. Cuando eso pasa,
      la integral triple se parte en tres integrales de una variable.

      $$
      V=\int_{0}^{2\pi}\!\!\int_{0}^{\pi/4}\!\!\int_{0}^{3}
      \rho^{2}\operatorname{sen}\varphi\,d\rho\,d\varphi\,d\theta
      =2\pi\cdot 9\cdot\left(1-\frac{\sqrt2}{2}\right)
      =9\pi\left(2-\sqrt2\right)\approx16{,}56
      $$

      **b) El área, que son dos trozos y ninguna tapa plana.**

      $$
      A_{\text{casquete}}=2\pi R^{2}\left(1-\cos\frac\pi4\right)
      =9\pi\left(2-\sqrt2\right)\approx16{,}56
      $$

      $$
      A_{\text{cono}}=\pi\cdot\underbrace{3\operatorname{sen}\tfrac\pi4}_{\text{radio}}
      \cdot\underbrace{3}_{\text{generatriz}}=\frac{9\pi}{\sqrt2}\approx19{,}99
      $$

      $$
      A=18\pi-\frac{9\sqrt2\pi}{2}\approx36{,}56
      $$

      **Dos comprobaciones que salen gratis.**

      El volumen y el área del casquete dan **el mismo número**, y no es
      casualidad: para todo sector esférico $V=\frac{R}{3}A_{\text{casquete}}$,
      y aquí $R=3$. Si en tu hoja esos dos números no coinciden con $R=3$, hay
      un error en alguno de los dos.

      Y de sentido: la media bola de radio $3$ vale $\frac23\pi 27\approx56{,}5$,
      y el cucurucho se lleva $16{,}56$, algo menos de un tercio. Con un
      semiángulo de $45^{\circ}$ —la mitad del ángulo disponible— y el peso del
      seno concentrado cerca del ecuador, quedarse por debajo del tercio es lo
      esperable.

  - id: ex1819-ord-6-el-pez-de-bertalanffy
    titulo: Un pez que crece cada vez más despacio
    fuente: >-
      Ejercicio 2 del SEGUNDO CUATRIMESTRAL · Convocatoria ordinaria, 29 de mayo
      de 2019 · Cálculo, UPV/EHU · El enunciado original lleva una ilustración
      decorativa de peces que no se reproduce (§08) · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      El modelo de *Bertalanffy* se utiliza con frecuencia para predecir el
      tamaño de los peces. Según este modelo, la velocidad de crecimiento del
      pez es proporcional a la diferencia entre la longitud máxima ($A$) y la
      longitud actual. Sabiendo que la longitud inicial del pez es $L_{0}$,
      obtener la longitud del pez en el instante $t_{1}$.
    pide: La longitud en función del tiempo, y su valor en el instante pedido.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué ecuación diferencial traduce el enunciado?
        opciones:
          - texto: $L'(t)=k\left(A-L(t)\right)$, con $k>0$
            correcta: true
            mensaje: |
              Eso es: «velocidad proporcional a la diferencia entre la máxima y
              la actual». El signo de $k$ importa y hay que decirlo: positivo,
              porque mientras el pez sea más corto que $A$ tiene que crecer.
          - texto: $L'(t)=kL(t)$
            mensaje: |
              Ese es el crecimiento exponencial puro, donde el pez crecería sin
              límite y cada vez más deprisa. El enunciado dice justo lo
              contrario: cuanto más cerca de $A$, más despacio.
          - texto: $L'(t)=k\left(L(t)-A\right)$
            mensaje: |
              Es la misma ecuación con el signo cambiado, y describe un pez que
              **encoge** alejándose de $A$. Con $L_{0}<A$ la diferencia
              $L-A$ es negativa, así que $L'<0$: el modelo se va al revés.

      - tipo: calcular
        titulo: La longitud al cabo de un rato
        pregunta: |
          Supongamos $A=60$ cm, $L_{0}=5$ cm y $k=0{,}4$ años$^{-1}$. ¿Cuánto
          mide el pez a los 3 años?
        respuesta:
          tipo: numero
          valor: '43.4343'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales, en cm
        distractores:
          - valor: '16.6006'
            mensaje: |
              Eso es $L_{0}e^{kt}$, el crecimiento exponencial. Es el modelo
              equivocado: ese pez seguiría creciendo sin límite y aquí hay un
              techo.
          - valor: '41.9285'
            mensaje: |
              Eso es $A\left(1-e^{-kt}\right)$: has resuelto la ecuación con
              $L_{0}=0$. La condición inicial entra en el coeficiente, que es
              $A-L_{0}$ y no $A$.
          - valor: '58.4941'
            mensaje: |
              Eso es $A-L_{0}e^{-kt}$: has puesto $L_{0}$ donde va $A-L_{0}$.
              Compruébalo en $t=0$: esa fórmula daría $60-5=55$ cm, no los $5$
              del enunciado.
        pista: |
          Separa variables: $\frac{dL}{A-L}=k\,dt$, e impón $L(0)=L_{0}$.
        desarrollo: |
          $$
          \frac{dL}{A-L}=k\,dt
          \;\Longrightarrow\;
          -\ln\left|A-L\right|=kt+C
          \;\Longrightarrow\;
          A-L=Ke^{-kt}
          $$

          Con $L(0)=L_{0}$ sale $K=A-L_{0}$, de modo que

          $$
          L(t)=A-\left(A-L_{0}\right)e^{-kt}
          $$

          $$
          L(3)=60-55\,e^{-1{,}2}\approx60-16{,}566=43{,}434
          $$

      - tipo: calcular
        titulo: Cuándo llega a la mitad de su talla máxima
        pregunta: |
          Con esos mismos datos, ¿en qué instante mide el pez $30$ cm?
        respuesta:
          tipo: numero
          valor: '1.5153'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales, en años
        distractores:
          - valor: '1.7329'
            mensaje: |
              Eso es $\frac{\ln 2}{k}$, el tiempo en que se **reduce a la mitad**
              la distancia a $A$ contada desde $A$. Aquí el pez no parte de
              cero: parte de $5$, así que la distancia inicial es $55$ y hay que
              recorrer hasta $30$, no hasta la mitad de $55$.
          - valor: '3.0343'
            mensaje: |
              El doble de la respuesta. Probablemente has usado $2k$ o has
              olvidado que el $0{,}4$ ya está en el exponente.
          - valor: '0.6061'
            mensaje: |
              Eso es $\ln\frac{55}{30}$ sin dividir entre $k$. El exponente es
              $-kt$, así que al despejar hay que repartir el $0{,}4$.
        pista: |
          $30=60-55e^{-0{,}4t}$, y de ahí $e^{-0{,}4t}=\frac{30}{55}$.
        desarrollo: |
          $$
          30=60-55e^{-0{,}4t}
          \;\Longrightarrow\;
          e^{-0{,}4t}=\frac{30}{55}
          \;\Longrightarrow\;
          t=\frac{\ln\frac{55}{30}}{0{,}4}\approx1{,}5153
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              «Velocidad proporcional a la diferencia entre la máxima y la
              actual» se escribe $L'=k(A-L)$ con $k>0$, y la condición inicial
              es $L(0)=L_{0}$.
          - texto: >-
              Es de variables separables: $\frac{dL}{A-L}=k\,dt$, y al integrar
              queda $A-L=Ke^{-kt}$.
          - texto: >-
              La condición inicial da $K=A-L_{0}$, así que
              $L(t)=A-\left(A-L_{0}\right)e^{-kt}$ y
              $L(t_{1})=A-\left(A-L_{0}\right)e^{-kt_{1}}$.
          - texto: >-
              Como la longitud tiende a $A$, el pez alcanza la longitud máxima
              en un tiempo finito.
            trampa: true
            mensaje: |
              Nunca la alcanza: $e^{-kt}>0$ para todo $t$, así que $L(t)<A$
              siempre. $A$ es una **asíntota**, no un valor que se toca. Es una
              propiedad del modelo, no del pez, y merece decirse: si la pregunta
              fuera «cuándo mide exactamente $A$», la respuesta honesta es que
              el modelo no lo predice.
    resolucion: |
      **Del enunciado a la ecuación.** El modelo dice una sola cosa, y hay que
      traducirla con cuidado: la velocidad es proporcional a **lo que le falta**
      para llegar al máximo.

      $$
      \frac{dL}{dt}=k\left(A-L\right),
      \qquad L(0)=L_{0},
      \qquad k>0
      $$

      El signo de $k$ forma parte de la respuesta: si fuera negativo el pez
      encogería, y el enunciado habla de crecimiento.

      **La resolución.** Variables separables:

      $$
      \frac{dL}{A-L}=k\,dt
      \;\Longrightarrow\;
      -\ln\left|A-L\right|=kt+C
      \;\Longrightarrow\;
      A-L=Ke^{-kt}
      $$

      Con $t=0$: $A-L_{0}=K$. Por tanto

      $$
      \boxed{\;L(t)=A-\left(A-L_{0}\right)e^{-kt}\;}
      \qquad\text{y}\qquad
      L(t_{1})=A-\left(A-L_{0}\right)e^{-kt_{1}}
      $$

      **Cómo comprobar que la fórmula es la buena, sin números.** Dos
      preguntas:

      - ¿$L(0)=L_{0}$? Sí: $A-(A-L_{0})=L_{0}$ ✓.
      - ¿$L\to A$ cuando $t\to\infty$? Sí, porque $e^{-kt}\to0$ ✓.

      Cualquier variante equivocada —$A-L_{0}e^{-kt}$, $A(1-e^{-kt})$,
      $L_{0}e^{kt}$— falla al menos una de las dos, y comprobarlo cuesta diez
      segundos.

      **Lo que dice el modelo, y lo que no.** El pez se acerca a $A$ pero no lo
      alcanza nunca: $A$ es una asíntota. Y la constante $k$ no la da el
      enunciado; es un parámetro del modelo que se ajustaría con medidas. Decir
      esto es parte de la respuesta formal: el resultado depende de tres datos
      —$A$, $L_{0}$ y $k$— y solo dos están en el texto.

  - id: ex1819-ord-7-una-ecuacion-integral-por-laplace
    titulo: Una ecuación donde la incógnita está dentro de una integral
    fuente: >-
      Ejercicio 3 del SEGUNDO CUATRIMESTRAL · Convocatoria ordinaria, 29 de mayo
      de 2019 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Sea
      $$
      f(t)=1-e^{t}+2\int_{0}^{t}e^{-(t-x)}g(x)\,dx-\int_{0}^{t}f(x)\,dx
      $$
      donde $\mathcal{L}\left\{g(t)\right\}=G(s)=\dfrac{1}{s(s-1)}$. Calcular
      $f(t)$.
    pide: La función f(t).

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué propiedad convierte
          $\int_{0}^{t}e^{-(t-x)}g(x)\,dx$ en un producto?
        opciones:
          - texto: >-
              El teorema de convolución: esa integral es
              $\left(e^{-t}*g\right)(t)$, y su transformada es el producto de las
              dos transformadas
            correcta: true
            mensaje: |
              Eso es. La forma $\int_{0}^{t}h(t-x)g(x)\,dx$ es la convolución, y
              se reconoce porque los argumentos suman $t$: uno lleva $t-x$ y el
              otro $x$. Su transformada es $H(s)G(s)$, sin integrales.
          - texto: La linealidad
            mensaje: |
              La linealidad sirve para separar los cuatro sumandos, y hace falta,
              pero no dice nada de qué hacer con la integral: ahí dentro hay un
              producto de dos funciones del tiempo, y la transformada de un
              producto **no** es el producto de las transformadas.
          - texto: El teorema de traslación
            mensaje: |
              El de traslación mueve una función en el tiempo o en $s$, y aquí
              no hay ningún retraso: el $e^{-(t-x)}$ está dentro de una
              integral, acompañado. Lo que hay es una convolución.

      - tipo: calcular
        titulo: La función que dan por su transformada
        pregunta: |
          ¿Cuánto vale $g(1)$?
        respuesta:
          tipo: numero
          valor: '1.7182818'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '2.7182818'
            mensaje: |
              Eso es $e$, o sea $g=e^{t}$, que tendría transformada
              $\frac{1}{s-1}$. La que dan lleva además un $s$ abajo, y dividir
              entre $s$ es **integrar**: $\int_{0}^{t}e^{x}dx=e^{t}-1$.
          - valor: '0.3678794'
            mensaje: |
              $e^{-1}$ correspondería a $\frac{1}{s+1}$. Cuidado con el signo del
              polo: $\frac{1}{s-1}$ da $e^{+t}$.
          - valor: '1'
            mensaje: |
              Uno sería $g\equiv1$, con transformada $\frac1s$. Falta el factor
              $\frac{1}{s-1}$, que es el que mete la exponencial.
        pista: |
          $\frac{1}{s(s-1)}=\frac{1}{s-1}-\frac1s$.
        desarrollo: |
          $$
          G(s)=\frac{1}{s(s-1)}=\frac{1}{s-1}-\frac{1}{s}
          \;\Longrightarrow\;
          g(t)=e^{t}-1
          $$

          $$
          g(1)=e-1\approx1{,}7183
          $$

      - tipo: calcular
        titulo: La solución, en un punto
        pregunta: |
          ¿Cuánto vale $f(1)$?
        respuesta:
          tipo: numero
          valor: '-0.3678794'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.3678794'
            mensaje: |
              Signo. Al despejar sale $F(s)=-\frac{1}{(s+1)^{2}}$, con el menos
              delante: $f(t)=-t\,e^{-t}$, que es negativa para todo $t>0$.
          - valor: '-0.1353353'
            mensaje: |
              Eso es $-e^{-2}$. Cuidado con el exponente: $f(t)=-te^{-t}$, y en
              $t=1$ el factor es $e^{-1}$, no $e^{-2}$.
          - valor: '-1'
            mensaje: |
              Parece $-t$ sin la exponencial. El denominador $(s+1)^{2}$
              antitransforma a $t\,e^{-t}$: el cuadrado da la $t$ y el $+1$ da la
              exponencial decreciente.
        pista: |
          Transforma los cuatro sumandos y despeja $F(s)$; el numerador y el
          denominador comparten un factor $s-1$.
        desarrollo: |
          Transformando término a término, con
          $\mathcal{L}\left\{\int_{0}^{t}f\right\}=\frac{F(s)}{s}$:

          $$
          F=\frac1s-\frac{1}{s-1}+\frac{2}{s+1}\cdot\frac{1}{s(s-1)}-\frac{F}{s}
          $$

          $$
          F\,\frac{s+1}{s}
          =-\frac{1}{s(s-1)}+\frac{2}{s(s+1)(s-1)}
          =\frac{1-s}{s(s-1)(s+1)}
          =-\frac{1}{s(s+1)}
          $$

          $$
          F(s)=-\frac{1}{(s+1)^{2}}
          \;\Longrightarrow\;
          f(t)=-t\,e^{-t}
          $$

          $$
          f(1)=-e^{-1}\approx-0{,}36788
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\mathcal{L}\{1\}=\frac1s$, $\mathcal{L}\{e^{t}\}=\frac{1}{s-1}$,
              la integral de convolución transforma a
              $\frac{1}{s+1}G(s)$ y la última integral a $\frac{F(s)}{s}$.
          - texto: >-
              Agrupando los términos con $F$ queda
              $F\left(1+\frac1s\right)=\frac1s-\frac{1}{s-1}+
              \frac{2}{s(s+1)(s-1)}$.
          - texto: >-
              El segundo miembro se simplifica a $-\frac{1}{s(s+1)}$, así que
              $F=-\frac{1}{(s+1)^{2}}$ y $f(t)=-t\,e^{-t}$.
          - texto: >-
              El término $\int_{0}^{t}f(x)\,dx$ transforma a $s\,F(s)$.
            trampa: true
            mensaje: |
              Al revés: **integrar divide** entre $s$, y derivar multiplica.
              $\mathcal{L}\left\{\int_{0}^{t}f\right\}=\frac{F(s)}{s}$. Con el
              signo cambiado la ecuación queda
              $F(1+s)=\cdots$ en vez de $F\frac{s+1}{s}=\cdots$, y la respuesta
              sale con un factor $s$ de más, que es una delta y no una función.
    resolucion: |
      **Qué tipo de problema es.** No es una ecuación diferencial: es una
      **ecuación integral**, con la incógnita $f$ dentro de una integral. Y ese
      es exactamente el terreno donde Laplace gana, porque convierte tanto las
      integrales como las convoluciones en álgebra.

      **Las cuatro traducciones.**

      | término | transformada | por qué |
      |---|---|---|
      | $1$ | $\frac1s$ | tabla |
      | $-e^{t}$ | $-\frac{1}{s-1}$ | tabla |
      | $2\int_{0}^{t}e^{-(t-x)}g(x)dx$ | $\frac{2}{s+1}G(s)$ | convolución |
      | $-\int_{0}^{t}f(x)dx$ | $-\frac{F(s)}{s}$ | integrar divide entre $s$ |

      La tercera es la que hay que reconocer: los argumentos $t-x$ y $x$ suman
      $t$, y eso es la firma de una convolución.

      **El álgebra.** Con $G(s)=\frac{1}{s(s-1)}$:

      $$
      F\left(1+\frac1s\right)
      =\frac1s-\frac{1}{s-1}+\frac{2}{s(s+1)(s-1)}
      $$

      Los dos primeros se juntan en $-\frac{1}{s(s-1)}$, y sobre el denominador
      común $s(s-1)(s+1)$:

      $$
      \frac{-(s+1)+2}{s(s-1)(s+1)}
      =\frac{1-s}{s(s-1)(s+1)}
      =-\frac{1}{s(s+1)}
      $$

      El factor $s-1$ se cancela, que es lo que hace este ejercicio
      resoluble a mano. Y entonces

      $$
      F(s)\cdot\frac{s+1}{s}=-\frac{1}{s(s+1)}
      \;\Longrightarrow\;
      F(s)=-\frac{1}{(s+1)^{2}}
      $$

      $$
      \boxed{\;f(t)=-t\,e^{-t}\;}
      $$

      **La comprobación barata.** En $t=0$ la ecuación original da
      $f(0)=1-1+0-0=0$, y en efecto $-0\cdot e^{0}=0$ ✓. Además $f$ es negativa
      para $t>0$, lo que encaja con que el término dominante del segundo miembro
      sea $-e^{t}$.

      **El detalle que más puntos cuesta:** confundir $\frac{F(s)}{s}$ con
      $sF(s)$. Integrar divide, derivar multiplica; y si se equivoca el sentido,
      aparece un $s$ suelto en el numerador que ya no antitransforma a ninguna
      función ordinaria.

  - id: ex1819-ord-8-el-diente-de-sierra-con-media-onda-nula
    titulo: Una rampa, media onda plana, y otra vez pi al cuadrado partido por ocho
    fuente: >-
      Ejercicio 4 del SEGUNDO CUATRIMESTRAL · Convocatoria ordinaria, 29 de mayo
      de 2019 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea $f(t)$ la función periódica de periodo $2\pi$ definida de la siguiente
      forma:

      $$
      f(t)=
      \begin{cases}
      0 & -\pi<t<0\\[2pt]
      t & 0\le t<\pi
      \end{cases}
      $$

      a) Dibujar la función $f(t)$ y calcular la serie de Fourier, $S(t)$.

      b) Calcular los valores de $S(t)$ y $f(t)$ en los puntos $t=0$ y
      $t=-\pi$.

      c) Calcular la suma de la serie
      $\displaystyle\sum_{n=1}^{\infty}\frac{1}{(2n-1)^{2}}$.
    pide: El dibujo, la serie, los dos valores y la suma.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Es $f$ par, impar, o ninguna de las dos?
        opciones:
          - texto: >-
              Ninguna de las dos, así que en la serie hay senos **y** cosenos
            correcta: true
            mensaje: |
              Eso es. En $(0,\pi)$ vale $t$ y en $(-\pi,0)$ vale cero: no hay
              simetría de ningún tipo. Es lo que hace este ejercicio más largo
              que los de ampliación par o impar — hay que calcular las dos
              familias de coeficientes.
          - texto: Impar
            mensaje: |
              Impar significaría $f(-t)=-f(t)$. Aquí $f(1)=1$ y $f(-1)=0$, y
              $0\neq-1$. Lo que despista es que la rampa $t$ sí es impar, pero
              solo está puesta en media onda.
          - texto: Par
            mensaje: |
              Par significaría $f(-t)=f(t)$. Con $f(1)=1$ y $f(-1)=0$ falla. Si
              fuera par, la serie no tendría senos y el apartado a) sería la
              mitad de largo.

      - tipo: calcular
        titulo: El término constante
        pregunta: |
          ¿Cuánto vale $\dfrac{a_{0}}{2}$?
        respuesta:
          tipo: numero
          valor: '0.7853982'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.5707963'
            mensaje: |
              Ese es $a_{0}=\frac\pi2\cdot2$… en realidad $a_{0}=\frac{1}{\pi}
              \int_{0}^{\pi}t\,dt=\frac\pi2$, y el término constante es su mitad.
              Es el despiste clásico entre $a_{0}$ y $a_{0}/2$.
          - valor: '3.1415927'
            mensaje: |
              $\pi$ es el valor **máximo** de la función, no su media. La media
              de una rampa que sube de $0$ a $\pi$ en media onda y vale cero en
              la otra media es $\frac\pi4$.
          - valor: '0.3926991'
            mensaje: |
              $\frac\pi8$ es la mitad de la respuesta: has dividido una vez de
              más. La media sobre el periodo completo ya lleva el $\frac{1}{2\pi}$.
        pista: |
          Es la media de $f$ en un periodo, y la mitad del periodo aporta cero.
        desarrollo: |
          $$
          \frac{a_{0}}{2}=\frac{1}{2\pi}\int_{-\pi}^{\pi}f(t)\,dt
          =\frac{1}{2\pi}\int_{0}^{\pi}t\,dt
          =\frac{1}{2\pi}\cdot\frac{\pi^{2}}{2}=\frac{\pi}{4}
          $$

      - tipo: calcular
        titulo: El primer coeficiente en seno
        pregunta: |
          ¿Cuánto vale $b_{1}$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-1'
            mensaje: |
              Signo. $b_{n}=\frac{(-1)^{n+1}}{n}$, y para $n=1$ el exponente es
              par: $b_{1}=+1$. El que sale negativo es $b_{2}=-\frac12$.
          - valor: '0.6366198'
            mensaje: |
              $\frac2\pi$ aparece en los coeficientes de la onda cuadrada, no
              aquí. Al integrar $t\operatorname{sen}(nt)$ por partes, el término
              que sobrevive es $-\frac{\pi\cos n\pi}{n}$, y el $\pi$ se cancela
              con el $\frac1\pi$ de fuera.
          - valor: '0'
            mensaje: |
              Los $b_{n}$ no se anulan: la función no es par. Si lo fuera, el
              apartado a) sería mucho más corto.
        pista: |
          $b_{n}=\frac1\pi\int_{0}^{\pi}t\operatorname{sen}(nt)\,dt$, y se hace
          por partes.
        desarrollo: |
          $$
          b_{n}=\frac1\pi\int_{0}^{\pi}t\operatorname{sen}(nt)\,dt
          =\frac1\pi\left[-\frac{t\cos nt}{n}\right]_{0}^{\pi}
          +\frac{1}{n\pi}\int_{0}^{\pi}\cos nt\,dt
          =-\frac{\cos n\pi}{n}=\frac{(-1)^{n+1}}{n}
          $$

          El segundo trozo se anula porque
          $\int_{0}^{\pi}\cos nt\,dt=0$ para $n$ entero.

          Y los cosenos:

          $$
          a_{n}=\frac1\pi\int_{0}^{\pi}t\cos(nt)\,dt
          =\frac{(-1)^{n}-1}{\pi n^{2}}
          =\begin{cases}-\dfrac{2}{\pi n^{2}}&n\text{ impar}\\[6pt]
          0&n\text{ par}\end{cases}
          $$

      - tipo: calcular
        titulo: La suma pedida
        pregunta: |
          ¿Cuánto vale
          $\displaystyle\sum_{n=1}^{\infty}\frac{1}{(2n-1)^{2}}$?
        respuesta:
          tipo: numero
          valor: '1.2337006'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.6449341'
            mensaje: |
              $\frac{\pi^{2}}{6}$ suma **todos** los inversos de los cuadrados.
              Esta serie solo recorre los impares, y vale tres cuartas partes de
              aquella.
          - valor: '2.4674011'
            mensaje: |
              $\frac{\pi^{2}}{4}$ es el doble. Revisa el despeje: de
              $0=\frac\pi4-\frac2\pi\Sigma$ sale $\Sigma=\frac{\pi^{2}}{8}$.
          - valor: '0.6168503'
            mensaje: |
              $\frac{\pi^{2}}{16}$ es la mitad. Cuidado con el factor $\frac2\pi$
              que acompaña al sumatorio: al despejar hay que multiplicar por
              $\frac\pi2$.
        pista: |
          Evalúa la serie en $t=0$, donde la función es continua y todos los
          cosenos valen $1$.
        desarrollo: |
          En $t=0$ la función es continua —vale cero por los dos lados—, así que
          $S(0)=f(0)=0$. Los senos se anulan y los cosenos valen $1$:

          $$
          0=\frac{\pi}{4}-\frac{2}{\pi}\sum_{n=1}^{\infty}\frac{1}{(2n-1)^{2}}
          \;\Longrightarrow\;
          \sum_{n=1}^{\infty}\frac{1}{(2n-1)^{2}}=\frac{\pi^{2}}{8}
          \approx1{,}2337
          $$

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              En $t=0$ la función es continua: por la izquierda vale $0$ —el
              tramo nulo— y por la derecha también, porque la rampa arranca en
              cero.
          - texto: >-
              Por Dirichlet, en un punto de continuidad la serie converge al
              valor de la función, así que $S(0)=f(0)=0$.
          - texto: >-
              En $t=-\pi$ sí hay salto: por la izquierda el valor es $\pi$ —es el
              final de la rampa del periodo anterior— y por la derecha $0$, luego
              $S(-\pi)=\frac{\pi}{2}$.
          - texto: >-
              Y $f(-\pi)=\frac{\pi}{2}$, porque la función siempre toma en un
              salto el valor medio.
            trampa: true
            mensaje: |
              Lo que vale la semisuma es la **serie**, no la función: son cosas
              distintas y ese es justo el interés del apartado. Además, aquí
              $f(-\pi)$ **ni siquiera está definida**: el enunciado describe $f$
              en $-\pi<t<0$ y en $0\le t<\pi$, y el punto $-\pi$ queda fuera de
              los dos. Decirlo es más honesto que inventarle un valor.
    resolucion: |
      **a) El dibujo y la serie.** La función sube en línea recta de $0$ a $\pi$
      durante la primera mitad del periodo y vale cero durante la segunda.

      <figure class="figura-examen">
      <svg viewBox="0 0 360 280" role="img" width="360" height="280"
           aria-labelledby="sie19-t sie19-d">
        <title id="sie19-t">El diente de sierra con media onda nula</title>
        <desc id="sie19-d">En cada periodo la funcion sube en linea recta desde cero
        hasta pi durante la primera mitad y despues vale cero durante la segunda. El
        extremo alto de cada rampa se marca con un circulito hueco, porque ese valor
        no se alcanza, y el arranque de cada rampa con un punto lleno.</desc>
        <style>
          .sie19-eje { stroke: var(--graphite); stroke-width: 1.2; fill: none; }
          .sie19-as { stroke: var(--faint); stroke-width: 1.1; fill: none; stroke-dasharray: 5 4; }
          .sie19-c { stroke: var(--live); stroke-width: 2.6; fill: none; }
          .sie19-h { fill: var(--paper); stroke: var(--live); stroke-width: 1.6; }
          .sie19-p { fill: var(--live); }
          .sie19-n { fill: var(--faint); font-size: 11px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round; }
          .sie19-et { fill: var(--live); font-size: 13px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round; }
        </style>
        <path class="sie19-as" d="M21.8 130.8L331.6 130.8"/>
        <path class="sie19-eje" d="M21.8 225L336.9 225M150 243L150 102"/>
        <path class="sie19-c" d="M43.2 225L96.6 130.8M96.6 225L150 225M150 225L203.4 130.8M203.4 225L256.8 225M256.8 225L310.2 130.8M310.2 225L363.6 225"/>
        <circle class="sie19-h" cx="96.6" cy="130.8" r="3"/><circle class="sie19-h" cx="203.4" cy="130.8" r="3"/><circle class="sie19-h" cx="310.2" cy="130.8" r="3"/>
        <circle class="sie19-p" cx="43.2" cy="225" r="3"/><circle class="sie19-p" cx="150" cy="225" r="3"/><circle class="sie19-p" cx="256.8" cy="225" r="3"/>
        <g class="sie19-n">
          <text x="43.2" y="240" text-anchor="middle">−2π</text>
          <text x="96.6" y="240" text-anchor="middle">−π</text>
          <text x="203.4" y="240" text-anchor="middle">π</text>
          <text x="256.8" y="240" text-anchor="middle">2π</text>
          <text x="310.2" y="240" text-anchor="middle">3π</text>
          <text x="142" y="124.80000000000001" text-anchor="end">π</text>
          <text x="340.9" y="239">t</text>
        </g>
        <text class="sie19-et" x="168.7" y="117">f(t)</text>
      </svg>
      <figcaption>
      El diente de sierra con media onda nula. El extremo alto de cada rampa va
      en hueco porque el valor π no se alcanza; el arranque, en punto lleno.
      </figcaption>
      </figure>

      La función no es par ni impar, así que hay que calcular las dos familias.

      $$
      \frac{a_{0}}{2}=\frac{1}{2\pi}\int_{0}^{\pi}t\,dt=\frac{\pi}{4}
      $$

      $$
      a_{n}=\frac{1}{\pi}\int_{0}^{\pi}t\cos(nt)\,dt
      =\frac{(-1)^{n}-1}{\pi n^{2}}
      \;\Longrightarrow\;
      a_{n}=-\frac{2}{\pi n^{2}}\ (n\text{ impar}),\quad 0\ (n\text{ par})
      $$

      $$
      b_{n}=\frac{1}{\pi}\int_{0}^{\pi}t\operatorname{sen}(nt)\,dt
      =\frac{(-1)^{n+1}}{n}
      $$

      $$
      S(t)=\frac{\pi}{4}
      -\frac{2}{\pi}\sum_{k=0}^{\infty}\frac{\cos\bigl((2k+1)t\bigr)}{(2k+1)^{2}}
      +\sum_{n=1}^{\infty}\frac{(-1)^{n+1}}{n}\operatorname{sen}(nt)
      $$

      **b) Los dos puntos, que son distintos a propósito.**

      En $t=0$ **no hay salto**: la rampa arranca en cero y el tramo anterior
      vale cero. Función y serie coinciden:

      $$
      S(0)=f(0)=0
      $$

      En $t=-\pi$ **sí lo hay**: por la izquierda llega el final de la rampa,
      que vale $\pi$, y por la derecha empieza el tramo nulo. Dirichlet da la
      semisuma:

      $$
      S(-\pi)=\frac{\pi+0}{2}=\frac{\pi}{2}
      $$

      Y sobre $f(-\pi)$ conviene ser exacto: el enunciado define $f$ en
      $-\pi<t<0$ y en $0\le t<\pi$, así que **$-\pi$ no está en el dominio
      descrito**. La respuesta honesta es decirlo, no inventarle un valor.

      **c) La suma.** El apartado b) ya ha señalado el punto bueno: $t=0$, donde
      la serie **sí** vale lo que la función. Allí todos los senos se anulan y
      todos los cosenos valen $1$:

      $$
      0=\frac{\pi}{4}-\frac{2}{\pi}\sum_{n=1}^{\infty}\frac{1}{(2n-1)^{2}}
      \;\Longrightarrow\;
      \sum_{n=1}^{\infty}\frac{1}{(2n-1)^{2}}=\frac{\pi^{2}}{8}
      $$

      **La comprobación que confirma el resultado.** La suma de todos los
      inversos de los cuadrados vale $\frac{\pi^{2}}{6}$; los pares suman
      $\frac14$ de eso, o sea $\frac{\pi^{2}}{24}$; y la diferencia,
      $\frac{\pi^{2}}{6}-\frac{\pi^{2}}{24}=\frac{\pi^{2}}{8}$ ✓. Es el mismo
      número que sale en la ordinaria de 2020-2021 por otro camino, con la
      ampliación par de una recta: dos series de Fourier distintas apuntando al
      mismo sitio.
