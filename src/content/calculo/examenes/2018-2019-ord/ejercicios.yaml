ejercicios:
  - id: ex1819-ord-1-un-argumento-que-vale-noventa-grados
    titulo: Media circunferencia, y por qué solo media
    fuente: >-
      Ejercicio 1 del PRIMER CUATRIMESTRAL · Convocatoria ordinaria, 29 de mayo
      de 2019 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Calcular y representar geométricamente los afijos de los números complejos
      $z$ que verifican la siguiente condición:

      $$
      \arg\left(\frac{z+2i}{z-2i}\right)=\frac{\pi}{2}
      $$
    pide: El lugar geométrico, dibujado y con los puntos que se excluyen.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué condición sobre el cociente equivale a que su argumento valga
          $\frac\pi2$?
        opciones:
          - texto: >-
              Que sea imaginario puro **y** con parte imaginaria positiva
            correcta: true
            mensaje: |
              Eso es, y las dos mitades importan. «Imaginario puro» deja el eje
              imaginario entero, que son dos argumentos: $\frac\pi2$ hacia
              arriba y $-\frac\pi2$ hacia abajo. La condición de signo es la que
              se queda con media circunferencia en vez de con la entera.
          - texto: Que sea imaginario puro, sin más
            mensaje: |
              Eso da $\arg=\pm\frac\pi2$, es decir, la circunferencia completa.
              El enunciado pide un argumento concreto, y quedarse con la mitad
              equivocada —o con las dos— es el fallo típico de este ejercicio.
          - texto: Que su módulo valga $1$
            mensaje: |
              El módulo no dice nada del argumento. De hecho el cociente aquí
              tiene módulo $1$ justo cuando $z$ está en el eje real, que es otra
              cosa distinta.

      - tipo: calcular
        titulo: La parte imaginaria en un punto de control
        pregunta: |
          ¿Cuánto vale la parte imaginaria de
          $\dfrac{z+2i}{z-2i}$ en $z=2$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Cero es la parte **real** en ese punto, que es justo lo que hace
              que $z=2$ pertenezca al lugar. La imaginaria no se anula: si lo
              hiciera, el cociente sería cero y no tendría argumento.
          - valor: '-1'
            mensaje: |
              Signo. Con $z=2$ sale $\frac{2+2i}{2-2i}$, y multiplicando por el
              conjugado, $\frac{(2+2i)^{2}}{8}=\frac{8i}{8}=i$: parte imaginaria
              $+1$.
          - valor: '2'
            mensaje: |
              Parece que no has dividido entre el módulo al cuadrado del
              denominador, que vale $\left|2-2i\right|^{2}=8$.
        pista: |
          Multiplica arriba y abajo por el conjugado del denominador y simplifica.
        desarrollo: |
          Con $z=x+iy$, multiplicando por $\overline{z-2i}$:

          $$
          \frac{z+2i}{z-2i}
          =\frac{\left(x^{2}+y^{2}-4\right)+4xi}{x^{2}+(y-2)^{2}}
          $$

          En $z=2$ ($x=2$, $y=0$): parte real $\frac{4+0-4}{4+4}=0$ y parte
          imaginaria $\frac{8}{8}=1$. El cociente vale $i$, con argumento
          $\frac\pi2$ ✓.

      - tipo: verificar
        pregunta: |
          Escribe el lugar geométrico en $x$ e $y$. La figura comprobará si es la
          misma región que la del enunciado.
        condicion: 'arg((z+2i)/(z-2i)) = pi/2'
        ventana:
          x: [-3, 3]
          y: [-3, 3]
        formato: en x e y; usa & para juntar las dos condiciones y ^2 para los cuadrados
        pista: |
          Del cociente racionalizado, anula la parte real y exige que la
          imaginaria sea positiva.
        desarrollo: |
          $$
          \frac{z+2i}{z-2i}
          =\frac{\left(x^{2}+y^{2}-4\right)+4xi}{x^{2}+(y-2)^{2}}
          $$

          Argumento $\frac\pi2$ significa parte real nula y parte imaginaria
          positiva:

          $$
          x^{2}+y^{2}=4
          \qquad\text{y}\qquad
          x>0
          $$

          La **mitad derecha** de la circunferencia de radio $2$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Racionalizando, el cociente vale
              $\frac{\left(x^{2}+y^{2}-4\right)+4xi}{x^{2}+(y-2)^{2}}$, con
              denominador real y positivo salvo en $z=2i$.
          - texto: >-
              Que su argumento sea $\frac\pi2$ obliga a dos cosas: parte real
              nula, es decir $x^{2}+y^{2}=4$, y parte imaginaria positiva, es
              decir $x>0$.
          - texto: >-
              Los extremos $z=\pm 2i$ quedan fuera: en $2i$ el denominador se
              anula y en $-2i$ el numerador, y en ninguno de los dos hay
              argumento que valga $\frac\pi2$.
          - texto: >-
              El lugar geométrico es la circunferencia $\left|z\right|=2$
              completa.
            trampa: true
            mensaje: |
              La mitad izquierda cumple $x^{2}+y^{2}=4$ pero con $x<0$, y ahí el
              argumento vale $-\frac\pi2$, no $+\frac\pi2$. Compruébalo en
              $z=-2$: sale $\frac{-2+2i}{-2-2i}=-i$. Anular la parte real es
              solo la mitad de la condición.
    resolucion: |
      **La cuenta.** Con $z=x+iy$ y multiplicando por el conjugado del
      denominador:

      $$
      \frac{z+2i}{z-2i}
      =\frac{\bigl(x+i(y+2)\bigr)\bigl(x-i(y-2)\bigr)}{x^{2}+(y-2)^{2}}
      =\frac{\left(x^{2}+y^{2}-4\right)+4xi}{x^{2}+(y-2)^{2}}
      $$

      **La condición, en dos mitades.** $\arg w=\frac\pi2$ significa que $w$
      está en el semieje imaginario **positivo**:

      $$
      \operatorname{Re}w=0\;\Longrightarrow\;x^{2}+y^{2}=4
      $$
      $$
      \operatorname{Im}w>0\;\Longrightarrow\;4x>0\;\Longrightarrow\;x>0
      $$

      La segunda es la que se olvida, y es la que convierte una circunferencia
      en media.

      **Los extremos.** En $z=2i$ el denominador se anula y en $z=-2i$ el
      numerador: ninguno de los dos tiene argumento $\frac\pi2$, así que la
      semicircunferencia va **abierta** en sus dos puntas.

      $$
      \boxed{\;\left\{z:\left|z\right|=2,\ \operatorname{Re}z>0\right\}\;}
      $$

      <figure class="figura-examen">
      <svg viewBox="0 0 340 340" role="img" width="340" height="340"
           aria-labelledby="arc19-t arc19-d">
        <title id="arc19-t">La mitad derecha de la circunferencia de radio dos</title>
        <desc id="arc19-d">Una circunferencia de radio dos centrada en el origen,
        dibujada a trazos, y sobre ella la mitad derecha marcada con trazo grueso: es
        el lugar geometrico. Los dos extremos, en dos i y en menos dos i, llevan un
        circulito hueco porque no pertenecen a el.</desc>
        <style>
          .arc19-t { stroke: var(--graphite); stroke-width: 1.3; fill: none; stroke-dasharray: 6 5; }
          .arc19-c { stroke: var(--live); stroke-width: 3; fill: none; }
          .arc19-eje { stroke: var(--graphite); stroke-width: 1.2; fill: none; }
          .arc19-h { fill: var(--paper); stroke: var(--flag); stroke-width: 2.4; }
          .arc19-n { fill: var(--faint); font-size: 11px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
          .arc19-et { fill: var(--live); font-size: 13px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round; }
          .arc19-ef { fill: var(--flag); font-size: 12px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round; }
        </style>
        <path class="arc19-eje" d="M9 165L321 165M165 321L165 9"/>
        <circle class="arc19-t" cx="165" cy="165" r="120"/>
        <path class="arc19-c" d="M165 285A120 120 0 0 0 165 45"/>
        <circle class="arc19-h" cx="165" cy="45" r="5"/>
        <circle class="arc19-h" cx="165" cy="285" r="5"/>
        <g class="arc19-n">
          <text x="325" y="179">x</text>
          <text x="171" y="11">y</text>
          <text x="285" y="181" text-anchor="middle">2</text>
          <text x="45" y="181" text-anchor="middle">−2</text>
        </g>
        <text class="arc19-ef" x="155" y="49" text-anchor="end">2i fuera</text>
        <text class="arc19-ef" x="155" y="289" text-anchor="end">−2i fuera</text>
        <text class="arc19-et" x="165" y="316.2" text-anchor="middle">x² + y² = 4, x &gt; 0</text>
      </svg>
      <figcaption>
      La mitad derecha de la circunferencia de radio 2. Los dos extremos van en
      hueco: 2i anula el denominador y −2i el numerador.
      </figcaption>
      </figure>

      **La lectura geométrica, que es la que hay que saber.** Esto es un **arco
      capaz**: el conjunto de puntos desde los que el segmento que une $-2i$ con
      $2i$ se ve bajo un ángulo dado. Con ángulo recto, el arco capaz es la
      circunferencia que tiene ese segmento como diámetro — y aquí el segmento
      va de $-2i$ a $2i$, de longitud $4$, así que la circunferencia tiene radio
      $2$ y centro el origen. Todo cuadra, y de paso explica por qué el
      resultado sale tan redondo.

  - id: ex1819-ord-2-lagrange-y-cuando-no-se-puede-aplicar
    titulo: El teorema de Lagrange, y el caso en que no se puede usar
    fuente: >-
      Ejercicio 2 del PRIMER CUATRIMESTRAL · Convocatoria ordinaria, 29 de mayo
      de 2019 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 4
      comp4: 6
    enunciado: |
      Enunciar el teorema de Lagrange. Estudiar si el teorema puede aplicarse en
      los casos siguientes, y en caso afirmativo calcular el punto al que hace
      referencia el teorema.

      a) La función $y(x)=3\sqrt{x}-4x$ en el intervalo $\left[1,4\right]$.

      b) La función $y(x)=\dfrac{x}{x-1}$ en el intervalo $\left[-1,1\right]$.
    pide: El enunciado del teorema, y en cada caso si se aplica y dónde.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hipótesis exige el teorema de Lagrange en $[a,b]$?
        opciones:
          - texto: >-
              Continuidad en el intervalo **cerrado** y derivabilidad en el
              **abierto**
            correcta: true
            mensaje: |
              Eso es, y la asimetría no es un capricho: en los extremos solo
              hace falta que la función llegue, no que tenga tangente. Por eso
              $\sqrt{x}$ en $[0,1]$ cumple las hipótesis aunque su derivada
              reviente en el origen.
          - texto: Derivabilidad en el intervalo cerrado
            mensaje: |
              Es más de lo que hace falta, y dejaría fuera casos donde el
              teorema sí vale — como $y=\sqrt{x}$ en $[0,1]$, con derivada
              infinita en el extremo. Pedir de más no es un error inocente: hace
              descartar ejercicios que sí se resuelven.
          - texto: Continuidad en el intervalo abierto
            mensaje: |
              Es menos de lo que hace falta. Sin continuidad en los extremos, la
              función puede pegar un salto justo en el borde y la conclusión
              falla. El apartado b) de este ejercicio es exactamente ese caso.

      - tipo: calcular
        titulo: La pendiente que hay que igualar
        pregunta: |
          En el apartado a), ¿cuánto vale
          $\dfrac{y(4)-y(1)}{4-1}$?
        respuesta:
          tipo: numero
          valor: '-3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              Signo. $y(1)=3-4=-1$ e $y(4)=6-16=-10$: la función **baja**, así
              que la pendiente media es negativa.
          - valor: '-9'
            mensaje: |
              Ese es el numerador, $y(4)-y(1)=-9$. Falta dividir entre la
              longitud del intervalo, que es $3$.
          - valor: '-1'
            mensaje: |
              $-1$ es $y(1)$, no la pendiente. La pendiente media es el cociente
              de incrementos.
        pista: |
          $y(1)=3\sqrt1-4$ e $y(4)=3\sqrt4-16$.
        desarrollo: |
          $$
          y(1)=3-4=-1,\qquad y(4)=6-16=-10
          $$

          $$
          \frac{y(4)-y(1)}{4-1}=\frac{-10+1}{3}=-3
          $$

      - tipo: calcular
        titulo: El punto que da el teorema
        pregunta: |
          ¿Cuál es el $c$ del teorema en el apartado a)?
        respuesta:
          tipo: numero
          valor: '2.25'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '2.5'
            mensaje: |
              El punto medio del intervalo. El teorema no dice que $c$ esté en
              el medio: dice que existe **alguno**, y hay que encontrarlo
              resolviendo $y'(c)=-3$.
          - valor: '1.5'
            mensaje: |
              De $\frac{3}{2\sqrt c}=1$ sale $\sqrt c=\frac32$, y hay que
              elevar al cuadrado: $c=\frac94$, no $\frac32$.
          - valor: '4'
            mensaje: |
              El teorema garantiza un punto **interior**, en el abierto $(1,4)$.
              Un extremo no vale, y además $y'(4)=\frac34-4\neq-3$.
        pista: |
          $y'(x)=\frac{3}{2\sqrt x}-4$, y hay que igualarla a $-3$.
        desarrollo: |
          $$
          y'(c)=\frac{3}{2\sqrt c}-4=-3
          \;\Longrightarrow\;
          \frac{3}{2\sqrt c}=1
          \;\Longrightarrow\;
          \sqrt c=\frac32
          \;\Longrightarrow\;
          c=\frac94=2{,}25
          $$

          Y $\frac94\in(1,4)$ ✓, como tenía que ser.

      - tipo: justificar
        pregunta: Ordena el estudio del apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              El teorema exige continuidad en $[-1,1]$, y la función
              $y=\frac{x}{x-1}$ no está definida en $x=1$, que es un extremo del
              intervalo.
          - texto: >-
              Además $\lim_{x\to1^{-}}\frac{x}{x-1}=-\infty$, así que no hay
              forma de extenderla con continuidad a ese punto.
          - texto: >-
              Falla una hipótesis, luego el teorema **no se puede aplicar**, y
              no hay ningún $c$ que buscar.
          - texto: >-
              Sí se puede aplicar, porque la función es derivable en el abierto
              $(-1,1)$.
            trampa: true
            mensaje: |
              Derivable en el abierto lo es, y no basta: el teorema pide
              **también** continuidad en el cerrado, y ahí es donde falla. Que
              se cumpla una hipótesis no compensa que falle la otra. Y no es un
              tecnicismo: sin continuidad en el borde no hay siquiera un
              «$y(1)$» con el que formar la pendiente media.
    resolucion: |
      **El enunciado, que aquí vale más que la cuenta.** Este ejercicio reparte
      **4 puntos por el cálculo y 6 por la explicación**, el reparto más
      volcado hacia COMP 4 de todo el corpus. Escribir bien el teorema es más de
      la mitad de la nota:

      > Si $f$ es continua en $[a,b]$ y derivable en $(a,b)$, entonces existe
      > $c\in(a,b)$ tal que
      > $$f'(c)=\frac{f(b)-f(a)}{b-a}$$

      Las dos hipótesis son distintas a propósito: en los extremos basta con que
      la función **llegue**, no con que tenga tangente.

      **a) Sí se aplica.** $y=3\sqrt x-4x$ es continua en $[1,4]$ —el radicando
      es positivo en todo el intervalo— y derivable en $(1,4)$.

      $$
      \frac{y(4)-y(1)}{3}=\frac{-10-(-1)}{3}=-3
      $$

      $$
      y'(c)=\frac{3}{2\sqrt c}-4=-3
      \;\Longrightarrow\;
      \sqrt c=\frac32
      \;\Longrightarrow\;
      c=\frac94
      $$

      y $\frac94\in(1,4)$, como exige el teorema.

      **b) No se aplica.** En $x=1$ el denominador se anula, y $x=1$ **es un
      extremo del intervalo**. La función ni siquiera está definida ahí, y su
      límite por la izquierda es $-\infty$: no hay extensión continua posible.

      Falla la hipótesis de continuidad en el cerrado, así que no hay nada que
      calcular. Y conviene decir por qué no basta con la derivabilidad en el
      abierto: sin $y(1)$ no existe siquiera la pendiente media que el teorema
      iguala.

      **Lo que este ejercicio evalúa de verdad.** No es despejar una raíz: es
      saber que un teorema con hipótesis se comprueba **antes** de usarlo, y
      que cuando una falla la respuesta correcta es «no se puede aplicar», no
      un número. El apartado b) está puesto ahí para separar a quien verifica de
      quien deriva por inercia.

  - id: ex1819-ord-3-la-serie-de-equis-por-seno
    titulo: Solo potencias pares, y una derivada veinticuatro de dos dígitos
    fuente: >-
      Ejercicio 3 del PRIMER CUATRIMESTRAL · Convocatoria ordinaria, 29 de mayo
      de 2019 · Cálculo, UPV/EHU · Es casi el mismo ejercicio que el 3 b) y c)
      de la ordinaria de 2021-2022, con x·sen x en lugar de x²·sen x ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      a) Calcular el desarrollo en serie de McLaurin de la función
      $f(x)=x\operatorname{sen}x$.

      b) Calcular $f^{24)}(0)$ y $f^{25)}(0)$.
    pide: La serie y las dos derivadas en el origen.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué en la serie de $x\operatorname{sen}x$ solo aparecen potencias
          pares?
        opciones:
          - texto: >-
              Porque $x\operatorname{sen}x$ es **par**: producto de dos funciones
              impares
            correcta: true
            mensaje: |
              Eso es, y da una comprobación gratis: una función par solo puede
              tener potencias pares en su desarrollo, así que todas las
              derivadas de orden impar se anulan en el origen sin calcular nada.
          - texto: >-
              Porque $\operatorname{sen}x$ solo tiene potencias impares
            mensaje: |
              Es cierto, pero por sí solo no explica nada: podría multiplicarse
              por algo que las dejara impares. Lo que decide es que el otro
              factor, $x$, también sea impar, y que impar por impar dé par.
          - texto: Porque $x^{2}$ es par
            mensaje: |
              Aquí el factor es $x$, no $x^{2}$ — ese es el ejercicio de la
              ordinaria de 2021-2022, que es casi este. La paridad del producto
              sale igual, pero conviene mirar qué función se tiene delante.

      - tipo: calcular
        titulo: El coeficiente de cuarto grado
        pregunta: |
          ¿Cuál es el coeficiente de $x^{4}$ en el desarrollo?
        respuesta:
          tipo: numero
          valor: '-0.1666667'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.1666667'
            mensaje: |
              Signo. La serie del seno alterna, y el término $-\frac{x^{3}}{3!}$
              multiplicado por $x$ deja $-\frac{x^{4}}{6}$.
          - valor: '-0.0416667'
            mensaje: |
              $-\frac{1}{24}$ sale de usar $4!$ en el denominador. El factorial
              que toca es el del seno, $3!=6$, porque el término venía de
              $-\frac{x^{3}}{3!}$.
          - valor: '-1'
            mensaje: |
              Te falta el factorial entero. La serie del seno es
              $x-\frac{x^{3}}{3!}+\cdots$, no $x-x^{3}+\cdots$.
        pista: |
          $\operatorname{sen}x=x-\frac{x^{3}}{3!}+\frac{x^{5}}{5!}-\cdots$, y todo
          se multiplica por $x$.
        desarrollo: |
          $$
          f(x)=x\left(x-\frac{x^{3}}{3!}+\frac{x^{5}}{5!}-\cdots\right)
          =x^{2}-\frac{x^{4}}{6}+\frac{x^{6}}{120}-\cdots
          =\sum_{k=0}^{\infty}\frac{(-1)^{k}x^{2k+2}}{(2k+1)!}
          $$

      - tipo: calcular
        titulo: La derivada veinticuatro
        pregunta: |
          ¿Cuánto vale $f^{24)}(0)$?
        respuesta:
          tipo: numero
          valor: '-24'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '24'
            mensaje: |
              Signo. El exponente $24$ corresponde a $2k+2=24$, o sea $k=11$, y
              $(-1)^{11}=-1$.
          - valor: '0'
            mensaje: |
              Cero es $f^{25)}(0)$: el $25$ es impar y la función es par, así que
              en la serie no hay término en $x^{25}$. El $24$ sí existe.
          - valor: '-552'
            mensaje: |
              $552=24\cdot23$, así que has dividido entre $22!$. El factorial
              del coeficiente es el de la serie del seno,
              $(2k+1)!$ con $k=11$, o sea $23!$, y entonces
              $\frac{24!}{23!}=24$ a secas.
        pista: |
          Resuelve $2k+2=24$ y usa que el coeficiente de $x^{n}$ vale
          $\frac{f^{n)}(0)}{n!}$.
        desarrollo: |
          $$
          2k+2=24\;\Longrightarrow\;k=11
          \;\Longrightarrow\;
          \text{coeficiente}=\frac{(-1)^{11}}{23!}=-\frac{1}{23!}
          $$

          $$
          f^{24)}(0)=24!\cdot\left(-\frac{1}{23!}\right)=-24
          $$

          Y $f^{25)}(0)=0$, porque no hay término en $x^{25}$.

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              La serie es $\sum_{k\ge0}\frac{(-1)^{k}}{(2k+1)!}x^{2k+2}$: solo
              exponentes pares, desde el $2$.
          - texto: >-
              Por unicidad del desarrollo, el coeficiente de $x^{n}$ vale
              $\frac{f^{n)}(0)}{n!}$, así que basta localizar el término y
              despejar.
          - texto: >-
              Para $n=25$ no hay término, luego $f^{25)}(0)=0$; para $n=24$ el
              coeficiente es $-\frac{1}{23!}$ y $f^{24)}(0)=-\frac{24!}{23!}=-24$.
          - texto: >-
              Como el coeficiente de $x^{24}$ es minúsculo, del orden de
              $10^{-23}$, la derivada también lo es.
            trampa: true
            mensaje: |
              Justo al revés: el factorial que hay que deshacer es enorme. El
              coeficiente vale $-\frac{1}{23!}\approx-3{,}9\cdot10^{-23}$ y al
              multiplicarlo por $24!$ queda $-24$, un número de dos cifras. Si
              tu respuesta sale del orden de $10^{-23}$, te has dejado el
              $n!$ — y es el error más frecuente de este ejercicio.
    resolucion: |
      **a) La serie, sin derivar.** Se toma la del seno y se multiplica por $x$:

      $$
      f(x)=x\operatorname{sen}x
      =x^{2}-\frac{x^{4}}{3!}+\frac{x^{6}}{5!}-\cdots
      =\sum_{k=0}^{\infty}\frac{(-1)^{k}}{(2k+1)!}\,x^{2k+2}
      $$

      válida para todo $x$, porque la del seno lo es.

      Antes de seguir, una observación que ahorra medio apartado: $x$ es impar y
      $\operatorname{sen}x$ es impar, así que el producto es **par**. Una
      función par no tiene potencias impares, y por tanto **todas** sus
      derivadas de orden impar se anulan en el origen.

      **b) Las dos derivadas.**

      - $f^{25)}(0)=0$, por lo que se acaba de decir: $25$ es impar.
      - Para el $24$: $2k+2=24$ da $k=11$, con coeficiente
        $\frac{(-1)^{11}}{23!}$, de modo que

      $$
      f^{24)}(0)=24!\cdot\left(-\frac{1}{23!}\right)=-24
      $$

      **Por qué el resultado es tan pequeño.** El coeficiente es
      $-3{,}9\cdot10^{-23}$ y la derivada es $-24$: la diferencia es el $24!$.
      Merece la pena tenerlo presente porque es el error que más se comete aquí,
      y porque explica algo del método: los coeficientes de una serie de Taylor
      son diminutos precisamente porque llevan el factorial dividiendo.

      **Y un atajo para comprobarlo.** $\frac{24!}{23!}=24$. Siempre que el
      término buscado esté una unidad por encima del factorial del coeficiente,
      la respuesta es ese número a secas. Aquí sale $-24$; en el ejercicio
      gemelo de 2021-2022, con $x^{2}\operatorname{sen} x$, sale $-25\cdot24=-600$, porque
      allí la diferencia es de dos unidades.

  - id: ex1819-ord-4-un-cambio-y-despues-unas-partes
    titulo: Un cambio que deja la integral hecha a medias
    fuente: >-
      Ejercicio 4 del PRIMER CUATRIMESTRAL · Convocatoria ordinaria, 29 de mayo
      de 2019 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 9
      comp4: 1
    enunciado: |
      Calcular
      $\displaystyle\int\frac{2x\ln(1+x^{2})}{\left(1+x^{2}\right)^{2}}\,dx$
    pide: Una primitiva.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué cambio de variable conviene?
        opciones:
          - texto: >-
              $u=1+x^{2}$, porque $du=2x\,dx$ y ese $2x$ ya está en el numerador
            correcta: true
            mensaje: |
              Eso es. El $2x$ del numerador no está de adorno: es exactamente la
              diferencial del paréntesis que aparece dos veces. Con el cambio, la
              integral se convierte en $\int\frac{\ln u}{u^{2}}du$, que ya no
              tiene rastro de $x$.
          - texto: $u=\ln(1+x^{2})$
            mensaje: |
              Se puede intentar, pero $du=\frac{2x}{1+x^{2}}dx$ y al sustituir
              queda $\int\frac{u}{1+x^{2}}du$, que **todavía tiene $x$**. Habría
              que despejar $x$ en función de $u$ y aparece una exponencial: el
              camino largo.
          - texto: $x=\tan\theta$
            mensaje: |
              Funciona, y es el cambio estándar para $1+x^{2}$, pero aquí
              complica: el $\ln(1+\tan^{2}\theta)=-2\ln\cos\theta$ y hay que
              integrar logaritmos de cosenos. El $2x$ del numerador está
              avisando de que hay un cambio mucho más barato.

      - tipo: calcular
        titulo: La constante que deja la integración por partes
        pregunta: |
          La primitiva tiene la forma
          $-\dfrac{\ln\left(1+x^{2}\right)+k}{1+x^{2}}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Con $k=0$ te has quedado en el primer término de la integración
              por partes, $-\frac{\ln u}{u}$. Falta la integral que queda,
              $\int\frac{du}{u^{2}}=-\frac1u$, que aporta el $+1$.
          - valor: '2'
            mensaje: |
              Parece que has contado dos veces el término de partes. Solo
              aparece una integral residual, y vale $-\frac1u$.
          - valor: '-1'
            mensaje: |
              Signo. $\int u^{-2}du=-u^{-1}$, y con el signo de la fórmula de
              partes el resultado queda $-\frac{\ln u}{u}-\frac{1}{u}$, es decir
              $k=+1$.
        pista: |
          Con $u=1+x^{2}$ queda $\int\frac{\ln u}{u^{2}}du$; hazla por partes con
          $v=\ln u$.
        desarrollo: |
          $$
          \int\frac{\ln u}{u^{2}}\,du
          =-\frac{\ln u}{u}+\int\frac{du}{u^{2}}
          =-\frac{\ln u}{u}-\frac{1}{u}
          =-\frac{\ln u+1}{u}
          $$

      - tipo: calcular
        titulo: Un valor de control
        pregunta: |
          Con esa primitiva $F$, ¿cuánto vale $F(1)-F(0)$?
        respuesta:
          tipo: numero
          valor: '0.1534264'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.3465736'
            mensaje: |
              Eso es $\frac{\ln 2}{2}$: has evaluado sin el $+1$ del numerador.
              $F(1)=-\frac{\ln2+1}{2}$ y $F(0)=-1$.
          - valor: '-0.1534264'
            mensaje: |
              Signo. $F(1)\approx-0{,}8466$ y $F(0)=-1$, así que la diferencia es
              positiva: la primitiva crece, como tiene que hacer una primitiva de
              una función positiva en $(0,1)$.
          - valor: '0.8465736'
            mensaje: |
              Ese es $\left|F(1)\right|$. Falta restar $F(0)=-1$.
        pista: |
          $F(0)=-\frac{\ln1+1}{1}=-1$.
        desarrollo: |
          $$
          F(x)=-\frac{\ln\left(1+x^{2}\right)+1}{1+x^{2}}
          $$

          $$
          F(1)=-\frac{\ln 2+1}{2}\approx-0{,}84657,
          \qquad
          F(0)=-1
          $$

          $$
          F(1)-F(0)\approx0{,}15343
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $u=1+x^{2}$ se tiene $du=2x\,dx$, y la integral se convierte
              en $\int\frac{\ln u}{u^{2}}\,du$ sin dejar ninguna $x$.
          - texto: >-
              Esa se hace por partes con $v=\ln u$ y $dw=u^{-2}du$, de donde
              $w=-\frac1u$.
          - texto: >-
              Queda $-\frac{\ln u}{u}+\int\frac{du}{u^{2}}=
              -\frac{\ln u+1}{u}$, y deshaciendo el cambio,
              $-\frac{\ln(1+x^{2})+1}{1+x^{2}}+C$.
          - texto: >-
              Como $\int u^{-2}du=-u^{-1}$, la integral por partes termina en
              $-\frac{\ln u}{u}$ y no hay más términos.
            trampa: true
            mensaje: |
              La fórmula de partes deja **dos** trozos:
              $vw-\int w\,dv$. El primero es $-\frac{\ln u}{u}$ y el segundo es
              $-\int\left(-\frac1u\right)\frac{du}{u}=+\int\frac{du}{u^{2}}=
              -\frac1u$. Quedarse solo con el primero es el fallo típico, y se
              detecta derivando: la derivada de $-\frac{\ln u}{u}$ no reproduce
              el integrando.
    resolucion: |
      **El cambio, que está regalado.** El $2x$ del numerador es exactamente la
      derivada de $1+x^{2}$:

      $$
      u=1+x^{2},\qquad du=2x\,dx
      $$

      $$
      \int\frac{2x\ln\left(1+x^{2}\right)}{\left(1+x^{2}\right)^{2}}\,dx
      =\int\frac{\ln u}{u^{2}}\,du
      $$

      **Las partes.** Con $v=\ln u$ y $dw=u^{-2}du$, o sea $w=-\frac1u$:

      $$
      \int\frac{\ln u}{u^{2}}\,du
      =-\frac{\ln u}{u}+\int\frac{1}{u}\cdot\frac{du}{u}
      =-\frac{\ln u}{u}-\frac{1}{u}
      $$

      El segundo término es el que más se olvida. Sale de $-\int w\,dv$ con
      $w=-\frac1u$ y $dv=\frac{du}{u}$, y los dos signos menos lo dejan con
      signo positivo antes de integrar.

      **Deshacer el cambio.**

      $$
      \boxed{\;
      \int\frac{2x\ln\left(1+x^{2}\right)}{\left(1+x^{2}\right)^{2}}\,dx
      =-\frac{\ln\left(1+x^{2}\right)+1}{1+x^{2}}+C
      \;}
      $$

      **Comprobar derivando, que aquí es rápido.** Llamando $u=1+x^{2}$,

      $$
      \frac{d}{dx}\left[-\frac{\ln u+1}{u}\right]
      =-\frac{\frac{u'}{u}\cdot u-(\ln u+1)u'}{u^{2}}
      =\frac{u'\ln u}{u^{2}}
      =\frac{2x\ln\left(1+x^{2}\right)}{\left(1+x^{2}\right)^{2}}
      \;\checkmark
      $$

      Vale la pena hacerlo siempre en un ejercicio de nueve puntos por el
      cálculo: comprobar cuesta un minuto y descarta el error de la pieza que
      falta.

  - id: ex1819-ord-5-el-cucurucho-esferico
    titulo: Un cucurucho de helado, y por qué las esféricas lo resuelven solo
    fuente: >-
      Ejercicio 1 del SEGUNDO CUATRIMESTRAL · Convocatoria ordinaria, 29 de mayo
      de 2019 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Sea $S$ el sólido limitado por las condiciones
      $x^{2}+y^{2}\le z^{2}$, $x^{2}+y^{2}+z^{2}\le 9$, $z\ge 0$.

      a) Dibujar el sólido $S$ y calcular su volumen.

      b) Calcular el área de $S$.
    pide: El dibujo, el volumen y el área total de la superficie.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué describe $x^{2}+y^{2}\le z^{2}$ junto con $z\ge0$?
        opciones:
          - texto: >-
              El interior del cono de vértice el origen que se abre hacia
              arriba con semiángulo de $45^{\circ}$
            correcta: true
            mensaje: |
              Eso es. $x^{2}+y^{2}=z^{2}$ es $r=z$: a cada altura, el radio vale
              lo mismo que la altura, y eso son $45^{\circ}$ exactos. La
              desigualdad $\le$ deja lo de **dentro**, que es lo estrecho.
          - texto: El exterior del cono
            mensaje: |
              Cuidado con el sentido: $r\le z$ significa radio pequeño para una
              altura dada, o sea cerca del eje. Lo de fuera del cono cumpliría
              $r>z$.
          - texto: Un paraboloide
            mensaje: |
              El paraboloide es $z=x^{2}+y^{2}$, con la $z$ a la primera
              potencia. Aquí la $z$ va **al cuadrado**, y eso lo convierte en un
              cono: las secciones crecen en proporción a la altura, no a su raíz.

      - tipo: calcular
        titulo: El ángulo del cono en esféricas
        pregunta: |
          ¿Hasta qué valor llega el ángulo polar $\varphi$, en grados?
        respuesta:
          tipo: numero
          valor: '45'
          tolerancia: 0.001
          formato: un número de grados
        distractores:
          - valor: '90'
            mensaje: |
              $90^{\circ}$ sería la media bola entera, sin cono que la recorte.
              La condición del cono es justo lo que baja ese tope.
          - valor: '30'
            mensaje: |
              $30^{\circ}$ saldría con $r=\frac{z}{\sqrt3}$. Aquí $r=z$, y el
              ángulo cuya tangente vale $1$ es $45^{\circ}$.
          - valor: '60'
            mensaje: |
              Es el complementario. Cuidado con desde dónde se mide $\varphi$:
              en esféricas se mide desde el **eje $z$**, no desde el plano.
        pista: |
          En esféricas, $r=\rho\operatorname{sen}\varphi$ y $z=\rho\cos\varphi$. Impón
          $r\le z$.
        desarrollo: |
          $$
          \rho\operatorname{sen}\varphi\le\rho\cos\varphi
          \;\Longrightarrow\;
          \tan\varphi\le1
          \;\Longrightarrow\;
          0\le\varphi\le\frac{\pi}{4}
          $$

          Y la esfera da $0\le\rho\le3$, con $\theta$ dando la vuelta entera.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen de $S$?
        respuesta:
          tipo: numero
          valor: '16.5627'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '56.5487'
            mensaje: |
              Eso es la media bola de radio $3$, $\frac23\pi\cdot27$. El cono
              recorta una buena parte: el sólido se queda con menos de un tercio
              de ella.
          - valor: '113.0973'
            mensaje: |
              Esa es la bola entera. Faltan las dos condiciones que la recortan:
              $z\ge0$ y el cono.
          - valor: '28.2743'
            mensaje: |
              $9\pi$ es lo que sale de olvidar el factor $\left(1-\cos
              \frac\pi4\right)$ y quedarse con $2\pi\cdot\frac{\rho^{3}}{3}$.
              Ese factor es el que pesa el ángulo del cono.
        pista: |
          $\displaystyle V=\int_{0}^{2\pi}\!\!\int_{0}^{\pi/4}\!\!\int_{0}^{3}
          \rho^{2}\operatorname{sen}\varphi\,d\rho\,d\varphi\,d\theta$.
        desarrollo: |
          $$
          V=2\pi\cdot\frac{3^{3}}{3}\cdot
          \Bigl[-\cos\varphi\Bigr]_{0}^{\pi/4}
          =18\pi\left(1-\frac{\sqrt2}{2}\right)
          =9\pi\left(2-\sqrt2\right)\approx16{,}563
          $$

      - tipo: calcular
        titulo: El área de la superficie
        pregunta: |
          ¿Cuánto mide la superficie completa de $S$?
        respuesta:
          tipo: numero
          valor: '36.5557'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '16.5627'
            mensaje: |
              Ese es solo el casquete esférico —y coincide con el volumen, que
              no es casualidad: para un sector esférico $V=\frac{R}{3}A$ y aquí
              $R=3$—. Falta la superficie lateral del cono.
          - valor: '19.9930'
            mensaje: |
              Ese es solo el cono. El sólido está cerrado por arriba con el
              casquete de la esfera, que también es frontera.
          - valor: '56.5487'
            mensaje: |
              $18\pi$ es la superficie de la media esfera completa. El casquete
              es solo el trozo que queda dentro del cono, bastante menos.
        pista: |
          El casquete es $2\pi R^{2}\left(1-\cos\frac\pi4\right)$ y el cono
          tiene generatriz $3$ y radio de base $3\operatorname{sen}\frac\pi4$.
        desarrollo: |
          **El casquete.**

          $$
          A_{1}=2\pi\cdot3^{2}\left(1-\frac{\sqrt2}{2}\right)
          =9\pi\left(2-\sqrt2\right)\approx16{,}563
          $$

          **El cono.** La circunferencia de encuentro está a
          $R=3\operatorname{sen}\frac\pi4=\frac{3}{\sqrt2}$ del eje, y la generatriz es el
          propio radio de la esfera, $3$:

          $$
          A_{2}=\pi R g=\pi\cdot\frac{3}{\sqrt2}\cdot3
          =\frac{9\pi}{\sqrt2}\approx19{,}993
          $$

          $$
          A=A_{1}+A_{2}=18\pi-\frac{9\sqrt2\,\pi}{2}\approx36{,}556
          $$

      - tipo: justificar
        pregunta: Ordena el planteamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Las tres condiciones son: dentro del cono $r\le z$, dentro de la
              esfera de radio $3$, y por encima del plano $z=0$; en esféricas,
              $0\le\rho\le3$ y $0\le\varphi\le\frac\pi4$.
          - texto: >-
              El sólido es un sector esférico —un «cucurucho»—: la punta es el
              vértice del cono en el origen y la tapa es el casquete de la
              esfera.
          - texto: >-
              Su frontera son dos superficies curvas, la lateral del cono y el
              casquete, y nada más: el cono se cierra en su vértice y el casquete
              lo tapa por arriba.
          - texto: >-
              Hay que sumar además el disco plano que forman el cono y la esfera
              al encontrarse.
            trampa: true
            mensaje: |
              Ese disco es **interior**, no frontera: no separa el sólido del
              exterior, sino que está dentro de él. La circunferencia donde el
              cono y la esfera se cortan es solo la arista donde se juntan las
              dos superficies, no el borde de una tapa. Sumarla infla el área
              en $\pi R^{2}=\frac{9\pi}{2}\approx14$, casi un 40 %.
    resolucion: |
      **a) Qué sólido es.** Tres condiciones que se leen una a una:

      - $x^{2}+y^{2}\le z^{2}$ con $z\ge0$: el interior del cono de vértice el
        origen y semiángulo $45^{\circ}$, abierto hacia arriba.
      - $x^{2}+y^{2}+z^{2}\le9$: dentro de la esfera de radio $3$.

      Juntas dan un **cucurucho**: la punta en el origen, las paredes rectas
      subiendo a $45^{\circ}$ y una tapa esférica arriba. Es lo que en geometría
      se llama un *sector esférico*.

