    pide: El signo de cada uno de los tres coeficientes, razonado.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué son $a$, $b$ y $c$?
        opciones:
          - texto: >-
              $a=y(2)$, $b=y'(2)$ y $c=\dfrac{y''(2)}{2}$
            correcta: true
            mensaje: |
              Eso es. El polinomio está escrito en potencias de $x-2$ justamente
              para que sus coeficientes sean el valor, la pendiente y la mitad de
              la curvatura en $x=2$. Los tres se leen en la gráfica sin calcular
              nada.
          - texto: >-
              Tres números que se ajustan haciendo pasar la parábola por tres
              puntos de la gráfica
            mensaje: |
              Eso sería interpolar, y un polinomio de Taylor no interpola: copia
              el valor, la pendiente y la concavidad en **un solo** punto. Puede
              incluso no volver a tocar la curva en ningún otro sitio.
          - texto: >-
              $a=y(0)$, porque es el término independiente
            mensaje: |
              Lo sería si el polinomio estuviera centrado en $0$. Está centrado
              en $2$: sustituye $x=2$ y verás que los otros dos términos se
              anulan y queda $P(2)=a$.

      - tipo: calcular
        titulo: El signo de a
        pregunta: |
          ¿Cuál es el signo de $a$? Escribe $1$ si es positivo y $-1$ si es
          negativo.
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: 1 si es positivo, -1 si es negativo
        distractores:
          - valor: '1'
            mensaje: |
              Mira la gráfica en $x=2$: la curva va por debajo del eje
              horizontal, entre el mínimo y el corte de $x=3$. Como $a=y(2)$, el
              signo es negativo.
        pista: |
          $a=y(2)$: basta con mirar si la curva está por encima o por debajo del
          eje en $x=2$.
        desarrollo: |
          $$
          P(2)=a+b\cdot 0+c\cdot 0=a
          \qquad\text{y}\qquad
          P(2)=y(2)
          $$

          En la gráfica, en $x=2$ la curva está claramente **por debajo** del eje
          horizontal — todavía no ha llegado al corte, que está en $x=3$—. Por
          tanto $a<0$.

      - tipo: calcular
        titulo: El signo de b
        pregunta: |
          ¿Y el signo de $b$? Escribe $1$ o $-1$.
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: 1 si es positivo, -1 si es negativo
        distractores:
          - valor: '-1'
            mensaje: |
              Estar por debajo del eje y estar bajando son cosas distintas. En
              $x=2$ la curva está en valores negativos —eso es lo que da
              $a<0$— pero va **subiendo** hacia el corte de $x=3$. La pendiente
              es positiva.
        pista: |
          $b=y'(2)$: mira si la curva sube o baja al pasar por $x=2$.
        desarrollo: |
          Derivando, $P'(x)=b+2c(x-2)$, y en $x=2$ queda $P'(2)=b=y'(2)$.

          En la gráfica, $x=2$ está entre el mínimo —que cae poco después de
          $x=1$— y el corte con el eje en $x=3$: la curva está **subiendo**. Por
          tanto $b>0$.

      - tipo: calcular
        titulo: El signo de c
        pregunta: |
          ¿Y el de $c$? Escribe $1$ o $-1$.
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: 1 si es positivo, -1 si es negativo
        distractores:
          - valor: '-1'
            mensaje: |
              La curva es cóncava hacia abajo más adelante, alrededor del máximo,
              pero en $x=2$ todavía no: viene del mínimo y sube cada vez más
              deprisa. El punto de inflexión está hacia $x=3$, y hasta ahí
              $y''>0$.
        pista: |
          $c=\frac{y''(2)}{2}$: mira hacia dónde está curvada la gráfica en
          $x=2$, y dónde queda el punto de inflexión.
        desarrollo: |
          $P''(x)=2c$, así que $c=\dfrac{y''(2)}{2}$ y su signo es el de la
          concavidad.

          Entre el mínimo y el punto de inflexión la curva es **cóncava hacia
          arriba**: sube cada vez más deprisa. En la gráfica el mínimo cae poco
          después de $x=1$ y la inflexión hacia $x=3$, así que $x=2$ está en ese
          tramo. Por tanto $y''(2)>0$ y $c>0$.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El polinomio está escrito en potencias de $x-2$, así que
              $a=y(2)$, $b=y'(2)$ y $c=\dfrac{y''(2)}{2}$.
          - texto: >-
              En $x=2$ la curva va por debajo del eje horizontal, luego
              $a<0$.
          - texto: >-
              En $x=2$ la curva está subiendo —viene del mínimo y va hacia el
              corte de $x=3$—, luego $b>0$.
          - texto: >-
              En $x=2$ la curva es cóncava hacia arriba, porque la inflexión no
              llega hasta cerca de $x=3$, luego $c>0$.
          - texto: >-
              Los tres signos se leen en la gráfica sin conocer la fórmula de
              $y$: eso es lo que hace útil escribir el polinomio centrado en el
              punto.
          - texto: >-
              Como en $x=2$ la gráfica está por debajo del eje, la función
              decrece ahí y por tanto $b<0$.
            trampa: true
            mensaje: |
              Estar por debajo del eje es una afirmación sobre el **valor** de la
              función; decrecer lo es sobre su **derivada**. Son independientes:
              una función puede ser negativa y creciente, que es exactamente lo
              que pasa aquí entre el mínimo y el corte de $x=3$. El signo de $a$
              lo da la altura, y el de $b$ la pendiente.

    resolucion: |
      **Qué son los tres coeficientes.** El polinomio de Taylor de grado 2 de
      $y$ centrado en $x=2$ es

      $$
      P(x)=y(2)+y'(2)\,(x-2)+\frac{y''(2)}{2}\,(x-2)^{2}
      $$

      Comparando con $P(x)=a+b(x-2)+c(x-2)^{2}$:

      $$
      a=y(2),
      \qquad
      b=y'(2),
      \qquad
      c=\frac{y''(2)}{2}
      $$

      Y esa es toda la idea del ejercicio: escrito en potencias de $x-2$, cada
      coeficiente es una propiedad **local** de la curva en $x=2$ —altura,
      pendiente y concavidad— y las tres se leen en el dibujo.

      **$a$: la altura.** En $x=2$ la gráfica está por debajo del eje
      horizontal: viene del mínimo y todavía no ha llegado al corte, que está en
      $x=3$. Luego

      $$
      a=y(2)<0
      $$

      **$b$: la pendiente.** En ese mismo punto la curva está **subiendo** —el
      mínimo queda a su izquierda, poco después de $x=1$, y el corte con el eje
      a su derecha—. Luego

      $$
      b=y'(2)>0
      $$

      Este es el punto en el que más gente se equivoca: se confunde «está abajo»
      con «va bajando». Son dos cosas distintas y aquí tienen signos contrarios.

      **$c$: la concavidad.** Entre un mínimo y el punto de inflexión siguiente
      la curva es cóncava hacia arriba. En la gráfica el mínimo cae poco después
      de $x=1$ y la inflexión hacia $x=3$, de modo que $x=2$ está en medio de ese
      tramo. Luego

      $$
      y''(2)>0
      \qquad\Longrightarrow\qquad
      c=\frac{y''(2)}{2}>0
      $$

      **Resultado.** $a<0$, $b>0$, $c>0$.

      **Cómo se comprueba a ojo.** Con esos signos, $P$ es una parábola abierta
      hacia arriba, con vértice a la izquierda de $x=2$ y que en $x=2$ pasa por
      debajo del eje subiendo. Dibújala encima de la curva: en un entorno de
      $x=2$ las dos van juntas. Si algún signo estuviera cambiado, la parábola se
      separaría de la curva inmediatamente, y eso se ve.
