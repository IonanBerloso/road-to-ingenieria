ejercicios:
  - id: ex1617-5rec-1-una-sola-raiz-y-hay-que-probarlo
    titulo: Una raíz que existe, y demostrar que no hay más
    fuente: >-
      Ejercicio 1 · Quinta evaluación, PRIMER CUATRIMESTRAL, 8 de mayo de 2017 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 4
      comp4: 4
    enunciado: |
      Demostrar que la función $y(x)=xe^{x}-1$ tiene al menos una raíz real
      positiva. ¿Tiene más raíces?
    pide: La existencia de una raíz positiva, y cuántas raíces hay en total.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué teorema demuestra que **existe** una raíz, sin calcularla?
        opciones:
          - texto: >-
              El de Bolzano: $y$ es continua en $[0,1]$, $y(0)<0$ y $y(1)>0$,
              luego se anula en algún punto de $(0,1)$
            correcta: true
            mensaje: |
              Eso es. Y hay que decir las tres cosas: continua, intervalo
              cerrado, y signos opuestos en los extremos. La raíz existe aunque
              no se pueda escribir con funciones elementales, que es justo lo que
              pasa aquí.
          - texto: >-
              El de Rolle, porque $y$ es derivable y por tanto tiene un punto con
              tangente horizontal
            mensaje: |
              Rolle habla de dónde se anula la **derivada**, no la función, y
              además exige $y(a)=y(b)$. Aquí lo que se busca es un cero de $y$.
          - texto: >-
              Ninguno: hay que resolver $xe^{x}=1$ y ver la solución
            mensaje: |
              Esa ecuación no se puede resolver con funciones elementales — su
              solución es la constante de Lambert, $W(1)\approx 0{,}567$ —. Y
              justamente por eso el ejercicio pide **demostrar que existe**, no
              calcularla.

      - tipo: calcular
        titulo: El extremo derecho del intervalo
        pregunta: |
          ¿Cuánto vale $y(1)$?
        respuesta:
          tipo: numero
          valor: '1.7182818'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '2.7182818'
            mensaje: |
              Te has dejado el $-1$. $y(1)=1\cdot e^{1}-1=e-1$.
          - valor: '-1'
            mensaje: |
              Ese es $y(0)$: con $x=0$ el primer sumando se anula y queda $-1$.
              Es el otro extremo del intervalo, y el que da el signo negativo.
          - valor: '0.3678794'
            mensaje: |
              Eso es $e^{-1}$. El exponente es $x=1$, no $-1$.
        pista: |
          Sustituye $x=1$ en $xe^{x}-1$.
        desarrollo: |
          $$
          y(1)=1\cdot e^{1}-1=e-1\approx 1{,}7183>0
          $$

          y $y(0)=0\cdot e^{0}-1=-1<0$. Con esto ya está el cambio de signo que
          pide Bolzano.

      - tipo: calcular
        titulo: El único punto crítico
        pregunta: |
          $y'(x)=(1+x)e^{x}$. ¿En qué punto se anula?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Has resuelto $e^{x}=0$, que no tiene solución: la exponencial nunca
              vale cero. Lo que se puede anular es el otro factor, $1+x$.
          - valor: '1'
            mensaje: |
              Signo. De $1+x=0$ sale $x=-1$.
        pista: |
          Un producto se anula cuando se anula alguno de sus factores, y $e^{x}$
          no se anula nunca.
        desarrollo: |
          $$
          y'(x)=e^{x}+xe^{x}=(1+x)e^{x}=0
          \;\Longleftrightarrow\;
          1+x=0
          \;\Longleftrightarrow\;
          x=-1
          $$

          Y como $e^{x}>0$ siempre, el signo de $y'$ es el de $1+x$: $y$ decrece
          en $(-\infty,-1)$ y crece en $(-1,+\infty)$.

      - tipo: calcular
        titulo: Cuántas raíces reales
        pregunta: |
          ¿Cuántas raíces reales tiene $y$ en total?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              El mínimo en $x=-1$ hace pensar en dos ramas y dos cortes, pero hay
              que mirar su **valor**: $y(-1)=-e^{-1}-1\approx-1{,}37$, por debajo
              del eje. La rama izquierda nunca llega a cortarlo.
          - valor: '0'
            mensaje: |
              Bolzano ya garantiza una en $(0,1)$: $y(0)=-1$ e
              $y(1)=e-1>0$.
          - valor: '3'
            mensaje: |
              $y'$ se anula en un solo punto, así que $y$ tiene a lo sumo dos
              tramos de monotonía y no puede cortar al eje tres veces.
        pista: |
          Mira cuánto vale $y$ en su mínimo, y a dónde tiende cuando
          $x\to-\infty$.
        desarrollo: |
          $y$ decrece en $(-\infty,-1)$ y crece en $(-1,+\infty)$, así que corta
          al eje como mucho **dos** veces, una en cada tramo.

          En el tramo creciente hay exactamente una, la que da Bolzano. En el
          decreciente no hay ninguna, porque ahí $y$ va desde

          $$
          \lim_{x\to-\infty}\left(xe^{x}-1\right)=-1
          $$

          hasta el mínimo $y(-1)=-e^{-1}-1\approx-1{,}37$: todo el tramo está por
          debajo del eje. Total: **una** raíz real.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $y(x)=xe^{x}-1$ es continua en todo $\mathbb{R}$, por ser producto
              y suma de funciones continuas.
          - texto: >-
              $y(0)=-1<0$ e $y(1)=e-1>0$, así que por el teorema de Bolzano
              existe $c\in(0,1)$ con $y(c)=0$: hay una raíz real positiva.
          - texto: >-
              $y'(x)=(1+x)e^{x}$, y como $e^{x}>0$ siempre, el signo de $y'$ es el
              de $1+x$: $y$ decrece en $(-\infty,-1)$ y crece en
              $(-1,+\infty)$.
          - texto: >-
              En $(0,+\infty)$ la función es estrictamente creciente, así que la
              raíz que da Bolzano es **la única** positiva.
          - texto: >-
              En $(-\infty,-1]$ el mayor valor que toma $y$ es su límite en
              $-\infty$, que vale $-1$; y su menor valor es el mínimo
              $y(-1)=-e^{-1}-1$. Todo el tramo está por debajo del eje: no hay
              raíces negativas.
          - texto: >-
              Como $y$ tiene un mínimo en $x=-1$, la gráfica baja y vuelve a
              subir, así que corta al eje una vez a cada lado del mínimo: dos
              raíces.
            trampa: true
            mensaje: |
              Bajar y volver a subir no obliga a cortar dos veces: depende de
              **hasta dónde** baje. Aquí el mínimo vale $-1{,}37$, y por la
              izquierda la función no sube por encima de $-1$: se queda entera
              por debajo del eje. La gráfica corta una sola vez, en la rama
              derecha.

    resolucion: |
      **La existencia.** $y(x)=xe^{x}-1$ es continua en todo $\mathbb{R}$. En
      los extremos del intervalo $[0,1]$:

      $$
      y(0)=0\cdot e^{0}-1=-1<0,
      \qquad
      y(1)=e-1\approx 1{,}7183>0
      $$

      Por el teorema de Bolzano existe $c\in(0,1)$ con $y(c)=0$. Esa es la raíz
      real positiva que pide el enunciado, y **no hace falta calcularla**: de
      hecho no se puede con funciones elementales — vale $W(1)\approx 0{,}5671$,
      la constante de Lambert.

      **La unicidad, que es la segunda pregunta.**

      $$
      y'(x)=e^{x}+xe^{x}=(1+x)e^{x}
      $$

      Como $e^{x}>0$ para todo $x$, el signo de $y'$ es el de $1+x$:

      - $y$ **decrece** en $(-\infty,-1)$,
      - $y$ **crece** en $(-1,+\infty)$.

      En el tramo creciente la función es estrictamente monótona, así que corta
      al eje como mucho una vez — y ya sabemos que corta: la raíz de Bolzano.

      En el tramo decreciente hay que mirar los valores. El mayor es el límite
      en $-\infty$:

      $$
      \lim_{x\to-\infty}xe^{x}=0
      \qquad\Longrightarrow\qquad
      \lim_{x\to-\infty}y(x)=-1
      $$

      y el menor es el mínimo absoluto,

      $$
      y(-1)=-e^{-1}-1\approx-1{,}3679
      $$

      Todo el tramo está entre $-1{,}37$ y $-1$: **por debajo del eje**. No hay
      raíces negativas.

      **Conclusión.** $y$ tiene exactamente **una** raíz real, y es positiva.

      **El error que persigue la segunda pregunta.** «Tiene un mínimo, luego baja
      y sube, luego corta dos veces». Falso: para cortar dos veces hay que bajar
      **por debajo** del eje desde arriba y volver a subir por encima, y aquí la
      rama izquierda nunca llega arriba. La existencia de un mínimo dice cuántas
      raíces puede haber como máximo, no cuántas hay.

  - id: ex1617-5rec-2-los-signos-de-taylor-leidos-en-la-grafica
    titulo: Los signos de un polinomio de Taylor, leídos en la gráfica
    fuente: >-
      Ejercicio 2 · Quinta evaluación, PRIMER CUATRIMESTRAL, 8 de mayo de 2017 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 2
      comp4: 7
    enunciado: |
      Sea $P(x)=a+b(x-2)+c(x-2)^{2}$ el polinomio de Taylor de grado 2 de la
      función $y(x)$ mostrada en la figura. Obtener los signos de $a$, $b$ y
      $c$.

