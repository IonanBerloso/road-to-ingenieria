ejercicios:
  - id: ex2223-1-recta-y-conjunto-vacio
    titulo: Una recta partida en dos, y un apartado sin solución
    fuente: >-
      Ejercicio 1 · Primera evaluación, 24 de octubre de 2022 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    nivel: examen
    enunciado: |
      **a)** Calcular y representar geométricamente los afijos de los números
      complejos $z$ que verifican la condición siguiente:

      $$
      \arg\left(\frac{z+\overline{1-2i}}{1-z}\right) = \pi
      $$

      **b)** Calcular y representar geométricamente los afijos de los números
      complejos $z$ que verifican la condición:

      $$
      \left|z\right|^{4} = 1+i\sqrt{3}
      $$
    pide: Resolver los dos apartados y representarlos.

    pasos:
      - tipo: reconocer
        pregunta: |
          Mira el apartado (b) antes de calcular nada. ¿Qué se ve?
        opciones:
          - texto: >-
              Que el primer miembro es **real y no negativo** y el segundo no es
              real: no hay ninguna solución
            correcta: true
            mensaje: |
              Exacto, y ese es todo el apartado. $\left|z\right|$ es una
              distancia, así que $\left|z\right|^{4}$ es un real $\ge 0$;
              $1+i\sqrt3$ tiene parte imaginaria $\sqrt3 \neq 0$. No pueden ser
              iguales. El conjunto de afijos es **vacío**, y decirlo con ese
              argumento vale el apartado entero.
          - texto: >-
              Que hay que calcular las raíces cuartas de $1+i\sqrt3$
            mensaje: |
              Eso sería si el enunciado dijera $z^{4} = 1+i\sqrt3$. Pero dice
              $\left|z\right|^{4}$, con barras: el primer miembro es un número
              real, no un complejo. Confundir $z^{4}$ con
              $\left|z\right|^{4}$ es exactamente el error que busca.
          - texto: Que hay infinitas soluciones, una circunferencia
            mensaje: |
              Habría una circunferencia si el segundo miembro fuera un real
              positivo: $\left|z\right|^{4} = r$ da
              $\left|z\right| = \sqrt[4]{r}$. Pero $1+i\sqrt3$ no es real.
          - texto: Que hay que tomar módulos en los dos miembros
            mensaje: |
              Tomar módulos cambiaría el enunciado: daría
              $\left|z\right|^{4} = \left|1+i\sqrt3\right| = 2$, que sí tiene
              solución. Pero eso es otro problema. Tal como está escrito, no hay
              ninguna.

      - tipo: calcular
        titulo: La recta del apartado (a)
        pregunta: |
          Los afijos del apartado (a) están sobre una recta. ¿Cuál es su
          pendiente?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '-1'
            mensaje: |
              Signo cambiado. La recta pasa por $(1,0)$ y por $(-1,-2)$, y
              $\frac{0-(-2)}{1-(-1)} = \frac{2}{2} = +1$.
          - valor: '2'
            mensaje: |
              2 es la diferencia de ordenadas entre los dos puntos, no la
              pendiente. Hay que dividirla por la diferencia de abscisas, que
              también vale 2.
          - valor: '0'
            mensaje: |
              Una recta horizontal pasaría por dos puntos con la misma
              ordenada, y $(1,0)$ y $(-1,-2)$ no la tienen.
        pista: |
          El conjugado de $1-2i$ es $1+2i$, así que el numerador es
          $z-(-1-2i)$. Los dos puntos en juego son $-1-2i$ y $1$.
        desarrollo: |
          Primero se deshace el conjugado, que es donde se pierde el signo:

          $$
          \overline{1-2i} = 1+2i
          \;\Longrightarrow\;
          z+\overline{1-2i} = z+1+2i = z-\left(-1-2i\right)
          $$

          Así que el numerador es el vector que va del punto $-1-2i$ al afijo de
          $z$, y el denominador, $1-z = -\left(z-1\right)$, es el que va de 1 a
          $z$ **cambiado de signo**.

          La recta que contiene a los dos puntos pasa por $(-1,-2)$ y $(1,0)$:

          $$
          m = \frac{0-(-2)}{1-(-1)} = 1
          \;\Longrightarrow\;
          y = x-1
          $$
        veredicto: |
          El conjugado del enunciado no está para complicar: está para que
          confundas $+1+2i$ con $-1+2i$ y la recta te salga girada.

      - tipo: calcular
        titulo: El apartado (b)
        pregunta: |
          ¿Cuántos números complejos cumplen $\left|z\right|^{4} = 1+i\sqrt3$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              Cuatro serían las soluciones de $z^{4} = 1+i\sqrt3$, sin barras.
              Con barras el primer miembro es real y la ecuación es imposible.
          - valor: '1'
            mensaje: |
              Ni una. Para que hubiera alguna, $1+i\sqrt3$ tendría que ser un
              número real no negativo, y su parte imaginaria vale $\sqrt3$.
          - valor: '2'
            mensaje: |
              Dos saldrían de una ecuación de segundo grado. Aquí no hay
              ninguna, porque los dos miembros ni siquiera son del mismo tipo:
              uno es real y el otro no.
        pista: |
          ¿Qué tipo de número es $\left|z\right|^{4}$? ¿Y $1+i\sqrt3$?
        desarrollo: |
          $\left|z\right|$ es una **distancia**: un número real no negativo. Su
          cuarta potencia también lo es:

          $$
          \left|z\right|^{4} \in \mathbb{R},
          \qquad \left|z\right|^{4} \ge 0
          $$

          En cambio

          $$
          \operatorname{Im}\left(1+i\sqrt3\right) = \sqrt3 \neq 0
          $$

          Dos números iguales tienen la misma parte imaginaria. Como una vale 0
          y la otra $\sqrt3$, **no existe ningún $z$** que cumpla la igualdad.

          $$
          \left\{z \in \mathbb{C} : \left|z\right|^{4} = 1+i\sqrt3\right\}
          = \varnothing
          $$
        veredicto: |
          Un conjunto vacío es una respuesta perfectamente válida, y hay que
          representarlo diciendo que no hay nada que dibujar. Lo que no vale es
          forzar una solución que no existe.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento del apartado (a). Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              $\overline{1-2i} = 1+2i$, así que la condición es
              $\arg\left(\frac{z-(-1-2i)}{1-z}\right) = \pi$.
          - texto: |
              Como $1-z = -(z-1)$, se tiene
              $\arg(1-z) = \arg(z-1)+\pi$.
          - texto: |
              Sustituyendo, la condición queda
              $\arg\left(z+1+2i\right)-\arg\left(z-1\right) = 2\pi \equiv 0$.
          - texto: |
              Es decir: los vectores que van de $-1-2i$ a $z$ y de $1$ a $z$
              apuntan **en la misma dirección y sentido**. Eso ocurre sobre la
              recta que une los dos puntos, pero **fuera** del segmento.
          - texto: |
              La recta es $y = x-1$, y el resultado son sus dos semirrectas
              exteriores: $x>1$ y $x<-1$.
          - texto: |
              Los puntos $-1-2i$ y $1$ también valen, porque están sobre la
              recta.
            trampa: true
            mensaje: |
              Ninguno de los dos vale. En $z=1$ el denominador se anula, y en
              $z=-1-2i$ se anula el numerador: en los dos casos el argumento
              del cociente no está definido. Son justo los extremos del
              segmento que hay que quitar, así que la respuesta son dos
              semirrectas **abiertas**.
        veredicto: |
          Cuando la diferencia de argumentos sale 0 el resultado es «fuera del
          segmento»; si hubiera salido $\pi$, sería «dentro». Merece la pena
          quedarse con las dos.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** Dos lugares geométricos independientes: (a) el de
      $\arg\left(\frac{z+\overline{1-2i}}{1-z}\right) = \pi$ y (b) el de
      $\left|z\right|^{4} = 1+i\sqrt3$.

      **Reparto de puntos del examen:** COMP1 1 · COMP2 7 · COMP4 2.

      ### 1 · Apartado (a): deshacer el conjugado

      Lo primero, y es donde se cae medio ejercicio:

      $$
      \overline{1-2i} = 1+2i
      $$

      así que el numerador es $z+1+2i = z-\left(-1-2i\right)$: el vector que va
      del punto $-1-2i$ al afijo de $z$.

      Escribirlo así, como diferencia, es lo que permite leerlo
      geométricamente. Dejarlo como suma esconde el punto.

      ### 2 · Apartado (a): traducir la condición

      El denominador tiene un signo escondido:

      $$
      1-z = -\left(z-1\right)
      \;\Longrightarrow\;
      \arg\left(1-z\right) = \arg\left(z-1\right)+\pi
      $$

      El argumento de un cociente es la diferencia de argumentos, así que la
      condición es

      $$
      \arg\left(z+1+2i\right)-\arg\left(z-1\right)-\pi = \pi
      $$

      $$
      \arg\left(z+1+2i\right)-\arg\left(z-1\right) = 2\pi \equiv 0
      \pmod{2\pi}
      $$

      Traducido: **los dos vectores apuntan en la misma dirección y el mismo
      sentido**. Uno va de $-1-2i$ a $z$; el otro, de $1$ a $z$.

      ### 3 · Apartado (a): dónde pasa eso

      Dos vectores con el mismo origen distinto y el mismo destino son
      paralelos solo si los tres puntos están **alineados**. Y apuntan en el
      mismo sentido solo si $z$ está **fuera** del segmento que une $-1-2i$
      con $1$:

      - Si $z$ está más allá de $1$, los dos vectores van hacia la derecha ✔
      - Si $z$ está más allá de $-1-2i$, los dos van hacia la izquierda ✔
      - Si $z$ está **entre** los dos, apuntan en sentidos contrarios y la
        diferencia de argumentos vale $\pi$, no 0 ✗

      La recta por $(-1,-2)$ y $(1,0)$ tiene pendiente
      $\frac{0+2}{1+1} = 1$:

      $$
      y = x-1
      $$

      Y los dos extremos se excluyen: en $z=1$ el denominador se anula y en
      $z = -1-2i$ el numerador, y el argumento de 0 no está definido.

      $$
      \boxed{\;y = x-1 \quad\text{con}\quad x>1 \;\text{ o }\; x<-1\;}
      $$

      Dos **semirrectas abiertas** de la misma recta, con el segmento del medio
      quitado.

      ### 4 · Apartado (b): no hay solución, y hay que decir por qué

      $$
      \left|z\right|^{4} = 1+i\sqrt3
      $$

      El primer miembro es el módulo elevado a la cuarta: un número **real y no
      negativo**, porque un módulo es una distancia.

      El segundo tiene parte imaginaria $\sqrt3 \neq 0$.

      Dos números complejos iguales tienen la misma parte imaginaria. Aquí una
      vale 0 y la otra $\sqrt3$, así que la igualdad es imposible:

      $$
      \boxed{\;\left\{z \in \mathbb{C} : \left|z\right|^{4} = 1+i\sqrt3\right\}
      = \varnothing\;}
      $$

      No hay nada que representar, y eso también se dibuja: un plano vacío con
      la explicación al lado.

      ### 5 · Por qué el apartado (b) está puesto

      Porque a un golpe de vista parece $z^{4} = 1+i\sqrt3$, que sí tiene cuatro
      soluciones y es un ejercicio de rutina. **Las barras lo cambian todo.** El
      apartado premia leer el enunciado antes de arrancar a calcular, que es
      justo lo que un examen quiere medir.

      Si el enunciado hubiera sido $\left|z\right|^{4} = 2$, la respuesta sería
      la circunferencia $\left|z\right| = \sqrt[4]{2}$. Merece la pena decirlo
      para dejar claro que se ha entendido la diferencia.

      ### 6 · Comprobación

      **Del apartado (a)**, con dos puntos de cada semirrecta y uno del
      segmento:

      - $z = 3+2i$ (sobre $y=x-1$, con $x>1$). Numerador $4+4i$, de argumento
        $45^{\circ}$; denominador $1-z = -2-2i$, de argumento $225^{\circ}$.
        Diferencia: $45-225 = -180 \equiv 180^{\circ} = \pi$ ✔
      - $z = -3-4i$ (con $x<-1$). Numerador $-2-2i$, argumento $225^{\circ}$;
        denominador $4+4i$, argumento $45^{\circ}$. Diferencia:
        $225-45 = 180^{\circ}$ ✔
      - $z = -i$ (sobre la recta, **entre** los dos puntos). Numerador $1+i$ y
        denominador $1+i$: el cociente vale 1, de argumento $0 \neq \pi$ ✗.
        Queda fuera, como debe.

      **Del apartado (b)**: cualquier $z$ que se pruebe da un primer miembro
      real. Con $z = 1+i$, $\left|z\right|^{4} = \left(\sqrt2\right)^{4} = 4$,
      que no es $1+i\sqrt3$. Y no es mala suerte: **nunca** va a serlo.

  - id: ex2223-2-identidad-coseno-cuadrado
    titulo: El coseno al cuadrado, para argumentos complejos
    fuente: >-
      Ejercicio 2 · Primera evaluación, 24 de octubre de 2022 · Cálculo,
      UPV/EHU · El examen no publica solución: la demostración es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 0
      comp4: 10

    nivel: examen
    enunciado: |
      Demostrar la fórmula

      $$
      \cos^{2} z = \frac{1+\cos 2z}{2}
      \qquad \forall z \in \mathbb{C}
      $$
    pide: Demostrar la fórmula para todo complejo.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué hay algo que demostrar, si la fórmula ya se conoce de
          trigonometría?
        opciones:
          - texto: >-
              Porque el coseno complejo es una función **nueva**, definida por
              la exponencial, y no hereda automáticamente lo del real
            correcta: true
            mensaje: |
              Eso es. Y no es una precaución vacía: hay propiedades reales que
              **no** sobreviven. El coseno complejo no está acotado, y
              $\cos^{2}z$ puede valer más de 1 o incluso ser negativo. Lo que
              sobrevive hay que probarlo.
          - texto: Porque en $\mathbb{C}$ hay que usar radianes
            mensaje: |
              El argumento complejo no es un ángulo, así que la distinción
              grados-radianes ni siquiera se plantea. Lo que hay que justificar
              es que la identidad se conserva al cambiar de dominio.
          - texto: >-
              Porque la fórmula real solo vale para $z$ entre 0 y $2\pi$
            mensaje: |
              La identidad real vale para todo $x$ real, sin restricción. El
              problema no es el rango: es que el coseno complejo es otra
              función.
          - texto: No hay nada que demostrar, se aplica la fórmula real
            mensaje: |
              Aplicar una fórmula fuera del dominio en el que se demostró es
              exactamente lo que un examen de COMP4 penaliza. Aquí hay diez
              puntos en juego y todos son la demostración.

      - tipo: calcular
        titulo: Un valor que en los reales sería imposible
        pregunta: |
          ¿Cuánto vale $\cos^{2}(i)$? Da el resultado en forma exacta, o con tres decimales.
        respuesta:
          tipo: numero
          valor: '2.381'
          tolerancia: 0.005
          formato: un número en forma exacta, o con tres decimales
        distractores:
          - valor: '1'
            mensaje: |
              Si el coseno complejo estuviera acotado por 1, su cuadrado no
              pasaría de 1. Pero no lo está: $\cos i = \cosh 1 \approx 1{,}543$,
              y su cuadrado vale más de 2.
          - valor: '1.543'
            mensaje: |
              $1{,}543$ es $\cos i = \cosh 1$, sin elevar al cuadrado. La
              pregunta pide $\cos^{2}(i)$.
          - valor: '0.291'
            mensaje: |
              Ese sería el cuadrado del coseno **real** de 1 radián,
              $\cos^{2}(1) \approx 0{,}292$. Pero el argumento es $i$, no 1: hay
              que usar la definición compleja.
        pista: |
          $\cos(ix) = \cosh x$. Con $x=1$, $\cosh 1 = \frac{e+e^{-1}}{2}$.
        desarrollo: |
          Por la definición exponencial, con $z = i$:

          $$
          \cos i = \frac{e^{i\cdot i}+e^{-i\cdot i}}{2}
                 = \frac{e^{-1}+e^{1}}{2} = \cosh 1 \approx 1{,}5431
          $$

          $$
          \cos^{2}(i) \approx 1{,}5431^{2} \approx 2{,}381
          $$

          Y por la fórmula que se va a demostrar:

          $$
          \frac{1+\cos 2i}{2} = \frac{1+\cosh 2}{2}
          \approx \frac{1+3{,}7622}{2} \approx 2{,}381
          $$

          Coinciden.
        veredicto: |
          $2{,}381 > 1$. En los reales el cuadrado de un coseno nunca pasa de 1,
          y aquí sí: la prueba de que estas son funciones distintas.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Se parte de la **definición** del coseno complejo,
              $\cos w = \dfrac{e^{iw}+e^{-iw}}{2}$, válida para todo
              $w \in \mathbb{C}$.
          - texto: |
              Elevando al cuadrado y usando $e^{iz}e^{-iz} = e^{0} = 1$:
              $\cos^{2}z = \dfrac{e^{2iz}+2+e^{-2iz}}{4}$.
          - texto: |
              Por otro lado, con el argumento $2z$,
              $\cos 2z = \dfrac{e^{2iz}+e^{-2iz}}{2}$.
          - texto: |
              Entonces
              $\dfrac{1+\cos 2z}{2} = \dfrac{2+e^{2iz}+e^{-2iz}}{4}$, que es la
              misma expresión.
          - texto: |
              No se ha supuesto nada sobre $z$, así que la igualdad vale para
              todo $z \in \mathbb{C}$.
          - texto: |
              Como $\cos^{2}z \le 1$ para todo $z$, el segundo miembro también
              está acotado por 1.
            trampa: true
            mensaje: |
              El coseno complejo **no está acotado**. La cota
              $\left|\cos x\right| \le 1$ solo vale para argumentos reales: con
              $z=i$ sale $\cos^{2}(i) \approx 2{,}38$. Meter esa afirmación en
              la demostración es usar una propiedad que aquí es falsa.
        veredicto: |
          Esta demostración es gemela del ejercicio 1.27 del boletín, el de
          $\mathrm{sen}^{2}z$. Cambia un signo y poco más — pero el signo hay
          que ponerlo bien.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > demostración propuesta, pendiente de revisión.

      **Enunciado.** Demostrar que
      $\cos^{2} z = \dfrac{1+\cos 2z}{2}$ para todo $z \in \mathbb{C}$.

      **Reparto de puntos del examen:** COMP4 10. Todo es demostración.

      ### 1 · De dónde se parte, y por qué no vale la identidad real

      En $\mathbb{C}$ el coseno **se define** a partir de la exponencial:

      $$
      \cos w = \frac{e^{iw}+e^{-iw}}{2}, \qquad w \in \mathbb{C}
      $$

      Es importante decirlo antes de empezar: no se puede invocar la identidad
      trigonométrica real, porque estas son **funciones distintas** que
      coinciden con las reales solo sobre el eje real.

      Y no es una precaución retórica. Hay propiedades que no sobreviven al
      cambio: el coseno complejo **no está acotado**, y $\cos^{2}z$ puede pasar
      de 1 —con $z=i$ vale $2{,}38$— o incluso ser negativo. Si algunas
      propiedades se caen, ninguna se puede dar por heredada: hay que probarla.

      La definición vale para **todo** $z$ complejo, sin restricciones, porque
      la exponencial compleja está definida en todo el plano. Ahí está la
      hipótesis del «$\forall z$» del enunciado.

      ### 2 · El primer miembro

      $$
      \cos^{2}z = \left(\frac{e^{iz}+e^{-iz}}{2}\right)^{2}
      = \frac{\left(e^{iz}+e^{-iz}\right)^{2}}{4}
      $$

      Desarrollando el cuadrado del binomio, y usando que
      $e^{iz}\cdot e^{-iz} = e^{0} = 1$:

      $$
      \left(e^{iz}+e^{-iz}\right)^{2} = e^{2iz}+2\,e^{iz}e^{-iz}+e^{-2iz}
      = e^{2iz}+2+e^{-2iz}
      $$

      Por tanto

      $$
      \cos^{2}z = \frac{e^{2iz}+2+e^{-2iz}}{4}
      $$

      ### 3 · El segundo miembro

      La misma definición, con el argumento $2z$:

      $$
      \cos 2z = \frac{e^{2iz}+e^{-2iz}}{2}
      $$

      y entonces

      $$
      \frac{1+\cos 2z}{2}
      = \frac{1}{2}\left(1+\frac{e^{2iz}+e^{-2iz}}{2}\right)
      = \frac{1}{2}\cdot\frac{2+e^{2iz}+e^{-2iz}}{2}
      = \frac{2+e^{2iz}+e^{-2iz}}{4}
      $$

      ### 4 · Conclusión

      Los dos miembros son la misma expresión:

      $$
      \cos^{2}z = \frac{2+e^{2iz}+e^{-2iz}}{4} = \frac{1+\cos 2z}{2}
      $$

      En ningún paso se ha supuesto nada sobre $z$ —ni que sea real, ni que
      esté en ninguna región—, así que la igualdad vale **para todo
      $z \in \mathbb{C}$**, que es lo que se pedía. $\blacksquare$

      ### 5 · Comprobación numérica

      No forma parte de la demostración, pero detecta errores de signo. Con
      $z = i$:

      $$
      \cos i = \frac{e^{-1}+e^{1}}{2} = \cosh 1 \approx 1{,}5431
      \;\Longrightarrow\;
      \cos^{2}(i) \approx 2{,}3811
      $$

      $$
      \frac{1+\cos 2i}{2} = \frac{1+\cosh 2}{2}
      \approx \frac{1+3{,}7622}{2} \approx 2{,}3811
      $$

      Coinciden. Y de paso se ve lo que en $\mathbb{R}$ sería imposible: el
      cuadrado de un coseno **mayor que 1**.

      ### 6 · La familia de esta identidad

      Es la gemela del ejercicio 1.27 del boletín,
      $\mathrm{sen}^{2}z = \frac{1-\cos 2z}{2}$: misma técnica, un signo de
      diferencia. Sumando las dos se recupera
      $\mathrm{sen}^{2}z+\cos^{2}z = 1$, que también vale en $\mathbb{C}$ —y
      que, ojo, **no** implica que seno y coseno estén acotados, porque los dos
      sumandos pueden ser grandes y de signos contrarios.

      ### Resultado

      $$
      \boxed{\;\cos^{2} z = \frac{1+\cos 2z}{2}
      \quad\text{para todo } z \in \mathbb{C}\;}
      $$

  - id: ex2223-3-desigualdad-al-limite
    titulo: La desigualdad que sobrevive al límite (otra vez)
    fuente: >-
      Ejercicio 3 · Primera evaluación, 24 de octubre de 2022 · Cálculo,
      UPV/EHU · Enunciado idéntico al ejercicio 3 de 2023-2024 y al 2.5 del
      boletín. El examen no publica solución: la demostración es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 0
      comp4: 10

    nivel: examen
    enunciado: |
      Demostrar la siguiente propiedad. Sean $\{x_n\}_{n\in\mathbb{N}}$ e
      $\{y_n\}_{n\in\mathbb{N}}$ dos sucesiones tales que
      $x_n \le y_n \;\; \forall n \in \mathbb{N}$ y
      $\lim_{n\to\infty} x_n = x \;\wedge\; \lim_{n\to\infty} y_n = y$.
      Entonces $x \le y$.
    pide: Demostrar la propiedad.

    pasos:
      - tipo: reconocer
        pregunta: |
          Este enunciado ya ha caído antes, palabra por palabra. ¿Qué conviene
          sacar de ahí?
        opciones:
          - texto: >-
              Que los enunciados se repiten, y que las demostraciones del
              boletín se estudian como se estudia una fórmula
            correcta: true
            mensaje: |
              Este mismo enunciado es el ejercicio 3 de 2023-2024 y el 2.5 del
              boletín del tema 2. Tres apariciones del mismo texto. Las
              demostraciones del temario no son relleno: son preguntas de examen
              con nombre y apellidos.
          - texto: Que ya no volverá a caer, porque se repitió dos años
            mensaje: |
              Al contrario: que haya caído dos años seguidos es la razón para
              tenerla preparada, no para descartarla. Un enunciado que se repite
              es un enunciado que el departamento considera básico.
          - texto: Que basta con copiar la respuesta del año anterior
            mensaje: |
              Copiarla sin entenderla no protege de nada: basta que cambien
              $\le$ por $<$, o que pidan el recíproco, para que la copia deje de
              servir. Lo que hay que tener es el mecanismo.
          - texto: Que el examen es siempre el mismo
            mensaje: |
              No lo es: los otros tres ejercicios cambian todos los años. Lo que
              se repite son las demostraciones del temario, que son un catálogo
              corto y cerrado.

      - tipo: calcular
        titulo: El épsilon
        pregunta: |
          Se supone $x>y$ para el absurdo. Con $x=1$ e $y=0{,}4$, ¿qué
          $\varepsilon$ conviene tomar?
        respuesta:
          tipo: numero
          valor: '0.3'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.6'
            mensaje: |
              $0{,}6$ es la distancia entera, $x-y$. Con ese épsilon los dos
              entornos se tocan en el punto medio y la contradicción deja de ser
              estricta.
          - valor: '0.7'
            mensaje: |
              $0{,}7$ es el punto medio entre $0{,}4$ y 1. Aparece en la
              demostración como frontera entre los dos entornos, pero no es el
              épsilon: el épsilon es la distancia **desde** ese punto medio.
          - valor: '0.5'
            mensaje: |
              $0{,}5$ es la mitad de $x$, no la mitad de la distancia entre los
              dos límites, que es $\frac{1-0{,}4}{2} = 0{,}3$.
        pista: |
          La distancia entre los dos límites es $x-y = 0{,}6$. La mitad.
        desarrollo: |
          $$
          \varepsilon = \frac{x-y}{2} = \frac{1-0{,}4}{2} = 0{,}3
          $$

          Con ese valor, a partir de cierto índice
          $x_n > x-\varepsilon = 0{,}7$ e $y_n < y+\varepsilon = 0{,}7$, luego
          $y_n < x_n$, en contra de la hipótesis.
        veredicto: |
          Cuarto examen seguido con el mismo épsilon. La mitad de la distancia
          es, con diferencia, la herramienta más rentable del tema.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Por reducción al absurdo, supongamos $x>y$, y sea
              $\varepsilon = \dfrac{x-y}{2} > 0$.
          - texto: |
              Existe $m_1$ tal que $x_n > x-\varepsilon = \dfrac{x+y}{2}$ para
              todo $n>m_1$.
          - texto: |
              Existe $m_2$ tal que $y_n < y+\varepsilon = \dfrac{x+y}{2}$ para
              todo $n>m_2$.
          - texto: |
              Para $n > \max(m_1,m_2)$ valen las dos, y entonces
              $y_n < \dfrac{x+y}{2} < x_n$, en contra de $x_n \le y_n$.
          - texto: |
              Luego la suposición era falsa y $x \le y$.
          - texto: |
              Basta tomar $m_1$, porque las dos sucesiones convergen a la vez.
            trampa: true
            mensaje: |
              Convergen las dos, pero **no al mismo ritmo**. Cada una da su
              propio índice a partir del cual se cumple su desigualdad, y no hay
              ninguna razón para que coincidan. Hace falta el mayor de los dos
              para poder usar las dos condiciones en el **mismo** $n$, que es lo
              único que permite encadenarlas.
        veredicto: |
          El $\max(m_1,m_2)$ es la pieza que distingue una demostración cuidada
          de una que «se entiende». Y es la que se olvida.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > demostración propuesta, pendiente de revisión.

      **Datos.** $x_n \le y_n$ para todo $n$, $x_n \to x$ e $y_n \to y$. Hay que
      demostrar que $x \le y$.

      **Reparto de puntos del examen:** COMP4 10.

      > **Este enunciado ha caído al menos tres veces**: aquí, en el ejercicio 3
      > de 2023-2024 y como ejercicio 2.5 del boletín del tema 2. Es la razón
      > más concreta que hay para hacer las demostraciones del boletín en vez de
      > saltárselas.

      ### 1 · Estrategia

      Reducción al absurdo. La negación de $x \le y$ es $x > y$, y de esa
      diferencia positiva sale el épsilon.

      La definición, escrita, porque forma parte de lo que se puntúa:

      $$
      \lim a_n = a \iff
      \forall \varepsilon>0\;\exists\, m \in \mathbb{N} :\;
      n>m \Rightarrow \left|a_n-a\right| < \varepsilon
      $$

      ### 2 · La demostración

      Supongamos $x>y$ y tomemos

      $$
      \varepsilon = \frac{x-y}{2} > 0
      $$

      Por converger $\{x_n\}$, existe $m_1$ tal que para todo $n>m_1$

      $$
      \left|x_n-x\right| < \varepsilon
      \;\Longrightarrow\;
      x_n > x-\varepsilon = \frac{x+y}{2}
      $$

      Por converger $\{y_n\}$, existe $m_2$ tal que para todo $n>m_2$

      $$
      \left|y_n-y\right| < \varepsilon
      \;\Longrightarrow\;
      y_n < y+\varepsilon = \frac{x+y}{2}
      $$

      Tomando $n > \max(m_1,m_2)$ se cumplen **las dos a la vez**:

      $$
      y_n < \frac{x+y}{2} < x_n
      $$

      es decir $y_n < x_n$, en contra de la hipótesis. Contradicción, luego
      $x \le y$. $\blacksquare$

      ### 3 · Los dos puntos que se pierden

      **El $\max(m_1,m_2)$.** Las dos sucesiones convergen, pero cada una a su
      ritmo: sus índices no tienen por qué coincidir. Sin el máximo no se sabe
      que las dos desigualdades valen en el mismo $n$, y sin eso no se pueden
      encadenar.

      **La desigualdad se debilita.** Aunque la hipótesis fuera estricta,
      $x_n < y_n$, la conclusión seguiría siendo $x \le y$. Contraejemplo:
      $x_n = 0$ e $y_n = \frac1n$, que cumplen $x_n < y_n$ siempre y tienen el
      mismo límite.

      ### 4 · Comprobación

      Con $x=1$ e $y=0{,}4$, construyendo dos sucesiones con esos límites y
      viendo que la hipótesis se rompe sola:

      $$
      x_n = 1-\frac{1}{n} \;\to\; 1, \qquad y_n = 0{,}4+\frac{1}{n} \;\to\; 0{,}4
      $$

      | $n$ | $x_n$ | $y_n$ | ¿$x_n \le y_n$? |
      |---|---|---|---|
      | 1 | $0$ | $1{,}4$ | sí |
      | 2 | $0{,}5$ | $0{,}9$ | sí |
      | 3 | $0{,}67$ | $0{,}73$ | sí |
      | 4 | $0{,}75$ | $0{,}65$ | **no** |

      Se invierte en $n=4$ y ya no vuelve. Con $\varepsilon = 0{,}3$ hace falta
      $\frac1n < 0{,}3$, o sea $n>3{,}33$: los dos índices valen 3, y el cruce
      aparece justo después de $\max(m_1,m_2) = 3$.

      ### Resultado

      $$
      \boxed{\;x_n \le y_n \;\;\forall n,\;\; x_n \to x,\;\; y_n \to y
      \;\;\Longrightarrow\;\; x \le y\;}
      $$

  - id: ex2223-4-definiciones-y-serie
    titulo: Cuatro definiciones y una serie que no puede converger
    fuente: >-
      Ejercicio 4 · Primera evaluación, 24 de octubre de 2022 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 1
      comp4: 7

    nivel: examen
    enunciado: |
      **a)** Definir formalmente los siguientes conceptos: sucesión creciente,
      sucesión decreciente, sucesión acotada y sucesión convergente.

      **b)** Estudiar dichos conceptos para la sucesión
      $\{a_n\}_{n\in\mathbb{N}}$ definida de la siguiente forma:

      $$
      \{a_n\}_{n\in\mathbb{N}} =
      \begin{cases}
      n^{2} & n < 20 \\[8pt]
      2-\dfrac{1}{n^{2}} & n \ge 20
      \end{cases}
      $$

      **c)** Sea $\{a_n\}_{n\in\mathbb{N}}$ la sucesión definida en el apartado
      anterior. ¿Es convergente la serie
      $\displaystyle\sum_{n=1}^{\infty} a_n$?
    pide: Definir, estudiar la sucesión y decidir sobre la serie.

    pasos:
      - tipo: reconocer
        pregunta: |
          La sucesión converge a 2. ¿Qué se puede decir de la serie con eso?
        opciones:
          - texto: >-
              Que **no** converge, porque su término general no tiende a cero
            correcta: true
            mensaje: |
              Exacto. La condición necesaria dice que si $\sum a_n$ converge
              entonces $a_n \to 0$. En contrapositivo: si $a_n \to 2 \neq 0$, la
              serie diverge. Cuesta una línea y cierra el apartado (c).
          - texto: Que converge, porque la sucesión converge
            mensaje: |
              Son cosas distintas. Que los términos se estabilicen no impide que
              su suma crezca sin fin: aquí, a partir de $n=20$ se están sumando
              infinitos números cercanos a 2.
          - texto: Que hay que aplicar el criterio del cociente
            mensaje: |
              Se puede, pero es dar un rodeo. Cuando el término general no
              tiende a cero, la serie diverge y no hace falta ningún criterio
              más fino.
          - texto: Que depende de los primeros 19 términos
            mensaje: |
              Los primeros términos afectan al **valor** de una suma, no a si
              es finita. Aquí la serie diverge por la cola, no por el principio.

      - tipo: calcular
        titulo: El supremo de la sucesión
        pregunta: |
          ¿Cuál es el mayor valor que alcanza $\{a_n\}$?
        respuesta:
          tipo: numero
          valor: '361'
          tolerancia: 0.5
          formato: un número
        distractores:
          - valor: '400'
            mensaje: |
              $400 = 20^{2}$, pero el primer tramo llega solo hasta $n<20$, es
              decir hasta $n=19$. En $n=20$ ya manda la otra rama, que vale
              $2-\frac{1}{400}$.
          - valor: '2'
            mensaje: |
              2 es el límite, y también la cota superior **del segundo tramo**
              —donde $a_{20} = 2-\frac{1}{400} \approx 1{,}9975$ y los demás se
              le acercan sin llegar—. Pero el primer tramo sube mucho más:
              $19^{2} = 361$. El máximo no está en la cola.
          - valor: '19'
            mensaje: |
              19 es el **índice** del término más grande, no su valor. El
              término es $a_{19} = 19^{2} = 361$.
        pista: |
          Cuidado con el límite del primer tramo: es $n<20$, no $n\le20$.
        desarrollo: |
          El primer tramo, $n^{2}$, es creciente y llega hasta

          $$
          a_{19} = 19^{2} = 361
          $$

          porque la condición es $n<20$, estricta. El segundo tramo no pasa
          nunca de 2:

          $$
          2-\frac{1}{n^{2}} < 2 \qquad \forall n
          $$

          Así que el máximo es $361$, y se alcanza: es **máximo** y no solo
          supremo.
        veredicto: |
          El detalle del $n<20$ frente a $n\le20$ decide el número. Leer los
          extremos de cada tramo es la mitad de estos ejercicios.

      - tipo: justificar
        pregunta: |
          Ordena el estudio de la sucesión y la serie. Una de las piezas no
          debe entrar.
        piezas:
          - texto: |
              **No es creciente:** $a_{19} = 361$ y $a_{20} = 2-\frac{1}{400}
              \approx 1{,}9975$, así que $a_{20} < a_{19}$.
          - texto: |
              **No es decreciente:** en el primer tramo sube, $a_1 = 1 < 4 = a_2$.
              Hacen falta las dos comprobaciones, una por cada palabra.
          - texto: |
              **Es acotada:** $1 \le a_n \le 361$, con el mínimo en $a_1$ y el
              máximo en $a_{19}$.
          - texto: |
              **Es convergente:** la cola es $2-\frac{1}{n^{2}}$, y
              $\frac{1}{n^{2}} \to 0$, luego $\lim a_n = 2$.
          - texto: |
              **La serie NO converge:** su término general tiende a 2, no a
              cero, y eso contradice la condición necesaria.
          - texto: |
              La serie tampoco converge porque la sucesión no es monótona.
            trampa: true
            mensaje: |
              La monotonía de la sucesión no tiene nada que ver con que su serie
              converja. $\sum \frac{(-1)^{n}}{n}$ converge y su término general
              no es monótono, y $\sum\frac1n$ diverge siendo decreciente. Lo que
              decide aquí es que $a_n \to 2 \neq 0$.
        veredicto: |
          Fíjate en el orden: primero se estudia la sucesión, y el resultado de
          ese estudio —el límite 2— es lo que resuelve la serie en una línea.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** $a_n = n^{2}$ para $n<20$ y $a_n = 2-\frac{1}{n^{2}}$ para
      $n\ge20$. Se piden cuatro definiciones, su estudio en esta sucesión y la
      convergencia de la serie.

      **Reparto de puntos del examen:** COMP1 2 · COMP2 1 · COMP4 7. **Un solo
      punto de cálculo.** Casi todo es definir bien y razonar.

      ### 1 · Apartado (a): las cuatro definiciones

      $$
      \{a_n\} \text{ creciente} \iff a_{n+1} > a_n \quad \forall n \in \mathbb{N}
      $$

      $$
      \{a_n\} \text{ decreciente} \iff a_{n+1} < a_n \quad \forall n \in \mathbb{N}
      $$

      $$
      \{a_n\} \text{ acotada} \iff
      \exists\, p,q \in \mathbb{R} \;:\; p \le a_n \le q \quad \forall n \in \mathbb{N}
      $$

      $$
      \lim a_n = L \iff
      \forall \varepsilon>0 \;\exists\, m \in \mathbb{N} \;:\;
      n>m \Rightarrow \left|a_n-L\right| < \varepsilon
      $$

      Merece la pena subrayar el contraste, porque es de lo que va el apartado
      (b): las tres primeras exigen algo de **todos** los términos; la cuarta,
      solo de los que hay a partir de cierto punto.

      ### 2 · Apartado (b): los términos

      $$
      1,\; 4,\; 9,\; \dots,\; 361,\;\;
      1{,}9975,\; 1{,}9977,\; 1{,}9979,\;\dots
      $$

      El primer tramo llega hasta $a_{19} = 361$, porque la condición es
      $n<20$ **estricta**. En $n=20$ manda ya la segunda rama.

      **No es creciente.** Basta un par que lo incumpla:

      $$
      a_{19} = 361 > 1{,}9975 = a_{20}
      $$

      **No es decreciente.** También basta un par:

      $$
      a_1 = 1 < 4 = a_2
      $$

      Hay que comprobar las dos cosas por separado. Decir solo «no es
      creciente» deja abierto que sea decreciente, y no lo es.

      **Es acotada.** El mínimo es $a_1 = 1$ y el máximo $a_{19} = 361$:

      $$
      1 \le a_n \le 361 \qquad \forall n \in \mathbb{N}
      $$

      Los dos se alcanzan, así que son mínimo y máximo, no solo ínfimo y
      supremo.

      **Es convergente.** La convergencia depende solo de la cola, y los 19
      primeros términos son un número finito:

      $$
      \lim_{n\to\infty} a_n = \lim_{n\to\infty}\left(2-\frac{1}{n^{2}}\right) = 2
      $$

      La sucesión converge **sin ser monótona**, que es el recordatorio de que
      el teorema «monótona y acotada implica convergente» da una condición
      suficiente, no necesaria.

      ### 3 · Apartado (c): la serie

      Aquí el apartado anterior lo resuelve en una línea. La **condición
      necesaria** dice:

      $$
      \sum a_n \text{ converge} \;\Longrightarrow\; a_n \to 0
      $$

      En contrapositivo: si $a_n \not\to 0$, la serie diverge. Y acabamos de
      calcular que $a_n \to 2 \neq 0$.

      $$
      \boxed{\;\text{La serie } \sum_{n=1}^{\infty} a_n \text{ NO converge}\;}
      $$

      De hecho diverge a $+\infty$: a partir de $n=20$ se están sumando
      infinitos términos, todos mayores que $1{,}99$.

      **La advertencia gemela**, que conviene dejar escrita: que el término
      general tienda a cero **no** garantiza la convergencia. La serie armónica
      $\sum\frac1n$ lo cumple y suma infinito. La condición sirve para
      descartar, nunca para confirmar.

      ### 4 · Comprobación

      **Del máximo**, que es donde está la trampa del enunciado: si el primer
      tramo fuera $n\le20$, el máximo sería $400$. Como es $n<20$, es
      $19^{2}=361$. Se comprueba evaluando la otra rama en $n=20$:
      $2-\frac{1}{400} = 1{,}9975$, que efectivamente es lo que vale $a_{20}$ ✔

      **Del límite**, con $\varepsilon = 10^{-3}$:

      $$
      \left|2-\frac{1}{n^{2}}-2\right| = \frac{1}{n^{2}} < 10^{-3}
      \;\Longleftrightarrow\; n > 31{,}6
      $$

      Sirve $m = 32$, que es mayor que 20: la condición cae de lleno en el
      segundo tramo, como tenía que ser ✔

      **De la divergencia**, con una cota por debajo: para $N>20$,

      $$
      \sum_{n=1}^{N} a_n > \sum_{n=20}^{N} 1{,}99 = 1{,}99\,(N-19)
      \;\xrightarrow[N\to\infty]{}\; \infty
      $$

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \text{(b) } & \text{ni creciente ni decreciente; acotada } 1 \le a_n \le 361;
      \text{ convergente con } L=2 \\[4pt]
      \text{(c) } & \text{la serie no converge, porque } a_n \to 2 \neq 0
      \end{aligned}}
      $$
