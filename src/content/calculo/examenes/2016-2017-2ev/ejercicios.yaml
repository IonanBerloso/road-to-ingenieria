      <figcaption>
      Figura redibujada del enunciado original, esquematica: lo que importa son
      los dos extremos del tramo conocido y su vertice. A la derecha de x igual
      a tres no hay curva, y eso es lo que hay que construir.
      </figcaption>
      </figure>

      **a)** Estudiar la derivabilidad de $y(x)$ en el punto $x=3$.

      **b)** Calcular la expresión analítica de $y(x)$ en el intervalo $[3,7]$ y
      representarla gráficamente sobre la figura.

      **c)** Calcular la velocidad media $M$ de $y(x)$ en $[-5,7]$.

      **d)** Estudiar la existencia de un punto $z \in (-5,7)$ tal que
      $y'(z) = M$ y hallar dicho punto en el caso de que exista.
    pide: Resolver los cuatro apartados.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que en $(3,7]$ «la velocidad se mantiene
          constante». ¿Qué función es esa velocidad?
        opciones:
          - texto: >-
              $y'(x)$, y mantenerla constante significa que ese tramo es una
              **recta**
            correcta: true
            mensaje: |
              Exacto. Velocidad de $y$ respecto a $x$ es $y'$, y una función con
              derivada constante es una recta de esa pendiente. El enunciado
              está describiendo una prolongación **lineal**.
          - texto: >-
              $y(x)$, y mantenerla constante significa que el tramo es
              horizontal
            mensaje: |
              Eso sería si se mantuviera constante la **altura**. La velocidad
              es la derivada.
          - texto: $y''(x)$
            mensaje: |
              $y''$ es la aceleración. Mantener constante la aceleración daría
              una parábola, no una recta.
          - texto: >-
              La velocidad media en todo el intervalo
            mensaje: |
              La velocidad media es un promedio sobre un intervalo; aquí se
              habla de la velocidad **en el punto** $x=3$.

      - tipo: calcular
        titulo: La pendiente heredada
        pregunta: |
          ¿Cuánto vale $y'(3)$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '1.75'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es $y(3)$, el valor de la función. La derivada es
              $\frac{x}{2}+\frac14$.
          - valor: '1.5'
            mensaje: |
              $1{,}5$ es $\frac{3}{2}$: te has dejado el $\frac14$ que aporta el
              término lineal de la parábola.
          - valor: '0.25'
            mensaje: |
              $0{,}25$ es $y'(0)$, la pendiente en el origen.
        pista: |
          $y'(x) = \frac{x}{2}+\frac14$.
        desarrollo: |
          $$
          y(x) = \frac{x^{2}}{4}+\frac{x}{4}-2
          \;\Longrightarrow\;
          y'(x) = \frac{x}{2}+\frac14
          $$

          $$
          y'(3) = \frac32+\frac14 = \frac{7}{4} = 1{,}75
          $$

          Y el valor de la función ahí:

          $$
          y(3) = \frac94+\frac34-2 = 3-2 = 1
          $$
        veredicto: |
          Como la prolongación hereda exactamente esa pendiente, **la función
          es derivable en $x=3$**: no hay pico. Ese es el apartado (a).

      - tipo: calcular
        titulo: La velocidad media
        pregunta: |
          ¿Cuánto vale la velocidad media $M$ en $[-5,7]$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.4167'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '1.75'
            mensaje: |
              $1{,}75$ es la velocidad **instantánea** en $x=3$ y en todo el
              tramo recto. La media es bastante menor, porque en la primera
              parte la función baja.
          - valor: '0.8333333'
            mensaje: |
              $\frac56$ sale de dividir entre 6 en vez de entre 12. La longitud
              del intervalo es $7-(-5) = 12$.
          - valor: '5'
            mensaje: |
              5 es la **diferencia** $y(7)-y(-5) = 8-3$. Falta dividir entre la
              longitud del intervalo.
        pista: |
          $M = \frac{y(7)-y(-5)}{12}$, y $y(7)$ sale del tramo recto.
        desarrollo: |
          **En el extremo izquierdo**, con la parábola:

          $$
          y(-5) = \frac{25}{4}-\frac54-2 = 5-2 = 3
          $$

          **En el derecho**, con la recta $y = 1+\frac74(x-3)$:

          $$
          y(7) = 1+\frac74\cdot4 = 1+7 = 8
          $$

          $$
          M = \frac{y(7)-y(-5)}{7-(-5)} = \frac{8-3}{12} = \frac{5}{12}
          \approx 0{,}4167
          $$
        veredicto: |
          La media, $0{,}42$, es mucho menor que la velocidad del tramo recto,
          $1{,}75$: en la primera mitad la parábola **baja**, y eso tira la
          media hacia abajo.

      - tipo: justificar
        pregunta: |
          Ordena el apartado (d). Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Comprobar las hipótesis de Lagrange.** $y$ es continua en
              $[-5,7]$ —lo dice el enunciado— y derivable en $(-5,7)$, porque
              en $x=3$ las dos pendientes coinciden, según el apartado (a).
          - texto: |
              Luego el teorema **garantiza** que existe $z$ con
              $y'(z) = M = \frac{5}{12}$. No hay que discutir si existe: existe.
          - texto: |
              **Buscarlo en el tramo recto**, donde $y' = \frac74$ constante:
              $\frac74 \neq \frac{5}{12}$, así que ahí no está.
          - texto: |
              **Buscarlo en la parábola**, donde
              $y'(x) = \frac x2+\frac14$:
              $\frac{z}{2}+\frac14 = \frac{5}{12}$ da
              $\frac z2 = \frac16$, es decir $z = \frac13$.
          - texto: |
              Y $\frac13 \in (-5,3)$, así que es válido. Es el **único**, porque
              en el tramo recto la derivada es constante y distinta.
          - texto: |
              Como la función es derivable en todo el intervalo, el punto $z$ es
              único por el teorema de Lagrange.
            trampa: true
            mensaje: |
              Lagrange garantiza **al menos uno**, nunca la unicidad. Aquí el
              punto resulta ser único, pero eso hay que **comprobarlo** viendo
              que en el tramo recto la derivada vale $\frac74$ y nunca
              $\frac5{12}$. En otro problema podría haber varios.
        veredicto: |
          El apartado (d) tiene dos mitades: que **existe** —lo da Lagrange— y
          **dónde está** —hay que buscarlo tramo a tramo—. Las dos puntúan.

    resolucion: |
      **Datos.** $y(x) = \frac{x^{2}}{4}+\frac{x}{4}-2$ en $[-5,3]$, y en
      $(3,7]$ la velocidad se mantiene constante e igual a la de $x=3$.

      ### 1 · Lo que se sabe del tramo conocido

      $$
      y'(x) = \frac{x}{2}+\frac14
      $$

      $$
      y(3) = \frac94+\frac34-2 = 1,
      \qquad
      y'(3) = \frac32+\frac14 = \frac74
      $$

      $$
      y(-5) = \frac{25}{4}-\frac54-2 = 3
      $$

      La parábola tiene su vértice donde $y'=0$, es decir en
      $x = -\frac12$, con $y\left(-\frac12\right) = -\frac{33}{16}
      \approx -2{,}06$.

      ### 2 · Apartado (a): derivabilidad en $x=3$

      «La velocidad se mantiene constante e igual a la del punto $x=3$»
      significa

      $$
      y'(x) = \frac74 \qquad \text{para } x \in (3,7]
      $$

      y en particular $y'(3^{+}) = \frac74$.

      Por la izquierda, $y'(3^{-}) = \frac74$ también.

      $$
      \boxed{y \text{ ES derivable en } x=3, \text{ con } y'(3) = \frac74}
      $$

      **No hay pico.** La prolongación empalma con la parábola de forma suave, y
      eso es exactamente lo que va a permitir aplicar Lagrange en el apartado
      (d).

      ### 3 · Apartado (b): la expresión en $[3,7]$

      Una función con derivada constante es una **recta** de esa pendiente. Y
      pasa por $(3,1)$:

      $$
      \boxed{y(x) = 1+\frac74(x-3) = \frac{7x}{4}-\frac{17}{4}
      \qquad x\in[3,7]}
      $$

      $$
      y(7) = 1+\frac74\cdot4 = 8
      $$

      Gráficamente, la recta tangente a la parábola en $x=3$, prolongada hasta
      el final.

      ### 4 · Apartado (c): la velocidad media

      $$
      M = \frac{y(7)-y(-5)}{7-(-5)} = \frac{8-3}{12}
      $$

      $$
      \boxed{M = \frac{5}{12} \approx 0{,}4167}
      $$

      Nótese lo pequeña que es comparada con la del tramo recto, $\frac74$: en
      la primera parte la función **baja** hasta el vértice, y eso rebaja la
      media.

      ### 5 · Apartado (d): el punto de Lagrange

      **Que existe.** $y$ es continua en $[-5,7]$ —dato del enunciado— y
      derivable en $(-5,7)$ —lo acaba de establecer el apartado (a)—. El
      teorema de Lagrange garantiza que existe $z$ con $y'(z) = M$.

      **Dónde está.** Hay que buscarlo tramo a tramo:

      | tramo | $y'$ | ¿vale $\frac5{12}$? |
      |---|---|---|
      | $(3,7)$ | $\frac74$ constante | **no** |
      | $(-5,3)$ | $\frac x2+\frac14$ | hay que resolver |

      $$
      \frac{z}{2}+\frac14 = \frac{5}{12}
      \;\Longrightarrow\;
      \frac{z}{2} = \frac{5}{12}-\frac{3}{12} = \frac{2}{12} = \frac16
      $$

      $$
      \boxed{z = \frac13}
      $$

      Y $\frac13 \in (-5,3)$ ✔

      **Que es único.** En el tramo recto la derivada es constante y distinta de
      $M$, y en la parábola la derivada es estrictamente creciente, así que toma
      cada valor una sola vez. Lagrange garantizaba *al menos* uno; aquí resulta
      haber exactamente uno, y eso hay que comprobarlo.

      ### 6 · Comprobación

      **Del punto:**

      $$
      y'\!\left(\tfrac13\right) = \frac{1/3}{2}+\frac14
      = \frac16+\frac14 = \frac{2+3}{12} = \frac{5}{12} \quad\checkmark
      $$

      **De la velocidad media, por otra vía.** La media de una derivada sobre un
      intervalo es su valor medio integral:

      $$
      \frac{1}{12}\int_{-5}^{7}y'(x)\,dx = \frac{y(7)-y(-5)}{12}
      $$

      que es la misma cuenta ✔ El teorema fundamental garantiza que las dos
      lecturas coinciden.

      **De la continuidad y la derivabilidad en el empalme:**

      $$
      \text{valor: } 1 = 1 \quad\checkmark
      \qquad
      \text{pendiente: } \tfrac74 = \tfrac74 \quad\checkmark
      $$

      **De coherencia.** El valor $z=\frac13$ está a la derecha del vértice
      $\left(-\frac12\right)$, donde la parábola ya sube. Tiene sentido: la
      pendiente media es positiva, así que el punto donde se alcanza tiene que
      estar en la zona creciente ✔
