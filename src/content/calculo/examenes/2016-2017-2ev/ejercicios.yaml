ejercicios:
  - id: ex1617-2ev-1-cociente-real-o-imaginario
    titulo: Un cociente, real primero e imaginario después
    fuente: >-
      Ejercicio 1 · Segunda evaluación, 28 de noviembre de 2016 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3

    nivel: examen
    enunciado: |
      Calcular y representar gráficamente el lugar geométrico de los afijos de
      los números complejos $z$ que verifican las siguientes condiciones:

      **a)** $\dfrac{z-i}{z+i}$ es real

      **b)** $\dfrac{z-i}{z+i}$ es imaginario puro
    pide: Calcular y representar los dos lugares geométricos.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la vía más corta para atacar los dos apartados a la vez?
        opciones:
          - texto: >-
              Racionalizar **una sola vez** y quedarse con las dos componentes:
              anular la imaginaria da (a) y anular la real da (b)
            correcta: true
            mensaje: |
              Exacto. Un solo cálculo sirve para los dos apartados, y además
              deja ver de golpe la estructura: la parte real resulta ser
              $x^{2}+y^{2}-1$ y la imaginaria $-2x$. Una circunferencia y una
              recta, cada una para su apartado.
          - texto: >-
              Trabajar en polar con los argumentos
            mensaje: |
              Funciona para cocientes de complejos **fijos**, pero aquí $z$
              aparece arriba y abajo: los dos argumentos dependen de la
              incógnita y restarlos no simplifica nada.
          - texto: >-
              Elevar al cuadrado los dos miembros
            mensaje: |
              No hay ninguna igualdad que elevar: las condiciones son «ser
              real» y «ser imaginario puro», no una ecuación.
          - texto: >-
              Resolver (a) y luego repetir todo el cálculo para (b)
            mensaje: |
              Se puede, pero es hacer dos veces el mismo trabajo. La
              racionalización ya produce las dos partes.

      - tipo: calcular
        titulo: La parte imaginaria del cociente
        pregunta: |
          Tras racionalizar, la parte imaginaria del numerador es $kx$. ¿Cuánto
          vale $k$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Falta el signo. Los dos términos cruzados son
              $-x(y+1)$ y $+x(y-1)$, y su suma es $-2x$.
          - valor: '-1'
            mensaje: |
              $-1$ saldría de quedarse con un solo término cruzado. Hay dos, y
              se refuerzan.
          - valor: '0'
            mensaje: |
              Si fuera 0 la condición (a) se cumpliría siempre, y el lugar
              geométrico sería todo el plano. No lo es.
        pista: |
          Multiplica $x+(y-1)i$ por $x-(y+1)i$ y agrupa lo imaginario.
        desarrollo: |
          Con $z = x+yi$:

          $$
          \frac{z-i}{z+i} = \frac{x+(y-1)i}{x+(y+1)i}
          $$

          Multiplicando arriba y abajo por el conjugado del denominador:

          $$
          = \frac{\left[x+(y-1)i\right]\left[x-(y+1)i\right]}
          {x^{2}+(y+1)^{2}}
          $$

          El numerador:

          $$
          x^{2}-x(y+1)i+x(y-1)i-(y-1)(y+1)i^{2}
          $$

          $$
          = \underbrace{x^{2}+y^{2}-1}_{\text{real}}
          + \underbrace{x\left[-(y+1)+(y-1)\right]}_{\text{imaginaria}}i
          $$

          Y el corchete se simplifica:

          $$
          -(y+1)+(y-1) = -2
          $$

          Luego la parte imaginaria es $-2x$, y $k = -2$.
        veredicto: |
          Que los términos en $y$ se cancelen y quede solo $-2x$ es lo que hace
          que el apartado (a) dé una recta tan simple.

      - tipo: calcular
        titulo: El radio de la circunferencia
        pregunta: |
          El lugar del apartado (b) es una circunferencia centrada en el origen.
          ¿Cuál es su radio?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 saldría de $x^{2}+y^{2} = 4$. La condición es
              $x^{2}+y^{2}-1 = 0$, es decir radio 1.
          - valor: '0'
            mensaje: |
              Con radio 0 el lugar sería solo el origen, y ahí el cociente vale
              $\frac{-i}{i} = -1$: **real**, no imaginario puro.
          - valor: '1.4142136'
            mensaje: |
              $\sqrt2$ saldría de $x^{2}+y^{2} = 2$. El término independiente es
              $-1$.
        pista: |
          Imaginario puro significa **parte real nula**.
        desarrollo: |
          «Imaginario puro» significa que la **parte real** se anula:

          $$
          x^{2}+y^{2}-1 = 0
          \;\Longrightarrow\;
          x^{2}+y^{2} = 1
          $$

          Es la **circunferencia unidad**: centro en el origen y radio 1.

          Hay que excluir dos puntos:

          - $z = -i$, donde el denominador se anula;
          - $z = i$, donde el numerador se anula y el cociente vale 0, que no
            es imaginario puro.
        veredicto: |
          Los dos puntos excluidos son precisamente los que aparecen en el
          enunciado, $\pm i$, y los dos están **sobre** la circunferencia. No
          es casualidad: son los que hacen degenerar el cociente.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Racionalizar una vez.** Con $z=x+yi$, el cociente vale
              $\dfrac{\left(x^{2}+y^{2}-1\right)-2xi}{x^{2}+(y+1)^{2}}$.
          - texto: |
              **(a) Real** ⟺ parte imaginaria nula ⟺ $-2x = 0$ ⟺ $x=0$: el
              **eje imaginario**.
          - texto: |
              **(b) Imaginario puro** ⟺ parte real nula ⟺
              $x^{2}+y^{2} = 1$: la **circunferencia unidad**.
          - texto: |
              **Excluir los puntos degenerados.** En $z=-i$ el denominador se
              anula, así que ese punto sale de los dos lugares. Y en $z=i$ el
              cociente vale 0, que no es imaginario puro: sale de (b).
          - texto: |
              **El dibujo:** una recta vertical y una circunferencia, que se
              cortan justo en los dos puntos excluidos.
          - texto: |
              Como el denominador $x^{2}+(y+1)^{2}$ es siempre positivo, no hace
              falta excluir ningún punto.
            trampa: true
            mensaje: |
              Es positivo **salvo** en un punto: se anula cuando $x=0$ e
              $y=-1$, es decir en $z=-i$. Y ese punto está justo sobre los dos
              lugares geométricos, así que hay que quitarlo expresamente. Los
              denominadores hay que mirarlos siempre, y más cuando el resultado
              pasa por donde se anulan.
        veredicto: |
          La recta y la circunferencia se cortan exactamente en $i$ y $-i$, los
          dos puntos excluidos. El dibujo lo explica solo.

    resolucion: |
      **Datos.** El cociente $\frac{z-i}{z+i}$, real en (a) e imaginario puro en
      (b).

      ### 1 · Un solo cálculo para los dos apartados

      La condición de «ser real» y la de «ser imaginario puro» son
      complementarias: una anula la parte imaginaria y la otra la real. Así que
      **basta racionalizar una vez** y quedarse con las dos componentes.

      Con $z = x+yi$:

      $$
      \frac{z-i}{z+i} = \frac{x+(y-1)i}{x+(y+1)i}
      = \frac{\left[x+(y-1)i\right]\left[x-(y+1)i\right]}{x^{2}+(y+1)^{2}}
      $$

      Desarrollando el numerador:

      $$
      x^{2}-x(y+1)i+x(y-1)i+(y-1)(y+1)
      $$

      —el último término cambia de signo porque $i^{2}=-1$—:

      $$
      = \left(x^{2}+y^{2}-1\right)+x\left[(y-1)-(y+1)\right]i
      = \left(x^{2}+y^{2}-1\right)-2x\,i
      $$

      $$
      \boxed{\frac{z-i}{z+i}
      = \frac{\left(x^{2}+y^{2}-1\right)-2x\,i}{x^{2}+(y+1)^{2}}}
      $$

      El denominador es real y positivo, así que **no afecta a los signos**:
      todo se decide en el numerador.

      ### 2 · Apartado (a): real

      Un complejo es real cuando su parte imaginaria se anula:

      $$
      -2x = 0
      \;\Longrightarrow\;
      x = 0
      $$

      $$
      \boxed{\text{El EJE IMAGINARIO, salvo el punto } z=-i}
      $$

      Y el resultado tiene sentido: si $z$ está sobre el eje imaginario,
      $z-i$ y $z+i$ también lo están, y el cociente de dos imaginarios puros es
      real.

      ### 3 · Apartado (b): imaginario puro

      Ahora se anula la parte **real**:

      $$
      x^{2}+y^{2}-1 = 0
      \;\Longrightarrow\;
      x^{2}+y^{2} = 1
      $$

      $$
      \boxed{\text{La CIRCUNFERENCIA UNIDAD, salvo } z=\pm i}
      $$

      ### 4 · Los puntos que hay que excluir

      | punto | por qué |
      |---|---|
      | $z = -i$ | anula el **denominador**: el cociente no existe |
      | $z = i$ | anula el **numerador**: el cociente vale 0, que no es imaginario puro |

      Los dos están sobre la circunferencia, y $-i$ además sobre el eje
      imaginario. Es lo que hace que los dos lugares **se corten exactamente en
      los puntos prohibidos**.

      Cuánto se excluye el 0 depende del convenio —hay textos que lo consideran
      imaginario puro—, pero conviene mencionarlo: es un punto de COMP4.

      ### 5 · El dibujo

      - **(a)** una **recta vertical**, el eje $OY$, con un agujero en $-i$;
      - **(b)** una **circunferencia** de centro el origen y radio 1, con
        agujeros en $i$ y $-i$.

      La recta pasa por el centro de la circunferencia y la corta justo en los
      dos puntos excluidos.

      ### 6 · Comprobación

      **Del apartado (a)**, con $z = 2i$:

      $$
      \frac{2i-i}{2i+i} = \frac{i}{3i} = \frac13
      $$

      Real ✔

      **Del apartado (b)**, con $z = 1$ —que está en la circunferencia—:

      $$
      \frac{1-i}{1+i} = \frac{(1-i)^{2}}{2} = \frac{1-2i-1}{2} = -i
      $$

      Imaginario puro ✔

      **Con otro punto de la circunferencia**, $z = \frac{\sqrt3}{2}+\frac12 i$:

      $$
      \text{parte real del numerador} = \frac34+\frac14-1 = 0 \quad\checkmark
      $$

      **De que la recta y la circunferencia se cortan donde se dice.** El eje
      imaginario corta $x^{2}+y^{2}=1$ en $y=\pm1$, es decir en $i$ y $-i$ ✔

  - id: ex1617-2ev-2-fermat-y-la-inversa
    titulo: Dos propiedades encadenadas
    fuente: >-
      Ejercicio 2 · Segunda evaluación, 28 de noviembre de 2016 · Cálculo,
      UPV/EHU · El apartado (a) volvió a caer en la segunda evaluación de
      2019-2020 · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 3
      comp4: 5

    nivel: examen
    enunciado: |
      Demostrar analíticamente las siguientes propiedades:

      **a)** Sea $x_0$ un máximo de $y(x)$ en $D$. Si $y(x)$ es derivable en
      $x_0$ entonces $y'(x_0) = 0$.

      **b)** Sea $y(x)$ una función dos veces derivable, creciente y cóncava en
      el intervalo $(a,b)$. Entonces $y^{-1}(x)$ es convexa en $(a,b)$.
    pide: Demostrar las dos propiedades.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace falta para que el apartado (b) tenga sentido siquiera?
        opciones:
          - texto: >-
              Que $y^{-1}$ **exista**, y eso lo garantiza que $y$ sea
              estrictamente creciente
            correcta: true
            mensaje: |
              Exacto, y es lo primero que hay que decir. Una función solo tiene
              inversa si es inyectiva, y una función estrictamente creciente lo
              es. Sin ese paso el enunciado habla de algo que podría no existir.
          - texto: Que $y$ sea positiva
            mensaje: |
              El signo de $y$ no interviene. Lo que hace falta es que sea
              inyectiva.
          - texto: Que $y$ sea cóncava
            mensaje: |
              La concavidad se usa después, para el signo. Para que la inversa
              exista basta con que sea inyectiva.
          - texto: >-
              Que $y$ sea dos veces derivable
            mensaje: |
              Eso hace falta para hablar de la **convexidad** de la inversa,
              pero no para que la inversa exista.

      - tipo: calcular
        titulo: El signo del denominador
        pregunta: |
          En $\left(y^{-1}\right)'' = \dfrac{-y''}{\left(y'\right)^{3}}$
          —con todo evaluado en $y^{-1}(x)$—, ¿qué signo tiene el denominador?
          Responde 1 si positivo, $-1$ si negativo.
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.1
          formato: 1 o -1
        distractores:
          - valor: '-1'
            mensaje: |
              $y$ es **creciente**, luego $y'>0$; y el cubo de un número
              positivo es positivo. Si $y$ fuera decreciente el cubo sería
              negativo y la conclusión se invertiría.
          - valor: '0'
            mensaje: |
              No puede ser cero: si $y'$ se anulara, la fórmula de la derivada
              de la inversa no valdría. Que $y$ sea **estrictamente** creciente
              lo impide.
        pista: |
          $y$ es creciente, así que $y'>0$. ¿Y el cubo de un positivo?
        desarrollo: |
          Como $y$ es **creciente** en $(a,b)$:

          $$
          y'>0
          \;\Longrightarrow\;
          \left(y'\right)^{3} > 0
          $$

          El cubo conserva el signo —a diferencia del cuadrado, que lo
          borra—, y por eso aquí importa que sea impar.

          Y como $y$ es **cóncava**:

          $$
          y''<0
          \;\Longrightarrow\;
          -y''>0
          $$

          Así que numerador y denominador son los dos positivos y

          $$
          \left(y^{-1}\right)'' > 0
          $$

          es decir, $y^{-1}$ es **convexa**.
        veredicto: |
          Si $y$ fuera decreciente en vez de creciente, el cubo cambiaría de
          signo y la inversa saldría **cóncava**. El exponente impar es lo que
          hace que la orientación importe.

      - tipo: justificar
        pregunta: |
          Ordena el apartado (b). Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La inversa existe.** $y$ es estrictamente creciente, luego
              inyectiva, luego tiene inversa en su imagen.
          - texto: |
              **La derivada de la inversa.** De
              $y\left(y^{-1}(x)\right) = x$, derivando:
              $\left(y^{-1}\right)'(x)
              = \dfrac{1}{y'\left(y^{-1}(x)\right)}$, que exige
              $y' \neq 0$.
          - texto: |
              **La segunda derivada**, derivando otra vez y aplicando la cadena
              dos veces:
              $\left(y^{-1}\right)''(x)
              = \dfrac{-y''\left(y^{-1}(x)\right)}
              {\left[y'\left(y^{-1}(x)\right)\right]^{3}}$.
          - texto: |
              **Los signos.** $y$ creciente da $y'>0$, luego
              $\left(y'\right)^{3}>0$; e $y$ cóncava da $y''<0$, luego
              $-y''>0$.
          - texto: |
              Numerador y denominador positivos, así que
              $\left(y^{-1}\right)''>0$: la inversa es **convexa**.
              $\blacksquare$
          - texto: |
              El denominador lleva un cubo, pero como está elevado a una
              potencia el signo es positivo en cualquier caso.
            trampa: true
            mensaje: |
              **El cubo es impar y conserva el signo**: solo es positivo porque
              $y'>0$. Si $y$ fuera decreciente, $\left(y'\right)^{3}$ sería
              negativo y la inversa saldría cóncava, no convexa. Confundirlo con
              un cuadrado —que sí borra el signo— hace que la hipótesis de
              crecimiento parezca innecesaria, y es justo la que decide.
        veredicto: |
          Las dos hipótesis de (b) trabajan en sitios distintos: el crecimiento
          en el denominador y la concavidad en el numerador. Quitar cualquiera
          de las dos rompe la conclusión.

    resolucion: |
      **Enunciados.** (a) el teorema de Fermat; (b) que la inversa de una
      función creciente y cóncava es convexa.

      > El apartado (a) volvió a caer, palabra por palabra, en la segunda
      > evaluación de **2019-2020**, esa vez como ejercicio entero de 10 puntos
      > y con COMP2 = 0.

      ### 1 · Apartado (a): teorema de Fermat

      **Hipótesis.** Hay un máximo en $x_0$ —luego existe $\delta>0$ con
      $y(x) \le y(x_0)$ para $\left|x-x_0\right|<\delta$— y $y$ es derivable
      ahí. Se sobreentiende que $x_0$ es **interior**, sin lo cual no hay dos
      lados.

      **El numerador tiene signo fijo.** Para todo $h$ con
      $\left|h\right|<\delta$:

      $$
      y(x_0+h)-y(x_0) \le 0
      $$

      **Por la derecha** ($h>0$), el denominador es positivo:

      $$
      \frac{y(x_0+h)-y(x_0)}{h} \le 0
      \;\Longrightarrow\;
      y'(x_0) = \lim_{h\to0^{+}} \le 0
      $$

      **Por la izquierda** ($h<0$), el denominador es negativo y el cociente
      cambia de signo:

      $$
      \frac{y(x_0+h)-y(x_0)}{h} \ge 0
      \;\Longrightarrow\;
      y'(x_0) = \lim_{h\to0^{-}} \ge 0
      $$

      La derivabilidad garantiza que **los dos límites son el mismo número**, y
      ese número cumple $\le0$ y $\ge0$ a la vez:

      $$
      \boxed{y'(x_0) = 0} \qquad \blacksquare
      $$

      ### 2 · Apartado (b): lo primero, que la inversa exista

      $y$ es **creciente** en $(a,b)$, luego inyectiva, luego admite inversa en
      su imagen. Decirlo es el primer punto: sin esto, el enunciado habla de una
      función que podría no existir.

      ### 3 · Las dos derivadas de la inversa

      Partiendo de la definición $y\left(y^{-1}(x)\right) = x$ y derivando:

      $$
      y'\left(y^{-1}(x)\right)\cdot\left(y^{-1}\right)'(x) = 1
      \;\Longrightarrow\;
      \left(y^{-1}\right)'(x) = \frac{1}{y'\left(y^{-1}(x)\right)}
      $$

      lo que exige $y' \neq 0$ — garantizado porque $y$ es **estrictamente**
      creciente.

      Derivando otra vez, con la cadena aplicada dos veces:

      $$
      \left(y^{-1}\right)''(x)
      = \frac{-y''\left(y^{-1}(x)\right)}
      {\left[y'\left(y^{-1}(x)\right)\right]^{3}}
      $$

      ### 4 · El signo

      | pieza | de dónde sale | signo |
      |---|---|---|
      | $y' > 0$ | $y$ es **creciente** | — |
      | $\left(y'\right)^{3} > 0$ | el cubo es impar y conserva el signo | $+$ |
      | $y'' < 0$ | $y$ es **cóncava** | — |
      | $-y'' > 0$ | por el menos de la fórmula | $+$ |

      $$
      \left(y^{-1}\right)'' = \frac{+}{+} > 0
      $$

      $$
      \boxed{y^{-1} \text{ es CONVEXA en su dominio}} \qquad \blacksquare
      $$

      ### 5 · Por qué el cubo importa

      Es la parte fina del ejercicio. El denominador está **elevado al cubo**, y
      el cubo es una potencia **impar**: conserva el signo.

      Si $y$ fuera **decreciente** en vez de creciente:

      $$
      y'<0
      \;\Longrightarrow\;
      \left(y'\right)^{3}<0
      \;\Longrightarrow\;
      \left(y^{-1}\right)'' = \frac{+}{-} < 0
      $$

      y la inversa saldría **cóncava**, no convexa. La hipótesis de crecimiento
      no es decorativa.

      Con un cuadrado en el denominador el signo se borraría y la orientación
      daría igual — y por eso confundir el exponente es el error caro.

      ### 6 · Comprobación

      **Con un ejemplo.** $y(x) = \sqrt{x}$ en $(0,\infty)$:

      $$
      y' = \frac{1}{2\sqrt x} > 0 \ \text{(creciente)},
      \qquad
      y'' = -\frac{1}{4x^{3/2}} < 0 \ \text{(cóncava)}
      $$

      Su inversa es $y^{-1}(x) = x^{2}$, cuya segunda derivada es
      $2 > 0$: **convexa** ✔

      **Con otro.** $y(x) = \ln x$: creciente y cóncava. Su inversa es $e^{x}$,
      convexa ✔

      **Geométricamente.** La gráfica de $y^{-1}$ es la de $y$ **reflejada en la
      bisectriz** $y=x$. Esa reflexión intercambia los ejes, y con ellos el
      sentido de la curvatura: lo que se doblaba hacia abajo pasa a doblarse
      hacia arriba. Es la misma conclusión sin una sola cuenta — pero un dibujo
      no es una demostración, y el enunciado pide «demostrar analíticamente».

  - id: ex1617-2ev-3-prolongacion-y-lagrange
    titulo: Prolongar una parábola y buscarle el punto medio
    fuente: >-
      Ejercicio 3 · Segunda evaluación, 28 de noviembre de 2016 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 3
      comp4: 5

    nivel: examen
    enunciado: |
      Sea $y(x)$ la función continua definida en el intervalo $[-5,7]$ cuya
      gráfica se muestra en la figura solamente en el intervalo $[-5,3]$, donde
      su expresión analítica es $y(x) = \dfrac{1}{4}x^{2}+\dfrac{1}{4}x-2$.
      Supongamos que en el intervalo $(3,7]$ la velocidad de $y(x)$ se mantiene
      constante e igual al valor de la velocidad en el punto $x=3$.

