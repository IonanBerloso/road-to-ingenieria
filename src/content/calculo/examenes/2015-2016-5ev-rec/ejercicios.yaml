ejercicios:
  - id: ex1516-5rec-1-el-coseno-hiperbolico-y-su-inversa
    titulo: El coseno hiperbólico, y el trozo que sí se puede invertir
    fuente: >-
      Ejercicio 1 · Quinta evaluación, PRIMER CUATRIMESTRAL, 2 de mayo de 2016 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 5
      comp4: 4
    enunciado: |
      Dada la función $\operatorname{Ch}(x)=\dfrac{e^{x}+e^{-x}}{2}$

      a) Representarla gráficamente.

      b) Obtener un dominio en el cual exista la función inversa.

      c) Obtener y representar la función inversa.
    pide: La gráfica, un dominio donde haya inversa, y la inversa con su gráfica.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué no se puede invertir $\operatorname{Ch}$ en todo
          $\mathbb{R}$?
        opciones:
          - texto: >-
              Porque es par —$\operatorname{Ch}(-x)=\operatorname{Ch}(x)$— y por
              tanto no es inyectiva: dos abscisas distintas comparten imagen
            correcta: true
            mensaje: |
              Eso es. Cambiar $x$ por $-x$ intercambia los dos sumandos y deja la
              función igual. Y una función que no es inyectiva no tiene inversa,
              por muy continua y derivable que sea.
          - texto: >-
              Porque no es continua en $x=0$
            mensaje: |
              Sí lo es: es suma de dos exponenciales, continua y derivable en
              todo $\mathbb{R}$. Lo que falla no es la continuidad, es la
              inyectividad.
          - texto: >-
              Porque su recorrido no es todo $\mathbb{R}$
            mensaje: |
              Es cierto que el recorrido es $[1,+\infty)$, y eso limita el
              **dominio de la inversa**; pero no impide que exista. El problema
              de verdad es que a cada valor mayor que $1$ le corresponden dos
              abscisas.

      - tipo: calcular
        titulo: El valor mínimo
        pregunta: |
          ¿Cuál es el menor valor que toma $\operatorname{Ch}$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              La exponencial nunca vale cero, y aquí se suman **dos** que además
              son positivas. Prueba con $x=0$: $\frac{1+1}{2}=1$.
          - valor: '2'
            mensaje: |
              Te has dejado el denominador. En $x=0$ el numerador vale
              $e^{0}+e^{0}=2$, y hay que dividirlo entre $2$.
        pista: |
          Deriva, o usa la desigualdad entre la media aritmética y la
          geométrica con $e^{x}$ y $e^{-x}$.
        desarrollo: |
          $$
          \operatorname{Ch}'(x)=\frac{e^{x}-e^{-x}}{2}=0
          \;\Longleftrightarrow\;
          e^{x}=e^{-x}
          \;\Longleftrightarrow\;
          x=0
          $$

          y $\operatorname{Ch}''(x)=\operatorname{Ch}(x)>0$, así que en $x=0$ hay
          un mínimo:

          $$
          \operatorname{Ch}(0)=\frac{1+1}{2}=1
          $$

          El recorrido es, por tanto, $[1,+\infty)$.

      - tipo: calcular
        titulo: La inversa en un punto
        pregunta: |
          Tomando como dominio $[0,+\infty)$, ¿cuánto vale
          $\operatorname{Ch}^{-1}(2)$?
        respuesta:
          tipo: numero
          valor: '1.3169579'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '-1.3169579'
            mensaje: |
              Has tomado la otra raíz, $\ln\left(2-\sqrt{3}\right)$. Las dos
              resuelven la ecuación, pero el dominio elegido es
              $[0,+\infty)$: hay que quedarse con la positiva. Fíjate en que
              $2-\sqrt{3}<1$, así que su logaritmo es negativo.
          - valor: '0'
            mensaje: |
              Te has dejado el $2$ del denominador: la ecuación es
              $e^{x}+e^{-x}=4$, no $=2$. Con $=2$ saldría $x=0$, que es el
              mínimo.
          - valor: '0.6931472'
            mensaje: |
              Eso es $\ln 2$. La ecuación no es $e^{x}=2$: hay que resolver
              primero la de segundo grado en $t=e^{x}$ y tomar después el
              logaritmo.
        pista: |
          Llama $t=e^{x}$ y resuelve la ecuación de segundo grado que queda.
        desarrollo: |
          $$
          \frac{e^{x}+e^{-x}}{2}=2
          \;\Longrightarrow\;
          e^{x}+e^{-x}=4
          $$

          Con $t=e^{x}>0$:

          $$
          t+\frac1t=4
          \;\Longrightarrow\;
          t^{2}-4t+1=0
          \;\Longrightarrow\;
          t=2\pm\sqrt{3}
          $$

          Como el dominio es $[0,+\infty)$, hace falta $t=e^{x}\ge 1$, y de las
          dos raíces solo $2+\sqrt{3}$ lo cumple:

          $$
          \operatorname{Ch}^{-1}(2)=\ln\left(2+\sqrt{3}\right)\approx 1{,}3170
          $$

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              **a)** $\operatorname{Ch}$ es par, positiva, con mínimo
              $\operatorname{Ch}(0)=1$, y crece hacia $+\infty$ a los dos lados:
              su gráfica es la catenaria.
          - texto: >-
              **b)** Como es par no es inyectiva, así que hay que restringir. En
              $[0,+\infty)$ la derivada
              $\operatorname{Ch}'(x)=\frac{e^{x}-e^{-x}}{2}$ es positiva, luego
              ahí es estrictamente creciente y la inversa existe.
          - texto: >-
              La inversa tiene dominio $[1,+\infty)$ —el recorrido de
              $\operatorname{Ch}$— y recorrido $[0,+\infty)$.
          - texto: >-
              **c)** Con $t=e^{x}$, de $t+\frac1t=2y$ sale
              $t^{2}-2yt+1=0$ y $t=y\pm\sqrt{y^{2}-1}$.
          - texto: >-
              Como $x\ge 0$ obliga a $t\ge 1$, se toma el signo más:
              $\operatorname{Ch}^{-1}(x)=\ln\left(x+\sqrt{x^{2}-1}\right)$.
          - texto: >-
              Su gráfica es la de la rama derecha de $\operatorname{Ch}$
              reflejada en la recta $y=x$.
          - texto: >-
              Como $\operatorname{Ch}$ es par, su inversa también lo es.
            trampa: true
            mensaje: |
              La inversa está definida en $[1,+\infty)$, que ni siquiera es
              simétrico respecto del origen: la pregunta no se puede ni plantear.
              Y hay una razón de fondo: reflejar en $y=x$ convierte la simetría
              respecto del eje $y$ en simetría respecto del eje $x$, y eso una
              función no lo puede tener. Es exactamente por lo que hubo que
              restringir el dominio.

    resolucion: |
      **a) La gráfica.** $\operatorname{Ch}$ es la semisuma de $e^{x}$ y
      $e^{-x}$: par, siempre positiva, con

      $$
      \operatorname{Ch}'(x)=\frac{e^{x}-e^{-x}}{2},
      \qquad
      \operatorname{Ch}''(x)=\operatorname{Ch}(x)>0
      $$

      La derivada se anula solo en $x=0$ y la segunda es positiva en todas
      partes, así que hay un mínimo absoluto en $\operatorname{Ch}(0)=1$ y la
      curva es cóncava hacia arriba en todo $\mathbb{R}$. Crece hacia $+\infty$
      a los dos lados. Es la forma que toma una cadena colgada de sus dos
      extremos, y de ahí el nombre de catenaria.

      **b) Dónde existe la inversa.** Al ser par, $\operatorname{Ch}$ no es
      inyectiva: $\operatorname{Ch}(-2)=\operatorname{Ch}(2)$. Hay que quedarse
      con un trozo donde sí lo sea, y el natural es

      $$
      [0,+\infty)
      $$

      donde $\operatorname{Ch}'>0$ y por tanto es estrictamente creciente. (Vale
      igual $(-\infty,0]$; lo que no vale es todo $\mathbb{R}$.) Con esa
      restricción, la inversa tiene dominio $[1,+\infty)$ y recorrido
      $[0,+\infty)$.

      **c) La inversa.** Se despeja $x$ de $y=\frac{e^{x}+e^{-x}}{2}$. Con
      $t=e^{x}$:

      $$
      t+\frac{1}{t}=2y
      \;\Longrightarrow\;
      t^{2}-2yt+1=0
      \;\Longrightarrow\;
      t=y\pm\sqrt{y^{2}-1}
      $$

      Las dos raíces son positivas y su producto vale $1$, así que una es menor
      que $1$ y la otra mayor. Como hemos elegido $x\ge 0$, hace falta
      $t=e^{x}\ge 1$: el signo más.

      $$
      \operatorname{Ch}^{-1}(x)=\ln\left(x+\sqrt{x^{2}-1}\right),
      \qquad x\ge 1
      $$

      **La gráfica de la inversa** es la de la rama derecha reflejada en la
      recta $y=x$: arranca del punto $(1,0)$ —el reflejo de $(0,1)$— con
      tangente vertical, y crece cada vez más despacio.

