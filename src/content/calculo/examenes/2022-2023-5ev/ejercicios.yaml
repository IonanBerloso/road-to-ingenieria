ejercicios:
  - id: ex2223-5ev-1-la-semicircunferencia-en-el-plano-y-tres
    titulo: Una curva escrita con tres condiciones, y dos términos que se caen solos
    fuente: >-
      Ejercicio 1 · Quinta evaluación, 15 de mayo de 2023 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión. El enunciado no fija el sentido de recorrido; la
      resolución declara el que toma.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Calcular la integral de línea

      $$
      \int_{L}\left(x^{2}+z^{2}\right)dx + \left(x^{2}-z^{2}\right)dy
      + \left(y^{2}-x^{2}\right)dz
      $$

      donde $L$ es la curva que cumple las condiciones

      $$
      \begin{cases}
      x^{2}+z^{2} = y^{2} \\
      y = 3 \\
      x \ge 0
      \end{cases}
      $$
    pide: El valor de la integral sobre esa curva.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las tres condiciones definen la curva. ¿Qué curva es?
        opciones:
          - texto: >-
              Media circunferencia de radio 3 en el plano $y=3$, la mitad con
              $x\ge 0$
            correcta: true
            mensaje: |
              Eso es. Sustituyendo $y=3$ en la primera condición queda
              $x^{2}+z^{2} = 9$: una circunferencia de radio 3 dibujada en el
              plano horizontal $y=3$. Y $x\ge 0$ se queda con la mitad, así que
              es un **arco abierto** con extremos $(0,3,-3)$ y $(0,3,3)$.
          - texto: Un cono, porque $x^{2}+z^{2}=y^{2}$ es la ecuación de un cono
            mensaje: |
              La primera condición sola sí es un cono, pero las tres juntas no:
              $y=3$ lo corta por un plano y deja una circunferencia. Ver el cono
              ayuda a entender de dónde sale el radio 3, pero la curva es la
              intersección.
          - texto: Una circunferencia completa de radio 3
            mensaje: |
              Falta la tercera condición: $x\ge 0$ se queda con media
              circunferencia. Y eso cambia el resultado, porque el arco deja de
              ser cerrado.
          - texto: Una recta, porque $y=3$ y $x\ge 0$ son dos planos
            mensaje: |
              $y=3$ es un plano y $x\ge 0$ un semiespacio, pero la primera
              condición es una superficie curva. La intersección de una
              superficie con un plano no es una recta salvo casos muy
              particulares.

      - tipo: calcular
        titulo: Lo que aporta el primer término
        pregunta: |
          ¿Cuánto aporta a la integral el término
          $\left(x^{2}+z^{2}\right)dx$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '27'
            mensaje: |
              27 sería $9\cdot 3$, como si $x$ recorriera de 0 a 3. Pero el arco
              **empieza y acaba en $x=0$**: sube hasta $x=3$ y vuelve, así que
              $\int dx$ sobre la curva entera vale cero.
          - valor: '9'
            mensaje: |
              9 es el valor **constante** de $x^{2}+z^{2}$ sobre la curva, no lo
              que aporta el término. Falta integrarlo contra $dx$.
          - valor: '18'
            mensaje: |
              18 es el resultado del ejercicio completo, que sale del **tercer**
              término. El primero aporta cero.
        pista: |
          Sobre la curva $x^{2}+z^{2} = 9$ **siempre**, así que ese factor sale
          fuera de la integral. ¿Cuánto vale $\int_{L} dx$ si la curva empieza y
          acaba en $x=0$?
        desarrollo: |
          Sobre $L$ se cumple $x^{2}+z^{2} = y^{2} = 9$ en todos sus puntos, así
          que el factor es **constante** y sale:

          $$
          \int_{L}\left(x^{2}+z^{2}\right)dx = 9\int_{L}dx = 9\left[x\right]_{\text{inicio}}^{\text{fin}}
          $$

          Los dos extremos del arco son $(0,3,-3)$ y $(0,3,3)$: los dos con
          $x=0$. Por tanto la diferencia es cero y el término **no aporta
          nada**, sea cual sea el sentido de recorrido.

          Verlo antes de parametrizar ahorra la mitad de las cuentas.

      - tipo: calcular
        titulo: El valor de la integral
        pregunta: |
          Recorriendo el arco desde $(0,3,-3)$ hasta $(0,3,3)$ —es decir,
          pasando por $(3,3,0)$—, ¿cuánto vale la integral?
        respuesta:
          tipo: numero
          valor: '18'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '-18'
            mensaje: |
              Ese es el valor con el **sentido contrario**, de $(0,3,3)$ a
              $(0,3,-3)$. El enunciado no lo fija, así que hay que declarar cuál
              se toma; con el que dice la pregunta sale $+18$.
          - valor: '54'
            mensaje: |
              54 sale de olvidar el $\frac13$ al integrar
              $\operatorname{sen}^{2}t\cos t$, cuya primitiva es
              $\frac{\operatorname{sen}^{3}t}{3}$.
          - valor: '0'
            mensaje: |
              0 es lo que aportan el primer y el segundo términos. El tercero,
              $\left(y^{2}-x^{2}\right)dz$, no se anula: $9-x^{2}$ es par en el
              parámetro y $dz$ no cambia de signo al recorrer el arco.
        pista: |
          Parametriza $x = 3\cos t$, $z = 3\operatorname{sen}t$ con
          $t \in \left[-\frac{\pi}{2}, \frac{\pi}{2}\right]$. Los dos primeros
          términos se anulan y solo queda el de $dz$.
        desarrollo: |
          Con $x = 3\cos t$, $y = 3$, $z = 3\operatorname{sen}t$ y
          $t: -\frac{\pi}{2} \to \frac{\pi}{2}$:

          - **primer término**: cero, como se ha visto;
          - **segundo término**: $dy = 0$ porque $y\equiv 3$, así que ni se
            calcula;
          - **tercer término**:

          $$
          \int_{-\pi/2}^{\pi/2}\left(9 - 9\cos^{2}t\right)\cdot 3\cos t\,dt
          = 27\int_{-\pi/2}^{\pi/2}\operatorname{sen}^{2}t\cos t\,dt
          $$

          $$
          = 27\left[\frac{\operatorname{sen}^{3}t}{3}\right]_{-\pi/2}^{\pi/2}
          = 9\left(1-(-1)\right) = 18
          $$

      - tipo: justificar
        titulo: La resolución, ordenada
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Sustituyendo $y=3$ en $x^{2}+z^{2}=y^{2}$ queda $x^{2}+z^{2}=9$:
              una circunferencia de radio 3 en el plano $y=3$, y con $x\ge 0$,
              media.
          - texto: >-
              Es un arco **abierto**, de $(0,3,-3)$ a $(0,3,3)$, así que el
              signo depende del sentido y hay que declarar cuál se toma. Aquí,
              el que pasa por $(3,3,0)$.
          - texto: >-
              Como $y\equiv 3$ sobre toda la curva, $dy = 0$ y el segundo
              término desaparece sin calcular nada.
          - texto: >-
              Y como $x^{2}+z^{2}=9$ sobre toda la curva, el primer término es
              $9\int_{L}dx = 9\left[x\right]$, que vale cero porque los dos
              extremos tienen $x=0$.
          - texto: >-
              Solo queda el tercero: con $x=3\cos t$, $z=3\operatorname{sen}t$
              y $t$ de $-\frac\pi2$ a $\frac\pi2$, vale
              $27\int\operatorname{sen}^{2}t\cos t\,dt = 18$.
          - texto: >-
              Como la curva es cerrada, se puede aplicar el teorema de Green y
              ahorrarse la parametrización.
            trampa: true
            mensaje: |
              La curva **no** es cerrada: $x\ge 0$ deja media circunferencia,
              con dos extremos distintos. Y además está en el espacio, no en el
              plano, así que Green no aplica ni aunque lo fuera — el que
              valdría es Stokes, y para usarlo habría que cerrar el arco y
              elegir una superficie. Aquí no compensa: dos de los tres términos
              se caen solos.

    resolucion: |
      ## Qué curva es

      Las tres condiciones se leen de arriba abajo:

      | condición | qué dice |
      |---|---|
      | $x^{2}+z^{2}=y^{2}$ | un cono de eje $Y$ |
      | $y=3$ | cortado por el plano horizontal $y=3$ |
      | $x\ge 0$ | y quedándose con media rodaja |

      Sustituyendo la segunda en la primera:

      $$
      x^{2}+z^{2} = 9
      $$

      una **circunferencia de radio 3** en el plano $y=3$. Con $x\ge 0$ queda
      **media**: un arco abierto de extremos $(0,3,-3)$ y $(0,3,3)$.

      **El enunciado no fija el sentido de recorrido.** Como la curva no es
      cerrada, el signo depende de él, así que hay que declararlo: aquí se toma
      desde $(0,3,-3)$ hasta $(0,3,3)$, pasando por $(3,3,0)$. Con el contrario
      el resultado es $-18$. Decir esto vale puntos de COMP4; callarlo deja la
      respuesta a medias.

      ## Dos términos se caen antes de calcular

      **El segundo.** $y \equiv 3$ sobre toda la curva, así que $dy = 0$ y el
      término $\left(x^{2}-z^{2}\right)dy$ desaparece entero.

      **El primero.** Sobre la curva $x^{2}+z^{2} = 9$ **siempre**, así que

      $$
      \int_{L}\left(x^{2}+z^{2}\right)dx = 9\int_{L}dx = 9\left[x\right]
      $$

      y los dos extremos tienen $x = 0$: aporta cero.

      Ninguna de las dos cosas necesita parametrizar. Verlas primero es la mitad
      del ejercicio.

      ## Lo que queda

      $$
      x = 3\cos t, \quad y = 3, \quad z = 3\operatorname{sen}t,
      \qquad t\in\left[-\tfrac{\pi}{2},\tfrac{\pi}{2}\right]
      $$

      $$
      \int_{L}\left(y^{2}-x^{2}\right)dz
      = \int_{-\pi/2}^{\pi/2}\left(9-9\cos^{2}t\right)3\cos t\,dt
      = 27\int_{-\pi/2}^{\pi/2}\operatorname{sen}^{2}t\cos t\,dt
      $$

      $$
      = 27\left[\frac{\operatorname{sen}^{3}t}{3}\right]_{-\pi/2}^{\pi/2}
      = \boxed{18}
      $$

      ## Por qué no se puede usar Green aquí

      Porque la curva **no es cerrada** y además vive en el espacio, no en el
      plano. El teorema que valdría es el de Stokes, y para aplicarlo haría
      falta cerrar el arco con el diámetro y elegir una superficie. Aquí no
      compensa: parametrizar cuesta tres líneas porque dos de los tres términos
      se han caído solos.

  - id: ex2223-5ev-2-la-altura-que-da-ocho-julios
    titulo: Un campo horrible, y una integral doble que no lo mira
    fuente: >-
      Ejercicio 2 · Quinta evaluación, 15 de mayo de 2023 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3
    enunciado: |
      Sea $L$ la frontera de un triángulo situado en el primer cuadrante tal
      que sus vértices son $(0,0)$, $(3,0)$ y $(3,h)$ y su altura $h$.
      Calcular el valor de $h$ para que el trabajo realizado por el campo
      vectorial $V = \left(x^{3}\operatorname{sen}x,\; 2x\right)$ a lo largo de
      la curva $L$ sea 8 J.
    pide: El valor de la altura h.

    pasos:
      - tipo: reconocer
        pregunta: |
          La primera componente del campo es $x^{3}\operatorname{sen}x$, que no
          tiene primitiva elemental cómoda. ¿Eso es un problema?
        opciones:
          - texto: >-
              No: al aplicar Green solo interviene su derivada respecto de $y$,
              que es cero
            correcta: true
            mensaje: |
              Exacto, y ese es el diseño del ejercicio. Green pide
              $N_{x}-M_{y}$, y $M = x^{3}\operatorname{sen}x$ no depende de $y$,
              así que $M_{y}=0$. El término feo desaparece sin integrarse nunca.
          - texto: >-
              Sí: hay que integrarlo por partes tres veces en cada uno de los
              tres lados
            mensaje: |
              Eso es lo que pasa si se parametriza el triángulo lado a lado, y
              es exactamente el trabajo que Green ahorra. Además, sobre los
              tramos horizontales sí habría que integrarlo de verdad.
          - texto: Sí, pero se puede aproximar numéricamente
            mensaje: |
              En un examen sin calculadora no hay aproximación que valga. Y no
              hace falta: la respuesta es exacta.
          - texto: >-
              No, porque el campo es conservativo y el trabajo sobre una curva
              cerrada es nulo
            mensaje: |
              No lo es: $N_{x} = 2$ y $M_{y} = 0$ no coinciden. Si lo fuera, el
              trabajo sería 0 para toda $h$ y no habría nada que despejar.

      - tipo: calcular
        titulo: El integrando de Green
        pregunta: |
          ¿Cuánto vale $\dfrac{\partial N}{\partial x} - \dfrac{\partial M}{\partial y}$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Si valiera 0 el campo sería conservativo y el trabajo sería nulo
              para cualquier $h$. $N = 2x$, así que $N_{x} = 2$.
          - valor: '-2'
            mensaje: |
              El orden importa: es $N_{x}-M_{y}$, o sea $2-0$. Al revés saldría
              el trabajo con el signo cambiado, que corresponde a recorrer la
              frontera en sentido horario.
          - valor: '2.6667'
            mensaje: |
              Eso es la respuesta final, $h = 8/3$. El integrando es el
              **número constante** que hay dentro de la integral doble.
        pista: |
          $M = x^{3}\operatorname{sen}x$ no lleva ninguna $y$, y $N = 2x$.
        desarrollo: |
          $$
          \frac{\partial N}{\partial x} = \frac{\partial (2x)}{\partial x} = 2,
          \qquad
          \frac{\partial M}{\partial y} = \frac{\partial\left(x^{3}\operatorname{sen}x\right)}{\partial y} = 0
          $$

          $$
          N_{x}-M_{y} = 2
          $$

          **Constante.** Por eso la integral doble se reduce a dos por el área,
          y el campo horrible nunca llega a integrarse.

      - tipo: calcular
        titulo: La altura
        pregunta: |
          ¿Cuánto vale $h$ para que el trabajo sea 8 J?
        respuesta:
          tipo: numero
          valor: '2.6666667'
          tolerancia: 0.002
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '4'
            mensaje: |
              4 sale de $2\cdot\frac{3h}{2} = 8$ resuelto como $h = 8/2$. Ojo:
              $2\cdot\frac{3h}{2} = 3h$, así que la ecuación es $3h = 8$.
          - valor: '5.3333333'
            mensaje: |
              $16/3$: te has dejado el $\frac12$ del área del triángulo. La
              base es 3 y la altura $h$, así que el área es $\frac{3h}{2}$, no
              $3h$.
          - valor: '1.3333333'
            mensaje: |
              $4/3$: has puesto un $\frac12$ de más. Con área $\frac{3h}{2}$ y
              factor 2, el trabajo es exactamente $3h$.
        pista: |
          El área del triángulo de base 3 y altura $h$ es $\frac{3h}{2}$, y el
          trabajo es $2$ veces esa área.
        desarrollo: |
          $$
          W = \iint_{D}2\,dA = 2\cdot\text{área}(D) = 2\cdot\frac{3h}{2} = 3h
          $$

          $$
          3h = 8 \;\Longrightarrow\; h = \frac{8}{3} \approx 2{,}67
          $$

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $L$ es una curva **cerrada** y plana, así que se puede aplicar el
              teorema de Green.
          - texto: >-
              Los vértices $(0,0)$, $(3,0)$ y $(3,h)$ en ese orden recorren la
              frontera en sentido antihorario, que es el que Green pide con
              signo positivo.
          - texto: >-
              $N_{x} = 2$ y $M_{y} = 0$, así que el integrando es la constante
              2 y el campo $x^{3}\operatorname{sen}x$ no llega a integrarse
              nunca.
          - texto: >-
              $W = \iint_{D}2\,dA = 2\cdot\text{área}(D)$, y el área del
              triángulo de base 3 y altura $h$ es $\frac{3h}{2}$.
          - texto: >-
              Por tanto $W = 3h$, y de $3h = 8$ sale $h = \frac{8}{3}$.
          - texto: >-
              El campo no es conservativo —$N_{x}\neq M_{y}$—, lo cual es
              necesario para que el problema tenga solución: si lo fuera, el
              trabajo sería 0 para cualquier $h$.
          - texto: >-
              Como el enunciado dice que el triángulo está en el primer
              cuadrante, hay que comprobar además que $h \le 3$.
            trampa: true
            mensaje: |
              «Primer cuadrante» solo exige $h>0$: el vértice $(3,h)$ está a la
              derecha del eje $Y$ y por encima del eje $X$ sea cual sea la
              altura. No hay ninguna condición que ligue $h$ con la base, y de
              hecho $\frac83$ sería válido igual si fuera 30. Añadir
              restricciones que el enunciado no pone es tan malo como
              olvidarse de las que sí pone.

    resolucion: |
      ## Por qué el campo feo no importa

      El campo es $V = \left(x^{3}\operatorname{sen}x,\; 2x\right)$. Su primera
      componente no tiene una primitiva cómoda —haría falta integrar por partes
      tres veces—, y ese es justamente el anzuelo: si se parametrizan los tres
      lados del triángulo, hay que hacerlo dos veces.

      Con Green no aparece nunca. El teorema pide

      $$
      \oint_{L}M\,dx+N\,dy = \iint_{D}\left(\frac{\partial N}{\partial x}-\frac{\partial M}{\partial y}\right)dA
      $$

      y $M = x^{3}\operatorname{sen}x$ **no depende de $y$**, así que
      $M_{y} = 0$. El término desaparece derivado, no integrado.

      ## La cuenta

      $$
      N_{x}-M_{y} = 2 - 0 = 2
      $$

      Constante, así que la integral doble es dos por el área:

      $$
      W = 2\cdot\text{área}(D) = 2\cdot\frac{1}{2}\cdot 3\cdot h = 3h
      $$

      $$
      3h = 8 \;\Longrightarrow\; \boxed{h = \frac{8}{3}}
      $$

      ## Las dos hipótesis que hay que decir

      Tres puntos de COMP4, y se los llevan dos frases:

      **La curva es cerrada.** «La frontera de un triángulo» lo es; si el
      enunciado hubiera dado dos de los tres lados, Green no valdría sin
      cerrarla.

      **El sentido es antihorario.** Los vértices $(0,0) \to (3,0) \to (3,h)$
      recorren la frontera en sentido positivo, que es el que Green supone. Con
      el contrario saldría $-8$ y no habría $h>0$ que valiera.

      ## Y una comprobación de coherencia

      Que el campo **no** sea conservativo es lo que hace que el problema tenga
      solución: $N_{x} = 2 \neq 0 = M_{y}$. Si lo fuera, el trabajo sobre
      cualquier curva cerrada sería 0 y no existiría ninguna $h$ que diera 8 J.

  - id: ex2223-5ev-3-una-de-cada-tipo
    titulo: Tres ecuaciones y tres cajas, una en cada una
    fuente: >-
      Ejercicio 3 · Quinta evaluación, 15 de mayo de 2023 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp2: 7
      comp4: 3
    enunciado: |
      Clasificar razonadamente las siguientes EDOs y resolver la que sea
      homogénea.

      | | Exacta | Homogénea | Lineal |
      |---|---|---|---|
      | $\left(xe^{x}+\dfrac{y}{x}\right)dx - dy = 0$ | | | |
      | $\left(x^{3}-y^{3}\right)dy = x^{2}y\,dx$ | | | |
      | $\left(\operatorname{sen}x\operatorname{sen}y-2y\right)y' = \cos x\cos y + 2x$ | | | |
    pide: Clasificar las tres y resolver la homogénea.

    pasos:
      - tipo: reconocer
        pregunta: |
          La tabla tiene tres filas y tres columnas. ¿Qué sugiere eso?
        opciones:
          - texto: >-
              Que hay una de cada tipo, y por eso conviene comprobarlas todas
              antes de decidir ninguna
            correcta: true
            mensaje: |
              Es la lectura razonable, y aquí se cumple: una lineal, una
              homogénea y una exacta. Pero hay que **comprobarlo**, no
              suponerlo: una EDO puede ser de varios tipos a la vez, y la tabla
              solo pide marcar, no garantiza una por columna.
          - texto: Que cada una puede estar en varias columnas a la vez
            mensaje: |
              Puede pasar en general —hay lineales que además son separables—,
              pero entonces la tabla tendría varias marcas por fila. Aquí, al
              comprobarlas, sale exactamente una por fila y una por columna.
          - texto: >-
              Que hay que resolverlas las tres y ver cuál sale más fácil
            mensaje: |
              El enunciado solo pide resolver **la homogénea**. Clasificar es
              mirar la forma, no integrar: cuesta tres comprobaciones cortas.
          - texto: >-
              Que la tabla es orientativa y basta con marcar la que se vea clara
            mensaje: |
              «Clasificar razonadamente» pide justificar las tres. Tres puntos
              de COMP4 se reparten precisamente ahí, no en la que se resuelve.

      - tipo: calcular
        titulo: El grado de homogeneidad de la segunda
        pregunta: |
          En $x^{2}y\,dx + \left(y^{3}-x^{3}\right)dy = 0$, ¿de qué grado son
          homogéneos $M$ y $N$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es el exponente de la $x$ en $M = x^{2}y$, pero el grado cuenta
              **todas** las letras: $x^{2}y$ es de grado $2+1 = 3$.
          - valor: '1'
            mensaje: |
              Grado 1 sería algo como $ax+by$. Aquí los dos son cúbicos.
          - valor: '0'
            mensaje: |
              Grado 0 significa que solo depende de $y/x$, que es lo que pasa al
              **dividir** $M$ entre $N$. Cada uno por separado es de grado 3.
        pista: |
          $M(\lambda x,\lambda y) = \lambda^{k}M(x,y)$. Prueba con
          $M = x^{2}y$: al sustituir sale $\lambda^{3}x^{2}y$.
        desarrollo: |
          $$
          M(\lambda x,\lambda y) = (\lambda x)^{2}(\lambda y) = \lambda^{3}x^{2}y
          $$
          $$
          N(\lambda x,\lambda y) = (\lambda y)^{3}-(\lambda x)^{3} = \lambda^{3}\left(y^{3}-x^{3}\right)
          $$

          Los dos de **grado 3**, y eso es lo que define una EDO homogénea: al
          dividir, $\frac{dy}{dx}$ solo depende de $y/x$.

          $$
          \frac{dy}{dx} = \frac{x^{2}y}{x^{3}-y^{3}}
          = \frac{y/x}{1-\left(y/x\right)^{3}}
          $$

      - tipo: calcular
        titulo: La solución de la homogénea, comprobada en un punto
        pregunta: |
          La solución es $\dfrac{x^{3}}{3y^{3}} + \ln|y| = C$. Para la curva que
          pasa por $(1,1)$, ¿cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '0.3333333'
          tolerancia: 0.002
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              1 sería $\frac{x^{3}}{y^{3}}$ sin el 3 del denominador. La
              constante que aparece al integrar $\int v^{-4}dv$ es
              $-\frac{1}{3v^{3}}$.
          - valor: '0'
            mensaje: |
              0 saldría si el primer sumando se anulara, y en $(1,1)$ vale
              $\frac13$. El logaritmo sí es cero: $\ln 1 = 0$.
          - valor: '1.3333333'
            mensaje: |
              $\frac43$ sale de sumar $\frac13 + 1$, tomando $\ln 1 = 1$. El
              logaritmo natural de 1 es cero.
        pista: |
          Sustituye $x=1$ e $y=1$: el logaritmo se anula y queda solo el primer
          sumando.
        desarrollo: |
          $$
          C = \frac{1^{3}}{3\cdot 1^{3}} + \ln 1 = \frac13 + 0 = \frac13
          $$

          Y conviene comprobar que la solución es realmente solución. Derivando
          implícitamente $F(x,y) = \frac{x^{3}}{3y^{3}}+\ln|y|$:

          $$
          F_{x} = \frac{x^{2}}{y^{3}},
          \qquad
          F_{y} = -\frac{x^{3}}{y^{4}} + \frac{1}{y}
          $$

          $$
          \frac{dy}{dx} = -\frac{F_{x}}{F_{y}}
          = \frac{x^{2}/y^{3}}{x^{3}/y^{4}-1/y}
          = \frac{x^{2}y}{x^{3}-y^{3}} \quad\checkmark
          $$

      - tipo: justificar
        titulo: La clasificación y la resolución
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              **La primera** no es exacta: $M_{y} = \frac1x$ y $N_{x} = 0$. Pero
              despejada es $y' - \frac{y}{x} = xe^{x}$, con $y$ e $y'$ a la
              primera potencia: es **lineal**.
          - texto: >-
              **La segunda**, escrita $x^{2}y\,dx + \left(y^{3}-x^{3}\right)dy = 0$,
              tampoco es exacta —$M_{y}=x^{2}$ y $N_{x}=-3x^{2}$—, pero $M$ y $N$
              son homogéneas de grado 3: es **homogénea**.
          - texto: >-
              **La tercera**, escrita
              $\left(\cos x\cos y+2x\right)dx + \left(2y-\operatorname{sen}x\operatorname{sen}y\right)dy = 0$,
              cumple $M_{y} = N_{x} = -\cos x\operatorname{sen}y$: es
              **exacta**.
          - texto: >-
              Para resolver la homogénea, el cambio $v = y/x$ da
              $v + xv' = \frac{v}{1-v^{3}}$, y de ahí
              $xv' = \frac{v^{4}}{1-v^{3}}$.
          - texto: >-
              Separando, $\frac{1-v^{3}}{v^{4}}dv = \frac{dx}{x}$, o sea
              $\int\left(v^{-4}-v^{-1}\right)dv = \int\frac{dx}{x}$.
          - texto: >-
              Integrando, $-\frac{1}{3v^{3}} - \ln|v| = \ln|x| + k$, y
              deshaciendo el cambio queda
              $\frac{x^{3}}{3y^{3}} + \ln|y| = C$.
          - texto: >-
              La primera también es homogénea, porque el término $\frac{y}{x}$
              solo depende de $y/x$.
            trampa: true
            mensaje: |
              Un sumando que dependa de $y/x$ no basta: **toda** la ecuación
              tiene que hacerlo. Ahí está $xe^{x}$, que no es función de $y/x$
              de ninguna manera — ni siquiera es homogéneo de ningún grado,
              porque la exponencial mezcla escalas. Es el error de clasificar
              mirando un trozo en vez de la ecuación entera.

    resolucion: |
      ## Las tres, comprobadas

      | ecuación | exacta | homogénea | lineal |
      |---|---|---|---|
      | $\left(xe^{x}+\frac{y}{x}\right)dx-dy=0$ | | | **✓** |
      | $\left(x^{3}-y^{3}\right)dy = x^{2}y\,dx$ | | **✓** | |
      | $\left(\operatorname{sen}x\operatorname{sen}y-2y\right)y' = \cos x\cos y+2x$ | **✓** | | |

      **La primera.** $M = xe^{x}+\frac yx$, $N = -1$:

      $$
      M_{y} = \frac1x, \qquad N_{x} = 0
      $$

      No es exacta. Homogénea tampoco: $xe^{x}$ no es función de $y/x$ ni es
      homogéneo de ningún grado. Pero despejando:

      $$
      \frac{dy}{dx} = xe^{x}+\frac{y}{x}
      \;\Longleftrightarrow\;
      y' - \frac{1}{x}\,y = xe^{x}
      $$

      que es la forma canónica de una **lineal de primer orden**.

      **La segunda.** Escrita como $x^{2}y\,dx + \left(y^{3}-x^{3}\right)dy = 0$:

      $$
      M_{y} = x^{2}, \qquad N_{x} = -3x^{2}
      $$

      No es exacta. Pero $M$ y $N$ son **homogéneas de grado 3**, así que al
      dividir queda todo en función de $y/x$: es **homogénea**.

      **La tercera.** Pasando todo a la forma diferencial:

      $$
      \left(\cos x\cos y+2x\right)dx + \left(2y-\operatorname{sen}x\operatorname{sen}y\right)dy = 0
      $$
      $$
      M_{y} = -\cos x\operatorname{sen}y,
      \qquad
      N_{x} = -\cos x\operatorname{sen}y
      $$

      Coinciden: es **exacta**. (Su potencial, por si interesa, es
      $F = \operatorname{sen}x\cos y + x^{2} + y^{2}$.)

      ## Resolver la homogénea

      $$
      \frac{dy}{dx} = \frac{x^{2}y}{x^{3}-y^{3}}
      = \frac{v}{1-v^{3}}, \qquad v = \frac{y}{x}
      $$

      Con $y = vx$ e $y' = v+xv'$:

      $$
      v + xv' = \frac{v}{1-v^{3}}
      \;\Longrightarrow\;
      xv' = \frac{v}{1-v^{3}} - v = \frac{v^{4}}{1-v^{3}}
      $$

      Ya es separable:

      $$
      \frac{1-v^{3}}{v^{4}}\,dv = \frac{dx}{x}
      \;\Longrightarrow\;
      \int\left(v^{-4}-v^{-1}\right)dv = \int\frac{dx}{x}
      $$

      $$
      -\frac{1}{3v^{3}} - \ln|v| = \ln|x| + k
      $$

      Y deshaciendo el cambio, $\ln|v| + \ln|x| = \ln|y|$:

      $$
      \boxed{\;\frac{x^{3}}{3y^{3}} + \ln|y| = C\;}
      $$

      —una solución **implícita**, que es lo normal en las homogéneas: despejar
      $y$ aquí no se puede.

      ## Los tres puntos de COMP4

      No están en resolver: están en **razonar la clasificación**. Para cada
      una hay que decir qué se comprueba y qué sale, y en particular por qué la
      primera no es homogénea aunque tenga un $y/x$ a la vista. Marcar tres
      cruces sin justificarlas vale cero de esos tres puntos.

  - id: ex2223-5ev-4-la-edo-con-parametro
    titulo: La misma ecuación con dos respuestas, según cuánto valga a
    fuente: >-
      Ejercicio 4 · Quinta evaluación, 15 de mayo de 2023 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Resolver la EDO $y'' + a\,y' = 7$ en función del parámetro $a$.
    pide: La solución general, discutiendo según el valor de a.

    pasos:
      - tipo: reconocer
        pregunta: |
          «En función del parámetro $a$». ¿Qué está pidiendo eso?
        opciones:
          - texto: >-
              Que se discuta: hay un valor de $a$ para el que las raíces de la
              característica se juntan y la solución cambia de forma
            correcta: true
            mensaje: |
              Eso es. Las raíces son $0$ y $-a$, y coinciden cuando $a=0$. Ahí
              la raíz es doble y tanto la homogénea como la particular cambian
              de forma. Un examen que dice «en función del parámetro» está
              pidiendo justamente ese caso aparte.
          - texto: >-
              Que la respuesta lleve una $a$ dentro, y ya está
            mensaje: |
              La lleva, pero eso solo es media respuesta: la fórmula
              $C_{1}+C_{2}e^{-ax}+\frac{7}{a}x$ **no vale** para $a=0$, y se ve
              a simple vista porque divide entre $a$.
          - texto: >-
              Que hay que dar una solución distinta para cada $a$ entero
            mensaje: |
              No hace falta ir uno a uno: la forma de la solución solo cambia en
              los valores donde la característica cambia de comportamiento, y
              aquí eso ocurre en uno solo.
          - texto: >-
              Que hay que resolverla por variación de constantes, porque hay un
              parámetro
            mensaje: |
              El parámetro no obliga a nada. El segundo miembro es la constante
              7, que sí admite coeficientes indeterminados — con cuidado,
              porque resuena.

      - tipo: calcular
        titulo: El coeficiente de la particular cuando a no es cero
        pregunta: |
          Con $a \neq 0$, la particular es $y_{p} = Kx$. ¿Cuánto vale $K$
          para $a = 2$?
        respuesta:
          tipo: numero
          valor: '3.5'
          tolerancia: 0.002
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '7'
            mensaje: |
              7 es el término independiente. Al sustituir $y_{p}=Kx$ queda
              $0 + aK = 7$, así que hay que dividir entre $a$.
          - valor: '0.2857143'
            mensaje: |
              $2/7$: has dividido al revés. De $aK = 7$ sale $K = 7/a$.
          - valor: '1.75'
            mensaje: |
              $7/4$: has usado $a^{2}$ en vez de $a$. Al derivar $Kx$ una vez
              sale $K$, y esa $K$ se multiplica por $a$ una sola vez.
        pista: |
          $y_{p} = Kx$ tiene $y_{p}' = K$ e $y_{p}'' = 0$. Sustituye en
          $y''+ay' = 7$.
        desarrollo: |
          $$
          y_{p} = Kx \;\Rightarrow\; y_{p}' = K,\; y_{p}'' = 0
          $$
          $$
          0 + aK = 7 \;\Longrightarrow\; K = \frac{7}{a}
          $$

          Con $a=2$: $K = \frac72 = 3{,}5$.

          Y la $x$ del ensayo no es opcional: el término independiente es una
          **constante**, y las constantes ya están en la homogénea porque
          $r=0$ es raíz. Ensayar $y_{p}=K$ daría $0=7$.

      - tipo: calcular
        titulo: El caso que se sale
        pregunta: |
          ¿Para qué valor de $a$ deja de valer la fórmula anterior?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '7'
            mensaje: |
              El 7 es el término independiente y no interviene en la
              característica. Lo que decide la forma de la solución son las
              raíces de $r^{2}+ar = 0$.
          - valor: '1'
            mensaje: |
              Con $a=1$ las raíces son $0$ y $-1$, distintas: la fórmula
              general funciona perfectamente.
          - valor: '-1'
            mensaje: |
              Con $a=-1$ las raíces son $0$ y $1$, también distintas. El caso
              especial es cuando **coinciden**.
        pista: |
          Las raíces son $0$ y $-a$. ¿Cuándo son la misma? Y fíjate también en
          que $K = 7/a$ divide entre $a$.
        desarrollo: |
          $$
          r^{2}+ar = r(r+a) = 0 \;\Longrightarrow\; r = 0,\; r = -a
          $$

          Las dos raíces coinciden cuando $a = 0$, y ahí pasan dos cosas a la
          vez:

          - la homogénea cambia de $C_{1}+C_{2}e^{-ax}$ a $C_{1}+C_{2}x$;
          - la fórmula $K = \frac{7}{a}$ deja de tener sentido.

          No es coincidencia: las dos son la misma resonancia vista desde dos
          sitios.

      - tipo: justificar
        titulo: La discusión completa
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              La característica es $r^{2}+ar = r(r+a) = 0$, con raíces $r=0$ y
              $r=-a$.
          - texto: >-
              **Si $a\neq 0$** las raíces son distintas y
              $y_{h} = C_{1}+C_{2}e^{-ax}$.
          - texto: >-
              El término independiente es la constante 7, y como $r=0$ es raíz
              **simple**, el ensayo lleva una $x$: $y_{p} = Kx$, con
              $K = \frac{7}{a}$.
          - texto: >-
              Luego para $a\neq 0$:
              $y = C_{1}+C_{2}e^{-ax}+\frac{7}{a}x$.
          - texto: >-
              **Si $a = 0$** la ecuación es $y''=7$, la raíz $r=0$ es doble y
              $y_{h} = C_{1}+C_{2}x$.
          - texto: >-
              Ahora la constante resuena **dos veces**, así que el ensayo lleva
              $x^{2}$: $y_{p} = \frac72 x^{2}$, y
              $y = C_{1}+C_{2}x+\frac72 x^{2}$.
          - texto: >-
              La solución con $a\neq 0$ vale también para $a=0$ tomando el
              límite cuando $a\to 0$.
            trampa: true
            mensaje: |
              El límite no existe: $\frac{7}{a}x$ se va a infinito cuando
              $a\to 0$. Lo que sí se puede hacer —y es bonito— es tomar el
              límite de la **combinación** $C_{2}e^{-ax}+\frac7a x$ eligiendo
              $C_{2}$ a la vez, y entonces aparece el $x^{2}$. Pero eso no es
              «vale también»: es otro cálculo, y en un examen hay que dar los
              dos casos por separado.

    resolucion: |
      ## La característica

      $$
      r^{2}+ar = r(r+a) = 0 \;\Longrightarrow\; r = 0,\quad r = -a
      $$

      La raíz $r=0$ está **siempre**, porque la ecuación no tiene término en
      $y$. Y eso tiene dos consecuencias que hay que ver juntas: la homogénea
      contiene una constante, y por tanto el término independiente —que es una
      constante— **resuena**.

      ## Caso $a \neq 0$

      Raíces distintas:

      $$
      y_{h} = C_{1} + C_{2}e^{-ax}
      $$

      Como $r=0$ es raíz **simple**, el ensayo para el 7 lleva una $x$:

      $$
      y_{p} = Kx \;\Rightarrow\; aK = 7 \;\Rightarrow\; K = \frac{7}{a}
      $$

      $$
      \boxed{\;y = C_{1} + C_{2}e^{-ax} + \frac{7}{a}\,x\;}
      $$

      ## Caso $a = 0$

      La ecuación se convierte en $y'' = 7$, y la raíz $r=0$ pasa a ser
      **doble**:

      $$
      y_{h} = C_{1}+C_{2}x
      $$

      Ahora la constante resuena dos veces, así que el ensayo lleva $x^{2}$:

      $$
      y_{p} = Kx^{2} \;\Rightarrow\; 2K = 7 \;\Rightarrow\; K = \frac72
      $$

      $$
      \boxed{\;y = C_{1}+C_{2}x+\frac72 x^{2}\;}
      $$

      —que también sale integrando dos veces, que es lo más rápido cuando se ve
      que la ecuación es solo $y''=7$.

      ## Dónde está la nota

      «En función del parámetro» es una instrucción, no un adorno: **el
      ejercicio pide la discusión**. Dar solo la fórmula con $\frac7a$ deja
      fuera un caso, y además uno que se detecta a simple vista, porque la
      fórmula divide entre $a$.

      La señal general que conviene llevarse: cuando una solución con parámetro
      tiene una división por él, ahí hay un caso aparte esperando.
