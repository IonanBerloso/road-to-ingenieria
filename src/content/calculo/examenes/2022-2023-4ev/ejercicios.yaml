ejercicios:
  - id: ex2223-4ev-1-que-funcion-puede-ser
    titulo: Cuál de las tres funciones puede ser
    fuente: >-
      Ejercicio 1 · Cuarta evaluación, 27 de marzo de 2023 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Sea $f(x,y)$ una función que cumple las siguientes condiciones:

      - En el punto $(1,1)$ la derivada direccional siguiendo la dirección
        $(1,0)$ es 4.
      - En el punto $(1,1)$ la derivada direccional siguiendo la dirección
        $(1,1)$ es $\dfrac{2}{\sqrt{2}}$.

      a) Explicar si la función $f(x,y)$ puede ser alguna de las siguientes tres
      funciones:

      $$
      f_1(x,y) = 3x^{2}+y^{2},
      \qquad
      f_2(x,y) = 2x^{2}-y^{2},
      \qquad
      f_3(x,y) = 2x^{2}+y^{2}
      $$

      b) Calcular la ecuación del plano tangente en el punto $(1,1)$.

      c) Partiendo del punto $(1,1)$, ¿en qué dirección se obtiene la derivada
      direccional máxima?

      d) Partiendo del punto $(1,1)$, ¿en qué dirección no variará el valor de
      $f$?
    pide: Cuál de las tres funciones cumple, el plano tangente y las dos direcciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da dos derivadas direccionales y pregunta qué función
          puede ser. ¿Cuál es el camino?
        opciones:
          - texto: Deducir el gradiente de los dos datos y comparar con el de cada candidata
            correcta: true
            mensaje: |
              Eso es. Dos datos determinan el gradiente, y entonces basta
              derivar las tres funciones en $(1,1)$ y ver cuál coincide.
          - texto: Calcular las derivadas direccionales de las tres y compararlas
            mensaje: |
              Funciona igual y da lo mismo, pero es el doble de trabajo: seis
              derivadas direccionales en vez de tres gradientes. Deducir el
              gradiente una vez es más corto.
          - texto: Comprobar cuál de las tres pasa por el punto (1,1)
            mensaje: |
              Las tres están definidas en $(1,1)$. Lo que las distingue no es
              dónde están definidas sino **cómo cambian** ahí.
      - tipo: calcular
        titulo: La primera componente del gradiente
        pregunta: |
          El vector $(1,0)$ ya es unitario. Si la derivada direccional en esa
          dirección vale 4, ¿cuánto vale $f_x(1,1)$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es la componente del vector dirección, no el valor de la
              derivada. El producto escalar $(a,b)\cdot(1,0)$ vale $a$, y eso es
              lo que el enunciado iguala a 4.
          - valor: '1.4142'
            mensaje: |
              $\sqrt2$ aparece en el **segundo** dato, no en este. El vector
              $(1,0)$ tiene módulo 1 y no hay nada que normalizar.
        pista: |
          $(a,b)\cdot(1,0) = a$, y eso vale 4.
        desarrollo: |
          $$
          \nabla f\cdot(1,0) = f_x(1,1) = 4
          $$

          Directo, porque $(1,0)$ ya es unitario.
      - tipo: calcular
        titulo: La segunda componente
        pregunta: |
          Con $\vec v=(1,1)$ de módulo $\sqrt2$, el segundo dato dice
          $\dfrac{f_x+f_y}{\sqrt2} = \dfrac{2}{\sqrt2}$. ¿Cuánto vale $f_y(1,1)$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Signo cambiado. De $f_x+f_y = 2$ con $f_x=4$ sale $f_y = 2-4 = -2$,
              negativo.
          - valor: '6'
            mensaje: |
              Parece que has sumado en vez de despejar. La ecuación es
              $4+f_y = 2$, no $f_y = 4+2$.
        pista: |
          Los √2 se cancelan y queda $f_x + f_y = 2$. Y $f_x = 4$.
        desarrollo: |
          $$
          \frac{f_x+f_y}{\sqrt2} = \frac{2}{\sqrt2}
          \;\Longrightarrow\;
          f_x+f_y = 2
          \;\Longrightarrow\;
          f_y = 2-4 = -2
          $$

          $$
          \nabla f(1,1) = (4,\,-2)
          $$

          **El $\sqrt2$ del dato estaba puesto a propósito** para que se
          cancelara con el del módulo. Es la firma de un enunciado escrito para
          hacerse sin calculadora.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'De los dos datos sale $\nabla f(1,1) = (4,-2)$.'
          - texto: 'a) $\nabla f_1(1,1) = (6,2)$ y $\nabla f_3(1,1) = (4,2)$: ninguna cumple.'
          - texto: 'a) $\nabla f_2(1,1) = (4,-2)$: **es la única que puede ser**.'
          - texto: 'c) La derivada máxima se da en la dirección del gradiente, $(4,-2)$.'
          - texto: 'a) $f_3$ también vale, porque su primera componente es 4.'
            trampa: true
            mensaje: |
              Coincidir en una componente no basta: el gradiente son **las dos**.
              $\nabla f_3 = (4,2)$ tiene la segunda con el signo cambiado, así
              que su segunda derivada direccional saldría $6/\sqrt2$ y no
              $2/\sqrt2$.
    resolucion: |
      **a) Deducir el gradiente y comparar.** Los dos datos son dos ecuaciones:

      $$
      \nabla f\cdot(1,0) = f_x = 4,
      \qquad
      \frac{\nabla f\cdot(1,1)}{\sqrt2} = \frac{f_x+f_y}{\sqrt2} = \frac{2}{\sqrt2}
      $$

      De la segunda, $f_x+f_y = 2$, luego $f_y = -2$:

      $$
      \nabla f(1,1) = (4,\,-2)
      $$

      Ahora se derivan las tres candidatas en $(1,1)$:

      | función | $\nabla$ en $(1,1)$ | ¿cumple? |
      |---|---|---|
      | $f_1 = 3x^{2}+y^{2}$ | $(6,\,2)$ | no |
      | $f_2 = 2x^{2}-y^{2}$ | $(4,\,-2)$ | **sí** |
      | $f_3 = 2x^{2}+y^{2}$ | $(4,\,2)$ | no |

      $$
      \boxed{\;\text{Solo puede ser } f_2(x,y) = 2x^{2}-y^{2}\;}
      $$

      **b) El plano tangente** en $(1,1)$, con $f_2(1,1) = 2-1 = 1$:

      $$
      z = 1 + 4(x-1) - 2(y-1)
      $$

      **c) La derivada direccional máxima** se da en la dirección del gradiente,
      $(4,-2)$ — o simplificando, $(2,-1)$.

      **d) La dirección en la que no varía** es la perpendicular: se cambian de
      orden las componentes y se le da la vuelta a un signo, $(2,4)$ o, más
      simple, $(1,2)$.

      > **Fíjate en que los apartados c) y d) no dependen de qué función sea.**
      > Salen del gradiente, y el gradiente lo dieron los dos datos del
      > enunciado. El apartado a) es un ejercicio de reconocimiento; los otros
      > tres son las tres preguntas de siempre.

  - id: ex2223-4ev-2-octante-de-la-bola
    titulo: La masa de un octante de bola
    fuente: >-
      Ejercicio 2 · Cuarta evaluación, 27 de marzo de 2023 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión. El resultado coincide con el del ejercicio 7.15(b)
      del boletín de problemas complementarios, que sí la publica.
    nivel: examen
    puntos:
      comp2: 7
      comp4: 3
    enunciado: |
      La siguiente integral representa la masa de un sólido:

      $$
      M = \int_{0}^{1}\left(\int_{0}^{\sqrt{1-x^{2}}}\left(\int_{-\sqrt{1-x^{2}-y^{2}}}^{0}\bigl(x^{2}+y^{2}+z^{2}\bigr)^{2}dz\right)dy\right)dx
      $$

      a) Dibujar el dominio de integración.
      b) Calcular la masa.
    pide: El dibujo del dominio y el valor de la masa.
    pasos:
      - tipo: reconocer
        pregunta: |
          Leyendo los tres límites de dentro hacia fuera, ¿qué sólido describen?
        opciones:
          - texto: Un octante de la bola unidad, el de x≥0, y≥0, z≤0
            correcta: true
            mensaje: |
              Sí. El límite de $z$ dice $x^{2}+y^{2}+z^{2}\le 1$ con $z\le 0$; el
              de $y$ añade $y\ge 0$; y el de $x$, $x\ge 0$. Un octavo de bola.
          - texto: Media bola
            mensaje: |
              La condición $z\le 0$ sola daría media bola, pero los otros dos
              límites recortan además $x\ge 0$ e $y\ge 0$: queda la mitad de la
              mitad de la mitad.
          - texto: Un cubo de lado 1
            mensaje: |
              Sería un cubo si los tres límites fueran números. Aquí los de
              dentro llevan raíces con las otras variables, que es la firma de
              una superficie curva.
      - tipo: calcular
        titulo: El integrando en esféricas
        pregunta: |
          $\bigl(x^{2}+y^{2}+z^{2}\bigr)^{2}$ en esféricas es $r^{n}$.
          Multiplicado por el jacobiano $r^{2}\text{sen}\,\varphi$, ¿qué
          exponente tiene la $r$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              4 es el exponente del integrando solo. Falta multiplicar por el
              jacobiano, que aporta otras dos potencias.
          - valor: '2'
            mensaje: |
              2 es lo que aporta el jacobiano. El integrando aporta 4 más.
        pista: |
          $(r^2)^2 = r^4$, y el jacobiano añade $r^2$.
        desarrollo: |
          $$
          \bigl(x^{2}+y^{2}+z^{2}\bigr)^{2} = \bigl(r^{2}\bigr)^{2} = r^{4}
          $$

          $$
          r^{4}\cdot r^{2}\,\text{sen}\,\varphi = r^{6}\,\text{sen}\,\varphi
          $$

          **La integral se separa en tres factores independientes**, que es la
          señal de que las coordenadas elegidas son las buenas.
      - tipo: calcular
        titulo: La masa
        pregunta: |
          Integrando, la masa sale $\dfrac{\pi}{14}$. ¿Cuánto vale con cuatro
          decimales?
        respuesta:
          tipo: numero
          valor: '0.2244'
          tolerancia: 0.005
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.7952'
            mensaje: |
              $4\pi/7$ es la masa de la **bola entera** con ese integrando. El
              dominio es un octavo de ella.
          - valor: '0.4488'
            mensaje: |
              $\pi/7$ es el doble, o sea un cuarto de bola. Los tres recortes
              —$x\ge 0$, $y\ge 0$, $z\le 0$— dejan un octavo.
        pista: |
          $\pi/14$, con pi = 3,14159...
        desarrollo: |
          $$
          M = \int_{0}^{\pi/2}\!\!\int_{\pi/2}^{\pi}\!\!\int_{0}^{1} r^{6}\,\text{sen}\,\varphi\;dr\,d\varphi\,d\theta
          = \frac{\pi}{2}\cdot 1\cdot\frac{1}{7} = \frac{\pi}{14} \approx 0{,}2244
          $$
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'a) Los límites describen el octante de la bola unidad con $x\ge0$, $y\ge0$ y $z\le 0$.'
          - texto: 'b) El integrando es $r^{4}$ y el jacobiano $r^{2}\text{sen}\,\varphi$, así que queda $r^{6}\text{sen}\,\varphi$.'
          - texto: 'Los límites en esféricas son $r\in[0,1]$, $\varphi\in[\pi/2,\pi]$, $\theta\in[0,\pi/2]$.'
          - texto: 'La integral se separa en tres factores y da $M = \pi/14$.'
          - texto: 'Como el sólido es un octavo de bola, $\varphi$ va de 0 a $\pi/4$.'
            trampa: true
            mensaje: |
              $\varphi$ se mide desde el eje $Z$ **positivo**, y el sólido está
              debajo del plano $z=0$: va de $\pi/2$ a $\pi$. Un rango de 0 a
              $\pi/4$ describiría un cono estrecho apuntando hacia arriba, que no
              es esto.
    resolucion: |
      **a) El dominio.** Se lee de dentro hacia fuera:

      | límite | qué dice |
      |---|---|
      | $z$ de $-\sqrt{1-x^{2}-y^{2}}$ a $0$ | dentro de la bola unidad y con $z\le 0$ |
      | $y$ de $0$ a $\sqrt{1-x^{2}}$ | además $y\ge 0$ |
      | $x$ de $0$ a $1$ | y $x\ge 0$ |

      Es **un octante de la bola unidad**: el del primer cuadrante del plano
      $XY$, por debajo del suelo.

      **b) La masa, en esféricas**, que son las que le tocan a una esfera:

      $$
      \bigl(x^{2}+y^{2}+z^{2}\bigr)^{2} = r^{4},
      \qquad
      dV = r^{2}\,\text{sen}\,\varphi\;dr\,d\varphi\,d\theta
      $$

      Los límites, con $\varphi$ medido desde el eje $Z$ positivo:

      $$
      r\in[0,1],
      \qquad
      \varphi\in\left[\tfrac{\pi}{2},\pi\right],
      \qquad
      \theta\in\left[0,\tfrac{\pi}{2}\right]
      $$

      **Los tres son constantes**, así que la integral se parte en tres factores:

      $$
      M = \underbrace{\int_{0}^{\pi/2}\!d\theta}_{\pi/2}
      \cdot
      \underbrace{\int_{\pi/2}^{\pi}\!\text{sen}\,\varphi\,d\varphi}_{1}
      \cdot
      \underbrace{\int_{0}^{1}\! r^{6}dr}_{1/7}
      = \boxed{\frac{\pi}{14} \approx 0{,}224}
      $$

      > **La comprobación.** El mismo sólido con densidad 1 tendría masa
      > $\frac{1}{8}\cdot\frac{4\pi}{3} = \frac{\pi}{6}\approx 0{,}524$. Aquí sale
      > menos, $0{,}224$, y tiene sentido: la densidad $r^{4}$ es casi cero cerca
      > del centro y solo vale 1 en la cáscara, así que pesa menos que si fuera
      > uniforme. **Ese razonamiento de plausibilidad vale un punto de COMP4** y
      > no cuesta ninguna cuenta.

  - id: ex2223-4ev-3-cono-eliptico-en-y
    titulo: El centro de gravedad de un cono elíptico
    fuente: >-
      Ejercicio 3 · Cuarta evaluación, 27 de marzo de 2023 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp2: 7
      comp4: 3
    enunciado: |
      Sea $S$ el sólido definido por las condiciones
      $\dfrac{x^{2}}{4}+\dfrac{z^{2}}{9}\le y^{2}$, $y \le 1$, $y \ge 0$.

      a) Dibujar el sólido $S$.
      b) Sabiendo que la densidad en cada punto es $f(x,y,z)=k$, calcular el
      centro de gravedad de $S$.
    pide: El dibujo y el centro de gravedad.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué se puede decir del centro de gravedad **antes** de integrar?
        opciones:
          - texto: Que está sobre el eje Y, porque hay simetría en x y en z
            correcta: true
            mensaje: |
              Exacto, y eso ahorra dos de las cuatro integrales. Decirlo
              justificado —«por simetría respecto de los planos $XY$ y $YZ$»— es
              respuesta completa.
          - texto: Que está en el origen
            mensaje: |
              El origen es el vértice del cono, el punto más estrecho. La masa
              está repartida hacia el lado ancho, así que el centro cae más
              allá.
          - texto: Nada; hay que calcular las tres coordenadas
            mensaje: |
              Dos de las tres salen sin integrar. Buscar la simetría **antes** de
              empezar es el primer movimiento de cualquier centro de gravedad.
      - tipo: calcular
        titulo: El jacobiano
        pregunta: |
          Con $x = 2\rho\cos\theta$ y $z = 3\rho\,\text{sen}\,\theta$, ¿cuánto
          vale el coeficiente del jacobiano $ab\rho$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 sería el jacobiano de las cartesianas. Meter los semiejes en el
              cambio hace aparecer su producto.
          - valor: '5'
            mensaje: |
              5 es la suma de los semiejes. El jacobiano lleva su **producto**,
              $2\cdot 3 = 6$.
        pista: |
          $ab$ con a=2 y b=3.
        desarrollo: |
          $$
          J = ab\rho = 6\rho
          $$

          Y la condición pasa a ser $\rho^{2}\le y^{2}$, o sea $\rho\le y$ ya que
          $y\ge 0$.
      - tipo: calcular
        titulo: La coordenada del centro
        pregunta: |
          Con $M = 2\pi k$ y momento $\frac{3\pi k}{2}$, ¿cuánto vale
          $\overline{y}$?
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.005
          formato: en forma exacta (3/4) o con dos decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              $1/2$ sería el centro si la masa estuviera repartida por igual a lo
              largo del eje. No lo está: el cono es mucho más ancho cerca de
              $y=1$, así que el centro se corre hacia allí.
          - valor: '1'
            mensaje: |
              1 es el extremo del sólido, no su centro. El centro de gravedad
              siempre queda **dentro** en un sólido convexo como este.
        pista: |
          $(3\pi k/2)$ dividido entre $2\pi k$.
        desarrollo: |
          $$
          \overline{y} = \frac{3\pi k/2}{2\pi k} = \frac{3}{4}
          $$

          **Es el centroide clásico de un cono**: a tres cuartos de la altura
          contados desde el vértice. Que salga eso confirma la cuenta.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'a) Es un cono elíptico con eje el eje $Y$, vértice en el origen, y base la elipse de semiejes 2 y 3 en $y=1$.'
          - texto: 'b) Por simetría en $x$ y en $z$, $\overline{x}=\overline{z}=0$.'
          - texto: 'Con cilíndricas generalizadas ($J=6\rho$, $\rho\le y$), la masa es $M = 2\pi k$.'
          - texto: 'El momento respecto del plano $XZ$ vale $3\pi k/2$, luego $\overline{y} = 3/4$.'
          - texto: 'La densidad $k$ influye en el resultado, así que el centro depende del material.'
            trampa: true
            mensaje: |
              La $k$ aparece en el numerador y en el denominador, y se cancela.
              Con densidad **constante** el centro de gravedad es puramente
              geométrico —el centroide— y da igual de qué esté hecho el sólido.
    resolucion: |
      **a) El sólido.** La condición
      $\frac{x^{2}}{4}+\frac{z^{2}}{9}\le y^{2}$ describe un **cono elíptico con
      eje el eje $Y$**: al cortar por un $y$ fijo sale la elipse de semiejes
      $2y$ y $3y$. Con $0\le y\le 1$, es el cono desde el vértice en el origen
      hasta la base en $y=1$, de semiejes 2 y 3.

      **b) El centro de gravedad.**

      **Primero la simetría**, que ahorra dos integrales: el sólido es simétrico
      respecto de los planos $XY$ y $YZ$, así que

      $$
      \overline{x} = 0,
      \qquad
      \overline{z} = 0
      $$

      **El cambio**, cilíndricas generalizadas alrededor del eje $Y$:

      $$
      x = 2\rho\cos\theta,
      \qquad
      z = 3\rho\,\text{sen}\,\theta,
      \qquad
      J = 6\rho,
      \qquad \rho\le y
      $$

      **La masa:**

      $$
      M = k\int_{0}^{1}\!\!\int_{0}^{2\pi}\!\!\int_{0}^{y} 6\rho\;d\rho\,d\theta\,dy
      = 6\pi k\int_{0}^{1} y^{2}dy = 2\pi k
      $$

      **El momento:**

      $$
      \int y\,dm = 6\pi k\int_{0}^{1} y^{3}dy = \frac{3\pi k}{2}
      $$

      $$
      \boxed{\;G = \left(0,\ \tfrac34,\ 0\right)\;}
      $$

      > **La comprobación que lo cierra.** El centroide de **cualquier** cono
      > —circular, elíptico, oblicuo— está a tres cuartos de la altura desde el
      > vértice. Que salga $3/4$ sin haberlo usado confirma la cuenta, y decirlo
      > es una frase de COMP4 que no cuesta nada.
      >
      > Y fíjate en que la densidad $k$ se ha cancelado. Con densidad constante
      > el centro de gravedad es geométrico: da igual el material.
