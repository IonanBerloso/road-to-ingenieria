        consigna: |
          Dibuja el sólido $S$ en perspectiva, con el eje $OY$ como eje del cono,
          y aparte la elipse de la base.
        comprueba:
          - punto: |
              Un cono con el eje en **$OY$**, no en $OZ$.
            porque: |
              La variable que aparece al cuadrado sola en el otro miembro, $y$,
              es la del eje. Ponerlo vertical es el error que cambia el sólido.
          - punto: |
              El vértice en el **origen** y el cono abriendo hacia $y$ positivo.
            porque: |
              En $y=0$ la condición obliga a $x=z=0$: un solo punto. Y la
              condición $y\ge0$ deja solo la hoja de la derecha.
          - punto: |
              Las secciones perpendiculares al eje son **elipses**, con la
              proporción $2:3$ entre semiejes.
            porque: |
              Los denominadores son $4$ y $9$. Es un cono elíptico, no de
              revolución, y por eso hay que integrar con cuidado.
          - punto: |
              La base en $y=1$: la elipse $\tfrac{x^{2}}{4}+\tfrac{z^{2}}{9}=1$,
              de semiejes $2$ y $3$.
            porque: |
              Es la cara plana que cierra el sólido, y sus dos semiejes fijan la
              escala del dibujo.
        veredicto: |
          Por simetría respecto de los planos $XY$ y $ZY$, dos coordenadas del
          centro de gravedad son cero. La única que hay que calcular es la $y$, y
          en un cono está a $\tfrac34$ de la altura desde el vértice: el dibujo
          ya predice el resultado.

    resolucion: |
      **a) El sólido.** La condición
      $\frac{x^{2}}{4}+\frac{z^{2}}{9}\le y^{2}$ describe un **cono elíptico con
      eje el eje $Y$**: al cortar por un $y$ fijo sale la elipse de semiejes
      $2y$ y $3y$. Con $0\le y\le 1$, es el cono desde el vértice en el origen
      hasta la base en $y=1$, de semiejes 2 y 3.

      **b) El centro de gravedad.**

      **Primero la simetría**, que ahorra dos integrales: el sólido es simétrico
      respecto de los planos $XY$ y $YZ$, así que

      $$
      \overline{x} = 0,
      \qquad
      \overline{z} = 0
      $$

      **El cambio**, cilíndricas generalizadas alrededor del eje $Y$:

      $$
      x = 2\rho\cos\theta,
      \qquad
      z = 3\rho\,\text{sen}\,\theta,
      \qquad
      J = 6\rho,
      \qquad \rho\le y
      $$

      **La masa:**

      $$
      M = k\int_{0}^{1}\!\!\int_{0}^{2\pi}\!\!\int_{0}^{y} 6\rho\;d\rho\,d\theta\,dy
      = 6\pi k\int_{0}^{1} y^{2}dy = 2\pi k
      $$

      **El momento:**

      $$
      \int y\,dm = 6\pi k\int_{0}^{1} y^{3}dy = \frac{3\pi k}{2}
      $$

      $$
      \boxed{\;G = \left(0,\ \tfrac34,\ 0\right)\;}
      $$

      > **La comprobación que lo cierra.** El centroide de **cualquier** cono
      > —circular, elíptico, oblicuo— está a tres cuartos de la altura desde el
      > vértice. Que salga $3/4$ sin haberlo usado confirma la cuenta, y decirlo
      > es una frase de COMP4 que no cuesta nada.
      >
      > Y fíjate en que la densidad $k$ se ha cancelado. Con densidad constante
      > el centro de gravedad es geométrico: da igual el material.
