      <figcaption>
      Figura redibujada del enunciado original. Las flechas son la corriente
      del apartado a). El enunciado no da la ecuación de la curva C, solo el área que
      encierra, así que R se dibuja con una superelipse ajustada para que su área sea
      exactamente los 5,42 km² del dato.
      </figcaption>
      </figure>

      a) Supongamos que a cierta hora del día el vector fuerza tiene la
      expresión $V(x,y) = \left(2xy - 5y,\; x^{2}+y\right)$. Un barco realiza
      los viajes de ida y vuelta entre los puntos A y B siguiendo en cada tramo
      alguna de las trayectorias $C_{1}$ o $C_{2}$. Se desea utilizar la fuerza
      de la corriente del río para ahorrar combustible. Determinar cuál es la
      mejor elección de trayectoria para el viaje de ida AB y el de vuelta BA.

      b) La figura también muestra una región sombreada R del río delimitada
      por una curva C. Se estima que la superficie de la región R es de
      $5{,}42\ \text{km}^{2}$. Calcular el trabajo que realizaría el campo $V$
      si el barco recorriera la trayectoria C que delimita R.

      c) Unas horas más tarde, el campo vectorial de fuerza ha cambiado, siendo
      ahora $V(x,y) = \left(2xy + y^{2},\; 2xy + x^{2}\right)$. Determinar cuál
      es ahora la mejor elección de trayectoria para cada uno de los viajes AB
      y BA. Calcular el trabajo que efectúa la corriente del río en cada viaje.
      Calcular el trabajo que realizaría el campo $V$ si el barco recorriera la
      trayectoria C que delimita R.
    pide: Qué camino conviene en cada viaje, y el trabajo en cada caso.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado b) no se da la ecuación de C, solo el área que
          encierra. ¿Qué herramienta permite calcular el trabajo con eso?
        opciones:
          - texto: >-
              El teorema de Green, que convierte la circulación por una curva
              cerrada en una integral doble sobre la región que encierra
            correcta: true
            mensaje: |
              Exacto, y aquí funciona especialmente bien: el integrando
              $N_{x}-M_{y}$ sale **constante**, así que la integral doble es
              esa constante por el área. Por eso el enunciado te da el área y
              no la curva.
          - texto: Parametrizar C y calcular la integral de línea
            mensaje: |
              No se puede: el enunciado no dice cuál es C, solo cuánto encierra.
              Que falte esa ecuación es la pista de que hay que salir de la
              curva y entrar en la región.
          - texto: >-
              Buscar el potencial, porque en una curva cerrada el trabajo es
              siempre nulo
            mensaje: |
              Solo si el campo es conservativo, y el de este apartado no lo es:
              $N_{x}-M_{y} = 5 \neq 0$. En el apartado c) sí lo será, y
              entonces la respuesta será justamente 0.
          - texto: El teorema de Stokes en el plano
            mensaje: |
              Green **es** Stokes en el plano, así que la idea es la misma; pero
              en un examen de esta asignatura lo que se cita es Green, y su
              enunciado en dos variables es el que hay que escribir.

      - tipo: calcular
        titulo: Apartado a) — el trabajo por la parábola de abajo
        pregunta: |
          Con $V = (2xy-5y,\; x^{2}+y)$, ¿cuánto vale el trabajo de A a B
          siguiendo $C_{2}$?
        respuesta:
          tipo: numero
          valor: '6.6666667'
          tolerancia: 0.002
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '-46.6666667'
            mensaje: |
              Ese es el trabajo por $C_{1}$, la parábola de **arriba**. Y la
              diferencia entre los dos no es un descuido de signo: son
              $-160/3$, que es exactamente $-5$ por el área encerrada entre
              las dos parábolas.
          - valor: '-6.6666667'
            mensaje: |
              Signo cambiado: has recorrido $C_{2}$ de B hacia A. El viaje de
              ida va de A$(-2,1)$ a B$(2,1)$, o sea con $x$ creciendo.
          - valor: '53.3333333'
            mensaje: |
              $160/3$ es el trabajo del **circuito completo** —ida por $C_{2}$
              y vuelta por $C_{1}$—, no el de un solo tramo.
        pista: |
          Sobre $C_{2}$, $y = \frac12x^{2}-1$ y $dy = x\,dx$, con $x$ de $-2$ a
          $2$. Al sustituir, los términos impares en $x$ se integran a cero por
          simetría.
        desarrollo: |
          Con $y = \tfrac12x^{2}-1$ y $dy = x\,dx$:

          $$
          M = y(2x-5) = \left(\tfrac12x^{2}-1\right)(2x-5),
          \qquad
          N = x^{2}+y = \tfrac32x^{2}-1
          $$

          $$
          W_{2} = \int_{-2}^{2}\left[\left(\tfrac12x^{2}-1\right)(2x-5)
          + \left(\tfrac32x^{2}-1\right)x\right]dx
          = \int_{-2}^{2}\left(\tfrac52x^{3} - \tfrac52x^{2} - 3x + 5\right)dx
          $$

          Los términos impares se anulan en un intervalo simétrico, así que
          solo quedan dos:

          $$
          W_{2} = \int_{-2}^{2}\left(-\tfrac52x^{2}+5\right)dx
          = -\tfrac52\cdot\tfrac{16}{3} + 20 = \frac{20}{3} \approx 6{,}67
          $$

          **Positivo**: por abajo la corriente empuja. Por $C_{1}$ sale
          $-\frac{140}{3}$, o sea que frena mucho.

      - tipo: calcular
        titulo: Apartado b) — el trabajo alrededor de C
        pregunta: |
          Con el mismo campo, ¿cuánto vale el trabajo a lo largo de la curva
          cerrada C, recorrida en sentido positivo?
        respuesta:
          tipo: numero
          valor: '27.1'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '5.42'
            mensaje: |
              Eso es el área, no el trabajo. Green dice que el trabajo es
              $\iint (N_{x}-M_{y})\,dA$, y aquí ese integrando vale 5, así que
              hay que multiplicar.
          - valor: '0'
            mensaje: |
              0 sería la respuesta si el campo fuera conservativo, y este no lo
              es: $N_{x}-M_{y}=5$. Esa **sí** es la respuesta del apartado c).
          - valor: '1.084'
            mensaje: |
              $5{,}42/5$: has dividido donde hay que multiplicar.
        pista: |
          $M_{y} = 2x-5$ y $N_{x} = 2x$, así que $N_{x}-M_{y} = 5$, constante.
          Y la integral de una constante sobre una región es esa constante por
          el área.
        desarrollo: |
          $$
          \oint_{C} M\,dx + N\,dy
          = \iint_{R}\left(\frac{\partial N}{\partial x} - \frac{\partial M}{\partial y}\right)dA
          = \iint_{R} \left[2x - (2x-5)\right] dA
          = 5\iint_{R} dA
          $$

          $$
          W = 5 \cdot \text{área}(R) = 5\cdot 5{,}42 = 27{,}1
          $$

          Que el integrando salga constante no es casualidad del ejercicio: es
          lo que permite dar el dato como un área y no como una ecuación. Si
          $N_{x}-M_{y}$ dependiera de $x$ o de $y$ haría falta conocer C.

      - tipo: calcular
        titulo: Apartado c) — el trabajo de ida con el campo nuevo
        pregunta: |
          Con $V = (2xy+y^{2},\; 2xy+x^{2})$, ¿cuánto vale el trabajo del viaje
          de ida, de A a B?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '-4'
            mensaje: |
              Ese es el de **vuelta**, de B a A. En un campo conservativo los
              dos sentidos son opuestos: $f(A)-f(B) = -\left[f(B)-f(A)\right]$.
          - valor: '0'
            mensaje: |
              0 es el trabajo sobre una curva **cerrada**. El viaje de ida no
              lo es: A y B son puntos distintos.
          - valor: '8'
            mensaje: |
              8 es $f(B)+f(A)$. El trabajo es la **diferencia** de potencial,
              no la suma.
        pista: |
          Comprueba que ahora sí es conservativo y busca $f$ con
          $\nabla f = V$. Después evalúa en A$(-2,1)$ y B$(2,1)$.
        desarrollo: |
          Ahora $M_{y} = 2x+2y$ y $N_{x} = 2y+2x$: **coinciden**, así que el
          campo es conservativo. El potencial:

          $$
          f_{x} = 2xy+y^{2} \;\Rightarrow\; f = x^{2}y + xy^{2} + g(y)
          $$
          $$
          f_{y} = x^{2} + 2xy + g'(y) = 2xy + x^{2} \;\Rightarrow\; g' = 0
          $$
          $$
          f(x,y) = x^{2}y + xy^{2}
          $$

          $$
          f(A) = f(-2,1) = 4 - 2 = 2,
          \qquad
          f(B) = f(2,1) = 4 + 2 = 6
          $$

          $$
          W_{A\to B} = 6 - 2 = 4,
          \qquad
          W_{B\to A} = -4
          $$

          **Da igual la trayectoria** en los dos viajes: al ser conservativo,
          $C_{1}$ y $C_{2}$ dan lo mismo. Y sobre la curva cerrada C el trabajo
          es **0**.

      - tipo: justificar
        titulo: La decisión de los dos viajes
        pregunta: >-
          Ordena la respuesta del apartado a). Una pieza es falsa.
        piezas:
          - texto: >-
              Las dos parábolas se cortan donde $-\frac12x^{2}+3 = \frac12x^{2}-1$,
              o sea $x^{2}=4$: los puntos son A$(-2,1)$ y B$(2,1)$.
          - texto: >-
              $M_{y} = 2x-5$ y $N_{x} = 2x$ no coinciden, así que el campo no
              es conservativo y el camino **sí** importa.
          - texto: >-
              Integrando, el trabajo de A a B vale $-\frac{140}{3}$ por
              $C_{1}$ y $+\frac{20}{3}$ por $C_{2}$.
          - texto: >-
              Para la ida conviene $C_{2}$, que es la única que da trabajo
              positivo: la corriente empuja en vez de frenar.
          - texto: >-
              Para la vuelta los signos se invierten: $+\frac{140}{3}$ por
              $C_{1}$ y $-\frac{20}{3}$ por $C_{2}$, así que conviene $C_{1}$.
          - texto: >-
              El circuito completo —ida por $C_{2}$, vuelta por $C_{1}$— es
              antihorario y da $\frac{160}{3}$, que es $5$ por el área
              encerrada entre las dos parábolas, $\frac{32}{3}$. Green cuadra.
          - texto: >-
              Como conviene $C_{2}$ para la ida, también conviene $C_{2}$ para
              la vuelta, porque es la trayectoria donde la corriente ayuda.
            trampa: true
            mensaje: |
              La corriente no «ayuda en una curva»: ayuda en un **sentido**. Al
              dar la vuelta, el mismo camino recorrido al revés cambia el signo
              del trabajo, así que la que empujaba pasa a frenar. Por eso la
              respuesta buena usa las dos parábolas, una para cada sentido — y
              por eso el circuito resultante encierra área y Green tiene algo
              que decir.

    resolucion: |
      Los tres apartados son la misma pregunta con tres respuestas distintas:
      **¿importa el camino?**

      ## Los extremos

      Las dos parábolas se cortan donde

      $$
      -\tfrac12x^{2}+3 = \tfrac12x^{2}-1 \;\Longrightarrow\; x^{2}=4
      $$

      así que $A(-2,1)$ y $B(2,1)$, como marca la figura.

      ## a) Ida por abajo, vuelta por arriba

      $$
      M_{y} = 2x-5, \qquad N_{x} = 2x, \qquad N_{x}-M_{y} = 5 \neq 0
      $$

      No es conservativo: **el camino importa**. Sustituyendo cada parábola y
      aprovechando que el intervalo $[-2,2]$ es simétrico —los términos impares
      se van—:

      | tramo | por $C_{1}$ (arriba) | por $C_{2}$ (abajo) |
      |---|---|---|
      | ida A → B | $-\frac{140}{3} \approx -46{,}7$ | $+\frac{20}{3} \approx +6{,}7$ |
      | vuelta B → A | $+\frac{140}{3} \approx +46{,}7$ | $-\frac{20}{3} \approx -6{,}7$ |

      **Ida por $C_{2}$ y vuelta por $C_{1}$.** El total del circuito es
      $\frac{20}{3}+\frac{140}{3} = \frac{160}{3} \approx 53{,}3$.

      Y ese número se puede comprobar sin repetir ninguna integral: el circuito
      —abajo de izquierda a derecha, arriba de derecha a izquierda— es
      antihorario, así que por Green vale

      $$
      5 \cdot \text{área entre las parábolas}
      = 5\int_{-2}^{2}\left(4-x^{2}\right)dx
      = 5\cdot\frac{32}{3} = \frac{160}{3} \quad\checkmark
      $$

      Escribir esta comprobación vale los dos puntos de COMP4: demuestra que
      las dos integrales y el teorema dicen lo mismo.

      ## b) Green, con el área como único dato

      El enunciado no da la ecuación de C. No hace falta:

      $$
      \oint_{C} V\cdot d\vec r = \iint_{R}\left(N_{x}-M_{y}\right)dA
      = 5\iint_{R}dA = 5\cdot 5{,}42 = \boxed{27{,}1}
      $$

      Funciona **porque el integrando es constante**. Si dependiera del punto,
      el área no bastaría.

      ## c) Ahora el camino da igual

      $$
      M_{y} = 2x+2y = N_{x}
      $$

      Conservativo, con potencial $f(x,y) = x^{2}y + xy^{2}$:

      - **Ida A → B**: $f(B)-f(A) = 6-2 = 4$, por cualquiera de las dos.
      - **Vuelta B → A**: $-4$, por cualquiera de las dos.
      - **Curva cerrada C**: $0$.

      Así que la pregunta «cuál conviene» ya no tiene respuesta: **es
      indiferente**, y decirlo así —con el motivo— es la respuesta completa.

      ## Lo que el ejercicio enseña de una vez

      | apartado | ¿conservativo? | qué se usa | resultado |
      |---|---|---|---|
      | a | no | parametrizar las dos curvas | el camino decide |
      | b | no | Green, con $N_{x}-M_{y}$ constante | $5\times$ área |
      | c | sí | potencial | los extremos deciden, la curva no |

      El mismo río, el mismo dibujo, tres herramientas distintas. Lo que las
      separa es una comprobación de dos derivadas.

  - id: ex2425-5ev-2-los-salmones-del-rio
    titulo: Cinco mil salmones y diez salmones acaban en el mismo sitio
    fuente: >-
      Ejercicio 2 · Quinta evaluación, 12 de mayo de 2025 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Sea $y(t)$ la función que modeliza el número de salmones de cierto río.
      El ritmo de reproducción diario de los salmones es proporcional al número
      de salmones existentes, siendo la constante de proporcionalidad $k = 5$.
      Debido a la depredación de las gaviotas y otras aves, los salmones son
      capturados a un ritmo aproximado de $y^{2}(t)$ por día. Además, cada día
      migran al mar 4 salmones.

      a) Escribir el modelo matemático (EDO) que describe la situación.

      b) Suponiendo que cierto día hay 5000 salmones en el río, ¿sobrevivirá la
      población de salmones? ¿Y si hubiera 10 salmones?
    pide: La ecuación diferencial, y qué pasa desde dos poblaciones iniciales.

    pasos:
      - tipo: reconocer
        pregunta: |
          Para contestar al apartado b), ¿hace falta resolver la ecuación?
        opciones:
          - texto: >-
              No: basta con los puntos de equilibrio y el signo de $y'$ entre
              ellos
            correcta: true
            mensaje: |
              Eso es, y es lo que hace el ejercicio contestable en un examen sin
              calculadora. La ecuación es autónoma —$y'$ depende solo de $y$—,
              así que factorizando el lado derecho se leen los equilibrios y el
              sentido del movimiento en cada tramo. Resolverla es posible pero
              largo, y no añade nada.
          - texto: Sí, hay que integrarla por fracciones simples y despejar $y(t)$
            mensaje: |
              Se puede —es separable y sale por fracciones simples— pero es
              mucho trabajo para una pregunta que solo quiere saber si la
              población se extingue o no. El análisis cualitativo lo contesta en
              cuatro líneas.
          - texto: Sí, y además hacen falta condiciones iniciales para las dos
            mensaje: |
              Las condiciones iniciales sí están —5000 y 10—, pero no hace falta
              la solución explícita: lo que decide el destino es de qué lado de
              los equilibrios empieza cada una.
          - texto: >-
              No, porque toda población modelada así tiende siempre a la
              capacidad de carga
            mensaje: |
              Eso es cierto en la logística $y' = ry(1-y/K)$, que tiene un solo
              equilibrio positivo. Esta lleva un término de migración constante
              y tiene **dos**, y uno de ellos es inestable: por debajo de él la
              población se hunde.

      - tipo: calcular
        titulo: El equilibrio estable
        pregunta: |
          ¿Hacia qué número de salmones tiende la población si empieza por
          encima de 1?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 también es un equilibrio, pero **inestable**: por encima la
              población sube y por debajo baja, así que la solución se aleja de
              él en vez de acercarse.
          - valor: '5'
            mensaje: |
              5 es la constante de reproducción $k$, no un equilibrio. Los
              equilibrios salen de anular $y' = 5y-y^{2}-4$.
          - valor: '5000'
            mensaje: |
              5000 es la población de partida de la primera pregunta. En $y=5000$
              la derivada vale casi $-25$ millones: la población se desploma, no
              se queda ahí.
        pista: |
          Anula $5y - y^{2} - 4$. Factorizado es $-(y-1)(y-4)$, así que hay dos
          raíces; mira el signo de $y'$ a cada lado de cada una.
        desarrollo: |
          $$
          y' = 5y - y^{2} - 4 = -\left(y^{2}-5y+4\right) = -(y-1)(y-4)
          $$

          | tramo | signo de $y'$ | hacia dónde va |
          |---|---|---|
          | $y < 1$ | negativo | baja: se extingue |
          | $1 < y < 4$ | positivo | sube hacia 4 |
          | $y > 4$ | negativo | baja hacia 4 |

          Así que **4 es estable** y **1 es inestable**. Cualquier población que
          arranque por encima de 1 acaba en 4.

      - tipo: justificar
        titulo: La respuesta a las dos preguntas
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              El modelo es $y' = 5y - y^{2} - 4$: reproducción proporcional
              ($+5y$), depredación ($-y^{2}$) y migración constante ($-4$).
          - texto: >-
              Es una EDO **autónoma**: el tiempo no aparece en el lado derecho,
              así que se puede estudiar sin resolverla.
          - texto: >-
              Factorizando, $y' = -(y-1)(y-4)$, con equilibrios en $y=1$ e
              $y=4$.
          - texto: >-
              El 4 es estable —por encima baja y por debajo sube— y el 1 es
              inestable.
          - texto: >-
              Con 5000 salmones se empieza muy por encima de 4, así que la
              población cae rápidamente y se estabiliza en 4: **sobrevive**.
          - texto: >-
              Con 10 salmones también se empieza por encima de 4, así que pasa
              lo mismo: baja hasta 4 y **sobrevive**.
          - texto: >-
              Con 10 salmones la población se extingue, porque son muchos menos
              que 5000 y el término de migración se los lleva.
            trampa: true
            mensaje: |
              Es la respuesta que el enunciado está buscando provocar, y es
              falsa. Lo que decide no es si el número es grande o pequeño, sino
              **de qué lado del equilibrio inestable** está: 10 está por encima
              de 1, igual que 5000, así que las dos poblaciones acaban en 4. La
              frontera está en 1, no en una cantidad «razonable» de peces.

    resolucion: |
      ## a) El modelo

      Se traduce cada frase a un término:

      | lo que dice | término |
      |---|---|
      | «el ritmo de reproducción es proporcional al número, con $k=5$» | $+5y$ |
      | «son capturados a un ritmo aproximado de $y^{2}$» | $-y^{2}$ |
      | «cada día migran al mar 4 salmones» | $-4$ |

      $$
      \boxed{\;y'(t) = 5y - y^{2} - 4\;}
      $$

      Conviene señalar la diferencia entre los tres: dos dependen de la
      población y el tercero no. Esa constante es la que hace que el modelo
      tenga **dos** equilibrios en vez de uno, y con ella aparece la
      posibilidad de extinción.

      ## b) Sin resolver la ecuación

      Es autónoma, así que basta con factorizar:

      $$
      y' = -\left(y^{2}-5y+4\right) = -(y-1)(y-4)
      $$

      Equilibrios en $y=1$ y en $y=4$, y el signo entre ellos:

      $$
      y<1:\ y'<0
      \qquad
      1<y<4:\ y'>0
      \qquad
      y>4:\ y'<0
      $$

      **$y=4$ es estable** —las soluciones lo persiguen desde los dos lados— y
      **$y=1$ es inestable**: es la frontera entre sobrevivir y extinguirse.

      ## Las dos respuestas

      **Con 5000 salmones.** Está muy por encima de 4, así que $y'$ es
      enormemente negativo —vale unos $-25$ millones el primer día— y la
      población se desploma. Pero **no puede cruzar el 4**: una solución no
      atraviesa un equilibrio. Se estabiliza en 4. Sobrevive.

      **Con 10 salmones.** También está por encima de 4. Baja igual, y también
      acaba en 4. **Sobrevive.**

      ## Lo que la pregunta quiere provocar

      Que contestes «con 5000 sí y con 10 no», porque diez peces suenan a poco.
      Y no es eso: lo que decide es estar por encima o por debajo de **1**, no
      de un número que parezca grande. Si el río tuviera 0,9 salmones —que en
      un modelo continuo tiene sentido como densidad— la población sí se
      hundiría.

      Merece la pena decir también lo que el modelo no captura: la solución
      tiende a 4 pero nunca llega, y un río con cuatro salmones no es una
      población viable en la realidad. El modelo describe la dinámica, no la
      biología.

  - id: ex2425-5ev-3-resonancia-y-exponencial
    titulo: Dos términos a la derecha, y solo uno resuena
    fuente: >-
      Ejercicio 3 · Quinta evaluación, 12 de mayo de 2025 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Resolver la EDO
      $y'' + 9y = 4e^{-3x} + 9\operatorname{sen}(3x)$.
    pide: La solución general.

    pasos:
      - tipo: reconocer
        pregunta: |
          La homogénea da $y_{h} = C_{1}\cos 3x + C_{2}\operatorname{sen}3x$.
          ¿Qué tiene de particular el segundo miembro?
        opciones:
          - texto: >-
              Que uno de sus dos términos, $9\operatorname{sen}3x$, **ya está**
              en la solución homogénea, y el otro no
            correcta: true
            mensaje: |
              Ese es el diseño del ejercicio. El $4e^{-3x}$ se ensaya
              directamente; el $9\operatorname{sen}3x$ resuena con la homogénea
              y hay que multiplicar su ensayo por $x$. Dos términos, dos
              tratamientos distintos, y el principio de superposición permite
              hacerlos por separado y sumar.
          - texto: Que los dos términos resuenan, porque los dos llevan un 3
            mensaje: |
              El 3 de $e^{-3x}$ está en el **exponente real**, y las raíces de
              la característica son $\pm 3i$, imaginarias puras. $e^{-3x}$ no
              es solución de la homogénea: sustitúyelo y verás que da
              $18e^{-3x}$, no cero.
          - texto: Que hay que usar variación de constantes por tener dos términos
            mensaje: |
              Tener dos términos no obliga a nada: por superposición se busca
              una particular para cada uno y se suman. Los dos son del tipo que
              admiten coeficientes indeterminados.
          - texto: >-
              Que al ser la homogénea puramente oscilatoria no existe solución
              particular
            mensaje: |
              Existe siempre. Lo que la resonancia cambia es su **forma**: en
              vez de $A\operatorname{sen}3x + B\cos 3x$ hay que ensayar
              $x(A\operatorname{sen}3x + B\cos 3x)$, que crece con $x$ — que es
              justo lo que físicamente significa resonar.

      - tipo: calcular
        titulo: El coeficiente de la exponencial
        pregunta: |
          Ensayando $y_{p} = Ae^{-3x}$ para el término $4e^{-3x}$, ¿cuánto vale
          $A$?
        respuesta:
          tipo: numero
          valor: '0.2222222'
          tolerancia: 0.0005
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.4444444'
            mensaje: |
              $4/9$: te has dejado uno de los dos sumandos. Al sustituir,
              $y_{p}'' = 9Ae^{-3x}$ y $9y_{p} = 9Ae^{-3x}$, así que el total es
              $18A$, no $9A$.
          - valor: '4'
            mensaje: |
              4 es el coeficiente del enunciado, no el del ensayo. Hay que
              dividirlo entre lo que salga al sustituir.
          - valor: '-0.2222222'
            mensaje: |
              El signo. $18A = 4$ da $A$ positivo; el $-3$ del exponente se
              eleva al cuadrado al derivar dos veces y desaparece.
        pista: |
          Deriva dos veces $Ae^{-3x}$: sale $9Ae^{-3x}$. Súmale $9Ae^{-3x}$ e
          iguala a $4e^{-3x}$.
        desarrollo: |
          $$
          y_{p} = Ae^{-3x} \;\Rightarrow\; y_{p}'' = 9Ae^{-3x}
          $$
          $$
          9Ae^{-3x} + 9Ae^{-3x} = 18Ae^{-3x} = 4e^{-3x}
          \;\Longrightarrow\;
          A = \frac{4}{18} = \frac{2}{9} \approx 0{,}2222
          $$

          Sin resonancia: $e^{-3x}$ no está en la homogénea, así que el ensayo
          más simple funciona.

      - tipo: calcular
        titulo: El coeficiente del término que resuena
        pregunta: |
          Ensayando $y_{p} = x\left(B\cos 3x + C\operatorname{sen}3x\right)$
          para el término $9\operatorname{sen}3x$, ¿cuánto vale $B$?
        respuesta:
          tipo: numero
          valor: '-1.5'
          tolerancia: 0.0005
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.5'
            mensaje: |
              Signo. Al sustituir queda $-6B\operatorname{sen}3x +
              6C\cos 3x = 9\operatorname{sen}3x$, así que $-6B = 9$ y
              $B$ es negativo.
          - valor: '0'
            mensaje: |
              El que vale 0 es $C$, el coeficiente del seno. Los papeles se
              cruzan: al derivar dos veces, el seno del ensayo alimenta al
              coseno del resultado y al revés.
          - valor: '-0.1666667'
            mensaje: |
              $-1/6$: has resuelto $-6B = 1$ olvidando el 9 del enunciado.
        pista: |
          Al derivar dos veces el ensayo, los términos con $x$ se cancelan
          contra el $9y_{p}$ y solo quedan
          $-6B\operatorname{sen}3x + 6C\cos 3x$.
        desarrollo: |
          Con $y_{p} = x(B\cos 3x + C\operatorname{sen}3x)$:

          $$
          y_{p}'' = -6B\operatorname{sen}3x + 6C\cos 3x
          - 9x\left(B\cos 3x + C\operatorname{sen}3x\right)
          $$

          El último paréntesis se cancela exactamente contra $9y_{p}$ —esa
          cancelación es *lo que significa* resonar— y queda

          $$
          -6B\operatorname{sen}3x + 6C\cos 3x = 9\operatorname{sen}3x
          $$

          $$
          -6B = 9 \;\Rightarrow\; B = -\frac{3}{2},
          \qquad
          6C = 0 \;\Rightarrow\; C = 0
          $$

      - tipo: justificar
        titulo: La solución general
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $r^{2}+9=0$ da $r = \pm 3i$, así que
              $y_{h} = C_{1}\cos 3x + C_{2}\operatorname{sen}3x$.
          - texto: >-
              Por superposición, se busca una particular para cada término del
              segundo miembro y se suman.
          - texto: >-
              Para $4e^{-3x}$ no hay resonancia —$-3$ no es raíz de la
              característica— y el ensayo $Ae^{-3x}$ da $A = \frac29$.
          - texto: >-
              Para $9\operatorname{sen}3x$ **sí** la hay, porque
              $\operatorname{sen}3x$ está en la homogénea: el ensayo se
              multiplica por $x$.
          - texto: >-
              Sustituyendo, $B = -\frac32$ y $C = 0$, o sea
              $y_{p_{2}} = -\frac32 x\cos 3x$.
          - texto: >-
              La solución general es
              $y = C_{1}\cos 3x + C_{2}\operatorname{sen}3x
              + \frac29 e^{-3x} - \frac32 x\cos 3x$.
          - texto: >-
              Como $-3$ aparece en el exponente y $3$ en las raíces
              $\pm 3i$, el término exponencial también resuena y hay que
              multiplicarlo por $x$.
            trampa: true
            mensaje: |
              Resonar es que el término **sea solución de la homogénea**, no que
              comparta un número. Las raíces son $\pm 3i$, así que las
              soluciones homogéneas son $\cos 3x$ y $\operatorname{sen}3x$;
              $e^{-3x}$ no está entre ellas, y sustituyéndolo da $18e^{-3x}$ en
              vez de cero. Multiplicarlo por $x$ complicaría el ensayo sin
              motivo y saldrían coeficientes contradictorios.

    resolucion: |
      ## La homogénea

      $$
      r^{2}+9 = 0 \;\Longrightarrow\; r = \pm 3i
      \;\Longrightarrow\;
      y_{h} = C_{1}\cos 3x + C_{2}\operatorname{sen}3x
      $$

      ## Superposición: dos términos, dos ensayos

      El segundo miembro tiene dos sumandos y se tratan por separado. La
      diferencia entre ellos es lo que el ejercicio evalúa.

      **$4e^{-3x}$ — sin resonancia.** El $-3$ del exponente no es raíz de
      $r^{2}+9$, que las tiene imaginarias puras. Ensayo directo:

      $$
      y_{p_{1}} = Ae^{-3x}
      \;\Longrightarrow\;
      18Ae^{-3x} = 4e^{-3x}
      \;\Longrightarrow\;
      A = \frac{2}{9}
      $$

      **$9\operatorname{sen}3x$ — con resonancia.** $\operatorname{sen}3x$ **es**
      solución de la homogénea, así que el ensayo lleva una $x$ delante:

      $$
      y_{p_{2}} = x\left(B\cos 3x + C\operatorname{sen}3x\right)
      $$

      Al derivar dos veces, los términos que llevan $x$ se cancelan contra
      $9y_{p_{2}}$ y sobrevive solo la parte de las derivadas cruzadas:

      $$
      -6B\operatorname{sen}3x + 6C\cos 3x = 9\operatorname{sen}3x
      \;\Longrightarrow\;
      B = -\frac32,\quad C = 0
      $$

      ## La solución

      $$
      \boxed{\;y = C_{1}\cos 3x + C_{2}\operatorname{sen}3x
      + \frac{2}{9}e^{-3x} - \frac{3}{2}\,x\cos 3x\;}
      $$

      ## Qué significa la $x$ que aparece

      Vale la pena decirlo, porque es el único punto de COMP1 del ejercicio y
      además es física. La amplitud del término resonante crece linealmente con
      $x$: el sistema se excita a su propia frecuencia natural y la respuesta no
      se estabiliza. Es el mismo fenómeno por el que una tropa rompe el paso al
      cruzar un puente.

      La comprobación rápida, que cuesta poco: en $x=0$ la particular vale
      $\frac29$ y su segunda derivada, $-2 - 0$… sustituir un valor concreto
      caza casi cualquier error de signo en los coeficientes.
