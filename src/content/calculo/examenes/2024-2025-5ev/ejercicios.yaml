ejercicios:
  - id: ex2425-5ev-1-el-rio-y-las-dos-parabolas
    titulo: Remontar un río por arriba o por abajo, y por qué no da igual
    fuente: >-
      Ejercicio 1 · Quinta evaluación, 12 de mayo de 2025 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      La figura representa un fragmento del cauce de un río navegable. La
      corriente del río viene representada por un vector fuerza
      $V(x,y) = \left(M(x,y),\, N(x,y)\right)$ definido en cada punto $(x,y)$
      de la superficie.

      La figura muestra dos trayectorias de navegación $C_{1}$ y $C_{2}$ entre
      los puntos A y B. Estas curvas son parábolas, y tienen las siguientes
      ecuaciones respectivamente:

      $$
      y = -\frac{1}{2}x^{2} + 3,
      \qquad
      y = \frac{1}{2}x^{2} - 1
      $$

      <figure class="figura-examen">
      <svg viewBox="0 0 560 470" role="img" width="560" height="470"
           aria-labelledby="ri-t ri-d">
        <title id="ri-t">El cauce del rio, las dos trayectorias y la region R</title>
        <desc id="ri-d">Dos parabolas unen los puntos A, en menos dos coma uno, y B,
        en dos coma uno. La de arriba, C uno, tiene el vertice en cero coma tres; la
        de abajo, C dos, en cero coma menos uno. Entre las dos queda el cauce, y
        dentro hay una region sombreada R, cerrada por una curva C. Unas flechas
        pequenas dibujan la corriente en cada punto.</desc>
