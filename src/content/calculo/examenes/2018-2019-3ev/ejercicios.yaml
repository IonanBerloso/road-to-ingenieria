      $$
      \boxed{D \text{ es la región entre las dos tangentes y POR ENCIMA de la
      parábola}}
      $$

      Un «triángulo» de vértices $(0,0)$, $(1,2)$ y $(2,0)$ con el lado inferior
      abombado hacia arriba.

      ### 2 · La simetría, que ahorra la mitad del trabajo

      La parábola es $2x-x^{2} = 1-(x-1)^{2}$: simétrica respecto de $x=1$. Y el
      par de tangentes también, porque la reflexión $x \mapsto 2-x$ lleva
      $y=2x$ a $y = 2(2-x) = 4-2x$.

      Así que **todo el recinto es simétrico respecto de $x=1$**, y basta
      calcular en $[0,1]$ y duplicar.

      ### 3 · Apartado (b): el área

      En $[0,1]$ el borde superior es la tangente $y=2x$ y el inferior la
      parábola:

      $$
      A = 2\int_0^{1}\left[2x-\left(2x-x^{2}\right)\right]dx
      = 2\int_0^{1}x^{2}\,dx
      $$

      **El integrando es exactamente $x^{2}$.** No es casualidad: la diferencia
      entre una parábola y su tangente en $x_0$ es siempre
      $\pm(x-x_0)^{2}$ multiplicado por el coeficiente principal.

      $$
      A = 2\left[\frac{x^{3}}{3}\right]_0^{1}
      $$

      $$
      \boxed{A = \frac23 \approx 0{,}6667}
      $$

      ### 4 · Apartado (c): el volumen

      El eje de giro es $OX$ y el recinto está por encima de él. Cada corte
      vertical barre una **corona**:

      | radio | en $[0,1]$ |
      |---|---|
      | exterior | $2x$ (la tangente) |
      | interior | $2x-x^{2}$ (la parábola) |

      $$
      V = 2\pi\int_0^{1}\left[(2x)^{2}-\left(2x-x^{2}\right)^{2}\right]dx
      $$

      Desarrollando el corchete:

      $$
      4x^{2}-\left(4x^{2}-4x^{3}+x^{4}\right) = 4x^{3}-x^{4}
      $$

      $$
      V = 2\pi\int_0^{1}\left(4x^{3}-x^{4}\right)dx
      = 2\pi\left[x^{4}-\frac{x^{5}}{5}\right]_0^{1}
      = 2\pi\left(1-\frac15\right)
      $$

      $$
      \boxed{V = \frac{8\pi}{5} \approx 5{,}0265}
      $$

      ### 5 · Comprobación

      **Del área, por diferencia de figuras.** El triángulo de vértices
      $(0,0)$, $(1,2)$, $(2,0)$ tiene base 2 y altura 2:

      $$
      A_{\triangle} = \frac{2\cdot2}{2} = 2
      $$

      Y el área bajo la parábola es la clásica:

      $$
      \int_0^{2}\left(2x-x^{2}\right)dx = 4-\frac83 = \frac43
      $$

      $$
      A = 2-\frac43 = \frac23 \quad\checkmark
      $$

      Coincide, y por una vía completamente distinta. Además la proporción
      $\frac{2/3}{2} = \frac13$ es la firma de estos recintos.

      **Del volumen, por diferencia de sólidos.** El triángulo genera al girar
      **dos conos** de radio 2 y altura 1:

      $$
      2\cdot\frac13\pi\cdot2^{2}\cdot1 = \frac{8\pi}{3} \approx 8{,}378
      $$

      Y la parábola genera

      $$
      \pi\int_0^{2}\left(2x-x^{2}\right)^{2}dx
      = \pi\int_0^{2}\left(4x^{2}-4x^{3}+x^{4}\right)dx
      = \pi\left[\frac{32}{3}-16+\frac{32}{5}\right] = \frac{16\pi}{15}
      $$

      $$
      V = \frac{8\pi}{3}-\frac{16\pi}{15} = \frac{40\pi-16\pi}{15}
      = \frac{24\pi}{15} = \frac{8\pi}{5} \quad\checkmark
      $$

      Idéntico.

      **De acotación.** El sólido cabe dentro del cilindro de radio 2 y longitud
      2 —$8\pi \approx 25{,}1$— y contiene… nada obvio, pero $5{,}03$ es el
      20 % del cilindro, coherente con un sólido que acaba en punta por los dos
      lados ✔
