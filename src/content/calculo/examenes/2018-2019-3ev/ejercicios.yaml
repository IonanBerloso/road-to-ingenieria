ejercicios:
  - id: ex1819-3ev-1-conjugado-en-la-ecuacion
    titulo: Una ecuación con conjugado que se resuelve por el módulo
    fuente: >-
      Ejercicio 1 · Tercera evaluación, 22 de enero de 2019 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3

    enunciado: |
      Resolver y representar gráficamente las soluciones de la ecuación
      compleja $z^{4}\,\overline{z}\,i+1 = 0$.
    pide: Resolver y representar.

    pasos:
      - tipo: reconocer
        pregunta: |
          Hay un conjugado en la ecuación. ¿Cómo se quita?
        opciones:
          - texto: >-
              **Tomando módulos primero**: eso da $\left\lvert z\right\rvert$, y con
              él se sustituye $\overline z = \frac{\left\lvert z\right\rvert^{2}}{z}$
            correcta: true
            mensaje: |
              Exacto. El módulo convierte la ecuación compleja en una ecuación
              real de una incógnita, y una vez conocido $\left\lvert z\right\rvert$ el
              conjugado se expresa en función de $z$. Es el método estándar
              cuando aparece $\overline z$.
          - texto: >-
              Escribiendo $z = x+yi$ y separando parte real e imaginaria
            mensaje: |
              Se puede, pero con un grado 4 el sistema resultante es enorme. El
              módulo lo resuelve en tres líneas.
          - texto: >-
              Sustituyendo $\overline z$ por $z$
            mensaje: |
              No son lo mismo salvo si $z$ es real. Cambiarlos altera la
              ecuación.
          - texto: >-
              Conjugando toda la ecuación
            mensaje: |
              Da una ecuación nueva, pero con $\overline z$ elevado a 4: no
              simplifica.

      - tipo: calcular
        titulo: El módulo de las soluciones
        pregunta: |
          ¿Cuánto vale $\left\lvert z\right\rvert$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              $z=0$ no es solución: sustituyendo queda $1=0$. Y de hecho el
              módulo cumple $\left\lvert z\right\rvert^{5}=1$, que obliga a
              $\left\lvert z\right\rvert=1$.
          - valor: '5'
            mensaje: |
              5 es el exponente que aparece: $\left\lvert z\right\rvert^{4}\cdot
              \left\lvert z\right\rvert = \left\lvert z\right\rvert^{5}$. El módulo es la
              raíz quinta de 1.
          - valor: '-1'
            mensaje: |
              Un módulo nunca es negativo. La ecuación $r^{5}=1$ con $r\ge0$
              tiene una sola solución.
        pista: |
          Toma módulos en $z^{4}\overline z\,i = -1$, y recuerda que
          $\left\lvert\overline z\right\rvert = \left\lvert z\right\rvert$.
        desarrollo: |
          Despejando:

          $$
          z^{4}\overline z\,i = -1
          \;\Longrightarrow\;
          z^{4}\overline z = \frac{-1}{i} = i
          $$

          —porque $\frac1i = -i$—.

          Tomando módulos, y usando que el módulo es multiplicativo y que
          $\left\lvert\overline z\right\rvert = \left\lvert z\right\rvert$:

          $$
          \left\lvert z\right\rvert^{4}\cdot\left\lvert z\right\rvert
          = \left\lvert i\right\rvert = 1
          \;\Longrightarrow\;
          \left\lvert z\right\rvert^{5} = 1
          $$

          Y como el módulo es un real **no negativo**, la única solución es

          $$
          \left\lvert z\right\rvert = 1
          $$
        veredicto: |
          $r^{5}=1$ tiene cinco soluciones complejas, pero aquí $r$ es un
          **módulo**: un real $\ge0$. Solo vale $r=1$, y decirlo forma parte de
          la respuesta.

      - tipo: calcular
        titulo: Cuántas soluciones hay
        pregunta: |
          ¿Cuántas soluciones tiene la ecuación?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '5'
            mensaje: |
              5 sería el grado si se contara $\overline z$ como una potencia más
              de $z$. Con $\left\lvert z\right\rvert=1$ la ecuación se reduce a
              $z^{3}=i$: tres soluciones.
          - valor: '4'
            mensaje: |
              4 es el exponente que aparece escrito, pero el conjugado **resta**
              un grado: $z^{4}\cdot\frac1z = z^{3}$.
          - valor: '1'
            mensaje: |
              Una ecuación de raíces cúbicas en $\mathbb{C}$ tiene siempre tres
              soluciones distintas.
        pista: |
          Con $\left\lvert z\right\rvert=1$ se tiene $\overline z = \frac1z$.
        desarrollo: |
          Como $z\overline z = \left\lvert z\right\rvert^{2} = 1$:

          $$
          \overline z = \frac1z
          $$

          Sustituyendo en $z^{4}\overline z = i$:

          $$
          z^{4}\cdot\frac1z = z^{3} = i
          $$

          **El conjugado resta un grado**, no lo suma. Y $z^{3}=i$ tiene
          exactamente **tres** soluciones.
        veredicto: |
          Ese es el giro del ejercicio: parece de grado 5 y es de grado 3,
          porque $\overline z$ vale $z^{-1}$ sobre la circunferencia unidad.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Despejar:** $z^{4}\overline z = \frac{-1}{i} = i$.
          - texto: |
              **Tomar módulos:**
              $\left\lvert z\right\rvert^{5} = 1$, y como es un real no negativo,
              $\left\lvert z\right\rvert = 1$.
          - texto: |
              **Usar $\overline z = \frac1z$**, válido justamente porque
              $\left\lvert z\right\rvert=1$: la ecuación se convierte en
              $z^{3} = i$.
          - texto: |
              **Resolver la cúbica:** con $i = \mathrm{e}^{i\pi/2}$, las raíces
              son $\mathrm{e}^{i\pi/6}$, $\mathrm{e}^{i5\pi/6}$ y
              $\mathrm{e}^{i3\pi/2}$.
          - texto: |
              **Representar:** tres puntos sobre la circunferencia unidad,
              separados 120°, formando un triángulo equilátero.
          - texto: |
              Hay que comprobar aparte si $z=0$ es solución, porque al dividir
              entre $z$ se podría perder.
            trampa: true
            mensaje: |
              No se pierde nada, y comprobarlo es inmediato: con $z=0$ la
              ecuación da $1=0$. Pero además la división entre $z$ se ha hecho
              **después** de saber que $\left\lvert z\right\rvert=1$, que ya excluye el
              cero. Presentarlo como un riesgo pendiente sugiere que el
              razonamiento tenía un hueco, y no lo tiene: el módulo lo cerró
              antes.
        veredicto: |
          Cuando la división entre $z$ se justifica con $\left\lvert z\right\rvert=1$,
          no hay solución perdida que rescatar.

    resolucion: |
      **Datos.** $z^{4}\,\overline z\,i+1 = 0$.

      ### 1 · Despejar

      $$
      z^{4}\overline z\,i = -1
      \;\Longrightarrow\;
      z^{4}\overline z = \frac{-1}{i}
      $$

      Y como $\frac1i = -i$:

      $$
      z^{4}\overline z = i
      $$

      ### 2 · El módulo, primero

      Cuando aparece $\overline z$ mezclado con potencias de $z$, el camino es
      **tomar módulos**: el conjugado tiene el mismo módulo que $z$, así que la
      ecuación compleja se convierte en una ecuación real con una sola
      incógnita.

      $$
      \left\lvert z^{4}\right\rvert\cdot\left\lvert\overline z\right\rvert
      = \left\lvert i\right\rvert
      \;\Longrightarrow\;
      \left\lvert z\right\rvert^{4}\cdot\left\lvert z\right\rvert = 1
      \;\Longrightarrow\;
      \left\lvert z\right\rvert^{5} = 1
      $$

      El módulo es un número real **no negativo**, así que de las cinco raíces
      quintas complejas de 1 solo sirve una:

      $$
      \boxed{\left\lvert z\right\rvert = 1}
      $$

      Todas las soluciones están sobre la **circunferencia unidad**.

      ### 3 · Quitar el conjugado

      Sobre la circunferencia unidad, $z\overline z = \left\lvert z\right\rvert^{2} = 1$,
      es decir

      $$
      \overline z = \frac1z
      $$

      —y $z\neq0$ porque su módulo vale 1—. Sustituyendo:

      $$
      z^{4}\cdot\frac1z = i
      \;\Longrightarrow\;
      \boxed{z^{3} = i}
      $$

      **El conjugado ha restado un grado.** La ecuación parecía de grado 5 y es
      de grado 3.

      ### 4 · Las tres raíces

      Con $i = 1\cdot\mathrm{e}^{i\left(\frac{\pi}{2}+2k\pi\right)}$:

      $$
      r^{3} = 1 \Rightarrow r = 1 \ \checkmark
      \qquad
      3\theta = \frac{\pi}{2}+2k\pi
      \Rightarrow
      \theta = \frac{\pi}{6}+\frac{2k\pi}{3}
      $$

      | $k$ | $\theta$ | forma binómica |
      |---|---|---|
      | 0 | $\frac{\pi}{6} = 30°$ | $\frac{\sqrt3}{2}+\frac12 i$ |
      | 1 | $\frac{5\pi}{6} = 150°$ | $-\frac{\sqrt3}{2}+\frac12 i$ |
      | 2 | $\frac{3\pi}{2} = 270°$ | $-i$ |

      $$
      \boxed{z = \frac{\sqrt3}{2}+\frac12 i,
      \quad -\frac{\sqrt3}{2}+\frac12 i,
      \quad -i}
      $$

      El módulo sale 1 en las tres ✔ coherente con el paso 2.

      ### 5 · La representación

      <figure class="figura-examen">
      <svg viewBox="0 0 420 420" role="img" width="400" height="400"
           aria-labelledby="f1819c1t f1819c1d">
        <title id="f1819c1t">Las tres soluciones</title>
        <desc id="f1819c1d">Tres puntos sobre la circunferencia unidad,
        separados ciento veinte grados: dos arriba, a treinta y a ciento
        cincuenta grados, y uno abajo sobre el eje imaginario negativo. Forman
        un triangulo equilatero.</desc>

        <circle cx="210" cy="210" r="140" fill="none" stroke="var(--rule)"
                stroke-width="1.6"></circle>

        <g stroke="var(--graphite)" stroke-width="1.3" fill="none">
          <path d="M40 210 L390 210 M210 40 L210 390"></path>
        </g>

        <g stroke="var(--live)" stroke-width="2.4" fill="none">
          <path d="M331.2 140 L88.8 140 L210 350 Z"></path>
        </g>

        <g fill="var(--flag)">
          <circle cx="331.2" cy="140" r="6"></circle>
          <circle cx="88.8" cy="140" r="6"></circle>
          <circle cx="210" cy="350" r="6"></circle>
        </g>

        <g fill="var(--graphite)" font-size="13" font-family="var(--mono)">
          <text x="186" y="230">0</text>
          <text x="368" y="202">Re</text>
          <text x="218" y="54">Im</text>
        </g>
        <g fill="var(--flag)" font-size="12" font-family="var(--mono)">
          <text x="286" y="128">30°</text>
          <text x="60" y="128">150°</text>
          <text x="220" y="368">270°</text>
        </g>
      </svg>
      <figcaption>
      Figura nuestra: el enunciado pide representar. Los tres afijos caen sobre
      la circunferencia unidad y forman un triangulo equilatero, con un vertice
      apuntando hacia abajo.
      </figcaption>
      </figure>

      Tres puntos sobre la circunferencia unidad, separados $120°$: un
      **triángulo equilátero** con un vértice en $-i$.

      ### 6 · Comprobación

      **Con $z = -i$**, la más fácil:

      $$
      z^{4} = (-i)^{4} = 1,
      \qquad
      \overline z = i
      $$

      $$
      z^{4}\overline z\,i+1 = 1\cdot i\cdot i+1 = i^{2}+1 = -1+1 = 0
      \quad\checkmark
      $$

      **Con $z = \mathrm{e}^{i\pi/6}$**, en polar:

      $$
      z^{4} = \mathrm{e}^{i4\pi/6} = \mathrm{e}^{i2\pi/3},
      \qquad
      \overline z = \mathrm{e}^{-i\pi/6}
      $$

      $$
      z^{4}\overline z = \mathrm{e}^{i\left(\frac{2\pi}{3}-\frac{\pi}{6}\right)}
      = \mathrm{e}^{i\pi/2} = i \quad\checkmark
      $$

      y entonces $i\cdot i+1 = 0$ ✔

      **Del número de soluciones.** Sobre la circunferencia unidad la ecuación
      es $z^{3}=i$, que tiene exactamente 3 soluciones. Y no hay soluciones
      fuera de la circunferencia, porque el paso 2 fuerza
      $\left\lvert z\right\rvert=1$ para **cualquier** solución ✔

      **De que $z=0$ no lo es:** sustituyendo, $0+1 = 1 \neq 0$ ✔

  - id: ex1819-3ev-2-limite-por-sucesiones-y-composicion
    titulo: Un límite que no existe, y la curvatura de una composición
    fuente: >-
      Ejercicio 2 · Tercera evaluación, 22 de enero de 2019 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3

    enunciado: |
      **a)** Estudiar el límite de la función $f(x) = \cos\left(\dfrac{\pi}{x}
      \right)$ en el punto $x=0$ utilizando las sucesiones
      $\{a_n\}_{n\in\mathbb{N}} = \left\{\dfrac{1}{2n}\right\}_{n\in\mathbb{N}}$
      y $\{b_n\}_{n\in\mathbb{N}} = \left\{-\dfrac{2}{2n+1}
      \right\}_{n\in\mathbb{N}}$.

      **b)** Sean $f(x)$ y $g(x)$ las funciones cuyas gráficas se muestran en la
      figura. Estudiar la concavidad/convexidad de la función
      $h(x) = g\left(f(x)\right)$ en el intervalo $(1,2)$.

      <figure class="figura-examen">
