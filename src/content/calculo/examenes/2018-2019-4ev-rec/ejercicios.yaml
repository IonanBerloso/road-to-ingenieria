                .f-ex1819-senos-o { fill: var(--flag); }
                .f-ex1819-senos-n { fill: var(--faint); font-size: 10px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
                .f-ex1819-senos-l { font-size: 10.5px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.4px; stroke-linejoin: round; }
            </style>
            <path class="f-ex1819-senos-eje" d="M26 82.5L354 82.5M190 139L190 26"/>
            <path class="f-ex1819-senos-eje" d="M63.8 79L63.8 86"/>
