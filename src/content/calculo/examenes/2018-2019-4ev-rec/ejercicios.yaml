ejercicios:
  - id: ex1819-rec-1-una-desigualdad-que-no-esta-definida
    titulo: Una desigualdad entre complejos, que obliga a pensar antes de calcular
    fuente: >-
      Ejercicio 1 · Cuarta evaluación, PRIMER CUATRIMESTRAL, 18 de febrero de
      2019 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión. El enunciado se reproduce tal
      cual, con la desigualdad entre complejos que trae escrita.
    nivel: examen
    puntos:
      comp2: 7
      comp4: 3
    enunciado: |
      Calcular y representar geométricamente los afijos de los números
      complejos $z$ que verifican las siguientes condiciones:

      $$
      \begin{cases}
      |z|^{2} \ge \operatorname{Im}(z) \\[2mm]
      \dfrac{1}{z} \ge \overline{z}
      \end{cases}
      $$
    pide: La región del plano y su dibujo.

    pasos:
      - tipo: reconocer
        pregunta: |
          La segunda condición compara dos números **complejos** con un «$\ge$».
          ¿Qué hay que hacer con eso?
        opciones:
          - texto: >-
              Darse cuenta de que $\mathbb{C}$ no está ordenado, y leerla como
              «la diferencia es un número real mayor o igual que cero»
            correcta: true
            mensaje: |
              Esa es la única lectura coherente, y decirla en voz alta es medio
              ejercicio. En $\mathbb{C}$ no hay orden compatible con las
              operaciones, así que «$w_{1}\ge w_{2}$» solo tiene sentido si
              $w_{1}-w_{2}$ resulta ser real y no negativo. Eso convierte la
              condición en **dos**: que sea real, y que sea $\ge 0$.
          - texto: >-
              Comparar los módulos, que sí son números reales
            mensaje: |
              Eso sería $\left|\frac1z\right| \ge |\overline z|$, que es otra
              condición y da otra región —el disco unidad—. El enunciado no
              escribe barras: si las quisiera, las pondría, como hace en la
              primera línea.
          - texto: >-
              Comparar las partes reales
            mensaje: |
              Tampoco: eso sería $\operatorname{Re}\frac1z \ge \operatorname{Re}\overline z$,
              y de nuevo es una condición distinta. Interpretar por tu cuenta
              lo que el enunciado no dice es justo lo que hay que evitar; lo
              que sí se puede es exigir que la comparación **tenga sentido**.
          - texto: >-
              Es un error del enunciado y el ejercicio no se puede hacer
            mensaje: |
              Sí se puede, y sale una región interesante. La condición no está
              mal escrita: está escrita de forma que obliga a preguntarse
              cuándo dos complejos son comparables, que es exactamente lo que
              quiere medir.

      - tipo: calcular
        titulo: El radio de la circunferencia donde hay igualdad
        pregunta: |
          $\frac{1}{z} - \overline{z} = \overline{z}\left(\frac{1}{|z|^{2}} - 1\right)$.
          ¿Para qué valor de $|z|$ se anula esa diferencia?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              En $z=0$ ni siquiera existe $\frac1z$, así que el origen queda
              fuera de la región antes de empezar. Lo que se anula es el
              paréntesis, no $z$.
          - valor: '2'
            mensaje: |
              $\frac{1}{|z|^{2}} = 1$ pide $|z|^{2} = 1$, no $|z|^{2} = \frac12$.
              Y el módulo es positivo, así que $|z| = 1$.
          - valor: '-1'
            mensaje: |
              Un módulo nunca es negativo. De $|z|^{2}=1$ sale $|z|=1$, la
              única raíz admisible.
        pista: |
          El paréntesis se anula cuando $\frac{1}{|z|^{2}} = 1$.
        desarrollo: |
          $$
          \frac{1}{z} = \frac{\overline z}{|z|^{2}}
          \qquad\Longrightarrow\qquad
          \frac1z - \overline z = \overline z\left(\frac{1}{|z|^{2}} - 1\right)
          $$

          El paréntesis se anula exactamente en $|z| = 1$. Y ahí la diferencia
          vale 0, que es real y $\ge 0$: **toda la circunferencia unidad cumple
          la condición**, con igualdad.

          Es el trozo de la respuesta que más se escapa, porque uno busca
          dónde la desigualdad es estricta y se olvida de dónde es igualdad.

      - tipo: calcular
        titulo: El extremo positivo del segmento real
        pregunta: |
          Fuera de $|z|=1$, la diferencia solo es real si $z$ lo es. Para
          $z = x$ real y positivo, ¿hasta qué valor de $x$ se cumple
          $\frac1x \ge x$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              En $x\to 0^{+}$ la condición se cumple de sobra —$\frac1x$ es
              enorme—, así que 0 no es donde deja de cumplirse, es por donde
              empieza. Lo que falla en 0 es que $\frac1z$ no existe.
          - valor: '2'
            mensaje: |
              En $x=2$: $\frac12 \ge 2$ es falso. Prueba dónde se cruzan las
              dos curvas: $\frac1x = x$ ocurre en $x=1$.
          - valor: '-1'
            mensaje: |
              $-1$ es el extremo del **otro** trozo, el de los negativos. La
              pregunta es por los positivos.
        pista: |
          Con $x>0$, multiplica los dos lados por $x$ sin cambiar el sentido:
          queda $1 \ge x^{2}$.
        desarrollo: |
          Para $z = x$ real y no nulo, $\overline z = x$ y

          $$
          \frac1x - x = \frac{1-x^{2}}{x} \ge 0
          $$

          - Si $x>0$, hace falta $1-x^{2}\ge 0$, o sea $0 < x \le 1$.
          - Si $x<0$, hace falta $1-x^{2}\le 0$, o sea $x \le -1$.

          Los dos extremos, $x=1$ y $x=-1$, ya estaban en la circunferencia
          unidad: los segmentos se enganchan a ella.

      - tipo: justificar
        titulo: La región entera
        pregunta: Ordena la descripción de la región. Una pieza es falsa.
        piezas:
          - texto: >-
              La primera condición, $|z|^{2}\ge\operatorname{Im}(z)$, es
              $x^{2}+y^{2}\ge y$, es decir
              $x^{2}+\left(y-\frac12\right)^{2}\ge\frac14$: fuera o sobre la
              circunferencia de centro $\left(0,\frac12\right)$ y radio
              $\frac12$.
          - texto: >-
              En la segunda hay que empezar diciendo que $\mathbb{C}$ no está
              ordenado: la desigualdad solo tiene sentido si
              $\frac1z-\overline z$ es real y no negativo.
          - texto: >-
              Y $\frac1z-\overline z = \overline z\left(\frac{1}{|z|^{2}}-1\right)$
              es real en dos casos: cuando $|z|=1$, porque entonces vale 0, o
              cuando $\overline z$ es real, o sea cuando $z$ lo es.
          - texto: >-
              En $|z|=1$ la diferencia es 0, que cumple el «$\ge$»: entra la
              circunferencia unidad entera.
          - texto: >-
              Para $z=x$ real, $\frac{1-x^{2}}{x}\ge 0$ da
              $x\le -1$ o $0<x\le 1$; el origen queda fuera porque $\frac1z$ no
              existe.
          - texto: >-
              La primera condición no recorta nada de lo anterior: sobre el eje
              real es $x^{2}\ge 0$, siempre cierta, y sobre $|z|=1$ es
              $1\ge y$, también siempre cierta.
          - texto: >-
              Como la segunda condición obliga a $z$ a ser real, la solución es
              solo un trozo del eje real.
            trampa: true
            mensaje: |
              Falta la circunferencia. La diferencia es real en dos casos, no
              en uno: además de $z$ real, está $|z|=1$, donde
              $\frac1z = \overline z$ exactamente y la diferencia vale 0 —que
              es un número real y cumple el «mayor o **igual**»—. Es el trozo
              de la respuesta que más se pierde, porque uno busca desigualdades
              estrictas y no mira dónde hay igualdad.

