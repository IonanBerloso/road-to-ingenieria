            <text class="f-ex1819-senos-l" x="217" y="98.5" text-anchor="start" fill="var(--flag)">z = ±π/3 + 2kπ</text>
          </svg>
        consigna: |
          Dibuja los afijos de las soluciones en el plano complejo. Marca al
          menos dos periodos y señala las dos familias con símbolos distintos.
        comprueba:
          - punto: |
              **Todas** las soluciones sobre el eje real.
            porque: |
              La ecuación se factoriza en
              $\operatorname{sen}z\left(2\cos z-1\right)=0$, y los dos factores
              se anulan solo para valores reales. En el plano complejo no
              aparecen soluciones nuevas: eso es el resultado del ejercicio.
          - punto: |
              La primera familia, $z=k\pi$, marcada en $0$, $\pm\pi$, $\pm2\pi$, …
            porque: |
              Son los ceros del seno. Están igualmente espaciados $\pi$ y sirven
              de retícula para situar las otras.
          - punto: |
              La segunda familia, $z=\pm\tfrac\pi3+2k\pi$, con símbolo distinto.
            porque: |
              Son las soluciones de $\cos z=\tfrac12$. Que $\tfrac12$ esté dentro
              de $\left[-1,1\right]$ es lo que impide que salgan complejas.
          - punto: |
              Que las dos familias **no** se solapan.
            porque: |
              $\tfrac\pi3$ no es múltiplo de $\pi$. Dibujarlas con símbolos
              distintos deja claro que son dos conjuntos disjuntos de soluciones.
        veredicto: |
          Si el segundo miembro hubiera obligado a $\cos z=2$, la ecuación sí
          tendría soluciones fuera del eje real. Aquí no: el dibujo, una fila de
          puntos sobre el eje, **es** la respuesta a la pregunta implícita del
          enunciado.

    resolucion: |
      ## Factorizar, y no dividir

      La identidad del ángulo doble vale en $\mathbb{C}$ —se comprueba con las
      definiciones exponenciales—, así que

      $$
      \operatorname{sen}z = 2\operatorname{sen}z\cos z
      \;\Longleftrightarrow\;
      \operatorname{sen}z\,(1-2\cos z) = 0
      $$

      Y $\mathbb{C}$ no tiene divisores de cero: el producto se anula si y solo
      si se anula uno de los dos factores.

      **La tentación es dividir entre $\operatorname{sen}z$** y quedarse con
      $\cos z = \frac12$. Al hacerlo desaparecen las soluciones $z = k\pi$, que
      son la mitad de la respuesta. Es el error clásico de estas ecuaciones y
      aquí cuesta la mitad de la COMP2.

      ## Los dos factores

      **$\operatorname{sen}z = 0$.** En forma exponencial,
      $e^{iz} = e^{-iz}$, o sea $e^{2iz}=1$, luego $2iz = 2k\pi i$ y

      $$
      z = k\pi, \qquad k\in\mathbb{Z}
      $$

      **$\cos z = \frac12$.** Aquí conviene decir algo antes de calcular: el
      valor pedido, $\frac12$, es real y está en $[-1,1]$, así que ya lo alcanza
      el coseno real. Resolviendo con $w = e^{iz}$:

      $$
      \frac{w + w^{-1}}{2} = \frac12
      \;\Longrightarrow\;
      w^{2} - w + 1 = 0
      \;\Longrightarrow\;
      w = \frac{1 \pm i\sqrt3}{2} = e^{\pm i\pi/3}
      $$

      Los dos tienen módulo 1, así que $iz$ es imaginario puro y $z$ es real:

      $$
      z = \pm\frac{\pi}{3} + 2k\pi, \qquad k\in\mathbb{Z}
      $$

      ## La solución completa

      $$
      \boxed{\;z = k\pi
      \quad\text{o}\quad
      z = \pm\frac{\pi}{3} + 2k\pi,
      \qquad k\in\mathbb{Z}\;}
      $$

      **Todas reales.** Al representarlas se dibuja el eje real con los puntos
      marcados: $\dots,\,-\pi,\,-\frac{\pi}{3},\,0,\,\frac{\pi}{3},\,\pi,\,
      \frac{5\pi}{3},\,2\pi,\,\dots$ Conviene decir en el examen que **no hay
      ninguna fuera del eje real**, y por qué: los dos valores que hay que
      alcanzar, 0 y $\frac12$, están dentro de $[-1,1]$.

      ## El contraste que conviene tener en la cabeza

      Que una ecuación se plantee en $\mathbb{C}$ no significa que vayan a
      aparecer soluciones complejas. Aparecen cuando el valor pedido se sale
      del rango real: $\cos z = 2$ —la recuperación de 2019-2020— no tiene
      ninguna solución real y todas las suyas son complejas puras. Aquí pasa lo
      contrario, y saber distinguir los dos casos es lo que este ejercicio
      mide.

  - id: ex1819-rec-3-negar-un-limite
    titulo: Demostrar que algo NO es el límite
    fuente: >-
      Ejercicio 3 · Cuarta evaluación, PRIMER CUATRIMESTRAL, 18 de febrero de
      2019 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp4: 8
    enunciado: |
      a) Definir formalmente el concepto siguiente: el límite de la sucesión
      $\{x_{n}\}_{n\in\mathbb{N}}$ es $l$.

      b) Utilizando el apartado anterior demostrar que
      $\left\{\dfrac{1}{n}\right\}_{n\in\mathbb{N}} \not\to -2$.
    pide: La definición y la demostración de que −2 no es el límite.

    pasos:
      - tipo: reconocer
        pregunta: |
          Para demostrar que $-2$ **no** es el límite, ¿qué hay que exhibir?
        opciones:
          - texto: >-
              Un $\varepsilon>0$ concreto para el que **ningún** $m$ funcione
            correcta: true
            mensaje: |
              Exacto. La negación de «para todo $\varepsilon$ existe $m$…» es
              «existe un $\varepsilon$ tal que para todo $m$ hay algún
              $n\ge m$ con $|x_{n}-l|\ge\varepsilon$». Basta con **un**
              $\varepsilon$ que falle, y aquí falla cualquiera menor o igual
              que 2.
          - texto: >-
              Comprobar que el límite verdadero es 0, que es distinto de $-2$
            mensaje: |
              Es cierto y sirve —el límite es único—, pero el enunciado dice
              «utilizando el apartado anterior», o sea con la definición. Y
              además esa vía necesita el teorema de unicidad, que es más
              maquinaria de la que hace falta.
          - texto: >-
              Encontrar un $n$ para el que $\left|\frac1n+2\right|$ sea grande
            mensaje: |
              Un solo $n$ no basta: la definición permite que los primeros
              términos estén lejos. Hay que ver que **todos** a partir de
              cualquier $m$ siguen lejos, y para eso hace falta la cota que
              vale para todo $n$.
          - texto: >-
              Probar que para todo $\varepsilon$ ningún $m$ funciona
            mensaje: |
              Eso es más de lo necesario —y de hecho falso: con
              $\varepsilon = 100$ cualquier $m$ funciona—. La negación de un
              «para todo» es un «existe»: con un solo $\varepsilon$ que falle
              ya está.

      - tipo: calcular
        titulo: La distancia que nunca baja
        pregunta: |
          La distancia $\left\lvert\dfrac{1}{n} - (-2)\right\rvert$ va
          disminuyendo según crece $n$, pero se queda siempre por encima de un
          valor. ¿De cuál?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              0 sería la distancia si $-2$ fuera el límite, que es justo lo que
              queremos descartar. Lo que tiende a 0 es $\frac1n$, no la
              distancia: a esta le queda siempre el $+2$.
          - valor: '-2'
            mensaje: |
              Una distancia nunca es negativa: el valor absoluto se encarga.
              $-2$ es el número del que nos estamos alejando, no la distancia.
          - valor: '3'
            mensaje: |
              3 es la distancia en $n=1$, o sea la **mayor** de todas. La
              pregunta es por la cota inferior: el valor por debajo del cual la
              distancia no llega a bajar nunca.
        pista: |
          $\left\lvert\frac1n+2\right\rvert = \frac1n + 2$, porque los dos
          sumandos son positivos. ¿A qué se acerca eso, y desde qué lado?
        desarrollo: |
          Para todo $n$, y como $\frac1n>0$:

          $$
          \left\lvert\frac1n - (-2)\right\rvert = \frac1n + 2 > 2
          $$

          La distancia baja hacia 2 —en $n=1$ vale 3, en $n=100$ vale
          $2{,}01$— pero **nunca lo alcanza ni lo cruza**.

          Ahí está toda la demostración: si se toma cualquier
          $\varepsilon \le 2$, ningún término entra jamás en la banda, por
          grande que se elija $m$. Basta con uno, y el más cómodo de escribir
          es $\varepsilon = 1$.

      - tipo: justificar
        titulo: La demostración
        pregunta: Ordena la demostración. Una pieza es falsa.
        piezas:
          - texto: >-
              **Definición.** $\lim x_{n} = l$ si para todo $\varepsilon>0$
              existe $m\in\mathbb{N}$ tal que $|x_{n}-l|<\varepsilon$ para todo
              $n\ge m$.
          - texto: >-
              **Negación.** $\lim x_{n} \neq l$ si existe algún
              $\varepsilon>0$ tal que, para todo $m$, hay algún $n\ge m$ con
              $|x_{n}-l|\ge\varepsilon$.
          - texto: >-
              Tomamos $\varepsilon = 1$, que es una elección concreta y basta
              con una.
          - texto: >-
              Para todo $n$,
              $\left|\frac1n-(-2)\right| = \frac1n+2 > 2 > 1 = \varepsilon$,
              porque $\frac1n$ es positivo.
          - texto: >-
              Como la desigualdad vale para **todos** los $n$, sea cual sea el
              $m$ que se proponga siempre hay términos que se salen. Luego
              $-2$ no es el límite.
          - texto: >-
              Basta con observar que $\frac1n$ es positivo y $-2$ negativo, y
              que una sucesión de términos positivos no puede tener límite
              negativo.
            trampa: true
            mensaje: |
              La conclusión es cierta, pero el argumento no es «basta con
              observar»: es un **teorema** —si $a_{n}\ge 0$ y $a_{n}\to L$
              entonces $L\ge 0$— que hay que demostrar aparte, y que de hecho
              cae como ejercicio completo en las recuperaciones de 2019-2020 y
              2020-2021. Además el enunciado pide usar la definición, no un
              resultado posterior.

    resolucion: |
      Ocho de los diez puntos son COMP4. No hay nada que calcular: hay que
      **negar** una definición y usarla.

      ## a) La definición

      > $\lim_{n\to\infty} x_{n} = l$ si para todo $\varepsilon>0$ existe
      > $m\in\mathbb{N}$ tal que $|x_{n}-l|<\varepsilon$ para todo $n\ge m$.

      ## Su negación, que es lo que aquí hace falta

      Se niega cambiando cada cuantificador y la desigualdad final:

      > $\lim x_{n} \neq l$ si **existe** $\varepsilon>0$ tal que **para todo**
      > $m\in\mathbb{N}$ **existe** $n\ge m$ con $|x_{n}-l|\ge\varepsilon$.

      Escribir esa línea bien es lo que se está evaluando. El error más común
      es negar solo la desigualdad y dejar los cuantificadores como estaban.

      ## b) La demostración

      Tómese $\varepsilon = 1$. Para **todo** $n\in\mathbb{N}$:

      $$
      \left|\frac1n - (-2)\right| = \left|\frac1n + 2\right| = \frac1n + 2 > 2 > 1 = \varepsilon
      $$

      —el valor absoluto se quita sin cambiar nada porque los dos sumandos son
      positivos.

      Como la desigualdad se cumple para todos los $n$, dado cualquier $m$
      basta tomar $n=m$ para tener un término que se sale de la banda. Por
      tanto no existe ningún $m$ que sirva, y

      $$
      \left\{\frac1n\right\} \not\to -2 \qquad \blacksquare
      $$

      ## Dos avisos que valen puntos

      **Un solo $\varepsilon$ basta, y hay que elegirlo.** No se demuestra la
      negación «para todo $\varepsilon$»: eso es falso, porque con
      $\varepsilon = 100$ la condición sí se cumple. Se elige uno concreto que
      falle. Aquí vale cualquier $\varepsilon\le 2$.

      **Un solo $n$ no basta.** Enseñar que $x_{1} = 1$ está lejos de $-2$ no
      demuestra nada: la definición permite que los primeros términos estén
      donde quieran. Lo que hace la demostración es acotar **todos** los
      términos a la vez, y por eso funciona sea cual sea el $m$.
