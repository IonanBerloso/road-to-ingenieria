ejercicios:
  - id: ex1819-rec-1-una-desigualdad-que-no-esta-definida
    titulo: Una desigualdad entre complejos, que obliga a pensar antes de calcular
    fuente: >-
      Ejercicio 1 · Cuarta evaluación, PRIMER CUATRIMESTRAL, 18 de febrero de
      2019 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión. El enunciado se reproduce tal
      cual, con la desigualdad entre complejos que trae escrita.
    nivel: examen
    puntos:
      comp2: 7
      comp4: 3
    enunciado: |
      Calcular y representar geométricamente los afijos de los números
      complejos $z$ que verifican las siguientes condiciones:

      $$
      \begin{cases}
      |z|^{2} \ge \operatorname{Im}(z) \\[2mm]
      \dfrac{1}{z} \ge \overline{z}
      \end{cases}
      $$
    pide: La región del plano y su dibujo.

    pasos:
      - tipo: reconocer
        pregunta: |
          La segunda condición compara dos números **complejos** con un «$\ge$».
          ¿Qué hay que hacer con eso?
        opciones:
          - texto: >-
              Darse cuenta de que $\mathbb{C}$ no está ordenado, y leerla como
              «la diferencia es un número real mayor o igual que cero»
            correcta: true
            mensaje: |
              Esa es la única lectura coherente, y decirla en voz alta es medio
              ejercicio. En $\mathbb{C}$ no hay orden compatible con las
              operaciones, así que «$w_{1}\ge w_{2}$» solo tiene sentido si
              $w_{1}-w_{2}$ resulta ser real y no negativo. Eso convierte la
              condición en **dos**: que sea real, y que sea $\ge 0$.
          - texto: >-
              Comparar los módulos, que sí son números reales
            mensaje: |
              Eso sería $\left|\frac1z\right| \ge |\overline z|$, que es otra
              condición y da otra región —el disco unidad—. El enunciado no
              escribe barras: si las quisiera, las pondría, como hace en la
              primera línea.
          - texto: >-
              Comparar las partes reales
            mensaje: |
              Tampoco: eso sería $\operatorname{Re}\frac1z \ge \operatorname{Re}\overline z$,
              y de nuevo es una condición distinta. Interpretar por tu cuenta
              lo que el enunciado no dice es justo lo que hay que evitar; lo
              que sí se puede es exigir que la comparación **tenga sentido**.
          - texto: >-
              Es un error del enunciado y el ejercicio no se puede hacer
            mensaje: |
              Sí se puede, y sale una región interesante. La condición no está
              mal escrita: está escrita de forma que obliga a preguntarse
              cuándo dos complejos son comparables, que es exactamente lo que
              quiere medir.

      - tipo: calcular
        titulo: El radio de la circunferencia donde hay igualdad
        pregunta: |
          $\frac{1}{z} - \overline{z} = \overline{z}\left(\frac{1}{|z|^{2}} - 1\right)$.
          ¿Para qué valor de $|z|$ se anula esa diferencia?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              En $z=0$ ni siquiera existe $\frac1z$, así que el origen queda
              fuera de la región antes de empezar. Lo que se anula es el
              paréntesis, no $z$.
          - valor: '2'
            mensaje: |
              $\frac{1}{|z|^{2}} = 1$ pide $|z|^{2} = 1$, no $|z|^{2} = \frac12$.
              Y el módulo es positivo, así que $|z| = 1$.
          - valor: '-1'
            mensaje: |
              Un módulo nunca es negativo. De $|z|^{2}=1$ sale $|z|=1$, la
              única raíz admisible.
        pista: |
          El paréntesis se anula cuando $\frac{1}{|z|^{2}} = 1$.
        desarrollo: |
          $$
          \frac{1}{z} = \frac{\overline z}{|z|^{2}}
          \qquad\Longrightarrow\qquad
          \frac1z - \overline z = \overline z\left(\frac{1}{|z|^{2}} - 1\right)
          $$

          El paréntesis se anula exactamente en $|z| = 1$. Y ahí la diferencia
          vale 0, que es real y $\ge 0$: **toda la circunferencia unidad cumple
          la condición**, con igualdad.

          Es el trozo de la respuesta que más se escapa, porque uno busca
          dónde la desigualdad es estricta y se olvida de dónde es igualdad.

      - tipo: calcular
        titulo: El extremo positivo del segmento real
        pregunta: |
          Fuera de $|z|=1$, la diferencia solo es real si $z$ lo es. Para
          $z = x$ real y positivo, ¿hasta qué valor de $x$ se cumple
          $\frac1x \ge x$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              En $x\to 0^{+}$ la condición se cumple de sobra —$\frac1x$ es
              enorme—, así que 0 no es donde deja de cumplirse, es por donde
              empieza. Lo que falla en 0 es que $\frac1z$ no existe.
          - valor: '2'
            mensaje: |
              En $x=2$: $\frac12 \ge 2$ es falso. Prueba dónde se cruzan las
              dos curvas: $\frac1x = x$ ocurre en $x=1$.
          - valor: '-1'
            mensaje: |
              $-1$ es el extremo del **otro** trozo, el de los negativos. La
              pregunta es por los positivos.
        pista: |
          Con $x>0$, multiplica los dos lados por $x$ sin cambiar el sentido:
          queda $1 \ge x^{2}$.
        desarrollo: |
          Para $z = x$ real y no nulo, $\overline z = x$ y

          $$
          \frac1x - x = \frac{1-x^{2}}{x} \ge 0
          $$

          - Si $x>0$, hace falta $1-x^{2}\ge 0$, o sea $0 < x \le 1$.
          - Si $x<0$, hace falta $1-x^{2}\le 0$, o sea $x \le -1$.

          Los dos extremos, $x=1$ y $x=-1$, ya estaban en la circunferencia
          unidad: los segmentos se enganchan a ella.

      - tipo: justificar
        titulo: La región entera
        pregunta: Ordena la descripción de la región. Una pieza es falsa.
        piezas:
          - texto: >-
              La primera condición, $|z|^{2}\ge\operatorname{Im}(z)$, es
              $x^{2}+y^{2}\ge y$, es decir
              $x^{2}+\left(y-\frac12\right)^{2}\ge\frac14$: fuera o sobre la
              circunferencia de centro $\left(0,\frac12\right)$ y radio
              $\frac12$.
          - texto: >-
              En la segunda hay que empezar diciendo que $\mathbb{C}$ no está
              ordenado: la desigualdad solo tiene sentido si
              $\frac1z-\overline z$ es real y no negativo.
          - texto: >-
              Y $\frac1z-\overline z = \overline z\left(\frac{1}{|z|^{2}}-1\right)$
              es real en dos casos: cuando $|z|=1$, porque entonces vale 0, o
              cuando $\overline z$ es real, o sea cuando $z$ lo es.
          - texto: >-
              En $|z|=1$ la diferencia es 0, que cumple el «$\ge$»: entra la
              circunferencia unidad entera.
          - texto: >-
              Para $z=x$ real, $\frac{1-x^{2}}{x}\ge 0$ da
              $x\le -1$ o $0<x\le 1$; el origen queda fuera porque $\frac1z$ no
              existe.
          - texto: >-
              La primera condición no recorta nada de lo anterior: sobre el eje
              real es $x^{2}\ge 0$, siempre cierta, y sobre $|z|=1$ es
              $1\ge y$, también siempre cierta.
          - texto: >-
              Como la segunda condición obliga a $z$ a ser real, la solución es
              solo un trozo del eje real.
            trampa: true
            mensaje: |
              Falta la circunferencia. La diferencia es real en dos casos, no
              en uno: además de $z$ real, está $|z|=1$, donde
              $\frac1z = \overline z$ exactamente y la diferencia vale 0 —que
              es un número real y cumple el «mayor o **igual**»—. Es el trozo
              de la respuesta que más se pierde, porque uno busca desigualdades
              estrictas y no mira dónde hay igualdad.

    resolucion: |
      ## Lo primero: la desigualdad no está definida, y hay que decirlo

      $\mathbb{C}$ **no es un cuerpo ordenado**: no existe ningún orden en el
      plano complejo compatible con la suma y el producto. Así que
      «$\frac1z \ge \overline z$», tal cual, no significa nada… salvo que se
      lea de la única manera que tiene sentido:

      > $w_{1} \ge w_{2}$ cuando $w_{1}-w_{2}$ **es un número real** y además
      > es mayor o igual que cero.

      Eso convierte una condición en dos, y ahí está la mitad del ejercicio.
      Empezar a calcular sin decirlo es perder los tres puntos de COMP4 en la
      primera línea.

      ## La segunda condición

      Como $\frac1z = \frac{\overline z}{|z|^{2}}$,

      $$
      \frac1z - \overline z
      = \overline z\left(\frac{1}{|z|^{2}} - 1\right)
      = \overline z\cdot\frac{1-|z|^{2}}{|z|^{2}}
      $$

      El factor $\frac{1-|z|^{2}}{|z|^{2}}$ es real siempre. Así que el
      producto es real en dos situaciones:

      **Caso 1: $|z| = 1$.** El factor se anula y la diferencia vale 0. Es
      real y cumple el «$\ge$» con igualdad. **Entra la circunferencia unidad
      entera**, no solo sus puntos reales.

      **Caso 2: $\overline z$ real**, es decir $z = x$ real y no nulo.
      Entonces

      $$
      \frac{1-x^{2}}{x} \ge 0
      \iff
      \begin{cases}
      0 < x \le 1 & \text{si } x>0\\
      x \le -1 & \text{si } x<0
      \end{cases}
      $$

      El origen queda fuera de todo: en $z=0$ no existe $\frac1z$.

      ## La primera condición no quita nada

      $$
      |z|^{2}\ge\operatorname{Im}(z)
      \iff x^{2}+y^{2}\ge y
      \iff x^{2}+\left(y-\tfrac12\right)^{2}\ge\tfrac14
      $$

      Es el exterior —cerrado— de la circunferencia de centro
      $\left(0,\frac12\right)$ y radio $\frac12$, que pasa por el origen y por
      $i$. Comprobamos que no recorta nada de lo que ya teníamos:

      - **sobre el eje real** ($y=0$): queda $x^{2}\ge 0$, cierta siempre;
      - **sobre $|z|=1$**: queda $1\ge y$, y en la circunferencia unidad
        $y\le 1$ siempre, con igualdad solo en $z=i$ — que también cumple.

      ## La respuesta

      $$
      \boxed{\;\{\,z : |z| = 1\,\}\;\cup\;\{\,x\in\mathbb{R} : x\le -1\,\}\;\cup\;\{\,x\in\mathbb{R} : 0<x\le 1\,\}\;}
      $$

      Al dibujarlo: la **circunferencia unidad** completa, la **semirrecta
      real** desde $-1$ hacia la izquierda —con el $-1$ incluido—, y el
      **segmento real** $(0,1]$, con el 1 incluido y el 0 no. Los dos trozos
      rectos tocan la circunferencia justo en $-1$ y en $1$.

      No es una región con área: es una curva más dos trozos de recta. Eso no
      es raro cuando una condición obliga a que algo sea real — reduce dos
      grados de libertad a uno.

      ## Por qué este ejercicio es distinto

      Los demás ejercicios de regiones piden traducir desigualdades a lugares
      geométricos. Este pide antes algo más básico: **decidir cuándo la
      pregunta tiene sentido**. Y castiga las dos prisas posibles — suponer que
      hay barras de módulo donde no las hay, y buscar solo desigualdades
      estrictas olvidando la igualdad.

  - id: ex1819-rec-2-seno-igual-a-seno-del-doble
    titulo: Una ecuación trigonométrica que en el plano complejo no crece
    fuente: >-
      Ejercicio 2 · Cuarta evaluación, PRIMER CUATRIMESTRAL, 18 de febrero de
      2019 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp2: 7
      comp4: 3
    enunciado: |
      Calcular y representar las soluciones de la ecuación
      $\operatorname{sen} z = \operatorname{sen} 2z$, con $z \in \mathbb{C}$.
    pide: Todas las soluciones complejas y su representación.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por dónde se empieza una ecuación así en $\mathbb{C}$?
        opciones:
          - texto: >-
              Por el ángulo doble: $\operatorname{sen}2z = 2\operatorname{sen}z\cos z$,
              que también vale en $\mathbb{C}$, y factorizar
            correcta: true
            mensaje: |
              Eso es. Queda
              $\operatorname{sen}z\,(1-2\cos z)=0$, y un producto de complejos
              es cero si y solo si lo es uno de los factores. Dos ecuaciones
              sencillas en vez de una difícil.
          - texto: >-
              Igualando los ángulos: $z = 2z$, luego $z=0$
            mensaje: |
              El seno no es inyectivo, así que de $\operatorname{sen}a =
              \operatorname{sen}b$ no se sigue $a=b$. Ya en $\mathbb{R}$
              fallaría: $\operatorname{sen}\pi = \operatorname{sen}0$ y
              $\pi\neq 0$.
          - texto: >-
              Pasando todo a exponenciales y resolviendo la ecuación que salga
            mensaje: |
              Se puede, y lleva al mismo sitio, pero sale una ecuación de
              cuarto grado en $e^{iz}$ donde es fácil perder soluciones. El
              ángulo doble la factoriza gratis.
          - texto: >-
              Dividiendo los dos lados entre $\operatorname{sen} z$
            mensaje: |
              Ese es **el** error del ejercicio: dividir entre algo que puede
              ser cero. Al hacerlo desaparecen todas las soluciones con
              $\operatorname{sen}z=0$, que son la mitad de la respuesta.

      - tipo: calcular
        titulo: El coseno que hace falta
        pregunta: |
          Del factor $1-2\cos z = 0$, ¿cuánto tiene que valer $\cos z$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              Has invertido: de $1 = 2\cos z$ sale $\cos z = \frac12$, no 2.
              (Y $\cos z = 2$ sí tiene solución en $\mathbb{C}$, pero es otra
              ecuación — cae en la recuperación de 2019-2020.)
          - valor: '-0.5'
            mensaje: |
              El signo. $1-2\cos z = 0$ da $2\cos z = 1$, positivo.
          - valor: '1'
            mensaje: |
              1 es el término independiente, no el valor del coseno. Despeja:
              $\cos z = \frac{1}{2}$.
        pista: |
          $1 - 2\cos z = 0 \Rightarrow 2\cos z = 1$.
        desarrollo: |
          $$
          \operatorname{sen}z = \operatorname{sen}2z = 2\operatorname{sen}z\cos z
          \;\Longrightarrow\;
          \operatorname{sen}z\,(1 - 2\cos z) = 0
          $$

          El segundo factor da $\cos z = \dfrac12$.

          Y como $\frac12$ es real y está en $[-1,1]$, **todas** las soluciones
          de $\cos z = \frac12$ son reales: son las de siempre,
          $z = \pm\frac{\pi}{3}+2k\pi$. Que la ecuación se plantee en
          $\mathbb{C}$ no obliga a que aparezcan soluciones nuevas.

      - tipo: justificar
        titulo: El conjunto de soluciones
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La fórmula del ángulo doble
              $\operatorname{sen}2z = 2\operatorname{sen}z\cos z$ vale en todo
              $\mathbb{C}$: se comprueba con las definiciones exponenciales.
          - texto: >-
              La ecuación se factoriza como
              $\operatorname{sen}z\,(1-2\cos z)=0$, y en $\mathbb{C}$ un
              producto es cero si y solo si lo es alguno de sus factores.
          - texto: >-
              Primer factor: $\operatorname{sen}z=0$ da $z = k\pi$,
              $k\in\mathbb{Z}$, y son todas reales.
          - texto: >-
              Segundo factor: $\cos z=\frac12$. Como $\frac12$ es real y está
              en $[-1,1]$, sus soluciones también son reales:
              $z=\pm\frac{\pi}{3}+2k\pi$.
          - texto: >-
              Al representarlas, todas caen sobre el eje real: la ecuación no
              tiene ninguna solución fuera de él.
          - texto: >-
              Como la ecuación se plantea en $\mathbb{C}$, además de las
              reales hay infinitas soluciones con parte imaginaria no nula.
            trampa: true
            mensaje: |
              Aquí no las hay, y decirlo es parte de la respuesta. Los dos
              factores conducen a $\operatorname{sen}z=0$ y a
              $\cos z=\frac12$, y las dos son ecuaciones cuyos valores
              —0 y $\frac12$— están en el rango que el seno y el coseno **ya
              alcanzan siendo reales**. Plantear en $\mathbb{C}$ amplía el
              conjunto de soluciones cuando el valor pedido se sale de
              $[-1,1]$, como en $\cos z = 2$; aquí no se sale.

    resolucion: |
      ## Factorizar, y no dividir

      La identidad del ángulo doble vale en $\mathbb{C}$ —se comprueba con las
      definiciones exponenciales—, así que

      $$
      \operatorname{sen}z = 2\operatorname{sen}z\cos z
      \;\Longleftrightarrow\;
      \operatorname{sen}z\,(1-2\cos z) = 0
      $$

      Y $\mathbb{C}$ no tiene divisores de cero: el producto se anula si y solo
      si se anula uno de los dos factores.

      **La tentación es dividir entre $\operatorname{sen}z$** y quedarse con
      $\cos z = \frac12$. Al hacerlo desaparecen las soluciones $z = k\pi$, que
      son la mitad de la respuesta. Es el error clásico de estas ecuaciones y
      aquí cuesta la mitad de la COMP2.

      ## Los dos factores

      **$\operatorname{sen}z = 0$.** En forma exponencial,
      $e^{iz} = e^{-iz}$, o sea $e^{2iz}=1$, luego $2iz = 2k\pi i$ y

      $$
      z = k\pi, \qquad k\in\mathbb{Z}
      $$

      **$\cos z = \frac12$.** Aquí conviene decir algo antes de calcular: el
      valor pedido, $\frac12$, es real y está en $[-1,1]$, así que ya lo alcanza
      el coseno real. Resolviendo con $w = e^{iz}$:

      $$
      \frac{w + w^{-1}}{2} = \frac12
      \;\Longrightarrow\;
      w^{2} - w + 1 = 0
      \;\Longrightarrow\;
      w = \frac{1 \pm i\sqrt3}{2} = e^{\pm i\pi/3}
      $$

      Los dos tienen módulo 1, así que $iz$ es imaginario puro y $z$ es real:

      $$
      z = \pm\frac{\pi}{3} + 2k\pi, \qquad k\in\mathbb{Z}
      $$

      ## La solución completa

      $$
      \boxed{\;z = k\pi
      \quad\text{o}\quad
      z = \pm\frac{\pi}{3} + 2k\pi,
      \qquad k\in\mathbb{Z}\;}
      $$

      **Todas reales.** Al representarlas se dibuja el eje real con los puntos
      marcados: $\dots,\,-\pi,\,-\frac{\pi}{3},\,0,\,\frac{\pi}{3},\,\pi,\,
      \frac{5\pi}{3},\,2\pi,\,\dots$ Conviene decir en el examen que **no hay
      ninguna fuera del eje real**, y por qué: los dos valores que hay que
      alcanzar, 0 y $\frac12$, están dentro de $[-1,1]$.

      ## El contraste que conviene tener en la cabeza

      Que una ecuación se plantee en $\mathbb{C}$ no significa que vayan a
      aparecer soluciones complejas. Aparecen cuando el valor pedido se sale
      del rango real: $\cos z = 2$ —la recuperación de 2019-2020— no tiene
      ninguna solución real y todas las suyas son complejas puras. Aquí pasa lo
      contrario, y saber distinguir los dos casos es lo que este ejercicio
      mide.

  - id: ex1819-rec-3-negar-un-limite
    titulo: Demostrar que algo NO es el límite
    fuente: >-
      Ejercicio 3 · Cuarta evaluación, PRIMER CUATRIMESTRAL, 18 de febrero de
      2019 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp4: 8
    enunciado: |
      a) Definir formalmente el concepto siguiente: el límite de la sucesión
      $\{x_{n}\}_{n\in\mathbb{N}}$ es $l$.

      b) Utilizando el apartado anterior demostrar que
      $\left\{\dfrac{1}{n}\right\}_{n\in\mathbb{N}} \not\to -2$.
    pide: La definición y la demostración de que −2 no es el límite.

    pasos:
      - tipo: reconocer
        pregunta: |
          Para demostrar que $-2$ **no** es el límite, ¿qué hay que exhibir?
        opciones:
          - texto: >-
              Un $\varepsilon>0$ concreto para el que **ningún** $m$ funcione
            correcta: true
            mensaje: |
              Exacto. La negación de «para todo $\varepsilon$ existe $m$…» es
              «existe un $\varepsilon$ tal que para todo $m$ hay algún
              $n\ge m$ con $|x_{n}-l|\ge\varepsilon$». Basta con **un**
              $\varepsilon$ que falle, y aquí falla cualquiera menor o igual
              que 2.
          - texto: >-
              Comprobar que el límite verdadero es 0, que es distinto de $-2$
            mensaje: |
              Es cierto y sirve —el límite es único—, pero el enunciado dice
              «utilizando el apartado anterior», o sea con la definición. Y
              además esa vía necesita el teorema de unicidad, que es más
              maquinaria de la que hace falta.
          - texto: >-
              Encontrar un $n$ para el que $\left|\frac1n+2\right|$ sea grande
            mensaje: |
              Un solo $n$ no basta: la definición permite que los primeros
              términos estén lejos. Hay que ver que **todos** a partir de
              cualquier $m$ siguen lejos, y para eso hace falta la cota que
              vale para todo $n$.
          - texto: >-
              Probar que para todo $\varepsilon$ ningún $m$ funciona
            mensaje: |
              Eso es más de lo necesario —y de hecho falso: con
              $\varepsilon = 100$ cualquier $m$ funciona—. La negación de un
              «para todo» es un «existe»: con un solo $\varepsilon$ que falle
              ya está.

      - tipo: calcular
        titulo: La distancia que nunca baja
        pregunta: |
          La distancia $\left\lvert\dfrac{1}{n} - (-2)\right\rvert$ va
          disminuyendo según crece $n$, pero se queda siempre por encima de un
          valor. ¿De cuál?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              0 sería la distancia si $-2$ fuera el límite, que es justo lo que
              queremos descartar. Lo que tiende a 0 es $\frac1n$, no la
              distancia: a esta le queda siempre el $+2$.
          - valor: '-2'
            mensaje: |
              Una distancia nunca es negativa: el valor absoluto se encarga.
              $-2$ es el número del que nos estamos alejando, no la distancia.
          - valor: '3'
            mensaje: |
              3 es la distancia en $n=1$, o sea la **mayor** de todas. La
              pregunta es por la cota inferior: el valor por debajo del cual la
              distancia no llega a bajar nunca.
        pista: |
          $\left\lvert\frac1n+2\right\rvert = \frac1n + 2$, porque los dos
          sumandos son positivos. ¿A qué se acerca eso, y desde qué lado?
        desarrollo: |
          Para todo $n$, y como $\frac1n>0$:

          $$
          \left\lvert\frac1n - (-2)\right\rvert = \frac1n + 2 > 2
          $$

          La distancia baja hacia 2 —en $n=1$ vale 3, en $n=100$ vale
          $2{,}01$— pero **nunca lo alcanza ni lo cruza**.

          Ahí está toda la demostración: si se toma cualquier
          $\varepsilon \le 2$, ningún término entra jamás en la banda, por
          grande que se elija $m$. Basta con uno, y el más cómodo de escribir
          es $\varepsilon = 1$.

      - tipo: justificar
        titulo: La demostración
        pregunta: Ordena la demostración. Una pieza es falsa.
        piezas:
          - texto: >-
              **Definición.** $\lim x_{n} = l$ si para todo $\varepsilon>0$
              existe $m\in\mathbb{N}$ tal que $|x_{n}-l|<\varepsilon$ para todo
              $n\ge m$.
          - texto: >-
              **Negación.** $\lim x_{n} \neq l$ si existe algún
              $\varepsilon>0$ tal que, para todo $m$, hay algún $n\ge m$ con
              $|x_{n}-l|\ge\varepsilon$.
          - texto: >-
              Tomamos $\varepsilon = 1$, que es una elección concreta y basta
              con una.
          - texto: >-
              Para todo $n$,
              $\left|\frac1n-(-2)\right| = \frac1n+2 > 2 > 1 = \varepsilon$,
              porque $\frac1n$ es positivo.
          - texto: >-
              Como la desigualdad vale para **todos** los $n$, sea cual sea el
              $m$ que se proponga siempre hay términos que se salen. Luego
              $-2$ no es el límite.
          - texto: >-
              Basta con observar que $\frac1n$ es positivo y $-2$ negativo, y
              que una sucesión de términos positivos no puede tener límite
              negativo.
            trampa: true
            mensaje: |
              La conclusión es cierta, pero el argumento no es «basta con
              observar»: es un **teorema** —si $a_{n}\ge 0$ y $a_{n}\to L$
              entonces $L\ge 0$— que hay que demostrar aparte, y que de hecho
              cae como ejercicio completo en las recuperaciones de 2019-2020 y
              2020-2021. Además el enunciado pide usar la definición, no un
              resultado posterior.

    resolucion: |
      Ocho de los diez puntos son COMP4. No hay nada que calcular: hay que
      **negar** una definición y usarla.

      ## a) La definición

      > $\lim_{n\to\infty} x_{n} = l$ si para todo $\varepsilon>0$ existe
      > $m\in\mathbb{N}$ tal que $|x_{n}-l|<\varepsilon$ para todo $n\ge m$.

      ## Su negación, que es lo que aquí hace falta

      Se niega cambiando cada cuantificador y la desigualdad final:

      > $\lim x_{n} \neq l$ si **existe** $\varepsilon>0$ tal que **para todo**
      > $m\in\mathbb{N}$ **existe** $n\ge m$ con $|x_{n}-l|\ge\varepsilon$.

      Escribir esa línea bien es lo que se está evaluando. El error más común
      es negar solo la desigualdad y dejar los cuantificadores como estaban.

      ## b) La demostración

      Tómese $\varepsilon = 1$. Para **todo** $n\in\mathbb{N}$:

      $$
      \left|\frac1n - (-2)\right| = \left|\frac1n + 2\right| = \frac1n + 2 > 2 > 1 = \varepsilon
      $$

      —el valor absoluto se quita sin cambiar nada porque los dos sumandos son
      positivos.

      Como la desigualdad se cumple para todos los $n$, dado cualquier $m$
      basta tomar $n=m$ para tener un término que se sale de la banda. Por
      tanto no existe ningún $m$ que sirva, y

      $$
      \left\{\frac1n\right\} \not\to -2 \qquad \blacksquare
      $$

      ## Dos avisos que valen puntos

      **Un solo $\varepsilon$ basta, y hay que elegirlo.** No se demuestra la
      negación «para todo $\varepsilon$»: eso es falso, porque con
      $\varepsilon = 100$ la condición sí se cumple. Se elige uno concreto que
      falle. Aquí vale cualquier $\varepsilon\le 2$.

      **Un solo $n$ no basta.** Enseñar que $x_{1} = 1$ está lejos de $-2$ no
      demuestra nada: la definición permite que los primeros términos estén
      donde quieran. Lo que hace la demostración es acotar **todos** los
      términos a la vez, y por eso funciona sea cual sea el $m$.
