        consigna: |
          Dibuja las dos circunferencias frontera en el mismo plano y sombrea la
          región que cumple las dos condiciones. Marca el punto excluido.
        comprueba:
          - punto: |
              La circunferencia unidad, con el **interior** como región de la
              segunda condición.
            porque: |
              $\tfrac1z\ge\overline z$ solo tiene sentido si los dos lados son
              reales, y al reducirla queda $\lvert z\rvert\le1$. Es el contorno
              exterior.
          - punto: |
              La circunferencia de centro $\left(0,\tfrac12\right)$ y radio
              $\tfrac12$, tangente al eje real en el origen.
            porque: |
              $\lvert z\rvert^{2}\ge\operatorname{Im}z$ es
              $x^{2}+\left(y-\tfrac12\right)^{2}\ge\tfrac14$: hay que estar
              **fuera** de ese disco pequeño.
          - punto: |
              La región sombreada con forma de luna: dentro de la grande y fuera
              de la pequeña.
            porque: |
              Es la intersección de las dos condiciones. Sombrear al revés da la
              región complementaria, que no cumple ninguna de las dos.
          - punto: |
              El origen marcado como excluido.
            porque: |
              La segunda condición lleva $\tfrac1z$, que no existe en $z=0$. Es
              una exclusión que desaparece al simplificar y hay que arrastrarla
              desde el principio.
        veredicto: |
          Las dos circunferencias son tangentes interiormente en $i$. Si en tu
          dibujo se cortan en dos puntos, alguno de los dos radios está mal — y
          esa tangencia es lo que le da a la región su forma de media luna.

    resolucion: |
      ## Lo primero: la desigualdad no está definida, y hay que decirlo

      $\mathbb{C}$ **no es un cuerpo ordenado**: no existe ningún orden en el
      plano complejo compatible con la suma y el producto. Así que
      «$\frac1z \ge \overline z$», tal cual, no significa nada… salvo que se
      lea de la única manera que tiene sentido:

      > $w_{1} \ge w_{2}$ cuando $w_{1}-w_{2}$ **es un número real** y además
      > es mayor o igual que cero.

      Eso convierte una condición en dos, y ahí está la mitad del ejercicio.
      Empezar a calcular sin decirlo es perder los tres puntos de COMP4 en la
      primera línea.

      ## La segunda condición

      Como $\frac1z = \frac{\overline z}{|z|^{2}}$,

      $$
      \frac1z - \overline z
      = \overline z\left(\frac{1}{|z|^{2}} - 1\right)
      = \overline z\cdot\frac{1-|z|^{2}}{|z|^{2}}
      $$

      El factor $\frac{1-|z|^{2}}{|z|^{2}}$ es real siempre. Así que el
      producto es real en dos situaciones:

      **Caso 1: $|z| = 1$.** El factor se anula y la diferencia vale 0. Es
      real y cumple el «$\ge$» con igualdad. **Entra la circunferencia unidad
      entera**, no solo sus puntos reales.

      **Caso 2: $\overline z$ real**, es decir $z = x$ real y no nulo.
      Entonces

      $$
      \frac{1-x^{2}}{x} \ge 0
      \iff
      \begin{cases}
      0 < x \le 1 & \text{si } x>0\\
      x \le -1 & \text{si } x<0
      \end{cases}
      $$

      El origen queda fuera de todo: en $z=0$ no existe $\frac1z$.

      ## La primera condición no quita nada

      $$
      |z|^{2}\ge\operatorname{Im}(z)
      \iff x^{2}+y^{2}\ge y
      \iff x^{2}+\left(y-\tfrac12\right)^{2}\ge\tfrac14
      $$

      Es el exterior —cerrado— de la circunferencia de centro
      $\left(0,\frac12\right)$ y radio $\frac12$, que pasa por el origen y por
      $i$. Comprobamos que no recorta nada de lo que ya teníamos:

      - **sobre el eje real** ($y=0$): queda $x^{2}\ge 0$, cierta siempre;
      - **sobre $|z|=1$**: queda $1\ge y$, y en la circunferencia unidad
        $y\le 1$ siempre, con igualdad solo en $z=i$ — que también cumple.

      ## La respuesta

      $$
      \boxed{\;\{\,z : |z| = 1\,\}\;\cup\;\{\,x\in\mathbb{R} : x\le -1\,\}\;\cup\;\{\,x\in\mathbb{R} : 0<x\le 1\,\}\;}
      $$

      Al dibujarlo: la **circunferencia unidad** completa, la **semirrecta
      real** desde $-1$ hacia la izquierda —con el $-1$ incluido—, y el
      **segmento real** $(0,1]$, con el 1 incluido y el 0 no. Los dos trozos
      rectos tocan la circunferencia justo en $-1$ y en $1$.

      No es una región con área: es una curva más dos trozos de recta. Eso no
      es raro cuando una condición obliga a que algo sea real — reduce dos
      grados de libertad a uno.

      ## Por qué este ejercicio es distinto

      Los demás ejercicios de regiones piden traducir desigualdades a lugares
      geométricos. Este pide antes algo más básico: **decidir cuándo la
      pregunta tiene sentido**. Y castiga las dos prisas posibles — suponer que
      hay barras de módulo donde no las hay, y buscar solo desigualdades
      estrictas olvidando la igualdad.

  - id: ex1819-rec-2-seno-igual-a-seno-del-doble
    titulo: Una ecuación trigonométrica que en el plano complejo no crece
    fuente: >-
      Ejercicio 2 · Cuarta evaluación, PRIMER CUATRIMESTRAL, 18 de febrero de
      2019 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp2: 7
      comp4: 3
    enunciado: |
      Calcular y representar las soluciones de la ecuación
      $\operatorname{sen} z = \operatorname{sen} 2z$, con $z \in \mathbb{C}$.
    pide: Todas las soluciones complejas y su representación.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por dónde se empieza una ecuación así en $\mathbb{C}$?
        opciones:
          - texto: >-
              Por el ángulo doble: $\operatorname{sen}2z = 2\operatorname{sen}z\cos z$,
              que también vale en $\mathbb{C}$, y factorizar
            correcta: true
            mensaje: |
              Eso es. Queda
              $\operatorname{sen}z\,(1-2\cos z)=0$, y un producto de complejos
              es cero si y solo si lo es uno de los factores. Dos ecuaciones
              sencillas en vez de una difícil.
          - texto: >-
              Igualando los ángulos: $z = 2z$, luego $z=0$
            mensaje: |
              El seno no es inyectivo, así que de $\operatorname{sen}a =
              \operatorname{sen}b$ no se sigue $a=b$. Ya en $\mathbb{R}$
              fallaría: $\operatorname{sen}\pi = \operatorname{sen}0$ y
              $\pi\neq 0$.
          - texto: >-
              Pasando todo a exponenciales y resolviendo la ecuación que salga
            mensaje: |
              Se puede, y lleva al mismo sitio, pero sale una ecuación de
              cuarto grado en $e^{iz}$ donde es fácil perder soluciones. El
              ángulo doble la factoriza gratis.
          - texto: >-
              Dividiendo los dos lados entre $\operatorname{sen} z$
            mensaje: |
              Ese es **el** error del ejercicio: dividir entre algo que puede
              ser cero. Al hacerlo desaparecen todas las soluciones con
              $\operatorname{sen}z=0$, que son la mitad de la respuesta.

      - tipo: calcular
        titulo: El coseno que hace falta
        pregunta: |
          Del factor $1-2\cos z = 0$, ¿cuánto tiene que valer $\cos z$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              Has invertido: de $1 = 2\cos z$ sale $\cos z = \frac12$, no 2.
              (Y $\cos z = 2$ sí tiene solución en $\mathbb{C}$, pero es otra
              ecuación — cae en la recuperación de 2019-2020.)
          - valor: '-0.5'
            mensaje: |
              El signo. $1-2\cos z = 0$ da $2\cos z = 1$, positivo.
          - valor: '1'
            mensaje: |
              1 es el término independiente, no el valor del coseno. Despeja:
              $\cos z = \frac{1}{2}$.
        pista: |
          $1 - 2\cos z = 0 \Rightarrow 2\cos z = 1$.
        desarrollo: |
          $$
          \operatorname{sen}z = \operatorname{sen}2z = 2\operatorname{sen}z\cos z
          \;\Longrightarrow\;
          \operatorname{sen}z\,(1 - 2\cos z) = 0
          $$

          El segundo factor da $\cos z = \dfrac12$.

          Y como $\frac12$ es real y está en $[-1,1]$, **todas** las soluciones
          de $\cos z = \frac12$ son reales: son las de siempre,
          $z = \pm\frac{\pi}{3}+2k\pi$. Que la ecuación se plantee en
          $\mathbb{C}$ no obliga a que aparezcan soluciones nuevas.

      - tipo: justificar
        titulo: El conjunto de soluciones
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La fórmula del ángulo doble
              $\operatorname{sen}2z = 2\operatorname{sen}z\cos z$ vale en todo
              $\mathbb{C}$: se comprueba con las definiciones exponenciales.
          - texto: >-
              La ecuación se factoriza como
              $\operatorname{sen}z\,(1-2\cos z)=0$, y en $\mathbb{C}$ un
              producto es cero si y solo si lo es alguno de sus factores.
          - texto: >-
              Primer factor: $\operatorname{sen}z=0$ da $z = k\pi$,
              $k\in\mathbb{Z}$, y son todas reales.
          - texto: >-
              Segundo factor: $\cos z=\frac12$. Como $\frac12$ es real y está
              en $[-1,1]$, sus soluciones también son reales:
              $z=\pm\frac{\pi}{3}+2k\pi$.
          - texto: >-
              Al representarlas, todas caen sobre el eje real: la ecuación no
              tiene ninguna solución fuera de él.
          - texto: >-
              Como la ecuación se plantea en $\mathbb{C}$, además de las
              reales hay infinitas soluciones con parte imaginaria no nula.
            trampa: true
            mensaje: |
              Aquí no las hay, y decirlo es parte de la respuesta. Los dos
              factores conducen a $\operatorname{sen}z=0$ y a
              $\cos z=\frac12$, y las dos son ecuaciones cuyos valores
              —0 y $\frac12$— están en el rango que el seno y el coseno **ya
              alcanzan siendo reales**. Plantear en $\mathbb{C}$ amplía el
              conjunto de soluciones cuando el valor pedido se sale de
              $[-1,1]$, como en $\cos z = 2$; aquí no se sale.

      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 380 165" role="img" width="380" height="165"
               aria-labelledby="f-ex1819-senos-t f-ex1819-senos-d">
            <title id="f-ex1819-senos-t">Las dos familias de soluciones, todas sobre el eje real</title>
            <desc id="f-ex1819-senos-d">Todas las soluciones son reales. Una familia, marcada con punto lleno, está en los múltiplos de pi: menos dos pi, menos pi, cero, pi y dos pi. La otra, marcada con otro color, está en más y menos pi tercios y en esos mismos valores desplazados dos pi. Las dos familias no comparten ningún punto.</desc>
            <style>
