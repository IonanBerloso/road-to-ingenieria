ejercicios:
  - id: ex1617-rec-1-de-moivre-y-el-coseno-cuadruple
    titulo: Deducir De Moivre, y cobrarla en cos 4x
    fuente: >-
      Ejercicio 1 · Cuarta evaluación, PRIMER CUATRIMESTRAL, 13 de marzo de
      2017 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 3
      comp4: 5
    enunciado: |
      a) Utilizando la forma exponencial, deducir el módulo y argumento del
      producto de dos números complejos.

      b) Demostrar la fórmula de De Moivre

      $$
      (\cos\theta + i\operatorname{sen}\theta)^{n} = \cos n\theta + i\operatorname{sen} n\theta
      $$

      c) Utilizando el apartado anterior calcular $\cos 4x$.
    pide: La regla del producto, la demostración de De Moivre y cos 4x.

    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado c) dice «utilizando el apartado anterior». ¿Qué hay que
          hacer con De Moivre para que salga $\cos 4x$?
        opciones:
          - texto: >-
              Escribir $(\cos x + i\operatorname{sen} x)^{4}$ de las dos
              maneras e igualar **las partes reales**
            correcta: true
            mensaje: |
              Ese es el mecanismo entero. De Moivre dice que ese número vale
              $\cos 4x + i\operatorname{sen}4x$; el binomio de Newton lo
              desarrolla en potencias de $\cos x$ y $\operatorname{sen} x$. Dos
              complejos son iguales si coinciden parte real y parte imaginaria:
              la real da $\cos 4x$ y, de regalo, la imaginaria da
              $\operatorname{sen}4x$.
          - texto: Aplicar dos veces la fórmula del ángulo doble
            mensaje: |
              Llega al resultado, sí, pero no es «utilizando el apartado
              anterior»: el enunciado pide expresamente pasar por De Moivre, y
              ahí está la mitad de la nota.
          - texto: >-
              Derivar cuatro veces $\cos x$
            mensaje: |
              Derivar da $\cos x$ otra vez con signos cambiados, no $\cos 4x$.
              Son cosas distintas: una es la derivada cuarta, la otra el coseno
              del cuádruple del ángulo.
          - texto: >-
              Sustituir $n=4$ en De Moivre y ya está
            mensaje: |
              Eso da $\cos 4x + i\operatorname{sen}4x$, que es solo **un lado**
              de la igualdad. Falta desarrollar el otro lado con el binomio,
              que es de donde sale la expresión pedida.

      - tipo: calcular
        titulo: El coeficiente de cos⁴x
        pregunta: |
          Escribiendo $\cos 4x = a\cos^{4}x + b\cos^{2}x + c$, ¿cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              El 1 es el coeficiente que sale del binomio **antes** de cambiar
              $\operatorname{sen}^{2}x$ por $1-\cos^{2}x$:
              $\cos^{4}x - 6\cos^{2}x\operatorname{sen}^{2}x + \operatorname{sen}^{4}x$.
              Al sustituir, esos tres términos aportan todos a $\cos^{4}x$ y
              suman $1+6+1=8$.
          - valor: '4'
            mensaje: |
              El 4 es el exponente, no el coeficiente. Sale de contar los
              términos del binomio, no de sumarlos.
          - valor: '-8'
            mensaje: |
              El signo va al revés: los tres aportes a $\cos^{4}x$ son $+1$,
              $+6$ y $+1$. El $-8$ es el coeficiente de $\cos^{2}x$.
        pista: |
          Desarrolla $(\cos x + i\operatorname{sen}x)^{4}$, quédate con la
          parte real, y después cambia todo $\operatorname{sen}^{2}x$ por
          $1-\cos^{2}x$. Cuenta cuántos $\cos^{4}x$ quedan.
        desarrollo: |
          El binomio, quedándonos con la parte real (los términos con potencia
          par de $i$):

          $$
          \operatorname{Re}\left[(\cos x + i\operatorname{sen}x)^{4}\right]
          = \cos^{4}x - 6\cos^{2}x\operatorname{sen}^{2}x + \operatorname{sen}^{4}x
          $$

          Sustituyendo $\operatorname{sen}^{2}x = 1-\cos^{2}x$ y llamando
          $c = \cos^{2} x$:

          $$
          c^{2} - 6c(1-c) + (1-c)^{2}
          = c^{2} - 6c + 6c^{2} + 1 - 2c + c^{2}
          = 8c^{2} - 8c + 1
          $$

          $$
          \boxed{\cos 4x = 8\cos^{4}x - 8\cos^{2}x + 1}
          $$

      - tipo: justificar
        titulo: La demostración de De Moivre
        pregunta: Ordena la demostración de De Moivre. Una pieza es falsa.
        piezas:
          - texto: >-
              Por la fórmula de Euler,
              $\cos\theta + i\operatorname{sen}\theta = e^{i\theta}$.
          - texto: >-
              Entonces
              $(\cos\theta+i\operatorname{sen}\theta)^{n} = \left(e^{i\theta}\right)^{n}
              = e^{i n\theta}$, usando que la exponencial convierte productos
              en sumas de exponentes.
          - texto: >-
              Y deshaciendo Euler en sentido contrario,
              $e^{in\theta} = \cos n\theta + i\operatorname{sen}n\theta$, que
              es la fórmula.
          - texto: >-
              Alternativamente se demuestra por inducción sobre $n$: el caso
              $n=1$ es trivial y el paso usa las fórmulas del seno y el coseno
              de una suma.
          - texto: >-
              La fórmula vale para todo $n$ entero, positivo o negativo, porque
              $e^{-i\theta} = 1/e^{i\theta}$.
          - texto: >-
              De la demostración se sigue además que
              $(\cos\theta+i\operatorname{sen}\theta)^{n} = \cos^{n}\theta + i\operatorname{sen}^{n}\theta$.
            trampa: true
            mensaje: |
              Ese es el error clásico y es justo lo contrario de lo que dice
              De Moivre: el exponente pasa al **ángulo**, no a cada función por
              separado. Se ve con $n=2$ y $\theta = \pi/4$: el lado bueno vale
              $\cos\frac{\pi}{2} + i\operatorname{sen}\frac{\pi}{2} = i$,
              y el falso valdría $\frac12 + \frac12 i$.

    resolucion: |
      Los tres apartados son el mismo hilo: la forma exponencial explica el
      producto, el producto repetido es De Moivre, y De Moivre da las fórmulas
      del ángulo múltiple. Cinco de los diez puntos son COMP4, así que lo que
      se corrige es que ese hilo se vea.

      ## a) El producto en forma exponencial

      Con $z_{1} = r_{1}e^{i\theta_{1}}$ y $z_{2} = r_{2}e^{i\theta_{2}}$:

      $$
      z_{1}z_{2} = r_{1}r_{2}\,e^{i\theta_{1}}e^{i\theta_{2}}
      = r_{1}r_{2}\,e^{i(\theta_{1}+\theta_{2})}
      $$

      El único paso es $e^{a}e^{b} = e^{a+b}$, y de ahí se lee todo:

      $$
      |z_{1}z_{2}| = |z_{1}||z_{2}|,
      \qquad
      \arg(z_{1}z_{2}) = \arg z_{1} + \arg z_{2}
      $$

      **Multiplicar es girar y escalar.** El módulo escala, el argumento gira.
      Conviene decirlo con esas palabras: es lo que hace que el resto del
      ejercicio sea casi automático.

      ## b) De Moivre

      Tomando $r=1$ en lo anterior y multiplicando $n$ veces:

      $$
      (\cos\theta+i\operatorname{sen}\theta)^{n}
      = \left(e^{i\theta}\right)^{n}
      = e^{in\theta}
      = \cos n\theta + i\operatorname{sen} n\theta
      $$

      Vale para todo entero $n$: para negativos basta con
      $e^{-i\theta} = 1/e^{i\theta}$.

      ## c) cos 4x

      Se escribe el mismo número de dos maneras y se igualan las partes reales.
      Por De Moivre con $n=4$:

      $$
      (\cos x + i\operatorname{sen}x)^{4} = \cos 4x + i\operatorname{sen}4x
      $$

      Por el binomio de Newton, quedándonos con la parte real:

      $$
      \cos^{4}x - 6\cos^{2}x\operatorname{sen}^{2}x + \operatorname{sen}^{4}x
      $$

      Igualando y sustituyendo $\operatorname{sen}^{2}x = 1 - \cos^{2}x$:

      $$
      \cos 4x = 8\cos^{4}x - 8\cos^{2}x + 1
      $$

      Y de la parte imaginaria sale gratis la otra fórmula:

      $$
      \operatorname{sen}4x = 4\cos^{3}x\operatorname{sen}x - 4\cos x\operatorname{sen}^{3}x
      $$

      ## La comprobación que cabe en una línea

      En $x=0$: $\cos 0 = 1$ y $8 - 8 + 1 = 1$. En $x = \pi/2$: $\cos 2\pi = 1$
      y $\cos x = 0$, así que la expresión vale 1. Dos valores no demuestran
      nada, pero cazan casi cualquier error de signo o de coeficiente, y
      cuestan diez segundos.

  - id: ex1617-rec-2-el-limite-de-uno-partido-n
    titulo: La definición de límite, aplicada al caso más simple que hay
    fuente: >-
      Ejercicio 2 · Cuarta evaluación, PRIMER CUATRIMESTRAL, 13 de marzo de
      2017 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 2
      comp4: 7
    enunciado: |
      Demostrar que el límite de la sucesión $\left\{\dfrac{1}{n}\right\}_{n\in\mathbb{N}}$
      es 0. ¿Cuánto vale el límite de $\left\{-\dfrac{1}{n}\right\}_{n\in\mathbb{N}}$?
    pide: La demostración con epsilon, y el límite de la sucesión opuesta.

    pasos:
      - tipo: reconocer
        pregunta: |
          «Demostrar que el límite es 0». Siete de los diez puntos son COMP4.
          ¿Qué se espera exactamente?
        opciones:
          - texto: >-
              Escribir la definición con $\varepsilon$ y encontrar, para cada
              $\varepsilon>0$, un $m$ a partir del cual $\left|\frac1n\right|<\varepsilon$
            correcta: true
            mensaje: |
              Eso es. «Demostrar un límite» significa exhibir el $m$ en función
              de $\varepsilon$. Decir «es evidente que tiende a cero» vale cero
              puntos de COMP4, por muy cierto que sea.
          - texto: >-
              Calcular $\lim_{n\to\infty} \frac1n$ aplicando que el
              denominador tiende a infinito
            mensaje: |
              Eso es **usar** que el límite es cero, no demostrarlo. La
              propiedad que invocas se apoya, en última instancia, en esta
              misma definición.
          - texto: >-
              Dar una tabla de valores que se acerquen a cero
            mensaje: |
              Una tabla no demuestra nada: por muchos términos que mires,
              siempre quedan infinitos sin mirar. La definición existe
              precisamente para no depender de eso.
          - texto: >-
              Probar que la sucesión es decreciente y está acotada
              inferiormente por 0
            mensaje: |
              Eso demuestra que **converge**, por el teorema de la sucesión
              monótona, pero no dice a qué. Su límite podría ser cualquier cosa
              en $[0,1]$ hasta que lo identifiques.

      - tipo: calcular
        titulo: El m que hace falta
        pregunta: |
          Para $\varepsilon = 0{,}01$, ¿cuál es el menor natural $m$ tal que
          $\left|\frac1n\right| < \varepsilon$ para todo $n \ge m$?
        respuesta:
          tipo: numero
          valor: '101'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '100'
            mensaje: |
              En $n = 100$ sale $\frac{1}{100} = 0{,}01$, que **no** es menor
              que $0{,}01$: es igual. La desigualdad es estricta, así que hace
              falta uno más.
          - valor: '0.01'
            mensaje: |
              Ese es $\varepsilon$, no $m$. El $m$ es un número natural: el
              índice a partir del cual la sucesión ya no se sale de la banda.
          - valor: '10'
            mensaje: |
              $\frac{1}{10} = 0{,}1$, diez veces mayor que $\varepsilon$. Has
              tomado la raíz cuadrada de $1/\varepsilon$ en vez de
              $1/\varepsilon$.
        pista: |
          $\left|\frac1n\right| < \varepsilon$ equivale a
          $n > \frac{1}{\varepsilon}$. Con $\varepsilon = 0{,}01$ eso es
          $n > 100$, y el primer natural que lo cumple no es el 100.
        desarrollo: |
          $$
          \left|\frac1n - 0\right| = \frac1n < \varepsilon
          \iff n > \frac{1}{\varepsilon}
          $$

          Con $\varepsilon = 0{,}01$: $n > 100$, así que $m = 101$ sirve. En
          general vale cualquier $m > 1/\varepsilon$, por ejemplo
          $m = \left\lfloor \frac{1}{\varepsilon}\right\rfloor + 1$.

          Y aquí está el detalle que cuesta puntos: la definición pide
          desigualdad **estricta**, así que $m=100$ no vale por un pelo. En un
          examen basta con decir «tomo $m$ el primer natural mayor que
          $1/\varepsilon$» y ese pelo deja de importar.

      - tipo: justificar
        titulo: La demostración, y el segundo límite
        pregunta: Ordena la respuesta completa. Una pieza es falsa.
        piezas:
          - texto: >-
              **Definición.** $\lim a_{n} = l$ significa: para todo
              $\varepsilon>0$ existe $m\in\mathbb{N}$ tal que
              $|a_{n}-l|<\varepsilon$ para todo $n\ge m$.
          - texto: >-
              Aquí $a_{n}=\frac1n$ y $l=0$, así que hay que acotar
              $\left|\frac1n - 0\right| = \frac1n$.
          - texto: >-
              Dado $\varepsilon>0$, $\frac1n<\varepsilon \iff n>\frac{1}{\varepsilon}$,
              y por la propiedad arquimediana existe un natural mayor que
              $\frac{1}{\varepsilon}$: ese es el $m$.
          - texto: >-
              Como el $m$ se ha construido para un $\varepsilon$ arbitrario, la
              definición se cumple y $\lim \frac1n = 0$.
          - texto: >-
              Para la segunda, $\left|-\frac1n - 0\right| = \frac1n$ es la misma
              cota, así que sirve el mismo $m$ y el límite también es 0.
          - texto: >-
              El límite de $-\frac1n$ es $-0$, que es un número distinto de 0
              por acercarse desde abajo.
            trampa: true
            mensaje: |
              No existe «$-0$»: en $\mathbb{R}$ el cero es uno solo. Que la
              sucesión se acerque por debajo cambia el **signo de los
              términos**, no el límite. Y ojo, porque el error tiene una
              versión más sutil que sí aparece en exámenes: confundir «tiende a
              0 por la izquierda» —que es lenguaje de límites de funciones— con
              el valor del límite de una sucesión, que es un número a secas.

    resolucion: |
      Siete de los diez puntos son COMP4. El resultado no está en duda: lo que
      se corrige es **la demostración**.

      ## La definición, escrita entera

      > $\lim_{n\to\infty} a_{n} = l$ si para todo $\varepsilon>0$ existe
      > $m\in\mathbb{N}$ tal que $|a_{n}-l|<\varepsilon$ para todo $n\ge m$.

      El orden de los cuantificadores es lo que se evalúa: **primero** te dan
      el $\varepsilon$, **después** tú produces el $m$. Escribirlo al revés
      —«existe $m$ tal que para todo $\varepsilon$»— dice otra cosa, mucho más
      fuerte y casi siempre falsa.

      ## La demostración

      Sea $\varepsilon>0$. Como todos los términos son positivos,

      $$
      \left|\frac1n - 0\right| = \frac1n
      $$

      y queremos $\frac1n<\varepsilon$, es decir $n>\frac{1}{\varepsilon}$. Por
      la propiedad arquimediana de $\mathbb{R}$ existe un natural
      $m>\frac{1}{\varepsilon}$. Para todo $n\ge m$ se tiene entonces
      $n \ge m > \frac1\varepsilon$, luego

      $$
      \left|\frac1n - 0\right| = \frac1n < \varepsilon
      $$

      Como $\varepsilon$ era arbitrario, $\lim \frac1n = 0$. $\blacksquare$

      ## El segundo límite

      $$
      \left|-\frac1n - 0\right| = \left|\frac1n\right| = \frac1n
      $$

      Es **la misma cota**, así que el mismo $m$ vale y el límite también es 0.

      No hace falta repetir la demostración: basta con señalar que el valor
      absoluto se come el signo. Es la respuesta corta y es la buena. Quien
      rehace toda la cuenta no se equivoca, pero está diciendo que no ha visto
      por qué la pregunta iba justo después de la otra.

      ## Lo que la pregunta está midiendo de verdad

      Que entiendas que la definición mide **distancias**, no posiciones. Por
      eso una sucesión que se acerca desde arriba y otra que se acerca desde
      abajo tienen exactamente la misma demostración: $|a_{n}-l|$ no distingue
      lados.
