    pide: Calcular el polinomio de Taylor de orden 2 de $f^{-1}$ en $x=2$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué significa «en el punto $x=2$» aquí?
        opciones:
          - texto: >-
              Que el polinomio se centra en $2$, que es un valor de **$f$**: hay
              que buscar el $a$ con $f(a)=2$
            correcta: true
            mensaje: |
              Exacto. El argumento de $f^{-1}$ es una **imagen** de $f$. Y en la
              gráfica, $f(1)=2$, así que $f^{-1}(2)=1$ y el desarrollo se centra
              en $x=2$ pero se lee todo en $x=1$.
          - texto: >-
              Que hay que evaluar $f$ en 2
            mensaje: |
              $f(2)$ no interviene: 2 está en el **recorrido** de $f$, no en su
              dominio, cuando se habla de la inversa.
          - texto: >-
              Que hay que centrar el polinomio de $f$ en $x=2$ y luego
              invertirlo
            mensaje: |
              Invertir un polinomio no da el polinomio de la inversa. Hay
              fórmulas directas para $\left(f^{-1}\right)'$ y
              $\left(f^{-1}\right)''$, y son mucho más cortas.
          - texto: >-
              Que $f^{-1}(2) = \frac12$
            mensaje: |
              La inversa **no** es el inverso. $f^{-1}(2)$ es el punto cuya
              imagen vale 2, no $\frac{1}{2}$.

      - tipo: calcular
        titulo: Lo que se lee en la gráfica
        pregunta: |
          En el punto donde $f$ vale 2, ¿cuánto vale $f''$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.05
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es $f'(1)$, la roja. La azul —$f''$— pasa por 2 en ese mismo
              punto: las dos se cruzan cerca de ahí, y es fácil confundirlas.
          - valor: '0'
            mensaje: |
              $f''$ se anula un poco antes, en $x \approx 0{,}83$, donde la roja
              tiene su mínimo. En $x=1$ ya vale 2.
          - valor: '12'
            mensaje: |
              12 es la **pendiente** de la recta azul, no su valor en $x=1$.
        pista: |
          Localiza $x=1$ en el eje y mira dónde está la curva azul punteada.
        desarrollo: |
          > **Medición.** Las tres curvas se han medido sobre el PDF original a
          > 400 ppp, separándolas por color y con los ejes detectados por
          > densidad de tinta. Con $x=0$ en el píxel 462, $x=1$ en el 1183,
          > $y=0$ en el 1228 e $y=7$ en el 220, la lectura en $x=1$ da
          > $f = 2{,}02$, $f' = 1{,}01$ y $f'' = 2{,}00$.
          >
          > La recta azul resulta ser $f''(x) \approx 12{,}1\,(x-0{,}835)$, y su
          > cero coincide con el mínimo de la roja, medido en $x = 0{,}84$: las
          > tres curvas son coherentes entre sí, lo que confirma la escala.

          $$
          f(1) = 2, \qquad f'(1) = 1, \qquad f''(1) = 2
          $$
        veredicto: |
          Tres números redondos. Que el mínimo de $f'$ caiga justo donde $f''$
          corta al eje es la comprobación que valida la lectura entera.

      - tipo: calcular
        titulo: El coeficiente cuadrático
        pregunta: |
          En el polinomio de $f^{-1}$, ¿cuál es el coeficiente de
          $(x-2)^{2}$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.02
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              $-2$ es $\left(f^{-1}\right)''(2)$. El coeficiente es esa derivada
              **dividida entre $2!$**.
          - valor: '1'
            mensaje: |
              Falta el signo. La fórmula
              $\left(f^{-1}\right)'' = -\frac{f''}{\left(f'\right)^{3}}$ lleva un
              menos, y aquí $f''>0$.
          - valor: '-0.5'
            mensaje: |
              $-0{,}5$ saldría de dividir $-1$ entre 2 otra vez. Solo se divide
              una: $\frac{-2}{2!} = -1$.
        pista: |
          $\left(f^{-1}\right)''(b)
          = -\frac{f''(a)}{\left(f'(a)\right)^{3}}$, y el coeficiente lleva
          $\frac{1}{2!}$.
        desarrollo: |
          Con $a=1$, $b=f(a)=2$:

          $$
          \left(f^{-1}\right)'(2) = \frac{1}{f'(1)} = \frac11 = 1
          $$

          $$
          \left(f^{-1}\right)''(2)
          = -\frac{f''(1)}{\left(f'(1)\right)^{3}} = -\frac{2}{1} = -2
          $$

          Coeficiente de $(x-2)^{2}$:

          $$
          \frac{\left(f^{-1}\right)''(2)}{2!} = \frac{-2}{2} = -1
          $$
        veredicto: |
          El signo menos no es opcional: si $f$ es convexa donde se mira, su
          inversa es cóncava, y al revés. Las gráficas son simétricas respecto
          de la bisectriz, y la simetría cambia la concavidad.

      - tipo: justificar
        pregunta: |
          Ordena la deducción de las fórmulas. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Partir de la identidad** $f\left(f^{-1}(x)\right) = x$, válida
              en todo el recorrido de $f$.
          - texto: |
              **Derivar una vez**, con la regla de la cadena:
              $f'\left(f^{-1}(x)\right)\cdot\left(f^{-1}\right)'(x) = 1$, de
              donde $\left(f^{-1}\right)' = \frac{1}{f'\circ f^{-1}}$.
          - texto: |
              **Derivar otra vez:**
              $f''\left(f^{-1}\right)\cdot\left[\left(f^{-1}\right)'\right]^{2}
              +f'\left(f^{-1}\right)\cdot\left(f^{-1}\right)'' = 0$.
          - texto: |
              **Despejar:**
              $\left(f^{-1}\right)''
              = -\frac{f''\circ f^{-1}}{\left(f'\circ f^{-1}\right)^{3}}$,
              sustituyendo $\left(f^{-1}\right)' = \frac{1}{f'}$.
          - texto: |
              **La hipótesis que lo permite todo:** $f'(1) = 1 \neq 0$, así que
              $f$ es localmente invertible y $f^{-1}$ es dos veces derivable en
              un entorno de 2.
          - texto: |
              Como $f$ es creciente, $\left(f^{-1}\right)''$ también será
              positiva.
            trampa: true
            mensaje: |
              El crecimiento se conserva —si $f$ crece, $f^{-1}$ crece— pero la
              **concavidad se invierte**. Aquí $f''(1) = 2 > 0$ y
              $\left(f^{-1}\right)''(2) = -2 < 0$: justo lo contrario. Es el
              signo menos de la fórmula, y tiene una lectura geométrica: las dos
              gráficas son simétricas respecto de la recta $y=x$, y esa reflexión
              cambia el sentido de la curvatura.
        veredicto: |
          Deducir las dos fórmulas derivando
          $f\left(f^{-1}(x)\right)=x$ es más seguro que memorizarlas: el signo
          sale solo.

    resolucion: |
      **Datos.** La gráfica de $f$ con sus dos derivadas, y el punto $x=2$.

      ### 1 · Qué se pide, exactamente

      El polinomio de Taylor de orden 2 de $g = f^{-1}$ centrado en 2:

      $$
      P_2(x) = g(2)+g'(2)(x-2)+\frac{g''(2)}{2!}(x-2)^{2}
      $$

      El 2 es un valor **de $f$**, no de $x$: hay que localizar el punto $a$ con
      $f(a)=2$ y leer allí las tres curvas.

      ### 2 · Lo que dice la gráfica

      > **Medición.** No se lee a ojo. Las tres curvas se han separado por color
      > sobre el PDF a 400 ppp, con los ejes localizados por densidad de tinta:
      > $x=0$ en el píxel 462, la vertical de $x=1$ en el 1183, $y=0$ en el 1228
      > y la horizontal de $y=7$ en el 220.
      >
      > En $x=1$ salen $f = 2{,}02$, $f' = 1{,}01$ y $f'' = 2{,}00$. La azul es
      > prácticamente la recta $f''(x) = 12{,}1\,(x-0{,}835)$, y su cero cae
      > donde la roja tiene el mínimo, medido en $x = 0{,}84$. Las tres curvas
      > son consistentes entre sí, lo que valida la escala.

      $$
      \boxed{a = 1: \quad f(1) = 2, \quad f'(1) = 1, \quad f''(1) = 2}
      $$

      Y por tanto $g(2) = f^{-1}(2) = 1$.

      **La hipótesis clave:** $f'(1) = 1 \neq 0$. Sin eso no habría inversa
      derivable, y el ejercicio no tendría sentido. Además $f$ es creciente en
      todo el tramo dibujado —la roja está siempre por encima del eje—, así que
      es inyectiva y la inversa existe de verdad.

      ### 3 · Las dos fórmulas, deducidas

      No hace falta memorizarlas. Partiendo de

      $$
      f\left(g(x)\right) = x
      $$

      **Derivando** con la regla de la cadena:

      $$
      f'\left(g(x)\right)\,g'(x) = 1
      \;\Longrightarrow\;
      g'(x) = \frac{1}{f'\left(g(x)\right)}
      $$

      **Derivando otra vez** el producto:

      $$
      f''\left(g\right)\left[g'\right]^{2}+f'\left(g\right)g'' = 0
      $$

      $$
      g'' = -\frac{f''(g)\left[g'\right]^{2}}{f'(g)}
      = -\frac{f''(g)}{\left(f'(g)\right)^{3}}
      $$

      usando $g' = \frac{1}{f'(g)}$ en el numerador.

      ### 4 · Sustituir

      $$
      g(2) = 1
      $$

      $$
      g'(2) = \frac{1}{f'(1)} = \frac11 = 1
      $$

      $$
      g''(2) = -\frac{f''(1)}{\left(f'(1)\right)^{3}} = -\frac{2}{1^{3}} = -2
      $$

      $$
      P_2(x) = 1+1\cdot(x-2)+\frac{-2}{2}(x-2)^{2}
      $$

      $$
      \boxed{P_2(x) = 1+(x-2)-(x-2)^{2}}
      $$

      O desarrollado: $P_2(x) = -x^{2}+5x-5$.

      ### 5 · Por qué la concavidad se da la vuelta

      $f$ es **convexa** en $x=1$ —$f''=2>0$— y su inversa resulta **cóncava**
      en $x=2$ —$g''=-2<0$—. No es una casualidad numérica: es el signo menos
      de la fórmula.

      La razón geométrica: las gráficas de $f$ y $f^{-1}$ son simétricas
      respecto de la recta $y=x$, y una reflexión en esa recta intercambia
      «curvarse hacia arriba» con «curvarse hacia abajo». Lo que **sí** se
      conserva es el crecimiento.

      ### 6 · Comprobación

      **Con una función concreta que tenga esos tres valores.** El polinomio de
      $f$ en $x=1$ es

      $$
      f(x) \approx 2+(x-1)+(x-1)^{2}
      $$

      Su inversa aproximada se obtiene resolviendo $y = 2+u+u^{2}$ con
      $u = x-1$:

      $$
      u = \frac{-1+\sqrt{1+4(y-2)}}{2} = \frac{-1+\sqrt{4y-7}}{2}
      $$

      Y entonces $g(y) = 1+u$. Evaluando:

      | $y$ | $g$ exacta | $P_2$ | diferencia |
      |---|---|---|---|
      | $2$ | $1$ | $1$ | $0$ |
      | $2{,}1$ | $1{,}0916$ | $1{,}0900$ | $0{,}0016$ |
      | $1{,}9$ | $0{,}8874$ | $0{,}8900$ | $0{,}0026$ |

      El error es del orden de $(x-2)^{3}$ ✔ como corresponde a un polinomio de
      orden 2.

      **De coherencia entre las dos gráficas.** $f$ pasa por $(1,2)$ con
      pendiente 1; $g$ debe pasar por $(2,1)$ con pendiente $\frac11 = 1$. Los
      dos puntos son simétricos respecto de $y=x$ y las dos pendientes son
      inversas ✔ Con pendiente 1 la recta es su propia simétrica, y por eso las
      dos coinciden.

  - id: ex2324-3ev-3-funcion-integral-menos-exponencial
    titulo: Una función integral a la que se le resta una exponencial
    fuente: >-
      Ejercicio 3 · Tercera evaluación, 16 de enero de 2024 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3

    nivel: examen
    enunciado: |
      Sea la función
      $f(x) = \displaystyle\int_0^{x^{2}}\mathrm{e}^{t^{2}}dt-\mathrm{e}^{x^{4}}$.
      Estudiar el crecimiento/decrecimiento y los extremos relativos de $f(x)$.
    pide: Estudiar crecimiento y extremos.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Se puede calcular la integral $\int_0^{x^{2}}\mathrm{e}^{t^{2}}dt$?
        opciones:
          - texto: >-
              No, y **no hace falta**: para derivar basta el teorema fundamental
              más la regla de la cadena
            correcta: true
            mensaje: |
              Exacto. $\mathrm{e}^{t^{2}}$ no tiene primitiva elemental —está
              demostrado—, y ese es justamente el motivo de que el enunciado
              pregunte solo por el crecimiento: se resuelve sin integrar.
          - texto: >-
              Sí, con el cambio $u = t^{2}$
            mensaje: |
              Ese cambio da $\int\frac{\mathrm{e}^{u}}{2\sqrt u}du$, que tampoco
              es elemental. No hay cambio que funcione.
          - texto: >-
              Sí, por partes
            mensaje: |
              Por partes solo desplaza el problema: reaparece la misma integral.
          - texto: >-
              No, así que el ejercicio no tiene solución
            mensaje: |
              La tiene: lo que se pide es el crecimiento, y eso depende de
              $f'$, que sí se calcula exactamente.

      - tipo: calcular
        titulo: La derivada
        pregunta: |
          ¿Cuánto vale $f'(1)$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '-5.4366'
          tolerancia: 0.0008
          formato: un número
        distractores:
          - valor: '5.4366'
            mensaje: |
              Signo cambiado. En $x=1$ es $2x-4x^{3} = 2-4 = -2$, negativo, y
              multiplicado por $\mathrm{e}>0$ sigue siéndolo.
          - valor: '-2'
            mensaje: |
              $-2$ es solo el factor $2x\left(1-2x^{2}\right)$. Falta el
              $\mathrm{e}^{x^{4}} = \mathrm{e}$.
          - valor: '-2.7183'
            mensaje: |
              $-\mathrm{e}$ olvida el factor $-2$. Hay que multiplicar los dos.
        pista: |
          Teorema fundamental **con regla de la cadena**: el extremo superior es
          $x^{2}$, no $x$.
        desarrollo: |
          **Primer sumando.** Con $F(u) = \int_0^{u}\mathrm{e}^{t^{2}}dt$, se
          tiene $F'(u) = \mathrm{e}^{u^{2}}$, y por la cadena:

          $$
          \frac{d}{dx}F\left(x^{2}\right)
          = \mathrm{e}^{\left(x^{2}\right)^{2}}\cdot2x
          = 2x\,\mathrm{e}^{x^{4}}
          $$

          **Segundo sumando:**

          $$
          \frac{d}{dx}\mathrm{e}^{x^{4}} = 4x^{3}\,\mathrm{e}^{x^{4}}
          $$

          $$
          f'(x) = 2x\,\mathrm{e}^{x^{4}}-4x^{3}\,\mathrm{e}^{x^{4}}
          = 2x\,\mathrm{e}^{x^{4}}\left(1-2x^{2}\right)
          $$

          En $x=1$:

          $$
          f'(1) = 2\cdot\mathrm{e}\cdot(1-2) = -2\mathrm{e}
          \approx -5{,}4366
          $$
        veredicto: |
          El factor $\mathrm{e}^{x^{4}}$ es **común** a los dos términos y
          siempre positivo: se saca fuera y desaparece del estudio de signos.
          Ese es el regalo del enunciado.

      - tipo: calcular
        titulo: Dónde está el máximo
        pregunta: |
          ¿En qué abscisa positiva tiene $f$ un máximo relativo?
        respuesta:
          tipo: numero
          valor: '0.7071'
          tolerancia: 0.0005
          formato: en forma exacta, o un número con cuatro decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              $0{,}5$ es el valor de $x^{2}$ en el máximo, no de $x$. Falta la
              raíz cuadrada.
          - valor: '1.4142'
            mensaje: |
              $\sqrt2$ es el inverso: la ecuación es $1-2x^{2}=0$, luego
              $x = \frac{1}{\sqrt2}$, no $\sqrt2$.
          - valor: '0'
            mensaje: |
              En $x=0$ hay un **mínimo**, no un máximo: la derivada pasa de
              negativa a positiva.
        pista: |
          $f'(x) = 2x\,\mathrm{e}^{x^{4}}\left(1-2x^{2}\right)$. ¿Dónde se
          anula?
        desarrollo: |
          $$
          f'(x) = 0
          \;\Longleftrightarrow\;
          2x\left(1-2x^{2}\right) = 0
          \;\Longleftrightarrow\;
          x = 0 \ \text{ó}\ x = \pm\frac{1}{\sqrt2}
          $$

          Signos de $2x\left(1-2x^{2}\right)$:

          | intervalo | signo | $f$ |
          |---|---|---|
          | $\left(-\infty,-\frac{1}{\sqrt2}\right)$ | $+$ | crece |
          | $\left(-\frac{1}{\sqrt2},0\right)$ | $-$ | decrece |
          | $\left(0,\frac{1}{\sqrt2}\right)$ | $+$ | crece |
          | $\left(\frac{1}{\sqrt2},+\infty\right)$ | $-$ | decrece |

          Máximos en $x = \pm\frac{1}{\sqrt2} \approx \pm0{,}7071$ y mínimo en
          $x=0$.
        veredicto: |
          Tres puntos críticos y un patrón sube–baja–sube–baja: la función tiene
          forma de doble joroba, simétrica respecto del eje vertical.

      - tipo: justificar
        pregunta: |
          Ordena el estudio. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **El dominio** es todo $\mathbb{R}$: $\mathrm{e}^{t^{2}}$ es
              continua en todo punto, así que la integral existe para cualquier
              extremo superior.
          - texto: |
              **Derivar**, con el teorema fundamental y la regla de la cadena:
              $f'(x) = 2x\,\mathrm{e}^{x^{4}}-4x^{3}\mathrm{e}^{x^{4}}$.
          - texto: |
              **Factorizar:**
              $f'(x) = 2x\,\mathrm{e}^{x^{4}}\left(1-2x^{2}\right)$, y como
              $\mathrm{e}^{x^{4}}>0$ el signo lo pone $2x\left(1-2x^{2}\right)$.
          - texto: |
              **Los puntos críticos** son $x=0$ y $x=\pm\frac{1}{\sqrt2}$, y el
              signo alterna: crece, decrece, crece, decrece.
          - texto: |
              **Conclusión:** máximos relativos en $\pm\frac{1}{\sqrt2}$ con
              valor $\int_0^{1/2}\mathrm{e}^{t^{2}}dt-\mathrm{e}^{1/4}
              \approx -0{,}739$, y mínimo relativo en $0$ con $f(0) = -1$.
          - texto: |
              Como $f$ es una función integral, es creciente allí donde el
              integrando es positivo, y $\mathrm{e}^{t^{2}}>0$ siempre: luego
              $f$ crece en todo $\mathbb{R}$.
            trampa: true
            mensaje: |
              Eso valdría si $f$ fuera **solo** la integral, y con extremo
              superior $x$. Aquí pasan dos cosas: hay un segundo sumando
              —$-\mathrm{e}^{x^{4}}$, que decrece muy deprisa— y el extremo
              superior es $x^{2}$, que introduce el factor $2x$ y hace que el
              signo dependa de $x$. Aplicar la regla sin mirar el enunciado
              completo da justo la respuesta contraria.
        veredicto: |
          La regla «la integral crece donde el integrando es positivo» exige
          extremo superior $x$ **y** que no haya nada más sumando. Aquí fallan
          las dos cosas.

    resolucion: |
      **Datos.**
      $f(x) = \int_0^{x^{2}}\mathrm{e}^{t^{2}}dt-\mathrm{e}^{x^{4}}$.

      ### 1 · Lo primero: no hay primitiva

      $\mathrm{e}^{t^{2}}$ **no tiene primitiva elemental** —es un hecho
      demostrado, no una limitación de quien resuelve—. Y precisamente por eso
      el enunciado pide el crecimiento y no el valor: todo se decide con $f'$,
      que sí se calcula exactamente.

      **El dominio** es $\mathbb{R}$ entero: el integrando es continuo en todo
      punto, así que la integral existe para cualquier extremo superior.

      ### 2 · Derivar

      Llamando $F(u) = \int_0^{u}\mathrm{e}^{t^{2}}dt$, el **teorema
      fundamental del cálculo** da $F'(u) = \mathrm{e}^{u^{2}}$ —la hipótesis,
      que el integrando sea continuo, se cumple—.

      El primer sumando es $F\left(x^{2}\right)$, así que hace falta la **regla
      de la cadena**:

      $$
      \frac{d}{dx}F\left(x^{2}\right)
      = F'\left(x^{2}\right)\cdot2x
      = \mathrm{e}^{\left(x^{2}\right)^{2}}\cdot2x
      = 2x\,\mathrm{e}^{x^{4}}
      $$

      **El factor $2x$ es donde se falla.** Sin él, el signo saldría al revés.

      El segundo sumando:

      $$
      \frac{d}{dx}\left(-\mathrm{e}^{x^{4}}\right) = -4x^{3}\mathrm{e}^{x^{4}}
      $$

      $$
      f'(x) = 2x\,\mathrm{e}^{x^{4}}-4x^{3}\,\mathrm{e}^{x^{4}}
      $$

      ### 3 · Factorizar

      $$
      \boxed{f'(x) = 2x\,\mathrm{e}^{x^{4}}\left(1-2x^{2}\right)}
      $$

      El factor $\mathrm{e}^{x^{4}}$ es **siempre positivo**, así que no influye
      en el signo. Queda estudiar

      $$
      h(x) = 2x\left(1-2x^{2}\right)
      $$

      un polinomio con raíces

      $$
      x = 0, \qquad x = \pm\frac{1}{\sqrt2} = \pm\frac{\sqrt2}{2}
      \approx \pm0{,}7071
      $$

      ### 4 · La tabla de signos

      | intervalo | $2x$ | $1-2x^{2}$ | $f'$ | $f$ |
      |---|---|---|---|---|
      | $\left(-\infty,-\frac{1}{\sqrt2}\right)$ | $-$ | $-$ | $+$ | **crece** |
      | $\left(-\frac{1}{\sqrt2},0\right)$ | $-$ | $+$ | $-$ | **decrece** |
      | $\left(0,\frac{1}{\sqrt2}\right)$ | $+$ | $+$ | $+$ | **crece** |
      | $\left(\frac{1}{\sqrt2},+\infty\right)$ | $+$ | $-$ | $-$ | **decrece** |

      $$
      \boxed{
      \begin{aligned}
      &\text{MÁXIMOS relativos en } x = \pm\tfrac{1}{\sqrt2}\\
      &\text{MÍNIMO relativo en } x = 0
      \end{aligned}}
      $$

      ### 5 · Los valores

      $$
      f(0) = \int_0^{0}\mathrm{e}^{t^{2}}dt-\mathrm{e}^{0} = 0-1 = -1
      $$

      $$
      f\left(\frac{1}{\sqrt2}\right)
      = \int_0^{1/2}\mathrm{e}^{t^{2}}dt-\mathrm{e}^{1/4}
      $$

      La integral no es elemental, pero se acota con su desarrollo:

      $$
      \int_0^{1/2}\left(1+t^{2}+\frac{t^{4}}{2}+\frac{t^{6}}{6}\right)dt
      = \frac12+\frac{1}{24}+\frac{1}{320}+\frac{1}{5376}
      \approx 0{,}5450
      $$

      $$
      f\left(\tfrac{1}{\sqrt2}\right) \approx 0{,}5450-1{,}2840
      \approx -0{,}739
      $$

      ### 6 · Dos observaciones que puntúan

      **$f$ es par.** Cambiando $x$ por $-x$, el extremo superior $x^{2}$ y el
      exponente $x^{4}$ no varían:

      $$
      f(-x) = f(x)
      $$

      Y eso explica la simetría de la tabla: los dos máximos están a la misma
      altura, y el punto crítico central es forzosamente un extremo.

      **Los máximos son absolutos.** Cuando $x\to\pm\infty$,
      $\mathrm{e}^{x^{4}}$ crece mucho más deprisa que la integral —que vale
      aproximadamente $\frac{\mathrm{e}^{x^{4}}}{2x^{2}}$—, así que

      $$
      f(x) \approx \mathrm{e}^{x^{4}}\left(\frac{1}{2x^{2}}-1\right)
      \xrightarrow[x\to\pm\infty]{} -\infty
      $$

      Con solo tres puntos críticos y la función cayendo a $-\infty$ en ambos
      lados, los máximos relativos son **absolutos**. Y $f<0$ en todo
      $\mathbb{R}$.

      ### 7 · Comprobación

      **Del signo en puntos concretos:**

      | $x$ | $2x\left(1-2x^{2}\right)$ | signo |
      |---|---|---|
      | $-1$ | $-2\cdot(-1) = 2$ | $+$ ✔ crece |
      | $-0{,}5$ | $-1\cdot0{,}5 = -0{,}5$ | $-$ ✔ decrece |
      | $0{,}5$ | $1\cdot0{,}5 = 0{,}5$ | $+$ ✔ crece |
      | $1$ | $2\cdot(-1) = -2$ | $-$ ✔ decrece |

      **Con la segunda derivada en el origen.** Cerca de 0,
      $\mathrm{e}^{x^{4}} \approx 1$ y
      $f'(x) \approx 2x-4x^{3}$, luego $f''(0) \approx 2 > 0$: mínimo ✔

      **Numérica alrededor del máximo.** Con la aproximación anterior:

      | $x$ | $f(x)$ |
      |---|---|
      | $0{,}6$ | $-0{,}7444$ |
      | $0{,}7071$ | $\mathbf{-0{,}7390}$ |
      | $0{,}8$ | $-0{,}7495$ |

      El valor central es el mayor ✔

  - id: ex2324-3ev-4-area-de-la-elipse
    titulo: De dónde sale el πab del área de la elipse
    fuente: >-
      Ejercicio 4 · Tercera evaluación, 16 de enero de 2024 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 8
      comp4: 1

    nivel: examen
    enunciado: |
      Utilizando integración calcular el área de una elipse de semiejes $a$ y
      $b$.
    pide: Calcular el área por integración.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo conviene plantear la integral?
        opciones:
          - texto: >-
              Integrar la rama superior en $[0,a]$ y **multiplicar por 4**,
              usando las dos simetrías
            correcta: true
            mensaje: |
              Exacto. La elipse es simétrica respecto de los dos ejes, así que
              basta un cuadrante. Y así se evita arrastrar el valor absoluto de
              la raíz.
          - texto: >-
              Integrar de $-a$ a $a$ la función $y = b\sqrt{1-x^{2}/a^{2}}$
            mensaje: |
              Funciona y da la mitad del área, que hay que duplicar. Es
              correcto, pero con los límites simétricos la sustitución
              trigonométrica es un poco más incómoda.
          - texto: >-
              Integrar $\frac{x^{2}}{a^{2}}+\frac{y^{2}}{b^{2}}$
            mensaje: |
              Eso no es el área: el integrando de un área plana es la altura de
              la región, no la ecuación de su borde.
          - texto: >-
              Usar la fórmula $\pi ab$ y comprobarla
            mensaje: |
              La fórmula es justo lo que hay que **deducir**. Usarla dejaría el
              ejercicio sin hacer.

      - tipo: calcular
        titulo: La integral que aparece
        pregunta: |
          Tras el cambio $x = a\sin\theta$, la integral se reduce a
          $\int_0^{\pi/2}\cos^{2}\theta\,d\theta$. ¿Cuánto vale?
        respuesta:
          tipo: numero
          valor: '0.7854'
          tolerancia: 0.0005
          formato: en forma exacta, o un número con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              1 es $\int_0^{\pi/2}\cos\theta\,d\theta$, sin el cuadrado. Con el
              cuadrado sale $\frac{\pi}{4}$.
          - valor: '1.5708'
            mensaje: |
              $\frac{\pi}{2}$ es la longitud del intervalo. El valor medio de
              $\cos^{2}$ es $\frac12$, así que la integral es la mitad.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es el **valor medio** de $\cos^{2}$, no la integral.
              Falta multiplicar por la longitud $\frac{\pi}{2}$.
        pista: |
          $\cos^{2}\theta = \frac{1+\cos2\theta}{2}$.
        desarrollo: |
          Con la fórmula del ángulo doble:

          $$
          \int_0^{\pi/2}\cos^{2}\theta\,d\theta
          = \int_0^{\pi/2}\frac{1+\cos2\theta}{2}\,d\theta
          $$

          $$
          = \left[\frac{\theta}{2}+\frac{\sin2\theta}{4}\right]_0^{\pi/2}
          = \frac{\pi}{4}+0-0 = \frac{\pi}{4} \approx 0{,}7854
          $$

          El $\sin2\theta$ se anula en los dos extremos: en $0$ y en $\pi$.
        veredicto: |
          Ahí está el $\pi$. Toda la constante del área de la elipse sale de
          esta integral, y de nada más.

      - tipo: justificar
        pregunta: |
          Ordena la deducción. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Despejar la rama superior.** De
              $\frac{x^{2}}{a^{2}}+\frac{y^{2}}{b^{2}} = 1$ sale
              $y = b\sqrt{1-\frac{x^{2}}{a^{2}}}$.
          - texto: |
              **Usar la simetría.** La elipse es simétrica respecto de los dos
              ejes, así que
              $A = 4\int_0^{a}b\sqrt{1-\frac{x^{2}}{a^{2}}}\,dx$.
          - texto: |
              **Cambio de variable** $x = a\sin\theta$, con
              $dx = a\cos\theta\,d\theta$. Los límites pasan de $[0,a]$ a
              $\left[0,\frac{\pi}{2}\right]$.
          - texto: |
              **La raíz se simplifica:**
              $\sqrt{1-\sin^{2}\theta} = \cos\theta$, positivo porque
              $\theta \in \left[0,\frac{\pi}{2}\right]$.
          - texto: |
              **Queda** $A = 4ab\int_0^{\pi/2}\cos^{2}\theta\,d\theta
              = 4ab\cdot\frac{\pi}{4} = \pi ab$.
          - texto: |
              $\sqrt{1-\sin^{2}\theta} = \cos\theta$ es una identidad válida
              para cualquier $\theta$.
            trampa: true
            mensaje: |
              La identidad general es
              $\sqrt{1-\sin^{2}\theta} = \left|\cos\theta\right|$. Aquí se puede
              quitar el valor absoluto **porque** el cambio se ha hecho en
              $\left[0,\frac{\pi}{2}\right]$, donde el coseno es positivo. Y ese
              es el motivo de haber usado la simetría para integrar en un solo
              cuadrante. Escribirlo sin justificar es el fallo típico de este
              cambio de variable.
        veredicto: |
          Elegir el intervalo del cambio no es cosmético: es lo que permite
          quitar el valor absoluto. Por eso conviene reducir a un cuadrante
          antes de sustituir.

    resolucion: |
      **Datos.** Una elipse de semiejes $a$ y $b$.

      ### 1 · La ecuación y la rama a integrar

      $$
      \frac{x^{2}}{a^{2}}+\frac{y^{2}}{b^{2}} = 1
      $$

      Despejando la rama superior:

      $$
      y = b\sqrt{1-\frac{x^{2}}{a^{2}}}, \qquad x \in [-a,a]
      $$

      ### 2 · Reducir a un cuadrante

      La elipse es simétrica respecto de los **dos** ejes: cambiar $x$ por $-x$
      o $y$ por $-y$ deja la ecuación igual. Así que el primer cuadrante es la
      cuarta parte:

      $$
      A = 4\int_0^{a}b\sqrt{1-\frac{x^{2}}{a^{2}}}\,dx
      $$

      **Esto no es solo comodidad.** Al integrar solo donde $x \ge 0$, el cambio
      de variable que viene se puede hacer en un intervalo donde el coseno no
      cambia de signo, y el valor absoluto de la raíz desaparece
      legítimamente.

      ### 3 · El cambio de variable

      $$
      x = a\sin\theta,
      \qquad
      dx = a\cos\theta\,d\theta
      $$

      | $x$ | $\theta$ |
      |---|---|
      | $0$ | $0$ |
      | $a$ | $\frac{\pi}{2}$ |

      La raíz:

      $$
      \sqrt{1-\frac{a^{2}\sin^{2}\theta}{a^{2}}}
      = \sqrt{1-\sin^{2}\theta}
      = \left|\cos\theta\right| = \cos\theta
      $$

      —y aquí sí se puede quitar el valor absoluto, porque
      $\theta \in \left[0,\frac{\pi}{2}\right]$—.

      $$
      A = 4\int_0^{\pi/2}b\cos\theta\cdot a\cos\theta\,d\theta
      = 4ab\int_0^{\pi/2}\cos^{2}\theta\,d\theta
      $$

      ### 4 · La integral del coseno al cuadrado

      Con la fórmula del ángulo doble
      $\cos^{2}\theta = \frac{1+\cos2\theta}{2}$:

      $$
      \int_0^{\pi/2}\cos^{2}\theta\,d\theta
      = \left[\frac{\theta}{2}+\frac{\sin2\theta}{4}\right]_0^{\pi/2}
      = \frac{\pi}{4}
      $$

      $$
      A = 4ab\cdot\frac{\pi}{4}
      $$

      $$
      \boxed{A = \pi ab}
      $$

      ### 5 · De dónde sale cada factor

      Merece la pena señalar de dónde viene cada pieza del resultado:

      | pieza | origen |
      |---|---|
      | $\pi$ | de $\int_0^{\pi/2}\cos^{2} = \frac{\pi}{4}$ |
      | $a$ | del $dx = a\cos\theta\,d\theta$ |
      | $b$ | del factor de la rama superior |

      El área es **lineal en cada semieje**: doblar $a$ dobla el área. Tiene
      sentido, porque una elipse es una circunferencia estirada por un factor
      $\frac ab$ en una dirección, y estirar multiplica el área por ese factor.

      ### 6 · Comprobación

      **El caso circular.** Con $a=b=r$:

      $$
      A = \pi r^{2} \quad\checkmark
      $$

      **Por la interpretación como estiramiento.** La transformación
      $(u,v) \mapsto (au,bv)$ lleva la circunferencia unidad a esta elipse y
      multiplica las áreas por $ab$. Como el círculo unidad mide $\pi$:

      $$
      A = \pi\cdot ab \quad\checkmark
      $$

      Una segunda demostración, sin integrar, que confirma el resultado.

      **Por acotación.** La elipse está dentro del rectángulo
      $[-a,a]\times[-b,b]$, de área $4ab$, y contiene el rombo de diagonales
      $2a$ y $2b$, de área $2ab$:

      $$
      2ab < \pi ab \approx 3{,}14\,ab < 4ab \quad\checkmark
      $$

      **Numérica**, con $a=2$ y $b=1$. Sumando 100 rectángulos bajo
      $y = \sqrt{1-x^{2}/4}$ en $[0,2]$ y multiplicando por 4 sale $6{,}277$,
      frente a $2\pi = 6{,}283$ ✔ La pequeña diferencia es el error de la
      discretización cerca del borde vertical.

  - id: ex2324-3ev-5-particula-y-teoremas
    titulo: Una partícula, y cuatro teoremas que hay que saber cuándo NO se aplican
    fuente: >-
      Ejercicio 5 · Tercera evaluación, 16 de enero de 2024 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 4
      comp4: 4

    nivel: examen
    enunciado: |
      La posición de una partícula que se mueve en una dimensión viene dada por
      la función $x(t)$, donde $x$ se mide en metros y $t$ en segundos. En la
      figura se muestra la **velocidad** $v(t)$ de la partícula en función del
      tiempo:

      <figure class="figura-examen">
      <svg viewBox="0 0 660 420" role="img" width="640" height="408"
           aria-labelledby="f2324c5t f2324c5d">
        <title id="f2324c5t">La velocidad de la particula</title>
        <desc id="f2324c5d">Una linea quebrada de tres tramos rectos. Sube
        desde cero en el instante cero hasta quince en el instante quince,
        despues baja hasta menos diez en el instante cuarenta cruzando el eje
        en el treinta, y por ultimo sube hasta diez en el instante cincuenta
        cruzando el eje en el cuarenta y cinco.</desc>

        <g stroke="var(--rule)" stroke-width="1" fill="none">
          <path d="M70 60 L620 60 M70 120 L620 120 M70 180 L620 180
                   M70 240 L620 240 M70 300 L620 300 M70 360 L620 360
                   M125 40 L125 380 M180 40 L180 380 M235 40 L235 380
                   M290 40 L290 380 M345 40 L345 380 M400 40 L400 380
                   M455 40 L455 380 M510 40 L510 380 M565 40 L565 380"></path>
        </g>

        <g stroke="var(--graphite)" stroke-width="1.4" fill="none">
          <path d="M70 240 L640 240 M70 30 L70 390"></path>
        </g>

        <g stroke="var(--d1)" stroke-width="3" fill="none"
           stroke-linejoin="round" stroke-linecap="round">
          <path d="M70 240 L235 60 L455 360 L510 240 L565 120"></path>
        </g>

        <g stroke="var(--graphite)" stroke-width="1" fill="none">
          <path d="M66 60 L74 60 M66 120 L74 120 M66 300 L74 300
                   M66 360 L74 360"></path>
        </g>

        <g fill="var(--graphite)" font-size="13" font-family="var(--mono)">
          <text x="42" y="65">15</text>
          <text x="42" y="125">10</text>
          <text x="48" y="185">5</text>
          <text x="40" y="305">-5</text>
          <text x="34" y="365">-10</text>
          <text x="118" y="258">5</text>
          <text x="170" y="258">10</text>
          <text x="226" y="258">15</text>
          <text x="281" y="258">20</text>
          <text x="336" y="258">25</text>
          <text x="391" y="258">30</text>
          <text x="446" y="258">35</text>
          <text x="501" y="258">40</text>
          <text x="556" y="258">45</text>
          <text x="606" y="258">50</text>
        </g>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original. La velocidad es una quebrada
      con vertices en cero coma cero, quince coma quince, cuarenta coma menos
      diez y cincuenta coma diez.
      </figcaption>
      </figure>

      Sabiendo que inicialmente $x(0)=0$, contestar razonadamente las siguientes
      cuestiones:

      **a)** ¿En qué posición se encuentra la partícula en el instante
      $t=50$ s?

      **b)** ¿Cuándo se obtiene un espacio recorrido de 275 m?

      **c)** Calcular la velocidad media de la partícula en el intervalo
      $[0,50]$. ¿Es aplicable el teorema de la media para la función $v(t)$ en
      el intervalo $[0,50]$? En el caso de que el teorema pueda aplicarse, ¿en
      cuántos puntos se cumpliría? Indicarlos de forma aproximada en la figura.

      **d)** ¿Es aplicable el teorema de Lagrange (Teorema del Valor Medio) para
      la función $v(t)$ en el intervalo $[0,50]$? Encontrar, si existen, los
      puntos en los que se cumple dicho teorema.

      **e)** ¿Es aplicable el teorema de Lagrange (Teorema del Valor Medio) para
      la función $x(t)$ en el intervalo $[0,50]$? En el caso de que el teorema
      pueda aplicarse, ¿en cuántos puntos se cumpliría? Indicarlos de forma
      aproximada en la figura.
    pide: Responder los cinco apartados.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué diferencia hay entre la posición en $t=50$ y el espacio
          recorrido?
        opciones:
          - texto: >-
              La posición es $\int v$ **con signo**; el espacio recorrido es
              $\int\left|v\right|$
            correcta: true
            mensaje: |
              Exacto, y aquí la diferencia es grande: hay un tramo de retroceso
              entre $t=30$ y $t=45$ que resta en la posición y suma en el
              recorrido.
          - texto: >-
              Son lo mismo: el área bajo la curva
            mensaje: |
              Solo coinciden si la velocidad no cambia de signo. Aquí sí lo
              cambia, dos veces.
          - texto: >-
              La posición es el área total y el recorrido es la posición final
            mensaje: |
              Es justo al revés: el área **total**, sin signos, es el espacio
              recorrido, y la posición final es la suma con signo.
          - texto: >-
              El recorrido es la posición dividida entre el tiempo
            mensaje: |
              Eso sería una velocidad media, no un espacio.

      - tipo: calcular
        titulo: La posición final
        pregunta: |
          ¿En qué posición está la partícula en $t=50$ s?
        respuesta:
          tipo: numero
          valor: '175'
          tolerancia: 0.5
          formato: un número, en metros
        distractores:
          - valor: '325'
            mensaje: |
              325 es el espacio **recorrido** total: suma las áreas en valor
              absoluto. La posición resta el tramo negativo.
          - valor: '225'
            mensaje: |
              225 es el área de los dos primeros triángulos, hasta $t=30$. Falta
              lo que ocurre después.
          - valor: '275'
            mensaje: |
              275 es el recorrido en $t=40$, la respuesta del apartado (b).
        pista: |
          Suma las áreas de los triángulos, **con su signo**.
        desarrollo: |
          $$
          x(50) = \int_0^{50}v(t)\,dt
          $$

          Descomponiendo en triángulos:

          | tramo | base | altura | área |
          |---|---|---|---|
          | $[0,15]$ | 15 | $+15$ | $+112{,}5$ |
          | $[15,30]$ | 15 | $+15$ | $+112{,}5$ |
          | $[30,40]$ | 10 | $-10$ | $-50$ |
          | $[40,45]$ | 5 | $-10$ | $-25$ |
          | $[45,50]$ | 5 | $+10$ | $+25$ |

          $$
          x(50) = 112{,}5+112{,}5-50-25+25 = 175 \ \text{m}
          $$
        veredicto: |
          El tramo negativo —de $t=30$ a $t=45$— es un **retroceso**: la
          partícula da marcha atrás 75 metros y luego vuelve a avanzar.

      - tipo: calcular
        titulo: Cuándo se han recorrido 275 metros
        pregunta: |
          ¿En qué instante el espacio recorrido llega a 275 m?
        respuesta:
          tipo: numero
          valor: '40'
          tolerancia: 0.2
          formato: un número, en segundos
        distractores:
          - valor: '45'
            mensaje: |
              En $t=45$ el recorrido ya es 300 m: la partícula sigue retrocediendo
              entre 40 y 45, y eso también cuenta como espacio recorrido.
          - valor: '30'
            mensaje: |
              En $t=30$ el recorrido es 225 m, todavía no 275.
          - valor: '35'
            mensaje: |
              En $t=35$ va por $225+12{,}5 = 237{,}5$ m.
        pista: |
          El espacio recorrido es $\int_0^{t}\left|v\right|$: suma las áreas
          **todas en positivo**.
        desarrollo: |
          Acumulando áreas en valor absoluto:

          | instante | recorrido |
          |---|---|
          | $t=15$ | $112{,}5$ |
          | $t=30$ | $225$ |
          | $t=40$ | $225+50 = 275$ |
          | $t=45$ | $300$ |
          | $t=50$ | $325$ |

          $$
          \boxed{t = 40 \ \text{s}}
          $$

          Justo cuando la velocidad alcanza su mínimo, $-10$ m/s.
        veredicto: |
          El número cuadra exactamente en un vértice de la gráfica, y eso no es
          casualidad: el enunciado elige el 275 para que la respuesta sea limpia.

      - tipo: justificar
        pregunta: |
          Ordena los apartados (c), (d) y (e). Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **(c) La velocidad media** es
              $\frac{x(50)-x(0)}{50} = \frac{175}{50} = 3{,}5$ m/s.
          - texto: |
              El **teorema de la media integral** solo exige que $v$ sea
              **continua** en $[0,50]$, y lo es: la quebrada no tiene saltos.
              Luego **sí** se aplica.
          - texto: |
              Resolviendo $v(t) = 3{,}5$ en los tres tramos salen
              $t = 3{,}5$, $t = 26{,}5$ y $t = 46{,}75$: **tres** puntos.
          - texto: |
              **(d) Lagrange para $v$: NO se aplica.** $v$ tiene picos en
              $t=15$ y $t=40$, así que no es derivable en $(0,50)$.
          - texto: |
              **(e) Lagrange para $x$: SÍ se aplica.** $x$ es una primitiva de
              $v$, que es continua, así que $x$ es derivable con $x'=v$. Los
              puntos son los mismos tres de (c).
          - texto: |
              Como $v$ no es derivable, tampoco lo es $x$, y (e) tampoco se
              aplica.
            trampa: true
            mensaje: |
              La derivabilidad de $x$ no depende de la de $v$, sino de la
              **continuidad** de $v$ — que es la hipótesis del teorema
              fundamental. Integrar **suaviza**: $v$ tiene picos y aun así $x$ es
              derivable en todo punto. Lo que $x$ no es, es dos veces derivable
              en $t=15$ y $t=40$. Confundir los dos niveles es el error que el
              ejercicio pone a prueba con (d) y (e) seguidos.
        veredicto: |
          Los apartados (d) y (e) están puestos uno detrás de otro a propósito:
          la misma pregunta, un escalón de derivada más arriba, y la respuesta
          cambia.

    resolucion: |
      **Datos.** $v(t)$ es la quebrada de la figura, con vértices en
      $(0,0)$, $(15,15)$, $(40,-10)$ y $(50,10)$. Y $x(0)=0$.

      ### 1 · Escribir $v$ por tramos

      Leyendo las pendientes de la figura:

      $$
      v(t) = \begin{cases}
      t & 0 \le t \le 15\\
      30-t & 15 \le t \le 40\\
      2t-90 & 40 \le t \le 50
      \end{cases}
      $$

      Los cortes con el eje están en $t=30$ y $t=45$, y coinciden con lo que se
      ve dibujado ✔

      ### 2 · Apartado (a): la posición en $t=50$

      $$
      x(50) = x(0)+\int_0^{50}v(t)\,dt = \int_0^{50}v(t)\,dt
      $$

      Con áreas de triángulos, **respetando el signo**:

      | tramo | figura | área |
      |---|---|---|
      | $[0,15]$ | triángulo de base 15 y altura 15 | $+112{,}5$ |
      | $[15,30]$ | triángulo de base 15 y altura 15 | $+112{,}5$ |
      | $[30,45]$ | triángulo de base 15 y altura $-10$ | $-75$ |
      | $[45,50]$ | triángulo de base 5 y altura 10 | $+25$ |

      $$
      \boxed{x(50) = 112{,}5+112{,}5-75+25 = 175 \ \text{m}}
      $$

      ### 3 · Apartado (b): el espacio recorrido

      El espacio recorrido es $\int_0^{t}\left|v\right|$: **todas** las áreas en
      positivo, porque retroceder también es recorrer.

      | instante | acumulado |
      |---|---|
      | $15$ | $112{,}5$ |
      | $30$ | $225$ |
      | $40$ | $225+50 = \mathbf{275}$ |
      | $45$ | $300$ |
      | $50$ | $325$ |

      $$
      \boxed{t = 40 \ \text{s}}
      $$

      Y merece la pena señalar el contraste: en $t=50$ la partícula ha
      **recorrido** 325 m pero está a solo 175 m del origen. La diferencia,
      $150 = 2\times75$, es el retroceso ida y vuelta.

      ### 4 · Apartado (c): velocidad media y teorema de la media

      $$
      v_{\text{media}} = \frac{x(50)-x(0)}{50-0} = \frac{175}{50} = 3{,}5
      \ \text{m/s}
      $$

      —que es también $\frac{1}{50}\int_0^{50}v$, el valor medio integral de
      $v$—.

      **¿Es aplicable el teorema de la media?** Su hipótesis es que $v$ sea
      **continua** en el intervalo cerrado. Lo es: la quebrada está formada por
      segmentos que se enganchan sin saltos. Los picos no rompen la continuidad,
      solo la derivabilidad.

      $$
      \boxed{\text{SÍ se aplica}}
      $$

      El teorema garantiza **al menos un** punto con $v(c) = 3{,}5$. Buscándolos
      todos:

      | tramo | ecuación | solución |
      |---|---|---|
      | $[0,15]$ | $t = 3{,}5$ | $t = 3{,}5$ ✔ |
      | $[15,40]$ | $30-t = 3{,}5$ | $t = 26{,}5$ ✔ |
      | $[40,50]$ | $2t-90 = 3{,}5$ | $t = 46{,}75$ ✔ |

      $$
      \boxed{\text{Tres puntos: } t = 3{,}5,\ 26{,}5,\ 46{,}75}
      $$

      En la figura son los tres cortes de la quebrada con la horizontal
      $v = 3{,}5$: uno subiendo, otro bajando y otro subiendo.

      ### 5 · Apartado (d): Lagrange para $v$

      Las hipótesis del teorema del valor medio son **dos**:

      1. $v$ continua en $[0,50]$ — se cumple;
      2. $v$ derivable en $(0,50)$ — **no se cumple**.

      En $t=15$ la pendiente pasa de $+1$ a $-1$, y en $t=40$ de $-1$ a $+2$.
      Son **picos**: las derivadas laterales no coinciden.

      $$
      \boxed{\text{NO es aplicable}}
      $$

      Conviene añadir que la tesis tampoco se cumple. La tesis pediría un $c$
      con

      $$
      v'(c) = \frac{v(50)-v(0)}{50} = \frac{10-0}{50} = 0{,}2
      $$

      pero $v'$ solo toma los valores $1$, $-1$ y $2$. **Ningún punto** cumple
      la conclusión: no es que el teorema no se pueda usar y aun así valga; es
      que sin la hipótesis el resultado es falso.

      ### 6 · Apartado (e): Lagrange para $x$

      $$
      x(t) = \int_0^{t}v(u)\,du
      $$

      Como $v$ es **continua**, el teorema fundamental del cálculo dice que $x$
      es derivable en todo punto y $x'(t) = v(t)$.

      $$
      \boxed{\text{SÍ es aplicable}}
      $$

      **Integrar suaviza.** $v$ tiene picos y $x$ no: es derivable en todas
      partes. Lo que $x$ no es es dos veces derivable en $t=15$ y $t=40$, pero
      Lagrange no lo pide.

      La tesis:

      $$
      x'(c) = \frac{x(50)-x(0)}{50} = 3{,}5
      \;\Longrightarrow\;
      v(c) = 3{,}5
      $$

      $$
      \boxed{\text{Los mismos tres puntos: } t = 3{,}5,\ 26{,}5,\ 46{,}75}
      $$

      ### 7 · Lo que enseña el ejercicio

      Los apartados (c), (d) y (e) son la misma pregunta a tres niveles, y
      conviene verlo escrito:

      | apartado | función | hipótesis que falla | ¿aplica? |
      |---|---|---|---|
      | (c) media integral de $v$ | $v$ | ninguna: basta continuidad | **sí** |
      | (d) Lagrange para $v$ | $v$ | derivabilidad (picos) | **no** |
      | (e) Lagrange para $x$ | $x$ | ninguna: $x' = v$ existe | **sí** |

      Y (c) y (e) dan **los mismos tres puntos**, porque son literalmente el
      mismo enunciado: el valor medio de $v$ y la pendiente media de su
      primitiva son el mismo número.

      ### 8 · Comprobación

      **De $x(50)$ por tramos, integrando las fórmulas:**

      $$
      \int_0^{15}t\,dt = \frac{225}{2} = 112{,}5 \quad\checkmark
      $$

      $$
      \int_{15}^{40}(30-t)\,dt
      = \left[30t-\frac{t^{2}}{2}\right]_{15}^{40}
      = (1200-800)-(450-112{,}5) = 400-337{,}5 = 62{,}5
      $$

      $$
      \int_{40}^{50}(2t-90)\,dt
      = \left[t^{2}-90t\right]_{40}^{50}
      = (2500-4500)-(1600-3600) = -2000+2000 = 0
      $$

      $$
      x(50) = 112{,}5+62{,}5+0 = 175 \quad\checkmark
      $$

      El último tramo aporta **cero neto**: los 25 m de retroceso entre 40 y 45
      se compensan exactamente con los 25 de avance entre 45 y 50, porque los
      dos triángulos son iguales.

      **De los tres puntos de (c):**

      $$
      v(3{,}5) = 3{,}5 \ \checkmark
      \qquad
      v(26{,}5) = 30-26{,}5 = 3{,}5 \ \checkmark
      \qquad
      v(46{,}75) = 93{,}5-90 = 3{,}5 \ \checkmark
      $$

      **De coherencia entre (a) y (b).** Recorrido $325$, desplazamiento $175$;
      la diferencia $150$ debe ser el doble de lo retrocedido:
      $2\times75 = 150$ ✔
