ejercicios:
  - id: ex2324-3ev-1-tangente-compleja
    titulo: Una tangente que vale i/2 y un cociente de módulos
    fuente: >-
      Ejercicio 1 · Tercera evaluación, 16 de enero de 2024 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3

    nivel: examen
    enunciado: |
      **a)** Resolver la ecuación $\mathrm{tg}(z) = \dfrac{i}{2}$,
      $z \in \mathbb{C}$.

      **b)** Calcular y representar geométricamente los afijos de los números
      complejos $z$ que verifican la condición
      $\left|\dfrac{z+i}{z-i}\right| > 2$.
    pide: Resolver la ecuación y describir la región.

    pasos:
      - tipo: reconocer
        pregunta: |
          Para resolver $\mathrm{tg}(z) = \frac i2$, ¿por dónde se empieza?
        opciones:
          - texto: >-
              Escribir la tangente con exponenciales y reducirlo todo a una
              ecuación en $w = \mathrm{e}^{2iz}$
            correcta: true
            mensaje: |
              Exacto. En variable compleja el seno y el coseno **se definen**
              con exponenciales, y ese es el camino: la tangente se convierte en
              una función racional de $\mathrm{e}^{2iz}$ y la ecuación se
              vuelve de primer grado.
          - texto: >-
              Aplicar $\arctan\frac i2$ con la calculadora
            mensaje: |
              La calculadora no está permitida, y además el arcotangente real no
              acepta argumentos imaginarios. Hay que trabajar con la definición.
          - texto: >-
              Separar $z = x+yi$ y desarrollar
              $\mathrm{tg}(x+yi)$
            mensaje: |
              Se puede, pero lleva a un sistema con $\tan x$ y $\tanh y$ mucho
              más largo. El camino exponencial es directo.
          - texto: >-
              La ecuación no tiene solución, porque la tangente real nunca es
              imaginaria pura
            mensaje: |
              En $\mathbb{C}$ sí la tiene: la tangente compleja toma casi todos
              los valores. De hecho hay **infinitas** soluciones.

      - tipo: calcular
        titulo: La parte imaginaria de las soluciones
        pregunta: |
          Todas las soluciones tienen la misma parte imaginaria. ¿Cuál es?
        respuesta:
          tipo: numero
          valor: '0.5493'
          tolerancia: 0.0005
          formato: en forma exacta, o un número con cuatro decimales
        distractores:
          - valor: '1.0986'
            mensaje: |
              $\ln3 = 1{,}0986$ es el doble. Falta dividir entre 2: la parte
              imaginaria es $\frac{\ln3}{2}$.
          - valor: '-0.5493'
            mensaje: |
              Signo cambiado. De $\mathrm{e}^{2iz} = \frac13$ sale
              $2iz = -\ln3+2k\pi i$, y al dividir entre $2i$ el signo se
              invierte: $\mathrm{Im}(z) = +\frac{\ln3}{2}$.
          - valor: '0.3333'
            mensaje: |
              $\frac13$ es el valor de $\mathrm{e}^{2iz}$, no de la parte
              imaginaria. Falta tomar logaritmo.
        pista: |
          $\mathrm{tg}\,z = -i\,\frac{\mathrm{e}^{2iz}-1}{\mathrm{e}^{2iz}+1}$.
        desarrollo: |
          Con $w = \mathrm{e}^{2iz}$:

          $$
          -i\,\frac{w-1}{w+1} = \frac i2
          \;\Longrightarrow\;
          \frac{w-1}{w+1} = -\frac12
          $$

          $$
          2(w-1) = -(w+1)
          \;\Longrightarrow\;
          3w = 1
          \;\Longrightarrow\;
          w = \frac13
          $$

          Tomando logaritmo complejo:

          $$
          2iz = \ln\frac13+2k\pi i = -\ln3+2k\pi i
          $$

          $$
          z = \frac{-\ln3+2k\pi i}{2i}
          = k\pi+\frac{\ln3}{2}\,i
          $$

          $$
          \mathrm{Im}(z) = \frac{\ln3}{2} \approx 0{,}5493
          $$
        veredicto: |
          Al dividir entre $2i$ conviene multiplicar arriba y abajo por $-i$:
          $\frac{1}{2i} = -\frac i2$. Ahí es donde se cuelan los signos.

      - tipo: calcular
        titulo: El radio de la región de (b)
        pregunta: |
          La condición del apartado (b) define un disco. ¿Cuál es su radio?
        respuesta:
          tipo: numero
          valor: '1.3333'
          tolerancia: 0.0008
          formato: en forma exacta, o un número con cuatro decimales
        distractores:
          - valor: '1.6667'
            mensaje: |
              $\frac53$ es la ordenada del **centro**, no el radio. El radio es
              $\frac43$.
          - valor: '2'
            mensaje: |
              2 es la cota del enunciado. Hay que operar la desigualdad para
              llegar a la circunferencia.
          - valor: '0.6667'
            mensaje: |
              $\frac23$ es la mitad del radio.
        pista: |
          Eleva al cuadrado: $\left|z+i\right|^{2} > 4\left|z-i\right|^{2}$ y
          completa cuadrados.
        desarrollo: |
          Con $z = x+yi$:

          $$
          x^{2}+(y+1)^{2} > 4\left[x^{2}+(y-1)^{2}\right]
          $$

          $$
          x^{2}+y^{2}+2y+1 > 4x^{2}+4y^{2}-8y+4
          $$

          $$
          0 > 3x^{2}+3y^{2}-10y+3
          \;\Longrightarrow\;
          x^{2}+y^{2}-\frac{10}{3}y+1 < 0
          $$

          Completando cuadrados en $y$:

          $$
          x^{2}+\left(y-\frac53\right)^{2}-\frac{25}{9}+1 < 0
          $$

          $$
          x^{2}+\left(y-\frac53\right)^{2} < \frac{16}{9}
          $$

          Disco abierto de centro $\left(0,\frac53\right)$ y radio
          $\frac43 \approx 1{,}3333$.
        veredicto: |
          Que el conjunto de puntos cuyo cociente de distancias a dos puntos
          fijos es constante sea una circunferencia tiene nombre:
          **circunferencia de Apolonio**. Merece la pena citarlo.

      - tipo: justificar
        pregunta: |
          Ordena la descripción de la región. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Traducir el cociente.** $\left|\frac{z+i}{z-i}\right|>2$
              equivale a $\left|z+i\right| > 2\left|z-i\right|$, siempre que
              $z \neq i$.
          - texto: |
              **Interpretarlo.** Es el conjunto de puntos cuya distancia a $-i$
              es más del doble que su distancia a $i$: una **circunferencia de
              Apolonio** y su interior.
          - texto: |
              **Operar.** Elevando al cuadrado y completando cuadrados sale
              $x^{2}+\left(y-\frac53\right)^{2} < \frac{16}{9}$.
          - texto: |
              **Describirlo.** Disco **abierto** de centro
              $\left(0,\frac53\right)$ y radio $\frac43$, que corta al eje
              imaginario entre $\frac13$ y $3$.
          - texto: |
              **Y quitar el punto $z=i$**, donde el cociente no está definido:
              está dentro del disco, porque
              $\left(1-\frac53\right)^{2} = \frac49 < \frac{16}{9}$.
          - texto: |
              Como $z=i$ anula el denominador, queda automáticamente fuera del
              disco.
            trampa: true
            mensaje: |
              No queda fuera: cae **dentro**, y por eso hay que excluirlo a
              mano. La región es el disco **menos un punto**, y decirlo es
              exactamente lo que separa una respuesta de 6 de una de 9. Comprobar
              dónde cae el punto prohibido cuesta una sustitución.
        veredicto: |
          El punto excluido está dentro, así que la región no es un disco sin
          más: es un disco perforado. Es el detalle que casi nadie escribe.

    resolucion: |
      **Datos.** Una ecuación con la tangente compleja y una desigualdad entre
      módulos.

      ### 1 · Apartado (a): la tangente en $\mathbb{C}$

      En variable compleja, seno y coseno se **definen** con exponenciales:

      $$
      \sin z = \frac{\mathrm{e}^{iz}-\mathrm{e}^{-iz}}{2i},
      \qquad
      \cos z = \frac{\mathrm{e}^{iz}+\mathrm{e}^{-iz}}{2}
      $$

      $$
      \mathrm{tg}\,z = \frac{1}{i}\cdot
      \frac{\mathrm{e}^{iz}-\mathrm{e}^{-iz}}{\mathrm{e}^{iz}+\mathrm{e}^{-iz}}
      $$

      Multiplicando arriba y abajo por $\mathrm{e}^{iz}$ y llamando
      $w = \mathrm{e}^{2iz}$:

      $$
      \mathrm{tg}\,z = -i\,\frac{w-1}{w+1}
      $$

      ### 2 · Resolver

      $$
      -i\,\frac{w-1}{w+1} = \frac i2
      \;\Longrightarrow\;
      \frac{w-1}{w+1} = \frac{i}{2\cdot(-i)} = -\frac12
      $$

      $$
      2w-2 = -w-1
      \;\Longrightarrow\;
      3w = 1
      \;\Longrightarrow\;
      w = \frac13
      $$

      Y ahora el logaritmo complejo, que es **multivaluado** —de ahí las
      infinitas soluciones—:

      $$
      \mathrm{e}^{2iz} = \frac13
      \;\Longrightarrow\;
      2iz = \ln\frac13+2k\pi i = -\ln3+2k\pi i, \quad k \in \mathbb{Z}
      $$

      Dividiendo entre $2i$, y con $\frac{1}{2i} = -\frac i2$:

      $$
      z = -\frac i2\left(-\ln3+2k\pi i\right)
      = \frac{i\ln3}{2}+k\pi
      $$

      $$
      \boxed{z = k\pi+\frac{\ln3}{2}\,i, \qquad k \in \mathbb{Z}}
      $$

      Infinitas soluciones, todas a la **misma altura** $\frac{\ln3}{2}$ y
      separadas $\pi$: la tangente compleja es periódica de periodo $\pi$, igual
      que la real.

      ### 3 · Comprobación de (a)

      Con $k=0$, $z = \frac{i\ln3}{2}$. Para un imaginario puro,
      $\mathrm{tg}(iy) = i\,\mathrm{th}(y)$, y

      $$
      \mathrm{th}\frac{\ln3}{2}
      = \frac{\mathrm{e}^{\ln3/2}-\mathrm{e}^{-\ln3/2}}
      {\mathrm{e}^{\ln3/2}+\mathrm{e}^{-\ln3/2}}
      = \frac{\sqrt3-\frac{1}{\sqrt3}}{\sqrt3+\frac{1}{\sqrt3}}
      = \frac{\frac{2}{\sqrt3}}{\frac{4}{\sqrt3}} = \frac12
      $$

      $$
      \mathrm{tg}\,z = i\cdot\frac12 = \frac i2 \quad\checkmark
      $$

      ### 4 · Apartado (b): qué dice la condición

      $$
      \left|\frac{z+i}{z-i}\right| > 2
      \;\Longleftrightarrow\;
      \left|z+i\right| > 2\left|z-i\right|, \qquad z \neq i
      $$

      Leído en distancias: **los puntos que están más del doble de lejos de
      $-i$ que de $i$**. El lugar donde la razón de distancias es constante es
      una **circunferencia de Apolonio**, y aquí queremos su interior.

      ### 5 · Operar

      Con $z = x+yi$:

      $$
      x^{2}+(y+1)^{2} > 4\left[x^{2}+(y-1)^{2}\right]
      $$

      $$
      x^{2}+y^{2}+2y+1 > 4x^{2}+4y^{2}-8y+4
      $$

      $$
      0 > 3x^{2}+3y^{2}-10y+3
      $$

      Dividiendo entre 3 y completando cuadrados:

      $$
      x^{2}+y^{2}-\frac{10}{3}y+1 < 0
      $$

      $$
      x^{2}+\left(y-\frac53\right)^{2} < \frac{25}{9}-1 = \frac{16}{9}
      $$

      $$
      \boxed{\text{Disco ABIERTO de centro } \left(0,\tfrac53\right)
      \text{ y radio } \tfrac43}
      $$

      Sobre el eje imaginario va de $\frac53-\frac43 = \frac13$ a
      $\frac53+\frac43 = 3$.

      ### 6 · El punto que hay que quitar

      $z = i$ anula el denominador, así que **no** pertenece a la región. Y cae
      **dentro** del disco:

      $$
      0^{2}+\left(1-\frac53\right)^{2} = \frac49 < \frac{16}{9}
      $$

      $$
      \boxed{\text{La región es el disco menos el punto } i}
      $$

      Un disco perforado. Es el detalle que distingue una respuesta completa.

      <figure class="figura-examen">
      <svg viewBox="0 0 420 480" role="img" width="400" height="458"
           aria-labelledby="f2324c1t f2324c1d">
        <title id="f2324c1t">La region del apartado b</title>
        <desc id="f2324c1d">Un disco abierto centrado en el eje imaginario a
        altura cinco tercios, con radio cuatro tercios, que llega desde la
        altura un tercio hasta la altura tres. Dentro, a la altura uno, hay un
        punto hueco que no pertenece a la region.</desc>

        <circle cx="180" cy="170" r="112" fill="var(--live)"
                fill-opacity="0.14" stroke="none"></circle>
        <circle cx="180" cy="170" r="112" fill="none" stroke="var(--live)"
                stroke-width="2.4" stroke-dasharray="9 7"></circle>

        <g stroke="var(--graphite)" stroke-width="1.3" fill="none">
          <path d="M40 380 L390 380 M180 40 L180 450"></path>
        </g>

        <g stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 5"
           fill="none">
          <path d="M60 58 L390 58 M60 282 L390 282 M60 296 L390 296"></path>
        </g>

        <circle cx="180" cy="296" r="6" fill="var(--paper)"
                stroke="var(--flag)" stroke-width="2.6"></circle>
        <circle cx="180" cy="170" r="4" fill="var(--graphite)"></circle>
        <circle cx="180" cy="464" r="0" fill="none"></circle>

        <g fill="var(--graphite)" font-size="13" font-family="var(--mono)">
          <text x="188" y="176">5/3</text>
          <text x="188" y="54">3</text>
          <text x="188" y="278">1/3</text>
          <text x="370" y="372">Re</text>
          <text x="188" y="52"></text>
          <text x="150" y="398">0</text>
        </g>
        <g fill="var(--flag)" font-size="13" font-family="var(--mono)">
          <text x="192" y="302">i (excluido)</text>
        </g>
        <g fill="var(--live)" font-size="13" font-family="var(--mono)">
          <text x="58" y="126">|z+i| &gt; 2|z-i|</text>
        </g>
      </svg>
      <figcaption>
      Figura nuestra: el enunciado pide representar. El borde va de trazos
      porque la desigualdad es estricta, y el circulo hueco marca el punto i,
      que esta dentro del disco pero fuera de la region.
      </figcaption>
      </figure>

      ### 7 · Comprobación de (b)

      **Con el centro,** $z = \frac53 i$:

      $$
      \left|\frac{\frac53i+i}{\frac53i-i}\right|
      = \left|\frac{\frac83i}{\frac23i}\right| = 4 > 2 \quad\checkmark
      $$

      **Con un punto del borde,** $z = 3i$:

      $$
      \left|\frac{4i}{2i}\right| = 2
      $$

      exactamente 2, no mayor ✔ El borde queda fuera, como corresponde a la
      desigualdad estricta.

      **Con el otro extremo,** $z = \frac13 i$:

      $$
      \left|\frac{\frac43i}{-\frac23i}\right| = 2 \quad\checkmark
      $$

      También en el borde.

      **Con un punto de fuera,** $z = 0$:

      $$
      \left|\frac{i}{-i}\right| = 1 \not> 2 \quad\checkmark
      $$

      El origen está fuera, coherente con que el disco empiece en $\frac13 i$.

  - id: ex2324-3ev-2-taylor-de-la-inversa
    titulo: El polinomio de la inversa, leído en una gráfica
    fuente: >-
      Ejercicio 2 · Tercera evaluación, 16 de enero de 2024 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3

    nivel: examen
    enunciado: |
      En la siguiente figura se muestran una función $f(x)$ y sus respectivas
      derivadas. Calcular el polinomio de Taylor de orden 2 de la función
      inversa de $f(x)$ en el punto $x=2$.

