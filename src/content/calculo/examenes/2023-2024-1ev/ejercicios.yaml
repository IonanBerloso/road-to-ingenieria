ejercicios:
  - id: ex2324-1-semirrecta-vertical
    titulo: Cuando el lugar geométrico no tiene área
    fuente: >-
      Ejercicio 1 · Primera evaluación, 16 de octubre de 2023 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    nivel: examen
    enunciado: |
      Calcular y representar geométricamente los afijos de los números
      complejos $z$ que verifican las condiciones siguientes:

      $$
      \begin{cases}
      \arg\left(\dfrac{1}{z-2-3i}\right) = \dfrac{\pi}{2} \\[10pt]
      \left|z\right| \le \left|\overline{z}+i\right|
      \end{cases}
      $$
    pide: Calcular el lugar geométrico y representarlo.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué le hace al argumento el hecho de estar el complejo **invertido**?
        opciones:
          - texto: >-
              Le cambia el signo: $\arg\left(\frac{1}{w}\right) = -\arg(w)$
            correcta: true
            mensaje: |
              Eso es. Al invertir, el módulo se invierte y el argumento cambia
              de signo, porque $\frac{1}{w} = \frac{\overline w}{|w|^{2}}$ y el
              conjugado refleja respecto del eje real. Así que la condición dice
              $\arg(z-2-3i) = -\frac{\pi}{2}$.
          - texto: 'Nada: el argumento de $\frac1w$ es el mismo que el de $w$'
            mensaje: |
              Si fuera el mismo, $w$ y $\frac1w$ estarían en la misma
              semirrecta desde el origen, y no lo están: con $w=i$ sale
              $\frac1w = -i$, que apunta al lado contrario.
          - texto: Le suma $\pi$
            mensaje: |
              Eso es lo que hace multiplicar por $-1$, no invertir. Invertir
              **refleja** respecto del eje real, así que cambia el signo del
              argumento.
          - texto: Lo invierte, igual que al módulo
            mensaje: |
              El módulo sí se invierte, $\left|\frac1w\right| = \frac{1}{|w|}$,
              pero el argumento no: cambia de signo. Son dos operaciones
              distintas sobre dos cosas distintas.

      - tipo: calcular
        titulo: El extremo del lugar geométrico
        pregunta: |
          El lugar geométrico es una semirrecta. ¿Cuál es su punto extremo?
        respuesta:
          tipo: complejo
          valor: 2+0.5i
          tolerancia: 0.01
          formato: forma binómica, por ejemplo 2+0.5i
        distractores:
          - valor: 2+3i
            mensaje: |
              $2+3i$ es el punto **desde el que** se mide el argumento, y está
              excluido: ahí el denominador se anula. El extremo lo pone la
              segunda condición, que corta a la altura $y=\frac12$.
          - valor: 0.5i
            mensaje: |
              Te falta la parte real. La primera condición obliga a estar en la
              vertical $x=2$, no en el eje imaginario.
          - valor: 2-0.5i
            mensaje: |
              Signo cambiado en la altura. De $\left|z\right| \le
              \left|\overline z+i\right|$ sale $y \le \frac12$, así que el
              extremo está **por encima** del eje real.
        pista: |
          La primera condición te da la recta. Eleva al cuadrado la segunda
          para saber dónde se corta.
        desarrollo: |
          **Primera condición.** Con $w = z-2-3i$:

          $$
          \arg\left(\frac1w\right) = -\arg(w) = \frac{\pi}{2}
          \;\Longrightarrow\;
          \arg(w) = -\frac{\pi}{2}
          $$

          Un complejo de argumento $-\frac{\pi}{2}$ es un imaginario puro
          negativo: $w = -it$ con $t>0$. Luego

          $$
          z = 2+3i-it = 2+(3-t)i, \qquad t>0
          $$

          la **semirrecta vertical** $x=2$ con $y<3$.

          **Segunda condición.** Con $z = x+iy$, $\overline z + i = x+(1-y)i$:

          $$
          x^{2}+y^{2} \le x^{2}+(1-y)^{2} = x^{2}+1-2y+y^{2}
          $$

          $$
          0 \le 1-2y \;\Longleftrightarrow\; y \le \frac12
          $$

          Cruzando las dos, el punto más alto es $\left(2,\frac12\right)$, y
          entra porque la desigualdad no es estricta.
        veredicto: |
          Los $x^{2}$ y los $y^{2}$ se cancelan solos: por eso la frontera de la
          segunda condición es una recta y no una circunferencia.

      - tipo: verificar
        pregunta: |
          Escribe las dos condiciones en $x$ e $y$. La figura comprobará si el trozo
          que sale coincide con el del enunciado.
        condicion: 'arg(1/(z-2-3i)) = pi/2 & |z| <= |conj(z)+i|'
        ventana:
          x: [-2, 6]
          y: [-4, 5]
        formato: en x e y; usa & para juntar las dos condiciones
        pista: |
          El argumento de un inverso es el opuesto del argumento: $\arg\frac{1}{w} =
          -\arg w$. Y la segunda condición, elevada al cuadrado, deja solo la parte
          imaginaria.
        desarrollo: |
          La primera condición equivale a $\arg(z-2-3i) = -\frac{\pi}{2}$: la
          semirrecta que sale de $2+3i$ **hacia abajo**, es decir $x=2$ con $y<3$, y
          sin el propio punto.

          Para la segunda, con $z = x+iy$ se tiene $\overline{z}+i = x+i(1-y)$, así
          que elevando al cuadrado los dos módulos:

          $$
          x^{2}+y^{2} \le x^{2}+(1-y)^{2}
          \;\Longrightarrow\;
          2y \le 1
          \;\Longrightarrow\;
          y \le \tfrac12
          $$

          La intersección es la semirrecta $x=2$ con $y \le \frac12$.
        veredicto: |
          Una **semirrecta vertical**, la de $x=2$ desde $y=\frac12$ hacia abajo. No
          tiene área, y ese es el aviso del enunciado: un lugar geométrico no siempre
          es una región.
      - tipo: justificar
        pregunta: |
          Ordena la descripción del lugar geométrico. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              El cociente exige $z \neq 2+3i$, y el argumento de 0 no está
              definido: ese punto queda excluido desde el principio.
          - texto: |
              $\arg\left(\frac{1}{w}\right) = -\arg(w)$, así que la condición es
              $\arg(z-2-3i) = -\frac{\pi}{2}$.
          - texto: |
              Eso significa que $z-2-3i$ es imaginario puro **negativo**: la
              semirrecta vertical $x=2$ por debajo de $y=3$, sin incluir el
              $3i$.
          - texto: |
              La segunda condición da $y \le \frac12$, un semiplano cerrado.
          - texto: |
              La intersección es la semirrecta $x=2$ con $y \le \frac12$, que
              baja hasta el infinito y tiene su extremo en $2+\frac12 i$.
          - texto: |
              Como el lugar tiene área, se puede comprobar superponiendo
              regiones.
            trampa: true
            mensaje: |
              No tiene área: es una semirrecta, un conjunto de medida nula. Por
              eso este ejercicio se resuelve dando la recta y su extremo, y no
              con la herramienta de comparar regiones que usan otros ejercicios
              del sitio: dos curvas distintas «coinciden» en cero puntos igual
              que dos idénticas.
        veredicto: |
          Un argumento fijado da siempre una semirrecta, nunca un sector. El
          sector aparece cuando el argumento se acota entre dos valores.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** Se pide el lugar de los $z$ con
      $\arg\left(\frac{1}{z-2-3i}\right) = \frac{\pi}{2}$ y
      $\left|z\right| \le \left|\overline z+i\right|$.

      **Reparto de puntos del examen:** COMP1 1 · COMP2 7 · COMP4 2.

      ### 1 · Restricciones previas

      El cociente obliga a $z \neq 2+3i$. Y aunque el denominador no se anulara,
      el **argumento de 0 no está definido**, así que ese punto queda fuera por
      partida doble. Se anota antes de operar.

      ### 2 · Primera condición: una semirrecta

      La herramienta es la regla del argumento de un inverso:

      $$
      \frac{1}{w} = \frac{\overline w}{\left|w\right|^{2}}
      \;\Longrightarrow\;
      \arg\left(\frac{1}{w}\right) = -\arg(w)
      $$

      —invertir refleja respecto del eje real y encoge el módulo, pero lo que
      importa aquí es el signo del argumento—. Con $w = z-2-3i$:

      $$
      -\arg(w) = \frac{\pi}{2} \;\Longleftrightarrow\; \arg(w) = -\frac{\pi}{2}
      $$

      Un complejo tiene argumento $-\frac{\pi}{2}$ exactamente cuando es
      **imaginario puro negativo**:

      $$
      z-2-3i = -it \quad\text{con } t>0
      $$

      $$
      z = 2+(3-t)i, \qquad t>0
      $$

      Es la **semirrecta vertical** $x=2$, con $y<3$. El extremo $2+3i$ no
      entra, porque $t>0$ es estricto.

      Merece la pena decir por qué es una semirrecta y no una recta entera:
      fijar el argumento fija la **dirección**, y una dirección desde un punto
      es media recta. Si la condición hubiera sido
      $\arg(w) = \pm\frac{\pi}{2}$, saldría la recta completa menos el punto.

      ### 3 · Segunda condición: un semiplano

      Con $z = x+iy$ se tiene $\overline z + i = x-iy+i = x+(1-y)i$. Los dos
      miembros son módulos, no negativos, así que elevar al cuadrado es
      equivalente:

      $$
      x^{2}+y^{2} \le x^{2}+(1-y)^{2}
      $$

      $$
      y^{2} \le 1-2y+y^{2}
      \;\Longleftrightarrow\;
      0 \le 1-2y
      \;\Longleftrightarrow\;
      y \le \frac{1}{2}
      $$

      Los términos cuadráticos se cancelan enteros —también los $x^{2}$—, y por
      eso la frontera es una **recta horizontal** y no una cónica.

      Geométricamente la condición dice que el afijo de $z$ está al menos tan
      cerca del origen como el de $\overline z$ lo está de $-i$. La frontera es
      la mediatriz correspondiente.

      ### 4 · La intersección

      $$
      x = 2 \quad\text{y}\quad y \le \frac12
      $$

      La condición $y<3$ de la primera queda absorbida: $\frac12 < 3$.

      Es la **semirrecta vertical que arranca en $2+\frac12 i$ y baja
      indefinidamente**. El extremo entra —la segunda desigualdad no es
      estricta—; el punto $2+3i$ ni siquiera está en juego.

      ### 5 · Representación gráfica

      Una línea vertical sobre $x=2$, con un punto grueso en
      $\left(2,\;0{,}5\right)$ y una flecha hacia abajo. Conviene marcar también
      el $2+3i$ con un círculo hueco para dejar claro que se ha pensado en él.

      ### 6 · Comprobación

      Se prueban puntos que rompan cada cosa:

      - **$z = 2$**, o sea $(2,0)$. Primera:
        $z-2-3i = -3i$, de argumento $-\frac{\pi}{2}$, así que
        $\arg\left(\frac{1}{-3i}\right) = +\frac{\pi}{2}$ ✔. Segunda:
        $\left|2\right| = 2$ y $\left|\overline z+i\right| = \left|2+i\right| = \sqrt5 \approx 2{,}24$,
        y $2 \le 2{,}24$ ✔. **Entra.**
      - **$z = 2+2i$.** Primera ✔, porque $z-2-3i = -i$. Segunda:
        $\left|2+2i\right| = 2\sqrt2 \approx 2{,}83$ frente a
        $\left|2-i\right| = \sqrt5 \approx 2{,}24$: $2{,}83 \le 2{,}24$ es falso ✗.
        **Fuera**, y con razón: $y=2 > \frac12$.
      - **$z = 3+\frac12 i$.** Segunda ✔, pero $z-2-3i = 1-\frac52 i$, cuyo
        argumento no es $-\frac{\pi}{2}$ ✗. **Fuera**: la primera condición
        no perdona salirse de la vertical.

      ### Resultado

      $$
      \boxed{\;z = 2+yi \quad\text{con}\quad y \le \tfrac12\;}
      $$

  - id: ex2324-2-triangulo-girado
    titulo: Deshacer un giro para encontrar el triángulo
    fuente: >-
      Ejercicio 2 · Primera evaluación, 16 de octubre de 2023 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    nivel: examen
    enunciado: |
      Sean $z_1, z_2$ y $z_3$ los números complejos cuyos afijos son los
      vértices de un triángulo equilátero centrado en el origen de coordenadas.
      Si el triángulo se gira $\dfrac{\pi}{12}$ radianes respecto al origen, uno
      de los vértices que se obtiene es el afijo del número complejo
      $3_{\frac{3\pi}{4}}$. Obtener $z_1, z_2$ y $z_3$.
    pide: Obtener los tres vértices del triángulo original.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué significa la notación $3_{\frac{3\pi}{4}}$?
        opciones:
          - texto: >-
              Forma polar: módulo 3 y argumento $\frac{3\pi}{4}$
            correcta: true
            mensaje: |
              Eso es. El número grande es el módulo y el subíndice, el
              argumento. Es la misma información que $3e^{i\frac{3\pi}{4}}$ o
              que $3\left(\cos\frac{3\pi}{4}+i\,\mathrm{sen}\,\frac{3\pi}{4}\right)$.
          - texto: >-
              Parte real 3 y parte imaginaria $\frac{3\pi}{4}$
            correcta: false
            mensaje: |
              Eso sería la forma binómica y se escribiría
              $3+\frac{3\pi}{4}i$. El subíndice indica **argumento**, no parte
              imaginaria: la notación es polar.
          - texto: >-
              El número 3 elevado a $\frac{3\pi}{4}$
            mensaje: |
              Una potencia se escribe con el exponente arriba, no abajo. Abajo
              va el argumento, y esta notación con subíndice es la abreviatura
              habitual de la forma polar.
          - texto: >-
              La raíz $\frac{3\pi}{4}$-ésima de 3
            mensaje: |
              Las raíces se escriben con el índice sobre el radical, no como
              subíndice. Aquí el subíndice es el argumento.

      - tipo: calcular
        titulo: Deshacer el giro
        pregunta: |
          ¿Cuál es el argumento, en grados, del vértice **original** que al
          girar produce $3_{\frac{3\pi}{4}}$?
        respuesta:
          tipo: numero
          valor: '120'
          tolerancia: 0.5
          formato: un número de grados
        distractores:
          - valor: '150'
            mensaje: |
              $150^{\circ}$ sale de **sumar** el giro en vez de restarlo:
              $135+15$. El enunciado dice que el resultado **después** de girar
              es $3_{3\pi/4}$, así que hay que ir hacia atrás.
          - valor: '135'
            mensaje: |
              $135^{\circ}$ es el argumento del vértice **ya girado**, que es
              $\frac{3\pi}{4}$. Falta deshacer los $15^{\circ}$ del giro.
          - valor: '15'
            mensaje: |
              $15^{\circ}$ es el giro, $\frac{\pi}{12}$ en grados. Hay que
              restárselo a $135^{\circ}$, no darlo como respuesta.
        pista: |
          Girar es multiplicar por $e^{i\pi/12}$. Deshacerlo es dividir, es
          decir restar $15^{\circ}$ a $135^{\circ}$.
        desarrollo: |
          Girar un ángulo $\alpha$ alrededor del origen es multiplicar por
          $e^{i\alpha}$, que no cambia el módulo. Si $z$ es el vértice original,

          $$
          z\,e^{i\frac{\pi}{12}} = 3\,e^{i\frac{3\pi}{4}}
          \;\Longrightarrow\;
          z = 3\,e^{i\left(\frac{3\pi}{4}-\frac{\pi}{12}\right)}
          $$

          En grados, $\frac{3\pi}{4} = 135^{\circ}$ y
          $\frac{\pi}{12} = 15^{\circ}$:

          $$
          135^{\circ}-15^{\circ} = 120^{\circ}
          $$

          En radianes, $\frac{9\pi}{12}-\frac{\pi}{12} = \frac{8\pi}{12}
          = \frac{2\pi}{3}$.
        veredicto: |
          Que salga un ángulo tan redondo —$120^{\circ}$— es la señal de que se
          ha deshecho el giro en el sentido correcto.

      - tipo: calcular
        titulo: El vértice real
        pregunta: |
          Uno de los tres vértices es un número real. ¿Cuál?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '-3'
            mensaje: |
              $-3$ tendría argumento $180^{\circ}$, y los tres argumentos son
              $120^{\circ}$, $240^{\circ}$ y $0^{\circ}$. El que cae en el eje
              real es el de $0^{\circ}$, que es $+3$.
          - valor: '1.5'
            mensaje: |
              $1{,}5$ es el valor absoluto de la parte real de los otros dos
              vértices, $-\frac32$. El vértice real vale 3, el módulo entero.
          - valor: '0'
            mensaje: |
              0 es el centro del triángulo, no un vértice. Los tres vértices
              están a distancia 3 del origen.
        pista: |
          Los tres argumentos van de $120^{\circ}$ en $120^{\circ}$ a partir
          de $120^{\circ}$. Uno de ellos cae en $360^{\circ}$.
        desarrollo: |
          Los vértices de un triángulo equilátero centrado en el origen están
          separados $120^{\circ}$ y tienen el mismo módulo. Partiendo de
          $120^{\circ}$:

          $$
          120^{\circ}, \qquad 240^{\circ}, \qquad 360^{\circ} \equiv 0^{\circ}
          $$

          El de $0^{\circ}$ con módulo 3 es el número real $3$.
        veredicto: |
          Que uno de los vértices caiga justo en el eje real es una comprobación
          gratis: si no saliera ninguno redondo, convendría revisar el giro.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              $3_{\frac{3\pi}{4}}$ es la forma polar de módulo 3 y argumento
              $135^{\circ}$.
          - texto: |
              Girar $\frac{\pi}{12}$ alrededor del origen es multiplicar por
              $e^{i\pi/12}$, que **no cambia el módulo**: los vértices
              originales también tienen módulo 3.
          - texto: |
              Deshaciendo el giro, el vértice de partida tiene argumento
              $135^{\circ}-15^{\circ} = 120^{\circ}$.
          - texto: |
              Los otros dos están a $120^{\circ}$ y $240^{\circ}$ de él, es
              decir en $240^{\circ}$ y $0^{\circ}$.
          - texto: |
              Luego $z = 3$, $\;z = -\frac32+\frac{3\sqrt3}{2}i$ y
              $\;z = -\frac32-\frac{3\sqrt3}{2}i$.
          - texto: |
              Como el giro es de $\frac{\pi}{12}$, hay que girar los tres
              vértices ese ángulo para obtener la respuesta.
            trampa: true
            mensaje: |
              Eso es girar en el sentido contrario al que pide el enunciado. Lo
              que se conoce es el triángulo **después** de girar, y lo que se
              busca es el de antes: hay que **deshacer** el giro, restando
              $15^{\circ}$. Girar otra vez devolvería el triángulo del que se
              partía, no el original.
        veredicto: |
          El único dato que hace falta del giro es que no toca los módulos. Todo
          lo demás es aritmética de ángulos.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** Un triángulo equilátero centrado en el origen, de vértices
      $z_1,z_2,z_3$. Al girarlo $\frac{\pi}{12}$ respecto del origen, uno de los
      vértices resultantes es $3_{\frac{3\pi}{4}}$.

      **Reparto de puntos del examen:** COMP1 1 · COMP2 7 · COMP4 2.

      ### 1 · Las dos herramientas, y por qué bastan

      **Girar es multiplicar por una exponencial unitaria.** Un giro de ángulo
      $\alpha$ alrededor del origen lleva $z$ a $z\,e^{i\alpha}$: suma $\alpha$
      al argumento y **deja el módulo intacto**, porque
      $\left|e^{i\alpha}\right| = 1$.

      **Un triángulo equilátero centrado en el origen tiene sus tres vértices
      con el mismo módulo y argumentos separados $120^{\circ}$.** Eso es
      inmediato: los tres están a la misma distancia del centro, y el ángulo
      completo se reparte en tres partes iguales.

      Con esas dos cosas, el dato de un solo vértice basta para reconstruir el
      triángulo entero.

      ### 2 · Deshacer el giro

      La notación $3_{\frac{3\pi}{4}}$ es forma polar: módulo 3, argumento
      $\frac{3\pi}{4} = 135^{\circ}$.

      Si $z$ es el vértice original correspondiente,

      $$
      z\,e^{i\frac{\pi}{12}} = 3\,e^{i\frac{3\pi}{4}}
      \;\Longrightarrow\;
      z = 3\,e^{i\left(\frac{3\pi}{4}-\frac{\pi}{12}\right)}
      $$

      $$
      \frac{3\pi}{4}-\frac{\pi}{12} = \frac{9\pi}{12}-\frac{\pi}{12}
      = \frac{8\pi}{12} = \frac{2\pi}{3} = 120^{\circ}
      $$

      **Se resta, no se suma.** El enunciado da el triángulo *después* del giro
      y pide el de antes; girar otra vez sería ir en la dirección equivocada.

      El módulo se conserva, así que los tres vértices originales tienen
      módulo 3.

      ### 3 · Los tres vértices

      Argumentos separados $120^{\circ}$ a partir de $120^{\circ}$:

      $$
      120^{\circ}, \qquad 240^{\circ}, \qquad 360^{\circ} \equiv 0^{\circ}
      $$

      En forma binómica, con $\cos 120^{\circ} = -\frac12$ y
      $\mathrm{sen}\,120^{\circ} = \frac{\sqrt3}{2}$:

      $$
      z_1 = 3\,e^{i\,120^{\circ}} = -\frac{3}{2}+\frac{3\sqrt3}{2}i
      $$

      $$
      z_2 = 3\,e^{i\,240^{\circ}} = -\frac{3}{2}-\frac{3\sqrt3}{2}i
      $$

      $$
      z_3 = 3\,e^{i\,0^{\circ}} = 3
      $$

      ### 4 · Una observación que vale puntos

      El enunciado dice «uno de los vértices que se obtiene», no «el primero».
      Y no hace falta saber cuál: como los tres son intercambiables por giros de
      $120^{\circ}$, tomar otro de partida daría **el mismo triángulo** con los
      nombres cambiados.

      Se comprueba: si el vértice girado conocido hubiera venido del que está en
      $240^{\circ}$, entonces ese sería $135^{\circ}$ y los otros dos
      $135\pm120$, es decir $15^{\circ}$ y $255^{\circ}$… pero eso describe el
      triángulo **ya girado**, no otro distinto. La respuesta es única.

      ### 5 · Representación gráfica

      Tres puntos sobre la circunferencia de radio 3: uno en el semieje real
      positivo, en el $3$, y los otros dos simétricos respecto de ese eje, en
      el segundo y el tercer cuadrante. Girándolos $15^{\circ}$ en sentido
      positivo, el de $120^{\circ}$ aterriza en la bisectriz del segundo
      cuadrante, que es donde está $3_{\frac{3\pi}{4}}$.

      ### 6 · Comprobación

      Se gira el resultado y tiene que aparecer el dato del enunciado:

      $$
      3\,e^{i\,120^{\circ}}\cdot e^{i\,15^{\circ}} = 3\,e^{i\,135^{\circ}}
      = 3_{\frac{3\pi}{4}} \quad\checkmark
      $$

      Y la coherencia del triángulo: los tres módulos valen 3, la suma de los
      tres vértices es

      $$
      3+\left(-\tfrac32+\tfrac{3\sqrt3}{2}i\right)+\left(-\tfrac32-\tfrac{3\sqrt3}{2}i\right) = 0
      $$

      que es justo lo que tiene que dar el **baricentro por tres** cuando el
      triángulo está centrado en el origen. Esa comprobación cuesta una línea y
      caza cualquier error de signo.

      ### Resultado

      $$
      \boxed{\;z \in \left\{\,3,\;\; -\tfrac32+\tfrac{3\sqrt3}{2}i,\;\;
      -\tfrac32-\tfrac{3\sqrt3}{2}i \,\right\}\;}
      $$

  - id: ex2324-3-desigualdad-al-limite
    titulo: Dos sucesiones ordenadas y sus límites
    fuente: >-
      Ejercicio 3 · Primera evaluación, 16 de octubre de 2023 · Cálculo,
      UPV/EHU · El examen no publica solución: la demostración es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 0
      comp4: 10

    nivel: examen
    enunciado: |
      Demostrar la siguiente propiedad. Sean $\{x_n\}_{n\in\mathbb{N}}$ e
      $\{y_n\}_{n\in\mathbb{N}}$ dos sucesiones tales que
      $x_n \le y_n \;\; \forall n \in \mathbb{N}$ y
      $\lim_{n\to\infty} x_n = x \;\wedge\; \lim_{n\to\infty} y_n = y$.
      Entonces $x \le y$.
    pide: Demostrar la propiedad.

    pasos:
      - tipo: reconocer
        pregunta: |
          Hay **dos** sucesiones convergiendo a la vez. ¿Qué cuidado obliga eso?
        opciones:
          - texto: >-
              Que cada una da su propio índice, y hay que quedarse con el
              **mayor** de los dos
            correcta: true
            mensaje: |
              Ese es el detalle que separa una demostración cuidada de una que
              «se entiende». La definición de límite da un $m_1$ para
              $\{x_n\}$ y un $m_2$ para $\{y_n\}$, y no tienen por qué
              coincidir. Solo a partir de $\max(m_1,m_2)$ valen las dos cosas a
              la vez.
          - texto: Que hay que usar el mismo $\varepsilon$ para las dos
            mensaje: |
              El $\varepsilon$ **sí** se puede elegir igual para las dos, porque
              la definición vale para todo $\varepsilon>0$. Lo que no se puede
              suponer igual es el índice a partir del cual se cumple.
          - texto: Que hay que sumar las dos definiciones
            mensaje: |
              No hay nada que sumar. Se usan las dos por separado y luego se
              combinan las desigualdades en un mismo índice.
          - texto: Que las dos sucesiones tienen que ser monótonas
            mensaje: |
              El enunciado no lo dice ni hace falta. La demostración solo usa
              que convergen y que están ordenadas término a término.

      - tipo: calcular
        titulo: El épsilon
        pregunta: |
          Se supone $x>y$ para el absurdo. Con $x=5$ e $y=2$, ¿qué
          $\varepsilon$ conviene tomar?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              $3$ es la distancia entera, $x-y$. Con ese $\varepsilon$ los dos
              entornos se tocan en el punto medio y la contradicción deja de ser
              estricta. Hay que tomar la mitad.
          - valor: '3.5'
            mensaje: |
              $3{,}5$ es el punto medio entre 2 y 5, que sí aparece en la
              demostración como frontera entre los dos entornos, pero no es el
              épsilon.
          - valor: '2.5'
            mensaje: |
              $2{,}5$ es la mitad de $x$, no la mitad de la distancia. Lo que
              importa es cuánto se separan los dos límites: $x-y = 3$.
        pista: |
          La distancia entre los dos límites es $x-y = 3$. La mitad.
        desarrollo: |
          $$
          \varepsilon = \frac{x-y}{2} = \frac{5-2}{2} = 1{,}5
          $$

          Con ese valor, a partir de cierto índice
          $x_n > x-\varepsilon = 3{,}5$ e $y_n < y+\varepsilon = 3{,}5$, luego
          $y_n < x_n$: lo contrario de la hipótesis.
        veredicto: |
          El punto medio $3{,}5$ es la frontera: los $x_n$ acaban por encima y
          los $y_n$ por debajo, y no pueden cruzarse.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Por reducción al absurdo, supongamos $x>y$, y sea
              $\varepsilon = \dfrac{x-y}{2} > 0$.
          - texto: |
              Por converger $x_n \to x$, existe $m_1$ tal que
              $x_n > x-\varepsilon = \dfrac{x+y}{2}$ para todo $n>m_1$.
          - texto: |
              Por converger $y_n \to y$, existe $m_2$ tal que
              $y_n < y+\varepsilon = \dfrac{x+y}{2}$ para todo $n>m_2$.
          - texto: |
              Para $n > \max(m_1,m_2)$ se cumplen las dos a la vez, y entonces
              $y_n < \dfrac{x+y}{2} < x_n$.
          - texto: |
              Eso contradice $x_n \le y_n$. Luego $x \le y$.
          - texto: |
              Y como la hipótesis vale para todo $n$, se concluye además que
              $x < y$ si la desigualdad de partida fuera estricta.
            trampa: true
            mensaje: |
              No: aunque la hipótesis fuera $x_n < y_n$ estricta, la conclusión
              seguiría siendo $x \le y$. El contraejemplo es inmediato:
              $x_n = 0$ e $y_n = \frac1n$ cumplen $x_n < y_n$ para todo $n$ y
              sus límites son iguales, los dos 0.
        veredicto: |
          Este es el ejercicio 2.5 del boletín, palabra por palabra. Cayó en el
          examen tal cual, que es la mejor razón para hacer los boletines.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > demostración propuesta, pendiente de revisión.

      **Datos.** $x_n \le y_n$ para todo $n$, $x_n \to x$ e $y_n \to y$. Hay que
      demostrar que $x \le y$.

      **Reparto de puntos del examen:** COMP4 10. Todo son puntos de
      demostración: no hay nada que calcular.

      > Este enunciado es **exactamente** el ejercicio 2.5 de los problemas
      > complementarios del tema 2. Conviene saberlo: los boletines no son
      > material paralelo al examen, son el examen.

      ### 1 · Estrategia

      Reducción al absurdo. La negación de $x \le y$ es $x > y$, y de ahí sale
      una distancia positiva, $x-y$, con la que fabricar el épsilon.

      La definición que se va a usar, escrita, porque forma parte de lo que se
      puntúa:

      $$
      \lim a_n = a \iff
      \forall \varepsilon>0\;\exists\, m \in \mathbb{N} :\;
      n>m \Rightarrow \left|a_n-a\right| < \varepsilon
      $$

      ### 2 · La demostración

      Supongamos $x>y$ y tomemos

      $$
      \varepsilon = \frac{x-y}{2} > 0
      $$

      Por la convergencia de $\{x_n\}$, existe $m_1$ tal que para todo $n>m_1$

      $$
      \left|x_n-x\right| < \varepsilon
      \;\Longrightarrow\;
      x_n > x-\varepsilon = x-\frac{x-y}{2} = \frac{x+y}{2}
      $$

      Por la de $\{y_n\}$, existe $m_2$ tal que para todo $n>m_2$

      $$
      \left|y_n-y\right| < \varepsilon
      \;\Longrightarrow\;
      y_n < y+\varepsilon = y+\frac{x-y}{2} = \frac{x+y}{2}
      $$

      Sea ahora $n > \max(m_1,m_2)$. **Las dos desigualdades valen a la vez**, y
      encadenándolas:

      $$
      y_n < \frac{x+y}{2} < x_n
      $$

      es decir $y_n < x_n$, en contra de la hipótesis $x_n \le y_n$.
      Contradicción.

      Por tanto $x \le y$. $\blacksquare$

      ### 3 · Los dos detalles que valen la nota

      **El máximo de los dos índices.** Cada sucesión aporta su propio $m$, y
      no tienen por qué coincidir. Escribir un solo índice para las dos es el
      descuido más frecuente en las demostraciones con dos sucesiones, y deja el
      argumento cojo: sin $\max(m_1,m_2)$ no se sabe que las dos desigualdades
      se cumplen en el **mismo** $n$, que es justo lo que hace falta para
      encadenarlas.

      **La desigualdad se debilita.** Aunque la hipótesis fuera estricta,
      $x_n < y_n$, la conclusión seguiría siendo $x \le y$. Contraejemplo:
      $x_n = 0$ e $y_n = \frac1n$.

      ### 4 · Comprobación

      Se pone a prueba la maquinaria con $x=5$ e $y=2$, los números del paso de
      cálculo, construyendo dos sucesiones con esos límites y viendo que la
      hipótesis **se rompe sola**:

      $$
      x_n = 5-\frac{4}{n} \;\to\; 5, \qquad y_n = 2+\frac{4}{n} \;\to\; 2
      $$

      | $n$ | $x_n$ | $y_n$ | ¿$x_n \le y_n$? |
      |---|---|---|---|
      | 1 | $1$ | $6$ | sí |
      | 2 | $3$ | $4$ | sí |
      | 3 | $3{,}67$ | $3{,}33$ | **no** |
      | 4 | $4$ | $3$ | **no** |

      A partir de $n=3$ se invierte y ya no vuelve. Y coincide con lo que
      anuncia la demostración: con $\varepsilon = 1{,}5$ hacen falta
      $\frac4n < 1{,}5$, o sea $n>2{,}67$, luego $m_1 = m_2 = 2$ y el cruce
      aparece justo en $n > \max(m_1,m_2) = 2$.

      El $\max$ no era un tecnicismo: **predice el índice exacto** donde surge
      la contradicción.

      ### Resultado

      $$
      \boxed{\;x_n \le y_n \;\;\forall n,\;\; x_n \to x,\;\; y_n \to y
      \;\;\Longrightarrow\;\; x \le y\;}
      $$

  - id: ex2324-4-sucesion-y-serie-a-trozos
    titulo: Los primeros términos no cuentan para el límite, pero sí para la suma
    fuente: >-
      Ejercicio 4 · Primera evaluación, 16 de octubre de 2023 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 2
      comp4: 6

    nivel: examen
    enunciado: |
      Sea la sucesión $\{a_n\}_{n\in\mathbb{N}}$ definida de la siguiente forma:

      $$
      \{a_n\}_{n\in\mathbb{N}} =
      \begin{cases}
      n^{2} & n \le 2 \\[6pt]
      \dfrac{1}{3^{n}} & n > 2
      \end{cases}
      $$

      **a)** Estudiar la convergencia de la sucesión $\{a_n\}_{n\in\mathbb{N}}$.

      **b)** Sea $\{a_n\}_{n\in\mathbb{N}}$ la sucesión definida en el apartado
      anterior. Estudiar la convergencia de la serie
      $\displaystyle\sum_{n=1}^{\infty} a_n$, y en caso de que sea convergente,
      calcular su suma.
    pide: Estudiar la convergencia de la sucesión y de la serie, y sumar.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos primeros términos valen 1 y 4, muy grandes comparados con el
          resto. ¿A qué afectan?
        opciones:
          - texto: >-
              Al valor de la **suma**, pero no al límite de la sucesión ni a que
              la serie converja
            correcta: true
            mensaje: |
              Ese es el contraste del ejercicio. El límite de una sucesión y la
              convergencia de una serie dependen solo de la cola; el **valor**
              de la suma depende de todos los términos, y los dos primeros
              aportan 5 de los 5,06 que suma la serie.
          - texto: 'A nada: un número finito de términos nunca influye'
            mensaje: |
              Influyen en la suma. «Un número finito de términos no influye» es
              cierto para la **convergencia**, no para el valor al que se
              converge. Aquí esos dos términos son casi toda la suma.
          - texto: Al límite de la sucesión, que se va hacia 4
            mensaje: |
              El límite mira lo que pasa al final, y al final la sucesión vale
              $3^{-n}$, que tiende a 0. Los términos grandes están al principio
              y desaparecen del cálculo.
          - texto: A que la serie no pueda converger
            mensaje: |
              Sumar dos números grandes y luego infinitos muy pequeños puede dar
              perfectamente un resultado finito. Lo que decide es la cola, y la
              cola es geométrica de razón $\frac13$.

      - tipo: calcular
        titulo: El límite de la sucesión
        pregunta: |
          ¿Cuál es $\lim_{n\to\infty} a_n$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              4 es $a_2$, el mayor término de la sucesión. El límite no es el
              mayor valor: es hacia dónde van los términos al final, y al final
              valen $3^{-n}$.
          - valor: '1'
            mensaje: |
              1 es $a_1$. El límite depende solo de la cola, que es
              $\frac{1}{3^{n}} \to 0$.
          - valor: '0.037'
            mensaje: |
              $\frac{1}{27}$ es $a_3$, el primer término de la cola. Pero la
              cola sigue bajando: $\frac{1}{81}$, $\frac{1}{243}$… y tiende a 0.
        pista: |
          Solo cuenta la cola: para $n>2$ la sucesión es $\frac{1}{3^{n}}$.
        desarrollo: |
          Los términos son

          $$
          1,\quad 4,\quad \frac{1}{27},\quad \frac{1}{81},\quad
          \frac{1}{243},\;\dots
          $$

          Los dos primeros son un número **finito** de términos y no intervienen
          en el límite. Para $n>2$:

          $$
          \lim_{n\to\infty}\frac{1}{3^{n}} = 0
          $$

          porque es una potencia de base entre 0 y 1. La sucesión **converge y
          su límite es 0**.
        veredicto: |
          La sucesión no es monótona —sube de 1 a 4 y luego se desploma— y aun
          así converge. Monótona y acotada es condición suficiente, no
          necesaria.

      - tipo: calcular
        titulo: La suma de la serie
        pregunta: |
          ¿Cuánto vale $\sum_{n=1}^{\infty} a_n$?
        respuesta:
          tipo: numero
          valor: '5.0555556'
          tolerancia: 0.0005
          formato: un número, o una fracción como 91/18
        distractores:
          - valor: '5'
            mensaje: |
              5 es solo $a_1+a_2 = 1+4$. Falta la cola geométrica, que aporta
              $\frac{1}{18}$ más.
          - valor: '0.0555556'
            mensaje: |
              $\frac{1}{18}$ es lo que suma la **cola**, de $n=3$ en adelante.
              Faltan los dos primeros términos, que valen 5 entre los dos.
          - valor: '5.5'
            mensaje: |
              Parece que has sumado la geométrica completa desde $n=0$ o desde
              $n=1$. La cola empieza en $n=3$, y su primer término es
              $\frac{1}{27}$, no $\frac13$.
        pista: |
          Parte la suma: los dos primeros términos a mano, y de $n=3$ en
          adelante una geométrica de razón $\frac13$.
        desarrollo: |
          $$
          \sum_{n=1}^{\infty} a_n
          = \underbrace{1+4}_{\text{a mano}}
          + \underbrace{\sum_{n=3}^{\infty}\frac{1}{3^{n}}}_{\text{geométrica}}
          $$

          La cola es geométrica de razón $r=\frac13$, con $|r|<1$, y su primer
          término es $\frac{1}{27}$:

          $$
          \sum_{n=3}^{\infty}\frac{1}{3^{n}}
          = \frac{\frac{1}{27}}{1-\frac13}
          = \frac{\frac{1}{27}}{\frac23}
          = \frac{3}{54} = \frac{1}{18}
          $$

          $$
          S = 5+\frac{1}{18} = \frac{91}{18} \approx 5{,}0556
          $$
        veredicto: |
          Los dos términos «raros» del principio aportan **el 99 %** de la suma.
          Para la convergencia daban igual; para el valor, mandan.

      - tipo: justificar
        pregunta: |
          Ordena la respuesta a los dos apartados. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **(a)** La convergencia de una sucesión depende solo de su cola.
              Para $n>2$ vale $\frac{1}{3^{n}}$, que tiende a 0: converge con
              límite 0.
          - texto: |
              **(b)** La serie converge, y por la misma razón: quitando dos
              términos queda una **geométrica de razón $\frac13$**, con
              $\left|\frac13\right|<1$.
          - texto: |
              Para el **valor** de la suma, en cambio, los dos primeros términos
              sí cuentan, y hay que sumarlos aparte.
          - texto: |
              $S = 1+4+\dfrac{1/27}{1-1/3} = 5+\dfrac{1}{18} = \dfrac{91}{18}$.
          - texto: |
              Como la sucesión converge a 0, la serie converge.
            trampa: true
            mensaje: |
              Que el término general tienda a cero es **necesario pero no
              suficiente**. La serie armónica $\sum\frac1n$ tiene término
              general tendiendo a 0 y suma infinita. Aquí la serie converge
              porque su cola es geométrica de razón menor que 1, no por el
              apartado (a).
        veredicto: |
          Los seis puntos de COMP4 de este ejercicio están casi todos en esa
          distinción. El cálculo son dos puntos; explicarlo bien, seis.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** $a_n = n^{2}$ para $n\le2$ y $a_n = \frac{1}{3^{n}}$ para
      $n>2$. Se pide la convergencia de la sucesión y la de la serie, con su
      suma.

      **Reparto de puntos del examen:** COMP1 2 · COMP2 2 · COMP4 6. Fíjate en
      el reparto: **el cálculo vale dos puntos y la explicación seis**. Sumar
      bien no llega ni a la mitad de la nota; lo que se evalúa es entender por
      qué la cola decide una cosa y no la otra.

      ### 1 · Los términos

      $$
      a_1 = 1, \quad a_2 = 4, \quad a_3 = \frac{1}{27}, \quad
      a_4 = \frac{1}{81}, \quad a_5 = \frac{1}{243}, \;\dots
      $$

      Sube, se desploma y luego decrece hacia cero. **No es monótona**, y
      conviene decirlo para dejar claro que se ha mirado.

      ### 2 · Apartado (a): la sucesión

      La convergencia de una sucesión **depende solo de la cola**: cambiar un
      número finito de términos no cambia el límite, porque la definición
      afirma algo sobre los $n$ mayores que cierto índice, y ese índice se puede
      tomar tan grande como haga falta.

      Aquí los dos primeros términos son un número finito, así que se ignoran.
      Para $n>2$:

      $$
      \lim_{n\to\infty} a_n = \lim_{n\to\infty}\frac{1}{3^{n}} = 0
      $$

      porque $\frac{1}{3^{n}} = \left(\frac13\right)^{n}$ es una potencia de
      base entre 0 y 1.

      **La sucesión converge, con límite 0.** Y de paso: converge **sin ser
      monótona**, lo que recuerda que el teorema «monótona y acotada implica
      convergente» da una condición suficiente, no necesaria.

      ### 3 · Apartado (b): que la serie converja

      Una serie converge o no según su cola, por la misma razón: quitarle un
      número finito de términos cambia el valor de la suma pero no si esa suma
      es finita.

      La cola, de $n=3$ en adelante, es una **serie geométrica** de razón
      $r = \frac13$. Como $\left|r\right| = \frac13 < 1$, converge.

      Conviene señalar el error gemelo antes de que aparezca: **no** se puede
      argumentar «como $a_n \to 0$, la serie converge». Que el término general
      tienda a cero es condición **necesaria y no suficiente**; la serie
      armónica $\sum\frac1n$ lo cumple y suma infinito. Lo que decide aquí es
      que la cola sea geométrica de razón menor que 1.

      ### 4 · Apartado (b): el valor de la suma

      Y aquí cambia la historia. Para el **valor**, los dos primeros términos
      cuentan enteros, así que la suma se parte:

      $$
      \sum_{n=1}^{\infty} a_n
      = a_1+a_2+\sum_{n=3}^{\infty}\frac{1}{3^{n}}
      = 1+4+\sum_{n=3}^{\infty}\left(\frac13\right)^{n}
      $$

      Una geométrica que empieza donde sea vale **el primer término dividido
      entre $1-r$**:

      $$
      \sum_{n=3}^{\infty}\left(\frac13\right)^{n}
      = \frac{\left(\frac13\right)^{3}}{1-\frac13}
      = \frac{\frac{1}{27}}{\frac{2}{3}}
      = \frac{1}{27}\cdot\frac{3}{2}
      = \frac{1}{18}
      $$

      $$
      S = 5+\frac{1}{18} = \frac{90+1}{18} = \frac{91}{18} \approx 5{,}0556
      $$

      ### 5 · La lección, en una frase

      **Para saber SI converge, mira solo el final. Para saber A QUÉ converge,
      míralo todo.**

      Los dos primeros términos aportan 5 de los $5{,}0556$: más del 98 % de la
      suma. Y son exactamente los que no importaban nada en el apartado (a).

      ### 6 · Comprobación

      **De la cola**, sumando a mano los primeros términos y viendo que se
      acercan a $\frac{1}{18} \approx 0{,}0556$:

      $$
      \frac{1}{27} \approx 0{,}0370, \qquad
      +\frac{1}{81} \approx 0{,}0494, \qquad
      +\frac{1}{243} \approx 0{,}0535, \qquad
      +\frac{1}{729} \approx 0{,}0549
      $$

      Sube hacia $0{,}0556$ sin pasarse ✔.

      **Del orden de magnitud**: la cola tiene que ser menor que
      $\frac{1}{27}\cdot\frac32 = \frac{1}{18}$ y mayor que su primer término
      $\frac{1}{27}$. Y $0{,}037 < 0{,}0556$ ✔. Si hubiera salido una cola mayor
      que $\frac{1}{27}\cdot 2$, habría un error en la razón.

      ### Resultado

      $$
      \boxed{\;\text{(a) converge, } \lim a_n = 0
      \qquad
      \text{(b) converge, } \sum_{n=1}^{\infty} a_n = \frac{91}{18}\;}
      $$
