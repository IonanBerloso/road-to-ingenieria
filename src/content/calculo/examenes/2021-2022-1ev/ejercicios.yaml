        consigna: |
          Dibuja el lugar geométrico con el valor de $w$ ya calculado: la
          circunferencia, su centro, y los dos puntos $1$ y $w$.
        comprueba:
          - punto: |
              Los dos puntos $z=1$ y $w=i$, marcados.
            porque: |
              Son los focos del cociente de distancias. Y $w=i$ es el resultado
              del ejercicio: si en tu dibujo está en otro sitio, el área no
              saldrá $4\pi$.
          - punto: |
              La circunferencia de centro $\left(-1,2\right)$ y radio $2$.
            porque: |
              Área $4\pi$ significa radio $2$, y completando cuadrados el radio
              al cuadrado sale $2+2b^{2}$: de ahí $b=1$. El dibujo y la condición
              del área son la misma cosa.
          - punto: |
              Que el punto $w=i$ queda **dentro** de la circunferencia y $z=1$
              fuera.
            porque: |
              Con razón mayor que $1$, el lugar rodea al punto del denominador.
              Comprobarlo en el dibujo verifica el sentido de la desigualdad.
          - punto: |
              El radio dibujado a escala, comparable con la distancia entre $1$ e
              $i$, que es $\sqrt2\approx1{,}41$.
            porque: |
              El radio $2$ es mayor que esa distancia, y por eso la
              circunferencia envuelve holgadamente a $i$ sin llegar a tocar a
              $1$… salvo que se compruebe: $\lvert1-(-1+2i)\rvert=\sqrt{8}>2$, así
              que $1$ queda fuera ✔.
        veredicto: |
          El ejercicio invierte el planteamiento habitual: en vez de dar los
          datos y pedir la circunferencia, da el área y pide el dato. Dibujar la
          circunferencia final es la comprobación de que el despeje se ha hecho
          bien.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** $w$ imaginario puro positivo. El lugar de los $z$ con
      $\left|\frac{z-1}{z-w}\right| = \sqrt2$ tiene que encerrar un área de
      $4\pi$.

      **Reparto de puntos del examen:** COMP1 1 · COMP2 7 · COMP4 2.

      ### 1 · Reconocer la figura antes de calcular

      La condición fija el **cociente de las distancias** del afijo de $z$ a dos
      puntos: al $1$ y al $w$. El lugar de los puntos cuyo cociente de
      distancias a dos puntos fijos es constante y distinta de 1 es la
      **circunferencia de Apolonio**.

      Saberlo de entrada vale el punto de COMP1 y encamina todo lo demás: como
      la figura es una circunferencia, la condición del área es una condición
      sobre el radio.

      $$
      \pi r^{2} = 4\pi \;\Longrightarrow\; r = 2
      $$

      Conviene decir también por qué **no** puede ser una recta: la mediatriz
      aparece cuando el cociente vale exactamente 1, porque entonces los
      términos cuadráticos se cancelan. Con $\sqrt2$ no se cancelan.

      ### 2 · La ecuación del lugar

      Con $w = bi$ ($b>0$) y $z = x+iy$. Los dos miembros de
      $\left|z-1\right| = \sqrt2\,\left|z-bi\right|$ son no negativos, así que
      elevar al cuadrado es equivalente:

      $$
      (x-1)^{2}+y^{2} = 2\left[x^{2}+(y-b)^{2}\right]
      $$

      $$
      x^{2}-2x+1+y^{2} = 2x^{2}+2y^{2}-4by+2b^{2}
      $$

      Pasando todo a un lado:

      $$
      0 = x^{2}+2x+y^{2}-4by+2b^{2}-1
      $$

      Completando cuadrados,
      $x^{2}+2x = (x+1)^{2}-1$ y $y^{2}-4by = (y-2b)^{2}-4b^{2}$:

      $$
      (x+1)^{2}-1+(y-2b)^{2}-4b^{2}+2b^{2}-1 = 0
      $$

      $$
      \boxed{\;(x+1)^{2}+(y-2b)^{2} = 2+2b^{2}\;}
      $$

      Centro $(-1,\,2b)$ y radio $\sqrt{2+2b^{2}}$.

      Antes de seguir, una comprobación de coherencia que sale gratis: el radio
      al cuadrado, $2+2b^{2}$, es **siempre positivo**, así que la figura existe
      para cualquier $b$. Si hubiera salido algo que pudiera ser negativo,
      habría que discutir los casos.

      ### 3 · Imponer el área

      $$
      \pi\left(2+2b^{2}\right) = 4\pi
      \;\Longrightarrow\;
      2+2b^{2} = 4
      \;\Longrightarrow\;
      b^{2} = 1
      \;\Longrightarrow\;
      b = \pm 1
      $$

      El enunciado dice **imaginario puro positivo**, así que se descarta
      $b=-1$:

      $$
      \boxed{\;w = i\;}
      $$

      Ese adjetivo no es decorativo: sin él habría dos soluciones, $w = i$ y
      $w = -i$, con circunferencias simétricas respecto del eje real.

      ### 4 · El lugar geométrico

      Sustituyendo $b=1$:

      $$
      (x+1)^{2}+(y-2)^{2} = 4
      $$

      **Circunferencia de centro $-1+2i$ y radio 2.**

      ### 5 · Representación gráfica

      Una circunferencia que pasa por $(-3,2)$, $(1,2)$, $(-1,0)$ y $(-1,4)$:
      es tangente al eje real en el punto $(-1,0)$, porque su centro está a
      distancia 2 de ese eje y el radio también vale 2.

      Conviene marcar los dos puntos de referencia, $1$ y $w=i$. Los dos quedan
      **fuera del centro** y alineados con él, que es como funciona siempre una
      circunferencia de Apolonio.

      ### 6 · Comprobación

      Se toma un punto de la circunferencia y se comprueba la condición
      original. El más cómodo es $z = -1$, o sea $(-1,0)$, que está en ella
      porque $0+(0-2)^{2} = 4$ ✔:

      $$
      \left|z-1\right| = \left|-2\right| = 2,
      \qquad
      \left|z-i\right| = \left|-1-i\right| = \sqrt2
      $$

      $$
      \frac{2}{\sqrt2} = \sqrt2 \quad\checkmark
      $$

      Y otro por si acaso, $z = 1+2i$, que también está en la circunferencia
      —$(1+1)^{2}+0 = 4$ ✔—:

      $$
      \left|z-1\right| = \left|2i\right| = 2,
      \qquad
      \left|z-i\right| = \left|1+i\right| = \sqrt2,
      \qquad
      \frac{2}{\sqrt2} = \sqrt2 \quad\checkmark
      $$

      Y el área: $\pi\cdot 2^{2} = 4\pi$ ✔, que es lo que pedía el enunciado.

      ### Resultado

      $$
      \boxed{\;w = i;\qquad (x+1)^{2}+(y-2)^{2} = 4\;}
      $$

  - id: ex2122-2-quinta-con-conjugado
    titulo: Una quinta potencia, un conjugado y el cero que se pierde
    fuente: >-
      Ejercicio 2 · Primera evaluación, 18 de octubre de 2021 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    nivel: examen
    enunciado: |
      Resolver la ecuación

      $$
      i\,z^{5}\,\overline{z} = -\left|z\right|,
      \qquad z \in \mathbb{C}
      $$

      y representar gráficamente la solución.
    pide: Resolver la ecuación y representar las soluciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          La incógnita aparece en los dos miembros y en uno va conjugada. ¿Por
          dónde se entra?
        opciones:
          - texto: >-
              Tomando **módulos**, que convierte la ecuación compleja en una
              real
            correcta: true
            mensaje: |
              Eso es. No es del tipo $z^{n}=w$ con $w$ conocido, así que la
              fórmula de las raíces no se aplica directamente. Tomar módulos da
              $\left|z\right|^{6} = \left|z\right|$, que se resuelve en dos
              líneas y deja solo dos casos.
          - texto: Escribiendo $z = x+iy$ y separando parte real e imaginaria
            mensaje: |
              Se puede, pero sale un sistema de dos ecuaciones polinómicas de
              grado 6 en dos variables. En forma polar la potencia multiplica
              el argumento y el conjugado lo cambia de signo: todo se
              simplifica de golpe.
          - texto: Dividiendo los dos miembros entre $z$
            mensaje: |
              Ahí está la trampa del ejercicio: dividir entre $z$ **pierde la
              solución $z=0$**, que es una solución de verdad. Nunca se divide
              entre algo que puede ser cero sin discutir el caso aparte.
          - texto: Aplicando la fórmula de las raíces sextas
            mensaje: |
              La ecuación no tiene la forma $z^{6} = w$. Hay un conjugado por
              medio, y el segundo miembro depende de la propia incógnita.

      - tipo: calcular
        titulo: Cuántas soluciones hay
        pregunta: |
          ¿Cuántos números complejos cumplen la ecuación?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              Cuatro son las de módulo 1. Falta $z=0$, que también cumple la
              ecuación: $i\cdot0\cdot0 = 0 = -\left|0\right|$. Es la que se
              pierde al dividir entre $z$.
          - valor: '6'
            mensaje: |
              Seis saldrían si la ecuación fuera $z^{6} = w$ con $w \neq 0$.
              Aquí el conjugado baja el grado efectivo: $z^{5}\overline z$ tiene
              argumento $4\theta$, no $6\theta$.
          - valor: '1'
            mensaje: |
              Solo el 0 no basta: hay además cuatro soluciones sobre la
              circunferencia unidad.
        pista: |
          Toma módulos primero. Salen dos casos, y el de módulo 1 aporta varias.
        desarrollo: |
          **Módulos.** Usando $\left|i\right| = 1$ y
          $\left|\overline z\right| = \left|z\right|$:

          $$
          \left|z\right|^{5}\left|z\right| = \left|z\right|
          \;\Longleftrightarrow\;
          \left|z\right|^{6} = \left|z\right|
          \;\Longleftrightarrow\;
          \left|z\right|\left(\left|z\right|^{5}-1\right) = 0
          $$

          Dos casos: $\left|z\right| = 0$ y $\left|z\right| = 1$.

          **Caso $\left|z\right|=0$:** $z=0$, que cumple la ecuación. **Una.**

          **Caso $\left|z\right|=1$:** con $z = e^{i\theta}$,

          $$
          i\,e^{5i\theta}e^{-i\theta} = e^{i\left(90^{\circ}+4\theta\right)}
          = -1 = e^{i\,180^{\circ}}
          $$

          $$
          4\theta = 90^{\circ}+360^{\circ}k
          \;\Longrightarrow\;
          \theta = 22{,}5^{\circ}+90^{\circ}k
          $$

          Con $k=0,1,2,3$ salen cuatro ángulos distintos. **Cuatro.**

          En total, **cinco**.
        veredicto: |
          El 0 es la solución que se pierde siempre, y aquí vale un quinto del
          resultado. Es el mismo caso de los ejercicios 1.10 y 1.13 del boletín.

      - tipo: calcular
        titulo: El menor argumento positivo
        pregunta: |
          De las soluciones de módulo 1, ¿cuál es el menor argumento en grados?
        respuesta:
          tipo: numero
          valor: '22.5'
          tolerancia: 0.1
          formato: un número de grados
        distractores:
          - valor: '90'
            mensaje: |
              $90^{\circ}$ es el argumento del $i$ que multiplica, no el de la
              solución. Hay que despejarlo de
              $90^{\circ}+4\theta \equiv 180^{\circ}$.
          - valor: '45'
            mensaje: |
              $45^{\circ}$ saldría de dividir $180^{\circ}$ entre 4 sin restar
              antes los $90^{\circ}$ que aporta el $i$. La cuenta es
              $\frac{180-90}{4} = 22{,}5$.
          - valor: '18'
            mensaje: |
              18 sale de dividir $90^{\circ}$ entre 5, como si el exponente
              efectivo fuera 5. Pero el conjugado resta uno: el argumento va
              multiplicado por $5-1 = 4$.
        pista: |
          $z^{5}\overline z$ tiene argumento $5\theta-\theta = 4\theta$. Y el
          $i$ suma $90^{\circ}$.
        desarrollo: |
          Con $z = e^{i\theta}$ de módulo 1:

          $$
          z^{5}\overline z = e^{5i\theta}\cdot e^{-i\theta} = e^{4i\theta}
          $$

          El conjugado **resta** su argumento, así que el exponente efectivo es
          $5-1 = 4$ y no 6. Multiplicando por $i = e^{i90^{\circ}}$ e igualando
          a $-1 = e^{i180^{\circ}}$:

          $$
          90^{\circ}+4\theta = 180^{\circ}+360^{\circ}k
          \;\Longrightarrow\;
          \theta = 22{,}5^{\circ}+90^{\circ}k
          $$

          $$
          \theta \in \left\{22{,}5^{\circ},\; 112{,}5^{\circ},\;
          202{,}5^{\circ},\; 292{,}5^{\circ}\right\}
          $$
        veredicto: |
          Separados $90^{\circ}$: los cuatro afijos son los vértices de un
          cuadrado inscrito en la circunferencia unidad.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Tomando módulos, y como $\left|i\right|=1$ y
              $\left|\overline z\right| = \left|z\right|$, queda
              $\left|z\right|^{6} = \left|z\right|$.
          - texto: |
              Factorizando,
              $\left|z\right|\left(\left|z\right|^{5}-1\right) = 0$: o
              $\left|z\right| = 0$ o $\left|z\right| = 1$. **No se divide entre
              $\left|z\right|$**, que perdería el primer caso.
          - texto: |
              **Caso $z=0$:** cumple, porque $i\cdot0\cdot0 = 0 = -\left|0\right|$.
          - texto: |
              **Caso $\left|z\right|=1$:** con $z=e^{i\theta}$,
              $z^{5}\overline z = e^{4i\theta}$, y la ecuación da
              $\theta = 22{,}5^{\circ}+90^{\circ}k$.
          - texto: |
              Cinco soluciones: el origen y los cuatro vértices de un cuadrado
              inscrito en la circunferencia unidad.
          - texto: |
              Como la ecuación tiene grado 6, hay exactamente seis soluciones
              por el teorema fundamental del álgebra.
            trampa: true
            mensaje: |
              El teorema fundamental del álgebra habla de **polinomios**, y esto
              no lo es: aparece $\overline z$, que no es una función polinómica
              de $z$. Contar soluciones por el grado aparente lleva a buscar una
              sexta que no existe. Aquí hay cinco, y salen de discutir los dos
              casos del módulo.
        veredicto: |
          Fíjate en la asimetría del resultado: cuatro soluciones repartidas en
          círculo y una en el centro. No es un conjunto de raíces $n$-ésimas,
          aunque se le parezca.

      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 340 265" role="img" width="340" height="265"
               aria-labelledby="f-ex2122-quinta-t f-ex2122-quinta-d">
