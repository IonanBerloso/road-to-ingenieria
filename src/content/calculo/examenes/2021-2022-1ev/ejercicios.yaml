        consigna: |
          Dibuja los afijos de todas las soluciones en el plano complejo, con la
          circunferencia unidad de referencia.
        comprueba:
          - punto: |
              **Cinco** puntos: el origen y cuatro sobre la circunferencia
              unidad.
            porque: |
              De $\lvert z\rvert^{6}=\lvert z\rvert$ salen $\lvert z\rvert=0$ y
              $\lvert z\rvert=1$. El cero es el que se pierde al pasar a polar, y
              el título del ejercicio lo avisa.
          - punto: |
              Los cuatro de módulo $1$ separados $90^\circ$.
            porque: |
              La ecuación de argumentos queda en $4\theta$, así que hay cuatro
              soluciones repartidas en cuartos de vuelta.
          - punto: |
              El primero en $\theta=\tfrac\pi8=22{,}5^\circ$, no en $0^\circ$.
            porque: |
              De $4\theta=\tfrac\pi2+2k\pi$. Ese desfase de $22{,}5^\circ$ es lo
              que hace que el cuadrado que forman esté girado respecto de los
              ejes.
          - punto: |
              El cuadrado que forman los cuatro, girado $22{,}5^\circ$.
            porque: |
              Cuatro puntos a $90^\circ$ sobre una circunferencia son un
              cuadrado. Si el tuyo tiene los vértices sobre los ejes, el desfase
              se ha perdido.
        veredicto: |
          El grado aparente es $6$ y las soluciones sobre la circunferencia son
          $4$: el conjugado resta al argumento en vez de sumarle. El número de
          soluciones lo decide la ecuación de **ángulos**, no la de módulos.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** Resolver $i\,z^{5}\,\overline z = -\left|z\right|$ en
      $\mathbb{C}$ y representar las soluciones.

      **Reparto de puntos del examen:** COMP1 1 · COMP2 7 · COMP4 2.

      ### 1 · Por qué no vale la fórmula de las raíces

      La incógnita aparece en los dos miembros —a la derecha dentro de un
      módulo— y en uno de ellos conjugada. No es una ecuación del tipo
      $z^{n} = w$ con $w$ conocido, así que la fórmula de las raíces
      $n$-ésimas no se aplica directamente.

      La entrada natural es **tomar módulos**, que convierte una ecuación
      compleja en una ecuación real.

      ### 2 · Los módulos posibles

      Usando $\left|i\right| = 1$, $\left|z^{5}\right| = \left|z\right|^{5}$ y
      $\left|\overline z\right| = \left|z\right|$:

      $$
      \left|z\right|^{5}\cdot\left|z\right| = \left|z\right|
      \;\Longleftrightarrow\;
      \left|z\right|^{6} = \left|z\right|
      \;\Longleftrightarrow\;
      \left|z\right|\left(\left|z\right|^{5}-1\right) = 0
      $$

      Como el módulo no es negativo, solo hay dos posibilidades:

      $$
      \left|z\right| = 0 \qquad\text{o}\qquad \left|z\right| = 1
      $$

      **Aquí está la trampa del ejercicio: no se puede dividir entre
      $\left|z\right|$.** Hacerlo elimina el caso $\left|z\right|=0$, que es una
      solución de verdad. Cuando un factor común puede anularse, se factoriza y
      se discuten los casos; no se cancela.

      ### 3 · Caso $\left|z\right| = 0$

      Es inmediato: $z = 0$. Y cumple la ecuación,

      $$
      i\cdot 0^{5}\cdot\overline{0} = 0 = -\left|0\right| \quad\checkmark
      $$

      ### 4 · Caso $\left|z\right| = 1$

      Con $z = e^{i\theta}$, el conjugado es $\overline z = e^{-i\theta}$, así
      que

      $$
      z^{5}\,\overline z = e^{5i\theta}\cdot e^{-i\theta} = e^{4i\theta}
      $$

      El conjugado **resta** su argumento: el exponente efectivo es $5-1 = 4$, y
      no 6 como sugiere contar los factores. Multiplicando por
      $i = e^{i\,90^{\circ}}$, el primer miembro es
      $e^{i\left(90^{\circ}+4\theta\right)}$.

      El segundo miembro, en este caso, vale $-\left|z\right| = -1 =
      e^{i\,180^{\circ}}$.

      Dos complejos de módulo 1 son iguales cuando sus argumentos coinciden
      salvo vueltas enteras:

      $$
      90^{\circ}+4\theta = 180^{\circ}+360^{\circ}k
      \;\Longrightarrow\;
      4\theta = 90^{\circ}+360^{\circ}k
      \;\Longrightarrow\;
      \theta = 22{,}5^{\circ}+90^{\circ}k
      $$

      Con $k = 0,1,2,3$:

      $$
      \theta \in \left\{22{,}5^{\circ},\; 112{,}5^{\circ},\; 202{,}5^{\circ},\;
      292{,}5^{\circ}\right\}
      $$

      A partir de $k=4$ los ángulos se repiten módulo $360^{\circ}$: no hay más
      soluciones distintas.

      ### 5 · Representación gráfica

      **Cinco afijos**: el **origen**, y cuatro puntos sobre la circunferencia
      unidad separados $90^{\circ}$, es decir los vértices de un **cuadrado**
      con el primero a $22{,}5^{\circ}$ —justo a mitad de camino entre el eje
      real y la bisectriz del primer cuadrante—.

      Conviene marcar el origen con un punto grueso y decir en el dibujo que
      también es solución: es la parte que se pierde.

      ### 6 · Comprobación

      **Con $z = e^{i\,22{,}5^{\circ}}$:**

      $$
      z^{5}\overline z = e^{i\,4\cdot22{,}5^{\circ}} = e^{i\,90^{\circ}} = i
      $$

      $$
      i\cdot i = i^{2} = -1 = -\left|z\right| \quad\checkmark
      $$

      **Con $z = e^{i\,112{,}5^{\circ}}$:**
      $4\cdot112{,}5 = 450 \equiv 90^{\circ}$, y sale lo mismo ✔

      **Con $z=0$:** los dos miembros valen 0 ✔

      **Y una que NO debe cumplirla**, para ver que el conjunto no es más
      grande: $z = 1$. Entonces
      $i\cdot1\cdot1 = i \neq -1$ ✗, y en efecto $0^{\circ}$ no está entre los
      cuatro ángulos.

      ### Resultado

      $$
      \boxed{\;z = 0 \quad\text{y}\quad
      z = e^{i\left(22{,}5^{\circ}+90^{\circ}k\right)},\; k=0,1,2,3\;}
      $$

  - id: ex2122-3-sucesion-compleja-tres-partes
    titulo: Una sucesión compleja mirada por tres ventanas
    fuente: >-
      Ejercicio 3 · Primera evaluación, 18 de octubre de 2021 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 2
      comp4: 7

    nivel: examen
    enunciado: |
      Sea la sucesión de números complejos

      $$
      \{z_n\}_{n\in\mathbb{N}} =
      \left\{\frac{1}{n}\,e^{\frac{n\pi}{2}i}\right\}_{n\in\mathbb{N}}
      $$

      Estudiar, utilizando definiciones formales, el crecimiento, decrecimiento
      y acotación de las sucesiones $\{\left|z_n\right|\}_{n\in\mathbb{N}}$,
      $\{\arg(z_n)\}_{n\in\mathbb{N}}$ e
      $\{\operatorname{Im}(z_n)\}_{n\in\mathbb{N}}$.
    pide: Estudiar las tres sucesiones reales asociadas.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el enunciado pide estudiar tres sucesiones **reales** en vez
          de $\{z_n\}$ directamente?
        opciones:
          - texto: >-
              Porque «creciente» y «acotada» son conceptos de **orden**, y en
              $\mathbb{C}$ no hay orden
            correcta: true
            mensaje: |
              Exacto, y decirlo vale puntos de COMP4. No tiene sentido preguntar
              si una sucesión de complejos es creciente. Lo que sí se puede
              estudiar son sucesiones reales asociadas: el módulo, el argumento
              y la parte imaginaria.
          - texto: Porque $\{z_n\}$ no converge
            mensaje: |
              Sí converge: $\left|z_n\right| = \frac1n \to 0$, y una sucesión
              compleja cuyo módulo tiende a cero tiende a cero. El problema no
              es la convergencia, es que «creciente» no significa nada en
              $\mathbb{C}$.
          - texto: Porque así el ejercicio es más largo
            mensaje: |
              Cada una de las tres se comporta de forma distinta, y ahí está el
              contenido: una decrece, otra es periódica y la tercera alterna de
              signo. No es repetir tres veces lo mismo.
          - texto: Porque el módulo determina las otras dos
            mensaje: |
              No las determina: dos complejos con el mismo módulo pueden tener
              argumentos y partes imaginarias completamente distintos. Las tres
              ventanas son independientes.

      - tipo: calcular
        titulo: El mayor valor de la parte imaginaria
        pregunta: |
          ¿Cuál es el mayor valor que toma $\operatorname{Im}(z_n)$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0.2'
            mensaje: |
              $\frac15 = \operatorname{Im}(z_5)$ es el segundo valor positivo
              más grande. El mayor está antes: en $n=1$, donde vale 1.
          - valor: '0'
            mensaje: |
              0 es el valor en los índices pares y también el límite, pero no el
              máximo: en $n=1$ la parte imaginaria vale 1.
          - valor: '0.333'
            mensaje: |
              $\frac13$ es el **valor absoluto** de $\operatorname{Im}(z_3)$,
              que vale $-\frac13$. Es el mínimo en valor absoluto de los
              negativos, no el máximo.
        pista: |
          $\operatorname{Im}(z_n) = \frac1n\,\mathrm{sen}\frac{n\pi}{2}$.
          Calcula los cinco primeros.
        desarrollo: |
          $$
          \operatorname{Im}(z_n) = \frac{1}{n}\,\mathrm{sen}\!\left(\frac{n\pi}{2}\right)
          $$

          El seno vale $1, 0, -1, 0$ y se repite:

          | $n$ | 1 | 2 | 3 | 4 | 5 | 6 | 7 |
          |---|---|---|---|---|---|---|---|
          | $\mathrm{sen}\frac{n\pi}{2}$ | $1$ | $0$ | $-1$ | $0$ | $1$ | $0$ | $-1$ |
          | $\operatorname{Im}(z_n)$ | $1$ | $0$ | $-\frac13$ | $0$ | $\frac15$ | $0$ | $-\frac17$ |

          El mayor es $\operatorname{Im}(z_1) = 1$, y se alcanza: es **máximo**.
          El menor es $-\frac13$, también alcanzado.
        veredicto: |
          Los valores positivos decrecen y los negativos crecen: todo se estruja
          hacia 0. Pero no de forma monótona, porque van alternando.

      - tipo: justificar
        pregunta: |
          Ordena el estudio de las tres sucesiones. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **Módulo.** $\left|z_n\right| = \frac1n$, porque
              $\left|e^{i\alpha}\right| = 1$ para todo $\alpha$ real.
              Es **estrictamente decreciente** —$\frac{1}{n+1} < \frac1n$ para
              todo $n$— y **acotada**: $0 < \left|z_n\right| \le 1$.
          - texto: |
              **Argumento.** $\arg(z_n) = \frac{n\pi}{2}$ reducido a su
              determinación principal, y recorre $\frac{\pi}{2},\ \pi,\
              -\frac{\pi}{2},\ 0$ repitiéndose con **periodo 4**.
          - texto: |
              Por tanto el argumento **no es creciente ni decreciente**
              —$\arg z_1 < \arg z_2$ pero $\arg z_2 > \arg z_3$— y sí es
              **acotado**, porque solo toma cuatro valores.
          - texto: |
              **Parte imaginaria.**
              $\operatorname{Im}(z_n) = \frac1n\mathrm{sen}\frac{n\pi}{2}$ toma
              los valores $1,\ 0,\ -\frac13,\ 0,\ \frac15,\ 0,\ -\frac17,\dots$
          - texto: |
              Tampoco es monótona —alterna de signo— y está acotada:
              $-\frac13 \le \operatorname{Im}(z_n) \le 1$, alcanzando las dos
              cotas.
          - texto: |
              Como $\left|z_n\right|$ es decreciente, las otras dos también lo
              son.
            trampa: true
            mensaje: |
              El módulo no arrastra a las demás. El argumento es periódico y no
              decrece nunca de forma sostenida, y la parte imaginaria alterna de
              signo: $\operatorname{Im}(z_3) = -\frac13$ es **menor** que
              $\operatorname{Im}(z_5) = \frac15$. Que el tamaño encoja no obliga
              a que las coordenadas lo hagan de forma ordenada.
        veredicto: |
          Tres ventanas sobre la misma sucesión y tres respuestas distintas. Esa
          es la razón de ser del ejercicio.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** $z_n = \frac{1}{n}e^{\frac{n\pi}{2}i}$. Se pide estudiar
      crecimiento, decrecimiento y acotación de $\left|z_n\right|$,
      $\arg(z_n)$ e $\operatorname{Im}(z_n)$, **con definiciones formales**.

      **Reparto de puntos del examen:** COMP1 1 · COMP2 2 · COMP4 7. Siete de
      diez son la explicación: el enunciado pide expresamente «utilizando
      definiciones formales», así que enunciarlas es parte de la respuesta.

      ### 1 · Por qué el enunciado desvía a tres sucesiones reales

      Merece la pena empezar por aquí. **En $\mathbb{C}$ no hay un orden**
      compatible con las operaciones, así que preguntar si $\{z_n\}$ es
      creciente no significa nada. Lo que sí tiene sentido es estudiar
      sucesiones **reales** asociadas, y el enunciado elige tres: el tamaño, la
      dirección y una coordenada.

      Las definiciones que se van a usar:

      $$
      \{a_n\} \text{ creciente} \iff a_{n+1} > a_n \;\; \forall n
      $$

      $$
      \{a_n\} \text{ decreciente} \iff a_{n+1} < a_n \;\; \forall n
      $$

      $$
      \{a_n\} \text{ acotada} \iff \exists\, p,q \in \mathbb{R} :
      p \le a_n \le q \;\; \forall n
      $$

      ### 2 · El módulo

      $$
      \left|z_n\right| = \left|\frac1n\right|\cdot
      \left|e^{\frac{n\pi}{2}i}\right| = \frac1n \cdot 1 = \frac{1}{n}
      $$

      porque una exponencial de exponente imaginario puro tiene módulo 1.

      **Decreciente**, y se prueba con la definición:

      $$
      \left|z_{n+1}\right|-\left|z_n\right| = \frac{1}{n+1}-\frac1n
      = \frac{n-(n+1)}{n(n+1)} = \frac{-1}{n(n+1)} < 0
      \quad \forall n \in \mathbb{N}
      $$

      **No creciente**, por lo mismo. **Acotada**:

      $$
      0 < \frac1n \le 1 \qquad \forall n \in \mathbb{N}
      $$

      El 1 es máximo, alcanzado en $n=1$; el 0 es ínfimo pero **no mínimo**,
      porque no se alcanza nunca.

      ### 3 · El argumento

      $$
      \arg(z_n) = \frac{n\pi}{2} \pmod{2\pi}
      $$

      Como $\frac{n\pi}{2}$ avanza un cuarto de vuelta cada vez, el argumento
      **es periódico de periodo 4**:

      | $n$ | 1 | 2 | 3 | 4 | 5 | 6 | … |
      |---|---|---|---|---|---|---|---|
      | $\arg(z_n)$ | $\frac{\pi}{2}$ | $\pi$ | $-\frac{\pi}{2}$ | $0$ | $\frac{\pi}{2}$ | $\pi$ | … |

      —tomando la determinación principal en $(-\pi,\pi]$—.

      **No es creciente:** $\arg z_2 = \pi > -\frac{\pi}{2} = \arg z_3$.
      **No es decreciente:** $\arg z_1 = \frac{\pi}{2} < \pi = \arg z_2$.
      Basta un par de cada tipo.

      **Es acotada**, y de la forma más rotunda: solo toma **cuatro** valores
      distintos, así que

      $$
      -\frac{\pi}{2} \le \arg(z_n) \le \pi \qquad \forall n
      $$

      Conviene advertir que la respuesta depende del convenio: si el argumento
      se toma en $[0,2\pi)$, los valores son
      $\frac{\pi}{2},\ \pi,\ \frac{3\pi}{2},\ 0$ y las cotas cambian. Lo que no
      cambia es la conclusión: periódica, no monótona y acotada.

      ### 4 · La parte imaginaria

      $$
      \operatorname{Im}(z_n) = \frac{1}{n}\,\mathrm{sen}\!\left(\frac{n\pi}{2}\right)
      $$

      El seno recorre $1, 0, -1, 0$ y vuelve a empezar, así que

      $$
      1,\quad 0,\quad -\frac13,\quad 0,\quad \frac15,\quad 0,\quad
      -\frac17,\quad 0,\quad \frac19,\;\dots
      $$

      **No es creciente:** $\operatorname{Im}(z_1) = 1 > 0 = \operatorname{Im}(z_2)$.
      **No es decreciente:** $\operatorname{Im}(z_3) = -\frac13 < 0 =
      \operatorname{Im}(z_4)$.

      **Es acotada:**

      $$
      -\frac13 \le \operatorname{Im}(z_n) \le 1 \qquad \forall n
      $$

      Las dos cotas se alcanzan —en $n=3$ y en $n=1$—, así que son mínimo y
      máximo. Y como
      $\left|\operatorname{Im}(z_n)\right| \le \frac1n \to 0$, la sucesión
      converge a 0 aunque no lo haga de forma ordenada.

      ### 5 · Lo que enseñan las tres juntas

      La misma sucesión, vista de tres maneras, da tres respuestas distintas:

      | | monotonía | acotación |
      |---|---|---|
      | $\lvert z_n\rvert$ | decreciente | sí, $(0,1]$ |
      | $\arg(z_n)$ | ninguna, periódica | sí, cuatro valores |
      | $\operatorname{Im}(z_n)$ | ninguna, alterna | sí, $[-\frac13,1]$ |

      **Que el módulo decrezca no obliga a las coordenadas a hacerlo.** El afijo
      va acercándose al origen en espiral, y en esa espiral la parte imaginaria
      sube y baja mientras la distancia al origen no deja de encogerse. Es la
      idea que el ejercicio quiere dejar clara.

      ### 6 · Comprobación

      Los cinco primeros afijos, en binómica:

      $$
      z_1 = i, \quad z_2 = -\frac12, \quad z_3 = -\frac13 i, \quad
      z_4 = \frac14, \quad z_5 = \frac15 i
      $$

      Se ve la espiral: arriba, izquierda, abajo, derecha, arriba… cada vez más
      cerca del origen. Los módulos $1, \frac12, \frac13, \frac14, \frac15$
      bajan siempre ✔, y las partes imaginarias $1, 0, -\frac13, 0, \frac15$
      ni suben ni bajan de forma sostenida ✔.

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \left|z_n\right| &= \tfrac1n:\ \text{decreciente y acotada } (0,1] \\
      \arg(z_n) &:\ \text{periódica de periodo 4, no monótona, acotada} \\
      \operatorname{Im}(z_n) &:\ \text{alternada, no monótona, acotada }
      \left[-\tfrac13,1\right]
      \end{aligned}}
      $$

  - id: ex2122-4-geometrica-alternada
    titulo: Una geométrica de razón negativa
    fuente: >-
      Ejercicio 4 · Primera evaluación, 18 de octubre de 2021 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3

    nivel: examen
    enunciado: |
      **a)** Estudiar la convergencia de la serie

      $$
      S = 5-\frac{10}{3}+\frac{20}{9}-\frac{40}{27}+\dots
      $$

      **b)** En caso de convergencia de la serie, obtener la suma de la misma.
    pide: Estudiar la convergencia y calcular la suma.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se identifica de qué tipo es una serie dada por sus primeros
          términos?
        opciones:
          - texto: >-
              Dividiendo cada término entre el anterior: si el cociente es
              **constante**, es geométrica
            correcta: true
            mensaje: |
              Eso es. Aquí
              $\frac{-10/3}{5} = -\frac23$ y
              $\frac{20/9}{-10/3} = -\frac23$: constante. Es geométrica de razón
              $-\frac23$, y con eso ya está todo decidido.
          - texto: Restando cada término del anterior
            mensaje: |
              Eso detecta una progresión **aritmética**, donde lo constante es
              la diferencia. Aquí las diferencias no son constantes:
              $-\frac{10}{3}-5 = -\frac{25}{3}$ y
              $\frac{20}{9}+\frac{10}{3} = \frac{50}{9}$.
          - texto: Mirando si los signos alternan
            mensaje: |
              Que alternen es un dato, pero no dice de qué tipo es la serie ni
              si converge: $\sum\frac{(-1)^{n}}{n}$ y $\sum(-1)^{n}$ alternan
              las dos, y una converge y la otra no.
          - texto: Comprobando si los términos tienden a cero
            mensaje: |
              Eso es la condición necesaria, y sirve para descartar. Pero no
              identifica el tipo de serie ni permite sumarla.

      - tipo: calcular
        titulo: La razón
        pregunta: |
          ¿Cuál es la razón de la serie?
        respuesta:
          tipo: numero
          valor: '-0.6666667'
          tolerancia: 0.0005
          formato: un número, o una fracción como -2/3
        distractores:
          - valor: '0.6666667'
            mensaje: |
              El valor absoluto es correcto, pero falta el signo. Los términos
              **alternan**, así que la razón es negativa: $-\frac23$.
          - valor: '-1.5'
            mensaje: |
              $-\frac32$ es la razón al revés, dividiendo el anterior entre el
              siguiente. La razón es $\frac{a_{n+1}}{a_n}$, no al contrario. Y
              con $\left|r\right|>1$ la serie no convergería.
          - valor: '-0.3333333'
            mensaje: |
              $-\frac13$ daría los términos $5, -\frac53, \frac59\dots$, y el
              segundo del enunciado es $-\frac{10}{3}$. Prueba a dividir:
              $\frac{-10/3}{5} = -\frac{10}{15} = -\frac23$.
        pista: |
          Divide el segundo término entre el primero y comprueba con el tercero.
        desarrollo: |
          $$
          \frac{-\frac{10}{3}}{5} = -\frac{10}{15} = -\frac{2}{3}
          $$

          $$
          \frac{\frac{20}{9}}{-\frac{10}{3}} = \frac{20}{9}\cdot
          \left(-\frac{3}{10}\right) = -\frac{2}{3}
          $$

          $$
          \frac{-\frac{40}{27}}{\frac{20}{9}} = -\frac{40}{27}\cdot
          \frac{9}{20} = -\frac{2}{3}
          $$

          Constante, así que la serie es **geométrica de razón $r=-\frac23$**.
        veredicto: |
          Conviene comprobarlo con **dos** cocientes, no con uno: un solo
          cociente no distingue una geométrica de una serie cualquiera cuyos dos
          primeros términos casen por casualidad.

      - tipo: calcular
        titulo: La suma
        pregunta: |
          ¿Cuánto vale $S$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '15'
            mensaje: |
              15 sale de $\frac{5}{1-\frac23}$, es decir usando
              $r = +\frac23$ en vez de $-\frac23$. El signo de la razón cambia
              el denominador de $\frac13$ a $\frac53$.
          - valor: '1.6666667'
            mensaje: |
              $\frac53$ es el denominador $1-r = 1+\frac23$, no la suma. Falta
              dividir el primer término entre él.
          - valor: '8.3333333'
            mensaje: |
              Parece $5\cdot\frac53$: has multiplicado por $1-r$ en vez de
              dividir.
        pista: |
          $S = \frac{a_1}{1-r}$, con $a_1 = 5$ y $r = -\frac23$. Ojo al signo
          en el denominador.
        desarrollo: |
          $$
          S = \frac{a_1}{1-r} = \frac{5}{1-\left(-\frac23\right)}
            = \frac{5}{1+\frac23}
            = \frac{5}{\frac53}
            = 3
          $$

          El signo menos de la razón se convierte en un **más** en el
          denominador. Es el error más frecuente del ejercicio.
        veredicto: |
          Comprobación de sentido común: la serie alterna y su primer término es
          5, así que la suma tiene que quedar **por debajo** de 5 y por encima
          de $5-\frac{10}{3} = 1{,}67$. Y 3 lo cumple.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              El cociente entre términos consecutivos es constante e igual a
              $-\frac23$: la serie es **geométrica**.
          - texto: |
              Una geométrica converge **si y solo si** $\left|r\right|<1$. Aquí
              $\left|-\frac23\right| = \frac23 < 1$, luego converge.
          - texto: |
              Su suma es $\dfrac{a_1}{1-r}$ con $a_1 = 5$.
          - texto: |
              $S = \dfrac{5}{1+\frac23} = \dfrac{5}{\frac53} = 3$.
          - texto: |
              Como la serie es alternada y sus términos tienden a cero, converge
              por el criterio de Leibniz, y eso basta para calcular su suma.
            trampa: true
            mensaje: |
              Leibniz es correcto para justificar que **converge**, pero no
              sirve para **sumarla**: es un criterio de convergencia, no una
              fórmula. Lo que da el valor es reconocerla como geométrica. Y hay
              otro matiz: Leibniz exige que los valores absolutos sean
              decrecientes, cosa que aquí hay que comprobar aparte, mientras que
              el criterio geométrico se ve de un vistazo.
        veredicto: |
          Con la geométrica se resuelven los dos apartados de una vez: la
          convergencia y la suma. Ese es el motivo de identificarla primero.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** $S = 5-\frac{10}{3}+\frac{20}{9}-\frac{40}{27}+\dots$ Se pide
      estudiar la convergencia y, si converge, sumar.

      **Reparto de puntos del examen:** COMP1 1 · COMP2 6 · COMP4 3.

      ### 1 · Identificar la serie

      Cuando una serie se da por sus primeros términos, lo primero es buscar el
      patrón. Se prueba el **cociente** entre consecutivos:

      $$
      \frac{-\frac{10}{3}}{5} = -\frac{2}{3},
      \qquad
      \frac{\frac{20}{9}}{-\frac{10}{3}} = -\frac{2}{3},
      \qquad
      \frac{-\frac{40}{27}}{\frac{20}{9}} = -\frac{2}{3}
      $$

      Constante. La serie es **geométrica** de primer término $a_1 = 5$ y razón

      $$
      r = -\frac{2}{3}
      $$

      Conviene comprobarlo con **dos o tres** cocientes y no con uno solo: dos
      términos cualesquiera siempre tienen un cociente, y eso no los hace
      geométricos.

      El término general, por si hace falta escribirlo:

      $$
      a_n = 5\left(-\frac23\right)^{n-1}, \qquad n \ge 1
      $$

      ### 2 · Apartado (a): la convergencia

      Una serie geométrica converge **si y solo si** $\left|r\right| < 1$. Aquí

      $$
      \left|r\right| = \frac{2}{3} < 1
      $$

      así que **la serie converge**.

      Merece la pena decir por qué el criterio es exacto y no solo suficiente:
      la suma parcial vale

      $$
      S_N = a_1\,\frac{1-r^{N}}{1-r}
      $$

      y todo depende de $r^{N}$. Con $\left|r\right|<1$ tiende a 0 y el límite
      existe; con $\left|r\right|\ge1$ no tiende a 0 y no hay límite. No hay
      zona gris.

      ### 3 · Apartado (b): la suma

      $$
      S = \frac{a_1}{1-r}
        = \frac{5}{1-\left(-\frac{2}{3}\right)}
        = \frac{5}{1+\frac{2}{3}}
        = \frac{5}{\frac{5}{3}}
        = 5\cdot\frac{3}{5}
        = 3
      $$

      **El signo de la razón se cambia al pasar al denominador**, y ahí está el
      error que más se comete: escribir $1-\frac23 = \frac13$ y obtener 15.

      ### 4 · Comprobación

      **Sumando términos a mano**, que además enseña cómo converge una
      alternada:

      | $N$ | 1 | 2 | 3 | 4 | 5 | 6 |
      |---|---|---|---|---|---|---|
      | $S_N$ | $5$ | $1{,}667$ | $3{,}889$ | $2{,}407$ | $3{,}395$ | $2{,}737$ |

      Las sumas parciales van saltando **por encima y por debajo** de 3,
      acercándose cada vez más. Eso es lo típico de una serie alternada
      convergente, y es una comprobación visual muy rápida.

      **De coherencia**: como la serie alterna y empieza en 5 restando
      $\frac{10}{3}$, la suma tiene que estar entre $S_2 = 1{,}67$ y
      $S_1 = 5$. Y 3 lo está ✔. Si hubiera salido 15, esta comprobación lo
      habría cazado al instante.

      ### Resultado

      $$
      \boxed{\;\text{(a) converge, porque } \left|r\right| = \tfrac23 < 1
      \qquad \text{(b) } S = 3\;}
      $$
