ejercicios:
  - id: ex2122-1-apolonio-de-area-dada
    titulo: Una circunferencia de Apolonio con el área impuesta
    fuente: >-
      Ejercicio 1 · Primera evaluación, 18 de octubre de 2021 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    nivel: examen
    enunciado: |
      Sea $w$ un número imaginario puro positivo. Calcular el valor de $w$ para
      que el área encerrada por el lugar geométrico de los afijos de los números
      complejos $z$ que verifican la condición

      $$
      \left|\frac{z-1}{z-w}\right| = \sqrt{2}
      $$

      sea $4\pi$. Dibujar el lugar geométrico obtenido.
    pide: Calcular $w$ y dibujar el lugar geométrico.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué figura es el lugar geométrico, antes de hacer ninguna cuenta?
        opciones:
          - texto: >-
              Una **circunferencia de Apolonio**: el cociente de distancias a
              dos puntos fijos es constante
            correcta: true
            mensaje: |
              Eso es, y saberlo de entrada ahorra la mitad del trabajo: como ya
              sabemos que va a salir una circunferencia, la condición del área
              se traduce en una condición sobre el radio, $\pi r^{2} = 4\pi$, o
              sea $r=2$.
          - texto: Una mediatriz
            mensaje: |
              La mediatriz sale cuando el cociente vale **1**, es decir cuando
              las dos distancias son iguales: ahí los términos cuadráticos se
              cancelan y queda una recta. Con cualquier otra constante sale una
              circunferencia. Y una recta no encierra área, así que el enunciado
              no tendría sentido.
          - texto: Una elipse
            mensaje: |
              La elipse aparece cuando es constante la **suma** de las
              distancias a dos puntos, no el cociente. Aquí hay una división.
          - texto: Una hipérbola
            mensaje: |
              La hipérbola es el lugar donde la **diferencia** de distancias es
              constante. Además no encierra área finita, así que el enunciado la
              descarta sola.

      - tipo: calcular
        titulo: El parámetro que pide el enunciado
        pregunta: |
          $w$ es imaginario puro positivo, $w = bi$ con $b>0$. ¿Cuánto vale $b$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es el **radio** de la circunferencia, no el parámetro. El centro
              sale en $(-1, 2b)$ y el radio en $\sqrt{2+2b^{2}}$: igualando el
              radio a 2 se llega a $b=1$.
          - valor: '4'
            mensaje: |
              4 es el coeficiente del área, $4\pi$. Del área se saca el radio
              —$\pi r^{2} = 4\pi \Rightarrow r = 2$— y del radio, $b$.
          - valor: '0.5'
            mensaje: |
              Parece una división de más. De $2+2b^{2} = 4$ sale $b^{2} = 1$ y
              por tanto $b=1$, no $\frac12$.
        pista: |
          Desarrolla $\left|z-1\right|^{2} = 2\left|z-bi\right|^{2}$, completa
          cuadrados y mira qué sale como radio al cuadrado.
        desarrollo: |
          Con $w = bi$ y $z = x+iy$, elevando al cuadrado —los dos miembros son
          módulos, así que es equivalente—:

          $$
          (x-1)^{2}+y^{2} = 2\left[x^{2}+(y-b)^{2}\right]
          $$

          $$
          x^{2}-2x+1+y^{2} = 2x^{2}+2y^{2}-4by+2b^{2}
          $$

          $$
          0 = x^{2}+2x+y^{2}-4by+2b^{2}-1
          $$

          Completando cuadrados en $x$ y en $y$:

          $$
          (x+1)^{2}+(y-2b)^{2} = 2+2b^{2}
          $$

          El radio es $r = \sqrt{2+2b^{2}}$, y el área impuesta da

          $$
          \pi r^{2} = 4\pi \;\Longrightarrow\; 2+2b^{2} = 4
          \;\Longrightarrow\; b^{2} = 1 \;\Longrightarrow\; b = 1
          $$

          tomando la raíz positiva, que es lo que exige el enunciado. Luego
          $w = i$.
        veredicto: |
          El dato «imaginario puro **positivo**» está para descartar $b=-1$. Sin
          él habría dos respuestas.

      - tipo: calcular
        titulo: El centro
        pregunta: |
          Con $w=i$, ¿cuál es el centro de la circunferencia? Dalo como número
          complejo.
        respuesta:
          tipo: complejo
          valor: -1+2i
          tolerancia: 0.01
          formato: forma binómica, por ejemplo -1+2i
        distractores:
          - valor: 1-2i
            mensaje: |
              Los dos signos cambiados. En $(x+1)^{2}+(y-2)^{2} = 4$ el centro
              es $(-1, +2)$: el signo del centro es el contrario del que aparece
              dentro del paréntesis.
          - valor: -1+i
            mensaje: |
              La ordenada del centro es $2b$, no $b$. Con $b=1$ sale 2, no 1.
          - valor: '0'
            mensaje: |
              La circunferencia no está centrada en el origen. Al completar
              cuadrados aparece $(x+1)^{2}$, que ya desplaza el centro.
        pista: |
          Sustituye $b=1$ en $(x+1)^{2}+(y-2b)^{2} = 2+2b^{2}$.
        desarrollo: |
          Con $b=1$:

          $$
          (x+1)^{2}+(y-2)^{2} = 4
          $$

          Centro $(-1,2)$, es decir $-1+2i$, y radio 2.
        veredicto: |
          Ni $1$ ni $w=i$ están en el centro, y no tienen por qué: en una
          circunferencia de Apolonio los dos puntos de referencia quedan **fuera
          del centro**, alineados con él.

      - tipo: verificar
        pregunta: |
          Con el valor de $w$ que has encontrado, escribe la circunferencia en $x$ e
          $y$. La figura comprobará si es la misma que la del enunciado.
        condicion: '|(z-1)/(z-i)| = sqrt(2)'
        ventana:
          x: [-5, 3]
          y: [-2, 6]
        formato: en x e y; usa ^2 para los cuadrados
        pista: |
          Sustituye $w = i$ en $\left|\frac{z-1}{z-w}\right| = \sqrt2$, pasa el
          denominador multiplicando y eleva al cuadrado. Después, completa cuadrados.
        desarrollo: |
          Con $w = i$ y $z = x+iy$, elevando al cuadrado:

          $$
          (x-1)^{2}+y^{2} = 2\left[x^{2}+(y-1)^{2}\right]
          $$

          Desarrollando y agrupando:

          $$
          0 = x^{2}+y^{2}+2x-4y+1
          $$

          Y completando cuadrados en las dos variables:

          $$
          (x+1)^{2}+(y-2)^{2} = 4
          $$

          Radio $2$, área $4\pi$, que es justo lo que pedía el enunciado.
        veredicto: |
          La **circunferencia de Apolonio** de centro $-1+2i$ y radio $2$. El error
          caro es no elevar al cuadrado la razón: con $\sqrt2$ en vez de $2$ sale un
          radio de $\sqrt2$ y un área de $2\pi$, la mitad de la pedida.
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              La condición $\left|\frac{z-1}{z-w}\right| = \sqrt2$ es un
              cociente de distancias constante: una **circunferencia de
              Apolonio**.
          - texto: |
              Con $w=bi$, elevando al cuadrado y completando cuadrados sale
              $(x+1)^{2}+(y-2b)^{2} = 2+2b^{2}$.
          - texto: |
              El área encerrada es $\pi r^{2} = \pi\left(2+2b^{2}\right)$, y
              tiene que valer $4\pi$: $b^{2} = 1$.
          - texto: |
              Como $w$ es imaginario puro **positivo**, se toma $b=1$ y por
              tanto $w = i$.
          - texto: |
              El lugar es la circunferencia de centro $-1+2i$ y radio 2.
          - texto: |
              Como el cociente vale $\sqrt2 \neq 1$, el lugar es la mediatriz
              del segmento que une 1 y $w$.
            trampa: true
            mensaje: |
              Es justo al revés: la mediatriz aparece **cuando el cociente vale
              1**. Con cualquier otra constante los términos cuadráticos no se
              cancelan y queda una circunferencia. Y una mediatriz es una recta,
              que no encierra área: el enunciado sería imposible.
        veredicto: |
          Que el enunciado hable de «el área encerrada» ya avisa de que el lugar
          es una curva cerrada. Leerlo ahorra el susto de acabar con una recta.

      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 340 265" role="img" width="340" height="265"
