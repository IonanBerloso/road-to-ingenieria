      </figcaption>
      </figure>
    pide: Identificar las tres gráficas y estudiar $h(x)$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué relación permite identificar las curvas?
        opciones:
          - texto: >-
              Los **ceros** de una tienen que caer en los **extremos** de la
              anterior
            correcta: true
            mensaje: |
              Exacto, y es la única lectura que se puede hacer sin escala
              numérica. Dos coincidencias de ese tipo bastan para fijar el
              orden, y si sobra alguna es que la identificación está mal.
          - texto: >-
              La más grande es la función y la más pequeña la segunda derivada
            mensaje: |
              El tamaño no dice nada: depende de las unidades, y multiplicar la
              función por 100 multiplica las tres por 100.
          - texto: >-
              La que corta más veces el eje es la segunda derivada
            mensaje: |
              Suele ocurrir, porque cada derivada añade oscilación, pero no es
              un criterio: hay contraejemplos inmediatos.
          - texto: >-
              La que va por arriba es la función
            mensaje: |
              La posición vertical no está relacionada con el orden de
              derivación.

      - tipo: calcular
        titulo: Cuál es la función
        pregunta: |
          ¿Qué número de curva es $y(x)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              La (1) es $y'$: sus **ceros** caen justo en los dos extremos de la
              (2), que es la señal inequívoca.
          - valor: '3'
            mensaje: |
              La (3) es $y''$: sus ceros caen en el mínimo y en el máximo de la
              (1).
          - valor: '0'
            mensaje: |
              Las curvas están numeradas 1, 2 y 3.
        pista: |
          Mira dónde tiene cada curva sus extremos y dónde corta cada una al
          eje.
        desarrollo: |
          > **Medición.** Las tres curvas se han seguido sobre el PDF original,
          > columna a columna, tomando el eje horizontal como origen. Las
          > posiciones que siguen están en fracción del intervalo $[a,b]$.

          | curva | ceros | extremos |
          |---|---|---|
          | (1) | $0{,}21$ y $0{,}63$ | mín en $0{,}41$, máx en $0{,}86$ |
          | (2) | toca el eje en $0{,}62$ | máx en $0{,}21$, mín en $0{,}62$ |
          | (3) | $0{,}41$ y $0{,}86$ | mín en $0{,}12$, máx en $0{,}63$ |

          **Dos coincidencias exactas:**

          - los ceros de (1) —$0{,}21$ y $0{,}63$— son los extremos de (2);
          - los ceros de (3) —$0{,}41$ y $0{,}86$— son los extremos de (1).

          $$
          \boxed{(2) = y, \qquad (1) = y', \qquad (3) = y''}
          $$
        veredicto: |
          Las dos coincidencias se refuerzan: no hay otra asignación de las seis
          posibles que las cumpla las dos a la vez.

      - tipo: reconocer
        pregunta: |
          Para el apartado (b), ¿cuánto vale $h'(x)$?
        opciones:
          - texto: >-
              $h'(x) = y(x)-y'(x)$
            correcta: true
            mensaje: |
              Exacto. El primer sumando se deriva con el teorema fundamental
              —da $y(x)$— y el segundo es $-y'(x)$. Así que el signo de $h'$ es
              **cuál de las dos gráficas va por encima**.
          - texto: >-
              $h'(x) = y'(x)-y(x)$
            mensaje: |
              Signos cambiados. La integral se deriva y da $y$; lo que se resta
              es $y$, cuya derivada es $y'$.
          - texto: >-
              $h'(x) = y(x)-y''(x)$
            mensaje: |
              La derivada de $-y(x)$ es $-y'(x)$, no $-y''(x)$.
          - texto: >-
              $h'(x) = \int_a^{x}y'-y'$
            mensaje: |
              La integral no se deriva integrando otra vez: se deriva evaluando
              el integrando en el extremo superior.

      - tipo: justificar
        pregunta: |
          Ordena el estudio de $h$. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Derivar.** Por el teorema fundamental,
              $h'(x) = y(x)-y'(x)$: el signo lo decide **cuál de las dos
              gráficas, la (2) o la (1), va por encima**.
          - texto: |
              **Leer los cortes de (2) con (1)** en la figura: hay tres, en
              $0{,}10$, $0{,}64$ y $0{,}92$ del intervalo.
          - texto: |
              Luego $h$ **decrece** hasta $0{,}10$, **crece** hasta $0{,}64$,
              **decrece** hasta $0{,}92$ y vuelve a **crecer**: mínimos en
              $0{,}10$ y $0{,}92$, máximo en $0{,}64$.
          - texto: |
              **Derivar otra vez:** $h''(x) = y'(x)-y''(x)$, y el signo lo
              decide si la (1) va por encima de la (3).
          - texto: |
              **Los cortes de (1) con (3)** están en $0{,}32$ y $0{,}78$: $h$ es
              **convexa**, luego **cóncava**, luego **convexa**, con inflexiones
              ahí.
          - texto: |
              Los extremos de $h$ están donde $y$ corta al eje, porque $h$ es
              una función integral de $y$.
            trampa: true
            mensaje: |
              Eso valdría si $h$ fuera **solo** la integral. Le resta $y(x)$, y
              ese segundo término cambia todo: $h' = y-y'$, no $h'=y$. Los
              extremos están donde las **dos curvas se cortan**, no donde una
              corta al eje. Es el error que persigue el enunciado al añadir el
              $-y(x)$.
        veredicto: |
          Todo el apartado (b) se reduce a comparar curvas dos a dos. No hace
          falta ninguna escala numérica: basta ver quién va por encima.

    resolucion: |
      **Datos.** Tres gráficas sin escala, y una función $h$ construida con la
      integral de $y$ menos la propia $y$.

      ### 1 · Apartado (a): cómo se identifican

      Sin números en los ejes, lo único que se puede usar es la **relación entre
      ceros y extremos**:

      $$
      \text{ceros de } g' \ \longleftrightarrow\ \text{extremos de } g
      $$

      > **Medición.** Las tres curvas se han seguido sobre el PDF original
      > columna a columna, con el eje horizontal como cero. Las abscisas se dan
      > en fracción del intervalo $[a,b]$, con $a=0$ y $b=1$; el origen marcado
      > en la figura cae en $0{,}60$.

      | curva | corta al eje en | extremos |
      |---|---|---|
      | **(1)** | $0{,}21$ y $0{,}63$ | mínimo en $0{,}41$, máximo en $0{,}86$ |
      | **(2)** | toca el eje en $0{,}62$ | máximo en $0{,}21$, mínimo en $0{,}62$ |
      | **(3)** | $0{,}41$ y $0{,}86$ | mínimo en $0{,}12$, máximo en $0{,}63$ |

      **Primera coincidencia.** Los ceros de (1) están en $0{,}21$ y $0{,}63$;
      los extremos de (2), en $0{,}21$ y $0{,}62$. Encajan.

      $$
      (1) = \left[(2)\right]'
      $$

      **Segunda coincidencia.** Los ceros de (3) están en $0{,}41$ y $0{,}86$;
      los extremos de (1), en $0{,}41$ y $0{,}86$. Encajan.

      $$
      (3) = \left[(1)\right]'
      $$

      $$
      \boxed{(2) = y(x), \qquad (1) = y'(x), \qquad (3) = y''(x)}
      $$

      **Y la comprobación de signos**, que cierra la identificación:

      | tramo | (1) $= y'$ | (2) $= y$ |
      |---|---|---|
      | $x<0{,}21$ | positiva | **crece** ✔ |
      | $0{,}21<x<0{,}63$ | negativa | **decrece** ✔ |
      | $x>0{,}63$ | positiva | **crece** ✔ |

      | tramo | (3) $= y''$ | (1) $= y'$ |
      |---|---|---|
      | $x<0{,}41$ | negativa | **decrece** ✔ |
      | $0{,}41<x<0{,}86$ | positiva | **crece** ✔ |
      | $x>0{,}86$ | negativa | **decrece** ✔ |

      Todo cuadra. Ninguna de las otras cinco asignaciones posibles lo hace.

      ### 2 · Apartado (b): las dos derivadas de $h$

      $$
      h(x) = \int_a^{x}y(z)\,dz-y(x)
      $$

      **Primera derivada.** El primer sumando se deriva con el **teorema
      fundamental** —$y$ es continua, así que se aplica—:

      $$
      \boxed{h'(x) = y(x)-y'(x)}
      $$

      **Segunda derivada:**

      $$
      \boxed{h''(x) = y'(x)-y''(x)}
      $$

      Y aquí está la idea del ejercicio: **no hay que calcular nada**. El signo
      de $h'$ es «¿va la (2) por encima de la (1)?», y el de $h''$ es «¿va la
      (1) por encima de la (3)?». Todo se lee mirando qué curva está más alta.

      ### 3 · Crecimiento y extremos de $h$

      > **Medición.** Los cortes de la (2) con la (1) están, en fracción del
      > intervalo, en $0{,}10$, $0{,}64$ y $0{,}92$.

      | tramo | ¿quién va arriba? | $h' = y-y'$ | $h$ |
      |---|---|---|---|
      | $(a;\,0{,}10)$ | la (1) | $<0$ | **decrece** |
      | $(0{,}10;\,0{,}64)$ | la (2) | $>0$ | **crece** |
      | $(0{,}64;\,0{,}92)$ | la (1) | $<0$ | **decrece** |
      | $(0{,}92;\,b)$ | la (2) | $>0$ | **crece** |

      $$
      \boxed{
      \begin{aligned}
      &\text{mínimos relativos en } x \approx 0{,}10 \text{ y } x \approx 0{,}92\\
      &\text{máximo relativo en } x \approx 0{,}64
      \end{aligned}}
      $$

      Nótese que $h(a) = 0-y(a) = -y(a)$, que es negativo porque $y(a)>0$.

      ### 4 · Concavidad e inflexiones de $h$

      > **Medición.** Los cortes de la (1) con la (3) están en $0{,}32$ y
      > $0{,}78$.

      | tramo | ¿quién va arriba? | $h'' = y'-y''$ | $h$ |
      |---|---|---|---|
      | $(a;\,0{,}32)$ | la (1) | $>0$ | **convexa** |
      | $(0{,}32;\,0{,}78)$ | la (3) | $<0$ | **cóncava** |
      | $(0{,}78;\,b)$ | la (1) | $>0$ | **convexa** |

      $$
      \boxed{\text{Dos puntos de inflexión, en } x \approx 0{,}32
      \text{ y } x \approx 0{,}78}
      $$

      El signo cambia de verdad en los dos, así que son inflexiones y no falsas
      alarmas.

      ### 5 · Comprobación de coherencia

      Los extremos de $h$ y sus inflexiones tienen que **alternarse**, y lo
      hacen:

      $$
      \underbrace{0{,}10}_{\text{mín}}
      < \underbrace{0{,}32}_{\text{inf}}
      < \underbrace{0{,}64}_{\text{máx}}
      < \underbrace{0{,}78}_{\text{inf}}
      < \underbrace{0{,}92}_{\text{mín}}
      $$

      Entre dos extremos consecutivos de una función suave tiene que haber al
      menos una inflexión, y aquí hay exactamente una en cada hueco ✔ Si la
      lectura de la figura hubiera fallado, esta alternancia se habría roto.

      **Con un ejemplo concreto que reproduce la figura.** Tomando
      $y(x) = 1-\cos x$ en $[-2;\,2{,}5]$ —positiva, con un mínimo nulo en 0,
      igual que la (2)—:

      $$
      h(x) = \int_{-2}^{x}\left(1-\cos z\right)dz-\left(1-\cos x\right)
      $$

      $$
      h'(x) = \left(1-\cos x\right)-\mathrm{sen}\,x
      $$

      que se anula donde $1-\cos x = \mathrm{sen}\,x$, es decir en $x=0$ y en
      $x = \frac{\pi}{2}$: **dos** puntos, uno de ellos justo donde $y$ toca el
      eje ✔ Y

      $$
      h''(x) = \mathrm{sen}\,x-\cos x
      $$

      que se anula en $x = \frac{\pi}{4}$, **entre** los dos anteriores ✔ La
      alternancia se reproduce.

      ### 6 · Lo que enseña el ejercicio

      El apartado (b) parece pedir cálculos y no pide ninguno. Todo sale de dos
      derivadas simbólicas y de mirar la figura.

      Y el $-y(x)$ del enunciado no es decorativo: sin él, $h$ sería la función
      integral de siempre, con extremos donde $y$ corta al eje. Con él, los
      extremos se mueven a los **cortes entre curvas**, que es un sitio
      completamente distinto. Ese desplazamiento es la pregunta.

  - id: ex1920-3ev-4-barrow-otra-vez
    titulo: El teorema fundamental y Barrow, tal como los pide el examen
    fuente: >-
      Ejercicio 4 · Tercera evaluación, 17 de enero de 2020 · Cálculo
      (Industriales), UPV/EHU · La misma pregunta, palabra por palabra, cayó en
      la tercera evaluación de 2020-2021 · El examen no publica solución: la
      demostración es propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 0
      comp4: 10

    enunciado: |
      Enunciar el Teorema fundamental del Cálculo Infinitesimal y utilizarlo
      para demostrar la Regla de Barrow.
    pide: Enunciar y demostrar.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la hipótesis del teorema fundamental que hay que declarar?
        opciones:
          - texto: >-
              Que $f$ sea **continua** en el intervalo
            correcta: true
            mensaje: |
              Exacto. La continuidad es lo que garantiza que la función integral
              sea derivable. Con $f$ solo integrable, $F$ es continua pero puede
              no ser derivable en los puntos de salto.
          - texto: >-
              Que $f$ sea derivable
            mensaje: |
              No hace falta: se integra $f$, no se deriva. El valor absoluto
              $\left\lvert x-1\right\rvert$ no es derivable y su integral sí.
          - texto: >-
              Que $f$ sea positiva
            mensaje: |
              El signo no interviene. El teorema vale para funciones de
              cualquier signo.
          - texto: >-
              Que el intervalo sea cerrado y acotado
            mensaje: |
              Ayuda para que la integral exista, pero la hipótesis que hace
              funcionar la derivada es la continuidad.

      - tipo: calcular
        titulo: Una primitiva desplazada
        pregunta: |
          Calcula $\int_1^{4}\frac{dx}{x}$ con la primitiva
          $G(x) = \ln x+7$. Da cuatro decimales.
        respuesta:
          tipo: numero
          valor: '1.3863'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '8.3863'
            mensaje: |
              $8{,}3863$ es $G(4)$ a secas. Barrow **resta**:
              $G(4)-G(1) = 8{,}3863-7$.
          - valor: '15.3863'
            mensaje: |
              $15{,}3863$ suma los dos valores en vez de restarlos.
          - valor: '0.6931'
            mensaje: |
              $\ln2$ es $\int_1^{2}\frac{dx}{x}$. El extremo superior es 4:
              $\ln4 = 2\ln2$.
        pista: |
          $G(4)-G(1)$. El 7 aparece en los dos.
        desarrollo: |
          $$
          G(4) = \ln4+7 = 1{,}3863+7 = 8{,}3863
          $$

          $$
          G(1) = \ln1+7 = 0+7 = 7
          $$

          $$
          \int_1^{4}\frac{dx}{x} = G(4)-G(1) = 1{,}3863 = \ln4
          $$

          Con la primitiva sin desplazar, $\ln x$, saldría
          $\ln4-\ln1 = \ln4$: **el mismo número**.
        veredicto: |
          Ese 7 que se cancela **es** el paso central de la demostración. Sin
          esa cancelación, Barrow no serviría de nada en la práctica.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Construir una primitiva.** Como $f$ es continua en $[a,b]$, el
              teorema fundamental dice que $F(x) = \int_a^{x}f$ es derivable con
              $F' = f$.
          - texto: |
              **Tomar otra primitiva cualquiera** $G$, con $G'=f$. Entonces
              $(G-F)' = 0$ en todo $[a,b]$.
          - texto: |
              **Deducir que $G-F$ es constante.** Es consecuencia del teorema
              del valor medio de Lagrange, y exige que $[a,b]$ sea un
              **intervalo**.
          - texto: |
              **Restar en los extremos:**
              $G(b)-G(a) = \left[F(b)+C\right]-\left[F(a)+C\right]
              = F(b)-F(a)$.
          - texto: |
              **Y usar que $F(a)=0$:** queda
              $\int_a^{b}f = G(b)-G(a)$. $\blacksquare$
          - texto: |
              Como $F$ es la única primitiva que vale 0 en $a$, la regla solo
              funciona con ella.
            trampa: true
            mensaje: |
              Es cierto que $F$ es la única primitiva que se anula en $a$, pero
              la conclusión es la contraria: la regla funciona con **cualquier**
              primitiva, precisamente porque la constante se cancela al restar.
              Si hiciera falta la primitiva concreta que se anula en $a$, habría
              que calcular la integral para poder usarla — y el método sería
              circular.
        veredicto: |
          «Cualquier primitiva» no es un detalle: es lo que convierte el teorema
          en una herramienta de cálculo.

    resolucion: |
      **Lo que se pide.** Enunciar y demostrar. Diez puntos, todos de COMP4.

      > Esta misma pregunta, con la misma redacción, cayó también en la tercera
      > evaluación del curso 2020-2021. Conviene tenerla escrita.

      ### 1 · El enunciado del teorema fundamental

      > **Teorema fundamental del Cálculo Infinitesimal.** Sea $f$ **continua**
      > en $[a,b]$, y sea
      >
      > $$
      > F(x) = \int_a^{x}f(t)\,dt, \qquad x \in [a,b]
      > $$
      >
      > Entonces $F$ es derivable en $[a,b]$ y $F'(x) = f(x)$ para todo $x$.

      Tres precisiones que conviene incluir:

      - Si $f$ es solo **integrable**, $F$ existe y es continua —de hecho
        lipschitziana—, pero puede no ser derivable.
      - La derivabilidad en un punto $x_0$ necesita la continuidad **en ese
        punto**.
      - En $a$ y en $b$ se entienden derivadas laterales.

      **En una frase:** integrar una función continua fabrica una primitiva
      suya.

      ### 2 · El enunciado de la regla de Barrow

      > **Regla de Barrow.** Sea $f$ continua en $[a,b]$ y sea $G$ **cualquier**
      > primitiva de $f$ en $[a,b]$, es decir $G' = f$. Entonces
      >
      > $$
      > \int_a^{b}f(x)\,dx = G(b)-G(a)
      > $$

      El teorema fundamental **fabrica** primitivas; Barrow **usa** una para
      calcular. Es el mismo puente recorrido en las dos direcciones.

      ### 3 · La demostración

      **(i)** Por el teorema fundamental, $F(x) = \int_a^{x}f$ es una primitiva
      de $f$.

      **(ii)** Si $G$ es otra primitiva:

      $$
      (G-F)'(x) = f(x)-f(x) = 0 \qquad \forall x \in [a,b]
      $$

      **(iii)** Una función con derivada nula **en un intervalo** es constante.
      Se demuestra con el teorema del valor medio: si existieran $x_1<x_2$ con
      valores distintos, habría un $\xi$ intermedio con

      $$
      (G-F)'(\xi) = \frac{(G-F)(x_2)-(G-F)(x_1)}{x_2-x_1} \neq 0
      $$

      contra (ii). Luego $G = F+C$ para alguna constante $C$.

      **(iv)** Restando en los extremos, **la constante se cancela**:

      $$
      G(b)-G(a) = \left[F(b)+C\right]-\left[F(a)+C\right] = F(b)-F(a)
      $$

      **(v)** Y como $F(a) = \int_a^{a}f = 0$:

      $$
      \boxed{\int_a^{b}f(x)\,dx = F(b) = G(b)-G(a)} \qquad \blacksquare
      $$

      ### 4 · Por qué importa cada hipótesis

      | hipótesis | dónde entra | si falla |
      |---|---|---|
      | $f$ continua | paso (i) | $F$ puede no ser derivable |
      | $[a,b]$ **intervalo** | paso (iii) | la diferencia puede no ser constante |
      | $G' = f$ en todo $[a,b]$ | paso (ii) | la resta no es nula en algún punto |

      **Un contraejemplo para la continuidad.** Con

      $$
      f(x) = \begin{cases}0 & x \le 0\\ 1 & x>0\end{cases}
      $$

      la función $F(x) = \int_{-1}^{x}f$ vale 0 a la izquierda y $x$ a la
      derecha: continua, pero **con un pico en 0**. Ahí $F'$ no existe y el
      teorema no se aplica.

      **Un contraejemplo para el intervalo.** En $(-1,0)\cup(0,1)$, la función
      que vale 0 a un lado y 1 al otro tiene derivada nula y **no** es
      constante. El paso (iii) se cae.

      **Y un contraejemplo para la tercera**, que es el de la propia práctica:
      $\int_{-1}^{1}\frac{dx}{x^{2}}$. La «primitiva» $-\frac1x$ no lo es en
      $x=0$ —ni siquiera está definida—, y aplicar Barrow da $-2$: negativo,
      con un integrando positivo. La integral en realidad **diverge**.

      ### 5 · Comprobación de que la regla no depende de la primitiva

      Con $f(x) = \frac1x$ en $[1,4]$ y dos primitivas:

      $$
      G_1(x) = \ln x
      \;\Longrightarrow\;
      G_1(4)-G_1(1) = \ln4-0 = 1{,}3863
      $$

      $$
      G_2(x) = \ln x+7
      \;\Longrightarrow\;
      G_2(4)-G_2(1) = 8{,}3863-7 = 1{,}3863 \quad\checkmark
      $$

      El mismo número. El 7 se cancela, como decía el paso (iv).

  - id: ex1920-3ev-5-integral-por-la-tangente
    titulo: Una integral trigonométrica que se arregla dividiendo por el coseno
    fuente: >-
      Ejercicio 5 · Tercera evaluación, 17 de enero de 2020 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 10
      comp4: 0

    enunciado: |
      Calcular la integral
      $\displaystyle\int\frac{1}{\mathrm{sen}^{2}x-5\,\mathrm{sen}\,x\cos x}\,dx$.
    pide: Calcular la integral.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tiene de especial el denominador?
        opciones:
          - texto: >-
              Que es **homogéneo de grado 2** en seno y coseno, así que dividir
              por $\cos^{2}x$ lo convierte en un polinomio en $\tan x$
            correcta: true
            mensaje: |
              Exacto. Los dos términos tienen grado total 2, así que al dividir
              arriba y abajo por $\cos^{2}x$ queda
              $\frac{\sec^{2}x}{\tan^{2}x-5\tan x}$, y $\sec^{2}x\,dx$ es
              justamente $d(\tan x)$.
          - texto: >-
              Que se puede factorizar como $\mathrm{sen}\,x(\mathrm{sen}\,x-5\cos x)$
            mensaje: |
              Se puede, y no está mal, pero por ahí se llega a una
              descomposición más incómoda. La homogeneidad es la propiedad que
              resuelve el ejercicio.
          - texto: >-
              Que hay que usar el cambio de Weierstrass
            mensaje: |
              Weierstrass siempre funciona, pero aquí deja una racional en $t$
              de grado alto. Con integrandos **homogéneos** el cambio
              $t = \tan x$ es mucho más corto.
          - texto: >-
              Que se anula en $x=0$
            mensaje: |
              Se anula, sí, y eso hay que decirlo en el dominio. Pero no es lo
              que sugiere el método.

      - tipo: calcular
        titulo: El denominador tras el cambio
        pregunta: |
          Con $t=\tan x$, el denominador queda $t^{2}+kt$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '-5'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '5'
            mensaje: |
              Signo cambiado. El enunciado resta:
              $\mathrm{sen}^{2}x-5\,\mathrm{sen}\,x\cos x$, y al dividir por
              $\cos^{2}x$ queda $t^{2}-5t$.
          - valor: '-1'
            mensaje: |
              $-1$ ignoraría el coeficiente 5. Dividir por $\cos^{2}x$ no cambia
              los coeficientes, solo los grados.
          - valor: '-25'
            mensaje: |
              25 saldría de elevar el 5 al cuadrado. No hay ningún cuadrado que
              hacer.
        pista: |
          Divide arriba y abajo por $\cos^{2}x$:
          $\frac{\mathrm{sen}^{2}x}{\cos^{2}x} = t^{2}$ y
          $\frac{\mathrm{sen}\,x\cos x}{\cos^{2}x} = t$.
        desarrollo: |
          $$
          \frac{1}{\mathrm{sen}^{2}x-5\,\mathrm{sen}\,x\cos x}
          = \frac{\frac{1}{\cos^{2}x}}
          {\frac{\mathrm{sen}^{2}x}{\cos^{2}x}
          -5\frac{\mathrm{sen}\,x\cos x}{\cos^{2}x}}
          = \frac{\sec^{2}x}{\tan^{2}x-5\tan x}
          $$

          Con $t = \tan x$ y $dt = \sec^{2}x\,dx$:

          $$
          \int\frac{dt}{t^{2}-5t}
          $$

          Luego $k = -5$.
        veredicto: |
          El $\sec^{2}x$ que aparece arriba **es** el $dt$: por eso el truco
          funciona con cualquier integrando homogéneo de grado par en seno y
          coseno.

      - tipo: calcular
        titulo: El coeficiente de las fracciones simples
        pregunta: |
          Descomponiendo $\frac{1}{t(t-5)} = \frac At+\frac{B}{t-5}$, ¿cuánto
          vale $B$? Da cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.2'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '-0.2'
            mensaje: |
              $-\frac15$ es $A$, el del otro sumando. Los dos son opuestos, y es
              fácil cruzarlos.
          - valor: '5'
            mensaje: |
              5 es la raíz del denominador, no el coeficiente. Hay que
              **dividir** entre 5.
          - valor: '1'
            mensaje: |
              1 es el numerador de partida. La descomposición lo reparte entre
              los dos sumandos.
        pista: |
          Multiplica por $(t-5)$ y evalúa en $t=5$.
        desarrollo: |
          $$
          1 = A(t-5)+Bt
          $$

          | $t$ | ecuación | resultado |
          |---|---|---|
          | $0$ | $1 = -5A$ | $A = -\frac15$ |
          | $5$ | $1 = 5B$ | $B = \frac15 = 0{,}2$ |

          Los dos son opuestos, como siempre ocurre con
          $\frac{1}{t(t-r)}$: valen $\mp\frac1r$.
        veredicto: |
          Que $A$ y $B$ sean opuestos permite juntar los dos logaritmos en uno
          solo, que es la forma en que conviene dejar la respuesta.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Dividir arriba y abajo por $\cos^{2}x$**, que se puede porque el
              denominador es homogéneo de grado 2:
              $\int\frac{\sec^{2}x\,dx}{\tan^{2}x-5\tan x}$.
          - texto: |
              **Cambiar** $t = \tan x$, con $dt = \sec^{2}x\,dx$:
              $\int\frac{dt}{t^{2}-5t} = \int\frac{dt}{t(t-5)}$.
          - texto: |
              **Descomponer en fracciones simples:**
              $\frac{1}{t(t-5)} = \frac{-1/5}{t}+\frac{1/5}{t-5}$.
          - texto: |
              **Integrar:**
              $\frac15\ln\left\lvert t-5\right\rvert-\frac15\ln\left\lvert t\right\rvert
              = \frac15\ln\left\lvert\frac{t-5}{t}\right\rvert$.
          - texto: |
              **Deshacer el cambio:**
              $\frac15\ln\left\lvert\dfrac{\tan x-5}{\tan x}\right\rvert+C$.
          - texto: |
              Los valores absolutos de los logaritmos se pueden quitar, porque
              la tangente es positiva.
            trampa: true
            mensaje: |
              La tangente **no** es siempre positiva: es negativa en el segundo
              y el cuarto cuadrante. Y en el dominio de esta integral —donde el
              denominador no se anula— aparecen tramos con $\tan x<0$ y tramos
              con $0<\tan x<5$, donde el cociente también es negativo. El valor
              absoluto es obligatorio, y quitarlo deja la primitiva mal definida
              en la mitad de los intervalos.
        veredicto: |
          El valor absoluto del logaritmo no es una manía: es lo que hace que la
          primitiva valga en cada uno de los intervalos donde el integrando está
          definido.

    resolucion: |
      **Datos.**
      $\int\frac{dx}{\mathrm{sen}^{2}x-5\,\mathrm{sen}\,x\cos x}$.

      ### 1 · Ver la homogeneidad

      Los dos términos del denominador —$\mathrm{sen}^{2}x$ y
      $\mathrm{sen}\,x\cos x$— tienen **grado total 2** en seno y coseno. Cuando
      eso ocurre, dividir arriba y abajo por $\cos^{2}x$ lo convierte todo en
      tangentes:

      $$
      \frac{1}{\mathrm{sen}^{2}x-5\,\mathrm{sen}\,x\cos x}
      = \frac{\dfrac{1}{\cos^{2}x}}
      {\dfrac{\mathrm{sen}^{2}x}{\cos^{2}x}
      -5\,\dfrac{\mathrm{sen}\,x\cos x}{\cos^{2}x}}
      = \frac{\sec^{2}x}{\tan^{2}x-5\tan x}
      $$

      **Y el $\sec^{2}x$ del numerador es exactamente $d(\tan x)$.** Por eso el
      método es tan corto: el cambio se paga solo.

      ### 2 · El cambio

      $$
      t = \tan x,
      \qquad
      dt = \sec^{2}x\,dx
      $$

      $$
      \int\frac{dt}{t^{2}-5t} = \int\frac{dt}{t(t-5)}
      $$

      Una función racional con dos raíces simples: fracciones simples.

      ### 3 · Fracciones simples

      $$
      \frac{1}{t(t-5)} = \frac At+\frac{B}{t-5}
      \;\Longrightarrow\;
      1 = A(t-5)+Bt
      $$

      $$
      t=0: \ A = -\frac15
      \qquad
      t=5: \ B = \frac15
      $$

      $$
      \int\left(\frac{-1/5}{t}+\frac{1/5}{t-5}\right)dt
      = \frac15\ln\left\lvert t-5\right\rvert
      -\frac15\ln\left\lvert t\right\rvert
      $$

      Juntando los dos logaritmos —se puede porque los coeficientes son
      opuestos—:

      $$
      = \frac15\ln\left\lvert\frac{t-5}{t}\right\rvert+C
      $$

      ### 4 · Deshacer el cambio

      $$
      \boxed{\int\frac{dx}{\mathrm{sen}^{2}x-5\,\mathrm{sen}\,x\cos x}
      = \frac15\ln\left\lvert\frac{\tan x-5}{\tan x}\right\rvert+C}
      $$

      O, equivalentemente,

      $$
      = \frac15\ln\left\lvert1-\frac{5}{\tan x}\right\rvert+C
      = \frac15\ln\left\lvert1-5\cot x\right\rvert+C
      $$

      ### 5 · Dónde vale

      El integrando no existe donde el denominador se anula:

      $$
      \mathrm{sen}\,x\left(\mathrm{sen}\,x-5\cos x\right) = 0
      $$

      $$
      \mathrm{sen}\,x = 0 \ \Rightarrow\ x = k\pi
      $$

      $$
      \tan x = 5 \ \Rightarrow\ x = \arctan5+k\pi \approx 1{,}373+k\pi
      $$

      Y tampoco donde $\cos x = 0$, porque ahí la tangente no está definida
      —aunque el integrando original sí lo esté: en $x=\frac{\pi}{2}$ vale
      $\frac{1}{1-0} = 1$—. Es una **singularidad del método**, no de la
      función: la primitiva se extiende por continuidad, y conviene decirlo.

      La primitiva vale en cada uno de los intervalos que quedan entre esos
      puntos, con una constante $C$ posiblemente distinta en cada uno.

      ### 6 · Comprobación

      **Derivando el resultado.** Con
      $u = \frac{\tan x-5}{\tan x} = 1-5\cot x$:

      $$
      u' = 5\csc^{2}x = \frac{5}{\mathrm{sen}^{2}x}
      $$

      $$
      \frac{d}{dx}\left[\frac15\ln\left\lvert u\right\rvert\right]
      = \frac15\cdot\frac{u'}{u}
      = \frac15\cdot\frac{\frac{5}{\mathrm{sen}^{2}x}}
      {1-\frac{5\cos x}{\mathrm{sen}\,x}}
      $$

      $$
      = \frac{\frac{1}{\mathrm{sen}^{2}x}}
      {\frac{\mathrm{sen}\,x-5\cos x}{\mathrm{sen}\,x}}
      = \frac{1}{\mathrm{sen}\,x\left(\mathrm{sen}\,x-5\cos x\right)}
      \quad\checkmark
      $$

      Que es exactamente el integrando.

      **Numérica.** Entre $x = 2$ y $x = 3$ —un intervalo donde el denominador
      no se anula, porque $\tan$ es negativa ahí—:

      $$
      \frac15\left[\ln\left\lvert1-5\cot 3\right\rvert
      -\ln\left\lvert1-5\cot 2\right\rvert\right]
      $$

      Con $\cot3 = -7{,}0153$ y $\cot2 = -0{,}4577$:

      $$
      \frac15\left[\ln(36{,}08)-\ln(3{,}289)\right]
      = \frac15\left[3{,}586-1{,}191\right] = 0{,}479
      $$

      Y sumando el integrando en cien trozos entre 2 y 3 sale $0{,}479$ ✔

  - id: ex1920-3ev-6-la-cucaracha
    titulo: Hacia dónde escapa la cucaracha
    fuente: >-
      Ejercicio 6 · Tercera evaluación, 17 de enero de 2020 · Cálculo
      (Industriales), UPV/EHU · Este ejercicio es de varias variables, materia
      del segundo cuatrimestre · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 6
      comp4: 2

    enunciado: |
      Una cucaracha al verse en un ambiente tóxico cargado de AJT químico,
      decide moverse en una dirección en que la concentración de AJT disminuya
      con la mayor rapidez. Si se encuentra en el punto $P(1,0)$ y la
      concentración de AJT viene dada por la expresión:

      $$
      f(x,y) = \mathrm{e}^{-(x-1)^{2}-(y-1)^{2}}
      $$

      **a)** ¿Hacia dónde debe escabullirse?

      **b)** ¿Cuál es la ecuación de la curva que tendría que seguir la
      cucaracha para que la concentración de AJT del ambiente tóxico no
      cambiara? Dibujar dicha curva.

      **c)** ¿Cuál es el punto de mayor concentración de AJT?
    pide: Responder los tres apartados.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué objeto responde a los tres apartados?
        opciones:
          - texto: >-
              El **gradiente**: su opuesto da la dirección de (a), sus curvas de
              nivel perpendiculares dan la de (b), y su anulación da el punto de
              (c)
            correcta: true
            mensaje: |
              Exacto. Los tres apartados son tres preguntas sobre el mismo
              vector: hacia dónde apunta, qué hay perpendicular a él, y dónde se
              anula.
          - texto: >-
              La matriz hessiana
            mensaje: |
              Haría falta para clasificar el punto crítico, pero aquí el máximo
              se ve directamente sin ella: el exponente no puede pasar de 0.
          - texto: >-
              La derivada parcial respecto de $x$
            mensaje: |
              Es solo una componente. La dirección de máximo cambio necesita las
              dos.
          - texto: >-
              El laplaciano
            mensaje: |
              No interviene en ninguno de los tres apartados.

      - tipo: calcular
        titulo: La componente vertical del gradiente
        pregunta: |
          ¿Cuánto vale $\frac{\partial f}{\partial y}(1,0)$? Da cuatro
          decimales.
        respuesta:
          tipo: numero
          valor: '0.7358'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '-0.7358'
            mensaje: |
              Signo cambiado. La derivada es
              $-2(y-1)\mathrm{e}^{\ldots}$, y en $y=0$ vale
              $-2(-1)\mathrm{e}^{-1} = +2\mathrm{e}^{-1}$.
          - valor: '2'
            mensaje: |
              2 olvidaría el factor exponencial $\mathrm{e}^{-1}$, que en
              $(1,0)$ vale $0{,}3679$.
          - valor: '0.3679'
            mensaje: |
              $\mathrm{e}^{-1}$ es el valor de $f$ en el punto, no de su
              derivada. Falta el factor $-2(y-1) = 2$.
        pista: |
          Regla de la cadena sobre el exponente, y evalúa en $(1,0)$.
        desarrollo: |
          $$
          \frac{\partial f}{\partial y}
          = \mathrm{e}^{-(x-1)^{2}-(y-1)^{2}}\cdot\left[-2(y-1)\right]
          $$

          En $(1,0)$, el exponente vale $-0-1 = -1$:

          $$
          \frac{\partial f}{\partial y}(1,0)
          = \mathrm{e}^{-1}\cdot\left[-2(0-1)\right]
          = 2\mathrm{e}^{-1} = 0{,}7358
          $$

          Y la otra componente:

          $$
          \frac{\partial f}{\partial x}(1,0)
          = \mathrm{e}^{-1}\cdot\left[-2(1-1)\right] = 0
          $$

          $$
          \nabla f(1,0) = \left(0,\ \frac{2}{\mathrm{e}}\right)
          $$
        veredicto: |
          El gradiente apunta **hacia arriba**, en el sentido $+y$. Tiene
          sentido: el foco de concentración está en $(1,1)$, justo encima.

      - tipo: calcular
        titulo: El radio de la curva de nivel
        pregunta: |
          La curva del apartado (b) es una circunferencia. ¿Cuál es su radio?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0.3679'
            mensaje: |
              $\mathrm{e}^{-1}$ es el **valor** de la concentración en $P$, no
              una distancia. Tomando logaritmos, el radio al cuadrado es 1.
          - valor: '2'
            mensaje: |
              2 sería el diámetro. $P=(1,0)$ está a distancia 1 del centro
              $(1,1)$.
          - valor: '1.4142'
            mensaje: |
              $\sqrt2$ sería la distancia de $P$ al origen, que no interviene.
        pista: |
          La curva de nivel por $P$ es $f(x,y) = f(1,0)$. Toma logaritmos.
        desarrollo: |
          $$
          f(1,0) = \mathrm{e}^{-0-1} = \mathrm{e}^{-1}
          $$

          La curva de nivel:

          $$
          \mathrm{e}^{-(x-1)^{2}-(y-1)^{2}} = \mathrm{e}^{-1}
          $$

          Tomando logaritmos —la exponencial es inyectiva, así que basta igualar
          los exponentes—:

          $$
          -(x-1)^{2}-(y-1)^{2} = -1
          $$

          $$
          (x-1)^{2}+(y-1)^{2} = 1
          $$

          **Circunferencia de centro $(1,1)$ y radio 1**, que en efecto pasa por
          $P=(1,0)$.
        veredicto: |
          Las curvas de nivel son circunferencias concéntricas en $(1,1)$: la
          función solo depende de la **distancia** a ese punto.

      - tipo: justificar
        pregunta: |
          Ordena las respuestas. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **(a)** La concentración disminuye más deprisa en la dirección
              **opuesta** al gradiente. Con
              $\nabla f(1,0) = \left(0,\frac2{\mathrm{e}}\right)$, esa dirección
              es $(0,-1)$: **hacia abajo**, alejándose de $y=1$.
          - texto: |
              **(b)** Para que la concentración no cambie hay que moverse por la
              **curva de nivel** que pasa por $P$:
              $(x-1)^{2}+(y-1)^{2} = 1$.
          - texto: |
              Y es coherente con (a): esa circunferencia es **perpendicular** al
              gradiente en $P$, porque en $P$ su tangente es horizontal y el
              gradiente vertical.
          - texto: |
              **(c)** El exponente $-(x-1)^{2}-(y-1)^{2}$ es siempre $\le0$ y
              vale 0 solo en $(1,1)$. Como la exponencial es creciente, el
              máximo de $f$ está ahí, y vale $f(1,1) = 1$.
          - texto: |
              Es un máximo **absoluto**, y no hace falta ni derivar para verlo:
              basta con acotar el exponente.
          - texto: |
              La cucaracha, huyendo en la dirección $(0,-1)$, se aleja del punto
              de máxima concentración en línea recta y para siempre.
            trampa: true
            mensaje: |
              La dirección $(0,-1)$ es la de máxima bajada **en ese instante**,
              en $P$. Si la cucaracha sigue moviéndose, el gradiente cambia en
              cada punto y la trayectoria de descenso más rápido deja de ser
              recta — salvo aquí, donde por la simetría radial la línea $x=1$ sí
              es la trayectoria completa. Pero la razón no es «la dirección se
              mantiene», sino la simetría. La respuesta a (a) es local por
              definición.
        veredicto: |
          El gradiente da una dirección **puntual**. Que aquí la trayectoria
          resulte recta es consecuencia de que las curvas de nivel sean
          circunferencias concéntricas.

    resolucion: |
      **Datos.** $f(x,y) = \mathrm{e}^{-(x-1)^{2}-(y-1)^{2}}$ y el punto
      $P(1,0)$.

      > Este ejercicio es de **funciones de varias variables**, tema 6 del
      > programa y materia del segundo cuatrimestre. Aparece aquí porque el
      > examen de enero de 2020 lo incluyó.

      ### 1 · Qué función es

      El exponente es $-\left[(x-1)^{2}+(y-1)^{2}\right]$, es decir **menos el
      cuadrado de la distancia al punto $(1,1)$**. Así que

      $$
      f(x,y) = \mathrm{e}^{-d^{2}}, \qquad d = \text{distancia a } (1,1)
      $$

      Una campana centrada en $(1,1)$: la concentración solo depende de lo lejos
      que se esté de ese foco. Verlo así resuelve casi todo el ejercicio antes
      de derivar.

      ### 2 · El gradiente

      $$
      \frac{\partial f}{\partial x} = -2(x-1)\,f(x,y),
      \qquad
      \frac{\partial f}{\partial y} = -2(y-1)\,f(x,y)
      $$

      En $P=(1,0)$, con $f(1,0) = \mathrm{e}^{-1}$:

      $$
      \boxed{\nabla f(1,0) = \left(0,\ \frac{2}{\mathrm{e}}\right)
      \approx (0;\ 0{,}736)}
      $$

      Apunta **hacia arriba**, hacia el foco $(1,1)$, como tenía que ser.

      ### 3 · Apartado (a): hacia dónde huir

      La concentración **crece** más deprisa en la dirección del gradiente, así
      que **disminuye** más deprisa en la opuesta:

      $$
      -\nabla f(1,0) = \left(0,\ -\frac{2}{\mathrm{e}}\right)
      $$

      $$
      \boxed{\text{Dirección unitaria } (0,-1): \text{ hacia abajo,
      alejándose de } (1,1)}
      $$

      Y la rapidez con que baja, en esa dirección, es
      $\left\lvert\nabla f\right\rvert = \frac{2}{\mathrm{e}} \approx 0{,}736$
      unidades de concentración por unidad de longitud.

      ### 4 · Apartado (b): por dónde no cambia nada

      Que la concentración no cambie significa moverse por una **curva de
      nivel**: la que pasa por $P$.

      $$
      f(x,y) = f(1,0) = \mathrm{e}^{-1}
      $$

      $$
      \mathrm{e}^{-(x-1)^{2}-(y-1)^{2}} = \mathrm{e}^{-1}
      $$

      La exponencial es inyectiva, así que basta igualar exponentes:

      $$
      \boxed{(x-1)^{2}+(y-1)^{2} = 1}
      $$

      **Circunferencia de centro $(1,1)$ y radio 1.** Pasa por $P=(1,0)$, que
      está justo a distancia 1 del centro ✔

