      <figcaption>
      Figura nuestra: el enunciado pide representar. Las dos circunferencias van
      en gris porque no pertenecen a la region; los vertices rojos, i y 2-i,
      tampoco.
      </figcaption>
      </figure>

      ### 6 · Comprobación

      **Con el punto medio de la lente.** El centro de la lente está en
      $w = 1-i$, es decir $z = 1$:

      $$
      \frac{1}{z-i} = \frac{1}{1-i} = \frac{1+i}{2} = 0{,}5+0{,}5i
      $$

      $$
      \mathrm{Re} = 0{,}5 > 0{,}25 \ \checkmark
      \qquad
      \mathrm{Im} = 0{,}5 > 0{,}25 \ \checkmark
      $$

      **Con un vértice,** $z = 2-i$, es decir $w = 2-2i$:

      $$
      \frac{1}{2-2i} = \frac{2+2i}{8} = 0{,}25+0{,}25i
      $$

      Las dos partes valen **exactamente** $\frac14$: está en la frontera, y las
      desigualdades estrictas lo dejan fuera ✔ Justo lo que debe pasar en un
      vértice.

      **Con un punto de fuera,** $z = 4$, es decir $w = 4-i$:

      $$
      \frac{1}{4-i} = \frac{4+i}{17} = 0{,}235+0{,}059i
      $$

      $\mathrm{Re} = 0{,}235 < 0{,}25$: falla la primera ✔ Fuera.

      **Con un punto en el disco equivocado,** $z = 2+i$ (centro del primer
      disco), $w = 2$:

      $$
      \frac12 = 0{,}5
      $$

      $\mathrm{Re} = 0{,}5 > 0{,}25$ ✔ pero $\mathrm{Im} = 0 \not> 0{,}25$ ✘
      Está en el primer disco y no en el segundo, así que fuera de la lente ✔

  - id: ex1920-3ev-2-raiz-de-dos-por-taylor
    titulo: Aproximar la raíz de dos y acotar lo que se falla
    fuente: >-
      Ejercicio 2 · Tercera evaluación, 17 de enero de 2020 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3

    enunciado: |
      Sea la función $f(x) = \sqrt x$.

      **a)** Calcular el desarrollo de Taylor de orden 2 de $f(x)$ en el punto
      $a=1$.

      **b)** Utilizando el desarrollo anterior obtener una aproximación del
      valor $\sqrt2$.

      **c)** Acotar el error cometido en la aproximación anterior.
    pide: Calcular el polinomio, aproximar y acotar el error.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué se centra el desarrollo en $a=1$ y no en $a=0$?
        opciones:
          - texto: >-
              Porque en $0$ la raíz **no es derivable**, y $1$ es el punto
              cómodo más cercano a 2
            correcta: true
            mensaje: |
              Exacto. $f'(x) = \frac{1}{2\sqrt x}$ se dispara en 0: no hay
              polinomio de Taylor ahí. Y $x=1$ tiene raíz exacta y está a
              distancia 1 de 2, que es lo que se quiere aproximar.
          - texto: >-
              Porque $\sqrt1 = 1$ y así el polinomio es más corto
            mensaje: |
              Que la raíz sea exacta ayuda, pero el motivo de fondo es que en 0
              la función no es derivable.
          - texto: >-
              Porque el enunciado lo dice y no hay más
            mensaje: |
              Lo dice, sí, pero conviene saber por qué: es la clase de
              observación que puntúa en COMP4.
          - texto: >-
              Porque $2$ está más cerca de $1$ que de $4$
            mensaje: |
              Está a la misma distancia de 1 que de... no: $\left\lvert2-1\right\rvert=1$ y
              $\left\lvert2-4\right\rvert=2$. Pero centrar en 4 también funcionaría, y
              de hecho daría **mejor** aproximación relativa.

      - tipo: calcular
        titulo: La aproximación
        pregunta: |
          ¿Qué valor da el polinomio para $\sqrt2$? Da cuatro decimales.
        respuesta:
          tipo: numero
          valor: '1.375'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '1.5'
            mensaje: |
              $1{,}5$ es el polinomio de orden **1**: $1+\frac12$. Falta el
              término cuadrático, que resta $\frac18$.
          - valor: '1.625'
            mensaje: |
              $1{,}625$ **suma** el $\frac18$ en vez de restarlo. La segunda
              derivada de la raíz es negativa: la función es cóncava.
          - valor: '1.4142'
            mensaje: |
              $1{,}4142$ es el valor exacto de $\sqrt2$, no la aproximación. El
              polinomio se queda algo por debajo.
        pista: |
          $f(1)=1$, $f'(1)=\frac12$, $f''(1)=-\frac14$. Y $x-1 = 1$.
        desarrollo: |
          $$
          f(x) = x^{1/2},
          \qquad
          f'(x) = \frac{1}{2\sqrt x},
          \qquad
          f''(x) = -\frac{1}{4x^{3/2}}
          $$

          En $a=1$:

          $$
          f(1) = 1,
          \qquad
          f'(1) = \frac12,
          \qquad
          f''(1) = -\frac14
          $$

          $$
          P_2(x) = 1+\frac12(x-1)-\frac{1}{8}(x-1)^{2}
          $$

          En $x=2$, con $x-1 = 1$:

          $$
          P_2(2) = 1+\frac12-\frac18 = \frac{11}{8} = 1{,}375
          $$
        veredicto: |
          El coeficiente cuadrático es $\frac{f''(1)}{2!} = \frac{-1/4}{2}
          = -\frac18$. El factorial es donde se falla.

      - tipo: calcular
        titulo: La cota del error
        pregunta: |
          ¿Cuál es la cota del error por el resto de Lagrange? Da cuatro
          decimales.
        respuesta:
          tipo: numero
          valor: '0.0625'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '0.0392'
            mensaje: |
              $0{,}0392$ es el error **real**, no una cota. Se calcula sabiendo
              $\sqrt2$, que es justo lo que no se sabe. La cota tiene que salir
              sin conocer el valor exacto.
          - valor: '0.0221'
            mensaje: |
              $0{,}0221$ saldría de evaluar el resto en $\xi=2$, el extremo
              equivocado. Hay que tomar el $\xi$ que hace la cota **mayor**, que
              aquí es $\xi=1$.
          - valor: '0.1875'
            mensaje: |
              $\frac{3}{16}$ es $\left\lvert f'''(1)\right\rvert$ sin dividir entre
              $3!$.
        pista: |
          $R_2 = \frac{f'''(\xi)}{3!}(x-1)^{3}$ con
          $f'''(x) = \frac{3}{8x^{5/2}}$ y $\xi \in (1,2)$.
        desarrollo: |
          $$
          f'''(x) = \frac{3}{8}x^{-5/2} = \frac{3}{8x^{5/2}}
          $$

          Resto de Lagrange, con $\xi$ entre 1 y 2:

          $$
          R_2(2) = \frac{f'''(\xi)}{3!}(2-1)^{3}
          = \frac{3}{8\xi^{5/2}\cdot6} = \frac{1}{16\,\xi^{5/2}}
          $$

          Para **acotar** hay que quedarse con el $\xi$ que hace esto mayor. Como
          $\xi^{5/2}$ crece, el peor caso es $\xi = 1$:

          $$
          \left\lvert R_2(2)\right\rvert \le \frac{1}{16} = 0{,}0625
          $$
        veredicto: |
          La cota tiene que valer **sin saber** dónde está $\xi$. Por eso se
          toma el peor caso del intervalo, y por eso sale mayor que el error
          real.

      - tipo: justificar
        pregunta: |
          Ordena el apartado (c). Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Escribir el resto de Lagrange:** existe $\xi \in (1,2)$ con
              $R_2(2) = \frac{f'''(\xi)}{3!}(2-1)^{3}$.
          - texto: |
              **Las hipótesis se cumplen:** $f$ es tres veces derivable en un
              entorno de $[1,2]$, porque $x>0$ en todo él y la raíz solo falla
              en 0.
          - texto: |
              **Calcular la tercera derivada:**
              $f'''(x) = \frac{3}{8x^{5/2}}$, positiva y **decreciente** en
              $[1,2]$.
          - texto: |
              **Acotar por el peor caso:** el mayor valor se alcanza en
              $\xi=1$, luego
              $\left\lvert R_2\right\rvert \le \frac{3}{8\cdot6} = \frac{1}{16}
              = 0{,}0625$.
          - texto: |
              **Y comprobar:** el error real es
              $\left\lvert1{,}41421-1{,}375\right\rvert = 0{,}0392$, que en
              efecto es menor que $0{,}0625$ ✔
          - texto: |
              Como el error real vale $0{,}0392$, esa es la cota que hay que
              dar.
            trampa: true
            mensaje: |
              El error real **no** es una cota válida como respuesta: para
              calcularlo hace falta conocer $\sqrt2$, que es precisamente lo que
              se estaba aproximando. Una cota tiene que obtenerse **sin** el
              valor exacto; si no, el método no sirve para nada. El error real
              solo vale como comprobación al final, y por eso sale menor.
        veredicto: |
          Una cota se calcula desde el teorema, no desde la respuesta. Ese es
          todo el sentido del apartado (c).

    resolucion: |
      **Datos.** $f(x) = \sqrt x$, desarrollo en $a=1$, aproximación de
      $\sqrt2$ y cota del error.

      ### 1 · Apartado (a): el polinomio

      $$
      f(x) = x^{1/2}
      $$

      | derivada | expresión | en $x=1$ |
      |---|---|---|
      | $f$ | $x^{1/2}$ | $1$ |
      | $f'$ | $\frac12x^{-1/2}$ | $\frac12$ |
      | $f''$ | $-\frac14x^{-3/2}$ | $-\frac14$ |
      | $f'''$ | $\frac38x^{-5/2}$ | $\frac38$ |

      **Por qué en $a=1$ y no en $a=0$:** en 0 la derivada
      $\frac{1}{2\sqrt x}$ se dispara, así que ahí no hay polinomio de Taylor.
      Y en 1 la raíz es exacta.

      $$
      P_2(x) = f(1)+f'(1)(x-1)+\frac{f''(1)}{2!}(x-1)^{2}
      $$

      $$
      \boxed{P_2(x) = 1+\frac{x-1}{2}-\frac{(x-1)^{2}}{8}}
      $$

      El $\frac18$ sale de $\frac{-1/4}{2!}$: el factorial del término
      cuadrático es lo que más se olvida.

      ### 2 · Apartado (b): la aproximación

      En $x=2$ se tiene $x-1 = 1$, y todo se simplifica:

      $$
      P_2(2) = 1+\frac12-\frac18 = \frac{8+4-1}{8}
      $$

      $$
      \boxed{\sqrt2 \approx \frac{11}{8} = 1{,}375}
      $$

      **Se queda por debajo**, y era previsible: $f''<0$, la raíz es **cóncava**,
      así que su polinomio de Taylor de orden par la aproxima por defecto en
      esta dirección.

      ### 3 · Apartado (c): la cota

      **El teorema de Taylor con resto de Lagrange** dice que existe
      $\xi \in (1,2)$ con

      $$
      R_2(2) = \frac{f'''(\xi)}{3!}(2-1)^{3} = \frac{f'''(\xi)}{6}
      $$

      **Sus hipótesis se cumplen:** $f$ es tres veces derivable en todo
      $[1,2]$, porque ahí $x>0$.

      $$
      f'''(x) = \frac{3}{8x^{5/2}}
      $$

      No se sabe dónde está $\xi$, así que hay que **acotar por el peor caso**.
      Como $f'''$ es positiva y decreciente en $[1,2]$, su mayor valor está en
      $\xi=1$:

      $$
      \left\lvert R_2(2)\right\rvert
      = \frac{1}{6}\cdot\frac{3}{8\,\xi^{5/2}}
      \le \frac{1}{6}\cdot\frac38 = \frac{1}{16}
      $$

      $$
      \boxed{\left\lvert\text{error}\right\rvert \le \frac{1}{16} = 0{,}0625}
      $$

      ### 4 · Comprobación

      **El error real:**

      $$
      \sqrt2 = 1{,}414214,
      \qquad
      \left\lvert1{,}414214-1{,}375\right\rvert = 0{,}039214
      $$

      $$
      0{,}0392 < 0{,}0625 \quad\checkmark
      $$

      La cota se cumple, y con holgura: es lo esperable, porque se ha tomado el
      peor $\xi$ posible. El $\xi$ que hace exacta la igualdad cumple

      $$
      \frac{1}{16\xi^{5/2}} = 0{,}039214
      \;\Longrightarrow\;
      \xi^{5/2} = 1{,}5938
      \;\Longrightarrow\;
      \xi = 1{,}2035
      $$

      que en efecto está entre 1 y 2 ✔

      **De la aproximación, con otro punto.** En $x = 1{,}21$, donde la raíz es
      exacta:

      $$
      P_2(1{,}21) = 1+0{,}105-0{,}0055 = 1{,}0995
      $$

      $$
      \sqrt{1{,}21} = 1{,}1 \quad\checkmark
      $$

      Con $x-1 = 0{,}21$ el error es $5\cdot10^{-4}$, mucho menor: el resto va
      como $(x-1)^{3}$, y $0{,}21^{3}$ es cien veces menor que $1$.

      ### 5 · Una observación que mejora la respuesta

      Centrando en $a = \frac94 = 2{,}25$ —cuya raíz también es exacta,
      $\frac32$— la distancia a 2 sería solo $0{,}25$ y el error caería a

      $$
      \frac{1}{6}\cdot\frac{3}{8\cdot2^{5/2}}\cdot0{,}25^{3}
      \approx 1{,}4\cdot10^{-4}
      $$

      unas 450 veces menos. **Elegir bien el centro importa más que subir el
      orden**, y decirlo es exactamente el tipo de comentario que puntúa en
      COMP4.

  - id: ex1920-3ev-3-identificar-las-tres-graficas
    titulo: Cuál de las tres es la función, y qué hace su integral menos ella
    fuente: >-
      Ejercicio 3 · Tercera evaluación, 17 de enero de 2020 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3

    enunciado: |
      La figura muestra las gráficas de la función $y(x)$ definida en $(a,b)$ y
      de las funciones $y'(x)$ e $y''(x)$. Se pide:

      **a)** Identificar qué gráfica corresponde a cada una de las funciones.

      **b)** Considerar la nueva función
      $h(x) = \displaystyle\int_a^{x}y(z)\,dz-y(x)$. Estudiar el crecimiento,
      los extremos, la concavidad y los puntos de inflexión de $h(x)$.

