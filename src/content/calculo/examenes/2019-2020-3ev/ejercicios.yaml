ejercicios:
  - id: ex1920-3ev-1-dos-discos-que-se-solapan
    titulo: Dos condiciones sobre un inverso, y una lente
    fuente: >-
      Ejercicio 1 · Tercera evaluación, 17 de enero de 2020 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3

    enunciado: |
      Calcular y representar geométricamente los afijos de los números complejos
      $z$ que verifican las siguientes condiciones:

      $$
      \mathrm{Re}\left(\frac{1}{z-i}\right) > \frac14
      \qquad \wedge \qquad
      \mathrm{Im}\left(\frac{1}{z-i}\right) > \frac14
      $$
    pide: Calcular la región y representarla.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué simplifica el problema desde el principio?
        opciones:
          - texto: >-
              Llamar $w = z-i$, resolver en $w$ y **trasladar** el resultado al
              final
            correcta: true
            mensaje: |
              Exacto. Las dos condiciones hablan de $\frac1w$, así que en la
              variable $w$ salen dos discos centrados en sitios cómodos. Al
              final se deshace la traslación sumando $i$: la región se mueve,
              no se deforma.
          - texto: >-
              Sustituir $z = x+yi$ desde el primer momento
            mensaje: |
              Funciona, pero arrastra el $y-1$ en todas las cuentas. Con
              $w = z-i$ los números salen más limpios y la traslación se hace
              una sola vez.
          - texto: >-
              Pasar a forma polar
            mensaje: |
              La parte real y la imaginaria en polar son $r\cos\theta$ y
              $r\,\mathrm{sen}\,\theta$: más complicado, no menos.
          - texto: >-
              Elevar las dos condiciones al cuadrado
            mensaje: |
              No hay módulos que elevar: son partes reales e imaginarias, que
              pueden ser negativas. Elevar al cuadrado rompería las
              desigualdades.

      - tipo: calcular
        titulo: El radio de los discos
        pregunta: |
          Cada condición define un disco. ¿Cuál es su radio?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              4 es el inverso de $\frac14$, y es el **diámetro**. De
              $(u-2)^{2}+v^{2}<4$ el radio es 2.
          - valor: '0.25'
            mensaje: |
              $\frac14$ es la cota del enunciado, no una longitud del plano.
          - valor: '1.4142'
            mensaje: |
              $\sqrt2$ saldría de un término independiente 2. Aquí es 4.
        pista: |
          $\mathrm{Re}\frac1w = \frac{u}{u^{2}+v^{2}}$. Multiplica en cruz y
          completa cuadrados.
        desarrollo: |
          Con $w = u+vi$:

          $$
          \frac1w = \frac{\overline w}{\left|w\right|^{2}}
          = \frac{u-vi}{u^{2}+v^{2}}
          $$

          **Primera condición:**

          $$
          \frac{u}{u^{2}+v^{2}} > \frac14
          $$

          El denominador es positivo para todo $w \neq 0$, así que se puede
          multiplicar en cruz:

          $$
          4u > u^{2}+v^{2}
          \;\Longrightarrow\;
          u^{2}-4u+v^{2} < 0
          \;\Longrightarrow\;
          (u-2)^{2}+v^{2} < 4
          $$

          Disco abierto de centro $(2,0)$ y **radio 2**.
        veredicto: |
          Nótese que la desigualdad obliga a $u>0$: un cociente con denominador
          positivo solo es positivo si el numerador lo es. El disco, en efecto,
          está entero en el semiplano derecho.

      - tipo: calcular
        titulo: Los vértices de la región
        pregunta: |
          La región tiene dos vértices. Uno es $z=i$. ¿Cuál es la parte real del
          otro?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              Signo cambiado. Los dos discos están centrados en $(2,0)$ y
              $(0,-2)$ en la variable $w$: su segundo corte cae en $(2,-2)$.
          - valor: '0'
            mensaje: |
              0 es la parte real del **primer** vértice, $z=i$, que corresponde
              a $w=0$.
          - valor: '4'
            mensaje: |
              4 sería el diámetro. Los cortes salen de resolver el sistema, y
              dan $u=0$ y $u=2$.
        pista: |
          Resta las dos ecuaciones de las circunferencias en $w$.
        desarrollo: |
          Las dos circunferencias, desarrolladas:

          $$
          u^{2}+v^{2}-4u = 0,
          \qquad
          u^{2}+v^{2}+4v = 0
          $$

          **Restando:**

          $$
          -4u-4v = 0
          \;\Longrightarrow\;
          v = -u
          $$

          Sustituyendo en la primera:

          $$
          2u^{2} = 4u
          \;\Longrightarrow\;
          u = 0 \ \text{ó}\ u = 2
          $$

          Los cortes en $w$ son $(0,0)$ y $(2,-2)$. Deshaciendo la traslación
          $z = w+i$:

          $$
          z = i \qquad\text{y}\qquad z = 2-i
          $$

          La parte real del segundo es 2.
        veredicto: |
          Los dos discos pasan **los dos** por el origen del plano $w$, que es
          el punto prohibido: ahí el cociente no existe. Por eso ese vértice
          queda fuera de todas formas.

      - tipo: verificar
        pregunta: |
          Escribe las dos condiciones en $x$ e $y$. La figura comprobará si la lente
          que sale coincide con la del enunciado.
        condicion: 're(1/(z-i)) > 1/4 & im(1/(z-i)) > 1/4'
        ventana:
          x: [-3, 5]
          y: [-4, 4]
        formato: en x e y; usa & para juntar las dos condiciones
        pista: |
          Racionaliza $\frac{1}{z-i}$ multiplicando por el conjugado. Al pasar el
          denominador —que es positivo— cada desigualdad se vuelve una circunferencia
          después de completar cuadrados.
        desarrollo: |
          Con $z = x+iy$ y $w = z-i = x+i(y-1)$:

          $$
          \frac{1}{w} = \frac{x - i(y-1)}{x^{2}+(y-1)^{2}}
          $$

          La primera condición, $\frac{x}{x^{2}+(y-1)^{2}} > \frac14$, da
          $x^{2}-4x+(y-1)^{2} < 0$, es decir

          $$
          (x-2)^{2}+(y-1)^{2} < 4
          $$

          La segunda, $\frac{-(y-1)}{x^{2}+(y-1)^{2}} > \frac14$, da
          $x^{2}+(y-1)^{2}+4(y-1) < 0$, es decir

          $$
          x^{2}+(y+1)^{2} < 4
          $$
        veredicto: |
          La **lente** que forman los dos discos abiertos de radio $2$, centrados en
          $2+i$ y en $-i$. Los dos bordes van discontinuos, y el origen queda fuera
          porque ahí no se puede dividir.
      - tipo: justificar
        pregunta: |
          Ordena la descripción de la región. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Trasladar.** Con $w = z-i$, las dos condiciones son sobre
              $\frac1w$, y $\frac1w = \frac{u-vi}{u^{2}+v^{2}}$.
          - texto: |
              **Primera condición:** $\frac{u}{u^{2}+v^{2}}>\frac14$ da
              $(u-2)^{2}+v^{2}<4$: disco de centro $(2,0)$ y radio 2.
          - texto: |
              **Segunda condición:** ojo al signo, porque
              $\mathrm{Im}\frac1w = \frac{-v}{u^{2}+v^{2}}$. Sale
              $u^{2}+(v+2)^{2}<4$: disco de centro $(0,-2)$ y radio 2.
          - texto: |
              **La intersección** de dos discos que se cortan es una **lente**,
              con vértices en los dos puntos de corte: $w=0$ y $w=2-2i$.
          - texto: |
              **Deshacer la traslación** sumando $i$: la lente tiene vértices en
              $z=i$ y $z=2-i$, y sus discos están centrados en $2+i$ y $-i$.
          - texto: |
              El punto $z=i$ hay que excluirlo aparte, porque ahí el cociente no
              está definido.
            trampa: true
            mensaje: |
              Ya está excluido: es un **vértice** de la lente, y los dos discos
              son abiertos, así que todo el borde queda fuera. Mencionar que el
              punto es singular está bien; presentarlo como una exclusión
              adicional sugiere que sin ella estaría dentro, y no es el caso.
              Comprobarlo cuesta una sustitución.
        veredicto: |
          El signo menos de la parte imaginaria del inverso es lo que coloca el
          segundo disco **debajo** del eje real. Es el error más frecuente aquí.

    resolucion: |
      **Datos.** Dos desigualdades sobre la parte real y la parte imaginaria de
      $\frac{1}{z-i}$.

      ### 1 · Trasladar primero

      Las dos condiciones hablan de $z-i$. Llamando

      $$
      w = z-i = u+vi
      $$

      se resuelve en $w$ y al final se deshace la traslación con $z = w+i$: la
      región se **mueve** una unidad hacia arriba, sin deformarse.

      $$
      \frac1w = \frac{\overline w}{\left|w\right|^{2}}
      = \frac{u-vi}{u^{2}+v^{2}}
      $$

      $$
      \mathrm{Re}\frac1w = \frac{u}{u^{2}+v^{2}},
      \qquad
      \mathrm{Im}\frac1w = \frac{-v}{u^{2}+v^{2}}
      $$

      **El signo menos de la parte imaginaria** es lo que más se olvida, y
      cambia el resultado entero.

      ### 2 · La primera condición

      $$
      \frac{u}{u^{2}+v^{2}} > \frac14
      $$

      El denominador es **estrictamente positivo** para todo $w \neq 0$, así que
      se puede multiplicar en cruz sin invertir el signo:

      $$
      4u > u^{2}+v^{2}
      \;\Longrightarrow\;
      u^{2}-4u+v^{2} < 0
      $$

      $$
      \boxed{(u-2)^{2}+v^{2} < 4}
      $$

      Disco abierto de centro $(2,0)$ y radio 2. Nótese que pasa por el origen
      —la distancia del centro al origen es 2, justo el radio—.

      ### 3 · La segunda condición

      $$
      \frac{-v}{u^{2}+v^{2}} > \frac14
      \;\Longrightarrow\;
      -4v > u^{2}+v^{2}
      \;\Longrightarrow\;
      u^{2}+v^{2}+4v < 0
      $$

      $$
      \boxed{u^{2}+(v+2)^{2} < 4}
      $$

      Disco abierto de centro $(0,-2)$ y radio 2. También pasa por el origen.

      ### 4 · La intersección

      Los dos centros distan

      $$
      \sqrt{2^{2}+2^{2}} = 2\sqrt2 \approx 2{,}83 < 4 = r_1+r_2
      $$

      así que **se cortan**, y la intersección es una **lente**.

      Los puntos de corte, restando las dos ecuaciones desarrolladas
      $u^{2}+v^{2}-4u = 0$ y $u^{2}+v^{2}+4v = 0$:

      $$
      -4u-4v = 0
      \;\Longrightarrow\;
      v = -u
      $$

      $$
      2u^{2} = 4u
      \;\Longrightarrow\;
      u = 0 \ \text{ó}\ u = 2
      $$

      $$
      w = 0 \qquad\text{y}\qquad w = 2-2i
      $$

      ### 5 · Deshacer la traslación

      $$
      z = w+i
      $$

      | en $w$ | en $z$ |
      |---|---|
      | disco de centro $(2,0)$, radio 2 | $\left\lvert z-(2+i)\right\rvert<2$ |
      | disco de centro $(0,-2)$, radio 2 | $\left\lvert z+i\right\rvert<2$ |
      | vértices $0$ y $2-2i$ | $i$ y $2-i$ |

      $$
      \boxed{
      \begin{aligned}
      &\text{La LENTE abierta que forman los discos}\\
      &\left\lvert z-2-i\right\rvert<2 \ \text{ y } \ \left\lvert z+i\right\rvert<2,\\
      &\text{con vértices en } i \text{ y } 2-i
      \end{aligned}}
      $$

      **El punto $z=i$** —donde el cociente no está definido— es uno de los
      vértices, y los discos son abiertos: ya está fuera. No hay que quitarlo
      aparte.

      <figure class="figura-examen">
      <svg viewBox="0 0 520 480" role="img" width="500" height="462"
