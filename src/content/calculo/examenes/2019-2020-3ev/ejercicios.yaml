      **La coherencia con (a):** en $P$ la tangente a esa circunferencia es
      **horizontal** y el gradiente es **vertical**. Perpendiculares, como
      manda la teoría: el gradiente siempre es normal a las curvas de nivel.

      ### 5 · Apartado (c): dónde hay más

      No hace falta derivar. El exponente

      $$
      -(x-1)^{2}-(y-1)^{2}
      $$

      es una suma de cuadrados con signo menos: siempre $\le0$, y vale $0$
      **solo** en $(1,1)$. Como la exponencial es creciente, ahí está su máximo:

      $$
      \boxed{\text{Máximo absoluto en } (1,1), \text{ con } f(1,1) = 1}
      $$

      Y es **absoluto**, no solo local: el argumento de acotación lo dice en el
      resto del plano, sin necesidad de hessiana.

      Como comprobación, el gradiente se anula ahí:

      $$
      \nabla f(1,1) = \left(-2\cdot0\cdot1,\ -2\cdot0\cdot1\right) = (0,0)
      \quad\checkmark
      $$

      ### 6 · Comprobación

      **Del valor en $P$:** $f(1,0) = \mathrm{e}^{-1} = 0{,}368$, y en el
      máximo vale 1: la cucaracha está a algo más de un tercio del máximo ✔

      **De la dirección de huida, numéricamente.** Bajando $0{,}1$ desde $P$:

      $$
      f(1;-0{,}1) = \mathrm{e}^{-1{,}21} = 0{,}2982
      $$

      $$
      \frac{0{,}2982-0{,}3679}{0{,}1} = -0{,}697
      $$

      frente a $-\frac{2}{\mathrm{e}} = -0{,}736$ ✔ La pequeña diferencia es el
      término de segundo orden.

      **Y moviéndose en horizontal,** que debería no cambiar nada a primer
      orden:

      $$
      f(1{,}1;\,0) = \mathrm{e}^{-1{,}01} = 0{,}3642
      $$

      $$
      \frac{0{,}3642-0{,}3679}{0{,}1} = -0{,}037 \approx 0 \quad\checkmark
      $$

      Casi cero: la dirección horizontal es tangente a la curva de nivel ✔ Es la
      comprobación numérica de que la respuesta a (b) es la correcta.
