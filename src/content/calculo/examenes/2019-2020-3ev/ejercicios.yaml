        <defs>
          <clipPath id="c1920lente">
            <circle cx="300" cy="180" r="120"></circle>
          </clipPath>
        </defs>

        <g clip-path="url(#c1920lente)">
          <circle cx="180" cy="300" r="120" fill="var(--live)"
                  fill-opacity="0.20"></circle>
        </g>

        <g stroke="var(--rule)" stroke-width="1.6" fill="none">
          <circle cx="300" cy="180" r="120"></circle>
          <circle cx="180" cy="300" r="120"></circle>
        </g>

        <g stroke="var(--graphite)" stroke-width="1.3" fill="none">
          <path d="M40 240 L480 240 M180 40 L180 440"></path>
        </g>

        <g fill="var(--flag)">
          <circle cx="180" cy="180" r="6"></circle>
          <circle cx="300" cy="300" r="6"></circle>
        </g>
        <g fill="var(--graphite)">
          <circle cx="300" cy="180" r="4"></circle>
          <circle cx="180" cy="300" r="4"></circle>
        </g>

        <g fill="var(--graphite)" font-size="13" font-family="var(--mono)">
          <text x="156" y="260">0</text>
          <text x="458" y="232">Re</text>
          <text x="188" y="54">Im</text>
          <text x="308" y="174">2+i</text>
          <text x="140" y="322">-i</text>
        </g>
        <g fill="var(--flag)" font-size="13" font-family="var(--mono)">
