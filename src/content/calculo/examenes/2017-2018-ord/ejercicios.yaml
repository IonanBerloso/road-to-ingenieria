      <figcaption>
      La recta y = x y la curva. Se cortan una sola vez, en x = 3, y la curva
      se mantiene dentro del cuadrado: eso es exactamente lo que piden las
      hipótesis del teorema.
      </figcaption>
      </figure>

      **Y cuál es.** El teorema no la da, pero aquí se despeja: elevando al
      cuadrado, $x^{2}=2x+3$, o sea $x^{2}-2x-3=0$, con raíces $3$ y $-1$. La
      segunda hay que descartarla, y no solo por estar fuera del intervalo: al
      elevar al cuadrado se añaden soluciones, y $-1=\sqrt{1}$ es falso.

      $$
      \boxed{\;x=3\;}
      $$

      **Lo que hay que llevarse.** El teorema sirve para saber que **hay**
      solución y que es **una sola** antes de intentar despejarla. Aquí se puede
      despejar, así que la gracia no está en el número: está en que el mismo
      argumento funcionaría con una ecuación imposible de resolver a mano.

  - id: ex1718-ord-3-el-rectangulo-inscrito
    titulo: Entre todos los rectángulos inscritos, el cuadrado
    fuente: >-
      Ejercicio 3 del PRIMER CUATRIMESTRAL · Convocatoria de mayo, 30 de mayo de
      2018 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 8
      comp4: 1
    enunciado: |
      Se inscribe un rectángulo de base $b$ y altura $h$ en una circunferencia
      de radio $r$. Si el centro del rectángulo coincide con el de la
      circunferencia, calcular las dimensiones del rectángulo para que su área
      sea máxima. Obtener el valor de dicha área.
    pide: La base, la altura y el área máxima, en función de r.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué ligadura relaciona $b$, $h$ y $r$?
        opciones:
          - texto: $b^{2}+h^{2}=(2r)^{2}$
            correcta: true
            mensaje: |
              Eso es. Al estar el rectángulo centrado en la circunferencia, su
              diagonal pasa por el centro y es un **diámetro**. Pitágoras sobre
              el triángulo que forman base, altura y diagonal da la relación.
          - texto: $b+h=2r$
            mensaje: |
              Eso sería si base y altura fueran lados de un triángulo alineados
              con el diámetro. Lo que vale $2r$ es la **diagonal**, y con la
              diagonal se relaciona por Pitágoras, no sumando.
          - texto: $b\,h=\pi r^{2}$
            mensaje: |
              Eso igualaría el área del rectángulo a la del círculo, y un
              rectángulo inscrito siempre tiene menos área que el círculo que lo
              contiene. Además el área es lo que se quiere maximizar, no un
              dato.

      - tipo: calcular
        titulo: El lado del rectángulo óptimo
        pregunta: |
          Con $r=5$, ¿cuánto mide la base del rectángulo de área máxima?
        respuesta:
          tipo: numero
          valor: '7.0710678'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '10'
            mensaje: |
              $10$ es el diámetro, es decir, la **diagonal** del rectángulo. La
              base es el cateto, y en el cuadrado óptimo mide
              $\frac{2r}{\sqrt2}=r\sqrt2$.
          - valor: '5'
            mensaje: |
              $5$ es el radio. El rectángulo óptimo es un cuadrado de lado
              $r\sqrt2\approx7{,}07$, no de lado $r$: un cuadrado de lado $r$
              cabría de sobra dentro y no sería el mayor.
          - valor: '3.5355339'
            mensaje: |
              Ese es $\frac{r\sqrt2}{2}$, la **media** base. El enunciado pide la
              base entera.
        pista: |
          $A=b\sqrt{4r^{2}-b^{2}}$, y su máximo está donde $b=h$.
        desarrollo: |
          De $b^{2}+h^{2}=4r^{2}$ sale $h=\sqrt{4r^{2}-b^{2}}$, y

          $$
          A(b)=b\sqrt{4r^{2}-b^{2}}
          $$

          Es más cómodo maximizar $A^{2}=b^{2}\left(4r^{2}-b^{2}\right)$, que
          tiene el máximo en el mismo sitio porque $A>0$:

          $$
          \left(A^{2}\right)'=8r^{2}b-4b^{3}=4b\left(2r^{2}-b^{2}\right)=0
          \;\Longrightarrow\;
          b=r\sqrt2
          $$

          Con $r=5$: $b=5\sqrt2\approx7{,}071$.

      - tipo: calcular
        titulo: El área máxima
        pregunta: |
          El área máxima vale $A=k\,r^{2}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              $4r^{2}$ es el área del cuadrado **circunscrito**, el de lado
              $2r$. El inscrito es la mitad: gira $45^{\circ}$ respecto de aquel
              y sus vértices tocan la circunferencia.
          - valor: '3.1415927'
            mensaje: |
              $\pi r^{2}$ es el área del **círculo**. El rectángulo inscrito
              tiene que ser menor, y en efecto $2<\pi$: se queda con el $64\,\%$
              del círculo.
          - valor: '1.4142136'
            mensaje: |
              $\sqrt2\,r^{2}$ saldría de multiplicar $r\sqrt2$ por $r$. La altura
              del cuadrado óptimo también es $r\sqrt2$, no $r$.
        pista: |
          Si $b=h=r\sqrt2$, el área es el producto.
        desarrollo: |
          $$
          h=\sqrt{4r^{2}-2r^{2}}=r\sqrt2=b
          $$

          El rectángulo óptimo es un **cuadrado**, y

          $$
          A=b\,h=\left(r\sqrt2\right)^{2}=2r^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la optimización. Una pieza es falsa.
        piezas:
          - texto: >-
              Como el rectángulo está centrado en la circunferencia, su diagonal
              es un diámetro y $b^{2}+h^{2}=4r^{2}$.
          - texto: >-
              Despejando $h$ y sustituyendo, $A(b)=b\sqrt{4r^{2}-b^{2}}$ con
              $b\in(0,2r)$; conviene maximizar $A^{2}$, que da el mismo punto
              porque $A$ es positiva.
          - texto: >-
              $\left(A^{2}\right)'=4b\left(2r^{2}-b^{2}\right)$ se anula en
              $b=r\sqrt2$, y ahí $h=r\sqrt2$ también: el óptimo es el cuadrado,
              de área $2r^{2}$.
          - texto: >-
              El máximo está en los extremos del intervalo, donde el rectángulo
              es más alargado.
            trampa: true
            mensaje: |
              En los extremos el área vale **cero**: con $b\to0$ el rectángulo
              es un segmento vertical y con $b\to2r$ es uno horizontal. Los
              extremos son los mínimos, no el máximo. Comprobarlo es además la
              forma limpia de justificar que el punto crítico interior es
              máximo absoluto, sin tener que derivar dos veces.
    resolucion: |
      **La ligadura, que es puro Pitágoras.** El rectángulo está centrado en la
      circunferencia, así que su diagonal pasa por el centro y mide $2r$:

      $$
      b^{2}+h^{2}=4r^{2}
      $$

      <figure class="figura-examen">
      <svg viewBox="0 0 350 330" role="img" width="350" height="330"
           aria-labelledby="rec18-t rec18-d">
        <title id="rec18-t">El rectangulo inscrito de area maxima</title>
        <desc id="rec18-d">Una circunferencia con un rectangulo inscrito centrado en
        ella. La diagonal del rectangulo pasa por el centro y es un diametro. En el
        caso de area maxima el rectangulo es un cuadrado, con el lado igual al radio
        por raiz de dos.</desc>
        <style>
          .rec18-c { stroke: var(--graphite); stroke-width: 1.6; fill: none; }
          .rec18-r { fill: var(--live); fill-opacity: .15; stroke: var(--live); stroke-width: 2.4; }
          .rec18-d { stroke: var(--alt); stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
          .rec18-eje { stroke: var(--graphite); stroke-width: 1.1; fill: none; opacity: .6; }
          .rec18-pt { fill: var(--alt); }
          .rec18-n { fill: var(--faint); font-size: 11px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
          .rec18-et { fill: var(--live); font-size: 13px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round; }
          .rec18-ea { fill: var(--alt); font-size: 12px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round; }
        </style>
        <path class="rec18-eje" d="M46.8 165L303.3 165M175 293.3L175 36.8"/>
        <circle class="rec18-c" cx="175" cy="165" r="95"/>
        <rect class="rec18-r" x="107.8" y="97.8" width="134.4" height="134.4"/>
        <path class="rec18-d" d="M107.8 232.2L242.2 97.8"/>
        <circle class="rec18-pt" cx="175" cy="165" r="3.4"/>
        <g class="rec18-n">
          <text x="270" y="180" text-anchor="middle">r</text>
        </g>
        <text class="rec18-et" x="175" y="250.2" text-anchor="middle">b = r√2</text>
        <text class="rec18-et" x="250.2" y="169">h = r√2</text>
        <text class="rec18-ea" x="116.1" y="191.6" text-anchor="end">diagonal = 2r</text>
      </svg>
      <figcaption>
      El rectángulo inscrito y su diagonal, que es un diámetro. En el caso de
      área máxima base y altura coinciden: el óptimo es un cuadrado de lado
      r√2.
      </figcaption>
      </figure>

      **La función a maximizar.**

      $$
      A(b)=b\,h=b\sqrt{4r^{2}-b^{2}},\qquad 0<b<2r
      $$

      **El truco que ahorra la raíz.** Maximizar $A$ es lo mismo que maximizar
      $A^{2}$, porque $A>0$ y elevar al cuadrado conserva el orden:

      $$
      A^{2}=b^{2}\left(4r^{2}-b^{2}\right)=4r^{2}b^{2}-b^{4}
      $$

      $$
      \left(A^{2}\right)'=8r^{2}b-4b^{3}=4b\left(2r^{2}-b^{2}\right)=0
      \;\Longrightarrow\;
      b=r\sqrt2
      $$

      **El resultado.**

      $$
      h=\sqrt{4r^{2}-2r^{2}}=r\sqrt2=b
      \qquad\Longrightarrow\qquad
      \boxed{\;b=h=r\sqrt2,\quad A_{\max}=2r^{2}\;}
      $$

      **Que es máximo, y por qué basta con decirlo así.** En los dos extremos
      del intervalo el área vale cero, y dentro solo hay un punto crítico: tiene
      que ser el máximo. Eso es más corto y más convincente que calcular la
      segunda derivada.

      **La comprobación de sentido.** El círculo tiene área $\pi r^{2}\approx
      3{,}14r^{2}$ y el cuadrado inscrito $2r^{2}$: se queda con un $64\,\%$.
      Razonable para una figura recta metida dentro de una redonda.

