        <text class="tri18-et" x="190.1" y="107">f(t) = |t|</text>
      </svg>
      <figcaption>
      La extensión par y periódica. Es continua en todo el eje: en los múltiplos
      impares de π los dos tramos llegan al mismo valor, y lo que hay es un pico,
      no un salto.
      </figcaption>
      </figure>

      Mirarla antes de calcular resuelve sola el apartado d): **no hay ni un
      salto**.

      **c) La serie.** Al ser par, $b_{n}=0$ y las integrales se hacen sobre
      media onda, duplicando:

      $$
      \frac{a_{0}}{2}=\frac{1}{\pi}\int_{0}^{\pi}t\,dt=\frac{\pi}{2}
      $$

      $$
      a_{n}=\frac{2}{\pi}\int_{0}^{\pi}t\cos(nt)\,dt
      =\frac{2\left((-1)^{n}-1\right)}{\pi n^{2}}
      $$

      $$
      S(t)=\frac{\pi}{2}-\frac{4}{\pi}
      \left(\cos t+\frac{\cos 3t}{9}+\frac{\cos 5t}{25}+\cdots\right)
      $$

      **d) Los dos valores.** La extensión es continua, así que la serie
      converge a la función en todo punto:

      $$
      S(0)=\tilde f(0)=0,
      \qquad
      S(\pi)=\tilde f(\pi)=\pi
      $$

      Sobre $f(\pi)$ hay que ser exacto: el enunciado define $f$ en $[0,\pi)$,
      **abierto por la derecha**, así que $f(\pi)$ no está dado. Quien pone ahí
      un valor es la extensión, y vale $\pi$.

      **e) La suma.** El punto bueno es $t=0$, donde todos los cosenos valen
      $1$ y la serie iguala a la función:

      $$
      0=\frac{\pi}{2}-\frac{4}{\pi}\sum_{n=1}^{\infty}\frac{1}{(2n-1)^{2}}
      \;\Longrightarrow\;
      \sum_{n=1}^{\infty}\frac{1}{(2n-1)^{2}}=\frac{\pi^{2}}{8}
      $$

      **La comprobación independiente.** $\sum\frac{1}{n^{2}}=\frac{\pi^{2}}{6}$
      (Basilea) y los pares suman
      $\frac14\cdot\frac{\pi^{2}}{6}=\frac{\pi^{2}}{24}$; la diferencia es
      $\frac{\pi^{2}}{8}$ ✓.

      **Y un apunte sobre la familia.** Este mismo $\frac{\pi^{2}}{8}$ sale en
      la ordinaria de 2020-2021 con la extensión par de $2\pi-t$ y en la de
      2018-2019 con un diente de sierra que vale cero en media onda. Tres
      enunciados distintos, la misma suma: no es casualidad, es que todas las
      ondas triangulares tienen coeficientes en $\frac{1}{n^{2}}$ y evaluarlas
      donde los cosenos valen $1$ produce siempre esta serie.
