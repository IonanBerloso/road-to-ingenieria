      **Por qué sale cero, sin cuentas.** Los dos números son conjugados, así
      que sus potencias también lo son, y la suma de un complejo con su
      conjugado es $2\operatorname{Re}$. Como la potencia cae en el eje
      imaginario, esa parte real es cero. Ese argumento vale como comprobación y
      como respuesta al apartado formal.

  - id: ex1718-ord-2-el-punto-fijo-de-una-raiz
    titulo: Una ecuación que tiene solución sin llegar a resolverla
    fuente: >-
      Ejercicio 2 del PRIMER CUATRIMESTRAL · Convocatoria de mayo, 30 de mayo de
      2018 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 5
      comp4: 4
    enunciado: |
      a) Enunciar, sin demostrar, el teorema de existencia y unicidad del punto
      fijo.

      b) Aplicando el teorema anterior, razonar si la igualdad $x=\sqrt{2x+3}$
      tiene solución en el intervalo $\left[0,4\right]$. ¿Es única esa solución?
    pide: El enunciado del teorema, y la comprobación de sus hipótesis en este caso.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que comprobar para aplicar el teorema del punto fijo a
          $g$ en $[a,b]$?
        opciones:
          - texto: >-
              Que $g$ sea continua y que $g\left([a,b]\right)\subseteq[a,b]$; y
              para la unicidad, que sea contractiva
            correcta: true
            mensaje: |
              Eso es, y son dos cosas separadas: la continuidad más «no salirse
              del intervalo» dan la **existencia**; la contractividad
              —$\left|g'\right|\le k<1$— da la **unicidad**. Muchas respuestas
              pierden puntos por mezclarlas.
          - texto: Que $g$ sea derivable en todo $\mathbb{R}$
            mensaje: |
              Ni hace falta en todo $\mathbb{R}$ ni basta con eso. La
              derivabilidad se usa solo para acotar $\left|g'\right|$ y probar la
              unicidad; la existencia sale de la continuidad y de que la imagen
              no se escape.
          - texto: Que $g$ tenga un cero en el intervalo
            mensaje: |
              Un punto fijo no es un cero: es un punto donde $g(x)=x$, no donde
              $g(x)=0$. Precisamente el teorema se demuestra aplicando Bolzano a
              $h(x)=g(x)-x$, que sí es un cero, pero de otra función.

      - tipo: calcular
        titulo: Dónde manda g al intervalo
        pregunta: |
          Con $g(x)=\sqrt{2x+3}$, ¿cuál es el valor **máximo** de $g$ en
          $[0,4]$?
        respuesta:
          tipo: numero
          valor: '3.3166248'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.7320508'
            mensaje: |
              $\sqrt3$ es el **mínimo**, el valor en $x=0$. La función crece, así
              que el máximo está en el otro extremo, $x=4$.
          - valor: '4'
            mensaje: |
              Cuatro es el extremo del intervalo, no el valor de $g$ ahí:
              $g(4)=\sqrt{11}\approx3{,}32$. Que salga **menor** que $4$ es
              justo lo que hace falta.
          - valor: '11'
            mensaje: |
              $11$ es $2\cdot4+3$, lo de dentro de la raíz. Falta sacarla.
        pista: |
          $g$ es creciente, así que el máximo está en $x=4$.
        desarrollo: |
          $$
          g(0)=\sqrt3\approx1{,}73,
          \qquad
          g(4)=\sqrt{11}\approx3{,}32
          $$

          $$
          g\left([0,4]\right)=\left[\sqrt3,\sqrt{11}\right]\subset[0,4]
          \;\checkmark
          $$

      - tipo: calcular
        titulo: La constante de contracción
        pregunta: |
          ¿Cuál es el valor máximo de $\left|g'\right|$ en $[0,4]$?
        respuesta:
          tipo: numero
          valor: '0.5773503'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.3015113'
            mensaje: |
              Ese es $\left|g'(4)\right|=\frac{1}{\sqrt{11}}$, el **mínimo**.
              $g'=\frac{1}{\sqrt{2x+3}}$ decrece, así que su máximo está en
              $x=0$.
          - valor: '1'
            mensaje: |
              Uno sería el caso límite, y entonces el teorema no garantizaría
              unicidad. Aquí la cota es estrictamente menor: $\frac{1}{\sqrt3}
              \approx0{,}58$.
          - valor: '1.7320508'
            mensaje: |
              $\sqrt3$ es el valor de $g(0)$, no de $g'(0)$. La derivada lleva la
              raíz en el **denominador**.
        pista: |
          $g'(x)=\dfrac{1}{\sqrt{2x+3}}$, y ese cociente es mayor donde el
          denominador es menor.
        desarrollo: |
          $$
          g'(x)=\frac{2}{2\sqrt{2x+3}}=\frac{1}{\sqrt{2x+3}}
          $$

          Decrece, así que su máximo en $[0,4]$ está en $x=0$:

          $$
          \max_{[0,4]}\left|g'\right|=\frac{1}{\sqrt3}\approx0{,}577<1
          \;\checkmark
          $$

          Contractiva, luego el punto fijo es **único**.

      - tipo: justificar
        pregunta: Ordena el razonamiento del apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              La igualdad $x=\sqrt{2x+3}$ es un problema de punto fijo para
              $g(x)=\sqrt{2x+3}$, que es continua en $[0,4]$ porque el radicando
              es positivo en todo el intervalo.
          - texto: >-
              $g$ es creciente y $g\left([0,4]\right)=
              \left[\sqrt3,\sqrt{11}\right]\subset[0,4]$: la imagen no se sale,
              así que **existe** al menos un punto fijo.
          - texto: >-
              Además $\left|g'\right|\le\frac{1}{\sqrt3}<1$ en todo el intervalo,
              luego $g$ es contractiva y el punto fijo es **único**; resolviendo,
              $x^{2}=2x+3$ da $x=3$ —y $x=-1$, que se descarta por estar fuera—.
          - texto: >-
              Como $g$ es creciente, el punto fijo es automáticamente único.
            trampa: true
            mensaje: |
              Crecer no basta. $g(x)=2x$ es creciente y tiene un punto fijo;
              $g(x)=x$ es creciente y tiene infinitos. Lo que da la unicidad es
              que la pendiente esté **acotada por debajo de 1**, que es una
              condición mucho más fuerte: significa que $g$ acerca los puntos
              entre sí.
    resolucion: |
      **a) El teorema.** Este apartado vale la mitad de los puntos de
      explicación formal, así que conviene escribirlo entero y separando las dos
      conclusiones:

      > Sea $g$ continua en $[a,b]$ con $g\left([a,b]\right)\subseteq[a,b]$.
      > Entonces **existe** al menos un $c\in[a,b]$ con $g(c)=c$.
      > Si además $g$ es derivable en $(a,b)$ y existe $k<1$ tal que
      > $\left|g'(x)\right|\le k$ para todo $x$, ese punto fijo es **único**.

      La existencia es Bolzano disfrazado: se aplica a $h(x)=g(x)-x$, que cumple
      $h(a)\ge0$ y $h(b)\le0$.

      **b) Las tres comprobaciones.** La igualdad $x=\sqrt{2x+3}$ es
      exactamente $x=g(x)$ con $g(x)=\sqrt{2x+3}$.

      1. **Continuidad.** El radicando $2x+3$ vale entre $3$ y $11$ en $[0,4]$:
         positivo, así que $g$ es continua allí.
      2. **La imagen no se sale.** $g$ es creciente, luego
         $g\left([0,4]\right)=\left[\sqrt3,\sqrt{11}\right]\approx[1{,}73,\,
         3{,}32]$, que cabe dentro de $[0,4]$. **Existe** solución.
      3. **Contracción.** $g'(x)=\frac{1}{\sqrt{2x+3}}$, que en $[0,4]$ está
         acotada por $\frac{1}{\sqrt3}\approx0{,}58<1$. La solución es
         **única**.

      <figure class="figura-examen">
      <svg viewBox="0 0 360 340" role="img" width="360" height="340"
           aria-labelledby="pf18-t pf18-d">
        <title id="pf18-t">La recta y igual a x contra la raiz</title>
        <desc id="pf18-d">Dentro del cuadrado de lado cuatro, la diagonal y igual a x
        y una curva creciente y muy tumbada que sale de raiz de tres y termina en raiz
        de once. Se cortan una sola vez, en el punto tres coma tres. La curva se
        mantiene siempre dentro del cuadrado, que es la hipotesis del teorema.</desc>
