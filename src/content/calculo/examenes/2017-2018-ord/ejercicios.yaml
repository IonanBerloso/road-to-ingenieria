        <g class="esp18-n">
          <text x="388.6" y="114">x</text>
          <text x="156" y="30.8">y</text>
          <text x="252" y="114" text-anchor="middle">3</text>
        </g>
        <text class="esp18-et" x="142" y="92" text-anchor="end">A</text>
        <text class="esp18-et" x="357.6" y="90" text-anchor="end">B(2π, 0)</text>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original. La espiral va de A, en el
      origen, hasta B, en 2π; la zona sombreada es la que encierra con el
      segmento del eje horizontal que cierra el camino.
      </figcaption>
      </figure>

      a) Calcular el trabajo efectuado por $\vec{V}$ al trasladar una partícula
      desde el punto $A=(0,0)$ hasta el punto $B=(2\pi,0)$ siguiendo la espiral.

      b) Calcular el área de la figura sombreada.
    pide: El trabajo y el área, que salen el mismo número.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tiene de especial este campo?
        opciones:
          - texto: >-
              Que su rotacional vale $1$, y por Green eso convierte la
              circulación cerrada en el área encerrada
            correcta: true
            mensaje: |
              Eso es, y explica por qué el enunciado elige precisamente
              $\left(-\frac y2,\frac x2\right)$: con
              $\frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}=1$,
              la integral doble de Green es $\iint 1\,dA$, que es el área.
          - texto: Que es conservativo
            mensaje: |
              No lo es: si el rotacional fuera cero el trabajo dependería solo de
              los extremos, y entonces el apartado b) no tendría con qué
              calcularse. Es justo lo contrario lo que hace funcionar el
              ejercicio.
          - texto: >-
              Que su módulo es constante a lo largo de la espiral
            mensaje: |
              El módulo es $\frac{\sqrt{x^{2}+y^{2}}}{2}=\frac{t}{2}$, que crece
              con $t$: el campo es más intenso cuanto más lejos del origen. No es
              constante, y además no sería relevante.

      - tipo: calcular
        titulo: La simplificación clave
        pregunta: |
          A lo largo de la espiral, $x\,y'-y\,x'$ se simplifica muchísimo.
          ¿Cuánto vale en $t=3$?
        respuesta:
          tipo: numero
          valor: '9'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              La combinación vale $t^{2}$, no $t$. Al desarrollarla aparece
              $t^{2}\left(\cos^{2}t+\operatorname{sen}^{2}t\right)$, y el
              paréntesis vale $1$.
          - valor: '1'
            mensaje: |
              El $1$ es el $\cos^{2}t+\operatorname{sen}^{2}t$ que sale de la
              simplificación, pero queda multiplicado por $t^{2}$.
          - valor: '27'
            mensaje: |
              $t^{3}$ aparece **después** de integrar, no antes. Aquí se pregunta
              por el integrando.
        pista: |
          $x'=\cos t-t\operatorname{sen}t$ e
          $y'=\operatorname{sen}t+t\cos t$; multiplica y verás cancelarse los
          productos cruzados.
        desarrollo: |
          $$
          x\,y'-y\,x'
          =t\cos t\left(\operatorname{sen}t+t\cos t\right)
          -t\operatorname{sen}t\left(\cos t-t\operatorname{sen}t\right)
          =t^{2}
          $$

          En $t=3$ vale $9$.

      - tipo: calcular
        titulo: El trabajo
        pregunta: |
          ¿Cuánto vale el trabajo a lo largo de la espiral?
        respuesta:
          tipo: numero
          valor: '41.3417'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '82.6834'
            mensaje: |
              El doble: te has dejado el $\frac12$ del campo. El integrando es
              $\frac12\left(xy'-yx'\right)$.
          - valor: '124.0251'
            mensaje: |
              Has integrado $t^{2}$ como $t^{3}$ en vez de $\frac{t^{3}}{3}$.
          - valor: '9.8696'
            mensaje: |
              $\pi^{2}$ sale de integrar $t$ en lugar de $t^{2}$. Revisa la
              simplificación: la combinación vale $t^{2}$.
        pista: |
          $W=\frac12\int_{0}^{2\pi}t^{2}\,dt$.
        desarrollo: |
          $$
          W=\frac12\int_{0}^{2\pi}t^{2}\,dt
          =\frac{(2\pi)^{3}}{6}=\frac{4\pi^{3}}{3}\approx41{,}342
          $$

      - tipo: justificar
        pregunta: Ordena el paso del trabajo al área. Una pieza es falsa.
        piezas:
          - texto: >-
              La frontera del recinto sombreado es la espiral de $A$ a $B$
              seguida del segmento del eje $x$ de $B$ a $A$.
          - texto: >-
              Sobre ese segmento $y=0$ y $dy=0$, así que las dos componentes del
              campo aportan cero y la circulación cerrada vale lo mismo que el
              trabajo del apartado a).
          - texto: >-
              Por Green, esa circulación es
              $\iint_{D}\left(\frac{\partial Q}{\partial x}-
              \frac{\partial P}{\partial y}\right)dA=\iint_{D}1\,dA$, es decir,
              el área.
          - texto: >-
              Hace falta además que el campo sea conservativo para poder aplicar
              el teorema de Green.
            trampa: true
            mensaje: |
              Green no pide nada de eso: pide que el campo sea de clase $C^{1}$
              en un abierto que contenga al recinto y que la curva sea cerrada,
              simple y positivamente orientada. Y si el campo fuera
              conservativo, el teorema daría **cero**, que no sirve para medir
              un área. Es precisamente por **no** serlo por lo que el ejercicio
              funciona.
    resolucion: |
      **Antes de nada:** este ejercicio es el mismo, con la misma figura, que el
      2 del segundo parcial de la convocatoria ordinaria de 2022-2023. Cuatro
      años después volvió a caer sin cambiar ni un signo. Que un enunciado se
      repita es la señal más fiable de que conviene tenerlo hecho.

      **a) El trabajo.** Parametrizando,

      $$
      W=\int_{0}^{2\pi}\left(-\frac y2\,x'+\frac x2\,y'\right)dt
      =\frac12\int_{0}^{2\pi}\left(x\,y'-y\,x'\right)dt
      $$

      y esa combinación se derrumba:

      $$
      x\,y'-y\,x'
      =t\cos t\left(\operatorname{sen}t+t\cos t\right)
      -t\operatorname{sen}t\left(\cos t-t\operatorname{sen}t\right)
      =t^{2}
      $$

      $$
      W=\frac12\int_{0}^{2\pi}t^{2}\,dt=\frac{4\pi^{3}}{3}\approx41{,}34
      $$

      **b) El área, sin integrar otra vez.** Para
      $\vec V=\left(-\frac y2,\frac x2\right)$,

      $$
      \frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}
      =\frac12+\frac12=1
      $$

      así que Green convierte la circulación por cualquier curva cerrada simple
      en el área encerrada. El cierre natural es el segmento del eje $x$ de $B$
      a $A$: allí $y=0$ y $dy=0$, y el tramo no aporta nada.

      $$
      \text{área}=W=\frac{4\pi^{3}}{3}\approx41{,}34
      $$

      **La señal que hay que aprender a ver.** Cuando en un examen aparezca el
      campo $\left(-\frac y2,\frac x2\right)$ —o $(-y,x)$, o $(0,x)$—, calcula
      el rotacional antes de nada: si sale $1$, lo que están pidiendo es un área
      disfrazada de trabajo, y el apartado siguiente será justo ese.

  - id: ex1718-ord-5-resonancia-y-tipo-de-oscilacion
    titulo: Un término que resuena, otro que no, y un oscilador sin rozamiento
    fuente: >-
      Ejercicio 2 del SEGUNDO CUATRIMESTRAL · Convocatoria de mayo, 30 de mayo de
      2018 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 6
      comp4: 2
    enunciado: |
      a) Resolver la EDO $y''+9y=9\operatorname{sen}3x+2e^{3x}$.

      b) Si la EDO anterior describe un movimiento armónico, especificar qué
      tipo de oscilación se produce: sobreamortiguada, críticamente amortiguada
      o subamortiguada. ¿Cuál sería su frecuencia? Justificar la respuesta.
    pide: La solución general, y el tipo de oscilación con su frecuencia.

    pasos:
      - tipo: reconocer
        pregunta: |
          De los dos términos del segundo miembro, ¿cuál resuena con la
          homogénea?
        opciones:
          - texto: >-
              El $9\operatorname{sen}3x$, porque $3i$ es raíz de la característica
            correcta: true
            mensaje: |
              Eso es. $r^{2}+9=0$ da $r=\pm3i$, y $\operatorname{sen}3x$ es
              solución de la homogénea: hay que multiplicar su ensayo por $x$.
              El $2e^{3x}$ no resuena, porque $3$ —real— no es raíz.
          - texto: El $2e^{3x}$, porque el $3$ del exponente coincide
            mensaje: |
              El $3$ coincide en apariencia pero no en naturaleza: las raíces son
              $\pm3i$, imaginarias puras, y $3$ es real. $e^{3x}$ no es solución
              de $y''+9y=0$; compruébalo: daría $9e^{3x}+9e^{3x}=18e^{3x}\neq0$.
          - texto: Los dos, porque los dos llevan un $3$
            mensaje: |
              El $3$ de la exponencial y el $3$ del seno no juegan el mismo
              papel: uno es un exponente real y el otro una frecuencia. Solo
              resuena el que reproduce una solución de la homogénea.

      - tipo: calcular
        titulo: El coeficiente que crece
        pregunta: |
          Con el ensayo $x\left(A\cos 3x+B\operatorname{sen}3x\right)$, ¿cuánto
          vale $A$?
        respuesta:
          tipo: numero
          valor: '-1.5'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.5'
            mensaje: |
              Signo. Al sustituir queda
              $-6A\operatorname{sen}3x+6B\cos 3x$, y hay que igualarlo a
              $9\operatorname{sen}3x$: $-6A=9$ da $A=-\frac32$.
          - valor: '0'
            mensaje: |
              Cero es $B$, el coeficiente del **seno** en el ensayo. El que
              acompaña al coseno es el que sobrevive, y eso desconcierta al
              principio: el segundo miembro es un seno y el término que aparece
              lleva coseno.
          - valor: '-0.1666667'
            mensaje: |
              Parece que has dividido $-1$ entre $6$ en vez de $9$ entre $-6$.
              El segundo miembro es $9\operatorname{sen}3x$, con el $9$ delante.
        pista: |
          Al derivar dos veces $x\left(A\cos3x+B\operatorname{sen}3x\right)$ y
          sumar $9$ veces la función, los términos con $x$ se cancelan.
        desarrollo: |
          $$
          y_{p}''+9y_{p}=-6A\operatorname{sen}3x+6B\cos 3x
          $$

          Igualando a $9\operatorname{sen}3x$:

          $$
          -6A=9\;\Longrightarrow\;A=-\frac32,
          \qquad
          6B=0\;\Longrightarrow\;B=0
          $$

          $$
          y_{p_{1}}=-\frac32\,x\cos 3x
          $$

      - tipo: calcular
        titulo: El coeficiente de la exponencial
        pregunta: |
          Con el ensayo $Ce^{3x}$, ¿cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '0.1111111'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.2222222'
            mensaje: |
              $\frac29$ sale de olvidar que $y''$ también aporta: al sustituir
              queda $9C+9C=18C$, no $9C$.
          - valor: '2'
            mensaje: |
              Ese es el coeficiente del segundo miembro, no el del ensayo. Hay
              que dividirlo entre $18$.
          - valor: '0.0555556'
            mensaje: |
              $\frac{1}{18}$ es lo que saldría con segundo miembro $e^{3x}$ a
              secas. Aquí lleva un $2$ delante.
        pista: |
          $\left(Ce^{3x}\right)''=9Ce^{3x}$, y hay que sumarle $9Ce^{3x}$.
        desarrollo: |
          $$
          9Ce^{3x}+9Ce^{3x}=18Ce^{3x}=2e^{3x}
          \;\Longrightarrow\;
          C=\frac19
          $$

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              La ecuación homogénea es $y''+9y=0$: **no tiene término en $y'$**,
              que es el que representa el rozamiento.
          - texto: >-
              Sus raíces son $r=\pm3i$, imaginarias puras, sin parte real: la
              amplitud de la oscilación libre no decae.
          - texto: >-
              De las tres opciones, la única compatible con raíces complejas es
              la **subamortiguada**; y este es su caso límite, con
              amortiguamiento exactamente cero.
          - texto: >-
              La frecuencia angular es $9$ rad/s, porque es el coeficiente que
              acompaña a $y$.
            trampa: true
            mensaje: |
              El coeficiente que acompaña a $y$ es $\omega^{2}$, no $\omega$. De
              $y''+\omega^{2}y=0$ con $\omega^{2}=9$ sale $\omega=3$ rad/s, con
              periodo $\frac{2\pi}{3}\approx2{,}09$ s y frecuencia
              $\frac{3}{2\pi}\approx0{,}48$ Hz. Es el error más común del
              apartado, y se detecta mirando las raíces: son $\pm3i$, no
              $\pm9i$.
    resolucion: |
      **a) La homogénea.** $r^{2}+9=0$ da $r=\pm3i$:

      $$
      y_{h}=C_{1}\cos 3x+C_{2}\operatorname{sen}3x
      $$

      **Los dos trozos del segundo miembro, y por qué se tratan distinto.**

      - $9\operatorname{sen}3x$ **resuena**: $\operatorname{sen}3x$ ya es
        solución de la homogénea. El ensayo lleva una $x$ delante:
        $x\left(A\cos3x+B\operatorname{sen}3x\right)$, y sale $A=-\frac32$,
        $B=0$.
      - $2e^{3x}$ **no resuena**: $3$ es real y las raíces son imaginarias.
        Ensayo $Ce^{3x}$, con $18C=2$, o sea $C=\frac19$.

      $$
      \boxed{\;
      y=C_{1}\cos 3x+C_{2}\operatorname{sen}3x
      -\frac32\,x\cos 3x+\frac{e^{3x}}{9}
      \;}
      $$

      Fíjate en el detalle que desconcierta: el segundo miembro trae un **seno**
      y el término que sobrevive lleva **coseno**. No es un error: al derivar dos
      veces $x\cos3x$ aparece un $\operatorname{sen}3x$, y es ese el que casa
      con el segundo miembro.

      **b) Qué tipo de oscilación, dicho con precisión.** La ecuación homogénea
      no tiene término en $y'$, y ese término es el rozamiento. Con
      amortiguamiento **cero**, la respuesta exacta es que se trata de un
      **movimiento armónico simple, no amortiguado**: las raíces son imaginarias
      puras y la amplitud libre no decae nunca.

      De las tres opciones que ofrece el enunciado, la única compatible con
      raíces complejas es la **subamortiguada**, y este es su caso límite —el de
      coeficiente de amortiguamiento nulo—. Conviene contestar así, nombrando la
      opción y diciendo por qué ninguna encaja del todo: es exactamente el tipo
      de matiz que puntúa en COMP 4.

      **La frecuencia.** De $y''+\omega^{2}y=0$ con $\omega^{2}=9$:

      $$
      \omega=3\ \text{rad/s},
      \qquad
      T=\frac{2\pi}{3}\approx2{,}09\ \text{s},
      \qquad
      f=\frac{3}{2\pi}\approx0{,}48\ \text{Hz}
      $$

      **Y una lectura física del término resonante.** El $-\frac32 x\cos3x$
      crece sin límite: la fuerza externa empuja exactamente a la frecuencia
      propia del oscilador y, al no haber rozamiento que disipe, la amplitud se
      dispara. Es el mismo fenómeno que rompe una copa con un sonido, y en la
      solución se ve como el único término que lleva una $x$ multiplicando.

  - id: ex1718-ord-6-una-ecuacion-integral-que-da-un-seno
    titulo: Una convolución con t, y el seno que aparece
    fuente: >-
      Ejercicio 3 del SEGUNDO CUATRIMESTRAL · Convocatoria de mayo, 30 de mayo de
      2018 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Utilizando la transformada de Laplace, resolver el problema
      $$
      y(t)+\int_{0}^{t}(t-z)\,y(z)\,dz=t
      $$
    pide: La función y(t).

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es $\displaystyle\int_{0}^{t}(t-z)\,y(z)\,dz$?
        opciones:
          - texto: >-
              La convolución de $t$ con $y$, cuya transformada es
              $\frac{1}{s^{2}}\,Y(s)$
            correcta: true
            mensaje: |
              Eso es. Los dos argumentos suman $t$ —uno lleva $t-z$ y el otro
              $z$—, que es la firma de la convolución. Y como
              $\mathcal{L}\{t\}=\frac{1}{s^{2}}$, la transformada del conjunto es
              el producto.
          - texto: La integral de $y$ multiplicada por $t$
            mensaje: |
              No se puede sacar la $t$ fuera así, porque el integrando es
              $(t-z)y(z)$ y la $z$ está mezclada. Si se pudiera, la transformada
              sería otra: sacar factores constantes de una integral requiere que
              sean constantes **respecto de la variable de integración**, y
              aquí solo lo es la $t$ del primer sumando.
          - texto: >-
              La derivada de $y$ retrasada
            mensaje: |
              No hay ninguna derivada ni ningún retraso: no aparece $y'$ ni un
              escalón $u(t-a)$. Lo que hay es un producto de dos funciones dentro
              de una integral con los argumentos sumando $t$.

      - tipo: calcular
        titulo: El denominador que aparece
        pregunta: |
          Al despejar, $Y(s)=\dfrac{1}{s^{2}+k}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Con $k=0$ quedaría $Y=\frac{1}{s^{2}}$ y $y(t)=t$, que no cumple la
              ecuación: al sustituir, la integral aporta $\frac{t^{3}}{6}$ de
              más.
          - valor: '2'
            mensaje: |
              Parece que has sumado dos veces. De
              $Y\left(1+\frac{1}{s^{2}}\right)=\frac{1}{s^{2}}$ sale
              $Y\frac{s^{2}+1}{s^{2}}=\frac{1}{s^{2}}$, con un solo $+1$.
          - valor: '-1'
            mensaje: |
              Signo. La ecuación lleva un **más** delante de la integral, así que
              al agrupar queda $1+\frac{1}{s^{2}}$, no $1-\frac{1}{s^{2}}$. Con
              $-1$ la respuesta sería un seno hiperbólico.
        pista: |
          Transforma la ecuación entera y saca $Y$ factor común.
        desarrollo: |
          $$
          Y+\frac{1}{s^{2}}Y=\frac{1}{s^{2}}
          \;\Longrightarrow\;
          Y\,\frac{s^{2}+1}{s^{2}}=\frac{1}{s^{2}}
          \;\Longrightarrow\;
          Y=\frac{1}{s^{2}+1}
          $$

      - tipo: calcular
        titulo: Un valor de la solución
        pregunta: |
          ¿Cuánto vale $y(2)$?
        respuesta:
          tipo: numero
          valor: '0.9092974'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              $y(t)=t$ sería la solución si no estuviera la integral. Con ella,
              la solución es $\operatorname{sen}t$, que coincide con $t$ solo
              cerca del origen.
          - valor: '-0.4161468'
            mensaje: |
              Eso es $\cos 2$. $\frac{1}{s^{2}+1}$ antitransforma al **seno**; el
              coseno sería $\frac{s}{s^{2}+1}$, con la $s$ en el numerador.
          - valor: '3.6268604'
            mensaje: |
              Eso es $\operatorname{senh}2$, que correspondería a
              $\frac{1}{s^{2}-1}$. El signo del denominador decide entre
              trigonométricas e hiperbólicas.
        pista: |
          $\mathcal{L}^{-1}\left[\frac{1}{s^{2}+1}\right]$ es la más conocida de
          la tabla.
        desarrollo: |
          $$
          Y(s)=\frac{1}{s^{2}+1}
          \;\Longrightarrow\;
          y(t)=\operatorname{sen}t
          $$

          $$
          y(2)=\operatorname{sen}2\approx0{,}9093
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La integral es la convolución $(t*y)(t)$, porque los argumentos
              $t-z$ y $z$ suman $t$; su transformada es
              $\mathcal{L}\{t\}\cdot Y(s)=\frac{Y(s)}{s^{2}}$.
          - texto: >-
              Transformando la ecuación entera:
              $Y+\frac{Y}{s^{2}}=\frac{1}{s^{2}}$.
          - texto: >-
              Agrupando, $Y\frac{s^{2}+1}{s^{2}}=\frac{1}{s^{2}}$, de donde
              $Y=\frac{1}{s^{2}+1}$ y $y(t)=\operatorname{sen}t$.
          - texto: >-
              La transformada de una convolución es la convolución de las
              transformadas.
            trampa: true
            mensaje: |
              Es al revés, y ese cruce es justo lo que hace útil el teorema: la
              transformada de la **convolución** es el **producto** de las
              transformadas. Si fuera convolución de convoluciones no se ganaría
              nada; la gracia está en que una operación integral complicada se
              convierte en una multiplicación.
    resolucion: |
      **Reconocer la convolución.** La integral $\int_{0}^{t}(t-z)y(z)\,dz$
      tiene la forma canónica: dos factores cuyos argumentos suman $t$. Es
      $(t*y)(t)$, y el teorema de convolución dice

      $$
      \mathcal{L}\left\{t*y\right\}=\mathcal{L}\{t\}\cdot Y(s)=\frac{Y(s)}{s^{2}}
      $$

      **El álgebra, que es de una línea.**

      $$
      Y+\frac{Y}{s^{2}}=\frac{1}{s^{2}}
      \;\Longrightarrow\;
      Y\cdot\frac{s^{2}+1}{s^{2}}=\frac{1}{s^{2}}
      \;\Longrightarrow\;
      Y(s)=\frac{1}{s^{2}+1}
      $$

      **Antitransformar.**

      $$
      \boxed{\;y(t)=\operatorname{sen}t\;}
      $$

      **Comprobarlo sin Laplace, que aquí sale gratis.** Deriva la ecuación
      original dos veces. La primera derivada de
      $\int_{0}^{t}(t-z)y(z)dz$ es $\int_{0}^{t}y(z)dz$ —el factor $(t-z)$ se
      anula en $z=t$—, y la segunda es $y(t)$. Así que derivando dos veces la
      ecuación queda

      $$
      y''+y=0,
      \qquad y(0)=0,
      \qquad y'(0)=1
      $$

      que es exactamente el problema del seno. Las condiciones iniciales salen
      de evaluar la ecuación original y su derivada en $t=0$.

      **Lo que hay que llevarse.** Una ecuación integral con un núcleo que
      depende de $t-z$ se resuelve siempre igual: se reconoce la convolución, se
      transforma, se despeja $Y$ como si fuera una incógnita algebraica y se
      antitransforma. La dificultad no está en el cálculo, está en ver la
      convolución.

  - id: ex1718-ord-7-la-extension-par-de-la-identidad
    titulo: Una recta convertida en onda triangular
    fuente: >-
      Ejercicio 4 del SEGUNDO CUATRIMESTRAL · Convocatoria de mayo, 30 de mayo de
      2018 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3
    enunciado: |
      Sea la función $f(t)=t$, $0\le t<\pi$.

      a) Obtener la extensión par de la función $f(t)$.

      b) Representar gráficamente la función extendida.

      c) Obtener la serie de Fourier, $S(t)$, de la función $f(t)$.

      d) Calcular los valores de $S(t)$ y $f(t)$ en los puntos $t=0$ y $t=\pi$.

      e) Calcular la suma de la serie
      $\displaystyle\sum_{n=1}^{\infty}\frac{1}{(2n-1)^{2}}$.
    pide: La extensión, su dibujo, la serie, los dos valores y la suma.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la extensión par de $f(t)=t$ en $(-\pi,\pi)$?
        opciones:
          - texto: $\tilde f(t)=\left|t\right|$
            correcta: true
            mensaje: |
              Eso es. Extender de forma par es reflejar en el eje vertical:
              donde antes había $t$ ahora hay $-t$ para los negativos, y las dos
              ramas juntas son $\left|t\right|$. El resultado es la onda
              triangular clásica.
          - texto: $\tilde f(t)=t$
            mensaje: |
              Esa es la extensión **impar**: la función $t$ ya es impar por sí
              misma, así que prolongarla tal cual da una función impar, no par.
              Sería la del diente de sierra, con saltos en $\pm\pi$.
          - texto: $\tilde f(t)=t^{2}$
            mensaje: |
              $t^{2}$ es par, sí, pero no coincide con $f$ en $(0,\pi)$: en
              $t=2$ valdría $4$ y no $2$. Una extensión tiene que respetar la
              función original donde ya estaba definida.

      - tipo: calcular
        titulo: El término constante
        pregunta: |
          ¿Cuánto vale $\dfrac{a_{0}}{2}$?
        respuesta:
          tipo: numero
          valor: '1.5707963'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '3.1415927'
            mensaje: |
              Ese es $a_{0}=\pi$, sin dividir entre dos. El término
              independiente de la serie es la media de la función, y la media de
              una rampa que sube de $0$ a $\pi$ es $\frac\pi2$.
          - valor: '0.7853982'
            mensaje: |
              $\frac\pi4$ es la mitad de la respuesta. Cuidado con dividir dos
              veces: aquí la extensión es **par**, así que la media sobre
              $(-\pi,\pi)$ coincide con la media sobre $(0,\pi)$.
          - valor: '4.9348022'
            mensaje: |
              $\frac{\pi^{2}}{2}$ es el valor de $\int_{0}^{\pi}t\,dt$ sin
              dividir entre $\pi$.
        pista: |
          Es la media de $\left|t\right|$ en un periodo, y por simetría basta
          con la media de $t$ en $(0,\pi)$.
        desarrollo: |
          $$
          \frac{a_{0}}{2}=\frac{1}{\pi}\int_{0}^{\pi}t\,dt
          =\frac{1}{\pi}\cdot\frac{\pi^{2}}{2}=\frac{\pi}{2}
          $$

      - tipo: calcular
        titulo: El primer armónico
        pregunta: |
          ¿Cuánto vale $a_{1}$?
        respuesta:
          tipo: numero
          valor: '-1.2732395'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.2732395'
            mensaje: |
              Signo. $a_{n}=\frac{2}{\pi}\cdot\frac{(-1)^{n}-1}{n^{2}}$, y para
              $n=1$ el numerador es $-2$: sale $-\frac4\pi$.
          - valor: '-0.6366198'
            mensaje: |
              $-\frac2\pi$ es la mitad. Con extensión par se integra sobre
              $(0,\pi)$ y se **duplica**: el factor de fuera es $\frac2\pi$, no
              $\frac1\pi$.
          - valor: '0'
            mensaje: |
              Los $a_{n}$ impares no se anulan: son los únicos que quedan. Los
              que valen cero son los pares —y todos los $b_{n}$, por ser la
              extensión par—.
        pista: |
          $a_{n}=\frac{2}{\pi}\int_{0}^{\pi}t\cos(nt)\,dt$, por partes.
        desarrollo: |
          $$
          a_{n}=\frac{2}{\pi}\int_{0}^{\pi}t\cos(nt)\,dt
          =\frac{2}{\pi}\cdot\frac{(-1)^{n}-1}{n^{2}}
          $$

          $$
          a_{n}=\begin{cases}-\dfrac{4}{\pi n^{2}}&n\text{ impar}\\[6pt]
          0&n\text{ par}\end{cases}
          \qquad
          a_{1}=-\frac4\pi\approx-1{,}2732
          $$

          $$
          S(t)=\frac{\pi}{2}-\frac{4}{\pi}\sum_{k=0}^{\infty}
          \frac{\cos\bigl((2k+1)t\bigr)}{(2k+1)^{2}}
          $$

      - tipo: calcular
        titulo: La suma pedida
        pregunta: |
          ¿Cuánto vale
          $\displaystyle\sum_{n=1}^{\infty}\frac{1}{(2n-1)^{2}}$?
        respuesta:
          tipo: numero
          valor: '1.2337006'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.6449341'
            mensaje: |
              $\frac{\pi^{2}}{6}$ suma **todos** los inversos de los cuadrados.
              Esta serie solo recorre los impares y vale tres cuartas partes de
              aquella.
          - valor: '2.4674011'
            mensaje: |
              $\frac{\pi^{2}}{4}$ es el doble. De $0=\frac\pi2-\frac4\pi\Sigma$
              sale $\Sigma=\frac{\pi^{2}}{8}$.
          - valor: '0.6168503'
            mensaje: |
              $\frac{\pi^{2}}{16}$ es la mitad. Revisa el despeje: hay que
              multiplicar $\frac\pi2$ por $\frac\pi4$.
        pista: |
          Evalúa en $t=0$, donde la extensión es continua y todos los cosenos
          valen $1$.
        desarrollo: |
          En $t=0$ la extensión es continua y vale $0$:

          $$
          0=\frac{\pi}{2}-\frac{4}{\pi}\sum_{n=1}^{\infty}\frac{1}{(2n-1)^{2}}
          \;\Longrightarrow\;
          \sum_{n=1}^{\infty}\frac{1}{(2n-1)^{2}}=\frac{\pi^{2}}{8}
          \approx1{,}2337
          $$

      - tipo: justificar
        pregunta: Ordena el apartado d). Una pieza es falsa.
        piezas:
          - texto: >-
              La extensión par $\left|t\right|$, repetida con periodo $2\pi$, es
              **continua en todo $\mathbb{R}$**: en los múltiplos impares de
              $\pi$ los dos tramos llegan al mismo valor $\pi$.
          - texto: >-
              Al no haber saltos, Dirichlet da $S=\tilde f$ en todo punto: no
              hace falta calcular semisumas en ninguna parte.
          - texto: >-
              Por tanto $S(0)=0$ y $S(\pi)=\pi$; y sobre $f(\pi)$ conviene decir
              que el enunciado define $f$ solo en $[0,\pi)$, así que el valor en
              $\pi$ lo pone la extensión.
          - texto: >-
              En $t=\pi$ hay un salto de $\pi$ a $-\pi$, así que
              $S(\pi)=0$.
            trampa: true
            mensaje: |
              Ese salto es el de la extensión **impar**, no el de la par. Al
              extender de forma par, justo a la izquierda de $\pi$ la función
              vale casi $\pi$ y justo a la derecha también, porque el tramo
              siguiente baja desde $\pi$. La onda triangular no tiene saltos en
              ninguna parte: lo que tiene son picos, donde salta la derivada.
    resolucion: |
      **a) La extensión par.** Reflejar en el eje vertical:

      $$
      \tilde f(t)=\left|t\right| \text{ en } (-\pi,\pi),
      \qquad
      \tilde f(t+2\pi)=\tilde f(t)
      $$

      **b) El dibujo.** La onda triangular clásica: sube de $0$ a $\pi$, baja de
      $\pi$ a $0$, y así indefinidamente.

