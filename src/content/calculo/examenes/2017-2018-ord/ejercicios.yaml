ejercicios:
  - id: ex1718-ord-1-dos-potencias-que-se-cancelan
    titulo: Dos potencias décimas cuya suma es cero
    fuente: >-
      Ejercicio 1 del PRIMER CUATRIMESTRAL · Convocatoria de mayo, 30 de mayo de
      2018 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 8
      comp4: 1
    enunciado: |
      Calcular la suma
      $\left(\dfrac{1+i}{\sqrt2}\right)^{10}+\left(\dfrac{1-i}{\sqrt2}\right)^{10}$
      y representar gráficamente el resultado.
    pide: El valor de la suma, y su representación en el plano.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué conviene hacer antes de elevar a la décima?
        opciones:
          - texto: >-
              Pasar cada número a forma polar y usar De Moivre
            correcta: true
            mensaje: |
              Eso es. Elevar a la décima en binómica son diez productos y un
              binomio de Newton; en polar es multiplicar el argumento por diez y
              el módulo elevarlo, y aquí el módulo vale $1$, así que ni eso.
          - texto: >-
              Desarrollar el binomio de Newton de $(1+i)^{10}$
            mensaje: |
              Se puede, y sale, pero son once términos con potencias de $i$ que
              hay que reducir una a una. En un examen sin calculadora es el
              camino largo, y cada término es una oportunidad de equivocarse.
          - texto: >-
              Sumar primero los dos paréntesis y elevar el resultado
            mensaje: |
              $(a+b)^{10}\neq a^{10}+b^{10}$. Si se pudiera, la suma de los dos
              paréntesis es $\frac{2}{\sqrt2}=\sqrt2$ y $\left(\sqrt2\right)^{10}
              =32$, que no es la respuesta.

      - tipo: calcular
        titulo: El módulo de cada número
        pregunta: |
          ¿Cuánto vale $\left|\dfrac{1+i}{\sqrt2}\right|$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1.4142136'
            mensaje: |
              $\sqrt2$ es el módulo de $1+i$ **antes** de dividir. Al dividir
              entre $\sqrt2$ el módulo también se divide, y queda $1$.
          - valor: '2'
            mensaje: |
              $2$ es $\left|1+i\right|^{2}$. El módulo es la raíz de la suma de
              cuadrados, no la suma.
          - valor: '0.7071068'
            mensaje: |
              $\frac{1}{\sqrt2}$ saldría de dividir $1$ entre $\sqrt2$; pero el
              numerador tiene módulo $\sqrt2$, no $1$.
        pista: |
          $\left|1+i\right|=\sqrt{1^{2}+1^{2}}$, y el módulo de un cociente es el
          cociente de los módulos.
        desarrollo: |
          $$
          \left|\frac{1+i}{\sqrt2}\right|
          =\frac{\left|1+i\right|}{\sqrt2}=\frac{\sqrt2}{\sqrt2}=1
          $$

          Que valga $1$ es la clave del ejercicio: al elevar a cualquier
          potencia el número **no se sale de la circunferencia unidad**, y solo
          hay que seguirle el argumento.

      - tipo: calcular
        titulo: El argumento de la primera potencia
        pregunta: |
          Tras elevar a la décima, ¿cuál es el argumento de
          $\left(\frac{1+i}{\sqrt2}\right)^{10}$, reducido al intervalo
          $[0,2\pi)$?
        respuesta:
          tipo: numero
          valor: '1.5707963'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales, en radianes
        distractores:
          - valor: '7.8539816'
            mensaje: |
              Ese es $\frac{10\pi}{4}=\frac{5\pi}{2}$ sin reducir. Hay que
              restarle una vuelta entera, $2\pi$, para dejarlo en
              $[0,2\pi)$: queda $\frac\pi2$.
          - valor: '0.7853982'
            mensaje: |
              $\frac\pi4$ es el argumento **antes** de elevar. De Moivre lo
              multiplica por $10$.
          - valor: '3.1415927'
            mensaje: |
              $\pi$ correspondería a $-1$. Con argumento inicial $\frac\pi4$ y
              exponente $10$ sale $\frac{10\pi}{4}$, que reducido es
              $\frac\pi2$, no $\pi$.
        pista: |
          $\arg\frac{1+i}{\sqrt2}=\frac\pi4$, y De Moivre multiplica el
          argumento por el exponente.
        desarrollo: |
          $$
          \frac{1+i}{\sqrt2}=e^{i\pi/4}
          \;\Longrightarrow\;
          \left(\frac{1+i}{\sqrt2}\right)^{10}=e^{i10\pi/4}=e^{i5\pi/2}
          $$

          $$
          \frac{5\pi}{2}-2\pi=\frac{\pi}{2}
          \;\Longrightarrow\;
          \left(\frac{1+i}{\sqrt2}\right)^{10}=e^{i\pi/2}=i
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Los dos números tienen módulo $1$ y argumentos $\frac\pi4$ y
              $-\frac\pi4$: son conjugados el uno del otro.
          - texto: >-
              Por De Moivre, sus potencias décimas tienen módulo $1$ y
              argumentos $\frac{5\pi}{2}\equiv\frac\pi2$ y
              $-\frac\pi2$, o sea $i$ y $-i$.
          - texto: >-
              La suma es $i+(-i)=0$, y gráficamente son dos vectores opuestos
              sobre el eje imaginario que se cancelan: el resultado es el origen.
          - texto: >-
              Como los dos números son conjugados, sus potencias también lo son
              y su suma es el **doble de la parte imaginaria**.
            trampa: true
            mensaje: |
              La primera mitad es cierta —el conjugado de una potencia es la
              potencia del conjugado— y la segunda está cambiada:
              $z+\overline z=2\operatorname{Re}z$, el doble de la parte
              **real**. Y aquí eso es justamente lo que da cero, porque $i$ no
              tiene parte real. Si la regla fuera la de la parte imaginaria, la
              suma valdría $2$ y no $0$.
    resolucion: |
      **Lo primero, el módulo.** $\left|1+i\right|=\sqrt2$, así que

      $$
      \left|\frac{1+i}{\sqrt2}\right|=1
      $$

      y eso decide el ejercicio: los dos números están **en la circunferencia
      unidad**, y elevarlos a cualquier potencia los deja donde están. Solo hay
      que llevar la cuenta del ángulo.

      **En forma exponencial.**

      $$
      \frac{1+i}{\sqrt2}=e^{i\pi/4},
      \qquad
      \frac{1-i}{\sqrt2}=e^{-i\pi/4}
      $$

      **De Moivre.**

      $$
      \left(e^{i\pi/4}\right)^{10}=e^{i5\pi/2}=e^{i\pi/2}=i,
      \qquad
      \left(e^{-i\pi/4}\right)^{10}=e^{-i\pi/2}=-i
      $$

      —al reducir $\frac{5\pi}{2}$ se resta una vuelta, $2\pi$, y queda
      $\frac\pi2$—.

      $$
      \boxed{\;\left(\frac{1+i}{\sqrt2}\right)^{10}+
      \left(\frac{1-i}{\sqrt2}\right)^{10}=i-i=0\;}
      $$

      **La representación.** El resultado es el origen, y lo que hay que dibujar
      no es solo un punto: son los dos vectores $i$ y $-i$, opuestos, y su suma.

