          <text x="20" y="146">z₁=-3-i</text>
          <text x="238" y="216">z₂=-1-2i</text>
          <text x="14" y="326">z₃≈-2,87-3,23i</text>
        </g>
        <g fill="var(--alt)" font-size="11" font-family="var(--mono)">
          <text x="120" y="52">descartado: -1,13+0,23i</text>
        </g>
      </svg>
      <figcaption>
      Figura nuestra: el enunciado pide representar. En rojo los tres vertices
      del triangulo, todos en el tercer cuadrante; en violeta hueco, la
      solucion del otro giro, que cae en el segundo y por eso se descarta.
      </figcaption>
      </figure>

      ### 4 · Comprobación del apartado (a)

      **Las tres distancias deben coincidir.**

      $$
      \left\lvert z_2-z_1\right\rvert = \left\lvert2-i\right\rvert = \sqrt5
      = 2{,}2361
      $$

      $$
      z_3-z_1 \approx (-2{,}866+3)+(-3{,}232+1)i = 0{,}134-2{,}232i
      $$

      $$
      \left\lvert z_3-z_1\right\rvert
      = \sqrt{0{,}0180+4{,}9818} = \sqrt{4{,}9998} = 2{,}2360 \quad\checkmark
      $$

      $$
      z_3-z_2 \approx -1{,}866-1{,}232i,
      \qquad
      \left\lvert z_3-z_2\right\rvert = \sqrt{3{,}482+1{,}518}
      = \sqrt{5{,}000} = 2{,}2361 \quad\checkmark
      $$

      Los tres lados miden $\sqrt5$: es equilátero.

      **Y el baricentro**, como comprobación adicional:

      $$
      \frac{z_1+z_2+z_3}{3} \approx \frac{-6{,}866-6{,}232i}{3}
      = -2{,}289-2{,}077i
      $$

      También en el tercer cuadrante, como debe estar el centro de un triángulo
      que lo está entero ✔

      ### 5 · Apartado (b): la identidad fundamental en $\mathbb{C}$

      **Por qué hay que demostrarla.** En $\mathbb{R}$ la identidad
      $\mathrm{sen}^{2}x+\cos^{2}x = 1$ sale del teorema de Pitágoras sobre la
      circunferencia unidad. Pero **para un $z$ complejo no hay ningún
      triángulo**: el seno y el coseno se *definen* con exponenciales, y la
      identidad hay que deducirla de esa definición.

      $$
      \mathrm{sen}\,z = \frac{\mathrm{e}^{iz}-\mathrm{e}^{-iz}}{2i},
      \qquad
      \cos z = \frac{\mathrm{e}^{iz}+\mathrm{e}^{-iz}}{2}
      $$

      **Elevando al cuadrado**, con $(2i)^{2} = -4$:

      $$
      \mathrm{sen}^{2}z
      = \frac{\left(\mathrm{e}^{iz}-\mathrm{e}^{-iz}\right)^{2}}{-4}
      = -\frac{\mathrm{e}^{2iz}-2+\mathrm{e}^{-2iz}}{4}
      $$

      $$
      \cos^{2}z
      = \frac{\left(\mathrm{e}^{iz}+\mathrm{e}^{-iz}\right)^{2}}{4}
      = \frac{\mathrm{e}^{2iz}+2+\mathrm{e}^{-2iz}}{4}
      $$

      **Sumando**, los términos $\mathrm{e}^{\pm2iz}$ se cancelan:

      $$
      \mathrm{sen}^{2}z+\cos^{2}z
      = \frac{-\mathrm{e}^{2iz}+2-\mathrm{e}^{-2iz}
      +\mathrm{e}^{2iz}+2+\mathrm{e}^{-2iz}}{4}
      = \frac{4}{4}
      $$

      $$
      \boxed{\mathrm{sen}^{2}z+\cos^{2}z = 1
      \qquad \forall z \in \mathbb{C}} \qquad \blacksquare
      $$

      ### 6 · Un aviso que conviene añadir

      La identidad se conserva, pero **la acotación no**:

      $$
      \left\lvert\mathrm{sen}\,z\right\rvert \le 1
      \qquad\text{es FALSO en } \mathbb{C}
      $$

      Por ejemplo, $\mathrm{sen}(i\,y) = i\,\mathrm{sh}\,y$, cuyo módulo crece
      sin tope: con $y=10$ vale $11\,013$.

      Que $\mathrm{sen}^{2}+\cos^{2} = 1$ no obliga a que ninguno de los dos
      esté acotado, porque **los cuadrados de complejos pueden ser negativos**.
      Es la diferencia de fondo con el caso real, y decirlo demuestra haber
      entendido la demostración en lugar de repetirla.

      ### 7 · Comprobación de (b)

      **Con $z = i$:**

      $$
      \mathrm{sen}\,i = i\,\mathrm{sh}\,1 = 1{,}1752\,i,
      \qquad
      \cos i = \mathrm{ch}\,1 = 1{,}5431
      $$

      $$
      \mathrm{sen}^{2}i+\cos^{2}i = -1{,}3811+2{,}3811 = 1{,}0000
      \quad\checkmark
      $$

      El primer sumando es **negativo**, y aun así la suma da 1: exactamente lo
      que decía el aviso.

  - id: ex1617-3ev-2-dos-demostraciones
    titulo: La inversa de una cóncava, y el teorema fundamental demostrado
    fuente: >-
      Ejercicio 2 · Tercera evaluación, 23 de enero de 2017 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: las
      demostraciones son propuesta nuestra, pendientes de revisión.
    puntos:
      comp1: 1
      comp2: 2
      comp4: 7

    enunciado: |
      Demostrar las siguientes propiedades:

      **a)** Sea $y(x)$ una función dos veces derivable, decreciente y cóncava
      en el intervalo $(a,b)$. Entonces $y^{-1}(x)$ es cóncava en $(a,b)$.

      **b)** Sea $G(x) = \displaystyle\int_a^{x}g(t)\,dt$, donde $g(x)$ es
      continua en $[a,b]$. Entonces $G(x)$ es derivable y $G'(x) = g(x)$.
    pide: Demostrar las dos propiedades.

    pasos:
      - tipo: reconocer
        pregunta: |
          Para el apartado (b), ¿qué teorema previo hace falta?
        opciones:
          - texto: >-
              El **teorema del valor medio del cálculo integral**: si $g$ es
              continua en $[u,v]$, existe $\xi$ con
              $\int_u^{v}g = g(\xi)(v-u)$
            correcta: true
            mensaje: |
              Exacto. Ese teorema convierte la integral de un trozo pequeño en
              un solo valor de $g$, y de ahí la derivada sale sola al hacer
              tender el trozo a cero.
          - texto: >-
              La regla de Barrow
            mensaje: |
              Barrow se **deduce** de lo que aquí se está demostrando. Usarlo
              sería circular.
          - texto: >-
              El teorema de Rolle
            mensaje: |
              Rolle es sobre derivadas, no sobre integrales. El que hace falta
              es su análogo integral.
          - texto: >-
              Ninguno: basta con la definición de integral
            mensaje: |
              Se puede hacer acotando con el mínimo y el máximo y usando el
              teorema del emparedado, pero eso **es** demostrar de paso el
              teorema del valor medio integral.

      - tipo: calcular
        titulo: La segunda derivada de la inversa
        pregunta: |
          Si $y'(1) = -2$ e $y''(1) = -8$, y $y(1)=5$, ¿cuánto vale
          $\left(y^{-1}\right)''(5)$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Falta el signo. La fórmula es
              $-\frac{y''}{\left(y'\right)^{3}}$, y con
              $y''=-8$ y $\left(y'\right)^{3} = -8$ sale
              $-\frac{-8}{-8} = -1$.
          - valor: '2'
            mensaje: |
              2 saldría de dividir entre $\left(y'\right)^{2} = 4$ en vez de
              entre el cubo.
          - valor: '-4'
            mensaje: |
              $-4$ saldría de dividir $-8$ entre $y'=-2$ sin elevar al cubo.
        pista: |
          $\left(y^{-1}\right)'' = -\dfrac{y''}{\left(y'\right)^{3}}$, evaluado
          en el punto correspondiente.
        desarrollo: |
          $$
          \left(y^{-1}\right)''(5)
          = -\frac{y''(1)}{\left(y'(1)\right)^{3}}
          = -\frac{-8}{(-2)^{3}} = -\frac{-8}{-8} = -1
          $$

          Negativa: la inversa es **cóncava** ahí, igual que $y$.

          Y el ejemplo ilustra la propiedad general del apartado (a): con
          $y'<0$ e $y''<0$, el numerador $-y''$ es positivo y el denominador
          $\left(y'\right)^{3}$ negativo, así que el cociente sale negativo
          **siempre**.
        veredicto: |
          El cubo del denominador es lo que hace que el signo de $y'$ importe.
          Con un cuadrado el resultado sería otro.

      - tipo: justificar
        pregunta: |
          Ordena la demostración del apartado (a). Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **La inversa existe.** $y$ es decreciente, así que es inyectiva y
              tiene inversa; y $y'<0$ en todo el intervalo, así que $y^{-1}$ es
              derivable.
          - texto: |
              **Derivar la identidad** $y\left(y^{-1}(x)\right) = x$:
              $y'\left(y^{-1}\right)\cdot\left(y^{-1}\right)' = 1$, de donde
              $\left(y^{-1}\right)' = \frac{1}{y'\left(y^{-1}\right)}$.
          - texto: |
              **Derivar otra vez** y despejar:
              $\left(y^{-1}\right)''
              = -\dfrac{y''\left(y^{-1}\right)}
              {\left[y'\left(y^{-1}\right)\right]^{3}}$.
          - texto: |
              **Los signos:** $y''<0$ porque $y$ es cóncava, luego el numerador
              $-y''$ es **positivo**; y $y'<0$ porque $y$ decrece, luego
              $\left(y'\right)^{3}$ es **negativo**.
          - texto: |
              **Positivo entre negativo es negativo:**
              $\left(y^{-1}\right)''<0$, así que $y^{-1}$ es cóncava.
              $\blacksquare$
          - texto: |
              Como $y$ es cóncava y la inversa es su reflejo respecto de la
              bisectriz, la concavidad se conserva.
            trampa: true
            mensaje: |
              La reflexión respecto de $y=x$ **invierte** la concavidad, no la
              conserva: una función creciente y cóncava tiene inversa
              **convexa**. Lo que hace que aquí sí salga cóncava es que $y$ sea
              **decreciente**, es decir el signo de $y'$, que aparece elevado al
              cubo. Sin esa hipótesis el resultado es falso, y el enunciado la
              incluye precisamente por eso.
        veredicto: |
          El enunciado da tres hipótesis y las tres se usan: dos veces derivable
          para que exista $y''$, decreciente para el signo del cubo, y cóncava
          para el del numerador.

    resolucion: |
      **Lo que se pide.** Dos demostraciones. Siete de los diez puntos son
      COMP4.

      ### 1 · Apartado (a): qué hay que probar

      > $y$ dos veces derivable, **decreciente** y **cóncava**
      > $\Longrightarrow$ $y^{-1}$ es cóncava.

      **Primero, que la inversa existe y es derivable.** Al ser decreciente,
      $y$ es inyectiva. Y como es derivable con $y'<0$ —estrictamente, o no
      sería estrictamente decreciente—, el teorema de la función inversa
      garantiza que $y^{-1}$ es derivable.

      > **Nota sobre el enunciado.** Dice «$y^{-1}(x)$ es cóncava en $(a,b)$»,
      > pero el dominio de $y^{-1}$ es $y\left((a,b)\right)$, no $(a,b)$. Es un
      > desliz de redacción del examen; lo que se demuestra es que $y^{-1}$ es
      > cóncava en su propio dominio, que es la imagen del intervalo.

      ### 2 · Las dos fórmulas

      Llamando $g = y^{-1}$, se parte de la identidad

      $$
      y\left(g(x)\right) = x
      $$

      **Derivando** con la regla de la cadena:

      $$
      y'\left(g(x)\right)\cdot g'(x) = 1
      \;\Longrightarrow\;
      g'(x) = \frac{1}{y'\left(g(x)\right)}
      $$

      **Derivando otra vez** el producto:

      $$
      y''\left(g\right)\left[g'\right]^{2}+y'\left(g\right)g'' = 0
      $$

      $$
      g'' = -\frac{y''(g)\left[g'\right]^{2}}{y'(g)}
      = -\frac{y''(g)}{\left[y'(g)\right]^{3}}
      $$

      —sustituyendo $g' = \frac{1}{y'(g)}$ en el numerador—.

      $$
      \boxed{\left(y^{-1}\right)''
      = -\frac{y''}{\left(y'\right)^{3}}}
      $$

      ### 3 · Los signos

      | dato | hipótesis | signo |
      |---|---|---|
      | $y''<0$ | $y$ cóncava | numerador $-y''>0$ |
      | $y'<0$ | $y$ decreciente | $\left(y'\right)^{3}<0$ |

      $$
      \left(y^{-1}\right)'' = \frac{\text{positivo}}{\text{negativo}} < 0
      $$

      $$
      \boxed{y^{-1} \text{ es cóncava}} \qquad \blacksquare
      $$

      ### 4 · Por qué hace falta que sea decreciente

      El **cubo** del denominador conserva el signo de $y'$, y ahí está todo.

      Si $y$ fuera **creciente** y cóncava —$y'>0$, $y''<0$— saldría

      $$
      \left(y^{-1}\right)'' = \frac{\text{positivo}}{\text{positivo}} > 0
      $$

      es decir **convexa**. Es el caso de $y = \sqrt x$: cóncava y creciente, y
      su inversa $x^{2}$ es convexa.

      **La reflexión respecto de la bisectriz invierte la concavidad.** Lo que
      pasa aquí es que ser decreciente la invierte otra vez, y las dos
      inversiones se compensan.

      ### 5 · Comprobación de (a) con un caso concreto

      $y(x) = -x^{2}$ en $(0,\infty)$: decreciente ($y'=-2x<0$) y cóncava
      ($y''=-2<0$) ✔ Su inversa es

      $$
      y^{-1}(x) = \sqrt{-x}, \qquad x<0
      $$

      $$
      \left(y^{-1}\right)' = \frac{-1}{2\sqrt{-x}},
      \qquad
      \left(y^{-1}\right)'' = -\frac{1}{4(-x)^{3/2}} < 0 \quad\checkmark
      $$

      Cóncava, como decía el teorema. Y por la fórmula, en $x_0=1$
      —donde $y=-1$, $y'=-2$, $y''=-2$—:

      $$
      \left(y^{-1}\right)''(-1) = -\frac{-2}{(-2)^{3}} = -\frac14
      $$

      y directamente: $-\frac{1}{4\cdot1^{3/2}} = -\frac14$ ✔

      ### 6 · Apartado (b): el teorema fundamental

      > $g$ continua en $[a,b]$, $G(x) = \int_a^{x}g$
      > $\Longrightarrow$ $G$ derivable con $G' = g$.

      **La herramienta:** el **teorema del valor medio del cálculo integral**.
      Si $g$ es continua en un intervalo $[u,v]$, existe $\xi \in [u,v]$ con

      $$
      \int_u^{v}g(t)\,dt = g(\xi)\left(v-u\right)
      $$

      ### 7 · La demostración

      Sea $x \in (a,b)$ y $h \neq 0$ pequeño. Por la **aditividad** de la
      integral:

      $$
      G(x+h)-G(x)
      = \int_a^{x+h}g-\int_a^{x}g
      = \int_x^{x+h}g(t)\,dt
      $$

      Aplicando el teorema del valor medio integral en el intervalo de extremos
      $x$ y $x+h$ —donde $g$ es continua—, existe $\xi_h$ entre ellos con

      $$
      \int_x^{x+h}g(t)\,dt = g\left(\xi_h\right)\cdot h
      $$

      Por tanto, para todo $h\neq0$:

      $$
      \frac{G(x+h)-G(x)}{h} = g\left(\xi_h\right)
      $$

      **Y ahora el límite.** Como $\xi_h$ está atrapado entre $x$ y $x+h$:

      $$
      h \to 0 \;\Longrightarrow\; \xi_h \to x
      $$

      Y por la **continuidad de $g$ en $x$**:

      $$
      \lim_{h\to0}g\left(\xi_h\right) = g(x)
      $$

      $$
      \boxed{G'(x) = \lim_{h\to0}\frac{G(x+h)-G(x)}{h} = g(x)}
      \qquad \blacksquare
      $$

      En $a$ y en $b$ el mismo argumento da las derivadas laterales.

      ### 8 · Dónde se usa la continuidad, exactamente

      **Dos veces**, y conviene señalarlo:

      1. Para poder aplicar el teorema del valor medio integral en cada trozo.
      2. En el último paso, para que $g(\xi_h) \to g(x)$.

      **Si $g$ solo fuera integrable**, $G$ seguiría existiendo y siendo
      continua —de hecho lipschitziana—, pero podría **no ser derivable**. El
      contraejemplo de siempre:

      $$
      g(t) = \begin{cases}0 & t\le0\\ 1 & t>0\end{cases}
      $$

      Con $a=-1$, $G(x)$ vale 0 a la izquierda de 0 y $x$ a la derecha: tiene un
      **pico** en 0, justo donde $g$ salta. Ahí $G'$ no existe.

      ### 9 · Comprobación de (b)

      Con $g(t) = t^{2}$ y $a=0$:

      $$
      G(x) = \int_0^{x}t^{2}dt = \frac{x^{3}}{3},
      \qquad
      G'(x) = x^{2} = g(x) \quad\checkmark
      $$

      **Y siguiendo la demostración paso a paso**, con $x=1$ y $h=0{,}1$:

      $$
      \int_1^{1{,}1}t^{2}dt = \frac{1{,}331-1}{3} = 0{,}110333
      $$

      $$
      g(\xi_h) = \frac{0{,}110333}{0{,}1} = 1{,}10333
      \;\Longrightarrow\;
      \xi_h = \sqrt{1{,}10333} = 1{,}05039
      $$

      que en efecto está entre 1 y $1{,}1$ ✔ Y al hacer $h$ más pequeño,
      $\xi_h \to 1$ y $g(\xi_h) \to 1 = g(1)$ ✔

  - id: ex1617-3ev-3-raiz-cubica-de-nueve
    titulo: La raíz cúbica de nueve con tres términos
    fuente: >-
      Ejercicio 3 · Tercera evaluación, 23 de enero de 2017 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3

    enunciado: |
      **a)** Calcular el desarrollo de McLaurin de orden 3 de la función
      $y(x) = \sqrt[3]{x+8}$.

      **b)** Utilizando el desarrollo anterior calcular el valor aproximado de
      $\sqrt[3]{9}$.

      **c)** Acotar el error cometido en dicho cálculo.
    pide: Calcular el polinomio, aproximar y acotar el error.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el enunciado elige la función $\sqrt[3]{x+8}$ y no
          $\sqrt[3]{x}$?
        opciones:
          - texto: >-
              Porque $\sqrt[3]{x}$ **no es derivable en 0** y además el 8 es un
              cubo perfecto, así que $y(0)=2$ sale exacto
            correcta: true
            mensaje: |
              Exacto, las dos cosas. El $+8$ desplaza el desarrollo a un punto
              donde la raíz cúbica vale un entero y todas sus derivadas existen.
              Y el 9 que se quiere aproximar queda a distancia 1.
          - texto: >-
              Porque así el polinomio tiene coeficientes enteros
            mensaje: |
              No los tiene: salen $\frac{1}{12}$, $-\frac{1}{288}$ y
              $\frac{5}{20736}$.
          - texto: >-
              Porque $\sqrt[3]{x}$ no está definida para $x<0$
            mensaje: |
              La raíz **cúbica** sí está definida para negativos: $\sqrt[3]{-8}
              = -2$. El problema es la derivabilidad en 0.
          - texto: >-
              Para que el desarrollo tenga radio de convergencia infinito
            mensaje: |
              El radio es 8, la distancia de 0 a la singularidad en $x=-8$. No
              es infinito.

      - tipo: calcular
        titulo: El coeficiente lineal
        pregunta: |
          ¿Cuál es el coeficiente de $x$ en el polinomio? Da seis decimales.
        respuesta:
          tipo: numero
          valor: '0.083333'
          tolerancia: 0.000005
          formato: un número
        distractores:
          - valor: '0.333333'
            mensaje: |
              $\frac13$ es el exponente que baja al derivar. Falta el factor
              $8^{-2/3} = \frac14$.
          - valor: '0.25'
            mensaje: |
              $\frac14$ es $8^{-2/3}$. Falta multiplicarlo por el $\frac13$.
          - valor: '0.166667'
            mensaje: |
              $\frac16$ saldría con $8^{-1/2}$, es decir con una raíz cuadrada.
              Aquí el exponente es $-\frac23$.
        pista: |
          $y' = \frac13(x+8)^{-2/3}$, y $8^{2/3} = 4$.
        desarrollo: |
          $$
          y(x) = (x+8)^{1/3}
          $$

          $$
          y'(x) = \frac13(x+8)^{-2/3}
          \;\Longrightarrow\;
          y'(0) = \frac13\cdot\frac{1}{8^{2/3}} = \frac13\cdot\frac14
          = \frac{1}{12}
          $$

          $$
          \frac{1}{12} = 0{,}083333
          $$

          —recordando que $8^{2/3} = \left(\sqrt[3]8\right)^{2} = 2^{2} = 4$—.
        veredicto: |
          Todas las derivadas evalúan potencias de 8 con exponente múltiplo de
          $\frac13$, y como $8 = 2^{3}$ salen siempre potencias de 2. Por eso
          los números son manejables sin calculadora.

      - tipo: calcular
        titulo: La cota del error
        pregunta: |
          ¿Cuánto vale la cota del error del apartado (c), en unidades de
          $10^{-5}$? Da dos decimales.
        respuesta:
          tipo: numero
          valor: '2.01'
          tolerancia: 0.01
          formato: un número, en unidades de 10⁻⁵
        distractores:
          - valor: '1.84'
            mensaje: |
              $1{,}84\cdot10^{-5}$ es el error **real**, que solo se puede
              calcular sabiendo $\sqrt[3]9$ — justo lo que se estaba
              aproximando. Una cota tiene que salir del teorema, no del
              resultado.
          - valor: '48.23'
            mensaje: |
              $48{,}23\cdot10^{-5}$ es $\left\lvert y^{(4)}(0)\right\rvert$ sin
              dividir entre $4! = 24$.
          - valor: '8.04'
            mensaje: |
              $8{,}04\cdot10^{-5}$ saldría de dividir entre $3!$ en vez de entre
              $4!$. El resto de orden 3 lleva el factorial de **cuatro**.
        pista: |
          $\left\lvert R_3\right\rvert \le \frac{\left\lvert y^{(4)}(0)\right\rvert}{4!}$,
          con $y^{(4)}(x) = -\frac{80}{81}(x+8)^{-11/3}$ y $8^{11/3} = 2048$.
        desarrollo: |
          El resto de Lagrange, con $\xi \in (0,1)$:

          $$
          R_3(1) = \frac{y^{(4)}(\xi)}{4!}\cdot1^{4}
          $$

          $$
          y^{(4)}(x) = -\frac{80}{81}\left(x+8\right)^{-11/3}
          $$

          Su valor absoluto **decrece**, así que el peor caso es $\xi=0$:

          $$
          \left\lvert y^{(4)}(0)\right\rvert = \frac{80}{81\cdot2048}
          = \frac{80}{165\,888} = 4{,}8225\cdot10^{-4}
          $$

          $$
          \left\lvert R_3\right\rvert \le \frac{4{,}8225\cdot10^{-4}}{24}
          = 2{,}01\cdot10^{-5}
          $$

          Y el error real —conocido $\sqrt[3]9 = 2{,}080084$ frente al
          $2{,}080102$ del polinomio— es $1{,}84\cdot10^{-5}$: menor que la
          cota ✔
        veredicto: |
          La cota sale del **teorema**; el error real solo se puede calcular
          sabiendo la respuesta. Son cosas distintas, y el apartado (c) pide la
          primera.

      - tipo: justificar
        pregunta: |
          Ordena el apartado (c). Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **El resto de Lagrange:** existe $\xi \in (0,1)$ con
              $R_3(1) = \frac{y^{(4)}(\xi)}{4!}\cdot1^{4}$.
          - texto: |
              **La cuarta derivada:**
              $y^{(4)}(x) = -\frac{80}{81}(x+8)^{-11/3}$.
          - texto: |
              **Su valor absoluto es decreciente** en $[0,1]$, así que el peor
              caso está en $\xi=0$.
          - texto: |
              **La cota:**
              $\left\lvert R_3\right\rvert \le
              \frac{1}{24}\cdot\frac{80}{81\cdot2048}
              \approx 2{,}01\cdot10^{-5}$, usando $8^{11/3} = 2^{11} = 2048$.
          - texto: |
              **Y la comprobación:** el error real es
              $\left\lvert2{,}080102-2{,}080084\right\rvert
              = 1{,}8\cdot10^{-5}$, menor que la cota ✔
          - texto: |
              El signo de $y^{(4)}$ dice que el error es negativo, así que hay
              que restar la cota al resultado para mejorarlo.
            trampa: true
            mensaje: |
              El signo **sí** dice que el polinomio se pasa por arriba, y eso es
              una observación útil. Pero restarle la cota no mejora nada:
              la cota es el peor caso, no el error. Restarla dejaría
              $2{,}080082$, que se pasa por abajo. Una cota acota; para corregir
              haría falta calcular el término siguiente, que es otra cosa.
        veredicto: |
          Una cota da un intervalo de confianza, no una corrección. Confundir
          las dos cosas es el error conceptual del apartado (c).

    resolucion: |
      **Datos.** $y(x) = \sqrt[3]{x+8}$, desarrollo de orden 3 en $x=0$,
      aproximación de $\sqrt[3]9$ y cota del error.

      ### 1 · Por qué el $+8$

      El enunciado no pide desarrollar $\sqrt[3]{x}$, y hay dos motivos:

      - $\sqrt[3]{x}$ **no es derivable en 0**: su derivada
        $\frac{1}{3x^{2/3}}$ se dispara. No hay polinomio de Taylor ahí.
      - $8 = 2^{3}$ es un **cubo perfecto**, así que $y(0) = 2$ es exacto y
        todas las derivadas evalúan potencias de 2.

      Y $9 = 1+8$ queda a distancia 1 del centro, dentro del radio de
      convergencia, que es 8.

      ### 2 · Apartado (a): las derivadas

      $$
      y(x) = (x+8)^{1/3}
      $$

      | orden | derivada | en $x=0$ |
      |---|---|---|
      | 0 | $(x+8)^{1/3}$ | $8^{1/3} = 2$ |
      | 1 | $\frac13(x+8)^{-2/3}$ | $\frac13\cdot\frac14 = \frac{1}{12}$ |
      | 2 | $-\frac29(x+8)^{-5/3}$ | $-\frac29\cdot\frac{1}{32} = -\frac{1}{144}$ |
      | 3 | $\frac{10}{27}(x+8)^{-8/3}$ | $\frac{10}{27}\cdot\frac{1}{256} = \frac{5}{3456}$ |
      | 4 | $-\frac{80}{81}(x+8)^{-11/3}$ | — |

      —usando $8^{2/3}=4$, $8^{5/3}=32$, $8^{8/3}=256$, todos potencias de 2—.

      $$
      P_3(x) = 2+\frac{x}{12}+\frac{-1/144}{2!}x^{2}
      +\frac{5/3456}{3!}x^{3}
      $$

      $$
      \boxed{P_3(x) = 2+\frac{x}{12}-\frac{x^{2}}{288}
      +\frac{5x^{3}}{20736}}
      $$

      ### 3 · Apartado (b): la aproximación

      $$
      \sqrt[3]9 = \sqrt[3]{1+8} = y(1)
      $$

      $$
      P_3(1) = 2+\frac{1}{12}-\frac{1}{288}+\frac{5}{20736}
      $$

      | término | valor |
      |---|---|
      | $2$ | $2{,}000000$ |
      | $+\frac{1}{12}$ | $+0{,}083333$ |
      | $-\frac{1}{288}$ | $-0{,}003472$ |
      | $+\frac{5}{20736}$ | $+0{,}000241$ |

      $$
      \boxed{\sqrt[3]9 \approx 2{,}080102}
      $$

      Los términos caen deprisa —cada uno unas 15 veces menor que el
      anterior—, señal de que $x=1$ está bien dentro del radio 8.

      ### 4 · Apartado (c): la cota

      **El teorema de Taylor con resto de Lagrange:** existe $\xi \in (0,1)$
      con

      $$
      R_3(1) = \frac{y^{(4)}(\xi)}{4!}\cdot(1-0)^{4}
      = \frac{y^{(4)}(\xi)}{24}
      $$

      **La hipótesis se cumple:** $y$ es cuatro veces derivable en $[0,1]$,
      porque ahí $x+8 \ge 8 > 0$.

      $$
      y^{(4)}(x) = -\frac{80}{81}\left(x+8\right)^{-11/3}
      $$

      Su valor absoluto **decrece** en $[0,1]$, así que el peor caso está en
      $\xi=0$:

      $$
      \left\lvert y^{(4)}(0)\right\rvert = \frac{80}{81\cdot8^{11/3}}
      = \frac{80}{81\cdot2048} = \frac{80}{165\,888}
      = 4{,}8225\cdot10^{-4}
      $$

      —con $8^{11/3} = 2^{11} = 2048$—.

      $$
      \left\lvert R_3(1)\right\rvert \le \frac{4{,}8225\cdot10^{-4}}{24}
      $$

      $$
      \boxed{\left\lvert\text{error}\right\rvert \le 2{,}01\cdot10^{-5}}
      $$

      ### 5 · Comprobación

      **El error real:**

      $$
      \sqrt[3]9 = 2{,}0800838,
      \qquad
      \left\lvert2{,}0801022-2{,}0800838\right\rvert = 1{,}84\cdot10^{-5}
      $$

      $$
      1{,}84\cdot10^{-5} < 2{,}01\cdot10^{-5} \quad\checkmark
      $$

      La cota se cumple, y ajustada: el error real es el 92 % de ella, porque
      $\xi$ está muy cerca de 0.

      **El signo.** $y^{(4)}<0$, así que el resto es negativo y el polinomio se
      queda **por encima** del valor verdadero. Y en efecto
      $2{,}080102 > 2{,}080084$ ✔

      **Comprobación directa, elevando al cubo:**

      $$
      2{,}080102^{3} = 9{,}000239
      $$

      frente a 9: se pasa en $2{,}4\cdot10^{-4}$, coherente con un error de
      $1{,}8\cdot10^{-5}$ en la raíz, porque la derivada de $x^{3}$ en 2,08 vale
      unas 13 veces ✔

      ### 6 · Un comentario sobre el método

      Con solo cuatro términos y **sin calculadora** se obtienen cinco cifras
      significativas de una raíz cúbica. La clave es que el punto de desarrollo
      esté cerca y sea cómodo: para $\sqrt[3]{30}$ se usaría
      $\sqrt[3]{x+27}$ con $x=3$, y para $\sqrt[3]{60}$,
      $\sqrt[3]{x+64}$ con $x=-4$.

      **Siempre el cubo perfecto más cercano.** Y el error va como
      $\left(\frac{x}{\text{cubo}}\right)^{4}$: cuanto más cerca, mucho mejor.

  - id: ex1617-3ev-4-el-lazo
    titulo: Un lazo cerrado, su área y lo que barre al girar
    fuente: >-
      Ejercicio 4 · Tercera evaluación, 23 de enero de 2017 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 6
      comp4: 4

    enunciado: |
      Sea $D$ el recinto limitado por
      $9y^{2} = x\left(3-x\right)^{2}$ / $x \in [0,3]$.

      **a)** Representar gráficamente $D$.

      **b)** Calcular el área de $D$.

      **c)** Hallar el volumen del sólido de revolución generado al girar $D$
      alrededor de OX.
    pide: Representar, calcular el área y el volumen.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué forma tiene la curva?
        opciones:
          - texto: >-
              Un **lazo cerrado** entre $(0,0)$ y $(3,0)$, simétrico respecto
              del eje $OX$
            correcta: true
            mensaje: |
              Exacto. La ecuación da $y = \pm\frac13(3-x)\sqrt x$: dos ramas
              opuestas que arrancan y acaban en el eje, en $x=0$ y en $x=3$.
          - texto: >-
              Una parábola
            mensaje: |
              El segundo miembro es de grado 3 en $x$, no de grado 1. La curva
              no es una parábola.
          - texto: >-
              Una sola rama por encima del eje
            mensaje: |
              La ecuación tiene $y^{2}$, así que para cada $x$ hay **dos**
              valores de $y$ opuestos. La curva es simétrica.
          - texto: >-
              Una curva que se va a infinito
            mensaje: |
              El intervalo $[0,3]$ está acotado y la función también: el máximo
              de $y$ vale $\frac23$.

      - tipo: calcular
        titulo: La altura máxima del lazo
        pregunta: |
          ¿Cuál es el mayor valor de $y$ sobre el lazo? Da cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.6667'
          tolerancia: 0.0008
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 sería si el máximo estuviera en $x=1$ con
              $y = \frac{(3-1)\sqrt1}{3}$… que da $\frac23$, no 1. El
              denominador 3 es el que baja el valor.
          - valor: '2'
            mensaje: |
              2 es $(3-x)\sqrt x$ en $x=1$ sin dividir entre 3.
          - valor: '0.3333'
            mensaje: |
              $\frac13$ es solo el factor de delante. Falta multiplicarlo por
              $(3-x)\sqrt x = 2$.
        pista: |
          $y = \frac13(3-x)\sqrt x$. Deriva e iguala a cero.
        desarrollo: |
          Despejando la rama superior:

          $$
          y = \frac13\left(3-x\right)\sqrt x
          = \frac13\left(3x^{1/2}-x^{3/2}\right)
          $$

          $$
          y' = \frac13\left(\frac32x^{-1/2}-\frac32x^{1/2}\right)
          = \frac{1}{2}\cdot\frac{1-x}{\sqrt x}
          $$

          $$
          y' = 0
          \;\Longrightarrow\;
          x = 1
          $$

          $$
          y(1) = \frac13\cdot2\cdot1 = \frac23 \approx 0{,}6667
          $$
        veredicto: |
          El lazo mide 3 de largo y solo $\frac43$ de alto: es una figura
          alargada y afilada por los dos extremos.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuál es el área encerrada por el lazo? Da cuatro decimales.
        respuesta:
          tipo: numero
          valor: '2.7713'
          tolerancia: 0.0008
          formato: un número
        distractores:
          - valor: '1.3856'
            mensaje: |
              $1{,}3856$ es la mitad: solo la rama de arriba. El lazo tiene las
              dos.
          - valor: '2'
            mensaje: |
              2 es el área del rombo de diagonales 3 y $\frac43$, que envuelve
              al lazo. El lazo ocupa algo más.
          - valor: '4'
            mensaje: |
              4 es el área del rectángulo $[0,3]\times[-\frac23,\frac23]$, en el
              que el lazo cabe holgadamente.
        pista: |
          $A = 2\int_0^{3}\frac{(3-x)\sqrt x}{3}dx$.
        desarrollo: |
          Por la simetría respecto del eje $OX$:

          $$
          A = 2\int_0^{3}\frac{\left(3-x\right)\sqrt x}{3}\,dx
          = \frac23\int_0^{3}\left(3x^{1/2}-x^{3/2}\right)dx
          $$

          $$
          = \frac23\left[2x^{3/2}-\frac25x^{5/2}\right]_0^{3}
          $$

          Con $3^{3/2} = 3\sqrt3$ y $3^{5/2} = 9\sqrt3$:

          $$
          = \frac23\left[6\sqrt3-\frac{18\sqrt3}{5}\right]
          = \frac23\cdot\frac{12\sqrt3}{5} = \frac{8\sqrt3}{5}
          $$

          $$
          \approx 2{,}7713
          $$
        veredicto: |
          Que el resultado lleve $\sqrt3$ es normal: los límites de integración
          producen potencias fraccionarias de 3.

      - tipo: justificar
        pregunta: |
          Ordena el cálculo del volumen. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **El recinto es simétrico respecto del eje de giro**, así que al
              girar la mitad de arriba y la de abajo barren **el mismo**
              sólido.
          - texto: |
              Luego basta con la rama superior, y **no hay que duplicar nada**:
              $V = \pi\int_0^{3}y^{2}dx$.
          - texto: |
              **Y $y^{2}$ está dado directamente por el enunciado:**
              $y^{2} = \frac{x\left(3-x\right)^{2}}{9}$. Ni siquiera hace falta
              despejar la raíz.
          - texto: |
              **Desarrollar e integrar:**
              $V = \frac{\pi}{9}\int_0^{3}\left(9x-6x^{2}+x^{3}\right)dx$.
          - texto: |
              $V = \frac{\pi}{9}\left[\frac{9x^{2}}{2}-2x^{3}
              +\frac{x^{4}}{4}\right]_0^{3}
              = \frac{\pi}{9}\cdot\frac{27}{4} = \frac{3\pi}{4}$.
          - texto: |
              Como el recinto tiene dos ramas, el volumen es el doble del que
              genera la de arriba.
            trampa: true
            mensaje: |
              Al girar **sobre el propio eje de simetría**, las dos ramas
              recorren exactamente el mismo sólido: duplicar sería contar dos
              veces el mismo espacio. Es distinto del **área**, donde sí hay que
              duplicar porque las dos mitades ocupan sitios distintos del plano.
              La diferencia entre las dos situaciones es lo que este apartado
              pone a prueba.
        veredicto: |
          Para el área se duplica y para el volumen no. La razón es la misma en
          los dos casos: mirar qué recorre cada mitad.

    resolucion: |
      **Datos.** $9y^{2} = x\left(3-x\right)^{2}$, con $x \in [0,3]$.

      ### 1 · Apartado (a): qué curva es

      Despejando:

      $$
      y^{2} = \frac{x\left(3-x\right)^{2}}{9}
      \;\Longrightarrow\;
      y = \pm\frac{\left\lvert3-x\right\rvert\sqrt x}{3}
      = \pm\frac{\left(3-x\right)\sqrt x}{3}
      $$

      —el valor absoluto se quita porque en $[0,3]$ se tiene $3-x\ge0$—.

      **Dos ramas opuestas**, simétricas respecto del eje $OX$, que se juntan
      donde $y=0$:

      $$
      x = 0 \qquad\text{y}\qquad x = 3
      $$

      Es un **lazo cerrado**. Su altura máxima, derivando la rama superior:

      $$
      y' = \frac{1}{2}\cdot\frac{1-x}{\sqrt x} = 0
      \;\Longrightarrow\;
      x = 1,
      \qquad
      y(1) = \frac23
      $$

      <figure class="figura-examen">
      <svg viewBox="0 0 480 360" role="img" width="460" height="345"
           aria-labelledby="f1617c4t f1617c4d">
        <title id="f1617c4t">El lazo</title>
        <desc id="f1617c4d">Una curva cerrada con forma de hoja alargada que
        arranca en el origen, alcanza su maxima anchura hacia x igual a uno y
        se cierra en punta en x igual a tres. Es simetrica respecto del eje
        horizontal.</desc>

        <path d="M60 180 C 90 110, 140 62, 180 57 C 240 66, 300 110, 420 180
                 C 300 250, 240 294, 180 303 C 140 298, 90 250, 60 180 Z"
              fill="var(--live)" fill-opacity="0.15" stroke="none"></path>

        <g stroke="var(--rule)" stroke-width="1" fill="none">
          <path d="M180 30 L180 330 M300 30 L300 330
                   M40 123 L450 123 M40 237 L450 237"></path>
        </g>

        <g stroke="var(--graphite)" stroke-width="1.3" fill="none">
          <path d="M30 180 L460 180 M60 30 L60 340"></path>
        </g>

        <g stroke="var(--ink)" stroke-width="2.8" fill="none"
           stroke-linecap="round">
          <path d="M60 180 C 90 110, 140 62, 180 57 C 240 66, 300 110, 420 180"></path>
          <path d="M60 180 C 90 250, 140 298, 180 303 C 240 294, 300 250, 420 180"></path>
        </g>

        <g fill="var(--flag)">
          <circle cx="180" cy="57" r="5.5"></circle>
        </g>
        <g fill="var(--graphite)">
          <circle cx="60" cy="180" r="4.5"></circle>
          <circle cx="420" cy="180" r="4.5"></circle>
        </g>

        <g fill="var(--graphite)" font-size="13" font-family="var(--mono)">
          <text x="52" y="200">0</text>
          <text x="176" y="200">1</text>
          <text x="296" y="200">2</text>
          <text x="416" y="200">3</text>
          <text x="30" y="128">⅔</text>
          <text x="26" y="242">-⅔</text>
          <text x="440" y="172">x</text>
        </g>
        <g fill="var(--flag)" font-size="12" font-family="var(--mono)">
          <text x="190" y="52">(1, 2/3)</text>
        </g>
      </svg>
      <figcaption>
      Figura nuestra: el enunciado pide representarla. El lazo mide 3 de largo
      y solo 4/3 de alto, y acaba en punta en los dos extremos.
      </figcaption>
      </figure>

      ### 2 · Apartado (b): el área

      Por la simetría respecto de $OX$, el lazo es el doble de su mitad
      superior:

      $$
      A = 2\int_0^{3}\frac{\left(3-x\right)\sqrt x}{3}\,dx
      = \frac23\int_0^{3}\left(3x^{1/2}-x^{3/2}\right)dx
      $$

      $$
      = \frac23\left[3\cdot\frac{2}{3}x^{3/2}-\frac25x^{5/2}\right]_0^{3}
      = \frac23\left[2x^{3/2}-\frac25x^{5/2}\right]_0^{3}
      $$

      Con $3^{3/2} = 3\sqrt3$ y $3^{5/2} = 9\sqrt3$:

      $$
      = \frac23\left[6\sqrt3-\frac{18\sqrt3}{5}\right]
      = \frac23\cdot\frac{30\sqrt3-18\sqrt3}{5}
      = \frac23\cdot\frac{12\sqrt3}{5}
      $$

      $$
      \boxed{A = \frac{8\sqrt3}{5} \approx 2{,}7713}
      $$

      ### 3 · Apartado (c): el volumen

      **Aquí NO se duplica.** El eje de giro es $OX$, que es justamente el eje
      de simetría del lazo: al girar, la rama de arriba y la de abajo barren
      **el mismo** sólido. Duplicar contaría dos veces el mismo espacio.

      $$
      V = \pi\int_0^{3}y^{2}\,dx
      $$

      Y **$y^{2}$ viene dado por el enunciado**, sin necesidad de despejar la
      raíz:

      $$
      y^{2} = \frac{x\left(3-x\right)^{2}}{9}
      $$

      $$
      V = \frac{\pi}{9}\int_0^{3}x\left(9-6x+x^{2}\right)dx
      = \frac{\pi}{9}\int_0^{3}\left(9x-6x^{2}+x^{3}\right)dx
      $$

      $$
      = \frac{\pi}{9}\left[\frac{9x^{2}}{2}-2x^{3}+\frac{x^{4}}{4}
      \right]_0^{3}
      = \frac{\pi}{9}\left[\frac{81}{2}-54+\frac{81}{4}\right]
      $$

      $$
      = \frac{\pi}{9}\cdot\frac{162-216+81}{4}
      = \frac{\pi}{9}\cdot\frac{27}{4}
      $$

      $$
      \boxed{V = \frac{3\pi}{4} \approx 2{,}3562}
      $$

      ### 4 · Duplicar sí, duplicar no

      Es el punto delicado del ejercicio, y merece decirse en voz alta:

      | magnitud | ¿se duplica? | por qué |
      |---|---|---|
      | **área** | **sí** | las dos mitades ocupan zonas distintas del plano |
      | **volumen sobre $OX$** | **no** | las dos mitades barren el mismo sólido |

      El criterio es siempre el mismo: mirar qué recorre cada mitad.

      ### 5 · Comprobación

      **Del área, por acotación.** El lazo cabe en el rectángulo
      $[0,3]\times\left[-\frac23,\frac23\right]$, de área 4, y contiene el rombo
      de diagonales 3 y $\frac43$, de área

      $$
      \frac{3\cdot\frac43}{2} = 2
      $$

      $$
      2 < 2{,}771 < 4 \quad\checkmark
      $$

      Ocupa el 69 % del rectángulo, razonable para una figura con las puntas
      afiladas.

      **Del área, con la sustitución $x = u^{2}$**, como segunda vía:

      $$
      A = \frac23\int_0^{\sqrt3}\left(3u-u^{3}\right)2u\,du
      = \frac43\int_0^{\sqrt3}\left(3u^{2}-u^{4}\right)du
      $$

      $$
      = \frac43\left[u^{3}-\frac{u^{5}}{5}\right]_0^{\sqrt3}
      = \frac43\left[3\sqrt3-\frac{9\sqrt3}{5}\right]
      = \frac43\cdot\frac{6\sqrt3}{5} = \frac{8\sqrt3}{5} \quad\checkmark
      $$

      **Del volumen, por acotación.** El sólido cabe dentro del cilindro de
      radio $\frac23$ y longitud 3:

      $$
      \pi\cdot\frac49\cdot3 = \frac{4\pi}{3} \approx 4{,}19
      $$

      y $2{,}36$ es el 56 % de eso ✔ Coherente con un sólido que se estrecha
      hasta un punto en los dos extremos.

      **Del integrando en un punto.** En $x=1$:

      $$
      y^{2} = \frac{1\cdot4}{9} = \frac49,
      \qquad
      y = \frac23 \quad\checkmark
      $$

      Coincide con la altura máxima calculada en el apartado (a).

  - id: ex1617-3ev-5-convergencia-y-la-derivada-de-x
    titulo: Dos sucesiones casi iguales, y una derivada desde la definición
    fuente: >-
      Ejercicio 5 · Tercera evaluación, 23 de enero de 2017 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 1
      comp4: 7

    enunciado: |
      **a)** Definir el concepto de convergencia de una sucesión y estudiar, de
      forma argumentada, la convergencia de las siguientes sucesiones:

      **a.1)**
      $\{a_n\}_{n\in\mathbb{N}} = \begin{cases}
      2+\dfrac1n & n \text{ impar}\\[8pt]
      -2-\dfrac1n & n \text{ par}
      \end{cases}$

      **a.2)**
      $\{a_n\}_{n\in\mathbb{N}} = \begin{cases}
      2+\dfrac1n & n < 50\\[8pt]
      -2-\dfrac1n & n \ge 50
      \end{cases}$

      **b)** Demostrar que la derivada de la función $y(x) = x$ es 1.
    pide: Definir, estudiar las dos sucesiones y demostrar la derivada.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos sucesiones usan las mismas dos expresiones. ¿Qué las
          diferencia?
        opciones:
          - texto: >-
              Que en la primera las dos ramas se alternan **para siempre**, y en
              la segunda una de ellas se acaba en $n=50$
            correcta: true
            mensaje: |
              Exacto, y ese es todo el ejercicio. La convergencia solo depende
              de la **cola**: en la (a.2) la primera rama es un episodio
              finito y no influye en nada.
          - texto: >-
              Que la segunda tiene más términos
            mensaje: |
              Las dos tienen infinitos términos. Lo que cambia es **cómo se
              reparten** entre las dos ramas.
          - texto: >-
              Que en la segunda los términos son mayores
            mensaje: |
              A partir de $n=50$ la segunda es negativa, así que sus términos
              son menores, no mayores.
          - texto: >-
              Nada relevante: las dos hacen lo mismo
            mensaje: |
              Una converge y la otra no. La diferencia es decisiva.

      - tipo: calcular
        titulo: El límite de la segunda
        pregunta: |
          ¿A qué valor converge la sucesión de (a.2)?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es el límite de la rama que **se acaba** en $n=49$. Solo cuentan
              los términos a partir de 50, y esos tienden a $-2$.
          - valor: '0'
            mensaje: |
              0 sería la media de los dos valores. Una sucesión no converge a la
              media de nada: converge a donde se acumula su cola.
          - valor: '-2.02'
            mensaje: |
              $-2{,}02$ es $a_{50} = -2-\frac{1}{50}$, un término concreto. El
              límite es $-2$, al que la sucesión se acerca sin alcanzarlo.
        pista: |
          ¿Cuántos términos usan la primera rama? ¿Y la segunda?
        desarrollo: |
          Los términos con $n<50$ son **cuarenta y nueve**: un número finito.
          Todos los demás —infinitos— usan la segunda rama:

          $$
          a_n = -2-\frac1n \qquad \text{para todo } n \ge 50
          $$

          $$
          \lim_{n\to\infty}\left(-2-\frac1n\right) = -2
          $$

          **La convergencia solo depende de la cola.** Cambiar, quitar o añadir
          un número finito de términos no altera el límite.

          $$
          a_n \to -2
          $$
        veredicto: |
          Y con la definición en la mano: dado $\varepsilon>0$, basta tomar
          $N = \max\left(50,\frac{1}{\varepsilon}\right)$ para que
          $\left\lvert a_n+2\right\rvert = \frac1n < \varepsilon$.

      - tipo: justificar
        pregunta: |
          Ordena el estudio de la sucesión (a.1). Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **Mirar las dos subsucesiones.** La de índices impares es
              $2+\frac1n$ y la de pares $-2-\frac1n$.
          - texto: |
              **Sus límites:** la de impares tiende a $2$ y la de pares a
              $-2$.
          - texto: |
              **El teorema que decide:** si una sucesión converge a $L$,
              **toda** subsucesión suya converge al mismo $L$.
          - texto: |
              **Por contrarrecíproco:** como hay dos subsucesiones con límites
              distintos, la sucesión **no converge**.
          - texto: |
              **Y sí está acotada:**
              $\left\lvert a_n\right\rvert \le 3$ para todo $n$. Acotada pero no
              convergente: el ejemplo de que una cosa no implica la otra.
          - texto: |
              Como los términos oscilan entre valores positivos y negativos, la
              sucesión diverge a infinito.
            trampa: true
            mensaje: |
              Oscilar no es divergir a infinito: la sucesión está **acotada**
              entre $-3$ y $3$. «No converge» y «diverge a infinito» son cosas
              distintas, y esta hace lo primero sin hacer lo segundo. Precisar
              el vocabulario es parte de lo que puntúa en COMP4.
        veredicto: |
          El argumento de las subsucesiones es el más limpio para **negar** una
          convergencia: basta exhibir dos con límites distintos.

    resolucion: |
      **Lo que se pide.** Una definición, dos estudios y una demostración. Siete
      de los diez puntos son COMP4.

      ### 1 · La definición

      > Se dice que $\{a_n\}_{n\in\mathbb{N}}$ **converge** a $L \in \mathbb{R}$
      > cuando
      >
      > $$
      > \forall\varepsilon>0 \ \ \exists N \in \mathbb{N} \ \text{ tal que }
      > \ \forall n>N: \quad \left\lvert a_n-L\right\rvert<\varepsilon
      > $$

      **Lo que hay que entender de esa frase:** para cualquier banda alrededor
      de $L$, por estrecha que sea, la sucesión acaba entrando y **ya no
      vuelve a salir**. El $N$ depende de $\varepsilon$, y ese orden importa.

      Y una consecuencia inmediata que resuelve el ejercicio:

      > **La convergencia solo depende de la cola.** Cambiar, añadir o quitar
      > un número **finito** de términos no altera ni la convergencia ni el
      > límite: basta agrandar el $N$ de la definición.

      ### 2 · Apartado (a.1): no converge

      Las dos ramas se alternan **indefinidamente**, así que las dos producen
      subsucesiones infinitas:

      | subsucesión | expresión | límite |
      |---|---|---|
      | índices impares | $2+\frac1n$ | $2$ |
      | índices pares | $-2-\frac1n$ | $-2$ |

      **El teorema que decide:** si una sucesión converge a $L$, entonces
      **toda** subsucesión suya converge a ese mismo $L$.

      Aquí hay dos subsucesiones con límites distintos, $2 \neq -2$. Por
      contrarrecíproco:

      $$
      \boxed{\{a_n\} \text{ NO converge}}
      $$

      **Y sí está acotada:**

      $$
      \left\lvert a_n\right\rvert \le 2+1 = 3 \qquad \forall n
      $$

      Es el ejemplo estándar de que **acotada no implica convergente**. Y
      conviene precisar el vocabulario: la sucesión **no converge**, pero
      **tampoco diverge a infinito**. Oscila.

      ### 3 · Apartado (a.2): converge a $-2$

      Aquí la primera rama solo actúa para $n<50$: **cuarenta y nueve
      términos**, un número finito.

      A partir de $n=50$, y para siempre:

      $$
      a_n = -2-\frac1n
      $$

      $$
      \boxed{\lim_{n\to\infty}a_n = -2}
      $$

      **Con la definición, para hacerlo formal.** Dado $\varepsilon>0$, tomando

      $$
      N = \max\left\{50,\ \left\lceil\frac{1}{\varepsilon}\right\rceil\right\}
      $$

      para todo $n>N$ se cumple $n \ge 50$ y $\frac1n<\varepsilon$, luego

      $$
      \left\lvert a_n-(-2)\right\rvert = \frac1n < \varepsilon \quad\checkmark
      $$

      El $\max$ con 50 es lo que hace el trabajo: garantiza que se está ya en la
      segunda rama.

      ### 4 · Lo que enseña el par

      Las dos sucesiones usan **exactamente las mismas dos expresiones**. Lo
      único que cambia es cuándo se aplica cada una:

      | | primera rama | resultado |
      |---|---|---|
      | (a.1) | infinitos términos | **no converge** |
      | (a.2) | 49 términos | **converge a $-2$** |

      Que 49 términos no importen y que infinitos sí, aunque sean «la mitad»,
      es exactamente lo que dice la definición: solo cuenta lo que pasa **a
      partir de un cierto punto**.

      ### 5 · Apartado (b): la derivada de $y=x$

      > Demostrar que $y'(x) = 1$ para $y(x)=x$.

      **Hay que hacerlo desde la definición**, no citando la regla de la
      potencia: esa regla se demuestra a partir de casos como este.

      $$
      y'(x) = \lim_{h\to0}\frac{y(x+h)-y(x)}{h}
      $$

      Sustituyendo:

      $$
      = \lim_{h\to0}\frac{(x+h)-x}{h} = \lim_{h\to0}\frac{h}{h}
      $$

      **Y aquí el detalle que hay que decir:** en la definición de límite se
      considera $h \neq 0$, así que el cociente $\frac hh$ vale **1
      exactamente**, para todo $h$ del entorno perforado. El límite de una
      función constante es esa constante:

      $$
      \boxed{y'(x) = \lim_{h\to0}1 = 1 \qquad \forall x \in \mathbb{R}}
      \qquad \blacksquare
      $$

      No se está simplificando $\frac00$: la expresión nunca se evalúa en
      $h=0$.

      ### 6 · Comprobación

      **De (a.1), con los primeros términos:**

      $$
      a_1 = 3,\quad a_2 = -2{,}5,\quad a_3 = 2{,}333,\quad
      a_4 = -2{,}25,\quad a_5 = 2{,}2
      $$

      Salta de un lado a otro sin acercarse a nada ✔ Y ninguno se sale de
      $[-3,3]$ ✔

      **De (a.2):**

      $$
      a_{48} = 2{,}021,
      \quad
      a_{49} = 2{,}020,
      \quad
      a_{50} = -2{,}020,
      \quad
      a_{51} = -2{,}0196,
      \quad
      a_{1000} = -2{,}001
      $$

      Hay un salto en $n=50$ y a partir de ahí sube suavemente hacia $-2$ ✔ El
      salto no impide la convergencia: solo es un término más.

      **De (b), numéricamente.** El cociente incremental vale 1 para cualquier
      $h$, no solo en el límite:

      | $h$ | $\frac{(x+h)-x}{h}$ |
      |---|---|
      | $1$ | $1$ |
      | $0{,}01$ | $1$ |
      | $-0{,}5$ | $1$ |

      Constante ✔ Es el caso más simple posible de derivada, y por eso sirve de
      base para todas las demás.
