        </g>

        <g stroke="var(--live)" stroke-width="2.6" fill="var(--live)"
           fill-opacity="0.10">
          <path d="M90 150 L230 220 L99 306 Z"></path>
        </g>

        <g fill="var(--flag)">
          <circle cx="90" cy="150" r="6"></circle>
