ejercicios:
  - id: ex1617-3ev-1-triangulo-y-fundamental
    titulo: El tercer vértice, y la identidad fundamental en el plano complejo
    fuente: >-
      Ejercicio 1 · Tercera evaluación, 23 de enero de 2017 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 4
      comp4: 5

    enunciado: |
      **a)** Un triángulo equilátero tiene todos sus vértices en el tercer
      cuadrante. Hallar el número complejo $z_3$, tal que los afijos de los
      números complejos $z_1 = -3-i$, $z_2 = -1-2i$ y $z_3$ sean los vértices de
      dicho triángulo. Representar gráficamente el triángulo.

      **b)** Demostrar que
      $\mathrm{sen}^{2}z+\cos^{2}z = 1$ $\forall z \in \mathbb{C}$.
    pide: Hallar $z_3$, representar el triángulo y demostrar la identidad.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se construye el tercer vértice de un triángulo equilátero?
        opciones:
          - texto: >-
              **Girando $z_2$ alrededor de $z_1$ un ángulo de $60°$**, es decir
              multiplicando por $\mathrm{e}^{\pm i\pi/3}$
            correcta: true
            mensaje: |
              Exacto, y esa es la ventaja de trabajar en complejos: girar es
              multiplicar. Hay **dos** giros posibles, $+60°$ y $-60°$, y el
              enunciado usa el tercer cuadrante para elegir uno.
          - texto: >-
              Sumando $z_1+z_2$
            mensaje: |
              Eso da el vértice opuesto de un **paralelogramo**, no de un
              triángulo equilátero.
          - texto: >-
              Tomando el punto medio y subiendo la altura
            mensaje: |
              Funciona geométricamente, pero exige calcular una dirección
              perpendicular y la altura $\frac{\sqrt3}{2}\ell$: más pasos que
              multiplicar por $\mathrm{e}^{i\pi/3}$.
          - texto: >-
              Multiplicando $z_1 z_2$
            mensaje: |
              El producto gira **y escala** respecto del origen, no respecto de
              $z_1$. No construye ningún vértice del triángulo.

      - tipo: calcular
        titulo: El lado del triángulo
        pregunta: |
          ¿Cuánto mide el lado? Da cuatro decimales.
        respuesta:
          tipo: numero
          valor: '2.2361'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '5'
            mensaje: |
              5 es $\left\lvert z_2-z_1\right\rvert^{2} = 4+1$. Falta la raíz:
              $\sqrt5 = 2{,}2361$.
          - valor: '3.1623'
            mensaje: |
              $\sqrt{10}$ saldría de sumar mal las diferencias. La diferencia es
              $2-i$, con módulo $\sqrt{4+1}$.
          - valor: '1.7321'
            mensaje: |
              $\sqrt3$ es la altura relativa de un equilátero de lado 2, no el
              lado de este.
        pista: |
          $z_2-z_1 = (-1-2i)-(-3-i)$.
        desarrollo: |
          $$
          z_2-z_1 = (-1-2i)-(-3-i) = 2-i
          $$

          $$
          \ell = \left\lvert z_2-z_1\right\rvert = \sqrt{2^{2}+(-1)^{2}}
          = \sqrt5 \approx 2{,}2361
          $$

          Y en un equilátero los tres lados miden lo mismo, así que
          $\left\lvert z_3-z_1\right\rvert = \left\lvert z_3-z_2\right\rvert
          = \sqrt5$ también. Eso servirá de comprobación.
        veredicto: |
          Guardar el lado desde el principio es útil: al final se comprueban las
          tres distancias y si alguna no da $\sqrt5$, el giro se ha hecho mal.

      - tipo: calcular
        titulo: El tercer vértice
        pregunta: |
          ¿Cuál es la parte real de $z_3$? Da cuatro decimales.
        respuesta:
          tipo: numero
          valor: '-2.8660'
          tolerancia: 0.0008
          formato: un número
        distractores:
          - valor: '-1.1340'
            mensaje: |
              $-1{,}134$ es la parte real del **otro** tercer vértice, el del
              giro de $+60°$. Ese cae en el segundo cuadrante —su parte
              imaginaria es $+0{,}232$— y el enunciado lo descarta.
          - valor: '-4'
            mensaje: |
              $-4$ saldría de sumar las partes reales de $z_1$ y $z_2$. El
              tercer vértice no es una suma.
          - valor: '-2'
            mensaje: |
              $-2$ es la parte real del **punto medio** de $z_1z_2$, no del
              vértice.
        pista: |
          $z_3 = z_1+(z_2-z_1)\,\mathrm{e}^{-i\pi/3}$, y
          $\mathrm{e}^{-i\pi/3} = \frac12-\frac{\sqrt3}{2}i$.
        desarrollo: |
          **Con el giro de $-60°$:**

          $$
          (2-i)\left(\frac12-\frac{\sqrt3}{2}i\right)
          = \frac{(2-i)\left(1-\sqrt3\,i\right)}{2}
          $$

          $$
          = \frac{2-2\sqrt3\,i-i+\sqrt3\,i^{2}}{2}
          = \frac{\left(2-\sqrt3\right)-\left(2\sqrt3+1\right)i}{2}
          $$

          $$
          z_3 = (-3-i)+\frac{2-\sqrt3}{2}
          -\frac{2\sqrt3+1}{2}\,i
          $$

          $$
          = -\frac{4+\sqrt3}{2}-\frac{3+2\sqrt3}{2}\,i
          $$

          $$
          \approx -2{,}8660-3{,}2321\,i
          $$

          Parte real $-2{,}8660$, y **los dos** signos negativos: tercer
          cuadrante ✔
        veredicto: |
          El otro giro da $-1{,}134+0{,}232i$, que está en el **segundo**
          cuadrante. La condición del enunciado no es decorativa: elige entre
          las dos soluciones.

      - tipo: justificar
        pregunta: |
          Ordena la demostración del apartado (b). Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **Partir de las definiciones** en $\mathbb{C}$:
              $\mathrm{sen}\,z = \frac{\mathrm{e}^{iz}-\mathrm{e}^{-iz}}{2i}$ y
              $\cos z = \frac{\mathrm{e}^{iz}+\mathrm{e}^{-iz}}{2}$.
          - texto: |
              **Elevar al cuadrado.** Con $\left(2i\right)^{2} = -4$:
              $\mathrm{sen}^{2}z
              = -\frac{\mathrm{e}^{2iz}-2+\mathrm{e}^{-2iz}}{4}$.
          - texto: |
              Y $\cos^{2}z
              = \frac{\mathrm{e}^{2iz}+2+\mathrm{e}^{-2iz}}{4}$.
          - texto: |
              **Sumar:** los términos $\mathrm{e}^{2iz}$ y
              $\mathrm{e}^{-2iz}$ se cancelan y quedan
              $\frac{2+2}{4} = 1$. $\blacksquare$
          - texto: |
              **Y señalar por qué hacía falta demostrarlo:** en $\mathbb{R}$ la
              identidad sale del teorema de Pitágoras, que no significa nada
              para un argumento complejo.
          - texto: |
              Como la identidad vale para todo $z$ real y las dos funciones son
              continuas, vale también para todo $z$ complejo.
            trampa: true
            mensaje: |
              La continuidad no basta: hay funciones continuas que coinciden en
              $\mathbb{R}$ y no en $\mathbb{C}$, por ejemplo
              $\left\lvert z\right\rvert$ y $\sqrt{z^{2}}$. El argumento correcto
              en esa línea sería el **principio de prolongación analítica**, que
              exige holomorfía y no se ve en este curso. La demostración directa
              con exponenciales es de tres líneas y no necesita nada de eso.
        veredicto: |
          Extender una identidad de $\mathbb{R}$ a $\mathbb{C}$ «por
          continuidad» es un salto que hay que justificar. Con las definiciones
          exponenciales no hace falta ningún salto.

    resolucion: |
      **Datos.** Dos vértices de un equilátero, con la condición de que los tres
      estén en el tercer cuadrante; y una identidad que demostrar en
      $\mathbb{C}$.

      ### 1 · Apartado (a): la idea

      En complejos, **girar es multiplicar**. El tercer vértice se obtiene
      girando $z_2$ alrededor de $z_1$ un ángulo de $60°$:

      $$
      z_3 = z_1+\left(z_2-z_1\right)\mathrm{e}^{\pm i\pi/3}
      $$

      El paso intermedio $z_2-z_1$ traslada el giro al origen; el
      $+z_1$ lo devuelve a su sitio.

      **Hay dos soluciones**, una por cada sentido de giro, y el enunciado usa
      el tercer cuadrante para elegir.

      ### 2 · El lado

      $$
      z_2-z_1 = (-1-2i)-(-3-i) = 2-i,
      \qquad
      \ell = \sqrt5 \approx 2{,}236
      $$

      ### 3 · Los dos candidatos

      **Giro de $+60°$**, con
      $\mathrm{e}^{i\pi/3} = \frac12+\frac{\sqrt3}{2}i$:

      $$
      (2-i)\left(\frac{1+\sqrt3\,i}{2}\right)
      = \frac{2+2\sqrt3\,i-i+\sqrt3}{2}
      = \frac{\left(2+\sqrt3\right)+\left(2\sqrt3-1\right)i}{2}
      $$

      $$
      z_3^{+} = -3-i+\frac{2+\sqrt3}{2}+\frac{2\sqrt3-1}{2}i
      = \frac{\sqrt3-4}{2}+\frac{2\sqrt3-3}{2}i
      $$

      $$
      \approx -1{,}134+0{,}232\,i
      $$

      **Segundo cuadrante**: la parte imaginaria es positiva. **Se descarta.**

      **Giro de $-60°$**, con
      $\mathrm{e}^{-i\pi/3} = \frac12-\frac{\sqrt3}{2}i$:

      $$
      (2-i)\left(\frac{1-\sqrt3\,i}{2}\right)
      = \frac{\left(2-\sqrt3\right)-\left(2\sqrt3+1\right)i}{2}
      $$

      $$
      z_3^{-} = -3-i+\frac{2-\sqrt3}{2}-\frac{2\sqrt3+1}{2}i
      $$

      $$
      \boxed{z_3 = -\frac{4+\sqrt3}{2}-\frac{3+2\sqrt3}{2}\,i
      \approx -2{,}866-3{,}232\,i}
      $$

      Los dos signos negativos: **tercer cuadrante** ✔

      <figure class="figura-examen">
      <svg viewBox="0 0 400 380" role="img" width="380" height="361"
           aria-labelledby="f1617c1t f1617c1d">
