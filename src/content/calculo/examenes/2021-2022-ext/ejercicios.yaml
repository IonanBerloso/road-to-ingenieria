ejercicios:
  - id: ex2122-ext-1-tres-soluciones-y-un-triangulo
    titulo: Una ecuación con conjugado, y el triángulo que sale
    fuente: >-
      Ejercicio 1 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 29 de
      junio de 2022 · Cálculo, UPV/EHU · El mismo ejercicio es el 1 del examen
      global del mismo cuadernillo · El examen no publica solución: la
      resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Resolver y representar gráficamente las soluciones de la ecuación compleja
      $$
      z^{4}\,\overline{z}\,i+1=0
      $$
    pide: Las soluciones, y su dibujo.

    pasos:
      - tipo: reconocer
        pregunta: |
          Al pasar el $1$ al otro lado y despejar, ¿a qué es igual
          $z^{4}\overline z$?
        opciones:
          - texto: >-
              A $i$, porque $-\frac1i=i$
            correcta: true
            mensaje: |
              Eso es, y conviene hacerlo bien de entrada:
              $\frac1i=\frac{1}{i}\cdot\frac{-i}{-i}=-i$, así que $-\frac1i=+i$.
              Con el signo cambiado saldrían tres soluciones distintas y todas
              mal.
          - texto: A $-i$
            mensaje: |
              Ese es $\frac1i$, sin el menos de delante. La ecuación es
              $z^{4}\overline z\,i=-1$, y al dividir entre $i$ queda
              $-\frac1i=+i$.
          - texto: A $-1$
            mensaje: |
              Falta dividir entre la $i$. $z^{4}\overline z\,i=-1$ no es lo
              mismo que $z^{4}\overline z=-1$.

      - tipo: calcular
        titulo: El exponente del módulo
        pregunta: |
          En polar, $\left|z^{4}\overline z\right|=\rho^{n}$. ¿Cuánto vale $n$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              El $4$ es el exponente de $z^{4}$ solo. El conjugado aporta uno
              más de módulo: $\rho^{4}\cdot\rho=\rho^{5}$.
          - valor: '3'
            mensaje: |
              El $3$ es lo que queda en el **argumento**, porque el conjugado lo
              resta: $4\theta-\theta=3\theta$. En el módulo, en cambio, se suma.
          - valor: '8'
            mensaje: |
              $8$ saldría de $\left|z^{4}\right|^{2}$. El conjugado no eleva al
              cuadrado: tiene el mismo módulo que $z$.
        pista: |
          El módulo de un producto es el producto de los módulos, y
          $\left|\overline z\right|=\left|z\right|$.
        desarrollo: |
          $$
          \left|z^{4}\overline z\right|=\rho^{4}\cdot\rho=\rho^{5}
          \;\Longrightarrow\;
          \rho^{5}=1\;\Longrightarrow\;\rho=1
          $$

          Y en el argumento el conjugado **resta**:

          $$
          \arg\left(z^{4}\overline z\right)=4\theta-\theta=3\theta
          $$

      - tipo: calcular
        titulo: El primer argumento
        pregunta: |
          ¿Cuánto vale el primer argumento, como múltiplo de $\pi$? Es decir,
          contesta $\theta/\pi$.
        respuesta:
          tipo: numero
          valor: '0.1666667'
          tolerancia: 0.0005
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              $\frac\pi2$ es el argumento de $i$, no el de $z$. Hay que dividir
              entre $3$: $3\theta=\frac\pi2$.
          - valor: '0.125'
            mensaje: |
              $\frac\pi8$ saldría de dividir entre $4$. El argumento del lado
              izquierdo es $3\theta$, no $4\theta$: el conjugado se lleva uno.
          - valor: '0.3333333'
            mensaje: |
              $\frac\pi3$ es la **separación** entre soluciones consecutivas
              multiplicada por la mitad… en realidad las tres están separadas
              $\frac{2\pi}{3}$, y la primera está en $\frac\pi6$.
        pista: |
          $3\theta=\frac\pi2+2k\pi$, y con $k=0$.
        desarrollo: |
          $$
          3\theta=\frac{\pi}{2}+2k\pi
          \;\Longrightarrow\;
          \theta=\frac{\pi}{6}+\frac{2k\pi}{3}
          $$

          Con $k=0,1,2$: $\frac\pi6$, $\frac{5\pi}{6}$ y $\frac{3\pi}{2}$. Tres
          soluciones separadas $120^{\circ}$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Despejando, $z^{4}\overline z=-\frac1i=i$, que en polar es
              $1_{\pi/2}$.
          - texto: >-
              En polar, $z^{4}\overline z=\rho^{5}_{\,3\theta}$: los módulos se
              multiplican y el conjugado **resta** su argumento.
          - texto: >-
              De $\rho^{5}=1$ sale $\rho=1$, y de
              $3\theta=\frac\pi2+2k\pi$ salen tres argumentos separados
              $\frac{2\pi}{3}$: los vértices de un triángulo equilátero
              inscrito en la circunferencia unidad.
          - texto: >-
              Como el exponente del módulo es $5$, hay cinco soluciones.
            trampa: true
            mensaje: |
              El número de soluciones lo da el coeficiente del **argumento**, no
              el del módulo. Aquí el argumento va con $3\theta$, así que hay
              **tres**. El $\rho^{5}=1$ solo dice que todas tienen módulo uno —y
              en los reales positivos esa ecuación tiene una única solución—.
              Confundir los dos exponentes es lo que este enunciado provoca al
              poner un conjugado, que suma en el módulo y resta en el argumento.
    resolucion: |
      **Despejar, con cuidado con la $i$.**

      $$
      z^{4}\overline z\,i=-1
      \;\Longrightarrow\;
      z^{4}\overline z=-\frac{1}{i}=i
      $$

      —porque $\frac1i=-i$—. En polar, $i=1_{\pi/2}$.

      **El conjugado suma en el módulo y resta en el argumento.** Con
      $z=\rho_{\theta}$:

      $$
      z^{4}=\rho^{4}_{\,4\theta},
      \qquad
      \overline z=\rho_{-\theta}
      \;\Longrightarrow\;
      z^{4}\overline z=\rho^{5}_{\,3\theta}
      $$

      Ese asimetría es la gracia del ejercicio: **cinco en el módulo y tres en
      el argumento**.

      **Las dos ecuaciones.**

      $$
      \rho^{5}=1\;\Longrightarrow\;\rho=1
      \qquad\text{y}\qquad
      3\theta=\frac{\pi}{2}+2k\pi
      \;\Longrightarrow\;
      \theta=\frac{\pi}{6}+\frac{2k\pi}{3}
      $$

      $$
      \boxed{\;z=1_{\pi/6},\quad 1_{5\pi/6},\quad 1_{3\pi/2}\;}
      $$

      **Tres soluciones**, no cinco: el número lo marca el coeficiente del
      argumento. Y como están separadas $\frac{2\pi}{3}$ en la circunferencia
      unidad, son los **vértices de un triángulo equilátero**.

