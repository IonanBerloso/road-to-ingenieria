      Las tres soluciones sobre la circunferencia unidad, separadas ciento
      veinte grados: en treinta grados, en ciento cincuenta y en doscientos
      setenta. Unidas forman un triángulo equilátero.
      </figcaption>
      </figure>

      **Y ojo con el cero.** En la ecuación del año anterior —la extraordinaria
      de 2023-2024— $z=0$ **sí** era solución, porque los dos lados se anulaban.
      Aquí no: con $z=0$ el lado izquierdo vale $0+1=1$. El $+1$ suelto lo
      impide, y comprobarlo cuesta dos segundos.

  - id: ex2122-ext-2-cual-es-la-funcion-y-cual-la-derivada
    titulo: Dos curvas, cuál es cuál, y una tercera función construida con las dos
    fuente: >-
      Ejercicio 2 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 29 de
      junio de 2022 · Cálculo, UPV/EHU · La figura está redibujada del original
      · El mismo ejercicio es el 2 del examen global del mismo cuadernillo · El
      examen no publica solución: la resolución es propuesta nuestra, pendiente
      de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 4
      comp4: 5
    enunciado: |
      La figura muestra las gráficas de una función $y(x)$ y de su derivada
      $y'(x)$, definidas en un intervalo $\left(a,b\right)$. Se pide:

      a) Identificar de forma razonada qué gráfica corresponde a $y(x)$ y qué
      gráfica corresponde a $y'(x)$.

      b) Estudiar el crecimiento/decrecimiento y los extremos de la nueva
      función $h(x)=e^{-2x}\,y^{2}(x)$.

