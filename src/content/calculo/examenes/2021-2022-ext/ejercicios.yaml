      <figcaption>
      Figura redibujada del enunciado. Una de las dos curvas empieza por debajo
      del eje, sube hasta un máximo y luego baja; la otra empieza arriba,
      desciende hasta un tramo casi llano y sigue bajando. No hay escala: lo
      único que se puede leer son los signos y los cortes.
      </figcaption>
      </figure>
    pide: Cuál es cuál, y el estudio de h.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es el criterio para decidir cuál de las dos curvas es la
          derivada?
        opciones:
          - texto: >-
              La derivada **corta al eje** exactamente donde la otra tiene un
              extremo, y es positiva donde la otra sube
            correcta: true
            mensaje: |
              Eso es, y es lo único que hace falta. En la figura, una de las dos
              cruza el eje justo en la abscisa donde la otra alcanza su máximo:
              esa es la derivada.
          - texto: >-
              La derivada es siempre la curva más pequeña
            mensaje: |
              No hay ninguna relación de tamaño entre una función y su derivada:
              la escala del dibujo es arbitraria y las dos se han dibujado juntas
              solo para comparar formas.
          - texto: >-
              La derivada es la que tiene más oscilaciones
            mensaje: |
              Suele tener un extremo más, sí, pero eso no es un criterio: hay
              funciones cuya derivada oscila menos. El criterio bueno es el de
              los ceros.

      - tipo: reconocer
        pregunta: |
          ¿Cuál es la derivada de $h(x)=e^{-2x}y^{2}(x)$?
        opciones:
          - texto: $h'=2e^{-2x}\,y\left(y'-y\right)$
            correcta: true
            mensaje: |
              Eso es, y sacar el factor común es lo que resuelve el apartado:
              $h'=-2e^{-2x}y^{2}+e^{-2x}2yy'=2e^{-2x}y\left(y'-y\right)$. El
              signo lo deciden $y$ y **la diferencia entre las dos curvas**.
          - texto: $h'=e^{-2x}\left(2yy'\right)$
            mensaje: |
              Falta derivar la exponencial. Es un producto de dos funciones de
              $x$: hay que aplicar la regla del producto.
          - texto: $h'=-2e^{-2x}y^{2}$
            mensaje: |
              Falta derivar el $y^{2}$. Los dos factores dependen de $x$, así
              que los dos aportan.

      - tipo: calcular
        titulo: Cuántos extremos
        pregunta: |
          ¿Cuántos extremos locales tiene $h$ en $\left(a,b\right)$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Los dos ceros de $y$ dan dos mínimos, sí, pero también hay que
              contar los dos puntos donde las curvas **se cruzan**, que son los
              ceros del otro factor.
          - valor: '3'
            mensaje: |
              Tres serían si las curvas se cortaran una sola vez. En la figura se
              cortan **dos** veces, y $y$ se anula otras dos.
          - valor: '1'
            mensaje: |
              $h'$ es un producto de dos factores, y cada uno se anula dos veces
              en el intervalo: son cuatro cambios de signo.
        pista: |
          $h'=2e^{-2x}y\left(y'-y\right)$ se anula donde $y=0$ y donde las dos
          curvas del dibujo se cortan.
        desarrollo: |
          El factor $e^{-2x}$ nunca se anula. Quedan dos:

          - $y=0$: la curva de la función corta al eje **dos** veces;
          - $y'-y=0$: las dos curvas **se cortan** dos veces.

          Cuatro ceros de $h'$, y en los cuatro cambia de signo.

      - tipo: justificar
        pregunta: Ordena el estudio de $h$. Una pieza es falsa.
        piezas:
          - texto: >-
              $h'=2e^{-2x}y\left(y'-y\right)$, y como la exponencial es siempre
              positiva, el signo lo deciden $y$ y la diferencia $y'-y$.
          - texto: >-
              $y=0$ donde la curva de la función corta al eje, y allí $h=0$: como
              $h$ nunca es negativa, esos puntos son **mínimos** y valen cero.
          - texto: >-
              $y'-y=0$ donde las dos curvas **se cortan** en el dibujo, y allí
              $h$ tiene sus **máximos**.
          - texto: >-
              Como $h$ lleva un $e^{-2x}$, que decrece, $h$ decrece en todo el
              intervalo.
            trampa: true
            mensaje: |
              El producto de una función decreciente por otra no es
              necesariamente decreciente: depende de cuál gane. Aquí
              $e^{-2x}$ baja pero $y^{2}$ puede subir más deprisa, y de hecho
              $h$ crece en dos tramos. Es el mismo error que decir «como el
              precio baja y la cantidad sube, el gasto baja»: hay que derivar el
              producto, no mirar los factores por separado.
    resolucion: |
      **a) Cuál es cuál.** El criterio es uno solo: **la derivada corta al eje
      donde la función tiene un extremo**.

      En la figura, la curva que empieza arriba y desciende cruza el eje
      exactamente en la abscisa donde la otra alcanza su **máximo**. Luego:

      - la que empieza **por debajo** del eje, sube hasta un máximo y luego baja,
        es $y(x)$;
      - la que empieza **arriba** y desciende cruzando el eje en ese máximo es
        $y'(x)$.

      **Las dos comprobaciones que confirman.** Donde $y'$ está por encima del
      eje, $y$ sube ✓. Y el mínimo de $y'$ —el tramo donde más negativa se
      pone— cae donde $y$ baja más deprisa, que es su punto de inflexión ✓.

      **b) El estudio de $h$.** Lo primero es derivar bien, y sacar factor
      común:

      $$
      h'(x)=-2e^{-2x}y^{2}+e^{-2x}\cdot2yy'
      =2e^{-2x}\,y\left(y'-y\right)
      $$

      El $e^{-2x}$ es siempre positivo, así que **el signo de $h'$ es el de
      $y\left(y'-y\right)$**, y los dos factores se leen en el dibujo:

      | factor | se anula donde… |
      |---|---|
      | $y$ | la curva de la función **corta al eje** |
      | $y'-y$ | las **dos curvas se cortan** entre sí |

      Y de ahí sale todo:

      - en los ceros de $y$, $h=0$; y como $h=e^{-2x}y^{2}$ **nunca es
        negativa**, esos son **mínimos**, con valor cero;
      - en los cortes de las dos curvas, $h$ tiene sus **máximos**.

      Con la figura del enunciado, $y$ corta el eje dos veces y las curvas se
      cortan dos veces: **cuatro extremos**, alternando mínimo y máximo, y $h$
      decrece, crece, decrece, crece y vuelve a decrecer.

      **Por qué el reparto es 5 de explicación y 4 de cálculo.** Porque el
      cálculo es una derivada de producto y se acaba en dos líneas. Lo que se
      evalúa es **leer el dibujo**: identificar quién es quién y traducir «las
      dos curvas se cortan» en «el segundo factor se anula». Sin eso, la fórmula
      de $h'$ no sirve de nada.

  - id: ex2122-ext-3-un-mclaurin-y-un-elipsoide
    titulo: Un polinomio de dos términos y un elipsoide de revolución
    fuente: >-
      Ejercicio 3 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 29 de
      junio de 2022 · Cálculo, UPV/EHU · El mismo ejercicio es el 3 del examen
      global del mismo cuadernillo · El examen no publica solución: la
      resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      a) Sea la función
      $$
      f(x)=3+\int_{0}^{x}\frac{1+\operatorname{sen}t}{2+t^{2}}\,dt
      $$
      definida $\forall x\in\mathbb{R}$. Calcular el polinomio de McLaurin de
      orden 2 de $f(x)$.

      b) Sea la elipse $\dfrac{x^{2}}{25}+y^{2}=1$. Calcular el volumen del
      elipsoide generado al girar la elipse alrededor del eje OY.
    pide: El polinomio y el volumen.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado b), al girar alrededor de OY, ¿qué papel juega el $25$?
        opciones:
          - texto: >-
              Es $a^{2}$, el cuadrado del semieje que **gira**, y por eso aparece
              al cuadrado en el volumen
            correcta: true
            mensaje: |
              Eso es. Al girar alrededor de OY, el radio de cada disco es la
              coordenada $x$, cuyo semieje vale $5$. El volumen sale
              $\frac43\pi a^{2}b$ con $a=5$ y $b=1$.
          - texto: >-
              Es el radio del elipsoide
            mensaje: |
              El radio es $5$, no $25$: en la ecuación de la elipse el
              denominador es el **cuadrado** del semieje.
          - texto: >-
              Es la altura del elipsoide
            mensaje: |
              La altura es $2b=2$: la elipse llega de $y=-1$ a $y=1$. El $25$
              está bajo la $x$.

      - tipo: calcular
        titulo: El coeficiente cuadrático
        pregunta: |
          En $P_{2}(x)=3+\frac{x}{2}+kx^{2}$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              $\frac12$ es $f''(0)$, y el coeficiente lo divide entre $2!$.
          - valor: '0.125'
            mensaje: |
              $\frac18$ saldría con $f''(0)=\frac14$. Derivando el cociente y
              evaluando en cero sale $\frac{1\cdot2-1\cdot0}{4}=\frac12$.
          - valor: '0'
            mensaje: |
              Cero exigiría que $f''(0)$ se anulara. No: el numerador aporta un
              coseno que en el origen vale $1$.
        pista: |
          $f''=\frac{\cos x\left(2+x^{2}\right)-\left(1+\operatorname{sen}x
          \right)2x}{\left(2+x^{2}\right)^{2}}$, y en el origen el segundo
          término se anula.
        desarrollo: |
          $$
          f'(x)=\frac{1+\operatorname{sen}x}{2+x^{2}}
          \;\Longrightarrow\;
          f'(0)=\frac12
          $$

          $$
          f''(0)=\frac{1\cdot2-1\cdot0}{4}=\frac12
          \;\Longrightarrow\;
          k=\frac{f''(0)}{2!}=\frac14
          $$

          $$
          P_{2}(x)=3+\frac{x}{2}+\frac{x^{2}}{4}
          $$

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen del elipsoide?
        respuesta:
          tipo: numero
          valor: '104.7197551'
          tolerancia: 0.01
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '4.1887902'
            mensaje: |
              $\frac{4\pi}{3}$ es el volumen de la esfera de radio $1$. Aquí el
              semieje que gira mide $5$, y entra **al cuadrado**.
          - valor: '523.5987756'
            mensaje: |
              $\frac{500\pi}{3}$ sería con $a=5$ **y** $b=5$, o sea una esfera de
              radio $5$. El semieje vertical vale $1$.
          - valor: '20.9439510'
            mensaje: |
              $\frac{20\pi}{3}$ saldría con $a=5$ sin elevar al cuadrado. Al
              girar, el radio del disco entra al cuadrado.
        pista: |
          Discos perpendiculares a OY: el radio a la altura $y$ es
          $x=5\sqrt{1-y^{2}}$.
        desarrollo: |
          $$
          V=\pi\int_{-1}^{1}x^{2}\,dy=\pi\int_{-1}^{1}25\left(1-y^{2}\right)dy
          =25\pi\cdot\frac43=\frac{100\pi}{3}\approx104{,}72
          $$

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              Al girar alrededor de OY, cada sección horizontal es un disco cuyo
              radio es la coordenada $x$ de la elipse a esa altura.
          - texto: >-
              De $\frac{x^{2}}{25}+y^{2}=1$ sale $x^{2}=25\left(1-y^{2}\right)$,
              y la elipse va de $y=-1$ a $y=1$.
          - texto: >-
              $V=\pi\int_{-1}^{1}25\left(1-y^{2}\right)dy=\frac{100\pi}{3}$, que
              es la fórmula $\frac43\pi a^{2}b$ con $a=5$ y $b=1$.
          - texto: >-
              Como el elipsoide se genera girando la elipse, su volumen es el
              área de la elipse por la longitud de la circunferencia que recorre
              su centro.
            trampa: true
            mensaje: |
              Eso es el teorema de Pappus, y **no se puede aplicar aquí**: exige
              que la figura no cruce el eje de giro, y esta elipse está centrada
              **en** el eje. Pappus daría cero, porque el centroide está sobre el
              eje y recorre una circunferencia de longitud cero. Cuando la figura
              atraviesa el eje hay que integrar por discos.
    resolucion: |
      **a) El polinomio.** Por el teorema fundamental del Cálculo, la derivada
      es el integrando:

      $$
      f(0)=3,
      \qquad
      f'(x)=\frac{1+\operatorname{sen}x}{2+x^{2}}
      \;\Longrightarrow\;
      f'(0)=\frac12
      $$

      Y derivando el cociente:

      $$
      f''(x)=\frac{\cos x\left(2+x^{2}\right)
      -\left(1+\operatorname{sen}x\right)2x}{\left(2+x^{2}\right)^{2}}
      \;\Longrightarrow\;
      f''(0)=\frac{2-0}{4}=\frac12
      $$

      $$
      \boxed{\;P_{2}(x)=3+\frac{x}{2}+\frac{x^{2}}{4}\;}
      $$

      **La comprobación.** En $x=0{,}2$ el polinomio da $3{,}110$ y la integral
      numérica $3{,}109$: una milésima. En $x=0{,}5$ ya se separan quince
      milésimas, que es lo normal en un desarrollo de orden dos.

      **b) El elipsoide.** Al girar alrededor de **OY**, las secciones son discos
      horizontales y su radio es la $x$ de la elipse:

      $$
      x^{2}=25\left(1-y^{2}\right)
      $$

      $$
      V=\pi\int_{-1}^{1}25\left(1-y^{2}\right)dy
      =25\pi\left[y-\frac{y^{3}}{3}\right]_{-1}^{1}
      =25\pi\cdot\frac43
      $$

      $$
      \boxed{\;V=\frac{100\pi}{3}\approx104{,}72\;}
      $$

      **Y la fórmula general, que conviene reconocer.** Un elipsoide de
      revolución de semiejes $a$, $a$, $b$ tiene volumen $\frac43\pi a^{2}b$.
      Aquí $a=5$ —el semieje que gira, y por eso va al cuadrado— y $b=1$. Si el
      giro fuera alrededor de OX saldría $\frac43\pi\cdot1\cdot5=\frac{20\pi}{3}$,
      cinco veces menos: **el eje de giro cambia el resultado**, y mucho.

  - id: ex2122-ext-4-el-portico-de-tres-barras
    titulo: Tres barras, un pórtico, y un ángulo que sale redondo
    fuente: >-
      Ejercicio 4 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 29 de
      junio de 2022 · Cálculo, UPV/EHU · La figura está redibujada del original
      · Este no entra en el examen global del cuadernillo · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 8
      comp4: 1
    enunciado: |
      Se desea construir un pórtico simétrico de área máxima utilizando tres
      barras de longitud $L$. ¿Cuál debería ser el ángulo $\alpha$?

      <figure class="figura-examen">
      <svg viewBox="0 0 430 240" role="img" width="430" height="240"
           aria-labelledby="por22-t por22-d">
        <title id="por22-t">El portico de tres barras</title>
        <desc id="por22-d">Un trapecio isosceles abierto por abajo. Las tres barras
        iguales son la de arriba, horizontal, y las dos laterales, inclinadas el mismo
        angulo alfa respecto del suelo. El suelo cierra la figura pero no es una
        barra.</desc>
        <style>
          .por22-b { stroke: var(--live); stroke-width: 3.4; fill: none; stroke-linecap: round; }
          .por22-r { fill: var(--live); fill-opacity: .13; }
          .por22-s { stroke: var(--graphite); stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
          .por22-a { stroke: var(--alt); stroke-width: 1.8; fill: none; }
          .por22-n { fill: var(--faint); font-size: 11px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
          .por22-l { font-size: 12px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
        </style>
        <path class="por22-r" d="M115 195L165 108.4L265 108.4L315 195Z"/>
        <path class="por22-s" d="M115 195L315 195"/>
        <path class="por22-b" d="M115 195L165 108.4L265 108.4L315 195"/>
        <path class="por22-a" d="M143 195L143 193.8L142.9 192.6L142.8 191.3L142.6 190.1L142.3 188.9L142 187.8L141.7 186.6L141.3 185.4L140.9 184.3L140.4 183.2L139.8 182.1L139.2 181L138.6 180L137.9 178.9L137.2 178L136.4 177L135.6 176.1L134.8 175.2L133.9 174.4L133 173.6L132 172.8L131.1 172.1L130 171.4L129 170.8"/>
        <g class="por22-n">
          <text x="128" y="151.7" text-anchor="end">L</text>
          <text x="215" y="99.4" text-anchor="middle">L</text>
          <text x="302" y="151.7">L</text>
          <text x="149" y="187">α</text>
          <text x="215" y="211" text-anchor="middle">el suelo no es una barra</text>
        </g>
        <text class="por22-l" x="215" y="151.7" text-anchor="middle" fill="var(--live)">área máxima</text>
      </svg>
      <figcaption>
      Figura redibujada del enunciado. Tres barras iguales forman un trapecio
      isósceles abierto por abajo: la de arriba horizontal y las dos laterales
      inclinadas el mismo ángulo alfa respecto del suelo.
      </figcaption>
      </figure>
    pide: El ángulo que maximiza el área.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué figura forman las tres barras y el suelo?
        opciones:
          - texto: >-
              Un trapecio isósceles: la barra de arriba es el lado menor y el
              suelo el mayor
            correcta: true
            mensaje: |
              Eso es. El suelo **no es una barra** —solo hay tres—, pero cierra
              la figura, y su longitud depende del ángulo:
              $L+2L\cos\alpha$.
          - texto: Un triángulo isósceles
            mensaje: |
              Sería un triángulo si las dos barras laterales se juntaran arriba.
              Aquí hay una tercera barra horizontal entre ellas, así que el lado
              de arriba mide $L$ y no cero.
          - texto: Un rectángulo de lados L y L
            mensaje: |
              Solo si $\alpha=90^{\circ}$, que es un caso particular. El
              enunciado deja el ángulo libre justamente porque el rectángulo no
              es el óptimo.

      - tipo: calcular
        titulo: El ángulo óptimo
        pregunta: |
          ¿Cuánto vale $\cos\alpha$ en el óptimo?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '-1'
            mensaje: |
              $-1$ es la otra raíz de $2c^{2}+c-1=0$, y hay que descartarla en
              voz alta: correspondería a $\alpha=180^{\circ}$, con la figura
              aplastada y área cero.
          - valor: '0'
            mensaje: |
              $\cos\alpha=0$ es $\alpha=90^{\circ}$: el pórtico rectangular, de
              área $L^{2}$. Es menos que el óptimo, que da $1{,}299\,L^{2}$.
          - valor: '0.7071068'
            mensaje: |
              $\frac{\sqrt2}{2}$ es $\cos45^{\circ}$, y con ese ángulo el área
              sale $1{,}207\,L^{2}$: cerca del máximo pero no él.
        pista: |
          $A(\alpha)=L^{2}\left(1+\cos\alpha\right)\operatorname{sen}\alpha$, y
          al derivar aparece $2\cos^{2}\alpha+\cos\alpha-1$.
        desarrollo: |
          $$
          A'(\alpha)=L^{2}\left[-\operatorname{sen}^{2}\alpha
          +\left(1+\cos\alpha\right)\cos\alpha\right]
          =L^{2}\left[2\cos^{2}\alpha+\cos\alpha-1\right]
          $$

          Con $c=\cos\alpha$: $2c^{2}+c-1=0$ da $c=\frac12$ o $c=-1$. La segunda
          es el caso degenerado.

          $$
          \cos\alpha=\frac12\;\Longrightarrow\;\alpha=\frac{\pi}{3}=60^{\circ}
          $$

      - tipo: calcular
        titulo: El área máxima
        pregunta: |
          ¿Cuánto vale el área máxima, en unidades de $L^{2}$?
        respuesta:
          tipo: numero
          valor: '1.2990381'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $L^{2}$ es el área del pórtico **rectangular**, con
              $\alpha=90^{\circ}$. El óptimo encierra un treinta por ciento más.
          - valor: '0.8660254'
            mensaje: |
              $\frac{\sqrt3}{2}$ es $\operatorname{sen}60^{\circ}$, o sea la
              **altura** del pórtico óptimo, no su área.
          - valor: '1.5'
            mensaje: |
              $\frac32$ es el factor $1+\cos\alpha$. Falta multiplicarlo por
              $\operatorname{sen}\alpha=\frac{\sqrt3}{2}$.
        pista: |
          $A=L^{2}\left(1+\frac12\right)\cdot\frac{\sqrt3}{2}$.
        desarrollo: |
          $$
          A_{\max}=L^{2}\cdot\frac32\cdot\frac{\sqrt3}{2}
          =\frac{3\sqrt3}{4}L^{2}\approx1{,}299\,L^{2}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El trapecio tiene el lado de arriba $L$, el de abajo
              $L+2L\cos\alpha$ y altura $L\operatorname{sen}\alpha$.
          - texto: >-
              Su área es
              $A=\frac12\left(L+L+2L\cos\alpha\right)L\operatorname{sen}\alpha
              =L^{2}\left(1+\cos\alpha\right)\operatorname{sen}\alpha$.
          - texto: >-
              Derivando sale $2\cos^{2}\alpha+\cos\alpha-1=0$, con soluciones
              $\cos\alpha=\frac12$ y $\cos\alpha=-1$; la segunda es degenerada,
              así que $\alpha=60^{\circ}$.
          - texto: >-
              El máximo se alcanza con $\alpha=90^{\circ}$, porque el rectángulo
              es la figura que más área encierra con un perímetro dado.
            trampa: true
            mensaje: |
              El rectángulo **no** es la que más encierra —eso es el círculo— y
              además aquí no hay perímetro fijo: el suelo no es una barra, así
              que abrir el ángulo alarga la base gratis. Con $\alpha=90^{\circ}$
              el área es $L^{2}$; con $60^{\circ}$ es $1{,}299\,L^{2}$, un
              treinta por ciento más. Es exactamente el caso donde la intuición
              del rectángulo falla.
    resolucion: |
      **La figura.** Tres barras iguales de longitud $L$: una horizontal arriba
      y dos inclinadas $\alpha$ respecto del suelo. El suelo cierra la figura
      pero **no es una barra** — y ahí está la gracia del problema: abrir el
      ángulo alarga la base sin gastar material.

      | elemento | medida |
      |---|---|
      | lado de arriba | $L$ |
      | lado de abajo | $L+2L\cos\alpha$ |
      | altura | $L\operatorname{sen}\alpha$ |

      **El área del trapecio.**

      $$
      A=\frac{\text{arriba}+\text{abajo}}{2}\cdot\text{altura}
      =\frac{2L+2L\cos\alpha}{2}\cdot L\operatorname{sen}\alpha
      $$

      $$
      A(\alpha)=L^{2}\left(1+\cos\alpha\right)\operatorname{sen}\alpha,
      \qquad \alpha\in\left(0,\pi\right)
      $$

      **El máximo.**

      $$
      A'(\alpha)=L^{2}\left[-\operatorname{sen}^{2}\alpha+\cos\alpha
      +\cos^{2}\alpha\right]
      =L^{2}\left[2\cos^{2}\alpha+\cos\alpha-1\right]
      $$

      —usando $\operatorname{sen}^{2}=1-\cos^{2}$—. Con $c=\cos\alpha$:

      $$
      2c^{2}+c-1=0
      \;\Longrightarrow\;
      c=\frac{-1\pm3}{4}
      \;\Longrightarrow\;
      c=\frac12\ \text{ o }\ c=-1
      $$

      $c=-1$ sería $\alpha=180^{\circ}$, con la figura aplastada y área cero: se
      descarta.

      $$
      \boxed{\;\alpha=\frac{\pi}{3}=60^{\circ},
      \qquad A_{\max}=\frac{3\sqrt3}{4}L^{2}\approx1{,}299\,L^{2}\;}
      $$

      **Y lo bonito del resultado.** Con $\alpha=60^{\circ}$ el trapecio tiene
      los tres lados iguales a $L$ y la base $2L$: es **exactamente medio
      hexágono regular**. La figura que más área encierra con tres lados iguales
      y una base libre resulta ser la mitad de la que embaldosa el plano.

      **La comparación que conviene hacer.** El pórtico rectangular
      —$\alpha=90^{\circ}$— encierra $L^{2}$. El óptimo encierra un **treinta
      por ciento más**, y sin gastar ni un centímetro más de barra. La
      diferencia la paga el suelo, que se alarga de $L$ a $2L$.

  - id: ex2122-ext-5-la-curva-desconocida-y-el-area-de-diez
