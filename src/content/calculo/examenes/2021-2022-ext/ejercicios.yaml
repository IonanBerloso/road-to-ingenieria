        <path class="sie22-f" d="M27.1 175L93.1 175M93.1 175L96.4 170.9L99.7 166.8L102.9 162.7L106.2 158.7L109.5 154.6L112.8 150.5L116.1 146.4L119.4 142.3L122.7 138.2L126 134.2L129.3 130.1L132.6 126L135.9 121.9L139.2 117.8L142.5 113.7L145.8 109.7L149.1 105.6L152.4 101.5L155.7 97.4L159 93.3M159 175L225 175M225 175L228.3 170.9L231.6 166.8L234.9 162.7L238.2 158.7L241.5 154.6L244.8 150.5L248.1 146.4L251.4 142.3L254.7 138.2L258 134.2L261.3 130.1L264.6 126L267.9 121.9L271.2 117.8L274.5 113.7L277.8 109.7L281.1 105.6L284.4 101.5L287.7 97.4L291 93.3M291 175L356.9 175M356.9 175L360.2 170.9L363.5 166.8L366.8 162.7L370.1 158.7L373.4 154.6L376.7 150.5L380 146.4L383.3 142.3L386.6 138.2L389.9 134.2L393.2 130.1L396.5 126L399.8 121.9L403.1 117.8L406.4 113.7L409.7 109.7L413 105.6L416.3 101.5L419.6 97.4L422.9 93.3"/>
