        <text class="sie22-l" x="0.7" y="71">f(t), periodo 2π</text>
      </svg>
      <figcaption>
      La función vale cero de menos pi a cero y sube linealmente de cero a pi,
      y ese patrón se repite. Los saltos están en los múltiplos impares de pi,
      donde cae de pi a cero.
      </figcaption>
      </figure>

      **Los saltos, que hay que localizar antes de nada:** en $t=\pi$ —y en cada
      múltiplo impar— la función cae de $\pi$ a $0$. En $t=0$ **no** hay salto:
      los dos lados valen cero.

      **b) La serie.** La función no es par ni impar, así que hacen falta las
      dos familias de coeficientes.

      $$
      \frac{a_{0}}{2}=\frac{1}{2\pi}\int_{0}^{\pi}t\,dt=\frac{\pi}{4}
      $$

      $$
      a_{n}=\frac{1}{\pi}\int_{0}^{\pi}t\cos nt\,dt
      =\frac{1}{\pi}\cdot\frac{\left(-1\right)^{n}-1}{n^{2}}
      $$

      $$
      b_{n}=\frac{1}{\pi}\int_{0}^{\pi}t\operatorname{sen}nt\,dt
      =\frac{\left(-1\right)^{n+1}}{n}
      $$

      Los $a_{n}$ se anulan para $n$ par y valen $-\frac{2}{\pi n^{2}}$ para
      $n$ impar:

      $$
      \boxed{\;S(t)=\frac{\pi}{4}
      -\frac{2}{\pi}\sum_{n\ \text{impar}}\frac{\cos nt}{n^{2}}
      +\sum_{n=1}^{\infty}\frac{\left(-1\right)^{n+1}}{n}\operatorname{sen}nt\;}
      $$

      **c) Los dos puntos.**

      | punto | reduce a | qué hay ahí | $S$ | $f$ |
      |---|---|---|---|---|
      | $0$ | $0$ | continuo | $0$ | $0$ |
      | $3\pi$ | $\pi$ | **salto** de $\pi$ a $0$ | $\frac{\pi}{2}$ | $\pi$ |

      Y eso es lo que hay que justificar: en el origen la serie **coincide** con
      la función porque no hay salto; en $3\pi$ **no**, y la diferencia es de
      $\frac\pi2$.

      **d) La suma.** Evaluando en $t=0$, donde todos los senos valen cero y
      todos los cosenos valen uno:

      $$
      0=S(0)=\frac{\pi}{4}-\frac{2}{\pi}\sum_{n=1}^{\infty}
      \frac{1}{\left(2n-1\right)^{2}}
      $$

      $$
      \frac{2}{\pi}\sum=\frac{\pi}{4}
      \;\Longrightarrow\;
      \boxed{\;\sum_{n=1}^{\infty}\frac{1}{\left(2n-1\right)^{2}}
      =\frac{\pi^{2}}{8}\;}
      $$

      **Por qué el origen es el punto bueno.** Porque los senos se anulan todos
      —y son los que estorban— y los cosenos valen uno, dejando la suma desnuda.
      Y porque es continuo: si hubiera un salto, el lado izquierdo no sería
      $f(0)$ y la cuenta saldría otra. Evaluar en $\pi$, por ejemplo, daría
      $\frac\pi2=\frac\pi4+\frac{2}{\pi}\sum$, o sea la misma suma con otro
      camino — pero solo si se acuerda uno de poner $\frac\pi2$ y no $\pi$.
