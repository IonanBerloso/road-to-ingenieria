    pide: El valor de la integral a lo largo de L1.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el enunciado da el área y no la curva?
        opciones:
          - texto: >-
              Porque $Q_{x}-P_{y}$ es **constante**, y entonces la integral doble
              de Green solo depende del área
            correcta: true
            mensaje: |
              Eso es. Con $P=-y$ y $Q=x$ sale $Q_{x}-P_{y}=2$: la doble vale
              $2A$ sin más. Si el integrando no fuera constante, el área no
              bastaría y el enunciado sería irresoluble.
          - texto: >-
              Porque cualquier integral curvilínea depende solo del área
              encerrada
            mensaje: |
              Solo en este caso concreto. En general la integral doble de Green
              lleva $Q_{x}-P_{y}$ dentro, y si eso depende de $x$ y de $y$ hace
              falta conocer la región entera, no su área.
          - texto: >-
              Porque el campo es conservativo y la integral no depende del camino
            mensaje: |
              No lo es: $Q_{x}-P_{y}=2\ne0$. Si lo fuera, el área no haría ninguna
              falta.

      - tipo: calcular
        titulo: La circulación completa
        pregunta: |
          ¿Cuánto vale $\displaystyle\oint$ sobre la frontera, en sentido
          positivo?
        respuesta:
          tipo: numero
          valor: '20'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '10'
            mensaje: |
              $10$ es el área. Green la multiplica por $Q_{x}-P_{y}$, que vale
              $2$.
          - valor: '5'
            mensaje: |
              Parece que has dividido entre dos. La fórmula
              $A=\frac12\oint\left(-y\,dx+x\,dy\right)$ va al revés: aquí se pide
              la circulación, que es $2A$.
          - valor: '40'
            mensaje: |
              $40$ sería con $Q_{x}-P_{y}=4$. Repasa: $Q_{x}=1$ y $P_{y}=-1$.
        pista: |
          $Q_{x}-P_{y}=1-\left(-1\right)=2$, constante.
        desarrollo: |
          $$
          \oint_{\partial R}=\iint_{R}2\,dA=2A=20
          $$

      - tipo: calcular
        titulo: El resultado
        pregunta: |
          ¿Cuánto vale $I$?
        respuesta:
          tipo: numero
          valor: '7.4336294'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '12.5663706'
            mensaje: |
              $4\pi$ es lo que aporta el arco $L_{2}$, no $L_{1}$. Hay que
              restarlo de la circulación total.
          - valor: '32.5663706'
            mensaje: |
              Has **sumado** el arco en vez de restarlo. En la frontera positiva
              $L_{2}$ se recorre de $\left(2,0\right)$ a $\left(-2,0\right)$, y
              esa es la orientación con la que aporta $+4\pi$.
          - valor: '10'
            mensaje: |
              $10$ es el área. El campo $-y\,dx+x\,dy$ mide áreas sobre curvas
              **cerradas** y con un medio delante; $L_{1}$ no es cerrada.
        pista: |
          $I=\oint-\int_{L_{2}}$, y el arco vale $4\pi$.
        desarrollo: |
          Parametrizando $L_{2}$ con $x=2\cos\theta$,
          $y=2\operatorname{sen}\theta$, $\theta$ de $0$ a $\pi$, el integrando
          se simplifica a la constante $4$:

          $$
          \int_{L_{2}}=4\pi
          \;\Longrightarrow\;
          I=20-4\pi\approx7{,}434
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La frontera positiva es $L_{1}$ de $\left(-2,0\right)$ a
              $\left(2,0\right)$ y después $L_{2}$ de vuelta: por abajo de
              izquierda a derecha y por arriba al revés.
          - texto: >-
              Green da $\oint=\iint_{R}2\,dA=20$, y no hace falta conocer
              $L_{1}$ porque el integrando es constante.
          - texto: >-
              Sobre $L_{2}$ el integrando se simplifica a $4\,d\theta$ y la
              integral vale $4\pi$, así que $I=20-4\pi\approx7{,}43$.
          - texto: >-
              Este ejercicio es distinto del que cayó en la extraordinaria de
              2023-2024, porque allí el área también valía $10$ pero la curva
              $L_{1}$ era otra.
            trampa: true
            mensaje: |
              Es **exactamente el mismo**: mismo enunciado palabra por palabra,
              misma figura y mismo área. Y da igual que $L_{1}$ fuera otra: el
              método no la mira. Que un ejercicio se repita entre dos
              extraordinarias separadas por dos años no es casualidad, y es una
              de las razones por las que este corpus lleva la cuenta de los
              repetidos.
    resolucion: |
      **Lo primero, y decide el ejercicio.** De $L_{1}$ no se dice **nada**: ni
      su ecuación, ni su forma, ni cómo está parametrizada. Solo se da el área
      que encierra con el arco. Eso apunta a Green, y a que la integral doble
      dependa nada más que del área:

      $$
      P=-y,\qquad Q=x
      \;\Longrightarrow\;
      \frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}=1+1=2
      $$

      **Constante.** Por eso el área basta.

      **Cerrar el camino.** La frontera de la región recorrida en sentido
      positivo es $L_{1}$ de $\left(-2,0\right)$ a $\left(2,0\right)$ y luego
      $L_{2}$ de vuelta:

      $$
      \oint_{\partial R}=I+\int_{L_{2}}^{(2,0)\to(-2,0)}=\iint_{R}2\,dA=2\cdot10=20
      $$

      **El arco.** Con $x=2\cos\theta$, $y=2\operatorname{sen}\theta$ y $\theta$
      de $0$ a $\pi$ —que va justo de $\left(2,0\right)$ a
      $\left(-2,0\right)$—:

      $$
      -y\,dx+x\,dy
      =4\operatorname{sen}^{2}\theta\,d\theta+4\cos^{2}\theta\,d\theta=4\,d\theta
      $$

      El integrando se simplifica a una **constante**, y la integral vale
      $4\pi$.

      $$
      \boxed{\;I=20-4\pi\approx7{,}434\;}
      $$

      **La comprobación de diez segundos.** Para este campo,
      $\frac12\oint$ mide el área encerrada; sobre un arco centrado en el origen
      lo que mide es el doble del área del sector barrido. Aquí el sector es
      medio disco de radio $2$, de área $2\pi$, y $2\cdot2\pi=4\pi$ ✓.

      **Y un aviso.** Este ejercicio volvió a caer, palabra por palabra y con la
      misma figura, en la extraordinaria de 2023-2024, dos años después. No es
      raro: en este corpus dos de cada diez ejercicios de extraordinaria son
      copia de otro examen.

  - id: ex2122-ext-6-una-exacta-entre-tres
    titulo: Tres ecuaciones, y hay que decir cuál es cuál antes de resolver
    fuente: >-
      Ejercicio 2 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 29 de
      junio de 2022 · Cálculo, UPV/EHU · El mismo ejercicio es el 5 del examen
      global del mismo cuadernillo · El examen no publica solución: la
      resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Sean las EDOs
      $$
      y'=\frac{2xy}{3x^{2}-y^{2}}
      \quad;\quad
      xy'-y=x^{3}
      \quad;\quad
      \frac{-e^{y}}{2y+xe^{y}}=y'
      $$
      Una de ellas es exacta, otra homogénea y la otra lineal. Decir de qué tipo
      es cada una y resolver la que sea exacta.
    pide: La clasificación de las tres y la solución de la exacta.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál de las tres es la **homogénea**?
        opciones:
          - texto: >-
              La primera, porque numerador y denominador son homogéneos del mismo
              grado
            correcta: true
            mensaje: |
              Eso es: $2xy$ y $3x^{2}-y^{2}$ son los dos de grado $2$, así que
              al sustituir $x\to tx$, $y\to ty$ los $t^{2}$ se cancelan y $y'$
              solo depende de $y/x$. Ese es el test rápido.
          - texto: La segunda
            mensaje: |
              La segunda es $xy'-y=x^{3}$, o sea $y'-\frac{y}{x}=x^{2}$: forma
              estándar de una **lineal**.
          - texto: La tercera
            mensaje: |
              La tercera lleva $e^{y}$, que no es homogénea de ningún grado:
              $e^{ty}\ne t^{k}e^{y}$. Es la exacta.

      - tipo: calcular
        titulo: La comprobación de la exacta
        pregunta: |
          Escribiendo la tercera como $e^{y}dx+\left(2y+xe^{y}\right)dy=0$,
          ¿cuánto valen $M_{y}$ y $N_{x}$ en el punto $x=2$, $y=1$?
        respuesta:
          tipo: numero
          valor: '2.7182818'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '5.4365637'
            mensaje: |
              $2e$ saldría de derivar mal: $M=e^{y}$ y su derivada respecto de
              $y$ es $e^{y}$, sin ningún factor delante.
          - valor: '2'
            mensaje: |
              El $2$ es el coeficiente del $2y$, que desaparece al derivar
              respecto de $x$. Lo que queda de $N$ es $e^{y}$.
          - valor: '1'
            mensaje: |
              $1$ sería $e^{0}$. Aquí $y=1$, así que $e^{y}=e\approx2{,}718$.
        pista: |
          $M=e^{y}$ y $N=2y+xe^{y}$; deriva cada una por la variable que no le
          toca.
        desarrollo: |
          $$
          M_{y}=e^{y},
          \qquad
          N_{x}=e^{y}
          $$

          Coinciden **en todo punto**, no solo en este: la ecuación es exacta.
          En $\left(2,1\right)$ las dos valen $e\approx2{,}718$.

      - tipo: calcular
        titulo: La constante de una solución
        pregunta: |
          La solución es $xe^{y}+y^{2}=C$. ¿Cuánto vale $C$ para la curva que
          pasa por $\left(1,0\right)$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Con $y=0$ el término $y^{2}$ se anula, pero el otro no:
              $xe^{0}=1\cdot1=1$.
          - valor: '2'
            mensaje: |
              $2$ saldría de $1+1$, contando el $y^{2}$ como $1$. Con $y=0$ ese
              término vale cero.
          - valor: '2.7182818'
            mensaje: |
              $e$ es $e^{1}$, y aquí el exponente es $y=0$: $e^{0}=1$.
        pista: |
          $e^{0}=1$.
        desarrollo: |
          $$
          C=1\cdot e^{0}+0^{2}=1
          $$

      - tipo: justificar
        pregunta: Ordena la resolución de la exacta. Una pieza es falsa.
        piezas:
          - texto: >-
              Escrita en forma diferencial, la tercera es
              $e^{y}dx+\left(2y+xe^{y}\right)dy=0$, y $M_{y}=N_{x}=e^{y}$: es
              exacta.
          - texto: >-
              Integrando $F_{x}=e^{y}$ respecto de $x$ sale $F=xe^{y}+g(y)$, con
              una función de $y$ como constante de integración.
          - texto: >-
              Derivando respecto de $y$ e igualando a $N$:
              $xe^{y}+g'(y)=2y+xe^{y}$, o sea $g'(y)=2y$ y $g=y^{2}$. La solución
              es $xe^{y}+y^{2}=C$.
          - texto: >-
              La solución se puede despejar en $y$, y conviene hacerlo para
              terminar el ejercicio.
            trampa: true
            mensaje: |
              No se puede: $xe^{y}+y^{2}=C$ mezcla una exponencial y un polinomio
              en $y$, y no hay forma de aislarla con funciones elementales. Una
              solución **implícita** es una solución completa, y en las
              ecuaciones exactas es lo normal. Perder tiempo intentando despejar
              es el error de gestión que este tipo de ejercicio provoca.
    resolucion: |
      **La clasificación, con su comprobación.**

      **Homogénea: la primera.** $y'=\frac{2xy}{3x^{2}-y^{2}}$. Sustituyendo
      $x\to tx$, $y\to ty$, arriba sale $t^{2}\cdot2xy$ y abajo
      $t^{2}\left(3x^{2}-y^{2}\right)$: los $t^{2}$ se cancelan y $y'$ solo
      depende del cociente $y/x$. Es la definición.

      **Lineal: la segunda.** $xy'-y=x^{3}$, y dividiendo entre $x$:

      $$
      y'-\frac{1}{x}\,y=x^{2}
      $$

      Forma estándar $y'+p(x)y=q(x)$.

      **Exacta: la tercera.** Escrita en forma diferencial,

      $$
      \frac{-e^{y}}{2y+xe^{y}}=y'=\frac{dy}{dx}
      \;\Longrightarrow\;
      e^{y}\,dx+\left(2y+xe^{y}\right)dy=0
      $$

      $$
      M_{y}=e^{y},\qquad N_{x}=e^{y}
      $$

      Coinciden en todo punto. Y no es homogénea —la exponencial no lo es— ni
      lineal —la incógnita está en un exponente—.

      **Resolver la exacta.** Se busca $F$ con $F_{x}=M$ y $F_{y}=N$:

      $$
      F=\int e^{y}\,dx=x\,e^{y}+g(y)
      $$

      La constante de integración es una **función de $y$**: al derivar respecto
      de $x$, cualquier cosa que solo dependa de $y$ desaparece.

      $$
      F_{y}=xe^{y}+g'(y)=2y+xe^{y}
      \;\Longrightarrow\;
      g'(y)=2y
      \;\Longrightarrow\;
      g(y)=y^{2}
      $$

      $$
      \boxed{\;x\,e^{y}+y^{2}=C\;}
      $$

      **La comprobación, derivando implícitamente.**

      $$
      e^{y}+xe^{y}y'+2yy'=0
      \;\Longrightarrow\;
      y'=\frac{-e^{y}}{xe^{y}+2y}
      $$

      que es exactamente la ecuación del enunciado ✓.

      **Y no se despeja.** $xe^{y}+y^{2}=C$ no tiene solución explícita en $y$ y
      no hace falta que la tenga: una solución implícita es una solución. Lo que
      sí sería incompleto es dejar la constante sin nombre o no comprobar la
      exactitud, que es justo lo que el enunciado pide con «comprobando».

  - id: ex2122-ext-7-el-sistema-acoplado-por-laplace
    titulo: Dos ecuaciones que se persiguen, resueltas de un tirón
    fuente: >-
      Ejercicio 3 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 29 de
      junio de 2022 · Cálculo, UPV/EHU · El mismo ejercicio es el 6 del examen
      global del mismo cuadernillo · El examen no publica solución: la
      resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Utilizando la transformada de Laplace resolver el sistema
      $$
      \left\{
      \begin{aligned}
      x'(t)&=2x(t)+3y(t)\\
      y'(t)&=3x(t)+2y(t)\\
      x(0)&=2,\qquad y(0)=0
      \end{aligned}
      \right.
      $$
    pide: Las dos funciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué se convierte el sistema al transformar?
        opciones:
          - texto: >-
              En un sistema **algebraico** de dos ecuaciones con dos incógnitas,
              $X(s)$ e $Y(s)$
            correcta: true
            mensaje: |
              Eso es, y es la razón de usar Laplace aquí: dos ecuaciones
              diferenciales acopladas se convierten en dos ecuaciones lineales
              de bachillerato. Las condiciones iniciales entran al transformar y
              no hay que volver a por ellas.
          - texto: >-
              En una sola ecuación diferencial de segundo orden
            mensaje: |
              Eso es lo que sale **sin** Laplace, derivando una y sustituyendo la
              otra. Funciona, pero es más largo y hay que arrastrar las
              condiciones iniciales hasta el final.
          - texto: >-
              En dos ecuaciones independientes, una para cada incógnita
            mensaje: |
              No: al transformar siguen acopladas. Lo que cambia es que ahora
              son **algebraicas**, y desacoplarlas es sustituir, no derivar.

      - tipo: calcular
        titulo: Las raíces del sistema
        pregunta: |
          Al despejar, el denominador es $\left(s-a\right)\left(s+1\right)$.
          ¿Cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              El $2$ es el coeficiente de la diagonal. El denominador sale de
              $\left(s-2\right)^{2}-9=0$, o sea $s-2=\pm3$, y de ahí $5$ y $-1$.
          - valor: '3'
            mensaje: |
              El $3$ es el coeficiente cruzado, y aparece en la ecuación
              $\left(s-2\right)^{2}=9$ como su raíz cuadrada, no como raíz del
              denominador.
          - valor: '4'
            mensaje: |
              $4$ no sale de ningún sitio. Resuelve $\left(s-2\right)^{2}-9=0$.
        pista: |
          Eliminando $Y$ queda $X\left[\left(s-2\right)^{2}-9\right]$ en el
          numerador del despeje.
        desarrollo: |
          Transformando:

          $$
          \left(s-2\right)X-3Y=2,
          \qquad
          -3X+\left(s-2\right)Y=0
          $$

          De la segunda, $Y=\frac{3X}{s-2}$, y sustituyendo:

          $$
          \left[\left(s-2\right)^{2}-9\right]X=2\left(s-2\right)
          $$

          $$
          \left(s-2\right)^{2}=9\;\Longrightarrow\;s=5\ \text{ o }\ s=-1
          $$

      - tipo: calcular
        titulo: La solución en un instante
        pregunta: |
          ¿Cuánto vale $y\left(0{,}2\right)$?
        respuesta:
          tipo: numero
          valor: '1.8995508'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '3.5370051'
            mensaje: |
              Eso es $x\left(0{,}2\right)=e+e^{-0{,}2}$. La otra incógnita lleva
              un **menos** entre los dos términos.
          - valor: '2.7182818'
            mensaje: |
              $e^{5\cdot0{,}2}=e$ a secas. Falta restarle $e^{-0{,}2}$.
          - valor: '0'
            mensaje: |
              $0$ es $y(0)$, el dato inicial. En $t=0{,}2$ la solución ya ha
              despegado.
        pista: |
          $y(t)=e^{5t}-e^{-t}$, y con $t=0{,}2$ el primer exponente vale $1$.
        desarrollo: |
          $$
          y\left(0{,}2\right)=e^{1}-e^{-0{,}2}
          \approx2{,}7183-0{,}8187=1{,}8996
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Transformando y metiendo las condiciones iniciales:
              $\left(s-2\right)X-3Y=2$ y $-3X+\left(s-2\right)Y=0$.
          - texto: >-
              Despejando,
              $X=\frac{2\left(s-2\right)}{\left(s-5\right)\left(s+1\right)}
              =\frac{1}{s-5}+\frac{1}{s+1}$, y de ahí
              $x(t)=e^{5t}+e^{-t}$.
          - texto: >-
              Y $Y=\frac{3X}{s-2}=\frac{6}{\left(s-5\right)\left(s+1\right)}
              =\frac{1}{s-5}-\frac{1}{s+1}$, o sea
              $y(t)=e^{5t}-e^{-t}$.
          - texto: >-
              Como $y(0)=0$, la segunda ecuación no aporta nada al transformar y
              se puede omitir.
            trampa: true
            mensaje: |
              Que $y(0)=0$ hace que el término $-y(0)$ desaparezca, pero la
              ecuación entera **sigue haciendo falta**: es la que relaciona $Y$
              con $X$ y permite eliminar una de las dos incógnitas. Sin ella el
              sistema queda con dos incógnitas y una ecuación. Confundir «una
              condición inicial vale cero» con «la ecuación sobra» es el error
              que este dato provoca.
    resolucion: |
      **Transformar las dos, con sus condiciones iniciales.** Con
      $\mathcal{L}\{x'\}=sX-x(0)=sX-2$ y $\mathcal{L}\{y'\}=sY-0$:

      $$
      \left\{
      \begin{aligned}
      sX-2&=2X+3Y\\
      sY&=3X+2Y
      \end{aligned}
      \right.
      \;\Longrightarrow\;
      \left\{
      \begin{aligned}
      \left(s-2\right)X-3Y&=2\\
      -3X+\left(s-2\right)Y&=0
      \end{aligned}
      \right.
      $$

      **Un sistema lineal de bachillerato.** De la segunda,
      $Y=\frac{3X}{s-2}$, y sustituyendo en la primera:

      $$
      \left(s-2\right)X-\frac{9X}{s-2}=2
      \;\Longrightarrow\;
      X\cdot\frac{\left(s-2\right)^{2}-9}{s-2}=2
      $$

      $$
      X=\frac{2\left(s-2\right)}{\left(s-2\right)^{2}-9}
      =\frac{2\left(s-2\right)}{\left(s-5\right)\left(s+1\right)}
      $$

      —porque $\left(s-2\right)^{2}-9$ es una diferencia de cuadrados:
      $\left(s-2-3\right)\left(s-2+3\right)$—.

      **Las fracciones simples, con el método de cubrir.**

      $$
      X=\frac{1}{s-5}+\frac{1}{s+1},
      \qquad
      Y=\frac{3X}{s-2}=\frac{6}{\left(s-5\right)\left(s+1\right)}
      =\frac{1}{s-5}-\frac{1}{s+1}
      $$

      $$
      \boxed{\;x(t)=e^{5t}+e^{-t},\qquad y(t)=e^{5t}-e^{-t}\;}
      $$

      **Las comprobaciones, y hay tres gratis.**

      1. $x(0)=1+1=2$ ✓ e $y(0)=1-1=0$ ✓.
      2. Sustituyendo en la primera ecuación: $x'=5e^{5t}-e^{-t}$, y
         $2x+3y=2e^{5t}+2e^{-t}+3e^{5t}-3e^{-t}=5e^{5t}-e^{-t}$ ✓.
      3. Y la elegante: $x+y=2e^{5t}$ y $x-y=2e^{-t}$. Sumando y restando las
         dos ecuaciones del sistema original sale
         $\left(x+y\right)'=5\left(x+y\right)$ y
         $\left(x-y\right)'=-\left(x-y\right)$, que es **el mismo sistema
         desacoplado a mano**. Los $5$ y $-1$ que aparecieron en el denominador
         son $2+3$ y $2-3$.

      **Lo que se ve en la solución.** Las dos funciones se disparan igual a la
      larga —domina $e^{5t}$— pero al principio se separan: $x$ arranca en $2$ y
      $y$ en $0$. La diferencia entre las dos, $2e^{-t}$, se apaga; el sistema
      «olvida» las condiciones iniciales y las dos incógnitas acaban siendo la
      misma función.

  - id: ex2122-ext-8-la-rampa-que-solo-ocupa-media-onda
    titulo: Una rampa que solo ocupa media onda, y la suma que sale del origen
    fuente: >-
      Ejercicio 4 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 29 de
      junio de 2022 · Cálculo, UPV/EHU · Este no entra en el examen global del
      cuadernillo · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Sea $f(t)$ la función periódica de periodo $T=2\pi$ definida de la
      siguiente forma:
      $$
      f(t)=
      \begin{cases}
      0 & -\pi<t\le0\\
      t & 0<t<\pi
      \end{cases}
      $$

      a) Dibujar la función periódica $f(t)$.

      b) Calcular la serie de Fourier, $S(t)$, de $f(t)$.

      c) Calcular los valores de $S(t)$ y $f(t)$ en los puntos $t=0$ y
      $t=3\pi$.

      d) Obtener la suma de la serie
      $\displaystyle\sum_{n=1}^{\infty}\frac{1}{\left(2n-1\right)^{2}}$.
    pide: Los cuatro apartados.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Es esta función par, impar, o ninguna de las dos?
        opciones:
          - texto: >-
              Ninguna de las dos, así que hay que calcular los $a_{n}$ **y** los
              $b_{n}$
            correcta: true
            mensaje: |
              Eso es, y decirlo de entrada evita el error de dar por nulos unos
              coeficientes que no lo son. La función vale cero en media onda y
              sube en la otra: no hay simetría de ningún tipo.
          - texto: >-
              Par, porque la mitad izquierda es plana
            mensaje: |
              Par exigiría $f(-t)=f(t)$, y aquí $f(-1)=0$ mientras que $f(1)=1$.
              Ser plana en un lado no es una simetría.
          - texto: >-
              Impar, porque la parte de la izquierda vale cero
            mensaje: |
              Impar exigiría $f(-t)=-f(t)$, o sea $f(-1)=-1$, y vale $0$. Ojo:
              una función que vale cero en media onda **no** es impar por eso.

      - tipo: calcular
        titulo: El término constante
        pregunta: |
          ¿Cuánto vale $\dfrac{a_{0}}{2}$?
        respuesta:
          tipo: numero
          valor: '0.7853982'
          tolerancia: 0.0005
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.5707963'
            mensaje: |
              $\frac{\pi}{2}$ es la media de la **rampa sola**, en
              $\left(0,\pi\right)$. Pero el promedio se toma sobre el periodo
              entero, y en la otra mitad la función vale cero: sale la mitad.
          - valor: '3.1415927'
            mensaje: |
              $\pi$ es el valor **máximo** de la función, no su media.
          - valor: '0'
            mensaje: |
              Cero sería si la función fuera impar o si su área en un periodo se
              cancelara. Aquí es siempre $\ge0$, así que la media es positiva.
        pista: |
          $\frac{a_{0}}{2}=\frac{1}{2\pi}\int_{-\pi}^{\pi}f$, y en media onda la
          función vale cero.
        desarrollo: |
          $$
          \frac{a_{0}}{2}=\frac{1}{2\pi}\int_{0}^{\pi}t\,dt
          =\frac{1}{2\pi}\cdot\frac{\pi^{2}}{2}=\frac{\pi}{4}\approx0{,}785
          $$

      - tipo: calcular
        titulo: El valor en el punto grande
        pregunta: |
          ¿Cuánto vale $S\left(3\pi\right)$?
        respuesta:
          tipo: numero
          valor: '1.5707963'
          tolerancia: 0.0005
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '3.1415927'
            mensaje: |
              $\pi$ es el límite por la **izquierda**: la rampa llega hasta ahí.
              Pero justo después empieza el tramo plano, que vale $0$, y la
              serie se queda en la media.
          - valor: '0'
            mensaje: |
              $0$ es el límite por la derecha. La serie no elige un lado del
              salto: toma el punto medio.
          - valor: '9.4247780'
            mensaje: |
              $3\pi$ sin reducir. La serie es periódica: hay que restar
              múltiplos de $2\pi$ antes de evaluar.
        pista: |
          $3\pi-2\pi=\pi$, y en $\pi$ hay un salto de $\pi$ a $0$.
        desarrollo: |
          $$
          3\pi-2\pi=\pi
          $$

          En $t=\pi$ la función salta: por la izquierda vale $\pi$ y por la
          derecha empieza el tramo nulo del periodo siguiente. Por Dirichlet,

          $$
          S\left(3\pi\right)=\frac{\pi+0}{2}=\frac{\pi}{2}\approx1{,}571
          $$

      - tipo: justificar
        pregunta: Ordena el apartado d). Una pieza es falsa.
        piezas:
          - texto: >-
              Los cosenos salen
              $a_{n}=\frac{1}{\pi}\cdot\frac{\left(-1\right)^{n}-1}{n^{2}}$:
              cero si $n$ es par y $-\frac{2}{\pi n^{2}}$ si es impar.
          - texto: >-
              En $t=0$ la función es **continua** —los dos lados valen cero— así
              que $S(0)=f(0)=0$, y los senos se anulan todos.
          - texto: >-
              Queda $0=\frac{\pi}{4}-\frac{2}{\pi}\sum\frac{1}{\left(2n-1
              \right)^{2}}$, y de ahí la suma vale $\frac{\pi^{2}}{8}$.
          - texto: >-
              En $t=0$ hay un salto, así que hay que tomar la media de los dos
              límites laterales.
            trampa: true
            mensaje: |
              En $t=0$ **no** hay salto: por la izquierda la función viene del
              tramo plano y vale $0$, y por la derecha la rampa arranca también
              en $0$. Los dos límites coinciden. El salto está en $\pm\pi$, no
              en el origen. Aplicar Dirichlet donde no hace falta no cambia el
              resultado aquí —la media de $0$ y $0$ es $0$—, pero el
              razonamiento es falso y en otro punto daría mal.
    resolucion: |
      **a) La función.** Cero en media onda y una rampa en la otra, repetido
      cada $2\pi$: una sierra con los dientes separados por tramos planos.

