        consigna: |
          Dibuja el lugar geométrico en el plano complejo, con los ejes
          marcados. Señala los puntos $1$ y $2$, la circunferencia completa a
          trazos y encima, en trazo grueso, el arco que de verdad cumple la
          condición.
        comprueba:
          - punto: |
              Los puntos $1$ y $2$ marcados sobre el eje real, y el segmento
              que los une dibujado como **diámetro**.
            porque: |
              Es lo que enseña de dónde sale la circunferencia: el arco capaz
              de $90^\circ$ sobre ese segmento. Sin el diámetro, el dibujo no
              explica nada.
          - punto: |
              La circunferencia de centro $\left(\tfrac32,0\right)$ y radio
              $\tfrac12$.
            porque: |
              Centro en el punto medio y radio la mitad de la distancia: son
              los dos números que hay que leer del dibujo, y comprobarlos
              cuesta nada.
          - punto: |
              Solo la **mitad superior** en trazo grueso, la inferior a
              trazos o sin dibujar.
            porque: |
              El enunciado pide argumento $+\tfrac\pi2$, no $\pm$. La mitad de
              abajo también ve el segmento bajo ángulo recto, pero con
              argumento $-\tfrac\pi2$. Aquí es donde se decide la nota.
          - punto: |
              Los extremos $z=1$ y $z=2$ marcados como **excluidos** —con
              círculo hueco—.
            porque: |
              En $z=1$ el denominador se anula y en $z=2$ el cociente vale
              $0$, cuyo argumento no existe. Son dos motivos distintos y los
              dos dejan fuera el punto.
        veredicto: |
          Si dudas de cuál es la mitad, prueba el punto más alto,
          $\tfrac32+\tfrac12 i$: el cociente sale $i$, de argumento
          $+\tfrac\pi2$ ✔. Un punto de prueba resuelve la duda más deprisa que
          cualquier razonamiento sobre signos.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** Se pide el lugar de los $z$ con
      $\arg\left(\frac{z-2}{z-1}\right) = \frac{\pi}{2}$.

      **Reparto de puntos del examen:** COMP1 1 · COMP2 6 · COMP4 3. Este
      examen tiene **tres ejercicios y 30 puntos**.

      > Este enunciado es el **ejercicio 1.23 del boletín** del tema 1.

      ### 1 · Restricciones previas

      El cociente exige $z \neq 1$. Y el argumento de $0$ no está definido, así
      que también $z \neq 2$. Los dos puntos quedan excluidos desde el
      principio, y resulta que son justo los extremos del arco.

      ### 2 · Qué dice la condición

      El argumento de un cociente es la diferencia de argumentos:

      $$
      \arg\left(\frac{z-2}{z-1}\right) = \arg(z-2)-\arg(z-1)
      $$

      $\arg(z-2)$ es la dirección del vector que va del punto $2$ al afijo de
      $z$; $\arg(z-1)$, la del que va de $1$. Que su diferencia valga
      $\frac{\pi}{2}$ significa que **esos dos vectores forman un ángulo
      recto**, es decir que desde $z$ el segmento que une 1 y 2 se ve bajo
      $90^{\circ}$.

      ### 3 · El teorema del ángulo inscrito

      Los puntos desde los que un segmento se ve bajo un ángulo recto forman la
      circunferencia que tiene ese segmento como **diámetro**. Aquí el segmento
      va de $(1,0)$ a $(2,0)$:

      $$
      \text{centro } \left(\frac{3}{2},\,0\right),
      \qquad
      r = \frac{\left|2-1\right|}{2} = \frac{1}{2}
      $$

      $$
      \left(x-\frac{3}{2}\right)^{2}+y^{2} = \frac{1}{4}
      $$

      ### 4 · Solo la mitad

      Y aquí está el paso que decide el ejercicio. La condición **no** es
      «ángulo recto» a secas: es argumento **exactamente $+\frac{\pi}{2}$**. En
      la mitad inferior el ángulo también es recto, pero el argumento del
      cociente sale $-\frac{\pi}{2}$.

      Se decide probando un punto. En el más alto de la circunferencia,
      $z = \frac32+\frac12 i$:

      $$
      \frac{z-2}{z-1} = \frac{-\frac12+\frac12 i}{\frac12+\frac12 i}
      = \frac{-1+i}{1+i}
      = \frac{(-1+i)(1-i)}{(1+i)(1-i)}
      = \frac{2i}{2} = i
      $$

      cuyo argumento es $+\frac{\pi}{2}$ ✔. Luego sirve la mitad **superior**.

      $$
      \left(x-\frac{3}{2}\right)^{2}+y^{2} = \frac{1}{4}
      \qquad\text{con}\qquad y>0
      $$

      Los extremos $1$ y $2$ no entran, y ya estaban excluidos por las
      restricciones previas: encaja.

      ### 5 · Por qué aquí no se usa el comprobador de regiones

      Este lugar geométrico es una **curva**, no una región con área. La
      herramienta de comparación de regiones que usan otros ejercicios del sitio
      compara manchas de puntos, y dos curvas dibujadas con grosores distintos
      no se solapan aunque sean la misma. Por eso este ejercicio se resuelve
      dando el centro, el radio y la mitad.

      ### 6 · Representación gráfica

      Una semicircunferencia de centro $\left(\frac32,0\right)$ y radio
      $\frac12$, dibujada solo por encima del eje real, con los dos extremos
      —$(1,0)$ y $(2,0)$— marcados con círculo hueco por estar excluidos. El
      punto más alto es $\left(\frac32,\frac12\right)$.

      ### 7 · Comprobación

      Con $z = \frac32+\frac12 i$: está en la circunferencia porque
      $0+\frac14 = \frac14$ ✔, tiene $y>0$ ✔ y el cociente vale $i$ ✔.

      Con el simétrico, $z = \frac32-\frac12 i$: está en la circunferencia,
      pero

      $$
      \frac{z-2}{z-1} = \frac{-\frac12-\frac12 i}{\frac12-\frac12 i}
      = \frac{-1-i}{1-i} = -i
      $$

      de argumento $-\frac{\pi}{2}$ ✗. Queda fuera, como debe.

      Y uno que no esté en la circunferencia, $z = 3$:

      $$
      \frac{3-2}{3-1} = \frac12
      $$

      real positivo, de argumento 0 ✗. También fuera.

      ### Resultado

      $$
      \boxed{\;\left(x-\tfrac{3}{2}\right)^{2}+y^{2} = \tfrac{1}{4}
      \quad\text{con}\quad y>0\;}
      $$

  - id: ex1718-2-exponencial-recta-vertical
    titulo: Una exponencial que da una recta vertical
    fuente: >-
      Ejercicio 2 · Primera evaluación, 9 de octubre de 2017 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 6
      comp4: 4

    nivel: examen
    enunciado: |
      Calcular y representar las soluciones de la ecuación

      $$
      e^{z} = -1+\sqrt{3}\,i,
      \qquad z \in \mathbb{C}
      $$
    pide: Calcular las soluciones y representarlas.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace que la exponencial compleja tenga infinitas preimágenes?
        opciones:
          - texto: >-
              Que es **periódica de periodo $2\pi i$**, así que no es inyectiva
            correcta: true
            mensaje: |
              Eso es. $e^{z+2\pi i} = e^{z}\,e^{2\pi i} = e^{z}$, y la
              periodicidad es lo que impide invertirla de forma única. El
              logaritmo complejo hereda esa ambigüedad en su $2\pi k$.
          - texto: Que puede valer cero
            mensaje: |
              Nunca vale cero: $\left|e^{z}\right| = e^{\operatorname{Re} z} > 0$
              siempre. Precisamente por eso la ecuación $e^{z}=c$ tiene solución
              para todo $c \neq 0$.
          - texto: Que su módulo puede ser negativo
            mensaje: |
              Un módulo nunca es negativo. Lo que sí puede ser negativo, y es lo
              interesante, es el propio valor de $e^{z}$:
              $e^{i\pi} = -1$.
          - texto: Que no está definida en todo el plano
            mensaje: |
              Sí lo está: la exponencial compleja es entera, definida en todo
              $\mathbb{C}$. Lo que no es es inyectiva.

      - tipo: calcular
        titulo: La parte real de las soluciones
        pregunta: |
          ¿Cuál es la parte real de todas las soluciones? En forma exacta, o con tres decimales.
        respuesta:
          tipo: numero
          valor: '0.693'
          tolerancia: 0.005
          formato: un número, o una expresión como ln 2
        distractores:
          - valor: '2'
            mensaje: |
              2 es el **módulo** del segundo miembro. La parte real de $z$ es su
              logaritmo: $\ln 2 \approx 0{,}693$.
          - valor: '1.386'
            mensaje: |
              $1{,}386$ es $\ln 4$, es decir $2\ln 2$. El módulo es
              $\sqrt{1+3} = 2$, no 4: cuidado con la raíz.
          - valor: '2.094'
            mensaje: |
              $\frac{2\pi}{3} \approx 2{,}094$ es el **argumento**, que va a la
              parte imaginaria. Aquí no hay ninguna $i$ multiplicando fuera que
              las intercambie.
        pista: |
          $\left|-1+\sqrt3 i\right| = \sqrt{1+3} = 2$, y la parte real de $z$ es
          $\ln$ del módulo.
        desarrollo: |
          $$
          \left|-1+\sqrt3\,i\right| = \sqrt{1+3} = 2
          $$

          Al tomar logaritmos,

          $$
          z = \ln\left|c\right| + i\left(\arg c + 2\pi k\right)
            = \ln 2 + i\left(\frac{2\pi}{3}+2\pi k\right)
          $$

          Así que

          $$
          \operatorname{Re}(z) = \ln 2 \approx 0{,}693
          $$

          igual para todas: no depende de $k$.
        veredicto: |
          Como aquí no hay ninguna $i$ multiplicando a $z$, el módulo se queda
          en la parte real y el argumento en la imaginaria. En el ejercicio 2 de
          2020-2021 había una $i$ y los papeles se cruzaban.

      - tipo: calcular
        titulo: El argumento del segundo miembro
        pregunta: |
          ¿Cuál es el argumento de $-1+\sqrt3\,i$, en grados?
        respuesta:
          tipo: numero
          valor: '120'
          tolerancia: 0.5
          formato: un número de grados
        distractores:
          - valor: '-60'
            mensaje: |
              $-60^{\circ}$ es lo que da el arcotangente a secas,
              $\arctan\left(-\sqrt3\right)$. Pero el afijo está en el **segundo
              cuadrante** —real negativa, imaginaria positiva— y el arcotangente
              nunca devuelve ángulos de ahí. Hay que sumar $180^{\circ}$.
          - valor: '60'
            mensaje: |
              $60^{\circ}$ sería el argumento de $1+\sqrt3 i$, con la parte real
              **positiva**. Aquí es $-1$.
          - valor: '240'
            mensaje: |
              $240^{\circ}$ cae en el tercer cuadrante, donde las dos partes son
              negativas. Aquí la imaginaria es $+\sqrt3$.
        pista: |
          Parte real negativa, imaginaria positiva: segundo cuadrante.
        desarrollo: |
          El afijo de $-1+\sqrt3 i$ está en el **segundo cuadrante**. Con
          $\tan\theta = \frac{\sqrt3}{-1} = -\sqrt3$, los candidatos en
          $[0^{\circ},360^{\circ})$ son $120^{\circ}$ y $300^{\circ}$, y hay que
          quedarse con el del segundo cuadrante:

          $$
          \arg = 120^{\circ} = \frac{2\pi}{3}
          $$

          Comprobación: $2\cos120^{\circ} = -1$ y
          $2\,\mathrm{sen}\,120^{\circ} = \sqrt3$ ✔
        veredicto: |
          Es el error que más se repite en toda la colección de exámenes: fiarse
          del arcotangente sin mirar en qué cuadrante cae el afijo.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              El segundo miembro tiene módulo $\sqrt{1+3} = 2$ y argumento
              $\frac{2\pi}{3}$, por estar en el segundo cuadrante.
          - texto: |
              La exponencial compleja es periódica de periodo $2\pi i$, así que
              al tomar logaritmos aparece $2\pi k$ con $k \in \mathbb{Z}$.
          - texto: |
              $z = \ln 2 + i\left(\frac{2\pi}{3}+2\pi k\right)$,
              $k \in \mathbb{Z}$.
          - texto: |
              Todas tienen la **misma parte real**, $\ln 2$, y partes
              imaginarias que se diferencian en $2\pi$.
          - texto: |
              Los afijos son puntos equiespaciados sobre la **recta vertical**
              $x = \ln 2$.
          - texto: |
              Como el segundo miembro tiene parte real negativa, las soluciones
              también la tienen.
            trampa: true
            mensaje: |
              No hay ninguna relación entre el signo de la parte real de $c$ y
              el de la de $z$. La parte real de $z$ es
              $\ln\left|c\right|$, que depende del **módulo**, siempre positivo.
              Aquí $\left|c\right| = 2 > 1$, así que $\ln 2 > 0$ y las
              soluciones están a la **derecha** del eje imaginario.
        veredicto: |
          Si el módulo hubiera sido menor que 1, la recta caería a la
          izquierda; si valiera exactamente 1, sobre el eje imaginario. El
          módulo coloca la recta.

      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 260 265" role="img" width="260" height="265"
               aria-labelledby="f-ex1718-vertical-t f-ex1718-vertical-d">
