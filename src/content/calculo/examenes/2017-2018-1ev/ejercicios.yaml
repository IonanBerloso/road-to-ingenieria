            <text class="f-ex1718-vertical-l" x="14" y="18" text-anchor="start" fill="var(--live)">x = ln 2 siempre</text>
          </svg>
        consigna: |
          Dibuja los afijos de las soluciones en el plano complejo. Marca tres
          consecutivos y la recta que los contiene.
        comprueba:
          - punto: |
              Todos los puntos sobre la **recta vertical** $x=\ln 2\approx0{,}69$.
            porque: |
              La parte real de $z$ es $\ln\lvert-1+\sqrt3 i\rvert=\ln 2$, y no
              depende de $k$. Que salga una recta vertical y no horizontal es el
              resultado del ejercicio.
          - punto: |
              Separación vertical de $2\pi\approx6{,}28$ entre puntos
              consecutivos.
            porque: |
              Es el periodo imaginario de la exponencial compleja. La fila de
              puntos es la imagen de esa periodicidad.
          - punto: |
              El valor principal en $y=\tfrac{2\pi}{3}\approx2{,}09$.
            porque: |
              $-1+\sqrt3 i$ tiene módulo $2$ y argumento $120^\circ$, que está en
              el segundo cuadrante. Poner $-60^\circ$ por hacer el arcotangente
              sin mirar el cuadrante es el error clásico.
          - punto: |
              Puntos también por debajo del eje real, en
              $y=\tfrac{2\pi}{3}-2\pi\approx-4{,}19$.
            porque: |
              $k$ recorre todos los enteros. Dibujar solo hacia arriba es dar
              media respuesta.
        veredicto: |
          Compárese con $e^{iz}=1+i$, cuya solución es una fila **horizontal**:
          el $i$ del exponente gira la figura un cuarto de vuelta. Aquí no lo
          hay, y por eso la recta es vertical.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** Resolver $e^{z} = -1+\sqrt3\,i$ en $\mathbb{C}$ y representar
      las soluciones.

      **Reparto de puntos del examen:** COMP2 6 · COMP4 4. **No se evalúa
      COMP1**, así que los cuatro puntos de explicación se los llevan
      justificar la periodicidad y describir bien el dibujo.

      ### 1 · Por qué hay infinitas soluciones

      La exponencial compleja es **periódica de periodo $2\pi i$**:

      $$
      e^{z+2\pi i} = e^{z}\,e^{2\pi i} = e^{z}\cdot 1 = e^{z}
      $$

      No es inyectiva, así que $e^{z} = c$ tiene infinitas soluciones siempre
      que $c \neq 0$. Y $c \neq 0$ aquí, así que la ecuación tiene solución: de
      hecho la exponencial **nunca** vale cero, porque
      $\left|e^{z}\right| = e^{\operatorname{Re} z} > 0$.

      Esa ambigüedad es la que recoge el logaritmo complejo:

      $$
      \ln c = \ln\left|c\right| + i\left(\arg c + 2\pi k\right),
      \qquad k \in \mathbb{Z}
      $$

      ### 2 · El segundo miembro, en polar

      $$
      \left|-1+\sqrt3\,i\right| = \sqrt{1+3} = 2
      $$

      El afijo tiene parte real negativa y parte imaginaria positiva: está en el
      **segundo cuadrante**. Con $\tan\theta = -\sqrt3$ los candidatos son
      $120^{\circ}$ y $300^{\circ}$, y hay que quedarse con el primero:

      $$
      \arg = 120^{\circ} = \frac{2\pi}{3}
      $$

      Se comprueba: $2\cos\frac{2\pi}{3} = -1$ y
      $2\,\mathrm{sen}\,\frac{2\pi}{3} = \sqrt3$ ✔

      $$
      -1+\sqrt3\,i = 2\,e^{i\frac{2\pi}{3}}
      $$

      ### 3 · Tomar logaritmos

      $$
      z = \ln 2 + i\left(\frac{2\pi}{3}+2\pi k\right),
      \qquad k \in \mathbb{Z}
      $$

      Aquí no hay que despejar nada más: la incógnita estaba sola en el
      exponente.

      ### 4 · Representación gráfica

      Todas las soluciones tienen la **misma parte real**, $\ln 2 \approx
      0{,}693$, y partes imaginarias separadas $2\pi$:

      $$
      \dots,\quad \ln 2 - \frac{4\pi}{3}\,i,
      \quad \ln 2 + \frac{2\pi}{3}\,i,
      \quad \ln 2 + \frac{8\pi}{3}\,i, \quad\dots
      $$

      Es decir, puntos equiespaciados sobre la **recta vertical**
      $x = \ln 2$, a la derecha del eje imaginario.

      La posición de la recta la fija el **módulo**: como $2>1$, su logaritmo es
      positivo y la recta cae a la derecha. Con módulo 1 caería justo sobre el
      eje imaginario, y con módulo menor que 1, a la izquierda.

      Merece la pena compararlo con el ejercicio 2 del examen 2020-2021, que era
      $e^{-iz} = c$: allí la $i$ del exponente **cruzaba** los papeles y las
      soluciones caían en una recta horizontal. Aquí no hay $i$ multiplicando, y
      la recta es vertical.

      ### 5 · Comprobación

      Con $k=0$, $z = \ln 2 + \frac{2\pi}{3}i$:

      $$
      e^{z} = e^{\ln 2}\,e^{i\frac{2\pi}{3}}
      = 2\left(\cos\frac{2\pi}{3}+i\,\mathrm{sen}\,\frac{2\pi}{3}\right)
      = 2\left(-\frac12+\frac{\sqrt3}{2}i\right)
      = -1+\sqrt3\,i \quad\checkmark
      $$

      Con $k=1$, $z = \ln 2 + \frac{8\pi}{3}i$:

      $$
      e^{z} = 2\,e^{i\frac{8\pi}{3}} = 2\,e^{i\left(\frac{2\pi}{3}+2\pi\right)}
      = 2\,e^{i\frac{2\pi}{3}} \quad\checkmark
      $$

      Las dos dan lo mismo, como tiene que ser.

      Y una comprobación de coherencia que sale gratis: el módulo del resultado
      tiene que ser 2, y $\left|e^{z}\right| = e^{\ln 2} = 2$ ✔

      ### Resultado

      $$
      \boxed{\;z = \ln 2 + i\left(\frac{2\pi}{3}+2\pi k\right),
      \qquad k \in \mathbb{Z}\;}
      $$

  - id: ex1718-3-limite-no-positivo
    titulo: El límite de una sucesión de términos no positivos
    fuente: >-
      Ejercicio 3 · Primera evaluación, 9 de octubre de 2017 · Cálculo
      (Industriales), UPV/EHU · Mismo enunciado que el ejercicio 3 de
      2024-2025. El examen no publica solución: la demostración es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 0
      comp4: 8

    nivel: examen
    enunciado: |
      Demostrar la siguiente propiedad:

      $$
      \text{Si } a_n \le 0 \;\;\forall n \in \mathbb{N}
      \;\text{ y }\; \{a_n\}_{n\in\mathbb{N}} \text{ converge hacia } L,
      \text{ entonces } L \le 0
      $$
    pide: Demostrar la propiedad.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué la conclusión es $L \le 0$ y no $L < 0$?
        opciones:
          - texto: >-
              Porque el límite puede valer **exactamente cero**, como en
              $a_n = -\frac1n$
            correcta: true
            mensaje: |
              Ese es el matiz del ejercicio. $-\frac1n$ tiene todos sus términos
              estrictamente negativos y su límite es 0. Al pasar al límite, las
              desigualdades estrictas **se debilitan**.
          - texto: Porque la hipótesis también lleva $\le$
            mensaje: |
              Es cierto que la hipótesis lleva $\le$, pero la conclusión sería
              $\le$ igualmente aunque la hipótesis fuera estricta. El motivo es
              más fuerte: el límite puede alcanzar la cota.
          - texto: Porque $L$ podría no existir
            mensaje: |
              El enunciado **da** por hipótesis que la sucesión converge hacia
              $L$. La existencia no está en discusión.
          - texto: Por convenio, para que la propiedad sea más general
            mensaje: |
              No es un convenio: es que $L<0$ sería **falso**. Hay un
              contraejemplo explícito.

      - tipo: calcular
        titulo: El épsilon de la reducción al absurdo
        pregunta: |
          Se supone $L>0$ para llegar al absurdo. Con $L = 0{,}6$, ¿qué
          $\varepsilon$ conviene tomar?
        respuesta:
          tipo: numero
          valor: '0.3'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.6'
            mensaje: |
              Con $\varepsilon = L$ el intervalo llega justo hasta 0 y la
              desigualdad $a_n>0$ deja de ser estricta: podría ser $a_n=0$, que
              el enunciado permite. Con la mitad el choque es limpio.
          - valor: '1.2'
            mensaje: |
              Has multiplicado por 2 en vez de dividir. Un épsilon mayor que $L$
              deja el 0 dentro del entorno y no contradice nada.
          - valor: '0'
            mensaje: |
              La definición exige $\varepsilon>0$ estrictamente. Con
              $\varepsilon=0$ la condición $\left|a_n-L\right|<0$ no la cumple
              nadie.
        pista: |
          La distancia de $L$ a 0 es $0{,}6$. Toma la mitad.
        desarrollo: |
          $$
          \varepsilon = \frac{L}{2} = \frac{0{,}6}{2} = 0{,}3
          $$

          Con ese valor, a partir de cierto $m$:

          $$
          a_n > L-\varepsilon = 0{,}6-0{,}3 = 0{,}3 > 0
          $$

          y eso contradice $a_n \le 0$ para todo $n$.
        veredicto: |
          Es el mismo épsilon que en los ejercicios 2.3 a 2.6 del boletín y en
          otros cuatro exámenes de esta colección.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Por reducción al absurdo, supongamos que $L>0$.
          - texto: |
              Se toma $\varepsilon = \dfrac{L}{2} > 0$, positivo precisamente
              porque se ha supuesto $L$ positivo.
          - texto: |
              Por definición de límite existe $m$ tal que
              $\left|a_n-L\right| < \varepsilon$ para todo $n>m$; en particular
              $a_n > L-\varepsilon = \dfrac{L}{2} > 0$.
          - texto: |
              Pero la hipótesis dice $a_n \le 0$ para **todo** $n$.
              Contradicción, luego $L \le 0$.
          - texto: |
              Basta comprobarlo con la sucesión $a_n = -\frac1n$, que cumple la
              hipótesis y tiene límite 0.
            trampa: true
            mensaje: |
              Un ejemplo **no demuestra** una propiedad universal. $-\frac1n$
              sirve para otra cosa —para ver que la conclusión no se puede
              reforzar a $L<0$—, pero no para probar el enunciado, que habla de
              **todas** las sucesiones con esa propiedad.
        veredicto: |
          El ejemplo y la demostración hacen trabajos distintos, y los dos hacen
          falta: uno prueba la propiedad, el otro marca su límite.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > demostración propuesta, pendiente de revisión.

      **Datos.** $a_n \le 0$ para todo $n$ y $a_n \to L$. Demostrar que
      $L \le 0$.

      **Reparto de puntos del examen:** COMP1 2 · COMP4 8. **Ni un punto de
      cálculo.**

      > El mismo enunciado cayó en el **ejercicio 3 de 2024-2025**, allí con los
      > diez puntos enteros en COMP4. Y es el reflejo del **2.3 del boletín**,
      > que prueba lo simétrico para términos no negativos.

      ### 1 · Estrategia

      La tesis es una desigualdad **no estricta**, y esas se demuestran casi
      siempre por reducción al absurdo: se supone lo contrario, $L>0$, y se
      busca el choque con la hipótesis.

      Conviene escribir la definición que se va a usar, porque es parte de lo
      que se puntúa:

      $$
      \lim a_n = L \iff
      \forall \varepsilon>0 \;\exists\, m \in \mathbb{N} :\;
      n>m \Rightarrow \left|a_n-L\right| < \varepsilon
      $$

      ### 2 · La demostración

      Supongamos $L>0$. Entonces se puede tomar

      $$
      \varepsilon = \frac{L}{2} > 0
      $$

      —positivo **precisamente porque** $L$ lo es, y esto hay que decirlo: si
      $L$ fuera negativo, este $\varepsilon$ no valdría—.

      Por la definición de límite existe $m \in \mathbb{N}$ tal que para todo
      $n>m$

      $$
      \left|a_n-L\right| < \varepsilon
      \;\Longrightarrow\;
      a_n > L-\varepsilon = L-\frac{L}{2} = \frac{L}{2} > 0
      $$

      Es decir: **todos** los términos a partir de $m$ serían estrictamente
      positivos. Pero la hipótesis dice que $a_n \le 0$ para todo $n$.
      Contradicción.

      Por tanto la suposición era falsa y

      $$
      L \le 0 \qquad \blacksquare
      $$

      ### 3 · Por qué $\le$ y no $<$

      La conclusión no se puede reforzar, y el contraejemplo es inmediato:

      $$
      a_n = -\frac{1}{n}
      $$

      tiene todos sus términos **estrictamente** negativos y su límite es
      exactamente 0.

      La regla general: al pasar al límite, **las desigualdades estrictas se
      debilitan**. De $a_n<0$ solo se deduce $L \le 0$.

      **Y ojo con el papel de ese ejemplo:** no demuestra el enunciado. Sirve
      para marcar su frontera, no para probarlo. Confundir las dos cosas es lo
      que castiga la pieza trampa de este ejercicio.

      ### 4 · La misma propiedad, del otro lado

      Aplicando este resultado a la sucesión $-a_n$, que es no negativa, se
      obtiene $-L \ge 0$, es decir $L \le 0$: los dos enunciados —este y el
      2.3 del boletín— son equivalentes y cada uno se deduce del otro.

      Escribirlo en el examen no ahorra la demostración, pero enseña que se ha
      visto la simetría.

      ### 5 · Comprobación

      No sustituye a la demostración, pero detecta signos cambiados. Se
      construye una sucesión que tienda a un límite positivo y se cuenta cuántos
      términos consigue mantener no positivos:

      $$
      a_n = 0{,}6-\frac{1}{n} \;\longrightarrow\; 0{,}6
      $$

      $$
      a_1 = -0{,}4 \le 0, \qquad a_2 = 0{,}1 > 0, \qquad a_3 = 0{,}27 > 0,\dots
      $$

      Solo uno. Y con el $\varepsilon = 0{,}3$ de la demostración: desde
      $\frac1n < 0{,}3$, o sea $n \ge 4$, todos superan $0{,}3$. Los términos no
      positivos son siempre **finitos**, que es justo lo que la hipótesis
      —«para todo $n$»— prohíbe.

      ### Resultado

      $$
      \boxed{\;a_n \le 0 \;\;\forall n \;\;\text{y}\;\; a_n \to L
      \;\;\Longrightarrow\;\; L \le 0\;}
      $$
