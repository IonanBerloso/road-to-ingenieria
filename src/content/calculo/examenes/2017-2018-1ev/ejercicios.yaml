ejercicios:
  - id: ex1718-1-semicircunferencia
    titulo: Media circunferencia, y el signo que decide cuál
    fuente: >-
      Ejercicio 1 · Primera evaluación, 9 de octubre de 2017 · Cálculo
      (Industriales), UPV/EHU · Enunciado idéntico al ejercicio 1.23 del
      boletín del tema 1. El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3

    enunciado: |
      Calcular y representar geométricamente los afijos de los números
      complejos $z$ que verifican la siguiente condición:

      $$
      \arg\left(\frac{z-2}{z-1}\right) = \frac{\pi}{2}
      $$
    pide: Calcular el lugar geométrico y representarlo.

    pasos:
      - tipo: reconocer
        pregunta: |
          Un ángulo recto entre dos direcciones, ¿qué figura describe?
        opciones:
          - texto: >-
              La circunferencia que tiene el segmento como **diámetro**, por el
              teorema del ángulo inscrito
            correcta: true
            mensaje: |
              Eso es. Los puntos desde los que un segmento se ve bajo
              $90^{\circ}$ forman la circunferencia de diámetro ese segmento.
              Es el caso más conocido del arco capaz, y el único en el que el
              arco es media circunferencia exacta.
          - texto: Una recta perpendicular al segmento
            mensaje: |
              La recta aparece cuando la diferencia de argumentos vale 0 o
              $\pi$, es decir cuando los tres puntos están alineados. Con
              $\frac{\pi}{2}$ la figura se curva.
          - texto: Una circunferencia de Apolonio
            mensaje: |
              Apolonio sale cuando lo constante es el **cociente de módulos**.
              Aquí lo que se fija es el argumento.
          - texto: Una hipérbola equilátera
            mensaje: |
              Las cónicas aparecen con sumas o diferencias de distancias, no con
              ángulos fijos. El lugar del ángulo constante es circular.

      - tipo: calcular
        titulo: El radio
        pregunta: |
          ¿Cuál es el radio de la circunferencia?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es la **longitud del segmento** de 1 a 2, que aquí es el
              diámetro. El radio es su mitad.
          - valor: '1.5'
            mensaje: |
              $1{,}5$ es la abscisa del **centro**, el punto medio entre 1 y 2.
              No es el radio.
          - valor: '2'
            mensaje: |
              2 es uno de los dos puntos de referencia. El radio sale de la
              distancia entre ellos, que vale 1, dividida entre 2.
        pista: |
          El segmento va de 1 a 2 y es el diámetro.
        desarrollo: |
          Los dos puntos de referencia son $1$ y $2$, y el segmento que los une
          es el **diámetro**:

          $$
          \text{diámetro} = \left|2-1\right| = 1
          \;\Longrightarrow\;
          r = \frac12
          $$

          El centro es el punto medio:

          $$
          c = \frac{1+2}{2} = \frac{3}{2}
          $$

          $$
          \left(x-\frac32\right)^{2}+y^{2} = \frac14
          $$
        veredicto: |
          Con un ángulo distinto de $90^{\circ}$ el segmento dejaría de ser
          diámetro y habría que usar $c = 2R\,\mathrm{sen}\,\theta$. El caso
          recto es el único cómodo.

      - tipo: calcular
        titulo: El punto más alto
        pregunta: |
          De los puntos del lugar geométrico, ¿cuál tiene mayor parte
          imaginaria? Dalo en forma binómica.
        respuesta:
          tipo: complejo
          valor: 1.5+0.5i
          tolerancia: 0.01
          formato: forma binómica, por ejemplo 1.5+0.5i
        distractores:
          - valor: 1.5-0.5i
            mensaje: |
              Ese es el punto más **bajo**, y además no pertenece al lugar: en
              la mitad inferior el argumento del cociente vale
              $-\frac{\pi}{2}$, no $+\frac{\pi}{2}$.
          - valor: '1.5'
            mensaje: |
              $\frac32$ es el **centro** de la circunferencia, no un punto de
              ella. El más alto está un radio por encima.
          - valor: 0.5i
            mensaje: |
              Te falta la parte real. El centro está en $x=\frac32$, no en el
              eje imaginario.
        pista: |
          Centro $\left(\frac32,0\right)$ y radio $\frac12$. El punto más alto
          está justo encima del centro.
        desarrollo: |
          El punto más alto de una circunferencia está sobre su centro, a
          distancia el radio:

          $$
          z = \frac32+\frac12 i
          $$

          Y hay que comprobar que **pertenece al lugar**, porque solo vale media
          circunferencia:

          $$
          \frac{z-2}{z-1} = \frac{-\frac12+\frac12 i}{\frac12+\frac12 i}
          = \frac{-1+i}{1+i} = \frac{(-1+i)(1-i)}{2} = \frac{2i}{2} = i
          $$

          cuyo argumento es $+\frac{\pi}{2}$ ✔
        veredicto: |
          Ese cálculo sirve para dos cosas a la vez: da el punto y decide qué
          mitad de la circunferencia es la buena.

      - tipo: verificar
        pregunta: |
          Escribe el lugar en $x$ e $y$, incluyendo la condición que decide con qué
          mitad te quedas. La figura comprobará si coincide con la del enunciado.
        condicion: 'arg((z-2)/(z-1)) = pi/2'
        ventana:
          x: [-1, 4]
          y: [-2, 3]
        formato: en x e y; usa & para juntar dos condiciones
        pista: |
          Argumento $\pi/2$ significa parte real nula **y** parte imaginaria
          positiva. Si solo impones lo primero, te sale la circunferencia entera.
        desarrollo: |
          Racionalizando con $z = x+iy$, el numerador del cociente es

          $$
          (x-2)(x-1)+y^{2} + iy
          $$

          y el denominador es real y positivo. Argumento $\pi/2$ pide entonces
          $(x-2)(x-1)+y^{2} = 0$ junto con $y>0$. Completando cuadrados:

          $$
          \left(x-\frac32\right)^{2}+y^{2} = \frac14, \qquad y > 0
          $$
        veredicto: |
          La **media circunferencia de arriba**, de centro $\frac32$ y radio
          $\frac12$. Quedarse con la circunferencia entera es el fallo del ejercicio:
          la mitad de abajo tiene argumento $-\pi/2$, no $\pi/2$.
      - tipo: justificar
        pregunta: |
          Ordena la descripción del lugar geométrico. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              El cociente exige $z \neq 1$, y el argumento de 0 no está
              definido, así que también $z \neq 2$.
          - texto: |
              $\arg\left(\frac{z-2}{z-1}\right) = \arg(z-2)-\arg(z-1)$: la
              condición dice que desde $z$ el segmento que une 1 y 2 se ve bajo
              un ángulo **recto**.
          - texto: |
              Por el teorema del ángulo inscrito, esos puntos forman la
              circunferencia de **diámetro** ese segmento: centro
              $\left(\frac32,0\right)$ y radio $\frac12$.
          - texto: |
              Pero la condición no es «ángulo recto» a secas, sino argumento
              **exactamente** $+\frac{\pi}{2}$: en la mitad inferior el ángulo
              también es recto y el argumento sale $-\frac{\pi}{2}$.
          - texto: |
              Probando el punto más alto, $\frac32+\frac12 i$, sale $+i$: vale
              la **semicircunferencia superior**, sin los extremos.
          - texto: |
              Como la circunferencia tiene área, se puede comprobar
              superponiendo regiones.
            trampa: true
            mensaje: |
              El lugar es una **curva**, no una región: un conjunto de medida
              nula. Por eso este ejercicio se resuelve dando el centro, el radio
              y la mitad, y no con la herramienta de comparar regiones que usan
              otros ejercicios del sitio — dos curvas distintas se solapan en
              cero puntos igual que dos idénticas.
        veredicto: |
          El paso que se olvida no es la circunferencia, es la **mitad**.
          Quedarse con la circunferencia entera duplica el lugar geométrico.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** Se pide el lugar de los $z$ con
      $\arg\left(\frac{z-2}{z-1}\right) = \frac{\pi}{2}$.

      **Reparto de puntos del examen:** COMP1 1 · COMP2 6 · COMP4 3. Este
      examen tiene **tres ejercicios y 30 puntos**.

      > Este enunciado es el **ejercicio 1.23 del boletín** del tema 1.

      ### 1 · Restricciones previas

      El cociente exige $z \neq 1$. Y el argumento de $0$ no está definido, así
      que también $z \neq 2$. Los dos puntos quedan excluidos desde el
      principio, y resulta que son justo los extremos del arco.

      ### 2 · Qué dice la condición

      El argumento de un cociente es la diferencia de argumentos:

      $$
      \arg\left(\frac{z-2}{z-1}\right) = \arg(z-2)-\arg(z-1)
      $$

      $\arg(z-2)$ es la dirección del vector que va del punto $2$ al afijo de
      $z$; $\arg(z-1)$, la del que va de $1$. Que su diferencia valga
      $\frac{\pi}{2}$ significa que **esos dos vectores forman un ángulo
      recto**, es decir que desde $z$ el segmento que une 1 y 2 se ve bajo
      $90^{\circ}$.

      ### 3 · El teorema del ángulo inscrito

      Los puntos desde los que un segmento se ve bajo un ángulo recto forman la
      circunferencia que tiene ese segmento como **diámetro**. Aquí el segmento
      va de $(1,0)$ a $(2,0)$:

      $$
      \text{centro } \left(\frac{3}{2},\,0\right),
      \qquad
      r = \frac{\left|2-1\right|}{2} = \frac{1}{2}
      $$

      $$
      \left(x-\frac{3}{2}\right)^{2}+y^{2} = \frac{1}{4}
      $$

      ### 4 · Solo la mitad

      Y aquí está el paso que decide el ejercicio. La condición **no** es
      «ángulo recto» a secas: es argumento **exactamente $+\frac{\pi}{2}$**. En
      la mitad inferior el ángulo también es recto, pero el argumento del
      cociente sale $-\frac{\pi}{2}$.

      Se decide probando un punto. En el más alto de la circunferencia,
      $z = \frac32+\frac12 i$:

      $$
      \frac{z-2}{z-1} = \frac{-\frac12+\frac12 i}{\frac12+\frac12 i}
      = \frac{-1+i}{1+i}
      = \frac{(-1+i)(1-i)}{(1+i)(1-i)}
      = \frac{2i}{2} = i
      $$

      cuyo argumento es $+\frac{\pi}{2}$ ✔. Luego sirve la mitad **superior**.

      $$
      \left(x-\frac{3}{2}\right)^{2}+y^{2} = \frac{1}{4}
      \qquad\text{con}\qquad y>0
      $$

      Los extremos $1$ y $2$ no entran, y ya estaban excluidos por las
      restricciones previas: encaja.

      ### 5 · Por qué aquí no se usa el comprobador de regiones

      Este lugar geométrico es una **curva**, no una región con área. La
      herramienta de comparación de regiones que usan otros ejercicios del sitio
      compara manchas de puntos, y dos curvas dibujadas con grosores distintos
      no se solapan aunque sean la misma. Por eso este ejercicio se resuelve
      dando el centro, el radio y la mitad.

      ### 6 · Representación gráfica

      Una semicircunferencia de centro $\left(\frac32,0\right)$ y radio
      $\frac12$, dibujada solo por encima del eje real, con los dos extremos
      —$(1,0)$ y $(2,0)$— marcados con círculo hueco por estar excluidos. El
      punto más alto es $\left(\frac32,\frac12\right)$.

      ### 7 · Comprobación

      Con $z = \frac32+\frac12 i$: está en la circunferencia porque
      $0+\frac14 = \frac14$ ✔, tiene $y>0$ ✔ y el cociente vale $i$ ✔.

      Con el simétrico, $z = \frac32-\frac12 i$: está en la circunferencia,
      pero

      $$
      \frac{z-2}{z-1} = \frac{-\frac12-\frac12 i}{\frac12-\frac12 i}
      = \frac{-1-i}{1-i} = -i
      $$

      de argumento $-\frac{\pi}{2}$ ✗. Queda fuera, como debe.

      Y uno que no esté en la circunferencia, $z = 3$:

      $$
      \frac{3-2}{3-1} = \frac12
      $$

      real positivo, de argumento 0 ✗. También fuera.

      ### Resultado

      $$
      \boxed{\;\left(x-\tfrac{3}{2}\right)^{2}+y^{2} = \tfrac{1}{4}
      \quad\text{con}\quad y>0\;}
      $$

  - id: ex1718-2-exponencial-recta-vertical
    titulo: Una exponencial que da una recta vertical
    fuente: >-
      Ejercicio 2 · Primera evaluación, 9 de octubre de 2017 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 6
      comp4: 4

    enunciado: |
      Calcular y representar las soluciones de la ecuación

      $$
      e^{z} = -1+\sqrt{3}\,i,
      \qquad z \in \mathbb{C}
      $$
    pide: Calcular las soluciones y representarlas.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace que la exponencial compleja tenga infinitas preimágenes?
        opciones:
          - texto: >-
              Que es **periódica de periodo $2\pi i$**, así que no es inyectiva
            correcta: true
            mensaje: |
              Eso es. $e^{z+2\pi i} = e^{z}\,e^{2\pi i} = e^{z}$, y la
              periodicidad es lo que impide invertirla de forma única. El
              logaritmo complejo hereda esa ambigüedad en su $2\pi k$.
          - texto: Que puede valer cero
            mensaje: |
              Nunca vale cero: $\left|e^{z}\right| = e^{\operatorname{Re} z} > 0$
              siempre. Precisamente por eso la ecuación $e^{z}=c$ tiene solución
              para todo $c \neq 0$.
          - texto: Que su módulo puede ser negativo
            mensaje: |
              Un módulo nunca es negativo. Lo que sí puede ser negativo, y es lo
              interesante, es el propio valor de $e^{z}$:
              $e^{i\pi} = -1$.
          - texto: Que no está definida en todo el plano
            mensaje: |
              Sí lo está: la exponencial compleja es entera, definida en todo
              $\mathbb{C}$. Lo que no es es inyectiva.

      - tipo: calcular
        titulo: La parte real de las soluciones
        pregunta: |
          ¿Cuál es la parte real de todas las soluciones? En forma exacta, o con tres decimales.
        respuesta:
          tipo: numero
          valor: '0.693'
          tolerancia: 0.005
          formato: un número, o una expresión como ln 2
        distractores:
          - valor: '2'
            mensaje: |
              2 es el **módulo** del segundo miembro. La parte real de $z$ es su
              logaritmo: $\ln 2 \approx 0{,}693$.
          - valor: '1.386'
            mensaje: |
              $1{,}386$ es $\ln 4$, es decir $2\ln 2$. El módulo es
              $\sqrt{1+3} = 2$, no 4: cuidado con la raíz.
          - valor: '2.094'
            mensaje: |
              $\frac{2\pi}{3} \approx 2{,}094$ es el **argumento**, que va a la
              parte imaginaria. Aquí no hay ninguna $i$ multiplicando fuera que
              las intercambie.
        pista: |
          $\left|-1+\sqrt3 i\right| = \sqrt{1+3} = 2$, y la parte real de $z$ es
          $\ln$ del módulo.
        desarrollo: |
          $$
          \left|-1+\sqrt3\,i\right| = \sqrt{1+3} = 2
          $$

          Al tomar logaritmos,

          $$
          z = \ln\left|c\right| + i\left(\arg c + 2\pi k\right)
            = \ln 2 + i\left(\frac{2\pi}{3}+2\pi k\right)
          $$

          Así que

          $$
          \operatorname{Re}(z) = \ln 2 \approx 0{,}693
          $$

          igual para todas: no depende de $k$.
        veredicto: |
          Como aquí no hay ninguna $i$ multiplicando a $z$, el módulo se queda
          en la parte real y el argumento en la imaginaria. En el ejercicio 2 de
          2020-2021 había una $i$ y los papeles se cruzaban.

      - tipo: calcular
        titulo: El argumento del segundo miembro
        pregunta: |
          ¿Cuál es el argumento de $-1+\sqrt3\,i$, en grados?
        respuesta:
          tipo: numero
          valor: '120'
          tolerancia: 0.5
          formato: un número de grados
        distractores:
          - valor: '-60'
            mensaje: |
              $-60^{\circ}$ es lo que da el arcotangente a secas,
              $\arctan\left(-\sqrt3\right)$. Pero el afijo está en el **segundo
              cuadrante** —real negativa, imaginaria positiva— y el arcotangente
              nunca devuelve ángulos de ahí. Hay que sumar $180^{\circ}$.
          - valor: '60'
            mensaje: |
              $60^{\circ}$ sería el argumento de $1+\sqrt3 i$, con la parte real
              **positiva**. Aquí es $-1$.
          - valor: '240'
            mensaje: |
              $240^{\circ}$ cae en el tercer cuadrante, donde las dos partes son
              negativas. Aquí la imaginaria es $+\sqrt3$.
        pista: |
          Parte real negativa, imaginaria positiva: segundo cuadrante.
        desarrollo: |
          El afijo de $-1+\sqrt3 i$ está en el **segundo cuadrante**. Con
          $\tan\theta = \frac{\sqrt3}{-1} = -\sqrt3$, los candidatos en
          $[0^{\circ},360^{\circ})$ son $120^{\circ}$ y $300^{\circ}$, y hay que
          quedarse con el del segundo cuadrante:

          $$
          \arg = 120^{\circ} = \frac{2\pi}{3}
          $$

          Comprobación: $2\cos120^{\circ} = -1$ y
          $2\,\mathrm{sen}\,120^{\circ} = \sqrt3$ ✔
        veredicto: |
          Es el error que más se repite en toda la colección de exámenes: fiarse
          del arcotangente sin mirar en qué cuadrante cae el afijo.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              El segundo miembro tiene módulo $\sqrt{1+3} = 2$ y argumento
              $\frac{2\pi}{3}$, por estar en el segundo cuadrante.
          - texto: |
              La exponencial compleja es periódica de periodo $2\pi i$, así que
              al tomar logaritmos aparece $2\pi k$ con $k \in \mathbb{Z}$.
          - texto: |
              $z = \ln 2 + i\left(\frac{2\pi}{3}+2\pi k\right)$,
              $k \in \mathbb{Z}$.
          - texto: |
              Todas tienen la **misma parte real**, $\ln 2$, y partes
              imaginarias que se diferencian en $2\pi$.
          - texto: |
              Los afijos son puntos equiespaciados sobre la **recta vertical**
              $x = \ln 2$.
          - texto: |
              Como el segundo miembro tiene parte real negativa, las soluciones
              también la tienen.
            trampa: true
            mensaje: |
              No hay ninguna relación entre el signo de la parte real de $c$ y
              el de la de $z$. La parte real de $z$ es
              $\ln\left|c\right|$, que depende del **módulo**, siempre positivo.
              Aquí $\left|c\right| = 2 > 1$, así que $\ln 2 > 0$ y las
              soluciones están a la **derecha** del eje imaginario.
        veredicto: |
          Si el módulo hubiera sido menor que 1, la recta caería a la
          izquierda; si valiera exactamente 1, sobre el eje imaginario. El
          módulo coloca la recta.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** Resolver $e^{z} = -1+\sqrt3\,i$ en $\mathbb{C}$ y representar
      las soluciones.

      **Reparto de puntos del examen:** COMP2 6 · COMP4 4. **No se evalúa
      COMP1**, así que los cuatro puntos de explicación se los llevan
      justificar la periodicidad y describir bien el dibujo.

      ### 1 · Por qué hay infinitas soluciones

      La exponencial compleja es **periódica de periodo $2\pi i$**:

      $$
      e^{z+2\pi i} = e^{z}\,e^{2\pi i} = e^{z}\cdot 1 = e^{z}
      $$

      No es inyectiva, así que $e^{z} = c$ tiene infinitas soluciones siempre
      que $c \neq 0$. Y $c \neq 0$ aquí, así que la ecuación tiene solución: de
      hecho la exponencial **nunca** vale cero, porque
      $\left|e^{z}\right| = e^{\operatorname{Re} z} > 0$.

      Esa ambigüedad es la que recoge el logaritmo complejo:

      $$
      \ln c = \ln\left|c\right| + i\left(\arg c + 2\pi k\right),
      \qquad k \in \mathbb{Z}
      $$

      ### 2 · El segundo miembro, en polar

      $$
      \left|-1+\sqrt3\,i\right| = \sqrt{1+3} = 2
      $$

      El afijo tiene parte real negativa y parte imaginaria positiva: está en el
      **segundo cuadrante**. Con $\tan\theta = -\sqrt3$ los candidatos son
      $120^{\circ}$ y $300^{\circ}$, y hay que quedarse con el primero:

      $$
      \arg = 120^{\circ} = \frac{2\pi}{3}
      $$

      Se comprueba: $2\cos\frac{2\pi}{3} = -1$ y
      $2\,\mathrm{sen}\,\frac{2\pi}{3} = \sqrt3$ ✔

      $$
      -1+\sqrt3\,i = 2\,e^{i\frac{2\pi}{3}}
      $$

      ### 3 · Tomar logaritmos

      $$
      z = \ln 2 + i\left(\frac{2\pi}{3}+2\pi k\right),
      \qquad k \in \mathbb{Z}
      $$

      Aquí no hay que despejar nada más: la incógnita estaba sola en el
      exponente.

      ### 4 · Representación gráfica

      Todas las soluciones tienen la **misma parte real**, $\ln 2 \approx
      0{,}693$, y partes imaginarias separadas $2\pi$:

      $$
      \dots,\quad \ln 2 - \frac{4\pi}{3}\,i,
      \quad \ln 2 + \frac{2\pi}{3}\,i,
      \quad \ln 2 + \frac{8\pi}{3}\,i, \quad\dots
      $$

      Es decir, puntos equiespaciados sobre la **recta vertical**
      $x = \ln 2$, a la derecha del eje imaginario.

      La posición de la recta la fija el **módulo**: como $2>1$, su logaritmo es
      positivo y la recta cae a la derecha. Con módulo 1 caería justo sobre el
      eje imaginario, y con módulo menor que 1, a la izquierda.

      Merece la pena compararlo con el ejercicio 2 del examen 2020-2021, que era
      $e^{-iz} = c$: allí la $i$ del exponente **cruzaba** los papeles y las
      soluciones caían en una recta horizontal. Aquí no hay $i$ multiplicando, y
      la recta es vertical.

      ### 5 · Comprobación

      Con $k=0$, $z = \ln 2 + \frac{2\pi}{3}i$:

      $$
      e^{z} = e^{\ln 2}\,e^{i\frac{2\pi}{3}}
      = 2\left(\cos\frac{2\pi}{3}+i\,\mathrm{sen}\,\frac{2\pi}{3}\right)
      = 2\left(-\frac12+\frac{\sqrt3}{2}i\right)
      = -1+\sqrt3\,i \quad\checkmark
      $$

      Con $k=1$, $z = \ln 2 + \frac{8\pi}{3}i$:

      $$
      e^{z} = 2\,e^{i\frac{8\pi}{3}} = 2\,e^{i\left(\frac{2\pi}{3}+2\pi\right)}
      = 2\,e^{i\frac{2\pi}{3}} \quad\checkmark
      $$

      Las dos dan lo mismo, como tiene que ser.

      Y una comprobación de coherencia que sale gratis: el módulo del resultado
      tiene que ser 2, y $\left|e^{z}\right| = e^{\ln 2} = 2$ ✔

      ### Resultado

      $$
      \boxed{\;z = \ln 2 + i\left(\frac{2\pi}{3}+2\pi k\right),
      \qquad k \in \mathbb{Z}\;}
      $$

  - id: ex1718-3-limite-no-positivo
    titulo: El límite de una sucesión de términos no positivos
    fuente: >-
      Ejercicio 3 · Primera evaluación, 9 de octubre de 2017 · Cálculo
      (Industriales), UPV/EHU · Mismo enunciado que el ejercicio 3 de
      2024-2025. El examen no publica solución: la demostración es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 0
      comp4: 8

    enunciado: |
      Demostrar la siguiente propiedad:

      $$
      \text{Si } a_n \le 0 \;\;\forall n \in \mathbb{N}
      \;\text{ y }\; \{a_n\}_{n\in\mathbb{N}} \text{ converge hacia } L,
      \text{ entonces } L \le 0
      $$
    pide: Demostrar la propiedad.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué la conclusión es $L \le 0$ y no $L < 0$?
        opciones:
          - texto: >-
              Porque el límite puede valer **exactamente cero**, como en
              $a_n = -\frac1n$
            correcta: true
            mensaje: |
              Ese es el matiz del ejercicio. $-\frac1n$ tiene todos sus términos
              estrictamente negativos y su límite es 0. Al pasar al límite, las
              desigualdades estrictas **se debilitan**.
          - texto: Porque la hipótesis también lleva $\le$
            mensaje: |
              Es cierto que la hipótesis lleva $\le$, pero la conclusión sería
              $\le$ igualmente aunque la hipótesis fuera estricta. El motivo es
              más fuerte: el límite puede alcanzar la cota.
          - texto: Porque $L$ podría no existir
            mensaje: |
              El enunciado **da** por hipótesis que la sucesión converge hacia
              $L$. La existencia no está en discusión.
          - texto: Por convenio, para que la propiedad sea más general
            mensaje: |
              No es un convenio: es que $L<0$ sería **falso**. Hay un
              contraejemplo explícito.

      - tipo: calcular
        titulo: El épsilon de la reducción al absurdo
        pregunta: |
          Se supone $L>0$ para llegar al absurdo. Con $L = 0{,}6$, ¿qué
          $\varepsilon$ conviene tomar?
        respuesta:
          tipo: numero
          valor: '0.3'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.6'
            mensaje: |
              Con $\varepsilon = L$ el intervalo llega justo hasta 0 y la
              desigualdad $a_n>0$ deja de ser estricta: podría ser $a_n=0$, que
              el enunciado permite. Con la mitad el choque es limpio.
          - valor: '1.2'
            mensaje: |
              Has multiplicado por 2 en vez de dividir. Un épsilon mayor que $L$
              deja el 0 dentro del entorno y no contradice nada.
          - valor: '0'
            mensaje: |
              La definición exige $\varepsilon>0$ estrictamente. Con
              $\varepsilon=0$ la condición $\left|a_n-L\right|<0$ no la cumple
              nadie.
        pista: |
          La distancia de $L$ a 0 es $0{,}6$. Toma la mitad.
        desarrollo: |
          $$
          \varepsilon = \frac{L}{2} = \frac{0{,}6}{2} = 0{,}3
          $$

          Con ese valor, a partir de cierto $m$:

          $$
          a_n > L-\varepsilon = 0{,}6-0{,}3 = 0{,}3 > 0
          $$

          y eso contradice $a_n \le 0$ para todo $n$.
        veredicto: |
          Es el mismo épsilon que en los ejercicios 2.3 a 2.6 del boletín y en
          otros cuatro exámenes de esta colección.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Por reducción al absurdo, supongamos que $L>0$.
          - texto: |
              Se toma $\varepsilon = \dfrac{L}{2} > 0$, positivo precisamente
              porque se ha supuesto $L$ positivo.
          - texto: |
              Por definición de límite existe $m$ tal que
              $\left|a_n-L\right| < \varepsilon$ para todo $n>m$; en particular
              $a_n > L-\varepsilon = \dfrac{L}{2} > 0$.
          - texto: |
              Pero la hipótesis dice $a_n \le 0$ para **todo** $n$.
              Contradicción, luego $L \le 0$.
          - texto: |
              Basta comprobarlo con la sucesión $a_n = -\frac1n$, que cumple la
              hipótesis y tiene límite 0.
            trampa: true
            mensaje: |
              Un ejemplo **no demuestra** una propiedad universal. $-\frac1n$
              sirve para otra cosa —para ver que la conclusión no se puede
              reforzar a $L<0$—, pero no para probar el enunciado, que habla de
              **todas** las sucesiones con esa propiedad.
        veredicto: |
          El ejemplo y la demostración hacen trabajos distintos, y los dos hacen
          falta: uno prueba la propiedad, el otro marca su límite.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > demostración propuesta, pendiente de revisión.

      **Datos.** $a_n \le 0$ para todo $n$ y $a_n \to L$. Demostrar que
      $L \le 0$.

      **Reparto de puntos del examen:** COMP1 2 · COMP4 8. **Ni un punto de
      cálculo.**

      > El mismo enunciado cayó en el **ejercicio 3 de 2024-2025**, allí con los
      > diez puntos enteros en COMP4. Y es el reflejo del **2.3 del boletín**,
      > que prueba lo simétrico para términos no negativos.

      ### 1 · Estrategia

      La tesis es una desigualdad **no estricta**, y esas se demuestran casi
      siempre por reducción al absurdo: se supone lo contrario, $L>0$, y se
      busca el choque con la hipótesis.

      Conviene escribir la definición que se va a usar, porque es parte de lo
      que se puntúa:

      $$
      \lim a_n = L \iff
      \forall \varepsilon>0 \;\exists\, m \in \mathbb{N} :\;
      n>m \Rightarrow \left|a_n-L\right| < \varepsilon
      $$

      ### 2 · La demostración

      Supongamos $L>0$. Entonces se puede tomar

      $$
      \varepsilon = \frac{L}{2} > 0
      $$

      —positivo **precisamente porque** $L$ lo es, y esto hay que decirlo: si
      $L$ fuera negativo, este $\varepsilon$ no valdría—.

      Por la definición de límite existe $m \in \mathbb{N}$ tal que para todo
      $n>m$

      $$
      \left|a_n-L\right| < \varepsilon
      \;\Longrightarrow\;
      a_n > L-\varepsilon = L-\frac{L}{2} = \frac{L}{2} > 0
      $$

      Es decir: **todos** los términos a partir de $m$ serían estrictamente
      positivos. Pero la hipótesis dice que $a_n \le 0$ para todo $n$.
      Contradicción.

      Por tanto la suposición era falsa y

      $$
      L \le 0 \qquad \blacksquare
      $$

      ### 3 · Por qué $\le$ y no $<$

      La conclusión no se puede reforzar, y el contraejemplo es inmediato:

      $$
      a_n = -\frac{1}{n}
      $$

      tiene todos sus términos **estrictamente** negativos y su límite es
      exactamente 0.

      La regla general: al pasar al límite, **las desigualdades estrictas se
      debilitan**. De $a_n<0$ solo se deduce $L \le 0$.

      **Y ojo con el papel de ese ejemplo:** no demuestra el enunciado. Sirve
      para marcar su frontera, no para probarlo. Confundir las dos cosas es lo
      que castiga la pieza trampa de este ejercicio.

      ### 4 · La misma propiedad, del otro lado

      Aplicando este resultado a la sucesión $-a_n$, que es no negativa, se
      obtiene $-L \ge 0$, es decir $L \le 0$: los dos enunciados —este y el
      2.3 del boletín— son equivalentes y cada uno se deduce del otro.

      Escribirlo en el examen no ahorra la demostración, pero enseña que se ha
      visto la simetría.

      ### 5 · Comprobación

      No sustituye a la demostración, pero detecta signos cambiados. Se
      construye una sucesión que tienda a un límite positivo y se cuenta cuántos
      términos consigue mantener no positivos:

      $$
      a_n = 0{,}6-\frac{1}{n} \;\longrightarrow\; 0{,}6
      $$

      $$
      a_1 = -0{,}4 \le 0, \qquad a_2 = 0{,}1 > 0, \qquad a_3 = 0{,}27 > 0,\dots
      $$

      Solo uno. Y con el $\varepsilon = 0{,}3$ de la demostración: desde
      $\frac1n < 0{,}3$, o sea $n \ge 4$, todos superan $0{,}3$. Los términos no
      positivos son siempre **finitos**, que es justo lo que la hipótesis
      —«para todo $n$»— prohíbe.

      ### Resultado

      $$
      \boxed{\;a_n \le 0 \;\;\forall n \;\;\text{y}\;\; a_n \to L
      \;\;\Longrightarrow\;\; L \le 0\;}
      $$
