ejercicios:
  - id: ex1617-4ev-1-montana-con-dos-pendientes
    titulo: La montaña de la que se conocen dos pendientes
    fuente: >-
      Ejercicio 1 · Cuarta evaluación (segundo cuatrimestral), 13 de marzo de
      2017 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 3
      comp4: 5
    enunciado: |
      La altura de una montaña viene dada por la función $F(x,y)$. Si nos
      situamos en el punto $(0,0)$ y seguimos la dirección $(3,4)$, se obtiene
      una pendiente cuyo valor es 3. En cambio, en la dirección $(4,-3)$ la
      pendiente es $-1$.

      a) Hallar el vector gradiente en el punto $(0,0)$ e interpretar su
      significado.

      b) Calcular la velocidad a la que cambiará el valor de la altura si
      partiendo del punto $(0,0)$ seguimos la dirección y el sentido dados por
      el vector $(1,1)$.
    pide: El gradiente en el origen, su interpretación, y la velocidad hacia (1,1).
    pasos:
      - tipo: reconocer
        pregunta: |
          Este ejercicio reparte COMP4 **5 puntos de 10**, más que el cálculo.
          ¿Qué está diciendo ese reparto?
        opciones:
          - texto: Que la mitad de la nota es interpretar el gradiente, no calcularlo
            correcta: true
            mensaje: |
              Exacto. El apartado a) pide «hallar **e interpretar**», y esa
              segunda mitad vale tanto como el sistema. Dar solo $(1,3)$ deja
              la mitad de los puntos sin recoger.
          - texto: Que el cálculo es muy difícil
            mensaje: |
              Es un sistema de dos ecuaciones con dos incógnitas: lo más fácil
              del ejercicio. Por eso solo vale 3 puntos.
          - texto: Que hay que dibujar mucho
            mensaje: |
              COMP4 incluye gráficos, pero también «enunciados, definiciones e
              hipótesis». Aquí lo que se pide explícitamente es interpretar.
      - tipo: calcular
        titulo: La primera ecuación
        pregunta: |
          El vector $(3,4)$ mide 5. Si la pendiente en esa dirección es 3, y
          $\nabla F = (a,b)$, la ecuación es $\frac{3a+4b}{5}=3$. ¿A qué equivale
          el numerador $3a+4b$?
        respuesta:
          tipo: numero
          valor: '15'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              3 es la pendiente, sin deshacer la división. Multiplicando los dos
              lados por 5 queda $3a+4b = 15$.
          - valor: '5'
            mensaje: |
              5 es el módulo del vector. Lo que hay que hacer con él es
              multiplicar, no igualar.
        pista: |
          Multiplica los dos lados por 5.
        desarrollo: |
          $$
          \frac{3a+4b}{5} = 3
          \qquad\Longrightarrow\qquad
          3a+4b = 15
          $$

          Y con el segundo dato, $\dfrac{4a-3b}{5} = -1$, o sea $4a-3b = -5$.
      - tipo: calcular
        titulo: La primera componente del gradiente
        pregunta: |
          Resolviendo el sistema $3a+4b=15$, $4a-3b=-5$, ¿cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              3 es el valor de $b$, la otra componente. Cuidado con cuál es
              cuál al despejar.
          - valor: '5'
            mensaje: |
              5 es el módulo de los vectores del enunciado, no una solución del
              sistema.
        pista: |
          Multiplica la primera por 3 y la segunda por 4, y súmalas: los b se van.
        desarrollo: |
          Multiplicando la primera por 3 y la segunda por 4:

          $$
          9a+12b = 45,
          \qquad
          16a-12b = -20
          $$

          Sumando, $25a = 25$, o sea $a=1$. Y de la primera, $b=3$.

          $$
          \nabla F(0,0) = (1,\,3)
          $$
      - tipo: calcular
        titulo: La velocidad hacia (1,1)
        pregunta: |
          Con $\nabla F=(1,3)$ y el vector $(1,1)$ de módulo $\sqrt2$, ¿cuánto
          vale la derivada direccional?
        respuesta:
          tipo: numero
          valor: '2.8284'
          tolerancia: 0.02
          formato: en forma exacta (2√2) o con cuatro decimales
        distractores:
          - valor: '4'
            mensaje: |
              4 es el producto escalar $(1,3)\cdot(1,1)$ **sin** normalizar.
              Falta dividir entre $\sqrt2$.
          - valor: '3.1623'
            mensaje: |
              $\sqrt{10}$ es el módulo del gradiente, o sea la velocidad
              **máxima**. Hacia $(1,1)$ sale algo menor.
        pista: |
          $4/\sqrt2 = 2\sqrt2 \approx 2{,}83$.
        desarrollo: |
          $$
          D_{\vec u}F = \frac{(1,3)\cdot(1,1)}{\sqrt2} = \frac{4}{\sqrt2} = 2\sqrt2 \approx 2{,}83
          $$

          Y el control: $\lVert\nabla F\rVert = \sqrt{10}\approx 3{,}16$, así que
          $2{,}83$ está por debajo. ✓
      - tipo: justificar
        pregunta: |
          Ordena la **interpretación** del apartado a), que es donde está la
          mitad de la nota. Una pieza es falsa.
        piezas:
          - texto: 'El gradiente $(1,3)$ apunta en la dirección de máxima pendiente de subida desde el origen.'
          - texto: 'Su módulo, $\sqrt{10}\approx 3{,}16$, es esa pendiente máxima.'
          - texto: 'La curva de nivel que pasa por el origen es perpendicular a él ahí.'
          - texto: 'La dirección en la que la altura no cambia es $(-3,1)$, o su opuesta.'
          - texto: 'Como una de las pendientes dadas es negativa, el origen es un punto de silla.'
            trampa: true
            mensaje: |
              Que la pendiente sea negativa en **una** dirección es lo normal
              siempre que el gradiente no sea nulo: en el sentido opuesto al
              gradiente siempre se baja. Un punto de silla exige gradiente
              **nulo**, y aquí vale $(1,3)$.
    resolucion: |
      **El reparto de puntos dice cómo hay que contestar:** COMP2 vale 3 y COMP4
      vale 5. El sistema es lo fácil; **interpretar es lo que puntúa.**

      **El sistema.** Los dos vectores del enunciado miden 5, así que hay que
      normalizarlos antes de igualar:

      $$
      \frac{(a,b)\cdot(3,4)}{5} = 3
      \;\Longrightarrow\;
      3a+4b = 15
      $$

      $$
      \frac{(a,b)\cdot(4,-3)}{5} = -1
      \;\Longrightarrow\;
      4a-3b = -5
      $$

      Resolviendo:

      $$
      \boxed{\;\nabla F(0,0) = (1,\,3)\;}
      $$

      **a) La interpretación**, que es la mitad de la nota:

      - $(1,3)$ es la dirección en la que **la montaña sube más deprisa** desde
        el origen: hacia el nordeste, y más hacia el norte que hacia el este.
      - Su módulo, $\sqrt{10}\approx 3{,}16$, es **esa pendiente máxima**. Y
        ninguna dirección puede dar más: las dos pendientes del enunciado, 3 y
        $-1$, están las dos dentro de $[-3{,}16;\,3{,}16]$, como tenía que ser.
      - La **curva de nivel** que pasa por el origen le es perpendicular, así
        que la altura no cambia en la dirección $(-3,1)$.

      **b) La velocidad hacia $(1,1)$:**

      $$
      D_{\vec u}F(0,0) = \frac{(1,3)\cdot(1,1)}{\sqrt2} = \frac{4}{\sqrt2}
      = \boxed{2\sqrt2 \approx 2{,}83}
      $$

      Positiva, así que subiendo — y cerca del máximo, porque $(1,1)$ apunta
      bastante en la misma dirección que $(1,3)$.

      > **La comprobación que se puede hacer en el examen sin nada más:** las
      > dos pendientes que da el enunciado tienen que caber dentro del intervalo
      > $[-\lVert\nabla F\rVert,\;+\lVert\nabla F\rVert]$. Con $\sqrt{10}$, el
      > intervalo es $[-3{,}16;\,3{,}16]$ y los datos son 3 y $-1$: caben. Si no
      > cupieran, el sistema estaría mal resuelto.

  - id: ex1617-4ev-2-cono-de-helado
    titulo: El cono de helado, en cilíndricas y en esféricas
    fuente: >-
      Ejercicio 2 · Cuarta evaluación (segundo cuatrimestral), 13 de marzo de
      2017 · Cálculo, UPV/EHU · Es el ejercicio 7.23 del boletín de problemas
      complementarios, que publica la solución.
    nivel: examen
    puntos:
      comp2: 7
      comp4: 3
    enunciado: |
      Sea $S$ el sólido limitado por las condiciones $x^{2}+y^{2}+z^{2}\le 4$;
      $x^{2}+y^{2}\le z^{2}$; $z\ge 0$.

      a) Plantear el volumen de $S$ utilizando coordenadas cilíndricas.
      b) Plantear el volumen de $S$ utilizando coordenadas esféricas.
      c) Calcular el volumen de $S$ utilizando el apartado a) o b).
    pide: El volumen planteado de las dos formas, y calculado por una de ellas.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado c) deja **elegir** cuál de los dos planteamientos usar.
          ¿Qué se está evaluando ahí?
        opciones:
          - texto: Si sabes reconocer cuál de los dos sale más corto
            correcta: true
            mensaje: |
              Exacto. Los dos dan el mismo número, pero en esféricas los tres
              límites son constantes y la integral se parte en tres factores; en
              cilíndricas hay una raíz que arrastrar.
          - texto: Nada; los dos cuestan lo mismo
            mensaje: |
              No: en cilíndricas el límite superior de $z$ es
              $\sqrt{4-\rho^{2}}$, y eso obliga a un cambio de variable. En
              esféricas no hay ninguna raíz.
          - texto: Que el planteamiento en cilíndricas está mal
            mensaje: |
              Los dos están bien y el enunciado pide los dos. Lo que cambia es
              cuál conviene ejecutar.
      - tipo: calcular
        titulo: El ángulo del cono
        pregunta: |
          En esféricas, la condición $x^{2}+y^{2}\le z^{2}$ con $z\ge 0$ limita
          $\varphi$. ¿Hasta qué ángulo, en grados?
        respuesta:
          tipo: numero
          valor: '45'
          tolerancia: 0.1
          formato: en grados
        distractores:
          - valor: '90'
            mensaje: |
              90° sería media esfera entera, sin recortar con el cono. El cono
              abre justo a la mitad.
          - valor: '60'
            mensaje: |
              60° saldría de un cono más abierto. Con $z^{2}=x^{2}+y^{2}$ la
              altura iguala al radio, y eso es una tangente de 1: 45°.
        pista: |
          En el borde del cono la altura iguala a la distancia al eje: tangente 1.
        desarrollo: |
          $$
          \tan\varphi = \frac{\rho}{z} = 1
          \qquad\Longrightarrow\qquad
          \varphi = \frac{\pi}{4} = 45°
          $$
      - tipo: calcular
        titulo: El volumen
        pregunta: |
          El volumen sale $\frac{8\pi}{3}\bigl(2-\sqrt2\bigr)$. ¿Cuánto vale con
          cuatro decimales?
        respuesta:
          tipo: numero
          valor: '4.9074'
          tolerancia: 0.02
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '33.51'
            mensaje: |
              $32\pi/3$ es la esfera **entera** de radio 2. El cono se queda con
              una fracción pequeña.
          - valor: '16.755'
            mensaje: |
              $16\pi/3$ es la media esfera superior. Falta recortarla con el
              cono, que se lleva la mayor parte.
        pista: |
          $8\pi/3 \approx 8{,}378$ por $(2-\sqrt2)\approx 0{,}586$.
        desarrollo: |
          $$
          V = \int_{0}^{2\pi}\!\!\int_{0}^{\pi/4}\!\!\int_{0}^{2} r^{2}\text{sen}\,\varphi\;dr\,d\varphi\,d\theta
          = 2\pi\cdot\frac{8}{3}\cdot\left(1-\frac{\sqrt2}{2}\right)
          = \frac{8\pi}{3}\bigl(2-\sqrt2\bigr)
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'El sólido es un **cono de helado**: la esfera de radio 2 recortada por el cono, y solo la mitad de arriba.'
          - texto: 'a) En cilíndricas, $\rho$ va de 0 a $\sqrt2$ y $z$ del cono $z=\rho$ a la esfera $z=\sqrt{4-\rho^{2}}$.'
          - texto: 'b) En esféricas, $r\in[0,2]$, $\varphi\in[0,\pi/4]$, $\theta\in[0,2\pi]$: los tres constantes.'
          - texto: 'c) Conviene el b), porque la integral se separa en tres factores independientes.'
          - texto: 'Los dos planteamientos dan resultados distintos, y hay que quedarse con el de esféricas.'
            trampa: true
            mensaje: |
              Dan **el mismo** número: es el volumen del sólido, que no depende
              de en qué coordenadas lo midas. Lo que cambia es el trabajo. Si te
              salieran distintos, uno de los dos estaría mal planteado.
    resolucion: |
      **El sólido es un cono de helado**: la bola de radio 2 recortada por el
      cono $z^{2}=x^{2}+y^{2}$, quedándose con la parte de arriba. El cono y la
      esfera se cortan donde $2\rho^{2}=4$, o sea $\rho=\sqrt2$ y $z=\sqrt2$.

      **a) En cilíndricas**, con la $z$ entre el cono y la esfera:

      $$
      V = \int_{0}^{2\pi}\!\!\int_{0}^{\sqrt2}\!\!\int_{\rho}^{\sqrt{4-\rho^{2}}} \rho\;dz\,d\rho\,d\theta
      $$

      **b) En esféricas**, con el cono convertido en un ángulo fijo:

      $$
      V = \int_{0}^{2\pi}\!\!\int_{0}^{\pi/4}\!\!\int_{0}^{2} r^{2}\,\text{sen}\,\varphi\;dr\,d\varphi\,d\theta
      $$

      **c) Conviene el b)**, y decir por qué es parte de la respuesta: **los
      tres límites son constantes**, así que la integral se parte en tres
      factores que se hacen de cabeza.

      $$
      V = \underbrace{2\pi}_{\theta}\cdot\underbrace{\left(1-\tfrac{\sqrt2}{2}\right)}_{\varphi}\cdot\underbrace{\tfrac{8}{3}}_{r}
      = \boxed{\frac{8\pi}{3}\bigl(2-\sqrt2\bigr)\approx 4{,}907}
      $$

      > **Lo que el ejercicio enseña**, y por eso pide los dos planteamientos:
      > las coordenadas no se eligen por el integrando —aquí es 1 en los dos
      > casos— sino **por la forma del recinto**. Y un recinto limitado por una
      > esfera y un cono con el mismo vértice es el caso de manual de las
      > esféricas: las dos superficies se convierten en «$r$ constante» y
      > «$\varphi$ constante».
      >
      > La comprobación: el sólido es un trocito de la esfera de volumen
      > $32\pi/3\approx 33{,}5$, y sale $4{,}9$ — un 15 % de ella, que es
      > razonable para un cono de 45° de semiapertura.
