ejercicios:
  - id: ex2021-4ev-1-entre-cilindro-esfera-y-paraboloide
    titulo: El sólido entre un cilindro, una esfera y un paraboloide
    fuente: >-
      Ejercicio 1 · Cuarta evaluación (segundo parcial), 29 de marzo de 2021 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp2: 8
      comp4: 2
    enunciado: |
      Calcular el volumen del sólido limitado por las condiciones
      $x^{2}+y^{2}\ge 4$, $x^{2}+y^{2}\le 16-z$,
      $z\ge -\sqrt{16-x^{2}-y^{2}}$.
    pide: El volumen del sólido.
    pasos:
      - tipo: reconocer
        pregunta: |
          La primera condición es $x^{2}+y^{2}\ge 4$, con el signo **hacia
          fuera**. ¿Qué describe?
        opciones:
          - texto: El exterior de un cilindro de radio 2, así que el sólido tiene un agujero central
            correcta: true
            mensaje: |
              Exacto. Es la condición que convierte el sólido en una **rosquilla**:
              hay un cilindro vacío de radio 2 atravesándolo por el eje.
          - texto: El interior de un cilindro de radio 2
            mensaje: |
              Eso sería $x^{2}+y^{2}\le 4$. El signo está al revés a propósito, y
              es lo que hace que $\rho$ empiece en 2 y no en 0.
          - texto: Una esfera de radio 2
            mensaje: |
              Una esfera llevaría también $z^{2}$. Sin la $z$, la condición es
              la misma para toda altura: un cilindro infinito.
      - tipo: calcular
        titulo: Hasta dónde llega el sólido
        pregunta: |
          La tapa de abajo es la semiesfera $z=-\sqrt{16-\rho^{2}}$ y la de
          arriba el paraboloide $z=16-\rho^{2}$. ¿Para qué valor de $\rho$ se
          juntan?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es el radio del agujero central, donde el sólido **empieza**. Las
              dos tapas se juntan en el borde exterior.
          - valor: '16'
            mensaje: |
              16 es el radio **al cuadrado**. La esfera tiene radio $\sqrt{16}=4$.
        pista: |
          La semiesfera solo existe mientras $16-\rho^2 \ge 0$.
        desarrollo: |
          La semiesfera existe hasta $\rho = 4$, y ahí vale 0. El paraboloide en
          $\rho=4$ vale $16-16=0$ también.

          $$
          \text{Las dos tapas se tocan en } \rho = 4, \; z = 0
          $$

          Así que $\rho$ recorre de **2 a 4**: del borde del agujero al borde
          exterior.
      - tipo: calcular
        titulo: El volumen
        pregunta: |
          El volumen sale $2\pi\bigl(36+8\sqrt3\bigr)$. ¿Cuánto vale con dos
          decimales?
        respuesta:
          tipo: numero
          valor: '313.26'
          tolerancia: 0.3
          formato: en forma exacta o con dos decimales
        distractores:
          - valor: '226.19'
            mensaje: |
              $72\pi$ es solo la parte del paraboloide. Falta el trozo de abajo,
              el que queda entre el plano $z=0$ y la semiesfera.
          - valor: '87.07'
            mensaje: |
              Ese es solo el trozo de la semiesfera, $16\sqrt3\,\pi$. El sólido
              tiene las dos mitades.
        pista: |
          $72\pi \approx 226{,}19$ más $16\sqrt3\pi \approx 87{,}07$.
        desarrollo: |
          $$
          V = \int_{0}^{2\pi}\!\!\int_{2}^{4}\Bigl[(16-\rho^{2}) + \sqrt{16-\rho^{2}}\Bigr]\rho\;d\rho\,d\theta
          $$

          El primer trozo da $2\pi\cdot 36$; el segundo, con el cambio
          $u=16-\rho^{2}$, da $2\pi\cdot 8\sqrt3$.

          $$
          V = 72\pi + 16\sqrt3\,\pi \approx 313{,}26
          $$
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El sólido es una rosquilla: hay un cilindro vacío de radio 2 en el eje.'
          - texto: 'La tapa de arriba es el paraboloide $z=16-\rho^{2}$ y la de abajo la semiesfera inferior de radio 4.'
          - texto: 'Las dos se juntan en $\rho=4$, así que $\rho$ va de 2 a 4.'
          - texto: 'La altura en cada punto es la suma $\left(16-\rho^{2}\right)+\sqrt{16-\rho^{2}}$, porque la tapa de abajo es negativa.'
          - texto: 'La altura es la resta $\left(16-\rho^{2}\right)-\sqrt{16-\rho^{2}}$, porque siempre se resta la de abajo.'
            trampa: true
            mensaje: |
              Se resta la de abajo, sí — pero la de abajo **vale
              $-\sqrt{16-\rho^{2}}$**, con su signo menos delante. Restar un
              negativo suma. Con la resta saldría una altura negativa en parte
              del recinto, que es la señal de que el signo está mal.
    resolucion: |
      **El sólido es una rosquilla**, y verlo es lo primero.

      | condición | qué dice |
      |---|---|
      | $x^{2}+y^{2}\ge 4$ | fuera de un cilindro de radio 2: hay un agujero |
      | $x^{2}+y^{2}\le 16-z$ | por debajo del paraboloide $z=16-\rho^{2}$ |
      | $z\ge -\sqrt{16-x^{2}-y^{2}}$ | por encima de la semiesfera inferior de radio 4 |

      **Los límites.** La semiesfera solo existe hasta $\rho=4$, y ahí el
      paraboloide también vale 0: las dos tapas se juntan en el borde. Así que

      $$
      \rho\in[2,4],
      \qquad
      \theta\in[0,2\pi]
      $$

      **La altura** en cada punto, con cuidado con el signo de la tapa inferior:

      $$
      h(\rho) = \bigl(16-\rho^{2}\bigr) - \Bigl(-\sqrt{16-\rho^{2}}\Bigr)
      = \bigl(16-\rho^{2}\bigr) + \sqrt{16-\rho^{2}}
      $$

      **El volumen**, partido en dos integrales que se hacen distinto:

      $$
      V = 2\pi\underbrace{\int_{2}^{4}\bigl(16\rho-\rho^{3}\bigr)d\rho}_{36}
      \;+\;
      2\pi\underbrace{\int_{2}^{4}\rho\sqrt{16-\rho^{2}}\,d\rho}_{8\sqrt3}
      $$

      La segunda sale con el cambio $u = 16-\rho^{2}$, que es el que pide
      cualquier raíz de esa forma.

      $$
      \boxed{\;V = 72\pi + 16\sqrt3\,\pi \approx 313{,}26\;}
      $$

      > **La comprobación de plausibilidad.** El sólido cabe holgadamente en un
      > cilindro de radio 4 y altura 16, o sea $256\pi\approx 804$. Sale 313,
      > algo más de un tercio: razonable para algo que se estrecha por arriba y
      > tiene un agujero en el centro. ✓

  - id: ex2021-4ev-2-region-con-recta-y-parabola
    titulo: Una región entre recta y parábola, y su centro de gravedad
    fuente: >-
      Ejercicio 2 · Cuarta evaluación (segundo parcial), 29 de marzo de 2021 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp2: 8
      comp4: 2
    enunciado: |
      Sea la integral $\displaystyle\int_{0}^{1}\left(\int_{3x}^{4-x^{2}} dy\right)dx$.

      a) Dibujar el dominio de integración $D$.
      b) Cambiar el orden de integración.
      c) Sea $f(x,y)=k$ (constante) la densidad en cada punto del dominio $D$.
      Calcular el centro de gravedad de $D$.
    pide: El dibujo, la integral invertida y el centro de gravedad.
    pasos:
      - tipo: reconocer
        pregunta: |
          El integrando es 1. ¿Qué representa entonces la integral?
        opciones:
          - texto: El área del dominio D
            correcta: true
            mensaje: |
              Sí. Con integrando 1 la integral doble cuenta área, y eso es
              justo lo que hará falta en el apartado c) como denominador.
          - texto: El volumen del sólido bajo z=1
            mensaje: |
              Numéricamente coincide, porque un prisma de altura 1 tiene volumen
              igual a su base. Pero lo que el ejercicio necesita es leerlo como
              área.
          - texto: Nada útil; hay que darle una función
            mensaje: |
              Es de lo más útil: el área es el denominador del centro de
              gravedad, así que el apartado a) ya está haciendo parte del c).
      - tipo: calcular
        titulo: Dónde se cortan las dos curvas
        pregunta: |
          Igualando $3x = 4-x^{2}$, ¿cuál es la raíz positiva?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              4 es el término independiente. De $x^{2}+3x-4=0$ sale
              $(x+4)(x-1)=0$, y la raíz positiva es 1.
          - valor: '-4'
            mensaje: |
              $-4$ es la otra raíz, negativa, y queda fuera del intervalo
              $[0,1]$ del enunciado.
        pista: |
          $x^2+3x-4=0$ factoriza como (x+4)(x−1).
        desarrollo: |
          $$
          3x = 4-x^{2}
          \;\Longrightarrow\;
          x^{2}+3x-4=0
          \;\Longrightarrow\;
          (x+4)(x-1)=0
          $$

          La raíz positiva es $x=1$, donde ambas valen 3. **Ese es el vértice
          derecho del recinto**, y explica por qué el enunciado integra hasta 1.
      - tipo: calcular
        titulo: El área
        pregunta: |
          Integrando $\int_{0}^{1}(4-x^{2}-3x)\,dx$, ¿cuánto vale el área?
        respuesta:
          tipo: numero
          valor: '2.1667'
          tolerancia: 0.01
          formato: en forma exacta (13/6) o con cuatro decimales
        distractores:
          - valor: '4'
            mensaje: |
              4 es el valor de la altura en $x=0$, no el área. Hay que integrar
              la altura a lo largo de todo el intervalo.
          - valor: '2.5'
            mensaje: |
              Parece que te has dejado el término $-x^{3}/3$. La primitiva es
              $4x - x^{3}/3 - 3x^{2}/2$.
        pista: |
          $4 - 1/3 - 3/2 = 13/6$.
        desarrollo: |
          $$
          A = \left[4x-\frac{x^{3}}{3}-\frac{3x^{2}}{2}\right]_{0}^{1}
          = 4-\frac13-\frac32 = \frac{13}{6}
          $$
      - tipo: calcular
        titulo: La abscisa del centro de gravedad
        pregunta: |
          El momento respecto del eje $Y$ vale $\frac{3}{4}$. Con área
          $\frac{13}{6}$, ¿cuánto vale $\overline{x}$?
        respuesta:
          tipo: numero
          valor: '0.3462'
          tolerancia: 0.005
          formato: en forma exacta (9/26) o con cuatro decimales
        distractores:
          - valor: '0.75'
            mensaje: |
              $3/4$ es el **momento**, no la coordenada. Falta dividir entre el
              área.
          - valor: '0.5'
            mensaje: |
              $0{,}5$ sería el centro si la masa estuviera repartida por igual
              entre $x=0$ y $x=1$. No lo está: la región es mucho más alta cerca
              de $x=0$, así que el centro se corre hacia la izquierda.
        pista: |
          $(3/4)$ dividido entre $(13/6)$, que es $9/26$.
        desarrollo: |
          $$
          \overline{x} = \frac{3/4}{13/6} = \frac{18}{52} = \frac{9}{26} \approx 0{,}346
          $$

          Menos de la mitad del intervalo, como corresponde a un recinto que se
          estrecha hacia la derecha.
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'a) La región está entre la recta $y=3x$ (abajo) y la parábola $y=4-x^{2}$ (arriba), de $x=0$ a $x=1$, y sus vértices son $(0,0)$, $(0,4)$ y $(1,3)$.'
          - texto: 'b) Al invertir hay que **partirla en dos**, porque la frontera derecha cambia de la recta a la parábola en $y=3$.'
          - texto: 'b) Queda $\int_{0}^{3}\int_{0}^{y/3}dx\,dy + \int_{3}^{4}\int_{0}^{\sqrt{4-y}}dx\,dy$.'
          - texto: 'c) Con densidad constante la $k$ se cancela y el centro es puramente geométrico.'
          - texto: 'b) Al invertir sale una sola integral, porque la región es convexa.'
            trampa: true
            mensaje: |
              Ser convexa no basta. Lo que decide es si la **misma** curva hace
              de frontera en todo el recorrido, y aquí no: por debajo de $y=3$
              la tira horizontal acaba en la recta, y por encima en la parábola.
              Hay que partir en $y=3$.
    resolucion: |
      **a) El dominio.** Entre la recta $y=3x$ y la parábola $y=4-x^{2}$, con
      $x$ de 0 a 1. Se cortan en $x=1$, donde las dos valen 3, así que los
      vértices son

      $$
      (0,0),\qquad (0,4),\qquad (1,3)
      $$

      un triángulo curvo con el lado derecho en punta.

      **b) Invertir el orden.** Barriendo con tiras **horizontales** la frontera
      derecha cambia a media altura, así que hay que partir en $y=3$:

      $$
      \int_{0}^{3}\!\!\int_{0}^{y/3} dx\,dy
      \;+\;
      \int_{3}^{4}\!\!\int_{0}^{\sqrt{4-y}} dx\,dy
      $$

      **Comprobación:** las dos suman $\frac96 + \frac23 = \frac{13}{6}$, el
      mismo valor que la integral original. ✓ Hacer esa comprobación es lo que
      confirma que la inversión está bien.

      **c) El centro de gravedad.** Con densidad constante la $k$ se cancela y
      queda el centroide.

      $$
      A = \frac{13}{6}
      $$

      $$
      \iint_D x\,dA = \int_{0}^{1} x\bigl(4-x^{2}-3x\bigr)dx = \frac34
      \qquad\Longrightarrow\qquad
      \overline{x} = \frac{3/4}{13/6} = \frac{9}{26} \approx 0{,}346
      $$

      $$
      \iint_D y\,dA = \frac12\int_{0}^{1}\Bigl[\bigl(4-x^{2}\bigr)^{2}-9x^{2}\Bigr]dx = \frac{79}{15}
      \qquad\Longrightarrow\qquad
      \overline{y} = \frac{79/15}{13/6} = \frac{158}{65} \approx 2{,}431
      $$

      $$
      \boxed{\;G = \left(\tfrac{9}{26},\ \tfrac{158}{65}\right) \approx (0{,}35;\ 2{,}43)\;}
      $$

      > **El control de plausibilidad.** El recinto ocupa $x\in[0,1]$ e
      > $y\in[0,4]$, y está claramente cargado hacia arriba y hacia la
      > izquierda: la tira vertical mide 4 en $x=0$ y se reduce a 0 en $x=1$. Un
      > centro en $(0{,}35;\,2{,}43)$ encaja. Si hubiera salido $x>0{,}5$ habría
      > que volver atrás.

  - id: ex2021-4ev-3-area-por-integral-curvilinea
    titulo: El área de una curva cerrada, con una integral de línea
    fuente: >-
      Ejercicio 3 · Cuarta evaluación (segundo parcial), 29 de marzo de 2021 ·
      Cálculo, UPV/EHU · Figura redibujada en SVG a partir de la
      parametrización del enunciado (CLAUDE.md §08). El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 8
      comp4: 1
    enunciado: |
      Calcular el área limitada por la curva cerrada
      $x = \text{sen}\,t\,\cos t$, $y = \text{sen}\,t$, con $0\le t\le\pi$, que
      se muestra en la figura.

      **Ayuda:** calcular el trabajo realizado por el campo vectorial
      $V = (-y,\,x)$ a lo largo de la curva cerrada.
    pide: El área encerrada por la curva.
    pasos:
      - tipo: reconocer
        pregunta: |
          La ayuda propone calcular el trabajo de $V=(-y,x)$. ¿Por qué ese campo
          y no otro?
        opciones:
          - texto: Porque su integrando de Green vale 2, así que la integral cerrada es el doble del área
            correcta: true
            mensaje: |
              Exacto. Con $P=-y$ y $Q=x$, $Q_x-P_y = 1-(-1) = 2$, y Green
              convierte la integral de línea en $2\times$área. Es el truco
              estándar para medir áreas de curvas parametrizadas.
          - texto: Porque es conservativo
            mensaje: |
              No lo es —$P_y=-1\neq 1=Q_x$— y menos mal: si lo fuera, la
              integral sobre una curva cerrada valdría cero y no serviría para
              medir nada.
          - texto: Porque es el único campo cuyo trabajo se puede calcular sobre esta curva
            mensaje: |
              Cualquier campo se puede integrar sobre ella parametrizando. Lo
              especial de este es que su integrando de Green es **constante**, y
              eso es lo que lo convierte en un medidor de áreas.
      - tipo: calcular
        titulo: El integrando de Green
        pregunta: |
          Para $V=(-y,\,x)$, ¿cuánto vale $\dfrac{\partial Q}{\partial x} - \dfrac{\partial P}{\partial y}$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Cero saldría si el campo fuera conservativo. Aquí $Q_x=1$ y
              $P_y=-1$, y restar un negativo suma: $1-(-1)=2$.
          - valor: '1'
            mensaje: |
              1 es solo $Q_x$. Falta restarle $P_y=-1$, que aporta otro 1.
        pista: |
          $Q_x = 1$ y $P_y = -1$. La resta es $1-(-1)$.
        desarrollo: |
          $$
          Q_x - P_y = 1 - (-1) = 2
          $$

          Y por Green,

          $$
          \oint_C -y\,dx + x\,dy = \iint_D 2\,dA = 2A
          $$

          **De ahí sale la fórmula del área:** $A = \frac12\oint(x\,dy - y\,dx)$.
      - tipo: calcular
        titulo: El área
        pregunta: |
          Sustituyendo la parametrización, el integrando se simplifica a
          $\text{sen}^{3}t$ y el área queda $\frac12\int_{0}^{\pi}\text{sen}^{3}t\,dt$.
          ¿Cuánto vale?
        respuesta:
          tipo: numero
          valor: '0.6667'
          tolerancia: 0.01
          formato: en forma exacta (2/3) o con cuatro decimales
        distractores:
          - valor: '1.3333'
            mensaje: |
              $4/3$ es el valor de la integral $\int_0^\pi \text{sen}^{3}t\,dt$
              **sin** el medio de delante. La fórmula del área lleva el $1/2$.
          - valor: '0.3333'
            mensaje: |
              $1/3$ es la mitad de la mitad. La integral vale $4/3$ y su mitad
              es $2/3$.
        pista: |
          $\int_0^\pi \text{sen}^3 t\,dt = 4/3$, y hay que tomar la mitad.
        desarrollo: |
          $$
          A = \frac12\int_{0}^{\pi}\text{sen}^{3}t\,dt = \frac12\cdot\frac43 = \frac23
          $$

          Redondo, que es la firma de un enunciado bien construido.
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Con $V=(-y,x)$, Green da $\oint = \iint 2\,dA = 2A$, luego $A = \frac12\oint(x\,dy-y\,dx)$.'
          - texto: 'Sustituyendo $x=\frac12\text{sen}\,2t$ e $y=\text{sen}\,t$, sale $x\,dy - y\,dx = \text{sen}^{3}t\,dt$.'
          - texto: 'Integrando de 0 a $\pi$ y tomando la mitad, $A = \frac23$.'
          - texto: 'La curva es cerrada porque en $t=0$ y en $t=\pi$ vuelve al origen.'
          - texto: 'Como el campo no es conservativo, Green no se puede aplicar.'
            trampa: true
            mensaje: |
              Al revés: Green sirve **precisamente** cuando el campo no es
              conservativo. Si lo fuera, la integral cerrada valdría cero y no
              mediría ningún área. Lo que Green necesita es curva cerrada,
              sentido positivo y parciales continuas — las tres se cumplen.
    resolucion: |
      **La ayuda del enunciado es el ejercicio entero**, y entenderla es el
      punto de COMP1.

      <figure class="figura-examen">
        <svg viewBox="-40 34 300 168" role="img" aria-labelledby="e2021T e2021D">
          <title id="e2021T">La curva cerrada del enunciado</title>
          <desc id="e2021D">Un lazo cerrado con forma de hoja, simétrico respecto del eje vertical, que sale del origen, se abre hacia la derecha, llega al punto más alto sobre el eje y vuelve por la izquierda al origen.</desc>
          <path d="M110.0 170.0 L117.5 162.8 L124.9 155.6 L132.0 148.5 L138.8 141.5 L145.0 134.6 L150.7 127.9 L155.6 121.3 L159.8 115.0 L163.1 108.9 L165.5 103.0 L167.0 97.5 L167.5 92.2 L167.0 87.3 L165.5 82.7 L163.1 78.5 L159.8 74.7 L155.6 71.3 L150.7 68.4 L145.0 65.8 L138.8 63.7 L132.0 62.1 L124.9 60.9 L117.5 60.2 L110.0 60.0 L102.5 60.2 L95.1 60.9 L88.0 62.1 L81.3 63.7 L75.0 65.8 L69.3 68.4 L64.4 71.3 L60.2 74.7 L56.9 78.5 L54.5 82.7 L53.0 87.3 L52.5 92.2 L53.0 97.5 L54.5 103.0 L56.9 108.9 L60.2 115.0 L64.4 121.3 L69.3 127.9 L75.0 134.6 L81.2 141.5 L88.0 148.5 L95.1 155.6 L102.5 162.8 L110.0 170.0 Z" fill="var(--live-soft)" stroke="var(--live)" stroke-width="2.2"></path>
          <line x1="-16" y1="170" x2="240" y2="170" stroke="var(--rule)" stroke-width="1.2"></line>
          <line x1="110" y1="190" x2="110" y2="40" stroke="var(--rule)" stroke-width="1.2"></line>
          <circle cx="110" cy="170" r="3.4" fill="var(--flag)"></circle>
          <circle cx="110" cy="60" r="3" fill="var(--ink)"></circle>
          <text x="96" y="186" font-size="10" fill="var(--faint)" font-family="var(--mono)">t=0, π</text>
          <text x="118" y="56" font-size="10" fill="var(--faint)" font-family="var(--mono)">t=π/2</text>
          <text x="174" y="96" font-size="10" fill="var(--faint)" font-family="var(--mono)">t=π/4</text>
          <text x="196" y="72" font-size="11" fill="var(--flag)" font-family="var(--mono)">A = 2/3</text>
        </svg>
        <figcaption>
          En <code>t=0</code> y en <code>t=π</code> la curva está en el mismo
          punto, el origen. <strong>Eso es lo que la hace cerrada</strong>, y sin
          eso la ayuda del enunciado no serviría.
        </figcaption>
      </figure>

      **Por qué ese campo.** Con $V=(-y,\,x)$:

      $$
      \frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y} = 1-(-1) = 2
      $$

      **constante**, así que Green convierte la integral de línea en dos veces
      el área:

      $$
      \oint_C -y\,dx + x\,dy = \iint_D 2\,dA = 2A
      \qquad\Longrightarrow\qquad
      A = \frac12\oint_C \bigl(x\,dy - y\,dx\bigr)
      $$

      **Sustituyendo la parametrización.** Con
      $x = \text{sen}\,t\cos t = \frac12\text{sen}\,2t$ e $y=\text{sen}\,t$:

      $$
      dx = \cos 2t\;dt,
      \qquad
      dy = \cos t\;dt
      $$

      $$
      x\,dy - y\,dx
      = \text{sen}\,t\cos^{2}t - \text{sen}\,t\cos 2t
      = \text{sen}\,t\bigl(\cos^{2}t - \cos 2t\bigr)
      $$

      Y usando $\cos 2t = 2\cos^{2}t-1$, el paréntesis se colapsa:

      $$
      \cos^{2}t - \bigl(2\cos^{2}t-1\bigr) = 1-\cos^{2}t = \text{sen}^{2}t
      $$

      $$
      x\,dy - y\,dx = \text{sen}^{3}t\;dt
      $$

      **El área:**

      $$
      A = \frac12\int_{0}^{\pi}\text{sen}^{3}t\;dt = \frac12\cdot\frac43
      = \boxed{\frac23}
      $$

      > **Lo que hace especial a este ejercicio** es que mide un área **sin
      > integrar sobre la región**. El recinto tiene una forma incómoda de
      > describir con límites, pero su borde está parametrizado desde el
      > enunciado: recorrer el borde sale gratis y el interior habría costado
      > mucho. Es el sentido de Green leído del revés.
      >
      > Y fíjate en que el enunciado da la ayuda. Sin ella, el ejercicio de
      > COMP1 sería reconocer que hace falta.
