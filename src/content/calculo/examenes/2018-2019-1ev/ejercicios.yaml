            <desc id="f-ex1819-bicubica-d">Dos circunferencias concéntricas. En la pequeña, de radio uno, tres puntos a cero, ciento veinte y doscientos cuarenta grados. En la grande, de radio dos, otros tres a sesenta, ciento ochenta y trescientos. Los dos triángulos equiláteros están girados sesenta grados uno respecto del otro.</desc>
