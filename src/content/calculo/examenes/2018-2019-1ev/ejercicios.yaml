        consigna: |
          Dibuja las seis soluciones en el plano complejo, con las **dos**
          circunferencias que las contienen.
        comprueba:
          - punto: |
              Dos circunferencias, de radios $1$ y $2$.
            porque: |
              El cambio $w=z^{3}$ da $w=1$ y $w=-8$, y cada uno tiene su propio
              módulo al sacar la raíz cúbica. Dibujarlas todas en una sola
              circunferencia delata que no se ha hecho el cambio.
          - punto: |
              En la de radio $1$: $0^\circ$, $120^\circ$ y $240^\circ$, con una
              solución en $z=1$.
            porque: |
              Son las raíces cúbicas de la unidad, y $z=1$ es la que se comprueba
              de cabeza sustituyendo en la ecuación original.
          - punto: |
              En la de radio $2$: $60^\circ$, $180^\circ$ y $300^\circ$, con una
              solución en $z=-2$.
            porque: |
              Son las raíces cúbicas de $-8$, giradas $60^\circ$ respecto de las
              otras tres. Y $z=-2$ también se comprueba sustituyendo.
          - punto: |
              Los dos triángulos equiláteros, uno dentro del otro, formando una
              estrella de seis puntas.
            porque: |
              Es la imagen que confirma que los seis argumentos están bien
              repartidos. Si los dos triángulos salen alineados en vez de
              girados, hay un error de $60^\circ$.
        veredicto: |
          Una ecuación bicúbica da dos familias de tres raíces, cada una con su
          módulo. El dibujo con dos circunferencias es lo que impide juntarlas en
          una sola por inercia.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** Resolver $z^{6}+7z^{3}-8 = 0$ en $\mathbb{C}$ y representar
      las soluciones.

      **Reparto de puntos del examen:** COMP2 6 · COMP4 4. **No se evalúa
      COMP1**, así que los cuatro puntos de explicación se los lleva justificar
      bien el cambio de variable y el recuento de soluciones.

      > Este enunciado es el **ejercicio 1.11 del boletín** del tema 1.

      ### 1 · La ecuación no es de sexto grado, es bicúbica

      Solo aparecen $z^{6}$ y $z^{3}$, y $z^{6} = \left(z^{3}\right)^{2}$. El
      cambio

      $$
      w = z^{3}
      $$

      la convierte en una ecuación de **segundo grado**:

      $$
      w^{2}+7w-8 = 0
      $$

      Y conviene decir por qué el cambio es lícito: es una aplicación
      **sobreyectiva** de $\mathbb{C}$ en $\mathbb{C}$, así que toda solución en
      $w$ procede de alguna $z$, y no se pierde ninguna.

      ### 2 · Resolución en $w$

      $$
      w = \frac{-7\pm\sqrt{49+32}}{2} = \frac{-7\pm9}{2}
      \;\Longrightarrow\;
      w_1 = 1, \quad w_2 = -8
      $$

      Comprobación gratis: la suma de las raíces debe ser $-7$ y el producto
      $-8$. Y $1+(-8) = -7$ ✔, $1\cdot(-8) = -8$ ✔.

      ### 3 · Deshacer el cambio: dos ecuaciones cúbicas

      Aquí está el paso que decide el ejercicio. Deshacer el cambio **no** es
      escribir $z = \sqrt[3]{w}$ y quedarse con un número: es resolver
      $z^{3} = w$, que en $\mathbb{C}$ tiene **tres** soluciones para cada $w$.

      **$z^{3} = 1 = e^{i\,0^{\circ}}$.** Módulo $\sqrt[3]{1} = 1$ y argumentos
      $\frac{0^{\circ}+360^{\circ}k}{3} = 0^{\circ},\,120^{\circ},\,240^{\circ}$:

      $$
      z = 1, \qquad z = -\frac12+\frac{\sqrt3}{2}i,
      \qquad z = -\frac12-\frac{\sqrt3}{2}i
      $$

      **$z^{3} = -8 = 8\,e^{i\,180^{\circ}}$.** Módulo $\sqrt[3]{8} = 2$ y
      argumentos $\frac{180^{\circ}+360^{\circ}k}{3} = 60^{\circ},\,180^{\circ},\,300^{\circ}$:

      $$
      z = 1+\sqrt3\,i, \qquad z = -2, \qquad z = 1-\sqrt3\,i
      $$

      ### 4 · Recuento

      Seis soluciones, que es exactamente lo que garantiza el **teorema
      fundamental del álgebra** para un polinomio de grado 6. Si salieran
      menos, faltaría alguna; si salieran más, habría una repetida.

      Y vienen en **pares conjugados**, como tiene que pasar en toda ecuación
      de coeficientes reales: $-\frac12\pm\frac{\sqrt3}{2}i$ y
      $1\pm\sqrt3\,i$, más las dos reales $1$ y $-2$.

      ### 5 · Representación gráfica

      Los seis afijos se reparten en **dos circunferencias concéntricas**:

      - Tres en la de radio 1, a $0^{\circ}$, $120^{\circ}$ y $240^{\circ}$.
      - Tres en la de radio 2, a $60^{\circ}$, $180^{\circ}$ y $300^{\circ}$.

      Cada terna es un triángulo equilátero, y uno está girado $60^{\circ}$
      respecto del otro, así que los seis puntos quedan **alternados**
      angularmente: uno de radio 1, uno de radio 2, uno de radio 1…

      ### 6 · Comprobación

      Con la solución real más cómoda, $z=-2$:

      $$
      z^{3} = -8, \qquad z^{6} = 64
      $$

      $$
      64+7(-8)-8 = 64-56-8 = 0 \quad\checkmark
      $$

      Con $z=1$: $1+7-8 = 0$ ✔

      Y con una compleja, $z = -\frac12+\frac{\sqrt3}{2}i$, que tiene módulo 1 y
      argumento $120^{\circ}$: su cubo tiene módulo 1 y argumento
      $360^{\circ} \equiv 0^{\circ}$, o sea $z^{3} = 1$, y entonces
      $z^{6} = 1$. Sustituyendo: $1+7-8 = 0$ ✔

      ### Resultado

      $$
      \boxed{\;z \in \left\{\,1,\; -\tfrac12+\tfrac{\sqrt3}{2}i,\;
      -\tfrac12-\tfrac{\sqrt3}{2}i,\; 1+\sqrt3\,i,\; -2,\; 1-\sqrt3\,i \,\right\}\;}
      $$

  - id: ex1819-3-definiciones-y-desigualdad
    titulo: Tres definiciones y la desigualdad que sobrevive al límite
    fuente: >-
      Ejercicio 3 · Primera evaluación, 15 de octubre de 2018 · Cálculo
      (Industriales), UPV/EHU · El apartado (a) es el ejercicio 2.2 del boletín
      y el (b) es el 2.5. El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 0
      comp4: 8

    nivel: examen
    enunciado: |
      **a)** Definir formalmente los siguientes conceptos: sucesión creciente,
      sucesión acotada, sucesión divergente hacia $-\infty$.

      **b)** Demostrar la siguiente propiedad. Sean $\{x_n\}_{n\in\mathbb{N}}$ e
      $\{y_n\}_{n\in\mathbb{N}}$ dos sucesiones tales que
      $x_n \le y_n \;\;\forall n \in \mathbb{N}$ y
      $\lim_{n\to\infty} x_n = x$, $\lim_{n\to\infty} y_n = y$. Entonces
      $x \le y$.
    pide: Definir los tres conceptos y demostrar la propiedad.

    pasos:
      - tipo: reconocer
        pregunta: |
          En la definición de «divergente hacia $-\infty$», ¿por qué importa el
          **orden** de los cuantificadores?
        opciones:
          - texto: >-
              Porque $n_0$ va después de $M$, y eso significa que **puede
              depender de $M$**
            correcta: true
            mensaje: |
              Eso es la mitad de la nota del apartado. Escribirlo al revés
              —«existe $n_0$ tal que para todo $M$…»— afirmaría que un mismo
              índice sirve para todas las cotas, que es falso: cuanto más
              exigente es $M$, más lejos hay que ir.
          - texto: No importa, el orden es una convención de escritura
            mensaje: |
              Importa y mucho. «Para todo $x$ existe $y$» y «existe $y$ para
              todo $x$» dicen cosas distintas, y una puede ser cierta y la otra
              falsa.
          - texto: Porque $M$ tiene que ser negativo
            mensaje: |
              $M$ recorre **todos** los reales. Lo que pasa es que la condición
              solo tiene contenido cuando $M$ es muy negativo; para $M$ positivo
              se cumple trivialmente.
          - texto: Porque así la definición es más corta
            mensaje: |
              Las dos versiones ocupan lo mismo. Lo que cambia es lo que
              significan.

      - tipo: calcular
        titulo: La definición, aplicada
        pregunta: |
          Para $a_n = -n^{2}$ y $M = -400$, ¿cuál es el menor $n_0$ tal que
          $a_n < M$ para todo $n>n_0$?
        respuesta:
          tipo: numero
          valor: '20'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '400'
            mensaje: |
              400 es $\left|M\right|$, no el índice. La condición es
              $-n^{2} < -400$, o sea $n^{2} > 400$: hay que sacar la raíz.
          - valor: '21'
            mensaje: |
              Casi. La condición $n>20$ se cumple ya en $n=21$, así que el menor
              $n_0$ **válido** es 20: el índice a partir del cual —excluido— se
              cumple siempre.
          - valor: '-20'
            mensaje: |
              Los índices de una sucesión son naturales. La raíz que interesa es
              la positiva.
        pista: |
          $a_n < M$ es $-n^{2} < -400$, es decir $n^{2} > 400$.
        desarrollo: |
          $$
          a_n < M \iff -n^{2} < -400 \iff n^{2} > 400 \iff n > 20
          $$

          La condición se cumple para todo $n>20$, así que el menor $n_0$ válido
          es

          $$
          n_0 = 20
          $$
        veredicto: |
          Con $M = -10\,000$ haría falta $n_0 = 100$. Por eso el cuantificador
          de $M$ va **antes**: el índice depende de la exigencia.

      - tipo: justificar
        pregunta: |
          Ordena la demostración del apartado (b). Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              Por reducción al absurdo, supongamos $x>y$, y sea
              $\varepsilon = \dfrac{x-y}{2} > 0$.
          - texto: |
              Existe $m_1$ tal que $x_n > x-\varepsilon = \dfrac{x+y}{2}$ para
              todo $n>m_1$.
          - texto: |
              Existe $m_2$ tal que $y_n < y+\varepsilon = \dfrac{x+y}{2}$ para
              todo $n>m_2$.
          - texto: |
              Para $n>\max(m_1,m_2)$ valen las dos, y entonces
              $y_n < \dfrac{x+y}{2} < x_n$, en contra de $x_n \le y_n$.
          - texto: |
              Contradicción, luego $x \le y$.
          - texto: |
              Se toma $\varepsilon = x-y$, la distancia entre los dos límites.
            trampa: true
            mensaje: |
              Con la distancia entera los dos entornos se **tocan** en el punto
              medio y la contradicción deja de ser estricta: podría ocurrir
              $x_n = y_n = \frac{x+y}{2}$, que no contradice $x_n \le y_n$. Hay
              que tomar la **mitad**, para que los entornos queden separados.
        veredicto: |
          Es el mismo épsilon de los ejercicios 2.3 a 2.6 del boletín y de otros
          tres exámenes de esta colección. Conviene tenerlo como reflejo.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** (a) Definir creciente, acotada y divergente hacia $-\infty$.
      (b) Demostrar que $x_n \le y_n$ y la convergencia de las dos implican
      $x \le y$.

      **Reparto de puntos del examen:** COMP1 2 · COMP4 8. **Ni un punto de
      cálculo.**

      > Los dos apartados están en el boletín del tema 2: el (a) es el
      > **ejercicio 2.2** y el (b) es el **2.5**. Los tres ejercicios de este
      > examen están en los boletines — el 1 es el 1.22 y el 2 es el 1.11 —, así
      > que esta convocatoria se podía haber respondido entera con ellos
      > delante.

      ### 1 · Apartado (a): las tres definiciones

      **Sucesión creciente.**

      $$
      \{a_n\} \text{ creciente} \iff a_{n+1} > a_n \quad \forall n \in \mathbb{N}
      $$

      Sin excepciones: basta un par consecutivo que falle para que deje de
      serlo.

      **Sucesión acotada.**

      $$
      \{a_n\} \text{ acotada} \iff
      \exists\, p,q \in \mathbb{R} \;:\; p \le a_n \le q \quad \forall n \in \mathbb{N}
      $$

      Las **dos** cotas. Con solo la de arriba se tiene «acotada
      superiormente», que es más débil: $a_n = -n^{2}$ la cumple y no está
      acotada. Equivalentemente:
      $\exists K>0 : \left|a_n\right| \le K$ para todo $n$.

      **Sucesión divergente hacia $-\infty$.**

      $$
      \lim a_n = -\infty \iff
      \forall M \in \mathbb{R} \;\exists\, n_0 \in \mathbb{N} \;:\;
      n>n_0 \Rightarrow a_n < M
      $$

      ### 2 · Lo que de verdad se evalúa en (a): el orden de los cuantificadores

      En la tercera definición, $n_0$ va **después** de $M$, y eso significa que
      puede depender de él. Escribirlo al revés diría que un mismo índice sirve
      para todas las cotas, que es falso.

      Se ve con un ejemplo, y conviene ponerlo: para $a_n = -n^{2}$,

      | $M$ | menor $n_0$ que sirve |
      |---|---|
      | $-100$ | $10$ |
      | $-400$ | $20$ |
      | $-10\,000$ | $100$ |

      El índice **crece con la exigencia**. Ningún $n_0$ fijo vale para todos
      los $M$.

      Y el contraste entre las tres definiciones, que es lo que las une: las dos
      primeras hablan de **todos** los términos; la tercera, solo de los que hay
      a partir de cierto punto. Es la misma diferencia que separa la monotonía
      de la convergencia.

      ### 3 · Apartado (b): estrategia

      Reducción al absurdo. La negación de $x \le y$ es $x>y$, y de esa
      diferencia positiva sale el épsilon.

      ### 4 · Apartado (b): la demostración

      Supongamos $x>y$ y tomemos

      $$
      \varepsilon = \frac{x-y}{2} > 0
      $$

      Por converger $\{x_n\}$, existe $m_1$ tal que para todo $n>m_1$

      $$
      \left|x_n-x\right| < \varepsilon
      \;\Longrightarrow\;
      x_n > x-\varepsilon = \frac{x+y}{2}
      $$

      Por converger $\{y_n\}$, existe $m_2$ tal que para todo $n>m_2$

      $$
      \left|y_n-y\right| < \varepsilon
      \;\Longrightarrow\;
      y_n < y+\varepsilon = \frac{x+y}{2}
      $$

      Sea $n > \max(m_1,m_2)$: **las dos valen a la vez**, y encadenando

      $$
      y_n < \frac{x+y}{2} < x_n
      $$

      es decir $y_n < x_n$, en contra de la hipótesis. Contradicción, luego
      $x \le y$. $\blacksquare$

      ### 5 · Los dos detalles que valen la nota

      **Por qué la mitad y no la distancia entera.** Con
      $\varepsilon = x-y$ los dos entornos se tocarían en el punto medio y
      podría darse $x_n = y_n$, que no contradice $x_n \le y_n$. Con la mitad
      los entornos quedan **disjuntos** y el choque es limpio.

      **El máximo de los dos índices.** Cada sucesión aporta su propio $m$ y no
      tienen por qué coincidir. Sin el máximo no se sabe que las dos
      desigualdades valen en el **mismo** $n$, y sin eso no se pueden encadenar.

      ### 6 · La desigualdad se debilita

      Aunque la hipótesis fuera estricta, $x_n < y_n$, la conclusión seguiría
      siendo $x \le y$ y no $x<y$. Contraejemplo inmediato:

      $$
      x_n = 0, \qquad y_n = \frac1n
      $$

      cumplen $x_n < y_n$ para todo $n$ y sus límites son iguales, los dos 0.

      ### 7 · Comprobación

      **De (a)**, aplicando las tres definiciones a $a_n = -n^{2}$:

      | definición | ¿la cumple? | por qué |
      |---|---|---|
      | creciente | no | $a_2 = -4 < -1 = a_1$ |
      | acotada | no | no hay cota inferior |
      | divergente a $-\infty$ | sí | dado $M$, basta $n_0 = \lceil\sqrt{\lvert M\rvert}\rceil$ |

      **De (b)**, con $x=5$ e $y=2$: tomando $x_n = 5-\frac4n$ e
      $y_n = 2+\frac4n$, la desigualdad $x_n \le y_n$ se cumple en $n=1,2$ y se
      rompe a partir de $n=3$. Y con $\varepsilon = 1{,}5$ salen
      $m_1 = m_2 = 2$: el cruce aparece justo en $n>\max(m_1,m_2) = 2$ ✔

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \text{(a) } & \text{creciente: } a_{n+1}>a_n\ \forall n;\quad
      \text{acotada: } \exists p,q : p \le a_n \le q\ \forall n; \\
      & \text{divergente a } -\infty:\ \forall M\ \exists n_0 :
      n>n_0 \Rightarrow a_n<M \\[6pt]
      \text{(b) } & x_n \le y_n\ \forall n,\ x_n \to x,\ y_n \to y
      \;\Longrightarrow\; x \le y
      \end{aligned}}
      $$
