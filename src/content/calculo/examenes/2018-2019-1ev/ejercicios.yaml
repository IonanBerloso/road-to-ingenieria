        consigna: |
          Dibuja los dos discos en el mismo plano complejo y sombrea la lente
          donde se solapan. Marca los dos puntos donde se cortan las
          circunferencias.
        comprueba:
          - punto: |
              El primer disco, de centro $\left(2,0\right)$ y radio $1$.
            porque: |
              Sale de $\operatorname{Re}\tfrac{1}{z-1}>\tfrac12$ después de
              completar cuadrados. El centro **no** es $1$: el $z-1$ del
              denominador desplaza, pero el disco acaba centrado en $2$.
          - punto: |
              El segundo disco, de centro $\left(1,-1\right)$ y radio $1$.
            porque: |
              La condición sobre la parte imaginaria lleva un signo menos que
              baja el disco. Dibujarlo por encima del eje real es el error que
              produce una lente en el sitio equivocado.
          - punto: |
              Los dos bordes a **trazos**, porque las dos desigualdades son
              estrictas.
            porque: |
              Con $>$ el borde no entra. La lente es abierta, y eso se dibuja.
          - punto: |
              Los dos puntos de corte, $z=1$ y $z=2-i$, marcados con círculo
              hueco.
            porque: |
              Son las dos puntas de la lente y ninguna pertenece a la región. Y
              $z=1$ era además el punto excluido de oficio: el dibujo lo confirma.
        veredicto: |
          La lente queda en el cuarto cuadrante desplazada a la derecha, con las
          puntas en $1$ y en $2-i$. Si tu región toca el eje imaginario, alguno de
          los dos centros está mal.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** Se pide la región de los $z$ con
      $\operatorname{Re}\left(\frac{1}{z-1}\right) > \frac12$ y
      $\operatorname{Im}\left(\frac{1}{z-1}\right) > \frac12$.

      **Reparto de puntos del examen:** COMP1 1 · COMP2 6 · COMP4 3. Este examen
      tiene **tres ejercicios y 30 puntos**.

      > Este enunciado es el **ejercicio 1.22 del boletín** del tema 1, palabra
      > por palabra.

      ### 1 · Restricción previa

      $\frac{1}{z-1}$ exige $z \neq 1$. Se anota antes de operar y se comprueba
      al final dónde cae ese punto.

      ### 2 · Separar parte real e imaginaria

      Mientras $z-1$ esté en el denominador no se puede leer su parte real. Se
      racionaliza multiplicando por el conjugado, que convierte el denominador
      en un número real positivo:

      $$
      \frac{1}{z-1} = \frac{\overline{z-1}}{\left|z-1\right|^{2}}
      = \frac{(x-1)-iy}{D},
      \qquad D = (x-1)^{2}+y^{2} > 0
      $$

      $$
      \operatorname{Re}\left(\frac{1}{z-1}\right) = \frac{x-1}{D},
      \qquad
      \operatorname{Im}\left(\frac{1}{z-1}\right) = \frac{-y}{D}
      $$

      **Ojo al signo de la parte imaginaria:** el conjugado lo cambia. Es
      $\frac{-y}{D}$, y de ahí que el segundo disco acabe por debajo del eje
      real.

      ### 3 · Primera condición

      $$
      \frac{x-1}{D} > \frac12
      $$

      Como $D>0$, multiplicar los dos miembros por $2D$ **no cambia el
      sentido** de la desigualdad —y esto hay que decirlo, es la hipótesis del
      paso—:

      $$
      2(x-1) > (x-1)^{2}+y^{2}
      $$

      $$
      0 > (x-1)^{2}-2(x-1)+y^{2} = x^{2}-4x+3+y^{2}
      $$

      $$
      (x-2)^{2}+y^{2} < 1
      $$

      **Disco abierto** de centro $(2,0)$ y radio 1.

      ### 4 · Segunda condición

      $$
      \frac{-y}{D} > \frac12
      \;\Longleftrightarrow\;
      -2y > (x-1)^{2}+y^{2}
      $$

      $$
      (x-1)^{2}+y^{2}+2y < 0
      \;\Longleftrightarrow\;
      (x-1)^{2}+(y+1)^{2} < 1
      $$

      **Disco abierto** de centro $(1,-1)$ y radio 1.

      ### 5 · La intersección

      ¿Se cortan? La distancia entre los centros es

      $$
      d = \sqrt{(2-1)^{2}+(0+1)^{2}} = \sqrt2 \approx 1{,}41
      $$

      menor que la suma de los radios, que es 2, y mayor que su diferencia, que
      es 0. Luego **se cortan** en dos puntos y la intersección es una
      **lente**.

      Los bordes no entran: las dos desigualdades son estrictas.

      ### 6 · El punto excluido

      $z=1$ está a distancia 1 del centro $(2,0)$ y a distancia 1 del centro
      $(1,-1)$: cae **sobre** las dos circunferencias. Como las desigualdades
      son estrictas, ya estaba fuera de la región y no hay que quitarlo aparte.

      Merece la pena escribirlo: comprobar dónde cae el punto excluido es lo que
      cierra bien el ejercicio, aunque el resultado sea que no añade nada.

      ### 7 · Representación gráfica

      Dos círculos de radio 1, uno centrado en $(2,0)$ y otro en $(1,-1)$, con
      la zona común sombreada y los bordes en trazo discontinuo por ser
      abiertos. La lente queda en el cuarto cuadrante, más o menos entre
      $x=1{,}2$ y $x=2$, con $y$ entre $-0{,}8$ y $0$.

      ### 8 · Comprobación

      Un punto de la lente, $(1{,}6,\,-0{,}5)$:

      - Primer disco: $(1{,}6-2)^{2}+0{,}25 = 0{,}41 < 1$ ✔
      - Segundo disco: $(0{,}6)^{2}+(0{,}5)^{2} = 0{,}61 < 1$ ✔

      Y en el enunciado original, con $D = 0{,}36+0{,}25 = 0{,}61$:

      $$
      \operatorname{Re} = \frac{0{,}6}{0{,}61} \approx 0{,}98 > 0{,}5 \;\checkmark
      \qquad
      \operatorname{Im} = \frac{0{,}5}{0{,}61} \approx 0{,}82 > 0{,}5 \;\checkmark
      $$

      Y uno que debe fallar: $(2,0)$, el centro del primer disco. Primer disco ✔,
      pero segundo: $(1)^{2}+(1)^{2} = 2 > 1$ ✗. Fuera, como debe — estar en un
      disco no basta.

      ### Resultado

      $$
      \boxed{\;(x-2)^{2}+y^{2} < 1 \quad\text{y}\quad (x-1)^{2}+(y+1)^{2} < 1\;}
      $$

  - id: ex1819-2-bicubica
    titulo: Una ecuación de grado seis que en realidad es de segundo
    fuente: >-
      Ejercicio 2 · Primera evaluación, 15 de octubre de 2018 · Cálculo
      (Industriales), UPV/EHU · Enunciado idéntico al ejercicio 1.11 del
      boletín del tema 1. El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 6
      comp4: 4

    nivel: examen
    enunciado: |
      Calcular y representar las soluciones de la ecuación

      $$
      z^{6}+7z^{3}-8 = 0,
      \qquad z \in \mathbb{C}
      $$
    pide: Calcular las seis soluciones y representarlas.

    pasos:
      - tipo: reconocer
        pregunta: |
          La ecuación es de grado 6. ¿Hay que resolver un polinomio de grado 6?
        opciones:
          - texto: >-
              No: solo aparecen $z^{6}$ y $z^{3}$, así que el cambio
              $w = z^{3}$ la convierte en una de segundo grado
            correcta: true
            mensaje: |
              Eso es. $z^{6} = \left(z^{3}\right)^{2}$, así que es una
              **bicúbica**: con $w=z^{3}$ queda $w^{2}+7w-8 = 0$, que se
              resuelve con la fórmula de siempre.
          - texto: Sí, y hay que buscar sus raíces por Ruffini
            mensaje: |
              Ruffini serviría para tantear raíces enteras, pero es dar un
              rodeo largo. El cambio de variable resuelve el ejercicio en dos
              líneas, y además garantiza que no se escapa ninguna solución.
          - texto: No, porque se puede sacar factor común $z^{3}$
            mensaje: |
              No se puede: el término $-8$ no tiene $z$. Sacar factor común
              $z^{3}$ dejaría $z^{3}(z^{3}+7)-8$, que no está factorizado.
          - texto: Sí, pero solo tiene tres soluciones reales
            mensaje: |
              El grado es 6, y en $\mathbb{C}$ eso significa **seis**
              soluciones. Reales solo hay dos, $1$ y $-2$, pero las otras cuatro
              existen igual.

      - tipo: calcular
        titulo: Las dos raíces auxiliares
        pregunta: |
          Con $w = z^{3}$, ¿cuáles son las dos soluciones de $w^{2}+7w-8=0$?
        respuesta:
          tipo: conjunto
          valor: 1, -8
          tolerancia: 0.01
          formato: los dos valores separados por una coma
        distractores:
          - valor: -1, 8
            mensaje: |
              Los dos signos cambiados. Sustituyendo,
              $(-1)^{2}+7(-1)-8 = 1-7-8 = -14 \neq 0$. Comprobar una raíz en la
              ecuación cuesta cinco segundos.
          - valor: 1, 8
            mensaje: |
              El producto de las raíces tiene que ser el término independiente,
              $-8$, y $1\cdot8 = 8$. Una de las dos tiene que ser negativa.
          - valor: 2, -4
            mensaje: |
              Su producto sí es $-8$, pero su suma es $-2$ y tendría que ser
              $-7$. Hacen falta las dos condiciones.
        pista: |
          $w = \frac{-7\pm\sqrt{49+32}}{2}$, y $\sqrt{81} = 9$.
        desarrollo: |
          $$
          w = \frac{-7\pm\sqrt{49+32}}{2} = \frac{-7\pm\sqrt{81}}{2}
          = \frac{-7\pm9}{2}
          $$

          $$
          w_1 = \frac{2}{2} = 1,
          \qquad
          w_2 = \frac{-16}{2} = -8
          $$

          Comprobación rápida: la suma tiene que ser $-7$ —y
          $1+(-8) = -7$ ✔— y el producto $-8$ —y $1\cdot(-8) = -8$ ✔—.
        veredicto: |
          Suma y producto son la comprobación más barata que existe para una
          ecuación de segundo grado. Merece la pena hacerla siempre.

      - tipo: calcular
        titulo: Cuántas soluciones tiene la ecuación original
        pregunta: |
          ¿Cuántos números complejos cumplen $z^{6}+7z^{3}-8=0$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 son las soluciones en $w$. Al deshacer el cambio, **cada una**
              da tres valores de $z$, porque $z^{3}=w$ tiene tres raíces
              cúbicas.
          - valor: '3'
            mensaje: |
              3 serían si solo hubiera un valor de $w$. Hay dos, y cada uno
              aporta tres.
          - valor: '12'
            mensaje: |
              12 sería $2\times6$. Cada $w$ aporta **tres** raíces cúbicas, no
              seis: $2\times3 = 6$, que además es el grado de la ecuación.
        pista: |
          Deshacer el cambio no es sacar una raíz cúbica: es resolver
          $z^{3}=w$, que tiene tres soluciones.
        desarrollo: |
          Deshacer el cambio **no** es escribir $z = \sqrt[3]{w}$ y quedarse con
          un número: es resolver $z^{3} = w$, que en $\mathbb{C}$ tiene
          **tres** soluciones para cada $w \neq 0$.

          Con dos valores de $w$, salen

          $$
          2 \times 3 = 6
          $$

          que es exactamente lo que garantiza el teorema fundamental del álgebra
          para un polinomio de grado 6.
        veredicto: |
          Si salieran menos de seis, faltaría alguna. Ese recuento es la
          comprobación estructural del ejercicio.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Como $z^{6} = \left(z^{3}\right)^{2}$, el cambio $w = z^{3}$
              convierte la ecuación en $w^{2}+7w-8 = 0$.
          - texto: |
              Sus soluciones son $w_1 = 1$ y $w_2 = -8$.
          - texto: |
              **$z^{3} = 1 = e^{i\,0^{\circ}}$:** módulo 1 y argumentos
              $0^{\circ}$, $120^{\circ}$, $240^{\circ}$.
          - texto: |
              **$z^{3} = -8 = 8e^{i\,180^{\circ}}$:** módulo $\sqrt[3]{8} = 2$ y
              argumentos $60^{\circ}$, $180^{\circ}$, $300^{\circ}$.
          - texto: |
              Seis soluciones en total, repartidas en **dos circunferencias
              concéntricas** de radios 1 y 2.
          - texto: |
              Deshaciendo el cambio, $z = \sqrt[3]{1} = 1$ y
              $z = \sqrt[3]{-8} = -2$.
            trampa: true
            mensaje: |
              Eso da dos soluciones de las seis. En $\mathbb{C}$, $z^{3}=w$ **no
              tiene una raíz cúbica, tiene tres**. Quedarse con la real es el
              error clásico de las ecuaciones con cambio de variable, y aquí
              cuesta cuatro sextos del ejercicio.
        veredicto: |
          El dibujo lo dice todo: dos triángulos equiláteros, uno en cada
          circunferencia, girados $60^{\circ}$ el uno respecto del otro.

      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 340 265" role="img" width="340" height="265"
               aria-labelledby="f-ex1819-bicubica-t f-ex1819-bicubica-d">
