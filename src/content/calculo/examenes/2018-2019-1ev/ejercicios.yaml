ejercicios:
  - id: ex1819-1-lente-de-dos-discos
    titulo: La lente donde se cortan dos discos
    fuente: >-
      Ejercicio 1 · Primera evaluación, 15 de octubre de 2018 · Cálculo
      (Industriales), UPV/EHU · Enunciado idéntico al ejercicio 1.22 del
      boletín del tema 1. El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3

    nivel: examen
    enunciado: |
      Calcular y representar geométricamente los afijos de los números
      complejos $z$ que verifican las siguientes condiciones:

      $$
      \operatorname{Re}\left(\frac{1}{z-1}\right) > \frac{1}{2}
      \qquad
      \operatorname{Im}\left(\frac{1}{z-1}\right) > \frac{1}{2}
      $$
    pide: Calcular la región y representarla.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que hacer antes de poder separar parte real e imaginaria?
        opciones:
          - texto: >-
              **Racionalizar**, multiplicando arriba y abajo por el conjugado
              del denominador
            correcta: true
            mensaje: |
              Eso es. Mientras $z-1$ esté en el denominador no se puede leer
              cuál es la parte real. Al multiplicar por $\overline{z-1}$, el
              denominador se vuelve $\left|z-1\right|^{2}$, que es real y
              positivo, y arriba queda todo separado.
          - texto: Tomar módulos
            mensaje: |
              Los módulos borran la información que aquí hace falta: la
              condición habla de la parte real y de la imaginaria por separado,
              y el módulo las mezcla.
          - texto: Elevar al cuadrado las dos condiciones
            mensaje: |
              Elevar al cuadrado no ayuda a separar un cociente, y además
              cambiaría el sentido de las desigualdades donde algún miembro sea
              negativo. Primero se racionaliza.
          - texto: Sustituir $z$ por su forma polar
            mensaje: |
              La polar va bien para productos y potencias. Aquí hay una suma en
              el denominador y hay que separar coordenadas cartesianas: la
              binómica es la forma adecuada.

      - tipo: verificar
        pregunta: |
          Escribe la región simplificada, en $x$ e $y$. Vale cualquier forma
          equivalente.
        condicion: 're(1/(z-1)) > 1/2 & im(1/(z-1)) > 1/2'
        ventana:
          x: [-0.5, 4]
          y: [-3, 1.5]
        formato: por ejemplo (x-2)^2 + y^2 < 1 & (x-1)^2 + (y+1)^2 < 1
        pista: |
          Racionaliza y llama $D = \left|z-1\right|^{2}$. Como $D>0$, se puede
          multiplicar por $2D$ sin cambiar el sentido de las desigualdades.
        desarrollo: |
          Racionalizando, con $D = (x-1)^{2}+y^{2}$:

          $$
          \frac{1}{z-1} = \frac{\overline{z-1}}{\left|z-1\right|^{2}}
          = \frac{(x-1)-iy}{D}
          $$

          $$
          \operatorname{Re} = \frac{x-1}{D},
          \qquad
          \operatorname{Im} = \frac{-y}{D}
          $$

          **Primera condición.** Como $D>0$, multiplicar por $2D$ no cambia el
          sentido:

          $$
          \frac{x-1}{D} > \frac12
          \;\Longleftrightarrow\;
          2(x-1) > (x-1)^{2}+y^{2}
          $$

          $$
          0 > x^{2}-4x+3+y^{2}
          \;\Longleftrightarrow\;
          (x-2)^{2}+y^{2} < 1
          $$

          **Segunda condición.**

          $$
          \frac{-y}{D} > \frac12
          \;\Longleftrightarrow\;
          -2y > (x-1)^{2}+y^{2}
          $$

          $$
          (x-1)^{2}+y^{2}+2y < 0
          \;\Longleftrightarrow\;
          (x-1)^{2}+(y+1)^{2} < 1
          $$
        veredicto: |
          Fíjate en el signo de la parte imaginaria: es $\frac{-y}{D}$, no
          $\frac{y}{D}$. El conjugado lo cambia, y por eso el segundo disco cae
          **por debajo** del eje real.

      - tipo: justificar
        pregunta: |
          Ordena la descripción de la región. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              $\frac{1}{z-1}$ exige $z \neq 1$: se anota antes de operar.
          - texto: |
              Racionalizando,
              $\frac{1}{z-1} = \frac{(x-1)-iy}{D}$ con
              $D = \left|z-1\right|^{2} > 0$.
          - texto: |
              La primera condición da el disco abierto
              $(x-2)^{2}+y^{2} < 1$; la segunda, el disco abierto
              $(x-1)^{2}+(y+1)^{2} < 1$.
          - texto: |
              La distancia entre los centros $(2,0)$ y $(1,-1)$ es
              $\sqrt2 \approx 1{,}41$, menor que la suma de los radios: los dos
              discos **se cortan**.
          - texto: |
              La región pedida es la **lente** de intersección, sin ninguno de
              los dos bordes.
          - texto: |
              El punto $z=1$, que estaba excluido, hay que quitarlo también de
              la lente.
            trampa: true
            mensaje: |
              No hace falta: $z=1$ está a distancia 1 de los dos centros, o sea
              **sobre** las dos circunferencias, y las desigualdades son
              estrictas. Ya estaba fuera. Comprobarlo es correcto; volver a
              excluirlo, redundante — y en un examen sugiere no haber mirado
              dónde cae.
        veredicto: |
          Comprobar si el punto excluido cae dentro o fuera de la región es el
          paso que cierra bien el ejercicio. Casi siempre ya estaba fuera, pero
          hay que verlo.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** Se pide la región de los $z$ con
      $\operatorname{Re}\left(\frac{1}{z-1}\right) > \frac12$ y
      $\operatorname{Im}\left(\frac{1}{z-1}\right) > \frac12$.

      **Reparto de puntos del examen:** COMP1 1 · COMP2 6 · COMP4 3. Este examen
      tiene **tres ejercicios y 30 puntos**.

      > Este enunciado es el **ejercicio 1.22 del boletín** del tema 1, palabra
      > por palabra.

      ### 1 · Restricción previa

      $\frac{1}{z-1}$ exige $z \neq 1$. Se anota antes de operar y se comprueba
      al final dónde cae ese punto.

      ### 2 · Separar parte real e imaginaria

      Mientras $z-1$ esté en el denominador no se puede leer su parte real. Se
      racionaliza multiplicando por el conjugado, que convierte el denominador
      en un número real positivo:

      $$
      \frac{1}{z-1} = \frac{\overline{z-1}}{\left|z-1\right|^{2}}
      = \frac{(x-1)-iy}{D},
      \qquad D = (x-1)^{2}+y^{2} > 0
      $$

      $$
      \operatorname{Re}\left(\frac{1}{z-1}\right) = \frac{x-1}{D},
      \qquad
      \operatorname{Im}\left(\frac{1}{z-1}\right) = \frac{-y}{D}
      $$

      **Ojo al signo de la parte imaginaria:** el conjugado lo cambia. Es
      $\frac{-y}{D}$, y de ahí que el segundo disco acabe por debajo del eje
      real.

      ### 3 · Primera condición

      $$
      \frac{x-1}{D} > \frac12
      $$

      Como $D>0$, multiplicar los dos miembros por $2D$ **no cambia el
      sentido** de la desigualdad —y esto hay que decirlo, es la hipótesis del
      paso—:

      $$
      2(x-1) > (x-1)^{2}+y^{2}
      $$

      $$
      0 > (x-1)^{2}-2(x-1)+y^{2} = x^{2}-4x+3+y^{2}
      $$

      $$
      (x-2)^{2}+y^{2} < 1
      $$

      **Disco abierto** de centro $(2,0)$ y radio 1.

      ### 4 · Segunda condición

      $$
      \frac{-y}{D} > \frac12
      \;\Longleftrightarrow\;
      -2y > (x-1)^{2}+y^{2}
      $$

      $$
      (x-1)^{2}+y^{2}+2y < 0
      \;\Longleftrightarrow\;
      (x-1)^{2}+(y+1)^{2} < 1
      $$

      **Disco abierto** de centro $(1,-1)$ y radio 1.

      ### 5 · La intersección

      ¿Se cortan? La distancia entre los centros es

      $$
      d = \sqrt{(2-1)^{2}+(0+1)^{2}} = \sqrt2 \approx 1{,}41
      $$

      menor que la suma de los radios, que es 2, y mayor que su diferencia, que
      es 0. Luego **se cortan** en dos puntos y la intersección es una
      **lente**.

      Los bordes no entran: las dos desigualdades son estrictas.

      ### 6 · El punto excluido

      $z=1$ está a distancia 1 del centro $(2,0)$ y a distancia 1 del centro
      $(1,-1)$: cae **sobre** las dos circunferencias. Como las desigualdades
      son estrictas, ya estaba fuera de la región y no hay que quitarlo aparte.

      Merece la pena escribirlo: comprobar dónde cae el punto excluido es lo que
      cierra bien el ejercicio, aunque el resultado sea que no añade nada.

      ### 7 · Representación gráfica

      Dos círculos de radio 1, uno centrado en $(2,0)$ y otro en $(1,-1)$, con
      la zona común sombreada y los bordes en trazo discontinuo por ser
      abiertos. La lente queda en el cuarto cuadrante, más o menos entre
      $x=1{,}2$ y $x=2$, con $y$ entre $-0{,}8$ y $0$.

      ### 8 · Comprobación

      Un punto de la lente, $(1{,}6,\,-0{,}5)$:

      - Primer disco: $(1{,}6-2)^{2}+0{,}25 = 0{,}41 < 1$ ✔
      - Segundo disco: $(0{,}6)^{2}+(0{,}5)^{2} = 0{,}61 < 1$ ✔

      Y en el enunciado original, con $D = 0{,}36+0{,}25 = 0{,}61$:

      $$
      \operatorname{Re} = \frac{0{,}6}{0{,}61} \approx 0{,}98 > 0{,}5 \;\checkmark
      \qquad
      \operatorname{Im} = \frac{0{,}5}{0{,}61} \approx 0{,}82 > 0{,}5 \;\checkmark
      $$

      Y uno que debe fallar: $(2,0)$, el centro del primer disco. Primer disco ✔,
      pero segundo: $(1)^{2}+(1)^{2} = 2 > 1$ ✗. Fuera, como debe — estar en un
      disco no basta.

      ### Resultado

      $$
      \boxed{\;(x-2)^{2}+y^{2} < 1 \quad\text{y}\quad (x-1)^{2}+(y+1)^{2} < 1\;}
      $$

  - id: ex1819-2-bicubica
    titulo: Una ecuación de grado seis que en realidad es de segundo
    fuente: >-
      Ejercicio 2 · Primera evaluación, 15 de octubre de 2018 · Cálculo
      (Industriales), UPV/EHU · Enunciado idéntico al ejercicio 1.11 del
      boletín del tema 1. El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 6
      comp4: 4

    nivel: examen
    enunciado: |
      Calcular y representar las soluciones de la ecuación

      $$
      z^{6}+7z^{3}-8 = 0,
      \qquad z \in \mathbb{C}
      $$
    pide: Calcular las seis soluciones y representarlas.

    pasos:
      - tipo: reconocer
        pregunta: |
          La ecuación es de grado 6. ¿Hay que resolver un polinomio de grado 6?
        opciones:
          - texto: >-
              No: solo aparecen $z^{6}$ y $z^{3}$, así que el cambio
              $w = z^{3}$ la convierte en una de segundo grado
            correcta: true
            mensaje: |
              Eso es. $z^{6} = \left(z^{3}\right)^{2}$, así que es una
              **bicúbica**: con $w=z^{3}$ queda $w^{2}+7w-8 = 0$, que se
              resuelve con la fórmula de siempre.
          - texto: Sí, y hay que buscar sus raíces por Ruffini
            mensaje: |
              Ruffini serviría para tantear raíces enteras, pero es dar un
              rodeo largo. El cambio de variable resuelve el ejercicio en dos
              líneas, y además garantiza que no se escapa ninguna solución.
          - texto: No, porque se puede sacar factor común $z^{3}$
            mensaje: |
              No se puede: el término $-8$ no tiene $z$. Sacar factor común
              $z^{3}$ dejaría $z^{3}(z^{3}+7)-8$, que no está factorizado.
          - texto: Sí, pero solo tiene tres soluciones reales
            mensaje: |
              El grado es 6, y en $\mathbb{C}$ eso significa **seis**
              soluciones. Reales solo hay dos, $1$ y $-2$, pero las otras cuatro
              existen igual.

      - tipo: calcular
        titulo: Las dos raíces auxiliares
        pregunta: |
          Con $w = z^{3}$, ¿cuáles son las dos soluciones de $w^{2}+7w-8=0$?
        respuesta:
          tipo: conjunto
          valor: 1, -8
          tolerancia: 0.01
          formato: los dos valores separados por una coma
        distractores:
          - valor: -1, 8
            mensaje: |
              Los dos signos cambiados. Sustituyendo,
              $(-1)^{2}+7(-1)-8 = 1-7-8 = -14 \neq 0$. Comprobar una raíz en la
              ecuación cuesta cinco segundos.
          - valor: 1, 8
            mensaje: |
              El producto de las raíces tiene que ser el término independiente,
              $-8$, y $1\cdot8 = 8$. Una de las dos tiene que ser negativa.
          - valor: 2, -4
            mensaje: |
              Su producto sí es $-8$, pero su suma es $-2$ y tendría que ser
              $-7$. Hacen falta las dos condiciones.
        pista: |
          $w = \frac{-7\pm\sqrt{49+32}}{2}$, y $\sqrt{81} = 9$.
        desarrollo: |
          $$
          w = \frac{-7\pm\sqrt{49+32}}{2} = \frac{-7\pm\sqrt{81}}{2}
          = \frac{-7\pm9}{2}
          $$

          $$
          w_1 = \frac{2}{2} = 1,
          \qquad
          w_2 = \frac{-16}{2} = -8
          $$

          Comprobación rápida: la suma tiene que ser $-7$ —y
          $1+(-8) = -7$ ✔— y el producto $-8$ —y $1\cdot(-8) = -8$ ✔—.
        veredicto: |
          Suma y producto son la comprobación más barata que existe para una
          ecuación de segundo grado. Merece la pena hacerla siempre.

      - tipo: calcular
        titulo: Cuántas soluciones tiene la ecuación original
        pregunta: |
          ¿Cuántos números complejos cumplen $z^{6}+7z^{3}-8=0$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 son las soluciones en $w$. Al deshacer el cambio, **cada una**
              da tres valores de $z$, porque $z^{3}=w$ tiene tres raíces
              cúbicas.
          - valor: '3'
            mensaje: |
              3 serían si solo hubiera un valor de $w$. Hay dos, y cada uno
              aporta tres.
          - valor: '12'
            mensaje: |
              12 sería $2\times6$. Cada $w$ aporta **tres** raíces cúbicas, no
              seis: $2\times3 = 6$, que además es el grado de la ecuación.
        pista: |
          Deshacer el cambio no es sacar una raíz cúbica: es resolver
          $z^{3}=w$, que tiene tres soluciones.
        desarrollo: |
          Deshacer el cambio **no** es escribir $z = \sqrt[3]{w}$ y quedarse con
          un número: es resolver $z^{3} = w$, que en $\mathbb{C}$ tiene
          **tres** soluciones para cada $w \neq 0$.

          Con dos valores de $w$, salen

          $$
          2 \times 3 = 6
          $$

          que es exactamente lo que garantiza el teorema fundamental del álgebra
          para un polinomio de grado 6.
        veredicto: |
          Si salieran menos de seis, faltaría alguna. Ese recuento es la
          comprobación estructural del ejercicio.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Como $z^{6} = \left(z^{3}\right)^{2}$, el cambio $w = z^{3}$
              convierte la ecuación en $w^{2}+7w-8 = 0$.
          - texto: |
              Sus soluciones son $w_1 = 1$ y $w_2 = -8$.
          - texto: |
              **$z^{3} = 1 = e^{i\,0^{\circ}}$:** módulo 1 y argumentos
              $0^{\circ}$, $120^{\circ}$, $240^{\circ}$.
          - texto: |
              **$z^{3} = -8 = 8e^{i\,180^{\circ}}$:** módulo $\sqrt[3]{8} = 2$ y
              argumentos $60^{\circ}$, $180^{\circ}$, $300^{\circ}$.
          - texto: |
              Seis soluciones en total, repartidas en **dos circunferencias
              concéntricas** de radios 1 y 2.
          - texto: |
              Deshaciendo el cambio, $z = \sqrt[3]{1} = 1$ y
              $z = \sqrt[3]{-8} = -2$.
            trampa: true
            mensaje: |
              Eso da dos soluciones de las seis. En $\mathbb{C}$, $z^{3}=w$ **no
              tiene una raíz cúbica, tiene tres**. Quedarse con la real es el
              error clásico de las ecuaciones con cambio de variable, y aquí
              cuesta cuatro sextos del ejercicio.
        veredicto: |
          El dibujo lo dice todo: dos triángulos equiláteros, uno en cada
          circunferencia, girados $60^{\circ}$ el uno respecto del otro.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** Resolver $z^{6}+7z^{3}-8 = 0$ en $\mathbb{C}$ y representar
      las soluciones.

      **Reparto de puntos del examen:** COMP2 6 · COMP4 4. **No se evalúa
      COMP1**, así que los cuatro puntos de explicación se los lleva justificar
      bien el cambio de variable y el recuento de soluciones.

      > Este enunciado es el **ejercicio 1.11 del boletín** del tema 1.

      ### 1 · La ecuación no es de sexto grado, es bicúbica

      Solo aparecen $z^{6}$ y $z^{3}$, y $z^{6} = \left(z^{3}\right)^{2}$. El
      cambio

      $$
      w = z^{3}
      $$

      la convierte en una ecuación de **segundo grado**:

      $$
      w^{2}+7w-8 = 0
      $$

      Y conviene decir por qué el cambio es lícito: es una aplicación
      **sobreyectiva** de $\mathbb{C}$ en $\mathbb{C}$, así que toda solución en
      $w$ procede de alguna $z$, y no se pierde ninguna.

      ### 2 · Resolución en $w$

      $$
      w = \frac{-7\pm\sqrt{49+32}}{2} = \frac{-7\pm9}{2}
      \;\Longrightarrow\;
      w_1 = 1, \quad w_2 = -8
      $$

      Comprobación gratis: la suma de las raíces debe ser $-7$ y el producto
      $-8$. Y $1+(-8) = -7$ ✔, $1\cdot(-8) = -8$ ✔.

      ### 3 · Deshacer el cambio: dos ecuaciones cúbicas

      Aquí está el paso que decide el ejercicio. Deshacer el cambio **no** es
      escribir $z = \sqrt[3]{w}$ y quedarse con un número: es resolver
      $z^{3} = w$, que en $\mathbb{C}$ tiene **tres** soluciones para cada $w$.

      **$z^{3} = 1 = e^{i\,0^{\circ}}$.** Módulo $\sqrt[3]{1} = 1$ y argumentos
      $\frac{0^{\circ}+360^{\circ}k}{3} = 0^{\circ},\,120^{\circ},\,240^{\circ}$:

      $$
      z = 1, \qquad z = -\frac12+\frac{\sqrt3}{2}i,
      \qquad z = -\frac12-\frac{\sqrt3}{2}i
      $$

      **$z^{3} = -8 = 8\,e^{i\,180^{\circ}}$.** Módulo $\sqrt[3]{8} = 2$ y
      argumentos $\frac{180^{\circ}+360^{\circ}k}{3} = 60^{\circ},\,180^{\circ},\,300^{\circ}$:

      $$
      z = 1+\sqrt3\,i, \qquad z = -2, \qquad z = 1-\sqrt3\,i
      $$

      ### 4 · Recuento

      Seis soluciones, que es exactamente lo que garantiza el **teorema
      fundamental del álgebra** para un polinomio de grado 6. Si salieran
      menos, faltaría alguna; si salieran más, habría una repetida.

      Y vienen en **pares conjugados**, como tiene que pasar en toda ecuación
      de coeficientes reales: $-\frac12\pm\frac{\sqrt3}{2}i$ y
      $1\pm\sqrt3\,i$, más las dos reales $1$ y $-2$.

      ### 5 · Representación gráfica

      Los seis afijos se reparten en **dos circunferencias concéntricas**:

      - Tres en la de radio 1, a $0^{\circ}$, $120^{\circ}$ y $240^{\circ}$.
      - Tres en la de radio 2, a $60^{\circ}$, $180^{\circ}$ y $300^{\circ}$.

      Cada terna es un triángulo equilátero, y uno está girado $60^{\circ}$
      respecto del otro, así que los seis puntos quedan **alternados**
      angularmente: uno de radio 1, uno de radio 2, uno de radio 1…

      ### 6 · Comprobación

      Con la solución real más cómoda, $z=-2$:

      $$
      z^{3} = -8, \qquad z^{6} = 64
      $$

      $$
      64+7(-8)-8 = 64-56-8 = 0 \quad\checkmark
      $$

      Con $z=1$: $1+7-8 = 0$ ✔

      Y con una compleja, $z = -\frac12+\frac{\sqrt3}{2}i$, que tiene módulo 1 y
      argumento $120^{\circ}$: su cubo tiene módulo 1 y argumento
      $360^{\circ} \equiv 0^{\circ}$, o sea $z^{3} = 1$, y entonces
      $z^{6} = 1$. Sustituyendo: $1+7-8 = 0$ ✔

      ### Resultado

      $$
      \boxed{\;z \in \left\{\,1,\; -\tfrac12+\tfrac{\sqrt3}{2}i,\;
      -\tfrac12-\tfrac{\sqrt3}{2}i,\; 1+\sqrt3\,i,\; -2,\; 1-\sqrt3\,i \,\right\}\;}
      $$

  - id: ex1819-3-definiciones-y-desigualdad
    titulo: Tres definiciones y la desigualdad que sobrevive al límite
    fuente: >-
      Ejercicio 3 · Primera evaluación, 15 de octubre de 2018 · Cálculo
      (Industriales), UPV/EHU · El apartado (a) es el ejercicio 2.2 del boletín
      y el (b) es el 2.5. El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 0
      comp4: 8

    nivel: examen
    enunciado: |
      **a)** Definir formalmente los siguientes conceptos: sucesión creciente,
      sucesión acotada, sucesión divergente hacia $-\infty$.

      **b)** Demostrar la siguiente propiedad. Sean $\{x_n\}_{n\in\mathbb{N}}$ e
      $\{y_n\}_{n\in\mathbb{N}}$ dos sucesiones tales que
      $x_n \le y_n \;\;\forall n \in \mathbb{N}$ y
      $\lim_{n\to\infty} x_n = x$, $\lim_{n\to\infty} y_n = y$. Entonces
      $x \le y$.
    pide: Definir los tres conceptos y demostrar la propiedad.

    pasos:
      - tipo: reconocer
        pregunta: |
          En la definición de «divergente hacia $-\infty$», ¿por qué importa el
          **orden** de los cuantificadores?
        opciones:
          - texto: >-
              Porque $n_0$ va después de $M$, y eso significa que **puede
              depender de $M$**
            correcta: true
            mensaje: |
              Eso es la mitad de la nota del apartado. Escribirlo al revés
              —«existe $n_0$ tal que para todo $M$…»— afirmaría que un mismo
              índice sirve para todas las cotas, que es falso: cuanto más
              exigente es $M$, más lejos hay que ir.
          - texto: No importa, el orden es una convención de escritura
            mensaje: |
              Importa y mucho. «Para todo $x$ existe $y$» y «existe $y$ para
              todo $x$» dicen cosas distintas, y una puede ser cierta y la otra
              falsa.
          - texto: Porque $M$ tiene que ser negativo
            mensaje: |
              $M$ recorre **todos** los reales. Lo que pasa es que la condición
              solo tiene contenido cuando $M$ es muy negativo; para $M$ positivo
              se cumple trivialmente.
          - texto: Porque así la definición es más corta
            mensaje: |
              Las dos versiones ocupan lo mismo. Lo que cambia es lo que
              significan.

      - tipo: calcular
        titulo: La definición, aplicada
        pregunta: |
          Para $a_n = -n^{2}$ y $M = -400$, ¿cuál es el menor $n_0$ tal que
          $a_n < M$ para todo $n>n_0$?
        respuesta:
          tipo: numero
          valor: '20'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '400'
            mensaje: |
              400 es $\left|M\right|$, no el índice. La condición es
              $-n^{2} < -400$, o sea $n^{2} > 400$: hay que sacar la raíz.
          - valor: '21'
            mensaje: |
              Casi. La condición $n>20$ se cumple ya en $n=21$, así que el menor
              $n_0$ **válido** es 20: el índice a partir del cual —excluido— se
              cumple siempre.
          - valor: '-20'
            mensaje: |
              Los índices de una sucesión son naturales. La raíz que interesa es
              la positiva.
        pista: |
          $a_n < M$ es $-n^{2} < -400$, es decir $n^{2} > 400$.
        desarrollo: |
          $$
          a_n < M \iff -n^{2} < -400 \iff n^{2} > 400 \iff n > 20
          $$

          La condición se cumple para todo $n>20$, así que el menor $n_0$ válido
          es

          $$
          n_0 = 20
          $$
        veredicto: |
          Con $M = -10\,000$ haría falta $n_0 = 100$. Por eso el cuantificador
          de $M$ va **antes**: el índice depende de la exigencia.

      - tipo: justificar
        pregunta: |
          Ordena la demostración del apartado (b). Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              Por reducción al absurdo, supongamos $x>y$, y sea
              $\varepsilon = \dfrac{x-y}{2} > 0$.
          - texto: |
              Existe $m_1$ tal que $x_n > x-\varepsilon = \dfrac{x+y}{2}$ para
              todo $n>m_1$.
          - texto: |
              Existe $m_2$ tal que $y_n < y+\varepsilon = \dfrac{x+y}{2}$ para
              todo $n>m_2$.
          - texto: |
              Para $n>\max(m_1,m_2)$ valen las dos, y entonces
              $y_n < \dfrac{x+y}{2} < x_n$, en contra de $x_n \le y_n$.
          - texto: |
              Contradicción, luego $x \le y$.
          - texto: |
              Se toma $\varepsilon = x-y$, la distancia entre los dos límites.
            trampa: true
            mensaje: |
              Con la distancia entera los dos entornos se **tocan** en el punto
              medio y la contradicción deja de ser estricta: podría ocurrir
              $x_n = y_n = \frac{x+y}{2}$, que no contradice $x_n \le y_n$. Hay
              que tomar la **mitad**, para que los entornos queden separados.
        veredicto: |
          Es el mismo épsilon de los ejercicios 2.3 a 2.6 del boletín y de otros
          tres exámenes de esta colección. Conviene tenerlo como reflejo.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** (a) Definir creciente, acotada y divergente hacia $-\infty$.
      (b) Demostrar que $x_n \le y_n$ y la convergencia de las dos implican
      $x \le y$.

      **Reparto de puntos del examen:** COMP1 2 · COMP4 8. **Ni un punto de
      cálculo.**

      > Los dos apartados están en el boletín del tema 2: el (a) es el
      > **ejercicio 2.2** y el (b) es el **2.5**. Los tres ejercicios de este
      > examen están en los boletines — el 1 es el 1.22 y el 2 es el 1.11 —, así
      > que esta convocatoria se podía haber respondido entera con ellos
      > delante.

      ### 1 · Apartado (a): las tres definiciones

      **Sucesión creciente.**

      $$
      \{a_n\} \text{ creciente} \iff a_{n+1} > a_n \quad \forall n \in \mathbb{N}
      $$

      Sin excepciones: basta un par consecutivo que falle para que deje de
      serlo.

      **Sucesión acotada.**

      $$
      \{a_n\} \text{ acotada} \iff
      \exists\, p,q \in \mathbb{R} \;:\; p \le a_n \le q \quad \forall n \in \mathbb{N}
      $$

      Las **dos** cotas. Con solo la de arriba se tiene «acotada
      superiormente», que es más débil: $a_n = -n^{2}$ la cumple y no está
      acotada. Equivalentemente:
      $\exists K>0 : \left|a_n\right| \le K$ para todo $n$.

      **Sucesión divergente hacia $-\infty$.**

      $$
      \lim a_n = -\infty \iff
      \forall M \in \mathbb{R} \;\exists\, n_0 \in \mathbb{N} \;:\;
      n>n_0 \Rightarrow a_n < M
      $$

      ### 2 · Lo que de verdad se evalúa en (a): el orden de los cuantificadores

      En la tercera definición, $n_0$ va **después** de $M$, y eso significa que
      puede depender de él. Escribirlo al revés diría que un mismo índice sirve
      para todas las cotas, que es falso.

      Se ve con un ejemplo, y conviene ponerlo: para $a_n = -n^{2}$,

      | $M$ | menor $n_0$ que sirve |
      |---|---|
      | $-100$ | $10$ |
      | $-400$ | $20$ |
      | $-10\,000$ | $100$ |

      El índice **crece con la exigencia**. Ningún $n_0$ fijo vale para todos
      los $M$.

      Y el contraste entre las tres definiciones, que es lo que las une: las dos
      primeras hablan de **todos** los términos; la tercera, solo de los que hay
      a partir de cierto punto. Es la misma diferencia que separa la monotonía
      de la convergencia.

      ### 3 · Apartado (b): estrategia

      Reducción al absurdo. La negación de $x \le y$ es $x>y$, y de esa
      diferencia positiva sale el épsilon.

      ### 4 · Apartado (b): la demostración

      Supongamos $x>y$ y tomemos

      $$
      \varepsilon = \frac{x-y}{2} > 0
      $$

      Por converger $\{x_n\}$, existe $m_1$ tal que para todo $n>m_1$

      $$
      \left|x_n-x\right| < \varepsilon
      \;\Longrightarrow\;
      x_n > x-\varepsilon = \frac{x+y}{2}
      $$

      Por converger $\{y_n\}$, existe $m_2$ tal que para todo $n>m_2$

      $$
      \left|y_n-y\right| < \varepsilon
      \;\Longrightarrow\;
      y_n < y+\varepsilon = \frac{x+y}{2}
      $$

      Sea $n > \max(m_1,m_2)$: **las dos valen a la vez**, y encadenando

      $$
      y_n < \frac{x+y}{2} < x_n
      $$

      es decir $y_n < x_n$, en contra de la hipótesis. Contradicción, luego
      $x \le y$. $\blacksquare$

      ### 5 · Los dos detalles que valen la nota

      **Por qué la mitad y no la distancia entera.** Con
      $\varepsilon = x-y$ los dos entornos se tocarían en el punto medio y
      podría darse $x_n = y_n$, que no contradice $x_n \le y_n$. Con la mitad
      los entornos quedan **disjuntos** y el choque es limpio.

      **El máximo de los dos índices.** Cada sucesión aporta su propio $m$ y no
      tienen por qué coincidir. Sin el máximo no se sabe que las dos
      desigualdades valen en el **mismo** $n$, y sin eso no se pueden encadenar.

      ### 6 · La desigualdad se debilita

      Aunque la hipótesis fuera estricta, $x_n < y_n$, la conclusión seguiría
      siendo $x \le y$ y no $x<y$. Contraejemplo inmediato:

      $$
      x_n = 0, \qquad y_n = \frac1n
      $$

      cumplen $x_n < y_n$ para todo $n$ y sus límites son iguales, los dos 0.

      ### 7 · Comprobación

      **De (a)**, aplicando las tres definiciones a $a_n = -n^{2}$:

      | definición | ¿la cumple? | por qué |
      |---|---|---|
      | creciente | no | $a_2 = -4 < -1 = a_1$ |
      | acotada | no | no hay cota inferior |
      | divergente a $-\infty$ | sí | dado $M$, basta $n_0 = \lceil\sqrt{\lvert M\rvert}\rceil$ |

      **De (b)**, con $x=5$ e $y=2$: tomando $x_n = 5-\frac4n$ e
      $y_n = 2+\frac4n$, la desigualdad $x_n \le y_n$ se cumple en $n=1,2$ y se
      rompe a partir de $n=3$. Y con $\varepsilon = 1{,}5$ salen
      $m_1 = m_2 = 2$: el cruce aparece justo en $n>\max(m_1,m_2) = 2$ ✔

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \text{(a) } & \text{creciente: } a_{n+1}>a_n\ \forall n;\quad
      \text{acotada: } \exists p,q : p \le a_n \le q\ \forall n; \\
      & \text{divergente a } -\infty:\ \forall M\ \exists n_0 :
      n>n_0 \Rightarrow a_n<M \\[6pt]
      \text{(b) } & x_n \le y_n\ \forall n,\ x_n \to x,\ y_n \to y
      \;\Longrightarrow\; x \le y
      \end{aligned}}
      $$
