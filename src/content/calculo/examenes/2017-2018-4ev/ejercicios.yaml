        consigna: |
          Dibuja el sólido $S$ en perspectiva y su corte por el plano $XZ$. Marca
          las tres superficies que lo limitan.
        comprueba:
          - punto: |
              El cilindro de radio $1$ con eje $OZ$, como pared lateral.
            porque: |
              $x^{2}+y^{2}\le1$ acota el sólido en horizontal. Sin él, el
              paraboloide llegaría hasta $r=\sqrt5$.
          - punto: |
              El paraboloide $z=5-x^{2}-y^{2}$ como techo, que baja de $5$ en el
              eje a $4$ en la pared.
            porque: |
              El recorte del cilindro deja solo la parte de arriba del
              paraboloide, donde apenas ha empezado a caer. Es casi una tapa
              plana, y eso es lo que el dibujo tiene que enseñar.
          - punto: |
              El plano $z=0$ como base, con el disco de radio $1$.
            porque: |
              Como el techo nunca baja de $4$, el sólido es macizo desde el
              suelo: un cilindro con la tapa ligeramente abombada.
          - punto: |
              La superficie en **tres** piezas: base plana, lateral cilíndrico y
              tapa parabólica.
            porque: |
              El apartado (c) pide el área total, y son tres integrales de
              naturaleza distinta. Olvidar la base —de área $\pi$— es el error
              más repetido.
        veredicto: |
          En el corte por $XZ$ el perfil es casi un rectángulo: de $z=0$ a $z=4$
          en la pared y hasta $5$ en el eje. Esa forma casi cilíndrica da un
          control del volumen: tiene que salir algo más de $4\pi$.

    resolucion: |
      **a) El sólido.** Un cilindro de radio 1 con la tapa abombada: el
      paraboloide $z=5-\rho^{2}$ lo corona, y como en $\rho=1$ vale 4, **la
      tapa nunca baja al suelo**. El sólido tiene tres caras: la base plana, la
      pared vertical y la cúpula.

      **b) El volumen:**

      $$
      V = \int_{0}^{2\pi}\!\!\int_{0}^{1}\bigl(5-\rho^{2}\bigr)\rho\;d\rho\,d\theta
      = 2\pi\left(\frac52-\frac14\right)
      = \boxed{\frac{9\pi}{2}\approx 14{,}14}
      $$

      **c) El área**, que son **tres** trozos y ahí está la dificultad:

      | trozo | cálculo | valor |
      |---|---|---|
      | base, disco de radio 1 | $\pi R^{2}$ | $\pi \approx 3{,}14$ |
      | pared, cilindro de altura 4 | $2\pi R h$ | $8\pi \approx 25{,}13$ |
      | tapa, casquete del paraboloide | $\displaystyle\int_{0}^{2\pi}\!\!\int_{0}^{1}\sqrt{1+4\rho^{2}}\,\rho\,d\rho\,d\theta$ | $\frac{\pi}{6}\bigl(5\sqrt5-1\bigr)\approx 5{,}33$ |

      $$
      \boxed{\;A = 9\pi + \frac{\pi}{6}\bigl(5\sqrt5-1\bigr) \approx 33{,}60\;}
      $$

      > **La pared lateral es el trozo grande y es el que se olvida.** Vale
      > $8\pi$, casi las tres cuartas partes del total, y no aparece si das por
      > hecho que el paraboloide cierra el sólido contra el suelo. La
      > comprobación que lo evita cuesta una línea: **evalúa la tapa en el borde
      > del recinto** y mira si llega a cero. Aquí vale 4, así que hay pared.
