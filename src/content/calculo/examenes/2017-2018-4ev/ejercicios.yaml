ejercicios:
  - id: ex1718-4ev-1-limite-y-direccional
    titulo: Un límite que no existe y una derivada direccional
    fuente: >-
      Ejercicio 1 · Cuarta evaluación (segundo cuatrimestral), 12 de marzo de
      2018 · Cálculo, UPV/EHU · Sus dos apartados son los ejercicios 6.4 y 6.7
      del boletín de problemas complementarios, que publica las soluciones.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 4
      comp4: 4
    enunciado: |
      a) Estudiar la existencia de límite de la función
      $z = \dfrac{xy}{x^{2}+y^{2}}$ en el punto $(0,0)$.

      b) Calcular la derivada direccional de $z = x^{2}\,\text{sen}\,2y$ cuando
      nos dirigimos del punto $P = \left(1,\frac{\pi}{2}\right)$ al punto
      $Q = \left(4,\frac{\pi}{2}-4\right)$.
    pide: Si el límite existe, y el valor de la derivada direccional.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado b) dice «nos dirigimos **del** punto $P$ **al** punto
          $Q$». ¿Cuál es el vector dirección?
        opciones:
          - texto: Q menos P, y después hay que normalizarlo
            correcta: true
            mensaje: |
              Las dos cosas, y en ese orden. Restar al revés cambia el signo del
              resultado, y no normalizar lo multiplica por el módulo.
          - texto: P menos Q
            mensaje: |
              Eso apunta de $Q$ hacia $P$, al revés de lo que dice el enunciado,
              y da el resultado con el signo cambiado.
          - texto: El propio punto Q, tratado como vector
            mensaje: |
              Solo valdría si $P$ fuera el origen. Aquí $P=(1,\pi/2)$, así que el
              desplazamiento es la diferencia.
      - tipo: calcular
        titulo: El módulo del vector PQ
        pregunta: |
          $\vec{PQ} = Q - P = (3,\,-4)$. ¿Cuánto mide?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '7'
            mensaje: |
              Has sumado los valores absolutos. El módulo es
              $\sqrt{3^{2}+(-4)^{2}} = \sqrt{25}$.
          - valor: '1'
            mensaje: |
              1 sería $3-4$. El módulo no resta componentes: eleva al cuadrado,
              suma y saca la raíz.
        pista: |
          $\sqrt{9+16}$. Es el triángulo 3-4-5.
        desarrollo: |
          $$
          Q-P = \left(4-1,\; \tfrac{\pi}{2}-4-\tfrac{\pi}{2}\right) = (3,\,-4)
          $$

          $$
          \lVert\vec{PQ}\rVert = \sqrt{9+16} = 5
          $$

          **Fíjate en que los $\pi/2$ se cancelan**: el enunciado los pone para
          que la segunda componente salga exactamente $-4$ y el vector sea el
          3-4-5 de siempre. Sin calculadora, eso no es casualidad.
      - tipo: calcular
        titulo: La derivada direccional
        pregunta: |
          Con $\nabla z\left(1,\frac{\pi}{2}\right) = (0,\,-2)$ y el unitario
          $\left(\frac35,-\frac45\right)$, ¿cuánto vale la derivada direccional?
        respuesta:
          tipo: numero
          valor: '1.6'
          tolerancia: 0.01
          formato: en forma exacta (8/5) o con un decimal
        distractores:
          - valor: '-1.6'
            mensaje: |
              Signo cambiado. $(-2)\cdot(-\frac45) = +\frac85$: los dos negativos
              se cancelan.
          - valor: '8'
            mensaje: |
              8 es el producto escalar **sin** normalizar: $(0,-2)\cdot(3,-4)=8$.
              Falta dividir entre el módulo 5.
        pista: |
          $(0)(3/5) + (-2)(-4/5)$. Los dos negativos suman.
        desarrollo: |
          $$
          z_x = 2x\,\text{sen}\,2y \;\Longrightarrow\; z_x\left(1,\tfrac{\pi}{2}\right) = 2\,\text{sen}\,\pi = 0
          $$

          $$
          z_y = 2x^{2}\cos 2y \;\Longrightarrow\; z_y\left(1,\tfrac{\pi}{2}\right) = 2\cos\pi = -2
          $$

          $$
          D_{\vec u}z = (0,-2)\cdot\left(\tfrac35,-\tfrac45\right) = \frac85 = 1{,}6
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta del apartado a). Una pieza es falsa.
        piezas:
          - texto: 'Nos acercamos por rectas $y=mx$ y sustituimos en $\dfrac{xy}{x^{2}+y^{2}}$.'
          - texto: 'Simplificando el $x^{2}$ queda $\dfrac{m}{1+m^{2}}$, que depende de la recta.'
          - texto: 'Con $m=0$ vale 0 y con $m=1$ vale $1/2$: dos valores distintos.'
          - texto: 'Luego el límite **no existe**.'
          - texto: 'La función no está definida en $(0,0)$, y por eso el límite no existe.'
            trampa: true
            mensaje: |
              No estar definida en el punto es lo normal en estos ejercicios y no
              impide que el límite exista: el límite habla de lo que pasa
              **cerca**, no en el punto. Lo que lo impide aquí es que dos caminos
              den valores distintos.
    resolucion: |
      **a) El límite no existe**, y se demuestra con dos caminos.

      Acercándose por rectas $y=mx$:

      $$
      \frac{x\cdot mx}{x^{2}+m^{2}x^{2}} = \frac{m}{1+m^{2}}
      $$

      **Queda la $m$**, así que el valor depende de por dónde vengas. Con dos
      números concretos:

      | camino | valor |
      |---|---|
      | $y=0$ | $0$ |
      | $y=x$ | $1/2$ |

      Como $0\neq 1/2$, el límite no existe.

      **b) La derivada direccional.**

      $$
      \vec{PQ} = Q-P = (3,-4),
      \qquad
      \lVert\vec{PQ}\rVert = 5,
      \qquad
      \vec u = \left(\tfrac35,-\tfrac45\right)
      $$

      El gradiente de $z = x^{2}\,\text{sen}\,2y$ en $P\left(1,\frac{\pi}{2}\right)$:

      $$
      \nabla z = \bigl(2x\,\text{sen}\,2y,\; 2x^{2}\cos 2y\bigr)
      \;\Longrightarrow\;
      \nabla z\left(1,\tfrac{\pi}{2}\right) = (0,\,-2)
      $$

      porque $\text{sen}\,\pi = 0$ y $\cos\pi = -1$.

      $$
      \boxed{\;D_{\vec u}z = (0,-2)\cdot\left(\tfrac35,-\tfrac45\right) = \frac85 = 1{,}6\;}
      $$

      > **El control de siempre:** $\lVert\nabla z\rVert = 2$, y sale $1{,}6 < 2$.
      > ✓ Y es positivo, así que en esa dirección la función crece — coherente
      > con que el gradiente apunte hacia abajo y el desplazamiento también.

  - id: ex1718-4ev-2-centro-del-cuarto-de-elipse
    titulo: El centro de gravedad de un cuarto de elipse
    fuente: >-
      Ejercicio 2 · Cuarta evaluación (segundo cuatrimestral), 12 de marzo de
      2018 · Cálculo, UPV/EHU · Es el ejercicio 7.20 del boletín de problemas
      complementarios. Su hoja de soluciones tiene una errata en este
      ejercicio: ver la nota al final de la resolución.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Sea $D$ el recinto limitado por las condiciones
      $\dfrac{x^{2}}{4}+y^{2}\le 1$, $x\ge 0$, $y\ge 0$. Calcular las
      coordenadas del centro de gravedad del recinto $D$, suponiendo que la
      densidad en cada punto es $k$.
    pide: Las coordenadas del centro de gravedad.
    pasos:
      - tipo: reconocer
        pregunta: |
          El recinto es un cuarto de elipse de semiejes 2 y 1. ¿Qué cambio de
          variable conviene?
        opciones:
          - texto: Polares generalizadas, con los semiejes dentro del cambio
            correcta: true
            mensaje: |
              Sí: con $x=2\rho\cos\theta$ e $y=\rho\,\text{sen}\,\theta$ la elipse
              se convierte en $\rho\le 1$ y el jacobiano es $ab\rho = 2\rho$.
          - texto: Polares normales
            mensaje: |
              Dejarían la condición como
              $\rho^{2}\left(\frac{\cos^{2}\theta}{4}+\text{sen}^{2}\theta\right)\le 1$,
              que no simplifica nada. Las generalizadas existen justo para esto.
          - texto: Ninguno, se hace en cartesianas
            mensaje: |
              Se puede, con el límite $y\le\sqrt{1-x^{2}/4}$, pero los momentos
              salen bastante más largos.
      - tipo: calcular
        titulo: El área del recinto
        pregunta: |
          Un cuarto de elipse de semiejes 2 y 1 tiene área $\pi ab/4$. ¿Cuánto
          vale?
        respuesta:
          tipo: numero
          valor: '1.5708'
          tolerancia: 0.01
          formato: en forma exacta (pi/2) o con cuatro decimales
        distractores:
          - valor: '6.2832'
            mensaje: |
              $2\pi$ es la elipse **entera** ($\pi ab$ con $a=2$, $b=1$). El
              recinto es un cuarto.
          - valor: '0.7854'
            mensaje: |
              $\pi/4$ sería el cuarto de un círculo de radio 1. Aquí el semieje
              $x$ mide 2, así que el área es el doble.
        pista: |
          $\pi \cdot 2 \cdot 1 / 4 = \pi/2$.
        desarrollo: |
          $$
          A = \frac{\pi ab}{4} = \frac{\pi\cdot 2\cdot 1}{4} = \frac{\pi}{2} \approx 1{,}571
          $$
      - tipo: calcular
        titulo: La segunda coordenada del centro
        pregunta: |
          El momento respecto del eje $X$ vale $\frac{2}{3}$. Con área
          $\frac{\pi}{2}$, ¿cuánto vale $\overline{y}$?
        respuesta:
          tipo: numero
          valor: '0.4244'
          tolerancia: 0.005
          formato: en forma exacta (4/3pi) o con cuatro decimales
        distractores:
          - valor: '0.8488'
            mensaje: |
              $8/(3\pi)$ es la **primera** coordenada, no esta — y es también lo
              que dice, por error, la hoja de soluciones del boletín. El momento
              en $y$ vale la mitad que el momento en $x$, así que $\overline{y}$
              es la mitad de $\overline{x}$.
          - valor: '0.6667'
            mensaje: |
              $2/3$ es el **momento**, no la coordenada. Falta dividir entre el
              área $\pi/2$.
        pista: |
          $(2/3)$ dividido entre $(\pi/2)$, que es $4/(3\pi)$.
        desarrollo: |
          $$
          \overline{y} = \frac{2/3}{\pi/2} = \frac{4}{3\pi} \approx 0{,}424
          $$

          Y la primera es el doble, $\overline{x} = 8/(3\pi) \approx 0{,}849$,
          porque su momento vale $4/3$ en vez de $2/3$.
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Con $x=2\rho\cos\theta$, $y=\rho\,\text{sen}\,\theta$ y $J=2\rho$, el recinto es $\rho\in[0,1]$, $\theta\in[0,\pi/2]$.'
          - texto: 'La masa es $k\pi/2$ y los momentos $4k/3$ y $2k/3$.'
          - texto: 'Luego $\overline{x} = 8/(3\pi)$ y $\overline{y} = 4/(3\pi)$.'
          - texto: 'La densidad $k$ se cancela: con densidad constante el centro es geométrico.'
          - texto: 'Las dos coordenadas coinciden, porque el recinto es simétrico respecto de la bisectriz.'
            trampa: true
            mensaje: |
              El recinto **no** es simétrico respecto de $y=x$: se extiende hasta
              $x=2$ pero solo hasta $y=1$. Coincidirían si fuera un cuarto de
              **círculo**. Y esta pieza es justo lo que dice, por error, la hoja
              de soluciones del boletín.
    resolucion: |
      **El cambio.** Polares generalizadas con los semiejes dentro:

      $$
      x = 2\rho\cos\theta,
      \qquad
      y = \rho\,\text{sen}\,\theta,
      \qquad
      J = ab\rho = 2\rho
      $$

      y el recinto pasa a ser el rectángulo $\rho\in[0,1]$,
      $\theta\in\left[0,\frac{\pi}{2}\right]$.

      **La masa:**

      $$
      M = k\int_{0}^{\pi/2}\!\!\int_{0}^{1} 2\rho\;d\rho\,d\theta = \frac{\pi k}{2}
      $$

      **Los dos momentos**, que **no** son iguales:

      $$
      \iint_D x\,dA = \int_{0}^{\pi/2}\!\!\int_{0}^{1}(2\rho\cos\theta)(2\rho)\,d\rho\,d\theta = \frac43
      $$

      $$
      \iint_D y\,dA = \int_{0}^{\pi/2}\!\!\int_{0}^{1}(\rho\,\text{sen}\,\theta)(2\rho)\,d\rho\,d\theta = \frac23
      $$

      El primero lleva un 2 de más, el que viene del semieje $a=2$ metido en la
      $x$.

      $$
      \boxed{\;G = \left(\frac{8}{3\pi},\ \frac{4}{3\pi}\right) \approx (0{,}849;\ 0{,}424)\;}
      $$

      > ### La hoja de soluciones del boletín tiene una errata aquí
      >
      > Da **las dos coordenadas iguales a $8/(3\pi)$**. La primera lo es; la
      > segunda no. Se puede comprobar por tres caminos independientes:
      >
      > 1. **La fórmula del centroide** de un cuarto de elipse de semiejes $a$ y
      >    $b$ es $\left(\frac{4a}{3\pi},\frac{4b}{3\pi}\right)$; con $a=2$,
      >    $b=1$ da $\left(\frac{8}{3\pi},\frac{4}{3\pi}\right)$.
      > 2. **Por escala.** Un cuarto de círculo de radio 1 tiene su centro en
      >    $\left(\frac{4}{3\pi},\frac{4}{3\pi}\right)$; esta elipse es ese
      >    cuarto estirado al doble **solo en $x$**, así que solo la primera
      >    coordenada se duplica.
      > 3. **Los momentos de arriba**, $4/3$ y $2/3$: uno el doble del otro.
      >
      > Si te sale $0{,}42$ y el boletín dice $0{,}85$, **el que está bien eres
      > tú**.

  - id: ex1718-4ev-3-paraboloide-dentro-del-cilindro
    titulo: El paraboloide recortado por un cilindro
    fuente: >-
      Ejercicio 3 · Cuarta evaluación (segundo cuatrimestral), 12 de marzo de
      2018 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Sea $S$ el sólido limitado por las condiciones $z\le 5-x^{2}-y^{2}$,
      $x^{2}+y^{2}\le 1$, $z\ge 0$.

      a) Dibujar el sólido $S$.
      b) Calcular el volumen de $S$.
      c) Calcular el área de $S$.
    pide: El dibujo, el volumen y el área de la superficie.
    pasos:
      - tipo: reconocer
        pregunta: |
          Dentro del cilindro $\rho\le 1$, ¿llega el paraboloide a tocar el
          plano $z=0$?
        opciones:
          - texto: 'No: en el borde del cilindro todavía vale 4'
            correcta: true
            mensaje: |
              Exacto, y eso cambia la forma del sólido. Como
              $5-\rho^{2}\ge 4$ para $\rho\le 1$, la tapa nunca baja al suelo:
              el sólido tiene **pared lateral vertical**.
          - texto: Sí, en el borde del cilindro
            mensaje: |
              En $\rho=1$ el paraboloide vale $5-1=4$, no 0. Tocaría el suelo en
              $\rho=\sqrt5$, bastante más allá del cilindro.
          - texto: Sí, en el centro
            mensaje: |
              En el centro es donde más alto está: $z=5$. El paraboloide abre
              hacia abajo.
      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Integrando $\int_{0}^{2\pi}\!\int_{0}^{1}(5-\rho^{2})\rho\,d\rho\,d\theta$,
          ¿cuánto vale el volumen?
        respuesta:
          tipo: numero
          valor: '14.1372'
          tolerancia: 0.03
          formato: en forma exacta (9pi/2) o con cuatro decimales
        distractores:
          - valor: '15.708'
            mensaje: |
              $5\pi$ sería el cilindro de radio 1 y altura 5, o sea sin
              descontar lo que le quita el paraboloide al curvarse.
          - valor: '12.566'
            mensaje: |
              $4\pi$ es el cilindro hasta la altura 4, la del borde. Falta el
              casquete que sobresale por el centro.
        pista: |
          $2\pi(5/2 - 1/4) = 2\pi \cdot 9/4 = 9\pi/2$.
        desarrollo: |
          $$
          V = 2\pi\int_{0}^{1}\bigl(5\rho-\rho^{3}\bigr)d\rho
          = 2\pi\left(\frac52-\frac14\right) = \frac{9\pi}{2} \approx 14{,}14
          $$

          **Entre $4\pi$ y $5\pi$**, como tenía que ser: más que el cilindro
          hasta la altura mínima de la tapa, menos que hasta la máxima.
      - tipo: justificar
        pregunta: |
          Ordena el apartado c). Una pieza es falsa.
        piezas:
          - texto: 'La superficie tiene **tres** trozos: la base, la pared lateral y la tapa curva.'
          - texto: 'La base es el disco de radio 1 en $z=0$: área $\pi$.'
          - texto: 'La pared es el cilindro $\rho=1$ desde $z=0$ hasta $z=4$: área $2\pi\cdot 1\cdot 4 = 8\pi$.'
          - texto: 'La tapa es el casquete del paraboloide: $\frac{\pi}{6}\bigl(5\sqrt5-1\bigr)$.'
          - texto: 'No hay pared lateral, porque la tapa del paraboloide llega hasta el suelo.'
            trampa: true
            mensaje: |
              No llega: en $\rho=1$ el paraboloide está a altura 4. Entre esa
              altura y el suelo hay una **pared cilíndrica vertical**, y es el
              trozo más grande de los tres — $8\pi$ de los $33{,}6$ totales.
              Olvidarlo es perder tres cuartas partes del apartado.
    resolucion: |
      **a) El sólido.** Un cilindro de radio 1 con la tapa abombada: el
      paraboloide $z=5-\rho^{2}$ lo corona, y como en $\rho=1$ vale 4, **la
      tapa nunca baja al suelo**. El sólido tiene tres caras: la base plana, la
      pared vertical y la cúpula.

      **b) El volumen:**

      $$
      V = \int_{0}^{2\pi}\!\!\int_{0}^{1}\bigl(5-\rho^{2}\bigr)\rho\;d\rho\,d\theta
      = 2\pi\left(\frac52-\frac14\right)
      = \boxed{\frac{9\pi}{2}\approx 14{,}14}
      $$

      **c) El área**, que son **tres** trozos y ahí está la dificultad:

      | trozo | cálculo | valor |
      |---|---|---|
      | base, disco de radio 1 | $\pi R^{2}$ | $\pi \approx 3{,}14$ |
      | pared, cilindro de altura 4 | $2\pi R h$ | $8\pi \approx 25{,}13$ |
      | tapa, casquete del paraboloide | $\displaystyle\int_{0}^{2\pi}\!\!\int_{0}^{1}\sqrt{1+4\rho^{2}}\,\rho\,d\rho\,d\theta$ | $\frac{\pi}{6}\bigl(5\sqrt5-1\bigr)\approx 5{,}33$ |

      $$
      \boxed{\;A = 9\pi + \frac{\pi}{6}\bigl(5\sqrt5-1\bigr) \approx 33{,}60\;}
      $$

      > **La pared lateral es el trozo grande y es el que se olvida.** Vale
      > $8\pi$, casi las tres cuartas partes del total, y no aparece si das por
      > hecho que el paraboloide cierra el sólido contra el suelo. La
      > comprobación que lo evita cuesta una línea: **evalúa la tapa en el borde
      > del recinto** y mira si llega a cero. Aquí vale 4, así que hay pared.
