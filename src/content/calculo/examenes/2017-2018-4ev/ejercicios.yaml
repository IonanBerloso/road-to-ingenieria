                .f-ex1718-cilindro-c { stroke: var(--d1); stroke-width: 2.8; fill: none; }
                .f-ex1718-cilindro-c2 { stroke: var(--alt); stroke-width: 2.8; fill: none; }
                .f-ex1718-cilindro-cp { stroke: var(--d1); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
                .f-ex1718-cilindro-cp2 { stroke: var(--alt); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
                .f-ex1718-cilindro-g { stroke: var(--faint); stroke-width: 1.1; fill: none; stroke-dasharray: 3 3; }
                .f-ex1718-cilindro-fue { stroke: var(--faint); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
                .f-ex1718-cilindro-f { fill: var(--live); fill-opacity: .12; stroke: none; }
                .f-ex1718-cilindro-f2 { fill: var(--alt); fill-opacity: .12; stroke: none; }
                .f-ex1718-cilindro-pt { fill: var(--live); }
