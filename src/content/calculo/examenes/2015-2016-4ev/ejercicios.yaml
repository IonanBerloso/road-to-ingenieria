ejercicios:
  - id: ex1516-4ev-1-paraboloide-y-su-centro
    titulo: El paraboloide, su centro de gravedad y su área
    fuente: >-
      Ejercicio 1 · Cuarta evaluación (segundo cuatrimestral), 4 de abril de
      2016 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3
    enunciado: |
      Sea $S$ el sólido limitado por las condiciones $x^{2}+y^{2}\le 1-z$,
      $z\ge 0$, siendo la densidad en cada punto $(x,y,z)$ constante.

      a) Dibujar el sólido $S$.
      b) Calcular el centro de gravedad de $S$.
      c) Calcular el área de $S$.
    pide: El dibujo, el centro de gravedad y el área de la superficie.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué se puede decir del centro de gravedad antes de integrar nada?
        opciones:
          - texto: Que está sobre el eje Z, porque el sólido es de revolución
            correcta: true
            mensaje: |
              Sí, y eso ahorra dos de las tres coordenadas. Decirlo justificado
              —«por simetría de revolución alrededor del eje $Z$»— es respuesta
              completa para $\overline{x}$ y $\overline{y}$.
          - texto: Que está en el origen
            mensaje: |
              El origen es el centro de la base, el punto más ancho. La masa se
              reparte hacia arriba, así que el centro sube.
          - texto: Que está a media altura, en z = 1/2
            mensaje: |
              Sería así si el sólido fuera un cilindro. Este se estrecha al
              subir, así que el centro queda **por debajo** de la media altura.
      - tipo: calcular
        titulo: El volumen
        pregunta: |
          El sólido es el paraboloide $z = 1-\rho^{2}$ sobre el disco unidad.
          ¿Cuánto vale su volumen?
        respuesta:
          tipo: numero
          valor: '1.5708'
          tolerancia: 0.01
          formato: en forma exacta (pi/2) o con cuatro decimales
        distractores:
          - valor: '3.1416'
            mensaje: |
              $\pi$ sería el cilindro de radio 1 y altura 1. El paraboloide se
              estrecha, así que ocupa menos: exactamente la mitad.
          - valor: '1.0472'
            mensaje: |
              $\pi/3$ es el volumen de un **cono** de radio 1 y altura 1. El
              paraboloide es más gordo que el cono.
        pista: |
          $2\pi(1/2 - 1/4) = \pi/2$.
        desarrollo: |
          $$
          V = \int_{0}^{2\pi}\!\!\int_{0}^{1}\bigl(1-\rho^{2}\bigr)\rho\;d\rho\,d\theta
          = 2\pi\left(\frac12-\frac14\right) = \frac{\pi}{2}
          $$

          **La mitad del cilindro que lo contiene**, que es un hecho conocido de
          los paraboloides de revolución y sirve de comprobación.
      - tipo: calcular
        titulo: La altura del centro de gravedad
        pregunta: |
          El momento respecto del plano $XY$ vale $\frac{\pi}{6}$. Con volumen
          $\frac{\pi}{2}$, ¿a qué altura está el centro?
        respuesta:
          tipo: numero
          valor: '0.3333'
          tolerancia: 0.005
          formato: en forma exacta (1/3) o con cuatro decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              $1/2$ sería la media altura, y valdría para un cilindro. Este
              sólido se estrecha hacia arriba, así que el centro queda más bajo.
          - valor: '0.6667'
            mensaje: |
              $2/3$ es lo que saldría si la masa se acumulara arriba. Aquí pasa
              lo contrario: la base es la parte ancha.
        pista: |
          $(\pi/6)$ dividido entre $(\pi/2)$.
        desarrollo: |
          $$
          \overline{z} = \frac{\pi/6}{\pi/2} = \frac13
          $$

          **Por debajo de la media altura**, como corresponde a un sólido que se
          estrecha al subir.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'a) Es un paraboloide de revolución boca abajo, con la base en el disco unidad y el vértice en $(0,0,1)$.'
          - texto: 'b) Por simetría de revolución, $\overline{x}=\overline{y}=0$.'
          - texto: 'b) Con $V=\pi/2$ y momento $\pi/6$, el centro está en $(0,0,1/3)$.'
          - texto: 'c) El área son **dos** trozos: la base plana y la superficie curva.'
          - texto: 'c) El área es solo la del paraboloide, porque la base no forma parte de la superficie del sólido.'
            trampa: true
            mensaje: |
              Sí forma parte: el sólido está limitado por abajo por el plano
              $z=0$, y ese disco es una de sus caras. Dejarlo fuera pierde
              $\pi$ de los $8{,}47$ del total.
    resolucion: |
      **a) El sólido.** El paraboloide $z=1-\rho^{2}$ boca abajo, apoyado en el
      disco unidad y con el vértice en $(0,0,1)$. Como en $\rho=1$ la tapa vale
      0, el paraboloide **sí** cierra contra el suelo: no hay pared lateral.

      **b) El centro de gravedad.**

      **La simetría primero:** el sólido es de revolución alrededor del eje $Z$,
      así que

      $$
      \overline{x} = \overline{y} = 0
      $$

      **El volumen:**

      $$
      V = 2\pi\int_{0}^{1}\bigl(1-\rho^{2}\bigr)\rho\,d\rho = \frac{\pi}{2}
      $$

      **El momento respecto del plano $XY$:**

      $$
      \int z\,dV = 2\pi\int_{0}^{1}\!\!\int_{0}^{1-\rho^{2}}\! z\;dz\;\rho\,d\rho
      = \pi\int_{0}^{1}\bigl(1-\rho^{2}\bigr)^{2}\rho\,d\rho = \frac{\pi}{6}
      $$

      $$
      \boxed{\;G = \left(0,\ 0,\ \tfrac13\right)\;}
      $$

      **c) El área**, que son **dos** trozos:

      | trozo | valor |
      |---|---|
      | base, disco de radio 1 | $\pi \approx 3{,}14$ |
      | tapa, casquete del paraboloide | $\frac{\pi}{6}\bigl(5\sqrt5-1\bigr)\approx 5{,}33$ |

      $$
      \boxed{\;A = \pi + \frac{\pi}{6}\bigl(5\sqrt5-1\bigr) \approx 8{,}47\;}
      $$

      > **Dos comprobaciones que caben en el margen.** El volumen es
      > **exactamente la mitad** del cilindro que lo contiene ($\pi\cdot1^{2}\cdot1$),
      > que es un hecho conocido de los paraboloides de revolución. Y el centro
      > está a $1/3$ de la altura, por debajo de la media: coherente con un
      > sólido cuya parte ancha es la de abajo.
      >
      > Compáralo con el cono, cuyo centroide está a $1/4$ de la altura: el
      > paraboloide es más «gordo» arriba que el cono, y por eso su centro queda
      > más alto.

  - id: ex1516-4ev-2-dos-gradientes-encadenados
    titulo: Dos gradientes que no se calculan derivando a secas
    fuente: >-
      Ejercicio 2 · Cuarta evaluación (segundo cuatrimestral), 4 de abril de
      2016 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 3
      comp2: 3
      comp4: 4
    enunciado: |
      Calcular los gradientes de las siguientes funciones:

      a) $f(x,y) = \displaystyle\int_{x}^{y}\cos\bigl(t^{2}\bigr)\,dt$

      b) $z = f\left(x,\;\dfrac{x}{y}\right)$
    pide: El gradiente de cada una de las dos funciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          COMP1 vale 3 puntos de 10 y COMP2 solo 3. ¿Qué anuncia ese reparto?
        opciones:
          - texto: Que lo difícil es reconocer qué herramienta toca en cada apartado
            correcta: true
            mensaje: |
              Exacto. Ninguno de los dos se deriva «a secas»: el a) pide el
              teorema fundamental del cálculo y el b) la regla de la cadena. Una
              vez reconocido, el cálculo es corto.
          - texto: Que hay que hacer integrales largas
            mensaje: |
              Justo lo contrario: la integral de $\cos(t^{2})$ **no tiene
              primitiva elemental**, y el ejercicio existe para que veas que no
              hace falta calcularla.
          - texto: Que hay que dibujar las funciones
            mensaje: |
              No se puede: la $f$ del apartado b) es genérica, no se da su
              fórmula. Y eso es justo la pista de que se resuelve con la cadena.
      - tipo: calcular
        titulo: La derivada respecto del límite inferior
        pregunta: |
          Para $f(x,y)=\int_{x}^{y}\cos(t^{2})dt$, el teorema fundamental da
          $f_y = \cos(y^{2})$. ¿Cuánto vale $f_x$ en $x=0$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Falta el signo. Derivar respecto del límite **inferior** cambia el
              signo: $f_x = -\cos(x^{2})$, y en $x=0$ eso es $-1$.
          - valor: '0'
            mensaje: |
              0 sería $\text{sen}(0)$. Aquí la derivada es el integrando
              evaluado en el límite, y $\cos(0)=1$.
        pista: |
          $f_x = -\cos(x^2)$, y $\cos 0 = 1$.
        desarrollo: |
          $$
          f_x = -\cos\bigl(x^{2}\bigr) \;\Longrightarrow\; f_x(0,y) = -1
          $$

          **El signo menos viene de que $x$ es el límite de abajo.** Cambiando
          el orden, $\int_x^y = -\int_y^x$, y de ahí sale.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta del apartado b). Una pieza es falsa.
        piezas:
          - texto: 'Se llama $u=x$ y $v=x/y$, así que $z = f(u,v)$ y hay que usar la regla de la cadena.'
          - texto: 'Derivando en $x$: $z_x = f_u\cdot 1 + f_v\cdot\frac{1}{y}$.'
          - texto: 'Derivando en $y$: $z_y = f_u\cdot 0 + f_v\cdot\left(-\frac{x}{y^{2}}\right)$.'
          - texto: 'Luego $\nabla z = \left(f_u + \frac{f_v}{y},\; -\frac{x}{y^{2}}f_v\right)$.'
          - texto: 'Como no se conoce la fórmula de $f$, el apartado no se puede resolver.'
            trampa: true
            mensaje: |
              Sí se puede, y ese es el punto: la respuesta se deja **en función
              de $f_u$ y $f_v$**. La regla de la cadena no necesita saber quién
              es $f$, solo cómo se compone.
    resolucion: |
      **Los dos apartados tienen truco, y el mismo:** ninguno se deriva
      aplicando reglas a una fórmula. COMP1 vale 3 puntos por eso.

      **a) Un gradiente con una integral dentro.**

      La primitiva de $\cos(t^{2})$ **no es elemental** —es la integral de
      Fresnel— así que calcular la integral es imposible. Y no hace falta: el
      teorema fundamental del cálculo derivada un integral respecto de sus
      límites sin resolverla.

      $$
      f(x,y) = \int_{x}^{y}\cos\bigl(t^{2}\bigr)dt
      $$

      | derivada | valor | por qué |
      |---|---|---|
      | $f_y$ | $\cos\bigl(y^{2}\bigr)$ | límite superior: el integrando evaluado ahí |
      | $f_x$ | $-\cos\bigl(x^{2}\bigr)$ | límite inferior: lo mismo, con signo cambiado |

      $$
      \boxed{\;\nabla f = \Bigl(-\cos\bigl(x^{2}\bigr),\;\cos\bigl(y^{2}\bigr)\Bigr)\;}
      $$

      **b) Un gradiente de una composición.**

      Aquí $f$ es **genérica**: no se da su fórmula. Llamando $u=x$ y
      $v=\dfrac{x}{y}$, la regla de la cadena da

      $$
      z_x = f_u\frac{\partial u}{\partial x} + f_v\frac{\partial v}{\partial x}
      = f_u + \frac{f_v}{y}
      $$

      $$
      z_y = f_u\frac{\partial u}{\partial y} + f_v\frac{\partial v}{\partial y}
      = 0 - \frac{x}{y^{2}}f_v
      $$

      $$
      \boxed{\;\nabla z = \left(f_u + \frac{f_v}{y},\;\; -\frac{x}{y^{2}}\,f_v\right)\;}
      $$

      > **La respuesta queda en función de $f_u$ y $f_v$, y eso es correcto.**
      > No es una respuesta a medias: la regla de la cadena dice cómo se
      > propagan las derivadas de una composición **sea cual sea** la función de
      > dentro. Buscar «la fórmula de $f$» es el error del apartado, y en un
      > examen se traduce en dejarlo en blanco.
      >
      > Fíjate también en que $u=x$ hace que $\partial u/\partial y = 0$: la
      > primera variable de $f$ no depende de $y$, y por eso el segundo
      > gradiente solo lleva $f_v$.
