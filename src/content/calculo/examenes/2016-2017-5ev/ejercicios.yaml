ejercicios:
  - id: ex1617-5ev-1-el-paracaidista-y-su-velocidad-limite
    titulo: El paracaidista, y por qué la constante no vale como solución particular
    fuente: >-
      Ejercicio 1 · Quinta evaluación, SEGUNDO CUATRIMESTRAL, 8 de mayo de 2017 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 4
      comp4: 4
    enunciado: |
      Un paracaidista se lanza desde un avión y empieza a acelerar hasta
      alcanzar una velocidad constante. Esta velocidad límite es conocida como
      «velocidad terminal». La altura del paracaidista en cada momento $y(t)$
      cumple la EDO $my''(t)+ky'(t)=mg$ siendo $m$ la masa del paracaidista, $k$
      una constante relacionada con el rozamiento con el aire y $g$ la
      aceleración de la gravedad.

      a) Calcular la solución general de la EDO $my''(t)+ky'(t)=mg$ con los
      siguientes datos: $m=50\ \text{kg}$, $k=10\ \text{kg}/\text{s}$ y
      $g=10\ \text{m}/\text{s}^{2}$.

      b) Calcular la velocidad límite (velocidad terminal) que alcanzará el
      paracaidista en su caída libre.
    pide: La solución general de la ecuación y la velocidad terminal.

    pasos:
      - tipo: reconocer
        pregunta: |
          Con los datos, la ecuación es $50y''+10y'=500$. El segundo miembro es
          una constante. ¿Cómo se busca la solución particular?
        opciones:
          - texto: >-
              Con $y_{p}=At$, porque $r=0$ es raíz de la característica y una
              constante ya está dentro de la homogénea
            correcta: true
            mensaje: |
              Exacto. Es el mismo fenómeno de resonancia de siempre: cuando el
              segundo miembro es del tipo que ya resuelve la homogénea, hay que
              multiplicar por $t$. Aquí una constante es solución de la
              homogénea —la $C_{1}$—, así que la particular tiene que ser
              $y_{p}=At$.
          - texto: >-
              Con $y_{p}=A$ constante, que es lo que pide un segundo miembro
              constante
            mensaje: |
              Pruébalo: si $y_{p}=A$, entonces $y_{p}'=y_{p}''=0$ y la ecuación
              diría $0=500$. Imposible. Que no salga nada es justamente la señal
              de la resonancia.
          - texto: >-
              No hace falta particular: es homogénea de coeficientes constantes y
              basta con la característica
            mensaje: |
              El segundo miembro es $mg=500$, que no es cero: la ecuación es
              completa. Con solo la homogénea, $y=C_{1}+C_{2}e^{-t/5}$, la
              velocidad tendería a cero en vez de a la velocidad terminal, que
              es justo lo contrario de lo que describe el enunciado.

      - tipo: calcular
        titulo: La raíz que no es cero
        pregunta: |
          De la ecuación característica $r^{2}+\frac{k}{m}r=0$, ¿cuánto vale la
          raíz distinta de cero?
        respuesta:
          tipo: numero
          valor: '-0.2'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.2'
            mensaje: |
              Signo. De $r\left(r+\frac{k}{m}\right)=0$ sale
              $r=-\frac{k}{m}$, negativa. Y tiene que serlo: si fuera positiva la
              exponencial crecería y no habría velocidad límite ninguna.
          - valor: '-5'
            mensaje: |
              Has puesto $-\frac{m}{k}$. La ecuación es $my''+ky'=mg$; al
              dividir entre $m$ queda $y''+\frac{k}{m}y'=g$, así que lo que
              acompaña a $r$ es $\frac{k}{m}=\frac{10}{50}$.
        pista: |
          Divide la ecuación entre $m$ y saca factor común $r$.
        desarrollo: |
          $$
          50r^{2}+10r=0
          \;\Longrightarrow\;
          r\left(50r+10\right)=0
          \;\Longrightarrow\;
          r=0
          \quad\text{o}\quad
          r=-\frac{10}{50}=-\frac{1}{5}=-0{,}2
          $$

          Con lo que $y_{h}=C_{1}+C_{2}e^{-t/5}$.

      - tipo: calcular
        titulo: La velocidad terminal
        pregunta: |
          ¿A qué velocidad, en metros por segundo, tiende el paracaidista?
        respuesta:
          tipo: numero
          valor: '50'
          tolerancia: 0.001
          formato: un número en metros por segundo
        distractores:
          - valor: '500'
            mensaje: |
              Ese es $mg$, el segundo miembro entero de la ecuación. La velocidad
              límite es $\frac{mg}{k}$: hay que dividir todavía entre la
              constante de rozamiento.
          - valor: '10'
            mensaje: |
              Ese es $g$. La gravedad es la aceleración con la que empieza a
              caer, no la velocidad a la que acaba: el rozamiento la frena hasta
              que $y''=0$.
          - valor: '0.2'
            mensaje: |
              Eso es $\frac{k}{m}$, el exponente de la exponencial. Dice **cómo
              de rápido** se alcanza la velocidad límite, no cuál es.
        pista: |
          Deriva la solución general y haz $t\to\infty$; o, más corto, impón
          $y''=0$ en la ecuación.
        desarrollo: |
          La solución general es $y(t)=C_{1}+C_{2}e^{-t/5}+50t$, así que

          $$
          y'(t)=-\frac{C_{2}}{5}e^{-t/5}+50
          \;\xrightarrow[\;t\to\infty\;]{}\;50\ \text{m}/\text{s}
          $$

          Y el atajo, que además explica de dónde sale: en régimen la velocidad
          ya no cambia, $y''=0$, y la ecuación queda $ky'=mg$, es decir
          $y'=\dfrac{mg}{k}=\dfrac{50\cdot 10}{10}=50$ m/s.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $m=50$, $k=10$ y $g=10$ la ecuación es $50y''+10y'=500$, o sea
              $y''+\frac{1}{5}y'=10$.
          - texto: >-
              La característica $r^{2}+\frac{1}{5}r=0$ tiene raíces $r=0$ y
              $r=-\frac{1}{5}$, luego $y_{h}=C_{1}+C_{2}e^{-t/5}$.
          - texto: >-
              Como $r=0$ es raíz, el término constante resuena: la particular hay
              que buscarla de la forma $y_{p}=At$, y sustituyendo sale
              $\frac{1}{5}A=10$, es decir $A=50$.
          - texto: >-
              La solución general es
              $y(t)=C_{1}+C_{2}e^{-t/5}+50t$.
          - texto: >-
              Derivando, $y'(t)=-\frac{C_{2}}{5}e^{-t/5}+50$, y la exponencial se
              apaga: la velocidad límite es $50$ m/s, sean cuales sean las
              constantes.
          - texto: >-
              La velocidad límite es el límite de $y(t)$ cuando $t\to\infty$.
            trampa: true
            mensaje: |
              $y(t)$ es la **altura**, y su límite no es finito: el término
              $50t$ crece sin parar. La velocidad es $y'(t)$, y es esa la que se
              estabiliza. Que la altura crezca sin límite y la velocidad no es
              precisamente lo que significa «velocidad terminal».

    resolucion: |
      **La ecuación, con los números puestos.** $m=50$, $k=10$, $g=10$:

      $$
      50y''+10y'=500
      \qquad\Longleftrightarrow\qquad
      y''+\frac{1}{5}y'=10
      $$

      **La homogénea.** $r^{2}+\frac15r=0$ da $r\left(r+\frac15\right)=0$, con
      raíces $r=0$ y $r=-\frac15$. Por tanto

      $$
      y_{h}(t)=C_{1}+C_{2}e^{-t/5}
      $$

      **La particular, y la resonancia.** El segundo miembro es la constante
      $10$. Lo natural sería probar $y_{p}=A$, pero entonces $y_{p}'=y_{p}''=0$
      y la ecuación diría $0=10$. El motivo es que las constantes **ya son**
      solución de la homogénea: ahí está la $C_{1}$. Se multiplica por $t$:

      $$
      y_{p}=At
      \;\Longrightarrow\;
      y_{p}'=A,\quad y_{p}''=0
      \;\Longrightarrow\;
      \frac{1}{5}A=10
      \;\Longrightarrow\;
      A=50
      $$

      **La solución general.**

      $$
      y(t)=C_{1}+C_{2}e^{-t/5}+50t
      $$

      **La velocidad terminal.** Derivando,
      $y'(t)=-\frac{C_{2}}{5}e^{-t/5}+50$. La exponencial tiende a cero, así que

      $$
      \lim_{t\to\infty}y'(t)=50\ \text{m}/\text{s}
      $$

      y no depende de las constantes, es decir, ni de la altura del avión ni de
      la velocidad con la que salte.

      **El atajo que da el mismo número.** Velocidad límite significa velocidad
      que ya no cambia, o sea $y''=0$. Puesto eso en la ecuación original queda
      $ky'=mg$, de donde $y'=\frac{mg}{k}=50$ m/s. Sirve de comprobación y, en un
      examen, de red de seguridad: si la solución general estuviera mal, este
      cálculo de dos líneas no lo estaría.

  - id: ex1617-5ev-2-el-cuarto-de-disco-por-dos-caminos
    titulo: La misma integral por Green y a pelo
    fuente: >-
      Ejercicio 2 · Quinta evaluación, SEGUNDO CUATRIMESTRAL, 8 de mayo de 2017 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3
    enunciado: |
      Calcular de dos formas distintas la integral curvilínea

      $$
      \oint_{L}\left(x^{3}-x^{2}y\right)dx+xy^{2}\,dy
      $$

      donde $L$ es la frontera del recinto limitado por
      $y\le\sqrt{1-x^{2}}$; $0\le x\le 1$; $y\ge 0$.
    pide: El valor de la integral, calculado por dos caminos distintos.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué recinto describen las tres condiciones, y qué tiene de cómodo
          para Green?
        opciones:
          - texto: >-
              El cuarto de disco unidad del primer cuadrante; y
              $Q_{x}-P_{y}=x^{2}+y^{2}$, que en polares es $r^{2}$
            correcta: true
            mensaje: |
              Eso es. $y\le\sqrt{1-x^{2}}$ con $y\ge 0$ es el interior del disco
              por encima del eje, y $0\le x\le 1$ se queda con la mitad derecha.
              Y la combinación que pide Green sale $x^{2}+y^{2}$, que en polares
              es lo más fácil que puede salir.
          - texto: >-
              El cuadrado $[0,1]\times[0,1]$ menos el cuarto de disco
            mensaje: |
              Eso sería $y\ge\sqrt{1-x^{2}}$. La desigualdad del enunciado va al
              revés: $y$ **por debajo** del arco, es decir dentro del disco.
          - texto: >-
              El semicírculo superior de radio 1
            mensaje: |
              Te falta usar $0\le x\le 1$, que recorta la mitad izquierda. Con
              las tres condiciones a la vez queda un cuarto, no la mitad.

      - tipo: calcular
        titulo: Por Green
        pregunta: |
          Aplicando el teorema de Green, ¿cuánto vale la integral?
        respuesta:
          tipo: numero
          valor: '0.3926991'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.5235988'
            mensaje: |
              Te has dejado el jacobiano. En polares $dA=r\,dr\,d\theta$, así que
              lo que se integra es $r^{2}\cdot r=r^{3}$ y no $r^{2}$. Con el $r$
              puesto sale $\frac{\pi}{2}\cdot\frac14$ y no
              $\frac{\pi}{2}\cdot\frac13$.
          - valor: '0.7853982'
            mensaje: |
              Has barrido medio disco: $\theta$ de $0$ a $\pi$. El recinto es el
              cuarto del primer cuadrante, así que $\theta$ va de $0$ a
              $\frac{\pi}{2}$.
          - valor: '0.25'
            mensaje: |
              Ese es el trozo de la integral directa que aporta el segmento del
              eje $x$. Por Green no hay tramos: se integra $x^{2}+y^{2}$ sobre el
              recinto entero de una vez.
        pista: |
          $Q_{x}-P_{y}=y^{2}+x^{2}$, y en polares el recinto es
          $0\le r\le 1$, $0\le\theta\le\frac{\pi}{2}$.
        desarrollo: |
          $$
          Q_{x}-P_{y}=\frac{\partial}{\partial x}\left(xy^{2}\right)
          -\frac{\partial}{\partial y}\left(x^{3}-x^{2}y\right)
          =y^{2}-\left(-x^{2}\right)=x^{2}+y^{2}
          $$

          $$
          \iint_{D}\left(x^{2}+y^{2}\right)dA
          =\int_{0}^{\pi/2}\!\!\int_{0}^{1}r^{2}\cdot r\,dr\,d\theta
          =\frac{\pi}{2}\cdot\frac{1}{4}=\frac{\pi}{8}\approx 0{,}3927
          $$

      - tipo: calcular
        titulo: El arco, por el camino directo
        pregunta: |
          Por el camino directo hay tres tramos. ¿Cuánto aporta el arco de
          circunferencia, recorrido de $(1,0)$ a $(0,1)$?
        respuesta:
          tipo: numero
          valor: '0.1426991'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.6426991'
            mensaje: |
              Signo en el primer sumando. Con $x=\cos t$ es $dx=-\operatorname{sen}t\,dt$,
              así que $x^{3}dx=-\cos^{3}t\operatorname{sen}t\,dt$ aporta
              $-\frac14$, no $+\frac14$.
          - valor: '0.3926991'
            mensaje: |
              Ese es el valor de la integral **entera**, no el del arco. El arco
              aporta $\frac{\pi}{8}-\frac14$; el $\frac14$ que falta lo pone el
              segmento del eje $x$.
          - valor: '-0.25'
            mensaje: |
              Solo has calculado el trozo
              $\int_{0}^{\pi/2}\left(-\cos^{3}t\operatorname{sen}t\right)dt=-\frac14$.
              Falta el otro, $\int_{0}^{\pi/2}2\cos^{2}t\operatorname{sen}^{2}t\,dt=\frac{\pi}{8}$.
        pista: |
          Parametriza $x=\cos t$, $y=\operatorname{sen}t$ con $t$ de $0$ a
          $\frac{\pi}{2}$, y agrupa antes de integrar.
        desarrollo: |
          Con $x=\cos t$, $y=\operatorname{sen}t$,
          $dx=-\operatorname{sen}t\,dt$, $dy=\cos t\,dt$:

          $$
          \left(x^{3}-x^{2}y\right)dx+xy^{2}dy
          =\left(-\cos^{3}t\operatorname{sen}t
          +\cos^{2}t\operatorname{sen}^{2}t
          +\cos^{2}t\operatorname{sen}^{2}t\right)dt
          $$

          $$
          \int_{0}^{\pi/2}\left(-\cos^{3}t\operatorname{sen}t\right)dt
          =\left[\frac{\cos^{4}t}{4}\right]_{0}^{\pi/2}=-\frac{1}{4}
          $$

          $$
          \int_{0}^{\pi/2}2\cos^{2}t\operatorname{sen}^{2}t\,dt
          =\int_{0}^{\pi/2}\frac{\operatorname{sen}^{2}2t}{2}\,dt=\frac{\pi}{8}
          $$

          El arco aporta, en total, $\dfrac{\pi}{8}-\dfrac14\approx 0{,}1427$.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El recinto es el cuarto de disco unidad del primer cuadrante, y su
              frontera $L$ son tres tramos: el segmento del eje $x$, el arco y el
              segmento del eje $y$.
          - texto: >-
              **Primera forma.** $Q_{x}-P_{y}=x^{2}+y^{2}$, y en polares
              $\iint_{D}r^{2}\cdot r\,dr\,d\theta=\frac{\pi}{2}\cdot\frac14=\frac{\pi}{8}$.
          - texto: >-
              **Segunda forma.** Sobre el eje $x$, con $y=0$ y $dy=0$, queda
              $\int_{0}^{1}x^{3}dx=\frac14$.
          - texto: >-
              Sobre el eje $y$, con $x=0$ y $dx=0$, el integrando es
              $xy^{2}dy=0$: ese tramo no aporta nada.
          - texto: >-
              Sobre el arco, parametrizando con $x=\cos t$ e
              $y=\operatorname{sen}t$, sale $-\frac14+\frac{\pi}{8}$, y la suma de
              los tres tramos es $\frac{\pi}{8}$, igual que por Green.
          - texto: >-
              El símbolo $\oint$ no dice en qué sentido se recorre $L$, así que
              el signo del resultado es indiferente.
            trampa: true
            mensaje: |
              Sí lo dice: $\oint$ sobre una curva cerrada plana significa sentido
              **positivo**, el que deja la región a la izquierda. Y el signo no es
              indiferente en absoluto: al revés saldría $-\frac{\pi}{8}$. Es más,
              si no se fija el sentido, el teorema de Green ni siquiera se puede
              enunciar.

    resolucion: |
      **El recinto.** $y\ge 0$ e $y\le\sqrt{1-x^{2}}$ dejan el semidisco
      superior, y $0\le x\le 1$ recorta la mitad derecha: es el cuarto de disco
      unidad del primer cuadrante. Su frontera son tres tramos, y recorrida en
      sentido positivo van así: el segmento del eje $x$ de $(0,0)$ a $(1,0)$, el
      arco de $(1,0)$ a $(0,1)$, y el segmento del eje $y$ de $(0,1)$ a $(0,0)$.

      **Primera forma: Green.** Con $P=x^{3}-x^{2}y$ y $Q=xy^{2}$,

      $$
      \frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}
      =y^{2}+x^{2}
      $$

      que en polares es $r^{2}$. Entonces

      $$
      \oint_{L}=\int_{0}^{\pi/2}\!\!\int_{0}^{1}r^{2}\cdot r\,dr\,d\theta
      =\frac{\pi}{2}\cdot\frac{1}{4}=\frac{\pi}{8}
      $$

      **Segunda forma: los tres tramos.**

      Sobre el eje $x$ es $y=0$ y $dy=0$, así que solo sobrevive $x^{3}dx$:

      $$
      \int_{0}^{1}x^{3}\,dx=\frac{1}{4}
      $$

      Sobre el eje $y$ es $x=0$ y $dx=0$, y lo único que quedaría es
      $xy^{2}dy$, que con $x=0$ vale cero. Ese tramo **no aporta nada**, y darse
      cuenta ahorra la mitad del trabajo.

      Sobre el arco, con $x=\cos t$, $y=\operatorname{sen}t$ y $t$ de $0$ a
      $\frac{\pi}{2}$:

      $$
      \int_{0}^{\pi/2}\left(-\cos^{3}t\operatorname{sen}t
      +2\cos^{2}t\operatorname{sen}^{2}t\right)dt
      =-\frac{1}{4}+\frac{\pi}{8}
      $$

      Sumando los tres: $\frac14+\left(-\frac14+\frac{\pi}{8}\right)+0
      =\frac{\pi}{8}$.

      **Las dos formas coinciden**, que es lo que pedía el enunciado. Y la
      comparación enseña algo: por Green se hace en tres líneas y por el camino
      directo en quince. Cuando la curva es cerrada y las derivadas cruzadas
      salen limpias, Green no es una alternativa, es el camino.
