ejercicios:
  - id: ex1920-1-apolonio-con-raiz-cubica
    titulo: Una razón que hay que calcular antes de usarla
    fuente: >-
      Ejercicio 1 · Primera evaluación, 14 de octubre de 2019 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3

    enunciado: |
      Sean $z_1, z_2, z_3 \in \mathbb{C}$ donde $z_1 = 3+i$, $z_2 = -3+i$ y
      $z_3$ es la raíz imaginaria pura de $\sqrt[3]{8i}$. Calcular y
      representar geométricamente los afijos de los números complejos $z$ que
      verifican la condición siguiente:

      $$
      \left|\frac{z-z_1}{z-z_2}\right| = \left|4i+z_3\right|
      $$
    pide: Calcular el lugar geométrico y representarlo.

    pasos:
      - tipo: reconocer
        pregunta: |
          $\sqrt[3]{8i}$ tiene tres valores. ¿Cómo se elige el que pide el
          enunciado?
        opciones:
          - texto: >-
              Calculando los tres y quedándose con el que tiene parte real
              nula: el **imaginario puro**
            correcta: true
            mensaje: |
              Eso es. Los tres argumentos son $30^{\circ}$, $150^{\circ}$ y
              $270^{\circ}$, y solo el de $270^{\circ}$ cae sobre el eje
              imaginario. El enunciado usa esa condición para desambiguar la
              raíz, que si no sería multivaluada.
          - texto: Tomando siempre la raíz principal, la de menor argumento
            mensaje: |
              La principal es la de $30^{\circ}$, que vale $\sqrt3+i$: tiene
              parte real y no es imaginaria pura. El enunciado no pide la
              principal, pide **la imaginaria pura**, y por eso lo dice.
          - texto: Las tres valen, y salen tres lugares geométricos
            mensaje: |
              Saldrían tres si el enunciado no desambiguara, y por eso
              desambigua. «La raíz imaginaria pura» selecciona una sola.
          - texto: Elevando $8i$ al cubo
            mensaje: |
              Eso es lo contrario de lo que se pide. Hay que sacar la raíz
              cúbica, no elevar: $\sqrt[3]{8i}$ tiene módulo
              $\sqrt[3]{8} = 2$, no $8^{3}$.

      - tipo: calcular
        titulo: La razón del cociente
        pregunta: |
          ¿Cuánto vale $\left|4i+z_3\right|$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '6'
            mensaje: |
              6 sale de tomar $z_3 = +2i$ en vez de $-2i$: $\left|4i+2i\right|
              = 6$. Pero la raíz de argumento $270^{\circ}$ es $-2i$, no $2i$.
          - valor: '4'
            mensaje: |
              4 es $\left|4i\right|$, olvidando sumar $z_3$. Hay que sumar antes
              de tomar el módulo.
          - valor: '2.8284271'
            mensaje: |
              $2\sqrt2$ saldría de $\left|2+2i\right|$ o similar. Aquí los dos
              sumandos son imaginarios puros, así que se suman los coeficientes
              directamente: $4i-2i = 2i$.
        pista: |
          Halla primero $z_3$. Las tres raíces cúbicas de $8i$ tienen módulo 2 y
          argumentos $30^{\circ}$, $150^{\circ}$ y $270^{\circ}$.
        desarrollo: |
          **La raíz.** $8i = 8\,e^{i\,90^{\circ}}$, así que sus tres raíces
          cúbicas tienen módulo $\sqrt[3]{8} = 2$ y argumentos

          $$
          \frac{90^{\circ}+360^{\circ}k}{3} = 30^{\circ},\; 150^{\circ},\;
          270^{\circ}
          $$

          $$
          2e^{i30^{\circ}} = \sqrt3+i,
          \qquad
          2e^{i150^{\circ}} = -\sqrt3+i,
          \qquad
          2e^{i270^{\circ}} = -2i
          $$

          La imaginaria pura es la tercera: $z_3 = -2i$.

          **La razón.**

          $$
          \left|4i+z_3\right| = \left|4i-2i\right| = \left|2i\right| = 2
          $$
        veredicto: |
          Toda la primera parte del ejercicio existe para que la razón no venga
          dada. Si sale 6 en vez de 2, el lugar geométrico entero cambia.

      - tipo: verificar
        pregunta: |
          Escribe la región —aquí, la curva— en $x$ e $y$. Se comparan los
          puntos, así que vale cualquier forma equivalente.
        condicion: '(x+5)^2 + (y-1)^2 <= 16'
        ventana:
          x: [-11, 2]
          y: [-4.5, 6.5]
        formato: por ejemplo (x+5)^2 + (y-1)^2 <= 16
        pista: |
          Eleva al cuadrado $\left|z-z_1\right| = 2\left|z-z_2\right|$ y
          completa cuadrados. Escribe el **disco** que encierra, con
          «$\le$», para poder compararlo.
        desarrollo: |
          Con $z = x+iy$, $z_1 = 3+i$ y $z_2 = -3+i$, elevando al cuadrado:

          $$
          (x-3)^{2}+(y-1)^{2} = 4\left[(x+3)^{2}+(y-1)^{2}\right]
          $$

          Llamando $u = y-1$ para no arrastrarlo:

          $$
          x^{2}-6x+9+u^{2} = 4x^{2}+24x+36+4u^{2}
          $$

          $$
          0 = 3x^{2}+30x+27+3u^{2}
          \;\Longleftrightarrow\;
          0 = x^{2}+10x+9+u^{2}
          $$

          Completando el cuadrado, $x^{2}+10x = (x+5)^{2}-25$:

          $$
          (x+5)^{2}+(y-1)^{2} = 16
          $$

          **Circunferencia de centro $(-5,1)$ y radio 4.**
        veredicto: |
          El lugar es la circunferencia —la igualdad—, no el disco. Aquí se
          compara el disco solo porque una curva no tiene área que superponer;
          en el examen hay que dar la igualdad.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Las tres raíces cúbicas de $8i$ tienen módulo 2 y argumentos
              $30^{\circ}$, $150^{\circ}$ y $270^{\circ}$; la imaginaria pura es
              $z_3 = -2i$.
          - texto: |
              Por tanto la razón del enunciado vale
              $\left|4i-2i\right| = 2$, y la condición es
              $\left|z-z_1\right| = 2\left|z-z_2\right|$.
          - texto: |
              Un cociente de distancias constante y **distinto de 1** define una
              circunferencia de Apolonio.
          - texto: |
              Elevando al cuadrado y completando cuadrados sale
              $(x+5)^{2}+(y-1)^{2} = 16$: centro $(-5,1)$ y radio 4.
          - texto: |
              Los dos puntos de referencia, $3+i$ y $-3+i$, quedan **fuera** de
              la circunferencia y alineados con su centro, sobre la recta
              $y=1$.
          - texto: |
              Como la razón vale 2 y no 1, el lugar es la mediatriz del
              segmento que une $z_1$ y $z_2$.
            trampa: true
            mensaje: |
              Es al revés: la mediatriz aparece **cuando la razón vale 1**,
              porque entonces los términos cuadráticos se cancelan y queda una
              recta. Con razón 2 no se cancelan y sale una circunferencia. Aquí
              la mediatriz sería el eje imaginario, que no tiene nada que ver
              con la solución.
        veredicto: |
          El punto más cercano a $z_2 = -3+i$ y el más lejano de él están los
          dos en la circunferencia, y esa es la seña de Apolonio: encierra al
          punto del denominador.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** $z_1 = 3+i$, $z_2 = -3+i$, $z_3$ la raíz imaginaria pura de
      $\sqrt[3]{8i}$. Se pide el lugar de los $z$ con
      $\left|\frac{z-z_1}{z-z_2}\right| = \left|4i+z_3\right|$.

      **Reparto de puntos del examen:** COMP1 1 · COMP2 6 · COMP4 3.

      ### 1 · La razón no viene dada: hay que calcularla

      Lo primero del ejercicio no es el lugar geométrico, es **el número de la
      derecha**. Y para saberlo hace falta $z_3$.

      $8i$ en polar es $8\,e^{i\,90^{\circ}}$. Sus tres raíces cúbicas tienen

      $$
      \left|z\right| = \sqrt[3]{8} = 2,
      \qquad
      \theta_k = \frac{90^{\circ}+360^{\circ}k}{3} = 30^{\circ}+120^{\circ}k
      $$

      es decir $30^{\circ}$, $150^{\circ}$ y $270^{\circ}$:

      $$
      2e^{i30^{\circ}} = \sqrt3+i,
      \qquad
      2e^{i150^{\circ}} = -\sqrt3+i,
      \qquad
      2e^{i270^{\circ}} = -2i
      $$

      Solo la tercera es **imaginaria pura**, que es la que el enunciado
      selecciona:

      $$
      z_3 = -2i
      $$

      Ese adjetivo del enunciado no es adorno: sin él la raíz cúbica sería
      multivaluada y habría tres lugares geométricos distintos.

      La razón es entonces

      $$
      \left|4i+z_3\right| = \left|4i-2i\right| = \left|2i\right| = 2
      $$

      ### 2 · Reconocer la figura

      La condición queda

      $$
      \frac{\left|z-z_1\right|}{\left|z-z_2\right|} = 2
      $$

      un **cociente de distancias constante**: circunferencia de Apolonio. Y
      como la constante es distinta de 1, es una circunferencia de verdad y no
      una recta.

      ### 3 · La ecuación

      Con $z = x+iy$, y elevando al cuadrado —los dos miembros son no
      negativos—:

      $$
      (x-3)^{2}+(y-1)^{2} = 4\left[(x+3)^{2}+(y-1)^{2}\right]
      $$

      Los dos puntos tienen la misma parte imaginaria, así que conviene llamar
      $u = y-1$ y no arrastrarlo:

      $$
      x^{2}-6x+9+u^{2} = 4x^{2}+24x+36+4u^{2}
      $$

      $$
      0 = 3x^{2}+30x+27+3u^{2}
      \;\Longleftrightarrow\;
      0 = x^{2}+10x+9+u^{2}
      $$

      $$
      (x+5)^{2}-25+9+u^{2} = 0
      \;\Longleftrightarrow\;
      (x+5)^{2}+(y-1)^{2} = 16
      $$

      **Circunferencia de centro $(-5,1)$ y radio 4.**

      ### 4 · Representación gráfica

      Una circunferencia que pasa por $(-9,1)$, $(-1,1)$, $(-5,5)$ y $(-5,-3)$.

      Conviene marcar los dos puntos de referencia: $z_1 = 3+i$ y
      $z_2 = -3+i$. Los dos están sobre la recta $y=1$, que es también el
      diámetro horizontal de la circunferencia.

      Y hay algo que merece señalarse: **$z_2$ queda dentro** de la
      circunferencia —su distancia al centro es 2, menor que el radio 4— y
      $z_1$ queda **fuera**, a distancia 8. Es lo que tiene que pasar: como el
      cociente es mayor que 1, los puntos del lugar están más lejos de $z_1$
      que de $z_2$, así que la circunferencia rodea a $z_2$.

      ### 5 · Comprobación

      Con el punto $z = -1+i$, que está en la circunferencia porque
      $(-1+5)^{2}+0 = 16$ ✔:

      $$
      \left|z-z_1\right| = \left|-1+i-3-i\right| = \left|-4\right| = 4
      $$

      $$
      \left|z-z_2\right| = \left|-1+i+3-i\right| = \left|2\right| = 2
      $$

      $$
      \frac{4}{2} = 2 \quad\checkmark
      $$

      Con el diametralmente opuesto, $z = -9+i$:

      $$
      \left|-9+i-3-i\right| = 12,
      \qquad
      \left|-9+i+3-i\right| = 6,
      \qquad
      \frac{12}{6} = 2 \quad\checkmark
      $$

      Y una comprobación de la raíz, que es donde más fácil se falla:
      $(-2i)^{3} = -8i^{3} = -8(-i) = 8i$ ✔

      ### Resultado

      $$
      \boxed{\;(x+5)^{2}+(y-1)^{2} = 16\;}
      $$

  - id: ex1920-2-seno-de-una-suma
    titulo: El seno de una suma, para argumentos complejos
    fuente: >-
      Ejercicio 2 · Primera evaluación, 14 de octubre de 2019 · Cálculo
      (Industriales), UPV/EHU · Enunciado idéntico al ejercicio 1.28 del
      boletín del tema 1. El examen no publica solución: la demostración es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 0
      comp4: 8

    enunciado: |
      Demostrar que

      $$
      \mathrm{sen}(z_1+z_2) = \mathrm{sen}\,z_1\cos z_2 + \cos z_1\,\mathrm{sen}\,z_2
      \qquad \forall z_1, z_2 \in \mathbb{C}
      $$
    pide: Demostrar la fórmula de adición para argumentos complejos.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Desde dónde se demuestra una identidad trigonométrica en
          $\mathbb{C}$?
        opciones:
          - texto: >-
              Desde la **definición exponencial** de seno y coseno, que es la
              que vale en $\mathbb{C}$
            correcta: true
            mensaje: |
              Eso es. En $\mathbb{C}$ el seno y el coseno se definen por
              $\mathrm{sen}\,w = \frac{e^{iw}-e^{-iw}}{2i}$ y
              $\cos w = \frac{e^{iw}+e^{-iw}}{2}$. Toda identidad se prueba
              desarrollando esas expresiones.
          - texto: Desde la circunferencia goniométrica
            mensaje: |
              La circunferencia goniométrica define el seno y el coseno de un
              **ángulo real**. Un complejo no es un ángulo, así que ese dibujo
              no se puede usar.
          - texto: Desde la identidad real, que se extiende automáticamente
            mensaje: |
              No se extiende automáticamente. Hay propiedades reales que se
              caen: el seno complejo no está acotado. Que una sobreviva hay que
              probarlo.
          - texto: Desde el desarrollo en serie de Taylor
            mensaje: |
              Se puede, y es correcto, pero el desarrollo en serie todavía no se
              ha visto en este punto del temario y la cuenta es más larga. Con
              la definición exponencial salen cuatro líneas.

      - tipo: calcular
        titulo: Un valor que comprueba la fórmula
        pregunta: |
          Con $z_1 = z_2 = i$, ¿cuánto vale la parte imaginaria de
          $\mathrm{sen}(2i)$? En forma exacta, o con tres decimales.
        respuesta:
          tipo: numero
          valor: '3.627'
          tolerancia: 0.005
          formato: un número en forma exacta, o con tres decimales
        distractores:
          - valor: '0.909'
            mensaje: |
              $0{,}909$ es $\mathrm{sen}(2)$, el seno **real** de 2 radianes.
              Aquí el argumento es $2i$, y el seno de un imaginario puro es
              $i\,\mathrm{senh}$, que crece sin límite.
          - valor: '1.175'
            mensaje: |
              $1{,}175$ es $\mathrm{senh}(1)$, que aparece en
              $\mathrm{sen}(i) = i\,\mathrm{senh}(1)$. Pero se pide con
              argumento $2i$, no $i$.
          - valor: '1'
            mensaje: |
              El seno complejo **no está acotado por 1**: esa cota solo vale
              para argumentos reales. Con $z=2i$ el valor pasa de 3.
        pista: |
          $\mathrm{sen}(ix) = i\,\mathrm{senh}\,x$, y
          $\mathrm{senh}\,2 = \frac{e^{2}-e^{-2}}{2}$.
        desarrollo: |
          Por la definición exponencial, con $w = 2i$:

          $$
          \mathrm{sen}(2i) = \frac{e^{i\cdot2i}-e^{-i\cdot2i}}{2i}
          = \frac{e^{-2}-e^{2}}{2i}
          = \frac{e^{2}-e^{-2}}{2}\cdot\frac{-1}{i}
          = i\,\mathrm{senh}\,2
          $$

          usando $\frac{-1}{i} = i$. Y

          $$
          \mathrm{senh}\,2 = \frac{e^{2}-e^{-2}}{2}
          \approx \frac{7{,}389-0{,}135}{2} \approx 3{,}627
          $$

          Comprobación con el segundo miembro de la fórmula:

          $$
          2\,\mathrm{sen}\,i\cos i = 2\left(i\,\mathrm{senh}\,1\right)\cosh 1
          \approx 2(1{,}1752\,i)(1{,}5431) \approx 3{,}627\,i \quad\checkmark
          $$
        veredicto: |
          $3{,}627 > 1$. En los reales el seno nunca pasa de 1; en $\mathbb{C}$
          crece exponencialmente al alejarse del eje real.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Se parte de las definiciones
              $\mathrm{sen}\,w = \frac{e^{iw}-e^{-iw}}{2i}$ y
              $\cos w = \frac{e^{iw}+e^{-iw}}{2}$, válidas para todo
              $w \in \mathbb{C}$.
          - texto: |
              Desarrollando el primer sumando del segundo miembro:
              $\mathrm{sen}\,z_1\cos z_2 =
              \frac{e^{i(z_1+z_2)}+e^{i(z_1-z_2)}-e^{-i(z_1-z_2)}-e^{-i(z_1+z_2)}}{4i}$.
          - texto: |
              Y el segundo:
              $\cos z_1\,\mathrm{sen}\,z_2 =
              \frac{e^{i(z_1+z_2)}-e^{i(z_1-z_2)}+e^{-i(z_1-z_2)}-e^{-i(z_1+z_2)}}{4i}$.
          - texto: |
              Al sumarlos, los términos en $e^{\pm i(z_1-z_2)}$ se cancelan y
              los otros dos se duplican:
              $\frac{2e^{i(z_1+z_2)}-2e^{-i(z_1+z_2)}}{4i}$.
          - texto: |
              Esa expresión es, por definición, $\mathrm{sen}(z_1+z_2)$. Y no se
              ha supuesto nada sobre $z_1$ ni $z_2$.
          - texto: |
              Como $\left|\mathrm{sen}\,z\right| \le 1$, los dos miembros están
              acotados y la igualdad se conserva.
            trampa: true
            mensaje: |
              El seno complejo **no está acotado**: $\mathrm{sen}(2i)$ vale
              más de 3. Esa cota solo rige para argumentos reales, y meterla en
              la demostración es usar una propiedad falsa. Además la acotación
              no demostraría nada: dos funciones acotadas no tienen por qué ser
              iguales.
        veredicto: |
          Toda la demostración es cancelar cuatro exponenciales. Lo que se
          evalúa es haber empezado por la definición correcta.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > demostración propuesta, pendiente de revisión.

      **Enunciado.** Demostrar que
      $\mathrm{sen}(z_1+z_2) = \mathrm{sen}\,z_1\cos z_2 + \cos z_1\,\mathrm{sen}\,z_2$
      para todos $z_1, z_2 \in \mathbb{C}$.

      **Reparto de puntos del examen:** COMP1 2 · COMP4 8. No hay cálculo.

      > **Este enunciado es literalmente el ejercicio 1.28 del boletín del tema
      > 1**, el mismo que allí figura como «propuesta pendiente de revisión»
      > porque el boletín no publica su solución. Cayó en examen tal cual.

      ### 1 · Por qué hay algo que demostrar

      La fórmula se conoce para ángulos reales, pero el seno y el coseno
      complejos son funciones **nuevas**, definidas por

      $$
      \mathrm{sen}\,w = \frac{e^{iw}-e^{-iw}}{2i},
      \qquad
      \cos w = \frac{e^{iw}+e^{-iw}}{2},
      \qquad w \in \mathbb{C}
      $$

      Que una propiedad real se conserve no es automático. El seno complejo, por
      ejemplo, **no está acotado**: $\mathrm{sen}(2i) = i\,\mathrm{senh}\,2
      \approx 3{,}63\,i$. Si algunas propiedades se caen, ninguna se hereda
      gratis.

      Las dos definiciones valen para todo $w$ complejo, porque la exponencial
      compleja está definida en todo el plano. Ahí está la hipótesis del
      «$\forall z_1,z_2$».

      ### 2 · Desarrollar el segundo miembro

      **Primer sumando:**

      $$
      \mathrm{sen}\,z_1\cos z_2
      = \frac{e^{iz_1}-e^{-iz_1}}{2i}\cdot\frac{e^{iz_2}+e^{-iz_2}}{2}
      $$

      $$
      = \frac{e^{i(z_1+z_2)}+e^{i(z_1-z_2)}-e^{-i(z_1-z_2)}-e^{-i(z_1+z_2)}}{4i}
      $$

      **Segundo sumando:**

      $$
      \cos z_1\,\mathrm{sen}\,z_2
      = \frac{e^{iz_1}+e^{-iz_1}}{2}\cdot\frac{e^{iz_2}-e^{-iz_2}}{2i}
      $$

      $$
      = \frac{e^{i(z_1+z_2)}-e^{i(z_1-z_2)}+e^{-i(z_1-z_2)}-e^{-i(z_1+z_2)}}{4i}
      $$

      ### 3 · Sumar

      Los términos en $e^{i(z_1-z_2)}$ aparecen con signos opuestos y se
      cancelan; lo mismo los de $e^{-i(z_1-z_2)}$. Los otros dos se duplican:

      $$
      \mathrm{sen}\,z_1\cos z_2 + \cos z_1\,\mathrm{sen}\,z_2
      = \frac{2e^{i(z_1+z_2)}-2e^{-i(z_1+z_2)}}{4i}
      = \frac{e^{i(z_1+z_2)}-e^{-i(z_1+z_2)}}{2i}
      $$

      ### 4 · Conclusión

      Esa última expresión es, **por definición**, $\mathrm{sen}(z_1+z_2)$:

      $$
      \mathrm{sen}\,z_1\cos z_2 + \cos z_1\,\mathrm{sen}\,z_2
      = \mathrm{sen}(z_1+z_2)
      $$

      No se ha usado ninguna hipótesis sobre $z_1$ ni $z_2$ más allá de ser
      complejos, así que la igualdad vale para todos. $\blacksquare$

      ### 5 · Comprobación numérica

      No forma parte de la demostración, pero caza errores de signo. Con
      $z_1 = z_2 = i$:

      $$
      \mathrm{sen}(2i) = i\,\mathrm{senh}\,2 \approx 3{,}6269\,i
      $$

      $$
      2\,\mathrm{sen}\,i\cos i = 2\left(i\,\mathrm{senh}\,1\right)\cosh 1
      \approx 2(1{,}1752\,i)(1{,}5431) \approx 3{,}6269\,i
      $$

      Coinciden. Y se ve de paso lo que en $\mathbb{R}$ sería imposible: un
      seno de módulo mayor que 3.

      ### 6 · Qué más sale de aquí

      Con la misma técnica y en cuatro líneas salen las demás identidades de
      adición, y de ellas las del ángulo doble. Los ejercicios 1.27 del boletín
      y 2 del examen 2022-2023 —$\mathrm{sen}^{2}z$ y $\cos^{2}z$— son casos
      particulares de esta familia. Merece la pena tener el método, no las
      fórmulas.

      ### Resultado

      $$
      \boxed{\;\mathrm{sen}(z_1+z_2) = \mathrm{sen}\,z_1\cos z_2
      + \cos z_1\,\mathrm{sen}\,z_2 \quad \forall\, z_1,z_2 \in \mathbb{C}\;}
      $$

  - id: ex1920-3-unicidad-del-limite
    titulo: Por qué el límite de una sucesión es único
    fuente: >-
      Ejercicio 3 · Primera evaluación, 14 de octubre de 2019 · Cálculo
      (Industriales), UPV/EHU · Enunciado idéntico al ejercicio 2.6 del boletín
      del tema 2. El examen no publica solución: la demostración es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 0
      comp4: 10

    enunciado: |
      Demostrar que si el límite de una sucesión $\{x_n\}_{n\in\mathbb{N}}$
      existe, entonces es único.
    pide: Demostrar la unicidad del límite.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es el esquema de toda demostración de unicidad?
        opciones:
          - texto: >-
              Suponer que hay **dos** objetos distintos con la propiedad y
              llegar a una contradicción
            correcta: true
            mensaje: |
              Eso es, y funciona igual para el límite de una sucesión, el
              elemento neutro de un grupo o la solución de un sistema. Aquí se
              suponen dos límites $L_1 \neq L_2$ y se busca el choque.
          - texto: Calcular el límite y ver que sale un solo número
            mensaje: |
              No hay ninguna sucesión concreta. Y calcular un límite ya
              presupone que es único: sería circular.
          - texto: Demostrar que la sucesión es monótona
            mensaje: |
              La monotonía no interviene: sucesiones no monótonas también tienen
              límite único. La unicidad sale de la definición, no del
              comportamiento.
          - texto: Comprobarlo en varias sucesiones
            mensaje: |
              Los ejemplos no demuestran una propiedad universal. Servirían para
              refutarla si fuera falsa.

      - tipo: calcular
        titulo: El épsilon
        pregunta: |
          Si se suponen dos límites $L_1 = 2$ y $L_2 = 3$, ¿qué $\varepsilon$
          conviene tomar?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es la distancia entera, $\left|L_1-L_2\right|$. Con ese épsilon
              los entornos se tocan en el punto medio y la contradicción deja de
              ser estricta.
          - valor: '2.5'
            mensaje: |
              $2{,}5$ es el punto medio entre 2 y 3. Aparece en la demostración
              como frontera entre los dos entornos, pero no es el épsilon.
          - valor: '2'
            mensaje: |
              2 es $L_1$. Lo que importa no es cuánto valen los límites, sino
              cuánto **se separan**: $\left|L_1-L_2\right| = 1$.
        pista: |
          La distancia entre los dos candidatos es 1. La mitad.
        desarrollo: |
          $$
          \varepsilon = \frac{\left|L_1-L_2\right|}{2} = \frac{1}{2} = 0{,}5
          $$

          Con ese valor los entornos $(1{,}5,\,2{,}5)$ y $(2{,}5,\,3{,}5)$ son
          **disjuntos**: se tocan en $2{,}5$, que no pertenece a ninguno por ser
          los dos abiertos.
        veredicto: |
          Si el épsilon fuera mayor, los entornos se solaparían y un término
          podría estar en los dos: no habría contradicción.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Supongamos que $\{x_n\}$ tiene dos límites $L_1 \neq L_2$, y sea
              $\varepsilon = \dfrac{\left|L_1-L_2\right|}{2} > 0$.
          - texto: |
              Por ser $L_1$ límite existe $m_1$ con
              $\left|x_n-L_1\right| < \varepsilon$ para $n>m_1$; por ser $L_2$
              límite existe $m_2$ con $\left|x_n-L_2\right| < \varepsilon$ para
              $n>m_2$.
          - texto: |
              Para $n>\max(m_1,m_2)$ valen las dos, y por la **desigualdad
              triangular**
              $\left|L_1-L_2\right| \le \left|L_1-x_n\right|+\left|x_n-L_2\right|
              < \varepsilon+\varepsilon = \left|L_1-L_2\right|$.
          - texto: |
              Es decir,
              $\left|L_1-L_2\right| < \left|L_1-L_2\right|$: imposible. Luego
              $L_1 = L_2$.
          - texto: |
              Como los dos entornos son disjuntos, la sucesión no converge, y
              por eso el límite es único.
            trampa: true
            mensaje: |
              La conclusión no es que no converja: el enunciado **parte** de
              que el límite existe. Lo imposible es que haya **dos distintos**.
              Confundir «no puede haber dos» con «no puede haber ninguno»
              invierte el resultado del ejercicio.
        veredicto: |
          La desigualdad triangular es la que cierra: mide la distancia entre
          los dos candidatos pasando por un término que está cerca de los dos.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > demostración propuesta, pendiente de revisión.

      **Enunciado.** Si el límite de $\{x_n\}$ existe, es único.

      **Reparto de puntos del examen:** COMP4 10.

      > **Este enunciado es literalmente el ejercicio 2.6 del boletín del tema
      > 2.** Junto con el ejercicio 2 de este mismo examen, que es el 1.28, y el
      > 4, que reproduce el 2.15, **tres de los cuatro ejercicios de esta
      > convocatoria están en los boletines**.

      ### 1 · Estrategia

      El esquema de toda demostración de unicidad: suponer que hay dos objetos
      distintos con la propiedad y llegar a una contradicción.

      ### 2 · La demostración

      Supongamos que $L_1$ y $L_2$ son límites de $\{x_n\}$ con
      $L_1 \neq L_2$. Entonces $\left|L_1-L_2\right| > 0$ y se puede tomar

      $$
      \varepsilon = \frac{\left|L_1-L_2\right|}{2} > 0
      $$

      Por ser $L_1$ límite, existe $m_1$ tal que
      $\left|x_n-L_1\right| < \varepsilon$ para todo $n>m_1$. Por ser $L_2$
      límite, existe $m_2$ tal que $\left|x_n-L_2\right| < \varepsilon$ para
      todo $n>m_2$.

      Sea $n > \max(m_1,m_2)$: las dos desigualdades valen a la vez. Por la
      **desigualdad triangular**,

      $$
      \left|L_1-L_2\right| = \left|L_1-x_n+x_n-L_2\right|
      \le \left|L_1-x_n\right|+\left|x_n-L_2\right|
      < \varepsilon+\varepsilon = \left|L_1-L_2\right|
      $$

      Es decir, $\left|L_1-L_2\right| < \left|L_1-L_2\right|$, que es imposible.

      La suposición era falsa, luego $L_1 = L_2$: **el límite es único**.
      $\blacksquare$

      ### 3 · La idea geométrica

      Con $\varepsilon$ igual a la mitad de la distancia, los dos entornos son
      **disjuntos**. Un término de la sucesión con índice grande tendría que
      estar dentro de los dos a la vez, y no hay ningún número que lo esté. La
      desigualdad triangular es la forma algebraica de decir exactamente eso.

      ### 4 · Comprobación

      Con $L_1 = 2$ y $L_2 = 3$, y $\varepsilon = 0{,}5$, los entornos son

      $$
      (1{,}5,\;2{,}5) \qquad\text{y}\qquad (2{,}5,\;3{,}5)
      $$

      disjuntos: se tocan en $2{,}5$, que no pertenece a ninguno.

      Y qué pasaría con un épsilon mayor: con $\varepsilon = 1$ los entornos
      serían $(1,3)$ y $(2,4)$, que **sí** se solapan entre 2 y 3. Cualquier
      término ahí cumpliría las dos condiciones y no habría contradicción. Por
      eso el épsilon tiene que ser la mitad, y no cualquier cosa.

      ### Resultado

      $$
      \boxed{\;\text{Si } \lim x_n \text{ existe, es único}\;}
      $$

  - id: ex1920-4-tres-tramos-y-su-serie
    titulo: Tres tramos, un pico enorme y una serie que no converge
    fuente: >-
      Ejercicio 4 · Primera evaluación, 14 de octubre de 2019 · Cálculo
      (Industriales), UPV/EHU · La sucesión es la del ejercicio 2.15 del
      boletín del tema 2. El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 1
      comp4: 7

    enunciado: |
      **a)** Definir formalmente los siguientes conceptos: sucesión creciente,
      sucesión decreciente, sucesión acotada, sucesión convergente.

      **b)** Estudiar dichos conceptos para la sucesión
      $\{a_n\}_{n\in\mathbb{N}}$ definida de la siguiente forma:

      $$
      \{a_n\}_{n\in\mathbb{N}} =
      \begin{cases}
      n^{3} & n < 1000 \\[6pt]
      1 & 1000 \le n < 2000 \\[6pt]
      1-\dfrac{1}{n} & n \ge 2000
      \end{cases}
      $$

      **c)** Sea $\{a_n\}_{n\in\mathbb{N}}$ la sucesión definida en el apartado
      anterior. ¿Es convergente la serie
      $\displaystyle\sum_{n=1}^{\infty} a_n$?
    pide: Definir, estudiar la sucesión y decidir sobre la serie.

    pasos:
      - tipo: reconocer
        pregunta: |
          El primer tramo llega hasta $999^{3}$, casi mil millones. ¿Impide eso
          que la sucesión converja?
        opciones:
          - texto: >-
              No: son **999 términos**, un número finito, y la convergencia solo
              mira la cola
            correcta: true
            mensaje: |
              Exacto. El tamaño de los términos no dice nada del límite, y el
              número de términos «raros» tampoco mientras sea finito. Mil
              millones y 999 términos siguen siendo finitos.
          - texto: Sí, porque la sucesión no está acotada
            mensaje: |
              Sí está acotada: el primer tramo es finito, así que tiene un
              máximo, $999^{3}$. Acotada quiere decir que existe una cota, no
              que sea pequeña.
          - texto: Sí, porque el límite tiene que ser mayor que todos los términos
            mensaje: |
              El límite no tiene por qué ser mayor que ningún término. Aquí vale
              1, mucho menor que casi todos los del primer tramo.
          - texto: Depende de lo grande que sea $999^{3}$
            mensaje: |
              No depende: sería igual con $999^{100}$. Lo único que importa es
              que el tramo sea finito.

      - tipo: calcular
        titulo: El ínfimo
        pregunta: |
          ¿Cuál es el menor valor que toma la sucesión? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.9995'
          tolerancia: 0.00005
          formato: un número en forma exacta, o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              1 es el valor del tramo intermedio y también el límite, pero el
              tercer tramo baja **justo por debajo**: $a_{2000} = 1-\frac{1}{2000}
              = 0{,}9995$.
          - valor: '0'
            mensaje: |
              La sucesión nunca vale 0. El menor valor está en el tercer tramo,
              y ese tramo empieza en $0{,}9995$ y sube hacia 1.
          - valor: '2000'
            mensaje: |
              2000 es el **índice** donde se alcanza el mínimo, no su valor. El
              término es $a_{2000} = 1-\frac{1}{2000} = 0{,}9995$. Y ojo con el
              índice: el tercer tramo empieza en 2000, no en 1000, así que
              $1-\frac{1}{1000}$ no es ningún término de esta sucesión.
        pista: |
          El tercer tramo, $1-\frac1n$, es creciente. Su menor valor está en su
          primer índice, $n=2000$.
        desarrollo: |
          Los tres tramos, por separado:

          | tramo | valores |
          |---|---|
          | $n<1000$ | $1,\ 8,\ 27,\ \dots,\ 999^{3}$ |
          | $1000\le n<2000$ | exactamente $1$ |
          | $n\ge2000$ | de $0{,}9995$ subiendo hacia 1 |

          El tercer tramo es **creciente** —al aumentar $n$ se resta menos— y
          empieza en

          $$
          a_{2000} = 1-\frac{1}{2000} = 0{,}9995
          $$

          que es el menor valor de toda la sucesión. Y se alcanza: es
          **mínimo**.
        veredicto: |
          El máximo, $999^{3} = 997\,002\,999$, y el mínimo, $0{,}9995$, están
          separados por nueve órdenes de magnitud. Y aun así la sucesión
          converge.

      - tipo: justificar
        pregunta: |
          Ordena el estudio. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **No es creciente:** en el empalme se desploma, de
              $a_{999} = 999^{3}$ a $a_{1000} = 1$.
          - texto: |
              **No es decreciente:** el primer tramo sube,
              $a_1 = 1 < 8 = a_2$. Hacen falta las dos comprobaciones.
          - texto: |
              **Es acotada:** $0{,}9995 \le a_n \le 999^{3}$, y las dos cotas se
              alcanzan.
          - texto: |
              **Converge a 1:** solo cuenta la cola, y
              $\lim\left(1-\frac1n\right) = 1$. Los dos primeros tramos son
              1999 términos, un número finito.
          - texto: |
              **La serie diverge:** $a_n \to 1 \neq 0$, así que falla la
              condición necesaria del término general.
          - texto: |
              La serie diverge porque los primeros términos son enormes y su
              suma ya es gigantesca.
            trampa: true
            mensaje: |
              Una suma finita, por gigantesca que sea, sigue siendo finita y no
              impide que una serie converja. Si la cola fuera $\frac{1}{2^{n}}$,
              la serie convergería a pesar de esos mil millones. Lo que la hace
              diverger es la **cola**: infinitos términos cercanos a 1.
        veredicto: |
          Los dos errores gemelos: creer que los términos grandes impiden
          converger, y creer que la sucesión convergente arrastra a la serie.
          Este ejercicio los toca los dos.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** $a_n = n^{3}$ para $n<1000$; $a_n = 1$ para
      $1000\le n<2000$; $a_n = 1-\frac1n$ para $n\ge2000$.

      **Reparto de puntos del examen:** COMP1 2 · COMP2 1 · COMP4 7.

      > La sucesión es la del ejercicio **2.15 del boletín** del tema 2, que
      > preguntaba solo por la serie. Aquí se pide además el estudio completo.

      ### 1 · Apartado (a): las definiciones

      $$
      \{a_n\} \text{ creciente} \iff a_{n+1} > a_n \quad \forall n \in \mathbb{N}
      $$

      $$
      \{a_n\} \text{ decreciente} \iff a_{n+1} < a_n \quad \forall n \in \mathbb{N}
      $$

      $$
      \{a_n\} \text{ acotada} \iff \exists\, p,q \in \mathbb{R} :
      p \le a_n \le q \quad \forall n \in \mathbb{N}
      $$

      $$
      \lim a_n = L \iff \forall\varepsilon>0\;\exists\, m \in \mathbb{N} :\;
      n>m \Rightarrow \left|a_n-L\right| < \varepsilon
      $$

      El contraste que este ejercicio explota: las tres primeras hablan de
      **todos** los términos; la cuarta, solo de los que hay a partir de cierto
      índice.

      ### 2 · Apartado (b): los tres tramos

      $$
      1,\; 8,\; 27,\; \dots,\; \underbrace{997\,002\,999}_{a_{999}},\;
      \underbrace{1,\; 1,\; \dots,\; 1}_{\text{mil términos}},\;
      \underbrace{0{,}9995,\; 0{,}99950,\; \dots}_{\to 1}
      $$

      **No es creciente.** Basta el empalme:

      $$
      a_{999} = 999^{3} = 997\,002\,999 \;>\; 1 = a_{1000}
      $$

      **No es decreciente.** Basta el principio: $a_1 = 1 < 8 = a_2$. Las dos
      comprobaciones son necesarias; «no creciente» no descarta «decreciente».

      **Es acotada.** El tramo intermedio es constante, el primero es finito y
      el tercero está entre $0{,}9995$ y 1:

      $$
      0{,}9995 \le a_n \le 997\,002\,999 \qquad \forall n
      $$

      Las dos cotas se alcanzan —en $n=2000$ y en $n=999$—, así que son mínimo
      y máximo.

      Conviene decir por qué el primer tramo **no** rompe la acotación: es un
      número **finito** de términos, así que tiene máximo. Una sucesión no está
      acotada cuando crece sin límite, no cuando toma valores grandes.

      **Converge a 1.** Solo cuenta la cola. Los dos primeros tramos suman 1999
      términos, un número finito, y no intervienen:

      $$
      \lim_{n\to\infty} a_n = \lim_{n\to\infty}\left(1-\frac1n\right) = 1
      $$

      ### 3 · Apartado (c): la serie

      La condición necesaria dice que si $\sum a_n$ converge entonces
      $a_n \to 0$. Aquí $a_n \to 1 \neq 0$:

      $$
      \boxed{\;\text{La serie } \sum_{n=1}^{\infty} a_n \text{ NO converge}\;}
      $$

      De hecho diverge a $+\infty$: a partir de $n=1000$ se suman infinitos
      términos, todos mayores o iguales que $0{,}9995$.

      **Los términos gigantes del principio no son el motivo.** Es un error
      tentador: sumar mil millones parece que ya rompe la serie. Pero una suma
      finita, por grande que sea, sigue siendo finita. Si la cola fuera
      $\frac{1}{2^{n}}$, la serie **convergería** a pesar de esos mil millones,
      simplemente a un número muy grande. Lo que decide es la cola.

      **Y la advertencia gemela:** que el término general tienda a cero no
      basta. La serie armónica lo cumple y suma infinito. La condición sirve
      para descartar, nunca para confirmar.

      ### 4 · Lo que enseña la sucesión

      Este ejercicio es un contraejemplo vivo de tres confusiones:

      - Una sucesión puede **converger sin ser monótona**.
      - Puede alcanzar valores enormes —casi $10^{9}$— y converger a 1. El
        tamaño de los términos no dice nada del límite.
      - Puede converger y que su **serie diverja**. Son preguntas distintas: la
        sucesión pregunta a dónde van los términos, la serie pregunta cuánto
        suman.

      ### 5 · Comprobación

      **Del límite**, con $\varepsilon = 10^{-4}$:

      $$
      \left|1-\frac1n-1\right| = \frac1n < 10^{-4}
      \;\Longleftrightarrow\; n > 10\,000
      $$

      Sirve $m = 10\,000$, que es mayor que 2000: la condición cae de lleno en
      el tercer tramo, como tenía que ser ✔

      **Del mínimo**, comprobando que el tercer tramo empieza justo por debajo
      del segundo: $a_{1999} = 1$ y $a_{2000} = 0{,}9995 < 1$ ✔. El salto es
      minúsculo, pero existe, y es lo que hace que el ínfimo no sea 1.

      **De la divergencia**, con una cota por debajo: para $N>2000$,

      $$
      \sum_{n=1}^{N} a_n > \sum_{n=1000}^{N} 0{,}9995
      = 0{,}9995\,(N-999)
      \;\xrightarrow[N\to\infty]{}\; \infty
      $$

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \text{(b) } & \text{ni creciente ni decreciente; acotada }
      0{,}9995 \le a_n \le 999^{3};\ \text{convergente con } L=1 \\[4pt]
      \text{(c) } & \text{la serie no converge, porque } a_n \to 1 \neq 0
      \end{aligned}}
      $$
