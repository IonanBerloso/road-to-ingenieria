ejercicios:
  - id: ex1415-4ev-1-masa-bajo-el-paraboloide
    titulo: La masa bajo un paraboloide, dentro de un cilindro
    fuente: >-
      Ejercicio 1 · Cuarta evaluación (segundo cuatrimestral), 23 de marzo de
      2015 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp2: 5
      comp4: 5
    enunciado: |
      Considerar el sólido $S$ definido por las condiciones $x^{2}+y^{2}\le 4$,
      $x^{2}+y^{2}\ge z-2$, $z\ge 0$. Supongamos que la masa en cada punto
      $(x,y,z)$ se distribuye dentro de $S$ según la función de densidad
      $f(x,y,z) = x^{2}+y^{2}+z$.

      a) Representar gráficamente $S$.
      b) Plantear el volumen de $S$ en coordenadas cartesianas.
      c) Calcular la masa de $S$.
    pide: El dibujo, el volumen planteado en cartesianas y la masa.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado b) pide el volumen **en cartesianas** y el c) la masa sin
          decir en cuáles. ¿Qué se está evaluando?
        opciones:
          - texto: Que sepas plantear en las incómodas y calcular en las cómodas
            correcta: true
            mensaje: |
              Exacto. Escribir los límites en cartesianas —con sus raíces— y
              luego cambiar a cilíndricas para integrar es la respuesta
              completa. Y el reparto lo confirma: COMP4 vale 5 de 10.
          - texto: Que hagas los dos apartados en cartesianas
            mensaje: |
              El c) no lo pide, y en cartesianas la masa sale muchísimo más
              larga. El enunciado deja libre el c) a propósito.
          - texto: Que uses cilíndricas también en el b)
            mensaje: |
              El b) dice «en coordenadas cartesianas» con todas las letras.
              Contestar en cilíndricas es no hacer el apartado.
      - tipo: calcular
        titulo: La altura del sólido en el borde
        pregunta: |
          La tapa es $z = x^{2}+y^{2}+2$, o sea $z=\rho^{2}+2$. ¿Qué altura
          tiene el sólido en $\rho=2$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es la altura en el **centro**, donde $\rho=0$. El paraboloide
              abre hacia arriba, así que en el borde está más alto.
          - valor: '4'
            mensaje: |
              4 es $\rho^{2}$ en el borde. Falta sumarle el 2 del término
              independiente.
        pista: |
          $2^2 + 2$.
        desarrollo: |
          $$
          z(2) = 2^{2}+2 = 6
          $$

          El sólido va de 2 de alto en el eje a 6 en el borde: es un cilindro
          con la tapa **abombada hacia arriba**.
      - tipo: calcular
        titulo: La masa
        pregunta: |
          Integrando en cilíndricas, la masa sale $72\pi$. ¿Cuánto vale con dos
          decimales?
        respuesta:
          tipo: numero
          valor: '226.19'
          tolerancia: 0.3
          formato: en forma exacta o con dos decimales
        distractores:
          - valor: '50.27'
            mensaje: |
              $16\pi$ es el **volumen**, no la masa. La densidad no es 1: crece
              con la distancia al eje y con la altura.
          - valor: '113.1'
            mensaje: |
              $36\pi$ es la mitad. Comprueba el desarrollo del integrando: sale
              $\frac32\rho^{4}+4\rho^{2}+2$, con tres términos.
        pista: |
          $72\pi$, con pi = 3,14159...
        desarrollo: |
          Integrando primero en $z$ hasta $h=\rho^{2}+2$:

          $$
          \int_{0}^{h}\bigl(\rho^{2}+z\bigr)dz = \rho^{2}h + \frac{h^{2}}{2}
          = \frac32\rho^{4}+4\rho^{2}+2
          $$

          $$
          M = 2\pi\int_{0}^{2}\left(\frac32\rho^{5}+4\rho^{3}+2\rho\right)d\rho
          = 2\pi\bigl(16+16+4\bigr) = 72\pi \approx 226{,}19
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'a) Es un cilindro de radio 2 con la tapa abombada: el paraboloide $z=\rho^{2}+2$, que va de 2 en el eje a 6 en el borde.'
          - texto: 'b) En cartesianas: $\displaystyle\int_{-2}^{2}\int_{-\sqrt{4-x^{2}}}^{\sqrt{4-x^{2}}}\int_{0}^{x^{2}+y^{2}+2} dz\,dy\,dx$.'
          - texto: 'c) Para la masa conviene cambiar a cilíndricas, donde los límites son constantes salvo el de $z$.'
          - texto: 'La densidad $\rho^{2}+z$ crece al alejarse del eje y al subir, así que la masa pesa más que el volumen.'
          - texto: 'a) La condición $x^{2}+y^{2}\ge z-2$ dice que el sólido está **por encima** del paraboloide.'
            trampa: true
            mensaje: |
              Al revés. Despejando, $z \le x^{2}+y^{2}+2$: el sólido está **por
              debajo**. El signo de la desigualdad se invierte al pasar la $z$ a
              un lado, y confundirlo da un sólido infinito.
    resolucion: |
      **a) El sólido.** Reescribiendo la segunda condición, $z \le \rho^{2}+2$.
      Así que es un **cilindro de radio 2 con la tapa abombada hacia arriba**:
      el paraboloide sube de $z=2$ en el eje a $z=6$ en el borde, y el suelo es
      el plano $z=0$.

      **b) El volumen en cartesianas**, que es lo que el apartado pide:

      $$
      V = \int_{-2}^{2}\!\!\int_{-\sqrt{4-x^{2}}}^{\sqrt{4-x^{2}}}\!\!\int_{0}^{x^{2}+y^{2}+2} dz\;dy\;dx
      $$

      Los dos límites de fuera llevan la raíz del círculo; el de dentro, la
      tapa.

      **c) La masa**, y aquí sí conviene cambiar. En cilíndricas la densidad es
      $\rho^{2}+z$ y el recinto es cómodo:

      $$
      \int_{0}^{\rho^{2}+2}\bigl(\rho^{2}+z\bigr)dz
      = \rho^{2}\bigl(\rho^{2}+2\bigr) + \frac{\bigl(\rho^{2}+2\bigr)^{2}}{2}
      = \frac32\rho^{4}+4\rho^{2}+2
      $$

      $$
      M = \int_{0}^{2\pi}\!\!\int_{0}^{2}\left(\frac32\rho^{4}+4\rho^{2}+2\right)\rho\;d\rho\,d\theta
      = 2\pi\left(16+16+4\right)
      $$

      $$
      \boxed{\;M = 72\pi \approx 226{,}19\;}
      $$

      > **El control de plausibilidad.** El volumen es $16\pi\approx 50$, y la
      > densidad varía entre 2 —en el eje, junto al suelo— y $4+6=10$ —en el
      > borde de la tapa—. Una masa de $72\pi$ equivale a una densidad media de
      > $72/16 = 4{,}5$, que está dentro de ese rango y tirando a bajo: correcto,
      > porque el volumen se concentra donde la densidad es menor. ✓
      >
      > Y fíjate en que el enunciado pide **plantear** en cartesianas y
      > **calcular** sin decir dónde. Eso es una invitación a cambiar de
      > coordenadas, y aceptarla vale puntos.

  - id: ex1415-4ev-2-donde-la-derivada-maxima-vale-cuatro
    titulo: Dónde la derivada direccional máxima vale 4
    fuente: >-
      Ejercicio 2 · Cuarta evaluación (segundo cuatrimestral), 23 de marzo de
      2015 · Cálculo, UPV/EHU · Es el ejercicio 6.15 del boletín de problemas
      complementarios, que publica la solución.
    nivel: examen
    puntos:
      comp1: 3
      comp2: 2
      comp4: 5
    enunciado: |
      Dada la función $F(x,y) = 2x^{2}+y^{2}$, calcular y representar
      gráficamente los puntos $(x,y)$ en los que la derivada direccional máxima
      vale 4. Si se sabe además que la dirección en la que se da la derivada
      máxima es $\vec v = (0,1)$, calcular las coordenadas del punto en el que
      sucede.
    pide: El lugar geométrico de esos puntos, su dibujo, y el punto concreto.
    pasos:
      - tipo: reconocer
        pregunta: |
          «La derivada direccional máxima vale 4». ¿Qué ecuación es esa?
        opciones:
          - texto: El módulo del gradiente igual a 4
            correcta: true
            mensaje: |
              Sí. El valor máximo de la derivada direccional es
              $\lVert\nabla F\rVert$, así que la condición es una ecuación en
              $x$ e $y$ — y por eso la respuesta es una **curva**, no un punto.
          - texto: El gradiente igual al vector (4,4)
            mensaje: |
              El enunciado da el **valor** máximo, no la dirección. Fijar el
              vector entero sería otro problema, con una sola solución.
          - texto: La función igual a 4
            mensaje: |
              $F=4$ sería una curva de nivel. Lo que se pide es dónde la
              función cambia más deprisa a un ritmo dado, que es otra cosa.
      - tipo: calcular
        titulo: La curva que sale
        pregunta: |
          De $\lVert(4x,2y)\rVert = 4$ sale $16x^{2}+4y^{2}=16$. Dividiendo
          entre 16, la curva es $x^{2}+\frac{y^{2}}{b^{2}}=1$. ¿Cuánto vale $b$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              4 es $b^{2}$, el denominador. El semieje es su raíz.
          - valor: '1'
            mensaje: |
              1 es el semieje en $x$. En $y$ la elipse es el doble de larga,
              porque el coeficiente de $y$ en el gradiente es la mitad.
        pista: |
          $16x^2+4y^2=16$ dividido entre 16 da $x^2 + y^2/4 = 1$.
        desarrollo: |
          $$
          16x^{2}+4y^{2}=16
          \qquad\Longrightarrow\qquad
          x^{2}+\frac{y^{2}}{4}=1
          $$

          Una **elipse** de semiejes 1 en $x$ y 2 en $y$. Ese es el lugar
          geométrico pedido, y hay que dibujarlo.
      - tipo: calcular
        titulo: El punto concreto
        pregunta: |
          Si la dirección de máximo cambio es $(0,1)$, el gradiente $(4x,2y)$
          tiene que ser paralelo a ella, así que $x=0$. ¿Cuánto vale entonces
          $y$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              $-2$ también está en la elipse, pero ahí el gradiente sería
              $(0,-4)$: apunta hacia **abajo**, en el sentido contrario al que
              da el enunciado. El sentido de $\vec v$ descarta esa raíz.
          - valor: '4'
            mensaje: |
              4 se sale de la elipse: con $x=0$, la condición es $y^{2}/4=1$, o
              sea $y=\pm 2$.
        pista: |
          Con x=0 la elipse da $y^2/4 = 1$. Y el sentido de v elige el signo.
        desarrollo: |
          Con $x=0$, la elipse da $y = \pm 2$. Y el **sentido** decide:

          $$
          \nabla F(0,2) = (0,4) \parallel (0,1) \quad ✓
          $$

          $$
          \nabla F(0,-2) = (0,-4) \parallel (0,-1) \quad ✗
          $$

          $$
          P = (0,\,2)
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'El valor máximo de la derivada direccional es $\lVert\nabla F\rVert$, y $\nabla F = (4x,2y)$.'
          - texto: 'La condición $\lVert\nabla F\rVert = 4$ da la elipse $x^{2}+\frac{y^{2}}{4}=1$.'
          - texto: 'Si la dirección máxima es $(0,1)$, el gradiente es vertical, luego $x=0$.'
          - texto: 'De los dos puntos de la elipse con $x=0$, el sentido de $\vec v$ elige $(0,2)$.'
          - texto: 'Como el enunciado da el valor máximo, la respuesta tiene que ser un punto único.'
            trampa: true
            mensaje: |
              Un solo dato sobre un valor deja una **ecuación**, y una ecuación
              en dos incógnitas define una curva. Por eso el enunciado pide
              «calcular y **representar gráficamente los puntos**», en plural, y
              luego añade un segundo dato para quedarse con uno.
    resolucion: |
      **El ejercicio tiene dos mitades y hay que ver que son distintas:** con un
      dato sale una curva, y con dos sale un punto. Por eso COMP1 vale 3 de 10.

      **Primera mitad: el lugar geométrico.**

      $$
      \nabla F = (4x,\;2y),
      \qquad
      \lVert\nabla F\rVert = \sqrt{16x^{2}+4y^{2}} = 4
      $$

      $$
      16x^{2}+4y^{2} = 16
      \qquad\Longrightarrow\qquad
      \boxed{\;x^{2}+\frac{y^{2}}{4} = 1\;}
      $$

      Una **elipse** de semiejes 1 y 2, centrada en el origen y alargada en
      vertical. Hay que dibujarla: el enunciado lo pide.

      **Segunda mitad: el punto.** Si la dirección de máximo cambio es $(0,1)$,
      el gradiente $(4x,2y)$ tiene que ser **paralelo y del mismo sentido**:

      $$
      4x = 0 \;\Longrightarrow\; x = 0
      $$

      y sustituyendo en la elipse, $y = \pm 2$. El **sentido** descarta uno:

      $$
      \nabla F(0,2) = (0,4)\ \text{apunta hacia arriba, como } \vec v \quad ✓
      $$

      $$
      \boxed{\;P = (0,\,2)\;}
      $$

      > **El detalle que separa el 8 del 10:** las dos raíces $y=\pm 2$ cumplen
      > que el gradiente es **vertical**, pero solo una cumple que sea del
      > sentido de $\vec v$. Un enunciado que da un vector y no una recta está
      > fijando también el sentido, y decirlo explícitamente es lo que puntúa
      > en COMP4 — que aquí vale 5 de 10, más que el cálculo.
