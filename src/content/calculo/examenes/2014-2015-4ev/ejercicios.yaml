        consigna: |
          Dibuja el lugar geométrico pedido en el plano $XY$, el punto concreto y
          una flecha con la dirección del gradiente allí.
        comprueba:
          - punto: |
              Una **elipse** de semiejes $1$ en horizontal y $2$ en vertical.
            porque: |
              De $\lVert\nabla F\rVert=4$ sale $x^{2}+\tfrac{y^{2}}{4}=1$. Es más
              alta que ancha, al contrario que las curvas de nivel de
              $F=2x^{2}+y^{2}$: confundirlas es el error del ejercicio.
          - punto: |
              El punto $P\left(0,2\right)$, en lo más alto de la elipse.
            porque: |
              La dirección $\left(0,1\right)$ obliga a $x=0$, y el **sentido**
              descarta $\left(0,-2\right)$.
          - punto: |
              La flecha del gradiente en $P$, vertical hacia arriba y de longitud
              $4$ a escala.
            porque: |
              $\nabla F(0,2)=(0,4)$: dibujarla con su módulo comprueba las dos
              condiciones a la vez, la del valor y la de la dirección.
          - punto: |
              El punto $\left(0,-2\right)$ también dibujado, y descartado
              explícitamente.
            porque: |
              Está en el lugar geométrico pero su gradiente apunta hacia abajo.
              Descartarlo por escrito es la mitad de la justificación.
        veredicto: |
          La elipse es un lugar de **pendiente** constante, no de altura
          constante: sobre ella $F$ vale $2$ en un extremo y $4$ en el otro.
          Decirlo es lo que separa una respuesta entendida de una copiada.

    resolucion: |
      **El ejercicio tiene dos mitades y hay que ver que son distintas:** con un
      dato sale una curva, y con dos sale un punto. Por eso COMP1 vale 3 de 10.

      **Primera mitad: el lugar geométrico.**

      $$
      \nabla F = (4x,\;2y),
      \qquad
      \lVert\nabla F\rVert = \sqrt{16x^{2}+4y^{2}} = 4
      $$

      $$
      16x^{2}+4y^{2} = 16
      \qquad\Longrightarrow\qquad
      \boxed{\;x^{2}+\frac{y^{2}}{4} = 1\;}
      $$

      Una **elipse** de semiejes 1 y 2, centrada en el origen y alargada en
      vertical. Hay que dibujarla: el enunciado lo pide.

      **Segunda mitad: el punto.** Si la dirección de máximo cambio es $(0,1)$,
      el gradiente $(4x,2y)$ tiene que ser **paralelo y del mismo sentido**:

      $$
      4x = 0 \;\Longrightarrow\; x = 0
      $$

      y sustituyendo en la elipse, $y = \pm 2$. El **sentido** descarta uno:

      $$
      \nabla F(0,2) = (0,4)\ \text{apunta hacia arriba, como } \vec v \quad ✓
      $$

      $$
      \boxed{\;P = (0,\,2)\;}
      $$

      > **El detalle que separa el 8 del 10:** las dos raíces $y=\pm 2$ cumplen
      > que el gradiente es **vertical**, pero solo una cumple que sea del
      > sentido de $\vec v$. Un enunciado que da un vector y no una recta está
      > fijando también el sentido, y decirlo explícitamente es lo que puntúa
      > en COMP4 — que aquí vale 5 de 10, más que el cálculo.
