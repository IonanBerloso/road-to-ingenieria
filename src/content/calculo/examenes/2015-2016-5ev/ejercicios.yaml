ejercicios:
  - id: ex1516-5ev-1-el-gradiente-desde-dos-direcciones
    titulo: Reconstruir el gradiente a partir de dos derivadas direccionales
    fuente: >-
      Ejercicio 1 · Quinta evaluación, SEGUNDO CUATRIMESTRAL, 2 de mayo de 2016 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 3
      comp4: 5
    enunciado: |
      La altura de una montaña viene dada por la función $F(x,y)$. Si nos
      situamos en el punto $(1,2)$ y nos dirigimos hacia el punto $(2,2)$, la
      derivada direccional es $2$. En cambio, si nos dirigimos al punto $(1,1)$,
      la derivada direccional es $-2$.

      a) Hallar el vector gradiente en el punto $(1,2)$ e interpretar su
      significado.

      b) Calcular el valor de la derivada direccional en el punto $(1,2)$
      siguiendo la dirección dada por el vector $(4,3)$.
    pide: El gradiente en el punto, su interpretación, y la derivada direccional en la dirección de (4,3).

    pasos:
      - tipo: reconocer
        pregunta: |
          Nos dan dos derivadas direccionales en el mismo punto. ¿Por qué eso
          basta para conocer el gradiente entero?
        opciones:
          - texto: >-
              Porque $D_{u}F=\nabla F\cdot u$ es lineal en $u$: cada dirección da
              una ecuación con las dos incógnitas $F_{x}$ y $F_{y}$, y dos
              direcciones no paralelas dan un sistema determinado
            correcta: true
            mensaje: |
              Exacto. Y aquí las dos direcciones son además los propios ejes, así
              que el sistema es tan sencillo que ni se plantea: cada derivada
              direccional **es** una parcial, con su signo.
          - texto: >-
              Porque la derivada direccional es siempre la misma en todas las
              direcciones
            mensaje: |
              Si lo fuera, el enunciado no daría dos valores distintos: $2$ y
              $-2$. La derivada direccional depende de la dirección, y eso es
              justo lo que la hace útil.
          - texto: >-
              Porque el gradiente es la suma de las dos derivadas direccionales
            mensaje: |
              Casi, y por eso engaña: aquí sale bien de casualidad, porque las
              dos direcciones son perpendiculares y unitarias. Con dos
              direcciones cualesquiera habría que resolver el sistema
              $\nabla F\cdot u_{1}=2$, $\nabla F\cdot u_{2}=-2$.

      - tipo: calcular
        titulo: La parcial respecto de y
        pregunta: |
          De $(1,2)$ hacia $(1,1)$ la derivada direccional vale $-2$. ¿Cuánto
          vale $F_{y}(1,2)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              Ojo a la dirección. De $(1,2)$ a $(1,1)$ se **baja** en $y$: el
              vector unitario es $(0,-1)$, no $(0,1)$. Por tanto
              $D_{u}F=-F_{y}=-2$, y $F_{y}=+2$.
          - valor: '-1'
            mensaje: |
              Has dividido entre la distancia dos veces, o has normalizado un
              vector que ya era unitario. $(0,-1)$ tiene módulo $1$: no hay nada
              que dividir.
        pista: |
          Escribe el vector unitario que va de $(1,2)$ a $(1,1)$ y haz el
          producto escalar con $(F_{x},F_{y})$.
        desarrollo: |
          El vector de $(1,2)$ a $(1,1)$ es $(0,-1)$, que ya es unitario. Así que

          $$
          D_{u}F(1,2)=\left(F_{x},F_{y}\right)\cdot(0,-1)=-F_{y}=-2
          \;\Longrightarrow\;
          F_{y}(1,2)=2
          $$

          Y de la otra, con $(1,0)$: $F_{x}(1,2)=2$. El gradiente es
          $\nabla F(1,2)=(2,2)$.

      - tipo: calcular
        titulo: La derivada direccional en la dirección de (4,3)
        pregunta: |
          ¿Cuánto vale $D_{u}F(1,2)$ en la dirección del vector $(4,3)$?
        respuesta:
          tipo: numero
          valor: '2.8'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '14'
            mensaje: |
              Se te ha olvidado normalizar. $(4,3)$ tiene módulo $5$, y la
              derivada direccional se define con un vector **unitario**: hay que
              dividir entre $5$.
          - valor: '2.5298221'
            mensaje: |
              Has tratado $(4,3)$ como un punto de destino y has usado la
              dirección $(4,3)-(1,2)=(3,1)$. El enunciado dice «la dirección dada
              por el vector $(4,3)$»: el vector es la dirección, no un punto.
          - valor: '2.8284271'
            mensaje: |
              Eso es $\left|\nabla F\right|=2\sqrt{2}$, la derivada direccional
              **máxima**, la que se obtiene yendo en la dirección del propio
              gradiente. En la dirección de $(4,3)$ es algo menor, porque $(4,3)$
              no es paralelo a $(2,2)$.
        pista: |
          $D_{u}F=\nabla F\cdot\dfrac{(4,3)}{\left|(4,3)\right|}$.
        desarrollo: |
          $$
          u=\frac{(4,3)}{5}=\left(\frac45,\frac35\right),
          \qquad
          D_{u}F(1,2)=(2,2)\cdot\left(\frac45,\frac35\right)
          =\frac{8}{5}+\frac{6}{5}=\frac{14}{5}=2{,}8
          $$

      - tipo: justificar
        titulo: El razonamiento y la interpretación
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              De $(1,2)$ a $(2,2)$ el vector unitario es $(1,0)$, así que
              $D_{u}F=F_{x}=2$.
          - texto: >-
              De $(1,2)$ a $(1,1)$ el vector unitario es $(0,-1)$, así que
              $D_{u}F=-F_{y}=-2$ y por tanto $F_{y}=2$.
          - texto: >-
              El gradiente es $\nabla F(1,2)=(2,2)$.
          - texto: >-
              **Su significado:** apunta en la dirección de máxima pendiente de
              subida —hacia el nordeste, a $45^{\circ}$— y su módulo,
              $2\sqrt{2}$, es esa pendiente máxima. Ninguna dirección desde
              $(1,2)$ sube más deprisa que eso.
          - texto: >-
              Con $u=\frac{(4,3)}{5}$ queda
              $D_{u}F=(2,2)\cdot\left(\frac45,\frac35\right)=\frac{14}{5}=2{,}8$,
              menos que $2\sqrt{2}$ porque $(4,3)$ no es paralelo al gradiente.
          - texto: >-
              El gradiente es tangente a la curva de nivel que pasa por $(1,2)$,
              porque a lo largo de una curva de nivel la altura no cambia.
            trampa: true
            mensaje: |
              Es **perpendicular**, no tangente. Precisamente porque a lo largo de
              la curva de nivel la altura no cambia, la derivada direccional en la
              dirección tangente es cero, y $\nabla F\cdot u=0$ significa que el
              gradiente es ortogonal a esa dirección. Es la razón de que la
              máxima pendiente sea siempre la que cruza las curvas de nivel de
              frente.

    resolucion: |
      **Lo que dice cada dato.** La derivada direccional es
      $D_{u}F=\nabla F\cdot u$ con $u$ **unitario**, así que cada dirección que
      nos dan es una ecuación lineal en $F_{x}$ y $F_{y}$.

      De $(1,2)$ hacia $(2,2)$: el desplazamiento es $(1,0)$, que ya es
      unitario, y entonces $D_{u}F=F_{x}=2$.

      De $(1,2)$ hacia $(1,1)$: el desplazamiento es $(0,-1)$, unitario también,
      y $D_{u}F=-F_{y}=-2$, de donde $F_{y}=2$. **Ese signo es el ejercicio
      entero**: la derivada direccional es negativa porque se va hacia abajo en
      $y$, no porque la parcial lo sea.

      **a) El gradiente y su significado.**

      $$
      \nabla F(1,2)=(2,2)
      $$

      Apunta en la dirección de máxima pendiente de subida —la bisectriz del
      primer cuadrante— y su módulo, $\left|\nabla F\right|=2\sqrt{2}\approx
      2{,}83$, es el valor de esa pendiente máxima. Es además perpendicular a la
      curva de nivel que pasa por el punto: en la montaña, la línea de máxima
      pendiente cruza las curvas de nivel de frente.

      **b) La dirección de $(4,3)$.** Primero se normaliza, que es el paso que
      más se olvida:

      $$
      u=\frac{(4,3)}{\left|(4,3)\right|}=\left(\frac{4}{5},\frac{3}{5}\right)
      $$

      $$
      D_{u}F(1,2)=(2,2)\cdot\left(\frac45,\frac35\right)=\frac{14}{5}=2{,}8
      $$

      **Un control de coherencia.** $2{,}8<2\sqrt{2}\approx 2{,}83$, como tiene
      que ser: ninguna derivada direccional puede pasar del módulo del
      gradiente. Y están muy cerca porque $(4,3)$ forma un ángulo pequeño con
      $(2,2)$. Si la respuesta hubiera salido mayor que $2\sqrt{2}$, sería señal
      segura de que falta normalizar.

  - id: ex1516-5ev-2-el-campo-que-no-mira-el-camino
    titulo: Tres caminos, y un campo al que le dan igual
    fuente: >-
      Ejercicio 2 · Quinta evaluación, SEGUNDO CUATRIMESTRAL, 2 de mayo de 2016 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 3
      comp2: 3
      comp4: 4
    enunciado: |
      Calcular el valor de

      $$
      \int_{C}\left(6xy^{2}-y^{3}\right)dx+\left(6x^{2}y-3xy^{2}\right)dy
      $$

      para cada una de las siguientes curvas $C$:

      a) $C$ es el segmento de recta $AB$, $A(1,2)$, $B(3,4)$.

      b) $C$ es el arco de circunferencia de centro $(2,3)$ que pasa por los
      puntos $A(1,2)$, $B(3,4)$.

      c) $C$ es toda la circunferencia del apartado anterior.
    pide: El valor de la integral en los tres casos.

    pasos:
      - tipo: reconocer
        pregunta: |
          Tres caminos distintos y un solo campo. ¿Qué es lo primero que hay que
          mirar?
        opciones:
          - texto: >-
              Si $P_{y}=Q_{x}$: si el campo es conservativo, los tres apartados
              se contestan con un potencial y sin parametrizar nada
            correcta: true
            mensaje: |
              Eso es. $P_{y}=Q_{x}=12xy-3y^{2}$, así que hay potencial. Y
              entonces a) y b) valen lo mismo —mismos extremos— y c) vale cero,
              por ser cerrada. Tres apartados y ni una parametrización.
          - texto: >-
              Parametrizar el segmento, que es el apartado más fácil, y a partir
              de ahí ir viendo
            mensaje: |
              Se puede, y sale. Pero entonces el apartado b) pide parametrizar un
              arco de circunferencia con senos y cosenos al cubo, y el c) otra
              vez. Comprobar $P_{y}=Q_{x}$ cuesta dos derivadas y ahorra las
              tres parametrizaciones.
          - texto: >-
              Aplicar Green, que convierte cualquiera de las tres en una integral
              doble
            mensaje: |
              Green necesita una curva **cerrada**, y de los tres caminos solo el
              tercero lo es. Para el segmento y el arco no se puede aplicar
              directamente.

      - tipo: calcular
        titulo: El segmento, y también el arco
        pregunta: |
          ¿Cuánto vale la integral a lo largo del segmento de $A(1,2)$ a
          $B(3,4)$?
        respuesta:
          tipo: numero
          valor: '236'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '240'
            mensaje: |
              Ese es $f(B)=f(3,4)$ a secas. Falta restarle $f(A)=f(1,2)=4$: lo
              que vale la integral es la **diferencia** de potencial entre los
              extremos.
          - valor: '-236'
            mensaje: |
              Signo: la integral va de $A$ a $B$, así que es $f(B)-f(A)$, no
              $f(A)-f(B)$.
          - valor: '420'
            mensaje: |
              Te has quedado con $f=3x^{2}y^{2}$ y has perdido el $-xy^{3}$.
              Comprueba tu potencial derivándolo: $f_{x}=6xy^{2}$, y a $P$ le
              falta el $-y^{3}$.
        pista: |
          Busca $f$ con $f_{x}=6xy^{2}-y^{3}$ y evalúa en los dos extremos.
        desarrollo: |
          Integrando $f_{x}=6xy^{2}-y^{3}$ respecto de $x$:

          $$
          f(x,y)=3x^{2}y^{2}-xy^{3}+g(y)
          $$

          Derivando respecto de $y$ y comparando con
          $Q=6x^{2}y-3xy^{2}$ sale $g'(y)=0$, así que
          $f(x,y)=3x^{2}y^{2}-xy^{3}$.

          $$
          f(3,4)=3\cdot 9\cdot 16-3\cdot 64=432-192=240
          $$

          $$
          f(1,2)=3\cdot 1\cdot 4-1\cdot 8=12-8=4
          $$

          $$
          \int_{C}=f(B)-f(A)=240-4=236
          $$

          Y el apartado b) **no hay que calcularlo**: el arco tiene los mismos
          extremos, así que también vale $236$.

      - tipo: calcular
        titulo: La circunferencia entera
        pregunta: |
          ¿Y a lo largo de toda la circunferencia?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '236'
            mensaje: |
              Ese es el valor de $A$ a $B$. La circunferencia entera vuelve al
              punto de partida, así que el extremo final y el inicial son el
              mismo y la diferencia de potencial es cero.
          - valor: '472'
            mensaje: |
              Has sumado los dos arcos con el mismo signo. Recorriendo la
              circunferencia entera, uno se hace de $A$ a $B$ y el otro de $B$ a
              $A$: el segundo aporta $-236$.
        pista: |
          ¿Cuáles son el punto inicial y el final de una curva cerrada?
        desarrollo: |
          $$
          \oint_{C}\nabla f\cdot dr=f(P)-f(P)=0
          $$

          para cualquier punto $P$ de la circunferencia. Con Green se ve
          igual de rápido: $Q_{x}-P_{y}=0$ en todo el plano, así que la integral
          doble es cero sobre cualquier recinto.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $P_{y}=12xy-3y^{2}$ y $Q_{x}=12xy-3y^{2}$ coinciden, y el campo
              está definido en todo el plano, que es simplemente conexo: el campo
              es conservativo.
          - texto: >-
              Un potencial es $f(x,y)=3x^{2}y^{2}-xy^{3}$, y se comprueba
              derivando: $f_{x}=P$ y $f_{y}=Q$.
          - texto: >-
              **a)** $\int_{AB}=f(3,4)-f(1,2)=240-4=236$.
          - texto: >-
              **b)** El arco tiene los mismos extremos que el segmento, así que
              vale lo mismo: $236$. No hay que parametrizar nada.
          - texto: >-
              **c)** La circunferencia entera es cerrada, el punto final coincide
              con el inicial y la integral vale $0$.
          - texto: >-
              El apartado b) está mal planteado, porque por dos puntos y un centro
              pasan dos arcos distintos y cada uno daría un resultado.
            trampa: true
            mensaje: |
              Pasan dos arcos, sí — $A$ y $B$ son incluso diametralmente opuestos,
              porque su punto medio es el centro $(2,3)$. Pero justamente por ser
              el campo conservativo **los dos dan lo mismo**, $236$. La
              ambigüedad del enunciado no es un fallo: es la gracia del
              ejercicio.

    resolucion: |
      **Lo primero: ¿es conservativo?** Con $P=6xy^{2}-y^{3}$ y
      $Q=6x^{2}y-3xy^{2}$:

      $$
      \frac{\partial P}{\partial y}=12xy-3y^{2},
      \qquad
      \frac{\partial Q}{\partial x}=12xy-3y^{2}
      $$

      Coinciden, y el campo está definido en todo $\mathbb{R}^{2}$, que es
      simplemente conexo. Luego hay potencial, y los tres apartados se contestan
      sin parametrizar ni una curva.

      **El potencial.** De $f_{x}=6xy^{2}-y^{3}$, integrando en $x$:

      $$
      f(x,y)=3x^{2}y^{2}-xy^{3}+g(y)
      $$

      Derivando en $y$: $f_{y}=6x^{2}y-3xy^{2}+g'(y)$, que tiene que ser igual a
      $Q$, así que $g'(y)=0$ y $g$ es constante. Se toma cero:

      $$
      f(x,y)=3x^{2}y^{2}-xy^{3}
      $$

      **a) El segmento.**

      $$
      \int_{AB}=f(3,4)-f(1,2)=240-4=236
      $$

      **b) El arco.** Mismos extremos, mismo valor: $236$. Y conviene mirar la
      geometría: $A$ y $B$ están los dos a distancia $\sqrt{2}$ del centro
      $(2,3)$ —están sobre la circunferencia— y su punto medio **es** el centro,
      así que son diametralmente opuestos. Hay por tanto dos arcos posibles, y
      los dos valen $236$. Eso es exactamente lo que significa «no depende del
      camino».

      **c) La circunferencia entera.** Es cerrada: el punto final es el inicial y

      $$
      \oint_{C}=f(P)-f(P)=0
      $$

      **Lo que enseña el ejercicio.** Los tres apartados están puestos en ese
      orden a propósito: el a) se puede hacer a la fuerza, el b) ya duele, y el
      c) es inmediato **si** se ha visto lo del potencial. Quien empieza
      parametrizando llega al final del examen; quien empieza derivando dos veces
      lo termina en un cuarto de folio.

  - id: ex1516-5ev-3-la-hora-del-crimen
    titulo: La hora del crimen, y el dato que pone el forense
    fuente: >-
      Ejercicio 3 · Quinta evaluación, SEGUNDO CUATRIMESTRAL, 2 de mayo de 2016 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 3
      comp2: 3
      comp4: 4
    enunciado: |
      La policía ha encontrado el cadáver de una persona, dentro de una
      habitación. Un modo de determinar aproximadamente la hora de la muerte,
      cuando ha ocurrido pocas horas antes, es estudiar el proceso de
      enfriamiento del cadáver. Se ha tomado la temperatura al cadáver a las
      14:00 y a las 16:00 horas, siendo estos valores 28 °C y 25 °C
      respectivamente. La habitación se encuentra a 20 °C. ¿A qué hora se produjo
      el crimen?

      **Nota:** dejar indicadas las operaciones a efectuar con la calculadora.

      **Nota:** ley de enfriamiento de Newton: el ritmo de cambio de la
      temperatura de un objeto es proporcional a la diferencia entre su
      temperatura y la del ambiente.
    pide: La hora aproximada de la muerte, con las operaciones dejadas indicadas.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da tres temperaturas: 28, 25 y 20. Ninguna sirve como
          condición en el instante de la muerte. ¿Qué falta, y de dónde sale?
        opciones:
          - texto: >-
              La temperatura del cuerpo vivo, 37 °C, que no está en el enunciado
              y hay que ponerla como dato del problema
            correcta: true
            mensaje: |
              Eso es. Es el supuesto que convierte el modelo en una respuesta:
              $T=37$ °C en el instante de la muerte. Conviene escribirlo
              explícitamente en el examen, porque es una hipótesis nuestra y
              COMP4 la pide declarada.
          - texto: >-
              Nada: con dos medidas y el ambiente el problema ya está determinado
            mensaje: |
              Con eso se determina la **curva** $T(t)$ entera, sí. Pero la
              pregunta es en qué instante valía otra cosa, y para responderla hay
              que saber cuál era esa otra cosa. Sin los 37 °C no hay ecuación que
              resolver.
          - texto: >-
              La constante $k$, que depende del cadáver y no se puede conocer
            mensaje: |
              $k$ sí se conoce: para eso están las **dos** medidas. La primera
              fija la constante de integración y la segunda fija $k$. Lo que no
              está en el enunciado es la temperatura inicial.

      - tipo: calcular
        titulo: Lo que decae en dos horas
        pregunta: |
          Tomando $t=0$ a las 14:00, ¿cuánto vale $e^{2k}$?
        respuesta:
          tipo: numero
          valor: '0.625'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.8928571'
            mensaje: |
              Has hecho $\frac{25}{28}$, con las temperaturas. Lo que decae
              exponencialmente no es la temperatura, sino su **diferencia con el
              ambiente**: pasa de $28-20=8$ a $25-20=5$.
          - valor: '1.6'
            mensaje: |
              Lo has puesto del revés, $\frac{8}{5}$. El cuerpo se enfría, así que
              $e^{2k}$ tiene que ser menor que $1$ y $k$ negativo.
          - valor: '0.7905694'
            mensaje: |
              Eso es $e^{k}$, no $e^{2k}$: has repartido el decaimiento entre las
              dos horas. La pregunta es por lo que decae en las dos horas
              enteras, que es $\frac58$.
        pista: |
          Escribe $T(t)=20+Ce^{kt}$, usa $T(0)=28$ para $C$ y $T(2)=25$ después.
        desarrollo: |
          $$
          T(t)=20+Ce^{kt},
          \qquad
          T(0)=28\;\Longrightarrow\;C=8
          $$

          $$
          T(2)=25
          \;\Longrightarrow\;
          8e^{2k}=5
          \;\Longrightarrow\;
          e^{2k}=\frac58=0{,}625
          \;\Longrightarrow\;
          k=\frac12\ln\frac58<0
          $$

      - tipo: calcular
        titulo: Cuántas horas antes de las 14:00
        pregunta: |
          ¿Cuántas horas antes de las 14:00 se produjo la muerte?
        respuesta:
          tipo: numero
          valor: '3.2075148'
          tolerancia: 0.001
          formato: en horas, en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.6037574'
            mensaje: |
              Te has dejado el $2$. El dato $T(2)=25$ está tomado **dos** horas
              después, así que lo que vale $\frac58$ es $e^{2k}$ y no $e^{k}$: la
              constante es $k=\frac12\ln\frac58$.
          - valor: '5.2075148'
            mensaje: |
              Esas son las horas antes de las **16:00**, la segunda medida. Como
              instante da la misma hora del crimen, pero la pregunta está
              referida a las 14:00: son dos horas menos.
          - valor: '2.9495397'
            mensaje: |
              Has usado $36$ °C en vez de $37$. Un grado en la temperatura de
              partida son un cuarto de hora largo en la hora del crimen: por eso
              el resultado se da como aproximado.
        pista: |
          Impón $T(t)=37$ y despeja $t$; te saldrá negativo, y ese signo es la
          respuesta.
        desarrollo: |
          $$
          37=20+8e^{kt}
          \;\Longrightarrow\;
          e^{kt}=\frac{17}{8}
          \;\Longrightarrow\;
          t=\frac{\ln\frac{17}{8}}{\frac12\ln\frac58}
          =\frac{2\ln\frac{17}{8}}{\ln\frac58}
          $$

          El numerador es positivo y el denominador negativo, así que
          $t\approx -3{,}2075$ h: **antes** del instante de referencia, como
          tenía que ser.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La ley de Newton es $\dfrac{dT}{dt}=k\left(T-20\right)$, y su
              solución es $T(t)=20+Ce^{kt}$.
          - texto: >-
              Con $t=0$ a las 14:00, $T(0)=28$ da $C=8$, y $T(2)=25$ da
              $e^{2k}=\frac58$, es decir $k=\frac12\ln\frac58$.
          - texto: >-
              **Hipótesis declarada:** en el instante de la muerte el cuerpo
              estaba a $37$ °C. No está en el enunciado y sin ella el problema no
              tiene solución.
          - texto: >-
              De $37=20+8e^{kt}$ sale
              $t=\dfrac{2\ln\frac{17}{8}}{\ln\frac58}\approx -3{,}21$ h.
          - texto: >-
              Tres horas y doce minutos antes de las 14:00 son, aproximadamente,
              las 10:47.
          - texto: >-
              Como $t$ sale negativo, hay que cambiarle el signo: el crimen se
              produjo unas tres horas **después** de la primera medida.
            trampa: true
            mensaje: |
              El signo negativo no es un error que corregir: es la respuesta. $t$
              se mide desde las 14:00, y negativo significa antes. Además, después
              de las 14:00 el cuerpo estaba a menos de 28 °C y bajando: no hay
              ningún instante posterior en el que valga 37.

    resolucion: |
      **El modelo.** La ley de Newton, con el ambiente a 20 °C:

      $$
      \frac{dT}{dt}=k\left(T-20\right)
      \qquad\Longrightarrow\qquad
      T(t)=20+Ce^{kt}
      $$

      **Las dos medidas.** Se toma $t=0$ a las 14:00, que es la elección que
      menos cuentas da.

      $$
      T(0)=28\;\Longrightarrow\;C=8,
      \qquad
      T(2)=25\;\Longrightarrow\;8e^{2k}=5
      $$

      $$
      e^{2k}=\frac58
      \qquad\Longrightarrow\qquad
      k=\frac12\ln\frac58\approx -0{,}235
      $$

      Fíjate en qué es lo que decae: **no** la temperatura, sino la diferencia
      con el ambiente. De $8$ grados a $5$ en dos horas.

      **El dato que no está escrito.** Para preguntar por la hora de la muerte
      hace falta saber a qué temperatura estaba el cuerpo entonces, y eso el
      enunciado no lo dice. Se toma la temperatura de un cuerpo vivo, 37 °C, y se
      declara como hipótesis: es un supuesto del modelo, no un dato medido.

      **El instante.**

      $$
      37=20+8e^{kt}
      \;\Longrightarrow\;
      e^{kt}=\frac{17}{8}
      \;\Longrightarrow\;
      t=\frac{2\ln\frac{17}{8}}{\ln\frac58}\approx -3{,}2075\ \text{h}
      $$

      Son 3 horas, 12 minutos y 27 segundos antes de las 14:00, es decir, sobre
      las **10:47**.

      **Con qué precisión.** Ninguna, más allá del cuarto de hora. El modelo
      supone que la habitación estuvo siempre a 20 °C, que el cuerpo se enfría
      como un objeto homogéneo y que partía exactamente de 37 °C; cambiar ese
      último dato a 36 °C mueve la respuesta un cuarto de hora largo. Por eso el
      enunciado dice «aproximadamente» y por eso conviene escribirlo en la
      respuesta: en COMP4 se puntúa decir de qué se fía uno.
