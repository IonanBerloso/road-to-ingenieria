ejercicios:
  - id: ex2021-5ev-1-el-semianillo
    titulo: Dos funciones imposibles que se van al derivar
    fuente: >-
      Ejercicio 1 · Quinta evaluación, SEGUNDO PARCIAL, 10 de mayo de 2021 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Calcular

      $$
      \oint_{L}\left(\operatorname{arctg}x + y^{3}\right)dx
      + \left(e^{y}-x^{3}\right)dy
      $$

      donde $L$ es la curva que se muestra en la figura.

      <figure class="figura-examen">
      <svg viewBox="0 0 500 292" role="img" width="500" height="292"
           aria-labelledby="an-t an-d">
        <title id="an-t">La curva L, borde de un medio anillo</title>
        <desc id="an-d">Sobre el eje horizontal hay dos segmentos, de menos tres
        a menos uno y de uno a tres, recorridos hacia la derecha. Los unen dos
        medias circunferencias por encima del eje: la pequena, de radio uno, y
        la grande, de radio tres, recorrida de derecha a izquierda. Entre las
        dos queda medio anillo, y la curva es su borde recorrido en sentido
        positivo.</desc>
        <style>
          .an-eje { stroke: var(--graphite); stroke-width: 1.2; fill: none; }
          .an-c { stroke: var(--ink); stroke-width: 2.4; fill: none; }
          .an-r { fill: var(--graphite); opacity: .12; }
          .an-fl { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
          .an-num { fill: var(--faint); font-size: 12px; font-family: var(--mono); text-anchor: middle; }
          .an-et { fill: var(--ink); font-size: 16px; font-family: var(--mono); font-weight: 700; }
        </style>
        <path class="an-r" d="M64 230A186 186 0 0 1 436 230L312 230A62 62 0 0 0 188 230Z"/>
        <path class="an-eje" d="M30 230L470 230M250 260L250 30"/>
        <path class="an-c" d="M64 230L188 230"/>
        <path class="an-c" d="M312 230L436 230"/>
        <path class="an-c" d="M64 230A186 186 0 0 1 436 230"/>
        <path class="an-c" d="M188 230A62 62 0 0 1 312 230"/>
        <path class="an-fl" d="M118 222L130 230L118 238"/>
        <path class="an-fl" d="M366 222L378 230L366 238"/>
        <path class="an-fl" d="M288 38L276 46L282 58"/>
        <path class="an-fl" d="M244 160L256 168L244 176"/>
        <g class="an-num">
          <text x="64" y="248">−3</text>
          <text x="188" y="248">−1</text>
          <text x="312" y="248">1</text>
          <text x="436" y="248">3</text>
          <text x="236" y="52">3</text>
          <text x="236" y="172">1</text>
        </g>
        <text class="an-et" x="320" y="40">L</text>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original. El original marca tres flechas
      —las dos del eje y la de la circunferencia grande—; la de la
      circunferencia pequeña está implícita, porque la curva es una sola y
      cerrada, y aquí se dibuja para que el sentido se lea de un vistazo.
      </figcaption>
      </figure>
    pide: La circulación del campo a lo largo de la curva cerrada.

    pasos:
      - tipo: reconocer
        pregunta: |
          El campo lleva un $\operatorname{arctg}x$ y una $e^{y}$. ¿Qué hay que
          hacer con ellos?
        opciones:
          - texto: >-
              Nada: al aplicar Green solo intervienen $N_{x}$ y $M_{y}$, y los
              dos desaparecen al derivar
            correcta: true
            mensaje: |
              Exacto. $\operatorname{arctg}x$ no depende de $y$, así que
              $M_{y}$ no lo ve; y $e^{y}$ no depende de $x$, así que $N_{x}$
              tampoco. Los dos están puestos para castigar a quien parametrice
              los cuatro tramos: por ahí habría que integrar
              $\operatorname{arctg}$ y exponenciales de senos.
          - texto: Integrarlos por partes, que es como se integra el arcotangente
            mensaje: |
              Solo haría falta si se parametriza, y es justo lo que Green
              evita. Además sobre los arcos aparecerían
              $\operatorname{arctg}(3\cos t)$ y $e^{3\operatorname{sen}t}$, que
              no tienen primitiva elemental.
          - texto: >-
              Comprobar que el campo es conservativo, porque las dos son
              funciones de una sola variable
            mensaje: |
              Serlo o no depende de $N_{x}$ y $M_{y}$, y aquí valen $-3x^{2}$ y
              $3y^{2}$: no coinciden. Que cada término dependa de una sola
              variable no implica nada.
          - texto: >-
              Aproximarlos por su desarrollo de Taylor
            mensaje: |
              En un examen sin calculadora y con respuesta exacta, aproximar no
              vale. Y no hace falta: el resultado es un múltiplo limpio de
              $\pi$.

      - tipo: calcular
        titulo: El integrando de Green
        pregunta: |
          Escribiendo $N_{x} - M_{y} = k\left(x^{2}+y^{2}\right)$, ¿cuánto vale
          $k$?
        respuesta:
          tipo: numero
          valor: '-3'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              Signo. $N_{x} = -3x^{2}$ y $M_{y} = +3y^{2}$, así que la
              diferencia es $-3x^{2}-3y^{2}$: los dos aportan negativo.
          - valor: '0'
            mensaje: |
              Si fuera 0 el campo sería conservativo y la circulación por una
              curva cerrada valdría cero. $-3x^{2}$ y $3y^{2}$ no se cancelan:
              se suman con el mismo signo al restarlas.
          - valor: '-6'
            mensaje: |
              $-6$ saldría de sumar los dos treses. Cada término aporta un
              $-3$: $-3x^{2}$ por un lado y $-3y^{2}$ por el otro, y el factor
              común es $-3$.
        pista: |
          $N = e^{y}-x^{3}$, así que $N_{x} = -3x^{2}$. Y $M = \operatorname{arctg}x+y^{3}$,
          así que $M_{y} = 3y^{2}$.
        desarrollo: |
          $$
          N_{x} = \frac{\partial}{\partial x}\left(e^{y}-x^{3}\right) = -3x^{2},
          \qquad
          M_{y} = \frac{\partial}{\partial y}\left(\operatorname{arctg}x+y^{3}\right) = 3y^{2}
          $$

          $$
          N_{x}-M_{y} = -3x^{2}-3y^{2} = -3\left(x^{2}+y^{2}\right) = -3r^{2}
          $$

          En polares es inmediato, y esa es la señal de que la región hay que
          describirla en polares: un medio anillo.

      - tipo: calcular
        titulo: La circulación
        pregunta: |
          ¿Cuánto vale la integral?
        respuesta:
          tipo: numero
          valor: '-188.4955592'
          tolerancia: 0.02
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '188.4955592'
            mensaje: |
              $+60\pi$: el signo. El integrando $-3r^{2}$ es **negativo** en
              toda la región, así que la integral tiene que salir negativa —
              con la curva recorrida en el sentido positivo que marcan las
              flechas.
          - valor: '-190.8517'
            mensaje: |
              $-60{,}75\pi$ sale de integrar $r$ de 0 a 3 en vez de 1 a 3: el
              agujero central no está en la región. Hay que restar la parte del
              disco pequeño.
          - valor: '-62.8318531'
            mensaje: |
              $-20\pi$: te falta el 3 del integrando. La integral de $r^{3}$
              entre 1 y 3 da 20, y luego hay que multiplicar por $3\pi$.
        pista: |
          En polares la región es $1\le r\le 3$, $0\le\theta\le\pi$, y
          $dA = r\,dr\,d\theta$. El integrando queda $-3r^{3}$.
        desarrollo: |
          $$
          \oint_{L} = \iint_{D}\left(-3r^{2}\right)dA
          = -3\int_{0}^{\pi}\!\!\int_{1}^{3} r^{2}\cdot r\,dr\,d\theta
          = -3\pi\left[\frac{r^{4}}{4}\right]_{1}^{3}
          $$

          $$
          = -3\pi\cdot\frac{81-1}{4} = -3\pi\cdot 20 = -60\pi \approx -188{,}50
          $$

          El $-1$ del corchete es el agujero: la región es un **medio anillo**,
          no un medio disco, y olvidarlo cambia el resultado en un 1,25 %
          — poco, pero es un error de planteamiento, no de cuenta.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $L$ es una curva cerrada y plana, así que se puede aplicar el
              teorema de Green.
          - texto: >-
              Las flechas del enunciado marcan el sentido **positivo**: los dos
              tramos del eje hacia la derecha y la circunferencia grande de
              derecha a izquierda, dejando la región siempre a la izquierda.
          - texto: >-
              La región que encierra es el medio anillo
              $1\le r\le 3$ con $y\ge 0$.
          - texto: >-
              $N_{x}-M_{y} = -3x^{2}-3y^{2} = -3r^{2}$, y ni el
              $\operatorname{arctg}x$ ni la $e^{y}$ sobreviven a la derivada.
          - texto: >-
              En polares,
              $\iint_{D}\left(-3r^{2}\right)r\,dr\,d\theta
              = -3\pi\frac{3^{4}-1}{4} = -60\pi$.
          - texto: >-
              La circunferencia pequeña forma parte del borde y hay que
              recorrerla en sentido contrario al de la grande, que es lo que
              hace que la región quede siempre a la izquierda.
          - texto: >-
              Como la región tiene un agujero, el teorema de Green no se puede
              aplicar directamente.
            trampa: true
            mensaje: |
              Aquí no hay agujero **dentro** de la región: el medio anillo es
              simplemente conexo, porque el hueco central está abierto por el
              eje. Y aunque lo hubiera, Green vale igual para regiones con
              agujeros siempre que se recorra **todo** el borde con la región a
              la izquierda — que es justo lo que hacen las flechas del
              enunciado. Lo que no se puede es olvidarse de una de las
              componentes del borde.

    resolucion: |
      ## Por qué Green y no parametrizar

      El campo es

      $$
      \vec F = \left(\operatorname{arctg}x + y^{3},\; e^{y}-x^{3}\right)
      $$

      La curva tiene **cuatro tramos** —dos rectos y dos arcos— y sobre los
      arcos habría que integrar $\operatorname{arctg}(3\cos t)$ y
      $e^{3\operatorname{sen}t}$, que no tienen primitiva elemental. El
      enunciado los pone a propósito.

      Con Green ninguno de los dos aparece:

      $$
      N_{x} = -3x^{2}, \qquad M_{y} = 3y^{2}
      $$

      El $\operatorname{arctg}x$ no depende de $y$ y la $e^{y}$ no depende de
      $x$: **desaparecen derivados**.

      ## La región y el sentido

      Las flechas del enunciado marcan los dos tramos del eje hacia la derecha
      y la circunferencia grande de derecha a izquierda. Recorriendo así, la
      región queda **siempre a la izquierda**: es el sentido positivo, y Green
      entra con signo $+$.

      La región es el **medio anillo**

      $$
      D = \left\{1\le r\le 3,\; 0\le\theta\le\pi\right\}
      $$

      ## La cuenta

      $$
      \oint_{L} = \iint_{D}\left(N_{x}-M_{y}\right)dA
      = \iint_{D}\left(-3r^{2}\right)dA
      $$

      $$
      = -3\int_{0}^{\pi}\!\!\int_{1}^{3}r^{3}\,dr\,d\theta
      = -3\pi\cdot\frac{81-1}{4}
      = \boxed{-60\pi \approx -188{,}50}
      $$

      ## Tres cosas que valen los dos puntos de COMP4

      **El signo tiene sentido.** El integrando $-3r^{2}$ es negativo en toda la
      región, así que la circulación tiene que salir negativa. Si sale positiva,
      hay un error de orientación.

      **El agujero cuenta.** La región empieza en $r=1$, no en $r=0$: es un
      anillo. Con $r$ de 0 a 3 saldría $-60{,}75\pi$, y la diferencia no es un
      redondeo sino un planteamiento distinto.

      **La circunferencia pequeña es parte del borde**, y se recorre al revés
      que la grande. Eso no es un capricho: es lo que mantiene la región a la
      izquierda en todo el recorrido.

  - id: ex2021-5ev-2-la-exacta-con-exponencial
    titulo: Tres ecuaciones, y la exacta esconde una exponencial doble
    fuente: >-
      Ejercicio 2 · Quinta evaluación, SEGUNDO PARCIAL, 10 de mayo de 2021 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp2: 8
      comp4: 2
    enunciado: |
      Clasificar razonadamente las siguientes ecuaciones diferenciales y
      resolver la que sea exacta.

      | EDO | Exacta | Homogénea | Lineal |
      |---|---|---|---|
      | $2\left(x^{3}+xy^{2}\right)y' = y^{3}+2x^{2}y$ | | | |
      | $\left(1-\cos x\right)dy + \left(2y\operatorname{sen}x-\operatorname{tg}x\right)dx = 0$ | | | |
      | $y' = \dfrac{y^{2}e^{xy^{2}}+4x^{3}}{3y^{2}-2xye^{xy^{2}}}$ | | | |
    pide: Clasificar las tres y resolver la exacta.

    pasos:
      - tipo: reconocer
        pregunta: |
          La tercera trae $e^{xy^{2}}$ en el numerador y en el denominador.
          ¿Qué sugiere eso?
        opciones:
          - texto: >-
              Que probablemente sea la exacta, y que su potencial contenga
              $e^{xy^{2}}$
            correcta: true
            mensaje: |
              Buena lectura. Cuando la misma expresión aparece derivada respecto
              de $x$ en un sitio y respecto de $y$ en el otro, suele venir de
              una sola función. Y aquí es así: $\partial_{x}e^{xy^{2}} = y^{2}e^{xy^{2}}$
              y $\partial_{y}e^{xy^{2}} = 2xye^{xy^{2}}$, que son justo los dos
              términos que se ven.
          - texto: Que hay que hacer un cambio de variable $u = xy^{2}$
            mensaje: |
              No hace falta: si la ecuación es exacta, el potencial se obtiene
              integrando directamente, y esa exponencial sale sola.
          - texto: Que no se puede resolver de forma cerrada
            mensaje: |
              Sí se puede, y la solución es limpia. Que una exponencial tenga un
              exponente compuesto no impide nada mientras la ecuación sea
              exacta.
          - texto: >-
              Que es homogénea, porque $xy^{2}$ tiene grado 3 igual que $4x^{3}$
            mensaje: |
              Una exponencial nunca es homogénea: $e^{\lambda^{3}xy^{2}}$ no es
              $\lambda^{k}e^{xy^{2}}$ para ningún $k$. La homogeneidad exige que
              al escalar $x$ e $y$ salga un factor común, y la exponencial
              rompe eso.

      - tipo: calcular
        titulo: El grado de la primera
        pregunta: |
          En $\left(y^{3}+2x^{2}y\right)dx - 2\left(x^{3}+xy^{2}\right)dy = 0$,
          ¿de qué grado son homogéneos $M$ y $N$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es el exponente mayor que se ve suelto, pero el grado suma todas
              las letras: $2x^{2}y$ es de grado $2+1=3$, igual que $y^{3}$.
          - valor: '1'
            mensaje: |
              Grado 1 sería $ax+by$. Aquí todos los sumandos son cúbicos.
          - valor: '4'
            mensaje: |
              4 saldría si algún término fuera $x^{2}y^{2}$ o similar. Repasa:
              $y^{3}$, $x^{2}y$, $x^{3}$ y $xy^{2}$ son todos de grado 3.
        pista: |
          Sustituye $x\to\lambda x$, $y\to\lambda y$ y mira qué potencia de
          $\lambda$ sale factor común.
        desarrollo: |
          $$
          M(\lambda x,\lambda y) = \lambda^{3}y^{3}+2\lambda^{3}x^{2}y
          = \lambda^{3}M(x,y)
          $$
          $$
          N(\lambda x,\lambda y) = -2\left(\lambda^{3}x^{3}+\lambda^{3}xy^{2}\right)
          = \lambda^{3}N(x,y)
          $$

          Los dos de **grado 3**: la ecuación es homogénea. Y no es exacta,
          porque $M_{y} = 3y^{2}+2x^{2}$ y $N_{x} = -6x^{2}-2y^{2}$ no
          coinciden.

      - tipo: calcular
        titulo: La constante de la solución, en un punto
        pregunta: |
          La solución de la exacta es $e^{xy^{2}} + x^{4} - y^{3} = C$. Para la
          curva que pasa por $(0,1)$, ¿cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es $e^{0}$, el primer sumando. Pero hay que restarle
              $y^{3} = 1$: $1 + 0 - 1 = 0$.
          - valor: '2'
            mensaje: |
              2 sale de sumar $e^{0}$ y $y^{3}$ en vez de restar. El signo del
              término en $y$ es negativo.
          - valor: '-1'
            mensaje: |
              $-1$ olvidaría el $e^{xy^{2}}$, que en $(0,1)$ vale $e^{0}=1$.
        pista: |
          En $(0,1)$: $xy^{2} = 0$, $x^{4} = 0$ e $y^{3} = 1$.
        desarrollo: |
          $$
          C = e^{0\cdot 1} + 0^{4} - 1^{3} = 1 + 0 - 1 = 0
          $$

          Y conviene comprobar que $F = e^{xy^{2}}+x^{4}-y^{3}$ es realmente el
          potencial:

          $$
          F_{x} = y^{2}e^{xy^{2}} + 4x^{3} = M \quad\checkmark
          $$
          $$
          F_{y} = 2xye^{xy^{2}} - 3y^{2} = N \quad\checkmark
          $$

      - tipo: justificar
        titulo: La clasificación y la resolución
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              **La primera**, escrita $\left(y^{3}+2x^{2}y\right)dx - 2\left(x^{3}+xy^{2}\right)dy = 0$,
              tiene $M_{y} = 3y^{2}+2x^{2}$ y $N_{x} = -6x^{2}-2y^{2}$: no es
              exacta, pero $M$ y $N$ son homogéneas de grado 3, así que es
              **homogénea**.
          - texto: >-
              **La segunda** tiene $M_{y} = 2\operatorname{sen}x$ y
              $N_{x} = \operatorname{sen}x$: tampoco es exacta. Pero despejada
              es $y' + \frac{2\operatorname{sen}x}{1-\cos x}\,y = \frac{\operatorname{tg}x}{1-\cos x}$:
              es **lineal**.
          - texto: >-
              **La tercera**, escrita
              $\left(y^{2}e^{xy^{2}}+4x^{3}\right)dx + \left(2xye^{xy^{2}}-3y^{2}\right)dy = 0$,
              cumple $M_{y} = N_{x} = 2ye^{xy^{2}}\left(1+xy^{2}\right)$: es
              **exacta**.
          - texto: >-
              Para resolverla se integra $M$ respecto de $x$:
              $F = e^{xy^{2}} + x^{4} + g(y)$.
          - texto: >-
              Derivando respecto de $y$ e igualando a $N$:
              $2xye^{xy^{2}} + g'(y) = 2xye^{xy^{2}} - 3y^{2}$, luego
              $g'(y) = -3y^{2}$ y $g = -y^{3}$.
          - texto: >-
              La solución es $e^{xy^{2}} + x^{4} - y^{3} = C$, en forma
              implícita.
          - texto: >-
              Como la solución es implícita, hay que despejar $y$ para que la
              respuesta esté completa.
            trampa: true
            mensaje: |
              No se puede, y no hace falta. De $e^{xy^{2}}+x^{4}-y^{3}=C$ no se
              despeja $y$ con funciones elementales — la $y$ aparece dentro de
              una exponencial y fuera, elevada al cubo. La forma implícita **es**
              la solución de una ecuación exacta; exigir la explícita es pedir
              algo que en general no existe.

    resolucion: |
      ## Las tres, comprobadas

      | ecuación | exacta | homogénea | lineal |
      |---|---|---|---|
      | $2\left(x^{3}+xy^{2}\right)y' = y^{3}+2x^{2}y$ | | **✓** | |
      | $\left(1-\cos x\right)dy+\left(2y\operatorname{sen}x-\operatorname{tg}x\right)dx=0$ | | | **✓** |
      | $y' = \frac{y^{2}e^{xy^{2}}+4x^{3}}{3y^{2}-2xye^{xy^{2}}}$ | **✓** | | |

      **La primera.** En forma diferencial,
      $\left(y^{3}+2x^{2}y\right)dx - 2\left(x^{3}+xy^{2}\right)dy = 0$:

      $$
      M_{y} = 3y^{2}+2x^{2}, \qquad N_{x} = -6x^{2}-2y^{2}
      $$

      No coinciden. Pero $M$ y $N$ son homogéneas de grado 3, así que
      $\frac{dy}{dx}$ solo depende de $y/x$: **homogénea**.

      **La segunda.**

      $$
      M_{y} = 2\operatorname{sen}x, \qquad N_{x} = \operatorname{sen}x
      $$

      Tampoco. Pero al despejar aparece la forma canónica:

      $$
      y' + \frac{2\operatorname{sen}x}{1-\cos x}\,y = \frac{\operatorname{tg}x}{1-\cos x}
      $$

      **lineal** de primer orden.

      **La tercera.** Pasando el denominador:

      $$
      \left(y^{2}e^{xy^{2}}+4x^{3}\right)dx + \left(2xye^{xy^{2}}-3y^{2}\right)dy = 0
      $$

      $$
      M_{y} = 2ye^{xy^{2}} + 2xy^{3}e^{xy^{2}} = 2ye^{xy^{2}}\left(1+xy^{2}\right)
      $$
      $$
      N_{x} = 2ye^{xy^{2}} + 2xy^{3}e^{xy^{2}} = 2ye^{xy^{2}}\left(1+xy^{2}\right)
      $$

      Coinciden: **exacta**. Y la señal estaba a la vista antes de derivar — la
      misma exponencial $e^{xy^{2}}$ aparece multiplicada por $y^{2}$ en un
      término y por $2xy$ en el otro, que son exactamente sus dos derivadas
      parciales.

      ## Resolver la exacta

      $$
      F_{x} = y^{2}e^{xy^{2}}+4x^{3}
      \;\Longrightarrow\;
      F = e^{xy^{2}} + x^{4} + g(y)
      $$

      —la integral de $y^{2}e^{xy^{2}}$ respecto de $x$ es directa, porque
      $y^{2}$ es la derivada del exponente respecto de $x$.

      $$
      F_{y} = 2xye^{xy^{2}} + g'(y) = 2xye^{xy^{2}} - 3y^{2}
      \;\Longrightarrow\;
      g'(y) = -3y^{2}
      \;\Longrightarrow\;
      g(y) = -y^{3}
      $$

      $$
      \boxed{\;e^{xy^{2}} + x^{4} - y^{3} = C\;}
      $$

      ## Por qué se queda implícita

      No se puede despejar $y$: aparece dentro de la exponencial y fuera,
      elevada al cubo. Y no pasa nada — la forma implícita es la solución de
      una ecuación exacta, y buscar la explícita es pedir algo que en general
      no existe. Decirlo cierra el ejercicio.

  - id: ex2021-5ev-3-recta-y-resonancia
    titulo: Un polinomio que no resuena y un coseno que sí
    fuente: >-
      Ejercicio 3 · Quinta evaluación, SEGUNDO PARCIAL, 10 de mayo de 2021 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp2: 8
      comp4: 2
    enunciado: |
      Resolver la EDO
      $y'' + 25y = 10x - 4 + 20\cos 5x$.
    pide: La solución general.

    pasos:
      - tipo: reconocer
        pregunta: |
          El segundo miembro tiene dos partes muy distintas. ¿Cómo se atacan?
        opciones:
          - texto: >-
              Por superposición: una particular para $10x-4$ y otra para
              $20\cos 5x$, y se suman
            correcta: true
            mensaje: |
              Eso es, y aquí es imprescindible porque las dos necesitan ensayos
              distintos: el polinomio no resuena y el coseno sí. Mezclarlas en
              un solo ensayo lleva a un sistema incompatible.
          - texto: >-
              Con un solo ensayo que junte todo:
              $Ax+B+C\cos 5x+D\operatorname{sen}5x$
            mensaje: |
              Ese ensayo falla, y no por pereza: el término
              $C\cos 5x + D\operatorname{sen}5x$ **es** solución de la
              homogénea, así que al sustituir se anula y no puede producir el
              $20\cos 5x$. Hace falta la $x$ delante en esa parte, y solo en
              esa.
          - texto: Variación de constantes, que sirve siempre
            mensaje: |
              Sirve, sí, pero aquí es el camino largo: las dos partes son de las
              que admiten coeficientes indeterminados, y variación de constantes
              obligaría a integrar $x\operatorname{sen}5x$ y compañía.
          - texto: >-
              Resolviendo primero con $10x-4$ y usando esa solución como
              homogénea para el coseno
            mensaje: |
              La homogénea es siempre la misma, la de $y''+25y=0$. La
              superposición suma **particulares**, no encadena problemas.

      - tipo: calcular
        titulo: El coeficiente del término lineal
        pregunta: |
          Ensayando $y_{p} = Ax+B$ para el sumando $10x-4$, ¿cuánto vale $A$?
        respuesta:
          tipo: numero
          valor: '0.4'
          tolerancia: 0.002
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '10'
            mensaje: |
              10 es el coeficiente del enunciado. Al sustituir, $y_{p}''=0$ y
              queda $25(Ax+B) = 10x-4$, así que $25A = 10$.
          - valor: '2.5'
            mensaje: |
              $25/10$: has dividido al revés. De $25A = 10$ sale
              $A = \frac{10}{25} = \frac25$.
          - valor: '-0.16'
            mensaje: |
              Eso es $B = -\frac{4}{25}$, el término independiente del ensayo.
              La pregunta es por el coeficiente de $x$.
        pista: |
          $y_{p} = Ax+B$ tiene segunda derivada nula, así que la ecuación queda
          $25(Ax+B) = 10x-4$. Iguala coeficientes.
        desarrollo: |
          $$
          y_{p}'' + 25y_{p} = 0 + 25(Ax+B) = 10x-4
          $$

          Igualando coeficientes:

          $$
          25A = 10 \;\Rightarrow\; A = \frac{2}{5},
          \qquad
          25B = -4 \;\Rightarrow\; B = -\frac{4}{25}
          $$

          Sin resonancia: un polinomio no es solución de $y''+25y=0$, cuyas
          soluciones son senos y cosenos.

      - tipo: calcular
        titulo: El coeficiente del término que resuena
        pregunta: |
          Ensayando $y_{p} = x\left(C\cos 5x + D\operatorname{sen}5x\right)$
          para $20\cos 5x$, ¿cuánto vale $D$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              El que vale 0 es $C$, el del coseno. Los papeles se cruzan: al
              derivar dos veces, la parte del seno del ensayo alimenta al coseno
              del resultado.
          - valor: '20'
            mensaje: |
              20 es el coeficiente del enunciado. Al sustituir queda
              $10D\cos 5x = 20\cos 5x$, así que hay que dividir entre 10.
          - valor: '-2'
            mensaje: |
              Signo. La parte en coseno del resultado es $+10D\cos 5x$, así que
              $D$ sale positivo.
        pista: |
          Con el ensayo $x(C\cos 5x+D\operatorname{sen}5x)$, los términos con
          $x$ se cancelan contra $25y_{p}$ y queda
          $-10C\operatorname{sen}5x + 10D\cos 5x$.
        desarrollo: |
          $$
          y_{p}'' + 25y_{p} = -10C\operatorname{sen}5x + 10D\cos 5x
          $$

          Igualando a $20\cos 5x$:

          $$
          -10C = 0 \;\Rightarrow\; C = 0,
          \qquad
          10D = 20 \;\Rightarrow\; D = 2
          $$

          $$
          y_{p_{2}} = 2x\operatorname{sen}5x
          $$

          El coeficiente que aparece, $2\omega = 10$, es el mismo mecanismo de
          siempre: al derivar dos veces el producto $x\cdot(\text{oscilación})$,
          lo único que sobrevive es el término cruzado.

      - tipo: justificar
        titulo: La solución general
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $r^{2}+25 = 0$ da $r = \pm 5i$, así que
              $y_{h} = C_{1}\cos 5x + C_{2}\operatorname{sen}5x$.
          - texto: >-
              Por superposición se buscan dos particulares, una para cada
              sumando del segundo miembro.
          - texto: >-
              Para $10x-4$ no hay resonancia: el ensayo $Ax+B$ da
              $A=\frac25$ y $B=-\frac{4}{25}$.
          - texto: >-
              Para $20\cos 5x$ sí la hay, porque $\cos 5x$ está en la
              homogénea: el ensayo lleva una $x$ delante y da $C=0$, $D=2$.
          - texto: >-
              La solución general es
              $y = C_{1}\cos 5x + C_{2}\operatorname{sen}5x
              + \frac25 x - \frac{4}{25} + 2x\operatorname{sen}5x$.
          - texto: >-
              El término $2x\operatorname{sen}5x$ crece sin límite, que es lo
              que significa físicamente excitar un sistema a su frecuencia
              propia.
          - texto: >-
              Como $\operatorname{sen}5x$ ya está en la homogénea, el término
              $2x\operatorname{sen}5x$ se puede absorber en $C_{2}$.
            trampa: true
            mensaje: |
              No se puede: $C_{2}\operatorname{sen}5x$ y
              $2x\operatorname{sen}5x$ son funciones **distintas** —una está
              acotada y la otra no—, así que no hay ninguna constante que las
              identifique. Lo que sí se absorbe en $C_{1}$ y $C_{2}$ son las
              constantes de integración que aparecerían al resolver por
              variación de constantes, que son múltiplos de $\cos 5x$ y
              $\operatorname{sen}5x$ **sin** la $x$.

    resolucion: |
      ## La homogénea

      $$
      r^{2}+25 = 0 \;\Longrightarrow\; r = \pm 5i
      \;\Longrightarrow\;
      y_{h} = C_{1}\cos 5x + C_{2}\operatorname{sen}5x
      $$

      ## Dos sumandos, dos ensayos

      El segundo miembro es $10x-4+20\cos 5x$, y las dos partes se tratan por
      separado. La diferencia entre ellas es todo el ejercicio.

      **$10x-4$ — sin resonancia.** Las soluciones homogéneas son
      oscilaciones; un polinomio no está entre ellas.

      $$
      y_{p_{1}} = Ax+B
      \;\Longrightarrow\;
      25(Ax+B) = 10x-4
      \;\Longrightarrow\;
      A = \frac25,\quad B = -\frac{4}{25}
      $$

      **$20\cos 5x$ — con resonancia.** $\cos 5x$ **es** solución de la
      homogénea, así que el ensayo lleva una $x$ delante:

      $$
      y_{p_{2}} = x\left(C\cos 5x + D\operatorname{sen}5x\right)
      $$
      $$
      y_{p_{2}}''+25y_{p_{2}} = -10C\operatorname{sen}5x + 10D\cos 5x = 20\cos 5x
      $$
      $$
      C = 0, \qquad D = 2
      $$

      ## La solución

      $$
      \boxed{\;y = C_{1}\cos 5x + C_{2}\operatorname{sen}5x
      + \frac{2}{5}x - \frac{4}{25} + 2x\operatorname{sen}5x\;}
      $$

      ## Lo que dice cada trozo

      Merece la pena leer la solución, que es lo que valen los dos puntos de
      COMP4:

      | término | qué es |
      |---|---|
      | $C_{1}\cos 5x + C_{2}\operatorname{sen}5x$ | la oscilación libre, acotada |
      | $\frac25 x - \frac{4}{25}$ | la respuesta a la parte lineal, una recta |
      | $2x\operatorname{sen}5x$ | la **resonancia**: crece sin límite |

      El último es el interesante. Excitar el sistema justo a su frecuencia
      propia —5, la misma que la de la homogénea— hace que la amplitud crezca
      linealmente con $x$ en vez de estabilizarse. Y no se puede absorber en
      $C_{2}$: $x\operatorname{sen}5x$ y $\operatorname{sen}5x$ son funciones
      distintas, una acotada y la otra no.
