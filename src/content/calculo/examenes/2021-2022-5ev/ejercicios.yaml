ejercicios:
  - id: ex2122-5ev-1-la-helice-y-el-potencial
    titulo: Una hélice entera que no hay que recorrer
    fuente: >-
      Ejercicio 1 · Quinta evaluación, 16 de mayo de 2022 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Calcular la integral de línea

      $$
      \int_{L}\left(yz+y+1\right)dx + \left(xz+x\right)dy + \left(xy+3z^{2}\right)dz
      $$

      entre los puntos $A(1,0,0)$ y $B(1,0,2\pi)$ de la curva

      $$
      L:\quad
      \begin{cases}
      x(t) = \cos t \\
      y(t) = \operatorname{sen}t \\
      z(t) = t
      \end{cases}
      $$
    pide: El valor de la integral entre esos dos puntos de la hélice.

    pasos:
      - tipo: reconocer
        pregunta: |
          La curva es una hélice que da una vuelta entera. ¿Hay que
          parametrizar?
        opciones:
          - texto: >-
              Solo si el campo no es conservativo — y conviene comprobarlo
              antes, porque si lo es basta con los extremos
            correcta: true
            mensaje: |
              Y lo es. El rotacional se anula, así que la integral vale
              $f(B)-f(A)$ y la hélice —con toda su vuelta— no interviene. Es
              exactamente lo que el ejercicio está midiendo: que no te lances a
              integrar antes de mirar.
          - texto: 'Sí, siempre: la curva viene dada en paramétricas'
            mensaje: |
              Que venga parametrizada es una comodidad del enunciado, no una
              obligación. Si el campo deriva de un potencial, la parametrización
              sobra por completo.
          - texto: >-
              No, porque al dar una vuelta entera la curva es cerrada y la
              integral vale cero
            mensaje: |
              La curva **no** es cerrada: da una vuelta en $x$ e $y$, sí, pero
              $z$ sube de 0 a $2\pi$. A y B están uno encima del otro, no son
              el mismo punto. Y precisamente ahí está toda la respuesta.
          - texto: >-
              Sí, y además hay que comprobar que la curva pasa por A y por B
            mensaje: |
              Comprobarlo está bien —$t=0$ da $(1,0,0)$ y $t=2\pi$ da
              $(1,0,2\pi)$—, pero eso no obliga a parametrizar la integral.

      - tipo: calcular
        titulo: El potencial en B
        pregunta: |
          El potencial del campo es $f(x,y,z) = xyz + xy + x + z^{3}$. ¿Cuánto
          vale en $B(1,0,2\pi)$?
        respuesta:
          tipo: numero
          valor: '249.0502134'
          tolerancia: 0.01
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '248.0502134'
            mensaje: |
              Eso es $8\pi^{3}$, que es el **resultado** del ejercicio:
              $f(B)-f(A)$. En $f(B)$ falta el $+1$ que aporta el término $x$.
          - valor: '31.0062767'
            mensaje: |
              $\pi^{3}$: te has dejado el 8. El término es $z^{3}$ con
              $z = 2\pi$, así que $(2\pi)^{3} = 8\pi^{3}$.
          - valor: '1'
            mensaje: |
              1 es $f(A)$. En B la coordenada $z$ vale $2\pi$ y aporta
              $8\pi^{3}$.
        pista: |
          En B: $x=1$, $y=0$, $z=2\pi$. Los tres primeros términos llevan una
          $y$ salvo uno.
        desarrollo: |
          $$
          f(1,0,2\pi) = \underbrace{1\cdot 0\cdot 2\pi}_{0}
          + \underbrace{1\cdot 0}_{0} + \underbrace{1}_{x} + (2\pi)^{3}
          = 1 + 8\pi^{3} \approx 249{,}05
          $$

      - tipo: calcular
        titulo: La integral
        pregunta: |
          ¿Cuánto vale la integral de línea?
        respuesta:
          tipo: numero
          valor: '248.0502134'
          tolerancia: 0.01
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0'
            mensaje: |
              0 sería si la curva fuera cerrada, y no lo es: la hélice sube
              hasta $z = 2\pi$, así que A y B son puntos distintos aunque
              tengan la misma $x$ y la misma $y$.
          - valor: '-248.0502134'
            mensaje: |
              Signo cambiado: has restado $f(A)-f(B)$. La integral va **de** A
              **a** B, así que es $f(B)-f(A)$.
          - valor: '249.0502134'
            mensaje: |
              Eso es $f(B)$. Falta restarle $f(A) = 1$.
        pista: |
          En un campo conservativo la integral vale $f(B) - f(A)$, y
          $f(A) = f(1,0,0) = 1$.
        desarrollo: |
          $$
          \int_{L} = f(B) - f(A) = \left(1+8\pi^{3}\right) - 1 = 8\pi^{3} \approx 248{,}05
          $$

          Toda la vuelta de la hélice ha sido irrelevante: lo único que cuenta
          es que B está $2\pi$ más arriba que A.

      - tipo: justificar
        titulo: Por qué basta con los extremos
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Se comprueba primero si el campo es conservativo, calculando el
              rotacional.
          - texto: >-
              $\partial_{y}(yz+y+1) = z+1 = \partial_{x}(xz+x)$,
              $\partial_{z}(yz+y+1) = y = \partial_{x}(xy+3z^{2})$ y
              $\partial_{z}(xz+x) = x = \partial_{y}(xy+3z^{2})$: el rotacional
              es nulo.
          - texto: >-
              El campo está definido en todo $\mathbb{R}^{3}$, que es
              simplemente conexo, así que rotacional nulo implica que existe
              potencial.
          - texto: >-
              Integrando, $f(x,y,z) = xyz + xy + x + z^{3}$, y se comprueba que
              $\nabla f$ devuelve el campo.
          - texto: >-
              La curva pasa por A en $t=0$ y por B en $t=2\pi$, así que la
              integral vale $f(B)-f(A) = 8\pi^{3}$.
          - texto: >-
              Como la hélice da una vuelta completa, la integral es cero por
              tratarse de una curva cerrada.
            trampa: true
            mensaje: |
              La hélice **no se cierra**: al dar la vuelta, la tercera
              coordenada ha subido de 0 a $2\pi$, así que el punto final está
              encima del inicial, no en el mismo sitio. Y eso es precisamente lo
              que hace que el resultado no sea cero: los términos en $x$ e $y$
              vuelven a su valor de partida y todo lo que queda viene del
              $z^{3}$ del potencial.

    resolucion: |
      ## Lo primero, y decide el ejercicio

      $$
      \vec F = \left(yz+y+1,\; xz+x,\; xy+3z^{2}\right)
      $$

      Las tres comprobaciones cruzadas:

      $$
      \frac{\partial}{\partial y}(yz+y+1) = z+1 = \frac{\partial}{\partial x}(xz+x)
      $$
      $$
      \frac{\partial}{\partial z}(yz+y+1) = y = \frac{\partial}{\partial x}(xy+3z^{2})
      $$
      $$
      \frac{\partial}{\partial z}(xz+x) = x = \frac{\partial}{\partial y}(xy+3z^{2})
      $$

      El rotacional es nulo, y el campo está definido en todo $\mathbb{R}^{3}$
      —simplemente conexo—, así que **es conservativo**. Esa segunda condición
      hay que decirla: sin ella, rotacional nulo no basta.

      ## El potencial

      $$
      f_{x} = yz+y+1 \;\Rightarrow\; f = xyz+xy+x+g(y,z)
      $$
      $$
      f_{y} = xz+x+g_{y} = xz+x \;\Rightarrow\; g_{y}=0
      $$
      $$
      f_{z} = xy+g_{z} = xy+3z^{2} \;\Rightarrow\; g = z^{3}
      $$

      $$
      f(x,y,z) = xyz + xy + x + z^{3}
      $$

      ## El resultado

      La curva pasa por $A(1,0,0)$ en $t=0$ y por $B(1,0,2\pi)$ en $t=2\pi$:

      $$
      f(A) = 1, \qquad f(B) = 1 + 8\pi^{3}
      $$

      $$
      \boxed{\;\int_{L} = f(B)-f(A) = 8\pi^{3} \approx 248{,}05\;}
      $$

      ## Lo que el enunciado está tentando

      Dar la curva en paramétricas, y encima una hélice completa, es una
      invitación a sustituir y ponerse a integrar $\operatorname{sen}$,
      $\cos$ y $t$ mezclados durante media hoja. Sale lo mismo —está
      comprobado—, pero el ejercicio pide reconocer que **la curva no
      importa**.

      Y hay una trampa de segundo orden: como la hélice da una vuelta entera,
      es tentador decir «es cerrada, luego vale 0». No lo es. En $x$ e $y$
      vuelve al punto de partida, pero $z$ ha subido $2\pi$. De hecho todo el
      resultado sale de ahí: los términos con $x$ e $y$ del potencial valen lo
      mismo en A y en B, y lo único que cambia es $z^{3}$.

  - id: ex2122-5ev-2-la-masa-de-un-alambre
    titulo: La otra integral de línea, la que no lleva vector
    fuente: >-
      Ejercicio 2 · Quinta evaluación, 16 de mayo de 2022 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 8
      comp4: 1
    enunciado: |
      Calcular la masa de la parte de la circunferencia $x^{2}+y^{2}=1$ situada
      en el primer cuadrante y comprendida entre los puntos $A(1,0)$ y
      $B(0,1)$, sabiendo que la densidad puntual es $f(x,y) = xy$.
    pide: La masa de ese cuarto de circunferencia.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tipo de integral de línea es esta?
        opciones:
          - texto: >-
              Respecto del **arco**: $\int_{C} f\,ds$, con $f$ escalar y sin
              ningún vector
            correcta: true
            mensaje: |
              Eso es, y es la diferencia que este ejercicio mide. La densidad es
              un **escalar**, no un campo vectorial, y lo que se suma es masa
              por trocito de longitud. Por eso aparece $ds$ y no
              $d\vec r$ — y por eso el sentido de recorrido no importa.
          - texto: >-
              De un campo vectorial, $\int \vec F\cdot d\vec r$
            mensaje: |
              No hay campo vectorial: $f(x,y) = xy$ es un número en cada punto,
              no una flecha. Si fuera vectorial habría dos componentes y el
              resultado dependería del sentido.
          - texto: Una integral doble sobre el cuarto de disco
            mensaje: |
              La masa que se pide es la de un **alambre**, no la de una placa:
              el enunciado dice «la parte de la circunferencia», que es la
              curva, no el sector. Una integral doble daría la masa de la
              región de dentro.
          - texto: >-
              De flujo, porque la densidad atraviesa la curva
            mensaje: |
              El flujo mide cuánto de un campo vectorial cruza la curva, y aquí
              no hay campo que cruce nada: hay un alambre con densidad variable
              y se pide cuánto pesa.

      - tipo: calcular
        titulo: El elemento de arco
        pregunta: |
          Parametrizando $x=\cos t$, $y=\operatorname{sen}t$, ¿cuánto vale
          $ds$ en función de $dt$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.002
          formato: un número (el factor que multiplica a dt)
        distractores:
          - valor: '0'
            mensaje: |
              Si $ds$ fuera cero la curva no tendría longitud. $ds$ es el módulo
              del vector velocidad, y el de
              $(-\operatorname{sen}t, \cos t)$ vale 1.
          - valor: '6.2831853'
            mensaje: |
              $2\pi$ es la longitud de la circunferencia entera, no el factor
              del elemento de arco.
          - valor: '1.5707963'
            mensaje: |
              $\frac\pi2$ es la longitud del **cuarto** de circunferencia, o sea
              $\int ds$. El factor que multiplica a $dt$ es 1.
        pista: |
          $ds = \sqrt{x'(t)^{2}+y'(t)^{2}}\,dt$, y aquí
          $x' = -\operatorname{sen}t$, $y' = \cos t$.
        desarrollo: |
          $$
          ds = \sqrt{\left(-\operatorname{sen}t\right)^{2}+\left(\cos t\right)^{2}}\,dt
          = \sqrt{1}\,dt = dt
          $$

          Sale 1 porque el radio es 1: en una circunferencia de radio $R$
          saldría $ds = R\,dt$. Comprobarlo cuesta una línea y evita el error
          más común de estas integrales, que es olvidar el factor.

      - tipo: calcular
        titulo: La masa
        pregunta: |
          ¿Cuánto vale la masa?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.002
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              1 sale de olvidar el $\frac12$ de la primitiva:
              $\int\operatorname{sen}t\cos t\,dt = \frac{\operatorname{sen}^{2}t}{2}$.
          - valor: '0.7853982'
            mensaje: |
              $\frac{\pi}{4}$ es lo que saldría con densidad **constante 1/2**,
              o media longitud del arco. Aquí la densidad varía: vale 0 en los
              dos extremos y máximo en el medio.
          - valor: '0.25'
            mensaje: |
              $\frac14$ sale de evaluar mal los límites: en $t=\frac\pi2$,
              $\operatorname{sen}^{2}t$ vale 1, no $\frac12$.
        pista: |
          $\int_{0}^{\pi/2}\cos t\operatorname{sen}t\,dt$. Con
          $u = \operatorname{sen}t$ es inmediata.
        desarrollo: |
          $$
          m = \int_{C} xy\,ds
          = \int_{0}^{\pi/2}\cos t\operatorname{sen}t\,dt
          = \left[\frac{\operatorname{sen}^{2}t}{2}\right]_{0}^{\pi/2}
          = \frac12
          $$

          Y tiene sentido: la densidad $xy$ vale **cero en los dos extremos**
          —en $A(1,0)$ y en $B(0,1)$ una de las dos coordenadas es nula— y es
          máxima en el punto medio del arco, donde $x=y=\frac{\sqrt2}{2}$ y
          $xy=\frac12$. El alambre es más pesado por el centro.

      - tipo: justificar
        titulo: La resolución
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La densidad es un escalar, así que la masa es la integral de línea
              **respecto del arco**: $m = \int_{C} f\,ds$.
          - texto: >-
              El arco es el cuarto de circunferencia unidad del primer
              cuadrante, que se parametriza con $x=\cos t$,
              $y=\operatorname{sen}t$, $t\in\left[0,\frac\pi2\right]$.
          - texto: >-
              $ds = \sqrt{x'^{2}+y'^{2}}\,dt = dt$, porque el radio es 1.
          - texto: >-
              $m = \int_{0}^{\pi/2}\cos t\operatorname{sen}t\,dt
              = \left[\frac{\operatorname{sen}^{2}t}{2}\right]_{0}^{\pi/2} = \frac12$.
          - texto: >-
              El resultado no depende del sentido de recorrido: en una integral
              respecto del arco, $ds$ es siempre positivo.
          - texto: >-
              Como la densidad se anula en A y en B, la masa total también
              tiende a cero.
            trampa: true
            mensaje: |
              Que una función valga cero en dos puntos no dice nada de su
              integral: entre medias vale hasta $\frac12$. Es el mismo error
              que decir que el área bajo una parábola que corta el eje en dos
              sitios es nula. Lo que sí se puede sacar de esos ceros es una
              cota: la masa es menor que la densidad máxima por la longitud,
              $\frac12\cdot\frac\pi2 \approx 0{,}785$ — y en efecto $0{,}5$ está
              por debajo.

    resolucion: |
      ## Qué integral es

      La densidad $f(x,y)=xy$ es **escalar**: un número en cada punto, no una
      flecha. Así que la masa de un alambre es la integral de línea respecto del
      arco:

      $$
      m = \int_{C} f(x,y)\,ds
      $$

      Es la otra integral de línea, la que no lleva vector, y conviene tener
      clara la diferencia:

      | | qué se integra | qué mide | ¿depende del sentido? |
      |---|---|---|---|
      | $\int_{C} f\,ds$ | un escalar | masa, longitud, valor medio | **no** |
      | $\int_{C}\vec F\cdot d\vec r$ | un campo | trabajo, circulación | **sí** |

      ## La cuenta

      El arco es el cuarto de circunferencia unidad del primer cuadrante:

      $$
      x = \cos t,\quad y = \operatorname{sen}t,\qquad t\in\left[0,\tfrac\pi2\right]
      $$

      $$
      ds = \sqrt{\left(-\operatorname{sen}t\right)^{2}+\cos^{2}t}\;dt = dt
      $$

      —el 1 sale del radio; con radio $R$ sería $R\,dt$, y olvidarlo es el
      error más frecuente en estas integrales.

      $$
      m = \int_{0}^{\pi/2}\cos t\operatorname{sen}t\,dt
      = \left[\frac{\operatorname{sen}^{2}t}{2}\right]_{0}^{\pi/2}
      = \boxed{\frac12}
      $$

      ## La comprobación de sentido

      La densidad se anula en los dos extremos —en $A(1,0)$ vale $1\cdot 0 = 0$
      y en $B(0,1)$ igual— y alcanza su máximo en el punto medio del arco,
      donde $x = y = \frac{\sqrt2}{2}$ y $xy = \frac12$. Así que el alambre pesa
      por el centro, y la masa tiene que estar entre 0 y

      $$
      \max f \cdot \text{longitud} = \frac12\cdot\frac{\pi}{2} \approx 0{,}785
      $$

      $0{,}5$ encaja. Esa cota cuesta una línea y es exactamente el tipo de
      comprobación que el punto de COMP4 busca.

  - id: ex2122-5ev-3-la-altura-del-everest
    titulo: Estimar el Everest con una ecuación de una línea
    fuente: >-
      Ejercicio 3 · Quinta evaluación, 16 de mayo de 2022 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      La ecuación barométrica establece que el ritmo de variación de la presión
      atmosférica a una altura $z$ es proporcional a la presión en ese punto,
      con cierta constante de proporcionalidad $\alpha$ que depende de las
      características del aire (masa molecular y temperatura). Sabiendo que la
      presión atmosférica en la cumbre del monte Everest es una tercera parte
      de la presión atmosférica a nivel del mar, estimar la altura del Everest
      en función de $\alpha$.
    pide: La altura, en función de la constante α.

    pasos:
      - tipo: reconocer
        pregunta: |
          «El ritmo de variación de la presión es proporcional a la presión».
          ¿Qué ecuación es?
        opciones:
          - texto: >-
              $\dfrac{dP}{dz} = \alpha P$, con $\alpha$ negativo para que la
              presión baje al subir
            correcta: true
            mensaje: |
              Exacto, y el signo hay que decirlo. «Proporcional a la presión» da
              la ecuación; que la presión **disminuya** con la altura obliga a
              que $\alpha < 0$, y eso es lo que hace que la altura salga
              positiva al final.
          - texto: $\dfrac{dP}{dz} = \alpha z$
            mensaje: |
              Eso sería «proporcional a la **altura**», y daría una parábola.
              El enunciado dice proporcional a la presión en ese punto.
          - texto: $\dfrac{dP}{dz} = \alpha$
            mensaje: |
              Eso es un ritmo constante: la presión bajaría en línea recta y se
              haría negativa a cierta altura. La proporcionalidad con $P$ es lo
              que produce el decaimiento exponencial.
          - texto: >-
              $\dfrac{d^{2}P}{dz^{2}} = \alpha P$, porque «ritmo de variación»
              es la segunda derivada
            mensaje: |
              «Ritmo de variación» es la primera derivada: cuánto cambia $P$ por
              cada metro que se sube. La segunda sería el ritmo al que cambia
              ese ritmo.

      - tipo: calcular
        titulo: El logaritmo que aparece
        pregunta: |
          De $e^{\alpha h} = \frac13$ sale $\alpha h = -\ln 3$. ¿Cuánto vale
          $\ln 3$?
        respuesta:
          tipo: numero
          valor: '1.0986123'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.4771213'
            mensaje: |
              Ese es $\log_{10}3$. En una EDO resuelta con la exponencial
              natural el logaritmo es el neperiano.
          - valor: '3'
            mensaje: |
              3 es el argumento, no el logaritmo. $\ln 3$ es el número al que
              hay que elevar $e$ para obtener 3.
          - valor: '-1.0986123'
            mensaje: |
              El signo menos ya está fuera: $\ln\frac13 = -\ln 3$, y la
              pregunta es por $\ln 3$, que es positivo.
        pista: |
          $\ln 3$ está entre 1 y 1,1: $e^{1} \approx 2{,}718$ y $3$ es un poco
          más.
        desarrollo: |
          $$
          \ln 3 \approx 1{,}0986
          $$

          En un examen sin calculadora la respuesta se deja indicada como
          $\ln 3$; el valor decimal solo sirve para las comprobaciones de
          sentido.

      - tipo: calcular
        titulo: La altura, con un α realista
        pregunta: |
          La altura es $h = -\dfrac{\ln 3}{\alpha}$. Con
          $\alpha = -1{,}2\times 10^{-4}\ \text{m}^{-1}$, ¿cuántos metros salen?
        respuesta:
          tipo: numero
          valor: '9155.1'
          tolerancia: 5
          formato: un número en metros
        distractores:
          - valor: '-9155.1'
            mensaje: |
              Signo. $\alpha$ es negativo, así que $-\frac{\ln 3}{\alpha}$ sale
              **positivo**: menos entre menos.
          - valor: '13181'
            mensaje: |
              Sale de usar $\ln 3$ en base 10 o de dividir mal. Comprueba:
              $1{,}0986 / 1{,}2\times 10^{-4}$.
          - valor: '3977'
            mensaje: |
              Sale de usar $\log_{10}3 = 0{,}477$ en vez de $\ln 3$.
        pista: |
          $h = \frac{1{,}0986}{1{,}2\times 10^{-4}}$.
        desarrollo: |
          $$
          h = -\frac{\ln 3}{\alpha} = \frac{1{,}0986}{1{,}2\times 10^{-4}}
          \approx 9155\ \text{m}
          $$

          Y ahí está la comprobación que cierra el ejercicio: el Everest mide
          **8 849 m**. Un modelo de una sola línea, con la atmósfera supuesta
          isoterma, se queda a un 3 % del valor real. No es casualidad — es que
          la ecuación barométrica es una buena aproximación en ese rango.

      - tipo: justificar
        titulo: El razonamiento completo
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              El enunciado dice que $\frac{dP}{dz}$ es proporcional a $P$, así
              que la EDO es $\frac{dP}{dz} = \alpha P$.
          - texto: >-
              Es de variables separables: $\frac{dP}{P} = \alpha\,dz$, y al
              integrar, $\ln P = \alpha z + k$.
          - texto: >-
              Llamando $P_{0}$ a la presión al nivel del mar, $P(z) = P_{0}e^{\alpha z}$.
          - texto: >-
              En la cumbre, $P(h) = \frac{P_{0}}{3}$, de donde
              $e^{\alpha h} = \frac13$ y $\alpha h = -\ln 3$.
          - texto: >-
              Por tanto $h = -\frac{\ln 3}{\alpha}$, que es positivo porque
              $\alpha < 0$: la presión baja al subir.
          - texto: >-
              El modelo supone la atmósfera isoterma y $\alpha$ constante con la
              altura, que es una aproximación: la temperatura cae unos 6,5 °C
              por kilómetro.
          - texto: >-
              El valor de $P_{0}$ hay que conocerlo para poder despejar $h$.
            trampa: true
            mensaje: |
              No hace falta, y esa es la gracia. El dato del enunciado es un
              **cociente** —«una tercera parte»—, así que $P_{0}$ se cancela al
              dividir. Por eso el problema se puede resolver sin saber la
              presión atmosférica ni en la cumbre ni al nivel del mar: solo la
              proporción entre las dos.

    resolucion: |
      ## El modelo

      «El ritmo de variación de la presión es proporcional a la presión»
      se traduce literalmente:

      $$
      \frac{dP}{dz} = \alpha\,P
      $$

      Con una advertencia que vale puntos: **$\alpha$ tiene que ser negativo**,
      porque la presión disminuye al subir. El enunciado no lo dice, y hay que
      deducirlo del fenómeno.

      ## Resolverla

      Variables separables:

      $$
      \frac{dP}{P} = \alpha\,dz
      \;\Longrightarrow\;
      \ln P = \alpha z + k
      \;\Longrightarrow\;
      P(z) = P_{0}e^{\alpha z}
      $$

      donde $P_{0} = P(0)$ es la presión al nivel del mar.

      ## La altura

      En la cumbre, a altura $h$:

      $$
      P(h) = \frac{P_{0}}{3}
      \;\Longrightarrow\;
      P_{0}e^{\alpha h} = \frac{P_{0}}{3}
      \;\Longrightarrow\;
      e^{\alpha h} = \frac13
      $$

      **$P_{0}$ se cancela**, que es la razón de que el problema se pueda
      resolver sin conocer ninguna presión: el dato es una proporción.

      $$
      \alpha h = \ln\frac13 = -\ln 3
      \;\Longrightarrow\;
      \boxed{\;h = -\frac{\ln 3}{\alpha}\;}
      $$

      Positivo, porque $\alpha<0$.

      ## La comprobación que hay que hacer

      Con un valor realista, $\alpha \approx -1{,}2\times 10^{-4}\ \text{m}^{-1}$:

      $$
      h \approx \frac{1{,}0986}{1{,}2\times 10^{-4}} \approx 9\,155\ \text{m}
      $$

      El Everest mide **8 849 m**. Un modelo de una línea se queda a un 3 %.

      ## Y lo que el modelo supone

      Los dos puntos de COMP4 se los lleva decir qué se está dando por bueno:

      - que $\alpha$ es **constante** con la altura, lo que equivale a suponer
        la atmósfera isoterma — y no lo es: la temperatura cae unos 6,5 °C por
        kilómetro en la troposfera;
      - que el aire tiene composición uniforme;
      - que se puede tratar como un medio continuo, sin viento ni tiempo.

      Un modelo que acierta al 3 % con tres suposiciones falsas merece que se
      digan las tres.

  - id: ex2122-5ev-4-uno-partido-seno
    titulo: Un segundo miembro que no cabe en ningún ensayo
    fuente: >-
      Ejercicio 4 · Quinta evaluación, 16 de mayo de 2022 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp2: 8
      comp4: 2
    enunciado: |
      Resolver la EDO
      $y'' + 4y = \dfrac{1}{\operatorname{sen}2x}$.
    pide: La solución general.

    pasos:
      - tipo: reconocer
        pregunta: |
          El segundo miembro es $\dfrac{1}{\operatorname{sen}2x}$. ¿Qué método?
        opciones:
          - texto: >-
              Variación de constantes: una cosecante no es polinomio,
              exponencial, seno ni coseno
            correcta: true
            mensaje: |
              Eso es. Los coeficientes indeterminados necesitan que el segundo
              miembro tenga familia de derivadas finita, y
              $\frac{1}{\operatorname{sen}2x}$ no la tiene: al derivar aparecen
              potencias crecientes del seno en el denominador.
          - texto: >-
              Coeficientes indeterminados con
              $y_{p} = \frac{A}{\operatorname{sen}2x}$
            mensaje: |
              Al derivar eso salen $\operatorname{sen}^{2}2x$ y
              $\operatorname{sen}^{3}2x$ en los denominadores, así que nunca se
              cierra. Es el caso típico que el método no cubre.
          - texto: >-
              Coeficientes indeterminados, porque el seno sí está en la lista
            mensaje: |
              $\operatorname{sen}2x$ sí, pero **su inverso** no. La lista de
              formas admitidas se cierra con sumas y productos, no con
              cocientes.
          - texto: >-
              Es homogénea con segundo miembro, así que basta con la solución
              homogénea
            mensaje: |
              La homogénea es solo una parte: la solución general es
              $y_{h}+y_{p}$, y sin $y_{p}$ la ecuación no se cumple. Con
              $y = y_{h}$ el lado izquierdo daría 0, no
              $\frac{1}{\operatorname{sen}2x}$.

      - tipo: calcular
        titulo: El wronskiano
        pregunta: |
          Con $y_{1} = \cos 2x$ e $y_{2} = \operatorname{sen}2x$, ¿cuánto vale
          el wronskiano?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 sería con $\cos x$ y $\operatorname{sen}x$. Aquí las derivadas
              traen un factor 2 cada una, y el wronskiano sale
              $2\cos^{2}2x + 2\operatorname{sen}^{2}2x = 2$.
          - valor: '4'
            mensaje: |
              4 saldría si los dos términos aportaran un 2. Solo lo hace uno de
              cada producto: $y_{1}y_{2}' - y_{1}'y_{2} = 2\cos^{2} + 2\operatorname{sen}^{2}$.
          - valor: '0'
            mensaje: |
              Un wronskiano nulo significaría que las dos soluciones son
              linealmente dependientes, y $\cos 2x$ y $\operatorname{sen}2x$ no
              lo son. Si saliera 0 habría un error de signo.
        pista: |
          $W = y_{1}y_{2}' - y_{1}'y_{2}$, con $y_{1}' = -2\operatorname{sen}2x$
          e $y_{2}' = 2\cos 2x$.
        desarrollo: |
          $$
          W = \cos 2x\cdot 2\cos 2x - \left(-2\operatorname{sen}2x\right)\operatorname{sen}2x
          = 2\cos^{2}2x + 2\operatorname{sen}^{2}2x = 2
          $$

          Constante, que es lo habitual cuando la ecuación tiene coeficientes
          constantes, y hace que las dos integrales siguientes salgan limpias.

      - tipo: calcular
        titulo: La solución particular en un punto
        pregunta: |
          La particular es
          $y_{p} = -\frac{x}{2}\cos 2x + \frac14\operatorname{sen}2x\ln\left|\operatorname{sen}2x\right|$.
          ¿Cuánto vale en $x = \frac{\pi}{4}$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '0.25'
            mensaje: |
              En $x=\frac\pi4$ se tiene $\operatorname{sen}\frac\pi2 = 1$, y
              $\ln 1 = 0$: el segundo sumando se anula. Y el primero también,
              porque $\cos\frac\pi2 = 0$.
          - valor: '-0.3926991'
            mensaje: |
              $-\frac{\pi}{8}$: has evaluado $-\frac{x}{2}$ olvidando el
              $\cos 2x$, que en $x=\frac\pi4$ vale cero.
          - valor: '1'
            mensaje: |
              1 es $\operatorname{sen}\frac{\pi}{2}$, pero va multiplicado por
              $\ln 1 = 0$.
        pista: |
          En $x=\frac\pi4$: $2x = \frac\pi2$, así que $\cos 2x = 0$ y
          $\operatorname{sen}2x = 1$. Y $\ln 1 = 0$.
        desarrollo: |
          $$
          y_{p}\!\left(\tfrac\pi4\right)
          = -\frac{\pi/4}{2}\underbrace{\cos\frac\pi2}_{0}
          + \frac14\underbrace{\operatorname{sen}\frac\pi2}_{1}\underbrace{\ln 1}_{0}
          = 0
          $$

          Los dos sumandos se anulan a la vez, cada uno por su motivo. Es un
          buen punto para comprobar la particular sin hacer cuentas largas.

      - tipo: justificar
        titulo: La variación de constantes
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $r^{2}+4 = 0$ da $r = \pm 2i$, así que
              $y_{h} = C_{1}\cos 2x + C_{2}\operatorname{sen}2x$.
          - texto: >-
              El segundo miembro no admite coeficientes indeterminados, así que
              se busca $y_{p} = u_{1}y_{1} + u_{2}y_{2}$ con
              $y_{1}=\cos 2x$ e $y_{2}=\operatorname{sen}2x$.
          - texto: >-
              El wronskiano vale $W = 2$.
          - texto: >-
              $u_{1}' = -\frac{y_{2}\,g}{W}
              = -\frac{\operatorname{sen}2x}{2\operatorname{sen}2x} = -\frac12$,
              luego $u_{1} = -\frac{x}{2}$.
          - texto: >-
              $u_{2}' = \frac{y_{1}\,g}{W} = \frac{\cos 2x}{2\operatorname{sen}2x}$,
              luego $u_{2} = \frac14\ln\left|\operatorname{sen}2x\right|$.
          - texto: >-
              La solución general es
              $y = C_{1}\cos 2x + C_{2}\operatorname{sen}2x
              - \frac{x}{2}\cos 2x
              + \frac14\operatorname{sen}2x\ln\left|\operatorname{sen}2x\right|$.
          - texto: >-
              La solución vale para todo $x$ real, porque las funciones que
              aparecen están definidas en todo $\mathbb{R}$.
            trampa: true
            mensaje: |
              No vale para todo $x$: el segundo miembro
              $\frac{1}{\operatorname{sen}2x}$ **no está definido** donde
              $\operatorname{sen}2x = 0$, o sea en $x = \frac{k\pi}{2}$. Y el
              logaritmo de la solución tampoco. La solución vive en cada
              intervalo entre dos de esos puntos por separado, con sus propias
              constantes. Decirlo es lo que valen los dos puntos de COMP4.

    resolucion: |
      ## Por qué variación de constantes

      $$
      y'' + 4y = \frac{1}{\operatorname{sen}2x}
      $$

      Los coeficientes indeterminados necesitan que el segundo miembro tenga
      **familia de derivadas finita**. La cosecante no la tiene: al derivarla
      aparecen $\operatorname{sen}^{2}2x$, luego $\operatorname{sen}^{3}2x$, y
      así sin cerrar nunca. No hay forma que ensayar.

      ## La homogénea

      $$
      r^{2}+4=0 \;\Longrightarrow\; r = \pm 2i
      \;\Longrightarrow\;
      y_{h} = C_{1}\cos 2x + C_{2}\operatorname{sen}2x
      $$

      ## Las dos funciones que hay que integrar

      $$
      W = \begin{vmatrix}\cos 2x & \operatorname{sen}2x\\ -2\operatorname{sen}2x & 2\cos 2x\end{vmatrix} = 2
      $$

      Con $g(x) = \dfrac{1}{\operatorname{sen}2x}$:

      $$
      u_{1}' = -\frac{y_{2}\,g}{W} = -\frac{\operatorname{sen}2x}{2\operatorname{sen}2x} = -\frac12
      \;\Longrightarrow\;
      u_{1} = -\frac{x}{2}
      $$

      $$
      u_{2}' = \frac{y_{1}\,g}{W} = \frac{\cos 2x}{2\operatorname{sen}2x}
      \;\Longrightarrow\;
      u_{2} = \frac14\ln\left|\operatorname{sen}2x\right|
      $$

      La primera es inmediata —el seno se cancela entero— y la segunda es un
      logaritmo, con el $\frac14$ que sale del $\frac12$ del wronskiano por el
      $\frac12$ del cambio $u = \operatorname{sen}2x$.

      ## La solución

      $$
      \boxed{\;y = C_{1}\cos 2x + C_{2}\operatorname{sen}2x
      - \frac{x}{2}\cos 2x
      + \frac14\operatorname{sen}2x\,\ln\left|\operatorname{sen}2x\right|\;}
      $$

      ## Dónde vale

      Esto es lo que se lleva los dos puntos de COMP4, y es fácil de olvidar:
      **la ecuación no está definida donde $\operatorname{sen}2x = 0$**, es
      decir en $x = \frac{k\pi}{2}$. El segundo miembro se va a infinito y el
      logaritmo de la solución también.

      Así que la solución general no es una función en todo $\mathbb{R}$: es
      una familia definida **en cada intervalo** $\left(\frac{k\pi}{2},
      \frac{(k+1)\pi}{2}\right)$, cada uno con sus propias constantes
      $C_{1}$ y $C_{2}$. Escribir el resultado sin decir esto lo deja a medias.

      ## Una comprobación barata

      En $x = \frac\pi4$ los dos sumandos de la particular se anulan —uno
      porque $\cos\frac\pi2 = 0$ y el otro porque $\ln 1 = 0$—, así que
      $y_{p}\left(\frac\pi4\right) = 0$. Evaluar ahí caza cualquier error de
      coeficiente sin tener que derivar nada.
