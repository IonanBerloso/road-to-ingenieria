ejercicios:
  - id: ex1819-4ev-1-perpendicular-en-el-origen
    titulo: Un vector unitario perpendicular a la curva de nivel
    fuente: >-
      Ejercicio 1 · Cuarta evaluación (segundo cuatrimestral), 11 de marzo de
      2019 · Cálculo, UPV/EHU · Es el ejercicio 6.12 del boletín de problemas
      complementarios, que publica la solución.
    nivel: examen
    puntos:
      comp1: 0.5
      comp2: 3
      comp4: 1.5
    enunciado: |
      Sea la función $f(x,y) = x^{2}y^{2}+2y+2$. Calcular un vector unitario
      perpendicular a la curva de nivel $f(x,y)=2$ en el punto $(0,0)$.
    pide: Un vector unitario perpendicular a la curva de nivel en el origen.
    pasos:
      - tipo: reconocer
        pregunta: |
          El ejercicio pide una perpendicular a una curva. ¿Con qué herramienta
          del tema se obtiene?
        opciones:
          - texto: Con el gradiente, que es perpendicular a la curva de nivel
            correcta: true
            mensaje: |
              Ese es el hecho central del tema, y convierte un ejercicio que
              suena a geometría en uno de derivar.
          - texto: Despejando la curva y calculando su recta normal
            mensaje: |
              Se puede, y es el camino largo: hay que despejar
              $x^{2}y^{2}+2y=0$, derivar implícitamente y luego invertir la
              pendiente. El gradiente lo da directo.
          - texto: Con el vector de posición del punto
            mensaje: |
              Aquí el punto **es** el origen, así que su vector de posición es
              nulo y no señala ninguna dirección.
      - tipo: calcular
        titulo: La componente en y del gradiente
        pregunta: |
          Con $f_y = 2x^{2}y+2$, ¿cuánto vale $f_y(0,0)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              El término $2x^{2}y$ sí se anula en el origen, pero queda el $+2$
              que viene de derivar $2y$. No todo desaparece.
          - valor: '1'
            mensaje: |
              1 sería la respuesta ya normalizada. La pregunta es por la
              componente del gradiente, que vale 2.
        pista: |
          En el origen $2x^2y$ vale 0, y queda la constante que sale de derivar $2y$.
        desarrollo: |
          $$
          f_x = 2xy^{2} \;\Longrightarrow\; f_x(0,0)=0,
          \qquad
          f_y = 2x^{2}y+2 \;\Longrightarrow\; f_y(0,0)=2
          $$

          $$
          \nabla f(0,0) = (0,\,2)
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'El gradiente es perpendicular a la curva de nivel, así que basta calcularlo.'
          - texto: '$\nabla f(0,0) = (0,2)$, de módulo 2.'
          - texto: 'Normalizando, el vector pedido es $(0,1)$.'
          - texto: 'También vale $(0,-1)$: el enunciado pide **un** vector, y hay dos unitarios perpendiculares.'
          - texto: 'Hay que comprobar antes que el punto $(0,0)$ está en la curva $f=2$, y no lo está.'
            trampa: true
            mensaje: |
              Sí lo está: $f(0,0) = 0+0+2 = 2$. La comprobación es buena idea
              —si el punto no estuviera en la curva el enunciado no tendría
              sentido— pero aquí sale bien.
    resolucion: |
      **Es una frase disfrazada de cuenta.** El gradiente es perpendicular a la
      curva de nivel, así que el ejercicio se reduce a derivar.

      **Comprobar primero** que el punto está en la curva, que cuesta nada:

      $$
      f(0,0) = 0 + 0 + 2 = 2 \quad ✓
      $$

      **El gradiente:**

      $$
      f_x = 2xy^{2},
      \qquad
      f_y = 2x^{2}y+2
      \qquad\Longrightarrow\qquad
      \nabla f(0,0) = (0,\,2)
      $$

      **Normalizando**, como pide el enunciado:

      $$
      \boxed{\;\vec u = (0,\,1)\;}
      $$

      > **La comprobación geométrica.** La curva de nivel $f=2$ es
      > $x^{2}y^{2}+2y=0$, o sea $y\,(x^{2}y+2)=0$. Cerca del origen la rama que
      > pasa por ahí es $y=0$: el eje horizontal. Y una perpendicular al eje
      > horizontal es, en efecto, el vertical. ✓
      >
      > Y el enunciado dice «**un** vector unitario», en singular indefinido:
      > $(0,-1)$ vale igual, y decirlo suma.

  - id: ex1819-4ev-2-el-rombo-que-se-vuelve-cuadrado
    titulo: El rombo que un cambio de variable vuelve cuadrado
    fuente: >-
      Ejercicio 2 · Cuarta evaluación (segundo cuatrimestral), 11 de marzo de
      2019 · Cálculo, UPV/EHU · Es el ejercicio 7.7 del boletín de problemas
      complementarios, que publica la solución.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3
    enunciado: |
      Sea la integral $I = \displaystyle\iint_{D}(2x-y+1)\,dx\,dy$, donde $D$ es
      el dominio limitado por $y=4x-4$, $y=4x+4$, $y=-4x-4$ e $y=-4x+4$.

      a) Dibujar el dominio $D$.

      b) Resolver la integral utilizando el cambio de variable
      $x = \dfrac{1}{2}(u+v)$, $y = 2v-2u$.
    pide: El dibujo del dominio y el valor de la integral.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado **da** el cambio de variable en vez de dejarlo elegir.
          ¿Qué suele significar eso?
        opciones:
          - texto: Que el cambio convierte el recinto en algo de límites constantes
            correcta: true
            mensaje: |
              Sí, y aquí lo convierte en un cuadrado. Cuando un enunciado regala
              el cambio, el trabajo es descubrir en qué se transforma el
              recinto — no inventarlo.
          - texto: Que sin ese cambio la integral no se puede resolver
            mensaje: |
              Se puede: es un polinomio sobre un rombo, y en cartesianas saldría
              partiendo en dos o cuatro trozos. Solo que es mucho más largo.
          - texto: Que hay que comprobar que el jacobiano vale 1
            mensaje: |
              No tiene por qué valer 1, y aquí vale 2. Lo que hay que hacer es
              calcularlo y meterlo dentro, no esperar que desaparezca.
      - tipo: calcular
        titulo: El jacobiano
        pregunta: |
          Con $x=\frac12(u+v)$ e $y=2v-2u$, el jacobiano es el determinante
          $\begin{vmatrix} 1/2 & 1/2 \\ -2 & 2\end{vmatrix}$. ¿Cuánto vale?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Cero significaría que el cambio no es válido —aplasta el plano—.
              Aquí es $\frac12\cdot 2 - \frac12\cdot(-2) = 1+1 = 2$: los dos
              términos suman, no se cancelan.
          - valor: '1'
            mensaje: |
              1 saldría de $\frac12\cdot 2$ solo. Falta el segundo producto, y
              como lleva un negativo, restarlo suma.
        pista: |
          $\frac12 \cdot 2 - \frac12 \cdot (-2)$. Restar un negativo suma.
        desarrollo: |
          $$
          J = \begin{vmatrix} \frac12 & \frac12 \\[2pt] -2 & 2 \end{vmatrix}
          = \frac12\cdot 2 - \frac12\cdot(-2) = 1+1 = 2
          $$

          El área se **duplica** al pasar de $uv$ a $xy$, y por eso hay que
          multiplicar por 2 dentro de la integral.
      - tipo: calcular
        titulo: La integral
        pregunta: |
          En las variables nuevas el recinto es el cuadrado $[-1,1]\times[-1,1]$
          y el integrando $3u-v+1$. Con el jacobiano 2, ¿cuánto vale $I$?
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              4 es la integral **sin** el jacobiano. El cambio duplica el área,
              así que hay que multiplicar por 2.
          - valor: '16'
            mensaje: |
              16 saldría de aplicar el jacobiano dos veces. Solo entra una.
        pista: |
          Los términos con u y con v se anulan por simetría; queda $2\cdot 1\cdot 4$.
        desarrollo: |
          $$
          I = \int_{-1}^{1}\!\!\int_{-1}^{1}\bigl(3u-v+1\bigr)\cdot 2\;du\,dv
          $$

          Los términos **impares se anulan** sobre un cuadrado centrado en el
          origen: $\iint 3u = 0$ y $\iint (-v) = 0$. Solo sobrevive el 1:

          $$
          I = 2\cdot 1\cdot \text{área}(uv) = 2\cdot 4 = 8
          $$
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'a) Las cuatro rectas forman un **rombo** de vértices $(\pm1,0)$ y $(0,\pm4)$.'
          - texto: 'b) Con el cambio dado, $y-4x = -4u$ e $y+4x = 4v$.'
          - texto: 'Las cuatro rectas pasan a ser $u=\pm1$ y $v=\pm1$: el rombo se convierte en un **cuadrado**.'
          - texto: 'Con jacobiano 2 y el integrando $3u-v+1$, la integral vale 8.'
          - texto: 'Como el rombo y el cuadrado tienen la misma área, el jacobiano tiene que valer 1.'
            trampa: true
            mensaje: |
              No la tienen. El rombo mide $\frac{d_1d_2}{2} = \frac{2\cdot 8}{2} = 8$
              y el cuadrado $2\times2 = 4$: el doble exacto, que es justo lo que
              dice el jacobiano $J=2$. **El jacobiano mide precisamente cuánto se
              deforma el área.**
    resolucion: |
      **a) El dominio.** Cortando las cuatro rectas dos a dos salen los vértices

      $$
      (1,0),\qquad (0,4),\qquad (-1,0),\qquad (0,-4)
      $$

      un **rombo** muy estirado en vertical, centrado en el origen.

      **b) El cambio, y por qué funciona.** El truco está en mirar qué
      combinaciones aparecen en las rectas. Con $x=\frac12(u+v)$ e $y=2v-2u$:

      $$
      y-4x = (2v-2u) - 2(u+v) = -4u,
      \qquad
      y+4x = (2v-2u) + 2(u+v) = 4v
      $$

      Y las cuatro rectas se escriben con esas dos combinaciones:

      | recta | en $uv$ |
      |---|---|
      | $y=4x-4$ | $u=1$ |
      | $y=4x+4$ | $u=-1$ |
      | $y=-4x+4$ | $v=1$ |
      | $y=-4x-4$ | $v=-1$ |

      **El rombo se ha convertido en el cuadrado** $[-1,1]\times[-1,1]$: cuatro
      límites constantes.

      **El jacobiano:**

      $$
      J = \begin{vmatrix} \frac12 & \frac12 \\[2pt] -2 & 2 \end{vmatrix} = 2
      $$

      **El integrando**, que también se simplifica:

      $$
      2x-y = (u+v)-(2v-2u) = 3u-v
      $$

      **La integral:**

      $$
      I = \int_{-1}^{1}\!\!\int_{-1}^{1}\bigl(3u-v+1\bigr)\,2\;du\,dv
      = 2\bigl(0 - 0 + 4\bigr) = \boxed{8}
      $$

      Los términos $3u$ y $-v$ son **impares** sobre un cuadrado centrado en el
      origen y se anulan sin calcular: solo sobrevive la constante.

      > **La comprobación que cierra el ejercicio.** El rombo tiene área
      > $\frac{d_1 d_2}{2} = \frac{2\cdot 8}{2} = 8$ y el cuadrado 4. La razón
      > es exactamente 2, que es el jacobiano. **Eso no es casualidad: el
      > jacobiano mide cuánto se deforma el área**, y comprobarlo con dos áreas
      > que sabes calcular a mano es la mejor forma de asegurarte de que no lo
      > has puesto del revés.

  - id: ex1819-4ev-3-cono-paraboloide-y-momento
    titulo: Un cono y un paraboloide, y el momento de inercia
    fuente: >-
      Ejercicio 3 · Cuarta evaluación (segundo cuatrimestral), 11 de marzo de
      2019 · Cálculo, UPV/EHU · Es el ejercicio 7.21 del boletín de problemas
      complementarios, que publica la solución.
    nivel: examen
    puntos:
      comp2: 7
      comp4: 3
    enunciado: |
      Sea $S$ el sólido limitado por las condiciones $x^{2}+y^{2}\le z^{2}$,
      $z\le 6-x^{2}-y^{2}$, $z\ge 0$.

      a) Dibujar el sólido $S$ y calcular su volumen.

      b) Sabiendo que $f(x,y,z)=k\,y^{2}$ denota la densidad en cada punto,
      plantear el momento de inercia de $S$ respecto del eje $OZ$.
    pide: El dibujo, el volumen y el planteamiento del momento de inercia.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado b) dice «plantear», no «calcular». ¿Qué hay que entregar?
        opciones:
          - texto: La integral con sus límites y su integrando, sin resolverla
            correcta: true
            mensaje: |
              Eso es. Y no es una rebaja: montar bien el integrando del momento
              de inercia —con la distancia al eje **al cuadrado** y la densidad
              dentro— es donde está la dificultad.
          - texto: El valor numérico del momento
            mensaje: |
              El enunciado no lo pide. Calcularlo gasta tiempo del examen sin
              sumar puntos.
          - texto: Solo la fórmula general, sin adaptarla a este sólido
            mensaje: |
              «Plantear» significa con **sus** límites y **su** integrando. Una
              fórmula de libro sin adaptar no demuestra que hayas leído el
              sólido.
      - tipo: calcular
        titulo: Dónde se cortan las dos superficies
        pregunta: |
          En cilíndricas el cono es $z=\rho$ y el paraboloide $z=6-\rho^{2}$.
          ¿Para qué $\rho$ positivo se cortan?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '6'
            mensaje: |
              6 es el término independiente del paraboloide, no la raíz. De
              $\rho^{2}+\rho-6=0$ sale $(\rho+3)(\rho-2)=0$.
          - valor: '2.449'
            mensaje: |
              $\sqrt6$ saldría de $\rho^{2}=6$, o sea de olvidar el término
              lineal. La ecuación completa lleva el $+\rho$.
        pista: |
          $\rho = 6-\rho^2$ es $\rho^2+\rho-6=0$. Factoriza.
        desarrollo: |
          $$
          \rho^{2}+\rho-6 = (\rho+3)(\rho-2) = 0
          \qquad\Longrightarrow\qquad
          \rho = 2
          $$

          A esa altura $z=2$, y la sombra del sólido es el círculo de radio 2.
      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Integrando la diferencia de alturas, el volumen sale
          $\dfrac{32\pi}{3}$. ¿Cuánto vale con cuatro decimales?
        respuesta:
          tipo: numero
          valor: '33.5103'
          tolerancia: 0.03
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '25.1327'
            mensaje: |
              $8\pi$ saldría de olvidar uno de los tres términos al integrar. La
              cuenta es $2\pi(12-4-8/3)$.
          - valor: '8.3776'
            mensaje: |
              $8\pi/3$ es solo el cono hasta $z=2$. Falta el casquete de
              paraboloide que va encima.
        pista: |
          $32\pi/3$, con pi = 3,14159...
        desarrollo: |
          $$
          V = 2\pi\int_{0}^{2}\bigl[(6-\rho^{2})-\rho\bigr]\rho\;d\rho
          = 2\pi\left(12-4-\tfrac83\right) = \frac{32\pi}{3}
          $$
      - tipo: justificar
        pregunta: |
          Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: 'El momento de inercia respecto de $OZ$ integra la **distancia al eje al cuadrado** por la densidad.'
          - texto: 'En cilíndricas esa distancia es $\rho$, así que aparece $\rho^{2}$.'
          - texto: 'La densidad $ky^{2}$ es $k\rho^{2}\text{sen}^{2}\theta$, y el jacobiano añade otro $\rho$.'
          - texto: 'Todo junto da el integrando $k\rho^{5}\text{sen}^{2}\theta$.'
          - texto: 'La distancia al eje $OZ$ es $z$, así que el integrando lleva $z^{2}$.'
            trampa: true
            mensaje: |
              La distancia de un punto **al eje** $OZ$ no es su altura: es lo
              que se aleja del eje, o sea $\sqrt{x^{2}+y^{2}} = \rho$. La $z$ es
              la distancia al **plano** $XY$, que es otra cosa.
    resolucion: |
      **a) El sólido y su volumen.** Es una lente entre el cono $z=\rho$ que
      sube desde el origen y el paraboloide $z=6-\rho^{2}$ que baja desde
      $z=6$. Se cortan donde

      $$
      \rho^{2}+\rho-6=0 \;\Longrightarrow\; \rho=2,\; z=2
      $$

      $$
      V = 2\pi\int_{0}^{2}\bigl(6\rho-\rho^{3}-\rho^{2}\bigr)d\rho
      = 2\pi\left(12-4-\frac83\right)
      = \boxed{\frac{32\pi}{3}\approx 33{,}51}
      $$

      **b) El momento de inercia respecto de $OZ$.** La definición es

      $$
      I_z = \iiint_S d^{2}\,\delta\;dV
      $$

      donde $d$ es la **distancia al eje** —no la altura— y $\delta$ la
      densidad. Montándolo pieza a pieza en cilíndricas:

      | pieza | en cilíndricas |
      |---|---|
      | distancia al eje al cuadrado | $\rho^{2}$ |
      | densidad $k\,y^{2}$ | $k\rho^{2}\text{sen}^{2}\theta$ |
      | jacobiano | $\rho$ |

      El producto de las tres es $k\rho^{5}\text{sen}^{2}\theta$, y con los
      límites del apartado a):

      $$
      \boxed{\;
      I_z = \int_{0}^{2\pi}\!\!\int_{0}^{2}\!\!\int_{\rho}^{6-\rho^{2}}
      k\,\rho^{5}\,\text{sen}^{2}\theta \;dz\,d\rho\,d\theta \;}
      $$

      > **Las tres potencias de $\rho$ vienen de tres sitios distintos**, y
      > perder la cuenta es el error del apartado: dos del cuadrado de la
      > distancia, dos de la densidad y una del jacobiano. Escribir de dónde
      > sale cada una —como en la tabla— es exactamente lo que corrige COMP4.
