          </svg>
        consigna: |
          Dibuja el dominio $D$ en el plano $XY$ y, al lado, su imagen en el
          plano $UV$. Marca los cuatro vértices en los dos y empareja cuál va con
          cuál.
        comprueba:
          - punto: |
              Los cuatro vértices del rombo: $\left(1,0\right)$,
              $\left(0,4\right)$, $\left(-1,0\right)$ y $\left(0,-4\right)$.
            porque: |
              Salen de cortar las cuatro rectas dos a dos. El rombo es **cuatro
              veces más alto que ancho**, y dibujarlo como un cuadrado girado
              esconde por qué hace falta el cambio.
          - punto: |
              Las cuatro rectas muy inclinadas, dos de pendiente $4$ y dos de
              $-4$.
            porque: |
              Dibujarlas a $45^\circ$ produce un rombo con las proporciones
              cambiadas y un dibujo que no corresponde al enunciado.
          - punto: |
              En el plano $UV$, un **cuadrado** con $-1\le u\le1$ y
              $-1\le v\le1$.
            porque: |
              Ese es el objetivo del cambio: convertir un recinto inclinado en
              uno con los lados paralelos a los ejes. Si no sale un cuadrado, el
              cambio está mal aplicado.
          - punto: |
              El emparejamiento de vértices entre los dos dibujos, con flechas o
              colores.
            porque: |
              Es lo que demuestra que los límites nuevos son los correctos. Sin
              él, el cuadrado es una afirmación sin prueba.
        veredicto: |
          El cambio no simplifica el integrando —sigue siendo lineal— sino el
          **recinto**. Ese es el motivo más frecuente para cambiar de variable en
          una doble, y los dos dibujos juntos lo explican mejor que el jacobiano.

    resolucion: |
      **a) El dominio.** Cortando las cuatro rectas dos a dos salen los vértices

      $$
      (1,0),\qquad (0,4),\qquad (-1,0),\qquad (0,-4)
      $$

      un **rombo** muy estirado en vertical, centrado en el origen.

      **b) El cambio, y por qué funciona.** El truco está en mirar qué
      combinaciones aparecen en las rectas. Con $x=\frac12(u+v)$ e $y=2v-2u$:

      $$
      y-4x = (2v-2u) - 2(u+v) = -4u,
      \qquad
      y+4x = (2v-2u) + 2(u+v) = 4v
      $$

      Y las cuatro rectas se escriben con esas dos combinaciones:

      | recta | en $uv$ |
      |---|---|
      | $y=4x-4$ | $u=1$ |
      | $y=4x+4$ | $u=-1$ |
      | $y=-4x+4$ | $v=1$ |
      | $y=-4x-4$ | $v=-1$ |

      **El rombo se ha convertido en el cuadrado** $[-1,1]\times[-1,1]$: cuatro
      límites constantes.

      **El jacobiano:**

      $$
      J = \begin{vmatrix} \frac12 & \frac12 \\[2pt] -2 & 2 \end{vmatrix} = 2
      $$

      **El integrando**, que también se simplifica:

      $$
      2x-y = (u+v)-(2v-2u) = 3u-v
      $$

      **La integral:**

      $$
      I = \int_{-1}^{1}\!\!\int_{-1}^{1}\bigl(3u-v+1\bigr)\,2\;du\,dv
      = 2\bigl(0 - 0 + 4\bigr) = \boxed{8}
      $$

      Los términos $3u$ y $-v$ son **impares** sobre un cuadrado centrado en el
      origen y se anulan sin calcular: solo sobrevive la constante.

      > **La comprobación que cierra el ejercicio.** El rombo tiene área
      > $\frac{d_1 d_2}{2} = \frac{2\cdot 8}{2} = 8$ y el cuadrado 4. La razón
      > es exactamente 2, que es el jacobiano. **Eso no es casualidad: el
      > jacobiano mide cuánto se deforma el área**, y comprobarlo con dos áreas
      > que sabes calcular a mano es la mejor forma de asegurarte de que no lo
      > has puesto del revés.

  - id: ex1819-4ev-3-cono-paraboloide-y-momento
    titulo: Un cono y un paraboloide, y el momento de inercia
    fuente: >-
      Ejercicio 3 · Cuarta evaluación (segundo cuatrimestral), 11 de marzo de
      2019 · Cálculo, UPV/EHU · Es el ejercicio 7.21 del boletín de problemas
      complementarios, que publica la solución.
    nivel: examen
    puntos:
      comp2: 7
      comp4: 3
    enunciado: |
      Sea $S$ el sólido limitado por las condiciones $x^{2}+y^{2}\le z^{2}$,
      $z\le 6-x^{2}-y^{2}$, $z\ge 0$.

      a) Dibujar el sólido $S$ y calcular su volumen.

      b) Sabiendo que $f(x,y,z)=k\,y^{2}$ denota la densidad en cada punto,
      plantear el momento de inercia de $S$ respecto del eje $OZ$.
    pide: El dibujo, el volumen y el planteamiento del momento de inercia.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado b) dice «plantear», no «calcular». ¿Qué hay que entregar?
        opciones:
          - texto: La integral con sus límites y su integrando, sin resolverla
            correcta: true
            mensaje: |
              Eso es. Y no es una rebaja: montar bien el integrando del momento
              de inercia —con la distancia al eje **al cuadrado** y la densidad
              dentro— es donde está la dificultad.
          - texto: El valor numérico del momento
            mensaje: |
              El enunciado no lo pide. Calcularlo gasta tiempo del examen sin
              sumar puntos.
          - texto: Solo la fórmula general, sin adaptarla a este sólido
            mensaje: |
              «Plantear» significa con **sus** límites y **su** integrando. Una
              fórmula de libro sin adaptar no demuestra que hayas leído el
              sólido.
      - tipo: calcular
        titulo: Dónde se cortan las dos superficies
        pregunta: |
          En cilíndricas el cono es $z=\rho$ y el paraboloide $z=6-\rho^{2}$.
          ¿Para qué $\rho$ positivo se cortan?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '6'
            mensaje: |
              6 es el término independiente del paraboloide, no la raíz. De
              $\rho^{2}+\rho-6=0$ sale $(\rho+3)(\rho-2)=0$.
          - valor: '2.449'
            mensaje: |
              $\sqrt6$ saldría de $\rho^{2}=6$, o sea de olvidar el término
              lineal. La ecuación completa lleva el $+\rho$.
        pista: |
          $\rho = 6-\rho^2$ es $\rho^2+\rho-6=0$. Factoriza.
        desarrollo: |
          $$
          \rho^{2}+\rho-6 = (\rho+3)(\rho-2) = 0
          \qquad\Longrightarrow\qquad
          \rho = 2
          $$

          A esa altura $z=2$, y la sombra del sólido es el círculo de radio 2.
      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Integrando la diferencia de alturas, el volumen sale
          $\dfrac{32\pi}{3}$. ¿Cuánto vale con cuatro decimales?
        respuesta:
          tipo: numero
          valor: '33.5103'
          tolerancia: 0.03
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '25.1327'
            mensaje: |
              $8\pi$ saldría de olvidar uno de los tres términos al integrar. La
              cuenta es $2\pi(12-4-8/3)$.
          - valor: '8.3776'
            mensaje: |
              $8\pi/3$ es solo el cono hasta $z=2$. Falta el casquete de
              paraboloide que va encima.
        pista: |
          $32\pi/3$, con pi = 3,14159...
        desarrollo: |
          $$
          V = 2\pi\int_{0}^{2}\bigl[(6-\rho^{2})-\rho\bigr]\rho\;d\rho
          = 2\pi\left(12-4-\tfrac83\right) = \frac{32\pi}{3}
          $$
      - tipo: justificar
        pregunta: |
          Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: 'El momento de inercia respecto de $OZ$ integra la **distancia al eje al cuadrado** por la densidad.'
          - texto: 'En cilíndricas esa distancia es $\rho$, así que aparece $\rho^{2}$.'
          - texto: 'La densidad $ky^{2}$ es $k\rho^{2}\text{sen}^{2}\theta$, y el jacobiano añade otro $\rho$.'
          - texto: 'Todo junto da el integrando $k\rho^{5}\text{sen}^{2}\theta$.'
          - texto: 'La distancia al eje $OZ$ es $z$, así que el integrando lleva $z^{2}$.'
            trampa: true
            mensaje: |
              La distancia de un punto **al eje** $OZ$ no es su altura: es lo
              que se aleja del eje, o sea $\sqrt{x^{2}+y^{2}} = \rho$. La $z$ es
              la distancia al **plano** $XY$, que es otra cosa.
