        consigna: |
          Dibuja el sólido $S$ en perspectiva y su corte por el plano $XZ$. Marca
          la circunferencia de intersección y la proyección sobre $XY$.
        comprueba:
          - punto: |
              El cono $z=\sqrt{x^{2}+y^{2}}$ como pared lateral, con el vértice
              en el origen.
            porque: |
              $x^{2}+y^{2}\le z^{2}$ con $z\ge0$ es el **interior** del cono
              superior. Es el suelo del sólido, en forma de embudo.
          - punto: |
              El paraboloide $z=6-x^{2}-y^{2}$ como tapa, con el vértice en
              $\left(0,0,6\right)$.
            porque: |
              Abre hacia abajo desde la altura $6$. El sólido es lo que queda
              entre las dos superficies.
          - punto: |
              El corte en $r=2$, $z=2$.
            porque: |
              De $r=6-r^{2}$ sale $r=2$. Es el único número que hay que buscar, y
              fija el límite superior de $r$ en cilíndricas.
          - punto: |
              La proyección sobre $XY$: el disco de radio $2$.
            porque: |
              El momento de inercia del apartado (b) se plantea sobre ese mismo
              recinto, con $z$ entre $r$ y $6-r^{2}$. Sin la proyección no hay
              límites.
        veredicto: |
          Con densidad $ky^{2}$, el momento respecto de $OZ$ es
          $\iiint k y^{2}\left(x^{2}+y^{2}\right)dV$: la densidad multiplica al
          cuadrado de la distancia al eje. En cilíndricas eso es
          $k r^{2}\operatorname{sen}^{2}\theta\cdot r^{2}\cdot r$, y los límites
          los da el dibujo.

    resolucion: |
      **a) El sólido y su volumen.** Es una lente entre el cono $z=\rho$ que
      sube desde el origen y el paraboloide $z=6-\rho^{2}$ que baja desde
      $z=6$. Se cortan donde

      $$
      \rho^{2}+\rho-6=0 \;\Longrightarrow\; \rho=2,\; z=2
      $$

      $$
      V = 2\pi\int_{0}^{2}\bigl(6\rho-\rho^{3}-\rho^{2}\bigr)d\rho
      = 2\pi\left(12-4-\frac83\right)
      = \boxed{\frac{32\pi}{3}\approx 33{,}51}
      $$

      **b) El momento de inercia respecto de $OZ$.** La definición es

      $$
      I_z = \iiint_S d^{2}\,\delta\;dV
      $$

      donde $d$ es la **distancia al eje** —no la altura— y $\delta$ la
      densidad. Montándolo pieza a pieza en cilíndricas:

      | pieza | en cilíndricas |
      |---|---|
      | distancia al eje al cuadrado | $\rho^{2}$ |
      | densidad $k\,y^{2}$ | $k\rho^{2}\text{sen}^{2}\theta$ |
      | jacobiano | $\rho$ |

      El producto de las tres es $k\rho^{5}\text{sen}^{2}\theta$, y con los
      límites del apartado a):

      $$
      \boxed{\;
      I_z = \int_{0}^{2\pi}\!\!\int_{0}^{2}\!\!\int_{\rho}^{6-\rho^{2}}
      k\,\rho^{5}\,\text{sen}^{2}\theta \;dz\,d\rho\,d\theta \;}
      $$

      > **Las tres potencias de $\rho$ vienen de tres sitios distintos**, y
      > perder la cuenta es el error del apartado: dos del cuadrado de la
      > distancia, dos de la densidad y una del jacobiano. Escribir de dónde
      > sale cada una —como en la tabla— es exactamente lo que corrige COMP4.
