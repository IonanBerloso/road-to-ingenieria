ejercicios:
  - id: ex1819-4ev-1-perpendicular-en-el-origen
    titulo: Un vector unitario perpendicular a la curva de nivel
    fuente: >-
      Ejercicio 1 · Cuarta evaluación (segundo cuatrimestral), 11 de marzo de
      2019 · Cálculo, UPV/EHU · Es el ejercicio 6.12 del boletín de problemas
      complementarios, que publica la solución.
    nivel: examen
    puntos:
      comp1: 0.5
      comp2: 3
      comp4: 1.5
    enunciado: |
      Sea la función $f(x,y) = x^{2}y^{2}+2y+2$. Calcular un vector unitario
      perpendicular a la curva de nivel $f(x,y)=2$ en el punto $(0,0)$.
    pide: Un vector unitario perpendicular a la curva de nivel en el origen.
    pasos:
      - tipo: reconocer
        pregunta: |
          El ejercicio pide una perpendicular a una curva. ¿Con qué herramienta
          del tema se obtiene?
        opciones:
          - texto: Con el gradiente, que es perpendicular a la curva de nivel
            correcta: true
            mensaje: |
              Ese es el hecho central del tema, y convierte un ejercicio que
              suena a geometría en uno de derivar.
          - texto: Despejando la curva y calculando su recta normal
            mensaje: |
              Se puede, y es el camino largo: hay que despejar
              $x^{2}y^{2}+2y=0$, derivar implícitamente y luego invertir la
              pendiente. El gradiente lo da directo.
          - texto: Con el vector de posición del punto
            mensaje: |
              Aquí el punto **es** el origen, así que su vector de posición es
              nulo y no señala ninguna dirección.
      - tipo: calcular
        titulo: La componente en y del gradiente
        pregunta: |
          Con $f_y = 2x^{2}y+2$, ¿cuánto vale $f_y(0,0)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              El término $2x^{2}y$ sí se anula en el origen, pero queda el $+2$
              que viene de derivar $2y$. No todo desaparece.
          - valor: '1'
            mensaje: |
              1 sería la respuesta ya normalizada. La pregunta es por la
              componente del gradiente, que vale 2.
        pista: |
          En el origen $2x^2y$ vale 0, y queda la constante que sale de derivar $2y$.
        desarrollo: |
          $$
          f_x = 2xy^{2} \;\Longrightarrow\; f_x(0,0)=0,
          \qquad
          f_y = 2x^{2}y+2 \;\Longrightarrow\; f_y(0,0)=2
          $$

          $$
          \nabla f(0,0) = (0,\,2)
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'El gradiente es perpendicular a la curva de nivel, así que basta calcularlo.'
          - texto: '$\nabla f(0,0) = (0,2)$, de módulo 2.'
          - texto: 'Normalizando, el vector pedido es $(0,1)$.'
          - texto: 'También vale $(0,-1)$: el enunciado pide **un** vector, y hay dos unitarios perpendiculares.'
          - texto: 'Hay que comprobar antes que el punto $(0,0)$ está en la curva $f=2$, y no lo está.'
            trampa: true
            mensaje: |
              Sí lo está: $f(0,0) = 0+0+2 = 2$. La comprobación es buena idea
              —si el punto no estuviera en la curva el enunciado no tendría
              sentido— pero aquí sale bien.
    resolucion: |
      **Es una frase disfrazada de cuenta.** El gradiente es perpendicular a la
      curva de nivel, así que el ejercicio se reduce a derivar.

      **Comprobar primero** que el punto está en la curva, que cuesta nada:

      $$
      f(0,0) = 0 + 0 + 2 = 2 \quad ✓
      $$

      **El gradiente:**

      $$
      f_x = 2xy^{2},
      \qquad
      f_y = 2x^{2}y+2
      \qquad\Longrightarrow\qquad
      \nabla f(0,0) = (0,\,2)
      $$

      **Normalizando**, como pide el enunciado:

      $$
      \boxed{\;\vec u = (0,\,1)\;}
      $$

      > **La comprobación geométrica.** La curva de nivel $f=2$ es
      > $x^{2}y^{2}+2y=0$, o sea $y\,(x^{2}y+2)=0$. Cerca del origen la rama que
      > pasa por ahí es $y=0$: el eje horizontal. Y una perpendicular al eje
      > horizontal es, en efecto, el vertical. ✓
      >
      > Y el enunciado dice «**un** vector unitario», en singular indefinido:
      > $(0,-1)$ vale igual, y decirlo suma.

  - id: ex1819-4ev-2-el-rombo-que-se-vuelve-cuadrado
    titulo: El rombo que un cambio de variable vuelve cuadrado
    fuente: >-
      Ejercicio 2 · Cuarta evaluación (segundo cuatrimestral), 11 de marzo de
      2019 · Cálculo, UPV/EHU · Es el ejercicio 7.7 del boletín de problemas
      complementarios, que publica la solución.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3
    enunciado: |
      Sea la integral $I = \displaystyle\iint_{D}(2x-y+1)\,dx\,dy$, donde $D$ es
      el dominio limitado por $y=4x-4$, $y=4x+4$, $y=-4x-4$ e $y=-4x+4$.

      a) Dibujar el dominio $D$.

      b) Resolver la integral utilizando el cambio de variable
      $x = \dfrac{1}{2}(u+v)$, $y = 2v-2u$.
    pide: El dibujo del dominio y el valor de la integral.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado **da** el cambio de variable en vez de dejarlo elegir.
          ¿Qué suele significar eso?
        opciones:
          - texto: Que el cambio convierte el recinto en algo de límites constantes
            correcta: true
            mensaje: |
              Sí, y aquí lo convierte en un cuadrado. Cuando un enunciado regala
              el cambio, el trabajo es descubrir en qué se transforma el
              recinto — no inventarlo.
          - texto: Que sin ese cambio la integral no se puede resolver
            mensaje: |
              Se puede: es un polinomio sobre un rombo, y en cartesianas saldría
              partiendo en dos o cuatro trozos. Solo que es mucho más largo.
          - texto: Que hay que comprobar que el jacobiano vale 1
            mensaje: |
              No tiene por qué valer 1, y aquí vale 2. Lo que hay que hacer es
              calcularlo y meterlo dentro, no esperar que desaparezca.
      - tipo: calcular
        titulo: El jacobiano
        pregunta: |
          Con $x=\frac12(u+v)$ e $y=2v-2u$, el jacobiano es el determinante
          $\begin{vmatrix} 1/2 & 1/2 \\ -2 & 2\end{vmatrix}$. ¿Cuánto vale?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Cero significaría que el cambio no es válido —aplasta el plano—.
              Aquí es $\frac12\cdot 2 - \frac12\cdot(-2) = 1+1 = 2$: los dos
              términos suman, no se cancelan.
          - valor: '1'
            mensaje: |
              1 saldría de $\frac12\cdot 2$ solo. Falta el segundo producto, y
              como lleva un negativo, restarlo suma.
        pista: |
          $\frac12 \cdot 2 - \frac12 \cdot (-2)$. Restar un negativo suma.
        desarrollo: |
          $$
          J = \begin{vmatrix} \frac12 & \frac12 \\[2pt] -2 & 2 \end{vmatrix}
          = \frac12\cdot 2 - \frac12\cdot(-2) = 1+1 = 2
          $$

          El área se **duplica** al pasar de $uv$ a $xy$, y por eso hay que
          multiplicar por 2 dentro de la integral.
      - tipo: calcular
        titulo: La integral
        pregunta: |
          En las variables nuevas el recinto es el cuadrado $[-1,1]\times[-1,1]$
          y el integrando $3u-v+1$. Con el jacobiano 2, ¿cuánto vale $I$?
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              4 es la integral **sin** el jacobiano. El cambio duplica el área,
              así que hay que multiplicar por 2.
          - valor: '16'
            mensaje: |
              16 saldría de aplicar el jacobiano dos veces. Solo entra una.
        pista: |
          Los términos con u y con v se anulan por simetría; queda $2\cdot 1\cdot 4$.
        desarrollo: |
          $$
          I = \int_{-1}^{1}\!\!\int_{-1}^{1}\bigl(3u-v+1\bigr)\cdot 2\;du\,dv
          $$

          Los términos **impares se anulan** sobre un cuadrado centrado en el
          origen: $\iint 3u = 0$ y $\iint (-v) = 0$. Solo sobrevive el 1:

          $$
          I = 2\cdot 1\cdot \text{área}(uv) = 2\cdot 4 = 8
          $$
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'a) Las cuatro rectas forman un **rombo** de vértices $(\pm1,0)$ y $(0,\pm4)$.'
          - texto: 'b) Con el cambio dado, $y-4x = -4u$ e $y+4x = 4v$.'
          - texto: 'Las cuatro rectas pasan a ser $u=\pm1$ y $v=\pm1$: el rombo se convierte en un **cuadrado**.'
          - texto: 'Con jacobiano 2 y el integrando $3u-v+1$, la integral vale 8.'
          - texto: 'Como el rombo y el cuadrado tienen la misma área, el jacobiano tiene que valer 1.'
            trampa: true
            mensaje: |
              No la tienen. El rombo mide $\frac{d_1d_2}{2} = \frac{2\cdot 8}{2} = 8$
              y el cuadrado $2\times2 = 4$: el doble exacto, que es justo lo que
              dice el jacobiano $J=2$. **El jacobiano mide precisamente cuánto se
              deforma el área.**
      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 416 201" role="img" width="416" height="201"
               aria-labelledby="f-ex1819-rombo-t f-ex1819-rombo-d">
            <title id="f-ex1819-rombo-t">El rombo en el plano XY y el cuadrado en que lo convierte el cambio</title>
            <desc id="f-ex1819-rombo-d">A la izquierda, el rombo de vértices (1,0), (0,4), (−1,0) y (0,−4), formado por cuatro rectas: dos de pendiente cuatro y dos de pendiente menos cuatro. A la derecha, su imagen tras el cambio de variable: el cuadrado de lado dos que va de menos uno a uno en u y de menos uno a uno en v. Cada vértice lleva su letra para poder emparejarlos entre los dos dibujos.</desc>
