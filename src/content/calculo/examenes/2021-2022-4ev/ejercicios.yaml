          <line x1="120" y1="160" x2="120" y2="20" stroke="var(--rule)" stroke-width="1.2"></line>
          <text x="14" y="156" font-size="10" fill="var(--faint)" font-family="var(--mono)">−2</text>
          <text x="166" y="156" font-size="10" fill="var(--faint)" font-family="var(--mono)">1</text>
          <text x="214" y="156" font-size="10" fill="var(--faint)" font-family="var(--mono)">2</text>
          <text x="100" y="44" font-size="10" fill="var(--faint)" font-family="var(--mono)">2</text>
          <text x="100" y="94" font-size="10" fill="var(--faint)" font-family="var(--mono)">1</text>
          <text x="132" y="120" font-size="12" fill="var(--alt)" font-family="var(--mono)">H</text>
          <text x="-16" y="176" font-size="10.5" fill="var(--graphite)" font-family="var(--mono)">el semicírculo aporta momento 0; el rectángulo, H/2</text>
        </svg>
        <figcaption>
          Sin el rectángulo la pieza sería simétrica y su centro caería sobre el
          eje. <strong>Todo el desplazamiento lo produce ese añadido</strong>, y
          por eso el ejercicio se resuelve sin integrar nada.
        </figcaption>
      </figure>

      **El semicírculo** de radio 2 tiene área $2\pi$, y **por simetría** su
      centro está sobre el eje $Y$:

      $$
      x_c^{\text{semi}} = 0
      \qquad\Longrightarrow\qquad
      \text{momento}_x = 0
      $$

      **El rectángulo** de base 1 —de $x=0$ a $x=1$— y altura $H$ tiene área $H$
      y su centro en $x = 1/2$:

      $$
      \text{momento}_x = H\cdot\tfrac12 = \tfrac{H}{2}
      $$

      **Juntando:**

      $$
      x_c = \frac{0 + H/2}{2\pi + H} = \frac{H/2}{2\pi+H}
      $$

      **Igualando al valor pedido:**

      $$
      \frac{H/2}{2\pi+H} = \frac{1}{4\pi+2}
      \;\Longrightarrow\;
      H(4\pi+2) = 4\pi+2H
      \;\Longrightarrow\;
      \boxed{H = 1}
      $$

      > **Ninguna integral.** Los dos centros de gravedad son conocidos —el del
      > semicírculo por simetría en $x$, el del rectángulo por ser un
      > rectángulo— y el resto es aritmética. Reconocer eso es el punto de
      > COMP1: el ejercicio parece de integral múltiple y no lo es.

  - id: ex2122-4ev-3-paraboloide-eliptico
    titulo: El volumen de un paraboloide elíptico
    fuente: >-
      Ejercicio 3 · Cuarta evaluación, 28 de marzo de 2022 · Cálculo, UPV/EHU
      · El resultado coincide con el del ejercicio 7.27(b) del boletín de
      problemas complementarios, que sí publica solución.
    nivel: examen
    puntos:
      comp2: 8
      comp4: 2
    enunciado: |
      Sea $S$ el sólido definido por las condiciones
      $\dfrac{y^{2}}{9}+\dfrac{z^{2}}{3}\le x$, $x\le 3$.

      a) Dibujar el sólido $S$.
      b) Calcular el volumen de $S$.
    pide: El dibujo del sólido y su volumen.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al cortar el sólido por un plano $x = $ constante, ¿qué sale?
        opciones:
          - texto: Una elipse, cuyos semiejes crecen con x
            correcta: true
            mensaje: |
              Sí. Para $x$ fijo la condición es una elipse de semiejes
              $3\sqrt{x}$ y $\sqrt{3x}$. Es un **paraboloide elíptico** con eje
              el eje $X$.
          - texto: Una circunferencia
            mensaje: |
              Sería circunferencia si los denominadores 9 y 3 fueran iguales.
              Al ser distintos, la sección es una elipse.
          - texto: Un rectángulo
            mensaje: |
              Los términos van al cuadrado, así que la sección es curva. Un
              rectángulo saldría de condiciones del tipo $|y|\le a$, $|z|\le b$.
      - tipo: calcular
        titulo: El área de la sección
        pregunta: |
          La sección en $x$ es la elipse de semiejes $3\sqrt{x}$ y $\sqrt{3x}$.
          Su área es $\pi ab = c\,x$. ¿Cuánto vale el coeficiente $c$?
        respuesta:
          tipo: numero
          valor: '5.1962'
          tolerancia: 0.02
          formato: en forma exacta (3√3) o con cuatro decimales
        distractores:
          - valor: '3'
            mensaje: |
              3 es uno de los factores, pero falta el otro:
              $3\sqrt x\cdot\sqrt{3x} = 3\sqrt3\,x$, así que el coeficiente lleva
              un $\sqrt3$ más.
          - valor: '9'
            mensaje: |
              9 es el denominador del primer término, no el coeficiente del
              área. Multiplica los dos semiejes con cuidado.
        pista: |
          $3\sqrt{x}\cdot\sqrt{3x} = 3\sqrt{3}\,x$. Y $3\sqrt3 \approx 5{,}196$.
        desarrollo: |
          $$
          A(x) = \pi\cdot 3\sqrt{x}\cdot\sqrt{3x} = 3\sqrt3\,\pi\,x
          $$

          El área crece **linealmente** con $x$, que es la firma del paraboloide.
      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Integrando $A(x)$ de 0 a 3, el volumen sale
          $\dfrac{27\sqrt3\,\pi}{2}$. ¿Cuánto vale con dos decimales?
        respuesta:
          tipo: numero
          valor: '73.46'
          tolerancia: 0.1
          formato: en forma exacta o con dos decimales
        distractores:
          - valor: '146.92'
            mensaje: |
              El doble. Al integrar $x$ de 0 a 3 sale $x^{2}/2 = 9/2$, no 9.
              Falta el medio.
          - valor: '48.97'
            mensaje: |
              $9\sqrt3\pi$ saldría de multiplicar el área por la altura 3 como
              si fuera un cilindro. Pero la sección **crece** con $x$, así que
              hay que integrar.
        pista: |
          $3\sqrt3\pi \cdot 9/2$. Y $\sqrt3 \approx 1{,}732$.
        desarrollo: |
          $$
          V = \int_{0}^{3} 3\sqrt3\,\pi\,x\;dx
          = 3\sqrt3\,\pi\left[\frac{x^{2}}{2}\right]_{0}^{3}
          = \frac{27\sqrt3\,\pi}{2} \approx 73{,}46
          $$
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'a) Es un paraboloide elíptico con eje el eje $X$, vértice en el origen y abierto hacia las $x$ positivas.'
          - texto: 'La tapa es el plano $x=3$, donde la sección es la elipse de semiejes $3\sqrt3$ y 3.'
          - texto: 'b) La sección en $x$ tiene área $3\sqrt3\,\pi\,x$, que crece linealmente.'
          - texto: 'Integrando de 0 a 3 sale $V = 27\sqrt3\,\pi/2 \approx 73{,}46$.'
          - texto: 'b) Como el área de la sección crece con $x$, el volumen es el área máxima por la altura.'
            trampa: true
            mensaje: |
              Eso valdría para un cilindro, donde la sección es constante. Aquí
              crece de 0 a $9\sqrt3\pi$, así que hay que **integrar**. Multiplicar
              por la altura daría el doble del volumen real, precisamente porque
              el crecimiento es lineal y la media es la mitad del máximo.
      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 416 201" role="img" width="416" height="201"
               aria-labelledby="f-ex2122-parab-tumbado-t f-ex2122-parab-tumbado-d">
