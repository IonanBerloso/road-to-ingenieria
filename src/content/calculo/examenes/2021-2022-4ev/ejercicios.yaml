ejercicios:
  - id: ex2122-4ev-1-vertido-en-el-oceano
    titulo: El vertido en el océano
    fuente: >-
      Ejercicio 1 · Cuarta evaluación, 28 de marzo de 2022 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3
    enunciado: |
      Un barco petrolero ha vertido parte de su carga al océano. De forma
      aproximada, la contaminación de las aguas superficiales se rige por la
      ecuación

      $$
      f(x,y) = A\,e^{-(x+1)^{2}-y^{2}}\qquad \text{Tn}/\text{m}^{2}
      $$

      donde $A$ es una constante positiva.

      a) Calcular la variación que se espera en la contaminación si nos
      desplazamos desde el punto $P(0,1)$ en la dirección $v = (-1,1)$. ¿Qué se
      deduce del resultado obtenido?

      b) Tras un estudio realizado en el punto $Q(1,0)$ se observa que la máxima
      variación de la contaminación es de $16\,e^{-4}$. Calcular el valor de $A$.

      c) Calcular y representar gráficamente las curvas de nivel
      correspondientes a los puntos $P(0,1)$ y $Q(1,0)$.

      d) Razonar cuál es el punto del océano de mayor contaminación.
    pide: La variación en P, el valor de A, las dos curvas de nivel y el máximo.
    pasos:
      - tipo: reconocer
        pregunta: |
          La función solo depende de $(x+1)^{2}+y^{2}$. ¿Qué forma tienen sus
          curvas de nivel?
        opciones:
          - texto: Circunferencias centradas en (−1,0)
            correcta: true
            mensaje: |
              Sí. El $(x+1)$ desplaza el centro una unidad a la izquierda. Verlo
              antes de derivar contesta los apartados c) y d) casi enteros.
          - texto: Circunferencias centradas en el origen
            mensaje: |
              Lo serían si fuera $x^{2}+y^{2}$. El $(x+1)^{2}$ mueve el centro a
              $(-1,0)$, que es justo donde cayó el vertido.
          - texto: Elipses
            mensaje: |
              Saldrían elipses si los coeficientes de $x$ y de $y$ fueran
              distintos. Aquí los dos son 1, así que son circunferencias.
      - tipo: calcular
        titulo: La variación en la dirección v
        pregunta: |
          En $P(0,1)$ el gradiente es $A e^{-2}(-2,-2)$. ¿Cuánto vale la derivada
          direccional siguiendo $v=(-1,1)$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0.5413'
            mensaje: |
              Parece que has sumado en vez de restar dentro del producto
              escalar. $(-2)(-1) + (-2)(1) = 2 - 2 = 0$: los dos términos se
              cancelan.
          - valor: '-0.5413'
            mensaje: |
              Mismo problema con el signo. El producto escalar sale
              **exactamente cero**, y eso es lo que el apartado quiere que
              descubras.
        pista: |
          $(-2)(-1) + (-2)(1)$. Fíjate en que los dos términos se cancelan.
        desarrollo: |
          $$
          \nabla f(0,1)\cdot v = A e^{-2}\bigl[(-2)(-1) + (-2)(1)\bigr]
          = A e^{-2}(2-2) = 0
          $$

          **Sale cero, y eso es la respuesta al «¿qué se deduce?»**: la
          dirección $v$ es tangente a la curva de nivel que pasa por $P$, así
          que moviéndose por ahí la contaminación no cambia.
      - tipo: calcular
        titulo: El valor de A
        pregunta: |
          En $Q(1,0)$ el gradiente es $A e^{-4}(-4,0)$, de módulo $4A e^{-4}$.
          Si la máxima variación vale $16 e^{-4}$, ¿cuánto vale $A$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '16'
            mensaje: |
              16 es el dato del enunciado, no el valor de $A$. Hay que dividirlo
              entre el 4 que sale del gradiente.
          - valor: '64'
            mensaje: |
              Has multiplicado en vez de dividir. La ecuación es
              $4A e^{-4} = 16 e^{-4}$, así que $A = 16/4$.
        pista: |
          Las exponenciales se cancelan y queda $4A = 16$.
        desarrollo: |
          En $Q(1,0)$ el exponente vale $-(1+1)^{2}-0 = -4$, así que

          $$
          \lVert\nabla f(1,0)\rVert = 4A\,e^{-4} = 16\,e^{-4}
          \qquad\Longrightarrow\qquad
          A = 4
          $$

          **Las exponenciales se cancelan a propósito**: el enunciado da el dato
          con el mismo $e^{-4}$ para que la cuenta salga sin calculadora.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'a) La derivada direccional en $P$ sale **cero**, luego $v$ es tangente a la curva de nivel por $P$.'
          - texto: 'b) De $4Ae^{-4} = 16e^{-4}$ sale $A = 4$.'
          - texto: 'c) Las curvas de nivel son circunferencias de centro $(-1,0)$: por $P$ la de radio $\sqrt2$, por $Q$ la de radio 2.'
          - texto: 'd) La contaminación es máxima donde el exponente se anula, o sea en $(-1,0)$, y allí vale $A=4$ Tn/m².'
          - texto: 'a) Como la variación es cero, el punto $P$ es un máximo de la contaminación.'
            trampa: true
            mensaje: |
              Que una **derivada direccional** se anule no hace máximo a un
              punto: solo dice que en **esa** dirección no cambia. Para ser
              máximo tendría que anularse el gradiente entero, y en $P$ vale
              $Ae^{-2}(-2,-2)\neq(0,0)$.
    resolucion: |
      **La función tiene simetría radial alrededor de $(-1,0)$**, que es donde
      cayó el vertido. Verlo antes de derivar contesta medio ejercicio.

      Las parciales:

      $$
      \nabla f = A\,e^{-(x+1)^{2}-y^{2}}\bigl(-2(x+1),\; -2y\bigr)
      $$

      **a) La variación en $P(0,1)$.** Ahí el exponente vale $-1-1=-2$:

      $$
      \nabla f(0,1) = A e^{-2}(-2,-2)
      $$

      $$
      \nabla f(0,1)\cdot v = A e^{-2}\bigl[(-2)(-1)+(-2)(1)\bigr] = 0
      $$

      **Y lo que se deduce** es la parte que puntúa: la variación es nula porque
      $v=(-1,1)$ es **tangente a la curva de nivel** que pasa por $P$. Un barco
      que se moviera en esa dirección encontraría la misma contaminación.

      **b) El valor de $A$.** En $Q(1,0)$ el exponente vale $-4$:

      $$
      \lVert\nabla f(1,0)\rVert = 4A e^{-4} = 16 e^{-4}
      \qquad\Longrightarrow\qquad
      \boxed{A = 4}
      $$

      **c) Las curvas de nivel.** Como $f$ solo depende de
      $(x+1)^{2}+y^{2}$, son **circunferencias centradas en $(-1,0)$**:

      | punto | distancia al centro | curva |
      |---|---|---|
      | $P(0,1)$ | $\sqrt{1+1}=\sqrt2$ | $(x+1)^{2}+y^{2}=2$ |
      | $Q(1,0)$ | $2$ | $(x+1)^{2}+y^{2}=4$ |

      **d) El punto de mayor contaminación.** La exponencial es máxima cuando su
      exponente es lo menos negativo posible, o sea **cero**:

      $$
      (x+1)^{2}+y^{2} = 0 \;\Longrightarrow\; (x,y) = (-1,0)
      $$

      Y allí $f = A e^{0} = 4$ Tn/m². Es el punto del vertido, como cabía
      esperar.

      > **El apartado d) no necesita derivar nada.** «Razonar» es la palabra del
      > enunciado, y el razonamiento es que una exponencial decreciente es
      > máxima donde su exponente se anula. Ponerse a resolver
      > $\nabla f = (0,0)$ llega al mismo sitio dando un rodeo.

  - id: ex2122-4ev-2-pieza-con-rectangulo
    titulo: La pieza semicircular con un rectángulo encima
    fuente: >-
      Ejercicio 2 · Cuarta evaluación, 28 de marzo de 2022 · Cálculo, UPV/EHU
      · Figura redibujada en SVG a partir del enunciado original (CLAUDE.md
      §08). El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Un taller está diseñando la pieza plana que muestra la figura: la forma
      de la pieza es **semicircular** de radio 2, y sobre ella se ha añadido un
      **rectángulo** de base 1 —de $x=0$ a $x=1$— y altura $H$, hecho con el
      mismo material.

      ¿Cuál debe ser el valor de $H$ para que la coordenada $x_c$ del centro de
      gravedad $(x_c, y_c)$ de la pieza sea

      $$
      x_c = \frac{1}{4\pi+2}\;?
      $$
    pide: El valor de la altura H.
    pasos:
      - tipo: reconocer
        pregunta: |
          La pieza es un semicírculo **más** un rectángulo. ¿Cómo se combinan
          sus centros de gravedad?
        opciones:
          - texto: Se suman los momentos y se divide entre la masa total
            correcta: true
            mensaje: |
              Eso es. El momento es aditivo: se calcula el de cada pieza por
              separado y se suman. Los centros de gravedad **no** se promedian
              sin más, hay que pesarlos por su masa.
          - texto: Se hace la media de los dos centros de gravedad
            mensaje: |
              Solo valdría si las dos piezas tuvieran la misma masa. Aquí el
              semicírculo tiene área $2\pi\approx 6{,}28$ y el rectángulo solo
              $H$: pesan muy distinto.
          - texto: El centro de la pieza es el del semicírculo, porque es mucho mayor
            mensaje: |
              El semicírculo domina, sí, pero no anula al rectángulo — y de
              hecho el rectángulo es lo único que desplaza el centro del eje.
              Sin él, $x_c$ sería exactamente 0.
      - tipo: calcular
        titulo: El área del semicírculo
        pregunta: |
          ¿Cuánto vale el área de un semicírculo de radio 2?
        respuesta:
          tipo: numero
          valor: '6.2832'
          tolerancia: 0.02
          formato: en forma exacta (2pi) o con cuatro decimales
        distractores:
          - valor: '12.566'
            mensaje: |
              $4\pi$ es el círculo **entero** de radio 2. La pieza es solo la
              mitad de arriba.
          - valor: '3.1416'
            mensaje: |
              $\pi$ sería medio círculo de radio $\sqrt2$, o el cuarto de uno de
              radio 2. Con $R=2$: $\pi R^{2}/2 = 2\pi$.
        pista: |
          $\pi R^2 / 2$ con R = 2.
        desarrollo: |
          $$
          A_{\text{semi}} = \frac{\pi\cdot 2^{2}}{2} = 2\pi \approx 6{,}283
          $$

          Y su centro está sobre el eje $Y$: $x_c^{\text{semi}} = 0$ **por
          simetría**, sin integrar.
      - tipo: calcular
        titulo: La altura H
        pregunta: |
          Planteando $\dfrac{H/2}{2\pi+H} = \dfrac{1}{4\pi+2}$, ¿cuánto vale $H$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Con $H=2$ saldría $x_c = 1/(2\pi+2)\approx 0{,}123$, casi el doble
              de lo pedido. Despeja: los términos en $H$ se cancelan y queda
              $4\pi H = 4\pi$.
          - valor: '0.5'
            mensaje: |
              Con $H=0{,}5$ el centro se queda en $0{,}037$, la mitad de lo
              pedido. La ecuación da exactamente 1.
        pista: |
          Multiplica en cruz: $H(4\pi+2) = 2(2\pi+H)$. Los 2H se cancelan.
        desarrollo: |
          $$
          \frac{H/2}{2\pi+H} = \frac{1}{4\pi+2}
          \;\Longrightarrow\;
          H\,(4\pi+2) = 2\,(2\pi+H)
          $$

          $$
          4\pi H + 2H = 4\pi + 2H
          \;\Longrightarrow\;
          4\pi H = 4\pi
          \;\Longrightarrow\;
          H = 1
          $$

          **Los $2H$ se cancelan** y el $4\pi$ también: el enunciado está
          construido para que salga un 1 redondo.
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El semicírculo tiene área $2\pi$ y su centro está en el eje $Y$, así que aporta momento **cero** en $x$.'
          - texto: 'El rectángulo tiene área $H$ y su centro está en $x=1/2$, así que aporta momento $H/2$.'
          - texto: 'Luego $x_c = \dfrac{H/2}{2\pi+H}$.'
          - texto: 'Igualando a $1/(4\pi+2)$ y despejando sale $H=1$.'
          - texto: 'Como el rectángulo está dentro del semicírculo, no añade área y $x_c$ vale 0.'
            trampa: true
            mensaje: |
              El enunciado dice que se ha **añadido encima**: es material extra
              apilado sobre el semicírculo, no un trozo suyo. Si no añadiera
              nada, la pieza sería simétrica y $x_c$ sería cero — que es
              justamente lo que el ejercicio quiere que deje de pasar.
    resolucion: |
      **La idea es que el momento es aditivo.** Se calcula el de cada pieza por
      separado, se suman, y se divide entre el área total.

      <figure class="figura-examen">
        <svg viewBox="-30 -30 320 200" role="img" aria-labelledby="e2122T e2122D">
          <title id="e2122T">La pieza: un semicírculo con un rectángulo añadido</title>
          <desc id="e2122D">Un semicírculo de radio 2 apoyado en el eje horizontal, y sobre su mitad derecha un rectángulo de base 1 y altura H que arranca del eje y llega hasta la altura H.</desc>
          <path d="M20 140 A100 100 0 0 1 220 140 Z" fill="var(--live-soft)" stroke="var(--live)" stroke-width="2"></path>
          <rect x="120" y="90" width="50" height="50" fill="var(--alt-soft)" stroke="var(--alt)" stroke-width="2"></rect>
          <line x1="-10" y1="140" x2="250" y2="140" stroke="var(--rule)" stroke-width="1.2"></line>
          <line x1="120" y1="160" x2="120" y2="20" stroke="var(--rule)" stroke-width="1.2"></line>
          <text x="14" y="156" font-size="10" fill="var(--faint)" font-family="var(--mono)">−2</text>
          <text x="166" y="156" font-size="10" fill="var(--faint)" font-family="var(--mono)">1</text>
          <text x="214" y="156" font-size="10" fill="var(--faint)" font-family="var(--mono)">2</text>
          <text x="100" y="44" font-size="10" fill="var(--faint)" font-family="var(--mono)">2</text>
          <text x="100" y="94" font-size="10" fill="var(--faint)" font-family="var(--mono)">1</text>
          <text x="132" y="120" font-size="12" fill="var(--alt)" font-family="var(--mono)">H</text>
          <text x="-16" y="176" font-size="10.5" fill="var(--graphite)" font-family="var(--mono)">el semicírculo aporta momento 0; el rectángulo, H/2</text>
        </svg>
        <figcaption>
          Sin el rectángulo la pieza sería simétrica y su centro caería sobre el
          eje. <strong>Todo el desplazamiento lo produce ese añadido</strong>, y
          por eso el ejercicio se resuelve sin integrar nada.
        </figcaption>
      </figure>

      **El semicírculo** de radio 2 tiene área $2\pi$, y **por simetría** su
      centro está sobre el eje $Y$:

      $$
      x_c^{\text{semi}} = 0
      \qquad\Longrightarrow\qquad
      \text{momento}_x = 0
      $$

      **El rectángulo** de base 1 —de $x=0$ a $x=1$— y altura $H$ tiene área $H$
      y su centro en $x = 1/2$:

      $$
      \text{momento}_x = H\cdot\tfrac12 = \tfrac{H}{2}
      $$

      **Juntando:**

      $$
      x_c = \frac{0 + H/2}{2\pi + H} = \frac{H/2}{2\pi+H}
      $$

      **Igualando al valor pedido:**

      $$
      \frac{H/2}{2\pi+H} = \frac{1}{4\pi+2}
      \;\Longrightarrow\;
      H(4\pi+2) = 4\pi+2H
      \;\Longrightarrow\;
      \boxed{H = 1}
      $$

      > **Ninguna integral.** Los dos centros de gravedad son conocidos —el del
      > semicírculo por simetría en $x$, el del rectángulo por ser un
      > rectángulo— y el resto es aritmética. Reconocer eso es el punto de
      > COMP1: el ejercicio parece de integral múltiple y no lo es.

  - id: ex2122-4ev-3-paraboloide-eliptico
    titulo: El volumen de un paraboloide elíptico
    fuente: >-
      Ejercicio 3 · Cuarta evaluación, 28 de marzo de 2022 · Cálculo, UPV/EHU
      · El resultado coincide con el del ejercicio 7.27(b) del boletín de
      problemas complementarios, que sí publica solución.
    nivel: examen
    puntos:
      comp2: 8
      comp4: 2
    enunciado: |
      Sea $S$ el sólido definido por las condiciones
      $\dfrac{y^{2}}{9}+\dfrac{z^{2}}{3}\le x$, $x\le 3$.

      a) Dibujar el sólido $S$.
      b) Calcular el volumen de $S$.
    pide: El dibujo del sólido y su volumen.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al cortar el sólido por un plano $x = $ constante, ¿qué sale?
        opciones:
          - texto: Una elipse, cuyos semiejes crecen con x
            correcta: true
            mensaje: |
              Sí. Para $x$ fijo la condición es una elipse de semiejes
              $3\sqrt{x}$ y $\sqrt{3x}$. Es un **paraboloide elíptico** con eje
              el eje $X$.
          - texto: Una circunferencia
            mensaje: |
              Sería circunferencia si los denominadores 9 y 3 fueran iguales.
              Al ser distintos, la sección es una elipse.
          - texto: Un rectángulo
            mensaje: |
              Los términos van al cuadrado, así que la sección es curva. Un
              rectángulo saldría de condiciones del tipo $|y|\le a$, $|z|\le b$.
      - tipo: calcular
        titulo: El área de la sección
        pregunta: |
          La sección en $x$ es la elipse de semiejes $3\sqrt{x}$ y $\sqrt{3x}$.
          Su área es $\pi ab = c\,x$. ¿Cuánto vale el coeficiente $c$?
        respuesta:
          tipo: numero
          valor: '5.1962'
          tolerancia: 0.02
          formato: en forma exacta (3√3) o con cuatro decimales
        distractores:
          - valor: '3'
            mensaje: |
              3 es uno de los factores, pero falta el otro:
              $3\sqrt x\cdot\sqrt{3x} = 3\sqrt3\,x$, así que el coeficiente lleva
              un $\sqrt3$ más.
          - valor: '9'
            mensaje: |
              9 es el denominador del primer término, no el coeficiente del
              área. Multiplica los dos semiejes con cuidado.
        pista: |
          $3\sqrt{x}\cdot\sqrt{3x} = 3\sqrt{3}\,x$. Y $3\sqrt3 \approx 5{,}196$.
        desarrollo: |
          $$
          A(x) = \pi\cdot 3\sqrt{x}\cdot\sqrt{3x} = 3\sqrt3\,\pi\,x
          $$

          El área crece **linealmente** con $x$, que es la firma del paraboloide.
      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Integrando $A(x)$ de 0 a 3, el volumen sale
          $\dfrac{27\sqrt3\,\pi}{2}$. ¿Cuánto vale con dos decimales?
        respuesta:
          tipo: numero
          valor: '73.46'
          tolerancia: 0.1
          formato: en forma exacta o con dos decimales
        distractores:
          - valor: '146.92'
            mensaje: |
              El doble. Al integrar $x$ de 0 a 3 sale $x^{2}/2 = 9/2$, no 9.
              Falta el medio.
          - valor: '48.97'
            mensaje: |
              $9\sqrt3\pi$ saldría de multiplicar el área por la altura 3 como
              si fuera un cilindro. Pero la sección **crece** con $x$, así que
              hay que integrar.
        pista: |
          $3\sqrt3\pi \cdot 9/2$. Y $\sqrt3 \approx 1{,}732$.
        desarrollo: |
          $$
          V = \int_{0}^{3} 3\sqrt3\,\pi\,x\;dx
          = 3\sqrt3\,\pi\left[\frac{x^{2}}{2}\right]_{0}^{3}
          = \frac{27\sqrt3\,\pi}{2} \approx 73{,}46
          $$
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'a) Es un paraboloide elíptico con eje el eje $X$, vértice en el origen y abierto hacia las $x$ positivas.'
          - texto: 'La tapa es el plano $x=3$, donde la sección es la elipse de semiejes $3\sqrt3$ y 3.'
          - texto: 'b) La sección en $x$ tiene área $3\sqrt3\,\pi\,x$, que crece linealmente.'
          - texto: 'Integrando de 0 a 3 sale $V = 27\sqrt3\,\pi/2 \approx 73{,}46$.'
          - texto: 'b) Como el área de la sección crece con $x$, el volumen es el área máxima por la altura.'
            trampa: true
            mensaje: |
              Eso valdría para un cilindro, donde la sección es constante. Aquí
              crece de 0 a $9\sqrt3\pi$, así que hay que **integrar**. Multiplicar
              por la altura daría el doble del volumen real, precisamente porque
              el crecimiento es lineal y la media es la mitad del máximo.
    resolucion: |
      **a) El sólido.** La condición
      $\frac{y^{2}}{9}+\frac{z^{2}}{3}\le x$ describe un **paraboloide
      elíptico** con eje el eje $X$: al cortar por $x$ constante sale la elipse

      $$
      \frac{y^{2}}{9x}+\frac{z^{2}}{3x}\le 1,
      \qquad
      \text{de semiejes } 3\sqrt x \text{ y } \sqrt{3x}
      $$

      Nace en un punto en el origen y se abre hacia la derecha, cerrado por la
      tapa $x=3$.

      **b) El volumen, por secciones**, que es el camino corto:

      $$
      A(x) = \pi\cdot 3\sqrt{x}\cdot\sqrt{3x} = 3\sqrt3\,\pi\,x
      $$

      $$
      V = \int_{0}^{3} 3\sqrt3\,\pi\,x\;dx = 3\sqrt3\,\pi\cdot\frac{9}{2}
      = \boxed{\frac{27\sqrt3\,\pi}{2} \approx 73{,}46}
      $$

      > **Por qué integrar por secciones y no en cilíndricas generalizadas.**
      > Las dos valen y dan lo mismo. Pero aquí el área de la sección se conoce
      > de memoria —es la de una elipse— y depende solo de $x$, así que la
      > integral triple se colapsa en una simple. **Antes de montar un cambio de
      > coordenadas conviene mirar si el sólido se deja rebanar.**
      >
      > Y la comprobación de plausibilidad: el sólido cabe en un cilindro de
      > sección la elipse mayor —área $9\sqrt3\pi$— y longitud 3, o sea
      > $27\sqrt3\pi$. Sale la mitad exacta, que es lo que corresponde a una
      > sección que crece linealmente desde cero. ✓
