        consigna: |
          Dibuja en el plano $XY$ el punto $P$, la curva de nivel que pasa por
          él, la dirección $v$ y la del gradiente. Marca el centro del vertido.
        comprueba:
          - punto: |
              El máximo de contaminación en $\left(-1,0\right)$, marcado.
            porque: |
              La exponencial es máxima donde el exponente se anula. Es el centro
              del vertido y el centro de todas las curvas de nivel.
          - punto: |
              La curva de nivel por $P\left(0,1\right)$: la circunferencia de
              centro $\left(-1,0\right)$ y radio $\sqrt2$.
            porque: |
              $\left(0+1\right)^{2}+1^{2}=2$. Las curvas de nivel son
              circunferencias concéntricas porque el exponente depende solo de la
              distancia al centro.
          - punto: |
              La flecha del gradiente en $P$ apuntando **hacia** el centro, en la
              dirección $\left(-1,-1\right)$.
            porque: |
              La contaminación crece hacia el vertido. El gradiente es
              perpendicular a la circunferencia, o sea sobre el radio, y apunta
              hacia dentro.
          - punto: |
              La dirección $v=\left(-1,1\right)$ dibujada desde $P$, y que es
              **tangente** a la curva de nivel.
            porque: |
              $\left(-1,1\right)$ es perpendicular a $\left(-1,-1\right)$: el
              producto escalar es $1-1=0$. Por eso la variación en esa dirección
              es **nula**, y eso es lo que el apartado (a) pide deducir.
        veredicto: |
          El dibujo contesta el apartado (a) sin derivar: $v$ va a lo largo de la
          curva de nivel, así que la concentración no cambia. Ver la
          perpendicularidad en el papel es más convincente que el producto
          escalar.

    resolucion: |
      **La función tiene simetría radial alrededor de $(-1,0)$**, que es donde
      cayó el vertido. Verlo antes de derivar contesta medio ejercicio.

      Las parciales:

      $$
      \nabla f = A\,e^{-(x+1)^{2}-y^{2}}\bigl(-2(x+1),\; -2y\bigr)
      $$

      **a) La variación en $P(0,1)$.** Ahí el exponente vale $-1-1=-2$:

      $$
      \nabla f(0,1) = A e^{-2}(-2,-2)
      $$

      $$
      \nabla f(0,1)\cdot v = A e^{-2}\bigl[(-2)(-1)+(-2)(1)\bigr] = 0
      $$

      **Y lo que se deduce** es la parte que puntúa: la variación es nula porque
      $v=(-1,1)$ es **tangente a la curva de nivel** que pasa por $P$. Un barco
      que se moviera en esa dirección encontraría la misma contaminación.

      **b) El valor de $A$.** En $Q(1,0)$ el exponente vale $-4$:

      $$
      \lVert\nabla f(1,0)\rVert = 4A e^{-4} = 16 e^{-4}
      \qquad\Longrightarrow\qquad
      \boxed{A = 4}
      $$

      **c) Las curvas de nivel.** Como $f$ solo depende de
      $(x+1)^{2}+y^{2}$, son **circunferencias centradas en $(-1,0)$**:

      | punto | distancia al centro | curva |
      |---|---|---|
      | $P(0,1)$ | $\sqrt{1+1}=\sqrt2$ | $(x+1)^{2}+y^{2}=2$ |
      | $Q(1,0)$ | $2$ | $(x+1)^{2}+y^{2}=4$ |

      **d) El punto de mayor contaminación.** La exponencial es máxima cuando su
      exponente es lo menos negativo posible, o sea **cero**:

      $$
      (x+1)^{2}+y^{2} = 0 \;\Longrightarrow\; (x,y) = (-1,0)
      $$

      Y allí $f = A e^{0} = 4$ Tn/m². Es el punto del vertido, como cabía
      esperar.

      > **El apartado d) no necesita derivar nada.** «Razonar» es la palabra del
      > enunciado, y el razonamiento es que una exponencial decreciente es
      > máxima donde su exponente se anula. Ponerse a resolver
      > $\nabla f = (0,0)$ llega al mismo sitio dando un rodeo.

  - id: ex2122-4ev-2-pieza-con-rectangulo
    titulo: La pieza semicircular con un rectángulo encima
    fuente: >-
      Ejercicio 2 · Cuarta evaluación, 28 de marzo de 2022 · Cálculo, UPV/EHU
      · Figura redibujada en SVG a partir del enunciado original, porque las
      figuras de terceros se redibujan y no se recortan. El examen no publica
      solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Un taller está diseñando la pieza plana que muestra la figura: la forma
      de la pieza es **semicircular** de radio 2, y sobre ella se ha añadido un
      **rectángulo** de base 1 —de $x=0$ a $x=1$— y altura $H$, hecho con el
      mismo material.

      ¿Cuál debe ser el valor de $H$ para que la coordenada $x_c$ del centro de
      gravedad $(x_c, y_c)$ de la pieza sea

      $$
      x_c = \frac{1}{4\pi+2}\;?
      $$
    pide: El valor de la altura H.
    pasos:
      - tipo: reconocer
        pregunta: |
          La pieza es un semicírculo **más** un rectángulo. ¿Cómo se combinan
          sus centros de gravedad?
        opciones:
          - texto: Se suman los momentos y se divide entre la masa total
            correcta: true
            mensaje: |
              Eso es. El momento es aditivo: se calcula el de cada pieza por
              separado y se suman. Los centros de gravedad **no** se promedian
              sin más, hay que pesarlos por su masa.
          - texto: Se hace la media de los dos centros de gravedad
            mensaje: |
              Solo valdría si las dos piezas tuvieran la misma masa. Aquí el
              semicírculo tiene área $2\pi\approx 6{,}28$ y el rectángulo solo
              $H$: pesan muy distinto.
          - texto: El centro de la pieza es el del semicírculo, porque es mucho mayor
            mensaje: |
              El semicírculo domina, sí, pero no anula al rectángulo — y de
              hecho el rectángulo es lo único que desplaza el centro del eje.
              Sin él, $x_c$ sería exactamente 0.
      - tipo: calcular
        titulo: El área del semicírculo
        pregunta: |
          ¿Cuánto vale el área de un semicírculo de radio 2?
        respuesta:
          tipo: numero
          valor: '6.2832'
          tolerancia: 0.02
          formato: en forma exacta (2pi) o con cuatro decimales
        distractores:
          - valor: '12.566'
            mensaje: |
              $4\pi$ es el círculo **entero** de radio 2. La pieza es solo la
              mitad de arriba.
          - valor: '3.1416'
            mensaje: |
              $\pi$ sería medio círculo de radio $\sqrt2$, o el cuarto de uno de
              radio 2. Con $R=2$: $\pi R^{2}/2 = 2\pi$.
        pista: |
          $\pi R^2 / 2$ con R = 2.
        desarrollo: |
          $$
          A_{\text{semi}} = \frac{\pi\cdot 2^{2}}{2} = 2\pi \approx 6{,}283
          $$

          Y su centro está sobre el eje $Y$: $x_c^{\text{semi}} = 0$ **por
          simetría**, sin integrar.
      - tipo: calcular
        titulo: La altura H
        pregunta: |
          Planteando $\dfrac{H/2}{2\pi+H} = \dfrac{1}{4\pi+2}$, ¿cuánto vale $H$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Con $H=2$ saldría $x_c = 1/(2\pi+2)\approx 0{,}123$, casi el doble
              de lo pedido. Despeja: los términos en $H$ se cancelan y queda
              $4\pi H = 4\pi$.
          - valor: '0.5'
            mensaje: |
              Con $H=0{,}5$ el centro se queda en $0{,}037$, la mitad de lo
              pedido. La ecuación da exactamente 1.
        pista: |
          Multiplica en cruz: $H(4\pi+2) = 2(2\pi+H)$. Los 2H se cancelan.
        desarrollo: |
          $$
          \frac{H/2}{2\pi+H} = \frac{1}{4\pi+2}
          \;\Longrightarrow\;
          H\,(4\pi+2) = 2\,(2\pi+H)
          $$

          $$
          4\pi H + 2H = 4\pi + 2H
          \;\Longrightarrow\;
          4\pi H = 4\pi
          \;\Longrightarrow\;
          H = 1
          $$

          **Los $2H$ se cancelan** y el $4\pi$ también: el enunciado está
          construido para que salga un 1 redondo.
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'El semicírculo tiene área $2\pi$ y su centro está en el eje $Y$, así que aporta momento **cero** en $x$.'
          - texto: 'El rectángulo tiene área $H$ y su centro está en $x=1/2$, así que aporta momento $H/2$.'
          - texto: 'Luego $x_c = \dfrac{H/2}{2\pi+H}$.'
          - texto: 'Igualando a $1/(4\pi+2)$ y despejando sale $H=1$.'
          - texto: 'Como el rectángulo está dentro del semicírculo, no añade área y $x_c$ vale 0.'
            trampa: true
            mensaje: |
              El enunciado dice que se ha **añadido encima**: es material extra
              apilado sobre el semicírculo, no un trozo suyo. Si no añadiera
              nada, la pieza sería simétrica y $x_c$ sería cero — que es
              justamente lo que el ejercicio quiere que deje de pasar.
    resolucion: |
      **La idea es que el momento es aditivo.** Se calcula el de cada pieza por
      separado, se suman, y se divide entre el área total.

