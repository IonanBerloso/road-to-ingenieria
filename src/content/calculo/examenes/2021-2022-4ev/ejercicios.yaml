ejercicios:
  - id: ex2122-4ev-1-vertido-en-el-oceano
    titulo: El vertido en el océano
    fuente: >-
      Ejercicio 1 · Cuarta evaluación, 28 de marzo de 2022 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3
    enunciado: |
      Un barco petrolero ha vertido parte de su carga al océano. De forma
      aproximada, la contaminación de las aguas superficiales se rige por la
      ecuación

      $$
      f(x,y) = A\,e^{-(x+1)^{2}-y^{2}}\qquad \text{Tn}/\text{m}^{2}
      $$

      donde $A$ es una constante positiva.

      a) Calcular la variación que se espera en la contaminación si nos
      desplazamos desde el punto $P(0,1)$ en la dirección $v = (-1,1)$. ¿Qué se
      deduce del resultado obtenido?

      b) Tras un estudio realizado en el punto $Q(1,0)$ se observa que la máxima
      variación de la contaminación es de $16\,e^{-4}$. Calcular el valor de $A$.

      c) Calcular y representar gráficamente las curvas de nivel
      correspondientes a los puntos $P(0,1)$ y $Q(1,0)$.

      d) Razonar cuál es el punto del océano de mayor contaminación.
    pide: La variación en P, el valor de A, las dos curvas de nivel y el máximo.
    pasos:
      - tipo: reconocer
        pregunta: |
          La función solo depende de $(x+1)^{2}+y^{2}$. ¿Qué forma tienen sus
          curvas de nivel?
        opciones:
          - texto: Circunferencias centradas en (−1,0)
            correcta: true
            mensaje: |
              Sí. El $(x+1)$ desplaza el centro una unidad a la izquierda. Verlo
              antes de derivar contesta los apartados c) y d) casi enteros.
          - texto: Circunferencias centradas en el origen
            mensaje: |
              Lo serían si fuera $x^{2}+y^{2}$. El $(x+1)^{2}$ mueve el centro a
              $(-1,0)$, que es justo donde cayó el vertido.
          - texto: Elipses
            mensaje: |
              Saldrían elipses si los coeficientes de $x$ y de $y$ fueran
              distintos. Aquí los dos son 1, así que son circunferencias.
      - tipo: calcular
        titulo: La variación en la dirección v
        pregunta: |
          En $P(0,1)$ el gradiente es $A e^{-2}(-2,-2)$. ¿Cuánto vale la derivada
          direccional siguiendo $v=(-1,1)$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0.5413'
            mensaje: |
              Parece que has sumado en vez de restar dentro del producto
              escalar. $(-2)(-1) + (-2)(1) = 2 - 2 = 0$: los dos términos se
              cancelan.
          - valor: '-0.5413'
            mensaje: |
              Mismo problema con el signo. El producto escalar sale
              **exactamente cero**, y eso es lo que el apartado quiere que
              descubras.
        pista: |
          $(-2)(-1) + (-2)(1)$. Fíjate en que los dos términos se cancelan.
        desarrollo: |
          $$
          \nabla f(0,1)\cdot v = A e^{-2}\bigl[(-2)(-1) + (-2)(1)\bigr]
          = A e^{-2}(2-2) = 0
          $$

          **Sale cero, y eso es la respuesta al «¿qué se deduce?»**: la
          dirección $v$ es tangente a la curva de nivel que pasa por $P$, así
          que moviéndose por ahí la contaminación no cambia.
      - tipo: calcular
        titulo: El valor de A
        pregunta: |
          En $Q(1,0)$ el gradiente es $A e^{-4}(-4,0)$, de módulo $4A e^{-4}$.
          Si la máxima variación vale $16 e^{-4}$, ¿cuánto vale $A$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '16'
            mensaje: |
              16 es el dato del enunciado, no el valor de $A$. Hay que dividirlo
              entre el 4 que sale del gradiente.
          - valor: '64'
            mensaje: |
              Has multiplicado en vez de dividir. La ecuación es
              $4A e^{-4} = 16 e^{-4}$, así que $A = 16/4$.
        pista: |
          Las exponenciales se cancelan y queda $4A = 16$.
        desarrollo: |
          En $Q(1,0)$ el exponente vale $-(1+1)^{2}-0 = -4$, así que

          $$
          \lVert\nabla f(1,0)\rVert = 4A\,e^{-4} = 16\,e^{-4}
          \qquad\Longrightarrow\qquad
          A = 4
          $$

          **Las exponenciales se cancelan a propósito**: el enunciado da el dato
          con el mismo $e^{-4}$ para que la cuenta salga sin calculadora.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'a) La derivada direccional en $P$ sale **cero**, luego $v$ es tangente a la curva de nivel por $P$.'
          - texto: 'b) De $4Ae^{-4} = 16e^{-4}$ sale $A = 4$.'
          - texto: 'c) Las curvas de nivel son circunferencias de centro $(-1,0)$: por $P$ la de radio $\sqrt2$, por $Q$ la de radio 2.'
          - texto: 'd) La contaminación es máxima donde el exponente se anula, o sea en $(-1,0)$, y allí vale $A=4$ Tn/m².'
          - texto: 'a) Como la variación es cero, el punto $P$ es un máximo de la contaminación.'
            trampa: true
            mensaje: |
              Que una **derivada direccional** se anule no hace máximo a un
              punto: solo dice que en **esa** dirección no cambia. Para ser
              máximo tendría que anularse el gradiente entero, y en $P$ vale
              $Ae^{-2}(-2,-2)\neq(0,0)$.
      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 340 265" role="img" width="340" height="265"
               aria-labelledby="f-ex2122-vertido-t f-ex2122-vertido-d">
