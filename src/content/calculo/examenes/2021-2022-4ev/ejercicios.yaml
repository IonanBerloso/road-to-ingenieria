        consigna: |
          Dibuja el sólido $S$ en perspectiva, con el eje $OX$ marcado, y aparte
          la elipse de la tapa.
        comprueba:
          - punto: |
              Un paraboloide **tumbado**, abriendo en la dirección del eje $OX$
              positivo desde el origen.
            porque: |
              La variable que aparece sola, $x$, es la del eje. Dibujarlo
              abriendo hacia arriba lo confunde con el caso habitual.
          - punto: |
              Secciones perpendiculares al eje que son **elipses**, no
              circunferencias.
            porque: |
              Los denominadores $9$ y $3$ son distintos: la proporción entre
              semiejes es $\sqrt3$. Es un paraboloide elíptico.
          - punto: |
              La tapa plana en $x=3$: la elipse
              $\tfrac{y^{2}}{27}+\tfrac{z^{2}}{9}=1$, de semiejes
              $3\sqrt3\approx5{,}20$ y $3$.
            porque: |
              Sustituyendo $x=3$. Es la única cara plana del sólido y la que
              cierra el volumen.
          - punto: |
              Que la sección en cada $x$ tiene área
              $\pi\cdot3\sqrt{x}\cdot\sqrt{3x}=3\pi\sqrt3\,x$.
            porque: |
              Los semiejes de la sección son $3\sqrt x$ y $\sqrt{3x}$. Con el
              área de la sección, el volumen sale de una integral simple en $x$,
              sin triples.
        veredicto: |
          Cuando una variable aparece en grado uno y las otras dos al cuadrado,
          el sólido es un paraboloide con el eje en esa variable. Y si además se
          conoce el área de la sección, el volumen es una integral de una sola
          variable.

    resolucion: |
      **a) El sólido.** La condición
      $\frac{y^{2}}{9}+\frac{z^{2}}{3}\le x$ describe un **paraboloide
      elíptico** con eje el eje $X$: al cortar por $x$ constante sale la elipse

      $$
      \frac{y^{2}}{9x}+\frac{z^{2}}{3x}\le 1,
      \qquad
      \text{de semiejes } 3\sqrt x \text{ y } \sqrt{3x}
      $$

      Nace en un punto en el origen y se abre hacia la derecha, cerrado por la
      tapa $x=3$.

      **b) El volumen, por secciones**, que es el camino corto:

      $$
      A(x) = \pi\cdot 3\sqrt{x}\cdot\sqrt{3x} = 3\sqrt3\,\pi\,x
      $$

      $$
      V = \int_{0}^{3} 3\sqrt3\,\pi\,x\;dx = 3\sqrt3\,\pi\cdot\frac{9}{2}
      = \boxed{\frac{27\sqrt3\,\pi}{2} \approx 73{,}46}
      $$

      > **Por qué integrar por secciones y no en cilíndricas generalizadas.**
      > Las dos valen y dan lo mismo. Pero aquí el área de la sección se conoce
      > de memoria —es la de una elipse— y depende solo de $x$, así que la
      > integral triple se colapsa en una simple. **Antes de montar un cambio de
      > coordenadas conviene mirar si el sólido se deja rebanar.**
      >
