ejercicios:
  - id: ex2425-1-parabola-y-circunferencia
    titulo: Bajo una parábola y fuera de una circunferencia
    fuente: >-
      Ejercicio 1 · Primera evaluación, 14 de octubre de 2024 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    enunciado: |
      Calcular y representar geométricamente los afijos de los números
      complejos $z$ que verifican las condiciones siguientes:

      $$
      \begin{cases}
      \left|z\right| < 1 - \operatorname{Im}(z) \\[4pt]
      z\cdot\overline{z} \ge -i\left(\overline{z}-z\right)
      \end{cases}
      $$
    pide: Calcular la región y representarla.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que exigir **antes** de elevar al cuadrado la primera
          condición?
        opciones:
          - texto: >-
              Que el miembro derecho sea positivo, es decir $1-\operatorname{Im}(z)>0$
            correcta: true
            mensaje: |
              Eso es. Elevar al cuadrado solo conserva una desigualdad cuando
              los dos miembros son no negativos. El izquierdo es un módulo y lo
              es siempre; el derecho, $1-y$, puede ser negativo, y ahí la
              condición sería imposible en vez de equivalente.
          - texto: 'Nada: elevar al cuadrado siempre es equivalente'
            mensaje: |
              No lo es. Con $-3 < -1$ y elevando al cuadrado saldría $9 < 1$,
              que es falso. La equivalencia necesita los dos miembros no
              negativos.
          - texto: Que $z \neq 0$
            mensaje: |
              No hace falta: aquí no se divide por nada ni aparece ningún
              logaritmo. $z=0$ es un punto perfectamente admisible, y de hecho
              cumple las dos condiciones.
          - texto: >-
              Que $\operatorname{Im}(z)$ sea positiva
            mensaje: |
              Al revés: lo que hace falta es que $1-y$ sea positivo, o sea
              $y<1$. La parte imaginaria puede ser negativa sin ningún problema.

      - tipo: verificar
        pregunta: |
          Escribe la región simplificada, en $x$ e $y$. Se comparan los puntos,
          así que vale cualquier forma equivalente.
        condicion: '|z| < 1 - im(z) & z*conj(z) >= -i*(conj(z) - z)'
        ventana:
          x: [-2.5, 2.5]
          y: [-3, 1.5]
        formato: por ejemplo y < (1-x^2)/2 & x^2 + (y+1)^2 >= 1
        pista: |
          En la primera, eleva al cuadrado y despeja $y$. En la segunda, mira
          qué son de verdad los dos miembros: $z\overline z$ y
          $-i(\overline z - z)$.
        desarrollo: |
          **Primera condición.** Con $z = x+iy$, y una vez garantizado $1-y>0$:

          $$
          x^{2}+y^{2} < (1-y)^{2} = 1-2y+y^{2}
          $$

          $$
          x^{2} < 1-2y \;\Longleftrightarrow\; y < \frac{1-x^{2}}{2}
          $$

          El interior de una **parábola hacia abajo**, de vértice
          $\left(0,\frac12\right)$.

          **Segunda condición.** Los dos miembros son reales, aunque no lo
          parezcan:

          $$
          z\cdot\overline z = \left|z\right|^{2} = x^{2}+y^{2}
          $$

          $$
          \overline z - z = -2iy
          \;\Longrightarrow\;
          -i\left(\overline z - z\right) = -i\cdot(-2iy) = 2i^{2}y = -2y
          $$

          $$
          x^{2}+y^{2} \ge -2y
          \;\Longleftrightarrow\;
          x^{2}+(y+1)^{2} \ge 1
          $$

          El **exterior**, con borde, de la circunferencia de centro $(0,-1)$ y
          radio 1.
        veredicto: |
          Fíjate en que la restricción $y<1$ se cumple sola: la parábola no pasa
          de $y=\frac12$. Hay que comprobarlo, pero no añade nada.

      - tipo: justificar
        pregunta: |
          Ordena la descripción de la región. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              La primera condición exige $1-y>0$ para poder elevar al cuadrado,
              y una vez elevada da $y < \frac{1-x^{2}}{2}$.
          - texto: |
              Esa desigualdad ya implica $y \le \frac12 < 1$, así que la
              restricción previa se cumple sola y no recorta nada.
          - texto: |
              La segunda condición **es real por los dos lados**:
              $z\overline z = |z|^{2}$ y $-i(\overline z - z) = -2y$. Por eso
              se pueden comparar sin más.
          - texto: |
              Da $x^{2}+(y+1)^{2} \ge 1$: fuera del disco de centro $(0,-1)$ y
              radio 1, borde incluido.
          - texto: |
              La región es el interior de la parábola menos ese disco. El disco
              cabe entero bajo la parábola, porque su punto más alto es
              $(0,0)$ y ahí la parábola vale $\frac12$.
          - texto: |
              La segunda condición compara dos complejos, así que hay que
              tomar módulos en los dos miembros.
            trampa: true
            mensaje: |
              No hace falta, y tomarlos cambiaría el problema. $z\overline z$ es
              real por definición, y $-i(\overline z - z)$ también resulta
              serlo: vale $-2y$. Al tomar módulos se perdería el signo de $y$ y
              la región saldría simétrica respecto del eje real, que no lo es.
        veredicto: |
          Este ejercicio y el 1 del examen 2025-2026 se parecen y son
          contrarios: allí los dos miembros eran imaginarios puros, aquí son
          reales. En los dos hay que decir por qué se pueden comparar.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** Se pide la región de los $z$ con
      $\left|z\right| < 1-\operatorname{Im}(z)$ y
      $z\overline z \ge -i(\overline z - z)$.

      **Reparto de puntos del examen:** COMP1 1 · COMP2 7 · COMP4 2.

      ### 1 · La herramienta, y la trampa de cada condición

      Las dos se traducen a coordenadas con $z = x+iy$, pero cada una esconde
      una cosa distinta que hay que decir en voz alta:

      - En la primera hay que **elevar al cuadrado**, y eso solo es una
        equivalencia si los dos miembros son no negativos. El izquierdo es un
        módulo; el derecho hay que exigirlo.
      - La segunda **parece** comparar dos complejos, y en $\mathbb{C}$ no hay
        orden. Resulta que los dos miembros son reales, y por eso tiene
        sentido — pero hay que demostrarlo, no darlo por hecho.

      Esos dos puntos son los dos de COMP4.

      ### 2 · Primera condición: una parábola

      La condición $\left|z\right| < 1-y$ obliga a que el miembro derecho sea
      positivo, porque el izquierdo nunca es negativo:

      $$
      1-y > 0 \;\Longleftrightarrow\; y < 1
      $$

      Con eso ya se puede elevar al cuadrado:

      $$
      x^{2}+y^{2} < (1-y)^{2} = 1-2y+y^{2}
      $$

      $$
      x^{2} < 1-2y
      \;\Longleftrightarrow\;
      2y < 1-x^{2}
      \;\Longleftrightarrow\;
      y < \frac{1-x^{2}}{2}
      $$

      Es el interior de la **parábola** $y = \frac{1-x^{2}}{2}$, que abre hacia
      abajo, tiene el vértice en $\left(0,\frac12\right)$ y corta el eje real
      en $x=\pm1$.

      Y ahora la comprobación que cierra el apartado: esta desigualdad implica
      $y \le \frac12$, y $\frac12 < 1$. **La restricción previa se cumple
      sola.** No es que no hiciera falta comprobarla; es que al comprobarla
      resulta redundante, y eso hay que escribirlo.

      ### 3 · Segunda condición: los dos miembros son reales

      El primero, por definición de módulo:

      $$
      z\cdot\overline z = \left|z\right|^{2} = x^{2}+y^{2}
      $$

      El segundo, con la cuenta hecha despacio porque es donde se pierde el
      signo:

      $$
      \overline z - z = (x-iy)-(x+iy) = -2iy
      $$

      $$
      -i\left(\overline z - z\right) = -i\cdot(-2iy) = 2i^{2}y = -2y
      $$

      Los dos son reales, así que la desigualdad tiene sentido tal cual:

      $$
      x^{2}+y^{2} \ge -2y
      \;\Longleftrightarrow\;
      x^{2}+y^{2}+2y \ge 0
      \;\Longleftrightarrow\;
      x^{2}+(y+1)^{2} \ge 1
      $$

      El **exterior con borde** de la circunferencia de centro $(0,-1)$ y radio
      1, que pasa por el origen y es tangente al eje real.

      ### 4 · La intersección

      ¿Dónde está la circunferencia respecto de la parábola? Su punto más alto
      es $(0,0)$, y ahí la parábola vale $\frac12$. El disco entero queda
      **por debajo** de la parábola.

      Así que la región es el interior de la parábola **menos** el disco
      abierto: una zona ilimitada hacia abajo, cerrada por arriba por el arco
      de parábola, con un agujero circular apoyado en el origen.

      El borde de la parábola **no** entra —la desigualdad es estricta— y el de
      la circunferencia **sí**.

      ### 5 · Representación gráfica

      La parábola de vértice $\left(0,\frac12\right)$ cortando el eje real en
      $-1$ y $1$; todo lo que queda por debajo, sombreado; y un disco de radio
      1 centrado en $(0,-1)$ recortado de ese sombreado, tangente al eje real
      por dentro.

      ### 6 · Comprobación

      Tres puntos elegidos para romper cosas distintas:

      - **$z = 0$.** Primera: $0 < 1-0$ ✔. Segunda: $0 \ge 0$ ✔, justo en el
        borde de la circunferencia. **Entra**, y es el punto que más se falla:
        está en el borde del disco, y el borde cuenta.
      - **$z = -i$**, el centro del disco. Primera: $1 < 1-(-1) = 2$ ✔.
        Segunda: $0+(-1+1)^{2} = 0 \ge 1$ ✗. **Fuera**, como debe.
      - **$z = i$.** Primera: $\left|i\right| = 1$ y $1-1 = 0$, luego $1 < 0$ ✗.
        **Fuera**. Sirve para ver que la parábola corta de verdad por arriba.

      ### Resultado

      $$
      \boxed{\;y < \frac{1-x^{2}}{2} \quad\text{y}\quad x^{2}+(y+1)^{2} \ge 1\;}
      $$

  - id: ex2425-2-cubica-desplazada
    titulo: Una cúbica con el centro movido
    fuente: >-
      Ejercicio 2 · Primera evaluación, 14 de octubre de 2024 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    enunciado: |
      Sea $z \in \mathbb{C}$. Resolver y representar gráficamente las
      soluciones de la ecuación

      $$
      \left(z-2-i\right)^{3} = -8
      $$
    pide: Resolver y representar las soluciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la entrada natural a esta ecuación?
        opciones:
          - texto: >-
              El cambio $w = z-2-i$, que la convierte en $w^{3} = -8$
            correcta: true
            mensaje: |
              Eso es. La ecuación ya viene con la forma $(\ )^{3} = w$; solo hay
              que nombrar el paréntesis. Se resuelven las tres raíces cúbicas y
              al final se deshace el cambio sumando $2+i$.
          - texto: Desarrollar el cubo del binomio y resolver el polinomio
            mensaje: |
              Se puede, pero sale un polinomio de tercer grado con coeficientes
              complejos y ninguna raíz evidente. El cambio de variable evita
              todo ese trabajo, y en un examen el tiempo cuenta.
          - texto: Tomar módulos en los dos miembros
            mensaje: |
              Aquí no hace falta: el segundo miembro es una constante conocida,
              así que la ecuación ya es del tipo $w^{n} = c$. Tomar módulos es
              la entrada cuando la incógnita aparece en los dos lados.
          - texto: Tomar logaritmos
            mensaje: |
              El logaritmo complejo es multivaluado y complicaría el problema
              sin necesidad. Para una potencia entera, la fórmula de las raíces
              $n$-ésimas es directa.

      - tipo: calcular
        titulo: El módulo de las tres soluciones
        pregunta: |
          ¿Cuánto vale $\left|z-2-i\right|$ para cualquiera de las tres
          soluciones?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '8'
            mensaje: |
              8 es $\left|w^{3}\right|$. Falta la raíz cúbica:
              $\sqrt[3]{8} = 2$.
          - valor: '-2'
            mensaje: |
              Un módulo nunca es negativo: es una distancia. El $-8$ del
              enunciado aporta su signo al **argumento**, no al módulo.
          - valor: '-8'
            mensaje: |
              Ese es el segundo miembro entero. El módulo es
              $\left|-8\right| = 8$, y su raíz cúbica, 2.
        pista: |
          $\left|w^{3}\right| = \left|w\right|^{3}$, y $\left|-8\right| = 8$.
        desarrollo: |
          Con $w = z-2-i$, la ecuación es $w^{3} = -8$. Tomando módulos:

          $$
          \left|w\right|^{3} = 8 \;\Longrightarrow\; \left|w\right| = 2
          $$

          Es decir, las tres soluciones están a distancia 2 del punto $2+i$.
        veredicto: |
          Ese módulo constante ya dice la forma del dibujo: las tres soluciones
          están en una circunferencia de radio 2 centrada en $2+i$, no en el
          origen.

      - tipo: calcular
        titulo: La solución más sencilla
        pregunta: |
          Una de las tres soluciones es un imaginario puro. ¿Cuál es su parte
          imaginaria?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              $-2$ es el valor de $w$ en esa solución, no el de $z$. Falta
              deshacer el cambio: $z = w+2+i = -2+2+i = i$.
          - valor: '3'
            mensaje: |
              Parece que has sumado el 2 a la parte imaginaria. El cambio suma
              $2+i$: el 2 va a la parte real y el 1 a la imaginaria.
          - valor: '0'
            mensaje: |
              Si la parte imaginaria fuera 0 la solución sería real, y ninguna
              lo es. La que buscas es $z = i$.
        pista: |
          $w^{3} = -8$ tiene una raíz real, $w=-2$. Deshaz el cambio.
        desarrollo: |
          Entre las tres raíces cúbicas de $-8$ está la real, $w = -2$, porque
          $(-2)^{3} = -8$. Deshaciendo el cambio:

          $$
          z = w+2+i = -2+2+i = i
          $$

          Su parte imaginaria es **1**.
        veredicto: |
          Es la solución que conviene usar para comprobar el resultado, porque
          la cuenta se hace de cabeza.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Con $w = z-2-i$ la ecuación es $w^{3} = -8 = 8\,e^{i\,180^{\circ}}$.
          - texto: |
              Sus tres raíces tienen módulo $\sqrt[3]{8} = 2$ y argumentos
              $\frac{180^{\circ}+360^{\circ}k}{3} = 60^{\circ},\ 180^{\circ},\ 300^{\circ}$.
          - texto: |
              En binómica: $w = 1+\sqrt3\,i$, $\;w = -2$, $\;w = 1-\sqrt3\,i$.
          - texto: |
              Deshaciendo el cambio, $z = w+2+i$, salen
              $z = 3+(1+\sqrt3)i$, $\;z = i$, $\;z = 3+(1-\sqrt3)i$.
          - texto: |
              Los tres afijos forman un triángulo equilátero de radio 2
              centrado en $2+i$, no en el origen.
          - texto: |
              Como $-8$ es real y negativo, la ecuación solo tiene la solución
              real $w=-2$.
            trampa: true
            mensaje: |
              En $\mathbb{R}$ sí sería la única, pero estamos en $\mathbb{C}$:
              una ecuación de grado 3 tiene **tres** soluciones. Quedarse solo
              con la real es el error clásico de este tipo de ejercicio, y
              cuesta dos tercios de la nota del cálculo.
        veredicto: |
          Lo que el cambio de variable **no** cambia es el número de
          soluciones: tres antes y tres después. Lo único que hace es mover el
          centro del triángulo del origen a $2+i$.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** Resolver $\left(z-2-i\right)^{3} = -8$ en $\mathbb{C}$ y
      representar las soluciones.

      **Reparto de puntos del examen:** COMP1 1 · COMP2 7 · COMP4 2.

      ### 1 · Herramienta y por qué se puede aplicar

      La ecuación ya tiene la forma «algo al cubo igual a una constante», así
      que basta **nombrar ese algo**:

      $$
      w = z-2-i \;\Longrightarrow\; w^{3} = -8
      $$

      Y sobre $w^{3} = c$ se aplica la fórmula de las raíces $n$-ésimas, válida
      para todo $c \neq 0$:

      $$
      w_k = \sqrt[n]{|c|}\;e^{i\frac{\arg c + 360^{\circ}k}{n}},
      \qquad k = 0,\dots,n-1
      $$

      Aquí $c = -8 \neq 0$ y $n=3$. El cambio de variable es una **biyección**
      —a cada $w$ le corresponde un solo $z$ y al revés—, así que no se pierde
      ni se gana ninguna solución por hacerlo.

      ### 2 · Las tres raíces de $-8$

      En polar, $-8 = 8\,e^{i\,180^{\circ}}$: módulo 8 y argumento $180^{\circ}$
      por estar en el semieje real negativo.

      $$
      \left|w\right| = \sqrt[3]{8} = 2
      $$

      $$
      \theta_k = \frac{180^{\circ}+360^{\circ}k}{3} = 60^{\circ}+120^{\circ}k
      \;\Longrightarrow\;
      60^{\circ},\ 180^{\circ},\ 300^{\circ}
      $$

      En forma binómica, con $\cos 60^{\circ} = \frac12$ y
      $\mathrm{sen}\,60^{\circ} = \frac{\sqrt3}{2}$:

      $$
      w_0 = 2\left(\tfrac12+\tfrac{\sqrt3}{2}i\right) = 1+\sqrt3\,i,
      \qquad
      w_1 = -2,
      \qquad
      w_2 = 1-\sqrt3\,i
      $$

      ### 3 · Deshacer el cambio

      $z = w+2+i$, así que a cada raíz se le suma $2+i$:

      $$
      z_0 = 3+\left(1+\sqrt3\right)i \approx 3+2{,}73\,i
      $$

      $$
      z_1 = i
      $$

      $$
      z_2 = 3+\left(1-\sqrt3\right)i \approx 3-0{,}73\,i
      $$

      ### 4 · Representación gráfica

      Los tres afijos son los vértices de un **triángulo equilátero** inscrito
      en la circunferencia de radio 2 **centrada en $2+i$**, no en el origen.
      El primer vértice está a $60^{\circ}$ medidos desde ese centro.

      Ese desplazamiento del centro es lo que aporta el ejercicio: sin el
      cambio de variable, el dibujo parece descolocado.

      ### 5 · Comprobación

      Con la solución fácil, $z_1 = i$:

      $$
      \left(i-2-i\right)^{3} = (-2)^{3} = -8 \quad\checkmark
      $$

      Y con $z_0$, comprobando módulo y argumento por separado:
      $\left|z_0-2-i\right| = \left|1+\sqrt3 i\right| = \sqrt{1+3} = 2$ ✔, y su
      argumento es $60^{\circ}$, que al triplicarse da $180^{\circ}$ ✔, la
      dirección del $-8$.

      Una última coherencia que sale gratis: **los tres argumentos se
      diferencian en $120^{\circ}$** y los tres módulos coinciden. Si no fuera
      así, habría un error de cuenta en alguna raíz.

      ### Resultado

      $$
      \boxed{\;z \in \left\{\,3+\left(1+\sqrt3\right)i,\;\; i,\;\;
      3+\left(1-\sqrt3\right)i \,\right\}\;}
      $$

  - id: ex2425-3-limite-no-positivo
    titulo: El límite de una sucesión de términos no positivos
    fuente: >-
      Ejercicio 3 · Primera evaluación, 14 de octubre de 2024 · Cálculo,
      UPV/EHU · El examen no publica solución: la demostración es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 0
      comp4: 10

    enunciado: |
      Sea $\{a_n\}_{n\in\mathbb{N}}$ una sucesión tal que $a_n \le 0$ para todo
      $n \in \mathbb{N}$. Demostrar que si $\{a_n\}_{n\in\mathbb{N}}$ converge
      hacia $L$ entonces $L \le 0$.
    pide: Demostrar la propiedad.

    pasos:
      - tipo: reconocer
        pregunta: |
          Este ejercicio vale **10 puntos de COMP4 y ninguno de cálculo**. ¿Qué
          significa eso para lo que hay que escribir?
        opciones:
          - texto: >-
              Que la nota está entera en la demostración formal, no en ningún
              número
            correcta: true
            mensaje: |
              Exacto. No hay nada que calcular: hay que escribir una
              demostración con sus hipótesis, su estrategia y su contradicción.
              Un examen que reparte así los puntos está diciendo qué espera.
          - texto: Que basta con dar un ejemplo que lo cumpla
            mensaje: |
              Un ejemplo no demuestra una propiedad universal. Serviría para
              refutarla si fuera falsa, pero es cierta, así que hay que
              probarla para **todas** las sucesiones.
          - texto: Que se puede responder en una línea
            mensaje: |
              Diez puntos no se dan por una línea. Se espera la definición de
              límite escrita, la elección de $\varepsilon$ justificada y la
              contradicción explícita.
          - texto: Que hay que calcular el límite
            mensaje: |
              No hay ninguna sucesión concreta cuyo límite calcular. El
              enunciado habla de cualquier sucesión con esa propiedad.

      - tipo: calcular
        titulo: El épsilon de la reducción al absurdo
        pregunta: |
          Se supone $L > 0$ para llegar al absurdo. Con $L = 0{,}8$, ¿qué
          $\varepsilon$ conviene tomar?
        respuesta:
          tipo: numero
          valor: '0.4'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.8'
            mensaje: |
              Con $\varepsilon = L$ el intervalo llega justo hasta 0 y la
              desigualdad $a_n > 0$ deja de ser estricta: podría ser $a_n = 0$,
              que el enunciado permite. Con la mitad el choque es limpio.
          - valor: '-0.4'
            mensaje: |
              $\varepsilon$ tiene que ser **positivo**: la definición dice «para
              todo $\varepsilon > 0$». Un épsilon negativo no describe ningún
              entorno.
          - valor: '1.6'
            mensaje: |
              Has multiplicado por 2 en vez de dividir. Un $\varepsilon$ mayor
              que $L$ deja el 0 dentro del entorno y no contradice nada.
        pista: |
          La distancia de $L$ a 0 es $0{,}8$. Toma la mitad.
        desarrollo: |
          $$
          \varepsilon = \frac{L}{2} = \frac{0{,}8}{2} = 0{,}4
          $$

          Con ese valor, a partir de cierto $m$:

          $$
          a_n > L-\varepsilon = 0{,}8-0{,}4 = 0{,}4 > 0
          $$

          y eso contradice $a_n \le 0$ para todo $n$.
        veredicto: |
          Es el mismo épsilon de los ejercicios 2.3 a 2.6 del boletín: la mitad
          de la distancia entre los dos valores en conflicto.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Por reducción al absurdo, supongamos que $L > 0$.
          - texto: |
              Se toma $\varepsilon = \dfrac{L}{2} > 0$, positivo precisamente
              porque se ha supuesto $L$ positivo.
          - texto: |
              Por definición de límite existe $m$ tal que
              $\left|a_n-L\right| < \varepsilon$ para todo $n>m$; en particular
              $a_n > L-\varepsilon = \dfrac{L}{2} > 0$.
          - texto: |
              Pero la hipótesis dice que $a_n \le 0$ para todo $n$.
              Contradicción, luego $L \le 0$.
          - texto: |
              Como todos los términos son no positivos, el límite es
              estrictamente negativo.
            trampa: true
            mensaje: |
              El límite puede ser **exactamente cero**: $a_n = -\frac1n$ tiene
              todos sus términos negativos y tiende a 0. Por eso el enunciado
              dice $L \le 0$ y no $L < 0$. Al pasar al límite, las
              desigualdades estrictas se debilitan.
        veredicto: |
          Ese es el matiz que el enunciado ya anticipa al escribir $\le$ en las
          dos puntas: en la hipótesis y en la tesis.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > demostración propuesta, pendiente de revisión.

      **Datos.** $a_n \le 0$ para todo $n$ y $a_n \to L$. Hay que demostrar que
      $L \le 0$.

      **Reparto de puntos del examen:** COMP4 10. **No se evalúa el cálculo ni
      el reconocimiento: los diez puntos son la demostración.** Conviene tenerlo
      presente al repartir el tiempo en el examen.

      ### 1 · Estrategia

      La tesis es una desigualdad **no estricta**, y esas se demuestran casi
      siempre por reducción al absurdo: se supone lo contrario, $L>0$, y se
      busca el choque con la hipótesis.

      Conviene escribir la definición que se va a usar, porque es parte de lo
      que se puntúa:

      $$
      \lim a_n = L \iff
      \forall \varepsilon>0 \;\exists\, m \in \mathbb{N} :\;
      n>m \Rightarrow \left|a_n-L\right| < \varepsilon
      $$

      ### 2 · La demostración

      Supongamos $L > 0$. Entonces se puede tomar

      $$
      \varepsilon = \frac{L}{2} > 0
      $$

      —positivo precisamente porque $L$ lo es, y esto hay que decirlo: si $L$
      fuera negativo este $\varepsilon$ no valdría—.

      Por la definición de límite, existe $m \in \mathbb{N}$ tal que para todo
      $n>m$

      $$
      \left|a_n - L\right| < \varepsilon
      $$

      lo que en particular implica

      $$
      a_n > L-\varepsilon = L-\frac{L}{2} = \frac{L}{2} > 0
      $$

      Es decir: **todos** los términos a partir de $m$ serían estrictamente
      positivos. Pero la hipótesis dice que $a_n \le 0$ para todo $n$.
      Contradicción.

      Por tanto la suposición era falsa y

      $$
      L \le 0 \qquad \blacksquare
      $$

      ### 3 · Por qué $\le$ y no $<$

      La conclusión no se puede reforzar. El contraejemplo es inmediato:

      $$
      a_n = -\frac{1}{n}
      $$

      tiene todos sus términos **estrictamente** negativos y su límite es
      exactamente 0.

      La regla general: al pasar al límite, **las desigualdades estrictas se
      debilitan**. De $a_n < 0$ solo se deduce $L \le 0$.

      ### 4 · La misma propiedad, del otro lado

      Este ejercicio es el reflejo del 2.3 del boletín, que demuestra que si
      $a_n \ge 0$ entonces $L \ge 0$. De hecho se puede deducir uno del otro
      sin repetir el trabajo: aplicando el 2.3 a la sucesión $-a_n$, que es no
      negativa, se obtiene $-L \ge 0$, es decir $L \le 0$.

      Escribir esa observación en el examen no ahorra la demostración —hay que
      tener el otro resultado probado—, pero enseña que se ha entendido la
      simetría.

      ### 5 · Comprobación

      No sustituye a la demostración, pero detecta signos cambiados. Se
      construye una sucesión que tienda a un límite positivo y se cuenta
      cuántos términos consigue mantener no positivos:

      $$
      a_n = 0{,}8-\frac{1}{n} \;\longrightarrow\; 0{,}8
      $$

      $$
      a_1 = -0{,}2 \le 0, \qquad a_2 = 0{,}3 > 0, \qquad a_3 = 0{,}47 > 0,\dots
      $$

      Solo uno. Y con el $\varepsilon = 0{,}4$ de la demostración, desde
      $n \ge 3$ todos superan $0{,}4$. Los términos no positivos son siempre
      **finitos**, que es justo lo que la hipótesis prohíbe.

      ### Resultado

      $$
      \boxed{\;a_n \le 0 \;\;\forall n \;\;\text{y}\;\; a_n \to L
      \;\;\Longrightarrow\;\; L \le 0\;}
      $$

