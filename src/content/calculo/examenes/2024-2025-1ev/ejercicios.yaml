    pide: Determinar dónde converge y calcular su suma.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué serie conocida es $\sum_{k\ge1} k\,r^{k}$, con $r = g(x)$?
        opciones:
          - texto: >-
              Una **aritmético-geométrica**, que converge exactamente cuando
              $|r|<1$
            correcta: true
            mensaje: |
              Eso es. Es la geométrica multiplicada término a término por $k$.
              Ese factor no cambia el criterio de convergencia —sigue mandando
              $|r|<1$— pero sí cambia la suma, que pasa de
              $\frac{r}{1-r}$ a $\frac{r}{(1-r)^{2}}$.
          - texto: Una geométrica de razón $k\,r$
            mensaje: |
              No: en una geométrica la razón es constante, y aquí el cociente
              entre términos consecutivos es
              $\frac{(k+1)r^{k+1}}{k r^{k}} = \frac{k+1}{k}r$, que depende de
              $k$. Tiende a $r$, y por eso el criterio acaba siendo el mismo.
          - texto: Una armónica generalizada
            mensaje: |
              Las armónicas generalizadas son $\sum \frac{1}{k^{p}}$, sin
              ninguna potencia $k$-ésima. Aquí lo que manda es $r^{k}$, que
              crece o decrece geométricamente.
          - texto: Una telescópica
            mensaje: |
              En una telescópica cada término cancela parte del siguiente, y
              aquí no hay nada que se cancele. La forma $k\,r^{k}$ es
              aritmético-geométrica.

      - tipo: calcular
        titulo: El extremo del primer tramo
        pregunta: |
          Leyendo la gráfica, ¿en qué valor de $x$ **acaba** el primer tramo en
          el que la serie converge?
        respuesta:
          tipo: numero
          valor: '-0.2'
          tolerancia: 0.011
          formato: un número
        distractores:
          - valor: '-0.25'
            mensaje: |
              $-0{,}25$ es donde **empieza** el tramo, no donde acaba: ahí la
              curva vale justo 1 y a partir de ahí baja por dentro de la banda.
          - valor: '-0.05'
            mensaje: |
              $-0{,}05$ es donde **vuelve** a entrar la curva en la banda,
              después de haber estado por debajo de $-1$. Es el principio del
              segundo tramo.
          - valor: '-1'
            mensaje: |
              $-1$ es el valor de $g$ en ese punto, no el de $x$. La pregunta
              es por la abscisa donde la curva corta la recta $y=-1$.
        pista: |
          Es donde la curva baja y cruza la recta $y=-1$. Cae sobre una línea
          de la rejilla, que va de $0{,}05$ en $0{,}05$.
        desarrollo: |
          La serie converge donde $\left|g(x)\right|<1$, es decir donde la
          curva va **estrictamente entre las dos rectas de trazos**.

          Bajando desde $x=-0{,}25$, la curva corta la recta $y=-1$ en

          $$
          x = -0{,}20
          $$

          y a partir de ahí se sale de la banda por abajo. El primer tramo es
          $\left(-0{,}25,\ -0{,}20\right)$.
        veredicto: |
          Los cuatro cortes caen sobre líneas de la rejilla del dibujo, que va
          de $0{,}05$ en $0{,}05$. No es casualidad: el enunciado está pensado
          para leerse ahí.

      - tipo: calcular
        titulo: La suma, en un punto concreto
        pregunta: |
          Si en cierto $x$ la gráfica vale $g(x) = \frac12$, ¿cuánto vale $S$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es la suma de la geométrica $\sum_{k\ge1} r^{k}$ con
              $r=\frac12$. Falta el factor $k$, que cambia el resultado: la
              fórmula es $\frac{r}{(1-r)^{2}}$, no $\frac{r}{1-r}$.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es el primer término de la serie, $1\cdot r$. La suma
              de todos es bastante mayor.
          - valor: '4'
            mensaje: |
              Parece que has puesto $\frac{1}{(1-r)^{2}}$ olvidando la $r$ del
              numerador. Con $r=\frac12$ eso da 4, pero la fórmula lleva $r$
              arriba.
        pista: |
          $\sum_{k\ge1} k\,r^{k} = \dfrac{r}{(1-r)^{2}}$.
        desarrollo: |
          $$
          S = \frac{r}{(1-r)^{2}}
            = \frac{\frac12}{\left(1-\frac12\right)^{2}}
            = \frac{\frac12}{\frac14}
            = 2
          $$

          Comprobación a mano con los primeros términos:
          $\frac12+2\cdot\frac14+3\cdot\frac18+4\cdot\frac{1}{16}+5\cdot\frac{1}{32}
          = 0{,}5+0{,}5+0{,}375+0{,}25+0{,}156 = 1{,}78$, subiendo hacia 2.
        veredicto: |
          El factor $k$ hace que la suma sea mucho mayor que la de la
          geométrica: 2 frente a 1.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento completo. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              $S = \sum_{k\ge1} k\,r^{k}$ con $r = g(x)$ es
              aritmético-geométrica, y converge **si y solo si** $|r|<1$.
          - texto: |
              Por tanto (a) se responde leyendo en la gráfica dónde la curva va
              estrictamente entre $y=-1$ e $y=1$.
          - texto: |
              Esos tramos son
              $x \in (-0{,}25,\,-0{,}20) \cup (-0{,}05,\,0{,}10) \cup (0{,}25,\,0{,}5)$.
          - texto: |
              Para (b), partiendo de $\sum_{k\ge0} r^{k} = \frac{1}{1-r}$ y
              derivando respecto de $r$ se llega a
              $\sum_{k\ge1} k\,r^{k-1} = \frac{1}{(1-r)^{2}}$.
          - texto: |
              Multiplicando por $r$, $\;S = \dfrac{g(x)}{\left(1-g(x)\right)^{2}}$
              en esos tramos.
          - texto: |
              En los extremos de los tramos, donde $g(x) = \pm1$, la serie
              también converge por ser $|r|$ exactamente 1.
            trampa: true
            mensaje: |
              Justo al revés: con $|r|=1$ el término general $k\,r^{k}$ tiene
              módulo $k$, que **no tiende a cero**, así que la serie diverge sin
              remedio. Por eso los tramos son abiertos y los cortes con las
              rectas quedan excluidos. Es la condición necesaria del término
              general, aplicada en un sitio donde es fácil olvidarla.
        veredicto: |
          El truco de derivar la geométrica es el que conviene recordar: casi
          todas las sumas del tipo $\sum k^{p} r^{k}$ salen de ahí.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** Una función $g$ dada por su gráfica y la serie
      $S = \sum_{k\ge1} k\left(g(x)\right)^{k}$. Se pide dónde converge y
      cuánto suma.

      **Reparto de puntos del examen:** COMP1 2 · COMP2 6 · COMP4 2. Los dos
      puntos de COMP1 son los más altos de todo el examen, y se entienden: casi
      todo el ejercicio consiste en **reconocer qué serie es** antes de tocar
      nada.

      ### 1 · Qué serie es

      Llamando $r = g(x)$, la serie es

      $$
      S = \sum_{k=1}^{\infty} k\,r^{k}
      $$

      una **aritmético-geométrica**: la geométrica multiplicada término a
      término por $k$.

      El factor $k$ no cambia cuándo converge. Por el criterio del cociente,

      $$
      \left|\frac{(k+1)r^{k+1}}{k\,r^{k}}\right| = \frac{k+1}{k}\left|r\right|
      \;\xrightarrow[k\to\infty]{}\; \left|r\right|
      $$

      así que converge si $|r|<1$ y diverge si $|r|>1$. Y en el caso frontera
      $|r|=1$ **también diverge**, porque entonces $\left|k\,r^{k}\right| = k$,
      que no tiende a cero: falla la condición necesaria del término general.

      Conclusión limpia: **converge exactamente cuando $\left|g(x)\right|<1$**,
      con desigualdad estricta.

      ### 2 · Apartado (a): leer la gráfica

      Hay que localizar los tramos en los que la curva va **estrictamente entre
      las rectas $y=-1$ e $y=1$**. Los cortes se leen sobre la rejilla del
      dibujo, que va de $0{,}05$ en $0{,}05$:

      | corte | dónde |
      |---|---|
      | la curva entra en la banda por arriba | $x = -0{,}25$ |
      | sale por abajo, cortando $y=-1$ | $x = -0{,}20$ |
      | vuelve a entrar, cortando $y=-1$ | $x = -0{,}05$ |
      | sale por arriba, cortando $y=1$ | $x = 0{,}10$ |
      | vuelve a entrar, cortando $y=1$ | $x = 0{,}25$ |
      | y ya no vuelve a salir | hasta $x = 0{,}5$ |

      $$
      \boxed{\;x \in \left(-0{,}25,\,-0{,}20\right) \cup
      \left(-0{,}05,\,0{,}10\right) \cup \left(0{,}25,\,0{,}5\right)\;}
      $$

      Los intervalos son **abiertos**: en los extremos $\left|g\right|=1$ y la
      serie diverge.

      > **Sobre estos números.** El enunciado da la función con un dibujo, así
      > que los cortes se leen, no se calculan. Para no leerlos a ojo se han
      > medido sobre el PDF original con `scripts/leer-grafica.mjs`, que
      > localiza los ejes por densidad de tinta y sigue la curva por
      > continuidad: salieron $-0{,}198$, $-0{,}055$, $0{,}095$ y $0{,}242$, que
      > caen sobre las líneas de la rejilla $-0{,}20$, $-0{,}05$, $0{,}10$ y
      > $0{,}25$. Esa coincidencia es la que confirma la lectura.

      ### 3 · Apartado (b): la suma

      Se parte de la geométrica, válida para $|r|<1$:

      $$
      \sum_{k=0}^{\infty} r^{k} = \frac{1}{1-r}
      $$

      Dentro del radio de convergencia una serie de potencias se puede
      **derivar término a término**, y esa es la hipótesis que hay que citar:

      $$
      \sum_{k=1}^{\infty} k\,r^{k-1} = \frac{d}{dr}\left(\frac{1}{1-r}\right)
      = \frac{1}{(1-r)^{2}}
      $$

      Multiplicando los dos miembros por $r$:

      $$
      S = \sum_{k=1}^{\infty} k\,r^{k} = \frac{r}{(1-r)^{2}}
      $$

      y deshaciendo el cambio:

      $$
      S = \frac{g(x)}{\left(1-g(x)\right)^{2}}
      $$

      para los $x$ del apartado (a).

      ### 4 · Comprobación

      **De la fórmula**, con $r=\frac12$, sumando a mano los primeros términos:

      $$
      \tfrac12+2\cdot\tfrac14+3\cdot\tfrac18+4\cdot\tfrac{1}{16}+5\cdot\tfrac{1}{32}
      +6\cdot\tfrac{1}{64}
      = 0{,}5+0{,}5+0{,}375+0{,}25+0{,}156+0{,}094 = 1{,}875
      $$

      que sube hacia $\frac{1/2}{(1/2)^{2}} = 2$ ✔.

      **Del signo**, con $r$ negativo: en el tramo $(-0{,}05,\,0{,}10)$ la
      curva pasa por valores negativos, y ahí $S$ tiene que salir negativa. Con
      $r=-\frac12$:

      $$
      S = \frac{-\frac12}{\left(\frac32\right)^{2}} = -\frac{2}{9} \approx -0{,}22
      $$

      y en efecto la serie $-\frac12+2\cdot\frac14-3\cdot\frac18+\dots$ alterna
      y suma un número pequeño y negativo ✔.

      **Del caso frontera**: con $r=1$ la serie es $1+2+3+\dots$, claramente
      divergente; con $r=-1$ es $-1+2-3+4-\dots$, que tampoco converge. Los
      extremos quedan fuera, como dice el apartado (a).

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \text{(a) } & x \in (-0{,}25,\,-0{,}20)\cup(-0{,}05,\,0{,}10)\cup(0{,}25,\,0{,}5) \\[4pt]
      \text{(b) } & S = \frac{g(x)}{\left(1-g(x)\right)^{2}}
      \end{aligned}}
      $$
