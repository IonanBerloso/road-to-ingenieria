      </svg>
      <figcaption>
      Figura redibujada del enunciado original: el examen da la gráfica de la
      derivada tercera para que el error se pueda acotar sin resolver la
      ecuación.
      </figcaption>
      </figure>
    pide: El polinomio de Taylor de orden 2 y una cota del error en x = 1,5.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Para qué da el enunciado la gráfica de $y'''$?
        opciones:
          - texto: >-
              Para acotar el resto de Lagrange, que necesita el máximo de
              $\left|y'''\right|$ en $[1;1{,}5]$
            correcta: true
            mensaje: |
              Eso es. El resto de Taylor de orden 2 es
              $\frac{y'''(\xi)}{3!}(x-1)^{3}$ con $\xi$ desconocido, así que hace
              falta una cota de $\left|y'''\right|$ en todo el intervalo — y la
              gráfica la da sin resolver la ecuación.
          - texto: >-
              Para calcular el polinomio del apartado a)
            mensaje: |
              El polinomio de orden 2 solo necesita $y(1)$, $y'(1)$ e $y''(1)$, y
              los tres salen de la propia ecuación. La tercera derivada no
              interviene.
          - texto: >-
              Para comprobar que la solución existe
            mensaje: |
              La existencia la garantiza el teorema de Picard, y no hace falta
              ninguna gráfica. La de $y'''$ está ahí por el apartado b).

      - tipo: calcular
        titulo: La segunda derivada en el punto
        pregunta: |
          ¿Cuánto vale $y''(1)$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Te falta el $\frac1x$ que sale de derivar $\ln x$. La derivada de
              $\frac yx$ aporta $\frac{y'x-y}{x^{2}}$, que en $x=1$ vale $0$, y
              la del logaritmo aporta $1$.
          - valor: '2'
            mensaje: |
              Has contado dos veces algo. En $x=1$:
              $y''(1)=\frac{y'(1)\cdot 1-y(1)}{1}+1=\frac{1-1}{1}+1=1$.
          - valor: '-1'
            mensaje: |
              Signo en el cociente. La derivada de $\frac{y}{x}$ es
              $\frac{y'x-y}{x^{2}}$, con la resta en ese orden.
        pista: |
          Deriva la ecuación entera, con la regla del cociente en $\frac yx$, y
          evalúa en $x=1$ usando $y(1)=1$ e $y'(1)=1$.
        desarrollo: |
          De la ecuación, $y'(1)=\frac{1}{1}+\ln 1=1$. Derivando:

          $$
          y''=\frac{y'x-y}{x^{2}}+\frac1x
          \;\Longrightarrow\;
          y''(1)=\frac{1-1}{1}+1=1
          $$

          Y por tanto

          $$
          P_{2}(x)=1+(x-1)+\frac12(x-1)^{2}
          $$

      - tipo: calcular
        titulo: La cota del error
        pregunta: |
          Leyendo en la gráfica que $\left|y'''\right|\le 0{,}18$ en
          $[1;1{,}5]$, ¿cuál es la cota del error en $x=1{,}5$?
        respuesta:
          tipo: numero
          valor: '0.00375'
          tolerancia: 0.0001
          formato: en forma exacta o con cinco decimales
        distractores:
          - valor: '0.0225'
            mensaje: |
              Te has dejado el $3!$. El resto de Lagrange de orden 2 es
              $\frac{y'''(\xi)}{3!}(x-1)^{3}$: hay que dividir entre $6$.
          - valor: '0.09'
            mensaje: |
              Has usado $(x-1)$ en vez de $(x-1)^{3}$. El exponente es el orden
              más uno.
          - valor: '0.0016985'
            mensaje: |
              Ese es el error **real**, que solo se puede calcular resolviendo la
              ecuación. Lo que pide el apartado es una **cota**, y la cota sale
              de la gráfica.
        pista: |
          $\left|R_{2}\right|\le\frac{M}{3!}\left|x-1\right|^{3}$ con
          $M=\max\left|y'''\right|$.
        desarrollo: |
          $$
          \left|R_{2}(1{,}5)\right|
          \le\frac{M}{3!}\left(0{,}5\right)^{3}
          =\frac{0{,}18\cdot 0{,}125}{6}
          =0{,}00375
          $$

          En la gráfica, $y'''$ es negativa a partir de $x=1$ y su mínimo cae en
          $x=\sqrt{e}\approx 1{,}65$, **fuera** del intervalo; dentro de
          $[1;1{,}5]$ el máximo del valor absoluto se alcanza en el extremo
          derecho y vale unos $0{,}18$.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              **a)** El enunciado da $y(1)=1$, y la ecuación evaluada en $x=1$ da
              $y'(1)=\frac11+\ln 1=1$.
          - texto: >-
              Derivando la ecuación,
              $y''=\frac{y'x-y}{x^{2}}+\frac1x$, y en $x=1$ vale
              $0+1=1$.
          - texto: >-
              Por tanto $P_{2}(x)=1+(x-1)+\frac{1}{2}(x-1)^{2}$, y
              $P_{2}(1{,}5)=1{,}625$.
          - texto: >-
              **b)** El resto de Lagrange es
              $R_{2}(x)=\frac{y'''(\xi)}{3!}(x-1)^{3}$ para algún
              $\xi\in(1;1{,}5)$, y no se sabe cuál: hace falta acotar
              $\left|y'''\right|$ en todo el intervalo.
          - texto: >-
              La gráfica del enunciado da esa cota: en $[1;1{,}5]$ el valor
              absoluto no pasa de $0{,}18$.
          - texto: >-
              Así que $\left|R_{2}(1{,}5)\right|\le
              \frac{0{,}18\cdot 0{,}125}{6}=0{,}00375$.
          - texto: >-
              Como no se conoce $y(x)$, tampoco se puede saber $y'''$, y por eso
              el error no se puede acotar.
            trampa: true
            mensaje: |
              Justo al revés: **para eso** está la gráfica. Y de hecho la
              ecuación se puede resolver —es lineal, y sale
              $y=x\left(1+\frac{(\ln x)^{2}}{2}\right)$—, con lo que
              $y'''=-\frac{\ln x}{x^{2}}$, que es exactamente la curva dibujada.
              Pero el ejercicio está pensado para acotar sin resolver.

    resolucion: |
      **a) El polinomio.** No hace falta resolver la ecuación: los tres valores
      que necesita el polinomio de orden 2 salen de ella.

      $$
      y(1)=1
      \qquad\text{(dato)}
      $$

      $$
      y'(x)=\frac{y}{x}+\ln x
      \;\Longrightarrow\;
      y'(1)=\frac{1}{1}+\ln 1=1
      $$

      Derivando la ecuación, con la regla del cociente:

      $$
      y''(x)=\frac{y'x-y}{x^{2}}+\frac{1}{x}
      \;\Longrightarrow\;
      y''(1)=\frac{1-1}{1}+1=1
      $$

      $$
      P_{2}(x)=1+(x-1)+\frac{1}{2}(x-1)^{2}
      $$

      **b) La cota del error.** El resto de Lagrange de orden 2 es

      $$
      R_{2}(x)=\frac{y'''(\xi)}{3!}\left(x-1\right)^{3}
      \qquad\text{con }\xi\text{ entre }1\text{ y }x
      $$

      Como no se sabe dónde está $\xi$, hay que acotar $\left|y'''\right|$ en
      todo el intervalo — y eso es exactamente lo que da la gráfica del
      enunciado. En $[1;1{,}5]$ la curva arranca en cero y baja, sin llegar a su
      mínimo, que cae más a la derecha: el mayor valor absoluto se alcanza en el
      extremo derecho y es unos $0{,}18$.

      $$
      \left|R_{2}(1{,}5)\right|
      \le\frac{0{,}18}{6}\left(0{,}5\right)^{3}
      =0{,}00375
      $$

      **La comprobación, resolviendo.** La ecuación es lineal:
      $y'-\frac{y}{x}=\ln x$, con factor integrante $\frac1x$, y

      $$
      \left(\frac{y}{x}\right)'=\frac{\ln x}{x}
      \;\Longrightarrow\;
      \frac{y}{x}=\frac{(\ln x)^{2}}{2}+C
      \;\Longrightarrow\;
      y=x\left(1+\frac{(\ln x)^{2}}{2}\right)
      $$

      con $C=1$ por la condición inicial. De ahí

      $$
      y'''(x)=-\frac{\ln x}{x^{2}}
      $$

      que es exactamente la curva dibujada: se anula en $x=1$, tiene su mínimo
      $-\frac{1}{2e}\approx-0{,}184$ en $x=\sqrt{e}\approx 1{,}65$ y tiende a
      cero por abajo. Con la fórmula exacta,
      $y(1{,}5)=1{,}6233$ y $P_{2}(1{,}5)=1{,}625$: el error real es $0{,}0017$,
      por debajo de la cota, como tenía que ser.

  - id: ex2324-ord-4-el-rectangulo-en-el-triangulo
    titulo: El rectángulo inscrito que se lleva la mitad del triángulo
    fuente: >-
      Ejercicio 4 del PRIMER PARCIAL · Convocatoria ordinaria, 10 de junio de 2024 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Calcular las dimensiones del rectángulo de área máxima que puede
      inscribirse en un triángulo isósceles de base 6 cm y altura 12 cm. Obtener
      el valor de dicha área.
    pide: La base y la altura del rectángulo, y su área.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué relación liga la base y la altura del rectángulo inscrito?
        opciones:
          - texto: >-
              La ecuación del lado del triángulo: con la base sobre la del
              triángulo y el origen en su centro, el vértice superior derecho
              está en la recta $y=12-4x$
            correcta: true
            mensaje: |
              Eso es. El lado va de $(3,0)$ al vértice $(0,12)$, así que su
              pendiente es $-4$. Ese es el único dato geométrico que hace falta.
          - texto: >-
              El teorema de Pitágoras aplicado a la mitad del triángulo
            mensaje: |
              Pitágoras daría la longitud del lado oblicuo, que aquí no hace
              falta. Lo que liga las dos dimensiones es que el vértice del
              rectángulo **esté sobre** ese lado.
          - texto: >-
              Que el perímetro del rectángulo sea igual al del triángulo
            mensaje: |
              El enunciado no dice nada de perímetros. La restricción es
              geométrica: el rectángulo tiene que caber dentro.

      - tipo: calcular
        titulo: La base del rectángulo
        pregunta: |
          ¿Cuánto mide la base del rectángulo de área máxima, en centímetros?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número en centímetros
        distractores:
          - valor: '1.5'
            mensaje: |
              Ese es el semiancho $x$, la mitad de la base. La base entera es
              $2x=3$.
          - valor: '6'
            mensaje: |
              Esa es la base del **triángulo**. El rectángulo de área máxima
              tiene exactamente la mitad.
          - valor: '4'
            mensaje: |
              Deriva: $A(x)=2x(12-4x)=24x-8x^{2}$, y $A'=24-16x=0$ da
              $x=\frac32$, o sea base $3$.
        pista: |
          Llama $x$ al semiancho y escribe el área en función de $x$.
        desarrollo: |
          Con el origen en el centro de la base, el lado derecho es la recta que
          une $(3,0)$ con $(0,12)$:

          $$
          y=12-4x
          $$

          El rectángulo de semiancho $x$ tiene base $2x$ y altura $12-4x$:

          $$
          A(x)=2x\left(12-4x\right)=24x-8x^{2}
          $$

          $$
          A'(x)=24-16x=0
          \;\Longrightarrow\;
          x=\frac32
          \;\Longrightarrow\;
          \text{base}=3\ \text{cm}
          $$

          y $A''=-16<0$: es máximo.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuál es el área máxima, en centímetros cuadrados?
        respuesta:
          tipo: numero
          valor: '18'
          tolerancia: 0.001
          formato: un número en centímetros cuadrados
        distractores:
          - valor: '36'
            mensaje: |
              Ese es el área del **triángulo**, $\frac{6\cdot 12}{2}$. El
              rectángulo se lleva justo la mitad.
          - valor: '9'
            mensaje: |
              Has multiplicado la base por el semiancho, o has dividido entre dos
              de más. El rectángulo mide $3$ de base por $6$ de altura.
          - valor: '4.5'
            mensaje: |
              Has usado el semiancho $1{,}5$ como base y algo más. La base es
              $2x=3$ y la altura $12-4\cdot 1{,}5=6$.
        pista: |
          Base $3$, altura $12-4\cdot\frac32$.
        desarrollo: |
          $$
          \text{altura}=12-4\cdot\frac32=6\ \text{cm}
          $$

          $$
          A=3\cdot 6=18\ \text{cm}^{2}
          $$

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con el origen en el centro de la base, los vértices del triángulo
              son $(-3,0)$, $(3,0)$ y $(0,12)$, y el lado derecho es la recta
              $y=12-4x$.
          - texto: >-
              El rectángulo inscrito de semiancho $x$ tiene base $2x$ y altura
              $12-4x$, con $0<x<3$.
          - texto: >-
              $A(x)=24x-8x^{2}$, y $A'(x)=24-16x$ se anula en $x=\frac32$.
          - texto: >-
              $A''=-16<0$, así que es máximo; y en los extremos $x=0$ y $x=3$ el
              área vale cero, lo que confirma que el máximo es interior.
          - texto: >-
              Las dimensiones son $3$ cm de base y $6$ cm de altura, y el área
              vale $18$ cm².
          - texto: >-
              Es exactamente la mitad del área del triángulo, $36$ cm², y eso
              pasa siempre: el rectángulo inscrito de área máxima en un triángulo
              se lleva la mitad.
          - texto: >-
              El rectángulo de área máxima es el que tiene la misma altura que el
              triángulo, porque así aprovecha todo el espacio disponible.
            trampa: true
            mensaje: |
              Con la misma altura que el triángulo, la base tendría que ser cero:
              en la cúspide no cabe nada. El área sería cero, que es el mínimo,
              no el máximo. Aprovechar el espacio es un compromiso entre las dos
              dimensiones, y por eso hay que derivar.

    resolucion: |
      **El planteamiento.** Se coloca el triángulo con la base sobre el eje $x$
      y el origen en su centro: los vértices son $(-3,0)$, $(3,0)$ y $(0,12)$.

      El lado derecho es la recta que une $(3,0)$ con $(0,12)$, de pendiente
      $\frac{12-0}{0-3}=-4$:

      $$
      y=12-4x
      $$

      El rectángulo inscrito con la base sobre la del triángulo y los dos
      vértices superiores sobre los lados oblicuos queda determinado por su
      semiancho $x$: la base mide $2x$ y la altura, $12-4x$.

      **La función objetivo.**

      $$
      A(x)=2x\left(12-4x\right)=24x-8x^{2},
      \qquad 0<x<3
      $$

      **El máximo.**

      $$
      A'(x)=24-16x=0
      \;\Longrightarrow\;
      x=\frac{3}{2}
      $$

      y $A''=-16<0$: es máximo. Además en los dos extremos del intervalo el área
      vale cero —en $x=0$ no hay base y en $x=3$ no hay altura—, así que el
      máximo tiene que estar dentro.

      **El resultado.**

      $$
      \text{base}=3\ \text{cm},
      \qquad
      \text{altura}=6\ \text{cm},
      \qquad
      A=18\ \text{cm}^{2}
      $$

      **Lo que conviene decir.** La base del rectángulo es la mitad de la del
      triángulo, su altura es la mitad de la del triángulo, y su área,
      $18$ cm², es la mitad de los $36$ cm² del triángulo. Y no es casualidad de
      estos números: sale igual con cualquier base $b$ y cualquier altura $h$,
      porque $A(x)=2x\left(h-\frac{2h}{b}x\right)$ tiene su máximo siempre en
      $x=\frac{b}{4}$. Decirlo es la diferencia entre resolver un problema y
      entenderlo.

  - id: ex2324-ord-5-la-tangente-a-una-integral
    titulo: La tangente a una función definida por una integral
    fuente: >-
      Ejercicio 5 del PRIMER PARCIAL · Convocatoria ordinaria, 10 de junio de 2024 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 5
      comp4: 4
    enunciado: |
      Sea $F(x)=\displaystyle\int_{0}^{x}\left(f(t)+t^{2}+t^{3}\right)dt$ donde
      $f(x)$ es una función continua.

      a) Calcular $F'(x)$.

      b) Sabiendo que $f(1)=1$ y $\displaystyle\int_{0}^{1}f(t)\,dt=1$, calcular
      la ecuación de la recta tangente a la función $F(x)$ en el punto $x=1$.
    pide: La derivada de F y la recta tangente en x = 1.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace falta saber de $f$ para escribir la tangente en $x=1$?
        opciones:
          - texto: >-
              Su valor en $1$, para la pendiente, y su integral entre $0$ y $1$,
              para el punto de paso: nada más
            correcta: true
            mensaje: |
              Eso es, y por eso el enunciado da exactamente esos dos datos. La
              función $f$ puede ser cualquiera: la tangente sale igual.
          - texto: >-
              Su expresión completa, porque si no la integral no se puede
              calcular
            mensaje: |
              No hace falta. $F(1)$ se obtiene partiendo la integral en tres
              sumandos: el de $f$ lo da el enunciado y los otros dos son
              inmediatos.
          - texto: >-
              Su derivada en $1$, para la pendiente
            mensaje: |
              La pendiente es $F'(1)$, no $f'(1)$. Y por el teorema fundamental
              $F'(1)=f(1)+1+1$: interviene $f$, no su derivada.

      - tipo: calcular
        titulo: La pendiente
        pregunta: |
          ¿Cuánto vale $F'(1)$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Ese es $f(1)$. Faltan los dos sumandos del integrando:
              $F'(x)=f(x)+x^{2}+x^{3}$, y en $x=1$ valen $1$ cada uno.
          - valor: '2'
            mensaje: |
              Te has dejado uno de los dos términos. El integrando lleva
              $+t^{2}$ **y** $+t^{3}$.
          - valor: '1.5833333'
            mensaje: |
              Ese es $F(1)$, el valor de la función, no su pendiente.
        pista: |
          Teorema fundamental: la derivada es el integrando evaluado en el
          extremo superior.
        desarrollo: |
          $$
          F'(x)=f(x)+x^{2}+x^{3}
          \;\Longrightarrow\;
          F'(1)=1+1+1=3
          $$

      - tipo: calcular
        titulo: El punto de paso
        pregunta: |
          ¿Cuánto vale $F(1)$?
        respuesta:
          tipo: numero
          valor: '1.5833333'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              Ese es solo $\int_{0}^{1}f$. Faltan $\int_{0}^{1}t^{2}=\frac13$ y
              $\int_{0}^{1}t^{3}=\frac14$.
          - valor: '0.5833333'
            mensaje: |
              Te has dejado el $\int_{0}^{1}f=1$ que da el enunciado. La suma es
              $1+\frac13+\frac14$.
          - valor: '3'
            mensaje: |
              Ese es $F'(1)$, la pendiente. El valor de la función es la
              integral.
        pista: |
          Parte la integral en tres: el primer trozo lo da el enunciado.
        desarrollo: |
          $$
          F(1)=\int_{0}^{1}f(t)\,dt+\int_{0}^{1}t^{2}dt+\int_{0}^{1}t^{3}dt
          =1+\frac13+\frac14=\frac{19}{12}\approx 1{,}5833
          $$

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              **a)** El integrando es continuo —$f$ lo es por hipótesis y los
              polinomios también—, así que por el teorema fundamental del cálculo
              $F$ es derivable y $F'(x)=f(x)+x^{2}+x^{3}$.
          - texto: >-
              **b)** La pendiente es $F'(1)=f(1)+1+1=3$.
          - texto: >-
              El punto de paso es
              $F(1)=\int_{0}^{1}f+\frac13+\frac14=\frac{19}{12}$.
          - texto: >-
              La tangente es $y-\frac{19}{12}=3(x-1)$, es decir
              $y=3x-\frac{17}{12}$.
          - texto: >-
              Se comprueba sustituyendo $x=1$: $3-\frac{17}{12}=\frac{19}{12}$.
          - texto: >-
              Como $f$ es desconocida, la tangente depende de cuál sea $f$ y solo
              se puede dar en función de ella.
            trampa: true
            mensaje: |
              No depende: la tangente en $x=1$ solo necesita $F(1)$ y $F'(1)$, y
              los dos quedan fijados por los dos datos del enunciado. **Todas**
              las funciones continuas con $f(1)=1$ y $\int_{0}^{1}f=1$ dan la
              misma recta tangente. Eso es lo que el ejercicio quiere que veas.

    resolucion: |
      **a) La derivada.** El integrando $f(t)+t^{2}+t^{3}$ es continuo: $f$ lo es
      por hipótesis y los dos monomios también. El teorema fundamental del
      cálculo dice entonces que $F$ es derivable y que su derivada es el
      integrando evaluado en el extremo superior:

      $$
      F'(x)=f(x)+x^{2}+x^{3}
      $$

      Conviene decir la hipótesis en voz alta: sin continuidad, $F$ sería
      continua pero podría no ser derivable, y el apartado b) no tendría sentido.

      **b) La recta tangente.** Hacen falta dos números.

      **La pendiente:**

      $$
      F'(1)=f(1)+1^{2}+1^{3}=1+1+1=3
      $$

      **El punto de paso**, partiendo la integral en tres:

      $$
      F(1)=\underbrace{\int_{0}^{1}f(t)\,dt}_{=1}
      +\underbrace{\int_{0}^{1}t^{2}dt}_{=\frac13}
      +\underbrace{\int_{0}^{1}t^{3}dt}_{=\frac14}
      =\frac{19}{12}
      $$

      **La recta:**

      $$
      y-\frac{19}{12}=3\left(x-1\right)
      \qquad\Longrightarrow\qquad
      y=3x-\frac{17}{12}
      $$

      **Lo que hay detrás.** El ejercicio da exactamente dos datos sobre $f$ —su
      valor en $1$ y su integral en $[0,1]$— porque son exactamente los dos que
      hacen falta, uno para cada número de la recta. **No importa qué función sea
      $f$**: todas las continuas que cumplan esas dos condiciones tienen la misma
      tangente en $x=1$. Reconocerlo es lo que separa este ejercicio de un
      cálculo mecánico.

  - id: ex2324-ord-6-la-bola-que-rueda-por-la-cupula
    titulo: La bola que rueda por la cúpula, y dónde acaba
    fuente: >-
      Ejercicio 1 del SEGUNDO PARCIAL · Convocatoria ordinaria, 10 de junio de 2024 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
