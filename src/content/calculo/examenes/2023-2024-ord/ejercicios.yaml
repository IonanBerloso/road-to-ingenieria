      <figcaption>
      Figura redibujada del enunciado original. Las dos curvas pasan por nudos
      enteros de la cuadrícula, así que aquí se dibujan con las parábolas que
      los unen: f(x) = 6 − (x−3)² y g(u) = 1 + (u−5)².
      </figcaption>
      </figure>

      a) La función $f^{-1}(x)$ definida en el intervalo $(3,4)$ es decreciente.

      b) La función $f^{-1}(x)$ definida en el intervalo $(3,4)$ es convexa.

      c) La función $h(x)=g(f(x))$ es creciente en el intervalo $(1,2)$.

      d) La función $h(x)=g(f(x))$ es cóncava en el intervalo $(1,2)$.

      e) Sea $P_{2}(x)=a+b(x-4)+c\left(x-4\right)^{2}$ el polinomio de Taylor de
      orden 2 de $f(x)$. Entonces $a>0$, $b<0$, $c>0$.
    pide: Verdadero o falso, razonado, en las cinco afirmaciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          Para los apartados a) y b), ¿qué relación hay entre la concavidad de
          $f$ y la de $f^{-1}$?
        opciones:
          - texto: >-
              $\left(f^{-1}\right)''=-\dfrac{f''}{\left(f'\right)^{3}}$, así que
              depende del signo de $f''$ **y** del de $f'$
            correcta: true
            mensaje: |
              Eso es, y el cubo es la clave: si $f$ crece, $\left(f'\right)^{3}$
              es positivo y la concavidad se invierte; si $f$ decrece, el cubo es
              negativo y se conserva. Aquí $f$ decrece en $(3,4)$, así que
              $f^{-1}$ es cóncava como $f$.
          - texto: >-
              Siempre se invierte: si $f$ es cóncava, $f^{-1}$ es convexa
            mensaje: |
              Solo si $f$ es **creciente**. Con $f$ decreciente el cubo del
              denominador es negativo y la concavidad se mantiene. Aquí, en
              $(3,4)$, $f$ decrece.
          - texto: >-
              Siempre se conserva, porque la gráfica de $f^{-1}$ es la de $f$
              reflejada
            mensaje: |
              La reflexión en la recta $y=x$ **sí** puede cambiar la concavidad:
              cambia lo que es «arriba». Depende del signo de $f'$, y por eso hay
              que mirarlo.

      - tipo: calcular
        titulo: Cuántas son ciertas
        pregunta: |
          ¿Cuántas de las cinco afirmaciones son ciertas?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Comprueba la e) con cuidado: $a=f(4)=5>0$ y $b=f'(4)=-2<0$ están
              bien, pero $c=\frac{f''(4)}{2}=-1$, que **no** es positivo. La e)
              falla por el último signo.
          - valor: '0'
            mensaje: |
              La a) sí es cierta: en $(3,4)$ la función $f$ decrece, y la inversa
              de una función decreciente es decreciente.
          - valor: '3'
            mensaje: |
              Solo la a). La c) y la d) fallan las dos: en $(1,2)$ la
              composición **decrece** y es **convexa**, justo lo contrario de lo
              que dicen.
        pista: |
          Ve una por una: la a) y la b) con la inversa, la c) y la d) con la
          regla de la cadena, y la e) con los tres coeficientes de Taylor.
        desarrollo: |
          Solo la **a)**. El resumen:

          | | afirmación | verdad |
          |---|---|---|
          | a) | $f^{-1}$ decreciente en $(3,4)$ | **cierta** |
          | b) | $f^{-1}$ convexa | falsa: es cóncava |
          | c) | $h$ creciente en $(1,2)$ | falsa: decrece |
          | d) | $h$ cóncava en $(1,2)$ | falsa: es convexa |
          | e) | $a>0$, $b<0$, $c>0$ | falsa: $c=-1$ |

      - tipo: calcular
        titulo: El coeficiente que estropea la e)
        pregunta: |
          ¿Cuánto vale el coeficiente $c$ del polinomio de Taylor de $f$
          centrado en $x=4$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              Ese es $f''(4)$. En la forma
              $P_{2}=a+b(x-4)+c(x-4)^{2}$ el coeficiente del cuadrado es
              $\frac{f''(4)}{2}$, no $f''(4)$.
          - valor: '1'
            mensaje: |
              Signo. $f(x)=6-(x-3)^{2}$ es una parábola hacia abajo:
              $f''=-2$ en todo punto.
          - valor: '5'
            mensaje: |
              Ese es $a=f(4)$. El coeficiente del término cuadrático es otro.
        pista: |
          $c=\frac{f''(4)}{2}$, y $f$ es una parábola.
        desarrollo: |
          $f(x)=6-(x-3)^{2}$, así que $f''(x)=-2$ en todo punto y

          $$
          c=\frac{f''(4)}{2}=-1<0
          $$

          Los otros dos sí cumplen lo que dice el enunciado: $a=f(4)=5>0$ y
          $b=f'(4)=-2(4-3)=-2<0$. La afirmación e) falla **solo** por $c$.

      - tipo: justificar
        titulo: Las cinco, una por una
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              De la figura: $f(x)=6-(x-3)^{2}$ en $[1,5]$ y
              $g(u)=1+(u-5)^{2}$; $f$ crece hasta $x=3$ y decrece después, y $g$
              decrece hasta $u=5$ y crece después.
          - texto: >-
              **a)** En $(3,4)$, $f$ es decreciente, y la inversa de una función
              decreciente es decreciente: **cierta**.
          - texto: >-
              **b)** $\left(f^{-1}\right)''=-\frac{f''}{(f')^{3}}$, con $f''=-2$
              y $f'<0$: sale negativa, así que $f^{-1}$ es cóncava y la
              afirmación es **falsa**.
          - texto: >-
              **c)** $h'=g'(f(x))f'(x)$; en $(1,2)$ es $f'>0$ y
              $f(x)<5$, luego $g'(f)<0$ y $h'<0$: **falsa**, decrece.
          - texto: >-
              **d)** $h''=g''(f)\left(f'\right)^{2}+g'(f)f''$; con $g''=2>0$,
              $f''=-2$ y $g'(f)<0$ los dos sumandos son positivos, así que $h$ es
              convexa: **falsa**.
          - texto: >-
              **e)** $a=f(4)=5>0$ y $b=f'(4)=-2<0$, pero
              $c=\frac{f''(4)}{2}=-1<0$: **falsa**.
          - texto: >-
              En $(3,4)$ la función $f$ no es inyectiva, así que $f^{-1}$ no
              existe y los apartados a) y b) no tienen respuesta.
            trampa: true
            mensaje: |
              $f$ no es inyectiva en **todo** $[1,5]$ —tiene un máximo en
              $x=3$—, pero sí lo es en $(3,4)$, que es donde el enunciado la
              restringe: ahí es estrictamente decreciente. Por eso el enunciado
              nombra ese intervalo y no otro, y por eso a) y b) sí se pueden
              contestar.

    resolucion: |
      **Lo que dice la figura.** $f$ está definida en $[1,5]$, vale $2$ en los
      dos extremos y tiene su máximo, $6$, en $x=3$. $g$ va de $g(2)=10$ hasta el
      mínimo $g(5)=1$ y sube hasta $g(6)=2$. Las dos pasan por nudos enteros de
      la cuadrícula, así que son $f(x)=6-(x-3)^{2}$ y $g(u)=1+(u-5)^{2}$.

      **a) $f^{-1}$ es decreciente en $(3,4)$: CIERTA.**

      En $(3,4)$ la función $f$ es estrictamente decreciente —el máximo queda a
      su izquierda—, así que ahí sí es inyectiva y tiene inversa. Y la inversa de
      una función decreciente es decreciente: si $y_{1}<y_{2}$, sus antiimágenes
      van al revés.

      Explícitamente, $f^{-1}(y)=3+\sqrt{6-y}$, cuya derivada
      $-\frac{1}{2\sqrt{6-y}}$ es negativa.

      **b) $f^{-1}$ es convexa: FALSA.**

      La regla es

      $$
      \left(f^{-1}\right)''(y)=-\frac{f''(x)}{\left(f'(x)\right)^{3}}
      $$

      y el **cubo** es lo que decide. Aquí $f''=-2<0$ y, en $(3,4)$, $f'<0$, así
      que $\left(f'\right)^{3}<0$ y

      $$
      \left(f^{-1}\right)''=-\frac{-}{-}<0
      $$

      $f^{-1}$ es **cóncava**, igual que $f$. La reflexión en $y=x$ invierte la
      concavidad solo cuando la función es creciente.

      **c) $h=g\circ f$ es creciente en $(1,2)$: FALSA.**

      $$
      h'(x)=g'\left(f(x)\right)\cdot f'(x)
      $$

      En $(1,2)$: $f$ crece, así que $f'>0$; y $f(x)$ va de $2$ a $5$, valores
      **por debajo** del mínimo de $g$, donde $g'<0$. El producto es negativo:
      $h$ decrece.

      **d) $h$ es cóncava en $(1,2)$: FALSA.**

      $$
      h''=g''\left(f\right)\left(f'\right)^{2}+g'\left(f\right)f''
      $$

      Con $g''=2>0$ el primer sumando es positivo; y con $g'(f)<0$ y $f''=-2<0$
      el segundo también. Los dos suman positivo: $h$ es **convexa**.

      **e) $a>0$, $b<0$, $c>0$: FALSA.**

      $$
      a=f(4)=5>0,
      \qquad
      b=f'(4)=-2<0,
      \qquad
      c=\frac{f''(4)}{2}=-1<0
      $$

      Los dos primeros signos son los que dice el enunciado; el tercero no. Y
      cuidado con la forma: como el polinomio está escrito con
      $c(x-4)^{2}$ y no con $c\frac{(x-4)^{2}}{2}$, el coeficiente lleva el
      $\frac12$ dentro.

      **Resultado: solo la a) es cierta.** Cuatro de cinco falsas, y las dos del
      medio fallan las dos por lo mismo: el reflejo de suponer que la composición
      hereda el comportamiento de $f$ sin mirar dónde cae su imagen dentro de
      $g$.

  - id: ex2324-ord-3-taylor-de-una-edo-y-su-error
    titulo: Taylor de una función que no se conoce, y el error acotado con una gráfica
    fuente: >-
      Ejercicio 3 del PRIMER PARCIAL · Convocatoria ordinaria, 10 de junio de 2024 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Sea $y(x)$ una función tal que

      $$
      y'(x)=\frac{y}{x}+\ln x,
      \qquad y(1)=1
      $$

      a) Calcular el polinomio de Taylor de orden 2 de $y(x)$ en el punto $x=1$.

      b) Supongamos que aproximamos el valor $y(1{,}5)$ utilizando el polinomio
      obtenido en el apartado anterior. Acotar el error cometido en dicha
      aproximación.

