        <circle class="sup24-pt" cx="295.1" cy="119.2" r="4.2"/>
        <g class="sup24-n">
          <text x="419.8" y="254">x</text>
          <text x="306.6" y="217.4">y</text>
          <text x="237" y="62.8">z</text>
        </g>
        <text class="sup24-et" x="303.1" y="113.2">P(1, 1, 7/2)</text>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original, que es una vista tridimensional
      de la superficie: aquí se dibuja con sus curvas de nivel y las dos
      secciones principales, que es lo que se puede trazar a mano.
      </figcaption>
      </figure>

      a) Plantear la(s) ecuación(es) diferencial(es) y la(s) condición(es)
      inicial(es) que debe cumplir la trayectoria de la bola.

      b) Resolver dicha(s) ecuación(es).

      c) Determinar el punto $S$.
    pide: La ecuación de la trayectoria, su solución y el punto de llegada.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dirección sigue la bola en cada punto?
        opciones:
          - texto: >-
              La de $-\nabla f$, la de máxima pendiente de bajada, que es
              perpendicular a las curvas de nivel
            correcta: true
            mensaje: |
              Eso es. Sin más fuerza que la gravedad, la bola cae por donde más
              baja, y esa dirección es la del gradiente cambiado de signo.
          - texto: >-
              La de una curva de nivel, porque es por donde puede rodar sin
              esfuerzo
            mensaje: |
              Sobre una curva de nivel la altura **no cambia**: la bola no
              bajaría nunca y no llegaría al plano $XY$.
          - texto: >-
              La recta que une $P$ con el punto más bajo de la superficie
            mensaje: |
              Solo si la superficie fuera un plano. En una cúpula la trayectoria
              se va curvando, porque la dirección de máxima pendiente cambia en
              cada punto.

      - tipo: calcular
        titulo: El exponente de la trayectoria
        pregunta: |
          La trayectoria en el plano $XY$ es $y=Kx^{p}$. ¿Cuánto vale $p$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              Has integrado la proporción al revés. De
              $\frac{dx}{x}=\frac{dy}{2y}$ sale $2\ln x=\ln y+C$, es decir
              $y=Kx^{2}$.
          - valor: '1'
            mensaje: |
              Con $p=1$ la trayectoria sería una recta por el origen, y eso solo
              pasaría si los dos coeficientes de $f$ fueran iguales. Aquí el
              $\frac{x^{2}}{2}$ y el $y^{2}$ pesan distinto.
          - valor: '4'
            mensaje: |
              Has elevado al cuadrado de más. El cociente de los dos coeficientes
              del gradiente es $2$, y ese es el exponente.
        pista: |
          $\nabla f=(-x,-2y)$, y la trayectoria cumple
          $\frac{dx}{x}=\frac{dy}{2y}$.
        desarrollo: |
          $$
          \nabla f=\left(-x,\;-2y\right)
          $$

          La bola sigue $-\nabla f=(x,2y)$, así que su trayectoria cumple

          $$
          \frac{dx}{x}=\frac{dy}{2y}
          \;\Longrightarrow\;
          2\ln x=\ln y+C
          \;\Longrightarrow\;
          y=Kx^{2}
          $$

          y la condición inicial $(1,1)$ da $K=1$:

          $$
          y=x^{2}
          $$

      - tipo: calcular
        titulo: La abscisa del punto de llegada
        pregunta: |
          ¿Cuánto vale la coordenada $x$ del punto $S$?
        respuesta:
          tipo: numero
          valor: '1.4142136'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              Ese es el valor de $y$ en $S$, o de $x^{2}$. La ecuación
              $u^{2}+\frac u2-5=0$ con $u=x^{2}$ da $u=2$, y de ahí
              $x=\sqrt{2}$.
          - valor: '3.1622777'
            mensaje: |
              Ese es $\sqrt{10}$, donde la superficie corta al plano $XY$ **sobre
              el eje $x$**. Pero la bola no baja por el eje: baja por la parábola
              $y=x^{2}$.
          - valor: '2.2360680'
            mensaje: |
              Ese es $\sqrt{5}$, el corte con el plano sobre el eje $y$. La bola
              llega a otro punto de esa misma elipse.
        pista: |
          Impón $f=0$ sobre la trayectoria: sustituye $y=x^{2}$ en
          $5-\frac{x^{2}}{2}-y^{2}=0$.
        desarrollo: |
          $$
          5-\frac{x^{2}}{2}-x^{4}=0
          $$

          Con $u=x^{2}$: $u^{2}+\frac{u}{2}-5=0$, cuyas raíces son $u=2$ y
          $u=-\frac52$. Solo la positiva sirve:

          $$
          x^{2}=2
          \;\Longrightarrow\;
          x=\sqrt{2},
          \qquad
          y=x^{2}=2,
          \qquad
          z=0
          $$

          $$
          S=\left(\sqrt2,\;2,\;0\right)
          $$

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              **a)** Sin más fuerza que la gravedad, la bola sigue en cada punto
              la dirección de máxima pendiente de bajada, que es la de
              $-\nabla f=(x,\,2y)$.
          - texto: >-
              La trayectoria en el plano $XY$ cumple entonces
              $\frac{dx}{x}=\frac{dy}{2y}$, con la condición inicial
              $(x,y)=(1,1)$.
          - texto: >-
              **b)** Es de variables separadas: $2\ln x=\ln y+C$, o sea
              $y=Kx^{2}$, y la condición inicial da $K=1$: $y=x^{2}$.
          - texto: >-
              **c)** La bola llega al plano $XY$ donde $f=0$; sustituyendo
              $y=x^{2}$ queda $x^{4}+\frac{x^{2}}{2}-5=0$.
          - texto: >-
              Con $u=x^{2}$ sale $u=2$, así que
              $S=\left(\sqrt2,\,2,\,0\right)$, que además está sobre la elipse
              $\frac{x^{2}}{10}+\frac{y^{2}}{5}=1$ donde la superficie corta al
              suelo.
          - texto: >-
              Como la bola solo baja, la trayectoria es la recta de máxima
              pendiente que sale de $P$, y basta con calcular esa dirección una
              vez.
            trampa: true
            mensaje: |
              La dirección de máxima pendiente **cambia en cada punto**: depende
              de $(x,y)$. Por eso el problema es una ecuación diferencial y no un
              cálculo de una dirección. Si la superficie fuera un plano sí sería
              una recta; en una cúpula elíptica sale una parábola.

    resolucion: |
      **a) La ecuación.** La bola solo está sometida a la gravedad, así que en
      cada punto baja por donde más baja: la dirección de $-\nabla f$, que es
      perpendicular a las curvas de nivel.

      $$
      \nabla f=\left(-x,\;-2y\right)
      \qquad\Longrightarrow\qquad
      -\nabla f=\left(x,\;2y\right)
      $$

      Que la trayectoria $(x(t),y(t))$ tenga esa dirección en cada punto
      significa que su vector tangente es proporcional a $(x,2y)$:

      $$
      \frac{dx}{x}=\frac{dy}{2y},
      \qquad
      \left(x,y\right)=(1,1)\ \text{al empezar}
      $$

      **b) La solución.** Es de variables separadas:

      $$
      \int\frac{2\,dx}{x}=\int\frac{dy}{y}
      \;\Longrightarrow\;
      2\ln x=\ln y+C
      \;\Longrightarrow\;
      y=Kx^{2}
      $$

      y la condición inicial $(1,1)$ da $K=1$:

      $$
      y=x^{2}
      $$

      La proyección de la trayectoria sobre el plano $XY$ es una **parábola**, no
      una recta. Y era de esperar: la superficie no es de revolución —el
      coeficiente de $x^{2}$ es la mitad del de $y^{2}$—, así que la bola se
      desvía hacia donde la ladera es más empinada.

      **c) El punto de llegada.** La bola termina donde la superficie toca el
      suelo, es decir donde $f=0$, sobre su trayectoria:

      $$
      5-\frac{x^{2}}{2}-\left(x^{2}\right)^{2}=0
      \;\Longrightarrow\;
      x^{4}+\frac{x^{2}}{2}-5=0
      $$

      Con $u=x^{2}$: $u^{2}+\frac u2-5=0$, de raíces $u=2$ y $u=-\frac52$. Solo
      la positiva tiene sentido:

      $$
      S=\left(\sqrt{2},\;2,\;0\right)
      $$

