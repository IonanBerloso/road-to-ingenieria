ejercicios:
  - id: ex2324-ord-1-imaginario-puro-de-modulo-uno
    titulo: Dos condiciones, dos incógnitas y dos soluciones
    fuente: >-
      Ejercicio 1 del PRIMER PARCIAL · Convocatoria ordinaria, 10 de junio de 2024 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Sea el número complejo $z=\dfrac{2b-3ai}{3-4i}$, con $a,b\in\mathbb{R}$.
      Calcular los valores de $a$ y $b$ para que $z$ sea imaginario puro y
      $\left|z\right|=1$.
    pide: Los valores de a y b, y el z que resulta.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál de las dos condiciones conviene usar **sin** hacer la división?
        opciones:
          - texto: >-
              La del módulo: $\left|z\right|=\dfrac{\left|2b-3ai\right|}
              {\left|3-4i\right|}$, y el módulo de un cociente es el cociente de
              los módulos
            correcta: true
            mensaje: |
              Eso es. Da $\sqrt{4b^{2}+9a^{2}}=5$ en una línea. Para la otra
              condición sí hace falta separar el cociente, porque «imaginario
              puro» habla de la parte real.
          - texto: >-
              La de ser imaginario puro, porque basta con que el numerador lo sea
            mensaje: |
              No basta: al dividir entre $3-4i$ el argumento cambia. De hecho
              $2b-3ai$ **no** es imaginario puro en la solución —con $a=1$,
              $b=-2$ vale $-4-3i$— y el cociente sí lo es.
          - texto: >-
              Ninguna: hay que racionalizar primero y luego imponer las dos
            mensaje: |
              Se puede, y sale igual. Pero el módulo se obtiene gratis sin
              racionalizar, y en un examen sin calculadora eso son dos minutos
              menos y un sitio menos donde equivocarse.

      - tipo: calcular
        titulo: La relación entre a y b
        pregunta: |
          Imponiendo que $z$ sea imaginario puro sale $b=ka$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Signo. La parte real del numerador racionalizado es
              $6b+12a$, y anularla da $b=-2a$.
          - valor: '-0.5'
            mensaje: |
              Has despejado al revés: de $6b+12a=0$ sale $b=-2a$, no
              $a=-2b$.
          - valor: '-1.3333333'
            mensaje: |
              Parece que has usado el $3$ y el $4$ del denominador en la parte
              real. Al multiplicar por el conjugado, la parte real del numerador
              es $2b\cdot 3+(-3a)(-4)=6b+12a$.
        pista: |
          Multiplica numerador y denominador por $3+4i$ y anula la parte real.
        desarrollo: |
          $$
          z=\frac{(2b-3ai)(3+4i)}{25}
          =\frac{6b+12a+i\left(8b-9a\right)}{25}
          $$

          Imaginario puro significa parte real nula:

          $$
          6b+12a=0
          \;\Longrightarrow\;
          b=-2a
          $$

      - tipo: calcular
        titulo: El valor positivo de a
        pregunta: |
          Con la condición del módulo, ¿cuál es el valor positivo de $a$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '5'
            mensaje: |
              Te has quedado con $\left|2b-3ai\right|=5$ sin sustituir
              $b=-2a$. Al hacerlo, $4(4a^{2})+9a^{2}=25a^{2}=25$.
          - valor: '1.6666667'
            mensaje: |
              Has usado solo el término en $a$: $9a^{2}=25$. Falta el $4b^{2}$,
              que con $b=-2a$ vale $16a^{2}$.
          - valor: '2'
            mensaje: |
              $2$ es el valor de $\left|b\right|$, no el de $a$. Con $a=1$ sale
              $b=-2$.
        pista: |
          $\left|z\right|=\frac{\sqrt{4b^{2}+9a^{2}}}{5}=1$, y ya sabes que
          $b=-2a$.
        desarrollo: |
          $$
          \left|z\right|=\frac{\sqrt{4b^{2}+9a^{2}}}{5}=1
          \;\Longrightarrow\;
          4b^{2}+9a^{2}=25
          $$

          y con $b=-2a$:

          $$
          16a^{2}+9a^{2}=25a^{2}=25
          \;\Longrightarrow\;
          a=\pm 1
          $$

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El módulo de un cociente es el cociente de los módulos, así que
              $\left|z\right|=\frac{\sqrt{4b^{2}+9a^{2}}}{5}$, y la condición
              $\left|z\right|=1$ da $4b^{2}+9a^{2}=25$.
          - texto: >-
              Racionalizando,
              $z=\frac{6b+12a+i(8b-9a)}{25}$, y ser imaginario puro obliga a
              $6b+12a=0$, es decir $b=-2a$.
          - texto: >-
              Sustituyendo, $25a^{2}=25$ y $a=\pm 1$.
          - texto: >-
              Hay **dos** soluciones: $(a,b)=(1,-2)$, que da $z=-i$, y
              $(a,b)=(-1,2)$, que da $z=i$.
          - texto: >-
              Las dos se comprueban de un vistazo: $\left|\pm i\right|=1$ y su
              parte real es cero.
          - texto: >-
              Como el enunciado pide un número complejo concreto, hay que
              quedarse con la solución de $a$ positivo.
            trampa: true
            mensaje: |
              El enunciado pide «los valores de $a$ y $b$», en plural y sin
              ninguna condición que descarte una de las dos parejas. Las dos son
              válidas y hay que darlas las dos: dejarse una es perder la mitad
              del ejercicio.

    resolucion: |
      **La condición del módulo, que sale gratis.** El módulo de un cociente es
      el cociente de los módulos, así que no hace falta racionalizar:

      $$
      \left|z\right|=\frac{\left|2b-3ai\right|}{\left|3-4i\right|}
      =\frac{\sqrt{4b^{2}+9a^{2}}}{5}=1
      \;\Longrightarrow\;
      4b^{2}+9a^{2}=25
      $$

      **La condición de ser imaginario puro**, que sí la pide. Multiplicando por
      el conjugado del denominador:

      $$
      z=\frac{(2b-3ai)(3+4i)}{25}
      =\frac{6b+12a}{25}+i\,\frac{8b-9a}{25}
      $$

      Imaginario puro es parte real nula:

      $$
      6b+12a=0
      \;\Longrightarrow\;
      b=-2a
      $$

      **El sistema.** Sustituyendo en la primera:

      $$
      4\left(4a^{2}\right)+9a^{2}=25a^{2}=25
      \;\Longrightarrow\;
      a=\pm 1
      $$

      **Las dos soluciones.**

      | $a$ | $b$ | $z$ |
      |---|---|---|
      | $1$ | $-2$ | $-i$ |
      | $-1$ | $2$ | $i$ |

      Y las dos cumplen lo pedido: son imaginarios puros y de módulo $1$. El
      enunciado no da ninguna condición que descarte una, así que hay que dar
      las dos.

      **La comprobación** es rápida con la primera: con $a=1$ y $b=-2$,

      $$
      z=\frac{-4-3i}{3-4i}
      =\frac{(-4-3i)(3+4i)}{25}
      =\frac{-12-16i-9i+12}{25}
      =\frac{-25i}{25}=-i
      $$

      Fíjate en que el numerador, $-4-3i$, **no** es imaginario puro: lo que lo
      convierte en uno es la división. Ese es el motivo de que no valga imponer
      la condición sobre el numerador.

  - id: ex2324-ord-2-cinco-afirmaciones-sobre-dos-graficas
    titulo: Cinco afirmaciones, y solo una es cierta
    fuente: >-
      Ejercicio 2 del PRIMER PARCIAL · Convocatoria ordinaria, 10 de junio de 2024 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión. La figura es la misma que la del
      ejercicio 3 de la recuperación de la quinta de 2017-2018.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
