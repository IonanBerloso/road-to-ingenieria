          <text x="190" y="265" text-anchor="middle">1</text>
          <text x="53" y="122" text-anchor="end">2</text>
          <text x="53" y="188" text-anchor="end">1</text>
          <text x="228" y="178">4</text>
          <text x="264" y="144">x</text>
          <text x="239.5" y="254">y</text>
          <text x="67" y="82.4">z</text>
        </g>
