      <figcaption>
      Figura nuestra: el apartado a) pide dibujarlo y el examen no trae ninguna.
      La cara delantera es la sección, y se repite igual a lo largo de las cuatro
      unidades de x.
      </figcaption>
      </figure>

      Las tres condiciones son independientes salvo una: el techo,
      $z\le 1+(y-1)^{2}$, depende de $y$. Como no depende de $x$, la sección por
      cualquier plano $x=$ cte es la misma, y el sólido es un **prisma** de
      longitud $4$ cuya base es la región bajo una parábola.

      Esa parábola tiene el vértice en $(y,z)=(1,1)$ y sube hasta $(0,2)$: el
      sólido es alto $2$ en un borde y $1$ en el otro.

      **b) Los dos órdenes.**

      Con $dz$ primero, la variable que depende de otra va la primera y no hay
      nada que partir:

      $$
      V=\int_{0}^{4}\left(\int_{0}^{1}
      \left(\int_{0}^{1+(y-1)^{2}}dz\right)dy\right)dx
      $$

      Con $dy$ primero hay que despejar $y$ de la tapa, y entonces sí:

      $$
      z\le 1+(y-1)^{2}
      \;\Longleftrightarrow\;
      (y-1)^{2}\ge z-1
      \;\Longleftrightarrow\;
      y\le 1-\sqrt{z-1}
      $$

      —el valor absoluto se resuelve así porque $y\le 1$—. Y como la raíz solo
      tiene sentido a partir de $z=1$, la integral se parte:

      $$
      V=\int_{0}^{4}\left[
      \int_{0}^{1}\left(\int_{0}^{1}dy\right)dz
      +\int_{1}^{2}\left(\int_{0}^{1-\sqrt{z-1}}dy\right)dz
      \right]dx
      $$

      El motivo, dicho en una frase: **hasta la altura $1$ el sólido llena toda
      la anchura, y por encima solo una parte.**

      **c) El volumen.** Con el primer orden:

      $$
      V=4\int_{0}^{1}\left[1+(y-1)^{2}\right]dy
      =4\left[y+\frac{(y-1)^{3}}{3}\right]_{0}^{1}
      =4\left(1+\frac13\right)=\frac{16}{3}
      $$

      Y con el segundo, para comprobar:

      $$
      4\left[1+\int_{1}^{2}\left(1-\sqrt{z-1}\right)dz\right]
      =4\left[1+\left(1-\frac23\right)\right]=\frac{16}{3}
      $$

      **Un control de tamaño.** El sólido está entre el prisma de altura $1$
      —volumen $4$— y el de altura $2$ —volumen $8$—. $\frac{16}{3}\approx 5{,}33$
      cae entre los dos y más cerca del pequeño, que es lo razonable: la tapa
      solo llega a $2$ en un borde.

  - id: ex2324-ord-8-un-arranque-retrasado-dos-segundos
    titulo: Un sistema que no arranca hasta el segundo dos
    fuente: >-
      Ejercicio 3 del SEGUNDO PARCIAL · Convocatoria ordinaria, 10 de junio de 2024 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Resolver la EDO

      $$
      \begin{cases}
      y''+y'=f(t)\\
      y(0)=y'(0)=0
      \end{cases}
      \qquad\text{donde}\qquad
      f(t)=
      \begin{cases}
      0 & 0\le t<2\\
      \operatorname{sen}(t-2) & t\ge 2
      \end{cases}
      $$
    pide: La solución del problema de valor inicial.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué conviene Laplace aquí y no los coeficientes indeterminados?
        opciones:
          - texto: >-
              Porque el segundo miembro está definido a trozos, y Laplace lo
              escribe de una vez con la función escalón: $f(t)=u(t-2)
              \operatorname{sen}(t-2)$
            correcta: true
            mensaje: |
              Eso es. Con coeficientes indeterminados habría que resolver dos
              problemas y pegarlos con continuidad; Laplace lo hace de una
              tacada, y el retardo se convierte en el factor $e^{-2s}$.
          - texto: >-
              Porque la ecuación no tiene coeficientes constantes
            mensaje: |
              Sí los tiene: $y''+y'$. Lo que estorba es el segundo miembro, no la
              parte homogénea.
          - texto: >-
              Porque las condiciones iniciales son nulas
            mensaje: |
              Que sean nulas ayuda —desaparecen los términos con $y(0)$ e
              $y'(0)$—, pero no es lo que decide: con condiciones no nulas
              Laplace seguiría siendo la vía cómoda.

      - tipo: calcular
        titulo: La transformada del segundo miembro
        pregunta: |
          $\mathcal{L}\left\{f\right\}=\dfrac{e^{-as}}{s^{2}+1}$. ¿Cuánto vale
          $a$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Sin el retardo la solución arrancaría en $t=0$, y el enunciado dice
              que hasta $t=2$ no pasa nada. El segundo teorema del
              desplazamiento pone el $e^{-2s}$.
          - valor: '-2'
            mensaje: |
              Signo. Un retardo hacia la derecha en $t$ produce
              $e^{-as}$ con $a>0$; con exponente positivo la transformada no
              tendería a cero.
          - valor: '1'
            mensaje: |
              El retardo es el que dice el enunciado: la función se enciende en
              $t=2$.
        pista: |
          $\mathcal{L}\left\{u(t-a)g(t-a)\right\}=e^{-as}G(s)$.
        desarrollo: |
          $$
          f(t)=u(t-2)\operatorname{sen}(t-2)
          \;\Longrightarrow\;
          \mathcal{L}\left\{f\right\}=\frac{e^{-2s}}{s^{2}+1}
          $$

      - tipo: calcular
        titulo: El valor al que tiende la solución
        pregunta: |
          ¿A qué valor **no** tiende $y(t)$ cuando $t\to\infty$? Es decir:
          ¿cuánto vale el término constante de la solución?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              La descomposición en fracciones simples empieza con
              $\frac{1}{s}$, y su antitransformada es la constante $1$. Los otros
              tres términos oscilan o se apagan, pero ese se queda.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es el coeficiente de los otros tres sumandos, no el del
              $\frac1s$. Ese vale $1$.
          - valor: '2'
            mensaje: |
              El $2$ es el retardo, no el término constante.
        pista: |
          Descompón $\frac{1}{s(s+1)(s^{2}+1)}$ en fracciones simples y mira el
          coeficiente de $\frac1s$.
        desarrollo: |
          $$
          \frac{1}{s(s+1)(s^{2}+1)}
          =\frac{1}{s}-\frac{1}{2(s+1)}-\frac{1}{2}\cdot\frac{s+1}{s^{2}+1}
          $$

          y antitransformando,

          $$
          g(t)=1-\frac{e^{-t}}{2}-\frac{\cos t+\operatorname{sen}t}{2}
          $$

          El primer sumando es el que no se apaga: la solución oscila
          indefinidamente alrededor de $1$.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El segundo miembro se escribe con el escalón:
              $f(t)=u(t-2)\operatorname{sen}(t-2)$, cuya transformada es
              $\frac{e^{-2s}}{s^{2}+1}$.
          - texto: >-
              Con $y(0)=y'(0)=0$, la ecuación transformada es
              $\left(s^{2}+s\right)Y=\frac{e^{-2s}}{s^{2}+1}$, o sea
              $Y=\frac{e^{-2s}}{s(s+1)(s^{2}+1)}$.
          - texto: >-
              En fracciones simples,
              $\frac{1}{s(s+1)(s^{2}+1)}
              =\frac1s-\frac{1}{2(s+1)}-\frac12\cdot\frac{s+1}{s^{2}+1}$.
          - texto: >-
              Antitransformando esa parte,
              $g(t)=1-\frac{e^{-t}}{2}-\frac{\cos t+\operatorname{sen}t}{2}$, que
              cumple $g(0)=g'(0)=0$.
          - texto: >-
              El factor $e^{-2s}$ retrasa todo dos unidades:
              $y(t)=u(t-2)\,g(t-2)$, es decir $y\equiv 0$ hasta $t=2$ y
              $g(t-2)$ a partir de ahí.
          - texto: >-
              Como $f$ vale cero hasta $t=2$ y las condiciones iniciales son
              nulas, la solución también empieza a valer algo antes de $t=2$ por
              efecto de la homogénea.
            trampa: true
            mensaje: |
              Con entrada nula y condiciones iniciales nulas, la única solución
              en $[0,2)$ es la nula: la homogénea $y''+y'=0$ con
              $y(0)=y'(0)=0$ da $y\equiv 0$. El sistema está literalmente parado
              hasta que llega la señal, y eso es lo que el factor
              $e^{-2s}$ dice en el mundo de Laplace.

    resolucion: |
      **El segundo miembro, escrito de una vez.** La forma a trozos se escribe
      con la función escalón unidad:

      $$
      f(t)=u(t-2)\operatorname{sen}(t-2)
      $$

      y el **segundo teorema del desplazamiento** da su transformada sin
      integrar nada:

      $$
      \mathcal{L}\left\{f\right\}=e^{-2s}\,\mathcal{L}\left\{\operatorname{sen}t\right\}
      =\frac{e^{-2s}}{s^{2}+1}
      $$

      **La ecuación transformada.** Con $y(0)=y'(0)=0$:

      $$
      \left(s^{2}+s\right)Y(s)=\frac{e^{-2s}}{s^{2}+1}
      \qquad\Longrightarrow\qquad
      Y(s)=\frac{e^{-2s}}{s(s+1)\left(s^{2}+1\right)}
      $$

      **Las fracciones simples.** Se descompone la parte sin el exponencial:

      $$
      \frac{1}{s(s+1)(s^{2}+1)}
      =\frac{A}{s}+\frac{B}{s+1}+\frac{Cs+D}{s^{2}+1}
      $$

      Con $s=0$ sale $A=1$; con $s=-1$, $B=-\frac12$; y con $s=i$,
      $C=D=-\frac12$. Es decir

      $$
      \frac{1}{s(s+1)(s^{2}+1)}
      =\frac{1}{s}-\frac{1}{2(s+1)}-\frac{1}{2}\cdot\frac{s+1}{s^{2}+1}
      $$

      **La antitransformada.**

      $$
      g(t)=1-\frac{1}{2}e^{-t}-\frac{1}{2}\left(\cos t+\operatorname{sen}t\right)
      $$

      Conviene comprobarla: $g(0)=1-\frac12-\frac12=0$ y $g'(0)=\frac12-\frac12=0$.
      Que salgan cero las dos no es casualidad — son las condiciones iniciales
      trasladadas.

      **El retardo.** El factor $e^{-2s}$ traslada todo dos unidades:

      $$
      y(t)=u(t-2)\,g(t-2)=
      \begin{cases}
      0 & t<2\\[6pt]
      1-\dfrac{e^{-(t-2)}}{2}
      -\dfrac{\cos(t-2)+\operatorname{sen}(t-2)}{2} & t\ge 2
      \end{cases}
      $$

      **Lo que dice la solución.** Hasta $t=2$ el sistema está parado: no hay
      entrada y no hay energía almacenada. A partir de ahí arranca desde cero
      —sin salto, y con pendiente cero— y acaba oscilando indefinidamente
      alrededor de $1$, porque el término $\frac{e^{-t}}{2}$ se apaga pero el
      seno y el coseno no. Ese $1$ es el que aporta el $\frac1s$ de las
      fracciones simples, y viene de que la ecuación es $y''+y'$ y no $y''+y$:
      hay una raíz en $s=0$.

  - id: ex2324-ord-9-fourier-de-la-rampa-corta
    titulo: Una rampa que solo ocupa media onda
    fuente: >-
      Ejercicio 4 del SEGUNDO PARCIAL · Convocatoria ordinaria, 10 de junio de 2024 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea la función

      $$
      f(t)=
      \begin{cases}
      \dfrac{\pi}{2}-t & 0<t\le\dfrac{\pi}{2}\\[8pt]
      0 & \dfrac{\pi}{2}<t\le\pi
      \end{cases}
      $$

      a) Obtener la ampliación impar y periódica, $F(t)$, de la función $f(t)$.

      b) Dibujar la función ampliada, $F(t)$.

      c) Calcular la serie de Fourier, $S(t)$, de $f(t)$.

      d) Calcular los valores de $S(t)$ y $f(t)$ en los puntos $t=2024\pi$ y
      $t=\dfrac{201\pi}{2}$.
    pide: La ampliación, su dibujo, la serie y los dos valores.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Hasta dónde llega la integral que da los coeficientes?
        opciones:
          - texto: >-
              Hasta $\pi$, pero el integrando es cero de $\frac{\pi}{2}$ en
              adelante: en la práctica solo se integra en
              $\left(0,\frac{\pi}{2}\right)$
            correcta: true
            mensaje: |
              Eso es. La fórmula para una función impar de periodo $2\pi$ es
              $b_{n}=\frac2\pi\int_{0}^{\pi}F\operatorname{sen}(nt)\,dt$, y la
              mitad de ese intervalo no aporta nada porque $f$ vale cero ahí.
          - texto: >-
              Hasta $\frac{\pi}{2}$, porque es donde acaba la fórmula de $f$
            mensaje: |
              La fórmula que da los coeficientes integra sobre el semiperiodo
              entero, $\left(0,\pi\right)$. Que el segundo trozo no aporte es un
              resultado, no el punto de partida.
          - texto: >-
              Hasta $2\pi$, que es el periodo
            mensaje: |
              Para una función impar los coeficientes se calculan sobre medio
              periodo y se multiplican por $\frac2\pi$: la parte negativa aporta
              lo mismo por simetría.

      - tipo: calcular
        titulo: El segundo coeficiente
        pregunta: |
          ¿Cuánto vale $b_{2}$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.3633802'
            mensaje: |
              Ese es $b_{1}$. Para $n$ par el término
              $\operatorname{sen}\frac{n\pi}{2}$ se anula y queda
              $b_{n}=\frac1n$ limpio; con $n=1$ hay que restarle
              $\frac{2}{\pi}$.
          - valor: '0.25'
            mensaje: |
              Ese es $b_{4}$. La fórmula para $n$ par es $\frac1n$, y con
              $n=2$ vale $\frac12$.
          - valor: '1'
            mensaje: |
              Te has dejado el $\frac1n$. La parte que sobrevive para $n$ par es
              $\frac{1}{n}$, no $1$.
        pista: |
          $b_{n}=\frac1n-\frac{2\operatorname{sen}\frac{n\pi}{2}}{\pi n^{2}}$, y
          para $n$ par el seno se anula.
        desarrollo: |
          $$
          b_{n}=\frac{2}{\pi}\int_{0}^{\pi/2}
          \left(\frac{\pi}{2}-t\right)\operatorname{sen}(nt)\,dt
          =\frac{1}{n}-\frac{2\operatorname{sen}\frac{n\pi}{2}}{\pi n^{2}}
          $$

          Con $n=2$: $\operatorname{sen}\pi=0$, así que $b_{2}=\frac12$.

      - tipo: calcular
        titulo: El valor en los dos puntos
        pregunta: |
          $t=2024\pi$ y $t=\frac{201\pi}{2}$ dan el mismo valor de $S$. ¿Cuál?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1.5707963'
            mensaje: |
              Ese es $\frac{\pi}{2}$, el límite por la derecha en $t=0$. En un
              salto la serie converge a la **media** de los dos límites, y el de
              la izquierda es $-\frac{\pi}{2}$.
          - valor: '0.7853982'
            mensaje: |
              Ese es $\frac{\pi}{4}$. Reduce los dos puntos módulo $2\pi$:
              $2024\pi$ cae en $0$ y $\frac{201\pi}{2}$ en $\frac{\pi}{2}$, y en
              los dos el valor es cero.
          - valor: '3176.9911'
            mensaje: |
              Has sustituido $t$ en la fórmula sin reducir. $F$ es periódica de
              periodo $2\pi$: primero hay que llevar el punto al intervalo
              básico.
        pista: |
          $2024$ es par, y $\frac{201}{2}=100{,}5$.
        desarrollo: |
          $2024\pi=1012\cdot 2\pi\equiv 0$. En $t=0$ hay un salto: los límites
          laterales son $\frac{\pi}{2}$ y $-\frac{\pi}{2}$, así que

          $$
          S(2024\pi)=\frac{\frac{\pi}{2}+\left(-\frac{\pi}{2}\right)}{2}=0
          $$

          $\frac{201\pi}{2}=100\pi+\frac{\pi}{2}\equiv\frac{\pi}{2}$. Ahí $F$ es
          **continua** y vale $f\left(\frac{\pi}{2}\right)=0$, así que también

          $$
          S\left(\tfrac{201\pi}{2}\right)=0
          $$

          Mismo número por dos motivos distintos, y decir cuál es cuál es lo que
          pide el «justificando la respuesta».

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              **a)** La ampliación impar es $F(t)=-f(-t)$ para $t<0$, repetida
              con periodo $2\pi$: una rampa que baja de $\frac{\pi}{2}$ a $0$ en
              $\left(0,\frac{\pi}{2}\right)$, cero hasta $\pi$, y la imagen
              cambiada de signo a la izquierda.
          - texto: >-
              **c)** Al ser impar, todos los $a_{n}$ se anulan y
              $b_{n}=\frac{2}{\pi}\int_{0}^{\pi/2}
              \left(\frac{\pi}{2}-t\right)\operatorname{sen}(nt)\,dt$.
          - texto: >-
              Integrando por partes,
              $b_{n}=\frac{1}{n}-\frac{2\operatorname{sen}\frac{n\pi}{2}}{\pi n^{2}}$:
              vale $\frac1n$ si $n$ es par y $\frac1n\mp\frac{2}{\pi n^{2}}$ si es
              impar.
          - texto: >-
              **d)** $2024\pi\equiv 0$, que es un salto entre $-\frac{\pi}{2}$ y
              $\frac{\pi}{2}$: la serie converge a la media, $0$.
          - texto: >-
              $\frac{201\pi}{2}\equiv\frac{\pi}{2}$, donde $F$ es continua y vale
              $0$: la serie converge también a $0$.
          - texto: >-
              Como $f$ vale cero en la mitad de su intervalo, la mitad de los
              coeficientes también se anula.
            trampa: true
            mensaje: |
              Que el integrando se anule en un trozo **no** anula ningún
              coeficiente: lo único que hace es acortar la integral. De hecho
              aquí ningún $b_{n}$ es cero — para $n$ par valen $\frac1n$, que es
              lo más grande que llegan a valer.

    resolucion: |
      **a) La ampliación impar.** Impar significa $F(-t)=-F(t)$, y periódica de
      periodo $2\pi$:

      $$
      F(t)=
      \begin{cases}
      \frac{\pi}{2}-t & 0<t\le\frac{\pi}{2}\\[4pt]
      0 & \frac{\pi}{2}<t\le\pi\\[4pt]
      0 & -\pi<t\le-\frac{\pi}{2}\\[4pt]
      -\frac{\pi}{2}-t & -\frac{\pi}{2}<t<0
      \end{cases}
      $$

      y $F(t+2\pi)=F(t)$. En $t=0$ y en los múltiplos pares de $\pi$ hay un
      salto, de $-\frac{\pi}{2}$ a $\frac{\pi}{2}$, y allí se toma $F=0$ por
      imparidad.

      **b) El dibujo.**

      <figure class="figura-examen">
      <svg viewBox="0 0 460 245" role="img" width="460" height="245"
           aria-labelledby="ap24-t ap24-d">
        <title id="ap24-t">La ampliacion impar y periodica F</title>
        <desc id="ap24-d">En cada periodo de dos pi la funcion arranca en pi medios
        justo a la derecha de los multiplos pares de pi, baja en linea recta hasta
        cero al llegar a pi medios, se queda en cero hasta pi, sigue en cero hasta
        menos pi medios del periodo siguiente y baja de nuevo hasta menos pi medios
        justo antes del multiplo par de pi. En cada multiplo par de pi hay un salto de
        menos pi medios a mas pi medios, y el valor de la funcion alli es cero.</desc>
