      perpendicularmente: esa es la traducción geométrica de «seguir el
      gradiente», y es la comprobación que se puede hacer a ojo sobre el dibujo.

      **Un control.** El punto $S$ tiene que estar sobre la elipse donde la
      superficie corta al plano, $\frac{x^{2}}{10}+\frac{y^{2}}{5}=1$. Y lo está:
      $\frac{2}{10}+\frac{4}{5}=1$.

  - id: ex2324-ord-7-el-prisma-de-tapa-parabolica
    titulo: Un prisma con la tapa curva, y los dos órdenes de integración
    fuente: >-
      Ejercicio 2 del SEGUNDO PARCIAL · Convocatoria ordinaria, 10 de junio de 2024 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea $S$ el sólido definido por las condiciones
      $0\le z\le 1+(y-1)^{2}$, $0\le y\le 1$, $0\le x\le 4$.

      a) Dibujar el sólido $S$.

      b) Especificar, sin calcular, cuáles son los límites de integración de las
      siguientes dos integrales para el cálculo del volumen $V$ de $S$:

      $$
      V=\int\left(\int\left(\int dz\right)dy\right)dx
      \qquad
      V=\int\left(\int\left(\int dy\right)dz\right)dx
      $$

      c) Calcular el volumen $V$ utilizando cualquiera de los órdenes de
      integración.
    pide: El dibujo, los límites en los dos órdenes y el volumen.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué forma tiene la sección del sólido por un plano $x=$ constante?
        opciones:
          - texto: >-
              La región bajo la parábola $z=1+(y-1)^{2}$ entre $y=0$ y $y=1$:
              alta $2$ en el borde izquierdo y baja $1$ en el derecho
            correcta: true
            mensaje: |
              Eso es. La parábola tiene el vértice en $y=1$, con valor $1$, y
              sube hacia la izquierda hasta $2$ en $y=0$. Como la sección no
              depende de $x$, el sólido es un **prisma** de cuatro unidades de
              largo.
          - texto: >-
              Un rectángulo de $1\times 2$
            mensaje: |
              La tapa no es plana: $z$ llega hasta $1+(y-1)^{2}$, que vale $2$ en
              $y=0$ y $1$ en $y=1$. El rectángulo sería el caso $z\le 2$.
          - texto: >-
              Media parábola con el vértice en el origen
            mensaje: |
              El vértice está en $(y,z)=(1,1)$, no en el origen, y la región es
              lo que queda **debajo** de la curva, no la curva.

      - tipo: calcular
        titulo: El límite que cambia
        pregunta: |
          En el segundo orden, $dy\,dz\,dx$, la integral se parte en dos tramos
          de $z$. ¿En qué valor de $z$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              $z=2$ es la altura máxima del sólido, no donde cambia la
              descripción. Por debajo de $z=1$ la franja ocupa todo el intervalo
              $0\le y\le 1$; por encima, solo una parte.
          - valor: '0.5'
            mensaje: |
              El valor donde cambia es el mínimo de la tapa,
              $1+(y-1)^{2}$, que se alcanza en $y=1$ y vale $1$.
          - valor: '4'
            mensaje: |
              $4$ es la longitud en la dirección $x$, que no interviene: la
              sección es la misma para todo $x$.
        pista: |
          ¿Hasta qué altura llega el sólido en **todos** los puntos de
          $0\le y\le 1$?
        desarrollo: |
          La tapa $z=1+(y-1)^{2}$ vale $1$ en su punto más bajo, $y=1$, y $2$ en
          el más alto, $y=0$. Por tanto:

          - para $0\le z\le 1$ la franja horizontal ocupa **todo** el intervalo
            $0\le y\le 1$;
          - para $1\le z\le 2$ solo la parte donde $1+(y-1)^{2}\ge z$, es decir
            $y\le 1-\sqrt{z-1}$.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen de $S$?
        respuesta:
          tipo: numero
          valor: '5.3333333'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '8'
            mensaje: |
              Ese es el volumen del prisma de sección rectangular $1\times 2$,
              $4\cdot 1\cdot 2$. La tapa baja hasta $1$, así que el sólido tiene
              menos.
          - valor: '4'
            mensaje: |
              Ese sería el volumen si la tapa fuera plana a altura $1$. El
              abombamiento añade $\frac43$.
          - valor: '1.3333333'
            mensaje: |
              Ese es el área de la sección, $\int_{0}^{1}\left[1+(y-1)^{2}\right]dy
              =\frac43$. Falta multiplicar por la longitud, $4$.
        pista: |
          Como la sección no depende de $x$, el volumen es el área de la sección
          por la longitud.
        desarrollo: |
          $$
          V=\int_{0}^{4}\!\!\int_{0}^{1}\!\!\int_{0}^{1+(y-1)^{2}}dz\,dy\,dx
          =4\int_{0}^{1}\left[1+(y-1)^{2}\right]dy
          $$

          $$
          =4\left[y+\frac{(y-1)^{3}}{3}\right]_{0}^{1}
          =4\left(1+\frac13\right)=\frac{16}{3}\approx 5{,}3333
          $$

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              **a)** La sección por cualquier plano $x=$ cte es la misma: la
              región bajo la parábola $z=1+(y-1)^{2}$ con $0\le y\le 1$. El
              sólido es un prisma de longitud $4$.
          - texto: >-
              **b)** Primer orden:
              $V=\int_{0}^{4}\int_{0}^{1}\int_{0}^{1+(y-1)^{2}}dz\,dy\,dx$, sin
              partir nada.
          - texto: >-
              Segundo orden: hay que partir en $z=1$, porque hasta esa altura la
              franja ocupa todo $0\le y\le 1$ y por encima solo
              $0\le y\le 1-\sqrt{z-1}$.
          - texto: >-
              Es decir,
              $V=\int_{0}^{4}\left[\int_{0}^{1}\int_{0}^{1}dy\,dz
              +\int_{1}^{2}\int_{0}^{1-\sqrt{z-1}}dy\,dz\right]dx$.
          - texto: >-
              **c)** Con el primer orden, $V=4\int_{0}^{1}\left[1+(y-1)^{2}\right]dy
              =\frac{16}{3}$.
          - texto: >-
              Y con el segundo sale lo mismo:
              $4\left[1+\int_{1}^{2}\left(1-\sqrt{z-1}\right)dz\right]
              =4\left(1+\frac13\right)=\frac{16}{3}$.
          - texto: >-
              Como el sólido está definido por tres desigualdades, los dos
              órdenes dan seis límites constantes y ninguno de los dos necesita
              partirse.
            trampa: true
            mensaje: |
              La primera desigualdad **no** es constante: el techo depende de
              $y$. Con el orden $dz\,dy\,dx$ eso no molesta —la variable que
              depende va la primera—, pero con $dy\,dz\,dx$ hay que despejar $y$
              de la tapa, y ahí aparece la raíz y la partición en $z=1$. Ese es
              justo el contenido del apartado b).

    resolucion: |
      **a) El sólido.**

