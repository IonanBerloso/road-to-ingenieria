        <g class="ap24-n">
          <text x="137" y="188" text-anchor="middle">−2π</text>
          <text x="181" y="188" text-anchor="middle">−π</text>
          <text x="269" y="188" text-anchor="middle">π</text>
          <text x="313" y="188" text-anchor="middle">2π</text>
          <text x="216" y="109" text-anchor="end">π/2</text>
          <text x="216" y="179" text-anchor="end">−π/2</text>
          <text x="347.8" y="154">t</text>
        </g>
        <text class="ap24-et" x="252.3" y="96.6">F(t)</text>
      </svg>
      <figcaption>
      Figura nuestra: el apartado b) pide dibujarla y el examen no trae ninguna.
      Los circulitos huecos son los extremos que la función no alcanza; el
      relleno, el valor 0 que toma en el salto.
      </figcaption>
      </figure>

      **c) La serie.** Al ser $F$ impar, todos los $a_{n}$ se anulan y quedan
      solo senos:

      $$
      b_{n}=\frac{2}{\pi}\int_{0}^{\pi}F(t)\operatorname{sen}(nt)\,dt
      =\frac{2}{\pi}\int_{0}^{\pi/2}
      \left(\frac{\pi}{2}-t\right)\operatorname{sen}(nt)\,dt
      $$

      —el segundo tramo no aporta porque el integrando es cero—. Integrando por
      partes con $u=\frac\pi2-t$:

      $$
      \int_{0}^{\pi/2}\left(\frac{\pi}{2}-t\right)\operatorname{sen}(nt)\,dt
      =\frac{\pi}{2n}-\frac{\operatorname{sen}\frac{n\pi}{2}}{n^{2}}
      $$

      $$
      b_{n}=\frac{1}{n}-\frac{2\operatorname{sen}\frac{n\pi}{2}}{\pi n^{2}}
      $$

      Para $n$ par el seno se anula y queda $b_{n}=\frac1n$; para $n$ impar hay
      que restar o sumar $\frac{2}{\pi n^{2}}$ según el signo de
      $\operatorname{sen}\frac{n\pi}{2}$.

      $$
      S(t)=\sum_{n=1}^{\infty}
      \left(\frac{1}{n}-\frac{2\operatorname{sen}\frac{n\pi}{2}}{\pi n^{2}}\right)
      \operatorname{sen}(nt)
      $$

      **d) Los dos puntos.** Lo primero, reducir módulo $2\pi$.

      $2024\pi=1012\cdot 2\pi\equiv 0$. Ahí hay un **salto**: por la derecha
      $F\to\frac{\pi}{2}$ y por la izquierda $F\to-\frac{\pi}{2}$. El teorema de
      Dirichlet da la media:

      $$
      S(2024\pi)=0
      $$

      y $F(2024\pi)=0$ también, por el convenio de imparidad.

      $\frac{201\pi}{2}=100\pi+\frac{\pi}{2}\equiv\frac{\pi}{2}$. Ahí $F$ es
      **continua** —los dos trozos empalman en cero— y vale $0$, así que

      $$
      S\left(\frac{201\pi}{2}\right)=F\left(\frac{201\pi}{2}\right)=0
      $$

      **Los dos valen cero, pero por razones distintas**, y eso es exactamente lo
      que el «justificando la respuesta» pide: en el primero porque la serie
      promedia un salto, y en el segundo porque la función es continua y vale
      cero.
