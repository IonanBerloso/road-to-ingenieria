      macizo y afilado en los dos extremos.
      </figcaption>
      </figure>

      ### 5 · El radio y la integral

      El eje de giro es $y=1$, que **es el borde inferior del recinto**. Así que
      el sólido es **macizo**: cada corte es un disco lleno, sin hueco.

      $$
      \text{radio} = 2\,\mathrm{sen}\,x-1
      $$

      $$
      V = \pi\int_{\pi/6}^{5\pi/6}\left(2\,\mathrm{sen}\,x-1\right)^{2}dx
      $$

      **Girar alrededor de $y=1$ en vez de $y=0$ solo cambia el radio.** Los
      límites de integración son los mismos: dependen de dónde está el recinto,
      no del eje.

      ### 6 · Calcular

      $$
      \left(2\,\mathrm{sen}\,x-1\right)^{2}
      = 4\,\mathrm{sen}^{2}x-4\,\mathrm{sen}\,x+1
      $$

      Con $\mathrm{sen}^{2}x = \frac{1-\cos2x}{2}$:

      $$
      = 2-2\cos2x-4\,\mathrm{sen}\,x+1 = 3-2\cos2x-4\,\mathrm{sen}\,x
      $$

      $$
      \int\left(3-2\cos2x-4\,\mathrm{sen}\,x\right)dx
      = 3x-\mathrm{sen}\,2x+4\cos x
      $$

      **En $x = \frac{5\pi}{6}$**, con
      $\mathrm{sen}\frac{5\pi}{3} = -\frac{\sqrt3}{2}$ y
      $\cos\frac{5\pi}{6} = -\frac{\sqrt3}{2}$:

      $$
      \frac{5\pi}{2}+\frac{\sqrt3}{2}-2\sqrt3
      = \frac{5\pi}{2}-\frac{3\sqrt3}{2}
      $$

      **En $x = \frac{\pi}{6}$**, con
      $\mathrm{sen}\frac{\pi}{3} = \frac{\sqrt3}{2}$ y
      $\cos\frac{\pi}{6} = \frac{\sqrt3}{2}$:

      $$
      \frac{\pi}{2}-\frac{\sqrt3}{2}+2\sqrt3
      = \frac{\pi}{2}+\frac{3\sqrt3}{2}
      $$

      **La diferencia:**

      $$
      \left(\frac{5\pi}{2}-\frac{3\sqrt3}{2}\right)
      -\left(\frac{\pi}{2}+\frac{3\sqrt3}{2}\right)
      = 2\pi-3\sqrt3
      $$

      $$
      \boxed{V = \pi\left(2\pi-3\sqrt3\right) = 2\pi^{2}-3\sqrt3\,\pi
      \approx 3{,}4150}
      $$

      ### 7 · Comprobación de (b)

      **Que el resultado es positivo**, y por poco:

      $$
      2\pi = 6{,}2832,
      \qquad
      3\sqrt3 = 5{,}1962
      $$

      $$
      2\pi-3\sqrt3 = 1{,}0870 > 0 \quad\checkmark
      $$

      **Por acotación.** El sólido cabe dentro del cilindro de radio 1 —el
      máximo de $2\,\mathrm{sen}\,x-1$, alcanzado en $x=\frac{\pi}{2}$— y
      longitud $\frac{2\pi}{3}$:

      $$
      \pi\cdot1^{2}\cdot\frac{2\pi}{3} = \frac{2\pi^{2}}{3} \approx 6{,}58
      $$

      $$
      3{,}42 < 6{,}58 \quad\checkmark
      $$

      Ocupa el 52 % del cilindro, coherente con un cuerpo que se afila hasta un
      punto en los dos extremos.

      **En el centro.** En $x = \frac{\pi}{2}$ el radio vale
      $2-1 = 1$, el mayor posible ✔ Y en $x = \frac{\pi}{6}$ y
      $x = \frac{5\pi}{6}$ vale 0: el sólido acaba en punta ✔

      **Numérica.** Sumando cien discos entre $\frac{\pi}{6}$ y
      $\frac{5\pi}{6}$ sale $3{,}4148$, frente a los $3{,}4150$ exactos ✔
