          <text x="256" y="320">2</text>
          <text x="436" y="320">3</text>
          <text x="52" y="146">1</text>
          <text x="40" y="186">3/4</text>
          <text x="40" y="226">1/2</text>
          <text x="452" y="292">x</text>
        </g>
        <g fill="var(--d1)" font-size="13" font-family="var(--mono)">
          <text x="290" y="132">y(x)</text>
        </g>
        <g fill="var(--live)" font-size="13" font-family="var(--mono)">
          <text x="330" y="214">ȳ(x)</text>
        </g>
      </svg>
      <figcaption>
      Figura nuestra. En azul de trazos la funcion original y en verde su
      funcion valor medio. El punto rojo marca x igual a dos, donde la verde
      cambia de recta a curva sin romper la pendiente.
      </figcaption>
      </figure>

      ### 6 · Apartado (c)

      $$
      \overline y\!\left(\tfrac32\right) = \frac{\frac32-1}{2} = \frac14
      $$

      $$
      \boxed{\text{El valor medio de } y \text{ en }
      \left[1,\tfrac32\right] \text{ es } \frac14 = 0{,}25}
      $$

      **Directamente**, sin la fórmula del apartado (a):

      $$
      \frac{1}{\frac32-1}\int_1^{3/2}(t-1)\,dt
      = 2\cdot\frac{(1/2)^{2}}{2} = 2\cdot\frac18 = \frac14 \quad\checkmark
      $$

      ### 7 · Comprobación

      **En un tramo lineal, el valor medio es la media de los extremos:**

      $$
      \frac{y(1)+y\left(\frac32\right)}{2} = \frac{0+0{,}5}{2} = 0{,}25
      \quad\checkmark
      $$

      **El valor medio total:**

      $$
      \overline y(3) = \frac{3-\frac32}{3-1} = \frac{3/2}{2} = \frac34
      $$

      y por áreas: triángulo $\frac12$ más rectángulo $1$, dividido entre 2:
      $\frac{1{,}5}{2} = 0{,}75$ ✔

      **Cotas.** Todo valor medio de $y$ tiene que estar entre su mínimo y su
      máximo:

      $$
      0 \le \overline y(x) \le 1 \quad\text{para todo } x \quad\checkmark
      $$

      Y en efecto $\overline y$ crece de 0 a $0{,}75$ sin llegar nunca a 1: no
      puede, porque siempre arrastra el tramo inicial donde $y$ vale poco.

  - id: ex1516-3ev-3-punto-fijo-con-unicidad
    titulo: El teorema del punto fijo, existencia y unicidad
    fuente: >-
      Ejercicio 3 · Tercera evaluación, 13 de enero de 2016 · Cálculo
      (Industriales), UPV/EHU · Una versión de la misma pregunta cayó en la
      tercera evaluación de 2017-2018 · El examen no publica solución: la
      demostración es propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 2
      comp4: 8

    enunciado: |
      Enunciar y demostrar el Teorema del Punto Fijo (existencia **y**
      unicidad).
    pide: Enunciar y demostrar las dos partes.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué teorema previo da la **existencia**, y cuál la **unicidad**?
        opciones:
          - texto: >-
              **Bolzano** la existencia y el **teorema del valor medio de
              Lagrange** la unicidad
            correcta: true
            mensaje: |
              Exacto. Y son dos herramientas distintas para dos afirmaciones
              distintas: una construye la solución y la otra impide que haya
              dos.
          - texto: >-
              Los dos salen de Bolzano
            mensaje: |
              Bolzano garantiza que hay **al menos** un cero, nunca que sea
              único. Para la unicidad hace falta controlar la pendiente.
          - texto: >-
              Weierstrass la existencia y Rolle la unicidad
            mensaje: |
              Weierstrass da máximos y mínimos, que no tienen por qué ser puntos
              fijos.
          - texto: >-
              La existencia se demuestra por iteración y la unicidad por
              inducción
            mensaje: |
              La iteración es el método **numérico** para aproximar el punto
              fijo, y de hecho converge; pero la demostración clásica en este
              curso es la de Bolzano.

      - tipo: calcular
        titulo: Una contracción concreta
        pregunta: |
          Con $f(x) = \frac{x}{4}+3$ en $[3,5]$, ¿cuál es el punto fijo?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              $f(3) = 3{,}75 \neq 3$. El punto fijo está en el interior del
              intervalo.
          - valor: '3.75'
            mensaje: |
              $3{,}75$ es $f(3)$, la imagen del extremo izquierdo, no el punto
              fijo.
          - valor: '12'
            mensaje: |
              12 saldría de resolver $x = \frac x4+3$ multiplicando mal:
              $\frac{3x}{4} = 3$ da $x=4$.
        pista: |
          Resuelve $x = \frac x4+3$, y comprueba antes que
          $f\left([3,5]\right)\subseteq[3,5]$.
        desarrollo: |
          **La hipótesis, primero.** $f$ es creciente, así que

          $$
          f\left([3,5]\right) = \left[f(3),f(5)\right]
          = \left[3{,}75;\ 4{,}25\right] \subseteq [3,5] \quad\checkmark
          $$

          **El punto fijo:**

          $$
          x = \frac x4+3
          \;\Longrightarrow\;
          \frac{3x}{4} = 3
          \;\Longrightarrow\;
          x = 4
          $$

          **Y es único**, porque
          $\left\lvert f'(x)\right\rvert = \frac14 < 1$: es una contracción.
        veredicto: |
          Con $k=\frac14$, iterar desde cualquier punto converge muy deprisa:
          cada paso divide el error entre 4.

      - tipo: justificar
        pregunta: |
          Ordena la demostración de la **unicidad**. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **Suponer dos puntos fijos** distintos: $p \neq q$ con $f(p)=p$ y
              $f(q)=q$.
          - texto: |
              **Aplicar el teorema del valor medio** a $f$ en el intervalo de
              extremos $p$ y $q$: existe $\xi$ entre ellos con
              $f(p)-f(q) = f'(\xi)\left(p-q\right)$.
          - texto: |
              **Sustituir los puntos fijos:** el primer miembro es $p-q$, luego
              $p-q = f'(\xi)\left(p-q\right)$.
          - texto: |
              **Tomar valores absolutos y usar la hipótesis**
              $\left\lvert f'\right\rvert \le k < 1$:
              $\left\lvert p-q\right\rvert \le k\left\lvert p-q\right\rvert
              < \left\lvert p-q\right\rvert$.
          - texto: |
              **Contradicción:** un número positivo no puede ser menor que sí
              mismo. Luego $p=q$. $\blacksquare$
          - texto: |
              La unicidad también se sigue de Bolzano, porque el cero de una
              función continua es único.
            trampa: true
            mensaje: |
              Bolzano garantiza **al menos** un cero, nunca la unicidad: una
              continua puede cruzar el eje muchas veces. El contraejemplo del
              propio teorema es $f(x)=\sqrt x$ en $[0,1]$, que cumple todas las
              hipótesis de existencia y tiene **dos** puntos fijos, 0 y 1. Sin
              la condición sobre $f'$ no hay unicidad.
        veredicto: |
          La contradicción sale de dividir entre $\left\lvert p-q\right\rvert$,
          que es legítimo **porque se ha supuesto $p\neq q$**. Ese detalle es la
          bisagra del argumento.

    resolucion: |
      **Lo que se pide.** Dos puntos por el enunciado y ocho por la
      demostración, que tiene dos mitades.

      ### 1 · El enunciado

      > **Teorema del punto fijo.** Sea $f:[a,b]\to\mathbb{R}$ **continua** con
      > $f\left([a,b]\right) \subseteq [a,b]$. Entonces:
      >
      > **(existencia)** Existe al menos un $c \in [a,b]$ con $f(c)=c$.
      >
      > **(unicidad)** Si además $f$ es derivable en $(a,b)$ y existe $k<1$ con
      > $\left\lvert f'(x)\right\rvert \le k$ para todo $x \in (a,b)$, ese punto
      > fijo es **único**.

      **Las hipótesis, una por una:**

      | hipótesis | para qué |
      |---|---|
      | $f$ continua | existencia (Bolzano) |
      | $f\left([a,b]\right)\subseteq[a,b]$ | existencia: fija los signos en los extremos |
      | $\left\lvert f'\right\rvert \le k<1$ | **solo** unicidad |

      ### 2 · Existencia

      **La idea:** convertir «$f(x)=x$» en «$g(x)=0$» y usar Bolzano.

      $$
      g(x) = f(x)-x
      $$

      continua en $[a,b]$ por serlo $f$.

      **En el extremo izquierdo.** Como $f(a) \in [a,b]$, se tiene
      $f(a)\ge a$:

      $$
      g(a) = f(a)-a \ge 0
      $$

      **En el derecho.** Como $f(b) \in [a,b]$, se tiene $f(b)\le b$:

      $$
      g(b) = f(b)-b \le 0
      $$

      **Dos casos.** Si $g(a)=0$ o $g(b)=0$, el punto fijo es $a$ o $b$ y hemos
      terminado. Si no, $g(a)>0>g(b)$ y el **teorema de Bolzano** da
      $c \in (a,b)$ con

      $$
      g(c) = 0
      \;\Longleftrightarrow\;
      \boxed{f(c) = c}
      $$

      ### 3 · Unicidad

      **Por reducción al absurdo.** Supongamos dos puntos fijos distintos,
      $p \neq q$, con $f(p)=p$ y $f(q)=q$.

      Como $f$ es continua en $[p,q]$ y derivable en $(p,q)$, el **teorema del
      valor medio de Lagrange** da un $\xi$ entre ellos con

      $$
      f(p)-f(q) = f'(\xi)\left(p-q\right)
      $$

      Y como son puntos fijos, el primer miembro es $p-q$:

      $$
      p-q = f'(\xi)\left(p-q\right)
      $$

      Tomando valores absolutos y usando la hipótesis:

      $$
      \left\lvert p-q\right\rvert
      = \left\lvert f'(\xi)\right\rvert\left\lvert p-q\right\rvert
      \le k\left\lvert p-q\right\rvert
      $$

      Y como $p\neq q$, se puede **dividir** entre
      $\left\lvert p-q\right\rvert>0$:

      $$
      1 \le k < 1
      $$

      **Contradicción.** Luego $p=q$ y el punto fijo es único. $\blacksquare$

      ### 4 · Sin la condición sobre la derivada no hay unicidad

      $f(x) = \sqrt x$ en $[0,1]$:

      - es continua ✔
      - $f\left([0,1]\right) = [0,1]$ ✔

      así que **existe** punto fijo. Pero hay **dos**: $x=0$ y $x=1$.

      ¿Por qué falla? Porque

      $$
      f'(x) = \frac{1}{2\sqrt x} \xrightarrow[x\to0^{+}]{} +\infty
      $$

      No hay ningún $k<1$ que acote la derivada en todo el intervalo. La
      hipótesis de unicidad no se cumple, y el resultado tampoco.

      ### 5 · La versión sin derivadas

      Conviene mencionar que la unicidad no necesita que $f$ sea derivable.
      Basta con que sea **contractiva**:

      $$
      \left\lvert f(x)-f(y)\right\rvert \le k\left\lvert x-y\right\rvert,
      \qquad k<1
      $$

      La demostración es la misma sin el paso de Lagrange:

      $$
      \left\lvert p-q\right\rvert = \left\lvert f(p)-f(q)\right\rvert
      \le k\left\lvert p-q\right\rvert
      $$

      Y esta versión es la que se generaliza —el teorema de la aplicación
      contractiva de Banach— y la que sostiene los métodos numéricos de punto
      fijo.

      ### 6 · Para qué sirve

      El teorema no solo dice que la solución existe: **da un método para
      encontrarla**. Iterando $x_{n+1} = f(x_n)$ desde cualquier punto de
      partida,

      $$
      \left\lvert x_n-c\right\rvert \le k^{n}\left\lvert x_0-c\right\rvert
      \xrightarrow[n\to\infty]{} 0
      $$

      El error se multiplica por $k$ en cada paso.

      ### 7 · Comprobación con un caso concreto

      $f(x) = \frac x4+3$ en $[3,5]$:

      **Hipótesis.** Es creciente, así que
      $f\left([3,5]\right) = [3{,}75;\ 4{,}25] \subseteq [3,5]$ ✔ Y
      $\left\lvert f'\right\rvert = \frac14 < 1$ ✔

      **El punto fijo:** $x = \frac x4+3$ da $x=4$, que está en el interior ✔

      **La iteración**, empezando en $x_0 = 5$:

      | $n$ | $x_n$ | error |
      |---|---|---|
      | 0 | $5$ | $1$ |
      | 1 | $4{,}25$ | $0{,}25$ |
      | 2 | $4{,}0625$ | $0{,}0625$ |
      | 3 | $4{,}015625$ | $0{,}015625$ |

      El error se divide entre 4 en cada paso, exactamente como predice
      $k = \frac14$ ✔

  - id: ex1516-3ev-4-inversa-del-coseno-hiperbolico
    titulo: Invertir un coseno hiperbólico y derivar la inversa
    fuente: >-
      Ejercicio 4 · Tercera evaluación, 13 de enero de 2016 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3

    enunciado: |
      Calcular la función inversa $x(y)$ de la función
      $y(x) = \dfrac{\mathrm{e}^{2x}+\mathrm{e}^{-2x}}{2}$ en el dominio
      $D = [0,\infty)$, especificando el dominio $R$ de dicha función inversa.
      Calcular $\dfrac{dx}{dy}$, expresando el resultado tanto en función de $x$
      como en función de $y$.
    pide: Calcular la inversa, su dominio y su derivada de las dos formas.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué función es $y(x)$, y por qué el enunciado restringe a
          $D = [0,\infty)$?
        opciones:
          - texto: >-
              Es $\mathrm{ch}(2x)$, que es **par**: en todo $\mathbb{R}$ no sería
              inyectiva y no tendría inversa
            correcta: true
            mensaje: |
              Exacto. $\mathrm{ch}$ es par, así que $y(-x) = y(x)$ y en todo
              $\mathbb{R}$ hay dos preimágenes por cada valor. Restringir a
              $x\ge0$ la hace inyectiva.
          - texto: >-
              Es $\mathrm{sh}(2x)$, que solo está definida para $x\ge0$
            mensaje: |
              El seno hiperbólico es la **resta** de exponenciales y está
              definido en todo $\mathbb{R}$. Aquí hay una suma: es el coseno.
          - texto: >-
              Es $\mathrm{e}^{2x}$ y el dominio evita los valores negativos
            mensaje: |
              Falta el $\mathrm{e}^{-2x}$ y el $\frac12$. Y la exponencial es
              inyectiva en todo $\mathbb{R}$: no haría falta restringir.
          - texto: >-
              Se restringe para que $y$ sea positiva
            mensaje: |
              $\mathrm{ch}$ ya es positiva en todo $\mathbb{R}$ —vale al menos
              1—. La restricción es por la inyectividad.

      - tipo: calcular
        titulo: El extremo del recorrido
        pregunta: |
          El dominio de la inversa es $R = [m,\infty)$. ¿Cuánto vale $m$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              0 sería el mínimo si $y$ fuera $\mathrm{sh}$. El coseno
              hiperbólico vale $\frac{1+1}{2} = 1$ en $x=0$ y nunca baja de
              ahí.
          - valor: '2'
            mensaje: |
              2 es $\mathrm{e}^{0}+\mathrm{e}^{0}$ sin dividir entre 2.
          - valor: '0.5'
            mensaje: |
              $0{,}5$ sería $\frac{1}{2}$ con solo una exponencial. Hay dos, y
              en $x=0$ las dos valen 1.
        pista: |
          $y$ es creciente en $[0,\infty)$. ¿Cuánto vale en $x=0$?
        desarrollo: |
          $$
          y(x) = \frac{\mathrm{e}^{2x}+\mathrm{e}^{-2x}}{2} = \mathrm{ch}(2x)
          $$

          $$
          y'(x) = \mathrm{e}^{2x}-\mathrm{e}^{-2x} = 2\,\mathrm{sh}(2x)
          $$

          que es $\ge0$ en $[0,\infty)$ y solo se anula en $x=0$: **$y$ es
          estrictamente creciente** ahí.

          $$
          y(0) = \frac{1+1}{2} = 1,
          \qquad
          \lim_{x\to\infty}y(x) = +\infty
          $$

          $$
          R = \left[1,\infty\right)
          $$
        veredicto: |
          Que $y$ sea creciente en $[0,\infty)$ es lo que garantiza la
          inyectividad, y el recorrido es lo que hay entre sus dos valores
          extremos.

      - tipo: calcular
        titulo: La derivada de la inversa
        pregunta: |
          ¿Cuánto vale $\frac{dx}{dy}$ en $y=2$? Da cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.2887'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '3.4641'
            mensaje: |
              $2\sqrt3$ es $\frac{dy}{dx}$ en ese punto, no su inverso. La
              derivada de la inversa es el **recíproco**.
          - valor: '0.5774'
            mensaje: |
              $\frac{1}{\sqrt3}$ olvida el factor 2 del denominador:
              $\frac{dx}{dy} = \frac{1}{2\sqrt{y^{2}-1}}$.
          - valor: '0.1443'
            mensaje: |
              $0{,}1443$ divide una vez de más entre 2.
        pista: |
          $\frac{dx}{dy} = \frac{1}{2\sqrt{y^{2}-1}}$, y $\sqrt3 = 1{,}7321$.
        desarrollo: |
          $$
          \frac{dx}{dy} = \frac{1}{2\sqrt{y^{2}-1}}
          $$

          En $y=2$:

          $$
          \frac{1}{2\sqrt{4-1}} = \frac{1}{2\sqrt3} = \frac{1}{3{,}4641}
          = 0{,}2887
          $$

          **Comprobación:** en ese punto $\mathrm{ch}(2x)=2$, luego
          $\mathrm{sh}(2x) = \sqrt3$ y

          $$
          \frac{dy}{dx} = 2\sqrt3 = 3{,}4641
          $$

          El producto de las dos derivadas vale 1 ✔
        veredicto: |
          Que $\frac{dx}{dy}\cdot\frac{dy}{dx} = 1$ es la comprobación de un
          segundo, y detecta cualquier factor perdido.

      - tipo: justificar
        pregunta: |
          Ordena el cálculo de la inversa. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Reconocer la función:**
              $y = \frac{\mathrm{e}^{2x}+\mathrm{e}^{-2x}}{2}
              = \mathrm{ch}(2x)$, par y por tanto no inyectiva en
              $\mathbb{R}$.
          - texto: |
              **Multiplicar por $2\mathrm{e}^{2x}$** para quitar el exponente
              negativo: con $u = \mathrm{e}^{2x}$ queda
              $u^{2}-2yu+1 = 0$.
          - texto: |
              **Resolver:** $u = y\pm\sqrt{y^{2}-1}$. Y como $x\ge0$ implica
              $u = \mathrm{e}^{2x} \ge 1$, hay que **quedarse con el signo
              más**.
          - texto: |
              **Despejar $x$:**
              $x = \frac12\ln\left(y+\sqrt{y^{2}-1}\right)$, para
              $y \in [1,\infty)$.
          - texto: |
              **La derivada:** $\frac{dx}{dy} = \frac{1}{2\,\mathrm{sh}(2x)}$
              en función de $x$, y
              $\frac{1}{2\sqrt{y^{2}-1}}$ en función de $y$.
          - texto: |
              Los dos signos de la raíz dan las dos ramas de la inversa, y las
              dos son válidas.
            trampa: true
            mensaje: |
              Solo una es válida: el enunciado **ya ha restringido** el dominio
              a $x\ge0$, y eso obliga a $\mathrm{e}^{2x}\ge1$, es decir al signo
              más. El signo menos da $u = y-\sqrt{y^{2}-1} \le 1$, que
              corresponde a la rama $x\le0$: la que se ha descartado
              precisamente para que la inversa exista. Admitir las dos sería
              deshacer la restricción.
        veredicto: |
          Los dos signos de la raíz son las dos mitades de la parábola
          hiperbólica. Elegir uno **es** la restricción del dominio, escrita en
          la fórmula.

    resolucion: |
      **Datos.**
      $y(x) = \frac{\mathrm{e}^{2x}+\mathrm{e}^{-2x}}{2}$ en
      $D = [0,\infty)$.

      ### 1 · Qué función es

      $$
      y(x) = \mathrm{ch}(2x)
      $$

      el **coseno hiperbólico** del doble. Y es **par**:

      $$
      y(-x) = \frac{\mathrm{e}^{-2x}+\mathrm{e}^{2x}}{2} = y(x)
      $$

      Por eso el enunciado restringe a $x\ge0$: en todo $\mathbb{R}$ cada valor
      tendría **dos** preimágenes y no habría inversa.

      ### 2 · El recorrido $R$

      $$
      y'(x) = \mathrm{e}^{2x}-\mathrm{e}^{-2x} = 2\,\mathrm{sh}(2x)
      $$

      En $[0,\infty)$ esto es $\ge0$, y solo se anula en $x=0$: **$y$ es
      estrictamente creciente**, luego inyectiva.

      $$
      y(0) = 1,
      \qquad
      \lim_{x\to+\infty}y(x) = +\infty
      $$

      $$
      \boxed{R = [1,\infty)}
      $$

      ### 3 · Despejar la inversa

      El truco es quitar el exponente negativo. Multiplicando por
      $2\,\mathrm{e}^{2x}$:

      $$
      2y\,\mathrm{e}^{2x} = \mathrm{e}^{4x}+1
      $$

      Con $u = \mathrm{e}^{2x}$, queda una ecuación de segundo grado:

      $$
      u^{2}-2yu+1 = 0
      \;\Longrightarrow\;
      u = \frac{2y\pm\sqrt{4y^{2}-4}}{2} = y\pm\sqrt{y^{2}-1}
      $$

      **Cuál de los dos signos.** Como $x\ge0$:

      $$
      u = \mathrm{e}^{2x} \ge 1
      $$

      Y de las dos raíces, $y-\sqrt{y^{2}-1} \le 1$ mientras que
      $y+\sqrt{y^{2}-1} \ge 1$. Hay que quedarse con el **signo más**.

      —De hecho las dos raíces son inversas entre sí: su producto vale 1, por
      Vieta. La descartada corresponde a la rama $x \le 0$—.

      $$
      \mathrm{e}^{2x} = y+\sqrt{y^{2}-1}
      $$

      $$
      \boxed{x(y) = \frac12\ln\left(y+\sqrt{y^{2}-1}\right),
      \qquad y \in [1,\infty)}
      $$

      que es $\frac12\,\mathrm{argch}\,y$.

      ### 4 · La derivada, en función de $x$

      Por la regla de la derivada de la inversa:

      $$
      \frac{dx}{dy} = \frac{1}{\frac{dy}{dx}}
      $$

      $$
      \boxed{\frac{dx}{dy} = \frac{1}{2\,\mathrm{sh}(2x)}
      = \frac{1}{\mathrm{e}^{2x}-\mathrm{e}^{-2x}}}
      $$

      **Válido para $x>0$.** En $x=0$ el denominador se anula: ahí la inversa
      **no es derivable**, porque la función original tiene tangente horizontal
      y su reflejo tiene tangente vertical.

      ### 5 · La derivada, en función de $y$

      Usando la identidad hiperbólica
      $\mathrm{ch}^{2}-\mathrm{sh}^{2} = 1$:

      $$
      \mathrm{sh}(2x) = \sqrt{\mathrm{ch}^{2}(2x)-1} = \sqrt{y^{2}-1}
      $$

      —con signo **positivo**, porque $x\ge0$ implica $\mathrm{sh}(2x)\ge0$—.

      $$
      \boxed{\frac{dx}{dy} = \frac{1}{2\sqrt{y^{2}-1}},
      \qquad y > 1}
      $$

      ### 6 · Comprobación

      **Derivando directamente la fórmula de $x(y)$:**

      $$
      \frac{dx}{dy} = \frac12\cdot
      \frac{1+\frac{y}{\sqrt{y^{2}-1}}}{y+\sqrt{y^{2}-1}}
      = \frac12\cdot
      \frac{\frac{\sqrt{y^{2}-1}+y}{\sqrt{y^{2}-1}}}{y+\sqrt{y^{2}-1}}
      = \frac{1}{2\sqrt{y^{2}-1}} \quad\checkmark
      $$

      El paréntesis se cancela entero: la fórmula es la misma por los dos
      caminos.

      **Numérica en un punto.** Con $x=1$:

      $$
      y = \mathrm{ch}\,2 = 3{,}7622
      $$

      $$
      \frac{dy}{dx} = 2\,\mathrm{sh}\,2 = 7{,}2537
      $$

      $$
      \frac{dx}{dy} = \frac{1}{2\sqrt{3{,}7622^{2}-1}}
      = \frac{1}{2\sqrt{13{,}154}} = \frac{1}{7{,}2537} = 0{,}13786
      $$

      Y el producto de las dos derivadas vale $1$ ✔

      **De la inversa, comprobando que deshace.** Con $y = 3{,}7622$:

      $$
      x = \frac12\ln\left(3{,}7622+\sqrt{13{,}154}\right)
      = \frac12\ln\left(7{,}3891\right) = \frac12\cdot2 = 1 \quad\checkmark
      $$

      —y $7{,}3891 = \mathrm{e}^{2}$, como debía—.

      **En el borde.** $y=1$ da
      $x = \frac12\ln(1+0) = 0$ ✔ y allí $\frac{dx}{dy}$ se dispara, coherente
      con la tangente vertical.

  - id: ex1516-3ev-5-integral-y-solido-sobre-y-igual-uno
    titulo: Una integral con cambio dado y un sólido alrededor de y = 1
    fuente: >-
      Ejercicio 5 · Tercera evaluación, 13 de enero de 2016 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2

    enunciado: |
      **a)** Resolver la integral:
      $\displaystyle\int_{-1}^{1}\frac{dx}{\left(x^{2}+1\right)^{3/2}}$
      (hacer el cambio $x = \tan z$).

      **b)** Calcular el volumen del sólido de revolución formado al hacer girar
      la región $D = \left\{f(x) \le 2\,\mathrm{sen}\,x,\ g(x) \ge 1,\
      0<x<\pi\right\}$ alrededor del eje $y=1$. Representar el sólido.
    pide: Resolver la integral y calcular el volumen.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el cambio $x = \tan z$ resuelve la integral de (a)?
        opciones:
          - texto: >-
              Porque $x^{2}+1$ se convierte en $\sec^{2}z$, y la potencia
              $\frac32$ deja de ser una raíz
            correcta: true
            mensaje: |
              Exacto. $\left(\sec^{2}z\right)^{3/2} = \sec^{3}z$ sin ninguna
              raíz pendiente —el coseno es positivo en el intervalo del
              cambio—, y con el $\sec^{2}z\,dz$ del diferencial queda
              simplemente $\int\cos z\,dz$.
          - texto: >-
              Porque convierte la integral en racional
            mensaje: |
              La convierte en **trigonométrica**, no en racional. Y en la más
              sencilla posible: la del coseno.
          - texto: >-
              Porque los límites $-1$ y $1$ se vuelven $0$ y $1$
            mensaje: |
              Se vuelven $-\frac{\pi}{4}$ y $\frac{\pi}{4}$. Y eso es una
              consecuencia del cambio, no su motivo.
          - texto: >-
              Porque elimina la potencia fraccionaria del numerador
            mensaje: |
              La potencia fraccionaria está en el **denominador**. El numerador
              es 1.

      - tipo: calcular
        titulo: La integral
        pregunta: |
          ¿Cuánto vale la integral del apartado (a)? Da cuatro decimales.
        respuesta:
          tipo: numero
          valor: '1.4142'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0.7071'
            mensaje: |
              $\frac{\sqrt2}{2}$ es la mitad: solo el tramo de 0 a 1. El
              intervalo es simétrico y hay que contar los dos lados.
          - valor: '1.5708'
            mensaje: |
              $\frac{\pi}{2}$ saldría de $\int_{-1}^{1}\frac{dx}{x^{2}+1}$, sin
              el exponente $\frac32$.
          - valor: '2'
            mensaje: |
              2 es la longitud del intervalo. El integrando es menor que 1 en
              casi todo él, así que la integral tiene que ser menor.
        pista: |
          Con $x=\tan z$ la integral es $\int\cos z\,dz$, y los límites pasan a
          $\mp\frac{\pi}{4}$.
        desarrollo: |
          $$
          x = \tan z,
          \qquad
          dx = \sec^{2}z\,dz,
          \qquad
          x^{2}+1 = \sec^{2}z
          $$

          $$
          \left(x^{2}+1\right)^{3/2} = \sec^{3}z
          $$

          —sin valor absoluto: en $\left(-\frac{\pi}{2},\frac{\pi}{2}\right)$ el
          coseno es positivo—.

          | $x$ | $z$ |
          |---|---|
          | $-1$ | $-\frac{\pi}{4}$ |
          | $1$ | $\frac{\pi}{4}$ |

          $$
          \int_{-\pi/4}^{\pi/4}\frac{\sec^{2}z}{\sec^{3}z}\,dz
          = \int_{-\pi/4}^{\pi/4}\cos z\,dz
          = \left[\mathrm{sen}\,z\right]_{-\pi/4}^{\pi/4}
          $$

          $$
          = \frac{\sqrt2}{2}+\frac{\sqrt2}{2} = \sqrt2 \approx 1{,}4142
          $$
        veredicto: |
          Deshaciendo el cambio, la primitiva es
          $\mathrm{sen}\,z = \frac{x}{\sqrt{1+x^{2}}}$, y evaluada da lo mismo.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuál es el volumen del sólido del apartado (b)? Da cuatro decimales.
        respuesta:
          tipo: numero
          valor: '3.4150'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '19.7392'
            mensaje: |
              $2\pi^{2}$ es solo el primer sumando. Falta restar
              $3\sqrt3\,\pi = 16{,}32$.
          - valor: '9.8696'
            mensaje: |
              $\pi^{2}$ es la mitad de $2\pi^{2}$, que es lo que saldría girando
              $\mathrm{sen}\,x$ alrededor del eje $y=0$. Aquí el eje es $y=1$ y
              el radio es $2\,\mathrm{sen}\,x-1$, no $2\,\mathrm{sen}\,x$.
          - valor: '2.0944'
            mensaje: |
              $\frac{2\pi}{3}$ es la longitud del intervalo de integración
              $\left[\frac{\pi}{6},\frac{5\pi}{6}\right]$, no un volumen.
        pista: |
          $V = \pi\int\left(2\,\mathrm{sen}\,x-1\right)^{2}dx$, entre los puntos
          donde $2\,\mathrm{sen}\,x = 1$.
        desarrollo: |
          **Los límites.** El recinto existe donde
          $2\,\mathrm{sen}\,x \ge 1$, es decir
          $\mathrm{sen}\,x \ge \frac12$:

          $$
          \frac{\pi}{6} \le x \le \frac{5\pi}{6}
          $$

          **El radio** es la distancia al eje $y=1$:
          $2\,\mathrm{sen}\,x-1$.

          $$
          V = \pi\int_{\pi/6}^{5\pi/6}
          \left(2\,\mathrm{sen}\,x-1\right)^{2}dx
          $$

          Desarrollando, con
          $\mathrm{sen}^{2}x = \frac{1-\cos2x}{2}$:

          $$
          \left(2\,\mathrm{sen}\,x-1\right)^{2}
          = 4\,\mathrm{sen}^{2}x-4\,\mathrm{sen}\,x+1
          = 3-2\cos2x-4\,\mathrm{sen}\,x
          $$

          $$
          \int\left(3-2\cos2x-4\,\mathrm{sen}\,x\right)dx
          = 3x-\mathrm{sen}\,2x+4\cos x
          $$

          Evaluando entre $\frac{\pi}{6}$ y $\frac{5\pi}{6}$ sale
          $2\pi-3\sqrt3$, luego

          $$
          V = \pi\left(2\pi-3\sqrt3\right) = 2\pi^{2}-3\sqrt3\,\pi
          \approx 3{,}4150
          $$
        veredicto: |
          El resultado es pequeño porque el recinto es una lente delgada: entre
          $y=1$ y el arco de seno, con altura máxima 1.

      - tipo: justificar
        pregunta: |
          Ordena el planteamiento de (b). Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Leer el recinto.** $D$ es la zona entre la recta $y=1$ por abajo
              y la curva $y = 2\,\mathrm{sen}\,x$ por arriba, dentro de
              $(0,\pi)$.
          - texto: |
              **Localizar dónde existe:** hace falta
              $2\,\mathrm{sen}\,x \ge 1$, es decir
              $x \in \left[\frac{\pi}{6},\frac{5\pi}{6}\right]$. Fuera de ahí la
              curva va por debajo de la recta y el recinto está vacío.
          - texto: |
              **El eje de giro es $y=1$**, que es justamente el borde inferior
              del recinto: el sólido es **macizo**, sin hueco.
          - texto: |
              **El radio** de cada disco es la distancia al eje:
              $2\,\mathrm{sen}\,x-1$.
          - texto: |
              **Integrar:**
              $V = \pi\int_{\pi/6}^{5\pi/6}
              \left(2\,\mathrm{sen}\,x-1\right)^{2}dx = 2\pi^{2}-3\sqrt3\,\pi$.
          - texto: |
              Como el eje de giro no es el eje $OX$, hay que trasladar la
              función restando 1 **y también** cambiar los límites de
              integración.
            trampa: true
            mensaje: |
              Los límites **no** cambian: girar alrededor de una recta
              horizontal no mueve nada en la dirección $x$. Lo único que cambia
              es el **radio**, que pasa de ser $y$ a ser $y-1$. Los límites
              $\frac{\pi}{6}$ y $\frac{5\pi}{6}$ salen de dónde está el recinto,
              y eso es independiente del eje de giro.
        veredicto: |
          Girar alrededor de $y=k$ en vez de $y=0$ solo afecta al radio. Es la
          traslación más barata que hay.

    resolucion: |
      **Datos.** Una integral con el cambio indicado y un sólido de revolución
      alrededor de una recta que no es un eje coordenado.

      ### 1 · Apartado (a): el cambio

      $$
      x = \tan z,
      \qquad
      dx = \sec^{2}z\,dz
      $$

      Y la identidad clave:

      $$
      x^{2}+1 = \tan^{2}z+1 = \sec^{2}z
      $$

      $$
      \left(x^{2}+1\right)^{3/2} = \left(\sec^{2}z\right)^{3/2}
      = \left\lvert\sec z\right\rvert^{3} = \sec^{3}z
      $$

      —el valor absoluto se quita porque el cambio se hace en
      $\left(-\frac{\pi}{2},\frac{\pi}{2}\right)$, donde el coseno es
      positivo—.

      ### 2 · La integral se simplifica del todo

      $$
      \int\frac{\sec^{2}z\,dz}{\sec^{3}z} = \int\frac{dz}{\sec z}
      = \int\cos z\,dz = \mathrm{sen}\,z
      $$

      **Los límites:**

      | $x$ | $z = \arctan x$ |
      |---|---|
      | $-1$ | $-\frac{\pi}{4}$ |
      | $1$ | $\frac{\pi}{4}$ |

      $$
      \int_{-1}^{1}\frac{dx}{\left(x^{2}+1\right)^{3/2}}
      = \left[\mathrm{sen}\,z\right]_{-\pi/4}^{\pi/4}
      = \frac{\sqrt2}{2}-\left(-\frac{\sqrt2}{2}\right)
      $$

      $$
      \boxed{= \sqrt2 \approx 1{,}4142}
      $$

      ### 3 · Comprobación de (a)

      **Deshaciendo el cambio**, la primitiva en función de $x$ es

      $$
      \mathrm{sen}\,z = \frac{\tan z}{\sec z} = \frac{x}{\sqrt{1+x^{2}}}
      $$

      $$
      \left[\frac{x}{\sqrt{1+x^{2}}}\right]_{-1}^{1}
      = \frac{1}{\sqrt2}+\frac{1}{\sqrt2} = \sqrt2 \quad\checkmark
      $$

      **Derivando esa primitiva**, con la regla del cociente:

      $$
      \frac{d}{dx}\left[x\left(1+x^{2}\right)^{-1/2}\right]
      = \left(1+x^{2}\right)^{-1/2}-x^{2}\left(1+x^{2}\right)^{-3/2}
      $$

      $$
      = \frac{\left(1+x^{2}\right)-x^{2}}{\left(1+x^{2}\right)^{3/2}}
      = \frac{1}{\left(1+x^{2}\right)^{3/2}} \quad\checkmark
      $$

      **Por acotación.** El integrando vale 1 en $x=0$ y
      $\frac{1}{2\sqrt2} = 0{,}354$ en los extremos, así que la integral está
      entre $2\cdot0{,}354 = 0{,}71$ y $2\cdot1 = 2$:

      $$
      0{,}71 < 1{,}414 < 2 \quad\checkmark
      $$

      ### 4 · Apartado (b): el recinto

      $$
      D = \left\{(x,y) : 1 \le y \le 2\,\mathrm{sen}\,x,\ 0<x<\pi\right\}
      $$

      **Dónde existe.** Hace falta $2\,\mathrm{sen}\,x \ge 1$:

      $$
      \mathrm{sen}\,x \ge \frac12
      \;\Longrightarrow\;
      \frac{\pi}{6} \le x \le \frac{5\pi}{6}
      $$

      Fuera de ese tramo la curva va por debajo de la recta y el recinto está
      vacío. **Localizar esos límites es la mitad del apartado.**

