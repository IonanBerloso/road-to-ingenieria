ejercicios:
  - id: ex1516-3ev-1-dos-definiciones
    titulo: Dos definiciones, con su fórmula y su ejemplo
    fuente: >-
      Ejercicio 1 · Tercera evaluación, 13 de enero de 2016 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 5
      comp4: 5

    enunciado: |
      Para cada uno de los siguientes conceptos, dar su definición (una frase),
      expresarlo mediante una expresión matemática y poner un ejemplo:

      **a)** Logaritmo neperiano de un número complejo.

      **b)** Derivada de una función real de variable real.
    pide: Definir, formular y ejemplificar los dos conceptos.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tiene de particular el logaritmo de un complejo frente al de un
          real positivo?
        opciones:
          - texto: >-
              Que es **multivaluado**: cada $z\neq0$ tiene infinitos
              logaritmos, separados por múltiplos de $2\pi i$
            correcta: true
            mensaje: |
              Exacto, y es la diferencia esencial. El argumento está definido
              salvo múltiplos de $2\pi$, y ese resto se cuela en la parte
              imaginaria del logaritmo.
          - texto: >-
              Que solo existe si $z$ es real positivo
            mensaje: |
              Existe para **todo** $z\neq0$, incluidos los negativos: $\ln(-1)$
              vale $i\pi$ en su valor principal.
          - texto: >-
              Que su parte real puede ser negativa
            mensaje: |
              También en $\mathbb{R}$: $\ln0{,}5$ es negativo. No es lo
              distintivo.
          - texto: >-
              Que no cumple $\ln(ab) = \ln a+\ln b$
            mensaje: |
              La cumple, pero **como igualdad entre conjuntos**. El matiz es
              real y conviene mencionarlo, aunque no sea la diferencia principal.

      - tipo: calcular
        titulo: El logaritmo de menos uno
        pregunta: |
          ¿Cuál es la parte imaginaria del **valor principal** de $\ln(-1)$? Da
          cuatro decimales.
        respuesta:
          tipo: numero
          valor: '3.1416'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              0 sería si $-1$ tuviera argumento 0, es decir si estuviera en el
              semieje real **positivo**. Está en el negativo: su argumento es
              $\pi$.
          - valor: '1.5708'
            mensaje: |
              $\frac{\pi}{2}$ es el argumento de $i$, no de $-1$.
          - valor: '6.2832'
            mensaje: |
              $2\pi$ es el periodo del argumento, no su valor principal. El
              valor principal se toma en $(-\pi,\pi]$.
        pista: |
          $\ln z = \ln\left\lvert z\right\rvert+i\arg z$, y
          $\left\lvert-1\right\rvert = 1$.
        desarrollo: |
          $$
          \ln(-1) = \ln\left\lvert-1\right\rvert+i\left(\arg(-1)+2k\pi\right)
          = 0+i\left(\pi+2k\pi\right)
          $$

          Los infinitos logaritmos de $-1$ son
          $i\pi$, $3i\pi$, $-i\pi$, $5i\pi$…: todos imaginarios puros.

          El **valor principal** es el que tiene el argumento en
          $(-\pi,\pi]$:

          $$
          \mathrm{Ln}(-1) = i\pi
          $$

          Parte imaginaria $\pi \approx 3{,}1416$.
        veredicto: |
          Que $\ln(-1)$ exista es lo que distingue el logaritmo complejo del
          real. En $\mathbb{R}$ simplemente no está definido.

      - tipo: justificar
        pregunta: |
          Ordena la respuesta al apartado (b). Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La frase.** La derivada de $f$ en $a$ es la **razón instantánea
              de cambio** de $f$ en ese punto, o dicho geométricamente, la
              pendiente de la recta tangente a la gráfica en $\left(a,f(a)
              \right)$.
          - texto: |
              **La expresión.**
              $f'(a) = \displaystyle\lim_{h\to0}\frac{f(a+h)-f(a)}{h}$, o
              equivalentemente
              $\lim_{x\to a}\frac{f(x)-f(a)}{x-a}$.
          - texto: |
              **La condición.** La derivada existe cuando ese límite existe y es
              **finito**. Si no, la función no es derivable en $a$.
          - texto: |
              **El ejemplo.** Con $f(x)=x^{2}$ en $a=2$:
              $\lim_{h\to0}\frac{(2+h)^{2}-4}{h}
              = \lim_{h\to0}\left(4+h\right) = 4$.
          - texto: |
              **Y un contraejemplo, que redondea la respuesta:**
              $f(x)=\left\lvert x\right\rvert$ en $a=0$ tiene derivadas laterales
              $-1$ y $+1$: no coinciden, luego no es derivable.
          - texto: |
              Como $f$ es continua en $a$, el límite existe y $f$ es derivable.
            trampa: true
            mensaje: |
              La continuidad **no implica** derivabilidad: el valor absoluto es
              el contraejemplo de manual, y la función de Weierstrass es
              continua en todo punto y derivable en ninguno. La implicación va
              en el otro sentido: derivable $\Rightarrow$ continua. Invertirla
              es el error más repetido del tema.
        veredicto: |
          Una definición completa lleva tres cosas: la frase, la fórmula y la
          condición de existencia. El examen pide además un ejemplo, y un
          contraejemplo lo mejora.

    resolucion: |
      **Lo que se pide.** Para cada concepto: una frase, una expresión
      matemática y un ejemplo. Cinco puntos por la terminología y cinco por la
      explicación formal.

      ### 1 · Apartado (a): logaritmo neperiano de un complejo

      **La frase.** El logaritmo de $z \neq 0$ es cualquier número complejo
      cuya exponencial vale $z$.

      **La expresión.** Escribiendo $z$ en forma polar,
      $z = r\,\mathrm{e}^{i\theta}$ con $r = \left\lvert z\right\rvert>0$:

      $$
      \boxed{\ln z = \ln\left\lvert z\right\rvert
      +i\left(\arg z+2k\pi\right), \qquad k \in \mathbb{Z}}
      $$

      **Tres cosas que hay que decir:**

      - **Es multivaluado.** Cada $z\neq0$ tiene **infinitos** logaritmos,
        separados por múltiplos de $2\pi i$. La causa es que el argumento solo
        está definido salvo vueltas enteras.
      - **El valor principal** se obtiene tomando $\arg z \in (-\pi,\pi]$, y se
        escribe $\mathrm{Ln}\,z$.
      - **$z=0$ queda fuera:** no hay ningún $w$ con $\mathrm{e}^{w}=0$.

      **El ejemplo.** $z = -1$, con $\left\lvert z\right\rvert = 1$ y
      $\arg z = \pi$:

      $$
      \ln(-1) = 0+i\left(\pi+2k\pi\right) = (2k+1)\pi i
      $$

      $$
      \mathrm{Ln}(-1) = i\pi
      $$

      **Comprobación:** $\mathrm{e}^{i\pi} = -1$ ✔ —la identidad de Euler—. Y
      también $\mathrm{e}^{3i\pi} = -1$ ✔, que es el siguiente valor.

      Y lo que esto arregla: en $\mathbb{R}$, $\ln(-1)$ **no existe**. En
      $\mathbb{C}$ existe, y hay infinitos.

      ### 2 · Un matiz que suma

      La propiedad $\ln(ab) = \ln a+\ln b$ sigue valiendo, pero **como igualdad
      entre conjuntos**, no entre valores principales. Por ejemplo:

      $$
      \mathrm{Ln}\left[(-1)\cdot(-1)\right] = \mathrm{Ln}(1) = 0
      $$

      $$
      \mathrm{Ln}(-1)+\mathrm{Ln}(-1) = i\pi+i\pi = 2i\pi \neq 0
      $$

      Los dos son logaritmos de 1, pero no el mismo. Señalarlo demuestra haber
      entendido la multivaluación.

      ### 3 · Apartado (b): derivada de una función real

      **La frase.** La derivada de $f$ en $a$ es la razón instantánea de cambio
      de $f$ en ese punto; geométricamente, la **pendiente de la recta
      tangente** a la gráfica en $\left(a,f(a)\right)$.

      **La expresión.**

      $$
      \boxed{f'(a) = \lim_{h\to0}\frac{f(a+h)-f(a)}{h}
      = \lim_{x\to a}\frac{f(x)-f(a)}{x-a}}
      $$

      **La condición.** La derivada existe cuando ese límite existe y es
      **finito**. Si los límites laterales no coinciden, o si el límite es
      infinito, la función no es derivable en $a$.

      **El ejemplo.** $f(x) = x^{2}$ en $a=2$:

      $$
      f'(2) = \lim_{h\to0}\frac{(2+h)^{2}-2^{2}}{h}
      = \lim_{h\to0}\frac{4h+h^{2}}{h}
      = \lim_{h\to0}\left(4+h\right) = 4
      $$

      La recta tangente en $(2,4)$ es $y = 4x-4$.

      ### 4 · El contraejemplo que redondea

      $f(x) = \left\lvert x\right\rvert$ en $a=0$:

      $$
      \lim_{h\to0^{+}}\frac{\left\lvert h\right\rvert}{h} = +1,
      \qquad
      \lim_{h\to0^{-}}\frac{\left\lvert h\right\rvert}{h} = -1
      $$

      Las dos derivadas laterales existen pero **no coinciden**: no es
      derivable, aunque sí es continua.

      **La implicación va en un solo sentido:**

      $$
      \text{derivable en } a \;\Longrightarrow\; \text{continua en } a
      $$

      y **no** al revés. Invertirla es el error más repetido de todo el tema.

      ### 5 · Cómo se estructura una respuesta así

      El enunciado marca tres piezas por concepto, y conviene entregarlas
      separadas y en ese orden:

      | pieza | logaritmo complejo | derivada |
      |---|---|---|
      | frase | «el complejo cuya exponencial es $z$» | «pendiente de la tangente» |
      | expresión | $\ln\left\lvert z\right\rvert+i(\arg z+2k\pi)$ | $\lim_{h\to0}\frac{f(a+h)-f(a)}{h}$ |
      | ejemplo | $\mathrm{Ln}(-1)=i\pi$ | $f=x^{2}$, $f'(2)=4$ |

      Y en los dos casos, el punto que separa una respuesta correcta de una
      completa es el **matiz**: la multivaluación en el primero, la existencia
      del límite en el segundo.

  - id: ex1516-3ev-2-funcion-valor-medio
    titulo: La función valor medio de una quebrada
    fuente: >-
      Ejercicio 2 · Tercera evaluación, 13 de enero de 2016 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3

    enunciado: |
      Sea la función continua $y(x)$ de la figura, definida en el intervalo
      $[1,3]$. Se pide:

      **a)** Calcular $\overline{y}(x)$, la función valor medio de $y(x)$.

      **b)** Estudiar el crecimiento/decrecimiento y concavidad/convexidad de
      $\overline{y}(x)$.

      **c)** Calcular el valor medio de $y(x)$ en el intervalo
      $\left[1,\tfrac32\right]$.

      <figure class="figura-examen">
      <svg viewBox="0 0 500 360" role="img" width="480" height="346"
           aria-labelledby="f1516c2t f1516c2d">
        <title id="f1516c2t">La funcion del enunciado</title>
        <desc id="f1516c2d">Una linea quebrada que sube desde el punto uno coma
        cero hasta el punto dos coma uno, y a partir de ahi se mantiene
        constante en el valor uno hasta el punto tres.</desc>

        <g stroke="var(--rule)" stroke-width="1" fill="none">
          <path d="M260 40 L260 320 M440 40 L440 320 M60 140 L470 140"></path>
        </g>

        <g stroke="var(--graphite)" stroke-width="1.3" fill="none">
          <path d="M50 300 L470 300 M80 40 L80 330"></path>
        </g>

        <g stroke="var(--d1)" stroke-width="3" fill="none"
           stroke-linejoin="round" stroke-linecap="round">
          <path d="M80 300 L260 140 L440 140"></path>
        </g>

        <g fill="var(--graphite)" font-size="13" font-family="var(--mono)">
          <text x="72" y="320">1</text>
          <text x="256" y="320">2</text>
          <text x="436" y="320">3</text>
          <text x="60" y="146">1</text>
          <text x="452" y="292">x</text>
          <text x="88" y="54">y</text>
        </g>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original: y vale x menos uno entre 1 y 2,
      y vale 1 constante entre 2 y 3.
      </figcaption>
      </figure>
    pide: Calcular la función valor medio, estudiarla y evaluar en un intervalo.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es la «función valor medio» $\overline y(x)$?
        opciones:
          - texto: >-
              El valor medio de $y$ en $[1,x]$, es decir
              $\overline y(x) = \frac{1}{x-1}\int_1^{x}y(t)\,dt$
            correcta: true
            mensaje: |
              Exacto. Es una función **de $x$**: para cada extremo derecho
              devuelve el promedio de $y$ desde el principio del intervalo hasta
              ahí.
          - texto: >-
              La media aritmética de los valores de $y$
            mensaje: |
              Con infinitos valores no se puede hacer una media aritmética: hay
              que integrar y dividir por la longitud.
          - texto: >-
              El valor de $y$ en el punto medio del intervalo
            mensaje: |
              Eso es otra cosa. Coincidiría solo si $y$ fuera lineal, y aquí
              no lo es en todo el intervalo.
          - texto: >-
              $\int_1^{x}y(t)\,dt$ sin dividir
            mensaje: |
              Sin dividir es la función **integral**, no el valor medio. El
              divisor $x-1$ es lo que la convierte en un promedio.

      - tipo: calcular
        titulo: El valor medio en el intervalo pequeño
        pregunta: |
          ¿Cuál es el valor medio de $y$ en $\left[1,\frac32\right]$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              $0{,}5$ es $y\left(\frac32\right)$, el valor de la función en el
              extremo, no su promedio. En un tramo creciente el promedio es
              menor que el valor final.
          - valor: '0.125'
            mensaje: |
              $0{,}125$ es la **integral** $\int_1^{3/2}y$. Falta dividir entre
              la longitud del intervalo, que es $\frac12$.
          - valor: '0.75'
            mensaje: |
              $0{,}75$ es $\overline y(3)$, el promedio en todo el intervalo.
        pista: |
          En $[1,2]$ la función es $y = x-1$, así que la integral es el área de
          un triángulo.
        desarrollo: |
          En $\left[1,\frac32\right]$ la función es $y(t) = t-1$:

          $$
          \int_1^{3/2}(t-1)\,dt = \left[\frac{(t-1)^{2}}{2}\right]_1^{3/2}
          = \frac{(1/2)^{2}}{2} = \frac18
          $$

          —el área del triángulo de base $\frac12$ y altura $\frac12$—.

          Dividiendo entre la longitud del intervalo:

          $$
          \overline y\!\left(\tfrac32\right)
          = \frac{1/8}{1/2} = \frac14 = 0{,}25
          $$
        veredicto: |
          En un tramo lineal el valor medio es la media de los extremos:
          $\frac{0+0{,}5}{2} = 0{,}25$ ✔ Una comprobación de un segundo.

      - tipo: calcular
        titulo: El valor medio en todo el intervalo
        pregunta: |
          ¿Cuál es el valor medio de $y$ en $[1,3]$ entero?
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es el valor **máximo** de $y$, el que toma en todo el segundo
              tramo. El promedio es menor porque el primer tramo aporta menos.
          - valor: '1.5'
            mensaje: |
              $1{,}5$ es la **integral** $\int_1^{3}y$. Falta dividir entre la
              longitud, que es 2.
          - valor: '0.5'
            mensaje: |
              $0{,}5$ es el valor medio hasta $x=2$, no hasta $x=3$.
        pista: |
          El área bajo la gráfica es un triángulo más un rectángulo.
        desarrollo: |
          $$
          \int_1^{3}y = \underbrace{\frac{1\cdot1}{2}}_{\text{triángulo}}
          +\underbrace{1\cdot1}_{\text{rectángulo}} = \frac32
          $$

          $$
          \overline y(3) = \frac{3/2}{3-1} = \frac34 = 0{,}75
          $$
        veredicto: |
          $0{,}75$ está entre el mínimo (0) y el máximo (1) de $y$, como tiene
          que estar cualquier valor medio.

      - tipo: justificar
        pregunta: |
          Ordena el estudio de $\overline y$. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **En $[1,2]$**, con $y(t)=t-1$:
              $\int_1^{x}(t-1)dt = \frac{(x-1)^{2}}{2}$, luego
              $\overline y(x) = \frac{x-1}{2}$: una **recta**.
          - texto: |
              **En $[2,3]$**, sumando el trozo constante:
              $\int_1^{x}y = \frac12+(x-2)$, luego
              $\overline y(x) = \frac{x-\frac32}{x-1} = 1-\frac{1/2}{x-1}$.
          - texto: |
              **Crece en todo el intervalo:** en el primer tramo con pendiente
              constante $\frac12$, y en el segundo con
              $\overline y' = \frac{1/2}{(x-1)^{2}} > 0$.
          - texto: |
              **La concavidad:** en $[1,2]$ es una recta, así que
              $\overline y''=0$; en $[2,3]$,
              $\overline y'' = -\frac{1}{(x-1)^{3}} < 0$: **cóncava**.
          - texto: |
              **Y encaja en $x=2$:** los dos trozos valen $\frac12$ y las dos
              derivadas valen $\frac12$. $\overline y$ es de clase $C^{1}$
              aunque $y$ tenga un pico ahí.
          - texto: |
              Como $y$ tiene un pico en $x=2$, $\overline y$ también lo tiene y
              no es derivable ahí.
            trampa: true
            mensaje: |
              Al revés: **promediar suaviza**. Las derivadas laterales de
              $\overline y$ en $x=2$ valen las dos $\frac12$, así que sí es
              derivable. Lo que $\overline y$ no es, es dos veces derivable: la
              segunda derivada salta de 0 a $-1$. El pico sube un escalón, no
              desaparece — pero desde luego no se queda donde estaba.
        veredicto: |
          Integrar suaviza y promediar también. El pico de $y$ reaparece en
          $\overline y''$, un orden más arriba.

    resolucion: |
      **Datos.** La quebrada de la figura: $y(x) = x-1$ en $[1,2]$ e $y(x)=1$
      en $[2,3]$.

      ### 1 · Qué es la función valor medio

      $$
      \overline y(x) = \frac{1}{x-1}\int_1^{x}y(t)\,dt, \qquad x \in (1,3]
      $$

      Es el **promedio de $y$ desde el principio hasta $x$**. En $x=1$ la
      expresión da $\frac00$, pero el límite existe y vale $y(1)=0$: se extiende
      por continuidad.

      ### 2 · Apartado (a): los dos tramos

      **Tramo $1 \le x \le 2$**, con $y(t)=t-1$:

      $$
      \int_1^{x}(t-1)\,dt = \frac{(x-1)^{2}}{2}
      $$

      $$
      \overline y(x) = \frac{1}{x-1}\cdot\frac{(x-1)^{2}}{2}
      = \frac{x-1}{2}
      $$

      **Tramo $2 \le x \le 3$**, sumando el trozo constante:

      $$
      \int_1^{x}y = \underbrace{\frac12}_{[1,2]}+\underbrace{(x-2)}_{[2,x]}
      = x-\frac32
      $$

      $$
      \overline y(x) = \frac{x-\frac32}{x-1}
      $$

      $$
      \boxed{\overline y(x) = \begin{cases}
      \dfrac{x-1}{2} & 1 \le x \le 2\\[10pt]
      \dfrac{x-\frac32}{x-1} & 2 \le x \le 3
      \end{cases}}
      $$

      **Encaja en $x=2$:** el primero da $\frac12$ y el segundo
      $\frac{1/2}{1} = \frac12$ ✔

      ### 3 · Apartado (b): crecimiento

      **En $[1,2]$:** es una recta de pendiente $\frac12$, así que
      $\overline y' = \frac12 > 0$: **crece**.

      **En $[2,3]$:** conviene reescribirla,

      $$
      \overline y(x) = \frac{(x-1)-\frac12}{x-1} = 1-\frac{1}{2(x-1)}
      $$

      $$
      \overline y'(x) = \frac{1}{2(x-1)^{2}} > 0
      $$

      **crece** también.

      $$
      \boxed{\overline y \text{ es creciente en todo } (1,3]}
      $$

      Y **no tiene extremos interiores**: sus valores extremos están en la
      frontera, $\overline y(1)=0$ y $\overline y(3) = \frac34$.

      ### 4 · Apartado (b): concavidad

      **En $[1,2]$:** recta, luego $\overline y'' = 0$. **Ni cóncava ni
      convexa**, o las dos a la vez según el convenio.

      **En $[2,3]$:**

      $$
      \overline y''(x) = -\frac{1}{(x-1)^{3}} < 0
      $$

      $$
      \boxed{\overline y \text{ es CÓNCAVA en } (2,3)}
      $$

      ### 5 · El punto $x=2$, que es lo interesante

      | | por la izquierda | por la derecha |
      |---|---|---|
      | $\overline y$ | $\frac12$ | $\frac12$ |
      | $\overline y'$ | $\frac12$ | $\frac{1}{2\cdot1^{2}} = \frac12$ |
      | $\overline y''$ | $0$ | $-1$ |

      **La función y su primera derivada encajan; la segunda salta.**

      Y eso tiene una lectura: $y$ tiene un **pico** en $x=2$ —sus derivadas
      laterales valen 1 y 0—, y al promediar ese pico **sube un escalón**:
      aparece en $\overline y''$ en vez de en $\overline y'$.

      **Promediar suaviza**, igual que integrar. $\overline y$ es de clase
      $C^{1}$ pero no $C^{2}$.

