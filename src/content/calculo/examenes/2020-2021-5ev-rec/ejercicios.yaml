ejercicios:
  - id: ex2021-5rec-1-cuando-el-cociente-es-real
    titulo: Los dos lugares de un cociente, y los dos puntos que hay que quitar
    fuente: >-
      Ejercicio 1 · Quinta evaluación, PRIMER PARCIAL, 26 de abril de 2021 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3
    enunciado: |
      Calcular y dibujar el lugar geométrico de los afijos de los números
      complejos $z$ tales que

      a) $\omega=\dfrac{2z-i}{2+iz}$ es un número real.

      b) $\omega=\dfrac{2z-i}{2+iz}$ es un número imaginario puro.
    pide: Los dos lugares geométricos, calculados y dibujados.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se impone que $\omega$ sea real?
        opciones:
          - texto: >-
              Multiplicando arriba y abajo por el conjugado del denominador,
              separando $\omega$ en parte real e imaginaria, e igualando a cero
              la parte imaginaria
            correcta: true
            mensaje: |
              Eso es. Es el procedimiento de siempre: la condición «es real» solo
              se puede escribir cuando el número está separado en sus dos partes,
              y para separarlo hay que quitarle la $i$ al denominador.
          - texto: >-
              Imponiendo que $z$ sea real, es decir $y=0$
            mensaje: |
              Eso es que $z$ sea real, que es otra cosa. Compruébalo con $z=1$:
              queda $\omega=\frac{2-i}{2+i}=\frac{3-4i}{5}$, que no es real. La
              transformación mezcla las dos partes.
          - texto: >-
              Escribiendo $\omega=\overline{\omega}$, que obliga a que
              $z=\overline{z}$
            mensaje: |
              La primera mitad está bien: $\omega$ es real si y solo si
              $\omega=\overline{\omega}$. La segunda no se sigue, porque la
              transformación no es la identidad. Desarrollando esa igualdad sale
              una circunferencia, no el eje real.

      - tipo: calcular
        titulo: La ordenada del centro
        pregunta: |
          El lugar del apartado a) es una circunferencia con el centro sobre el
          eje imaginario. ¿Cuál es su ordenada?
        respuesta:
          tipo: numero
          valor: '1.25'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '2.5'
            mensaje: |
              Te has quedado con el coeficiente de $y$ sin partirlo por la mitad.
              De $x^{2}+y^{2}-\frac52y+1=0$, al completar cuadrados, el centro
              queda en $\frac{5}{4}$: la mitad de $\frac52$.
          - valor: '-1.25'
            mensaje: |
              Signo. En $x^{2}+\left(y-\frac54\right)^{2}$ el centro es
              $+\frac54$: es el número que se **resta** dentro del cuadrado.
          - valor: '0.625'
            mensaje: |
              Has partido por la mitad dos veces. El coeficiente de $y$ en
              $x^{2}+y^{2}-\frac52y+1=0$ es $-\frac52$, y la mitad de eso es
              $\frac54$.
        pista: |
          Con $z=x+iy$, separa $\omega$ y anula su parte imaginaria; te quedará
          $2x^{2}+2y^{2}-5y+2=0$.
        desarrollo: |
          Con $z=x+iy$, el numerador es $2x+i(2y-1)$ y el denominador
          $(2-y)+ix$. Multiplicando por el conjugado del denominador,

          $$
          \omega=\frac{3x+i\left[(2y-1)(2-y)-2x^{2}\right]}{(2-y)^{2}+x^{2}}
          $$

          Anular la parte imaginaria da

          $$
          (2y-1)(2-y)-2x^{2}=0
          \;\Longleftrightarrow\;
          2x^{2}+2y^{2}-5y+2=0
          \;\Longleftrightarrow\;
          x^{2}+\left(y-\frac54\right)^{2}=\frac{9}{16}
          $$

      - tipo: calcular
        titulo: El radio
        pregunta: |
          ¿Cuánto vale el radio de esa circunferencia?
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.25'
            mensaje: |
              Ese es el centro, no el radio. Al completar cuadrados aparecen los
              dos: el $\frac54$ va dentro del paréntesis y el radio sale de lo
              que queda al otro lado del igual.
          - valor: '2.0615528'
            mensaje: |
              No has dividido entre $2$ toda la ecuación. De
              $2x^{2}+2y^{2}-5y+2=0$ sale $x^{2}+y^{2}-\frac52y+1=0$: el $5$
              también se parte.
          - valor: '0.5625'
            mensaje: |
              Eso es $r^{2}=\frac{9}{16}$. Falta la raíz cuadrada:
              $r=\frac34$.
        pista: |
          Completa cuadrados en $x^{2}+y^{2}-\frac52y+1=0$ y mira lo que queda a
          la derecha.
        desarrollo: |
          $$
          x^{2}+y^{2}-\frac52y+1=0
          \;\Longrightarrow\;
          x^{2}+\left(y-\frac54\right)^{2}=\frac{25}{16}-1=\frac{9}{16}
          $$

          $$
          r=\frac34
          $$

          Centro en $\frac54 i$ y radio $\frac34$: la circunferencia va de
          $y=\frac12$ a $y=2$ sobre el eje imaginario.

      - tipo: calcular
        titulo: El punto que hay que quitar
        pregunta: |
          Hay un $z$ que anula el denominador y que, por tanto, sobra en los dos
          lugares. Está sobre el eje imaginario: ¿cuál es su ordenada?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              Al despejar $z=-\frac{2}{i}$ hay que acordarse de que
              $\frac{1}{i}=-i$, así que $-\frac{2}{i}=2i$. La ordenada es $+2$.
          - valor: '0.5'
            mensaje: |
              Ese es el punto donde $\omega=0$. También merece un comentario —si
              se exige que un imaginario puro no sea cero, sale del apartado b)—
              pero no es el que anula el denominador.
        pista: |
          Resuelve $2+iz=0$.
        desarrollo: |
          $$
          2+iz=0
          \;\Longrightarrow\;
          z=-\frac{2}{i}=-2\cdot\left(-i\right)=2i
          $$

          Y $2i$ **está** sobre la circunferencia del apartado a): su ordenada es
          $\frac54+\frac34=2$. Está también, obviamente, sobre el eje imaginario
          del apartado b). Hay que excluirlo de los dos.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $z=x+iy$ y multiplicando por el conjugado del denominador,
              $\operatorname{Re}\omega=\dfrac{3x}{(2-y)^{2}+x^{2}}$ y
              $\operatorname{Im}\omega=\dfrac{(2y-1)(2-y)-2x^{2}}{(2-y)^{2}+x^{2}}$.
          - texto: >-
              **a)** $\operatorname{Im}\omega=0$ da
              $x^{2}+\left(y-\frac54\right)^{2}=\frac{9}{16}$: la circunferencia
              de centro $\frac54i$ y radio $\frac34$.
          - texto: >-
              **b)** $\operatorname{Re}\omega=0$ da $3x=0$, es decir $x=0$: el eje
              imaginario entero.
          - texto: >-
              El denominador se anula en $z=2i$, donde $\omega$ ni siquiera está
              definido: ese punto se quita de los dos lugares.
          - texto: >-
              Y en $z=\frac{i}{2}$ sale $\omega=0$, que es real; si se exige que un
              imaginario puro tenga parte imaginaria no nula, ese punto también
              se sale del apartado b).
          - texto: >-
              Como «real» e «imaginario puro» son casos excluyentes, los dos
              lugares no pueden tener ningún punto en común.
            trampa: true
            mensaje: |
              Se cortan, y en dos puntos: la circunferencia toca al eje
              imaginario en $z=\frac{i}{2}$ y en $z=2i$. Y no es casualidad: son
              exactamente los dos puntos que hay que discutir. En el primero
              $\omega=0$, que es real y —según el convenio que se use— también
              imaginario puro; en el segundo $\omega$ no existe. Lo raro sería
              que no se cortaran.

    resolucion: |
      **Separar $\omega$.** Con $z=x+iy$, el numerador es $2x+i(2y-1)$ y el
      denominador $(2-y)+ix$. Multiplicando arriba y abajo por el conjugado del
      denominador:

      $$
      \omega=\frac{3x+i\left[(2y-1)(2-y)-2x^{2}\right]}{(2-y)^{2}+x^{2}}
      $$

      El numerador real sale sorprendentemente limpio —$2x(2-y)+x(2y-1)=3x$—
      porque los términos en $xy$ se cancelan. Eso es lo que hace que el
      apartado b) sea una recta.

      **a) $\omega$ real.** Hay que anular la parte imaginaria:

      $$
      (2y-1)(2-y)-2x^{2}=0
      \;\Longleftrightarrow\;
      2x^{2}+2y^{2}-5y+2=0
      \;\Longleftrightarrow\;
      x^{2}+\left(y-\frac54\right)^{2}=\frac{9}{16}
      $$

      Es la circunferencia de centro $\frac54 i$ y radio $\frac34$.

      **b) $\omega$ imaginario puro.** Hay que anular la parte real:

      $$
      3x=0
      \;\Longleftrightarrow\;
      x=0
      $$

      Es el eje imaginario. Y se comprueba de un vistazo: para $z=iy$ queda
      $\omega=i\,\dfrac{2y-1}{2-y}$, imaginario puro para todo $y\neq 2$.

      **Los dos puntos que se quitan.** El denominador se anula en

      $$
      2+iz=0
      \;\Longrightarrow\;
      z=-\frac{2}{i}=2i
      $$

      y ahí $\omega$ no existe: fuera de los dos lugares. Y en $z=\frac{i}{2}$
      sale $\omega=0$; si se exige que un imaginario puro tenga parte imaginaria
      no nula, ese punto sale también del apartado b). Conviene decirlo, porque
      es justo lo que COMP4 mira.

      **El dibujo.** Los dos lugares se cortan exactamente en esos dos puntos.

      <figure class="figura-examen">
      <svg viewBox="0 0 360 350" role="img" width="360" height="350"
           aria-labelledby="lg21-t lg21-d">
        <title id="lg21-t">Los dos lugares geométricos en el plano complejo</title>
        <desc id="lg21-d">Sobre el plano complejo hay dos lugares. El primero es
        una circunferencia centrada en cinco cuartos por i, de radio tres
        cuartos, que corta al eje imaginario en un medio por i y en dos i. El
        segundo es el eje imaginario entero. Los dos puntos de corte van
        marcados con un circulito hueco: en dos i el cociente no existe, y en un
        medio por i vale cero.</desc>
        <style>
          .lg21-eje { stroke: var(--graphite); stroke-width: 1.2; fill: none; }
          .lg21-b { stroke: var(--alt); stroke-width: 5; fill: none; stroke-linecap: round; opacity: .85; }
          .lg21-a { stroke: var(--live); stroke-width: 2.6; fill: none; }
