  - id: ex2021-5rec-2-la-tangente-al-folio-de-descartes
    titulo: Una tangente sin despejar la y
    fuente: >-
      Ejercicio 2 · Quinta evaluación, PRIMER PARCIAL, 26 de abril de 2021 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Calcular la recta tangente a la curva $y^{3}+x^{3}-3xy=0$ en el punto
      $\left(\frac32,\frac32\right)$.
    pide: La ecuación de la recta tangente en ese punto.

    pasos:
      - tipo: reconocer
        pregunta: |
          La curva viene dada por una ecuación implícita. ¿Cómo se saca la
          pendiente?
        opciones:
          - texto: >-
              Derivando la igualdad entera respecto de $x$ y tratando $y$ como
              función de $x$, para despejar después $y'$
            correcta: true
            mensaje: |
              Eso es. La clave está en el término $3xy$: al derivarlo hay que
              usar la regla del producto, porque los dos factores dependen de
              $x$.
          - texto: >-
              Despejando $y=\sqrt[3]{3xy-x^{3}}$ y derivando esa expresión
            mensaje: |
              Ahí sigue habiendo una $y$ dentro de la raíz: no has despejado
              nada. Esta cúbica sí se puede despejar con la fórmula de Cardano,
              pero el resultado es impresentable y no hace ninguna falta.
          - texto: >-
              El origen también está en la curva, así que la tangente es la recta
              que pasa por $(0,0)$ y por $\left(\frac32,\frac32\right)$
            mensaje: |
              Esa es una **secante**, no una tangente: corta la curva en dos
              puntos. Además sería $y=x$, de pendiente $+1$, y la tangente
              resultará tener pendiente $-1$.

      - tipo: calcular
        titulo: La pendiente
        pregunta: |
          ¿Cuánto vale $y'$ en el punto $\left(\frac32,\frac32\right)$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Signo. Al despejar, $y'\left(3y^{2}-3x\right)=3y-3x^{2}$, así que
              $y'=\dfrac{y-x^{2}}{y^{2}-x}$. En el punto el numerador es
              $\frac32-\frac94=-\frac34$ y el denominador $+\frac34$.
          - valor: '-0.3333333'
            mensaje: |
              Te has dejado la regla del producto en $3xy$: su derivada es
              $3y+3xy'$, no solo $3y$. El $3xy'$ que falta es el que hace que el
              denominador sea $3y^{2}-3x$ y no $3y^{2}$.
          - valor: '-3'
            mensaje: |
              Has cambiado el numerador por el denominador. La pendiente es
              $\dfrac{y-x^{2}}{y^{2}-x}$, no al revés.
        pista: |
          Deriva los tres sumandos, acuérdate del producto en $3xy$, y agrupa los
          términos con $y'$.
        desarrollo: |
          $$
          3y^{2}y'+3x^{2}-3\left(y+xy'\right)=0
          \;\Longrightarrow\;
          y'\left(3y^{2}-3x\right)=3y-3x^{2}
          $$

          $$
          y'=\frac{y-x^{2}}{y^{2}-x}
          \qquad\Longrightarrow\qquad
          y'\left(\tfrac32,\tfrac32\right)
          =\frac{\frac32-\frac94}{\frac94-\frac32}
          =\frac{-\frac34}{\frac34}=-1
          $$

      - tipo: calcular
        titulo: Dónde corta al eje de ordenadas
        pregunta: |
          ¿En qué punto corta la recta tangente al eje $y$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número, la ordenada del corte
        distractores:
          - valor: '1.5'
            mensaje: |
              Eso sería si la tangente fuera horizontal. Con pendiente $-1$ la
              recta baja: $y=\frac32-\left(x-\frac32\right)=3-x$.
          - valor: '0'
            mensaje: |
              Esa es la secante $y=x$, la que pasa por el origen. La tangente
              tiene pendiente $-1$ y no pasa por $(0,0)$.
          - valor: '-3'
            mensaje: |
              Signo al despejar. De $y-\frac32=-\left(x-\frac32\right)$ sale
              $y=-x+3$: la ordenada en el origen es $+3$.
        pista: |
          Escribe la recta punto-pendiente y haz $x=0$.
        desarrollo: |
          $$
          y-\frac32=-1\left(x-\frac32\right)
          \;\Longrightarrow\;
          y=3-x
          \qquad\text{o}\qquad
          x+y=3
          $$

          En $x=0$ la recta vale $y=3$.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El punto está en la curva:
              $\left(\frac32\right)^{3}+\left(\frac32\right)^{3}
              -3\cdot\frac32\cdot\frac32=\frac{27}{4}-\frac{27}{4}=0$.
          - texto: >-
              Derivando implícitamente,
              $3y^{2}y'+3x^{2}-3y-3xy'=0$, y de ahí
              $y'=\dfrac{y-x^{2}}{y^{2}-x}$.
          - texto: >-
              En $\left(\frac32,\frac32\right)$ el denominador vale
              $\frac34\neq 0$, así que la tangente no es vertical y la fórmula se
              puede usar.
          - texto: >-
              La pendiente es $-1$ y la recta es $y=3-x$.
          - texto: >-
              La curva es simétrica respecto de $y=x$ —al intercambiar $x$ e $y$
              la ecuación no cambia—, y el punto está sobre esa diagonal, así que
              la tangente tiene que ser paralela a $y=x$.
            trampa: true
            mensaje: |
              La simetría es cierta, pero de ella sale lo contrario. Si la curva
              es simétrica respecto de la diagonal y el punto está **sobre** la
              diagonal, la tangente en ese punto también tiene que ser simétrica
              respecto de ella; y una recta que coincide con su propia reflexión
              o es la diagonal o es perpendicular a ella. Como la curva no es la
              recta $y=x$, queda lo segundo: pendiente $-1$.

    resolucion: |
      **Primero, comprobar el punto.** No es un formalismo: si el punto no
      estuviera en la curva, no habría tangente que calcular.

      $$
      \left(\frac32\right)^{3}+\left(\frac32\right)^{3}-3\cdot\frac32\cdot\frac32
      =\frac{27}{8}+\frac{27}{8}-\frac{27}{4}=0
      \quad\checkmark
      $$

      **Derivación implícita.** Se deriva la igualdad entera respecto de $x$,
      recordando que $y$ es función de $x$ y que $3xy$ es un producto:

      $$
      3y^{2}y'+3x^{2}-3\left(y+xy'\right)=0
      $$

      Agrupando los términos con $y'$:

      $$
      y'\left(3y^{2}-3x\right)=3y-3x^{2}
      \qquad\Longrightarrow\qquad
      y'=\frac{y-x^{2}}{y^{2}-x}
      $$

      **En el punto.**

      $$
      y'\left(\tfrac32,\tfrac32\right)
      =\frac{\frac32-\frac94}{\frac94-\frac32}
      =\frac{-\frac34}{+\frac34}
      =-1
      $$

      El denominador no se anula, así que la tangente existe y no es vertical.

      **La recta.**

      $$
      y-\frac32=-\left(x-\frac32\right)
      \qquad\Longrightarrow\qquad
      x+y=3
      $$

      **Por qué tenía que salir $-1$.** La curva es el folio de Descartes, y es
      simétrica respecto de la recta $y=x$: intercambiar $x$ e $y$ deja la
      ecuación igual. El punto $\left(\frac32,\frac32\right)$ está sobre esa
      diagonal, así que la tangente allí es su propia reflexión respecto de
      ella: o es la diagonal, o es perpendicular. Y como la curva no es la
      diagonal, la pendiente tiene que ser $-1$. Es una comprobación de diez
      segundos que vale por todo el cálculo.

  - id: ex2021-5rec-3-mclaurin-sin-resolver-la-ecuacion
    titulo: El polinomio de McLaurin sin resolver la ecuación
    fuente: >-
      Ejercicio 3 · Quinta evaluación, PRIMER PARCIAL, 26 de abril de 2021 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Sea $y(x)$ una función que pasa por el punto $(0,1)$ tal que
      $y'=(x+1)y$. Calcular el polinomio de McLaurin de orden 3 de la función
      $y(x)$.
    pide: El polinomio de McLaurin de orden 3.

    pasos:
      - tipo: reconocer
        pregunta: |
          No nos dan $y(x)$, solo una ecuación que cumple. ¿Cómo se sacan los
          coeficientes?
        opciones:
          - texto: >-
              Derivando la propia ecuación una y otra vez y evaluando en $x=0$:
              cada derivada nueva se escribe con las anteriores, que ya se conocen
            correcta: true
            mensaje: |
              Eso es, y es la gracia del ejercicio. $y(0)$ lo da el punto,
              $y'(0)$ lo da la ecuación, $y''(0)$ sale de derivar la ecuación, y
              así. No hace falta resolverla.
          - texto: >-
              Resolviendo primero la ecuación, porque sin conocer $y(x)$ no se
              puede derivar
            mensaje: |
              Se puede, y de hecho la ecuación es separable y sale
              $y=e^{x+x^{2}/2}$. Pero después hay que componer dos series para
              llegar al grado 3, y eso es más largo y se presta a más errores que
              derivar tres veces.
          - texto: >-
              Faltan datos: un polinomio de orden 3 tiene cuatro coeficientes y
              solo nos dan una condición
            mensaje: |
              La ecuación diferencial **es** el resto de la información. Fija
              $y'$ a partir de $y$, y al derivarla fija $y''$ a partir de $y$ e
              $y'$, y así indefinidamente. Con una condición inicial y una
              ecuación de primer orden hay de sobra.

      - tipo: calcular
        titulo: La segunda derivada en cero
        pregunta: |
          ¿Cuánto vale $y''(0)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Te has dejado la regla del producto. $y'=(x+1)y$ es un producto de
              dos funciones de $x$, así que $y''=y+(x+1)y'$: el primer sumando es
              el que falta.
          - valor: '0'
            mensaje: |
              Has derivado $(x+1)y$ como si $y$ fuera una constante y luego has
              vuelto a derivar el $1$. Aquí $y$ depende de $x$, y por eso la
              cadena no se corta nunca.
        pista: |
          Deriva $y'=(x+1)y$ con la regla del producto y evalúa en $0$ usando
          $y(0)=1$ e $y'(0)=1$.
        desarrollo: |
          $$
          y'=(x+1)y
          \;\Longrightarrow\;
          y''=y+(x+1)y'
          $$

          $$
          y''(0)=y(0)+1\cdot y'(0)=1+1=2
          $$

          donde $y'(0)=(0+1)\cdot 1=1$.

      - tipo: calcular
        titulo: La tercera derivada en cero
        pregunta: |
          ¿Y $y'''(0)$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              Has derivado $y''=y+(x+1)y'$ olvidándote del primer sumando: su
              derivada es $y'$, y hay que sumarla. Sale
              $y'''=2y'+(x+1)y''$ y no $y'+(x+1)y''$.
          - valor: '2'
            mensaje: |
              Solo has derivado el segundo sumando y además a medias. La derivada
              de $(x+1)y'$ es $y'+(x+1)y''$, y a eso hay que añadirle el $y'$ que
              viene de derivar la $y$ suelta.
        pista: |
          Deriva $y''=y+(x+1)y'$ término a término; los dos aportan un $y'$.
        desarrollo: |
          $$
          y''=y+(x+1)y'
          \;\Longrightarrow\;
          y'''=y'+\left[y'+(x+1)y''\right]=2y'+(x+1)y''
          $$

          $$
          y'''(0)=2\cdot 1+1\cdot 2=4
          $$

      - tipo: calcular
        titulo: El coeficiente de x³
        pregunta: |
          ¿Cuál es el coeficiente de $x^{3}$ en el polinomio?
        respuesta:
          tipo: numero
          valor: '0.6666667'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '4'
            mensaje: |
              Ese es $y'''(0)$ a secas. El coeficiente de Taylor lleva el
              factorial debajo: $\frac{y'''(0)}{3!}=\frac{4}{6}$.
          - valor: '1.3333333'
            mensaje: |
              Has dividido entre $3$ en vez de entre $3!=6$. El denominador del
              término de grado $n$ es $n!$, no $n$.
          - valor: '0.1666667'
            mensaje: |
              Ese es el coeficiente de $x^{3}$ en la serie de $e^{x}$, que es
              $\frac{1}{6}$. Aquí el exponente no es $x$ sino $x+\frac{x^{2}}{2}$,
              y ese $\frac{x^{2}}{2}$ también aporta a grado 3.
        pista: |
          $a_{3}=\dfrac{y'''(0)}{3!}$.
        desarrollo: |
          $$
          P_{3}(x)=y(0)+y'(0)x+\frac{y''(0)}{2!}x^{2}+\frac{y'''(0)}{3!}x^{3}
          =1+x+x^{2}+\frac{2}{3}x^{3}
          $$

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El punto $(0,1)$ da $y(0)=1$, y la ecuación evaluada en $0$ da
              $y'(0)=(0+1)\cdot 1=1$.
          - texto: >-
              Derivando la ecuación, $y''=y+(x+1)y'$, y en $0$ vale
              $1+1=2$.
          - texto: >-
              Derivando otra vez, $y'''=2y'+(x+1)y''$, y en $0$ vale
              $2+2=4$.
          - texto: >-
              Con la fórmula de Taylor,
              $P_{3}(x)=1+x+\frac{2}{2!}x^{2}+\frac{4}{3!}x^{3}
              =1+x+x^{2}+\frac{2}{3}x^{3}$.
          - texto: >-
              La ecuación es separable y sale $y=e^{x+x^{2}/2}$; como el
              desarrollo de $e^{u}$ tiene $\frac{u^{3}}{6}$, el término de grado 3
              es $\frac{x^{3}}{6}$.
            trampa: true
            mensaje: |
              La solución sí es $y=e^{x+x^{2}/2}$, pero al componer las series hay
              que mirar **todos** los términos que caen en grado 3, no solo el que
              viene de $\frac{u^{3}}{6}$. El $\frac{x^{2}}{2}$ del exponente entra
              también por $\frac{u^{2}}{2}$: da $\frac{x^{3}}{2}$. Sumando,
              $\frac16+\frac12=\frac23$, que es lo que sale derivando.

    resolucion: |
      **La idea.** No hace falta resolver la ecuación. Un polinomio de McLaurin
      solo necesita los valores de $y$ y de sus derivadas en $x=0$, y la propia
      ecuación los va dando uno a uno.

      **Los cuatro valores.**

      $$
      y(0)=1
      \qquad\text{(el punto)}
      $$

      $$
      y'=(x+1)y
      \;\Longrightarrow\;
      y'(0)=1\cdot 1=1
      $$

      $$
      y''=y+(x+1)y'
      \;\Longrightarrow\;
      y''(0)=1+1=2
      $$

      $$
      y'''=2y'+(x+1)y''
      \;\Longrightarrow\;
      y'''(0)=2+2=4
      $$

      La regla del producto es el único sitio donde se falla: $(x+1)y$ tiene los
      dos factores dependiendo de $x$.

      **El polinomio.**

      $$
      P_{3}(x)=1+x+\frac{2}{2!}x^{2}+\frac{4}{3!}x^{3}
      =1+x+x^{2}+\frac{2}{3}x^{3}
      $$

      **La comprobación, por el camino largo.** La ecuación es separable:
      $\frac{dy}{y}=(x+1)dx$, de donde $\ln y=x+\frac{x^{2}}{2}$ y
      $y=e^{x+x^{2}/2}$. Desarrollando con $u=x+\frac{x^{2}}{2}$:

      $$
      e^{u}=1+u+\frac{u^{2}}{2}+\frac{u^{3}}{6}+\cdots
      $$

      Y recogiendo hasta grado 3: de $u$ sale $x+\frac{x^{2}}{2}$; de
      $\frac{u^{2}}{2}$ sale $\frac{x^{2}}{2}+\frac{x^{3}}{2}$; de
      $\frac{u^{3}}{6}$ sale $\frac{x^{3}}{6}$. En total

      $$
      1+x+x^{2}+\left(\frac12+\frac16\right)x^{3}
      =1+x+x^{2}+\frac{2}{3}x^{3}
      $$

      Coincide. Y de paso queda claro por qué el camino corto es el bueno: por el
      largo hay que acordarse de que el $\frac{x^{2}}{2}$ del exponente también
      llega a grado 3, que es donde se cae casi todo el mundo.
