        <g class="dg19-num">
          <text x="70.2" y="143.2" text-anchor="middle">a</text>
          <text x="430.2" y="143.2" text-anchor="middle">b</text>
          <text x="466.6" y="171.2">x</text>
          <text x="134.2" y="51.2" text-anchor="end">y</text>
        </g>
        <text class="dg19-A-et" x="258.8" y="91.6" text-anchor="middle">A</text>
        <text class="dg19-B-et" x="97.6" y="85.6" text-anchor="middle">B</text>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original. El original no nombra las
      curvas — averiguar cuál es cuál es el apartado a) —, así que aquí se
      llaman A y B para poder referirse a ellas. Las dos curvas del dibujo son
      un par exacto: la B es, de verdad, la derivada de la A.
      </figcaption>
      </figure>

      a) Identificar qué gráfica corresponde a $F(x)$ y qué gráfica corresponde
      a $F'(x)$.

      b) Estudiar el crecimiento, decrecimiento y los extremos de la función
      $g(x)=\left(F(x)\right)^{4}$.
    pide: Cuál es cuál, y el crecimiento y los extremos de la cuarta potencia.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál de las dos curvas es $F$?
        opciones:
          - texto: >-
              La A, porque la B se anula justo donde la A tiene su máximo, y la B
              es positiva mientras la A sube
            correcta: true
            mensaje: |
              Eso es. El corte de la derivada con el eje tiene que caer donde la
              función tiene la tangente horizontal, y aquí encaja: la B cruza el
              eje exactamente bajo el máximo de la A.
          - texto: >-
              La B, porque empieza más arriba y una función siempre está por
              encima de su derivada
            mensaje: |
              Estar por encima no significa nada: las dos gráficas están en
              escalas distintas y no se comparan. Y la prueba de fondo falla: la
              B baja durante casi todo el intervalo, así que su derivada tendría
              que ser negativa casi siempre, y la A es positiva en un tramo
              largo.
          - texto: >-
              No se puede decidir sin conocer las fórmulas
            mensaje: |
              Sí se puede, y es justo lo que pide el ejercicio: se comparan los
              ceros de una con los extremos de la otra. Es lectura de gráficas,
              no cálculo.

      - tipo: calcular
        titulo: En cuántos tramos se parte el intervalo
        pregunta: |
          Como $g'=4F^{3}F'$, el signo de $g'$ cambia en los ceros de $F$ y en
          los de $F'$. ¿En cuántos subintervalos queda partido $(a,b)$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Solo has partido por el cero de $F'$. Los ceros de $F$ también
              cuentan, porque el factor $F^{3}$ cambia de signo en ellos, y hay
              dos.
          - valor: '3'
            mensaje: |
              Te falta un punto de corte. $F$ se anula **dos** veces —una al
              principio, en el origen, y otra pasado su máximo— y $F'$ una: en
              total tres puntos, que parten el intervalo en cuatro.
          - valor: '5'
            mensaje: |
              Has contado un punto de más. Los que cambian el signo de $g'$ son
              los ceros de $F$ y los de $F'$: dos y uno. El mínimo de $F'$ no
              cuenta, porque ahí $F'$ no cambia de signo.
        pista: |
          Cuenta los ceros de $F$ y los de $F'$ dentro del intervalo, y recuerda
          que $n$ puntos parten un intervalo en $n+1$ trozos.
        desarrollo: |
          $F$ se anula en dos puntos: llamémoslos $x_{0}$ —el corte del origen— y
          $x_{2}$, ya pasado el máximo. $F'$ se anula en uno solo, $x_{1}$, que
          es donde $F$ tiene el máximo, y cumple $x_{0}<x_{1}<x_{2}$.

          Tres puntos parten $(a,b)$ en **cuatro** subintervalos:
          $(a,x_{0})$, $(x_{0},x_{1})$, $(x_{1},x_{2})$ y $(x_{2},b)$.

      - tipo: calcular
        titulo: Cuántos extremos relativos
        pregunta: |
          ¿Cuántos extremos relativos tiene $g$ en el interior del intervalo?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Has copiado los extremos de $F$, que en el interior tiene solo el
              máximo. Al elevar a la cuarta aparecen dos más: los ceros de $F$
              pasan a ser mínimos de $g$, porque $g\ge 0$ y ahí vale $0$.
          - valor: '2'
            mensaje: |
              Te falta uno. Son los dos ceros de $F$ —mínimos de $g$— más el
              máximo de $F$, que sigue siendo máximo de $g$ porque la cuarta
              potencia es creciente en los positivos.
          - valor: '4'
            mensaje: |
              Has contado un punto que no lo es. Los cuatro subintervalos dan
              tres fronteras interiores, y en cada una $g'$ cambia de signo: tres
              extremos, no cuatro.
        pista: |
          En cada uno de los tres puntos de corte, ¿cambia $g'$ de signo?
        desarrollo: |
          Con $g'=4F^{3}F'$, el signo es el producto de los de $F$ y $F'$:

          | tramo | $F$ | $F'$ | $g'$ | $g$ |
          |---|---|---|---|---|
          | $(a,x_{0})$ | $-$ | $+$ | $-$ | decrece |
          | $(x_{0},x_{1})$ | $+$ | $+$ | $+$ | crece |
          | $(x_{1},x_{2})$ | $+$ | $-$ | $-$ | decrece |
          | $(x_{2},b)$ | $-$ | $-$ | $+$ | crece |

          Cambia de signo en los tres puntos: **mínimo** en $x_{0}$, **máximo**
          en $x_{1}$ y **mínimo** en $x_{2}$.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              **a)** La curva B corta al eje justo donde la A tiene su máximo, y
              es positiva mientras la A sube y negativa mientras la A baja: la A
              es $F$ y la B es $F'$.
          - texto: >-
              **b)** $g'=4F^{3}F'$, y como $F^{3}$ tiene el mismo signo que $F$,
              el signo de $g'$ es el producto de los signos de $F$ y de $F'$.
          - texto: >-
              Los puntos donde puede cambiar son los dos ceros de $F$,
              $x_{0}$ y $x_{2}$, y el cero de $F'$, que es $x_{1}$, con
              $x_{0}<x_{1}<x_{2}$.
          - texto: >-
              $g$ decrece en $(a,x_{0})$, crece en $(x_{0},x_{1})$, decrece en
              $(x_{1},x_{2})$ y crece en $(x_{2},b)$.
          - texto: >-
              Por tanto hay mínimo en $x_{0}$, máximo en $x_{1}$ y mínimo en
              $x_{2}$; y los dos mínimos valen $0$, que es el menor valor
              posible de una cuarta potencia.
          - texto: >-
              En $x_{0}$ y $x_{2}$ se anulan a la vez $g'$ y $g''$, así que ahí
              $g$ tiene puntos de inflexión y no extremos.
            trampa: true
            mensaje: |
              La primera mitad es cierta:
              $g''=12F^{2}\left(F'\right)^{2}+4F^{3}F''$ y en un cero de $F$ se
              anulan los dos sumandos. Pero que $g''$ se anule no decide nada —el
              criterio de la segunda derivada simplemente no se aplica—; hay que
              mirar el signo de $g'$ a los lados. Y aún más rápido:
              $g=F^{4}\ge 0$ y en esos puntos vale $0$, así que son mínimos
              **absolutos**.

    resolucion: |
      **a) Cuál es cuál.** La regla es una sola: los ceros de la derivada caen
      bajo las tangentes horizontales de la función.

      La curva B corta al eje horizontal exactamente en la abscisa donde la
      curva A alcanza su máximo. Y el signo acompaña: B es positiva mientras A
      sube, y negativa mientras A baja. Por tanto

      $$
      A=F,
      \qquad
      B=F'
      $$

      Al revés no funciona: si B fuera $F$, su derivada tendría que ser negativa
      en casi todo el intervalo —B baja desde $a$ hasta muy cerca de $b$— y la
      curva A es positiva en un tramo largo.

      Un segundo indicio, por si acaso: B tiene un mínimo cerca de $b$, y ahí es
      donde A baja más deprisa. Encaja.

      **b) La cuarta potencia.** Llamemos $x_{0}$ y $x_{2}$ a los dos ceros de
      $F$ y $x_{1}$ al cero de $F'$, con $x_{0}<x_{1}<x_{2}$.

      $$
      g'(x)=4\left(F(x)\right)^{3}F'(x)
      $$

      Como $F^{3}$ tiene el mismo signo que $F$, el signo de $g'$ es el producto
      de los signos de $F$ y $F'$:

      | tramo | $F$ | $F'$ | $g'$ | $g$ |
      |---|---|---|---|---|
      | $(a,x_{0})$ | $-$ | $+$ | $-$ | decrece |
      | $(x_{0},x_{1})$ | $+$ | $+$ | $+$ | crece |
      | $(x_{1},x_{2})$ | $+$ | $-$ | $-$ | decrece |
      | $(x_{2},b)$ | $-$ | $-$ | $+$ | crece |

      **Los extremos.** En los tres puntos hay cambio de signo:

      - $x_{0}$: **mínimo**, y $g(x_{0})=0$.
      - $x_{1}$: **máximo**, el mismo punto donde $F$ tiene su máximo.
      - $x_{2}$: **mínimo**, y $g(x_{2})=0$.

      **La forma corta de verlo.** $g=F^{4}$ es siempre $\ge 0$, así que donde
      $F$ se anula $g$ toca su valor más bajo posible: esos dos puntos son
      mínimos absolutos, sin necesidad de ninguna derivada. Y como
      $t\mapsto t^{4}$ es creciente para $t\ge 0$ y decreciente para $t\le 0$,
      $g$ es grande donde $\left|F\right|$ es grande. Con eso solo, el dibujo de
      $g$ ya se puede esbozar: dos valles tocando el suelo y un pico entre
      ellos, más lo que suba en los extremos del intervalo, donde
      $\left|F\right|$ crece.

  - id: ex1819-5rec-4-darboux
    titulo: El teorema de Darboux, y por qué no basta con Bolzano
    fuente: >-
      Ejercicio 4 · Quinta evaluación, PRIMER CUATRIMESTRAL, 15 de abril de 2019 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 0
      comp4: 10
    enunciado: |
      Enunciar y demostrar el teorema de Darboux.
    pide: Enunciar y demostrar.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hipótesis pide el teorema de Darboux?
        opciones:
          - texto: >-
              Que $f$ sea derivable en todo $[a,b]$, extremos incluidos. **No**
              se pide que $f'$ sea continua
            correcta: true
            mensaje: |
              Exacto, y esa ausencia es todo el interés del teorema. Si $f'$
              fuera continua bastaría con Bolzano; Darboux dice que la propiedad
              de los valores intermedios la tiene **toda** derivada, sea continua
              o no.
          - texto: >-
              Que $f'$ sea continua en $[a,b]$, para poder aplicarle Bolzano
            mensaje: |
              Con esa hipótesis el teorema sobra: sería Bolzano aplicado a $f'$ y
              no haría falta ponerle nombre propio. Darboux existe justamente
              para los casos en los que $f'$ **no** es continua.
          - texto: >-
              Que $f$ sea continua en $[a,b]$ y derivable en $(a,b)$, como en
              Rolle
            mensaje: |
              Aquí hace falta más: el enunciado habla de $f'(a)$ y $f'(b)$, así
              que la derivada tiene que existir también en los extremos.

      - tipo: calcular
        titulo: El teorema, sobre un caso concreto
        pregunta: |
          Sea $f(x)=x^{3}-3x$ en $[0,2]$. Como $f'(0)=-3$ y $f'(2)=9$, Darboux
          garantiza un $c\in(0,2)$ con $f'(c)=0$. ¿Cuál es?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-1'
            mensaje: |
              Esa es la otra raíz de $3x^{2}-3=0$, y está fuera de $[0,2]$. El
              teorema afirma que hay un $c$ **dentro** del intervalo, y aquí es
              el positivo.
          - valor: '0'
            mensaje: |
              Ese es el extremo izquierdo, y allí $f'(0)=-3$, no $0$. Además
              Darboux garantiza un punto del **interior**.
          - valor: '3'
            mensaje: |
              Has resuelto $3x^{2}=3$ como $x^{2}=3$. Primero se divide entre
              $3$: $x^{2}=1$.
        pista: |
          Deriva y resuelve $f'(x)=0$ dentro de $[0,2]$.
        desarrollo: |
          $$
          f'(x)=3x^{2}-3=0
          \;\Longrightarrow\;
          x=\pm 1
          $$

          y la que está en $(0,2)$ es $c=1$. Aquí $f'$ es continua y Bolzano
          habría bastado; el ejemplo sirve para ver **qué** afirma el teorema,
          no para justificar que haga falta.

      - tipo: justificar
        titulo: La demostración
        pregunta: Ordena el enunciado y la demostración. Una pieza es falsa.
        piezas:
          - texto: >-
              **Enunciado.** Si $f$ es derivable en $[a,b]$ y $\lambda$ está
              entre $f'(a)$ y $f'(b)$, existe $c\in(a,b)$ tal que
              $f'(c)=\lambda$.
          - texto: >-
              Se supone, sin pérdida de generalidad,
              $f'(a)<\lambda<f'(b)$, y se define
              $g(x)=f(x)-\lambda x$, que es derivable en $[a,b]$ y por tanto
              continua.
          - texto: >-
              Por el teorema de Weierstrass, $g$ alcanza su mínimo absoluto en
              algún punto de $[a,b]$.
          - texto: >-
              $g'(a)=f'(a)-\lambda<0$, así que inmediatamente a la derecha de $a$
              hay puntos donde $g$ vale menos que en $a$: el mínimo no está en
              $a$.
          - texto: >-
              $g'(b)=f'(b)-\lambda>0$, así que inmediatamente a la izquierda de
              $b$ hay puntos donde $g$ vale menos que en $b$: el mínimo tampoco
              está en $b$.
          - texto: >-
              El mínimo está entonces en un punto interior $c$, y por el teorema
              de Fermat $g'(c)=0$, es decir $f'(c)=\lambda$.
          - texto: >-
              Como toda derivada es continua, basta aplicarle el teorema de
              Bolzano a $f'$ entre $a$ y $b$ y no hace falta nada más.
            trampa: true
            mensaje: |
              Una derivada no tiene por qué ser continua. El contraejemplo de
              siempre es
              $f(x)=x^{2}\operatorname{sen}\frac{1}{x}$ con $f(0)=0$: es
              derivable en todo $\mathbb{R}$, $f'(0)=0$, y sin embargo
              $f'(x)=2x\operatorname{sen}\frac1x-\cos\frac1x$ no tiene límite
              cuando $x\to 0$. Precisamente porque Bolzano no se puede aplicar
              hace falta Darboux.

    resolucion: |
      **Enunciado.** Sea $f$ derivable en $[a,b]$ y sea $\lambda$ un número
      comprendido entre $f'(a)$ y $f'(b)$. Entonces existe $c\in(a,b)$ tal que

      $$
      f'(c)=\lambda
      $$

      Dicho en corto: **la derivada de una función derivable tiene la propiedad
      de los valores intermedios**, aunque no sea continua.

      **Por qué no es Bolzano.** Bolzano se aplica a funciones continuas, y una
      derivada puede no serlo. El contraejemplo clásico:

      $$
      f(x)=
      \begin{cases}
      x^{2}\operatorname{sen}\dfrac{1}{x} & x\neq 0\\[6pt]
      0 & x=0
      \end{cases}
      $$

      es derivable en todo $\mathbb{R}$ —en el origen, $f'(0)=\lim_{h\to
      0}h\operatorname{sen}\frac1h=0$— y su derivada,
      $f'(x)=2x\operatorname{sen}\frac1x-\cos\frac1x$, oscila sin límite cuando
      $x\to 0$. Darboux dice que aun así $f'$ no puede saltarse ningún valor.

      **Demostración.** Supongamos $f'(a)<\lambda<f'(b)$; el otro caso es
      idéntico cambiando el signo. Se define

      $$
      g(x)=f(x)-\lambda x
      $$

      que es derivable en $[a,b]$, y por tanto continua, con
      $g'(x)=f'(x)-\lambda$.

      **1. El mínimo existe.** $g$ es continua en un intervalo cerrado y
      acotado, así que por el teorema de Weierstrass alcanza su mínimo absoluto
      en algún $c\in[a,b]$.

      **2. El mínimo no está en $a$.** Como

      $$
      g'(a)=f'(a)-\lambda<0
      $$

      y $g'(a)=\lim_{h\to 0^{+}}\frac{g(a+h)-g(a)}{h}$, para $h$ pequeño y
      positivo el cociente es negativo, luego $g(a+h)<g(a)$. Hay puntos donde
      $g$ vale menos que en $a$: el mínimo no puede estar ahí.

      **3. El mínimo no está en $b$.** Del mismo modo,

      $$
      g'(b)=f'(b)-\lambda>0
      $$

      y $g'(b)=\lim_{h\to 0^{-}}\frac{g(b+h)-g(b)}{h}$ con $h<0$; para que ese
      cociente sea positivo con denominador negativo hace falta
      $g(b+h)<g(b)$. Otra vez hay puntos mejores: el mínimo tampoco está en $b$.

      **4. Conclusión.** El mínimo está en un punto interior $c\in(a,b)$. En un
      extremo interior de una función derivable, el teorema de Fermat da
      $g'(c)=0$, es decir

      $$
      f'(c)-\lambda=0
      \qquad\Longrightarrow\qquad
      f'(c)=\lambda
      \qquad\blacksquare
      $$

      **Dónde se usa cada hipótesis.** La derivabilidad en los extremos es lo
      que permite hablar de $f'(a)$ y $f'(b)$ y, sobre todo, lo que permite los
      pasos 2 y 3. La continuidad de $g$ —que sale gratis de la
      derivabilidad— es lo que permite Weierstrass. Y en ningún momento se ha
      supuesto que $f'$ sea continua: ahí está el teorema.
