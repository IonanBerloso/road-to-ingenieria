ejercicios:
  - id: ex1819-5rec-1-la-sucesion-que-se-cae-en-el-cien
    titulo: La sucesión que se desploma en el término cien
    fuente: >-
      Ejercicio 1 · Quinta evaluación, PRIMER CUATRIMESTRAL, 15 de abril de 2019 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 2
      comp4: 8
    enunciado: |
      Sea la sucesión

      $$
      \left\{a_{n}\right\}_{n\in\mathbb{N}}=
      \begin{cases}
      5-\dfrac{2}{n} & n\ge 100\\[6pt]
      n^{3} & n<100
      \end{cases}
      $$

      a) Definir formalmente los siguientes conceptos: sucesión creciente y
      sucesión convergente.

      b) Estudiar el crecimiento y la convergencia de la sucesión
      $\left\{a_{n}\right\}_{n\in\mathbb{N}}$.
    pide: Las dos definiciones formales, y el crecimiento y la convergencia de esta sucesión.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los 99 primeros términos son $1, 8, 27,\ldots,99^{3}$, y el término
          100 vale $4{,}98$. ¿Estropea eso la convergencia?
        opciones:
          - texto: >-
              No: la convergencia solo depende de la cola. Cambiar, quitar o
              añadir un número **finito** de términos no altera ni el carácter ni
              el límite
            correcta: true
            mensaje: |
              Eso es, y es lo que el ejercicio quiere que digas. La definición de
              límite empieza con «existe un $n_{0}$ tal que para todo
              $n>n_{0}$…»: lo que pase antes de $n_{0}$ no aparece en ninguna
              parte.
          - texto: >-
              Sí: como algunos términos llegan a valer $970\,299$, la sucesión no
              puede acercarse a $5$
            mensaje: |
              Acercarse no es haber estado siempre cerca. Basta con que a partir
              de un término la distancia al límite sea menor que cualquier
              $\varepsilon$, y aquí desde $n=100$ esa distancia es
              $\frac{2}{n}$, que se hace tan pequeña como se quiera.
          - texto: >-
              Sí, porque para converger hay que estar acotado y $n^{3}$ no lo
              está
            mensaje: |
              $n^{3}$ no está acotada, pero aquí solo se usa hasta $n=99$: el
              mayor valor que toma la sucesión es $99^{3}$, un número grande pero
              finito. La sucesión entera **sí** está acotada.

      - tipo: calcular
        titulo: El límite
        pregunta: |
          ¿A qué converge la sucesión?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '970299'
            mensaje: |
              Ese es $99^{3}$, el término más grande de toda la sucesión. Un
              límite no es el mayor valor que se alcanza: es al que se acerca la
              cola.
          - valor: '4.98'
            mensaje: |
              Ese es $a_{100}$, el primer término de la cola. A partir de ahí la
              sucesión sigue subiendo —$5-\frac{2}{n}$ crece con $n$— y se acerca
              a $5$ sin llegar nunca.
        pista: |
          Solo cuenta la cola: para $n\ge 100$ la sucesión es $5-\frac{2}{n}$.
        desarrollo: |
          $$
          \lim_{n\to\infty}a_{n}
          =\lim_{n\to\infty}\left(5-\frac{2}{n}\right)=5
          $$

          Los 99 primeros términos no intervienen: dado $\varepsilon>0$, basta
          tomar $n_{0}=\max\left\{100,\frac{2}{\varepsilon}\right\}$ para que
          $\left|a_{n}-5\right|=\frac{2}{n}<\varepsilon$ siempre que $n>n_{0}$.

      - tipo: calcular
        titulo: Dónde se rompe el crecimiento
        pregunta: |
          La sucesión no es creciente. ¿Para qué valor de $n$ falla por primera y
          única vez la desigualdad $a_{n}\le a_{n+1}$?
        respuesta:
          tipo: numero
          valor: '99'
          tolerancia: 0.001
          formato: un número natural
        distractores:
          - valor: '100'
            mensaje: |
              El salto está **entre** $a_{99}=970\,299$ y $a_{100}=4{,}98$, así
              que la desigualdad que falla es la de $n=99$. De $a_{100}$ en
              adelante ya vuelve a crecer.
          - valor: '1'
            mensaje: |
              En $n=1$ la sucesión crece: $a_{1}=1$ y $a_{2}=8$. La rama $n^{3}$
              es creciente en todo su tramo, y la rama $5-\frac{2}{n}$ también en
              el suyo. Lo único que falla es la costura entre las dos.
        pista: |
          Compara los dos términos que están a caballo entre las dos ramas.
        desarrollo: |
          $$
          a_{99}=99^{3}=970\,299,
          \qquad
          a_{100}=5-\frac{2}{100}=4{,}98
          $$

          $a_{99}>a_{100}$, así que la desigualdad falla en $n=99$ y solo ahí:
          $n^{3}$ crece para $n<100$ y $5-\frac{2}{n}$ crece para $n\ge 100$.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              **Creciente:** $\left\{a_{n}\right\}$ es creciente si
              $a_{n}\le a_{n+1}$ para todo $n\in\mathbb{N}$.
          - texto: >-
              **Convergente:** $\left\{a_{n}\right\}$ converge a $L$ si para todo
              $\varepsilon>0$ existe $n_{0}$ tal que
              $\left|a_{n}-L\right|<\varepsilon$ para todo $n>n_{0}$.
          - texto: >-
              **No es creciente**, y falla en un solo sitio: $a_{99}=970\,299$ y
              $a_{100}=4{,}98$. Sí lo es a partir de $n=100$.
          - texto: >-
              **Converge a 5**, porque la definición solo mira lo que pasa a
              partir de un $n_{0}$, y con
              $n_{0}=\max\left\{100,\frac{2}{\varepsilon}\right\}$ se cumple
              $\left|a_{n}-5\right|=\frac{2}{n}<\varepsilon$.
          - texto: >-
              Está acotada: entre $1$ y $99^{3}$, y desde $n=100$ entre $4{,}98$
              y $5$.
          - texto: >-
              Como no es creciente y no es decreciente, no es monótona, y una
              sucesión que no es monótona no puede converger.
            trampa: true
            mensaje: |
              La monotonía es **suficiente** junto con la acotación —el teorema
              dice «monótona y acotada implica convergente»— pero no es
              necesaria. Esta misma sucesión lo demuestra: no es monótona y
              converge. Y hay ejemplos más claros, como
              $a_{n}=\frac{(-1)^{n}}{n}$, que salta de signo en cada término y
              converge a cero.

    resolucion: |
      **a) Las dos definiciones.**

      $\left\{a_{n}\right\}$ es **creciente** si $a_{n}\le a_{n+1}$ para todo
      $n\in\mathbb{N}$. (Estrictamente creciente si la desigualdad es estricta.)

      $\left\{a_{n}\right\}$ **converge** a $L$ si

      $$
      \forall\varepsilon>0\;\;\exists n_{0}\in\mathbb{N}:\;
      n>n_{0}\;\Longrightarrow\;\left|a_{n}-L\right|<\varepsilon
      $$

      Fíjate en dónde está el peso: **existe un $n_{0}$**. Lo que la sucesión
      haga antes de ese término no entra en la definición. Ese es todo el
      ejercicio.

      **b) El crecimiento.** Las dos ramas crecen por separado:

      - Para $n<100$, $n^{3}$ es creciente.
      - Para $n\ge 100$, $5-\frac{2}{n}$ es creciente, porque $\frac{2}{n}$
        decrece.

      Pero en la costura se rompe:

      $$
      a_{99}=99^{3}=970\,299
      \qquad\text{y}\qquad
      a_{100}=5-\frac{2}{100}=4{,}98
      $$

      Así que la sucesión **no es creciente**. Sí lo es a partir de $n=100$, y
      eso es lo que hay que decir: no es creciente, pero es creciente **desde un
      término en adelante**.

      **La convergencia.** Converge a $5$. Dado $\varepsilon>0$, se toma

      $$
      n_{0}=\max\left\{100,\frac{2}{\varepsilon}\right\}
      $$

      y para $n>n_{0}$ se cumple a la vez que estamos en la segunda rama y que

      $$
      \left|a_{n}-5\right|=\frac{2}{n}<\varepsilon
      $$

      **Lo que enseña el ejercicio.** Que los 99 primeros términos lleguen hasta
      casi un millón es una provocación deliberada: parece que una sucesión así
      no puede converger a $5$. Puede. La convergencia es una propiedad de la
      **cola**, y una cola no cambia porque delante haya cualquier cosa, siempre
      que sea una cantidad finita de términos.

      Y de paso desmonta el error de creer que hace falta ser monótona para
      converger: aquí no lo es y converge igual.

  - id: ex1819-5rec-2-tres-mclaurin-y-uno-que-no-existe
    titulo: Tres desarrollos de McLaurin, y el tercero no existe
    fuente: >-
      Ejercicio 2 · Quinta evaluación, PRIMER CUATRIMESTRAL, 15 de abril de 2019 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Calcular el desarrollo en serie de McLaurin de las funciones siguientes:

      a) $f(x)=e^{x}$

      b) $f(x)=x^{4}e^{x}$

      c) $f(x)=e^{-\left|x\right|}$
    pide: Los tres desarrollos, o la razón de que alguno no exista.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que hacer con el apartado c)?
        opciones:
          - texto: >-
              Comprobar antes de nada si la función es derivable en $0$: no lo
              es, así que **no tiene** desarrollo de McLaurin
            correcta: true
            mensaje: |
              Exacto. Por la derecha $f(x)=e^{-x}$ y su derivada en $0$ vale
              $-1$; por la izquierda $f(x)=e^{x}$ y vale $+1$. Sin $f'(0)$ no hay
              ni siquiera el término de grado uno.
          - texto: >-
              Sustituir $x$ por $-\left|x\right|$ en la serie de $e^{x}$
            mensaje: |
              Eso produce una expresión correcta, sí, pero no es un desarrollo de
              McLaurin. Un desarrollo de McLaurin es una serie de **potencias de
              $x$**, $\sum a_{n}x^{n}$, y $\left|x\right|$ no es una potencia de
              $x$.
          - texto: >-
              Aprovechar que $e^{-\left|x\right|}$ es par y quedarse solo con las
              potencias pares
            mensaje: |
              La función es par, es cierto, y si tuviera desarrollo solo tendría
              potencias pares. Pero no lo tiene: en $0$ hace un pico, y un pico
              no se aproxima por polinomios que pasen suavemente por ahí.

      - tipo: calcular
        titulo: El coeficiente de x⁶
        pregunta: |
          En el desarrollo de $x^{4}e^{x}$, ¿cuál es el coeficiente de
          $x^{6}$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.0013889'
            mensaje: |
              Ese es $\frac{1}{6!}$, el coeficiente de $x^{6}$ en $e^{x}$ a
              secas. Al multiplicar por $x^{4}$ todos los exponentes suben
              cuatro: el $x^{6}$ sale del $x^{2}$ de la exponencial.
          - valor: '0.1666667'
            mensaje: |
              Ese es $\frac{1}{3!}$, y $\frac{x^{3}}{3!}$ multiplicado por
              $x^{4}$ da $x^{7}$, no $x^{6}$. Hay que retroceder cuatro, no tres.
          - valor: '0.0416667'
            mensaje: |
              Ese es $\frac{1}{4!}$. El $4$ del enunciado es el exponente del
              factor $x^{4}$, no un factorial: no aparece dividiendo en ninguna
              parte.
        pista: |
          $x^{4}e^{x}=\sum_{n\ge 0}\frac{x^{n+4}}{n!}$. ¿Qué $n$ da $x^{6}$?
        desarrollo: |
          $$
          x^{4}e^{x}=x^{4}\sum_{n=0}^{\infty}\frac{x^{n}}{n!}
          =\sum_{n=0}^{\infty}\frac{x^{n+4}}{n!}
          $$

          El término de grado $6$ es el de $n=2$:

          $$
          \frac{x^{6}}{2!}
          \qquad\Longrightarrow\qquad
          a_{6}=\frac12
          $$

      - tipo: calcular
        titulo: La sexta derivada en cero
        pregunta: |
          Con ese coeficiente, ¿cuánto vale $f^{(6)}(0)$ para
          $f(x)=x^{4}e^{x}$?
        respuesta:
          tipo: numero
          valor: '360'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '720'
            mensaje: |
              Ese es $6!$, que sería la respuesta si el coeficiente fuera $1$.
              Hay que multiplicarlo por $a_{6}=\frac12$.
          - valor: '0.5'
            mensaje: |
              Eso es el coeficiente, no la derivada. La relación es
              $a_{6}=\frac{f^{(6)}(0)}{6!}$, así que la derivada es
              $a_{6}\cdot 6!$.
          - valor: '30'
            mensaje: |
              Has usado $\frac{6!}{4!}=30$. El factorial que aparece en la
              relación con la derivada es el del grado del término, $6!$, y solo
              ese.
        pista: |
          $a_{n}=\dfrac{f^{(n)}(0)}{n!}$.
        desarrollo: |
          $$
          f^{(6)}(0)=6!\cdot a_{6}=720\cdot\frac12=360
          $$

          Es el ejemplo de para qué sirve una serie: derivar seis veces
          $x^{4}e^{x}$ a mano es un trabajo largo y lleno de sitios donde
          equivocarse; leer el coeficiente de la serie son dos líneas.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              **a)** $e^{x}=\displaystyle\sum_{n=0}^{\infty}\frac{x^{n}}{n!}$,
              válido para todo $x\in\mathbb{R}$.
          - texto: >-
              **b)** Multiplicar por $x^{4}$ es desplazar los exponentes:
              $x^{4}e^{x}=\displaystyle\sum_{n=0}^{\infty}\frac{x^{n+4}}{n!}$, y
              también vale para todo $x$.
          - texto: >-
              De ahí se lee, por ejemplo,
              $a_{6}=\frac{1}{2}$ y por tanto $f^{(6)}(0)=360$.
          - texto: >-
              **c)** $e^{-\left|x\right|}$ vale $e^{-x}$ a la derecha de $0$ y
              $e^{x}$ a la izquierda, así que sus derivadas laterales en $0$ son
              $-1$ y $+1$.
          - texto: >-
              Como esas dos no coinciden, $f$ **no es derivable en $0$** y no
              tiene desarrollo de McLaurin: la serie ni siquiera se puede empezar
              a escribir.
          - texto: >-
              **c)** Para $x\ge 0$ la función es $e^{-x}$, cuya serie es
              $\sum\frac{(-1)^{n}x^{n}}{n!}$; y como
              $e^{-\left|x\right|}$ es par, esa misma serie sirve para todo $x$.
            trampa: true
            mensaje: |
              La serie describe bien la rama derecha, y solo la rama derecha. Si
              valiera para todo $x$, la función sería derivable en $0$ con
              $f'(0)=-1$ — y por la izquierda la derivada es $+1$. Además, una
              serie de potencias es siempre infinitamente derivable donde
              converge, así que ninguna puede representar a una función con un
              pico. Un desarrollo de McLaurin tiene que valer en un entorno de
              $0$, a los dos lados.

    resolucion: |
      **a) La exponencial.**

      $$
      e^{x}=\sum_{n=0}^{\infty}\frac{x^{n}}{n!}
      =1+x+\frac{x^{2}}{2!}+\frac{x^{3}}{3!}+\cdots
      $$

      válido para todo $x\in\mathbb{R}$: el radio de convergencia es infinito.

      **b) Multiplicada por $x^{4}$.** No hay que derivar nada. Multiplicar una
      serie de potencias por $x^{4}$ es desplazar todos los exponentes:

      $$
      x^{4}e^{x}=\sum_{n=0}^{\infty}\frac{x^{n+4}}{n!}
      =x^{4}+x^{5}+\frac{x^{6}}{2!}+\frac{x^{7}}{3!}+\cdots
      $$

      También para todo $x$. Y de aquí se leen las derivadas en el origen sin
      derivar: como $a_{n}=\frac{f^{(n)}(0)}{n!}$,

      $$
      f^{(6)}(0)=6!\cdot\frac{1}{2!}=360
      $$

      Los cuatro primeros coeficientes son cero, es decir
      $f(0)=f'(0)=f''(0)=f'''(0)=0$, que se puede comprobar aparte.

      **c) La que no existe.** Aquí el enunciado cambia de pregunta sin avisar.

      $$
      e^{-\left|x\right|}=
      \begin{cases}
      e^{-x} & x\ge 0\\
      e^{x} & x<0
      \end{cases}
      $$

      La función es continua en $0$ —las dos ramas valen $1$— pero **no es
      derivable**:

      $$
      f'(0^{+})=-1,
      \qquad
      f'(0^{-})=+1
      $$

      Y sin $f'(0)$ no hay coeficiente de grado uno, así que no hay desarrollo
      de McLaurin. Ni siquiera se puede empezar.

      Hay una forma más de verlo, y conviene tenerla: una serie de potencias es
      infinitamente derivable dentro de su intervalo de convergencia. Una
      función con un pico no puede ser la suma de una serie de potencias
      centrada justo en el pico.

      **Lo que se puede decir**, y es lo que da los puntos de COMP4: para
      $x\ge 0$ la función coincide con $e^{-x}$ y ahí sí vale
      $\sum\frac{(-1)^{n}x^{n}}{n!}$; y para $x\le 0$ coincide con $e^{x}$. Dos
      desarrollos laterales distintos, ninguno válido en un entorno del origen.

  - id: ex1819-5rec-3-cual-de-las-dos-es-la-derivada
    titulo: Cuál de las dos curvas es la derivada, y qué hace la cuarta potencia
    fuente: >-
      Ejercicio 3 · Quinta evaluación, PRIMER CUATRIMESTRAL, 15 de abril de 2019 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      La figura muestra las gráficas de una función $F(x)$ y de su derivada
      $F'(x)$, definidas en el intervalo $[a,b]$.

      <figure class="figura-examen">
      <svg viewBox="0 0 480 370" role="img" width="480" height="370"
           aria-labelledby="dg19-t dg19-d">
        <title id="dg19-t">Las graficas de una funcion y de su derivada sobre el intervalo a b</title>
        <desc id="dg19-d">Sobre unos ejes hay dos curvas dibujadas en el intervalo de
        a a b. La curva A entra por abajo a la izquierda, sube cortando al eje
        horizontal en el origen, alcanza un maximo hacia la mitad derecha del
        intervalo, y despues baja cortando otra vez al eje y sigue bajando hasta b.
        La curva B entra alta por arriba a la izquierda, baja hasta un tramo casi
        horizontal poco despues del origen, sigue bajando, corta al eje justo debajo
        del maximo de la curva A, y llega a un minimo cerca de b antes de repuntar.
        El intervalo a b esta marcado con un trazo grueso sobre el eje
        horizontal.</desc>
