# Dos cuatrimestrales de cuatro ejercicios y cuarenta puntos, el formato corto.
# Es el único cuadernillo del corpus que se titula «CÁLCULO. INDUSTRIALES» y el
# único que imprime la norma en la cabecera: «No está permitido el uso de
# calculadora en el examen. Se valorará la presentación». Los dos avisos
# confirman por escrito lo que hasta ahora era palabra del alumno (CLAUDE.md §09).
# El ejercicio 1 del segundo cuatrimestral no tiene puntos de cálculo: cuatro de
# COMP1 y seis de COMP4, y consiste en emparejar seis mapas de curvas de nivel
# con seis pares de derivadas parciales.
