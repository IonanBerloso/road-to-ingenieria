        <text class="esp19-l" x="6.1" y="158.4" fill="var(--live)">(x, y) = eᵗ(cos 2t, −sen 2t)</text>
      </svg>
      <figcaption>
      La trayectoria (x(t), y(t)) del sistema. Gira en sentido horario con periodo π
      —eso lo fija la parte imaginaria 2 de las raíces— y se aleja como eᵗ, que es
      lo que fija la parte real 1.
      </figcaption>
      </figure>

      **Qué está diciendo la solución.** El par $\left(x,y\right)$ es
      $e^{t}\left(\cos2t,\,-\operatorname{sen}2t\right)$: un punto que gira en
      **sentido horario** con velocidad angular $2$ mientras su distancia al
      origen crece como $e^{t}$. Es una espiral que se escapa.

      Los dos números que la gobiernan son las raíces del denominador,
      $s=1\pm2i$:

      - la **parte real** $+1$ fija el ritmo al que crece la amplitud —$e^{t}$—,
      - la **parte imaginaria** $2$ fija la velocidad de giro, con periodo $\pi$.

      Si el sistema fuese $x'=-x+2y$, $y'=-2x-y$, las raíces serían $-1\pm2i$ y la
      misma espiral iría hacia dentro. El acoplamiento cruzado con signos opuestos
      —$+2y$ arriba, $-2x$ abajo— es lo que produce la rotación; los términos
      diagonales, lo que produce el crecimiento.
