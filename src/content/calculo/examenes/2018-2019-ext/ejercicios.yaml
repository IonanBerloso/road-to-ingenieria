      </svg>
      <figcaption>
      Los seis diagramas de curvas de nivel del enunciado, redibujados. En cada
      curva se indica su cota. Los tres primeros son circunferencias centradas en el
      origen; los tres últimos, familias de la misma parábola desplazada.
      </figcaption>
      </figure>

      Sean los siguientes valores de derivadas parciales de las funciones
      $F\left(x,y\right)$ en el punto $P\left(1,0\right)$. Con estos datos, decir
      en cada caso (a), b), c), d), e), f)) qué diagrama de curvas de nivel
      (1, 2, 3, 4, 5 ó 6) le corresponde a la función que tiene esos valores de
      derivadas parciales en $P\left(1,0\right)$. Razona tu respuesta.

      | | $F_{x}\left(1,0\right)$ | $F_{y}\left(1,0\right)$ |
      |---|---|---|
      | a) | $2$ | $-1$ |
      | b) | $-2$ | $0$ |
      | c) | $8$ | $0$ |
      | d) | $-2$ | $1$ |
      | e) | $4$ | $0$ |
      | f) | $-8$ | $4$ |
    pide: El diagrama que corresponde a cada uno de los seis casos, razonado.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué relación hay entre el gradiente y las curvas de nivel?
        opciones:
          - texto: >-
              El gradiente es **perpendicular** a la curva de nivel que pasa por
              el punto, apunta hacia donde $F$ crece, y su módulo es mayor donde
              las curvas están más apretadas
            correcta: true
            mensaje: |
              Las tres cosas, y las tres se usan aquí: la dirección elige entre
              circunferencias y parábolas, el sentido elige el signo, y el módulo
              elige entre mapas de la misma forma pero distinta escala.
          - texto: El gradiente es tangente a la curva de nivel
            mensaje: |
              Justo al revés. A lo largo de una curva de nivel $F$ no cambia, así
              que la derivada direccional en la dirección tangente es cero: el
              gradiente es perpendicular a esa dirección.
          - texto: >-
              El gradiente apunta siempre hacia donde $F$ decrece
            mensaje: |
              Apunta hacia donde **crece**; el de máximo descenso es su opuesto,
              $-\nabla F$. Ese signo es exactamente lo que separa aquí el
              diagrama (1) del (3).

      - tipo: calcular
        titulo: El caso c)
        pregunta: |
          ¿Qué diagrama corresponde al caso c), con $F_{x}=8$ y $F_{y}=0$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: el número del diagrama, del 1 al 6
        distractores:
          - valor: '3'
            mensaje: |
              El (3) también es de circunferencias crecientes, pero más
              **separadas**: su nivel $c$ está en el radio $\sqrt{c/2}$, o sea
              $F=2\left(x^{2}+y^{2}\right)$, y eso da $F_{x}=4$, no $8$. Ese es
              el caso e).
          - valor: '1'
            mensaje: |
              En el (1) las cotas **bajan** hacia fuera —$-1,-2,-3,-4$—, así que
              $F_{x}$ es negativa en $P$. Con $F_{x}=8$ la función tiene que
              crecer al alejarse del origen.
          - valor: '6'
            mensaje: |
              El (6) es de parábolas, y en un mapa de parábolas
              $y=x^{2}+\text{cte}$ la derivada respecto de $y$ nunca es cero.
              Aquí $F_{y}=0$ pide simetría de revolución.
        pista: |
          En el (2), el nivel $1$ está a radio $0{,}5$ y el nivel $4$ a radio $1$.
        desarrollo: |
          En el diagrama (2) el nivel $c$ está en el radio $r=\frac{\sqrt c}{2}$
          —$c=1$ en $r=0{,}5$, $c=4$ en $r=1$, $c=9$ en $r=1{,}5$—, así que
          $c=4r^{2}$:

          $$
          F\left(x,y\right)=4\left(x^{2}+y^{2}\right)
          \;\Longrightarrow\;
          \nabla F=\left(8x,\,8y\right)
          \;\Longrightarrow\;
          \nabla F\left(1,0\right)=\left(8,0\right)
          $$

      - tipo: calcular
        titulo: El caso f)
        pregunta: |
          ¿Qué diagrama corresponde al caso f), con $F_{x}=-8$ y $F_{y}=4$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: el número del diagrama, del 1 al 6
        distractores:
          - valor: '4'
            mensaje: |
              El (4) tiene las mismas parábolas pero las cotas van de una en una
              por cada unidad de altura del vértice: es $F=y-x^{2}$, con
              $F_{y}=1$. Ese es el caso d). El (6) va cuatro veces más deprisa.
          - valor: '5'
            mensaje: |
              El (5) tiene las cotas al revés —crecen hacia abajo—, así que
              $F_{y}$ es negativa. Es $F=x^{2}-y$, el caso a).
          - valor: '3'
            mensaje: |
              El (3) es de circunferencias, y ahí $F_{y}\left(1,0\right)=0$ por
              simetría. Un $F_{y}$ distinto de cero en $P$ exige que las curvas de
              nivel no sean circunferencias centradas en el origen.
        pista: |
          En el (6) el vértice de la parábola de cota $c$ está en $y=\frac{c}{4}$.
        desarrollo: |
          En el (6) las parábolas son $y=x^{2}+k$ y su cota es $c=4k$ —el vértice
          $k=-1$ lleva la cota $-4$, el $k=0$ la cota $0$—. Como
          $k=y-x^{2}$:

          $$
          F\left(x,y\right)=4\left(y-x^{2}\right)
          \;\Longrightarrow\;
          \nabla F=\left(-8x,\,4\right)
          \;\Longrightarrow\;
          \nabla F\left(1,0\right)=\left(-8,4\right)
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento del emparejamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Si $F_{y}\left(1,0\right)=0$ el gradiente en $P$ es horizontal, y
              eso solo pasa en los mapas de circunferencias: los casos b), c) y e)
              van a los diagramas (1), (2) y (3).
          - texto: >-
              Dentro de esos tres, el signo de $F_{x}$ separa el (1) —cotas
              negativas, decrecientes hacia fuera— de los otros dos, y el módulo
              separa el (2), con cotas $4r^{2}$, del (3), con $2r^{2}$.
          - texto: >-
              Los casos a), d) y f) tienen $F_{y}\neq0$, así que van a los mapas
              de parábolas, y el signo de $F_{y}$ dice hacia dónde crecen las
              cotas.
          - texto: >-
              En los diagramas (1), (2) y (3) las curvas de nivel son
              circunferencias centradas en el origen, así que en
              $P\left(1,0\right)$ el gradiente es **vertical**.
            trampa: true
            mensaje: |
              Al revés. El gradiente es perpendicular a la curva de nivel, y en
              $\left(1,0\right)$ la tangente a una circunferencia centrada en el
              origen es **vertical**; luego el gradiente es **horizontal**. Esa
              confusión es justo la que el ejercicio está midiendo, y es la razón
              de que los tres casos con $F_{y}=0$ sean exactamente los tres mapas
              circulares.
    resolucion: |
      **La idea, en una frase.** El gradiente es perpendicular a la curva de
      nivel, apunta hacia donde la función crece, y su módulo mide lo apretadas
      que están las curvas. Con eso, cada par de números elige su mapa sin
      calcular nada.

      **Paso 1 · quién tiene $F_{y}=0$.** En $P\left(1,0\right)$, sobre el eje
      OX. Si las curvas de nivel son circunferencias centradas en el origen, la
      tangente en $\left(1,0\right)$ es vertical, así que el gradiente es
      horizontal y $F_{y}=0$. Eso deja emparejados de golpe dos grupos de tres:

      | $F_{y}=0$ | mapas circulares | b), c), e) ↔ (1), (2), (3) |
      |---|---|---|
      | $F_{y}\neq0$ | mapas de parábolas | a), d), f) ↔ (4), (5), (6) |

      **Paso 2 · leer la ley de cada mapa circular.** Basta con mirar en qué
      radio cae cada cota:

      | mapa | cotas y radios | ley | $\nabla F\left(1,0\right)$ |
      |---|---|---|---|
      | (1) | $-1$ en $r=1$, $-4$ en $r=2$ | $F=-\left(x^{2}+y^{2}\right)$ | $\left(-2,0\right)$ |
      | (2) | $1$ en $r=0{,}5$, $4$ en $r=1$, $9$ en $r=1{,}5$ | $F=4\left(x^{2}+y^{2}\right)$ | $\left(8,0\right)$ |
      | (3) | $2$ en $r=1$, $4$ en $r=\sqrt2$, $6$ en $r=\sqrt3$ | $F=2\left(x^{2}+y^{2}\right)$ | $\left(4,0\right)$ |

      El (1) es el único con cotas negativas, y por eso es el único con $F_{x}<0$.
      Entre el (2) y el (3), el que tiene las curvas más apretadas tiene el
      gradiente mayor.

      **Paso 3 · los mapas de parábolas.** Los tres son familias
      $y=x^{2}+k$; lo que cambia es cómo se etiquetan.

      | mapa | cota de la parábola de vértice $k$ | ley | $\nabla F\left(1,0\right)$ |
      |---|---|---|---|
      | (4) | $c=k$ | $F=y-x^{2}$ | $\left(-2,1\right)$ |
      | (5) | $c=-k$ | $F=x^{2}-y$ | $\left(2,-1\right)$ |
      | (6) | $c=4k$ | $F=4\left(y-x^{2}\right)$ | $\left(-8,4\right)$ |

      El (4) y el (5) tienen el mismo dibujo con las cotas invertidas; el (6)
      tiene el mismo dibujo otra vez, pero las cotas van de cuatro en cuatro por
      unidad de vértice, y por eso su gradiente es cuatro veces mayor.

      **El resultado.**

      $$
      \boxed{\;
      \text{a)}\to(5),\quad
      \text{b)}\to(1),\quad
      \text{c)}\to(2),\quad
      \text{d)}\to(4),\quad
      \text{e)}\to(3),\quad
      \text{f)}\to(6)
      \;}
      $$

      **La comprobación que cierra el ejercicio.** Los seis casos y los seis
      mapas se emparejan **uno a uno**, sin repetir ninguno y sin dejar ninguno
      libre. Eso no está garantizado por el enunciado, así que cuando sale es la
      mejor prueba de que la lectura es correcta: si dos casos hubieran caído en
      el mismo mapa, habría un error en alguna de las leyes.

      **Cómo se escribe esto en el examen.** Seis de los diez puntos son COMP 4:
      no basta con la lista final. Hay que decir, para cada emparejamiento, cuál
      de las tres propiedades del gradiente lo decide —dirección, sentido o
      módulo—, y eso son seis frases cortas, no seis números.

  - id: ex1819-ext-6-el-campo-conservativo-en-el-espacio
    titulo: Un campo en el espacio que no depende del camino
    fuente: >-
      Ejercicio 2 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 27 de
      junio de 2019 · Cálculo. Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Sea la integral
      $\displaystyle\int_{AB}\left(yz+y-1\right)dx+\left(xz+x\right)dy
      +\left(xy+3z^{2}\right)dz$
      con $A\left(0,2,0\right)$ y $B\left(\sqrt2,1,1\right)$.

      a) Estudiar si la integral depende del camino recorrido.

      b) Calcular, si existe, la función potencial $f\left(x,y,z\right)$.

      c) Calcular el valor de la integral.
    pide: Si depende del camino, la función potencial y el valor.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se comprueba que una integral de línea en el espacio no depende
          del camino?
        opciones:
          - texto: >-
              Viendo que el rotacional es nulo —$P_{y}=Q_{x}$, $P_{z}=R_{x}$,
              $Q_{z}=R_{y}$— en un dominio simplemente conexo
            correcta: true
            mensaje: |
              Eso es. En el espacio son **tres** igualdades cruzadas, no una. Y la
              hipótesis del dominio no es decorativa: aquí el campo es polinómico
              en todo $\mathbb{R}^{3}$, que es simplemente conexo, y conviene
              decirlo.
          - texto: Calculándola por dos caminos distintos y viendo si coincide
            mensaje: |
              Que coincida en dos caminos no demuestra que coincida en todos.
              Sirve para sospechar, o para detectar un error, pero no es prueba.
          - texto: Basta con que el campo sea continuo en todo el espacio
            mensaje: |
              La continuidad no basta. El campo $\left(-y,x,0\right)$ es continuo
              en todo $\mathbb{R}^{3}$ y su integral sobre una circunferencia
              alrededor del eje OZ no vale cero.

      - tipo: calcular
        titulo: El término que solo depende de z
        pregunta: |
          En la función potencial $f=xyz+xy-x+g\left(z\right)$, ¿cuál es el
          coeficiente de $z^{3}$ en $g\left(z\right)$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              El $3$ es el del campo, $3z^{2}$. Al **integrar** respecto de $z$
              queda $\frac{3z^{3}}{3}=z^{3}$: el coeficiente se va.
          - valor: '0'
            mensaje: |
              Si $g$ fuese constante, $f_{z}$ valdría solo $xy$, y el campo pide
              $xy+3z^{2}$. Falta la primitiva de $3z^{2}$.
          - valor: '0.3333'
            mensaje: |
              $\frac13$ saldría de **dividir** entre $3$ dos veces. Integrar
              $3z^{2}$ es multiplicar por $z$ y dividir entre el nuevo exponente:
              $3\cdot\frac{z^{3}}{3}=z^{3}$.
        pista: |
          $f_{z}$ tiene que valer $xy+3z^{2}$, y de $f=xyz+xy-x+g\left(z\right)$
          sale $f_{z}=xy+g'\left(z\right)$.
        desarrollo: |
          $$
          f_{z}=xy+g'\left(z\right)=xy+3z^{2}
          \;\Longrightarrow\;
          g'\left(z\right)=3z^{2}
          \;\Longrightarrow\;
          g\left(z\right)=z^{3}+C
          $$

      - tipo: calcular
        titulo: El valor de la integral
        pregunta: |
          ¿Cuánto vale la integral de $A$ a $B$?
        respuesta:
          tipo: numero
          valor: '2.4142'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '3.8284'
            mensaje: |
              $2\sqrt2+1$ sale de perder el término $-x$ del potencial. Ese $-1$
              del campo, $\left(yz+y-1\right)$, aporta $-\sqrt2$ al llegar a $B$.
          - valor: '1.4142'
            mensaje: |
              $\sqrt2$ sale de olvidar el $z^{3}$: en $B$ vale $1^{3}=1$, y es lo
              único que hace que el resultado no sea un múltiplo de $\sqrt2$.
          - valor: '-2.4142'
            mensaje: |
              Signo cambiado: has hecho $f\left(A\right)-f\left(B\right)$. La
              regla de Barrow para campos conservativos es
              $f\left(\text{final}\right)-f\left(\text{inicial}\right)$.
        pista: |
          $f\left(B\right)-f\left(A\right)$ con $f=xyz+xy-x+z^{3}$.
        desarrollo: |
          $$
          f\left(A\right)=f\left(0,2,0\right)=0+0-0+0=0
          $$

          $$
          f\left(B\right)=f\left(\sqrt2,1,1\right)
          =\sqrt2\cdot1\cdot1+\sqrt2\cdot1-\sqrt2+1^{3}
          =\sqrt2+1
          $$

          $$
          I=f\left(B\right)-f\left(A\right)=\sqrt2+1\approx2{,}4142
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Las tres igualdades cruzadas se cumplen: $P_{y}=Q_{x}=z+1$,
              $P_{z}=R_{x}=y$ y $Q_{z}=R_{y}=x$.
          - texto: >-
              El campo es polinómico en todo $\mathbb{R}^{3}$, que es simplemente
              conexo, así que ser irrotacional basta para ser conservativo.
          - texto: >-
              Integrando $P$ respecto de $x$ y ajustando con las otras dos
              componentes sale $f=xyz+xy-x+z^{3}$.
          - texto: >-
              Como el campo es conservativo, la integral entre $A$ y $B$ vale
              cero.
            trampa: true
            mensaje: |
              Lo que vale cero en un campo conservativo es la integral sobre una
              curva **cerrada**. Entre dos puntos distintos vale
              $f\left(B\right)-f\left(A\right)$, que solo es cero si los dos
              puntos están en la misma superficie de nivel del potencial. Aquí
              $f\left(A\right)=0$ y $f\left(B\right)=\sqrt2+1$.
    resolucion: |
      **a) ¿Depende del camino?** El campo es

      $$
      \vec F=\left(\underbrace{yz+y-1}_{P},\;
      \underbrace{xz+x}_{Q},\;
      \underbrace{xy+3z^{2}}_{R}\right)
      $$

      En el espacio hay que comprobar **tres** igualdades, no una:

      | | |
      |---|---|
      | $P_{y}=z+1$ | $Q_{x}=z+1$ ✓ |
      | $P_{z}=y$ | $R_{x}=y$ ✓ |
      | $Q_{z}=x$ | $R_{y}=x$ ✓ |

      Es decir, $\operatorname{rot}\vec F=\vec 0$. Y como el campo es polinómico
      —definido y de clase $C^{1}$ en todo $\mathbb{R}^{3}$, que es simplemente
      conexo—, irrotacional implica conservativo:

      $$
      \boxed{\;\text{la integral no depende del camino}\;}
      $$

      La hipótesis del dominio hay que decirla. Sin ella el resultado es falso:
      el campo $\left(\frac{-y}{x^{2}+y^{2}},\frac{x}{x^{2}+y^{2}},0\right)$ es
      irrotacional y **no** es conservativo, porque su dominio tiene el eje OZ
      quitado.

      **b) El potencial, integrando en cadena.**

      $$
      f_{x}=yz+y-1
      \;\Longrightarrow\;
      f=xyz+xy-x+g\left(y,z\right)
      $$

      $$
      f_{y}=xz+x+g_{y}=xz+x
      \;\Longrightarrow\;
      g_{y}=0
      \;\Longrightarrow\;
      g=g\left(z\right)
      $$

      $$
      f_{z}=xy+g'\left(z\right)=xy+3z^{2}
      \;\Longrightarrow\;
      g\left(z\right)=z^{3}+C
      $$

      $$
      \boxed{\;f\left(x,y,z\right)=xyz+xy-x+z^{3}+C\;}
      $$

      Cada paso reduce lo que queda por determinar: primero una función de dos
      variables, luego de una, luego una constante. Si en el segundo paso hubiera
      quedado algo con $x$, el campo no sería conservativo y habría un error
      antes.

      **c) El valor.** Regla de Barrow para campos conservativos: la integral es
      el incremento del potencial entre los extremos, y la constante $C$ se va.

      $$
      f\left(A\right)=f\left(0,2,0\right)=0
      $$

      $$
      f\left(B\right)=f\left(\sqrt2,1,1\right)
      =\sqrt2+\sqrt2-\sqrt2+1=\sqrt2+1
      $$

      $$
      \boxed{\;I=\sqrt2+1\approx2{,}4142\;}
      $$

      **Por qué el $\sqrt2$ del enunciado no complica nada.** Parece puesto para
      asustar, y de hecho dos de los tres términos con $\sqrt2$ se cancelan entre
      sí: $xyz+xy-x$ en $B$ vale $\sqrt2+\sqrt2-\sqrt2$. El resultado lo decide el
      $z^{3}$, que no lleva $x$. Es una señal de que el enunciado está
      construido, no improvisado.

  - id: ex1819-ext-7-la-edo-que-resuena-consigo-misma
    titulo: La EDO cuyo segundo miembro ya era solución
    fuente: >-
      Ejercicio 3 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 27 de
      junio de 2019 · Cálculo. Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Resolver la EDO $y''-3y'+2y=2xe^{x}$.
    pide: La solución general.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué no sirve probar con $y_{p}=\left(Ax+B\right)e^{x}$?
        opciones:
          - texto: >-
              Porque $1$ es raíz de la ecuación característica: cualquier
              $\left(Ax+B\right)e^{x}$… bueno, al menos $e^{x}$, ya resuelve la
              homogénea, y hay que multiplicar por $x$
            correcta: true
            mensaje: |
              Eso es la **resonancia**. Al sustituir $y_{p}=\left(Ax+B\right)e^{x}$
              el término independiente se anula solo y queda una ecuación
              imposible: $-2A x$ tendría que valer $2x$ y a la vez el resto
              cuadrar, y no hay manera con un polinomio de grado 1.
          - texto: >-
              Sí sirve; el método de coeficientes indeterminados no distingue
              casos
            mensaje: |
              Sí los distingue, y este es el caso que los obliga. Prueba a
              sustituir: el sistema que sale no tiene solución.
          - texto: >-
              Porque el segundo miembro lleva una $x$, y eso obliga a subir un
              grado
            mensaje: |
              El grado del polinomio ya está contemplado en $Ax+B$. Lo que obliga
              al factor $x$ extra no es la $x$ del segundo miembro, sino que su
              exponencial coincida con una raíz de la característica.

      - tipo: calcular
        titulo: El coeficiente de x²
        pregunta: |
          Con $y_{p}=\left(Ax^{2}+Bx\right)e^{x}$, ¿cuánto vale $A$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Signo. Al sustituir queda $-2A=2$, no $2A=2$: el coeficiente de $x$
              sale con signo menos porque la raíz doble no es $1$ sino simple, y
              la diferencia entre las dos raíces es $2-1=1$.
          - valor: '-0.5'
            mensaje: |
              $-\frac12$ saldría de $-4A=2$. El coeficiente de $x$ tras sustituir
              es $\left(4A+B\right)-3\left(2A+B\right)+2B=-2A$.
          - valor: '2'
            mensaje: |
              El $2$ es el del segundo miembro, $2xe^{x}$. Hay que resolver
              $-2A=2$ para llegar a $A$.
        pista: |
          Al sustituir, el coeficiente de $x\,e^{x}$ queda $-2A$ y tiene que
          valer $2$.
        desarrollo: |
          Con $y_{p}=\left(Ax^{2}+Bx\right)e^{x}$:

          $$
          y_{p}'=\left(Ax^{2}+\left(2A+B\right)x+B\right)e^{x}
          $$

          $$
          y_{p}''=\left(Ax^{2}+\left(4A+B\right)x+2A+2B\right)e^{x}
          $$

          Sustituyendo, el término en $x^{2}$ se cancela y queda

          $$
          \left[-2Ax+\left(2A-B\right)\right]e^{x}=2xe^{x}
          \;\Longrightarrow\;
          -2A=2
          \;\Longrightarrow\;
          A=-1
          $$

      - tipo: calcular
        titulo: El coeficiente de x
        pregunta: |
          ¿Y cuánto vale $B$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Con $B=0$ quedaría $2A-B=-2\neq0$, y el término independiente del
              segundo miembro es cero. Hay que compensarlo.
          - valor: '2'
            mensaje: |
              Signo. La condición es $2A-B=0$ con $A=-1$, o sea $B=2A=-2$.
          - valor: '-1'
            mensaje: |
              $-1$ es $A$. $B$ sale de la segunda ecuación, la del término
              independiente.
        pista: |
          El término independiente tras sustituir es $2A-B$, y el segundo miembro
          no tiene ninguno.
        desarrollo: |
          $$
          2A-B=0
          \;\Longrightarrow\;
          B=2A=-2
          $$

          $$
          y_{p}=\left(-x^{2}-2x\right)e^{x}=-x\left(x+2\right)e^{x}
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La característica $r^{2}-3r+2=0$ tiene raíces $r=1$ y $r=2$, así que
              $y_{h}=C_{1}e^{x}+C_{2}e^{2x}$.
          - texto: >-
              Como el $1$ del segundo miembro coincide con una raíz **simple**,
              se ensaya $y_{p}=x\left(Ax+B\right)e^{x}$, multiplicando por $x$ una
              sola vez.
          - texto: >-
              Sustituyendo sale $A=-1$ y $B=-2$, o sea
              $y_{p}=-\left(x^{2}+2x\right)e^{x}$.
          - texto: >-
              Como la raíz $r=1$ es simple y la $r=2$ también, hay que multiplicar
              por $x^{2}$: una vez por cada raíz.
            trampa: true
            mensaje: |
              El factor $x^{k}$ lleva por exponente la **multiplicidad de la raíz
              que aparece en el segundo miembro**, no el número de raíces de la
              ecuación. Aquí el segundo miembro trae $e^{1\cdot x}$ y $r=1$ es
              raíz simple: $k=1$. La raíz $r=2$ no pinta nada porque el segundo
              miembro no lleva $e^{2x}$.
    resolucion: |
      **La homogénea.**

      $$
      r^{2}-3r+2=\left(r-1\right)\left(r-2\right)=0
      \;\Longrightarrow\;
      r=1,\;r=2
      $$

      $$
      y_{h}=C_{1}e^{x}+C_{2}e^{2x}
      $$

      **La trampa del enunciado.** El segundo miembro es $2xe^{x}$, y ese $e^{x}$
      es exactamente una de las soluciones de la homogénea. Si se ensaya
      $y_{p}=\left(Ax+B\right)e^{x}$, la parte $Be^{x}$ se anula sola al
      sustituir y el sistema queda sin solución. **Hay resonancia**, y la regla es
      multiplicar por $x^{k}$ con $k$ la multiplicidad de esa raíz. Aquí $r=1$ es
      simple, así que $k=1$:

      $$
      y_{p}=x\left(Ax+B\right)e^{x}=\left(Ax^{2}+Bx\right)e^{x}
      $$

      **Las derivadas.** Conviene sacar $e^{x}$ factor común y trabajar solo con
      el polinomio:

      $$
      y_{p}'=\left[Ax^{2}+\left(2A+B\right)x+B\right]e^{x}
      $$

      $$
      y_{p}''=\left[Ax^{2}+\left(4A+B\right)x+\left(2A+2B\right)\right]e^{x}
      $$

      **La sustitución**, término a término:

      | grado | $y_{p}''$ | $-3y_{p}'$ | $+2y_{p}$ | total |
      |---|---|---|---|---|
      | $x^{2}$ | $A$ | $-3A$ | $2A$ | $0$ |
      | $x$ | $4A+B$ | $-6A-3B$ | $2B$ | $-2A$ |
      | $1$ | $2A+2B$ | $-3B$ | $0$ | $2A-B$ |

      Que el coeficiente de $x^{2}$ salga cero **solo** no es casualidad: es la
      firma de la resonancia, y sirve de comprobación de que las derivadas están
      bien.

      $$
      -2A=2,\qquad 2A-B=0
      \;\Longrightarrow\;
      A=-1,\quad B=-2
      $$

      $$
      \boxed{\;y=C_{1}e^{x}+C_{2}e^{2x}-\left(x^{2}+2x\right)e^{x}\;}
      $$

      **La comprobación.** Con $y_{p}=-\left(x^{2}+2x\right)e^{x}$:

      $$
      y_{p}'=-\left(x^{2}+4x+2\right)e^{x},
      \qquad
      y_{p}''=-\left(x^{2}+6x+6\right)e^{x}
      $$

      $$
      y_{p}''-3y_{p}'+2y_{p}
      =-e^{x}\left[\left(x^{2}+6x+6\right)-3\left(x^{2}+4x+2\right)
      +2\left(x^{2}+2x\right)\right]
      $$

      $$
      =-e^{x}\left[-2x\right]=2xe^{x}\;\checkmark
      $$

      **Una nota sobre el $-2x$ del corchete.** Que sobreviva justo un término de
      grado 1 es lo que hace que $A$ y $B$ estén determinados y que el ensayo de
      grado 2 sea el correcto: ni sobra ni falta un grado.

  - id: ex1819-ext-8-el-sistema-que-sale-en-espiral
    titulo: Un sistema acoplado que sale en espiral
    fuente: >-
      Ejercicio 4 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 27 de
      junio de 2019 · Cálculo. Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Utilizando la transformada de Laplace resolver el sistema

      $$
      \begin{cases}
      x'\left(t\right)=x\left(t\right)+2y\left(t\right)\\
      y'\left(t\right)=-2x\left(t\right)+y\left(t\right)\\
      x\left(0\right)=1;\;y\left(0\right)=0
      \end{cases}
      $$
    pide: Las dos funciones x(t) e y(t).

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué queda al transformar las dos ecuaciones?
        opciones:
          - texto: >-
              El sistema algebraico $\left(s-1\right)X-2Y=1$ y
              $2X+\left(s-1\right)Y=0$
            correcta: true
            mensaje: |
              Eso es. El $1$ del segundo miembro de la primera es $x\left(0\right)$,
              y el $0$ de la segunda es $y\left(0\right)$. Laplace no desacopla el
              sistema: lo convierte en dos ecuaciones lineales con dos incógnitas.
          - texto: >-
              Dos ecuaciones independientes, una para $X$ y otra para $Y$
            mensaje: |
              Siguen acopladas. Transformar cambia derivadas por multiplicaciones
              por $s$, pero no separa las incógnitas: eso hay que hacerlo después,
              resolviendo el sistema.
          - texto: $sX=X+2Y$ y $sY=-2X+Y$
            mensaje: |
              Faltan las condiciones iniciales.
              $\mathcal{L}\left\{x'\right\}=sX-x\left(0\right)$, y ese
              $x\left(0\right)=1$ es el único término independiente de todo el
              sistema: sin él, la única solución sería la nula.

      - tipo: calcular
        titulo: El cuadrado completado
        pregunta: |
          Al despejar sale $X=\dfrac{s-1}{\left(s-1\right)^{2}+a}$. ¿Cuánto vale
          $a$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              El $2$ es el del acoplamiento. En el determinante del sistema entra
              su **cuadrado**: $\left(s-1\right)^{2}+4$.
          - valor: '-4'
            mensaje: |
              El determinante es
              $\left(s-1\right)^{2}-\left(-2\right)\left(2\right)
              =\left(s-1\right)^{2}+4$. Los dos signos del acoplamiento se
              multiplican y dan $+4$: por eso la solución oscila en vez de crecer
              en dos exponenciales.
          - valor: '5'
            mensaje: |
              $5$ saldría si el sistema fuese $x'=x+2y$, $y'=-2x+2y$. Con los
              coeficientes del enunciado el determinante es
              $\left(s-1\right)^{2}+4$.
        pista: |
          El determinante del sistema es
          $\left(s-1\right)^{2}-\left(-2\right)\cdot2$.
        desarrollo: |
          $$
          \begin{vmatrix}s-1 & -2\\ 2 & s-1\end{vmatrix}
          =\left(s-1\right)^{2}+4
          $$

          $$
          X=\frac{1}{\left(s-1\right)^{2}+4}
          \begin{vmatrix}1 & -2\\ 0 & s-1\end{vmatrix}
          =\frac{s-1}{\left(s-1\right)^{2}+4}
          $$

      - tipo: calcular
        titulo: El coeficiente de la segunda función
        pregunta: |
          En $y\left(t\right)=c\,e^{t}\operatorname{sen}2t$, ¿cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Signo. $Y=\frac{-2}{\left(s-1\right)^{2}+4}$, con el $-2$ arriba: el
              acoplamiento de la segunda ecuación es $-2x$, no $+2x$.
          - valor: '-2'
            mensaje: |
              El $-2$ es el numerador de $Y$ tal cual. La tabla pide
              $\frac{\omega}{\left(s-a\right)^{2}+\omega^{2}}$ con $\omega=2$, así
              que ese $2$ **es** el $\omega$ y el coeficiente que queda fuera es
              $-1$.
          - valor: '-0.5'
            mensaje: |
              $-\frac12$ sale de dividir el numerador entre $\omega$ cuando lo que
              hay que hacer es **identificarlo** con $\omega$. Numerador $-2$ y
              $\omega=2$ dan cociente $-1$.
        pista: |
          $\mathcal{L}^{-1}\left\{\frac{2}{\left(s-1\right)^{2}+4}\right\}
          =e^{t}\operatorname{sen}2t$.
        desarrollo: |
          $$
          Y=\frac{-2}{\left(s-1\right)^{2}+2^{2}}
          =-\,\frac{2}{\left(s-1\right)^{2}+2^{2}}
          \;\Longrightarrow\;
          y\left(t\right)=-e^{t}\operatorname{sen}2t
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Transformando con las condiciones iniciales:
              $\left(s-1\right)X-2Y=1$ y $2X+\left(s-1\right)Y=0$.
          - texto: >-
              El determinante es $\left(s-1\right)^{2}+4$, así que
              $X=\frac{s-1}{\left(s-1\right)^{2}+4}$ e
              $Y=\frac{-2}{\left(s-1\right)^{2}+4}$.
          - texto: >-
              El desplazamiento $s\to s-1$ en la variable transformada es un
              factor $e^{t}$ en la función, así que
              $x=e^{t}\cos2t$ e $y=-e^{t}\operatorname{sen}2t$.
          - texto: >-
              Como el denominador $\left(s-1\right)^{2}+4$ no tiene raíces reales,
              la solución no puede crecer y se queda acotada.
            trampa: true
            mensaje: |
              Que no haya raíces reales dice que la solución **oscila**, no que
              esté acotada. Las raíces son $s=1\pm2i$, y lo que decide el
              crecimiento es su parte real: aquí vale $+1$, así que la amplitud es
              $e^{t}$ y se dispara. Con parte real negativa se amortiguaría; con
              cero, oscilaría con amplitud constante.
    resolucion: |
      **Transformar las dos ecuaciones.** Con
      $\mathcal{L}\left\{x'\right\}=sX-x\left(0\right)$ y
      $x\left(0\right)=1$, $y\left(0\right)=0$:

      $$
      \begin{cases}
      sX-1=X+2Y\\
      sY-0=-2X+Y
      \end{cases}
      \;\Longrightarrow\;
      \begin{cases}
      \left(s-1\right)X-2Y=1\\
      2X+\left(s-1\right)Y=0
      \end{cases}
      $$

      **Resolver el sistema.** El determinante es

      $$
      \Delta=\left(s-1\right)^{2}-\left(-2\right)\cdot2=\left(s-1\right)^{2}+4
      $$

      y por Cramer

      $$
      X=\frac{1}{\Delta}\begin{vmatrix}1&-2\\0&s-1\end{vmatrix}
      =\frac{s-1}{\left(s-1\right)^{2}+4},
      \qquad
      Y=\frac{1}{\Delta}\begin{vmatrix}s-1&1\\2&0\end{vmatrix}
      =\frac{-2}{\left(s-1\right)^{2}+4}
      $$

      **Antitransformar.** Las dos están ya en forma de tabla, con
      $\omega=2$ y desplazamiento $s\to s-1$:

      | | transformada | función |
      |---|---|---|
      | $x$ | $\frac{s-1}{\left(s-1\right)^{2}+2^{2}}$ | $e^{t}\cos2t$ |
      | $y$ | $-\frac{2}{\left(s-1\right)^{2}+2^{2}}$ | $-e^{t}\operatorname{sen}2t$ |

      $$
      \boxed{\;x\left(t\right)=e^{t}\cos2t,
      \qquad
      y\left(t\right)=-e^{t}\operatorname{sen}2t\;}
      $$

      **Las comprobaciones**, que valen dos puntos y se hacen en un minuto:

      | qué | cuenta |
      |---|---|
      | $x\left(0\right)$ | $1\cdot1=1$ ✓ |
      | $y\left(0\right)$ | $-1\cdot0=0$ ✓ |
      | $x'=x+2y$ | $e^{t}\cos2t-2e^{t}\operatorname{sen}2t$ por los dos lados ✓ |
      | $y'=-2x+y$ | $-2e^{t}\cos2t-e^{t}\operatorname{sen}2t$ por los dos lados ✓ |

