ejercicios:
  - id: ex1819-ext-1-el-arco-capaz-y-la-elipse-imposible
    titulo: Un arco capaz, y una elipse que no existe
    fuente: >-
      Ejercicio 1 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 27 de
      junio de 2019 · Cálculo. Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      a) Calcular y representar gráficamente el lugar geométrico de los afijos
      de los números complejos $z$ que verifican la siguiente condición:

      $$
      \arg\left(\frac{z+i}{z-i}\right)=\frac{\pi}{4}
      $$

      b) Obtener, sin calcular, el lugar geométrico de los afijos de los números
      complejos $z$ que verifican la condición
      $\left|z-\left(i+1\right)\right|+\left|z-\left(i-1\right)\right|=1$.
    pide: Los dos lugares geométricos, y el primero dibujado.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dice geométricamente la condición del apartado a)?
        opciones:
          - texto: >-
              Que desde $z$ el segmento que une $-i$ con $i$ se ve bajo un
              ángulo de $\frac{\pi}{4}$: es un **arco capaz**
            correcta: true
            mensaje: |
              Eso es. El argumento de un cociente es la resta de argumentos:
              $\arg\left(z+i\right)-\arg\left(z-i\right)$ es el ángulo que
              forman las visuales desde $z$ a los puntos $-i$ y $i$.
          - texto: Que $z$ está en la bisectriz del primer cuadrante
            mensaje: |
              Eso sería $\arg z=\frac{\pi}{4}$, una condición sobre el propio
              $z$. Aquí el argumento es el de un **cociente**, y eso mide un
              ángulo entre dos direcciones, no una dirección.
          - texto: >-
              Que $\left|z+i\right|=\left|z-i\right|$, o sea la mediatriz de
              $-i$ e $i$
            mensaje: |
              La mediatriz sale de igualar los **módulos**. Aquí la condición es
              sobre el argumento, y da una circunferencia, no una recta.

      - tipo: calcular
        titulo: El radio del arco
        pregunta: |
          ¿Cuál es el radio de la circunferencia que contiene el arco?
        respuesta:
          tipo: numero
          valor: '1.4142'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es la **semicuerda**, la distancia del origen a $i$. El radio
              sale del teorema del ángulo inscrito: cuerda $=2R\operatorname{sen}
              \alpha$ con $\alpha=\frac{\pi}{4}$.
          - valor: '2'
            mensaje: |
              $2$ es la longitud de la cuerda, de $-i$ a $i$. El radio es
              $\frac{2}{2\operatorname{sen}\frac{\pi}{4}}=\sqrt2$.
          - valor: '2.8284'
            mensaje: |
              $2\sqrt2$ sale de olvidar el $2$ del denominador en
              $\text{cuerda}=2R\operatorname{sen}\alpha$.
        pista: |
          Teorema del ángulo inscrito: una cuerda de longitud $c$ vista bajo un
          ángulo $\alpha$ vive en una circunferencia de radio
          $\frac{c}{2\operatorname{sen}\alpha}$.
        desarrollo: |
          La cuerda va de $-i$ a $i$ y mide $2$. El ángulo inscrito es
          $\frac{\pi}{4}$, así que

          $$
          2=2R\operatorname{sen}\frac{\pi}{4}=2R\frac{\sqrt2}{2}
          \;\Longrightarrow\;
          R=\sqrt2
          $$

      - tipo: calcular
        titulo: El centro
        pregunta: |
          ¿Dónde está el centro de esa circunferencia?
        respuesta:
          tipo: complejo
          valor: '1'
          tolerancia: 0.01
          formato: forma binómica, por ejemplo 1 o 1+0i
        distractores:
          - valor: '-1'
            mensaje: |
              El centro $-1$ da la circunferencia simétrica, y en ella el
              cociente tiene argumento $-\frac{\pi}{4}$, no $+\frac{\pi}{4}$. El
              signo del ángulo es el que elige entre las dos.
          - valor: '0'
            mensaje: |
              El origen es el punto medio de la cuerda, no el centro. Si lo fuera,
              el radio sería $1$ y el ángulo inscrito $\frac{\pi}{2}$.
          - valor: '1i'
            mensaje: |
              El centro está sobre la **mediatriz** de la cuerda, y la cuerda va
              por el eje imaginario: su mediatriz es el eje real. Un centro con
              parte imaginaria no equidista de $i$ y de $-i$.
        pista: |
          El centro equidista de $i$ y de $-i$, así que está en el eje real, a
          distancia $\sqrt{R^{2}-1}$ del origen.
        desarrollo: |
          $$
          d=\sqrt{R^{2}-1^{2}}=\sqrt{2-1}=1
          $$

          Hay dos candidatos, $1$ y $-1$. Se prueba uno: en $z=1+\sqrt2$,

          $$
          \arg\left(1+\sqrt2+i\right)-\arg\left(1+\sqrt2-i\right)
          =2\arctan\frac{1}{1+\sqrt2}=2\cdot\frac{\pi}{8}=\frac{\pi}{4}
          \;\checkmark
          $$

          Con el centro en $-1$ saldría $-\frac{\pi}{4}$.

      - tipo: justificar
        pregunta: Ordena el argumento del apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              La condición dice que la suma de las distancias de $z$ a
              $1+i$ y a $-1+i$ vale $1$.
          - texto: >-
              La distancia entre esos dos puntos es $2$, y la desigualdad
              triangular obliga a que la suma sea siempre $\ge2$.
          - texto: >-
              Como $1<2$, no hay ningún $z$ que cumpla la condición: el lugar
              geométrico es el **conjunto vacío**.
          - texto: >-
              Es una elipse de focos $1+i$ y $-1+i$ con $2a=1$, o sea de semieje
              mayor $\frac12$.
            trampa: true
            mensaje: |
              La forma es la de una elipse, pero para que exista hace falta
              $2a>2c$: la constante tiene que superar a la distancia focal. Aquí
              $2a=1$ y $2c=2$, así que $b^{2}=a^{2}-c^{2}=\frac14-1<0$ y no hay
              elipse ninguna. Por eso el enunciado dice **«sin calcular»**: el
              ejercicio se resuelve mirando, no despejando.
    resolucion: |
      **a) El argumento de un cociente es una diferencia de ángulos.**

      $$
      \arg\left(\frac{z+i}{z-i}\right)
      =\arg\left(z-\left(-i\right)\right)-\arg\left(z-i\right)
      $$

      Y esa diferencia es, literalmente, el ángulo bajo el cual se ve el
      segmento que une $-i$ con $i$ desde el punto $z$. La condición dice que ese
      ángulo vale $\frac{\pi}{4}$ siempre: eso es un **arco capaz**.

      **El radio, por el teorema del ángulo inscrito.** La cuerda mide $2$ y el
      ángulo inscrito es $\frac{\pi}{4}$:

      $$
      \text{cuerda}=2R\operatorname{sen}\alpha
      \;\Longrightarrow\;
      2=2R\frac{\sqrt2}{2}
      \;\Longrightarrow\;
      R=\sqrt2
      $$

      **El centro** está en la mediatriz de la cuerda —el eje real— a distancia
      $\sqrt{R^{2}-1}=1$ del origen. Quedan dos candidatos, $1$ y $-1$, y el
      **signo** del ángulo elige:

      | centro | en $z=$ | $\arg$ del cociente |
      |---|---|---|
      | $1$ | $1+\sqrt2$ | $+\frac{\pi}{4}$ ✓ |
      | $-1$ | $-1-\sqrt2$ | $-\frac{\pi}{4}$ ✗ |

      **Y falta decir qué trozo.** El ángulo central que abarca la cuerda es
      $2\alpha=\frac{\pi}{2}$, así que la cuerda parte la circunferencia en un
      arco de $90°$ y otro de $270°$. Los puntos del arco **grande** la ven bajo
      $\frac{\pi}{4}$; los del pequeño, bajo $\frac{3\pi}{4}$.

      $$
      \boxed{\;\text{el arco mayor de }\left|z-1\right|=\sqrt2,
      \text{ sin los extremos }\pm i\;}
      $$

      Los extremos se quitan porque en $z=i$ el cociente no está definido y en
      $z=-i$ vale $0$, que no tiene argumento. El arco vive entero en el
      semiplano $x>0$.

