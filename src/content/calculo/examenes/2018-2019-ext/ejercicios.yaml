      **Por qué el enunciado dice «sin calcular».** Si uno se lanza a la
      ecuación de la elipse, sale $a=\frac12$, $c=1$ y
      $b^{2}=a^{2}-c^{2}=-\frac34$: un semieje al cuadrado negativo. Es el mismo
      resultado, pero contado al revés y después de tres cambios de variable. La
      versión buena es la de una línea, y da los dos puntos de COMP 4.

  - id: ex1819-ext-2-el-supremo-el-infimo-y-el-salto
    titulo: Dos parámetros que salen del supremo, del ínfimo y de un salto
    fuente: >-
      Ejercicio 2 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 27 de
      junio de 2019 · Cálculo. Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 3
      comp4: 6
    enunciado: |
      Dados $a,b\in\mathbb{R}$, se considera la sucesión de término general

      $$
      x_{n}=\begin{cases}
      \dfrac{-a}{n} & \text{si } n<10\\[4pt]
      b\left(-1\right)^{n} & \text{si } n\ge10
      \end{cases}
      $$

      a) Determinar $a$ y $b$ sabiendo que el valor $M=3$ es el supremo de
      $\left\{x_{n}\right\}_{n\in\mathbb{N}}$, el valor $m=-2$ es el ínfimo de
      $\left\{x_{n}\right\}_{n\in\mathbb{N}}$ y que
      $\left|x_{10}-x_{9}\right|=\dfrac{7}{3}$.

      b) Estudiar el crecimiento/decrecimiento de la sucesión
      $\left\{x_{n}\right\}_{n\in\mathbb{N}}$ y su convergencia.
    pide: Los valores de a y b, y el comportamiento de la sucesión.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es el supremo de un conjunto de números reales?
        opciones:
          - texto: >-
              La menor de sus cotas superiores; si además pertenece al conjunto,
              es el máximo
            correcta: true
            mensaje: |
              Eso es, y la distinción importa aquí: en esta sucesión el supremo
              **sí** se alcanza —en $n=1$—, así que además es máximo, y conviene
              decirlo. Es COMP 4.
          - texto: El límite de la sucesión
            mensaje: |
              Son cosas distintas. Esta sucesión no tiene límite —oscila— y sin
              embargo tiene supremo e ínfimo, porque está acotada.
          - texto: El mayor de sus elementos
            mensaje: |
              Ese es el **máximo**, y puede no existir. El supremo existe siempre
              que el conjunto esté acotado superiormente, se alcance o no: el
              supremo de $\left\{1-\frac1n\right\}$ es $1$ y no es ningún
              término.

      - tipo: calcular
        titulo: El parámetro a
        pregunta: |
          ¿Cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '-3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              Cuidado con el signo del enunciado: el término es $\frac{-a}{n}$.
              Para que $x_{1}=3$ hace falta $-a=3$, o sea $a=-3$.
          - valor: '-2'
            mensaje: |
              El $-2$ es $b$, el que fija el ínfimo. El supremo lo fija el primer
              tramo, y vale $x_{1}=-a$.
          - valor: '-1'
            mensaje: |
              Con $a=-1$ el primer tramo iría de $1$ a $\frac19$, y el supremo
              sería $\max\left(1,\left|b\right|\right)$. Para llegar a $3$ hace
              falta que el propio $x_{1}$ valga $3$.
        pista: |
          El primer tramo es $\frac{-a}{n}$ para $n=1,\dots,9$. ¿Cuál de esos
          nueve es el más grande?
        desarrollo: |
          Si $-a>0$, el tramo $\frac{-a}{n}$ es positivo y **decreciente**: su
          mayor valor es $x_{1}=-a$. El segundo tramo solo toma los valores
          $\pm b$.

          El ínfimo es $-2$, negativo, y en el primer tramo no hay nada negativo,
          así que lo aporta el segundo: $\left|b\right|=2$. Entonces

          $$
          \sup=\max\left(-a,\;2\right)=3
          \;\Longrightarrow\;
          -a=3
          \;\Longrightarrow\;
          a=-3
          $$

      - tipo: calcular
        titulo: El parámetro b
        pregunta: |
          ¿Cuánto vale $b$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Con $b=2$ el ínfimo también saldría $-2$ —el tramo toma
              $\pm b$—, pero falla el tercer dato: $x_{10}=2$ y
              $\left|2-\frac13\right|=\frac53$, no $\frac73$.
          - valor: '2.6667'
            mensaje: |
              $\frac83$ es la otra solución de
              $\left|b-\frac13\right|=\frac73$, pero entonces
              $\left|b\right|=\frac83\neq2$ y el ínfimo saldría $-\frac83$.
          - valor: '-3'
            mensaje: |
              $-3$ es $a$. Con $b=-3$ el ínfimo sería $-3$ y no $-2$.
        pista: |
          $x_{10}=b\left(-1\right)^{10}=b$ y $x_{9}=\frac{3}{9}=\frac13$.
        desarrollo: |
          $$
          \left|x_{10}-x_{9}\right|=\left|b-\tfrac13\right|=\tfrac73
          \;\Longrightarrow\;
          b=\tfrac83 \quad\text{o}\quad b=-2
          $$

          Y de las dos, solo $b=-2$ cumple $\left|b\right|=2$, que es lo que pide
          el ínfimo. Los tres datos del enunciado se usan: dos para acotar y el
          tercero para desempatar.

      - tipo: justificar
        pregunta: Ordena el estudio del apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              Con $a=-3$, el primer tramo es $x_{n}=\frac{3}{n}$ para
              $n\le9$, estrictamente decreciente de $3$ a $\frac13$.
          - texto: >-
              Con $b=-2$, a partir de $n=10$ la sucesión alterna
              $-2,\,2,\,-2,\,2,\dots$
          - texto: >-
              La subsucesión de los pares tiende a $-2$ y la de los impares a
              $2$: como los dos límites son distintos, la sucesión **no
              converge**.
          - texto: >-
              Como los nueve primeros términos decrecen y el décimo es todavía
              menor, la sucesión es decreciente y, al estar acotada
              inferiormente, converge.
            trampa: true
            mensaje: |
              El razonamiento es correcto hasta $n=10$ y falso a partir de ahí:
              $x_{11}=2>x_{10}=-2$, así que la sucesión **deja** de decrecer. Y
              el teorema que se está invocando —monótona y acotada implica
              convergente— exige la monotonía **a partir de un término en
              adelante**, no en un tramo inicial. Aquí la monotonía se rompe justo
              donde empieza la cola infinita.
    resolucion: |
      **a) Lo que aporta cada tramo.**

      | tramo | términos | qué valores toma |
      |---|---|---|
      | $n=1,\dots,9$ | $\frac{-a}{n}$ | nueve valores en progresión $\frac{-a}{1},\dots,\frac{-a}{9}$ |
      | $n\ge10$ | $b\left(-1\right)^{n}$ | solo dos: $b$ y $-b$ |

      **El ínfimo, $-2$, tiene que venir del segundo tramo.** Si $-a>0$ el primer
      tramo es todo positivo, y entonces lo más pequeño de todo es $-\left|b\right|$:

      $$
      -\left|b\right|=-2\;\Longrightarrow\;\left|b\right|=2
      $$

      **El supremo, $3$, tiene que venir del primero**, porque el segundo no pasa
      de $2$. El mayor del primer tramo es $x_{1}=-a$:

      $$
      -a=3\;\Longrightarrow\;\boxed{\;a=-3\;}
      $$

      **El salto desempata el signo de $b$.** Con $a=-3$ es $x_{9}=\frac39=\frac13$
      y $x_{10}=b\left(-1\right)^{10}=b$:

      $$
      \left|b-\tfrac13\right|=\tfrac73
      \;\Longrightarrow\;
      b=\tfrac83\ \text{o}\ b=-2
      $$

      y solo $b=-2$ tiene módulo $2$:

      $$
      \boxed{\;b=-2\;}
      $$

      **La comprobación de los tres datos a la vez**, que es lo que hay que
      escribir en el examen:

      | dato | comprobación |
      |---|---|
      | $\sup=3$ | $x_{1}=3$, y ningún término lo supera. Además se alcanza: es **máximo** |
      | $\inf=-2$ | $x_{10}=-2$, y ninguno baja de ahí. También se alcanza: es **mínimo** |
      | $\left\|x_{10}-x_{9}\right\|$ | $\left\|-2-\frac13\right\|=\frac73$ ✓ |

