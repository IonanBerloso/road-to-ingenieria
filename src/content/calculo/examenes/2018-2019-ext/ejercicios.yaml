      Los nueve primeros términos bajan de 3 a 1/3; el décimo salta a −2 y desde ahí
      la sucesión alterna −2 y 2 para siempre. El supremo y el ínfimo se alcanzan,
      así que además son máximo y mínimo.
      </figcaption>
      </figure>

      **b) Crecimiento y convergencia.** La sucesión queda

      $$
      x_{n}=\begin{cases}
      \frac{3}{n} & n\le9\\
      -2\left(-1\right)^{n} & n\ge10
      \end{cases}
      \qquad
      3,\;\tfrac32,\;1,\;\dots,\;\tfrac13,\;-2,\;2,\;-2,\;2,\dots
      $$

      - **Decrece** de $n=1$ a $n=10$: el tramo $\frac3n$ es decreciente, y
        además $x_{9}=\frac13>-2=x_{10}$.
      - **A partir de $n=10$ no es monótona**: alterna $-2$ y $2$ para siempre.
      - **Está acotada**: $-2\le x_{n}\le3$, con las dos cotas alcanzadas.
      - **No converge.** Los pares valen $-2$ y los impares $2$, así que hay dos
        subsucesiones con límites distintos. Como el límite de una sucesión, si
        existe, es único y toda subsucesión hereda el límite, la existencia de
        dos subsucesiones con límites distintos lo prohíbe.

      $$
      \liminf x_{n}=-2,\qquad \limsup x_{n}=2
      $$

      **Lo que este ejercicio está midiendo.** Seis de sus diez puntos son COMP 4
      y solo tres de cálculo, y se ve por qué: las cuentas son dos divisiones. Lo
      que puntúa es distinguir supremo de máximo, saber que la monotonía de un
      tramo finito no dice **nada** sobre la convergencia, y citar el teorema por
      su nombre al negarlo.

  - id: ex1819-ext-3-el-rectangulo-inscrito-en-la-parabola
    titulo: El rectángulo más grande que cabe bajo una parábola
    fuente: >-
      Ejercicio 3 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 27 de
      junio de 2019 · Cálculo. Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Sea la función $y\left(x\right)=4x-x^{2}$, $0\le x\le4$. Hallar los
      vértices del rectángulo de área máxima inscrito en el recinto limitado por
      la gráfica de $y\left(x\right)$ y el eje de abscisas, sabiendo que dos
      vértices consecutivos están sobre el eje OX.
    pide: Los cuatro vértices del rectángulo de área máxima.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el rectángulo tiene que ser simétrico respecto de $x=2$?
        opciones:
          - texto: >-
              Porque su altura la fija el **más bajo** de los dos vértices de
              arriba, y para una base de anchura dada eso se maximiza centrándola
            correcta: true
            mensaje: |
              Exacto. Con la base de $p$ a $q$, la altura no puede pasar de
              $\min\left(y\left(p\right),y\left(q\right)\right)$; y fijada la
              anchura $q-p$, ese mínimo es mayor cuanto más centrada esté la
              base. La parábola es simétrica respecto de su vértice, $x=2$.
          - texto: Porque el enunciado dice que dos vértices están sobre OX
            mensaje: |
              Eso dice dónde está la base, no que esté centrada. Un rectángulo
              con base de $0{,}5$ a $2$ también tendría dos vértices en OX; sería
              legítimo, solo que más pequeño.
          - texto: >-
              Porque el rectángulo de área máxima siempre tiene la altura máxima
              de la curva, $y\left(2\right)=4$
            mensaje: |
              Con altura $4$ la base tendría anchura cero: el único punto a esa
              altura es el vértice. Ganar altura cuesta anchura, y ese es
              justamente el equilibrio que hay que optimizar.

      - tipo: calcular
        titulo: La semianchura óptima
        pregunta: |
          Si la base va de $2-t$ a $2+t$, ¿para qué $t$ es máxima el área?
        respuesta:
          tipo: numero
          valor: '1.1547'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              Con $t=2$ la base sería todo el recinto, de $0$ a $4$, y la altura
              $4-t^{2}=0$: área nula. Es el otro extremo del equilibrio.
          - valor: '1.6330'
            mensaje: |
              $\sqrt{8/3}$ sale de resolver $8-3t^{2}=0$. Al derivar $-2t^{3}$
              baja un $3$: la derivada es $8-6t^{2}$.
          - valor: '0.8165'
            mensaje: |
              $\sqrt{2/3}$ sale de $4-6t^{2}=0$, o sea de haberse dejado el
              factor $2$ de la base al derivar.
        pista: |
          $A\left(t\right)=2t\left(4-t^{2}\right)$. Deriva e iguala a cero.
        desarrollo: |
          La altura es $y\left(2\pm t\right)=4-t^{2}$ y la base $2t$:

          $$
          A\left(t\right)=2t\left(4-t^{2}\right)=8t-2t^{3}
          $$

          $$
          A'\left(t\right)=8-6t^{2}=0
          \;\Longrightarrow\;
          t^{2}=\frac43
          \;\Longrightarrow\;
          t=\frac{2}{\sqrt3}=\frac{2\sqrt3}{3}\approx1{,}1547
          $$

          $A''\left(t\right)=-12t<0$, así que es máximo.

      - tipo: calcular
        titulo: El área máxima
        pregunta: |
          ¿Cuánto vale esa área?
        respuesta:
          tipo: numero
          valor: '6.1584'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '10.6667'
            mensaje: |
              $\frac{32}{3}$ es el área del **recinto entero** bajo la parábola,
              $\int_{0}^{4}\left(4x-x^{2}\right)dx$. El rectángulo se queda con
              algo menos del $58\,\%$.
          - valor: '3.0792'
            mensaje: |
              Es la mitad: te has dejado el factor $2$ de la base. La base va de
              $2-t$ a $2+t$, así que mide $2t$, no $t$.
          - valor: '5.3333'
            mensaje: |
              $\frac{16}{3}$ sale de multiplicar la altura correcta $\frac83$ por
              una base de $2$. La base vale $\frac{4}{\sqrt3}\approx2{,}31$.
        pista: |
          Altura $4-\frac43=\frac83$, base $\frac{4}{\sqrt3}$.
        desarrollo: |
          $$
          A=\frac{4}{\sqrt3}\cdot\frac83=\frac{32}{3\sqrt3}
          =\frac{32\sqrt3}{9}\approx6{,}1584
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La parábola $y=4x-x^{2}$ corta al eje en $x=0$ y $x=4$, y su
              vértice está en $\left(2,4\right)$.
          - texto: >-
              Por simetría el rectángulo se escribe con base de $2-t$ a $2+t$ y
              altura $4-t^{2}$, así que $A\left(t\right)=8t-2t^{3}$.
          - texto: >-
              $A'\left(t\right)=8-6t^{2}$ se anula en $t=\frac{2}{\sqrt3}$, y
              $A''<0$ confirma que es máximo.
          - texto: >-
              Como $A\left(t\right)$ es un polinomio, su máximo está en un
              extremo del intervalo $\left[0,2\right]$.
            trampa: true
            mensaje: |
              Un polinomio continuo en un cerrado alcanza su máximo, sí, pero
              **puede alcanzarlo dentro**. Aquí precisamente los dos extremos dan
              área cero: $A\left(0\right)=A\left(2\right)=0$. El máximo está en el
              interior, que es donde hay que buscarlo anulando la derivada.
    resolucion: |
      **El recinto.** $y=4x-x^{2}=x\left(4-x\right)$ es una parábola hacia abajo
      que corta al eje en $x=0$ y $x=4$, con vértice en $\left(2,4\right)$. El
      recinto es la campana que queda entre ella y el eje.

      **Por qué la base va centrada.** Si la base va de $p$ a $q$, los dos
      vértices de arriba están en $\left(p,h\right)$ y $\left(q,h\right)$, y para
      que el rectángulo quepa hace falta

      $$
      h\le\min\left(y\left(p\right),y\left(q\right)\right)
      $$

      Fijada la anchura $q-p$, ese mínimo es tanto mayor cuanto más centrada esté
      la base respecto del eje de simetría $x=2$. Así que en el óptimo
      $p=2-t$ y $q=2+t$, y los dos vértices de arriba están **sobre** la
      parábola.

      **La función a maximizar.**

      $$
      y\left(2\pm t\right)=4\left(2\pm t\right)-\left(2\pm t\right)^{2}=4-t^{2}
      $$

      $$
      A\left(t\right)=\underbrace{2t}_{\text{base}}\cdot
      \underbrace{\left(4-t^{2}\right)}_{\text{altura}}=8t-2t^{3},
      \qquad t\in\left[0,2\right]
      $$

      **El máximo.**

      $$
      A'\left(t\right)=8-6t^{2}=0
      \;\Longrightarrow\;
      t=\frac{2}{\sqrt3}=\frac{2\sqrt3}{3},
      \qquad
      A''\left(t\right)=-12t<0
      $$

      En los extremos $A\left(0\right)=A\left(2\right)=0$, así que el interior
      gana.

      **Los vértices.** Con $t=\frac{2\sqrt3}{3}\approx1{,}1547$ y altura
      $4-\frac43=\frac83$:

      $$
      \boxed{\;
      \left(2-\tfrac{2\sqrt3}{3},\,0\right),\quad
      \left(2+\tfrac{2\sqrt3}{3},\,0\right),\quad
      \left(2+\tfrac{2\sqrt3}{3},\,\tfrac83\right),\quad
      \left(2-\tfrac{2\sqrt3}{3},\,\tfrac83\right)
      \;}
      $$

      es decir, aproximadamente $\left(0{,}845;0\right)$,
      $\left(3{,}155;0\right)$, $\left(3{,}155;2{,}667\right)$ y
      $\left(0{,}845;2{,}667\right)$, con área
      $\frac{32\sqrt3}{9}\approx6{,}16$.

