        </g>
        <text class="tan19-l" x="103" y="222.5" fill="var(--live)">D</text>
        <text class="tan19-l" x="164.8" y="45" text-anchor="end" fill="var(--alt)">y = 4x</text>
        <text class="tan19-l" x="27.3" y="45" fill="var(--alt)">y = −4x</text>
        <text class="tan19-l" x="96" y="10" text-anchor="middle" fill="var(--d1)">y = x² + 4</text>
      </svg>
      <figcaption>
      Las dos tangentes tocan la parábola en (−2, 8) y (2, 8) y se cortan en el
      origen. El recinto D es lo que queda entre ellas y la curva.
      </figcaption>
      </figure>

      **c) El volumen.** El recinto está por encima del eje OX salvo en el punto
      $\left(0,0\right)$, así que al girar cada sección es una corona:

      | | radio |
      |---|---|
      | exterior, lo que genera la parábola | $x^{2}+4$ |
      | interior, lo que genera la tangente | $4x$ |

      $$
      V=2\pi\int_{0}^{2}\left[\left(x^{2}+4\right)^{2}-\left(4x\right)^{2}\right]dx
      $$

      **El atajo que ahorra media página.** Es una diferencia de cuadrados:

      $$
      \left(x^{2}+4\right)^{2}-\left(4x\right)^{2}
      =\left(x^{2}+4-4x\right)\left(x^{2}+4+4x\right)
      =\left(x-2\right)^{2}\left(x+2\right)^{2}
      =\left(x^{2}-4\right)^{2}
      $$

      $$
      V=2\pi\int_{0}^{2}\left(x^{4}-8x^{2}+16\right)dx
      =2\pi\left(\frac{32}{5}-\frac{64}{3}+32\right)
      =2\pi\cdot\frac{256}{15}
      $$

      $$
      \boxed{\;V=\frac{512\pi}{15}\approx107{,}23\;}
      $$

      **Por qué se multiplica por dos y no se divide.** El recinto es simétrico
      respecto del eje **OY**, pero el giro es alrededor de **OX**. La mitad
      izquierda genera un sólido en $x<0$ y la derecha otro en $x>0$: son piezas
      distintas del mismo cuerpo, y las dos suman. La simetría que permitiría
      dividir sería la del propio eje de giro, y esa ya está usada al escribir
      $\pi R^{2}$.

  - id: ex1819-ext-5-seis-mapas-y-dos-derivadas
    titulo: Seis mapas de nivel, y dos números para elegir el tuyo
    fuente: >-
      Ejercicio 1 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 27 de
      junio de 2019 · Cálculo. Industriales, UPV/EHU · Los seis diagramas están
      redibujados en SVG a partir del original (CLAUDE.md §08). El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 4
      comp2: 0
      comp4: 6
    enunciado: |
      Las gráficas (1) a (6) muestran diagramas de curvas de nivel de seis
      diferentes funciones de dos variables $F\left(x,y\right)$. Observa que en
      cada curva de nivel se indica la correspondiente cota de $z$.

