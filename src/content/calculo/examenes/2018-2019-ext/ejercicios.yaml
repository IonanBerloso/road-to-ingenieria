      $$

      y el rectángulo se queda con $\frac{6{,}16}{10{,}67}=57{,}7\,\%$. Que sea
      poco más de la mitad es razonable para un rectángulo inscrito en una
      campana; si hubiera salido más del $100\,\%$, o menos del $30\,\%$, habría
      que volver atrás.

  - id: ex1819-ext-4-dos-tangentes-y-lo-que-encierran
    titulo: Dos tangentes que se cruzan, y el hueco que dejan
    fuente: >-
      Ejercicio 4 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 27 de
      junio de 2019 · Cálculo. Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 9
      comp4: 1
    enunciado: |
      a) Calcular las rectas tangentes de la función $f\left(x\right)=x^{2}+4$
      en los puntos de abscisas $x=-2$ y $x=2$.

      b) Calcular el área del recinto $D$ limitado por la gráfica de la función
      $f\left(x\right)$ y las rectas tangentes obtenidas en el apartado anterior.

      c) Calcular el volumen generado al girar el recinto $D$ alrededor del eje
      OX.
    pide: Las dos tangentes, el área que encierran con la parábola y el volumen al girar.

    pasos:
      - tipo: reconocer
        pregunta: |
          Una vez calculadas las dos tangentes, ¿qué forma tiene el recinto $D$?
        opciones:
          - texto: >-
              Un triángulo curvilíneo con vértice inferior en el origen, donde se
              cortan las dos rectas, y tapa curva la parábola
            correcta: true
            mensaje: |
              Eso es. Las tangentes son $y=4x$ y $y=-4x$, que se cortan en
              $\left(0,0\right)$, y la parábola las toca en
              $\left(\pm2,8\right)$. El recinto queda cerrado por los tres trozos.
          - texto: >-
              Las dos tangentes son paralelas, porque los puntos son simétricos,
              así que $D$ es una franja
            mensaje: |
              Simétricos sí, pero las pendientes son $f'\left(-2\right)=-4$ y
              $f'\left(2\right)=4$: **opuestas**, no iguales. Dos rectas de
              pendientes opuestas se cortan.
          - texto: $D$ no está acotado, porque una parábola no cierra nada
            mensaje: |
              La parábola sola no cerraría, pero con las dos tangentes sí: por
              arriba la curva, por los lados las rectas, y abajo su punto de
              corte.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área de $D$?
        respuesta:
          tipo: numero
          valor: '5.3333'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '2.6667'
            mensaje: |
              $\frac83$ es la mitad, solo el trozo de $0$ a $2$. Por simetría hay
              que doblarlo.
          - valor: '10.6667'
            mensaje: |
              $\frac{32}{3}$ es el doble de lo que sale: has contado cuatro veces
              el trozo $\int_{0}^{2}\left(x-2\right)^{2}dx=\frac83$ en vez de dos.
          - valor: '16'
            mensaje: |
              $16$ es el área del triángulo de vértices
              $\left(0,0\right)$, $\left(-2,8\right)$ y $\left(2,8\right)$: el
              recinto **sin** quitarle lo que la parábola se come.
        pista: |
          En $\left[0,2\right]$, $f\left(x\right)-4x=x^{2}-4x+4=\left(x-2\right)^{2}$.
        desarrollo: |
          $$
          A=2\int_{0}^{2}\left[\left(x^{2}+4\right)-4x\right]dx
          =2\int_{0}^{2}\left(x-2\right)^{2}dx
          $$

          $$
          =2\left[\frac{\left(x-2\right)^{3}}{3}\right]_{0}^{2}
          =2\left(0+\frac83\right)=\frac{16}{3}
          $$

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen al girar $D$ alrededor de OX?
        respuesta:
          tipo: numero
          valor: '107.2330'
          tolerancia: 0.01
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '375.2846'
            mensaje: |
              Ese es $2\pi\int_{0}^{2}\left(x^{2}+4\right)^{2}dx$: has girado solo
              el borde de arriba y te has olvidado del agujero que deja la
              tangente.
          - valor: '40.2124'
            mensaje: |
              Ese es $2\pi\int_{0}^{2}\left(x-2\right)^{4}dx$: has usado la
              **altura** del recinto como radio. La arandela resta áreas,
              $\pi R^{2}-\pi r^{2}$, no radios.
          - valor: '53.6165'
            mensaje: |
              Ese es la mitad, $\frac{256\pi}{15}$: solo el trozo de $0$ a $2$.
              Falta doblar por simetría.
        pista: |
          $\left(x^{2}+4\right)^{2}-\left(4x\right)^{2}
          =\left(x^{2}+4-4x\right)\left(x^{2}+4+4x\right)
          =\left(x-2\right)^{2}\left(x+2\right)^{2}$.
        desarrollo: |
          $$
          V=2\pi\int_{0}^{2}\left[\left(x^{2}+4\right)^{2}-\left(4x\right)^{2}\right]dx
          =2\pi\int_{0}^{2}\left(x^{2}-4\right)^{2}dx
          $$

          $$
          =2\pi\int_{0}^{2}\left(x^{4}-8x^{2}+16\right)dx
          =2\pi\left[\frac{x^{5}}{5}-\frac{8x^{3}}{3}+16x\right]_{0}^{2}
          $$

          $$
          =2\pi\left(\frac{32}{5}-\frac{64}{3}+32\right)
          =2\pi\cdot\frac{256}{15}=\frac{512\pi}{15}\approx107{,}23
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento del volumen. Una pieza es falsa.
        piezas:
          - texto: >-
              Las tangentes son $y=4x$ y $y=-4x$, y en $\left[0,2\right]$ la
              parábola va por encima de $y=4x$.
          - texto: >-
              En $\left[0,2\right]$ los dos bordes son positivos, así que la
              sección al girar es una corona de radio exterior $x^{2}+4$ y radio
              interior $4x$.
          - texto: >-
              La diferencia de cuadrados se factoriza:
              $\left(x^{2}+4\right)^{2}-16x^{2}=\left(x^{2}-4\right)^{2}$, y la
              integral sale sola.
          - texto: >-
              Como el recinto es simétrico respecto del eje OY, al girar
              alrededor de OX cada mitad genera el mismo sólido y hay que quedarse
              con una sola.
            trampa: true
            mensaje: |
              La simetría es respecto de OY, y el giro es alrededor de OX: las dos
              mitades generan sólidos **distintos**, uno a cada lado del plano
              $x=0$, y los dos cuentan. Por eso se **multiplica** por dos, no se
              divide. Quedarse con una sola mitad daría $\frac{256\pi}{15}$.
    resolucion: |
      **a) Las tangentes.** $f\left(x\right)=x^{2}+4$, $f'\left(x\right)=2x$.

      | punto | $f$ | $f'$ | tangente |
      |---|---|---|---|
      | $x=2$ | $8$ | $4$ | $y=8+4\left(x-2\right)=4x$ |
      | $x=-2$ | $8$ | $-4$ | $y=8-4\left(x+2\right)=-4x$ |

      $$
      \boxed{\;y=4x\quad\text{y}\quad y=-4x\;}
      $$

      Las dos pasan por el origen. Que el término independiente se cancele no es
      casualidad: la parábola $x^{2}+c$ tiene todas sus tangentes cortando al eje
      OY en $-c$… y aquí, además, las dos se cruzan justo en $\left(0,0\right)$
      porque los puntos de tangencia son simétricos.

      **b) El área.** En $\left[0,2\right]$ la diferencia entre la parábola y la
      tangente derecha es un cuadrado perfecto —lo es siempre, y esa es la
      definición algebraica de tangencia—:

      $$
      \left(x^{2}+4\right)-4x=x^{2}-4x+4=\left(x-2\right)^{2}\ge0
      $$

      $$
      A=2\int_{0}^{2}\left(x-2\right)^{2}dx
      =2\left[\frac{\left(x-2\right)^{3}}{3}\right]_{0}^{2}
      =\boxed{\;\frac{16}{3}\approx5{,}33\;}
      $$

      <figure class="figura-examen">
      <svg viewBox="0 0 200 320" role="img" width="200" height="320"
           aria-labelledby="tan19-t tan19-d">
        <title id="tan19-t">La parabola y sus dos tangentes, que se cortan en el origen</title>
        <desc id="tan19-d">Una parabola con el vertice a altura cuatro y dos rectas que
        la tocan en los puntos de abscisa menos dos y dos, ambos a altura ocho. Las dos
        rectas se cruzan en el origen y encierran con la curva un triangulo de lados
        curvos.</desc>
