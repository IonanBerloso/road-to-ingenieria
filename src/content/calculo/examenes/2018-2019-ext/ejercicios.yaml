      **b) La que no existe.** La condición es «suma de distancias a dos puntos
      fijos = constante», que es la definición de elipse. Pero antes de escribir
      ninguna ecuación conviene mirar los números:

      | | valor |
      |---|---|
      | focos | $1+i$ y $-1+i$ |
      | distancia entre ellos, $2c$ | $2$ |
      | suma pedida, $2a$ | $1$ |

      La desigualdad triangular dice que para **cualquier** punto $z$ del plano

      $$
      \left|z-F_{1}\right|+\left|z-F_{2}\right|\ge\left|F_{1}-F_{2}\right|=2
      $$

      con igualdad solo en el segmento que los une. Como se pide que la suma
      valga $1$, y $1<2$:

      $$
      \boxed{\;\text{el lugar geométrico es el conjunto vacío}\;}
      $$

