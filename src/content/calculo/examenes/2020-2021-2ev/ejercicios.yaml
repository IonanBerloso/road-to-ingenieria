ejercicios:
  - id: ex2021-2ev-1-hexagono-regular
    titulo: El tercer vértice de un hexágono regular
    fuente: >-
      Ejercicio 1 · Segunda evaluación, 23 de noviembre de 2020 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    nivel: examen
    enunciado: |
      Sean $z_1 = 5-2i$ y $z_2 = 3+i$ los afijos de dos vértices de un lado de
      un hexágono regular. Hallar el afijo del vértice $z_3$, contiguo a $z_2$,
      con mayor componente imaginaria.

      <figure class="figura-examen">
      <svg viewBox="0 0 620 470" role="img" width="600" height="455"
           aria-labelledby="f2021b1t f2021b1d">
        <title id="f2021b1t">El hexagono regular sobre el plano complejo</title>
        <desc id="f2021b1d">Un hexagono regular con dos vertices dados, cinco
        menos dos i y tres mas i, y el tercero marcado en verde: cuatro coma
        seis mas cuatro coma dos i. Se marca tambien el otro candidato, en gris,
        con parte imaginaria mucho menor.</desc>

        <g stroke="var(--rule)" stroke-width="1" fill="none">
          <path d="M60 60 L60 430 M171 60 L171 430 M282 60 L282 430
                   M394 60 L394 430 M505 60 L505 430
                   M60 60 L560 60 M60 152 L560 152 M60 245 L560 245
                   M60 337 L560 337 M60 430 L560 430"></path>
        </g>

        <g stroke="var(--graphite)" stroke-width="1.3" fill="none">
          <path d="M40 291 L580 291 M116 50 L116 445"></path>
        </g>

        <path d="M227 384 L116 245 L204 95 L405 85 L516 223 L427 373 Z"
              fill="var(--live)" fill-opacity="0.07"
              stroke="var(--graphite)" stroke-width="1.8"></path>

        <g stroke="var(--ink)" stroke-width="3.2" fill="none"
           stroke-linecap="round">
          <path d="M227 384 L116 245"></path>
        </g>

        <g stroke="var(--live)" stroke-width="3.2" fill="none"
           stroke-linecap="round">
          <path d="M116 245 L204 95"></path>
        </g>

        <g fill="var(--ink)">
          <circle cx="227" cy="384" r="6"></circle>
          <circle cx="116" cy="245" r="6"></circle>
        </g>
        <circle cx="204" cy="95" r="7" fill="var(--live)"></circle>
        <circle cx="316" cy="234" r="4" fill="var(--faint)"></circle>

        <g fill="var(--graphite)" font-size="13" font-family="var(--mono)">
          <text x="234" y="404">z1 = 5-2i</text>
          <text x="30" y="240">z2 = 3+i</text>
          <text x="300" y="252">C</text>
          <text x="96" y="452">3</text>
          <text x="264" y="452">6</text>
          <text x="488" y="452">9</text>
          <text x="86" y="66">5</text>
          <text x="86" y="158">3</text>
          <text x="86" y="296">0</text>
          <text x="80" y="435">-3</text>
        </g>

        <g fill="var(--live)" font-size="14" font-family="var(--mono)">
          <text x="176" y="80">z3</text>
        </g>
      </svg>
      <figcaption>
      Figura nuestra: el enunciado no trae dibujo. En negro el lado conocido,
      en verde el que hay que hallar. El punto gris es el centro del hexagono,
      que no hace falta calcular pero ayuda a ver por que el giro es de 120
      grados.
      </figcaption>
      </figure>
    pide: Hallar el afijo $z_3$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué giro lleva del lado $z_2z_1$ al lado $z_2z_3$?
        opciones:
          - texto: >-
              Un giro de **120°** en torno a $z_2$, que es el ángulo interior
              del hexágono
            correcta: true
            mensaje: |
              Exacto. En un polígono regular de $n$ lados el ángulo interior
              vale $\frac{(n-2)180°}{n}$; con $n=6$ da 120°. Los dos lados que
              concurren en $z_2$ forman ese ángulo, así que uno es el otro
              girado 120° — en un sentido o en el otro, y de ahí los dos
              candidatos.
          - texto: 60°, que es el ángulo central
            mensaje: |
              60° es el ángulo que forman dos **radios** consecutivos, visto
              desde el centro. El ángulo entre dos **lados**, visto desde un
              vértice, es 120°.
          - texto: 90°
            mensaje: |
              Eso sería en un cuadrado. En un hexágono el ángulo interior es
              120°.
          - texto: >-
              Un giro de 180°, porque los lados son opuestos
            mensaje: |
              Con 180° los tres vértices quedarían alineados y no habría
              hexágono.

      - tipo: calcular
        titulo: El lado como vector
        pregunta: |
          ¿Cuánto mide el lado del hexágono? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '3.6056'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '13'
            mensaje: |
              13 es el **cuadrado** del módulo: $2^{2}+3^{2}$. Falta la raíz.
          - valor: '5'
            mensaje: |
              5 es $|2|+|{-3}|$, sumando las componentes. El módulo se calcula
              con Pitágoras.
          - valor: '2.2360680'
            mensaje: |
              $\sqrt5$ saldría de $\left|2-i\right|$. La resta correcta es
              $z_1-z_2 = 2-3i$.
        pista: |
          El lado es $\left|z_1-z_2\right|$.
        desarrollo: |
          $$
          z_1-z_2 = (5-2i)-(3+i) = 2-3i
          $$

          $$
          \left|z_1-z_2\right| = \sqrt{2^{2}+(-3)^{2}} = \sqrt{13}
          \approx 3{,}6056
          $$

          Ese es el lado del hexágono, y también el módulo del vector que hay
          que girar.
        veredicto: |
          El giro **conserva el módulo**: $z_3-z_2$ tendrá exactamente el mismo,
          $\sqrt{13}$. Es la comprobación más rápida del resultado.

      - tipo: calcular
        titulo: El vértice pedido
        pregunta: |
          ¿Cuál es la parte imaginaria de $z_3$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '4.2321'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0.7679'
            mensaje: |
              $0{,}7679$ es la parte imaginaria del **otro** candidato, el que
              sale girando $-120°$. El enunciado pide el de parte imaginaria
              **mayor**.
          - valor: '3.2321'
            mensaje: |
              $3{,}2321$ es la parte imaginaria del **vector** $z_3-z_2$. Falta
              sumarle la de $z_2$, que es 1.
          - valor: '4.5981'
            mensaje: |
              $4{,}5981$ es la parte **real** de $z_3$, no la imaginaria.
        pista: |
          Multiplica $2-3i$ por $e^{i2\pi/3} = -\frac12+\frac{\sqrt3}{2}i$ y
          suma $z_2$.
        desarrollo: |
          Girando $z_1-z_2 = 2-3i$ un ángulo de $+120°$:

          $$
          (2-3i)\left(-\tfrac12+\tfrac{\sqrt3}{2}i\right)
          $$

          $$
          = -1+\sqrt3\,i+\tfrac32 i-\tfrac{3\sqrt3}{2}i^{2}
          = \left(-1+\tfrac{3\sqrt3}{2}\right)
          +\left(\sqrt3+\tfrac32\right)i
          $$

          Numéricamente: $-1+2{,}5981 = 1{,}5981$ y
          $1{,}7321+1{,}5 = 3{,}2321$.

          Sumando $z_2 = 3+i$:

          $$
          z_3 = (3+1{,}5981)+(1+3{,}2321)i = 4{,}5981+4{,}2321\,i
          $$
        veredicto: |
          Girar $-120°$ daría $z_3' = -0{,}5981+0{,}7679i$, el otro vecino de
          $z_2$. El enunciado desempata pidiendo el de parte imaginaria mayor.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **El ángulo.** En un hexágono regular el ángulo interior vale
              $\frac{(6-2)\cdot180°}{6} = 120°$: es el que forman los dos lados
              que concurren en $z_2$.
          - texto: |
              **El vector conocido:** $z_1-z_2 = 2-3i$, de módulo $\sqrt{13}$.
          - texto: |
              **Girarlo** en torno al origen, que es lo que hace multiplicar por
              $e^{\pm i2\pi/3} = -\frac12\pm\frac{\sqrt3}{2}i$.
          - texto: |
              **Trasladar de vuelta:** $z_3 = z_2+\left(z_1-z_2\right)
              e^{\pm i2\pi/3}$. Salen dos candidatos, los dos vecinos de $z_2$.
          - texto: |
              **Desempatar** con la condición del enunciado: el de mayor parte
              imaginaria es
              $z_3 = \left(2+\frac{3\sqrt3}{2}\right)
              +\left(\frac52+\sqrt3\right)i \approx 4{,}60+4{,}23\,i$.
          - texto: |
              Para girar en torno a $z_2$ basta multiplicar $z_1$ por
              $e^{i2\pi/3}$, sin restar nada.
            trampa: true
            mensaje: |
              Multiplicar por una exponencial gira **en torno al origen**, no
              en torno a $z_2$. Para girar alrededor de otro punto hay que
              trasladar el centro al origen —restando $z_2$—, girar, y deshacer
              la traslación. Saltarse ese paso manda el vértice a cualquier
              sitio.
        veredicto: |
          Restar, girar y volver a sumar: son tres pasos y el del medio es el
          único que parece «de complejos». Los otros dos son los que se olvidan.

    resolucion: |
      **Datos.** $z_1 = 5-2i$ y $z_2 = 3+i$, vértices consecutivos de un
      hexágono regular. Se pide el otro vecino de $z_2$, el de parte imaginaria
      mayor.

      ### 1 · El ángulo del hexágono

      En un polígono regular de $n$ lados, el ángulo interior mide

      $$
      \frac{(n-2)\cdot180°}{n}
      $$

      Con $n=6$: **120°**. Es el ángulo que forman los dos lados que se juntan
      en cada vértice.

      Conviene no confundirlo con el **ángulo central**, que vale
      $\frac{360°}{6} = 60°$ y es el que forman dos radios consecutivos. Aquí
      hace falta el interior, porque se trabaja desde un vértice, no desde el
      centro.

      ### 2 · Girar alrededor de un punto que no es el origen

      Multiplicar un complejo por $e^{i\theta}$ lo gira **en torno al origen**.
      Para girar en torno a $z_2$ hacen falta tres pasos:

      $$
      \underbrace{z_1-z_2}_{\text{trasladar}}
      \;\longrightarrow\;
      \underbrace{\left(z_1-z_2\right)e^{i\theta}}_{\text{girar}}
      \;\longrightarrow\;
      \underbrace{z_2+\left(z_1-z_2\right)e^{i\theta}}_{\text{deshacer}}
      $$

      Olvidar el primero y el tercero es el error clásico.

      ### 3 · El cálculo

      $$
      z_1-z_2 = 2-3i,
      \qquad
      \left|z_1-z_2\right| = \sqrt{13}
      $$

      $$
      e^{\pm i2\pi/3} = -\frac12\pm\frac{\sqrt3}{2}i
      $$

      **Con $+120°$:**

      $$
      (2-3i)\left(-\tfrac12+\tfrac{\sqrt3}{2}i\right)
      = -1+\sqrt3\,i+\tfrac32i+\tfrac{3\sqrt3}{2}
      $$

      $$
      = \left(\tfrac{3\sqrt3}{2}-1\right)+\left(\sqrt3+\tfrac32\right)i
      $$

      $$
      z_3 = 3+\tfrac{3\sqrt3}{2}-1
      + \left(1+\sqrt3+\tfrac32\right)i
      $$

      $$
      \boxed{z_3 = \left(2+\frac{3\sqrt3}{2}\right)
      +\left(\frac52+\sqrt3\right)i \approx 4{,}5981+4{,}2321\,i}
      $$

      **Con $-120°$**, el otro vecino:

      $$
      z_3' = \left(2-\frac{3\sqrt3}{2}\right)
      +\left(\frac52-\sqrt3\right)i \approx -0{,}5981+0{,}7679\,i
      $$

      Y como $4{,}23 > 0{,}77$, el pedido es el primero.

      ### 4 · Comprobación

      **Del módulo.** El giro conserva la longitud, así que el nuevo lado debe
      medir lo mismo:

      $$
      \left|z_3-z_2\right| = \left|1{,}5981+3{,}2321i\right|
      = \sqrt{2{,}554+10{,}446} = \sqrt{13} \quad\checkmark
      $$

      **Del ángulo.** El producto escalar de los dos vectores que salen de
      $z_2$ debe dar $\left|u\right|\left|v\right|\cos120° = -\frac{13}{2}$:

      $$
      (2)(1{,}5981)+(-3)(3{,}2321) = 3{,}196-9{,}696 = -6{,}5
      = -\frac{13}{2} \quad\checkmark
      $$

      **De la distancia entre $z_1$ y $z_3$.** En un hexágono regular, dos
      vértices separados por uno tercero distan $\ell\sqrt3$:

      $$
      \left|z_3-z_1\right| = \left|-0{,}402+6{,}232i\right|
      = \sqrt{0{,}162+38{,}84} = 6{,}245
      $$

      $$
      \sqrt{13}\cdot\sqrt3 = \sqrt{39} = 6{,}245 \quad\checkmark
      $$

      Tres comprobaciones independientes.

  - id: ex2021-2ev-2-rolle-enunciar-y-demostrar
    titulo: Rolle, demostrado y luego negado
    fuente: >-
      Ejercicio 2 · Segunda evaluación, 23 de noviembre de 2020 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 2
      comp4: 7

    nivel: examen
    enunciado: |
      **a)** Enunciar y demostrar el teorema de Rolle.

      **b)** Estudiar si es posible aplicar el teorema de Rolle a la siguiente
      función, y en caso afirmativo aplicarlo:

      $$
      f(x) = \begin{cases}
      x^{3} & 0 \le x \le 1 \\[4pt]
      2-x & 1 < x \le 2
      \end{cases}
      $$
    pide: Enunciar y demostrar Rolle, y estudiar el caso propuesto.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué teorema se apoya la demostración de Rolle?
        opciones:
          - texto: >-
              En **Weierstrass**, que garantiza máximo y mínimo absolutos, y
              luego en **Fermat**
            correcta: true
            mensaje: |
              Exacto. Weierstrass asegura que una función continua en un cerrado
              y acotado alcanza sus extremos absolutos; Fermat dice que un
              extremo interior de una función derivable tiene derivada nula. La
              demostración de Rolle es encadenar los dos.
          - texto: En el teorema de Lagrange
            mensaje: |
              Es al revés: Lagrange se demuestra **a partir** de Rolle, aplicando
              este a la diferencia entre la función y la cuerda. Usarlo aquí
              sería circular.
          - texto: En el teorema de Bolzano
            mensaje: |
              Bolzano habla de ceros de la función, no de su derivada. No
              interviene.
          - texto: >-
              En la definición de derivada, directamente
            mensaje: |
              La definición aparece dentro de la demostración de Fermat, pero la
              estructura de la de Rolle son los dos teoremas citados.

      - tipo: calcular
        titulo: Los extremos del intervalo
        pregunta: |
          ¿Cuánto vale $f(2)$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '8'
            mensaje: |
              8 es $2^{3}$, pero en $x=2$ rige la **otra** rama: $2-x$.
          - valor: '2'
            mensaje: |
              2 es el término independiente de la segunda rama. Hay que
              evaluarla: $2-2 = 0$.
          - valor: '1'
            mensaje: |
              1 es $f(1)$, el valor en el empalme.
        pista: |
          En $x=2$ rige la rama $2-x$.
        desarrollo: |
          $$
          f(0) = 0^{3} = 0,
          \qquad
          f(2) = 2-2 = 0
          $$

          $$
          f(0) = f(2) = 0
          $$

          La tercera hipótesis de Rolle **sí se cumple**, y eso hace el
          ejercicio interesante: falla otra.
        veredicto: |
          Que los extremos coincidan es lo que invita a aplicar Rolle. El
          ejercicio está construido para que se compruebe **todo** antes de
          concluir.

      - tipo: calcular
        titulo: Las derivadas laterales
        pregunta: |
          ¿Cuánto vale $f'(1^{-})$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '-1'
            mensaje: |
              $-1$ es $f'(1^{+})$, la derivada por la **derecha**. Precisamente
              que sean distintas es lo que rompe el teorema.
          - valor: '1'
            mensaje: |
              1 es $f(1)$, el valor de la función. La derivada de $x^{3}$ es
              $3x^{2}$.
          - valor: '0'
            mensaje: |
              0 sería la derivada si hubiera un extremo suave. Aquí hay un pico.
        pista: |
          $\left(x^{3}\right)' = 3x^{2}$.
        desarrollo: |
          $$
          f'(1^{-}) = \left.3x^{2}\right|_{x=1} = 3
          $$

          $$
          f'(1^{+}) = \left.(2-x)'\right|_{x=1} = -1
          $$

          $$
          3 \neq -1
          $$

          **$f$ no es derivable en $x=1$**, que es un punto **interior** de
          $(0,2)$. La segunda hipótesis de Rolle falla.
        veredicto: |
          $x=1$ es además donde $f$ alcanza su **máximo**. Es justo el punto
          donde estaría el $c$ de Rolle si la función fuera suave — y es donde
          tiene el pico.

      - tipo: justificar
        pregunta: |
          Ordena la demostración del apartado (a). Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **Enunciado.** Si $f$ es continua en $[a,b]$, derivable en
              $(a,b)$ y $f(a)=f(b)$, entonces existe $c\in(a,b)$ con
              $f'(c)=0$.
          - texto: |
              **Weierstrass.** Como $f$ es continua en el cerrado y acotado
              $[a,b]$, alcanza en él su máximo absoluto $M$ y su mínimo
              absoluto $m$.
          - texto: |
              **Caso $M=m$.** Entonces $f$ es constante, $f'(x)=0$ en todo
              $(a,b)$, y cualquier punto sirve de $c$.
          - texto: |
              **Caso $M>m$.** Como $f(a)=f(b)$, los dos extremos no pueden
              alcanzarse ambos en la frontera: al menos uno se alcanza en un
              punto interior $c\in(a,b)$.
          - texto: |
              **Fermat.** En ese $c$ hay un extremo y $f$ es derivable —lo
              garantiza la hipótesis—, luego $f'(c)=0$. $\blacksquare$
          - texto: |
              La hipótesis $f(a)=f(b)$ se usa para asegurar que la función tiene
              un máximo y un mínimo.
            trampa: true
            mensaje: |
              El máximo y el mínimo los da **Weierstrass**, que solo necesita
              continuidad. La hipótesis $f(a)=f(b)$ sirve para otra cosa: para
              garantizar que al menos uno de los dos extremos cae en el
              **interior**. Sin ella, los dos podrían estar en los bordes —como
              en una función monótona— y no habría ningún punto crítico.
        veredicto: |
          Cada hipótesis hace un trabajo distinto: la continuidad da los
          extremos, la igualdad los mete dentro, y la derivabilidad permite
          anular la derivada. Saber cuál hace qué es lo que se evalúa.

    resolucion: |
      **Datos.** Enunciar y demostrar Rolle, y aplicarlo —si se puede— a una
      función a trozos.

      ### 1 · Apartado (a): el enunciado

      > **Teorema de Rolle.** Sea $f$ una función que cumple:
      >
      > 1. es **continua** en $[a,b]$,
      > 2. es **derivable** en $(a,b)$,
      > 3. $f(a) = f(b)$.
      >
      > Entonces existe al menos un $c \in (a,b)$ tal que $f'(c) = 0$.

      Geométricamente: si una curva suave empieza y acaba a la misma altura,
      en algún punto intermedio su tangente es horizontal.

      ### 2 · Apartado (a): la demostración

      **Paso 1 — Weierstrass.** $f$ es continua en $[a,b]$, que es cerrado y
      acotado. Por el teorema de Weierstrass, $f$ **alcanza** en $[a,b]$ su
      máximo absoluto $M$ y su mínimo absoluto $m$.

      **Paso 2 — el caso trivial.** Si $M = m$, la función es constante, y
      entonces $f'(x) = 0$ para todo $x \in (a,b)$. Cualquier punto sirve de
      $c$.

      **Paso 3 — el caso general.** Si $M > m$, al menos uno de los dos valores
      es distinto de $f(a) = f(b)$. El punto donde se alcanza **no puede ser
      $a$ ni $b$**, porque ahí la función vale lo mismo. Luego se alcanza en un
      punto interior:

      $$
      \exists\, c \in (a,b) : f(c) = M \ \text{ o } \ f(c) = m
      $$

      **Paso 4 — Fermat.** En $c$ hay un extremo local —de hecho absoluto— y
      $f$ es derivable ahí, porque $c \in (a,b)$ y la hipótesis 2 lo garantiza.
      Por el teorema de Fermat:

      $$
      f'(c) = 0 \qquad \blacksquare
      $$

      **Qué hace cada hipótesis:**

      | hipótesis | para qué sirve |
      |---|---|
      | continuidad en $[a,b]$ | que existan máximo y mínimo (Weierstrass) |
      | $f(a)=f(b)$ | que al menos uno caiga **dentro** |
      | derivabilidad en $(a,b)$ | poder aplicar Fermat en ese punto |

      Ninguna sobra, y cada una hace un trabajo distinto.

      ### 3 · Apartado (b): comprobar las tres hipótesis

      **Hipótesis 3, $f(a)=f(b)$:**

      $$
      f(0) = 0,
      \qquad
      f(2) = 2-2 = 0
      $$

      **Se cumple** ✔

      **Hipótesis 1, continuidad.** Dentro de cada rama es evidente. En el
      empalme:

      $$
      f(1^{-}) = 1^{3} = 1,
      \qquad
      f(1^{+}) = 2-1 = 1,
      \qquad
      f(1) = 1
      $$

      **Se cumple** ✔

      **Hipótesis 2, derivabilidad en $(0,2)$.** En el empalme:

      $$
      f'(1^{-}) = \left.3x^{2}\right|_{1} = 3,
      \qquad
      f'(1^{+}) = -1
      $$

      $$
      3 \neq -1
      $$

      **No se cumple.** ✗ La función tiene un **pico** en $x=1$, que es un
      punto interior del intervalo.

      $$
      \boxed{\text{El teorema de Rolle NO es aplicable}}
      $$

      ### 4 · Y la tesis tampoco se cumple

      El enunciado dice «en caso afirmativo, aplicarlo». No es el caso — pero
      merece la pena mirar si la conclusión se salva por otro camino, porque
      podría (las hipótesis son suficientes, no necesarias).

      ¿Existe algún $c \in (0,2)$ con $f'(c) = 0$?

      | tramo | $f'$ | ¿se anula? |
      |---|---|---|
      | $(0,1)$ | $3x^{2}$ | solo en $x=0$, que es extremo del intervalo |
      | $x=1$ | no existe | — |
      | $(1,2)$ | $-1$ | nunca |

      $$
      \boxed{\text{No existe tal } c: \text{ la tesis tampoco se cumple}}
      $$

      ### 5 · Por qué falla, en una frase

      La función **sí** tiene un máximo interior: está en $x=1$, donde vale 1.
      Ese es exactamente el punto donde Rolle habría puesto su $c$.

      Pero ahí la función no es derivable. El pico permite que la curva suba y
      baje **sin pasar por ninguna tangente horizontal**: llega con pendiente 3
      y sale con pendiente $-1$, saltándose el 0 sin tocarlo.

      Es el contraejemplo estándar de por qué la derivabilidad no se puede
      quitar del enunciado.

      ### 6 · Comprobación

      **Del valor máximo.** En $[0,1]$ la función crece de 0 a 1; en $(1,2]$
      decrece de 1 a 0. El máximo es 1 y está en $x=1$ ✔

      **De que el pico es real.** Acercándose por la izquierda con
      $h = 0{,}01$:

      $$
      \frac{f(1)-f(0{,}99)}{0{,}01} = \frac{1-0{,}9703}{0{,}01} = 2{,}97
      \approx 3
      $$

      y por la derecha:

      $$
      \frac{f(1{,}01)-f(1)}{0{,}01} = \frac{0{,}99-1}{0{,}01} = -1
      $$

      Las dos pendientes son las anunciadas ✔

  - id: ex2021-2ev-3-maclaurin-raiz-cubica
    titulo: La raíz cúbica de 0,9 sin calculadora
    fuente: >-
      Ejercicio 3 · Segunda evaluación, 23 de noviembre de 2020 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3

    nivel: examen
    enunciado: |
      **a)** Calcular el desarrollo de McLaurin de orden 2 de la función
      $y(x) = \sqrt[3]{1+x}$.

      **b)** Utilizando el desarrollo anterior calcular el valor aproximado
      $\sqrt[3]{0.9}$.

      **c)** Acotar el error cometido en dicho cálculo.
    pide: Calcular el desarrollo, aproximar y acotar el error.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué valor de $x$ hay que usar para aproximar $\sqrt[3]{0{,}9}$?
        opciones:
          - texto: >-
              $x = -0{,}1$, porque $0{,}9 = 1+(-0{,}1)$
            correcta: true
            mensaje: |
              Exacto. El desarrollo es de $\sqrt[3]{1+x}$, así que hay que
              escribir el número como $1$ más algo. Y ese algo es pequeño, que
              es justamente lo que hace buena la aproximación.
          - texto: $x = 0{,}9$
            mensaje: |
              Con $x=0{,}9$ se estaría aproximando $\sqrt[3]{1{,}9}$, no
              $\sqrt[3]{0{,}9}$.
          - texto: $x = 0{,}1$
            mensaje: |
              Eso daría $\sqrt[3]{1{,}1}$. El signo importa: hay que **restar**
              una décima a 1.
          - texto: >-
              $x = -1$, para que el radicando sea 0
            mensaje: |
              En $x=-1$ el desarrollo ni siquiera converge: la función tiene ahí
              una tangente vertical.

      - tipo: calcular
        titulo: El coeficiente cuadrático
        pregunta: |
          En $P_2(x) = 1+\frac{x}{3}+kx^{2}$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '-0.1111'
          tolerancia: 0.0005
          formato: en forma exacta, o un número con cuatro decimales
        distractores:
          - valor: '-0.2222'
            mensaje: |
              $-\frac29$ es $y''(0)$, la derivada segunda. El coeficiente es esa
              derivada **dividida entre $2!$**.
          - valor: '0.1111'
            mensaje: |
              Falta el signo. La raíz cúbica es **cóncava** para $x>-1$, así que
              su segunda derivada es negativa.
          - valor: '0.3333'
            mensaje: |
              $\frac13$ es el coeficiente lineal, no el cuadrático.
        pista: |
          $y'' (x) = -\frac29(1+x)^{-5/3}$.
        desarrollo: |
          $$
          y(x) = (1+x)^{1/3},
          \qquad
          y(0) = 1
          $$

          $$
          y'(x) = \tfrac13(1+x)^{-2/3},
          \qquad
          y'(0) = \tfrac13
          $$

          $$
          y''(x) = \tfrac13\cdot\left(-\tfrac23\right)(1+x)^{-5/3}
          = -\tfrac29(1+x)^{-5/3},
          \qquad
          y''(0) = -\tfrac29
          $$

          $$
          k = \frac{y''(0)}{2!} = \frac{-2/9}{2} = -\frac19
          \approx -0{,}1111
          $$

          $$
          P_2(x) = 1+\frac{x}{3}-\frac{x^{2}}{9}
          $$
        veredicto: |
          El signo negativo dice que la raíz cúbica se curva hacia abajo: crece
          cada vez más despacio. Coherente con que su exponente sea menor que 1.

      - tipo: calcular
        titulo: La cota del error
        pregunta: |
          ¿Cuál es la cota del error? Da la respuesta en unidades de
          $10^{-5}$, en forma exacta, o con dos decimales.
        respuesta:
          tipo: numero
          valor: '8.18'
          tolerancia: 0.05
          formato: un número
        distractores:
          - valor: '6.65'
            mensaje: |
              $6{,}65\cdot10^{-5}$ es el error **real**, no la cota. La cota es
              algo mayor, como debe ser.
          - valor: '6.17'
            mensaje: |
              $6{,}17\cdot10^{-5}$ sale de evaluar $y'''$ en $x=0$ en vez de en
              el peor punto del intervalo. Ahí $y'''$ vale $\frac{10}{27}$, pero
              en $x=-0{,}1$ es mayor.
          - valor: '61.73'
            mensaje: |
              Has olvidado dividir entre $3! = 6$.
        pista: |
          $y'''(x) = \frac{10}{27}(1+x)^{-8/3}$, y hay que tomar su máximo en
          $[-0{,}1;\,0]$.
        desarrollo: |
          $$
          y'''(x) = -\tfrac29\cdot\left(-\tfrac53\right)(1+x)^{-8/3}
          = \tfrac{10}{27}(1+x)^{-8/3}
          $$

          En $\xi \in (-0{,}1;\,0)$ el factor $(1+\xi)^{-8/3}$ es **mayor**
          cuanto menor sea $1+\xi$, así que el peor caso es $\xi = -0{,}1$:

          $$
          (0{,}9)^{-8/3} = 1{,}3244
          $$

          $$
          M = \tfrac{10}{27}\cdot1{,}3244 = 0{,}4905
          $$

          $$
          \left|R_2\right| \le \frac{M}{3!}\left|x\right|^{3}
          = \frac{0{,}4905}{6}\cdot(0{,}1)^{3}
          = 8{,}18\cdot10^{-5}
          $$
        veredicto: |
          El peor punto del intervalo está en el **extremo izquierdo**, porque
          la derivada tercera crece al acercarse a $x=-1$, donde la función
          tiene tangente vertical.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **El desarrollo.** $y(0)=1$, $y'(0)=\frac13$, $y''(0)=-\frac29$,
              luego $P_2(x) = 1+\frac x3-\frac{x^{2}}{9}$.
          - texto: |
              **La sustitución.** $0{,}9 = 1+(-0{,}1)$, así que $x=-0{,}1$.
          - texto: |
              $P_2(-0{,}1) = 1-\frac{0{,}1}{3}-\frac{0{,}01}{9}
              = 1-0{,}03333-0{,}00111 = 0{,}96556$.
          - texto: |
              **El resto de Lagrange:** $R_2 = \frac{y'''(\xi)}{3!}x^{3}$ con
              $\xi$ entre $-0{,}1$ y 0, e
              $y'''(x) = \frac{10}{27}(1+x)^{-8/3}$.
          - texto: |
              **La cota:** el máximo de $\left|y'''\right|$ en el intervalo está
              en $\xi=-0{,}1$ y vale $0{,}4905$, luego
              $\left|R_2\right| \le 8{,}18\cdot10^{-5}$.
          - texto: |
              Como $x=-0{,}1$ es negativo, $x^{3}$ también lo es y la cota sale
              negativa: el error es por defecto.
            trampa: true
            mensaje: |
              Una cota de error es siempre un **valor absoluto**: no puede ser
              negativa. Lo que sí es cierto —y es otra cosa— es que aquí el
              error tiene signo conocido: como $y'''>0$ y $x^{3}<0$, el resto es
              negativo y el polinomio se queda **por encima** del valor real. Y
              en efecto $0{,}96556 > 0{,}96549$.
        veredicto: |
          El signo del error se puede deducir, y es información extra: la
          aproximación es por exceso. Pero la cota, en valor absoluto.

    resolucion: |
      **Datos.** $y(x) = \sqrt[3]{1+x}$; desarrollo de orden 2, aproximación de
      $\sqrt[3]{0{,}9}$ y cota del error.

      ### 1 · Apartado (a): el desarrollo

      $$
      y(x) = (1+x)^{1/3}
      $$

      | | expresión | en $x=0$ |
      |---|---|---|
      | $y$ | $(1+x)^{1/3}$ | $1$ |
      | $y'$ | $\frac13(1+x)^{-2/3}$ | $\frac13$ |
      | $y''$ | $-\frac29(1+x)^{-5/3}$ | $-\frac29$ |
      | $y'''$ | $\frac{10}{27}(1+x)^{-8/3}$ | $\frac{10}{27}$ |

      $$
      \boxed{P_2(x) = 1+\frac{x}{3}-\frac{x^{2}}{9}}
      $$

      El signo negativo del término cuadrático refleja que la raíz cúbica es
      **cóncava**: crece cada vez más despacio.

      ### 2 · Apartado (b): la aproximación

      Hay que escribir el número como $1$ más algo pequeño:

      $$
      0{,}9 = 1+(-0{,}1)
      \;\Longrightarrow\;
      x = -0{,}1
      $$

      $$
      P_2(-0{,}1) = 1-\frac{0{,}1}{3}-\frac{0{,}01}{9}
      = 1-0{,}033333-0{,}001111
      $$

      $$
      \boxed{P_2(-0{,}1) = 0{,}965556 \;\approx\; \sqrt[3]{0{,}9}}
      $$

      Escrito en ese orden a propósito: **$0{,}965556$ es lo que da el
      polinomio**, no el valor de la raíz. La raíz vale $0{,}965489$, y la
      diferencia entre las dos es justo lo que el apartado (c) va a acotar.

      ### 3 · Apartado (c): la cota

      $$
      R_2(x) = \frac{y'''(\xi)}{3!}\,x^{3},
      \qquad \xi \text{ entre } -0{,}1 \text{ y } 0
      $$

      $$
      y'''(x) = \frac{10}{27}(1+x)^{-8/3}
      $$

      **Dónde es mayor.** El exponente es negativo, así que la expresión crece
      cuando $1+x$ **disminuye**. En el intervalo $[-0{,}1;\,0]$ el mínimo de
      $1+x$ es $0{,}9$:

      $$
      M = \max\left|y'''\right| = \frac{10}{27}\,(0{,}9)^{-8/3}
      = \frac{10}{27}\cdot1{,}3244 = 0{,}4905
      $$

      $$
      \left|R_2\right| \le \frac{0{,}4905}{6}\cdot(0{,}1)^{3}
      $$

      $$
      \boxed{\left|R_2\right| \le 8{,}18\cdot10^{-5}}
      $$

      ### 4 · Comprobación

      **El error real.** El valor exacto es
      $\sqrt[3]{0{,}9} = 0{,}9654894$, y

      $$
      \left|0{,}965556-0{,}965489\right| = 6{,}65\cdot10^{-5}
      $$

      $$
      6{,}65\cdot10^{-5} \le 8{,}18\cdot10^{-5} \quad\checkmark
      $$

      La cota se cumple, y con poco margen: es una cota **ajustada**, porque el
      intervalo es corto y $y'''$ apenas varía en él.

      **El signo del error**, que es información extra. Como $y'''>0$ y
      $x^{3} = -0{,}001 < 0$, el resto es **negativo**:

      $$
      y(x) = P_2(x)+R_2(x) < P_2(x)
      $$

      La aproximación queda **por exceso**. Y en efecto
      $0{,}965556 > 0{,}965489$ ✔

      **Por elevación al cubo**, que es una vía independiente:

      $$
      0{,}965556^{3} = 0{,}900186
      $$

      frente a $0{,}9$. La diferencia, $1{,}9\cdot10^{-4}$, es
      aproximadamente tres veces el error en la raíz — lo que corresponde a
      derivar $t^{3}$ en $t\approx0{,}97$, cuyo factor es
      $3t^{2} \approx 2{,}8$ ✔

  - id: ex2021-2ev-4-triangulo-de-area-minima
    titulo: La tangente que recorta el triángulo más pequeño
    fuente: >-
      Ejercicio 4 · Segunda evaluación, 23 de noviembre de 2020 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 8
      comp4: 1

    nivel: examen
    enunciado: |
      Calcular el punto de la función $y+x^{2}-4 = 0$ tal que la tangente a la
      función en dicho punto forme en el primer cuadrante con los ejes
      coordenados un triángulo de área mínima.
    pide: Calcular el punto de tangencia.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Entre qué valores puede estar la abscisa $a$ del punto de tangencia?
        opciones:
          - texto: >-
              Entre 0 y 2, para que el punto esté en el primer cuadrante
            correcta: true
            mensaje: |
              Exacto. La curva es $y = 4-x^{2}$, que corta al eje $OX$ en
              $x=\pm2$. En el primer cuadrante hacen falta $a>0$ y
              $y = 4-a^{2}>0$, es decir $a<2$.
          - texto: Cualquier valor positivo
            mensaje: |
              Con $a>2$ la ordenada sería negativa y el punto caería fuera del
              primer cuadrante.
          - texto: Entre $-2$ y 2
            mensaje: |
              Los negativos quedan fuera del primer cuadrante.
          - texto: Entre 0 y 4
            mensaje: |
              4 es el valor de $y$ en el vértice, no el corte con el eje $OX$.
              La curva se anula en $x=2$.

      - tipo: calcular
        titulo: Los cortes de la tangente
        pregunta: |
          La tangente en $x=a$ corta al eje $OY$ en un punto. ¿Cuál es su
          ordenada, en función de $a$? Evalúala para $a=1$.
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              3 es $4-a^{2}$ con $a=1$: la **ordenada del punto**, no del corte.
              La tangente sube al ir hacia la izquierda.
          - valor: '4'
            mensaje: |
              4 es el valor de la curva en $x=0$, es decir el vértice. La
              tangente en $a=1$ corta más arriba.
          - valor: '2'
            mensaje: |
              2 es donde la tangente corta el eje $OX$ cuando $a=1$, no el
              eje $OY$.
        pista: |
          $y' = -2x$. Escribe la tangente en $\left(a,4-a^{2}\right)$ y haz
          $x=0$.
        desarrollo: |
          Despejando, $y = 4-x^{2}$ y $y' = -2x$. La tangente en
          $\left(a,4-a^{2}\right)$:

          $$
          y = \left(4-a^{2}\right)-2a(x-a) = 4+a^{2}-2ax
          $$

          **Corte con $OY$** ($x=0$):

          $$
          y = 4+a^{2}
          $$

          Con $a=1$: $5$.

          **Corte con $OX$** ($y=0$):

          $$
          x = \frac{4+a^{2}}{2a}
          $$
        veredicto: |
          Nótese que el corte con $OY$ es $4+a^{2}$, **mayor** que el 4 del
          vértice: la tangente siempre queda por encima de la parábola, porque
          es cóncava.

      - tipo: calcular
        titulo: El punto óptimo
        pregunta: |
          ¿Cuál es la abscisa del punto de tangencia? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '1.1547'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '1.3333'
            mensaje: |
              $\frac43$ saldría de $3a=4$. La ecuación es $3a^{2}=4$: el
              cuadrado no desaparece.
          - valor: '2'
            mensaje: |
              2 es el extremo del dominio, donde la ordenada se anula. Ahí el
              triángulo no es mínimo: se dispara.
          - valor: '0.6666667'
            mensaje: |
              $\frac23$ saldría de despejar mal. $a = \frac{2}{\sqrt3}$, no
              $\frac23$.
        pista: |
          $A(a) = \frac{\left(a^{2}+4\right)^{2}}{4a}$. Deriva y factoriza.
        desarrollo: |
          El triángulo tiene por catetos los dos cortes:

          $$
          A(a) = \frac12\cdot\frac{4+a^{2}}{2a}\cdot\left(4+a^{2}\right)
          = \frac{\left(a^{2}+4\right)^{2}}{4a}
          $$

          Derivando, con la regla del cociente:

          $$
          A'(a) = \frac{2\left(a^{2}+4\right)(2a)(4a)
          -\left(a^{2}+4\right)^{2}\cdot4}{16a^{2}}
          $$

          $$
          = \frac{4\left(a^{2}+4\right)\left[4a^{2}-\left(a^{2}+4\right)\right]}
          {16a^{2}}
          = \frac{\left(a^{2}+4\right)\left(3a^{2}-4\right)}{4a^{2}}
          $$

          Como $a^{2}+4>0$ siempre, el signo lo decide $3a^{2}-4$:

          $$
          3a^{2} = 4
          \;\Longrightarrow\;
          a = \frac{2}{\sqrt3} = \frac{2\sqrt3}{3} \approx 1{,}1547
          $$
        veredicto: |
          Factorizar $\left(a^{2}+4\right)$ antes de igualar a cero convierte
          una expresión de aspecto temible en una ecuación de dos términos.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La curva.** $y+x^{2}-4=0$ es $y = 4-x^{2}$: parábola invertida
              con vértice en $(0,4)$ y cortes en $x=\pm2$.
          - texto: |
              **El dominio.** El punto debe estar en el primer cuadrante:
              $0<a<2$.
          - texto: |
              **La tangente** en $\left(a,4-a^{2}\right)$ es
              $y = 4+a^{2}-2ax$, y corta los ejes en
              $\left(\frac{4+a^{2}}{2a},0\right)$ y $\left(0,4+a^{2}\right)$.
          - texto: |
              **El área:**
              $A(a) = \frac{\left(a^{2}+4\right)^{2}}{4a}$, y
              $A'(a) = \frac{\left(a^{2}+4\right)\left(3a^{2}-4\right)}{4a^{2}}$.
          - texto: |
              **El óptimo:** $a = \frac{2}{\sqrt3}$, con $A'$ pasando de
              negativa a positiva. El punto es
              $\left(\frac{2\sqrt3}{3},\frac83\right)$.
          - texto: |
              Como el área es mínima, la tangente debe pasar por el vértice de
              la parábola.
            trampa: true
            mensaje: |
              La tangente en el vértice es la horizontal $y=4$, que **no corta**
              al eje $OY$ en un punto que forme triángulo: es paralela a $OX$ y
              el triángulo no existe. De hecho, cuanto más cerca del vértice, el
              área tiende a infinito. El óptimo está en el interior, no en
              ningún extremo.
        veredicto: |
          El área se dispara en los dos extremos del dominio: cerca del vértice
          porque la base se va al infinito, y cerca de $x=2$ porque la tangente
          se vuelve muy inclinada. El mínimo está en medio.

    resolucion: |
      **Datos.** La curva $y+x^{2}-4=0$ y una tangente que recorta un triángulo
      con los ejes en el primer cuadrante.

      ### 1 · La curva y el dominio

      $$
      y = 4-x^{2}
      $$

      Parábola invertida, vértice en $(0,4)$, cortes con $OX$ en $x=\pm2$.

      Para que el punto de tangencia esté en el **primer cuadrante**:

      $$
      a>0
      \qquad\text{y}\qquad
      4-a^{2}>0
      \;\Longrightarrow\;
      \boxed{0<a<2}
      $$

      ### 2 · La tangente y sus cortes

      $$
      y' = -2x
      \;\Longrightarrow\;
      y'(a) = -2a
      $$

      $$
      y-\left(4-a^{2}\right) = -2a(x-a)
      \;\Longrightarrow\;
      y = 4+a^{2}-2ax
      $$

      | corte | valor |
      |---|---|
      | con $OY$ ($x=0$) | $4+a^{2}$ |
      | con $OX$ ($y=0$) | $\dfrac{4+a^{2}}{2a}$ |

      Los dos son **positivos** en el dominio, así que el triángulo existe y
      está en el primer cuadrante.

      ### 3 · El área

      $$
      A(a) = \frac12\cdot\underbrace{\frac{4+a^{2}}{2a}}_{\text{base}}
      \cdot\underbrace{\left(4+a^{2}\right)}_{\text{altura}}
      = \frac{\left(a^{2}+4\right)^{2}}{4a}
      $$

      ### 4 · Optimizar

      Derivando con la regla del cociente y **factorizando**, que es lo que
      hace la cuenta manejable:

      $$
      A'(a) = \frac{4\left(a^{2}+4\right)\cdot4a^{2}
      -4\left(a^{2}+4\right)^{2}}{16a^{2}}
      = \frac{\left(a^{2}+4\right)\left[4a^{2}-a^{2}-4\right]}{4a^{2}}
      $$

      $$
      A'(a) = \frac{\left(a^{2}+4\right)\left(3a^{2}-4\right)}{4a^{2}}
      $$

      El factor $a^{2}+4$ es siempre positivo y $4a^{2}$ también, así que el
      signo de $A'$ es el de $3a^{2}-4$:

      | $a$ | $3a^{2}-4$ | $A$ |
      |---|---|---|
      | $0<a<\frac{2}{\sqrt3}$ | $-$ | decrece |
      | $a=\frac{2}{\sqrt3}$ | $0$ | **mínimo** |
      | $\frac{2}{\sqrt3}<a<2$ | $+$ | crece |

      $$
      a = \frac{2}{\sqrt3} = \frac{2\sqrt3}{3} \approx 1{,}1547
      $$

      $$
      y = 4-\frac43 = \frac83
      $$

      $$
      \boxed{P = \left(\frac{2\sqrt3}{3},\ \frac83\right)
      \approx (1{,}1547;\ 2{,}6667)}
      $$

      Y el área mínima:

      $$
      A_{\min} = \frac{\left(\frac43+4\right)^{2}}{4\cdot\frac{2}{\sqrt3}}
      = \frac{\left(\frac{16}{3}\right)^{2}\sqrt3}{8}
      = \frac{256}{9}\cdot\frac{\sqrt3}{8} = \frac{32\sqrt3}{9}
      \approx 6{,}158
      $$

      ### 5 · Por qué el mínimo está dentro

      En los dos extremos del dominio el área **se dispara**:

      $$
      \lim_{a\to0^{+}}A(a) = +\infty
      $$

      —la tangente se vuelve casi horizontal y su corte con $OX$ se va al
      infinito—, y

      $$
      A(2) = \frac{64}{8} = 8 > 6{,}16
      $$

      Así que el mínimo local es **absoluto** en $(0,2)$.

      ### 6 · Comprobación

      **Numérica:**

      | $a$ | $A(a)$ |
      |---|---|
      | $0{,}8$ | $6{,}66$ |
      | $1$ | $6{,}25$ |
      | $1{,}1547$ | $\mathbf{6{,}158}$ |
      | $1{,}4$ | $6{,}28$ |
      | $2$ | $8$ |

      El del punto crítico es el menor ✔

      **De la relación entre los cortes.** En el óptimo:

      $$
      \text{base} = \frac{16/3}{2\cdot\frac{2}{\sqrt3}}
      = \frac{16/3}{4/\sqrt3} = \frac{4\sqrt3}{3} \approx 2{,}309
      $$

      $$
      \text{altura} = \frac{16}{3} \approx 5{,}333
      $$

      Y $\frac12\cdot2{,}309\cdot5{,}333 = 6{,}158$ ✔

      **Una coincidencia que sirve de comprobación:** la abscisa del corte con
      $OX$ vale $\frac{4\sqrt3}{3} = 2a$, exactamente el **doble** de la
      abscisa del punto de tangencia. Es decir, en el óptimo el punto de
      tangencia resulta ser el **punto medio** del segmento de tangente
      comprendido entre los dos ejes.

      Se comprueba directamente: la condición del óptimo es $3a^{2}=4$, y el
      corte con $OX$ es $\frac{4+a^{2}}{2a}$, que con $4 = 3a^{2}$ se convierte
      en $\frac{4a^{2}}{2a} = 2a$ ✔ No es una regla general que se pueda usar a
      ciegas en otros problemas, pero aquí cierra la cuenta por una vía
      distinta.
