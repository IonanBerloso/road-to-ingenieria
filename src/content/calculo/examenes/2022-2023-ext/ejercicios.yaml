      **Lo que cuenta el dibujo.** El objeto retrocede un poco, se para, vuelve
      **exactamente** al punto de partida en $t=3$ —$x(3)=x(0)=2$— y a partir de
      ahí se va sin volver. Esa coincidencia no es casual: significa que el área
      bajo $v$ entre $1$ y $3$ compensa exactamente la de entre $0$ y $1$.

  - id: ex2223-ext-3-un-extremo-que-no-lo-es-y-un-valor-absoluto
    titulo: Un punto que parece extremo y no lo es, y un valor absoluto dentro de una integral
    fuente: >-
      Ejercicio 3 del PRIMER PARCIAL · Convocatoria extraordinaria, 3 de julio de
      2023 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      a) Deducir si la curva $x\cos y+y\operatorname{sen}x=0$ tiene un extremo
      local en el punto $\left(\pi,\frac{\pi}{2}\right)$.

      b) Calcular el polinomio de McLaurin de orden 2 de la función
      $$
      f(x)=\int_{0}^{x}\left|z-1\right|\,dz
      $$
    pide: Si hay extremo, y el polinomio.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que comprobar **antes** de derivar en el apartado a)?
        opciones:
          - texto: >-
              Que el punto está en la curva, sustituyéndolo en la ecuación
            correcta: true
            mensaje: |
              Eso es, y cuesta diez segundos: $\pi\cos\frac\pi2+\frac\pi2
              \operatorname{sen}\pi=0+0=0$ ✓. Hablar del extremo de una curva en
              un punto que no le pertenece no significa nada, y decirlo puntúa.
          - texto: >-
              Que la curva se puede despejar en $y$
            mensaje: |
              No se puede, y no hace falta: para eso está la derivación
              implícita. Lo que sí hay que comprobar es que el punto pertenece a
              la curva.
          - texto: >-
              Que la segunda derivada existe en ese punto
            mensaje: |
              Eso haría falta para **clasificar** el extremo, y solo si lo
              hubiera. Aquí ni siquiera hay punto crítico, así que la segunda
              derivada no llega a hacer falta.

      - tipo: calcular
        titulo: La pendiente en el punto
        pregunta: |
          ¿Cuánto vale $y'$ en $\left(\pi,\frac{\pi}{2}\right)$?
        respuesta:
          tipo: numero
          valor: '-0.5'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0'
            mensaje: |
              Si valiera cero **sí** habría punto crítico, y el ejercicio no
              tendría gracia. La cuenta da $-\frac12$: la tangente está
              inclinada.
          - valor: '0.5'
            mensaje: |
              Signo. El numerador sale $+\frac\pi2$ y el denominador $-\pi$, así
              que el cociente es negativo.
          - valor: '-2'
            mensaje: |
              $-2$ es el inverso de la respuesta: parece que has puesto el
              cociente al revés. La derivada implícita es
              $y'=-\frac{G_{x}}{G_{y}}$.
        pista: |
          Derivando: $\cos y-x\operatorname{sen}y\cdot y'+y'\operatorname{sen}x
          +y\cos x=0$. Sustituye y despeja.
        desarrollo: |
          En $\left(\pi,\frac\pi2\right)$: $\cos\frac\pi2=0$, $\cos\pi=-1$,
          $\operatorname{sen}\pi=0$, $\operatorname{sen}\frac\pi2=1$.

          $$
          0-\pi y'+0+\frac\pi2\left(-1\right)=0
          \;\Longrightarrow\;
          -\pi y'=\frac\pi2
          \;\Longrightarrow\;
          y'=-\frac12
          $$

      - tipo: calcular
        titulo: El coeficiente cuadrático
        pregunta: |
          En $P_{2}(x)=x+kx^{2}$ para la función del apartado b), ¿cuánto vale
          $k$?
        respuesta:
          tipo: numero
          valor: '-0.5'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              Signo. Cerca del origen $\left|z-1\right|=1-z$, así que
              $f''(x)=-1$ y el coeficiente es $\frac{-1}{2!}=-\frac12$.
          - valor: '-1'
            mensaje: |
              $-1$ es $f''(0)$, y el coeficiente del polinomio lo divide entre
              $2!$.
          - valor: '0'
            mensaje: |
              Cero sería si $f''(0)$ se anulara. Vale $-1$: el valor absoluto
              tiene pendiente $-1$ a la izquierda de su vértice.
        pista: |
          $f'(x)=\left|x-1\right|$, y cerca de $0$ eso es $1-x$.
        desarrollo: |
          Por el teorema fundamental, $f'(x)=\left|x-1\right|$, y en un entorno
          del origen —donde $x<1$— eso vale $1-x$. Entonces $f'(0)=1$ y
          $f''(0)=-1$:

          $$
          P_{2}(x)=0+x-\frac{1}{2}x^{2}
          $$

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              $f(0)=0$ por definición, y por el teorema fundamental
              $f'(x)=\left|x-1\right|$.
          - texto: >-
              Cerca del origen, $x<1$, así que $\left|x-1\right|=1-x$: $f'(0)=1$ y
              $f''(0)=-1$.
          - texto: >-
              Luego $P_{2}(x)=x-\frac{x^{2}}{2}$, y de hecho eso **coincide con
              $f$** en todo el intervalo $\left[0,1\right]$, porque allí el
              integrando es un polinomio de grado uno.
          - texto: >-
              El polinomio vale para cualquier $x$, porque el desarrollo de
              Taylor aproxima la función en todo su dominio.
            trampa: true
            mensaje: |
              Aquí falla en cuanto se pasa de $x=1$: allí el integrando cambia de
              rama y $f$ deja de ser el polinomio. En $x=1{,}5$ la función vale
              $0{,}625$ y el polinomio $0{,}375$. Un desarrollo de Taylor es
              **local**, y el punto donde $f''$ no existe —aquí, $x=1$— marca el
              límite natural.
    resolucion: |
      **a) El punto que no es extremo.**

      Lo primero, comprobar que el punto está en la curva:

      $$
      \pi\cos\frac\pi2+\frac\pi2\operatorname{sen}\pi=0+0=0\quad\checkmark
      $$

      Ahora la derivación implícita, tratando $y$ como función de $x$:

      $$
      \cos y-x\operatorname{sen}y\cdot y'+y'\operatorname{sen}x+y\cos x=0
      $$

      $$
      y'\left(\operatorname{sen}x-x\operatorname{sen}y\right)
      =-\cos y-y\cos x
      $$

      En $\left(\pi,\frac\pi2\right)$ el numerador vale
      $0+\frac\pi2=\frac\pi2$ y el denominador $0-\pi=-\pi$:

      $$
      \boxed{\;y'=-\frac12\ne0\;}
      $$

      Y con eso está contestado: **no hay extremo local**. Un extremo exige
      tangente horizontal, y aquí la tangente baja con pendiente un medio.

      **Lo que hay que decir y no calcular.** No hace falta la segunda derivada
      para nada. La condición necesaria de extremo es $y'=0$, y ya falla.

      **b) El polinomio.** Por el teorema fundamental,

      $$
      f(0)=0,\qquad f'(x)=\left|x-1\right|
      $$

      Cerca del origen $x<1$, así que $\left|x-1\right|=1-x$, y de ahí

      $$
      f'(0)=1,\qquad f''(0)=-1
      $$

      $$
      \boxed{\;P_{2}(x)=x-\frac{x^{2}}{2}\;}
      $$

      **Y una casualidad que conviene entender.** En todo el intervalo
      $\left[0,1\right]$ el integrando es $1-z$, un polinomio de grado uno, así
      que la integral es exactamente $x-\frac{x^{2}}{2}$: **el polinomio de
      Taylor no aproxima, coincide**. Deja de hacerlo al pasar $x=1$, que es
      justo donde el valor absoluto hace esquina y $f''$ deja de existir.

      En $x=1{,}5$, por ejemplo, la función vale $0{,}625$ y el polinomio
      $0{,}375$: un cuarenta por ciento de error. El desarrollo es local, y aquí
      se ve exactamente dónde acaba su validez.

  - id: ex2223-ext-4-la-chapa-y-el-rectangulo-que-cabe-dentro
    titulo: Una chapa parabólica, y el rectángulo más grande que cabe dentro
    fuente: >-
      Ejercicio 4 del PRIMER PARCIAL · Convocatoria extraordinaria, 3 de julio de
      2023 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Una chapa de acero tiene la forma del dominio limitado por las condiciones
      $y\le 4-x^{2}$, $y\ge1$.

      a) Dibujar la chapa.

      b) Calcular el área de la chapa.

      c) Calcular las dimensiones del rectángulo de área máxima que puede
      construirse en la chapa sabiendo que uno de los lados está sobre la recta
      $y=1$.
    pide: El dibujo, el área y las dimensiones del rectángulo.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de plantear el apartado c), ¿qué se puede afirmar del
          rectángulo óptimo sin hacer ninguna cuenta?
        opciones:
          - texto: >-
              Que está centrado en el eje $Y$, porque la chapa es simétrica
              respecto de ese eje
            correcta: true
            mensaje: |
              Eso es, y es lo que reduce el problema a **una** variable en vez
              de dos. Decirlo con esa frase —«por simetría respecto del eje
              $Y$»— es lo primero que hay que escribir, y puntúa.
          - texto: >-
              Que su lado superior toca la parábola en dos puntos
            mensaje: |
              Es cierto en el óptimo, pero no es algo que se pueda afirmar de
              entrada: hay rectángulos inscritos que no llegan a tocar. Lo que sí
              se sabe de entrada es la simetría.
          - texto: >-
              Que su área es la mitad de la de la chapa
            mensaje: |
              Eso habría que demostrarlo, y de hecho es falso: sale $4$ de
              $4\sqrt3\approx6{,}93$, o sea el $58\,\%$. Las proporciones de este
              tipo no se adivinan.

      - tipo: calcular
        titulo: Los cortes
        pregunta: |
          ¿En qué abscisa positiva se cortan la parábola y la recta?
        respuesta:
          tipo: numero
          valor: '1.7320508'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es donde la parábola corta al eje $X$, no a la recta $y=1$.
              Hay que resolver $4-x^{2}=1$, no $4-x^{2}=0$.
          - valor: '1'
            mensaje: |
              $1$ es la altura de la recta, no la abscisa del corte. Se resuelve
              $x^{2}=3$.
          - valor: '3'
            mensaje: |
              $3$ es $x^{2}$, no $x$. Falta la raíz.
        pista: |
          $4-x^{2}=1$.
        desarrollo: |
          $$
          4-x^{2}=1\;\Longrightarrow\;x=\pm\sqrt3\approx\pm1{,}732
          $$

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área de la chapa?
        respuesta:
          tipo: numero
          valor: '6.9282032'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '10.6666667'
            mensaje: |
              $\frac{32}{3}$ es el área entre la parábola y el **eje $X$**, de
              $-2$ a $2$. La chapa está cortada por arriba de la recta $y=1$.
          - valor: '3.4641016'
            mensaje: |
              La mitad. Parece que has integrado solo de $0$ a $\sqrt3$: la chapa
              es simétrica y ocupa también el lado negativo.
          - valor: '13.856406'
            mensaje: |
              El doble. Cuidado con duplicar por simetría **y** además integrar
              en todo el intervalo: se cuenta dos veces.
        pista: |
          $\displaystyle\int_{-\sqrt3}^{\sqrt3}\left(3-x^{2}\right)dx$.
        desarrollo: |
          $$
          A=\int_{-\sqrt3}^{\sqrt3}\left[\left(4-x^{2}\right)-1\right]dx
          =\left[3x-\frac{x^{3}}{3}\right]_{-\sqrt3}^{\sqrt3}
          =2\left(3\sqrt3-\sqrt3\right)=4\sqrt3\approx6{,}928
          $$

      - tipo: calcular
        titulo: El rectángulo
        pregunta: |
          ¿Cuál es el área del rectángulo máximo?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '6.9282032'
            mensaje: |
              Ese es el área de la chapa entera. El rectángulo inscrito es
              necesariamente menor: se lleva el $58\,\%$.
          - valor: '2'
            mensaje: |
              $2$ es cada una de las dos dimensiones del rectángulo, no su área.
              El área es su producto.
          - valor: '3.4641016'
            mensaje: |
              $2\sqrt3$ saldría con base $2\sqrt3$ y altura $1$, o sea el
              rectángulo más ancho posible — que no es el más grande.
        pista: |
          Con la esquina superior en $\left(x,4-x^{2}\right)$, la base mide $2x$
          y la altura $3-x^{2}$.
        desarrollo: |
          $$
          A(x)=2x\left(3-x^{2}\right)=6x-2x^{3}
          \;\Longrightarrow\;
          A'(x)=6-6x^{2}=0
          \;\Longrightarrow\;
          x=1
          $$

          Base $2x=2$, altura $3-1=2$: **un cuadrado de lado $2$**, de área $4$.

      - tipo: justificar
        pregunta: Ordena el apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              Por simetría, el rectángulo óptimo está centrado en el eje $Y$: si
              su esquina superior derecha es $\left(x,4-x^{2}\right)$, la base
              mide $2x$ y la altura $\left(4-x^{2}\right)-1=3-x^{2}$.
          - texto: >-
              $A(x)=6x-2x^{3}$ y $A'=6-6x^{2}$ se anula en $x=1$, con
              $A''=-12x<0$: es máximo.
          - texto: >-
              Sale base $2$ y altura $2$, o sea un **cuadrado** de área $4$,
              frente a los $4\sqrt3\approx6{,}93$ de la chapa entera.
          - texto: >-
              Que salga un cuadrado era previsible, porque de todos los
              rectángulos el cuadrado es el de mayor área.
            trampa: true
            mensaje: |
              El cuadrado es el de mayor área **a igualdad de perímetro**, y aquí
              el perímetro no está fijado: lo que restringe es caber bajo la
              parábola. Que salga cuadrado es una casualidad de estos números
              concretos —con $y\le 9-x^{2}$ e $y\ge1$, por ejemplo, ya no lo es—.
              Comprobar la coincidencia está bien; usarla como argumento, no.
    resolucion: |
      **a) La chapa.** La parábola $y=4-x^{2}$ por arriba y la recta $y=1$ por
      abajo. Se cortan donde $4-x^{2}=1$, o sea en $x=\pm\sqrt3$.

      <figure class="figura-examen">
      <svg viewBox="0 0 380 250" role="img" width="380" height="250"
           aria-labelledby="cha23-t cha23-d">
