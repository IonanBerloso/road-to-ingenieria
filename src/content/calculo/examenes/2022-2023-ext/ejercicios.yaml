        <text class="ram23-l" x="150" y="31.4" fill="var(--alt)">F(t) = |t| − 2π, periódica</text>
      </svg>
      <figcaption>
      A la izquierda la función del enunciado, una rampa que sube de menos dos pi
      a menos pi entre cero y pi. A la derecha la ampliación par repetida: una
      sierra de uves toda por debajo del eje, sin ningún salto.
      </figcaption>
      </figure>

      **Fíjate en que no salta en ningún sitio**: la ampliación par nunca salta
      en el origen, y en $\pm\pi$ las dos ramas llegan al mismo valor $-\pi$.
      Eso hace trivial el apartado d).

      **c) La serie.** Al ser par, todos los $b_{n}$ se anulan.

      $$
      \frac{a_{0}}{2}=\frac{1}{\pi}\int_{0}^{\pi}\left(t-2\pi\right)dt
      =-\frac{3\pi}{2}
      $$

      $$
      a_{n}=\frac{2}{\pi}\int_{0}^{\pi}\left(t-2\pi\right)\cos nt\,dt
      =\frac{2}{\pi}\cdot\frac{\left(-1\right)^{n}-1}{n^{2}}
      $$

      —el término $-2\pi\cos nt$ se integra a cero, porque
      $\operatorname{sen}\left(n\pi\right)=0$—. Así que $a_{n}=0$ para $n$ par y
      $-\frac{4}{\pi n^{2}}$ para $n$ impar:

      $$
      \boxed{\;S(t)=-\frac{3\pi}{2}-\frac{4}{\pi}\sum_{n=0}^{\infty}
      \frac{\cos\left(\left(2n+1\right)t\right)}{\left(2n+1\right)^{2}}\;}
      $$

      **d) Los dos puntos.** Los dos son de continuidad, así que $S$ y $F$
      coinciden:

      | punto | $F$ | $S$ |
      |---|---|---|
      | $t=0$ | $-2\pi$ | $-2\pi$ |
      | $t=\frac\pi2$ | $-\frac{3\pi}{2}$ | $-\frac{3\pi}{2}$ |

      Y eso es lo que hay que **justificar**: con una ampliación par no hay
      saltos, así que Dirichlet no cambia nada. Con la impar habría sido otra
      historia.

      **e) La suma.** Evaluando en $t=0$, donde todos los cosenos valen $1$:

      $$
      -2\pi=-\frac{3\pi}{2}-\frac{4}{\pi}\sum_{n=0}^{\infty}
      \frac{1}{\left(2n+1\right)^{2}}
      $$

      $$
      \frac{4}{\pi}\sum=-\frac{3\pi}{2}+2\pi=\frac{\pi}{2}
      \;\Longrightarrow\;
      \boxed{\;\sum_{n=0}^{\infty}\frac{1}{\left(2n+1\right)^{2}}
      =\frac{\pi^{2}}{8}\;}
      $$

      **Y una cosa que conviene ver.** El $-2\pi$ del enunciado solo mueve el
      término constante: los $a_{n}$ con $n\ge1$ no lo notan, porque la integral
      de una constante por un coseno sobre un periodo es cero. La misma función
      con $+\pi$ en vez de $-2\pi$ —que es justo lo que cayó en la
      extraordinaria de 2024-2025— tiene los **mismos** coeficientes salvo
      $a_{0}$, y da la misma suma.
