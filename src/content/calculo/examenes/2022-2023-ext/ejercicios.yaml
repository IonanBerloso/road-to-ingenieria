      <figcaption>
      La sección que contiene el eje. Las paredes son verticales en el radio
      uno, la tapa es plana a la altura cuatro, y el fondo es la parábola que
      baja de uno en el centro a cero en el borde.
      </figcaption>
      </figure>

      **El volumen.** Cada columna vertical va de $z=1-\rho^{2}$ hasta $z=4$, o
      sea que mide $3+\rho^{2}$:

      $$
      V=\int_{0}^{2\pi}\!\!\int_{0}^{1}\left(3+\rho^{2}\right)\rho\,d\rho\,
      d\theta=2\pi\left(\frac32+\frac14\right)
      =\boxed{\;\frac{7\pi}{2}\approx11{,}00\;}
      $$

      **La comprobación.** El cilindro completo mediría $4\pi\approx12{,}57$, y
      el paraboloide le quita $\frac{\pi}{2}\approx1{,}57$. La resta cuadra ✓.

      **b) El centro de masa, planteado.** La densidad es
      $\delta=k\rho$ — «distancia al eje $OZ$» es exactamente la coordenada
      radial, y esa es la razón de trabajar en cilíndricas.

      **Dos coordenadas salen sin integrar:** el sólido es de revolución y la
      densidad también lo es, así que

      $$
      \overline x=\overline y=0
      $$

      Y la tercera:

      $$
      M=k\int_{0}^{2\pi}\!\!\int_{0}^{1}\!\!\int_{1-\rho^{2}}^{4}
      \rho\cdot\rho\;dz\,d\rho\,d\theta
      $$

      $$
      \overline z=\frac{1}{M}\;k\int_{0}^{2\pi}\!\!\int_{0}^{1}\!\!
      \int_{1-\rho^{2}}^{4} z\,\rho\cdot\rho\;dz\,d\rho\,d\theta
      $$

      **Fíjate en el doble $\rho$**: uno viene de la densidad y otro del
      jacobiano de las cilíndricas. Perder uno de los dos es el error más
      frecuente del apartado, y como el enunciado solo pide **plantear**, es
      exactamente lo que se corrige.

      **Y el resultado, aunque no se pida.** Haciendo las cuentas,
      $M=\frac{12\pi k}{5}$ y el momento vale $\frac{184\pi k}{35}$, de donde

      $$
      \overline z=\frac{46}{21}\approx2{,}19
      $$

      Está **por encima** de la mitad de la altura, que sería $2$ si el fondo
      fuera plano. Tiene sentido: el fondo curvo quita material por abajo, y la
      densidad $k\rho$ carga el peso hacia el borde, que es donde el sólido es
      más alto.

  - id: ex2223-ext-6-dos-segundos-miembros-y-uno-resuena
    titulo: Dos segundos miembros, y solo uno resuena
    fuente: >-
      Ejercicio 2 del SEGUNDO PARCIAL · Convocatoria extraordinaria, 3 de julio
      de 2023 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Resolver la EDO
      $$
      y''+25y=13e^{x}+2\cos 5x
      $$
    pide: La solución general.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál de los dos términos del segundo miembro **resuena** con la
          homogénea?
        opciones:
          - texto: >-
              El $2\cos 5x$, porque $\cos 5x$ es solución de la homogénea
            correcta: true
            mensaje: |
              Eso es. La característica $r^{2}+25=0$ da $r=\pm5i$, así que la
              homogénea es $C_{1}\cos 5x+C_{2}\operatorname{sen}5x$ — y el
              coseno del segundo miembro está ahí dentro. Hay que multiplicar su
              particular por $x$.
          - texto: >-
              El $13e^{x}$, porque la exponencial siempre resuena
            mensaje: |
              Resonaría si $r=1$ fuera raíz de la característica, y no lo es:
              las raíces son $\pm5i$. Para la exponencial vale la propuesta
              normal, $Ae^{x}$.
          - texto: Los dos
            mensaje: |
              Solo uno. Y es importante mirarlos **por separado**: cada término
              del segundo miembro tiene su propia particular y su propia
              comprobación de resonancia.

      - tipo: calcular
        titulo: La parte exponencial
        pregunta: |
          En la particular $y_{p}=Ae^{x}$, ¿cuánto vale $A$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '13'
            mensaje: |
              $13$ es el coeficiente del segundo miembro sin dividir. Al
              sustituir, $A+25A=26A$ tiene que valer $13$.
          - valor: '0.52'
            mensaje: |
              $\frac{13}{25}$ sale de olvidar que $y''$ también aporta:
              $\left(Ae^{x}\right)''=Ae^{x}$, así que el denominador es $26$, no
              $25$.
          - valor: '2'
            mensaje: |
              $2$ es el coeficiente del coseno, que va por otro lado. Aquí se
              trata del $13$.
        pista: |
          Sustituye $y=Ae^{x}$: $y''=Ae^{x}$, y la ecuación queda
          $26Ae^{x}=13e^{x}$.
        desarrollo: |
          $$
          A+25A=13
          \;\Longrightarrow\;
          26A=13
          \;\Longrightarrow\;
          A=\frac12
          $$

      - tipo: calcular
        titulo: La parte que resuena
        pregunta: |
          La particular del coseno es $y_{p}=Cx\operatorname{sen}5x$. ¿Cuánto
          vale $C$?
        respuesta:
          tipo: numero
          valor: '0.2'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.1'
            mensaje: |
              La mitad. Al derivar dos veces $x\operatorname{sen}5x$ sale
              $10C\cos 5x$ más el término que se cancela con el $25y$: hay que
              igualar $10C=2$.
          - valor: '5'
            mensaje: |
              $5$ es la frecuencia, no el coeficiente. La cuenta da
              $C=\frac{2}{10}$.
          - valor: '0.4'
            mensaje: |
              $\frac25$ saldría de $5C=2$. El factor que aparece al derivar dos
              veces es $10$, no $5$.
        pista: |
          Con $y_{p}=Cx\operatorname{sen}5x$, al calcular $y_{p}''+25y_{p}$
          sobrevive solo $10C\cos5x$.
        desarrollo: |
          $$
          y_{p}=Cx\operatorname{sen}5x
          \;\Longrightarrow\;
          y_{p}''+25y_{p}=10C\cos 5x
          $$

          Igualando a $2\cos5x$: $C=\frac15$.

          Ojo: la propuesta general es
          $x\left(B\cos5x+C\operatorname{sen}5x\right)$, y al sustituir sale
          $B=0$. Conviene escribirla entera y dejar que la cuenta anule lo que
          sobre.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La característica $r^{2}+25=0$ tiene raíces imaginarias puras
              $\pm5i$, así que la homogénea es
              $C_{1}\cos5x+C_{2}\operatorname{sen}5x$.
          - texto: >-
              El $13e^{x}$ **no** resuena, porque $1$ no es raíz: su particular
              es $\frac12 e^{x}$.
          - texto: >-
              El $2\cos5x$ **sí** resuena, así que su particular lleva un factor
              $x$ delante: sale $\frac{x}{5}\operatorname{sen}5x$.
          - texto: >-
              Como el segundo miembro tiene dos términos, hay que resolver la
              ecuación dos veces y quedarse con la solución que cumpla las dos.
            trampa: true
            mensaje: |
              No hay que quedarse con una: se **suman**. El principio de
              superposición dice que si $y_{1}$ resuelve la ecuación con el
              primer segundo miembro e $y_{2}$ con el segundo, entonces
              $y_{1}+y_{2}$ resuelve la de la suma. Por eso se tratan los
              términos por separado y luego se juntan, no se elige.
    resolucion: |
      **La homogénea.** $r^{2}+25=0$ da $r=\pm5i$, raíces imaginarias puras:

      $$
      y_{h}=C_{1}\cos 5x+C_{2}\operatorname{sen}5x
      $$

      **Dos segundos miembros, y el principio de superposición.** Se resuelve
      cada uno por su lado y las particulares se **suman**.

      **El primero, $13e^{x}$: no resuena.** El exponente es $1$ y las raíces
      son $\pm5i$, así que la propuesta normal vale:

      $$
      y_{p_{1}}=Ae^{x}
      \;\Longrightarrow\;
      A+25A=13
      \;\Longrightarrow\;
      A=\frac12
      $$

      **El segundo, $2\cos5x$: resuena.** $\cos5x$ **está** en la homogénea, así
      que la propuesta $B\cos5x+C\operatorname{sen}5x$ se anularía al sustituir.
      Hay que multiplicar por $x$:

      $$
      y_{p_{2}}=x\left(B\cos5x+C\operatorname{sen}5x\right)
      $$

      Derivando dos veces, los términos con $x$ se cancelan contra el $25y$ y
      queda

      $$
      y_{p_{2}}''+25y_{p_{2}}=-10B\operatorname{sen}5x+10C\cos5x=2\cos5x
      $$

      de donde $B=0$ y $C=\frac15$.

      $$
      \boxed{\;y=C_{1}\cos5x+C_{2}\operatorname{sen}5x
      +\frac{e^{x}}{2}+\frac{x}{5}\operatorname{sen}5x\;}
      $$

      **Cómo se ve la resonancia en la solución.** El término
      $\frac{x}{5}\operatorname{sen}5x$ oscila con **amplitud creciente**: el
      $x$ de delante lo hace crecer sin límite. Físicamente es un oscilador
      empujado justo a su frecuencia propia, y es lo que rompe los puentes. La
      exponencial, en cambio, aporta un término que crece pero sin oscilar.

      **La comprobación, en un punto.** Con $x=1$: la parte particular vale
      $\frac{e}{2}+\frac{\operatorname{sen}5}{5}$, y al sustituirla en
      $y''+25y$ sale $13e+2\cos5=35{,}905$, que es exactamente el segundo
      miembro ✓.

  - id: ex2223-ext-7-la-ecuacion-integral-del-seno
    titulo: Una ecuación con la incógnita dentro de una integral
    fuente: >-
      Ejercicio 3 del SEGUNDO PARCIAL · Convocatoria extraordinaria, 3 de julio
      de 2023 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Resolver la siguiente ecuación integral utilizando la transformada de
      Laplace:
      $$
      y(t)=t+\int_{0}^{t}\operatorname{sen}\left(t-u\right)y(u)\,du
      $$
    pide: La función y(t).

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es esa integral?
        opciones:
          - texto: >-
              Una **convolución** de $\operatorname{sen}t$ con $y$, porque el
              integrando lleva $\left(t-u\right)$ y $u$ en factores separados
            correcta: true
            mensaje: |
              Eso es, y es la señal que hay que reconocer: integral de $0$ a
              $t$, un factor con $t-u$ y otro con $u$. Su transformada es el
              **producto** de las transformadas, y eso convierte la ecuación en
              algebraica.
          - texto: >-
              Una integral por partes disfrazada
            mensaje: |
              Por partes no se puede: la incógnita $y$ está **dentro** de la
              integral, así que no se conoce el integrando.
          - texto: >-
              Una integral definida, que da un número
            mensaje: |
              El límite superior es $t$, la variable: la integral es una
              **función** de $t$, no un número. Y además lleva $t$ dentro del
              seno.

      - tipo: calcular
        titulo: La transformada despejada
        pregunta: |
          Despejando, $Y(s)=\dfrac{s^{2}+1}{s^{n}}$. ¿Cuánto vale $n$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              $s^{2}$ es el denominador de la transformada de $t$ sola. Al
              despejar aparece un factor $\frac{s^{2}+1}{s^{2}}$ que multiplica,
              y el denominador sube a $s^{4}$.
          - valor: '3'
            mensaje: |
              $s^{3}$ correspondería a $t^{2}/2$. Repasa el despeje:
              $Y\left(1-\frac{1}{s^{2}+1}\right)=\frac{1}{s^{2}}$.
          - valor: '5'
            mensaje: |
              $s^{5}$ daría un $t^{4}$, un grado de más. La cuenta se queda en
              $s^{4}$.
        pista: |
          $1-\frac{1}{s^{2}+1}=\frac{s^{2}}{s^{2}+1}$.
        desarrollo: |
          $$
          Y=\frac{1}{s^{2}}+\frac{1}{s^{2}+1}\,Y
          \;\Longrightarrow\;
          Y\cdot\frac{s^{2}}{s^{2}+1}=\frac{1}{s^{2}}
          $$

          $$
          Y=\frac{s^{2}+1}{s^{4}}=\frac{1}{s^{2}}+\frac{1}{s^{4}}
          $$

      - tipo: calcular
        titulo: La solución en un instante
        pregunta: |
          ¿Cuánto vale $y(3)$?
        respuesta:
          tipo: numero
          valor: '7.5'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '3'
            mensaje: |
              $3$ es solo el primer término. La solución es $t+\frac{t^{3}}{6}$,
              y el cúbico aporta $\frac{27}{6}=4{,}5$ más.
          - valor: '30'
            mensaje: |
              $30$ saldría de $t+t^{3}$ sin el sexto. La tabla dice
              $\mathcal{L}^{-1}\left\{\frac{1}{s^{4}}\right\}=\frac{t^{3}}{3!}$,
              y $3!=6$.
          - valor: '4.5'
            mensaje: |
              $4{,}5$ es solo el término cúbico. Falta sumarle la $t$.
        pista: |
          $\mathcal{L}^{-1}\left\{\frac{1}{s^{n+1}}\right\}=\frac{t^{n}}{n!}$.
        desarrollo: |
          $$
          y(t)=t+\frac{t^{3}}{6}
          \;\Longrightarrow\;
          y(3)=3+\frac{27}{6}=7{,}5
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La integral es la convolución
              $\operatorname{sen}t*y$, y su transformada es el producto
              $\frac{1}{s^{2}+1}\,Y$.
          - texto: >-
              Transformando la ecuación entera:
              $Y=\frac{1}{s^{2}}+\frac{Y}{s^{2}+1}$, y despejando
              $Y=\frac{s^{2}+1}{s^{4}}$.
          - texto: >-
              Separando, $Y=\frac{1}{s^{2}}+\frac{1}{s^{4}}$, y antitransformando
              término a término sale $y(t)=t+\frac{t^{3}}{6}$.
          - texto: >-
              El factorial del último término es $3$, porque
              $\mathcal{L}^{-1}\left\{\frac{1}{s^{4}}\right\}=\frac{t^{3}}{3}$.
            trampa: true
            mensaje: |
              Es $3!=6$, no $3$. La tabla dice
              $\mathcal{L}\left\{t^{n}\right\}=\frac{n!}{s^{n+1}}$, así que al
              volver hay que **dividir** por el factorial. Es el error más
              repetido del tema, y se caza comprobando: si $y=t+\frac{t^{3}}{3}$,
              al sustituir en la ecuación original no cuadra.
    resolucion: |
      **Reconocer la convolución.** El integrando lleva
      $\operatorname{sen}\left(t-u\right)$ y $y(u)$ en factores separados, con
      la integral de $0$ a $t$. Eso **es** una convolución, aunque el enunciado
      no use la palabra:

      $$
      \int_{0}^{t}\operatorname{sen}\left(t-u\right)y(u)\,du
      =\left(\operatorname{sen}t\right)*y
      $$

      Y su transformada es el **producto**:

      $$
      \mathcal{L}\left\{\operatorname{sen}t*y\right\}
      =\frac{1}{s^{2}+1}\cdot Y(s)
      $$

      **Sin Laplace no hay por dónde entrar**: la incógnita está dentro de la
      integral, así que no se puede ni integrar por partes.

      **Transformar y despejar.**

      $$
      Y=\frac{1}{s^{2}}+\frac{Y}{s^{2}+1}
      \;\Longrightarrow\;
      Y\left(1-\frac{1}{s^{2}+1}\right)=\frac{1}{s^{2}}
      $$

      $$
      Y\cdot\frac{s^{2}}{s^{2}+1}=\frac{1}{s^{2}}
      \;\Longrightarrow\;
      Y=\frac{s^{2}+1}{s^{4}}
      $$

      **Y la vuelta, que aquí no necesita fracciones simples**: basta con
      separar el cociente.

      $$
      Y=\frac{1}{s^{2}}+\frac{1}{s^{4}}
      \;\Longrightarrow\;
      \boxed{\;y(t)=t+\frac{t^{3}}{6}\;}
      $$

      **El factorial**, que es donde se pierde el ejercicio:
      $\mathcal{L}\left\{t^{n}\right\}=\frac{n!}{s^{n+1}}$, así que
      $\frac{1}{s^{4}}$ antitransforma a $\frac{t^{3}}{3!}=\frac{t^{3}}{6}$, no
      a $t^{3}$.

      **La comprobación, y merece la pena hacerla.** Sustituyendo
      $y=t+\frac{t^{3}}{6}$ en el lado derecho de la ecuación original y
      calculando la integral numéricamente, en $t=3$ sale $7{,}5$ — exactamente
      $y(3)$ ✓. Con $\frac{t^{3}}{3}$ no cuadraría, y esa es la forma rápida de
      cazar el error del factorial sin repasar la tabla.

  - id: ex2223-ext-8-la-ampliacion-par-de-t-menos-dos-pi
    titulo: Una rampa desplazada hacia abajo, ampliada par
    fuente: >-
      Ejercicio 4 del SEGUNDO PARCIAL · Convocatoria extraordinaria, 3 de julio
      de 2023 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea la función $f(t)=t-2\pi$, $t\in\left(0,\pi\right)$.

      a) Obtener la ampliación par y periódica de la función $f(t)$.

      b) Dibujar la función ampliada.

      c) Calcular la serie de Fourier, $S(t)$, de $f(t)$.

      d) Calcular los valores de $S(t)$ y $f(t)$ en los puntos $t=0$ y
      $t=\dfrac{\pi}{2}$.

      e) Obtener la suma de la serie
      $\displaystyle\sum_{n=0}^{\infty}\frac{1}{\left(2n+1\right)^{2}}$.
    pide: Los cinco apartados.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la ampliación par de $f(t)=t-2\pi$ en $\left(-\pi,0\right)$?
        opciones:
          - texto: >-
              $F(t)=-t-2\pi$, o sea $F(t)=\left|t\right|-2\pi$ en todo el
              periodo
            correcta: true
            mensaje: |
              Eso es: la par cumple $F(-t)=F(t)$, así que se sustituye $t$ por
              $-t$ en la fórmula. Y las dos ramas juntas son
              $\left|t\right|-2\pi$: una uve con el vértice en $-2\pi$.
          - texto: $F(t)=-t+2\pi$
            mensaje: |
              Has cambiado el signo de la función entera, no el de la variable.
              Eso es la ampliación **impar** cambiada de signo, y no es ninguna
              de las dos.
          - texto: $F(t)=t+2\pi$
            mensaje: |
              Cambiar el signo del término independiente no tiene nada que ver
              con la simetría. La par sustituye $t$ por $-t$: $-t-2\pi$.

      - tipo: calcular
        titulo: El término constante
        pregunta: |
          ¿Cuánto vale $\dfrac{a_{0}}{2}$?
        respuesta:
          tipo: numero
          valor: '-4.712389'
          tolerancia: 0.0005
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '-6.2831853'
            mensaje: |
              $-2\pi$ es el valor de $F$ en el origen, o sea su **mínimo**. La
              media está más arriba, porque la rampa sube hasta $-\pi$.
          - valor: '-9.424778'
            mensaje: |
              $-3\pi$ es $a_{0}$, no $a_{0}/2$. En la serie el término
              independiente lleva la mitad.
          - valor: '-3.1415927'
            mensaje: |
              $-\pi$ es el valor **máximo** de $F$, en los extremos del periodo.
              La media queda entre $-2\pi$ y $-\pi$.
        pista: |
          Es la media de $F$ en un periodo, y por simetría basta calcularla en
          $\left(0,\pi\right)$.
        desarrollo: |
          $$
          \frac{a_{0}}{2}=\frac{1}{\pi}\int_{0}^{\pi}\left(t-2\pi\right)dt
          =\frac{1}{\pi}\left(\frac{\pi^{2}}{2}-2\pi^{2}\right)
          =-\frac{3\pi}{2}\approx-4{,}712
          $$

          Es justo la media entre $-2\pi$ y $-\pi$, que es lo que uno esperaría
          de una rampa recta.

      - tipo: calcular
        titulo: El valor en el origen
        pregunta: |
          ¿Cuánto vale $S(0)$?
        respuesta:
          tipo: numero
          valor: '-6.2831853'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '-4.712389'
            mensaje: |
              $-\frac{3\pi}{2}$ es el término constante de la serie, no su valor
              en el origen: faltan todos los cosenos, que en $t=0$ valen $1$
              cada uno.
          - valor: '0'
            mensaje: |
              Cero sería si hubiera un salto simétrico. La ampliación **par** no
              salta nunca en el origen: es continua, y $S(0)=F(0)$.
          - valor: '-3.1415927'
            mensaje: |
              $-\pi$ es el valor en los extremos $\pm\pi$, no en el origen.
        pista: |
          La ampliación par es continua en el origen, así que $S(0)=F(0)$.
        desarrollo: |
          $$
          F(0)=\left|0\right|-2\pi=-2\pi\approx-6{,}283
          $$

          Y como $F$ es continua ahí, $S(0)=F(0)=-2\pi$. Esa igualdad es la que
          después da la suma del apartado e).

      - tipo: justificar
        pregunta: Ordena el apartado e). Una pieza es falsa.
        piezas:
          - texto: >-
              Al ser $F$ par, todos los $b_{n}$ se anulan, y los cosenos salen
              $a_{n}=\frac{2}{\pi}\cdot\frac{\left(-1\right)^{n}-1}{n^{2}}$:
              cero si $n$ es par y $-\frac{4}{\pi n^{2}}$ si es impar.
          - texto: >-
              Con eso,
              $S(t)=-\frac{3\pi}{2}-\frac{4}{\pi}\sum_{n\ \text{impar}}
              \frac{\cos nt}{n^{2}}$.
          - texto: >-
              Evaluando en $t=0$, donde $F$ vale $-2\pi$ y es continua:
              $-2\pi=-\frac{3\pi}{2}-\frac{4}{\pi}\sum\frac{1}{n^{2}}$, y de ahí
              la suma vale $\frac{\pi^{2}}{8}$.
          - texto: >-
              El $-2\pi$ del enunciado desplaza la función hacia abajo, así que
              también cambia los coeficientes $a_{n}$.
            trampa: true
            mensaje: |
              Solo cambia $a_{0}$. Los $a_{n}$ con $n\ge1$ son integrales de
              $f(t)\cos nt$, y la parte constante aporta
              $-2\pi\int_{0}^{\pi}\cos nt\,dt=0$: desaparece. Trasladar una
              función arriba o abajo mueve su valor medio y nada más, que es
              exactamente lo que hace el término independiente de la serie.
    resolucion: |
      **a) y b) La ampliación.** La par cumple $F(-t)=F(t)$, así que en
      $\left(-\pi,0\right)$ hay que poner $-t-2\pi$:

      $$
      F(t)=\left|t\right|-2\pi\quad\text{en }\left(-\pi,\pi\right),
      \qquad\text{periódica de periodo }2\pi
      $$

      Una **uve** con el vértice en $\left(0,-2\pi\right)$ y los extremos en
      $-\pi$.

