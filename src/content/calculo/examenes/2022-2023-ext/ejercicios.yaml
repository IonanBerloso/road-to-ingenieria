          <text x="267.9" y="230" text-anchor="middle">√3</text>
          <text x="112.1" y="230" text-anchor="middle">−√3</text>
          <text x="183" y="174" text-anchor="end">1</text>
          <text x="183" y="39" text-anchor="end">4</text>
          <text x="311" y="219">x</text>
        </g>
        <text class="cha23-lb" x="75.3" y="62" fill="var(--live)">y = 4 − x²</text>
        <text class="cha23-lb" x="190" y="125" text-anchor="middle" fill="var(--alt)">2 × 2</text>
      </svg>
      <figcaption>
      La chapa es el trozo de parábola por encima de la altura uno, entre menos
      raíz de tres y raíz de tres. Dentro, el rectángulo de área máxima resulta
      ser un cuadrado de lado dos.
      </figcaption>
      </figure>

      **b) El área.**

      $$
      A=\int_{-\sqrt3}^{\sqrt3}\left[\left(4-x^{2}\right)-1\right]dx
      =\int_{-\sqrt3}^{\sqrt3}\left(3-x^{2}\right)dx
      =\boxed{\;4\sqrt3\approx6{,}93\;}
      $$

      **c) El rectángulo.** Por simetría el óptimo está centrado en el eje $Y$
      —decirlo ahorra una variable y es lo primero que hay que escribir—. Con la
      esquina superior derecha en $\left(x,4-x^{2}\right)$:

      $$
      \text{base}=2x,\qquad
      \text{altura}=\left(4-x^{2}\right)-1=3-x^{2}
      $$

      $$
      A(x)=2x\left(3-x^{2}\right)=6x-2x^{3},
      \qquad x\in\left[0,\sqrt3\right]
      $$

      $$
      A'(x)=6-6x^{2}=0\;\Longrightarrow\;x=1
      $$

      y es máximo porque $A''=-12x<0$ en todo el intervalo.

      $$
      \boxed{\;\text{base }2,\quad\text{altura }2,\quad\text{área }4\;}
      $$

      **Un cuadrado**, y conviene no sacar de ahí la conclusión equivocada: no
      sale cuadrado porque el cuadrado sea óptimo en general, sino porque estos
      números concretos lo dan. Lo que sí se puede afirmar es que el rectángulo
      se lleva el $58\,\%$ del área de la chapa —$4$ de $6{,}93$—, y que los dos
      extremos del intervalo dan área cero: un rectángulo de base nula o de
      altura nula no es rectángulo.

  - id: ex2223-ext-5-el-cilindro-con-fondo-de-paraboloide
    titulo: Un cilindro con el fondo abollado, y una densidad que no es constante
    fuente: >-
      Ejercicio 1 del SEGUNDO PARCIAL · Convocatoria extraordinaria, 3 de julio
      de 2023 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea $S$ el sólido limitado por las condiciones $x^{2}+y^{2}\le1$,
      $z\ge1-x^{2}-y^{2}$, $z\le4$.

      a) Dibujar el sólido $S$ y calcular su volumen.

      b) Sabiendo que la densidad en cada punto es proporcional a la distancia
      de dicho punto al eje OZ plantear el cálculo de las coordenadas del centro
      de masa de $S$. Plantear las integrales (funciones y límites) sin hacer el
      cálculo.
    pide: El dibujo, el volumen y las integrales del centro de masa, planteadas.

    pasos:
      - tipo: reconocer
        pregunta: |
          «Densidad proporcional a la distancia al eje OZ». ¿Cómo se escribe eso
          en cilíndricas?
        opciones:
          - texto: >-
              $\delta=k\rho$, donde $\rho$ es la coordenada radial
            correcta: true
            mensaje: |
              Eso es, y es la razón de que las cilíndricas sean obligatorias
              aquí: en cartesianas la densidad sería
              $k\sqrt{x^{2}+y^{2}}$, con una raíz dentro de la integral.
          - texto: $\delta=kz$
            mensaje: |
              $z$ es la distancia al plano $XY$, no al eje $OZ$. La distancia a
              un **eje** se mide perpendicularmente a él.
          - texto: $\delta=k\sqrt{x^{2}+y^{2}+z^{2}}$
            mensaje: |
              Esa es la distancia al **origen**, que es un punto. La distancia al
              eje $OZ$ no depende de la altura.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen de $S$?
        respuesta:
          tipo: numero
          valor: '10.9955743'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '12.5663706'
            mensaje: |
              $4\pi$ es el volumen del cilindro entero de radio $1$ y altura
              $4$. Hay que quitarle lo que el paraboloide se lleva por abajo.
          - valor: '9.4247780'
            mensaje: |
              $3\pi$ saldría con un fondo plano en $z=1$. El fondo es curvo, y
              baja hasta $z=0$ en el centro.
          - valor: '1.5707963'
            mensaje: |
              $\frac{\pi}{2}$ es justo el trozo que el paraboloide **quita**, no
              el volumen del sólido.
        pista: |
          Altura de cada columna: de $z=1-\rho^{2}$ hasta $z=4$, o sea
          $3+\rho^{2}$.
        desarrollo: |
          $$
          V=\int_{0}^{2\pi}\!\!\int_{0}^{1}\left(3+\rho^{2}\right)\rho\,d\rho\,
          d\theta
          =2\pi\left[\frac{3\rho^{2}}{2}+\frac{\rho^{4}}{4}\right]_{0}^{1}
          =2\pi\cdot\frac74=\frac{7\pi}{2}\approx10{,}996
          $$

      - tipo: calcular
        titulo: La masa
        pregunta: |
          Con $\delta=k\rho$, ¿cuánto vale $M/k$?
        respuesta:
          tipo: numero
          valor: '7.5398224'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '10.9955743'
            mensaje: |
              Ese es el **volumen**. La masa lleva la densidad dentro de la
              integral, y como $\delta=k\rho$ el integrando pasa de $\rho$ a
              $\rho^{2}$.
          - valor: '6.2831853'
            mensaje: |
              $2\pi$ saldría de $\int_{0}^{1}\rho^{2}\cdot3\,d\rho$ sin el
              término $\rho^{4}$ que aporta el fondo curvo.
          - valor: '4.1887902'
            mensaje: |
              $\frac{4\pi}{3}$ no corresponde a esta integral. Repasa:
              $2\pi\int_{0}^{1}\rho^{2}\left(3+\rho^{2}\right)d\rho$.
        pista: |
          $M=k\displaystyle\int_{0}^{2\pi}\!\!\int_{0}^{1}\rho\cdot\rho
          \left(3+\rho^{2}\right)d\rho\,d\theta$: un $\rho$ de la densidad y
          otro del jacobiano.
        desarrollo: |
          $$
          \frac{M}{k}=2\pi\int_{0}^{1}\rho^{2}\left(3+\rho^{2}\right)d\rho
          =2\pi\left[\rho^{3}+\frac{\rho^{5}}{5}\right]_{0}^{1}
          =2\pi\cdot\frac65=\frac{12\pi}{5}\approx7{,}540
          $$

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              Por simetría de revolución —el sólido y la densidad solo dependen
              de $\rho$ y de $z$—, $\overline x=\overline y=0$ sin integrar nada.
          - texto: >-
              La masa es
              $M=k\int_{0}^{2\pi}\!\int_{0}^{1}\!\int_{1-\rho^{2}}^{4}
              \rho\cdot\rho\,dz\,d\rho\,d\theta$: un $\rho$ de la densidad y
              otro del jacobiano.
          - texto: >-
              Y el momento es
              $\int z\,\delta\,dV
              =k\int_{0}^{2\pi}\!\int_{0}^{1}\!\int_{1-\rho^{2}}^{4}
              z\,\rho^{2}\,dz\,d\rho\,d\theta$, con lo que
              $\overline z=\frac{\int z\,\delta\,dV}{M}$.
          - texto: >-
              Como la densidad no es constante, el centro de masa ya no puede
              estar sobre el eje: la simetría se rompe.
            trampa: true
            mensaje: |
              La densidad $k\rho$ es **también** de revolución: no depende del
              ángulo, así que no rompe la simetría. Lo que sí cambia respecto a
              la densidad constante es la **altura** del centro de masa, porque
              la materia pesa más lejos del eje, que es donde el sólido es más
              alto. El centro de masa sigue en el eje.
    resolucion: |
      **a) El sólido.** Un cilindro de radio $1$ cortado por arriba en $z=4$ y
      por abajo por el paraboloide invertido $z=1-\rho^{2}$, que en el centro
      llega a $z=1$ y en el borde a $z=0$. Un vaso con el fondo abombado hacia
      dentro.

      <figure class="figura-examen">
      <svg viewBox="0 0 350 250" role="img" width="350" height="250"
           aria-labelledby="vas23-t vas23-d">
        <title id="vas23-t">La seccion del vaso con el fondo abombado</title>
        <desc id="vas23-d">Vista de perfil por un plano que contiene el eje. Las
        paredes son verticales en el radio uno, la tapa es plana a la altura cuatro y
