ejercicios:
  - id: ex2223-ext-1-un-seno-complejo-y-una-elipse
    titulo: El seno de un complejo, y una suma de distancias que es una elipse
    fuente: >-
      Ejercicio 1 del PRIMER PARCIAL · Convocatoria extraordinaria, 3 de julio de
      2023 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      a) Escribir en forma binómica $\operatorname{sen}\left(\pi+i\ln 2\right)$.

      b) Calcular y representar geométricamente los afijos de los números
      complejos $z$ que verifican la condición
      $\left|z-\left(1+i\right)\right|+\left|z-\left(1-i\right)\right|=4$.
    pide: El seno en binómica y el lugar geométrico, dibujado.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dice geométricamente la condición del apartado b)?
        opciones:
          - texto: >-
              Que la suma de las distancias de $z$ a dos puntos fijos es
              constante: una **elipse** con esos dos puntos por focos
            correcta: true
            mensaje: |
              Eso es, y es la definición misma de elipse. Los focos son
              $\left(1,1\right)$ y $\left(1,-1\right)$, y la constante $4$ es el
              eje mayor: $2a=4$.
          - texto: >-
              Que $z$ está a distancia $4$ de los dos puntos
            mensaje: |
              Eso serían dos ecuaciones distintas —y en general no tendrían
              solución común—. Aquí lo que vale $4$ es la **suma** de las dos
              distancias.
          - texto: >-
              Que la diferencia de distancias es constante: una hipérbola
            mensaje: |
              La diferencia da hipérbola, sí, pero aquí hay un signo más entre
              los dos módulos. Suma es elipse; resta es hipérbola.

      - tipo: calcular
        titulo: La parte imaginaria del seno
        pregunta: |
          ¿Cuál es la parte imaginaria de
          $\operatorname{sen}\left(\pi+i\ln 2\right)$?
        respuesta:
          tipo: numero
          valor: '-0.75'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.75'
            mensaje: |
              Signo. La fórmula es
              $\operatorname{sen}\left(a+bi\right)=\operatorname{sen}a\cosh b
              +i\cos a\operatorname{senh}b$, y $\cos\pi=-1$.
          - valor: '1.25'
            mensaje: |
              $\frac54$ es $\cosh\left(\ln2\right)$, que acompaña a la parte
              **real** — y esa se anula, porque $\operatorname{sen}\pi=0$.
          - valor: '0'
            mensaje: |
              Cero es la parte **real**. La imaginaria no se anula: vale
              $\cos\pi\operatorname{senh}\left(\ln2\right)$.
        pista: |
          $\operatorname{senh}\left(\ln 2\right)=\frac{2-\frac12}{2}=\frac34$.
        desarrollo: |
          $$
          \operatorname{sen}\left(a+bi\right)
          =\operatorname{sen}a\cosh b+i\cos a\operatorname{senh}b
          $$

          Con $a=\pi$ y $b=\ln 2$: $\operatorname{sen}\pi=0$, $\cos\pi=-1$,

          $$
          \cosh\left(\ln 2\right)=\frac{2+\frac12}{2}=\frac54,
          \qquad
          \operatorname{senh}\left(\ln 2\right)=\frac{2-\frac12}{2}=\frac34
          $$

          $$
          \operatorname{sen}\left(\pi+i\ln 2\right)=-\frac34\,i
          $$

      - tipo: calcular
        titulo: El semieje menor
        pregunta: |
          En la elipse del apartado b), ¿cuánto vale $b^{2}$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              $4$ es $a^{2}$, el semieje **mayor** al cuadrado. El menor sale de
              $b^{2}=a^{2}-c^{2}$.
          - valor: '1'
            mensaje: |
              $1$ es $c^{2}$: la semidistancia focal. Los focos están a distancia
              $2$ entre sí, así que $c=1$.
          - valor: '5'
            mensaje: |
              $5$ saldría de **sumar** $a^{2}$ y $c^{2}$. En una elipse se
              restan; en una hipérbola es al revés.
        pista: |
          $2a=4$ y la distancia entre los focos es $2$, o sea $2c=2$.
        desarrollo: |
          $$
          a=2,\qquad c=1
          \;\Longrightarrow\;
          b^{2}=a^{2}-c^{2}=4-1=3
          $$

          Los focos están alineados en vertical —los dos con $x=1$—, así que el
          eje mayor es el vertical:

          $$
          \frac{\left(x-1\right)^{2}}{3}+\frac{y^{2}}{4}=1
          $$

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              Los dos puntos son $\left(1,1\right)$ y $\left(1,-1\right)$, y la
              suma constante de distancias vale $4$: es la definición de
              **elipse** con esos focos.
          - texto: >-
              El centro es el punto medio de los focos, $\left(1,0\right)$; la
              constante es el eje mayor, $2a=4$; y la separación de los focos es
              $2c=2$.
          - texto: >-
              De $b^{2}=a^{2}-c^{2}=3$ y con el eje mayor **vertical** sale
              $\frac{\left(x-1\right)^{2}}{3}+\frac{y^{2}}{4}=1$.
          - texto: >-
              Como los denominadores son $3$ y $4$ y el mayor va con la $y$, el
              eje mayor es el horizontal.
            trampa: true
            mensaje: |
              El denominador mayor marca el eje **mayor**, y aquí acompaña a la
              $y$: el eje mayor es el **vertical**, que además es donde están
              los focos. Que los focos estén sobre el eje mayor es la
              comprobación que evita este error: si te sale al revés, algo has
              intercambiado.
    resolucion: |
      **a) El seno de un complejo.** La fórmula sale del seno de una suma con
      argumento imaginario:

      $$
      \operatorname{sen}\left(a+bi\right)
      =\operatorname{sen}a\cos\left(bi\right)+\cos a\operatorname{sen}\left(bi\right)
      =\operatorname{sen}a\cosh b+i\cos a\operatorname{senh}b
      $$

      Con $a=\pi$, $b=\ln2$, y usando que
      $\cosh x=\frac{e^{x}+e^{-x}}{2}$ y
      $\operatorname{senh}x=\frac{e^{x}-e^{-x}}{2}$:

      $$
      \cosh\left(\ln2\right)=\frac{2+\frac12}{2}=\frac54,
      \qquad
      \operatorname{senh}\left(\ln2\right)=\frac{2-\frac12}{2}=\frac34
      $$

      Y como $\operatorname{sen}\pi=0$ y $\cos\pi=-1$:

      $$
      \boxed{\;\operatorname{sen}\left(\pi+i\ln 2\right)=-\frac34\,i\;}
      $$

      **Un imaginario puro**, y no por casualidad: el seno de un real más un
      imaginario tiene parte real proporcional a $\operatorname{sen}a$, que aquí
      se anula.

      **b) La elipse.** La condición dice que la suma de las distancias de $z$ a
      $1+i$ y a $1-i$ vale siempre $4$. Eso **es** la definición de elipse:

      | dato | valor |
      |---|---|
      | focos | $\left(1,1\right)$ y $\left(1,-1\right)$ |
      | centro | $\left(1,0\right)$, el punto medio |
      | $2a$ | $4$, la constante del enunciado |
      | $2c$ | $2$, la distancia entre focos |
      | $b^{2}$ | $a^{2}-c^{2}=3$ |

      Los focos están en vertical, así que el eje mayor es el vertical:

      $$
      \boxed{\;\frac{\left(x-1\right)^{2}}{3}+\frac{y^{2}}{4}=1\;}
      $$

