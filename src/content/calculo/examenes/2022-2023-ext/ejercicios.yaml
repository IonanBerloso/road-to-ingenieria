  - id: ex2223-ext-2-de-la-velocidad-a-la-posicion
    titulo: De la velocidad a la posición, sin integrar hasta el final
    fuente: >-
      Ejercicio 2 del PRIMER PARCIAL · Convocatoria extraordinaria, 3 de julio de
      2023 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3
    enunciado: |
      La velocidad de un objeto que se desplaza en línea recta viene dada por la
      función $v(t)=\left(1-t\right)\left(t-3\right)$ cm/s para $t\ge0$. Si la
      función $x(t)$ describe la posición del objeto en cada instante $t$:

      a) Analizar el crecimiento/decrecimiento y los extremos de la función
      $x(t)$.

      b) Analizar la concavidad/convexidad y los puntos de inflexión de la
      función $x(t)$.

      c) Si la posición del objeto en $t=0$ es $x(0)=2$ cm, hacer un esbozo del
      gráfico de la función $x(t)$ en el intervalo $\left[0,5\right]$.
    pide: El estudio completo de x y su esbozo.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué relación hay entre $v$ y $x$, y qué permite hacer?
        opciones:
          - texto: >-
              $v=x'$, así que el enunciado **ya da la derivada** y los apartados
              a) y b) se contestan sin integrar
            correcta: true
            mensaje: |
              Eso es, y es la gracia del ejercicio. Para el crecimiento hace
              falta el signo de $x'$, que es $v$; y para la concavidad el de
              $x''$, que es $v'$. Solo el apartado c) —el dibujo— necesita
              integrar.
          - texto: >-
              $v=x''$, porque la velocidad es la segunda derivada
            mensaje: |
              La **aceleración** es la segunda derivada. La velocidad es la
              primera.
          - texto: >-
              Hay que integrar $v$ antes de poder decir nada de $x$
            mensaje: |
              Se puede, pero es el camino largo. Los dos primeros apartados solo
              piden signos, y los signos de $x'$ y $x''$ están ya en $v$ y en
              $v'$.

      - tipo: calcular
        titulo: El máximo
        pregunta: |
          ¿En qué instante alcanza $x$ su máximo?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              En $t=1$ hay un **mínimo**: antes $v<0$ —el objeto retrocede— y
              después $v>0$. El máximo es el otro cero de $v$.
          - valor: '2'
            mensaje: |
              En $t=2$ está el punto de inflexión, que es donde la velocidad es
              máxima, no la posición.
          - valor: '5'
            mensaje: |
              En $t=5$ el objeto lleva ya dos segundos retrocediendo. Es el
              mínimo del intervalo, no el máximo.
        pista: |
          $v$ cambia de $+$ a $-$ en uno de sus dos ceros.
        desarrollo: |
          $v=\left(1-t\right)\left(t-3\right)$ se anula en $t=1$ y $t=3$, y su
          signo es

          | tramo | $\left(1-t\right)$ | $\left(t-3\right)$ | $v=x'$ | $x$ |
          |---|---|---|---|---|
          | $\left(0,1\right)$ | $+$ | $-$ | $-$ | decrece |
          | $\left(1,3\right)$ | $-$ | $-$ | $+$ | crece |
          | $\left(3,\infty\right)$ | $-$ | $+$ | $-$ | decrece |

          Mínimo en $t=1$ y **máximo en $t=3$**.

      - tipo: calcular
        titulo: La posición en el máximo
        pregunta: |
          ¿Cuánto vale $x(3)$, en centímetros?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0.6666667'
            mensaje: |
              $\frac23$ es $x(1)$, el mínimo. El objeto retrocede hasta ahí y
              luego vuelve.
          - valor: '1.3333333'
            mensaje: |
              $\frac43$ es $x(2)$, el punto de inflexión.
          - valor: '4'
            mensaje: |
              $4$ no sale de ningún sitio. Integrando,
              $x(t)=-\frac{t^{3}}{3}+2t^{2}-3t+2$, y en $t=3$ eso vale $2$.
        pista: |
          $x(t)=-\frac{t^{3}}{3}+2t^{2}-3t+2$, con la constante fijada por
          $x(0)=2$.
        desarrollo: |
          $$
          x(t)=\int\left(-t^{2}+4t-3\right)dt=-\frac{t^{3}}{3}+2t^{2}-3t+C
          $$

          Con $x(0)=2$ sale $C=2$, y

          $$
          x(3)=-9+18-9+2=2
          $$

          **La misma posición que en el instante inicial**: el objeto vuelve al
          punto de partida justo cuando alcanza su máximo.

      - tipo: justificar
        pregunta: Ordena el estudio. Una pieza es falsa.
        piezas:
          - texto: >-
              Como $v=x'$, el crecimiento de $x$ lo da el signo de $v$: decrece
              hasta $t=1$, crece hasta $t=3$ y vuelve a decrecer. Mínimo en $1$ y
              máximo en $3$.
          - texto: >-
              La concavidad la da $x''=v'=4-2t$: convexa hasta $t=2$ y cóncava
              después, con **inflexión en $t=2$**, que es donde la velocidad es
              máxima.
          - texto: >-
              Integrando y usando $x(0)=2$ sale
              $x(t)=-\frac{t^{3}}{3}+2t^{2}-3t+2$, con
              $x(1)=\frac23$, $x(2)=\frac43$, $x(3)=2$ y $x(5)=-\frac{14}{3}$.
          - texto: >-
              Como $v(0)=-3$ y el objeto empieza retrocediendo, $x$ es negativa
              desde el principio.
            trampa: true
            mensaje: |
              Retroceder no es estar en posición negativa. El objeto **parte** de
              $x=2$ y retrocede hasta $x=\frac23$, que sigue siendo positiva. La
              posición no se hace negativa hasta pasado $t=4$ aproximadamente.
              Confundir el signo de la velocidad con el de la posición es el
              error que este enunciado busca al dar $v$ y preguntar por $x$.
    resolucion: |
      **La idea, y es la que ahorra medio ejercicio.** El enunciado da la
      **derivada** de lo que se estudia: $v=x'$. Así que

      $$
      \text{crecimiento de }x\;\longleftrightarrow\;\text{signo de }v,
      \qquad
      \text{concavidad de }x\;\longleftrightarrow\;\text{signo de }v'
      $$

      y los apartados a) y b) se contestan **sin integrar**.

      **a) Crecimiento.** $v=\left(1-t\right)\left(t-3\right)$ se anula en $1$ y
      en $3$:

      | tramo | $v=x'$ | $x$ |
      |---|---|---|
      | $\left(0,1\right)$ | $-$ | decrece |
      | $\left(1,3\right)$ | $+$ | crece |
      | $\left(3,5\right)$ | $-$ | decrece |

      **Mínimo relativo en $t=1$ y máximo relativo en $t=3$.**

      **b) Concavidad.**

      $$
      x''=v'=\frac{d}{dt}\left(-t^{2}+4t-3\right)=4-2t
      $$

      Positiva hasta $t=2$ —convexa— y negativa después —cóncava—. **Punto de
      inflexión en $t=2$**, que es además donde la velocidad alcanza su máximo:
      el instante en que el objeto va más rápido hacia adelante.

      **c) El esbozo.** Ahora sí hace falta integrar:

      $$
      x(t)=\int\left(-t^{2}+4t-3\right)dt=-\frac{t^{3}}{3}+2t^{2}-3t+C
      $$

      y $x(0)=2$ da $C=2$. Los valores que ordenan el dibujo:

      | $t$ | $0$ | $1$ | $2$ | $3$ | $5$ |
      |---|---|---|---|---|---|
      | $x$ | $2$ | $\frac23$ | $\frac43$ | $2$ | $-\frac{14}{3}$ |

      <figure class="figura-examen">
      <svg viewBox="0 0 400 250" role="img" width="400" height="250"
           aria-labelledby="pos23-t pos23-d">
        <title id="pos23-t">La posicion del objeto entre los instantes cero y cinco</title>
