        <g font-size="13" font-family="var(--mono)">
          <text x="360" y="200" fill="var(--d1)">f</text>
          <text x="330" y="120" fill="var(--flag)">f'</text>
          <text x="250" y="80" fill="var(--graphite)">f''</text>
          <text x="770" y="80" fill="var(--d1)">g</text>
          <text x="700" y="128" fill="var(--flag)">g'</text>
