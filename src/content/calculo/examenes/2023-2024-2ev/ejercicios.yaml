      </svg>
      <figcaption>
      Figura redibujada del enunciado original y medida por color sobre el PDF.
      Los valores que decide el ejercicio son exactos: en x igual a cero,
      f vale 1, su derivada 2 y la segunda 4; en x igual a uno, g vale 0, su
      derivada 2 y la segunda 0.
      </figcaption>
      </figure>

      **a)** Calcular el polinomio de Taylor de orden 2 de la función
      $u(x) = f(g(x))$ en el punto $x=1$.

      **b)** Utilizando el polinomio obtenido en el apartado aproximar el valor
      de $u\left(\dfrac{3}{2}\right)$.

      **c)** Estudiar el crecimiento y la concavidad de la función $u(x)$ en el
      punto $x=0$.
    pide: Calcular el polinomio, aproximar y estudiar $u$ en $x=0$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué seis números hacen falta para el apartado (a)?
        opciones:
          - texto: >-
              $g(1)$, $g'(1)$, $g''(1)$, y $f$, $f'$, $f''$ evaluadas **en
              $g(1)$**
            correcta: true
            mensaje: |
              Exacto, y el detalle está en dónde se evalúa $f$: **no** en 1,
              sino en $g(1)$. Aquí $g(1)=0$, así que hay que leer el panel
              izquierdo en $x=0$ — que es precisamente donde los tres valores
              caen sobre líneas de la rejilla.
          - texto: >-
              Las seis funciones evaluadas en $x=1$
            mensaje: |
              $f$ no se evalúa en 1: se evalúa en $g(1)$. Confundirlo es el
              error más caro del ejercicio, porque cambia los tres valores.
          - texto: >-
              Solo $f(1)$, $f'(1)$ y $f''(1)$
            mensaje: |
              Falta la parte de dentro. La cadena necesita también $g'$ y $g''$.
          - texto: >-
              Las expresiones analíticas de $f$ y $g$
            mensaje: |
              No se dan y no hacen falta: seis lecturas en el dibujo bastan.

      - tipo: calcular
        titulo: El coeficiente lineal
        pregunta: |
          ¿Cuánto vale $u'(1)$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.15
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es $f'(0)$ o $g'(1)$ por separado. La cadena los **multiplica**:
              $2\cdot2 = 4$.
          - valor: '1'
            mensaje: |
              1 es $f(0)$, el valor de la función, no de la derivada.
          - valor: '16'
            mensaje: |
              16 es $u''(1)$, el coeficiente de segundo orden antes de dividir
              entre 2.
        pista: |
          $u'(x) = f'\big(g(x)\big)\cdot g'(x)$, y $g(1)=0$.
        desarrollo: |
          $$
          u'(x) = f'\big(g(x)\big)\cdot g'(x)
          $$

          Del panel derecho: $g(1) = 0$ y $g'(1) = 2$ —es el máximo de $g'$—.

          Del panel izquierdo, en $x=0$: $f'(0) = 2$.

          $$
          u'(1) = f'(0)\cdot g'(1) = 2\cdot2 = 4
          $$
        veredicto: |
          Todo el ejercicio depende de que $g(1)=0$: es lo que traslada la
          lectura de $f$ al punto $x=0$, donde los valores son exactos.

      - tipo: calcular
        titulo: La aproximación
        pregunta: |
          ¿Cuánto vale $u\left(\frac32\right)$ según el polinomio?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.2
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              3 sale de quedarse en el término lineal: $1+4(0{,}5)$. Falta el
              cuadrático, que aporta otros 2.
          - valor: '1'
            mensaje: |
              1 es $u(1)$, el valor en el centro del desarrollo. Hay que
              evaluar en $\frac32$.
          - valor: '9'
            mensaje: |
              9 saldría de usar $16$ en vez de $8$ como coeficiente cuadrático:
              falta dividir $u''$ entre $2!$.
        pista: |
          $P_2(x) = 1+4(x-1)+8(x-1)^{2}$, y $x-1 = \frac12$.
        desarrollo: |
          Con $u''(1) = f''(0)\left[g'(1)\right]^{2}+f'(0)\,g''(1)$:

          $$
          u''(1) = 4\cdot2^{2}+2\cdot0 = 16
          $$

          $$
          P_2(x) = 1+4(x-1)+\frac{16}{2}(x-1)^{2}
          = 1+4(x-1)+8(x-1)^{2}
          $$

          En $x = \frac32$, con $x-1 = \frac12$:

          $$
          P_2\!\left(\tfrac32\right) = 1+4\cdot\tfrac12+8\cdot\tfrac14
          = 1+2+2 = 5
          $$
        veredicto: |
          El término $f'(0)\,g''(1)$ desaparece porque $g''(1)=0$: la segunda
          derivada de $g$ corta el eje justo en $x=1$. Otro valor elegido para
          que la cuenta sea limpia.

      - tipo: justificar
        pregunta: |
          Ordena el apartado (c). Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Las fórmulas:** $u'(0) = f'\big(g(0)\big)g'(0)$ y
              $u''(0) = f''\big(g(0)\big)\left[g'(0)\right]^{2}
              +f'\big(g(0)\big)g''(0)$.
          - texto: |
              **El problema:** $g(0) \approx -1{,}7$, y el panel de $f$ solo
              llega hasta $x=-1$. **No se pueden leer** $f'\big(g(0)\big)$ ni
              $f''\big(g(0)\big)$.
          - texto: |
              **Pero no hacen falta los valores, solo los signos.** En todo el
              tramo dibujado, $f$, $f'$ y $f''$ son **positivas** y crecientes:
              es una exponencial.
          - texto: |
              Del panel derecho: $g'(0) = 1 > 0$ y $g''(0) > 0$ —la curva gris
              está por encima del eje en $x=0$—.
          - texto: |
              Luego $u'(0) = (+)(+) > 0$ y
              $u''(0) = (+)(+)+(+)(+) > 0$: $u$ es **creciente y convexa** en
              $x=0$.
          - texto: |
              Como $g(0)$ queda fuera del dominio dibujado, el apartado (c) no
              se puede resolver con los datos del enunciado.
            trampa: true
            mensaje: |
              Sí se puede: el apartado pide «estudiar el crecimiento y la
              concavidad», no calcular valores. Y para eso bastan los **signos**,
              que se leen sin salir del dibujo. Confundir «no puedo calcular el
              número» con «no puedo responder» deja diez puntos en blanco.
        veredicto: |
          El apartado (c) es cualitativo a propósito. Que $g(0)$ caiga fuera del
          tramo dibujado de $f$ no es un descuido del examen: es lo que obliga a
          razonar con signos.

    resolucion: |
      **Datos.** Las gráficas de $f$, $f'$, $f''$ y de $g$, $g'$, $g''$.

      > **Nota sobre la figura.** Redibujada y **medida por color sobre el
      > PDF**, separando las tres curvas de cada panel por su tono: azul la
      > función, rojo la primera derivada, gris la segunda. Los seis valores que
      > decide el ejercicio salieron exactos.

      ### 1 · Las seis lecturas

      El polinomio de Taylor de $u = f\circ g$ en $x=1$ necesita $u(1)$,
      $u'(1)$ y $u''(1)$, y las tres se montan con la regla de la cadena:

      $$
      u'(x) = f'\big(g(x)\big)\,g'(x)
      $$

      $$
      u''(x) = f''\big(g(x)\big)\left[g'(x)\right]^{2}
      + f'\big(g(x)\big)\,g''(x)
      $$

      **Lo esencial: $f$ no se evalúa en 1, sino en $g(1)$.** Del panel derecho:

      $$
      g(1) = 0, \qquad g'(1) = 2, \qquad g''(1) = 0
      $$

      —la curva azul corta el eje en $x=1$, la roja alcanza ahí su máximo, y la
      gris corta el eje en el mismo sitio—.

      Y como $g(1)=0$, hay que leer el panel izquierdo **en $x=0$**:

      $$
      f(0) = 1, \qquad f'(0) = 2, \qquad f''(0) = 4
      $$

      Los tres caen exactamente sobre líneas de la rejilla. (De hecho la función
      dibujada es $f(x) = e^{2x}$, aunque el ejercicio no lo necesita.)

      ### 2 · Apartado (a): el polinomio

      $$
      u(1) = f\big(g(1)\big) = f(0) = 1
      $$

      $$
      u'(1) = f'(0)\cdot g'(1) = 2\cdot2 = 4
      $$

      $$
      u''(1) = f''(0)\left[g'(1)\right]^{2}+f'(0)\,g''(1)
      = 4\cdot4+2\cdot0 = 16
      $$

      $$
      \boxed{P_2(x) = 1+4(x-1)+8(x-1)^{2}}
      $$

      El segundo sumando de $u''$ se anula porque $g''(1)=0$.

      ### 3 · Apartado (b): la aproximación

      $$
      P_2\!\left(\tfrac32\right)
      = 1+4\left(\tfrac12\right)+8\left(\tfrac12\right)^{2}
      = 1+2+2
      $$

      $$
      \boxed{u\!\left(\tfrac32\right) \approx 5}
      $$

      ### 4 · Apartado (c): $u$ en $x=0$

      Aquí aparece una dificultad que hay que **nombrar** en vez de esquivar:

      $$
      g(0) \approx -1{,}7
      $$

      y el panel de $f$ solo llega hasta $x=-1$. **No se pueden leer los valores
      de $f'$ y $f''$ ahí.**

      Pero el apartado no pide valores: pide **crecimiento y concavidad**, y
      para eso bastan los signos.

      **De la gráfica de $f$:** las tres curvas —$f$, $f'$ y $f''$— están
      **por encima del eje** en todo el tramo dibujado, y crecen. No hay ningún
      indicio de que cambien de signo, y de hecho no lo hacen: es una
      exponencial.

      $$
      f' > 0, \qquad f'' > 0
      $$

      **De la gráfica de $g$ en $x=0$:**

      $$
      g'(0) = 1 > 0, \qquad g''(0) > 0
      $$

      —la roja pasa por 1 y la gris está claramente por encima del eje—.

      **Componiendo:**

      $$
      u'(0) = \underbrace{f'\big(g(0)\big)}_{+}\cdot\underbrace{g'(0)}_{+} > 0
      $$

      $$
      u''(0) = \underbrace{f''\big(g(0)\big)}_{+}
      \underbrace{\left[g'(0)\right]^{2}}_{+}
      + \underbrace{f'\big(g(0)\big)}_{+}\underbrace{g''(0)}_{+} > 0
      $$

      $$
      \boxed{u \text{ es creciente y convexa en } x=0}
      $$

      **Los dos efectos se refuerzan**, así que la conclusión no depende de los
      valores concretos. Por eso el apartado se puede responder aunque $g(0)$
      caiga fuera del dibujo.

      ### 5 · Comprobación

      **Con la función real.** El panel izquierdo es $f(x)=e^{2x}$: en efecto
      $f(0)=1$, $f'(0)=2$ y $f''(0)=4$ ✔ Y $f'>0$, $f''>0$ en todo
      $\mathbb{R}$, lo que confirma la extrapolación del apartado (c).

      **Del polinomio en su centro.** $P_2(1) = 1 = u(1)$ ✔

      **Del signo del coeficiente cuadrático.** Es $+8$, luego $u$ es convexa
      cerca de $x=1$. Coherente: allí $u'' = 16 > 0$ ✔

      **Del orden de magnitud de (b).** Con $u(x) = e^{2g(x)}$ y
      $g(1{,}5) \approx 0{,}88$ leído en el panel derecho:

      $$
      u(1{,}5) \approx e^{1{,}76} \approx 5{,}8
      $$

      frente a los 5 del polinomio. La diferencia es la esperable a media unidad
      del centro con un desarrollo de orden 2 ✔

  - id: ex2324-2ev-4-alambre-cuadrado-y-triangulo
    titulo: Diez metros de alambre entre un cuadrado y un triángulo
    fuente: >-
      Ejercicio 4 · Segunda evaluación, 27 de noviembre de 2023 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    enunciado: |
      Un alambre de 10 m de longitud se corta en dos partes. Con una de ellas se
      forma un cuadrado y con la otra un triángulo equilátero. ¿Cómo debe
      cortarse el alambre para que la suma de las áreas de las dos figuras sea
      mínima?
    pide: Calcular dónde hay que cortar el alambre.

    pasos:
      - tipo: reconocer
        pregunta: |
          Llamando $x$ a la parte del cuadrado, ¿cuál es su área?
        opciones:
          - texto: >-
              $\dfrac{x^{2}}{16}$, porque el **lado** es $\dfrac{x}{4}$
            correcta: true
            mensaje: |
              Eso es. $x$ es el **perímetro**, no el lado: hay que dividir entre
              4 antes de elevar al cuadrado. Es el descuido más común del
              ejercicio y arrastra todo el resultado.
          - texto: $x^{2}$
            mensaje: |
              Eso sería si $x$ fuera el lado. Pero $x$ es el trozo de alambre,
              es decir el perímetro: el lado es $\frac x4$.
          - texto: $\dfrac{x^{2}}{4}$
            mensaje: |
              Has dividido una vez entre 4 en lugar de elevar al cuadrado el
              lado: $\left(\frac x4\right)^{2} = \frac{x^{2}}{16}$.
          - texto: $\dfrac{x}{4}$
            mensaje: |
              $\frac x4$ es el **lado**, no el área.

      - tipo: calcular
        titulo: El área del triángulo
        pregunta: |
          Con $10-x$ metros de alambre, el triángulo equilátero tiene área
          $k(10-x)^{2}$. ¿Cuánto vale $k$? Da cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.0481'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0.4330'
            mensaje: |
              $\frac{\sqrt3}{4} \approx 0{,}433$ es el área de un triángulo
              equilátero **de lado 1**. Aquí el lado es $\frac{10-x}{3}$, así
              que hay que dividir además entre $3^{2}=9$.
          - valor: '0.1443'
            mensaje: |
              $\frac{\sqrt3}{12}$ divide entre 3 en vez de entre 9. El lado va
              **al cuadrado**.
          - valor: '0.0625'
            mensaje: |
              $\frac{1}{16}$ es la constante del **cuadrado**, no la del
              triángulo. Falta el factor $\frac{\sqrt3}{4}$ de la fórmula del
              área.
        pista: |
          El lado es $\frac{10-x}{3}$, y el área de un equilátero de lado $\ell$
          es $\frac{\sqrt3}{4}\ell^{2}$.
        desarrollo: |
          El triángulo equilátero de perímetro $10-x$ tiene lado

          $$
          \ell = \frac{10-x}{3}
          $$

          y su área es

          $$
          A_\triangle = \frac{\sqrt3}{4}\,\ell^{2}
          = \frac{\sqrt3}{4}\cdot\frac{(10-x)^{2}}{9}
          = \frac{\sqrt3}{36}(10-x)^{2}
          $$

          $$
          k = \frac{\sqrt3}{36} \approx 0{,}0481
          $$
        veredicto: |
          El $\frac{\sqrt3}{4}$ sale de la altura del equilátero,
          $\frac{\sqrt3}{2}\ell$. Conviene sabérsela: aparece en la mitad de los
          problemas de optimización con triángulos.

      - tipo: calcular
        titulo: Dónde cortar
        pregunta: |
          ¿Cuántos metros hay que dedicar al cuadrado? Da cuatro decimales.
        respuesta:
          tipo: numero
          valor: '4.3496'
          tolerancia: 0.005
          formato: un número en metros
        distractores:
          - valor: '5.6504'
            mensaje: |
              $5{,}65$ es lo que le toca al **triángulo**, es decir $10-x$. La
              pregunta es por la parte del cuadrado.
          - valor: '5'
            mensaje: |
              5 sería partir el alambre por la mitad. No es el óptimo: el
              triángulo aprovecha peor el material, así que le corresponde algo
              más de la mitad.
          - valor: '4.6512'
            mensaje: |
              $4{,}65$ saldría de resolver
              $\frac{x}{8} = \frac{\sqrt3(10-x)}{16}$: hay un 18 en el
              denominador, no un 16, porque
              $\frac{d}{dx}\frac{\sqrt3(10-x)^{2}}{36}
              = -\frac{\sqrt3(10-x)}{18}$.
        pista: |
          Deriva $A(x) = \frac{x^{2}}{16}+\frac{\sqrt3}{36}(10-x)^{2}$ e iguala
          a cero.
        desarrollo: |
          $$
          A(x) = \frac{x^{2}}{16}+\frac{\sqrt3}{36}(10-x)^{2},
          \qquad 0 \le x \le 10
          $$

          $$
          A'(x) = \frac{x}{8}-\frac{\sqrt3}{18}(10-x) = 0
          $$

          Multiplicando por 72 para quitar denominadores:

          $$
          9x = 4\sqrt3\,(10-x)
          \;\Longrightarrow\;
          9x+4\sqrt3\,x = 40\sqrt3
          $$

          $$
          x = \frac{40\sqrt3}{9+4\sqrt3}
          $$

          Racionalizando por $9-4\sqrt3$, cuyo producto da $81-48 = 33$:

          $$
          x = \frac{40\sqrt3\left(9-4\sqrt3\right)}{33}
          = \frac{360\sqrt3-480}{33} = \frac{40\left(3\sqrt3-4\right)}{11}
          $$

          $$
          x \approx 4{,}3496 \ \text{m}
          $$
        veredicto: |
          Al triángulo le tocan $5{,}65$ m, **más de la mitad**. Tiene sentido:
          para un mismo perímetro el triángulo encierra menos área que el
          cuadrado, así que conviene darle más alambre si lo que se quiere es
          minimizar.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La variable y la ligadura.** Si $x$ es el trozo del cuadrado, al
              triángulo le quedan $10-x$, con $0\le x\le10$. Una sola incógnita.
          - texto: |
              **Los lados**, que no son los trozos: $\frac x4$ y
              $\frac{10-x}{3}$.
          - texto: |
              **La función objetivo:**
              $A(x) = \frac{x^{2}}{16}+\frac{\sqrt3}{36}(10-x)^{2}$.
          - texto: |
              **Derivar e igualar:** $\frac x8 = \frac{\sqrt3(10-x)}{18}$, de
              donde $x = \frac{40\left(3\sqrt3-4\right)}{11} \approx 4{,}35$ m.
          - texto: |
              **Justificar que es mínimo:**
              $A''(x) = \frac18+\frac{\sqrt3}{18} > 0$ para todo $x$, así que
              $A$ es convexa y el punto crítico es mínimo **absoluto**.
          - texto: |
              Conviene comprobar también los extremos $x=0$ y $x=10$, porque en
              un intervalo cerrado el mínimo podría estar en la frontera.
            trampa: true
            mensaje: |
              Comprobar los extremos es buena costumbre **en general**, pero
              aquí es innecesario: $A$ es una **parábola convexa**, y una
              parábola convexa alcanza su mínimo en su vértice, esté donde
              esté el intervalo. Decirlo así es más corto y más fuerte que
              evaluar en 0 y en 10.
        veredicto: |
          Reconocer que $A$ es una parábola en $x$ —los dos sumandos son
          cuadráticos— ahorra toda la discusión de extremos. Es el punto de
          COMP1.

    resolucion: |
      **Datos.** Un alambre de 10 m que se parte en dos: con una parte un
      cuadrado, con la otra un triángulo equilátero. Se pide minimizar la suma
      de áreas.

      ### 1 · Plantear

      **La variable.** Sea $x$ la longitud destinada al **cuadrado**. Al
      triángulo le quedan $10-x$, y

      $$
      0 \le x \le 10
      $$

      **El error que hay que evitar desde el principio:** $x$ es el
      **perímetro**, no el lado.

      | figura | perímetro | lado | área |
      |---|---|---|---|
      | cuadrado | $x$ | $\dfrac{x}{4}$ | $\dfrac{x^{2}}{16}$ |
      | triángulo | $10-x$ | $\dfrac{10-x}{3}$ | $\dfrac{\sqrt3}{4}\cdot\dfrac{(10-x)^{2}}{9}$ |

      **La función objetivo:**

      $$
      A(x) = \frac{x^{2}}{16}+\frac{\sqrt3}{36}(10-x)^{2}
      $$

      ### 2 · Optimizar

      $$
      A'(x) = \frac{2x}{16}-\frac{2\sqrt3}{36}(10-x)
      = \frac{x}{8}-\frac{\sqrt3}{18}(10-x)
      $$

      Igualando a cero y multiplicando por 72:

      $$
      9x = 4\sqrt3\left(10-x\right)
      $$

      $$
      x\left(9+4\sqrt3\right) = 40\sqrt3
      \;\Longrightarrow\;
      x = \frac{40\sqrt3}{9+4\sqrt3}
      $$

      Racionalizando —el conjugado da $81-48 = 33$—:

      $$
      \boxed{x = \frac{40\left(3\sqrt3-4\right)}{11} \approx 4{,}3496 \ \text{m}
      \ \text{para el cuadrado}}
      $$

      $$
      10-x \approx 5{,}6504 \ \text{m} \ \text{para el triángulo}
      $$

      ### 3 · Que es mínimo, y por qué basta una línea

      $$
      A''(x) = \frac18+\frac{\sqrt3}{18} > 0
      $$

      **constante y positiva**: $A$ es una **parábola convexa**. Y una parábola
      convexa alcanza su mínimo absoluto en su vértice, sin necesidad de mirar
      los extremos del intervalo.

      Esa observación —que los dos sumandos son cuadráticos en $x$— es lo que
      convierte la discusión en una línea.

      ### 4 · Por qué al triángulo le toca más

      Le corresponden $5{,}65$ m, **más de la mitad**. No es casual: para un
      mismo perímetro, el triángulo equilátero encierra **menos** área que el
      cuadrado.

      | figura | área con perímetro $p$ |
      |---|---|
      | cuadrado | $\dfrac{p^{2}}{16} = 0{,}0625\,p^{2}$ |
      | triángulo | $\dfrac{\sqrt3}{36}p^{2} = 0{,}0481\,p^{2}$ |

      Como se quiere **minimizar**, conviene dar más alambre a la figura menos
      eficiente. Si el problema pidiera el máximo, la respuesta sería dárselo
      todo al cuadrado.

      ### 5 · Comprobación

      **Del valor mínimo:**

      $$
      A(4{,}3496) = \frac{18{,}919}{16}+0{,}0481\cdot31{,}927
      = 1{,}1824+1{,}5359 = 2{,}718 \ \text{m}^{2}
      $$

      **Contra los extremos**, que aunque no hagan falta confirman el
      resultado:

      | $x$ | $A(x)$ |
      |---|---|
      | $0$ (todo triángulo) | $4{,}811$ |
      | $4{,}35$ | $\mathbf{2{,}718}$ |
      | $5$ | $2{,}766$ |
      | $10$ (todo cuadrado) | $6{,}250$ |

      El del punto crítico es el menor ✔

      **Del máximo, de paso.** El mayor de la tabla es $x=10$: todo el alambre
      al cuadrado. Coherente con que el cuadrado sea la figura más eficiente de
      las dos.
