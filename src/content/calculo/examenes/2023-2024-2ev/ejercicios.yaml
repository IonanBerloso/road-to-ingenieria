        <g fill="none" stroke-width="2.8" stroke-linecap="round">
          <path stroke="var(--d1)"
                d="M500 290 C 530 300, 560 300, 583 296
                   C 630 284, 645 230, 666 170
                   C 690 112, 720 72, 749 62 C 780 52, 810 50, 832 48"></path>
