ejercicios:
  - id: ex2324-2ev-1-derivada-y-velocidades
    titulo: Una derivada dibujada, y dos velocidades
    fuente: >-
      Ejercicio 1 · Segunda evaluación, 27 de noviembre de 2023 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 2
      comp4: 6

    enunciado: |
      La gráfica adjunta muestra la derivada $y'(x)$ de cierta función $y(x)$.
      Las cotas son en cm.

      <figure class="figura-examen">
      <svg viewBox="0 0 840 420" role="img" width="820" height="410"
           aria-labelledby="f2324b1t f2324b1d">
        <title id="f2324b1t">La grafica de la derivada de y</title>
        <desc id="f2324b1d">Una onda que parte del origen, sube a un maximo de
        0,69 en x igual a 1, corta el eje en x igual a 2, baja a un minimo de
        menos 1,89 en x igual a 4, vuelve a cortar el eje en x igual a 6, sube
        a un maximo de 0,73 en x igual a 7, corta el eje en x igual a 8, baja a
        un minimo de menos 1 en x igual a 9 y remonta hasta cero en x igual a
        9,5.</desc>

        <g stroke="var(--rule)" stroke-width="1" fill="none">
          <path d="M70 60 L70 350 M145 60 L145 350 M219 60 L219 350
                   M294 60 L294 350 M369 60 L369 350 M443 60 L443 350
                   M518 60 L518 350 M593 60 L593 350 M668 60 L668 350
                   M742 60 L742 350
                   M70 60 L780 60 M70 101 L780 101 M70 143 L780 143
                   M70 226 L780 226 M70 267 L780 267 M70 309 L780 309
                   M70 350 L780 350"></path>
        </g>

        <g stroke="var(--graphite)" stroke-width="1.4" fill="none">
          <path d="M50 184 L800 184 M70 45 L70 365"></path>
        </g>

        <g stroke="var(--ink)" stroke-width="2.8" fill="none"
           stroke-linecap="round">
          <path d="M70 184 C 95 155, 120 127, 145 127
                   C 170 127, 195 155, 219 184
                   C 260 226, 320 322, 369 341
                   C 420 362, 480 240, 518 184
                   C 545 148, 570 124, 593 124
                   C 618 124, 645 150, 668 184
                   C 695 220, 720 267, 742 267
                   C 760 267, 772 214, 780 187"></path>
        </g>

        <g fill="var(--live)">
          <circle cx="107" cy="143" r="5"></circle>
          <circle cx="556" cy="143" r="5"></circle>
        </g>

        <g fill="var(--graphite)" font-size="13" font-family="var(--mono)">
          <text x="34" y="65">1,5</text>
          <text x="48" y="106">1</text>
          <text x="30" y="148">0,5</text>
          <text x="48" y="189">0</text>
          <text x="24" y="231">-0,5</text>
          <text x="42" y="272">-1</text>
          <text x="24" y="314">-1,5</text>
          <text x="42" y="355">-2</text>
          <text x="141" y="372">1</text>
          <text x="215" y="372">2</text>
          <text x="290" y="372">3</text>
          <text x="365" y="372">4</text>
          <text x="439" y="372">5</text>
          <text x="514" y="372">6</text>
          <text x="589" y="372">7</text>
          <text x="664" y="372">8</text>
          <text x="738" y="372">9</text>
        </g>

        <g fill="var(--live)" font-size="12" font-family="var(--mono)">
          <text x="80" y="132">0,5</text>
          <text x="529" y="132">6,5</text>
        </g>

        <g fill="var(--ink)" font-size="16" font-family="var(--mono)">
          <text x="160" y="88">y'(x)</text>
        </g>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original y medida sobre el PDF, no leida
      a ojo: la rejilla se localizo por densidad de tinta y la curva se siguio
      pixel a pixel. En verde, los dos puntos que piden los apartados (c) y
      (d), donde la derivada vale 0,50 y 0,52 respectivamente.
      </figcaption>
      </figure>

      **a)** Estudiar el crecimiento y los extremos locales de $y(x)$.

      **b)** Estudiar la concavidad y los puntos de inflexión de $y(x)$.

      **c)** Supongamos que un punto $P(x,y)$ se desplaza en el plano XY sobre
      la gráfica de $y(x)$. Supongamos que en el instante en el que $x = 0.5$,
      la velocidad de desplazamiento **horizontal** de $P$ respecto al tiempo
      es igual a 2 cm/s. Calcular en ese mismo instante la velocidad de
      desplazamiento **vertical** de $P$ respecto al tiempo.

      **d)** Supongamos que en el instante en el que $x = 6.5$, la velocidad de
      desplazamiento **vertical** de $P$ respecto al tiempo es igual a 3 cm/s.
      Calcular en ese mismo instante la velocidad de desplazamiento
      **horizontal** de $P$ respecto al tiempo.
    pide: Estudiar $y$ y calcular las dos velocidades.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué relación liga las dos velocidades de los apartados (c) y (d)?
        opciones:
          - texto: >-
              La regla de la cadena: $\dfrac{dy}{dt}
              = y'(x)\cdot\dfrac{dx}{dt}$
            correcta: true
            mensaje: |
              Exacto. El punto se mueve **sobre la curva**, así que su altura es
              $y(x(t))$ y derivar respecto del tiempo obliga a pasar por
              $y'(x)$. La gráfica da precisamente ese factor, y por eso el
              enunciado la pone.
          - texto: >-
              El teorema de Pitágoras entre las dos componentes
            mensaje: |
              Pitágoras daría la velocidad **total**, que no es lo que se pide.
              Aquí se relacionan las dos componentes entre sí, y quien las liga
              es la pendiente de la curva.
          - texto: >-
              Son iguales, porque el punto sigue la curva
            mensaje: |
              Solo lo serían si la pendiente valiera 1. La curva dice que en
              $x=0{,}5$ vale $0{,}5$: la componente vertical es la mitad de la
              horizontal.
          - texto: >-
              Hay que integrar la gráfica para obtener $y(x)$ primero
            mensaje: |
              No hace falta: la relación solo necesita $y'$, que es justo lo que
              está dibujado.

      - tipo: calcular
        titulo: El apartado (c)
        pregunta: |
          Con $\frac{dx}{dt} = 2$ cm/s en $x=0{,}5$, ¿cuánto vale
          $\frac{dy}{dt}$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.05
          formato: un número en cm/s
        distractores:
          - valor: '4'
            mensaje: |
              4 sale de **dividir** entre la pendiente en vez de multiplicar:
              $\frac{2}{0{,}5}$. La cadena multiplica.
          - valor: '0.5'
            mensaje: |
              $0{,}5$ es la pendiente $y'(0{,}5)$, no la velocidad. Falta
              multiplicarla por los 2 cm/s.
          - valor: '2'
            mensaje: |
              2 es la velocidad **horizontal**, el dato. La vertical es la mitad
              porque la curva sube con pendiente $0{,}5$.
        pista: |
          En la gráfica, $y'(0{,}5) = 0{,}5$.
        desarrollo: |
          El punto recorre la curva, así que su ordenada es $y(x(t))$ y

          $$
          \frac{dy}{dt} = y'(x)\cdot\frac{dx}{dt}
          $$

          Leyendo en la gráfica $y'(0{,}5) = 0{,}5$:

          $$
          \frac{dy}{dt} = 0{,}5\cdot2 = 1 \ \text{cm/s}
          $$
        veredicto: |
          El valor $0{,}5$ no está puesto al azar: medido sobre el PDF sale
          $0{,}50$, justo sobre una línea de la rejilla. El examen elige puntos
          donde la lectura es exacta.

      - tipo: calcular
        titulo: El apartado (d)
        pregunta: |
          Con $\frac{dy}{dt} = 3$ cm/s en $x=6{,}5$, ¿cuánto vale
          $\frac{dx}{dt}$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.3
          formato: un número en cm/s
        distractores:
          - valor: '1.5'
            mensaje: |
              $1{,}5$ sale de **multiplicar** por la pendiente. Aquí el dato es
              la velocidad vertical, así que hay que **dividir**: la relación se
              usa al revés que en (c).
          - valor: '3'
            mensaje: |
              3 es el dato, la velocidad vertical. La horizontal es mayor porque
              la curva sube despacio.
          - valor: '0.5'
            mensaje: |
              $0{,}5$ es la pendiente en ese punto, no una velocidad.
        pista: |
          Ahora se conoce $\frac{dy}{dt}$ y se busca $\frac{dx}{dt}$: hay que
          despejar.
        desarrollo: |
          La misma relación, usada al revés:

          $$
          \frac{dy}{dt} = y'(x)\cdot\frac{dx}{dt}
          \;\Longrightarrow\;
          \frac{dx}{dt} = \frac{1}{y'(x)}\cdot\frac{dy}{dt}
          $$

          Con $y'(6{,}5) = 0{,}5$:

          $$
          \frac{dx}{dt} = \frac{3}{0{,}5} = 6 \ \text{cm/s}
          $$
        veredicto: |
          Los dos apartados usan la misma fórmula en direcciones opuestas. Que
          la pendiente valga $0{,}5$ en los dos puntos es deliberado: obliga a
          distinguir cuál se multiplica y cuál se divide.

      - tipo: justificar
        pregunta: |
          Ordena los apartados (a) y (b). Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **(a) Crecimiento.** Lo da el **signo** de la curva dibujada.
              $y'>0$ en $(0,2)$ y $(6,8)$; $y'<0$ en $(2,6)$ y $(8;9{,}5)$.
          - texto: |
              Luego $y$ tiene **máximos** en $x=2$ y $x=8$, y un **mínimo** en
              $x=6$: son los puntos donde la curva corta al eje cambiando de
              signo.
          - texto: |
              **(b) Concavidad.** La da la **pendiente** de la curva dibujada,
              que es $y''$.
          - texto: |
              $y'$ crece en $(0,1)$, $(4,7)$ y $(9;9{,}5)$ — ahí $y$ es
              **convexa**— y decrece en $(1,4)$ y $(7,9)$ — ahí es **cóncava**.
          - texto: |
              Los **puntos de inflexión** de $y$ están donde $y'$ tiene sus
              extremos: $x=1$, $x=4$, $x=7$ y $x=9$.
          - texto: |
              Los cortes de la curva con el eje, $x=2$, $6$ y $8$, son los
              puntos de inflexión de $y$.
            trampa: true
            mensaje: |
              Esos cortes son los **extremos** de $y$, no sus inflexiones. Las
              inflexiones están donde $y'$ tiene máximos y mínimos. Es el error
              central de todos los ejercicios de este tipo: leer la gráfica de
              $y'$ como si fuera la de $y$.
        veredicto: |
          Dos lecturas distintas de la misma curva: su **signo** habla del
          crecimiento de $y$, su **pendiente** de la concavidad. Confundirlas
          cuesta los seis puntos de COMP4 de este ejercicio.

    resolucion: |
      **Datos.** La gráfica de $y'$ en $[0;9{,}5]$, con cotas en centímetros.

      > **Nota sobre la figura.** Está redibujada y **medida sobre el PDF
      > original**, no leída a ojo: la rejilla se localizó por densidad de tinta
      > y la curva se siguió píxel a píxel. Los valores que salieron —máximo
      > $0{,}69$ en $x=1$, mínimo $-1{,}89$ en $x=4$, máximo $0{,}73$ en $x=7$,
      > mínimo $-1{,}0$ en $x=9$— y, sobre todo, $y'(0{,}5) = 0{,}50$ e
      > $y'(6{,}5) = 0{,}52$, que son los que piden los apartados (c) y (d).

      ### 1 · Dos lecturas de la misma curva

      La curva dibujada es $y'$. De ella se sacan dos cosas distintas:

      | qué se mira | qué dice de $y$ |
      |---|---|
      | el **signo** de la curva | si $y$ crece o decrece |
      | la **pendiente** de la curva | si $y$ es cóncava o convexa |

      Y en consecuencia:

      - los **cortes** de la curva con el eje son los **extremos** de $y$;
      - los **extremos** de la curva son las **inflexiones** de $y$.

      ### 2 · Apartado (a): crecimiento y extremos

      La curva corta al eje en $x = 0$, $2$, $6$ y $8$, y termina en
      $x=9{,}5$ volviendo a cero.

      | tramo | $y'$ | $y$ |
      |---|---|---|
      | $(0,2)$ | $+$ | crece |
      | $(2,6)$ | $-$ | decrece |
      | $(6,8)$ | $+$ | crece |
      | $(8;9{,}5)$ | $-$ | decrece |

      $$
      \boxed{\text{máximos en } x=2 \text{ y } x=8; \quad
      \text{mínimo en } x=6}
      $$

      En $x=0$ la derivada también se anula, pero sin cambiar de signo a los dos
      lados dentro del dominio: es el extremo del intervalo, no un extremo
      local interior.

      ### 3 · Apartado (b): concavidad e inflexión

      La pendiente de la curva es $y''$. La curva sube y baja alternativamente:

      | tramo | $y'$ | $y''$ | $y$ |
      |---|---|---|---|
      | $(0,1)$ | sube | $+$ | convexa |
      | $(1,4)$ | baja | $-$ | cóncava |
      | $(4,7)$ | sube | $+$ | convexa |
      | $(7,9)$ | baja | $-$ | cóncava |
      | $(9;9{,}5)$ | sube | $+$ | convexa |

      $$
      \boxed{\text{inflexiones en } x = 1,\ 4,\ 7 \text{ y } 9}
      $$

      que son exactamente los extremos de la curva dibujada.

      ### 4 · Apartados (c) y (d): las velocidades

      El punto $P$ se mueve **sobre la curva**, así que su ordenada es
      $y\big(x(t)\big)$ y la regla de la cadena da

      $$
      \frac{dy}{dt} = y'(x)\cdot\frac{dx}{dt}
      $$

      Una sola fórmula, usada en las dos direcciones.

      **(c)** En $x=0{,}5$ la gráfica da $y'=0{,}5$, y el dato es
      $\frac{dx}{dt}=2$:

      $$
      \boxed{\frac{dy}{dt} = 0{,}5\cdot2 = 1 \ \text{cm/s}}
      $$

      **(d)** En $x=6{,}5$ la gráfica vuelve a dar $y'=0{,}5$, pero ahora el
      dato es $\frac{dy}{dt}=3$:

      $$
      \boxed{\frac{dx}{dt} = \frac{3}{0{,}5} = 6 \ \text{cm/s}}
      $$

      **Que la pendiente valga lo mismo en los dos puntos es deliberado**: la
      única diferencia entre los apartados es cuál de las dos velocidades es el
      dato, y por tanto si hay que multiplicar o dividir. Es la trampa del
      ejercicio.

      ### 5 · Comprobación

      **Del signo.** En $x=0{,}5$ y en $x=6{,}5$ la curva está **por encima**
      del eje, así que la pendiente de $y$ es positiva y las dos velocidades
      deben tener el mismo signo. Los dos resultados son positivos ✔

      **Del orden de magnitud.** Con pendiente $\frac12$, la componente vertical
      es la **mitad** de la horizontal:

      $$
      \text{(c)}\ 1 = \tfrac12\cdot2 \quad\checkmark
      \qquad
      \text{(d)}\ 3 = \tfrac12\cdot6 \quad\checkmark
      $$

      **De coherencia con (a) y (b).** El punto $x=6{,}5$ está entre el mínimo
      de $y$ (en 6) y su máximo (en 8): $y$ sube ahí, como confirma el signo ✔
      Y está entre las inflexiones 4 y 7, o sea en un tramo convexo de $y$,
      donde la pendiente aún está aumentando.

  - id: ex2324-2ev-2-bolzano-y-lagrange
    titulo: Dos teoremas para dos preguntas casi iguales
    fuente: >-
      Ejercicio 2 · Segunda evaluación, 27 de noviembre de 2023 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 2
      comp4: 7

    enunciado: |
      Sea la función

      $$
      f(x) = \begin{cases}
      \dfrac{7-16^{1/x}}{1+16^{1/x}} & x \neq 0 \\[10pt]
      7 & x = 0
      \end{cases}
      $$

      **a)** Demostrar que $f(x)$ toma el valor 1 en el intervalo $(2,4)$.

      **b)** Demostrar que $f'(x)$ toma el valor $\dfrac{8}{15}$ en el intervalo
      $(2,4)$.
    pide: Demostrar las dos afirmaciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos apartados se parecen mucho, pero piden teoremas distintos.
          ¿Cuáles?
        opciones:
          - texto: >-
              **Bolzano** para el valor de $f$; **Lagrange** para el valor de
              $f'$
            correcta: true
            mensaje: |
              Exacto. Bolzano —o el teorema del valor intermedio— garantiza que
              una función continua alcanza todos los valores entre $f(2)$ y
              $f(4)$. Lagrange garantiza que la derivada alcanza el **cociente
              incremental**, que aquí resulta valer justo $\frac{8}{15}$.
          - texto: Bolzano para los dos
            mensaje: |
              Bolzano no dice nada sobre la derivada. Para (b) hace falta un
              teorema que hable de $f'$, y ese es el del valor medio.
          - texto: Rolle para los dos
            mensaje: |
              Rolle exige $f(a)=f(b)$, y aquí $f(2) \neq f(4)$. Es el caso
              particular de Lagrange con extremos iguales.
          - texto: >-
              Weierstrass para (a) y Rolle para (b)
            mensaje: |
              Weierstrass garantiza máximo y mínimo absolutos, no un valor
              intermedio concreto. Y Rolle no se aplica por lo dicho arriba.

      - tipo: calcular
        titulo: Los valores en los extremos
        pregunta: |
          ¿Cuánto vale $f(4)$? Da cuatro decimales.
        respuesta:
          tipo: numero
          valor: '1.6667'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0.6'
            mensaje: |
              $0{,}6$ es $f(2)$, el otro extremo. Aquí
              $16^{1/4} = 2$, no 4.
          - valor: '0.2'
            mensaje: |
              $0{,}2$ saldría con $16^{1/4}=4$: sería $\frac{3}{5}\cdot\ldots$
              no. La raíz **cuarta** de 16 es 2.
          - valor: '2.5'
            mensaje: |
              $2{,}5$ saldría de $\frac{7-2}{1+1}$: has olvidado que el
              denominador también lleva el $16^{1/x}$.
        pista: |
          $16^{1/4} = \sqrt[4]{16} = 2$.
        desarrollo: |
          $$
          f(4) = \frac{7-16^{1/4}}{1+16^{1/4}} = \frac{7-2}{1+2}
          = \frac{5}{3} \approx 1{,}6667
          $$

          Y en el otro extremo, con $16^{1/2} = 4$:

          $$
          f(2) = \frac{7-4}{1+4} = \frac{3}{5} = 0{,}6
          $$
        veredicto: |
          Los exponentes están elegidos para que $16^{1/x}$ salga entero en los
          dos extremos: 4 y 2. Sin eso el ejercicio sería impracticable sin
          calculadora, y el examen no la permite.

      - tipo: calcular
        titulo: El cociente incremental
        pregunta: |
          ¿Cuánto vale $\dfrac{f(4)-f(2)}{4-2}$? Da cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.5333'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '1.0667'
            mensaje: |
              $\frac{16}{15}$ es la **diferencia** $f(4)-f(2)$. Falta dividir
              entre la longitud del intervalo, que es 2.
          - valor: '2.2667'
            mensaje: |
              $2{,}267$ es la **suma** $f(4)+f(2)$ dividida entre algo. El
              cociente incremental resta, no suma.
          - valor: '0.2667'
            mensaje: |
              $\frac{4}{15}$ es la mitad del resultado: has dividido dos veces
              entre 2.
        pista: |
          $f(4) = \frac53$ y $f(2) = \frac35$.
        desarrollo: |
          $$
          f(4)-f(2) = \frac53-\frac35 = \frac{25-9}{15} = \frac{16}{15}
          $$

          $$
          \frac{f(4)-f(2)}{4-2} = \frac{16/15}{2} = \frac{8}{15}
          \approx 0{,}5333
          $$

          Que es **exactamente** el valor que pide el enunciado.
        veredicto: |
          El $\frac{8}{15}$ del enunciado no es un número cualquiera: es el
          cociente incremental. Reconocerlo es todo el ejercicio — después,
          Lagrange lo remata en una línea.

      - tipo: justificar
        pregunta: |
          Ordena la demostración completa. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La hipótesis común:** $f$ es continua en $[2,4]$ y derivable en
              $(2,4)$, porque $16^{1/x}$ lo es para $x\neq0$ y el denominador
              $1+16^{1/x}$ **nunca se anula** —es suma de 1 y algo positivo—.
              El valor $f(0)=7$ del enunciado no interviene: el 0 está fuera del
              intervalo.
          - texto: |
              **Los extremos:** $f(2) = \frac{7-4}{1+4} = \frac35$ y
              $f(4) = \frac{7-2}{1+2} = \frac53$.
          - texto: |
              **(a) Bolzano.** Como $\frac35 < 1 < \frac53$, el teorema del
              valor intermedio garantiza que existe $c\in(2,4)$ con
              $f(c) = 1$.
          - texto: |
              **(b) Lagrange.** El cociente incremental vale
              $\frac{5/3-3/5}{2} = \frac{8}{15}$.
          - texto: |
              Y el teorema del valor medio garantiza que existe $c\in(2,4)$ con
              $f'(c) = \frac{8}{15}$, que es lo pedido.
          - texto: |
              Para aplicar Bolzano hay que comprobar además que $f$ es
              **monótona** en $[2,4]$, para que el valor 1 se alcance una sola
              vez.
            trampa: true
            mensaje: |
              Bolzano no exige monotonía y **no promete unicidad**: solo dice
              que el valor se alcanza al menos una vez. El enunciado tampoco
              pide unicidad — dice «toma el valor 1», no «lo toma una sola
              vez». Añadir hipótesis que no hacen falta es tan costoso como
              omitir las que sí.
        veredicto: |
          Comprobar que el denominador nunca se anula es lo que hace legítimo
          decir «continua y derivable». Sin esa frase, la demostración está
          incompleta aunque el resultado sea correcto.

    resolucion: |
      **Datos.** $f(x) = \dfrac{7-16^{1/x}}{1+16^{1/x}}$ para $x\neq0$, con
      $f(0)=7$. Se pide demostrar dos cosas en $(2,4)$.

      ### 1 · Lo primero: las hipótesis

      Los dos apartados son teoremas de existencia, y los teoremas de existencia
      se ganan comprobando hipótesis. Aquí:

      - $16^{1/x} = e^{\frac{\ln16}{x}}$ es **continua y derivable** para todo
        $x \neq 0$, por composición de funciones que lo son;
      - el denominador $1+16^{1/x}$ es **siempre mayor que 1**, porque
        $16^{1/x}>0$: nunca se anula, así que el cociente hereda la continuidad
        y la derivabilidad.

      Y como $0 \notin [2,4]$, **el valor $f(0)=7$ no interviene**. Está en el
      enunciado para que $f$ quede definida en todo $\mathbb{R}$, no porque
      haga falta aquí.

      $$
      f \text{ es continua en } [2,4] \text{ y derivable en } (2,4)
      $$

      ### 2 · Los valores en los extremos

      Los exponentes están elegidos para que las potencias salgan enteras:

      $$
      16^{1/2} = 4,
      \qquad
      16^{1/4} = 2
      $$

      $$
      f(2) = \frac{7-4}{1+4} = \frac{3}{5},
      \qquad
      f(4) = \frac{7-2}{1+2} = \frac{5}{3}
      $$

      ### 3 · Apartado (a): Bolzano

      **Enunciado.** Si $g$ es continua en $[a,b]$ y $g(a)$ y $g(b)$ tienen
      signos opuestos, existe $c\in(a,b)$ con $g(c)=0$.

      Se aplica a $g(x) = f(x)-1$, que es continua en $[2,4]$:

      $$
      g(2) = \frac35-1 = -\frac25 < 0,
      \qquad
      g(4) = \frac53-1 = \frac23 > 0
      $$

      Signos opuestos, luego existe $c\in(2,4)$ con $g(c)=0$, es decir

      $$
      \boxed{\exists\, c \in (2,4) : f(c) = 1}
      $$

      **Dicho de otra forma**, por el teorema del valor intermedio: como
      $\frac35 < 1 < \frac53$, el valor 1 está entre los dos extremos y una
      función continua los alcanza todos.

      ### 4 · Apartado (b): Lagrange

      **Enunciado.** Si $f$ es continua en $[a,b]$ y derivable en $(a,b)$,
      existe $c\in(a,b)$ tal que

      $$
      f'(c) = \frac{f(b)-f(a)}{b-a}
      $$

      Las hipótesis ya están comprobadas. El cociente incremental:

      $$
      \frac{f(4)-f(2)}{4-2} = \frac{\frac53-\frac35}{2}
      = \frac{\frac{25-9}{15}}{2} = \frac{16/15}{2} = \frac{8}{15}
      $$

      $$
      \boxed{\exists\, c \in (2,4) : f'(c) = \frac{8}{15}}
      $$

      **El $\frac{8}{15}$ del enunciado es exactamente el cociente
      incremental.** Reconocerlo es el ejercicio entero: no hay que derivar
      nada.

      ### 5 · Lo que no hay que hacer

      **Derivar $f$.** Sale una expresión considerable —hay una exponencial
      compuesta con $\frac1x$ y una regla del cociente— y no sirve de nada: el
      teorema garantiza la existencia sin necesidad de encontrar el punto.

      **Buscar el valor de $c$.** Ni el enunciado lo pide ni se puede despejar
      en forma cerrada. Los dos apartados dicen «demostrar que toma el valor»,
      no «calcular dónde».

      **Añadir hipótesis de más.** Bolzano no exige monotonía y no promete
      unicidad. Sobrecargar la demostración con condiciones innecesarias resta
      igual que omitir las necesarias.

      ### 6 · Comprobación

      **Numérica de (a).** $f$ pasa de $0{,}6$ a $1{,}667$, y en el punto medio
      $x=3$:

      $$
      16^{1/3} = 2{,}5198
      \;\Longrightarrow\;
      f(3) = \frac{7-2{,}5198}{1+2{,}5198} = \frac{4{,}4802}{3{,}5198}
      = 1{,}2728
      $$

      Ya pasó de 1, así que el corte está entre 2 y 3 ✔ Afinando, $f(c)=1$ para
      $c \approx 2{,}55$.

      **Numérica de (b).** La pendiente media entre los extremos es
      $\frac{8}{15} = 0{,}533$. La pendiente instantánea en $x=3$, estimada por
      diferencias centradas con $h=0{,}01$, sale $\approx0{,}52$: muy cercana,
      como corresponde a una función suave y monótona ✔

      **De coherencia entre los dos apartados.** El valor 1 se alcanza dentro
      del intervalo (a), y la pendiente media es positiva (b): las dos cosas
      dicen que $f$ **sube** de $\frac35$ a $\frac53$ atravesando el 1 ✔

  - id: ex2324-2ev-3-taylor-de-una-composicion
    titulo: Taylor de una composición leída en seis curvas
    fuente: >-
      Ejercicio 3 · Segunda evaluación, 27 de noviembre de 2023 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 5
      comp4: 4

    enunciado: |
      En la siguiente imagen se muestran las gráficas de las funciones $f(x)$,
      $g(x)$ y de sus respectivas derivadas de primer y segundo orden.

      <figure class="figura-examen">
