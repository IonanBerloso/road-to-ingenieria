                d="M500 214 C 530 196, 555 178, 583 170
                   C 620 148, 645 118, 666 105
                   C 700 92, 720 92, 749 105 C 780 122, 810 148, 832 138"></path>
          <path stroke="var(--graphite)" stroke-dasharray="3 6"
                d="M500 112 C 540 96, 570 88, 583 88
                   C 615 92, 640 124, 666 170
                   C 692 216, 720 250, 749 262 C 780 274, 810 282, 832 286"></path>
        </g>

        <g fill="var(--graphite)" font-size="12" font-family="var(--mono)">
          <text x="42" y="44">5</text>
