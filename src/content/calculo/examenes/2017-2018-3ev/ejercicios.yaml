ejercicios:
  - id: ex1718-3ev-1-cubo-igual-a-menos-el-modulo
    titulo: Cuando el cubo vale menos el módulo
    fuente: >-
      Ejercicio 1 · Tercera evaluación, 23 de enero de 2018 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 4
      comp4: 4

    enunciado: |
      Calcular y representar geométricamente los afijos de los números complejos
      $z$ que verifican la siguiente condición:

      $$
      z^{3} = -\left\lvert z\right\rvert
      $$
    pide: Calcular las soluciones y representarlas.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dice el segundo miembro antes de hacer ninguna cuenta?
        opciones:
          - texto: >-
              Que $z^{3}$ es un número **real y no positivo**, porque
              $-\left\lvert z\right\rvert \le 0$
            correcta: true
            mensaje: |
              Exacto, y eso ya sitúa los argumentos: $z^{3}$ tiene que caer en
              el semieje real negativo —o ser cero—, así que
              $3\theta = \pi+2k\pi$.
          - texto: >-
              Que $z$ es real negativo
            mensaje: |
              El **cubo** es real, no necesariamente $z$. De hecho dos de las
              soluciones son complejas.
          - texto: >-
              Que $\left\lvert z\right\rvert$ es negativo
            mensaje: |
              Un módulo nunca es negativo. Lo negativo es su opuesto, que es lo
              que aparece.
          - texto: >-
              Que hay que elevar los dos miembros al cuadrado
            mensaje: |
              Elevar al cuadrado perdería el signo, que es justamente la
              información útil del enunciado.

      - tipo: calcular
        titulo: Cuántas soluciones hay
        pregunta: |
          ¿Cuántos números complejos cumplen la condición?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              3 son las soluciones de módulo 1. Falta $z=0$, que también cumple
              la igualdad: $0 = -0$.
          - valor: '1'
            mensaje: |
              1 sería si solo se buscaran soluciones reales. En $\mathbb{C}$ hay
              cuatro.
          - valor: '6'
            mensaje: |
              6 saldría de contar dos veces las raíces cúbicas. Solo hay tres
              para cada módulo, y solo un módulo no nulo sirve.
        pista: |
          Toma módulos: $\left\lvert z\right\rvert^{3} = \left\lvert z\right\rvert$. ¿Qué
          valores de $r\ge0$ lo cumplen?
        desarrollo: |
          Tomando módulos en los dos miembros, con $r = \left\lvert z\right\rvert$:

          $$
          \left\lvert z^{3}\right\rvert = \left\lvert-\left\lvert z\right\rvert\right\rvert
          \;\Longrightarrow\;
          r^{3} = r
          $$

          $$
          r\left(r^{2}-1\right) = 0
          \;\Longrightarrow\;
          r = 0 \ \text{ó}\ r = 1
          $$

          —la raíz $r=-1$ se descarta: un módulo es $\ge0$—.

          | módulo | soluciones |
          |---|---|
          | $r=0$ | $z=0$, una |
          | $r=1$ | $z^{3}=-1$, tres |

          $$
          1+3 = 4
          $$
        veredicto: |
          El caso $r=0$ es el que se olvida. Conviene comprobarlo: con $z=0$ la
          ecuación queda $0 = -0$, que es cierta.

      - tipo: calcular
        titulo: La solución real no nula
        pregunta: |
          Una de las soluciones es un número real distinto de cero. ¿Cuál?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Con $z=1$ sale $1 = -1$, falso. El cubo tiene que ser **negativo**.
          - valor: '0.5'
            mensaje: |
              Su módulo no es 1, así que no cumple $r^{3}=r$.
          - valor: '-0.5'
            mensaje: |
              $(-0{,}5)^{3} = -0{,}125$ y $-\left\lvert z\right\rvert = -0{,}5$: no
              coinciden.
        pista: |
          Con $r=1$ la ecuación es $z^{3} = -1$. ¿Qué real la cumple?
        desarrollo: |
          Con $r=1$:

          $$
          z^{3} = -1
          $$

          El real que lo cumple es $z=-1$:

          $$
          (-1)^{3} = -1 = -\left\lvert-1\right\rvert \quad\checkmark
          $$

          Las otras dos raíces cúbicas de $-1$ son complejas:

          $$
          \mathrm{e}^{i\pi/3} = \frac12+\frac{\sqrt3}{2}i,
          \qquad
          \mathrm{e}^{i5\pi/3} = \frac12-\frac{\sqrt3}{2}i
          $$
        veredicto: |
          Las raíces cúbicas de $-1$ **no** son solo $-1$: son tres, y dos de
          ellas están en el semiplano derecho. Es el error clásico de creer que
          $\sqrt[3]{-1}$ tiene una sola respuesta.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Leer el segundo miembro.** $-\left\lvert z\right\rvert$ es real y
              $\le0$, así que $z^{3}$ está en el semieje real negativo o es
              cero.
          - texto: |
              **Tomar módulos:** $r^{3} = r$, con $r\ge0$. Sale $r=0$ o
              $r=1$.
          - texto: |
              **El caso $r=0$:** $z=0$, y en efecto $0 = -0$ ✔
          - texto: |
              **El caso $r=1$:** la ecuación queda $z^{3} = -1
              = \mathrm{e}^{i\pi}$, cuyas tres raíces tienen argumentos
              $\frac{\pi}{3}$, $\pi$ y $\frac{5\pi}{3}$.
          - texto: |
              **Cuatro soluciones:** el origen y tres puntos sobre la
              circunferencia unidad que forman un triángulo equilátero, con un
              vértice en $-1$.
          - texto: |
              Al tomar módulos se pueden introducir soluciones falsas, así que
              hay que comprobar las cuatro sustituyendo.
            trampa: true
            mensaje: |
              Tomar módulos es una implicación en un solo sentido, sí, pero aquí
              **no se ha resuelto por ahí**: el módulo solo ha servido para
              acotar los candidatos, y después se ha impuesto la ecuación
              completa $z^{3}=-1$, que es equivalente. Comprobar nunca sobra,
              pero presentarlo como una obligación del método sugiere que el
              razonamiento pierde rigor, y no lo pierde.
        veredicto: |
          El módulo restringe los candidatos; la ecuación original los
          selecciona. Son dos pasos distintos y solo el segundo decide.

    resolucion: |
      **Datos.** $z^{3} = -\left\lvert z\right\rvert$.

      ### 1 · Qué dice el enunciado antes de calcular

      El segundo miembro es $-\left\lvert z\right\rvert$: un número **real** y
      **no positivo**. Así que la ecuación exige que $z^{3}$ caiga sobre el
      semieje real negativo, o que sea cero.

      Eso ya limita mucho los argumentos posibles, y conviene decirlo: es la
      lectura que puntúa en COMP1.

      ### 2 · El módulo

      Tomando módulos en los dos miembros, con $r = \left\lvert z\right\rvert \ge 0$:

      $$
      \left\lvert z\right\rvert^{3} = \left\lvert z\right\rvert
      \;\Longrightarrow\;
      r^{3}-r = 0
      \;\Longrightarrow\;
      r\left(r-1\right)\left(r+1\right) = 0
      $$

      $$
      r = 0, \qquad r = 1, \qquad \cancel{r = -1}
      $$

      La tercera se descarta porque **un módulo no es negativo**.

      ### 3 · Caso $r = 0$

      $$
      \boxed{z = 0}
      $$

      Y cumple: $0^{3} = 0 = -\left\lvert0\right\rvert$ ✔

      **Es la solución que se olvida**, porque no aparece al pasar a polar —el
      cero no tiene argumento—.

      ### 4 · Caso $r = 1$

      La ecuación se convierte en

      $$
      z^{3} = -1 = 1\cdot\mathrm{e}^{i\pi}
      $$

      $$
      r^{3} = 1 \Rightarrow r = 1 \ \checkmark
      \qquad
      3\theta = \pi+2k\pi
      \Rightarrow
      \theta = \frac{\pi}{3}+\frac{2k\pi}{3}
      $$

      | $k$ | $\theta$ | forma binómica |
      |---|---|---|
      | 0 | $\frac{\pi}{3} = 60°$ | $\frac12+\frac{\sqrt3}{2}i$ |
      | 1 | $\pi = 180°$ | $-1$ |
      | 2 | $\frac{5\pi}{3} = 300°$ | $\frac12-\frac{\sqrt3}{2}i$ |

      ### 5 · Las cuatro soluciones

      $$
      \boxed{z = 0,
      \quad z = -1,
      \quad z = \frac12+\frac{\sqrt3}{2}i,
      \quad z = \frac12-\frac{\sqrt3}{2}i}
      $$

      <figure class="figura-examen">
      <svg viewBox="0 0 420 420" role="img" width="400" height="400"
           aria-labelledby="f1718c1t f1718c1d">
        <title id="f1718c1t">Las cuatro soluciones</title>
        <desc id="f1718c1d">Tres puntos sobre la circunferencia unidad
        formando un triangulo equilatero, con un vertice sobre el eje real
        negativo, mas un cuarto punto en el origen.</desc>

        <circle cx="210" cy="210" r="140" fill="none" stroke="var(--rule)"
                stroke-width="1.6"></circle>

        <g stroke="var(--graphite)" stroke-width="1.3" fill="none">
          <path d="M40 210 L390 210 M210 40 L210 390"></path>
        </g>

        <g stroke="var(--live)" stroke-width="2.4" fill="none">
          <path d="M280 88.7 L280 331.3 L70 210 Z"></path>
        </g>

        <g fill="var(--flag)">
          <circle cx="280" cy="88.7" r="6"></circle>
          <circle cx="70" cy="210" r="6"></circle>
          <circle cx="280" cy="331.3" r="6"></circle>
        </g>
        <circle cx="210" cy="210" r="6" fill="var(--alt)"></circle>

        <g fill="var(--graphite)" font-size="13" font-family="var(--mono)">
          <text x="368" y="202">Re</text>
          <text x="218" y="54">Im</text>
        </g>
        <g fill="var(--flag)" font-size="12" font-family="var(--mono)">
          <text x="290" y="84">60°</text>
          <text x="44" y="234">-1</text>
          <text x="290" y="344">300°</text>
        </g>
        <g fill="var(--alt)" font-size="12" font-family="var(--mono)">
          <text x="186" y="234">0</text>
        </g>
      </svg>
      <figcaption>
      Figura nuestra: el enunciado pide representar. Los tres puntos rojos son
      las raices cubicas de menos uno, y el violeta es el origen, la cuarta
      solucion.
      </figcaption>
      </figure>

      Un **triángulo equilátero** inscrito en la circunferencia unidad, con un
      vértice en $-1$, más el **origen**.

      ### 6 · Comprobación

      **Con $z = -1$:**

      $$
      (-1)^{3} = -1,
      \qquad
      -\left\lvert-1\right\rvert = -1 \quad\checkmark
      $$

      **Con $z = \frac12+\frac{\sqrt3}{2}i = \mathrm{e}^{i\pi/3}$:**

      $$
      z^{3} = \mathrm{e}^{i\pi} = -1,
      \qquad
      -\left\lvert z\right\rvert = -1 \quad\checkmark
      $$

      **Con $z = 0$:** $0 = 0$ ✔

      **Con un candidato falso,** $z = 1$:

      $$
      1^{3} = 1 \neq -1 = -\left\lvert1\right\rvert
      $$

      No cumple ✔ Su módulo sí valdría 1, pero el argumento no encaja: es la
      prueba de que el módulo por sí solo no basta.

      **De la suma de las tres de módulo 1.** Son las raíces de $z^{3}+1=0$,
      polinomio sin término en $z^{2}$, así que deben sumar 0:

      $$
      \left(\frac12+\frac12-1\right)
      +i\left(\frac{\sqrt3}{2}-\frac{\sqrt3}{2}\right) = 0 \quad\checkmark
      $$

  - id: ex1718-3ev-2-suma-de-la-geometrica
    titulo: Demostrar la suma de la geométrica, y usarla desde el tercer término
    fuente: >-
      Ejercicio 2 · Tercera evaluación, 23 de enero de 2018 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la demostración
      es propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 4
      comp4: 4

    enunciado: |
      Demostrar que el límite de la serie geométrica
      $\displaystyle\sum_{n=0}^{\infty}r^{n}$ es $\dfrac{1}{1-r}$ y, como
      aplicación, obtener el valor de $\displaystyle\sum_{n=3}^{\infty}r^{n}$.
    pide: Demostrar la fórmula y aplicarla.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hipótesis falta en el enunciado y hay que declarar?
        opciones:
          - texto: >-
              Que $\left\lvert r\right\rvert<1$
            correcta: true
            mensaje: |
              Exacto. Sin esa condición la serie **no converge** y la fórmula es
              falsa: con $r=2$ daría $\frac{1}{1-2} = -1$, que es absurdo para
              una suma de términos positivos crecientes.
          - texto: >-
              Que $r>0$
            mensaje: |
              No hace falta: con $r = -\frac12$ la serie converge perfectamente
              y suma $\frac{2}{3}$.
          - texto: >-
              Que $r$ sea racional
            mensaje: |
              La demostración no usa nada de eso; vale incluso para $r$ complejo
              con módulo menor que 1.
          - texto: >-
              Ninguna: la fórmula vale siempre que $r \neq 1$
            mensaje: |
              $r\neq1$ hace falta para que la **fórmula de la suma parcial**
              tenga sentido, pero para el **límite** hace falta más:
              $\left\lvert r\right\rvert<1$.

      - tipo: calcular
        titulo: La suma desde el tercer término
        pregunta: |
          Con $r = \frac12$, ¿cuánto vale
          $\sum_{n=3}^{\infty}r^{n}$? Da cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es la suma **completa**, desde $n=0$. Faltan por quitar los tres
              primeros términos: $1+\frac12+\frac14 = 1{,}75$.
          - valor: '0.125'
            mensaje: |
              $\frac18$ es solo el primer término que se suma, $r^{3}$. La cola
              entera vale el doble.
          - valor: '1.75'
            mensaje: |
              $1{,}75$ es lo que se **quita**, no lo que queda.
        pista: |
          $\sum_{n\ge3}r^{n} = r^{3}\sum_{m\ge0}r^{m}$.
        desarrollo: |
          Sacando $r^{3}$ factor común y reindexando con $m = n-3$:

          $$
          \sum_{n=3}^{\infty}r^{n}
          = r^{3}\sum_{m=0}^{\infty}r^{m}
          = \frac{r^{3}}{1-r}
          $$

          Con $r=\frac12$:

          $$
          \frac{(1/2)^{3}}{1-\frac12} = \frac{1/8}{1/2} = \frac14 = 0{,}25
          $$

          **Y por la otra vía**, restando los tres primeros:

          $$
          2-\left(1+\frac12+\frac14\right) = 2-1{,}75 = 0{,}25 \quad\checkmark
          $$
        veredicto: |
          Las dos vías —sacar factor común o restar el principio— dan lo mismo,
          y una comprueba la otra.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Escribir la suma parcial:**
              $S_N = 1+r+r^{2}+\ldots+r^{N}$.
          - texto: |
              **El truco:** multiplicar por $r$ y restar.
              $S_N-rS_N = 1-r^{N+1}$, porque todos los términos intermedios se
              cancelan.
          - texto: |
              **Despejar**, con $r \neq 1$:
              $S_N = \dfrac{1-r^{N+1}}{1-r}$.
          - texto: |
              **Tomar límite**, y aquí entra la hipótesis: si
              $\left\lvert r\right\rvert<1$ entonces $r^{N+1}\to0$.
          - texto: |
              **Conclusión:**
              $\displaystyle\sum_{n=0}^{\infty}r^{n}
              = \lim_{N\to\infty}S_N = \frac{1}{1-r}$. $\blacksquare$
          - texto: |
              Como el término general $r^{n}$ tiende a 0, la serie converge y la
              fórmula vale.
            trampa: true
            mensaje: |
              Que el término general tienda a 0 es **necesario** para converger,
              pero no suficiente: la serie armónica $\sum\frac1n$ lo cumple y
              diverge. Aquí la convergencia se demuestra calculando la suma
              parcial **exactamente** y tomando su límite, que es un argumento
              mucho más fuerte. Apoyarse en la condición necesaria sería un
              razonamiento inválido, aunque la conclusión resulte cierta.
        veredicto: |
          Este es uno de los pocos casos en que la suma parcial tiene fórmula
          cerrada. Aprovecharla es lo que hace la demostración limpia.

    resolucion: |
      **Lo que se pide.** Demostrar la fórmula y aplicarla a la serie que
      empieza en $n=3$.

      ### 1 · La hipótesis que el enunciado no dice

      El enunciado no lo escribe, pero hace falta:

      $$
      \boxed{\left\lvert r\right\rvert < 1}
      $$

      Sin ella la serie **diverge** y la fórmula da resultados absurdos: con
      $r=2$ saldría $\frac{1}{1-2} = -1$ para una suma de términos positivos
      cada vez mayores.

      Declararlo es parte de la respuesta.

      ### 2 · La demostración

      **Paso 1: la suma parcial.**

      $$
      S_N = \sum_{n=0}^{N}r^{n} = 1+r+r^{2}+\ldots+r^{N}
      $$

      **Paso 2: multiplicar por $r$ y restar.**

      $$
      rS_N = r+r^{2}+\ldots+r^{N}+r^{N+1}
      $$

      $$
      S_N-rS_N = 1-r^{N+1}
      $$

      Todos los términos intermedios se cancelan: es una suma **telescópica**
      disfrazada.

      **Paso 3: despejar**, y aquí hace falta $r\neq1$:

      $$
      S_N\left(1-r\right) = 1-r^{N+1}
      \;\Longrightarrow\;
      S_N = \frac{1-r^{N+1}}{1-r}
      $$

      **Paso 4: tomar límite**, y aquí entra $\left\lvert r\right\rvert<1$:

      $$
      \left\lvert r\right\rvert<1
      \;\Longrightarrow\;
      r^{N+1} \xrightarrow[N\to\infty]{} 0
      $$

      $$
      \boxed{\sum_{n=0}^{\infty}r^{n}
      = \lim_{N\to\infty}\frac{1-r^{N+1}}{1-r} = \frac{1}{1-r}}
      \qquad \blacksquare
      $$

      ### 3 · Por qué esta demostración es fuerte

      No se apoya en ningún criterio de convergencia: **calcula la suma parcial
      exactamente** y toma su límite. Eso demuestra a la vez que la serie
      converge y cuánto vale.

      Sería un error apoyarse en que $r^{n}\to0$: esa es una condición
      **necesaria** para la convergencia, no suficiente —la serie armónica la
      cumple y diverge—.

      ### 4 · Los otros casos, para cerrar

      | $r$ | qué pasa |
      |---|---|
      | $\left\lvert r\right\rvert<1$ | converge a $\frac{1}{1-r}$ |
      | $r=1$ | $S_N = N+1 \to\infty$: diverge |
      | $r=-1$ | $S_N$ alterna entre 1 y 0: no converge |
      | $\left\lvert r\right\rvert>1$ | $r^{N+1}$ no está acotado: diverge |

      ### 5 · La aplicación

      $$
      \sum_{n=3}^{\infty}r^{n} = r^{3}+r^{4}+r^{5}+\ldots
      $$

      **Sacando $r^{3}$ factor común** y reindexando con $m = n-3$:

      $$
      = r^{3}\left(1+r+r^{2}+\ldots\right)
      = r^{3}\sum_{m=0}^{\infty}r^{m}
      $$

      $$
      \boxed{\sum_{n=3}^{\infty}r^{n} = \frac{r^{3}}{1-r},
      \qquad \left\lvert r\right\rvert<1}
      $$

      **Por la otra vía**, restando los tres primeros términos:

      $$
      \frac{1}{1-r}-\left(1+r+r^{2}\right)
      = \frac{1-\left(1+r+r^{2}\right)\left(1-r\right)}{1-r}
      $$

      Y como $\left(1+r+r^{2}\right)\left(1-r\right) = 1-r^{3}$:

      $$
      = \frac{1-\left(1-r^{3}\right)}{1-r} = \frac{r^{3}}{1-r}
      \quad\checkmark
      $$

      Las dos coinciden. La primera es más corta; la segunda comprueba.

      ### 6 · La regla general

      El mismo argumento con cualquier índice de arranque:

      $$
      \sum_{n=k}^{\infty}r^{n} = \frac{r^{k}}{1-r}
      $$

      **Lo único que cambia es el numerador**, y es el primer término que
      efectivamente se suma. Conviene recordarlo así: la suma de una geométrica
      es siempre

      $$
      \frac{\text{primer término}}{1-\text{razón}}
      $$

      ### 7 · Comprobación

      **Con $r = \frac12$:**

      $$
      \sum_{n=0}^{\infty}\left(\tfrac12\right)^{n} = \frac{1}{1-\frac12} = 2
      $$

      Sumando a mano: $1+0{,}5+0{,}25+0{,}125+0{,}0625 = 1{,}9375$, y sigue
      acercándose a 2 ✔

      $$
      \sum_{n=3}^{\infty}\left(\tfrac12\right)^{n} = \frac{1/8}{1/2} = 0{,}25
      $$

      Y en efecto $2-\left(1+0{,}5+0{,}25\right) = 0{,}25$ ✔

      **Con $r = -\frac13$**, para ver que el signo no importa:

      $$
      \sum_{n=0}^{\infty}\left(-\tfrac13\right)^{n}
      = \frac{1}{1+\frac13} = \frac34
      $$

      Sumando: $1-0{,}333+0{,}111-0{,}037+0{,}0123 = 0{,}7531$, oscilando
      alrededor de $0{,}75$ ✔

      $$
      \sum_{n=3}^{\infty}\left(-\tfrac13\right)^{n}
      = \frac{-1/27}{4/3} = -\frac{1}{36} = -0{,}0278
      $$

      Y $0{,}75-\left(1-0{,}3333+0{,}1111\right) = 0{,}75-0{,}7778
      = -0{,}0278$ ✔

  - id: ex1718-3ev-3-definiciones-y-punto-fijo
    titulo: Dos definiciones y un punto fijo
    fuente: >-
      Ejercicio 3 · Tercera evaluación, 23 de enero de 2018 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la demostración
      es propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 0
      comp4: 8

    enunciado: |
      **a)** Definir el límite de una sucesión.

      **b)** Definir el límite de una función en un punto.

      **c)** Demostrar la siguiente propiedad:

      *Si $y = f(x)$ es una función continua en $[a,b]$ tal que
      $f(x) \in [a,b]$, entonces $f(x) = x$ tiene, al menos, una solución en
      $[a,b]$.*

      ¿Cuándo es única esta solución?
    pide: Dar las dos definiciones, demostrar y discutir la unicidad.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué función auxiliar resuelve el apartado (c)?
        opciones:
          - texto: >-
              $g(x) = f(x)-x$, para convertir «$f(x)=x$» en «$g(x)=0$»
            correcta: true
            mensaje: |
              Exacto. Buscar un punto fijo de $f$ es buscar un **cero** de $g$,
              y para los ceros existe el teorema de Bolzano. Ese cambio de
              punto de vista es todo el ejercicio.
          - texto: >-
              $g(x) = f(x)+x$
            mensaje: |
              Con la suma, $g(x)=0$ significaría $f(x)=-x$, que no es lo que se
              busca.
          - texto: >-
              $g(x) = \frac{f(x)}{x}$
            mensaje: |
              El cociente se rompe en $x=0$, que puede estar en $[a,b]$. Y
              buscar dónde vale 1 no da acceso a Bolzano tan directamente.
          - texto: >-
              Ninguna: se aplica Bolzano a $f$ directamente
            mensaje: |
              Bolzano habla de **ceros**, y $f$ no tiene por qué anularse: de
              hecho si $a>0$ nunca lo hace.

      - tipo: calcular
        titulo: Un punto fijo concreto
        pregunta: |
          Con $f(x) = 1+\frac{x}{3}$ en $[1,2]$, ¿cuál es la solución de
          $f(x)=x$?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              $f(1) = \frac43 \neq 1$. El punto fijo está en el interior del
              intervalo.
          - valor: '3'
            mensaje: |
              3 está fuera de $[1,2]$, y además $f(3) = 2 \neq 3$.
          - valor: '1.3333'
            mensaje: |
              $\frac43$ es $f(1)$, la **imagen** del extremo, no el punto fijo.
        pista: |
          Resuelve $x = 1+\frac x3$.
        desarrollo: |
          **Primero, comprobar la hipótesis.** $f$ es creciente, así que

          $$
          f\left([1,2]\right) = \left[f(1),f(2)\right]
          = \left[\tfrac43,\ \tfrac53\right] \subseteq [1,2] \quad\checkmark
          $$

          El teorema se aplica.

          $$
          x = 1+\frac x3
          \;\Longrightarrow\;
          \frac{2x}{3} = 1
          \;\Longrightarrow\;
          x = \frac32
          $$

          **Y es única**, porque $f'(x) = \frac13 < 1$: la función
          $g = f-x$ tiene derivada $-\frac23 < 0$ y solo puede anularse una vez.
        veredicto: |
          Comprobar $f\left([a,b]\right)\subseteq[a,b]$ **antes** de aplicar el
          teorema no es una formalidad: es la hipótesis que lo hace funcionar.

      - tipo: justificar
        pregunta: |
          Ordena la demostración de (c). Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Definir la auxiliar:** $g(x) = f(x)-x$, continua en $[a,b]$ por
              serlo $f$ y la identidad.
          - texto: |
              **En el extremo izquierdo:** como $f(a) \in [a,b]$, se tiene
              $f(a) \ge a$, luego $g(a) = f(a)-a \ge 0$.
          - texto: |
              **En el extremo derecho:** como $f(b) \in [a,b]$, se tiene
              $f(b) \le b$, luego $g(b) = f(b)-b \le 0$.
          - texto: |
              **Los casos fáciles:** si $g(a)=0$ o $g(b)=0$ ya hay solución, y
              es $a$ o $b$.
          - texto: |
              **El caso general:** si no, $g(a)>0>g(b)$, y por el **teorema de
              Bolzano** existe $c \in (a,b)$ con $g(c)=0$, es decir
              $f(c)=c$. $\blacksquare$
          - texto: |
              Como $f$ es continua y $[a,b]$ es cerrado y acotado, $f$ alcanza
              su máximo y su mínimo, y uno de ellos es el punto fijo.
            trampa: true
            mensaje: |
              El teorema de Weierstrass es cierto pero **no dice nada** sobre
              puntos fijos: el máximo de $f$ no tiene por qué cumplir
              $f(x)=x$. Con $f(x) = 1+\frac x3$ en $[1,2]$ el máximo está en
              $x=2$, donde $f(2) = \frac53 \neq 2$, y el punto fijo está en
              $1{,}5$. El teorema que hace falta es **Bolzano**, aplicado a
              $g=f-x$.
        veredicto: |
          Weierstrass da extremos; Bolzano da ceros. Este ejercicio pide un
          cero, así que el teorema es Bolzano.

    resolucion: |
      **Lo que se pide.** Dos definiciones, una demostración y una discusión.
      Ocho de los diez puntos son COMP4.

      ### 1 · Apartado (a): límite de una sucesión

      > Se dice que la sucesión $\{a_n\}_{n\in\mathbb{N}}$ **converge** al
      > número real $L$, y se escribe $\lim_{n\to\infty}a_n = L$, cuando
      >
      > $$
      > \forall \varepsilon>0 \ \ \exists N \in \mathbb{N} \ \text{ tal que }
      > \ \forall n>N: \quad \left\lvert a_n-L\right\rvert < \varepsilon
      > $$

      **En palabras:** por muy estrecha que se fije una banda alrededor de $L$,
      a partir de un término la sucesión entera se queda dentro. El orden de los
      cuantificadores importa: **primero se da $\varepsilon$ y después se
      busca $N$**, que dependerá de él.

      ### 2 · Apartado (b): límite de una función en un punto

      > Sea $f$ definida en un entorno de $c$, salvo quizá en $c$. Se dice que
      > $\lim_{x\to c}f(x) = L$ cuando
      >
      > $$
      > \forall\varepsilon>0 \ \ \exists\delta>0 \ \text{ tal que }
      > \ \forall x \text{ con } 0<\left\lvert x-c\right\rvert<\delta:
      > \quad \left\lvert f(x)-L\right\rvert<\varepsilon
      > $$

      **Dos matices que conviene escribir:**

      - El $0<\left\lvert x-c\right\rvert$ excluye $x=c$: el límite **no depende
        del valor de $f$ en el punto**, ni de que esté definida allí.
      - La **continuidad** en $c$ es un caso particular: que el límite exista,
        que $f(c)$ exista, y que coincidan.

      ### 3 · Apartado (c): el teorema del punto fijo

      **Idea.** Buscar un $x$ con $f(x)=x$ es buscar un **cero** de

      $$
      g(x) = f(x)-x
      $$

      y para los ceros hay un teorema: **Bolzano**.

      **Hipótesis que se usan:**

      - $f$ es continua en $[a,b]$ ⟹ $g$ también, por ser diferencia de
        continuas.
      - $f(x) \in [a,b]$ para todo $x$ ⟹ en particular en los extremos.

      **En el extremo izquierdo.** $f(a) \in [a,b]$ implica $f(a) \ge a$:

      $$
      g(a) = f(a)-a \ge 0
      $$

      **En el extremo derecho.** $f(b) \in [a,b]$ implica $f(b) \le b$:

      $$
      g(b) = f(b)-b \le 0
      $$

      **Dos casos:**

      - Si $g(a) = 0$, entonces $f(a)=a$ y la solución es $x=a$. Igual si
        $g(b)=0$.
      - Si no, $g(a)>0>g(b)$. Como $g$ es continua en $[a,b]$, el **teorema de
        Bolzano** da un $c \in (a,b)$ con $g(c)=0$, es decir

      $$
      \boxed{f(c) = c} \qquad \blacksquare
      $$

      **Los dos casos fáciles hay que mencionarlos**: Bolzano en su forma
      estricta pide signos **opuestos**, y aquí las desigualdades son amplias.

      ### 4 · La interpretación gráfica

      La condición $f\left([a,b]\right)\subseteq[a,b]$ dice que **la gráfica de
      $f$ está encerrada en el cuadrado** $[a,b]\times[a,b]$. Y un punto fijo es
      un corte con la diagonal de ese cuadrado.

      Una curva continua que entra por el lado izquierdo y sale por el derecho
      sin salirse del cuadrado **tiene que cruzar la diagonal**. Eso es el
      teorema, dicho en dibujo.

      <figure class="figura-examen">
      <svg viewBox="0 0 380 380" role="img" width="360" height="360"
           aria-labelledby="f1718c3t f1718c3d">
        <title id="f1718c3t">El cuadrado y la diagonal</title>
        <desc id="f1718c3d">Un cuadrado de lado a hasta b con su diagonal. Una
        curva continua entra por el lado izquierdo y sale por el derecho sin
        salirse del cuadrado, y por fuerza corta a la diagonal en un punto.</desc>

        <rect x="60" y="60" width="260" height="260" fill="var(--live)"
              fill-opacity="0.07" stroke="var(--rule)"
              stroke-width="1.6"></rect>

        <g stroke="var(--graphite)" stroke-width="1.3" fill="none">
          <path d="M30 340 L360 340 M40 30 L40 355"></path>
        </g>

        <g stroke="var(--alt)" stroke-width="2" stroke-dasharray="8 6"
           fill="none">
          <path d="M60 320 L320 60"></path>
        </g>

        <g stroke="var(--ink)" stroke-width="2.8" fill="none"
           stroke-linecap="round">
          <path d="M60 130 C 140 250, 200 90, 320 250"></path>
        </g>

        <g fill="var(--flag)">
          <circle cx="97" cy="283" r="6"></circle>
          <circle cx="176" cy="204" r="6"></circle>
          <circle cx="255" cy="125" r="6"></circle>
        </g>

        <g fill="var(--graphite)" font-size="13" font-family="var(--mono)">
          <text x="54" y="358">a</text>
          <text x="314" y="358">b</text>
          <text x="24" y="326">a</text>
          <text x="24" y="66">b</text>
        </g>
        <g fill="var(--alt)" font-size="12" font-family="var(--mono)">
          <text x="286" y="52">y = x</text>
        </g>
        <g fill="var(--ink)" font-size="12" font-family="var(--mono)">
          <text x="66" y="118">f</text>
        </g>
      </svg>
      <figcaption>
      Figura nuestra, para acompanar la demostracion. La grafica de f no puede
      salirse del cuadrado, asi que corta a la diagonal: cada corte es un punto
      fijo. Aqui hay tres, porque f no es monotona.
      </figcaption>
      </figure>

      ### 5 · Cuándo es única

      El teorema garantiza **al menos una**. Para que sea única basta que $g$
      sea **estrictamente monótona**, y hay tres condiciones suficientes, de más
      débil a más fuerte:

      | condición sobre $f$ | por qué basta |
      |---|---|
      | $f$ **decreciente** | $g = f-x$ es estrictamente decreciente |
      | $f$ derivable con $f'(x)<1$ en $(a,b)$ | $g' = f'-1 < 0$ |
      | $f$ **contractiva**: $\left\lvert f(x)-f(y)\right\rvert \le k\left\lvert x-y\right\rvert$ con $k<1$ | no necesita derivada |

      La segunda es la más usada, y se demuestra en una línea: si $g'<0$ en todo
      el intervalo, $g$ es estrictamente decreciente y no puede anularse dos
      veces.

      **Y sin esa condición la unicidad falla.** Con $f(x) = \sqrt x$ en
      $[0,1]$:

      - es continua y $f\left([0,1]\right) = [0,1]$ ✔ el teorema se aplica;
      - pero hay **dos** puntos fijos, $x=0$ y $x=1$.

      La razón: $f'(x) = \frac{1}{2\sqrt x}$ se dispara cerca de 0, así que no
      cumple $f'<1$ en todo el intervalo.

      ### 6 · Comprobación con un caso concreto

      $f(x) = 1+\frac x3$ en $[1,2]$:

      **La hipótesis:** $f$ es creciente, así que

      $$
      f\left([1,2]\right) = \left[\tfrac43,\tfrac53\right] \subseteq [1,2]
      \quad\checkmark
      $$

      **La solución:**

      $$
      x = 1+\frac x3
      \;\Longrightarrow\;
      x = \frac32
      $$

      que está en $(1,2)$ ✔

      **La unicidad:** $f' = \frac13 < 1$, luego $g' = -\frac23 < 0$ y el cero
      es único ✔

      **Y con los extremos:** $g(1) = \frac43-1 = \frac13 > 0$ y
      $g(2) = \frac53-2 = -\frac13 < 0$: signos opuestos, como pedía Bolzano ✔

  - id: ex1718-3ev-4-serie-del-logaritmo-y-la-armonica
    titulo: La serie que suma la armónica alternada
    fuente: >-
      Ejercicio 4 · Tercera evaluación, 23 de enero de 2018 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3

    enunciado: |
      **a)** Hallar el desarrollo en serie de la función $y = \ln(2-x)$ en el
      punto $a=1$.

      **b)** Teniendo en cuenta el resultado del apartado anterior, calcular el
      valor de la siguiente suma:
      $S = 1-\dfrac12+\dfrac13-\dfrac14+\dfrac15-\ldots$
    pide: Hallar la serie y sumar la serie numérica.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se centra el desarrollo en $a=1$?
        opciones:
          - texto: >-
              Escribiendo $2-x = 1-(x-1)$ y usando la serie de $\ln(1-u)$ con
              $u = x-1$
            correcta: true
            mensaje: |
              Exacto. La serie del logaritmo se conoce centrada en 0; el cambio
              $u = x-1$ traslada el centro a $a=1$ sin tener que derivar nada.
          - texto: >-
              Derivando $\ln(2-x)$ una y otra vez en $x=1$
            mensaje: |
              Funciona —las derivadas son $\frac{-(n-1)!}{(2-x)^{n}}$— pero es
              el camino largo. La sustitución da el término general de golpe.
          - texto: >-
              Usando la serie de $\ln(1+x)$ con $x$ cambiado de signo
            mensaje: |
              Eso centra en 0, no en 1. Falta la traslación.
          - texto: >-
              Desarrollando $\frac{1}{2-x}$ e integrando
            mensaje: |
              Es una vía válida, y de hecho elegante, pero también hay que
              trasladar el centro. La sustitución directa es más corta.

      - tipo: calcular
        titulo: El coeficiente general
        pregunta: |
          En el desarrollo $\sum c_n(x-1)^{n}$, ¿cuánto vale $c_4$? Da cuatro
          decimales.
        respuesta:
          tipo: numero
          valor: '-0.25'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0.25'
            mensaje: |
              Falta el signo. Todos los coeficientes de este desarrollo son
              **negativos**: $\ln(1-u) = -\sum\frac{u^{n}}{n}$.
          - valor: '-0.0417'
            mensaje: |
              $-\frac{1}{24} = -\frac{1}{4!}$ llevaría factorial. La serie del
              logaritmo tiene denominadores $n$, no $n!$.
          - valor: '-0.2'
            mensaje: |
              $-\frac15$ es $c_5$. El de grado 4 lleva denominador 4.
        pista: |
          $\ln(1-u) = -u-\frac{u^{2}}{2}-\frac{u^{3}}{3}-\ldots$
        desarrollo: |
          Con $u = x-1$:

          $$
          \ln(2-x) = \ln\left(1-(x-1)\right) = \ln(1-u)
          $$

          $$
          \ln(1-u) = -\sum_{n=1}^{\infty}\frac{u^{n}}{n}
          $$

          $$
          \boxed{\ln(2-x) = -\sum_{n=1}^{\infty}\frac{(x-1)^{n}}{n}}
          $$

          $$
          c_4 = -\frac14 = -0{,}25
          $$

          **Todos los coeficientes son negativos**, sin alternancia.
        veredicto: |
          El desarrollo vale para $\left\lvert u\right\rvert<1$, es decir para
          $0<x<2$. Fuera de ahí no dice nada — y eso importa en el apartado (b).

      - tipo: calcular
        titulo: La suma pedida
        pregunta: |
          ¿Cuánto vale $S = 1-\frac12+\frac13-\frac14+\ldots$? Da cuatro
          decimales.
        respuesta:
          tipo: numero
          valor: '0.6931'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es el primer término. La serie converge, pero a un valor menor:
              el segundo término ya le resta medio.
          - valor: '1.0986'
            mensaje: |
              $\ln3$ saldría de evaluar en $x=-1$, que está **fuera** del
              intervalo de convergencia $(0,2)$.
          - valor: '0.5'
            mensaje: |
              $0{,}5$ es la suma de los dos primeros términos. La serie sigue
              subiendo y bajando hasta $0{,}693$.
        pista: |
          ¿En qué $x$ hay que evaluar el desarrollo para que
          $-\frac{(x-1)^{n}}{n}$ dé $\frac{(-1)^{n+1}}{n}$?
        desarrollo: |
          Se busca el $x$ que convierte los términos en los de $S$:

          $$
          -\frac{(x-1)^{n}}{n} = \frac{(-1)^{n+1}}{n}
          \;\Longleftrightarrow\;
          (x-1)^{n} = (-1)^{n}
          \;\Longleftrightarrow\;
          x-1 = -1
          $$

          es decir **$x = 0$**. Y entonces:

          $$
          S = \ln(2-0) = \ln2 \approx 0{,}6931
          $$
        veredicto: |
          $x=0$ es el **extremo** del intervalo de convergencia, y ahí la
          igualdad no es automática: hace falta el teorema de Abel. Es el punto
          fino del ejercicio.

      - tipo: justificar
        pregunta: |
          Ordena el apartado (b). Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Identificar el punto.** Los términos de $S$ son
              $\frac{(-1)^{n+1}}{n}$, y el desarrollo da
              $-\frac{(x-1)^{n}}{n}$: coinciden con $x=0$.
          - texto: |
              **Pero $x=0$ es el extremo** del intervalo de convergencia
              $(0,2)$: el radio es 1 y el centro es 1.
          - texto: |
              **Comprobar que la serie converge ahí:** en $x=0$ queda
              $\sum\frac{(-1)^{n+1}}{n}$, que converge por el **criterio de
              Leibniz** —términos decrecientes en valor absoluto y con límite
              cero—.
          - texto: |
              **Y que la suma es la que se espera:** por el **teorema de Abel**,
              si una serie de potencias converge en un extremo, su suma ahí es
              el límite de la función.
          - texto: |
              **Conclusión:** $S = \ln(2-0) = \ln2 \approx 0{,}6931$.
          - texto: |
              Como el desarrollo vale en $(0,2)$ y $x=0$ está en el borde, basta
              con sustituir directamente.
            trampa: true
            mensaje: |
              Sustituir en el borde **no es automático**: una serie de potencias
              puede converger en un extremo a algo distinto del límite de la
              función, o no converger en absoluto. Lo que legitima el paso es el
              **teorema de Abel**, y citarlo es exactamente lo que separa una
              respuesta de 7 de una de 10. En el otro extremo, $x=2$, la serie
              es $-\sum\frac1n$ y diverge: la prueba de que los bordes no se
              comportan solos.
        veredicto: |
          Los dos extremos del intervalo se comportan de forma opuesta: en $x=0$
          converge y en $x=2$ diverge. Por eso hay que mirarlos uno a uno.

    resolucion: |
      **Datos.** $y = \ln(2-x)$, desarrollo en $a=1$, y la serie armónica
      alternada.

      ### 1 · Apartado (a): trasladar el centro

      El desarrollo se pide en $a=1$, así que conviene escribirlo todo en
      $u = x-1$:

      $$
      2-x = 1-(x-1) = 1-u
      $$

      Y la serie de $\ln(1-u)$ es conocida:

      $$
      \ln(1-u) = -\sum_{n=1}^{\infty}\frac{u^{n}}{n}
      = -u-\frac{u^{2}}{2}-\frac{u^{3}}{3}-\ldots,
      \qquad \left\lvert u\right\rvert<1
      $$

      Deshaciendo el cambio:

      $$
      \boxed{\ln(2-x) = -\sum_{n=1}^{\infty}\frac{(x-1)^{n}}{n}}
      $$

      $$
      = -(x-1)-\frac{(x-1)^{2}}{2}-\frac{(x-1)^{3}}{3}-\ldots
      $$

      **Todos los coeficientes son negativos**, sin alternancia. Tiene sentido:
      cerca de $x=1$ la función vale $\ln1=0$ y **decrece** al aumentar $x$.

      **Dónde vale:** $\left\lvert x-1\right\rvert<1$, es decir

      $$
      0 < x < 2
      $$

      El radio de convergencia es 1 y el centro es 1.

      ### 2 · Comprobación de (a)

      **Derivando la serie término a término:**

      $$
      -\sum_{n\ge1}(x-1)^{n-1} = -\frac{1}{1-(x-1)} = \frac{-1}{2-x}
      $$

      —suma de una geométrica de razón $x-1$—. Y derivando la función:

      $$
      \frac{d}{dx}\ln(2-x) = \frac{-1}{2-x} \quad\checkmark
      $$

      **Numéricamente**, en $x = 1{,}5$:

      $$
      -\left(0{,}5+\frac{0{,}25}{2}+\frac{0{,}125}{3}+\frac{0{,}0625}{4}\right)
      = -0{,}6823
      $$

      $$
      \ln(0{,}5) = -0{,}6931
      $$

      Va convergiendo, aunque despacio: $x=1{,}5$ está a media distancia del
      borde ✔

      ### 3 · Apartado (b): encontrar el punto

      Los términos de $S$ son

      $$
      1,\ -\frac12,\ +\frac13,\ -\frac14,\ \ldots
      \;\Longrightarrow\;
      \frac{(-1)^{n+1}}{n}
      $$

      Y los del desarrollo, $-\frac{(x-1)^{n}}{n}$. Igualándolos:

      $$
      -(x-1)^{n} = (-1)^{n+1}
      \;\Longleftrightarrow\;
      (x-1)^{n} = (-1)^{n}
      \;\Longleftrightarrow\;
      x-1 = -1
      $$

      $$
      \boxed{x = 0}
      $$

      ### 4 · El punto fino: $x=0$ está en el borde

      El intervalo de convergencia es $(0,2)$, **abierto**. El punto $x=0$ es
      justo el extremo izquierdo, así que sustituir no es automático. Hay que
      dar dos pasos:

      **Primero, que la serie converge ahí.** En $x=0$ queda

      $$
      -\sum_{n\ge1}\frac{(-1)^{n}}{n} = \sum_{n\ge1}\frac{(-1)^{n+1}}{n}
      $$

      que es la **armónica alternada**, y converge por el **criterio de
      Leibniz**: los valores absolutos $\frac1n$ decrecen y tienden a 0.

      —Converge, eso sí, solo **condicionalmente**: la serie de los valores
      absolutos es la armónica, que diverge—.

      **Segundo, que su suma es el valor de la función.** Eso lo da el
      **teorema de Abel**:

      > Si una serie de potencias converge en un extremo de su intervalo de
      > convergencia, su suma allí coincide con el límite de la función desde
      > dentro.

      $$
      S = \lim_{x\to0^{+}}\ln(2-x) = \ln2
      $$

      $$
      \boxed{S = \ln2 \approx 0{,}6931}
      $$

      ### 5 · El otro extremo, para ver que importa

      En $x=2$ la serie es

      $$
      -\sum_{n\ge1}\frac{1^{n}}{n} = -\sum_{n\ge1}\frac1n
      $$

      la **armónica**, que **diverge**. Y coincide con que
      $\ln(2-x) \to -\infty$ cuando $x\to2^{-}$.

      Los dos extremos se comportan de forma opuesta, y por eso hay que
      estudiarlos uno a uno: no hay regla que los cubra a la vez.

      ### 6 · Comprobación de (b)

      **Sumando términos de $S$:**

      | términos | suma parcial |
      |---|---|
      | 2 | $0{,}5000$ |
      | 4 | $0{,}5833$ |
      | 10 | $0{,}6456$ |
      | 100 | $0{,}6882$ |
      | 1000 | $0{,}6926$ |

      Tiende a $\ln2 = 0{,}69315$ ✔ Muy despacio, como corresponde a una serie
      que converge solo condicionalmente: el error va como $\frac{1}{2N}$.

      **Y las sumas parciales alternan** por encima y por debajo del límite
      —$1$, $0{,}5$, $0{,}833$, $0{,}583$…—, que es el comportamiento típico de
      una serie de Leibniz ✔

      **De coherencia con (a).** El apartado (a) evaluado en $x=0$ da
      $\ln2$, y $\ln2$ es efectivamente el valor de la función ahí:
      $\ln(2-0) = \ln2$ ✔

  - id: ex1718-3ev-5-parabola-recta-y-eje
    titulo: Un recinto entre parábola, recta y eje, con sus dos volúmenes
    fuente: >-
      Ejercicio 5 · Tercera evaluación, 23 de enero de 2018 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 6
      comp4: 4

    enunciado: |
      Sea $D$ el recinto limitado por las condiciones $y \ge x^{2}$,
      $y \le 6-x$, $x \ge 0$.

      **a)** Representar gráficamente el recinto $D$.

      **b)** Calcular el área de $D$.

      **c)** Plantear el volumen del cuerpo generado al girar el recinto $D$
      alrededor del eje OX.

      **d)** Plantear el volumen del cuerpo generado al girar el recinto $D$
      alrededor del eje OY.
    pide: Representar, calcular el área y plantear los dos volúmenes.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuáles son los tres bordes del recinto?
        opciones:
          - texto: >-
              La parábola por abajo, la recta por arriba y el **eje $OY$** por
              la izquierda
            correcta: true
            mensaje: |
              Exacto. La condición $x\ge0$ no es decorativa: sin ella el recinto
              se extendería hasta $x=-3$, el otro corte de la parábola con la
              recta.
          - texto: >-
              La parábola, la recta y el eje $OX$
            mensaje: |
              El eje horizontal no interviene: la condición es $x\ge0$, que es
              el eje **vertical**.
          - texto: >-
              Solo la parábola y la recta
            mensaje: |
              Con solo esas dos el recinto llegaría hasta $x=-3$. El $x\ge0$ lo
              corta.
          - texto: >-
              La parábola y las dos rectas $y=6-x$ y $y=0$
            mensaje: |
              $y=0$ no aparece en el enunciado, y el recinto no la toca salvo en
              el origen.

      - tipo: calcular
        titulo: El corte entre la parábola y la recta
        pregunta: |
          ¿En qué abscisa se cortan, dentro de la región $x\ge0$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '-3'
            mensaje: |
              $-3$ es el otro corte, y hay que descartarlo por la condición
              $x\ge0$. Es justamente el papel de esa tercera condición.
          - valor: '4'
            mensaje: |
              4 es la **ordenada** del punto de corte, no su abscisa. El punto
              es $(2,4)$.
          - valor: '6'
            mensaje: |
              6 es donde la recta corta al eje $OY$, no donde toca a la
              parábola.
        pista: |
          $x^{2} = 6-x$.
        desarrollo: |
          $$
          x^{2} = 6-x
          \;\Longrightarrow\;
          x^{2}+x-6 = 0
          \;\Longrightarrow\;
          (x+3)(x-2) = 0
          $$

          $$
          x = -3 \ \text{ó}\ x = 2
          $$

          La condición $x\ge0$ descarta $x=-3$. Queda

          $$
          (2,\,4)
          $$
        veredicto: |
          El $x\ge0$ del enunciado está puesto exactamente para quedarse con una
          de las dos ramas. Sin él el recinto sería otro.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuál es el área de $D$? Da cuatro decimales.
        respuesta:
          tipo: numero
          valor: '7.3333'
          tolerancia: 0.0008
          formato: un número
        distractores:
          - valor: '2.6667'
            mensaje: |
              $\frac83$ es $\int_0^{2}x^{2}dx$, el área bajo la parábola. Hay
              que restarla de la que hay bajo la recta, no darla como
              resultado.
          - valor: '10'
            mensaje: |
              10 es $\int_0^{2}(6-x)dx$, el área bajo la recta. Falta quitar la
              de la parábola.
          - valor: '20.8333'
            mensaje: |
              $\frac{125}{6}$ es el área del recinto **completo**, desde
              $x=-3$: es lo que saldría ignorando la condición $x\ge0$.
        pista: |
          $\int_0^{2}\left[(6-x)-x^{2}\right]dx$.
        desarrollo: |
          $$
          A = \int_0^{2}\left[\left(6-x\right)-x^{2}\right]dx
          $$

          $$
          = \left[6x-\frac{x^{2}}{2}-\frac{x^{3}}{3}\right]_0^{2}
          = 12-2-\frac83
          $$

          $$
          = 10-\frac83 = \frac{22}{3} \approx 7{,}3333
          $$
        veredicto: |
          Comprobación rápida: el recinto cabe en el rectángulo
          $[0,2]\times[0,6]$, de área 12, y ocupa el 61 %. Razonable a la vista
          de la figura.

      - tipo: justificar
        pregunta: |
          Ordena el planteamiento de los dos volúmenes. Una de las piezas no
          debe entrar.
        piezas:
          - texto: |
              **Girando sobre $OX$**, el eje es horizontal y el recinto está por
              encima de él: cada corte vertical barre una **corona**, con radio
              exterior $6-x$ e interior $x^{2}$.
          - texto: |
              $V_{OX} = \pi\displaystyle\int_0^{2}
              \left[\left(6-x\right)^{2}-x^{4}\right]dx$.
          - texto: |
              **Girando sobre $OY$**, el eje es vertical y el recinto se
              describe cómodamente en $x$: conviene el método de las **capas**.
          - texto: |
              $V_{OY} = 2\pi\displaystyle\int_0^{2}
              x\left[\left(6-x\right)-x^{2}\right]dx$.
          - texto: |
              **Por qué capas y no discos:** integrando en $y$ habría que
              **partir en $y=4$**, porque por debajo el borde izquierdo es el
              eje $OY$ y por encima pasa a ser la parábola.
          - texto: |
              Girando sobre $OY$ también hay que usar coronas, porque el recinto
              no toca el eje de giro.
            trampa: true
            mensaje: |
              Sí lo toca: la condición $x\ge0$ hace que el borde izquierdo del
              recinto **sea** el eje $OY$, en el segmento de $(0,0)$ a $(0,6)$.
              Al girar sobre él, el sólido es **macizo**: no hay hueco. Y esa es
              justamente la razón de que las capas funcionen sin restar nada.
        veredicto: |
          Elegir capas o discos no es cuestión de gusto: se elige el que **no
          obligue a partir la integral**. Aquí, capas.

    resolucion: |
      **Datos.** $y \ge x^{2}$, $y \le 6-x$, $x \ge 0$.

      ### 1 · Apartado (a): los tres bordes

      | condición | borde |
      |---|---|
      | $y \ge x^{2}$ | por **encima** de la parábola |
      | $y \le 6-x$ | por **debajo** de la recta |
      | $x \ge 0$ | a la **derecha** del eje $OY$ |

      **El corte de la parábola con la recta:**

      $$
      x^{2} = 6-x
      \;\Longrightarrow\;
      x^{2}+x-6 = 0
      \;\Longrightarrow\;
      x = 2 \ \text{ó}\ x = -3
      $$

      La condición $x\ge0$ **descarta $x=-3$**, y ese es justamente su papel:
      sin ella el recinto llegaría hasta $(-3,9)$.

      Los tres vértices del recinto son

      $$
      (0,0), \qquad (0,6), \qquad (2,4)
      $$

      <figure class="figura-examen">
      <svg viewBox="0 0 460 420" role="img" width="440" height="402"
           aria-labelledby="f1718c5t f1718c5d">
        <title id="f1718c5t">El recinto D</title>
        <desc id="f1718c5d">Una parabola que sube desde el origen y una recta
        que baja desde el punto cero coma seis; se cortan en el punto dos coma
        cuatro. El recinto sombreado queda entre las dos y a la derecha del eje
        vertical.</desc>

        <path d="M80 360 L80 60 L280 160 Q 180 260, 80 360 Z"
              fill="var(--live)" fill-opacity="0.15" stroke="none"></path>

        <g stroke="var(--rule)" stroke-width="1" fill="none">
          <path d="M180 40 L180 380 M280 40 L280 380 M380 40 L380 380
                   M40 260 L440 260 M40 160 L440 160 M40 60 L440 60"></path>
        </g>

        <g stroke="var(--graphite)" stroke-width="1.3" fill="none">
          <path d="M40 360 L440 360 M80 30 L80 390"></path>
        </g>

        <g stroke="var(--ink)" stroke-width="2.8" fill="none">
          <path d="M80 360 Q 180 360, 280 160"></path>
        </g>
        <g stroke="var(--flag)" stroke-width="2.6" fill="none">
          <path d="M80 60 L380 210"></path>
        </g>

        <g fill="var(--alt)">
          <circle cx="280" cy="160" r="6"></circle>
        </g>
        <g fill="var(--graphite)">
          <circle cx="80" cy="60" r="4.5"></circle>
          <circle cx="80" cy="360" r="4.5"></circle>
        </g>

        <g fill="var(--graphite)" font-size="13" font-family="var(--mono)">
          <text x="56" y="380">0</text>
          <text x="176" y="380">1</text>
          <text x="276" y="380">2</text>
          <text x="376" y="380">3</text>
          <text x="56" y="264">2</text>
          <text x="56" y="164">4</text>
          <text x="56" y="64">6</text>
          <text x="418" y="352">x</text>
        </g>
        <g fill="var(--alt)" font-size="12" font-family="var(--mono)">
          <text x="290" y="156">(2,4)</text>
        </g>
        <g fill="var(--ink)" font-size="12" font-family="var(--mono)">
          <text x="196" y="330">y=x²</text>
        </g>
        <g fill="var(--flag)" font-size="12" font-family="var(--mono)">
          <text x="330" y="196">y=6-x</text>
        </g>
      </svg>
      <figcaption>
      Figura nuestra: el enunciado pide representarla. En negro la parabola, en
      rojo la recta, y sombreado el recinto, que se apoya en el eje vertical
      entre el origen y el punto cero coma seis.
      </figcaption>
      </figure>

      ### 2 · Apartado (b): el área

      Integrando en $x$, de 0 a 2, entre la recta y la parábola:

      $$
      A = \int_0^{2}\left[\left(6-x\right)-x^{2}\right]dx
      = \left[6x-\frac{x^{2}}{2}-\frac{x^{3}}{3}\right]_0^{2}
      $$

      $$
      = 12-2-\frac83
      $$

      $$
      \boxed{A = \frac{22}{3} \approx 7{,}3333}
      $$

      ### 3 · Apartado (c): girar sobre OX

      El eje de giro es **horizontal** y el recinto está por encima de él, sin
      tocarlo salvo en el origen. Cada corte vertical barre una **corona**:

      | radio | vale |
      |---|---|
      | exterior | $6-x$ (la recta, que va por arriba) |
      | interior | $x^{2}$ (la parábola) |

      $$
      \boxed{V_{OX} = \pi\int_0^{2}
      \left[\left(6-x\right)^{2}-\left(x^{2}\right)^{2}\right]dx
      = \pi\int_0^{2}\left[\left(6-x\right)^{2}-x^{4}\right]dx}
      $$

      El enunciado solo pide **plantearlo**, pero sale rápido:

      $$
      \int_0^{2}(6-x)^{2}dx = \left[\frac{-(6-x)^{3}}{3}\right]_0^{2}
      = -\frac{64}{3}+72 = \frac{152}{3}
      $$

      $$
      \int_0^{2}x^{4}dx = \frac{32}{5}
      $$

      $$
      V_{OX} = \pi\left(\frac{152}{3}-\frac{32}{5}\right)
      = \frac{664\pi}{15} \approx 139{,}06
      $$

      ### 4 · Apartado (d): girar sobre OY

      El eje de giro es **vertical**. Y aquí conviene el método de las
      **capas**, no el de discos:

      $$
      \boxed{V_{OY} = 2\pi\int_0^{2}
      x\left[\left(6-x\right)-x^{2}\right]dx}
      $$

      **Por qué capas.** Integrando en $y$ habría que **partir en $y=4$**:

      | tramo | radio exterior | radio interior |
      |---|---|---|
      | $0 \le y \le 4$ | $\sqrt y$ (la parábola) | $0$ (el eje) |
      | $4 \le y \le 6$ | $6-y$ (la recta) | $0$ |

      Dos integrales en vez de una. Las capas evitan el corte porque el recinto
      se describe sin partir en la variable $x$.

      **No hay hueco:** el borde izquierdo del recinto **es** el eje $OY$, así
      que el sólido es macizo.

      Calculándolo:

      $$
      V_{OY} = 2\pi\int_0^{2}\left(6x-x^{2}-x^{3}\right)dx
      = 2\pi\left[3x^{2}-\frac{x^{3}}{3}-\frac{x^{4}}{4}\right]_0^{2}
      $$

      $$
      = 2\pi\left[12-\frac83-4\right] = 2\pi\cdot\frac{16}{3}
      = \frac{32\pi}{3} \approx 33{,}51
      $$

      ### 5 · Comprobación

      **Del punto de corte.** $(2,4)$: en la parábola $2^{2}=4$ ✔ en la recta
      $6-2 = 4$ ✔

      **Del área, por acotación.** El recinto cabe en el rectángulo
      $[0,2]\times[0,6]$, de área 12, y contiene el triángulo de vértices
      $(0,0)$, $(0,6)$, $(2,4)$, de área

      $$
      \frac{6\cdot2}{2} = 6
      $$

      $$
      6 < 7{,}33 < 12 \quad\checkmark
      $$

      **De $V_{OY}$ por la vía de los discos**, partiendo en $y=4$:

      $$
      \pi\int_0^{4}y\,dy+\pi\int_4^{6}\left(6-y\right)^{2}dy
      = \pi\cdot8+\pi\left[\frac{-(6-y)^{3}}{3}\right]_4^{6}
      $$

      $$
      = 8\pi+\pi\cdot\frac83 = \frac{24\pi+8\pi}{3} = \frac{32\pi}{3}
      \quad\checkmark
      $$

      Coincide con las capas, y de paso enseña por qué el enunciado dice
      «plantear»: los dos caminos existen y hay que elegir.

      **De $V_{OX}$ por acotación.** El sólido cabe dentro del cilindro de radio
      6 y longitud 2 —$\pi\cdot36\cdot2 = 72\pi \approx 226$— y $139$ es el
      61 % de eso ✔ Coherente con que la corona se estreche hacia la derecha.

  - id: ex1718-3ev-6-integral-con-tangente
    titulo: Una integral con el cambio ya dado
    fuente: >-
      Ejercicio 6 · Tercera evaluación, 23 de enero de 2018 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 9
      comp4: 1

    enunciado: |
      Calcular la integral
      $\displaystyle\int\frac{dx}{\mathrm{tg}^{2}x+3\,\mathrm{sen}^{2}x}$
      haciendo el cambio de variable $\mathrm{tg}\,x = t$.
    pide: Calcular la integral con el cambio indicado.

    pasos:
      - tipo: reconocer
        pregunta: |
          Con $t = \mathrm{tg}\,x$, ¿cuánto valen $\mathrm{sen}^{2}x$ y $dx$?
        opciones:
          - texto: >-
              $\mathrm{sen}^{2}x = \dfrac{t^{2}}{1+t^{2}}$ y
              $dx = \dfrac{dt}{1+t^{2}}$
            correcta: true
            mensaje: |
              Exacto. Las dos salen del triángulo de catetos $t$ y 1, con
              hipotenusa $\sqrt{1+t^{2}}$. Conviene tenerlas escritas antes de
              empezar: son la mitad del ejercicio.
          - texto: >-
              $\mathrm{sen}^{2}x = t^{2}$ y $dx = dt$
            mensaje: |
              Eso sería si $t$ fuera el propio seno. Con la tangente hay que
              pasar por la hipotenusa.
          - texto: >-
              $\mathrm{sen}^{2}x = \dfrac{1}{1+t^{2}}$ y $dx = dt$
            mensaje: |
              $\frac{1}{1+t^{2}}$ es $\cos^{2}x$, no el seno al cuadrado. Y el
              diferencial también cambia.
          - texto: >-
              $\mathrm{sen}^{2}x = \dfrac{t^{2}}{1+t^{2}}$ y $dx = (1+t^{2})dt$
            mensaje: |
              El $1+t^{2}$ va **dividiendo**: de $t = \tan x$ sale
              $dt = \sec^{2}x\,dx = (1+t^{2})dx$, luego
              $dx = \frac{dt}{1+t^{2}}$.

      - tipo: calcular
        titulo: El denominador tras el cambio
        pregunta: |
          Tras sustituir y simplificar, la integral queda
          $\int\frac{dt}{t^{2}\left(t^{2}+k\right)}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              3 es el coeficiente del enunciado, pero al sumar
              $t^{2}+\frac{3t^{2}}{1+t^{2}}$ aparece $1+t^{2}+3 = t^{2}+4$.
          - valor: '1'
            mensaje: |
              1 es el $1+t^{2}$ de las fórmulas del cambio. Falta sumarle el 3.
          - valor: '9'
            mensaje: |
              9 saldría de elevar el 3 al cuadrado. No hay ningún cuadrado que
              hacer.
        pista: |
          $\mathrm{tg}^{2}x+3\,\mathrm{sen}^{2}x
          = t^{2}+\frac{3t^{2}}{1+t^{2}}$. Saca $t^{2}$ factor común.
        desarrollo: |
          $$
          \mathrm{tg}^{2}x+3\,\mathrm{sen}^{2}x
          = t^{2}+\frac{3t^{2}}{1+t^{2}}
          = t^{2}\left(1+\frac{3}{1+t^{2}}\right)
          = t^{2}\cdot\frac{t^{2}+4}{1+t^{2}}
          $$

          Y con $dx = \frac{dt}{1+t^{2}}$:

          $$
          \int\frac{dx}{\mathrm{tg}^{2}x+3\,\mathrm{sen}^{2}x}
          = \int\frac{1+t^{2}}{t^{2}\left(t^{2}+4\right)}
          \cdot\frac{dt}{1+t^{2}}
          = \int\frac{dt}{t^{2}\left(t^{2}+4\right)}
          $$

          **El $1+t^{2}$ se cancela entero.** Luego $k=4$.
        veredicto: |
          Que el $1+t^{2}$ del diferencial se cancele con el que aparece al
          simplificar es la señal de que el cambio indicado era el bueno.

      - tipo: calcular
        titulo: El coeficiente del arcotangente
        pregunta: |
          El resultado tiene un término $C_0\arctan\frac t2$. ¿Cuánto vale
          $C_0$? Da cuatro decimales.
        respuesta:
          tipo: numero
          valor: '-0.125'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0.125'
            mensaje: |
              Falta el signo. En la descomposición
              $\frac{1}{4}\left[\frac{1}{t^{2}}-\frac{1}{t^{2}+4}\right]$ el
              segundo término va **restando**.
          - valor: '-0.25'
            mensaje: |
              $-\frac14$ es el coeficiente de $\frac{1}{t^{2}+4}$ antes de
              integrar. Al hacerlo aparece otro $\frac12$ de la fórmula del
              arcotangente.
          - valor: '-0.5'
            mensaje: |
              $-\frac12$ es solo el factor de la fórmula
              $\int\frac{dt}{t^{2}+4} = \frac12\arctan\frac t2$.
        pista: |
          $\frac{1}{t^{2}(t^{2}+4)}
          = \frac14\left[\frac{1}{t^{2}}-\frac{1}{t^{2}+4}\right]$, y
          $\int\frac{dt}{t^{2}+4} = \frac12\arctan\frac t2$.
        desarrollo: |
          Con $u = t^{2}$, las fracciones simples:

          $$
          \frac{1}{u(u+4)} = \frac{1}{4}\left[\frac1u-\frac{1}{u+4}\right]
          $$

          $$
          \frac{1}{t^{2}\left(t^{2}+4\right)}
          = \frac14\cdot\frac{1}{t^{2}}-\frac14\cdot\frac{1}{t^{2}+4}
          $$

          Integrando:

          $$
          \frac14\int t^{-2}dt = -\frac{1}{4t}
          $$

          $$
          -\frac14\int\frac{dt}{t^{2}+4}
          = -\frac14\cdot\frac12\arctan\frac t2
          = -\frac18\arctan\frac t2
          $$

          $$
          C_0 = -\frac18 = -0{,}125
          $$
        veredicto: |
          Los dos factores $\frac14$ y $\frac12$ se multiplican. Perder uno de
          los dos es el fallo más común de este tipo de integrales.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Escribir las fórmulas del cambio.** Con $t=\mathrm{tg}\,x$:
              $\mathrm{sen}^{2}x = \frac{t^{2}}{1+t^{2}}$ y
              $dx = \frac{dt}{1+t^{2}}$.
          - texto: |
              **Sustituir y simplificar:** el denominador queda
              $\frac{t^{2}\left(t^{2}+4\right)}{1+t^{2}}$, y el $1+t^{2}$ se
              cancela con el del diferencial.
          - texto: |
              **Queda** $\int\frac{dt}{t^{2}\left(t^{2}+4\right)}$, una racional
              con solo potencias pares.
          - texto: |
              **Fracciones simples** en $u=t^{2}$:
              $\frac{1}{t^{2}(t^{2}+4)}
              = \frac{1}{4t^{2}}-\frac{1}{4\left(t^{2}+4\right)}$.
          - texto: |
              **Integrar y deshacer:**
              $-\frac{1}{4\,\mathrm{tg}\,x}
              -\frac18\arctan\frac{\mathrm{tg}\,x}{2}+C$.
          - texto: |
              El término $\frac{1}{4t^{2}}$ se integra como un logaritmo,
              porque el denominador es un polinomio.
            trampa: true
            mensaje: |
              El logaritmo aparece cuando el denominador es $t$ elevado a
              **uno**. Con $t^{2}$ en el denominador es una potencia negativa:
              $\int t^{-2}dt = -t^{-1}$. Confundir $\frac1t$ con
              $\frac{1}{t^{2}}$ al integrar es un error de primer curso que
              cuesta el ejercicio entero.
        veredicto: |
          $\int\frac{dt}{t}$ da logaritmo; $\int\frac{dt}{t^{2}}$ da
          $-\frac1t$. Solo el exponente $-1$ produce logaritmos.

    resolucion: |
      **Datos.**
      $\int\frac{dx}{\mathrm{tg}^{2}x+3\,\mathrm{sen}^{2}x}$, con el cambio
      $\mathrm{tg}\,x = t$ indicado por el enunciado.

      ### 1 · Las fórmulas del cambio

      De $t = \mathrm{tg}\,x = \frac{\mathrm{sen}\,x}{\cos x}$, construyendo el
      triángulo de catetos $t$ y $1$ e hipotenusa $\sqrt{1+t^{2}}$:

      $$
      \mathrm{sen}\,x = \frac{t}{\sqrt{1+t^{2}}},
      \qquad
      \cos x = \frac{1}{\sqrt{1+t^{2}}}
      $$

      $$
      \mathrm{sen}^{2}x = \frac{t^{2}}{1+t^{2}}
      $$

      Y el diferencial, derivando $t = \mathrm{tg}\,x$:

      $$
      dt = \sec^{2}x\,dx = \left(1+t^{2}\right)dx
      \;\Longrightarrow\;
      dx = \frac{dt}{1+t^{2}}
      $$

      **Escribir estas tres antes de empezar** ahorra la mitad de los errores.

      ### 2 · Sustituir

      $$
      \mathrm{tg}^{2}x+3\,\mathrm{sen}^{2}x
      = t^{2}+\frac{3t^{2}}{1+t^{2}}
      = t^{2}\left(\frac{1+t^{2}+3}{1+t^{2}}\right)
      = \frac{t^{2}\left(t^{2}+4\right)}{1+t^{2}}
      $$

      $$
      \int\frac{dx}{\mathrm{tg}^{2}x+3\,\mathrm{sen}^{2}x}
      = \int\frac{1+t^{2}}{t^{2}\left(t^{2}+4\right)}
      \cdot\frac{dt}{1+t^{2}}
      $$

      $$
      \boxed{= \int\frac{dt}{t^{2}\left(t^{2}+4\right)}}
      $$

      **El $1+t^{2}$ se cancela entero**, que es la señal de que el cambio
      indicado era el adecuado.

      ### 3 · Fracciones simples

      Solo aparecen potencias pares, así que conviene el cambio auxiliar
      $u = t^{2}$:

      $$
      \frac{1}{u(u+4)} = \frac Au+\frac{B}{u+4}
      \;\Longrightarrow\;
      1 = A(u+4)+Bu
      $$

      | $u$ | ecuación | resultado |
      |---|---|---|
      | $0$ | $1 = 4A$ | $A = \frac14$ |
      | $-4$ | $1 = -4B$ | $B = -\frac14$ |

      $$
      \frac{1}{t^{2}\left(t^{2}+4\right)}
      = \frac{1}{4t^{2}}-\frac{1}{4\left(t^{2}+4\right)}
      $$

      ### 4 · Integrar

      **Primer término.** Ojo: es una potencia, **no** un logaritmo.

      $$
      \frac14\int t^{-2}dt = \frac14\cdot\left(-\frac1t\right)
      = -\frac{1}{4t}
      $$

      **Segundo término**, con
      $\int\frac{dt}{t^{2}+a^{2}} = \frac1a\arctan\frac ta$ y $a=2$:

      $$
      -\frac14\cdot\frac12\arctan\frac t2 = -\frac18\arctan\frac t2
      $$

      ### 5 · Deshacer el cambio

      $$
      \boxed{\int\frac{dx}{\mathrm{tg}^{2}x+3\,\mathrm{sen}^{2}x}
      = -\frac{1}{4\,\mathrm{tg}\,x}
      -\frac18\arctan\left(\frac{\mathrm{tg}\,x}{2}\right)+C}
      $$

      o, con la cotangente:

      $$
      = -\frac{\cot x}{4}-\frac18\arctan\frac{\mathrm{tg}\,x}{2}+C
      $$

      ### 6 · Comprobación

      **Derivando en la variable $t$**, que es lo más rápido:

      $$
      \frac{d}{dt}\left[-\frac{1}{4t}\right] = \frac{1}{4t^{2}}
      $$

      $$
      \frac{d}{dt}\left[-\frac18\arctan\frac t2\right]
      = -\frac18\cdot\frac{1/2}{1+\frac{t^{2}}{4}}
      = -\frac18\cdot\frac{2}{4+t^{2}} = -\frac{1}{4\left(t^{2}+4\right)}
      $$

      Sumando:

      $$
      \frac{1}{4t^{2}}-\frac{1}{4\left(t^{2}+4\right)}
      = \frac{\left(t^{2}+4\right)-t^{2}}{4t^{2}\left(t^{2}+4\right)}
      = \frac{4}{4t^{2}\left(t^{2}+4\right)}
      = \frac{1}{t^{2}\left(t^{2}+4\right)} \quad\checkmark
      $$

      **Numérica.** Entre $x = 0{,}5$ y $x = 1$, donde
      $t$ va de $0{,}5463$ a $1{,}5574$:

      $$
      \left[-\frac{1}{4t}-\frac18\arctan\frac t2\right]_{0{,}5463}^{1{,}5574}
      $$

      $$
      = \left(-0{,}1605-0{,}0842\right)-\left(-0{,}4576-0{,}0338\right)
      = -0{,}2447+0{,}4914 = 0{,}2467
      $$

      Y sumando el integrando en cien trozos entre $0{,}5$ y $1$ sale
      $0{,}2467$ ✔

      ### 7 · Dónde vale

      El denominador se anula cuando $\mathrm{tg}\,x = 0$, es decir en
      $x = k\pi$: ahí el integrando se dispara y la función no está definida.

      En $x = \frac{\pi}{2}+k\pi$ el **cambio** pierde sentido —la tangente no
      existe— pero el integrando original sí: como
      $\mathrm{tg}^{2}x \to +\infty$, tiende a **0**. Es una limitación del
      método, no de la función.

      La primitiva vale en cada intervalo entre ceros consecutivos de la
      tangente, con su propia constante. Y conviene señalar que
      $-\frac18\arctan\frac{\mathrm{tg}\,x}{2}$ tiene un salto en
      $x = \frac{\pi}{2}$: para tener una primitiva continua en todo
      $(0,\pi)$ hay que ajustar la constante a cada lado.
