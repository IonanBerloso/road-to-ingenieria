ejercicios:
  - id: ex1920-rec-1-media-recta-y-parabola
    titulo: Un semiplano y una parábola, escritos con distancias
    fuente: >-
      Ejercicio 1 · Cuarta evaluación, PRIMER CUATRIMESTRAL, 24 de febrero de
      2020 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3
    enunciado: |
      Calcular y representar geométricamente los afijos de los números
      complejos $z$ que verifican las condiciones siguientes:

      $$
      \begin{cases}
      |z-2| > |z-2i| \\[2mm]
      |z| + \operatorname{Im}(z) < 4
      \end{cases}
      $$
    pide: La región del plano y su dibujo.

    pasos:
      - tipo: reconocer
        pregunta: |
          «La distancia a $2$ es mayor que la distancia a $2i$». ¿Qué figura
          separa los dos casos?
        opciones:
          - texto: >-
              La mediatriz del segmento que une $2$ y $2i$; la condición se
              queda con el semiplano del lado de $2i$
            correcta: true
            mensaje: |
              Eso es. La mediatriz es el lugar de los puntos que equidistan, y
              parte el plano en dos. Como se pide estar **más lejos** de 2, la
              región es el semiplano que contiene a $2i$.
          - texto: Una circunferencia centrada en el punto medio
            mensaje: |
              La circunferencia sale cuando se fija el **cociente** de
              distancias distinto de 1 —la de Apolonio—. Con distancias
              comparadas por «mayor que» a secas, lo que aparece es la
              mediatriz.
          - texto: Una elipse de focos 2 y 2i
            mensaje: |
              La elipse sale de la **suma** de distancias. Aquí las distancias
              se comparan entre sí, no se suman.
          - texto: Una hipérbola de focos 2 y 2i
            mensaje: |
              La hipérbola sale de que la **diferencia** de distancias sea una
              constante no nula. Cuando esa constante es cero, la hipérbola
              degenera en la mediatriz — que es este caso.

      - tipo: calcular
        titulo: La recta que separa
        pregunta: |
          Desarrollando $|z-2| > |z-2i|$ en cartesianas, queda $y > mx$.
          ¿Cuánto vale $m$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '-1'
            mensaje: |
              La mediatriz de $2$ y $2i$ pasa por el origen con pendiente
              positiva: los dos puntos son simétricos respecto de la recta
              $y=x$. La de pendiente $-1$ sería la mediatriz de $2$ y $-2i$.
          - valor: '2'
            mensaje: |
              El 2 es la coordenada de los puntos, no la pendiente. Al elevar
              al cuadrado los dos lados, los términos con 4 se cancelan y solo
              quedan los lineales.
          - valor: '0'
            mensaje: |
              Con $m=0$ la recta sería el eje real, que no equidista de $2$ y
              de $2i$: el 2 está sobre ella y el $2i$ a distancia 2.
        pista: |
          Eleva los dos lados al cuadrado: $(x-2)^{2}+y^{2} > x^{2}+(y-2)^{2}$
          y simplifica. Los $x^{2}$, los $y^{2}$ y los 4 se van.
        desarrollo: |
          $$
          (x-2)^{2}+y^{2} > x^{2}+(y-2)^{2}
          $$
          $$
          x^{2}-4x+4+y^{2} > x^{2}+y^{2}-4y+4
          $$
          $$
          -4x > -4y
          \;\Longrightarrow\;
          x < y
          $$

          Es el semiplano **abierto** por encima de la recta $y=x$, que es la
          mediatriz del segmento de $2$ a $2i$. Elevar al cuadrado es lícito
          porque los dos lados son distancias, es decir números no negativos.

      - tipo: calcular
        titulo: El vértice de la parábola
        pregunta: |
          La segunda condición se reduce a $y < c - \frac{x^{2}}{8}$. ¿Cuánto
          vale $c$, la altura del vértice?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              El 4 es la constante del enunciado, pero al despejar se reparte:
              $x^{2} < 16-8y$ da $y < 2 - \frac{x^{2}}{8}$. El 16 dividido
              entre 8 es 2, no 4.
          - valor: '16'
            mensaje: |
              $16$ es $4^{2}$, que aparece al elevar al cuadrado, pero todavía
              hay que dividir entre 8 al despejar la $y$.
          - valor: '8'
            mensaje: |
              El 8 es el denominador de $x^{2}$, no la altura del vértice.
        pista: |
          Pasa $\operatorname{Im}(z)$ al otro lado y eleva al cuadrado:
          $\sqrt{x^{2}+y^{2}} < 4-y$. Los $y^{2}$ se cancelan.
        desarrollo: |
          $$
          \sqrt{x^{2}+y^{2}} < 4 - y
          $$

          Antes de elevar hay que decir una cosa: el lado derecho tiene que ser
          positivo, así que $y<4$. Con eso, elevar al cuadrado conserva el
          sentido:

          $$
          x^{2}+y^{2} < 16 - 8y + y^{2}
          \;\Longrightarrow\;
          x^{2} < 16 - 8y
          \;\Longrightarrow\;
          y < 2 - \frac{x^{2}}{8}
          $$

          Una parábola con vértice en $(0,2)$ que abre hacia abajo, y la
          región es su **interior**. La condición $y<4$ que exigimos antes se
          cumple sola: $2-\frac{x^{2}}{8} \le 2 < 4$.

      - tipo: justificar
        titulo: La región, descrita
        pregunta: Ordena la descripción. Una pieza es falsa.
        piezas:
          - texto: >-
              La primera condición dice que $z$ está más lejos de $2$ que de
              $2i$: es el semiplano abierto que la mediatriz $y=x$ deja del
              lado de $2i$, o sea $y>x$.
          - texto: >-
              En la segunda, antes de elevar al cuadrado hay que exigir
              $4-y>0$, porque un módulo no puede ser menor que un número
              negativo.
          - texto: >-
              Elevando, $x^{2}+y^{2}<16-8y+y^{2}$, y los $y^{2}$ se cancelan:
              queda $y<2-\frac{x^{2}}{8}$, el interior de una parábola de
              vértice $(0,2)$ que abre hacia abajo.
          - texto: >-
              La condición auxiliar $y<4$ se cumple sola, porque
              $2-\frac{x^{2}}{8}\le 2$.
          - texto: >-
              La región es la intersección: el trozo del interior de la
              parábola que queda por encima de la recta $y=x$. Los dos bordes
              son abiertos.
          - texto: >-
              Al ser las dos condiciones estrictas, la región es vacía en los
              puntos donde la recta corta a la parábola, así que la
              intersección no está acotada.
            trampa: true
            mensaje: |
              Es al revés: la región **está acotada**. La recta $y=x$ y la
              parábola $y=2-\frac{x^{2}}{8}$ se cortan en dos puntos —los de
              $x^{2}+8x-16=0$—, y entre ellos queda un recinto cerrado por
              arriba con el arco y por abajo con la recta. Que los bordes no
              se incluyan no hace que la región deje de ser acotada: solo la
              deja abierta.

    resolucion: |
      ## La primera condición: un semiplano

      $|z-2|$ y $|z-2i|$ son las distancias de $z$ a los puntos $2$ y $2i$.
      Pedir que la primera sea mayor es pedir estar **del lado de $2i$** de la
      mediatriz.

      Y la cuenta lo confirma. Elevando al cuadrado —lícito, porque los dos
      lados son distancias, no negativas:

      $$
      (x-2)^{2}+y^{2} > x^{2}+(y-2)^{2}
      \;\Longrightarrow\;
      -4x > -4y
      \;\Longrightarrow\;
      y > x
      $$

      Semiplano abierto por encima de $y=x$.

      ## La segunda: una parábola

      $$
      \sqrt{x^{2}+y^{2}} < 4-y
      $$

      **Primero la condición de existencia:** un módulo es $\ge 0$, así que
      hace falta $4-y>0$. Sin decir esto, elevar al cuadrado puede meter
      soluciones falsas, y es donde se pierde COMP4.

      Con $y<4$, elevando:

      $$
      x^{2}+y^{2} < 16-8y+y^{2}
      \;\Longrightarrow\;
      x^{2} < 16-8y
      \;\Longrightarrow\;
      y < 2-\frac{x^{2}}{8}
      $$

      Es el interior de la parábola de vértice $(0,2)$ que abre hacia abajo. Y
      la condición auxiliar se cumple sola, porque $2-\frac{x^{2}}{8}\le 2<4$.

      Otra forma de verlo, sin cuentas: $|z| + \operatorname{Im}(z)$ es
      «distancia al origen más altura», y eso constante es la definición de
      parábola de foco el origen y directriz la recta $y=4$. La cuenta y la
      definición dicen lo mismo, y escribirlo así vale puntos.

      ## La región

      La intersección de las dos: el trozo del interior de la parábola que
      queda por encima de la recta $y=x$. **Está acotada**, y se puede decir
      exactamente dónde. Los cortes salen de

      $$
      x = 2-\frac{x^{2}}{8}
      \;\Longrightarrow\;
      x^{2}+8x-16 = 0
      \;\Longrightarrow\;
      x = -4 \pm 4\sqrt{2}
      $$

      es decir $x \approx 1{,}657$ y $x \approx -9{,}657$. Entre esos dos
      valores, la recta va por debajo de la parábola y queda el recinto: un
      «gajo» limitado por arriba por el arco de parábola y por abajo por la
      recta, con **los dos bordes excluidos** por ser las desigualdades
      estrictas.

      ## Lo que evalúa la COMP4

      Tres puntos, y se reparten en tres frases:

      - decir que la mediatriz es el lugar de los equidistantes y de qué lado
        cae la región, en vez de solo despejar;
      - exigir $4-y>0$ **antes** de elevar al cuadrado;
      - dibujar los dos bordes discontinuos, y marcar los dos puntos de corte.

  - id: ex1920-rec-2-coseno-igual-a-dos
    titulo: Un coseno que vale 2, que en el plano complejo no es absurdo
    fuente: >-
      Ejercicio 2 · Cuarta evaluación, PRIMER CUATRIMESTRAL, 24 de febrero de
      2020 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp4: 8
    enunciado: |
      Resolver la ecuación $\cos z = 2$, con $z \in \mathbb{C}$.
    pide: Todas las soluciones complejas.

    pasos:
      - tipo: reconocer
        pregunta: |
          En $\mathbb{R}$ esta ecuación no tiene solución. ¿Por qué en
          $\mathbb{C}$ sí?
        opciones:
          - texto: >-
              Porque el coseno complejo **no está acotado**: se define con la
              exponencial, no con un triángulo
            correcta: true
            mensaje: |
              Exacto, y es la frase que hay que escribir. $\cos z =
              \frac{e^{iz}+e^{-iz}}{2}$, y con $z = iy$ eso es el coseno
              hiperbólico de $y$, que se va a infinito. La cota $|\cos x|\le 1$
              es una propiedad del coseno **real**, no una ley del coseno.
          - texto: >-
              Porque en $\mathbb{C}$ se puede dividir entre cero y eso amplía
              las soluciones
            mensaje: |
              En $\mathbb{C}$ tampoco se puede dividir entre cero. Lo que
              cambia es la definición de las funciones trigonométricas, no las
              reglas de la aritmética.
          - texto: >-
              Porque los ángulos complejos dan la vuelta más de una vez
            mensaje: |
              No hay «ángulos complejos» en el sentido geométrico. La
              periodicidad $2\pi$ sí se conserva, y por eso las soluciones
              salen en familia, pero no es lo que permite llegar a 2.
          - texto: >-
              No la tiene: el enunciado está mal
            mensaje: |
              Sí la tiene, y son dos familias infinitas. Es el ejemplo canónico
              de identidad real que **no** sobrevive al plano complejo, y por
              eso cae en un examen.

      - tipo: calcular
        titulo: La parte imaginaria de la solución
        pregunta: |
          Todas las soluciones son de la forma $z = 2k\pi \pm i\,c$. ¿Cuánto
          vale $c$?
        respuesta:
          tipo: numero
          valor: '1.3169579'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.6931472'
            mensaje: |
              $\ln 2$: te has quedado con el 2 del enunciado. La solución de
              $w^{2}-4w+1=0$ es $w = 2\pm\sqrt3$, y lo que hay que tomar es
              $\ln(2+\sqrt3)$, no $\ln 2$.
          - valor: '2'
            mensaje: |
              El 2 es el valor del coseno, no la parte imaginaria de $z$. Hay
              que resolver la ecuación de segundo grado en $e^{iz}$ y tomar
              logaritmos.
          - valor: '-1.3169579'
            mensaje: |
              El signo negativo también es solución —las dos familias van con
              $\pm$—, pero la pregunta es por el valor de $c$, que se toma
              positivo. Las dos ramas salen de las dos raíces
              $2+\sqrt3$ y $2-\sqrt3$, que son inversas una de la otra.
        pista: |
          Con $w = e^{iz}$ la ecuación es $w+\frac1w = 4$, o sea
          $w^{2}-4w+1=0$. Resuélvela y toma logaritmo.
        desarrollo: |
          Con $w = e^{iz}$:

          $$
          \frac{w+w^{-1}}{2} = 2
          \;\Longrightarrow\;
          w^{2}-4w+1 = 0
          \;\Longrightarrow\;
          w = 2 \pm \sqrt3
          $$

          Las dos raíces son **reales y positivas**, y además una es la inversa
          de la otra: $(2+\sqrt3)(2-\sqrt3) = 1$. Por tanto

          $$
          \ln(2-\sqrt3) = -\ln(2+\sqrt3)
          $$

          y basta con $c = \ln(2+\sqrt3) \approx 1{,}3169579$.

      - tipo: justificar
        titulo: La resolución completa
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Por definición, $\cos z = \frac{e^{iz}+e^{-iz}}{2}$, así que la
              ecuación es $e^{iz}+e^{-iz} = 4$.
          - texto: >-
              Llamando $w = e^{iz}$, que nunca es cero, queda
              $w + \frac1w = 4$, es decir $w^{2}-4w+1=0$.
          - texto: >-
              Sus raíces son $w = 2\pm\sqrt3$, las dos reales y positivas, y
              una inversa de la otra.
          - texto: >-
              Tomando logaritmo complejo: $iz = \ln(2\pm\sqrt3) + 2k\pi i$,
              porque el argumento de un real positivo es 0 salvo múltiplos de
              $2\pi$.
          - texto: >-
              Despejando, $z = 2k\pi \mp i\ln(2+\sqrt3)$ con $k\in\mathbb{Z}$:
              dos rectas horizontales de puntos, simétricas respecto del eje
              real.
          - texto: >-
              Como $2+\sqrt3 > 1$, su logaritmo es positivo y por tanto la
              solución tiene parte real positiva.
            trampa: true
            mensaje: |
              El logaritmo positivo acaba en la parte **imaginaria**, no en la
              real. Al dividir entre $i$ para despejar $z$, el término real
              $\ln(2+\sqrt3)$ pasa a multiplicar a $-i$. La parte real de las
              soluciones es $2k\pi$, que puede ser positiva, negativa o cero.

    resolucion: |
      ## Por qué la ecuación tiene sentido

      La cota $|\cos x|\le 1$ es una propiedad del coseno **real**, y sale de
      que $\cos x$ es una coordenada sobre la circunferencia unidad. En
      $\mathbb{C}$ no hay tal circunferencia: el coseno **se define** como

      $$
      \cos z = \frac{e^{iz}+e^{-iz}}{2}
      $$

      y con eso deja de estar acotado. De hecho, para $z = iy$ imaginario puro,

      $$
      \cos(iy) = \frac{e^{-y}+e^{y}}{2} = \cosh y
      $$

      que crece sin límite. Así que no solo $\cos z = 2$ tiene solución:
      $\cos z = 1000$ también.

      Ocho de los diez puntos son COMP4, y buena parte se los lleva **decir
      esto** antes de calcular.

      ## La resolución

      $$
      e^{iz}+e^{-iz} = 4
      $$

      Con $w = e^{iz}$, que nunca vale cero:

      $$
      w + \frac1w = 4
      \;\Longrightarrow\;
      w^{2}-4w+1 = 0
      \;\Longrightarrow\;
      w = \frac{4\pm\sqrt{16-4}}{2} = 2\pm\sqrt3
      $$

      Las dos raíces son reales y positivas, y su producto vale 1: son
      inversas. Tomando logaritmo complejo —y como el argumento de un real
      positivo es $0$ salvo múltiplos de $2\pi$:

      $$
      iz = \ln(2\pm\sqrt3) + 2k\pi i, \qquad k\in\mathbb{Z}
      $$

      $$
      z = \frac{\ln(2\pm\sqrt3)}{i} + 2k\pi
      = 2k\pi - i\ln(2\pm\sqrt3)
      $$

      Y usando $\ln(2-\sqrt3) = -\ln(2+\sqrt3)$, las dos familias se juntan:

      $$
      \boxed{\;z = 2k\pi \pm i\,\ln\!\left(2+\sqrt3\right), \qquad k\in\mathbb{Z}\;}
      $$

      con $\ln(2+\sqrt3)\approx 1{,}3169579$.

      ## Dónde caen

      Dos rectas horizontales, a altura $\pm\ln(2+\sqrt3)$, con un punto cada
      $2\pi$ en cada una. **Ninguna solución es real**, como tenía que ser: si
      alguna lo fuera, tendríamos un coseno real valiendo 2.

      ## El paso que más se falla

      Despejar $z$ de $iz = \ln(\cdot) + 2k\pi i$. Dividir entre $i$ es
      multiplicar por $-i$, así que **el término real se vuelve imaginario y
      el imaginario se vuelve real**. Quien se salta ese cambio acaba con la
      parte real y la imaginaria intercambiadas, y sitúa las soluciones sobre
      el eje imaginario en vez de sobre dos horizontales.

  - id: ex1920-rec-3-el-signo-sobrevive-al-limite
    titulo: Si todos los términos son ≤ 0, el límite también
    fuente: >-
      Ejercicio 3 · Cuarta evaluación, PRIMER CUATRIMESTRAL, 24 de febrero de
      2020 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp4: 10
    enunciado: |
      Demostrar la siguiente propiedad: si $a_{n} \le 0$ para todo
      $n\in\mathbb{N}$ y $\{a_{n}\}_{n\in\mathbb{N}}$ converge hacia $L$,
      entonces $L \le 0$.
    pide: La demostración de que el signo pasa al límite.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la forma natural de demostrar esto?
        opciones:
          - texto: >-
              Por reducción al absurdo: suponer $L>0$ y elegir un
              $\varepsilon$ que fuerce a los términos a ser positivos
            correcta: true
            mensaje: |
              Esa es la vía, y la gracia está en **elegir bien el
              $\varepsilon$**. Con $\varepsilon = L/2$ la banda
              $(L-\varepsilon,\ L+\varepsilon)$ queda entera a la derecha del
              cero, así que a partir de cierto $m$ todos los términos son
              positivos — y eso choca con la hipótesis.
          - texto: >-
              Tomando límites en la desigualdad $a_{n}\le 0$
            mensaje: |
              «Tomar límites» en una desigualdad es exactamente la propiedad
              que se pide demostrar: usarla sería circular.
          - texto: >-
              Por inducción sobre $n$
            mensaje: |
              La inducción demuestra propiedades de cada $n$, y $L$ no depende
              de $n$: es el límite. No hay nada sobre lo que inducir.
          - texto: >-
              Comprobándolo con varios ejemplos de sucesiones negativas
            mensaje: |
              Los ejemplos no demuestran una propiedad universal. Sirven para
              lo contrario: **un** contraejemplo la tumbaría.

      - tipo: calcular
        titulo: La cota que aparece en el absurdo
        pregunta: |
          Supón $L = 0{,}6$ y toma $\varepsilon = L/2$. La definición garantiza
          $a_{n} > L - \varepsilon$ a partir de cierto $m$. ¿Cuánto vale esa
          cota?
        respuesta:
          tipo: numero
          valor: '0.3'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '0.9'
            mensaje: |
              $L+\varepsilon$ es la cota **superior** de la banda. La que
              produce el absurdo es la inferior, $L-\varepsilon$, porque es la
              que obliga a los términos a ser positivos.
          - valor: '0.6'
            mensaje: |
              $0{,}6$ es $L$. La banda va de $L-\varepsilon$ a $L+\varepsilon$;
              con $\varepsilon = L/2 = 0{,}3$, el extremo inferior es
              $0{,}6-0{,}3$.
          - valor: '0'
            mensaje: |
              Si la cota fuera 0 no habría contradicción: $a_{n}>0$ y
              $a_{n}\le 0$ chocan, pero $a_{n}\ge 0$ y $a_{n}\le 0$ conviven
              en $a_{n}=0$. Por eso $\varepsilon$ se toma **estrictamente
              menor** que $L$, y $L/2$ lo consigue.
        pista: |
          $\varepsilon = L/2 = 0{,}3$, y la cota inferior de la banda es
          $L - \varepsilon$.
        desarrollo: |
          $$
          \varepsilon = \frac{L}{2} = 0{,}3,
          \qquad
          L - \varepsilon = 0{,}6 - 0{,}3 = 0{,}3 = \frac{L}{2}
          $$

          En general, con $\varepsilon = L/2$ la cota inferior es siempre
          $L/2$, que es **estrictamente positiva** si $L>0$. Ahí está el
          absurdo: la definición obliga a que infinitos términos sean mayores
          que $L/2 > 0$, y la hipótesis dice que todos son $\le 0$.

          Y se ve por qué $L/2$ y no $L$: con $\varepsilon = L$ la cota
          inferior sería 0, y $a_{n}>0$ ya no contradiría $a_{n}\le 0$… bueno,
          sí lo haría, pero por los pelos. Con $L/2$ el margen es holgado y la
          escritura, más limpia.

      - tipo: justificar
        titulo: La demostración
        pregunta: Ordena la demostración por reducción al absurdo. Una pieza es falsa.
        piezas:
          - texto: >-
              Supongamos, por reducción al absurdo, que $L>0$.
          - texto: >-
              Como $\{a_{n}\}$ converge a $L$, la definición vale para
              **cualquier** $\varepsilon>0$; en particular para
              $\varepsilon = \frac{L}{2}$, que es positivo por ser $L>0$.
          - texto: >-
              Existe entonces $m$ tal que $|a_{n}-L|<\frac{L}{2}$ para todo
              $n\ge m$, lo que equivale a
              $\frac{L}{2} < a_{n} < \frac{3L}{2}$.
          - texto: >-
              En particular $a_{m} > \frac{L}{2} > 0$, y eso contradice la
              hipótesis de que todos los términos son $\le 0$.
          - texto: >-
              Luego la suposición era falsa y $L\le 0$. $\blacksquare$
          - texto: >-
              La desigualdad del enunciado es estricta en el límite: si todos
              los $a_{n}$ son estrictamente negativos, entonces $L<0$.
            trampa: true
            mensaje: |
              Eso es falso, y es el matiz que da sentido al «$\le$» del
              enunciado: $a_{n} = -\frac1n$ es estrictamente negativa para
              todo $n$ y su límite es 0, que no es estrictamente negativo.
              **El límite conserva las desigualdades débiles, no las
              estrictas.** La recuperación de 2020-2021 pide exactamente este
              contraejemplo en su ejercicio 3.

    resolucion: |
      Diez puntos de COMP4 y ninguno de cálculo: aquí solo se corrige la
      demostración.

      ## La idea

      Si el límite fuera positivo, la definición obligaría a que **casi todos**
      los términos estuvieran cerca de él, y por tanto fueran positivos. Eso
      choca con que todos son $\le 0$. Basta con elegir la banda de forma que
      no toque el cero.

      ## La demostración

      Supongamos, por reducción al absurdo, que $L>0$.

      Como $\{a_{n}\}\to L$, la definición se cumple para todo $\varepsilon>0$.
      Tomemos

      $$
      \varepsilon = \frac{L}{2} > 0
      $$

      Existe entonces $m\in\mathbb{N}$ tal que, para todo $n\ge m$,

      $$
      |a_{n}-L| < \frac{L}{2}
      \iff
      L - \frac{L}{2} < a_{n} < L + \frac{L}{2}
      \iff
      \frac{L}{2} < a_{n} < \frac{3L}{2}
      $$

      En particular $a_{m} > \frac{L}{2} > 0$, lo que contradice la hipótesis
      $a_{n}\le 0$ para todo $n$.

      Por tanto la suposición es falsa y $L\le 0$. $\blacksquare$

      ## Por qué ε = L/2 y no otro

      Porque tiene que cumplir dos cosas a la vez: **ser positivo** —si no, la
      definición no se puede invocar— y **ser menor que $L$**, para que la
      banda quede entera a la derecha del cero. Cualquier $\varepsilon$ con
      $0<\varepsilon<L$ vale; $L/2$ es el más cómodo de escribir.

      Elegir $\varepsilon = L$ deja la cota inferior en 0 exactamente y obliga
      a razonar con desigualdades estrictas en el borde. Funciona, pero da más
      trabajo por nada.

      ## El matiz que hay que decir

      La propiedad es con **desigualdad débil** en las dos puntas, y no se
      puede afinar: si todos los $a_{n}$ son estrictamente negativos, el límite
      puede ser 0. El contraejemplo es $a_{n} = -\frac1n$. Escribirlo al final
      demuestra que se ha entendido qué conserva el límite y qué no — y es,
      literalmente, el ejercicio 3 de la recuperación del año siguiente.

  - id: ex1920-rec-4-la-sucesion-que-se-desploma
    titulo: Una sucesión que cae de golpe, y la serie que aun así converge
    fuente: >-
      Ejercicio 4 · Cuarta evaluación, PRIMER CUATRIMESTRAL, 24 de febrero de
      2020 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 1
      comp4: 7
    enunciado: |
      a) Definir formalmente los siguientes conceptos: sucesión creciente,
      sucesión decreciente, supremo, ínfimo, sucesión convergente.

      b) Estudiar dichos conceptos para la sucesión
      $\{a_{n}\}_{n\in\mathbb{N}}$ definida de la siguiente forma:

      $$
      \{a_{n}\}_{n\in\mathbb{N}} =
      \begin{cases}
      4 + \dfrac{1}{n} & n < 10 \\[3mm]
      \left(\dfrac{2}{3}\right)^{n} & n \ge 10
      \end{cases}
      $$

      c) Sea $\{a_{n}\}_{n\in\mathbb{N}}$ la sucesión definida en el apartado
      anterior. ¿Es convergente la serie $\displaystyle\sum_{n=1}^{\infty} a_{n}$?
    pide: Las cinco definiciones, su estudio en esta sucesión y la serie.

    pasos:
      - tipo: reconocer
        pregunta: |
          La sucesión pasa de valer $\approx 4{,}11$ en $n=9$ a valer
          $\approx 0{,}017$ en $n=10$. ¿Qué es entonces?
        opciones:
          - texto: >-
              Estrictamente decreciente, porque cada término es menor que el
              anterior — también en el salto
            correcta: true
            mensaje: |
              Eso es, y hay que comprobar el salto expresamente: $a_{9} =
              4+\frac19 \approx 4{,}111$ y $a_{10} = \left(\frac23\right)^{10}
              \approx 0{,}0173$. Baja, así que la monotonía no se rompe. Dentro
              de cada trozo también baja, y con eso está.
          - texto: >-
              Ni creciente ni decreciente, porque está definida a trozos
            mensaje: |
              Estar definida a trozos no impide ser monótona: lo que hay que
              mirar es si $a_{n+1}<a_{n}$ para todos los $n$, incluido el que
              cruza la frontera. Aquí se cumple.
          - texto: >-
              Decreciente a partir de $n=10$, y antes creciente
            mensaje: |
              Antes también decrece: $4+\frac1n$ baja según crece $n$
              ($5$, $4{,}5$, $4{,}33$…). Lo que sube es $\frac1n$ al
              disminuir $n$, no la sucesión.
          - texto: >-
              Decreciente salvo en $n=10$, donde da un salto
            mensaje: |
              El salto es hacia **abajo**, así que no rompe nada. La monotonía
              no exige que los pasos sean parecidos, solo que vayan siempre en
              el mismo sentido.

      - tipo: calcular
        titulo: El supremo
        pregunta: |
          ¿Cuál es el supremo de la sucesión?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              4 es el valor al que se acercarían los términos del primer trozo
              si siguiera para siempre, pero el trozo se acaba y además los
              términos están **por encima** de 4. El supremo es el primero de
              todos.
          - valor: '0'
            mensaje: |
              0 es el ínfimo, no el supremo. La sucesión decrece, así que el
              mayor valor está al principio y el menor al final.
          - valor: '4.1111'
            mensaje: |
              Ese es $a_{9}$, el último término del primer trozo, o sea el
              **menor** de ellos. Como la sucesión decrece, el mayor es
              $a_{1}$.
        pista: |
          La sucesión es decreciente, así que su mayor valor es el primer
          término. Calcula $a_{1}$.
        desarrollo: |
          Como es estrictamente decreciente, el mayor valor es

          $$
          a_{1} = 4 + \frac11 = 5
          $$

          y al estar **alcanzado** no es solo supremo: es **máximo**.

          El ínfimo, en cambio, no se alcanza. Todos los términos son positivos
          y $\left(\frac23\right)^{n}\to 0$, así que ninguna cota inferior
          mayor que 0 sirve:

          $$
          \inf\{a_{n}\} = 0, \qquad \text{y no hay mínimo}
          $$

          Distinguir «supremo alcanzado, luego máximo» de «ínfimo no alcanzado,
          luego no hay mínimo» es justo lo que el apartado a) prepara.

      - tipo: justificar
        titulo: La serie
        pregunta: >-
          Ordena la respuesta al apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              La convergencia de una serie no depende de un número finito de
              términos: los nueve primeros suman una cantidad fija y no pueden
              estropear nada.
          - texto: >-
              A partir de $n=10$ la serie es
              $\sum_{n\ge 10}\left(\frac23\right)^{n}$, una serie geométrica de
              razón $r=\frac23$.
          - texto: >-
              Como $|r| = \frac23 < 1$, esa cola converge, y vale
              $\frac{(2/3)^{10}}{1-2/3} = 3\left(\frac23\right)^{10}$.
          - texto: >-
              Por tanto la serie completa converge, y su suma es
              $\sum_{n=1}^{9}\left(4+\frac1n\right) + 3\left(\frac23\right)^{10}
              = 36 + H_{9} + 3\left(\frac23\right)^{10} \approx 38{,}88$.
          - texto: >-
              Que $a_{n}\to 0$ era condición **necesaria** para que la serie
              pudiera converger, pero no suficiente: hacía falta el argumento
              geométrico.
          - texto: >-
              Como la sucesión es decreciente y tiende a 0, la serie converge
              por el criterio de Leibniz.
            trampa: true
            mensaje: |
              Leibniz es para series **alternadas**, y esta tiene todos sus
              términos positivos. Decreciente y tendiendo a cero no basta ni
              de lejos para una serie de términos positivos: la armónica
              $\sum\frac1n$ cumple las dos cosas y diverge. Aquí lo que salva
              la convergencia es que la cola sea geométrica de razón menor
              que 1.

    resolucion: |
      ## a) Las cinco definiciones

      | concepto | definición |
      |---|---|
      | creciente | $a_{n+1}\ge a_{n}$ para todo $n$ (estrictamente, si $>$) |
      | decreciente | $a_{n+1}\le a_{n}$ para todo $n$ (estrictamente, si $<$) |
      | supremo | la **menor** de las cotas superiores del conjunto $\{a_{n}\}$ |
      | ínfimo | la **mayor** de las cotas inferiores |
      | convergente | existe $l$ tal que $\forall\varepsilon>0\ \exists m$ con $\lvert a_{n}-l\rvert<\varepsilon$ para todo $n\ge m$ |

      Y el matiz que este ejercicio va a cobrar: el supremo **puede o no
      alcanzarse**. Si se alcanza, se llama máximo; si no, sigue existiendo
      pero no es ningún término de la sucesión.

      ## b) El estudio

      Los primeros términos:

      $$
      5,\;4{,}5,\;4{,}333,\;4{,}25,\;4{,}2,\;4{,}167,\;4{,}143,\;4{,}125,\;4{,}111,\;
      0{,}0173,\;0{,}0116,\;\dots
      $$

      **Monotonía.** Hay que comprobar tres cosas, y la tercera es la que se
      olvida:

      1. dentro del primer trozo, $4+\frac1n$ decrece al crecer $n$;
      2. dentro del segundo, $\left(\frac23\right)^{n}$ decrece porque la
         razón está entre 0 y 1;
      3. **en el salto**, $a_{9} = 4+\frac19 \approx 4{,}111$ y
         $a_{10} = \left(\frac23\right)^{10}\approx 0{,}0173$, así que también
         baja.

      Luego la sucesión es **estrictamente decreciente**.

      **Supremo e ínfimo.**

      $$
      \sup\{a_{n}\} = a_{1} = 5 \quad\text{(alcanzado: es máximo)}
      $$
      $$
      \inf\{a_{n}\} = 0 \quad\text{(no alcanzado: no hay mínimo)}
      $$

      **Convergencia.** Para $n\ge 10$ la sucesión es $\left(\frac23\right)^{n}$
      con razón en $(0,1)$, luego

      $$
      \lim_{n\to\infty} a_{n} = 0
      $$

      También se puede argumentar sin calcular: es decreciente y acotada
      inferiormente por 0, luego converge, y su límite es el ínfimo, que es 0.

      ## c) La serie

      **Sí converge.** Dos ingredientes:

      - **Los nueve primeros términos no cuentan.** La convergencia de una
        serie no cambia si se modifica un número finito de términos: solo
        cambia el valor de la suma.
      - **La cola es geométrica.** $\sum_{n\ge 10}\left(\frac23\right)^{n}$
        tiene razón $\frac23$, y $\left|\frac23\right|<1$.

      Y como es geométrica se puede sumar del todo:

      $$
      \sum_{n=10}^{\infty}\left(\frac23\right)^{n}
      = \frac{\left(\frac23\right)^{10}}{1-\frac23}
      = 3\left(\frac23\right)^{10}
      \approx 0{,}052
      $$

      $$
      \sum_{n=1}^{\infty} a_{n}
      = \underbrace{\sum_{n=1}^{9}\left(4+\frac1n\right)}_{36 + H_{9}}
      + 3\left(\frac23\right)^{10}
      \approx 36 + 2{,}829 + 0{,}052 = 38{,}881
      $$

      ## El error que este apartado busca

      Contestar «converge porque $a_{n}\to 0$». Que el término general tienda a
      cero es **necesario** pero no suficiente, y el contraejemplo lo tiene
      todo el mundo a mano: la serie armónica $\sum\frac1n$ tiene término
      general tendiendo a cero y diverge. Aquí lo que decide es que la cola sea
      geométrica de razón menor que 1.
