ejercicios:
  - id: ex2324-5ev-1-el-camino-con-semicircunferencia
    titulo: Un camino que se va lejos para volver casi al mismo sitio
    fuente: >-
      Ejercicio 1 · Quinta evaluación, 13 de mayo de 2024 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Calcular el trabajo realizado por el campo vectorial
      $F(x,y) = \left(x^{3}-y^{3},\; x^{3}+y^{3}\right)$ a lo largo de la curva
      $C$ que se muestra en la figura desde el punto $A = (-1,0)$ hasta el
      punto $B = (1,0)$.

      <figure class="figura-examen">
      <svg viewBox="0 0 480 300" role="img" width="480" height="300"
           aria-labelledby="sc-t sc-d">
        <title id="sc-t">El camino de A a B</title>
        <desc id="sc-d">Desde A, en menos uno cero, el camino va por el eje
        horizontal hacia la izquierda hasta menos dos; desde ahi sube por la
        media circunferencia de radio dos, pasando por el punto cero coma dos,
        hasta el dos del eje; y desde el dos vuelve por el eje hacia la
        izquierda hasta B, en uno cero.</desc>
        <style>
          .sc-eje { stroke: var(--graphite); stroke-width: 1.3; fill: none; }
          .sc-c { stroke: var(--d1); stroke-width: 3.2; fill: none; stroke-linecap: round; }
          .sc-pt { fill: var(--d1); }
          .sc-et { fill: var(--d1); font-size: 16px; font-family: var(--mono); font-weight: 700; text-anchor: middle; }
          .sc-num { fill: var(--faint); font-size: 12px; font-family: var(--mono); text-anchor: middle; }
          .sc-ec { fill: var(--graphite); font-size: 14px; font-family: var(--mono); }
        </style>
        <path class="sc-eje" d="M40 220L440 220M240 250L240 40"/>
        <path class="sc-c" d="M104 220L172 220"/>
        <path class="sc-c" d="M308 220L376 220"/>
        <path class="sc-c" d="M104 220A136 136 0 0 0 376 220"/>
        <circle class="sc-pt" cx="172" cy="220" r="4.5"/>
        <circle class="sc-pt" cx="308" cy="220" r="4.5"/>
        <text class="sc-et" x="172" y="208">A</text>
        <text class="sc-et" x="308" y="208">B</text>
        <g class="sc-num">
          <text x="104" y="238">−2</text>
          <text x="376" y="238">2</text>
          <text x="226" y="90">2</text>
          <text x="226" y="158">1</text>
        </g>
        <text class="sc-ec" x="290" y="80">x² + y² = 4</text>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original. El camino tiene tres tramos: un
      trozo de eje de A hasta −2, la media circunferencia de radio 2 por
      arriba, y otro trozo de eje de 2 hasta B.
      </figcaption>
      </figure>
    pide: El trabajo del campo a lo largo del camino, de A a B.

    pasos:
      - tipo: reconocer
        pregunta: |
          El camino tiene tres tramos y no es cerrado. ¿Qué conviene hacer?
        opciones:
          - texto: >-
              Cerrarlo con el segmento de B a A y aplicar Green, restando
              después lo que aporte ese segmento
            correcta: true
            mensaje: |
              Ese es el atajo. Al cerrar con el trozo de eje que falta, el
              circuito resulta ser el borde del semidisco de radio 2, y el
              integrando de Green sale $3(x^{2}+y^{2})$, que en polares es
              inmediato. Y el segmento añadido aporta cero, así que ni siquiera
              hay que restar nada.
          - texto: >-
              Comprobar si el campo es conservativo y usar el potencial
            mensaje: |
              Merece la pena comprobarlo —siempre—, pero no lo es:
              $M_{y} = -3y^{2}$ y $N_{x} = 3x^{2}$ solo coinciden en el origen.
              Si lo fuera, el trabajo sería 0 por tener A y B la misma altura y
              el ejercicio no tendría gracia.
          - texto: Parametrizar los tres tramos y sumar las tres integrales
            mensaje: |
              Funciona y da lo mismo, pero la de la semicircunferencia lleva
              $\cos^{4}$ y $\operatorname{sen}^{4}$ y hay que bajarlas de grado.
              Con Green sale en tres líneas. Eso sí: los dos tramos rectos se
              cancelan entre sí, y verlo ahorra la mitad del trabajo por
              cualquiera de los dos caminos.
          - texto: >-
              Como A y B están los dos sobre el eje, el trabajo es cero por
              simetría
            mensaje: |
              No hay tal simetría: el camino se va hasta $y=2$ y el campo
              cambia mucho por ahí. Que los extremos estén alineados solo
              importaría si el campo fuera conservativo.

      - tipo: calcular
        titulo: Lo que aportan los dos tramos rectos
        pregunta: |
          Sumados, ¿cuánto aportan al trabajo los dos tramos que van por el eje
          —de A a $(-2,0)$ y de $(2,0)$ a B?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '3.75'
            mensaje: |
              $15/4$ es lo que aporta **uno** de los dos, el de la izquierda.
              El otro aporta lo mismo con signo contrario, así que la suma es
              cero.
          - valor: '7.5'
            mensaje: |
              Has sumado los dos con el mismo signo. Los dos recorren su tramo
              hacia la izquierda, pero uno va de $-1$ a $-2$ y el otro de $2$ a
              $1$: en $x^{4}/4$ eso da $+15/4$ y $-15/4$.
          - valor: '-7.5'
            mensaje: |
              Mismo error con el signo global cambiado. Calcula cada uno por
              separado: $\int_{-1}^{-2}x^{3}dx$ y $\int_{2}^{1}x^{3}dx$.
        pista: |
          Sobre el eje $y=0$, así que $dy=0$ y solo queda
          $\int M\,dx = \int x^{3}dx$. Hazlo en los dos tramos y suma.
        desarrollo: |
          Sobre el eje $y = 0$ el campo vale $F = (x^{3},\, x^{3})$ y $dy = 0$,
          así que solo interviene la primera componente:

          $$
          \int_{-1}^{-2} x^{3}\,dx = \left[\frac{x^{4}}{4}\right]_{-1}^{-2}
          = 4 - \frac14 = \frac{15}{4}
          $$
          $$
          \int_{2}^{1} x^{3}\,dx = \frac14 - 4 = -\frac{15}{4}
          $$

          Suman **cero**. Y no es casualidad: $x^{3}$ es impar, los dos tramos
          son simétricos respecto del origen y los dos se recorren en el mismo
          sentido.

      - tipo: calcular
        titulo: El trabajo total
        pregunta: |
          ¿Cuánto vale el trabajo a lo largo de todo el camino, de A a B?
        respuesta:
          tipo: numero
          valor: '-37.6991118'
          tolerancia: 0.01
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '37.6991118'
            mensaje: |
              $+12\pi$: el signo del sentido. Al cerrar el camino con el
              segmento de vuelta, el circuito recorre el borde del semidisco en
              sentido **horario**, y Green da la integral doble con el signo
              cambiado.
          - valor: '-12.5663706'
            mensaje: |
              $-4\pi$: te falta el factor 3 del integrando. Green da
              $N_{x}-M_{y} = 3x^{2}+3y^{2} = 3r^{2}$, no $r^{2}$.
          - valor: '-9.4247780'
            mensaje: |
              $-3\pi$: has integrado $3r^{2}$ olvidando el jacobiano. En
              polares $dA = r\,dr\,d\theta$, así que el integrando es
              $3r^{3}$.
        pista: |
          Cierra el camino con el segmento de B a A. El circuito es el borde
          del semidisco $r\le 2$, recorrido en sentido horario. Y
          $N_{x}-M_{y} = 3r^{2}$.
        desarrollo: |
          Cerrando con el segmento de B$(1,0)$ a A$(-1,0)$, el circuito completo
          recorre el borde del **semidisco superior de radio 2**: por la
          semicircunferencia de $(-2,0)$ a $(2,0)$ y por el diámetro de vuelta.
          Ese sentido es **horario**, así que Green lleva signo menos:

          $$
          \oint_{\text{horario}} = -\iint_{D}\left(N_{x}-M_{y}\right)dA
          $$

          $$
          N_{x} = 3x^{2}, \qquad M_{y} = -3y^{2}
          \;\Longrightarrow\;
          N_{x}-M_{y} = 3\left(x^{2}+y^{2}\right) = 3r^{2}
          $$

          $$
          \iint_{D} 3r^{2}\,dA = \int_{0}^{\pi}\!\!\int_{0}^{2} 3r^{2}\cdot r\,dr\,d\theta
          = \pi\cdot 3\cdot\frac{2^{4}}{4} = 12\pi
          $$

          Y el segmento que hemos añadido aporta
          $\int_{1}^{-1}x^{3}dx = 0$, así que no hay que descontar nada:

          $$
          W = -12\pi \approx -37{,}70
          $$

      - tipo: justificar
        titulo: El razonamiento, ordenado
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $M_{y} = -3y^{2}$ y $N_{x} = 3x^{2}$ no coinciden, así que el
              campo no es conservativo y el camino importa.
          - texto: >-
              El camino no es cerrado, pero se cierra añadiendo el segmento de
              B$(1,0)$ a A$(-1,0)$ por el eje.
          - texto: >-
              El circuito resultante es el borde del semidisco superior de
              radio 2, recorrido en sentido **horario**.
          - texto: >-
              Green da $\oint = -\iint_{D}(N_{x}-M_{y})\,dA$ con el signo menos
              por el sentido, y $N_{x}-M_{y} = 3(x^{2}+y^{2})$.
          - texto: >-
              En polares, $\iint 3r^{2}\,dA = \int_{0}^{\pi}\!\int_{0}^{2}3r^{3}\,dr\,d\theta = 12\pi$,
              luego el circuito vale $-12\pi$.
          - texto: >-
              El segmento añadido aporta $\int_{1}^{-1}x^{3}dx = 0$, así que el
              trabajo pedido es también $-12\pi$.
          - texto: >-
              Como el camino empieza y acaba a la misma altura, el trabajo no
              depende de lo que haga en medio.
            trampa: true
            mensaje: |
              Eso solo es cierto en un campo conservativo, y este no lo es. Aquí
              subir hasta $y=2$ y volver cuesta $-12\pi$: el camino largo no es
              equivalente al corto. De hecho, ir de A a B en línea recta por el
              eje daría $\int_{-1}^{1}x^{3}dx = 0$, un resultado completamente
              distinto.

    resolucion: |
      ## Lo primero: no es conservativo

      $$
      M = x^{3}-y^{3}, \qquad N = x^{3}+y^{3}
      $$
      $$
      M_{y} = -3y^{2}, \qquad N_{x} = 3x^{2}
      $$

      Solo coinciden en el origen, así que **el camino importa**. Conviene
      comprobarlo antes de nada: si fuera conservativo, el trabajo sería
      $f(B)-f(A)$ y el rodeo por la semicircunferencia daría igual.

      ## El atajo: cerrar el camino

      El camino va de A$(-1,0)$ a B$(1,0)$ dando un rodeo. Añadiéndole el
      segmento que falta —de B a A por el eje— se convierte en el borde del
      **semidisco superior de radio 2**.

      Y ese circuito se recorre en sentido **horario**: la semicircunferencia
      va de izquierda a derecha por arriba, y el diámetro vuelve de derecha a
      izquierda. Por eso Green entra con signo menos.

      $$
      \oint_{\text{horario}} M\,dx+N\,dy
      = -\iint_{D}\left(\frac{\partial N}{\partial x}-\frac{\partial M}{\partial y}\right)dA
      $$

      $$
      N_{x}-M_{y} = 3x^{2}+3y^{2} = 3r^{2}
      $$

      En polares el semidisco es $0\le r\le 2$, $0\le\theta\le\pi$:

      $$
      \iint_{D}3r^{2}\,dA = \int_{0}^{\pi}\!\!\int_{0}^{2}3r^{3}\,dr\,d\theta
      = \pi\cdot 3\cdot 4 = 12\pi
      $$

      $$
      \oint = -12\pi
      $$

      ## Y el segmento que hemos añadido no cuesta nada

      Sobre el eje, $y=0$ y $dy=0$:

      $$
      \int_{1}^{-1} x^{3}\,dx = \left[\frac{x^{4}}{4}\right]_{1}^{-1} = 0
      $$

      Así que

      $$
      \boxed{\;W = -12\pi \approx -37{,}70\;}
      $$

      ## Las dos cancelaciones que hay que ver

      El ejercicio está construido sobre funciones impares, y eso hace que dos
      cosas se anulen:

      - los **dos tramos rectos** del camino, $+\frac{15}{4}$ y $-\frac{15}{4}$;
      - el **segmento de cierre**, que vale 0.

      Verlas ahorra la mitad de las cuentas por cualquiera de los dos métodos.
      Y explica por qué el resultado es un múltiplo limpio de $\pi$: todo lo
      que no es la semicircunferencia se cancela.

      ## Si se hace a mano, sin Green

      También sale, y conviene saber por dónde. Sobre la semicircunferencia,
      $x = 2\cos t$, $y = 2\operatorname{sen}t$ con $t$ de $\pi$ a $0$, queda

      $$
      \int_{\pi}^{0}16\left(\operatorname{sen}^{4}t + \cos^{4}t\right)dt
      + \int_{\pi}^{0}16\operatorname{sen}t\cos t\left(\operatorname{sen}^{2}t-\cos^{2}t\right)dt
      $$

      El segundo es cero —es $-4\int\operatorname{sen}4t\,dt$ sobre un periodo
      entero— y el primero usa
      $\operatorname{sen}^{4}+\cos^{4} = 1-\frac12\operatorname{sen}^{2}2t$,
      que integra a $\frac{3\pi}{4}$. Total: $-16\cdot\frac{3\pi}{4} = -12\pi$.

  - id: ex2324-5ev-2-el-plan-de-ahorro
    titulo: Cien euros al año al uno por ciento, y cuándo llegan a cinco mil
    fuente: >-
      Ejercicio 2 · Quinta evaluación, 13 de mayo de 2024 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Has contratado un plan de ahorro en un banco. El dinero se acumula de la
      siguiente forma: tú ingresas cada año 100 € y el banco te da un interés
      anual del 1 % del saldo.

      a) Escribir un modelo matemático (EDO) que permita calcular el dinero que
      tienes en el plan de ahorro a medida que pasen los años.

      b) Resolver la EDO obtenida en el apartado anterior.

      c) Si comenzaste el plan de ahorro hace 5 años y ahora tienes 1.000 €,
      ¿cuánto aportaste inicialmente al plan de ahorro?

      d) ¿Cuándo tendrás 5.000 €?

      *Nota: dejar indicadas las operaciones a efectuar con la calculadora.*
    pide: El modelo, su solución, la aportación inicial y el año en que se llega a 5.000 €.

    pasos:
      - tipo: reconocer
        pregunta: |
          «Ingresas 100 € al año» y «el banco da el 1 % del saldo». ¿Cómo
          entran esas dos frases en la ecuación?
        opciones:
          - texto: >-
              La primera como un término constante y la segunda como un término
              proporcional a $y$
            correcta: true
            mensaje: |
              Exacto: $y' = 0{,}01\,y + 100$. Los ingresos no dependen de cuánto
              tengas —son 100 pase lo que pase— y los intereses sí. Esa mezcla
              es la que hace que la ecuación sea lineal y no de variables
              separadas puras.
          - texto: Las dos como términos proporcionales a $y$
            mensaje: |
              Los 100 € no dependen del saldo: ingresas lo mismo tengas 500 o
              5000. Ponerlos como $100y$ significaría ingresar más cuanto más
              tengas.
          - texto: Las dos como constantes
            mensaje: |
              El interés sí depende del saldo: el 1 % de 1000 no es el 1 % de
              5000. Si fuera constante, el dinero crecería en línea recta y no
              habría nada que integrar.
          - texto: >-
              La primera como condición inicial y la segunda como el término
              de la ecuación
            mensaje: |
              La condición inicial es cuánto había **al empezar**, y eso es
              justo lo que el apartado c) pide averiguar. Los 100 € anuales son
              un aporte continuo, no un valor de partida.

      - tipo: calcular
        titulo: La aportación inicial
        pregunta: |
          Si hace 5 años empezaste y hoy tienes 1.000 €, ¿cuánto aportaste al
          principio?
        respuesta:
          tipo: numero
          valor: '463.5237'
          tolerancia: 0.05
          formato: en forma exacta o con dos decimales
        distractores:
          - valor: '500'
            mensaje: |
              500 sería la respuesta si el dinero no generara intereses:
              $1000 - 5\times 100$. Pero el saldo va creciendo y sus intereses
              también aportan, así que hizo falta poner algo menos.
          - valor: '952.3810'
            mensaje: |
              Eso es $1000/1{,}05$: has aplicado un 1 % anual simple durante
              cinco años sobre el total y te has olvidado de los 100 € anuales.
          - valor: '10463.5237'
            mensaje: |
              Ese es el valor de la constante $C = 11000\,e^{-0{,}05}$, no la
              aportación. La aportación es $y(0) = C - 10000$.
        pista: |
          La solución general es $y(t) = Ce^{0{,}01t} - 10000$. Impón
          $y(5) = 1000$ para hallar $C$, y después calcula $y(0)$.
        desarrollo: |
          $$
          y(5) = C e^{0{,}05} - 10000 = 1000
          \;\Longrightarrow\;
          C = 11000\,e^{-0{,}05}
          $$

          $$
          y(0) = C - 10000 = 11000\,e^{-0{,}05} - 10000 \approx 463{,}52\ \text{euros}
          $$

          Menos de 500, y tiene sentido: en esos cinco años los 500 € de
          ingresos han rentado además sus propios intereses, así que hizo falta
          poner algo menos al principio.

      - tipo: calcular
        titulo: Cuándo se llega a 5.000 €
        pregunta: |
          ¿Cuántos años después del inicio del plan tendrás 5.000 €?
        respuesta:
          tipo: numero
          valor: '36.0155'
          tolerancia: 0.02
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '31.0155'
            mensaje: |
              Esos son los años que faltan **desde hoy**, y es una respuesta
              razonable si se dice así. Pero el reloj de la ecuación arranca al
              contratar el plan, y desde ahí son 5 años más.
          - valor: '40'
            mensaje: |
              40 sería si el dinero solo viniera de los ingresos:
              $(5000-463{,}52)/100 \approx 45$ años, y ni siquiera eso. Los
              intereses aceleran, así que se tarda menos.
          - valor: '3.6016'
            mensaje: |
              Te falta un factor 100. De $0{,}01t = \ln\frac{15}{11} + 0{,}05$
              sale $t = 100\left[\ln\frac{15}{11}+0{,}05\right]$.
        pista: |
          Resuelve $Ce^{0{,}01t} - 10000 = 5000$ con
          $C = 11000e^{-0{,}05}$. El $e^{-0{,}05}$ se junta con el exponente.
        desarrollo: |
          $$
          C e^{0{,}01t} = 15000
          \;\Longrightarrow\;
          e^{0{,}01t} = \frac{15000}{11000\,e^{-0{,}05}} = \frac{15}{11}\,e^{0{,}05}
          $$

          $$
          0{,}01\,t = \ln\frac{15}{11} + 0{,}05
          \;\Longrightarrow\;
          t = 100\left(\ln\frac{15}{11} + 0{,}05\right) \approx 36{,}02\ \text{años}
          $$

          Contados **desde que se contrató el plan**. Como han pasado 5, faltan
          unos 31 años a partir de hoy. Conviene decir las dos cifras: el
          enunciado pregunta «cuándo», y la referencia temporal es parte de la
          respuesta.

      - tipo: justificar
        titulo: El modelo y su solución
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El saldo cambia por dos motivos: los 100 € que ingresas, que no
              dependen del saldo, y el 1 % de intereses, que sí.
          - texto: >-
              El modelo es $y' = 0{,}01\,y + 100$, con $t$ en años y $y$ en
              euros.
          - texto: >-
              Es lineal de primer orden, y también de variables separables:
              $\frac{dy}{0{,}01y+100} = dt$.
          - texto: >-
              Integrando, $y(t) = C\,e^{0{,}01t} - 10000$, donde $-10000$ es la
              solución de equilibrio: $0{,}01y+100 = 0$ da $y = -10000$.
          - texto: >-
              De $y(5) = 1000$ sale $C = 11000\,e^{-0{,}05}$, y la aportación
              inicial es $y(0) = C - 10000 \approx 463{,}52$ €.
          - texto: >-
              De $y(t) = 5000$ sale
              $t = 100\left(\ln\frac{15}{11}+0{,}05\right) \approx 36$ años
              desde el inicio, o sea unos 31 a partir de hoy.
          - texto: >-
              El $-10000$ de la solución significa que el plan tiene una deuda
              inicial de diez mil euros.
            trampa: true
            mensaje: |
              No significa nada financiero: es la **solución de equilibrio** de
              la ecuación, el saldo en el que los intereses compensarían
              exactamente los ingresos. Como es negativo, ninguna cuenta real
              está ahí, y por eso todas las soluciones con saldo positivo
              crecen. Confundir un término matemático de la solución general
              con un hecho del problema es el error clásico de los modelos.

    resolucion: |
      ## a) El modelo

      Dos aportes al ritmo de cambio del saldo:

      | de dónde viene | término |
      |---|---|
      | los 100 € que ingresas al año, pase lo que pase | $+100$ |
      | el 1 % anual de intereses sobre el saldo | $+0{,}01\,y$ |

      $$
      \boxed{\;y'(t) = 0{,}01\,y + 100\;}
      $$

      con $t$ en años y $y$ en euros. Es una **lineal de primer orden** con
      coeficientes constantes, y también separable.

      ## b) Resolverla

      $$
      \frac{dy}{0{,}01y+100} = dt
      \;\Longrightarrow\;
      100\ln\left|0{,}01y+100\right| = t + k
      $$

      $$
      y(t) = C\,e^{0{,}01t} - 10000
      $$

      El $-10000$ es la solución de equilibrio: el saldo en el que
      $0{,}01y+100$ valdría cero. Es negativo, así que ninguna cuenta real
      empieza ahí y todas las soluciones con dinero dentro crecen.

      ## c) La aportación inicial

      «Hace 5 años» fija el origen del tiempo en la contratación, así que hoy
      es $t = 5$:

      $$
      C\,e^{0{,}05} - 10000 = 1000 \;\Longrightarrow\; C = 11000\,e^{-0{,}05}
      $$

      $$
      y(0) = C - 10000 = 11000\,e^{-0{,}05} - 10000 \approx 463{,}52\ \text{euros}
      $$

      **Menos de 500 €**, y conviene decir por qué: en cinco años se han
      ingresado 500 € más, pero además todo ese dinero ha generado intereses,
      así que la aportación inicial pudo ser menor.

      ## d) Cuándo se llega a 5.000 €

      $$
      C\,e^{0{,}01t} = 15000
      \;\Longrightarrow\;
      e^{0{,}01t} = \frac{15}{11}e^{0{,}05}
      \;\Longrightarrow\;
      t = 100\left(\ln\frac{15}{11} + 0{,}05\right)
      $$

      $$
      t \approx 36{,}02\ \text{años desde que se contrató}
      $$

      o sea unos **31 años a partir de hoy**. Las dos cifras valen: la pregunta
      es «cuándo», y sin decir desde dónde se cuenta la respuesta está a medias.

      ## Sobre la nota del enunciado

      «Dejar indicadas las operaciones a efectuar con la calculadora» significa
      que la respuesta buena es $11000\,e^{-0{,}05}-10000$ y
      $100\left(\ln\frac{15}{11}+0{,}05\right)$, **escritas así**. No hay
      calculadora en el examen, y poner un decimal inventado vale menos que
      dejar la expresión exacta.

  - id: ex2324-5ev-3-deducir-el-coeficiente-y-resolver
    titulo: Un coeficiente que hay que deducir antes de poder empezar
    fuente: >-
      Ejercicio 3 · Quinta evaluación, 13 de mayo de 2024 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Sabiendo que $y = e^{2x}$ es una solución de la ecuación
      $y'' + a\,y' = 0$, resolver la EDO
      $y'' + a\,y' = 3e^{2x} + 10\cos(2x)$.
    pide: El valor de a y la solución general de la ecuación completa.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Para qué sirve el dato de que $y = e^{2x}$ resuelve la homogénea?
        opciones:
          - texto: >-
              Para deducir $a$, sustituyéndola en la ecuación homogénea
            correcta: true
            mensaje: |
              Eso es, y hay que hacerlo antes de nada: sin $a$ no hay ecuación
              que resolver. Sustituyendo, $4e^{2x} + 2a\,e^{2x} = 0$, y como
              $e^{2x}$ nunca se anula, $4+2a = 0$.
          - texto: >-
              Para usarla como solución particular de la ecuación completa
            mensaje: |
              Es solución de la **homogénea**, no de la completa: al sustituirla
              en la completa daría 0, no $3e^{2x}+10\cos 2x$. Lo que sí implica
              es que $3e^{2x}$ va a resonar.
          - texto: Para saber que la solución general lleva un $e^{2x}$
            mensaje: |
              Eso también, y es cierto — pero es una consecuencia, no el uso
              principal. El dato existe porque sin él la ecuación tiene un
              parámetro desconocido y no se puede resolver.
          - texto: >-
              Para comprobar al final que la solución obtenida es correcta
            mensaje: |
              Comprobar siempre está bien, pero aquí el dato es **necesario**,
              no opcional: el enunciado escribe una $a$ que no se conoce por
              ningún otro sitio.

      - tipo: calcular
        titulo: El coeficiente
        pregunta: |
          ¿Cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Signo. De $4e^{2x} + 2a\,e^{2x} = 0$ sale $2a = -4$, así que $a$
              es negativo.
          - valor: '-4'
            mensaje: |
              $-4$ sería si la ecuación fuera $y''+ay = 0$: entonces
              $4 + a = 0$. Pero el término lleva $y'$, cuya derivada aporta un
              factor 2 más: $4 + 2a = 0$.
          - valor: '0.5'
            mensaje: |
              Has despejado al revés. De $4 + 2a = 0$ sale $a = -4/2 = -2$.
        pista: |
          Sustituye $y = e^{2x}$: $y' = 2e^{2x}$ e $y'' = 4e^{2x}$. Y $e^{2x}$
          no se anula nunca, así que se puede dividir por él.
        desarrollo: |
          $$
          y''+a\,y' = 4e^{2x} + 2a\,e^{2x} = e^{2x}(4+2a) = 0
          $$

          Como $e^{2x} \neq 0$ para todo $x$, queda $4+2a = 0$, o sea

          $$
          a = -2
          $$

          y la ecuación a resolver es $y'' - 2y' = 3e^{2x} + 10\cos 2x$.

      - tipo: calcular
        titulo: El coeficiente del término que resuena
        pregunta: |
          Ensayando $y_{p} = A\,x\,e^{2x}$ para el sumando $3e^{2x}$, ¿cuánto
          vale $A$?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.002
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.75'
            mensaje: |
              $3/4$: has igualado $4A = 3$. Al sustituir sobrevive $2A e^{2x}$,
              no $4Ae^{2x}$: los términos con $x$ se cancelan y de los otros
              quedan $4A - 2A$.
          - valor: '3'
            mensaje: |
              3 es el coeficiente del enunciado. Hay que dividirlo por lo que
              salga al sustituir el ensayo, que es 2.
          - valor: '-1.5'
            mensaje: |
              Signo. $2A = 3$ da $A$ positivo.
        pista: |
          Con $y_{p} = Axe^{2x}$: $y_{p}' = Ae^{2x}(1+2x)$ e
          $y_{p}'' = Ae^{2x}(4+4x)$. Réstalos según pide la ecuación y mira qué
          queda.
        desarrollo: |
          $$
          y_{p}'' - 2y_{p}'
          = Ae^{2x}(4+4x) - 2Ae^{2x}(1+2x)
          = Ae^{2x}\left(4+4x-2-4x\right) = 2Ae^{2x}
          $$

          Los términos con $x$ se cancelan —esa cancelación **es** la
          resonancia— y queda $2A = 3$, o sea $A = \dfrac32$.

          Hace falta la $x$ delante porque $r=2$ **es** raíz de la
          característica $r^{2}-2r = 0$: sin ella, el ensayo $Ae^{2x}$ daría
          $0 = 3e^{2x}$, que no tiene solución.

      - tipo: justificar
        titulo: La solución general
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Sustituyendo $y = e^{2x}$ en $y''+ay' = 0$ sale $4+2a = 0$, luego
              $a = -2$.
          - texto: >-
              La característica de $y''-2y' = 0$ es $r^{2}-2r = r(r-2) = 0$,
              con raíces $r=0$ y $r=2$: $y_{h} = C_{1} + C_{2}e^{2x}$.
          - texto: >-
              El sumando $3e^{2x}$ **resuena**, porque $e^{2x}$ está en la
              homogénea: el ensayo es $Axe^{2x}$ y da $A = \frac32$.
          - texto: >-
              El sumando $10\cos 2x$ no resuena: el ensayo
              $B\cos 2x + C\operatorname{sen}2x$ da
              $-4B-4C = 10$ y $4B-4C = 0$, o sea $B = C = -\frac54$.
          - texto: >-
              La solución general es
              $y = C_{1} + C_{2}e^{2x} + \frac32 xe^{2x}
              - \frac54\left(\cos 2x + \operatorname{sen}2x\right)$.
          - texto: >-
              El término $10\cos 2x$ también resuena, porque el 2 de $\cos 2x$
              coincide con la raíz $r = 2$.
            trampa: true
            mensaje: |
              El 2 de $\cos 2x$ corresponde a las raíces **imaginarias**
              $\pm 2i$, y las de esta ecuación son $0$ y $2$, reales. Resonaría
              si la característica tuviera $\pm 2i$ entre sus raíces, es decir
              si la homogénea contuviera $\cos 2x$ — y no la contiene: contiene
              una constante y una exponencial. Compartir el número 2 no es
              compartir la solución.

    resolucion: |
      ## Primero, el coeficiente

      El dato no es decorativo: sin él la ecuación tiene un parámetro libre.
      Sustituyendo $y = e^{2x}$ en la homogénea:

      $$
      4e^{2x} + 2a\,e^{2x} = e^{2x}\left(4+2a\right) = 0
      \;\Longrightarrow\;
      a = -2
      $$

      —usando que $e^{2x}$ no se anula nunca, que es lo que permite dividir.

      La ecuación a resolver es, por tanto,

      $$
      y'' - 2y' = 3e^{2x} + 10\cos 2x
      $$

      ## La homogénea

      $$
      r^{2}-2r = r(r-2) = 0
      \;\Longrightarrow\;
      r = 0,\; r = 2
      \;\Longrightarrow\;
      y_{h} = C_{1} + C_{2}e^{2x}
      $$

      La raíz $r=0$ aporta la constante $C_{1}$, que es fácil de olvidar: la
      ecuación no tiene término en $y$, así que cualquier constante la
      satisface.

      ## Dos sumandos, y solo uno resuena

      **$3e^{2x}$ — resuena**, porque $e^{2x}$ está en $y_{h}$. Ensayo con $x$
      delante:

      $$
      y_{p_{1}} = Axe^{2x}
      \;\Longrightarrow\;
      y_{p_{1}}''-2y_{p_{1}}' = 2Ae^{2x} = 3e^{2x}
      \;\Longrightarrow\;
      A = \frac32
      $$

      **$10\cos 2x$ — no resuena.** Las raíces son reales, así que la homogénea
      no contiene ni $\cos 2x$ ni $\operatorname{sen}2x$:

      $$
      y_{p_{2}} = B\cos 2x + C\operatorname{sen}2x
      $$
      $$
      y_{p_{2}}''-2y_{p_{2}}'
      = \left(-4B-4C\right)\cos 2x + \left(4B-4C\right)\operatorname{sen}2x
      = 10\cos 2x
      $$

      De la segunda ecuación $B = C$, y sustituyendo en la primera
      $-8B = 10$:

      $$
      B = C = -\frac54
      $$

      ## La solución

      $$
      \boxed{\;y = C_{1} + C_{2}e^{2x} + \frac32\,x\,e^{2x}
      - \frac54\left(\cos 2x + \operatorname{sen}2x\right)\;}
      $$

      ## El error que el enunciado invita a cometer

      Ver un 2 en $\cos 2x$ y otro 2 en la raíz $r=2$, y concluir que también
      resuena. No es lo mismo: la raíz real $2$ produce $e^{2x}$, y para que
      apareciera $\cos 2x$ en la homogénea harían falta raíces $\pm 2i$.
      Resonar es **ser solución de la homogénea**, no compartir un número con
      ella.
