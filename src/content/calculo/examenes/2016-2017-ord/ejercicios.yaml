ejercicios:
  - id: ex1617-ord-1-las-seis-raices-y-su-hexagono
    titulo: Seis raíces, un hexágono y un perímetro que sale redondo
    fuente: >-
      Ejercicio 1 del PRIMER CUATRIMESTRAL · Convocatoria de mayo, 29 de mayo de
      2017 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3
    enunciado: |
      a) Hallar y representar gráficamente las raíces sextas de la unidad:
      $z=\sqrt[6]{1}$.

      b) Hallar el perímetro del polígono obtenido al unir los afijos de dichas
      raíces.
    pide: Las seis raíces, su dibujo y el perímetro del hexágono.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo están repartidas las $n$ raíces $n$-ésimas de un complejo?
        opciones:
          - texto: >-
              En los vértices de un polígono regular de $n$ lados inscrito en la
              circunferencia de radio $\sqrt[n]{\left|z\right|}$
            correcta: true
            mensaje: |
              Eso es. Todas tienen el mismo módulo —la raíz $n$-ésima del módulo—
              y sus argumentos se separan exactamente $\frac{2\pi}{n}$. Aquí
              $\left|z\right|=1$, así que las seis están en la circunferencia
              unidad, separadas $60^{\circ}$.
          - texto: >-
              En una recta que pasa por el origen
            mensaje: |
              Eso pasaría si todas tuvieran el mismo argumento o argumentos que
              difirieran en $\pi$, y solo ocurre con $n=1$ o $n=2$. Con $n=6$ hay
              seis direcciones distintas.
          - texto: >-
              Todas en el eje real, porque el $1$ es real
            mensaje: |
              Solo dos de las seis lo son, $1$ y $-1$. Que el radicando sea real
              no obliga a que las raíces lo sean: precisamente por eso se
              trabaja en $\mathbb{C}$.

      - tipo: calcular
        titulo: El paso entre raíces
        pregunta: |
          ¿Cuántos grados separan dos raíces consecutivas?
        respuesta:
          tipo: numero
          valor: '60'
          tolerancia: 0.001
          formato: un número de grados
        distractores:
          - valor: '30'
            mensaje: |
              $30^{\circ}$ saldría de repartir media vuelta entre seis. Las
              raíces se reparten la vuelta **entera**:
              $\frac{360^{\circ}}{6}$.
          - valor: '6'
            mensaje: |
              El $6$ es el número de raíces, no el ángulo. El ángulo es
              $\frac{2\pi}{6}$ radianes, o sea $60^{\circ}$.
          - valor: '72'
            mensaje: |
              $72^{\circ}$ es el paso de las raíces **quintas**,
              $\frac{360^{\circ}}{5}$. Cuenta otra vez cuántas hay.
        pista: |
          Los argumentos son $\frac{2\pi k}{6}$ con $k=0,1,\dots,5$.
        desarrollo: |
          $$
          z_{k}=\cos\frac{2\pi k}{6}+i\operatorname{sen}\frac{2\pi k}{6},
          \qquad k=0,1,2,3,4,5
          $$

          Entre una y la siguiente hay $\frac{2\pi}{6}=\frac\pi3$ radianes, es
          decir $60^{\circ}$.

      - tipo: calcular
        titulo: El perímetro
        pregunta: |
          ¿Cuánto vale el perímetro del hexágono?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '6.2831853'
            mensaje: |
              $2\pi$ es la longitud de la **circunferencia**, no del hexágono
              inscrito. El polígono va por dentro, así que su perímetro tiene
              que ser algo menor: $6<2\pi\approx6{,}28$.
          - valor: '5.1961524'
            mensaje: |
              $3\sqrt3$ es el perímetro si el lado fuera $\frac{\sqrt3}{2}$, que
              es la **apotema**, no el lado. En un hexágono regular el lado
              coincide con el radio.
          - valor: '12'
            mensaje: |
              Doce sería el perímetro con lado $2$, es decir con radio $2$. Aquí
              el radio es $1$: las raíces de la **unidad** tienen módulo $1$.
        pista: |
          En un hexágono regular inscrito, el lado mide lo mismo que el radio.
        desarrollo: |
          El lado es la distancia entre dos raíces consecutivas:

          $$
          \ell=2\operatorname{sen}\frac{\pi}{6}=2\cdot\frac12=1
          $$

          $$
          \text{perímetro}=6\ell=6
          $$

          Que el lado valga exactamente el radio es propio del hexágono: los
          seis triángulos que forman el centro con dos vértices consecutivos son
          equiláteros, porque tienen dos lados iguales al radio y el ángulo
          entre ellos vale $60^{\circ}$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $1=1\cdot e^{i0}$, así que sus raíces sextas tienen módulo
              $\sqrt[6]{1}=1$ y argumentos $\frac{0+2\pi k}{6}$ con
              $k=0,\dots,5$.
          - texto: >-
              Son seis puntos sobre la circunferencia unidad separados
              $60^{\circ}$: los vértices de un hexágono regular con un vértice
              en el $1$.
          - texto: >-
              El triángulo que forman el centro y dos vértices consecutivos
              tiene dos lados iguales al radio y $60^{\circ}$ entre ellos, luego
              es equilátero y el lado vale $1$. El perímetro es $6$.
          - texto: >-
              Como el hexágono está inscrito en la circunferencia unidad, su
              perímetro coincide con la longitud de la circunferencia, $2\pi$.
            trampa: true
            mensaje: |
              Coincidir no coinciden: el hexágono va por dentro y su perímetro
              es **menor**, $6$ frente a $2\pi\approx6{,}28$. Se parecen —un
              $4\,\%$— y de ahí la trampa: con más lados la diferencia se
              encoge, y de hecho ese es el método de Arquímedes para acotar
              $\pi$. Pero seis lados no son infinitos.
    resolucion: |
      **a) Las seis raíces.** Se escribe el $1$ en forma polar, $1=e^{i0}$, y se
      aplica la fórmula de las raíces:

      $$
      z_{k}=\sqrt[6]{1}\;e^{i\frac{0+2\pi k}{6}}=e^{i\frac{\pi k}{3}},
      \qquad k=0,1,2,3,4,5
      $$

      $$
      1,\quad
      \tfrac12+\tfrac{\sqrt3}{2}i,\quad
      -\tfrac12+\tfrac{\sqrt3}{2}i,\quad
      -1,\quad
      -\tfrac12-\tfrac{\sqrt3}{2}i,\quad
      \tfrac12-\tfrac{\sqrt3}{2}i
      $$

      Todas de módulo $1$ y separadas $60^{\circ}$.

      <figure class="figura-examen">
      <svg viewBox="0 0 380 360" role="img" width="380" height="360"
           aria-labelledby="hex17-t hex17-d">
        <title id="hex17-t">El hexagono de las seis raices de la unidad</title>
        <desc id="hex17-d">Seis puntos repartidos regularmente sobre la
        circunferencia de radio uno, separados sesenta grados, unidos por un hexagono
        regular. Uno de ellos es el uno del eje real. Como el hexagono es regular y
        esta inscrito en una circunferencia de radio uno, cada lado mide uno y el
        perimetro vale seis.</desc>
        <style>
          .hex17-c { stroke: var(--graphite); stroke-width: 1.3; fill: none; stroke-dasharray: 6 5; }
          .hex17-h { fill: var(--live); fill-opacity: .13; stroke: var(--live); stroke-width: 2.4; }
          .hex17-eje { stroke: var(--graphite); stroke-width: 1.2; fill: none; }
          .hex17-pt { fill: var(--live); }
          .hex17-n { fill: var(--faint); font-size: 11px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
          .hex17-et { fill: var(--live); font-size: 11px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round; }
        </style>
        <path class="hex17-eje" d="M33.6 175L346.4 175M190 317.6L190 32.4"/>
        <circle class="hex17-c" cx="190" cy="175" r="92"/>
        <path class="hex17-h" d="M282 175L236 95.3L144 95.3L98 175L144 254.7L236 254.7Z"/>
        <circle class="hex17-pt" cx="282" cy="175" r="4"/>
        <circle class="hex17-pt" cx="236" cy="95.3" r="4"/>
        <circle class="hex17-pt" cx="144" cy="95.3" r="4"/>
        <circle class="hex17-pt" cx="98" cy="175" r="4"/>
        <circle class="hex17-pt" cx="144" cy="254.7" r="4"/>
        <circle class="hex17-pt" cx="236" cy="254.7" r="4"/>
        <g class="hex17-n">
          <text x="350.4" y="189">x</text>
          <text x="196" y="34.4">y</text>
        </g>
        <text class="hex17-et" x="292" y="191" text-anchor="start">1</text>
        <text class="hex17-et" x="244" y="87.3" text-anchor="start">½ + (√3/2)i</text>
        <text class="hex17-et" x="136" y="87.3" text-anchor="end">−½ + (√3/2)i</text>
        <text class="hex17-et" x="88" y="191" text-anchor="end">−1</text>
        <text class="hex17-et" x="136" y="270.7" text-anchor="end">−½ − (√3/2)i</text>
        <text class="hex17-et" x="244" y="270.7" text-anchor="start">½ − (√3/2)i</text>
      </svg>
      <figcaption>
      Las seis raíces sextas de la unidad y el hexágono que forman. Está
      inscrito en la circunferencia de radio 1 y tiene un vértice en el 1.
      </figcaption>
      </figure>

      **b) El perímetro, sin calcular distancias.** El lado del hexágono une dos
      raíces consecutivas:

      $$
      \ell=\left|z_{1}-z_{0}\right|=2\operatorname{sen}\frac{\pi}{6}=1
      $$

      Pero hay una vía más limpia y vale como explicación formal: el centro y
      dos vértices consecutivos forman un triángulo con dos lados iguales al
      radio y $60^{\circ}$ entre ellos. Un triángulo isósceles con el ángulo
      desigual de $60^{\circ}$ es equilátero, así que el tercer lado también
      mide $1$.

      $$
      \boxed{\;\text{perímetro}=6\;}
      $$

      **La comprobación que conviene hacer.** El hexágono está inscrito, así que
      su perímetro tiene que ser **menor** que la longitud de la
      circunferencia, $2\pi\approx6{,}283$. Sale $6$: un $4\,\%$ por debajo,
      razonable para seis lados. Si a alguien le saliera más de $6{,}28$,
      sabría que se ha equivocado sin repasar una sola cuenta.

  - id: ex1617-ord-2-el-valor-intermedio-demostrado
    titulo: Demostrar que una función continua no se salta ningún valor
    fuente: >-
      Ejercicio 2 del PRIMER CUATRIMESTRAL · Convocatoria de mayo, 29 de mayo de
      2017 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 0
      comp4: 8
    enunciado: |
      Demostrar la siguiente propiedad:

      Sea $y(x)$ una función continua en $[a,b]$. Entonces:

      $$
      \forall H\in[m,M]\ \ \exists x\in[a,b]\ /\ y(x)=H
      $$

      donde $m$ y $M$ son el máximo y el mínimo, respectivamente, de $y(x)$ en
      $[a,b]$.
    pide: La demostración, con los teoremas que se usan nombrados.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dos teoremas hacen falta para demostrar esta propiedad?
        opciones:
          - texto: >-
              Weierstrass, para saber que el máximo y el mínimo **se alcanzan**,
              y Bolzano, para encontrar el punto intermedio
            correcta: true
            mensaje: |
              Eso es, y el orden importa. Sin Weierstrass no hay puntos donde la
              función valga $m$ y $M$; con ellos, Bolzano aplicado a $y(x)-H$
              entre esos dos puntos da el $x$ que se busca.
          - texto: Solo Bolzano
            mensaje: |
              Bolzano necesita dos puntos donde la función tome valores de signo
              contrario. Aquí hay que **producirlos**, y eso lo da Weierstrass:
              que el mínimo y el máximo no son solo ínfimo y supremo, sino
              valores que la función alcanza de verdad.
          - texto: Rolle y Lagrange
            mensaje: |
              Esos dos hablan de derivadas, y aquí no se supone que $y$ sea
              derivable: solo continua. Usarlos añadiría una hipótesis que el
              enunciado no da.

      - tipo: calcular
        titulo: El teorema en un caso concreto
        pregunta: |
          Para $y(x)=x^{3}-3x$ en $[0,2]$, ¿en qué punto se alcanza el mínimo?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              En $x=0$ la función vale $0$, y en $x=1$ vale $-2$: hay valores
              más pequeños. Los extremos del intervalo son candidatos, pero hay
              que compararlos con los puntos críticos interiores.
          - valor: '2'
            mensaje: |
              En $x=2$ la función vale $8-6=2$, que es el **máximo** del
              intervalo, no el mínimo.
          - valor: '-1'
            mensaje: |
              $-1$ es el otro punto crítico de $x^{3}-3x$, pero está **fuera**
              de $[0,2]$. Weierstrass solo garantiza extremos dentro del
              intervalo cerrado que se está mirando.
        pista: |
          $y'=3x^{2}-3$ se anula en $\pm1$; compara $y$ en $0$, en $1$ y en $2$.
        desarrollo: |
          $$
          y(0)=0,\qquad y(1)=-2,\qquad y(2)=2
          $$

          Mínimo $m=-2$ en $x=1$ y máximo $M=2$ en $x=2$. Y en efecto, todo
          $H\in[-2,2]$ se alcanza: la función recorre el intervalo entero al ir
          de $x=1$ a $x=2$.

      - tipo: justificar
        pregunta: Ordena la demostración. Una pieza es falsa.
        piezas:
          - texto: >-
              Por el teorema de Weierstrass, una función continua en un
              intervalo **cerrado y acotado** alcanza su mínimo y su máximo:
              existen $x_{1},x_{2}\in[a,b]$ con $y(x_{1})=m$ e $y(x_{2})=M$.
          - texto: >-
              Sea $H\in[m,M]$. Si $H=m$ o $H=M$ ya está: sirven $x_{1}$ o
              $x_{2}$. Supongamos entonces $m<H<M$.
          - texto: >-
              Se considera $h(x)=y(x)-H$, continua, en el intervalo cerrado de
              extremos $x_{1}$ y $x_{2}$. Allí $h(x_{1})=m-H<0$ y
              $h(x_{2})=M-H>0$.
          - texto: >-
              Como $h$ cambia de signo, el teorema de Rolle garantiza un punto
              interior donde $h$ se anula, y ese es el $x$ buscado.
            trampa: true
            mensaje: |
              El teorema que garantiza un cero cuando hay cambio de signo es
              **Bolzano**, no Rolle. Rolle dice otra cosa —que entre dos puntos
              con el mismo valor hay uno con derivada nula— y además exige
              derivabilidad, que aquí no se supone. Cambiar un nombre por otro
              en una demostración de ocho puntos de explicación formal cuesta
              casi todo el ejercicio.
    resolucion: |
      **Antes de nada, una errata del enunciado.** Dice «$m$ y $M$ son el máximo
      y el mínimo, **respectivamente**», y eso pondría el máximo primero. Pero
      entonces $[m,M]$ sería un intervalo al revés y estaría vacío. Lo que se
      quiere decir —y lo que todo el mundo entiende— es $m=\min$ y $M=\max$. Se
      reproduce el enunciado tal cual y se aclara, que es lo honesto.

      **Qué se está pidiendo.** Es el teorema del **valor intermedio** en su
      forma fuerte: una función continua en un cerrado toma **todos** los
      valores entre su mínimo y su máximo. Dicho de otro modo, su imagen es el
      intervalo $[m,M]$ entero, sin agujeros.

      **La demostración, en tres pasos.**

      **1 · Weierstrass.** $y$ es continua en $[a,b]$, cerrado y acotado, así
      que **alcanza** su mínimo y su máximo: existen $x_{1},x_{2}\in[a,b]$ con

      $$
      y(x_{1})=m,\qquad y(x_{2})=M
      $$

      Este paso es el que suele olvidarse, y sin él no hay nada que hacer: que
      $m$ sea el ínfimo no garantiza que la función lo tome.

      **2 · Los casos triviales.** Si $H=m$ sirve $x=x_{1}$; si $H=M$ sirve
      $x=x_{2}$. Queda por ver $m<H<M$.

      **3 · Bolzano.** Sea $h(x)=y(x)-H$, continua por serlo $y$. En el
      intervalo cerrado de extremos $x_{1}$ y $x_{2}$ —contenido en $[a,b]$, sea
      cual sea el orden en que estén— se tiene

      $$
      h(x_{1})=m-H<0,
      \qquad
      h(x_{2})=M-H>0
      $$

      Bolzano da entonces un punto $x$ entre $x_{1}$ y $x_{2}$ con $h(x)=0$, es
      decir $y(x)=H$. $\blacksquare$

      **Las dos hipótesis, y por qué cada una hace falta.**

      - **Cerrado.** En $(0,1]$ la función $y(x)=x$ es continua y no alcanza
        ínfimo: no hay mínimo que usar.
      - **Continua.** La función que vale $0$ en $[0,1)$ y $1$ en $[1,2]$ tiene
        mínimo $0$ y máximo $1$, y no toma ningún valor intermedio.

      Decir esto no es relleno: en un ejercicio con **ocho de los diez puntos en
      la explicación formal**, señalar dónde se usa cada hipótesis es
      exactamente lo que se está evaluando.

  - id: ex1617-ord-3-la-parabola-y-su-tangente
    titulo: Un recinto entre una parábola y su tangente, y el sólido que engendra
    fuente: >-
      Ejercicio 3 del PRIMER CUATRIMESTRAL · Convocatoria de mayo, 29 de mayo de
      2017 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3
    enunciado: |
      Dada la función $y=4x^{2}$ se pide:

      a) Calcular el área del recinto situado en el primer cuadrante y limitado
      por la curva y su tangente que es paralela a la recta $y=8x$.

      b) Calcular el volumen del sólido engendrado al girar el recinto alrededor
      del eje OX.
    pide: El área del recinto y el volumen de revolución.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se localiza el punto de tangencia?
        opciones:
          - texto: >-
              Igualando la derivada a la pendiente de la recta dada:
              $y'=8x=8$
            correcta: true
            mensaje: |
              Eso es. «Tangente paralela a $y=8x$» significa que tiene la misma
              pendiente, $8$; y la pendiente de la tangente en un punto es la
              derivada allí. De $8x=8$ sale $x=1$, y el punto es $(1,4)$.
          - texto: >-
              Resolviendo $4x^{2}=8x$
            mensaje: |
              Eso da los puntos donde la parábola **corta** a la recta $y=8x$,
              que son $x=0$ y $x=2$. Cortar no es ser tangente: la tangente que
              se busca es paralela a esa recta, no esa recta.
          - texto: >-
              Buscando el vértice de la parábola
            mensaje: |
              El vértice está en el origen y allí la tangente es horizontal, con
              pendiente $0$, no $8$. El punto de tangencia está más a la
              derecha.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área del recinto?
        respuesta:
          tipo: numero
          valor: '0.3333333'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.3333333'
            mensaje: |
              $\frac43$ es solo $\int_{0}^{1}4x^{2}dx$, el área bajo la
              parábola. Falta restar el triángulo que la tangente deja por
              debajo, de base $\frac12$ y altura $4$: área $1$.
          - valor: '2.3333333'
            mensaje: |
              Parece que has **sumado** el triángulo en vez de restarlo. El
              recinto está entre la parábola y la tangente, así que lo que hay
              debajo de la tangente no cuenta.
          - valor: '0.6666667'
            mensaje: |
              $\frac23$ saldría de tomar el triángulo con base $1$ en vez de
              $\frac12$. La tangente corta al eje $OX$ en $x=\frac12$, no en el
              origen.
        pista: |
          La tangente es $y=8x-4$ y corta al eje $OX$ en $x=\frac12$; el
          recinto se cierra con ese eje.
        desarrollo: |
          La tangente en $(1,4)$ es $y=4+8(x-1)=8x-4$, que corta al eje $OX$ en
          $x=\frac12$. El recinto del primer cuadrante está limitado por la
          parábola, la tangente y el eje $OX$:

          $$
          A=\int_{0}^{1}4x^{2}\,dx-\underbrace{\frac{1}{2}\cdot\frac12\cdot4}
          _{\text{triángulo}}
          =\frac43-1=\frac13
          $$

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen del sólido de revolución?
        respuesta:
          tipo: numero
          valor: '1.6755161'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '10.0530965'
            mensaje: |
              $\frac{16\pi}{5}$ es solo lo que engendra la parábola. Hay que
              restar lo que engendra el cono de la tangente,
              $\frac{8\pi}{3}$: al girar, el hueco de debajo de la tangente
              también gira.
          - valor: '1.0471976'
            mensaje: |
              $\frac{\pi}{3}$ es $\pi$ por el **área**. Un volumen de revolución
              no es el área por $\pi$: hay que integrar los cuadrados de los
              radios, no los radios.
          - valor: '8.3775804'
            mensaje: |
              $\frac{8\pi}{3}$ es solo el cono que engendra la tangente. Es lo
              que hay que **restar**, no el resultado.
        pista: |
          $V=\pi\int_{0}^{1}\left(4x^{2}\right)^{2}dx
          -\pi\int_{1/2}^{1}\left(8x-4\right)^{2}dx$.
        desarrollo: |
          $$
          \pi\int_{0}^{1}16x^{4}\,dx=\frac{16\pi}{5}
          $$

          $$
          \pi\int_{1/2}^{1}\left(8x-4\right)^{2}dx
          =\pi\left[\frac{(8x-4)^{3}}{24}\right]_{1/2}^{1}
          =\frac{64\pi}{24}=\frac{8\pi}{3}
          $$

          $$
          V=\frac{16\pi}{5}-\frac{8\pi}{3}=\frac{8\pi}{15}\approx1{,}6755
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              «Tangente paralela a $y=8x$» fija la pendiente en $8$; de
              $y'=8x=8$ sale $x=1$ y el punto de tangencia es $(1,4)$.
          - texto: >-
              La tangente es $y=8x-4$, que corta al eje $OX$ en $x=\frac12$;
              junto con la parábola y ese eje encierran el recinto del primer
              cuadrante.
          - texto: >-
              El área es $\int_{0}^{1}4x^{2}dx$ menos el triángulo de la
              tangente, $\frac43-1=\frac13$; y el volumen,
              $\frac{16\pi}{5}-\frac{8\pi}{3}=\frac{8\pi}{15}$.
          - texto: >-
              Como el recinto tiene área $\frac13$, al girarlo alrededor del eje
              $OX$ engendra un sólido de volumen $2\pi\cdot\frac13$ por el
              teorema de Pappus.
            trampa: true
            mensaje: |
              Pappus existe y funciona, pero no así: dice
              $V=2\pi\overline{y}\,A$, con $\overline{y}$ la **distancia del centroide al
              eje**, no $2\pi A$. Aquí $\overline{y}$ no vale $1$, así que el número
              no sale. Y comprobarlo es inmediato: $2\pi/3\approx2{,}09$ frente
              a los $1{,}68$ del resultado correcto.
    resolucion: |
      **El punto de tangencia.** «Paralela a $y=8x$» significa pendiente $8$:

      $$
      y'=8x=8\;\Longrightarrow\;x=1,\qquad y(1)=4
      $$

      $$
      \text{tangente:}\quad y=4+8(x-1)=8x-4
      $$

      **El recinto.** La tangente corta al eje $OX$ en $x=\frac12$. En el primer
      cuadrante, la parábola, la tangente y el propio eje encierran una región
      cerrada.

