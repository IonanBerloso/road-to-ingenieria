      <figcaption>
      La parábola, su tangente en (1,4) y el recinto sombreado. La tangente
      corta al eje horizontal en un medio, y ese corte es lo que cierra la
      región por abajo.
      </figcaption>
      </figure>

      **a) El área.** Se integra la parábola de $0$ a $1$ y se descuenta el
      triángulo que la tangente deja debajo, de base $\frac12$ y altura $4$:

      $$
      A=\int_{0}^{1}4x^{2}\,dx-\frac{1}{2}\cdot\frac12\cdot4
      =\frac43-1=\boxed{\;\frac13\;}
      $$

      **b) El volumen.** Al girar alrededor de $OX$, cada trozo de frontera
      barre una superficie de revolución. Se resta el sólido que engendra la
      tangente —un cono— del que engendra la parábola:

      $$
      V=\pi\int_{0}^{1}\left(4x^{2}\right)^{2}dx
      -\pi\int_{1/2}^{1}\left(8x-4\right)^{2}dx
      =\frac{16\pi}{5}-\frac{8\pi}{3}
      =\boxed{\;\frac{8\pi}{15}\;}\approx1{,}68
      $$

      **Los límites, que es donde se falla.** La parábola se integra desde $0$
      porque el recinto empieza en el origen; la tangente, solo desde
      $\frac12$, porque antes de ese punto está **por debajo** del eje y no
      forma parte de la frontera del recinto. Poner los mismos límites en las
      dos integrales es el error más frecuente y da
      $\frac{16\pi}{5}-\frac{56\pi}{3}$, un número negativo que delata el fallo
      solo.

