      ¿En cuál de las siguientes figuras está correctamente representada la
      curva de nivel correspondiente a la cota z=1.55? Razona tu respuesta.

      <figure class="figura-examen">
      <svg viewBox="0 0 590 205" role="img" width="590" height="205"
           aria-labelledby="op17-t op17-d">
        <title id="op17-t">Las tres opciones para la curva de cota uno coma cincuenta y cinco</title>
        <desc id="op17-d">Tres versiones de la misma figura. En la primera la curva
        nueva se dibuja pegada a la de cota uno coma sesenta; en la segunda, pegada a
        la de uno coma cincuenta; en la tercera, a media distancia entre las dos.</desc>
        <style>
          .niv17-c { stroke: var(--graphite); stroke-width: 1.4; fill: none; }
          .niv17-nueva { stroke: var(--live); stroke-width: 2; fill: none; }
          .niv17-fl { stroke: var(--alt); stroke-width: 1.2; fill: none; }
          .niv17-pt { fill: var(--alt); }
          .niv17-n { fill: var(--faint); font-size: 9px; font-family: var(--mono); }
          .niv17-rot { fill: var(--ink); font-size: 13px; font-family: var(--mono); font-weight: 700; }
