      **b) La serie.** $f(-t)=t=-f(t)$: **impar**. Así que $a_{n}=0$ para todo
      $n$ —incluido el término constante— y solo hay senos:

      $$
      b_{n}=\frac{2}{\pi}\int_{0}^{\pi}(-t)\operatorname{sen}(nt)\,dt
      =\frac{2(-1)^{n}}{n}
      $$

      $$
      S(t)=\sum_{n=1}^{\infty}\frac{2(-1)^{n}}{n}\operatorname{sen}(nt)
      =-2\operatorname{sen}t+\operatorname{sen}2t
      -\frac{2}{3}\operatorname{sen}3t+\cdots
      $$

      **c) Los cuatro valores.**

      | punto | $S$ | $f$ |
      |---|---|---|
      | $t=0$ | $0$ | $0$ |
      | $t=101\pi$ | $0$ | no está definida |

      En $t=0$ la función es continua y la serie la reproduce. En $t=101\pi$
      —que es $\pi$ dando cincuenta vueltas— hay un salto de $-\pi$ a $\pi$, y
      la serie converge a la semisuma, $0$. La función, en cambio, no vale nada
      ahí: el enunciado la define en el **abierto** $(-\pi,\pi)$. Decirlo así es
      más honesto que inventarle un valor, y es exactamente el tipo de matiz que
      persigue un ejercicio con cuatro puntos de explicación formal.

      **d) La suma.** Se busca un punto donde $S$ y $f$ coincidan y donde los
      senos den la serie pedida. En $t=\frac\pi2$ los pares se anulan y los
      impares valen $\pm1$ alternando:

      $$
      S\!\left(\frac\pi2\right)=-2B,
      \qquad
      f\!\left(\frac\pi2\right)=-\frac\pi2
      $$

      $$
      -2B=-\frac{\pi}{2}\;\Longrightarrow\;\boxed{\;B=\frac{\pi}{4}\;}
      $$

      **Por qué hay que elegir un punto de continuidad.** Si se evaluara en
      $t=\pi$, donde $S=0$ y $f$ no está definida, la igualdad no se podría
      escribir. El apartado c) está puesto justo antes para que uno se dé cuenta
      de dónde **sí** se puede.
