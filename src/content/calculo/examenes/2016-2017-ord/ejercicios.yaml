        <text class="sol17-et" x="87.6" y="216.6" text-anchor="end">z = r</text>
      </svg>
      <figcaption>
      La sección meridiana. El cono sube desde el origen a 45 grados hasta el
      radio 1, y desde ahí la tapa parabólica cierra el sólido en la altura 2.
      Al girar el perfil sale el cuerpo.
      </figcaption>
      </figure>

      **El volumen, con tubos.** La sombra es el disco de radio $1$, y sobre
      cada punto la altura va del cono a la tapa:

      $$
      V=\int_{0}^{2\pi}\!\!\int_{0}^{1}\left[\left(2-r^{2}\right)-r\right]
      r\,dr\,d\theta
      =2\pi\left(1-\frac14-\frac13\right)
      =\boxed{\;\frac{5\pi}{6}\;}\approx2{,}62
      $$

      El límite $r=1$ es lo que hay que justificar: más allá, la pared del cono
      queda por encima de la tapa y la altura sería negativa.

      **b) El área, que son dos trozos y ninguna tapa plana.**

      $$
      A_{\text{cono}}=\pi\cdot1\cdot\sqrt2=\pi\sqrt2\approx4{,}44
      $$

      $$
      A_{\text{paraboloide}}=2\pi\int_{0}^{1}\sqrt{1+4r^{2}}\;r\,dr
      =\frac{\pi\left(5\sqrt5-1\right)}{6}\approx5{,}33
      $$

      $$
      A=\boxed{\;\pi\sqrt2+\frac{\pi\left(5\sqrt5-1\right)}{6}\;}\approx9{,}77
      $$

      El disco de radio $1$ a la altura $z=1$ **no** cuenta: está dentro del
      sólido, no en su frontera.

      **Comprobación de sentido.** Un cilindro de radio $1$ y altura $2$
      tendría volumen $2\pi\approx6{,}28$, y el sólido —que se estrecha por
      abajo y se redondea por arriba— se queda en $2{,}62$, un $42\,\%$.
      Razonable. Y el área, $9{,}77$, contra los $2\pi+2\pi\cdot2=18{,}8$ de ese
      cilindro: también encaja.

  - id: ex1617-ord-6-una-raiz-doble-y-un-seno
    titulo: Una raíz doble, un seno y tres fracciones simples
    fuente: >-
      Ejercicio 3 del SEGUNDO CUATRIMESTRAL · Convocatoria de mayo, 29 de mayo de
      2017 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Resolver el siguiente problema utilizando la transformada de Laplace:

      $$
      \left\{
      \begin{aligned}
      y''+2y'+y&=\operatorname{sen}t\\
      y(0)&=0,\quad y'(0)=1
      \end{aligned}
      \right.
      $$
    pide: La función y(t).

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué forma tiene la descomposición en fracciones simples de
          $\dfrac{s^{2}+2}{(s+1)^{2}\left(s^{2}+1\right)}$?
        opciones:
          - texto: >-
              $\dfrac{A}{s+1}+\dfrac{B}{(s+1)^{2}}+\dfrac{Cs+D}{s^{2}+1}$
            correcta: true
            mensaje: |
              Eso es. Una raíz **doble** pide dos términos, uno con cada
              potencia; y un factor cuadrático irreducible pide un numerador de
              grado uno, no una constante.
          - texto: $\dfrac{A}{s+1}+\dfrac{B}{s^{2}+1}$
            mensaje: |
              Faltan dos cosas: el término $\frac{B}{(s+1)^{2}}$ que exige la
              raíz doble, y el $s$ del numerador sobre el factor cuadrático. Con
              esa forma el sistema sale incompatible.
          - texto: >-
              $\dfrac{A}{(s+1)^{2}}+\dfrac{Bs+C}{s^{2}+1}$
            mensaje: |
              Casi: falta el término en $\frac{1}{s+1}$. Una raíz de
              multiplicidad dos aporta **dos** fracciones, con exponentes $1$ y
              $2$, no solo la de exponente mayor.

      - tipo: calcular
        titulo: El coeficiente de la raíz doble
        pregunta: |
          ¿Cuánto vale $B$, el numerador sobre $(s+1)^{2}$?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '3'
            mensaje: |
              $3$ es el numerador evaluado en $s=-1$: $(-1)^{2}+2=3$. Falta
              dividir entre el otro factor, $s^{2}+1$, que allí vale $2$.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es $A$, el coeficiente del término de primer grado. Es
              fácil confundirlos; el atajo de tapar $(s+1)^{2}$ y sustituir
              $s=-1$ da **$B$**, no $A$.
          - valor: '1'
            mensaje: |
              Parece que has olvidado el $+2$ del numerador. En $s=-1$ vale
              $1+2=3$, y $\frac{3}{2}$ es el resultado.
        pista: |
          Multiplica por $(s+1)^{2}$ y haz $s=-1$: todo lo demás se anula.
        desarrollo: |
          $$
          B=\left.\frac{s^{2}+2}{s^{2}+1}\right|_{s=-1}=\frac{3}{2}
          $$

          Y con los demás coeficientes: $A=\frac12$, $C=-\frac12$, $D=0$.

      - tipo: calcular
        titulo: Un valor de la solución
        pregunta: |
          ¿Cuánto vale $y(2)$?
        respuesta:
          tipo: numero
          valor: '0.6809339'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.4728341'
            mensaje: |
              Parece que te falta el término $\frac12 e^{-t}$: con solo
              $\frac32 t e^{-t}-\frac12\cos t$ sale $0{,}4728$. Los tres
              sumandos cuentan.
          - valor: '0.2726862'
            mensaje: |
              Ese es $\frac12 e^{-2}+\frac32\cdot2\,e^{-2}$ sin el
              $-\frac12\cos 2$. Y $\cos 2$ es **negativo**, así que restarlo
              **suma**: el resultado sube, no baja.
          - valor: '-0.2081377'
            mensaje: |
              Ese es $-\frac12\cos 2$ a secas. Es solo el término permanente; a
              tiempos cortos los dos exponenciales pesan más que él.
        pista: |
          $y(t)=\frac12 e^{-t}+\frac32 t\,e^{-t}-\frac12\cos t$.
        desarrollo: |
          $$
          y(t)=\frac12 e^{-t}+\frac32\,t\,e^{-t}-\frac12\cos t
          $$

          $$
          y(2)=\frac{e^{-2}}{2}+3e^{-2}-\frac{\cos 2}{2}
          \approx0{,}0677+0{,}4060+0{,}2081=0{,}6809
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Transformando con $y(0)=0$ e $y'(0)=1$:
              $\left(s^{2}+2s+1\right)Y-1=\frac{1}{s^{2}+1}$, es decir
              $Y=\frac{s^{2}+2}{(s+1)^{2}\left(s^{2}+1\right)}$.
          - texto: >-
              El denominador tiene una raíz doble en $s=-1$ y un factor
              cuadrático irreducible, así que la descomposición lleva tres
              términos.
          - texto: >-
              Sale $Y=\frac{1/2}{s+1}+\frac{3/2}{(s+1)^{2}}
              -\frac{1}{2}\cdot\frac{s}{s^{2}+1}$, y antitransformando,
              $y=\frac12 e^{-t}+\frac32 t e^{-t}-\frac12\cos t$.
          - texto: >-
              Como el segundo miembro es $\operatorname{sen}t$, la solución
              permanente también tiene que ser un seno.
            trampa: true
            mensaje: |
              No tiene por qué. Un sistema amortiguado responde a una excitación
              senoidal con una oscilación **desfasada**, y aquí el desfase es de
              noventa grados exactos: la parte permanente es
              $-\frac12\cos t$. Eso no es un despiste del cálculo, es física del
              problema — y es justo lo que hay que explicar en COMP 4.
    resolucion: |
      **Transformar.** Con $\mathcal{L}\{y''\}=s^{2}Y-sy(0)-y'(0)=s^{2}Y-1$ y
      $\mathcal{L}\{y'\}=sY$:

      $$
      \left(s^{2}+2s+1\right)Y-1=\frac{1}{s^{2}+1}
      \;\Longrightarrow\;
      Y=\frac{s^{2}+2}{(s+1)^{2}\left(s^{2}+1\right)}
      $$

      **La descomposición, con su forma correcta.** Raíz doble en $s=-1$ y
      factor cuadrático irreducible:

      $$
      Y=\frac{A}{s+1}+\frac{B}{(s+1)^{2}}+\frac{Cs+D}{s^{2}+1}
      $$

      El más fácil es $B$: se multiplica por $(s+1)^{2}$ y se hace $s=-1$, con
      lo que todo lo demás se anula y queda $B=\frac{3}{2}$. Los otros salen
      igualando coeficientes:

      $$
      A=\frac12,\qquad B=\frac32,\qquad C=-\frac12,\qquad D=0
      $$

      **Antitransformar.**

      $$
      \boxed{\;y(t)=\frac12 e^{-t}+\frac32\,t\,e^{-t}-\frac12\cos t\;}
      $$

      **Las dos comprobaciones que hay que hacer siempre.**

      $$
      y(0)=\frac12+0-\frac12=0\ \checkmark
      $$
      $$
      y'(t)=-\frac12 e^{-t}+\frac32\left(1-t\right)e^{-t}
      +\frac12\operatorname{sen}t
      \;\Longrightarrow\;
      y'(0)=-\frac12+\frac32=1\ \checkmark
      $$

      **Cómo se lee el resultado.** Hay dos partes bien distintas:

      - la **transitoria**, $\frac12 e^{-t}+\frac32 t e^{-t}$, que viene de la
        raíz doble y se apaga —el $t$ la hace crecer al principio, pero la
        exponencial gana enseguida—;
      - la **permanente**, $-\frac12\cos t$, que es la respuesta al seno de
        entrada.

      Y ahí está el detalle interesante: la entrada es un seno y la salida
      permanente es un coseno con signo, es decir, la misma frecuencia
      **desfasada** un cuarto de periodo. Un sistema con amortiguamiento
      siempre responde con retraso, y en este caso el retraso es de exactamente
      $90^{\circ}$ porque la excitación coincide con la frecuencia natural no
      amortiguada.

  - id: ex1617-ord-7-el-diente-de-sierra-de-menos-te
    titulo: Un diente de sierra que baja, y la serie de Leibniz otra vez
    fuente: >-
      Ejercicio 4 del SEGUNDO CUATRIMESTRAL · Convocatoria de mayo, 29 de mayo de
      2017 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 6
      comp4: 4
    enunciado: |
      Sea la función periódica de periodo $2\pi$
      $f(t)=-t\ /\ t\in(-\pi,\pi)$.

      a) Dibujar $f(t)$.

      b) Calcular la serie de Fourier $S(t)$ de la función $f(t)$.

      c) Calcular $S(0)$, $f(0)$, $S(101\pi)$ y $f(101\pi)$.

      d) Calcular la suma
      $B=1-\dfrac13+\dfrac15-\dfrac17+\ldots$
    pide: El dibujo, la serie, los cuatro valores y la suma.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué simetría tiene $f$, y qué consecuencia tiene?
        opciones:
          - texto: >-
              Es **impar**, así que todos los $a_{n}$ se anulan y la serie es
              solo de senos
            correcta: true
            mensaje: |
              Eso es: $f(-t)=-(-t)=t=-f(t)$. Una función impar integrada contra
              un coseno —que es par— da cero en un intervalo simétrico, así que
              no hay término constante ni cosenos.
          - texto: Es par, así que solo hay cosenos
            mensaje: |
              $f(1)=-1$ y $f(-1)=1$: no coinciden, luego no es par. La confusión
              suele venir del signo menos delante de la $t$, que no cambia la
              paridad: $-t$ sigue siendo impar.
          - texto: >-
              No tiene ninguna simetría, porque lleva un signo menos
            mensaje: |
              El signo menos no rompe la simetría: multiplicar una función impar
              por $-1$ la deja impar. Y aquí eso ahorra la mitad del trabajo,
              porque los $a_{n}$ no hay ni que calcularlos.

      - tipo: calcular
        titulo: El primer armónico
        pregunta: |
          ¿Cuánto vale $b_{1}$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Signo. $b_{n}=\frac{2(-1)^{n}}{n}$, y para $n=1$ eso es $-2$. El
              signo menos del enunciado se arrastra hasta aquí.
          - valor: '-1'
            mensaje: |
              $-1$ sería el coeficiente si el factor fuera $\frac{(-1)^{n}}{n}$
              sin el $2$. Ese $2$ sale de que la función es impar y la integral
              sobre medio periodo se duplica.
          - valor: '-0.6366198'
            mensaje: |
              $-\frac2\pi$ tiene un $\pi$ de más en el denominador. Al integrar
              $t\operatorname{sen}(nt)$ por partes aparece un $\pi$ en el
              numerador que se cancela con el $\frac1\pi$ de la fórmula.
        pista: |
          $b_{n}=\frac{2}{\pi}\int_{0}^{\pi}(-t)\operatorname{sen}(nt)\,dt$, y
          se hace por partes.
        desarrollo: |
          $$
          \int_{0}^{\pi}t\operatorname{sen}(nt)\,dt
          =\frac{\pi(-1)^{n+1}}{n}
          $$

          $$
          b_{n}=-\frac{2}{\pi}\cdot\frac{\pi(-1)^{n+1}}{n}
          =\frac{2(-1)^{n}}{n}
          $$

          $$
          S(t)=-2\operatorname{sen}t+\operatorname{sen}2t
          -\frac23\operatorname{sen}3t+\cdots
          $$

      - tipo: calcular
        titulo: El valor de la serie en el salto
        pregunta: |
          ¿Cuánto vale $S(101\pi)$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3.1415927'
            mensaje: |
              $\pi$ es el límite por la **derecha** en ese punto. La serie no se
              queda con un lado: converge a la semisuma de los dos, y el otro
              vale $-\pi$.
          - valor: '-3.1415927'
            mensaje: |
              $-\pi$ es el límite por la izquierda. Como el otro vale $+\pi$, la
              semisuma es cero.
          - valor: '1.5707963'
            mensaje: |
              $\frac\pi2$ sería la semisuma si los límites fueran $0$ y $\pi$.
              Aquí son $-\pi$ y $\pi$, simétricos, y su media es $0$.
        pista: |
          $101\pi$ es congruente con $\pi$ módulo $2\pi$, y ahí hay un salto.
        desarrollo: |
          $101=50\cdot2+1$, así que $101\pi\equiv\pi\pmod{2\pi}$. En $t=\pi$ la
          función salta: por la izquierda tiende a $-\pi$ y por la derecha
          —empezando el periodo siguiente— a $+\pi$.

          $$
          S(101\pi)=\frac{-\pi+\pi}{2}=0
          $$

      - tipo: calcular
        titulo: La suma pedida
        pregunta: |
          ¿Cuánto vale $B=1-\frac13+\frac15-\frac17+\cdots$?
        respuesta:
          tipo: numero
          valor: '0.7853982'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.5707963'
            mensaje: |
              $\frac\pi2$ es $-S(\pi/2)$, no $B$. De $S(\pi/2)=-2B=-\frac\pi2$
              sale $B=\frac\pi4$: falta dividir entre $2$.
          - valor: '-0.7853982'
            mensaje: |
              Signo. La serie empieza en $+1$, así que su suma es positiva; el
              menos es el de $S(\pi/2)$, que sí vale $-\frac\pi2$.
          - valor: '0.6931472'
            mensaje: |
              $\ln 2$ es la suma de $1-\frac12+\frac13-\cdots$, la alternada
              armónica. Esta solo tiene denominadores impares.
        pista: |
          Evalúa la serie en $t=\frac\pi2$, donde $f$ es continua y los senos
          impares valen $\pm1$.
        desarrollo: |
          En $t=\frac\pi2$ se anulan los senos de índice par y quedan los
          impares, con $\operatorname{sen}\left((2k+1)\frac\pi2\right)=(-1)^{k}$:

          $$
          S\!\left(\frac\pi2\right)
          =\sum_{k\ge0}\frac{2(-1)^{2k+1}(-1)^{k}}{2k+1}
          =-2\sum_{k\ge0}\frac{(-1)^{k}}{2k+1}=-2B
          $$

          Y como $f$ es continua ahí, $S(\pi/2)=f(\pi/2)=-\frac\pi2$:

          $$
          -2B=-\frac\pi2\;\Longrightarrow\;B=\frac{\pi}{4}\approx0{,}7854
          $$

      - tipo: justificar
        pregunta: Ordena el apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              En $t=0$ la función es continua —vale $0$ y los dos límites
              laterales también—, así que $S(0)=f(0)=0$.
          - texto: >-
              $101\pi$ es congruente con $\pi$ módulo $2\pi$, y ahí sí hay
              salto: los límites laterales son $-\pi$ y $+\pi$, luego
              $S(101\pi)=0$.
          - texto: >-
              En cambio $f(101\pi)$ **no está definida**: el enunciado da $f$ en
              el intervalo abierto $(-\pi,\pi)$, y $\pi$ queda fuera.
          - texto: >-
              Como $S(0)$ y $S(101\pi)$ valen los dos cero, la función es cero
              en esos puntos.
            trampa: true
            mensaje: |
              Solo en el primero. En $t=0$ la serie coincide con la función
              porque no hay salto; en $t=101\pi$ la serie vale cero **y la
              función no vale nada**, porque ahí ni siquiera está definida. Que
              $S$ y $f$ coincidan es la excepción, no la regla: solo pasa en los
              puntos de continuidad.
    resolucion: |
      **a) El dibujo.** En cada periodo la función baja en línea recta de $\pi$
      a $-\pi$ y salta hacia arriba al empezar el siguiente. Los extremos van en
      hueco porque el enunciado da el intervalo **abierto**.

