          .sol17-r { fill: var(--live); fill-opacity: .15; }
          .sol17-b { stroke: var(--live); stroke-width: 2.4; fill: none; }
          .sol17-eje { stroke: var(--graphite); stroke-width: 1.2; fill: none; }
          .sol17-gui { stroke: var(--alt); stroke-width: 1.3; fill: none; stroke-dasharray: 4 4; }
          .sol17-pt { fill: var(--alt); }
          .sol17-n { fill: var(--faint); font-size: 11px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
