      </svg>
      <figcaption>
      Las tres opciones, redibujadas. En (a) la curva nueva va pegada a la de
      1,60; en (b), pegada a la de 1,50; en (c), a media distancia entre las
      dos.
      </figcaption>
      </figure>
    pide: Cuál de las tres, y por qué.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué relación hay entre el módulo del gradiente y la separación entre
          curvas de nivel?
        opciones:
          - texto: >-
              Es inversa: donde el gradiente es mayor, las curvas están más
              juntas
            correcta: true
            mensaje: |
              Eso es. Al avanzar en la dirección del gradiente,
              $dz=\left\|\nabla F\right\|ds$; para el mismo salto de cota, un
              gradiente grande necesita recorrer poco. Es lo mismo que en un
              mapa: donde las curvas de nivel se aprietan, la ladera es
              empinada.
          - texto: >-
              Es directa: donde el gradiente es mayor, las curvas están más
              separadas
            mensaje: |
              Al revés. Un gradiente grande significa que la función cambia
              deprisa, así que en poco espacio ya se ha subido la cota
              siguiente: las curvas se juntan.
          - texto: >-
              No hay relación: el gradiente solo indica la dirección
            mensaje: |
              La dirección es la mitad de la información. El **módulo** es la
              tasa de cambio en esa dirección, y es lo que fija la distancia
              hasta la curva siguiente.

      - tipo: calcular
        titulo: La distancia, con un número
        pregunta: |
          Si en un punto de la curva $z=1{,}50$ el gradiente mide $2$ unidades
          de cota por unidad de longitud, ¿a qué distancia está la curva
          $z=1{,}55$?
        respuesta:
          tipo: numero
          valor: '0.025'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.1'
            mensaje: |
              $0{,}1$ es $\Delta z\cdot2$: has multiplicado por el módulo en vez
              de dividir. Un gradiente **grande** acerca la curva siguiente, no
              la aleja.
          - valor: '0.05'
            mensaje: |
              $0{,}05$ es el salto de cota, no la distancia. Falta dividir entre
              el módulo del gradiente, que convierte cota en longitud.
          - valor: '40'
            mensaje: |
              Has invertido la fracción: $\frac{2}{0{,}05}$. La regla es
              $ds=\frac{\Delta z}{\left\|\nabla F\right\|}$, con la cota arriba.
        pista: |
          $dz=\left\|\nabla F\right\|\,ds$, así que
          $ds=\frac{\Delta z}{\left\|\nabla F\right\|}$.
        desarrollo: |
          $$
          ds=\frac{\Delta z}{\left\|\nabla F\right\|}
          =\frac{1{,}55-1{,}50}{2}=0{,}025
          $$

          Y para llegar a $1{,}60$ haría falta el doble, $0{,}05$: **la curva
          intermedia cae a media distancia**, porque su cota está a medio
          camino.

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              El gradiente es perpendicular a las curvas de nivel y apunta hacia
              las cotas mayores, así que la curva $1{,}55$ tiene que quedar
              entre las dos y cortar cada flecha en ángulo recto.
          - texto: >-
              Al avanzar por la dirección del gradiente,
              $\Delta z\approx\left\|\nabla F\right\|\,\Delta s$; como
              $\left\|\nabla F\right\|$ apenas cambia dentro de la franja,
              recorrer la mitad de la cota lleva la mitad del camino.
          - texto: >-
              La cota $1{,}55$ está justo a medio camino entre $1{,}50$ y
              $1{,}60$, luego su curva va a media distancia: la opción **(c)**.
          - texto: >-
              Como el gradiente en C es el más largo de los cuatro, la curva
              $1{,}55$ debe dibujarse pegada a la de $1{,}60$ en esa zona.
            trampa: true
            mensaje: |
              Doble error. Primero, un gradiente grande acerca las curvas, así
              que si algo, la $1{,}55$ iría **pegada a la $1{,}50$**, no a la
              $1{,}60$. Y segundo, esa lectura no distingue opciones: lo que
              decide es que la cota intermedia está a medio camino, y eso vale
              en los cuatro puntos a la vez.
    resolucion: |
      **La respuesta es la (c)**, y el razonamiento cabe en dos ideas.

      **1 · El gradiente es perpendicular a las curvas de nivel.** A lo largo de
      una curva de nivel la función no cambia, así que la derivada direccional
      en la dirección tangente vale cero: $\nabla F\perp$ tangente. Y apunta
      hacia donde $F$ crece, es decir, de la $1{,}50$ hacia la $1{,}60$. Eso ya
      dice que la curva nueva va **entre** las dos y cruza las flechas en ángulo
      recto — pero las tres opciones lo cumplen, así que no basta.

      **2 · El módulo del gradiente fija la distancia.** Al avanzar una longitud
      $ds$ en la dirección del gradiente,

      $$
      dz=\left\|\nabla F\right\|\,ds
      \qquad\Longrightarrow\qquad
      ds=\frac{\Delta z}{\left\|\nabla F\right\|}
      $$

      Dentro de una franja estrecha, $\left\|\nabla F\right\|$ apenas cambia. Y
      entonces la distancia es **proporcional al salto de cota**:

      $$
      \frac{d(1{,}50\to1{,}55)}{d(1{,}50\to1{,}60)}
      =\frac{0{,}05}{0{,}10}=\frac12
      $$

      La curva $1{,}55$ va a media distancia. Eso descarta la (a), que la pega a
      la $1{,}60$, y la (b), que la pega a la $1{,}50$.

      **Para qué sirven entonces los cuatro gradientes.** No para colocar la
      curva nueva, sino para leer el terreno: son más largos donde la función
      crece más deprisa. En C, el más largo de los cuatro, la ladera es la más
      empinada del dibujo, y ahí las curvas de nivel deberían apretarse. En A,
      el más corto, el terreno es casi llano. Esa lectura es la que se pide en
      un mapa topográfico, y es exactamente la que el ejercicio quiere
      comprobar que se tiene.

      **Y una honestidad sobre el dibujo.** El original está hecho a mano y no
      es métrico: las dos curvas dadas van casi paralelas mientras que los
      cuatro gradientes tienen longitudes muy distintas, cosa que no puede pasar
      a la vez. La figura es esquemática, y el argumento que decide —el de la
      proporcionalidad— no depende de eso.

  - id: ex1617-ord-5-el-cono-tapado-por-un-paraboloide
    titulo: Un cono con tapa de paraboloide
    fuente: >-
      Ejercicio 2 del SEGUNDO CUATRIMESTRAL · Convocatoria de mayo, 29 de mayo de
      2017 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3
    enunciado: |
      Sea el sólido limitado por las condiciones
      $x^{2}+y^{2}\le z^{2}$; $z\le 2-x^{2}-y^{2}$; $z\ge 0$.

      a) Dibujar el sólido y calcular su volumen.

      b) Calcular el área de la superficie del sólido.
    pide: El dibujo, el volumen y el área.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde se cortan el cono y el paraboloide?
        opciones:
          - texto: >-
              En $r=1$, $z=1$: donde $r=2-r^{2}$
            correcta: true
            mensaje: |
              Eso es. Sobre el cono $z=r$ y sobre el paraboloide $z=2-r^{2}$;
              igualando, $r^{2}+r-2=0$, con raíces $1$ y $-2$. Solo $r=1$ tiene
              sentido, y entonces $z=1$.
          - texto: En $r=2$, $z=2$
            mensaje: |
              $r=2$ no cumple $2-r^{2}=r$: daría $2-4=-2\neq2$. El $2$ del
              enunciado es la altura del paraboloide en el eje, no el radio del
              corte.
          - texto: En $r=\sqrt2$
            mensaje: |
              $\sqrt2$ es donde el paraboloide corta al plano $z=0$, que es otra
              cosa: ahí el sólido ya no llega, porque el cono lo ha cerrado
              antes.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen del sólido?
        respuesta:
          tipo: numero
          valor: '2.6179939'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.0471976'
            mensaje: |
              $\frac{\pi}{3}$ es el volumen del cono solo, hasta $z=1$. El
              sólido llega más arriba: entre $z=1$ y la tapa parabólica queda
              todavía cuerpo.
          - valor: '4.712389'
            mensaje: |
              $\frac{3\pi}{2}$ sale de integrar $(2-r^{2})$ sin restar el cono
              $r$. La altura de cada tubo es la diferencia entre la tapa y la
              pared del cono.
          - valor: '6.2831853'
            mensaje: |
              $2\pi$ es lo que da $\int_{0}^{\sqrt2}(2-r^{2})r\,dr\cdot2\pi$, es
              decir, el sólido bajo el paraboloide entero. El cono lo recorta
              por dentro.
        pista: |
          $V=2\pi\displaystyle\int_{0}^{1}\left[(2-r^{2})-r\right]r\,dr$.
        desarrollo: |
          $$
          V=\int_{0}^{2\pi}\!\!\int_{0}^{1}\left[(2-r^{2})-r\right]r\,dr\,d\theta
          =2\pi\int_{0}^{1}\left(2r-r^{3}-r^{2}\right)dr
          $$

          $$
          =2\pi\left(1-\frac14-\frac13\right)=2\pi\cdot\frac{5}{12}
          =\frac{5\pi}{6}\approx2{,}618
          $$

      - tipo: calcular
        titulo: El área total
        pregunta: |
          ¿Cuánto mide la superficie completa del sólido?
        respuesta:
          tipo: numero
          valor: '9.7733'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '4.4429'
            mensaje: |
              $\pi\sqrt2$ es solo el cono. Falta el casquete parabólico, que es
              la tapa y mide algo más.
          - valor: '5.3304'
            mensaje: |
              $\frac{\pi(5\sqrt5-1)}{6}$ es solo el casquete parabólico. Falta
              la pared cónica.
          - valor: '12.9151'
            mensaje: |
              Parece que has añadido también el disco de radio $1$ a la altura
              $z=1$. Ese disco es **interior**: es donde el cono y el
              paraboloide se encuentran, no una cara.
        pista: |
          El cono tiene generatriz $\sqrt2$ y radio $1$; para el paraboloide,
          $dS=\sqrt{1+4r^{2}}\;r\,dr\,d\theta$.
        desarrollo: |
          **El cono.** $z=r$ da $dS=\sqrt2\,r\,dr\,d\theta$, o directamente
          $\pi R g$ con $R=1$ y $g=\sqrt2$:

          $$
          A_{1}=\pi\sqrt2\approx4{,}443
          $$

          **El casquete.** $z=2-r^{2}$ da $dS=\sqrt{1+4r^{2}}\,r\,dr\,d\theta$:

          $$
          A_{2}=2\pi\left[\frac{(1+4r^{2})^{3/2}}{12}\right]_{0}^{1}
          =\frac{\pi\left(5\sqrt5-1\right)}{6}\approx5{,}330
          $$

          $$
          A=\pi\sqrt2+\frac{\pi\left(5\sqrt5-1\right)}{6}\approx9{,}773
          $$

      - tipo: justificar
        pregunta: Ordena el planteamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La primera condición deja el interior del cono $r\le z$; la
              segunda, lo que queda por debajo del paraboloide $z=2-r^{2}$; y la
              tercera corta por el plano $z=0$.
          - texto: >-
              Las dos superficies se cortan en $r=1$, $z=1$, así que la sombra
              del sólido sobre el plano $XY$ es el disco de radio $1$.
          - texto: >-
              Sobre cada punto de ese disco, $z$ va desde la pared del cono
              hasta la tapa, y el volumen es
              $2\pi\int_{0}^{1}\left[(2-r^{2})-r\right]r\,dr=\frac{5\pi}{6}$.
          - texto: >-
              La sombra del sólido es el disco de radio $\sqrt2$, que es donde
              el paraboloide corta al plano $z=0$.
            trampa: true
            mensaje: |
              El paraboloide llega hasta $r=\sqrt2$, pero el sólido no: el cono
              lo cierra antes, en $r=1$. Para $r>1$ la pared del cono ya está
              **por encima** de la tapa, y la altura saldría negativa. Tomar
              $\sqrt2$ como límite superior da un volumen mayor que el real y,
              lo que es peor, integra una altura negativa en un trozo.
    resolucion: |
      **a) Qué sólido es.** Dos superficies:

      - $x^{2}+y^{2}\le z^{2}$ con $z\ge0$: el interior del cono de
        $45^{\circ}$, abierto hacia arriba.
      - $z\le 2-x^{2}-y^{2}$: por debajo del paraboloide invertido, que corona
        en $(0,0,2)$.

      Se cortan donde $r=2-r^{2}$, o sea $r^{2}+r-2=0$: $r=1$, $z=1$.

      <figure class="figura-examen">
      <svg viewBox="0 0 350 320" role="img" width="350" height="320"
           aria-labelledby="sol17-t sol17-d">
        <title id="sol17-t">La seccion del solido entre el cono y el paraboloide</title>
        <desc id="sol17-d">Desde el origen salen dos rectas a cuarenta y cinco grados
        y una parabola invertida las cierra por arriba. Se encuentran a la altura uno
        con radio uno, y la parabola alcanza su cumbre en la altura dos sobre el eje.
        Al girar el perfil alrededor del eje vertical sale el solido.</desc>
