        un maximo de ocho coma cinco cerca de x igual a cero coma siete y baja.
        Su derivada es una parabola invertida con maximo nueve coma cinco en x
        igual a menos cero coma cinco. Su segunda derivada es una recta
        descendente que corta el eje en menos cero coma cinco.</desc>

        <g stroke="var(--rule)" stroke-width="1" fill="none">
