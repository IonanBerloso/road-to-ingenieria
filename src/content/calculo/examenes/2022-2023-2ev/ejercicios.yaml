                d="M60 371 C 100 300, 118 245, 140 199
                   C 170 145, 195 105, 220 96
                   C 250 72, 275 61, 300 61
                   C 325 61, 355 72, 380 96
                   C 410 130, 435 165, 460 199
                   C 490 250, 515 330, 540 371"></path>
          <path stroke="var(--graphite)" stroke-dasharray="4 6"
                d="M167 50 L393 440"></path>
        </g>

        <g fill="var(--graphite)" font-size="12" font-family="var(--mono)">
          <text x="34" y="55">10</text>
          <text x="42" y="100">8</text>
          <text x="42" y="146">6</text>
          <text x="42" y="192">4</text>
          <text x="42" y="238">2</text>
          <text x="42" y="284">0</text>
          <text x="34" y="330">-2</text>
          <text x="34" y="376">-4</text>
          <text x="34" y="422">-6</text>
          <text x="52" y="479">-2</text>
          <text x="212" y="479">-1</text>
          <text x="532" y="479">1</text>
          <text x="692" y="479">2</text>
        </g>

        <g font-size="14" font-family="var(--mono)">
          <text x="600" y="150" fill="var(--d1)">y(x)</text>
          <text x="120" y="130" fill="var(--flag)">y'(x)</text>
          <text x="180" y="80" fill="var(--graphite)">y''(x)</text>
        </g>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original y medida sobre el PDF: la rejilla
      y las marcas del eje se localizaron por densidad de tinta, y las tres
      curvas se separaron por grosor de trazo. Los valores que salieron
      corresponden a y igual a menos dos x cubo menos tres x cuadrado mas ocho x
      mas cinco.
      </figcaption>
      </figure>

      **a)** Calcular el polinomio de Taylor de orden 1 en $a=-1$.

      **b)** Acotar el error cometido al aproximar el valor de la función
      $y(x)$ en $x = -\dfrac{1}{3}$ mediante el polinomio obtenido en el
      apartado anterior.

      **c)** Calcular el error exacto y comprobar que la cota calculada en el
      apartado anterior es válida.
    pide: Calcular el polinomio, acotar el error y compararlo con el exacto.

    pasos:
      - tipo: reconocer
        pregunta: |
          Para acotar el error de un polinomio de Taylor de **orden 1**, ¿qué
          derivada hace falta?
        opciones:
          - texto: >-
              La **segunda**, porque el resto de Lagrange de orden $n$ lleva
              $f^{(n+1)}$
            correcta: true
            mensaje: |
              Exacto. $R_1(x) = \frac{y''(\xi)}{2!}(x-a)^{2}$. Y por eso el
              enunciado dibuja $y''$: no está de adorno, es el dato del
              apartado (b).
          - texto: La primera
            mensaje: |
              La primera entra en el **polinomio**, no en el resto. El resto
              siempre usa una derivada más que el orden.
          - texto: La tercera
            mensaje: |
              La tercera haría falta para un polinomio de orden 2. Aquí el orden
              es 1.
          - texto: >-
              Ninguna: la cota sale del propio polinomio
            mensaje: |
              El polinomio no sabe nada del error que comete. La información
              está en la derivada siguiente.

      - tipo: calcular
        titulo: El polinomio
        pregunta: |
          ¿Cuánto vale $y(-1)$?
        respuesta:
          tipo: numero
          valor: '-4'
          tolerancia: 0.15
          formato: un número
        distractores:
          - valor: '8'
            mensaje: |
              8 es $y'(-1)$, el valor de la **derivada** ahí. En la gráfica hay
              tres curvas: hay que leer la de $y$.
          - valor: '6'
            mensaje: |
              6 es $y''(-1)$, la segunda derivada. Es la curva de trazos finos,
              la recta.
          - valor: '4'
            mensaje: |
              Falta el signo. En $x=-1$ la curva de $y$ está **por debajo** del
              eje.
        pista: |
          Es la curva gruesa, la que tiene el máximo a la derecha.
        desarrollo: |
          Leyendo la gráfica de $y$ —la curva gruesa— en $x=-1$:

          $$
          y(-1) = -4
          $$

          Y la de $y'$ —la parábola de trazos— en el mismo punto:

          $$
          y'(-1) = 8
          $$

          Con eso, el polinomio de Taylor de orden 1 en $a=-1$:

          $$
          P_1(x) = y(-1)+y'(-1)(x+1) = -4+8(x+1)
          $$
        veredicto: |
          La medición sobre el PDF da $y(x) = -2x^{3}-3x^{2}+8x+5$, y en efecto
          $y(-1) = 2-3-8+5 = -4$ e $y'(-1) = -6+6+8 = 8$. Los valores del examen
          caen sobre líneas de la rejilla.

      - tipo: calcular
        titulo: La cota del error
        pregunta: |
          ¿Cuál es la cota del error al aproximar $y\left(-\frac13\right)$? Da
          cuatro decimales.
        respuesta:
          tipo: numero
          valor: '1.3333'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0.7407'
            mensaje: |
              $\frac{20}{27}$ es el error **exacto**, el del apartado (c). La
              cota es mayor, como debe ser.
          - valor: '0.4444'
            mensaje: |
              $\frac49$ es $\left(x+1\right)^{2}$ sin multiplicar por
              $\frac{\left|y''\right|_{\max}}{2} = 3$.
          - valor: '2.6667'
            mensaje: |
              $\frac83$ es el doble: falta dividir entre $2! = 2$.
        pista: |
          $\left|R_1\right| \le \frac{M}{2}(x+1)^{2}$, con $M$ el máximo de
          $\left|y''\right|$ en $\left[-1,-\frac13\right]$.
        desarrollo: |
          El resto de Lagrange de orden 1:

          $$
          R_1(x) = \frac{y''(\xi)}{2!}(x+1)^{2},
          \qquad \xi \in \left(-1,-\tfrac13\right)
          $$

          **La cota de $\left|y''\right|$.** En la gráfica, $y''$ es una recta
          descendente. En el intervalo va de

          $$
          y''(-1) = 6
          \qquad\text{a}\qquad
          y''\left(-\tfrac13\right) = -2
          $$

          Como es monótona, el máximo de su valor absoluto está en un extremo:

          $$
          M = \max\left|y''\right| = 6
          $$

          **La distancia al centro**, con $x=-\frac13$:

          $$
          (x+1)^{2} = \left(\tfrac23\right)^{2} = \tfrac49
          $$

          $$
          \left|R_1\right| \le \frac{6}{2}\cdot\frac49 = \frac{12}{9}
          = \frac43 \approx 1{,}3333
          $$
        veredicto: |
          El máximo de $\left|y''\right|$ se busca en **todo el intervalo**, no
          solo en el punto. Evaluar $y''$ únicamente en $-\frac13$ daría 2 y una
          cota de $\frac89$, **menor que el error real**: una cota falsa.

      - tipo: justificar
        pregunta: |
          Ordena el apartado (c). Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **El valor exacto.** De la gráfica sale
              $y(x) = -2x^{3}-3x^{2}+8x+5$, y con $x=-\frac13$:
              $y\left(-\frac13\right) = \frac{56}{27}$.
          - texto: |
              **El valor aproximado.**
              $P_1\left(-\frac13\right) = -4+8\cdot\frac23 = \frac43$.
          - texto: |
              **El error exacto:**
              $\left|\frac{56}{27}-\frac43\right| = \left|\frac{56-36}{27}
              \right| = \frac{20}{27} \approx 0{,}7407$.
          - texto: |
              **La comprobación:** $\frac{20}{27} \le \frac43$, es decir
              $0{,}741 \le 1{,}333$. La cota es válida.
          - texto: |
              Y tiene que serlo por construcción: la cota usa el **máximo** de
              $\left|y''\right|$, mientras que el error real usa su valor en un
              punto concreto del interior.
          - texto: |
              Si el error exacto hubiera salido mayor que la cota, sería señal
              de que la función no es derivable dos veces.
            trampa: true
            mensaje: |
              Sería señal de un **error de cálculo**, no de un problema de la
              función. El teorema de Taylor garantiza que la cota se cumple
              siempre que $y''$ exista y esté acotada, y el enunciado dice que
              la función tiene dos derivadas: la gráfica las dibuja. Una cota
              incumplida delata la cuenta, no la hipótesis.
        veredicto: |
          Que el error real sea aproximadamente la mitad de la cota es lo
          típico: la cota supone el peor caso —que $y''$ valga su máximo en todo
          el intervalo— y eso casi nunca ocurre.

    resolucion: |
      **Datos.** Las gráficas de $y$, $y'$ e $y''$.

      > **Nota sobre la figura.** Redibujada y **medida sobre el PDF**: la
      > rejilla y las marcas del eje se localizaron por densidad de tinta, y las
      > tres curvas se separaron por grosor de trazo, ya que las tres son
      > negras. Los valores obtenidos corresponden a
      > $y(x) = -2x^{3}-3x^{2}+8x+5$, aunque el ejercicio no necesita la
      > expresión: le bastan cuatro lecturas.

      ### 1 · Qué se lee y para qué

      | dato | dónde se lee | para qué |
      |---|---|---|
      | $y(-1) = -4$ | curva gruesa | término independiente de $P_1$ |
      | $y'(-1) = 8$ | parábola de trazos | coeficiente lineal de $P_1$ |
      | $y''$ en $\left[-1,-\frac13\right]$ | recta de trazos | la cota del error |

      **La gráfica de $y''$ no está de adorno**: es el dato del apartado (b).

      ### 2 · Apartado (a): el polinomio

      $$
      P_1(x) = y(-1)+y'(-1)\,(x+1)
      $$

      $$
      \boxed{P_1(x) = -4+8(x+1) = 8x+4}
      $$

      Es la **recta tangente** a $y$ en $x=-1$.

      ### 3 · Apartado (b): la cota

      El resto de Lagrange de orden 1:

      $$
      R_1(x) = \frac{y''(\xi)}{2!}\,(x+1)^{2},
      \qquad \xi \text{ entre } -1 \text{ y } x
      $$

      No se sabe dónde está $\xi$, así que se acota $\left|y''\right|$ en todo
      el intervalo $\left[-1,-\frac13\right]$.

      En la gráfica $y''$ es una **recta**, luego es monótona y su máximo en
      valor absoluto está en un extremo:

      $$
      y''(-1) = 6,
      \qquad
      y''\!\left(-\tfrac13\right) = -2
      $$

      $$
      M = \max_{\left[-1,-1/3\right]}\left|y''\right| = 6
      $$

      Con $x = -\frac13$, la distancia al centro es $\frac23$:

      $$
      \left|R_1\right| \le \frac{M}{2}\left(\tfrac23\right)^{2}
      = \frac{6}{2}\cdot\frac49
      $$

      $$
      \boxed{\left|R_1\right| \le \frac43 \approx 1{,}3333}
      $$

      **El error que hay que evitar** es evaluar $y''$ solo en el punto donde se
      aproxima. Daría $\left|-2\right|=2$ y una cota de $\frac89 = 0{,}889$,
      **menor que el error real**: una cota que no acota nada.

      ### 4 · Apartado (c): el error exacto

      Con $y(x) = -2x^{3}-3x^{2}+8x+5$ y $x = -\frac13$:

      $$
      y\!\left(-\tfrac13\right)
      = -2\left(-\tfrac{1}{27}\right)-3\left(\tfrac19\right)
      -\tfrac83+5
      = \tfrac{2}{27}-\tfrac{9}{27}-\tfrac{72}{27}+\tfrac{135}{27}
      $$

      $$
      y\!\left(-\tfrac13\right) = \frac{56}{27} \approx 2{,}0741
      $$

      Y el polinomio:

      $$
      P_1\!\left(-\tfrac13\right) = -4+8\cdot\tfrac23
      = -4+\tfrac{16}{3} = \tfrac43 \approx 1{,}3333
      $$

      $$
      \boxed{\left|R_1\right|_{\text{exacto}}
      = \left|\tfrac{56}{27}-\tfrac{36}{27}\right| = \frac{20}{27}
      \approx 0{,}7407}
      $$

      **La comprobación:**

      $$
      \frac{20}{27} \le \frac43
      \qquad\Longleftrightarrow\qquad
      0{,}741 \le 1{,}333 \quad\checkmark
      $$

      ### 5 · Por qué la cota sobra tanto

      El error real es **el 56 %** de la cota. No es un fallo: es lo normal.

      La cota supone el **peor caso** —que $y''$ valga su máximo, 6, en todo el
      intervalo—, y eso solo ocurre en el extremo izquierdo. En el resto $y''$
      es menor, e incluso **cambia de signo** en $x=-\frac12$.

      De hecho se puede localizar el $\xi$ del teorema:

      $$
      \frac{y''(\xi)}{2}\cdot\frac49 = \frac{20}{27}
      \;\Longrightarrow\;
      y''(\xi) = \frac{20}{27}\cdot\frac{9}{4}\cdot2 = \frac{10}{3}
      $$

      Y con $y''(x) = -12x-6$:

      $$
      -12\xi-6 = \tfrac{10}{3}
      \;\Longrightarrow\;
      \xi = -\frac{7}{9} \approx -0{,}778
      $$

      que está efectivamente entre $-1$ y $-\frac13$ ✔ **El teorema no solo se
      cumple: se puede señalar el punto.**

      ### 6 · Comprobación

      **Del polinomio en su centro.** $P_1(-1) = -4 = y(-1)$ ✔

      **Del signo del error.** $y\left(-\frac13\right) > P_1\left(-\frac13
      \right)$, es decir la función va **por encima** de su tangente en ese
      punto. Coherente: entre $-1$ y $-\frac12$ la función es convexa
      —$y''>0$— y una función convexa queda por encima de su tangente ✔

      **De la expresión medida.** Los cuatro valores leídos en la gráfica
      —$y(-1)=-4$, $y'(-1)=8$, $y''(-1)=6$, $y''\left(-\frac13\right)=-2$—
      son todos coherentes con $y(x) = -2x^{3}-3x^{2}+8x+5$ ✔ Cuatro
      coincidencias independientes son bastante más que una casualidad.
