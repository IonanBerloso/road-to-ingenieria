ejercicios:
  - id: ex2223-2ev-1-coche-y-edificio
    titulo: El coche que se aleja del edificio en llamas
    fuente: >-
      Ejercicio 1 · Segunda evaluación, 28 de noviembre de 2022 · Cálculo,
      UPV/EHU · Es el ejercicio 3.17 del boletín del tema 3, con los mismos
      números · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    enunciado: |
      Calcular la velocidad a la que el coche se está alejando del edificio en
      llamas.

      <figure class="figura-examen">
      <svg viewBox="0 0 620 380" role="img" width="600" height="368"
           aria-labelledby="f2223b1t f2223b1d">
        <title id="f2223b1t">El coche y el edificio en llamas</title>
        <desc id="f2223b1d">Un edificio de tres kilometros de altura con fuego
        en lo alto. En el suelo, a cuatro kilometros de su base, un coche que
        se aleja a cinco kilometros por hora. Se marca con trazos la distancia
        recta entre el fuego y el coche.</desc>

        <g stroke="var(--flag)" stroke-width="2.2" fill="none"
           stroke-dasharray="8 6">
          <path d="M120 70 L470 300"></path>
        </g>

        <g stroke="var(--graphite)" stroke-width="2" fill="none">
          <path d="M120 70 L120 300 M120 300 L470 300"></path>
        </g>

        <g stroke="var(--graphite)" stroke-width="1.4" fill="none">
          <path d="M76 78 L76 292 M70 78 L82 78 M70 292 L82 292"></path>
          <path d="M126 336 L464 336 M126 330 L126 342 M464 330 L464 342"></path>
        </g>

        <rect x="96" y="34" width="48" height="40" fill="var(--flag)"
              fill-opacity="0.14" stroke="var(--flag)" stroke-width="1.6"></rect>

        <g stroke="var(--flag)" stroke-width="2.4" fill="none"
           stroke-linecap="round">
          <path d="M110 66 C 112 54, 120 52, 118 42 C 128 50, 132 58, 128 66"></path>
        </g>

        <g fill="var(--live)">
          <rect x="450" y="284" width="44" height="16" rx="4"></rect>
          <circle cx="460" cy="302" r="6"></circle>
          <circle cx="486" cy="302" r="6"></circle>
        </g>

        <g stroke="var(--live)" stroke-width="2.4" fill="none"
           stroke-linecap="round">
          <path d="M506 292 L544 292 M534 284 L544 292 L534 300"></path>
        </g>

        <g fill="var(--graphite)" font-size="14" font-family="var(--mono)">
          <text x="30" y="190">3 km</text>
          <text x="272" y="358">4 km</text>
        </g>

        <g fill="var(--live)" font-size="14" font-family="var(--mono)">
          <text x="500" y="278">5 km/h</text>
        </g>

        <g fill="var(--flag)" font-size="14" font-family="var(--mono)">
          <text x="286" y="176">D</text>
        </g>
      </svg>
      <figcaption>
      Figura nuestra, redibujada: el enunciado original trae un dibujo con
      imagenes prestadas, que por §08 no entran en el repositorio. En rojo la
      distancia D entre el fuego y el coche, que es lo que hay que derivar.
      </figcaption>
      </figure>
    pide: Calcular a qué velocidad crece la distancia al edificio.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué se mantiene constante mientras el coche avanza?
        opciones:
          - texto: >-
              La **altura del edificio**, 3 km: es el cateto fijo del triángulo
            correcta: true
            mensaje: |
              Exacto. El fuego no se mueve y el coche va por el suelo, así que
              el cateto vertical vale siempre 3. Lo que cambia es el cateto
              horizontal, y con él la hipotenusa. Identificar qué es constante
              y qué es función del tiempo es el punto de COMP1.
          - texto: La distancia $D$ al fuego
            mensaje: |
              $D$ es justamente lo que cambia: es lo que hay que derivar.
          - texto: >-
              Los 4 km horizontales
            mensaje: |
              Los 4 km son el valor **en ese instante**, no una constante. Si lo
              fueran, el coche estaría parado.
          - texto: La velocidad de crecimiento de $D$
            mensaje: |
              No es constante: depende de dónde esté el coche. En el instante
              del enunciado vale 4 km/h, pero más lejos se acercaría a 5.

      - tipo: calcular
        titulo: La distancia en ese instante
        pregunta: |
          ¿A qué distancia está el coche del fuego?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.01
          formato: un número en km
        distractores:
          - valor: '7'
            mensaje: |
              7 es $3+4$, sumando los catetos. Son **perpendiculares**: hay que
              componerlos con Pitágoras.
          - valor: '4'
            mensaje: |
              4 es la distancia horizontal a la base del edificio, no al fuego,
              que está 3 km más arriba.
          - valor: '3.6055513'
            mensaje: |
              $\sqrt{13}$ sale de $\sqrt{9+4}$: has sumado 4 en vez de $4^{2}$.
        pista: |
          Triángulo rectángulo de catetos 3 y 4.
        desarrollo: |
          $$
          D = \sqrt{x^{2}+3^{2}} = \sqrt{16+9} = \sqrt{25} = 5 \ \text{km}
          $$

          El clásico triángulo 3-4-5. Los números del enunciado están elegidos
          para eso: sin calculadora, cualquier otro trío sería impracticable.
        veredicto: |
          Que salga 5 exacto no es casualidad. Y de paso da una comprobación:
          si la hipotenusa no hubiera salido entera, habría un error de
          planteamiento.

      - tipo: calcular
        titulo: La velocidad
        pregunta: |
          ¿A qué velocidad se aleja el coche del fuego?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.01
          formato: un número en km/h
        distractores:
          - valor: '5'
            mensaje: |
              5 km/h es la velocidad del **coche** por la carretera. La
              distancia al fuego crece más despacio, porque parte del
              movimiento no se emplea en alejarse en línea recta.
          - valor: '3'
            mensaje: |
              3 sale de usar $\frac{3}{5}$ como factor. El factor es
              $\frac{x}{D} = \frac45$: el cateto que **cambia**, no el fijo.
          - valor: '6.25'
            mensaje: |
              $6{,}25$ sale de **dividir** entre $\frac45$ en vez de
              multiplicar. Y sería absurdo: la distancia no puede crecer más
              deprisa que el propio coche.
        pista: |
          Deriva $D^{2} = x^{2}+9$ respecto del tiempo.
        desarrollo: |
          $$
          D^{2} = x^{2}+9
          \;\Longrightarrow\;
          2D\,\frac{dD}{dt} = 2x\,\frac{dx}{dt}
          $$

          $$
          \frac{dD}{dt} = \frac{x}{D}\cdot\frac{dx}{dt}
          $$

          Con $x=4$, $D=5$ y $\frac{dx}{dt}=5$:

          $$
          \frac{dD}{dt} = \frac45\cdot5 = 4 \ \text{km/h}
          $$
        veredicto: |
          El factor $\frac45$ es el coseno del ángulo entre la carretera y la
          línea que une el coche con el fuego. Solo esa fracción de la velocidad
          sirve para alejarse.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La geometría.** El fuego, la base del edificio y el coche forman
              un triángulo rectángulo con el cateto vertical **fijo** en 3 km.
          - texto: |
              **La relación**, válida en todo instante:
              $D^{2} = x^{2}+9$, con $x$ y $D$ funciones del tiempo.
          - texto: |
              **Derivar respecto de $t$:**
              $2D\,D' = 2x\,x'$, de donde
              $D' = \frac{x}{D}\,x'$.
          - texto: |
              **Sustituir después de derivar:** $x=4$, $D=5$ y $x'=5$.
          - texto: |
              $D' = \frac45\cdot5 = 4$ km/h. Y es menor que los 5 km/h del
              coche, como tiene que ser.
          - texto: |
              Como el coche va a 5 km/h y el edificio no se mueve, la distancia
              crece también a 5 km/h.
            trampa: true
            mensaje: |
              Solo sería cierto si el coche se alejara **en la dirección de la
              recta** que lo une con el fuego, y no lo hace: va por el suelo,
              mientras el fuego está arriba. Parte de su movimiento se emplea en
              rodear el edificio, no en alejarse de él. Por eso $4 < 5$.
        veredicto: |
          La comprobación más barata del ejercicio: el resultado tiene que ser
          **menor** que la velocidad del coche. Si sale mayor, hay un error de
          planteamiento.

    resolucion: |
      **Datos.** Edificio de 3 km con fuego en lo alto; coche a 4 km de la base
      alejándose a 5 km/h.

      > Este ejercicio está publicado como **3.17** en el boletín del tema 3,
      > con los mismos números y la misma respuesta. Es una de las veinte
      > repeticiones literales documentadas entre boletines y exámenes.

      ### 1 · Qué tipo de problema es

      **Tasas relacionadas.** Dos magnitudes ligadas por una identidad
      geométrica; se conoce la velocidad de una y se pide la de la otra. El
      método tiene un orden que no se puede alterar:

      1. escribir la relación, **válida en todo instante**;
      2. derivar respecto del tiempo;
      3. **solo entonces** sustituir los valores del instante.

      ### 2 · Plantear

      Sea $x(t)$ la distancia horizontal del coche a la base del edificio y
      $D(t)$ su distancia al fuego. El cateto vertical **no cambia**: el fuego
      está a 3 km de altura y ahí se queda.

      $$
      D^{2} = x^{2}+3^{2} = x^{2}+9
      $$

      ### 3 · Derivar

      $$
      2D\,\frac{dD}{dt} = 2x\,\frac{dx}{dt}
      \;\Longrightarrow\;
      \frac{dD}{dt} = \frac{x}{D}\cdot\frac{dx}{dt}
      $$

      ### 4 · Sustituir

      En el instante del enunciado, $x=4$, y por Pitágoras

      $$
      D = \sqrt{16+9} = 5 \ \text{km}
      $$

      el clásico triángulo 3-4-5. Con $\frac{dx}{dt} = 5$ km/h:

      $$
      \boxed{\frac{dD}{dt} = \frac{4}{5}\cdot5 = 4 \ \text{km/h}}
      $$

      ### 5 · Por qué 4 y no 5

      El coche va a 5 km/h, pero **no se aleja del fuego a 5 km/h**. Solo la
      componente de su movimiento en la dirección coche-fuego cuenta, y esa
      componente es

      $$
      \frac{x}{D} = \frac45 = 0{,}8
      $$

      es decir, el coseno del ángulo que forma la carretera con esa recta. El
      20 % restante lo emplea en rodear el edificio.

      ### 6 · Comprobación

      **Por acotación.** El resultado tiene que estar entre 0 y 5:

      $$
      0 < 4 < 5 \quad\checkmark
      $$

      Es la comprobación más barata que existe, y caza el error de dividir en
      vez de multiplicar, que daría $6{,}25$ — imposible.

      **Por los casos extremos.**

      | dónde está el coche | $\frac{x}{D}$ | $\frac{dD}{dt}$ |
      |---|---|---|
      | en la base ($x=0$) | $0$ | $0$ |
      | en $x=4$ | $\frac45$ | $4$ |
      | muy lejos ($x\to\infty$) | $\to1$ | $\to5$ |

      Justo sobre la base no se alejaría nada del fuego —solo bajaría por
      debajo de él—, y muy lejos los 3 km de altura serían despreciables y la
      distancia crecería casi a 5 km/h ✔ El resultado encaja en medio.

      **Numérica.** En una décima de hora el coche avanza $0{,}5$ km:

      $$
      D_{\text{nuevo}} = \sqrt{4{,}5^{2}+9} = \sqrt{29{,}25} = 5{,}408
      $$

      Ha crecido $0{,}408$ km en $0{,}1$ h, es decir unos $4{,}08$ km/h ✔
      Coherente con los 4 km/h instantáneos.

  - id: ex2223-2ev-2-grado-del-polinomio
    titulo: Cuántas condiciones caben en un polinomio
    fuente: >-
      Ejercicio 2 · Segunda evaluación, 28 de noviembre de 2022 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    enunciado: |
      **a)** Sea la función

      $$
      f(x) = \begin{cases}
      g(x) & x<0 \\[4pt]
      e^{\mathrm{sen}\,x} & 0 \le x \le 2\pi \\[4pt]
      g(x) & 2\pi < x
      \end{cases}
      $$

      donde $g(x)$ es un polinomio de grado 2 o 3, es decir,
      $g(x) = ax^{2}+bx+c$ o $g(x) = ax^{3}+bx^{2}+cx+d$. ¿Qué grado debe tener
      $g(x)$ para que la función $f(x)$ sea continua y derivable en
      $\mathbb{R}$? Razonar la respuesta.

      **b)** Calcular los coeficientes de la función $g(x)$.
    pide: Decidir el grado y calcular los coeficientes.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántas condiciones impone el enunciado sobre $g$?
        opciones:
          - texto: >-
              **Cuatro**: continuidad y derivabilidad en $x=0$ y en $x=2\pi$
            correcta: true
            mensaje: |
              Exacto. Dos empalmes, y en cada uno dos condiciones: que los
              valores coincidan y que las pendientes coincidan. Cuatro
              ecuaciones exigen cuatro coeficientes, y eso decide el grado antes
              de calcular nada.
          - texto: Dos, una por cada empalme
            mensaje: |
              En cada empalme hay **dos**: continuidad y derivabilidad son
              condiciones distintas.
          - texto: Tres, porque $g$ es la misma a los dos lados
            mensaje: |
              Que sea el mismo polinomio no reduce las condiciones: tiene que
              cumplirlas todas a la vez. Al contrario, eso es lo que hace el
              problema interesante.
          - texto: >-
              Una, la continuidad en $\mathbb{R}$
            mensaje: |
              El enunciado pide continua **y derivable**, y en dos puntos
              distintos.

      - tipo: calcular
        titulo: El valor en los empalmes
        pregunta: |
          ¿Cuánto vale $e^{\mathrm{sen}\,x}$ en $x=0$ y en $x=2\pi$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2.7182818'
            mensaje: |
              $e$ sería $e^{1}$, y el seno no vale 1 ni en 0 ni en $2\pi$: vale
              **0** en los dos.
          - valor: '0'
            mensaje: |
              0 es el valor del **seno**, no de la exponencial. $e^{0} = 1$.
          - valor: '6.2831853'
            mensaje: |
              $2\pi$ es el punto, no el valor.
        pista: |
          $\mathrm{sen}\,0 = \mathrm{sen}\,2\pi = 0$.
        desarrollo: |
          $$
          \mathrm{sen}\,0 = 0
          \;\Longrightarrow\;
          e^{\mathrm{sen}\,0} = e^{0} = 1
          $$

          $$
          \mathrm{sen}\,2\pi = 0
          \;\Longrightarrow\;
          e^{\mathrm{sen}\,2\pi} = 1
          $$

          Y las derivadas, con
          $\left(e^{\mathrm{sen}\,x}\right)' = e^{\mathrm{sen}\,x}\cos x$:

          $$
          \text{en } x=0: \ 1\cdot1 = 1
          \qquad
          \text{en } x=2\pi: \ 1\cdot1 = 1
          $$

          Las cuatro condiciones son, por tanto, $g(0)=1$, $g'(0)=1$,
          $g(2\pi)=1$ y $g'(2\pi)=1$.
        veredicto: |
          El tramo central empieza y acaba **igual**, con el mismo valor y la
          misma pendiente. Eso es lo que hace que el problema tenga solución
          bonita.

      - tipo: calcular
        titulo: El coeficiente principal
        pregunta: |
          Con $g$ de grado 3, ¿cuánto vale su coeficiente $a$? Da cuatro
          decimales.
        respuesta:
          tipo: numero
          valor: '0.0507'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '-0.4775'
            mensaje: |
              $-\frac{3}{2\pi} \approx -0{,}477$ es el coeficiente $b$, no $a$.
          - valor: '0.1592'
            mensaje: |
              $\frac{1}{2\pi} \approx 0{,}159$ olvida un $\pi$: el resultado es
              $\frac{1}{2\pi^{2}}$.
          - valor: '1'
            mensaje: |
              1 son los coeficientes $c$ y $d$, que salen directamente de las
              condiciones en $x=0$.
        pista: |
          De $g'(2\pi)=1$ sale $b = -3\pi a$. Sustituye en $g(2\pi)=1$.
        desarrollo: |
          Con $g(x) = ax^{3}+bx^{2}+cx+d$:

          $$
          g(0) = d = 1,
          \qquad
          g'(0) = c = 1
          $$

          **De $g'(2\pi) = 1$**, con $g'(x) = 3ax^{2}+2bx+c$:

          $$
          12\pi^{2}a+4\pi b+1 = 1
          \;\Longrightarrow\;
          3\pi a + b = 0
          \;\Longrightarrow\;
          b = -3\pi a
          $$

          **De $g(2\pi) = 1$:**

          $$
          8\pi^{3}a+4\pi^{2}b+2\pi+1 = 1
          \;\Longrightarrow\;
          8\pi^{3}a+4\pi^{2}b = -2\pi
          $$

          Sustituyendo $b = -3\pi a$:

          $$
          8\pi^{3}a-12\pi^{3}a = -2\pi
          \;\Longrightarrow\;
          -4\pi^{3}a = -2\pi
          $$

          $$
          a = \frac{1}{2\pi^{2}} \approx 0{,}0507
          $$
        veredicto: |
          Los $\pi$ se cancelan hasta dejar $\frac{1}{2\pi^{2}}$, que es todo lo
          limpio que puede salir con un empalme en $2\pi$.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento del apartado (a). Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **Contar condiciones.** Dos empalmes —$x=0$ y $x=2\pi$— con dos
              condiciones cada uno: **cuatro** ecuaciones.
          - texto: |
              **Contar incógnitas.** Un polinomio de grado 2 tiene **tres**
              coeficientes; uno de grado 3 tiene **cuatro**.
          - texto: |
              **Comprobar que grado 2 no basta.** Con $g=ax^{2}+bx+c$ salen
              $c=1$, $b=1$ y, de $g(2\pi)=1$, $a=-\frac{1}{2\pi}$. Pero entonces
              $g'(2\pi) = 4\pi a+1 = -1 \neq 1$: la cuarta condición **falla**.
          - texto: |
              Luego hace falta **grado 3**, que aporta el coeficiente que
              faltaba.
          - texto: |
              **(b)** Resolviendo: $d=1$, $c=1$, $b=-\frac{3}{2\pi}$ y
              $a=\frac{1}{2\pi^{2}}$.
          - texto: |
              Con cuatro condiciones y cuatro incógnitas, el sistema siempre
              tiene solución, así que basta contar para responder al apartado
              (a).
            trampa: true
            mensaje: |
              Contar da la **sospecha**, no la respuesta. Un sistema de cuatro
              ecuaciones con cuatro incógnitas puede ser incompatible, y uno de
              cuatro con tres puede ser compatible si las ecuaciones son
              dependientes. El enunciado dice «razonar la respuesta»: hay que
              **comprobar** que el grado 2 falla y que el 3 funciona, no
              limitarse a contar.
        veredicto: |
          El apartado (a) vale porque obliga a justificar, no a acertar. Contar
          orienta; comprobar demuestra.

    resolucion: |
      **Datos.** $f$ vale $e^{\mathrm{sen}\,x}$ en $[0,2\pi]$ y un polinomio
      $g$ fuera. Se pide el grado de $g$ y sus coeficientes.

      ### 1 · Las cuatro condiciones

      Dentro de cada tramo $f$ ya es continua y derivable: la exponencial del
      seno lo es, y un polinomio también. Todo se juega en los **dos empalmes**,
      y en cada uno hay **dos** condiciones.

      El tramo central vale, en sus dos extremos:

      $$
      e^{\mathrm{sen}\,0} = e^{0} = 1,
      \qquad
      e^{\mathrm{sen}\,2\pi} = e^{0} = 1
      $$

      y su derivada, $\left(e^{\mathrm{sen}\,x}\right)' = e^{\mathrm{sen}\,x}
      \cos x$:

      $$
      1\cdot\cos0 = 1,
      \qquad
      1\cdot\cos2\pi = 1
      $$

      Las cuatro condiciones son, entonces:

      $$
      g(0)=1, \qquad g'(0)=1, \qquad g(2\pi)=1, \qquad g'(2\pi)=1
      $$

      **El tramo central empieza y acaba igual**, con el mismo valor y la misma
      pendiente. Eso es lo que hace el problema simétrico.

      ### 2 · Apartado (a): por qué grado 3

      Contar orienta: cuatro condiciones, y el grado 2 solo tiene tres
      coeficientes. Pero contar **no demuestra** — hay que comprobarlo.

      **Grado 2: $g(x) = ax^{2}+bx+c$.**

      $$
      g(0) = c = 1,
      \qquad
      g'(0) = b = 1
      $$

      $$
      g(2\pi) = 4\pi^{2}a+2\pi+1 = 1
      \;\Longrightarrow\;
      a = -\frac{1}{2\pi}
      $$

      Y ahora la cuarta condición:

      $$
      g'(2\pi) = 2a(2\pi)+b = 4\pi\left(-\frac{1}{2\pi}\right)+1
      = -2+1 = -1
      $$

      $$
      -1 \neq 1
      $$

      **Falla.** El polinomio de grado 2 puede cumplir tres condiciones, pero no
      las cuatro.

      $$
      \boxed{\text{Hace falta grado 3}}
      $$

      ### 3 · Apartado (b): los coeficientes

      $$
      g(x) = ax^{3}+bx^{2}+cx+d,
      \qquad
      g'(x) = 3ax^{2}+2bx+c
      $$

      **En $x=0$**, inmediato:

      $$
      d = 1, \qquad c = 1
      $$

      **En $x=2\pi$**, las dos condiciones:

      $$
      g'(2\pi): \quad 12\pi^{2}a+4\pi b+1 = 1
      \;\Longrightarrow\;
      3\pi a+b = 0
      \;\Longrightarrow\;
      b = -3\pi a
      $$

      $$
      g(2\pi): \quad 8\pi^{3}a+4\pi^{2}b+2\pi+1 = 1
      \;\Longrightarrow\;
      8\pi^{3}a+4\pi^{2}b = -2\pi
      $$

      Sustituyendo $b$:

      $$
      8\pi^{3}a-12\pi^{3}a = -2\pi
      \;\Longrightarrow\;
      -4\pi^{3}a = -2\pi
      \;\Longrightarrow\;
      a = \frac{1}{2\pi^{2}}
      $$

      $$
      b = -3\pi\cdot\frac{1}{2\pi^{2}} = -\frac{3}{2\pi}
      $$

      $$
      \boxed{g(x) = \frac{x^{3}}{2\pi^{2}}-\frac{3x^{2}}{2\pi}+x+1}
      $$

      ### 4 · Comprobación

      **Las cuatro condiciones, una a una:**

      $$
      g(0) = 1 \quad\checkmark
      \qquad
      g'(0) = 1 \quad\checkmark
      $$

      $$
      g(2\pi) = \frac{8\pi^{3}}{2\pi^{2}}-\frac{3\cdot4\pi^{2}}{2\pi}+2\pi+1
      = 4\pi-6\pi+2\pi+1 = 1 \quad\checkmark
      $$

      $$
      g'(2\pi) = \frac{3\cdot4\pi^{2}}{2\pi^{2}}-\frac{3\cdot2\cdot2\pi}{2\pi}+1
      = 6-6+1 = 1 \quad\checkmark
      $$

      **Numérica.** Con $\pi \approx 3{,}1416$:

      $$
      a \approx 0{,}0507, \qquad b \approx -0{,}4775
      $$

      Y en un punto intermedio, $x = \pi$:

      $$
      g(\pi) = \frac{\pi^{3}}{2\pi^{2}}-\frac{3\pi^{2}}{2\pi}+\pi+1
      = \frac{\pi}{2}-\frac{3\pi}{2}+\pi+1 = 1
      $$

      Curioso: $g(\pi) = 1$ también. El polinomio corta tres veces la recta
      $y=1$ —en $0$, $\pi$ y $2\pi$—, y tenía que ser así: $g(x)-1$ es una
      cúbica con esas tres raíces.

      De hecho eso permite escribirlo de otra forma:

      $$
      g(x) = 1+\frac{x(x-\pi)(x-2\pi)}{2\pi^{2}}
      $$

      Desarrollando se recupera lo mismo ✔ Es una comprobación por vía
      completamente distinta.

  - id: ex2223-2ev-3-recta-que-minimiza-la-suma
    titulo: La recta que hace mínima la suma de los cortes
    fuente: >-
      Ejercicio 3 · Segunda evaluación, 28 de noviembre de 2022 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    enunciado: |
      Consideremos una recta que pasa por el punto $(1,4)$. Sabiendo que dicha
      recta corta a los ejes OX y OY en los puntos $(a,0)$ y $(0,b)$
      $\left(\text{con } a,b>0\right)$, calcular la pendiente de la recta para
      que $a+b$ sea mínimo.
    pide: Calcular la pendiente que minimiza $a+b$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la ligadura entre $a$ y $b$?
        opciones:
          - texto: >-
              Que la recta pase por $(1,4)$:
              $\dfrac{1}{a}+\dfrac{4}{b} = 1$
            correcta: true
            mensaje: |
              Exacto. La forma **segmentaria** de la recta,
              $\frac xa+\frac yb = 1$, tiene los dos cortes metidos dentro, así
              que imponer que pase por $(1,4)$ da la ligadura de un plumazo.
              Escribirla en forma $y=mx+n$ funciona igual, pero da más vueltas.
          - texto: $a+b = 5$
            mensaje: |
              $a+b$ es lo que hay que **minimizar**, no un dato. Y $5$ no sale
              de ningún sitio.
          - texto: $ab = 4$
            mensaje: |
              Esa sería la condición para que el área del triángulo fuera 2. El
              enunciado no dice nada del área.
          - texto: >-
              No hay ligadura: $a$ y $b$ son libres
            mensaje: |
              Si lo fueran, $a+b$ no tendría mínimo: bastaría acercar los dos a
              cero. Lo que impide eso es que la recta debe pasar por $(1,4)$.

      - tipo: calcular
        titulo: El corte con OX
        pregunta: |
          ¿Cuánto vale $a$ en el óptimo?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '6'
            mensaje: |
              6 es el valor de $b$, el corte con el eje $OY$.
          - valor: '1'
            mensaje: |
              1 es la abscisa del punto por el que pasa la recta, no el corte
              con el eje.
          - valor: '2'
            mensaje: |
              2 saldría de $(a-1)^{2}=1$. La ecuación es $(a-1)^{2}=4$, así que
              $a-1=2$.
        pista: |
          Despeja $b = \frac{4a}{a-1}$ y minimiza $S(a) = a+\frac{4a}{a-1}$.
        desarrollo: |
          De la ligadura $\frac1a+\frac4b = 1$:

          $$
          \frac4b = 1-\frac1a = \frac{a-1}{a}
          \;\Longrightarrow\;
          b = \frac{4a}{a-1}
          $$

          con $a>1$, para que $b>0$.

          $$
          S(a) = a+\frac{4a}{a-1}
          $$

          $$
          S'(a) = 1+\frac{4(a-1)-4a}{(a-1)^{2}}
          = 1-\frac{4}{(a-1)^{2}}
          $$

          $$
          S'(a) = 0
          \;\Longrightarrow\;
          (a-1)^{2} = 4
          \;\Longrightarrow\;
          a-1 = 2
          \;\Longrightarrow\;
          a = 3
          $$

          Se toma la raíz positiva porque hace falta $a>1$.
        veredicto: |
          La condición $a>1$ no es un tecnicismo: si $a\le1$ la recta no puede
          cortar el eje $OY$ en la parte positiva pasando por $(1,4)$. Y es lo
          que descarta la raíz $a=-1$.

      - tipo: calcular
        titulo: La pendiente
        pregunta: |
          ¿Cuál es la pendiente de esa recta?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Falta el signo. La recta baja: corta $OY$ en $6$ y $OX$ en $3$,
              así que su pendiente es negativa. Con pendiente positiva no podría
              cortar los dos semiejes positivos.
          - valor: '-0.5'
            mensaje: |
              $-\frac12$ es el inverso cambiado de signo. La pendiente es
              $\frac{0-b}{a-0} = -\frac ba = -\frac63$.
          - valor: '-6'
            mensaje: |
              $-6$ es $-b$. La pendiente divide entre $a$.
        pista: |
          La recta pasa por $(3,0)$ y $(0,6)$.
        desarrollo: |
          Con $a=3$:

          $$
          b = \frac{4\cdot3}{3-1} = \frac{12}{2} = 6
          $$

          La recta pasa por $(3,0)$ y $(0,6)$:

          $$
          m = \frac{0-6}{3-0} = -2
          $$

          Es decir, $y = -2x+6$.

          Y en efecto pasa por $(1,4)$: $-2+6 = 4$ ✔
        veredicto: |
          $a+b = 3+6 = 9$. Cualquier otra recta por $(1,4)$ que corte los dos
          semiejes positivos da una suma mayor.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La forma segmentaria:** $\frac xa+\frac yb = 1$, que lleva los
              dos cortes dentro.
          - texto: |
              **La ligadura**, imponiendo que pase por $(1,4)$:
              $\frac1a+\frac4b = 1$, de donde $b = \frac{4a}{a-1}$ con $a>1$.
          - texto: |
              **La función objetivo:** $S(a) = a+\frac{4a}{a-1}$, con una sola
              incógnita.
          - texto: |
              **Derivar:** $S'(a) = 1-\frac{4}{(a-1)^{2}}$, que se anula en
              $a=3$ dentro del dominio.
          - texto: |
              **Justificar que es mínimo:**
              $S''(a) = \frac{8}{(a-1)^{3}} > 0$ para $a>1$. Y deshacer:
              $b=6$, pendiente $-2$.
          - texto: |
              Como $a$ y $b$ son los cortes con los ejes y su suma es mínima, la
              recta debe formar 45 grados con ellos.
            trampa: true
            mensaje: |
              Si formara 45 grados sería $a=b$, y aquí $a=3$ y $b=6$. La
              simetría entre los dos cortes se rompe porque el punto $(1,4)$ no
              está sobre la bisectriz: está cuatro veces más arriba que a la
              derecha. Suponer simetría sin comprobarla es un atajo que aquí da
              la respuesta equivocada.
        veredicto: |
          Que $b$ salga el doble de $a$ tiene que ver con que la ordenada de
          $(1,4)$ es cuatro veces su abscisa. Merece la pena verlo, pero
          deducirlo requiere hacer la cuenta.

    resolucion: |
      **Datos.** Una recta por $(1,4)$ que corta los semiejes positivos en
      $(a,0)$ y $(0,b)$. Se pide la pendiente que minimiza $a+b$.

      ### 1 · Elegir bien la ecuación de la recta

      Se podría escribir $y = mx+n$ y despejar los cortes, pero hay una forma
      que ya los lleva dentro: la **segmentaria**

      $$
      \frac{x}{a}+\frac{y}{b} = 1
      $$

      Sus cortes con los ejes son exactamente $(a,0)$ y $(0,b)$. Elegirla ahorra
      la mitad del trabajo.

      ### 2 · La ligadura

      La recta pasa por $(1,4)$:

      $$
      \frac{1}{a}+\frac{4}{b} = 1
      $$

      Despejando $b$:

      $$
      \frac4b = \frac{a-1}{a}
      \;\Longrightarrow\;
      b = \frac{4a}{a-1}
      $$

      **El dominio:** hace falta $b>0$, y como $a>0$, eso obliga a

      $$
      a > 1
      $$

      Tiene sentido geométrico: si el corte con $OX$ estuviera a la izquierda de
      $x=1$, la recta pasaría por $(1,4)$ subiendo, y no podría cortar el
      semieje $OY$ positivo.

      ### 3 · Optimizar

      $$
      S(a) = a+\frac{4a}{a-1}, \qquad a>1
      $$

      $$
      S'(a) = 1+\frac{4(a-1)-4a}{(a-1)^{2}}
      = 1-\frac{4}{(a-1)^{2}}
      $$

      $$
      S'(a) = 0
      \;\Longrightarrow\;
      (a-1)^{2} = 4
      \;\Longrightarrow\;
      a = 3 \ \text{ o } \ a = -1
      $$

      La segunda queda fuera del dominio.

      **Que es mínimo:**

      $$
      S''(a) = \frac{8}{(a-1)^{3}} > 0 \quad \text{para } a>1
      $$

      Positiva en todo el dominio: $S$ es **convexa** ahí, así que el punto
      crítico es mínimo **absoluto**.

      ### 4 · Deshacer

      $$
      b = \frac{4\cdot3}{2} = 6,
      \qquad
      a+b = 9
      $$

      La recta pasa por $(3,0)$ y $(0,6)$:

      $$
      \boxed{m = \frac{0-6}{3-0} = -2}
      $$

      es decir, $y = -2x+6$.

      ### 5 · Comprobación

      **Que pasa por el punto dado.** $-2(1)+6 = 4$ ✔

      **Numérica**, probando otras rectas por $(1,4)$:

      | $a$ | $b = \frac{4a}{a-1}$ | $a+b$ |
      |---|---|---|
      | $1{,}5$ | $12$ | $13{,}5$ |
      | $2$ | $8$ | $10$ |
      | $3$ | $6$ | $\mathbf{9}$ |
      | $5$ | $5$ | $10$ |
      | $9$ | $4{,}5$ | $13{,}5$ |

      El $9$ es el menor ✔ Y nótese que $a=5$ da $a=b$ —la recta a 45°— con
      suma $10$: **peor** que el óptimo. La simetría no era la respuesta.

      **Por los extremos del dominio.**

      $$
      \lim_{a\to1^{+}}S(a) = +\infty,
      \qquad
      \lim_{a\to\infty}S(a) = +\infty
      $$

      —en el primer caso porque $b$ se dispara, en el segundo porque lo hace
      $a$—. El mínimo tiene que estar en medio ✔

      **Del signo de la pendiente.** Para cortar los dos semiejes positivos, la
      recta debe **bajar**. Y $-2<0$ ✔

  - id: ex2223-2ev-4-cota-y-error-exacto
    titulo: Una cota de error, y el error de verdad
    fuente: >-
      Ejercicio 4 · Segunda evaluación, 28 de noviembre de 2022 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 3
      comp4: 6

    enunciado: |
      En la imagen se muestran las gráficas de una función $y(x)$ y de sus dos
      primeras derivadas $y'(x)$ e $y''(x)$.

      <figure class="figura-examen">
      <svg viewBox="0 0 780 500" role="img" width="760" height="487"
           aria-labelledby="f2223b4t f2223b4d">
