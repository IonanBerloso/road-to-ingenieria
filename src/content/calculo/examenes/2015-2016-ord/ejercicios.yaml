      </svg>
      <figcaption>
      Figura redibujada del enunciado original, que está hecho a mano. Se
      conserva lo que decide el ejercicio: una curva tiene una meseta casi
      horizontal a la izquierda y un mínimo profundo a la derecha; la otra tiene
      una joroba justo donde la primera corta al eje.
      </figcaption>
      </figure>

      a) Identificar de forma razonada qué gráfica corresponde a $F(x)$ y qué
      gráfica corresponde a $F'(x)$.

      b) Estudiar el crecimiento, decrecimiento y los extremos de la nueva
      función $h(x)=\left(F(x)\right)^{2}$.
    pide: Quién es quién, y la monotonía y los extremos de F al cuadrado.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué se compara para decidir cuál de las dos es la derivada?
        opciones:
          - texto: >-
              Los ceros de una con los extremos de la otra, mirando además el
              **sentido** del cruce
            correcta: true
            mensaje: |
              Eso es. Si $G=F'$, cada cero de $G$ tiene que caer en un extremo de
              $F$, y $G$ tiene que pasar de positiva a negativa donde $F$ tiene
              un máximo. Mirar solo los ceros no basta: el sentido del cruce es
              lo que evita el emparejamiento equivocado.
          - texto: Cuál de las dos está más arriba
            mensaje: |
              La altura no dice nada: sumar una constante a $F$ la sube entera
              sin cambiar su derivada. Lo que importa son las formas, no las
              posiciones.
          - texto: Cuál de las dos es más suave
            mensaje: |
              Suele ser cierto —derivar «rompe» un poco— pero no es un argumento:
              hay funciones suavísimas con derivadas suavísimas. Y aquí las dos
              curvas son igual de suaves.

      - tipo: calcular
        titulo: Dónde está el máximo
        pregunta: |
          Con la pareja de la figura, $F'(x)=\frac{x^{4}}{4}-\frac43 x^{3}
          +0{,}74x^{2}-0{,}144x+3{,}2474$. ¿En qué punto tiene $F$ su máximo?
        respuesta:
          tipo: numero
          valor: '1.85'
          tolerancia: 0.01
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0'
            mensaje: |
              En $x=0$ es donde $F$ **corta al eje**, no donde tiene su máximo.
              Confundir un cero de $F$ con un cero de $F'$ es justo lo que este
              ejercicio quiere descartar.
          - valor: '3.6'
            mensaje: |
              En $3{,}6$ está el **mínimo de $F'$**, que en $F$ es un punto de
              inflexión: allí la curva baja lo más deprisa que va a bajar, pero
              no deja de bajar.
          - valor: '0.2'
            mensaje: |
              $0{,}2$ es el hombro de $F'$, donde su pendiente se anula. En $F$
              eso también es una inflexión, no un extremo.
        pista: |
          Los extremos de $F$ están donde $F'=0$, y esa cuártica solo cruza el
          eje una vez dentro del intervalo.
        desarrollo: |
          $F'$ se anula en $x=1{,}85$, y ahí cambia de positiva a negativa: $F$
          pasa de crecer a decrecer, luego es un **máximo**. Vale $F(1{,}85)
          \approx4{,}50$.

          En $x=0{,}2$ (hombro) y en $x=3{,}6$ (mínimo de $F'$) hay puntos de
          inflexión de $F$, no extremos.

      - tipo: calcular
        titulo: El otro cero de F
        pregunta: |
          $F$ corta al eje en $x=0$ y una vez más. ¿Dónde?
        respuesta:
          tipo: numero
          valor: '3.1374'
          tolerancia: 0.01
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.85'
            mensaje: |
              En $1{,}85$ está el máximo de $F$, con valor $4{,}50$: bien lejos
              del eje. El corte viene después, cuando ya ha bajado.
          - valor: '3.6'
            mensaje: |
              En $3{,}6$ $F$ ya está por debajo del eje —vale unos $-2{,}9$—.
              Ese punto es el mínimo de $F'$, no un cero de $F$.
          - valor: '4.2'
            mensaje: |
              $4{,}2$ es el extremo derecho del intervalo, donde $F$ vale unos
              $-7{,}7$. El corte con el eje está bastante antes.
        pista: |
          $F$ es la primitiva de $F'$ con $F(0)=0$; su segundo cero está entre
          $3$ y $3{,}2$.
        desarrollo: |
          $$
          F(x)=\frac{x^{5}}{20}-\frac{x^{4}}{3}+\frac{0{,}74}{3}x^{3}
          -0{,}072x^{2}+3{,}2474\,x
          $$

          $F(3)\approx0{,}90$ y $F(3{,}2)\approx-0{,}44$: el cero está en
          $x\approx3{,}14$.

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              $h=F^{2}$, así que $h'=2F\,F'$: el signo de $h'$ es el **producto**
              de los signos de $F$ y de $F'$.
          - texto: >-
              $F$ es negativa a la izquierda de su primer cero y a la derecha del
              segundo; $F'$ es positiva hasta su único cero, en el máximo de $F$,
              y negativa después.
          - texto: >-
              Multiplicando signos: $h$ decrece, crece, decrece y vuelve a
              crecer. Los mínimos de $h$ están en los dos ceros de $F$ —donde
              $h=0$— y el máximo, en el máximo de $F$.
          - texto: >-
              Como $h=F^{2}$ es siempre positiva, $h$ crece exactamente donde
              crece $F$.
            trampa: true
            mensaje: |
              Que $h$ sea positiva no dice nada de su monotonía. Donde $F$ es
              **negativa y creciente**, $F$ se acerca a cero y su cuadrado
              **decrece**: eso pasa en todo el primer tramo. Elevar al cuadrado
              invierte el crecimiento en la parte negativa, y ahí está la gracia
              del apartado.
    resolucion: |
      **a) Quién es quién.** La regla es la de siempre: **los ceros de la
      derivada caen en los extremos de la función**, y el sentido del cruce
      decide si es máximo o mínimo.

      Mirando las dos curvas:

      - Una tiene una **meseta** casi horizontal a la izquierda, cruza el eje
        por el centro y se hunde hasta un mínimo profundo cerca del extremo
        derecho.
      - La otra entra por debajo del eje, sube cruzándolo, hace una **joroba** y
        baja.

      Y la joroba de la segunda cae **exactamente** donde la primera corta al
      eje. Además la primera es positiva antes de ese punto —donde la segunda
      sube— y negativa después —donde baja—. Todo encaja en un solo sentido:

      $$
      F=\text{la de la joroba},
      \qquad
      F'=\text{la de la meseta}
      $$

      Al revés no funciona: los extremos de la curva de la meseta —el mínimo
      profundo de la derecha— tendrían que coincidir con ceros de la otra, y no
      coinciden.

      **Dos confirmaciones de propina.** El **hombro** de $F'$, donde su
      pendiente se anula, corresponde al tramo en que $F$ sube casi en línea
      recta; y el **mínimo** de $F'$ marca el punto donde $F$ baja lo más
      deprisa que va a bajar, que es una inflexión.

      **b) La función $h=F^{2}$.**

      $$
      h'(x)=2\,F(x)\,F'(x)
      $$

      El signo es el producto de los dos. Llamando $x_{0}$ y $x_{2}$ a los ceros
      de $F$ y $x_{1}$ al máximo:

      | tramo | $F$ | $F'$ | $h'$ | $h$ |
      |---|---|---|---|---|
      | $(a,x_{0})$ | $-$ | $+$ | $-$ | decrece |
      | $(x_{0},x_{1})$ | $+$ | $+$ | $+$ | crece |
      | $(x_{1},x_{2})$ | $+$ | $-$ | $-$ | decrece |
      | $(x_{2},b)$ | $-$ | $-$ | $+$ | crece |

      **Los extremos.** En $x_{0}$ y en $x_{2}$, mínimos de $h$ con valor
      **cero** —no puede haber nada menor, porque un cuadrado no es negativo—; y
      en $x_{1}$, un máximo relativo de valor $F(x_{1})^{2}$.

      **Lo que hay que llevarse.** Elevar al cuadrado convierte los **ceros** de
      $F$ en mínimos de $h$, y conserva los extremos de $F$ como extremos de
      $h$. En la parte donde $F$ es negativa, la monotonía se **invierte**: es
      el detalle que separa una respuesta razonada de una copiada.

  - id: ex1516-ord-4-una-integral-impropia-por-laplace
    titulo: Una integral impropia que la tabla de Laplace resuelve sola
    fuente: >-
      Ejercicio 1 del SEGUNDO CUATRIMESTRAL · Convocatoria de mayo, 24 de mayo de
      2016 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 4
      comp4: 6
    enunciado: |
      Aplicando la transformada de Laplace calcular el valor de la siguiente
      integral:

      $$
      \int_{0}^{\infty}t^{17}e^{-5t}\,dt
      $$
    pide: El valor de la integral, y por qué la transformada la da directamente.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué relación hay entre esa integral y la transformada de Laplace?
        opciones:
          - texto: >-
              Es exactamente $\mathcal{L}\left\{t^{17}\right\}$ evaluada en
              $s=5$
            correcta: true
            mensaje: |
              Eso es, y es toda la gracia del ejercicio. La definición es
              $\mathcal{L}\{f\}(s)=\int_{0}^{\infty}f(t)e^{-st}dt$: la integral
              del enunciado **es** esa definición con $f(t)=t^{17}$ y $s=5$. No
              hay que integrar nada, solo mirar la tabla.
          - texto: >-
              Hay que integrar por partes diecisiete veces
            mensaje: |
              Se puede, y sale, pero son diecisiete pasos y el enunciado pide
              expresamente usar Laplace. El método existe precisamente para no
              tener que hacerlos.
          - texto: >-
              Es la antitransformada de $t^{17}$
            mensaje: |
              La antitransformada va de $s$ a $t$, y aquí el resultado es un
              **número**, no una función. Lo que hay es una transformada
              evaluada en un punto.

      - tipo: calcular
        titulo: El denominador
        pregunta: |
          $\mathcal{L}\left\{t^{n}\right\}=\dfrac{n!}{s^{k}}$. ¿Cuánto vale $k$
          para $n=17$?
        respuesta:
          tipo: numero
          valor: '18'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '17'
            mensaje: |
              El exponente del denominador es $n+1$, no $n$. Compruébalo con el
              caso más fácil: $\mathcal{L}\{1\}=\mathcal{L}\{t^{0}\}=
              \frac{0!}{s}=\frac1s$, con exponente $1$ y no $0$.
          - valor: '5'
            mensaje: |
              El $5$ es el valor de $s$ en el que hay que evaluar, no el
              exponente. El exponente lo fija el grado de la potencia.
          - valor: '16'
            mensaje: |
              Va en la dirección contraria: el exponente **sube** uno respecto
              del grado, no baja.
        pista: |
          Compruébalo con $\mathcal{L}\{t\}=\frac{1}{s^{2}}$.
        desarrollo: |
          $$
          \mathcal{L}\left\{t^{n}\right\}=\frac{n!}{s^{n+1}}
          \;\Longrightarrow\;
          \mathcal{L}\left\{t^{17}\right\}=\frac{17!}{s^{18}}
          $$

      - tipo: calcular
        titulo: El valor de la integral
        pregunta: |
          ¿Cuánto vale $\displaystyle\int_{0}^{\infty}t^{17}e^{-5t}\,dt$?
        respuesta:
          tipo: numero
          valor: '93.2413'
          tolerancia: 0.01
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '466.2066'
            mensaje: |
              Cinco veces la respuesta: has usado $5^{17}$ en el denominador. El
              exponente es $n+1=18$.
          - valor: '18.6483'
            mensaje: |
              Un quinto de la respuesta: has usado $5^{19}$. Cuidado con el
              $n+1$: para $n=17$ es $18$, no $19$.
          - valor: '1583.9218'
            mensaje: |
              Parece $18!/5^{18}$. El factorial que aparece es el del **grado de
              la potencia**, $17!$, no el del exponente del denominador.
        pista: |
          $17!=355\,687\,428\,096\,000$ y $5^{18}=3\,814\,697\,265\,625$.
        desarrollo: |
          $$
          \int_{0}^{\infty}t^{17}e^{-5t}\,dt
          =\mathcal{L}\left\{t^{17}\right\}(5)
          =\frac{17!}{5^{18}}
          =\frac{355\,687\,428\,096\,000}{3\,814\,697\,265\,625}
          \approx93{,}2413
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Por definición,
              $\mathcal{L}\{f\}(s)=\int_{0}^{\infty}f(t)e^{-st}\,dt$, así que la
              integral del enunciado es $\mathcal{L}\left\{t^{17}\right\}$
              evaluada en $s=5$.
          - texto: >-
              De la tabla, $\mathcal{L}\left\{t^{n}\right\}=\frac{n!}{s^{n+1}}$
              para $s>0$, y aquí $n=17$.
          - texto: >-
              Sustituyendo, el valor es $\frac{17!}{5^{18}}\approx93{,}24$; la
              integral converge porque la exponencial domina a cualquier
              potencia.
          - texto: >-
              La fórmula vale para todo $s$, así que también se podría evaluar
              en $s=-5$ y obtener otra integral convergente.
            trampa: true
            mensaje: |
              La transformada solo existe para $s$ mayor que la abscisa de
              convergencia, que aquí es $s=0$. Con $s=-5$ el integrando sería
              $t^{17}e^{+5t}$, que **crece** sin límite: la integral diverge y
              la fórmula no significa nada. Decir en qué región vale una
              transformada es parte de usarla bien, y en un ejercicio con seis
              puntos de explicación formal es donde están los puntos.
    resolucion: |
      **El ejercicio en una línea.** La integral **es** la definición de la
      transformada de Laplace:

      $$
      \mathcal{L}\{f\}(s)=\int_{0}^{\infty}f(t)\,e^{-st}\,dt
      $$

      con $f(t)=t^{17}$ y $s=5$. No hay nada que integrar.

      **La fórmula de la tabla.**

      $$
      \mathcal{L}\left\{t^{n}\right\}=\frac{n!}{s^{n+1}},\qquad s>0
      $$

      **El resultado.**

      $$
      \int_{0}^{\infty}t^{17}e^{-5t}\,dt=\frac{17!}{5^{18}}\approx93{,}24
      $$

      **Por qué el enunciado da seis puntos a la explicación y solo cuatro al
      cálculo.** Porque lo que se evalúa no es dividir dos números grandes, sino
      **reconocer la definición** y saber decir dos cosas:

      - que la integral converge porque $e^{-5t}$ acaba dominando a cualquier
        potencia de $t$, por grande que sea el exponente;
      - y que la fórmula solo vale para $s>0$: con $s\le0$ el integrando crece y
        la transformada no existe.

      **Y por si alguien duda de que merezca la pena.** Hacerlo por partes son
      diecisiete integraciones encadenadas; cada una baja el exponente en uno y
      saca un factor. El resultado es el mismo $\frac{17!}{5^{18}}$, y de hecho
      esa cadena **es** la demostración de la fórmula de la tabla — que es por lo
      que la tabla existe.

  - id: ex1516-ord-5-el-cuenco-con-tapa-esferica
    titulo: Un cuenco parabólico con tapa esférica, y su superficie
    fuente: >-
      Ejercicio 2 del SEGUNDO CUATRIMESTRAL · Convocatoria de mayo, 24 de mayo de
      2016 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3
    enunciado: |
      Considerar el sólido delimitado por las condiciones
      $x^{2}+y^{2}\le z$; $x^{2}+y^{2}+z^{2}\le 6$. Dibujar el sólido y calcular
      el área de su superficie.
    pide: El dibujo y el área total.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿A qué altura se cortan el paraboloide y la esfera?
        opciones:
          - texto: >-
              En $z=2$, con radio $\sqrt2$: donde $z+z^{2}=6$
            correcta: true
            mensaje: |
              Eso es. En el paraboloide $r^{2}=z$, y sustituyendo en la esfera
              $r^{2}+z^{2}=6$ queda $z+z^{2}=6$, o sea $z^{2}+z-6=0$, con raíces
              $2$ y $-3$. Solo $z=2$ vale, y ahí $r=\sqrt2$.
          - texto: En $z=\sqrt6$
            mensaje: |
              $\sqrt6\approx2{,}45$ es la altura del **polo** de la esfera, donde
              ya no hay paraboloide: allí el radio es cero. El corte está más
              abajo.
          - texto: En $z=3$
            mensaje: |
              $z=3$ ni siquiera está dentro de la esfera, que llega hasta
              $\sqrt6\approx2{,}45$. La otra raíz de la ecuación es $-3$, y hay
              que descartarla por negativa.

      - tipo: calcular
        titulo: El casquete parabólico
        pregunta: |
          ¿Cuánto mide la parte de paraboloide que limita el sólido?
        respuesta:
          tipo: numero
          valor: '13.6136'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '6.2832'
            mensaje: |
              $2\pi$ es el área del **disco** de radio $\sqrt2$, la sombra del
              casquete. La superficie curva mide más: el factor
              $\sqrt{1+4r^{2}}$ es el que lo corrige.
          - valor: '11.8430'
            mensaje: |
              Parece que has quitado el $1$ de dentro de la raíz:
              $\sqrt{4r^{2}}=2r$ da $2\pi\int_{0}^{\sqrt2}2r^{2}dr=
              \frac{8\sqrt2\pi}{3}$. Ese $1$ pesa cerca del origen, donde el
              paraboloide es casi plano.
          - valor: '4.5379'
            mensaje: |
              Un tercio de la respuesta: te falta el $2\pi$ de la vuelta
              completa, o has dividido entre $3$ en vez de entre $12$.
        pista: |
          $dS=\sqrt{1+4r^{2}}\;r\,dr\,d\theta$ y $r$ llega hasta $\sqrt2$, con
          lo que $1+4r^{2}$ llega a $9$.
        desarrollo: |
          $$
          A_{1}=2\pi\left[\frac{\left(1+4r^{2}\right)^{3/2}}{12}\right]_{0}^{\sqrt2}
          =\frac{2\pi\left(27-1\right)}{12}=\frac{13\pi}{3}\approx13{,}614
          $$

          El $9^{3/2}=27$ es lo que hace que este ejercicio salga redondo: el
          corte está justo donde $1+4r^{2}$ vale un cuadrado perfecto.

      - tipo: calcular
        titulo: El área total
        pregunta: |
          ¿Cuánto mide la superficie completa del sólido?
        respuesta:
          tipo: numero
          valor: '20.5315'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '13.6136'
            mensaje: |
              Ese es solo el casquete parabólico. Falta la tapa esférica, que
              aporta $2\pi\sqrt6\left(\sqrt6-2\right)\approx6{,}92$.
          - valor: '6.9179'
            mensaje: |
              Ese es solo la tapa esférica. El cuenco de abajo es la parte
              grande.
          - valor: '26.8147'
            mensaje: |
              Parece que has añadido el disco de radio $\sqrt2$ donde se
              encuentran las dos superficies. Ese disco es **interior**: no
              separa el sólido del exterior.
        pista: |
          El casquete esférico de altura $h$ sobre una esfera de radio $R$ mide
          $2\pi R h$, y aquí $h=\sqrt6-2$.
        desarrollo: |
          La tapa va de $z=2$ hasta el polo $z=\sqrt6$, así que su altura es
          $h=\sqrt6-2$:

          $$
          A_{2}=2\pi\sqrt6\left(\sqrt6-2\right)=2\pi\left(6-2\sqrt6\right)
          \approx6{,}918
          $$

          $$
          A=\frac{13\pi}{3}+2\pi\left(6-2\sqrt6\right)\approx20{,}531
          $$

      - tipo: justificar
        pregunta: Ordena el planteamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La primera condición deja lo que está **por encima** del
              paraboloide $z=r^{2}$; la segunda, lo que está dentro de la esfera
              de radio $\sqrt6$.
          - texto: >-
              Se cortan en $z=2$, $r=\sqrt2$, de modo que la sombra del sólido
              sobre el plano $XY$ es el disco de radio $\sqrt2$.
          - texto: >-
              La frontera son dos casquetes curvos: el de paraboloide con
              $r\le\sqrt2$ y el de esfera desde esa altura hasta el polo. No hay
              ninguna cara plana.
          - texto: >-
              Hay que sumar el disco de radio $\sqrt2$ a la altura $z=2$, que es
              la tapa donde se juntan las dos superficies.
            trampa: true
            mensaje: |
              Ese disco está **dentro** del sólido, no en su frontera: por
              encima de él sigue habiendo cuerpo, hasta la esfera. La
              circunferencia donde se cortan las dos superficies es una arista,
              no el borde de una tapa. Sumarlo añade $2\pi\approx6{,}3$, un
              treinta por ciento de más.
    resolucion: |
      **Qué sólido es.** Dos condiciones:

      - $x^{2}+y^{2}\le z$: **por encima** del paraboloide $z=r^{2}$, o sea
        dentro del cuenco.
      - $x^{2}+y^{2}+z^{2}\le6$: dentro de la esfera de radio $\sqrt6$.

      El corte sale sustituyendo $r^{2}=z$ en la esfera:

      $$
      z+z^{2}=6\;\Longrightarrow\;z^{2}+z-6=0\;\Longrightarrow\;z=2
      $$

      —la otra raíz, $-3$, es negativa—. Y entonces $r=\sqrt2$.

