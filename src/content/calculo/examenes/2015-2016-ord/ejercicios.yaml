           aria-labelledby="sie16-t sie16-d">
        <title id="sie16-t">El diente de sierra de te</title>
        <desc id="sie16-d">Rampas ascendentes: en cada periodo la funcion sube en
        linea recta desde menos pi hasta pi y cae de golpe al empezar el siguiente.
        Los extremos de cada rampa van en hueco, porque el enunciado define la
        funcion en el intervalo abierto.</desc>
