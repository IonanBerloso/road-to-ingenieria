ejercicios:
  - id: ex1516-ord-1-una-circunferencia-y-un-eje
    titulo: Un cociente que es real, y otro que es imaginario puro
    fuente: >-
      Ejercicio 1 del PRIMER CUATRIMESTRAL · Convocatoria de mayo, 24 de mayo de
      2016 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 5
      comp4: 4
    enunciado: |
      Calcular y representar el lugar geométrico de los afijos de los complejos
      que verifican las condiciones siguientes:

      a) $\omega=\dfrac{2z-i}{2+iz}\in\mathbb{R}$;
      b) $\omega=\dfrac{2z-i}{2+iz}$ es imaginario puro.
    pide: Los dos lugares, dibujados y con los puntos que hay que excluir.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que anular en cada apartado?
        opciones:
          - texto: >-
              En a) la parte imaginaria; en b) la parte real
            correcta: true
            mensaje: |
              Eso es. «Real» significa parte imaginaria nula, y «imaginario
              puro» parte real nula. Es la misma cuenta —racionalizar y separar—
              y luego se anula una cosa o la otra, así que los dos apartados
              salen del mismo desarrollo.
          - texto: >-
              En a) la parte real; en b) la parte imaginaria
            mensaje: |
              Están cambiados. Un número **real** es el que no tiene parte
              imaginaria; uno **imaginario puro** es el que no tiene parte real.
          - texto: >-
              En los dos, el denominador
            mensaje: |
              El denominador nunca se anula en el lugar: si lo hiciera, el
              cociente no existiría. De hecho el punto donde se anula, $z=2i$,
              es justo el que hay que **excluir** de las dos respuestas.

      - tipo: calcular
        titulo: El radio de la circunferencia
        pregunta: |
          El apartado a) da una circunferencia. ¿Cuánto vale su radio?
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.25'
            mensaje: |
              $\frac54$ es la **ordenada del centro**, no el radio. Completando
              cuadrados, $x^{2}+\left(y-\frac54\right)^{2}=\frac{9}{16}$: el
              centro está en $\left(0,\frac54\right)$ y el radio es
              $\frac34$.
          - valor: '0.5625'
            mensaje: |
              $\frac{9}{16}$ es el radio **al cuadrado**. Falta sacar la raíz.
          - valor: '1.5'
            mensaje: |
              $\frac32$ es el diámetro. El enunciado no lo pide, pero conviene no
              confundirlos: la circunferencia pasa por $\frac{i}{2}$ y por $2i$,
              que están a distancia $\frac32$.
        pista: |
          Anula la parte imaginaria: sale $2x^{2}+2y^{2}-5y+2=0$. Divide entre
          $2$ y completa cuadrados.
        desarrollo: |
          Con $z=x+iy$ y racionalizando,

          $$
          \omega=\frac{3x+i\left(-2x^{2}-2y^{2}+5y-2\right)}{(2-y)^{2}+x^{2}}
          $$

          $$
          \operatorname{Im}\omega=0
          \;\Longrightarrow\;
          2x^{2}+2y^{2}-5y+2=0
          \;\Longrightarrow\;
          x^{2}+\left(y-\frac54\right)^{2}=\frac{9}{16}
          $$

          Centro $\left(0,\frac54\right)$ y radio $\frac34$.

      - tipo: calcular
        titulo: El punto que sobra en los dos apartados
        pregunta: |
          ¿Cuál es la parte imaginaria del punto donde se anula el denominador?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              Signo. De $2+iz=0$ sale $iz=-2$, y multiplicando por $-i$,
              $z=2i$. Cuidado con $\frac{-2}{i}$: hay que racionalizar, y
              $\frac1i=-i$.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es la parte imaginaria del punto donde se anula el
              **numerador**, $z=\frac i2$. Ese también hay que quitarlo, pero
              solo en el apartado b): ahí $\omega=0$, que no es imaginario puro.
          - valor: '-0.5'
            mensaje: |
              Signo, y además es el otro punto. $2z-i=0$ da $z=\frac i2$, con
              parte imaginaria positiva.
        pista: |
          $2+iz=0$, y para despejar recuerda que $\frac1i=-i$.
        desarrollo: |
          $$
          2+iz=0\;\Longrightarrow\;z=\frac{-2}{i}=-2\cdot(-i)=2i
          $$

          Y $2i$ pertenece a la circunferencia del apartado a) —$0+
          \left(2-\frac54\right)^{2}=\frac{9}{16}$— y al eje imaginario del b),
          así que hay que excluirlo en los dos.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $z=x+iy$ y multiplicando por el conjugado del denominador,
              $\omega=\frac{3x+i\left(-2x^{2}-2y^{2}+5y-2\right)}{(2-y)^{2}+x^{2}}$.
          - texto: >-
              a) Anulando la parte imaginaria sale
              $x^{2}+\left(y-\frac54\right)^{2}=\frac{9}{16}$: la circunferencia
              de centro $\left(0,\frac54\right)$ y radio $\frac34$, quitando
              $z=2i$.
          - texto: >-
              b) Anulando la parte real, $3x=0$, queda el eje imaginario;
              y hay que quitar $z=2i$ y también $z=\frac i2$, donde $\omega=0$.
          - texto: >-
              Como los dos apartados salen del mismo cociente, sus lugares
              geométricos no pueden cortarse.
            trampa: true
            mensaje: |
              Se cortan, y en dos puntos: la circunferencia del apartado a)
              tiene centro en el eje imaginario, así que lo corta en
              $\frac i2$ y en $2i$ — que son precisamente los dos puntos
              excluidos. Que un número sea a la vez real e imaginario puro solo
              le pasa al cero, y por eso el corte cae justo donde $\omega$ vale
              cero o no existe.
    resolucion: |
      **La cuenta, una sola vez para los dos apartados.** Con $z=x+iy$:

      $$
      2z-i=2x+i(2y-1),
      \qquad
      2+iz=(2-y)+ix
      $$

      Multiplicando por el conjugado del denominador y simplificando —los
      productos cruzados se cancelan casi todos—:

      $$
      \omega=\frac{3x+i\left(-2x^{2}-2y^{2}+5y-2\right)}{(2-y)^{2}+x^{2}}
      $$

      **a) $\omega$ real.** Se anula la parte imaginaria:

      $$
      2x^{2}+2y^{2}-5y+2=0
      \;\Longleftrightarrow\;
      x^{2}+\left(y-\tfrac54\right)^{2}=\tfrac{9}{16}
      $$

      Circunferencia de centro $\left(0,\frac54\right)$ y radio $\frac34$, que
      pasa por $\frac i2$ y por $2i$. Y hay que **quitar $2i$**, porque ahí el
      denominador se anula.

      **b) $\omega$ imaginario puro.** Se anula la parte real:

      $$
      3x=0\;\Longleftrightarrow\;x=0
      $$

      El eje imaginario entero. Y aquí sobran **dos** puntos: $2i$, otra vez, y
      $\frac i2$, donde el numerador se anula y $\omega=0$ — y el cero no
      cuenta como imaginario puro.

      <figure class="figura-examen">
