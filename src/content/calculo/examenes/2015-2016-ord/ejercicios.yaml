      <figcaption>
      Figura redibujada del enunciado original. La curva pasa por nudos enteros
      de la cuadrícula, así que aquí se dibuja con la función que los une:
      x(t) = 2 − cos(πt/2), entre 1 y 3 metros.
      </figcaption>
      </figure>

      a) Estimar $\dfrac18\displaystyle\int_{0}^{8}x(t)\,dt$. ¿Cuál es su
      significado?

      b) Calcular $\displaystyle\int_{0}^{1}v(t)\,dt$. ¿Cuál es su significado?

      c) Calcular $\dfrac14\displaystyle\int_{2}^{6}a(t)\,dt$. ¿Cuál es su
      significado?

      d) ¿Cuál es el signo de $\displaystyle\int_{2}^{4}a'(t)\,dt$?
    pide: Los cuatro valores y, sobre todo, qué significa cada uno.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué significa $\dfrac{1}{b-a}\displaystyle\int_{a}^{b}g(t)\,dt$?
        opciones:
          - texto: El **valor medio** de $g$ en el intervalo
            correcta: true
            mensaje: |
              Eso es, y es la clave de tres de los cuatro apartados: el
              $\frac18$ del a) y el $\frac14$ del c) están puestos precisamente
              para que la respuesta sea una media, no un área.
          - texto: El área bajo la gráfica de $g$
            mensaje: |
              El área es la integral **sin** dividir. El factor $\frac{1}{b-a}$
              la convierte en una media, y sin él las unidades ni siquiera
              cuadrarían: en el apartado a) saldrían metros por segundo.
          - texto: La variación de $g$ entre $a$ y $b$
            mensaje: |
              La variación de $g$ es $g(b)-g(a)$, que es lo que da la integral
              de su **derivada**, no la de $g$. Eso es lo que pasa en los
              apartados b) y d).

      - tipo: calcular
        titulo: La media de la posición
        pregunta: |
          ¿Cuánto vale $\dfrac18\displaystyle\int_{0}^{8}x(t)\,dt$, en metros?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número en metros
        distractores:
          - valor: '16'
            mensaje: |
              $16$ sería la integral sin dividir entre $8$, es decir el área
              bajo la curva. Y sus unidades serían metros·segundo, que no miden
              una posición.
          - valor: '3'
            mensaje: |
              $3$ es el valor **máximo** de la posición, no la media. La curva
              pasa el mismo tiempo por encima y por debajo de $2$.
          - valor: '1'
            mensaje: |
              $1$ es el valor **mínimo**. La media entre un mínimo de $1$ y un
              máximo de $3$, con una curva simétrica, es el punto medio.
        pista: |
          La curva oscila simétricamente entre $1$ y $3$, y hace dos
          oscilaciones completas en los ocho segundos.
        desarrollo: |
          En $[0,8]$ caben exactamente dos periodos, y la curva es simétrica
          respecto de la recta $x=2$: lo que sube por encima compensa lo que
          baja por debajo.

          $$
          \frac18\int_{0}^{8}x(t)\,dt=2\ \text{m}
          $$

          Es la **posición media** de la partícula durante los ocho segundos.

      - tipo: calcular
        titulo: El desplazamiento del primer segundo
        pregunta: |
          ¿Cuánto vale $\displaystyle\int_{0}^{1}v(t)\,dt$, en metros?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número en metros
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es $x(1)$, la posición al cabo de un segundo. La integral de
              la velocidad es el **cambio** de posición: $x(1)-x(0)=2-1$.
          - valor: '0'
            mensaje: |
              Cero sería el desplazamiento si la partícula volviera al punto de
              partida, y eso pasa en $[0,4]$, no en $[0,1]$. En el primer
              segundo sube de $1$ a $2$.
          - valor: '1.5708'
            mensaje: |
              $\frac\pi2$ es el valor de la **velocidad** en $t=1$, no el
              desplazamiento. La velocidad máxima y el área bajo ella son cosas
              distintas.
        pista: |
          Barrow: $\int_{0}^{1}x'(t)\,dt=x(1)-x(0)$, y los dos valores se leen
          en la gráfica.
        desarrollo: |
          $$
          \int_{0}^{1}v(t)\,dt=x(1)-x(0)=2-1=1\ \text{m}
          $$

          Es el **desplazamiento** en el primer segundo. Y aquí coincide con la
          distancia recorrida porque la partícula no cambia de sentido en ese
          tramo.

      - tipo: calcular
        titulo: La aceleración media
        pregunta: |
          ¿Cuánto vale $\dfrac14\displaystyle\int_{2}^{6}a(t)\,dt$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es la posición media, la respuesta del apartado a). Aquí se
              integra la **aceleración**, no la posición.
          - valor: '4'
            mensaje: |
              $4$ es la longitud del intervalo $[2,6]$. La media divide entre
              ella, no la devuelve.
          - valor: '2.4674'
            mensaje: |
              $\frac{\pi^{2}}{4}$ es el valor máximo de la aceleración. La media
              de una función que sube y baja simétricamente es cero aunque su
              máximo no lo sea.
        pista: |
          Barrow otra vez: $\int_{2}^{6}a=v(6)-v(2)$, y en $t=2$ y $t=6$ la
          partícula está en un máximo de posición.
        desarrollo: |
          $$
          \frac14\int_{2}^{6}a(t)\,dt=\frac{v(6)-v(2)}{4}
          $$

          En $t=2$ y en $t=6$ la posición alcanza su máximo, así que la
          velocidad vale cero en los dos:

          $$
          \frac{0-0}{4}=0
          $$

          Es la **aceleración media** entre los segundos $2$ y $6$, y vale
          cero: la partícula termina ese tramo con la misma velocidad con la que
          lo empezó.

      - tipo: justificar
        pregunta: Ordena el apartado d). Una pieza es falsa.
        piezas:
          - texto: >-
              Por Barrow, $\int_{2}^{4}a'(t)\,dt=a(4)-a(2)$: el signo lo decide
              cuánto vale la aceleración en los extremos, no lo que haga en
              medio.
          - texto: >-
              En $t=2$ la posición tiene un máximo, así que la curva es cóncava
              y $a(2)<0$; en $t=4$ tiene un mínimo, la curva es convexa y
              $a(4)>0$.
          - texto: >-
              Luego $a(4)-a(2)$ es positivo menos negativo: **positivo**.
          - texto: >-
              Como la aceleración es negativa en buena parte de $[2,4]$, la
              integral de $a'$ también será negativa.
            trampa: true
            mensaje: |
              La integral es de $a'$, no de $a$: lo que importa no es el signo
              de la aceleración sino si **crece o decrece**. Y en $[2,4]$ pasa
              de negativa en $t=2$ a positiva en $t=4$, es decir, crece. Una
              función puede ser negativa casi todo el intervalo y aun así su
              derivada tener integral positiva.
    resolucion: |
      **De qué va este ejercicio.** Es el único del corpus con **cuatro puntos
      de COMP 1** —reconocer— y solo dos de cálculo. No se trata de integrar: se
      trata de saber qué significa cada integral antes de escribir un número.

      La curva pasa por nudos enteros y es $x(t)=2-\cos\frac{\pi t}{2}$: dos
      oscilaciones completas entre $1$ y $3$ metros.

      **a) La posición media.** El factor $\frac18$ delante de la integral sobre
      un intervalo de longitud $8$ es la definición de valor medio. Y como la
      curva es simétrica respecto de $x=2$ y recorre dos periodos enteros,

      $$
      \frac18\int_{0}^{8}x\,dt=2\ \text{m}
      $$

      **b) El desplazamiento.** Barrow:

      $$
      \int_{0}^{1}v\,dt=x(1)-x(0)=2-1=1\ \text{m}
      $$

      Es el **desplazamiento**, no la distancia recorrida — aunque aquí
      coincidan, porque la partícula no da la vuelta en ese tramo.

      **c) La aceleración media.**

      $$
      \frac14\int_{2}^{6}a\,dt=\frac{v(6)-v(2)}{4}=\frac{0-0}{4}=0
      $$

      En $t=2$ y $t=6$ la posición está en un máximo, así que la velocidad es
      nula en los dos. La aceleración media es cero: el tramo empieza y acaba
      con la misma velocidad.

      **d) El signo.**

      $$
      \int_{2}^{4}a'\,dt=a(4)-a(2)
      $$

      En $t=2$ hay un máximo de posición —curva cóncava, $a<0$— y en $t=4$ un
      mínimo —convexa, $a>0$—. Así que la diferencia es **positiva**. Con la
      función explícita, $a(4)-a(2)=\frac{\pi^{2}}{4}+\frac{\pi^{2}}{4}=
      \frac{\pi^{2}}{2}\approx4{,}93$.

      **El hilo que une los cuatro apartados.** Tres de ellos son la misma idea
      con distinto disfraz: **la integral de una derivada es la variación de la
      función**. En b) la derivada es $v=x'$; en c) es $a=v'$; en d) es $a'$. El
      único que no lo es —el a)— lleva delante el $\frac18$ que lo convierte en
      una media. Reconocer eso vale los cuatro puntos de COMP 1.

