          <text x="74.5" y="165" text-anchor="middle">−2π</text>
          <text x="124.7" y="165" text-anchor="middle">−π</text>
          <text x="225.3" y="165" text-anchor="middle">π</text>
          <text x="275.5" y="165" text-anchor="middle">2π</text>
          <text x="325.8" y="165" text-anchor="middle">3π</text>
          <text x="167" y="63.3" text-anchor="end">π</text>
          <text x="167" y="245.7" text-anchor="end">−π</text>
          <text x="365" y="164">t</text>
        </g>
        <text class="sie16-et" x="190.1" y="53.8">f(t) = t</text>
      </svg>
      <figcaption>
      El diente de sierra. Los extremos de cada rampa se marcan en hueco: el
      enunciado define f en el intervalo abierto, así que en los múltiplos
      impares de π la función no toma ningún valor.
      </figcaption>
      </figure>

      **b) La serie.** $f(t)=t$ es **impar**, así que $a_{n}=0$ para todo $n$
      —incluido el término constante— y solo quedan senos:

      $$
      b_{n}=\frac{2}{\pi}\int_{0}^{\pi}t\operatorname{sen}(nt)\,dt
      =\frac{2(-1)^{n+1}}{n}
      $$

      $$
      S(t)=2\left(\operatorname{sen}t-\frac{\operatorname{sen}2t}{2}
      +\frac{\operatorname{sen}3t}{3}-\cdots\right)
      $$

      **c) Los tres valores, y lo que enseña cada uno.**

      | punto | se reduce a | qué pasa allí | $S$ |
      |---|---|---|---|
      | $0$ | $0$ | continuo | $0$ |
      | $\frac{121\pi}{2}$ | $\frac\pi2$ | continuo | $\frac\pi2$ |
      | $2001\pi$ | $\pi$ | salto de $\pi$ a $-\pi$ | $0$ |

      Los números grandes están puestos a propósito: lo primero es **reducir
      módulo $2\pi$**. $\frac{121\pi}{2}=60\pi+\frac\pi2$, y $60\pi$ son treinta
      vueltas; $2001\pi$ es $1000$ vueltas más $\pi$.

      **d) La suma.** El punto bueno es $t=\frac\pi2$, donde la serie coincide
      con la función y los senos impares valen $\pm1$ alternando:

      $$
      \frac\pi2=2\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{2n-1}
      \;\Longrightarrow\;
      \boxed{\;\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{2n-1}=\frac{\pi}{4}\;}
      $$

      Es la serie de Leibniz, y aparece siempre por el mismo camino: un diente
      de sierra evaluado donde los senos impares alternan.

      **Un detalle de honestidad.** El enunciado pide $S$ en los tres puntos,
      pero no $f$. Menos mal: en $2001\pi$ la función **no está definida**,
      porque el intervalo es abierto. La serie sí vale ahí, y vale cero.
