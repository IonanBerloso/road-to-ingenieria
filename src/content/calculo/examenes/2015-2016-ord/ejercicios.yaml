          .sie16-eje { stroke: var(--graphite); stroke-width: 1.2; fill: none; }
          .sie16-as { stroke: var(--faint); stroke-width: 1.1; fill: none; stroke-dasharray: 5 4; }
          .sie16-c { stroke: var(--live); stroke-width: 2.6; fill: none; }
