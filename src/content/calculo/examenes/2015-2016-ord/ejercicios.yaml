          <text x="365" y="294">x</text>
          <text x="182" y="89.8">z</text>
          <text x="168" y="160" text-anchor="end">2</text>
          <text x="262.7" y="295" text-anchor="middle">√2</text>
          <text x="183" y="123.1">√6</text>
        </g>
        <text class="sol16-et" x="271.1" y="221.1">z = r²</text>
        <text class="sol16-et" x="75.8" y="134.3" text-anchor="end">r² + z² = 6</text>
      </svg>
      <figcaption>
      La sección meridiana. El cuenco parabólico sube desde el origen hasta la
      altura 2 con radio √2, y desde ahí la tapa esférica lo cierra en el polo,
      a la altura √6.
      </figcaption>
      </figure>

      **La superficie, que son dos casquetes y ninguna tapa plana.**

      **El paraboloide.** Para $z=r^{2}$,
      $dS=\sqrt{1+4r^{2}}\;r\,dr\,d\theta$:

      $$
      A_{1}=2\pi\int_{0}^{\sqrt2}\sqrt{1+4r^{2}}\;r\,dr
      =2\pi\left[\frac{\left(1+4r^{2}\right)^{3/2}}{12}\right]_{0}^{\sqrt2}
      =\frac{13\pi}{3}
      $$

      Sale redondo porque en $r=\sqrt2$ el radicando vale $9$, y $9^{3/2}=27$.

      **La esfera.** El casquete va de $z=2$ al polo $z=\sqrt6$, con altura
      $h=\sqrt6-2$. Usando que el área de un casquete esférico es $2\pi Rh$
      —el teorema de Arquímedes, que no depende de dónde esté la franja—:

      $$
      A_{2}=2\pi\sqrt6\left(\sqrt6-2\right)=2\pi\left(6-2\sqrt6\right)
      $$

      $$
      \boxed{\;A=\frac{13\pi}{3}+2\pi\left(6-2\sqrt6\right)\approx20{,}53\;}
      $$

      **Comprobación de sentido.** Una esfera entera de radio $\sqrt6$ tiene
      área $4\pi\cdot6\approx75{,}4$, y el casquete de arriba se lleva solo
      $6{,}9$: es una tapa pequeña, coherente con que el corte esté a $z=2$ de
      un radio $2{,}45$. Y el cuenco parabólico, más ancho y más curvado, pesa
      el doble que ella. Todo cuadra.

  - id: ex1516-ord-6-polinomio-mas-resonancia
    titulo: Un polinomio, un seno que resuena y dos condiciones iniciales
    fuente: >-
      Ejercicio 3 del SEGUNDO CUATRIMESTRAL · Convocatoria de mayo, 24 de mayo de
      2016 · Cálculo, UPV/EHU · En el cuadernillo original está numerado «2» por
      segunda vez: hay una errata en la numeración · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Resolver la siguiente EDO:

      $$
      \left\{
      \begin{aligned}
      y''(x)+9y(x)&=x^{2}-x+13\operatorname{sen}(3x)\\
      y(0)&=1\\
      y'(0)&=0
      \end{aligned}
      \right.
      $$
    pide: La solución del problema de valores iniciales.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántas soluciones particulares hay que buscar, y por qué?
        opciones:
          - texto: >-
              Dos, una por cada trozo del segundo miembro, y se suman
            correcta: true
            mensaje: |
              Eso es el principio de superposición, y funciona porque la
              ecuación es lineal. Además cada trozo pide un ensayo distinto: el
              polinomio uno cualquiera de grado dos, y el seno uno multiplicado
              por $x$, porque resuena.
          - texto: >-
              Una sola, con un ensayo que mezcle polinomio y seno multiplicados
            mensaje: |
              Multiplicarlos sería el ensayo para un segundo miembro del tipo
              $x^{2}\operatorname{sen}3x$. Aquí los dos trozos van **sumados**,
              y a una suma le corresponde una suma de ensayos.
          - texto: >-
              Ninguna: con las condiciones iniciales basta
            mensaje: |
              Las condiciones iniciales solo fijan las dos constantes de la
              homogénea. Sin una solución particular no hay nada donde
              aplicarlas: la solución general es la homogénea **más** la
              particular.

      - tipo: calcular
        titulo: El término independiente del polinomio
        pregunta: |
          Con el ensayo $ax^{2}+bx+c$, ¿cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '-0.0246914'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0'
            mensaje: |
              Cero saldría si $y''$ no aportara nada. Pero $y''=2a$, y esa
              constante entra en la ecuación del término independiente:
              $2a+9c=0$.
          - valor: '0.0246914'
            mensaje: |
              Signo. De $2a+9c=0$ con $a=\frac19$ sale $9c=-\frac29$, es decir
              $c=-\frac{2}{81}$.
          - valor: '-0.2222222'
            mensaje: |
              $-\frac29$ es $2a$ con signo cambiado, sin dividir entre $9$. La
              ecuación es $9c=-2a$.
        pista: |
          Sustituye $y=ax^{2}+bx+c$: primero sale $a$ del término en $x^{2}$,
          luego $b$, y $c$ el último.
        desarrollo: |
          $$
          2a+9\left(ax^{2}+bx+c\right)=x^{2}-x
          $$

          $$
          9a=1\;\Rightarrow\;a=\tfrac19;
          \qquad
          9b=-1\;\Rightarrow\;b=-\tfrac19;
          \qquad
          2a+9c=0\;\Rightarrow\;c=-\tfrac{2}{81}
          $$

      - tipo: calcular
        titulo: El coeficiente del término resonante
        pregunta: |
          Con el ensayo $x\left(A\cos 3x+B\operatorname{sen}3x\right)$ para el
          $13\operatorname{sen}3x$, ¿cuánto vale $A$?
        respuesta:
          tipo: numero
          valor: '-2.1666667'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '2.1666667'
            mensaje: |
              Signo. Al sustituir sale $-6A\operatorname{sen}3x+6B\cos3x$, y
              hay que igualarlo a $13\operatorname{sen}3x$: $-6A=13$ da
              $A=-\frac{13}{6}$.
          - valor: '0'
            mensaje: |
              Cero es $B$, el que acompaña al seno en el ensayo. Lo que
              sobrevive es el término en **coseno**, y desconcierta: el segundo
              miembro es un seno.
          - valor: '1.4444444'
            mensaje: |
              $\frac{13}{9}$ saldría de dividir entre $9$, el coeficiente de $y$
              en la ecuación. El divisor correcto es $-6$, que sale de derivar
              dos veces el ensayo con la $x$ delante.
        pista: |
          Al sustituir $x(A\cos3x+B\operatorname{sen}3x)$, los términos con $x$
          se cancelan y queda $-6A\operatorname{sen}3x+6B\cos3x$.
        desarrollo: |
          $$
          -6A=13\;\Longrightarrow\;A=-\frac{13}{6},
          \qquad
          6B=0\;\Longrightarrow\;B=0
          $$

          $$
          y_{p_{2}}=-\frac{13}{6}\,x\cos 3x
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La característica $r^{2}+9=0$ da $r=\pm3i$, así que la homogénea
              es $C_{1}\cos 3x+C_{2}\operatorname{sen}3x$.
          - texto: >-
              Por superposición, la particular es la suma de las dos:
              $\frac{x^{2}}{9}-\frac{x}{9}-\frac{2}{81}$ para el polinomio, y
              $-\frac{13}{6}x\cos 3x$ para el seno, que resuena.
          - texto: >-
              Solo entonces se imponen las condiciones iniciales sobre la
              solución **completa**: $y(0)=1$ da $C_{1}=\frac{83}{81}$ e
              $y'(0)=0$ da $C_{2}=\frac{41}{54}$.
          - texto: >-
              Las condiciones iniciales se imponen sobre la homogénea, porque es
              la que lleva las constantes.
            trampa: true
            mensaje: |
              Se imponen sobre la solución **completa**. La particular también
              vale algo en $x=0$ —aquí $-\frac{2}{81}$— y también tiene
              derivada. Si se olvida, $C_{1}$ sale $1$ en vez de $\frac{83}{81}$
              y $C_{2}$ sale $0$ en vez de $\frac{41}{54}$: la solución deja de
              cumplir el problema, aunque siga resolviendo la ecuación.
    resolucion: |
      **La homogénea.** $r^{2}+9=0$ da $r=\pm3i$:

      $$
      y_{h}=C_{1}\cos 3x+C_{2}\operatorname{sen}3x
      $$

      **Dos particulares, una por trozo.**

      *El polinomio $x^{2}-x$.* Como $0$ no es raíz, el ensayo es un polinomio
      del mismo grado:

      $$
      y_{p_{1}}=\frac{x^{2}}{9}-\frac{x}{9}-\frac{2}{81}
      $$

      El $-\frac{2}{81}$ sale del término independiente, donde entra el $2a$ de
      la segunda derivada — es el coeficiente que más se olvida.

      *El seno $13\operatorname{sen}3x$.* Aquí **resuena**: $\operatorname{sen}
      3x$ ya es solución de la homogénea, así que el ensayo lleva una $x$:

      $$
      y_{p_{2}}=-\frac{13}{6}\,x\cos 3x
      $$

      **La solución general.**

      $$
      y=C_{1}\cos 3x+C_{2}\operatorname{sen}3x
      +\frac{x^{2}}{9}-\frac{x}{9}-\frac{2}{81}
      -\frac{13}{6}x\cos 3x
      $$

      **Las condiciones iniciales, sobre la solución completa.**

      $$
      y(0)=C_{1}-\frac{2}{81}=1
      \;\Longrightarrow\;
      C_{1}=\frac{83}{81}
      $$

      $$
      y'(0)=3C_{2}-\frac19-\frac{13}{6}=0
      \;\Longrightarrow\;
      C_{2}=\frac{41}{54}
      $$

      $$
      \boxed{\;
      y=\frac{83}{81}\cos 3x+\frac{41}{54}\operatorname{sen}3x
      +\frac{x^{2}}{9}-\frac{x}{9}-\frac{2}{81}
      -\frac{13}{6}x\cos 3x
      \;}
      $$

      **El error que cuesta el ejercicio entero.** Imponer las condiciones
      iniciales sobre la homogénea sola. La particular vale $-\frac{2}{81}$ en
      el origen y su derivada vale $-\frac19-\frac{13}{6}$: si no se cuentan,
      las constantes salen mal y la solución, aun resolviendo la ecuación, no
      pasa por donde tiene que pasar.

      **Y una comprobación barata.** Sustituir $x=0$ en la solución final tiene
      que dar $1$, y derivarla y sustituir tiene que dar $0$. Son dos
      evaluaciones y detectan cualquier despiste en las constantes.

  - id: ex1516-ord-7-el-diente-de-sierra-de-te
    titulo: El diente de sierra clásico, y Leibniz al final
    fuente: >-
      Ejercicio 4 del SEGUNDO CUATRIMESTRAL · Convocatoria de mayo, 24 de mayo de
      2016 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 6
      comp4: 4
    enunciado: |
      Sea la $f(t)$ función periódica de periodo $2\pi$ definida del modo
      siguiente:

      $$
      f(t)=t\qquad -\pi<t<\pi
      $$

      a) Dibujar $f(t)$.

      b) Obtener su serie de Fourier $S(t)$.

      c) Calcular $S(0)$, $S\left(\dfrac{121\pi}{2}\right)$, $S(2001\pi)$.

      d) Obtener la suma de la serie
      $\displaystyle\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{2n-1}$.
    pide: El dibujo, la serie, los tres valores y la suma.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué simplifica el hecho de que $f(t)=t$ sea impar?
        opciones:
          - texto: >-
              Que todos los $a_{n}$ se anulan, incluido el término constante
            correcta: true
            mensaje: |
              Eso es. Una función impar integrada contra un coseno —que es par—
              da cero en un intervalo simétrico. Se ahorra la mitad de las
              integrales, y además el término constante también es cero: la
              media de una función impar es nula.
          - texto: Que la serie converge más deprisa
            mensaje: |
              La velocidad de convergencia la fija la suavidad, no la paridad.
              Aquí los coeficientes van como $\frac1n$, que es lo lento que
              corresponde a una función con saltos.
          - texto: Que $S(t)=f(t)$ en todos los puntos
            mensaje: |
              Eso lo decide la continuidad, no la paridad, y aquí falla: en los
              múltiplos impares de $\pi$ hay saltos, y ahí la serie converge a
              cero mientras la función ni siquiera está definida.

      - tipo: calcular
        titulo: El primer armónico
        pregunta: |
          ¿Cuánto vale $b_{1}$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              Signo. $b_{n}=\frac{2(-1)^{n+1}}{n}$, y para $n=1$ el exponente
              es par: $b_{1}=+2$. El negativo es $b_{2}=-1$.
          - valor: '1'
            mensaje: |
              Falta el $2$. Al ser impar, la integral sobre $(0,\pi)$ se
              duplica: $b_{n}=\frac{2}{\pi}\int_{0}^{\pi}t\operatorname{sen}
              (nt)\,dt$.
          - valor: '0.6366198'
            mensaje: |
              $\frac2\pi$ tiene un $\pi$ de más abajo. Al integrar por partes
              aparece un $\pi$ en el numerador que se cancela con el
              $\frac1\pi$ de la fórmula.
        pista: |
          $\int_{0}^{\pi}t\operatorname{sen}(nt)\,dt=\frac{\pi(-1)^{n+1}}{n}$.
        desarrollo: |
          $$
          b_{n}=\frac{2}{\pi}\int_{0}^{\pi}t\operatorname{sen}(nt)\,dt
          =\frac{2}{\pi}\cdot\frac{\pi(-1)^{n+1}}{n}=\frac{2(-1)^{n+1}}{n}
          $$

          $$
          S(t)=2\operatorname{sen}t-\operatorname{sen}2t
          +\frac23\operatorname{sen}3t-\cdots
          $$

      - tipo: calcular
        titulo: El valor en el punto raro
        pregunta: |
          ¿Cuánto vale $S\left(\dfrac{121\pi}{2}\right)$?
        respuesta:
          tipo: numero
          valor: '1.5707963'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0'
            mensaje: |
              Cero es lo que vale $S$ en los saltos, que están en los múltiplos
              **impares** de $\pi$. Reduce el ángulo: $\frac{121\pi}{2}=
              60\pi+\frac\pi2$, y $60\pi$ son treinta vueltas enteras.
          - valor: '190.0664'
            mensaje: |
              $\frac{121\pi}{2}$ sin reducir. La función es periódica: hay que
              restar vueltas de $2\pi$ hasta caer en $(-\pi,\pi)$.
          - valor: '-1.5707963'
            mensaje: |
              Signo. $\frac{121\pi}{2}$ se reduce a $+\frac\pi2$, no a
              $-\frac\pi2$: $121$ es impar y $\frac{120\pi}{2}=60\pi$ es un
              número **par** de vueltas.
        pista: |
          $\frac{121\pi}{2}=60\pi+\frac{\pi}{2}$, y $60\pi=30\cdot2\pi$.
        desarrollo: |
          $$
          \frac{121\pi}{2}=60\pi+\frac{\pi}{2}\equiv\frac{\pi}{2}\pmod{2\pi}
          $$

          Ahí la función es continua, así que

          $$
          S\left(\frac{121\pi}{2}\right)=f\left(\frac\pi2\right)=\frac\pi2
          \approx1{,}5708
          $$

      - tipo: calcular
        titulo: La suma pedida
        pregunta: |
          ¿Cuánto vale
          $\displaystyle\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{2n-1}$?
        respuesta:
          tipo: numero
          valor: '0.7853982'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.5707963'
            mensaje: |
              $\frac\pi2$ es el valor de $S(\pi/2)$, no de la serie. Ahí
              $S=2\Sigma$, así que hay que dividir entre $2$.
          - valor: '0.6931472'
            mensaje: |
              $\ln 2$ es la suma de $1-\frac12+\frac13-\cdots$. Esta lleva solo
              denominadores impares, y su suma es $\frac\pi4$.
          - valor: '-0.7853982'
            mensaje: |
              Signo. Con $n=1$ el exponente es $0$ y el primer término es $+1$,
              así que la suma es positiva.
        pista: |
          Evalúa la serie en $t=\frac\pi2$: los senos pares se anulan y los
          impares valen $\pm1$.
        desarrollo: |
          En $t=\frac\pi2$, $\operatorname{sen}\left((2k+1)\frac\pi2\right)=
          (-1)^{k}$ y los términos pares desaparecen:

          $$
          S\left(\frac\pi2\right)
          =2\sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{2n-1}
          =\frac\pi2
          \;\Longrightarrow\;
          \sum_{n=1}^{\infty}\frac{(-1)^{n-1}}{2n-1}=\frac{\pi}{4}
          $$

      - tipo: justificar
        pregunta: Ordena el apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              En $t=0$ la función es continua y vale cero, así que $S(0)=0$; y
              además todos los senos se anulan ahí, lo que lo confirma sin
              teoría.
          - texto: >-
              $\frac{121\pi}{2}=60\pi+\frac\pi2$ y $60\pi$ son treinta vueltas
              enteras, así que equivale a $\frac\pi2$, punto de continuidad:
              $S=\frac\pi2$.
          - texto: >-
              $2001$ es impar, luego $2001\pi\equiv\pi\pmod{2\pi}$, y ahí hay un
              salto de $\pi$ a $-\pi$: la serie converge a la semisuma, $0$.
          - texto: >-
              Como $2001\pi$ es un número enorme, la serie ya no converge en ese
              punto.
            trampa: true
            mensaje: |
              El tamaño del número no cambia nada: la serie es periódica, así
              que su valor en $2001\pi$ es exactamente el mismo que en $\pi$.
              Lo único que hay que hacer con esos números grandes es
              **reducirlos módulo $2\pi$**, y el examen los pone grandes
              precisamente para comprobar que uno lo hace en vez de asustarse.
    resolucion: |
      **a) El dibujo.** En cada periodo la función sube en línea recta de
      $-\pi$ a $\pi$ y cae de golpe al empezar el siguiente. Los extremos van en
      hueco, porque el enunciado da el intervalo **abierto**.

