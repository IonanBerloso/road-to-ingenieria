      la expresión antes de dar el lugar por bueno.

  - id: ex1516-ord-2-la-particula-y-sus-integrales
    titulo: Cuatro integrales que hay que interpretar antes de calcular
    fuente: >-
      Ejercicio 2 del PRIMER CUATRIMESTRAL · Convocatoria de mayo, 24 de mayo de
      2016 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
