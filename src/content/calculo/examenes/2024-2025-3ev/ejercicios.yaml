ejercicios:
  - id: ex2425-3ev-1-dos-triangulos
    titulo: Una ecuación de grado siete que esconde dos triángulos
    fuente: >-
      Ejercicio 1 · Tercera evaluación, 21 de enero de 2025 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3

    nivel: examen
    enunciado: |
      Resolver la ecuación $z^{7}-9z^{4}+8z = 0$, $z \in \mathbb{C}$, y
      representar gráficamente las soluciones.
    pide: Resolver y representar.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es el primer movimiento?
        opciones:
          - texto: >-
              **Sacar factor común $z$** y hacer el cambio $w = z^{3}$ en lo que
              queda
            correcta: true
            mensaje: |
              Exacto, y en ese orden. Sacando $z$ queda
              $z\left(z^{6}-9z^{3}+8\right) = 0$, y los exponentes 6 y 3 son
              múltiplos de 3: con $w=z^{3}$ el paréntesis se vuelve una ecuación
              de segundo grado.
          - texto: >-
              Aplicar la fórmula de las raíces séptimas
            mensaje: |
              No es una ecuación del tipo $z^{7}=k$: tiene tres términos. La
              fórmula de las raíces $n$-ésimas se usará **después**, sobre cada
              una de las dos ecuaciones que salgan.
          - texto: >-
              Pasar a forma polar desde el principio
            mensaje: |
              En polar, una suma de potencias no se simplifica. La polar entra
              cuando ya hay una ecuación de la forma $z^{3}=k$.
          - texto: >-
              Dividir entre $z$ directamente
            mensaje: |
              Dividir entre $z$ **pierde la solución $z=0$**. Hay que factorizar,
              no dividir: es el error clásico de este ejercicio.

      - tipo: calcular
        titulo: Cuántas soluciones hay
        pregunta: |
          ¿Cuántas soluciones distintas tiene la ecuación?
        respuesta:
          tipo: numero
          valor: '7'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '6'
            mensaje: |
              6 olvida el $z=0$ que sale del factor común. Es la solución que se
              pierde si en vez de factorizar se divide entre $z$.
          - valor: '2'
            mensaje: |
              2 son las soluciones en $w$: $w=1$ y $w=8$. Cada una da **tres**
              valores de $z$, porque $w=z^{3}$.
          - valor: '3'
            mensaje: |
              3 sería si solo hubiera una ecuación cúbica. Hay dos, más el cero.
        pista: |
          El polinomio es de grado 7. ¿Tiene alguna raíz múltiple?
        desarrollo: |
          $$
          z^{7}-9z^{4}+8z = z\left(z^{6}-9z^{3}+8\right) = 0
          $$

          Con $w = z^{3}$:

          $$
          w^{2}-9w+8 = 0
          \;\Longrightarrow\;
          w = \frac{9\pm\sqrt{81-32}}{2} = \frac{9\pm7}{2}
          \;\Longrightarrow\;
          w = 1 \ \text{ó}\ w = 8
          $$

          Contando:

          | ecuación | soluciones |
          |---|---|
          | $z = 0$ | 1 |
          | $z^{3} = 1$ | 3 |
          | $z^{3} = 8$ | 3 |

          $$
          1+3+3 = 7
          $$

          Coincide con el grado, así que **no hay raíces múltiples** y no falta
          ninguna.
        veredicto: |
          Contar y comparar con el grado es la comprobación más barata que hay en
          este tema. Si salen menos de 7, se ha perdido alguna por el camino.

      - tipo: calcular
        titulo: El módulo de las soluciones grandes
        pregunta: |
          Las seis soluciones no nulas están sobre dos circunferencias. ¿Cuál es
          el radio de la mayor?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '8'
            mensaje: |
              8 es el valor de $w = z^{3}$, no de $z$. Falta la raíz cúbica:
              $\sqrt[3]{8} = 2$.
          - valor: '2.8284'
            mensaje: |
              $2\sqrt2$ saldría de una raíz cuadrada. El cambio es
              $w=z^{3}$, así que hay que sacar raíz **cúbica**.
          - valor: '1'
            mensaje: |
              1 es el radio de la circunferencia **pequeña**, la de las raíces
              de $z^{3}=1$.
        pista: |
          $z^{3} = 8$. En polar, $\left|z\right|^{3} = 8$.
        desarrollo: |
          Escribiendo $8 = 8\,\mathrm{e}^{i\cdot0}$ y $z = r\,\mathrm{e}^{i\theta}$:

          $$
          r^{3}\mathrm{e}^{3i\theta} = 8\,\mathrm{e}^{i(0+2k\pi)}
          $$

          $$
          r = \sqrt[3]{8} = 2,
          \qquad
          \theta = \frac{2k\pi}{3},\ k=0,1,2
          $$

          Las tres raíces tienen **el mismo módulo 2** y están separadas 120°.
        veredicto: |
          Las raíces $n$-ésimas de un número siempre caen sobre una
          circunferencia y reparten el ángulo a partes iguales: forman un
          polígono regular de $n$ lados.

      - tipo: justificar
        pregunta: |
          Ordena la representación gráfica. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **El origen.** $z=0$ es una solución, y va dibujada como un punto
              en el centro.
          - texto: |
              **Triángulo pequeño.** Las raíces de $z^{3}=1$ tienen módulo 1 y
              argumentos $0$, $\frac{2\pi}{3}$ y $\frac{4\pi}{3}$:
              $1$ y $-\frac12\pm\frac{\sqrt3}{2}i$.
          - texto: |
              **Triángulo grande.** Las de $z^{3}=8$ tienen módulo 2 y los
              **mismos** argumentos: $2$ y $-1\pm\sqrt3\,i$.
          - texto: |
              Los dos triángulos son equiláteros, están **alineados** —los
              argumentos coinciden— y uno es el otro escalado por 2 desde el
              origen.
          - texto: |
              En total, siete puntos: el origen y dos triángulos concéntricos y
              homotéticos.
          - texto: |
              Los dos triángulos están girados 60° uno respecto del otro, porque
              los módulos son distintos.
            trampa: true
            mensaje: |
              El giro no depende del módulo. Los argumentos salen de
              $\frac{\arg w+2k\pi}{3}$, y como $\arg 1 = \arg 8 = 0$, los dos
              triángulos tienen **exactamente los mismos** argumentos: están
              alineados, no girados. Estarían girados si uno de los dos números
              fuera negativo, porque entonces su argumento sería $\pi$.
        veredicto: |
          Lo que decide la orientación es el **argumento** del número al que se
          le saca la raíz, no su módulo. Aquí los dos son reales positivos, y
          por eso las dos ternas comparten direcciones.

    resolucion: |
      **Datos.** $z^{7}-9z^{4}+8z = 0$ en $\mathbb{C}$.

      ### 1 · Factorizar, no dividir

      Todos los términos tienen $z$:

      $$
      z^{7}-9z^{4}+8z = z\left(z^{6}-9z^{3}+8\right) = 0
      $$

      Un producto es cero si lo es alguno de sus factores:

      $$
      \boxed{z = 0}
      \qquad\text{o}\qquad
      z^{6}-9z^{3}+8 = 0
      $$

      **Dividir entre $z$ en vez de factorizar pierde esta primera solución.**
      Es el error más frecuente aquí, y cuesta un punto entero.

      ### 2 · La ecuación bicúbica

      Los exponentes que quedan son 6 y 3, los dos múltiplos de 3. Con
      $w = z^{3}$:

      $$
      w^{2}-9w+8 = 0
      \;\Longrightarrow\;
      w = \frac{9\pm\sqrt{81-32}}{2} = \frac{9\pm7}{2}
      $$

      $$
      w = 1 \qquad\text{y}\qquad w = 8
      $$

      Quedan dos ecuaciones de raíces cúbicas.

      ### 3 · Las raíces de $z^{3}=1$

      En forma polar, con $1 = 1\cdot\mathrm{e}^{i(0+2k\pi)}$:

      $$
      r^{3} = 1 \Rightarrow r = 1,
      \qquad
      3\theta = 2k\pi \Rightarrow \theta = \frac{2k\pi}{3}
      $$

      | $k$ | $\theta$ | forma binómica |
      |---|---|---|
      | 0 | $0$ | $1$ |
      | 1 | $\frac{2\pi}{3}$ | $-\frac12+\frac{\sqrt3}{2}i$ |
      | 2 | $\frac{4\pi}{3}$ | $-\frac12-\frac{\sqrt3}{2}i$ |

      ### 4 · Las raíces de $z^{3}=8$

      Mismo procedimiento, con $8 = 8\,\mathrm{e}^{i(0+2k\pi)}$:

      $$
      r = \sqrt[3]{8} = 2,
      \qquad
      \theta = \frac{2k\pi}{3}
      $$

      | $k$ | $\theta$ | forma binómica |
      |---|---|---|
      | 0 | $0$ | $2$ |
      | 1 | $\frac{2\pi}{3}$ | $-1+\sqrt3\,i$ |
      | 2 | $\frac{4\pi}{3}$ | $-1-\sqrt3\,i$ |

      **Los argumentos son los mismos** que antes, porque $1$ y $8$ son los dos
      reales positivos y tienen argumento cero. Solo cambia el módulo.

      ### 5 · Las siete soluciones

      $$
      \boxed{
      \begin{aligned}
      z &= 0\\
      z &= 1,\quad -\tfrac12+\tfrac{\sqrt3}{2}i,\quad
      -\tfrac12-\tfrac{\sqrt3}{2}i\\
      z &= 2,\quad -1+\sqrt3\,i,\quad -1-\sqrt3\,i
      \end{aligned}}
      $$

      Siete soluciones para un polinomio de grado siete: **no falta ninguna y no
      hay repetidas**.

      ### 6 · La representación

      <figure class="figura-examen">
      <svg viewBox="0 0 460 460" role="img" width="440" height="440"
           aria-labelledby="f2425c1t f2425c1d">
        <title id="f2425c1t">Las siete soluciones en el plano complejo</title>
        <desc id="f2425c1d">Dos triangulos equilateros concentricos con
        vertice a la derecha sobre el eje real, uno de radio uno y otro de
        radio dos, mas un punto en el origen. Los seis vertices caen sobre dos
        circunferencias.</desc>

        <g stroke="var(--rule)" stroke-width="1.2" fill="none">
          <circle cx="230" cy="230" r="70"></circle>
          <circle cx="230" cy="230" r="140"></circle>
        </g>

        <g stroke="var(--graphite)" stroke-width="1.3" fill="none">
          <path d="M40 230 L420 230 M230 40 L230 420"></path>
        </g>

        <g stroke="var(--live)" stroke-width="2.2" fill="none">
          <path d="M300 230 L195 169.4 L195 290.6 Z"></path>
        </g>
        <g stroke="var(--alt)" stroke-width="2.2" fill="none">
          <path d="M370 230 L160 108.8 L160 351.2 Z"></path>
        </g>

        <circle cx="230" cy="230" r="6" fill="var(--flag)"></circle>
        <g fill="var(--live)">
          <circle cx="300" cy="230" r="5.5"></circle>
          <circle cx="195" cy="169.4" r="5.5"></circle>
          <circle cx="195" cy="290.6" r="5.5"></circle>
        </g>
        <g fill="var(--alt)">
          <circle cx="370" cy="230" r="5.5"></circle>
          <circle cx="160" cy="108.8" r="5.5"></circle>
          <circle cx="160" cy="351.2" r="5.5"></circle>
        </g>

        <g fill="var(--graphite)" font-size="13" font-family="var(--mono)">
          <text x="296" y="250">1</text>
          <text x="366" y="250">2</text>
          <text x="410" y="222">Re</text>
          <text x="238" y="52">Im</text>
        </g>
        <g fill="var(--flag)" font-size="13" font-family="var(--mono)">
          <text x="206" y="252">0</text>
        </g>
      </svg>
      <figcaption>
      Figura nuestra: el enunciado pide representar. En verde el triangulo de
      las raices cubicas de 1, en violeta el de las de 8, y en rojo el origen.
      </figcaption>
      </figure>

      **Los dos triángulos son equiláteros y están alineados**: el grande es el
      pequeño multiplicado por 2. No hay giro entre ellos, porque los dos
      números —1 y 8— tienen argumento cero.

      ### 7 · Comprobación

      **Sustituyendo $z=2$:**

      $$
      2^{7}-9\cdot2^{4}+8\cdot2 = 128-144+16 = 0 \quad\checkmark
      $$

      **Sustituyendo $z=1$:**

      $$
      1-9+8 = 0 \quad\checkmark
      $$

      **Con una compleja,** $z = -1+\sqrt3\,i$. En polar es
      $2\,\mathrm{e}^{2\pi i/3}$, así que

      $$
      z^{3} = 8\,\mathrm{e}^{2\pi i} = 8
      \;\Longrightarrow\;
      z^{6} = 64
      $$

      $$
      z^{6}-9z^{3}+8 = 64-72+8 = 0 \quad\checkmark
      $$

      **Por la suma de las raíces.** En $z^{7}-9z^{4}+8z$ el coeficiente de
      $z^{6}$ es cero, así que las siete raíces deben sumar 0:

      $$
      0+\left(1-\tfrac12-\tfrac12\right)+\left(2-1-1\right)
      + i\left(\tfrac{\sqrt3}{2}-\tfrac{\sqrt3}{2}+\sqrt3-\sqrt3\right) = 0
      \quad\checkmark
      $$

  - id: ex2425-3ev-2-pelota-que-bota
    titulo: Una pelota que bota infinitas veces y recorre algo finito
    fuente: >-
      Ejercicio 2 · Tercera evaluación, 21 de enero de 2025 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    nivel: examen
    enunciado: |
      Se suelta una pelota desde una altura de 9 metros. Con cada bote la pelota
      rebota hasta una altura del 80 % de su altura previa.

      **a)** ¿Hasta qué altura rebota la pelota en el quinto bote?

      **b)** ¿Cuál es la suma de las alturas de todos los botes?
    pide: Calcular la altura del quinto bote y la suma de todas.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tipo de sucesión forman las alturas?
        opciones:
          - texto: >-
              **Geométrica de razón $0{,}8$**, porque cada altura se obtiene
              **multiplicando** la anterior
            correcta: true
            mensaje: |
              Exacto. «El 80 % de la altura previa» es una multiplicación
              repetida, no una resta repetida. Y como $\left|r\right|<1$, la
              serie de todas las alturas converge.
          - texto: >-
              Aritmética, porque baja una cantidad fija en cada bote
            mensaje: |
              No baja una cantidad fija: baja un **porcentaje** fijo. Del primer
              bote al segundo pierde $1{,}44$ m, y del quinto al sexto solo
              $0{,}59$ m.
          - texto: Armónica
            mensaje: |
              La armónica es $\frac1n$, que decrece mucho más despacio y cuya
              serie ni siquiera converge.
          - texto: >-
              No es de ningún tipo conocido: hay que sumar bote a bote
            mensaje: |
              Sumar bote a bote es imposible: son infinitos. Reconocer que es
              geométrica es justamente lo que permite sumarlos todos de golpe.

      - tipo: calcular
        titulo: La altura del quinto bote
        pregunta: |
          ¿Hasta qué altura llega la pelota en el quinto bote, en metros?
        respuesta:
          tipo: numero
          valor: '2.9491'
          tolerancia: 0.0005
          formato: en forma exacta, o un número, en metros con cuatro decimales
        distractores:
          - valor: '3.6864'
            mensaje: |
              $3{,}6864$ es $9\cdot0{,}8^{4}$: la altura del **cuarto** bote. El
              primer bote ya lleva un factor $0{,}8$, así que el quinto lleva
              cinco.
          - valor: '2.3593'
            mensaje: |
              $2{,}3593$ es $9\cdot0{,}8^{6}$, el sexto bote: un factor de más.
          - valor: '5'
            mensaje: |
              5 sería restar $0{,}8$ metros cinco veces. El 80 % es un factor,
              no una resta.
        pista: |
          Primer bote: $9\cdot0{,}8$. ¿Y el quinto?
        desarrollo: |
          Contando los botes desde el primero:

          | bote | altura |
          |---|---|
          | 1.º | $9\cdot0{,}8 = 7{,}2$ |
          | 2.º | $9\cdot0{,}8^{2} = 5{,}76$ |
          | 3.º | $9\cdot0{,}8^{3} = 4{,}608$ |
          | 4.º | $9\cdot0{,}8^{4} = 3{,}6864$ |
          | 5.º | $9\cdot0{,}8^{5} = 2{,}94912$ |

          $$
          h_5 = 9\cdot0{,}8^{5} = 9\cdot0{,}32768 = 2{,}94912 \ \text{m}
          $$
        veredicto: |
          El único sitio donde se falla es el exponente. La caída inicial de 9 m
          **no es un bote**: el primer bote ya sube a $7{,}2$ m.

      - tipo: calcular
        titulo: La suma de todas las alturas
        pregunta: |
          ¿Cuánto suman las alturas de todos los botes, en metros?
        respuesta:
          tipo: numero
          valor: '36'
          tolerancia: 0.01
          formato: un número, en metros
        distractores:
          - valor: '45'
            mensaje: |
              45 incluye los 9 m de la caída inicial, que no es un bote:
              $9+36$. El enunciado pide la suma de **las alturas de los botes**.
          - valor: '11.25'
            mensaje: |
              $11{,}25$ es $\frac{9}{0{,}8}$: has dividido por la razón en vez de
              por $1-r$.
          - valor: '7.2'
            mensaje: |
              $7{,}2$ es solo el primer bote. Faltan los infinitos restantes.
        pista: |
          $\sum_{n\ge1} a r^{n-1} = \frac{a}{1-r}$, con $a$ el **primer**
          término.
        desarrollo: |
          Las alturas de los botes forman la serie geométrica

          $$
          \sum_{n=1}^{\infty}9\cdot0{,}8^{\,n}
          = 7{,}2+5{,}76+4{,}608+\ldots
          $$

          Primer término $a = 7{,}2$, razón $r = 0{,}8$. Como
          $\left|r\right|<1$ **converge**, y

          $$
          S = \frac{a}{1-r} = \frac{7{,}2}{0{,}2} = 36 \ \text{m}
          $$

          También, sacando el 9 fuera:

          $$
          9\sum_{n=1}^{\infty}0{,}8^{\,n}
          = 9\cdot\frac{0{,}8}{1-0{,}8} = 9\cdot4 = 36 \quad\checkmark
          $$
        veredicto: |
          Que la suma sea **cuatro veces** la altura inicial es una regla útil:
          con razón $r$, la suma de los botes vale $\frac{r}{1-r}$ veces la
          altura de partida.

      - tipo: justificar
        pregunta: |
          Ordena la justificación del apartado (b). Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **Escribir el término general.** La altura del bote $n$-ésimo es
              $h_n = 9\cdot0{,}8^{\,n}$, con $n \ge 1$.
          - texto: |
              **Reconocer la serie.** $\sum h_n$ es geométrica de primer término
              $7{,}2$ y razón $0{,}8$.
          - texto: |
              **Comprobar la hipótesis.** $\left|r\right| = 0{,}8 < 1$, que es
              la condición **necesaria y suficiente** para que una geométrica
              converja.
          - texto: |
              **Aplicar la fórmula:**
              $S = \frac{a}{1-r} = \frac{7{,}2}{0{,}2} = 36$ metros.
          - texto: |
              La pelota da **infinitos** botes y aun así la suma de sus alturas
              es finita: 36 metros.
          - texto: |
              Como la pelota da infinitos botes, nunca llega a pararse.
            trampa: true
            mensaje: |
              Da infinitos botes, sí, pero **en tiempo finito**: los botes son
              cada vez más bajos y por tanto cada vez más rápidos, y la serie de
              los tiempos también converge. Es la paradoja de Zenón, y la
              respuesta es la misma que da la serie geométrica: infinitos
              términos pueden sumar una cantidad finita. Decir «nunca se para»
              confunde «infinitos sumandos» con «suma infinita», que es
              exactamente lo que el ejercicio desmiente.
        veredicto: |
          El apartado (b) existe para que quede claro que infinitos sumandos
          positivos pueden sumar algo finito. Es lo contrario de lo que dice la
          intuición, y es el corazón del tema.

    resolucion: |
      **Datos.** Altura inicial $9$ m, y cada bote alcanza el $80\,\%$ de la
      altura anterior.

      ### 1 · Modelizar

      «El 80 % de la altura previa» significa **multiplicar por $0{,}8$**, no
      restar una cantidad. Así que las alturas forman una **progresión
      geométrica** de razón $r = 0{,}8$:

      $$
      h_n = 9\cdot0{,}8^{\,n}, \qquad n = 1,2,3,\ldots
      $$

      **El exponente es $n$, no $n-1$**, porque los 9 metros iniciales son la
      **caída**, no un bote. El primer bote ya sube solo a $7{,}2$ m.

      ### 2 · Apartado (a)

      $$
      h_5 = 9\cdot0{,}8^{5}
      $$

      Sin calculadora —el examen no la permite—:

      $$
      0{,}8^{2} = 0{,}64,
      \qquad
      0{,}8^{4} = 0{,}64^{2} = 0{,}4096,
      \qquad
      0{,}8^{5} = 0{,}4096\cdot0{,}8 = 0{,}32768
      $$

      $$
      \boxed{h_5 = 9\cdot0{,}32768 = 2{,}94912 \ \text{m}}
      $$

      Poco menos de tres metros: en cinco botes ha perdido dos tercios de la
      altura.

      ### 3 · Apartado (b)

      $$
      S = \sum_{n=1}^{\infty}9\cdot0{,}8^{\,n}
      $$

      **Hipótesis que hay que declarar:** es geométrica de razón $0{,}8$, y

      $$
      \left|r\right| = 0{,}8 < 1
      $$

      Esa desigualdad es la condición **necesaria y suficiente** para que una
      serie geométrica converja. Sin ella la fórmula de la suma no vale.

      $$
      S = \frac{\text{primer término}}{1-r} = \frac{7{,}2}{1-0{,}8}
      = \frac{7{,}2}{0{,}2}
      $$

      $$
      \boxed{S = 36 \ \text{metros}}
      $$

      ### 4 · Qué significa el 36

      La pelota da **infinitos botes** —matemáticamente nunca deja de botar— y,
      sin embargo, la suma de todas sus alturas es un número perfectamente
      finito: 36 metros, exactamente **cuatro veces** la altura de partida.

      Esa es la idea que el ejercicio pone a prueba. Infinitos sumandos
      positivos pueden dar una suma finita, si decrecen lo bastante deprisa. Con
      $r = 0{,}8$ decrecen geométricamente, que es más que suficiente.

      Y la regla general, que conviene recordar:

      $$
      \frac{S}{h_0} = \frac{r}{1-r}
      $$

      Con $r = 0{,}8$ sale 4; con $r = 0{,}5$ saldría 1; con $r = 0{,}9$
      saldría 9. Cuanto más elástica la pelota, mucho más recorrido.

      ### 5 · Comprobación

      **Sumando los diez primeros botes a mano:**

      $$
      7{,}2+5{,}76+4{,}608+3{,}6864+2{,}94912+2{,}359+1{,}887+1{,}510
      +1{,}208+0{,}966 = 32{,}12
      $$

      Ya está en el 89 % del total, y lo que falta —$3{,}88$ m repartidos en
      infinitos botes— encaja: el bote 11 mide $0{,}773$ y desde ahí la cola
      geométrica suma $\frac{0{,}773}{0{,}2} = 3{,}86$ ✔

      **Por la fórmula de la suma parcial**, como segunda vía:

      $$
      S_N = 7{,}2\cdot\frac{1-0{,}8^{N}}{0{,}2} = 36\left(1-0{,}8^{N}\right)
      $$

      Con $N=10$: $36\left(1-0{,}1074\right) = 32{,}13$ ✔ Y al crecer $N$,
      $0{,}8^{N}\to0$ y $S_N \to 36$ ✔

      **Coherencia con (a).** $h_5 = 2{,}949$ y la cola desde el sexto bote vale
      $\frac{9\cdot0{,}8^{6}}{0{,}2} = 11{,}80$. Sumando los cinco primeros
      —$24{,}20$— da $36{,}00$ ✔

  - id: ex2425-3ev-3-mclaurin-del-coseno
    titulo: Dos derivadas de orden alto sin derivar ni una vez
    fuente: >-
      Ejercicio 3 · Tercera evaluación, 21 de enero de 2025 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3

    nivel: examen
    enunciado: |
      **a)** Calcular el polinomio de McLaurin de orden 6 de la función
      $f(x) = \cos x$.

      **b)** Sea $g(x) = \cos\left(x^{2}\right)$. Utilizando la fórmula obtenida
      en el apartado anterior calcular $g^{7)}(0)$ y $g^{8)}(0)$.
    pide: Calcular el polinomio y las dos derivadas.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el enunciado insiste en usar el apartado (a)?
        opciones:
          - texto: >-
              Porque derivar ocho veces $\cos\left(x^{2}\right)$ es inabordable,
              y el desarrollo da todas las derivadas de golpe
            correcta: true
            mensaje: |
              Exacto. La octava derivada de $\cos\left(x^{2}\right)$ por la regla
              de la cadena tiene decenas de términos. El desarrollo en serie los
              da todos a la vez, leyendo coeficientes.
          - texto: >-
              Porque $g$ no es derivable ocho veces
            mensaje: |
              Lo es: es composición de funciones infinitamente derivables. El
              problema es el coste de hacerlo, no la existencia.
          - texto: >-
              Porque hay que aplicar la regla de la cadena al polinomio
            mensaje: |
              No se deriva nada: se **sustituye** $x$ por $x^{2}$ en el
              desarrollo y se leen los coeficientes.
          - texto: >-
              Porque el polinomio de orden 6 de $\cos x$ es también el de
              $\cos\left(x^{2}\right)$
            mensaje: |
              No: al sustituir, los grados se duplican. El de orden 6 de
              $\cos x$ da el de orden **12** de $\cos\left(x^{2}\right)$.

      - tipo: calcular
        titulo: El coeficiente de sexto grado
        pregunta: |
          En el polinomio de McLaurin de orden 6 de $\cos x$, ¿cuál es el
          coeficiente de $x^{6}$? En forma exacta, o con seis decimales.
        respuesta:
          tipo: numero
          valor: '-0.001389'
          tolerancia: 0.000005
          formato: un número
        distractores:
          - valor: '0.001389'
            mensaje: |
              Falta el signo. Los signos alternan: $+,-,+,-$, y el de $x^{6}$
              —que es el cuarto término— es **negativo**.
          - valor: '-0.008333'
            mensaje: |
              $-\frac{1}{120}$ es $\frac{1}{5!}$. El denominador correcto es
              $6!=720$, no $5!$.
          - valor: '-0.166667'
            mensaje: |
              $-\frac16$ es el coeficiente de $x^{3}$ en el **seno**. Aquí solo
              hay potencias pares.
        pista: |
          $\cos x = \sum_{k\ge0}\frac{(-1)^{k}x^{2k}}{(2k)!}$.
        desarrollo: |
          $$
          \cos x = 1-\frac{x^{2}}{2!}+\frac{x^{4}}{4!}-\frac{x^{6}}{6!}
          +\ldots
          $$

          El coeficiente de $x^{6}$ es

          $$
          -\frac{1}{6!} = -\frac{1}{720} = -0{,}001389
          $$

          Y el polinomio pedido:

          $$
          P_6(x) = 1-\frac{x^{2}}{2}+\frac{x^{4}}{24}-\frac{x^{6}}{720}
          $$
        veredicto: |
          Solo aparecen potencias **pares** porque el coseno es una función par:
          su desarrollo no puede tener términos impares.

      - tipo: calcular
        titulo: La octava derivada
        pregunta: |
          ¿Cuánto vale $g^{8)}(0)$?
        respuesta:
          tipo: numero
          valor: '1680'
          tolerancia: 0.5
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              0 es $g^{7)}(0)$, la **séptima**. La octava no se anula, porque
              $x^{8}$ sí aparece en el desarrollo de
              $\cos\left(x^{2}\right)$.
          - valor: '40320'
            mensaje: |
              $40320$ es $8!$ a secas. Hay que multiplicarlo por el coeficiente
              $\frac{1}{24}$, no dejarlo solo.
          - valor: '24'
            mensaje: |
              24 es $4!$, el denominador del coeficiente. Falta multiplicar por
              $8!$.
        pista: |
          El coeficiente de $x^{8}$ en el desarrollo es
          $\frac{g^{8)}(0)}{8!}$.
        desarrollo: |
          Sustituyendo $x$ por $x^{2}$:

          $$
          \cos\left(x^{2}\right)
          = 1-\frac{x^{4}}{2!}+\frac{x^{8}}{4!}-\frac{x^{12}}{6!}+\ldots
          $$

          **Solo hay potencias múltiplos de 4.** En particular:

          $$
          [x^{7}]: \ 0
          \qquad
          [x^{8}]: \ \frac{1}{4!} = \frac{1}{24}
          $$

          Y como el coeficiente de $x^{n}$ es $\frac{g^{n)}(0)}{n!}$:

          $$
          \frac{g^{8)}(0)}{8!} = \frac{1}{24}
          \;\Longrightarrow\;
          g^{8)}(0) = \frac{40320}{24} = 1680
          $$
        veredicto: |
          Todo el ejercicio se reduce a leer un coeficiente y multiplicarlo por
          el factorial. Ninguna derivada se calcula de verdad.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento de (b). Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Sustituir.** En el desarrollo de $\cos t$ se hace $t = x^{2}$:
              $\cos\left(x^{2}\right) = 1-\frac{x^{4}}{2!}+\frac{x^{8}}{4!}
              -\ldots$
          - texto: |
              **Observar qué potencias hay.** Solo aparecen $x^{0}$, $x^{4}$,
              $x^{8}$, $x^{12}$…: los múltiplos de 4.
          - texto: |
              **La séptima.** No hay término en $x^{7}$, así que su coeficiente
              es 0 y $g^{7)}(0) = 7!\cdot0 = 0$.
          - texto: |
              **La octava.** El coeficiente de $x^{8}$ es $\frac{1}{4!}$, luego
              $g^{8)}(0) = 8!\cdot\frac{1}{24} = 1680$.
          - texto: |
              La unicidad del desarrollo de Taylor es lo que legitima el paso:
              el polinomio obtenido sustituyendo **es** el de $g$, y por tanto
              sus coeficientes son los $\frac{g^{n)}(0)}{n!}$.
          - texto: |
              El polinomio de orden 6 de $\cos x$ da, tras sustituir, el
              polinomio de orden 6 de $g$.
            trampa: true
            mensaje: |
              Da el de orden **12**: al sustituir $x$ por $x^{2}$ cada grado se
              duplica, y el $x^{6}$ se convierte en $x^{12}$. Eso es justamente
              lo que hace que el apartado (a) baste para llegar a la octava
              derivada — con el de orden 6 se cubre hasta el grado 12, de sobra.
              Creer que se queda en el grado 6 llevaría a pensar que no hay
              información sobre $x^{8}$.
        veredicto: |
          Sustituir $x$ por $x^{2}$ **duplica los grados**, y por eso un
          polinomio corto en $\cos x$ da uno largo en
          $\cos\left(x^{2}\right)$. Es lo que hace rentable el método.

    resolucion: |
      **Datos.** $f(x) = \cos x$ y $g(x) = \cos\left(x^{2}\right)$.

      ### 1 · Apartado (a)

      Las derivadas del coseno se repiten con periodo 4:

      | $n$ | $f^{n)}(x)$ | $f^{n)}(0)$ |
      |---|---|---|
      | 0 | $\cos x$ | $1$ |
      | 1 | $-\sin x$ | $0$ |
      | 2 | $-\cos x$ | $-1$ |
      | 3 | $\sin x$ | $0$ |
      | 4 | $\cos x$ | $1$ |
      | 5 | $-\sin x$ | $0$ |
      | 6 | $-\cos x$ | $-1$ |

      Todas las impares se anulan, porque el coseno es **par**. Sustituyendo en

      $$
      P_6(x) = \sum_{n=0}^{6}\frac{f^{n)}(0)}{n!}x^{n}
      $$

      $$
      \boxed{P_6(x) = 1-\frac{x^{2}}{2!}+\frac{x^{4}}{4!}-\frac{x^{6}}{6!}
      = 1-\frac{x^{2}}{2}+\frac{x^{4}}{24}-\frac{x^{6}}{720}}
      $$

      En forma general:

      $$
      \cos x = \sum_{k=0}^{\infty}\frac{(-1)^{k}}{(2k)!}x^{2k}
      $$

      ### 2 · Apartado (b): la idea

      Calcular $g^{8)}$ derivando ocho veces $\cos\left(x^{2}\right)$ es
      inviable a mano: la regla de la cadena multiplica los términos en cada
      paso.

      El atajo se apoya en la **unicidad del desarrollo de Taylor**: si se
      consigue escribir $g$ como una serie de potencias centrada en 0, esa serie
      **es** su desarrollo de McLaurin, y por tanto

      $$
      \text{coeficiente de } x^{n} = \frac{g^{n)}(0)}{n!}
      $$

      Ese teorema es lo que hay que citar; sin él, el atajo no está justificado.

      ### 3 · Sustituir

      En el desarrollo de $\cos t$ se pone $t = x^{2}$ —vale para todo $t$, así
      que también para $t = x^{2}$—:

      $$
      \cos\left(x^{2}\right)
      = 1-\frac{\left(x^{2}\right)^{2}}{2!}
      +\frac{\left(x^{2}\right)^{4}}{4!}
      -\frac{\left(x^{2}\right)^{6}}{6!}+\ldots
      $$

      $$
      \boxed{\cos\left(x^{2}\right)
      = 1-\frac{x^{4}}{2}+\frac{x^{8}}{24}-\frac{x^{12}}{720}+\ldots}
      $$

      **Los grados se han duplicado.** El polinomio de orden 6 de $\cos x$ se
      convierte en el de orden **12** de $g$: de sobra para llegar al grado 8.

      Y solo aparecen potencias **múltiplos de 4**.

      ### 4 · Las dos derivadas

      **La séptima.** No hay término en $x^{7}$ —7 no es múltiplo de 4—, luego
      su coeficiente vale 0:

      $$
      \frac{g^{7)}(0)}{7!} = 0
      \;\Longrightarrow\;
      \boxed{g^{7)}(0) = 0}
      $$

      **La octava.** El término en $x^{8}$ es $\frac{x^{8}}{4!}$:

      $$
      \frac{g^{8)}(0)}{8!} = \frac{1}{24}
      \;\Longrightarrow\;
      g^{8)}(0) = \frac{8!}{24} = \frac{40320}{24}
      $$

      $$
      \boxed{g^{8)}(0) = 1680}
      $$

      ### 5 · Un resultado que sale gratis

      El mismo argumento da **todas** las derivadas impares:

      $$
      g^{n)}(0) = 0 \quad\text{siempre que } n \text{ no sea múltiplo de }4
      $$

      Porque $g$ es par —$g(-x) = \cos\left(x^{2}\right) = g(x)$— y además su
      desarrollo salta de cuatro en cuatro. Así, $g^{5)}(0) = g^{6)}(0) = 0$
      igual que la séptima.

      ### 6 · Comprobación

      **Numérica del polinomio (a).** En $x = 0{,}5$:

      $$
      P_6(0{,}5) = 1-0{,}125+0{,}0026042-0{,}0000217 = 0{,}8775825
      $$

      $$
      \cos(0{,}5) = 0{,}8775826 \quad\checkmark
      $$

      Siete cifras exactas con cuatro términos.

      **De la octava derivada, por otra vía.** Escribiendo
      $u = x^{4}$, la parte relevante de $g$ es

      $$
      \frac{x^{8}}{24}
      $$

      y derivar ocho veces un monomio $\frac{x^{8}}{24}$ da
      $\frac{8!}{24} = 1680$, mientras que todos los demás términos —de grado 4
      y de grado 12 o más— se anulan en 0: los de grado menor porque desaparecen
      al derivar ocho veces, los de grado mayor porque conservan un factor $x$ ✔

      **De la séptima, por paridad.** $g$ es par, así que $g'$ es impar, $g''$
      par… y en general $g^{n)}$ es impar cuando $n$ lo es. Toda función impar
      derivable vale 0 en el origen, luego $g^{7)}(0)=0$ ✔ Una segunda
      justificación, independiente del desarrollo.

  - id: ex2425-3ev-4-recinto-y-volumen
    titulo: Un recinto entre parábola y circunferencia, y lo que barre al girar
    fuente: >-
      Ejercicio 4 · Tercera evaluación, 21 de enero de 2025 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3

    nivel: examen
    enunciado: |
      Sea $D$ el recinto limitado por las condiciones
      $x^{2}+y^{2} \le 8$, $y^{2} \le 2x$.

      **a)** Dibujar el recinto $D$.

      **b)** Calcular el área de $D$.

      **c)** Calcular el volumen del cuerpo generado al girar el recinto $D$
      alrededor del eje OY.
    pide: Dibujar, calcular el área y el volumen.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué representa cada condición?
        opciones:
          - texto: >-
              Un **disco** de radio $2\sqrt2$ y el **interior** de una parábola
              tumbada
            correcta: true
            mensaje: |
              Exacto. $y^{2}\le2x$ se lee $x \ge \frac{y^{2}}{2}$: la zona a la
              **derecha** de la parábola $y^{2}=2x$, que se abre hacia las $x$
              positivas.
          - texto: >-
              Un disco y el exterior de una parábola
            mensaje: |
              El signo va al revés. $y^{2}\le2x$ deja los puntos con $x$
              **grande**, es decir dentro de la parábola.
          - texto: >-
              Una circunferencia y una parábola vertical
            mensaje: |
              La parábola es **tumbada**: es $y^{2}$ lo que está elevado al
              cuadrado, no $x$.
          - texto: >-
              Dos parábolas
            mensaje: |
              $x^{2}+y^{2}\le8$ tiene las dos variables al cuadrado con el mismo
              coeficiente: es un disco.

      - tipo: calcular
        titulo: Dónde se cortan
        pregunta: |
          Las dos curvas se cortan en dos puntos. ¿Cuál es su abscisa común?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '-4'
            mensaje: |
              $-4$ es la otra raíz de $x^{2}+2x-8=0$, pero hay que descartarla:
              con $x<0$ no puede ser $y^{2}=2x$, porque un cuadrado no es
              negativo.
          - valor: '2.8284'
            mensaje: |
              $2\sqrt2$ es el radio del disco, donde la circunferencia corta al
              eje. La parábola pasa por dentro.
          - valor: '4'
            mensaje: |
              4 saldría de $y^{2}$ en el punto de corte, no de $x$.
        pista: |
          Sustituye $y^{2} = 2x$ en $x^{2}+y^{2} = 8$.
        desarrollo: |
          $$
          x^{2}+2x = 8
          \;\Longrightarrow\;
          x^{2}+2x-8 = 0
          \;\Longrightarrow\;
          x = 2 \ \text{ó}\ x = -4
          $$

          **$x=-4$ se descarta:** con $y^{2}=2x$ haría falta $y^{2}=-8$, y un
          cuadrado real no es negativo. Es una raíz que aparece al elevar y hay
          que comprobarla.

          Con $x=2$: $y^{2}=4$, luego $y = \pm2$.

          $$
          (2,\,2) \qquad\text{y}\qquad (2,\,-2)
          $$
        veredicto: |
          Comprobar las raíces al sustituir es obligatorio siempre que se
          elimina una variable elevada al cuadrado: aparecen soluciones falsas.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuál es el área de $D$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '7.6165'
          tolerancia: 0.0008
          formato: un número
        distractores:
          - valor: '6.2832'
            mensaje: |
              $2\pi$ es solo la parte circular. Falta el $\frac43$ que aporta el
              trozo entre la parábola y la cuerda.
          - valor: '3.8083'
            mensaje: |
              Es la mitad: has integrado solo de $y=0$ a $y=2$ y olvidado que el
              recinto es simétrico respecto del eje $OX$.
          - valor: '25.1327'
            mensaje: |
              $8\pi$ es el área del **disco entero**. El recinto es una parte
              pequeña de él.
        pista: |
          Integra en $y$: la anchura es
          $\sqrt{8-y^{2}}-\frac{y^{2}}{2}$.
        desarrollo: |
          Integrando en $y$, entre $-2$ y $2$:

          $$
          A = \int_{-2}^{2}\left[\sqrt{8-y^{2}}-\frac{y^{2}}{2}\right]dy
          = 2\int_0^{2}\left[\sqrt{8-y^{2}}-\frac{y^{2}}{2}\right]dy
          $$

          **La parte circular:**

          $$
          \int_0^{2}\sqrt{8-y^{2}}\,dy
          = \left[\frac{y}{2}\sqrt{8-y^{2}}+4\arcsin\frac{y}{2\sqrt2}
          \right]_0^{2}
          $$

          $$
          = 1\cdot2+4\arcsin\frac{1}{\sqrt2} = 2+4\cdot\frac{\pi}{4} = 2+\pi
          $$

          **La parte parabólica:**

          $$
          \int_0^{2}\frac{y^{2}}{2}dy = \frac{1}{2}\cdot\frac{8}{3}
          = \frac43
          $$

          $$
          A = 2\left(2+\pi-\frac43\right) = \frac43+2\pi \approx 7{,}6165
          $$
        veredicto: |
          El $\arcsin\frac{1}{\sqrt2} = \frac{\pi}{4}$ no es casualidad: el punto
          de corte está a 45° del centro, y por eso el sector circular sale
          redondo.

      - tipo: justificar
        pregunta: |
          Ordena el cálculo del volumen. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **El eje de giro es OY**, y el recinto es simétrico respecto de
              $OX$, así que la mitad de arriba y la de abajo barren el mismo
              sólido.
          - texto: |
              **Cortar por planos $y = $ cte.** Cada corte del recinto es un
              segmento horizontal de $x=\frac{y^{2}}{2}$ a
              $x=\sqrt{8-y^{2}}$.
          - texto: |
              Al girar, ese segmento barre una **corona circular** de radio
              exterior $\sqrt{8-y^{2}}$ e interior $\frac{y^{2}}{2}$.
          - texto: |
              **Integrar las coronas:**
              $V = \pi\int_{-2}^{2}\left[\left(8-y^{2}\right)
              -\frac{y^{4}}{4}\right]dy$.
          - texto: |
              $V = 2\pi\left[8y-\frac{y^{3}}{3}-\frac{y^{5}}{20}\right]_0^{2}
              = 2\pi\cdot\frac{176}{15} = \frac{352\pi}{15} \approx 73{,}72$.
          - texto: |
              Como el recinto no toca el eje OY, el sólido es macizo y basta con
              el radio exterior.
            trampa: true
            mensaje: |
              Al revés: **precisamente porque** el recinto no toca el eje $OY$
              —su borde izquierdo es la parábola, que solo lo alcanza en el
              vértice— el sólido tiene un **hueco** en el centro y hacen falta
              los dos radios. Con solo el exterior saldría
              $\frac{80\pi}{3} \approx 83{,}8$, un 14 % de más: justo el
              volumen del hueco que la parábola deja libre.
        veredicto: |
          El método de las coronas —o arandelas— es el que corresponde cuando el
          eje de giro es perpendicular a la variable de integración y el recinto
          no lo toca.

    resolucion: |
      **Datos.** $D$ definido por $x^{2}+y^{2}\le8$ y $y^{2}\le2x$.

      ### 1 · Apartado (a): las dos curvas

      **La primera** es un disco cerrado de centro el origen y radio

      $$
      r = \sqrt8 = 2\sqrt2 \approx 2{,}83
      $$

      **La segunda**, $y^{2}\le2x$, se lee mejor despejada:

      $$
      x \ge \frac{y^{2}}{2}
      $$

      Es la zona a la **derecha** de la parábola tumbada $y^{2}=2x$, que tiene
      su vértice en el origen y se abre hacia las $x$ positivas.

      **Los cortes.** Sustituyendo $y^{2}=2x$ en la circunferencia:

      $$
      x^{2}+2x = 8
      \;\Longrightarrow\;
      x^{2}+2x-8 = 0
      \;\Longrightarrow\;
      x = 2 \ \text{ó}\ x = -4
      $$

      **$x=-4$ hay que descartarla:** exigiría $y^{2} = -8$, imposible. Es una
      raíz falsa introducida al sustituir, y comprobarla es parte del ejercicio.

      Con $x=2$ sale $y = \pm2$:

      $$
      (2,\,2) \qquad\text{y}\qquad (2,\,-2)
      $$

