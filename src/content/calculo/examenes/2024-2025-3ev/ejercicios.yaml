        </g>

        <g fill="var(--flag)">
          <circle cx="262" cy="106" r="5.5"></circle>
          <circle cx="262" cy="354" r="5.5"></circle>
        </g>

        <g fill="var(--graphite)" font-size="13" font-family="var(--mono)">
          <text x="256" y="248">0</text>
          <text x="470" y="222">x</text>
          <text x="178" y="72">y</text>
          <text x="272" y="100">(2,2)</text>
          <text x="272" y="372">(2,-2)</text>
          <text x="290" y="176">circunf.</text>
        </g>
        <g fill="var(--ink)" font-size="13" font-family="var(--mono)">
          <text x="188" y="118">y²=2x</text>
        </g>
      </svg>
      <figcaption>
      Figura nuestra: el enunciado pide dibujarla. En negro la parabola, en
      violeta el arco de circunferencia que cierra el recinto, y sombreada la
      region D, que acaba en punta en el origen.
      </figcaption>
      </figure>

      **El recinto** tiene forma de hoja: acaba en punta en el origen —el
      vértice de la parábola— y se cierra a la derecha con el arco de
      circunferencia entre $(2,2)$ y $(2,-2)$.

      ### 2 · Apartado (b): el área

      Conviene integrar en $y$, porque las dos curvas se despejan como $x$ en
      función de $y$ sin partir nada:

      $$
      A = \int_{-2}^{2}\left[\underbrace{\sqrt{8-y^{2}}}_{\text{derecha}}
      -\underbrace{\frac{y^{2}}{2}}_{\text{izquierda}}\right]dy
      $$

      **El recinto es simétrico respecto del eje $OX$** —al cambiar $y$ por
      $-y$ las dos condiciones no varían—, así que basta la mitad de arriba:

      $$
      A = 2\int_0^{2}\left[\sqrt{8-y^{2}}-\frac{y^{2}}{2}\right]dy
      $$

      **Parte circular**, con la primitiva estándar
      $\int\sqrt{a^{2}-y^{2}}\,dy
      = \frac y2\sqrt{a^{2}-y^{2}}+\frac{a^{2}}{2}\arcsin\frac ya$
      y $a = 2\sqrt2$:

      $$
      \int_0^{2}\sqrt{8-y^{2}}\,dy
      = \left[\frac y2\sqrt{8-y^{2}}+4\arcsin\frac{y}{2\sqrt2}\right]_0^{2}
      $$

      $$
      = \frac22\sqrt4+4\arcsin\frac{2}{2\sqrt2}
      = 2+4\arcsin\frac{1}{\sqrt2} = 2+4\cdot\frac{\pi}{4} = 2+\pi
      $$

      **Parte parabólica:**

      $$
      \int_0^{2}\frac{y^{2}}{2}\,dy
      = \left[\frac{y^{3}}{6}\right]_0^{2} = \frac86 = \frac43
      $$

      $$
      A = 2\left(2+\pi-\frac43\right) = 2\left(\frac23+\pi\right)
      $$

      $$
      \boxed{A = \frac43+2\pi \approx 7{,}6165}
      $$

      ### 3 · Apartado (c): el volumen al girar sobre OY

      El eje de giro es **vertical** y la integración va en $y$: cada corte
      horizontal del recinto es un segmento que, al girar, barre una **corona
      circular**.

      | radio | vale |
      |---|---|
      | exterior | $\sqrt{8-y^{2}}$ (la circunferencia) |
      | interior | $\frac{y^{2}}{2}$ (la parábola) |

      **Hay hueco** porque el borde izquierdo del recinto no es el eje $OY$,
      sino la parábola: solo lo toca en el vértice.

      $$
      V = \pi\int_{-2}^{2}\left[\left(\sqrt{8-y^{2}}\right)^{2}
      -\left(\frac{y^{2}}{2}\right)^{2}\right]dy
      = \pi\int_{-2}^{2}\left[8-y^{2}-\frac{y^{4}}{4}\right]dy
      $$

      Aprovechando otra vez la simetría:

      $$
      V = 2\pi\left[8y-\frac{y^{3}}{3}-\frac{y^{5}}{20}\right]_0^{2}
      = 2\pi\left[16-\frac83-\frac{32}{20}\right]
      $$

      Con denominador común 15:

      $$
      16-\frac83-\frac85 = \frac{240-40-24}{15} = \frac{176}{15}
      $$

      $$
      \boxed{V = \frac{352\pi}{15} \approx 73{,}72}
      $$

      ### 4 · Comprobación

      **De los puntos de corte.** $(2,2)$: en la circunferencia
      $4+4 = 8$ ✔ y en la parábola $4 = 2\cdot2$ ✔

      **Del área, por acotación.** El recinto cabe dentro del rectángulo
      $[0;2{,}83]\times[-2,2]$, de área $11{,}3$, y contiene el triángulo de
      vértices $(0,0)$, $(2,2)$, $(2,-2)$, de área 4:

      $$
      4 < 7{,}62 < 11{,}3 \quad\checkmark
      $$

      **Del área, por geometría pura.** La recta vertical $x=2$ pasa por los dos
      puntos de corte y parte $D$ en dos trozos que se calculan por separado:

      **Trozo izquierdo** ($0\le x\le2$), limitado solo por la parábola, con
      $\left|y\right|\le\sqrt{2x}$:

      $$
      \int_0^{2}2\sqrt{2x}\,dx
      = 2\sqrt2\left[\frac{2}{3}x^{3/2}\right]_0^{2}
      = 2\sqrt2\cdot\frac{2}{3}\cdot2\sqrt2 = \frac{16}{3}
      $$

      **Trozo derecho** ($2\le x\le2\sqrt2$): es el **segmento circular** que
      deja la cuerda $x=2$. Vale el sector de $-45°$ a $45°$ menos el
      triángulo de vértices $(0,0)$, $(2,2)$ y $(2,-2)$:

      $$
      \underbrace{\frac{90}{360}\cdot\pi\cdot8}_{2\pi}
      -\underbrace{\frac{4\cdot2}{2}}_{4} = 2\pi-4
      $$

      **Sumando:**

      $$
      \frac{16}{3}+2\pi-4 = 2\pi+\frac43 \quad\checkmark
      $$

      Coincide con la integral, y sin usar el $\arcsin$: es una comprobación
      completamente independiente.

      **Del volumen, por acotación.** El sólido cabe dentro del cilindro de
      radio $2\sqrt2$ y altura 4:

      $$
      \pi\cdot8\cdot4 = 32\pi \approx 100{,}5
      $$

      y $73{,}7 < 100{,}5$ ✔ Ocupa el 73 % del cilindro, coherente con que el
      hueco central sea estrecho.

  - id: ex2425-3ev-5-triangulo-de-area-minima
    titulo: El triángulo más pequeño que se apoya en un punto
    fuente: >-
      Ejercicio 5 · Tercera evaluación, 21 de enero de 2025 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    nivel: examen
    enunciado: |
      Consideremos una recta que pasa por el punto $(1,2)$. Sabiendo que dicha
      recta corta a los ejes OX y OY en los puntos $(a,0)$ y $(0,b)$
      $\left(\text{con } a,b>0\right)$, calcular los valores de $a$ y $b$ para
      que el triángulo que forman la recta y los ejes coordenados tenga área
      mínima.
    pide: Calcular $a$ y $b$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué estructura tiene el problema?
        opciones:
          - texto: >-
              Optimización **con una ligadura**: minimizar $\frac{ab}{2}$ sujeto
              a que la recta pase por $(1,2)$
            correcta: true
            mensaje: |
              Exacto. Hay dos incógnitas y una condición, así que queda un grado
              de libertad: se despeja una de la ligadura y se minimiza en la
              otra.
          - texto: >-
              Minimizar $\frac{ab}{2}$ sin más condiciones
            mensaje: |
              Sin condición no hay mínimo: acercando $a$ a cero el área se hace
              tan pequeña como se quiera. Es el paso por $(1,2)$ lo que impide
              encogerlo.
          - texto: >-
              Calcular la recta tangente en $(1,2)$
            mensaje: |
              No hay ninguna curva a la que ser tangente: la recta simplemente
              **pasa** por ese punto.
          - texto: >-
              Un problema de distancia mínima al origen
            mensaje: |
              Lo que se minimiza es un **área**, no una distancia. El resultado
              no es el mismo.

      - tipo: calcular
        titulo: El corte con el eje horizontal
        pregunta: |
          ¿Cuánto vale $a$ en el óptimo?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es la abscisa del punto dado. El óptimo está en $a=2$: **el
              doble**, y no por casualidad.
          - valor: '4'
            mensaje: |
              4 es el valor de $b$, no de $a$. Es fácil cruzarlos.
          - valor: '3'
            mensaje: |
              3 saldría de $1+2$. La relación no es una suma.
        pista: |
          De $\frac1a+\frac2b = 1$ despeja $b$ y minimiza $A(a) = \frac{ab}{2}$.
        desarrollo: |
          Ecuación segmentaria de la recta:

          $$
          \frac{x}{a}+\frac{y}{b} = 1
          $$

          Pasa por $(1,2)$:

          $$
          \frac1a+\frac2b = 1
          \;\Longrightarrow\;
          \frac2b = \frac{a-1}{a}
          \;\Longrightarrow\;
          b = \frac{2a}{a-1}
          $$

          —con $a>1$, porque si no $b$ sería negativo—.

          $$
          A(a) = \frac{ab}{2} = \frac{a^{2}}{a-1}
          $$

          $$
          A'(a) = \frac{2a(a-1)-a^{2}}{(a-1)^{2}}
          = \frac{a^{2}-2a}{(a-1)^{2}} = \frac{a(a-2)}{(a-1)^{2}}
          $$

          Se anula en $a=2$ (el $a=0$ está fuera del dominio $a>1$).
        veredicto: |
          El punto óptimo es $(2,0)$ y $(0,4)$: **el doble** de las coordenadas
          del punto dado en cada eje. Es una propiedad general de este problema.

      - tipo: calcular
        titulo: El área mínima
        pregunta: |
          ¿Cuánto vale el área mínima?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '8'
            mensaje: |
              8 es $ab = 2\cdot4$. El área del triángulo es la **mitad** del
              producto de los catetos.
          - valor: '2'
            mensaje: |
              2 es el valor de $a$, o la ordenada del punto dado. El área es 4.
          - valor: '4.5'
            mensaje: |
              $4{,}5$ saldría de $a=3$, que no es el óptimo: ahí el área ya
              empieza a crecer.
        pista: |
          $A = \frac{ab}{2}$ con $a=2$ y $b=4$.
        desarrollo: |
          $$
          a = 2
          \;\Longrightarrow\;
          b = \frac{2\cdot2}{2-1} = 4
          $$

          $$
          A = \frac{ab}{2} = \frac{2\cdot4}{2} = 4
          $$

          La recta es

          $$
          \frac x2+\frac y4 = 1
          \;\Longrightarrow\;
          y = 4-2x
          $$
        veredicto: |
          Que la recta óptima sea $y = 4-2x$ y pase por $(1,2)$ se comprueba en
          un segundo: $4-2 = 2$ ✔

      - tipo: justificar
        pregunta: |
          Ordena la justificación de que es un mínimo. Una de las piezas no
          debe entrar.
        piezas:
          - texto: |
              **El dominio.** Hace falta $a>1$: con $a\le1$ la recta que pasa
              por $(1,2)$ no puede cortar el eje $OY$ en un $b>0$.
          - texto: |
              **El signo de $A'$.** El denominador $(a-1)^{2}$ es positivo, así
              que el signo lo pone $a(a-2)$, y con $a>1$ lo pone $a-2$.
          - texto: |
              Luego $A' < 0$ en $(1,2)$ y $A' > 0$ en $(2,\infty)$: la función
              **baja y luego sube**, y $a=2$ es un mínimo.
          - texto: |
              **Es mínimo absoluto**, porque $A$ es continua en $(1,\infty)$,
              solo tiene ese punto crítico, y tiende a $+\infty$ en los dos
              extremos del intervalo.
          - texto: |
              Los límites lo confirman: $A(a)\to+\infty$ cuando $a\to1^{+}$
              —la recta se vuelve casi vertical— y cuando $a\to\infty$ —casi
              horizontal—.
          - texto: |
              Basta con comprobar que $A''(2)>0$ para saber que es mínimo
              absoluto.
            trampa: true
            mensaje: |
              La segunda derivada da el carácter **local**, no el absoluto. Para
              el absoluto hace falta el argumento del intervalo: un solo punto
              crítico y la función tendiendo a infinito en ambos extremos. Aquí
              el enunciado pide el mínimo a secas, y en un intervalo abierto eso
              hay que argumentarlo — es donde se juegan los dos puntos de COMP4.
        veredicto: |
          En un intervalo **abierto** no basta comparar con los extremos: hay
          que mirar los límites. Ese es el matiz que distingue este problema de
          uno en intervalo cerrado.

    resolucion: |
      **Datos.** Una recta por $(1,2)$ que corta a los ejes en $(a,0)$ y
      $(0,b)$, con $a,b>0$.

      ### 1 · Plantear

      **La función a minimizar** es el área del triángulo rectángulo de catetos
      $a$ y $b$:

      $$
      A = \frac{ab}{2}
      $$

      **La ligadura** es que la recta pase por $(1,2)$. Con la ecuación
      segmentaria —la que usa directamente los cortes con los ejes—:

      $$
      \frac{x}{a}+\frac{y}{b} = 1
      \;\Longrightarrow\;
      \frac1a+\frac2b = 1
      $$

      Sin esa ligadura no habría mínimo: acercando $a$ a cero el área se hace
      tan pequeña como se quiera.

      ### 2 · Reducir a una variable

      $$
      \frac2b = 1-\frac1a = \frac{a-1}{a}
      \;\Longrightarrow\;
      b = \frac{2a}{a-1}
      $$

      **El dominio:** para que $b>0$ hace falta $a>1$. Tiene sentido
      geométrico — la recta debe cortar el eje $OX$ a la derecha del punto
      $(1,2)$, o no podrá bajar hasta él con pendiente negativa.

      $$
      A(a) = \frac{a}{2}\cdot\frac{2a}{a-1} = \frac{a^{2}}{a-1},
      \qquad a \in (1,\infty)
      $$

      ### 3 · Derivar

      $$
      A'(a) = \frac{2a(a-1)-a^{2}\cdot1}{(a-1)^{2}}
      = \frac{2a^{2}-2a-a^{2}}{(a-1)^{2}}
      = \frac{a^{2}-2a}{(a-1)^{2}} = \frac{a(a-2)}{(a-1)^{2}}
      $$

      $$
      A'(a) = 0
      \;\Longrightarrow\;
      a = 0 \ \text{(fuera del dominio)}
      \quad\text{o}\quad
      a = 2
      $$

      ### 4 · Justificar que es el mínimo absoluto

      El denominador $(a-1)^{2}>0$ siempre, y en el dominio $a>0$, así que el
      signo de $A'$ es el de $a-2$:

      | intervalo | $A'$ | $A$ |
      |---|---|---|
      | $(1,2)$ | $<0$ | decrece |
      | $(2,\infty)$ | $>0$ | crece |

      Baja y luego sube: **$a=2$ es un mínimo**.

      Y es **absoluto** porque el intervalo es abierto y

      $$
      \lim_{a\to1^{+}}\frac{a^{2}}{a-1} = +\infty,
      \qquad
      \lim_{a\to\infty}\frac{a^{2}}{a-1} = +\infty
      $$

      Con un único punto crítico y la función disparándose en los dos extremos,
      no hay dónde esconder un valor menor.

      **Este es el argumento que puntúa.** Comprobar solo $A''(2)>0$ demuestra
      que es mínimo **local**, y el enunciado pide el mínimo a secas.

      ### 5 · El resultado

      $$
      a = 2
      \;\Longrightarrow\;
      b = \frac{2\cdot2}{2-1} = 4
      $$

      $$
      \boxed{a = 2, \qquad b = 4, \qquad A_{\min} = \frac{2\cdot4}{2} = 4}
      $$

      La recta óptima:

      $$
      \frac x2+\frac y4 = 1
      \;\Longleftrightarrow\;
      y = 4-2x
      $$

      ### 6 · La propiedad que se ve al final

      $$
      a = 2\cdot1, \qquad b = 2\cdot2
      $$

      **Los cortes óptimos son el doble de las coordenadas del punto.** No es
      casualidad: rehaciendo el problema con un punto genérico $(p,q)$ sale
      $a = 2p$ y $b = 2q$, y el área mínima $2pq$.

      Equivale a decir que **el punto dado es el punto medio del segmento** que
      la recta determina entre los ejes. Ese es el enunciado geométrico del
      resultado, y conviene darlo: es exactamente el tipo de observación que
      pide COMP4.

      ### 7 · Comprobación

      **Que la recta pasa por el punto.** $y = 4-2\cdot1 = 2$ ✔

      **Que el punto es el punto medio.** El segmento va de $(2,0)$ a $(0,4)$, y
      su punto medio es $\left(\frac{2+0}{2},\frac{0+4}{2}\right) = (1,2)$ ✔

      **Probando valores alrededor:**

      | $a$ | $b = \frac{2a}{a-1}$ | $A = \frac{ab}{2}$ |
      |---|---|---|
      | $1{,}5$ | $6$ | $4{,}5$ |
      | $2$ | $4$ | $\mathbf{4}$ |
      | $3$ | $3$ | $4{,}5$ |
      | $5$ | $2{,}5$ | $6{,}25$ |

      El 4 es el menor ✔ Y curiosamente $a=1{,}5$ y $a=3$ dan lo mismo, como
      corresponde a una curva con un mínimo suave.

      **Por la desigualdad de las medias**, sin derivar. De
      $\frac1a+\frac2b = 1$ y AM–GM:

      $$
      1 = \frac1a+\frac2b \ge 2\sqrt{\frac{2}{ab}}
      \;\Longrightarrow\;
      1 \ge \frac{8}{ab}
      \;\Longrightarrow\;
      ab \ge 8
      \;\Longrightarrow\;
      A \ge 4
      $$

      con igualdad cuando $\frac1a = \frac2b$, es decir $b=2a$, que junto a la
      ligadura da $a=2$, $b=4$ ✔ Una demostración completamente independiente
      del cálculo diferencial.

  - id: ex2425-3ev-6-area-de-revolucion
    titulo: Cómo crece el área de una superficie de revolución
    fuente: >-
      Ejercicio 6 · Tercera evaluación, 21 de enero de 2025 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 4
      comp4: 5

    nivel: examen
    enunciado: |
      El área $A$ del sólido que se obtiene al girar alrededor del eje OX la
      gráfica de una función $f(x)$ definida en $[a,b]$ y derivable en $(a,b)$
      se calcula del siguiente modo:

      $$
      A = 2\pi\int_a^{b}f(x)\sqrt{1+\left(f'(x)\right)^{2}}\;dx
      $$

      Considerar la función $f(x)$ continua en $[a,b]$ y dos veces derivable en
      $(a,b)$ cuya gráfica se muestra en la figura. Tomamos un punto cualquiera
      $u \in (a,b)$ y consideremos el área $A(u)$ del sólido que se obtiene al
      girar alrededor del eje OX el tramo de la gráfica de $f(x)$
      correspondiente al intervalo $[a,u]$. Para la función de la figura se
      pide:

      **a)** Estudiar el crecimiento/decrecimiento y los extremos locales de
      $A(u)$.

      **b)** Estudiar la concavidad/convexidad y los puntos de inflexión de
      $A(u)$.

      **c)** Trazar una posible gráfica de $A(u)$.

      <figure class="figura-examen">
      <svg viewBox="0 0 460 320" role="img" width="440" height="306"
           aria-labelledby="f2425c6t f2425c6d">
        <title id="f2425c6t">La grafica de f</title>
        <desc id="f2425c6d">Una curva positiva con forma de valle: entra alta
        por la izquierda en el punto a, baja hasta un minimo hacia la mitad del
        intervalo y vuelve a subir hasta el punto b, sin llegar a tocar nunca el
        eje horizontal.</desc>

        <g stroke="var(--rule)" stroke-width="1.2" stroke-dasharray="4 5"
           fill="none">
          <path d="M100 70 L100 250 M380 118 L380 250"></path>
        </g>

        <g stroke="var(--graphite)" stroke-width="1.3" fill="none">
          <path d="M50 250 L430 250 M70 40 L70 280"></path>
        </g>

        <g stroke="var(--ink)" stroke-width="3" fill="none"
           stroke-linecap="round">
          <path d="M100 70 C 150 160, 190 208, 240 208
                   C 300 208, 340 170, 380 118"></path>
        </g>

        <g stroke="var(--graphite)" stroke-width="1" fill="none">
          <path d="M100 245 L100 255 M380 245 L380 255
                   M240 245 L240 255"></path>
        </g>

        <g fill="var(--graphite)" font-size="14" font-family="var(--mono)">
          <text x="94" y="272">a</text>
          <text x="374" y="272">b</text>
          <text x="232" y="272">c</text>
          <text x="414" y="242">x</text>
          <text x="78" y="52">y</text>
        </g>
        <g fill="var(--ink)" font-size="14" font-family="var(--mono)">
          <text x="146" y="112">f(x)</text>
        </g>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original. La funcion es positiva en todo
      el intervalo y tiene forma de valle: decrece hasta un minimo en c y
      despues crece. Hemos etiquetado ese minimo como c, que el original no
      nombra.
      </figcaption>
      </figure>
    pide: Estudiar $A(u)$ y trazar su gráfica.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué teorema hay que citar para derivar $A(u)$?
        opciones:
          - texto: >-
              El **teorema fundamental del cálculo**: la derivada de la integral
              respecto del extremo superior es el integrando evaluado ahí
            correcta: true
            mensaje: |
              Exacto, y su hipótesis es que el integrando sea **continuo**. Lo es:
              $f$ es continua y $f'$ existe y es continua porque $f$ es dos veces
              derivable. Declararlo es parte de la nota.
          - texto: >-
              La regla de Barrow
            mensaje: |
              Barrow evalúa una integral definida conocida una primitiva. Aquí no
              hay primitiva explícita: lo que hace falta es derivar respecto del
              límite.
          - texto: >-
              El teorema del valor medio integral
            mensaje: |
              Da la existencia de un punto intermedio, no la derivada de la
              función integral.
          - texto: >-
              La regla de la cadena
            mensaje: |
              Haría falta si el extremo superior fuera una función de $u$, como
              $u^{2}$. Aquí es $u$ a secas.

      - tipo: calcular
        titulo: El signo de la derivada
        pregunta: |
          ¿En cuántos puntos del interior se anula $A'(u)$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 sería si $A'$ se anulara en el mínimo de $f$. Pero
              $A'(u) = 2\pi f(u)\sqrt{1+f'(u)^{2}}$, y ahí $f$ **no** vale cero:
              la gráfica no toca el eje.
          - valor: '2'
            mensaje: |
              2 confundiría los extremos de $A$ con los de $f$. No hay ninguno.
          - valor: '3'
            mensaje: |
              No hay tres puntos notables en esta figura.
        pista: |
          $A'(u) = 2\pi f(u)\sqrt{1+f'(u)^{2}}$. ¿Puede anularse alguno de los
          tres factores?
        desarrollo: |
          Por el teorema fundamental:

          $$
          A'(u) = 2\pi f(u)\sqrt{1+\left(f'(u)\right)^{2}}
          $$

          Tres factores, y ninguno puede anularse:

          | factor | signo | por qué |
          |---|---|---|
          | $2\pi$ | $>0$ | constante |
          | $f(u)$ | $>0$ | la gráfica está **por encima** del eje |
          | $\sqrt{1+f'^{2}}$ | $\ge1$ | un radicando siempre $\ge1$ |

          $$
          A'(u) > 0 \quad\text{para todo } u \in (a,b)
          $$

          $$
          \boxed{A \text{ es ESTRICTAMENTE CRECIENTE, sin extremos locales}}
          $$
        veredicto: |
          Tiene sentido físico: al alargar el tramo que gira, la superficie solo
          puede aumentar. El área acumulada nunca baja.

      - tipo: justificar
        pregunta: |
          Ordena el estudio de la concavidad. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Derivar otra vez**, con la regla del producto:
              $A'' = 2\pi\left[f'\sqrt{1+f'^{2}}
              +f\cdot\frac{f'f''}{\sqrt{1+f'^{2}}}\right]$.
          - texto: |
              **Sacar $f'$ factor común:**
              $A'' = \frac{2\pi f'}{\sqrt{1+f'^{2}}}
              \left[\left(1+f'^{2}\right)+f\,f''\right]$.
          - texto: |
              **El corchete es positivo:** $1+f'^{2}>0$ siempre, $f>0$ por la
              figura, y $f''>0$ porque la curva es **convexa** en todo el
              intervalo.
          - texto: |
              Luego el signo de $A''$ es **el de $f'$**: negativo antes del
              mínimo de $f$ y positivo después.
          - texto: |
              $A$ es **cóncava** en $(a,c)$, **convexa** en $(c,b)$, y tiene un
              **punto de inflexión en $c$**, el mínimo de $f$.
          - texto: |
              El signo de $A''$ coincide con el de $f''$, porque $A$ acumula lo
              que hace $f$.
            trampa: true
            mensaje: |
              Al revés: $A'$ es proporcional a $f$, así que $A''$ va con $f'$, no
              con $f''$. Cada integración **desplaza un orden**: los ceros de $f$
              darían extremos de $A$, y los extremos de $f$ dan inflexiones de
              $A$. Aquí $f''>0$ en todo el intervalo y sin embargo $A$ cambia de
              concavidad — la prueba de que no van juntos.
        veredicto: |
          El papel de $f''$ aquí es solo garantizar que el corchete sea positivo.
          Quien decide la concavidad de $A$ es $f'$.

    resolucion: |
      **Datos.** $A(u) = 2\pi\int_a^{u}f(x)\sqrt{1+\left(f'(x)\right)^{2}}dx$,
      con $f$ la del dibujo: **positiva** en todo $[a,b]$ y con forma de valle,
      decreciente hasta un mínimo en $c$ y creciente después.

      ### 1 · Lo que se lee en la figura

      Antes de derivar nada conviene dejar escritas las tres cosas que la
      gráfica dice, porque son las hipótesis de todo lo demás:

      | lectura | consecuencia |
      |---|---|
      | $f(x)>0$ en todo $[a,b]$ — la curva no toca el eje | $A'$ no se anula |
      | $f'<0$ en $(a,c)$, $f'>0$ en $(c,b)$, $f'(c)=0$ | decide la concavidad de $A$ |
      | la curva es **convexa**: $f''>0$ | hace positivo el corchete de $A''$ |

      ### 2 · Apartado (a): crecimiento

      El integrando $f(x)\sqrt{1+f'(x)^{2}}$ es **continuo** —$f$ lo es y $f'$
      también, porque $f$ es dos veces derivable—, así que el **teorema
      fundamental del cálculo** se aplica:

      $$
      A'(u) = 2\pi f(u)\sqrt{1+\left(f'(u)\right)^{2}}
      $$

      Los tres factores son positivos:

      $$
      2\pi>0,
      \qquad
      f(u)>0 \ \text{(por la figura)},
      \qquad
      \sqrt{1+f'(u)^{2}}\ge1>0
      $$

      $$
      \boxed{A'(u)>0 \ \text{en todo } (a,b)}
      $$

      **$A$ es estrictamente creciente y no tiene ningún extremo local.** Sus
      valores extremos están en la frontera: el mínimo en $u=a$, donde
      $A(a) = 0$, y el máximo en $u=b$.

      Y tiene sentido: $A(u)$ es un área acumulada, y añadir tramo solo puede
      sumar superficie.

      **Ojo al error natural:** el mínimo de $f$ **no** es un extremo de $A$.
      Ahí $A$ sigue creciendo, solo que más despacio.

      ### 3 · Apartado (b): concavidad

      Derivando $A'$ con la regla del producto:

      $$
      A''(u) = 2\pi\left[f'\sqrt{1+f'^{2}}
      +f\cdot\frac{2f'f''}{2\sqrt{1+f'^{2}}}\right]
      $$

      Sacando $\frac{f'}{\sqrt{1+f'^{2}}}$ factor común:

      $$
      A''(u) = \frac{2\pi\,f'(u)}{\sqrt{1+f'(u)^{2}}}
      \left[\left(1+f'(u)^{2}\right)+f(u)\,f''(u)\right]
      $$

      **El corchete es positivo**, con los tres datos de la figura:

      $$
      \underbrace{1+f'^{2}}_{>0}
      +\underbrace{f}_{>0}\cdot\underbrace{f''}_{>0} \;>\; 0
      $$

      Y el factor de delante tiene el signo de $f'$. Por tanto:

      | tramo | $f'$ | $A''$ | $A$ |
      |---|---|---|---|
      | $(a,c)$ | $<0$ | $<0$ | **cóncava** |
      | $(c,b)$ | $>0$ | $>0$ | **convexa** |

      $$
      \boxed{A \text{ tiene un punto de inflexión en } c,
      \text{ el mínimo de } f}
      $$

      ### 4 · El desplazamiento de un orden

      Es la idea que el ejercicio quiere ver escrita. Como $A'$ es
      **proporcional a $f$** —salvo el factor de la raíz, que nunca cambia de
      signo—, todo se corre un escalón:

      | en $f$ | en $A$ |
      |---|---|
      | ceros de $f$ | extremos de $A$ |
      | extremos de $f$ | inflexiones de $A$ |
      | inflexiones de $f$ | — |

      Aquí $f$ no tiene ceros, y por eso $A$ no tiene extremos. Y $f$ tiene un
      extremo en $c$, y por eso $A$ tiene ahí su inflexión.

      La convexidad de $f$ —$f''>0$— **no** se transmite a $A$: solo sirve para
      asegurar el signo del corchete.

      ### 5 · Apartado (c): la gráfica

