      Los rasgos que la gráfica **debe** tener, y que son los que puntúan:

      1. $A(a) = 0$ — el intervalo $[a,a]$ no genera superficie.
      2. **Creciente en todo el intervalo**, sin ningún máximo ni mínimo
         interior.
      3. **Cóncava** hasta $c$: crece con pendiente cada vez menor.
      4. **Convexa** desde $c$: la pendiente vuelve a aumentar.
      5. **Un solo punto de inflexión**, en $c$.

      El resultado es una curva en forma de ese tumbada.

      ### 6 · Comprobación

      **Con un caso concreto que reproduce la figura.** Tomando
      $f(x) = 1+x^{2}$ en $[-1,1]$ —positiva, convexa, con mínimo en $c=0$—:

      $$
      A'(u) = 2\pi\left(1+u^{2}\right)\sqrt{1+4u^{2}}
      $$

      que es positivo para todo $u$ ✔ Y

      $$
      A''(u) = \frac{2\pi\cdot2u}{\sqrt{1+4u^{2}}}
      \left[\left(1+4u^{2}\right)+\left(1+u^{2}\right)\cdot2\right]
      $$

      El corchete vale $3+6u^{2}>0$, y el factor de delante tiene el signo de
      $u$: negativo antes de 0, positivo después ✔ Inflexión en $u=0$, que es
      el mínimo de $f$ ✔

      **Un contraejemplo que aclara el papel de $f''$.** Con
      $f(x) = 2-x^{2}$ en $[-1,1]$ —positiva pero **cóncava**—, el corchete es

      $$
      \left(1+4x^{2}\right)+\left(2-x^{2}\right)(-2) = 8x^{2}-3
      $$

      que **cambia de signo** en $x = \pm\sqrt{3/8}$. Con esa $f$, $A$ tendría
      hasta tres inflexiones. Es la prueba de que la convexidad de la figura no
      es un adorno: sin ella el apartado (b) no se resuelve con este argumento ✔

      **Del sentido físico.** $A(b)$ es el área total de la superficie de
      revolución, y $A(u)$ va acumulándola de izquierda a derecha. Una función
      que acumula algo positivo no puede decrecer nunca ✔
