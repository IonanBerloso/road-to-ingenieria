ejercicios:
  - id: ex2122-2ev-1-tangente-de-pendiente-dada
    titulo: Dónde una curva implícita tiene la pendiente pedida
    fuente: >-
      Ejercicio 1 · Segunda evaluación, 29 de noviembre de 2021 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 8
      comp4: 1

    enunciado: |
      Calcular los puntos en los cuales la recta tangente a la curva
      $x^{2}-xy+y^{2} = 3$ tiene pendiente $-1$.
    pide: Calcular los puntos de tangente con pendiente $-1$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántas ecuaciones hay que resolver a la vez?
        opciones:
          - texto: >-
              **Dos**: la condición sobre la pendiente y la propia ecuación de
              la curva
            correcta: true
            mensaje: |
              Exacto. Imponer $y'=-1$ da una relación entre $x$ e $y$, pero eso
              solo dice **en qué dirección** buscar. Los puntos concretos salen
              de cruzar esa relación con la curva. Olvidar la segunda es dejar
              el ejercicio a medias.
          - texto: >-
              Una: basta con imponer $y' = -1$
            mensaje: |
              Eso da una recta entera de candidatos, no puntos. Hay que
              intersecarla con la curva.
          - texto: >-
              Tres, contando la ecuación de la recta tangente
            mensaje: |
              La recta tangente no hace falta: el enunciado pide los **puntos**,
              no las rectas.
          - texto: >-
              Ninguna: se despeja $y$ y se deriva
            mensaje: |
              $x^{2}-xy+y^{2}=3$ es cuadrática en $y$ y se podría despejar, pero
              saldrían dos ramas con raíces. La derivación implícita evita todo
              eso.

      - tipo: calcular
        titulo: La condición sobre los puntos
        pregunta: |
          Al imponer $y'=-1$ sale una relación entre $x$ e $y$. Si $x=5$,
          ¿cuánto vale $y$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '-5'
            mensaje: |
              La relación es $y=x$, no $y=-x$. Al despejar,
              $y-2x = -2y+x$ da $3y = 3x$.
          - valor: '2.5'
            mensaje: |
              $\frac x2$ saldría de $2y=x$. Revisa el paso de agrupar: los
              términos en $y$ suman $3y$.
          - valor: '10'
            mensaje: |
              $2x$ saldría de $y=2x$. El coeficiente correcto es 1.
        pista: |
          Deriva implícitamente y sustituye $y'=-1$.
        desarrollo: |
          Derivando $x^{2}-xy+y^{2}=3$ respecto de $x$:

          $$
          2x-y-xy'+2yy' = 0
          $$

          Agrupando:

          $$
          y'\left(2y-x\right) = y-2x
          \;\Longrightarrow\;
          y' = \frac{y-2x}{2y-x}
          $$

          Imponiendo $y'=-1$:

          $$
          \frac{y-2x}{2y-x} = -1
          \;\Longrightarrow\;
          y-2x = -2y+x
          $$

          $$
          3y = 3x \;\Longrightarrow\; y = x
          $$

          Así que si $x=5$, entonces $y=5$.
        veredicto: |
          $y=x$ es la **bisectriz**. Todos los puntos de la curva con tangente
          de pendiente $-1$ están sobre ella — pero todavía hay que ver
          **cuáles** de ellos están en la curva.

      - tipo: calcular
        titulo: Los puntos
        pregunta: |
          ¿Cuál es la abscisa positiva de los dos puntos? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '1.7321'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              3 es el término independiente de la curva. Al sustituir $y=x$
              queda $x^{2}=3$, así que hay que sacar la raíz.
          - valor: '1.2247'
            mensaje: |
              $\sqrt{3/2}$ saldría de $2x^{2}=3$. Pero
              $x^{2}-x^{2}+x^{2} = x^{2}$: los términos centrales se cancelan y
              queda un solo $x^{2}$.
          - valor: '1'
            mensaje: |
              1 saldría de $3x^{2}=3$. Al sustituir $y=x$ los tres términos no
              se suman: el del medio **resta**.
        pista: |
          Sustituye $y=x$ en $x^{2}-xy+y^{2}=3$.
        desarrollo: |
          $$
          x^{2}-x\cdot x+x^{2} = 3
          \;\Longrightarrow\;
          x^{2}-x^{2}+x^{2} = 3
          \;\Longrightarrow\;
          x^{2} = 3
          $$

          $$
          x = \pm\sqrt3
          $$

          Y como $y=x$, los puntos son

          $$
          \left(\sqrt3,\sqrt3\right)
          \qquad\text{y}\qquad
          \left(-\sqrt3,-\sqrt3\right)
          $$

          con $\sqrt3 \approx 1{,}7321$.
        veredicto: |
          Que el término $-xy$ cancele uno de los cuadrados es lo que deja la
          ecuación tan limpia. Es la razón de que el enunciado use el 3.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Derivación implícita**, tratando $y$ como función de $x$:
              $2x-y-xy'+2yy' = 0$.
          - texto: |
              **Despejar la pendiente:**
              $y' = \dfrac{y-2x}{2y-x}$, válido donde $2y-x\neq0$.
          - texto: |
              **Imponer $y'=-1$:** $y-2x = -2y+x$, que se simplifica a $y=x$.
          - texto: |
              **Cruzar con la curva.** Sustituyendo $y=x$ en
              $x^{2}-xy+y^{2}=3$ queda $x^{2}=3$.
          - texto: |
              Los puntos son $\left(\sqrt3,\sqrt3\right)$ y
              $\left(-\sqrt3,-\sqrt3\right)$, y en los dos el denominador
              $2y-x = \pm\sqrt3 \neq 0$: la derivada existe ahí.
          - texto: |
              Como la curva es simétrica respecto del origen, basta calcular un
              punto y cambiarle el signo.
            trampa: true
            mensaje: |
              La simetría es cierta —la ecuación no cambia al sustituir
              $(x,y)$ por $(-x,-y)$— y **explica** que los puntos vengan por
              parejas. Pero no ahorra el cálculo: hay que resolver $x^{2}=3$
              igualmente, y esa ecuación ya da las dos raíces de golpe. Invocar
              la simetría en lugar de resolver no es un atajo, es saltarse el
              paso.
        veredicto: |
          Comprobar que el denominador no se anula en los puntos hallados es el
          único punto de COMP4 del ejercicio. Es corto y se olvida.

    resolucion: |
      **Datos.** La curva $x^{2}-xy+y^{2}=3$, y la pendiente $-1$.

      ### 1 · Por qué implícita

      La ecuación es cuadrática en $y$: se **podría** despejar, pero saldrían
      dos ramas con raíces cuadradas y derivarlas sería incómodo. La derivación
      implícita da la pendiente sin despejar nada.

      ### 2 · La derivada

      Derivando los dos lados respecto de $x$, con $y=y(x)$:

      $$
      2x-\left(y+xy'\right)+2yy' = 0
      $$

      —el término $-xy$ es un producto, así que necesita la regla del
      producto—. Agrupando:

      $$
      y'\left(2y-x\right) = y-2x
      \;\Longrightarrow\;
      y' = \frac{y-2x}{2y-x}
      $$

      válido donde $2y-x \neq 0$.

      ### 3 · Imponer la pendiente

      $$
      \frac{y-2x}{2y-x} = -1
      \;\Longrightarrow\;
      y-2x = -\left(2y-x\right) = -2y+x
      $$

      $$
      y+2y = x+2x
      \;\Longrightarrow\;
      3y = 3x
      \;\Longrightarrow\;
      y = x
      $$

      **Esto todavía no son los puntos**: es la recta donde hay que buscarlos.
      La bisectriz del primer y tercer cuadrante.

      ### 4 · Cruzar con la curva

      $$
      x^{2}-x\cdot x+x^{2} = 3
      $$

      El término central **cancela** uno de los cuadrados:

      $$
      x^{2} = 3
      \;\Longrightarrow\;
      x = \pm\sqrt3
      $$

      $$
      \boxed{P_1 = \left(\sqrt3,\ \sqrt3\right),
      \qquad
      P_2 = \left(-\sqrt3,\ -\sqrt3\right)}
      $$

      ### 5 · Comprobar que la derivada existe ahí

      El denominador $2y-x$ en los dos puntos:

      $$
      2\sqrt3-\sqrt3 = \sqrt3 \neq 0,
      \qquad
      -2\sqrt3+\sqrt3 = -\sqrt3 \neq 0
      $$

      Los dos válidos. Es un paso corto y es el único punto de COMP4 del
      ejercicio.

      ### 6 · Comprobación

      **Que los puntos están en la curva:**

      $$
      3-3+3 = 3 \quad\checkmark
      $$

      **Que la pendiente es la pedida**, sustituyendo en la fórmula:

      $$
      y'\left(\sqrt3,\sqrt3\right)
      = \frac{\sqrt3-2\sqrt3}{2\sqrt3-\sqrt3}
      = \frac{-\sqrt3}{\sqrt3} = -1 \quad\checkmark
      $$

      $$
      y'\left(-\sqrt3,-\sqrt3\right)
      = \frac{-\sqrt3+2\sqrt3}{-2\sqrt3+\sqrt3}
      = \frac{\sqrt3}{-\sqrt3} = -1 \quad\checkmark
      $$

      ### 7 · Qué curva es, de paso

      $x^{2}-xy+y^{2}=3$ es una **elipse girada 45°**. Su eje mayor está sobre
      la recta $y=-x$ y el menor sobre $y=x$.

      Los dos puntos hallados son precisamente los extremos del **eje menor**, y
      por eso la tangente ahí es perpendicular a él, es decir paralela a $y=-x$:
      pendiente $-1$ ✔ La simetría respecto del origen explica que vengan por
      parejas.

  - id: ex2122-2ev-2-lagrange-tres-casos
    titulo: Construir los tres casos posibles de Lagrange
    fuente: >-
      Ejercicio 2 · Segunda evaluación, 29 de noviembre de 2021 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 2
      comp4: 7

    enunciado: |
      Sea $y(x)$ una función definida en el intervalo $[-4,6]$. En la figura se
      muestra la gráfica de $y(x)$ solo en el intervalo $[-4,0]$, donde su
      expresión analítica es $y(x) = x^{2}-4$.

      <figure class="figura-examen">
      <svg viewBox="0 0 700 420" role="img" width="680" height="408"
           aria-labelledby="f2122b2t f2122b2d">
        <title id="f2122b2t">La parabola en el tramo conocido</title>
        <desc id="f2122b2d">La parabola x cuadrado menos cuatro dibujada solo
        entre x igual a menos cuatro, donde vale doce, y x igual a cero, donde
        vale menos cuatro. A la derecha del origen el tramo esta en blanco.</desc>

        <g stroke="var(--rule)" stroke-width="1" fill="none">
          <path d="M60 40 L60 360 M124 40 L124 360 M188 40 L188 360
                   M252 40 L252 360 M316 40 L316 360 M380 40 L380 360
                   M444 40 L444 360 M508 40 L508 360 M572 40 L572 360
                   M636 40 L636 360
                   M60 40 L636 40 M60 104 L636 104 M60 168 L636 168
                   M60 232 L636 232 M60 296 L636 296 M60 360 L636 360"></path>
        </g>

        <g stroke="var(--graphite)" stroke-width="1.4" fill="none">
          <path d="M40 296 L660 296 M316 30 L316 375"></path>
        </g>

        <g stroke="var(--ink)" stroke-width="2.8" fill="none"
           stroke-linecap="round">
          <path d="M60 104 C 90 150, 120 200, 156 234
                   C 200 274, 260 296, 316 360"></path>
        </g>

        <g stroke="var(--faint)" stroke-width="2" stroke-dasharray="5 7"
           fill="none">
          <path d="M316 360 L636 360"></path>
        </g>

        <g fill="var(--graphite)" font-size="13" font-family="var(--mono)">
          <text x="30" y="45">20</text>
          <text x="30" y="109">16</text>
          <text x="30" y="173">12</text>
          <text x="36" y="237">8</text>
          <text x="36" y="301">4</text>
          <text x="36" y="365">0</text>
          <text x="52" y="392">-4</text>
          <text x="180" y="392">-2</text>
          <text x="312" y="392">0</text>
          <text x="440" y="392">2</text>
          <text x="504" y="392">4</text>
          <text x="632" y="392">6</text>
        </g>

        <g fill="var(--faint)" font-size="13" font-family="var(--mono)">
          <text x="430" y="340">¿?</text>
        </g>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original. A la derecha del origen no hay
      curva: esa es la parte que hay que construir, y de tres maneras
      distintas.
      </figcaption>
      </figure>

      **a)** Enunciar el teorema de Lagrange (Teorema del valor medio).

      **b)** Calcular la expresión analítica de $y(x)$ en el intervalo $(0,6]$
      en los siguientes casos:

      **(i)** De forma que pueda aplicarse el teorema. Calcular el punto o
      puntos a los cuales hace referencia el teorema.

      **(ii)** De forma que no pueda aplicarse el teorema, pero se cumpla la
      tesis.

      **(iii)** De forma que no pueda aplicarse el teorema y no se cumpla la
      tesis.
    pide: Enunciar el teorema y construir los tres casos.

    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado (ii) pide que **no** se aplique el teorema pero **sí** se
          cumpla la tesis. ¿Por qué es posible?
        opciones:
          - texto: >-
              Porque las hipótesis son **suficientes, no necesarias**
            correcta: true
            mensaje: |
              Exacto, y ese es el ejercicio entero. Un teorema del tipo «si
              hipótesis, entonces tesis» no dice nada sobre qué pasa cuando las
              hipótesis fallan: la tesis puede cumplirse igual, por otra razón,
              o no cumplirse. El apartado (ii) y el (iii) exhiben los dos casos.
          - texto: >-
              Porque el teorema está mal enunciado
            mensaje: |
              Está bien enunciado. Lo que ocurre es que una implicación no es
              una equivalencia.
          - texto: >-
              Porque la tesis se cumple siempre
            mensaje: |
              No: el apartado (iii) pide justamente construir un caso donde no
              se cumpla, y se puede.
          - texto: >-
              Porque en $[-4,0]$ la función ya es derivable
            mensaje: |
              Eso ayuda, pero no explica nada: el teorema se aplica al intervalo
              **entero** $[-4,6]$.

      - tipo: calcular
        titulo: El caso (i)
        pregunta: |
          Prolongando la misma parábola, $y(x)=x^{2}-4$ en todo $[-4,6]$,
          ¿cuánto vale el punto $c$ de Lagrange?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 sería si el cociente incremental valiera 4. Vale 2:
              $\frac{y(6)-y(-4)}{10} = \frac{32-12}{10}$.
          - valor: '0'
            mensaje: |
              0 es el punto donde la parábola tiene su vértice, es decir donde
              $y'=0$. El cociente incremental no es cero.
          - valor: '5'
            mensaje: |
              5 saldría de $2c=10$: has usado la longitud del intervalo en vez
              del cociente incremental.
        pista: |
          $y(-4)=12$, $y(6)=32$, y $y'(x)=2x$.
        desarrollo: |
          Prolongando la parábola, $y$ es continua y derivable en todo
          $\mathbb{R}$: las hipótesis se cumplen.

          $$
          y(-4) = 16-4 = 12,
          \qquad
          y(6) = 36-4 = 32
          $$

          $$
          \frac{y(6)-y(-4)}{6-(-4)} = \frac{32-12}{10} = 2
          $$

          $$
          y'(c) = 2c = 2 \;\Longrightarrow\; c = 1
          $$

          Y $c=1$ está en $(-4,6)$ ✔
        veredicto: |
          La prolongación más simple es la propia parábola: no hay que empalmar
          nada porque ya lo está. Cualquier otra función continua y derivable
          en el empalme también valdría.

      - tipo: calcular
        titulo: El caso (iii)
        pregunta: |
          Tomando $y(x) = k$ constante en $(0,6]$, ¿cuál es el menor valor
          **entero** de $k$ que hace que la tesis **no** se cumpla?
        respuesta:
          tipo: numero
          valor: '13'
          tolerancia: 0.1
          formato: un número
        distractores:
          - valor: '12'
            mensaje: |
              Con $k=12$ el cociente incremental es
              $\frac{12-12}{10} = 0$, y $y'=0$ sí se alcanza — en el vértice de
              la parábola y en todo el tramo constante. La tesis **se cumple**.
          - valor: '0'
            mensaje: |
              Con $k=0$ el cociente es $-1{,}2$, que **sí** lo alcanza $y'=2x$
              en $x=-0{,}6$. La tesis se cumple.
          - valor: '32'
            mensaje: |
              32 funciona, pero no es el **menor** entero: 13 ya sirve.
        pista: |
          El cociente vale $\frac{k-12}{10}$, y $y'$ solo toma valores en
          $(-8,0)$ y el valor 0.
        desarrollo: |
          Con $y=k$ constante en $(0,6]$, la función es **discontinua** en
          $x=0$ si $k \neq -4$: el teorema no se aplica.

          $$
          \frac{y(6)-y(-4)}{10} = \frac{k-12}{10}
          $$

          ¿Qué valores toma $y'$? En $(-4,0)$ vale $2x$, o sea todo
          $(-8,0)$; en $(0,6)$ vale 0.

          $$
          y' \text{ toma valores en } (-8,0]
          $$

          Para que la tesis **falle** hace falta

          $$
          \frac{k-12}{10} \notin (-8,0]
          \;\Longleftrightarrow\;
          k-12 > 0 \ \text{ o } \ k-12 \le -80
          $$

          $$
          k > 12 \quad\text{o}\quad k \le -68
          $$

          El menor entero mayor que 12 es $k=13$.
        veredicto: |
          Con $k=13$ el cociente vale $0{,}1$, y la derivada **nunca** es
          positiva: ni en la parábola decreciente ni en el tramo llano. La tesis
          falla.

      - tipo: justificar
        pregunta: |
          Ordena la construcción de los tres casos. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **(a) El teorema.** Si $f$ es continua en $[a,b]$ y derivable en
              $(a,b)$, existe $c\in(a,b)$ con
              $f'(c) = \frac{f(b)-f(a)}{b-a}$.
          - texto: |
              **(i)** Prolongar la parábola: $y(x)=x^{2}-4$ en todo $[-4,6]$.
              Continua y derivable, cociente $=2$, y $c=1$.
          - texto: |
              **(ii)** Romper la **derivabilidad** sin romper la continuidad:
              $y(x) = -4-4x$ en $(0,6]$. En $x=0$ empalma el valor pero no la
              pendiente —0 por la izquierda, $-4$ por la derecha—.
          - texto: |
              Y ahí la tesis **se cumple**: el cociente vale
              $\frac{-28-12}{10} = -4$, que es exactamente la pendiente del
              tramo recto. Todo punto de $(0,6)$ sirve como $c$.
          - texto: |
              **(iii)** Romper la **continuidad**: $y(x) = 13$ en $(0,6]$. El
              cociente vale $0{,}1$, y $y'$ solo toma valores en $(-8,0]$: no
              hay ningún $c$.
          - texto: |
              En (ii) basta con romper la continuidad, igual que en (iii): las
              dos hipótesis son intercambiables.
            trampa: true
            mensaje: |
              No son intercambiables para lo que pide el ejercicio. Romper la
              continuidad es la forma más **brusca** de invalidar el teorema y
              suele arrastrar la tesis con ella. Para (ii) conviene romper solo
              la derivabilidad, que es la hipótesis más débil: la función sigue
              «casi bien» y la tesis sobrevive. Elegir qué hipótesis romper es
              justamente lo que distingue (ii) de (iii).
        veredicto: |
          Los tres casos son un mapa de lo que significa una implicación:
          hipótesis y tesis, hipótesis rotas y tesis viva, hipótesis rotas y
          tesis muerta. Solo falta el cuarto, que el teorema prohíbe.

    resolucion: |
      **Datos.** $y(x) = x^{2}-4$ en $[-4,0]$; el tramo $(0,6]$ hay que
      construirlo tres veces.

      ### 1 · Apartado (a): el teorema

      > **Teorema de Lagrange (del valor medio).** Sea $f$ una función
      > **continua en $[a,b]$** y **derivable en $(a,b)$**. Entonces existe al
      > menos un punto $c \in (a,b)$ tal que
      >
      > $$
      > f'(c) = \frac{f(b)-f(a)}{b-a}
      > $$

      Geométricamente: hay al menos un punto interior donde la tangente es
      **paralela a la cuerda** que une los extremos.

      **Dos hipótesis, y son suficientes pero no necesarias.** Eso es lo que
      hace posibles los apartados (ii) y (iii).

      ### 2 · Lo que se sabe del tramo izquierdo

      $$
      y(-4) = 12,
      \qquad
      y(0) = -4,
      \qquad
      y'(x) = 2x \ \text{ en } (-4,0)
      $$

      Así que en ese tramo $y'$ recorre todo el intervalo $(-8,0)$. Es el rango
      de pendientes disponible, y de él depende todo.

      ### 3 · Caso (i): que se aplique

      Hace falta continuidad en $[-4,6]$ y derivabilidad en $(-4,6)$, es decir
      empalmar **valor y pendiente** en $x=0$:

      $$
      y(0^{+}) = -4, \qquad y'(0^{+}) = 0
      $$

      La opción más simple: **prolongar la misma parábola**.

      $$
      \boxed{y(x) = x^{2}-4 \quad \text{en } (0,6]}
      $$

      Entonces $y(6) = 32$ y

      $$
      \frac{y(6)-y(-4)}{10} = \frac{32-12}{10} = 2
      $$

      $$
      y'(c) = 2c = 2
      \;\Longrightarrow\;
      \boxed{c = 1}
      $$

      que está en $(-4,6)$ ✔

      ### 4 · Caso (ii): que no se aplique, pero la tesis se cumpla

      La clave es romper **la hipótesis más débil**: la derivabilidad. Se empalma
      el valor pero no la pendiente.

      Tomando una recta $y = -4+kx$ en $(0,6]$: es continua en 0 —vale $-4$—
      pero su pendiente es $k$, distinta de la 0 que trae la parábola. **No
      derivable en $x=0$**: el teorema no se aplica.

      ¿Para qué $k$ se cumple la tesis? El cociente incremental es

      $$
      \frac{(-4+6k)-12}{10} = \frac{6k-16}{10}
      $$

      y basta con que coincida con la propia pendiente $k$ del tramo recto:

      $$
      k = \frac{6k-16}{10}
      \;\Longrightarrow\;
      10k = 6k-16
      \;\Longrightarrow\;
      k = -4
      $$

      $$
      \boxed{y(x) = -4-4x \quad \text{en } (0,6]}
      $$

      Comprobación: $y(6) = -28$, cociente $= \frac{-28-12}{10} = -4$. Y
      $y'=-4$ en **todo** $(0,6)$: la tesis se cumple, y de sobra — hay
      infinitos $c$.

      ### 5 · Caso (iii): que no se aplique y la tesis falle

      Ahora se rompe la **continuidad**, que es la hipótesis fuerte, y además
      hay que salirse del rango de pendientes disponibles.

      Tomando $y = k$ constante en $(0,6]$ con $k \neq -4$, la función salta en
      $x=0$. El cociente vale $\frac{k-12}{10}$, y las pendientes que $y$ llega
      a tener son

      $$
      y' \in (-8,0) \ \text{ en la parábola}, \qquad y' = 0 \ \text{ en el
      tramo llano}
      $$

      es decir, $(-8,0]$. Para que la tesis falle basta con que el cociente
      quede fuera:

      $$
      \frac{k-12}{10} > 0 \;\Longleftrightarrow\; k > 12
      $$

      $$
      \boxed{y(x) = 32 \quad \text{en } (0,6]}
      $$

      —o cualquier constante mayor que 12; con 13 ya basta—. El cociente vale

      $$
      \frac{32-12}{10} = 2
      $$

      y $y'$ **nunca** llega a 2: en la parábola es negativa y en el tramo
      llano es cero. No existe $c$.

      ### 6 · Lo que enseña el ejercicio

      | caso | hipótesis | tesis |
      |---|---|---|
      | (i) | se cumplen | se cumple, y el teorema lo garantizaba |
      | (ii) | fallan | **se cumple igual**, por otra razón |
      | (iii) | fallan | falla |
      | — | se cumplen | **falla**: imposible |

      La última fila es la que el teorema prohíbe. Las otras tres son todas
      posibles, y construirlas demuestra haber entendido que **una implicación
      no es una equivalencia**.

      ### 7 · Comprobación

      **Del caso (i), gráficamente.** La cuerda de $(-4,12)$ a $(6,32)$ tiene
      pendiente 2, y la tangente a la parábola en $x=1$ también ✔

      **Del caso (ii).** La función va de 12 a $-28$ bajando siempre: primero
      por la parábola con pendientes en $(-8,0)$, luego en línea recta con
      pendiente $-4$. La pendiente media, $-4$, cae dentro del segundo tramo ✔

      **Del caso (iii).** La función **sube** en promedio —de 12 a 32— pero
      $y'\le0$ en todo punto donde existe. El salto en $x=0$ es el que hace todo
      el trabajo de subir, y ahí no hay derivada ✔ Esa es exactamente la razón
      por la que Lagrange exige continuidad.

  - id: ex2122-2ev-3-cota-en-el-otro-sentido
    titulo: Acotar el error hacia atrás
    fuente: >-
      Ejercicio 3 · Segunda evaluación, 29 de noviembre de 2021 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 3
      comp4: 6

    enunciado: |
      En la imagen se muestran las gráficas de una función $f(x)$ y de sus dos
      primeras derivadas $f'(x)$ y $f''(x)$.

      <figure class="figura-examen">
      <svg viewBox="0 0 780 470" role="img" width="760" height="458"
           aria-labelledby="f2122b3t f2122b3d">
        <title id="f2122b3t">Las graficas de f, f prima y f segunda</title>
        <desc id="f2122b3d">f parte de dos en x igual a menos uno, tiene un
        minimo cerca de menos cero coma cuatro, pasa por uno en el origen, sube
        hasta un maximo de cinco coma seis en x igual a uno coma cuatro y baja.
        f prima pasa por uno en el origen y alcanza su maximo, cinco, en x igual
        a uno. f segunda pasa por dos en el origen, sube a cinco coma seis y
        corta el eje en x igual a uno.</desc>

        <g stroke="var(--rule)" stroke-width="1" fill="none">
          <path d="M80 60 L80 400 M183 60 L183 400 M287 60 L287 400
                   M390 60 L390 400 M494 60 L494 400 M597 60 L597 400
                   M700 60 L700 400
                   M80 60 L700 60 M80 120 L700 120 M80 180 L700 180
                   M80 240 L700 240 M80 280 L700 280 M80 360 L700 360
                   M80 400 L700 400"></path>
        </g>

        <g stroke="var(--graphite)" stroke-width="1.4" fill="none">
          <path d="M60 320 L720 320 M287 50 L287 415"></path>
        </g>

        <g fill="none" stroke-width="2.8" stroke-linecap="round">
          <path stroke="var(--ink)"
                d="M80 240 C 130 268, 165 290, 200 290
                   C 240 290, 265 284, 287 280
                   C 330 268, 355 250, 390 236
                   C 430 200, 465 175, 494 160
                   C 530 130, 565 96, 587 96
                   C 620 105, 660 220, 700 360"></path>
          <path stroke="var(--flag)" stroke-dasharray="9 6"
                d="M132 400 C 160 360, 180 330, 200 320
                   C 240 300, 265 288, 287 280
                   C 330 250, 360 210, 390 184
                   C 430 150, 465 122, 494 120
                   C 530 130, 565 250, 597 400"></path>
          <path stroke="var(--graphite)" stroke-dasharray="3 6"
                d="M163 60 C 185 160, 215 245, 245 266
                   C 265 268, 275 252, 287 240
                   C 330 180, 375 110, 407 96
                   C 430 100, 460 200, 494 320
                   C 500 350, 505 380, 509 400"></path>
        </g>

        <g fill="var(--graphite)" font-size="13" font-family="var(--mono)">
          <text x="52" y="65">6</text>
          <text x="52" y="145">4</text>
          <text x="52" y="225">2</text>
          <text x="52" y="285">1</text>
          <text x="52" y="325">0</text>
          <text x="46" y="405">-2</text>
          <text x="64" y="428">-1</text>
          <text x="270" y="428">0</text>
          <text x="478" y="428">1</text>
          <text x="684" y="428">2</text>
        </g>

        <g font-size="14" font-family="var(--mono)">
          <text x="600" y="80" fill="var(--ink)">f(x)</text>
          <text x="440" y="105" fill="var(--flag)">f'(x)</text>
          <text x="330" y="80" fill="var(--graphite)">f''(x)</text>
        </g>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original y medida sobre el PDF. Los
      valores que decide el ejercicio son exactos: en x igual a uno, f vale 4 y
      su derivada 5, que es su maximo; en x igual a cero, f vale 1 y la segunda
      derivada 2.
      </figcaption>
      </figure>

      **a)** Calcular el polinomio de Taylor de orden 1 en $a=1$.

      **b)** Acotar el error cometido al aproximar el valor de la función
      $f(x)$ en $x=0$ mediante el polinomio obtenido en el apartado anterior.

      **c)** Calcular el error exacto y comprobar que la cota calculada en el
      apartado anterior es válida.
    pide: Calcular el polinomio, acotar el error y compararlo con el exacto.

    pasos:
      - tipo: reconocer
        pregunta: |
          Se desarrolla en $a=1$ y se evalúa en $x=0$. ¿Cambia algo respecto de
          lo habitual?
        opciones:
          - texto: >-
              No: la fórmula es la misma y $(x-a)^{2}$ sale igual, porque va
              **al cuadrado**
            correcta: true
            mensaje: |
              Exacto. $(0-1)^{2} = 1$, igual que si fuera $(2-1)^{2}$. Lo único
              que cambia es que el intervalo donde hay que acotar $f''$ es
              $[0,1]$, a la **izquierda** del centro. La fórmula no distingue
              direcciones.
          - texto: >-
              Sí: hay que cambiar el signo del resto
            mensaje: |
              El resto lleva $(x-a)^{2}$, que es positivo en los dos sentidos.
              El signo del error lo decide $f''(\xi)$, no la dirección.
          - texto: >-
              Sí: el polinomio de Taylor solo vale hacia la derecha
            mensaje: |
              Vale en un entorno del punto, a los dos lados. Nada en la fórmula
              privilegia una dirección.
          - texto: >-
              Sí: hay que desarrollar en $a=0$
            mensaje: |
              El enunciado fija $a=1$. Desarrollar en 0 sería otro ejercicio — y
              además trivial, porque el error sería nulo.

      - tipo: calcular
        titulo: El polinomio
        pregunta: |
          ¿Cuánto vale $P_1(0)$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.15
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              4 es $f(1)$, el valor en el centro del desarrollo. Hay que
              evaluar el polinomio en 0.
          - valor: '1'
            mensaje: |
              1 es $f(0)$, el valor **real** de la función. El polinomio no
              acierta: da $-1$, y de ahí el error de 2.
          - valor: '9'
            mensaje: |
              9 sale de $4+5(0+1)$: el paréntesis es $x-1$, no $x+1$.
        pista: |
          $P_1(x) = f(1)+f'(1)(x-1)$, con $f(1)=4$ y $f'(1)=5$.
        desarrollo: |
          De la gráfica, en $x=1$:

          $$
          f(1) = 4,
          \qquad
          f'(1) = 5
          $$

          —el 5 es el **máximo** de $f'$, y por eso $f''(1)=0$—.

          $$
          P_1(x) = 4+5(x-1) = 5x-1
          $$

          $$
          P_1(0) = -1
          $$
        veredicto: |
          El polinomio de orden 1 es la recta tangente. Extrapolar una tangente
          una unidad entera hacia atrás es mucho pedir, y por eso el error va a
          ser grande.

      - tipo: calcular
        titulo: El error exacto
        pregunta: |
          ¿Cuál es el error exacto al aproximar $f(0)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.15
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              3 es la **cota**, no el error. El error real siempre es menor o
              igual.
          - valor: '1'
            mensaje: |
              1 es $f(0)$. El error es la diferencia entre ese valor y el que da
              el polinomio, que es $-1$.
          - valor: '0'
            mensaje: |
              El polinomio no acierta: da $-1$ donde la función vale 1.
        pista: |
          $f(0) = 1$ y $P_1(0) = -1$.
        desarrollo: |
          De la gráfica, $f(0) = 1$ —la curva sólida pasa exactamente por 1 en
          el origen—.

          $$
          \left|f(0)-P_1(0)\right| = \left|1-(-1)\right| = 2
          $$
        veredicto: |
          Un error de 2 sobre un valor de 1 es enorme: la aproximación no vale
          para nada a esa distancia. Y aun así **respeta la cota**, que es lo
          que pide el apartado (c).

      - tipo: justificar
        pregunta: |
          Ordena el apartado (b). Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **El resto de Lagrange:**
              $R_1(x) = \frac{f''(\xi)}{2!}(x-1)^{2}$, con $\xi$ entre 1 y $x$.
          - texto: |
              **El intervalo** donde vive $\xi$ es $(0,1)$: está a la
              **izquierda** del centro, porque se evalúa en $x=0$.
          - texto: |
              **La cota de $\left|f''\right|$ ahí.** En $[0,1]$ la curva
              punteada va de 2, sube hasta un máximo de unos $5{,}6$ y baja a 0.
              Redondeando a la línea de rejilla de arriba, $M=6$.
          - texto: |
              **La distancia al cuadrado:** $(0-1)^{2} = 1$.
          - texto: |
              $\left|R_1\right| \le \frac{6}{2}\cdot1 = 3$.
          - texto: |
              Como $f''(1)=0$, en el extremo del intervalo la segunda derivada
              se anula y la cota puede tomarse igual a 0.
            trampa: true
            mensaje: |
              Que $f''$ valga 0 en **un** punto no dice nada: la cota necesita
              el **máximo** de $\left|f''\right|$ en todo el intervalo, y en el
              interior llega a $5{,}6$. Tomar el valor en un extremo daría cota
              0, y con cota 0 el error tendría que ser nulo — y es 2. La cota
              sería falsa.
        veredicto: |
          Redondear la cota **hacia arriba** siempre es legítimo: una cota
          generosa sigue siendo una cota. Redondear hacia abajo la invalida.

    resolucion: |
      **Datos.** Las gráficas de $f$, $f'$ y $f''$.

      > **Nota sobre la figura.** Redibujada y **medida sobre el PDF**. Los
      > valores que necesita el ejercicio salieron exactos: $f(1)=4$,
      > $f'(1)=5$ —su máximo—, $f(0)=1$ y $f''(0)=2$.

      ### 1 · Apartado (a): el polinomio

      $$
      P_1(x) = f(1)+f'(1)\,(x-1)
      $$

      De la gráfica:

      $$
      f(1) = 4,
      \qquad
      f'(1) = 5
      $$

      $$
      \boxed{P_1(x) = 4+5(x-1) = 5x-1}
      $$

      Es la **recta tangente** a $f$ en $x=1$. Y nótese, de paso, que $x=1$ es
      donde $f'$ alcanza su máximo, así que $f''(1)=0$: la tangente ahí es la
      que más se ajusta de toda la zona.

      ### 2 · Apartado (b): la cota

      $$
      R_1(x) = \frac{f''(\xi)}{2!}\,(x-1)^{2},
      \qquad \xi \text{ entre } 1 \text{ y } x
      $$

      Aquí $x=0$, así que **$\xi$ está en $(0,1)$**: a la izquierda del centro.
      La fórmula no distingue direcciones —$(x-1)^{2}$ es positivo en los dos
      sentidos—, pero sí importa dónde hay que acotar $f''$.

      **La cota de $\left|f''\right|$ en $[0,1]$.** Leyendo la curva punteada:
      entra valiendo 2 en $x=0$, sube hasta un máximo de unos $5{,}6$ hacia
      $x=0{,}6$, y baja hasta 0 en $x=1$.

      $$
      \max_{[0,1]}\left|f''\right| \approx 5{,}6
      $$

      Se redondea **hacia arriba**, a la línea de rejilla siguiente:

      $$
      M = 6
      $$

      Redondear hacia arriba es siempre legítimo: una cota generosa sigue siendo
      una cota. Hacerlo hacia abajo la invalidaría.

      $$
      \left|R_1(0)\right| \le \frac{M}{2}\,(0-1)^{2} = \frac{6}{2}\cdot1
      $$

      $$
      \boxed{\left|R_1(0)\right| \le 3}
      $$

      (Con el valor medido $5{,}6$ saldría $2{,}8$, también válida y algo más
      fina.)

      ### 3 · Apartado (c): el error exacto

      De la gráfica, $f(0) = 1$. Y el polinomio:

      $$
      P_1(0) = 5\cdot0-1 = -1
      $$

      $$
      \boxed{\left|f(0)-P_1(0)\right| = \left|1-(-1)\right| = 2}
      $$

      **La comprobación:**

      $$
      2 \le 3 \quad\checkmark
      $$

      La cota es válida.

      ### 4 · Por qué el error es tan grande

      Un error de 2 sobre un valor de 1 es **el doble del valor**. La
      aproximación es mala, y hay dos razones:

      - **La distancia.** Se extrapola una unidad entera desde el centro, y el
        resto crece con el cuadrado de esa distancia.
      - **La curvatura.** En $[0,1]$ la función se dobla mucho: $f''$ llega a
        $5{,}6$. Una recta no puede seguir eso.

      Es un buen recordatorio de que el polinomio de Taylor es una aproximación
      **local**: cerca del centro es excelente, y a una unidad ya no sirve.

      ### 5 · El error que persigue el apartado (b)

      Tomar $f''$ en un solo punto en vez del máximo del intervalo.

      - En $x=1$: $f''=0$, cota 0. **Falsa** — el error es 2.
      - En $x=0$: $f''=2$, cota 1. **Falsa** también.

      Solo el máximo sobre **todo** el intervalo da una cota que se cumple. Ahí
      están los seis puntos de COMP4 de este ejercicio.

      ### 6 · Comprobación

      **Del polinomio en su centro.** $P_1(1) = 4 = f(1)$ ✔

      **Del signo del error.** $f(0) = 1 > -1 = P_1(0)$: la función queda **por
      encima** de su tangente en $x=0$. Coherente con que $f''>0$ en todo
      $(0,1)$, es decir con que $f$ sea **convexa** ahí ✔ Una función convexa
      siempre queda por encima de sus tangentes.

      **De coherencia entre gráficas.** $f'$ tiene su máximo en $x=1$, y en ese
      mismo punto $f''$ corta el eje ✔ Y $f$ tiene su máximo donde $f'$ corta el
      eje, en $x\approx1{,}45$ ✔ Las tres curvas son consistentes entre sí, lo
      que valida la lectura.

  - id: ex2122-2ev-4-caja-sin-tapa
    titulo: La caja más grande que sale de un cartón
    fuente: >-
      Ejercicio 4 · Segunda evaluación, 29 de noviembre de 2021 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    enunciado: |
      Para construir una caja sin tapa se recortan cuatro cuadrados iguales en
      todas las esquinas de un cartón de forma rectangular. Sabiendo que las
      dimensiones del cartón son 24 cm x 36 cm, calcular de qué medida debe ser
      el cuadrado para que el volumen de la caja sea máximo.

      <figure class="figura-examen">
      <svg viewBox="0 0 660 320" role="img" width="640" height="310"
           aria-labelledby="f2122b4t f2122b4d">
        <title id="f2122b4t">El carton y la caja resultante</title>
        <desc id="f2122b4d">A la izquierda, un rectangulo de 24 por 36
        centimetros con un cuadradito de lado x recortado en cada esquina. A la
        derecha, la caja abierta que resulta al doblar las solapas: su altura es
        x y su base mide 24 menos dos x por 36 menos dos x.</desc>

        <rect x="60" y="50" width="180" height="240" fill="var(--live)"
              fill-opacity="0.07" stroke="var(--graphite)" stroke-width="2"></rect>

        <g fill="var(--flag)" fill-opacity="0.16" stroke="var(--flag)"
           stroke-width="1.8">
          <rect x="60" y="50" width="34" height="34"></rect>
          <rect x="206" y="50" width="34" height="34"></rect>
          <rect x="60" y="256" width="34" height="34"></rect>
          <rect x="206" y="256" width="34" height="34"></rect>
        </g>

        <g stroke="var(--graphite)" stroke-width="1" stroke-dasharray="5 5"
           fill="none">
          <path d="M94 50 L94 290 M206 50 L206 290
                   M60 84 L240 84 M60 256 L240 256"></path>
        </g>

        <g stroke="var(--graphite)" stroke-width="1.2" fill="none">
          <path d="M60 306 L240 306 M60 300 L60 312 M240 300 L240 312"></path>
          <path d="M32 50 L32 290 M26 50 L38 50 M26 290 L38 290"></path>
        </g>

        <g fill="var(--graphite)" font-size="13" font-family="var(--mono)">
          <text x="132" y="326">24</text>
          <text x="2" y="175">36</text>
          <text x="70" y="72">x</text>
        </g>

        <path d="M360 150 L470 110 L610 150 L500 190 Z" fill="var(--live)"
              fill-opacity="0.10" stroke="var(--graphite)"
              stroke-width="2"></path>
        <path d="M360 150 L360 205 L500 245 L500 190 Z" fill="var(--live)"
              fill-opacity="0.18" stroke="var(--graphite)"
              stroke-width="2"></path>
        <path d="M500 190 L500 245 L610 205 L610 150 Z" fill="var(--live)"
              fill-opacity="0.14" stroke="var(--graphite)"
              stroke-width="2"></path>

        <g stroke="var(--flag)" stroke-width="2" fill="none">
          <path d="M344 150 L344 205 M338 150 L350 150 M338 205 L350 205"></path>
        </g>

        <g fill="var(--flag)" font-size="13" font-family="var(--mono)">
          <text x="322" y="184">x</text>
        </g>

        <g fill="var(--graphite)" font-size="12" font-family="var(--mono)">
          <text x="398" y="232">24-2x</text>
          <text x="546" y="238">36-2x</text>
        </g>
      </svg>
      <figcaption>
      Figura nuestra, redibujada. En rojo, los cuatro cuadrados que se recortan
      y la altura que producen al doblar: el mismo x hace las dos cosas, y eso
      es lo que liga las tres dimensiones.
      </figcaption>
      </figure>
    pide: Calcular el lado del cuadrado que maximiza el volumen.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Entre qué valores puede moverse $x$?
        opciones:
          - texto: >-
              Entre 0 y 12, porque hay que quitar $2x$ del **lado corto**
            correcta: true
            mensaje: |
              Exacto. La base mide $24-2x$ por $36-2x$, y las dos tienen que ser
              positivas. La condición más restrictiva es la del lado de 24:
              $x<12$. Declarar el dominio es el punto de COMP1 y además hace
              falta después, para descartar una de las dos raíces.
          - texto: Entre 0 y 24
            mensaje: |
              Con $x=13$ la base mediría $24-26 = -2$: imposible. El límite es
              la mitad del lado **corto**.
          - texto: Entre 0 y 18
            mensaje: |
              18 es la mitad del lado largo. Pero el corto se agota antes.
          - texto: >-
              Cualquier valor positivo
            mensaje: |
              A partir de 12 la caja no existe. Y el dominio importa: una de las
              dos soluciones de la derivada cae fuera.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Desarrollando $V(x) = x(24-2x)(36-2x)$, ¿cuál es el coeficiente de
          $x^{2}$?
        respuesta:
          tipo: numero
          valor: '-120'
          tolerancia: 0.5
          formato: un número
        distractores:
          - valor: '120'
            mensaje: |
              Falta el signo. Los dos productos cruzados son
              $-48x^{2}$ y $-72x^{2}$: los dos negativos.
          - valor: '864'
            mensaje: |
              864 es el coeficiente de $x$, el producto $24\cdot36$.
          - valor: '-60'
            mensaje: |
              $-60$ es la mitad: has sumado $-24$ y $-36$ en vez de $-48$ y
              $-72$. Cada uno lleva su factor 2.
        pista: |
          $(24-2x)(36-2x) = 864-48x-72x+4x^{2}$.
        desarrollo: |
          $$
          (24-2x)(36-2x) = 864-48x-72x+4x^{2} = 4x^{2}-120x+864
          $$

          Multiplicando por $x$:

          $$
          V(x) = 4x^{3}-120x^{2}+864x
          $$

          El coeficiente de $x^{2}$ es $-120$.
        veredicto: |
          Desarrollar antes de derivar es más rápido aquí que aplicar la regla
          del producto a tres factores. Con polinomios cortos casi siempre lo
          es.

      - tipo: calcular
        titulo: El lado óptimo
        pregunta: |
          ¿Cuánto debe medir el lado del cuadrado? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '4.7085'
          tolerancia: 0.005
          formato: un número en cm
        distractores:
          - valor: '15.2915'
            mensaje: |
              $10+2\sqrt7$ es la **otra** raíz de la derivada, y queda fuera del
              dominio: con $x>12$ la caja no existe. Por eso hacía falta
              declararlo.
          - valor: '6'
            mensaje: |
              6 sería la mitad de 12. No es raíz de $x^{2}-20x+72$:
              $36-120+72 = -12 \neq 0$.
          - valor: '10'
            mensaje: |
              10 es el centro de las dos raíces, $\frac{20}{2}$. Falta restarle
              $2\sqrt7$.
        pista: |
          $V'(x) = 12\left(x^{2}-20x+72\right)$.
        desarrollo: |
          $$
          V'(x) = 12x^{2}-240x+864 = 12\left(x^{2}-20x+72\right)
          $$

          $$
          x = \frac{20\pm\sqrt{400-288}}{2} = \frac{20\pm\sqrt{112}}{2}
          = \frac{20\pm4\sqrt7}{2} = 10\pm2\sqrt7
          $$

          Con $\sqrt7 \approx 2{,}6458$:

          $$
          x = 10-5{,}2915 = 4{,}7085
          \qquad\text{o}\qquad
          x = 15{,}2915
          $$

          La segunda queda **fuera del dominio** $(0,12)$: se descarta.

          $$
          x = 10-2\sqrt7 \approx 4{,}7085 \ \text{cm}
          $$
        veredicto: |
          Sacar factor común 12 antes de aplicar la fórmula evita arrastrar
          números de tres cifras. Y $\sqrt{112} = 4\sqrt7$ deja el resultado
          exacto.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La variable.** $x$ es el lado del cuadrado recortado, y hace dos
              cosas a la vez: reduce la base y **es** la altura de la caja.
          - texto: |
              **El dominio:** $0<x<12$, porque la base $24-2x$ debe ser
              positiva.
          - texto: |
              **El volumen:** $V(x) = x(24-2x)(36-2x) = 4x^{3}-120x^{2}+864x$.
          - texto: |
              **Derivar:** $V'(x) = 12\left(x^{2}-20x+72\right)$, cuyas raíces
              son $10\pm2\sqrt7$. Solo $10-2\sqrt7 \approx 4{,}71$ está en el
              dominio.
          - texto: |
              **Justificar que es máximo:** $V''(x) = 24x-240$, y
              $V''(4{,}71) = -127 < 0$.
          - texto: |
              El óptimo es la sexta parte del lado corto, porque los recortes
              deben repartirse por igual entre las tres dimensiones.
            trampa: true
            mensaje: |
              No hay tal regla. $\frac{24}{6} = 4$, y el óptimo es $4{,}71$: no
              coincide. La caja óptima **no** es un cubo ni reparte nada por
              igual — sus dimensiones salen $4{,}71 \times 14{,}58 \times
              26{,}58$. Buscar una proporción bonita en lugar de derivar es el
              atajo que falla.
        veredicto: |
          Que $x$ aparezca **tres veces** en el volumen —dos restando y una
          multiplicando— es lo que hace el problema cúbico y no trivial.

    resolucion: |
      **Datos.** Cartón de 24 × 36 cm; se recortan cuatro cuadrados de lado $x$
      y se dobla.

      ### 1 · Plantear

      El lado recortado $x$ hace **dos** cosas a la vez, y ahí está la gracia
      del problema:

      - **reduce** las dos dimensiones de la base, en $2x$ cada una —se quita
        por los dos extremos—;
      - **es** la altura de la caja al doblar las solapas.

      | dimensión | medida |
      |---|---|
      | altura | $x$ |
      | base corta | $24-2x$ |
      | base larga | $36-2x$ |

      **El dominio.** Las dos bases deben ser positivas:

      $$
      24-2x>0 \;\Longrightarrow\; x<12
      $$

      $$
      \boxed{0<x<12}
      $$

      Manda el lado **corto**. Declararlo no es un formalismo: hace falta
      después para descartar una raíz.

      ### 2 · La función objetivo

      $$
      V(x) = x\,(24-2x)(36-2x)
      $$

      Conviene desarrollar antes de derivar:

      $$
      (24-2x)(36-2x) = 864-48x-72x+4x^{2} = 4x^{2}-120x+864
      $$

      $$
      V(x) = 4x^{3}-120x^{2}+864x
      $$

      ### 3 · Optimizar

      $$
      V'(x) = 12x^{2}-240x+864 = 12\left(x^{2}-20x+72\right)
      $$

      $$
      x = \frac{20\pm\sqrt{400-288}}{2}
      = \frac{20\pm\sqrt{112}}{2}
      = 10\pm2\sqrt7
      $$

      $$
      10+2\sqrt7 \approx 15{,}29 \ \text{— fuera del dominio}
      $$

      $$
      \boxed{x = 10-2\sqrt7 \approx 4{,}7085 \ \text{cm}}
      $$

      **Que es máximo:**

      $$
      V''(x) = 24x-240
      \;\Longrightarrow\;
      V''(4{,}7085) = 113-240 = -127 < 0 \quad\checkmark
      $$

      Y como en los extremos del dominio el volumen se anula —$V(0)=0$ y
      $V(12)=0$—, el máximo local es **absoluto**.

      ### 4 · La caja resultante

      $$
      4{,}71 \times 14{,}58 \times 26{,}58 \ \text{cm}
      $$

      $$
      V_{\max} \approx 1825 \ \text{cm}^{3}
      $$

      **No es un cubo ni tiene ninguna proporción redonda.** Es lo que sale, y
      buscarle una regla bonita —«un sexto del lado corto», «un tercio de la
      diferencia»— lleva a respuestas equivocadas.

      ### 5 · Comprobación

      **Numérica**, evaluando a los lados:

      | $x$ | $V(x)$ |
      |---|---|
      | $3$ | $1620$ |
      | $4$ | $1792$ |
      | $4{,}71$ | $\mathbf{1825}$ |
      | $5$ | $1820$ |
      | $6$ | $1728$ |

      El del punto crítico es el mayor ✔

      **De la raíz descartada.** Con $x=15{,}29$ la base corta mediría
      $24-30{,}58 = -6{,}58$: negativa. La fórmula da un número, pero la caja no
      existe ✔ Por eso el dominio no era decorativo.

      **De los extremos.** $V(0)=0$ —no hay altura— y $V(12)=0$ —no hay base—.
      Entre dos ceros de una función positiva tiene que haber un máximo ✔
