        <text class="par21-et" x="181.5" y="83.2">f(t)</text>
      </svg>
      <figcaption>
      La ampliación par y periódica. Es continua en todo el eje: en los
      múltiplos impares de π los dos tramos llegan al mismo valor π, y lo que
      hay es un pico, no un salto.
      </figcaption>
      </figure>

      Merece la pena mirarla antes de calcular, porque contesta sola el apartado
      d): **no hay ni un salto**.

      **c) La serie.** Al ser par, $b_{n}=0$ y

      $$
      \frac{a_{0}}{2}=\frac{1}{\pi}\int_{0}^{\pi}(2\pi-t)\,dt=\frac{3\pi}{2}
      $$

      $$
      a_{n}=\frac{2}{\pi}\int_{0}^{\pi}(2\pi-t)\cos(nt)\,dt
      =\frac{2}{\pi}\cdot\frac{1-(-1)^{n}}{n^{2}}
      $$

      El término con $2\pi$ se anula —la integral del coseno en un número entero
      de semiperiodos es cero— y el que queda se hace por partes.

      $$
      S(t)=\frac{3\pi}{2}+\frac{4}{\pi}\left(\cos t+\frac{\cos 3t}{9}
      +\frac{\cos 5t}{25}+\cdots\right)
      $$

      **d) Los dos puntos.** Como la ampliación es continua, la serie converge
      al valor de la función en todos ellos:

      $$
      S(0)=f(0)=2\pi,
      \qquad
      S\!\left(\frac\pi2\right)=f\!\left(\frac\pi2\right)=\frac{3\pi}{2}
      $$

      —en $\frac\pi2$ los cosenos impares se anulan y solo queda el término
      constante, lo que confirma la cuenta sin sumar nada—.

      **e) La suma.** El apartado d) ya ha hecho el trabajo. En $t=0$ todos los
      cosenos valen $1$:

      $$
      2\pi=\frac{3\pi}{2}+\frac{4}{\pi}\sum_{n=0}^{\infty}\frac{1}{(2n+1)^{2}}
      \;\Longrightarrow\;
      \sum_{n=0}^{\infty}\frac{1}{(2n+1)^{2}}=\frac{\pi^{2}}{8}
      $$

      **Una comprobación que casi nadie hace y vale la pena.** La suma de todos
      los inversos de los cuadrados es $\frac{\pi^{2}}{6}$ (Basilea). Los pares
      son $\sum\frac{1}{(2n)^{2}}=\frac14\cdot\frac{\pi^{2}}{6}=\frac{\pi^{2}}{24}$,
      así que los impares valen
      $\frac{\pi^{2}}{6}-\frac{\pi^{2}}{24}=\frac{\pi^{2}}{8}$ ✓. Dos caminos
      independientes que dan lo mismo: eso es lo que convierte un resultado en
      una certeza.
