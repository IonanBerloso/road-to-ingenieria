  - id: ex2021-ord-4-perpendicular-a-una-curva-de-nivel-implicita
    titulo: Un gradiente de una función que no se puede despejar
    fuente: >-
      Ejercicio 4 del PRIMER CUATRIMESTRAL · Convocatoria ordinaria, 8 de junio
      de 2021 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3
    enunciado: |
      Sea la función $z=f(x,y)$ tal que $xz+\ln(z)=y$. Calcular un vector
      perpendicular a la curva de nivel $f(x,y)=1$ en el punto $(0,0)$.
    pide: Un vector perpendicular, y de dónde sale.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué vector es perpendicular a una curva de nivel?
        opciones:
          - texto: El gradiente de $f$ en ese punto
            correcta: true
            mensaje: |
              Eso es, y el motivo es directo: a lo largo de una curva de nivel
              $f$ no cambia, así que la derivada direccional en la dirección
              tangente vale cero, es decir, $\nabla f$ es ortogonal a la
              tangente.
          - texto: El vector tangente a la curva
            mensaje: |
              El tangente es perpendicular al que se pide. Si la curva es
              $y=x$, su tangente lleva la dirección $(1,1)$ y el perpendicular
              es $(-1,1)$ — que es justo lo que va a salir.
          - texto: >-
              El vector $(1,1)$, porque la curva de nivel es una recta
            mensaje: |
              La curva de nivel sí resulta ser la recta $y=x$, pero $(1,1)$ es
              su **dirección**, no una perpendicular. Además, aquí lo que se
              evalúa es saber sacar el gradiente de una función implícita, no
              reconocer la recta.

      - tipo: calcular
        titulo: La derivada respecto de x
        pregunta: |
          ¿Cuánto vale $f_{x}(0,0)$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Signo. La derivación implícita da
              $f_{x}=-\dfrac{G_{x}}{G_{z}}$, con el menos delante, y aquí
              $G_{x}=z=1$ y $G_{z}=x+\frac1z=1$.
          - valor: '0'
            mensaje: |
              Cero saldría si $G_{x}$ fuera nulo, es decir, si la ecuación no
              dependiera de $x$. Depende: el término $xz$ tiene derivada $z$,
              que en el punto vale $1$.
          - valor: '-2'
            mensaje: |
              Parece que has sumado mal $G_{z}$. Derivando $xz+\ln z-y$ respecto
              de $z$ sale $x+\frac1z$, que en $(0,0,1)$ vale $0+1=1$, no
              $\frac12$.
        pista: |
          Con $G(x,y,z)=xz+\ln z-y$, se tiene
          $f_{x}=-\frac{G_{x}}{G_{z}}$. Y en la curva de nivel $f=1$, $z=1$.
        desarrollo: |
          Primero, dónde estamos: en la curva de nivel $f=1$ se tiene $z=1$, y
          entonces la ecuación queda $x\cdot1+\ln1=y$, o sea $y=x$. El punto
          $(0,0)$ está en ella, con $z=1$.

          Con $G(x,y,z)=xz+\ln z-y$:

          $$
          G_{x}=z,\qquad G_{y}=-1,\qquad G_{z}=x+\frac1z
          $$

          $$
          f_{x}=-\frac{G_{x}}{G_{z}}=-\frac{z}{x+\frac1z}
          \;\xrightarrow{(0,0,1)}\;
          -\frac{1}{1}=-1
          $$

      - tipo: calcular
        titulo: La pendiente de la curva de nivel
        pregunta: |
          La curva de nivel $f=1$ es una recta. ¿Cuál es su pendiente?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-1'
            mensaje: |
              Esa es la pendiente de la **perpendicular**, que es lo que da el
              gradiente $(-1,1)$. La curva es $y=x$, con pendiente $+1$.
          - valor: '0'
            mensaje: |
              Cero sería una recta horizontal. Sustituyendo $z=1$ en
              $xz+\ln z=y$ queda $y=x$, que sube a $45^{\circ}$.
          - valor: '2.7182818'
            mensaje: |
              El número $e$ aparecería si el nivel fuera otro. Con $f=1$ el
              logaritmo se anula, $\ln 1=0$, y no queda ninguna exponencial.
        pista: |
          En la curva de nivel $f=1$, ¿cuánto vale $z$? Sustituye.
        desarrollo: |
          $$
          f(x,y)=1 \;\Longrightarrow\; z=1
          \;\Longrightarrow\;
          x\cdot1+\ln 1=y
          \;\Longrightarrow\;
          y=x
          $$

          Pendiente $1$, dirección $(1,1)$. Y el gradiente $(-1,1)$ cumple
          $(-1)\cdot1+1\cdot1=0$: perpendicular ✓.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La ecuación $xz+\ln z=y$ no se puede despejar en $z$, pero define
              $z$ implícitamente: se escribe $G(x,y,z)=xz+\ln z-y=0$.
          - texto: >-
              Como $G_{z}=x+\frac1z$ no se anula en el punto —vale $1$—, el
              teorema de la función implícita garantiza que $f$ existe y es
              derivable ahí.
          - texto: >-
              Entonces $f_{x}=-\frac{G_{x}}{G_{z}}=-1$ y
              $f_{y}=-\frac{G_{y}}{G_{z}}=1$, así que $\nabla f(0,0)=(-1,1)$ es
              perpendicular a la curva de nivel.
          - texto: >-
              El gradiente es tangente a la curva de nivel, porque es la
              dirección en la que la función no cambia.
            trampa: true
            mensaje: |
              Justo al revés en las dos mitades. La dirección en la que $f$ no
              cambia es la **tangente** a la curva de nivel; el gradiente es la
              de máximo crecimiento, y por eso es perpendicular a ella. Compruébalo
              aquí: la curva es $y=x$ y $\nabla f=(-1,1)$, cuyo producto
              escalar con $(1,1)$ es cero.
    resolucion: |
      **El ejercicio en una frase:** hay que derivar una función que no se puede
      despejar.

      **Situarse.** La curva de nivel $f(x,y)=1$ es el conjunto de puntos donde
      $z=1$. Sustituyendo en la ecuación,

      $$
      x\cdot1+\ln 1=y\;\Longrightarrow\;y=x
      $$

      la bisectriz. El punto $(0,0)$ está en ella, y allí $z=1$.

      **Comprobar que se puede derivar.** Con $G(x,y,z)=xz+\ln z-y$:

      $$
      G_{z}=x+\frac1z,\qquad G_{z}(0,0,1)=1\neq0
      $$

      El teorema de la función implícita dice entonces que $z=f(x,y)$ existe y
      es derivable en un entorno del punto. Decir esto vale puntos de COMP 4 y
      cuesta una línea.

      **Las dos derivadas.**

      $$
      f_{x}=-\frac{G_{x}}{G_{z}}=-\frac{z}{x+\frac1z},
      \qquad
      f_{y}=-\frac{G_{y}}{G_{z}}=\frac{1}{x+\frac1z}
      $$

      y en $(0,0)$ con $z=1$:

      $$
      \boxed{\;\nabla f(0,0)=(-1,\,1)\;}
      $$

      **Por qué es perpendicular.** A lo largo de la curva de nivel, $f$ es
      constante; la derivada direccional en la dirección tangente $\vec u$ vale
      $\nabla f\cdot\vec u=0$. Aquí la tangente es $(1,1)$ y en efecto
      $(-1,1)\cdot(1,1)=0$.

      **Y la comprobación que hace este ejercicio agradable:** como la curva de
      nivel resulta ser la recta $y=x$, se puede verificar el resultado sin
      derivación implícita. Cualquier múltiplo de $(-1,1)$ sirve como respuesta;
      el enunciado pide **un** vector, no el gradiente exacto.

  - id: ex2021-ord-5-el-cono-sobre-medio-disco
    titulo: Un volumen que fija el radio del recinto
    fuente: >-
      Ejercicio 1 del SEGUNDO CUATRIMESTRAL · Convocatoria ordinaria, 8 de junio
      de 2021 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea la integral
      $\displaystyle\int_{-a}^{a}\left(\int_{0}^{\sqrt{a^{2}-x^{2}}}f(x,y)\,dy\right)dx$.
      Calcular los posibles valores de $a$ tales que el volumen de la superficie
      $f(x,y)=+\sqrt{x^{2}+y^{2}}$ en dicho recinto sea igual a
      $\dfrac{9\pi}{8}$.
    pide: El valor de a.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué recinto del plano describen esos límites de integración?
        opciones:
          - texto: El semidisco superior de radio $a$
            correcta: true
            mensaje: |
              Eso es: $x$ recorre de $-a$ a $a$ y, para cada $x$, la $y$ va de
              $0$ hasta $\sqrt{a^{2}-x^{2}}$, que es la semicircunferencia de
              arriba. Media vuelta en polares: $\theta$ de $0$ a $\pi$.
          - texto: El disco completo de radio $a$
            mensaje: |
              El disco completo necesitaría que $y$ bajara hasta
              $-\sqrt{a^{2}-x^{2}}$. Aquí el límite inferior es $0$, así que
              solo hay la mitad de arriba — y eso cambia el resultado por un
              factor $2$.
          - texto: El cuadrado de lado $2a$
            mensaje: |
              Sería un cuadrado si el límite superior de $y$ fuera constante.
              Que dependa de $x$ como $\sqrt{a^{2}-x^{2}}$ es lo que curva la
              frontera.

      - tipo: calcular
        titulo: El volumen en función de a
        pregunta: |
          El volumen sale de la forma $V=k\,\pi a^{3}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.3333333'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.6666667'
            mensaje: |
              $\frac23$ es lo que saldría sobre el disco **completo**. El
              recinto es solo la mitad de arriba, y por eso $\theta$ va de $0$
              a $\pi$ y no a $2\pi$.
          - valor: '1'
            mensaje: |
              Te falta el $3$ de $\int r^{2}dr=\frac{r^{3}}{3}$. Al pasar a
              polares el integrando $\sqrt{x^{2}+y^{2}}=r$ se multiplica por el
              jacobiano $r$ y queda $r^{2}$.
          - valor: '0.5'
            mensaje: |
              Un medio sería el resultado de integrar $r$ en vez de $r^{2}$: te
              has dejado el jacobiano. En polares $dA=r\,dr\,d\theta$, y ese
              factor no es opcional.
        pista: |
          En polares el integrando es $r$ y el elemento de área
          $r\,dr\,d\theta$.
        desarrollo: |
          $$
          V=\int_{0}^{\pi}\!\!\int_{0}^{a}r\cdot r\,dr\,d\theta
          =\pi\cdot\frac{a^{3}}{3}
          $$

      - tipo: calcular
        titulo: El valor de a
        pregunta: |
          ¿Cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '3'
            mensaje: |
              Has resuelto $a^{3}=27$ olvidando el $8$ del denominador. De
              $\frac{a^{3}}{3}=\frac98$ sale $a^{3}=\frac{27}{8}$, y la raíz
              cúbica de $\frac{27}{8}$ es $\frac32$.
          - valor: '2.25'
            mensaje: |
              $\frac94$ sería $a$ si la ecuación fuera de primer grado. Aquí
              $a$ está al cubo: hay que sacar la raíz cúbica.
          - valor: '1.1447142'
            mensaje: |
              Esa es la raíz cúbica de $\frac32$. Te has dejado el $3$ del
              denominador del volumen: la ecuación es
              $\frac{\pi a^{3}}{3}=\frac{9\pi}{8}$.
        pista: |
          $\frac{\pi a^{3}}{3}=\frac{9\pi}{8}$, y $\frac{27}{8}$ es un cubo
          perfecto.
        desarrollo: |
          $$
          \frac{\pi a^{3}}{3}=\frac{9\pi}{8}
          \;\Longrightarrow\;
          a^{3}=\frac{27}{8}
          \;\Longrightarrow\;
          a=\frac32
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Los límites describen el semidisco superior de radio $a$, que en
              polares es $0\le\theta\le\pi$, $0\le r\le a$.
          - texto: >-
              La superficie $f=+\sqrt{x^{2}+y^{2}}$ es la hoja superior de un
              cono, y en polares vale simplemente $r$.
          - texto: >-
              Con el jacobiano, $V=\int_{0}^{\pi}\int_{0}^{a}r^{2}dr\,d\theta
              =\frac{\pi a^{3}}{3}$, e igualando a $\frac{9\pi}{8}$ sale
              $a=\frac32$.
          - texto: >-
              Como $a^{3}=\frac{27}{8}$ es una ecuación de tercer grado, hay
              tres valores de $a$ que sirven.
            trampa: true
            mensaje: |
              Tiene tres raíces, pero dos son complejas y aquí no significan
              nada: $a$ es la medida de un radio. La única raíz real es
              $\frac32$, y además tiene que ser positiva para que los límites
              $-a$ y $a$ estén en el orden correcto; con $a<0$ la integral
              cambiaría de signo. El enunciado dice «los posibles valores» en
              plural, y la respuesta honesta es que solo hay uno, dicho con su
              razón.
    resolucion: |
      **Leer el recinto antes que nada.** Los límites

      $$
      -a\le x\le a,
      \qquad
      0\le y\le\sqrt{a^{2}-x^{2}}
      $$

      describen el **semidisco superior** de radio $a$. El detalle de que sea
      medio y no entero es el que más cuesta, y se paga con un factor $2$.

      **Polares, porque el integrando lo pide.** La superficie
      $f=+\sqrt{x^{2}+y^{2}}$ es la hoja superior de un cono, y en polares se
      convierte en $r$ a secas. Con el jacobiano:

      $$
      V=\int_{0}^{\pi}\!\!\int_{0}^{a}r\cdot r\,dr\,d\theta
      =\int_{0}^{\pi}\frac{a^{3}}{3}\,d\theta
      =\frac{\pi a^{3}}{3}
      $$

      **Despejar.**

      $$
      \frac{\pi a^{3}}{3}=\frac{9\pi}{8}
      \;\Longrightarrow\;
      a^{3}=\frac{27}{8}
      \;\Longrightarrow\;
      \boxed{\;a=\frac32\;}
      $$

      **«Los posibles valores», en plural.** El enunciado lo pregunta así y la
      respuesta es que solo hay uno. La ecuación cúbica tiene tres raíces, pero
      dos son complejas y $a$ es un radio; y aunque se admitiera un $a$
      negativo, los límites $-a$ y $a$ quedarían invertidos y la integral saldría
      negativa. Conviene escribirlo: el enunciado está preguntando precisamente
      si el alumno se lo plantea.

      **Comprobación de sentido.** Con $a=\frac32$, el cono sobre el semidisco
      tiene altura máxima $\frac32$ y base de área $\frac{\pi a^{2}}{2}\approx
      3{,}53$. Un «cono» de esa base y esa altura daría un tercio del cilindro,
      del orden de $1{,}8$… y el resultado es $\frac{9\pi}{8}\approx3{,}53$. La
      diferencia es que la altura no es constante: crece con $r$, así que pesa
      más donde hay más área. Sale el doble de lo que sugiere la estimación
      ingenua, y eso también es información.

  - id: ex2021-ord-6-variacion-de-parametros-con-una-cosecante
    titulo: Un segundo miembro que obliga a variación de parámetros
    fuente: >-
      Ejercicio 2 del SEGUNDO CUATRIMESTRAL · Convocatoria ordinaria, 8 de junio
      de 2021 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Resolver la EDO $y''+16y=\dfrac{1}{\operatorname{sen}4x}$.
    pide: La solución general.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué no sirven aquí los coeficientes indeterminados?
        opciones:
          - texto: >-
              Porque $\frac{1}{\operatorname{sen}4x}$ no es de los tipos que
              admite el método: polinomios, exponenciales, senos y cosenos, y
              productos suyos
            correcta: true
            mensaje: |
              Eso es. El método de coeficientes indeterminados funciona porque
              esas familias se reproducen al derivar; una cosecante no. Cuando
              el segundo miembro se sale de la lista, la variación de parámetros
              es el método general.
          - texto: Porque la ecuación es de segundo orden
            mensaje: |
              El orden no estorba: los coeficientes indeterminados se usan a
              diario en ecuaciones de segundo orden. Lo que decide es la forma
              del segundo miembro.
          - texto: >-
              Porque las raíces de la característica son complejas
            mensaje: |
              Son complejas —$\pm4i$— y eso no impide nada: con segundo miembro
              $\cos 4x$, por ejemplo, se resolvería con coeficientes
              indeterminados sin problema, multiplicando el ensayo por $x$. El
              obstáculo es la cosecante.

      - tipo: calcular
        titulo: El wronskiano
        pregunta: |
          Con $y_{1}=\cos 4x$ e $y_{2}=\operatorname{sen}4x$, ¿cuánto vale el
          wronskiano?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Uno saldría con $\cos x$ y $\operatorname{sen}x$. Aquí las
              derivadas arrastran un $4$ por la regla de la cadena, y ese $4$ se
              queda en el wronskiano.
          - valor: '16'
            mensaje: |
              El $16$ es el coeficiente de la ecuación, no el wronskiano. Este
              vale $4\cos^{2}4x+4\operatorname{sen}^{2}4x=4$, con un solo
              factor $4$.
          - valor: '-4'
            mensaje: |
              Signo. $W=y_{1}y_{2}'-y_{1}'y_{2}=
              4\cos^{2}4x+4\operatorname{sen}^{2}4x$: los dos sumandos son
              positivos porque el menos se come el menos de la derivada del
              coseno.
        pista: |
          $W=y_{1}y_{2}'-y_{1}'y_{2}$, y recuerda que
          $(\cos 4x)'=-4\operatorname{sen}4x$.
        desarrollo: |
          $$
          W=\cos 4x\cdot 4\cos 4x-\left(-4\operatorname{sen}4x\right)
          \operatorname{sen}4x
          =4\left(\cos^{2}4x+\operatorname{sen}^{2}4x\right)=4
          $$

          Constante, que es lo cómodo de este caso.

      - tipo: calcular
        titulo: El término que crece sin límite
        pregunta: |
          La solución particular tiene un término $\alpha\,x\cos 4x$. ¿Cuánto
          vale $\alpha$?
        respuesta:
          tipo: numero
          valor: '-0.25'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.25'
            mensaje: |
              Signo. $u_{1}'=-\dfrac{y_{2}g}{W}=
              -\dfrac{\operatorname{sen}4x}{4\operatorname{sen}4x}=-\dfrac14$,
              con el menos que trae la fórmula.
          - valor: '-0.0625'
            mensaje: |
              $-\frac1{16}$ es el coeficiente del **otro** término, el que
              acompaña a $\operatorname{sen}4x\cdot\ln\left|\operatorname{sen}
              4x\right|$. Aquí el $16$ sale de integrar la cotangente, no de
              $u_{1}$.
          - valor: '-1'
            mensaje: |
              Te falta dividir entre el wronskiano. La fórmula es
              $u_{1}'=-\frac{y_{2}g}{W}$, y $W=4$.
        pista: |
          $u_{1}'=-\frac{y_{2}g}{W}$ con $g=\frac{1}{\operatorname{sen}4x}$: el
          seno se cancela y queda una constante.
        desarrollo: |
          $$
          u_{1}'=-\frac{y_{2}\,g}{W}
          =-\frac{\operatorname{sen}4x}{4\operatorname{sen}4x}=-\frac14
          \;\Longrightarrow\;
          u_{1}=-\frac{x}{4}
          $$

          y el término correspondiente de la particular es
          $u_{1}y_{1}=-\frac{x}{4}\cos 4x$.

          El otro:

          $$
          u_{2}'=\frac{y_{1}g}{W}=\frac{\cos 4x}{4\operatorname{sen}4x}
          \;\Longrightarrow\;
          u_{2}=\frac{1}{16}\ln\left|\operatorname{sen}4x\right|
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La característica $r^{2}+16=0$ da $r=\pm4i$, así que la homogénea
              es $C_{1}\cos 4x+C_{2}\operatorname{sen}4x$.
          - texto: >-
              Como el segundo miembro no es de los que admiten coeficientes
              indeterminados, se busca la particular con
              $y_{p}=u_{1}y_{1}+u_{2}y_{2}$ y las condiciones
              $u_{1}'y_{1}+u_{2}'y_{2}=0$, $u_{1}'y_{1}'+u_{2}'y_{2}'=g$.
          - texto: >-
              Eso da $u_{1}'=-\frac{y_{2}g}{W}=-\frac14$ y
              $u_{2}'=\frac{y_{1}g}{W}=\frac{\cot 4x}{4}$, de donde
              $u_{1}=-\frac x4$ y
              $u_{2}=\frac{1}{16}\ln\left|\operatorname{sen}4x\right|$.
          - texto: >-
              Las funciones $u_{1}$ y $u_{2}$ se obtienen derivando $y_{1}$ e
              $y_{2}$.
            trampa: true
            mensaje: |
              Se obtienen **integrando**, no derivando, y no de $y_{1}$ e
              $y_{2}$ sino de las dos expresiones que salen del sistema. El
              nombre del método lo dice: se hacen *variar* las constantes
              $C_{1}$ y $C_{2}$ de la homogénea, y para recuperarlas hay que
              integrar sus derivadas.
    resolucion: |
      **Por qué este ejercicio existe.** Casi todas las EDO de segundo orden que
      caen se resuelven con coeficientes indeterminados. Esta no: una cosecante
      no pertenece a la familia de funciones que se reproducen al derivar, y por
      eso hace falta el método general.

      **La homogénea.** $r^{2}+16=0$ da $r=\pm4i$:

      $$
      y_{h}=C_{1}\cos 4x+C_{2}\operatorname{sen}4x
      $$

      **La particular, por variación de parámetros.** Se busca
      $y_{p}=u_{1}(x)\cos 4x+u_{2}(x)\operatorname{sen}4x$ imponiendo

      $$
      u_{1}'=-\frac{y_{2}\,g}{W},
      \qquad
      u_{2}'=\frac{y_{1}\,g}{W},
      \qquad
      g=\frac{1}{\operatorname{sen}4x}
      $$

      El wronskiano es constante:

      $$
      W=\cos 4x\cdot4\cos 4x+4\operatorname{sen}^{2}4x=4
      $$

      Y aquí viene lo agradable del enunciado: el seno del denominador se
      cancela.

      $$
      u_{1}'=-\frac{\operatorname{sen}4x}{4\operatorname{sen}4x}=-\frac14
      \;\Longrightarrow\;
      u_{1}=-\frac{x}{4}
      $$

      $$
      u_{2}'=\frac{\cos 4x}{4\operatorname{sen}4x}=\frac{\cot 4x}{4}
      \;\Longrightarrow\;
      u_{2}=\frac{1}{16}\ln\left|\operatorname{sen}4x\right|
      $$

      —la segunda es una integral de las de reconocer: $\int\cot u\,du=
      \ln\left|\operatorname{sen}u\right|$, y el cambio $u=4x$ deja otro $\frac14$—.

      **La solución general.**

      $$
      \boxed{\;
      y=C_{1}\cos 4x+C_{2}\operatorname{sen}4x
      -\frac{x}{4}\cos 4x
      +\frac{1}{16}\operatorname{sen}4x\,\ln\left|\operatorname{sen}4x\right|
      \;}
      $$

      **Dónde vive la solución.** El segundo miembro se va a infinito donde
      $\operatorname{sen}4x=0$, es decir en $x=\frac{k\pi}{4}$. La solución vale
      en cada intervalo entre dos de esos puntos, no en todo $\mathbb{R}$, y
      decirlo forma parte de la respuesta.

      **Y una lectura física de propina:** el término $-\frac x4\cos 4x$ crece
      sin límite. Es resonancia: la fuerza externa tiene componentes en la
      frecuencia propia del oscilador, y el sistema acumula energía.

  - id: ex2021-ord-7-una-edo-que-arranca-en-t-igual-a-dos
    titulo: Una fuerza que no aparece hasta el segundo dos
    fuente: >-
      Ejercicio 3 del SEGUNDO CUATRIMESTRAL · Convocatoria ordinaria, 8 de junio
      de 2021 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Utilizando la transformada de Laplace resolver la EDO

      $$
      \left\{
      \begin{aligned}
      y''+y&=f(t)\\
      y(0)&=y'(0)=1
      \end{aligned}
      \right.
      \qquad\text{donde}\qquad
      f(t)=
      \begin{cases}
      0 & t<2\\[2pt]
      \cos(t-2) & t\ge2
      \end{cases}
      $$
    pide: La función y(t), con el tramo retrasado bien colocado.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se escribe $f$ con la función escalón de Heaviside?
        opciones:
          - texto: $f(t)=u(t-2)\cos(t-2)$
            correcta: true
            mensaje: |
              Eso es, y es exactamente la forma que pide el segundo teorema de
              traslación: **el mismo retraso** en el escalón y en el argumento
              de la función. Por eso
              $\mathcal{L}\{f\}=e^{-2s}\mathcal{L}\{\cos t\}$ sin más.
          - texto: $f(t)=u(t-2)\cos t$
            mensaje: |
              El coseno también va retrasado: en $t=2$ la función vale $\cos
              0=1$, no $\cos 2$. Si los dos retrasos no coinciden, la
              transformada no sale con un simple $e^{-2s}$ y hay que desarrollar
              el coseno de la diferencia.
          - texto: $f(t)=\cos(t-2)$
            mensaje: |
              Sin el escalón, esa función vale $\cos(-2)\approx-0{,}42$ en
              $t=0$, y el enunciado dice que antes de $t=2$ vale cero. El
              escalón es lo que apaga el tramo anterior.

      - tipo: calcular
        titulo: La transformada del segundo miembro
        pregunta: |
          $\mathcal{L}\{f\}=e^{-2s}g(s)$. ¿Cuánto vale $g(1)$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              Uno saldría con $g(s)=\frac1s$, que es la transformada del
              escalón a secas. Aquí lo que se retrasa es un coseno:
              $g(s)=\frac{s}{s^{2}+1}$.
          - valor: '0.3333333'
            mensaje: |
              Parece $\frac{1}{s^{2}+2}$ o algo por el estilo. La transformada
              del coseno es $\frac{s}{s^{2}+1}$, y en $s=1$ vale
              $\frac{1}{2}$.
          - valor: '0.5403023'
            mensaje: |
              Eso es $\cos 1$, el valor de la función, no de su transformada.
              La transformada es una función de $s$, no del tiempo.
        pista: |
          $\mathcal{L}\{u(t-a)h(t-a)\}=e^{-as}\mathcal{L}\{h\}$, y aquí
          $h=\cos$.
        desarrollo: |
          $$
          \mathcal{L}\{f\}=e^{-2s}\cdot\frac{s}{s^{2}+1},
          \qquad
          g(1)=\frac{1}{1+1}=\frac12
          $$

      - tipo: calcular
        titulo: Un valor de la solución
        pregunta: |
          ¿Cuánto vale $y(4)$?
        respuesta:
          tipo: numero
          valor: '-0.5011487'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '-1.4104461'
            mensaje: |
              Ese es solo $\cos 4+\operatorname{sen}4$: te has dejado el término
              retrasado, que en $t=4$ ya está activo y aporta
              $\frac{4-2}{2}\operatorname{sen}2\approx0{,}909$.
          - valor: '0.9092974'
            mensaje: |
              Ese es solo el término retrasado. La solución tiene además la
              parte que viene de las condiciones iniciales, que no desaparece
              cuando entra la fuerza.
          - valor: '0.4081488'
            mensaje: |
              Has usado $\frac{t}{2}\operatorname{sen}(t-2)$ en vez de
              $\frac{t-2}{2}\operatorname{sen}(t-2)$. El teorema de traslación
              retrasa la función **entera**: donde ponía $t$, va $t-2$, también
              en el factor de fuera.
        pista: |
          $y(t)=\cos t+\operatorname{sen}t+u(t-2)\dfrac{t-2}{2}
          \operatorname{sen}(t-2)$.
        desarrollo: |
          Transformando, con $y(0)=y'(0)=1$:

          $$
          \left(s^{2}+1\right)Y=s+1+e^{-2s}\frac{s}{s^{2}+1}
          $$

          $$
          Y=\frac{s+1}{s^{2}+1}+e^{-2s}\frac{s}{\left(s^{2}+1\right)^{2}}
          $$

          Con $\mathcal{L}^{-1}\left[\frac{s}{(s^{2}+1)^{2}}\right]=
          \frac{t}{2}\operatorname{sen}t$:

          $$
          y(t)=\cos t+\operatorname{sen}t
          +u(t-2)\,\frac{t-2}{2}\operatorname{sen}(t-2)
          $$

          $$
          y(4)=\cos 4+\operatorname{sen}4+\operatorname{sen}2
          \approx-0{,}6536-0{,}7568+0{,}9093=-0{,}5011
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El segundo miembro se escribe $u(t-2)\cos(t-2)$, con el mismo
              retraso en el escalón y en el coseno, de modo que
              $\mathcal{L}\{f\}=e^{-2s}\frac{s}{s^{2}+1}$.
          - texto: >-
              Transformando la ecuación con $y(0)=y'(0)=1$ queda
              $Y=\frac{s+1}{s^{2}+1}+e^{-2s}\frac{s}{(s^{2}+1)^{2}}$.
          - texto: >-
              El primer sumando antitransforma a $\cos t+\operatorname{sen}t$, y
              el segundo, por el teorema de traslación, a
              $u(t-2)\frac{t-2}{2}\operatorname{sen}(t-2)$.
          - texto: >-
              Como la fuerza no actúa hasta $t=2$, la solución vale cero en todo
              el intervalo $[0,2)$.
            trampa: true
            mensaje: |
              La fuerza no actúa, pero las condiciones iniciales sí: en $t=0$ el
              sistema arranca con $y=1$ e $y'=1$, así que oscila libremente
              desde el principio. En $[0,2)$ la solución es
              $\cos t+\operatorname{sen}t$, que vale $1$ en el origen y desde
              luego no es nula. Lo que sí es cierto es que el término retrasado
              vale cero ahí.
    resolucion: |
      **Escribir bien la fuerza.** El paso que decide el ejercicio:

      $$
      f(t)=u(t-2)\cos(t-2)
      $$

      Los dos retrasos tienen que ser el mismo. Con esa forma, el segundo
      teorema de traslación da la transformada de un tirón:

      $$
      \mathcal{L}\{f\}=e^{-2s}\,\frac{s}{s^{2}+1}
      $$

      **Transformar la ecuación.** Con $\mathcal{L}\{y''\}=s^{2}Y-sy(0)-y'(0)$
      y $y(0)=y'(0)=1$:

      $$
      s^{2}Y-s-1+Y=e^{-2s}\frac{s}{s^{2}+1}
      $$

      $$
      Y=\underbrace{\frac{s+1}{s^{2}+1}}_{\text{condiciones iniciales}}
      +\underbrace{e^{-2s}\frac{s}{\left(s^{2}+1\right)^{2}}}_{\text{la fuerza}}
      $$

      La separación no es cosmética: cada sumando cuenta una historia distinta.

      **Antitransformar.** El primero es inmediato:
      $\cos t+\operatorname{sen}t$. El segundo necesita saber que

      $$
      \mathcal{L}^{-1}\left[\frac{s}{\left(s^{2}+1\right)^{2}}\right]
      =\frac{t}{2}\operatorname{sen}t
      $$

      —una de las que conviene llevar en el formulario, porque sale en cuanto
      hay resonancia—. Y el $e^{-2s}$ retrasa **toda** la función, el factor
      $\frac t2$ incluido:

      $$
      \boxed{\;
      y(t)=\cos t+\operatorname{sen}t
      +u(t-2)\,\frac{t-2}{2}\,\operatorname{sen}(t-2)
      \;}
      $$

      **Lo que dice el resultado.** Hasta $t=2$ el sistema oscila libre, con
      amplitud $\sqrt2$. A partir de ahí entra una fuerza en su propia
      frecuencia, y el término $\frac{t-2}{2}\operatorname{sen}(t-2)$ crece sin
      límite: es resonancia, y el retraso solo desplaza el momento en que
      empieza.

      **La comprobación que conviene hacer siempre en estos ejercicios:** que la
      solución es continua en $t=2$ y que también lo es su derivada. Aquí el
      término nuevo vale cero en $t=2$ y su derivada también, así que el empalme
      es suave — como tiene que ser, porque la fuerza es finita.

  - id: ex2021-ord-8-la-ampliacion-par-de-una-recta
    titulo: Una recta ampliada a onda triangular, y la suma de los impares al cuadrado
    fuente: >-
      Ejercicio 4 del SEGUNDO CUATRIMESTRAL · Convocatoria ordinaria, 8 de junio
      de 2021 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea $f(t)$ la función definida en el intervalo $(0,\pi)$ que aparece en la
      figura.

      <figure class="figura-examen">
      <svg viewBox="0 0 340 280" role="img" width="340" height="280"
           aria-labelledby="rec21-t rec21-d">
        <title id="rec21-t">La funcion del enunciado, un segmento de recta</title>
        <desc id="rec21-d">Un segmento de recta que baja desde el punto de abscisa
        cero y ordenada dos pi hasta el punto de abscisa pi y ordenada pi. Una linea
        de puntos baja desde ese extremo hasta el eje horizontal para marcar el punto
        pi.</desc>
        <style>
          .rec21-c { stroke: var(--live); stroke-width: 2.6; fill: none; }
          .rec21-eje { stroke: var(--graphite); stroke-width: 1.2; fill: none; }
          .rec21-gui { stroke: var(--faint); stroke-width: 1.2; fill: none; stroke-dasharray: 5 4; }
          .rec21-pt { fill: var(--live); }
          .rec21-n { fill: var(--faint); font-size: 11px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
          .rec21-et { fill: var(--live); font-size: 13px; font-family: var(--mono); font-weight: 700; }
        </style>
        <path class="rec21-eje" d="M39 235L324.2 235M70 250.6L70 37.4"/>
        <path class="rec21-gui" d="M264.8 153.3L264.8 235"/>
        <path class="rec21-c" d="M70 71.6L264.8 153.3"/>
        <circle class="rec21-pt" cx="70" cy="71.6" r="3.4"/>
        <circle class="rec21-pt" cx="264.8" cy="153.3" r="3.4"/>
        <g class="rec21-n">
          <text x="328.2" y="249">t</text>
          <text x="76" y="39.4">y</text>
          <text x="62" y="75.6" text-anchor="end">(0, 2π)</text>
          <text x="272.8" y="157.3">(π, π)</text>
          <text x="264.8" y="251" text-anchor="middle">π</text>
        </g>
        <text class="rec21-et" x="156.8" y="102.4">f(t)</text>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original. Es el segmento que une el punto
      (0, 2π) con el punto (π, π), es decir f(t) = 2π − t.
      </figcaption>
      </figure>

      a) Obtener la ampliación par y periódica de la función $f(t)$.

      b) Dibujar la función ampliada.

      c) Calcular la serie de Fourier, $S(t)$, de $f(t)$.

      d) Calcular los valores de $S(t)$ y $f(t)$ en los puntos $t=0$ y
      $t=\dfrac{\pi}{2}$.

      e) Calcular la suma de la serie
      $\displaystyle\sum_{n=0}^{\infty}\frac{1}{(2n+1)^{2}}$.
    pide: La ampliación, su dibujo, la serie, los dos valores y la suma.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué consecuencia tiene ampliar de forma **par**?
        opciones:
          - texto: >-
              Que todos los $b_{n}$ se anulan y el desarrollo es solo en cosenos
            correcta: true
            mensaje: |
              Eso es. Una función par integrada contra un seno —que es impar—
              da cero en un intervalo simétrico. Ampliar de forma par es
              precisamente elegir que la serie salga en cosenos, y el enunciado
              lo pide así porque el apartado e) necesita cosenos.
          - texto: Que todos los $a_{n}$ se anulan
            mensaje: |
              Es al revés: los que se anulan con una ampliación par son los
              $b_{n}$. Los $a_{n}$ se anulan cuando la ampliación es impar.
          - texto: Que el periodo pasa a ser $\pi$
            mensaje: |
              El periodo de la ampliación es $2\pi$: se refleja el trozo
              $(0,\pi)$ sobre $(-\pi,0)$ y **eso** es lo que se repite. Con
              periodo $\pi$ la función no sería par respecto del origen.

      - tipo: calcular
        titulo: El término constante
        pregunta: |
          ¿Cuánto vale $\dfrac{a_{0}}{2}$?
        respuesta:
          tipo: numero
          valor: '4.7123890'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '9.4247780'
            mensaje: |
              Ese es $a_{0}=3\pi$, sin dividir entre dos. El término
              independiente de la serie es la media de la función, y aquí la
              media entre $2\pi$ y $\pi$ es $\frac{3\pi}{2}$.
          - valor: '3.1415927'
            mensaje: |
              $\pi$ es el valor **mínimo** de la función, no su media. La
              función va linealmente de $2\pi$ a $\pi$, así que su media es el
              punto medio, $\frac{3\pi}{2}$.
          - valor: '2.3561945'
            mensaje: |
              $\frac{3\pi}{4}$ es la mitad de la respuesta. Cuidado con dividir
              dos veces: $a_{0}=\frac{2}{\pi}\int_{0}^{\pi}f=3\pi$, y
              $\frac{a_{0}}{2}=\frac{3\pi}{2}$.
        pista: |
          Es la media de $f$ en un periodo, y $f$ va en línea recta de $2\pi$ a
          $\pi$.
        desarrollo: |
          $$
          \frac{a_{0}}{2}=\frac{1}{\pi}\int_{0}^{\pi}(2\pi-t)\,dt
          =\frac{1}{\pi}\left[2\pi^{2}-\frac{\pi^{2}}{2}\right]
          =\frac{3\pi}{2}\approx4{,}7124
          $$

      - tipo: calcular
        titulo: El primer armónico
        pregunta: |
          ¿Cuánto vale $a_{1}$?
        respuesta:
          tipo: numero
          valor: '1.2732395'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.6366198'
            mensaje: |
              $\frac2\pi$ es la mitad. Revisa el factor: con periodo $2\pi$ y
              función par, $a_{n}=\frac{2}{\pi}\int_{0}^{\pi}f\cos(nt)\,dt$, con
              un $2$ delante que muchas veces se olvida.
          - valor: '2.5464791'
            mensaje: |
              $\frac8\pi$ es el doble. Probablemente has usado
              $\frac{2}{\pi}$ dos veces, o has integrado sobre todo el periodo
              **y** duplicado por paridad.
          - valor: '0'
            mensaje: |
              Los $a_{n}$ **impares** no se anulan: son los únicos que quedan.
              Los que valen cero son los pares, porque el factor
              $1-(-1)^{n}$ se anula ahí.
        pista: |
          El término $2\pi\int_{0}^{\pi}\cos(nt)dt$ es cero; queda
          $-\int_{0}^{\pi}t\cos(nt)dt$.
        desarrollo: |
          $$
          a_{n}=\frac{2}{\pi}\int_{0}^{\pi}(2\pi-t)\cos(nt)\,dt
          =\frac{2}{\pi}\cdot\frac{1-(-1)^{n}}{n^{2}}
          $$

          $$
          a_{n}=\begin{cases}\dfrac{4}{\pi n^{2}}&n\text{ impar}\\[6pt]
          0&n\text{ par}\end{cases}
          \qquad
          a_{1}=\frac4\pi\approx1{,}2732
          $$

          $$
          S(t)=\frac{3\pi}{2}+\frac{4}{\pi}\sum_{k=0}^{\infty}
          \frac{\cos\bigl((2k+1)t\bigr)}{(2k+1)^{2}}
          $$

      - tipo: calcular
        titulo: La suma pedida
        pregunta: |
          ¿Cuánto vale
          $\displaystyle\sum_{n=0}^{\infty}\frac{1}{(2n+1)^{2}}$?
        respuesta:
          tipo: numero
          valor: '1.2337006'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.6449341'
            mensaje: |
              $\frac{\pi^{2}}{6}$ es la suma de **todos** los inversos de los
              cuadrados, la de Basilea. Esta solo suma los impares, y vale tres
              cuartas partes de aquella: $\frac{\pi^{2}}{8}$.
          - valor: '0.6168503'
            mensaje: |
              $\frac{\pi^{2}}{16}$ es la mitad. Al despejar de
              $2\pi=\frac{3\pi}{2}+\frac4\pi\Sigma$ queda
              $\frac4\pi\Sigma=\frac\pi2$, o sea $\Sigma=\frac{\pi^{2}}{8}$.
          - valor: '2.4674011'
            mensaje: |
              $\frac{\pi^{2}}{4}$ es el doble. Comprueba el despeje: hay que
              multiplicar $\frac\pi2$ por $\frac\pi4$, no por $\frac\pi2$.
        pista: |
          Evalúa la serie en $t=0$, donde todos los cosenos valen $1$ y la
          función ampliada es continua.
        desarrollo: |
          En $t=0$ los cosenos valen $1$ y la ampliación es continua, así que
          $S(0)=f(0)=2\pi$:

          $$
          2\pi=\frac{3\pi}{2}+\frac{4}{\pi}\sum_{n=0}^{\infty}
          \frac{1}{(2n+1)^{2}}
          \;\Longrightarrow\;
          \frac{4}{\pi}\Sigma=\frac{\pi}{2}
          \;\Longrightarrow\;
          \Sigma=\frac{\pi^{2}}{8}\approx1{,}2337
          $$

      - tipo: justificar
        pregunta: Ordena el apartado d). Una pieza es falsa.
        piezas:
          - texto: >-
              La ampliación par de $f(t)=2\pi-t$ es $2\pi-\left|t\right|$ en
              $(-\pi,\pi)$, repetida con periodo $2\pi$: una onda triangular
              entre $\pi$ y $2\pi$.
          - texto: >-
              Esa onda es **continua** en todo $\mathbb{R}$, también en los
              múltiplos impares de $\pi$, porque allí los dos trozos llegan al
              mismo valor $\pi$.
          - texto: >-
              Al no haber saltos, Dirichlet da $S=f$ en todo punto: $S(0)=f(0)=
              2\pi$ y $S(\pi/2)=f(\pi/2)=\frac{3\pi}{2}$.
          - texto: >-
              En $t=0$ la ampliación tiene un salto, así que $S(0)$ es la
              semisuma de los límites laterales.
            trampa: true
            mensaje: |
              No hay salto en $t=0$: los dos límites laterales valen $2\pi$,
              porque la ampliación es par y el trozo original arranca en $2\pi$.
              Lo que hay ahí es un **pico**, un punto anguloso; la función es
              continua y solo la derivada da un salto. Y esto no es un detalle:
              si en $t=0$ hubiera salto, la suma del apartado e) saldría mal.
    resolucion: |
      **a) La ampliación.** La figura da $f(t)=2\pi-t$ en $(0,\pi)$. Ampliar de
      forma par es reflejarla en el eje vertical y repetir con periodo $2\pi$:

      $$
      \tilde f(t)=2\pi-\left|t\right| \text{ en } (-\pi,\pi),
      \qquad
      \tilde f(t+2\pi)=\tilde f(t)
      $$

      **b) El dibujo.** Una onda triangular que oscila entre $\pi$ y $2\pi$, con
      los picos altos en los múltiplos pares de $\pi$ y los bajos en los
      impares.

      <figure class="figura-examen">
      <svg viewBox="0 0 360 280" role="img" width="360" height="280"
           aria-labelledby="par21-t par21-d">
