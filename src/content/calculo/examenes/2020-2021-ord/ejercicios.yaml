ejercicios:
  - id: ex2021-ord-1-la-parte-real-de-un-cociente
    titulo: Una parte real que se anula, y el punto que hay que quitar
    fuente: >-
      Ejercicio 1 del PRIMER CUATRIMESTRAL · Convocatoria ordinaria, 8 de junio
      de 2021 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Calcular y representar geométricamente los afijos de los números complejos
      $z$ que verifican la condición
      $Re\left(\dfrac{1+z}{1-z}\right)=0$.
    pide: El lugar geométrico, con el punto que hay que excluir.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se obtiene la parte real de un cociente de complejos?
        opciones:
          - texto: >-
              Multiplicando numerador y denominador por el conjugado del
              denominador, para que abajo quede un número real
            correcta: true
            mensaje: |
              Eso es. Con el denominador ya real, la parte real del cociente es
              la parte real del numerador dividida entre ese número. Y como el
              denominador es un módulo al cuadrado, es positivo salvo donde se
              anula: para que la fracción sea cero basta con anular el
              numerador.
          - texto: Restando la parte real de arriba menos la de abajo
            mensaje: |
              Eso valdría para una resta, no para un cociente. Dividir complejos
              no divide ni resta las partes por separado: mezcla las cuatro.
          - texto: >-
              Dividiendo la parte real de arriba entre la parte real de abajo
            mensaje: |
              Tentador y falso. Pruébalo con $\frac{i}{i}=1$: la parte real de
              arriba es $0$ y la de abajo también, y el cociente vale $1$. La
              parte imaginaria del denominador también interviene.

      - tipo: calcular
        titulo: Un valor de control
        pregunta: |
          ¿Cuánto vale $Re\left(\dfrac{1+z}{1-z}\right)$ en $z=2i$?
        respuesta:
          tipo: numero
          valor: '-0.6'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.6'
            mensaje: |
              Signo. El numerador queda $1-x^{2}-y^{2}$, que en $z=2i$ vale
              $1-0-4=-3$, y el denominador $(1-0)^{2}+4=5$.
          - valor: '-3'
            mensaje: |
              Te has quedado en el numerador. Falta dividir entre
              $\left|1-z\right|^{2}=5$.
          - valor: '-0.75'
            mensaje: |
              Parece que has usado $\left|1-z\right|^{2}=4$, olvidando el $1$
              de la parte real: $\left|1-2i\right|^{2}=1^{2}+2^{2}=5$.
        pista: |
          $\dfrac{1+z}{1-z}=\dfrac{(1+z)\overline{(1-z)}}{\left|1-z\right|^{2}}$,
          y la parte real del numerador sale $1-x^{2}-y^{2}$.
        desarrollo: |
          Con $z=x+iy$:

          $$
          \frac{1+z}{1-z}
          =\frac{(1+x+iy)\left(1-x+iy\right)}{(1-x)^{2}+y^{2}}
          =\frac{\left(1-x^{2}-y^{2}\right)+2iy}{(1-x)^{2}+y^{2}}
          $$

          En $z=2i$ ($x=0$, $y=2$):
          $\dfrac{1-0-4}{1+4}=-\dfrac35=-0{,}6$.

      - tipo: verificar
        pregunta: |
          Escribe el lugar geométrico en $x$ e $y$. La figura comprobará si es la
          misma región que la del enunciado.
        condicion: 'Re((1+z)/(1-z)) = 0'
        ventana:
          x: [-2, 2]
          y: [-2, 2]
        formato: en x e y; usa ^2 para los cuadrados
        pista: |
          Anula el numerador $1-x^{2}-y^{2}$.
        desarrollo: |
          $$
          \frac{1-x^{2}-y^{2}}{(1-x)^{2}+y^{2}}=0
          \;\Longleftrightarrow\;
          x^{2}+y^{2}=1
          $$

          La circunferencia unidad. Y hay una condición más que la figura no
          puede dibujar: en $z=1$ el denominador se anula y el cociente no
          existe, así que ese punto **se excluye**.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Multiplicando por el conjugado del denominador,
              $\frac{1+z}{1-z}=\frac{\left(1-x^{2}-y^{2}\right)+2iy}
              {(1-x)^{2}+y^{2}}$, con denominador real y positivo.
          - texto: >-
              Una fracción con denominador no nulo se anula cuando se anula el
              numerador, así que la condición es $1-x^{2}-y^{2}=0$.
          - texto: >-
              Eso es $\left|z\right|=1$: la circunferencia de centro el origen y
              radio $1$.
          - texto: >-
              El punto $z=1$ está en esa circunferencia, así que pertenece al
              lugar geométrico.
            trampa: true
            mensaje: |
              Está en la circunferencia, sí, pero **no** en el lugar: en $z=1$
              el denominador $1-z$ vale cero y el cociente del enunciado no
              existe. El lugar es la circunferencia unidad **menos** ese punto,
              y decirlo es lo que separa un 7 de un 10 en este ejercicio.
    resolucion: |
      **La cuenta.** Con $z=x+iy$, se multiplica por el conjugado del
      denominador:

      $$
      \frac{1+z}{1-z}
      =\frac{(1+x+iy)(1-x+iy)}{(1-x)^{2}+y^{2}}
      $$

      El numerador se desarrolla con cuidado —los dos productos cruzados suman
      $2iy$ y el $i^{2}$ deja un $-y^{2}$ en la parte real—:

      $$
      (1+x+iy)(1-x+iy)=\left(1-x^{2}-y^{2}\right)+2iy
      $$

      **La condición.** El denominador es real y positivo salvo en $z=1$, así
      que

      $$
      Re\left(\frac{1+z}{1-z}\right)=0
      \;\Longleftrightarrow\;
      1-x^{2}-y^{2}=0
      \;\Longleftrightarrow\;
      \left|z\right|=1
      $$

      **El punto que se cae.** En $z=1$ la expresión no está definida. No es una
      pega formal: si se incluye, el «lugar geométrico» contiene un punto donde
      la condición del enunciado ni siquiera se puede evaluar.

      $$
      \boxed{\;\left\{z : \left|z\right|=1\right\}\setminus\{1\}\;}
      $$

      <figure class="figura-examen">
      <svg viewBox="0 0 330 330" role="img" width="330" height="330"
           aria-labelledby="cir21-t cir21-d">
        <title id="cir21-t">La circunferencia unidad sin el punto uno</title>
        <desc id="cir21-d">Una circunferencia de radio uno centrada en el origen,
        dibujada con trazo continuo. En el punto uno del eje horizontal hay un
        circulito hueco: ese punto no pertenece al lugar geometrico, porque alli se
        anula el denominador del cociente.</desc>
        <style>
          .cir21-c { stroke: var(--live); stroke-width: 2.6; fill: none; }
          .cir21-eje { stroke: var(--graphite); stroke-width: 1.2; fill: none; }
          .cir21-h { fill: var(--paper); stroke: var(--flag); stroke-width: 2.4; }
          .cir21-n { fill: var(--faint); font-size: 11px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
          .cir21-et { fill: var(--live); font-size: 13px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round; }
          .cir21-ef { fill: var(--flag); font-size: 12px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round; }
        </style>
        <path class="cir21-eje" d="M9.8 165L300.2 165M155 310.2L155 19.8"/>
        <circle class="cir21-c" cx="155" cy="165" r="88"/>
        <circle class="cir21-h" cx="243" cy="165" r="5"/>
        <g class="cir21-n">
          <text x="304.2" y="179">x</text>
          <text x="161" y="21.8">y</text>
          <text x="148" y="81" text-anchor="end">1</text>
          <text x="67" y="181" text-anchor="middle">−1</text>
        </g>
        <text class="cir21-et" x="91.6" y="96.4" text-anchor="end">|z| = 1</text>
        <text class="cir21-ef" x="236" y="155" text-anchor="end">z = 1 fuera</text>
      </svg>
      <figcaption>
      La circunferencia unidad, con el punto z = 1 marcado en hueco: pertenece
      a la circunferencia pero no al lugar geométrico.
      </figcaption>
      </figure>

      **Un atajo que conviene conocer.** La aplicación $z\mapsto\frac{1+z}{1-z}$
      es una transformación de Möbius, y estas llevan rectas y circunferencias
      en rectas y circunferencias. «Parte real cero» es el eje imaginario, una
      recta; su preimagen tiene que ser una recta o una circunferencia, y basta
      con tres puntos para saber cuál. Con $z=i$ sale $\frac{1+i}{1-i}=i$ ✓, con
      $z=-i$ sale $-i$ ✓ y con $z=-1$ sale $0$ ✓: los tres están en la
      circunferencia unidad. No sustituye a la cuenta en un examen, pero sirve
      para comprobar el resultado en veinte segundos.

  - id: ex2021-ord-2-el-rectangulo-que-gira
    titulo: Qué lado conviene que sea el radio
    fuente: >-
      Ejercicio 2 del PRIMER CUATRIMESTRAL · Convocatoria ordinaria, 8 de junio
      de 2021 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Un rectángulo de perímetro $P$ se gira sobre uno de sus lados para obtener
      un cilindro circular recto. Calcular las dimensiones que maximizan el
      volumen del cilindro.
    pide: Los dos lados del rectángulo, en función de P.

    pasos:
      - tipo: reconocer
        pregunta: |
          Si el rectángulo tiene lados $r$ y $h$ y gira sobre el lado $h$, ¿qué
          ligadura impone el enunciado?
        opciones:
          - texto: $2(r+h)=P$
            correcta: true
            mensaje: |
              Eso es: el perímetro son los cuatro lados, dos de cada. De ahí
              $r+h=\frac{P}{2}$, que es lo que permite escribir el volumen con
              una sola variable.
          - texto: $r+h=P$
            mensaje: |
              Eso sería la semisuma. El perímetro cuenta los cuatro lados:
              $r+h+r+h=2(r+h)$.
          - texto: $r\,h=P$
            mensaje: |
              Ese es el **área** del rectángulo, no su perímetro. Y el área no
              está fijada por el enunciado: cambia según cómo se reparta el
              perímetro.

      - tipo: calcular
        titulo: El lado que hace de radio
        pregunta: |
          El máximo se alcanza con $r=kP$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.3333333'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.25'
            mensaje: |
              $P/4$ es el cuadrado, que sería el rectángulo de mayor **área**.
              Aquí se maximiza un volumen, y el radio pesa al cuadrado mientras
              que la altura pesa lineal: conviene desequilibrar a favor del
              radio.
          - valor: '0.1666667'
            mensaje: |
              $P/6$ es el otro lado, la altura del cilindro. El enunciado pide
              las dos dimensiones, así que conviene no confundirlas: el radio
              sale el doble que la altura.
          - valor: '0.5'
            mensaje: |
              $P/2$ es la **suma** de los dos lados, no uno de ellos. Con
              $r=P/2$ la altura sería cero y no habría cilindro.
        pista: |
          $V=\pi r^{2}\left(\frac{P}{2}-r\right)$, y $V'=\pi r\left(P-3r\right)$.
        desarrollo: |
          Con $h=\frac{P}{2}-r$:

          $$
          V(r)=\pi r^{2}\left(\frac{P}{2}-r\right)
          =\frac{\pi P}{2}r^{2}-\pi r^{3}
          $$

          $$
          V'(r)=\pi P r-3\pi r^{2}=\pi r\left(P-3r\right)=0
          \;\Longrightarrow\;
          r=\frac{P}{3}
          $$

          —$r=0$ es el otro punto crítico y da volumen nulo—. Y
          $V''(r)=\pi P-6\pi r$, que en $r=P/3$ vale $-\pi P<0$: máximo.

      - tipo: calcular
        titulo: La proporción entre los dos lados
        pregunta: |
          ¿Cuántas veces es el lado que hace de radio más largo que el lado
          sobre el que se gira?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Uno sería el cuadrado. Es la respuesta que sale de suponer que «lo
              más simétrico es lo mejor», y aquí no lo es: el volumen no es
              simétrico en $r$ y $h$.
          - valor: '0.5'
            mensaje: |
              Lo tienes al revés. El radio es $P/3$ y la altura $P/6$: el radio
              es el doble, no la mitad.
          - valor: '3'
            mensaje: |
              Tres es el denominador de $r=P/3$, no la razón entre los lados. La
              razón es $\frac{P/3}{P/6}=2$.
        pista: |
          $r=\frac{P}{3}$ y $h=\frac{P}{2}-\frac{P}{3}$.
        desarrollo: |
          $$
          h=\frac{P}{2}-\frac{P}{3}=\frac{P}{6},
          \qquad
          \frac{r}{h}=\frac{P/3}{P/6}=2
          $$

          Y el volumen máximo vale

          $$
          V=\pi\left(\frac{P}{3}\right)^{2}\frac{P}{6}=\frac{\pi P^{3}}{54}
          $$

      - tipo: justificar
        pregunta: Ordena la optimización. Una pieza es falsa.
        piezas:
          - texto: >-
              Al girar sobre uno de sus lados, ese lado es el **eje**, de modo
              que su longitud es la altura del cilindro y la del otro lado es el
              radio.
          - texto: >-
              El perímetro fija $r+h=\frac{P}{2}$, y sustituyendo,
              $V(r)=\pi r^{2}\left(\frac{P}{2}-r\right)$ con $r\in\left(0,\frac
              P2\right)$.
          - texto: >-
              $V'=\pi r(P-3r)$ se anula en $r=0$ y en $r=\frac P3$; el primero
              da volumen nulo y el segundo es máximo porque
              $V''\left(\frac P3\right)=-\pi P<0$.
          - texto: >-
              El rectángulo óptimo es el cuadrado, porque de todos los
              rectángulos de perímetro dado es el que más área encierra.
            trampa: true
            mensaje: |
              Es verdad que el cuadrado maximiza el **área**, y es falso que
              maximice este volumen. Con $r=h=\frac P4$ sale
              $V=\pi\frac{P^{3}}{64}$, y con $r=\frac P3$, $h=\frac P6$ sale
              $\frac{\pi P^{3}}{54}$, que es un 18 % más. El motivo es que el
              radio entra al cuadrado y la altura lineal: conviene dárselo al
              radio.
    resolucion: |
      **Lo primero, y es donde se pierde el ejercicio:** decidir qué lado es
      qué. Al girar sobre uno de sus lados, ese lado se queda quieto y es el
      **eje**: su longitud es la altura del cilindro. El otro lado barre el
      círculo, así que es el **radio**.

      <figure class="figura-examen">
      <svg viewBox="0 0 460 260" role="img" width="460" height="260"
           aria-labelledby="cil21-t cil21-d">
        <title id="cil21-t">El rectangulo, el eje de giro y el cilindro que resulta</title>
        <desc id="cil21-d">A la izquierda, un rectangulo apoyado en un eje vertical
        que coincide con su lado izquierdo: la anchura del rectangulo se llama erre y
        su altura hache. Una flecha indica el giro. A la derecha, el cilindro que
        resulta: su radio es la anchura del rectangulo y su altura la del rectangulo,
        de modo que el lado sobre el que se gira es el que fija la altura y el otro
        el radio.</desc>
        <style>
          .cil21-r { fill: var(--live); fill-opacity: .15; stroke: var(--live); stroke-width: 2.2; }
          .cil21-eje { stroke: var(--alt); stroke-width: 2.2; fill: none; stroke-dasharray: 8 5; }
          .cil21-cil { fill: var(--live); fill-opacity: .1; stroke: var(--live); stroke-width: 2.2; }
          .cil21-t { stroke: var(--live); stroke-width: 2.2; fill: var(--paper); }
          .cil21-oculta { stroke: var(--live); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; opacity: .7; }
          .cil21-fl { stroke: var(--alt); stroke-width: 2; fill: none; }
          .cil21-cota { stroke: var(--faint); stroke-width: 1.2; fill: none; }
          .cil21-n { fill: var(--faint); font-size: 12px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
          .cil21-et { fill: var(--live); font-size: 13px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round; }
          .cil21-ea { fill: var(--alt); font-size: 12px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round; }
        </style>
        <path class="cil21-eje" d="M60 25L60 225"/>
        <rect class="cil21-r" x="60" y="60" width="90" height="130"/>
        <path class="cil21-cota" d="M60 208L150 208M60 204L60 212M150 204L150 212"/>
        <path class="cil21-cota" d="M168 60L168 190M164 60L172 60M164 190L172 190"/>
        <text class="cil21-et" x="105" y="222" text-anchor="middle">r</text>
        <text class="cil21-et" x="176" y="129">h</text>
        <text class="cil21-ea" x="60" y="20" text-anchor="middle">eje</text>
        <path class="cil21-fl" d="M196 125L240 125M234 119L240 125L234 131"/>
        <text class="cil21-ea" x="218" y="115" text-anchor="middle">gira</text>
        <path class="cil21-cil" d="M280 60L280 190A70 20 0 0 0 420 190L420 60Z"/>
        <path class="cil21-oculta" d="M280 190A70 20 0 0 1 420 190"/>
        <ellipse class="cil21-t" cx="350" cy="60" rx="70" ry="20"/>
        <path class="cil21-cota" d="M350 60L420 60"/>
        <text class="cil21-et" x="388" y="54" text-anchor="middle">r</text>
        <path class="cil21-cota" d="M436 60L436 190M432 60L440 60M432 190L440 190"/>
        <text class="cil21-et" x="444" y="129">h</text>
        <text class="cil21-n" x="350" y="232" text-anchor="middle">V = π r² h</text>
      </svg>
      <figcaption>
      El lado sobre el que se gira queda como altura del cilindro; el otro se
      convierte en el radio. Confundirlos cambia por completo la respuesta.
      </figcaption>
      </figure>

      **La ligadura.** El perímetro son los cuatro lados:

      $$
      2(r+h)=P\;\Longrightarrow\;h=\frac{P}{2}-r
      $$

      **La función a maximizar.**

      $$
      V(r)=\pi r^{2}h=\pi r^{2}\left(\frac{P}{2}-r\right),
      \qquad 0<r<\frac{P}{2}
      $$

      **El máximo.**

      $$
      V'(r)=\pi\left(P r-3r^{2}\right)=\pi r\left(P-3r\right)=0
      \;\Longrightarrow\;
      r=\frac{P}{3}
      $$

      $$
      V''(r)=\pi\left(P-6r\right),
      \qquad
      V''\!\left(\frac P3\right)=-\pi P<0
      $$

      máximo. Y como el intervalo es abierto y $V$ vale cero en los dos
      extremos, es además el máximo absoluto.

      $$
      \boxed{\;r=\frac{P}{3},\qquad h=\frac{P}{6},\qquad V=\frac{\pi P^{3}}{54}\;}
      $$

      **La lectura.** El lado que hace de radio sale el **doble** que el lado
      sobre el que se gira. La intuición del cuadrado falla aquí, y falla por
      una razón que se repite en casi todo problema de optimización con
      volúmenes: **la variable que entra al cuadrado se lleva más reparto**. Con
      el cuadrado, $V=\pi P^{3}/64$; con el óptimo, $\pi P^{3}/54$, un 18 % más.

  - id: ex2021-ord-3-una-integral-con-la-x-arriba
    titulo: Estudiar una función que solo se conoce como integral
    fuente: >-
      Ejercicio 3 del PRIMER CUATRIMESTRAL · Convocatoria ordinaria, 8 de junio
      de 2021 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3
    enunciado: |
      Sea la función $F(x)=\displaystyle\int_{0}^{x}\frac{1}{t^{2}+2t+2}\,dt$.

      a) ¿Toma $F(x)$ el valor $0$? Razonar la respuesta.

      b) Estudiar el crecimiento/decrecimiento de $F(x)$ en $\mathbb{R}$.

      c) Estudiar la concavidad/convexidad de $F(x)$ en $\mathbb{R}$.

      d) Dibujar el gráfico de $F(x)$.
    pide: Los ceros, la monotonía, la curvatura y el dibujo.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuánto vale $F'(x)$?
        opciones:
          - texto: $F'(x)=\dfrac{1}{x^{2}+2x+2}$
            correcta: true
            mensaje: |
              Eso es el teorema fundamental del cálculo: derivar una integral
              con límite superior variable devuelve el integrando evaluado en
              ese límite. Fíjate en que la $t$ desaparece: era una variable
              muda.
          - texto: $F'(x)=\dfrac{1}{t^{2}+2t+2}$
            mensaje: |
              La $t$ no puede aparecer en el resultado: es la variable de
              integración y desaparece al integrar. El teorema fundamental dice
              que hay que **sustituirla** por el límite superior.
          - texto: >-
              No se puede saber sin calcular la integral primero
            mensaje: |
              Se puede, y esa es justo la gracia del teorema fundamental: da la
              derivada sin resolver la integral. Aquí la integral además se sabe
              hacer, pero en un examen conviene contestar b) y c) sin ella.

      - tipo: calcular
        titulo: La función, en forma cerrada
        pregunta: |
          Completando cuadrados sale $F(x)=\arctan(x+1)-c$. ¿Cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '0.7853982'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0'
            mensaje: |
              Sin la constante, $F(0)$ valdría $\arctan 1=\frac\pi4$ y no cero.
              La integral entre $0$ y $0$ tiene que dar cero, y eso es lo que
              fija $c$.
          - valor: '1.5707963'
            mensaje: |
              $\frac\pi2$ es el límite del arcotangente en el infinito, no su
              valor en $1$. Al evaluar la primitiva en el límite inferior
              $t=0$ sale $\arctan(0+1)=\arctan 1=\frac\pi4$.
          - valor: '1'
            mensaje: |
              $1$ es el valor de $x+1$ en el límite inferior, no el del
              arcotangente. Hay que aplicarle todavía la función.
        pista: |
          $t^{2}+2t+2=(t+1)^{2}+1$, y la primitiva es $\arctan(t+1)$.
        desarrollo: |
          $$
          F(x)=\int_{0}^{x}\frac{dt}{(t+1)^{2}+1}
          =\Bigl[\arctan(t+1)\Bigr]_{0}^{x}
          =\arctan(x+1)-\frac{\pi}{4}
          $$

      - tipo: calcular
        titulo: El punto de inflexión
        pregunta: |
          ¿En qué punto cambia $F$ de convexa a cóncava?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              En $x=0$ está el cero de $F$, no la inflexión.
              $F''=\dfrac{-2(x+1)}{\left[(x+1)^{2}+1\right]^{2}}$ se anula donde
              se anula $x+1$.
          - valor: '1'
            mensaje: |
              Signo. El denominador de $F'$ es $(x+1)^{2}+1$, con un **más**
              uno dentro del cuadrado: se anula su derivada en $x=-1$.
          - valor: '-2'
            mensaje: |
              $-2$ es la otra raíz de $x^{2}+2x=0$, pero lo que hay que anular
              no es eso: es la derivada del denominador, $2(x+1)$.
        pista: |
          Deriva $F'=\left[(x+1)^{2}+1\right]^{-1}$ con la regla de la cadena y
          mira dónde se anula el numerador.
        desarrollo: |
          $$
          F''(x)=-\frac{2(x+1)}{\left[(x+1)^{2}+1\right]^{2}}
          $$

          El denominador es siempre positivo, así que el signo lo pone
          $-2(x+1)$: positivo si $x<-1$ —convexa— y negativo si $x>-1$
          —cóncava—. En $x=-1$ hay inflexión, y allí $F(-1)=-\frac\pi4$.

      - tipo: calcular
        titulo: El techo de la función
        pregunta: |
          ¿A qué valor tiende $F(x)$ cuando $x\to+\infty$?
        respuesta:
          tipo: numero
          valor: '0.7853982'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.5707963'
            mensaje: |
              $\frac\pi2$ es el límite de $\arctan(x+1)$, pero falta restarle
              el $\frac\pi4$ de la constante.
          - valor: '-2.3561945'
            mensaje: |
              Ese es el límite por la **izquierda**,
              $-\frac\pi2-\frac\pi4=-\frac{3\pi}{4}$. La función tiene dos
              asíntotas horizontales distintas, una a cada lado.
          - valor: '0'
            mensaje: |
              No tiende a cero: el integrando es positivo y decrece como
              $1/t^{2}$, así que la integral converge a un número **positivo**.
              Que el integrando tienda a cero no significa que la integral lo
              haga.
        pista: |
          $\arctan u\to\frac\pi2$ cuando $u\to+\infty$.
        desarrollo: |
          $$
          \lim_{x\to+\infty}F(x)=\frac\pi2-\frac\pi4=\frac\pi4,
          \qquad
          \lim_{x\to-\infty}F(x)=-\frac\pi2-\frac\pi4=-\frac{3\pi}{4}
          $$

          Dos asíntotas horizontales. Toda la gráfica cabe entre ellas.

      - tipo: justificar
        pregunta: Ordena el apartado a). Una pieza es falsa.
        piezas:
          - texto: >-
              Por el teorema fundamental, $F'(x)=\frac{1}{x^{2}+2x+2}>0$ para
              todo $x$, porque $x^{2}+2x+2=(x+1)^{2}+1\ge1$.
          - texto: >-
              Luego $F$ es estrictamente creciente en todo $\mathbb{R}$, y por
              tanto inyectiva: no puede tomar el mismo valor dos veces.
          - texto: >-
              Y $F(0)=\int_{0}^{0}=0$, así que sí toma el valor cero, y lo toma
              exactamente una vez, en $x=0$.
          - texto: >-
              Como el integrando es siempre positivo, $F(x)>0$ para todo $x$ y
              la función no llega a anularse nunca.
            trampa: true
            mensaje: |
              El integrando es positivo, sí, pero eso no hace positiva la
              integral: para $x<0$ los límites están **invertidos** y
              $\int_{0}^{x}=-\int_{x}^{0}<0$. De hecho $F$ es negativa en todo
              el semieje izquierdo y llega hasta $-\frac{3\pi}{4}$. El signo de
              una integral definida depende del orden de los límites, no solo
              del signo del integrando.
    resolucion: |
      **La idea que ordena todo el ejercicio:** no hace falta calcular la
      integral para contestar a), b) y c). El teorema fundamental da

      $$
      F'(x)=\frac{1}{x^{2}+2x+2}=\frac{1}{(x+1)^{2}+1}
      $$

      y con eso se responde casi todo.

      **a) Sí, y solo una vez.** $F(0)=0$ porque la integral de $0$ a $0$ es
      cero. Y como $F'>0$ en todo $\mathbb{R}$, $F$ es estrictamente creciente y
      no puede volver a valer cero.

      Cuidado con el argumento fácil y equivocado: «el integrando es positivo,
      luego $F>0$». Para $x<0$ los límites están invertidos y la integral es
      negativa.

      **b) Creciente en todo $\mathbb{R}$.** $(x+1)^{2}+1\ge1>0$, así que
      $F'>0$ siempre y no hay extremos.

      **c) Convexa hasta $-1$, cóncava después.**

      $$
      F''(x)=-\frac{2(x+1)}{\left[(x+1)^{2}+1\right]^{2}}
      $$

      El denominador es positivo; el signo lo pone $-(x+1)$. Inflexión en
      $x=-1$, donde además $F'$ alcanza su valor máximo, $1$: es el punto donde
      la gráfica sube más deprisa.

      **d) El dibujo, con la forma cerrada.** Aquí sí conviene resolver la
      integral, porque las asíntotas se leen de un vistazo:

      $$
      F(x)=\arctan(x+1)-\frac{\pi}{4}
      $$

      $$
      \lim_{x\to-\infty}F=-\frac{3\pi}{4}\approx-2{,}36,
      \qquad
      \lim_{x\to+\infty}F=\frac{\pi}{4}\approx0{,}79
      $$

