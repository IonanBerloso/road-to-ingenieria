        <desc id="par21-d">Una onda triangular continua, simetrica respecto del eje
        vertical, que sube y baja en linea recta entre el valor pi, alcanzado en los
        multiplos impares de pi, y el valor dos pi, alcanzado en los multiplos pares.
        No hay ningun salto: la funcion es continua en todo el eje.</desc>
