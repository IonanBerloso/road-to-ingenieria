ejercicios:
  - id: ex1920-rec-1-media-recta-y-parabola
    titulo: Un semiplano y una parábola, escritos con distancias
    fuente: >-
      Ejercicio 1 · Cuarta evaluación, PRIMER CUATRIMESTRAL, 24 de febrero de
      2020 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3
    enunciado: |
      Calcular y representar geométricamente los afijos de los números
      complejos $z$ que verifican las condiciones siguientes:

      $$
      \begin{cases}
      |z-2| > |z-2i| \\[2mm]
      |z| + \operatorname{Im}(z) < 4
      \end{cases}
      $$
    pide: La región del plano y su dibujo.

    pasos:
      - tipo: reconocer
        pregunta: |
          «La distancia a $2$ es mayor que la distancia a $2i$». ¿Qué figura
          separa los dos casos?
        opciones:
          - texto: >-
              La mediatriz del segmento que une $2$ y $2i$; la condición se
              queda con el semiplano del lado de $2i$
            correcta: true
            mensaje: |
              Eso es. La mediatriz es el lugar de los puntos que equidistan, y
              parte el plano en dos. Como se pide estar **más lejos** de 2, la
              región es el semiplano que contiene a $2i$.
          - texto: Una circunferencia centrada en el punto medio
            mensaje: |
              La circunferencia sale cuando se fija el **cociente** de
              distancias distinto de 1 —la de Apolonio—. Con distancias
              comparadas por «mayor que» a secas, lo que aparece es la
              mediatriz.
          - texto: Una elipse de focos 2 y 2i
            mensaje: |
              La elipse sale de la **suma** de distancias. Aquí las distancias
              se comparan entre sí, no se suman.
          - texto: Una hipérbola de focos 2 y 2i
            mensaje: |
              La hipérbola sale de que la **diferencia** de distancias sea una
              constante no nula. Cuando esa constante es cero, la hipérbola
              degenera en la mediatriz — que es este caso.

      - tipo: calcular
        titulo: La recta que separa
        pregunta: |
          Desarrollando $|z-2| > |z-2i|$ en cartesianas, queda $y > mx$.
          ¿Cuánto vale $m$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '-1'
            mensaje: |
              La mediatriz de $2$ y $2i$ pasa por el origen con pendiente
              positiva: los dos puntos son simétricos respecto de la recta
              $y=x$. La de pendiente $-1$ sería la mediatriz de $2$ y $-2i$.
          - valor: '2'
            mensaje: |
              El 2 es la coordenada de los puntos, no la pendiente. Al elevar
              al cuadrado los dos lados, los términos con 4 se cancelan y solo
              quedan los lineales.
          - valor: '0'
            mensaje: |
              Con $m=0$ la recta sería el eje real, que no equidista de $2$ y
              de $2i$: el 2 está sobre ella y el $2i$ a distancia 2.
        pista: |
          Eleva los dos lados al cuadrado: $(x-2)^{2}+y^{2} > x^{2}+(y-2)^{2}$
          y simplifica. Los $x^{2}$, los $y^{2}$ y los 4 se van.
        desarrollo: |
          $$
          (x-2)^{2}+y^{2} > x^{2}+(y-2)^{2}
          $$
          $$
          x^{2}-4x+4+y^{2} > x^{2}+y^{2}-4y+4
          $$
          $$
          -4x > -4y
          \;\Longrightarrow\;
          x < y
          $$

          Es el semiplano **abierto** por encima de la recta $y=x$, que es la
          mediatriz del segmento de $2$ a $2i$. Elevar al cuadrado es lícito
          porque los dos lados son distancias, es decir números no negativos.

      - tipo: calcular
        titulo: El vértice de la parábola
        pregunta: |
          La segunda condición se reduce a $y < c - \frac{x^{2}}{8}$. ¿Cuánto
          vale $c$, la altura del vértice?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              El 4 es la constante del enunciado, pero al despejar se reparte:
              $x^{2} < 16-8y$ da $y < 2 - \frac{x^{2}}{8}$. El 16 dividido
              entre 8 es 2, no 4.
          - valor: '16'
            mensaje: |
              $16$ es $4^{2}$, que aparece al elevar al cuadrado, pero todavía
              hay que dividir entre 8 al despejar la $y$.
          - valor: '8'
            mensaje: |
              El 8 es el denominador de $x^{2}$, no la altura del vértice.
        pista: |
          Pasa $\operatorname{Im}(z)$ al otro lado y eleva al cuadrado:
          $\sqrt{x^{2}+y^{2}} < 4-y$. Los $y^{2}$ se cancelan.
        desarrollo: |
          $$
          \sqrt{x^{2}+y^{2}} < 4 - y
          $$

          Antes de elevar hay que decir una cosa: el lado derecho tiene que ser
          positivo, así que $y<4$. Con eso, elevar al cuadrado conserva el
          sentido:

          $$
          x^{2}+y^{2} < 16 - 8y + y^{2}
          \;\Longrightarrow\;
          x^{2} < 16 - 8y
          \;\Longrightarrow\;
          y < 2 - \frac{x^{2}}{8}
          $$

          Una parábola con vértice en $(0,2)$ que abre hacia abajo, y la
          región es su **interior**. La condición $y<4$ que exigimos antes se
          cumple sola: $2-\frac{x^{2}}{8} \le 2 < 4$.

      - tipo: justificar
        titulo: La región, descrita
        pregunta: Ordena la descripción. Una pieza es falsa.
        piezas:
          - texto: >-
              La primera condición dice que $z$ está más lejos de $2$ que de
              $2i$: es el semiplano abierto que la mediatriz $y=x$ deja del
              lado de $2i$, o sea $y>x$.
          - texto: >-
              En la segunda, antes de elevar al cuadrado hay que exigir
              $4-y>0$, porque un módulo no puede ser menor que un número
              negativo.
          - texto: >-
              Elevando, $x^{2}+y^{2}<16-8y+y^{2}$, y los $y^{2}$ se cancelan:
              queda $y<2-\frac{x^{2}}{8}$, el interior de una parábola de
              vértice $(0,2)$ que abre hacia abajo.
          - texto: >-
              La condición auxiliar $y<4$ se cumple sola, porque
              $2-\frac{x^{2}}{8}\le 2$.
          - texto: >-
              La región es la intersección: el trozo del interior de la
              parábola que queda por encima de la recta $y=x$. Los dos bordes
              son abiertos.
          - texto: >-
              Al ser las dos condiciones estrictas, la región es vacía en los
              puntos donde la recta corta a la parábola, así que la
              intersección no está acotada.
            trampa: true
            mensaje: |
              Es al revés: la región **está acotada**. La recta $y=x$ y la
              parábola $y=2-\frac{x^{2}}{8}$ se cortan en dos puntos —los de
              $x^{2}+8x-16=0$—, y entre ellos queda un recinto cerrado por
              arriba con el arco y por abajo con la recta. Que los bordes no
              se incluyan no hace que la región deje de ser acotada: solo la
              deja abierta.

      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 340 265" role="img" width="340" height="265"
               aria-labelledby="f-ex1920-mediatriz-t f-ex1920-mediatriz-d">
            <title id="f-ex1920-mediatriz-t">La franja curva entre la bisectriz y la parábola</title>
            <desc id="f-ex1920-mediatriz-d">La bisectriz y igual a x y la parábola y igual a dos menos x cuadrado partido por ocho, las dos a trazos. Se cortan en x igual a cero coma nueve y en x igual a menos ocho coma nueve. Entre las dos, por encima de la recta y por debajo de la parábola, queda sombreada una franja curva abierta hacia la izquierda.</desc>
            <style>
