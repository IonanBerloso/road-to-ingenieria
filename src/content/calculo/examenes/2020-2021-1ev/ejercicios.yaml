            <desc id="f-ex2021-arco-d">Los puntos tres i y menos tres i, unidos por una cuerda de longitud seis. La circunferencia que pasa por los dos tiene el centro en (−3,0) y radio tres raíz de dos, unos cuatro coma veinticuatro. Solo el arco mayor, el que queda a la izquierda con x negativa, cumple la condición y va en trazo grueso. Los dos extremos llevan círculo hueco.</desc>
