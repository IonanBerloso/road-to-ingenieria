        consigna: |
          Dibuja la circunferencia completa a trazos y el arco que cumple la
          condición en trazo grueso. Marca los dos puntos excluidos.
        comprueba:
          - punto: |
              Los puntos $3i$ y $-3i$ y la cuerda de longitud $6$ que los une.
            porque: |
              Es el segmento que se ve bajo $45^\circ$, y de él salen el radio y
              el centro por el teorema del ángulo inscrito.
          - punto: |
              La circunferencia de centro $\left(-3,0\right)$ y radio
              $3\sqrt2\approx4{,}24$.
            porque: |
              El radio sale de $\text{cuerda}=2R\operatorname{sen}45^\circ$, y el
              centro está a $\sqrt{18-9}=3$ del origen sobre la mediatriz. El
              signo negativo del ángulo lo manda al semiplano izquierdo.
          - punto: |
              Solo el arco **mayor**, el que queda con $x<0$.
            porque: |
              La cuerda parte la circunferencia en un arco de $90^\circ$ y otro
              de $270^\circ$; solo el grande ve el segmento bajo $45^\circ$.
              Elegir el pequeño es el error que decide el ejercicio.
          - punto: |
              Los extremos $\pm3i$ con círculo hueco.
            porque: |
              En uno se anula el denominador y en el otro el numerador. Los dos
              se quedan fuera, y por motivos distintos que conviene nombrar.
        veredicto: |
          El conjugado del enunciado no cambia el dibujo: la circunferencia y la
          condición $x<0$ son simétricas respecto del eje real, así que el lugar
          coincide con el de $z$ sin conjugar. Verlo ahorra rehacer la cuenta.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** Se pide el lugar de los $z$ con
      $\arg\left(\frac{\overline z+3i}{\overline z-3i}\right) = -\frac{\pi}{4}$.

      **Reparto de puntos del examen:** COMP1 1 · COMP2 6 · COMP4 3. Este examen
      tiene **tres ejercicios y 30 puntos**, no cuatro y 40.

      ### 1 · Restricciones previas

      El cociente exige $\overline z \neq 3i$, y el argumento de 0 no está
      definido, así que también $\overline z \neq -3i$. Los dos puntos quedan
      excluidos.

      ### 2 · Qué dice la condición

      El argumento de un cociente es la diferencia de argumentos:

      $$
      \arg\left(\overline z+3i\right)-\arg\left(\overline z-3i\right)
      = -\frac{\pi}{4}
      $$

      $\arg\left(\overline z-(-3i)\right)$ es la dirección del vector que va de
      $-3i$ al afijo de $\overline z$, y $\arg\left(\overline z-3i\right)$ la
      del que va de $3i$. Que su diferencia sea constante significa que **desde
      $\overline z$ el segmento que une $-3i$ y $3i$ se ve bajo un ángulo
      fijo** de $45^{\circ}$.

      Ese es el **arco capaz**, y el teorema del ángulo inscrito dice que es un
      arco de circunferencia que pasa por los dos extremos. El caso más conocido
      es el de $90^{\circ}$, que da la circunferencia de diámetro el segmento;
      aquí el ángulo es la mitad, así que el arco es más abierto.

      ### 3 · La circunferencia

      La cuerda es el segmento de $-3i$ a $3i$, de longitud

      $$
      c = 6
      $$

      y la relación entre cuerda, radio y ángulo inscrito es
      $c = 2R\,\mathrm{sen}\,\theta$:

      $$
      6 = 2R\,\mathrm{sen}\,45^{\circ} = 2R\cdot\frac{\sqrt2}{2} = R\sqrt2
      \;\Longrightarrow\;
      R = \frac{6}{\sqrt2} = 3\sqrt2
      $$

      El centro está en la mediatriz de la cuerda —el **eje real**— a distancia

      $$
      d = \sqrt{R^{2}-3^{2}} = \sqrt{18-9} = 3
      $$

      del origen. Dos candidatos: $(3,0)$ y $(-3,0)$.

      ### 4 · Cuál de los dos, y qué arco

      Lo decide el **signo** del argumento, y la forma rápida es probar un punto.

      Con $\overline z = -3-3\sqrt2 \approx -7{,}243$ —punto de la
      circunferencia izquierda, sobre el eje real—:

      $$
      \arg\left(-7{,}243+3i\right) = 157{,}5^{\circ},
      \qquad
      \arg\left(-7{,}243-3i\right) = -157{,}5^{\circ}
      $$

      $$
      157{,}5-(-157{,}5) = 315^{\circ} \equiv -45^{\circ} \quad\checkmark
      $$

      Y hay que comprobar además **qué arco** de esa circunferencia, porque la
      cuerda la parte en dos. Con $\overline z = -3+3\sqrt2\,i$, del arco
      izquierdo:

      $$
      \arg\left(-3+7{,}243i\right)-\arg\left(-3+1{,}243i\right)
      = 112{,}5^{\circ}-157{,}5^{\circ} = -45^{\circ} \quad\checkmark
      $$

      Con $\overline z = -3+3\sqrt2 \approx 1{,}243$, del arco derecho:

      $$
      \arg\left(1{,}243+3i\right)-\arg\left(1{,}243-3i\right)
      = 67{,}5^{\circ}-(-67{,}5^{\circ}) = 135^{\circ} \quad\times
      $$

      Sirve el **arco mayor**, el de $x<0$.

      ### 5 · Deshacer el conjugado

      Todo lo anterior describe el lugar de $\overline z$. Falta pasar a $z$, y
      esto hay que **comprobarlo**, no suponerlo: conjugar refleja respecto del
      eje real.

      La circunferencia $(x+3)^{2}+y^{2} = 18$ está centrada en el eje real, así
      que es simétrica respecto de él. Y el arco elegido, el de $x<0$, también
      lo es. Por tanto el reflejo del conjunto **es el propio conjunto**:

      $$
      \left\{z\right\} = \overline{\left\{\overline z\right\}}
      = \left\{\overline z\right\}
      $$

      El lugar de $z$ coincide con el de $\overline z$.

      ### 6 · Representación gráfica

      La circunferencia de centro $(-3,0)$ y radio $3\sqrt2 \approx 4{,}24$,
      que pasa por $(0,3)$ y $(0,-3)$ y llega por la izquierda hasta
      $(-7{,}24,\,0)$. De ella, el **arco que queda a la izquierda del eje
      imaginario**, con los dos extremos marcados con círculo hueco por estar
      excluidos.

      ### 7 · Comprobación

      Un punto del arco, $z = -3-3\sqrt2\,i$, o sea
      $\overline z = -3+3\sqrt2\,i$:

      $$
      \frac{\overline z+3i}{\overline z-3i}
      = \frac{-3+\left(3\sqrt2+3\right)i}{-3+\left(3\sqrt2-3\right)i}
      $$

      cuyo argumento es $112{,}5^{\circ}-157{,}5^{\circ} = -45^{\circ}$ ✔

      Y uno que debe fallar, del arco derecho: $\overline z = 1{,}243$ da
      $+135^{\circ}$ ✗, como se ha visto arriba.

      Coherencia final: el arco elegido está **más lejos** del segmento que el
      otro, y eso es lo que tiene que pasar — cuanto más lejos se mira, más
      pequeño se ve el segmento, y $45^{\circ}$ es menor que los $135^{\circ}$
      del arco cercano.

      ### Resultado

      $$
      \boxed{\;(x+3)^{2}+y^{2} = 18 \quad\text{con}\quad x<0\;}
      $$

  - id: ex2021-2-exponencial-en-el-eje-real
    titulo: Una exponencial cuyas soluciones son reales
    fuente: >-
      Ejercicio 2 · Primera evaluación, 19 de octubre de 2020 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    nivel: examen
    enunciado: |
      Resolver la ecuación

      $$
      e^{-iz} = -\frac{\sqrt{3}}{2}+\frac{i}{2},
      \qquad z \in \mathbb{C}
      $$

      y representar gráficamente la solución.
    pide: Resolver la ecuación y representar las soluciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántas soluciones tiene una ecuación $e^{w} = c$ con $c \neq 0$?
        opciones:
          - texto: >-
              **Infinitas**, porque la exponencial compleja es periódica de
              periodo $2\pi i$
            correcta: true
            mensaje: |
              Eso es. $e^{w+2\pi i} = e^{w}$, así que la exponencial no es
              inyectiva y cada valor se alcanza infinitas veces. Eso es
              exactamente lo que recoge el $2\pi k$ del logaritmo complejo.
          - texto: Una sola, la que da el logaritmo
            mensaje: |
              En $\mathbb{R}$ sí, porque la exponencial real es inyectiva. En
              $\mathbb{C}$ no lo es: $e^{0} = e^{2\pi i} = 1$. El logaritmo
              complejo es multivaluado precisamente por eso.
          - texto: Ninguna, porque la exponencial nunca es negativa
            mensaje: |
              La exponencial **compleja** sí toma valores negativos y
              complejos: $e^{i\pi} = -1$. Lo único que no alcanza nunca es el
              cero.
          - texto: Depende del módulo de $c$
            mensaje: |
              No: mientras $c \neq 0$, siempre hay infinitas. El módulo influye
              en **dónde** están, no en cuántas.

      - tipo: calcular
        titulo: El argumento del segundo miembro
        pregunta: |
          ¿Cuál es el argumento de $-\frac{\sqrt3}{2}+\frac{i}{2}$, en grados?
        respuesta:
          tipo: numero
          valor: '150'
          tolerancia: 0.5
          formato: un número de grados
        distractores:
          - valor: '-30'
            mensaje: |
              $-30^{\circ}$ es lo que da el arcotangente a secas:
              $\arctan\frac{1/2}{-\sqrt3/2} = \arctan\left(-\frac{1}{\sqrt3}\right)$.
              Pero el afijo está en el **segundo** cuadrante —real negativa,
              imaginaria positiva— y el arcotangente nunca devuelve ángulos de
              ahí. Hay que sumar $180^{\circ}$.
          - valor: '30'
            mensaje: |
              $30^{\circ}$ sería el argumento de $\frac{\sqrt3}{2}+\frac{i}{2}$,
              con la parte real **positiva**. Aquí es negativa.
          - valor: '210'
            mensaje: |
              $210^{\circ}$ está en el tercer cuadrante, donde las dos partes
              son negativas. Aquí la imaginaria es $+\frac12$.
        pista: |
          Módulo 1, parte real negativa y parte imaginaria positiva: segundo
          cuadrante.
        desarrollo: |
          $$
          \left|-\tfrac{\sqrt3}{2}+\tfrac{i}{2}\right|
          = \sqrt{\tfrac34+\tfrac14} = 1
          $$

          El afijo está en el **segundo cuadrante**, así que el argumento no es
          el que da el arcotangente:

          $$
          \arg = 180^{\circ}-30^{\circ} = 150^{\circ} = \frac{5\pi}{6}
          $$

          Se comprueba: $\cos150^{\circ} = -\frac{\sqrt3}{2}$ y
          $\mathrm{sen}\,150^{\circ} = \frac12$ ✔
        veredicto: |
          Que el módulo valga exactamente 1 es lo que hará que las soluciones
          salgan **reales**: el logaritmo de 1 es 0 y no aporta parte
          imaginaria.

      - tipo: calcular
        titulo: La solución principal
        pregunta: |
          ¿Cuál es la solución con $k=0$? En forma exacta, o con su valor numérico.
        respuesta:
          tipo: numero
          valor: '-2.6179939'
          tolerancia: 0.005
          formato: un número, o una expresión como -5π/6
        distractores:
          - valor: '2.6179939'
            mensaje: |
              Signo cambiado. Al despejar de $-iz = i\frac{5\pi}{6}$ hay que
              multiplicar por $i$, y $i\cdot i = -1$: la solución es
              $-\frac{5\pi}{6}$.
          - valor: '0.5235988'
            mensaje: |
              $\frac{\pi}{6} = 30^{\circ}$ es el ángulo auxiliar del
              arcotangente, no el argumento. El argumento es
              $\frac{5\pi}{6}$.
          - valor: '-0.5235988'
            mensaje: |
              Otra vez $30^{\circ}$ en vez de $150^{\circ}$. El afijo está en el
              segundo cuadrante.
        pista: |
          $-iz = i\left(\frac{5\pi}{6}+2\pi k\right)$. Multiplica los dos
          miembros por $i$.
        desarrollo: |
          Tomando logaritmos, y como el módulo es 1 y $\ln 1 = 0$:

          $$
          -iz = \ln 1 + i\left(\frac{5\pi}{6}+2\pi k\right)
              = i\left(\frac{5\pi}{6}+2\pi k\right)
          $$

          Multiplicando por $i$, y usando $i\cdot(-i) = 1$ y $i\cdot i = -1$:

          $$
          z = i\cdot i\left(\frac{5\pi}{6}+2\pi k\right)
            = -\left(\frac{5\pi}{6}+2\pi k\right)
          $$

          Con $k=0$:

          $$
          z = -\frac{5\pi}{6} \approx -2{,}618
          $$
        veredicto: |
          Todas las soluciones son **reales**. Es la consecuencia de que el
          segundo miembro tenga módulo exactamente 1.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              El segundo miembro tiene módulo 1 y argumento
              $\frac{5\pi}{6}$, luego vale $e^{i\frac{5\pi}{6}}$.
          - texto: |
              Como la exponencial compleja es periódica de periodo $2\pi i$, al
              tomar logaritmos aparece el término $2\pi k$ con
              $k \in \mathbb{Z}$.
          - texto: |
              $-iz = \ln 1 + i\left(\frac{5\pi}{6}+2\pi k\right)
              = i\left(\frac{5\pi}{6}+2\pi k\right)$.
          - texto: |
              Multiplicando por $i$:
              $z = -\left(\frac{5\pi}{6}+2\pi k\right)$, $k \in \mathbb{Z}$.
          - texto: |
              Todas las soluciones son reales, y sus afijos son puntos del eje
              real separados $2\pi$ entre sí.
          - texto: |
              Como el módulo del segundo miembro es 1, hay exactamente una
              solución.
            trampa: true
            mensaje: |
              El módulo no limita el número de soluciones: hay infinitas para
              cualquier $c \neq 0$. Lo que el módulo 1 determina es **dónde**
              están: como $\ln 1 = 0$, no hay parte imaginaria y todas caen
              sobre el eje real. Con otro módulo estarían sobre una recta
              horizontal desplazada.
        veredicto: |
          Compara con el ejercicio 1.14 del boletín, $e^{iz} = 1+i$: allí el
          módulo era $\sqrt2$ y las soluciones caían en una recta **por debajo**
          del eje real. Aquí el módulo es 1 y caen justo encima.

      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 380 165" role="img" width="380" height="165"
               aria-labelledby="f-ex2021-eje-real-t f-ex2021-eje-real-d">
            <title id="f-ex2021-eje-real-t">Las soluciones, todas sobre el eje real y separadas dos pi</title>
            <desc id="f-ex2021-eje-real-d">Todas las soluciones son reales. El valor principal está en menos cinco pi sextos, unos menos dos coma sesenta y dos, y los demás aparecen cada dos pi hacia los dos lados. El módulo del segundo miembro es uno, que es lo que hace que no haya parte imaginaria.</desc>
            <style>
                .f-ex2021-eje-real-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
                .f-ex2021-eje-real-c { stroke: var(--d1); stroke-width: 2.8; fill: none; }
                .f-ex2021-eje-real-c2 { stroke: var(--alt); stroke-width: 2.8; fill: none; }
                .f-ex2021-eje-real-cp { stroke: var(--d1); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
                .f-ex2021-eje-real-cp2 { stroke: var(--alt); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
                .f-ex2021-eje-real-g { stroke: var(--faint); stroke-width: 1.1; fill: none; stroke-dasharray: 3 3; }
                .f-ex2021-eje-real-fue { stroke: var(--faint); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
                .f-ex2021-eje-real-f { fill: var(--live); fill-opacity: .12; stroke: none; }
                .f-ex2021-eje-real-f2 { fill: var(--alt); fill-opacity: .12; stroke: none; }
                .f-ex2021-eje-real-pt { fill: var(--live); }
                .f-ex2021-eje-real-punta { fill: var(--live); stroke: none; }
                .f-ex2021-eje-real-hueco { fill: var(--paper); stroke: var(--live); stroke-width: 2; }
                .f-ex2021-eje-real-o { fill: var(--flag); }
                .f-ex2021-eje-real-n { fill: var(--faint); font-size: 10px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
                .f-ex2021-eje-real-l { font-size: 10.5px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.4px; stroke-linejoin: round; }
            </style>
            <path class="f-ex2021-eje-real-eje" d="M26 82.5L354 82.5M238.2 139L238.2 26"/>
            <path class="f-ex2021-eje-real-eje" d="M187.7 79L187.7 86"/>
            <g class="f-ex2021-eje-real-n"><text x="187.7" y="97.5" text-anchor="middle">−5π/6</text><text x="354" y="74.5" text-anchor="end">Re</text><text x="244.2" y="36">Im</text></g>
            <circle class="f-ex2021-eje-real-pt" cx="66.5" cy="82.5" r="4.4"/>
            <circle class="f-ex2021-eje-real-pt" cx="187.7" cy="82.5" r="4.4"/>
            <circle class="f-ex2021-eje-real-pt" cx="309" cy="82.5" r="4.4"/>
            <path class="f-ex2021-eje-real-g" d="M66.5 82.5L309 82.5"/>
            <text class="f-ex2021-eje-real-n" x="248.3" y="73.5" text-anchor="middle" fill="var(--faint)">2π</text>
            <text class="f-ex2021-eje-real-l" x="14" y="18" text-anchor="start" fill="var(--live)">|−√3/2 + i/2| = 1</text>
          </svg>
        consigna: |
          Dibuja los afijos de las soluciones en el plano complejo. Marca tres
          consecutivos y anota la separación.
        comprueba:
          - punto: |
              Todas las soluciones **sobre el eje real**.
            porque: |
              El segundo miembro tiene módulo $1$, así que su logaritmo no tiene
              parte real y $z$ queda real. Es el resultado que da título al
              ejercicio.
          - punto: |
              El módulo del segundo miembro comprobado:
              $\sqrt{\tfrac34+\tfrac14}=1$.
            porque: |
              Es lo que garantiza que no haya parte imaginaria. Si el módulo
              fuese distinto de $1$, las soluciones saldrían fuera del eje.
          - punto: |
              El valor principal en $z=-\tfrac{5\pi}{6}\approx-2{,}62$.
            porque: |
              El argumento de $-\tfrac{\sqrt3}{2}+\tfrac i2$ es $150^\circ$ —
              segundo cuadrante—, y al despejar cambia de signo. Poner
              $-30^\circ$ por hacer el arcotangente sin mirar el cuadrante es el
              error clásico.
          - punto: |
              Separación de $2\pi$ entre puntos consecutivos, en los dos
              sentidos.
            porque: |
              Es el periodo de la exponencial compleja. Dibujar solo hacia un
              lado es dar media respuesta.
        veredicto: |
          Que un exponente complejo dé soluciones todas reales tiene una causa
          visible: el segundo miembro está en la circunferencia unidad. Anotarlo
          en el dibujo es la justificación más corta.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** Resolver $e^{-iz} = -\frac{\sqrt3}{2}+\frac{i}{2}$ en
      $\mathbb{C}$ y representar las soluciones.

      **Reparto de puntos del examen:** COMP1 1 · COMP2 7 · COMP4 2.

      ### 1 · Por qué hay infinitas soluciones

      La exponencial compleja es **periódica de periodo $2\pi i$**:

      $$
      e^{w+2\pi i} = e^{w}\,e^{2\pi i} = e^{w}
      $$

      No es inyectiva, así que la ecuación $e^{w} = c$ con $c \neq 0$ tiene
      infinitas soluciones. Eso es lo que recoge el $2\pi k$ del logaritmo
      complejo:

      $$
      \ln c = \ln\left|c\right| + i\left(\arg c + 2\pi k\right),
      \qquad k \in \mathbb{Z}
      $$

      Aquí el segundo miembro no es cero, así que la ecuación tiene solución.

      ### 2 · El segundo miembro, en polar

      $$
      \left|-\frac{\sqrt3}{2}+\frac{i}{2}\right|
      = \sqrt{\frac34+\frac14} = \sqrt1 = 1
      $$

      La parte real es negativa y la imaginaria positiva: el afijo está en el
      **segundo cuadrante**. Con $\tan\theta = \frac{1/2}{-\sqrt3/2}
      = -\frac{1}{\sqrt3}$, los ángulos candidatos son $-30^{\circ}$ y
      $150^{\circ}$, y hay que quedarse con el del segundo cuadrante:

      $$
      \arg = 150^{\circ} = \frac{5\pi}{6}
      $$

      Se comprueba: $\cos\frac{5\pi}{6} = -\frac{\sqrt3}{2}$ y
      $\mathrm{sen}\,\frac{5\pi}{6} = \frac12$ ✔

      $$
      -\frac{\sqrt3}{2}+\frac{i}{2} = e^{i\frac{5\pi}{6}}
      $$

      ### 3 · Tomar logaritmos y despejar

      $$
      -iz = \ln 1 + i\left(\frac{5\pi}{6}+2\pi k\right)
      $$

      Y aquí entra el detalle que decide el signo: **$\ln 1 = 0$**, así que no
      hay parte real en el logaritmo.

      $$
      -iz = i\left(\frac{5\pi}{6}+2\pi k\right)
      $$

      Multiplicando los dos miembros por $i$ —que es lo mismo que dividir entre
      $-i$—, y usando $i\cdot(-i) = 1$ en la izquierda e $i\cdot i = -1$ en la
      derecha:

      $$
      z = -\left(\frac{5\pi}{6}+2\pi k\right), \qquad k \in \mathbb{Z}
      $$

      o, cambiando el nombre del índice, $z = -\frac{5\pi}{6}+2\pi m$.

      ### 4 · La observación que vale los dos puntos de COMP4

      **Todas las soluciones son números reales.** No es casualidad: el
      logaritmo aporta su parte real a través de $\ln\left|c\right|$, y aquí
      $\left|c\right| = 1$, así que ese término se anula. Al multiplicar por
      $i$, lo que era parte imaginaria pasa a ser parte real, y no queda nada
      en la otra.

      Merece la pena compararlo con el ejercicio 1.14 del boletín,
      $e^{iz} = 1+i$: allí el módulo era $\sqrt2$, el logaritmo aportaba
      $\ln\sqrt2$ y las soluciones caían sobre una recta horizontal **por
      debajo** del eje real. Aquí caen justo **sobre** el eje.

      ### 5 · Representación gráfica

      Puntos del **eje real**, equiespaciados $2\pi \approx 6{,}28$:

      $$
      \dots,\; -\frac{5\pi}{6}-2\pi,\; -\frac{5\pi}{6},\;
      -\frac{5\pi}{6}+2\pi,\; \dots
      $$

      es decir, aproximadamente

      $$
      \dots,\; -8{,}90,\quad -2{,}62,\quad 3{,}67,\quad 9{,}95,\;\dots
      $$

      Una sucesión infinita de puntos sobre una recta, no un único punto.

      ### 6 · Comprobación

      Con $k=0$, $z = -\frac{5\pi}{6}$:

      $$
      -iz = -i\left(-\frac{5\pi}{6}\right) = i\,\frac{5\pi}{6}
      $$

      $$
      e^{i\frac{5\pi}{6}} = \cos\frac{5\pi}{6}+i\,\mathrm{sen}\,\frac{5\pi}{6}
      = -\frac{\sqrt3}{2}+\frac{i}{2} \quad\checkmark
      $$

      Con $k=-1$, $z = -\frac{5\pi}{6}+2\pi = \frac{7\pi}{6}$:

      $$
      -iz = -i\,\frac{7\pi}{6}
      \;\Longrightarrow\;
      e^{-i\frac{7\pi}{6}} = e^{i\left(2\pi-\frac{7\pi}{6}\right)}
      = e^{i\frac{5\pi}{6}} \quad\checkmark
      $$

      Las dos dan lo mismo, como tiene que ser.

      ### Resultado

      $$
      \boxed{\;z = -\frac{5\pi}{6}+2\pi k,\qquad k \in \mathbb{Z}\;}
      $$

  - id: ex2021-3-definiciones-supremo-infimo
    titulo: Seis definiciones, y un supremo que no se alcanza
    fuente: >-
      Ejercicio 3 · Primera evaluación, 19 de octubre de 2020 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 1
      comp4: 7

    nivel: examen
    enunciado: |
      **a)** Definir formalmente los siguientes conceptos: sucesión creciente,
      sucesión decreciente, sucesión acotada, supremo, ínfimo y sucesión
      convergente.

      **b)** Estudiar dichos conceptos para la sucesión
      $\{a_n\}_{n\in\mathbb{N}}$ definida de la siguiente forma:

      $$
      \{a_n\}_{n\in\mathbb{N}} =
      \begin{cases}
      \left(\dfrac{4}{5}\right)^{n} & n < 20 \\[10pt]
      1-\dfrac{1}{n} & n \ge 20
      \end{cases}
      $$

      **c)** Sea $\{a_n\}_{n\in\mathbb{N}}$ la sucesión definida en el apartado
      anterior. ¿Es convergente la serie
      $\displaystyle\sum_{n=1}^{\infty} a_n$?
    pide: Definir, estudiar la sucesión y decidir sobre la serie.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué diferencia hay entre supremo y máximo?
        opciones:
          - texto: >-
              El supremo es la **menor cota superior**; es máximo solo si además
              **se alcanza**
            correcta: true
            mensaje: |
              Exacto, y en esta sucesión se ve: el supremo vale 1 y ningún
              término llega a valer 1, porque $1-\frac1n < 1$ siempre. Hay
              supremo pero no hay máximo.
          - texto: Ninguna, son dos nombres para lo mismo
            mensaje: |
              No lo son. Toda sucesión acotada superiormente tiene supremo, pero
              solo tiene máximo si algún término lo alcanza. Aquí hay supremo
              y no hay máximo.
          - texto: El máximo es el límite y el supremo es la cota
            mensaje: |
              El límite y el máximo son cosas distintas: una sucesión puede
              alcanzar su máximo al principio y converger a otro sitio. En este
              ejercicio coinciden supremo y límite, pero eso es una
              particularidad, no la regla.
          - texto: >-
              El supremo solo existe si la sucesión es creciente
            mensaje: |
              Existe siempre que la sucesión esté acotada superiormente, sea
              monótona o no. Esta no es monótona y tiene supremo.

      - tipo: calcular
        titulo: El ínfimo
        pregunta: |
          ¿Cuál es el menor valor que toma la sucesión?
        respuesta:
          tipo: numero
          valor: '0.01441'
          tolerancia: 0.00005
          formato: un número en forma exacta, o con cinco decimales
        distractores:
          - valor: '0'
            mensaje: |
              0 sería el ínfimo si el primer tramo siguiera para siempre, porque
              $\left(\frac45\right)^{n} \to 0$. Pero se corta en $n=19$, y a
              partir de ahí la sucesión salta a valores cercanos a 1.
          - valor: '0.8'
            mensaje: |
              $0{,}8$ es $a_1$, el **primer** término. Pero el primer tramo
              decrece, así que el menor está al final de ese tramo, en $n=19$.
          - valor: '0.95'
            mensaje: |
              $0{,}95$ es $a_{20}$, el primer término del segundo tramo. Es
              mucho mayor que el final del primero.
        pista: |
          El primer tramo decrece y llega hasta $n=19$. Calcula
          $\left(\frac45\right)^{19}$.
        desarrollo: |
          El primer tramo, $\left(\frac45\right)^{n}$, es **decreciente** porque
          la base está entre 0 y 1. Su menor valor es el último, en $n=19$
          —la condición es $n<20$, estricta—:

          $$
          a_{19} = \left(\frac45\right)^{19} = \frac{4^{19}}{5^{19}}
          \approx 0{,}01441
          $$

          El segundo tramo, $1-\frac1n$ con $n\ge20$, vale como poco
          $a_{20} = 0{,}95$: mucho más.

          Así que el ínfimo es $a_{19} \approx 0{,}01441$, y **se alcanza**: es
          mínimo.
        veredicto: |
          Ínfimo que sí es mínimo, y supremo que no es máximo. La misma sucesión
          sirve para las dos cosas.

      - tipo: justificar
        pregunta: |
          Ordena el estudio de la sucesión y la serie. Una de las piezas no
          debe entrar.
        piezas:
          - texto: |
              **No es creciente:** el primer tramo decrece, $a_1 = 0{,}8 >
              0{,}64 = a_2$.
          - texto: |
              **No es decreciente:** en el empalme sube de golpe,
              $a_{19} \approx 0{,}0144$ y $a_{20} = 0{,}95$.
          - texto: |
              **Es acotada:** $a_{19} \le a_n < 1$ para todo $n$.
          - texto: |
              **Ínfimo** $= a_{19} = \left(\frac45\right)^{19}$, y **es
              mínimo** porque se alcanza. **Supremo** $= 1$, y **no es
