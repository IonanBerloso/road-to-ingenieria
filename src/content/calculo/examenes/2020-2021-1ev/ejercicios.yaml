ejercicios:
  - id: ex2021-1-arco-capaz
    titulo: El arco desde el que un segmento se ve bajo 45 grados
    fuente: >-
      Ejercicio 1 · Primera evaluación, 19 de octubre de 2020 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3

    nivel: examen
    enunciado: |
      Calcular y representar geométricamente los afijos de los números
      complejos $z$ que verifican la condición siguiente:

      $$
      \arg\left(\frac{\overline{z}+3i}{\overline{z}-3i}\right) = -\frac{\pi}{4}
      $$
    pide: Calcular el lugar geométrico y representarlo.

    pasos:
      - tipo: reconocer
        pregunta: |
          Una diferencia de argumentos constante entre dos puntos fijos, ¿qué
          lugar geométrico da?
        opciones:
          - texto: >-
              Un **arco de circunferencia** que pasa por los dos puntos: el arco
              capaz
            correcta: true
            mensaje: |
              Eso es. Es el teorema del ángulo inscrito: los puntos desde los
              que un segmento se ve bajo un ángulo fijo forman un arco. El caso
              de $\frac{\pi}{2}$, que da la circunferencia de diámetro el
              segmento, es solo el más conocido.
          - texto: Una circunferencia completa
            mensaje: |
              La circunferencia entera no: en el otro arco el segmento se ve
              bajo el ángulo **suplementario**, y además el signo del argumento
              cambia. Solo vale uno de los dos arcos.
          - texto: Una circunferencia de Apolonio
            mensaje: |
              Apolonio aparece cuando lo constante es el **cociente de
              módulos**. Aquí lo que se fija es el argumento, no el módulo, y
              son dos lugares distintos.
          - texto: Una recta
            mensaje: |
              La recta sale cuando la diferencia de argumentos vale $0$ o
              $\pi$: entonces los tres puntos están alineados. Con cualquier
              otro ángulo la figura se curva.

      - tipo: calcular
        titulo: El radio del arco
        pregunta: |
          El segmento va de $-3i$ a $3i$ y se ve bajo $45^{\circ}$. ¿Cuál es el
          radio de la circunferencia que contiene al arco?
        respuesta:
          tipo: numero
          valor: '4.2426407'
          tolerancia: 0.005
          formato: un número, o una expresión como 3√2
        distractores:
          - valor: '3'
            mensaje: |
              3 es la **semicuerda**, la distancia del centro del segmento a
              cada extremo. El radio es mayor: sale de
              $6 = 2R\,\mathrm{sen}\,45^{\circ}$.
          - valor: '6'
            mensaje: |
              6 es la **cuerda** entera, la longitud del segmento de $-3i$ a
              $3i$. Con un ángulo de $45^{\circ}$ el radio es
              $\frac{6}{2\,\mathrm{sen}\,45^{\circ}} = 3\sqrt2$.
          - valor: '2.1213203'
            mensaje: |
              $\frac{3\sqrt2}{2}$ es la mitad del radio. La relación cuerda-radio
              es $c = 2R\,\mathrm{sen}\,\theta$, así que
              $R = \frac{c}{2\,\mathrm{sen}\,\theta}$.
        pista: |
          La cuerda mide 6 y el ángulo inscrito es $45^{\circ}$. Usa
          $c = 2R\,\mathrm{sen}\,\theta$.
        desarrollo: |
          La relación entre una cuerda y el ángulo inscrito que la abarca es

          $$
          c = 2R\,\mathrm{sen}\,\theta
          $$

          Con $c = \left|3i-(-3i)\right| = 6$ y $\theta = 45^{\circ}$:

          $$
          6 = 2R\cdot\frac{\sqrt2}{2} = R\sqrt2
          \;\Longrightarrow\;
          R = \frac{6}{\sqrt2} = 3\sqrt2 \approx 4{,}2426
          $$
        veredicto: |
          Con $\theta = 90^{\circ}$ saldría $R = 3$, la circunferencia de
          diámetro el segmento. Al ser el ángulo menor, el arco se «abre» y el
          radio crece.

      - tipo: calcular
        titulo: El centro
        pregunta: |
          ¿Cuál es la abscisa del centro de esa circunferencia?
        respuesta:
          tipo: numero
          valor: '-3'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              El valor absoluto es correcto —hay dos circunferencias posibles,
              en $(3,0)$ y en $(-3,0)$—, pero el **signo** lo decide el signo
              del argumento. Con $-\frac{\pi}{4}$ es la de la izquierda; con
              $+\frac{\pi}{4}$, la de la derecha.
          - valor: '0'
            mensaje: |
              Si el centro estuviera en el origen, el segmento sería un diámetro
              y el ángulo inscrito valdría $90^{\circ}$, no $45^{\circ}$.
          - valor: '4.2426407'
            mensaje: |
              $3\sqrt2$ es el radio, no la abscisa del centro. La distancia del
              centro al punto medio de la cuerda es
              $\sqrt{R^{2}-3^{2}} = \sqrt{18-9} = 3$.
        pista: |
          El centro está en la mediatriz de la cuerda —el eje real— y a
          distancia $\sqrt{R^{2}-3^{2}}$ del origen. El signo lo da probar un
          punto.
        desarrollo: |
          El centro está sobre la mediatriz del segmento, que es el **eje
          real**, y a distancia

          $$
          d = \sqrt{R^{2}-3^{2}} = \sqrt{18-9} = 3
          $$

          del punto medio, que es el origen. Hay dos candidatos: $(3,0)$ y
          $(-3,0)$. El signo del argumento desempata, y se decide probando.

          Con $\overline z = -3-3\sqrt2$, un punto de la circunferencia
          izquierda:

          $$
          \arg\left(\overline z+3i\right) = 157{,}5^{\circ},
          \qquad
          \arg\left(\overline z-3i\right) = -157{,}5^{\circ}
          $$

          $$
          157{,}5^{\circ}-(-157{,}5^{\circ}) = 315^{\circ} \equiv -45^{\circ}
          \quad\checkmark
          $$

          Con la derecha saldría $+45^{\circ}$. Luego el centro es $(-3,0)$.
        veredicto: |
          El signo del argumento no es un detalle: elige entre dos
          circunferencias simétricas. Probar un punto es la forma rápida de
          decidirlo.

      - tipo: verificar
        pregunta: |
          Escribe en $x$ e $y$ el arco que sale, con la condición que selecciona el
          trozo correcto. La figura comprobará si coincide con la del enunciado.
        condicion: 'arg((conj(z)+3i)/(conj(z)-3i)) = -pi/4'
        ventana:
          x: [-10, 10]
          y: [-9, 9]
        formato: en x e y; usa & para juntar dos condiciones
        pista: |
          Conjugar arriba y abajo cambia el signo del argumento, así que la
          condición equivale a $\arg\frac{z-3i}{z+3i} = \frac{\pi}{4}$: el segmento
          que une $3i$ con $-3i$ se ve bajo $45^\circ$.
        desarrollo: |
          Como $\overline{z}+3i = \overline{z-3i}$ y $\overline{z}-3i =
          \overline{z+3i}$, el cociente es el conjugado de $\frac{z-3i}{z+3i}$, y
          conjugar cambia el signo del argumento. La condición queda

          $$
          \arg\frac{z-3i}{z+3i} = \frac{\pi}{4}
          $$

          que es el arco capaz de $45^\circ$ sobre el segmento de $-3i$ a $3i$. El
          ángulo inscrito es $45^\circ$, luego el central es $90^\circ$; con la
          cuerda de longitud $6$,

          $$
          R = \frac{6}{2\,\mathrm{sen}\,45^\circ} = 3\sqrt2
          $$

          El centro está en la mediatriz de la cuerda —el eje real— a distancia
          $\sqrt{18-9}=3$ del origen. El signo del argumento deja el de la izquierda:

          $$
          (x+3)^{2}+y^{2} = 18, \qquad x < 0
          $$
        veredicto: |
          El **arco de la izquierda** de la circunferencia de centro $-3$ y radio
          $3\sqrt2$, con los extremos $\pm 3i$ excluidos. Quedarse con la
          circunferencia entera, o con el arco de la derecha, es no haber mirado el
          signo del argumento.
      - tipo: justificar
        pregunta: |
          Ordena la descripción del lugar geométrico. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              La condición dice
              $\arg\left(\overline z+3i\right)-\arg\left(\overline z-3i\right)
              = -\frac{\pi}{4}$: desde $\overline z$, el segmento que une
              $-3i$ y $3i$ se ve bajo $45^{\circ}$.
          - texto: |
              Por el teorema del ángulo inscrito, esos puntos forman un **arco**
              de la circunferencia que pasa por $-3i$ y $3i$, con
              $R = \frac{6}{2\,\mathrm{sen}\,45^{\circ}} = 3\sqrt2$ y centro en
              $(\pm3, 0)$.
          - texto: |
              El signo negativo del argumento selecciona el centro $(-3,0)$ y,
              dentro de esa circunferencia, el arco **mayor**, el de $x<0$.
          - texto: |
              Los extremos $3i$ y $-3i$ quedan excluidos: en uno se anula el
              denominador y en el otro el numerador.
          - texto: |
              Como la circunferencia es simétrica respecto del eje real y el
              arco también lo es, **conjugar no cambia nada**: el lugar de $z$
              es el mismo que el de $\overline z$.
          - texto: |
              Como la condición está escrita en $\overline z$, el lugar de $z$
              es el simétrico respecto del eje imaginario.
            trampa: true
            mensaje: |
              Conjugar refleja respecto del eje **real**, no del imaginario. Y
              aquí ni siquiera cambia nada: tanto la circunferencia de centro
              $(-3,0)$ como el arco de $x<0$ son simétricos respecto del eje
              real, así que el conjunto es su propio reflejo. Conviene decirlo
              en vez de darlo por supuesto.
        veredicto: |
          Ese último paso es el que casi nadie escribe. Que conjugar no cambie
          el resultado hay que **comprobarlo**, no suponerlo.

      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 340 265" role="img" width="340" height="265"
