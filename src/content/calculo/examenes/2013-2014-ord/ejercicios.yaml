      </svg>
      <figcaption>
      La sección meridiana. El cuenco parabólico sube desde el origen hasta la
      altura 4, donde el radio vale 2, y desde ahí el cono se cierra en punta en
      la altura 6.
      </figcaption>
      </figure>

      **El área.** Dos superficies curvas y ninguna cara plana:

      $$
      A_{\text{paraboloide}}=2\pi\int_{0}^{2}\sqrt{1+4r^{2}}\;r\,dr
      =\frac{\pi\left(17\sqrt{17}-1\right)}{6}\approx36{,}18
      $$

      $$
      A_{\text{cono}}=\pi R g=\pi\cdot2\cdot2\sqrt2=4\sqrt2\,\pi\approx17{,}77
      $$

      $$
      A\approx53{,}95
      $$

      **b) El centro de gravedad.** Por ser un sólido de revolución con densidad
      uniforme, $\overline{x}=\overline{y}=0$: eso se dice, no se calcula.

      Para la altura, discos horizontales:

      $$
      V=\pi\int_{0}^{4}z\,dz+\pi\int_{4}^{6}(6-z)^{2}dz=8\pi+\frac{8\pi}{3}
      =\frac{32\pi}{3}
      $$

      $$
      \int z\,dV=\pi\int_{0}^{4}z^{2}dz+\pi\int_{4}^{6}z(6-z)^{2}dz
      =\frac{64\pi}{3}+12\pi=\frac{100\pi}{3}
      $$

      $$
      \boxed{\;\overline{z}=\frac{100\pi/3}{32\pi/3}=\frac{25}{8}=3{,}125\;}
      $$

      **La segunda integral, con un cambio que la deja en nada.** Con
      $u=6-z$ se convierte en $\int_{0}^{2}(6-u)u^{2}du=\left[2u^{3}-
      \frac{u^{4}}{4}\right]_{0}^{2}=16-4=12$. Sin el cambio hay que desarrollar
      un cubo.

      **Y la comprobación de sentido, que aquí engaña.** El cuenco tiene tres
      cuartas partes del volumen y está abajo, así que uno esperaría el
      centroide por debajo de la mitad. Sale **por encima**: $3{,}125$ frente a
      $3$. El motivo es que el cuenco es muy estrecho cerca del fondo —su radio
      es $\sqrt z$, casi cero al principio— y casi todo su volumen está
      concentrado justo debajo de $z=4$. La intuición de «pesa más abajo» falla
      cuando la sección varía tanto.
