ejercicios:
  - id: ex1314-ord-1-cuatro-operaciones-sobre-un-rectangulo
    titulo: Cuatro operaciones sobre un rectángulo, y una que no hace nada
    fuente: >-
      Ejercicio 1 del PRIMER CUATRIMESTRAL · Sexta evaluación, 19 de mayo de 2014
      · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 4
      comp2: 3
      comp4: 3
    enunciado: |
      A cada uno de los números complejos $z$ cuyo afijo aparece sombreado en la
      figura, le aplicamos las siguientes operaciones:

      1º) Le sumamos el número complejo $-1-2i$.

      2º) Del número complejo resultante, calculamos su conjugado.

      3º) Al número complejo resultante, lo multiplicamos por $2_{\pi/2}$.

      4º) Del número complejo resultante, calculamos su conjugado.

      Representar gráficamente el lugar geométrico resultante de cada una de
      estas operaciones.

      <figure class="figura-examen">
      <svg viewBox="104 52 186 176" role="img" width="186" height="176"
           aria-labelledby="rec14-t rec14-d">
        <title id="rec14-t">El rectangulo sombreado del enunciado</title>
        <desc id="rec14-d">Un rectangulo sombreado en el primer cuadrante, entre dos
        y tres en horizontal y entre uno y tres en vertical.</desc>
        <style>
          .rec14-r { fill: var(--live); fill-opacity: .18; stroke: var(--live); stroke-width: 2.2; }
          .rec14-eje { stroke: var(--graphite); stroke-width: 1.2; fill: none; }
          .rec14-n { fill: var(--faint); font-size: 11px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
        </style>
        <path class="rec14-eje" d="M115.6 205L266.8 205M130 219.4L130 64.6"/>
        <rect class="rec14-r" x="202" y="97" width="36" height="72"/>
        <g class="rec14-n">
          <text x="166" y="219" text-anchor="middle">1</text>
          <text x="202" y="219" text-anchor="middle">2</text>
          <text x="238" y="219" text-anchor="middle">3</text>
          <text x="123" y="173" text-anchor="end">1</text>
          <text x="123" y="137" text-anchor="end">2</text>
          <text x="123" y="101" text-anchor="end">3</text>
          <text x="270.8" y="219">x</text>
          <text x="136" y="66.6">y</text>
        </g>
      </svg>
      <figcaption>
      El rectángulo sombreado del enunciado, redibujado: los complejos con parte
      real entre 2 y 3 y parte imaginaria entre 1 y 3.
      </figcaption>
      </figure>
    pide: Los cuatro lugares, dibujados.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué significa la notación $2_{\pi/2}$?
        opciones:
          - texto: >-
              El complejo de módulo $2$ y argumento $\frac\pi2$, es decir $2i$
            correcta: true
            mensaje: |
              Eso es. Es la forma polar abreviada: el subíndice es el argumento.
              Multiplicar por él **gira** un cuarto de vuelta en sentido
              positivo y **duplica** el módulo.
          - texto: $2$ elevado a $\frac\pi2$
            mensaje: |
              El subíndice no es un exponente: si lo fuera, sería un número real
              y la operación no giraría nada. La notación $r_{\alpha}$ es la
              forma polar.
          - texto: $\dfrac{2}{\pi/2}$, o sea $\dfrac4\pi$
            mensaje: |
              Tampoco es un cociente. Es notación polar, y el ejercicio la usa
              precisamente porque la operación se entiende mejor así: girar y
              escalar.

      - tipo: calcular
        titulo: La región después de la primera operación
        pregunta: |
          Tras sumar $-1-2i$, ¿cuál es el valor **mínimo** de la parte
          imaginaria?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              El $1$ es el mínimo **antes** de sumar. Restar $2$ a todo el
              intervalo $[1,3]$ lo deja en $[-1,1]$.
          - valor: '-2'
            mensaje: |
              $-2$ es lo que se resta, no el resultado. El mínimo pasa de $1$ a
              $1-2=-1$.
          - valor: '3'
            mensaje: |
              $3$ es el **máximo** de la parte imaginaria de partida. Después de
              sumar, el máximo es $1$ y el mínimo $-1$.
        pista: |
          El rectángulo de partida es $[2,3]\times[1,3]$; sumar $-1-2i$ lo
          traslada una unidad a la izquierda y dos hacia abajo.
        desarrollo: |
          $$
          R_{0}=[2,3]\times[1,3]
          \;\longrightarrow\;
          R_{1}=[1,2]\times[-1,1]
          $$

          Y ahí aparece lo interesante: $R_{1}$ es **simétrico respecto del eje
          real**.

      - tipo: calcular
        titulo: La región después de la tercera
        pregunta: |
          Tras multiplicar por $2_{\pi/2}$, ¿cuál es el valor **máximo** de la
          parte imaginaria?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es el **mínimo** de la parte imaginaria después de girar. Al
              multiplicar por $2i$, la parte imaginaria nueva es el doble de la
              parte **real** vieja, que iba de $1$ a $2$.
          - valor: '1'
            mensaje: |
              $1$ es el máximo de la parte imaginaria **antes** de multiplicar.
              El giro de noventa grados intercambia los papeles de las dos
              coordenadas.
          - valor: '8'
            mensaje: |
              $8$ saldría de duplicar dos veces. Solo hay un factor $2$ en la
              operación: el módulo se multiplica una vez.
        pista: |
          $2i(x+iy)=-2y+2xi$: la parte imaginaria nueva es $2x$, con $x\in[1,2]$.
        desarrollo: |
          $$
          2i\,(x+iy)=-2y+2xi
          $$

          Con $x\in[1,2]$ e $y\in[-1,1]$: la parte real nueva es $-2y\in[-2,2]$
          y la imaginaria nueva es $2x\in[2,4]$.

          $$
          R_{3}=[-2,2]\times[2,4]
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La región de partida es $R_{0}=[2,3]\times[1,3]$, y sumar
              $-1-2i$ la traslada a $R_{1}=[1,2]\times[-1,1]$.
          - texto: >-
              $R_{1}$ es simétrico respecto del eje real, así que conjugarlo lo
              deja **igual**: $R_{2}=R_{1}$. Es la única de las cuatro
              operaciones que no cambia el dibujo.
          - texto: >-
              Multiplicar por $2_{\pi/2}=2i$ gira un cuarto de vuelta y duplica:
              $R_{3}=[-2,2]\times[2,4]$; y el último conjugado lo refleja,
              $R_{4}=[-2,2]\times[-4,-2]$.
          - texto: >-
              Como la segunda operación no cambia nada, se puede quitar del
              enunciado sin que cambie el resultado final.
            trampa: true
            mensaje: |
              No cambia nada **en este caso**, y solo porque $R_{1}$ resultó ser
              simétrico. Quitarla del enunciado sería quitar una operación de la
              composición: $\operatorname{conj}\!\left(2i\,z\right)$ no es lo
              mismo que $\operatorname{conj}\!\left(2i\,\operatorname{conj}
              z\right)$ para un $z$ cualquiera. Lo que se está evaluando es
              justamente darse cuenta de que aquí sí da igual, y decir por qué.
    resolucion: |
      **Las cuatro regiones.** Partiendo de $R_{0}=[2,3]\times[1,3]$:

      | operación | resultado |
      |---|---|
      | 1.ª sumar $-1-2i$ | $R_{1}=[1,2]\times[-1,1]$ |
      | 2.ª conjugar | $R_{2}=R_{1}$ |
      | 3.ª multiplicar por $2_{\pi/2}$ | $R_{3}=[-2,2]\times[2,4]$ |
      | 4.ª conjugar | $R_{4}=[-2,2]\times[-4,-2]$ |

      <figure class="figura-examen">
      <svg viewBox="0 0 430 400" role="img" width="430" height="400"
           aria-labelledby="ope14-t ope14-d">
        <title id="ope14-t">El rectangulo de partida y los tres que resultan</title>
        <desc id="ope14-d">Cuatro rectangulos en el mismo plano. El de partida esta
        arriba a la derecha, entre dos y tres en horizontal y entre uno y tres en
        vertical. El que sale de sumar y conjugar queda a caballo del eje horizontal,
        entre uno y dos. El de multiplicar por dos i queda arriba, ancho y bajo, y el
        ultimo es su reflejo por debajo del eje.</desc>
        <style>
          .ope14-r0 { fill: var(--graphite); fill-opacity: .16; stroke: var(--graphite); stroke-width: 2; }
          .ope14-r1 { fill: var(--live); fill-opacity: .16; stroke: var(--live); stroke-width: 2.2; }
          .ope14-r3 { fill: var(--alt); fill-opacity: .14; stroke: var(--alt); stroke-width: 2.2; }
          .ope14-r4 { fill: var(--flag); fill-opacity: .12; stroke: var(--flag); stroke-width: 2.2; }
          .ope14-eje { stroke: var(--graphite); stroke-width: 1.2; fill: none; }
          .ope14-n { fill: var(--faint); font-size: 11px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
          .ope14-e0 { fill: var(--graphite); font-size: 11px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round; }
          .ope14-e1 { fill: var(--live); font-size: 11px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round; }
          .ope14-e3 { fill: var(--alt); font-size: 11px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round; }
          .ope14-e4 { fill: var(--flag); font-size: 11px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.5px; stroke-linejoin: round; }
        </style>
        <path class="ope14-eje" d="M22 205L274 205M130 385L130 25"/>
        <rect class="ope14-r3" x="58" y="61" width="144" height="72"/>
        <rect class="ope14-r0" x="202" y="97" width="36" height="72"/>
        <rect class="ope14-r1" x="166" y="169" width="36" height="72"/>
        <rect class="ope14-r4" x="58" y="277" width="144" height="72"/>
        <g class="ope14-n">
          <text x="58" y="219" text-anchor="middle">-2</text>
          <text x="94" y="219" text-anchor="middle">-1</text>
          <text x="166" y="219" text-anchor="middle">1</text>
          <text x="202" y="219" text-anchor="middle">2</text>
          <text x="238" y="219" text-anchor="middle">3</text>
          <text x="123" y="353" text-anchor="end">-4</text>
          <text x="123" y="281" text-anchor="end">-2</text>
          <text x="123" y="137" text-anchor="end">2</text>
          <text x="123" y="65" text-anchor="end">4</text>
          <text x="278" y="199">x</text>
          <text x="136" y="27">y</text>
        </g>
        <text class="ope14-e0" x="244" y="89">R de partida</text>
        <text class="ope14-e1" x="210" y="235">tras 1.ª y 2.ª</text>
        <text class="ope14-e3" x="58" y="53">tras 3.ª</text>
        <text class="ope14-e4" x="58" y="365">tras 4.ª</text>
      </svg>
      <figcaption>
      Los cuatro lugares. En gris el de partida; en verde el que sale de sumar y
      de conjugar, que son el mismo; en morado el de multiplicar por dos i, y en
      rojo el del último conjugado.
      </figcaption>
      </figure>

      **Lo que hace cada una, en palabras.** Sumar es **trasladar**; conjugar es
      **reflejar en el eje real**; multiplicar por $2_{\pi/2}=2i$ es **girar
      $90^{\circ}$ y duplicar**. Un rectángulo de lados paralelos a los ejes
      sigue siéndolo tras un giro de $90^{\circ}$, con los lados intercambiados:
      el de $1\times2$ se convierte en uno de $4\times2$.

      **La sorpresa del apartado 2.º** Después de trasladar, la región es
      $[1,2]\times[-1,1]$, **simétrica respecto del eje real**. Conjugar refleja
      cada punto, pero el conjunto entero queda igual. El dibujo no cambia — y
      decirlo, con la razón, es la mitad de los puntos de explicación.

      **La composición, de un tirón.** Como $\operatorname{conj}(ab)=
      \operatorname{conj}(a)\operatorname{conj}(b)$ y conjugar dos veces
      devuelve el número:

      $$
      w=\overline{2i\cdot\overline{z-1-2i}}
      =\overline{2i}\cdot\left(z-1-2i\right)
      =-2i\left(z-1-2i\right)
      $$

      Es decir: trasladar y luego girar $-90^{\circ}$ duplicando. Los dos
      conjugados **se convierten en uno solo**, aplicado al factor. Comprobación
      con el vértice $z=3+3i$: $-2i(2+i)=-4i+2=2-4i$, que es la esquina de
      $R_{4}$ ✓.

      **Por qué este ejercicio da cuatro puntos de COMP 1 y solo tres de
      cálculo.** Porque no hay casi nada que calcular: lo que se evalúa es
      reconocer qué transformación geométrica es cada operación, y ver que la
      segunda es la identidad **sobre esta región concreta**.

  - id: ex1314-ord-2-barrow-y-la-campana-de-gauss
    titulo: Una integral que no se sabe hacer, y aun así se estudia entera
    fuente: >-
      Ejercicio 2 del PRIMER CUATRIMESTRAL · Sexta evaluación, 19 de mayo de 2014
      · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 5
      comp4: 4
    enunciado: |
      Enunciar y demostrar el teorema fundamental del Cálculo Infinitesimal.
      Aplíquese este teorema para estudiar los extremos relativos y los puntos
      de inflexión de la función:
      $$
      F(t)=\int_{0}^{t}e^{-\frac{z^{2}}{2}}\,dz
      $$
    pide: El enunciado y la demostración del teorema, y el estudio de F.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué se puede estudiar $F$ sin resolver la integral?
        opciones:
          - texto: >-
              Porque el teorema fundamental da $F'$ directamente, y con $F'$ y
              $F''$ basta para extremos e inflexiones
            correcta: true
            mensaje: |
              Eso es, y aquí es imprescindible: la primitiva de
              $e^{-z^{2}/2}$ **no se puede escribir** con funciones elementales.
              El teorema es la única vía, y por eso el enunciado lo pide antes.
          - texto: >-
              Porque la integral se resuelve con el cambio $u=z^{2}/2$
            mensaje: |
              Ese cambio da $du=z\,dz$, y arriba no hay ninguna $z$ que lo
              acompañe. De hecho $\int e^{-z^{2}/2}dz$ **no tiene primitiva
              elemental**: es la integral de la campana de Gauss.
          - texto: >-
              Porque $F$ es una constante, al ser una integral definida
            mensaje: |
              Sería constante si los dos límites lo fueran. Aquí el superior es
              $t$, la variable: $F$ es una función de $t$, y eso es justo lo que
              hace falta para derivarla.

      - tipo: calcular
        titulo: La derivada en un punto
        pregunta: |
          ¿Cuánto vale $F'(1)$?
        respuesta:
          tipo: numero
          valor: '0.6065307'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es $F'(0)$. El teorema dice $F'(t)=e^{-t^{2}/2}$, y hay que
              **sustituir** la $t$, no dejar el integrando como estaba.
          - valor: '0.3678794'
            mensaje: |
              $e^{-1}$ saldría con $F'(t)=e^{-t^{2}}$, sin el $2$ del
              denominador. En $t=1$ el exponente es $-\frac12$.
          - valor: '0.8556244'
            mensaje: |
              Ese es el valor de $F(1)$, la integral misma. La pregunta es por
              la derivada.
        pista: |
          $F'(t)$ es el integrando evaluado en $t$.
        desarrollo: |
          $$
          F'(t)=e^{-t^{2}/2}
          \;\Longrightarrow\;
          F'(1)=e^{-1/2}\approx0{,}6065
          $$

      - tipo: calcular
        titulo: El punto de inflexión
        pregunta: |
          ¿En qué punto tiene $F$ su único punto de inflexión?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              En $t=1$ la segunda derivada vale $-e^{-1/2}\approx-0{,}61$: no se
              anula. $F''(t)=-t\,e^{-t^{2}/2}$ solo se anula donde se anula la
              $t$.
          - valor: '-1'
            mensaje: |
              Tampoco: allí $F''=+e^{-1/2}$. La exponencial no se anula nunca,
              así que el único cero de $F''$ es el de su factor $-t$.
          - valor: '1.4142136'
            mensaje: |
              $\sqrt2$ es donde tiene su inflexión la función $e^{-t^{2}/2}$
              —el integrando—, no $F$. Cuidado con confundir la curva con su
              integral: la inflexión del integrando es la de $F'$, o sea el
              punto donde $F$ tiene su tercera derivada nula.
        pista: |
          $F''(t)=-t\,e^{-t^{2}/2}$, y la exponencial no se anula nunca.
        desarrollo: |
          $$
          F''(t)=-t\,e^{-t^{2}/2}
          $$

          Se anula solo en $t=0$, y ahí cambia de signo: positiva a la izquierda
          —$F$ convexa— y negativa a la derecha —cóncava—. Inflexión en el
          origen, y solo ahí.

      - tipo: justificar
        pregunta: Ordena el estudio de $F$. Una pieza es falsa.
        piezas:
          - texto: >-
              El integrando $e^{-z^{2}/2}$ es continuo en todo $\mathbb{R}$, así
              que el teorema fundamental se aplica y $F$ es derivable con
              $F'(t)=e^{-t^{2}/2}$.
          - texto: >-
              Una exponencial nunca se anula, luego $F'>0$ en todo punto: $F$ es
              estrictamente creciente y **no tiene extremos relativos**.
          - texto: >-
              $F''(t)=-t\,e^{-t^{2}/2}$ se anula solo en $t=0$ y cambia de
              signo: hay un único punto de inflexión, en el origen, donde además
              la pendiente es máxima.
          - texto: >-
              Como el integrando es positivo, $F$ crece sin límite y tiende a
              infinito.
            trampa: true
            mensaje: |
              Crece siempre, pero **está acotada**: el integrando decae tan
              deprisa que la integral converge, y
              $F(t)\to\sqrt{\pi/2}\approx1{,}25$ cuando $t\to\infty$. Es la
              famosa integral de Gauss. Crecer y no parar no es lo mismo que
              crecer sin límite.
    resolucion: |
      **El teorema, que es lo primero que pide el enunciado.**

      > Sea $f$ continua en $[a,b]$ y sea
      > $F(t)=\int_{a}^{t}f(z)\,dz$. Entonces $F$ es derivable en $(a,b)$ y
      > $F'(t)=f(t)$.

      *Demostración.* Por definición de derivada,

      $$
      \frac{F(t+h)-F(t)}{h}=\frac1h\int_{t}^{t+h}f(z)\,dz
      $$

      Por el teorema del valor medio integral existe $\xi_{h}$ entre $t$ y $t+h$
      con $\int_{t}^{t+h}f=f(\xi_{h})\,h$, de modo que el cociente vale
      $f(\xi_{h})$. Cuando $h\to0$, $\xi_{h}\to t$ y, por continuidad de $f$,
      $f(\xi_{h})\to f(t)$. Luego $F'(t)=f(t)$. $\blacksquare$

      **Por qué aquí hace falta de verdad.** La función $e^{-z^{2}/2}$ **no
      tiene primitiva elemental**: no hay ninguna combinación de funciones
      conocidas cuya derivada sea esa. Sin el teorema no habría forma de
      derivar $F$, y con él es inmediato.

      **El estudio.**

      $$
      F'(t)=e^{-t^{2}/2}>0\quad\text{para todo }t
      $$

      $F$ es **estrictamente creciente** en todo $\mathbb{R}$: no hay extremos
      relativos. Ni uno.

      $$
      F''(t)=-t\,e^{-t^{2}/2}
      $$

      La exponencial nunca se anula, así que el signo lo pone $-t$: positivo a
      la izquierda del origen —convexa— y negativo a la derecha —cóncava—. Hay
      un **único punto de inflexión, en $t=0$**, y allí la pendiente vale $1$,
      la mayor de toda la curva.

      **Y una cosa más que merece decirse.** $F$ crece siempre y sin embargo
      está **acotada**: cuando $t\to\infty$ tiende a $\sqrt{\pi/2}\approx1{,}25$,
      porque la campana de Gauss encierra un área finita. Es una función que
      sube eternamente sin llegar nunca a ninguna parte, y su gráfica es la
      clásica «ese» tumbada de la distribución normal.

  - id: ex1314-ord-3-taylor-de-una-edo-sin-resolverla
    titulo: Un polinomio de Taylor sacado de la ecuación, no de la función
    fuente: >-
      Ejercicio 3 del PRIMER CUATRIMESTRAL · Sexta evaluación, 19 de mayo de 2014
      · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3
    enunciado: |
      Considerar la función $y(x)$ que verifica la ecuación $y'=-2xy$, y cuya
      gráfica pasa por el punto $(1,1)$.

      a) Calcular el polinomio de Taylor de grado 3.

      b) Utilizar el anterior polinomio para aproximar $y(1.2)$.
    pide: El polinomio centrado en 1 y la aproximación.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De dónde salen las derivadas que necesita el polinomio?
        opciones:
          - texto: >-
              De derivar la propia ecuación tantas veces como haga falta, y
              evaluar en $x=1$ arrastrando los valores ya conocidos
            correcta: true
            mensaje: |
              Eso es, y es el método: $y(1)$ lo da el dato; $y'(1)$ sale de la
              ecuación; $y''$ se obtiene derivando la ecuación y usando $y'$; y
              así en cascada. No hace falta resolver la ecuación.
          - texto: >-
              Hay que resolver primero la ecuación diferencial
            mensaje: |
              Aquí se puede —es de variables separables y da $y=e^{1-x^{2}}$—
              pero el método de Taylor no lo necesita, y en la mayoría de las
              ecuaciones no hay solución explícita. El enunciado está enseñando
              precisamente eso.
          - texto: >-
              Del desarrollo de $e^{x}$, porque la solución es una exponencial
            mensaje: |
              Adivinar la forma de la solución es hacer trampa al ejercicio, y
              además el desarrollo de $e^{1-x^{2}}$ centrado en $x=1$ no es
              inmediato: habría que componer dos series.

      - tipo: calcular
        titulo: La segunda derivada
        pregunta: |
          ¿Cuánto vale $y''(1)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              $-2$ es $y'(1)$. Derivando la ecuación,
              $y''=-2y-2xy'$, y en $(1,1)$ eso es $-2-2(-2)=+2$: los dos
              menos se cancelan.
          - valor: '-6'
            mensaje: |
              $-6$ saldría de $-2y-2xy'$ con $y'=+2$. Pero $y'(1)=-2xy=-2$, con
              signo negativo: el enunciado lleva un menos delante.
          - valor: '4'
            mensaje: |
              Parece que te has dejado el $-2y$. La regla del producto sobre
              $-2xy$ da **dos** términos: $-2y$ y $-2xy'$.
        pista: |
          Deriva $y'=-2xy$ con la regla del producto y evalúa en $x=1$ con
          $y=1$, $y'=-2$.
        desarrollo: |
          $$
          y''=-2y-2xy'
          \;\Longrightarrow\;
          y''(1)=-2\cdot1-2\cdot1\cdot(-2)=-2+4=2
          $$

          Y una más:

          $$
          y'''=-4y'-2xy''
          \;\Longrightarrow\;
          y'''(1)=-4(-2)-2(2)=8-4=4
          $$

      - tipo: calcular
        titulo: La aproximación
        pregunta: |
          ¿Qué valor da el polinomio para $y(1{,}2)$?
        respuesta:
          tipo: numero
          valor: '0.6453333'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.64'
            mensaje: |
              Te has quedado en el grado $2$: $1-0{,}4+0{,}04=0{,}64$. Falta el
              término cúbico, $\frac{4}{6}(0{,}2)^{3}=0{,}00533$.
          - valor: '0.6'
            mensaje: |
              Solo el término lineal, $1-2(0{,}2)$. Faltan el cuadrático y el
              cúbico.
          - valor: '1.5546667'
            mensaje: |
              Ese es el resultado con $y'=+2xy$, sin el signo menos del
              enunciado. Con el menos, la función **decrece** al pasar de $1$ a
              $1{,}2$.
        pista: |
          $P_{3}(x)=1-2(x-1)+\frac{2}{2}(x-1)^{2}+\frac{4}{6}(x-1)^{3}$, con
          $x-1=0{,}2$.
        desarrollo: |
          $$
          P_{3}(x)=1-2(x-1)+(x-1)^{2}+\frac23(x-1)^{3}
          $$

          $$
          P_{3}(1{,}2)=1-0{,}4+0{,}04+\frac23(0{,}008)
          =0{,}64533
          $$

          El valor exacto es $y(1{,}2)=e^{1-1{,}44}=e^{-0{,}44}\approx0{,}64404$:
          el error es de $1{,}3$ milésimas.

      - tipo: justificar
        pregunta: Ordena el método. Una pieza es falsa.
        piezas:
          - texto: >-
              El dato $(1,1)$ da $y(1)=1$, y la propia ecuación da
              $y'(1)=-2\cdot1\cdot1=-2$: el punto de partida de la cascada.
          - texto: >-
              Derivando la ecuación, $y''=-2y-2xy'$, y evaluando con los valores
              ya conocidos, $y''(1)=2$; otra vez, $y'''=-4y'-2xy''$ e
              $y'''(1)=4$.
          - texto: >-
              Con eso,
              $P_{3}(x)=1-2(x-1)+(x-1)^{2}+\frac23(x-1)^{3}$, y
              $P_{3}(1{,}2)\approx0{,}6453$.
          - texto: >-
              El polinomio está centrado en $x=0$, porque es donde suelen
              centrarse los desarrollos.
            trampa: true
            mensaje: |
              Está centrado en $x=1$, que es el único punto donde se conoce algo
              de la función. Centrarlo en $0$ exigiría $y(0)$, $y'(0)$… y no hay
              manera de obtenerlos sin resolver la ecuación. Que el centro lo
              fije el dato inicial es la idea entera del método.
    resolucion: |
      **La idea, que es lo que se evalúa.** No hace falta resolver la ecuación.
      Un polinomio de Taylor solo necesita el valor de la función y de sus
      derivadas **en un punto**, y la propia ecuación diferencial las va dando
      en cascada.

      **La cascada, centrada en $x=1$.**

      $$
      y(1)=1 \quad\text{(el dato)}
      $$
      $$
      y'=-2xy\;\Longrightarrow\;y'(1)=-2
      $$
      $$
      y''=-2y-2xy'\;\Longrightarrow\;y''(1)=-2+4=2
      $$
      $$
      y'''=-4y'-2xy''\;\Longrightarrow\;y'''(1)=8-4=4
      $$

      Cada derivada se obtiene derivando la anterior y **sustituyendo lo que ya
      se sabe**. Nunca hace falta la expresión de $y$.

      **a) El polinomio.**

      $$
      \boxed{\;P_{3}(x)=1-2(x-1)+(x-1)^{2}+\frac23(x-1)^{3}\;}
      $$

      **b) La aproximación.**

      $$
      P_{3}(1{,}2)=1-0{,}4+0{,}04+0{,}00533=0{,}64533
      $$

      **Comprobación, que aquí sí se puede.** La ecuación es de variables
      separables: $\frac{dy}{y}=-2x\,dx$ da $y=Ce^{-x^{2}}$, y con $y(1)=1$ sale
      $y=e^{1-x^{2}}$. Entonces

      $$
      y(1{,}2)=e^{-0{,}44}\approx0{,}64404
      $$

      El polinomio se equivoca en $0{,}0013$, un dos por mil. Con un paso de
      $0{,}2$ y grado $3$, es lo esperable.

      **Por qué el método vale la pena aunque aquí la ecuación se resuelva.**
      Porque en la inmensa mayoría de las ecuaciones diferenciales no hay
      solución explícita, y este procedimiento —derivar la ecuación y evaluar—
      sigue funcionando igual. El ejercicio usa una que sí se resuelve
      justamente para poder comprobar el resultado.

  - id: ex1314-ord-4-la-misma-edo-de-tres-maneras
    titulo: La misma ecuación resuelta de tres maneras distintas
    fuente: >-
      Ejercicio 1 del SEGUNDO CUATRIMESTRAL · Sexta evaluación, 19 de mayo de
      2014 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 6
      comp4: 4
    enunciado: |
      Resolver el problema $x''(t)-x(t)+2=0$, $x(0)=x'(0)=2$ de las tres formas
      siguientes:

      a) Aplicando directamente la transformada de Laplace a la EDO.

      b) Planteando un sistema de dos ecuaciones diferenciales equivalente a la
      EDO dada, y aplicando la transformada de Laplace para resolver dicho
      sistema.

      c) Mediante el método de los coeficientes indeterminados.
    pide: La misma solución por los tres caminos.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se convierte $x''-x+2=0$ en un sistema de dos ecuaciones de
          primer orden?
        opciones:
          - texto: >-
              Llamando $u=x$ y $v=x'$: entonces $u'=v$ y $v'=u-2$
            correcta: true
            mensaje: |
              Eso es. La segunda incógnita es la derivada de la primera, y la
              ecuación original se convierte en la segunda fila del sistema.
              Es el paso estándar para pasar de orden $n$ a un sistema de $n$
              ecuaciones de primer orden.
          - texto: >-
              Llamando $u=x'$ y $v=x''$
            mensaje: |
              Así se pierde la propia $x$, que aparece en la ecuación. El
              sistema tiene que cerrar sobre sí mismo, y para eso la primera
              incógnita debe ser $x$.
          - texto: >-
              Separando la ecuación en $x''=0$ y $x=2$
            mensaje: |
              Eso no es equivalente: sería sustituir una ecuación por dos que ni
              siquiera son compatibles con las condiciones iniciales. Un sistema
              equivalente conserva exactamente las mismas soluciones.

      - tipo: calcular
        titulo: La transformada
        pregunta: |
          Transformando la EDO, $X(s)=\dfrac{2s^{2}+2s-2}{s\left(s^{2}-1\right)}$.
          ¿Cuánto vale $X(2)$?
        respuesta:
          tipo: numero
          valor: '1.6666667'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es $x(0)$, no $X(2)$. La transformada es una función de $s$;
              evaluarla en $s=2$ no devuelve el valor de $x$ en ningún sitio.
          - valor: '1.1666667'
            mensaje: |
              Parece que has puesto $2s^{2}+2s-2$ como $2\cdot4+2\cdot2-2=10$ y
              dividido entre $2\cdot(4+1)$. El denominador es $s^{2}-1$, con
              **menos**: en $s=2$ vale $3$, no $5$.
          - valor: '5'
            mensaje: |
              $5$ es el numerador, $\frac{10}{2}$… El denominador completo es
              $s(s^{2}-1)=2\cdot3=6$, y $\frac{10}{6}=\frac53$.
        pista: |
          Numerador $2\cdot4+4-2=10$; denominador $2\cdot(4-1)=6$.
        desarrollo: |
          $$
          X(2)=\frac{2\cdot4+2\cdot2-2}{2\left(4-1\right)}=\frac{10}{6}
          =\frac53\approx1{,}6667
          $$

          Y descomponiendo,

          $$
          X(s)=\frac{2}{s}+\frac{1}{s-1}-\frac{1}{s+1}
          $$

          que en $s=2$ vale $1+1-\frac13=\frac53$ ✓.

      - tipo: calcular
        titulo: La solución en un instante
        pregunta: |
          ¿Cuánto vale $x(1)$?
        respuesta:
          tipo: numero
          valor: '4.3504024'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '2.3504024'
            mensaje: |
              Te falta el $2$ constante: la solución es
              $2+e^{t}-e^{-t}$, y ese $2$ viene de la particular, no de la
              homogénea.
          - valor: '2.7182818'
            mensaje: |
              $e$ es solo el primero de los dos exponenciales. Hay que restarle
              $e^{-1}$ y sumar el $2$.
          - valor: '3.6829419'
            mensaje: |
              Parece $2+e^{-1}+e^{-1}$… o $2+2\operatorname{senh}$ mal
              evaluado. Con $\operatorname{senh}1\approx1{,}1752$ sale
              $2+2\cdot1{,}1752$.
        pista: |
          $x(t)=2+e^{t}-e^{-t}=2+2\operatorname{senh}t$.
        desarrollo: |
          $$
          x(1)=2+e-e^{-1}\approx2+2{,}71828-0{,}36788=4{,}35040
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La ecuación es $x''-x=-2$; su característica $r^{2}-1=0$ tiene
              raíces **reales** $\pm1$, así que la homogénea es
              $C_{1}e^{t}+C_{2}e^{-t}$.
          - texto: >-
              Una particular constante: $x_{p}=2$, porque $-x_{p}=-2$. La
              general es $2+C_{1}e^{t}+C_{2}e^{-t}$.
          - texto: >-
              Con $x(0)=2$ sale $C_{1}+C_{2}=0$ y con $x'(0)=2$ sale
              $C_{1}-C_{2}=2$: $C_{1}=1$, $C_{2}=-1$, y
              $x(t)=2+e^{t}-e^{-t}$.
          - texto: >-
              Como las raíces son $\pm1$, la solución oscila con periodo
              $2\pi$.
            trampa: true
            mensaje: |
              Oscilaría si las raíces fueran **imaginarias**. Aquí son reales, y
              lo que sale son exponenciales: la solución crece sin límite, no da
              vueltas. El signo del término en $x$ es lo que decide: con
              $x''+x$ habría senos y cosenos; con $x''-x$, exponenciales.
    resolucion: |
      **La ecuación.** $x''-x+2=0$, es decir $x''-x=-2$, con $x(0)=x'(0)=2$.

      **a) Laplace directo.** Con
      $\mathcal{L}\{x''\}=s^{2}X-sx(0)-x'(0)=s^{2}X-2s-2$:

      $$
      s^{2}X-2s-2-X=-\frac2s
      \;\Longrightarrow\;
      X=\frac{2s^{2}+2s-2}{s\left(s^{2}-1\right)}
      $$

      Descomponiendo en fracciones simples —el denominador es
      $s(s-1)(s+1)$—:

      $$
      X(s)=\frac{2}{s}+\frac{1}{s-1}-\frac{1}{s+1}
      \;\Longrightarrow\;
      x(t)=2+e^{t}-e^{-t}
      $$

      **b) Como sistema.** Con $u=x$ y $v=x'$:

      $$
      \left\{
      \begin{aligned}
      u'&=v\\
      v'&=u-2
      \end{aligned}
      \right.
      \qquad u(0)=v(0)=2
      $$

      Transformando: $sU-2=V$ y $sV-2=U-\frac2s$. Sustituyendo la primera en la
      segunda,

      $$
      s(sU-2)-2=U-\frac2s
      \;\Longrightarrow\;
      \left(s^{2}-1\right)U=2s+2-\frac2s
      $$

      que es la misma expresión de antes. Sale, claro, la misma $x$.

      **c) Coeficientes indeterminados.** La característica $r^{2}-1=0$ da
      $r=\pm1$; el segundo miembro es constante y $0$ no es raíz, así que
      $x_{p}=2$:

      $$
      x=2+C_{1}e^{t}+C_{2}e^{-t}
      $$

      $$
      x(0)=2\Rightarrow C_{1}+C_{2}=0,
      \qquad
      x'(0)=2\Rightarrow C_{1}-C_{2}=2
      $$

      $$
      C_{1}=1,\quad C_{2}=-1
      $$

      $$
      \boxed{\;x(t)=2+e^{t}-e^{-t}=2+2\operatorname{senh}t\;}
      $$

      **Para qué sirve pedir lo mismo tres veces.** Para ver que los tres
      caminos llevan al mismo sitio y que cada uno tiene su momento: Laplace
      directo es el más corto aquí; el sistema es el que escala a problemas
      acoplados; y los coeficientes indeterminados son los que funcionan sin
      condiciones iniciales, cuando lo que se busca es la solución general.

      **Y un detalle de lectura.** Las raíces son **reales**, así que no hay
      oscilación: la solución se dispara exponencialmente. Basta con el signo
      del término en $x$ para saberlo antes de calcular nada.

  - id: ex1314-ord-5-green-con-el-centro-de-gravedad
    titulo: Una integral de línea que se resuelve con el área y el centroide
    fuente: >-
