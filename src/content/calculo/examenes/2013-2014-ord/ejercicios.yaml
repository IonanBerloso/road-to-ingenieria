          <text x="438.2" y="224">x</text>
          <text x="136" y="63.8">y</text>
        </g>
        <text class="reg14-ea" x="52" y="227" text-anchor="middle">A(−1, 0)</text>
        <text class="reg14-ea" x="364" y="227" text-anchor="middle">B(3, 0)</text>
        <text class="reg14-ea" x="255" y="175">P(3/2, 1/2)</text>
        <text class="reg14-et" x="87.1" y="104.7">C</text>
        <text class="reg14-et" x="247" y="196" text-anchor="middle">R</text>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original. El perfil de C es esquemático:
      los datos que cuentan son los del texto —área 8 y centro de gravedad en
      (3/2, 1/2)— y los extremos A(−1,0) y B(3,0).
      </figcaption>
      </figure>

      AYUDA: Utilícese el teorema de Green para calcular la integral a lo largo
      de la frontera completa del recinto $R$. El centro de gravedad
      $\left(x_{c},y_{c}\right)$ de la región $R$ se calcula mediante las
      expresiones
      $$
      x_{c}=\frac{\displaystyle\iint_{R}x\,d(x,y)\,dx\,dy}{M},
      \qquad
      y_{c}=\frac{\displaystyle\iint_{R}y\,d(x,y)\,dx\,dy}{M}
      $$
      donde $d(x,y)$ es la densidad de masa y $M$ la masa de la figura.
    pide: El valor de la integral a lo largo de C.

    pasos:
      - tipo: reconocer
        pregunta: |
          $C$ es abierta y Green necesita una curva cerrada. ¿Cómo se arregla?
        opciones:
          - texto: >-
              Cerrando el camino con el segmento del eje $x$ de B a A, aplicando
              Green al conjunto y restando después lo que aporta el segmento
            correcta: true
            mensaje: |
              Eso es, y el segmento es el cierre barato: sobre él $y=0$ y
              $dy=0$, así que su integral es casi inmediata. La ayuda del
              enunciado va justo por ahí.
          - texto: >-
              Aplicando Green directamente a $C$
            mensaje: |
              Green exige una curva **cerrada** y simple: sin cerrar no hay
              «interior» sobre el que integrar. Es la hipótesis del teorema, no
              un tecnicismo.
          - texto: >-
              Parametrizando $C$ y calculando la integral directamente
            mensaje: |
              No se puede: el enunciado **no dice** qué curva es $C$. Lo único
              que da son sus extremos y dos datos globales de la región. Por eso
              el camino es Green.

      - tipo: calcular
        titulo: El integrando de Green
        pregunta: |
          $\dfrac{\partial Q}{\partial x}-\dfrac{\partial P}{\partial y}$ vale
          $2x+3y+k$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-1'
            mensaje: |
              Signo. $P=3-y$ tiene $P_{y}=-1$, y en la fórmula va **restando**:
              $Q_{x}-P_{y}=(2x+3y)-(-1)=2x+3y+1$.
          - valor: '3'
            mensaje: |
              El $3$ es el término independiente de $P$, y desaparece al derivar
              respecto de $y$. Lo que sobrevive es el coeficiente de $y$.
          - valor: '0'
            mensaje: |
              Cero saldría si $P$ no dependiera de $y$. Depende: $P=3-y$, y su
              derivada es $-1$, que al restarla suma.
        pista: |
          $P=3-y$ y $Q=x^{2}+3xy$; deriva $Q$ respecto de $x$ y $P$ respecto de
          $y$.
        desarrollo: |
          $$
          Q_{x}=2x+3y,
          \qquad
          P_{y}=-1
          \;\Longrightarrow\;
          Q_{x}-P_{y}=2x+3y+1
          $$

          Y esa combinación es la que hace útil el enunciado: los tres sumandos
          se integran con los tres datos que da —$\iint x$, $\iint y$ y el área—.

      - tipo: calcular
        titulo: La circulación por la frontera completa
        pregunta: |
          ¿Cuánto vale $\displaystyle\oint_{\partial R}$ en sentido positivo?
        respuesta:
          tipo: numero
          valor: '44'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '36'
            mensaje: |
              Te falta el área. La integral de la constante $1$ sobre $R$ es
              justamente $A=8$, y hay que sumarla a los otros dos términos.
          - valor: '32'
            mensaje: |
              Parece que has usado $\iint y\,dA=y_{c}=\frac12$ en vez de
              $y_{c}\cdot A=4$. Las fórmulas del enunciado están **divididas**
              por la masa: para recuperar la integral hay que multiplicar.
          - valor: '20'
            mensaje: |
              Con $\iint x\,dA=x_{c}=\frac32$ y $\iint y\,dA=y_{c}=\frac12$ sale
              $3+1{,}5+8$… Los momentos son $x_{c}A$ e $y_{c}A$, no $x_{c}$ e
              $y_{c}$.
        pista: |
          $\iint x\,dA=x_{c}A$ y $\iint y\,dA=y_{c}A$, con $A=8$.
        desarrollo: |
          $$
          \iint_{R}x\,dA=\frac32\cdot8=12,
          \qquad
          \iint_{R}y\,dA=\frac12\cdot8=4,
          \qquad
          \iint_{R}dA=8
          $$

          $$
          \oint_{\partial R}=2(12)+3(4)+8=44
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Se cierra el camino: la frontera de $R$ recorrida en sentido
              positivo es el segmento del eje de A a B seguido de $C$ recorrida
              de B a A.
          - texto: >-
              Green da
              $\oint_{\partial R}=\iint_{R}\left(2x+3y+1\right)dA
              =2x_{c}A+3y_{c}A+A=24+12+8=44$.
          - texto: >-
              Sobre el segmento, $y=0$ y $dy=0$, así que su aportación es
              $\int_{-1}^{3}3\,dx=12$.
          - texto: >-
              Como $\oint=\int_{\text{segmento}}+\int_{C}$, se tiene
              $I=44-12=32$.
            trampa: true
            mensaje: |
              El sentido está mal. En la frontera positiva, $C$ se recorre de
              **B a A**, es decir al revés de como la define el enunciado, así
              que $\oint=\int_{\text{segmento}}-I$. De ahí $I=12-44=-32$, con
              signo negativo. Equivocarse en la orientación es el error clásico
              de Green, y cambia el signo del resultado entero.
    resolucion: |
      **Por qué hay que usar Green.** El enunciado **no dice qué curva es $C$**:
      solo da sus extremos y dos datos globales de la región. Parametrizar es
      imposible; lo único que puede funcionar es un teorema que cambie la
      integral de línea por una integral doble donde esos datos entren.

      **Cerrar el camino.** La frontera de $R$ recorrida en sentido positivo
      —dejando la región a la izquierda— es:

      $$
      \partial R=\underbrace{\text{segmento del eje de A a B}}_{\text{abajo,
      izquierda a derecha}}
      \;+\;
      \underbrace{C \text{ recorrida de B a A}}_{\text{arriba, al revés}}
      $$

      Ojo al «al revés»: el enunciado orienta $C$ de A a B, así que en la
      frontera aparece con signo cambiado.

      $$
      \oint_{\partial R}=\int_{\text{seg}}-I
      $$

      **Green.** Con $P=3-y$ y $Q=x^{2}+3xy$:

      $$
      Q_{x}-P_{y}=2x+3y+1
      $$

      $$
      \oint_{\partial R}=\iint_{R}\left(2x+3y+1\right)dA
      =2\iint x\,dA+3\iint y\,dA+\iint dA
      $$

      Y ahí es donde entran los datos. De las fórmulas de la ayuda, con densidad
      constante,

      $$
      \iint_{R}x\,dA=x_{c}A=\frac32\cdot8=12,
      \qquad
      \iint_{R}y\,dA=y_{c}A=\frac12\cdot8=4
      $$

      $$
      \oint_{\partial R}=24+12+8=44
      $$

      **El segmento.** En él $y=0$ y $dy=0$, así que solo sobrevive $P\,dx$ con
      $P=3$:

      $$
      \int_{\text{seg}}=\int_{-1}^{3}3\,dx=12
      $$

      **El resultado.**

      $$
      I=\int_{\text{seg}}-\oint_{\partial R}=12-44=\boxed{\;-32\;}
      $$

      **Lo que este ejercicio enseña.** Que el centro de gravedad no es solo un
      dato de estática: $x_{c}A$ e $y_{c}A$ **son** los momentos
      $\iint x\,dA$ e $\iint y\,dA$, y aparecen en cuanto una integral doble
      lleva una $x$ o una $y$ sueltas. Reconocerlos convierte un problema sin
      datos suficientes en uno de tres líneas.

  - id: ex1314-ord-6-el-cuenco-rematado-en-cono
    titulo: El cuenco rematado en cono, y dónde tiene su centro de gravedad
    fuente: >-
      Ejercicio 3 del SEGUNDO CUATRIMESTRAL · Sexta evaluación, 19 de mayo de
      2014 · Cálculo, UPV/EHU · El sólido es el mismo que el del ejercicio 1 del
      segundo parcial de la ordinaria de 2021-2022, ocho años después · El
      examen no publica solución: la resolución es propuesta nuestra, pendiente
      de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3
    enunciado: |
      Considerar el sólido definido por las condiciones
      $x^{2}+y^{2}\le z$; $x^{2}+y^{2}\le(z-6)^{2}$, $z\le 6$.

      a) Dibujar el sólido y calcular el área de su superficie.

      b) Calcular el centro de gravedad del sólido.
    pide: El dibujo, el área y el centro de gravedad.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde se encuentran el paraboloide y el cono?
        opciones:
          - texto: >-
              En $z=4$, con radio $2$: donde $\sqrt{z}=6-z$
            correcta: true
            mensaje: |
              Eso es. El paraboloide tiene radio $\sqrt z$ y el cono
              $\left|z-6\right|=6-z$ para $z<6$. Igualando sale
              $z^{2}-13z+36=0$, con raíces $4$ y $9$; solo $z=4$ cumple
              $z\le6$.
          - texto: En $z=9$
            mensaje: |
              Es la otra raíz, y hay que descartarla en voz alta: el enunciado
              impone $z\le6$, y además en $z=9$ el cono ya está del otro lado de
              su vértice.
          - texto: En $z=6$
            mensaje: |
              En $z=6$ está el **vértice** del cono, donde su radio es cero,
              mientras que el paraboloide tiene ahí radio $\sqrt6$. No se tocan
              allí: el cono va por dentro.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen del sólido?
        respuesta:
          tipo: numero
          valor: '33.5103'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '25.1327'
            mensaje: |
              $8\pi$ es solo el cuenco parabólico, de $z=0$ a $z=4$. Falta el
              cono de arriba, que aporta $\frac{8\pi}{3}$.
          - valor: '8.3776'
            mensaje: |
              $\frac{8\pi}{3}$ es solo el cono. La parte de abajo es tres veces
              mayor.
          - valor: '56.5487'
            mensaje: |
              $18\pi$ saldría de integrar el paraboloide hasta $z=6$, ignorando
              que a partir de $z=4$ es el cono el que estrecha el sólido.
        pista: |
          $V=\pi\int_{0}^{4}z\,dz+\pi\int_{4}^{6}(6-z)^{2}dz$: el radio al
          cuadrado es $z$ abajo y $(6-z)^{2}$ arriba.
        desarrollo: |
          $$
          V=\pi\int_{0}^{4}z\,dz+\pi\int_{4}^{6}\left(6-z\right)^{2}dz
          =8\pi+\frac{8\pi}{3}=\frac{32\pi}{3}\approx33{,}510
          $$

      - tipo: calcular
        titulo: La altura del centro de gravedad
        pregunta: |
          ¿A qué altura está el centro de gravedad?
        respuesta:
          tipo: numero
          valor: '3.125'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '3'
            mensaje: |
              $3$ es la mitad de la altura total, y solo valdría si el sólido
              fuera simétrico arriba y abajo. No lo es: el cuenco de abajo es
              mucho más voluminoso, pero también está más bajo — y el resultado
              queda un poco **por encima** de $3$.
          - valor: '4'
            mensaje: |
              $4$ es la altura donde se encuentran las dos superficies, no el
              centro de gravedad. Que haya masa por encima y por debajo de esa
              cota no la convierte en el centroide.
          - valor: '2.6667'
            mensaje: |
              $\frac83$ es la altura del centroide de un cuenco parabólico
              **solo**. El cono de arriba tira del conjunto hacia arriba.
        pista: |
          $\overline{z}=\dfrac{\int z\,dV}{V}$, y
          $\int z\,dV=\pi\int_{0}^{4}z^{2}dz+\pi\int_{4}^{6}z(6-z)^{2}dz$.
        desarrollo: |
          $$
          \int z\,dV=\pi\int_{0}^{4}z^{2}\,dz+\pi\int_{4}^{6}z\left(6-z\right)^{2}dz
          =\frac{64\pi}{3}+12\pi=\frac{100\pi}{3}
          $$

          $$
          \overline{z}=\frac{100\pi/3}{32\pi/3}=\frac{100}{32}=\frac{25}{8}=3{,}125
          $$

          Y por simetría de revolución, $\overline{x}=\overline{y}=0$.

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              El sólido es de revolución alrededor del eje $z$, así que su centro
              de gravedad está sobre ese eje: $\overline{x}=\overline{y}=0$ sin
              calcular nada.
          - texto: >-
              Para la altura se corta en discos horizontales: de radio
              $\sqrt z$ hasta $z=4$ y de radio $6-z$ desde ahí hasta el vértice.
          - texto: >-
              $V=\frac{32\pi}{3}$ y $\int z\,dV=\frac{100\pi}{3}$, así que
              $\overline{z}=\frac{25}{8}=3{,}125$, un poco por encima de la
              mitad de la altura.
          - texto: >-
              Como la mayor parte del volumen está abajo, el centro de gravedad
              tiene que quedar por debajo de la mitad, en $z<3$.
            trampa: true
            mensaje: |
              El volumen de abajo es tres veces el de arriba, sí, pero está
              repartido en una altura de $4$ frente a los $2$ del cono, y el
              cuenco es **estrecho cerca del fondo**: apenas hay masa a baja
              altura. Al hacer la cuenta sale $3{,}125$, por **encima** de la
              mitad. Es un buen recordatorio de que el centroide no se adivina
              mirando qué mitad parece más gorda.
    resolucion: |
      **Antes de nada:** este sólido es exactamente el mismo que el del
      ejercicio 1 del segundo parcial de la ordinaria de 2021-2022, ocho años
      después. Allí pedían dibujarlo y calcular el área; aquí, además, el centro
      de gravedad.

      **a) Qué sólido es.** Dentro del paraboloide $z\ge r^{2}$ y dentro del cono
      $r\le 6-z$, con $z\le6$. Se cortan donde $\sqrt z=6-z$:

      $$
      z^{2}-13z+36=0\;\Longrightarrow\;z=4\ \text{(y }z=9\text{, fuera)},
      \qquad r=2
      $$

