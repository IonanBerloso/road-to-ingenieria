ejercicios:
  - id: ex1718-5rec-1-dos-complejos-atados-por-un-cociente
    titulo: Dos complejos atados por su cociente
    fuente: >-
      Ejercicio 1 · Quinta evaluación, PRIMER CUATRIMESTRAL, 23 de abril de 2018 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 6
      comp4: 2
    enunciado: |
      Calcular los números complejos $z_{1}$ y $z_{2}$ que cumplen las
      siguientes condiciones: $\dfrac{z_{1}}{z_{2}}$ está situado en el eje
      imaginario positivo, el módulo de $z_{1}$ es el triple del módulo de
      $z_{2}$, $z_{1}$ es la raíz $\sqrt[3]{-8}$ situada en el primer cuadrante.
    pide: Los dos números complejos, en la forma que prefieras.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dice, en términos de módulo y argumento, que $\frac{z_{1}}{z_{2}}$
          esté en el eje imaginario positivo?
        opciones:
          - texto: >-
              Que su argumento es $90^{\circ}$, es decir
              $\arg z_{1}-\arg z_{2}=90^{\circ}$
            correcta: true
            mensaje: |
              Eso es. Estar en el eje imaginario positivo es una condición sobre
              el **argumento** y no dice nada del módulo; el módulo lo fija la
              otra condición.
          - texto: >-
              Que $z_{1}$ y $z_{2}$ son los dos imaginarios puros
            mensaje: |
              El que es imaginario puro es el cociente, no cada uno. De hecho
              $z_{1}=1+\sqrt{3}\,i$ no lo es, y el cociente sí lo será.
          - texto: >-
              Que $z_{1}$ y $z_{2}$ son conjugados
            mensaje: |
              Si lo fueran, el cociente tendría módulo $1$; y aquí, por la
              segunda condición, tiene módulo $3$. Además el cociente de dos
              conjugados tiene argumento $2\arg z_{1}$, que no tiene por qué ser
              recto.

      - tipo: calcular
        titulo: El argumento de z₁
        pregunta: |
          ¿Cuál es el argumento, en grados, de la raíz cúbica de $-8$ que está en
          el primer cuadrante?
        respuesta:
          tipo: numero
          valor: '60'
          tolerancia: 0.001
          formato: un número en grados
        distractores:
          - valor: '180'
            mensaje: |
              Esa es la raíz real, $-2$, que está sobre el eje negativo y no en
              el primer cuadrante. Las tres raíces tienen argumentos
              $60^{\circ}$, $180^{\circ}$ y $300^{\circ}$.
          - valor: '30'
            mensaje: |
              Has dividido $90$ entre $3$. El argumento de $-8$ es
              $180^{\circ}$, no $90^{\circ}$: $-8$ está sobre el eje real
              negativo.
          - valor: '300'
            mensaje: |
              Esa es la tercera raíz, $1-\sqrt{3}\,i$, que está en el cuarto
              cuadrante. La del primero es la de $60^{\circ}$.
        pista: |
          Escribe $-8$ en forma polar y divide el argumento entre $3$, sumando
          $120^{\circ}$ para cada raíz siguiente.
        desarrollo: |
          $-8$ tiene módulo $8$ y argumento $180^{\circ}$, así que sus raíces
          cúbicas tienen módulo $\sqrt[3]{8}=2$ y argumentos

          $$
          \frac{180^{\circ}+360^{\circ}k}{3}
          =60^{\circ},\;180^{\circ},\;300^{\circ}
          \qquad k=0,1,2
          $$

          La del primer cuadrante es la de $60^{\circ}$:

          $$
          z_{1}=2\left(\cos 60^{\circ}+i\operatorname{sen}60^{\circ}\right)
          =1+\sqrt{3}\,i
          $$

      - tipo: calcular
        titulo: El módulo de z₂
        pregunta: |
          ¿Cuánto vale $\left|z_{2}\right|$?
        respuesta:
          tipo: numero
          valor: '0.6666667'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '6'
            mensaje: |
              Has multiplicado por $3$. El enunciado dice que el módulo de
              $z_{1}$ es el **triple** del de $z_{2}$, así que
              $\left|z_{2}\right|=\frac{\left|z_{1}\right|}{3}$.
          - valor: '2'
            mensaje: |
              Ese es $\left|z_{1}\right|$, el módulo de la raíz cúbica de $-8$.
              El de $z_{2}$ es tres veces menor.
          - valor: '1.5'
            mensaje: |
              Has dividido $\left|z_{1}\right|$ entre $3$ al revés,
              $\frac{3}{2}$. Es $\frac{2}{3}$.
        pista: |
          $\left|z_{1}\right|=2$, y el enunciado relaciona los dos módulos.
        desarrollo: |
          $$
          \left|z_{1}\right|=3\left|z_{2}\right|
          \;\Longrightarrow\;
          \left|z_{2}\right|=\frac{2}{3}
          $$

      - tipo: calcular
        titulo: El argumento de z₂
        pregunta: |
          ¿Cuál es el argumento de $z_{2}$, en grados, tomado entre
          $-180^{\circ}$ y $180^{\circ}$?
        respuesta:
          tipo: numero
          valor: '-30'
          tolerancia: 0.001
          formato: un número en grados
        distractores:
          - valor: '150'
            mensaje: |
              Has sumado los $90^{\circ}$ en vez de restarlos. El argumento de un
              cociente es la **resta**: $\arg z_{1}-\arg z_{2}=90^{\circ}$, de
              donde $\arg z_{2}=60^{\circ}-90^{\circ}$.
          - valor: '30'
            mensaje: |
              Signo. De $60^{\circ}-\arg z_{2}=90^{\circ}$ sale
              $\arg z_{2}=-30^{\circ}$, no $+30^{\circ}$. Compruébalo: con
              $+30^{\circ}$ el cociente tendría argumento $30^{\circ}$ y no
              estaría en el eje imaginario.
          - valor: '90'
            mensaje: |
              Ese es el argumento del **cociente**, que es el dato. El de
              $z_{2}$ sale de restárselo al de $z_{1}$.
        pista: |
          $\arg\frac{z_{1}}{z_{2}}=\arg z_{1}-\arg z_{2}$, y ese cociente tiene
          argumento $90^{\circ}$.
        desarrollo: |
          $$
          \arg\frac{z_{1}}{z_{2}}=\arg z_{1}-\arg z_{2}=90^{\circ}
          \;\Longrightarrow\;
          \arg z_{2}=60^{\circ}-90^{\circ}=-30^{\circ}
          $$

          Y con el módulo,

          $$
          z_{2}=\frac23\left(\cos(-30^{\circ})+i\operatorname{sen}(-30^{\circ})\right)
          =\frac{\sqrt{3}}{3}-\frac{1}{3}i
          $$

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $-8$ tiene módulo $8$ y argumento $180^{\circ}$, así que sus raíces
              cúbicas tienen módulo $2$ y argumentos $60^{\circ}$,
              $180^{\circ}$ y $300^{\circ}$.
          - texto: >-
              La del primer cuadrante es
              $z_{1}=2_{60^{\circ}}=1+\sqrt{3}\,i$.
          - texto: >-
              De $\left|z_{1}\right|=3\left|z_{2}\right|$ sale
              $\left|z_{2}\right|=\frac23$.
          - texto: >-
              De $\arg z_{1}-\arg z_{2}=90^{\circ}$ sale
              $\arg z_{2}=-30^{\circ}$.
          - texto: >-
              Por tanto
              $z_{2}=\frac23{}_{-30^{\circ}}=\frac{\sqrt{3}}{3}-\frac13 i$, y se
              comprueba que $\frac{z_{1}}{z_{2}}=3i$.
          - texto: >-
              Como hay tres raíces cúbicas de $-8$, el problema tiene tres
              soluciones distintas.
            trampa: true
            mensaje: |
              Solo una de las tres está en el primer cuadrante, y el enunciado lo
              exige: $-2$ está sobre el eje real negativo y
              $1-\sqrt{3}\,i$ en el cuarto cuadrante. La solución es única. (Y
              conviene decirlo, porque el enunciado escribe
              $\sqrt[3]{-8}$ como si fuera un solo número y no lo es.)

    resolucion: |
      **La raíz.** $-8$ en forma polar es $8_{180^{\circ}}$. Sus raíces cúbicas
      tienen módulo $\sqrt[3]{8}=2$ y argumentos

      $$
      \frac{180^{\circ}+360^{\circ}k}{3}=60^{\circ},\;180^{\circ},\;300^{\circ}
      $$

      Solo la primera está en el primer cuadrante, así que la condición del
      enunciado la determina sin ambigüedad:

      $$
      z_{1}=2_{60^{\circ}}=2\left(\frac12+\frac{\sqrt{3}}{2}i\right)=1+\sqrt{3}\,i
      $$

      **Las dos condiciones sobre $z_{2}$, separadas.** Este es el punto: una de
      ellas habla solo del módulo y la otra solo del argumento, y por eso no hay
      que resolver ningún sistema.

      Del módulo:

      $$
      \left|z_{1}\right|=3\left|z_{2}\right|
      \;\Longrightarrow\;
      \left|z_{2}\right|=\frac{2}{3}
      $$

      Del argumento: estar en el eje imaginario **positivo** significa argumento
      $90^{\circ}$, y el argumento de un cociente es la diferencia de
      argumentos:

      $$
      \arg z_{1}-\arg z_{2}=90^{\circ}
      \;\Longrightarrow\;
      \arg z_{2}=60^{\circ}-90^{\circ}=-30^{\circ}
      $$

      **La solución.**

      $$
      z_{1}=1+\sqrt{3}\,i,
      \qquad
      z_{2}=\frac23{}_{-30^{\circ}}
      =\frac{2}{3}\left(\frac{\sqrt{3}}{2}-\frac12 i\right)
      =\frac{\sqrt{3}}{3}-\frac{1}{3}i
      $$

      **La comprobación**, que es rápida en polar:

      $$
      \frac{z_{1}}{z_{2}}=\frac{2_{60^{\circ}}}{\frac23{}_{-30^{\circ}}}
      =3_{90^{\circ}}=3i
      $$

      Módulo $3$ —el triple, como pedía— y argumento recto, sobre el eje
      imaginario positivo. Si hubiéramos tomado $\arg z_{2}=+30^{\circ}$ habría
      salido $3_{30^{\circ}}$, que no está en ningún eje.

  - id: ex1718-5rec-2-el-tanque-de-propano
    titulo: El tanque de propano, y por qué no sale una esfera
    fuente: >-
      Ejercicio 2 · Quinta evaluación, PRIMER CUATRIMESTRAL, 23 de abril de 2018 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3
    enunciado: |
      Se quiere construir un tanque de acero con forma de cilindro circular
      recto y semiesferas en los extremos para almacenar propano. El costo por
      metro cuadrado de los extremos es el doble de la parte cilíndrica. ¿Qué
      dimensiones minimizan el costo si la capacidad deseada es de
      $10\pi\ \text{m}^{3}$?

      <figure class="figura-examen">
      <svg viewBox="0 0 420 170" role="img" width="420" height="170"
           aria-labelledby="tk18-t tk18-d">
        <title id="tk18-t">El tanque: un cilindro con una semiesfera en cada extremo</title>
        <desc id="tk18-d">Un cilindro tumbado con una semiesfera pegada en cada
        extremo, como una capsula. Una cota horizontal a trazos, por encima,
        marca la altura h del cilindro entre las dos costuras. Un radio r va
        desde el centro de la costura derecha hasta el borde superior del
        cilindro.</desc>
        <style>
          .tk18-p { stroke: var(--ink); stroke-width: 2; fill: none; }
          .tk18-oc { stroke: var(--graphite); stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; }
          .tk18-cota { stroke: var(--live); stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; }
          .tk18-r { stroke: var(--live); stroke-width: 1.6; fill: none; }
          .tk18-pt { fill: var(--live); }
          .tk18-et { fill: var(--live); font-size: 14px; font-family: var(--mono); font-weight: 700; }
        </style>
        <path class="tk18-p" d="M120 45L300 45"/>
        <path class="tk18-p" d="M120 145L300 145"/>
        <path class="tk18-p" d="M120 45A50 50 0 0 0 120 145"/>
        <path class="tk18-p" d="M300 45A50 50 0 0 1 300 145"/>
        <path class="tk18-oc" d="M120 45A22 50 0 0 0 120 145"/>
        <path class="tk18-oc" d="M120 45A22 50 0 0 1 120 145"/>
        <path class="tk18-oc" d="M300 45A22 50 0 0 0 300 145"/>
        <path class="tk18-oc" d="M300 45A22 50 0 0 1 300 145"/>
        <path class="tk18-cota" d="M120 22L300 22M120 14L120 30M300 14L300 30"/>
        <path class="tk18-r" d="M300 95L300 45"/>
        <circle class="tk18-pt" cx="300" cy="95" r="3"/>
        <text class="tk18-et" x="210" y="17" text-anchor="middle">h</text>
        <text class="tk18-et" x="308" y="74">r</text>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original: el cilindro de altura h y radio
      r, con una semiesfera en cada extremo.
      </figcaption>
      </figure>
    pide: El radio y la altura del cilindro que minimizan el coste.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué se minimiza y con qué ligadura?
        opciones:
          - texto: >-
              Se minimiza el coste
              $C=c\left(2\pi rh\right)+2c\left(4\pi r^{2}\right)$, con la
              ligadura $\pi r^{2}h+\frac43\pi r^{3}=10\pi$
            correcta: true
            mensaje: |
              Eso es. Las dos semiesferas juntas son una esfera entera: su
              superficie es $4\pi r^{2}$ y su volumen $\frac43\pi r^{3}$. Y el
              $2c$ delante es lo que hace que el problema no sea el de siempre.
          - texto: >-
              Se minimiza el área total, porque el coste es proporcional al área
            mensaje: |
              Lo sería si el acero costara lo mismo en todas partes, y no: los
              extremos van al doble. Minimizando el área sin más saldría una
              esfera, con $h=0$, que no es la respuesta.
          - texto: >-
              Se minimiza el volumen con la ligadura del coste
            mensaje: |
              Al revés. El volumen es el **dato** —$10\pi$ m³, no se puede
              tocar— y el coste es lo que se quiere hacer pequeño.

      - tipo: calcular
        titulo: El radio óptimo
        pregunta: |
          ¿Cuánto vale el radio, en metros, que minimiza el coste?
        respuesta:
          tipo: numero
          valor: '1.2331060'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales, en metros
        distractores:
          - valor: '1.9574338'
            mensaje: |
              Ese es el radio que minimiza el **área**, sin el factor $2$ de los
              extremos. Y fíjate en lo que sale con él: $h=0$, es decir una
              esfera. El precio doble de los casquetes es justo lo que impide que
              la respuesta sea esa.
          - valor: '1.0772173'
            mensaje: |
              Te has dejado las semiesferas en el volumen. La capacidad del
              tanque no es $\pi r^{2}h$: hay que sumarle la esfera,
              $\frac43\pi r^{3}$.
          - valor: '1.5'
            mensaje: |
              Ese número no sale de ninguna vía. Comprueba la derivada: de
              $-\frac{10}{r^{2}}+\frac{16}{3}r=0$ sale $r^{3}=\frac{15}{8}$.
        pista: |
          Despeja $h$ de la ligadura, mete $rh$ en el coste y deriva respecto de
          $r$.
        desarrollo: |
          De la ligadura, dividiendo entre $\pi$:

          $$
          r^{2}h+\frac43 r^{3}=10
          \;\Longrightarrow\;
          rh=\frac{10}{r}-\frac43 r^{2}
          $$

          El coste, en unidades de $2\pi c$:

          $$
          \frac{C}{2\pi c}=rh+4r^{2}
          =\frac{10}{r}-\frac43 r^{2}+4r^{2}
          =\frac{10}{r}+\frac83 r^{2}
          $$

          $$
          \frac{d}{dr}\left(\frac{10}{r}+\frac83 r^{2}\right)
          =-\frac{10}{r^{2}}+\frac{16}{3}r=0
          \;\Longrightarrow\;
          r^{3}=\frac{30}{16}=\frac{15}{8}
          $$

          $$
          r=\sqrt[3]{\frac{15}{8}}=\frac{\sqrt[3]{15}}{2}\approx 1{,}2331\ \text{m}
          $$

      - tipo: calcular
        titulo: La proporción entre altura y radio
        pregunta: |
          En el óptimo, ¿cuántas veces mayor que el radio es la altura del
          cilindro?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Esa es la proporción del problema clásico de la lata cilíndrica con
              tapas planas, donde la altura sale igual al diámetro. Aquí las
              tapas son semiesferas y además cuestan el doble: la proporción
              cambia.
          - valor: '0'
            mensaje: |
              Eso sería una esfera, que es lo que sale si se minimiza el área sin
              tener en cuenta que los extremos cuestan el doble.
          - valor: '1'
            mensaje: |
              Con $h=r$ el tanque no sería óptimo. Sustituye
              $r^{3}=\frac{15}{8}$ en $h=\frac{10}{r^{2}}-\frac43 r$ y verás que
              queda exactamente $4r$.
        pista: |
          Sustituye $10=\frac{16}{3}r^{3}$ en la expresión de $h$.
        desarrollo: |
          $$
          h=\frac{10}{r^{2}}-\frac43 r
          $$

          y en el óptimo $r^{3}=\frac{15}{8}$, es decir
          $10=\frac{16}{3}r^{3}$. Sustituyendo:

          $$
          h=\frac{\frac{16}{3}r^{3}}{r^{2}}-\frac43 r
          =\frac{16}{3}r-\frac43 r
          =\frac{12}{3}r=4r
          $$

          Con $r\approx 1{,}2331$ m queda $h\approx 4{,}9324$ m. La relación
          $h=4r$ es **exacta** y no depende de la capacidad: cambiar los
          $10\pi$ m³ cambia el tamaño del tanque, no su forma.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Las dos semiesferas juntas son una esfera: superficie
              $4\pi r^{2}$ y volumen $\frac43\pi r^{3}$.
          - texto: >-
              **Ligadura:** $\pi r^{2}h+\frac43\pi r^{3}=10\pi$, de donde
              $rh=\frac{10}{r}-\frac43 r^{2}$.
          - texto: >-
              **Función objetivo:** con $c$ el precio del metro cuadrado
              cilíndrico, $C=2\pi c\left(rh+4r^{2}\right)$, y sustituyendo
              $\frac{C}{2\pi c}=\frac{10}{r}+\frac83 r^{2}$.
          - texto: >-
              Derivando e igualando a cero, $r^{3}=\frac{15}{8}$ y
              $r=\frac{\sqrt[3]{15}}{2}\approx 1{,}2331$ m.
          - texto: >-
              Es mínimo porque la segunda derivada,
              $\frac{20}{r^{3}}+\frac{16}{3}$, es positiva para todo $r>0$.
          - texto: >-
              Sustituyendo, $h=4r\approx 4{,}9324$ m.
          - texto: >-
              Como el precio $c$ no se conoce, el problema está indeterminado y
              solo se puede dar la respuesta en función de $c$.
            trampa: true
            mensaje: |
              $c$ es un factor común y sale fuera de la derivada: multiplicar la
              función objetivo por una constante positiva no mueve su mínimo. Lo
              único que importa es la **razón** entre los dos precios, que el
              enunciado sí da: uno es el doble del otro.

    resolucion: |
      **La geometría.** Un cilindro de radio $r$ y altura $h$ con una semiesfera
      en cada extremo. Las dos semiesferas juntas forman una esfera completa, así
      que

      $$
      V=\pi r^{2}h+\frac43\pi r^{3},
      \qquad
      A_{\text{cilindro}}=2\pi rh,
      \qquad
      A_{\text{extremos}}=4\pi r^{2}
      $$

      **La ligadura.** $V=10\pi$, y dividiendo entre $\pi$:

      $$
      r^{2}h+\frac43 r^{3}=10
      \qquad\Longrightarrow\qquad
      rh=\frac{10}{r}-\frac43 r^{2}
      $$

      **El coste.** Si el metro cuadrado de cilindro cuesta $c$, el de los
      extremos cuesta $2c$:

      $$
      C=c\cdot 2\pi rh+2c\cdot 4\pi r^{2}
      =2\pi c\left(rh+4r^{2}\right)
      $$

      El $c$ es un factor constante y positivo: no mueve el mínimo, así que se
      puede tirar. Sustituyendo la ligadura:

      $$
      \frac{C}{2\pi c}=\frac{10}{r}-\frac43 r^{2}+4r^{2}
      =\frac{10}{r}+\frac83 r^{2}
      $$

      **El mínimo.**

      $$
      -\frac{10}{r^{2}}+\frac{16}{3}r=0
      \;\Longrightarrow\;
      r^{3}=\frac{30}{16}=\frac{15}{8}
      \;\Longrightarrow\;
      r=\frac{\sqrt[3]{15}}{2}\approx 1{,}2331\ \text{m}
      $$

      Es mínimo: la segunda derivada es
      $\frac{20}{r^{3}}+\frac{16}{3}>0$ para todo $r>0$.

      **La altura.** Aquí sale lo bonito. Como $10=\frac{16}{3}r^{3}$,

      $$
      h=\frac{10}{r^{2}}-\frac43 r
      =\frac{16}{3}r-\frac43 r
      =4r\approx 4{,}9324\ \text{m}
      $$

      **Por qué no sale una esfera.** Si el acero costara lo mismo en todas
      partes habría que minimizar el área, y entonces la respuesta sería la
      figura de menor superficie para un volumen dado: la esfera, con $h=0$.
      Cambiar el precio de los casquetes a $2c$ los penaliza, y la solución
      «estira» el tanque hasta $h=4r$ para poner más superficie en la parte
      barata. Ese es el contenido físico del ejercicio, y es lo que hay que
      escribir en COMP4.

      Y una observación que ahorra trabajo: la proporción $h=4r$ **no depende de
      la capacidad**. Con $20\pi$ m³ el tanque sería más grande, pero con la
      misma forma.

  - id: ex1718-5rec-3-la-composicion-que-cambia-cuatro-veces
    titulo: Una composición que cambia de sentido cuatro veces
    fuente: >-
      Ejercicio 3 · Quinta evaluación, PRIMER CUATRIMESTRAL, 23 de abril de 2018 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3
    enunciado: |
      Sean $f(x)$ y $g(x)$ las funciones de la figura. Estudiar el
      crecimiento/decrecimiento de la función $h(x)=g(f(x))$ en el intervalo
      $(1,5)$.

      <figure class="figura-examen">
      <svg viewBox="0 0 500 240" role="img" width="500" height="240"
           aria-labelledby="fg18-t fg18-d">
        <title id="fg18-t">Las graficas de f y de g, una en cada panel</title>
        <desc id="fg18-d">A la izquierda, la grafica de f sobre el intervalo de uno a
        cinco: una parabola hacia abajo que vale dos en los dos extremos y alcanza su
        maximo, seis, en x igual a tres. A la derecha, la grafica de g: una parabola
        hacia arriba que vale diez en u igual a dos, baja hasta su minimo, uno, en u
        igual a cinco, y vuelve a subir hasta poco mas de dos.</desc>
