      <figcaption>
      Figura redibujada del enunciado original. Las dos curvas del original
      pasan por nudos enteros de la cuadrícula, así que aquí se dibujan con las
      parábolas que los unen: f(x) = 6 − (x−3)² y g(u) = 1 + (u−5)².
      </figcaption>
      </figure>
    pide: En qué tramos de (1,5) crece y en cuáles decrece la composición.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De qué depende el signo de $h'$?
        opciones:
          - texto: >-
              De $h'(x)=g'\left(f(x)\right)\cdot f'(x)$: cambia donde se anula
              $f'$ y donde $f(x)$ pasa por el punto en que se anula $g'$
            correcta: true
            mensaje: |
              Eso es, y lo segundo es lo que se olvida. No basta con mirar dónde
              tiene $f$ su máximo: también hay que mirar **cuándo el valor de
              $f$** cruza el punto donde $g$ cambia de sentido.
          - texto: >-
              De $h'(x)=g'(x)\cdot f'(x)$
            mensaje: |
              Falta evaluar $g'$ en $f(x)$, no en $x$. Ese es exactamente el
              error de la regla de la cadena, y aquí se nota mucho: $g'$ se anula
              en $u=5$, y ese $5$ es un valor de $f$, no una abscisa.
          - texto: >-
              Como $g$ decrece en casi todo su dominio, $h$ decrece donde $f$
              crece y crece donde $f$ decrece
            mensaje: |
              Eso vale solo mientras $f(x)<5$. En cuanto $f$ pasa de $5$, $g$
              **crece**, y la regla se da la vuelta. Por eso hay cuatro tramos y
              no dos.

      - tipo: calcular
        titulo: Cuántos tramos
        pregunta: |
          ¿En cuántos subintervalos hay que partir $(1,5)$ para estudiar el signo
          de $h'$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Solo has partido por el máximo de $f$, en $x=3$. Faltan los dos
              puntos donde $f(x)=5$, que es donde $g'$ cambia de signo: $x=2$ y
              $x=4$.
          - valor: '3'
            mensaje: |
              Te falta un punto de corte. Son tres: $x=2$ y $x=4$ —donde
              $f(x)=5$— y $x=3$, donde $f'=0$. Tres puntos parten el intervalo en
              cuatro.
          - valor: '5'
            mensaje: |
              Has contado un punto de más. Los extremos $x=1$ y $x=5$ no cuentan
              como puntos de corte: son el borde del intervalo.
        pista: |
          $h'=g'(f(x))f'(x)$ se anula si $f'(x)=0$ o si $f(x)=5$.
        desarrollo: |
          De la figura, $f'$ se anula solo en $x=3$, y $g'$ se anula solo en
          $u=5$. Ahora bien, $f(x)=5$ en **dos** abscisas: como
          $f(x)=6-(x-3)^{2}$,

          $$
          6-(x-3)^{2}=5
          \;\Longrightarrow\;
          (x-3)^{2}=1
          \;\Longrightarrow\;
          x=2\ \text{y}\ x=4
          $$

          Tres puntos —$2$, $3$ y $4$— parten $(1,5)$ en cuatro subintervalos.

      - tipo: calcular
        titulo: El valor máximo de h
        pregunta: |
          ¿Cuánto vale $h$ en su máximo relativo de $(1,5)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '6'
            mensaje: |
              Ese es $f(3)$, no $h(3)$. Falta el último paso: aplicar $g$ a ese
              valor. $h(3)=g\left(f(3)\right)=g(6)$.
          - valor: '10'
            mensaje: |
              Ese es $h(1)=g\left(f(1)\right)=g(2)=10$, el valor en el extremo del
              intervalo. Es más grande que el máximo relativo, pero el intervalo
              es abierto y ahí no hay extremo.
          - valor: '1'
            mensaje: |
              Ese es el valor en los dos mínimos, $h(2)=h(4)=g(5)=1$. El máximo
              relativo está entre ellos, en $x=3$.
        pista: |
          El máximo de $h$ está donde $f$ alcanza su máximo. Aplica $g$ a ese
          valor.
        desarrollo: |
          El máximo relativo está en $x=3$, y

          $$
          h(3)=g\left(f(3)\right)=g(6)=2
          $$

          leyendo $g(6)=2$ en la segunda gráfica. Los mínimos están en $x=2$ y
          $x=4$, donde $h=g(5)=1$.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              De la figura: $f$ crece en $(1,3)$ y decrece en $(3,5)$, con
              $f(1)=f(5)=2$ y máximo $f(3)=6$; y $g$ decrece hasta $u=5$ y crece
              a partir de ahí.
          - texto: >-
              Por la regla de la cadena,
              $h'(x)=g'\left(f(x)\right)\cdot f'(x)$.
          - texto: >-
              $f(x)=5$ en $x=2$ y en $x=4$, que es donde el primer factor cambia
              de signo; el segundo cambia en $x=3$.
          - texto: >-
              En $(1,2)$: $f$ crece y $f(x)<5$, así que $g'<0$ y $f'>0$:
              $h$ **decrece**.
          - texto: >-
              En $(2,3)$: $f$ sigue creciendo pero ya con $f(x)>5$, así que los
              dos factores son positivos: $h$ **crece**.
          - texto: >-
              En $(3,4)$: $f$ decrece con $f(x)>5$, así que $g'>0$ y $f'<0$:
              $h$ **decrece**. Y en $(4,5)$, con $f(x)<5$ y $f$ decreciendo, los
              dos factores son negativos: $h$ **crece**.
          - texto: >-
              Como $f$ crece en todo $(1,3)$ y $g$ decrece, $h$ decrece en todo
              $(1,3)$.
            trampa: true
            mensaje: |
              Solo hasta $x=2$. A partir de ahí $f(x)>5$, y por encima de $5$ la
              función $g$ **crece**: el producto de dos positivos vuelve a ser
              positivo. El punto que manda no es dónde tiene $f$ su máximo, sino
              dónde cruza $f$ el valor en el que $g$ cambia de sentido.

    resolucion: |
      **Lo que dice la figura.**

      - $f$ está definida en $[1,5]$: crece de $f(1)=2$ hasta el máximo
        $f(3)=6$ y vuelve a bajar hasta $f(5)=2$. Su recorrido es $[2,6]$.
      - $g$ está definida al menos en $[2,6]$: decrece desde $g(2)=10$ hasta el
        mínimo $g(5)=1$ y vuelve a subir hasta $g(6)=2$.

      Que el recorrido de $f$ caiga dentro del dominio de $g$ es lo que permite
      componerlas, y conviene decirlo.

      **La regla de la cadena.**

      $$
      h'(x)=g'\left(f(x)\right)\cdot f'(x)
      $$

      Hay **dos** factores y cada uno cambia de signo por su cuenta:

      - $f'(x)$ cambia de signo en $x=3$: positivo antes, negativo después.
      - $g'\left(f(x)\right)$ cambia de signo cuando $f(x)$ cruza el $5$, que es
        donde $g$ tiene su mínimo. Y $f$ vale $5$ en **dos** abscisas: $x=2$ y
        $x=4$.

      **Los cuatro tramos.**

      | tramo | $f(x)$ | $f'$ | $g'(f)$ | $h'$ | $h$ |
      |---|---|---|---|---|---|
      | $(1,2)$ | entre 2 y 5 | $+$ | $-$ | $-$ | decrece |
      | $(2,3)$ | entre 5 y 6 | $+$ | $+$ | $+$ | crece |
      | $(3,4)$ | entre 5 y 6 | $-$ | $+$ | $-$ | decrece |
      | $(4,5)$ | entre 2 y 5 | $-$ | $-$ | $+$ | crece |

      **Los extremos.** $h$ tiene mínimos en $x=2$ y $x=4$, los dos con
      $h=g(5)=1$, y un máximo relativo en $x=3$, con $h=g(6)=2$.

      **La forma de $h$.** Empieza en $h(1)=g(2)=10$, cae hasta $1$, sube a $2$,
      vuelve a caer a $1$ y sube otra vez hasta $h(5)=g(2)=10$. Es simétrica
      respecto de $x=3$, porque las dos funciones que la componen lo son
      respecto de sus vértices.

      **El error que este ejercicio persigue.** Mirar solo el máximo de $f$ y
      concluir que $h$ tiene dos tramos. La composición no hereda los cambios de
      sentido de $f$: hereda los suyos **y** los que provoca $g$ al ser cruzado
      su punto crítico. Por eso son cuatro y no dos.
