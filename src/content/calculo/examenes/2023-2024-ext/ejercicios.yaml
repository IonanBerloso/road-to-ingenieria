        <path class="gra24-lim" d="M60 185L60 215M340 66L340 215"/>
        <path class="gra24-c" d="M60 185L62 183.8L64 182.7L66 181.7L68 180.8L70 179.9L72 179.1L74 178.4L76 177.7L78 177.1L80 176.5L82 176L84 175.6L86 175.2L88 174.9L90 174.6L92 174.4L94 174.2L96 174.1L98 174L100 174L102 174L104 174.1L106 174.2L108 174.3L110 174.5L112 174.8L114 175L116 175.3L118 175.6L120 176L122 176.4L124 176.8L126 177.3L128 177.7L130 178.2L132 178.7L134 179.3L136 179.8L138 180.4L140 181L142 181.6L144 182.2L146 182.9L148 183.5L150 184.2L152 184.8L154 185.5L156 186.2L158 186.8L160 187.5L162 188.2L164 188.8L166 189.5L168 190.2L170 190.8L172 191.5L174 192.1L176 192.8L178 193.4L180 194L182 194.6L184 195.2L186 195.7L188 196.3L190 196.8L192 197.3L194 197.7L196 198.2L198 198.6L200 199L202 199.4L204 199.7L206 200L208 200.2L210 200.5L212 200.7L214 200.8L216 200.9L218 201L220 201L222 201L224 200.9L226 200.8L228 200.6L230 200.4L232 200.1L234 199.8L236 199.4L238 199L240 198.5L242 197.9L244 197.3L246 196.6L248 195.9L250 195.1L252 194.2L254 193.3L256 192.3L258 191.2L260 190L262 188.8L264 187.4L266 186.1L268 184.6L270 183L272 181.4L274 179.7L276 177.9L278 176L280 174L282 171.9L284 169.8L286 167.5L288 165.2L290 162.7L292 160.2L294 157.5L296 154.8L298 151.9L300 149L302 145.9L304 142.8L306 139.5L308 136.1L310 132.7L312 129.1L314 125.3L316 121.5L318 117.6L320 113.5L322 109.3L324 105L326 100.6L328 96L330 91.3L332 86.5L334 81.6L336 76.5L338 71.3L340 66"/>
