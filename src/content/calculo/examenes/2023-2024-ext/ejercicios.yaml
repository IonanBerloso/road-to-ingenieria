        <circle class="gra24-mk" cx="220" cy="201" r="3.4"/>
        <circle class="gra24-inf" cx="160" cy="187.5" r="3.4"/>
        <g class="gra24-n">
          <text x="60" y="232" text-anchor="middle">a</text>
          <text x="340" y="232" text-anchor="middle">b</text>
        </g>
        <text class="gra24-l" x="100" y="164" text-anchor="middle" fill="var(--live)">máx</text>
        <text class="gra24-l" x="220" y="219" text-anchor="middle" fill="var(--live)">mín</text>
        <text class="gra24-l" x="168" y="179.5" fill="var(--alt)">inflexión</text>
        <text class="gra24-l" x="310" y="132.7" text-anchor="end" fill="var(--ink)">f(x)</text>
      </svg>
      <figcaption>
      Figura redibujada del enunciado. La curva sube desde a hasta un máximo,
      baja hasta un mínimo y vuelve a subir con fuerza hasta b. No hay escala:
      lo único que se puede leer son los signos.
      </figcaption>
      </figure>
    pide: El crecimiento de h y sus extremos, razonados sobre el dibujo.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que mirar en el dibujo para saber cómo crece $h$?
        opciones:
          - texto: >-
              El signo de $f'$ —dónde sube y dónde baja— y el de $f''$ —dónde es
              cóncava y dónde convexa—, porque $h'=2f'f''$
            correcta: true
            mensaje: |
              Eso es, y es todo el ejercicio. No hay fórmula que calcular: hay
              que leer dos signos en el dibujo y multiplicarlos. Por eso el
              reparto es **siete puntos de explicación y dos de cálculo**.
          - texto: >-
              Solo dónde $f$ sube y dónde baja
            mensaje: |
              Eso da el signo de $f'$, que es la mitad. $h'=2f'f''$ es un
              producto: el otro factor es la curvatura, y sin él el signo puede
              salir al revés.
          - texto: >-
              El valor de $f$ en cada punto, porque $h$ se construye a partir de
              $f$
            mensaje: |
              $h$ se construye a partir de $f'$, no de $f$. Subir o bajar la
              gráfica entera no cambia $h$ en absoluto: lo que importa es la
              pendiente.

      - tipo: reconocer
        pregunta: |
          En el máximo de $f$, ¿qué le pasa a $h$?
        opciones:
          - texto: >-
              Tiene un **mínimo**, y vale exactamente cero
            correcta: true
            mensaje: |
              Eso es, y sale sin derivar nada: $h=\left(f'\right)^{2}\ge0$
              siempre, y en el máximo de $f$ la derivada se anula. Un valor
              cero en una función que nunca es negativa es un mínimo absoluto
              local.
          - texto: Tiene también un máximo
            mensaje: |
              Al revés. Al elevar al cuadrado, el punto donde $f'$ pasa por cero
              se convierte en el punto más **bajo** posible de $h$.
          - texto: >-
              No le pasa nada especial, porque $h$ depende de $f'$ y no de $f$
            mensaje: |
              Depende de $f'$, y justo por eso sí le pasa algo: en el máximo de
              $f$ la derivada vale cero, y $h=0$ ahí.

      - tipo: calcular
        titulo: El número de extremos
        pregunta: |
          ¿Cuántos extremos locales tiene $h$ en $\left(a,b\right)$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Los dos mínimos son los extremos de $f$, sí, pero entre ellos $h$
              sube y luego baja: hay un **máximo** en medio, justo en la
              inflexión de $f$.
          - valor: '1'
            mensaje: |
              $f$ tiene dos puntos con derivada nula, y en los dos $h$ vale cero
              y tiene un mínimo. Ya son dos, y falta el de en medio.
          - valor: '4'
            mensaje: |
              Cuatro exigiría un cambio de signo más en $h'=2f'f''$, y en el
              dibujo solo hay tres: dos ceros de $f'$ y uno de $f''$.
        pista: |
          $h'=2f'f''$ cambia de signo cada vez que se anula uno de los dos
          factores. Cuenta los ceros de $f'$ y los de $f''$ en el dibujo.
        desarrollo: |
          En el dibujo hay **dos** puntos con tangente horizontal —el máximo y
          el mínimo de $f$— y **uno** de inflexión entre ellos. En total tres
          ceros de $h'$, y en los tres cambia de signo.

      - tipo: justificar
        pregunta: Ordena el estudio. Una pieza es falsa.
        piezas:
          - texto: >-
              $h'=2f'f''$, así que el signo de $h'$ es el producto de los signos
              de la pendiente y de la curvatura de $f$.
          - texto: >-
              Del dibujo: $f'>0$ hasta el máximo, $f'<0$ entre el máximo y el
              mínimo, y $f'>0$ después; y $f''<0$ hasta la inflexión y $f''>0$
              a partir de ella.
          - texto: >-
              Multiplicando los signos, $h$ decrece, crece, decrece y crece: tres
              cambios, o sea **dos mínimos** —en los extremos de $f$, con
              $h=0$— y **un máximo**, en la inflexión.
          - texto: >-
              Como $f$ tiene un máximo, $h$ también lo tiene ahí: elevar al
              cuadrado conserva los extremos.
            trampa: true
            mensaje: |
              Elevar al cuadrado **no** conserva los extremos, y aquí ni
              siquiera se está elevando $f$ sino $f'$. En el máximo de $f$ la
              derivada vale cero, y como $h$ nunca es negativa, ahí $h$ tiene un
              **mínimo**. Los máximos de $h$ están donde $\left|f'\right|$ es
              mayor, que es en las inflexiones.
    resolucion: |
      **Lo primero, y decide el ejercicio:** no hay nada que calcular. La
      función no viene dada por una fórmula, así que la respuesta se lee en el
      dibujo. Siete de los diez puntos son de explicación.

      **La derivada de $h$.**

      $$
      h(x)=\left(f'(x)\right)^{2}
      \;\Longrightarrow\;
      h'(x)=2f'(x)\,f''(x)
      $$

      El signo de $h'$ es el **producto** de dos signos que se leen en la
      gráfica: la pendiente y la curvatura.

      **Lo que dice el dibujo.** Llamemos $c_{1}$ al máximo de $f$, $d$ a la
      inflexión y $c_{2}$ al mínimo.

      | tramo | $f'$ | $f''$ | $h'=2f'f''$ | $h$ |
      |---|---|---|---|---|
      | $\left(a,c_{1}\right)$ | $+$ | $-$ | $-$ | decrece |
      | $\left(c_{1},d\right)$ | $-$ | $-$ | $+$ | crece |
      | $\left(d,c_{2}\right)$ | $-$ | $+$ | $-$ | decrece |
      | $\left(c_{2},b\right)$ | $+$ | $+$ | $+$ | crece |

      **a) El crecimiento**, entonces: $h$ decrece, crece, decrece y crece.

      **b) Los extremos**, que salen de la tabla sin más:

      - en $c_{1}$ y en $c_{2}$, **mínimos locales**, y los dos con $h=0$;
      - en $d$, **máximo local**.

      **Y la lectura que no cuesta ninguna cuenta.** $h=\left(f'\right)^{2}$
      nunca es negativa, así que **allí donde $f'$ se anula, $h$ toca su suelo**:
      los extremos de $f$ son mínimos de $h$, con valor cero. Y $h$ es grande
      donde la pendiente de $f$ es grande en valor absoluto, que en un tramo
      entre dos extremos es justo la inflexión.

      Dicho de una vez: **$h$ mide lo empinada que está $f$**. Es cero donde $f$
      está horizontal y máxima donde $f$ está más inclinada. Escribir esa frase
      y justificarla vale los siete puntos de COMP 4.

      **Un detalle de rigor.** Que $h$ tenga un mínimo en $c_{1}$ no se deduce
      del criterio de la segunda derivada —habría que derivar $h$ dos veces y no
      hay fórmula—, sino del **cambio de signo de $h'$**, que es el criterio de
      la primera. Con una función dada solo por su dibujo, ese es el único
      criterio disponible.

  - id: ex2324-ext-3-mclaurin-de-la-campana-al-reves
    titulo: El polinomio de una integral que no se sabe resolver
    fuente: >-
      Ejercicio 3 del PRIMER PARCIAL · Convocatoria extraordinaria, 1 de julio de
      2024 · Cálculo, UPV/EHU · Es el mismo enunciado, palabra por palabra, que
      el ejercicio 2 de la tercera evaluación de 2020-2021 · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      a) Calcular el polinomio de McLaurin de orden 3 de la función
      $$
      f(x)=\int_{0}^{x}e^{z^{2}}\,dz
      $$

      b) ¿La función $f(x)$ definida en el apartado anterior tiene puntos de
      inflexión?
    pide: El polinomio de orden 3 y los puntos de inflexión.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuánto vale $f(0)$?
        opciones:
          - texto: >-
              Cero, porque los dos límites de integración coinciden
            correcta: true
            mensaje: |
              Eso es, y es el término independiente del polinomio. Se contesta
              sin integrar y sin derivar: una integral de $0$ a $0$ vale cero
              sea cual sea el integrando.
          - texto: Uno, porque $e^{0}=1$
            mensaje: |
              $1$ es el valor del **integrando** en cero, y eso es $f'(0)$, no
              $f(0)$. Ojo a la diferencia: el teorema fundamental relaciona el
              integrando con la derivada, no con la función.
          - texto: >-
              No se puede saber, porque la integral no tiene primitiva elemental
            mensaje: |
              No la tiene —$e^{z^{2}}$ es de las que no se integran— y aun así
              $f(0)$ se conoce: vale cero por definición de integral definida.

      - tipo: calcular
        titulo: La tercera derivada
        pregunta: |
          ¿Cuánto vale $f'''(0)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              $0$ es $f''(0)$. La tercera hay que derivar una vez más:
              $f'''=\left(2+4x^{2}\right)e^{x^{2}}$, que en el origen vale $2$.
          - valor: '1'
            mensaje: |
              $1$ es $f'(0)$. Cada derivada baja un escalón y hay que llegar
              hasta la tercera.
          - valor: '4'
            mensaje: |
              $4$ saldría de quedarse con el $4x^{2}$ y olvidar el $2$. En el
              origen el término con $x^{2}$ se anula y sobrevive el otro.
        pista: |
          $f'=e^{x^{2}}$, $f''=2x\,e^{x^{2}}$, y la tercera sale por la regla
          del producto.
        desarrollo: |
          $$
          f'(x)=e^{x^{2}},
          \qquad
          f''(x)=2x\,e^{x^{2}},
          \qquad
          f'''(x)=\left(2+4x^{2}\right)e^{x^{2}}
          $$

          En el origen: $f'(0)=1$, $f''(0)=0$, $f'''(0)=2$.

      - tipo: calcular
        titulo: El polinomio en un punto
        pregunta: |
          ¿Qué vale $P_{3}\left(\frac12\right)$?
        respuesta:
          tipo: numero
          valor: '0.5416667'
          tolerancia: 0.0002
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              $\frac12$ es solo el término lineal. Falta
              $\frac{1}{3}\left(\frac12\right)^{3}=\frac1{24}$.
          - valor: '0.625'
            mensaje: |
              $\frac12+\frac18$ sale de usar $x^{3}$ sin el tercio. El
              coeficiente es $\frac{f'''(0)}{3!}=\frac{2}{6}=\frac13$.
          - valor: '0.7708333'
            mensaje: |
              Parece que has metido un término cuadrático. $f''(0)=0$, así que
              el polinomio no tiene $x^{2}$: es impar, como la función.
        pista: |
          $P_{3}(x)=x+\frac{x^{3}}{3}$.
        desarrollo: |
          $$
          P_{3}(x)=0+1\cdot x+\frac{0}{2}x^{2}+\frac{2}{6}x^{3}
          =x+\frac{x^{3}}{3}
          $$

          $$
          P_{3}\left(\tfrac12\right)=\tfrac12+\tfrac1{24}=\tfrac{13}{24}
          \approx0{,}5417
          $$

          El valor real es $0{,}5450$: el polinomio se queda tres milésimas
          corto.

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              Por el teorema fundamental, $f'(x)=e^{x^{2}}$, y de ahí
              $f''(x)=2x\,e^{x^{2}}$.
          - texto: >-
              La exponencial nunca se anula, así que $f''$ se anula solo donde se
              anula el factor $2x$: en $x=0$.
          - texto: >-
              Y ahí **cambia de signo** —negativa a la izquierda, positiva a la
              derecha—, luego $x=0$ es punto de inflexión, y el único.
          - texto: >-
              Como $f''(0)=0$, en el origen hay un extremo relativo de $f$.
            trampa: true
            mensaje: |
              Lo que se anula en el origen es la **segunda** derivada, no la
              primera. La primera vale $f'(0)=e^{0}=1$, así que ahí $f$ crece con
              pendiente uno: no hay extremo. De hecho $f'=e^{x^{2}}>0$ en todo
              punto y $f$ **no tiene ningún extremo**. Confundir el cero de $f''$
              con un extremo es el error que este apartado busca.
    resolucion: |
      **a) El polinomio, sin resolver la integral.** La función $e^{z^{2}}$ no
      tiene primitiva elemental, así que la única vía es el teorema fundamental
      del Cálculo — que da la derivada directamente:

      $$
      f(0)=0,
      \qquad
      f'(x)=e^{x^{2}},
      \qquad
      f''(x)=2x\,e^{x^{2}},
      \qquad
      f'''(x)=\left(2+4x^{2}\right)e^{x^{2}}
      $$

      Evaluando en el origen: $0$, $1$, $0$, $2$.

      $$
      \boxed{\;P_{3}(x)=x+\frac{x^{3}}{3}\;}
      $$

      **Una comprobación que sale gratis.** $f$ es **impar** —el integrando es
      par y la integral empieza en cero—, así que su desarrollo solo puede tener
      potencias impares. El $0$ del término cuadrático no es casualidad: tenía
      que salir.

      **Y otra, para el que conozca la serie.** $e^{u}=1+u+\frac{u^{2}}2+\cdots$
      con $u=z^{2}$ da $e^{z^{2}}=1+z^{2}+\cdots$, e integrando término a
      término entre $0$ y $x$ sale $x+\frac{x^{3}}{3}+\cdots$ ✓. Es un camino
      más corto que derivar tres veces, y perfectamente válido.

      **b) Los puntos de inflexión.**

      $$
      f''(x)=2x\,e^{x^{2}}
      $$

      La exponencial es siempre positiva, así que el signo lo pone $2x$:
      negativa a la izquierda del origen y positiva a la derecha. Hay **un
      único punto de inflexión, en $x=0$**, y no hay más porque no hay más ceros.

      **Lo que conviene añadir, porque puntúa.** $f'=e^{x^{2}}>0$ en todo punto,
      así que $f$ es **estrictamente creciente** y no tiene ningún extremo. La
      inflexión en el origen es además el punto de pendiente **mínima**: la
      curva es más plana ahí que en cualquier otro sitio, y a partir de ahí se
      dispara en las dos direcciones.

  - id: ex2324-ext-4-la-ventana-con-el-remate-semicircular
    titulo: La ventana de arco, y la proporción que sale sin depender del perímetro
    fuente: >-
      Ejercicio 4 del PRIMER PARCIAL · Convocatoria extraordinaria, 1 de julio de
      2024 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Una ventana tiene forma rectangular y su parte superior es semicircular.
      Supongamos que el perímetro de la ventana es un valor prefijado $P$.
      ¿Cuáles deben ser las dimensiones de la ventana para que su área sea
      máxima?
    pide: Las dimensiones que maximizan el área.

    pasos:
      - tipo: reconocer
        pregunta: |
          Si el radio del semicírculo es $r$, ¿cuánto mide el perímetro?
        opciones:
          - texto: >-
              $2h+2r+\pi r$, con $h$ la altura del rectángulo: los dos laterales,
              la base y el arco
            correcta: true
            mensaje: |
              Eso es, y el detalle que decide el ejercicio es que **el lado de
              arriba del rectángulo no cuenta**: por ahí la ventana no tiene
              marco, está el semicírculo. Y el arco mide $\pi r$, media
              circunferencia, no $2\pi r$.
          - texto: $2h+2r+2\pi r$
            mensaje: |
              El $2\pi r$ es la circunferencia entera. Aquí solo hay **media**, y
              su longitud es $\pi r$.
          - texto: $2h+4r+\pi r$
            mensaje: |
              Parece que has contado la base **y** el lado de arriba del
              rectángulo. El de arriba no es perímetro: por ahí el rectángulo se
              encuentra con el semicírculo, y no hay borde.

      - tipo: calcular
        titulo: El radio óptimo
        pregunta: |
          Con $P=10$, ¿cuánto vale el radio que maximiza el área?
        respuesta:
          tipo: numero
          valor: '1.4002481'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '2.5'
            mensaje: |
              $\frac{P}{4}$ sería el lado del cuadrado de perímetro $P$, y aquí
              la figura no es un cuadrado. El denominador que sale es $4+\pi$,
              no $4$.
          - valor: '1.5915494'
            mensaje: |
              $\frac{P}{2\pi}$ es el radio del **círculo** de perímetro $P$. La
              ventana solo lleva medio círculo y además tiene lados rectos.
          - valor: '1.9634954'
            mensaje: |
              $\frac{P}{4+\pi}$ con el $\pi$ mal puesto. Repasa el denominador:
              $A'=P-4r-\pi r$ da $r\left(4+\pi\right)=P$.
        pista: |
          $A(r)=Pr-2r^{2}-\frac{\pi r^{2}}{2}$, y se deriva respecto de $r$.
        desarrollo: |
          De $2h+2r+\pi r=P$ sale $h=\frac{P-2r-\pi r}{2}$, y

          $$
          A=2rh+\frac{\pi r^{2}}{2}=Pr-2r^{2}-\frac{\pi r^{2}}{2}
          $$

          $$
          A'(r)=P-4r-\pi r=0
          \;\Longrightarrow\;
          r=\frac{P}{4+\pi}
          $$

          Con $P=10$: $r=\frac{10}{7{,}1416}\approx1{,}4002$.

      - tipo: calcular
        titulo: El área máxima
        pregunta: |
          Con $P=10$, ¿cuánto vale el área máxima?
        respuesta:
          tipo: numero
          valor: '7.0012394'
          tolerancia: 0.002
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '6.25'
            mensaje: |
              $6{,}25$ es el área del cuadrado de perímetro $10$. La ventana con
              arco encierra más: para eso está el semicírculo.
          - valor: '7.9577472'
            mensaje: |
              Ese es el área del círculo de perímetro $10$, que es la figura que
              más encierra de todas — pero la ventana no puede ser un círculo:
              tiene que tener base recta y dos lados.
          - valor: '3.5006197'
            mensaje: |
              La mitad del valor bueno. Revisa la fórmula: $A=P^{2}/(2(4+\pi))$,
              no $P^{2}/(4(4+\pi))$.
        pista: |
          Sustituyendo $r=\frac{P}{4+\pi}$ queda $A=\frac{P^{2}}{2\left(4+\pi
          \right)}$.
        desarrollo: |
          $$
          A_{\max}=\frac{P^{2}}{2\left(4+\pi\right)}
          =\frac{100}{14{,}283}\approx7{,}001
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El perímetro es $2h+2r+\pi r=P$, sin el lado de arriba del
              rectángulo, y de ahí $h=\frac{P-\left(2+\pi\right)r}{2}$.
          - texto: >-
              El área es $A=2rh+\frac{\pi r^{2}}{2}$, y sustituyendo queda
              $A(r)=Pr-2r^{2}-\frac{\pi r^{2}}{2}$, una parábola hacia abajo.
          - texto: >-
              $A'=P-\left(4+\pi\right)r=0$ da $r=\frac{P}{4+\pi}$, y al
              sustituir sale $h=\frac{P}{4+\pi}$ también: **la altura del
              rectángulo es igual al radio**.
          - texto: >-
              Que $A''=-\left(4+\pi\right)$ sea negativa no basta para asegurar
              que es un máximo: hay que comprobar además los extremos del
              intervalo.
            trampa: true
            mensaje: |
              Sí basta, y de sobra. $A$ es una parábola con el coeficiente de
              $r^{2}$ negativo: tiene **un** punto crítico y es su máximo
              absoluto en toda la recta, no solo local. Mirar los extremos del
              intervalo es obligatorio cuando la función puede alcanzar allí su
              máximo, y en una parábola hacia abajo con el vértice dentro, no
              puede.
    resolucion: |
      **El planteamiento, que es donde se pierde el ejercicio.** El perímetro
      **no** incluye el lado de arriba del rectángulo: por ahí la ventana no
      tiene marco, se encuentra con el semicírculo. Con $r$ el radio del
      semicírculo y $h$ la altura del rectángulo —cuya base mide $2r$—:

      $$
      P=\underbrace{2h}_{\text{laterales}}+\underbrace{2r}_{\text{base}}
      +\underbrace{\pi r}_{\text{arco}}
      $$

      Y el área es la del rectángulo más la del semicírculo:

      $$
      A=2rh+\frac{\pi r^{2}}{2}
      $$

      **Una variable, no dos.** Despejando $h=\frac{P-2r-\pi r}{2}$ y
      sustituyendo:

      $$
      A(r)=r\left(P-2r-\pi r\right)+\frac{\pi r^{2}}{2}
      =Pr-2r^{2}-\frac{\pi r^{2}}{2}
      $$

      **El máximo.**

      $$
      A'(r)=P-4r-\pi r=0
      \;\Longrightarrow\;
      \boxed{\;r=\frac{P}{4+\pi}\;}
      $$

      Y es máximo sin discusión: $A$ es una parábola con $A''=-\left(4+\pi
      \right)<0$.

      **La sorpresa, y es la respuesta que el ejercicio busca.** Sustituyendo
      ese radio en $h$:

      $$
      h=\frac{P-\left(2+\pi\right)\frac{P}{4+\pi}}{2}
      =\frac{P}{2}\cdot\frac{4+\pi-2-\pi}{4+\pi}
      =\frac{P}{4+\pi}=r
      $$

      **La altura del rectángulo es igual al radio.** Es decir: la base mide
      $2r$ y la altura $r$, o sea que **el rectángulo es el doble de ancho que
      de alto** — y esa proporción no depende de $P$ para nada. Cualquier
      ventana de arco óptima tiene la misma forma; lo único que cambia es la
      escala.

      **El área que sale.**

      $$
      A_{\max}=\frac{P^{2}}{2\left(4+\pi\right)}\approx0{,}0700\,P^{2}
      $$

      **Para comparar**, con el mismo perímetro: un cuadrado encierra
      $\frac{P^{2}}{16}=0{,}0625P^{2}$ y un círculo $\frac{P^{2}}{4\pi}=
      0{,}0796P^{2}$. La ventana de arco queda en medio, más cerca del círculo
      — que es exactamente lo que uno esperaría de una figura que es medio
      círculo y medio rectángulo.

  - id: ex2324-ext-5-la-parabola-y-su-tangente-de-pendiente-ocho
    titulo: Una parábola, su tangente, y el recinto que dejan en el primer cuadrante
    fuente: >-
      Ejercicio 5 del PRIMER PARCIAL · Convocatoria extraordinaria, 1 de julio de
      2024 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea la función $y=4x^{2}$. Consideremos el dominio $D$ situado en el
      primer cuadrante y limitado por la gráfica de la función y la gráfica de
      su recta tangente que es paralela a la recta $y=8x$.

      a) Dibujar el dominio $D$.

      b) Calcular el área de $D$.

      c) Calcular el volumen del sólido engendrado al girar el recinto $D$
      alrededor del eje OX.
    pide: El dibujo, el área y el volumen.

    pasos:
      - tipo: calcular
        titulo: El punto de tangencia
        pregunta: |
          ¿En qué abscisa la tangente a $y=4x^{2}$ tiene pendiente $8$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '8'
            mensaje: |
              $8$ es la pendiente, no la abscisa. La derivada es $y'=8x$, y hay
              que resolver $8x=8$.
          - valor: '4'
            mensaje: |
              El $4$ es el coeficiente de la parábola. La derivada de $4x^{2}$
              es $8x$, y se iguala a $8$.
          - valor: '2'
            mensaje: |
              Con $x=2$ la pendiente valdría $16$. Repasa: $y'=8x$.
        pista: |
          Deriva y iguala a la pendiente de $y=8x$.
        desarrollo: |
          $$
          y'=8x=8\;\Longrightarrow\;x=1
          $$

          El punto de tangencia es $\left(1,4\right)$ y la recta tangente

          $$
          y=4+8\left(x-1\right)=8x-4
          $$

          que corta al eje $X$ en $x=\frac12$.

      - tipo: reconocer
        pregunta: |
          Una parábola y su tangente solo se tocan en un punto. Entonces, ¿qué
          cierra el recinto $D$?
        opciones:
          - texto: >-
              El propio eje $X$, porque el enunciado restringe al primer
              cuadrante
            correcta: true
            mensaje: |
              Eso es. La tangente se hunde bajo el eje a la izquierda de
              $x=\frac12$, así que la condición «primer cuadrante» corta ahí y
              el tercer lado del recinto es el segmento del eje de $0$ a
              $\frac12$.
          - texto: >-
              Nada: el recinto es infinito
            mensaje: |
              Lo sería sin la restricción al primer cuadrante, porque parábola y
              tangente se separan indefinidamente hacia la izquierda. La
              condición $y\ge0$ lo cierra.
          - texto: >-
              La recta $y=8x$ del enunciado
            mensaje: |
              Esa recta solo aparece para **decir la pendiente**: es una
              referencia, no un lado del recinto. La que limita es la tangente,
              $y=8x-4$.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área de $D$?
        respuesta:
          tipo: numero
          valor: '0.3333333'
          tolerancia: 0.0005
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.3333333'
            mensaje: |
              $\frac43$ es solo $\int_{0}^{1}4x^{2}dx$, o sea el área bajo la
              parábola. Falta restarle el triángulo que queda bajo la tangente.
          - valor: '1'
            mensaje: |
              $1$ es el área del triángulo de vértices
              $\left(\frac12,0\right)$, $\left(1,0\right)$ y $\left(1,4\right)$,
              que es lo que hay que **restar**, no el resultado.
          - valor: '0.6666667'
            mensaje: |
              $\frac23$ saldría con un triángulo de área $\frac23$. La base mide
              $\frac12$ y la altura $4$: su área es $1$.
        pista: |
          Área bajo la parábola de $0$ a $1$, menos el triángulo bajo la
          tangente.
        desarrollo: |
          $$
          A=\int_{0}^{1}4x^{2}\,dx-\frac{1}{2}\cdot\frac12\cdot4
          =\frac43-1=\frac13
          $$

      - tipo: justificar
        pregunta: Ordena el apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              Al girar alrededor de OX, cada sección es un disco de $0$ a
              $\frac12$ —donde la tangente aún no ha salido del eje— y una
              **corona** de $\frac12$ a $1$.
          - texto: >-
              De $0$ a $\frac12$ el radio es $4x^{2}$ y aporta
              $\pi\int_{0}^{1/2}16x^{4}dx=\frac{\pi}{10}$.
          - texto: >-
              De $\frac12$ a $1$ hay que restar el hueco de la recta:
              $\pi\int_{1/2}^{1}\left[16x^{4}-\left(8x-4\right)^{2}\right]dx
              =\frac{13\pi}{30}$, y el total es $\frac{8\pi}{15}$.
          - texto: >-
              Como el recinto es el área entre dos curvas, el volumen se puede
              calcular como $\pi\int\left(\text{arriba}-\text{abajo}\right)^{2}
              dx$.
            trampa: true
            mensaje: |
              Es el error clásico de los sólidos de revolución, y da un número
              distinto. Lo que se resta son los **cuadrados**, no las funciones:
              $\pi\int\left(R^{2}-r^{2}\right)$, no
              $\pi\int\left(R-r\right)^{2}$. La corona tiene área
              $\pi R^{2}-\pi r^{2}$, y eso no es $\pi\left(R-r\right)^{2}$ salvo
              que $r$ valga cero.
    resolucion: |
      **La tangente.** $y'=8x$, y la pendiente pedida es $8$, así que $x=1$ y el
      punto de tangencia es $\left(1,4\right)$:

      $$
      y=8x-4
      $$

      Corta al eje $X$ en $x=\frac12$, y ese corte es el que cierra el recinto.

      **a) El dominio.** Una parábola y su tangente solo se tocan en un punto,
      así que por sí solas no encierran nada. Lo que cierra $D$ es la
      restricción al **primer cuadrante**: por debajo de $x=\frac12$ la tangente
      se hunde bajo el eje, y el borde de abajo pasa a ser el propio eje.

