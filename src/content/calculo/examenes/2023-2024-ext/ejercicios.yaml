      <figcaption>
      Figura redibujada del enunciado. Arriba, la semicircunferencia de radio dos
      marcada como L2; abajo, la curva L1, que el enunciado no describe. Lo
      único que se sabe de ella es que va de (−2,0) a (2,0) y que encierra, con
      la de arriba, un área de diez.
      </figcaption>
      </figure>
    pide: El valor de la integral a lo largo de L1.

    pasos:
      - tipo: reconocer
        pregunta: |
          De $L_{1}$ solo se conocen sus extremos. ¿Por qué se puede calcular la
          integral igualmente?
        opciones:
          - texto: >-
              Porque cerrando el camino con $L_{2}$ y aplicando Green, la
              integral doble solo depende del **área**, que sí es dato
            correcta: true
            mensaje: |
              Eso es. Con $P=-y$ y $Q=x$ sale $Q_{x}-P_{y}=2$, una constante, y
              la integral doble de una constante es esa constante por el área.
              Por eso el enunciado da el área y no la curva.
          - texto: >-
              Porque el campo es conservativo y solo dependen los extremos
            mensaje: |
              No lo es: $Q_{x}-P_{y}=2\ne0$. Si lo fuera, el área no haría falta
              para nada — y el enunciado no la daría.
          - texto: >-
              Porque $L_{1}$ se puede sustituir por el segmento entre sus
              extremos
            mensaje: |
              Solo si el campo fuera conservativo. Como no lo es, cambiar la
              curva cambia la integral, y la diferencia es exactamente el área
              encerrada entre las dos.

      - tipo: calcular
        titulo: La circulación completa
        pregunta: |
          ¿Cuánto vale $\displaystyle\oint$ sobre la frontera completa,
          recorrida en sentido positivo?
        respuesta:
          tipo: numero
          valor: '20'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '10'
            mensaje: |
              $10$ es el área. Green multiplica el área por $Q_{x}-P_{y}$, que
              aquí vale $2$.
          - valor: '5'
            mensaje: |
              Parece que has **dividido** entre dos. El campo $-y\,dx+x\,dy$ es
              el que se usa para medir áreas justo con un medio delante:
              $A=\frac12\oint$. Aquí se pide la circulación, no el área.
          - valor: '40'
            mensaje: |
              $40$ sería con $Q_{x}-P_{y}=4$. Repasa: $Q_{x}=1$ y $P_{y}=-1$, así
              que su diferencia es $2$.
        pista: |
          $Q_{x}-P_{y}$ es constante, así que la integral doble es esa constante
          por el área.
        desarrollo: |
          $$
          Q_{x}-P_{y}=1-\left(-1\right)=2
          \;\Longrightarrow\;
          \oint=\iint_{R}2\,dA=2A=20
          $$

      - tipo: calcular
        titulo: El camino de arriba
        pregunta: |
          ¿Cuánto vale la integral a lo largo de $L_{2}$, recorrida de
          $\left(2,0\right)$ a $\left(-2,0\right)$?
        respuesta:
          tipo: numero
          valor: '12.5663706'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '6.2831853'
            mensaje: |
              $2\pi$ es el área del semicírculo de radio $2$, no la integral. El
              integrando sale constante e igual a $4$, y el intervalo de
              parámetro mide $\pi$.
          - valor: '25.1327412'
            mensaje: |
              $8\pi$ saldría con el radio al cuadrado mal puesto. Con $r=2$ el
              integrando es $4\left(\operatorname{sen}^{2}+\cos^{2}\right)=4$.
          - valor: '3.1415927'
            mensaje: |
              $\pi$ es solo la longitud del intervalo del parámetro. Falta
              multiplicar por el valor del integrando.
        pista: |
          Parametriza $x=2\cos\theta$, $y=2\operatorname{sen}\theta$ con $\theta$
          de $0$ a $\pi$, y verás que el integrando se simplifica a una
          constante.
        desarrollo: |
          $$
          -y\,dx+x\,dy
          =4\operatorname{sen}^{2}\theta\,d\theta+4\cos^{2}\theta\,d\theta
          =4\,d\theta
          $$

          $$
          \int_{L_{2}}=\int_{0}^{\pi}4\,d\theta=4\pi\approx12{,}566
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La frontera de la región, recorrida en sentido positivo, es
              $L_{1}$ de $\left(-2,0\right)$ a $\left(2,0\right)$ seguida de
              $L_{2}$ de $\left(2,0\right)$ a $\left(-2,0\right)$: por abajo de
              izquierda a derecha y por arriba de vuelta.
          - texto: >-
              Green da $\oint=\iint_{R}2\,dA=2\cdot10=20$, y no hace falta
              conocer la forma de $L_{1}$ porque el integrando es constante.
          - texto: >-
              Sobre $L_{2}$ la integral vale $4\pi$, así que
              $I=20-4\pi\approx7{,}43$.
          - texto: >-
              Como el campo $-y\,dx+x\,dy$ es el que sirve para medir áreas, la
              integral sobre $L_{1}$ tiene que valer directamente el área, o sea
              $10$.
            trampa: true
            mensaje: |
              El campo sirve para medir áreas **sobre curvas cerradas**, y con un
              medio delante: $A=\frac12\oint$. $L_{1}$ no es cerrada, así que su
              integral no mide nada por sí sola. De hecho sale $7{,}43$, ni $10$
              ni $20$: lo que falta es justo la aportación del arco de arriba.
    resolucion: |
      **El truco del enunciado, y hay que verlo antes de escribir nada.** De
      $L_{1}$ no se dice nada: ni fórmula, ni parametrización, ni siquiera de qué
      tipo de curva es. Lo único que se da es el área encerrada. Eso solo puede
      significar una cosa: **Green**, y que la integral doble dependa nada más
      que del área.

      Y así es:

      $$
      P=-y,\qquad Q=x
      \;\Longrightarrow\;
      \frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}=1+1=2
      $$

      Una **constante**. Por eso el área basta.

      **Cerrar el camino.** La frontera de la región, recorrida en sentido
      positivo —dejándola a la izquierda—, es $L_{1}$ de $\left(-2,0\right)$ a
      $\left(2,0\right)$, y después $L_{2}$ de vuelta:

      $$
      \oint_{\partial R}=I+\int_{L_{2}}^{\,(2,0)\to(-2,0)}
      $$

      $$
      \oint_{\partial R}=\iint_{R}2\,dA=2\cdot 10=20
      $$

      **El arco.** $L_{2}$ es la semicircunferencia de radio $2$, y con
      $x=2\cos\theta$, $y=2\operatorname{sen}\theta$, $\theta$ de $0$ a $\pi$
      —que es justo de $\left(2,0\right)$ a $\left(-2,0\right)$—:

      $$
      -y\,dx+x\,dy=4\operatorname{sen}^{2}\theta\,d\theta
      +4\cos^{2}\theta\,d\theta=4\,d\theta
      $$

      El integrando se simplifica a una constante, y

      $$
      \int_{L_{2}}=4\pi
      $$

      **El resultado.**

      $$
      \boxed{\;I=20-4\pi\approx7{,}434\;}
      $$

      **Por qué el arco da $4\pi$ y no otra cosa.** Para este campo concreto,
      $\frac12\oint$ mide el área encerrada; sobre un arco centrado en el origen
      lo que mide es **el doble del área del sector barrido**. Aquí el sector es
      medio disco de radio $2$, de área $2\pi$, y $2\cdot 2\pi=4\pi$ ✓. Es una
      comprobación de diez segundos que no exige repetir la integral.

  - id: ex2324-ext-8-clasificar-tres-y-resolver-la-exacta
    titulo: Tres ecuaciones, tres etiquetas, y solo una que resolver
    fuente: >-
      Ejercicio 3 del SEGUNDO PARCIAL · Convocatoria extraordinaria, 1 de julio
      de 2024 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Clasificar las siguientes EDOs indicando cuál es homogénea, cuál lineal y
      cuál exacta (comprobando las tres EDOs). Resolver la EDO exacta:

      a) $y'=\dfrac{e^{2}-yx^{2}}{\ln x}$

      b) $\dfrac{2y^{3}\cos\left(2x\right)}{3}+\left(y^{2}\operatorname{sen}
      \left(2x\right)+y^{2}\right)y'=0$

      c) $-y^{2}dx+\left(x^{2}+xy\ln\left(x/y\right)\right)dy=0$
    pide: La clasificación de las tres, comprobada, y la solución de la exacta.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál de las tres es la **lineal**?
        opciones:
          - texto: >-
              La a), porque se puede escribir como $y'+p(x)\,y=q(x)$
            correcta: true
            mensaje: |
              Eso es. Multiplicando por $\ln x$ queda
              $y'\ln x+x^{2}y=e^{2}$, y dividiendo entre $\ln x$ se ve la forma
              estándar: la $y$ aparece a la primera potencia y sin
              multiplicarse por su derivada.
          - texto: La b)
            mensaje: |
              En la b) aparecen $y^{3}$ e $y^{2}$: la incógnita está elevada, así
              que no es lineal. Y además $y^{2}$ multiplica a $y'$.
          - texto: La c)
            mensaje: |
              En la c) hay $y^{2}$ y un $\ln\left(x/y\right)$ con la incógnita
              dentro del logaritmo. Ni de lejos.

      - tipo: calcular
        titulo: La comprobación de la exacta
        pregunta: |
          En la b), con $M=\frac{2y^{3}\cos 2x}{3}$, ¿cuánto vale $M_{y}$ en el
          punto $x=0$, $y=1$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0.6666667'
            mensaje: |
              $\frac23$ es $M$ mismo en ese punto, no su derivada respecto de
              $y$. Al derivar, el $y^{3}$ baja un $3$ que cancela el
              denominador.
          - valor: '6'
            mensaje: |
              $6$ saldría de olvidar el $\frac13$ del denominador:
              $\frac{2\cdot3}{3}=2$, no $6$.
          - valor: '0'
            mensaje: |
              Cero sería si $M$ no dependiera de $y$. Depende, y a la tercera
              potencia.
        pista: |
          $M_{y}=2y^{2}\cos 2x$, y en $x=0$ el coseno vale $1$.
        desarrollo: |
          $$
          M_{y}=\frac{2\cdot3y^{2}\cos 2x}{3}=2y^{2}\cos 2x
          \;\Longrightarrow\;
          M_{y}(0,1)=2
          $$

          Y por el otro lado, con $N=y^{2}\operatorname{sen}2x+y^{2}$:

          $$
          N_{x}=2y^{2}\cos 2x
          \;\Longrightarrow\;
          N_{x}(0,1)=2
          $$

          **Coinciden en todo punto**, así que la b) es exacta.

      - tipo: calcular
        titulo: La constante de la solución
        pregunta: |
          La solución de la exacta es $y^{3}\left(\operatorname{sen}2x+1\right)
          =C$. ¿Cuánto vale $C$ para la curva que pasa por
          $\left(\frac\pi4,1\right)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              $1$ saldría con $\operatorname{sen}\frac\pi2=0$, y vale $1$. En
              $x=\frac\pi4$ el argumento del seno es $2x=\frac\pi2$.
          - valor: '0'
            mensaje: |
              Cero exigiría $\operatorname{sen}2x=-1$, que pasa en
              $x=\frac{3\pi}4$, no en $\frac\pi4$.
          - valor: '3'
            mensaje: |
              $3$ saldría de $1^{3}\cdot\left(1+2\right)$. El paréntesis es
              $\operatorname{sen}\left(\frac\pi2\right)+1=2$.
        pista: |
          $\operatorname{sen}\left(2\cdot\frac\pi4\right)=\operatorname{sen}
          \frac\pi2=1$.
        desarrollo: |
          $$
          C=1^{3}\left(1+1\right)=2
          $$

      - tipo: justificar
        pregunta: Ordena la resolución de la exacta. Una pieza es falsa.
        piezas:
          - texto: >-
              Como $M_{y}=N_{x}=2y^{2}\cos 2x$, existe un potencial $F$ con
              $F_{x}=M$ y $F_{y}=N$.
          - texto: >-
              Integrando $F_{x}=\frac{2y^{3}\cos 2x}{3}$ respecto de $x$ sale
              $F=\frac{y^{3}\operatorname{sen}2x}{3}+g(y)$, con una **función**
              de $y$ como constante de integración.
          - texto: >-
              Derivando eso respecto de $y$ e igualando a $N$ queda
              $g'(y)=y^{2}$, o sea $g=\frac{y^{3}}{3}$, y la solución es
              $y^{3}\left(\operatorname{sen}2x+1\right)=C$.
          - texto: >-
              Al integrar $F_{x}$ respecto de $x$, la constante de integración es
              un número, como siempre.
            trampa: true
            mensaje: |
              Es una **función de $y$**, no un número. Al integrar respecto de
              $x$, cualquier cosa que solo dependa de $y$ se comporta como
              constante y desaparece al derivar. Si se pone un número, se pierde
              el $\frac{y^{3}}{3}$ y la solución sale mal. Es el error número uno
              de las exactas.
    resolucion: |
      **La clasificación, comprobada una a una.**

      **a) Lineal.** Multiplicando por $\ln x$:

      $$
      y'\ln x+x^{2}y=e^{2}
      \;\Longrightarrow\;
      y'+\frac{x^{2}}{\ln x}\,y=\frac{e^{2}}{\ln x}
      $$

      Forma estándar $y'+p(x)y=q(x)$: la incógnita aparece a la primera potencia
      y no multiplica a su derivada. Y no es exacta ni homogénea, porque los
      coeficientes no son homogéneos del mismo grado.

      **b) Exacta.** Con $M=\frac{2y^{3}\cos 2x}{3}$ y
      $N=y^{2}\operatorname{sen}2x+y^{2}$:

      $$
      M_{y}=2y^{2}\cos 2x,
      \qquad
      N_{x}=2y^{2}\cos 2x
      $$

      Coinciden **en todo punto**, que es la condición.

      **c) Homogénea.** Con $M=-y^{2}$ y $N=x^{2}+xy\ln\left(x/y\right)$,
      sustituyendo $x\to tx$, $y\to ty$: el logaritmo no cambia —porque
      $\frac{tx}{ty}=\frac xy$— y los dos coeficientes quedan multiplicados por
      $t^{2}$. Homogéneos de grado $2$.

      Y **no** es exacta: $M_{y}=-2y$ mientras que
      $N_{x}=2x+y\ln\left(x/y\right)+y$.

      **La exacta, resuelta.** Se busca $F$ con $F_{x}=M$ y $F_{y}=N$:

      $$
      F=\int\frac{2y^{3}\cos 2x}{3}\,dx
      =\frac{y^{3}\operatorname{sen}2x}{3}+g(y)
      $$

      La «constante» de integración es una **función de $y$**, porque al derivar
      respecto de $x$ cualquier cosa que solo dependa de $y$ se anula. Ahora se
      impone la otra condición:

      $$
      F_{y}=y^{2}\operatorname{sen}2x+g'(y)=y^{2}\operatorname{sen}2x+y^{2}
      \;\Longrightarrow\;
      g'(y)=y^{2}
      \;\Longrightarrow\;
      g(y)=\frac{y^{3}}{3}
      $$

      $$
      F=\frac{y^{3}\operatorname{sen}2x}{3}+\frac{y^{3}}{3}=C'
      $$

      $$
      \boxed{\;y^{3}\left(\operatorname{sen}2x+1\right)=C\;}
      $$

      **La comprobación, que cuesta veinte segundos.** Derivando implícitamente
      $y^{3}\left(\operatorname{sen}2x+1\right)=C$:

      $$
      2y^{3}\cos 2x+3y^{2}\left(\operatorname{sen}2x+1\right)y'=0
      $$

      Dividiendo entre $3$ sale exactamente la ecuación del enunciado ✓.

      **Por qué el examen pide clasificar las tres y resolver solo una.** Porque
      lo que se evalúa es el **árbol de decisión**, no la técnica: reconocer que
      la a) es lineal, la b) exacta y la c) homogénea es lo que separa un
      ejercicio de cinco minutos de uno de media hora por el camino equivocado.
      Y «comprobando las tres» significa que hay que escribir las derivadas
      cruzadas, no solo afirmar la etiqueta.

  - id: ex2324-ext-9-un-coseno-que-arranca-en-el-segundo-tres
    titulo: Una fuerza que no existe hasta el segundo tres
    fuente: >-
      Ejercicio 4 del SEGUNDO PARCIAL · Convocatoria extraordinaria, 1 de julio
      de 2024 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Resolver la EDO
      $$
      \left\{
      \begin{aligned}
      y''(t)+2y'(t)&=f(t)\\
      y(0)=y'(0)&=0
      \end{aligned}
      \right.
      \qquad\text{donde}\qquad
      f(t)=
      \begin{cases}
      0 & 0\le t<3\\
      \cos\left(t-3\right) & t\ge3
      \end{cases}
      $$
    pide: La solución.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se escribe $f(t)$ en una sola fórmula?
        opciones:
          - texto: >-
              $f(t)=\cos\left(t-3\right)u\left(t-3\right)$, con $u$ la función
              escalón
            correcta: true
            mensaje: |
              Eso es, y encaja perfecta con la regla del retraso: el argumento
              del coseno lleva **el mismo** $t-3$ que el escalón, así que
              $\mathcal{L}\{f\}=e^{-3s}\frac{s}{s^{2}+1}$ sin más.
          - texto: $f(t)=\cos t\cdot u\left(t-3\right)$
            mensaje: |
              Esa es una función distinta: un coseno de siempre al que se le ha
              borrado el principio. En $t=3$ valdría $\cos 3\approx-0{,}99$, y la
              del enunciado vale $1$. Y además la regla del retraso ya no se
              aplicaría directamente.
          - texto: $f(t)=\cos\left(t-3\right)$ a secas
            mensaje: |
              Sin el escalón, la función existiría también antes del segundo
              tres, y el enunciado dice que ahí vale cero.

      - tipo: calcular
        titulo: El factor del retraso
        pregunta: |
          En $Y(s)=e^{-as}\cdot\dfrac{1}{\left(s+2\right)\left(s^{2}+1\right)}$,
          ¿cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              El $2$ viene del $2y'$ de la ecuación y acaba en el denominador,
              en el factor $s+2$. El retraso es el número de dentro del escalón.
          - valor: '-3'
            mensaje: |
              El signo menos ya está puesto en el exponente. La regla es
              $\mathcal{L}\{g(t-a)u(t-a)\}=e^{-as}G(s)$ con $a=3$.
          - valor: '1'
            mensaje: |
              El $1$ sale del $s^{2}+1$ del coseno. El retraso es otro número.
        pista: |
          Es el instante en el que se enciende la fuerza.
        desarrollo: |
          Transformando $y''+2y'=f$ con $y(0)=y'(0)=0$:

          $$
          \left(s^{2}+2s\right)Y=e^{-3s}\frac{s}{s^{2}+1}
          $$

          $$
          Y=\frac{e^{-3s}\,s}{s\left(s+2\right)\left(s^{2}+1\right)}
          =\frac{e^{-3s}}{\left(s+2\right)\left(s^{2}+1\right)}
          $$

          La $s$ **se cancela**, y eso simplifica mucho las fracciones simples.

      - tipo: calcular
        titulo: El coeficiente de la exponencial
        pregunta: |
          Descomponiendo
          $\dfrac{1}{\left(s+2\right)\left(s^{2}+1\right)}
          =\dfrac{A}{s+2}+\dfrac{Bs+C}{s^{2}+1}$, ¿cuánto vale $A$?
        respuesta:
          tipo: numero
          valor: '0.2'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '5'
            mensaje: |
              $5$ es el denominador que sale al sustituir: $\left(-2\right)^{2}+1
              =5$. $A$ es su **inverso**.
          - valor: '-0.2'
            mensaje: |
              Signo. Cubriendo el factor $s+2$ y sustituyendo $s=-2$ queda
              $\frac{1}{4+1}=+\frac15$.
          - valor: '0.5'
            mensaje: |
              $\frac12$ saldría con un denominador $2$. Aquí el que queda al
              cubrir es $s^{2}+1$ evaluado en $s=-2$, que vale $5$.
        pista: |
          Método de cubrir: tapa el factor $s+2$ y sustituye $s=-2$ en lo que
          queda.
        desarrollo: |
          $$
          A=\left.\frac{1}{s^{2}+1}\right|_{s=-2}=\frac15
          $$

          Y de ahí $B=-\frac15$ y $C=\frac25$, así que la antitransformada del
          cociente sin el retraso es

          $$
          g(t)=\frac15 e^{-2t}-\frac15\cos t+\frac25\operatorname{sen}t
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $y(0)=y'(0)=0$ la transformada de la izquierda es
              $\left(s^{2}+2s\right)Y$, y la de la derecha
              $e^{-3s}\frac{s}{s^{2}+1}$.
          - texto: >-
              Despejando, la $s$ del numerador se cancela con la del
              denominador y queda
              $Y=\frac{e^{-3s}}{\left(s+2\right)\left(s^{2}+1\right)}$.
          - texto: >-
              La antitransformada del cociente es
              $g(t)=\frac15 e^{-2t}-\frac15\cos t+\frac25\operatorname{sen}t$, y
              el $e^{-3s}$ la retrasa:
              $y(t)=g(t-3)\,u(t-3)$.
          - texto: >-
              El factor $e^{-3s}$ hay que meterlo en la descomposición en
              fracciones simples, como un término más.
            trampa: true
            mensaje: |
              El $e^{-3s}$ **no se toca**: no es parte de la fracción racional y
              no entra en la descomposición. Se aparta, se antitransforma el
              cociente como si no estuviera, y al final se sustituye $t$ por
              $t-3$ y se multiplica por el escalón. Meterlo dentro produce un
              sinsentido algebraico sin avisar, y es el error que más descoloca
              del tema.
    resolucion: |
      **Escribir la fuerza en una línea.** El enunciado la da a trozos, y con el
      escalón se convierte en un producto:

      $$
      f(t)=\cos\left(t-3\right)u\left(t-3\right)
      \;\Longrightarrow\;
      \mathcal{L}\{f\}=e^{-3s}\cdot\frac{s}{s^{2}+1}
      $$

      Fíjate en que el argumento del coseno lleva **el mismo** $t-3$ que el
      escalón: por eso la regla del retraso se aplica directamente y no hay que
      reescribir nada.

      **Transformar.** Con las dos condiciones iniciales nulas,
      $\mathcal{L}\{y''\}=s^{2}Y$ y $\mathcal{L}\{y'\}=sY$:

      $$
      \left(s^{2}+2s\right)Y=e^{-3s}\frac{s}{s^{2}+1}
      $$

      $$
      Y=\frac{e^{-3s}\,s}{s\left(s+2\right)\left(s^{2}+1\right)}
      =\frac{e^{-3s}}{\left(s+2\right)\left(s^{2}+1\right)}
      $$

      **La $s$ se cancela**, y con ella desaparece un factor de las fracciones
      simples. Vale la pena mirarlo antes de descomponer: ahorra un término.

      **La vuelta.** Apartando el $e^{-3s}$:

      $$
      \frac{1}{\left(s+2\right)\left(s^{2}+1\right)}
      =\frac{1/5}{s+2}+\frac{-\frac15 s+\frac25}{s^{2}+1}
      $$

      $$
      g(t)=\frac{1}{5}e^{-2t}-\frac{1}{5}\cos t+\frac{2}{5}\operatorname{sen}t
      $$

      **Y el retraso, al final.**

      $$
      \boxed{\;y(t)=u\left(t-3\right)\left[\frac{e^{-2\left(t-3\right)}}{5}
      -\frac{\cos\left(t-3\right)}{5}
      +\frac{2\operatorname{sen}\left(t-3\right)}{5}\right]\;}
      $$

      **Lo que dice la solución, en palabras.** Hasta el segundo tres el sistema
      está en reposo: $y\equiv0$, porque parte del reposo y no hay fuerza. A
      partir de ahí arranca, y la respuesta tiene dos partes: un transitorio
      $\frac15 e^{-2t'}$ que se apaga en un par de segundos, y un régimen
      permanente $-\frac15\cos t'+\frac25\operatorname{sen}t'$ que oscila con la
      misma frecuencia que la fuerza.

      **La comprobación en el arranque.** En $t=3$ la solución vale
      $\frac15-\frac15+0=0$ ✓, y su derivada también: el sistema entra en
      movimiento **suavemente**, sin salto ni esquina. Tenía que ser así, porque
      la fuerza es finita.

  - id: ex2324-ext-10-la-ampliacion-impar-de-una-escalera
    titulo: Una escalera de dos peldaños, ampliada impar, y Leibniz otra vez
    fuente: >-
      Ejercicio 5 del SEGUNDO PARCIAL · Convocatoria extraordinaria, 1 de julio
      de 2024 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea la función
      $$
      f(t)=
      \begin{cases}
      2 & 0<t<1\\
      1 & 1\le t<2
      \end{cases}
      $$

      a) Obtener la ampliación impar y periódica, $F(t)$, de la función $f(t)$.

      b) Dibujar la función $f(t)$ y la función ampliada $F(t)$.

      c) Calcular la serie de Fourier, $S(t)$, de $F(t)$.

      d) Calcular los valores de $S(t)$ y $f(t)$ en los puntos $t=1$, $t=2$,
      $t=100.5$ y $t=18.5$.

      e) Calcular la suma de la serie
      $\displaystyle\sum_{n=0}^{\infty}\frac{\left(-1\right)^{n}}{2n+1}$.
    pide: Los cinco apartados.

    pasos:
      - tipo: reconocer
        pregunta: |
          La función está dada en $\left(0,2\right)$. ¿Cuál es el periodo de la
          ampliación impar?
        opciones:
          - texto: >-
              $4$, porque la ampliación ocupa $\left(-2,2\right)$ y eso es un
              periodo completo
            correcta: true
            mensaje: |
              Eso es. La regla: si el enunciado da la función en $\left(0,L
              \right)$, la ampliación —par o impar— tiene periodo $2L$. Aquí
              $L=2$, así que $T=4$, y el argumento de los senos es
              $\frac{n\pi t}{2}$.
          - texto: $2$, que es donde acaba la función dada
            mensaje: |
              $2$ es la **semiamplitud**. La ampliación necesita también el lado
              negativo, y eso duplica: el periodo es $4$.
          - texto: $2\pi$, como siempre
            mensaje: |
              $2\pi$ es el periodo cuando la función viene dada en
              $\left(-\pi,\pi\right)$, que es el caso de libro. Aquí no hay
              ningún $\pi$ en el enunciado, y suponerlo estropea todos los
              coeficientes.

      - tipo: calcular
        titulo: El primer coeficiente
        pregunta: |
          ¿Cuánto vale $b_{1}$?
        respuesta:
          tipo: numero
          valor: '1.9098593'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.6366198'
            mensaje: |
              $\frac{2}{\pi}$ es $b_{2}$, no $b_{1}$. Para $n$ impar el
              paréntesis vale $2-0+1=3$ y sale $\frac{6}{n\pi}$.
          - valor: '0.9549297'
            mensaje: |
              La mitad del valor bueno. Revisa el factor de delante: con periodo
              $T=4$ es $b_{n}=\frac{2}{L}\int_{0}^{L}$ con $L=2$, o sea un $1$,
              no un $\frac12$.
          - valor: '3.8197186'
            mensaje: |
              El doble. Parece un factor $\frac{4}{L}$ en vez de $\frac{2}{L}$.
        pista: |
          $b_{n}=\frac{2}{n\pi}\left[2-\cos\frac{n\pi}{2}-\left(-1\right)^{n}
          \right]$, y para $n=1$ el coseno se anula.
        desarrollo: |
          $$
          b_{n}=\int_{0}^{2}f(t)\operatorname{sen}\frac{n\pi t}{2}\,dt
          =\frac{2}{n\pi}\left[2-\cos\frac{n\pi}{2}-\left(-1\right)^{n}\right]
          $$

          Con $n=1$: $\cos\frac\pi2=0$ y $\left(-1\right)^{1}=-1$, así que

          $$
          b_{1}=\frac{2}{\pi}\cdot3=\frac{6}{\pi}\approx1{,}910
          $$

      - tipo: calcular
        titulo: El valor en el punto grande
        pregunta: |
          ¿Cuánto vale $S\left(18{,}5\right)$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              $+1$ es el valor de $f$ en $\left(1,2\right)$, y $18{,}5$ reduce a
              $2{,}5$, que está en la mitad **negativa** de la ampliación impar:
              $F\left(2{,}5\right)=F\left(-1{,}5\right)=-f\left(1{,}5\right)$.
          - valor: '2'
            mensaje: |
              $2$ es el valor en $\left(0,1\right)$, que es donde cae el otro
              punto del apartado, $100{,}5$.
          - valor: '0.5'
            mensaje: |
              $0{,}5$ es lo que sobra al reducir, no el valor. $18{,}5-16=2{,}5$.
        pista: |
          El periodo es $4$: resta múltiplos de $4$ hasta caer en
          $\left[-2,2\right)$.
        desarrollo: |
          $$
          18{,}5-4\cdot4=2{,}5
          $$

          Y $2{,}5$ está fuera de $\left[-2,2\right)$: hay que restar otro
          periodo, $2{,}5-4=-1{,}5$. Por ser impar,

          $$
          F\left(-1{,}5\right)=-f\left(1{,}5\right)=-1
          $$

          Y ahí $F$ es continua, así que $S=F=-1$.

      - tipo: justificar
        pregunta: Ordena el apartado e). Una pieza es falsa.
        piezas:
          - texto: >-
              Para $n$ impar, $\cos\frac{n\pi}{2}=0$ y
              $\left(-1\right)^{n}=-1$, así que $b_{n}=\frac{6}{n\pi}$.
          - texto: >-
              Y $\operatorname{sen}\frac{n\pi}{2}$ vale $0$ para $n$ par y
              $\left(-1\right)^{\left(n-1\right)/2}$ para $n$ impar, así que al
              evaluar en $t=1$ solo sobreviven los impares, con signos
              alternados.
          - texto: >-
              En $t=1$ hay un salto de $2$ a $1$, así que $S(1)=\frac32$, y de
              $\frac{6}{\pi}\sum\frac{\left(-1\right)^{k}}{2k+1}=\frac32$ sale
              que la suma vale $\frac\pi4$.
          - texto: >-
              Se elige $t=1$ porque es donde la función vale $2$, que es su valor
              máximo.
            trampa: true
            mensaje: |
              Se elige $t=1$ porque ahí $\operatorname{sen}\frac{n\pi}{2}$ mata
              todos los términos pares y deja los impares con signo alternado,
              que es justo la forma de la serie que se pide. Y porque en $t=1$
              hay un **salto**, lo que obliga a poner $\frac32$ y no $2$ en el
              lado izquierdo — que es la parte que más se falla del apartado.
    resolucion: |
      **a) y b) La ampliación.** La impar cumple $F(-t)=-F(t)$, así que en
      $\left(-2,0\right)$ se copia con el signo cambiado:

      $$
      F(t)=
      \begin{cases}
      -1 & -2<t\le-1\\
      -2 & -1<t<0\\
      2 & 0<t<1\\
      1 & 1\le t<2
      \end{cases}
      \qquad\text{y periódica de periodo }T=4
      $$

      <figure class="figura-examen">
      <svg viewBox="0 0 470 215" role="img" width="470" height="215"
           aria-labelledby="esc24-t esc24-d">
        <title id="esc24-t">La escalera y su ampliacion impar</title>
        <desc id="esc24-d">A la izquierda, dos peldanos: la funcion vale dos entre
        cero y uno, y uno entre uno y dos. A la derecha, la ampliacion impar repetida
        en varios periodos: cuatro peldanos por periodo, dos positivos y dos
        negativos, con saltos en todos los enteros.</desc>
        <style>
          .esc24-f { stroke: var(--live); stroke-width: 3; fill: none; }
          .esc24-F { stroke: var(--alt); stroke-width: 2.6; fill: none; }
          .esc24-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
          .esc24-n { fill: var(--faint); font-size: 10px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
          .esc24-l { font-size: 11px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
        </style>
        <path class="esc24-eje" d="M31.4 130L130 130M45 145L45 52"/>
        <path class="esc24-f" d="M45 70L79 70M79 100L113 100"/>
        <g class="esc24-n">
          <text x="79" y="144" text-anchor="middle">1</text>
          <text x="113" y="144" text-anchor="middle">2</text>
          <text x="38" y="74" text-anchor="end">2</text>
          <text x="38" y="104" text-anchor="end">1</text>
        </g>
        <text class="esc24-l" x="31.4" y="40" fill="var(--live)">f(t)</text>
        <path class="esc24-eje" d="M185 130L419 130M250 208L250 52"/>
        <path class="esc24-F" d="M198 160L224 160M224 190L250 190M250 70L276 70M276 100L302 100M302 160L328 160M328 190L354 190M354 70L380 70M380 100L406 100"/>
        <g class="esc24-n">
          <text x="302" y="144" text-anchor="middle">2</text>
          <text x="198" y="144" text-anchor="middle">−2</text>
          <text x="406" y="144" text-anchor="middle">6</text>
        </g>
        <text class="esc24-l" x="190" y="40" fill="var(--alt)">F(t), periodo 4</text>
      </svg>
      <figcaption>
      A la izquierda la función del enunciado, dos peldaños entre cero y dos. A
      la derecha la ampliación impar repetida: cuatro peldaños por periodo, con
      saltos en todos los enteros y en el origen.
      </figcaption>
      </figure>

      **Los saltos, que hay que localizar antes de seguir**: en $t=0$ salta de
      $-2$ a $2$, en $t=\pm1$ salta entre $2$ y $1$, y en $t=\pm2$ entre $1$ y
      $-1$. Esos son los puntos donde después habrá que aplicar Dirichlet.

      **c) La serie.** Al ser impar, todos los $a_{n}$ se anulan y basta
      integrar en medio periodo:

      $$
      b_{n}=\frac{2}{L}\int_{0}^{L}f(t)\operatorname{sen}\frac{n\pi t}{L}\,dt
      \quad\text{con }L=2
      =\int_{0}^{2}f(t)\operatorname{sen}\frac{n\pi t}{2}\,dt
      $$

      $$
      =\int_{0}^{1}2\operatorname{sen}\frac{n\pi t}{2}dt
      +\int_{1}^{2}\operatorname{sen}\frac{n\pi t}{2}dt
      =\frac{2}{n\pi}\left[2-\cos\frac{n\pi}{2}-\left(-1\right)^{n}\right]
      $$

      $$
      \boxed{\;S(t)=\sum_{n=1}^{\infty}\frac{2}{n\pi}
      \left[2-\cos\frac{n\pi}{2}-\left(-1\right)^{n}\right]
      \operatorname{sen}\frac{n\pi t}{2}\;}
      $$

      Desglosado: $b_{n}=\frac{6}{n\pi}$ si $n$ es impar, $\frac{2}{n\pi}$ si
      $n\equiv2\pmod 4$, y $0$ si $n$ es múltiplo de $4$.

      **d) Los cuatro puntos.**

      | punto | reduce a | qué hay ahí | $S$ | $f$ |
      |---|---|---|---|---|
      | $1$ | $1$ | salto de $2$ a $1$ | $\frac32$ | $1$ |
      | $2$ | $2$ | salto de $1$ a $-1$ | $0$ | no definido |
      | $100{,}5$ | $0{,}5$ | continuo | $2$ | $2$ |
      | $18{,}5$ | $-1{,}5$ | continuo | $-1$ | — |

      En $t=100{,}5$: $100{,}5-25\cdot4=0{,}5$. En $t=18{,}5$:
      $18{,}5-4\cdot4=2{,}5$, que todavía se sale del periodo básico, así que
      $2{,}5-4=-1{,}5$, y por ser impar $F=-f\left(1{,}5\right)=-1$.

      **La respuesta al «justificando»**, que es lo que puntúa: en los dos
      primeros puntos $S$ y $f$ **no coinciden**, porque son saltos y la serie se
      va a la media; en los dos últimos sí, porque son puntos de continuidad. Y
      $f(2)$ ni siquiera está definida — la función del enunciado vive en
      $\left(0,2\right)$—, mientras que $S(2)=0$ sí existe.

      **e) La suma.** Evaluando en $t=1$: $\operatorname{sen}\frac{n\pi}{2}$
      mata todos los pares y deja $\left(-1\right)^{k}$ en los impares
      $n=2k+1$, donde $b_{n}=\frac{6}{n\pi}$:

      $$
      S(1)=\frac{6}{\pi}\sum_{k=0}^{\infty}
      \frac{\left(-1\right)^{k}}{2k+1}
      $$

      Y $S(1)=\frac{2+1}{2}=\frac32$ por Dirichlet. Entonces

      $$
      \boxed{\;\sum_{n=0}^{\infty}\frac{\left(-1\right)^{n}}{2n+1}
      =\frac{\pi}{4}\;}
      $$

      **El detalle que decide este apartado.** Si en el lado izquierdo se pone
      $f(1)=1$ en vez de $\frac32$, la suma sale $\frac{\pi}{6}$ — un número
      perfectamente plausible y equivocado. **Hay que mirar si el punto elegido
      es un salto antes de igualar**, y aquí lo es.
