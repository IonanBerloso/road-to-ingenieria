        <text class="rec24-l" x="196.8" y="73.2" text-anchor="end" fill="var(--live)">y = 4x²</text>
        <text class="rec24-l" x="259.5" y="88.4" fill="var(--alt)">y = 8x − 4</text>
        <text class="rec24-l" x="164.5" y="189.1" fill="var(--live)">D</text>
