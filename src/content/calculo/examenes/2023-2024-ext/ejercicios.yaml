      La sección que contiene el eje. El cuenco parabólico sube desde el origen
      hasta la altura uno, donde el radio vale uno, y desde ahí el cono se
      cierra en punta en la altura dos.
      </figcaption>
      </figure>

      **b) El área.** Dos superficies curvas y ninguna cara plana.

      $$
      A_{\text{parab}}=2\pi\int_{0}^{1}\rho\sqrt{1+4\rho^{2}}\,d\rho
      =\frac{\pi}{6}\left(5\sqrt5-1\right)\approx5{,}33
      $$

      $$
      A_{\text{cono}}=\pi R g=\pi\cdot1\cdot\sqrt2=\sqrt2\,\pi\approx4{,}44
      $$

      $$
      \boxed{\;A=\frac{\pi\left(5\sqrt5-1\right)}{6}+\sqrt2\,\pi\approx9{,}77\;}
      $$

      **c) El centro de gravedad.** Dos coordenadas salen sin integrar:

      $$
      \overline x=\overline y=0
      \qquad\text{por simetría de revolución}
      $$

      Y la tercera, con discos horizontales:

      $$
      V=\pi\int_{0}^{1}z\,dz+\pi\int_{1}^{2}\left(2-z\right)^{2}dz
      =\frac{\pi}{2}+\frac{\pi}{3}=\frac{5\pi}{6}
      $$

      $$
      \int z\,dV=\pi\int_{0}^{1}z^{2}dz+\pi\int_{1}^{2}z\left(2-z\right)^{2}dz
      =\frac{\pi}{3}+\frac{5\pi}{12}=\frac{3\pi}{4}
      $$

      $$
      \boxed{\;\overline z=\frac{3\pi/4}{5\pi/6}=\frac{9}{10}=0{,}9\;}
      $$

      **La segunda integral, con el cambio que la deja en nada.** Con $u=2-z$ se
      convierte en $\int_{0}^{1}\left(2-u\right)u^{2}du=\frac23-\frac14
      =\frac{5}{12}$. Sin el cambio hay que desarrollar el cuadrado y multiplicar
      por $z$.

      **La comprobación de sentido.** El centroide sale en $0{,}9$, o sea **por
      debajo** de la altura del corte, que es $1$. Tiene que ser así: tres
      cuartas partes del volumen están en el cuenco, que va de $0$ a $1$. Y
      compara con el mismo sólido a escala seis, el de 2013-2014, donde salía
      $\frac{25}{8}=3{,}125$ sobre una altura total de $6$: la proporción es
      $0{,}52$ allí y $0{,}45$ aquí. **No es la misma**, y no tiene por qué
      serlo — el paraboloide $z=\rho^{2}$ no escala igual que el cono.

  - id: ex2324-ext-7-la-curva-que-no-conoces-y-el-area-que-si
    titulo: Una curva que no te dan, y un área que sí
    fuente: >-
      Ejercicio 2 del SEGUNDO PARCIAL · Convocatoria extraordinaria, 1 de julio
      de 2024 · Cálculo, UPV/EHU · La figura está redibujada del original · El
      examen no publica solución: la resolución es propuesta nuestra, pendiente
      de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Calcular el valor de la integral curvilínea
      $I=\displaystyle\int_{L_{1}}-y\,dx+x\,dy$ desde el punto
      $\left(-2,0\right)$ hasta el punto $\left(2,0\right)$ sabiendo que el área
      sombreada de la figura vale $A=10$.

