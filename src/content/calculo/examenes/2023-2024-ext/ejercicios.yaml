ejercicios:
  - id: ex2324-ext-1-cinco-soluciones-y-una-en-el-origen
    titulo: Una ecuación con cinco soluciones, y la que casi todo el mundo pierde
    fuente: >-
      Ejercicio 1 del PRIMER PARCIAL · Convocatoria extraordinaria, 1 de julio de
      2024 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Sea $z\in\mathbb{C}$. Resolver la ecuación
      $$
      i\,z^{5}\,\overline{z}=-\left|z\right|
      $$
    pide: Todas las soluciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué forma conviene escribir $z$ para atacar esto?
        opciones:
          - texto: >-
              En polar, $z=\rho_{\theta}$, porque hay potencias, un conjugado y
              un módulo, y en polar los tres son inmediatos
            correcta: true
            mensaje: |
              Eso es. En polar, $z^{5}=\rho^{5}_{5\theta}$, el conjugado cambia
              el signo del argumento y el módulo es $\rho$ pelado. En binómica
              habría que desarrollar una potencia quinta de un binomio.
          - texto: >-
              En binómica, $z=x+iy$, e igualar partes reales e imaginarias
            mensaje: |
              Se puede, pero $\left(x+iy\right)^{5}$ tiene seis términos y luego
              hay que multiplicar por el conjugado. Cuando en una ecuación
              aparecen potencias altas y módulos, la polar ahorra media hoja.
          - texto: >-
              En forma exponencial, pero solo si el módulo vale $1$
            mensaje: |
              El módulo es una de las incógnitas: no se puede suponer. Lo que
              hace la forma polar es precisamente **separar** la ecuación en una
              de módulos y otra de argumentos.

      - tipo: calcular
        titulo: El módulo
        pregunta: |
          De la ecuación de módulos, $\rho^{6}=\rho$. ¿Cuál es el valor no nulo
          de $\rho$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '6'
            mensaje: |
              El $6$ es el exponente, no la solución. $\rho^{6}=\rho$ se factoriza
              como $\rho\left(\rho^{5}-1\right)=0$.
          - valor: '5'
            mensaje: |
              El $5$ viene de $z^{5}$, y el exponente total es $6$ porque el
              conjugado aporta uno más. En cualquier caso la solución de
              $\rho^{5}=1$ con $\rho$ real positivo es $1$.
          - valor: '0.5'
            mensaje: |
              Con $\rho=\frac12$ el lado izquierdo valdría
              $\left(\frac12\right)^{6}=\frac1{64}$ y el derecho $\frac12$: no
              coinciden.
        pista: |
          $\left|i\,z^{5}\overline z\right|=1\cdot\rho^{5}\cdot\rho=\rho^{6}$, y
          el módulo del lado derecho es $\rho$.
        desarrollo: |
          $$
          \rho^{6}=\rho
          \;\Longrightarrow\;
          \rho\left(\rho^{5}-1\right)=0
          \;\Longrightarrow\;
          \rho=0\ \text{ o }\ \rho=1
          $$

          Las dos valen, y **la de $\rho=0$ es la que se pierde**: $z=0$ cumple
          la ecuación, porque los dos lados se anulan.

      - tipo: calcular
        titulo: El primer argumento
        pregunta: |
          Con $\rho=1$, ¿cuál es la solución de la ecuación de argumentos con
          $k=0$? Da el resultado como múltiplo de $\pi$, es decir, contesta
          $\theta/\pi$.
        respuesta:
          tipo: numero
          valor: '0.125'
          tolerancia: 0.0005
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.25'
            mensaje: |
              $\frac\pi4$ saldría de $4\theta=\pi$ sin el $\frac\pi2$ que aporta
              la $i$. La $i$ suma $\frac\pi2$ al argumento del lado izquierdo.
          - valor: '0.5'
            mensaje: |
              $\frac\pi2$ es lo que aporta la $i$, no el argumento de $z$. Hay
              que despejar $\theta$ de $4\theta+\frac\pi2=\pi$.
          - valor: '0.0625'
            mensaje: |
              $\frac\pi{16}$ saldría de dividir entre $8$. El argumento del lado
              izquierdo es $5\theta-\theta+\frac\pi2=4\theta+\frac\pi2$: se
              divide entre **cuatro**.
        pista: |
          El argumento de $-\left|z\right|$ es $\pi$, porque es un real
          negativo. E $i$ aporta $\frac\pi2$.
        desarrollo: |
          $$
          \arg\left(i\,z^{5}\overline z\right)=\frac\pi2+5\theta-\theta
          =4\theta+\frac\pi2
          $$

          $$
          4\theta+\frac\pi2=\pi+2k\pi
          \;\Longrightarrow\;
          \theta=\frac\pi8+\frac{k\pi}{2}
          $$

          Con $k=0,1,2,3$ salen $\frac\pi8$, $\frac{5\pi}8$, $\frac{9\pi}8$ y
          $\frac{13\pi}8$: cuatro puntos repartidos por igual en la
          circunferencia unidad.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En polar, $i\,z^{5}\overline z$ tiene módulo $\rho^{6}$ y argumento
              $4\theta+\frac\pi2$; y $-\left|z\right|$ tiene módulo $\rho$ y
              argumento $\pi$.
          - texto: >-
              De los módulos, $\rho^{6}=\rho$, o sea $\rho=0$ o $\rho=1$. La
              solución $\rho=0$ hay que tratarla aparte, porque un complejo de
              módulo cero no tiene argumento.
          - texto: >-
              Con $\rho=1$, $4\theta+\frac\pi2=\pi+2k\pi$ da
              $\theta=\frac\pi8+\frac{k\pi}2$, y $k=0,1,2,3$ agota los valores
              distintos: cuatro soluciones en la circunferencia unidad.
          - texto: >-
              Como la ecuación de argumentos tiene infinitos valores de $k$, la
              ecuación tiene infinitas soluciones.
            trampa: true
            mensaje: |
              Infinitos valores de $k$, sí, pero solo cuatro **complejos**
              distintos: a partir de $k=4$ los argumentos se repiten módulo
              $2\pi$ y devuelven los mismos puntos. Es lo mismo que pasa con las
              raíces $n$-ésimas, y decirlo —«los demás $k$ repiten»— es lo que
              cierra el ejercicio.
    resolucion: |
      **En polar, que es donde esto se ve.** Con $z=\rho_{\theta}$:

      $$
      z^{5}=\rho^{5}_{5\theta},
      \qquad
      \overline z=\rho_{-\theta},
      \qquad
      i=1_{\pi/2}
      $$

      $$
      i\,z^{5}\overline z=\rho^{6}_{\,4\theta+\pi/2}
      $$

      Y el lado derecho, $-\left|z\right|=-\rho$, es un **real negativo**: módulo
      $\rho$ y argumento $\pi$.

      **La ecuación se parte en dos.**

      $$
      \rho^{6}=\rho
      \qquad\text{y}\qquad
      4\theta+\frac\pi2=\pi+2k\pi
      $$

      **La de los módulos.** $\rho\left(\rho^{5}-1\right)=0$, y como $\rho\ge0$
      es real, $\rho=0$ o $\rho=1$.

      El caso $\rho=0$ se comprueba directamente en la ecuación original:
      $i\cdot0\cdot0=0=-0$ ✓. **$z=0$ es solución**, y es la que más se pierde,
      porque al pasar a polar el argumento deja de estar definido y uno se
      olvida de volver a mirarla.

      **La de los argumentos**, con $\rho=1$:

      $$
      \theta=\frac{\pi}{8}+\frac{k\pi}{2}
      $$

      $$
      \boxed{\;z=0,\quad
      1_{\pi/8},\quad 1_{5\pi/8},\quad 1_{9\pi/8},\quad 1_{13\pi/8}\;}
      $$

      **Cinco soluciones**: cuatro vértices de un cuadrado inscrito en la
      circunferencia unidad, girado $22{,}5^{\circ}$, y el origen.

      **La comprobación de un caso.** Con $\theta=\frac\pi8$:
      $4\theta+\frac\pi2=\frac\pi2+\frac\pi2=\pi$ ✓, y el módulo es $1^{6}=1$,
      que es el módulo de $-1$ ✓.

  - id: ex2324-ext-2-el-cuadrado-de-la-derivada
    titulo: El cuadrado de la derivada, leído solo en el dibujo
    fuente: >-
      Ejercicio 2 del PRIMER PARCIAL · Convocatoria extraordinaria, 1 de julio de
      2024 · Cálculo, UPV/EHU · La figura está redibujada del original · El
      examen no publica solución: la resolución es propuesta nuestra, pendiente
      de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 2
      comp4: 7
    enunciado: |
      Sea $f(x)$ la función dos veces derivable en $\left(a,b\right)$ cuya
      gráfica se muestra en la figura. Consideremos la función
      $h(x)=\left(f'(x)\right)^{2}$.

      a) Estudiar el crecimiento de $h(x)$.

      b) Estudiar la existencia de extremos locales de $h(x)$.

      <figure class="figura-examen">
      <svg viewBox="0 0 400 250" role="img" width="400" height="250"
           aria-labelledby="gra24-t gra24-d">
