      <figcaption>
      Tres lados: la parábola por arriba desde el origen hasta el punto de
      tangencia, la tangente por abajo desde ese punto hasta el corte con el eje
      en un medio, y el trozo de eje que cierra hasta el origen.
      </figcaption>
      </figure>

      **b) El área.** Área bajo la parábola menos el triángulo bajo la tangente:

      $$
      A=\int_{0}^{1}4x^{2}\,dx-\underbrace{\frac{1}{2}\cdot\frac{1}{2}\cdot4}
      _{\text{triángulo}}=\frac{4}{3}-1=\boxed{\;\frac13\;}
      $$

      **c) El volumen.** Al girar alrededor de OX el sólido se parte en dos
      tramos:

      $$
      V=\underbrace{\pi\int_{0}^{1/2}\left(4x^{2}\right)^{2}dx}_{\text{discos}}
      +\underbrace{\pi\int_{1/2}^{1}\left[\left(4x^{2}\right)^{2}
      -\left(8x-4\right)^{2}\right]dx}_{\text{coronas}}
      $$

      La primera:

      $$
      \pi\int_{0}^{1/2}16x^{4}dx=\pi\cdot\frac{16}{5}\cdot\frac{1}{32}
      =\frac{\pi}{10}
      $$

      La segunda, con $\int_{1/2}^{1}16x^{4}=\frac{31}{10}$ y
      $\int_{1/2}^{1}\left(64x^{2}-64x+16\right)=\frac83$:

      $$
      \pi\left(\frac{31}{10}-\frac{8}{3}\right)=\frac{13\pi}{30}
      $$

      $$
      \boxed{\;V=\frac{\pi}{10}+\frac{13\pi}{30}=\frac{8\pi}{15}\approx1{,}676\;}
      $$

      **El error que este apartado tiende.** Restar las funciones antes de
      elevarlas al cuadrado. La corona tiene área $\pi R^{2}-\pi r^{2}$, y eso
      **no** es $\pi\left(R-r\right)^{2}$. La diferencia entre las dos cuentas
      aquí es de casi el treinta por ciento.
  - id: ex2324-ext-6-el-cuenco-rematado-en-punta-a-la-altura-dos
    titulo: El cuenco rematado en punta, y su centro de gravedad
    fuente: >-
      Ejercicio 1 del SEGUNDO PARCIAL · Convocatoria extraordinaria, 1 de julio
      de 2024 · Cálculo, UPV/EHU · Es el mismo sólido que el del ejercicio 3 de
      la ordinaria de 2013-2014 y el 1 del segundo parcial de la de 2021-2022,
      con el vértice en 2 en vez de en 6 · El examen no publica solución: la
      resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea $S$ el sólido definido por las condiciones $x^{2}+y^{2}\le z$,
      $x^{2}+y^{2}\le\left(z-2\right)^{2}$, $z\le2$.

      a) Dibujar el sólido $S$.

      b) Calcular el área de la superficie de $S$.

      c) Sabiendo que la densidad en cada punto es constante calcular las
      coordenadas del centro de gravedad de $S$.
    pide: El dibujo, el área y el centro de gravedad.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuáles son las dos coordenadas del centro de gravedad que se pueden
          contestar sin integrar?
        opciones:
          - texto: >-
              $\overline{x}$ e $\overline{y}$, que valen cero por ser un sólido
              de revolución alrededor del eje $Z$
            correcta: true
            mensaje: |
              Eso es, y escribirlo con esa frase —«por simetría de revolución
              respecto del eje $Z$»— vale los mismos puntos que calcular las dos
              integrales. Son dos de las cuatro que pide el centro de gravedad.
          - texto: >-
              $\overline{z}$, porque el sólido está entre $0$ y $2$ y el
              centroide es el punto medio
            mensaje: |
              El punto medio de la altura solo es el centroide si el sólido es
              simétrico arriba y abajo, y este no lo es: el cuenco de abajo es
              mucho más voluminoso que la punta. $\overline{z}$ es la única que
              hay que calcular.
          - texto: >-
              Ninguna: el centro de gravedad son siempre cuatro integrales
            mensaje: |
              Son cuatro **como mucho**. La simetría se aprovecha antes de
              integrar, y en un sólido de revolución se lleva dos de golpe.

      - tipo: calcular
        titulo: Dónde se cortan
        pregunta: |
          ¿A qué altura se cortan el paraboloide y el cono?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              $4$ es la otra raíz de $z^{2}-5z+4=0$, y hay que descartarla en voz
              alta: el enunciado impone $z\le2$.
          - valor: '2'
            mensaje: |
              En $z=2$ está el **vértice** del cono, donde su radio vale cero
              mientras el paraboloide tiene radio $\sqrt2$. No se tocan allí.
          - valor: '0.5'
            mensaje: |
              Con $z=\frac12$ el paraboloide tiene radio $\sqrt{0{,}5}=0{,}71$ y
              el cono $1{,}5$: todavía no se han encontrado.
        pista: |
          El radio del paraboloide es $\sqrt z$ y el del cono $2-z$. Iguálalos.
        desarrollo: |
          $$
          \sqrt z=2-z
          \;\Longrightarrow\;
          z^{2}-5z+4=0
          \;\Longrightarrow\;
          z=1\ \text{ o }\ z=4
          $$

          Solo $z=1$ cumple $z\le2$, y allí el radio vale $1$.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen de $S$?
        respuesta:
          tipo: numero
          valor: '2.6179939'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.5707963'
            mensaje: |
              $\frac{\pi}{2}$ es solo el cuenco parabólico, de $z=0$ a $z=1$.
              Falta el cono de arriba, que aporta $\frac{\pi}{3}$.
          - valor: '1.0471976'
            mensaje: |
              $\frac{\pi}{3}$ es solo el cono. La parte de abajo es mayor.
          - valor: '6.2831853'
            mensaje: |
              $2\pi$ saldría de integrar el paraboloide hasta $z=2$ ignorando
              que a partir de $z=1$ es el cono el que estrecha el sólido.
        pista: |
          $V=\pi\int_{0}^{1}z\,dz+\pi\int_{1}^{2}\left(2-z\right)^{2}dz$.
        desarrollo: |
          $$
          V=\pi\int_{0}^{1}z\,dz+\pi\int_{1}^{2}\left(2-z\right)^{2}dz
          =\frac{\pi}{2}+\frac{\pi}{3}=\frac{5\pi}{6}\approx2{,}618
          $$

      - tipo: calcular
        titulo: La altura del centro de gravedad
        pregunta: |
          ¿A qué altura está el centro de gravedad?
        respuesta:
          tipo: numero
          valor: '0.9'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es la altura donde se encuentran las dos superficies, no el
              centroide. Que haya masa por encima y por debajo de esa cota no la
              convierte en el centro de gravedad.
          - valor: '0.6666667'
            mensaje: |
              $\frac23$ es la altura del centroide de un cuenco parabólico
              **solo**. La punta de arriba tira del conjunto hacia arriba.
          - valor: '1.25'
            mensaje: |
              Está por encima del corte, y eso no puede ser: tres cuartas partes
              del volumen están por debajo de $z=1$.
        pista: |
          $\overline z=\frac{\int z\,dV}{V}$, con
          $\int z\,dV=\pi\int_{0}^{1}z^{2}dz+\pi\int_{1}^{2}z\left(2-z\right)^{2}
          dz$.
        desarrollo: |
          $$
          \int z\,dV=\frac{\pi}{3}+\frac{5\pi}{12}=\frac{3\pi}{4}
          $$

          $$
          \overline z=\frac{3\pi/4}{5\pi/6}=\frac{9}{10}=0{,}9
          $$

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              La superficie tiene dos trozos: el casquete de paraboloide desde el
              vértice hasta el corte, y la superficie lateral del cono desde el
              corte hasta la punta.
          - texto: >-
              El del paraboloide es
              $2\pi\int_{0}^{1}\rho\sqrt{1+4\rho^{2}}\,d\rho
              =\frac{\pi\left(5\sqrt5-1\right)}{6}\approx5{,}33$.
          - texto: >-
              El del cono es $\pi R g$ con $R=1$ y generatriz $g=\sqrt2$, o sea
              $\sqrt2\,\pi\approx4{,}44$. En total, unas $9{,}77$ unidades.
          - texto: >-
              Hay que añadir el disco de radio $1$ del corte, porque cierra el
              sólido por dentro.
            trampa: true
            mensaje: |
              Ese disco no cierra nada: es la costura entre las dos superficies,
              con sólido a los dos lados. Solo cuenta lo que separa el cuerpo
              del aire. La regla vale también al revés: si el enunciado hubiera
              cortado el sólido por $z=1$, entonces sí habría que contar la tapa.
    resolucion: |
      **a) Qué sólido es.** El mismo cuerpo que ya ha caído dos veces —el
      ejercicio 3 de la ordinaria de 2013-2014 y el 1 del segundo parcial de la
      de 2021-2022— pero con el vértice del cono en $z=2$ en vez de en $z=6$.
      Dentro del paraboloide y dentro del cono, con la punta hacia arriba.

      $$
      \sqrt z=2-z
      \;\Longrightarrow\;
      z^{2}-5z+4=0
      \;\Longrightarrow\;
      z=1\ \text{(y }4\text{, fuera)},\qquad \rho=1
      $$

