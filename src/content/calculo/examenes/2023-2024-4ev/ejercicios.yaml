ejercicios:
  - id: ex2324-4ev-1-temperatura-de-la-habitacion
    titulo: La temperatura de una habitación, y la mosca
    fuente: >-
      Ejercicio 1 · Cuarta evaluación, 25 de marzo de 2024 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3
    enunciado: |
      La temperatura de una habitación viene determinada por la función
      $T(x,y) = \dfrac{2}{\sqrt{x^{2}+y^{2}+1}}$ donde $T$ se mide en °C y $x$
      e $y$ en m. Sea el punto $P(1,2)$.

      a) Partiendo del punto $P$, ¿qué curva habrá que seguir para que el valor
      de la temperatura no cambie?

      b) ¿En qué dirección debe moverse una mosca que está en el punto $P$ para
      enfriarse lo antes posible?

      c) ¿En qué punto se obtiene la temperatura máxima? Calcular dicho valor.

      d) ¿Cuál es el valor máximo de cambio de temperatura en el punto $P$?

      e) Si una mosca que se encuentra en el punto $P$ sigue la dirección de la
      recta $y = x-3$, ¿se calentaría o se enfriaría?, ¿a qué velocidad?
    pide: La curva isoterma, la dirección de enfriamiento, el máximo y las dos velocidades.
    pasos:
      - tipo: reconocer
        pregunta: |
          La temperatura solo depende de $x^{2}+y^{2}$. ¿Qué forma tienen sus
          curvas de nivel?
        opciones:
          - texto: Circunferencias centradas en el origen
            correcta: true
            mensaje: |
              Sí, y eso contesta el apartado a) casi sin cuentas: si $T$ solo
              depende de la distancia al origen, es constante sobre cada
              circunferencia centrada ahí.
          - texto: Rectas que pasan por el origen
            mensaje: |
              Sobre una recta por el origen la distancia **cambia**, así que la
              temperatura también. Las rectas radiales son justo la dirección de
              máximo cambio, no la de cambio nulo.
          - texto: Parábolas
            mensaje: |
              Saldrían parábolas si la función dependiera de $y-x^{2}$ o algo
              parecido. Aquí $x$ e $y$ entran igual y al cuadrado, lo que da
              simetría circular.
      - tipo: calcular
        titulo: La temperatura máxima
        pregunta: |
          $T$ es mayor cuanto menor sea el denominador. ¿Cuál es el valor máximo
          de la temperatura?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número, en grados
        distractores:
          - valor: '0.8165'
            mensaje: |
              Ese es $T(1,2)$, la temperatura donde está la mosca. El máximo se
              alcanza en el origen, no en $P$.
          - valor: '1'
            mensaje: |
              1 es el término independiente del radicando. Con $x=y=0$ el
              denominador vale $\sqrt1 = 1$, así que $T = 2/1 = 2$.
        pista: |
          El denominador es mínimo cuando $x=y=0$, y entonces vale 1.
        desarrollo: |
          El denominador $\sqrt{x^{2}+y^{2}+1}$ es mínimo en el origen, donde
          vale 1:

          $$
          T_{\max} = T(0,0) = \frac{2}{1} = 2\ \text{°C}
          $$

          **En el origen**, que es el punto más caliente de la habitación.
      - tipo: calcular
        titulo: El valor máximo de cambio en P
        pregunta: |
          Con $\nabla T(1,2) = -\dfrac{2}{6^{3/2}}(1,2)$, ¿cuánto vale su módulo?
        respuesta:
          tipo: numero
          valor: '0.3043'
          tolerancia: 0.005
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.8165'
            mensaje: |
              $2/\sqrt6$ es el **valor** de la temperatura en $P$, no la
              velocidad de cambio. Son dos cosas distintas con el mismo 6
              dentro.
          - valor: '0.1361'
            mensaje: |
              Esa es solo la primera componente del gradiente. El módulo junta
              las dos: $\sqrt{0{,}136^{2}+0{,}272^{2}}$.
        pista: |
          $|\nabla T| = \frac{2\sqrt5}{6^{3/2}}$, y $6^{3/2}\approx 14{,}70$.
        desarrollo: |
          $$
          \lVert\nabla T(1,2)\rVert = \frac{2\sqrt5}{6^{3/2}}
          = \frac{\sqrt5}{3\sqrt6} \approx 0{,}304\ \text{°C/m}
          $$

          Es pequeño, y tiene sentido: a dos metros del foco la temperatura ya
          cambia despacio.
      - tipo: calcular
        titulo: La velocidad siguiendo la recta
        pregunta: |
          La recta $y=x-3$ tiene dirección $(1,1)$. ¿Cuánto vale la derivada
          direccional de $T$ en $P$ en esa dirección?
        respuesta:
          tipo: numero
          valor: '-0.2887'
          tolerancia: 0.005
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.2887'
            mensaje: |
              El valor absoluto está bien, pero **el signo es la respuesta** a
              «¿se calentaría o se enfriaría?». El gradiente apunta hacia el
              origen y $(1,1)$ se aleja, así que sale negativo.
          - valor: '-0.4082'
            mensaje: |
              Parece que no has normalizado $(1,1)$, que mide $\sqrt2$. Sin
              dividir, el resultado sale multiplicado por $\sqrt2$.
        pista: |
          $\nabla T \cdot (1,1)/\sqrt2$. Sale exactamente $-1/(2\sqrt3)$.
        desarrollo: |
          $$
          D_{\vec u}T = \frac{\nabla T\cdot(1,1)}{\sqrt2}
          = \frac{-\frac{2}{6^{3/2}}(1+2)}{\sqrt2}
          = \frac{-6}{6\sqrt6\,\sqrt2} = -\frac{1}{2\sqrt3} \approx -0{,}289
          $$

          **Negativo, así que se enfriaría**, a razón de unos $0{,}29$ °C por
          metro.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta completa. Una pieza es falsa.
        piezas:
          - texto: 'a) $T$ solo depende de $x^{2}+y^{2}$, así que la isoterma por $P$ es la circunferencia $x^{2}+y^{2}=5$.'
          - texto: 'b) Para enfriarse hay que seguir $-\nabla T$, que apunta **alejándose** del origen: dirección $(1,2)$.'
          - texto: 'c) El máximo está en el origen y vale 2 °C.'
          - texto: 'd) La velocidad máxima de cambio en $P$ es $\lVert\nabla T\rVert \approx 0{,}304$ °C/m.'
          - texto: 'b) Para enfriarse hay que ir hacia el origen, porque es donde la temperatura es extrema.'
            trampa: true
            mensaje: |
              El origen es donde la temperatura es **máxima**: yendo hacia allí
              la mosca se calentaría. Para enfriarse hay que alejarse, que es
              justo la dirección de $-\nabla T$.
    resolucion: |
      **La función tiene simetría radial**, y verlo antes de derivar contesta
      medio ejercicio.

      $$
      T(x,y) = \frac{2}{\sqrt{x^{2}+y^{2}+1}}
      $$

      solo depende de la distancia al origen. Así que **es máxima en el origen y
      decrece hacia afuera**, con curvas de nivel circulares.

      **a) La isoterma por $P$.** Como $T$ es constante sobre circunferencias
      centradas en el origen, y $P(1,2)$ está a distancia $\sqrt5$:

      $$
      x^{2}+y^{2} = 5
      $$

      **b) Enfriarse cuanto antes.** El gradiente es

      $$
      \nabla T = \frac{-2\,(x,y)}{\bigl(x^{2}+y^{2}+1\bigr)^{3/2}}
      \qquad\Longrightarrow\qquad
      \nabla T(1,2) = \frac{-2}{6^{3/2}}\,(1,2)
      $$

      que apunta **hacia** el origen. Para enfriarse hay que ir en sentido
      contrario: dirección $(1,2)$, alejándose.

      **c) El máximo:** en el origen, $T(0,0) = 2$ °C.

      **d) El valor máximo de cambio en $P$** es el módulo del gradiente:

      $$
      \lVert\nabla T(1,2)\rVert = \frac{2\sqrt5}{6^{3/2}} = \frac{\sqrt5}{3\sqrt6} \approx 0{,}304\ \text{°C/m}
      $$

      **e) Siguiendo la recta $y=x-3$**, cuya dirección es $(1,1)$:

      $$
      D_{\vec u}T(1,2) = \frac{\nabla T\cdot(1,1)}{\sqrt2} = -\frac{1}{2\sqrt3} \approx -0{,}289
      $$

      $$
      \boxed{\;\text{Se enfriaría, a unos } 0{,}29\ \text{°C/m}\;}
      $$

      > **El apartado e) tiene dos respuestas y las dos puntúan.** «Se
      > enfriaría» es el signo, y «$0{,}29$ °C/m» es el número. Dar solo el
      > número deja la pregunta a medias, y esa mitad es COMP4.
      >
      > Y un detalle que conviene notar: la recta $y=x-3$ **no pasa por $P$**
      > —en $x=1$ vale $y=-2$, no 2—. No es un error del enunciado: lo que da
      > es solo **la dirección** en la que la mosca se mueve, y de una recta lo
      > único que se usa aquí es su vector director, $(1,1)$.

  - id: ex2324-4ev-2-cambiar-el-orden-y-calcular
    titulo: Cambiar el orden en una integral partida en dos
    fuente: >-
      Ejercicio 2 · Cuarta evaluación, 25 de marzo de 2024 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp2: 7
      comp4: 3
    enunciado: |
      Sea la integral

      $$
      \int_{0}^{2}\left(\int_{-\sqrt{y}}^{\sqrt{y}} 2x^{2}y\;dx\right)dy
      \;+\;
      \int_{2}^{4}\left(\int_{-\sqrt{4-y}}^{\sqrt{4-y}} 2x^{2}y\;dx\right)dy
      $$

      a) Dibujar el dominio de integración.
      b) Cambiar el orden de integración y calcular la integral resultante.
    pide: El dibujo del dominio y la integral en el otro orden.
    pasos:
      - tipo: reconocer
        pregunta: |
          La integral viene **partida en dos**. ¿Qué suele significar eso?
        opciones:
          - texto: Que en el orden dado la tapa cambia a media altura, y en el otro orden puede unirse
            correcta: true
            mensaje: |
              Exacto, y es la pista del ejercicio: si al invertir el orden la
              región se describe de una sola vez, las dos integrales se funden
              en una.
          - texto: Que son dos regiones separadas
            mensaje: |
              No están separadas: encajan en $y=2$, donde las dos descripciones
              coinciden en $x\in[-\sqrt2,\sqrt2]$. Es una sola región partida
              por comodidad.
          - texto: Que el integrando cambia
            mensaje: |
              El integrando es el mismo, $2x^{2}y$, en las dos. Lo que cambia
              son los límites, o sea la forma del recinto.
      - tipo: calcular
        titulo: Dónde se juntan los dos trozos
        pregunta: |
          En $y=2$, las dos descripciones tienen que coincidir. ¿Cuánto vale
          $\sqrt{y}$ ahí?
        respuesta:
          tipo: numero
          valor: '1.4142'
          tolerancia: 0.01
          formato: en forma exacta (√2) o con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              2 es el valor de $y$, no su raíz. El límite de $x$ en el primer
              trozo es $\sqrt{y}$, que en $y=2$ vale $\sqrt2$.
          - valor: '1'
            mensaje: |
              1 sería $\sqrt{y}$ con $y=1$. Aquí el corte está en $y=2$.
        pista: |
          $\sqrt{2}\approx 1{,}414$. Y comprueba que $\sqrt{4-2}$ da lo mismo.
        desarrollo: |
          $$
          \sqrt{y}\Big|_{y=2} = \sqrt2,
          \qquad
          \sqrt{4-y}\Big|_{y=2} = \sqrt2
          $$

          **Coinciden**, y eso confirma que los dos trozos encajan sin hueco ni
          solape. Los bordes son las parábolas $y=x^{2}$ y $y=4-x^{2}$, que se
          cortan en $x=\pm\sqrt2$.
      - tipo: calcular
        titulo: La integral en el nuevo orden
        pregunta: |
          Invertida, la integral es
          $\int_{-\sqrt2}^{\sqrt2}\int_{x^{2}}^{4-x^{2}} 2x^{2}y\;dy\,dx$, y
          vale $\frac{128\sqrt2}{15}$. ¿Cuánto es con cuatro decimales?
        respuesta:
          tipo: numero
          valor: '12.068'
          tolerancia: 0.02
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '6.034'
            mensaje: |
              Es la mitad. Probablemente has integrado solo de 0 a $\sqrt2$ sin
              duplicar por simetría, o has olvidado que $x$ recorre también los
              negativos.
          - valor: '24.136'
            mensaje: |
              El doble. Cuidado con aplicar la simetría **dos** veces: el
              integrando es par en $x$, así que se duplica una sola vez.
        pista: |
          $128\sqrt2/15$, con √2 ≈ 1,4142.
        desarrollo: |
          $$
          \int_{x^{2}}^{4-x^{2}} 2x^{2}y\,dy = x^{2}\Bigl[y^{2}\Bigr]_{x^{2}}^{4-x^{2}}
          = x^{2}\bigl(16-8x^{2}\bigr)
          $$

          $$
          \int_{-\sqrt2}^{\sqrt2}\bigl(16x^{2}-8x^{4}\bigr)dx
          = 2\left[\frac{16x^{3}}{3}-\frac{8x^{5}}{5}\right]_{0}^{\sqrt2}
          = \frac{128\sqrt2}{15} \approx 12{,}07
          $$
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'a) Los bordes son las parábolas $y=x^{2}$ (abajo) e $y=4-x^{2}$ (arriba), que se cortan en $x=\pm\sqrt2$.'
          - texto: 'La partición en $y=2$ existe porque en el orden $dx\,dy$ la tapa lateral cambia de parábola a esa altura.'
          - texto: 'b) Al invertir, la región se describe **de una sola vez**: $x$ de $-\sqrt2$ a $\sqrt2$, $y$ de $x^{2}$ a $4-x^{2}$.'
          - texto: 'El integrando es par en $x$, así que se puede integrar de 0 a $\sqrt2$ y duplicar.'
          - texto: 'b) Al invertir hay que seguir partiendo en dos, esta vez en $x=0$.'
            trampa: true
            mensaje: |
              No hace falta: en el orden $dy\,dx$ la tapa de abajo es siempre
              $y=x^{2}$ y la de arriba siempre $y=4-x^{2}$, para todo $x$ entre
              $-\sqrt2$ y $\sqrt2$. **Ese es el motivo de que el enunciado pida
              invertir**: dos integrales se convierten en una.
    resolucion: |
      **a) El dominio.** Leyendo los límites como tiras horizontales:

      - de $y=0$ a $y=2$, la tira va de $-\sqrt y$ a $\sqrt y$, o sea entre las
        dos ramas de la parábola $y=x^{2}$;
      - de $y=2$ a $y=4$, va de $-\sqrt{4-y}$ a $\sqrt{4-y}$, entre las ramas de
        $y = 4-x^{2}$.

      Las dos parábolas se cortan donde $x^{2}=4-x^{2}$, o sea en
      $x=\pm\sqrt2$, $y=2$ — justo la altura del corte. La región es una **lente
      vertical** entre las dos parábolas.

      **b) Invertir el orden**, que es donde está la gracia. Barriendo con tiras
      **verticales**, cada una entra por $y=x^{2}$ y sale por $y=4-x^{2}$, sin
      excepción:

      $$
      I = \int_{-\sqrt2}^{\sqrt2}\!\!\int_{x^{2}}^{4-x^{2}} 2x^{2}y\;dy\,dx
      $$

      **Dos integrales se han convertido en una.** Ese es el premio de invertir,
      y el motivo de que el enunciado lo pida.

      **Calculando:**

      $$
      \int_{x^{2}}^{4-x^{2}} 2x^{2}y\,dy = x^{2}\bigl[(4-x^{2})^{2}-x^{4}\bigr]
      = 16x^{2}-8x^{4}
      $$

      El integrando es **par**, así que se integra de 0 a $\sqrt2$ y se duplica:

      $$
      I = 2\left[\frac{16x^{3}}{3}-\frac{8x^{5}}{5}\right]_{0}^{\sqrt2}
      = 2\left(\frac{32\sqrt2}{3}-\frac{32\sqrt2}{5}\right)
      = \boxed{\frac{128\sqrt2}{15} \approx 12{,}07}
      $$

      > **La simetría no es un adorno.** El integrando $2x^{2}y$ es par en $x$ y
      > la región también, así que medio recinto basta. Verlo ahorra la mitad de
      > las sustituciones y, sobre todo, la mitad de las ocasiones de
      > equivocarse con los signos de $-\sqrt2$.

  - id: ex2324-4ev-3-cono-eliptico-planteado
    titulo: Un cono elíptico, y plantear sin calcular
    fuente: >-
      Ejercicio 3 · Cuarta evaluación, 25 de marzo de 2024 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp2: 5
      comp4: 5
    enunciado: |
      Sea $S$ el sólido definido por las condiciones
      $\dfrac{y^{2}}{9}+\dfrac{z^{2}}{4}\le x^{2}$, $-1\le x\le 2$.

      a) Dibujar el sólido $S$.

      b) Sabiendo que la densidad en cada punto de $S$ es $f(x,y,z)=k$,
      plantear (funciones y límites de integración), utilizando las coordenadas
      más adecuadas, las fórmulas para el cálculo del centro de gravedad de $S$.
    pide: El dibujo del sólido y el planteamiento del centro de gravedad.
    pasos:
      - tipo: reconocer
        pregunta: |
          El reparto de este ejercicio es COMP2 5 y COMP4 5, y el apartado b)
          dice «plantear». ¿Qué se está evaluando?
        opciones:
          - texto: Leer el sólido, elegir coordenadas y escribir los límites; no calcular
            correcta: true
            mensaje: |
              Eso es, y el reparto lo dice: la mitad de la nota es el
              planteamiento. Ponerse a integrar no suma puntos y gasta el
              tiempo del examen.
          - texto: La rapidez integrando
            mensaje: |
              El enunciado prohíbe calcular. Lo que se corrige es si sabes
              traducir el sólido a límites, que es lo que falla más gente.
          - texto: Memorizar la fórmula del centro de gravedad
            mensaje: |
              La fórmula es corta y siempre la misma. Lo difícil es rellenarla:
              qué coordenadas, qué jacobiano y qué límites.
      - tipo: calcular
        titulo: El jacobiano del cambio
        pregunta: |
          Con $y = 3\rho\cos\theta$ y $z = 2\rho\,\text{sen}\,\theta$
          —cilíndricas generalizadas alrededor del eje $X$—, ¿cuánto vale el
          jacobiano, como coeficiente que multiplica a $\rho$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 sería el jacobiano de las cartesianas. Al meter los semiejes 3 y
              2 en el cambio, aparece su producto multiplicando.
          - valor: '5'
            mensaje: |
              5 es la **suma** de los semiejes. El jacobiano de las
              generalizadas es su **producto**: $ab\rho = 6\rho$.
        pista: |
          El jacobiano de las polares generalizadas es $ab\rho$, con a=3 y b=2.
        desarrollo: |
          $$
          J = ab\,\rho = 3\cdot 2\cdot\rho = 6\rho
          $$

          Y con ese cambio la condición
          $\frac{y^{2}}{9}+\frac{z^{2}}{4}\le x^{2}$ se convierte en
          $\rho^{2}\le x^{2}$, o sea $\rho \le |x|$: un límite limpio.
      - tipo: justificar
        pregunta: |
          Ordena el planteamiento. Una pieza es falsa.
        piezas:
          - texto: 'a) Son dos conos elípticos unidos por el vértice en el origen: uno de $x=-1$ a 0 y otro de 0 a 2.'
          - texto: 'b) Con $y=3\rho\cos\theta$ y $z=2\rho\,\text{sen}\,\theta$, la condición pasa a ser $\rho\le|x|$ y el jacobiano es $6\rho$.'
          - texto: 'Los límites son $x\in[-1,2]$, $\rho\in[0,|x|]$, $\theta\in[0,2\pi]$.'
          - texto: 'Por simetría en $y$ y en $z$, las coordenadas $\overline{y}$ y $\overline{z}$ del centro valen 0.'
          - texto: 'Por simetría, también $\overline{x}=0$, porque el sólido es simétrico respecto del origen.'
            trampa: true
            mensaje: |
              En $x$ **no** hay simetría: el sólido va de $-1$ a $2$, y el cono
              de la derecha es mucho más ancho y más largo. El centro de
              gravedad cae desplazado hacia el lado positivo. Solo $y$ y $z$ se
              anulan por simetría.
    resolucion: |
      **a) El sólido.** La condición
      $\frac{y^{2}}{9}+\frac{z^{2}}{4}\le x^{2}$ es un **cono elíptico** con eje
      el eje $X$ y vértice en el origen: al cortar por un $x$ fijo sale la
      elipse de semiejes $3|x|$ y $2|x|$, que crece al alejarse del origen.

      Como $x$ va de $-1$ a $2$, son **dos conos unidos por el vértice**: uno
      corto hacia atrás y otro el doble de largo hacia delante.

      **b) El planteamiento**, que es lo que se pide.

      **Las coordenadas más adecuadas** son cilíndricas generalizadas alrededor
      del eje $X$, con los semiejes metidos en el cambio:

      $$
      y = 3\rho\cos\theta,
      \qquad
      z = 2\rho\,\text{sen}\,\theta,
      \qquad
      x = x,
      \qquad
      J = 6\rho
      $$

      Con eso la condición se vuelve $\rho\le|x|$, y los límites quedan
      constantes salvo uno:

      $$
      x\in[-1,2],
      \qquad
      \rho\in\bigl[0,|x|\bigr],
      \qquad
      \theta\in[0,2\pi]
      $$

      **La masa:**

      $$
      M = k\int_{-1}^{2}\!\!\int_{0}^{2\pi}\!\!\int_{0}^{|x|} 6\rho\;d\rho\,d\theta\,dx
      $$

      **Y las tres coordenadas del centro:**

      $$
      \overline{x} = \frac{1}{M}\,k\!\int_{-1}^{2}\!\!\int_{0}^{2\pi}\!\!\int_{0}^{|x|}\! x\;6\rho\;d\rho\,d\theta\,dx
      $$

      $$
      \overline{y} = 0,
      \qquad
      \overline{z} = 0
      \qquad\text{por simetría}
      $$

      **Decir eso último justificado vale tanto como plantear las integrales**,
      y ahorra dos de las cuatro.

      > **La comprobación, aunque el enunciado no la pida.** Si se calculan las
      > integrales sale $M = 18\pi k$ y momento $22{,}5\pi k$, o sea
      > $\overline{x} = 5/4$. Está entre $-1$ y $2$ y desplazado hacia el cono
      > grande, que es exactamente donde tiene que caer. Hacer esta comprobación
      > mental —sin integrar— y decir «el centro estará en el eje $X$, entre 0 y
      > 2, más cerca de 2 que de 0» es una frase que suma en COMP4.
