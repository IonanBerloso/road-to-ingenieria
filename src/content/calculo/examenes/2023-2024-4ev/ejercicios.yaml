        consigna: |
          Dibuja el sólido $S$ en perspectiva, con el eje $OX$ como eje del cono.
          Marca las dos tapas y el vértice.
        comprueba:
          - punto: |
              Un cono **doble**, con el vértice en el origen y las dos hojas
              abriendo hacia $x$ positivo y negativo.
            porque: |
              El intervalo $-1\le x\le2$ cruza el origen, así que entran las dos
              hojas. Dibujar solo una deja fuera un tercio del sólido.
          - punto: |
              El eje del cono en **$OX$**, la variable que aparece sola al
              cuadrado en el otro miembro.
            porque: |
              Ponerlo vertical es el error que cambia el sólido. Y con el eje en
              $OX$, la variable natural de integración es $x$.
          - punto: |
              Las secciones perpendiculares al eje son **elipses**, con la
              proporción $3:2$ entre semiejes.
            porque: |
              Los denominadores $9$ y $4$ son distintos: es un cono elíptico. La
              sección en $x$ tiene semiejes $3\lvert x\rvert$ y $2\lvert x\rvert$.
          - punto: |
              Las dos tapas planas: en $x=2$ una elipse de semiejes $6$ y $4$, y
              en $x=-1$ otra de semiejes $3$ y $2$.
            porque: |
              Son las caras que cierran el sólido, y sus tamaños —una el doble de
              la otra— enseñan que la hoja derecha pesa mucho más. Eso ya predice
              de qué lado cae el centro de gravedad.
        veredicto: |
          Con el área de la sección, $6\pi x^{2}$, todo el planteamiento del
          apartado (b) es una integral simple en $x$ de $-1$ a $2$. Y por
          simetría, $\overline y=\overline z=0$: solo hay que calcular
          $\overline x$.

    resolucion: |
      **a) El sólido.** La condición
      $\frac{y^{2}}{9}+\frac{z^{2}}{4}\le x^{2}$ es un **cono elíptico** con eje
      el eje $X$ y vértice en el origen: al cortar por un $x$ fijo sale la
      elipse de semiejes $3|x|$ y $2|x|$, que crece al alejarse del origen.

      Como $x$ va de $-1$ a $2$, son **dos conos unidos por el vértice**: uno
      corto hacia atrás y otro el doble de largo hacia delante.

      **b) El planteamiento**, que es lo que se pide.

      **Las coordenadas más adecuadas** son cilíndricas generalizadas alrededor
      del eje $X$, con los semiejes metidos en el cambio:

      $$
      y = 3\rho\cos\theta,
      \qquad
      z = 2\rho\,\text{sen}\,\theta,
      \qquad
      x = x,
      \qquad
      J = 6\rho
      $$

      Con eso la condición se vuelve $\rho\le|x|$, y los límites quedan
      constantes salvo uno:

      $$
      x\in[-1,2],
      \qquad
      \rho\in\bigl[0,|x|\bigr],
      \qquad
      \theta\in[0,2\pi]
      $$

      **La masa:**

      $$
      M = k\int_{-1}^{2}\!\!\int_{0}^{2\pi}\!\!\int_{0}^{|x|} 6\rho\;d\rho\,d\theta\,dx
      $$

      **Y las tres coordenadas del centro:**

      $$
      \overline{x} = \frac{1}{M}\,k\!\int_{-1}^{2}\!\!\int_{0}^{2\pi}\!\!\int_{0}^{|x|}\! x\;6\rho\;d\rho\,d\theta\,dx
      $$

      $$
      \overline{y} = 0,
      \qquad
      \overline{z} = 0
      \qquad\text{por simetría}
      $$

      **Decir eso último justificado vale tanto como plantear las integrales**,
      y ahorra dos de las cuatro.

      > **La comprobación, aunque el enunciado no la pida.** Si se calculan las
      > integrales sale $M = 18\pi k$ y momento $22{,}5\pi k$, o sea
      > $\overline{x} = 5/4$. Está entre $-1$ y $2$ y desplazado hacia el cono
      > grande, que es exactamente donde tiene que caer. Hacer esta comprobación
      > mental —sin integrar— y decir «el centro estará en el eje $X$, entre 0 y
      > 2, más cerca de 2 que de 0» es una frase que suma en COMP4.
