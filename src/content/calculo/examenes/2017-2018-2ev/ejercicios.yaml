ejercicios:
  - id: ex1718-2ev-1-dos-complejos-con-tres-condiciones
    titulo: Dos complejos con tres condiciones
    fuente: >-
      Ejercicio 1 · Segunda evaluación, 4 de diciembre de 2017 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 6
      comp4: 2

    enunciado: |
      Hallar los números complejos $z_1$ y $z_2$ tales que $z_1+z_2 = 1+2i$,
      $\dfrac{z_1}{z_2}$ es real y $\mathrm{Re}(z_1) = 2$.
    pide: Hallar $z_1$ y $z_2$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué significa geométricamente que $\dfrac{z_1}{z_2}$ sea real?
        opciones:
          - texto: >-
              Que los afijos de $z_1$ y $z_2$ están **alineados con el origen**
            correcta: true
            mensaje: |
              Exacto, y esa es la lectura que convierte el ejercicio en un
              sistema lineal. Un cociente real significa que los argumentos
              difieren en un múltiplo de $\pi$, es decir que los dos afijos y el
              origen están sobre la misma recta. Algebraicamente:
              $z_1 = \lambda z_2$ con $\lambda$ **real**.
          - texto: Que tienen el mismo módulo
            mensaje: |
              Eso haría que el cociente tuviera módulo 1, no que fuera real.
          - texto: Que son conjugados
            mensaje: |
              Si $z_2 = \overline{z_1}$, el cociente tiene módulo 1 pero
              argumento $2\arg z_1$: real solo en casos particulares.
          - texto: Que uno de los dos es real
            mensaje: |
              No hace falta: $2i$ y $4i$ dan cociente $\frac12$, real, y ninguno
              de los dos lo es.

      - tipo: calcular
        titulo: La constante de proporcionalidad
        pregunta: |
          Escribiendo $z_1 = \lambda z_2$ con $\lambda$ real, ¿cuánto vale
          $\lambda$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Falta el signo. La parte real de $z_2$ es $-1$, y para que
              $\lambda\cdot(-1) = 2$ hace falta $\lambda = -2$.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es $\frac{1}{\lambda}$ cambiado de signo: sería
              $\frac{z_2}{z_1}$, no $\frac{z_1}{z_2}$.
          - valor: '-1'
            mensaje: |
              $-1$ es la parte real de $z_2$, no la constante. La constante sale
              de comparar las partes reales: $2 = \lambda\cdot(-1)$.
        pista: |
          De la suma, $\mathrm{Re}(z_2) = 1-2 = -1$. Y $z_1 = \lambda z_2$
          también en las partes reales.
        desarrollo: |
          De $z_1+z_2 = 1+2i$ y $\mathrm{Re}(z_1) = 2$:

          $$
          \mathrm{Re}(z_2) = 1-2 = -1
          $$

          La condición de cociente real dice que $z_1 = \lambda z_2$ con
          $\lambda \in \mathbb{R}$. Comparando **las partes reales**, que ya se
          conocen las dos:

          $$
          2 = \lambda\cdot(-1)
          \;\Longrightarrow\;
          \lambda = -2
          $$
        veredicto: |
          Que $\lambda$ salga negativo dice que los dos afijos están en
          **lados opuestos** del origen. Y en efecto el cociente resultará
          $-2$, real negativo.

      - tipo: calcular
        titulo: La parte imaginaria de z1
        pregunta: |
          ¿Cuánto vale $\mathrm{Im}(z_1)$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es la parte imaginaria de la **suma** $z_1+z_2$, no de $z_1$
              sola.
          - valor: '-2'
            mensaje: |
              $-2$ es la parte imaginaria de $z_2$. Las dos suman 2, y
              $4+(-2) = 2$ ✔
          - valor: '1'
            mensaje: |
              1 saldría de repartir la parte imaginaria a partes iguales. La
              condición de alineación no permite eso.
        pista: |
          Llamando $b = \mathrm{Im}(z_1)$, la de $z_2$ es $2-b$, y
          $b = \lambda(2-b)$.
        desarrollo: |
          Con $z_1 = 2+bi$, la suma obliga a

          $$
          z_2 = (1+2i)-(2+bi) = -1+(2-b)i
          $$

          Y de $z_1 = -2\,z_2$, comparando **las partes imaginarias**:

          $$
          b = -2\,(2-b) = -4+2b
          $$

          $$
          b-2b = -4
          \;\Longrightarrow\;
          -b = -4
          \;\Longrightarrow\;
          b = 4
          $$

          $$
          z_1 = 2+4i,
          \qquad
          z_2 = -1-2i
          $$
        veredicto: |
          Los dos afijos están alineados con el origen —$z_1 = -2z_2$— y en
          semirrectas opuestas. Se puede comprobar en un dibujo: $(2,4)$ y
          $(-1,-2)$ están sobre la recta $y=2x$.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Contar.** Dos complejos son cuatro incógnitas reales; el
              enunciado da la suma —dos ecuaciones—, la parte real de $z_1$
              —una— y el cociente real —una—. Cuatro y cuatro.
          - texto: |
              **Traducir la condición del cociente:** $\frac{z_1}{z_2}$ real
              equivale a $z_1 = \lambda z_2$ con $\lambda$ **real**, es decir a
              que los dos afijos estén alineados con el origen.
          - texto: |
              **Las partes reales.** De la suma, $\mathrm{Re}(z_2) = -1$; y de
              la proporcionalidad, $2 = -\lambda$, luego $\lambda = -2$.
          - texto: |
              **Las partes imaginarias.** Con $z_1 = 2+bi$ y
              $z_2 = -1+(2-b)i$, la proporcionalidad da
              $b = -2(2-b)$, de donde $b=4$.
          - texto: |
              $z_1 = 2+4i$ y $z_2 = -1-2i$, y en efecto
              $\frac{z_1}{z_2} = -2$, real.
          - texto: |
              Como el cociente debe ser real, basta imponer que la parte
              imaginaria de $z_1\overline{z_2}$ sea cero, y eso da una ecuación
              cuadrática con dos soluciones.
            trampa: true
            mensaje: |
              La condición **sí** se puede escribir así —es equivalente— pero
              **no** produce una cuadrática con dos soluciones: al desarrollar
              $\mathrm{Im}\left(z_1\overline{z_2}\right) = 0$ con
              $z_1 = 2+bi$ y $z_2 = -1+(2-b)i$ sale
              $2(2-b)\cdot(-1) - b\cdot(-1)\cdot\ldots$ — una ecuación
              **lineal** en $b$, con solución única. El sistema está
              determinado, y suponer dos soluciones lleva a buscar una que no
              existe.
        veredicto: |
          Contar incógnitas y ecuaciones antes de empezar dice que la solución
          debe ser única. Si al final salen dos, hay un error en algún paso.

    resolucion: |
      **Datos.** $z_1+z_2 = 1+2i$, $\frac{z_1}{z_2}$ real y
      $\mathrm{Re}(z_1) = 2$.

      ### 1 · Contar antes de calcular

      Dos números complejos son **cuatro incógnitas reales**. El enunciado da:

      | condición | ecuaciones |
      |---|---|
      | $z_1+z_2 = 1+2i$ | 2 (real e imaginaria) |
      | $\mathrm{Re}(z_1) = 2$ | 1 |
      | $\frac{z_1}{z_2}$ real | 1 |

      Cuatro ecuaciones, cuatro incógnitas: cabe esperar **solución única**.

      ### 2 · Traducir la condición del cociente

      Es la única que no es inmediata. Un cociente de complejos es **real**
      cuando sus argumentos difieren en un múltiplo de $\pi$, es decir cuando
      los dos afijos y el origen están **alineados**.

      Algebraicamente:

      $$
      \frac{z_1}{z_2} \in \mathbb{R}
      \;\Longleftrightarrow\;
      z_1 = \lambda\,z_2 \ \text{ con } \lambda \in \mathbb{R}
      $$

      Y esa forma es la cómoda: convierte la condición en **dos ecuaciones
      lineales**, una por cada componente.

      ### 3 · Las partes reales

      De la suma:

      $$
      \mathrm{Re}(z_2) = 1-\mathrm{Re}(z_1) = 1-2 = -1
      $$

      De la proporcionalidad, comparando partes reales:

      $$
      2 = \lambda\cdot(-1)
      \;\Longrightarrow\;
      \lambda = -2
      $$

      ### 4 · Las partes imaginarias

      Llamando $b = \mathrm{Im}(z_1)$, la suma da
      $\mathrm{Im}(z_2) = 2-b$, y la proporcionalidad:

      $$
      b = -2\,(2-b)
      \;\Longrightarrow\;
      b = -4+2b
      \;\Longrightarrow\;
      b = 4
      $$

      $$
      \boxed{z_1 = 2+4i, \qquad z_2 = -1-2i}
      $$

      ### 5 · Comprobación

      **La suma:**

      $$
      (2+4i)+(-1-2i) = 1+2i \quad\checkmark
      $$

      **La parte real:** $\mathrm{Re}(z_1) = 2$ ✔

      **El cociente**, racionalizando:

      $$
      \frac{2+4i}{-1-2i}
      = \frac{(2+4i)(-1+2i)}{(-1)^{2}+(-2)^{2}}
      = \frac{-2+4i-4i+8i^{2}}{5}
      = \frac{-10}{5} = -2
      $$

      Real ✔ y además coincide con el $\lambda$ hallado, como tenía que ser.

      **Geométricamente.** Los afijos son $(2,4)$ y $(-1,-2)$, y los dos están
      sobre la recta $y = 2x$, que pasa por el origen ✔ En **lados opuestos**,
      que es lo que dice el signo negativo de $\lambda$.

  - id: ex1718-2ev-2-el-dron
    titulo: La trayectoria de un dron, de principio a fin
    fuente: >-
      Ejercicio 2 · Segunda evaluación, 4 de diciembre de 2017 · Cálculo,
      UPV/EHU · Vale 20 de los 40 puntos del examen · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 6
      comp2: 4
      comp4: 10

    enunciado: |
      La función $h(x) = -\dfrac{x^{3}}{160}+\dfrac{3x^{2}}{80}$, cuya gráfica
      se muestra en la figura adjunta, representa la trayectoria que sigue un
      dron desde su despegue y hasta alcanzar una altura de 0.2 km durante 4 km
      de recorrido horizontal. Se pide:

      <figure class="figura-examen">
      <svg viewBox="0 0 760 400" role="img" width="740" height="390"
           aria-labelledby="f1718b2t f1718b2d">
        <title id="f1718b2t">La trayectoria del dron</title>
        <desc id="f1718b2d">Una curva en forma de ese que parte del origen,
        sube con pendiente creciente hasta el kilometro 2, donde alcanza cien
        metros de altura, y luego sigue subiendo con pendiente decreciente
        hasta aplanarse en el kilometro 4 a doscientos metros. A partir de ahi
        la trayectoria continua horizontal.</desc>

        <g stroke="var(--rule)" stroke-width="1" fill="none">
          <path d="M70 60 L70 320 M160 60 L160 320 M250 60 L250 320
                   M340 60 L340 320 M430 60 L430 320 M520 60 L520 320
                   M610 60 L610 320 M700 60 L700 320
                   M70 60 L700 60 M70 112 L700 112 M70 164 L700 164
                   M70 216 L700 216 M70 268 L700 268"></path>
        </g>

        <g stroke="var(--graphite)" stroke-width="1.4" fill="none">
          <path d="M50 320 L730 320 M70 45 L70 340"></path>
        </g>

        <g stroke="var(--ink)" stroke-width="3" fill="none"
           stroke-linecap="round">
          <path d="M70 320 C 130 312, 200 265, 250 216
                   C 300 167, 380 122, 430 112"></path>
        </g>

        <g stroke="var(--live)" stroke-width="2.6" stroke-dasharray="8 6"
           fill="none" stroke-linecap="round">
          <path d="M430 112 L700 112"></path>
        </g>

        <g stroke="var(--alt)" stroke-width="1.6" stroke-dasharray="4 4"
           fill="none">
          <path d="M250 216 L250 320 M70 216 L250 216"></path>
        </g>

        <circle cx="250" cy="216" r="6" fill="var(--alt)"></circle>
        <circle cx="430" cy="112" r="6" fill="var(--ink)"></circle>

        <g fill="var(--graphite)" font-size="13" font-family="var(--mono)">
          <text x="26" y="66">0,25</text>
          <text x="34" y="117">0,2</text>
          <text x="26" y="169">0,15</text>
          <text x="34" y="221">0,1</text>
          <text x="26" y="273">0,05</text>
          <text x="52" y="325">0</text>
          <text x="156" y="342">1</text>
          <text x="246" y="342">2</text>
          <text x="336" y="342">3</text>
          <text x="426" y="342">4</text>
          <text x="516" y="342">5</text>
          <text x="606" y="342">6</text>
          <text x="696" y="342">7</text>
          <text x="356" y="368">x (km)</text>
          <text x="20" y="40">h (km)</text>
        </g>

        <g fill="var(--alt)" font-size="12" font-family="var(--mono)">
          <text x="258" y="200">p = 2</text>
        </g>

        <g fill="var(--live)" font-size="12" font-family="var(--mono)">
          <text x="520" y="102">apartado (e)</text>
        </g>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original. En morado, el punto de
      inflexion donde la pendiente es maxima; en verde y a trazos, la
      prolongacion que pide el apartado (e), que no viene en el enunciado.
      </figcaption>
      </figure>

      **a)** Calcular y representar gráficamente sobre la misma figura las
      funciones $h'(x) = \dfrac{dh}{dx}$ y $h''(x) = \dfrac{d^{2}h}{dx^{2}}$.

      **b)** Estudiar los intervalos de crecimiento/decrecimiento,
      concavidad/convexidad, extremos y puntos de inflexión de $h(x)$,
      *interpretando el significado de todo ello y relacionándolo con las
      gráficas de* $h'(x)$ *y* $h''(x)$.

      **c)** Determinar el punto $x=p$ en el que la velocidad de la altura $h$
      respecto al desplazamiento horizontal es máxima. *Interpretar el
      significado y relacionarlo con las gráficas de* $h'(x)$ *y* $h''(x)$.

      **d)** Supongamos que en el anterior punto, $x=p$, la velocidad
      horizontal del dron es de 75 km/h. Calcular en ese instante cuál es la
      velocidad de la altura respecto al tiempo.

      **e)** Supongamos que a partir del km 4 el dron mantiene constante la
      velocidad de la altura $h$ respecto al desplazamiento horizontal. Trazar
      en la figura la gráfica de su trayectoria a partir del km 4.
    pide: Resolver los cinco apartados.

    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado (c) pide dónde es máxima «la velocidad de la altura
          respecto al desplazamiento horizontal». ¿Qué hay que maximizar?
        opciones:
          - texto: >-
              $h'(x)$, y por tanto hay que resolver $h''(x)=0$
            correcta: true
            mensaje: |
              Exacto. «Velocidad de $h$ respecto a $x$» es $\frac{dh}{dx}$, o
              sea $h'$. Y para maximizar $h'$ hay que anular **su** derivada,
              que es $h''$. El máximo de la pendiente está en el punto de
              inflexión de la trayectoria.
          - texto: $h(x)$, resolviendo $h'(x)=0$
            mensaje: |
              Eso daría dónde es máxima la **altura**, no la velocidad de
              subida. Son cosas distintas: la altura es máxima al final, la
              pendiente en medio.
          - texto: >-
              $h''(x)$, resolviendo $h'''(x)=0$
            mensaje: |
              $h''$ es la aceleración de la subida, no su velocidad. Y
              $h''' = -\frac{3}{80}$ es constante: no se anula nunca.
          - texto: >-
              La velocidad respecto al tiempo, que es el apartado (d)
            mensaje: |
              El apartado (c) es respecto a $x$, no a $t$. El (d) introduce el
              tiempo después, y por eso son dos apartados distintos.

      - tipo: calcular
        titulo: El punto de pendiente máxima
        pregunta: |
          ¿En qué kilómetro $p$ es máxima la pendiente?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número en km
        distractores:
          - valor: '4'
            mensaje: |
              4 es donde la trayectoria **acaba de subir**: ahí la pendiente es
              cero, la mínima del recorrido. La máxima está antes.
          - valor: '0'
            mensaje: |
              En el despegue la pendiente también es cero: $h'(0)=0$. El dron
              arranca horizontal.
          - valor: '2.6666667'
            mensaje: |
              $\frac83$ saldría de resolver mal $h''=0$. La ecuación es
              $-\frac{3x}{80}+\frac{3}{40} = 0$, que da $x=2$.
        pista: |
          $h''(x) = -\frac{3x}{80}+\frac{3}{40}$. Iguálala a cero.
        desarrollo: |
          $$
          h'(x) = -\frac{3x^{2}}{160}+\frac{3x}{40}
          = \frac{3x}{160}\left(4-x\right)
          $$

          $$
          h''(x) = -\frac{3x}{80}+\frac{3}{40}
          = \frac{3}{80}\left(2-x\right)
          $$

          $$
          h''(x) = 0
          \;\Longrightarrow\;
          p = 2 \ \text{km}
          $$

          Y es máximo porque $h''$ pasa de positiva a negativa ahí: $h'$ crece
          antes de 2 y decrece después.

          La pendiente en ese punto:

          $$
          h'(2) = \frac{6}{160}\cdot2 = 0{,}075
          $$

          es decir **75 metros de subida por kilómetro recorrido**.
        veredicto: |
          El punto de pendiente máxima es el **punto de inflexión** de la
          trayectoria: donde la curva deja de curvarse hacia arriba y empieza a
          curvarse hacia abajo.

      - tipo: calcular
        titulo: El apartado (d)
        pregunta: |
          Con velocidad horizontal 75 km/h en $x=p$, ¿a qué velocidad gana
          altura el dron? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '5.625'
          tolerancia: 0.005
          formato: un número en km/h
        distractores:
          - valor: '75'
            mensaje: |
              75 km/h es la velocidad **horizontal**, el dato. La vertical es
              mucho menor: el dron avanza mucho más de lo que sube.
          - valor: '0.075'
            mensaje: |
              $0{,}075$ es la **pendiente**, en km de altura por km horizontal.
              Falta multiplicarla por la velocidad horizontal.
          - valor: '1000'
            mensaje: |
              1000 sale de **dividir** 75 entre 0,075. La regla de la cadena
              multiplica.
        pista: |
          $\frac{dh}{dt} = h'(x)\cdot\frac{dx}{dt}$.
        desarrollo: |
          La altura depende de $x$, y $x$ del tiempo, así que la regla de la
          cadena da

          $$
          \frac{dh}{dt} = h'(x)\cdot\frac{dx}{dt}
          $$

          En $x=p=2$, con $h'(2) = 0{,}075$ y
          $\frac{dx}{dt} = 75$ km/h:

          $$
          \frac{dh}{dt} = 0{,}075\cdot75 = 5{,}625 \ \text{km/h}
          $$

          Unos **94 metros por minuto** de ascenso.
        veredicto: |
          La velocidad vertical es el 7,5 % de la horizontal, que es
          exactamente la pendiente. Una comprobación instantánea.

      - tipo: justificar
        pregunta: |
          Ordena el apartado (e). Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Qué se mantiene constante:** «la velocidad de la altura respecto
              al desplazamiento horizontal», es decir $h'(x)$ — no la velocidad
              respecto al tiempo.
          - texto: |
              **Cuánto vale al llegar al km 4:**
              $h'(4) = \frac{3\cdot4}{160}(4-4) = 0$.
          - texto: |
              Luego a partir de ahí $h'(x) = 0$ constante.
          - texto: |
              Una función con derivada nula es **constante**, así que la altura
              se queda en su valor de ese momento:
              $h(4) = -\frac{64}{160}+\frac{48}{80} = 0{,}2$ km.
          - texto: |
              **La gráfica** es una recta **horizontal** a 0,2 km desde el km 4
              en adelante: el dron pasa a vuelo de crucero.
          - texto: |
              Como el dron mantiene la velocidad constante, la trayectoria a
              partir del km 4 es una recta con la misma pendiente que traía al
              llegar, que era la máxima.
            trampa: true
            mensaje: |
              La pendiente máxima se alcanzó en el km **2**, no en el 4. Al
              llegar al km 4 la trayectoria ya se ha aplanado: $h'(4) = 0$.
              Mantener «la velocidad constante» a partir de ahí significa
              mantener **cero**, es decir volar horizontal. Confundir el valor
              en el punto final con el valor máximo es el error del apartado.
        veredicto: |
          El apartado (e) parece de dibujo y es de lectura: todo depende de
          notar que $h'(4)=0$, cosa que la propia gráfica ya sugiere al
          aplanarse.

    resolucion: |
      **Datos.** $h(x) = -\frac{x^{3}}{160}+\frac{3x^{2}}{80}$ en $[0,4]$, con
      $x$ y $h$ en kilómetros.

      > Este ejercicio vale **20 de los 40 puntos** del examen: la mitad. Y su
      > reparto es COMP1 3, COMP2 2, COMP4 5 — casi todo interpretación. El
      > enunciado subraya dos veces «interpretando el significado», y ahí está
      > la nota.

      ### 1 · Apartado (a): las dos derivadas

      $$
      h'(x) = -\frac{3x^{2}}{160}+\frac{3x}{40}
      $$

      Conviene **factorizarla**, porque así se leen los ceros de un vistazo:

      $$
      h'(x) = \frac{3x}{160}\left(4-x\right)
      $$

      $$
      h''(x) = -\frac{3x}{80}+\frac{3}{40} = \frac{3}{80}\left(2-x\right)
      $$

      | | forma | ceros | tipo |
      |---|---|---|---|
      | $h$ | cúbica | $0$ y $6$ | curva en S |
      | $h'$ | parábola invertida | $0$ y $4$ | máximo en $x=2$ |
      | $h''$ | recta decreciente | $2$ | corta en $x=2$ |

      ### 2 · Apartado (b): el estudio, con su significado

      **Crecimiento.** $h'(x) = \frac{3x}{160}(4-x) > 0$ en todo $(0,4)$, porque
      los dos factores lo son.

      $$
      h \text{ es creciente en } (0,4)
      $$

      *Significado:* el dron **sube durante todo el recorrido**. No baja en
      ningún momento.

      **Extremos.** $h'$ se anula en $x=0$ y $x=4$, los dos **extremos del
      intervalo**. Dentro no hay ninguno.

      *Significado:* arranca horizontal —despegue suave— y llega horizontal
      —nivelación—. En medio no hay ni cumbres ni valles.

      **Concavidad.** $h''(x) = \frac{3}{80}(2-x)$:

      | tramo | $h''$ | $h$ | qué hace el dron |
      |---|---|---|---|
      | $(0,2)$ | $>0$ | **convexa** | acelera su ascenso |
      | $(2,4)$ | $<0$ | **cóncava** | frena su ascenso |

      **Punto de inflexión** en $x=2$, con $h(2) = 0{,}1$ km.

      *Significado:* el dron **cambia de régimen** en el km 2. Antes gana
      pendiente; después la va perdiendo hasta nivelarse.

      **Relación con las gráficas.** $h'$ es una parábola invertida con máximo
      en $x=2$; $h''$ es una recta que cruza el eje en ese mismo punto. Los tres
      hechos son el mismo visto desde tres alturas: la trayectoria tiene su
      inflexión donde la pendiente es máxima y donde la curvatura cambia de
      signo.

      ### 3 · Apartado (c): dónde sube más deprisa

      «La velocidad de $h$ respecto al desplazamiento horizontal» es
      $\frac{dh}{dx} = h'(x)$. Maximizarla exige anular **su** derivada:

      $$
      h''(x) = 0
      \;\Longrightarrow\;
      \boxed{p = 2 \ \text{km}}
      $$

      Y es máximo porque $h''$ pasa de $+$ a $-$.

      $$
      h'(2) = \frac{3\cdot2}{160}\left(4-2\right) = \frac{6}{160}\cdot2
      = 0{,}075
      $$

      *Significado:* en el km 2 el dron sube **75 metros por cada kilómetro
      recorrido**, la mayor tasa de todo el vuelo. En las gráficas, es la cima
      de $h'$ y el corte de $h''$ con el eje.

      ### 4 · Apartado (d): ahora con el tiempo

      Los apartados anteriores hablan de $x$; este introduce $t$. La regla de la
      cadena los conecta:

      $$
      \frac{dh}{dt} = \frac{dh}{dx}\cdot\frac{dx}{dt}
      = h'(x)\cdot\frac{dx}{dt}
      $$

      $$
      \frac{dh}{dt} = 0{,}075\cdot75
      $$

      $$
      \boxed{\frac{dh}{dt} = 5{,}625 \ \text{km/h}}
      $$

      Unos 94 m/min de ascenso, con el dron avanzando a 75 km/h.

      ### 5 · Apartado (e): el vuelo de crucero

      Lo que se mantiene constante es $h'$, **no** la velocidad respecto al
      tiempo. Y al llegar al km 4:

      $$
      h'(4) = \frac{3\cdot4}{160}\left(4-4\right) = 0
      $$

      Mantener eso constante significa mantener **pendiente cero**. Una función
      con derivada nula es constante, así que la altura se queda donde estaba:

      $$
      h(4) = -\frac{64}{160}+\frac{3\cdot16}{80} = -0{,}4+0{,}6 = 0{,}2 \ \text{km}
      $$

      $$
      \boxed{h(x) = 0{,}2 \ \text{km para } x \ge 4: \text{ recta horizontal}}
      $$

      En la figura, la línea de trazos verde.

      **El error del apartado** es suponer que se mantiene la pendiente
      **máxima**, la del km 2. No: se mantiene la que trae al llegar, que es
      cero.

      ### 6 · Comprobación

      **Que la altura final es la del enunciado.** El enunciado dice «hasta
      alcanzar una altura de 0.2 km durante 4 km», y en efecto $h(4)=0{,}2$ ✔
      Dos datos independientes que cuadran.

      **Que la trayectoria empalma suavemente.** En $x=4$ la curva llega con
      $h'=0$ y la prolongación tiene $h'=0$: la unión es **derivable**, sin
      pico ✔ Es lo que se ve en la figura.

      **Del punto de inflexión.** $h(2) = -\frac{8}{160}+\frac{12}{80}
      = -0{,}05+0{,}15 = 0{,}1$ km, exactamente **la mitad** de la altura final,
      en **la mitad** del recorrido ✔ La curva en S es simétrica respecto de ese
      punto, como toda cúbica respecto de su inflexión.

      **De la velocidad vertical.** $5{,}625$ es el $7{,}5\ \%$ de 75, y $7{,}5$
      es la pendiente en tanto por ciento ✔

  - id: ex1718-2ev-3-cable-entre-dos-postes
    titulo: El cable más corto entre dos postes
    fuente: >-
      Ejercicio 3 · Segunda evaluación, 4 de diciembre de 2017 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3

    enunciado: |
      Dos postes, de 2 y 3 metros de altura, distan 5 metros. Hay que conectar
      sus extremos superiores mediante un cable sujeto en algún punto del suelo,
      entre ellos. Se trata de encontrar ese punto, de modo que empleemos la
      menor cantidad posible de cable.

      <figure class="figura-examen">
      <svg viewBox="0 0 620 340" role="img" width="600" height="330"
           aria-labelledby="f1718b3t f1718b3d">
        <title id="f1718b3t">Los dos postes y el cable</title>
        <desc id="f1718b3d">Dos postes verticales de dos y tres metros
        separados cinco metros, con un cable que va desde lo alto de uno hasta
        un punto del suelo y de ahi hasta lo alto del otro.</desc>

        <g stroke="var(--graphite)" stroke-width="2.4" fill="none">
          <path d="M110 250 L110 150 M510 250 L510 100"></path>
          <path d="M50 250 L570 250"></path>
        </g>

        <g stroke="var(--live)" stroke-width="2.6" fill="none"
           stroke-linecap="round">
          <path d="M110 150 L270 250 L510 100"></path>
        </g>

        <circle cx="270" cy="250" r="6" fill="var(--live)"></circle>

        <g stroke="var(--alt)" stroke-width="1.6" stroke-dasharray="5 5"
           fill="none">
          <path d="M110 268 L270 268 M110 262 L110 274 M270 262 L270 274"></path>
          <path d="M270 290 L510 290 M270 284 L270 296 M510 284 L510 296"></path>
        </g>

        <g stroke="var(--graphite)" stroke-width="1.2" fill="none">
          <path d="M84 150 L84 250 M78 150 L90 150 M78 250 L90 250"></path>
          <path d="M544 100 L544 250 M538 100 L550 100 M538 250 L550 250"></path>
        </g>

        <g fill="var(--graphite)" font-size="14" font-family="var(--mono)">
          <text x="56" y="205">2 m</text>
          <text x="556" y="180">3 m</text>
        </g>

        <g fill="var(--alt)" font-size="13" font-family="var(--mono)">
          <text x="180" y="284">x</text>
          <text x="378" y="306">5 - x</text>
        </g>

        <g fill="var(--live)" font-size="13" font-family="var(--mono)">
          <text x="160" y="190">L1</text>
          <text x="400" y="180">L2</text>
        </g>
      </svg>
      <figcaption>
      Figura nuestra: el enunciado no trae dibujo. En verde el cable, con el
      punto de sujecion a distancia x del poste corto.
      </figcaption>
      </figure>
    pide: Encontrar el punto de sujeción.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué función hay que minimizar?
        opciones:
          - texto: >-
              $L(x) = \sqrt{x^{2}+4}+\sqrt{(5-x)^{2}+9}$, la suma de las dos
              hipotenusas
            correcta: true
            mensaje: |
              Exacto. Cada tramo de cable es la hipotenusa de un triángulo
              rectángulo: catetos $x$ y 2 el primero, $5-x$ y 3 el segundo.
              La suma de las dos es la longitud total.
          - texto: >-
              $x+(5-x) = 5$, la distancia entre los postes
            mensaje: |
              Eso es constante: no depende de dónde se clave el cable. El cable
              no va por el suelo, sube a los dos extremos.
          - texto: >-
              $\sqrt{5^{2}+(3-2)^{2}}$, la distancia entre los dos extremos
            mensaje: |
              Esa sería la longitud si el cable fuera directo de punta a punta,
              pero el enunciado exige que **toque el suelo** en un punto.
          - texto: >-
              El área del triángulo que forman
            mensaje: |
              El área no interviene: lo que se minimiza es longitud.

      - tipo: calcular
        titulo: El punto óptimo
        pregunta: |
          ¿A qué distancia del poste de 2 m hay que clavar el cable?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número en metros
        distractores:
          - valor: '2.5'
            mensaje: |
              $2{,}5$ es el punto medio. No es el óptimo: el poste más alto
              «tira» del punto hacia sí, pero menos de lo que parece — el
              reparto sale $2$ y $3$, proporcional a las alturas.
          - valor: '3'
            mensaje: |
              3 es la distancia al poste **alto**, es decir $5-x$. La pregunta
              es por la distancia al de 2 m.
          - valor: '1.6666667'
            mensaje: |
              $\frac53$ saldría de un reparto en proporción $2:3$ mal aplicado.
              El reparto correcto es $2:3$ sobre 5, que da exactamente 2 y 3.
        pista: |
          Refleja el poste alto bajo el suelo y une los dos extremos en línea
          recta.
        desarrollo: |
          **Por derivación.** Con
          $L(x) = \sqrt{x^{2}+4}+\sqrt{(5-x)^{2}+9}$:

          $$
          L'(x) = \frac{x}{\sqrt{x^{2}+4}}-\frac{5-x}{\sqrt{(5-x)^{2}+9}} = 0
          $$

          En $x=2$:

          $$
          \frac{2}{\sqrt{8}}-\frac{3}{\sqrt{18}}
          = \frac{2}{2\sqrt2}-\frac{3}{3\sqrt2}
          = \frac{1}{\sqrt2}-\frac{1}{\sqrt2} = 0 \quad\checkmark
          $$

          **Por reflexión**, que es mucho más corto. Reflejando el poste alto
          **bajo** el suelo, su extremo pasa de $(5,3)$ a $(5,-3)$. El camino
          más corto de $(0,2)$ a $(5,-3)$ es la recta, que tiene pendiente
          $\frac{-3-2}{5} = -1$ y ecuación $y = 2-x$.

          Corta al suelo en $y=0$, es decir en $x=2$.
        veredicto: |
          El truco de la reflexión resuelve el problema **sin derivar**, y
          además explica por qué: el cable óptimo cumple que el ángulo de
          «llegada» es igual al de «salida», como un rayo de luz.

      - tipo: calcular
        titulo: La longitud mínima
        pregunta: |
          ¿Cuánto cable hace falta? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '7.0711'
          tolerancia: 0.0005
          formato: un número en metros
        distractores:
          - valor: '5.0990'
            mensaje: |
              $\sqrt{26}$ es la distancia **directa** entre los dos extremos,
              sin tocar el suelo. El cable tiene que bajar, así que es más
              largo.
          - valor: '2.8284'
            mensaje: |
              $2\sqrt2 \approx 2{,}83$ es solo el **primer tramo**, el que va
              del poste corto al suelo. Falta el segundo, que mide
              $3\sqrt2 \approx 4{,}24$.
          - valor: '10'
            mensaje: |
              10 saldría de $2+3+5$, sumando las tres longitudes por separado.
              El cable va en diagonal, no en escalera.
        pista: |
          $L = \sqrt{4+4}+\sqrt{9+9}$, o bien la distancia al punto reflejado.
        desarrollo: |
          Con $x=2$:

          $$
          L_1 = \sqrt{2^{2}+2^{2}} = \sqrt8 = 2\sqrt2
          $$

          $$
          L_2 = \sqrt{3^{2}+3^{2}} = \sqrt{18} = 3\sqrt2
          $$

          $$
          L = 2\sqrt2+3\sqrt2 = 5\sqrt2 \approx 7{,}0711 \ \text{m}
          $$

          **Y por reflexión sale de una vez:** es la distancia de $(0,2)$ a
          $(5,-3)$,

          $$
          L = \sqrt{5^{2}+5^{2}} = \sqrt{50} = 5\sqrt2 \quad\checkmark
          $$
        veredicto: |
          Que los dos triángulos salgan **isósceles** —catetos $2$ y $2$, y
          $3$ y $3$— es consecuencia de que el reparto sea proporcional a las
          alturas. Los dos tramos forman 45° con el suelo.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La variable.** $x$ es la distancia del poste de 2 m al punto de
              sujeción, con $0\le x\le5$.
          - texto: |
              **La función objetivo:**
              $L(x) = \sqrt{x^{2}+4}+\sqrt{(5-x)^{2}+9}$, suma de dos
              hipotenusas.
          - texto: |
              **Derivar:**
              $L'(x) = \frac{x}{\sqrt{x^{2}+4}}
              -\frac{5-x}{\sqrt{(5-x)^{2}+9}}$, que se anula en $x=2$.
          - texto: |
              **O reflejar**, que es más rápido: el extremo alto pasa a
              $(5,-3)$, la recta que lo une con $(0,2)$ tiene pendiente $-1$ y
              corta el suelo en $x=2$.
          - texto: |
              **La longitud:** $L = 2\sqrt2+3\sqrt2 = 5\sqrt2 \approx 7{,}07$ m,
              que coincide con $\sqrt{5^{2}+5^{2}}$, la distancia al punto
              reflejado.
          - texto: |
              El punto óptimo es el punto medio entre los dos postes, porque así
              los dos tramos de cable son iguales.
            trampa: true
            mensaje: |
              Los dos tramos **no** son iguales: miden $2\sqrt2$ y $3\sqrt2$.
              El punto medio, $x=2{,}5$, da $L = 7{,}075$, algo **más** que el
              óptimo. Lo que sí es igual en los dos tramos es el **ángulo** con
              el suelo —45° en ambos—, y eso es lo que caracteriza al mínimo,
              no la longitud.
        veredicto: |
          El reparto sale $2$ y $3$, proporcional a las alturas de los postes.
          No es casualidad: la condición de ángulos iguales lo impone.

    resolucion: |
      **Datos.** Postes de 2 y 3 m separados 5 m; cable de un extremo al otro
      pasando por un punto del suelo.

      ### 1 · Plantear

      Poniendo el poste corto en $x=0$ y el largo en $x=5$, y llamando $x$ a la
      distancia del punto de sujeción al poste corto:

      | tramo | catetos | longitud |
      |---|---|---|
      | $L_1$ | $x$ y $2$ | $\sqrt{x^{2}+4}$ |
      | $L_2$ | $5-x$ y $3$ | $\sqrt{(5-x)^{2}+9}$ |

      $$
      L(x) = \sqrt{x^{2}+4}+\sqrt{(5-x)^{2}+9},
      \qquad 0 \le x \le 5
      $$

      ### 2 · La vía corta: reflexión

      Hay un truco clásico que resuelve esto **sin derivar**.

      Refléjese el poste alto **por debajo del suelo**: su extremo pasa de
      $(5,3)$ a $(5,-3)$. Para cualquier punto $P$ del suelo, la distancia de
      $P$ al extremo real y al reflejado es **la misma** —el suelo es el eje de
      simetría—, así que

      $$
      L(x) = \overline{AP}+\overline{PB}
      = \overline{AP}+\overline{PB'}
      $$

      donde $A=(0,2)$ y $B'=(5,-3)$. Y esa suma es mínima cuando $P$ está sobre
      el **segmento recto** $AB'$: la recta es el camino más corto.

      La recta de $(0,2)$ a $(5,-3)$ tiene pendiente

      $$
      m = \frac{-3-2}{5-0} = -1
      \;\Longrightarrow\;
      y = 2-x
      $$

      y corta al suelo, $y=0$, en

      $$
      \boxed{x = 2 \ \text{m desde el poste de 2 m}}
      $$

      Y la longitud mínima es directamente la distancia $\overline{AB'}$:

      $$
      \boxed{L = \sqrt{5^{2}+5^{2}} = 5\sqrt2 \approx 7{,}0711 \ \text{m}}
      $$

      ### 3 · La vía larga: derivar

      $$
      L'(x) = \frac{x}{\sqrt{x^{2}+4}}-\frac{5-x}{\sqrt{(5-x)^{2}+9}}
      $$

      Igualando a cero:

      $$
      \frac{x}{\sqrt{x^{2}+4}} = \frac{5-x}{\sqrt{(5-x)^{2}+9}}
      $$

      Elevando al cuadrado y operando se llega a $x=2$. Y comprobándolo
      directamente:

      $$
      \frac{2}{\sqrt8}-\frac{3}{\sqrt{18}}
      = \frac{2}{2\sqrt2}-\frac{3}{3\sqrt2}
      = \frac{1}{\sqrt2}-\frac{1}{\sqrt2} = 0 \quad\checkmark
      $$

      **Que es mínimo:** $L$ es suma de dos funciones convexas —cada raíz lo
      es— luego es convexa, y su punto crítico es el mínimo absoluto.

      ### 4 · Lo que dice la condición de óptimo

      La ecuación $L'=0$ se puede leer así:

      $$
      \frac{x}{L_1} = \frac{5-x}{L_2}
      $$

      y esos dos cocientes son los **cosenos** de los ángulos que forman los dos
      tramos con el suelo. Es decir:

      > En el óptimo, **los dos tramos forman el mismo ángulo con el suelo.**

      Es la ley de reflexión — la misma que sigue un rayo de luz al rebotar. Por
      eso el truco del espejo funciona.

      Aquí los dos ángulos valen **45°**, porque los triángulos salen isósceles:
      catetos $2$ y $2$ el primero, $3$ y $3$ el segundo.

      ### 5 · Por qué el reparto es 2 y 3

      De la igualdad de ángulos sale, por semejanza de triángulos:

      $$
      \frac{x}{2} = \frac{5-x}{3}
      \;\Longrightarrow\;
      3x = 10-2x
      \;\Longrightarrow\;
      x = 2
      $$

      **El punto divide los 5 m en proporción a las alturas de los postes**,
      $2:3$. Es una regla general para este problema, y sirve para comprobar el
      resultado de un vistazo.

      ### 6 · Comprobación

      **Numérica:**

      | $x$ | $L(x)$ |
      |---|---|
      | $1$ | $7{,}208$ |
      | $2$ | $\mathbf{7{,}0711}$ |
      | $2{,}5$ | $7{,}075$ |
      | $3$ | $7{,}134$ |

      El de $x=2$ es el menor ✔ Y nótese que el punto medio, $2{,}5$, queda muy
      cerca: la función es bastante plana cerca del óptimo.

      **Por cota inferior.** El cable no puede medir menos que la distancia
      directa entre los dos extremos:

      $$
      \sqrt{5^{2}+1^{2}} = \sqrt{26} \approx 5{,}099
      $$

      Y $7{,}07 > 5{,}10$ ✔ La diferencia es lo que cuesta bajar al suelo.

      **De los ángulos.** $\tan\theta_1 = \frac{2}{2} = 1$ y
      $\tan\theta_2 = \frac{3}{3} = 1$: los dos 45° ✔
