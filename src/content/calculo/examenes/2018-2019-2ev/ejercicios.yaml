ejercicios:
  - id: ex1819-2ev-1-potencia-real-negativa
    titulo: Una potencia compleja que cae sobre el eje negativo
    fuente: >-
      Ejercicio 1 · Segunda evaluación, 3 de diciembre de 2018 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3

    enunciado: |
      Hallar los valores de $a$ $\left(a \in \mathbb{R}\right)$ para que el
      número complejo $z = \left(2e^{2i}\right)^{a}$ sea un número real negativo
      tal que $1 < \left|z\right| < 2^{6}$.
    pide: Hallar los valores de $a$.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado impone **dos** condiciones. ¿Sobre qué actúa cada una?
        opciones:
          - texto: >-
              «Real negativo» fija el **argumento**; la desigualdad de módulos
              acota el **módulo**
            correcta: true
            mensaje: |
              Exacto, y por eso conviene trabajar en polar: las dos condiciones
              se separan limpiamente. El argumento da una familia infinita de
              candidatos y el módulo se queda con dos.
          - texto: Las dos actúan sobre el módulo
            mensaje: |
              Ser real negativo no dice nada del tamaño: $-1$ y $-1000$ son los
              dos reales negativos.
          - texto: Las dos actúan sobre el argumento
            mensaje: |
              La desigualdad $1<\left|z\right|<64$ es sobre el módulo, no sobre
              la dirección.
          - texto: >-
              La primera sobre la parte real y la segunda sobre la imaginaria
            mensaje: |
              Esa lectura obligaría a operar en binómica con un exponente real
              cualquiera, que es impracticable. En polar la potencia es
              inmediata.

      - tipo: calcular
        titulo: El módulo y el argumento
        pregunta: |
          ¿Cuál es el argumento de $z = \left(2e^{2i}\right)^{a}$, en función de
          $a$? Evalúalo para $a=3$.
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.01
          formato: un número en radianes
        distractores:
          - valor: '2'
            mensaje: |
              2 es el argumento de la **base**. Al elevar a la potencia $a$, el
              argumento se **multiplica** por $a$.
          - valor: '8'
            mensaje: |
              8 es $2^{3}$, el módulo de $z$ para $a=3$. El argumento es otra
              cosa.
          - valor: '9'
            mensaje: |
              9 saldría de $a^{2}$ o similar. La regla es
              $\arg\left(w^{a}\right) = a\arg w$.
        pista: |
          $\left(re^{i\theta}\right)^{a} = r^{a}e^{ia\theta}$.
        desarrollo: |
          La base ya está en polar: módulo 2, argumento 2.

          $$
          z = \left(2e^{2i}\right)^{a} = 2^{a}\,e^{2ai}
          $$

          $$
          \left|z\right| = 2^{a},
          \qquad
          \arg z = 2a
          $$

          Con $a=3$: $\arg z = 6$ radianes.

          **Al elevar, el módulo se eleva y el argumento se multiplica.** Es la
          regla que hace que este ejercicio sea de tres líneas en polar y de
          ninguna en binómica.
        veredicto: |
          Que la base venga ya escrita como $2e^{2i}$ es una pista del
          enunciado: está pidiendo que se trabaje en forma exponencial.

      - tipo: calcular
        titulo: El primer valor válido
        pregunta: |
          ¿Cuál es el menor valor de $a$ que cumple todo? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '1.5708'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '4.7124'
            mensaje: |
              $\frac{3\pi}{2}$ también vale, pero no es el **menor**: con $k=0$
              sale $\frac{\pi}{2}$.
          - valor: '3.1416'
            mensaje: |
              $\pi$ saldría de $2a=2\pi$, que da $z$ real **positivo**. Para
              negativo hace falta argumento $\pi$, es decir $2a=\pi$.
          - valor: '7.8540'
            mensaje: |
              $\frac{5\pi}{2}$ cumple lo del argumento, pero su módulo
              $2^{7,85} \approx 231$ se sale de la cota $2^{6} = 64$.
        pista: |
          Real negativo exige $2a = \pi+2k\pi$. Y el módulo exige $0<a<6$.
        desarrollo: |
          **Condición de argumento.** Un real negativo tiene argumento $\pi$
          módulo $2\pi$:

          $$
          2a = \pi+2k\pi
          \;\Longrightarrow\;
          a = \frac{\pi}{2}+k\pi = \frac{(2k+1)\pi}{2}
          $$

          **Condición de módulo.**

          $$
          1 < 2^{a} < 2^{6}
          \;\Longrightarrow\;
          2^{0} < 2^{a} < 2^{6}
          \;\Longrightarrow\;
          0 < a < 6
          $$

          —la exponencial de base 2 es creciente, así que se comparan los
          exponentes directamente—.

          **Cruzando las dos:**

          | $k$ | $a$ | ¿en $(0,6)$? |
          |---|---|---|
          | $-1$ | $-1{,}571$ | no |
          | $0$ | $1{,}5708$ | **sí** |
          | $1$ | $4{,}7124$ | **sí** |
          | $2$ | $7{,}854$ | no |

          El menor es $a = \frac{\pi}{2} \approx 1{,}5708$.
        veredicto: |
          Escribir la cota como $2^{0} < 2^{a} < 2^{6}$ evita tener que sacar
          logaritmos: basta comparar exponentes.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La potencia en polar:**
              $z = 2^{a}e^{2ai}$, con módulo $2^{a}$ y argumento $2a$.
          - texto: |
              **Real negativo** significa argumento $\pi$ módulo $2\pi$:
              $2a = \pi+2k\pi$, luego $a = \frac{(2k+1)\pi}{2}$.
          - texto: |
              **La cota del módulo**, escrita como potencias de 2:
              $2^{0}<2^{a}<2^{6}$, es decir $0<a<6$.
          - texto: |
              **Cruzar**: de la familia $\frac{(2k+1)\pi}{2}$ solo caen dentro
              las de $k=0$ y $k=1$.
          - texto: |
              $a = \frac{\pi}{2} \approx 1{,}571$ y
              $a = \frac{3\pi}{2} \approx 4{,}712$.
          - texto: |
              Como $a$ es real, la potencia tiene un único valor y no hay que
              preocuparse por la multivaluación.
            trampa: true
            mensaje: |
              Una potencia de exponente **real no entero** sí es multivaluada:
              $z = e^{a\ln w}$ y el logaritmo complejo tiene infinitos valores.
              Lo que pasa aquí es que el enunciado escribe la base ya en polar
              con un argumento concreto —$2e^{2i}$, no «un complejo de módulo 2
              y argumento 2 más vueltas»—, y eso fija la determinación. Es una
              simplificación del enunciado, no una propiedad general.
        veredicto: |
          Los dos valores dan módulos muy distintos, $2{,}97$ y $26{,}2$, y los
          dos caben en la horquilla. Comprobarlo cierra el ejercicio.

    resolucion: |
      **Datos.** $z = \left(2e^{2i}\right)^{a}$ con $a$ real, y se pide que sea
      real negativo con $1<\left|z\right|<64$.

      ### 1 · La potencia, en polar

      La base viene ya escrita en forma exponencial —módulo 2, argumento 2— y
      eso es una indicación del enunciado sobre cómo atacarlo.

      $$
      z = \left(2e^{2i}\right)^{a} = 2^{a}\,e^{2ai}
      $$

      $$
      \left|z\right| = 2^{a},
      \qquad
      \arg z = 2a
      $$

      **Al elevar, el módulo se eleva y el argumento se multiplica.** Las dos
      condiciones del enunciado actúan cada una sobre una de las dos cosas, así
      que se pueden tratar por separado.

      ### 2 · Condición de argumento

      Un número real **negativo** está sobre el semieje horizontal izquierdo:
      su argumento es $\pi$, salvo vueltas completas.

      $$
      2a = \pi+2k\pi, \qquad k\in\mathbb{Z}
      $$

      $$
      a = \frac{\pi}{2}+k\pi = \frac{(2k+1)\pi}{2}
      $$

      Es decir, $a$ tiene que ser un múltiplo **impar** de $\frac{\pi}{2}$.

      ### 3 · Condición de módulo

      $$
      1 < 2^{a} < 2^{6}
      $$

      Escribiendo el 1 como $2^{0}$ y usando que $2^{t}$ es estrictamente
      creciente, se comparan los exponentes sin necesidad de logaritmos:

      $$
      0 < a < 6
      $$

      ### 4 · Cruzar las dos

      | $k$ | $a = \frac{(2k+1)\pi}{2}$ | $\left|z\right| = 2^{a}$ | ¿vale? |
      |---|---|---|---|
      | $-1$ | $-1{,}571$ | $0{,}337$ | no, $a<0$ |
      | $0$ | $1{,}5708$ | $2{,}971$ | **sí** |
      | $1$ | $4{,}7124$ | $26{,}23$ | **sí** |
      | $2$ | $7{,}854$ | $231{,}4$ | no, $a>6$ |

      $$
      \boxed{a = \frac{\pi}{2} \approx 1{,}5708
      \qquad\text{y}\qquad
      a = \frac{3\pi}{2} \approx 4{,}7124}
      $$

      ### 5 · Comprobación

      **Del primero.**

      $$
      z = 2^{\pi/2}e^{i\pi} = -2{,}971
      $$

      Real ✔ negativo ✔ y $1<2{,}971<64$ ✔

      **Del segundo.**

      $$
      z = 2^{3\pi/2}e^{3i\pi} = 2^{4,712}\,e^{i\pi} = -26{,}23
      $$

      —porque $e^{3i\pi} = e^{i\pi} = -1$—. Real, negativo, y
      $1<26{,}23<64$ ✔

      **De que no hay más.** El siguiente candidato, $k=2$, da módulo $231$,
      muy por encima de 64; y el anterior, $k=-1$, da $a$ negativo, con módulo
      $0{,}337 < 1$. La horquilla $0<a<6$ tiene anchura 6, y los candidatos van
      de $\pi$ en $\pi \approx 3{,}14$: caben exactamente dos ✔

  - id: ex1819-2ev-2-lagrange-y-bolzano
    titulo: Dos teoremas para el mismo extremo
    fuente: >-
      Ejercicio 2 · Segunda evaluación, 3 de diciembre de 2018 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 6
      comp4: 4

    enunciado: |
      Sea la función $f(x) = e^{x}\left(x-1\right)-x+2$ ,
      $x \in [0,1]$.

      **a)** Enunciar el teorema de Lagrange (teorema del valor medio). Estudiar
      mediante este teorema la existencia de extremos locales de $f(x)$.

      **b)** Enunciar el teorema de Bolzano. Estudiar mediante este teorema la
      existencia de extremos locales de $f(x)$.
    pide: Enunciar los dos teoremas y estudiar los extremos con cada uno.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos apartados llegan a la misma conclusión. ¿Sobre qué función
          actúa cada teorema?
        opciones:
          - texto: >-
              Lagrange sobre **$f$**; Bolzano sobre **$f'$**
            correcta: true
            mensaje: |
              Exacto, y ahí está la gracia del ejercicio. Lagrange aplicado a
              $f$ da directamente un punto con $f'(c)=0$, porque los extremos
              valen lo mismo. Bolzano no habla de derivadas, así que hay que
              aplicárselo a $f'$ como si fuera una función cualquiera y buscarle
              un cero.
          - texto: Los dos sobre $f$
            mensaje: |
              Bolzano aplicado a $f$ daría un punto donde $f$ se anula, que no
              es lo que se busca — y además $f>0$ en todo el intervalo.
          - texto: Los dos sobre $f'$
            mensaje: |
              Lagrange sobre $f'$ hablaría de $f''$, que no hace falta.
          - texto: >-
              Lagrange sobre $f'$ y Bolzano sobre $f$
            mensaje: |
              Es justo al revés: Lagrange se aplica a $f$, porque los extremos
              valen lo mismo y el cociente da 0; Bolzano se aplica a $f'$,
              buscándole un cero entre dos valores de signo opuesto.

      - tipo: calcular
        titulo: Los valores en los extremos
        pregunta: |
          ¿Cuánto vale $f(1)$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2.7182818'
            mensaje: |
              $e$ saldría de $e^{1}$, pero va multiplicado por
              $(x-1) = 0$: ese término **se anula** en $x=1$.
          - valor: '0'
            mensaje: |
              0 es el valor del factor $(x-1)$ en $x=1$. Quedan todavía
              $-x+2 = 1$.
          - valor: '3'
            mensaje: |
              3 saldría de $e\cdot0+1+2$: hay que **restar** la $x$.
        pista: |
          En $x=1$ el factor $(x-1)$ se anula.
        desarrollo: |
          $$
          f(1) = e^{1}(1-1)-1+2 = 0-1+2 = 1
          $$

          $$
          f(0) = e^{0}(0-1)-0+2 = -1+2 = 1
          $$

          $$
          f(0) = f(1) = 1
          $$

          **Los dos extremos valen lo mismo.** Eso convierte el cociente
          incremental de Lagrange en cero, que es lo que hace funcionar el
          apartado (a).
        veredicto: |
          Con $f(a)=f(b)$, Lagrange se reduce a Rolle. El enunciado pide
          Lagrange, que es el general; mencionarlo es un punto de COMP4.

      - tipo: calcular
        titulo: La derivada en los extremos
        pregunta: |
          $f'(x) = xe^{x}-1$. ¿Cuánto vale $f'(1)$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '1.7183'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '-1'
            mensaje: |
              $-1$ es $f'(0)$, en el otro extremo. Y precisamente que los signos
              sean opuestos es lo que permite aplicar Bolzano.
          - valor: '2.7183'
            mensaje: |
              $e$ es $1\cdot e^{1}$: falta restar el 1.
          - valor: '0'
            mensaje: |
              0 es el valor que toma $f'$ en el punto interior que se está
              buscando, no en el extremo.
        pista: |
          Sustituye $x=1$ en $xe^{x}-1$.
        desarrollo: |
          Derivando $f(x) = e^{x}(x-1)-x+2$ con la regla del producto:

          $$
          f'(x) = e^{x}(x-1)+e^{x}\cdot1-1 = e^{x}\,x-1 = xe^{x}-1
          $$

          $$
          f'(0) = 0-1 = -1
          $$

          $$
          f'(1) = e-1 \approx 1{,}7183
          $$

          **Signos opuestos**: es lo que Bolzano necesita.
        veredicto: |
          La derivada se simplifica muchísimo —$xe^{x}-1$— porque los dos
          términos con $e^{x}$ se combinan. Conviene simplificar antes de
          seguir.

      - tipo: justificar
        pregunta: |
          Ordena los dos apartados. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **(a) Lagrange.** Si $f$ es continua en $[a,b]$ y derivable en
              $(a,b)$, existe $c\in(a,b)$ con
              $f'(c) = \frac{f(b)-f(a)}{b-a}$.
          - texto: |
              Aquí $f$ es continua y derivable —producto y suma de funciones que
              lo son— y $f(0)=f(1)=1$, así que el cociente vale **0** y existe
              $c\in(0,1)$ con $f'(c)=0$: hay un **punto crítico**.
          - texto: |
              **(b) Bolzano.** Si $g$ es continua en $[a,b]$ y $g(a)$, $g(b)$
              tienen signos opuestos, existe $c\in(a,b)$ con $g(c)=0$.
          - texto: |
              Se aplica a $g = f' = xe^{x}-1$, que es continua, con
              $f'(0) = -1 < 0$ y $f'(1) = e-1 > 0$. Existe $c$ con $f'(c)=0$:
              el mismo punto crítico, por otro camino.
          - texto: |
              **Y que es un mínimo** lo da el signo: $f'' = e^{x}(1+x) > 0$, así
              que $f'$ es **estrictamente creciente** y solo cruza el cero una
              vez, pasando de negativa a positiva.
          - texto: |
              Como los dos teoremas garantizan $f'(c)=0$, queda demostrado que
              en $c$ hay un extremo local.
            trampa: true
            mensaje: |
              $f'(c)=0$ es condición **necesaria**, no suficiente: podría ser un
              punto de inflexión, como le pasa a $x^{3}$ en el origen. Los dos
              teoremas dan el **punto crítico**; que sea extremo —y que sea
              mínimo— hay que argumentarlo aparte, con el signo de $f'$ a los
              dos lados o con $f''$.
        veredicto: |
          El enunciado dice «estudiar la existencia de extremos», no «de puntos
          críticos». La diferencia son los cuatro puntos de COMP4.

    resolucion: |
      **Datos.** $f(x) = e^{x}(x-1)-x+2$ en $[0,1]$.

      ### 1 · Preparar el terreno

      **Los valores en los extremos:**

      $$
      f(0) = e^{0}(-1)-0+2 = 1
      $$

      $$
      f(1) = e^{1}\cdot0-1+2 = 1
      $$

      $$
      f(0) = f(1) = 1
      $$

      **La derivada**, que se simplifica notablemente:

      $$
      f'(x) = e^{x}(x-1)+e^{x}-1 = e^{x}\left[(x-1)+1\right]-1 = xe^{x}-1
      $$

      $$
      f'(0) = -1, \qquad f'(1) = e-1 \approx 1{,}718
      $$

      **Continuidad y derivabilidad:** $f$ es suma y producto de una
      exponencial y polinomios, así que es de clase $C^{\infty}$ en
      $\mathbb{R}$. Las hipótesis de los dos teoremas se cumplen sin discusión,
      y hay que decirlo.

      ### 2 · Apartado (a): Lagrange

      > **Teorema de Lagrange.** Si $f$ es continua en $[a,b]$ y derivable en
      > $(a,b)$, existe al menos un $c\in(a,b)$ tal que
      >
      > $$
      > f'(c) = \frac{f(b)-f(a)}{b-a}
      > $$

      Aplicándolo en $[0,1]$:

      $$
      f'(c) = \frac{f(1)-f(0)}{1-0} = \frac{1-1}{1} = 0
      $$

      $$
      \boxed{\exists\, c \in (0,1) : f'(c) = 0}
      $$

      Como $f(0)=f(1)$, esto es en realidad **Rolle** — el caso particular de
      Lagrange con extremos iguales. Vale la pena señalarlo.

      ### 3 · Apartado (b): Bolzano

      > **Teorema de Bolzano.** Si $g$ es continua en $[a,b]$ y $g(a)$ y $g(b)$
      > tienen signos opuestos, existe al menos un $c\in(a,b)$ tal que
      > $g(c)=0$.

      Bolzano no habla de derivadas, así que **se aplica a $f'$** tratándola
      como una función cualquiera:

      $$
      g(x) = f'(x) = xe^{x}-1
      $$

      Es continua en $[0,1]$ —producto y suma de continuas— y

      $$
      g(0) = -1 < 0,
      \qquad
      g(1) = e-1 > 0
      $$

      Signos opuestos, luego

      $$
      \boxed{\exists\, c \in (0,1) : f'(c) = 0}
      $$

      **La misma conclusión por otro camino.** Y ese es el sentido del
      ejercicio: dos herramientas distintas que se encuentran en el mismo sitio.

      ### 4 · Pero eso todavía no son extremos

      Los dos teoremas dan un **punto crítico**, no un extremo. Que $f'(c)=0$ es
      condición **necesaria**, no suficiente: $x^{3}$ tiene derivada nula en 0 y
      allí no hay extremo.

      Para cerrarlo hace falta el signo de $f'$:

      $$
      f''(x) = e^{x}+xe^{x} = e^{x}(1+x)
      $$

      En $[0,1]$ los dos factores son positivos, luego $f''>0$ y **$f'$ es
      estrictamente creciente**. Una función estrictamente creciente cruza el
      cero **una sola vez**, y lo hace pasando de negativa a positiva.

      | tramo | $f'$ | $f$ |
      |---|---|---|
      | $(0,c)$ | $<0$ | decrece |
      | $(c,1)$ | $>0$ | crece |

      $$
      \boxed{\text{En } c \text{ hay un MÍNIMO local, y es el único extremo
      interior}}
      $$

      ### 5 · Dónde está y cuánto vale

      El enunciado no lo pide, pero cierra el cuadro. La ecuación

      $$
      ce^{c} = 1
      $$

      no tiene solución en forma elemental —es la constante omega—, pero
      numéricamente

      $$
      c \approx 0{,}5671,
      \qquad
      f(c) \approx 0{,}6696
      $$

      ### 6 · Comprobación

      **Que es mínimo, numéricamente:**

      | $x$ | $f(x)$ |
      |---|---|
      | $0$ | $1$ |
      | $0{,}3$ | $0{,}755$ |
      | $0{,}5671$ | $\mathbf{0{,}6696}$ |
      | $0{,}8$ | $0{,}755$ |
      | $1$ | $1$ |

      El del punto crítico es el menor ✔ Y la simetría aproximada de los valores
      a los lados confirma que está cerca del centro.

      **Que $f'$ solo se anula una vez.** $f'(x) = xe^{x}-1$ es estrictamente
      creciente en $[0,1]$ porque $f''>0$, y va de $-1$ a $1{,}718$: cruza el
      cero exactamente una vez ✔

      **De coherencia entre apartados.** Lagrange dio $f'(c)=0$ usando que
      $f(0)=f(1)$; Bolzano lo dio usando que $f'(0)$ y $f'(1)$ tienen signos
      opuestos. Y las dos cosas son consistentes: si $f$ empieza y acaba igual
      pero baja en medio, su derivada tiene que cambiar de signo ✔

  - id: ex1819-2ev-3-serie-de-potencias
    titulo: Resolver una ecuación diferencial con una serie
    fuente: >-
      Ejercicio 3 · Segunda evaluación, 3 de diciembre de 2018 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3

    enunciado: |
      Sea $y(x)$ una función tal que $y'(x) = y(x)+e^{x}$ e $y(0) = 0$.
      Calcular el desarrollo en serie de $y(x)$ en $a=0$. Utilizar este
      desarrollo para deducir cuál es la función $y(x)$.
    pide: Calcular el desarrollo y deducir la función.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se obtienen las derivadas sucesivas en 0 sin conocer $y$?
        opciones:
          - texto: >-
              **Derivando la propia ecuación** y evaluando en 0 cada vez
            correcta: true
            mensaje: |
              Exacto. La ecuación da $y'$ en función de $y$; derivándola se
              obtiene $y''$ en función de $y'$, y así sucesivamente. Con el dato
              $y(0)=0$ la cadena arranca y cada derivada sale de la anterior.
          - texto: >-
              Integrando la ecuación diferencial primero
            mensaje: |
              Eso resolvería el problema por otra vía —y es legítimo— pero el
              enunciado pide el desarrollo en serie, y la gracia está en
              deducir la función **desde** él.
          - texto: >-
              Suponiendo que $y$ es un polinomio
            mensaje: |
              No lo es: la solución resulta ser $xe^{x}$, que tiene infinitos
              términos.
          - texto: >-
              Hace falta conocer $y'(0)$ como dato adicional
            mensaje: |
              No hace falta: la propia ecuación lo da.
              $y'(0) = y(0)+e^{0} = 0+1 = 1$.

      - tipo: calcular
        titulo: Las primeras derivadas
        pregunta: |
          ¿Cuánto vale $y'''(0)$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es $y'(0)$, la primera. Cada derivada suma 1 a la anterior:
              1, 2, 3, 4…
          - valor: '2'
            mensaje: |
              2 es $y''(0)$. Falta un escalón.
          - valor: '6'
            mensaje: |
              6 es $3!$, el factorial que aparece al montar el coeficiente. La
              derivada vale 3.
        pista: |
          Deriva la ecuación repetidamente: $y'' = y'+e^{x}$,
          $y''' = y''+e^{x}$…
        desarrollo: |
          De la ecuación y el dato inicial:

          $$
          y(0) = 0
          $$

          $$
          y'(0) = y(0)+e^{0} = 0+1 = 1
          $$

          Derivando la ecuación:

          $$
          y'' = y'+e^{x}
          \;\Longrightarrow\;
          y''(0) = 1+1 = 2
          $$

          $$
          y''' = y''+e^{x}
          \;\Longrightarrow\;
          y'''(0) = 2+1 = 3
          $$

          $$
          y^{(4)}(0) = 3+1 = 4
          $$

          **El patrón es inmediato:** cada derivada suma 1 a la anterior, así
          que $y^{(n)}(0) = n$.
        veredicto: |
          Que el término $e^{x}$ valga 1 en el origen **cada vez** es lo que
          produce la progresión aritmética. Con otro término independiente el
          patrón sería otro.

      - tipo: calcular
        titulo: El coeficiente general
        pregunta: |
          El coeficiente de $x^{n}$ en el desarrollo es $\frac{1}{k!}$. ¿Cuánto
          vale $k$ en función de $n$? Evalúalo para $n=5$.
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.1
          formato: un número
        distractores:
          - valor: '5'
            mensaje: |
              El coeficiente es $\frac{y^{(n)}(0)}{n!} = \frac{n}{n!}$, y
              $\frac{n}{n!} = \frac{1}{(n-1)!}$: el factorial baja un escalón.
          - valor: '6'
            mensaje: |
              $n+1$ iría en la dirección contraria. El $n$ del numerador
              **cancela** un factor del factorial.
          - valor: '120'
            mensaje: |
              120 es $5!$, no el $k$ que se pide.
        pista: |
          $\frac{y^{(n)}(0)}{n!} = \frac{n}{n!}$, y $n! = n\cdot(n-1)!$.
        desarrollo: |
          El coeficiente de $x^{n}$ en un desarrollo de Maclaurin es

          $$
          \frac{y^{(n)}(0)}{n!} = \frac{n}{n!}
          $$

          Y como $n! = n\cdot(n-1)!$:

          $$
          \frac{n}{n!} = \frac{n}{n\cdot(n-1)!} = \frac{1}{(n-1)!}
          $$

          Luego $k = n-1$, y para $n=5$ vale $4$.

          $$
          y(x) = \sum_{n\ge1}\frac{x^{n}}{(n-1)!}
          $$
        veredicto: |
          Esa cancelación es la clave del ejercicio: convierte una serie de
          aspecto raro en la exponencial disfrazada.

      - tipo: justificar
        pregunta: |
          Ordena la deducción de la función. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Las derivadas en 0** salen de derivar la ecuación repetidamente:
              $y^{(n)}(0) = n$ para todo $n\ge1$, y $y(0)=0$.
          - texto: |
              **El desarrollo:**
              $y(x) = \sum_{n\ge1}\frac{n}{n!}x^{n}
              = \sum_{n\ge1}\frac{x^{n}}{(n-1)!}$.
          - texto: |
              **Sacar factor común $x$:**
              $y(x) = x\sum_{n\ge1}\frac{x^{n-1}}{(n-1)!}$.
          - texto: |
              **Cambiar el índice** con $m = n-1$:
              $y(x) = x\sum_{m\ge0}\frac{x^{m}}{m!}$.
          - texto: |
              Y esa suma **es** la serie de la exponencial, así que
              $y(x) = xe^{x}$.
          - texto: |
              El desarrollo empieza en $n=1$ porque el término de grado 0 es
              $\frac{0}{0!}$, que no está definido.
            trampa: true
            mensaje: |
              $\frac{0}{0!} = \frac{0}{1} = 0$ está perfectamente definido: vale
              cero. El desarrollo empieza en $n=1$ porque el término de grado 0
              **es nulo**, que es $y(0)=0$, no porque haya nada indefinido. La
              diferencia importa: si $0!$ diera problemas, el cambio de índice
              del paso anterior tampoco valdría.
        veredicto: |
          Reconocer la serie de $e^{x}$ tras el cambio de índice es lo que el
          enunciado llama «deducir cuál es la función». Sin ese último paso el
          ejercicio queda a medias.

    resolucion: |
      **Datos.** $y' = y+e^{x}$ con $y(0)=0$. Se pide el desarrollo en serie en
      $a=0$ y, a partir de él, la función.

      ### 1 · Las derivadas salen de la propia ecuación

      No hace falta resolver la ecuación diferencial: **la ecuación misma da las
      derivadas**, una a una, evaluando en 0.

      $$
      y(0) = 0 \qquad \text{(dato)}
      $$

      $$
      y'(0) = y(0)+e^{0} = 0+1 = 1
      $$

      Derivando la ecuación:

      $$
      y'' = y'+e^{x}
      \;\Longrightarrow\;
      y''(0) = 1+1 = 2
      $$

      $$
      y''' = y''+e^{x}
      \;\Longrightarrow\;
      y'''(0) = 2+1 = 3
      $$

      $$
      y^{(4)}(0) = 3+1 = 4
      $$

      **Patrón:**

      $$
      y^{(n)}(0) = n \qquad \forall n\ge1
      $$

      Cada derivada suma 1 a la anterior, porque el término $e^{x}$ vale
      siempre 1 en el origen.

      ### 2 · El desarrollo

      $$
      y(x) = \sum_{n\ge0}\frac{y^{(n)}(0)}{n!}x^{n}
      = \underbrace{0}_{n=0}+\sum_{n\ge1}\frac{n}{n!}x^{n}
      $$

      Y simplificando el coeficiente, que es donde está la gracia:

      $$
      \frac{n}{n!} = \frac{n}{n\cdot(n-1)!} = \frac{1}{(n-1)!}
      $$

      $$
      \boxed{y(x) = \sum_{n\ge1}\frac{x^{n}}{(n-1)!}
      = x+x^{2}+\frac{x^{3}}{2}+\frac{x^{4}}{6}+\cdots}
      $$

      ### 3 · Deducir la función

      Sacando factor común $x$:

      $$
      y(x) = x\sum_{n\ge1}\frac{x^{n-1}}{(n-1)!}
      $$

      Y con el cambio de índice $m = n-1$, que hace que la suma empiece en 0:

      $$
      y(x) = x\sum_{m\ge0}\frac{x^{m}}{m!}
      $$

      Esa suma es **exactamente** la serie de la exponencial:

      $$
      \sum_{m\ge0}\frac{x^{m}}{m!} = e^{x}
      $$

      $$
      \boxed{y(x) = x\,e^{x}}
      $$

      ### 4 · Comprobación

      **Que cumple la ecuación:**

      $$
      y' = e^{x}+xe^{x} = e^{x}(1+x)
      $$

      $$
      y+e^{x} = xe^{x}+e^{x} = e^{x}(1+x)
      $$

      Iguales ✔

      **Que cumple la condición inicial:** $y(0) = 0\cdot1 = 0$ ✔

      **Que el desarrollo coincide.** Multiplicando la serie de $e^{x}$ por $x$:

      $$
      x\left(1+x+\frac{x^{2}}{2}+\frac{x^{3}}{6}+\cdots\right)
      = x+x^{2}+\frac{x^{3}}{2}+\frac{x^{4}}{6}+\cdots
      $$

      que son los términos obtenidos ✔

      **Numéricamente**, en $x=0{,}5$:

      $$
      y(0{,}5) = 0{,}5\,e^{0,5} = 0{,}8244
      $$

      y sumando los cuatro primeros términos del desarrollo:

      $$
      0{,}5+0{,}25+0{,}0625+0{,}0104 = 0{,}8229
      $$

      La diferencia es $1{,}5\cdot10^{-3}$, del orden del siguiente término
      $\frac{x^{5}}{24} = 1{,}3\cdot10^{-3}$ ✔

      ### 5 · Por qué el método funciona

      Es un caso de **serie de potencias como método de resolución**: en vez de
      integrar la ecuación, se construye la solución coeficiente a coeficiente.

      Sirve especialmente cuando la ecuación no tiene solución elemental —y
      entonces la serie **es** la respuesta—. Aquí sí la tiene, y por eso el
      enunciado puede pedir «deducir cuál es la función»: la serie se reconoce.

  - id: ex1819-2ev-4-alambre-circulo-y-cuadrado
    titulo: Diez metros de alambre entre un círculo y un cuadrado
    fuente: >-
      Ejercicio 4 · Segunda evaluación, 3 de diciembre de 2018 · Cálculo,
      UPV/EHU · Variante del ejercicio 4 de 2023-2024, que reparte el mismo
      alambre entre un cuadrado y un triángulo · El examen no publica solución:
      la resolución es propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 8
      comp4: 1

    enunciado: |
      Un alambre de 10 m de longitud se corta en dos partes. Con una de ellas se
      forma un círculo y con la otra un cuadrado. ¿Cómo debe cortarse el alambre
      para que la suma de las áreas de las dos figuras sea mínima?
    pide: Calcular dónde hay que cortar el alambre.

    pasos:
      - tipo: reconocer
        pregunta: |
          Llamando $x$ a la parte del círculo, ¿cuál es su área?
        opciones:
          - texto: >-
              $\dfrac{x^{2}}{4\pi}$, porque el **radio** es
              $\dfrac{x}{2\pi}$
            correcta: true
            mensaje: |
              Eso es. $x$ es la **longitud de la circunferencia**, no el radio:
              de $2\pi r = x$ sale $r = \frac{x}{2\pi}$, y el área
              $\pi r^{2} = \frac{x^{2}}{4\pi}$. Confundir perímetro con radio es
              el error que arruina el ejercicio.
          - texto: $\pi x^{2}$
            mensaje: |
              Eso sería si $x$ fuera el radio. Pero $x$ es el trozo de alambre,
              es decir la circunferencia.
          - texto: $\dfrac{x^{2}}{2\pi}$
            mensaje: |
              Falta un 2. $\pi\left(\frac{x}{2\pi}\right)^{2}
              = \frac{\pi x^{2}}{4\pi^{2}} = \frac{x^{2}}{4\pi}$.
          - texto: $\dfrac{x}{2\pi}$
            mensaje: |
              $\frac{x}{2\pi}$ es el **radio**, no el área.

      - tipo: calcular
        titulo: Dónde cortar
        pregunta: |
          ¿Cuántos metros hay que dedicar al círculo? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '4.3990'
          tolerancia: 0.005
          formato: un número en metros
        distractores:
          - valor: '5.6010'
            mensaje: |
              $5{,}60$ es lo que le toca al **cuadrado**. La pregunta es por el
              círculo, que recibe menos.
          - valor: '5'
            mensaje: |
              5 sería partir el alambre por la mitad. No es el óptimo: el
              círculo aprovecha mejor el material, así que para **minimizar**
              conviene darle menos.
          - valor: '4.3496'
            mensaje: |
              $4{,}3496$ es la respuesta del ejercicio de 2023-2024, donde el
              alambre se reparte entre un cuadrado y un **triángulo**. Los
              números se parecen pero no son los mismos.
        pista: |
          $A(x) = \frac{x^{2}}{4\pi}+\frac{(10-x)^{2}}{16}$. Deriva e iguala a
          cero.
        desarrollo: |
          $$
          A(x) = \frac{x^{2}}{4\pi}+\frac{(10-x)^{2}}{16},
          \qquad 0 \le x \le 10
          $$

          $$
          A'(x) = \frac{x}{2\pi}-\frac{10-x}{8} = 0
          $$

          Multiplicando por $8\pi$:

          $$
          4x = \pi(10-x)
          \;\Longrightarrow\;
          4x+\pi x = 10\pi
          $$

          $$
          x = \frac{10\pi}{4+\pi} \approx \frac{31{,}416}{7{,}1416}
          = 4{,}3990 \ \text{m}
          $$
        veredicto: |
          Al cuadrado le tocan $5{,}60$ m, **más de la mitad**. Es lo contrario
          de lo que pasaría si se quisiera maximizar.

      - tipo: calcular
        titulo: El área mínima
        pregunta: |
          ¿Cuánto vale la suma mínima de áreas? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '3.5006'
          tolerancia: 0.005
          formato: un número en metros cuadrados
        distractores:
          - valor: '6.25'
            mensaje: |
              $6{,}25$ es el área si todo el alambre va al **cuadrado**, es
              decir $A(0)$. Es uno de los extremos, no el mínimo.
          - valor: '7.9577'
            mensaje: |
              $7{,}96$ es $A(10)$: todo al círculo. Es el **máximo** del
              intervalo, no el mínimo.
          - valor: '1.5399'
            mensaje: |
              $1{,}54$ es solo el área del **círculo** en el óptimo. Falta
              sumarle la del cuadrado, que es $1{,}96$.
        pista: |
          Evalúa $A$ en $x = 4{,}3990$.
        desarrollo: |
          Con $x = 4{,}3990$ y $10-x = 5{,}6010$:

          $$
          A_{\text{círculo}} = \frac{4{,}3990^{2}}{4\pi}
          = \frac{19{,}351}{12{,}566} = 1{,}5399
          $$

          $$
          A_{\text{cuadrado}} = \frac{5{,}6010^{2}}{16}
          = \frac{31{,}371}{16} = 1{,}9607
          $$

          $$
          A_{\min} = 1{,}5399+1{,}9607 = 3{,}5006 \ \text{m}^{2}
          $$
        veredicto: |
          El mínimo, $3{,}50$, es **poco más de la mitad** del mejor de los dos
          casos extremos, que es $6{,}25$. Repartir compensa mucho.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La variable.** $x$ es la parte del círculo, $10-x$ la del
              cuadrado, con $0\le x\le10$.
          - texto: |
              **Los radios y lados, que no son los trozos:** el radio es
              $\frac{x}{2\pi}$ y el lado $\frac{10-x}{4}$.
          - texto: |
              **La función objetivo:**
              $A(x) = \frac{x^{2}}{4\pi}+\frac{(10-x)^{2}}{16}$.
          - texto: |
              **Derivar e igualar:**
              $\frac{x}{2\pi} = \frac{10-x}{8}$, de donde
              $x = \frac{10\pi}{4+\pi} \approx 4{,}40$ m.
          - texto: |
              **Justificar:** $A''(x) = \frac{1}{2\pi}+\frac18 > 0$ constante,
              así que $A$ es una parábola **convexa** y el punto crítico es
              mínimo absoluto. No hace falta mirar los extremos.
          - texto: |
              Al círculo le toca menos alambre porque es la figura que menos
              área encierra para un perímetro dado.
            trampa: true
            mensaje: |
              Es al revés: el círculo es la figura que **más** área encierra
              para un perímetro dado — es la desigualdad isoperimétrica. Y
              precisamente por eso recibe **menos**: como aquí se quiere
              **minimizar** el área total, conviene dar más material a la figura
              menos eficiente, que es el cuadrado.
        veredicto: |
          En el ejercicio de 2023-2024 el reparto era entre cuadrado y
          triángulo, y el triángulo —el menos eficiente de los dos— recibía más.
          Misma lógica, distinto par de figuras.

    resolucion: |
      **Datos.** Alambre de 10 m repartido entre un círculo y un cuadrado; se
      pide minimizar la suma de áreas.

      > Es la **variante** del ejercicio 4 de 2023-2024, donde el reparto era
      > entre un cuadrado y un triángulo equilátero. Mismo esquema, otro par de
      > figuras — y conviene resolverlos juntos.

      ### 1 · Plantear

      Sea $x$ la longitud destinada al **círculo**. Al cuadrado le quedan
      $10-x$, con $0\le x\le10$.

      **El error a evitar:** $x$ es el **perímetro**, no el radio ni el lado.

      | figura | perímetro | dimensión | área |
      |---|---|---|---|
      | círculo | $x$ | $r = \dfrac{x}{2\pi}$ | $\pi r^{2} = \dfrac{x^{2}}{4\pi}$ |
      | cuadrado | $10-x$ | $\ell = \dfrac{10-x}{4}$ | $\dfrac{(10-x)^{2}}{16}$ |

      $$
      A(x) = \frac{x^{2}}{4\pi}+\frac{(10-x)^{2}}{16}
      $$

      ### 2 · Optimizar

      $$
      A'(x) = \frac{2x}{4\pi}-\frac{2(10-x)}{16}
      = \frac{x}{2\pi}-\frac{10-x}{8}
      $$

      Igualando a cero y multiplicando por $8\pi$:

      $$
      4x = \pi\left(10-x\right)
      \;\Longrightarrow\;
      x\left(4+\pi\right) = 10\pi
      $$

      $$
      \boxed{x = \frac{10\pi}{4+\pi} \approx 4{,}3990 \ \text{m}
      \ \text{para el círculo}}
      $$

      $$
      10-x = \frac{40}{4+\pi} \approx 5{,}6010 \ \text{m}
      \ \text{para el cuadrado}
      $$

      **Que es mínimo:**

      $$
      A''(x) = \frac{1}{2\pi}+\frac18 > 0
      $$

      constante y positiva: $A$ es una **parábola convexa**, y su mínimo
      absoluto está en el vértice. No hace falta discutir los extremos del
      intervalo.

      ### 3 · Cuánto vale

      $$
      A_{\min} = \frac{4{,}399^{2}}{4\pi}+\frac{5{,}601^{2}}{16}
      = 1{,}5399+1{,}9607
      $$

      $$
      \boxed{A_{\min} \approx 3{,}5006 \ \text{m}^{2}}
      $$

      ### 4 · Por qué al círculo le toca menos

      Para un mismo perímetro $p$:

      | figura | área |
      |---|---|
      | círculo | $\dfrac{p^{2}}{4\pi} = 0{,}0796\,p^{2}$ |
      | cuadrado | $\dfrac{p^{2}}{16} = 0{,}0625\,p^{2}$ |

      **El círculo es más eficiente**: encierra un 27 % más de área con el mismo
      alambre. Es la desigualdad isoperimétrica, y el círculo la gana frente a
      cualquier otra figura.

      Y como aquí se quiere **minimizar**, conviene darle **menos** material a
      la figura más eficiente. Por eso $4{,}40 < 5{,}60$.

      Si el problema pidiera el máximo, la respuesta sería dárselo todo al
      círculo.

      ### 5 · Comprobación

      **Numérica:**

      | $x$ | $A(x)$ |
      |---|---|
      | $0$ (todo cuadrado) | $6{,}250$ |
      | $3$ | $3{,}783$ |
      | $4{,}399$ | $\mathbf{3{,}501}$ |
      | $6$ | $3{,}865$ |
      | $10$ (todo círculo) | $7{,}958$ |

      El del punto crítico es el menor ✔ Y el mayor está en $x=10$, coherente
      con que el círculo sea la figura más eficiente.

      **Comparando con el ejercicio de 2023-2024**, donde el reparto era
      cuadrado + triángulo:

      | | figura menos eficiente | recibe | área mínima |
      |---|---|---|---|
      | 2018-2019 | cuadrado | $5{,}60$ m | $3{,}50$ m² |
      | 2023-2024 | triángulo | $5{,}65$ m | $2{,}72$ m² |

      En los dos, la figura menos eficiente se lleva algo más de la mitad ✔ Y el
      mínimo es más bajo en 2023-2024 porque el triángulo es todavía peor que el
      cuadrado, así que el par entero encierra menos.
