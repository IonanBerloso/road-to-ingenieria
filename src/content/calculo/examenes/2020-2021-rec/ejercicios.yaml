ejercicios:
  - id: ex2021-rec-1-tres-raices-que-forman-un-triangulo
    titulo: Tres raíces, y el triángulo que dibujan
    fuente: >-
      Ejercicio 1 · Cuarta evaluación, PRIMER CUATRIMESTRAL, 22 de febrero de
      2021 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Las raíces de la ecuación $4z^{3} + 4z^{2} + (1-2i)z = 0$ forman un
      triángulo. Calcular dichas raíces y el perímetro y el área del triángulo.
    pide: Las tres raíces, el perímetro y el área.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los tres términos llevan $z$. ¿Cuál es el primer paso?
        opciones:
          - texto: >-
              Sacar $z$ factor común: $z\left(4z^{2}+4z+1-2i\right) = 0$
            correcta: true
            mensaje: |
              Exacto, y con eso $z=0$ ya es una raíz —la primera— y queda una
              ecuación de segundo grado para las otras dos. Es lo que convierte
              un problema de tercer grado en uno de segundo.
          - texto: >-
              Aplicar la fórmula general de las cúbicas
            mensaje: |
              Existe, pero es larguísima y aquí no hace falta: el término
              independiente es cero, así que $z=0$ es raíz y el polinomio se
              factoriza a ojo.
          - texto: >-
              Dividir todo entre $z$ para bajar el grado
            mensaje: |
              Ese es el error que cuesta una raíz: dividir entre $z$ supone
              $z\ne 0$, y $z=0$ **es** una de las tres raíces — sin ella no
              hay triángulo, solo un segmento.
          - texto: >-
              Separar en parte real e imaginaria y resolver el sistema
            mensaje: |
              Se puede, pero salen dos ecuaciones cúbicas reales acopladas.
              Factorizar y aplicar la fórmula de segundo grado con
              coeficientes complejos es mucho más corto.

      - tipo: calcular
        titulo: La raíz cuadrada que aparece en el discriminante
        pregunta: |
          El discriminante de $4z^{2}+4z+(1-2i)$ es $32i$. ¿Cuál es su raíz
          cuadrada con parte real positiva? Escribe solo la parte real.
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '5.6569'
            mensaje: |
              $\sqrt{32}$: has sacado la raíz del módulo y te has olvidado del
              argumento. El módulo de la raíz es $\sqrt{32}=4\sqrt2$, pero
              luego hay que repartirlo entre las dos componentes con el ángulo
              $\pi/4$.
          - valor: '0'
            mensaje: |
              Con parte real 0 la raíz sería imaginaria pura, y su cuadrado
              saldría **real negativo**, no $32i$. El argumento de $32i$ es
              $\pi/2$, así que el de su raíz es $\pi/4$: las dos componentes
              son iguales y positivas.
          - valor: '16'
            mensaje: |
              16 es la mitad de 32, no su raíz. Y ojo: en complejos la raíz no
              se calcula sobre el número «a trozos», se calcula sobre el módulo
              y el argumento.
        pista: |
          $32i = 32\,e^{i\pi/2}$. Su raíz tiene módulo $\sqrt{32} = 4\sqrt2$ y
          argumento $\pi/4$, así que las dos componentes son iguales.
        desarrollo: |
          $$
          \sqrt{32i} = \sqrt{32}\,e^{i\pi/4}
          = 4\sqrt2\left(\frac{\sqrt2}{2} + i\frac{\sqrt2}{2}\right)
          = 4 + 4i
          $$

          Comprobación, que aquí cuesta una línea:
          $(4+4i)^{2} = 16 + 32i - 16 = 32i$ ✓

      - tipo: calcular
        titulo: El área del triángulo
        pregunta: |
          Con las tres raíces ya calculadas, ¿cuánto vale el área del triángulo?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              Te has quedado con el producto de los dos catetos sin dividir
              entre 2, o has olvidado el $\frac12$ de la fórmula del área.
          - valor: '3.0322'
            mensaje: |
              Ese es el perímetro, no el área. El perímetro suma longitudes; el
              área es una superficie.
          - valor: '0.125'
            mensaje: |
              Has dividido entre 2 una vez de más. Con base $\frac12$ y altura
              1, el área es $\frac12\cdot\frac12\cdot 1 = \frac14$.
        pista: |
          Las raíces son $0$, $\frac{i}{2}$ y $-1-\frac{i}{2}$. Toma como base
          el segmento del eje imaginario, de $0$ a $\frac{i}{2}$: mide
          $\frac12$. La altura es la distancia horizontal del tercer vértice.
        desarrollo: |
          Los tres vértices, en el plano:

          $$
          A = (0,0), \qquad B = \left(0,\tfrac12\right), \qquad C = \left(-1,-\tfrac12\right)
          $$

          El lado $AB$ está sobre el eje imaginario y mide $\frac12$. La altura
          desde $C$ hasta esa recta es su distancia al eje, o sea
          $|-1| = 1$. Por tanto

          $$
          \text{Área} = \frac12 \cdot \frac12 \cdot 1 = \frac14
          $$

          Con la fórmula del determinante sale lo mismo:

          $$
          \text{Área} = \frac12\left|x_{B}y_{C} - x_{C}y_{B}\right|
          = \frac12\left|0\cdot\left(-\tfrac12\right) - (-1)\cdot\tfrac12\right|
          = \frac12\cdot\frac12 = \frac14
          $$

      - tipo: justificar
        titulo: El razonamiento completo
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El término independiente es cero, así que $z$ es factor común:
              $z\left(4z^{2}+4z+1-2i\right)=0$, y $z=0$ es la primera raíz.
          - texto: >-
              Para el paréntesis, la fórmula de segundo grado con coeficientes
              complejos:
              $z = \frac{-4\pm\sqrt{16-16(1-2i)}}{8} = \frac{-4\pm\sqrt{32i}}{8}$.
          - texto: >-
              $\sqrt{32i} = 4+4i$, porque $32i$ tiene módulo 32 y argumento
              $\frac\pi2$, luego su raíz tiene módulo $4\sqrt2$ y argumento
              $\frac\pi4$.
          - texto: >-
              Las otras dos raíces son $\frac{0+4i}{8} = \frac{i}{2}$ y
              $\frac{-8-4i}{8} = -1-\frac{i}{2}$.
          - texto: >-
              Los lados miden $\frac12$, $\frac{\sqrt5}{2}$ y $\sqrt2$, así que
              el perímetro es $\frac12+\frac{\sqrt5}{2}+\sqrt2 \approx 3{,}032$,
              y el área vale $\frac14$.
          - texto: >-
              Como los coeficientes son complejos, las raíces no reales van por
              pares conjugados, así que basta calcular una.
            trampa: true
            mensaje: |
              Los pares conjugados aparecen cuando **todos** los coeficientes
              son reales, y aquí uno vale $1-2i$. Se comprueba en el
              resultado: $\frac{i}{2}$ está entre las raíces y su conjugado
              $-\frac{i}{2}$ no. Si el par conjugado se cumpliera, el triángulo
              sería simétrico respecto del eje real, y no lo es.

    resolucion: |
      ## Las raíces

      El término independiente es cero, así que $z$ sale factor común:

      $$
      4z^{3}+4z^{2}+(1-2i)z = z\left(4z^{2}+4z+1-2i\right) = 0
      $$

      **Primera raíz: $z_{1}=0$.** Y hay que sacarla así, no dividiendo entre
      $z$: dividir supone $z\ne 0$ y se pierde precisamente esta.

      Para las otras dos, la fórmula de segundo grado —que vale igual con
      coeficientes complejos:

      $$
      z = \frac{-4 \pm \sqrt{16 - 16(1-2i)}}{8}
      = \frac{-4 \pm \sqrt{32i}}{8}
      $$

      La raíz cuadrada se hace en polar: $32i = 32\,e^{i\pi/2}$, luego

      $$
      \sqrt{32i} = 4\sqrt2\,e^{i\pi/4} = 4+4i
      $$

      —y se comprueba al instante: $(4+4i)^{2} = 32i$. Con eso:

      $$
      z_{2} = \frac{-4+4+4i}{8} = \frac{i}{2},
      \qquad
      z_{3} = \frac{-4-4-4i}{8} = -1-\frac{i}{2}
      $$

      ## El triángulo

      Los afijos son $A=(0,0)$, $B=\left(0,\frac12\right)$ y
      $C=\left(-1,-\frac12\right)$.

      | lado | longitud |
      |---|---|
      | $AB$ | $\frac12$ |
      | $AC$ | $\sqrt{1+\frac14} = \frac{\sqrt5}{2}$ |
      | $BC$ | $\sqrt{1+1} = \sqrt2$ |

      $$
      \text{Perímetro} = \frac12+\frac{\sqrt5}{2}+\sqrt2 \approx 3{,}032
      $$

      Para el área, lo más rápido es apoyarse en que $A$ y $B$ están los dos
      sobre el eje imaginario: ese lado es la base, mide $\frac12$, y la altura
      es la distancia horizontal de $C$ al eje, que vale 1.

      $$
      \text{Área} = \frac12\cdot\frac12\cdot 1 = \boxed{\frac14}
      $$

      ## Dos comprobaciones que valen los dos puntos de COMP4

      **Suma y producto.** Para $4z^{2}+4z+(1-2i)$, la suma de las raíces debe
      ser $-\frac44 = -1$ y su producto $\frac{1-2i}{4}$. En efecto:

      $$
      \frac{i}{2} + \left(-1-\frac{i}{2}\right) = -1 \quad\checkmark
      $$
      $$
      \frac{i}{2}\left(-1-\frac{i}{2}\right) = -\frac{i}{2}+\frac14
      = \frac{1-2i}{4} \quad\checkmark
      $$

      **No hay pares conjugados**, y conviene decirlo porque es el reflejo
      automático que aquí falla: los coeficientes no son todos reales
      —aparece $1-2i$—, así que nada obliga a que las raíces vengan
      emparejadas. Y de hecho no vienen: $\frac{i}{2}$ está y $-\frac{i}{2}$
      no.

  - id: ex2021-rec-2-la-ecuacion-que-se-desarma-sola
    titulo: Una ecuación que parece difícil hasta que se lee Euler
    fuente: >-
      Ejercicio 2 · Cuarta evaluación, PRIMER CUATRIMESTRAL, 22 de febrero de
      2021 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Resolver la ecuación $e^{iz} - i\operatorname{sen} z = 1$, con
      $z \in \mathbb{C}$, y representar gráficamente la solución obtenida.
    pide: Las soluciones y su representación.

    pasos:
      - tipo: reconocer
        pregunta: |
          Mira los dos primeros términos juntos. ¿Qué se puede hacer antes de
          calcular nada?
        opciones:
          - texto: >-
              Usar Euler: $e^{iz} = \cos z + i\operatorname{sen}z$, y entonces
              los dos senos se cancelan
            correcta: true
            mensaje: |
              Eso es todo el ejercicio. $e^{iz} - i\operatorname{sen}z =
              \cos z + i\operatorname{sen}z - i\operatorname{sen}z = \cos z$, y
              la ecuación se convierte en $\cos z = 1$. Siete puntos de COMP2
              que se ganan **mirando** antes de operar.
          - texto: >-
              Desarrollar $\operatorname{sen}z$ en exponenciales y agrupar
            mensaje: |
              Funciona y lleva al mismo sitio, pero por el camino largo:
              aparecen $e^{iz}$ y $e^{-iz}$ con denominadores y hay que
              recomponer. Euler lo hace de un vistazo.
          - texto: >-
              Tomar logaritmos en los dos lados
            mensaje: |
              El lado izquierdo es una **resta**, y el logaritmo no se reparte
              sobre sumas ni restas. Tomar logaritmos aquí no simplifica nada.
          - texto: >-
              Separar $z = x+iy$ y resolver el sistema real
            mensaje: |
              Se puede, pero son dos ecuaciones con senos, cosenos y
              exponenciales hiperbólicas. Reconocer la identidad de Euler
              ahorra toda esa página.

      - tipo: calcular
        titulo: La ecuación que queda
        pregunta: |
          Tras simplificar, la ecuación es $\cos z = k$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              El 1 del enunciado no desaparece: lo que se cancela es
              $i\operatorname{sen}z$ contra el $i\operatorname{sen}z$ de Euler.
              Lo que queda a la izquierda es $\cos z$, y a la derecha sigue
              el 1.
          - valor: '2'
            mensaje: |
              2 no sale de ningún sitio aquí. ($\cos z = 2$ es la ecuación de
              la recuperación de 2019-2020, y esa sí tiene soluciones
              complejas.)
          - valor: '-1'
            mensaje: |
              El signo. La ecuación es $e^{iz} - i\operatorname{sen}z = +1$, y
              al cancelar los senos el 1 se queda como está.
        pista: |
          Sustituye $e^{iz}$ por $\cos z + i\operatorname{sen}z$ y mira qué
          sobrevive en el lado izquierdo.
        desarrollo: |
          $$
          e^{iz} - i\operatorname{sen}z
          = \left(\cos z + i\operatorname{sen}z\right) - i\operatorname{sen}z
          = \cos z
          $$

          Así que la ecuación es simplemente

          $$
          \cos z = 1
          $$

          Y aquí conviene parar un segundo: 1 **está** en el rango del coseno
          real, así que no hay que esperar soluciones fuera del eje real.

      - tipo: justificar
        titulo: Las soluciones y su dibujo
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Por la fórmula de Euler,
              $e^{iz} = \cos z + i\operatorname{sen}z$ para todo
              $z\in\mathbb{C}$.
          - texto: >-
              Sustituyendo, el término $i\operatorname{sen}z$ se cancela con el
              del enunciado y la ecuación queda en $\cos z = 1$.
          - texto: >-
              Con $w=e^{iz}$: $\frac{w+w^{-1}}{2}=1$, o sea
              $w^{2}-2w+1=(w-1)^{2}=0$, luego $w=1$ es raíz **doble**.
          - texto: >-
              De $e^{iz}=1$ sale $iz = 2k\pi i$, es decir
              $z = 2k\pi$ con $k\in\mathbb{Z}$.
          - texto: >-
              Al representarlas: puntos aislados sobre el eje real, uno cada
              $2\pi$, incluido el origen. Ninguna solución tiene parte
              imaginaria.
          - texto: >-
              Como $w=1$ es raíz doble, cada solución $z=2k\pi$ hay que contarla
              dos veces, así que el conjunto solución tiene el doble de puntos.
            trampa: true
            mensaje: |
              La multiplicidad cuenta raíces de un polinomio, no puntos de un
              conjunto. El conjunto solución es
              $\{2k\pi : k\in\mathbb{Z}\}$, y cada punto está una vez. Lo que
              la raíz doble sí dice es algo útil y distinto: que **no hay una
              segunda familia** de soluciones, al contrario que en
              $\cos z = 2$, donde las dos raíces $2\pm\sqrt3$ daban dos rectas.

    resolucion: |
      ## El paso que resuelve el ejercicio

      La identidad de Euler, $e^{iz} = \cos z + i\operatorname{sen}z$, vale en
      todo $\mathbb{C}$. Sustituyéndola:

      $$
      e^{iz} - i\operatorname{sen}z
      = \cos z + i\operatorname{sen}z - i\operatorname{sen}z
      = \cos z
      $$

      La ecuación es, por tanto,

      $$
      \cos z = 1
      $$

      Siete de los diez puntos son COMP2, y la mayor parte se gana aquí: quien
      reconoce la cancelación tiene el ejercicio hecho; quien se lanza a
      desarrollar exponenciales llega igual, pero después de una página.

      ## Las soluciones

      Con $w = e^{iz}$:

      $$
      \frac{w+w^{-1}}{2} = 1
      \;\Longrightarrow\;
      w^{2}-2w+1 = (w-1)^{2} = 0
      \;\Longrightarrow\;
      w = 1
      $$

      raíz doble. Y $e^{iz}=1$ significa $iz = 0 + 2k\pi i$, luego

      $$
      \boxed{\;z = 2k\pi,\qquad k\in\mathbb{Z}\;}
      $$

      ## La representación

      Puntos aislados sobre el **eje real**, uno cada $2\pi$:
      $\dots,\,-4\pi,\,-2\pi,\,0,\,2\pi,\,4\pi,\,\dots$ **Ninguna solución
      tiene parte imaginaria**, y decir por qué vale los dos puntos de COMP4:
      el valor pedido, 1, es real y está en $[-1,1]$, así que ya lo alcanza el
      coseno real y no hace falta salir del eje.

      ## El contraste con el otro examen

      Merece la pena ponerlos uno al lado del otro, porque son el mismo tipo de
      ecuación con dos finales opuestos:

      | ecuación | raíces en $w=e^{iz}$ | soluciones |
      |---|---|---|
      | $\cos z = 1$ | $w=1$, doble | $z = 2k\pi$: eje real |
      | $\cos z = 2$ | $w = 2\pm\sqrt3$, dos | $z = 2k\pi \pm i\ln(2+\sqrt3)$: dos horizontales |

      Cuando el valor está dentro de $[-1,1]$, la raíz doble deja una sola
      familia sobre el eje real. Cuando se sale, aparecen dos raíces reales
      inversas y con ellas dos rectas simétricas. El discriminante de
      $w^{2}-2kw+1$ es $4(k^{2}-1)$: se anula justo en $k=\pm1$, que es la
      frontera.

  - id: ex2021-rec-3-la-desigualdad-estricta-no-sobrevive
    titulo: Dos afirmaciones casi iguales, y solo una es cierta
    fuente: >-
      Ejercicio 3 · Cuarta evaluación, PRIMER CUATRIMESTRAL, 22 de febrero de
      2021 · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp4: 9
    enunciado: |
      Decir si son verdaderas o falsas las siguientes afirmaciones. Demostrar
      formalmente las que sean verdaderas y dar un contraejemplo en las que
      sean falsas.

      a) Si $a_{n}\ge 0$ para todo $n\in\mathbb{N}$ y $\{a_{n}\}_{n\in\mathbb{N}}$
      converge hacia $L$, entonces $L\ge 0$.

      b) Si $a_{n}> 0$ para todo $n\in\mathbb{N}$ y $\{a_{n}\}_{n\in\mathbb{N}}$
      converge hacia $L$, entonces $L> 0$.
    pide: Verdadero o falso, con demostración o contraejemplo.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos afirmaciones se diferencian en un símbolo. ¿Cuál es cierta?
        opciones:
          - texto: >-
              La a) es cierta y la b) es falsa: el límite conserva las
              desigualdades **débiles**, no las estrictas
            correcta: true
            mensaje: |
              Exacto, y esa frase es la respuesta del ejercicio. El límite es
              un proceso de aproximación: puede «gastar» el margen que separa
              los términos del borde. $\frac1n$ es siempre estrictamente
              positiva y su límite es 0.
          - texto: Las dos son ciertas
            mensaje: |
              La b) falla con el ejemplo más sencillo que hay: $a_{n}=\frac1n$
              es estrictamente positiva para todo $n$ y converge a 0, que no
              es estrictamente positivo.
          - texto: Las dos son falsas
            mensaje: |
              La a) sí es cierta, y se demuestra por reducción al absurdo con
              $\varepsilon = -L/2$ si se supone $L<0$. Es la simétrica del
              ejercicio 3 de la recuperación de 2019-2020.
          - texto: >-
              La a) es falsa y la b) cierta
            mensaje: |
              Está del revés. Una desigualdad estricta es **más** exigente que
              una débil, así que si algo se conserva es lo débil: pedir más al
              límite es justo lo que no se puede.

      - tipo: calcular
        titulo: El contraejemplo de la b)
        pregunta: |
          Toma $a_{n} = \frac{1}{n}$, que es estrictamente positiva para todo
          $n$. ¿Cuál es su límite?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es el primer término, $a_{1}$, no el límite. El límite mira la
              cola de la sucesión, no su principio.
          - valor: '0.5'
            mensaje: |
              Ningún número positivo puede ser el límite, por pequeño que sea:
              tomando $\varepsilon$ menor que él, la sucesión acaba bajando por
              debajo de la banda y ya no vuelve. El único candidato es 0 — y
              eso es exactamente lo que hace falso el enunciado b).
        pista: |
          $\frac1n$ se hace tan pequeño como se quiera al crecer $n$, pero
          nunca llega a valer cero.
        desarrollo: |
          $$
          a_{n} = \frac1n > 0 \quad \forall n,
          \qquad\text{y sin embargo}\qquad
          \lim_{n\to\infty}\frac1n = 0
          $$

          Ese es el contraejemplo entero: todos los términos son estrictamente
          positivos y el límite no lo es. Y no es una rareza — es lo normal:
          **el límite puede alcanzar el borde que los términos nunca tocan**.
          Vale igual $a_{n} = \frac{1}{n^{2}}$ o $a_{n} = 2^{-n}$.

      - tipo: justificar
        titulo: La demostración de la a)
        pregunta: >-
          Ordena la demostración de la afirmación verdadera. Una pieza es falsa.
        piezas:
          - texto: >-
              Supongamos, por reducción al absurdo, que $L<0$.
          - texto: >-
              Entonces $\varepsilon = -\frac{L}{2}$ es un número positivo, así
              que la definición de límite se puede aplicar con él.
          - texto: >-
              Existe $m$ tal que $\lvert a_{n}-L\rvert < -\frac{L}{2}$ para todo
              $n\ge m$, lo que da
              $\frac{3L}{2} < a_{n} < \frac{L}{2}$.
          - texto: >-
              En particular $a_{m} < \frac{L}{2} < 0$, y eso contradice que
              todos los términos sean $\ge 0$.
          - texto: >-
              Luego la suposición era falsa y $L\ge 0$. $\blacksquare$
          - texto: >-
              La misma demostración sirve para la b) sin cambiar nada, poniendo
              desigualdades estrictas en cada paso.
            trampa: true
            mensaje: |
              No sirve, y ver dónde se rompe es lo que el ejercicio busca. Para
              la b) habría que suponer $L\le 0$ y sacar una contradicción, pero
              con $L=0$ no se puede elegir $\varepsilon = -L/2 = 0$: la
              definición exige $\varepsilon>0$. Ese caso es justo el que se
              escapa, y es justo donde vive el contraejemplo $\frac1n$.

    resolucion: |
      Nueve de los diez puntos son COMP4: se corrigen la demostración y el
      contraejemplo, no el «verdadero» y el «falso».

      ## a) Verdadera

      Supongamos, por reducción al absurdo, que $L<0$. Entonces
      $\varepsilon = -\frac{L}{2}$ es **positivo**, así que la definición de
      límite se puede invocar con él: existe $m$ tal que, para todo $n\ge m$,

      $$
      \left\lvert a_{n}-L \right\rvert < -\frac{L}{2}
      \iff
      L + \frac{L}{2} < a_{n} < L - \frac{L}{2}
      \iff
      \frac{3L}{2} < a_{n} < \frac{L}{2}
      $$

      Como $L<0$, se tiene $\frac{L}{2}<0$, luego $a_{m} < 0$ — y eso
      contradice que todos los términos sean $\ge 0$.

      Por tanto $L\ge 0$. $\blacksquare$

      ## b) Falsa

      **Contraejemplo:** $a_{n} = \dfrac{1}{n}$.

      - $a_{n} > 0$ para todo $n\in\mathbb{N}$;
      - $\lim a_{n} = 0$, que **no** es estrictamente positivo.

      Con eso basta: una afirmación universal se tumba con un solo caso.

      ## Dónde se rompe exactamente el argumento

      Merece la pena señalarlo, porque es lo que separa un aprobado de un diez.
      Si se intentara repetir la demostración de la a) para la b), habría que
      suponer $L\le 0$ y buscar el absurdo. Con $L<0$ funciona igual. Pero
      queda el caso $L=0$, y ahí

      $$
      \varepsilon = -\frac{L}{2} = 0
      $$

      no sirve: la definición exige $\varepsilon$ **estrictamente positivo**.
      No hay banda que colocar, no hay contradicción, y el caso se escapa. Y no
      se escapa por falta de habilidad: se escapa porque ahí es donde vive el
      contraejemplo.

      ## La regla que hay que llevarse

      > El paso al límite conserva las desigualdades **débiles** ($\le$, $\ge$)
      > y **no** conserva las estrictas.

      La razón es que el límite es un proceso de aproximación, y puede gastar
      todo el margen que separa los términos del borde. Por eso el enunciado de
      la propiedad —la que cae también en 2019-2020 con el signo cambiado— se
      escribe siempre con $\le$ y nunca con $<$.
