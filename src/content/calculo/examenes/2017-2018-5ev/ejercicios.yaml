      resultado, que solo depende del área encerrada.
      </figcaption>
      </figure>
    pide: El trabajo de $V$ a lo largo de $L_{1}$, de $A$ a $B$.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado no da la ecuación de $L_{1}$. ¿Por qué se puede calcular
          el trabajo de todas formas?
        opciones:
          - texto: >-
              Porque cerrando el camino con $L_{2}$ se obtiene una curva cerrada,
              y Green convierte la circulación en una integral doble que solo
              necesita el área
            correcta: true
            mensaje: |
              Exacto. $N_{x}-M_{y}=6-(-3)=9$ es constante, así que la integral
              doble es $9$ por el área, y el área la da el enunciado. La forma
              concreta de $L_{1}$ no aparece por ninguna parte.
          - texto: >-
              Porque el campo es conservativo y entonces el trabajo solo depende
              de los extremos
            mensaje: |
              Compruébalo: $N_{x}=6$ y $M_{y}=-3$, y no coinciden. Si el campo
              fuera conservativo el trabajo por $L_{1}$ y por $L_{2}$ sería el
              mismo y el dato del área sobraría en el enunciado.
          - texto: >-
              Porque en una región simplemente conexa cualquier camino de $A$ a
              $B$ da el mismo trabajo
            mensaje: |
              La conexión simple es una **hipótesis** del criterio, no una
              conclusión: hace falta además que $N_{x}=M_{y}$. Aquí eso falla, y
              por eso el camino sí importa.

      - tipo: calcular
        titulo: El trabajo por la parábola
        pregunta: |
          Recorriendo $L_{2}$, la parábola $y=1-x^{2}$, de $A$ a $B$, ¿cuánto
          vale el trabajo?
        respuesta:
          tipo: numero
          valor: '-12'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-4'
            mensaje: |
              Solo has integrado el primer sumando,
              $\int_{-1}^{1}-3y\,dx=-4$. Falta $6x\,dy$, que con
              $dy=-2x\,dx$ aporta otros $-8$.
          - valor: '4'
            mensaje: |
              Se te ha perdido el signo de $dy$. De $y=1-x^{2}$ sale
              $dy=-2x\,dx$, así que $6x\,dy=-12x^{2}dx$, no $+12x^{2}dx$.
          - valor: '-6'
            mensaje: |
              Ese es el valor de $\int_{-1}^{1}(-3)\,dx$: te has dejado los
              términos en $x^{2}$. Al sustituir queda $-3-9x^{2}$, y el segundo
              sumando aporta otros $-6$.
        pista: |
          Parametriza con la propia $x$: $y=1-x^{2}$, $dy=-2x\,dx$, y $x$ va de
          $-1$ a $1$.
        desarrollo: |
          $$
          W(L_{2})=\int_{-1}^{1}\Big[-3\left(1-x^{2}\right)+6x\left(-2x\right)\Big]dx
          =\int_{-1}^{1}\left(-3+3x^{2}-12x^{2}\right)dx
          $$

          $$
          =\int_{-1}^{1}\left(-3-9x^{2}\right)dx
          =\Big[-3x-3x^{3}\Big]_{-1}^{1}
          =(-6)-(6)=-12
          $$

      - tipo: calcular
        titulo: El trabajo por L₁
        pregunta: |
          Con $S=10$, ¿cuánto vale el trabajo a lo largo de $L_{1}$?
        respuesta:
          tipo: numero
          valor: '78'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '90'
            mensaje: |
              Ese es el valor de la circulación por la curva **cerrada**, que es
              $W(L_{1})-W(L_{2})$. Todavía hay que devolverle el trabajo de la
              parábola.
          - valor: '102'
            mensaje: |
              Signo al despejar. La curva cerrada es $L_{1}$ seguida de $L_{2}$
              **al revés**, así que $\oint=W(L_{1})-W(L_{2})$ y de ahí
              $W(L_{1})=90+(-12)=78$.
          - valor: '18'
            mensaje: |
              Has hecho $6-3$ en vez de $6-(-3)$. La primera componente del campo
              es $-3y$, y su derivada respecto de $y$ es $-3$: al restarla
              cambia de signo y queda $9$.
        pista: |
          $\oint=9S$, y $\oint=W(L_{1})-W(L_{2})$.
        desarrollo: |
          La curva $C$ formada por $L_{1}$ de $A$ a $B$ y $L_{2}$ de $B$ a $A$ es
          cerrada y deja el recinto a la izquierda, así que está en sentido
          positivo:

          $$
          \oint_{C}V\cdot dr
          =\iint_{D}\left(\frac{\partial N}{\partial x}-\frac{\partial M}{\partial y}\right)dA
          =\iint_{D}9\,dA=9S=90
          $$

          $$
          \oint_{C}=W(L_{1})-W(L_{2})
          \;\Longrightarrow\;
          W(L_{1})=90+W(L_{2})=90-12=78
          $$

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $N_{x}-M_{y}=6-(-3)=9\neq 0$, así que el campo no es conservativo y
              el trabajo depende del camino.
          - texto: >-
              $L_{1}$ recorrida de $A$ a $B$ y $L_{2}$ recorrida de $B$ a $A$
              forman una curva cerrada que deja el recinto siempre a la
              izquierda: es el sentido positivo.
          - texto: >-
              Por Green, esa circulación vale
              $\iint_{D}9\,dA=9S=90$, y aquí es donde entra el único dato que se
              da de la figura.
          - texto: >-
              Sobre $L_{2}$, con $y=1-x^{2}$ y $dy=-2x\,dx$, el trabajo se
              calcula directamente y vale $-12$.
          - texto: >-
              Como $\oint=W(L_{1})-W(L_{2})$, queda
              $W(L_{1})=90-12=78$.
          - texto: >-
              La divergencia del campo es $\operatorname{div}V=0$, luego el
              trabajo no depende del camino y $W(L_{1})=W(L_{2})=-12$.
            trampa: true
            mensaje: |
              La divergencia es cero, sí — pero eso no es lo que decide si el
              trabajo depende del camino. Lo decide el **rotacional**, es decir
              $N_{x}-M_{y}$, que aquí vale $9$. La divergencia nula habla del
              flujo que atraviesa una curva cerrada, no de la circulación a lo
              largo de ella.

    resolucion: |
      **Por qué hace falta Green.** El campo es $M=-3y$, $N=6x$, y
      $N_{x}-M_{y}=6-(-3)=9$. No es cero, así que el campo no deriva de un
      potencial y el trabajo depende del camino que se tome. Como de $L_{1}$ no
      se da la ecuación, no queda otra que sacarla del área.

      **La curva cerrada.** Se cierra el camino con la parábola: primero $L_{1}$
      de $A$ a $B$ y luego $L_{2}$ de $B$ a $A$. Ese recorrido deja el recinto
      sombreado siempre a la izquierda, que es el sentido positivo, y encierra
      exactamente la región de área $S=10$.

      **Green.** Como $N_{x}-M_{y}$ es constante, la integral doble es el área
      multiplicada por esa constante:

      $$
      \oint_{C}V\cdot dr=\iint_{D}9\,dA=9\cdot 10=90
      $$

      **La parábola, a mano.** De $L_{2}$ sí se tiene la ecuación. Con
      $y=1-x^{2}$, $dy=-2x\,dx$ y $x$ de $-1$ a $1$:

      $$
      W(L_{2})=\int_{-1}^{1}\left(-3-9x^{2}\right)dx=-6-6=-12
      $$

      **El despeje.** La circulación por la curva cerrada es el trabajo por
      $L_{1}$ menos el trabajo por $L_{2}$, porque a esta última se la recorre al
      revés:

      $$
      90=W(L_{1})-(-12)
      \;\Longrightarrow\;
      W(L_{1})=90-12=78
      $$

      **Un control.** El resultado no puede depender de la forma de $L_{1}$, solo
      del área que encierra. Se puede comprobar inventando un camino concreto con
      esa misma área — por ejemplo $y=-6{,}5\left(1-x^{2}\right)$, que encierra
      $(1+6{,}5)\cdot\frac43=10$ — y calculando su trabajo a mano: sale $78$.

  - id: ex1718-5ev-3-la-barra-en-agua-hirviendo
    titulo: La barra que se calienta, y el dato que no está escrito
    fuente: >-
      Ejercicio 3 · Quinta evaluación, SEGUNDO CUATRIMESTRAL, 7 de mayo de 2018 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 6
      comp4: 2
    enunciado: |
      Según la Ley de Newton, el ritmo de cambio de la temperatura de un objeto
      es proporcional a la diferencia entre su temperatura y la del ambiente. Una
      pequeña barra de metal, cuya temperatura inicial es de 20 °C, se deja caer
      en un recipiente con agua hirviendo. Calcular el tiempo que dicha barra
      tarda en alcanzar los 90 °C, si se sabe que su temperatura aumentó 2 °C en
      un segundo. ¿Cuánto tardará la barra en alcanzar los 98 °C?

      **Nota:** dejar indicadas las operaciones a efectuar con la calculadora.
    pide: Los dos tiempos, con las operaciones dejadas indicadas.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado no escribe con un número la temperatura del ambiente.
          ¿Cuál es?
        opciones:
          - texto: >-
              100 °C, porque el agua está hirviendo
            correcta: true
            mensaje: |
              Eso es. «Agua hirviendo» es el dato físico que hay que traducir a
              número, y sin él la ecuación no se puede escribir. Fíjate en que
              después el enunciado pregunta por los 98 °C: tiene sentido
              justamente porque el límite es 100.
          - texto: >-
              20 °C, que es la única temperatura que da el enunciado al principio
            mensaje: |
              Esa es la de la **barra** en el instante inicial: es la condición
              inicial $T(0)=20$, no el ambiente. Si el ambiente fuera 20 °C la
              barra ya estaría en equilibrio y no se movería de ahí.
          - texto: >-
              22 °C, la que tiene la barra al cabo de un segundo
            mensaje: |
              Esa es la segunda condición, $T(1)=22$, y sirve para hallar la
              constante $k$. Si el ambiente fuera 22 °C la barra nunca llegaría a
              90, porque la temperatura tiende al ambiente y nunca lo pasa.

      - tipo: calcular
        titulo: La constante, en forma de razón
        pregunta: |
          Con $T(t)=100-80e^{kt}$ y $T(1)=22$, ¿cuánto vale $e^{k}$?
        respuesta:
          tipo: numero
          valor: '0.975'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.025'
            mensaje: |
              Has planteado $80e^{k}=82$. Lo que decae es la **diferencia** con
              el ambiente: $100-T$ pasa de $80$ a $78$, así que
              $e^{k}=\frac{78}{80}<1$.
          - valor: '0.275'
            mensaje: |
              Has dividido la temperatura entre $80$ en vez de la diferencia con
              el ambiente. Lo que multiplica a $e^{kt}$ es $100-T$, y en $t=1$
              vale $100-22=78$.
        pista: |
          Sustituye $t=1$: $22=100-80e^{k}$.
        desarrollo: |
          $$
          22=100-80e^{k}
          \;\Longrightarrow\;
          80e^{k}=78
          \;\Longrightarrow\;
          e^{k}=\frac{78}{80}=\frac{39}{40}=0{,}975
          $$

          Es decir $k=\ln\dfrac{39}{40}<0$, como tiene que ser: la diferencia con
          el ambiente se hace cada vez más pequeña.

      - tipo: calcular
        titulo: Los segundos hasta 90 °C
        pregunta: |
          ¿Cuántos segundos tarda la barra en alcanzar los 90 °C?
        respuesta:
          tipo: numero
          valor: '82.133554'
          tolerancia: 0.01
          formato: en forma exacta o con dos decimales
        distractores:
          - valor: '35'
            mensaje: |
              Has supuesto un calentamiento a ritmo constante: 2 °C por segundo,
              70 °C en 35 segundos. Pero el ritmo es proporcional a lo que le
              **falta**, y cada vez le falta menos: sube 2 °C en el primer
              segundo y bastante menos en el septuagésimo.
          - valor: '-82.133554'
            mensaje: |
              Signo. $\ln\frac18$ y $\ln\frac{39}{40}$ son los **dos** negativos,
              así que su cociente es positivo. Se te ha perdido un menos en uno
              de los dos.
          - valor: '54.755702'
            mensaje: |
              Has puesto $e^{kt}=\frac{10}{40}$. La diferencia inicial es
              $100-20=80$, no $40$: el cociente que hay que despejar es
              $\frac{100-90}{80}=\frac18$.
        pista: |
          Impón $90=100-80e^{kt}$ y despeja $e^{kt}$ antes de tomar logaritmos.
        desarrollo: |
          $$
          90=100-80e^{kt}
          \;\Longrightarrow\;
          e^{kt}=\frac{10}{80}=\frac{1}{8}
          \;\Longrightarrow\;
          kt=-\ln 8
          $$

          $$
          t=\frac{-\ln 8}{\ln\frac{39}{40}}
          =\frac{\ln 8}{\ln\frac{40}{39}}
          \approx 82{,}13\ \text{s}
          $$

      - tipo: calcular
        titulo: Los segundos hasta 98 °C
        pregunta: |
          ¿Y cuántos segundos tarda en alcanzar los 98 °C, contados desde que
          entra en el agua?
        respuesta:
          tipo: numero
          valor: '145.702956'
          tolerancia: 0.01
          formato: en forma exacta o con dos decimales
        distractores:
          - valor: '63.569402'
            mensaje: |
              Ese es el tiempo que pasa **desde** los 90 °C hasta los 98 °C. La
              pregunta cuenta desde que la barra entra en el agua, así que hay
              que sumarle los 82,13 s anteriores.
          - valor: '164.267108'
            mensaje: |
              Has doblado el tiempo anterior. La relación no es esa: pasar de
              $\frac18$ a $\frac{1}{40}$ multiplica el logaritmo por
              $\frac{\ln 40}{\ln 8}\approx 1{,}77$, no por $2$.
          - valor: '118.325104'
            mensaje: |
              Has puesto $e^{kt}=\frac{2}{40}$. La diferencia inicial es
              $100-20=80$: el cociente que hay que despejar es
              $\frac{100-98}{80}=\frac{1}{40}$, y su logaritmo es $-\ln 40$.
        pista: |
          Mismo camino, con $98$ en lugar de $90$: la diferencia que queda es
          $2$ sobre los $80$ iniciales.
        desarrollo: |
          $$
          98=100-80e^{kt}
          \;\Longrightarrow\;
          e^{kt}=\frac{2}{80}=\frac{1}{40}
          \;\Longrightarrow\;
          t=\frac{\ln 40}{\ln\frac{40}{39}}\approx 145{,}70\ \text{s}
          $$

          Casi el doble que hasta los 90 °C, para solo 8 °C más: los últimos
          grados son los que más cuestan.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La ley se escribe $\dfrac{dT}{dt}=k\left(T-100\right)$, con el
              ambiente a 100 °C porque el agua hierve.
          - texto: >-
              Es de variables separables, y su solución general es
              $T=100+Ce^{kt}$.
          - texto: >-
              $T(0)=20$ da $C=-80$, y $T(1)=22$ da
              $e^{k}=\dfrac{39}{40}$, o sea $k=\ln\dfrac{39}{40}<0$.
          - texto: >-
              $T=90$ obliga a $e^{kt}=\dfrac18$, de donde
              $t=\dfrac{\ln 8}{\ln(40/39)}\approx 82{,}13$ s.
          - texto: >-
              $T=98$ obliga a $e^{kt}=\dfrac{1}{40}$, de donde
              $t=\dfrac{\ln 40}{\ln(40/39)}\approx 145{,}70$ s.
          - texto: >-
              Como $k$ es la constante de proporcionalidad y la barra sube 2 °C
              en un segundo, $k=2$.
            trampa: true
            mensaje: |
              $k$ no es el ritmo: el ritmo es $k\left(T-100\right)$. Si se
              intentara leerlo en $t=0$ saldría $-80k=2$, es decir
              $k=-0{,}025$ — parecido al bueno, $-0{,}02532$, pero no igual,
              porque 2 °C es lo que sube en **un segundo entero** y no la
              derivada en el instante inicial. La constante se obtiene imponiendo
              $T(1)=22$ en la solución, no en la ecuación.

    resolucion: |
      **El dato que hay que poner tú.** «Agua hirviendo» significa ambiente a
      100 °C. Sin traducir esa frase a un número no hay ecuación.

      **La ecuación.** El ritmo de cambio es proporcional a la diferencia con el
      ambiente:

      $$
      \frac{dT}{dt}=k\left(T-100\right)
      $$

      Separando variables, $\ln\left|T-100\right|=kt+c$, y como la barra está
      siempre por debajo de 100 la diferencia es negativa y queda

      $$
      T(t)=100+Ce^{kt}
      $$

      **Las dos condiciones.** $T(0)=20$ da $C=-80$, así que
      $T(t)=100-80e^{kt}$. Y $T(1)=22$ da

      $$
      80e^{k}=78
      \;\Longrightarrow\;
      e^{k}=\frac{39}{40}
      \;\Longrightarrow\;
      k=\ln\frac{39}{40}\approx -0{,}0253
      $$

      Que $k$ salga negativo es la señal de que el planteamiento es coherente: la
      diferencia con el ambiente se va apagando.

      **Los 90 °C.**

      $$
      90=100-80e^{kt}
      \;\Longrightarrow\;
      e^{kt}=\frac18
      \;\Longrightarrow\;
      t=\frac{\ln 8}{\ln\frac{40}{39}}\approx 82{,}13\ \text{s}
      $$

      **Los 98 °C.**

      $$
      98=100-80e^{kt}
      \;\Longrightarrow\;
      e^{kt}=\frac{1}{40}
      \;\Longrightarrow\;
      t=\frac{\ln 40}{\ln\frac{40}{39}}\approx 145{,}70\ \text{s}
      $$

      **Lo que dice el resultado.** Subir los primeros 70 grados cuesta 82
      segundos; subir los 8 siguientes cuesta 64 más. La barra nunca llega a
      100 °C: se acerca sin tocarlo, y por eso el enunciado pregunta por 98 y no
      por 100.

      **La nota del examen.** «Dejar indicadas las operaciones» quiere decir que
      la respuesta buena es $\dfrac{\ln 8}{\ln(40/39)}$ y
      $\dfrac{\ln 40}{\ln(40/39)}$, no sus decimales: en el examen no hay
      calculadora.
