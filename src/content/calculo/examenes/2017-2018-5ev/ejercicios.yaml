        L2, que sube hasta el punto cero uno. Los une por abajo una curva ondulada
        continua llamada L1, que baja desde A hasta un minimo cerca de menos seis
        decimas, sube hasta un maximo relativo poco despues del origen, vuelve a
        bajar y sube casi vertical hasta B. Entre las dos curvas queda sombreado el
        recinto cuya area vale diez.</desc>
