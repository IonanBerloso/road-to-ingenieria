ejercicios:
  - id: ex1718-5ev-1-el-orden-que-parte-en-dos
    titulo: Cambiar el orden y descubrir que hacen falta dos integrales
    fuente: >-
      Ejercicio 1 · Quinta evaluación, SEGUNDO CUATRIMESTRAL, 7 de mayo de 2018 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 6
      comp4: 2
    enunciado: |
      Sea la integral

      $$
      \int_{0}^{1}\left(\int_{\sqrt{y}}^{3-2y}dx\right)dy
      $$

      Representar gráficamente el dominio de integración, cambiar el orden de
      integración y calcular la nueva integral obtenida.
    pide: El recinto dibujado, la integral con el orden cambiado y su valor.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los límites dicen que $y$ va de $0$ a $1$ y que, para cada $y$, la $x$
          va de $\sqrt{y}$ a $3-2y$. ¿Qué figura es ese recinto?
        opciones:
          - texto: >-
              Un triángulo curvilíneo de vértices $(0,0)$, $(3,0)$ y $(1,1)$:
              abajo el eje $x$, a la izquierda el arco de $y=x^{2}$ y a la
              derecha el segmento de la recta $x=3-2y$
            correcta: true
            mensaje: |
              Eso es. En $y=0$ la banda va de $x=0$ a $x=3$, y en $y=1$ las dos
              tapas se juntan: $\sqrt{1}=1$ y $3-2\cdot 1=1$. El recinto se
              cierra en punta arriba, en $(1,1)$.
          - texto: >-
              El recinto que dejan entre sí la parábola y la recta, sin
              necesidad de ningún trozo del eje $x$
            mensaje: |
              La parábola y la recta se cortan **solo** en $(1,1)$. Abajo, en
              $y=0$, una está en $x=0$ y la otra en $x=3$: ahí el recinto no
              está cerrado por ninguna de las dos, sino por el eje $x$. Sin ese
              lado no hay figura.
          - texto: >-
              Un recinto con cuatro lados: las dos curvas y las rectas $y=0$ e
              $y=1$
            mensaje: |
              En $y=1$ no hay lado, hay vértice: las dos tapas valen $1$ y el
              recinto se cierra en punta. Solo $y=0$ es un lado de verdad, el de
              abajo.

      - tipo: calcular
        titulo: Dónde se parte
        pregunta: |
          Al integrar primero en $y$, la tapa de arriba deja de ser una curva y
          pasa a ser la otra. ¿En qué abscisa $x$ ocurre el cambio?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              Ese es el extremo derecho del recinto, donde la recta corta al eje
              $x$. El cambio de tapa está donde la parábola y la recta se
              cruzan, que es otro punto.
          - valor: '1.5'
            mensaje: |
              Has despejado mal la recta. De $x=3-2y$ sale $y=\dfrac{3-x}{2}$, no
              $y=3-\dfrac{x}{2}$. Con la buena, $x^{2}=\dfrac{3-x}{2}$ da
              $2x^{2}+x-3=0$ y la raíz positiva es $1$.
        pista: |
          Despeja las dos curvas en la forma $y=\ldots$ y córtalas.
        desarrollo: |
          $$
          x=\sqrt{y}\;\Longrightarrow\;y=x^{2},
          \qquad
          x=3-2y\;\Longrightarrow\;y=\frac{3-x}{2}
          $$

          $$
          x^{2}=\frac{3-x}{2}
          \;\Longrightarrow\;
          2x^{2}+x-3=0
          \;\Longrightarrow\;
          x=1 \quad\text{o}\quad x=-\frac{3}{2}
          $$

          Solo $x=1$ está en el recinto, y ahí las dos valen $y=1$.

      - tipo: calcular
        titulo: El valor de la integral
        pregunta: |
          Con el orden cambiado, ¿cuánto vale la integral?
        respuesta:
          tipo: numero
          valor: '1.3333333'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              Ese es solo el segundo trozo,
              $\int_{1}^{3}\frac{3-x}{2}\,dx=1$. Falta el de la izquierda, el
              que va por debajo de la parábola entre $x=0$ y $x=1$.
          - valor: '0.3333333'
            mensaje: |
              Ese es solo el primer trozo,
              $\int_{0}^{1}x^{2}\,dx=\frac13$. El recinto llega hasta $x=3$, y a
              la derecha de $x=1$ la tapa es la recta.
          - valor: '2.3333333'
            mensaje: |
              Te has dejado el $2$ del denominador: la tapa de la derecha es
              $y=\frac{3-x}{2}$, no $y=3-x$. Con la buena, el segundo trozo vale
              $1$ y no $2$.
        pista: |
          Dos integrales: de $0$ a $1$ con tapa $x^{2}$, y de $1$ a $3$ con tapa
          $\frac{3-x}{2}$.
        desarrollo: |
          $$
          \int_{0}^{1}\!\!\int_{0}^{x^{2}}dy\,dx
          +\int_{1}^{3}\!\!\int_{0}^{\frac{3-x}{2}}dy\,dx
          =\int_{0}^{1}x^{2}\,dx+\int_{1}^{3}\frac{3-x}{2}\,dx
          $$

          $$
          =\left[\frac{x^{3}}{3}\right]_{0}^{1}
          +\frac{1}{2}\left[3x-\frac{x^{2}}{2}\right]_{1}^{3}
          =\frac{1}{3}+\frac{1}{2}\left(\frac{9}{2}-\frac{5}{2}\right)
          =\frac{1}{3}+1=\frac{4}{3}
          $$

          Y por el orden original, para comprobar:
          $\int_{0}^{1}\left(3-2y-\sqrt{y}\right)dy=3-1-\frac23=\frac43$.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Los límites de partida describen el recinto por franjas
              horizontales: para cada $y\in[0,1]$, la $x$ va de $\sqrt{y}$ a
              $3-2y$.
          - texto: >-
              Despejadas, las dos tapas son la parábola $y=x^{2}$ y la recta
              $y=\dfrac{3-x}{2}$, y se cortan en $(1,1)$.
          - texto: >-
              Por franjas verticales el recinto empieza en $x=0$ y acaba en
              $x=3$, y la tapa de arriba cambia en $x=1$: hasta ahí es la
              parábola, y a partir de ahí la recta.
          - texto: >-
              Hacen falta, por tanto, **dos** integrales, y su suma es
              $\dfrac13+1=\dfrac43$.
          - texto: >-
              Como el recinto es una sola pieza, con el orden cambiado también
              basta una sola integral,
              $\displaystyle\int_{0}^{3}\!\!\int_{0}^{x^{2}}dy\,dx$.
            trampa: true
            mensaje: |
              Que el recinto sea una pieza no dice nada sobre cuántas integrales
              hacen falta: lo que decide es si la tapa se describe con **una
              sola fórmula**. Aquí no. Y esa integral concreta además se sale del
              recinto: en $x=2$ la tapa verdadera está en $y=\frac12$, no en
              $y=4$.

    resolucion: |
      **El recinto.** Los límites dicen que $y$ recorre $[0,1]$ y que, para cada
      $y$, la $x$ va de $\sqrt{y}$ a $3-2y$. En $y=0$ eso es todo el segmento de
      $x=0$ a $x=3$; según sube $y$, la tapa izquierda avanza hacia la derecha y
      la derecha retrocede, hasta que en $y=1$ se juntan las dos en $x=1$. El
      recinto es un triángulo curvilíneo de vértices $(0,0)$, $(3,0)$ y $(1,1)$:
      abajo el eje $x$, a la izquierda el arco de parábola y a la derecha el
      segmento de recta.

      **Las dos tapas, despejadas.** $x=\sqrt{y}$ es $y=x^{2}$ y $x=3-2y$ es
      $y=\frac{3-x}{2}$. Cortándolas, $2x^{2}+x-3=0$, con raíces $x=1$ y
      $x=-\frac32$; la que sirve es $x=1$.

      **El orden cambiado.** Por franjas verticales, $x$ va de $0$ a $3$ y la
      tapa de arriba **no es la misma** en todo el intervalo: hasta $x=1$ manda
      la parábola y a partir de $x=1$ manda la recta. Por eso la integral se
      parte:

      $$
      \int_{0}^{1}\!\!\int_{0}^{x^{2}}dy\,dx
      +\int_{1}^{3}\!\!\int_{0}^{\frac{3-x}{2}}dy\,dx
      =\frac{1}{3}+1=\frac{4}{3}
      $$

      **La comprobación.** Cambiar el orden no cambia el valor, así que la
      integral de partida tiene que dar lo mismo:

      $$
      \int_{0}^{1}\left(3-2y-\sqrt{y}\right)dy
      =3-1-\frac{2}{3}=\frac{4}{3}
      $$

      Y como el integrando es $1$, ese $\frac43$ es también el área del recinto,
      que es la tercera forma de comprobarlo.

  - id: ex1718-5ev-2-el-trabajo-que-sale-del-area
    titulo: Un trabajo que se calcula sin conocer el camino
    fuente: >-
      Ejercicio 2 · Quinta evaluación, SEGUNDO CUATRIMESTRAL, 7 de mayo de 2018 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 3
      comp2: 5
      comp4: 2
    enunciado: |
      Calcular el trabajo realizado por el campo vectorial $V=(-3y,\,6x)$ desde
      el punto $A=(-1,0)$ al punto $B=(1,0)$ a lo largo de la trayectoria
      $L_{1}$, sabiendo que el área sombreada de la figura vale $S=10$.

