      </figcaption>
      </figure>

      Los círculos huecos marcan los puntos donde $F$ no está definida: los
      múltiplos de $\pi$, que son todos saltos.

      **c) La serie.** Al ser $F$ impar, todos los $a_{n}$ se anulan y quedan
      solo senos:

      $$
      b_{n}=\frac{2}{\pi}\int_{0}^{\pi}\left(t+\pi\right)
      \operatorname{sen}(nt)\,dt
      $$

      Partiendo la integral en dos:

      $$
      \int_{0}^{\pi}t\operatorname{sen}(nt)\,dt=\frac{\pi(-1)^{n+1}}{n},
      \qquad
      \int_{0}^{\pi}\pi\operatorname{sen}(nt)\,dt
      =\frac{\pi\left(1-(-1)^{n}\right)}{n}
      $$

      $$
      b_{n}=\frac{2\left[(-1)^{n+1}-(-1)^{n}+1\right]}{n}
      =\begin{cases}
      \dfrac{6}{n} & n\ \text{impar}\\[8pt]
      -\dfrac{2}{n} & n\ \text{par}
      \end{cases}
      $$

      $$
      S(t)=6\operatorname{sen}t-\operatorname{sen}2t
      +2\operatorname{sen}3t-\frac12\operatorname{sen}4t+\cdots
      $$

      **d) Los dos puntos.** Lo primero es reducir módulo $2\pi$, siempre.

      $-5\pi\equiv\pi$: es un punto de salto. Los límites laterales son

      $$
      \lim_{t\to\pi^{-}}F(t)=2\pi,
      \qquad
      \lim_{t\to\pi^{+}}F(t)=-2\pi
      $$

      y el teorema de Dirichlet dice que la serie converge a la **media**:

      $$
      S(-5\pi)=\frac{2\pi+(-2\pi)}{2}=0
      $$

      mientras que $F(-5\pi)$ **no está definida**, porque $f$ se dio en el
      intervalo abierto. (Si se conviene $F(\pi)=0$ por imparidad, coinciden.)

      $\frac{25}{2}\pi=12\pi+\frac{\pi}{2}\equiv\frac{\pi}{2}$: ahí $F$ es
      continua, así que

      $$
      S\left(\tfrac{25}{2}\pi\right)=F\left(\tfrac{\pi}{2}\right)
      =\frac{3\pi}{2}
      $$

      **e) La suma.** Es el regalo del ejercicio: la serie de Fourier evaluada en
      un punto concreto **es** una serie numérica. En $t=\frac{\pi}{2}$ los senos
      pares se anulan y los impares valen $\pm 1$ alternando:

      $$
      S\left(\tfrac{\pi}{2}\right)
      =6\sum_{k=0}^{\infty}\frac{(-1)^{k}}{2k+1}
      $$

      y como ese valor es $\frac{3\pi}{2}$,

      $$
      \sum_{n=0}^{\infty}\frac{(-1)^{n}}{2n+1}=\frac{\pi}{4}
      $$

      que es la serie de Leibniz. Sale gratis del apartado d), y ese es el motivo
      de que el enunciado pidiera precisamente el punto $\frac{25}{2}\pi$.
