ejercicios:
  - id: ex2526-ord-1-el-triangulo-equilatero
    titulo: Tres vértices que son las tres raíces cúbicas de ocho
    fuente: >-
      Ejercicio 1 del PRIMER PARCIAL · Convocatoria ordinaria, 9 de junio de 2026 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Los afijos de los números complejos $z_{1}=-1+\sqrt{3}\,i$,
      $z_{2}=-1-\sqrt{3}\,i$ y $z_{3}$ son los vértices de un triángulo
      equilátero.

      a) Calcular $z_{3}$ sabiendo que es el de mayor parte real.

      b) Calcular el área del triángulo.
    pide: El tercer vértice y el área del triángulo.

    pasos:
      - tipo: reconocer
        pregunta: |
          $z_{1}$ y $z_{2}$ tienen los dos módulo $2$, y argumentos
          $120^{\circ}$ y $-120^{\circ}$. ¿Qué sugiere eso?
        opciones:
          - texto: >-
              Que son dos de las tres raíces cúbicas de $8$, y que la tercera
              —la de argumento $0^{\circ}$— es el vértice que falta
            correcta: true
            mensaje: |
              Eso es. Las tres raíces cúbicas de un número reparten la
              circunferencia en tres partes iguales, así que **siempre** forman
              un triángulo equilátero. Aquí el radio es $2$ y los argumentos van
              de $120^{\circ}$ en $120^{\circ}$: $0^{\circ}$, $120^{\circ}$ y
              $-120^{\circ}$.
          - texto: >-
              Que $z_{3}=z_{1}+z_{2}$, porque los tres vértices suman cero
            mensaje: |
              La suma de los tres **sí** es cero —el baricentro está en el
              origen—, pero entonces $z_{3}=-(z_{1}+z_{2})=2$, con el signo
              cambiado. $z_{1}+z_{2}$ vale $-2$, que está al otro lado.
          - texto: >-
              Que $z_{3}$ es el conjugado de $z_{1}$
            mensaje: |
              El conjugado de $z_{1}$ es $z_{2}$, que ya está dado. El tercer
              vértice tiene que ser otro punto.

      - tipo: calcular
        titulo: El tercer vértice
        pregunta: |
          ¿Cuál es la parte real de $z_{3}$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              Ese es $z_{1}+z_{2}$. El baricentro de un equilátero es el centro
              de su circunferencia circunscrita, aquí el origen, así que
              $z_{1}+z_{2}+z_{3}=0$ y $z_{3}=-(z_{1}+z_{2})=+2$. Además $-2$
              dista $2$ de $z_{1}$, y el lado mide $2\sqrt{3}$.
          - valor: '3.4641016'
            mensaje: |
              Eso es $2\sqrt{3}$, la longitud del **lado**, no la abscisa del
              vértice. El vértice está sobre el eje real a distancia $2$ del
              origen, porque los tres están en la misma circunferencia.
          - valor: '1'
            mensaje: |
              Has cambiado de signo la parte real de $z_{1}$. El tercer vértice
              no es la reflexión de $z_{1}$: es el que completa el reparto de la
              circunferencia en tres partes iguales, y cae sobre el eje real.
        pista: |
          El baricentro de un triángulo equilátero coincide con el centro de su
          circunferencia circunscrita.
        desarrollo: |
          $z_{1}=2_{120^{\circ}}$ y $z_{2}=2_{-120^{\circ}}$ están en la
          circunferencia de radio $2$, y el tercer vértice de un equilátero
          inscrito tiene que estar a $120^{\circ}$ de los dos:

          $$
          z_{3}=2_{0^{\circ}}=2
          $$

          O, sin polares: el baricentro está en el centro, así que
          $z_{1}+z_{2}+z_{3}=0$ y

          $$
          z_{3}=-\left(-1+\sqrt{3}i-1-\sqrt{3}i\right)=2
          $$

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área del triángulo?
        respuesta:
          tipo: numero
          valor: '5.1961524'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '10.3923048'
            mensaje: |
              Te has dejado el $\frac12$. La base es el segmento
              $\overline{z_{1}z_{2}}$, de longitud $2\sqrt{3}$, y la altura es la
              distancia de $z_{3}=2$ a la recta $x=-1$, que vale $3$: el área es
              $\frac12\cdot 2\sqrt{3}\cdot 3$.
          - valor: '1.7320508'
            mensaje: |
              Has usado lado $2$, que es el **radio** de la circunferencia
              circunscrita. El lado de un equilátero inscrito en una
              circunferencia de radio $R$ mide $R\sqrt{3}$, aquí $2\sqrt{3}$.
          - valor: '3'
            mensaje: |
              Esa es la altura del triángulo, la distancia de $z_{3}$ a la recta
              que une los otros dos. Falta multiplicarla por la base y dividir
              entre dos.
        pista: |
          La base es vertical: une $-1+\sqrt{3}i$ con $-1-\sqrt{3}i$.
        desarrollo: |
          La base es el segmento de $z_{1}$ a $z_{2}$, que mide

          $$
          \left|z_{1}-z_{2}\right|=\left|2\sqrt{3}\,i\right|=2\sqrt{3}
          $$

          y la altura es la distancia de $z_{3}=2$ a la recta $x=-1$, que vale
          $3$. Por tanto

          $$
          A=\frac{1}{2}\cdot 2\sqrt{3}\cdot 3=3\sqrt{3}\approx 5{,}1962
          $$

          Y con la fórmula del equilátero,
          $A=\frac{\sqrt{3}}{4}\left(2\sqrt{3}\right)^{2}
          =\frac{\sqrt{3}}{4}\cdot 12=3\sqrt{3}$: lo mismo.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $z_{1}$ y $z_{2}$ tienen módulo $2$ y argumentos $\pm 120^{\circ}$:
              están en la circunferencia de centro el origen y radio $2$.
          - texto: >-
              Un triángulo equilátero inscrito reparte la circunferencia en tres
              arcos de $120^{\circ}$, así que el tercer vértice tiene argumento
              $0^{\circ}$: $z_{3}=2$, que además es el de mayor parte real, como
              pide el enunciado.
          - texto: >-
              Los tres son, de hecho, las raíces cúbicas de $8$: cumplen
              $z^{3}=8$.
          - texto: >-
              El lado mide $\left|z_{1}-z_{2}\right|=2\sqrt{3}$ y la altura desde
              $z_{3}$ vale $3$.
          - texto: >-
              El área es $\frac12\cdot 2\sqrt{3}\cdot 3=3\sqrt{3}\approx
              5{,}1962$.
          - texto: >-
              Como los tres vértices están a distancia $2$ del origen, el lado
              del triángulo mide $2$.
            trampa: true
            mensaje: |
              El radio de la circunferencia circunscrita no es el lado. En un
              equilátero el lado vale $R\sqrt{3}$, y aquí $2\sqrt{3}\approx
              3{,}46$. Se ve de un vistazo mirando $z_{1}$ y $z_{2}$: están
              separados verticalmente $2\sqrt{3}$, no $2$.

    resolucion: |
      **a) El tercer vértice.** En polares, $z_{1}=2_{120^{\circ}}$ y
      $z_{2}=2_{-120^{\circ}}$: los dos en la circunferencia de centro el origen
      y radio $2$, separados $240^{\circ}$.

      Un triángulo equilátero inscrito en una circunferencia tiene sus tres
      vértices separados $120^{\circ}$, así que el que falta es

      $$
      z_{3}=2_{0^{\circ}}=2
      $$

      y es, además, el de mayor parte real: los otros dos la tienen igual a
      $-1$.

      Hay un camino más corto que conviene ver: los tres cumplen $z^{3}=8$. Son
      **las tres raíces cúbicas de 8**, y las raíces $n$-ésimas de un complejo
      siempre forman un polígono regular de $n$ lados. Reconocerlo ahorra el
      ejercicio entero.

      Y un tercero, sin polares: el baricentro de un equilátero coincide con el
      centro de la circunferencia circunscrita, que aquí es el origen, luego
      $z_{1}+z_{2}+z_{3}=0$ y $z_{3}=2$.

      **b) El área.** La base es el segmento vertical que une $z_{1}$ con
      $z_{2}$:

      $$
      \left|z_{1}-z_{2}\right|=\left|2\sqrt{3}\,i\right|=2\sqrt{3}
      $$

      y la altura, la distancia de $z_{3}=2$ a la recta $x=-1$, es $3$.

      $$
      A=\frac{1}{2}\cdot 2\sqrt{3}\cdot 3=3\sqrt{3}\approx 5{,}1962
      $$

      **La comprobación** es inmediata con la fórmula del equilátero:
      $A=\frac{\sqrt{3}}{4}\ell^{2}$ con $\ell=2\sqrt{3}$ da
      $\frac{\sqrt{3}}{4}\cdot 12=3\sqrt{3}$. Que las dos vías coincidan
      confirma de paso que el triángulo es equilátero de verdad y no solo
      isósceles.

  - id: ex2526-ord-2-la-temperatura-respecto-a-la-posicion
    titulo: Una derivada respecto de algo que no es el tiempo
    fuente: >-
      Ejercicio 2 del PRIMER PARCIAL · Convocatoria ordinaria, 9 de junio de 2026 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      La temperatura $T$ de un objeto que se mueve a lo largo de un filamento
      depende del tiempo $t$ y viene dada por $T(t)=2e^{0{,}1t}$. Además, la
      posición de dicho objeto en función del tiempo se expresa mediante
      $x(t)=t^{2}+t$. Determinar el instante $t$ en el que el cambio de
      temperatura respecto a la posición es mínimo.
    pide: El instante en que dT/dx alcanza su mínimo.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es «el cambio de temperatura respecto a la posición»?
        opciones:
          - texto: >-
              $\dfrac{dT}{dx}$, que por la regla de la cadena vale
              $\dfrac{dT/dt}{dx/dt}$
            correcta: true
            mensaje: |
              Eso es. La cadena dice $\frac{dT}{dt}=\frac{dT}{dx}\frac{dx}{dt}$,
              y de ahí se despeja. No hace falta escribir $T$ en función de $x$.
          - texto: >-
              $\dfrac{dT}{dt}$, la variación de la temperatura con el tiempo
            mensaje: |
              Esa es respecto al **tiempo**, y además nunca se anula ni tiene
              mínimo: $2e^{0{,}1t}$ crece siempre. El enunciado pide respecto a
              la posición.
          - texto: >-
              Hay que despejar $t$ de $x=t^{2}+t$ y sustituir en $T$
            mensaje: |
              Se puede —sale $t=\frac{-1+\sqrt{1+4x}}{2}$— pero derivar eso es
              mucho más largo y con más sitios donde equivocarse. La regla de la
              cadena da lo mismo sin despejar nada.

      - tipo: calcular
        titulo: La derivada en el instante inicial
        pregunta: |
          ¿Cuánto vale $\dfrac{dT}{dx}$ en $t=0$?
        respuesta:
          tipo: numero
          valor: '0.2'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.1'
            mensaje: |
              Te has dejado el $2$ de $T=2e^{0{,}1t}$. Al derivar,
              $T'(t)=2\cdot 0{,}1\,e^{0{,}1t}=0{,}2e^{0{,}1t}$.
          - valor: '2'
            mensaje: |
              Te has dejado el $0{,}1$ que baja del exponente. La derivada de
              $e^{0{,}1t}$ es $0{,}1e^{0{,}1t}$, no $e^{0{,}1t}$.
          - valor: '0.6666667'
            mensaje: |
              Parece que has dividido por $x(1)=2$ o algo parecido. En $t=0$ el
              denominador es $x'(0)=2\cdot 0+1=1$.
        pista: |
          $\dfrac{dT}{dx}=\dfrac{T'(t)}{x'(t)}$, y en $t=0$ los dos son fáciles.
        desarrollo: |
          $$
          \frac{dT}{dx}=\frac{T'(t)}{x'(t)}
          =\frac{0{,}2\,e^{0{,}1t}}{2t+1}
          $$

          y en $t=0$ queda $\frac{0{,}2\cdot 1}{1}=0{,}2$.

      - tipo: calcular
        titulo: El instante del mínimo
        pregunta: |
          ¿En qué instante $t$ es mínimo $\dfrac{dT}{dx}$?
        respuesta:
          tipo: numero
          valor: '9.5'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-0.5'
            mensaje: |
              Has anulado el denominador, $2t+1=0$. Ahí la función no tiene un
              mínimo: tiene una asíntota, y además $t=-0{,}5$ está fuera de todo
              intervalo con sentido físico.
          - valor: '19'
            mensaje: |
              Has dividido entre $0{,}1$ en vez de entre $0{,}2$. La condición es
              $0{,}1(2t+1)-2=0$, es decir $0{,}2t=1{,}9$.
          - valor: '10'
            mensaje: |
              Cerca, pero no. De $0{,}1(2t+1)=2$ sale $2t+1=20$ y $t=9{,}5$; con
              $t=10$ el numerador de la derivada sería $0{,}1$, no cero.
        pista: |
          Deriva el cociente $\dfrac{0{,}2e^{0{,}1t}}{2t+1}$ y saca factor común
          la exponencial, que nunca se anula.
        desarrollo: |
          $$
          \frac{d}{dt}\left(\frac{0{,}2e^{0{,}1t}}{2t+1}\right)
          =\frac{0{,}2e^{0{,}1t}\left[0{,}1(2t+1)-2\right]}{(2t+1)^{2}}
          $$

          La exponencial y el denominador son siempre positivos, así que el
          signo lo pone el corchete:

          $$
          0{,}1(2t+1)-2=0
          \;\Longrightarrow\;
          0{,}2t=1{,}9
          \;\Longrightarrow\;
          t=9{,}5
          $$

          Y es mínimo porque el corchete es negativo antes y positivo después:
          la derivada baja hasta $t=9{,}5$ y sube a partir de ahí.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              «Cambio de temperatura respecto a la posición» es
              $\dfrac{dT}{dx}$, y por la regla de la cadena
              $\dfrac{dT}{dx}=\dfrac{T'(t)}{x'(t)}$.
          - texto: >-
              $T'(t)=0{,}2e^{0{,}1t}$ y $x'(t)=2t+1$, así que
              $g(t)=\dfrac{0{,}2e^{0{,}1t}}{2t+1}$.
          - texto: >-
              Derivando el cociente y sacando factor común la exponencial, el
              signo de $g'$ es el de $0{,}1(2t+1)-2$.
          - texto: >-
              Ese corchete se anula en $t=9{,}5$, es negativo antes y positivo
              después: ahí hay un mínimo.
          - texto: >-
              Hace falta además $2t+1>0$, es decir $t>-\frac12$, para que el
              objeto avance y la derivada tenga sentido.
          - texto: >-
              Como $T$ crece y $x$ también, su cociente crece, y por tanto
              $\dfrac{dT}{dx}$ no puede tener un mínimo interior.
            trampa: true
            mensaje: |
              Que dos funciones crezcan no dice nada del cociente. Aquí, al
              principio, la posición acelera mucho más deprisa que la
              temperatura —$x$ es cuadrática y $T$ apenas se mueve—, así que el
              cociente **baja**; y a partir de $t=9{,}5$ la exponencial se
              impone y vuelve a subir. Ese cambio es justamente el mínimo que
              pide el enunciado.

    resolucion: |
      **Lo que pide el enunciado.** «El cambio de temperatura respecto a la
      posición» es $\dfrac{dT}{dx}$, y no hay que despejar $t$ para calcularlo.
      La regla de la cadena,

      $$
      \frac{dT}{dt}=\frac{dT}{dx}\cdot\frac{dx}{dt},
      $$

      da directamente

      $$
      \frac{dT}{dx}=\frac{T'(t)}{x'(t)}
      =\frac{0{,}2\,e^{0{,}1t}}{2t+1}
      \;=:\;g(t)
      $$

      **El mínimo.** Derivando el cociente:

      $$
      g'(t)=\frac{0{,}2e^{0{,}1t}\left[0{,}1(2t+1)-2\right]}{(2t+1)^{2}}
      $$

      La exponencial es siempre positiva y el denominador también, así que el
      signo de $g'$ es el del corchete, que es una recta:

      $$
      0{,}1(2t+1)-2=0{,}2t-1{,}9
      $$

      Negativa para $t<9{,}5$ y positiva para $t>9{,}5$. Por tanto $g$ decrece,
      alcanza su mínimo en

      $$
      \boxed{t=9{,}5}
      $$

      y crece a partir de ahí.

      **Lo que significa.** Al principio el objeto se acelera —$x$ crece como
      $t^{2}$— mientras la temperatura apenas se mueve, así que cada metro
      recorrido calienta cada vez menos. Pasado $t=9{,}5$ la exponencial empieza
      a mandar y la relación se invierte. Ese cruce es el mínimo, y decirlo con
      palabras es la mitad de los puntos de COMP4.

  - id: ex2526-ord-3-la-geometrica-y-su-intervalo
    titulo: La serie más corta del temario, y dónde deja de valer
    fuente: >-
      Ejercicio 3 del PRIMER PARCIAL · Convocatoria ordinaria, 9 de junio de 2026 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3
    enunciado: |
      a) Obtener el desarrollo de Maclaurin de la función
      $f(x)=\dfrac{1}{1-x}$.

      b) ¿Para qué valores de $x$ es convergente la serie obtenida en el
      apartado anterior?
    pide: El desarrollo y su intervalo de convergencia.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la vía más corta para el desarrollo?
        opciones:
          - texto: >-
              Reconocer que $\frac{1}{1-x}$ **es** la suma de la serie
              geométrica de razón $x$, así que el desarrollo es
              $\sum_{n\ge 0}x^{n}$ sin calcular nada
            correcta: true
            mensaje: |
              Eso es. La fórmula $\frac{a}{1-r}$ de la suma de una geométrica,
              leída al revés, ya es el desarrollo. Y de paso da el radio de
              convergencia gratis: la geométrica converge si y solo si
              $\left|r\right|<1$.
          - texto: >-
              Derivar $f$ una y otra vez y evaluar en $0$
            mensaje: |
              Funciona: $f^{(n)}(x)=\frac{n!}{(1-x)^{n+1}}$ y
              $f^{(n)}(0)=n!$, así que el coeficiente es $\frac{n!}{n!}=1$. Pero
              es dar un rodeo para llegar a la serie que uno ya se sabe.
          - texto: >-
              Sustituir $x$ por $-x$ en el desarrollo de $\ln(1+x)$
            mensaje: |
              Son funciones distintas. $\frac{1}{1-x}$ es la **derivada** de
              $-\ln(1-x)$, no un logaritmo; y sustituir no arregla esa
              diferencia.

      - tipo: calcular
        titulo: El coeficiente de x⁷
        pregunta: |
          ¿Cuál es el coeficiente de $x^{7}$ en el desarrollo?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-1'
            mensaje: |
              Los signos alternan en $\frac{1}{1+x}$, no en $\frac{1}{1-x}$.
              Aquí la razón es $+x$ y todos los coeficientes valen $1$.
          - valor: '0.0001984'
            mensaje: |
              Eso es $\frac{1}{7!}$, el coeficiente de la exponencial. Aquí no
              hay factoriales: se cancelan con los $n!$ de las derivadas.
          - valor: '7'
            mensaje: |
              Los coeficientes no crecen con el grado. Escribe los primeros
              términos: $1+x+x^{2}+x^{3}+\cdots$, todos con coeficiente $1$.
        pista: |
          Escribe la geométrica de razón $x$ y mira el término de grado $7$.
        desarrollo: |
          $$
          \frac{1}{1-x}=\sum_{n=0}^{\infty}x^{n}
          =1+x+x^{2}+x^{3}+\cdots
          $$

          Todos los coeficientes valen $1$; el de $x^{7}$ también. Comprobado
          por derivadas: $f^{(n)}(x)=\frac{n!}{(1-x)^{n+1}}$, luego
          $f^{(n)}(0)=n!$ y $a_{n}=\frac{n!}{n!}=1$.

      - tipo: calcular
        titulo: La suma en un punto
        pregunta: |
          ¿Cuánto vale la serie en $x=-\frac12$?
        respuesta:
          tipo: numero
          valor: '0.6666667'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              Has puesto $x=+\frac12$. Con $x=-\frac12$ el denominador es
              $1-\left(-\frac12\right)=\frac32$.
          - valor: '0.5'
            mensaje: |
              Has sumado solo los dos primeros términos, $1-\frac12$. La serie
              sigue: $+\frac14-\frac18+\cdots$, y converge a $\frac23$.
          - valor: '1.5'
            mensaje: |
              Ese es el **denominador**, $1-x=\frac32$. La suma es su inverso.
        pista: |
          No hay que sumar nada: la serie converge a $\frac{1}{1-x}$ en todo su
          intervalo, y $-\frac12$ está dentro.
        desarrollo: |
          $$
          \sum_{n=0}^{\infty}\left(-\frac12\right)^{n}
          =\frac{1}{1-\left(-\frac12\right)}
          =\frac{1}{\frac32}=\frac{2}{3}\approx 0{,}6667
          $$

      - tipo: justificar
        titulo: El razonamiento y el intervalo
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\frac{1}{1-x}$ es la suma de la serie geométrica de primer
              término $1$ y razón $x$, así que su desarrollo de Maclaurin es
              $\displaystyle\sum_{n=0}^{\infty}x^{n}$.
          - texto: >-
              Se confirma derivando: $f^{(n)}(x)=\frac{n!}{(1-x)^{n+1}}$, luego
              $f^{(n)}(0)=n!$ y el coeficiente $\frac{f^{(n)}(0)}{n!}$ vale $1$
              para todo $n$.
          - texto: >-
              Una geométrica converge si y solo si $\left|r\right|<1$, así que la
              serie converge exactamente para $\left|x\right|<1$.
          - texto: >-
              En $x=1$ la serie es $1+1+1+\cdots$ y diverge a $+\infty$: el
              término general no tiende a cero.
          - texto: >-
              En $x=-1$ es $1-1+1-1+\cdots$, cuyas sumas parciales oscilan entre
              $1$ y $0$ sin límite: también diverge.
          - texto: >-
              El intervalo de convergencia es, por tanto, el abierto $(-1,1)$.
          - texto: >-
              En $x=-1$ la serie converge a $\frac12$, que es la media de sus
              sumas parciales.
            trampa: true
            mensaje: |
              Esa es la suma de Cesàro, o la de Abel, que son otra cosa: asignan
              un número a series que **no** convergen. Que una sucesión oscile
              entre $0$ y $1$ significa exactamente que no tiene límite, y por
              tanto que la serie diverge. Es un caso clásico y conviene saber
              nombrarlo, pero la respuesta al apartado b) es $(-1,1)$.

    resolucion: |
      **a) El desarrollo.** No hay nada que calcular si se reconoce la fórmula
      de la suma de una progresión geométrica leída al revés:

      $$
      \frac{1}{1-x}=\sum_{n=0}^{\infty}x^{n}=1+x+x^{2}+x^{3}+\cdots
      $$

      Y si se quiere la comprobación formal, sale igual de limpia:

      $$
      f^{(n)}(x)=\frac{n!}{(1-x)^{n+1}}
      \;\Longrightarrow\;
      f^{(n)}(0)=n!
      \;\Longrightarrow\;
      a_{n}=\frac{f^{(n)}(0)}{n!}=1
      $$

      **b) Dónde converge.** Una geométrica de razón $r$ converge si y solo si
      $\left|r\right|<1$. Aquí $r=x$, así que la serie converge exactamente para

      $$
      -1<x<1
      $$

      Y los dos extremos hay que mirarlos uno a uno, porque el criterio no dice
      nada de ellos:

      - en $x=1$ la serie es $1+1+1+\cdots$: el término general no tiende a cero
        y diverge;
      - en $x=-1$ es $1-1+1-1+\cdots$: las sumas parciales valen $1,0,1,0,\ldots$
        y no tienen límite, así que también diverge.

      El intervalo de convergencia es $(-1,1)$, **abierto por los dos lados**.

      **Por qué es la serie que más se usa.** Casi todos los desarrollos del
      curso salen de esta: cambiando $x$ por $-x$ se obtiene
      $\frac{1}{1+x}$; integrándola, $\ln(1+x)$; cambiando $x$ por $-x^{2}$ y
      luego integrando, el arcotangente. Merece la pena tenerla en la cabeza con
      su intervalo pegado.

  - id: ex2526-ord-4-el-valor-medio-y-los-tres-volumenes
