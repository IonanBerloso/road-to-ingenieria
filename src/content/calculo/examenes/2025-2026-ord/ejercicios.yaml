      Sean:

      $V_{1}$: volumen del sólido de revolución que se obtiene al girar el
      fragmento de la gráfica de $f(x)$ para $x\in[a,c]$ alrededor de la recta
      $y=M$.

      $V_{2}$: volumen del sólido de revolución que se obtiene al girar el
      fragmento de la gráfica de $f(x)$ para $x\in[c,b]$ alrededor de la recta
      $y=M$.

      $V$: volumen del sólido de revolución que se obtiene al girar la gráfica
      completa de $f(x)$ alrededor del eje $X$.

      a) Considerar la función definida por
      $F(x)=\displaystyle\int_{a}^{x}\left(f(u)\right)^{2}du$, $a\le x\le b$.
      Estudiar:

      a.1. El crecimiento y los extremos de $F(x)$.

      a.2. La concavidad y los puntos de inflexión de $F(x)$.

      b) Demostrar analíticamente que $V=V_{1}+V_{2}+\pi M^{2}(b-a)$.
    pide: El crecimiento y la concavidad de F, y la demostración de la identidad.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuánto vale $F'(x)$?
        opciones:
          - texto: >-
              $F'(x)=\left(f(x)\right)^{2}$, por el teorema fundamental del
              cálculo
            correcta: true
            mensaje: |
              Eso es. El integrando es $\left(f(u)\right)^{2}$, así que la
              derivada de la integral es ese integrando evaluado en el extremo
              superior. Y como es un cuadrado, nunca es negativo.
          - texto: >-
              $F'(x)=2f(x)f'(x)$
            mensaje: |
              Esa es la derivada de $\left(f(x)\right)^{2}$, que es otra cosa.
              $F$ es una **integral** de ese cuadrado, no el cuadrado.
          - texto: >-
              $F'(x)=f(x)$
            mensaje: |
              Eso valdría si el integrando fuera $f(u)$. Aquí está elevado al
              cuadrado, y el cuadrado se queda.

      - tipo: calcular
        titulo: Extremos relativos de F
        pregunta: |
          Según la figura, $f>0$ en todo $[a,b]$. ¿Cuántos extremos relativos
          tiene $F$ en el intervalo abierto $(a,b)$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Has copiado el máximo de $f$. Pero $F$ no es $f$: su derivada es
              $f^{2}$, que ahí no se anula ni cambia de signo. Donde $f$ tiene su
              máximo, $F$ tiene un punto de inflexión, no un extremo.
          - valor: '2'
            mensaje: |
              $F'=f^{2}>0$ en todo el intervalo: $F$ es estrictamente creciente y
              no puede tener ningún extremo interior. Sus valores extremos están
              en los bordes, $F(a)=0$ y $F(b)$.
        pista: |
          ¿Puede cambiar de signo un cuadrado?
        desarrollo: |
          $F'(x)=\left(f(x)\right)^{2}\ge 0$, y con $f>0$ en $[a,b]$ es
          **estrictamente** positiva. Por tanto $F$ es estrictamente creciente en
          todo $[a,b]$ y no tiene ningún extremo relativo en el interior: el
          mínimo absoluto es $F(a)=0$ y el máximo absoluto es $F(b)$, los dos en
          los extremos del intervalo.

      - tipo: calcular
        titulo: Puntos de inflexión de F
        pregunta: |
          ¿Cuántos puntos de inflexión tiene $F$ en $(a,b)$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              $F''=2ff'$, y con $f>0$ el signo es el de $f'$. En la figura $f$
              sube y luego baja, así que $f'$ cambia de signo una vez: ahí hay
              inflexión.
          - valor: '2'
            mensaje: |
              $f'$ solo cambia de signo una vez en la figura, en su máximo. El
              punto $c$ no cuenta: ahí $f$ corta a la recta $y=M$, que no tiene
              nada que ver con la concavidad de $F$.
        pista: |
          Deriva otra vez: $F''=2ff'$, y mira dónde cambia de signo con $f>0$.
        desarrollo: |
          $$
          F''(x)=2f(x)f'(x)
          $$

          Como $f>0$, el signo de $F''$ es el de $f'$. En la figura $f$ crece
          desde $a$ hasta su máximo y decrece después, así que $f'$ cambia de
          signo **una vez**, en ese máximo: ahí $F$ pasa de cóncava hacia arriba
          a cóncava hacia abajo. Un punto de inflexión.

      - tipo: justificar
        titulo: La demostración del apartado b)
        pregunta: Ordena la demostración. Una pieza es falsa.
        piezas:
          - texto: >-
              Girando alrededor del eje $X$,
              $V=\pi\displaystyle\int_{a}^{b}\left(f(x)\right)^{2}dx$.
          - texto: >-
              Girando alrededor de la recta $y=M$, el radio en cada $x$ es
              $\left|f(x)-M\right|$, así que
              $V_{1}+V_{2}=\pi\displaystyle\int_{a}^{b}\left(f(x)-M\right)^{2}dx$
              — el punto $c$ solo parte la integral en dos trozos.
          - texto: >-
              Desarrollando el cuadrado,
              $V_{1}+V_{2}=\pi\displaystyle\int_{a}^{b}f^{2}
              -2\pi M\displaystyle\int_{a}^{b}f
              +\pi M^{2}(b-a)$.
          - texto: >-
              Y la definición de valor medio,
              $M=\frac{1}{b-a}\displaystyle\int_{a}^{b}f$, da
              $\displaystyle\int_{a}^{b}f=M(b-a)$.
          - texto: >-
              Sustituyendo,
              $V_{1}+V_{2}=V-2\pi M^{2}(b-a)+\pi M^{2}(b-a)=V-\pi M^{2}(b-a)$,
              que es lo que se quería.
          - texto: >-
              Como $V_{1}$ y $V_{2}$ recorren juntos toda la gráfica, su suma es
              $V$.
            trampa: true
            mensaje: |
              Recorren toda la gráfica, sí, pero **giran alrededor de otro eje**:
              la recta $y=M$, no el eje $X$. El radio no es $f(x)$ sino
              $f(x)-M$, y por eso $V_{1}+V_{2}$ sale más pequeño que $V$ — la
              diferencia es exactamente el $\pi M^{2}(b-a)$ del enunciado, que es
              el volumen del cilindro de radio $M$ y longitud $b-a$.

    resolucion: |
      **a.1. Crecimiento de $F$.** Por el teorema fundamental del cálculo,

      $$
      F'(x)=\left(f(x)\right)^{2}
      $$

      Un cuadrado nunca es negativo, y en la figura $f>0$ en todo $[a,b]$, así
      que $F'>0$: **$F$ es estrictamente creciente**. No tiene extremos
      relativos en el interior; su mínimo es $F(a)=0$ y su máximo $F(b)$, los dos
      en los bordes.

      Conviene decir por qué $F(a)=0$: una integral entre $a$ y $a$ vale cero
      sea cual sea el integrando.

      **a.2. Concavidad de $F$.**

      $$
      F''(x)=2f(x)f'(x)
      $$

      y con $f>0$ el signo es el de $f'$. En la figura $f$ crece desde $a$,
      alcanza un máximo pasado $c$, y decrece hasta $b$. Por tanto:

      - $F$ es cóncava hacia arriba mientras $f$ crece,
      - cóncava hacia abajo mientras $f$ decrece,
      - y tiene **un** punto de inflexión, justo donde $f$ alcanza su máximo.

      El punto $c$ no interviene: ahí lo que pasa es que $f$ cruza la recta
      $y=M$, y eso no dice nada de $F$.

      **b) La identidad de los volúmenes.** Los tres son integrales de discos, y
      lo único que cambia es el radio.

      Alrededor del eje $X$ el radio es $f(x)$:

      $$
      V=\pi\int_{a}^{b}\left(f(x)\right)^{2}dx
      $$

      Alrededor de la recta $y=M$ el radio es la distancia a esa recta,
      $\left|f(x)-M\right|$. El punto $c$ solo parte el intervalo en dos, así que

      $$
      V_{1}+V_{2}=\pi\int_{a}^{c}\left(f-M\right)^{2}dx
      +\pi\int_{c}^{b}\left(f-M\right)^{2}dx
      =\pi\int_{a}^{b}\left(f-M\right)^{2}dx
      $$

      Desarrollando el cuadrado:

      $$
      V_{1}+V_{2}=\pi\int_{a}^{b}f^{2}\,dx
      -2\pi M\int_{a}^{b}f\,dx
      +\pi M^{2}(b-a)
      $$

      Y aquí entra la única hipótesis que se ha usado del enunciado: **$M$ es el
      valor medio**, es decir

      $$
      M=\frac{1}{b-a}\int_{a}^{b}f\,dx
      \qquad\Longrightarrow\qquad
      \int_{a}^{b}f\,dx=M(b-a)
      $$

      Sustituyendo:

      $$
      V_{1}+V_{2}=V-2\pi M^{2}(b-a)+\pi M^{2}(b-a)=V-\pi M^{2}(b-a)
      $$

      $$
      \boxed{V=V_{1}+V_{2}+\pi M^{2}(b-a)}
      $$

      **Lo que significa el término que sobra.** $\pi M^{2}(b-a)$ es el volumen
      del cilindro de radio $M$ y longitud $b-a$: el sólido que se obtendría
      girando la propia recta $y=M$ alrededor del eje $X$. Girar alrededor del
      valor medio en vez de alrededor del eje quita exactamente ese cilindro
      — ni más ni menos, y solo porque $M$ es el valor **medio**. Con cualquier
      otra recta $y=k$ la identidad sería falsa: sobraría un
      $2\pi(k-M)k(b-a)$ que no se cancela.

  - id: ex2526-ord-5-el-solido-bajo-la-tapa
    titulo: Un sólido con tapa plana y fondo de paraboloide
    fuente: >-
      Ejercicio 1 del SEGUNDO PARCIAL · Convocatoria ordinaria, 9 de junio de 2026 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea $S$ el sólido definido por las condiciones
      $x^{2}+y^{2}\le a$; $a-(x^{2}+y^{2})<z<a$, donde $a>0$.

      a) Dibujar el sólido $S$.

      b) Calcular el volumen de $S$.

      c) Sabiendo que el sólido está fabricado enteramente con el mismo material
      y que la tercera coordenada del centro de gravedad es $z_{G}=\dfrac{3}{4}$,
      calcular el valor de $a$.
    pide: El dibujo, el volumen y el valor de a.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué sólido describen esas dos condiciones?
        opciones:
          - texto: >-
              El que queda entre el paraboloide $z=a-(x^{2}+y^{2})$, por debajo,
              y el plano $z=a$, por encima, sobre el disco de radio $\sqrt{a}$
            correcta: true
            mensaje: |
              Eso es. El paraboloide se abre hacia abajo con el vértice en
              $(0,0,a)$ y toca $z=0$ justo en el borde del disco, donde
              $x^{2}+y^{2}=a$. Entre él y la tapa plana queda un cuenco al
              revés: ancho arriba y en punta abajo.
          - texto: >-
              Un cilindro de radio $\sqrt{a}$ y altura $a$
            mensaje: |
              Ese sería el sólido si el fondo fuera plano, $0<z<a$. Aquí el
              fondo sube según se acerca al eje: en el centro el sólido tiene
              altura cero, y en el borde, altura $a$.
          - texto: >-
              Media esfera de radio $\sqrt{a}$
            mensaje: |
              Un paraboloide no es una esfera: su altura baja como el
              **cuadrado** del radio, no como una raíz. Y aquí el sólido está
              además cortado por una tapa plana.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Con $a=2$, ¿cuánto vale el volumen de $S$?
        respuesta:
          tipo: numero
          valor: '6.2831853'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '12.5663706'
            mensaje: |
              Te has dejado el $\frac12$: el volumen es $\frac{\pi a^{2}}{2}$, no
              $\pi a^{2}$. Sale de $\int_{0}^{\sqrt a}r^{3}dr=\frac{a^{2}}{4}$
              multiplicado por $2\pi$.
          - valor: '17.7715317'
            mensaje: |
              Ese es el volumen del cilindro completo, $\pi\left(\sqrt
              a\right)^{2}a=\pi a^{2}$… no: es $\pi a^{2}$ con $a=2$ mal
              elevado. Comprueba que la altura del sólido en cada punto es
              $a-\left(a-r^{2}\right)=r^{2}$, y que en el centro vale cero.
          - valor: '4.1887902'
            mensaje: |
              Parece la fórmula de una media esfera, $\frac{2}{3}\pi R^{3}$. El
              fondo es un paraboloide, no una esfera.
        pista: |
          En cada punto del disco la altura del sólido es
          $a-\left(a-r^{2}\right)=r^{2}$. Integra en polares.
        desarrollo: |
          La altura entre las dos superficies es

          $$
          a-\left(a-r^{2}\right)=r^{2}
          $$

          así que, en polares y sobre el disco $0\le r\le\sqrt{a}$,

          $$
          V=\int_{0}^{2\pi}\!\!\int_{0}^{\sqrt a}r^{2}\cdot r\,dr\,d\theta
          =2\pi\left[\frac{r^{4}}{4}\right]_{0}^{\sqrt a}
          =2\pi\frac{a^{2}}{4}=\frac{\pi a^{2}}{2}
          $$

          Con $a=2$: $V=\frac{\pi\cdot 4}{2}=2\pi\approx 6{,}2832$.

      - tipo: calcular
        titulo: El valor de a
        pregunta: |
          Con $z_{G}=\dfrac{3}{4}$, ¿cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '1.125'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              Has multiplicado en vez de dividir: $\frac34\cdot\frac23$. La
              relación es $z_{G}=\frac{2a}{3}$, así que
              $a=\frac{3}{2}z_{G}=\frac32\cdot\frac34$.
          - valor: '1.5'
            mensaje: |
              Has usado $z_{G}=\frac{a}{2}$, que es lo que valdría si el sólido
              fuera un cilindro. Aquí hay más material arriba que abajo y el
              centro de gravedad sube hasta $\frac{2a}{3}$.
          - valor: '2.25'
            mensaje: |
              Has multiplicado por $3$ en vez de por $\frac32$. De
              $\frac{2a}{3}=\frac34$ sale $2a=\frac94$ y $a=\frac98$.
        pista: |
          Calcula primero $z_{G}$ en función de $a$; te saldrá una fracción
          sencilla.
        desarrollo: |
          $$
          \iiint_{S}z\,dV
          =\int_{0}^{2\pi}\!\!\int_{0}^{\sqrt a}
          \left[\frac{z^{2}}{2}\right]_{a-r^{2}}^{a} r\,dr\,d\theta
          =\pi\int_{0}^{\sqrt a}\left(2ar^{2}-r^{4}\right)r\,dr
          $$

          $$
          =\pi\left[\frac{2a\,r^{4}}{4}-\frac{r^{6}}{6}\right]_{0}^{\sqrt a}
          =\pi\left(\frac{a^{3}}{2}-\frac{a^{3}}{6}\right)=\frac{\pi a^{3}}{3}
          $$

          $$
          z_{G}=\frac{\frac{\pi a^{3}}{3}}{\frac{\pi a^{2}}{2}}=\frac{2a}{3}
          $$

          $$
          \frac{2a}{3}=\frac34
          \;\Longrightarrow\;
          a=\frac98=1{,}125
          $$

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              **a)** El paraboloide $z=a-(x^{2}+y^{2})$ tiene el vértice en
              $(0,0,a)$ y llega a $z=0$ en el borde del disco
              $x^{2}+y^{2}=a$; el sólido es lo que queda entre él y la tapa
              plana $z=a$.
          - texto: >-
              La altura del sólido en cada punto es
              $a-\left(a-r^{2}\right)=r^{2}$: cero en el eje y $a$ en el borde.
          - texto: >-
              **b)** $V=\displaystyle\int_{0}^{2\pi}\!\!\int_{0}^{\sqrt
              a}r^{2}\cdot r\,dr\,d\theta=\frac{\pi a^{2}}{2}$.
          - texto: >-
              **c)** Como el material es homogéneo, la masa se cancela y
              $z_{G}=\frac{1}{V}\iiint_{S}z\,dV$.
          - texto: >-
              Esa integral vale $\frac{\pi a^{3}}{3}$, así que
              $z_{G}=\frac{2a}{3}$ y de $\frac{2a}{3}=\frac34$ sale
              $a=\frac98$.
          - texto: >-
              Como el material es homogéneo, el centro de gravedad está a media
              altura del sólido, es decir en $z_{G}=\frac{a}{2}$.
            trampa: true
            mensaje: |
              Homogéneo significa que la densidad es la misma en todas partes, no
              que haya la misma cantidad de material a cada altura. Y aquí no la
              hay: cerca de la tapa el sólido es un disco ancho y cerca del
              vértice es casi un punto. Por eso el centro de gravedad se va hacia
              arriba, hasta $\frac{2a}{3}$, y no se queda en $\frac a2$.

    resolucion: |
      **a) El sólido.** La condición $x^{2}+y^{2}\le a$ dice que la sombra es el
      disco de radio $\sqrt{a}$. Y entre ese disco y la tapa plana $z=a$ está el
      paraboloide $z=a-(x^{2}+y^{2})$, que se abre hacia abajo con el vértice en
      $(0,0,a)$ y llega a $z=0$ justo en el borde del disco.

      El sólido es lo que queda **entre** los dos: en el eje tiene altura cero
      —el paraboloide toca la tapa— y en el borde tiene altura $a$. Es un cuenco
      al revés, o el hueco que dejaría un paraboloide dentro de un cilindro.

