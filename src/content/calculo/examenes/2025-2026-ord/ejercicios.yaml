      <figcaption>
      Figura nuestra: el examen manda dibujar el sólido y no trae ninguna. El
      corte por el plano y = 0 es lo que se integra.
      </figcaption>
      </figure>

      **b) El volumen.** La altura en cada punto es la diferencia entre las dos
      superficies:

      $$
      a-\left(a-r^{2}\right)=r^{2}
      $$

      En polares, sobre el disco:

      $$
      V=\int_{0}^{2\pi}\!\!\int_{0}^{\sqrt a}r^{2}\cdot r\,dr\,d\theta
      =2\pi\cdot\frac{\left(\sqrt a\right)^{4}}{4}
      =\frac{\pi a^{2}}{2}
      $$

      **c) El centro de gravedad.** Con densidad constante, la densidad se
      cancela y

      $$
      z_{G}=\frac{1}{V}\iiint_{S}z\,dV
      $$

      Integrando primero en $z$, entre las dos superficies:

      $$
      \iiint_{S}z\,dV
      =\int_{0}^{2\pi}\!\!\int_{0}^{\sqrt a}
      \frac{a^{2}-\left(a-r^{2}\right)^{2}}{2}\,r\,dr\,d\theta
      =\pi\int_{0}^{\sqrt a}\left(2ar^{2}-r^{4}\right)r\,dr
      =\frac{\pi a^{3}}{3}
      $$

      $$
      z_{G}=\frac{\pi a^{3}/3}{\pi a^{2}/2}=\frac{2a}{3}
      $$

      y con $z_{G}=\frac34$,

      $$
      a=\frac{3}{2}\cdot\frac{3}{4}=\frac{9}{8}=1{,}125
      $$

      **Un control barato.** $z_{G}=\frac{2a}{3}$ tiene que estar entre $0$ y
      $a$, y lo está; y tiene que estar por **encima** de la mitad, porque hay
      mucho más material cerca de la tapa que cerca del vértice. Si hubiera
      salido menos de $\frac a2$, habría que revisar el cálculo antes de seguir.

  - id: ex2526-ord-6-el-dron-del-fondo-del-mar
    titulo: El dron, la trayectoria de máxima pendiente y un trabajo que no la mira
    fuente: >-
      Ejercicio 2 del SEGUNDO PARCIAL · Convocatoria ordinaria, 9 de junio de 2026 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Un dron ha sufrido un accidente y se encuentra en el fondo del mar, en un
      punto $P$ desconocido. El dron está equipado con una baliza que emite una
      señal. El plan de rescate consiste en seguir una trayectoria submarina
      siguiendo el mayor aumento en la intensidad de dicha señal, hasta llegar a
      $P$. Se sabe que el valor de la intensidad de la señal en cada punto
      $(x,y,z)$ viene dada por la función
      $I(x,y,z)=2x^{2}+3y^{2}+z^{2}+x+y+z$. El equipo de rescate parte del punto
      $(0,0,0)$.

      a) Calcular la trayectoria que debe seguirse.

      b) Supongamos que se ha encontrado el dron a una profundidad
      $z=0{,}5(e^{2}-1)$ km. Calcular las otras dos coordenadas de $P$.

      c) Supongamos que las corrientes marinas producen un campo de fuerza dado
      por el vector
      $V(x,y,z)=\left(yz-ye^{-xy},\ xz-xe^{-xy},\ xy\right)$. Calcular el trabajo
      que ha realizado esta fuerza a lo largo de la trayectoria que se ha
      seguido.
    pide: La trayectoria, el punto P y el trabajo del campo.

    pasos:
      - tipo: reconocer
        pregunta: |
          «Seguir el mayor aumento de la intensidad» ¿en qué se traduce?
        opciones:
          - texto: >-
              En que el vector tangente a la trayectoria es paralelo al
              gradiente en cada punto, es decir
              $\frac{dx}{I_{x}}=\frac{dy}{I_{y}}=\frac{dz}{I_{z}}$
            correcta: true
            mensaje: |
              Eso es. El gradiente apunta en la dirección de máximo crecimiento,
              así que la trayectoria que lo sigue tiene en cada punto esa
              dirección. Igualando los cocientes salen dos ecuaciones
              diferenciales de variables separadas.
          - texto: >-
              En seguir una curva de nivel de $I$
            mensaje: |
              Justo lo contrario: sobre una curva de nivel la intensidad **no
              cambia**. La trayectoria de máximo crecimiento cruza las
              superficies de nivel perpendicularmente.
          - texto: >-
              En ir en línea recta hacia el punto donde $\nabla I=0$
            mensaje: |
              El punto donde el gradiente se anula es el mínimo de $I$, y además
              la trayectoria de máxima pendiente no es una recta salvo que el
              campo lo sea. Aquí es una curva.

      - tipo: calcular
        titulo: La abscisa del dron
        pregunta: |
          Con $z=0{,}5\left(e^{2}-1\right)$, ¿cuánto vale la coordenada $x$ de
          $P$?
        respuesta:
          tipo: numero
          valor: '13.3995375'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '13.6495375'
            mensaje: |
              Te has dejado el $-1$. De $4x+1=(2z+1)^{2}=e^{4}$ sale
              $x=\frac{e^{4}-1}{4}$, no $\frac{e^{4}}{4}$.
          - valor: '54.5981500'
            mensaje: |
              Ese es $e^{4}$ a secas, que es $4x+1$. Falta despejar $x$.
          - valor: '27.2990750'
            mensaje: |
              Has dividido entre $2$ en vez de entre $4$. El coeficiente viene de
              $I_{x}=4x+1$.
        pista: |
          Integra $\frac{dx}{4x+1}=\frac{dz}{2z+1}$ desde $(0,0,0)$; te quedará
          $4x+1=(2z+1)^{2}$.
        desarrollo: |
          $\nabla I=(4x+1,\;6y+1,\;2z+1)$. De
          $\frac{dx}{4x+1}=\frac{dz}{2z+1}$:

          $$
          \frac14\ln(4x+1)=\frac12\ln(2z+1)+C
          \;\Longrightarrow\;
          4x+1=K\left(2z+1\right)^{2}
          $$

          y el punto de partida $(0,0,0)$ da $K=1$. Con
          $2z+1=e^{2}-1+1=e^{2}$:

          $$
          4x+1=e^{4}
          \;\Longrightarrow\;
          x=\frac{e^{4}-1}{4}\approx 13{,}3995
          $$

      - tipo: calcular
        titulo: El trabajo del campo
        pregunta: |
          ¿Cuánto vale el trabajo de $V$ a lo largo de la trayectoria?
        respuesta:
          tipo: numero
          valor: '2870.0073926'
          tolerancia: 0.01
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '2871.0073926'
            mensaje: |
              Te falta restar el potencial en el punto de partida. En $(0,0,0)$
              vale $f=0+e^{0}=1$, no cero: el término $e^{-xy}$ no se anula ahí.
          - valor: '-2870.0073926'
            mensaje: |
              Signo. El trabajo es $f(\text{final})-f(\text{inicial})$, y el
              final es $P$.
          - valor: '0'
            mensaje: |
              Valdría cero si la trayectoria fuera cerrada, y no lo es: va del
              origen a $P$. El campo sí es conservativo, pero eso solo significa
              que no importa **por dónde** se llegue.
        pista: |
          Comprueba si $V$ deriva de un potencial antes de plantearte
          parametrizar la trayectoria del apartado a).
        desarrollo: |
          El campo es conservativo, con potencial

          $$
          f(x,y,z)=xyz+e^{-xy}
          $$

          que se comprueba derivando: $f_{x}=yz-ye^{-xy}$,
          $f_{y}=xz-xe^{-xy}$, $f_{z}=xy$. Por tanto

          $$
          W=f(P)-f(0,0,0)
          =\left(xyz+e^{-xy}\right)-1
          $$

          Con $x=\frac{e^{4}-1}{4}$, $y=\frac{e^{6}-1}{6}$ y
          $z=\frac{e^{2}-1}{2}$:

          $$
          xyz=\frac{\left(e^{4}-1\right)\left(e^{6}-1\right)\left(e^{2}-1\right)}{48}
          \approx 2871{,}0074
          $$

          y $e^{-xy}$ es un $e$ elevado a menos novecientos y pico: cero a todos
          los efectos. Así que

          $$
          W\approx 2871{,}0074-1=2870{,}0074
          $$

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              **a)** $\nabla I=(4x+1,\,6y+1,\,2z+1)$, y la trayectoria de máximo
              crecimiento cumple
              $\frac{dx}{4x+1}=\frac{dy}{6y+1}=\frac{dz}{2z+1}$.
          - texto: >-
              Integrando por parejas y usando que pasa por el origen:
              $4x+1=(2z+1)^{2}$ y $6y+1=(2z+1)^{3}$.
          - texto: >-
              **b)** Con $z=\frac{e^{2}-1}{2}$ es $2z+1=e^{2}$, así que
              $x=\frac{e^{4}-1}{4}$ e $y=\frac{e^{6}-1}{6}$.
          - texto: >-
              **c)** El campo $V$ es conservativo y su potencial es
              $f=xyz+e^{-xy}$, como se comprueba derivando las tres
              componentes.
          - texto: >-
              Por tanto $W=f(P)-f(0,0,0)=xyz+e^{-xy}-1\approx 2870{,}0074$.
          - texto: >-
              Como la trayectoria del apartado a) es una curva complicada, hay
              que parametrizarla para poder calcular el trabajo.
            trampa: true
            mensaje: |
              No hace falta, y eso es lo que el ejercicio quiere que veas. Al ser
              el campo conservativo, el trabajo solo depende de los extremos: el
              apartado a) sirve para localizar $P$, y una vez localizado la curva
              **no vuelve a aparecer**. Parametrizar
              $4x+1=(2z+1)^{2}$ y meterla en la integral es media hora tirada.

    resolucion: |
      **a) La trayectoria.** El gradiente apunta en la dirección de máximo
      crecimiento:

      $$
      \nabla I=\left(4x+1,\;6y+1,\;2z+1\right)
      $$

      Que la trayectoria lo siga significa que su vector tangente es paralelo a
      $\nabla I$ en cada punto, es decir

      $$
      \frac{dx}{4x+1}=\frac{dy}{6y+1}=\frac{dz}{2z+1}
      $$

      Son dos ecuaciones de variables separadas. De la primera con la tercera:

      $$
      \frac14\ln(4x+1)=\frac12\ln(2z+1)+C
      \;\Longrightarrow\;
      4x+1=K_{1}(2z+1)^{2}
      $$

      y de la segunda con la tercera:

      $$
      \frac16\ln(6y+1)=\frac12\ln(2z+1)+C'
      \;\Longrightarrow\;
      6y+1=K_{2}(2z+1)^{3}
      $$

      El punto de partida $(0,0,0)$ da $K_{1}=K_{2}=1$:

      $$
      4x+1=(2z+1)^{2},
      \qquad
      6y+1=(2z+1)^{3}
      $$

      **b) El punto $P$.** Con $z=\frac{e^{2}-1}{2}$ es $2z+1=e^{2}$, y

      $$
      x=\frac{e^{4}-1}{4}\approx 13{,}3995,
      \qquad
      y=\frac{e^{6}-1}{6}\approx 67{,}0715
      $$

      **c) El trabajo.** Antes de tocar la trayectoria, la comprobación de
      siempre. El campo

      $$
      V=\left(yz-ye^{-xy},\;xz-xe^{-xy},\;xy\right)
      $$

      deriva del potencial

      $$
      f(x,y,z)=xyz+e^{-xy}
      $$

      —derívalo y salen las tres componentes—. Por tanto el trabajo no depende
      del camino:

      $$
      W=f(P)-f(0,0,0)
      =\left(xyz+e^{-xy}\right)-\left(0+e^{0}\right)
      =xyz+e^{-xy}-1
      $$

      $$
      xyz=\frac{\left(e^{4}-1\right)\left(e^{6}-1\right)\left(e^{2}-1\right)}{48}
      \approx 2871{,}0074
      $$

      y $e^{-xy}$, con $xy\approx 900$, es cero a todos los efectos. Queda

      $$
      W\approx 2870{,}0074
      $$

      **Lo que hace difícil este ejercicio** no es ninguna cuenta: es darse
      cuenta de que el apartado c) **no usa** el apartado a). La trayectoria hay
      que calcularla para localizar $P$, y una vez localizado deja de importar.
      Quien no compruebe que el campo es conservativo se pone a parametrizar una
      curva de tercer grado y no acaba.

  - id: ex2526-ord-7-laplace-con-coeficientes-variables
    titulo: Una ecuación con la t delante, y por eso Laplace
    fuente: >-
      Ejercicio 3 del SEGUNDO PARCIAL · Convocatoria ordinaria, 9 de junio de 2026 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Resolver la ecuación

      $$
      t\,y''(t)+(1-2t)\,y'(t)-2\,y(t)=0,
      \qquad y(0)=1,\qquad y'(0)=2
      $$
    pide: La solución del problema de valor inicial.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué no sirve aquí la ecuación característica?
        opciones:
          - texto: >-
              Porque los coeficientes no son constantes: el de $y''$ es $t$ y el
              de $y'$ es $1-2t$
            correcta: true
            mensaje: |
              Exacto. La característica solo vale para coeficientes constantes.
              Con una $t$ multiplicando, la herramienta es la transformada de
              Laplace, que convierte $t\,f(t)$ en $-\frac{d}{ds}F(s)$.
          - texto: >-
              Porque la ecuación es de segundo orden y homogénea
            mensaje: |
              Al revés: de segundo orden y homogénea es el caso más cómodo… si
              los coeficientes fueran constantes. Lo que estorba es la $t$.
          - texto: >-
              Porque las condiciones iniciales están en $t=0$, donde el
              coeficiente de $y''$ se anula
            mensaje: |
              Es cierto que en $t=0$ el coeficiente principal se anula —el punto
              es singular— y eso merece un comentario en COMP4. Pero el motivo de
              que la característica no sirva es anterior: los coeficientes
              dependen de $t$.

      - tipo: calcular
        titulo: El exponente de la solución
        pregunta: |
          La solución resulta ser $y(t)=e^{kt}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              Signo. La transformada sale $Y=\frac{1}{s-2}$, cuyo polo está en
              $s=+2$, y $\mathcal{L}^{-1}\left\{\frac{1}{s-2}\right\}=e^{2t}$.
          - valor: '1'
            mensaje: |
              Con $y=e^{t}$ las condiciones iniciales no cuadran: daría
              $y'(0)=1$ y el enunciado pide $2$.
          - valor: '0.5'
            mensaje: |
              Comprueba con la condición inicial: $y'(0)=k\,e^{0}=k$, y el
              enunciado dice que vale $2$.
        pista: |
          Las dos condiciones iniciales tienen que cumplirse a la vez:
          $y(0)=1$ e $y'(0)=2$.
        desarrollo: |
          Con $y=e^{kt}$ es $y(0)=1$ para cualquier $k$, y $y'(0)=k$. La segunda
          condición fuerza $k=2$.

          Y se comprueba en la ecuación: con $y=e^{2t}$,

          $$
          t\cdot 4e^{2t}+(1-2t)\cdot 2e^{2t}-2e^{2t}
          =\left(4t+2-4t-2\right)e^{2t}=0
          \quad\checkmark
          $$

      - tipo: calcular
        titulo: El valor en t = 1
        pregunta: |
          ¿Cuánto vale $y(1)$?
        respuesta:
          tipo: numero
          valor: '7.3890561'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '2.7182818'
            mensaje: |
              Ese es $e$, que saldría con $y=e^{t}$. El exponente lleva un $2$.
          - valor: '54.5981500'
            mensaje: |
              Ese es $e^{4}$: has elevado el exponente al cuadrado en vez de
              multiplicarlo por $t=1$.
          - valor: '4'
            mensaje: |
              Has calculado $2^{2}$. La solución es una exponencial de base $e$,
              no de base $2$.
        pista: |
          Sustituye $t=1$ en la solución.
        desarrollo: |
          $$
          y(1)=e^{2}\approx 7{,}3891
          $$

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Los coeficientes dependen de $t$, así que la ecuación
              característica no sirve: se transforma con Laplace, que convierte
              $t\,f(t)$ en $-\frac{d}{ds}F(s)$.
          - texto: >-
              $\mathcal{L}\left\{t\,y''\right\}=-\frac{d}{ds}
              \left(s^{2}Y-s-2\right)=-2sY-s^{2}Y'+1$ y
              $\mathcal{L}\left\{t\,y'\right\}=-\frac{d}{ds}\left(sY-1\right)
              =-Y-sY'$.
          - texto: >-
              Sustituyendo y agrupando, todo se cancela menos
              $\left(2s-s^{2}\right)Y'-sY=0$.
          - texto: >-
              Dividiendo entre $s$ queda $(2-s)Y'=Y$, que es de variables
              separadas: $\frac{Y'}{Y}=\frac{1}{2-s}$ y
              $Y=\frac{K}{2-s}$.
          - texto: >-
              Antitransformando, $y(t)=Ae^{2t}$, y la condición $y(0)=1$ da
              $A=1$: la solución es $y(t)=e^{2t}$, que además cumple $y'(0)=2$.
          - texto: >-
              La transformación de Laplace convierte la ecuación en una ecuación
              **algebraica** en $Y$, como siempre.
            trampa: true
            mensaje: |
              Aquí no. Cuando los coeficientes llevan $t$, Laplace produce
              **derivadas respecto de $s$**: el resultado es otra ecuación
              diferencial, de primer orden en $Y(s)$. Es un buen negocio —se pasa
              de segundo orden con coeficientes variables a primer orden y
              separable— pero no es la simplificación habitual, y decirlo es
              parte de COMP4.

    resolucion: |
      **Por qué Laplace.** Los coeficientes dependen de $t$, así que la ecuación
      característica no se puede usar. La transformada de Laplace sí sirve, y
      precisamente por la propiedad que aquí parece un estorbo:

      $$
      \mathcal{L}\left\{t\,f(t)\right\}=-\frac{d}{ds}F(s)
      $$

      **La transformación.** Con $Y=\mathcal{L}\{y\}$, $y(0)=1$ e $y'(0)=2$:

      $$
      \mathcal{L}\left\{y''\right\}=s^{2}Y-s-2,
      \qquad
      \mathcal{L}\left\{y'\right\}=sY-1
      $$

      $$
      \mathcal{L}\left\{t\,y''\right\}
      =-\frac{d}{ds}\left(s^{2}Y-s-2\right)
      =-2sY-s^{2}Y'+1
      $$

      $$
      \mathcal{L}\left\{t\,y'\right\}
      =-\frac{d}{ds}\left(sY-1\right)=-Y-sY'
      $$

      Y la ecuación entera, término a término:

      $$
      \left(-2sY-s^{2}Y'+1\right)
      +\left(sY-1\right)
      -2\left(-Y-sY'\right)
      -2Y=0
      $$

      Sale todo cancelándose de forma casi sospechosa: los términos
      independientes se van, los de $Y$ se reducen a $-sY$ y los de $Y'$ a
      $\left(2s-s^{2}\right)Y'$:

      $$
      \left(2s-s^{2}\right)Y'-sY=0
      $$

      **La ecuación en $Y$.** Dividiendo entre $s$ —lícito porque interesa
      $s>2$—:

      $$
      (2-s)Y'=Y
      \;\Longrightarrow\;
      \frac{Y'}{Y}=\frac{1}{2-s}
      \;\Longrightarrow\;
      \ln Y=-\ln(2-s)+c
      \;\Longrightarrow\;
      Y=\frac{K}{2-s}
      $$

      Escrito con el signo cómodo, $Y=\dfrac{A}{s-2}$, y antitransformando:

      $$
      y(t)=A\,e^{2t}
      $$

      **Las condiciones iniciales.** $y(0)=A=1$, luego

      $$
      \boxed{y(t)=e^{2t}}
      $$

      y de propina $y'(0)=2$ se cumple sola, que es la comprobación de que no
      hay error de signo.

      **Dos cosas para COMP4.** La primera: aquí Laplace **no** convierte la
      ecuación en algebraica, la convierte en otra ecuación diferencial —de
      primer orden y separable— porque los coeficientes llevan $t$. La segunda:
      $t=0$ es un punto singular, porque ahí se anula el coeficiente de $y''$;
      eso explica que las dos condiciones iniciales no sean independientes
      —de hecho la ecuación evaluada en $t=0$ obliga a $y'(0)=2y(0)$— y merece
      una línea en la respuesta.

  - id: ex2526-ord-8-fourier-de-la-ampliacion-impar
    titulo: Una ampliación impar, y la serie de Leibniz que sale de ella
    fuente: >-
      Ejercicio 4 del SEGUNDO PARCIAL · Convocatoria ordinaria, 9 de junio de 2026 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea la función $f(t)=t+\pi$, $t\in(0,\pi)$.

      a) Obtener una ampliación impar y periódica, $F(t)$, de la función $f(t)$.

      b) Dibujar la función $f(t)$ y la función ampliada $F(t)$ obtenida en el
      apartado anterior.

      c) Calcular la serie de Fourier, $S(t)$, de $F(t)$.

      d) Calcular, justificando la respuesta, los valores de $S(t)$ y $F(t)$ en
      los puntos $t=-5\pi$ y $t=\dfrac{25}{2}\pi$.

      e) Calcular $\displaystyle\sum_{n=0}^{\infty}\frac{(-1)^{n}}{2n+1}$.
    pide: La ampliación, su dibujo, la serie, los dos valores y la suma.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué obliga a hacer «impar y periódica»?
        opciones:
          - texto: >-
              A definir $F(t)=-f(-t)$ para $t\in(-\pi,0)$ y a repetir con
              periodo $2\pi$; y como consecuencia, a que la serie solo tenga
              senos
            correcta: true
            mensaje: |
              Eso es. La imparidad fija la mitad izquierda y el periodo $2\pi$
              fija todo lo demás. Y una función impar tiene todos los
              $a_{n}$ nulos: solo quedan los $b_{n}$.
          - texto: >-
              A definir $F(t)=f(-t)$ para $t<0$, que es lo que hace simétrica a
              una función
            mensaje: |
              Eso es la ampliación **par**, con $F(-t)=F(t)$, y daría una serie
              de cosenos. La impar es $F(-t)=-F(t)$.
          - texto: >-
              A tomar periodo $\pi$, que es la longitud del intervalo dado
            mensaje: |
              Con periodo $\pi$ no cabe la parte negativa: la ampliación impar
              ocupa $(-\pi,\pi)$, así que el periodo es $2\pi$.

      - tipo: calcular
        titulo: El primer coeficiente
        pregunta: |
          ¿Cuánto vale $b_{1}$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Has integrado solo la parte $t$ del integrando:
              $\frac{2}{\pi}\int_{0}^{\pi}t\operatorname{sen}t\,dt=2$. Falta la
              parte $\pi$, que aporta $4$.
          - valor: '4'
            mensaje: |
              Has integrado solo la parte constante:
              $\frac{2}{\pi}\int_{0}^{\pi}\pi\operatorname{sen}t\,dt=4$. Falta
              la parte $t$, que aporta $2$.
          - valor: '3'
            mensaje: |
              Te has dejado el factor $\frac{2}{\pi}$ o lo has puesto como
              $\frac{1}{\pi}$. Para una función impar de periodo $2\pi$ el
              coeficiente es
              $b_{n}=\frac{2}{\pi}\int_{0}^{\pi}F(t)\operatorname{sen}(nt)\,dt$.
        pista: |
          $b_{n}=\frac{2}{\pi}\int_{0}^{\pi}(t+\pi)\operatorname{sen}(nt)\,dt$, y
          conviene partirla en dos.
        desarrollo: |
          $$
          \int_{0}^{\pi}t\operatorname{sen}t\,dt=\pi,
          \qquad
          \int_{0}^{\pi}\pi\operatorname{sen}t\,dt=2\pi
          $$

          $$
          b_{1}=\frac{2}{\pi}\left(\pi+2\pi\right)=6
          $$

          En general
          $b_{n}=\frac{2\left[(-1)^{n+1}-(-1)^{n}+1\right]}{n}$, que vale
          $\frac6n$ para $n$ impar y $-\frac2n$ para $n$ par.

      - tipo: calcular
        titulo: La serie en un punto lejano
        pregunta: |
          ¿Cuánto vale $S\left(\frac{25}{2}\pi\right)$?
        respuesta:
          tipo: numero
          valor: '4.7123890'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '42.4115008'
            mensaje: |
              Has sustituido $t=\frac{25}{2}\pi$ en la fórmula $t+\pi$ sin
              reducir. $F$ es periódica de periodo $2\pi$: primero hay que
              llevar el punto al intervalo básico.
          - valor: '0'
            mensaje: |
              Eso es lo que vale en los puntos de salto, los múltiplos de $\pi$.
              Pero $\frac{25}{2}\pi$ reducido módulo $2\pi$ cae en
              $\frac{\pi}{2}$, que está en medio del intervalo y donde $F$ es
              continua.
          - valor: '1.5707963'
            mensaje: |
              Ese es $\frac{\pi}{2}$, el punto reducido, no el valor de la
              función ahí. $F\left(\frac\pi2\right)=\frac\pi2+\pi$.
        pista: |
          $\frac{25}{2}\pi=12\pi+\frac{\pi}{2}$, y el periodo es $2\pi$.
        desarrollo: |
          $$
          \frac{25}{2}\pi=12\pi+\frac{\pi}{2}
          \equiv\frac{\pi}{2}\pmod{2\pi}
          $$

          y en $\frac{\pi}{2}$ la función es continua, así que la serie converge
          al propio valor:

          $$
          S\left(\tfrac{25}{2}\pi\right)=F\left(\tfrac{\pi}{2}\right)
          =\frac{\pi}{2}+\pi=\frac{3\pi}{2}\approx 4{,}7124
          $$

      - tipo: calcular
        titulo: La suma del apartado e)
        pregunta: |
          ¿Cuánto vale $\displaystyle\sum_{n=0}^{\infty}\frac{(-1)^{n}}{2n+1}$?
        respuesta:
          tipo: numero
          valor: '0.7853982'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '4.7123890'
            mensaje: |
              Ese es $S\left(\frac{\pi}{2}\right)=\frac{3\pi}{2}$, y todavía hay
              que dividir entre el $6$ que multiplica a la suma.
          - valor: '1.5707963'
            mensaje: |
              Ese es $\frac{\pi}{2}$. La suma vale $\frac{\pi}{4}$: es la mitad.
          - valor: '1'
            mensaje: |
              Ese es el primer término. La serie es alternada y sus sumas
              parciales oscilan alrededor de $\frac{\pi}{4}\approx 0{,}785$, sin
              llegar nunca a $1$ desde el segundo término.
        pista: |
          Evalúa la serie de Fourier en $t=\frac{\pi}{2}$: los términos pares
          desaparecen.
        desarrollo: |
          En $t=\frac{\pi}{2}$, $\operatorname{sen}\left(n\frac{\pi}{2}\right)$
          vale cero para $n$ par y $(-1)^{k}$ para $n=2k+1$. Así que solo
          sobreviven los términos impares, que llevan $b_{n}=\frac6n$:

          $$
          S\left(\tfrac{\pi}{2}\right)
          =\sum_{k=0}^{\infty}\frac{6}{2k+1}(-1)^{k}
          =6\sum_{k=0}^{\infty}\frac{(-1)^{k}}{2k+1}
          $$

          Y ya sabemos que $S\left(\frac{\pi}{2}\right)=\frac{3\pi}{2}$, luego

          $$
          \sum_{k=0}^{\infty}\frac{(-1)^{k}}{2k+1}
          =\frac{1}{6}\cdot\frac{3\pi}{2}=\frac{\pi}{4}\approx 0{,}7854
          $$

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              **a)** La ampliación impar es $F(t)=t+\pi$ en $(0,\pi)$ y
              $F(t)=t-\pi$ en $(-\pi,0)$, repetida con periodo $2\pi$.
          - texto: >-
              **c)** Al ser impar, todos los $a_{n}$ son cero y
              $b_{n}=\frac{2}{\pi}\int_{0}^{\pi}(t+\pi)\operatorname{sen}(nt)\,dt$.
          - texto: >-
              Integrando, $b_{n}=\frac{6}{n}$ si $n$ es impar y
              $b_{n}=-\frac{2}{n}$ si $n$ es par.
          - texto: >-
              **d)** $-5\pi$ es congruente con $\pi$ módulo $2\pi$, que es un
              punto de salto: los límites laterales valen $2\pi$ y $-2\pi$, así
              que la serie converge a su media, $0$.
          - texto: >-
              Y $\frac{25}{2}\pi$ es congruente con $\frac{\pi}{2}$, donde $F$ es
              continua: ahí $S=F=\frac{3\pi}{2}$.
          - texto: >-
              **e)** Evaluando la serie en $\frac{\pi}{2}$ solo sobreviven los
              términos impares, y sale
              $6\sum\frac{(-1)^{k}}{2k+1}=\frac{3\pi}{2}$, de donde la suma vale
              $\frac{\pi}{4}$.
          - texto: >-
              En $t=-5\pi$ la serie converge a $F(-5\pi)=-4\pi$.
            trampa: true
            mensaje: |
              Dos cosas fallan a la vez. La primera: $F$ es **periódica**, así
              que $F(-5\pi)$ no se calcula sustituyendo en $t+\pi$; hay que
              reducir módulo $2\pi$, y $-5\pi$ cae en $\pi$. La segunda: ahí hay
              un salto, y en un salto la serie no converge al valor de la
              función sino a la **media de los límites laterales**, que es cero.
              De hecho $F$ ni siquiera está definida en $\pi$, porque $f$ se da en
              el intervalo abierto.

    resolucion: |
      **a) La ampliación impar.** Impar significa $F(-t)=-F(t)$, así que la
      mitad izquierda queda determinada por la derecha:

      $$
      F(t)=
      \begin{cases}
      t+\pi & 0<t<\pi\\[4pt]
      t-\pi & -\pi<t<0
      \end{cases}
      \qquad\text{y }F(t+2\pi)=F(t)
      $$

      En $t=0$ y en los múltiplos de $\pi$ la función no está definida: $f$ se da
      en el intervalo **abierto**, y además ahí la imparidad y la periodicidad
      chocan. Es un detalle que hay que decir, porque el apartado d) va
      justamente de eso.

      **b) El dibujo.**

