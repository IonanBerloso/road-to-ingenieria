ejercicios:
  - id: ex2021-3ev-1-semiplano-con-mordisco
    titulo: Un semiplano al que un disco le da un mordisco
    fuente: >-
      Ejercicio 1 · Tercera evaluación, 15 de enero de 2021 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3

    nivel: examen
    enunciado: |
      **a)** Calcular el valor de $a \in \mathbb{R}$ para que el número complejo
      $\omega = \dfrac{8+8i}{a-2i}$ sea imaginario puro.

      **b)** Sea el número complejo $z_1 = 3+ai$, donde $a$ es el número real
      obtenido en el apartado anterior. Calcular y representar gráficamente los
      afijos de los números complejos $z$ que verifican las siguientes
      condiciones:

      $$
      \begin{cases}
      \left|z-z_1\right| \le \left|\overline{z}+\overline{z_1}\right|\\[6pt]
      \left|z-\left(\overline{z_1}-i\right)\right| \ge 2
      \end{cases}
      $$
    pide: Calcular $a$ y describir la región.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué significa que $\omega$ sea imaginario puro?
        opciones:
          - texto: >-
              Que su parte real es **cero** y su parte imaginaria **no**
            correcta: true
            mensaje: |
              Exacto, y las dos cosas. Si también se anulara la parte
              imaginaria el número sería 0, que no se considera imaginario puro.
              Comprobarlo es un renglón y cierra el apartado.
          - texto: >-
              Que su módulo es 1
            mensaje: |
              El módulo puede ser cualquiera. Lo que caracteriza a un imaginario
              puro es dónde cae en el plano: sobre el eje vertical.
          - texto: >-
              Que su parte imaginaria es cero
            mensaje: |
              Eso lo haría **real**, que es justo lo contrario.
          - texto: >-
              Que su argumento es $\frac{\pi}{4}$
            mensaje: |
              $\frac{\pi}{4}$ es la bisectriz. Un imaginario puro tiene
              argumento $\pm\frac{\pi}{2}$.

      - tipo: calcular
        titulo: El valor de a
        pregunta: |
          ¿Cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              Signo cambiado. Al racionalizar, la parte real del numerador es
              $8a-16$, que se anula en $a=+2$.
          - valor: '8'
            mensaje: |
              8 es el numerador del enunciado, no el valor de $a$.
          - valor: '0'
            mensaje: |
              Con $a=0$ el cociente es $\frac{8+8i}{-2i}$, que vale
              $-4+4i$: tiene parte real, así que no sirve.
        pista: |
          Multiplica arriba y abajo por $a+2i$ y anula la parte real.
        desarrollo: |
          $$
          \omega = \frac{(8+8i)(a+2i)}{(a-2i)(a+2i)}
          = \frac{8a+16i+8ai-16}{a^{2}+4}
          $$

          $$
          = \frac{(8a-16)+(8a+16)i}{a^{2}+4}
          $$

          **Parte real cero:**

          $$
          8a-16 = 0
          \;\Longrightarrow\;
          a = 2
          $$

          **Y hay que comprobar que la imaginaria no lo es:** con $a=2$ vale
          $8\cdot2+16 = 32 \neq 0$ ✔

          $$
          \omega = \frac{32i}{8} = 4i
          $$
        veredicto: |
          Comprobar que la parte imaginaria sobrevive es lo que separa una
          respuesta de 5 de una de 6. Si se anulara, el número sería 0 y no
          sería imaginario puro.

      - tipo: calcular
        titulo: El centro del disco que se quita
        pregunta: |
          La segunda condición excluye un disco. ¿Cuál es la ordenada de su
          centro?
        respuesta:
          tipo: numero
          valor: '-3'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              $-2$ es la parte imaginaria de $\overline{z_1}$ sin restarle la
              $i$. El centro es $\overline{z_1}-i = 3-2i-i = 3-3i$.
          - valor: '2'
            mensaje: |
              $+2$ es la parte imaginaria de $z_1$, no de su conjugado. El
              conjugado cambia el signo.
          - valor: '-1'
            mensaje: |
              $-1$ es solo la $i$ que se resta. Falta sumarle el $-2i$ del
              conjugado.
        pista: |
          $z_1 = 3+2i$, así que $\overline{z_1} = 3-2i$. Réstale $i$.
        desarrollo: |
          Con $a=2$:

          $$
          z_1 = 3+2i,
          \qquad
          \overline{z_1} = 3-2i,
          \qquad
          \overline{z_1}-i = 3-3i
          $$

          La condición

          $$
          \left|z-(3-3i)\right| \ge 2
          $$

          dice: **distancia al punto $(3,-3)$ mayor o igual que 2**. Es el
          exterior del disco de centro $(3,-3)$ y radio 2, **incluida** la
          circunferencia.
        veredicto: |
          Un módulo $\ge$ una constante siempre es el exterior de un disco, con
          su borde. Que el signo sea $\ge$ y no $>$ es lo que incluye la
          circunferencia.

      - tipo: verificar
        pregunta: |
          Con el $a$ del apartado anterior, escribe las dos condiciones en $x$ e $y$.
          La figura comprobará si la región coincide con la del enunciado.
        condicion: '|z-(3+2i)| <= |conj(z)+conj(3+2i)| & |z-(3-3i)| >= 2'
        ventana:
          x: [-6, 8]
          y: [-8, 6]
        formato: en x e y; usa & para juntar las dos condiciones
        pista: |
          Conjugar no cambia distancias: $\left|\overline{z}+\overline{z_1}\right| =
          \left|z+z_1\right|$. La primera condición es entonces «estar más cerca de
          $z_1$ que de $-z_1$», que es un semiplano.
        desarrollo: |
          Del apartado anterior, $a=2$ y $z_1 = 3+2i$. Como
          $\overline{z}+\overline{z_1} = \overline{z+z_1}$ y conjugar conserva el
          módulo, la primera condición es

          $$
          \left|z-z_1\right| \le \left|z+z_1\right|
          $$

          es decir, los puntos que no están más lejos de $z_1$ que de $-z_1$: el
          semiplano limitado por la mediatriz del segmento que los une, que pasa por
          el origen y es perpendicular a la dirección $(3,2)$:

          $$
          3x+2y \ge 0
          $$

          La segunda, con $\overline{z_1}-i = 3-3i$, es el exterior del disco de
          centro $(3,-3)$ y radio $2$:

          $$
          (x-3)^{2}+(y+3)^{2} \ge 4
          $$
        veredicto: |
          Un **semiplano cerrado al que un disco le da un mordisco**. Los dos bordes
          entran, porque las dos desigualdades son no estrictas.
      - tipo: justificar
        pregunta: |
          Ordena la descripción de la región. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Simplificar la primera condición.** Como
              $\overline z+\overline{z_1} = \overline{z+z_1}$ y el conjugado no
              cambia el módulo, es $\left|z-z_1\right| \le \left|z+z_1\right|$.
          - texto: |
              **Leerla en distancias:** los puntos que están más cerca de $z_1$
              que de $-z_1$. La frontera es la **mediatriz** del segmento que
              los une, que pasa por el origen.
          - texto: |
              **En cartesianas:** desarrollando los módulos al cuadrado queda
              $3x+2y \ge 0$, un semiplano cerrado.
          - texto: |
              **La segunda condición** es el exterior cerrado del disco de
              centro $(3,-3)$ y radio 2.
          - texto: |
              **Y el disco corta al semiplano:** el centro dista
              $\frac{3}{\sqrt{13}} \approx 0{,}83$ de la recta, menos que el
              radio. La región es el semiplano con un mordisco.
          - texto: |
              Como el centro del disco cumple $3x+2y\ge0$, el disco está entero
              dentro del semiplano y se le quita completo.
            trampa: true
            mensaje: |
              Que el **centro** esté dentro no basta: hay que comparar la
              distancia del centro a la recta con el radio. Aquí
              $0{,}83 < 2$, así que el disco **cruza** la frontera y solo se le
              quita un trozo. Con un radio menor que $0{,}83$ sí se quitaría
              entero. Es una comprobación de dos líneas y decide cómo es la
              región.
        veredicto: |
          Comparar la distancia del centro a la recta con el radio es la forma
          de saber si un disco y un semiplano se cortan. Sin ella, la
          descripción del recinto es adivinada.

    resolucion: |
      **Datos.** Un cociente que debe ser imaginario puro, y dos condiciones
      sobre $z$.

      ### 1 · Apartado (a)

      $$
      \omega = \frac{8+8i}{a-2i}
      = \frac{(8+8i)(a+2i)}{a^{2}+4}
      $$

      Desarrollando el numerador:

      $$
      8a+16i+8ai+16i^{2} = (8a-16)+(8a+16)i
      $$

      **Imaginario puro** significa dos cosas:

      $$
      \mathrm{Re}(\omega) = 0
      \qquad\text{y}\qquad
      \mathrm{Im}(\omega) \neq 0
      $$

      De la primera:

      $$
      8a-16 = 0
      \;\Longrightarrow\;
      \boxed{a = 2}
      $$

      Y comprobando la segunda: $8\cdot2+16 = 32 \neq 0$ ✔ Con $a=2$ sale

      $$
      \omega = \frac{32i}{8} = 4i
      $$

      ### 2 · Apartado (b): la primera condición

      Con $a=2$: $z_1 = 3+2i$.

      $$
      \overline z+\overline{z_1} = \overline{z+z_1}
      \;\Longrightarrow\;
      \left|\overline z+\overline{z_1}\right| = \left|z+z_1\right|
      $$

      —el conjugado refleja el punto, pero no cambia su distancia al origen—.
      Ver esto de golpe ahorra media página.

      $$
      \left|z-z_1\right| \le \left|z+z_1\right|
      $$

      **En distancias:** los puntos que están más cerca de $z_1 = (3,2)$ que de
      $-z_1 = (-3,-2)$. La frontera es la mediatriz del segmento que los une, y
      como los dos puntos son opuestos, **pasa por el origen**.

      **La cuenta**, elevando al cuadrado —los dos módulos son no negativos—:

      $$
      \left|z\right|^{2}-2\,\mathrm{Re}\left(z\overline{z_1}\right)
      +\left|z_1\right|^{2}
      \le
      \left|z\right|^{2}+2\,\mathrm{Re}\left(z\overline{z_1}\right)
      +\left|z_1\right|^{2}
      $$

      $$
      0 \le 4\,\mathrm{Re}\left(z\overline{z_1}\right)
      $$

      Y con $z\overline{z_1} = (x+yi)(3-2i) = (3x+2y)+(3y-2x)i$:

      $$
      \boxed{3x+2y \ge 0}
      $$

      Semiplano cerrado, por encima de la recta $3x+2y=0$ —que tiene pendiente
      $-\frac32$—.

      ### 3 · La segunda condición

      $$
      \overline{z_1}-i = (3-2i)-i = 3-3i
      $$

      $$
      \left|z-(3-3i)\right| \ge 2
      $$

      $$
      \boxed{\text{Exterior CERRADO del disco de centro } (3,-3)
      \text{ y radio } 2}
      $$

      ### 4 · Cómo encajan

      La pregunta que decide la forma del recinto: **¿el disco corta a la
      recta?**

      Distancia del centro $(3,-3)$ a la recta $3x+2y=0$:

      $$
      d = \frac{\left|3\cdot3+2\cdot(-3)\right|}{\sqrt{3^{2}+2^{2}}}
      = \frac{3}{\sqrt{13}} \approx 0{,}83
      $$

      $$
      0{,}83 < 2 = r
      $$

      **El disco cruza la frontera.** Así que del semiplano no se quita el disco
      entero, sino solo el trozo que cae dentro de él.

      $$
      \boxed{
      \begin{aligned}
      &\text{El semiplano cerrado } 3x+2y \ge 0,\\
      &\text{menos el trozo abierto del disco de centro } (3,-3), r=2
      \end{aligned}}
      $$

      La circunferencia **sí** pertenece —la desigualdad es $\ge$—, así que el
      borde del mordisco está incluido.

      <figure class="figura-examen">
      <svg viewBox="0 0 520 480" role="img" width="500" height="462"
           aria-labelledby="f2021c1t f2021c1d">
        <title id="f2021c1t">La region del ejercicio 1</title>
        <desc id="f2021c1d">Un semiplano sombreado por encima de una recta de
        pendiente negativa que pasa por el origen. Dentro del semiplano, un
        disco centrado en el punto tres coma menos tres queda sin sombrear: la
        recta lo corta, asi que solo se le quita el trozo que cae del lado
        bueno.</desc>

        <defs>
          <clipPath id="c2021semiplano">
            <path d="M20 400 L500 88 L500 20 L20 20 Z"></path>
          </clipPath>
        </defs>

        <path d="M20 400 L500 88 L500 20 L20 20 Z" fill="var(--live)"
              fill-opacity="0.13"></path>

        <g clip-path="url(#c2021semiplano)">
          <circle cx="340" cy="320" r="100" fill="var(--paper)"></circle>
        </g>
        <circle cx="340" cy="320" r="100" fill="none" stroke="var(--flag)"
                stroke-width="2.4"></circle>

        <g stroke="var(--graphite)" stroke-width="1.3" fill="none">
          <path d="M20 220 L500 220 M160 20 L160 460"></path>
        </g>

        <g stroke="var(--live)" stroke-width="2.6" fill="none">
          <path d="M20 400 L500 88"></path>
        </g>

        <circle cx="340" cy="320" r="5" fill="var(--flag)"></circle>
        <circle cx="260" cy="153" r="5" fill="var(--alt)"></circle>

        <g fill="var(--graphite)" font-size="13" font-family="var(--mono)">
          <text x="136" y="240">0</text>
          <text x="478" y="212">Re</text>
          <text x="168" y="36">Im</text>
        </g>
        <g fill="var(--alt)" font-size="12" font-family="var(--mono)">
          <text x="268" y="148">z₁ = 3+2i</text>
        </g>
        <g fill="var(--flag)" font-size="12" font-family="var(--mono)">
          <text x="350" y="326">3-3i</text>
        </g>
        <g fill="var(--live)" font-size="12" font-family="var(--mono)">
          <text x="30" y="382">3x+2y = 0</text>
        </g>
      </svg>
      <figcaption>
      Figura nuestra: el enunciado pide representar. Sombreado el semiplano; en
      blanco, el trozo de disco que se le quita. La recta corta al disco, por
      eso el mordisco no es un circulo completo.
      </figcaption>
      </figure>

      ### 5 · Comprobación

      **Que $z_1$ cumple la primera condición.** $3\cdot3+2\cdot2 = 13 \ge 0$
      ✔ Tiene sentido: $z_1$ está a distancia 0 de sí mismo.

      **Que $-z_1$ no la cumple.** $3(-3)+2(-2) = -13 \not\ge 0$ ✔

      **Que el origen está en la frontera.** $0+0 = 0$: se cumple con
      igualdad ✔ Como corresponde a un punto de la mediatriz de dos opuestos.

      **Con un punto del mordisco,** $z = 3-3i$, el propio centro:

      $$
      3\cdot3+2\cdot(-3) = 3 \ge 0 \quad\checkmark \text{(cumple la primera)}
      $$

      $$
      \left|z-(3-3i)\right| = 0 \not\ge 2 \quad\checkmark
      \text{(falla la segunda)}
      $$

      Está en el semiplano pero se le quita ✔

      **Con un punto del disco que ya estaba fuera del semiplano,**
      $z = 3-4{,}5i$:

      $$
      3\cdot3+2\cdot(-4{,}5) = 0 \quad\text{justo en la recta}
      $$

      Y $\left|z-(3-3i)\right| = 1{,}5 < 2$: está dentro del disco. Confirma
      que el disco llega hasta la recta y la cruza ✔

  - id: ex2021-3ev-2-mclaurin-de-la-integral
    titulo: Un polinomio de una integral que no se puede calcular
    fuente: >-
      Ejercicio 2 · Tercera evaluación, 15 de enero de 2021 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    nivel: examen
    enunciado: |
      **a)** Calcular el polinomio de McLaurin de orden 3 de la función
      $f(x) = \displaystyle\int_0^{x}\mathrm{e}^{z^{2}}dz$.

      **b)** ¿La función $f(x)$ definida en el apartado anterior tiene puntos de
      inflexión?
    pide: Calcular el polinomio y decidir si hay inflexiones.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la vía más corta para el apartado (a)?
        opciones:
          - texto: >-
              Desarrollar $\mathrm{e}^{z^{2}}$ en serie e **integrar término a
              término**
            correcta: true
            mensaje: |
              Exacto. $\mathrm{e}^{z^{2}}$ no tiene primitiva elemental, pero su
              serie sí se integra: cada monomio por separado. Y el resultado es
              directamente el desarrollo de $f$.
          - texto: >-
              Calcular la integral y luego derivar tres veces
            mensaje: |
              La integral no se puede calcular en términos elementales: está
              demostrado. Ese camino no lleva a ninguna parte.
          - texto: >-
              Derivar $f$ tres veces con el teorema fundamental
            mensaje: |
              Funciona —da $f'=\mathrm{e}^{x^{2}}$ y de ahí las demás— pero es
              más largo, y hay que derivar dos veces una exponencial compuesta.
          - texto: >-
              Sustituir $z$ por $x$ en el integrando
            mensaje: |
              Eso no es integrar: es evaluar el integrando. La integral y su
              integrando son cosas distintas.

      - tipo: calcular
        titulo: El coeficiente cúbico
        pregunta: |
          ¿Cuál es el coeficiente de $x^{3}$ en el polinomio?
        respuesta:
          tipo: numero
          valor: '0.333333'
          tolerancia: 0.000005
          formato: en forma exacta, o un número con seis decimales
        distractores:
          - valor: '0.166667'
            mensaje: |
              $\frac16 = \frac{1}{3!}$ sería el coeficiente si el integrando
              fuera $\mathrm{e}^{z}$. Con $z^{2}$ el término cuadrático llega
              con coeficiente 1 y al integrar da $\frac{x^{3}}{3}$.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es el coeficiente de $z^{2}$ en... no: en
              $\mathrm{e}^{z^{2}}$ el término $z^{2}$ tiene coeficiente **1**,
              porque viene de $\frac{t^{1}}{1!}$ con $t=z^{2}$.
          - valor: '0.1'
            mensaje: |
              $\frac{1}{10}$ es el coeficiente de $x^{5}$, el siguiente término.
        pista: |
          $\mathrm{e}^{t} = 1+t+\frac{t^{2}}{2}+\ldots$ con $t=z^{2}$, y luego
          integra.
        desarrollo: |
          Sustituyendo $t = z^{2}$ en la serie de la exponencial:

          $$
          \mathrm{e}^{z^{2}} = 1+z^{2}+\frac{z^{4}}{2}+\frac{z^{6}}{6}+\ldots
          $$

          Integrando de 0 a $x$, término a término:

          $$
          f(x) = x+\frac{x^{3}}{3}+\frac{x^{5}}{10}+\frac{x^{7}}{42}+\ldots
          $$

          $$
          P_3(x) = x+\frac{x^{3}}{3}
          $$

          El coeficiente de $x^{3}$ es $\frac13 = 0{,}333333$.
        veredicto: |
          **No hay término cuadrático**, ni de ningún grado par. $f$ es impar,
          y eso ya anuncia lo que pide el apartado (b).

      - tipo: calcular
        titulo: Las inflexiones
        pregunta: |
          ¿Cuántos puntos de inflexión tiene $f$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Sí hay uno. $f''(x) = 2x\,\mathrm{e}^{x^{2}}$ se anula en $x=0$
              **y cambia de signo** ahí: pasa de negativa a positiva.
          - valor: '2'
            mensaje: |
              2 supondría dos cambios de signo. $f''$ solo se anula en un punto,
              porque la exponencial nunca vale cero.
          - valor: '3'
            mensaje: |
              No hay tres. El único cero de $f''$ es el origen.
        pista: |
          $f' = \mathrm{e}^{x^{2}}$ por el teorema fundamental. Deriva otra vez.
        desarrollo: |
          Por el teorema fundamental —el integrando es continuo—:

          $$
          f'(x) = \mathrm{e}^{x^{2}}
          $$

          $$
          f''(x) = 2x\,\mathrm{e}^{x^{2}}
          $$

          Como $\mathrm{e}^{x^{2}}>0$ siempre, el signo de $f''$ es el de $x$:

          | intervalo | $f''$ | $f$ |
          |---|---|---|
          | $x<0$ | $<0$ | cóncava |
          | $x>0$ | $>0$ | convexa |

          **Cambia de signo en $x=0$**, así que hay inflexión ahí, y solo ahí.

          $$
          f(0) = 0
          \;\Longrightarrow\;
          \text{punto de inflexión } (0,0)
          $$
        veredicto: |
          Que se anule la segunda derivada no basta: hay que comprobar que
          **cambia de signo**. Aquí lo hace, y por eso es inflexión de verdad.

      - tipo: justificar
        pregunta: |
          Ordena la respuesta al apartado (b). Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Derivar con el teorema fundamental.** El integrando
              $\mathrm{e}^{z^{2}}$ es continuo, así que
              $f'(x) = \mathrm{e}^{x^{2}}$.
          - texto: |
              **La segunda derivada:**
              $f''(x) = 2x\,\mathrm{e}^{x^{2}}$.
          - texto: |
              **Los candidatos:** $f''=0$ solo en $x=0$, porque la exponencial
              no se anula nunca.
          - texto: |
              **Comprobar el cambio de signo:** $f''<0$ a la izquierda y
              $f''>0$ a la derecha. Es inflexión.
          - texto: |
              **Sí hay inflexión**, exactamente una, en el origen $(0,0)$.
          - texto: |
              El polinomio de McLaurin de orden 3 ya lo dice: como no tiene
              término en $x^{2}$, hay inflexión en 0.
            trampa: true
            mensaje: |
              El razonamiento apunta bien pero no cierra. Que falte el término
              cuadrático dice que $f''(0)=0$ —el candidato existe—, pero **no**
              que cambie de signo, que es lo que hace falta. Hay funciones sin
              término cuadrático y sin inflexión: $x^{4}$ en el origen. El
              polinomio da la pista; el cambio de signo da la demostración.
        veredicto: |
          El desarrollo detecta el candidato y el estudio del signo lo confirma.
          Son dos pasos, no uno.

    resolucion: |
      **Datos.** $f(x) = \int_0^{x}\mathrm{e}^{z^{2}}dz$.

      ### 1 · Apartado (a): integrar la serie

      $\mathrm{e}^{z^{2}}$ **no tiene primitiva elemental**. Pero para el
      polinomio de Taylor no hace falta: basta desarrollar el integrando e
      integrar término a término, que es lícito dentro del radio de
      convergencia —aquí infinito—.

      Sustituyendo $t = z^{2}$ en $\mathrm{e}^{t} = \sum\frac{t^{n}}{n!}$:

      $$
      \mathrm{e}^{z^{2}}
      = 1+z^{2}+\frac{z^{4}}{2!}+\frac{z^{6}}{3!}+\ldots
      $$

      **Ojo al coeficiente de $z^{2}$: vale 1, no $\frac12$.** Viene del
      término $\frac{t^{1}}{1!}$.

      Integrando:

      $$
      f(x) = \int_0^{x}\left(1+z^{2}+\frac{z^{4}}{2}+\ldots\right)dz
      = x+\frac{x^{3}}{3}+\frac{x^{5}}{10}+\frac{x^{7}}{42}+\ldots
      $$

      $$
      \boxed{P_3(x) = x+\frac{x^{3}}{3}}
      $$

      ### 2 · Comprobación por la otra vía

      Derivando, que es el camino largo pero independiente:

      $$
      f'(x) = \mathrm{e}^{x^{2}}
      \;\Longrightarrow\;
      f'(0) = 1
      $$

      $$
      f''(x) = 2x\,\mathrm{e}^{x^{2}}
      \;\Longrightarrow\;
      f''(0) = 0
      $$

      $$
      f'''(x) = 2\mathrm{e}^{x^{2}}+4x^{2}\mathrm{e}^{x^{2}}
      \;\Longrightarrow\;
      f'''(0) = 2
      $$

      Y $f(0)=0$. Montando el polinomio:

      $$
      P_3(x) = 0+1\cdot x+\frac{0}{2}x^{2}+\frac{2}{6}x^{3}
      = x+\frac{x^{3}}{3} \quad\checkmark
      $$

      ### 3 · Apartado (b): las inflexiones

      $$
      f''(x) = 2x\,\mathrm{e}^{x^{2}}
      $$

      **Candidatos:** $f''=0$ solo donde $2x=0$, porque la exponencial nunca se
      anula. Un único candidato: $x=0$.

      **Cambio de signo**, que es lo que hay que comprobar:

      | intervalo | $2x$ | $f''$ | $f$ |
      |---|---|---|---|
      | $x<0$ | $<0$ | $<0$ | **cóncava** |
      | $x>0$ | $>0$ | $>0$ | **convexa** |

      $$
      \boxed{\text{SÍ: un único punto de inflexión, en } (0,0)}
      $$

      ### 4 · Por qué anularse no basta

      El error natural es contestar «sí, porque $f''(0)=0$». No es suficiente:
      $g(x) = x^{4}$ tiene $g''(0)=0$ y **no** tiene inflexión ahí, porque
      $g''=12x^{2}$ es positiva a los dos lados.

      La definición de punto de inflexión es que la **concavidad cambie**, y eso
      se demuestra con el signo, no con el valor.

      ### 5 · Lo que también se ve

      **$f$ es impar.** Su desarrollo solo tiene potencias impares, y en efecto

      $$
      f(-x) = \int_0^{-x}\mathrm{e}^{z^{2}}dz = -\int_0^{x}\mathrm{e}^{z^{2}}dz
      = -f(x)
      $$

      Toda función impar derivable tiene $f''(0)=0$, así que la inflexión en el
      origen estaba anunciada por la simetría.

      **$f$ es estrictamente creciente** en todo $\mathbb{R}$, porque
      $f' = \mathrm{e}^{x^{2}} \ge 1 > 0$. No tiene extremos.

      **Y crece muy deprisa:** $f'(x) = \mathrm{e}^{x^{2}}$ vale ya 22026 en
      $x=3$. Nada que ver con la función error del ejercicio 5 de otros años
      —$\mathrm{e}^{-z^{2}}$—, que está acotada.

      ### 6 · Comprobación numérica del polinomio

      | $x$ | $P_3(x)$ | $f(x)$ (con seis términos) | error |
      |---|---|---|---|
      | $0{,}2$ | $0{,}20267$ | $0{,}20268$ | $10^{-5}$ |
      | $0{,}5$ | $0{,}54167$ | $0{,}54498$ | $3{,}3\cdot10^{-3}$ |
      | $1$ | $1{,}33333$ | $1{,}46265$ | $0{,}13$ |

      El error crece como $x^{5}$, que es el primer término omitido: al pasar de
      $0{,}2$ a $0{,}5$ se multiplica por unas $\left(2{,}5\right)^{5}
      \approx 98$ veces ✔ Y en $x=1$ el polinomio de orden 3 ya se queda corto,
      como corresponde a una función que crece así.

  - id: ex2021-3ev-3-bidon-cerrado
    titulo: El bidón que gasta menos chapa
    fuente: >-
      Ejercicio 3 · Tercera evaluación, 15 de enero de 2021 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    nivel: examen
    enunciado: |
      Se desea construir un bidón cerrado (con sus dos tapas) en forma de
      cilindro circular, de capacidad $16\pi$ metros cúbicos. Determina las
      dimensiones del bidón que minimizan el área de la superficie del bidón.
    pide: Determinar el radio y la altura.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que minimizar y con qué ligadura?
        opciones:
          - texto: >-
              Minimizar $2\pi r^{2}+2\pi rh$ con la ligadura
              $\pi r^{2}h = 16\pi$
            correcta: true
            mensaje: |
              Exacto. **Dos** tapas, de ahí el $2\pi r^{2}$; la pared lateral es
              el rectángulo de base la circunferencia y altura $h$. Y el volumen
              fija la relación entre $r$ y $h$.
          - texto: >-
              Minimizar $\pi r^{2}+2\pi rh$ con $\pi r^{2}h = 16\pi$
            mensaje: |
              Eso sería un bidón **sin tapa** o con una sola. El enunciado dice
              «cerrado, con sus dos tapas»: hay que contar dos círculos.
          - texto: >-
              Minimizar el volumen con la superficie fija
            mensaje: |
              Es al revés: el volumen está **dado** y lo que se minimiza es la
              superficie.
          - texto: >-
              Minimizar $2\pi rh$ solo
            mensaje: |
              La superficie total incluye las tapas. Si se olvidan, el óptimo
              sale distinto — de hecho no existe.

      - tipo: calcular
        titulo: El radio óptimo
        pregunta: |
          ¿Cuál es el radio que minimiza la superficie, en metros?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número, en metros
        distractores:
          - valor: '4'
            mensaje: |
              4 es la **altura** óptima, no el radio. Es fácil cruzarlos, y en
              este problema la altura es justo el doble del radio.
          - valor: '2.5198'
            mensaje: |
              $\sqrt[3]{16}$ saldría de olvidar una de las dos tapas: con una
              sola la ecuación es $2\pi r = 32\pi/r^{2}$.
          - valor: '16'
            mensaje: |
              16 es el número del volumen, no una longitud.
        pista: |
          $S(r) = 2\pi r^{2}+\frac{32\pi}{r}$. Deriva e iguala a cero.
        desarrollo: |
          De la ligadura:

          $$
          \pi r^{2}h = 16\pi
          \;\Longrightarrow\;
          h = \frac{16}{r^{2}}
          $$

          Sustituyendo en la superficie:

          $$
          S(r) = 2\pi r^{2}+2\pi r\cdot\frac{16}{r^{2}}
          = 2\pi r^{2}+\frac{32\pi}{r}, \qquad r>0
          $$

          $$
          S'(r) = 4\pi r-\frac{32\pi}{r^{2}} = 0
          \;\Longrightarrow\;
          4r^{3} = 32
          \;\Longrightarrow\;
          r^{3} = 8
          \;\Longrightarrow\;
          r = 2
          $$

          Y entonces $h = \frac{16}{4} = 4$.
        veredicto: |
          $h = 2r$: **la altura es igual al diámetro**. Es el resultado clásico
          del cilindro cerrado óptimo, y conviene decirlo.

      - tipo: calcular
        titulo: La superficie mínima
        pregunta: |
          ¿Cuál es la superficie mínima, en metros cuadrados?
        respuesta:
          tipo: numero
          valor: '75.3982'
          tolerancia: 0.001
          formato: en forma exacta, o un número, en metros cuadrados con cuatro decimales
        distractores:
          - valor: '50.2655'
            mensaje: |
              $16\pi$ es solo la pared lateral, $2\pi rh = 2\pi\cdot2\cdot4$.
              Faltan las dos tapas, que suman $8\pi$.
          - valor: '25.1327'
            mensaje: |
              $8\pi$ son solo las dos tapas. Falta la pared.
          - valor: '100.5310'
            mensaje: |
              $32\pi$ contaría la pared lateral dos veces.
        pista: |
          $S = 2\pi r^{2}+2\pi rh$ con $r=2$ y $h=4$.
        desarrollo: |
          $$
          S = 2\pi\cdot4+2\pi\cdot2\cdot4 = 8\pi+16\pi = 24\pi
          $$

          $$
          24\pi \approx 75{,}3982 \ \mathrm{m^{2}}
          $$

          El reparto es curioso: las tapas ponen $8\pi$ y la pared $16\pi$,
          **exactamente el doble**. No es casualidad, y sale de la condición de
          óptimo.
        veredicto: |
          Que la pared cueste el doble que las tapas es una firma del punto
          óptimo, y sirve de comprobación rápida.

      - tipo: justificar
        pregunta: |
          Ordena la justificación de que es un mínimo. Una de las piezas no
          debe entrar.
        piezas:
          - texto: |
              **El dominio** es $r>0$: un radio no puede ser cero ni negativo, y
              el intervalo es **abierto**.
          - texto: |
              **La segunda derivada:**
              $S''(r) = 4\pi+\frac{64\pi}{r^{3}}$, que es **positiva para todo
              $r>0$**.
          - texto: |
              Luego $S$ es convexa en todo el dominio, y un punto crítico de una
              función convexa es su mínimo **absoluto**.
          - texto: |
              **Los límites lo confirman:** $S\to+\infty$ cuando $r\to0^{+}$
              —las tapas se encogen pero el bidón se estira— y cuando
              $r\to\infty$ —las tapas se disparan—.
          - texto: |
              **Conclusión:** $r=2$ m y $h=4$ m, con $S_{\min} = 24\pi
              \approx 75{,}4$ m².
          - texto: |
              Como el intervalo es abierto, hay que comparar además con los
              valores en los extremos $r=0$ y $r=\infty$.
            trampa: true
            mensaje: |
              En un intervalo **abierto** no hay valores en los extremos que
              comparar: hay que mirar los **límites**, que es otra cosa. Y aquí
              los dos son $+\infty$, así que no compiten. Hablar de «el valor en
              $r=0$» es hablar de un punto que no está en el dominio — y donde
              la función ni siquiera está definida.
        veredicto: |
          Con $S''>0$ en todo el dominio no hace falta ni mirar los límites: la
          convexidad ya da el mínimo absoluto. Los límites son la comprobación.

    resolucion: |
      **Datos.** Cilindro cerrado de volumen $16\pi$ m³.

      ### 1 · Plantear

      **La función a minimizar** es la superficie total. Un cilindro cerrado
      tiene **dos tapas** y una pared:

      $$
      S = \underbrace{2\pi r^{2}}_{\text{dos tapas}}
      +\underbrace{2\pi rh}_{\text{pared lateral}}
      $$

      La pared, desenrollada, es un rectángulo de base la circunferencia
      $2\pi r$ y altura $h$.

      **La ligadura** es el volumen:

      $$
      \pi r^{2}h = 16\pi
      \;\Longrightarrow\;
      h = \frac{16}{r^{2}}
      $$

      ### 2 · Reducir a una variable

      $$
      S(r) = 2\pi r^{2}+2\pi r\cdot\frac{16}{r^{2}}
      $$

      $$
      \boxed{S(r) = 2\pi r^{2}+\frac{32\pi}{r}, \qquad r \in (0,\infty)}
      $$

      Los dos términos tiran en direcciones opuestas: al crecer $r$ las tapas
      encarecen y la pared abarata. El óptimo es el equilibrio.

      ### 3 · Derivar

      $$
      S'(r) = 4\pi r-\frac{32\pi}{r^{2}}
      $$

      $$
      S'(r) = 0
      \;\Longrightarrow\;
      4\pi r = \frac{32\pi}{r^{2}}
      \;\Longrightarrow\;
      4r^{3} = 32
      \;\Longrightarrow\;
      r^{3} = 8
      $$

      $$
      \boxed{r = 2 \ \text{m}}
      $$

      $$
      h = \frac{16}{2^{2}} = \boxed{4 \ \text{m}}
      $$

      ### 4 · Justificar que es el mínimo

      $$
      S''(r) = 4\pi+\frac{64\pi}{r^{3}}
      $$

      Para todo $r>0$ los dos sumandos son positivos, así que

      $$
      S''(r) > 0 \quad\text{en TODO el dominio}
      $$

      **$S$ es convexa en $(0,\infty)$**, y una función convexa con un punto
      crítico lo tiene como mínimo **absoluto**. No hace falta más.

      Los límites lo confirman:

      $$
      \lim_{r\to0^{+}}S(r) = +\infty,
      \qquad
      \lim_{r\to\infty}S(r) = +\infty
      $$

      —un bidón muy estrecho es larguísimo y gasta mucha pared; uno muy ancho
      gasta muchísima tapa—.

      ### 5 · El resultado y su lectura

      $$
      S_{\min} = 2\pi\cdot4+2\pi\cdot2\cdot4 = 8\pi+16\pi
      $$

      $$
      \boxed{S_{\min} = 24\pi \approx 75{,}40 \ \mathrm{m^{2}}}
      $$

      **Dos observaciones que valen puntos:**

      $$
      h = 4 = 2\cdot2 = 2r
      $$

      **La altura es igual al diámetro.** El cilindro cerrado más económico es
      el que «cabe justo» en un cubo: visto de perfil es un cuadrado. Es un
      resultado general, no de estos números.

      Y el reparto del gasto:

      | parte | superficie |
      |---|---|
      | dos tapas | $8\pi$ |
      | pared lateral | $16\pi$ |

      **La pared cuesta exactamente el doble que las tapas.** También es
      general: en el óptimo del cilindro cerrado la proporción siempre es 1 : 2.

      ### 6 · Comprobación

      **Del volumen:** $\pi\cdot2^{2}\cdot4 = 16\pi$ ✔

      **Probando radios alrededor:**

      | $r$ | $h = 16/r^{2}$ | $S = 2\pi r^{2}+2\pi rh$ |
      |---|---|---|
      | $1$ | $16$ | $2\pi+32\pi = 34\pi$ |
      | $1{,}5$ | $7{,}11$ | $4{,}5\pi+21{,}33\pi = 25{,}83\pi$ |
      | $2$ | $4$ | $\mathbf{24\pi}$ |
      | $3$ | $1{,}78$ | $18\pi+10{,}67\pi = 28{,}67\pi$ |

      El $24\pi$ es el menor ✔ Y la curva es claramente suave alrededor: entre
      $r=1{,}5$ y $r=3$ la superficie solo varía un 11 %, lo típico de un
      mínimo con segunda derivada moderada.

      **Del resultado general.** Rehaciendo el problema con volumen $V$
      cualquiera sale

      $$
      r = \sqrt[3]{\frac{V}{2\pi}},
      \qquad
      h = 2r
      $$

      Con $V = 16\pi$: $r = \sqrt[3]{8} = 2$ ✔

  - id: ex2021-3ev-4-barrow-demostrado
    titulo: Enunciar el teorema fundamental y sacar Barrow de él
    fuente: >-
      Ejercicio 4 · Tercera evaluación, 15 de enero de 2021 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 0
      comp4: 10

    nivel: examen
    enunciado: |
      Enunciar el Teorema fundamental del Cálculo Infinitesimal y utilizarlo
      para demostrar la Regla de Barrow.
    pide: Enunciar y demostrar.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dice exactamente el teorema fundamental?
        opciones:
          - texto: >-
              Que la función integral $F(x) = \int_a^{x}f$ es **derivable** y
              $F' = f$, si $f$ es continua
            correcta: true
            mensaje: |
              Exacto. El teorema fundamental habla de **derivar una integral**:
              construye una primitiva. Barrow es lo otro, evaluar una integral
              con una primitiva, y se deduce de él.
          - texto: >-
              Que $\int_a^{b}f = F(b)-F(a)$ para cualquier primitiva $F$
            mensaje: |
              Eso **es** la regla de Barrow, que es lo que hay que demostrar. Si
              se enuncia como teorema fundamental, la demostración se queda sin
              punto de partida.
          - texto: >-
              Que toda función continua es integrable
            mensaje: |
              Es un teorema previo y cierto, pero no es este.
          - texto: >-
              Que derivar e integrar son operaciones inversas
            mensaje: |
              Es el resumen en una frase, y sirve como idea. Pero un enunciado
              necesita hipótesis y tesis explícitas: qué función, en qué
              intervalo, con qué condición.

      - tipo: calcular
        titulo: La constante que se cancela
        pregunta: |
          Calcula $\int_0^{3}x^{2}dx$ usando la primitiva
          $G(x) = \frac{x^{3}}{3}+100$, que también lo es.
        respuesta:
          tipo: numero
          valor: '9'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '109'
            mensaje: |
              109 es $G(3)$ a secas. Barrow **resta** los dos valores:
              $G(3)-G(0) = 109-100$.
          - valor: '209'
            mensaje: |
              209 sumaría los dos valores en vez de restarlos, y además
              duplicaría la constante.
          - valor: '27'
            mensaje: |
              27 es $3^{3}$, sin dividir entre 3.
        pista: |
          $G(3)-G(0)$. El 100 aparece en los dos.
        desarrollo: |
          $$
          G(3) = \frac{27}{3}+100 = 109,
          \qquad
          G(0) = 0+100 = 100
          $$

          $$
          \int_0^{3}x^{2}dx = G(3)-G(0) = 9
          $$

          Y con la primitiva «normal» $\frac{x^{3}}{3}$ sale $9-0 = 9$: **el
          mismo resultado**.
        veredicto: |
          El 100 se cancela al restar, y eso es exactamente el paso 4 de la
          demostración. Por eso Barrow admite **cualquier** primitiva.

      - tipo: justificar
        pregunta: |
          Ordena la demostración de la regla de Barrow. Una de las piezas no
          debe entrar.
        piezas:
          - texto: |
              **Partir del teorema fundamental.** Como $f$ es continua en
              $[a,b]$, la función $F(x) = \int_a^{x}f(t)\,dt$ es derivable y
              $F'(x) = f(x)$ en todo $[a,b]$. Es decir: **$F$ es una primitiva
              de $f$**.
          - texto: |
              **Sea $G$ otra primitiva cualquiera**, es decir $G' = f$ en
              $[a,b]$. Entonces $(G-F)' = f-f = 0$ en todo el intervalo.
          - texto: |
              **Una función con derivada nula en un INTERVALO es constante.**
              Es consecuencia del teorema del valor medio de Lagrange, y aquí es
              donde se usa que $[a,b]$ sea un intervalo.
          - texto: |
              Luego $G(x) = F(x)+C$ para todo $x \in [a,b]$, con $C$ una
              constante.
          - texto: |
              **Evaluar en los extremos:**
              $G(b)-G(a) = \left[F(b)+C\right]-\left[F(a)+C\right] = F(b)-F(a)$.
          - texto: |
              Y como $F(a) = \int_a^{a}f = 0$ y $F(b) = \int_a^{b}f$, queda
              $\int_a^{b}f = G(b)-G(a)$.
          - texto: |
              La constante $C$ se calcula imponiendo $G(a)=0$, y con ella se
              despeja la integral.
            trampa: true
            mensaje: |
              No hay que calcular $C$: **se cancela sola** al restar
              $G(b)-G(a)$, y ese es justamente el punto elegante de la
              demostración. Además $G(a)$ no tiene por qué valer 0 —$G$ es una
              primitiva **cualquiera**—, así que imponerlo sería añadir una
              hipótesis que el enunciado de Barrow no tiene. Es precisamente lo
              que hace útil la regla: vale con la primitiva que uno encuentre.
        veredicto: |
          Que $C$ se cancele es lo que permite usar **cualquier** primitiva.
          Sin eso, Barrow no serviría de nada en la práctica.

      - tipo: reconocer
        pregunta: |
          ¿Dónde se usa que $[a,b]$ sea un **intervalo** y no un conjunto
          cualquiera?
        opciones:
          - texto: >-
              Al decir que $G-F$ es constante por tener derivada nula
            correcta: true
            mensaje: |
              Exacto. En un conjunto desconexo la afirmación es falsa: en
              $(-1,0)\cup(0,1)$ la función que vale 0 a un lado y 1 al otro
              tiene derivada nula y no es constante. La demostración pasa por el
              teorema del valor medio, que necesita conexión.
          - texto: >-
              Al aplicar el teorema fundamental
            mensaje: |
              También lo necesita, pero el punto delicado —el que se olvida— es
              el de la constante.
          - texto: >-
              Al evaluar en $a$ y en $b$
            mensaje: |
              Evaluar no necesita nada especial.
          - texto: >-
              No se usa en ningún sitio
            mensaje: |
              Sí se usa, y es la hipótesis que más se pasa por alto en esta
              demostración.

    resolucion: |
      **Lo que pide el enunciado.** Dos cosas, y las dos puntúan: enunciar bien
      y demostrar bien. Los diez puntos son de COMP4.

      ### 1 · El teorema fundamental del Cálculo Infinitesimal

      > **Teorema.** Sea $f$ una función **continua** en el intervalo $[a,b]$.
      > Se define la *función integral*
      >
      > $$
      > F(x) = \int_a^{x}f(t)\,dt, \qquad x \in [a,b]
      > $$
      >
      > Entonces $F$ es **derivable** en $[a,b]$ y
      >
      > $$
      > F'(x) = f(x) \qquad \text{para todo } x \in [a,b]
      > $$
      >
      > Es decir: **$F$ es una primitiva de $f$**.

      Dos precisiones que conviene añadir:

      - Basta con que $f$ sea **integrable** para que $F$ esté definida y sea
        continua; la **derivabilidad** en un punto necesita que $f$ sea continua
        **en ese punto**.
      - En los extremos $a$ y $b$ se entiende derivada lateral.

      **Qué dice, en una frase:** integrar una función continua produce una
      primitiva suya. Derivar deshace integrar.

      ### 2 · La regla de Barrow

      > **Regla de Barrow.** Sea $f$ continua en $[a,b]$ y sea $G$ **una
      > primitiva cualquiera** de $f$ en $[a,b]$, es decir $G'=f$. Entonces
      >
      > $$
      > \int_a^{b}f(x)\,dx = G(b)-G(a)
      > $$

      Nótese la diferencia: el teorema fundamental **construye** una primitiva;
      Barrow **usa** una para calcular la integral. Son las dos direcciones del
      mismo puente.

      ### 3 · La demostración

      **Paso 1.** Como $f$ es continua en $[a,b]$, el teorema fundamental
      asegura que

      $$
      F(x) = \int_a^{x}f(t)\,dt
      $$

      es derivable con $F' = f$. Luego $F$ es una primitiva de $f$.

      **Paso 2.** Sea $G$ otra primitiva cualquiera. Entonces

      $$
      (G-F)'(x) = G'(x)-F'(x) = f(x)-f(x) = 0
      \qquad\text{para todo } x \in [a,b]
      $$

      **Paso 3.** Una función con derivada nula en un **intervalo** es
      constante. Y aquí conviene decir por qué: si hubiera $x_1<x_2$ con
      $(G-F)(x_1) \neq (G-F)(x_2)$, el **teorema del valor medio de Lagrange**
      daría un $\xi \in (x_1,x_2)$ con

      $$
      (G-F)'(\xi)
      = \frac{(G-F)(x_2)-(G-F)(x_1)}{x_2-x_1} \neq 0
      $$

      contra el paso 2. Luego existe $C$ con

      $$
      G(x) = F(x)+C \qquad\text{para todo } x \in [a,b]
      $$

      **Paso 4.** Evaluando en los dos extremos y restando:

      $$
      G(b)-G(a) = \left[F(b)+C\right]-\left[F(a)+C\right] = F(b)-F(a)
      $$

      **La constante se cancela.** Por eso vale cualquier primitiva.

      **Paso 5.** Y por definición de $F$:

      $$
      F(a) = \int_a^{a}f = 0,
      \qquad
      F(b) = \int_a^{b}f
      $$

      $$
      \boxed{\int_a^{b}f(x)\,dx = G(b)-G(a)} \qquad \blacksquare
      $$

      ### 4 · Las tres hipótesis, y qué pasa sin ellas

      Una demostración de COMP4 se juzga por si las hipótesis están dichas y
      usadas. Estas son las tres:

      | hipótesis | dónde se usa | qué pasa sin ella |
      |---|---|---|
      | $f$ **continua** | paso 1, para que $F'=f$ | $F$ puede no ser derivable |
      | $[a,b]$ es un **intervalo** | paso 3, para la constante | la diferencia puede no ser constante |
      | $G' = f$ **en todo** $[a,b]$ | paso 2 | si falla en un punto, la resta no es nula ahí |

      **La del intervalo es la que más se olvida.** En un dominio desconexo el
      paso 3 es falso: la función que vale $0$ en $(-1,0)$ y $1$ en $(0,1)$
      tiene derivada nula en todo su dominio y no es constante.

      **Y la de la continuidad tiene un contraejemplo clásico.** Si

      $$
      f(x) = \begin{cases}0 & x \le 0\\ 1 & x>0\end{cases}
      $$

      entonces $F(x) = \int_{-1}^{x}f$ vale 0 a la izquierda y $x$ a la derecha:
      es continua pero **no derivable en 0**, justo donde $f$ salta. El teorema
      fundamental no se aplica ahí.

      ### 5 · Una comprobación de que la regla funciona

      Con $f(x) = x^{2}$ en $[0,3]$ y dos primitivas distintas:

      $$
      G_1(x) = \frac{x^{3}}{3},
      \qquad
      G_2(x) = \frac{x^{3}}{3}+100
      $$

      $$
      G_1(3)-G_1(0) = 9-0 = 9
      $$

      $$
      G_2(3)-G_2(0) = 109-100 = 9 \quad\checkmark
      $$

      La misma respuesta con las dos: el $C$ se cancela, como decía el paso 4.

  - id: ex2021-3ev-5-dos-integrales-con-trampa
    titulo: Una integral que se simplifica y otra que ni siquiera existe
    fuente: >-
      Ejercicio 5 · Tercera evaluación, 15 de enero de 2021 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 9
      comp4: 0

    nivel: examen
    enunciado: |
      **a)** Calcular
      $\displaystyle\int\frac{\cos x}{8-4\,\mathrm{sen}^{2}x-7\cos^{2}x}\,dx$.

      **b)** Calcular $\displaystyle\int_{-1}^{1}\frac{dx}{x^{2}}$.
    pide: Calcular las dos integrales.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado (a), ¿qué conviene hacer antes de sustituir?
        opciones:
          - texto: >-
              Dejar el denominador en función **solo de $\mathrm{sen}\,x$**, con
              $\cos^{2}x = 1-\mathrm{sen}^{2}x$
            correcta: true
            mensaje: |
              Exacto, y es lo que revela el ejercicio: el denominador se reduce
              a $1+3\,\mathrm{sen}^{2}x$ y el cambio $u=\mathrm{sen}\,x$ lo
              resuelve, porque $\cos x\,dx$ es justo $du$.
          - texto: >-
              Aplicar el cambio de Weierstrass
              $t=\tan\frac x2$
            mensaje: |
              Funciona siempre, pero aquí es un mazo para una nuez: deja una
              racional en $t$ mucho más fea. Antes conviene mirar si el
              numerador es la derivada de algo.
          - texto: >-
              Integrar por partes
            mensaje: |
              Por partes no ayuda con un cociente trigonométrico así.
          - texto: >-
              Descomponer en fracciones simples
            mensaje: |
              No hay polinomios todavía. Primero hay que llegar a una función
              racional con un cambio.

      - tipo: calcular
        titulo: El denominador simplificado
        pregunta: |
          Escribiendo todo en función de $s = \mathrm{sen}\,x$, el denominador
          queda $1+k\,s^{2}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '-11'
            mensaje: |
              $-11$ saldría de sumar los coeficientes con el signo equivocado:
              $-4+(-7) = -11$. Pero el $-7\cos^{2}$ aporta $+7s^{2}$ al
              sustituir, no $-7s^{2}$.
          - valor: '11'
            mensaje: |
              11 sería $4+7$. Los dos términos van con signos distintos:
              $-4s^{2}+7s^{2} = 3s^{2}$.
          - valor: '-3'
            mensaje: |
              Signo cambiado. $-4s^{2}+7s^{2} = +3s^{2}$.
        pista: |
          $\cos^{2}x = 1-s^{2}$. Sustituye y agrupa.
        desarrollo: |
          $$
          8-4s^{2}-7\left(1-s^{2}\right)
          = 8-4s^{2}-7+7s^{2}
          = 1+3s^{2}
          $$

          El denominador, que parecía complicado, es

          $$
          1+3\,\mathrm{sen}^{2}x
          $$

          y el numerador $\cos x$ es exactamente la derivada de
          $\mathrm{sen}\,x$: el cambio está servido.
        veredicto: |
          De cuatro términos a dos. El enunciado disfraza un cambio inmediato
          con una identidad trigonométrica, y ese es todo el ejercicio.

      - tipo: calcular
        titulo: El coeficiente de la primitiva
        pregunta: |
          La primitiva es $C\arctan\left(\sqrt3\,\mathrm{sen}\,x\right)$. ¿Cuánto
          vale $C$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.5774'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '1.7321'
            mensaje: |
              $\sqrt3$ es el inverso de la respuesta. Al sacar el 3 factor común
              del denominador aparece $\frac13$, y al integrar
              $\frac{1}{u^{2}+1/3}$ sale un $\sqrt3$: el producto es
              $\frac{1}{\sqrt3}$.
          - valor: '0.3333'
            mensaje: |
              $\frac13$ es solo el factor de sacar el 3 fuera. Falta el
              $\sqrt3$ que aporta la fórmula del arcotangente.
          - valor: '1'
            mensaje: |
              Con $C=1$ la derivada saldría $\frac{\sqrt3\cos x}
              {1+3\,\mathrm{sen}^{2}x}$: sobra un $\sqrt3$.
        pista: |
          $\int\frac{du}{a^{2}+u^{2}} = \frac1a\arctan\frac ua$.
        desarrollo: |
          Con $u = \mathrm{sen}\,x$, $du = \cos x\,dx$:

          $$
          \int\frac{du}{1+3u^{2}}
          = \frac13\int\frac{du}{u^{2}+\frac13}
          $$

          Con $a = \frac{1}{\sqrt3}$:

          $$
          = \frac13\cdot\frac{1}{1/\sqrt3}\arctan\frac{u}{1/\sqrt3}
          = \frac{\sqrt3}{3}\arctan\left(\sqrt3\,u\right)
          $$

          $$
          C = \frac{\sqrt3}{3} = \frac{1}{\sqrt3} \approx 0{,}5774
          $$
        veredicto: |
          Comprobar derivando es inmediato y cuesta diez segundos: la derivada
          del arcotangente trae el $\sqrt3$ que cancela al de fuera.

      - tipo: justificar
        pregunta: |
          Ordena la respuesta al apartado (b). Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Mirar el integrando antes de integrar.** $\frac{1}{x^{2}}$ no
              está definida en $x=0$, y $0$ está **dentro** de $[-1,1]$.
          - texto: |
              **Es una integral impropia de segunda especie**, y hay que
              partirla en el punto conflictivo:
              $\int_{-1}^{0}+\int_0^{1}$.
          - texto: |
              **La primera mitad:**
              $\lim_{\varepsilon\to0^{-}}\left[-\frac1x\right]_{-1}^{\varepsilon}
              = \lim\left(-\frac{1}{\varepsilon}-1\right) = +\infty$.
          - texto: |
              **Diverge**, y basta con que una mitad lo haga: la integral no
              converge.
          - texto: |
              **La comprobación de sentido común:** el integrando es
              **positivo** en todo el intervalo, así que la integral no puede
              salir negativa.
          - texto: |
              Aplicando Barrow, $\left[-\frac1x\right]_{-1}^{1} = -1-1 = -2$.
            trampa: true
            mensaje: |
              Ese es **el** error del ejercicio, y da un absurdo: la integral de
              una función positiva no puede ser $-2$. Barrow exige que la
              primitiva sea válida en **todo** el intervalo, y $-\frac1x$ ni
              siquiera está definida en $x=0$. El enunciado está construido para
              que quien no mire el integrando conteste $-2$ con toda
              tranquilidad.
        veredicto: |
          Que el resultado salga negativo con un integrando positivo es la
          alarma. Comprobar el signo cuesta un segundo y detecta el fallo.

    resolucion: |
      **Datos.** Dos integrales. La primera es un cambio disfrazado; la segunda
      es una trampa.

      ### 1 · Apartado (a): simplificar antes de integrar

      El denominador tiene seno y coseno mezclados. Con
      $\cos^{2}x = 1-\mathrm{sen}^{2}x$, escribiendo $s = \mathrm{sen}\,x$:

      $$
      8-4s^{2}-7\left(1-s^{2}\right)
      = 8-4s^{2}-7+7s^{2}
      = 1+3s^{2}
      $$

      La integral se vuelve

      $$
      \int\frac{\cos x\,dx}{1+3\,\mathrm{sen}^{2}x}
      $$

      **Y el numerador es la derivada del seno**, que es lo único que hay
      dentro. El cambio es inmediato:

      $$
      u = \mathrm{sen}\,x,
      \qquad
      du = \cos x\,dx
      $$

      $$
      \int\frac{du}{1+3u^{2}}
      $$

      ### 2 · El arcotangente

      Sacando el 3 factor común para dejarlo en la forma
      $\int\frac{du}{a^{2}+u^{2}}$:

      $$
      \int\frac{du}{3\left(u^{2}+\frac13\right)}
      = \frac13\int\frac{du}{u^{2}+\left(\frac{1}{\sqrt3}\right)^{2}}
      $$

      $$
      = \frac13\cdot\sqrt3\,\arctan\left(\sqrt3\,u\right)+C
      $$

      $$
      \boxed{\int\frac{\cos x\,dx}{8-4\,\mathrm{sen}^{2}x-7\cos^{2}x}
      = \frac{\sqrt3}{3}\arctan\left(\sqrt3\,\mathrm{sen}\,x\right)+C}
      $$

      **Comprobando por derivación:**

      $$
      \frac{d}{dx}\left[\frac{\sqrt3}{3}
      \arctan\left(\sqrt3\,\mathrm{sen}\,x\right)\right]
      = \frac{\sqrt3}{3}\cdot
      \frac{\sqrt3\cos x}{1+3\,\mathrm{sen}^{2}x}
      = \frac{\cos x}{1+3\,\mathrm{sen}^{2}x} \quad\checkmark
      $$

      ### 3 · Apartado (b): mirar el integrando primero

      $$
      \int_{-1}^{1}\frac{dx}{x^{2}}
      $$

      **El integrando no está definido en $x=0$**, y $0$ está justo en medio del
      intervalo. Es una **integral impropia de segunda especie**, y hay que
      partirla:

      $$
      \int_{-1}^{1}\frac{dx}{x^{2}}
      = \int_{-1}^{0}\frac{dx}{x^{2}}+\int_0^{1}\frac{dx}{x^{2}}
      $$

      **La primera mitad:**

      $$
      \int_{-1}^{0}\frac{dx}{x^{2}}
      = \lim_{\varepsilon\to0^{-}}\left[-\frac1x\right]_{-1}^{\varepsilon}
      = \lim_{\varepsilon\to0^{-}}\left(-\frac{1}{\varepsilon}-1\right)
      = +\infty
      $$

      —porque $\varepsilon$ es negativo y $-\frac{1}{\varepsilon}$ se dispara a
      $+\infty$—.

      $$
      \boxed{\text{La integral DIVERGE}}
      $$

      Basta con que una mitad diverja. La otra hace lo mismo, por simetría.

      ### 4 · La trampa, dicha en voz alta

      Aplicando Barrow sin mirar:

      $$
      \left[-\frac1x\right]_{-1}^{1} = -1-(+1) = -2
      $$

      **Y eso es imposible.** El integrando $\frac{1}{x^{2}}$ es **positivo** en
      todo el intervalo, así que su integral —si existiera— tendría que ser
      positiva. Un resultado negativo es la alarma.

      El fallo está en que la **regla de Barrow exige que la primitiva valga en
      todo el intervalo**, y $-\frac1x$ no está definida en $x=0$. Sin esa
      hipótesis, la regla no dice nada — y aquí dice algo falso.

      Es exactamente el mismo teorema del ejercicio 4 de este examen, visto
      desde su hipótesis. Los dos ejercicios están puestos a propósito en el
      mismo papel.

      ### 5 · Comprobación

      **De (a), numéricamente.** Entre $x=0$ y $x=\frac{\pi}{2}$:

      $$
      \frac{\sqrt3}{3}\left[\arctan\sqrt3-\arctan0\right]
      = 0{,}5774\cdot\frac{\pi}{3} = 0{,}6046
      $$

      Y sumando el integrando en cien trozos sale $0{,}6046$ ✔

      **De (a), en un caso fácil.** En $x=0$ el integrando vale
      $\frac{1}{1} = 1$, y la derivada de la primitiva en 0 vale
      $\frac{\sqrt3}{3}\cdot\sqrt3 = 1$ ✔

      **De (b), viendo cómo diverge.** Truncando cerca del cero:

      | $\varepsilon$ | $\int_{\varepsilon}^{1}\frac{dx}{x^{2}}$ |
      |---|---|
      | $0{,}1$ | $9$ |
      | $0{,}01$ | $99$ |
      | $0{,}001$ | $999$ |

      Crece como $\frac{1}{\varepsilon}$: sin techo ✔

      **Y el criterio general que lo decide sin cuentas.**
      $\int_0^{1}\frac{dx}{x^{p}}$ converge si y solo si $p<1$. Aquí $p=2$:
      diverge ✔ Merece la pena recordarlo, porque resuelve el apartado de un
      vistazo.

  - id: ex2021-3ev-6-derivada-direccional-maxima
    titulo: Ajustar el gradiente para que apunte a la bisectriz
    fuente: >-
      Ejercicio 6 · Tercera evaluación, 15 de enero de 2021 · Cálculo, UPV/EHU ·
      Este ejercicio es de varias variables, materia del segundo cuatrimestre ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    nivel: examen
    enunciado: |
      Hallar $a$ y $b$ para que la derivada direccional máxima de la función
      $f(x,y) = \mathrm{e}^{ax+by}\cos(x+y)$ en el punto $(0,0)$ en la dirección
      de la bisectriz del primer cuadrante sea $3\sqrt2$.
    pide: Hallar $a$ y $b$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dos cosas dice el enunciado sobre el gradiente?
        opciones:
          - texto: >-
              Que **apunta** en la dirección de la bisectriz y que su **módulo**
              vale $3\sqrt2$
            correcta: true
            mensaje: |
              Exacto, y son las dos ecuaciones del problema. La derivada
              direccional máxima se alcanza siempre en la dirección del
              gradiente, y su valor es el módulo del gradiente.
          - texto: >-
              Que su módulo vale $3\sqrt2$, y nada más
            mensaje: |
              Con una sola ecuación y dos incógnitas el problema quedaría
              indeterminado. La dirección aporta la segunda.
          - texto: >-
              Que es perpendicular a la bisectriz
            mensaje: |
              El gradiente es perpendicular a las **curvas de nivel**, pero
              aquí la bisectriz es la dirección de máximo crecimiento, no una
              curva de nivel.
          - texto: >-
              Que vale $(3,3)$
            mensaje: |
              Es la respuesta, pero hay que deducirla. Y de hecho $(3,3)$ tiene
              módulo $3\sqrt2$ ✔: buena forma de comprobarla al final.

      - tipo: calcular
        titulo: El gradiente en el origen
        pregunta: |
          ¿Cuánto vale $\frac{\partial f}{\partial x}(0,0)$, en función de $a$?
          Si $a=3$, ¿cuánto sale?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 saldría de olvidar el factor $a$ que baja al derivar la
              exponencial. En $(0,0)$ la derivada parcial vale exactamente $a$.
          - valor: '0'
            mensaje: |
              0 saldría de quedarse solo con el término del seno, que sí se
              anula en el origen. Falta el término de la exponencial.
          - valor: '4.2426'
            mensaje: |
              $3\sqrt2$ es el **módulo** del gradiente, no una de sus
              componentes.
        pista: |
          Regla del producto: deriva la exponencial y el coseno, y evalúa en
          $(0,0)$.
        desarrollo: |
          $$
          \frac{\partial f}{\partial x}
          = a\,\mathrm{e}^{ax+by}\cos(x+y)
          -\mathrm{e}^{ax+by}\,\mathrm{sen}(x+y)
          $$

          En $(0,0)$, con $\mathrm{e}^{0}=1$, $\cos0=1$ y
          $\mathrm{sen}\,0=0$:

          $$
          \frac{\partial f}{\partial x}(0,0) = a\cdot1\cdot1-1\cdot0 = a
          $$

          Igual con la otra:

          $$
          \frac{\partial f}{\partial y}(0,0) = b
          $$

          $$
          \nabla f(0,0) = (a,\,b)
          $$

          Con $a=3$ sale 3.
        veredicto: |
          El gradiente en el origen es **exactamente $(a,b)$**: el coseno vale 1
          y el seno 0, así que los parámetros salen limpios. El enunciado está
          diseñado para eso.

      - tipo: calcular
        titulo: El valor de a
        pregunta: |
          ¿Cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '4.2426'
            mensaje: |
              $3\sqrt2$ es el módulo del gradiente completo. Repartido entre las
              dos componentes iguales, cada una vale
              $\frac{3\sqrt2}{\sqrt2} = 3$.
          - valor: '2.1213'
            mensaje: |
              $\frac{3\sqrt2}{2}$ saldría de dividir el módulo entre 2 en vez de
              entre $\sqrt2$.
          - valor: '1.5'
            mensaje: |
              $1{,}5$ no encaja: con $a=b=1{,}5$ el módulo sería
              $1{,}5\sqrt2 \approx 2{,}12$, la mitad de lo pedido.
        pista: |
          $\nabla f = (a,b)$ paralelo a $(1,1)$, y
          $\left|\nabla f\right| = 3\sqrt2$.
        desarrollo: |
          **La dirección.** El máximo crecimiento va en la dirección del
          gradiente, y debe ser la de la bisectriz $(1,1)$:

          $$
          (a,b) \parallel (1,1)
          \;\Longrightarrow\;
          a = b
          $$

          —y con el **mismo sentido**, así que $a>0$—.

          **El módulo:**

          $$
          \left|\nabla f\right| = \sqrt{a^{2}+b^{2}} = \sqrt{2a^{2}}
          = a\sqrt2 = 3\sqrt2
          $$

          $$
          a = 3
          \;\Longrightarrow\;
          b = 3
          $$
        veredicto: |
          Si se admitiera $a=b=-3$ el gradiente apuntaría a la bisectriz del
          **tercer** cuadrante, y la derivada direccional en la del primero
          sería $-3\sqrt2$: mínima, no máxima.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Las dos propiedades del gradiente:** la derivada direccional
              máxima se alcanza en su dirección, y su valor es
              $\left|\nabla f\right|$.
          - texto: |
              **Calcular el gradiente en el origen.** Derivando por partes y
              evaluando: $\nabla f(0,0) = (a,b)$.
          - texto: |
              **Primera ecuación, la dirección:** $(a,b)$ paralelo y del mismo
              sentido que $(1,1)$, luego $a=b>0$.
          - texto: |
              **Segunda ecuación, el módulo:**
              $\sqrt{a^{2}+b^{2}} = a\sqrt2 = 3\sqrt2$, de donde $a=3$.
          - texto: |
              **Resultado:** $a = b = 3$, con
              $\nabla f(0,0) = (3,3)$ y
              $\left|\nabla f\right| = 3\sqrt2$ ✔
          - texto: |
              $a=b=-3$ también sirve, porque el módulo del gradiente es el
              mismo.
            trampa: true
            mensaje: |
              El módulo sí, pero el **sentido** no. Con $(-3,-3)$ el gradiente
              apunta a la bisectriz del tercer cuadrante, y en la dirección
              $\frac{(1,1)}{\sqrt2}$ la derivada direccional valdría
              $-3\sqrt2$: es el **mínimo**, no el máximo. El enunciado dice
              «máxima», y eso fija el signo.
        veredicto: |
          Paralelo no es lo mismo que del mismo sentido. Esa distinción es la
          que descarta la segunda solución.

    resolucion: |
      **Datos.** $f(x,y) = \mathrm{e}^{ax+by}\cos(x+y)$, el punto $(0,0)$, la
      dirección de la bisectriz del primer cuadrante y el valor $3\sqrt2$.

      > Este ejercicio es de **funciones de varias variables**, tema 6 del
      > programa y materia del segundo cuatrimestre. Aparece aquí porque el
      > examen de enero de 2021 lo incluyó.

      ### 1 · Las dos propiedades que hacen falta

      Para una función diferenciable, la derivada direccional en la dirección
      unitaria $\vec u$ es

      $$
      D_{\vec u}f = \nabla f \cdot \vec u
      = \left|\nabla f\right|\cos\theta
      $$

      donde $\theta$ es el ángulo entre $\vec u$ y el gradiente. De ahí las dos
      propiedades:

      1. **El máximo se alcanza cuando $\theta=0$**, es decir en la dirección
         del gradiente.
      2. **Ese máximo vale $\left|\nabla f\right|$.**

      El enunciado da las dos cosas: la dirección y el valor. Dos ecuaciones,
      dos incógnitas.

      ### 2 · El gradiente en el origen

      Derivando con la regla del producto:

      $$
      \frac{\partial f}{\partial x}
      = a\,\mathrm{e}^{ax+by}\cos(x+y)-\mathrm{e}^{ax+by}\mathrm{sen}(x+y)
      $$

      $$
      \frac{\partial f}{\partial y}
      = b\,\mathrm{e}^{ax+by}\cos(x+y)-\mathrm{e}^{ax+by}\mathrm{sen}(x+y)
      $$

      En $(0,0)$: $\mathrm{e}^{0}=1$, $\cos0=1$, $\mathrm{sen}\,0=0$. Los
      segundos términos **se anulan**:

      $$
      \boxed{\nabla f(0,0) = (a,\,b)}
      $$

      El enunciado está construido para que el gradiente en el origen sea
      directamente el par de parámetros.

      ### 3 · Las dos ecuaciones

      **Dirección.** La bisectriz del primer cuadrante tiene vector director
      $(1,1)$, y unitario $\frac{(1,1)}{\sqrt2}$. Que el gradiente apunte ahí:

      $$
      (a,b) = \lambda(1,1) \text{ con } \lambda>0
      \;\Longrightarrow\;
      a = b > 0
      $$

      **Módulo.**

      $$
      \left|\nabla f(0,0)\right| = \sqrt{a^{2}+b^{2}} = \sqrt{2a^{2}}
      = \left|a\right|\sqrt2
      $$

      Igualando a $3\sqrt2$ y con $a>0$:

      $$
      a\sqrt2 = 3\sqrt2
      \;\Longrightarrow\;
      a = 3
      $$

      $$
      \boxed{a = 3, \qquad b = 3}
      $$

      ### 4 · Por qué $a=b=-3$ no vale

      El módulo saldría igual: $\left|(-3,-3)\right| = 3\sqrt2$. Pero el
      gradiente apuntaría a la bisectriz del **tercer** cuadrante, y en la
      dirección $\vec u = \frac{(1,1)}{\sqrt2}$ la derivada direccional sería

      $$
      D_{\vec u}f = (-3,-3)\cdot\frac{(1,1)}{\sqrt2}
      = \frac{-6}{\sqrt2} = -3\sqrt2
      $$

      Ese es el valor **mínimo** de la derivada direccional, no el máximo. El
      enunciado dice «máxima», y eso fija el signo.

      Paralelo no es lo mismo que del mismo sentido, y aquí la diferencia
      descarta media solución.

      ### 5 · Comprobación

      **Del gradiente.** Con $a=b=3$:

      $$
      \nabla f(0,0) = (3,3),
      \qquad
      \left|\nabla f\right| = \sqrt{9+9} = \sqrt{18} = 3\sqrt2 \quad\checkmark
      $$

      **De la derivada direccional en la bisectriz:**

      $$
      D_{\vec u}f = (3,3)\cdot\frac{(1,1)}{\sqrt2}
      = \frac{6}{\sqrt2} = 3\sqrt2 \quad\checkmark
      $$

      Coincide con el módulo, que es la señal de que $\vec u$ es exactamente la
      dirección del gradiente.

      **En otra dirección, para ver que es menor.** Con $\vec v = (1,0)$:

      $$
      D_{\vec v}f = (3,3)\cdot(1,0) = 3 < 3\sqrt2 \approx 4{,}243
      \quad\checkmark
      $$

      **Numérica, avanzando por la bisectriz.** Con $t=0{,}01$, el punto
      $\left(\frac{t}{\sqrt2},\frac{t}{\sqrt2}\right)$:

      $$
      f = \mathrm{e}^{3\cdot2\cdot0{,}00707}\cos(0{,}01414)
      = \mathrm{e}^{0{,}04243}\cdot0{,}9999 = 1{,}04234
      $$

      $$
      \frac{f-f(0,0)}{t} = \frac{1{,}04234-1}{0{,}01} = 4{,}234
      $$

      frente a $3\sqrt2 = 4{,}243$ ✔ La pequeña diferencia es el término de
      segundo orden.
