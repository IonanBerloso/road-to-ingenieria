        <text class="pet21-l" x="224.4" y="101.6" text-anchor="end" fill="var(--d1)">y = x²</text>
        <text class="pet21-l" x="89.2" y="83.8" fill="var(--alt)">y = √x</text>
        <text class="pet21-l" x="156.8" y="101.6" text-anchor="middle" fill="var(--live)">D</text>
      </svg>
      <figcaption>
      El recinto entre y = x² y x = y², que se cortan en (0,0) y en (1,1). Las flechas
      marcan el sentido positivo: se sube por la parábola de abajo y se vuelve por la
      de arriba, dejando el recinto siempre a la izquierda.
      </figcaption>
      </figure>

      **Camino corto: Green.**

      $$
      P=2xy-x^{2}\;\Longrightarrow\;\frac{\partial P}{\partial y}=2x,
      \qquad
      Q=x+y^{2}\;\Longrightarrow\;\frac{\partial Q}{\partial x}=1
      $$

      $$
      \oint_{L}P\,dx+Q\,dy=\iint_{D}\left(1-2x\right)dA
      =\int_{0}^{1}\left(1-2x\right)\left(\sqrt x-x^{2}\right)dx
      $$

      $$
      =\int_{0}^{1}\left(x^{1/2}-x^{2}-2x^{3/2}+2x^{3}\right)dx
      =\frac23-\frac13-\frac45+\frac12
      $$

      $$
      \boxed{\;\oint_{L}=\frac1{30}\;}
      $$

      **Camino largo: parametrizando.** En sentido positivo se sube por
      $y=x^{2}$ y se baja por $x=y^{2}$.

      *Tramo 1*, $x=t$, $y=t^{2}$, $t\in\left[0,1\right]$, $dx=dt$,
      $dy=2t\,dt$:

      $$
      \int_{0}^{1}\left[\left(2t\cdot t^{2}-t^{2}\right)
      +\left(t+t^{4}\right)2t\right]dt
      =\int_{0}^{1}\left(2t^{3}-t^{2}+2t^{2}+2t^{5}\right)dt
      $$

      $$
      =\frac12-\frac13+\frac23+\frac13=\frac76
      $$

      *Tramo 2*, de $\left(1,1\right)$ a $\left(0,0\right)$ por $x=y^{2}$. Con
      $y=s$ bajando de $1$ a $0$, $x=s^{2}$, $dx=2s\,ds$:

      $$
      \int_{1}^{0}\left[\left(2s^{2}\cdot s-s^{4}\right)2s
      +\left(s^{2}+s^{2}\right)\right]ds
      =\int_{1}^{0}\left(4s^{4}-2s^{5}+2s^{2}\right)ds
      $$

      $$
      =-\left(\frac45-\frac13+\frac23\right)=-\frac{17}{15}
      $$

      **Y la suma:**

      $$
      \frac76-\frac{17}{15}=\frac{35}{30}-\frac{34}{30}=\frac1{30}\;\checkmark
      $$

      **Lo que enseña este ejercicio.** Los dos tramos valen $1{,}17$ y $-1{,}13$,
      y el resultado es $0{,}033$: **casi se cancelan**. Por eso el camino largo
      es peligroso a mano — un error de una milésima en cualquiera de los dos
      arruina la respuesta — y por eso el enunciado pide los dos caminos: Green
      no es un atajo cualquiera, es el que evita restar dos números grandes y
      parecidos.

  - id: ex2021-ext-7-el-embalse-que-se-evapora
    titulo: El embalse que se llena y se evapora a la vez
    fuente: >-
      Ejercicio 3 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 1 de
      julio de 2021 · Cálculo, UPV/EHU · El examen no publica solución: la
      resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      En un embalse se acumulan mensualmente $1000$ litros de agua. Por otra
      parte, el agua se evapora con una tasa mensual del $5\,\%$. Si
      representamos la cantidad de agua del embalse mediante la función
      $C\left(t\right)$, donde $t$ se mide en meses:

      a) Escribir la EDO que debe cumplir $C\left(t\right)$.

      b) Obtener la solución general de la EDO anterior.

      c) Estudiar qué ocurrirá en el embalse a largo plazo.
    pide: La ecuación, su solución general y el comportamiento a largo plazo.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué significa «se evapora con una tasa mensual del $5\,\%$»?
        opciones:
          - texto: >-
              Que cada mes se pierde el $5\,\%$ **de lo que hay**, o sea
              $0{,}05\,C\left(t\right)$ litros
            correcta: true
            mensaje: |
              Eso es, y es lo que convierte el problema en una EDO en vez de en
              una resta. La pérdida depende del nivel, así que crece cuando el
              embalse se llena.
          - texto: Que se pierden $5$ litros cada mes
            mensaje: |
              Un porcentaje siempre es porcentaje **de algo**. Si fueran $5$
              litros fijos, el balance sería constante ($995$ al mes) y no haría
              falta ninguna ecuación diferencial.
          - texto: >-
              Que se pierde el $5\,\%$ de los $1000$ que entran, o sea $50$
              litros al mes
            mensaje: |
              Entonces el embalse ganaría $950$ litros todos los meses para
              siempre, sin límite. El enunciado pregunta qué pasa a largo plazo
              justamente porque la pérdida sí depende de lo acumulado.

      - tipo: calcular
        titulo: El nivel de equilibrio
        pregunta: |
          ¿En cuántos litros se estabiliza el embalse?
        respuesta:
          tipo: numero
          valor: '20000'
          tolerancia: 0.5
          formato: un número de litros
        distractores:
          - valor: '200'
            mensaje: |
              Has usado $5$ donde va $0{,}05$. Un $5\,\%$ es $\frac{5}{100}$, no
              $5$.
          - valor: '50'
            mensaje: |
              $1000\cdot0{,}05$ multiplica donde hay que dividir. El equilibrio
              está donde la pérdida iguala a la entrada: $0{,}05\,C=1000$.
          - valor: '1000'
            mensaje: |
              $1000$ es lo que entra cada mes, no lo que llega a haber. El
              embalse sigue creciendo mientras la evaporación sea menor que la
              entrada.
        pista: |
          El equilibrio es donde $C'=0$, o sea donde $1000=0{,}05\,C$.
        desarrollo: |
          $$
          C'\left(t\right)=1000-0{,}05\,C\left(t\right)=0
          \;\Longrightarrow\;
          C=\frac{1000}{0{,}05}=20\,000
          $$

      - tipo: calcular
        titulo: La constante, si el embalse empieza vacío
        pregunta: |
          En $C\left(t\right)=20000+K e^{-0,05t}$, ¿cuánto vale $K$ si
          $C\left(0\right)=0$?
        respuesta:
          tipo: numero
          valor: '-20000'
          tolerancia: 0.5
          formato: un número
        distractores:
          - valor: '20000'
            mensaje: |
              Signo. En $t=0$ la exponencial vale $1$, así que
              $0=20000+K$ obliga a $K=-20000$.
          - valor: '0'
            mensaje: |
              Con $K=0$ la solución sería la constante $20\,000$: el embalse ya
              estaría lleno desde el principio, que es lo contrario de empezar
              vacío.
        pista: |
          $e^{0}=1$.
        desarrollo: |
          $$
          C\left(0\right)=20000+K=0
          \;\Longrightarrow\;
          K=-20\,000
          $$

          $$
          C\left(t\right)=20\,000\left(1-e^{-0,05t}\right)
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento completo. Una pieza es falsa.
        piezas:
          - texto: >-
              El balance es entrada menos salida:
              $C'\left(t\right)=1000-0{,}05\,C\left(t\right)$.
          - texto: >-
              Es lineal de primer orden con coeficientes constantes: la solución
              general es $C\left(t\right)=20000+K e^{-0,05t}$.
          - texto: >-
              Como $e^{-0,05t}\to0$, a largo plazo el embalse se estabiliza en
              $20\,000$ litros, empiece como empiece.
          - texto: >-
              Como cada mes entran $1000$ litros y solo se evapora el $5\,\%$, el
              embalse crece sin límite.
            trampa: true
            mensaje: |
              El $5\,\%$ se aplica sobre una cantidad que va creciendo, así que
              la pérdida también crece: con $10\,000$ litros se evaporan $500$ al
              mes, con $20\,000$ se evaporan $1000$ y el balance se para. Es la
              diferencia entre una pérdida fija y una proporcional, y es toda la
              gracia del problema.
    resolucion: |
      **a) La ecuación.** Un balance: lo que cambia por unidad de tiempo es lo
      que entra menos lo que sale.

      | término | cuánto | de qué depende |
      |---|---|---|
      | entrada | $1000$ l/mes | de nada, es constante |
      | evaporación | $0{,}05\,C\left(t\right)$ l/mes | del agua que hay |

      $$
      \boxed{\;C'\left(t\right)=1000-0{,}05\,C\left(t\right)\;}
      $$

      Que la pérdida sea **proporcional** al contenido es lo que hace que esto
      sea una EDO y no una progresión aritmética.

      **b) La solución general.** Es lineal de primer orden. Se puede resolver de
      dos maneras y las dos son cortas.

      *Separando variables:*

      $$
      \frac{dC}{1000-0{,}05\,C}=dt
      \;\Longrightarrow\;
      -\frac{1}{0{,}05}\ln\left|1000-0{,}05\,C\right|=t+c
      $$

      $$
      1000-0{,}05\,C=A e^{-0,05t}
      \;\Longrightarrow\;
      C=20\,000-\frac{A}{0{,}05}e^{-0,05t}
      $$

      *Como lineal, solución particular más homogénea:* la particular constante
      es $C_{p}=20\,000$ y la homogénea es $C_{h}=K e^{-0,05t}$.

      $$
      \boxed{\;C\left(t\right)=20\,000+K e^{-0,05t}\;}
      $$

      **c) A largo plazo.** La exponencial tiende a cero, así que

      $$
      \lim_{t\to\infty}C\left(t\right)=20\,000\ \text{litros}
      $$

      y **el valor de $K$ no importa**: da igual cómo estuviera el embalse al
      principio. Si empieza por debajo de $20\,000$ sube, si empieza por encima
      baja, y si empieza justo ahí se queda.

