        <text class="vel21-l" x="57" y="38.6" fill="var(--live)">x′(t) = 6(t−1)(2t−1)</text>
        <text class="vel21-l" x="169.5" y="188.6" fill="var(--flag)">t = ¾ · x′ = −¾</text>
        <text class="vel21-l" x="82.5" y="139.8" text-anchor="middle" fill="var(--faint)">derecha</text>
        <text class="vel21-l" x="240" y="139.8" text-anchor="middle" fill="var(--faint)">derecha</text>
        <text class="vel21-l" x="135" y="209.1" text-anchor="middle" fill="var(--flag)">izquierda</text>
      </svg>
      <figcaption>
      La velocidad x′(t) es una parábola hacia arriba que corta el eje en t = ½ y en
      t = 1. Solo entre esos dos instantes es negativa —el objeto retrocede— y su
      punto más bajo, la rapidez máxima, está en t = ¾ con x′ = −¾.
      </figcaption>
      </figure>

      **b) La rapidez máxima hacia la izquierda.** En $\left(\frac12,1\right)$ la
      velocidad es negativa, así que la rapidez es $-x'$. Maximizar $-x'$ es
      minimizar $x'$, y $x'$ es una parábola hacia arriba:

      $$
      x'\left(t\right)=12t^{2}-18t+6
      \;\Longrightarrow\;
      x''\left(t\right)=24t-18=0
      \;\Longrightarrow\;
      t=\frac34
      $$

      El $\frac34$ cae dentro del tramo, y $x''$ pasa de negativa a positiva, así
      que es mínimo de $x'$:

      $$
      \boxed{\;x'\!\left(\tfrac34\right)=-\tfrac34\;}
      $$

      **Cómo se dice esto bien.** «Velocidad máxima» y «rapidez máxima» no son lo
      mismo cuando el movimiento es hacia atrás: la velocidad más grande del tramo
      es $0$ —en los extremos—, y la que el enunciado busca es la de módulo mayor.
      Merece la pena escribirlo con esas palabras: es un punto de COMP 4.

  - id: ex2021-ext-3-el-mclaurin-de-una-integral-sin-primitiva
    titulo: El McLaurin de una integral que no se sabe hacer
    fuente: >-
      Ejercicio 3 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 1 de
      julio de 2021 · Cálculo, UPV/EHU · Enunciado idéntico al 3a del primer
      cuatrimestral de la extraordinaria de 2021-2022. El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Calcular el polinomio de McLaurin de orden $2$ de la función

      $$
      F\left(x\right)=3+\int_{0}^{x}\frac{1+\operatorname{sen}t}{2+t^{2}}\,dt
      $$
    pide: El polinomio de Taylor de orden dos en el origen.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se deriva una función definida por una integral con la $x$ en el
          extremo superior?
        opciones:
          - texto: >-
              Por el teorema fundamental del cálculo: $F'\left(x\right)$ es el
              integrando evaluado en $x$
            correcta: true
            mensaje: |
              Eso es, y es justo lo que salva este ejercicio: derivar no exige
              saber integrar. $F'\left(x\right)
              =\frac{1+\operatorname{sen}x}{2+x^{2}}$.
          - texto: Hay que calcular primero la integral y después derivarla
            mensaje: |
              Ese es el camino largo, y aquí ni siquiera existe: ese integrando
              no tiene primitiva elemental. El teorema fundamental está
              precisamente para no tener que pasar por ahí.
          - texto: >-
              $F'\left(x\right)=\frac{1+\operatorname{sen}x}{2+x^{2}}\cdot x$,
              por la regla de la cadena
            mensaje: |
              La cadena multiplica por la derivada del extremo superior, y aquí
              el extremo es $x$, cuya derivada es $1$. Ese factor sería $2x$ si
              el extremo fuese $x^{2}$.

      - tipo: calcular
        titulo: La segunda derivada en el origen
        pregunta: |
          ¿Cuánto vale $F''\left(0\right)$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.25'
            mensaje: |
              Has dividido entre $\left(2+t^{2}\right)^{2}=4$ pero has dejado
              solo $\cos t$ arriba. El numerador de la regla del cociente es
              $\cos t\left(2+t^{2}\right)-\left(1+\operatorname{sen}t\right)2t$.
          - valor: '2'
            mensaje: |
              Ese es el numerador de la regla del cociente en $t=0$, sin dividir
              todavía entre $\left(2+t^{2}\right)^{2}=4$.
          - valor: '-0.5'
            mensaje: |
              Signo. En la regla del cociente el término que resta es
              $\left(1+\operatorname{sen}t\right)\cdot2t$, y en $t=0$ vale cero:
              no puede cambiarle el signo a nada.
        pista: |
          $F''$ es la derivada del integrando. Regla del cociente en $t=0$.
        desarrollo: |
          $$
          F'\left(x\right)=\frac{1+\operatorname{sen}x}{2+x^{2}}
          $$

          $$
          F''\left(x\right)=
          \frac{\cos x\left(2+x^{2}\right)-\left(1+\operatorname{sen}x\right)2x}
          {\left(2+x^{2}\right)^{2}}
          $$

          En $x=0$ el segundo término del numerador se anula:

          $$
          F''\left(0\right)=\frac{1\cdot2-1\cdot0}{4}=\frac12
          $$

      - tipo: calcular
        titulo: El coeficiente de x²
        pregunta: |
          ¿Cuál es el coeficiente que acompaña a $x^{2}$ en el polinomio?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              Ese es $F''\left(0\right)$ sin dividir entre $2!$. En la fórmula
              de Taylor el término de grado $n$ lleva $\frac{F^{(n)}(0)}{n!}$.
          - valor: '0.125'
            mensaje: |
              Has dividido entre $4$. El factorial que toca es $2!=2$, no $2^{2}$.
          - valor: '1'
            mensaje: |
              El $1$ no sale de ningún sitio aquí: $F''\left(0\right)=\frac12$ y
              hay que partirlo por $2$.
        pista: |
          El coeficiente de $x^{2}$ es $\frac{F''\left(0\right)}{2!}$.
        desarrollo: |
          $$
          \frac{F''\left(0\right)}{2!}=\frac{\frac12}{2}=\frac14
          $$

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: >-
              $F\left(0\right)=3$, porque la integral entre $0$ y $0$ vale cero.
          - texto: >-
              Por el teorema fundamental,
              $F'\left(x\right)=\frac{1+\operatorname{sen}x}{2+x^{2}}$, y
              $F'\left(0\right)=\frac12$.
          - texto: >-
              $F''\left(0\right)=\frac12$, así que el coeficiente de $x^{2}$ es
              $\frac{1/2}{2!}=\frac14$.
          - texto: >-
              El integrando no tiene primitiva elemental, así que el polinomio de
              McLaurin de $F$ no se puede calcular.
            trampa: true
            mensaje: |
              El polinomio de Taylor solo necesita el **valor de las derivadas en
              un punto**, y esas se obtienen sin integrar nada. Que no exista
              primitiva elemental no impide aproximar $F$; de hecho es la razón
              por la que se aproxima.
    resolucion: |
      **Qué pide un McLaurin de orden 2.** Tres números: $F\left(0\right)$,
      $F'\left(0\right)$ y $F''\left(0\right)$.

      $$
      P_{2}\left(x\right)=F\left(0\right)+F'\left(0\right)x
      +\frac{F''\left(0\right)}{2!}x^{2}
      $$

      **El valor.** La integral entre $0$ y $0$ es cero, así que
      $F\left(0\right)=3$. Aquí no hay nada que calcular, y por eso el $3$ del
      enunciado no sobra: es el término independiente.

      **La primera derivada.** Teorema fundamental del cálculo: si
      $F\left(x\right)=C+\int_{a}^{x}g\left(t\right)dt$ con $g$ continua,
      entonces $F'\left(x\right)=g\left(x\right)$.

      $$
      F'\left(x\right)=\frac{1+\operatorname{sen}x}{2+x^{2}}
      \;\Longrightarrow\;
      F'\left(0\right)=\frac{1+0}{2+0}=\frac12
      $$

      **La segunda.** Es la derivada del integrando, con la regla del cociente:

      $$
      F''\left(x\right)
      =\frac{\cos x\left(2+x^{2}\right)-\left(1+\operatorname{sen}x\right)2x}
      {\left(2+x^{2}\right)^{2}}
      \;\Longrightarrow\;
      F''\left(0\right)=\frac{2-0}{4}=\frac12
      $$

      Un detalle que conviene no celebrar demasiado: en $x=0$ el segundo sumando
      del numerador se anula, así que quien se olvide de derivar el denominador
      **obtiene el mismo número**. Aquí el error no se ve; en cualquier otro
      punto, sí.

      $$
      \boxed{\;P_{2}\left(x\right)=3+\frac{x}{2}+\frac{x^{2}}{4}\;}
      $$

