      <figcaption>
      La solución y = 1 + e⁻ᵗ sen 2t. Oscila con periodo π —eso lo fija la parte
      imaginaria 2 de las raíces— dentro de la envolvente 1 ± e⁻ᵗ, que se cierra al
      ritmo que marca la parte real −1. A los cuatro segundos ya está en el uno.
      </figcaption>
      </figure>

      **Las tres comprobaciones.** Se hacen en veinte segundos y valen puntos:

      | qué | cuenta |
      |---|---|
      | $y\left(0\right)$ | $1+0=1$ ✓ |
      | $y'\left(0\right)$ | $y'=-e^{-t}\operatorname{sen}2t+2e^{-t}\cos2t$, y en $0$ da $2$ ✓ |
      | el régimen permanente | $y\to1$, que es justo $\frac{5}{5}$, la solución constante de $y''+2y'+5y=5$ ✓ |

      **Qué está diciendo la solución.** El $1$ es el equilibrio al que la
      ecuación tira; el $e^{-t}\operatorname{sen}2t$ es una oscilación
      amortiguada que se lo come todo en unos pocos segundos. La parte real $-1$
      del par de raíces $-1\pm2i$ fija lo rápido que se apaga, y la imaginaria
      $2$ fija a qué ritmo oscila mientras tanto.
