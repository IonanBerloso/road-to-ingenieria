      <figcaption>
      El recinto D arranca en el punto (1,1), donde la recta y la hipérbola se cortan,
      y se abre hasta x = 4. La vertical a trazos marca los dos radios de la arandela
      que genera al girar sobre OX: el exterior es x y el interior 1/x.
      </figcaption>
      </figure>

      Y una cosa que hay que decir en voz alta porque decide el apartado b): el
      recinto **no toca el eje OX**. Su borde de abajo es la hipérbola, que en
      $\left[1,4\right]$ va de $1$ a $\frac14$, siempre por encima de cero.

      **b) El sólido.** Al girar sobre OX, cada vertical del recinto describe una
      circunferencia. Como la vertical no empieza en el eje, lo que se genera en
      cada $x$ es una **corona**:

      | | radio |
      |---|---|
      | exterior, lo que genera la recta | $x$ |
      | interior, lo que genera la hipérbola | $\frac1x$ |

      $$
      A\left(x\right)=\pi x^{2}-\pi\frac{1}{x^{2}}
      $$

      $$
      V=\int_{1}^{4}A\left(x\right)dx
      =\pi\int_{1}^{4}\left(x^{2}-\frac{1}{x^{2}}\right)dx
      $$

      **La primitiva, con cuidado del signo.** $\int-x^{-2}dx=x^{-1}$, así que el
      término del agujero entra **sumando**:

      $$
      V=\pi\left[\frac{x^{3}}{3}+\frac1x\right]_{1}^{4}
      =\pi\left[\left(\frac{64}{3}+\frac14\right)-\left(\frac13+1\right)\right]
      $$

      $$
      =\pi\left[\frac{63}{3}-\frac34\right]=\pi\left(21-\frac34\right)
      $$

      $$
      \boxed{\;V=\frac{81\pi}{4}\approx63{,}62\;}
      $$

      **La comprobación de tamaño.** El cono exterior solo, sin agujero, daría
      $\pi\int_{1}^{4}x^{2}dx=21\pi\approx65{,}97$. El agujero se lleva
      $\frac34\pi\approx2{,}36$, poco más del tres por ciento: tiene sentido,
      porque el agujero es finísimo salvo cerca de $x=1$.

  - id: ex2021-ext-5-el-cilindro-dentro-de-la-esfera
    titulo: El cilindro dentro de la esfera, y dónde está su centro
    fuente: >-
      Ejercicio 1 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 1 de
      julio de 2021 · Cálculo, UPV/EHU · El examen no publica solución: la
      resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea $S$ el sólido limitado por las condiciones $y\ge0$, $x^{2}+z^{2}\le9$,
      $x^{2}+y^{2}+z^{2}\le25$.

      a) Dibujar el sólido $S$.

      b) Sabiendo que la densidad en cada punto es constante, calcular el centro
      de gravedad de $S$.
    pide: El sólido dibujado y su centro de gravedad.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué sistema de coordenadas conviene aquí?
        opciones:
          - texto: >-
              Cilíndricas alrededor del eje OY: $x=r\cos\theta$,
              $z=r\operatorname{sen}\theta$, y la $y$ se queda como está
            correcta: true
            mensaje: |
              Eso es. El cilindro $x^{2}+z^{2}\le9$ tiene su eje en OY, así que
              con esas coordenadas se convierte en $r\le3$ y la esfera en
              $r^{2}+y^{2}\le25$. Los dos límites quedan limpios.
          - texto: Esféricas, porque una de las condiciones es una esfera
            mensaje: |
              La esfera queda bien, pero el cilindro se convierte en
              $\rho\operatorname{sen}\varphi\le3$, que **no** es una superficie
              coordenada: habría que partir la integral en dos según el cono que
              pasa por el borde.
          - texto: >-
              Cilíndricas alrededor de OZ, que es lo habitual
            mensaje: |
              Con el eje en OZ, $x^{2}+z^{2}$ no es $r^{2}$ sino
              $r^{2}\cos^{2}\theta+z^{2}$, y la condición del cilindro deja de
              ser sencilla. Aquí el eje de simetría lo marca el sólido, no la
              costumbre.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuál es el volumen de $S$?
        respuesta:
          tipo: numero
          valor: '127.7581'
          tolerancia: 0.01
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '255.5162'
            mensaje: |
              Eso es el sólido entero, sin la condición $y\ge0$. El enunciado se
              queda con la mitad.
          - valor: '113.0973'
            mensaje: |
              $36\pi$ es el cilindro con la tapa **plana** a la altura
              $\sqrt{25-9}=4$. La tapa no es plana: es el casquete de la esfera,
              y en el eje llega hasta $y=5$.
          - valor: '261.7994'
            mensaje: |
              $\frac{2}{3}\pi\cdot125$ es la media esfera entera, sin recortar
              con el cilindro. Aquí el cilindro sí recorta: su radio es $3$ y el
              de la esfera $5$.
        pista: |
          $V=\int_{0}^{2\pi}\!\!\int_{0}^{3}\sqrt{25-r^{2}}\;r\,dr\,d\theta$.
        desarrollo: |
          $$
          V=2\pi\int_{0}^{3}r\sqrt{25-r^{2}}\;dr
          =2\pi\left[-\frac13\left(25-r^{2}\right)^{3/2}\right]_{0}^{3}
          $$

          $$
          =\frac{2\pi}{3}\left(125-64\right)=\frac{122\pi}{3}\approx127{,}76
          $$

      - tipo: calcular
        titulo: La altura del centro de gravedad
        pregunta: |
          ¿Cuánto vale $\overline{y}$?
        respuesta:
          tipo: numero
          valor: '2.2684'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '1.875'
            mensaje: |
              $\frac{3R}{8}=\frac{15}{8}$ es el centroide de una **media esfera**
              maciza. Aquí el cilindro recorta lo ancho de abajo, que es
              justamente lo que tiraba del centro hacia el suelo: por eso el de
              $S$ queda más alto.
          - valor: '2.5'
            mensaje: |
              La mitad de $5$ sería la respuesta si el sólido fuese simétrico
              respecto de $y=2{,}5$, y no lo es: arriba se estrecha.
          - valor: '4.5369'
            mensaje: |
              Ese es el doble. Al integrar $\int_{0}^{h}y\,dy$ sale
              $\frac{h^{2}}{2}$, y se te ha quedado $h^{2}$.
        pista: |
          $\overline{y}=\frac1V\int y\,dV$, y $\int_{0}^{\sqrt{25-r^{2}}}y\,dy
          =\frac{25-r^{2}}{2}$.
        desarrollo: |
          $$
          \int_{S}y\,dV=\int_{0}^{2\pi}\!\!\int_{0}^{3}
          \frac{25-r^{2}}{2}\,r\,dr\,d\theta
          =\pi\int_{0}^{3}\left(25r-r^{3}\right)dr
          $$

          $$
          =\pi\left[\frac{25r^{2}}{2}-\frac{r^{4}}{4}\right]_{0}^{3}
          =\pi\left(\frac{225}{2}-\frac{81}{4}\right)=\frac{369\pi}{4}
          $$

          $$
          \overline{y}=\frac{369\pi/4}{122\pi/3}=\frac{369\cdot3}{4\cdot122}
          =\frac{1107}{488}\approx2{,}2684
          $$

      - tipo: justificar
        pregunta: Ordena el argumento del centro de gravedad. Una pieza es falsa.
        piezas:
          - texto: >-
              Por simetría en $x$ y en $z$, el centro de gravedad está sobre el
              eje OY: $\overline{x}=\overline{z}=0$.
          - texto: >-
              En cilíndricas alrededor de OY el sólido es $0\le r\le3$,
              $0\le\theta\le2\pi$, $0\le y\le\sqrt{25-r^{2}}$.
          - texto: >-
              $V=\frac{122\pi}{3}$ y $\int y\,dV=\frac{369\pi}{4}$, así que
              $\overline{y}=\frac{1107}{488}$.
          - texto: >-
              Como la densidad es constante, el centro de gravedad está a media
              altura del sólido, en $y=2$.
            trampa: true
            mensaje: |
              Densidad constante significa que el centro de gravedad coincide con
              el **centroide geométrico**, no que esté a media altura. A media
              altura estaría si el sólido fuese un cilindro; aquí la tapa es
              esférica y el sólido se estrecha hacia arriba, así que hay más
              material abajo. Y «media altura» ni siquiera está definida: la
              altura vale $4$ en el borde y $5$ en el eje.
    resolucion: |
      **a) Qué sólido es.** Tres condiciones, y conviene leerlas por separado:

      | condición | qué es |
      |---|---|
      | $x^{2}+z^{2}\le9$ | dentro de un **cilindro** de radio $3$ y eje OY |
      | $x^{2}+y^{2}+z^{2}\le25$ | dentro de una **esfera** de radio $5$ |
      | $y\ge0$ | solo la mitad, la de $y$ positiva |

      El cilindro es más estrecho que la esfera ($3<5$), así que lo que queda es
      un cilindro con **la tapa abombada**: la pared lateral es el cilindro y el
      techo es un casquete esférico. En el borde, $r=3$, el techo está a
      $y=\sqrt{25-9}=4$; en el eje, $r=0$, llega hasta $y=5$.

