      </svg>
      <figcaption>
      La sección del sólido por un plano que contiene al eje OY. La pared es el
      cilindro de radio 3 y el techo es el casquete de la esfera de radio 5: en el
      borde llega a y = 4 y en el eje a y = 5. Girando esta figura alrededor del eje
      vertical se obtiene S.
      </figcaption>
      </figure>

      **b) Las coordenadas.** El eje de simetría es OY, así que se usan
      cilíndricas **alrededor de OY**:

      $$
      x=r\cos\theta,\qquad z=r\operatorname{sen}\theta,\qquad y=y,
      \qquad dV=r\,dr\,d\theta\,dy
      $$

      Con eso las tres condiciones se vuelven $0\le r\le3$,
      $0\le\theta\le2\pi$, $0\le y\le\sqrt{25-r^{2}}$.

      **Por simetría, dos de las tres coordenadas son gratis.** El sólido es
      invariante al cambiar $x$ por $-x$ y $z$ por $-z$, así que
      $\overline{x}=\overline{z}=0$. Merece la pena decirlo con esas palabras en el examen:
      es COMP 4 y ahorra dos integrales.

      **El volumen.**

      $$
      V=\int_{0}^{2\pi}\!\!\int_{0}^{3}\!\!\int_{0}^{\sqrt{25-r^{2}}}
      r\,dy\,dr\,d\theta
      =2\pi\int_{0}^{3}r\sqrt{25-r^{2}}\;dr
      $$

      Con el cambio $u=25-r^{2}$, $du=-2r\,dr$:

      $$
      V=2\pi\left[-\frac13\left(25-r^{2}\right)^{3/2}\right]_{0}^{3}
      =\frac{2\pi}{3}\left(125-64\right)=\frac{122\pi}{3}
      $$

      **El momento respecto del plano $y=0$.** La integral en $y$ se hace primero
      y deja un cuadrado:

      $$
      \int_{0}^{\sqrt{25-r^{2}}}y\,dy=\frac{25-r^{2}}{2}
      $$

      $$
      \int_{S}y\,dV=2\pi\int_{0}^{3}\frac{25-r^{2}}{2}\,r\,dr
      =\pi\left[\frac{25r^{2}}{2}-\frac{r^{4}}{4}\right]_{0}^{3}
      =\frac{369\pi}{4}
      $$

      **El cociente.**

      $$
      \overline{y}=\frac{\int y\,dV}{V}
      =\frac{369\pi/4}{122\pi/3}=\frac{1107}{488}
      $$

      $$
      \boxed{\;G=\left(0,\;\frac{1107}{488},\;0\right)\approx
      \left(0;\,2{,}27;\,0\right)\;}
      $$

      **¿Es razonable?** El sólido va de $y=0$ a $y=5$ y su altura típica ronda
      el $4$, así que un centro de gravedad en $2{,}27$ —un poco por encima de la
      mitad de $4{,}5$ no, un poco por debajo— encaja: el casquete de arriba tiene
      poco volumen y no tira mucho. Para comparar, media esfera maciza de radio
      $5$ tendría el suyo en $\frac{3\cdot5}{8}=1{,}875$; recortar los bordes
      bajos con el cilindro lo sube, y eso es lo que pasa.

  - id: ex2021-ext-6-green-entre-dos-parabolas
    titulo: Green entre dos parábolas, y la misma cuenta por el camino largo
    fuente: >-
      Ejercicio 2 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 1 de
      julio de 2021 · Cálculo, UPV/EHU · El examen no publica solución: la
      resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Sea la integral
      $\displaystyle\oint_{L}\left(2xy-x^{2}\right)dx+\left(x+y^{2}\right)dy$,
      donde $L$ es la curva limitada por las condiciones $y=x^{2}$ y $x=y^{2}$.
      Calcular la integral de dos formas: parametrizando $L$ y empleando el
      teorema de Green.
    pide: El mismo número por los dos caminos.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué integrando deja el teorema de Green en la integral doble?
        opciones:
          - texto: $\frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}=1-2x$
            correcta: true
            mensaje: |
              Eso es. $Q=x+y^{2}$ da $Q_{x}=1$, y $P=2xy-x^{2}$ da $P_{y}=2x$.
              La resta es $1-2x$.
          - texto: >-
              $0$, porque el campo es conservativo y la integral en una curva
              cerrada vale cero
            mensaje: |
              Para que fuese conservativo haría falta $Q_{x}=P_{y}$, y aquí $1$ no
              es $2x$. Con este campo la circulación no tiene por qué anularse, y
              de hecho no se anula.
          - texto: >-
              $\frac{\partial P}{\partial x}-\frac{\partial Q}{\partial y}=2y-2x-2y$
            mensaje: |
              Las derivadas están cruzadas al revés. En Green se deriva $Q$
              respecto de $x$ y $P$ respecto de $y$, no cada una respecto de su
              propia variable.

      - tipo: calcular
        titulo: El tramo de la parábola y = x²
        pregunta: |
          Recorriendo $y=x^{2}$ desde $\left(0,0\right)$ hasta
          $\left(1,1\right)$, ¿cuánto vale la integral en ese tramo?
        respuesta:
          tipo: numero
          valor: '1.1667'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              Ese es solo el sumando de $Q\,dy$. Falta el de $P\,dx$, que aporta
              $\frac16$.
          - valor: '0.1667'
            mensaje: |
              Ese es solo el sumando de $P\,dx$. Falta el de $Q\,dy$, que aporta
              $1$.
          - valor: '0.8667'
            mensaje: |
              Te has dejado el $2t$ de $dy$. Con $y=t^{2}$, $dy=2t\,dt$, no $dt$.
        pista: |
          Con $x=t$, $y=t^{2}$: $P\,dx=\left(2t^{3}-t^{2}\right)dt$ y
          $Q\,dy=\left(t+t^{4}\right)2t\,dt$.
        desarrollo: |
          $$
          \int_{0}^{1}\left(2t^{3}-t^{2}\right)dt=\frac12-\frac13=\frac16
          $$

          $$
          \int_{0}^{1}\left(2t^{2}+2t^{5}\right)dt=\frac23+\frac13=1
          $$

          $$
          \frac16+1=\frac76\approx1{,}1667
          $$

      - tipo: calcular
        titulo: La integral completa
        pregunta: |
          ¿Cuánto vale la circulación sobre la curva cerrada, recorrida en
          sentido positivo?
        respuesta:
          tipo: numero
          valor: '0.0333'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0'
            mensaje: |
              Cero saldría si el campo fuese conservativo, y no lo es:
              $Q_{x}-P_{y}=1-2x$ no es idénticamente nulo.
          - valor: '0.3333'
            mensaje: |
              $\frac13$ es el **área** del recinto,
              $\int_{0}^{1}\left(\sqrt x-x^{2}\right)dx$. Falta multiplicar por
              el factor $1-2x$ dentro de la integral.
          - valor: '0.6333'
            mensaje: |
              Signo dentro del paréntesis. Con $1+2x$ saldría $\frac{19}{30}$;
              con $1-2x$, que es lo que dice Green, sale $\frac1{30}$.
          - valor: '-0.0333'
            mensaje: |
              Ese es el valor recorriendo la curva en sentido horario. Green pide
              orientación positiva: el recinto a la izquierda.
        pista: |
          $\int_{0}^{1}\left(1-2x\right)\left(\sqrt x-x^{2}\right)dx$.
        desarrollo: |
          $$
          \iint_{D}\left(1-2x\right)dA
          =\int_{0}^{1}\left(1-2x\right)\left(\sqrt x-x^{2}\right)dx
          $$

          $$
          =\int_{0}^{1}\left(x^{1/2}-x^{2}-2x^{3/2}+2x^{3}\right)dx
          =\frac23-\frac13-\frac45+\frac12=\frac1{30}
          $$

      - tipo: justificar
        pregunta: Ordena el argumento por Green. Una pieza es falsa.
        piezas:
          - texto: >-
              Las dos parábolas se cortan en $\left(0,0\right)$ y
              $\left(1,1\right)$, y entre ellas $\sqrt x\ge x^{2}$.
          - texto: >-
              Green convierte la circulación en
              $\iint_{D}\left(Q_{x}-P_{y}\right)dA=\iint_{D}\left(1-2x\right)dA$.
          - texto: >-
              $\int_{0}^{1}\left(1-2x\right)\left(\sqrt x-x^{2}\right)dx
              =\frac23-\frac13-\frac45+\frac12=\frac1{30}$.
          - texto: >-
              Como $L$ está formada por dos arcos distintos, Green hay que
              aplicarlo por separado a cada uno y luego sumar.
            trampa: true
            mensaje: |
              Green se aplica a una curva **cerrada**, y los dos arcos juntos
              forman una: uno sube por $y=x^{2}$ y el otro vuelve por $x=y^{2}$.
              Aplicado a un arco suelto el teorema ni siquiera tiene sentido,
              porque un arco abierto no encierra ningún recinto.
    resolucion: |
      **El recinto.** Las dos parábolas se cortan donde $x=\left(x^{2}\right)^{2}
      =x^{4}$, o sea en $x=0$ y $x=1$. Entre esos dos valores $\sqrt x\ge x^{2}$,
      así que el recinto es

      $$
      D=\left\{\left(x,y\right):0\le x\le1,\;x^{2}\le y\le\sqrt x\right\}
      $$

