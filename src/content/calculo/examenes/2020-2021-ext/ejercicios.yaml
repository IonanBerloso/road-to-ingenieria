      Taylor de orden dos es una parábola, y solo copia bien lo que pasa cerca
      del punto.

  - id: ex2021-ext-4-la-recta-la-hiperbola-y-la-arandela
    titulo: La recta, la hipérbola, y el agujero que deja al girar
    fuente: >-
      Ejercicio 4 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 1 de
      julio de 2021 · Cálculo, UPV/EHU · El examen no publica solución: la
      resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea $D$ el recinto definido por las condiciones $y\le x$,
      $y\ge\frac{1}{x}$, $1\le x\le4$.

      a) Dibujar $D$.

      b) Calcular el volumen del sólido de revolución generado al girar $D$
      sobre el eje OX.
    pide: El recinto dibujado y el volumen del sólido que genera.

    pasos:
      - tipo: reconocer
        pregunta: |
          Al girar $D$ sobre el eje OX, ¿qué forma tiene cada sección
          perpendicular al eje?
        opciones:
          - texto: >-
              Una corona circular de radio exterior $x$ y radio interior
              $\frac1x$
            correcta: true
            mensaje: |
              Eso es. El recinto no toca el eje, así que al girar deja un
              agujero: cada sección es una arandela, y su área es
              $\pi\left(x^{2}-\frac{1}{x^{2}}\right)$.
          - texto: Un disco de radio $x-\frac1x$, la altura del recinto
            mensaje: |
              Ese es el error clásico. La altura del recinto es la **anchura** de
              la corona, no su radio, y
              $\left(x-\frac1x\right)^{2}\neq x^{2}-\frac{1}{x^{2}}$.
          - texto: >-
              Un disco de radio $x$, porque la hipérbola queda por debajo
            mensaje: |
              La hipérbola queda por debajo de la recta, sí, pero **por encima
              del eje**: entre el eje y el recinto queda un hueco que al girar se
              convierte en un agujero.

      - tipo: calcular
        titulo: El área del recinto
        pregunta: |
          Antes de girarlo, ¿qué área tiene $D$?
        respuesta:
          tipo: numero
          valor: '6.1137'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '7.5'
            mensaje: |
              Te has dejado la hipérbola. $\int_{1}^{4}x\,dx=\frac{15}{2}$ es el
              área bajo la recta hasta el eje; hay que restarle
              $\int_{1}^{4}\frac{dx}{x}=\ln4$.
          - valor: '8.8863'
            mensaje: |
              Signo del logaritmo. La primitiva de $x-\frac1x$ es
              $\frac{x^{2}}{2}-\ln x$, con menos: el logaritmo se resta.
          - valor: '20.25'
            mensaje: |
              Eso es $\frac{81}{4}$, el volumen partido por $\pi$. El área es
              otra integral: sin cuadrados y sin $\pi$.
        pista: |
          $\int_{1}^{4}\left(x-\frac1x\right)dx$.
        desarrollo: |
          $$
          A=\int_{1}^{4}\left(x-\frac1x\right)dx
          =\left[\frac{x^{2}}{2}-\ln x\right]_{1}^{4}
          =\left(8-\ln4\right)-\left(\frac12-0\right)
          =\frac{15}{2}-\ln4
          $$

          Numéricamente $7{,}5-1{,}3863=6{,}1137$.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen del sólido de revolución?
        respuesta:
          tipo: numero
          valor: '63.6172'
          tolerancia: 0.01
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '49.4801'
            mensaje: |
              Eso es $\pi\int_{1}^{4}\left(x-\frac1x\right)^{2}dx$: has usado la
              altura del recinto como radio. La arandela resta **las áreas**, no
              los radios.
          - valor: '68.3288'
            mensaje: |
              Has sumado en vez de restar: $\pi\int\left(x^{2}
              +\frac{1}{x^{2}}\right)dx$. El agujero se quita.
          - valor: '6.1137'
            mensaje: |
              Ese es el área del recinto plano. Al girar hay que integrar áreas
              de sección, que llevan cuadrados y $\pi$.
        pista: |
          $V=\pi\int_{1}^{4}\left(x^{2}-\frac{1}{x^{2}}\right)dx$, y la primitiva
          de $-\frac{1}{x^{2}}$ es $+\frac1x$.
        desarrollo: |
          $$
          V=\pi\int_{1}^{4}\left(x^{2}-\frac{1}{x^{2}}\right)dx
          =\pi\left[\frac{x^{3}}{3}+\frac1x\right]_{1}^{4}
          $$

          $$
          =\pi\left[\left(\frac{64}{3}+\frac14\right)
          -\left(\frac13+1\right)\right]
          =\pi\left(21-\frac34\right)=\frac{81\pi}{4}
          $$

          $\frac{81\pi}{4}=20{,}25\pi\approx63{,}6172$.

      - tipo: justificar
        pregunta: Ordena el razonamiento del volumen. Una pieza es falsa.
        piezas:
          - texto: >-
              En $\left[1,4\right]$ se cumple $x\ge\frac1x$, así que la recta va
              por encima de la hipérbola y el recinto no está vacío.
          - texto: >-
              Al girar sobre OX, la sección en cada $x$ es una corona de radio
              exterior $x$ y radio interior $\frac1x$, de área
              $\pi\left(x^{2}-\frac{1}{x^{2}}\right)$.
          - texto: >-
              $V=\pi\int_{1}^{4}\left(x^{2}-\frac{1}{x^{2}}\right)dx
              =\pi\left[\frac{x^{3}}{3}+\frac1x\right]_{1}^{4}=\frac{81\pi}{4}$.
          - texto: >-
              El radio de la sección es la altura del recinto, $x-\frac1x$, así
              que $V=\pi\int_{1}^{4}\left(x-\frac1x\right)^{2}dx$.
            trampa: true
            mensaje: |
              Esa es la trampa que más cae en los sólidos con agujero. Al girar,
              **cada borde genera su propio círculo** y el volumen es la
              diferencia de las dos áreas:
              $\pi R^{2}-\pi r^{2}$, no $\pi\left(R-r\right)^{2}$. Con $R=4$ y
              $r=\frac14$ la diferencia es $16-\frac1{16}$, mientras que el
              cuadrado de la diferencia da $\left(3{,}75\right)^{2}$: no se
              parecen.
    resolucion: |
      **a) El recinto.** Tres condiciones. La recta $y=x$ por arriba, la
      hipérbola $y=\frac1x$ por abajo, y la franja vertical $1\le x\le4$. Las dos
      curvas se cortan donde $x=\frac1x$, o sea en $x=1$: el recinto arranca en un
      punto, en $\left(1,1\right)$, y se va abriendo. En $x=4$ mide $4-\frac14
      =\frac{15}{4}$ de alto.

