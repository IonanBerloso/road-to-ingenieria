      **De dónde sale ese número, sin resolver nada.** El embalse se estabiliza
      cuando la evaporación iguala a la entrada:

      $$
      0{,}05\,C=1000\;\Longrightarrow\;C=20\,000
      $$

      Es la comprobación que hay que hacer siempre en estos problemas: el
      equilibrio se lee directamente de la ecuación anulando la derivada, y tiene
      que coincidir con el límite de la solución. Si no coincide, hay un error de
      cuentas en medio.

      **Cuánto tarda.** El tiempo característico es
      $\frac{1}{0{,}05}=20$ meses: en ese plazo se recorre el $63\,\%$ del camino
      que quede, y en unos $60$ meses el embalse está al $95\,\%$ de su nivel
      final. La constante $0{,}05$ no solo fija el destino: fija el ritmo.

  - id: ex2021-ext-8-laplace-con-termino-constante
    titulo: Laplace con un cinco a la derecha
    fuente: >-
      Ejercicio 4 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 1 de
      julio de 2021 · Cálculo, UPV/EHU · El examen no publica solución: la
      resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Utilizando la transformada de Laplace resolver la EDO

      $$
      \begin{cases}
      y''+2y'+5y=5\\
      y\left(0\right)=1,\quad y'\left(0\right)=2
      \end{cases}
      $$
    pide: La solución del problema de valores iniciales.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la transformada de Laplace del miembro de la derecha?
        opciones:
          - texto: $\mathcal{L}\left\{5\right\}=\dfrac{5}{s}$
            correcta: true
            mensaje: |
              Eso es. $\mathcal{L}\left\{1\right\}=\frac1s$, y la transformada es
              lineal. Una constante **no** transforma a una constante.
          - texto: $\mathcal{L}\left\{5\right\}=5$
            mensaje: |
              Lo único que transforma a una constante es la delta de Dirac. Una
              función constante transforma a $\frac{c}{s}$, porque
              $\int_{0}^{\infty}e^{-st}dt=\frac1s$.
          - texto: $\mathcal{L}\left\{5\right\}=\dfrac{5}{s^{2}}$
            mensaje: |
              $\frac{1}{s^{2}}$ es la transformada de $t$, no de $1$. Cada
              potencia de $s$ en el denominador es una potencia más de $t$.

      - tipo: calcular
        titulo: El cuadrado completado
        pregunta: |
          Escribiendo $s^{2}+2s+5=\left(s+1\right)^{2}+a$, ¿cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '5'
            mensaje: |
              Al desarrollar $\left(s+1\right)^{2}$ aparece un $+1$ que ya está
              contado. Hay que restarlo: $a=5-1=4$.
          - valor: '6'
            mensaje: |
              Has sumado el $1$ en vez de restarlo. $\left(s+1\right)^{2}
              =s^{2}+2s+1$, así que para llegar a $+5$ falta $4$.
          - valor: '1'
            mensaje: |
              El $1$ es lo que va dentro del paréntesis, la mitad del coeficiente
              de $s$. Lo que sobra fuera es otra cosa.
        pista: |
          $\left(s+1\right)^{2}=s^{2}+2s+1$.
        desarrollo: |
          $$
          s^{2}+2s+5=\left(s^{2}+2s+1\right)+4=\left(s+1\right)^{2}+2^{2}
          $$

          El $2^{2}$ es lo que anuncia que la solución llevará
          $\operatorname{sen}2t$ y $\cos2t$.

      - tipo: calcular
        titulo: El coeficiente de la oscilación
        pregunta: |
          En la solución $y\left(t\right)=1+c\,e^{-t}\operatorname{sen}2t$,
          ¿cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Ese es el numerador de $\frac{2}{\left(s+1\right)^{2}+4}$ sin
              ajustar. La tabla dice
              $\mathcal{L}\left\{e^{at}\operatorname{sen}\omega t\right\}
              =\frac{\omega}{\left(s-a\right)^{2}+\omega^{2}}$, y aquí
              $\omega=2$, así que el $2$ de arriba ya es el $\omega$ de la
              fórmula.
          - valor: '0.5'
            mensaje: |
              Has dividido entre $\omega$ cuando había que **identificar**
              $\omega$. El numerador vale exactamente $2$ y $\omega$ vale $2$: el
              cociente es $1$.
          - valor: '4'
            mensaje: |
              El $4$ es $\omega^{2}$, que va en el denominador. En el numerador
              va $\omega=2$.
        pista: |
          $\mathcal{L}^{-1}\left\{\frac{2}{\left(s+1\right)^{2}+4}\right\}
          =e^{-t}\operatorname{sen}2t$.
        desarrollo: |
          $$
          \frac{2}{\left(s+1\right)^{2}+2^{2}}
          =\mathcal{L}\left\{e^{-t}\operatorname{sen}2t\right\}
          $$

          El numerador que la tabla pide es $\omega=2$, y el que hay es $2$: no
          hay que multiplicar ni dividir por nada, así que $c=1$.

      - tipo: justificar
        pregunta: Ordena la resolución por Laplace. Una pieza es falsa.
        piezas:
          - texto: >-
              Transformando la ecuación:
              $\left(s^{2}+2s+5\right)Y=\frac5s+s+4$, donde el $s+4$ trae las
              condiciones iniciales.
          - texto: >-
              $Y=\frac{s^{2}+4s+5}{s\left(s^{2}+2s+5\right)}
              =\frac1s+\frac{2}{\left(s+1\right)^{2}+4}$.
          - texto: >-
              Antitransformando cada sumando:
              $y\left(t\right)=1+e^{-t}\operatorname{sen}2t$.
          - texto: >-
              Como $y\left(0\right)=1$ y $y'\left(0\right)=2$, al transformar
              $y''$ sale $s^{2}Y-s-2$ y al transformar $2y'$ sale $2sY-1$.
            trampa: true
            mensaje: |
              El primer trozo está bien; el segundo, no. $\mathcal{L}\left\{y'
              \right\}=sY-y\left(0\right)=sY-1$, y **el $2$ multiplica a todo**:
              $2\left(sY-1\right)=2sY-2$. Es el despiste más habitual de este
              tipo de ejercicio, y cambia la solución entera.
    resolucion: |
      **Transformar los tres términos.** Las dos fórmulas de las derivadas:

      $$
      \mathcal{L}\left\{y'\right\}=sY-y\left(0\right),
      \qquad
      \mathcal{L}\left\{y''\right\}=s^{2}Y-s\,y\left(0\right)-y'\left(0\right)
      $$

      Con $y\left(0\right)=1$ y $y'\left(0\right)=2$:

      $$
      \left[s^{2}Y-s-2\right]+2\left[sY-1\right]+5Y=\frac5s
      $$

      $$
      \left(s^{2}+2s+5\right)Y=\frac5s+s+4
      $$

      **Despejar y juntar.**

      $$
      Y=\frac{5+s^{2}+4s}{s\left(s^{2}+2s+5\right)}
      $$

      **Fracciones simples.** El denominador tiene una raíz real, $s=0$, y un
      factor cuadrático irreducible:

      $$
      \frac{s^{2}+4s+5}{s\left(s^{2}+2s+5\right)}
      =\frac{A}{s}+\frac{Bs+C}{s^{2}+2s+5}
      $$

      $$
      s^{2}+4s+5=A\left(s^{2}+2s+5\right)+\left(Bs+C\right)s
      $$

      | se hace | sale |
      |---|---|
      | $s=0$ | $5=5A\;\Rightarrow\;A=1$ |
      | coeficiente de $s^{2}$ | $1=A+B\;\Rightarrow\;B=0$ |
      | coeficiente de $s$ | $4=2A+C\;\Rightarrow\;C=2$ |

      $$
      Y=\frac1s+\frac{2}{s^{2}+2s+5}
      $$

      **Completar el cuadrado**, que es lo que deja la forma de tabla:

      $$
      s^{2}+2s+5=\left(s+1\right)^{2}+2^{2}
      \;\Longrightarrow\;
      Y=\frac1s+\frac{2}{\left(s+1\right)^{2}+2^{2}}
      $$

      **Antitransformar.** El primer sumando da $1$; el segundo es exactamente
      $\mathcal{L}\left\{e^{-t}\operatorname{sen}2t\right\}$, sin ajustar nada:

      $$
      \boxed{\;y\left(t\right)=1+e^{-t}\operatorname{sen}2t\;}
      $$

