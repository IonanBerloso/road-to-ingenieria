      **La comprobación.** Los cuatro lados miden $\sqrt5$ y los cuatro ángulos
      son rectos: $\left(1,-2\right)\cdot\left(2,1\right)=0$,
      $\left(2,1\right)\cdot\left(-1,2\right)=0$, y así con todos. Las dos
      diagonales miden $\sqrt{10}$ y se cortan en $-\frac32+\frac52 i$.

  - id: ex2021-ext-2-derecha-izquierda-y-la-rapidez-maxima
    titulo: Hacia dónde va, y cuándo va más rápido hacia la izquierda
    fuente: >-
      Ejercicio 2 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 1 de
      julio de 2021 · Cálculo, UPV/EHU · El examen no publica solución: la
      resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 3
      comp2: 4
      comp4: 3
    enunciado: |
      Un objeto se mueve sobre uno de los ejes de coordenadas. Su posición $x$
      en función del tiempo $t$ viene dada por la función
      $x\left(t\right)=\left(4t-1\right)\left(t-1\right)^{2}$, $t\ge0$.

      a) ¿Cuándo se mueve el objeto hacia la derecha?, ¿cuándo hacia la
      izquierda?, ¿cuándo cambia de sentido?

      b) ¿Cuál es la velocidad máxima del objeto cuando se mueve hacia la
      izquierda?
    pide: Los intervalos de cada sentido, y la velocidad máxima hacia la izquierda.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que mirar para saber hacia dónde se mueve el objeto?
        opciones:
          - texto: >-
              El signo de $x'\left(t\right)$: positivo es hacia la derecha,
              negativo hacia la izquierda
            correcta: true
            mensaje: |
              Exacto. La derivada de la posición **es** la velocidad, y su signo
              es el sentido. Los cambios de sentido están donde la velocidad se
              anula cambiando de signo.
          - texto: >-
              El signo de $x\left(t\right)$: si la posición es positiva, va
              hacia la derecha
            mensaje: |
              Eso confunde **dónde está** con **hacia dónde va**. Un objeto
              puede estar en la parte positiva del eje y estar retrocediendo.
          - texto: El signo de $x''\left(t\right)$, que es la aceleración
            mensaje: |
              La aceleración dice si el objeto está ganando o perdiendo
              velocidad, no en qué sentido se mueve. Un coche que frena yendo
              hacia la derecha tiene aceleración negativa y sigue yendo hacia la
              derecha.

      - tipo: calcular
        titulo: El instante de la rapidez máxima hacia la izquierda
        pregunta: |
          Dentro del tramo en el que el objeto retrocede, ¿en qué instante $t$
          va más rápido?
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              En $t=\frac12$ la velocidad **se anula**: es donde empieza a
              retroceder, o sea donde va más despacio, no más rápido.
          - valor: '1'
            mensaje: |
              En $t=1$ la velocidad también vale cero: ahí termina el tramo
              hacia la izquierda. El máximo de rapidez está entre los dos
              extremos, no en ellos.
          - valor: '1.5'
            mensaje: |
              El vértice de $x'=12t^{2}-18t+6$ está en $-\frac{b}{2a}
              =\frac{18}{24}$, no en $\frac{b}{a}=\frac{18}{12}$. Se te ha
              perdido el $2$ del denominador.
        pista: |
          La rapidez es máxima donde la velocidad tiene su mínimo, y eso pasa
          donde $x''\left(t\right)=0$.
        desarrollo: |
          $$
          x'\left(t\right)=4\left(t-1\right)^{2}+\left(4t-1\right)2\left(t-1\right)
          =\left(t-1\right)\left(12t-6\right)=6\left(t-1\right)\left(2t-1\right)
          $$

          $$
          x''\left(t\right)=24t-18=0
          \;\Longrightarrow\;
          t=\frac34
          $$

          Y $\frac34$ está dentro de $\left(\frac12,1\right)$, que es el tramo en
          el que $x'<0$.

      - tipo: calcular
        titulo: La velocidad en ese instante
        pregunta: |
          ¿Cuánto vale $x'\left(t\right)$ en el instante anterior?
        respuesta:
          tipo: numero
          valor: '-0.75'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.75'
            mensaje: |
              Ese es el módulo, la **rapidez**. La velocidad lleva signo, y hacia
              la izquierda es negativa. El enunciado dice «velocidad máxima
              cuando se mueve hacia la izquierda», así que conviene dar las dos
              cosas y decir cuál es cuál.
          - valor: '-6'
            mensaje: |
              Eso es $x'\left(1{,}5\right)$, ya fuera del tramo. Y además es
              positivo en realidad: $x'\left(1{,}5\right)=6\cdot0{,}5\cdot2=6$.
          - valor: '0'
            mensaje: |
              Cero es la velocidad en los extremos del tramo, $t=\frac12$ y
              $t=1$. En medio la velocidad es estrictamente negativa.
        pista: |
          $x'\left(\frac34\right)=6\left(\frac34-1\right)\left(\frac32-1\right)$.
        desarrollo: |
          $$
          x'\!\left(\tfrac34\right)
          =6\left(-\tfrac14\right)\left(\tfrac12\right)=-\frac34
          $$

          La velocidad máxima hacia la izquierda es, por tanto, $-\frac34$
          unidades por unidad de tiempo: rapidez $\frac34$, sentido negativo.

      - tipo: justificar
        pregunta: Ordena el razonamiento del apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              $x'\left(t\right)=6\left(t-1\right)\left(2t-1\right)$, que se anula
              en $t=\frac12$ y en $t=1$.
          - texto: >-
              Entre $\frac12$ y $1$ los dos factores tienen signos distintos, así
              que $x'<0$: ahí el objeto va hacia la izquierda.
          - texto: >-
              La rapidez en ese tramo es $\left|x'\right|$, y su máximo está donde
              $x''=24t-18=0$, o sea en $t=\frac34$.
          - texto: >-
              Como $x'$ se anula en $t=\frac12$ y en $t=1$, la velocidad es
              máxima en uno de esos dos instantes.
            trampa: true
            mensaje: |
              Justo al revés: donde la derivada se anula el objeto está **parado**.
              Anular $x'$ da los extremos de la **posición**, no de la velocidad.
              Los extremos de la velocidad se buscan anulando $x''$.
    resolucion: |
      **La velocidad.** Se deriva con la regla del producto y se saca factor
      común, que es lo que permite leer el signo de un vistazo:

      $$
      x'\left(t\right)
      =4\left(t-1\right)^{2}+\left(4t-1\right)\cdot2\left(t-1\right)
      =\left(t-1\right)\left[4\left(t-1\right)+2\left(4t-1\right)\right]
      $$

      $$
      x'\left(t\right)=\left(t-1\right)\left(12t-6\right)
      =6\left(t-1\right)\left(2t-1\right)
      $$

      **a) El signo, tramo a tramo.** Los dos factores cambian de signo en
      $t=\frac12$ y en $t=1$:

      | tramo | $t-1$ | $2t-1$ | $x'$ | el objeto |
      |---|---|---|---|---|
      | $0\le t<\frac12$ | $-$ | $-$ | $+$ | va a la **derecha** |
      | $\frac12<t<1$ | $-$ | $+$ | $-$ | va a la **izquierda** |
      | $t>1$ | $+$ | $+$ | $+$ | va a la **derecha** |

      $$
      \boxed{\;\text{cambia de sentido en }t=\tfrac12\text{ y en }t=1\;}
      $$

      En $t=\frac12$ está en $x=\frac14$, que es un máximo local de la posición;
      en $t=1$ está en $x=0$, que es un mínimo local. Es coherente: sube, se da
      la vuelta, baja, se vuelve a dar la vuelta.

