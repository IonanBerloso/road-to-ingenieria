ejercicios:
  - id: ex2021-ext-1-el-cuadrado-que-contiene-el-afijo
    titulo: Dos cuadrados posibles, y el afijo que decide cuál
    fuente: >-
      Ejercicio 1 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 1 de
      julio de 2021 · Cálculo, UPV/EHU · El examen no publica solución: la
      resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Un recinto cuadrado contiene el afijo del número complejo $-2+2i$. Dos
      vértices contiguos del cuadrado son $z_{1}=-3+3i$ y $z_{2}=-2+i$.
      Calcular los otros dos vértices y representar gráficamente el recinto.
    pide: Los otros dos vértices, y el cuadrado dibujado.

    pasos:
      - tipo: reconocer
        pregunta: |
          Conocido el lado $z_{2}-z_{1}$, ¿cómo se obtiene el lado
          perpendicular a él y del mismo largo?
        opciones:
          - texto: >-
              Multiplicándolo por $i$, que gira noventa grados y deja el módulo
              igual
            correcta: true
            mensaje: |
              Eso es. $\left|i\right|=1$, así que multiplicar por $i$ no cambia
              el tamaño; y $\arg i=\frac{\pi}{2}$, así que gira un cuarto de
              vuelta. Por $-i$ gira al otro lado, y de ahí salen los **dos**
              cuadrados posibles.
          - texto: Cambiándole el signo, $-\left(z_{2}-z_{1}\right)$
            mensaje: |
              Eso gira media vuelta, no un cuarto: te devuelve el mismo lado del
              revés. Un cuadrado necesita el giro de noventa grados.
          - texto: Conjugándolo, $\overline{z_{2}-z_{1}}$
            mensaje: |
              Conjugar es reflejar respecto del eje real. Conserva el módulo,
              sí, pero el ángulo que gira depende de dónde estuviera el vector:
              solo da noventa grados por casualidad.

      - tipo: calcular
        titulo: El vértice contiguo a z₂
        pregunta: |
          ¿Cuál es el vértice del cuadrado que va pegado a $z_{2}$?
        respuesta:
          tipo: complejo
          valor: '0+2i'
          tolerancia: 0.01
          formato: forma binómica, por ejemplo 0+2i
        distractores:
          - valor: '-4'
            mensaje: |
              Ese es el vértice de la **otra** orientación, la que sale de
              multiplicar por $-i$. Es un cuadrado legítimo, pero el afijo
              $-2+2i$ le queda fuera, y el enunciado dice que está dentro.
          - valor: '-1-1i'
            mensaje: |
              Has sumado otra vez el lado, $z_{2}+\left(z_{2}-z_{1}\right)$. Eso
              sigue recto en la misma dirección: te da tres puntos alineados, no
              un cuadrado.
          - valor: '-1+4i'
            mensaje: |
              Ese es el cuarto vértice, el que va pegado a $z_{1}$. Pegado a
              $z_{2}$ va $z_{2}+i\left(z_{2}-z_{1}\right)$.
        pista: |
          $z_{2}-z_{1}=1-2i$, y $i\left(1-2i\right)=2+i$.
        desarrollo: |
          $$
          z_{2}-z_{1}=\left(-2+i\right)-\left(-3+3i\right)=1-2i
          $$

          $$
          i\left(1-2i\right)=i-2i^{2}=2+i
          $$

          $$
          z_{3}=z_{2}+\left(2+i\right)=\left(-2+i\right)+\left(2+i\right)=2i
          $$

      - tipo: calcular
        titulo: El centro del cuadrado
        pregunta: |
          ¿Dónde está el centro del cuadrado bueno?
        respuesta:
          tipo: complejo
          valor: '-1.5+2.5i'
          tolerancia: 0.01
          formato: forma binómica, por ejemplo -1.5+2.5i
        distractores:
          - valor: '-3.5+1.5i'
            mensaje: |
              Ese es el centro del cuadrado descartado, el de la orientación
              $-i$. Comprueba dónde cae $-2+2i$ respecto de cada uno.
          - valor: '-2.5+2i'
            mensaje: |
              Eso es el punto medio del lado $z_{1}z_{2}$, no el del cuadrado.
              El centro es el punto medio de una **diagonal**.
          - valor: '-1+2i'
            mensaje: |
              Cuidado con la media: $\frac{-3-2+0-1}{4}=-\frac32$ y
              $\frac{3+1+2+4}{4}=\frac{10}{4}$. Los cuatro vértices, no tres.
        pista: |
          El centro es el punto medio de la diagonal $z_{1}z_{3}$.
        desarrollo: |
          $$
          \frac{z_{1}+z_{3}}{2}=\frac{\left(-3+3i\right)+2i}{2}
          =\frac{-3+5i}{2}=-\frac32+\frac52 i
          $$

          Y por la otra diagonal sale lo mismo:
          $\frac{z_{2}+z_{4}}{2}=\frac{\left(-2+i\right)+\left(-1+4i\right)}{2}
          =\frac{-3+5i}{2}$. Que las dos diagonales se corten en su punto medio
          es, de hecho, la comprobación de que los cuatro puntos forman un
          paralelogramo.

      - tipo: justificar
        pregunta: Ordena el argumento que elige una de las dos orientaciones. Una pieza es falsa.
        piezas:
          - texto: >-
              El lado es $z_{2}-z_{1}=1-2i$, y girarlo noventa grados da
              $i\left(1-2i\right)=2+i$ o su opuesto $-2-i$.
          - texto: >-
              Las dos orientaciones dan cuadrados legítimos: uno con vértices
              $2i$ y $-1+4i$, el otro con $-4$ y $-5+2i$.
          - texto: >-
              El enunciado desempata: el afijo $-2+2i$ solo cae dentro del
              primero.
          - texto: >-
              Como $-2+2i$ está más cerca de $z_{1}$ que de $z_{2}$, el cuadrado
              tiene que crecer hacia el lado de $z_{1}$.
            trampa: true
            mensaje: |
              Estar más cerca de un vértice que de otro no dice nada sobre hacia
              qué lado crece el cuadrado: los dos candidatos comparten los dos
              vértices $z_{1}$ y $z_{2}$, así que esas dos distancias son
              **idénticas** en los dos. Lo que separa a un candidato del otro es
              en qué semiplano de la recta $z_{1}z_{2}$ queda el afijo.
    resolucion: |
      **El lado, como vector.** Dos vértices contiguos definen un lado, y en el
      plano complejo un lado es una resta:

      $$
      \vec{u}=z_{2}-z_{1}=\left(-2+i\right)-\left(-3+3i\right)=1-2i,
      \qquad
      \left|\vec{u}\right|=\sqrt{1+4}=\sqrt5
      $$

      **El giro.** Los otros dos vértices salen de avanzar desde $z_{1}$ y
      $z_{2}$ en dirección perpendicular y con la misma longitud. Perpendicular
      y del mismo módulo es exactamente lo que hace multiplicar por $i$:

      $$
      i\,\vec{u}=i\left(1-2i\right)=2+i,
      \qquad
      -i\,\vec{u}=-2-i
      $$

      **Los dos candidatos.** Cada signo da un cuadrado:

      | | $z_{3}=z_{2}+\vec{w}$ | $z_{4}=z_{1}+\vec{w}$ | centro |
      |---|---|---|---|
      | $\vec{w}=2+i$ | $2i$ | $-1+4i$ | $-\frac32+\frac52 i$ |
      | $\vec{w}=-2-i$ | $-4$ | $-5+2i$ | $-\frac72+\frac32 i$ |

      Los dos son cuadrados de verdad, y el enunciado no sobra: hace falta el
      dato del afijo para elegir.

      **Quién contiene a $-2+2i$.** Basta con mirar de qué lado de la recta
      $z_{1}z_{2}$ cae el punto. El vector que va de $z_{1}$ al afijo es
      $\left(-2+2i\right)-\left(-3+3i\right)=1-i$, y comparándolo con la
      dirección perpendicular $\vec{w}=2+i$:

      $$
      \left(1,-1\right)\cdot\left(2,1\right)=2-1=1>0
      $$

      Positivo: el afijo está en el mismo semiplano hacia el que crece el primer
      cuadrado. Con la otra orientación el producto saldría $-1$ y el punto
      quedaría fuera.

      $$
      \boxed{\;z_{3}=2i,\qquad z_{4}=-1+4i\;}
      $$

