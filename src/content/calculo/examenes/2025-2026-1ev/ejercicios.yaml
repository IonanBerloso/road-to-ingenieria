ejercicios:
  - id: ex2526-1-semiplano-con-mordisco
    titulo: Un semiplano con un mordisco circular
    fuente: >-
      Ejercicio 1 · Primera evaluación, 20 de octubre de 2025 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    enunciado: |
      Calcular y representar geométricamente los afijos de los números
      complejos $z$ que verifican las condiciones siguientes:

      $$
      \begin{cases}
      \left|z-2\right| \le 3\left|z+2\right| \\[4pt]
      z - \overline{z} \ge \dfrac{3}{2}\,i
      \end{cases}
      $$
    pide: Calcular la región y representarla.

    pasos:
      - tipo: reconocer
        pregunta: |
          La segunda condición compara dos números complejos con un «$\ge$».
          ¿Qué hay que decir antes de operar con ella?
        opciones:
          - texto: >-
              Que $z-\overline{z}$ y $\frac32 i$ son **imaginarios puros**, y que
              la desigualdad compara sus coeficientes
            correcta: true
            mensaje: |
              Exacto. En $\mathbb{C}$ no hay orden: escribir $u \ge v$ entre
              complejos cualesquiera no significa nada. Aquí sí se puede leer
              porque los dos miembros están sobre el eje imaginario, y entonces
              la desigualdad es entre los números reales que los multiplican.
              Decirlo vale puntos de COMP4.
          - texto: Que hay que tomar módulos en los dos miembros
            mensaje: |
              Con módulos se perdería el signo: $|z-\overline z| = 2|y|$ da la
              misma condición para $y$ y para $-y$, y la región saldría
              simétrica cuando no lo es. Los módulos sirven en la primera
              condición, no en esta.
          - texto: Que la condición no tiene sentido y el ejercicio está mal
            mensaje: |
              Tiene sentido, pero hay que justificar por qué. Los dos miembros
              son imaginarios puros, y sobre el eje imaginario sí hay un orden
              natural: el de sus coeficientes.
          - texto: Que hay que separar en parte real y parte imaginaria
            mensaje: |
              Eso es lo que se acaba haciendo, pero antes hay que explicar por
              qué la comparación es legítima. Si no, se está usando un orden en
              $\mathbb{C}$ que no existe.

      - tipo: verificar
        pregunta: |
          Escribe la región simplificada, en $x$ e $y$. Vale cualquier forma
          equivalente: se comparan los puntos, no el texto.
        condicion: '|z - 2| <= 3*|z + 2| & im(z) >= 3/4'
        ventana:
          x: [-6.5, 3.5]
          y: [-2.5, 4.5]
        formato: por ejemplo (x+1)^2 + y^2 >= 4 & y >= 1
        pista: |
          Eleva al cuadrado la primera —los dos miembros son no negativos, así
          que es equivalente— y completa el cuadrado en $x$. La segunda ya es
          una recta horizontal.
        desarrollo: |
          **Primera condición.** Los dos miembros son no negativos, así que
          elevar al cuadrado es una equivalencia:

          $$
          (x-2)^{2}+y^{2} \le 9\left[(x+2)^{2}+y^{2}\right]
          $$

          $$
          x^{2}-4x+4+y^{2} \le 9x^{2}+36x+36+9y^{2}
          $$

          $$
          0 \le 8x^{2}+40x+32+8y^{2}
          \;\Longleftrightarrow\;
          0 \le x^{2}+5x+4+y^{2}
          $$

          Completando el cuadrado, con $x^{2}+5x = \left(x+\frac52\right)^{2}-\frac{25}{4}$:

          $$
          \left(x+\frac{5}{2}\right)^{2}+y^{2} \ge \frac{25}{4}-4 = \frac{9}{4}
          $$

          Es el **exterior**, con borde, de la circunferencia de centro
          $\left(-\frac52,0\right)$ y radio $\frac32$.

          **Segunda condición.** Con $z = x+iy$ se tiene
          $z-\overline z = 2iy$, y la desigualdad es entre imaginarios puros:

          $$
          2y \ge \frac{3}{2} \;\Longleftrightarrow\; y \ge \frac{3}{4}
          $$
        veredicto: |
          Fíjate en el cambio de sentido de la primera: entraba como «$\le$» y
          sale como «$\ge$». No es una errata — al pasar todo a un lado, los
          términos cambian de bando.

      - tipo: justificar
        pregunta: |
          Ordena la descripción de la región. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              La primera condición es una **circunferencia de Apolonio**: el
              lugar de los puntos cuyo cociente de distancias a $2$ y a $-2$ es
              constante. Aquí se pide el exterior, con borde.
          - texto: |
              Centro $\left(-\frac52,0\right)$ y radio $\frac32$: la
              circunferencia corta el eje real en $-4$ y en $-1$.
          - texto: |
              La segunda condición es el semiplano cerrado $y \ge \frac34$.
          - texto: |
              La región es el semiplano **menos** el trozo de disco que asoma
              por encima de $y=\frac34$: un casquete que va de
              $x = -\frac52-\frac{3\sqrt3}{4}$ a $x = -\frac52+\frac{3\sqrt3}{4}$.
          - texto: |
              Como la circunferencia tiene radio $\frac32 < \frac34$, queda
              entera por debajo de la recta y no recorta nada.
            trampa: true
            mensaje: |
              $\frac32$ es **mayor** que $\frac34$, no menor. La circunferencia
              llega hasta $y = \frac32$, así que sí asoma por encima de la recta
              y sí recorta. Comprobar si dos figuras se cortan antes de dibujar
              la intersección es medio ejercicio.
        veredicto: |
          El mordisco existe justo porque el radio supera la altura de la recta.
          Con una recta a $y \ge 2$ la respuesta habría sido el semiplano entero.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** Se pide la región de los $z$ que cumplen a la vez
      $\left|z-2\right| \le 3\left|z+2\right|$ y
      $z-\overline z \ge \frac32 i$.

      **Reparto de puntos del examen:** COMP1 1 · COMP2 7 · COMP4 2.

      ### 1 · La herramienta, y por qué cada condición pide una distinta

      Las dos condiciones se leen de forma distinta y conviene separarlas desde
      el principio:

      - La primera compara **módulos**, que son números reales no negativos.
        Ahí sí hay orden, y se puede elevar al cuadrado sin más.
      - La segunda compara **dos complejos**, y en $\mathbb{C}$ no hay orden.
        Solo tiene sentido porque los dos miembros son imaginarios puros.

      Esa distinción es el punto de COMP1, y no decirla cuesta los dos puntos
      de COMP4 aunque el dibujo salga bien.

      ### 2 · Primera condición: una circunferencia de Apolonio

      $\left|z-2\right|$ es la distancia del afijo al punto $(2,0)$ y
      $\left|z+2\right|$ la distancia a $(-2,0)$. La condición pide que la
      primera no supere el triple de la segunda: un **cociente de distancias
      acotado**, que es la definición de la circunferencia de Apolonio.

      Los dos miembros son no negativos, así que elevar al cuadrado no añade ni
      quita soluciones:

      $$
      (x-2)^{2}+y^{2} \le 9\left[(x+2)^{2}+y^{2}\right]
      $$

      $$
      x^{2}-4x+4+y^{2} \le 9x^{2}+36x+36+9y^{2}
      $$

      $$
      0 \le 8x^{2}+40x+32+8y^{2}
      \;\Longleftrightarrow\;
      0 \le x^{2}+5x+4+y^{2}
      $$

      Completando el cuadrado en $x$:

      $$
      \left(x+\frac{5}{2}\right)^{2}+y^{2} \ge \frac{25}{4}-4 = \frac{9}{4}
      $$

      **Exterior, con borde, de la circunferencia de centro
      $\left(-\frac52,0\right)$ y radio $\frac32$.** Corta el eje real en $-4$
      y en $-1$.

      Merece la pena señalar el cambio de sentido: la condición entra con
      «$\le$» y sale con «$\ge$». Al pasar todo a un lado, los términos cambian
      de bando; no es un error de signo.

      ### 3 · Segunda condición: el orden que sí existe

      En $\mathbb{C}$ no hay ningún orden compatible con las operaciones, así
      que $u \ge v$ entre complejos cualesquiera no significa nada. Aquí la
      desigualdad **sí** se puede leer, y hay que explicar por qué.

      Con $z = x+iy$:

      $$
      z - \overline z = (x+iy)-(x-iy) = 2iy
      $$

      Los dos miembros, $2iy$ y $\frac32 i$, son **imaginarios puros**: los dos
      viven en la misma recta. Comparar dos puntos de una recta sí tiene
      sentido, y equivale a comparar sus coeficientes:

      $$
      2y \ge \frac{3}{2} \;\Longleftrightarrow\; y \ge \frac{3}{4}
      $$

      El **semiplano cerrado** por encima de la recta $y=\frac34$.

      ### 4 · La intersección

      ¿Se cortan las dos figuras? La circunferencia llega hasta $y=\frac32$, y
      $\frac32 > \frac34$: **sí asoma** por encima de la recta. Hay mordisco.

      Los cortes de la circunferencia con $y=\frac34$:

      $$
      \left(x+\frac52\right)^{2} = \frac94-\frac{9}{16} = \frac{27}{16}
      \;\Longrightarrow\;
      x = -\frac{5}{2} \pm \frac{3\sqrt3}{4}
      $$

      es decir $x \approx -3{,}80$ y $x \approx -1{,}20$.

      La región pedida es el **semiplano $y \ge \frac34$ al que se le quita el
      casquete de disco** comprendido entre esos dos cortes. Todo el borde
      entra, porque las dos desigualdades son no estrictas.

      ### 5 · Representación gráfica

      Una recta horizontal a la altura $0{,}75$, y por encima de ella todo el
      plano salvo una muesca circular a la izquierda, centrada en $x=-2{,}5$ y
      de $1{,}5$ de radio, de la que solo se ve la tapa.

      ### 6 · Comprobación

      Se prueban tres puntos, cada uno pensado para romper algo distinto:

      - **$z = i$**, o sea $(0,1)$. Está por encima de la recta ✔ y fuera de la
        circunferencia, porque $\left(0+\frac52\right)^{2}+1 = 7{,}25 \ge 2{,}25$ ✔.
        En el enunciado original: $|i-2| = \sqrt5 \approx 2{,}24$ y
        $3|i+2| = 3\sqrt5 \approx 6{,}71$, y en efecto $2{,}24 \le 6{,}71$ ✔.
      - **$z = -\frac52 + i$**, el centro del mordisco a esa altura. Cumple
        $y \ge \frac34$ ✔ pero $\left(0\right)^{2}+1 = 1 < 2{,}25$ ✗: cae dentro
        del disco y **queda fuera** de la región, como debe.
      - **$z = 0$**. Fuera de la circunferencia ✔ pero $y=0 < \frac34$ ✗.
        También fuera. Sirve para ver que la segunda condición no sobra.

      ### Resultado

      $$
      \boxed{\;\left(x+\tfrac{5}{2}\right)^{2}+y^{2} \ge \tfrac{9}{4}
      \quad\text{y}\quad y \ge \tfrac{3}{4}\;}
      $$

  - id: ex2526-2-raiz-cuarta-de-la-figura
    titulo: Una raíz cuarta que se lee en la figura
    fuente: >-
      Ejercicio 2 · Primera evaluación, 20 de octubre de 2025 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    # Ojo con los pies de figura: van dentro de un bloque HTML, y ahí el
    # procesador de Markdown no interpreta el LaTeX. Un «$60^{\circ}$» se
    # vería con los dólares y las llaves. En los pies, grados con el símbolo.
    enunciado: |
      Sean $z_1, z_2, z_3$ los números complejos que se muestran en la figura.
      Calcular y representar geométricamente los afijos de los números
      complejos $z$ que verifican la condición:

      $$
      z^{4} = 8\,\frac{z_1}{z_3^{\,3}}\left(\overline{z_2}\right)^{2}
      \left(-1+\sqrt{3}\,i\right)
      $$

      <figure class="figura-examen">
      <svg viewBox="-150 -150 300 300" role="img" width="300" height="300"
           aria-labelledby="fig2526-2-t fig2526-2-d">
        <title id="fig2526-2-t">Los tres complejos del enunciado</title>
        <desc id="fig2526-2-d">Tres vectores desde el origen, todos de la misma
        longitud: z1 a 60 grados, z2 a menos 60 grados y z3 a menos 120
        grados.</desc>
        <g fill="none" stroke="var(--rule)" stroke-width="1" stroke-dasharray="3 3">
          <circle cx="0" cy="0" r="25"></circle>
          <circle cx="0" cy="0" r="50"></circle>
          <circle cx="0" cy="0" r="75"></circle>
          <circle cx="0" cy="0" r="100"></circle>
          <circle cx="0" cy="0" r="125"></circle>
          <path d="M-125 0 L125 0 M0 -125 L0 125
                   M-108.3 -62.5 L108.3 62.5 M-108.3 62.5 L108.3 -62.5
                   M-62.5 -108.3 L62.5 108.3 M-62.5 108.3 L62.5 -108.3"></path>
        </g>
        <g stroke="var(--graphite)" stroke-width="1.2">
          <path d="M-140 0 L140 0 M0 -140 L0 140"></path>
        </g>
        <g stroke="var(--ink)" stroke-width="2.6" fill="var(--ink)">
          <path d="M0 0 L50 -86.6"></path>
          <path d="M50 -86.6 l-3.4 -9.6 l9.6 3.4 z"></path>
          <path d="M0 0 L50 86.6"></path>
          <path d="M50 86.6 l-3.4 9.6 l9.6 -3.4 z"></path>
          <path d="M0 0 L-50 86.6"></path>
          <path d="M-50 86.6 l3.4 9.6 l-9.6 -3.4 z"></path>
        </g>
        <g fill="var(--acento)" font-size="13" font-family="var(--mono)" font-weight="600">
          <text x="58" y="-92">z₁</text>
          <text x="58" y="102">z₂</text>
          <text x="-74" y="102">z₃</text>
        </g>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original. Los tres afijos están sobre la
      misma circunferencia — tienen el mismo módulo — y sus argumentos son
      60°, −60° y −120°.
      </figcaption>
      </figure>
    pide: Calcular las soluciones y representarlas.

    pasos:
      - tipo: reconocer
        pregunta: |
          La figura no lleva escala numerada. ¿Es un problema?
        opciones:
          - texto: >-
              No: los tres tienen el mismo módulo y en esta expresión **los
              módulos se cancelan**
            correcta: true
            mensaje: |
              Ese es el regalo del ejercicio. Con
              $|z_1|=|z_2|=|z_3|=r$, el módulo del segundo miembro es
              $8 \cdot \frac{r}{r^{3}} \cdot r^{2} \cdot 2 = 16$, sin rastro de
              $r$. Solo hacen falta los argumentos, y esos sí se leen en la
              figura.
          - texto: 'Sí: sin los módulos el problema no se puede resolver'
            mensaje: |
              Prueba a escribir el módulo del segundo miembro llamando $r$ al
              módulo común. Los exponentes son $+1$, $-3$ y $+2$, que suman
              cero: $r$ desaparece.
          - texto: No, porque se puede suponer que los tres valen 1
            mensaje: |
              Suponer un dato que no da el enunciado es inventárselo, y si el
              resultado dependiera de $r$ la respuesta sería falsa. Aquí no hace
              falta suponer nada: se demuestra que $r$ se cancela.
          - texto: Sí, pero se pueden medir con una regla sobre el papel
            mensaje: |
              Medir con regla en un examen no es un argumento, y además daría un
              número aproximado donde hace falta uno exacto. Lo que hay que ver
              es que el dato no se necesita.

      - tipo: calcular
        titulo: El módulo de las soluciones
        pregunta: |
          ¿Cuánto vale $|z|$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '16'
            mensaje: |
              16 es $\left|z^{4}\right|$, no $|z|$. Todavía falta sacar la raíz
              cuarta: $\sqrt[4]{16} = 2$.
          - valor: '4'
            mensaje: |
              Parece que has sacado la raíz cuadrada en vez de la cuarta. El
              exponente es 4, así que $|z| = 16^{1/4} = 2$.
          - valor: '8'
            mensaje: |
              El 8 es el factor que va delante en el enunciado, pero no es el
              módulo del segundo miembro: falta multiplicar por
              $\left|-1+\sqrt3 i\right| = 2$, y eso da 16.
        pista: |
          Llama $r$ al módulo común de los tres. Los exponentes de $r$ son
          $+1-3+2 = 0$, y $\left|-1+\sqrt3 i\right| = 2$.
        desarrollo: |
          Con $|z_1|=|z_2|=|z_3|=r$, y usando que conjugar no cambia el módulo:

          $$
          \left|z^{4}\right| = 8\cdot\frac{r}{r^{3}}\cdot r^{2}\cdot
          \left|-1+\sqrt3 i\right| = 8 \cdot 1 \cdot 2 = 16
          $$

          porque $\left|-1+\sqrt3 i\right| = \sqrt{1+3} = 2$. Por tanto

          $$
          |z| = \sqrt[4]{16} = 2
          $$
        veredicto: |
          El módulo común $r$ ha desaparecido sin dejar rastro. Por eso la
          figura no necesita escala.

      - tipo: calcular
        titulo: El menor argumento positivo
        pregunta: |
          De las cuatro soluciones, ¿cuál es el menor argumento en grados?
        respuesta:
          tipo: numero
          valor: '75'
          tolerancia: 0.5
          formato: un número de grados
        distractores:
          - valor: '300'
            mensaje: |
              $300^{\circ}$ es el argumento de $z^{4}$, no el de $z$. Falta
              dividir entre 4.
          - valor: '165'
            mensaje: |
              $165^{\circ}$ **es** una de las cuatro soluciones, la segunda:
              $75+90$. Pero se pedía la menor, y $75^{\circ}$ también vale.
          - valor: '15'
            mensaje: |
              Parece que has usado $60^{\circ}$ como argumento de $z^{4}$ y
              dividido entre 4. Hay que sumar antes todas las aportaciones: la
              de $z_1$, la de $z_3^{-3}$, la de $\overline{z_2}^{\,2}$ y la de
              $-1+\sqrt3 i$.
        pista: |
          Suma los argumentos con su signo y su exponente, reduce a
          $[0^{\circ},360^{\circ})$ y divide entre 4.
        desarrollo: |
          Argumentos que aporta cada factor:

          | factor | argumento |
          |---|---|
          | $8$ | $0^{\circ}$ |
          | $z_1$ | $+60^{\circ}$ |
          | $z_3^{\,-3}$ | $-3\cdot(-120^{\circ}) = +360^{\circ}$ |
          | $\left(\overline{z_2}\right)^{2}$ | $2\cdot(+60^{\circ}) = +120^{\circ}$ |
          | $-1+\sqrt3\,i$ | $+120^{\circ}$ |

          —recuerda que $\arg \overline{z_2} = -\arg z_2 = +60^{\circ}$—. En
          total:

          $$
          \arg\left(z^{4}\right) = 60+360+120+120 = 660^{\circ} \equiv 300^{\circ}
          $$

          $$
          4\theta = 300^{\circ}+360^{\circ}k
          \;\Longrightarrow\;
          \theta = 75^{\circ}+90^{\circ}k
          $$

          Con $k=0,1,2,3$: $75^{\circ}$, $165^{\circ}$, $255^{\circ}$ y
          $345^{\circ}$. El menor es $75^{\circ}$.
        veredicto: |
          Cuatro soluciones separadas exactamente $90^{\circ}$: los vértices de
          un cuadrado.

      - tipo: justificar
        pregunta: |
          Ordena el argumento. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Como los tres tienen el mismo módulo $r$, el del segundo miembro
              es $8\,r^{1-3+2}\cdot 2 = 16$, independiente de $r$. Luego
              $|z| = \sqrt[4]{16} = 2$.
          - texto: |
              Conjugar cambia el signo del argumento y no toca el módulo:
              $\arg\overline{z_2} = +60^{\circ}$.
          - texto: |
              Sumando argumentos con su exponente,
              $\arg\left(z^{4}\right) = 60+360+120+120 = 660^{\circ} \equiv 300^{\circ}$.
          - texto: |
              La ecuación $z^{4}=w$ tiene **exactamente cuatro** soluciones, con
              argumentos $\frac{300^{\circ}+360^{\circ}k}{4}$ para $k=0,1,2,3$.
          - texto: |
              Los cuatro afijos son los vértices de un cuadrado inscrito en la
              circunferencia de radio 2, el primero a $75^{\circ}$.
          - texto: |
              Al conjugar $z_2$ también hay que cambiar el signo de su módulo.
            trampa: true
            mensaje: |
              Un módulo **nunca** es negativo: es una distancia. Conjugar
              refleja el afijo respecto del eje real, así que cambia el signo
              del argumento y deja el módulo intacto. Si esto se hiciera mal,
              el módulo dejaría de cancelarse y el ejercicio se volvería
              irresoluble sin escala.
        veredicto: |
          El orden importa: primero se ve que el módulo se cancela —y con ello
          que la figura basta—, y solo después se suman argumentos.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión. En particular, los
      > argumentos $60^{\circ}$, $-60^{\circ}$ y $-120^{\circ}$ son nuestra
      > lectura de la figura del enunciado, que puedes contrastar con el PDF
      > original enlazado arriba.

      **Datos.** $z_1, z_2, z_3$ con el mismo módulo y argumentos
      $60^{\circ}$, $-60^{\circ}$ y $-120^{\circ}$. Se pide resolver

      $$
      z^{4} = 8\,\frac{z_1}{z_3^{\,3}}\left(\overline{z_2}\right)^{2}
      \left(-1+\sqrt{3}\,i\right)
      $$

      **Reparto de puntos del examen:** COMP1 1 · COMP2 7 · COMP4 2.

      ### 1 · Lo primero es darse cuenta de que la figura basta

      El enunciado da los tres complejos con un dibujo sin escala numerada, y
      eso asusta. Pero la expresión está construida para que **el módulo se
      cancele**.

      Llamando $r$ al módulo común, y usando que $\left|\overline w\right| =
      |w|$ y que $\left|w^{n}\right| = |w|^{n}$:

      $$
      \left|z^{4}\right| = 8\cdot\frac{|z_1|}{|z_3|^{3}}\cdot\left|z_2\right|^{2}
      \cdot\left|-1+\sqrt3 i\right|
      = 8\cdot\frac{r}{r^{3}}\cdot r^{2}\cdot 2
      = 8\,r^{\,1-3+2}\cdot 2 = 16
      $$

      Los exponentes de $r$ suman cero. **La escala de la figura es
      irrelevante**, y decirlo con esta cuenta delante es lo que distingue una
      respuesta completa de una que da por hecho que $r=1$.

      Por tanto

      $$
      |z| = \sqrt[4]{16} = 2
      $$

      ### 2 · Los argumentos, uno a uno

      La regla es la de siempre: en un producto los argumentos se suman, en un
      cociente se restan, y una potencia los multiplica. Con el conjugado hay
      que tener cuidado: **cambia el signo del argumento y no toca el módulo**.

      | factor | aportación al argumento |
      |---|---|
      | $8$ | $0^{\circ}$, por ser real positivo |
      | $z_1$ | $+60^{\circ}$ |
      | $z_3^{\,3}$ en el denominador | $-3\cdot(-120^{\circ}) = +360^{\circ}$ |
      | $\left(\overline{z_2}\right)^{2}$ | $2\cdot\left(-\arg z_2\right) = 2\cdot(+60^{\circ}) = +120^{\circ}$ |
      | $-1+\sqrt3\,i$ | $+120^{\circ}$ (segundo cuadrante) |

      El último merece una línea: $-1+\sqrt3 i$ tiene parte real negativa e
      imaginaria positiva, así que su argumento es $120^{\circ}$ y no el
      $-60^{\circ}$ que daría el arcotangente a secas.

      $$
      \arg\left(z^{4}\right) = 0+60+360+120+120 = 660^{\circ}
      $$

      Reduciendo a $[0^{\circ},360^{\circ})$:

      $$
      660^{\circ}-360^{\circ} = 300^{\circ}
      $$

      ### 3 · Las cuatro soluciones

      $$
      z^{4} = 16\,e^{i\,300^{\circ}}
      $$

      $$
      z_k = \sqrt[4]{16}\;e^{i\frac{300^{\circ}+360^{\circ}k}{4}}
          = 2\,e^{i\left(75^{\circ}+90^{\circ}k\right)},
      \qquad k = 0,1,2,3
      $$

      $$
      \theta_0 = 75^{\circ},\quad \theta_1 = 165^{\circ},\quad
      \theta_2 = 255^{\circ},\quad \theta_3 = 345^{\circ}
      $$

      Son exactamente cuatro, ni una más ni una menos: una ecuación de grado 4
      tiene cuatro soluciones en $\mathbb{C}$.

      ### 4 · Representación gráfica

      Los cuatro afijos están sobre la circunferencia de radio 2, separados
      $90^{\circ}$: los **vértices de un cuadrado** centrado en el origen, con
      el primero a $75^{\circ}$ —algo a la izquierda del semieje imaginario
      positivo—.

      ### 5 · Comprobación

      Elevando la primera a la cuarta: el módulo pasa a $2^{4} = 16$ ✔ y el
      argumento a $4\cdot 75^{\circ} = 300^{\circ}$ ✔, que es exactamente el
      segundo miembro.

      Y las otras tres tienen que dar lo mismo módulo $360^{\circ}$:
      $4\cdot165 = 660 = 300+360$ ✔,
      $4\cdot255 = 1020 = 300+2\cdot360$ ✔,
      $4\cdot345 = 1380 = 300+3\cdot360$ ✔.

      Conviene además comprobar el paso que más se falla, el del conjugado. Si
      alguien escribe $\arg\left(\overline{z_2}\right)^{2} = -120^{\circ}$ en
      vez de $+120^{\circ}$, el argumento total sale $420^{\circ} \equiv
      60^{\circ}$ y las soluciones caen en $15^{\circ}, 105^{\circ},
      195^{\circ}, 285^{\circ}$: otro cuadrado, igual de creíble, y mal.

      ### Resultado

      $$
      \boxed{\;z_k = 2\,e^{i\left(75^{\circ}+90^{\circ}k\right)},\quad k=0,1,2,3\;}
      $$

  - id: ex2526-3-cota-estricta-y-limite
    titulo: Una cota estricta que el límite no hereda
    fuente: >-
      Ejercicio 3 · Primera evaluación, 20 de octubre de 2025 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 0
      comp4: 9

    enunciado: |
      Sea $\{a_n\}_{n\in\mathbb{N}}$ una sucesión convergente cuyo límite es
      $L$. Supongamos que $\exists\, b \in \mathbb{R} \;/\; a_n > b \;\;
      \forall n \in \mathbb{N}$. Razonar formalmente si son ciertas las
      siguientes afirmaciones:

      1. Es posible que $L = b$.
      2. Necesariamente $L \ge b$.
    pide: Razonar formalmente las dos afirmaciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos afirmaciones piden cosas distintas. ¿Cuáles?
        opciones:
          - texto: >-
              La primera, **un ejemplo**; la segunda, **una demostración
              general**
            correcta: true
            mensaje: |
              Exacto, y es la mitad del ejercicio. «Es posible que» se responde
              exhibiendo un caso donde ocurre. «Necesariamente» hay que
              probarlo para todas las sucesiones, y un ejemplo no sirve de nada.
          - texto: Las dos piden una demostración general
            mensaje: |
              La primera no: para justificar que algo **es posible** basta un
              caso donde pase. Intentar demostrarlo en general es imposible,
              porque no siempre pasa.
          - texto: Las dos se responden con un ejemplo
            mensaje: |
              La segunda no. «Necesariamente» significa «en todos los casos», y
              eso ningún ejemplo lo demuestra. Un ejemplo solo serviría para
              **refutarla**, si existiera un contraejemplo.
          - texto: La primera es falsa y la segunda verdadera
            mensaje: |
              Adelantas la respuesta —y una de las dos partes no acierta—, pero
              la pregunta era qué **tipo** de razonamiento pide cada una. Esa
              elección es lo que se puntúa en COMP1.

      - tipo: calcular
        titulo: El épsilon de la reducción al absurdo
        pregunta: |
          Para la segunda afirmación se supone $L < b$. Con $b = 1$ y
          $L = 0{,}4$, ¿qué $\varepsilon$ conviene tomar?
        respuesta:
          tipo: numero
          valor: '0.3'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.6'
            mensaje: |
              Con $\varepsilon = b-L$ el intervalo llega justo hasta $b$ y la
              desigualdad $a_n < b$ deja de ser estricta. Con la mitad el choque
              es limpio.
          - valor: '0.4'
            mensaje: |
              $0{,}4$ es el valor de $L$, no la distancia a $b$. Lo que importa
              es cuánto se separan los dos: $b-L = 0{,}6$.
          - valor: '0.2'
            mensaje: |
              Serviría —cualquier $\varepsilon \le 0{,}6$ vale—, pero la
              elección canónica es la mitad de la distancia, $\frac{b-L}{2}$,
              que es la que se generaliza sin tener que justificar por qué esa.
        pista: |
          La distancia de $L$ a $b$ es $b-L = 0{,}6$. La mitad.
        desarrollo: |
          $$
          \varepsilon = \frac{b-L}{2} = \frac{1-0{,}4}{2} = 0{,}3
          $$

          Con ese $\varepsilon$, a partir de cierto $m$:

          $$
          a_n < L+\varepsilon = 0{,}4+0{,}3 = 0{,}7 < 1 = b
          $$

          y eso contradice $a_n > b$ para todo $n$.
        veredicto: |
          Es el mismo épsilon de los ejercicios 2.3, 2.4, 2.5 y 2.6 del
          boletín: la mitad de la distancia entre los dos valores en conflicto.

      - tipo: justificar
        pregunta: |
          Ordena la respuesta completa a las dos afirmaciones. Una de las
          piezas no debe entrar.
        piezas:
          - texto: |
              **(1) Es cierta.** Basta un ejemplo: $a_n = b+\frac1n$ cumple
              $a_n > b$ para todo $n$ y converge a $b$, luego $L=b$ es posible.
          - texto: |
              **(2) También es cierta**, y hay que demostrarlo en general. Por
              reducción al absurdo, supongamos $L<b$.
          - texto: |
              Se toma $\varepsilon = \dfrac{b-L}{2} > 0$, positivo precisamente
              porque se ha supuesto $L<b$.
          - texto: |
              Por definición de límite existe $m$ tal que
              $\left|a_n-L\right| < \varepsilon$ para todo $n>m$; en particular
              $a_n < L+\varepsilon = \dfrac{L+b}{2} < b$.
          - texto: |
              Eso contradice $a_n > b$ para **todo** $n$. Luego $L \ge b$.
          - texto: |
              Y como la hipótesis es estricta, $a_n > b$, se concluye además
              que $L > b$.
            trampa: true
            mensaje: |
              Justo lo contrario, y es la trampa del ejercicio: el apartado (1)
              acaba de exhibir $a_n = b+\frac1n$, con todos sus términos
              **estrictamente** mayores que $b$ y límite exactamente $b$. Al
              pasar al límite las desigualdades estrictas se debilitan, y por
              eso el enunciado dice $\ge$ y no $>$.
        veredicto: |
          Los dos apartados son la misma idea vista de los dos lados: el (1)
          enseña que $\ge$ no se puede reforzar, y el (2) que tampoco se puede
          debilitar.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** $\{a_n\}$ converge a $L$ y existe $b\in\mathbb{R}$ con
      $a_n > b$ para todo $n$. Se pregunta si es posible que $L=b$ y si
      necesariamente $L \ge b$.

      **Reparto de puntos del examen:** COMP1 1 · COMP4 9. Aquí **no hay nada
      que calcular**: nueve de los diez puntos son la demostración. Un
      desarrollo correcto sin justificar saca un punto.

      ### 1 · Qué pide cada apartado

      Las dos afirmaciones parecen parecidas y piden razonamientos de tipo
      distinto:

      - **«Es posible que $L=b$»** se responde con **un ejemplo**. Basta exhibir
        una sucesión que cumpla las hipótesis y donde ocurra.
      - **«Necesariamente $L \ge b$»** se responde con **una demostración
        general**. Ningún ejemplo la prueba; un contraejemplo la refutaría.

      Reconocer esa diferencia es el punto de COMP1.

      ### 2 · Apartado (1): sí es posible

      Sea $b\in\mathbb{R}$ cualquiera y

      $$
      a_n = b+\frac{1}{n}
      $$

      Cumple las hipótesis: converge, y $a_n > b$ para todo $n$ porque
      $\frac1n > 0$ siempre. Y su límite es

      $$
      \lim_{n\to\infty}\left(b+\frac1n\right) = b = L
      $$

      Luego **sí es posible que $L=b$**. $\blacksquare$

      Conviene subrayar lo que este ejemplo enseña: la desigualdad de la
      hipótesis es **estricta** y aun así el límite alcanza la cota. Los
      términos se acercan a $b$ tanto como se quiera sin llegar nunca, y el
      límite es precisamente ese punto que no se alcanza.

      ### 3 · Apartado (2): sí, necesariamente

      Por reducción al absurdo, supongamos que $L < b$. Entonces $b-L > 0$ y se
      puede tomar

      $$
      \varepsilon = \frac{b-L}{2} > 0
      $$

      Por la definición de límite existe $m\in\mathbb{N}$ tal que para todo
      $n>m$

      $$
      \left|a_n-L\right| < \varepsilon
      $$

      lo que en particular implica

      $$
      a_n < L+\varepsilon = L+\frac{b-L}{2} = \frac{L+b}{2} < b
      $$

      —la última desigualdad porque el punto medio de dos números distintos es
      menor que el mayor—. Es decir, **todos** los términos a partir de $m$
      serían menores que $b$, y la hipótesis dice que **todos** los términos son
      mayores que $b$. Contradicción.

      Por tanto la suposición era falsa y

      $$
      L \ge b \qquad \blacksquare
      $$

      ### 4 · Por qué no se puede afirmar $L>b$

      Es el error que el ejercicio está diseñado para provocar, y los dos
      apartados juntos lo cierran: el apartado (1) **ya ha exhibido** una
      sucesión con $a_n > b$ estricto y $L = b$. Luego $L>b$ es falso en
      general.

      La regla, que conviene llevar aprendida: **al pasar al límite, las
      desigualdades estrictas se debilitan.** De $a_n > b$ solo se deduce
      $L \ge b$.

      ### 5 · Comprobación

      Se contrastan las dos respuestas con casos que las tensionan:

      - $a_n = b+\frac1n$: cumple la hipótesis, $L = b$. Confirma (1) y enseña
        que (2) no se puede reforzar a $>$.
      - $a_n = b+1$, constante: cumple la hipótesis, $L = b+1 > b$. También
        compatible con (2).
      - ¿Y una con $L<b$? Habría que mantener todos los términos por encima de
        $b$ mientras se acercan a algo menor que $b$, y eso es justo lo que la
        demostración prohíbe. Con $b=1$ y $L=0{,}4$, desde
        $\frac1n < 0{,}3$ —o sea $n \ge 4$— todos los términos estarían por
        debajo de $0{,}7$, muy lejos de superar 1.

      ### Resultado

      $$
      \boxed{\;\text{(1) Cierta: } a_n = b+\tfrac1n. \qquad
      \text{(2) Cierta: } L \ge b,\ \text{pero nunca } L > b\;}
      $$

  - id: ex2526-4-serie-hipergeometrica
    titulo: Una hipergeométrica, y dos series con los mismos rectángulos
    fuente: >-
      Ejercicio 4 · Primera evaluación, 20 de octubre de 2025 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 6
      comp4: 2

    enunciado: |
      Una serie $\sum_{n\ge 1} a_n$ de términos positivos se llama
      **hipergeométrica** si existen números reales $\alpha,\beta,\gamma$ tales
      que $\alpha$ y $\gamma$ no son nulos a la vez, y que verifican la
      condición

      $$
      \frac{a_{n+1}}{a_n} = \frac{\alpha n+\beta}{\alpha n+\gamma}
      $$

      Si $\alpha+\beta<\gamma$, entonces la serie es convergente y su suma es
      igual al límite de la siguiente sucesión:

      $$
      \left\{\frac{a_n(\alpha n+\beta)-a_1\gamma}{\alpha+\beta-\gamma}\right\}_{n\in\mathbb{N}}
      $$

      **a)** Empleando el resultado anterior, calcular
      $\displaystyle\sum_{n=1}^{\infty}\frac{1}{(n+2)(n+3)}$.

      **b)** Para cada $n\in\mathbb{N}$, formamos un rectángulo con base igual
      a $1/n$ y altura igual a $1/(n+1)$. Colocamos todos esos rectángulos
      seguidos, como en la figura.

      <figure class="figura-examen">
      <svg viewBox="0 0 420 190" role="img" width="420" height="190"
           aria-labelledby="fig2526-4-t fig2526-4-d">
        <title id="fig2526-4-t">Los rectángulos puestos en fila</title>
        <desc id="fig2526-4-d">Rectángulos cada vez más pequeños, apoyados en
        una recta: el primero de base 1 y altura un medio, el segundo de base
        un medio y altura un tercio, el tercero de base un tercio y altura un
        cuarto, y así sucesivamente.</desc>
        <g fill="none" stroke="var(--ink)" stroke-width="1.6">
          <rect x="20" y="35" width="180" height="110"></rect>
          <rect x="200" y="72" width="90" height="73"></rect>
          <rect x="290" y="90" width="60" height="55"></rect>
          <rect x="350" y="101" width="45" height="44"></rect>
        </g>
        <g stroke="var(--graphite)" stroke-width="1.4">
          <path d="M10 145 L412 145"></path>
        </g>
        <g fill="var(--graphite)" font-size="12" font-family="var(--mono)">
          <text x="30" y="55">1/2</text>
          <text x="210" y="90">1/3</text>
          <text x="298" y="107">1/4</text>
          <text x="110" y="163" text-anchor="middle">1</text>
          <text x="245" y="163" text-anchor="middle">1/2</text>
          <text x="320" y="163" text-anchor="middle">1/3</text>
        </g>
        <g fill="var(--faint)" font-size="17" font-family="var(--mono)">
          <text x="400" y="130">…</text>
        </g>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original. Las bases van menguando como
      1, 1/2, 1/3… y las alturas como 1/2, 1/3, 1/4…
      </figcaption>
      </figure>

      **b.1)** Si vamos sumando las **longitudes** de las bases, ¿obtenemos una
      serie convergente? ¿Cuál será su suma?

      **b.2)** Si vamos sumando las **áreas** de estos rectángulos, ¿obtenemos
      una serie convergente? ¿Cuál será su suma?
    pide: Calcular la suma del apartado (a) y responder a b.1 y b.2.

    pasos:
      - tipo: reconocer
        pregunta: |
          En (b) los rectángulos son los mismos para las dos preguntas. ¿Qué
          está midiendo el ejercicio?
        opciones:
          - texto: >-
              Que **dos series construidas con los mismos objetos pueden
              comportarse al revés**
            correcta: true
            mensaje: |
              Ese es el corazón del apartado. Las bases son $\frac1n$ y suman
              infinito; las áreas son $\frac{1}{n(n+1)}$ y suman 1. Los mismos
              rectángulos, un resultado y el contrario.
          - texto: Que las dos series convergen, porque los rectángulos se hacen pequeños
            mensaje: |
              Que los términos tiendan a cero **no** basta: es condición
              necesaria, no suficiente. La serie armónica $\sum\frac1n$ es el
              contraejemplo de siempre, y es justo la de las bases.
          - texto: Que hay que calcular el área total con una integral
            mensaje: |
              No hace falta: el área de cada rectángulo es base por altura, y la
              suma resulta ser telescópica. La integral aparecerá en otro tema.
          - texto: Que la figura es imprescindible para resolverlo
            mensaje: |
              La figura ayuda a verlo, pero los datos están en el texto: base
              $\frac1n$ y altura $\frac{1}{n+1}$. Con eso se resuelve sin
              dibujar nada.

      - tipo: calcular
        titulo: El parámetro que decide la convergencia
        pregunta: |
          Para $a_n = \dfrac{1}{(n+2)(n+3)}$, ¿cuánto vale $\gamma$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              El 3 aparece en $a_n$, pero $\gamma$ sale del **cociente**
              $\frac{a_{n+1}}{a_n} = \frac{n+2}{n+4}$: es el término
              independiente del denominador, que es 4.
          - valor: '2'
            mensaje: |
              El 2 es $\beta$, el término independiente del numerador de
              $\frac{n+2}{n+4}$. $\gamma$ es el del denominador.
          - valor: '1'
            mensaje: |
              El 1 es $\alpha$, el coeficiente de $n$. Los tres parámetros son
              $\alpha=1$, $\beta=2$ y $\gamma=4$.
        pista: |
          Simplifica $\frac{a_{n+1}}{a_n}$ y compáralo con
          $\frac{\alpha n+\beta}{\alpha n+\gamma}$.
        desarrollo: |
          $$
          \frac{a_{n+1}}{a_n}
          = \frac{\dfrac{1}{(n+3)(n+4)}}{\dfrac{1}{(n+2)(n+3)}}
          = \frac{(n+2)(n+3)}{(n+3)(n+4)}
          = \frac{n+2}{n+4}
          $$

          Comparando con $\frac{\alpha n+\beta}{\alpha n+\gamma}$:

          $$
          \alpha = 1, \qquad \beta = 2, \qquad \gamma = 4
          $$

          Y se comprueba la hipótesis: $\alpha+\beta = 3 < 4 = \gamma$ ✔, así
          que la serie converge y se puede aplicar la fórmula.
        veredicto: |
          Comprobar $\alpha+\beta<\gamma$ no es un trámite: es la hipótesis que
          autoriza a usar la fórmula, y olvidarla cuesta puntos de COMP4.

      - tipo: calcular
        titulo: La suma del apartado (a)
        pregunta: |
          ¿Cuánto vale $\displaystyle\sum_{n=1}^{\infty}\frac{1}{(n+2)(n+3)}$?
        respuesta:
          tipo: numero
          valor: '0.3333333'
          tolerancia: 0.0005
          formato: un número, o una fracción como 1/3
        distractores:
          - valor: '0.0833333'
            mensaje: |
              $\frac{1}{12}$ es $a_1$, el primer término. La suma de todos es
              mayor que su primer término.
          - valor: '0.5'
            mensaje: |
              $\frac12$ sería la suma si la serie empezase en $n=-1$, es decir
              $\sum\frac{1}{n(n+1)}$ desde $n=1$ menos algún término. Aquí los
              factores son $n+2$ y $n+3$, y la telescópica arranca en
              $\frac13$.
          - valor: '0.25'
            mensaje: |
              $\frac14$ saldría de $\frac{1}{n+3}$ evaluado en $n=1$. El primer
              término que **sobrevive** al telescopio es $\frac{1}{n+2}$ en
              $n=1$, o sea $\frac13$.
        pista: |
          Con $\alpha=1$, $\beta=2$, $\gamma=4$ y $a_1=\frac{1}{12}$, aplica la
          fórmula. O descompón en fracciones simples y telescopia.
        desarrollo: |
          **Por la fórmula.** $a_1 = \frac{1}{3\cdot4} = \frac{1}{12}$, y

          $$
          a_n(\alpha n+\beta) = \frac{n+2}{(n+2)(n+3)} = \frac{1}{n+3}
          \;\longrightarrow\; 0
          $$

          $$
          S = \lim_{n\to\infty}\frac{a_n(\alpha n+\beta)-a_1\gamma}{\alpha+\beta-\gamma}
            = \frac{0-\frac{1}{12}\cdot 4}{1+2-4}
            = \frac{-\frac13}{-1} = \frac{1}{3}
          $$

          **Por telescopio**, que es la comprobación:

          $$
          \frac{1}{(n+2)(n+3)} = \frac{1}{n+2}-\frac{1}{n+3}
          $$

          $$
          S = \lim_{N\to\infty}\left(\frac{1}{3}-\frac{1}{N+3}\right) = \frac{1}{3}
          $$
        veredicto: |
          Las dos vías coinciden. La fórmula del enunciado no es magia: para
          esta serie es el telescopio escrito de otra manera.

      - tipo: calcular
        titulo: La suma de las áreas
        pregunta: |
          ¿Cuánto suman las áreas de todos los rectángulos?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              $\frac12$ es el área del **primer** rectángulo, $1\cdot\frac12$.
              Los demás suman otro tanto.
          - valor: '2'
            mensaje: |
              La suma es exactamente 1. Con telescopio,
              $\sum\left(\frac1n-\frac{1}{n+1}\right) = 1-\lim\frac{1}{n+1} = 1$.
          - valor: '0.6666667'
            mensaje: |
              $\frac23$ es la suma de los dos primeros rectángulos:
              $\frac12+\frac16$. Falta toda la cola, que aporta otro $\frac13$.
        pista: |
          Área $=\frac1n\cdot\frac{1}{n+1}$, y eso se descompone en
          $\frac1n-\frac{1}{n+1}$.
        desarrollo: |
          El área del rectángulo $n$-ésimo es

          $$
          A_n = \frac{1}{n}\cdot\frac{1}{n+1} = \frac{1}{n(n+1)}
          = \frac{1}{n}-\frac{1}{n+1}
          $$

          La suma parcial telescopia:

          $$
          \sum_{n=1}^{N} A_n = 1-\frac{1}{N+1} \;\longrightarrow\; 1
          $$

          Converge, y su suma es **1**.
        veredicto: |
          Todos los rectángulos caben en un cuadrado de área 1. Y en cambio sus
          bases, puestas en fila, no caben en ninguna recta de longitud finita.

      - tipo: justificar
        pregunta: |
          Ordena la respuesta del apartado (b). Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **b.1) No converge.** La suma de las bases es
              $\sum_{n\ge1}\frac1n$, la serie **armónica**, que diverge a
              $+\infty$. No tiene suma finita.
          - texto: |
              **b.2) Sí converge.** El área $n$-ésima es
              $\frac{1}{n(n+1)} = \frac1n-\frac{1}{n+1}$, y la suma parcial
              telescopia a $1-\frac{1}{N+1}$.
          - texto: |
              Su suma es $\lim_{N\to\infty}\left(1-\frac{1}{N+1}\right) = 1$.
          - texto: |
              Las dos series tienen término general tendiendo a cero, así que
              esa condición **no** decide nada: es necesaria, no suficiente.
          - texto: |
              Como las bases suman infinito, las áreas también, porque cada
              rectángulo tiene área positiva.
            trampa: true
            mensaje: |
              Que todos los términos sean positivos no implica que la suma sea
              infinita: eso solo garantiza que las sumas parciales **crecen**, y
              una sucesión creciente puede estar acotada y converger. Es
              exactamente lo que pasa aquí — las áreas crecen hacia 1 y no lo
              pasan. Multiplicar por la altura $\frac{1}{n+1}$ es lo que
              convierte una serie divergente en una convergente.
        veredicto: |
          Ese contraste es toda la lección del apartado: la misma figura da una
          serie divergente y otra convergente, según qué midas.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** Se da el criterio de las series hipergeométricas y se piden
      tres cosas: la suma de $\sum\frac{1}{(n+2)(n+3)}$, y si convergen —y a
      qué— la suma de las bases y la de las áreas de unos rectángulos.

      **Reparto de puntos del examen:** COMP1 2 · COMP2 6 · COMP4 2.

      ### 1 · Apartado (a): identificar los tres parámetros

      El enunciado regala el criterio; el trabajo es **encajar la serie en él**,
      y para eso hay que calcular el cociente de términos consecutivos:

      $$
      \frac{a_{n+1}}{a_n}
      = \frac{\dfrac{1}{(n+3)(n+4)}}{\dfrac{1}{(n+2)(n+3)}}
      = \frac{(n+2)(n+3)}{(n+3)(n+4)}
      = \frac{n+2}{n+4}
      $$

      Comparando con $\dfrac{\alpha n+\beta}{\alpha n+\gamma}$:

      $$
      \alpha = 1, \qquad \beta = 2, \qquad \gamma = 4
      $$

      **Hay que comprobar la hipótesis antes de usar la fórmula**, y esto no es
      un trámite: es la parte de COMP4 de este apartado.

      $$
      \alpha+\beta = 3 < 4 = \gamma \quad\checkmark
      $$

      Además los términos son positivos, como pide la definición. La serie
      converge y la fórmula es aplicable.

      ### 2 · Apartado (a): la suma

      Con $a_1 = \dfrac{1}{3\cdot4} = \dfrac{1}{12}$ y

      $$
      a_n(\alpha n+\beta) = \frac{n+2}{(n+2)(n+3)} = \frac{1}{n+3}
      \;\xrightarrow[n\to\infty]{}\; 0
      $$

      la fórmula del enunciado da

      $$
      S = \lim_{n\to\infty}\frac{a_n(\alpha n+\beta)-a_1\gamma}{\alpha+\beta-\gamma}
        = \frac{0-\dfrac{1}{12}\cdot 4}{1+2-4}
        = \frac{-\dfrac13}{-1}
        = \frac{1}{3}
      $$

      Los dos signos negativos se cancelan: conviene escribirlo despacio,
      porque perder uno deja la suma negativa, y una serie de términos
      positivos no puede sumar un número negativo. Esa comprobación de
      coherencia sale gratis y caza el error.

      ### 3 · Apartado (b.1): las bases

      La base del rectángulo $n$-ésimo es $\frac1n$, así que sumar todas las
      bases es sumar

      $$
      \sum_{n=1}^{\infty}\frac{1}{n}
      $$

      la **serie armónica**, que **diverge** a $+\infty$. No hay suma finita.

      Conviene decir por qué, porque es lo que separa esta respuesta de un «me
      suena que diverge». Agrupando términos en bloques de longitud potencia de
      dos:

      $$
      \underbrace{\frac12}_{\ge \frac12}
      + \underbrace{\frac13+\frac14}_{\ge \frac12}
      + \underbrace{\frac15+\dots+\frac18}_{\ge \frac12}
      + \dots
      $$

      cada bloque suma al menos $\frac12$, y hay infinitos bloques.

      ### 4 · Apartado (b.2): las áreas

      El área del rectángulo $n$-ésimo es base por altura:

      $$
      A_n = \frac{1}{n}\cdot\frac{1}{n+1} = \frac{1}{n(n+1)}
      $$

      que se descompone en fracciones simples:

      $$
      \frac{1}{n(n+1)} = \frac{1}{n}-\frac{1}{n+1}
      $$

      La suma parcial **telescopia** —cada término cancela al siguiente—:

      $$
      \sum_{n=1}^{N} A_n
      = \left(1-\frac12\right)+\left(\frac12-\frac13\right)+\dots
        +\left(\frac1N-\frac{1}{N+1}\right)
      = 1-\frac{1}{N+1}
      $$

      $$
      \sum_{n=1}^{\infty} A_n = \lim_{N\to\infty}\left(1-\frac{1}{N+1}\right) = 1
      $$

      **Converge, y su suma es exactamente 1.**

      ### 5 · Lo que el apartado (b) está enseñando

      Los rectángulos son **los mismos** en las dos preguntas y el resultado es
      el contrario. Merece la pena escribirlo en el examen:

      - Las dos series tienen término general tendiendo a cero. Esa condición es
        **necesaria pero no suficiente**, y aquí se ve con las dos a la vez: una
        converge y la otra no, y las dos la cumplen.
      - Lo que cambia es la **velocidad**. $\frac1n$ se hace pequeña demasiado
        despacio; multiplicarla por la altura $\frac{1}{n+1}$ la convierte en
        algo del orden de $\frac{1}{n^{2}}$, y eso ya suma.
      - Geométricamente: los rectángulos caben todos dentro de un cuadrado de
        área 1, pero sus bases puestas en fila no caben en ningún segmento de
        longitud finita.

      ### 6 · Comprobación

      **Del apartado (a)**, por una vía completamente distinta: descomponiendo
      y telescopiando directamente,

      $$
      \frac{1}{(n+2)(n+3)} = \frac{1}{n+2}-\frac{1}{n+3}
      $$

      $$
      \sum_{n=1}^{N} = \frac{1}{3}-\frac{1}{N+3} \;\longrightarrow\; \frac{1}{3}
      \quad\checkmark
      $$

      Y numéricamente, los cinco primeros términos suman
      $\frac{1}{12}+\frac{1}{20}+\frac{1}{30}+\frac{1}{42}+\frac{1}{56}
      \approx 0{,}214$, que va subiendo hacia $0{,}333$ sin pasarse.

      **Del apartado (b.2)**, con números: las áreas son
      $\frac12, \frac16, \frac{1}{12}, \frac{1}{20},\dots$ y sus sumas parciales
      $0{,}5,\ 0{,}667,\ 0{,}75,\ 0{,}8,\dots$ Crecen hacia 1 sin alcanzarlo,
      que es justo lo que dice $1-\frac{1}{N+1}$.

      ### Resultado

      $$
      \boxed{\;\text{(a) } \sum_{n=1}^{\infty}\frac{1}{(n+2)(n+3)} = \frac{1}{3}
      \qquad
      \text{(b.1) diverge}
      \qquad
      \text{(b.2) converge, suma } 1\;}
      $$
