            <desc id="f-ex1516-media-elipse-d">Una elipse centrada en el punto (−1,0), con los focos en menos uno más dos i y menos uno menos dos i. El eje mayor es vertical y llega a más y menos dos coma cinco; el menor va de x igual a menos dos coma cinco a x igual a cero coma cinco. El borde va en trazo continuo. La recta y igual a x la atraviesa, y se sombrea la mitad de abajo, que es la que cumple que la parte real no es menor que la imaginaria.</desc>
