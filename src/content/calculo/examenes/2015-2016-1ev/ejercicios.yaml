ejercicios:
  - id: ex1516-1-parametro-real
    titulo: Un parámetro real con cuatro condiciones
    fuente: >-
      Ejercicio 1 · Primera evaluación, 5 de octubre de 2015 · Cálculo
      (Industriales), UPV/EHU · Enunciado idéntico al ejercicio 1.17 del
      boletín del tema 1. El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2

    enunciado: |
      Sea el número complejo $z = \dfrac{2+i}{a-i}$, donde $a \in \mathbb{R}$.

      **a)** Calcular el valor de $a$ para que $z$ sea real.

      **b)** Calcular el valor de $a$ para que $z$ sea imaginario puro.

      **c)** Calcular $a$ para que el afijo del número complejo $z$ esté en la
      bisectriz del primer cuadrante.

      **d)** Calcular $a$ para que el afijo del número complejo $z$ pertenezca a
      la circunferencia $x^{2}+y^{2} = 1$.
    pide: Calcular el valor de $a$ en los cuatro casos.

    pasos:
      - tipo: reconocer
        pregunta: |
          Son cuatro apartados sobre el mismo número. ¿Qué conviene hacer
          primero?
        opciones:
          - texto: >-
              **Racionalizar una sola vez** y dejar $z$ separado en parte real e
              imaginaria
            correcta: true
            mensaje: |
              Eso es. Con $z = \frac{2a-1}{a^{2}+1}+i\frac{a+2}{a^{2}+1}$
              delante, los cuatro apartados son cuatro condiciones inmediatas
              sobre esas dos expresiones. Racionalizar cuatro veces es perder el
              tiempo y multiplicar por cuatro las posibilidades de fallar.
          - texto: Resolver cada apartado por separado desde el principio
            mensaje: |
              Funciona, pero repite cuatro veces la misma cuenta. En un examen
              con 30 puntos y tres ejercicios, ese tiempo hace falta en otro
              sitio.
          - texto: Pasar $z$ a forma polar
            mensaje: |
              La polar va bien para el apartado (d), que habla del módulo, pero
              no para los otros tres, que hablan de parte real e imaginaria. La
              binómica sirve para los cuatro.
          - texto: Suponer que $a$ es positivo
            mensaje: |
              No hay ninguna razón para suponerlo, y de hecho la respuesta del
              apartado (a) es negativa. Suponer datos que el enunciado no da es
              la forma más rápida de perder soluciones.

      - tipo: calcular
        titulo: Apartado (a)
        pregunta: |
          ¿Para qué valor de $a$ es $z$ **real**?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Signo cambiado. La parte imaginaria es
              $\frac{a+2}{a^{2}+1}$, y se anula cuando $a+2=0$, es decir
              $a=-2$.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es la respuesta del apartado (b), la que anula la parte
              **real**. Aquí se pide que se anule la imaginaria.
          - valor: '0'
            mensaje: |
              Con $a=0$ sale $z = \frac{2+i}{-i} = -1+2i$, que no es real. La
              parte imaginaria vale $\frac{0+2}{1} = 2 \neq 0$.
        pista: |
          $z$ es real cuando su parte imaginaria es nula.
        desarrollo: |
          Racionalizando una sola vez:

          $$
          z = \frac{2+i}{a-i}\cdot\frac{a+i}{a+i}
            = \frac{(2+i)(a+i)}{a^{2}+1}
          $$

          $$
          (2+i)(a+i) = 2a+2i+ai+i^{2} = (2a-1)+(a+2)i
          $$

          $$
          z = \underbrace{\frac{2a-1}{a^{2}+1}}_{\operatorname{Re} z}
            + i\,\underbrace{\frac{a+2}{a^{2}+1}}_{\operatorname{Im} z}
          $$

          El denominador $a^{2}+1$ **nunca se anula**, así que ninguna condición
          tendrá restricciones ocultas.

          $z$ real $\iff$ parte imaginaria nula:

          $$
          \frac{a+2}{a^{2}+1} = 0 \;\Longrightarrow\; a = -2
          $$

          Comprobación: $z = \frac{-5}{5} = -1$, real ✔
        veredicto: |
          Que $a^{2}+1>0$ siempre es lo que hace que los cuatro apartados se
          resuelvan igualando numeradores a cero, sin discutir casos.

      - tipo: calcular
        titulo: Apartado (d)
        pregunta: |
          ¿Para qué valores de $a$ está el afijo en la circunferencia unidad?
          Da los dos.
        respuesta:
          tipo: conjunto
          valor: 2, -2
          tolerancia: 0.01
          formato: los dos valores separados por una coma
        distractores:
          - valor: '2'
            mensaje: |
              Falta el otro. La condición solo depende de $a^{2}$, así que si
              $a=2$ vale, $a=-2$ también. Dar una sola solución es el error
              típico de este apartado.
          - valor: 5, -5
            mensaje: |
              De $a^{2}+1 = 5$ sale $a^{2} = 4$, no $a^{2} = 25$. Cuidado al
              despejar.
          - valor: 1, -1
            mensaje: |
              Con $a=\pm1$ el denominador vale $\left|a-i\right| = \sqrt2$ y el
              módulo de $z$ sería $\frac{\sqrt5}{\sqrt2} \neq 1$.
        pista: |
          $x^{2}+y^{2} = 1$ es lo mismo que $\left|z\right| = 1$, y el módulo de
          un cociente es el cociente de módulos.
        desarrollo: |
          La condición $x^{2}+y^{2} = 1$ es exactamente $\left|z\right| = 1$, y
          el módulo de un cociente es el cociente de módulos — así que **no hace
          falta racionalizar** para este apartado:

          $$
          \left|z\right| = \frac{\left|2+i\right|}{\left|a-i\right|}
          = \frac{\sqrt5}{\sqrt{a^{2}+1}} = 1
          $$

          $$
          a^{2}+1 = 5 \;\Longrightarrow\; a^{2} = 4 \;\Longrightarrow\; a = \pm2
          $$

          **Las dos valen**: la condición es simétrica en el signo de $a$ porque
          solo aparece $a^{2}$.
        veredicto: |
          Este apartado es el único de los cuatro que se resuelve más rápido
          **sin** racionalizar. Merece la pena verlo.

      - tipo: justificar
        pregunta: |
          Ordena la resolución de los cuatro apartados. Una de las piezas no
          debe entrar.
        piezas:
          - texto: |
              Se racionaliza una sola vez:
              $z = \frac{2a-1}{a^{2}+1}+i\frac{a+2}{a^{2}+1}$, con
              $a^{2}+1>0$ siempre.
          - texto: |
              **(a)** $z$ real $\iff$ parte imaginaria nula $\iff a = -2$.
          - texto: |
              **(b)** $z$ imaginario puro $\iff$ parte real nula
              $\iff a = \frac12$.
          - texto: |
              **(c)** La bisectriz del primer cuadrante es $y=x$ **con $x>0$**.
              De $2a-1 = a+2$ sale $a=3$, y hay que comprobar el signo: las dos
              componentes valen $\frac12>0$ ✔
          - texto: |
              **(d)** $x^{2}+y^{2}=1$ es $\left|z\right|=1$, y
              $\frac{\sqrt5}{\sqrt{a^{2}+1}} = 1$ da $a = \pm2$.
          - texto: |
              En (c) basta con resolver $2a-1 = a+2$, porque la bisectriz es la
              recta $y=x$ entera.
            trampa: true
            mensaje: |
              La recta $y=x$ entera es la unión de **dos** bisectrices: la del
              primer cuadrante y la del tercero. El enunciado pide la del
              primero, así que hay que comprobar además que las componentes
              salgan **positivas**. Aquí salen, y $a=3$ es válido; pero si
              hubieran salido negativas, el afijo estaría en el tercer cuadrante
              y habría que rechazarlo.
        veredicto: |
          El apartado (c) es el que separa una resolución completa de una a
          medias, y solo cuesta una línea: comprobar el signo.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** $z = \dfrac{2+i}{a-i}$ con $a \in \mathbb{R}$, y cuatro
      condiciones sobre su afijo.

      **Reparto de puntos del examen:** COMP2 8 · COMP4 2. **No se evalúa
      COMP1**: es el ejercicio más de cálculo de toda la colección. Este examen
      tiene tres ejercicios y 30 puntos.

      > Este enunciado es el **ejercicio 1.17 del boletín** del tema 1.

      ### 1 · El trabajo que sirve para los cuatro apartados

      Se racionaliza **una sola vez**, multiplicando por el conjugado del
      denominador:

      $$
      z = \frac{2+i}{a-i}\cdot\frac{a+i}{a+i} = \frac{(2+i)(a+i)}{a^{2}+1}
      $$

      Desarrollando el numerador, con $i^{2} = -1$:

      $$
      (2+i)(a+i) = 2a+2i+ai+i^{2} = (2a-1)+(a+2)i
      $$

      $$
      z = \underbrace{\frac{2a-1}{a^{2}+1}}_{\operatorname{Re} z}
        + i\,\underbrace{\frac{a+2}{a^{2}+1}}_{\operatorname{Im} z}
      $$

      Y una observación que ahorra discutir casos: **$a^{2}+1 > 0$ para todo
      $a$ real**, así que el denominador nunca se anula y las cuatro condiciones
      se reducen a anular o igualar numeradores.

      ### 2 · Apartado (a): $z$ real

      Parte imaginaria nula:

      $$
      \frac{a+2}{a^{2}+1} = 0 \;\Longleftrightarrow\; a+2 = 0
      \;\Longrightarrow\; a = -2
      $$

      Comprobación: $z = \frac{2+i}{-2-i} = \frac{2+i}{-(2+i)} = -1$, real ✔

      ### 3 · Apartado (b): $z$ imaginario puro

      Parte real nula:

      $$
      \frac{2a-1}{a^{2}+1} = 0 \;\Longleftrightarrow\; 2a-1 = 0
      \;\Longrightarrow\; a = \frac{1}{2}
      $$

      Comprobación: con $a=\frac12$, la parte imaginaria vale
      $\frac{\frac12+2}{\frac14+1} = \frac{2{,}5}{1{,}25} = 2$, así que
      $z = 2i$ ✔

      ### 4 · Apartado (c): la bisectriz del primer cuadrante

      Aquí está el matiz que decide el apartado. La bisectriz del primer
      cuadrante es la recta $y=x$ **restringida a $x>0$**: la recta entera
      incluye también la bisectriz del tercer cuadrante.

      Primero la igualdad:

      $$
      \frac{2a-1}{a^{2}+1} = \frac{a+2}{a^{2}+1}
      \;\Longleftrightarrow\;
      2a-1 = a+2
      \;\Longrightarrow\;
      a = 3
      $$

      Y después el signo, que es la parte que se olvida. Con $a=3$:

      $$
      \operatorname{Re} z = \frac{5}{10} = \frac12,
      \qquad
      \operatorname{Im} z = \frac{5}{10} = \frac12
      $$

      Las dos componentes son **positivas**, así que el afijo está en el primer
      cuadrante y $a=3$ es válido ✔. Si hubieran salido negativas, el afijo
      estaría en la bisectriz del tercer cuadrante y habría que rechazarlo.

      ### 5 · Apartado (d): la circunferencia unidad

      La condición $x^{2}+y^{2} = 1$ es exactamente $\left|z\right| = 1$. Y como
      el módulo de un cociente es el cociente de módulos, **este apartado se
      resuelve sin racionalizar**:

      $$
      \left|z\right| = \frac{\left|2+i\right|}{\left|a-i\right|}
      = \frac{\sqrt5}{\sqrt{a^{2}+1}} = 1
      $$

      $$
      \sqrt{a^{2}+1} = \sqrt5 \;\Longrightarrow\; a^{2}+1 = 5
      \;\Longrightarrow\; a^{2} = 4 \;\Longrightarrow\; a = \pm2
      $$

      **Los dos valores valen.** La condición solo depende de $a^{2}$, así que
      es simétrica en el signo. Dar solo $a=2$ es medio apartado.

      ### 6 · Comprobación

      | apartado | $a$ | $z$ | ¿cumple? |
      |---|---|---|---|
      | (a) real | $-2$ | $-1$ | ✔ |
      | (b) imaginario puro | $\frac12$ | $2i$ | ✔ |
      | (c) bisectriz 1.er cuadrante | $3$ | $\frac12+\frac12 i$ | ✔ |
      | (d) $\left|z\right|=1$ | $2$ | $\frac{3}{5}+\frac{4}{5}i$ | $\frac9{25}+\frac{16}{25} = 1$ ✔ |
      | (d) $\left|z\right|=1$ | $-2$ | $-1$ | $\left|-1\right| = 1$ ✔ |

      La última fila enseña algo bonito: con $a=-2$ el número es $-1$, que es a
      la vez **real** y de módulo 1. Por eso $a=-2$ aparece en dos apartados.

      ### Resultado

      $$
      \boxed{\;\text{(a) } a=-2 \quad \text{(b) } a=\tfrac12 \quad
      \text{(c) } a=3 \quad \text{(d) } a=\pm2\;}
      $$

  - id: ex1516-2-media-elipse
    titulo: Media elipse, cortada por una diagonal
    fuente: >-
      Ejercicio 2 · Primera evaluación, 5 de octubre de 2015 · Cálculo
      (Industriales), UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 6
      comp4: 2

    enunciado: |
      Identificar y representar el lugar geométrico de los afijos de los
      números complejos $z$ que verifican:

      $$
      \begin{cases}
      \left|z+1+2i\right| + \left|z+1-2i\right| \le 5 \\[6pt]
      \operatorname{Re}(z) \ge \operatorname{Im}(z)
      \end{cases}
      $$
    pide: Identificar la región y representarla.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es la primera condición, y por qué es una desigualdad y no una
          igualdad?
        opciones:
          - texto: >-
              El **interior de una elipse**, con borde: la suma de distancias a
              dos focos, acotada
            correcta: true
            mensaje: |
              Eso es. La igualdad daría la elipse —la curva—; la desigualdad
              «$\le$» da todo lo que queda dentro, borde incluido. Los focos son
              $-1-2i$ y $-1+2i$.
          - texto: El exterior de una elipse
            mensaje: |
              El exterior sería con «$\ge$». Con «$\le$» la suma de distancias
              es **pequeña**, y eso ocurre cerca de los focos, es decir dentro.
          - texto: Una circunferencia
            mensaje: |
              La circunferencia sale con la distancia a **un** punto. Aquí hay
              dos y una suma: elipse.
          - texto: Una hipérbola
            mensaje: |
              La hipérbola aparece con la **diferencia** de distancias. Aquí hay
              una suma.

      - tipo: verificar
        pregunta: |
          Escribe la región simplificada, en $x$ e $y$. Se comparan los puntos,
          así que vale cualquier forma equivalente.
        condicion: '|z+1+2i| + |z+1-2i| <= 5 & re(z) >= im(z)'
        ventana:
          x: [-4, 2]
          y: [-4, 3.5]
        formato: por ejemplo (x+1)^2/2.25 + y^2/6.25 <= 1 & y <= x
        pista: |
          Los focos son $(-1,-2)$ y $(-1,2)$, y la constante es $2a=5$. Y la
          segunda condición es simplemente $x \ge y$.
        desarrollo: |
          **Primera condición.** Es una elipse de focos $(-1,-2)$ y $(-1,2)$:

          $$
          2a = 5 \Rightarrow a = \frac52,
          \qquad
          2c = 4 \Rightarrow c = 2
          $$

          $$
          b^{2} = a^{2}-c^{2} = \frac{25}{4}-4 = \frac94
          \Rightarrow b = \frac32
          $$

          Los focos están **en vertical**, así que el eje mayor es el vertical y
          el centro es su punto medio, $(-1,0)$:

          $$
          \frac{(x+1)^{2}}{\frac94}+\frac{y^{2}}{\frac{25}{4}} \le 1
          $$

          **Segunda condición.** $\operatorname{Re}(z) = x$ e
          $\operatorname{Im}(z) = y$, así que es

          $$
          x \ge y
          $$

          el semiplano cerrado **por debajo** de la recta $y=x$.
        veredicto: |
          La recta $y=x$ pasa por el centro de la elipse? No: el centro es
          $(-1,0)$ y ahí $y=0 > -1 = x$. El centro queda **fuera** del
          semiplano, así que la recta corta la elipse por encima de su centro.

      - tipo: justificar
        pregunta: |
          Ordena la descripción de la región. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              La primera condición es la definición de elipse con focos
              $-1-2i$ y $-1+2i$, y al ser «$\le$» describe el interior con
              borde.
          - texto: |
              $2a=5$ y $2c=4$, luego $a=\frac52$, $c=2$ y
              $b^{2} = \frac{25}{4}-4 = \frac94$. Como $a>c$, la elipse existe.
          - texto: |
              Centro $(-1,0)$ y eje mayor **vertical**, porque los focos están
              alineados verticalmente:
              $\frac{(x+1)^{2}}{9/4}+\frac{y^{2}}{25/4} \le 1$.
          - texto: |
              La segunda condición es $x \ge y$: el semiplano cerrado por
              debajo de la recta $y=x$.
          - texto: |
              La región es el trozo de elipse que queda por debajo de esa recta:
              algo más de la mitad, porque la recta pasa por encima del centro.
          - texto: |
              Como la recta $y=x$ pasa por el centro de la elipse, la parte
              seleccionada es exactamente la mitad.
            trampa: true
            mensaje: |
              El centro es $(-1,0)$, y ahí $y=0$ es **mayor** que $x=-1$: el
              centro **no** cumple $x \ge y$, así que ni siquiera está en la
              región. La recta pasa por encima del centro y corta un trozo
              menor que la mitad. Comprobar dónde cae el centro cuesta una línea
              y evita afirmar una simetría que no existe.
        veredicto: |
          Sustituir el centro en la segunda condición es la comprobación más
          rápida para saber de qué lado cae la mayor parte de la figura.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > resolución propuesta, pendiente de revisión.

      **Datos.** Se pide la región de los $z$ con
      $\left|z+1+2i\right|+\left|z+1-2i\right| \le 5$ y
      $\operatorname{Re}(z) \ge \operatorname{Im}(z)$.

      **Reparto de puntos del examen:** COMP1 2 · COMP2 6 · COMP4 2.

      ### 1 · Primera condición: el interior de una elipse

      Reescribiendo los módulos como distancias:

      $$
      \left|z-(-1-2i)\right| + \left|z-(-1+2i)\right| \le 5
      $$

      Es la **suma de las distancias a dos puntos fijos**, acotada. La igualdad
      daría la elipse de focos $-1-2i$ y $-1+2i$; la desigualdad «$\le$» da todo
      lo que queda **dentro**, con el borde incluido.

      Conviene decir por qué dentro y no fuera: la suma de distancias crece al
      alejarse de los focos, así que ser **pequeña** significa estar cerca, es
      decir en el interior.

      ### 2 · Los parámetros de la elipse

      $$
      2a = 5 \;\Longrightarrow\; a = \frac{5}{2}
      $$

      Los focos, $(-1,-2)$ y $(-1,2)$, están separados

      $$
      2c = 4 \;\Longrightarrow\; c = 2
      $$

      **Comprobación de existencia:** $a>c$, es decir $\frac52 > 2$ ✔. Si la
      constante fuera menor que la separación entre focos no habría ningún
      punto, y si fuera igual el lugar sería el segmento que los une.

      $$
      b^{2} = a^{2}-c^{2} = \frac{25}{4}-4 = \frac{9}{4}
      \;\Longrightarrow\; b = \frac{3}{2}
      $$

      El **centro** es el punto medio de los focos, $(-1,0)$. Y como los focos
      están alineados **verticalmente**, el eje mayor es el vertical:

      $$
      \frac{(x+1)^{2}}{\frac94}+\frac{y^{2}}{\frac{25}{4}} \le 1
      $$

      o, quitando denominadores,

      $$
      \frac{4(x+1)^{2}}{9}+\frac{4y^{2}}{25} \le 1
      $$

      La elipse llega hasta $y = \pm\frac52$ por arriba y por abajo, y hasta
      $x = -1\pm\frac32$ —es decir, $-2{,}5$ y $0{,}5$— por los lados.

      ### 3 · Segunda condición: un semiplano

      Con $z = x+iy$ se tiene $\operatorname{Re}(z) = x$ e
      $\operatorname{Im}(z) = y$, así que la condición es simplemente

      $$
      x \ge y
      $$

      el **semiplano cerrado por debajo** de la recta $y=x$, que es la bisectriz
      del primer y tercer cuadrante.

      ### 4 · La intersección

      ¿Por dónde corta la recta a la elipse? La forma rápida de orientarse es
      sustituir el **centro**:

      $$
      (-1,0): \quad x = -1, \quad y = 0, \quad -1 \ge 0 \;\text{ es falso}
      $$

      El centro **no** está en la región. Luego la recta pasa por encima del
      centro y la parte que se conserva es **menor que la mitad** de la elipse:
      la esquina inferior derecha.

      Los cortes exactos salen de sustituir $y=x$ en la elipse:

      $$
      \frac{4(x+1)^{2}}{9}+\frac{4x^{2}}{25} = 1
      $$

      $$
      100(x+1)^{2}+36x^{2} = 225
      \;\Longleftrightarrow\;
      136x^{2}+200x-125 = 0
      $$

      $$
      x = \frac{-200 \pm \sqrt{40\,000+68\,000}}{272}
        = \frac{-200 \pm \sqrt{108\,000}}{272}
      $$

      $$
      x \approx 0{,}473 \quad\text{y}\quad x \approx -1{,}943
      $$

      La cuerda va, aproximadamente, de $(-1{,}94,\,-1{,}94)$ a
      $(0{,}47,\,0{,}47)$.

      ### 5 · Representación gráfica

      Una elipse **de pie**, centrada en $(-1,0)$, de semiejes $\frac32$ en
      horizontal y $\frac52$ en vertical. Sobre ella, la recta $y=x$, que la
      corta en dos puntos, y sombreado el trozo que queda **por debajo y a la
      derecha** de esa recta. Los dos bordes entran: las dos desigualdades son
      no estrictas.

      ### 6 · Comprobación

      **Un punto de la región**, $z = 0$, es decir $(0,0)$:

      - Elipse: $\frac{4\cdot1}{9}+0 = 0{,}444 \le 1$ ✔
      - Semiplano: $0 \ge 0$ ✔, justo en el borde.

      Y en el enunciado original:
      $\left|1+2i\right|+\left|1-2i\right| = \sqrt5+\sqrt5 \approx 4{,}47 \le 5$ ✔

      **Un punto que debe quedar fuera**, $z = -1+2i$, que es uno de los focos:

      - Elipse: está dentro, claro ✔
      - Semiplano: $x=-1$, $y=2$, y $-1 \ge 2$ es falso ✗

      Fuera, como debe: es la parte de la elipse que la recta se lleva.

      **Y otro fuera por el otro motivo**, $z = 2$:

      - Semiplano: $2 \ge 0$ ✔
      - Elipse: $\frac{4\cdot9}{9}+0 = 4 > 1$ ✗

      Cada punto falla por una condición distinta, que es lo que hay que
      comprobar para saber que ninguna de las dos sobra.

      ### Resultado

      $$
      \boxed{\;\frac{(x+1)^{2}}{\frac94}+\frac{y^{2}}{\frac{25}{4}} \le 1
      \quad\text{y}\quad y \le x\;}
      $$

  - id: ex1516-3-verdadera-o-falsa
    titulo: Verdadera o falsa, y hay que demostrarlo
    fuente: >-
      Ejercicio 3 · Primera evaluación, 5 de octubre de 2015 · Cálculo
      (Industriales), UPV/EHU · Mismo contenido que el ejercicio 2.3 del
      boletín. El examen no publica solución: la demostración es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 0
      comp4: 8

    enunciado: |
      Razonar si la siguiente afirmación acerca de una sucesión
      $\{a_n\}_{n\in\mathbb{N}}$ es verdadera o falsa:

      $$
      \text{Si } a_n \ge 0 \text{ para todo } n
      \text{ y } \{a_n\}_{n\in\mathbb{N}} \text{ converge hacia } L,
      \text{ entonces } L \ge 0
      $$
    pide: Razonar si es verdadera o falsa.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado pregunta si es verdadera o falsa. ¿Qué hay que entregar
          en cada caso?
        opciones:
          - texto: >-
              Si es **verdadera**, una demostración general; si fuera **falsa**,
              un contraejemplo
            correcta: true
            mensaje: |
              Exacto, y esa asimetría es la clave. Para tumbar una afirmación
              universal basta **un** caso donde falle; para sostenerla hace
              falta probarla para todos. Aquí es verdadera, así que toca
              demostrar.
          - texto: En los dos casos, un ejemplo
            mensaje: |
              Un ejemplo nunca demuestra que algo se cumple **siempre**. Solo
              sirve para refutar.
          - texto: En los dos casos, una demostración
            mensaje: |
              Para refutarla no hace falta demostrar nada: basta exhibir un
              contraejemplo. Es mucho más barato.
          - texto: Basta con decir cuál de las dos es
            mensaje: |
              El enunciado dice «razonar», y el reparto de puntos lo confirma:
              ocho de los diez son la explicación formal. Acertar sin justificar
              vale muy poco.

      - tipo: calcular
        titulo: El épsilon de la reducción al absurdo
        pregunta: |
          Se supone $L<0$ para el absurdo. Con $L = -1$, ¿qué $\varepsilon$
          conviene tomar?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Con $\varepsilon = \left|L\right| = 1$ el intervalo llega justo
              hasta 0 y la desigualdad $a_n<0$ deja de ser estricta: podría ser
              $a_n=0$, que el enunciado permite. Con la mitad el choque es
              limpio.
          - valor: '-0.5'
            mensaje: |
              $\varepsilon$ tiene que ser **positivo**: la definición dice «para
              todo $\varepsilon>0$».
          - valor: '2'
            mensaje: |
              Un épsilon mayor que $\left|L\right|$ deja el 0 dentro del entorno
              y no contradice nada.
        pista: |
          La distancia de $L=-1$ a 0 es 1. Toma la mitad.
        desarrollo: |
          $$
          \varepsilon = \frac{\left|L\right|}{2} = \frac{1}{2} = 0{,}5
          $$

          Con ese valor, a partir de cierto $m$:

          $$
          a_n < L+\varepsilon = -1+0{,}5 = -0{,}5 < 0
          $$

          y eso contradice $a_n \ge 0$ para todo $n$.
        veredicto: |
          Es el mismo épsilon que en cinco de los once exámenes de la
          colección. Si hay que memorizar una cosa del tema, que sea esta.

      - tipo: justificar
        pregunta: |
          Ordena la respuesta completa. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La afirmación es verdadera**, así que hay que demostrarla para
              todas las sucesiones, no comprobarla en ejemplos.
          - texto: |
              Por reducción al absurdo, supongamos $L<0$, y sea
              $\varepsilon = \dfrac{\left|L\right|}{2} > 0$.
          - texto: |
              Por definición de límite existe $m$ con
              $\left|a_n-L\right|<\varepsilon$ para $n>m$; en particular
              $a_n < L+\varepsilon = \dfrac{L}{2} < 0$.
          - texto: |
              Eso contradice $a_n \ge 0$ para todo $n$. Luego $L \ge 0$.
          - texto: |
              El enunciado no se puede reforzar a $L>0$: $a_n = \frac1n$ es un
              contraejemplo de **esa** versión más fuerte.
          - texto: |
              Como $a_n = \frac1n$ cumple la afirmación, esta queda demostrada.
            trampa: true
            mensaje: |
              Un ejemplo que la cumple **no demuestra nada**: la afirmación
              habla de todas las sucesiones con esa propiedad. $\frac1n$ sí
              aparece en la respuesta, pero para otra cosa — para enseñar que la
              conclusión no se puede reforzar a $L>0$. Comprobar y demostrar son
              trabajos distintos.
        veredicto: |
          Fíjate en cómo la misma sucesión, $\frac1n$, es inútil como
          demostración y valiosa como contraejemplo de la versión fuerte. Todo
          depende de qué se esté afirmando.

    resolucion: |
      > **Aviso.** El examen no publica solución. Lo que sigue es una
      > demostración propuesta, pendiente de revisión.

      **Enunciado.** Razonar si es verdadera o falsa: si $a_n \ge 0$ para todo
      $n$ y $a_n \to L$, entonces $L \ge 0$.

      **Reparto de puntos del examen:** COMP1 2 · COMP4 8.

      > El enunciado de este examen tiene una errata: la línea de competencias
      > dice «COMP2 y COMP4» pero el desglose reparte COMP1 y COMP4. Se sigue el
      > desglose, que es el que suma 10.

      > El contenido es el del **ejercicio 2.3 del boletín**, aquí planteado
      > como «verdadera o falsa» en vez de «demostrar».

      ### 1 · Qué pide exactamente «razonar si es verdadera o falsa»

      Las dos respuestas posibles piden trabajos **distintos**, y reconocerlo
      son los dos puntos de COMP1:

      - Si es **falsa**, basta exhibir **un contraejemplo**: una sucesión que
        cumpla las hipótesis y no la tesis.
      - Si es **verdadera**, hace falta una **demostración general**. Ningún
        número de ejemplos sirve.

      Aquí es verdadera, así que toca demostrar.

      ### 2 · La demostración

      La tesis es una desigualdad **no estricta**, y esas se demuestran casi
      siempre por reducción al absurdo.

      Definición que se va a usar:

      $$
      \lim a_n = L \iff
      \forall\varepsilon>0\;\exists\, m \in \mathbb{N} :\;
      n>m \Rightarrow \left|a_n-L\right| < \varepsilon
      $$

      Supongamos $L<0$. Entonces $-L>0$ y se puede tomar

      $$
      \varepsilon = \frac{-L}{2} = \frac{\left|L\right|}{2} > 0
      $$

      —positivo **precisamente porque** $L$ es negativo—.

      Por la definición existe $m$ tal que para todo $n>m$

      $$
      \left|a_n-L\right| < \varepsilon
      \;\Longrightarrow\;
      a_n < L+\varepsilon = L-\frac{L}{2} = \frac{L}{2} < 0
      $$

      Es decir: **todos** los términos a partir de $m$ serían estrictamente
      negativos. Pero la hipótesis dice que $a_n \ge 0$ para todo $n$.
      Contradicción.

      Por tanto la afirmación es **verdadera**:

      $$
      L \ge 0 \qquad \blacksquare
      $$

      ### 3 · Hasta dónde llega, y hasta dónde no

      La conclusión **no se puede reforzar**. La versión fuerte —«entonces
      $L>0$»— sería **falsa**, y el contraejemplo es inmediato:

      $$
      a_n = \frac{1}{n}
      $$

      tiene todos sus términos estrictamente positivos y su límite es
      exactamente 0.

      Merece la pena fijarse en el doble papel de esa sucesión: **como
      demostración de la afirmación del enunciado no vale nada**, porque un
      ejemplo no prueba un universal; **como contraejemplo de la versión
      reforzada vale la respuesta entera**. Todo depende de qué se esté
      afirmando.

      La regla que queda: al pasar al límite, **las desigualdades estrictas se
      debilitan**. De $a_n>0$ solo se deduce $L \ge 0$.

      ### 4 · Comprobación

      Se construye una sucesión que tienda a un límite negativo y se cuenta
      cuántos términos consigue mantener no negativos:

      $$
      a_n = -1+\frac{2}{n} \;\longrightarrow\; -1
      $$

      $$
      a_1 = 1 \ge 0, \qquad a_2 = 0 \ge 0, \qquad a_3 = -0{,}33 < 0,
      \qquad a_4 = -0{,}5 < 0,\;\dots
      $$

      Solo dos. Y con el $\varepsilon = 0{,}5$ de la demostración: desde
      $\frac2n < 0{,}5$, o sea $n \ge 5$, todos son menores que $-0{,}5$.

      Por mucho que se estire, los términos no negativos son siempre
      **finitos**, y la hipótesis los exige para **todo** $n$.

      ### Resultado

      $$
      \boxed{\;\text{La afirmación es VERDADERA: } a_n \ge 0 \;\forall n
      \text{ y } a_n \to L \Longrightarrow L \ge 0\;}
      $$
