        <desc id="cos17-d">Seis puntos repartidos en dos filas horizontales simetricas
        respecto del eje real, una por encima y otra por debajo. Dentro de cada fila los
        puntos estan separados por dos pi, y las filas siguen hacia los dos lados sin
        final.</desc>
