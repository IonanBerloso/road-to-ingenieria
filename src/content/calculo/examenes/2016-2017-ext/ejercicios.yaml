        <g class="so17-n">
          <text x="203" y="219" text-anchor="middle">1</text>
          <text x="93" y="219" text-anchor="middle">−1</text>
          <text x="271" y="219" text-anchor="middle">√5</text>
          <text x="141" y="78" text-anchor="end">√5</text>
          <text x="233.3" y="99">2</text>
          <text x="291" y="198" text-anchor="end">r</text>
          <text x="155" y="72">z</text>
        </g>
        <text class="so17-l" x="148" y="152.8" text-anchor="middle" fill="var(--live)">S</text>
        <text class="so17-l" x="5" y="75.8" fill="var(--faint)">esfera de radio √5</text>
      </svg>
      <figcaption>
      La sección del sólido por un plano que contiene al eje OZ. La pared es el
      cilindro de radio 1 y el techo el casquete de la esfera de radio √5: en el
      borde llega a z = 2 y en el eje a √5. Girando esta figura alrededor del eje
      vertical se obtiene el sólido.
      </figcaption>
      </figure>

      **El volumen.** Cilíndricas, con $dV=r\,dr\,d\theta\,dz$:

      $$
      V=\int_{0}^{2\pi}\!\!\int_{0}^{1}\!\!\int_{0}^{\sqrt{5-r^{2}}}
      r\,dz\,dr\,d\theta
      =2\pi\int_{0}^{1}r\sqrt{5-r^{2}}\;dr
      $$

      Con el cambio $u=5-r^{2}$, $du=-2r\,dr$:

      $$
      V=2\pi\left[-\frac13\left(5-r^{2}\right)^{3/2}\right]_{0}^{1}
      =\frac{2\pi}{3}\left(5^{3/2}-4^{3/2}\right)
      $$

      $$
      \boxed{\;V=\frac{2\pi}{3}\left(5\sqrt5-8\right)\approx6{,}66\;}
      $$

      **La comprobación de tamaño.** El cilindro con tapa plana a la altura $2$
      mediría $\pi\cdot1^{2}\cdot2=2\pi\approx6{,}28$, y el sólido tiene además
      el casquete de encima: $6{,}66$ es un poco más, que es lo que debe ser.

      **b) El centro de gravedad.** Densidad constante, así que es el centroide.
      Por simetría de revolución $\overline{x}=\overline{y}=0$ —y decirlo así
      ahorra dos integrales y da puntos de COMP 4—.

      Integrando primero en $z$, que deja un cuadrado:

      $$
      \int_{0}^{\sqrt{5-r^{2}}}z\,dz=\frac{5-r^{2}}{2}
      $$

      $$
      \int_{S}z\,dV=2\pi\int_{0}^{1}\frac{5-r^{2}}{2}\,r\,dr
      =\pi\left[\frac{5r^{2}}{2}-\frac{r^{4}}{4}\right]_{0}^{1}
      =\frac{9\pi}{4}
      $$

      $$
      \overline{z}=\frac{9\pi/4}{\frac{2\pi}{3}\left(5\sqrt5-8\right)}
      =\frac{27}{8\left(5\sqrt5-8\right)}
      $$

      $$
      \boxed{\;G=\left(0,\,0,\;\frac{27}{8\left(5\sqrt5-8\right)}\right)
      \approx\left(0;\,0;\,1{,}06\right)\;}
      $$

      **¿Es razonable?** El sólido va de $z=0$ a $z=\sqrt5\approx2{,}24$, y es
      casi un cilindro: el casquete de arriba aporta poco volumen. Un cilindro
      puro de altura $2$ tendría el centro en $1$; el casquete lo sube un poco, a
      $1{,}06$. Encaja.

      Para comparar, media esfera maciza de radio $\sqrt5$ lo tendría en
      $\frac{3\sqrt5}{8}\approx0{,}84$, más abajo, porque su parte ancha está
      pegada al suelo. Aquí el cilindro corta justamente esa parte ancha.

  - id: ex1617-ext-6-el-area-de-diez-por-tercera-vez
    titulo: El área de diez, por tercera vez
    fuente: >-
      Ejercicio 2 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 26 de
      junio de 2017 · Cálculo. Industriales, UPV/EHU · Enunciado y figura
      idénticos al ejercicio 1 del segundo cuatrimestral de la extraordinaria de
      2021-2022 y al 2 del segundo parcial de la de 2023-2024; la figura está
      redibujada del original. El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 3
      comp2: 5
      comp4: 2
    enunciado: |
      Calcular el valor de la integral curvilínea
      $I=\displaystyle\int_{L_{1}}-y\,dx+x\,dy$ sabiendo que el área sombreada
      de la figura vale $A=10$.

