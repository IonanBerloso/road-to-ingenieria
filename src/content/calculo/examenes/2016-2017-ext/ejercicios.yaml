ejercicios:
  - id: ex1617-ext-1-el-coseno-que-vale-cinco
    titulo: Un coseno que vale cinco
    fuente: >-
      Ejercicio 1 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 26 de
      junio de 2017 · Cálculo. Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 9
      comp4: 1
    enunciado: |
      Resolver la ecuación $\cos z=5$, $z\in\mathbb{C}$.
    pide: Todas las soluciones complejas.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el enunciado insiste en que $z$ es complejo?
        opciones:
          - texto: >-
              Porque en los reales no hay solución: $\left|\cos x\right|\le1$
              siempre
            correcta: true
            mensaje: |
              Exacto. El coseno real vive entre $-1$ y $1$; el complejo no está
              acotado, porque $\cos\left(bi\right)=\cosh b$, que crece sin
              límite.
          - texto: >-
              Porque las soluciones reales existen pero son infinitas
            mensaje: |
              No hay ninguna real. Si $x$ es real, $\cos x$ no pasa de $1$ y no
              puede valer $5$.
          - texto: >-
              Porque el coseno de un complejo se define de otra manera que el de
              un real
            mensaje: |
              Se define con la misma serie, y coincide con el de siempre cuando
              $z$ es real. Lo que cambia no es la definición: es que el recorrido
              deja de estar acotado.

      - tipo: calcular
        titulo: La incógnita auxiliar
        pregunta: |
          Llamando $w=e^{iz}$, la ecuación queda $w+\frac1w=10$. ¿Cuál es la
          raíz mayor?
        respuesta:
          tipo: numero
          valor: '9.8989795'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.1010205'
            mensaje: |
              Esa es la raíz **menor**, $5-2\sqrt6$. Las dos son inversas
              —su producto vale $1$—, y por eso las dos dan el mismo conjunto de
              soluciones con el signo cambiado.
          - valor: '5'
            mensaje: |
              $5$ es la media de las dos raíces, o sea el $-\frac{b}{2a}$ del
              vértice. Falta sumarle y restarle $\sqrt{25-1}=2\sqrt6$.
          - valor: '4.8989795'
            mensaje: |
              $2\sqrt6$ es solo el radicando de la fórmula. La raíz es
              $5+2\sqrt6$.
        pista: |
          $w^{2}-10w+1=0$, y el discriminante es $100-4=96$.
        desarrollo: |
          $$
          \cos z=\frac{e^{iz}+e^{-iz}}{2}=5
          \;\Longrightarrow\;
          w+\frac1w=10
          \;\Longrightarrow\;
          w^{2}-10w+1=0
          $$

          $$
          w=\frac{10\pm\sqrt{96}}{2}=5\pm2\sqrt6
          $$

          $2\sqrt6=4{,}89898\ldots$, así que $w=9{,}8990$ o $w=0{,}1010$. Su
          producto vale $1$: son inversas.

      - tipo: calcular
        titulo: La parte imaginaria
        pregunta: |
          ¿Cuál es la parte imaginaria positiva de las soluciones?
        respuesta:
          tipo: numero
          valor: '2.2924317'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '9.8989795'
            mensaje: |
              Ese es $w$, no $z$. Falta despejar: de $e^{iz}=w$ sale
              $iz=\ln w$, y luego hay que dividir entre $i$.
          - valor: '1.5915494'
            mensaje: |
              Parece salir de dividir entre $2\pi$ en algún sitio. La parte
              imaginaria es $\ln\left(5+2\sqrt6\right)$ sin más.
          - valor: '4.8989795'
            mensaje: |
              $2\sqrt6$ es lo que va **dentro** del logaritmo, sumado a $5$. Sin
              el logaritmo la exponencial no se deshace.
        pista: |
          $iz=\ln w$, así que $z=-i\ln w$. Y $-i\ln\left(9{,}899\right)$ es un
          imaginario puro negativo… con el signo que toca.
        desarrollo: |
          $$
          e^{iz}=w
          \;\Longrightarrow\;
          iz=\ln\left|w\right|+i\arg w=\ln w+2k\pi i
          $$

          $$
          z=\frac{\ln w}{i}+2k\pi=-i\ln w+2k\pi
          $$

          Con $w=5+2\sqrt6$, $\ln w=2{,}2924$ y $z=2k\pi-2{,}2924\,i$. Con la
          otra raíz, $\ln w=-2{,}2924$ y $z=2k\pi+2{,}2924\,i$. Juntas:

          $$
          z=2k\pi\pm i\ln\left(5+2\sqrt6\right)
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Por definición
              $\cos z=\frac{e^{iz}+e^{-iz}}{2}$, así que con $w=e^{iz}$ la
              ecuación es $w^{2}-10w+1=0$.
          - texto: >-
              Sus raíces son $5\pm2\sqrt6$, y su producto vale $1$: una es la
              inversa de la otra.
          - texto: >-
              Deshaciendo la exponencial,
              $z=-i\ln w+2k\pi$, y las dos raíces dan el mismo conjunto:
              $z=2k\pi\pm i\ln\left(5+2\sqrt6\right)$, $k\in\mathbb{Z}$.
          - texto: >-
              Como $w^{2}-10w+1=0$ tiene dos raíces distintas, la ecuación
              original tiene exactamente dos soluciones.
            trampa: true
            mensaje: |
              Cada raíz de $w$ da **infinitas** $z$, porque el logaritmo complejo
              es multivaluado: $\arg w$ está definido salvo múltiplos de $2\pi$.
              De ahí el $2k\pi$. Contar soluciones de una ecuación trascendente
              como si fuera polinómica es el error de fondo de este ejercicio.
    resolucion: |
      **Por qué hace falta salir de los reales.** El coseno de un real vive entre
      $-1$ y $1$: no hay ningún $x$ con $\cos x=5$. El de un complejo, en cambio,
      no está acotado, y basta mirar el eje imaginario para verlo:

      $$
      \cos\left(bi\right)=\cosh b\;\xrightarrow[b\to\infty]{}\;+\infty
      $$

      **La definición, que es todo el ejercicio.**

      $$
      \cos z=\frac{e^{iz}+e^{-iz}}{2}
      $$

      Llamando $w=e^{iz}$, la ecuación $\cos z=5$ se vuelve algebraica:

      $$
      \frac{w+\frac1w}{2}=5
      \;\Longrightarrow\;
      w^{2}-10w+1=0
      \;\Longrightarrow\;
      w=\frac{10\pm\sqrt{96}}{2}=5\pm2\sqrt6
      $$

      Las dos raíces son positivas y **una es la inversa de la otra**:
      $\left(5+2\sqrt6\right)\left(5-2\sqrt6\right)=25-24=1$. Eso adelanta que
      las dos van a dar el mismo conjunto de soluciones con el signo cambiado.

      **Deshacer la exponencial.** Aquí es donde aparece el infinito:

      $$
      e^{iz}=w
      \;\Longrightarrow\;
      iz=\operatorname{Ln}w=\ln\left|w\right|+i\left(\arg w+2k\pi\right)
      $$

      Como $w$ es real y positivo, $\arg w=0$:

      $$
      iz=\ln w+2k\pi i
      \;\Longrightarrow\;
      z=2k\pi-i\ln w
      $$

      Y con las dos raíces, usando $\ln\left(5-2\sqrt6\right)=-\ln\left(5+2\sqrt6\right)$:

      $$
      \boxed{\;z=2k\pi\pm i\ln\left(5+2\sqrt6\right),\qquad k\in\mathbb{Z}\;}
      $$

      Numéricamente, $\ln\left(5+2\sqrt6\right)\approx2{,}2924$, así que las
      soluciones son $\ldots,\;-2\pi\pm2{,}2924i,\;\pm2{,}2924i,\;
      2\pi\pm2{,}2924i,\;\ldots$

