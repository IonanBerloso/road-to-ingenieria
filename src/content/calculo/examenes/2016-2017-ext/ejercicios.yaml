      </svg>
      <figcaption>
      Figura redibujada del enunciado. Arriba, la semicircunferencia de radio dos
      marcada como L2; abajo, la curva L1, que el enunciado no describe. Lo
      único que se sabe de ella es que va de (−2,0) a (2,0) y que encierra, con
      la de arriba, un área de diez.
      </figcaption>
      </figure>
    pide: El valor de la integral sobre L₁.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué se puede resolver sin conocer la ecuación de $L_{1}$?
        opciones:
          - texto: >-
              Porque el campo $\left(-y,x\right)$ tiene
              $Q_{x}-P_{y}=2$ constante, y entonces Green convierte la
              circulación en **dos veces el área**
            correcta: true
            mensaje: |
              Exacto. Cuando $Q_{x}-P_{y}$ es constante, la integral doble no
              depende de la forma del recinto sino solo de su área. Ese es el
              motivo de que el enunciado dé $A=10$ y no dé la curva.
          - texto: >-
              Porque toda integral curvilínea sobre una curva cerrada vale cero
            mensaje: |
              Solo si el campo es conservativo, y este no lo es:
              $Q_{x}-P_{y}=2\neq0$.
          - texto: >-
              Porque $L_{1}$ y $L_{2}$ son simétricas respecto del eje OX
            mensaje: |
              La figura no dice eso, y aunque lo dijera no bastaría: el campo no
              es simétrico de la forma que haría falta.

      - tipo: calcular
        titulo: La circulación por la curva cerrada
        pregunta: |
          ¿Cuánto vale $\oint_{L_{1}\cup L_{2}}-y\,dx+x\,dy$?
        respuesta:
          tipo: numero
          valor: '20'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '10'
            mensaje: |
              $10$ es el área. La integral es **dos veces** el área, porque
              $Q_{x}-P_{y}=1-\left(-1\right)=2$.
          - valor: '5'
            mensaje: |
              $5$ sería la mitad del área. La fórmula $A=\frac12\oint$ va al
              revés: $\oint=2A$.
          - valor: '0'
            mensaje: |
              Cero saldría si el campo fuese conservativo. Aquí
              $Q_{x}-P_{y}=2$, y la circulación mide justo el doble del área
              encerrada.
        pista: |
          $P=-y$, $Q=x$: $\frac{\partial Q}{\partial x}=1$ y
          $\frac{\partial P}{\partial y}=-1$.
        desarrollo: |
          $$
          \oint_{L_{1}\cup L_{2}}-y\,dx+x\,dy
          =\iint_{D}\left(\frac{\partial Q}{\partial x}
          -\frac{\partial P}{\partial y}\right)dA
          =\iint_{D}2\,dA=2A=20
          $$

      - tipo: calcular
        titulo: El tramo semicircular
        pregunta: |
          ¿Cuánto vale la integral a lo largo de $L_{2}$, la semicircunferencia
          de radio $2$ de $\left(2,0\right)$ a $\left(-2,0\right)$?
        respuesta:
          tipo: numero
          valor: '12.5664'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '6.2832'
            mensaje: |
              $2\pi$ es la **longitud** de la semicircunferencia de radio 2. La
              integral vale $r^{2}\Delta\theta=4\pi$.
          - valor: '25.1327'
            mensaje: |
              $8\pi$ saldría de recorrer la circunferencia **entera**. $L_{2}$ es
              solo la mitad de arriba.
          - valor: '3.1416'
            mensaje: |
              $\pi$ saldría con radio $1$. Aquí el radio es $2$ y entra al
              cuadrado.
        pista: |
          Con $x=2\cos\theta$, $y=2\operatorname{sen}\theta$, el integrando
          $-y\,dx+x\,dy$ se convierte en $4\,d\theta$.
        desarrollo: |
          $$
          -y\,dx+x\,dy
          =-2\operatorname{sen}\theta\left(-2\operatorname{sen}\theta\right)d\theta
          +2\cos\theta\left(2\cos\theta\right)d\theta
          =4\,d\theta
          $$

          $$
          \int_{L_{2}}=\int_{0}^{\pi}4\,d\theta=4\pi\approx12{,}566
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $L_{1}$ y $L_{2}$ juntas forman una curva cerrada que encierra el
              recinto sombreado, de área $10$.
          - texto: >-
              Con $P=-y$ y $Q=x$, Green da
              $\oint_{L_{1}\cup L_{2}}=\iint_{D}2\,dA=2\cdot10=20$.
          - texto: >-
              Sobre $L_{2}$, parametrizando la semicircunferencia de radio $2$,
              la integral vale $4\pi$.
          - texto: >-
              Como $L_{1}$ no tiene ecuación conocida, hay que suponer que es un
              arco de circunferencia para poder parametrizarla.
            trampa: true
            mensaje: |
              No hace falta ninguna suposición, y suponer sería inventarse el
              enunciado. La gracia del ejercicio es justamente que el resultado
              **no depende** de la forma de $L_{1}$: la integral doble solo
              necesita el área, y el área la da el enunciado.
    resolucion: |
      **Por qué el enunciado no da la curva.** El campo es $P=-y$, $Q=x$, y su
      rotacional escalar es constante:

      $$
      \frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}
      =1-\left(-1\right)=2
      $$

      Cuando esa diferencia es constante, la integral doble de Green **solo
      depende del área**, no de la forma:

      $$
      \oint_{L_{1}\cup L_{2}}-y\,dx+x\,dy=\iint_{D}2\,dA=2A=20
      $$

      Es la fórmula del área por integral curvilínea leída al revés:
      $A=\frac12\oint\left(-y\,dx+x\,dy\right)$.

      **El trozo que sí se conoce.** $L_{2}$ es la semicircunferencia superior de
      radio $2$, recorrida de $\left(2,0\right)$ a $\left(-2,0\right)$, o sea con
      $\theta$ de $0$ a $\pi$. Parametrizando $x=2\cos\theta$,
      $y=2\operatorname{sen}\theta$:

      $$
      -y\,dx+x\,dy=4\operatorname{sen}^{2}\theta\,d\theta
      +4\cos^{2}\theta\,d\theta=4\,d\theta
      $$

      $$
      \int_{L_{2}}=\int_{0}^{\pi}4\,d\theta=4\pi
      $$

      Que el integrando salga constante tampoco es casualidad: para una
      circunferencia centrada en el origen, $-y\,dx+x\,dy=r^{2}d\theta$.

      **Y por diferencia:**

      $$
      \boxed{\;I=\int_{L_{1}}=20-4\pi\approx7{,}43\;}
      $$

      **La comprobación de sentido.** El área que $L_{2}$ encierra con el eje OX
      es $\frac{\pi\cdot2^{2}}{2}=2\pi\approx6{,}28$, y su circulación es
      $4\pi=2\cdot2\pi$, o sea el doble de esa media luna, como manda la fórmula.
      El resto, $20-4\pi$, corresponde a las $10-2\pi\approx3{,}72$ unidades de
      área que $L_{1}$ añade por debajo del eje. Todo cuadra.

      **Este ejercicio ha caído tres veces**: aquí en 2016-2017, otra vez en
      2021-2022 y otra en 2023-2024, con la misma figura y el mismo $A=10$. En
      una ruta de estudio de la extraordinaria, es de los primeros que hay que
      saber hacer.

  - id: ex1617-ext-7-la-lineal-con-el-factor-x-cuadrado
    titulo: La lineal cuyo factor integrante es x al cuadrado
    fuente: >-
      Ejercicio 3 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 26 de
      junio de 2017 · Cálculo. Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Resolver la EDO $xy'+2y=\operatorname{sen}x$,
      $y\left(\frac{\pi}{2}\right)=4\left(\frac{2}{\pi}\right)^{2}$, con $x>0$.
    pide: La solución del problema de valores iniciales.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tipo de ecuación es y cómo se ataca?
        opciones:
          - texto: >-
              Lineal de primer orden. Dividiendo entre $x$ queda
              $y'+\frac2x y=\frac{\operatorname{sen}x}{x}$, y el factor
              integrante es $e^{\int 2/x\,dx}=x^{2}$
            correcta: true
            mensaje: |
              Eso es. Y con ese factor el miembro izquierdo se vuelve la derivada
              de un producto: $\left(x^{2}y\right)'=x\operatorname{sen}x$. La
              condición $x>0$ está para que $\ln x$ tenga sentido.
          - texto: De variables separables
            mensaje: |
              No lo es: la $x$ aparece dentro del $\operatorname{sen}x$ y también
              multiplicando a $y'$, y no hay forma de agrupar las $y$ a un lado y
              las $x$ al otro.
          - texto: >-
              Exacta, porque $M_{y}=N_{x}$
            mensaje: |
              Escrita como $\left(2y-\operatorname{sen}x\right)dx+x\,dy=0$ sale
              $M_{y}=2$ y $N_{x}=1$: no es exacta tal cual. Lo que la arregla es
              justamente el factor $x$ que la vuelve $x^{2}$.

      - tipo: calcular
        titulo: La constante de integración
        pregunta: |
          De $x^{2}y=-x\cos x+\operatorname{sen}x+C$ y la condición inicial,
          ¿cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              $4$ es el valor de $x^{2}y$ en $x=\frac{\pi}{2}$. Falta restarle
              lo que aportan los dos primeros términos, que juntos valen $1$.
          - valor: '5'
            mensaje: |
              Has sumado el $1$ en vez de restarlo:
              $4=0+1+C$ da $C=3$.
          - valor: '0'
            mensaje: |
              Con $C=0$ la condición no se cumple: quedaría
              $x^{2}y=1$ en $x=\frac{\pi}{2}$, o sea $y=\frac{4}{\pi^{2}}$, la
              cuarta parte de lo pedido.
        pista: |
          En $x=\frac{\pi}{2}$: $\cos\frac{\pi}{2}=0$ y
          $\operatorname{sen}\frac{\pi}{2}=1$. Y
          $\left(\frac{\pi}{2}\right)^{2}\cdot\frac{16}{\pi^{2}}=4$.
        desarrollo: |
          La condición inicial es $y\left(\frac{\pi}{2}\right)
          =4\left(\frac2\pi\right)^{2}=\frac{16}{\pi^{2}}$, así que

          $$
          x^{2}y\Big|_{x=\pi/2}=\frac{\pi^{2}}{4}\cdot\frac{16}{\pi^{2}}=4
          $$

          y por otro lado

          $$
          -\frac{\pi}{2}\cos\frac{\pi}{2}+\operatorname{sen}\frac{\pi}{2}+C
          =0+1+C
          $$

          $$
          4=1+C\;\Longrightarrow\;C=3
          $$

      - tipo: calcular
        titulo: El valor en x = π
        pregunta: |
          ¿Cuánto vale $y\left(\pi\right)$?
        respuesta:
          tipo: numero
          valor: '0.6223'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.3183'
            mensaje: |
              Ese es el valor con $C=0$, o sea $\frac{1}{\pi}$. La constante vale
              $3$ y aporta $\frac{3}{\pi^{2}}$: casi la mitad del resultado.
          - valor: '6.1416'
            mensaje: |
              $3+\pi$ es el numerador sin dividir entre $x^{2}$. La solución es
              $\frac{3+\operatorname{sen}x-x\cos x}{x^{2}}$, y el denominador está
              ahí.
          - valor: '-0.0143'
            mensaje: |
              Ese sale de poner $+x\cos x$ en vez de $-x\cos x$. En $x=\pi$ el
              coseno vale $-1$, así que $-x\cos x=+\pi$: ese término **suma**, y
              es el que más pesa.
        pista: |
          $y\left(x\right)=\frac{3+\operatorname{sen}x-x\cos x}{x^{2}}$, y en
          $x=\pi$ el seno vale $0$ y el coseno $-1$.
        desarrollo: |
          $$
          y\left(\pi\right)=\frac{3+0-\pi\left(-1\right)}{\pi^{2}}
          =\frac{3+\pi}{\pi^{2}}
          \approx\frac{6{,}1416}{9{,}8696}\approx0{,}6223
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Dividiendo entre $x$ —lícito porque $x>0$— queda
              $y'+\frac{2}{x}y=\frac{\operatorname{sen}x}{x}$, lineal de primer
              orden.
          - texto: >-
              El factor integrante es $e^{\int\frac2x dx}=e^{2\ln x}=x^{2}$, y
              con él el miembro izquierdo es $\left(x^{2}y\right)'$.
          - texto: >-
              $\left(x^{2}y\right)'=x\operatorname{sen}x$, y por partes
              $x^{2}y=-x\cos x+\operatorname{sen}x+C$.
          - texto: >-
              Como la ecuación original ya tenía una $x$ multiplicando a $y'$, el
              factor integrante es $x$ y no $x^{2}$.
            trampa: true
            mensaje: |
              El factor integrante se calcula sobre la ecuación **normalizada**,
              la que tiene $y'$ con coeficiente $1$. Con $x$ el miembro izquierdo
              sería $xy'+y$, la derivada de $xy$, y el enunciado tiene $2y$, no
              $y$. Se comprueba en una línea: $\left(x^{2}y\right)'
              =x^{2}y'+2xy=x\left(xy'+2y\right)$ ✓.
    resolucion: |
      **El tipo.** Con $x>0$ se puede dividir:

      $$
      y'+\frac{2}{x}\,y=\frac{\operatorname{sen}x}{x}
      $$

      Lineal de primer orden. El factor integrante es

      $$
      \mu\left(x\right)=e^{\int\frac{2}{x}dx}=e^{2\ln x}=x^{2}
      $$

      y multiplicando la ecuación original —no la normalizada, que es lo cómodo
      aquí— por $x$:

      $$
      x^{2}y'+2xy=x\operatorname{sen}x
      \;\Longleftrightarrow\;
      \left(x^{2}y\right)'=x\operatorname{sen}x
      $$

      **Merece la pena comprobar el paso**, porque es donde se resbala: la
      derivada de $x^{2}y$ es $x^{2}y'+2xy$, que es exactamente el miembro
      izquierdo multiplicado por $x$ ✓.

      **La integral, por partes.** Con $u=x$ y
      $dv=\operatorname{sen}x\,dx$:

      $$
      \int x\operatorname{sen}x\,dx
      =-x\cos x+\int\cos x\,dx
      =-x\cos x+\operatorname{sen}x+C
      $$

      $$
      x^{2}y=-x\cos x+\operatorname{sen}x+C
      $$

      **La condición inicial.** El enunciado la escribe como
      $4\left(\frac2\pi\right)^{2}$, y no por gusto: multiplicada por
      $x^{2}=\frac{\pi^{2}}{4}$ da un número redondo.

      $$
      \frac{\pi^{2}}{4}\cdot 4\cdot\frac{4}{\pi^{2}}=4
      $$

      $$
      4=-\frac{\pi}{2}\underbrace{\cos\frac{\pi}{2}}_{0}
      +\underbrace{\operatorname{sen}\frac{\pi}{2}}_{1}+C
      \;\Longrightarrow\;
      C=3
      $$

      $$
      \boxed{\;y\left(x\right)=
      \frac{3+\operatorname{sen}x-x\cos x}{x^{2}}\;}
      $$

      **La comprobación.** En $x=\frac{\pi}{2}$:

      $$
      y\!\left(\frac{\pi}{2}\right)=\frac{3+1-0}{\pi^{2}/4}
      =\frac{16}{\pi^{2}}=4\left(\frac{2}{\pi}\right)^{2}\;\checkmark
      $$

      Y derivando la solución en un punto cualquiera, por ejemplo $x=2{,}5$:
      $xy'+2y$ sale $0{,}5985$, que es $\operatorname{sen}2{,}5$ ✓.

      **Por qué la condición $x>0$ no es decoración.** El factor integrante lleva
      un $\ln x$, y la solución un $x^{2}$ en el denominador: en $x=0$ todo se
      rompe. La ecuación original, $xy'+2y=\operatorname{sen}x$, ni siquiera
      determina $y'$ en el origen. Decir eso en el examen es uno de los tres
      puntos de COMP 4.

  - id: ex1617-ext-8-el-sistema-cruzado-de-primer-orden
    titulo: Un sistema cruzado donde una incógnita sale sola
    fuente: >-
      Ejercicio 4 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 26 de
      junio de 2017 · Cálculo. Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Resolver el siguiente problema utilizando la transformada de Laplace:

      $$
      \begin{cases}
      x'+y=2\\
      y'+x=t\\
      x\left(0\right)=1,\;y\left(0\right)=0
      \end{cases}
      $$
    pide: Las dos funciones x(t) e y(t).

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la transformada del segundo miembro de la segunda ecuación,
          $t$?
        opciones:
          - texto: $\dfrac{1}{s^{2}}$
            correcta: true
            mensaje: |
              Eso es. $\mathcal{L}\left\{t^{n}\right\}=\frac{n!}{s^{n+1}}$, y con
              $n=1$ queda $\frac{1}{s^{2}}$.
          - texto: $\dfrac{1}{s}$
            mensaje: |
              $\frac1s$ es la transformada de la constante $1$. Cada potencia de
              $t$ añade una potencia de $s$ en el denominador.
          - texto: $\dfrac{2}{s^{2}}$
            mensaje: |
              El $2!$ de la fórmula corresponde a $t^{2}$, no a $t$. Con $n=1$ el
              factorial vale $1$.

      - tipo: calcular
        titulo: El determinante del sistema
        pregunta: |
          Al transformar queda $sX+Y=\frac{s+2}{s}$ y $X+sY=\frac{1}{s^{2}}$.
          ¿Cuál es el determinante de la matriz de coeficientes, evaluado en
          $s=3$?
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '10'
            mensaje: |
              $s^{2}+1$ vale $10$ en $s=3$, pero el determinante es
              $s\cdot s-1\cdot1=s^{2}-1$: el producto cruzado se **resta**.
          - valor: '9'
            mensaje: |
              $9$ es $s^{2}$. Falta restar el producto de la diagonal secundaria,
              que vale $1$.
          - valor: '7'
            mensaje: |
              $7$ sería $s^{2}-2$, que es el determinante de otro sistema. Aquí
              los términos cruzados son los dos iguales a $1$.
        pista: |
          $\Delta=\begin{vmatrix}s & 1\\ 1 & s\end{vmatrix}$.
        desarrollo: |
          $$
          \Delta=s\cdot s-1\cdot1=s^{2}-1
          $$

          En $s=3$: $9-1=8$. Y factorizado, $\left(s-1\right)\left(s+1\right)$:
          ese $s+1$ va a cancelarse, y ahí está la gracia del ejercicio.

      - tipo: calcular
        titulo: La segunda función en t = 1
        pregunta: |
          ¿Cuánto vale $y\left(1\right)$?
        respuesta:
          tipo: numero
          valor: '-1.7182818'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '1.7182818'
            mensaje: |
              Signo. $y\left(t\right)=1-e^{t}$, y como $e^{1}>1$ el resultado es
              negativo. La $y$ se hunde en cuanto arranca.
          - valor: '2.7182818'
            mensaje: |
              $e$ es $e^{t}$ en $t=1$, pero falta el $1-$ de delante:
              $Y=\frac1s-\frac{1}{s-1}$.
          - valor: '0'
            mensaje: |
              $0$ es $y\left(0\right)$. En $t=1$ ya ha bajado.
        pista: |
          $Y=-\frac{1}{s\left(s-1\right)}=\frac1s-\frac{1}{s-1}$.
        desarrollo: |
          $$
          Y=\frac{1}{s^{2}-1}
          \begin{vmatrix}s & \frac{s+2}{s}\\[4pt] 1 & \frac{1}{s^{2}}\end{vmatrix}
          =\frac{1}{s^{2}-1}\left(\frac1s-\frac{s+2}{s}\right)
          =\frac{-\left(s+1\right)}{s\left(s^{2}-1\right)}
          $$

          El $s+1$ se cancela:

          $$
          Y=\frac{-1}{s\left(s-1\right)}=\frac1s-\frac{1}{s-1}
          \;\Longrightarrow\;
          y\left(t\right)=1-e^{t}
          $$

          $$
          y\left(1\right)=1-e\approx-1{,}7183
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Transformando con $x\left(0\right)=1$ e $y\left(0\right)=0$:
              $sX-1+Y=\frac2s$ y $sY+X=\frac{1}{s^{2}}$.
          - texto: >-
              El determinante es $s^{2}-1=\left(s-1\right)\left(s+1\right)$, y al
              despejar $Y$ el factor $s+1$ se cancela con el numerador:
              $Y=\frac{-1}{s\left(s-1\right)}$.
          - texto: >-
              Antitransformando, $y\left(t\right)=1-e^{t}$; y con
              $X=\frac{1}{s^{2}}+\frac{1}{s-1}$ sale
              $x\left(t\right)=t+e^{t}$.
          - texto: >-
              Como el determinante se anula en $s=1$ y en $s=-1$, la solución
              tiene que llevar $e^{t}$ y $e^{-t}$.
            trampa: true
            mensaje: |
              Solo sobrevive el polo que el numerador no cancela. Aquí el $s+1$
              desaparece en las dos incógnitas, así que no hay ningún $e^{-t}$ en
              la respuesta. Dar por hecho que toda raíz del denominador aparece en
              la solución es el atajo que estropea este ejercicio.
    resolucion: |
      **Transformar.** Con $\mathcal{L}\left\{x'\right\}=sX-x\left(0\right)$,
      $\mathcal{L}\left\{2\right\}=\frac2s$ y
      $\mathcal{L}\left\{t\right\}=\frac{1}{s^{2}}$:

      $$
      \begin{cases}
      sX-1+Y=\dfrac{2}{s}\\[6pt]
      sY-0+X=\dfrac{1}{s^{2}}
      \end{cases}
      \;\Longrightarrow\;
      \begin{cases}
      sX+Y=\dfrac{s+2}{s}\\[6pt]
      X+sY=\dfrac{1}{s^{2}}
      \end{cases}
      $$

      **Resolver.** El determinante es

      $$
      \Delta=s^{2}-1=\left(s-1\right)\left(s+1\right)
      $$

      *Para $Y$:*

      $$
      Y=\frac{1}{\Delta}\left(s\cdot\frac{1}{s^{2}}-1\cdot\frac{s+2}{s}\right)
      =\frac{1}{\Delta}\cdot\frac{1-\left(s+2\right)}{s}
      =\frac{-\left(s+1\right)}{s\left(s-1\right)\left(s+1\right)}
      $$

      El $s+1$ se cancela:

      $$
      Y=\frac{-1}{s\left(s-1\right)}=\frac{1}{s}-\frac{1}{s-1}
      \;\Longrightarrow\;
      \boxed{\;y\left(t\right)=1-e^{t}\;}
      $$

      *Para $X$:*

      $$
      X=\frac{1}{\Delta}\left(\frac{s+2}{s}\cdot s-\frac{1}{s^{2}}\right)
      =\frac{\left(s+2\right)-\frac{1}{s^{2}}}{s^{2}-1}
      =\frac{s^{3}+2s^{2}-1}{s^{2}\left(s^{2}-1\right)}
      $$

      El numerador se anula en $s=-1$ —$-1+2-1=0$—, así que el $s+1$ vuelve a
      salir:

      $$
      s^{3}+2s^{2}-1=\left(s+1\right)\left(s^{2}+s-1\right)
      \;\Longrightarrow\;
      X=\frac{s^{2}+s-1}{s^{2}\left(s-1\right)}
      $$

      Y en fracciones simples:

      $$
      \frac{s^{2}+s-1}{s^{2}\left(s-1\right)}
      =\frac{A}{s}+\frac{B}{s^{2}}+\frac{C}{s-1}
      $$

      | se hace | sale |
      |---|---|
      | $s=0$ | $-1=-B\;\Rightarrow\;B=1$ |
      | $s=1$ | $1=C$ |
      | coeficiente de $s^{2}$ | $1=A+C\;\Rightarrow\;A=0$ |

      $$
      X=\frac{1}{s^{2}}+\frac{1}{s-1}
      \;\Longrightarrow\;
      \boxed{\;x\left(t\right)=t+e^{t}\;}
      $$

      **Las comprobaciones**, que valen los dos puntos de COMP 4:

      | qué | cuenta |
      |---|---|
      | $x\left(0\right)$ | $0+1=1$ ✓ |
      | $y\left(0\right)$ | $1-1=0$ ✓ |
      | $x'+y$ | $\left(1+e^{t}\right)+\left(1-e^{t}\right)=2$ ✓ |
      | $y'+x$ | $-e^{t}+\left(t+e^{t}\right)=t$ ✓ |

      **Lo que enseña.** El determinante $s^{2}-1$ tiene dos raíces, y la
      tentación es escribir una solución con $e^{t}$ y $e^{-t}$. Pero el $s+1$ se
      cancela en las dos incógnitas, y de la solución desaparece por completo: no
      hay ningún $e^{-t}$.

      Y las exponenciales que quedan se cancelan entre sí al sumarlas —$x'+y=2$
      es constante—, que es la señal de que el sistema estaba construido para que
      la respuesta saliera limpia.
