          .so17-r { fill: var(--live); fill-opacity: .15; stroke: var(--live); stroke-width: 2.6; }
          .so17-e { stroke: var(--faint); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
          .so17-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
