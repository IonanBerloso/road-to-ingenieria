      <figcaption>
      Las dos secantes desde el máximo. La de la izquierda tiene pendiente no
      negativa y la de la derecha no positiva, y las dos son cocientes
      incrementales: al acercar los puntos, sus límites atrapan a h′(x₀) entre 0 y
      0.
      </figcaption>
      </figure>

      **Dos avisos que se agradecen en la corrección.**

      - **El paso al límite conserva el $\le$, no el $<$.** Aunque el cociente
        fuese estrictamente negativo para todo $t>0$, del límite solo se puede
        concluir $\le0$. Aquí da igual, pero escribir $<$ ahí es un error.
      - **El recíproco es falso.** Que $h'\left(x_{0}\right)=0$ no da máximo:
        $h\left(x\right)=x^{3}$ en el origen. Este teorema solo sirve para
        **buscar** candidatos, no para clasificarlos.

      **Por qué este ejercicio vale diez puntos de COMP 4 y cero de cálculo.** No
      hay ninguna cuenta. Lo que se puntúa es escribir la definición de máximo
      local con su $\delta$, distinguir los dos límites laterales, justificar por
      qué coinciden y cerrar con la antisimetría. Es el ejercicio más puro de
      COMP 4 del corpus, y el mismo teorema ha caído al menos tres veces.

  - id: ex1617-ext-4-la-integral-que-no-existe
    titulo: Una integral que se calcula, y otra que no existe
    fuente: >-
      Ejercicio 4 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 26 de
      junio de 2017 · Cálculo. Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      a) Calcular $\displaystyle\int\frac{x^{2}+5}{x^{3}-2x^{2}+x}\,dx$

      b) Calcular $\displaystyle\int_{-1}^{1}\frac{x^{2}+5}{x^{3}-2x^{2}+x}\,dx$
    pide: La primitiva, y el valor de la integral definida.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se descompone el denominador $x^{3}-2x^{2}+x$?
        opciones:
          - texto: $x\left(x-1\right)^{2}$, con una raíz simple y una doble
            correcta: true
            mensaje: |
              Eso es. Sacando $x$ factor común queda $x^{2}-2x+1$, que es un
              cuadrado perfecto. La raíz doble obliga a poner **dos** fracciones
              para el mismo factor.
          - texto: $x\left(x-1\right)\left(x+1\right)$
            mensaje: |
              Eso sería $x^{3}-x$. Aquí el término central es $-2x^{2}$, y el
              trinomio $x^{2}-2x+1$ tiene la raíz $1$ **doble**.
          - texto: >-
              $x\left(x^{2}-2x+1\right)$, y como el segundo factor no tiene
              raíces reales se deja tal cual
            mensaje: |
              Sí las tiene: $x^{2}-2x+1=\left(x-1\right)^{2}$, con
              discriminante cero. Dejarlo sin factorizar lleva a una
              descomposición imposible.

      - tipo: calcular
        titulo: El coeficiente del término dominante
        pregunta: |
          En $\frac{x^{2}+5}{x\left(x-1\right)^{2}}
          =\frac{A}{x}+\frac{B}{x-1}+\frac{C}{\left(x-1\right)^{2}}$,
          ¿cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '5'
            mensaje: |
              $5$ es $A$, el que sale al hacer $x=0$. Para $C$ hay que hacer
              $x=1$: el numerador vale $1+5=6$ y el factor que queda es $x=1$.
          - valor: '-4'
            mensaje: |
              $-4$ es $B$, que sale de igualar coeficientes de $x^{2}$ una vez
              conocidos $A$ y $C$.
          - valor: '1'
            mensaje: |
              El $1$ es el coeficiente de $x^{2}$ del numerador, no el de la
              fracción. $C$ se obtiene multiplicando por
              $\left(x-1\right)^{2}$ y evaluando en $x=1$.
        pista: |
          Multiplica los dos lados por $\left(x-1\right)^{2}$ y haz $x=1$.
        desarrollo: |
          $$
          x^{2}+5=A\left(x-1\right)^{2}+Bx\left(x-1\right)+Cx
          $$

          | se hace | sale |
          |---|---|
          | $x=0$ | $5=A$ |
          | $x=1$ | $6=C$ |
          | coeficiente de $x^{2}$ | $1=A+B\Rightarrow B=-4$ |

      - tipo: calcular
        titulo: Una integral que sí existe
        pregunta: |
          Sobre un intervalo sin polos, la primitiva sirve. ¿Cuánto vale
          $\displaystyle\int_{2}^{3}\frac{x^{2}+5}{x^{3}-2x^{2}+x}\,dx$?
        respuesta:
          tipo: numero
          valor: '2.2547'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '-2.2547'
            mensaje: |
              Signo: has restado al revés. Barrow es
              $F\left(\text{arriba}\right)-F\left(\text{abajo}\right)$, y aquí el
              integrando es positivo en $\left[2,3\right]$, así que la integral
              tiene que salir positiva.
          - valor: '-0.7453'
            mensaje: |
              Te has dejado el término $-\frac{6}{x-1}$. Solo con los dos
              logaritmos sale $5\ln3-9\ln2=-0{,}745$, y encima negativo, que ya
              avisa de que falta algo.
          - valor: '-3.7453'
            mensaje: |
              Signo del tercer término. $\int\frac{6}{\left(x-1\right)^{2}}dx
              =-\frac{6}{x-1}$, con menos: la primitiva de $u^{-2}$ es
              $-u^{-1}$.
        pista: |
          $F\left(3\right)=5\ln3-4\ln2-3$ y $F\left(2\right)=5\ln2-6$.
        desarrollo: |
          $$
          F\left(2\right)=5\ln2-4\ln1-\frac61=5\ln2-6\approx-2{,}5343
          $$

          $$
          F\left(3\right)=5\ln3-4\ln2-\frac62\approx-0{,}2795
          $$

          $$
          \int_{2}^{3}=F\left(3\right)-F\left(2\right)
          =5\ln3-9\ln2+3\approx2{,}2547
          $$

          En $\left[2,3\right]$ no hay ningún polo —los dos están en $0$ y en
          $1$—, así que aquí Barrow sí se puede aplicar. Y el resultado sale
          positivo, como tiene que ser: el integrando lo es en todo el intervalo.

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              El integrando es $\frac{x^{2}+5}{x\left(x-1\right)^{2}}$, que no
              está definido en $x=0$ ni en $x=1$.
          - texto: >-
              El intervalo $\left[-1,1\right]$ contiene el $0$ en su interior y
              el $1$ como extremo: hay dos puntos donde el integrando se dispara.
          - texto: >-
              Cerca de $x=0$ el integrando se comporta como $\frac5x$, cuya
              integral impropia diverge, así que **la integral del apartado b) no
              existe**.
          - texto: >-
              Como la primitiva $F$ está definida en $-1$ y en $1$, basta con
              aplicar la regla de Barrow: $F\left(1\right)-F\left(-1\right)$.
            trampa: true
            mensaje: |
              $F$ tampoco está definida en $x=1$ —tiene un $\ln\left|x-1\right|$
              y un $\frac{6}{x-1}$—, pero el fallo de fondo es otro: **Barrow
              exige que el integrando sea continuo en todo el intervalo cerrado**.
              Aplicar Barrow con una discontinuidad no acotada en medio produce un
              número, y ese número no significa nada. Es el error más caro de este
              ejercicio.
    resolucion: |
      **a) La primitiva.** Lo primero es factorizar el denominador, y sale un
      cuadrado perfecto:

      $$
      x^{3}-2x^{2}+x=x\left(x^{2}-2x+1\right)=x\left(x-1\right)^{2}
      $$

      Raíz simple en $0$ y **doble** en $1$, así que la descomposición lleva tres
      fracciones:

      $$
      \frac{x^{2}+5}{x\left(x-1\right)^{2}}
      =\frac{A}{x}+\frac{B}{x-1}+\frac{C}{\left(x-1\right)^{2}}
      $$

      $$
      x^{2}+5=A\left(x-1\right)^{2}+Bx\left(x-1\right)+Cx
      $$

      | se hace | sale |
      |---|---|
      | $x=0$ | $5=A$ |
      | $x=1$ | $6=C$ |
      | coeficiente de $x^{2}$ | $1=A+B\;\Rightarrow\;B=-4$ |

      $$
      \frac{x^{2}+5}{x\left(x-1\right)^{2}}
      =\frac{5}{x}-\frac{4}{x-1}+\frac{6}{\left(x-1\right)^{2}}
      $$

      Los tres términos se integran de vista, y el tercero **no** da logaritmo:

      $$
      \boxed{\;\int\frac{x^{2}+5}{x^{3}-2x^{2}+x}\,dx
      =5\ln\left|x\right|-4\ln\left|x-1\right|-\frac{6}{x-1}+K\;}
      $$

      **La comprobación**, que en las fracciones simples es barata: se evalúa la
      descomposición y el original en un punto cualquiera. En $x=2$ los dos dan
      $\frac92$; en $x=-1$, los dos dan $-\frac32$.

      **b) La que no existe.** Aquí la respuesta no es un número.

      El integrando tiene **dos** puntos malos y los dos caen en el intervalo:
      $x=0$ está dentro y $x=1$ es el extremo derecho. Cerca del cero el
      integrando se comporta como

      $$
      \frac{x^{2}+5}{x\left(x-1\right)^{2}}\approx\frac{5}{x}
      $$

      y $\int\frac{dx}{x}$ diverge en el origen. Con el criterio de comparación
      basta, pero también se ve calculando:

      $$
      \int_{-1}^{-\varepsilon}
      \xrightarrow[\varepsilon\to0^{+}]{}\;-\infty
      $$

      | $\varepsilon$ | $\int_{-1}^{-\varepsilon}$ |
      |---|---|
      | $0{,}1$ | $-6{,}67$ |
      | $0{,}01$ | $-17{,}35$ |
      | $0{,}001$ | $-28{,}78$ |
      | $0{,}0001$ | $-40{,}28$ |

      $$
      \boxed{\;\text{la integral del apartado b) es divergente: no existe}\;}
      $$

      **El error que este apartado está buscando.** La primitiva del apartado a)
      está ahí, tentando: se evalúa en $-1$ y en $1$ y sale un número. Pero
      **Barrow exige continuidad en todo el intervalo cerrado**, y aquí el
      integrando ni siquiera está definido en dos de sus puntos. El número que
      saldría no sería el área de nada.

      Es el mismo motivo por el que $\int_{-1}^{1}\frac{dx}{x^{2}}$ no vale
      $-2$ —que es lo que da Barrow a lo bruto— sino que diverge a $+\infty$: un
      integrando positivo no puede dar una integral negativa, y esa
      contradicción es la señal de alarma.

      **Cómo se escribe la respuesta.** No basta con «diverge»: hay que decir
      **dónde** —en $x=0$, y también en $x=1$— y **por qué** —comparación con
      $\frac1x$—. Son los dos puntos de COMP 4.

  - id: ex1617-ext-5-el-cilindro-dentro-de-la-esfera
    titulo: Un cilindro dentro de una esfera, y dónde está su centro
    fuente: >-
      Ejercicio 1 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 26 de
      junio de 2017 · Cálculo. Industriales, UPV/EHU · Es el mismo sólido que el
      ejercicio 1 del segundo cuatrimestral de la extraordinaria de 2020-2021,
      con otros radios y girado de eje · El examen no publica solución: la
      resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea el sólido limitado por las condiciones $x^{2}+y^{2}\le1$;
      $x^{2}+y^{2}+z^{2}\le5$; $z\ge0$.

      a) Dibujar el sólido y calcular su volumen.

      b) Calcular las coordenadas del centro de gravedad del sólido.
    pide: El dibujo, el volumen y el centro de gravedad.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué forma tiene la tapa de arriba del sólido?
        opciones:
          - texto: >-
              Un casquete esférico: la esfera es más ancha que el cilindro, así
              que lo corta por arriba
            correcta: true
            mensaje: |
              Eso es. El cilindro tiene radio $1$ y la esfera $\sqrt5\approx2{,}24$:
              la pared lateral la pone el cilindro y el techo, la esfera. En el
              eje llega a $\sqrt5$ y en el borde a $\sqrt{5-1}=2$.
          - texto: >-
              Plana, a la altura $\sqrt{5}$
            mensaje: |
              La altura depende de la distancia al eje: $z=\sqrt{5-r^{2}}$. Solo
              en el eje vale $\sqrt5$.
          - texto: >-
              Cónica, porque la esfera corta al cilindro en una circunferencia
            mensaje: |
              La cortan en una circunferencia, sí, pero lo que queda por encima
              es un casquete **curvo**, no un cono. Un cono saldría de
              $x^{2}+y^{2}=\left(z-c\right)^{2}$.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen del sólido?
        respuesta:
          tipo: numero
          valor: '6.6609'
          tolerancia: 0.01
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '13.3218'
            mensaje: |
              Eso es el doble: el sólido completo, sin la condición $z\ge0$. El
              enunciado se queda con la mitad de arriba.
          - valor: '6.2832'
            mensaje: |
              $2\pi$ es el cilindro con la tapa **plana** a la altura
              $\sqrt{5-1}=2$. La tapa no es plana: en el eje sube hasta
              $\sqrt5$.
          - valor: '23.4137'
            mensaje: |
              $\frac{2}{3}\pi\left(\sqrt5\right)^{3}$ es la media esfera entera,
              sin recortar con el cilindro.
        pista: |
          $V=2\pi\int_{0}^{1}r\sqrt{5-r^{2}}\;dr$, con el cambio $u=5-r^{2}$.
        desarrollo: |
          $$
          V=\int_{0}^{2\pi}\!\!\int_{0}^{1}\!\!\int_{0}^{\sqrt{5-r^{2}}}
          r\,dz\,dr\,d\theta
          =2\pi\int_{0}^{1}r\sqrt{5-r^{2}}\;dr
          $$

          $$
          =2\pi\left[-\frac13\left(5-r^{2}\right)^{3/2}\right]_{0}^{1}
          =\frac{2\pi}{3}\left(5\sqrt5-8\right)\approx6{,}661
          $$

          porque $5^{3/2}=5\sqrt5$ y $4^{3/2}=8$.

      - tipo: calcular
        titulo: La altura del centro de gravedad
        pregunta: |
          ¿Cuánto vale $\overline{z}$?
        respuesta:
          tipo: numero
          valor: '1.0612'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.8385'
            mensaje: |
              $\frac{3\sqrt5}{8}$ es el centroide de una **media esfera** maciza
              de radio $\sqrt5$. Aquí el cilindro recorta lo ancho de abajo, que
              es lo que tiraba del centro hacia el suelo, y el resultado sube.
          - valor: '1.1180'
            mensaje: |
              $\frac{\sqrt5}{2}$ es la mitad de la altura máxima. El sólido no es
              simétrico respecto de esa altura: se estrecha arriba.
          - valor: '2.1224'
            mensaje: |
              Ese es el doble. Al integrar $\int_{0}^{h}z\,dz$ sale
              $\frac{h^{2}}{2}$, y se te ha quedado $h^{2}$.
        pista: |
          $\int_{0}^{\sqrt{5-r^{2}}}z\,dz=\frac{5-r^{2}}{2}$.
        desarrollo: |
          $$
          \int z\,dV=2\pi\int_{0}^{1}\frac{5-r^{2}}{2}\,r\,dr
          =\pi\int_{0}^{1}\left(5r-r^{3}\right)dr
          =\pi\left(\frac52-\frac14\right)=\frac{9\pi}{4}
          $$

          $$
          \overline{z}=\frac{9\pi/4}{\frac{2\pi}{3}\left(5\sqrt5-8\right)}
          =\frac{27}{8\left(5\sqrt5-8\right)}\approx1{,}0612
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Por simetría de revolución alrededor de OZ,
              $\overline{x}=\overline{y}=0$: solo hay una coordenada que
              calcular.
          - texto: >-
              En cilíndricas el sólido es $0\le r\le1$, $0\le\theta\le2\pi$,
              $0\le z\le\sqrt{5-r^{2}}$, y
              $V=\frac{2\pi}{3}\left(5\sqrt5-8\right)$.
          - texto: >-
              $\int z\,dV=\frac{9\pi}{4}$, así que
              $\overline{z}=\frac{27}{8\left(5\sqrt5-8\right)}\approx1{,}06$.
          - texto: >-
              Como el radio del cilindro es $1$ y el de la esfera $\sqrt5$, hay
              que restar al volumen de la media esfera el del cilindro que sobra.
            trampa: true
            mensaje: |
              No sobra nada que restar: el sólido es la **intersección** de los
              dos, no una diferencia. Restar volúmenes daría un número negativo,
              porque la media esfera de radio $\sqrt5$ mide $23{,}4$ y el sólido
              solo $6{,}66$. Las condiciones del enunciado son todas del tipo
              «$\le$», y eso siempre significa intersección.
    resolucion: |
      **a) Qué sólido es.** Tres condiciones, y conviene leerlas por separado:

      | condición | qué es |
      |---|---|
      | $x^{2}+y^{2}\le1$ | dentro de un **cilindro** de radio $1$ y eje OZ |
      | $x^{2}+y^{2}+z^{2}\le5$ | dentro de la **esfera** de radio $\sqrt5$ |
      | $z\ge0$ | solo la mitad de arriba |

      Como $1<\sqrt5$, el cilindro es más estrecho: la pared lateral la pone él y
      el techo lo pone la esfera. Es **un cilindro con la tapa abombada**. En el
      borde, $r=1$, el techo está a $z=\sqrt{5-1}=2$; en el eje llega hasta
      $\sqrt5\approx2{,}24$.

      <figure class="figura-examen">
      <svg viewBox="0 0 305 240" role="img" width="305" height="240"
           aria-labelledby="so17-t so17-d">
        <title id="so17-t">Seccion del solido: cilindro estrecho con tapa esferica</title>
        <desc id="so17-d">Media circunferencia de radio raiz de cinco apoyada en el eje
        horizontal, y dentro de ella una franja vertical de anchura dos centrada en el
        eje. La region sombreada es la interseccion: un rectangulo rematado arriba por un
        trozo de arco.</desc>
