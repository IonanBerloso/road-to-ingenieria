      Las tres ramas de f, separadas por las asíntotas x = ±1. Cada una sube, pero
      la función no es creciente en todo su dominio: f(−2) = 2/3 queda por encima de
      f(0) = 0. La recta y = x es la tangente en el origen.
      </figcaption>
      </figure>

      **La lectura del dibujo.** Las tres ramas suben, cada una por su cuenta, y
      entre ellas la función «reaparece» desde $-\infty$. Esa es la imagen de por
      qué la derivada positiva no basta para decir «creciente»: la función sube
      dentro de cada tramo y se despeña al pasar de uno a otro.

  - id: ex1617-ext-3-por-que-la-derivada-se-anula-en-un-maximo
    titulo: Por qué la derivada se anula en un máximo
    fuente: >-
      Ejercicio 3 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 26 de
      junio de 2017 · Cálculo. Industriales, UPV/EHU · El mismo teorema, con
      otras palabras, cayó en la segunda evaluación de 2019-2020 y en la de
      2016-2017 · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 0
      comp4: 10
    enunciado: |
      Demostrar que si la función $h\left(x\right)$ es derivable y tiene un
      máximo en $x_{0}$ entonces $h'\left(x_{0}\right)=0$.
    pide: La demostración del teorema de Fermat.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la idea de la demostración?
        opciones:
          - texto: >-
              Acotar el cociente incremental por los dos lados: por la derecha
              sale $\le0$ y por la izquierda $\ge0$, y como el límite existe y es
              único, vale $0$
            correcta: true
            mensaje: |
              Eso es. El numerador $h\left(x_{0}+t\right)-h\left(x_{0}\right)$ es
              $\le0$ por ser máximo, y el signo del cociente lo decide el
              denominador. La derivabilidad es la que obliga a los dos límites
              laterales a coincidir.
          - texto: >-
              Aplicar el teorema del valor medio en un entorno de $x_{0}$
            mensaje: |
              El valor medio se demuestra **a partir** de este resultado, vía el
              teorema de Rolle. Usarlo aquí sería circular.
          - texto: >-
              Desarrollar $h$ por Taylor y ver que el término lineal se anula
            mensaje: |
              Taylor de orden 1 con resto necesita ya la derivada, y el
              argumento de que el término lineal se anula **es** lo que hay que
              demostrar. Otra vez circular.

      - tipo: calcular
        titulo: El valor de la derivada
        pregunta: |
          Si el cociente incremental está acotado por $\le0$ por un lado y por
          $\ge0$ por el otro, ¿cuánto vale $h'\left(x_{0}\right)$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              El único número que es a la vez $\le0$ y $\ge0$ es el cero.
          - valor: '-1'
            mensaje: |
              $-1$ cumple $\le0$ pero no $\ge0$. Los dos límites laterales tienen
              que coincidir porque $h$ es derivable.
        pista: |
          ¿Qué número real cumple a la vez $a\le0$ y $a\ge0$?
        desarrollo: |
          $$
          h'\left(x_{0}\right)\le0
          \quad\text{y}\quad
          h'\left(x_{0}\right)\ge0
          \;\Longrightarrow\;
          h'\left(x_{0}\right)=0
          $$

          Es la propiedad antisimétrica del orden en $\mathbb{R}$, y conviene
          nombrarla: es el paso que cierra la demostración.

      - tipo: justificar
        pregunta: Ordena la demostración. Una pieza es falsa.
        piezas:
          - texto: >-
              Como $h$ tiene un máximo local en $x_{0}$, existe $\delta>0$ tal
              que $h\left(x_{0}+t\right)\le h\left(x_{0}\right)$ para
              $\left|t\right|<\delta$: el numerador del cociente incremental es
              $\le0$.
          - texto: >-
              Para $0<t<\delta$ el denominador es positivo, así que el cociente
              es $\le0$, y su límite —que existe por hipótesis— cumple
              $h'\left(x_{0}\right)\le0$.
          - texto: >-
              Para $-\delta<t<0$ el denominador es negativo, así que el cociente
              es $\ge0$ y $h'\left(x_{0}\right)\ge0$.
          - texto: >-
              Como el máximo es el mayor valor de $h$, la función es creciente
              antes de $x_{0}$ y decreciente después, y eso obliga a que la
              derivada se anule.
            trampa: true
            mensaje: |
              Suena a lo mismo y no lo es. Que haya un máximo **no** implica que
              $h$ sea monótona a cada lado: puede oscilar acercándose, como
              $h\left(x\right)=-x^{2}\left(2+\operatorname{sen}\frac1x\right)$
              cerca del origen. La demostración correcta no necesita monotonía
              ninguna: solo la desigualdad puntual del numerador.
    resolucion: |
      **El enunciado, y una hipótesis que se calla.** Tal como está escrito falta
      decir que $x_{0}$ es un punto **interior** del dominio. Si no, el resultado
      es falso: $h\left(x\right)=-x$ en $\left[0,1\right]$ tiene su máximo en
      $x=0$ y $h'\left(0\right)=-1$. Conviene empezar la demostración diciéndolo:
      es un punto de COMP 4 gratis, y este ejercicio es COMP 4 entero.

      **La demostración.** Sea $x_{0}$ interior, $h$ derivable en $x_{0}$ y con
      un máximo local ahí. Por definición de máximo local, existe $\delta>0$ tal
      que

      $$
      h\left(x_{0}+t\right)\le h\left(x_{0}\right)
      \qquad\text{para todo }\left|t\right|<\delta
      $$

      es decir, **el numerador del cociente incremental nunca es positivo**:

      $$
      h\left(x_{0}+t\right)-h\left(x_{0}\right)\le0
      $$

      Todo lo demás lo decide el signo del denominador.

      **Por la derecha**, con $0<t<\delta$:

      $$
      \frac{h\left(x_{0}+t\right)-h\left(x_{0}\right)}{t}\le0
      \;\Longrightarrow\;
      h'\left(x_{0}\right)=\lim_{t\to0^{+}}
      \frac{h\left(x_{0}+t\right)-h\left(x_{0}\right)}{t}\le0
      $$

      **Por la izquierda**, con $-\delta<t<0$, el denominador es negativo y la
      desigualdad se da la vuelta:

      $$
      \frac{h\left(x_{0}+t\right)-h\left(x_{0}\right)}{t}\ge0
      \;\Longrightarrow\;
      h'\left(x_{0}\right)=\lim_{t\to0^{-}}
      \frac{h\left(x_{0}+t\right)-h\left(x_{0}\right)}{t}\ge0
      $$

      Los dos límites son el mismo número, porque $h$ es derivable en $x_{0}$ y
      eso significa exactamente que los dos laterales existen y coinciden. Y un
      número real que es a la vez $\le0$ y $\ge0$ solo puede ser uno:

      $$
      \boxed{\;h'\left(x_{0}\right)=0\;}
      $$

      <figure class="figura-examen">
      <svg viewBox="0 0 315 250" role="img" width="315" height="250"
