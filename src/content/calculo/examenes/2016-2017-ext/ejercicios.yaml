        <g class="cos17-n">
          <text x="268.1" y="114" text-anchor="middle">2π</text>
          <text x="41.9" y="114" text-anchor="middle">−2π</text>
          <text x="302.6" y="93" text-anchor="end">Re</text>
          <text x="161" y="50.6">Im</text>
        </g>
        <text class="cos17-l" x="302.6" y="73.7" text-anchor="end" fill="var(--alt)">Im z = ln(5 + 2√6) ≈ 2,292</text>
        <text class="cos17-l" x="302.6" y="134.3" text-anchor="end" fill="var(--alt)">Im z = −ln(5 + 2√6)</text>
        <text class="cos17-l" x="211.5" y="44.7" text-anchor="middle" fill="var(--flag)">2π</text>
      </svg>
      <figcaption>
      Las soluciones de cos z = 5. Dos filas horizontales infinitas, a altura más y
      menos ln(5+2√6), con los puntos separados por 2π dentro de cada fila. Ninguna
      cae sobre el eje real: la ecuación no tiene solución en los reales.
      </figcaption>
      </figure>

      **La comprobación, que se hace sin calculadora.** Para $z=bi$ con
      $b=\ln\left(5+2\sqrt6\right)$:

      $$
      \cos\left(bi\right)=\cosh b=\frac{e^{b}+e^{-b}}{2}
      =\frac{\left(5+2\sqrt6\right)+\left(5-2\sqrt6\right)}{2}
      =\frac{10}{2}=5\;\checkmark
      $$

      Los radicales se cancelan solos. Que la comprobación salga tan limpia no es
      casualidad: es la misma relación de inversas de antes, vista desde el otro
      lado.

      **Una forma alternativa de escribirlo.** Como
      $\ln\left(5+2\sqrt6\right)=\operatorname{arccosh}5$, la respuesta se puede
      dar como $z=2k\pi\pm i\operatorname{arccosh}5$. Es la misma, y deja ver de
      un vistazo de dónde sale el $5$.

  - id: ex1617-ext-2-la-que-crece-siempre-sin-tener-extremos
    titulo: Una función que crece siempre y no tiene ni un extremo
    fuente: >-
      Ejercicio 2 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 26 de
      junio de 2017 · Cálculo. Industriales, UPV/EHU · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 3
      comp4: 6
    enunciado: |
      Sea la función $f\left(x\right)=\dfrac{x}{1-x^{2}}$.

      a) Calcular el dominio de definición de $f\left(x\right)$. ¿En qué
      intervalos es creciente?

      b) Razonar si tiene máximos y mínimos. En caso afirmativo hallarlos.

      c) Calcular la recta tangente a dicha curva en el punto de abscisa $x=0$.

      d) Representar gráficamente $f\left(x\right)$.
    pide: Dominio, crecimiento, extremos, la tangente en el origen y la gráfica.

    pasos:
      - tipo: reconocer
        pregunta: |
          Si $f'\left(x\right)>0$ en todo el dominio, ¿qué se puede afirmar?
        opciones:
          - texto: >-
              Que $f$ crece en cada **intervalo** del dominio, pero no que crezca
              de un intervalo al siguiente
            correcta: true
            mensaje: |
              Ese es el matiz que vale los puntos aquí. El dominio es
              $\left(-\infty,-1\right)\cup\left(-1,1\right)\cup\left(1,\infty\right)$,
              tres intervalos sueltos, y el teorema del valor medio solo se
              aplica **dentro** de cada uno.
          - texto: >-
              Que $f$ es creciente en todo su dominio, sin más
            mensaje: |
              Suena bien y es falso aquí: $f\left(-2\right)=\frac23$ y
              $f\left(0\right)=0$, con $-2<0$. Entre dos intervalos separados por
              una asíntota la función puede bajar.
          - texto: Que $f$ no está acotada
            mensaje: |
              Eso es cierto en este caso, pero no se deduce del signo de la
              derivada: $\arctan x$ tiene derivada positiva en todo $\mathbb{R}$
              y está acotada.

      - tipo: calcular
        titulo: La derivada en el origen
        pregunta: |
          ¿Cuánto vale $f'\left(0\right)$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Si valiese cero habría tangente horizontal, y la curva pasa por el
              origen inclinada. $f'=\frac{1+x^{2}}{\left(1-x^{2}\right)^{2}}$, y
              en $0$ eso es $\frac11$.
          - valor: '-1'
            mensaje: |
              Signo. En la regla del cociente el segundo término es
              $-x\cdot\left(-2x\right)=+2x^{2}$: los dos menos se cancelan.
          - valor: '2'
            mensaje: |
              El $2$ del $2x^{2}$ se queda en el numerador junto al $1-x^{2}$,
              pero en $x=0$ ese término se anula. Queda $\frac{1}{1}$.
        pista: |
          $f'\left(x\right)=\frac{\left(1-x^{2}\right)-x\left(-2x\right)}
          {\left(1-x^{2}\right)^{2}}$.
        desarrollo: |
          $$
          f'\left(x\right)
          =\frac{\left(1-x^{2}\right)\cdot1-x\cdot\left(-2x\right)}
          {\left(1-x^{2}\right)^{2}}
          =\frac{1-x^{2}+2x^{2}}{\left(1-x^{2}\right)^{2}}
          =\frac{1+x^{2}}{\left(1-x^{2}\right)^{2}}
          $$

          $$
          f'\left(0\right)=\frac{1}{1}=1
          $$

      - tipo: calcular
        titulo: El número de extremos
        pregunta: |
          ¿Cuántos máximos o mínimos locales tiene $f$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              Los dos puntos $x=\pm1$ no son extremos: no están en el dominio.
              Ahí hay asíntotas verticales, no picos.
          - valor: '1'
            mensaje: |
              El origen tampoco lo es: $f'\left(0\right)=1\neq0$, y además la
              función pasa de negativa a positiva creciendo.
          - valor: '3'
            mensaje: |
              No hay ningún punto donde $f'$ se anule. El numerador $1+x^{2}$ es
              siempre estrictamente positivo.
        pista: |
          ¿Puede anularse $\frac{1+x^{2}}{\left(1-x^{2}\right)^{2}}$?
        desarrollo: |
          El numerador $1+x^{2}\ge1>0$ y el denominador es un cuadrado, positivo
          en todo el dominio. Así que $f'>0$ **siempre** y no se anula nunca:

          $$
          \boxed{\;f\text{ no tiene ningún extremo}\;}
          $$

      - tipo: justificar
        pregunta: Ordena el apartado a). Una pieza es falsa.
        piezas:
          - texto: >-
              El denominador se anula en $x=\pm1$, así que el dominio es
              $\mathbb{R}\setminus\left\{-1,1\right\}$.
          - texto: >-
              $f'\left(x\right)=\frac{1+x^{2}}{\left(1-x^{2}\right)^{2}}$, con
              numerador y denominador estrictamente positivos: $f'>0$ en todo el
              dominio.
          - texto: >-
              Por tanto $f$ es creciente en cada uno de los tres intervalos
              $\left(-\infty,-1\right)$, $\left(-1,1\right)$ y
              $\left(1,+\infty\right)$.
          - texto: >-
              Y como crece en los tres, es creciente en todo su dominio.
            trampa: true
            mensaje: |
              No. «Creciente» exige que $a<b$ implique $f(a)<f(b)$ para
              **cualesquiera** dos puntos del dominio, y aquí falla en cuanto se
              cruza una asíntota: $f\left(-2\right)=\frac23>0=f\left(0\right)$
              con $-2<0$. El teorema «derivada positiva implica creciente» pide
              que el conjunto sea un **intervalo**, y este dominio no lo es.
    resolucion: |
      **a) Dominio y crecimiento.** El denominador $1-x^{2}$ se anula en
      $x=\pm1$:

      $$
      \operatorname{Dom}f=\mathbb{R}\setminus\left\{-1,\,1\right\}
      =\left(-\infty,-1\right)\cup\left(-1,1\right)\cup\left(1,+\infty\right)
      $$

      La derivada, por la regla del cociente:

      $$
      f'\left(x\right)
      =\frac{\left(1-x^{2}\right)-x\left(-2x\right)}{\left(1-x^{2}\right)^{2}}
      =\frac{1+x^{2}}{\left(1-x^{2}\right)^{2}}
      $$

      Numerador $\ge1$ y denominador un cuadrado: **$f'>0$ en todo el dominio**.
      Luego $f$ crece en cada uno de los tres intervalos.

      **Y aquí está el punto fino del ejercicio**, que es donde se van los seis
      puntos de COMP 4: **no** es cierto que $f$ sea creciente en todo su
      dominio, porque el dominio no es un intervalo. Un contraejemplo de una
      línea:

      $$
      -2<0
      \qquad\text{y sin embargo}\qquad
      f\left(-2\right)=\frac{-2}{1-4}=\frac23>0=f\left(0\right)
      $$

      **b) Extremos.** Un extremo local de una función derivable exige
      $f'=0$ (Fermat), y aquí $f'$ no se anula nunca. Los puntos $x=\pm1$
      tampoco valen: no pertenecen al dominio.

      $$
      \boxed{\;f\text{ no tiene ni máximos ni mínimos}\;}
      $$

      **c) La tangente en el origen.** $f\left(0\right)=0$ y
      $f'\left(0\right)=1$:

      $$
      \boxed{\;y=x\;}
      $$

      **d) La gráfica.** Lo que hay que decir antes de dibujar:

      | | |
      |---|---|
      | simetría | $f\left(-x\right)=-f\left(x\right)$: **impar**, simétrica respecto del origen |
      | asíntotas verticales | $x=-1$ y $x=1$ |
      | asíntota horizontal | $y=0$, porque el grado de abajo es mayor |
      | corte con los ejes | solo el origen |
      | signo | $f>0$ en $\left(-\infty,-1\right)$ y en $\left(0,1\right)$ |

      Los límites laterales, que deciden hacia dónde se va cada rama:

      $$
      \lim_{x\to1^{-}}f=+\infty,\quad
      \lim_{x\to1^{+}}f=-\infty,\quad
      \lim_{x\to-1^{-}}f=+\infty,\quad
      \lim_{x\to-1^{+}}f=-\infty
      $$

