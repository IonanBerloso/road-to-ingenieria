ejercicios:
  - id: ex2526-2ev-1-composicion-de-dos-graficas
    titulo: Una composición leída en dos gráficas
    fuente: >-
      Ejercicio 1 · Segunda evaluación, 1 de diciembre de 2025 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3

    # Las dos gráficas son del enunciado original y están redibujadas en SVG,
    # como exige §08: del PDF no se recorta nada. El pie va sin LaTeX porque
    # dentro de un bloque HTML el procesador de Markdown no lo interpreta.
    enunciado: |
      Considerar la función compuesta $f(t) = h(x(t))$, donde $x(t)$ y $h(x)$
      son las funciones cuyas gráficas se muestran en la figura, siendo $x(t)$
      dos veces derivable en $(c,d)$ y $h(x)$ dos veces derivable en $(a,b)$.

      <figure class="figura-examen">
      <svg viewBox="-10 0 880 330" role="img" width="860" height="322"
           aria-labelledby="f2526b1t f2526b1d">
        <title id="f2526b1t">Las gráficas de x(t) y de h(x)</title>
        <desc id="f2526b1d">A la izquierda, x(t) baja desde el valor b en t
        igual a c hasta el valor a en t igual a d, aplanandose al pasar por el
        valor q en t igual a p. A la derecha, h(x) sube desde el valor r en x
        igual a a hasta el valor s en x igual a b, aplanandose al pasar por el
        valor u en x igual a q.</desc>

        <g stroke="var(--rule)" stroke-width="1" stroke-dasharray="4 4" fill="none">
          <path d="M60 60 L100 60 M60 170 L230 170 M60 270 L360 270
                   M100 60 L100 280 M230 170 L230 280 M360 270 L360 280"></path>
          <path d="M500 250 L540 250 M500 160 L670 160 M500 60 L800 60
                   M540 250 L540 280 M670 160 L670 280 M800 60 L800 280"></path>
        </g>

        <g stroke="var(--graphite)" stroke-width="1.3" fill="none"
           marker-end="none">
          <path d="M60 280 L400 280 M60 30 L60 285"></path>
          <path d="M500 280 L840 280 M500 30 L500 285"></path>
        </g>

        <g stroke="var(--ink)" stroke-width="2.6" fill="none"
           stroke-linecap="round">
          <path d="M100 60 C 135 130, 175 168, 230 170
                   C 285 172, 325 195, 360 270"></path>
          <path d="M540 250 C 575 190, 615 163, 670 160
                   C 725 157, 765 130, 800 60"></path>
        </g>

        <g fill="var(--graphite)" font-size="14" font-family="var(--mono)">
          <text x="40" y="65">b</text>
          <text x="40" y="175">q</text>
          <text x="40" y="275">a</text>
          <text x="96" y="298">c</text>
          <text x="226" y="298">p</text>
          <text x="356" y="298">d</text>
          <text x="66" y="42">x</text>
          <text x="386" y="298">t</text>

          <text x="480" y="255">r</text>
          <text x="480" y="165">u</text>
          <text x="480" y="65">s</text>
          <text x="536" y="298">a</text>
          <text x="666" y="298">q</text>
          <text x="796" y="298">b</text>
          <text x="506" y="42">h</text>
          <text x="826" y="298">x</text>
        </g>

        <g fill="var(--ink)" font-size="15" font-family="var(--mono)">
          <text x="150" y="105">x(t)</text>
          <text x="700" y="215">h(x)</text>
        </g>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original. Los dos puntos donde las curvas
      se aplanan estan a la misma altura q: es el detalle que decide el
      apartado (c).
      </figcaption>
      </figure>

      **a)** Estudiar el crecimiento y los extremos locales de $f(t)$.

      **b)** Estudiar la concavidad y los puntos de inflexión de $f(t)$.

      **c)** Sea $P_2(t)$ el polinomio de Taylor de $f(t)$ de orden 2 en el
      punto $t=p$. Obtener los coeficientes de $P_2(t)$ en función de $p$ y
      $q$, y escribir la expresión de $P_2(t)$.
    pide: Estudiar crecimiento, concavidad y calcular el polinomio de Taylor.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de derivar nada, ¿qué hay que leer en las dos gráficas?
        opciones:
          - texto: >-
              El **signo** de $x'$, $x''$, $h'$ y $h''$, y **dónde** cambian
            correcta: true
            mensaje: |
              Eso es. No hacen falta las expresiones de $x$ y de $h$: la regla
              de la cadena solo necesita los signos de sus derivadas, y los
              signos se leen en el dibujo. $x$ baja siempre y $h$ sube siempre;
              las dos se aplanan una vez, y ahí están sus inflexiones.
          - texto: Los valores concretos de $a$, $b$, $c$ y $d$
            mensaje: |
              No son números, son etiquetas. Y no hacen falta: todo el ejercicio
              sale de los signos y del punto donde cambian.
          - texto: Las expresiones analíticas de $x(t)$ y $h(x)$
            mensaje: |
              No se dan, y ese es el ejercicio. Si hicieran falta, el enunciado
              no habría puesto un dibujo.
          - texto: >-
              Los puntos donde $x(t)$ y $h(x)$ cortan a sus ejes
            mensaje: |
              Los cortes no intervienen. Lo que decide todo es dónde se anulan
              las **segundas** derivadas.

      - tipo: calcular
        titulo: El signo de la derivada
        pregunta: |
          $f'(t) = h'\big(x(t)\big)\cdot x'(t)$. En $(c,d)$, ¿cuántos extremos
          locales tiene $f$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.1
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 sería si $f'$ se anulara en un punto. Pero $h'>0$ en todo
              $(a,b)$ y $x'<0$ en todo $(c,d)$: el producto **nunca** vale
              cero.
          - valor: '2'
            mensaje: |
              2 confunde los puntos donde las curvas **se aplanan** con puntos
              críticos. Ahí lo que se anula es la **segunda** derivada, no la
              primera.
          - valor: '3'
            mensaje: |
              No hay tres puntos candidatos en ninguna de las dos gráficas.
        pista: |
          Mira el signo de $h'$ y el de $x'$ por separado. ¿Puede su producto
          anularse?
        desarrollo: |
          En la gráfica de la izquierda, $x(t)$ **baja** en todo el intervalo:

          $$
          x'(t) < 0 \quad \forall t \in (c,d)
          $$

          En la de la derecha, $h(x)$ **sube** en todo el intervalo:

          $$
          h'(x) > 0 \quad \forall x \in (a,b)
          $$

          Por la regla de la cadena:

          $$
          f'(t) = h'\big(x(t)\big)\cdot x'(t)
          = \underbrace{(+)}_{h'}\cdot\underbrace{(-)}_{x'} < 0
          $$

          $f$ es **decreciente en todo $(c,d)$** y su derivada no se anula
          nunca: **cero extremos locales**.
        veredicto: |
          Que las curvas se aplanen no significa que la derivada valga cero: se
          aplanan, pero no llegan a ser horizontales. Es la lectura que más se
          falla en este tipo de ejercicio.

      - tipo: calcular
        titulo: El coeficiente cuadrático
        pregunta: |
          En $P_2(t) = f(p)+f'(p)(t-p)+\frac{f''(p)}{2}(t-p)^2$, ¿cuánto vale
          $f''(p)$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              No es 1. Los **dos** sumandos de $f''$ se anulan en $t=p$, cada
              uno por un motivo distinto, y la suma es exactamente cero.
          - valor: '2'
            mensaje: |
              No sale ningún 2. Revisa la fórmula:
              $f'' = h''\left(x\right)\left[x'\right]^{2}+h'\left(x\right)x''$.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es el factor que acompaña a $f''(p)$ en el polinomio, no
              su valor.
        pista: |
          Deriva otra vez el producto:

          $$
          f''(t) = h''\big(x(t)\big)\left[x'(t)\right]^{2}
          + h'\big(x(t)\big)\,x''(t)
          $$

          Y mira qué pasa en $t=p$ con cada sumando.
        desarrollo: |
          Derivando otra vez el producto:

          $$
          f''(t) = h''\big(x(t)\big)\left[x'(t)\right]^{2}
          + h'\big(x(t)\big)\cdot x''(t)
          $$

          En $t=p$ ocurren **dos** cosas a la vez:

          - $t=p$ es el punto de inflexión de $x$, luego $x''(p) = 0$;
          - $x(p) = q$, y $x=q$ es el punto de inflexión de $h$, luego
            $h''(q) = 0$.

          Sustituyendo:

          $$
          f''(p) = \underbrace{h''(q)}_{0}\left[x'(p)\right]^{2}
          + h'(q)\cdot\underbrace{x''(p)}_{0} = 0
          $$

          Los dos sumandos se anulan, cada uno por su lado.
        veredicto: |
          Por eso el polinomio de Taylor **de orden 2** sale de grado 1: es una
          recta. Y por eso $t=p$ es también punto de inflexión de $f$.

      - tipo: justificar
        pregunta: |
          Ordena el estudio de la concavidad. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La fórmula:** $f'' = h''\left(x\right)\left[x'\right]^{2}
              +h'\left(x\right)x''$. El primer sumando lleva un **cuadrado**,
              así que su signo es el de $h''$.
          - texto: |
              **Tramo $t\in(c,p)$.** Ahí $x(t)$ está entre $q$ y $b$, y en esa
              zona $h$ es **convexa**: $h''>0$. Y $x$ también es convexa:
              $x''>0$.
          - texto: |
              Luego $f'' = (+)(+) + (+)(+) > 0$: $f$ es **convexa** en $(c,p)$.
          - texto: |
              **Tramo $t\in(p,d)$.** Ahí $x(t)$ está entre $a$ y $q$, donde $h$
              es **cóncava**: $h''<0$. Y $x$ también: $x''<0$.
          - texto: |
              Luego $f'' = (-)(+) + (+)(-) < 0$: $f$ es **cóncava** en $(p,d)$,
              y $t=p$ es punto de inflexión.
          - texto: |
              Como $x$ es decreciente, invierte la concavidad de $h$: donde $h$
              es convexa, la composición es cóncava.
            trampa: true
            mensaje: |
              Eso sería cierto si $x'$ entrara **lineal**, pero entra **al
              cuadrado**: $\left[x'\right]^{2}>0$ siempre. Que $x$ baje no
              invierte nada en el primer sumando. Lo interesante de este
              ejercicio es justo lo contrario: los dos efectos **se refuerzan**
              en vez de competir, y por eso el signo es limpio en los dos
              tramos.
        veredicto: |
          Si los dos sumandos hubieran salido con signos opuestos, no se podría
          decidir nada sin conocer los valores. Que el examen esté construido
          para que se refuercen no es casualidad.

    resolucion: |
      **Datos.** $f(t) = h(x(t))$, con $x$ y $h$ dadas solo por sus gráficas.

      ### 1 · Qué se lee en el dibujo

      No hay expresiones analíticas, y no hacen falta. Todo el ejercicio sale de
      cuatro signos y de dónde cambian:

      | | en su intervalo | se aplana en |
      |---|---|---|
      | $x(t)$ | **baja**: $x'<0$ | $t=p$, donde vale $q$ |
      | $h(x)$ | **sube**: $h'>0$ | $x=q$, donde vale $u$ |

      Y el detalle que decide el ejercicio: **los dos puntos de aplanamiento
      están en el mismo sitio**. El de $x$ ocurre a la altura $q$, y $q$ es
      justo la abscisa donde se aplana $h$.

      Ese aplanamiento es un **punto de inflexión** en los dos casos: la curva
      pasa de curvarse en un sentido a curvarse en el otro. Luego

      $$
      x''(p) = 0, \qquad h''(q) = 0
      $$

      ### 2 · Apartado (a): crecimiento

      $$
      f'(t) = h'\big(x(t)\big)\cdot x'(t)
      $$

      El primer factor es positivo —$h$ sube— y el segundo negativo —$x$ baja—:

      $$
      \boxed{f'(t)<0 \ \ \forall t\in(c,d):\ f \text{ es decreciente, sin
      extremos locales}}
      $$

      **No hay extremos** porque $f'$ no llega a anularse: ninguno de los dos
      factores lo hace. Que las curvas se aplanen no basta; tendrían que
      llegar a ser horizontales.

      ### 3 · Apartado (b): concavidad

      Derivando el producto:

      $$
      f''(t) = h''\big(x(t)\big)\left[x'(t)\right]^{2}
      + h'\big(x(t)\big)\cdot x''(t)
      $$

      El primer sumando lleva $\left[x'\right]^{2}$, que es **siempre
      positivo**: su signo es el de $h''$. El segundo lleva $h'>0$: su signo es
      el de $x''$.

      **Tramo $(c,p)$.** Como $x$ baja desde $b$, ahí $x(t)$ recorre $(q,b)$.
      En esa zona $h$ es convexa —la parte de la derecha de su gráfica—, luego
      $h''>0$. Y $x$ también es convexa antes de $p$: $x''>0$.

      $$
      f'' = (+)\cdot(+) + (+)\cdot(+) > 0
      $$

      **Tramo $(p,d)$.** Ahí $x(t)$ recorre $(a,q)$, donde $h$ es cóncava:
      $h''<0$. Y $x$ también: $x''<0$.

      $$
      f'' = (-)\cdot(+) + (+)\cdot(-) < 0
      $$

      $$
      \boxed{f \text{ convexa en } (c,p),\quad \text{cóncava en } (p,d),
      \quad \text{inflexión en } t=p}
      $$

      **Los dos efectos se refuerzan**, no compiten. Si hubieran salido con
      signos opuestos, no se podría concluir nada sin los valores.

      ### 4 · Apartado (c): el polinomio de Taylor

      $$
      P_2(t) = f(p)+f'(p)\,(t-p)+\frac{f''(p)}{2}\,(t-p)^{2}
      $$

      **Término independiente.**

      $$
      f(p) = h\big(x(p)\big) = h(q) = u
      $$

      **Coeficiente lineal.**

      $$
      f'(p) = h'\big(x(p)\big)\cdot x'(p) = h'(q)\cdot x'(p)
      $$

      **Coeficiente cuadrático.** Aquí está la gracia:

      $$
      f''(p) = \underbrace{h''(q)}_{=\,0}\left[x'(p)\right]^{2}
      + h'(q)\cdot\underbrace{x''(p)}_{=\,0} = 0
      $$

      $$
      \boxed{P_2(t) = u + h'(q)\,x'(p)\,(t-p)}
      $$

      **El polinomio de orden 2 resulta ser de grado 1: una recta.** Y no es una
      casualidad ni un error: es la traducción algebraica de que $t=p$ es punto
      de inflexión de $f$. En un punto de inflexión, la parábola que mejor
      aproxima a la curva es su propia tangente.

      ### 5 · Comprobación

      **De coherencia entre los tres apartados.** El apartado (b) dice que $p$
      es punto de inflexión de $f$; el apartado (c) da $f''(p)=0$. Las dos cosas
      son la misma dicha de dos maneras ✔

      **Del signo del coeficiente lineal.** Debe ser negativo, porque (a) dice
      que $f$ decrece:

      $$
      h'(q)\cdot x'(p) = (+)\cdot(-) < 0 \quad\checkmark
      $$

      **Con un ejemplo concreto**, que es la única forma de validar del todo un
      ejercicio sin números. Tomando

      $$
      x(t) = -t^{3}, \qquad h(x) = x^{3}
      $$

      —las dos con inflexión en el origen, $x$ decreciente y $h$ creciente— sale
      $f(t) = \left(-t^{3}\right)^{3} = -t^{9}$, que en efecto es decreciente,
      convexa para $t<0$, cóncava para $t>0$, y cuyo polinomio de Taylor de
      orden 2 en $t=0$ es el nulo, de grado menor que 2 ✔

  - id: ex2526-2ev-2-beisbol
    titulo: A qué velocidad se acerca el corredor al plato
    fuente: >-
      Ejercicio 2 · Segunda evaluación, 1 de diciembre de 2025 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    enunciado: |
      Un campo de béisbol tiene un cuadrado interior tal que cada lado mide 90
      pies. Un vértice es el plato de *home*, y consecutivamente están las
      bases, 1, 2 y 3. Supongamos que un jugador que corre de la segunda base a
      la tercera tiene una velocidad de 30 pies/s en el instante en que está a
      20 pies de la tercera base. ¿A qué velocidad cambia la distancia del
      jugador desde el plato de *home* en ese instante?

      <figure class="figura-examen">
      <svg viewBox="0 0 620 400" role="img" width="600" height="387"
           aria-labelledby="f2526b2t f2526b2d">
        <title id="f2526b2t">El diamante de beisbol</title>
        <desc id="f2526b2d">Un cuadrado girado cuarenta y cinco grados con el
        plato de home en el vertice inferior, la primera base a la derecha, la
        segunda arriba y la tercera a la izquierda. Cada lado mide noventa
        pies. El corredor esta sobre el lado que va de segunda a tercera, a
        veinte pies de la tercera, y se marca su distancia al plato.</desc>

        <path d="M310 330 L450 190 L310 50 L170 190 Z"
              fill="var(--live)" fill-opacity="0.07"
              stroke="var(--graphite)" stroke-width="2"></path>

        <g stroke="var(--flag)" stroke-width="2" stroke-dasharray="7 5"
           fill="none">
          <path d="M201 159 L310 330"></path>
        </g>

        <g stroke="var(--alt)" stroke-width="3.5" fill="none"
           stroke-linecap="round">
          <path d="M201 159 L170 190"></path>
        </g>

        <g fill="var(--graphite)">
          <rect x="303" y="323" width="14" height="14" transform="rotate(45 310 330)"></rect>
          <rect x="443" y="183" width="14" height="14" transform="rotate(45 450 190)"></rect>
          <rect x="303" y="43" width="14" height="14" transform="rotate(45 310 50)"></rect>
          <rect x="163" y="183" width="14" height="14" transform="rotate(45 170 190)"></rect>
        </g>

        <circle cx="201" cy="159" r="7" fill="var(--live)"></circle>

        <g stroke="var(--live)" stroke-width="2.2" fill="none"
           stroke-linecap="round">
          <path d="M195 153 L172 176"></path>
          <path d="M172 176 L182 174 M172 176 L174 166"></path>
        </g>

        <g fill="var(--graphite)" font-size="14" font-family="var(--mono)">
          <text x="290" y="360">home</text>
          <text x="466" y="195">1</text>
          <text x="303" y="36">2</text>
          <text x="146" y="195">3</text>
          <text x="392" y="108">90 pies</text>
          <text x="196" y="108">90 pies</text>
        </g>

        <g fill="var(--alt)" font-size="13" font-family="var(--mono)">
          <text x="120" y="150">20 pies</text>
        </g>

        <g fill="var(--live)" font-size="13" font-family="var(--mono)">
          <text x="196" y="132">30 pies/s</text>
        </g>

        <g fill="var(--flag)" font-size="13" font-family="var(--mono)">
          <text x="238" y="262">D</text>
        </g>
      </svg>
      <figcaption>
      Figura nuestra, redibujada: el enunciado original trae un plano de campo
      escaneado, que por §08 no entra en el repositorio. En verde el corredor y
      su velocidad; en morado los 20 pies que le faltan hasta la tercera base;
      en rojo, la distancia D al plato, que es lo que se pide derivar.
      </figcaption>
      </figure>
    pide: Calcular la velocidad a la que cambia la distancia a home.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué relación hay que derivar?
        opciones:
          - texto: >-
              **Pitágoras** entre la distancia recorrida y la distancia a home:
              $D^{2} = x^{2}+90^{2}$
            correcta: true
            mensaje: |
              Exacto. El corredor va por el lado que une la segunda con la
              tercera; ese lado es **perpendicular** al que une la tercera con
              *home*, y los dos miden 90. Así que el corredor, la tercera base y
              el plato forman un triángulo rectángulo cuyo cateto fijo mide 90.
          - texto: >-
              La ley del coseno, porque el ángulo no es recto
            mensaje: |
              Sí lo es. En un cuadrado, dos lados consecutivos son
              perpendiculares. Ese es todo el dato geométrico que hace falta.
          - texto: >-
              $D = 90 - x$, porque el corredor se acerca en línea recta
            mensaje: |
              El corredor no se mueve hacia *home*, se mueve hacia la tercera
              base. Su distancia al plato no baja al mismo ritmo que avanza.
          - texto: >-
              La relación entre el área del diamante y el tiempo
            mensaje: |
              El área no interviene: lo que cambia es una distancia.

      - tipo: calcular
        titulo: La distancia en ese instante
        pregunta: |
          ¿A qué distancia está el corredor del plato en ese instante? Da cuatro
          decimales.
        respuesta:
          tipo: numero
          valor: '92.1954'
          tolerancia: 0.005
          formato: un número en pies
        distractores:
          - valor: '127.2792'
            mensaje: |
              $90\sqrt2 \approx 127{,}28$ es la distancia de la **segunda** base
              al plato, la diagonal entera. El corredor ya no está ahí: le
              quedan 20 pies para la tercera.
          - valor: '110.0000'
            mensaje: |
              110 sería $90+20$, sumando en línea recta. Los dos segmentos son
              **perpendiculares**: hay que componerlos con Pitágoras, no
              sumarlos.
          - valor: '90.0000'
            mensaje: |
              90 es la distancia de la **tercera** base al plato. El corredor
              todavía no ha llegado.
        pista: |
          El cateto que recorre el corredor mide 20; el otro, el que va de la
          tercera a *home*, mide 90.
        desarrollo: |
          Poniendo *home* en el origen, la tercera base queda a 90 pies y el
          lado que va de la segunda a la tercera es **perpendicular** a él.

          Llamando $x$ a lo que le falta al corredor para llegar a la tercera:

          $$
          D = \sqrt{x^{2}+90^{2}}
          $$

          En el instante del enunciado, $x=20$:

          $$
          D = \sqrt{400+8100} = \sqrt{8500} = 10\sqrt{85} \approx 92{,}1954
          $$
        veredicto: |
          $\sqrt{8500} = 10\sqrt{85}$ conviene dejarlo así: el resultado final
          queda exacto y se evita arrastrar decimales.

      - tipo: calcular
        titulo: La velocidad
        pregunta: |
          ¿A qué velocidad cambia la distancia a *home*? Da cuatro decimales,
          con signo.
        respuesta:
          tipo: numero
          valor: '-6.5079'
          tolerancia: 0.005
          formato: un número en pies por segundo
        distractores:
          - valor: '6.5079'
            mensaje: |
              El valor absoluto está bien, pero **el signo importa**: la
              distancia **disminuye**, porque el corredor se está acercando al
              plato. Con $\frac{dx}{dt} = -30$ el resultado sale negativo.
          - valor: '-30.0000'
            mensaje: |
              $-30$ es la velocidad del **corredor** por la línea de bases. La
              distancia a *home* cambia más despacio, porque solo una parte de
              ese movimiento apunta hacia el plato.
          - valor: '-27.4721'
            mensaje: |
              Has usado $\frac{90}{92{,}195}$ en vez de
              $\frac{20}{92{,}195}$. El factor es el cateto que **cambia**, no
              el fijo.
        pista: |
          Deriva $D^{2}=x^{2}+8100$ respecto del tiempo, con $x=20$ y
          $\frac{dx}{dt}=-30$.
        desarrollo: |
          Derivando implícitamente respecto de $t$:

          $$
          2D\,\frac{dD}{dt} = 2x\,\frac{dx}{dt}
          \;\Longrightarrow\;
          \frac{dD}{dt} = \frac{x}{D}\cdot\frac{dx}{dt}
          $$

          El corredor **se acerca** a la tercera base, así que $x$ disminuye:
          $\frac{dx}{dt} = -30$ pies/s.

          $$
          \frac{dD}{dt} = \frac{20}{10\sqrt{85}}\cdot(-30)
          = \frac{-600}{10\sqrt{85}} = \frac{-60}{\sqrt{85}}
          = -\frac{12\sqrt{85}}{17}
          $$

          $$
          \approx -6{,}5079 \ \text{pies/s}
          $$
        veredicto: |
          El factor $\frac xD = \frac{20}{92{,}2} \approx 0{,}217$ dice qué
          fracción de la velocidad del corredor apunta hacia el plato: solo un
          22 %. El resto lo emplea en rodearlo.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La geometría.** El lado que va de la segunda a la tercera base
              es perpendicular al que va de la tercera a *home*, porque son
              lados consecutivos de un cuadrado.
          - texto: |
              **La relación.** Con $x$ = distancia del corredor a la tercera
              base: $D^{2} = x^{2}+90^{2}$. Es una identidad que se cumple en
              **todo** instante, no solo en el del enunciado.
          - texto: |
              **Derivar respecto del tiempo**, tratando $x$ y $D$ como funciones
              de $t$: $2D\,D' = 2x\,x'$.
          - texto: |
              **Sustituir al final**, no antes: $x=20$, $D=10\sqrt{85}$ y
              $x' = -30$, con signo negativo porque $x$ disminuye.
          - texto: |
              $\frac{dD}{dt} = -\frac{12\sqrt{85}}{17} \approx -6{,}51$
              pies/s: la distancia a *home* **disminuye**.
          - texto: |
              Conviene sustituir $x=20$ en $D^{2}=x^{2}+8100$ antes de derivar,
              para simplificar la expresión.
            trampa: true
            mensaje: |
              Ese es **el** error de los problemas de tasas relacionadas. Si se
              sustituye antes, $D$ se convierte en una constante y su derivada
              sale cero. Los valores del instante se meten **después** de
              derivar: la relación hay que derivarla mientras todavía es una
              identidad entre funciones del tiempo.
        veredicto: |
          Derivar primero y sustituir después no es una preferencia de estilo:
          es lo único que funciona. Es el mismo cuidado que en el ejercicio 3.17
          del boletín, el del coche y el edificio.

    resolucion: |
      **Datos.** Diamante de 90 pies de lado. El corredor va de la segunda a la
      tercera base a 30 pies/s y está a 20 pies de la tercera.

      ### 1 · La herramienta

      Es un problema de **tasas relacionadas**: dos magnitudes ligadas por una
      identidad geométrica, se conoce la velocidad de una y se pide la de la
      otra.

      El método es siempre el mismo, y el orden importa:

      1. Escribir la relación entre las magnitudes, **válida en todo instante**.
      2. Derivar respecto del tiempo.
      3. **Solo entonces** sustituir los valores del instante concreto.

      ### 2 · La geometría

      El plato y las tres bases forman un cuadrado de 90 pies de lado. El lado
      que va de la **segunda a la tercera** y el que va de la **tercera a
      *home*** son lados consecutivos: **perpendiculares**.

      Llamando $x$ a la distancia que le falta al corredor para llegar a la
      tercera base, el corredor, la tercera base y el plato forman un triángulo
      rectángulo de catetos $x$ y $90$:

      $$
      D^{2} = x^{2}+90^{2} = x^{2}+8100
      $$

      ### 3 · Derivar

      $$
      2D\,\frac{dD}{dt} = 2x\,\frac{dx}{dt}
      \;\Longrightarrow\;
      \frac{dD}{dt} = \frac{x}{D}\cdot\frac{dx}{dt}
      $$

      ### 4 · Sustituir

      $$
      x = 20,
      \qquad
      D = \sqrt{400+8100} = \sqrt{8500} = 10\sqrt{85},
      \qquad
      \frac{dx}{dt} = -30
      $$

      **El signo de $\frac{dx}{dt}$ es negativo** porque $x$ es lo que le
      *falta* al corredor, y eso disminuye conforme avanza.

      $$
      \frac{dD}{dt} = \frac{20}{10\sqrt{85}}\cdot(-30)
      = \frac{-60}{\sqrt{85}}
      $$

      Racionalizando:

      $$
      \boxed{\frac{dD}{dt} = -\frac{60\sqrt{85}}{85}
      = -\frac{12\sqrt{85}}{17} \approx -6{,}51 \ \text{pies/s}}
      $$

      La distancia al plato **disminuye** a 6,51 pies por segundo.

      ### 5 · El error que persigue el ejercicio

      Sustituir $x=20$ **antes** de derivar. Entonces $D^{2}=8500$ es una
      constante, su derivada es 0, y sale que la distancia no cambia — absurdo.

      La relación hay que derivarla mientras sigue siendo una identidad entre
      **funciones del tiempo**. Los números del instante son datos de
      evaluación, no de planteamiento.

      ### 6 · Comprobación

      **Por el orden de magnitud.** El factor $\frac{x}{D}$ es el coseno del
      ángulo entre la dirección de carrera y la dirección hacia *home*:

      $$
      \frac{20}{92{,}2} \approx 0{,}217
      $$

      Solo el 22 % de la velocidad del corredor apunta al plato. Y en efecto
      $0{,}217\cdot30 \approx 6{,}5$ ✔

      **Por los extremos.** Si el corredor estuviera **justo sobre** la tercera
      base ($x=0$), correría perpendicularmente a la línea que lo une con
      *home*, y la distancia no cambiaría: la fórmula da
      $\frac{0}{90}\cdot(-30) = 0$ ✔

      Si estuviera en la segunda base ($x=90$), el factor sería
      $\frac{90}{90\sqrt2} = \frac{1}{\sqrt2}$, y la velocidad
      $-\frac{30}{\sqrt2} \approx -21{,}2$ pies/s, la mayor de todo el
      recorrido ✔ Tiene sentido: cuanto más lejos de la tercera, más
      directamente apunta hacia el plato.

      **Que el resultado es menor que 30 en valor absoluto** ✔ Ninguna
      componente puede superar a la velocidad total.

  - id: ex2526-2ev-3-derivadas-de-la-inversa
    titulo: Las dos derivadas de la inversa, y el arcoseno
    fuente: >-
      Ejercicio 3 · Segunda evaluación, 1 de diciembre de 2025 · Cálculo,
      UPV/EHU · El apartado (a) es el ejercicio 3.9 del boletín del tema 3 ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 5
      comp4: 4

    enunciado: |
      Sean $f$ una función definida en un dominio $D$ y cuyo rango es $R$ y
      $f^{-1}$ su función inversa, definida en $R$.

      **a)** Demostrar que $\forall x \in R$ se verifica:

      $$
      \left(f^{-1}\right)'(x) = \frac{1}{f'\big(f^{-1}(x)\big)}
      \qquad \wedge \qquad
      \left(f^{-1}\right)''(x)
      = \frac{-f''\big(f^{-1}(x)\big)}{\left(f'\big(f^{-1}(x)\big)\right)^{3}}
      $$

      **b)** Utilizando el apartado anterior, calcular el polinomio de Maclaurin
      de orden 2 de la función $f(x) = \mathrm{arcsen}(x)$.

      **c)** Utilizando el polinomio anterior, aproximar el valor de
      $\mathrm{arcsen}(0.1)$
    pide: Demostrar las dos fórmulas y aplicarlas al arcoseno.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De qué identidad hay que partir para demostrar la primera fórmula?
        opciones:
          - texto: >-
              De $f\big(f^{-1}(x)\big) = x$, derivando los dos lados
            correcta: true
            mensaje: |
              Exacto. Es la **definición** de función inversa, y derivarla con
              la regla de la cadena da
              $f'\big(f^{-1}(x)\big)\cdot\left(f^{-1}\right)'(x) = 1$, de donde
              se despeja. Toda la demostración cabe en dos líneas si se parte
              de ahí.
          - texto: De la definición de derivada como límite
            mensaje: |
              Se puede, pero es mucho más largo y no hace falta. La composición
              con la inversa da el resultado en dos pasos.
          - texto: >-
              De que la gráfica de $f^{-1}$ es la de $f$ reflejada
            mensaje: |
              Es cierto y ayuda a entenderlo, pero **no es una demostración**:
              un dibujo no prueba una fórmula. En un examen que reparte 4 puntos
              de COMP4, esa diferencia se nota.
          - texto: >-
              De la regla del cociente aplicada a $\frac{1}{f}$
            mensaje: |
              La inversa **de una función** no es su recíproco:
              $f^{-1} \neq \frac1f$. Confundirlas es el error más caro del
              ejercicio.

      - tipo: calcular
        titulo: La derivada segunda del arcoseno
        pregunta: |
          Aplicando la segunda fórmula a $\mathrm{arcsen}$, ¿cuánto vale
          $\left(\mathrm{arcsen}\right)''(0)$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es la derivada **primera** en 0:
              $\frac{1}{\sqrt{1-0}} = 1$. La segunda es
              $\frac{x}{\left(1-x^{2}\right)^{3/2}}$, que en 0 se anula.
          - valor: '-1'
            mensaje: |
              El signo menos de la fórmula se cancela con el de
              $-\mathrm{sen}$, la derivada segunda del seno. El resultado en
              $x=0$ es 0, no $-1$.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es el coeficiente de $x^{2}$ en el polinomio si la
              derivada segunda valiera 1. Aquí vale 0 y ese término desaparece.
        pista: |
          Con $f = \mathrm{sen}$: $f' = \cos$ y $f'' = -\mathrm{sen}$. Sustituye
          en la fórmula del apartado (a).
        desarrollo: |
          El arcoseno es la inversa del seno, así que se aplica la fórmula con
          $f = \mathrm{sen}$, $f' = \cos$ y $f'' = -\mathrm{sen}$:

          $$
          \left(\mathrm{arcsen}\right)''(x)
          = \frac{-f''\big(\mathrm{arcsen}\,x\big)}
          {\left(f'\big(\mathrm{arcsen}\,x\big)\right)^{3}}
          = \frac{\mathrm{sen}\big(\mathrm{arcsen}\,x\big)}
          {\cos^{3}\big(\mathrm{arcsen}\,x\big)}
          $$

          Y usando $\mathrm{sen}(\mathrm{arcsen}\,x) = x$ y
          $\cos(\mathrm{arcsen}\,x) = \sqrt{1-x^{2}}$:

          $$
          \left(\mathrm{arcsen}\right)''(x)
          = \frac{x}{\left(1-x^{2}\right)^{3/2}}
          $$

          En $x=0$:

          $$
          \left(\mathrm{arcsen}\right)''(0) = \frac{0}{1} = 0
          $$
        veredicto: |
          Los dos signos menos —el de la fórmula y el de $f''=-\mathrm{sen}$—
          se cancelan. Perder uno de los dos es el fallo más frecuente.

      - tipo: calcular
        titulo: Por qué la aproximación es tan buena
        pregunta: |
          El polinomio da $\mathrm{arcsen}(0{,}1) \approx 0{,}1$. El primer
          término que **falta** en ese desarrollo es de grado $k$. ¿Cuánto vale
          $k$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.1
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              El de grado 2 **existe** en el polinomio, pero su coeficiente es
              cero: no falta, es que vale nada. El primero que falta de verdad
              está más arriba.
          - valor: '4'
            mensaje: |
              El arcoseno es una función **impar**, así que su desarrollo solo
              tiene potencias impares. Ningún término de grado par sobrevive.
          - valor: '5'
            mensaje: |
              El de grado 5 también aparece, pero no es el **primero** que
              falta: antes está el cúbico.
        pista: |
          $\mathrm{arcsen}$ es impar. ¿Qué potencias puede tener su desarrollo?
        desarrollo: |
          Con $\mathrm{arcsen}(0)=0$, derivada primera 1 y derivada segunda 0:

          $$
          P_2(x) = 0+1\cdot x+\frac{0}{2}x^{2} = x
          \;\Longrightarrow\;
          \mathrm{arcsen}(0{,}1) \approx 0{,}1
          $$

          El desarrollo completo es

          $$
          \mathrm{arcsen}\,x = x+\frac{x^{3}}{6}+\frac{3x^{5}}{40}+\cdots
          $$

          Solo potencias **impares**, porque la función es impar. Así que el
          primer término omitido es el de grado **3**, y aporta

          $$
          \frac{0{,}1^{3}}{6} = 1{,}67\cdot10^{-4}
          $$

          Y en efecto el valor exacto es $0{,}1001674\ldots$: el error observado
          es de ese mismo orden, algo mayor porque también faltan el término de
          grado 5 y los siguientes.
        veredicto: |
          Saltarse dos grados de golpe —del 1 al 3— es lo que hace la
          aproximación tan buena. Con funciones pares o sin simetría, el error
          sería del orden de $x^{2}$, cien veces mayor aquí.

      - tipo: justificar
        pregunta: |
          Ordena la demostración del apartado (a). Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **Partir de la definición de inversa:**
              $f\big(f^{-1}(x)\big) = x$ para todo $x \in R$.
          - texto: |
              **Derivar los dos lados** con la regla de la cadena:
              $f'\big(f^{-1}(x)\big)\cdot\left(f^{-1}\right)'(x) = 1$.
          - texto: |
              **Despejar**, lo que exige $f'\big(f^{-1}(x)\big) \neq 0$:
              $\left(f^{-1}\right)'(x)
              = \dfrac{1}{f'\big(f^{-1}(x)\big)}$.
          - texto: |
              **Derivar otra vez** esa expresión, tratándola como
              $\left[f'\big(f^{-1}(x)\big)\right]^{-1}$ y aplicando la cadena
              dos veces —una por el exponente y otra por la $f^{-1}$ de dentro—.
          - texto: |
              Sale
              $-\dfrac{f''\big(f^{-1}\big)\cdot\left(f^{-1}\right)'}
              {\left[f'\big(f^{-1}\big)\right]^{2}}$, y sustituyendo
              $\left(f^{-1}\right)'$ por la fórmula ya probada aparece el
              **cubo** del denominador.
          - texto: |
              Como $f^{-1}$ deshace lo que hace $f$, se tiene
              $\left(f^{-1}\right)' = \frac{1}{f'}$, y derivando otra vez sale
              directamente la segunda fórmula.
            trampa: true
            mensaje: |
              $\left(f^{-1}\right)'(x)$ **no** es $\frac{1}{f'(x)}$: es
              $\frac{1}{f'\big(f^{-1}(x)\big)}$, con la inversa evaluada dentro.
              Omitir ese argumento es lo que hace que salga un cuadrado en vez
              de un cubo, porque se pierde precisamente el factor
              $\left(f^{-1}\right)'$ de la cadena.
        veredicto: |
          El cubo del denominador es la huella de haber aplicado bien la cadena.
          Si sale un cuadrado, falta un paso.

    resolucion: |
      **Datos.** $f$ con inversa $f^{-1}$. Se piden las dos primeras derivadas
      de la inversa y su aplicación al arcoseno.

      > Este ejercicio está publicado como **3.9** en el boletín de problemas
      > complementarios del tema 3, con el mismo enunciado. Es la vigésima
      > repetición literal que encontramos entre boletines y exámenes.

      ### 1 · Apartado (a), primera fórmula

      Se parte de la **definición** de función inversa:

      $$
      f\big(f^{-1}(x)\big) = x \qquad \forall x \in R
      $$

      Derivando los dos lados con la regla de la cadena:

      $$
      f'\big(f^{-1}(x)\big)\cdot\left(f^{-1}\right)'(x) = 1
      $$

      $$
      \boxed{\left(f^{-1}\right)'(x) = \frac{1}{f'\big(f^{-1}(x)\big)}}
      $$

      **La hipótesis que hay que decir en voz alta:** el despeje solo vale si
      $f'\big(f^{-1}(x)\big) \neq 0$. Donde la derivada de $f$ se anula, su
      inversa tiene tangente vertical y no es derivable. Ese es el tipo de
      detalle que reparte los puntos de COMP4.

      ### 2 · Apartado (a), segunda fórmula

      Se deriva la expresión anterior, escrita como una potencia:

      $$
      \left(f^{-1}\right)''(x)
      = \frac{d}{dx}\left[f'\big(f^{-1}(x)\big)\right]^{-1}
      $$

      $$
      = -\left[f'\big(f^{-1}(x)\big)\right]^{-2}
      \cdot f''\big(f^{-1}(x)\big)\cdot\left(f^{-1}\right)'(x)
      $$

      La cadena se aplica **dos veces**: una por el exponente $-1$ y otra por la
      $f^{-1}$ que hay dentro de $f'$. Y ahora se sustituye
      $\left(f^{-1}\right)'$ por la fórmula ya demostrada:

      $$
      = -\frac{f''\big(f^{-1}(x)\big)}
      {\left[f'\big(f^{-1}(x)\big)\right]^{2}}
      \cdot\frac{1}{f'\big(f^{-1}(x)\big)}
      $$

      $$
      \boxed{\left(f^{-1}\right)''(x)
      = \frac{-f''\big(f^{-1}(x)\big)}
      {\left(f'\big(f^{-1}(x)\big)\right)^{3}}}
      $$

      **El cubo sale de ahí**: un cuadrado de la derivada del exponente más un
      factor de la sustitución. Si en el desarrollo aparece un cuadrado, es que
      falta el último paso.

      ### 3 · Apartado (b): el arcoseno

      El arcoseno es la inversa del seno en $\left[-\frac\pi2,\frac\pi2\right]$,
      así que se aplica todo lo anterior con

      $$
      f = \mathrm{sen}, \qquad f' = \cos, \qquad f'' = -\mathrm{sen}
      $$

      **Término independiente.** $\mathrm{arcsen}(0) = 0$.

      **Derivada primera.**

      $$
      \left(\mathrm{arcsen}\right)'(x)
      = \frac{1}{\cos\big(\mathrm{arcsen}\,x\big)}
      = \frac{1}{\sqrt{1-x^{2}}}
      $$

      usando que $\cos\big(\mathrm{arcsen}\,x\big) = \sqrt{1-x^{2}}$, positivo
      porque el arcoseno vive en el primer y cuarto cuadrante.

      $$
      \left(\mathrm{arcsen}\right)'(0) = 1
      $$

      **Derivada segunda.** Los dos signos menos se cancelan:

      $$
      \left(\mathrm{arcsen}\right)''(x)
      = \frac{-\left(-\mathrm{sen}\big(\mathrm{arcsen}\,x\big)\right)}
      {\cos^{3}\big(\mathrm{arcsen}\,x\big)}
      = \frac{x}{\left(1-x^{2}\right)^{3/2}}
      $$

      $$
      \left(\mathrm{arcsen}\right)''(0) = 0
      $$

      **El polinomio:**

      $$
      \boxed{P_2(x) = 0+1\cdot x+\frac{0}{2}x^{2} = x}
      $$

      De orden 2, pero de grado 1: el coeficiente cuadrático se anula porque el
      arcoseno es una función **impar**, y las funciones impares no tienen
      términos pares en su desarrollo.

      ### 4 · Apartado (c): la aproximación

      $$
      \boxed{\mathrm{arcsen}(0{,}1) \approx 0{,}1}
      $$

      ### 5 · Comprobación

      **Del valor.** El exacto es $\mathrm{arcsen}(0{,}1) = 0{,}1001674\ldots$,
      así que el error es $1{,}7\cdot10^{-4}$ ✔ Pequeño, como corresponde a un
      punto tan cerca del centro del desarrollo.

      **Por el término siguiente.** El desarrollo completo es

      $$
      \mathrm{arcsen}\,x = x+\frac{x^{3}}{6}+\frac{3x^{5}}{40}+\cdots
      $$

      El término cúbico aporta $\frac{0{,}1^{3}}{6} = 1{,}667\cdot10^{-4}$, y
      el error observado es $1{,}674\cdot10^{-4}$ ✔ No coinciden exactamente
      —ni deben: faltan el término de grado 5 y los siguientes— pero la
      diferencia entre ambos es de $7\cdot10^{-7}$, del orden de
      $\frac{3\cdot0{,}1^{5}}{40}$, que es justo el término que sigue. Cuadran
      los dos primeros omitidos, no solo el primero.

      **Por la paridad.** $\mathrm{arcsen}$ es impar, luego su desarrollo solo
      tiene potencias impares. El coeficiente de $x^{2}$ tenía que salir 0 ✔

      **De la fórmula, con un caso conocido.** Aplicándola a $f(x)=x^{3}$, cuya
      inversa es $x^{1/3}$:

      $$
      \left(f^{-1}\right)''(x)
      = \frac{-6\,x^{1/3}}{\left(3x^{2/3}\right)^{3}}
      = \frac{-6x^{1/3}}{27x^{2}} = -\frac{2}{9}x^{-5/3}
      $$

      y derivando $x^{1/3}$ dos veces a mano sale
      $\frac13\cdot\left(-\frac23\right)x^{-5/3} = -\frac29 x^{-5/3}$ ✔

  - id: ex2526-2ev-4-triangulo-bajo-la-exponencial
    titulo: El triángulo más grande bajo una exponencial
    fuente: >-
      Ejercicio 4 · Segunda evaluación, 1 de diciembre de 2025 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    enunciado: |
      Sea $P = (a,b)$ un punto situado en el primer cuadrante que pertenece a la
      curva $f(x) = e^{-x}$. La recta tangente a la función $f(x)$ en el punto
      $P$ y los ejes coordenados forman un triángulo rectángulo. Calcular las
      coordenadas del punto $P$ para que el área del triángulo sea máxima.
    pide: Calcular las coordenadas de $P$ que maximizan el área.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántas incógnitas independientes tiene el problema?
        opciones:
          - texto: >-
              **Una**: $b$ está determinada por $a$, porque $P$ está sobre la
              curva
            correcta: true
            mensaje: |
              Eso es. La condición «$P$ pertenece a la curva» es la **ligadura**
              que reduce dos incógnitas a una: $b = e^{-a}$. Identificarla es
              el primer punto de COMP1 de cualquier problema de optimización.
          - texto: Dos, $a$ y $b$, y hacen falta dos condiciones
            mensaje: |
              Serían dos si $P$ fuera un punto libre del plano. Pero está sobre
              la curva, y eso las liga.
          - texto: >-
              Tres: $a$, $b$ y la pendiente de la tangente
            mensaje: |
              La pendiente no es independiente: la fija la derivada en $a$.
          - texto: Ninguna, el punto está determinado por el enunciado
            mensaje: |
              El enunciado no da $P$: lo pide. Es lo que hay que optimizar.

      - tipo: calcular
        titulo: Los cortes de la tangente
        pregunta: |
          La tangente en $P=(a,e^{-a})$ corta al eje $OX$. ¿En qué abscisa, en
          función de $a$? Evalúala para $a=2$.
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es la abscisa del punto de tangencia, no del corte. La tangente
              baja hasta el eje algo más a la derecha.
          - valor: '1'
            mensaje: |
              1 saldría de $a-1$. El corte es en $a+1$: al despejar
              $0 = e^{-a}(1+a-x)$ queda $x = 1+a$.
          - valor: '0.5'
            mensaje: |
              $\frac1a$ no aparece en ningún paso. La recta es
              $y = e^{-a}\left(1+a-x\right)$.
        pista: |
          $f'(x) = -e^{-x}$. Escribe la tangente y hazla cero.
        desarrollo: |
          Con $f(x) = e^{-x}$ y $f'(x) = -e^{-x}$, la tangente en
          $\left(a,e^{-a}\right)$ es

          $$
          y = e^{-a}-e^{-a}(x-a) = e^{-a}\left(1+a-x\right)
          $$

          **Corte con $OX$**, haciendo $y=0$:

          $$
          1+a-x = 0 \;\Longrightarrow\; x = 1+a
          $$

          Para $a=2$ da $x=3$.

          **Corte con $OY$**, haciendo $x=0$:

          $$
          y = e^{-a}(1+a)
          $$
        veredicto: |
          La subtangente de la exponencial mide **siempre 1**, sea cual sea el
          punto: el corte está en $a+1$. Es una propiedad característica de
          $e^{-x}$ y conviene reconocerla.

      - tipo: calcular
        titulo: El punto óptimo
        pregunta: |
          ¿Cuál es la abscisa $a$ del punto que maximiza el área?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.3678794'
            mensaje: |
              $\frac1e \approx 0{,}368$ es la **ordenada** $b$ del punto
              óptimo, no su abscisa.
          - valor: '2'
            mensaje: |
              2 saldría de resolver mal $\frac{d}{da}\left[(1+a)^{2}e^{-a}
              \right] = 0$. Al factorizar queda $(1+a)(1-a)$, cuya raíz
              positiva es 1.
          - valor: '-1'
            mensaje: |
              $-1$ es la otra raíz, la que anula $(1+a)$. Queda fuera: el
              enunciado exige el **primer cuadrante**, o sea $a>0$.
        pista: |
          $A(a) = \frac12(1+a)^{2}e^{-a}$. Deriva y factoriza.
        desarrollo: |
          El triángulo tiene por catetos los dos cortes:

          $$
          A(a) = \frac12\cdot\underbrace{(1+a)}_{\text{base}}
          \cdot\underbrace{e^{-a}(1+a)}_{\text{altura}}
          = \frac12(1+a)^{2}e^{-a}
          $$

          Derivando el producto:

          $$
          A'(a) = \frac12\left[2(1+a)e^{-a}-(1+a)^{2}e^{-a}\right]
          = \frac12(1+a)e^{-a}\left[2-(1+a)\right]
          $$

          $$
          A'(a) = \frac12(1+a)\,e^{-a}\,(1-a)
          $$

          Se anula en $a=-1$ y $a=1$. Como $e^{-a}>0$ y $1+a>0$ en el primer
          cuadrante, el signo lo decide $(1-a)$:

          - $A'>0$ para $a<1$
          - $A'<0$ para $a>1$

          **Máximo en $a=1$.**
        veredicto: |
          Factorizar antes de igualar a cero ahorra resolver una cuadrática y
          además deja el estudio del signo hecho. Merece la pena siempre.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La ligadura.** $P$ está sobre la curva, luego $b=e^{-a}$ y el
              problema tiene **una** sola incógnita.
          - texto: |
              **La tangente** en $\left(a,e^{-a}\right)$ es
              $y = e^{-a}\left(1+a-x\right)$, y corta a los ejes en
              $(1+a,\,0)$ y en $\left(0,\,e^{-a}(1+a)\right)$.
          - texto: |
              **La función objetivo:**
              $A(a) = \frac12(1+a)^{2}e^{-a}$, definida para $a>0$.
          - texto: |
              **Derivar y factorizar:**
              $A'(a) = \frac12(1+a)e^{-a}(1-a)$, que en $a>0$ solo se anula en
              $a=1$.
          - texto: |
              **Comprobar que es máximo** por el cambio de signo de $A'$, y dar
              el punto: $P = \left(1,\frac1e\right)$, con
              $A_{\max} = \frac2e$.
          - texto: |
              Como el dominio $a>0$ es abierto y no acotado, basta con que
              $A'(a)=0$ para garantizar que $a=1$ es máximo absoluto.
            trampa: true
            mensaje: |
              Anular la derivada no garantiza nada por sí solo: podría ser un
              mínimo o un punto de inflexión. Hay que **estudiar el signo** de
              $A'$ a los dos lados, o la segunda derivada. Y en un dominio
              abierto y no acotado hay que mirar además el comportamiento en los
              extremos: aquí $A(0^{+}) = \frac12$ y $A(a)\to0$ cuando
              $a\to\infty$, los dos menores que $\frac2e \approx 0{,}736$, así
              que el máximo local **sí** es absoluto — pero eso hay que
              comprobarlo, no suponerlo.
        veredicto: |
          Justificar que un punto crítico es máximo es exactamente lo que valen
          los 2 puntos de COMP4 de este ejercicio. Sin esa justificación, la
          cuenta está pero la nota no.

    resolucion: |
      **Datos.** $P=(a,b)$ en el primer cuadrante sobre $f(x)=e^{-x}$. La
      tangente en $P$ y los ejes forman un triángulo; se pide $P$ que maximice
      su área.

      ### 1 · El método, y el primer paso que decide todo

      Todo problema de optimización tiene el mismo esqueleto:

      1. **Identificar la ligadura**, que reduce las incógnitas a una.
      2. Escribir la **función objetivo** en función de esa única variable.
      3. Derivar, anular y **justificar** que el punto hallado es el extremo
         pedido.

      Aquí la ligadura es «$P$ pertenece a la curva»:

      $$
      b = e^{-a}, \qquad a>0
      $$

      El problema tiene **una** incógnita, no dos.

      ### 2 · La tangente y sus cortes

      $$
      f(x) = e^{-x} \;\Longrightarrow\; f'(x) = -e^{-x}
      $$

      Tangente en $\left(a,e^{-a}\right)$:

      $$
      y-e^{-a} = -e^{-a}(x-a)
      \;\Longrightarrow\;
      y = e^{-a}\left(1+a-x\right)
      $$

      | corte | se obtiene con | vale |
      |---|---|---|
      | eje $OX$ | $y=0$ | $x = 1+a$ |
      | eje $OY$ | $x=0$ | $y = e^{-a}(1+a)$ |

      Nótese que el corte con $OX$ está siempre **una unidad** a la derecha del
      punto de tangencia: la subtangente de la exponencial es constante e igual
      a 1.

      ### 3 · La función objetivo

      El triángulo es rectángulo con catetos sobre los ejes:

      $$
      A(a) = \frac12\,(1+a)\cdot e^{-a}(1+a)
      = \frac12\,(1+a)^{2}e^{-a}
      $$

      ### 4 · Optimizar

      $$
      A'(a) = \frac12\left[2(1+a)e^{-a}+(1+a)^{2}\left(-e^{-a}\right)\right]
      $$

      **Factorizando** $(1+a)e^{-a}$, que es lo que evita resolver una
      cuadrática:

      $$
      A'(a) = \frac12(1+a)e^{-a}\left[2-(1+a)\right]
      = \frac12(1+a)\,e^{-a}\,(1-a)
      $$

      En $a>0$ los factores $(1+a)$ y $e^{-a}$ son positivos, así que el signo
      de $A'$ es el de $(1-a)$:

      | $a$ | $A'$ | $A$ |
      |---|---|---|
      | $0<a<1$ | $+$ | crece |
      | $a=1$ | $0$ | **máximo** |
      | $a>1$ | $-$ | decrece |

      $$
      a = 1, \qquad b = e^{-1} = \frac1e
      $$

      $$
      \boxed{P = \left(1,\ \frac1e\right)}
      $$

      $$
      A_{\max} = \frac12\cdot2^{2}\cdot e^{-1} = \frac{2}{e} \approx 0{,}7358
      $$

      ### 5 · Por qué el máximo es absoluto

      El dominio $a>0$ es **abierto y no acotado**, así que un máximo local no
      tiene por qué ser absoluto. Hay que mirar los extremos:

      $$
      \lim_{a\to0^{+}}A(a) = \frac12,
      \qquad
      \lim_{a\to\infty}A(a) = 0
      $$

      —la exponencial gana al polinomio—. Los dos son menores que
      $\frac2e \approx 0{,}736$, luego el máximo local **sí** es absoluto.

      Este párrafo es lo que valen los 2 puntos de COMP4. Sin él la cuenta está
      completa y la respuesta también, pero la justificación no.

      ### 6 · Comprobación

      **Por la segunda derivada.** Derivando
      $A'(a) = \frac12\left(1-a^{2}\right)e^{-a}$:

      $$
      A''(a) = \frac12\left[-2a-\left(1-a^{2}\right)\right]e^{-a}
      $$

      $$
      A''(1) = \frac12\left[-2-0\right]e^{-1} = -\frac{1}{e} < 0
      $$

      Negativa: **máximo** ✔

      **Numéricamente**, evaluando el área a los lados:

      | $a$ | $A(a)$ |
      |---|---|
      | $0{,}5$ | $0{,}682$ |
      | $1$ | $\mathbf{0{,}736}$ |
      | $1{,}5$ | $0{,}697$ |

      El de $a=1$ es el mayor ✔

      **De coherencia geométrica.** En el óptimo la base mide $1+1 = 2$ y la
      altura $e^{-1}\cdot2 = \frac2e$, luego
      $A = \frac12\cdot2\cdot\frac2e = \frac2e$ ✔
