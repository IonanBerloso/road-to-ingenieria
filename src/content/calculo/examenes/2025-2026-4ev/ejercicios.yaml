      <figcaption>
      Figura redibujada del enunciado original. Diez curvas de nivel, todas
      la misma cúbica trasladada en vertical; el tono de las bandas cambia de forma
      monótona hacia la derecha, que es donde la altura es mayor. P está sobre la
      curva 7 y Q, sobre la misma curva, en el punto donde su tangente es
      horizontal.
      </figcaption>
      </figure>

      a) Identifica entre los vectores $u$, $v$ y $w$ el vector gradiente en
      $P$. Razona tu respuesta.

      b) Identifica cuál de las siguientes curvas corresponde a la curva de
      nivel de $P$. Razona tu respuesta.

      $$
      \text{A. } (x-1)^{3} - y^{2} = -5
      \qquad
      \text{B. } 3x + y = 3
      \qquad
      \text{C. } (x-1)^{3} - y = -3
      $$

      c) ¿En qué altura se encuentra el punto $P$?

      d) Si nos desplazamos desde el punto $P$ siguiendo las direcciones $u$,
      $v$ y $w$, ¿cuál será la velocidad de cambio de la altura en cada una de
      esas direcciones?

      e) La recta tangente a la curva de nivel en el punto $Q$ es paralela a la
      recta $y = 0$. Sabiendo que el valor máximo de la velocidad de cambio de
      la altura en ese punto es 1, calcula el vector gradiente en el punto $Q$.

      f) Supongamos que en un punto $R$ el gradiente es nulo. ¿Qué
      interpretación geométrica podríamos dar sobre dicho punto $R$ en este
      contexto de la montaña?
    pide: Leer el gradiente, la curva de nivel y la altura de un mapa de niveles.

    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de mirar el dibujo: ¿qué dos cosas sabes siempre del gradiente
          respecto de la curva de nivel que pasa por el mismo punto?
        opciones:
          - texto: >-
              Que es perpendicular a ella, y que apunta hacia donde la función
              crece
            correcta: true
            mensaje: |
              Eso es, y con esas dos basta para el apartado a): de los tres
              vectores, el gradiente es el que cruza las curvas —no el que las
              sigue— y de los dos que las cruzan, el que va hacia los números
              grandes.
          - texto: Que es tangente a ella, y que su módulo es la pendiente máxima
            mensaje: |
              Tangente a la curva de nivel es la dirección en la que la altura
              **no cambia**: justo la contraria de la que más cambia. El módulo
              sí es la velocidad máxima de cambio.
          - texto: >-
              Que es perpendicular a ella, y que apunta hacia donde la función
              decrece
            mensaje: |
              Perpendicular sí, pero el sentido está del revés. El gradiente
              apunta hacia el ascenso más rápido; el que baja es $-\nabla f$.
          - texto: Que su dirección depende de la parametrización de la curva
            mensaje: |
              No depende de nada de eso. El gradiente se calcula con las
              derivadas parciales de $f$ y existe con independencia de cómo
              recorras la curva de nivel.

      - tipo: reconocer
        titulo: Apartado a) — cuál de los tres es el gradiente
        pregunta: |
          Mira las tres flechas del dibujo. ¿Cuál es $\nabla f(P)$?
        opciones:
          - texto: $w$
            correcta: true
            mensaje: |
              Correcto. $w$ es el único que cruza las curvas de nivel **hacia
              los números mayores**: sale de la curva 7 y va hacia la 8, la 9,
              la 10. $u$ va pegado a la propia curva de nivel y $v$ cruza, sí,
              pero hacia los números pequeños.
          - texto: $u$
            mensaje: |
              $u$ sigue la curva de nivel: sale de $P$ y va hacia $Q$ por
              encima de la misma curva. Por ahí la altura no cambia, así que
              esa es exactamente la dirección donde la derivada direccional
              vale cero.
          - texto: $v$
            mensaje: |
              $v$ tiene la dirección buena —es perpendicular a la curva de
              nivel— pero el sentido contrario: apunta hacia la zona de los
              números pequeños. $v$ es la dirección de $-\nabla f$, la de
              máximo descenso.
          - texto: >-
              Ninguno: el gradiente no se puede leer de un mapa de niveles
            mensaje: |
              Sí se puede, y es lo que pide el ejercicio. Del mapa se lee la
              dirección y el sentido; lo que no se lee sin más datos es el
              módulo.

      - tipo: reconocer
        titulo: Apartado b) — cuál de las tres curvas
        pregunta: |
          De las tres candidatas, ¿cuál es la curva de nivel que pasa por
          $P(0,2)$?
        opciones:
          - texto: $\text{C. } (x-1)^{3} - y = -3$
            correcta: true
            mensaje: |
              Sí. Pasa por $P$ —$(-1)^{3}-2 = -3$— y además es la única que
              explica el dibujo: despejada es $y = (x-1)^{3}+3$, una cúbica con
              su punto de inflexión y tangente **horizontal** justo en
              $(1,3)$, que es donde está $Q$. Todas las curvas del mapa tienen
              esa misma forma de ese tumbada.
          - texto: $\text{A. } (x-1)^{3} - y^{2} = -5$
            mensaje: |
              Cuidado, que esta **también pasa por $P$**: $(-1)^{3}-2^{2} = -5$.
              Por eso no basta con sustituir. Lo que la descarta es la forma:
              al llevar $y^{2}$ es simétrica respecto del eje $x$, así que
              tendría dos ramas y tangente vertical donde corta a $y=0$. En el
              dibujo no hay nada de eso.
          - texto: $\text{B. } 3x + y = 3$
            mensaje: |
              Ni siquiera pasa por $P$: $3\cdot 0 + 2 = 2 \neq 3$. Y además es
              una recta, y en el mapa no hay ninguna curva de nivel recta.
          - texto: Las tres, porque una curva de nivel no es única
            mensaje: |
              Por un punto pasa **una sola** curva de nivel, la del valor
              $f(P)$. Otra cosa es que haya infinitas curvas de nivel en el
              mapa, una por cada altura.

      - tipo: calcular
        titulo: Apartado c) — la altura de P
        pregunta: |
          ¿A qué altura está $P$, según las etiquetas del mapa?
        respuesta:
          tipo: numero
          valor: '7'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '8'
            mensaje: |
              El 8 es la etiqueta que te queda **a la derecha** de $P$, a su
              misma altura de dibujo. Pero la etiqueta va sobre su curva, y esa
              curva no es la que pasa por $P$: la de $P$ es la que sube hasta
              $Q$ y lleva el 7.
          - valor: '2'
            mensaje: |
              2 es la coordenada $y$ de $P$, no su altura. La altura es el
              valor de $f$, y en un mapa de niveles se lee en la etiqueta de la
              curva.
          - valor: '3'
            mensaje: |
              3 sale de la ecuación de la curva ($y = (x-1)^{3}+3$), y es la
              constante que la desplaza, no el nivel. El nivel lo dice la
              etiqueta: 7.
        pista: |
          Sigue con el dedo la curva que pasa por $P$ hacia arriba y a la
          derecha: pasa por $Q$ y sale del dibujo. ¿Qué número lleva?
        desarrollo: |
          La curva que pasa por $P$ es la misma que pasa por $Q$ —se ve
          siguiéndola— y lleva la etiqueta **7**. Así que

          $$
          f(P) = f(0,2) = 7 \text{ m}
          $$

          Conviene decirlo en el examen: la altura no se calcula, **se lee**.
          El dato está en el dibujo y el mapa es la única fuente que hay,
          porque $f$ no se da en ningún sitio.

      - tipo: calcular
        titulo: Apartado d) — la velocidad de cambio en la dirección de u
        pregunta: |
          ¿Cuánto vale la derivada direccional de la altura en $P$ siguiendo
          la dirección de $u$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 no sale de ningún sitio aquí; el 1 del enunciado es el valor
              máximo en $Q$, que es otro punto y otro apartado. Piensa qué le
              pasa a la altura cuando te mueves **por encima de una curva de
              nivel**.
          - valor: '7'
            mensaje: |
              7 es la altura de $P$, no su velocidad de cambio. Una es cuánto
              vale $f$; la otra, cuánto varía.
        pista: |
          $u$ va pegado a la curva de nivel que pasa por $P$. Por definición,
          una curva de nivel es el conjunto de puntos donde $f$ vale lo mismo.
        desarrollo: |
          $u$ es tangente a la curva de nivel en $P$, y sobre una curva de
          nivel la altura **es constante**. Por tanto

          $$
          D_{u}f(P) = \nabla f(P)\cdot \frac{u}{\lVert u\rVert} = 0
          $$

          Los otros dos no dan un número —el mapa no da el módulo del
          gradiente en $P$— pero sí su signo y su carácter extremo, que es lo
          que el apartado pide:

          - En la dirección de $w = \nabla f(P)$ la altura **crece**, y lo hace
            a la máxima velocidad posible en $P$: $\lVert \nabla f(P)\rVert$.
          - En la dirección de $v$, que es la opuesta, la altura **decrece**, y
            a esa misma velocidad máxima: $-\lVert \nabla f(P)\rVert$.

          Que $v$ sea más corto que $w$ en el dibujo no cambia nada: la
          derivada direccional se toma sobre el vector **unitario**, así que
          solo cuenta hacia dónde apuntan.

      - tipo: calcular
        titulo: Apartado e) — la segunda componente del gradiente en Q
        pregunta: |
          En $Q$ la tangente a la curva de nivel es horizontal y el valor
          máximo de la velocidad de cambio es 1. La primera componente de
          $\nabla f(Q)$ es 0. ¿Cuánto vale la segunda?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              El módulo sí es 1, pero el signo va al revés. Sube desde $Q$ en
              vertical y mira las etiquetas: te alejas del 7 hacia el 6 y el 5.
              Si al subir en $y$ la altura baja, la componente $y$ del gradiente
              es negativa.
          - valor: '0'
            mensaje: |
              Si las dos componentes fueran 0 el gradiente sería nulo, y
              entonces la velocidad máxima de cambio sería 0, no 1.
        pista: |
          El gradiente es perpendicular a la tangente. Si la tangente es
          horizontal, el gradiente es vertical: $\nabla f(Q) = (0, k)$. Y
          $\lVert\nabla f(Q)\rVert = 1$ obliga a $|k| = 1$.
        desarrollo: |
          **La dirección.** La tangente a la curva de nivel en $Q$ es paralela
          a $y = 0$, es decir horizontal. El gradiente es perpendicular a ella,
          luego es vertical:

          $$ \nabla f(Q) = (0,\,k) $$

          **El módulo.** El valor máximo de la velocidad de cambio en un punto
          es $\lVert\nabla f\rVert$. Como vale 1,

          $$ \lVert (0,k)\rVert = |k| = 1 \;\Longrightarrow\; k = \pm 1 $$

          **El signo, que es lo que hay que razonar.** El gradiente apunta
          hacia donde $f$ crece. Subiendo en vertical desde $Q$ se pasa de la
          curva 7 a las de valor menor, así que en esa dirección la altura
          **baja**. Por tanto $k < 0$ y

          $$ \nabla f(Q) = (0,\,-1) $$

      - tipo: justificar
        titulo: Apartado f) — qué es un punto de gradiente nulo en una montaña
        pregunta: Ordena la respuesta al apartado f). Una pieza es falsa.
        piezas:
          - texto: >-
              Si $\nabla f(R) = 0$, las dos derivadas parciales se anulan, así
              que $R$ es un punto crítico de $f$.
          - texto: >-
              Entonces la derivada direccional en $R$ vale 0 en **todas** las
              direcciones: te muevas hacia donde te muevas, la altura no
              empieza a cambiar.
          - texto: >-
              Geométricamente, el plano tangente a la superficie en $R$ es
              horizontal.
          - texto: >-
              En la montaña eso es un sitio llano: una cima, el fondo de un
              hoyo o un collado entre dos cumbres.
          - texto: >-
              Como el gradiente se anula, $R$ es necesariamente la cima del
              Mauna Kea.
            trampa: true
            mensaje: |
              Anularse no dice **de qué tipo** es el punto. Un fondo de valle y
              un collado también tienen gradiente nulo, y el collado es el caso
              interesante: es llano y no es ni lo más alto ni lo más bajo. Para
              distinguirlos hace falta mirar las segundas derivadas, o las
              propias curvas de nivel alrededor.

    resolucion: |
      El ejercicio entero se resuelve **sin saber quién es $f$**, y conviene
      decírselo al corrector en la primera línea: todo sale de las dos
      propiedades del gradiente y de leer el mapa.

      ## a) El gradiente es w

      El gradiente cumple dos cosas: es perpendicular a la curva de nivel y
      apunta hacia donde $f$ crece.

      - $u$ va **a lo largo** de la curva de nivel que pasa por $P$ —se ve que
        la sigue hacia $Q$—, así que no puede ser el gradiente. Es la dirección
        de cambio nulo.
      - $v$ y $w$ cruzan las curvas, luego los dos son perpendiculares a ella,
        pero son opuestos. El que va hacia los números **grandes** —hacia el 8,
        el 9, el 10— es $w$.

      Así que $\nabla f(P)$ tiene la dirección y el sentido de $w$. El mapa no
      da su módulo.

      ## b) La curva es la C

      **B** se descarta de dos formas: no pasa por $P$ ($3\cdot 0 + 2 = 2 \neq 3$)
      y además es una recta, y en el mapa no hay curvas rectas.

      **A pasa por $P$**, así que sustituir no basta:

      $$ (0-1)^{3} - 2^{2} = -1 - 4 = -5 \quad\checkmark $$

      Lo que la descarta es la forma. Al llevar $y^{2}$, la ecuación
      $y^{2} = (x-1)^{3}+5$ es simétrica respecto del eje $x$: para cada $x$
      da dos valores opuestos de $y$, y tiene tangente vertical donde corta a
      $y=0$. Las curvas del mapa no son simétricas ni tienen tangentes
      verticales.

      **C** pasa por $P$ y explica el dibujo:

      $$
      (0-1)^{3} - 2 = -3 \quad\checkmark
      \qquad\text{y despejando}\qquad y = (x-1)^{3} + 3
      $$

      que es una cúbica con punto de inflexión y tangente horizontal en
      $(1,3)$ — exactamente donde está $Q$, y exactamente lo que el apartado e)
      da por sabido. Además todas las curvas del mapa tienen esa misma forma,
      que es lo que se espera de una familia $f(x,y) = \text{cte}$ cuando las
      curvas son trasladadas verticales unas de otras.

      ## c) La altura de P es 7 m

      Se lee: la curva que pasa por $P$ es la que lleva la etiqueta **7**.
      Es la misma que pasa por $Q$, así que $f(P) = f(Q) = 7$.

      ## d) Cero, máximo y mínimo

      | dirección | velocidad de cambio de la altura |
      |---|---|
      | $u$, tangente a la curva de nivel | $0$ — la altura no cambia |
      | $w$, la del gradiente | $+\lVert\nabla f(P)\rVert$, la mayor posible |
      | $v$, la opuesta al gradiente | $-\lVert\nabla f(P)\rVert$, la menor posible |

      Con el mapa no se puede poner un número a las dos últimas, porque no da
      el módulo del gradiente en $P$; sí se puede decir que una es la máxima
      subida y la otra la máxima bajada. Y ojo: la derivada direccional se
      define sobre el vector **unitario**, así que la longitud con la que estén
      dibujadas las flechas no interviene.

      ## e) El gradiente en Q es (0, −1)

      Tangente horizontal $\Rightarrow$ gradiente vertical $\Rightarrow$
      $\nabla f(Q) = (0,k)$. Velocidad máxima 1 $\Rightarrow |k| = 1$.
      Y subiendo desde $Q$ la altura baja —se pasa del 7 hacia el 6 y el 5—,
      luego $k = -1$:

      $$ \nabla f(Q) = (0,\,-1) $$

      ## f) Un punto llano

      $\nabla f(R) = 0$ significa que **todas** las derivadas direccionales en
      $R$ son nulas, o sea que el plano tangente a la superficie es horizontal.
      En la montaña, eso es un sitio llano. Puede ser una cima, el fondo de un
      hoyo o un collado; el gradiente por sí solo no distingue cuál.

  - id: ex2526-4ev-2-la-pieza-de-dos-materiales
    titulo: Dos materiales, y dónde hay que poner el vértice
    fuente: >-
      Ejercicio 2 · Cuarta evaluación, 23 de marzo de 2026 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
