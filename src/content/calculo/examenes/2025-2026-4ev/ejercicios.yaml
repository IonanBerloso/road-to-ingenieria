ejercicios:
  - id: ex2526-4ev-1-el-mapa-del-mauna-kea
    titulo: El mapa del Mauna Kea, leído sin conocer la función
    fuente: >-
      Ejercicio 1 · Cuarta evaluación, 23 de marzo de 2026 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Sea $z = f(x,y)$ la función que modeliza la altura de parte de la
      superficie de la montaña Mauna Kea en Hawai. Para cada $(x,y)$,
      $z = f(x,y)$ representa la altura (m) sobre el nivel del mar de dicho
      punto de la superficie. En la siguiente imagen se han representado
      diferentes curvas de nivel de $f$, un punto $P$ sobre la superficie y
      tres vectores $u$, $v$, $w$ desde $P$.

      <figure class="figura-examen">
      <svg viewBox="0 0 600 552" role="img" width="600" height="552"
