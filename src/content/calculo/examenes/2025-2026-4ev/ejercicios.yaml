        <title id="mk-t">Mapa de curvas de nivel con el punto P y los vectores u, v y w</title>
        <desc id="mk-d">Diez curvas de nivel casi verticales, todas con la misma forma
        de ese tumbada, etiquetadas de menos diez a la izquierda hasta veinte a la
        derecha. El tono de las bandas cambia de forma monotona hacia la derecha. El punto P esta en cero
        coma dos, sobre la curva etiquetada siete, y el punto Q en uno coma tres,
        sobre la misma curva, justo donde esa curva tiene tangente horizontal. Desde P
        salen tres flechas: u sube hacia la derecha siguiendo la propia curva de
        nivel, w apunta hacia la derecha y algo hacia abajo cruzando las curvas hacia
        valores mayores, y v apunta en sentido contrario a w y es mas corta.</desc>
