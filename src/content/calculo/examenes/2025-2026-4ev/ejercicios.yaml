      pendiente de revisión.
    nivel: examen
    puntos:
      comp2: 7
      comp4: 3
    enunciado: |
      La siguiente integral representa la masa de un sólido $S$:

      $$
      M_{S} = \int_{-3}^{3}\!\left(\int_{0}^{\sqrt{9-y^{2}}}\!\left(
      \int_{x^{2}+y^{2}-12}^{-\sqrt{x^{2}+y^{2}}} x \; dz\right) dx\right) dy
      $$

      a) Dibujar el sólido.

      b) Calcular la masa.
    pide: Reconocer el sólido a partir de los límites y calcular la masa.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos límites de la integral en $z$ son
          $z = x^{2}+y^{2}-12$ y $z = -\sqrt{x^{2}+y^{2}}$. ¿Qué son?
        opciones:
          - texto: >-
              Un paraboloide con vértice en $(0,0,-12)$ que abre hacia arriba,
              y la hoja de abajo de un cono con vértice en el origen
            correcta: true
            mensaje: |
              Exacto. En cilíndricas son $z = r^{2}-12$ y $z=-r$: el
              paraboloide es el suelo del sólido y el cono, el techo. Los dos
              son superficies de revolución alrededor del eje $z$.
          - texto: Dos paraboloides, uno desplazado
            mensaje: |
              El segundo no lo es: lleva **raíz**, no cuadrado. $z=-\sqrt{r^{2}}
              = -r$ es lineal en $r$, y una recta que se gira alrededor del eje
              da un cono.
          - texto: Un paraboloide y un hemisferio
            mensaje: |
              Un hemisferio sería $z=-\sqrt{R^{2}-x^{2}-y^{2}}$, con la suma
              **restándose** dentro de la raíz. Aquí la suma va sumando, y eso
              da un cono, no una esfera.
          - texto: Un cilindro y un plano inclinado
            mensaje: |
              Ninguna de las dos depende de $x$ e $y$ por separado, así que no
              hay planos inclinados; y las dos dependen de $r$, así que
              tampoco hay cilindros de radio fijo.

      - tipo: calcular
        titulo: Dónde se cortan las dos superficies
        pregunta: |
          ¿A qué distancia $r$ del eje $z$ se cortan el cono y el paraboloide?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-4'
            mensaje: |
              $-4$ es la otra raíz de $r^{2}+r-12=0$, y hay que descartarla:
              $r$ es una distancia y no puede ser negativa.
          - valor: '12'
            mensaje: |
              12 es la profundidad del vértice del paraboloide, no el radio del
              corte. Iguala las dos alturas y resuelve la ecuación de segundo
              grado.
          - valor: '3.4641'
            mensaje: |
              $\sqrt{12}$ es donde el paraboloide corta al plano $z=0$, que no
              es donde corta al cono. El cono no está en $z=0$ salvo en su
              vértice.
        pista: |
          Iguala $r^{2}-12 = -r$ y resuelve. Y fíjate en que ese radio tiene
          que coincidir con el que dan los límites de $x$ e $y$.
        desarrollo: |
          $$
          r^{2}-12 = -r
          \;\Longrightarrow\;
          r^{2}+r-12 = 0
          \;\Longrightarrow\;
          r = \frac{-1\pm 7}{2} = 3 \;\text{ o }\; -4
          $$

          Como $r\ge 0$, el corte está en $r=3$, a la altura $z=-3$.

          Y aquí está la comprobación que da tranquilidad: los límites de $x$ e
          $y$ del enunciado son $-3\le y\le 3$ y
          $0\le x\le\sqrt{9-y^{2}}$, o sea $x^{2}+y^{2}\le 9$ con $x\ge 0$.
          El disco de radio **3**. La proyección del sólido y el corte de las
          dos superficies coinciden, como tenía que ser.

      - tipo: calcular
        titulo: La masa
        pregunta: |
          Pasando a cilíndricas, ¿cuánto vale $M_{S}$?
        respuesta:
          tipo: numero
          valor: '78.3'
          tolerancia: 0.005
          formato: en forma exacta o con dos decimales
        distractores:
          - valor: '39.15'
            mensaje: |
              La mitad. Sale de tomar $\theta$ entre $0$ y $\pi/2$: pero
              $x\ge 0$ es **medio** disco, no un cuarto, así que $\theta$ va de
              $-\pi/2$ a $\pi/2$ y $\int\cos\theta\,d\theta = 2$, no 1.
          - valor: '0'
            mensaje: |
              Saldría 0 si el disco fuera entero: $\int_{0}^{2\pi}\cos\theta\,
              d\theta = 0$, y por simetría la densidad $x$ se compensaría. Pero
              aquí solo está la mitad con $x\ge 0$, donde la densidad es
              positiva, así que la masa tiene que ser positiva.
          - valor: '245.99'
            mensaje: |
              $78{,}3\pi$: has metido un $\pi$ de más al integrar en $\theta$.
              Ojo, que aquí la integral angular no es $2\pi$ ni $\pi$, sino
              $\int_{-\pi/2}^{\pi/2}\cos\theta\,d\theta = 2$, porque la
              densidad depende de $\theta$.
          - valor: '69.3'
            mensaje: |
              Sale de olvidar uno de los tres sumandos. Al desarrollar
              $r^{2}\left[(-r)-(r^{2}-12)\right]$ quedan **tres** términos:
              $12r^{2}-r^{3}-r^{4}$.
        pista: |
          En cilíndricas $x = r\cos\theta$ y $dV = r\,dz\,dr\,d\theta$, así que
          el integrando es $r^{2}\cos\theta$. El factor angular sale fuera:
          $\int_{-\pi/2}^{\pi/2}\cos\theta\,d\theta = 2$.
        desarrollo: |
          $$
          M_{S}=\int_{-\pi/2}^{\pi/2}\!\!\int_{0}^{3}\!\!\int_{r^{2}-12}^{-r}
          (r\cos\theta)\,r\,dz\,dr\,d\theta
          $$

          El ángulo se separa porque nada más depende de $\theta$:

          $$
          M_{S}=\left(\int_{-\pi/2}^{\pi/2}\cos\theta\,d\theta\right)
          \int_{0}^{3} r^{2}\Big[(-r)-(r^{2}-12)\Big]dr
          = 2\int_{0}^{3}\left(12r^{2}-r^{3}-r^{4}\right)dr
          $$

          $$
          = 2\left[4r^{3}-\frac{r^{4}}{4}-\frac{r^{5}}{5}\right]_{0}^{3}
          = 2\left(108-\frac{81}{4}-\frac{243}{5}\right)
          = 2\cdot\frac{783}{20}
          = \frac{783}{10} = 78{,}3
          $$

      - tipo: justificar
        titulo: Por qué el ángulo va de −π/2 a π/2
        pregunta: >-
          Ordena la justificación del cambio a cilíndricas. Una pieza es falsa.
        piezas:
          - texto: >-
              Los límites $-3\le y\le 3$ y $0\le x\le\sqrt{9-y^{2}}$ describen
              el medio disco $x^{2}+y^{2}\le 9$ con $x\ge 0$.
          - texto: >-
              En polares, $r$ va de 0 a 3 y la condición $x\ge 0$ es
              $\cos\theta\ge 0$, o sea $-\pi/2\le\theta\le\pi/2$.
          - texto: >-
              El jacobiano del cambio aporta un factor $r$, así que
              $dV = r\,dz\,dr\,d\theta$.
          - texto: >-
              La densidad es $x = r\cos\theta$, luego el integrando completo es
              $r^{2}\cos\theta$.
          - texto: >-
              Como el sólido es de revolución, la integral en $\theta$ vale
              $2\pi$ y sale fuera sin más.
            trampa: true
            mensaje: |
              El **sólido** es medio cuerpo de revolución, pero la **densidad**
              no: vale $x$, que cambia con el ángulo. En cuanto el integrando
              depende de $\theta$, la integral angular deja de ser un factor
              geométrico. Aquí vale
              $\int_{-\pi/2}^{\pi/2}\cos\theta\,d\theta = 2$. Si se hubiera
              tomado $2\pi$ el resultado se multiplicaría por $\pi$; y si el
              disco fuera entero, la masa saldría 0.

    resolucion: |
      El ejercicio va al revés de lo habitual: la integral está dada y hay que
      **reconstruir el sólido** a partir de ella. Conviene leerla de dentro
      hacia fuera.

      ## a) El sólido

      **La integral de dentro** dice entre qué dos superficies está encerrado,
      para cada $(x,y)$:

      - suelo: $z = x^{2}+y^{2}-12$, un paraboloide de revolución con vértice
        en $(0,0,-12)$ que abre hacia arriba;
      - techo: $z = -\sqrt{x^{2}+y^{2}}$, la hoja **inferior** de un cono con
        vértice en el origen.

      **Las dos de fuera** dicen sobre qué región del plano: $-3\le y\le 3$ y
      $0\le x\le\sqrt{9-y^{2}}$, es decir el medio disco $x^{2}+y^{2}\le 9$ con
      $x\ge 0$.

      Y las dos cosas encajan, lo cual es la comprobación de que se ha leído
      bien: igualando $r^{2}-12=-r$ sale $r^{2}+r-12=0$, con raíces $3$ y $-4$;
      descartada la negativa, las superficies se cortan justo en $r=3$, a la
      altura $z=-3$ — el borde del medio disco.

      Así que $S$ es la mitad —la de $x\ge 0$— del cuerpo que queda atrapado
      entre el cuenco del paraboloide y el embudo del cono, desde el vértice
      del paraboloide en $z=-12$ hasta la circunferencia de corte.

