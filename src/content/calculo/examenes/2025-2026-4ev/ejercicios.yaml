    pide: El valor de a que pone el centro de masa en el origen.

    pasos:
      - tipo: reconocer
        pregunta: |
          «El centro de masa está en $(0,0)$». ¿Qué condición hay que imponer
          de verdad?
        opciones:
          - texto: >-
              Que el momento estático respecto del eje $y$ sea nulo,
              $\iint_{D} x\,\rho\,dA = 0$
            correcta: true
            mensaje: |
              Eso es. $\overline{x} = 0$ equivale a que se anule el numerador,
              porque la masa total no es cero. Y $\overline{y}=0$ sale gratis:
              la pieza es simétrica respecto del eje $x$.
          - texto: Que las dos partes tengan la misma masa
            mensaje: |
              No. Lo que tiene que compensarse no es la masa, es la masa
              **por su distancia** al eje. Una pieza pesada muy cerca del eje
              equilibra a otra ligera muy lejos: es la ley de la palanca.
          - texto: Que las dos partes tengan la misma área
            mensaje: |
              Menos aún: las densidades son distintas, así que ni siquiera con
              áreas iguales las masas serían iguales. Y aunque lo fueran, lo
              que cuenta es el momento.
          - texto: >-
              Que $\overline{x}$ de cada parte por separado valga 0
            mensaje: |
              Eso sería pedir que cada trozo estuviera equilibrado por su
              cuenta, que es mucho más fuerte y aquí es imposible: la media
              elipse está entera a la izquierda del eje.

      - tipo: calcular
        titulo: El momento de la media elipse
        pregunta: |
          Para la media elipse $\{x^{2}+y^{2}/9 \le 1,\; x\le 0\}$, ¿cuánto
          vale $\iint x\,dA$ (sin la densidad)?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Signo cambiado. La media elipse está a la **izquierda** del eje
              $y$, así que todos sus puntos tienen $x\le 0$ y la integral de
              $x$ tiene que salir negativa.
          - valor: '-0.4244'
            mensaje: |
              Eso es $\overline{x} = -4/(3\pi)$, la coordenada del centroide.
              Aquí se pide el momento, que es $\overline{x}$ **por el área**:
              $-\frac{4}{3\pi}\cdot\frac{3\pi}{2} = -2$.
          - valor: '-6'
            mensaje: |
              Sale de integrar mal el semieje vertical. La anchura de la banda
              en $x$ es $2\cdot 3\sqrt{1-x^{2}}$, y al integrar $x$ por ella
              aparece $\int_{-1}^{0} 6x\sqrt{1-x^{2}}\,dx$, no $6$ a secas.
        pista: |
          Barre en $x$ de $-1$ a $0$. Para cada $x$, $y$ va de
          $-3\sqrt{1-x^{2}}$ a $3\sqrt{1-x^{2}}$, así que la banda mide
          $6\sqrt{1-x^{2}}$.
        desarrollo: |
          $$
          \iint x\,dA
          = \int_{-1}^{0} x \cdot 6\sqrt{1-x^{2}}\;dx
          = 6\left[-\tfrac13\left(1-x^{2}\right)^{3/2}\right]_{-1}^{0}
          = 6\cdot\left(-\tfrac13\right) = -2
          $$

          De paso queda el centroide, que es la forma en que suele venir en las
          tablas: el área es $\frac{\pi\cdot 1\cdot 3}{2} = \frac{3\pi}{2}$, y

          $$
          \overline{x} = \frac{-2}{3\pi/2} = -\frac{4}{3\pi} \approx -0{,}424
          $$

          que es la fórmula conocida del semicírculo, $4r/(3\pi)$, con $r=1$:
          estirar la figura en vertical no mueve su centroide en horizontal.

      - tipo: calcular
        titulo: El valor de a
        pregunta: |
          Con el aluminio a densidad $2\rho$ y el PVC a densidad $\rho$,
          ¿cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              Te has quedado en $a^{2}=4$ sin sacar la raíz. La ecuación es
              $-4\rho + \rho a^{2} = 0$, así que $a^{2}=4$ y $a=2$ (positiva,
              como pide el enunciado).
          - valor: '1.4142'
            mensaje: |
              $\sqrt{2}$ sale de olvidar el factor 2 de la densidad del
              aluminio: con densidades iguales quedaría $-2+a^{2}=0$. Pero el
              aluminio pesa el doble, y su momento también.
          - valor: '2.8284'
            mensaje: |
              $2\sqrt2$ sale de duplicar el momento del PVC en vez del del
              aluminio. Repasa cuál de los dos lleva el 2: el enunciado dice
              que la densidad del **aluminio** es el doble.
          - valor: '0.4244'
            mensaje: |
              Ese es el centroide de la media elipse en valor absoluto, no $a$.
              El centroide es un paso intermedio; $a$ sale de igualar los dos
              momentos.
        pista: |
          Momento del aluminio: $2\rho\cdot(-2)$. Momento del PVC:
          $\rho\cdot\iint_{\text{tri}} x\,dA$. Calcula el segundo e iguala la
          suma a cero.
        desarrollo: |
          **El triángulo.** Vértices $(0,3)$, $(0,-3)$ y $(a,0)$. Para cada
          $x\in[0,a]$ la banda vertical mide $6\left(1-\frac{x}{a}\right)$:

          $$
          \iint_{\text{tri}} x\,dA
          = \int_{0}^{a} 6x\left(1-\frac{x}{a}\right)dx
          = 6\left[\frac{x^{2}}{2}-\frac{x^{3}}{3a}\right]_{0}^{a}
          = 6\left(\frac{a^{2}}{2}-\frac{a^{2}}{3}\right) = a^{2}
          $$

          **La ecuación.** El momento total respecto del eje $y$ tiene que ser
          nulo:

          $$
          \underbrace{2\rho\cdot(-2)}_{\text{aluminio}}
          \;+\;
          \underbrace{\rho\cdot a^{2}}_{\text{PVC}}
          \;=\;0
          \qquad\Longrightarrow\qquad
          a^{2}=4
          \qquad\Longrightarrow\qquad
          \boxed{a = 2}
          $$

          $\rho$ se cancela, que es lo esperable: lo que importa es la
          **razón** de densidades, no su valor.

      - tipo: justificar
        titulo: El argumento, ordenado
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\overline{y}=0$ no hay que imponerlo: la pieza es simétrica
              respecto del eje $x$ y las dos densidades también, así que sale
              solo.
          - texto: >-
              $\overline{x}=0$ equivale a que el momento estático respecto del
              eje $y$ sea nulo, porque la masa total no es cero.
          - texto: >-
              El momento del aluminio es $2\rho\iint x\,dA = 2\rho(-2) = -4\rho$,
              negativo porque toda esa parte está a la izquierda.
          - texto: >-
              El momento del PVC es $\rho\,a^{2}$, positivo y creciente con
              $a$: cuanto más lejos se lleva el vértice, más tira hacia la
              derecha.
          - texto: >-
              Igualando, $a^{2}=4$, y como el enunciado pide $a>0$, la solución
              es $a=2$.
          - texto: >-
              Como el aluminio tiene el doble de densidad, el triángulo debe
              tener el doble de área que la media elipse.
            trampa: true
            mensaje: |
              Esa es la trampa de la palanca. Lo que se equilibra no son las
              masas sino los **momentos**: masa por distancia al eje. Con
              $a=2$ el triángulo tiene área $3a = 6$ y la media elipse
              $3\pi/2 \approx 4{,}71$; ni el doble, ni ninguna razón redonda.

    resolucion: |
      ## Qué hay que imponer

      El centro de masa de una pieza plana de densidad variable $\rho(x,y)$ es

      $$
      \overline{x} = \frac{\iint_{D} x\,\rho\,dA}{\iint_{D}\rho\,dA},
      \qquad
      \overline{y} = \frac{\iint_{D} y\,\rho\,dA}{\iint_{D}\rho\,dA}
      $$

      **$\overline{y}=0$ es gratis.** La pieza y las dos densidades son
      simétricas respecto del eje $x$, así que el numerador de $\overline{y}$
      se anula por simetría. Decirlo ahorra media hoja y es justo lo que la
      COMP4 valora.

      **$\overline{x}=0$** equivale a anular el numerador, porque la masa total
      es positiva. Y el numerador se parte en dos trozos, cada uno con su
      densidad constante:

      $$
      2\rho\iint_{\text{elipse}} x\,dA \;+\; \rho\iint_{\text{tri}} x\,dA \;=\; 0
      $$

      ## Los dos momentos

      **Media elipse** $x^{2}+\dfrac{y^{2}}{9}\le 1$ con $x\le 0$. Para cada
      $x\in[-1,0]$ la banda vertical mide $6\sqrt{1-x^{2}}$:

      $$
      \iint_{\text{elipse}} x\,dA = \int_{-1}^{0} 6x\sqrt{1-x^{2}}\,dx = -2
      $$

      **Triángulo** de vértices $(0,\pm 3)$ y $(a,0)$. La banda en $x$ mide
      $6\left(1-\frac{x}{a}\right)$:

      $$
      \iint_{\text{tri}} x\,dA = \int_{0}^{a} 6x\left(1-\frac{x}{a}\right)dx = a^{2}
      $$

      ## La ecuación

      $$
      2\rho\,(-2) + \rho\,a^{2} = 0
      \;\Longrightarrow\;
      a^{2} = 4
      \;\Longrightarrow\;
      a = 2
      $$

      $\rho$ desaparece: solo cuenta que una densidad sea el doble de la otra.

      ## La comprobación que conviene escribir

      Con $a=2$, el triángulo tiene área $3a = 6$ y centroide en
      $\overline{x} = a/3 = 2/3$; la media elipse, área $3\pi/2$ y centroide en
      $-4/(3\pi)$. Momentos:

      $$
      2\rho\cdot\frac{3\pi}{2}\cdot\left(-\frac{4}{3\pi}\right) = -4\rho,
      \qquad
      \rho\cdot 6\cdot\frac{2}{3} = 4\rho
      $$

      Se cancelan. Y una comprobación de sentido común que vale un punto:
      el dibujo del enunciado sitúa el vértice cerca de $x = 3{,}5$, pero eso
      es solo una posición cualquiera para poder dibujar la pieza — $a$ es
      justamente lo que se pide. La respuesta, $a=2$, cae más a la izquierda de
      lo que sugiere el dibujo, y tiene que ser así: el aluminio pesa el doble
      y tira mucho.

  - id: ex2526-4ev-3-entre-el-cono-y-el-paraboloide
