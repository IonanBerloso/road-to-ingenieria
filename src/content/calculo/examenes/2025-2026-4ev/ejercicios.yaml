      ## b) La masa

      La densidad es $x$, que en la región es $\ge 0$: coherente con que sea
      una densidad.

      En cilíndricas, $x = r\cos\theta$ y $dV = r\,dz\,dr\,d\theta$; la
      condición $x\ge 0$ es $\cos\theta\ge 0$, o sea
      $-\pi/2\le\theta\le\pi/2$:

      $$
      M_{S}=\int_{-\pi/2}^{\pi/2}\!\!\int_{0}^{3}\!\!\int_{r^{2}-12}^{-r}
      r^{2}\cos\theta \; dz\,dr\,d\theta
      $$

      La integral en $z$ solo aporta la altura del sólido en cada $r$:

      $$
      (-r)-(r^{2}-12) = 12-r-r^{2}
      $$

      que es positiva en todo $[0,3)$ y se anula justo en $r=3$, como debe ser.
      Separando el ángulo:

      $$
      M_{S} = \left(\int_{-\pi/2}^{\pi/2}\cos\theta\,d\theta\right)
      \int_{0}^{3}\left(12r^{2}-r^{3}-r^{4}\right)dr
      = 2\left(108-\frac{81}{4}-\frac{243}{5}\right)
      = \frac{783}{10}
      $$

      $$
      \boxed{M_{S} = \dfrac{783}{10} = 78{,}3}
      $$

      ## El error que cuesta el ejercicio

      Dar por hecho que, como el sólido es de revolución, el ángulo aporta
      $2\pi$. **La densidad no es de revolución**: vale $x$. Si se integrara
      sobre el disco entero, $\int_{0}^{2\pi}\cos\theta\,d\theta = 0$ y la masa
      saldría cero — lo cual es correcto para ese otro sólido, porque la mitad
      con $x<0$ tendría densidad negativa. Por eso el enunciado se queda con
      medio disco.
