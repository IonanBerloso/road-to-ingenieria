      <figcaption>
      La sección del sólido por un plano que contiene al eje OZ. La pared es el
      cilindro de radio a√2 y las dos tapas son casquetes de la esfera de radio 2a.
      Sin condición sobre z hay casquete arriba y abajo.
      </figcaption>
      </figure>

      **El área, pieza a pieza.** Son tres.

      *La pared cilíndrica.* Radio $a\sqrt2$, altura $2a\sqrt2$:

      $$
      A_{1}=2\pi\left(a\sqrt2\right)\left(2a\sqrt2\right)=8\pi a^{2}
      $$

      *Los dos casquetes.* Un casquete de una esfera de radio $R$ y altura $h$
      mide $2\pi Rh$ — una fórmula que conviene recordar porque **no depende del
      radio del casquete**. Aquí $R=2a$ y $h=2a-a\sqrt2$:

      $$
      A_{2}=2\cdot2\pi\left(2a\right)\left(2a-a\sqrt2\right)
      =8\pi a^{2}\left(2-\sqrt2\right)
      $$

      $$
      \boxed{\;A=8\pi a^{2}+8\pi a^{2}\left(2-\sqrt2\right)
      =8\pi a^{2}\left(3-\sqrt2\right)\approx39{,}86\,a^{2}\;}
      $$

      **b) El volumen.** En cilíndricas, con la altura completa
      $2\sqrt{4a^{2}-r^{2}}$ porque el sólido baja y sube:

      $$
      V=4\pi\int_{0}^{a\sqrt2}r\sqrt{4a^{2}-r^{2}}\;dr
      =4\pi\left[-\frac13\left(4a^{2}-r^{2}\right)^{3/2}
      \right]_{0}^{a\sqrt2}
      $$

      $$
      =\frac{4\pi}{3}\left[\left(4a^{2}\right)^{3/2}
      -\left(2a^{2}\right)^{3/2}\right]
      =\frac{4\pi}{3}\left(8a^{3}-2\sqrt2\,a^{3}\right)
      $$

      $$
      \boxed{\;V=\frac{8\pi}{3}a^{3}\left(4-\sqrt2\right)
      \approx21{,}66\,a^{3}\;}
      $$

      **Las dos comprobaciones de tamaño.**

      - La esfera entera mide $\frac43\pi\left(2a\right)^{3}
        =\frac{32\pi}{3}a^{3}\approx33{,}51\,a^{3}$, y el sólido es un trozo de
        ella: $21{,}66$ es el $65\,\%$. Razonable, porque el cilindro corta dos
        cuñas laterales bastante grandes.
      - El cilindro con tapas **planas** a la altura $\pm a\sqrt2$ mediría
        $\pi\left(2a^{2}\right)\left(2a\sqrt2\right)\approx17{,}77\,a^{3}$, y los
        dos casquetes añaden lo que falta hasta $21{,}66$.

      **El parámetro no complica nada.** Todas las cantidades salen
      proporcionales a $a^{2}$ y $a^{3}$, que es lo que tiene que pasar por
      homogeneidad dimensional: un área va con el cuadrado de una longitud y un
      volumen con el cubo. Si en algún paso apareciera un $a$ suelto sumado a un
      $a^{2}$, sería señal de error.

  - id: ex1314-ext-8-la-onda-cuadrada-y-el-ano-2013
    titulo: La onda cuadrada, y qué vale la serie en el año 2013
    fuente: >-
      Ejercicio 4 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 18 de
      junio de 2014 · Cálculo – Industriales y Civil, Donostiako Eskola
      Politeknikoa (UPV/EHU) · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3
    enunciado: |
      Calcular la serie de Fourier $S\left(t\right)$ de la función periódica

      $$
      y\left(t\right)=
      \begin{cases}
      -2 & -3<t<0\\
      \;\;2 & 0<t<3
      \end{cases}
      $$

      y analizar la convergencia de $S\left(t\right)$. Calcular
      $S\left(2013\right)$ y $S\left(2014\right)$.
    pide: La serie, su convergencia, y dos valores concretos.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué se puede decir de los coeficientes antes de integrar?
        opciones:
          - texto: >-
              Que todos los $a_{n}$ son cero, porque la función es **impar**
            correcta: true
            mensaje: |
              Eso es: $y\left(-t\right)=-y\left(t\right)$, y una función impar
              por un coseno par da impar, cuya integral en un intervalo simétrico
              se anula. Incluido $a_{0}$, que además es el valor medio y aquí es
              cero a ojo.
          - texto: >-
              Que todos los $b_{n}$ son cero, porque la función es par
            mensaje: |
              No es par: vale $-2$ a la izquierda y $+2$ a la derecha. Es impar,
              y lo que se anula son los cosenos.
          - texto: >-
              Que hay que calcularlos todos, porque la función es discontinua
            mensaje: |
              La discontinuidad no impide usar la simetría. Lo que sí hace es
              impedir que la serie converja a la función **en los saltos**, que es
              otra parte del ejercicio.

      - tipo: calcular
        titulo: El periodo
        pregunta: |
          ¿Cuál es el periodo de $y$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              $3$ es la longitud de **cada tramo**. El periodo completo abarca los
              dos, de $-3$ a $3$.
          - valor: '2'
            mensaje: |
              $2$ es la amplitud, el valor que toma la función. El periodo es una
              longitud sobre el eje $t$.
          - valor: '6.2831853'
            mensaje: |
              $2\pi$ es el periodo por costumbre, pero aquí el enunciado define la
              función en $\left(-3,3\right)$: el periodo es $6$, y las frecuencias
              van con $\frac{n\pi}{3}$, no con $n$.
        pista: |
          El enunciado define la función en $\left(-3,3\right)$ y la extiende
          periódicamente.
        desarrollo: |
          El intervalo de definición es $\left(-3,3\right)$, de longitud $6$:

          $$
          T=6,\qquad L=\frac{T}{2}=3,
          \qquad \omega_{n}=\frac{n\pi}{3}
          $$

          Ese $\frac{\pi}{3}$ es el que hay que arrastrar en todas las fórmulas.

      - tipo: calcular
        titulo: El valor en 2014
        pregunta: |
          ¿Cuánto vale $S\left(2014\right)$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              $2014=6\cdot335+4$, y $4$ cae en $\left(3,6\right)$, que es el tramo
              equivalente a $\left(-3,0\right)$: ahí la función vale $-2$.
          - valor: '0'
            mensaje: |
              $0$ es el valor en los saltos, y $t=4$ no es un salto: los saltos
              están en los múltiplos de $3$.
          - valor: '4'
            mensaje: |
              $4$ es el resto de dividir $2014$ entre $6$, no el valor de la
              función.
        pista: |
          $2014-6\cdot335=4$, y hay que ver dónde cae el $4$ dentro de un periodo.
        desarrollo: |
          $$
          2014=6\cdot335+4
          \;\Longrightarrow\;
          S\left(2014\right)=S\left(4\right)
          $$

          Y $4\in\left(3,6\right)$, que por periodicidad es el mismo tramo que
          $\left(-3,0\right)$: ahí $y=-2$. Como es un punto de continuidad,
          $S=y$:

          $$
          S\left(2014\right)=-2
          $$

      - tipo: justificar
        pregunta: Ordena el cálculo de $S\left(2013\right)$. Una pieza es falsa.
        piezas:
          - texto: >-
              El periodo es $6$, así que $S\left(2013\right)=S\left(r\right)$
              donde $r$ es el resto de dividir $2013$ entre $6$.
          - texto: >-
              $2013=6\cdot335+3$, así que $r=3$.
          - texto: >-
              En $t=3$ la función salta de $2$ a $-2$, y el teorema de Dirichlet
              dice que la serie converge a la semisuma:
              $\frac{2+\left(-2\right)}{2}=0$.
          - texto: >-
              Como $2013$ es impar y la función es impar, $S\left(2013\right)$
              tiene que ser negativo.
            trampa: true
            mensaje: |
              La paridad del **año** no tiene nada que ver con la paridad de la
              **función**. Lo único que importa es dónde cae $2013$ dentro de un
              periodo, y cae justo en un salto: la serie vale $0$ ahí, ni positivo
              ni negativo.
    resolucion: |
      **La función.** Es una **onda cuadrada** de amplitud $2$ y periodo $6$:
      vale $-2$ durante media onda y $+2$ durante la otra media.

      $$
      T=6,\qquad L=3,\qquad\text{frecuencias }\frac{n\pi}{3}
      $$

