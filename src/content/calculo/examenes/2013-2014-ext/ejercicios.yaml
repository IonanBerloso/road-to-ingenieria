        </g>
        <text class="aut14-l" x="295" y="65" text-anchor="end" fill="var(--flag)">tope: −10 % del billete</text>
        <text class="aut14-l" x="187" y="125.8" fill="var(--live)">∇T = (3, −5)</text>
        <text class="aut14-l" x="61" y="136.8" fill="var(--alt)">hoy</text>
      </svg>
      <figcaption>
      El plano de las dos variables. Desde el punto de este año, la flecha apunta en
      la dirección del gradiente —más publicidad, menos billete— y se detiene justo
      al tocar el tope del 10 %, que es lo que fija cuánto se avanza.
      </figcaption>
      </figure>

      **b) El uso estimado.**

      $$
      \Delta T\approx3\left(2{,}1\right)-5\left(-3{,}5\right)
      =6{,}3+17{,}5=23{,}8
      $$

      $$
      \boxed{\;T\approx450+23{,}8=473{,}8\;}
      $$

      Un $5{,}3\,\%$ más de usuarios, y de ese aumento **casi tres cuartas
      partes vienen del billete**.

      **Los supuestos, que aquí valen cinco puntos.** Este ejercicio tiene más
      COMP 4 que cálculo, y con razón: la cuenta son dos multiplicaciones. Lo que
      se puntúa es decir en voz alta lo que se está suponiendo.

      - **Es una aproximación lineal.** Se sustituye $T$ por su plano tangente en
        $\left(140,35\right)$, y solo es fiable para incrementos pequeños. Un
        $6\,\%$ en $p$ y un $10\,\%$ en $b$ están en el límite de lo razonable.
      - **El enunciado no pone tope a $p$.** Sin ninguna restricción sobre el
        presupuesto de publicidad, el aumento sería ilimitado: bastaría con
        gastar más. Lo que hace el problema resoluble es moverse **en la
        dirección del gradiente** y dejar que el tope del billete fije cuánto se
        avanza. Conviene escribirlo como supuesto, porque el enunciado no lo dice.
      - **Las derivadas son de este año.** Al cambiar $p$ y $b$ cambian también
        $T_{p}$ y $T_{b}$, y la estimación no lo tiene en cuenta.

  - id: ex1314-ext-6-dos-edos-de-una-tacada
    titulo: Dos ecuaciones diferenciales de una tacada
    fuente: >-
      Ejercicio 2 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 18 de
      junio de 2014 · Cálculo – Industriales y Civil, Donostiako Eskola
      Politeknikoa (UPV/EHU) · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Resolver las siguientes EDO:

      a) $y''+5y=7\operatorname{sen}5x+2x^{2}+3$

      b) $\dfrac{dy}{dx}+2y=e^{3x}$, $y\left(0\right)=2$
    pide: La solución general de la primera y la particular de la segunda.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado a), ¿hay resonancia con el término $7\operatorname{sen}5x$?
        opciones:
          - texto: >-
              No: las raíces de la característica son $\pm i\sqrt5$, y
              $\operatorname{sen}5x$ corresponde a $\pm5i$
            correcta: true
            mensaje: |
              Eso es, y hay que mirarlo con cuidado porque los dos números son
              «cinco» a primera vista. La homogénea oscila con frecuencia
              $\sqrt5\approx2{,}24$ y el forzamiento con frecuencia $5$: no
              coinciden.
          - texto: >-
              Sí: el $5$ del segundo miembro es el mismo $5$ de $y''+5y$
            mensaje: |
              El $5$ de la ecuación entra en la característica como
              $r^{2}+5=0$, o sea $r=\pm i\sqrt5$. La frecuencia es la **raíz** de
              ese cinco, no el cinco.
          - texto: >-
              Sí, porque el segundo miembro tiene un seno y la homogénea también
            mensaje: |
              Que los dos sean senos no basta: tienen que tener la **misma
              frecuencia**. $\operatorname{sen}5x$ y
              $\operatorname{sen}\left(\sqrt5 x\right)$ son funciones distintas.

      - tipo: calcular
        titulo: El coeficiente del seno
        pregunta: |
          En la solución particular de a), ¿cuál es el coeficiente que acompaña a
          $\operatorname{sen}5x$?
        respuesta:
          tipo: numero
          valor: '-0.35'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.35'
            mensaje: |
              Signo. Al sustituir $B\operatorname{sen}5x$ queda
              $\left(-25+5\right)B=-20B$, y $-20B=7$ da $B=-\frac{7}{20}$.
          - valor: '0.2333'
            mensaje: |
              $\frac{7}{30}$ saldría de $-25+5=-30$… pero $-25B+5B$ es $-20B$, no
              $-30B$.
          - valor: '1.4'
            mensaje: |
              $\frac75$ sale de dividir solo entre el $5$ de la ecuación,
              olvidando el $-25$ que aporta la segunda derivada.
        pista: |
          Con $y_{p}=B\operatorname{sen}5x$: $y_{p}''=-25B\operatorname{sen}5x$,
          y $y_{p}''+5y_{p}=-20B\operatorname{sen}5x$.
        desarrollo: |
          $$
          -20B=7\;\Longrightarrow\;B=-\frac{7}{20}=-0{,}35
          $$

          Y el coeficiente del coseno sale $0$, porque el segundo miembro no
          tiene coseno y no hay término que los mezcle.

      - tipo: calcular
        titulo: La constante del apartado b)
        pregunta: |
          En $y=\frac{e^{3x}}{5}+Ce^{-2x}$, ¿cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '1.8'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es $y\left(0\right)$. Hay que restarle lo que aporta el primer
              término en $x=0$, que es $\frac15$.
          - valor: '0.2'
            mensaje: |
              $\frac15$ es el coeficiente del primer término, no la constante.
          - valor: '-1.8'
            mensaje: |
              Signo. De $\frac15+C=2$ sale $C=\frac95$, positivo.
        pista: |
          $e^{0}=1$ en los dos términos, así que $\frac15+C=2$.
        desarrollo: |
          $$
          y\left(0\right)=\frac15+C=2
          \;\Longrightarrow\;
          C=\frac95=1{,}8
          $$

      - tipo: justificar
        pregunta: Ordena la resolución del apartado a). Una pieza es falsa.
        piezas:
          - texto: >-
              La característica $r^{2}+5=0$ da $r=\pm i\sqrt5$, así que
              $y_{h}=C_{1}\cos\left(\sqrt5x\right)
              +C_{2}\operatorname{sen}\left(\sqrt5x\right)$.
          - texto: >-
              Para $7\operatorname{sen}5x$ se ensaya
              $A\cos5x+B\operatorname{sen}5x$ —no hay resonancia— y sale $A=0$,
              $B=-\frac{7}{20}$.
          - texto: >-
              Para $2x^{2}+3$ se ensaya $ax^{2}+bx+c$ y sale $a=\frac25$, $b=0$,
              $c=\frac{11}{25}$.
          - texto: >-
              Como el segundo miembro tiene dos partes, hay que resolver dos
              ecuaciones distintas y quedarse con la solución que valga para las
              dos.
            trampa: true
            mensaje: |
              Al revés: por **linealidad**, las dos particulares se calculan por
              separado y luego se **suman**. Es el principio de superposición, y
              es lo que permite partir un segundo miembro complicado en trozos
              manejables. Quedarse con una sola no resolvería la ecuación
              completa.
    resolucion: |
      **a) Una lineal de segundo orden con dos forzamientos.**

      *La homogénea.* $r^{2}+5=0$ da $r=\pm i\sqrt5$, raíces imaginarias puras:

      $$
      y_{h}=C_{1}\cos\left(\sqrt5\,x\right)
      +C_{2}\operatorname{sen}\left(\sqrt5\,x\right)
      $$

      **El aviso de este ejercicio está aquí.** La ecuación tiene un $5$ y el
      segundo miembro tiene otro, y no son el mismo: la homogénea oscila con
      frecuencia $\sqrt5\approx2{,}24$ y el forzamiento con frecuencia $5$.
      **No hay resonancia**, y por tanto no hay que multiplicar por $x$.

      *Superposición.* El segundo miembro tiene dos partes y la ecuación es
      lineal, así que se resuelven por separado y se suman.

      *Para $7\operatorname{sen}5x$:* se ensaya
      $y_{1}=A\cos5x+B\operatorname{sen}5x$. Como
      $y_{1}''=-25\,y_{1}$:

      $$
      y_{1}''+5y_{1}=-20\left(A\cos5x+B\operatorname{sen}5x\right)
      =7\operatorname{sen}5x
      $$

      $$
      A=0,\qquad B=-\frac{7}{20}
      $$

      *Para $2x^{2}+3$:* se ensaya $y_{2}=ax^{2}+bx+c$, con
      $y_{2}''=2a$:

      $$
      2a+5ax^{2}+5bx+5c=2x^{2}+3
      $$

      | grado | ecuación | resultado |
      |---|---|---|
      | $x^{2}$ | $5a=2$ | $a=\frac25$ |
      | $x$ | $5b=0$ | $b=0$ |
      | $1$ | $2a+5c=3$ | $c=\frac{11}{25}$ |

      $$
      \boxed{\;y=C_{1}\cos\left(\sqrt5x\right)
      +C_{2}\operatorname{sen}\left(\sqrt5x\right)
      -\frac{7}{20}\operatorname{sen}5x
      +\frac25x^{2}+\frac{11}{25}\;}
      $$

      **El $2a$ que se cuela en el término independiente.** Es el error más
      frecuente de este apartado: al derivar dos veces $ax^{2}$ queda $2a$, que
      es constante y por tanto compite con el $c$. Si se olvida, sale
      $c=\frac35$ en vez de $\frac{11}{25}$.

      **b) Una lineal de primer orden con condición inicial.**

      $$
      y'+2y=e^{3x}
      $$

      Factor integrante $e^{\int2dx}=e^{2x}$:

      $$
      \left(e^{2x}y\right)'=e^{2x}e^{3x}=e^{5x}
      \;\Longrightarrow\;
      e^{2x}y=\frac{e^{5x}}{5}+C
      $$

      $$
      y=\frac{e^{3x}}{5}+Ce^{-2x}
      $$

      Con $y\left(0\right)=2$: $\frac15+C=2$, o sea $C=\frac95$.

      $$
      \boxed{\;y=\frac{e^{3x}}{5}+\frac95e^{-2x}\;}
      $$

      **La comprobación.** $y\left(0\right)=\frac15+\frac95=2$ ✓. Y derivando,
      $y'+2y$ da $e^{3x}$ en cualquier punto: en $x=0{,}4$ los dos lados valen
      $3{,}3201$.

      **Por qué el $e^{3x}$ y el $e^{-2x}$ conviven sin estorbarse.** El
      exponente de la homogénea es $-2$ y el del forzamiento es $3$: distintos,
      así que tampoco aquí hay resonancia. Si el segundo miembro hubiera sido
      $e^{-2x}$, la particular habría llevado un $x$ delante.

  - id: ex1314-ext-7-el-cilindro-y-la-esfera-con-parametro
    titulo: Un cilindro dentro de una esfera, esta vez con parámetro
    fuente: >-
      Ejercicio 3 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 18 de
      junio de 2014 · Cálculo – Industriales y Civil, Donostiako Eskola
      Politeknikoa (UPV/EHU) · Mismo objeto que el ejercicio 1 del segundo
      cuatrimestral de 2016-2017-ext y de 2020-2021-ext, pero con radios
      proporcionales a un parámetro y **sin** condición sobre z, así que aquí hay
      dos casquetes en vez de uno · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3
    enunciado: |
      Considerar el sólido definido por las condiciones:
      $x^{2}+y^{2}\le2a^{2}$; $x^{2}+y^{2}+z^{2}\le4a^{2}$.

      a) Dibujar el sólido y calcular el área de su superficie.

      b) Calcular el volumen del sólido.
    pide: El dibujo, el área de la superficie y el volumen.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántas piezas tiene la superficie del sólido?
        opciones:
          - texto: >-
              Tres: la pared cilíndrica y **dos** casquetes esféricos, uno arriba
              y otro abajo
            correcta: true
            mensaje: |
              Eso es. Como no hay ninguna condición sobre $z$, el sólido es
              simétrico respecto del plano $z=0$ y la esfera lo tapa por los dos
              lados.
          - texto: 'Dos: la pared cilíndrica y un casquete'
            mensaje: |
              Eso sería con la condición $z\ge0$, que aquí no está. Sin ella el
              sólido baja también hacia $z$ negativa.
          - texto: >-
              Dos: la pared cilíndrica y dos tapas planas
            mensaje: |
              Las tapas no son planas: son trozos de esfera. Serían planas si la
              condición fuese $\left|z\right|\le c$.

      - tipo: calcular
        titulo: Dónde se cortan
        pregunta: |
          Con $a=1$, ¿a qué altura $z$ positiva se cortan el cilindro y la
          esfera?
        respuesta:
          tipo: numero
          valor: '1.4142136'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es el radio de la esfera, o sea la altura máxima **en el eje**.
              En el borde del cilindro la esfera ya ha bajado.
          - valor: '1'
            mensaje: |
              $1$ es el parámetro $a$. La altura de corte sale de
              $z^{2}=4a^{2}-2a^{2}=2a^{2}$.
          - valor: '1.7320508'
            mensaje: |
              $\sqrt3$ saldría de $4-1=3$, con el cilindro de radio $a$ en vez de
              $a\sqrt2$.
        pista: |
          En el borde del cilindro, $x^{2}+y^{2}=2a^{2}$, así que
          $z^{2}=4a^{2}-2a^{2}$.
        desarrollo: |
          $$
          z^{2}=4a^{2}-2a^{2}=2a^{2}
          \;\Longrightarrow\;
          z=\pm a\sqrt2
          $$

          Con $a=1$: $z=\pm\sqrt2\approx\pm1{,}4142$. Curiosamente el radio del
          cilindro y la altura de corte coinciden, los dos valen $a\sqrt2$.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Con $a=1$, ¿cuánto vale el volumen del sólido?
        respuesta:
          tipo: numero
          valor: '21.6626'
          tolerancia: 0.01
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '33.5103'
            mensaje: |
              $\frac{4}{3}\pi\cdot8$ es la esfera **entera**. El cilindro le
              recorta dos cuñas laterales.
          - valor: '10.8313'
            mensaje: |
              Es la mitad. Sin condición sobre $z$ el sólido tiene las dos
              mitades, y la integral en $z$ va de $-\sqrt{4-r^{2}}$ a
              $+\sqrt{4-r^{2}}$.
          - valor: '17.7715'
            mensaje: |
              $2\pi\cdot2\sqrt2$ es el cilindro con las **tapas planas** a la
              altura $\pm\sqrt2$. Las tapas son abombadas y añaden volumen.
        pista: |
          $V=4\pi\int_{0}^{a\sqrt2}r\sqrt{4a^{2}-r^{2}}\;dr$, con el $4$ porque
          la altura es $2\sqrt{4a^{2}-r^{2}}$.
        desarrollo: |
          $$
          V=\int_{0}^{2\pi}\!\!\int_{0}^{a\sqrt2}
          2\sqrt{4a^{2}-r^{2}}\;r\,dr\,d\theta
          =4\pi\int_{0}^{a\sqrt2}r\sqrt{4a^{2}-r^{2}}\;dr
          $$

          $$
          =4\pi\left[-\frac13\left(4a^{2}-r^{2}\right)^{3/2}
          \right]_{0}^{a\sqrt2}
          =\frac{4\pi}{3}\left(8a^{3}-2\sqrt2\,a^{3}\right)
          =\frac{8\pi}{3}a^{3}\left(4-\sqrt2\right)
          $$

          Con $a=1$: $\frac{8\pi}{3}\left(2{,}5858\right)\approx21{,}663$.

      - tipo: justificar
        pregunta: Ordena el cálculo del área. Una pieza es falsa.
        piezas:
          - texto: >-
              El cilindro tiene radio $a\sqrt2$ y la esfera $2a$, y se cortan en
              $z=\pm a\sqrt2$: la pared cilíndrica mide $2a\sqrt2$ de alto.
          - texto: >-
              Su área lateral es $2\pi\left(a\sqrt2\right)
              \left(2a\sqrt2\right)=8\pi a^{2}$.
          - texto: >-
              Cada casquete esférico tiene altura $h=2a-a\sqrt2$ y área
              $2\pi Rh=4\pi a^{2}\left(2-\sqrt2\right)$; los dos suman
              $8\pi a^{2}\left(2-\sqrt2\right)$.
          - texto: >-
              El área total es la de la esfera menos la del cilindro, porque el
              cilindro está dentro.
            trampa: true
            mensaje: |
              La superficie del sólido no es una resta: es la **unión** de los
              trozos de frontera que quedan expuestos. La pared cilíndrica está
              en la superficie del sólido y **suma**, y de la esfera solo cuentan
              los dos casquetes, no toda ella. Restar áreas de superficies
              distintas no significa nada geométrico.
    resolucion: |
      **a) Qué sólido es.** Dos condiciones y ninguna sobre $z$:

      | condición | qué es |
      |---|---|
      | $x^{2}+y^{2}\le2a^{2}$ | dentro de un **cilindro** de radio $a\sqrt2$, eje OZ |
      | $x^{2}+y^{2}+z^{2}\le4a^{2}$ | dentro de la **esfera** de radio $2a$ |

      Como $a\sqrt2<2a$, el cilindro es más estrecho. El sólido es un cilindro
      **abombado por los dos extremos**, simétrico respecto del plano $z=0$.

      **Dónde se cortan.** En el borde del cilindro, $r=a\sqrt2$:

      $$
      z^{2}=4a^{2}-2a^{2}=2a^{2}
      \;\Longrightarrow\;
      z=\pm a\sqrt2
      $$

      El radio del cilindro y la altura de corte valen lo mismo, $a\sqrt2$.

