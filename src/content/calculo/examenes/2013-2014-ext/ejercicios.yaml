      <figcaption>
      El recinto entre la parábola y el arco, a la derecha del eje OY. Los dos
      bordes curvos se cortan en (1,1), y ese punto es el que fija el límite
      superior de la integral.
      </figcaption>
      </figure>

      **La integral.** Para cada $x$ entre $0$ y $1$, la $y$ va de la parábola al
      arco:

      $$
      A=\int_{0}^{1}\left(\sqrt{2-x^{2}}-x^{2}\right)dx
      $$

      La primera parte es la del arco, con la primitiva de siempre:

      $$
      \int\sqrt{a^{2}-x^{2}}\,dx
      =\frac{x\sqrt{a^{2}-x^{2}}}{2}+\frac{a^{2}}{2}\arcsen\frac{x}{a}
      $$

      $$
      \int_{0}^{1}\sqrt{2-x^{2}}\,dx
      =\frac{1\cdot1}{2}+1\cdot\arcsen\frac{1}{\sqrt2}
      =\frac12+\frac{\pi}{4}
      $$

      y la segunda es inmediata, $\int_{0}^{1}x^{2}dx=\frac13$.

      $$
      \boxed{\;A=\frac12+\frac{\pi}{4}-\frac13=\frac16+\frac{\pi}{4}
      \approx0{,}952\;}
      $$

      **La comprobación de tamaño.** El recinto está metido en el cuadrado
      $\left[0,1\right]\times\left[0,\sqrt2\right]$, que mide $1{,}414$, y ocupa
      claramente más de la mitad: $0{,}952$ encaja. Y el sector circular de
      $45°$ de radio $\sqrt2$ mide $\frac{\pi}{4}\approx0{,}785$, así que el
      $\frac16$ de más es el trozo que el recinto añade por debajo de la
      diagonal.

  - id: ex1314-ext-5-el-autobus-y-el-gradiente
    titulo: El autobús, el gradiente y un tope del diez por ciento
    fuente: >-
      Ejercicio 1 del SEGUNDO CUATRIMESTRAL · Convocatoria extraordinaria, 18 de
      junio de 2014 · Cálculo – Industriales y Civil, Donostiako Eskola
      Politeknikoa (UPV/EHU) · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 3
      comp2: 2
      comp4: 5
    enunciado: |
      El Ayuntamiento de cierta ciudad está planeando aumentar el uso del autobús
      público. Se estima que el uso que se hace del autobús público viene dado
      por una función $T\left(p,b\right)$, donde $p$ es el coste de la campaña
      publicitaria de concienciación ciudadana y $b$ es el precio del billete de
      autobús. Durante este año, los valores de estas variables son $p=140$ y
      $b=35$. Con estos valores, el uso del autobús se ha calculado para este año
      en $T\left(140,35\right)=450$. Además, se sabe que
      $T_{p}\left(140,35\right)=3$ y $T_{b}\left(140,35\right)=-5$. Se quiere
      modificar los valores actuales de $p$ y $b$ para el año que viene, a fin de
      lograr el mayor aumento posible en el uso del autobús. Sin embargo, el
      precio del billete no puede reducirse en más del $10\,\%$ del valor actual.
      Se pide:

      a) Estimar los nuevos valores de $p$ y $b$ para lograr un aumento máximo de
      uso del autobús.

      b) Estimar el uso del autobús que se obtendrá con esos nuevos valores de
      $p$ y $b$.
    pide: Los nuevos p y b, y el uso estimado.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué dirección hay que moverse para que $T$ aumente lo más deprisa
          posible?
        opciones:
          - texto: >-
              En la del gradiente $\nabla T=\left(3,-5\right)$: subir la
              publicidad y bajar el billete
            correcta: true
            mensaje: |
              Eso es, y los signos cuentan la historia: la publicidad ayuda
              —derivada positiva— y el billete estorba —derivada negativa—, así
              que la mejor jugada es subir una y bajar el otro.
          - texto: >-
              En la de $\left(3,5\right)$, subiendo las dos variables
            mensaje: |
              $T_{b}=-5$ es **negativa**: subir el precio del billete reduce el
              uso. Hay que bajarlo, no subirlo.
          - texto: >-
              En la de $\left(-3,5\right)$, la de máximo decrecimiento
            mensaje: |
              Esa es la dirección en la que $T$ baja más deprisa. El enunciado
              pide aumentar.

      - tipo: calcular
        titulo: El nuevo precio del billete
        pregunta: |
          ¿Cuál es el precio del billete el año que viene?
        respuesta:
          tipo: numero
          valor: '31.5'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '25'
            mensaje: |
              $25$ sería bajar el billete diez euros, no un diez por ciento. El
              tope es el $10\,\%$ de $35$, que son $3{,}5$.
          - valor: '38.5'
            mensaje: |
              Ese es un $10\,\%$ **más**. El enunciado dice que el precio no puede
              reducirse en más del $10\,\%$, y para aumentar el uso hay que
              reducirlo, no subirlo.
          - valor: '34.5'
            mensaje: |
              $34{,}5$ es bajar cincuenta céntimos. El tope permite bajar hasta
              $3{,}5$, y conviene agotarlo: cada euro de rebaja aporta $5$
              usuarios.
        pista: |
          El $10\,\%$ de $35$ es $3{,}5$, y el tope se agota porque bajar el
          billete siempre aumenta el uso.
        desarrollo: |
          $$
          \Delta b\ge-0{,}10\cdot35=-3{,}5
          \;\Longrightarrow\;
          b_{\text{nuevo}}\ge31{,}5
          $$

          Como $T_{b}<0$, cuanto más baje el billete mejor, así que la
          restricción se agota: $b=31{,}5$.

      - tipo: calcular
        titulo: El uso estimado
        pregunta: |
          ¿Qué uso del autobús se estima para el año que viene?
        respuesta:
          tipo: numero
          valor: '473.8'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '467.5'
            mensaje: |
              $450+17{,}5$ cuenta solo lo que aporta la bajada del billete. La
              subida de la publicidad aporta otros $6{,}3$.
          - valor: '432.5'
            mensaje: |
              Signo. $T_{b}\Delta b=\left(-5\right)\left(-3{,}5\right)=+17{,}5$:
              dos negativos dan positivo, y el uso **sube**.
          - valor: '456.3'
            mensaje: |
              $450+6{,}3$ cuenta solo la publicidad. Falta lo del billete, que es
              casi el triple.
        pista: |
          $\Delta T\approx T_{p}\Delta p+T_{b}\Delta b$, con
          $\Delta p=2{,}1$ y $\Delta b=-3{,}5$.
        desarrollo: |
          $$
          \Delta T\approx 3\cdot2{,}1+\left(-5\right)\left(-3{,}5\right)
          =6{,}3+17{,}5=23{,}8
          $$

          $$
          T\approx450+23{,}8=473{,}8
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El gradiente $\nabla T=\left(3,-5\right)$ marca la dirección de
              máximo aumento: subir $p$ y bajar $b$.
          - texto: >-
              Moviéndose en esa dirección, $\left(\Delta p,\Delta b\right)
              =t\left(3,-5\right)$, y el tope del $10\,\%$ fija
              $\Delta b=-3{,}5$, o sea $t=0{,}7$ y $\Delta p=2{,}1$.
          - texto: >-
              Los nuevos valores son $p=142{,}1$ y $b=31{,}5$, y el uso estimado
              $T\approx450+23{,}8=473{,}8$.
          - texto: >-
              Como el enunciado da los valores exactos de las derivadas, la
              estimación $473{,}8$ es el valor exacto de
              $T\left(142{,}1;\,31{,}5\right)$.
            trampa: true
            mensaje: |
              Es una **estimación lineal**, no un valor exacto: se está
              sustituyendo la superficie por su plano tangente en
              $\left(140,35\right)$. El enunciado usa dos veces la palabra
              «estimar» precisamente por eso. Sin conocer $T$ entera no hay forma
              de saber el error, y decirlo vale puntos de COMP 4.
    resolucion: |
      **Lo que dan y lo que hay que hacer con ello.** No se conoce $T$: solo su
      valor y sus dos derivadas parciales en un punto. Con eso solo se puede
      hacer una cosa, y es **aproximar linealmente**:

      $$
      \Delta T\approx T_{p}\,\Delta p+T_{b}\,\Delta b
      =3\,\Delta p-5\,\Delta b
      $$

      **a) La dirección.** El gradiente es $\nabla T=\left(3,-5\right)$, y marca
      la dirección de máximo crecimiento. Sus signos son la mitad del ejercicio:

      | | signo | qué significa |
      |---|---|---|
      | $T_{p}=3$ | $+$ | más publicidad, más uso |
      | $T_{b}=-5$ | $-$ | más caro el billete, menos uso |

      Así que hay que **subir $p$ y bajar $b$**. Y como
      $\left|T_{b}\right|>\left|T_{p}\right|$, tocar el billete rinde más: cada
      euro de rebaja aporta $5$ usuarios y cada euro de publicidad solo $3$.

      **El tope, y lo que fija.** El billete no puede bajar más del $10\,\%$:

      $$
      \Delta b\ge-0{,}1\cdot35=-3{,}5
      $$

      Como bajar siempre conviene, la restricción **se agota**:
      $\Delta b=-3{,}5$. Y moviéndose en la dirección del gradiente,
      $\left(\Delta p,\Delta b\right)=t\left(3,-5\right)$, ese valor fija la
      escala:

      $$
      -5t=-3{,}5\;\Longrightarrow\;t=0{,}7\;\Longrightarrow\;\Delta p=2{,}1
      $$

      $$
      \boxed{\;p=142{,}1\qquad b=31{,}5\;}
      $$

