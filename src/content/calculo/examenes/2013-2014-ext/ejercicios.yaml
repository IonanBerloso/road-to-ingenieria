          <text x="223" y="204" text-anchor="middle">2</text>
          <text x="87" y="204" text-anchor="middle">−2</text>
          <text x="284.2" y="182" text-anchor="end">t</text>
          <text x="148" y="108.3" text-anchor="end">√(π/2)</text>
          <text x="148" y="132" text-anchor="end">1</text>
        </g>
        <text class="cam14-l" x="270.6" y="124.9" text-anchor="end" fill="var(--live)">F(t)</text>
        <text class="cam14-l" x="194.1" y="145.4" fill="var(--d1)">F′(t) = e^(−t²/2)</text>
        <text class="cam14-l" x="161.1" y="207.4" fill="var(--flag)">inflexión</text>
      </svg>
      <figcaption>
      F, en trazo grueso, y su derivada a trazos. F sube siempre, porque la campana
      nunca toca el cero, y su punto de inflexión está justo donde la campana
      alcanza su máximo. Las dos líneas horizontales marcan los límites ±√(π/2).
      </figcaption>
      </figure>

      **Lo que se ve en el dibujo.** $F$ es la función de distribución de la
      campana: sube siempre, y sube más deprisa justo donde la campana es más
      alta, en el origen. El punto de inflexión de $F$ es el **máximo** de $F'$,
      y eso es cierto siempre: los extremos de la derivada son las inflexiones de
      la función.

      **De propina, dos cosas que se pueden decir gratis.** $F$ es **impar**,
      porque el integrando es par y el intervalo arranca en $0$. Y está acotada:

      $$
      \lim_{t\to\pm\infty}F\left(t\right)=\pm\sqrt{\frac{\pi}{2}}
      \approx\pm1{,}2533
      $$

      Ese valor no se puede obtener con las técnicas de la asignatura —hace falta
      la integral de Gauss—, así que basta con decir que el límite existe porque
      $F$ es creciente y acotada.

  - id: ex1314-ext-3-de-donde-sale-esa-formula
    titulo: De dónde sale esa fórmula, y cuánto te puedes fiar
    fuente: >-
      Ejercicio 3 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 18 de
      junio de 2014 · Cálculo – Industriales y Civil, Donostiako Eskola
      Politeknikoa (UPV/EHU) · Es el mismo desarrollo que el ejercicio 3 del
      primer cuatrimestral de la extraordinaria de 2017-2018, con otro intervalo
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3
    enunciado: |
      Determinar el origen de la fórmula
      $\sqrt{x+1}\approx1+\dfrac{x}{2}-\dfrac{x^{2}}{8}$, $0<x<1$, y acotar el
      error de la misma.
    pide: De dónde sale el polinomio, y una cota del error.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De dónde sale la fórmula?
        opciones:
          - texto: >-
              Es el polinomio de McLaurin de orden 2 de
              $f\left(x\right)=\sqrt{1+x}$
            correcta: true
            mensaje: |
              Eso es. $f\left(0\right)=1$, $f'\left(0\right)=\frac12$ y
              $f''\left(0\right)=-\frac14$, y al dividir el último entre $2!$ sale
              el $-\frac18$.
          - texto: >-
              Es el desarrollo del binomio de Newton, exacto
            mensaje: |
              El binomio de Newton con exponente $\frac12$ da una serie
              **infinita**, no un polinomio. Aquí se corta en el término
              cuadrático, y eso es lo que introduce el error que hay que acotar.
          - texto: >-
              Sale de igualar $\left(1+\frac{x}{2}-\frac{x^{2}}{8}\right)^{2}$
              a $1+x$
            mensaje: |
              Al elevar al cuadrado ese polinomio no sale $1+x$ exactamente:
              sobran términos de grado $3$ y $4$. Es un buen truco para
              **comprobar**, no el origen de la fórmula.

      - tipo: calcular
        titulo: La tercera derivada en el origen
        pregunta: |
          ¿Cuánto vale $f'''\left(0\right)$ para $f\left(x\right)=\sqrt{1+x}$?
        respuesta:
          tipo: numero
          valor: '0.375'
          tolerancia: 0.0001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '-0.375'
            mensaje: |
              Signo. Las derivadas de $\left(1+x\right)^{1/2}$ alternan:
              $+\frac12$, $-\frac14$, $+\frac38$, $-\frac{15}{16}$… La tercera
              vuelve a ser positiva.
          - valor: '-0.25'
            mensaje: |
              $-\frac14$ es $f''\left(0\right)$. Falta derivar una vez más.
          - valor: '0.125'
            mensaje: |
              $\frac18$ es el coeficiente de $x^{2}$ en el polinomio, que ya lleva
              el $2!$ dividido. La derivada tercera es otra cosa.
        pista: |
          $f''\left(x\right)=-\frac14\left(1+x\right)^{-3/2}$, y al derivar baja
          el $-\frac32$.
        desarrollo: |
          $$
          f''\left(x\right)=-\tfrac14\left(1+x\right)^{-3/2}
          \;\Longrightarrow\;
          f'''\left(x\right)=-\tfrac14\cdot\left(-\tfrac32\right)
          \left(1+x\right)^{-5/2}=\tfrac38\left(1+x\right)^{-5/2}
          $$

          $$
          f'''\left(0\right)=\tfrac38=0{,}375
          $$

      - tipo: calcular
        titulo: La cota del error
        pregunta: |
          ¿Cuál es la cota del error para todo $x$ en $\left(0,1\right)$?
        respuesta:
          tipo: numero
          valor: '0.0625'
          tolerancia: 0.0001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.375'
            mensaje: |
              $\frac38$ es el máximo de $\left|f'''\right|$, pero falta dividir
              entre $3!=6$ y multiplicar por $x^{3}$, que no pasa de $1$.
          - valor: '0.0208'
            mensaje: |
              $\frac{1}{48}$ sale de dividir $\frac38$ entre $3!$ y quedarse ahí,
              olvidando… no: $\frac{3/8}{6}=\frac{1}{16}=0{,}0625$. El
              $\frac{1}{48}$ sale de dividir entre $8$ en vez de entre $\frac83$.
          - valor: '0.125'
            mensaje: |
              $\frac18$ es el coeficiente del término cuadrático del polinomio, no
              una cota del resto.
        pista: |
          $\left|R_{2}\right|\le\frac{\max\left|f'''\right|}{3!}\left|x\right|^{3}$,
          y en $\left(0,1\right)$ el máximo está en $x=0$ y $x^{3}<1$.
        desarrollo: |
          $$
          \left|R_{2}\left(x\right)\right|
          =\left|\frac{f'''\left(\xi\right)}{3!}x^{3}\right|
          \le\frac{3/8}{6}\,x^{3}=\frac{x^{3}}{16}
          $$

          porque $f'''\left(x\right)=\frac38\left(1+x\right)^{-5/2}$ es
          **decreciente** en $\left(0,1\right)$ y su máximo está en el extremo
          izquierdo. Y como $x<1$:

          $$
          \left|R_{2}\right|<\frac{1}{16}=0{,}0625
          $$

      - tipo: justificar
        pregunta: Ordena la acotación. Una pieza es falsa.
        piezas:
          - texto: >-
              El polinomio es el de McLaurin de orden 2 de $\sqrt{1+x}$, y el
              error es el resto de Lagrange
              $R_{2}=\frac{f'''\left(\xi\right)}{3!}x^{3}$ con
              $\xi\in\left(0,x\right)$.
          - texto: >-
              $f'''\left(x\right)=\frac38\left(1+x\right)^{-5/2}$ es positiva y
              decreciente en $\left(0,1\right)$: su máximo está en $x=0$ y vale
              $\frac38$.
          - texto: >-
              Por tanto $\left|R_{2}\right|\le\frac{x^{3}}{16}$, y como
              $x<1$ queda $\left|R_{2}\right|<\frac{1}{16}$.
          - texto: >-
              Como $\xi$ está entre $0$ y $x$, se toma $\xi=\frac{x}{2}$ y se
              calcula el error exacto.
            trampa: true
            mensaje: |
              El teorema garantiza que **existe** un $\xi$, no dice cuál, y
              elegirlo a dedo no da el error exacto sino un número cualquiera. La
              técnica correcta es **acotar** $\left|f'''\right|$ en todo el
              intervalo y quedarse con el peor caso: por eso se llama cota y no
              valor.
    resolucion: |
      **El origen: es un McLaurin de orden 2.** Con
      $f\left(x\right)=\sqrt{1+x}=\left(1+x\right)^{1/2}$:

      | | fórmula | en $x=0$ |
      |---|---|---|
      | $f$ | $\left(1+x\right)^{1/2}$ | $1$ |
      | $f'$ | $\frac12\left(1+x\right)^{-1/2}$ | $\frac12$ |
      | $f''$ | $-\frac14\left(1+x\right)^{-3/2}$ | $-\frac14$ |
      | $f'''$ | $\frac38\left(1+x\right)^{-5/2}$ | $\frac38$ |

      $$
      P_{2}\left(x\right)=f\left(0\right)+f'\left(0\right)x
      +\frac{f''\left(0\right)}{2!}x^{2}
      =1+\frac{x}{2}-\frac{x^{2}}{8}
      $$

      $$
      \boxed{\;\text{es el polinomio de McLaurin de orden 2 de }\sqrt{1+x}\;}
      $$

      El signo menos del término cuadrático no es un capricho: la raíz cuadrada
      es **cóncava**, crece cada vez más despacio, y la parábola que la imita
      tiene que abrir hacia abajo.

      **La cota del error.** El resto de Lagrange de orden 2 es

      $$
      R_{2}\left(x\right)=\frac{f'''\left(\xi\right)}{3!}\,x^{3},
      \qquad 0<\xi<x
      $$

      No hace falta saber dónde está $\xi$: basta con acotar
      $\left|f'''\right|$ en todo el intervalo. Y
      $f'''\left(x\right)=\frac38\left(1+x\right)^{-5/2}$ es positiva y
      decreciente, así que su máximo en $\left(0,1\right)$ está en el extremo
      izquierdo:

      $$
      \max_{0<x<1}\left|f'''\right|=\frac38
      $$

      $$
      \left|R_{2}\left(x\right)\right|\le\frac{3/8}{6}\,x^{3}
      =\frac{x^{3}}{16}
      $$

      $$
      \boxed{\;\left|R_{2}\right|<\frac{1}{16}=0{,}0625
      \quad\text{para todo }0<x<1\;}
      $$

      **La comprobación, que aquí es especialmente instructiva:**

      | $x$ | error real | cota $\frac{x^{3}}{16}$ |
      |---|---|---|
      | $0{,}1$ | $0{,}000059$ | $0{,}0000625$ |
      | $0{,}5$ | $0{,}005995$ | $0{,}0078$ |
      | $0{,}9$ | $0{,}029655$ | $0{,}0456$ |

      La cota se cumple siempre y es ajustada cerca del origen; según $x$ crece
      se va quedando holgada, porque $f'''$ baja mientras la cota sigue usando su
      valor en $0$.

      **La comparación con 2017-2018.** El mismo polinomio salió en la
      extraordinaria de 2017-2018, pero allí se pedía $\sqrt{0{,}9}$, o sea
      $x=-0{,}1$. **Y con $x$ negativo el máximo de $f'''$ cambia de extremo**:
      $\left(1+x\right)^{-5/2}$ es mayor cuanto menor es $x$, así que en
      $\left[-0{,}1,0\right]$ el máximo está en $-0{,}1$ y la cota sale
      $\frac{3}{8\left(0{,}9\right)^{5/2}}\cdot\frac{0{,}001}{6}$. Es el mismo
      teorema y la misma función, y sin embargo la cuenta de la cota no se puede
      copiar de un año a otro.

  - id: ex1314-ext-4-una-primitiva-y-un-area
    titulo: Una primitiva con dos trucos y un área con dos bordes
    fuente: >-
      Ejercicio 4 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 18 de
      junio de 2014 · Cálculo – Industriales y Civil, Donostiako Eskola
      Politeknikoa (UPV/EHU) · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Calcular:

      a) $\displaystyle\int\frac{2x\ln\left(1+x^{2}\right)}
      {\left(1+x^{2}\right)^{2}}\,dx$

      b) Área del recinto determinado por $x^{2}+y^{2}\le2$, $x^{2}\le y$,
      $x\ge0$.
    pide: La primitiva y el área.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado a), ¿qué cambio de variable pide el integrando?
        opciones:
          - texto: >-
              $u=1+x^{2}$, porque el $2x\,dx$ del numerador es exactamente $du$
            correcta: true
            mensaje: |
              Eso es. El $2x$ no está por casualidad: es la derivada de
              $1+x^{2}$, y con él la integral se vuelve
              $\int\frac{\ln u}{u^{2}}du$.
          - texto: $u=\ln\left(1+x^{2}\right)$
            mensaje: |
              Entonces $du=\frac{2x}{1+x^{2}}dx$, y quedaría
              $\int\frac{u}{1+x^{2}}du$ con una $x$ suelta. No cierra.
          - texto: >-
              Ninguno: es una integral racional y va por fracciones simples
            mensaje: |
              No es racional: tiene un logaritmo. Las fracciones simples solo
              sirven para cocientes de polinomios.

      - tipo: calcular
        titulo: La primitiva en un punto
        pregunta: |
          Con $F\left(x\right)=-\frac{1+\ln\left(1+x^{2}\right)}{1+x^{2}}$,
          ¿cuánto vale $F\left(1\right)$?
        respuesta:
          tipo: numero
          valor: '-0.8466'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.8466'
            mensaje: |
              Signo. La primitiva lleva un menos delante:
              $\int\frac{\ln u}{u^{2}}du=-\frac{\ln u+1}{u}$.
          - valor: '-0.3466'
            mensaje: |
              Te has dejado el $1$ del numerador. Al integrar por partes queda
              $-\frac{\ln u}{u}+\int\frac{du}{u^{2}}=-\frac{\ln u}{u}-\frac1u$, y
              ese segundo sumando es el que aporta el $1$.
          - valor: '-1.3466'
            mensaje: |
              Parece $-\frac{1+\ln 2}{1}$, con el denominador puesto a $1$. En
              $x=1$ vale $1+x^{2}=2$.
        pista: |
          En $x=1$: $1+x^{2}=2$ y $\ln2\approx0{,}6931$.
        desarrollo: |
          $$
          F\left(1\right)=-\frac{1+\ln2}{2}
          =-\frac{1{,}6931}{2}\approx-0{,}8466
          $$

      - tipo: calcular
        titulo: El área del apartado b)
        pregunta: |
          ¿Cuánto vale el área del recinto?
        respuesta:
          tipo: numero
          valor: '0.9521'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '1.2854'
            mensaje: |
              $\frac12+\frac{\pi}{4}$ es solo $\int_{0}^{1}\sqrt{2-x^{2}}\,dx$:
              el área bajo el arco hasta el eje. Falta restar la que se come la
              parábola.
          - valor: '1.9042'
            mensaje: |
              Es el doble. La condición $x\ge0$ se queda con la mitad derecha; sin
              ella el recinto sería simétrico y mediría eso.
          - valor: '0.6187'
            mensaje: |
              Parece salir de restar $\frac23$ en vez de $\frac13$. La integral
              de $x^{2}$ entre $0$ y $1$ vale $\frac13$.
        pista: |
          $A=\int_{0}^{1}\left(\sqrt{2-x^{2}}-x^{2}\right)dx$, y la parábola corta
          a la circunferencia en $x=1$.
        desarrollo: |
          La parábola $y=x^{2}$ y la circunferencia $x^{2}+y^{2}=2$ se cortan
          donde $x^{2}+x^{4}=2$, o sea $x^{2}=1$: en $\left(1,1\right)$.

          $$
          A=\int_{0}^{1}\left(\sqrt{2-x^{2}}-x^{2}\right)dx
          =\left(\frac12+\frac{\pi}{4}\right)-\frac13
          =\frac16+\frac{\pi}{4}
          $$

          $$
          A\approx0{,}1667+0{,}7854=0{,}9521
          $$

      - tipo: justificar
        pregunta: Ordena el apartado a). Una pieza es falsa.
        piezas:
          - texto: >-
              Con $u=1+x^{2}$ y $du=2x\,dx$, la integral se convierte en
              $\int\frac{\ln u}{u^{2}}\,du$.
          - texto: >-
              Por partes, con $w=\ln u$ y $dv=u^{-2}du$:
              $-\frac{\ln u}{u}+\int\frac{du}{u^{2}}$.
          - texto: >-
              Esa última integral vale $-\frac1u$, así que el resultado es
              $-\frac{\ln u+1}{u}+C$, y deshaciendo el cambio,
              $-\frac{1+\ln\left(1+x^{2}\right)}{1+x^{2}}+C$.
          - texto: >-
              Como el integrando lleva un logaritmo, la primitiva tiene que llevar
              otro logaritmo multiplicado por algo.
            trampa: true
            mensaje: |
              Suena razonable y es falso como regla: aquí la primitiva lleva un
              logaritmo, sí, pero **dividido** por $u$ y acompañado de un término
              sin logaritmo ninguno. Un contraejemplo de una línea:
              $\int\frac{\ln x}{x}dx=\frac{\ln^{2}x}{2}$, donde el logaritmo sale
              al cuadrado.
    resolucion: |
      **a) Dos técnicas encadenadas.** Lo primero es ver que el $2x\,dx$ del
      numerador es la diferencial de $1+x^{2}$:

      $$
      u=1+x^{2},\qquad du=2x\,dx
      \;\Longrightarrow\;
      \int\frac{2x\ln\left(1+x^{2}\right)}{\left(1+x^{2}\right)^{2}}dx
      =\int\frac{\ln u}{u^{2}}\,du
      $$

      Y esa ya es una integración por partes de libro, con $w=\ln u$ y
      $dv=u^{-2}du$, o sea $v=-\frac1u$:

      $$
      \int\frac{\ln u}{u^{2}}du
      =-\frac{\ln u}{u}+\int\frac{1}{u}\cdot\frac{1}{u}\,du
      =-\frac{\ln u}{u}-\frac{1}{u}+C
      $$

      $$
      \boxed{\;\int\frac{2x\ln\left(1+x^{2}\right)}
      {\left(1+x^{2}\right)^{2}}dx
      =-\frac{1+\ln\left(1+x^{2}\right)}{1+x^{2}}+C\;}
      $$

      **Elegir bien $w$ y $dv$.** Al revés —tomando $w=u^{-2}$— la integral se
      complica en vez de simplificarse. La regla práctica: el logaritmo va casi
      siempre en la parte que se **deriva**, porque su derivada es más simple que
      él.

      **b) El recinto.** Tres condiciones:

      | condición | qué borde pone |
      |---|---|
      | $x^{2}+y^{2}\le2$ | por arriba, la circunferencia de radio $\sqrt2$ |
      | $x^{2}\le y$ | por abajo, la parábola $y=x^{2}$ |
      | $x\ge0$ | por la izquierda, el eje OY |

      **Dónde se cortan los dos bordes curvos.** Sustituyendo $y=x^{2}$ en
      $x^{2}+y^{2}=2$:

      $$
      x^{2}+x^{4}=2
      \;\Longrightarrow\;
      \left(x^{2}+2\right)\left(x^{2}-1\right)=0
      \;\Longrightarrow\;
      x^{2}=1
      $$

      Con $x\ge0$, el corte es $\left(1,1\right)$.

