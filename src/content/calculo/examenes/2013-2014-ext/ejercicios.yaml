ejercicios:
  - id: ex1314-ext-1-el-cubo-y-el-cuadrado-del-conjugado
    titulo: El cubo igual al cuadrado del conjugado, y cuatro sucesiones
    fuente: >-
      Ejercicio 1 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 18 de
      junio de 2014 · Cálculo – Industriales y Civil, Donostiako Eskola
      Politeknikoa (UPV/EHU) · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 4
      comp2: 3
      comp4: 3
    enunciado: |
      a) Hallar los números complejos cuyo cubo sea igual al cuadrado de su
      conjugado. Representar sus afijos.

      b) Dadas las sucesiones
      $\left\{\frac{1}{n}\right\}_{n\in\mathbb{N}}$,
      $\left\{\frac{1}{n^{2}}\right\}_{n\in\mathbb{N}}$,
      $\left\{\frac{\left(-1\right)^{n}}{n}\right\}_{n\in\mathbb{N}}$,
      $\left\{\frac{1}{n+100}\right\}_{n\in\mathbb{N}}$,
      calcular si existe el límite de cada una de ellas. Elegir entre estas
      sucesiones, para cada caso, dos de ellas que cumplan:

      a) $\lim\limits_{n\to\infty}\frac{x_{n}}{y_{n}}=0$ &nbsp;
      b) $\lim\limits_{n\to\infty}\frac{x_{n}}{y_{n}}=1$ &nbsp;
      c) $\lim\limits_{n\to\infty}\frac{x_{n}}{y_{n}}=\infty$ &nbsp;
      d) $\lim\limits_{n\to\infty}\frac{x_{n}}{y_{n}}$ no existe, pero la
      sucesión está acotada
    pide: Los complejos dibujados, y cuatro parejas de sucesiones.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado a), ¿qué se saca de tomar módulos en
          $z^{3}=\overline{z}^{2}$?
        opciones:
          - texto: >-
              Que $\left|z\right|^{3}=\left|z\right|^{2}$, y de ahí
              $\left|z\right|=0$ o $\left|z\right|=1$
            correcta: true
            mensaje: |
              Eso es, y parte el problema en dos casos limpios. El módulo del
              conjugado es el mismo que el del número, así que la ecuación de
              módulos no distingue conjugar.
          - texto: >-
              Que $\left|z\right|^{3}=-\left|z\right|^{2}$, porque el conjugado
              cambia el signo
            mensaje: |
              El conjugado cambia el signo de la **parte imaginaria**, no del
              módulo: $\left|\overline{z}\right|=\left|z\right|$ siempre, y el
              módulo nunca es negativo.
          - texto: Que $z$ es real, porque los módulos son reales
            mensaje: |
              De la ecuación de módulos solo sale información sobre
              $\left|z\right|$. El argumento se decide después, y ahí es donde
              aparecen las soluciones no reales.

      - tipo: calcular
        titulo: Cuántas soluciones hay
        pregunta: |
          ¿Cuántos números complejos cumplen $z^{3}=\overline{z}^{2}$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '5'
            mensaje: |
              Las cinco raíces quintas de la unidad, sí, pero falta $z=0$, que
              cumple la ecuación trivialmente: $0=0$.
          - valor: '3'
            mensaje: |
              El exponente $3$ no cuenta soluciones aquí. Al pasar $\overline{z}$
              a $1/z$ la ecuación se convierte en $z^{5}=1$.
          - valor: '2'
            mensaje: |
              Las soluciones reales son $0$ y $1$, pero hay cuatro más con parte
              imaginaria no nula.
        pista: |
          Con $\left|z\right|=1$ es $\overline{z}=\frac1z$, así que
          $z^{3}=\frac{1}{z^{2}}$.
        desarrollo: |
          $$
          \left|z\right|^{3}=\left|z\right|^{2}
          \;\Longrightarrow\;
          \left|z\right|^{2}\left(\left|z\right|-1\right)=0
          \;\Longrightarrow\;
          \left|z\right|=0\ \text{o}\ \left|z\right|=1
          $$

          $z=0$ es solución. Y si $\left|z\right|=1$, entonces
          $\overline{z}=\frac1z$ y

          $$
          z^{3}=\frac{1}{z^{2}}
          \;\Longrightarrow\;
          z^{5}=1
          $$

          Cinco raíces quintas de la unidad más el origen: **seis** en total.

      - tipo: calcular
        titulo: El argumento de la primera solución no real
        pregunta: |
          ¿Cuál es el argumento, en grados, de la solución no real con argumento
          positivo más pequeño?
        respuesta:
          tipo: numero
          valor: '72'
          tolerancia: 0.01
          formato: un número de grados
        distractores:
          - valor: '60'
            mensaje: |
              $60°$ correspondería a las raíces **sextas** de la unidad. Aquí el
              exponente que queda es $5$, y $\frac{360}{5}=72$.
          - valor: '120'
            mensaje: |
              $120°$ son las raíces cúbicas. El $3$ del enunciado no es el que
              manda: al juntar $z^{3}$ con $\frac{1}{z^{2}}$ los exponentes se
              **suman**.
          - valor: '36'
            mensaje: |
              $36°$ es la mitad, o sea $\frac{360}{10}$. Son cinco raíces, no
              diez.
        pista: |
          Las raíces $n$-ésimas de la unidad están separadas por
          $\frac{360°}{n}$.
        desarrollo: |
          $$
          z^{5}=1
          \;\Longrightarrow\;
          z=e^{2k\pi i/5},\qquad k=0,1,2,3,4
          $$

          Los argumentos son $0°$, $72°$, $144°$, $216°$ y $288°$: un
          **pentágono regular** inscrito en la circunferencia unidad, con un
          vértice en el $1$.

      - tipo: justificar
        pregunta: Ordena las cuatro parejas del apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              Las cuatro sucesiones tienden a $0$, así que cualquier cociente es
              una indeterminación $\frac00$ y hay que mirarlo caso por caso.
          - texto: >-
              a) $x_{n}=\frac{1}{n^{2}}$, $y_{n}=\frac1n$: el cociente es
              $\frac1n\to0$. c) Al revés, el cociente es $n\to\infty$.
          - texto: >-
              b) $x_{n}=\frac1n$, $y_{n}=\frac{1}{n+100}$: el cociente es
              $\frac{n+100}{n}\to1$. d) $x_{n}=\frac{\left(-1\right)^{n}}{n}$,
              $y_{n}=\frac1n$: el cociente es $\left(-1\right)^{n}$, acotado y
              sin límite.
          - texto: >-
              Como las cuatro sucesiones tienen el mismo límite, todos sus
              cocientes tienden a $1$.
            trampa: true
            mensaje: |
              Ese es exactamente el error que el ejercicio busca. Que dos
              sucesiones tiendan al mismo límite **no** dice nada sobre su
              cociente cuando ese límite es cero: la indeterminación
              $\frac00$ puede dar cualquier cosa, y aquí las cuatro parejas lo
              demuestran con las mismas cuatro sucesiones.
    resolucion: |
      **a) La ecuación de módulos parte el problema.** Tomando módulos en
      $z^{3}=\overline{z}^{2}$, y usando que
      $\left|\overline{z}\right|=\left|z\right|$:

      $$
      \left|z\right|^{3}=\left|z\right|^{2}
      \;\Longrightarrow\;
      \left|z\right|^{2}\left(\left|z\right|-1\right)=0
      $$

      | caso | qué sale |
      |---|---|
      | $\left\|z\right\|=0$ | $z=0$, que cumple la ecuación: $0=0$ |
      | $\left\|z\right\|=1$ | queda por decidir el argumento |

      **El caso interesante.** Si $\left|z\right|=1$, entonces
      $z\overline{z}=1$, o sea $\overline{z}=\frac1z$, y la ecuación se vuelve
      polinómica:

      $$
      z^{3}=\left(\frac1z\right)^{2}=\frac{1}{z^{2}}
      \;\Longrightarrow\;
      z^{5}=1
      $$

      $$
      \boxed{\;z=0\quad\text{y}\quad z=e^{2k\pi i/5},\;k=0,1,2,3,4\;}
      $$

      **Seis soluciones.** El origen, y los cinco vértices de un pentágono
      regular inscrito en la circunferencia unidad, con uno de ellos en el $1$.

      <figure class="figura-examen">
      <svg viewBox="0 0 290 270" role="img" width="290" height="270"
           aria-labelledby="rai14-t rai14-d">
        <title id="rai14-t">Las seis soluciones: el origen y un pentagono</title>
        <desc id="rai14-d">Una circunferencia de radio uno con cinco puntos repartidos
        por igual sobre ella, unidos formando un pentagono regular con un vertice en el
        uno. En el centro, un sexto punto de otro color: el origen.</desc>
