          <text x="217" y="150" text-anchor="middle">1</text>
          <text x="271" y="127" text-anchor="end">Re</text>
          <text x="151" y="29.8">Im</text>
        </g>
        <text class="rai14-l" x="136" y="146.5" text-anchor="end" fill="var(--flag)">z = 0</text>
        <text class="rai14-l" x="175.2" y="83.2" fill="var(--live)">72°</text>
        <text class="rai14-l" x="29.8" y="37.8" fill="var(--live)">z⁵ = 1</text>
      </svg>
      <figcaption>
      Las seis soluciones: el origen, en rojo, y los cinco vértices de un pentágono
      regular inscrito en la circunferencia unidad, separados por 72 grados.
      </figcaption>
      </figure>

      **En forma polar, sin pasar por $z^{5}=1$.** Con $z=\rho e^{i\theta}$, la
      ecuación de argumentos es $3\theta=-2\theta+2k\pi$, o sea
      $5\theta=2k\pi$. Sale lo mismo, y explica por qué aparece un $5$ donde el
      enunciado solo enseña un $3$ y un $2$: **conjugar cambia el signo del
      argumento**, así que los exponentes se suman en vez de restarse.

      **b) Las cuatro sucesiones tienden a cero.** Las cuatro, y por motivos
      distintos de velocidad:

      | sucesión | límite | cómo de rápido |
      |---|---|---|
      | $\frac1n$ | $0$ | de referencia |
      | $\frac{1}{n^{2}}$ | $0$ | mucho más rápido |
      | $\frac{\left(-1\right)^{n}}{n}$ | $0$ | igual de rápido, pero alternando |
      | $\frac{1}{n+100}$ | $0$ | igual de rápido, desplazada |

      **Y por eso todos los cocientes son indeterminaciones $\frac00$**, que es
      el punto del ejercicio: el mismo límite no impone nada sobre el cociente.

      | caso | $x_{n}$ | $y_{n}$ | el cociente |
      |---|---|---|---|
      | a) $\to0$ | $\frac{1}{n^{2}}$ | $\frac1n$ | $\frac1n\to0$ |
      | b) $\to1$ | $\frac1n$ | $\frac{1}{n+100}$ | $\frac{n+100}{n}\to1$ |
      | c) $\to\infty$ | $\frac1n$ | $\frac{1}{n^{2}}$ | $n\to\infty$ |
      | d) no existe, acotada | $\frac{\left(-1\right)^{n}}{n}$ | $\frac1n$ | $\left(-1\right)^{n}$ |

      **El apartado d) es el más fino.** El cociente vale exactamente
      $\left(-1\right)^{n}$: está acotado —entre $-1$ y $1$— y no converge,
      porque sus subsucesiones par e impar tienden a cosas distintas. Con
      $\frac{1}{n+100}$ en el denominador saldría
      $\frac{\left(-1\right)^{n}\left(n+100\right)}{n}$, que también sirve, y con
      $\frac{1}{n^{2}}$ saldría $\left(-1\right)^{n}n$, que **no** vale: no está
      acotado.

      **Cuatro de los diez puntos son COMP 1**, el reparto más cargado de
      reconocimiento del corpus. Tiene sentido: el trabajo aquí es elegir bien,
      no calcular.

  - id: ex1314-ext-2-barrow-y-la-campana-de-gauss
    titulo: El teorema fundamental, y la campana que no tiene extremos
    fuente: >-
      Ejercicio 2 del PRIMER CUATRIMESTRAL · Convocatoria extraordinaria, 18 de
      junio de 2014 · Cálculo – Industriales y Civil, Donostiako Eskola
      Politeknikoa (UPV/EHU) · Es copia literal del ejercicio 2 de la SEXTA
      EVALUACIÓN DEL MISMO CURSO, del 19 de mayo de 2014: un mes antes, y solo
      cambia el reparto de puntos. El mismo teorema se pidió enunciar y demostrar
      además en las terceras evaluaciones de 2018-2019, 2019-2020 y 2020-2021 ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 4
      comp4: 5
    enunciado: |
      Enunciar y demostrar el teorema fundamental del Cálculo Infinitesimal.
      Aplíquese este teorema para estudiar los extremos relativos y los puntos
      de inflexión de la función:

      $$
      F\left(t\right)=\int_{0}^{t}e^{-\frac{z^{2}}{2}}\,dz
      $$
    pide: El teorema con su demostración, y el estudio de F.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dice el teorema fundamental sobre esta $F$?
        opciones:
          - texto: >-
              Que $F$ es derivable y $F'\left(t\right)=e^{-t^{2}/2}$: la
              derivada es el integrando evaluado en el extremo superior
            correcta: true
            mensaje: |
              Eso es, y hace falta que el integrando sea continuo — lo es, es una
              exponencial—. La gracia es que $F$ no tiene primitiva elemental y
              aun así su derivada se conoce exactamente.
          - texto: >-
              Que $F\left(t\right)$ se puede calcular con una primitiva
              elemental
            mensaje: |
              No se puede: $e^{-z^{2}/2}$ no tiene primitiva elemental, y esa es
              justamente la razón de que el ejercicio pida estudiarla sin
              calcularla.
          - texto: >-
              Que $F$ es continua, pero no necesariamente derivable
            mensaje: |
              El teorema da más que continuidad: da **derivabilidad**, y además
              dice cuánto vale la derivada. La continuidad de $F$ saldría solo de
              que el integrando esté acotado.

      - tipo: calcular
        titulo: El número de extremos relativos
        pregunta: |
          ¿Cuántos extremos relativos tiene $F$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              En $t=0$ la **segunda** derivada se anula, no la primera.
              $F'\left(0\right)=e^{0}=1\neq0$: ahí la función crece con pendiente
              máxima.
          - valor: '2'
            mensaje: |
              $F'\left(t\right)=e^{-t^{2}/2}$ es una exponencial: no se anula
              nunca, en ningún punto.
        pista: |
          ¿Puede valer cero una exponencial?
        desarrollo: |
          $$
          F'\left(t\right)=e^{-t^{2}/2}>0\quad\text{para todo }t
          $$

          Una exponencial nunca se anula, así que $F$ es **estrictamente
          creciente** en todo $\mathbb{R}$ y no tiene ningún extremo relativo.

      - tipo: calcular
        titulo: El punto de inflexión
        pregunta: |
          ¿En qué valor de $t$ tiene $F$ su punto de inflexión?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              $F''\left(t\right)=-t\,e^{-t^{2}/2}$ se anula donde se anula el
              factor $-t$, y eso es en $t=0$.
          - valor: '2'
            mensaje: |
              El $2$ del exponente no es un punto: es el denominador de
              $\frac{z^{2}}{2}$, y al derivar sale como factor $-t$.
        pista: |
          $F''\left(t\right)=-t\,e^{-t^{2}/2}$.
        desarrollo: |
          $$
          F''\left(t\right)=\frac{d}{dt}e^{-t^{2}/2}
          =-t\,e^{-t^{2}/2}
          $$

          Se anula solo en $t=0$, y ahí cambia de signo —positiva a la izquierda,
          negativa a la derecha—, así que la concavidad cambia: es un **punto de
          inflexión**, y el único.

      - tipo: justificar
        pregunta: Ordena el estudio de $F$. Una pieza es falsa.
        piezas:
          - texto: >-
              El integrando $e^{-z^{2}/2}$ es continuo en todo $\mathbb{R}$, así
              que el teorema fundamental se aplica y
              $F'\left(t\right)=e^{-t^{2}/2}$.
          - texto: >-
              $F'>0$ siempre: $F$ es estrictamente creciente y **no tiene
              extremos relativos**.
          - texto: >-
              $F''\left(t\right)=-t\,e^{-t^{2}/2}$ se anula solo en $t=0$ y
              cambia de signo: ahí hay un punto de inflexión, y es el único.
          - texto: >-
              Como $F$ no tiene primitiva elemental, no se puede saber si crece o
              decrece sin calcularla numéricamente.
            trampa: true
            mensaje: |
              Justo al revés: el teorema fundamental da la derivada **sin
              calcular la integral**, y con la derivada se sabe todo sobre el
              crecimiento. Que no exista primitiva elemental no impide estudiar
              la función; impide **evaluarla**, que es otra cosa.
    resolucion: |
      **El enunciado.** Hay que decirlo con sus hipótesis, que son los cuatro
      puntos de COMP 2:

      > Si $f$ es continua en $\left[a,b\right]$ y se define
      > $$
      > F\left(x\right)=\int_{a}^{x}f\left(t\right)dt,
      > $$
      > entonces $F$ es derivable en $\left(a,b\right)$ y
      > $F'\left(x\right)=f\left(x\right)$.

      **La demostración.** Se ataca el cociente incremental directamente:

      $$
      \frac{F\left(x+h\right)-F\left(x\right)}{h}
      =\frac{1}{h}\int_{x}^{x+h}f\left(t\right)dt
      $$

      por la aditividad de la integral. Y ahora el **teorema del valor medio
      integral**: como $f$ es continua en $\left[x,x+h\right]$, existe
      $c_{h}$ en ese intervalo con

      $$
      \int_{x}^{x+h}f\left(t\right)dt=f\left(c_{h}\right)\,h
      $$

      Sustituyendo, el cociente incremental vale $f\left(c_{h}\right)$. Y cuando
      $h\to0$, el punto $c_{h}$ queda atrapado entre $x$ y $x+h$, así que
      $c_{h}\to x$; por la **continuidad** de $f$,

      $$
      F'\left(x\right)=\lim_{h\to0}f\left(c_{h}\right)=f\left(x\right)
      \qquad\blacksquare
      $$

      La continuidad se usa **dos veces**: para aplicar el valor medio integral y
      para pasar al límite. Conviene señalarlo.

      **La aplicación.** $F\left(t\right)=\int_{0}^{t}e^{-z^{2}/2}dz$ no tiene
      primitiva elemental —es la campana de Gauss—, y aun así se estudia entera:

      $$
      F'\left(t\right)=e^{-t^{2}/2},
      \qquad
      F''\left(t\right)=-t\,e^{-t^{2}/2}
      $$

      | qué | conclusión |
      |---|---|
      | $F'>0$ para todo $t$ | $F$ **estrictamente creciente**, sin extremos |
      | $F''>0$ si $t<0$ | cóncava hacia arriba a la izquierda |
      | $F''<0$ si $t>0$ | cóncava hacia abajo a la derecha |
      | $F''\left(0\right)=0$ con cambio de signo | **punto de inflexión en $t=0$** |

      $$
      \boxed{\;\text{ningún extremo relativo; un único punto de inflexión, en }
      t=0\;}
      $$

      <figure class="figura-examen">
      <svg viewBox="0 0 320 245" role="img" width="320" height="245"
           aria-labelledby="cam14-t cam14-d">
        <title id="cam14-t">La funcion F y su derivada, la campana</title>
        <desc id="cam14-d">Una curva creciente con forma de ese alargada, que sube desde
        menos uno y cuarto hasta mas uno y cuarto sin pararse nunca. Debajo, la campana
        de Gauss, que es su derivada y alcanza su maximo justo donde la ese cambia de
        curvatura.</desc>
