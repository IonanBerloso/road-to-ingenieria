        <text class="ond14-l" x="154.7" y="84.4" text-anchor="end" fill="var(--flag)">2013 → S = 0</text>
        <text class="ond14-l" x="185.5" y="137.7" fill="var(--flag)">2014 → S = −2</text>
        <text class="ond14-l" x="15" y="38.9" fill="var(--live)">periodo 6</text>
      </svg>
      <figcaption>
      La onda cuadrada y la suma de sus ocho primeros armónicos impares. El 2013 cae
      justo en un salto, donde la serie converge a la semisuma, cero; el 2014 cae
      dentro de un tramo, donde converge a la función.
      </figcaption>
      </figure>

      **La simetría ahorra la mitad del trabajo.**
      $y\left(-t\right)=-y\left(t\right)$: la función es **impar**, así que todos
      los $a_{n}$ —incluido $a_{0}$— son cero sin integrar nada.

      **Los coeficientes del seno.**

      $$
      b_{n}=\frac{2}{T}\int_{-3}^{3}y\left(t\right)
      \operatorname{sen}\frac{n\pi t}{3}\,dt
      =\frac{2}{3}\int_{0}^{3}2\operatorname{sen}\frac{n\pi t}{3}\,dt
      $$

      —el factor $2$ de doblar la integral por simetría ya está incluido—.

      $$
      =\frac43\left[-\frac{3}{n\pi}\cos\frac{n\pi t}{3}\right]_{0}^{3}
      =\frac{4}{n\pi}\left(1-\cos n\pi\right)
      =\frac{4}{n\pi}\left(1-\left(-1\right)^{n}\right)
      $$

      $$
      b_{n}=
      \begin{cases}
      \dfrac{8}{n\pi} & n \text{ impar}\\[6pt]
      0 & n \text{ par}
      \end{cases}
      $$

      $$
      \boxed{\;S\left(t\right)=\frac{8}{\pi}\sum_{k=0}^{\infty}
      \frac{1}{2k+1}\operatorname{sen}\frac{\left(2k+1\right)\pi t}{3}\;}
      $$

      Los primeros: $b_{1}=\frac{8}{\pi}\approx2{,}546$,
      $b_{3}=\frac{8}{3\pi}\approx0{,}849$,
      $b_{5}=\frac{8}{5\pi}\approx0{,}509$.

      **Que los armónicos pares se anulen** es la firma de una función con
      **simetría de media onda**: $y\left(t+3\right)=-y\left(t\right)$. Verlo
      antes de integrar ahorra la mitad de las cuentas.

      **La convergencia.** Por el teorema de Dirichlet —$y$ es continua a trozos y
      con derivada continua a trozos—:

      | dónde | a qué converge |
      |---|---|
      | puntos de continuidad | a $y\left(t\right)$, o sea $\pm2$ |
      | saltos: $t=0,\pm3,\pm6,\ldots$ | a la semisuma, $\frac{2+\left(-2\right)}{2}=0$ |

      Y la convergencia **no es uniforme** cerca de los saltos: es el fenómeno de
      Gibbs, y no desaparece por muchos armónicos que se sumen.

      **Los dos valores.** La clave es reducir al periodo, que es $6$:

      $$
      2013=6\cdot335+3
      \;\Longrightarrow\;
      S\left(2013\right)=S\left(3\right)
      $$

      Y $t=3$ **es un salto**: la función pasa de $2$ a $-2$.

      $$
      \boxed{\;S\left(2013\right)=0\;}
      $$

      $$
      2014=6\cdot335+4
      \;\Longrightarrow\;
      S\left(2014\right)=S\left(4\right)
      $$

      Y $4$ cae dentro de $\left(3,6\right)$, que por periodicidad es el tramo
      equivalente a $\left(-3,0\right)$: ahí $y=-2$, y es un punto de
      continuidad.

      $$
      \boxed{\;S\left(2014\right)=-2\;}
      $$

      **Por qué el enunciado elige esos dos años.** No es decoración: uno cae
      justo en una discontinuidad y el otro no. El ejercicio está comprobando dos
      cosas distintas —saber reducir al periodo y saber qué dice Dirichlet en un
      salto— con una sola pregunta.

      **El error que hay que evitar.** Reducir $2013$ módulo $3$ en vez de módulo
      $6$ da $0$, que también es un salto y también daría $S=0$: se acierta por
      casualidad. Pero con $2014$ el módulo $3$ da $1$, y ahí la función vale
      $+2$: la respuesta saldría con el signo cambiado. **El periodo es $6$, no
      $3$.**
