ejercicios:
  - id: ex1516-rec-1-potencia-negativa-y-la-identidad-del-seno
    titulo: Una potencia negativa en polar, y una identidad que vale en todo el plano
    fuente: >-
      Ejercicio 1 · Cuarta evaluación, PRIMER CUATRIMESTRAL, 4 de abril de 2016
      · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 5
      comp4: 4
    enunciado: |
      a) Dado $z = 3\left(\cos\dfrac{\pi}{8} + i\,\operatorname{sen}\dfrac{\pi}{8}\right)$,
      hallar $z^{-4}$.

      b) Demostrar la siguiente igualdad:
      $\operatorname{sen}^{2} z = \dfrac{1 - \cos 2z}{2}$ para todo $z \in \mathbb{C}$.
    pide: La potencia negativa en forma polar y la demostración de la identidad.

    pasos:
      - tipo: reconocer
        pregunta: |
          El número viene ya en forma polar y el exponente es **negativo**.
          ¿Qué hay que hacer?
        opciones:
          - texto: >-
              Aplicar De Moivre tal cual: el módulo se eleva a $-4$ y el
              argumento se multiplica por $-4$
            correcta: true
            mensaje: |
              Eso es. De Moivre vale para exponente entero, positivo o
              negativo: $\left(r_{\theta}\right)^{n} = \left(r^{n}\right)_{n\theta}$.
              No hay que hacer nada especial por el signo.
          - texto: >-
              Calcular primero $z^{4}$ y después invertir el resultado
            mensaje: |
              Funciona y da lo mismo, pero es el camino largo: invertir un
              complejo pide racionalizar o volver a polar. Con De Moivre sale
              en un paso, y con exponente negativo el módulo simplemente pasa
              al denominador.
          - texto: >-
              Pasar a forma binómica, hacer la potencia y volver a polar
            mensaje: |
              Ahí está la trampa del ejercicio: en binómica hay que desarrollar
              una potencia cuarta con $\cos\frac{\pi}{8}$ y
              $\operatorname{sen}\frac{\pi}{8}$, que no son valores cómodos. La
              forma polar existe precisamente para no hacer eso.
          - texto: >-
              De Moivre solo vale para exponentes positivos, así que hay que
              cambiar el signo del argumento a mano
            mensaje: |
              No hace falta: la fórmula se demuestra para todo entero. Y aunque
              la usaras solo con positivos, cambiar «el signo del argumento» no
              basta — también habría que invertir el módulo.

      - tipo: calcular
        titulo: El módulo de la potencia
        pregunta: |
          ¿Cuánto vale $\left|z^{-4}\right|$?
        respuesta:
          tipo: numero
          valor: '0.0123456790'
          tolerancia: 0.000001
          formato: en forma exacta o con seis decimales
        distractores:
          - valor: '81'
            mensaje: |
              Eso es $3^{4}$, el módulo de $z^{4}$. El exponente es $-4$, así
              que el módulo es $3^{-4}$: el 81 va **debajo**.
          - valor: '12'
            mensaje: |
              $3 \cdot 4$. El módulo no se multiplica por el exponente, se
              **eleva** a él: $|z^{n}| = |z|^{n}$.
          - valor: '-81'
            mensaje: |
              Un módulo nunca es negativo. El signo del exponente pasa el
              módulo al denominador, no lo cambia de signo.
        pista: |
          $|z| = 3$, y $\left|z^{n}\right| = |z|^{n}$. Con $n = -4$ eso es
          $3^{-4} = 1/3^{4}$.
        desarrollo: |
          $$
          \left|z^{-4}\right| = |z|^{-4} = 3^{-4} = \frac{1}{81} \approx 0{,}012346
          $$

      - tipo: calcular
        titulo: El argumento de la potencia
        pregunta: |
          ¿Cuánto vale $\arg\left(z^{-4}\right)$, en radianes y tomado en
          $(-\pi, \pi]$?
        respuesta:
          tipo: numero
          valor: '-1.5707963'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.5707963'
            mensaje: |
              Te has quedado con $\pi/2$ y has perdido el signo. El argumento
              se multiplica por el exponente **con su signo**:
              $-4 \cdot \frac{\pi}{8} = -\frac{\pi}{2}$.
          - valor: '-0.0982'
            mensaje: |
              Eso es $\frac{\pi}{8} \div 4$: has dividido en vez de
              multiplicar. En De Moivre el argumento se multiplica por el
              exponente.
          - valor: '4.712389'
            mensaje: |
              $\frac{3\pi}{2}$ señala el mismo punto del plano, así que como
              ángulo no está mal — pero el enunciado pide el argumento
              principal, que vive en $(-\pi, \pi]$. Réstale $2\pi$.
        pista: |
          $\arg\left(z^{n}\right) = n \cdot \arg z$. Aquí $n = -4$ y
          $\arg z = \pi/8$.
        desarrollo: |
          $$
          \arg\left(z^{-4}\right) = -4 \cdot \frac{\pi}{8} = -\frac{\pi}{2}
          $$

          Y juntando las dos cosas:

          $$
          z^{-4} = \frac{1}{81}\left(\cos\left(-\frac{\pi}{2}\right)
          + i\,\operatorname{sen}\left(-\frac{\pi}{2}\right)\right)
          = \frac{1}{81}\,(0 - i) = -\frac{i}{81}
          $$

          Sale un imaginario puro, y eso se podía anticipar: el argumento
          final es $-\pi/2$, o sea el semieje imaginario negativo.

      - tipo: justificar
        titulo: La demostración de la identidad
        pregunta: >-
          Ordena la demostración de
          $\operatorname{sen}^{2} z = \frac{1-\cos 2z}{2}$. Una pieza es falsa.
        piezas:
          - texto: >-
              En $\mathbb{C}$ las funciones se definen por la exponencial:
              $\operatorname{sen} z = \frac{e^{iz}-e^{-iz}}{2i}$ y
              $\cos z = \frac{e^{iz}+e^{-iz}}{2}$.
          - texto: >-
              Elevando al cuadrado,
              $\operatorname{sen}^{2} z = \frac{\left(e^{iz}-e^{-iz}\right)^{2}}{-4}
              = \frac{e^{2iz} - 2 + e^{-2iz}}{-4}$, porque $(2i)^{2} = -4$.
          - texto: >-
              Por otro lado, $\cos 2z = \frac{e^{2iz}+e^{-2iz}}{2}$, luego
              $1 - \cos 2z = \frac{2 - e^{2iz} - e^{-2iz}}{2}$.
          - texto: >-
              Dividiendo entre 2:
              $\frac{1-\cos 2z}{2} = \frac{2 - e^{2iz} - e^{-2iz}}{4}$, que es
              exactamente lo de arriba con el signo del denominador cambiado
              en el numerador.
          - texto: >-
              Las dos expresiones coinciden para todo $z\in\mathbb{C}$, y la
              cadena solo ha usado propiedades de la exponencial compleja, que
              valen en todo el plano.
          - texto: >-
              Basta con comprobarlo para $z$ real y extenderlo por continuidad,
              porque toda identidad real se cumple también en $\mathbb{C}$.
            trampa: true
            mensaje: |
              Esa afirmación es falsa tal como está escrita: hay identidades
              reales que **no** sobreviven al plano complejo — sin ir más
              lejos, $|\operatorname{sen} x| \le 1$, que en $\mathbb{C}$ se
              rompe (el ejercicio 2 de la recuperación de 2019-2020 pide
              resolver $\cos z = 2$). Lo que sí es cierto es el principio de
              prolongación analítica, pero eso exige hipótesis que aquí ni se
              enuncian. La demostración directa con exponenciales cuesta tres
              líneas y no necesita nada de eso.

    resolucion: |
      ## a) La potencia

      El número ya viene en polar, $z = 3_{\pi/8}$, así que De Moivre se aplica
      directamente. Y vale con exponente **entero cualquiera**, negativo
      incluido:

      $$
      z^{-4} = 3^{-4}\left(\cos\left(-\tfrac{4\pi}{8}\right)
      + i\,\operatorname{sen}\left(-\tfrac{4\pi}{8}\right)\right)
      = \frac{1}{81}\left(\cos\left(-\tfrac{\pi}{2}\right)
      + i\,\operatorname{sen}\left(-\tfrac{\pi}{2}\right)\right)
      $$

      $$
      \boxed{z^{-4} = -\dfrac{i}{81}}
      $$

      Dos comprobaciones que valen puntos de COMP4 y cuestan una línea:

      - **El módulo baja.** $|z| = 3 > 1$, así que elevar a un exponente
        negativo tiene que acercar el número al origen. $1/81$ lo hace.
      - **El argumento gira al revés.** Multiplicar por $-4$ recorre cuatro
        veces el ángulo en sentido horario: $4 \times \frac{\pi}{8} = \frac{\pi}{2}$
        hacia abajo. El resultado cae en el semieje imaginario negativo, y por
        eso sale imaginario puro.

      ## b) La identidad

      No hay que aprenderse nada nuevo: en $\mathbb{C}$ el seno y el coseno
      **se definen** con la exponencial, y toda identidad sale de ahí.

      $$
      \operatorname{sen} z = \frac{e^{iz}-e^{-iz}}{2i},
      \qquad
      \cos z = \frac{e^{iz}+e^{-iz}}{2}
      $$

      Elevando el seno al cuadrado, y usando que $(2i)^{2} = -4$:

      $$
      \operatorname{sen}^{2} z
      = \frac{\left(e^{iz}-e^{-iz}\right)^{2}}{-4}
      = \frac{e^{2iz} - 2 + e^{-2iz}}{-4}
      = \frac{2 - e^{2iz} - e^{-2iz}}{4}
      $$

      Y por el otro lado:

      $$
      \frac{1-\cos 2z}{2}
      = \frac{1}{2}\left(1 - \frac{e^{2iz}+e^{-2iz}}{2}\right)
      = \frac{2 - e^{2iz} - e^{-2iz}}{4}
      $$

      Las dos expresiones son la misma, y la cadena solo usa
      $e^{a}e^{b} = e^{a+b}$, que vale en todo $\mathbb{C}$. Por tanto la
      igualdad se cumple para todo $z$ complejo.

      ## Lo que aquí evalúa la COMP4

      Cuatro de los diez puntos. Y no se los lleva la cuenta, que es corta: se
      los lleva **decir por qué la demostración vale en todo el plano**. Una
      respuesta que compruebe la identidad con números reales y dé el salto a
      $\mathbb{C}$ sin justificarlo está incompleta, aunque la cuenta esté
      bien.

  - id: ex1516-rec-2-recurrente-y-geometrica
    titulo: Dos definiciones, y un ejemplo que las distinga
    fuente: >-
      Ejercicio 2 · Cuarta evaluación, PRIMER CUATRIMESTRAL, 4 de abril de 2016
      · Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp2: 5
      comp4: 5
    enunciado: |
      Definir los conceptos siguientes y dar un ejemplo de los mismos.

      a) Sucesión recurrente.

      b) Serie geométrica.
    pide: Las dos definiciones, cada una con su ejemplo.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace que una sucesión sea **recurrente**?
        opciones:
          - texto: >-
              Que cada término se defina a partir de los anteriores, más los
              primeros términos dados aparte
            correcta: true
            mensaje: |
              Exacto, y las dos mitades son necesarias: la **regla** que liga
              un término con los que le preceden y los **valores iniciales**
              que la arrancan. Sin los iniciales la regla no determina ninguna
              sucesión.
          - texto: Que sus términos se repitan cada cierto número de pasos
            mensaje: |
              Eso es una sucesión **periódica**, que es otra cosa. Recurrente
              no viene de repetir, viene de «recurrir a» los términos
              anteriores.
          - texto: Que exista una fórmula cerrada para el término general
            mensaje: |
              Justo al revés: lo característico de una recurrente es que **no**
              se da la fórmula cerrada, se da la regla. A veces la fórmula
              existe y se puede deducir, pero no es lo que la define.
          - texto: Que sea convergente y su límite se calcule por iteración
            mensaje: |
              Ser recurrente no dice nada sobre converger. $a_{n+1} = 2a_{n}$
              con $a_{1}=1$ es recurrente y se va a infinito.

      - tipo: calcular
        titulo: El ejemplo de serie geométrica, sumado
        pregunta: |
          Para la serie geométrica $\displaystyle\sum_{n=0}^{\infty}\left(\tfrac{2}{3}\right)^{n}$,
          ¿cuánto vale la suma?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Eso es $\frac{r}{1-r} = \frac{2/3}{1/3}$, que es la suma
              empezando en $n=1$. Aquí el índice arranca en $n=0$, y ese primer
              término vale 1: $2 + 1 = 3$.
          - valor: '1.5'
            mensaje: |
              $\frac{1}{1 - 1/3}$: has usado $r = 1/3$ en vez de $r = 2/3$. La
              razón es lo que está elevado a $n$.
          - valor: '0.6667'
            mensaje: |
              Eso es la razón, no la suma. La razón dice cuánto se multiplica
              de un término al siguiente; la suma es
              $\frac{\text{primer término}}{1-r}$.
        pista: |
          Empezando en $n=0$, el primer término es $\left(\frac23\right)^{0}=1$,
          y la suma vale $\frac{1}{1-r}$.
        desarrollo: |
          $$
          \sum_{n=0}^{\infty} r^{n} = \frac{1}{1-r}
          \quad \text{si } |r| < 1
          \qquad\Longrightarrow\qquad
          \sum_{n=0}^{\infty}\left(\frac{2}{3}\right)^{n} = \frac{1}{1-\frac23} = 3
          $$

          Y la hipótesis $|r|<1$ no es decoración: con $r = 2$ la misma
          fórmula daría $\frac{1}{1-2} = -1$, que es absurdo para una suma de
          términos positivos. La fórmula solo existe cuando la serie converge.

      - tipo: justificar
        titulo: Las dos definiciones, escritas
        pregunta: Ordena las dos definiciones con sus ejemplos. Una pieza es falsa.
        piezas:
          - texto: >-
              **Sucesión recurrente**: la que se define dando uno o varios
              términos iniciales y una regla que expresa cada término siguiente
              en función de los anteriores.
          - texto: >-
              Ejemplo: $a_{1} = 1$, $a_{2} = 1$, $a_{n+2} = a_{n+1} + a_{n}$ —
              la sucesión de Fibonacci. Los dos primeros valores son parte de
              la definición, no un añadido.
          - texto: >-
              **Serie geométrica**: la serie $\sum_{n\ge 0} a\,r^{n}$ cuyos
              términos se obtienen multiplicando el anterior siempre por la
              misma razón $r$.
          - texto: >-
              Converge si y solo si $|r| < 1$, y entonces su suma vale
              $\frac{a}{1-r}$, con $a$ el primer término.
          - texto: >-
              Ejemplo: $\sum_{n\ge 0}\left(\frac23\right)^{n} = 3$, con
              $a = 1$ y $r = \frac23$.
          - texto: >-
              Toda sucesión recurrente es geométrica, porque en las dos cada
              término sale del anterior.
            trampa: true
            mensaje: |
              La geométrica es un caso **muy** particular de recurrencia: la de
              regla $a_{n+1} = r\,a_{n}$. Fibonacci también es recurrente y no
              es geométrica — necesita **dos** términos anteriores, y el
              cociente $a_{n+1}/a_{n}$ no es constante (tiende al número
              áureo, pero no lo es).

    resolucion: |
      El ejercicio no pide calcular: pide **escribir bien**. Cinco de los diez
      puntos son terminología y los otros cinco explicación formal, así que lo
      que se corrige es la precisión de cada palabra.

      ## a) Sucesión recurrente

      > Una sucesión $\{a_{n}\}$ es **recurrente** cuando se define dando uno o
      > varios términos iniciales y una regla que expresa cada término en
      > función de un número fijo de términos anteriores.

      Las dos mitades hacen falta. Sin la regla no hay sucesión; sin los
      términos iniciales, la regla no determina cuál de todas las sucesiones
      que la cumplen es la nuestra.

      **Ejemplo.** $a_{1}=1$, $a_{2}=1$, $a_{n+2}=a_{n+1}+a_{n}$: la sucesión
      de Fibonacci, $1, 1, 2, 3, 5, 8, \dots$

      ## b) Serie geométrica

      > Una serie es **geométrica** cuando el cociente entre cada término y el
      > anterior es una constante $r$, llamada razón. Es decir, es de la forma
      > $\sum_{n\ge 0} a\,r^{n}$.

      Y la definición se queda corta si no se dice cuándo suma:

      $$
      \sum_{n=0}^{\infty} a\,r^{n} = \frac{a}{1-r}
      \qquad\text{si y solo si } |r|<1
      $$

      **Ejemplo.** $\sum_{n\ge 0}\left(\frac23\right)^{n}$, con $a=1$ y
      $r=\frac23$, que suma $\dfrac{1}{1-\frac23} = 3$.

      ## El error que cuesta la mitad del ejercicio

      Dar un ejemplo que **no distingue** el concepto. Poner
      $a_{n+1} = \frac23 a_{n}$ como ejemplo de sucesión recurrente es correcto
      pero pobre: es a la vez geométrica, así que no enseña qué separa una cosa
      de la otra. Fibonacci sí lo enseña, porque necesita dos términos
      anteriores y no tiene razón constante.

      Y al revés: una serie geométrica sin decir para qué $r$ converge es media
      definición. La condición $|r|<1$ es la que hace que la fórmula exista.
