ejercicios:
  - id: ex1516-2ev-1-exponencial-compleja
    titulo: Una exponencial compleja igualada a 1 + i
    fuente: >-
      Ejercicio 1 · Segunda evaluación, 23 de noviembre de 2015 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 6
      comp4: 2

    enunciado: |
      Resolver la ecuación $e^{iz} = 1+i$ y representar gráficamente los afijos
      de las soluciones.
    pide: Resolver la ecuación y representar las soluciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántas soluciones tiene la ecuación?
        opciones:
          - texto: >-
              **Infinitas**, porque el logaritmo complejo es multivaluado
            correcta: true
            mensaje: |
              Exacto. Despejar exige tomar logaritmos, y el logaritmo complejo
              tiene un valor por cada vuelta: $\ln w = \ln\left|w\right|
              +i\left(\arg w+2k\pi\right)$. Cada $k$ da una solución, y al
              dividir entre $i$ todas quedan alineadas.
          - texto: Una sola
            mensaje: |
              La exponencial compleja es **periódica** de periodo $2\pi i$:
              $e^{w} = e^{w+2k\pi i}$. Nunca es inyectiva, así que nunca hay una
              sola solución.
          - texto: Dos
            mensaje: |
              Dos serían si la ecuación fuera cuadrática. Aquí es exponencial.
          - texto: Ninguna, porque $1+i$ no es real
            mensaje: |
              La exponencial compleja toma **todos** los valores salvo el 0, así
              que la ecuación siempre tiene solución si el segundo miembro no es
              nulo.

      - tipo: calcular
        titulo: El módulo del segundo miembro
        pregunta: |
          ¿Cuánto vale $\ln\left|1+i\right|$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.3466'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0.6931'
            mensaje: |
              $\ln2 \approx 0{,}693$ es el logaritmo del **cuadrado** del
              módulo. El módulo es $\sqrt2$, y $\ln\sqrt2 = \frac12\ln2$.
          - valor: '1.4142136'
            mensaje: |
              $\sqrt2$ es el módulo, no su logaritmo.
          - valor: '0'
            mensaje: |
              0 sería si el módulo valiera 1. Aquí vale $\sqrt2 \approx 1{,}41$.
        pista: |
          $\left|1+i\right| = \sqrt2$, y $\ln\sqrt2 = \frac12\ln2$.
        desarrollo: |
          $$
          \left|1+i\right| = \sqrt{1+1} = \sqrt2
          $$

          $$
          \ln\sqrt2 = \frac12\ln2 \approx 0{,}3466
          $$

          Y el argumento, con el afijo en el primer cuadrante:

          $$
          \arg(1+i) = \frac{\pi}{4}
          $$
        veredicto: |
          Ese $\frac12\ln2$ va a ser la parte **imaginaria** de todas las
          soluciones, con signo menos. Es lo que las alinea sobre una recta
          horizontal.

      - tipo: calcular
        titulo: La parte real de la primera solución
        pregunta: |
          Con $k=0$, ¿cuál es la parte real de $z$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.7854'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '-0.3466'
            mensaje: |
              $-0{,}3466$ es la parte **imaginaria**. Al dividir entre $i$ las
              dos componentes se intercambian, y esa es la trampa del ejercicio.
          - valor: '0.3466'
            mensaje: |
              $0{,}3466$ es $\ln\sqrt2$, que acaba en la parte imaginaria con
              signo negativo.
          - valor: '1.5708'
            mensaje: |
              $\frac{\pi}{2}$ saldría de un argumento de $90°$. El de $1+i$ es
              $\frac{\pi}{4}$.
        pista: |
          $z = \frac{\ln(1+i)}{i}$, y dividir entre $i$ es multiplicar por
          $-i$.
        desarrollo: |
          Tomando logaritmos:

          $$
          iz = \ln(1+i) = \ln\sqrt2+i\left(\frac{\pi}{4}+2k\pi\right)
          $$

          Despejando —y dividir entre $i$ es multiplicar por $-i$, porque
          $\frac1i = -i$—:

          $$
          z = -i\left[\ln\sqrt2+i\left(\frac{\pi}{4}+2k\pi\right)\right]
          $$

          $$
          = -i\ln\sqrt2-i^{2}\left(\frac{\pi}{4}+2k\pi\right)
          = \left(\frac{\pi}{4}+2k\pi\right)-i\ln\sqrt2
          $$

          Con $k=0$, la parte real es $\frac{\pi}{4} \approx 0{,}7854$.
        veredicto: |
          **Las componentes se intercambian**: el argumento acaba en la parte
          real y el logaritmo del módulo en la imaginaria. Es lo que hace
          multiplicar por $-i$, que es un giro de $-90°$.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Tomar logaritmos**, que es multivaluado:
              $iz = \ln(1+i) = \ln\sqrt2+i\left(\frac{\pi}{4}+2k\pi\right)$,
              con $k\in\mathbb{Z}$.
          - texto: |
              **Despejar** multiplicando por $-i$, ya que $\frac1i = -i$.
          - texto: |
              $z_k = \left(\frac{\pi}{4}+2k\pi\right)-i\,\frac{\ln2}{2}$: las
              componentes quedan **intercambiadas** respecto del logaritmo.
          - texto: |
              **La representación:** todos los afijos están sobre la **recta
              horizontal** $y = -\frac{\ln2}{2} \approx -0{,}347$, separados
              $2\pi$ entre sí.
          - texto: |
              La parte imaginaria es la misma para todas, porque el módulo de
              $1+i$ no depende de $k$; lo que cambia con $k$ es solo el
              argumento, y ese acaba en la parte real.
          - texto: |
              Como $\left|e^{iz}\right| = 1$ siempre, la ecuación solo tiene
              solución si $\left|1+i\right| = 1$.
            trampa: true
            mensaje: |
              $\left|e^{iz}\right| = 1$ solo cuando $z$ es **real**. Con $z$
              complejo, $\left|e^{iz}\right| = e^{-\mathrm{Im}(z)}$, que puede
              valer cualquier positivo. De hecho aquí sale
              $\mathrm{Im}(z) = -\ln\sqrt2$, precisamente para que el módulo dé
              $\sqrt2$.
        veredicto: |
          Que la parte imaginaria salga negativa es lo que hace que el módulo
          sea mayor que 1. Comprobarlo es la verificación más rápida.

    resolucion: |
      **Datos.** $e^{iz} = 1+i$, con $z$ complejo.

      ### 1 · Por qué hay infinitas soluciones

      La exponencial compleja es **periódica**:

      $$
      e^{w} = e^{w+2k\pi i} \qquad \forall k \in \mathbb{Z}
      $$

      Nunca es inyectiva, así que una ecuación como esta tiene **infinitas**
      soluciones — una por vuelta. Decirlo desde el principio evita el error de
      dar solo una.

      ### 2 · El segundo miembro, en polar

      $$
      \left|1+i\right| = \sqrt2,
      \qquad
      \arg(1+i) = \frac{\pi}{4}
      $$

      —primer cuadrante, así que el arcotangente vale tal cual—.

      ### 3 · Tomar logaritmos

      $$
      iz = \ln(1+i) = \ln\left|1+i\right|
      + i\left(\arg(1+i)+2k\pi\right)
      $$

      $$
      iz = \ln\sqrt2+i\left(\frac{\pi}{4}+2k\pi\right),
      \qquad k\in\mathbb{Z}
      $$

      ### 4 · Despejar

      Dividir entre $i$ es **multiplicar por $-i$**, porque

      $$
      \frac1i = \frac{1}{i}\cdot\frac{-i}{-i} = \frac{-i}{1} = -i
      $$

      $$
      z = -i\left[\ln\sqrt2+i\left(\frac{\pi}{4}+2k\pi\right)\right]
      = -i\ln\sqrt2+\left(\frac{\pi}{4}+2k\pi\right)
      $$

      $$
      \boxed{z_k = \left(\frac{\pi}{4}+2k\pi\right)
      - \frac{\ln2}{2}\,i, \qquad k\in\mathbb{Z}}
      $$

      —usando $\ln\sqrt2 = \frac12\ln2 \approx 0{,}3466$—.

      **Lo que hay que ver:** al multiplicar por $-i$ las dos componentes se
      **intercambian**. El argumento del logaritmo acaba en la parte **real** de
      $z$, y el logaritmo del módulo en la **imaginaria**, con signo cambiado.
      Multiplicar por $-i$ es girar $-90°$, y eso es exactamente lo que hace un
      giro de un cuarto de vuelta.

      ### 5 · La representación

      Todos los afijos tienen **la misma parte imaginaria**:

      $$
      \mathrm{Im}(z_k) = -\frac{\ln2}{2} \approx -0{,}347
      $$

      y partes reales que van de $2\pi$ en $2\pi$:

      $$
      \ldots,\ \frac{\pi}{4}-2\pi,\ \frac{\pi}{4},\ \frac{\pi}{4}+2\pi,\ \ldots
      $$

      $$
      \boxed{\text{Puntos equiespaciados sobre la recta horizontal }
      y = -\tfrac{\ln2}{2}}
      $$

      Es decir: una fila de puntos, separados $2\pi \approx 6{,}28$, ligeramente
      **por debajo** del eje real.

      ### 6 · Por qué la parte imaginaria es negativa

      Vale la pena entenderlo, porque es la comprobación más rápida. Con
      $z = a+bi$:

      $$
      e^{iz} = e^{i(a+bi)} = e^{ia-b} = e^{-b}\,e^{ia}
      $$

      $$
      \left|e^{iz}\right| = e^{-b}
      $$

      Para que el módulo sea $\sqrt2 > 1$ hace falta $e^{-b}>1$, es decir
      **$b<0$**. Y en efecto $b = -\frac{\ln2}{2}$.

      Esto también desmonta la idea de que $\left|e^{iz}\right| = 1$: eso solo
      vale cuando $z$ es **real**.

      ### 7 · Comprobación

      Con $k=0$: $z = \frac{\pi}{4}-\frac{\ln2}{2}i
      \approx 0{,}7854-0{,}3466i$.

      $$
      iz = i\left(0{,}7854-0{,}3466i\right)
      = 0{,}3466+0{,}7854i
      $$

      $$
      e^{iz} = e^{0,3466}\left(\cos0{,}7854+i\,\mathrm{sen}\,0{,}7854\right)
      $$

      $$
      = 1{,}4142\left(0{,}7071+0{,}7071i\right) = 1+i \quad\checkmark
      $$

      **Con $k=1$**, la parte real crece $2\pi$ y el coseno y el seno repiten
      valores: el resultado es el mismo ✔ Es la periodicidad en acción.

      **Del módulo:** $e^{0,3466} = \sqrt2$ ✔ que es exactamente
      $e^{\ln\sqrt2}$.

  - id: ex1516-2ev-2-deposito-cilindrico
    titulo: El depósito más barato, con dos precios distintos
    fuente: >-
      Ejercicio 2 · Segunda evaluación, 23 de noviembre de 2015 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3

    enunciado: |
      Debemos construir un depósito cilíndrico sin tapa de 5000 m³ de
      capacidad. ¿Cuáles serán las dimensiones más económicas del depósito si la
      base cuesta 5 €/m² y las paredes laterales 8 €/m²?
    pide: Calcular el radio y la altura más económicos.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué no se minimiza la superficie total, sino otra cosa?
        opciones:
          - texto: >-
              Porque los dos materiales **cuestan distinto**: hay que minimizar
              el **coste**, no el área
            correcta: true
            mensaje: |
              Exacto, y es lo que distingue este problema del clásico. Con
              precios iguales el óptimo sería otro. Cada metro cuadrado de pared
              cuesta un 60 % más que uno de base, así que conviene un depósito
              más ancho y bajo de lo que saldría minimizando superficie.
          - texto: >-
              Porque el depósito no tiene tapa
            mensaje: |
              Que no tenga tapa cambia la fórmula del área, pero eso pasaría
              igual con precios iguales. Lo que obliga a hablar de coste son los
              dos precios.
          - texto: >-
              Porque el volumen está fijado
            mensaje: |
              El volumen fijado es la **ligadura**, común a los dos
              planteamientos. No es lo que decide qué se minimiza.
          - texto: >-
              Es lo mismo: minimizar coste y minimizar área dan el mismo
              resultado
            mensaje: |
              Solo coincidirían si los dos precios fueran iguales. Con 5 y 8 el
              óptimo se desplaza.

      - tipo: calcular
        titulo: El radio óptimo
        pregunta: |
          ¿Cuál es el radio más económico? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '13.6556'
          tolerancia: 0.005
          formato: un número en metros
        distractores:
          - valor: '8.5348'
            mensaje: |
              $8{,}53$ es la **altura** del depósito óptimo, no el radio. El
              depósito sale más ancho que alto.
          - valor: '11.6825'
            mensaje: |
              $11{,}68$ saldría de minimizar la **superficie** en vez del coste,
              ignorando que la pared es más cara.
          - valor: '20'
            mensaje: |
              20 es $\sqrt[3]{8000}$, olvidando el $\pi$. La ecuación es
              $r^{3} = \frac{8000}{\pi}$.
        pista: |
          $C(r) = 5\pi r^{2}+\frac{80000}{r}$. Deriva e iguala a cero.
        desarrollo: |
          De la ligadura $V = \pi r^{2}h = 5000$:

          $$
          h = \frac{5000}{\pi r^{2}}
          $$

          El coste, con base $\pi r^{2}$ a 5 €/m² y pared lateral $2\pi rh$ a
          8 €/m²:

          $$
          C = 5\pi r^{2}+8\cdot2\pi r\cdot\frac{5000}{\pi r^{2}}
          = 5\pi r^{2}+\frac{80000}{r}
          $$

          $$
          C'(r) = 10\pi r-\frac{80000}{r^{2}} = 0
          \;\Longrightarrow\;
          10\pi r^{3} = 80000
          $$

          $$
          r^{3} = \frac{8000}{\pi}
          \;\Longrightarrow\;
          r = \frac{20}{\sqrt[3]{\pi}} \approx 13{,}6556 \ \text{m}
          $$
        veredicto: |
          El $\pi$ del denominador desaparece de la ligadura y reaparece en la
          raíz cúbica. Dejar $r = \frac{20}{\sqrt[3]{\pi}}$ es más limpio que
          arrastrar decimales.

      - tipo: calcular
        titulo: La proporción del depósito
        pregunta: |
          ¿Cuánto vale el cociente $\dfrac{h}{r}$ en el óptimo? Da cuatro
          decimales.
        respuesta:
          tipo: numero
          valor: '0.625'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '1.6'
            mensaje: |
              $1{,}6 = \frac85$ es el cociente **invertido**. Sale
              $\frac hr = \frac58$: la razón de los precios, base entre pared.
          - valor: '1'
            mensaje: |
              1 sería un depósito con altura igual al radio. Eso saldría con
              otros precios, no con estos.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es la proporción del cilindro de **superficie** mínima
              sin tapa, ignorando los precios.
        pista: |
          Sustituye $r^{3} = \frac{8000}{\pi}$ en
          $\frac hr = \frac{5000}{\pi r^{3}}$.
        desarrollo: |
          $$
          \frac{h}{r} = \frac{5000}{\pi r^{2}}\cdot\frac1r
          = \frac{5000}{\pi r^{3}}
          $$

          Y sustituyendo la condición del óptimo, $r^{3} = \frac{8000}{\pi}$:

          $$
          \frac{h}{r} = \frac{5000}{\pi\cdot\frac{8000}{\pi}}
          = \frac{5000}{8000} = \frac58 = 0{,}625
          $$

          **Los $\pi$ se cancelan** y queda exactamente la razón de los
          precios: base entre pared.
        veredicto: |
          $\frac hr = \frac{\text{precio de la base}}{\text{precio de la
          pared}}$. Es una regla general de este problema, y sirve para
          comprobar el resultado sin rehacer la cuenta.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La ligadura:** $\pi r^{2}h = 5000$, de donde
              $h = \frac{5000}{\pi r^{2}}$. Una sola incógnita.
          - texto: |
              **La función objetivo es el COSTE**, no el área:
              $C = 5\cdot\pi r^{2}+8\cdot2\pi rh$.
          - texto: |
              Sustituyendo $h$:
              $C(r) = 5\pi r^{2}+\frac{80000}{r}$, con $r>0$.
          - texto: |
              **Derivar:** $C'(r) = 10\pi r-\frac{80000}{r^{2}}$, que se anula
              en $r^{3} = \frac{8000}{\pi}$, es decir
              $r \approx 13{,}66$ m.
          - texto: |
              **Justificar que es mínimo:**
              $C''(r) = 10\pi+\frac{160000}{r^{3}} > 0$ para todo $r>0$, así
              que $C$ es convexa. Y $h \approx 8{,}53$ m.
          - texto: |
              El depósito óptimo tiene la altura igual al radio, como todo
              cilindro de coste mínimo.
            trampa: true
            mensaje: |
              No hay tal regla. Aquí sale $\frac hr = \frac58$, más ancho que
              alto. La proporción depende de **los precios** y de que no haya
              tapa: con base y pared al mismo precio y sin tapa saldría
              $\frac hr = 1$, y con tapa, $\frac hr = 2$. Buscar una proporción
              universal en lugar de derivar da la respuesta equivocada.
        veredicto: |
          Que $C''>0$ para todo $r>0$ ahorra discutir extremos: la función es
          convexa en todo el dominio y el punto crítico es mínimo absoluto.

    resolucion: |
      **Datos.** Cilindro sin tapa de 5000 m³; base a 5 €/m², pared a 8 €/m².

      ### 1 · Lo que hace distinto a este problema

      El clásico minimiza **superficie**. Aquí los dos materiales cuestan
      distinto, así que hay que minimizar **coste**, y el óptimo se desplaza:
      como la pared es un 60 % más cara, conviene un depósito más **ancho y
      bajo**.

      ### 2 · Plantear

      **La ligadura**, que reduce dos incógnitas a una:

      $$
      V = \pi r^{2}h = 5000
      \;\Longrightarrow\;
      h = \frac{5000}{\pi r^{2}}
      $$

      **Las superficies**, con el depósito **sin tapa**:

      | parte | área | precio |
      |---|---|---|
      | base | $\pi r^{2}$ | 5 €/m² |
      | pared lateral | $2\pi rh$ | 8 €/m² |

      **La función objetivo:**

      $$
      C = 5\pi r^{2}+16\pi rh
      = 5\pi r^{2}+16\pi r\cdot\frac{5000}{\pi r^{2}}
      $$

      $$
      C(r) = 5\pi r^{2}+\frac{80000}{r}, \qquad r>0
      $$

      ### 3 · Optimizar

      $$
      C'(r) = 10\pi r-\frac{80000}{r^{2}} = 0
      \;\Longrightarrow\;
      10\pi r^{3} = 80000
      $$

      $$
      r^{3} = \frac{8000}{\pi}
      \;\Longrightarrow\;
      \boxed{r = \frac{20}{\sqrt[3]{\pi}} \approx 13{,}6556 \ \text{m}}
      $$

      $$
      h = \frac{5000}{\pi r^{2}} \approx 8{,}5348 \ \text{m}
      $$

      **Que es mínimo:**

      $$
      C''(r) = 10\pi+\frac{160000}{r^{3}} > 0 \qquad \forall r>0
      $$

      Positiva en todo el dominio: $C$ es **convexa** y el punto crítico es
      mínimo **absoluto**. No hay que discutir extremos.

      ### 4 · La proporción, que es lo bonito

      $$
      \frac{h}{r} = \frac{5000}{\pi r^{3}}
      = \frac{5000}{\pi\cdot\frac{8000}{\pi}}
      = \frac{5000}{8000} = \frac58
      $$

      $$
      \boxed{\frac{h}{r} = \frac{\text{precio de la base}}
      {\text{precio de la pared}}}
      $$

      Los $\pi$ y el volumen **se cancelan**: la proporción óptima no depende
      del tamaño del depósito, solo de los precios.

      | situación | $\frac hr$ |
      |---|---|
      | sin tapa, precios iguales | $1$ |
      | sin tapa, base 5 y pared 8 | $\frac58 = 0{,}625$ |
      | con tapa, precios iguales | $2$ |

      Cuanto más cara la pared, **más bajo y ancho** el depósito: se ahorra
      superficie lateral a costa de base.

      ### 5 · El coste

      $$
      C = 5\pi(13{,}6556)^{2}+\frac{80000}{13{,}6556}
      = 2929{,}5+5858{,}2
      $$

      $$
      C_{\min} \approx 8788
      $$

      es decir, unos **8788 €**.

      Y nótese que la pared cuesta **exactamente el doble** que la base:
      $5858 = 2\times2929$. No es casualidad, y sale de la condición de óptimo.

      ### 6 · Comprobación

      **Del volumen:**

      $$
      \pi(13{,}6556)^{2}(8{,}5348) = \pi\cdot186{,}47\cdot8{,}5348
      \approx 5000 \ \text{m}^{3} \quad\checkmark
      $$

      **Numérica del coste:**

      | $r$ | $C(r)$ |
      |---|---|
      | $12$ | $8929$ |
      | $13{,}66$ | $\mathbf{8788}$ |
      | $15$ | $8867$ |

      El del punto crítico es el menor ✔ Y la curva es bastante plana cerca del
      óptimo, lo que es habitual en estos problemas.

      **De la relación 2:1 entre costes.** En el óptimo,
      $C'(r) = 0$ significa $10\pi r^{3} = 80000$, y entonces

      $$
      \frac{\text{coste pared}}{\text{coste base}}
      = \frac{80000/r}{5\pi r^{2}} = \frac{80000}{5\pi r^{3}}
      = \frac{80000}{5\cdot8000} = 2 \quad\checkmark
      $$

      Otra regla general del problema: **en el óptimo, la pared cuesta el doble
      que la base**.

  - id: ex1516-2ev-3-teorema-del-punto-fijo
    titulo: Toda función que no se sale de su intervalo tiene un punto fijo
    fuente: >-
      Ejercicio 3 · Segunda evaluación, 23 de noviembre de 2015 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 2
      comp4: 8

    enunciado: |
      Enunciar y demostrar el Teorema del Punto Fijo (el de la existencia, no el
      de la unicidad).
    pide: Enunciar y demostrar el teorema.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué teorema se apoya la demostración?
        opciones:
          - texto: >-
              En **Bolzano**, aplicado a la función auxiliar $g(x) = f(x)-x$
            correcta: true
            mensaje: |
              Exacto. Un punto fijo es un cero de $f(x)-x$, y Bolzano garantiza
              ceros de funciones continuas que cambian de signo. Toda la
              demostración consiste en construir esa función auxiliar y
              comprobar los signos en los extremos.
          - texto: En el teorema de Rolle
            mensaje: |
              Rolle habla de derivadas, y aquí no se supone que $f$ sea
              derivable: solo continua.
          - texto: En el teorema de Weierstrass
            mensaje: |
              Weierstrass da máximo y mínimo, que no es lo que hace falta. Lo
              que se busca es un cero, y eso lo da Bolzano.
          - texto: >-
              En el teorema del valor medio
            mensaje: |
              También exige derivabilidad. El enunciado del punto fijo solo pide
              continuidad, así que la demostración no puede usar derivadas.

      - tipo: calcular
        titulo: La función auxiliar en los extremos
        pregunta: |
          Con $g(x) = f(x)-x$ y $f:[a,b]\to[a,b]$, ¿qué signo tiene $g(a)$?
          Responde 1 si es $\ge0$, $-1$ si es $\le0$.
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.1
          formato: 1 o -1
        distractores:
          - valor: '-1'
            mensaje: |
              Como $f$ llega a $[a,b]$, se tiene $f(a) \ge a$: el valor no puede
              caer por debajo del extremo izquierdo. Luego
              $g(a) = f(a)-a \ge 0$.
          - valor: '0'
            mensaje: |
              Puede valer 0 —y entonces $a$ ya es el punto fijo— pero no tiene
              por qué. Lo que se sabe con seguridad es que no es negativo.
        pista: |
          La hipótesis clave es que $f$ **llega a $[a,b]$**: sus valores no se
          salen del intervalo.
        desarrollo: |
          La hipótesis $f:[a,b]\to[a,b]$ dice que $f(x)$ **nunca se sale del
          intervalo**. En particular:

          $$
          a \le f(a) \le b
          \;\Longrightarrow\;
          g(a) = f(a)-a \ge 0
          $$

          $$
          a \le f(b) \le b
          \;\Longrightarrow\;
          g(b) = f(b)-b \le 0
          $$

          **Los signos son opuestos**, que es justo lo que Bolzano necesita.
        veredicto: |
          Toda la fuerza del teorema está en esa hipótesis: la función no puede
          escaparse del cuadrado. Si pudiera, no habría por qué cruzar la
          diagonal.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Enunciado.** Si $f:[a,b]\to[a,b]$ es continua, existe
              $c\in[a,b]$ tal que $f(c) = c$.
          - texto: |
              **La función auxiliar:** $g(x) = f(x)-x$, continua en $[a,b]$ por
              ser diferencia de continuas.
          - texto: |
              **Los signos.** Como $f(a)\ge a$, se tiene $g(a)\ge0$; y como
              $f(b)\le b$, se tiene $g(b)\le0$.
          - texto: |
              **Los casos borde.** Si $g(a)=0$, entonces $c=a$; si $g(b)=0$,
              entonces $c=b$. En los dos casos ya hay punto fijo.
          - texto: |
              **El caso general.** Si $g(a)>0$ y $g(b)<0$, Bolzano da
              $c\in(a,b)$ con $g(c)=0$, es decir $f(c)=c$. $\blacksquare$
          - texto: |
              Hace falta además que $f$ sea creciente, para que $g$ cambie de
              signo una sola vez.
            trampa: true
            mensaje: |
              No hace falta ninguna monotonía: Bolzano no la pide, y el teorema
              **no promete unicidad** — el enunciado lo dice expresamente. Una
              función continua de $[a,b]$ en $[a,b]$ puede tener muchísimos
              puntos fijos; la identidad los tiene todos. Añadir hipótesis de
              más resta tanto como omitir las necesarias.
        veredicto: |
          Los casos borde parecen burocracia y no lo son: Bolzano en su forma
          estricta exige signos **opuestos**, y si alguno de los dos es cero hay
          que tratarlo aparte.

    resolucion: |
      **Enunciado pedido.** El teorema del punto fijo, en su versión de
      existencia.

      ### 1 · El enunciado

      > **Teorema del punto fijo.** Sea $f:[a,b]\to[a,b]$ una función
      > **continua**. Entonces existe al menos un $c \in [a,b]$ tal que
      >
      > $$
      > f(c) = c
      > $$

      **Las dos hipótesis, y qué hace cada una:**

      | hipótesis | para qué sirve |
      |---|---|
      | $f$ continua | poder aplicar Bolzano |
      | $f\left([a,b]\right) \subseteq [a,b]$ | fijar los signos en los extremos |

      La segunda es la que suele olvidarse al enunciarlo, y es la esencial: dice
      que **la función no se sale del intervalo**.

      ### 2 · La idea, antes de la demostración

      Un punto fijo es donde la gráfica de $f$ corta a la **diagonal** $y=x$.

      Y la hipótesis dice que la gráfica está encerrada en el cuadrado
      $[a,b]\times[a,b]$. Una curva continua que empieza en el borde izquierdo
      de ese cuadrado —a la altura que sea— y acaba en el derecho **tiene que
      cruzar la diagonal**: no hay forma de ir de un lado a otro sin tocarla sin
      salirse.

      Eso es lo que la demostración escribe con rigor.

      ### 3 · La demostración

      **Paso 1 — la función auxiliar.** Sea

      $$
      g(x) = f(x)-x
      $$

      Es **continua** en $[a,b]$, por ser diferencia de dos funciones continuas.
      Y un punto fijo de $f$ es exactamente un **cero** de $g$.

      **Paso 2 — los signos en los extremos.** Como $f$ toma valores en
      $[a,b]$:

      $$
      f(a) \ge a
      \;\Longrightarrow\;
      g(a) = f(a)-a \ge 0
      $$

      $$
      f(b) \le b
      \;\Longrightarrow\;
      g(b) = f(b)-b \le 0
      $$

      **Paso 3 — los casos borde.** Si $g(a) = 0$, entonces $f(a)=a$ y $c=a$
      resuelve. Si $g(b)=0$, entonces $c=b$. En los dos casos ya hay punto fijo
      y no hace falta seguir.

      **Paso 4 — el caso general.** Si no, se tiene

      $$
      g(a) > 0
      \qquad\text{y}\qquad
      g(b) < 0
      $$

      Signos **estrictamente** opuestos, y $g$ continua en $[a,b]$: por el
      **teorema de Bolzano** existe $c \in (a,b)$ con

      $$
      g(c) = 0
      \;\Longrightarrow\;
      f(c) = c \qquad \blacksquare
      $$

      ### 4 · Por qué el enunciado aclara «no el de la unicidad»

      Porque el teorema **no** la da. Una función continua de $[a,b]$ en
      $[a,b]$ puede tener:

      - **un** punto fijo, como $f(x) = \frac{x}{2}$ en $[0,1]$, que solo lo
        tiene en 0;
      - **varios**, como cualquier función que oscile alrededor de la diagonal;
      - **infinitos**: la identidad $f(x)=x$ los tiene todos.

      Para la unicidad hace falta una hipótesis más fuerte —que $f$ sea
      **contractiva**, es decir que acerque los puntos—, y eso es otro teorema.

      Y **no hace falta monotonía** ni derivabilidad: Bolzano solo pide
      continuidad.

      ### 5 · Las dos hipótesis son necesarias

      **Sin continuidad.** La función de $[0,1]$ en $[0,1]$

      $$
      f(x) = \begin{cases} 1 & x<\tfrac12 \\[3pt] 0 & x\ge\tfrac12 \end{cases}
      $$

      no tiene ningún punto fijo: salta por encima de la diagonal sin tocarla.

      **Sin la condición de llegada.** $f(x) = x+1$ es continua en $[0,1]$ pero
      llega a $[1,2]$, y no tiene punto fijo: $x+1 = x$ es imposible.

      ### 6 · Comprobación con ejemplos

      **$f(x) = \cos x$ en $[0,1]$.** Continua, y $\cos$ de algo en $[0,1]$ cae
      en $[0{,}54;\,1]\subset[0,1]$ ✔ Luego hay punto fijo:

      $$
      g(0) = 1-0 = 1 > 0,
      \qquad
      g(1) = 0{,}5403-1 = -0{,}4597 < 0
      $$

      Y en efecto $\cos c = c$ para $c \approx 0{,}739$ ✔ — la constante de
      Dottie, que es lo que sale al pulsar «cos» repetidamente en una
      calculadora.

      **$f(x) = x^{2}$ en $[0,1]$.** Continua y llega a $[0,1]$ ✔ Sus puntos
      fijos son $x=0$ y $x=1$: **dos**, lo que confirma que el teorema no
      promete unicidad ✔

  - id: ex1516-2ev-4-cual-es-la-derivada
    titulo: Cuál de las dos curvas es la derivada
    fuente: >-
      Ejercicio 4 · Segunda evaluación, 23 de noviembre de 2015 · Cálculo,
      UPV/EHU · El examen no publica solución: la resolución es propuesta
      nuestra, pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 3
      comp4: 5

    enunciado: |
      La figura muestra las gráficas de una función $F(x)$ y de su derivada
      $F'(x)$, definidas en un intervalo $(a,b)$. Se pide:

      <figure class="figura-examen">
      <svg viewBox="0 0 700 400" role="img" width="680" height="388"
           aria-labelledby="f1516b4t f1516b4d">
        <title id="f1516b4t">Las dos curvas sin etiquetar</title>
        <desc id="f1516b4d">Dos curvas sobre el mismo eje. Una entra alta por
        la izquierda, baja hasta un minimo suave por encima del eje, sube hasta
        un maximo y vuelve a bajar cortando el eje. La otra entra por debajo
        del eje, sube cortandolo justo donde la primera tiene su minimo, alcanza
        un maximo y baja cortando el eje justo donde la primera tiene su
        maximo.</desc>

        <g stroke="var(--graphite)" stroke-width="1.4" fill="none">
          <path d="M40 240 L660 240 M180 40 L180 360"></path>
        </g>

        <g stroke="var(--ink)" stroke-width="6" fill="none"
           stroke-linecap="round">
          <path d="M100 240 L600 240"></path>
        </g>

        <g stroke="var(--d1)" stroke-width="2.8" fill="none"
           stroke-linecap="round">
          <path d="M100 90 C 130 150, 160 195, 200 200
                   C 260 208, 320 175, 380 140
                   C 440 105, 500 160, 600 320"></path>
        </g>

        <g stroke="var(--flag)" stroke-width="2.8" fill="none"
           stroke-linecap="round" stroke-dasharray="9 6">
          <path d="M100 340 C 140 280, 170 245, 200 240
                   C 250 232, 300 190, 380 178
                   C 440 172, 500 205, 600 300"></path>
        </g>

        <g fill="var(--alt)">
          <circle cx="200" cy="240" r="6"></circle>
          <circle cx="380" cy="178" r="6"></circle>
        </g>

        <g fill="var(--graphite)" font-size="15" font-family="var(--mono)">
          <text x="94" y="228">a</text>
          <text x="592" y="228">b</text>
          <text x="188" y="34">y</text>
          <text x="668" y="234">x</text>
        </g>

        <g fill="var(--alt)" font-size="12" font-family="var(--mono)">
          <text x="150" y="272">m</text>
          <text x="392" y="168">M</text>
        </g>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original, que no etiqueta las curvas: eso
      es lo que pide el apartado (a). Los nombres m y M son nuestros, para poder
      referirse a los dos puntos que resuelven la identificacion.
      </figcaption>
      </figure>

      **a)** Identificar de forma razonada qué gráfica corresponde a $F(x)$ y
      qué gráfica corresponde a $F'(x)$.

      **b)** Estudiar el crecimiento, decrecimiento y los extremos de la nueva
      función $h(x) = e^{-2x}\left(F(x)\right)^{2}$.
    pide: Identificar las curvas y estudiar $h$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué criterio identifica cuál es la derivada?
        opciones:
          - texto: >-
              La derivada **corta el eje** exactamente donde la otra tiene sus
              extremos
            correcta: true
            mensaje: |
              Ese es el criterio decisivo, y además es fácil de comprobar en el
              dibujo. Si una curva corta el eje justo en las abscisas donde la
              otra se aplana, la primera es la derivada de la segunda. Si no
              encaja, es al revés.
          - texto: >-
              La derivada siempre está por debajo
            mensaje: |
              No hay ninguna relación de altura entre una función y su derivada:
              depende de las escalas y de la función.
          - texto: >-
              La derivada es la curva más suave
            mensaje: |
              Al derivar se pierde suavidad, no se gana: si $F$ es de clase
              $C^{2}$, $F'$ es solo $C^{1}$. Y a ojo no se distingue.
          - texto: >-
              La derivada corta el eje donde lo corta la función
            mensaje: |
              Los ceros de $F$ y los de $F'$ no tienen por qué coincidir. Lo que
              se relaciona son los ceros de $F'$ con los **extremos** de $F$.

      - tipo: calcular
        titulo: Los puntos críticos de h
        pregunta: |
          $h'(x) = 2e^{-2x}F(x)\left[F'(x)-F(x)\right]$. ¿Cuántas condiciones
          distintas anulan $h'$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.1
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              El producto tiene **dos** factores que pueden anularse: $F$ y
              $F'-F$. El tercero, $e^{-2x}$, no se anula nunca.
          - valor: '3'
            mensaje: |
              3 contaría también $e^{-2x}$, pero una exponencial **nunca** vale
              cero. Ese factor solo aporta signo positivo.
          - valor: '0'
            mensaje: |
              $h'$ sí se anula: donde $F=0$ y donde las dos curvas se cortan.
        pista: |
          ¿Puede anularse $e^{-2x}$?
        desarrollo: |
          Derivando con la regla del producto y la cadena:

          $$
          h'(x) = -2e^{-2x}F^{2}+e^{-2x}\cdot2F\,F'
          = 2e^{-2x}F\left(F'-F\right)
          $$

          El factor $e^{-2x}$ es **siempre positivo**: nunca se anula y no
          afecta al signo. Quedan **dos** condiciones:

          $$
          F(x) = 0
          \qquad\text{o}\qquad
          F'(x) = F(x)
          $$

          La segunda es especialmente cómoda de leer en la figura: es donde las
          **dos curvas se cortan**.
        veredicto: |
          Que una de las condiciones sea «las dos curvas se cortan» es lo que
          hace este ejercicio resoluble con el dibujo delante y sin ninguna
          expresión analítica.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **(a) El criterio.** $F'$ se anula donde $F$ tiene extremos. Se
              buscan en el dibujo las abscisas donde una curva se aplana y se
              comprueba si la otra corta el eje ahí.
          - texto: |
              La curva **de trazos** corta el eje justo en la abscisa donde la
              **continua** tiene su mínimo, y vuelve a cortarlo donde la
              continua tiene su máximo. Luego la de trazos es $F'$ y la continua
              es $F$.
          - texto: |
              **Comprobación de signos:** donde la de trazos está por debajo del
              eje, la continua **baja**; donde está por encima, **sube**.
              Coherente.
          - texto: |
              **(b) La derivada:**
              $h' = 2e^{-2x}F\left(F'-F\right)$, y como $e^{-2x}>0$ siempre, el
              signo lo deciden $F$ y $F'-F$.
          - texto: |
              **Los puntos críticos** son los ceros de $F$ y los cortes de las
              dos curvas, y en cada uno hay que mirar si $h'$ cambia de signo.
          - texto: |
              Como $h = e^{-2x}F^{2}$ es un cuadrado, es siempre positiva y por
              tanto solo puede tener mínimos.
            trampa: true
            mensaje: |
              Que $h\ge0$ es cierto, y garantiza que **los ceros de $F$ son
              mínimos absolutos** — ahí $h$ vale 0, su valor más bajo posible.
              Pero no impide que haya **máximos**: entre dos mínimos con valor 0
              tiene que haber algo más alto. Ser positiva no es ser monótona.
        veredicto: |
          La observación $h\ge0$ es útil pero se queda corta: clasifica la mitad
          de los puntos críticos, no todos.

    resolucion: |
      **Datos.** Dos curvas sin etiquetar, una de las cuales es la derivada de
      la otra.

      ### 1 · Apartado (a): el criterio de identificación

      La relación que hay que usar es:

      > **$F'$ corta al eje exactamente donde $F$ tiene un extremo**, y el signo
      > de $F'$ dice si $F$ sube o baja.

      Es el único criterio fiable. Los que no sirven:

      - «la derivada está más abajo» — depende de las escalas;
      - «la derivada es más suave» — al derivar se pierde suavidad;
      - «los ceros coinciden» — los ceros de $F$ y los de $F'$ no tienen
        relación.

      **Aplicándolo a la figura.** La curva **continua** tiene dos puntos donde
      se aplana: un mínimo, marcado $m$, y un máximo, marcado $M$. Y la curva
      **de trazos** corta al eje precisamente en esas dos abscisas.

      Además, los signos encajan:

      | tramo | curva de trazos | curva continua |
      |---|---|---|
      | antes de $m$ | por debajo del eje | **baja** |
      | entre $m$ y $M$ | por encima | **sube** |
      | después de $M$ | por debajo | **baja** |

      $$
      \boxed{\text{La continua es } F; \text{ la de trazos es } F'}
      $$

      **Si se probara al revés** —suponer que la continua es la derivada—
      habría que encontrar extremos de la de trazos justo donde la continua
      corta el eje, y no ocurre. Descartar la otra opción es parte de
      «identificar de forma razonada».

      ### 2 · Apartado (b): la derivada de $h$

      $$
      h(x) = e^{-2x}\left(F(x)\right)^{2}
      $$

      Derivando, con producto y cadena:

      $$
      h'(x) = -2e^{-2x}F^{2}+e^{-2x}\cdot2F\,F'
      $$

      $$
      \boxed{h'(x) = 2e^{-2x}\,F(x)\left[F'(x)-F(x)\right]}
      $$

      ### 3 · Los tres factores

      | factor | signo | ¿se anula? |
      |---|---|---|
      | $2e^{-2x}$ | siempre $+$ | **nunca** |
      | $F(x)$ | según la figura | en los cortes de $F$ con el eje |
      | $F'(x)-F(x)$ | según la figura | donde **las dos curvas se cortan** |

      Y esa última condición es la clave del ejercicio: **$F'=F$ se lee
      directamente como el punto donde las dos curvas dibujadas se cruzan.** No
      hace falta ninguna expresión analítica.

      $$
      \mathrm{signo}\left(h'\right)
      = \mathrm{signo}(F)\cdot\mathrm{signo}\left(F'-F\right)
      $$

      ### 4 · Cómo se clasifica cada punto crítico

      **Los ceros de $F$.** Ahí $h = e^{-2x}\cdot0 = 0$. Y como

      $$
      h(x) = e^{-2x}F^{2} \ge 0 \qquad \forall x
      $$

      —producto de una exponencial positiva por un cuadrado— esos puntos son
      **mínimos absolutos**. La función toca el suelo y rebota.

      **Los cortes de las dos curvas.** Ahí $F' = F$, y el signo de $h'$ lo
      decide el cambio del factor $F'-F$: si las curvas se cruzan pasando la de
      trazos de estar por encima a por debajo, $F'-F$ pasa de $+$ a $-$, y $h'$
      cambia de signo según sea el signo de $F$ en esa zona.

      Con $F>0$ en la zona del corte —que es lo que muestra la figura, donde el
      mínimo de $F$ queda por encima del eje— el corte da un **máximo** de $h$.

      ### 5 · El cuadro resultante

      $$
      \boxed{
      \begin{aligned}
      &\text{mínimos absolutos } (h=0) \text{ en los ceros de } F \\
      &\text{máximo local donde las dos curvas se cortan con } F>0
      \end{aligned}}
      $$

      **La observación $h\ge0$ resuelve la mitad del apartado**, pero solo la
      mitad: dice que los ceros de $F$ son mínimos, y no dice nada de los otros
      puntos críticos. Entre dos mínimos con valor 0 tiene que haber algo más
      alto, y eso son los cortes.

      ### 6 · Comprobación

      **Con un ejemplo concreto.** Tomando $F(x) = x$, que cumple lo esencial
      —tiene un cero y corta a su derivada—:

      $$
      h(x) = e^{-2x}x^{2},
      \qquad
      h'(x) = 2e^{-2x}x\left(1-x\right)
      $$

      Los puntos críticos son $x=0$ —donde $F=0$— y $x=1$ —donde $F'=F$, es
      decir $1=x$— ✔ exactamente las dos condiciones previstas.

      Y clasificándolos: $h(0) = 0$ es **mínimo absoluto**, y
      $h(1) = e^{-2} \approx 0{,}135$ es **máximo local** ✔ El cuadro se cumple.

      **Del signo.** $h(x) = e^{-2x}x^{2} \ge 0$ para todo $x$, con igualdad
      solo en $x=0$ ✔

      **De la identificación.** En el ejemplo, $F=x$ y $F'=1$: la derivada es
      constante y no corta al eje, porque $F$ no tiene extremos. Coherente con
      el criterio ✔
