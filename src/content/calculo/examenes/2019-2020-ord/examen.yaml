asignatura: calculo
curso: '2019-2020'
convocatoria: ordinaria
fecha: mayo y junio de 2020
# El cuadernillo más raro del corpus, y hay que explicar por qué se archiva así.
#
# La cabecera dice, literalmente, «CONVOCATORIAS ORDINARIA Y EXTRAORDINARIA ·
# mayo y junio 2020»: **un solo juego de enunciados para las dos
# convocatorias**. Es el curso del confinamiento. Los otros diez años tienen dos
# cuadernillos distintos, uno de mayo y otro de junio; este tiene uno para los
# dos meses, repartido en dos PDF —primer y segundo cuatrimestral— igual que
# cualquier otra global.
#
# Se archiva como `ordinaria` porque es la primera de las dos convocatorias que
# sirvió, y porque duplicar los trece ejercicios en un `2019-2020-ext` idéntico
# publicaría como dos exámenes lo que fue uno. La consecuencia, dicha en voz
# alta: **2019-2020 no tiene extraordinaria propia que transcribir**, y por eso
# la cuenta de convocatorias del corpus se queda en 88 de 89 y no llega a 89.
#
# Trece ejercicios y 130 puntos: cinco y cincuenta el primer cuatrimestral,
# ocho y ochenta el segundo. Es el examen más largo del corpus.
pdf: 2019-2020-ord-ext-p1.pdf

