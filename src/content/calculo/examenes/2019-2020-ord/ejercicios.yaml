ejercicios:
  - id: ex1920-1-el-arco-capaz-con-un-conjugado
    titulo: Un arco capaz escondido detrás de un conjugado
    fuente: >-
      Ejercicio 1 del PRIMER CUATRIMESTRAL · Convocatorias ordinaria y
      extraordinaria, mayo y junio de 2020 · Cálculo, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3
    enunciado: |
      Calcular y representar geométricamente los afijos de los números complejos
      $z$ que verifican la condición siguiente:

      $$
      \arg\left(\frac{\overline{z}+3i}{\overline{z}-3i}\right)=-\frac{\pi}{4}
      $$
    pide: El lugar geométrico, con su dibujo.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tipo de lugar geométrico es
          $\arg\frac{w-a}{w-b}=\theta$ con $\theta$ constante?
        opciones:
          - texto: >-
              Un **arco de circunferencia** que pasa por $a$ y por $b$ — el arco
              capaz de ángulo $\theta$
            correcta: true
            mensaje: |
              Eso es. El argumento de ese cociente es el ángulo bajo el que se ven
              $a$ y $b$ desde $w$, y el lugar de los puntos que ven un segmento
              bajo un ángulo fijo es un arco de circunferencia.
          - texto: Una recta perpendicular al segmento que une $a$ y $b$
            mensaje: |
              Esa es la mediatriz, y sale de $\left|w-a\right|=\left|w-b\right|$:
              una condición sobre **módulos**, no sobre argumentos.
          - texto: Una hipérbola de focos $a$ y $b$
            mensaje: |
              La hipérbola sale de que la **diferencia de distancias** sea
              constante. Aquí lo que se fija es un ángulo.

      - tipo: calcular
        titulo: El radio de la circunferencia
        pregunta: |
          ¿Cuánto vale el radio de la circunferencia del lugar geométrico?
        respuesta:
          tipo: numero
          valor: '4.2426407'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '18'
            mensaje: |
              $18$ es el **cuadrado** del radio: la ecuación queda
              $\left(x+3\right)^{2}+y^{2}=18$ y falta la raíz.
          - valor: '3'
            mensaje: |
              $3$ es la distancia del centro al origen, y también la mitad de la
              cuerda $6i$. El radio es mayor: $3\sqrt2$.
          - valor: '6'
            mensaje: |
              $6$ es la longitud de la cuerda, de $-3i$ a $3i$. La circunferencia
              no pasa por el origen.
        pista: |
          Racionalizando, la condición queda $x^{2}+6x+y^{2}=9$. Completa el
          cuadrado en $x$.
        desarrollo: |
          $$
          x^{2}+6x+y^{2}=9
          \;\Longrightarrow\;
          \left(x+3\right)^{2}+y^{2}=9+9=18
          $$

          Centro $\left(-3,0\right)$ y radio $\sqrt{18}=3\sqrt2\approx4{,}2426$.

      - tipo: calcular
        titulo: Los puntos por donde pasa
        pregunta: |
          ¿En qué punto del eje imaginario positivo corta la circunferencia?
        respuesta:
          tipo: complejo
          valor: '3i'
          tolerancia: 0.01
          formato: forma binómica, por ejemplo 3i
        distractores:
          - valor: '4.2426407i'
            mensaje: |
              $3\sqrt2\,i$ es el radio puesto sobre el eje, pero el centro no está
              en el origen: está en $-3$.
          - valor: '-3i'
            mensaje: |
              Ese es el corte con el eje imaginario **negativo**. Los dos son
              cortes; el paso pide el positivo.
          - valor: '18i'
            mensaje: |
              $18$ es el radio al cuadrado. Haciendo $x=0$ queda $9+y^{2}=18$, o
              sea $y=\pm3$.
        pista: |
          Haz $x=0$ en $\left(x+3\right)^{2}+y^{2}=18$.
        desarrollo: |
          $$
          x=0:\quad 9+y^{2}=18\;\Longrightarrow\;y=\pm3
          $$

          La circunferencia pasa por $3i$ y por $-3i$, que son exactamente los dos
          puntos que aparecen en el enunciado. **Tenía que pasar por ellos**: son
          los extremos del segmento que se ve bajo el ángulo $-\frac{\pi}{4}$.

      - tipo: justificar
        pregunta: Ordena el argumento. Una pieza es falsa.
        piezas:
          - texto: >-
              Racionalizando,
              $\frac{\overline{z}+3i}{\overline{z}-3i}
              =\frac{\left(x^{2}+y^{2}-9\right)+6xi}
              {\left|\overline{z}-3i\right|^{2}}$, con
              $\overline{z}=x+iy$.
          - texto: >-
              Que el argumento valga $-\frac{\pi}{4}$ obliga a dos cosas: parte
              imaginaria igual a menos la parte real, y **parte real positiva**.
          - texto: >-
              De $6x=-\left(x^{2}+y^{2}-9\right)$ sale
              $\left(x+3\right)^{2}+y^{2}=18$, y la condición de signo se reduce a
              $x<0$: es el arco mayor, sin los extremos.
          - texto: >-
              Como la condición está escrita sobre $\overline{z}$, el lugar de $z$
              es el simétrico respecto del eje imaginario.
            trampa: true
            mensaje: |
              Dos errores en una frase. Conjugar refleja respecto del eje **real**,
              no del imaginario. Y aquí ni siquiera cambia nada: tanto la
              circunferencia —centrada en el eje real— como la condición $x<0$ son
              simétricas respecto de ese eje, así que $z$ y $\overline{z}$
              describen **el mismo conjunto**. El conjugado del enunciado es un
              adorno, y decirlo vale puntos.
    resolucion: |
      **La idea antes de la cuenta.** El argumento de un cociente es la diferencia
      de argumentos:

      $$
      \arg\frac{w-a}{w-b}=\arg\left(w-a\right)-\arg\left(w-b\right)
      $$

      y eso es **el ángulo bajo el que se ve el segmento $ab$ desde $w$**. Fijarlo
      es la definición del **arco capaz**, y el arco capaz es un arco de
      circunferencia que pasa por $a$ y por $b$. Con $a=-3i$ y $b=3i$, ya se sabe
      la respuesta a medias antes de escribir nada: una circunferencia por $3i$ y
      $-3i$, y de ella un arco.

      **La cuenta.** Con $\overline{z}=x+iy$, se racionaliza multiplicando por el
      conjugado del denominador:

      $$
      \frac{x+i\left(y+3\right)}{x+i\left(y-3\right)}
      =\frac{\left[x+i\left(y+3\right)\right]\left[x-i\left(y-3\right)\right]}
      {x^{2}+\left(y-3\right)^{2}}
      $$

      El numerador, desarrollado:

      $$
      x^{2}+\left(y+3\right)\left(y-3\right)
      +i\,x\left[\left(y+3\right)-\left(y-3\right)\right]
      =\left(x^{2}+y^{2}-9\right)+6x\,i
      $$

      **Las dos condiciones que impone $-\frac{\pi}{4}$**, y hay que escribir las
      dos:

      | condición | qué dice |
      |---|---|
      | $\tan\left(-\frac{\pi}{4}\right)=-1$ | $6x=-\left(x^{2}+y^{2}-9\right)$ |
      | $-\frac{\pi}{4}$ está en el **cuarto** cuadrante | parte real $>0$ |

      La primera da la circunferencia:

      $$
      x^{2}+6x+y^{2}=9
      \;\Longrightarrow\;
      \boxed{\;\left(x+3\right)^{2}+y^{2}=18\;}
      $$

      centro $\left(-3,0\right)$ y radio $3\sqrt2$. Y en $x=0$ se comprueba que
      pasa por $\pm3i$, como tenía que ser.

      La segunda selecciona el arco. Sobre la circunferencia,
      $x^{2}+y^{2}-9=-6x$, así que

      $$
      \text{parte real}>0
      \;\Longleftrightarrow\;
      -6x>0
      \;\Longleftrightarrow\;
      x<0
      $$

      $$
      \boxed{\;\left(x+3\right)^{2}+y^{2}=18,\quad x<0\;}
      $$

      **El arco mayor**, sin los extremos $\pm3i$: en $3i$ el denominador se anula
      y en $-3i$ el numerador, y en los dos casos el argumento no existe.

      <figure class="figura-examen">
      <svg viewBox="0 0 330 300" role="img" width="330" height="300"
           aria-labelledby="arc20-t arc20-d">
        <title id="arc20-t">El arco capaz: la circunferencia y el trozo que vale</title>
        <desc id="arc20-d">Una circunferencia de centro menos tres y radio tres raiz de dos,
        que pasa por los puntos tres i y menos tres i. El trozo que queda a la izquierda del
        eje imaginario, que es el arco mayor, esta dibujado grueso: es la solucion. El resto,
        a trazos, no cumple la condicion de signo.</desc>
