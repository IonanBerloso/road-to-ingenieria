        <g class="cur20-n">
          <text x="46" y="131" text-anchor="middle">a</text>
          <text x="311.2" y="131" text-anchor="middle">b</text>
          <text x="322" y="155" text-anchor="end">x</text>
          <text x="106.6" y="30">y</text>
        </g>
        <g class="cur20-l">
        </g>
      </svg>
      <figcaption>
      Las dos gráficas del enunciado, redibujadas. El intervalo (a,b) está marcado
      en grueso sobre el eje.
      </figcaption>
      </figure>

      a) Identificar, razonadamente, qué gráfica corresponde a cada una de las
      funciones.

      b) Estudiar el crecimiento/decrecimiento y los extremos relativos de la
      función $h\left(x\right)=e^{-4x}\,y^{4}\left(x\right)$.
    pide: Cuál es cuál, y el estudio completo de h.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la relación que permite decidir cuál de las dos gráficas es la
          derivada?
        opciones:
          - texto: >-
              Que $y'$ se anula exactamente donde $y$ tiene tangente horizontal, y
              que $y'>0$ donde $y$ crece
            correcta: true
            mensaje: |
              Esas dos son las que deciden. En la figura hay un punto donde una
              curva corta al eje justo debajo del máximo de la otra: eso ya lo
              resuelve.
          - texto: >-
              Que la derivada siempre queda por debajo de la función
            mensaje: |
              No hay ninguna regla así. La derivada puede estar por encima, por
              debajo o cruzarla — y aquí la cruza dos veces.
          - texto: >-
              Que la derivada tiene un cero más que la función
            mensaje: |
              Entre dos ceros de $y$ hay al menos uno de $y'$ (Rolle), pero eso no
              da una cuenta fija de ceros, y menos aún en un intervalo abierto
              donde no se ven los extremos.

      - tipo: calcular
        titulo: La derivada de h
        pregunta: |
          $h'$ se puede escribir como
          $4e^{-4x}\,y^{k}\left(y'-y\right)$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '4'
            mensaje: |
              $4$ es la potencia que hay en $h$. Al derivar $y^{4}$ baja un grado y
              queda $y^{3}$, que es el que se saca factor común.
          - valor: '2'
            mensaje: |
              $2$ dejaría una $y$ suelta dentro del paréntesis. Sacando
              $4e^{-4x}y^{3}$, dentro quedan exactamente $y'$ e $y$.
          - valor: '5'
            mensaje: |
              Derivar **baja** el exponente, no lo sube.
        pista: |
          $h'=-4e^{-4x}y^{4}+e^{-4x}\cdot4y^{3}y'$, y se saca
          $4e^{-4x}y^{3}$ factor común.
        desarrollo: |
          $$
          h'=-4e^{-4x}y^{4}+4e^{-4x}y^{3}y'
          =4e^{-4x}y^{3}\left(y'-y\right)
          $$

          Y ahí está la gracia del ejercicio: **$h'$ se anula donde $y=0$ y donde
          las dos gráficas se cortan**, y las dos cosas se leen en el dibujo sin
          saber quién es $y$.

      - tipo: calcular
        titulo: Cuántos extremos relativos tiene h
        pregunta: |
          ¿Cuántos extremos relativos tiene $h$ en $\left(a,b\right)$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              Dos son los ceros de $y$. Faltan los dos puntos donde las gráficas se
              **cortan**, que también anulan $h'$.
          - valor: '3'
            mensaje: |
              Parece que se te ha escapado el segundo corte de las dos curvas, el
              de la derecha, donde las dos son negativas.
          - valor: '6'
            mensaje: |
              Seis serían todos los puntos notables del dibujo. Pero el máximo de
              $y$ y el mínimo de $y'$ **no** anulan $h'$: en $h'$ solo cuentan
              $y=0$ e $y'=y$.
        pista: |
          $h'=4e^{-4x}y^{3}\left(y'-y\right)$ se anula donde $y=0$ (dos veces) y
          donde $y'=y$ (dos veces).
        desarrollo: |
          | dónde se anula $h'$ | cuántas veces en $\left(a,b\right)$ |
          |---|---|
          | $y=0$ | dos: en $x=0$ y en $q$ |
          | $y'=y$, los cortes de las curvas | dos: en $c$ y en $d$ |

          Cuatro puntos, y en los cuatro hay cambio de signo, así que los cuatro
          son extremos: **mínimo, máximo, mínimo, máximo**, en ese orden.

      - tipo: justificar
        pregunta: Ordena el apartado a). Una pieza es falsa.
        piezas:
          - texto: >-
              La curva que pasa por el origen sube hasta un máximo y ahí, justo
              debajo, la otra curva corta al eje $X$.
          - texto: >-
              Como $y'$ se anula en los extremos de $y$, la que corta al eje en ese
              punto es $y'$, y la del máximo es $y$.
          - texto: >-
              Se confirma con los signos: esa misma curva es positiva a la
              izquierda de ese punto y negativa a la derecha, que es exactamente
              donde $y$ crece y donde decrece.
          - texto: >-
              La curva con la meseta casi horizontal tiene que ser $y$, porque una
              derivada nunca es constante.
            trampa: true
            mensaje: |
              Una derivada constante es lo más normal del mundo: es lo que tiene
              cualquier recta. La meseta dice justo lo contrario de lo que sugiere
              la pieza — que en ese tramo la **otra** función es casi recta —, y en
              la figura se ve que la curva que pasa por el origen es casi un
              segmento precisamente ahí.
    resolucion: |
      **a) Cuál es cuál.** El criterio es uno solo, y se aplica en un punto:

      > $y'$ se anula exactamente donde $y$ tiene tangente horizontal.

      En la figura hay un sitio donde eso se lee sin dudar: la curva que pasa por
      el origen alcanza su **máximo**, y justo debajo, en la misma abscisa, la
      otra curva **corta al eje $X$**. Esa coincidencia solo puede significar una
      cosa:

      $$
      \boxed{\;y\;\text{es la que pasa por el origen};\qquad
      y'\;\text{es la de la meseta}\;}
      $$

      **Y se confirma con los signos**, que es la comprobación que hay que
      escribir:

      | tramo | la de la meseta | la del origen |
      |---|---|---|
      | de $a$ hasta el máximo | **positiva** | **creciente** ✓ |
      | del máximo hasta $b$ | **negativa** | **decreciente** ✓ |

      Y un detalle más, que suma: en el tramo donde la de la meseta es **casi
      constante**, la del origen es **casi un segmento recto**. Pendiente
      constante, derivada constante. Encaja.

      **Por qué la asignación contraria no puede ser.** Si la de la meseta fuese
      $y$, entonces $y$ sería decreciente en casi todo el intervalo, y su derivada
      —la del origen— tendría que ser negativa allí. Pero la del origen es
      **positiva** en toda la primera mitad. Contradicción.

