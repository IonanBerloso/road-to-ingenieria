        <desc id="cur20-d">Dos curvas sobre el intervalo de a a b. Una pasa por el origen,
        sube hasta un maximo y luego baja cruzando el eje. La otra entra alta por la izquierda,
        se aplana en una meseta, y despues baja cortando al eje justo debajo del maximo de la
        primera.</desc>
