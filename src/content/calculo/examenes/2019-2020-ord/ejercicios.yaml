      <figcaption>
      Integrando en vertical hacen falta dos integrales, porque la tapa cambia en x
      = 1. En horizontal, la izquierda es siempre la parábola y la derecha siempre
      la recta.
      </figcaption>
      </figure>

      **Por qué vienen dos integrales.** Porque en ese sentido la frontera de
      arriba tiene **dos fórmulas**, y una integral solo admite una. La región es
      una sola, pero hay que partirla.

      **b) Cambiando el orden.** Ahora se barre en horizontal, y aquí está la
      ganancia: para cada $y$ entre $0$ y $1$, la frontera izquierda es siempre la
      parábola y la derecha siempre la recta.

      $$
      y=x^{2}\;\Longrightarrow\;x=\sqrt y,
      \qquad
      y=\frac{3-x}{2}\;\Longrightarrow\;x=3-2y
      $$

      $$
      \int_{0}^{1}\left(\int_{\sqrt y}^{\,3-2y}dx\right)dy
      =\int_{0}^{1}\left(3-2y-\sqrt y\right)dy
      $$

      **Una sola integral en vez de dos.** Y sale sin esfuerzo:

      $$
      \left[3y-y^{2}-\frac{2}{3}y^{3/2}\right]_{0}^{1}
      =3-1-\frac23
      =\boxed{\;\frac43\;}
      $$

      **La comprobación**, que aquí es obligada porque el ejercicio la regala: la
      integral original, tal como viene,

      $$
      \int_{0}^{1}x^{2}dx+\int_{1}^{3}\frac{3-x}{2}dx
      =\frac13+1=\frac43\;\checkmark
      $$

      Los dos caminos coinciden, que es lo que **Fubini** promete: si la función
      es integrable en el recinto, el orden no cambia el número. Cuando no
      coinciden, el fallo está en los límites nuevos, casi siempre por olvidar que
      la $y$ solo llega hasta $1$.

      **Y una lectura del resultado.** El integrando es $1$, así que lo que se ha
      calculado es el **área** de la región: $\frac43$ unidades cuadradas. Se
      puede comprobar por geometría elemental sin ninguna integral, partiendo por
      la vertical $x=1$:

      | trozo | qué es | área |
      |---|---|---|
      | $0\le x\le1$ | bajo la parábola | $\frac13$ |
      | $1\le x\le3$ | triángulo de base $2$ y altura $1$ | $1$ |

      Total $\frac43$ ✓. Que un problema de integrales dobles se pueda cerrar con
      el área de un triángulo es la mejor señal de que los límites están bien.

  - id: ex1920-8-la-curva-donde-el-integrando-es-constante
    titulo: La curva donde el integrando vale siempre lo mismo
    fuente: >-
      Ejercicio 3 del SEGUNDO CUATRIMESTRAL · Convocatorias ordinaria y
      extraordinaria, mayo y junio de 2020 · Cálculo, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Calcular de dos formas distintas la integral de línea

      $$
      I=\oint_{L}\sqrt{x^{2}+y^{2}}\;dx+\sqrt{x^{2}+y^{2}}\;dy
      $$

      donde $L$ es la curva $x^{2}+y^{2}=4R^{2}$.
    pide: El valor de la integral, por dos caminos.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tiene de especial el integrando sobre esta curva concreta?
        opciones:
          - texto: >-
              Que $\sqrt{x^{2}+y^{2}}$ es la distancia al origen, y sobre la
              circunferencia vale siempre $2R$: es una **constante**
            correcta: true
            mensaje: |
              Ese es el atajo entero. Una constante sale fuera de la integral, y lo
              que queda es $\oint\left(dx+dy\right)$ sobre una curva cerrada.
          - texto: >-
              Que el campo es conservativo
            mensaje: |
              No lo es: $P=Q=\sqrt{x^{2}+y^{2}}$ da
              $Q_{x}-P_{y}=\frac{x-y}{r}$, que no es cero salvo en la recta
              $y=x$. La integral sale cero por otro motivo.
          - texto: >-
              Que el integrando se anula sobre la curva
            mensaje: |
              Se anula solo en el origen, que **no** está en la curva: sobre $L$
              vale $2R$, que es todo lo contrario de cero.

      - tipo: calcular
        titulo: El valor del integrando sobre la curva
        pregunta: |
          Tomando $R=3$, ¿cuánto vale $\sqrt{x^{2}+y^{2}}$ en cualquier punto de
          $L$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '36'
            mensaje: |
              $36=4R^{2}$ es $x^{2}+y^{2}$, sin la raíz. La curva tiene **radio**
              $2R=6$.
          - valor: '3'
            mensaje: |
              $3$ es $R$, y sería el radio si la ecuación fuese
              $x^{2}+y^{2}=R^{2}$. Aquí el segundo miembro es $4R^{2}$.
          - valor: '9'
            mensaje: |
              $9=R^{2}$. Sobran el $4$ de dentro y falta la raíz.
        pista: |
          $x^{2}+y^{2}=4R^{2}$, así que la raíz vale $\sqrt{4R^{2}}$.
        desarrollo: |
          $$
          \sqrt{x^{2}+y^{2}}=\sqrt{4R^{2}}=2R
          $$

          Es la distancia al origen, y sobre una circunferencia centrada en el
          origen es la misma en todos sus puntos: el **radio**, que aquí es $2R$.

      - tipo: calcular
        titulo: El resultado
        pregunta: |
          ¿Cuánto vale $I$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.0001
          formato: un número
        distractores:
          - valor: '12.5663706'
            mensaje: |
              $4\pi$ —o $4\pi R^{2}$— sería el resultado si el campo diera vueltas
              alrededor del origen, como
              $\frac{-y\,dx+x\,dy}{x^{2}+y^{2}}$. Este no.
          - valor: '6.2831853'
            mensaje: |
              $2\pi$ es la longitud del intervalo del parámetro, no el valor de la
              integral. Al integrar $\cos t$ y $\operatorname{sen}t$ sobre una
              vuelta entera sale cero.
        pista: |
          Sacando $2R$ fuera queda $2R\oint_{L}\left(dx+dy\right)$, y la curva es
          cerrada.
        desarrollo: |
          $$
          I=2R\oint_{L}\left(dx+dy\right)
          =2R\Big[x+y\Big]_{\text{principio}}^{\text{final}}=0
          $$

          Sobre una curva **cerrada**, el punto final es el inicial, así que
          cualquier diferencial exacta —y $dx+dy=d\left(x+y\right)$ lo es— da cero.

      - tipo: justificar
        pregunta: Ordena el segundo camino, el de Green. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $P=Q=\sqrt{x^{2}+y^{2}}$, las derivadas cruzadas son
              $Q_{x}=\frac{x}{r}$ y $P_{y}=\frac{y}{r}$, con
              $r=\sqrt{x^{2}+y^{2}}$.
          - texto: >-
              Green da entonces
              $I=\iint_{D}\frac{x-y}{r}\,dA$, sobre el disco de radio $2R$.
          - texto: >-
              En polares eso es
              $\int_{0}^{2R}\!\!\int_{0}^{2\pi}
              r\left(\cos\theta-\operatorname{sen}\theta\right)\,d\theta\,dr$,
              y la integral en $\theta$ de una vuelta entera vale cero.
          - texto: >-
              El rotacional es nulo, así que el campo deriva de un potencial y la
              integral vale cero por eso.
            trampa: true
            mensaje: |
              El rotacional **no** es nulo: vale $\frac{x-y}{r}$, que solo se anula
              sobre la recta $y=x$. Lo que ocurre es que su integral sobre el disco
              se cancela por simetría —lo positivo de un lado de esa recta compensa
              lo negativo del otro—. Un rotacional que integra cero y un rotacional
              nulo son cosas distintas, y confundirlas hace fallar el siguiente
              ejercicio parecido.
    resolucion: |
      **Lo primero, y es medio ejercicio: mirar la curva.** El integrando es

      $$
      \sqrt{x^{2}+y^{2}}
      $$

      que es la **distancia al origen**. Y la curva es la circunferencia
      $x^{2}+y^{2}=4R^{2}$, centrada en el origen y de radio $2R$. Así que sobre
      $L$, y solo sobre $L$,

      $$
      \sqrt{x^{2}+y^{2}}=2R=\text{constante}
      $$

      **Primera forma · parametrizando.** Sacando la constante fuera:

      $$
      I=2R\oint_{L}\left(dx+dy\right)
      $$

      Con $x=2R\cos t$, $y=2R\operatorname{sen}t$ y $t$ de $0$ a $2\pi$:

      $$
      I=2R\int_{0}^{2\pi}
      \left(-2R\operatorname{sen}t+2R\cos t\right)dt
      =4R^{2}\Big[\cos t+\operatorname{sen}t\Big]_{0}^{2\pi}
      =4R^{2}\left(1-1\right)=\boxed{\;0\;}
      $$

      Y hay una versión todavía más corta, que conviene saber decir: $dx+dy$ es la
      diferencial exacta de $x+y$, y sobre una curva **cerrada** una diferencial
      exacta integra cero, porque el punto final es el de partida.

      **Segunda forma · por Green.** Con $P=Q=\sqrt{x^{2}+y^{2}}=r$:

      $$
      \frac{\partial Q}{\partial x}=\frac{x}{r},
      \qquad
      \frac{\partial P}{\partial y}=\frac{y}{r}
      \;\Longrightarrow\;
      \frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}=\frac{x-y}{r}
      $$

      $$
      I=\iint_{D}\frac{x-y}{r}\,dA
      $$

      En polares, $dA=r\,dr\,d\theta$ y $\frac{x-y}{r}=\cos\theta-\operatorname{sen}\theta$:

      $$
      I=\int_{0}^{2R}\!\!\int_{0}^{2\pi}
      \left(\cos\theta-\operatorname{sen}\theta\right)r\,d\theta\,dr
      =\left(\int_{0}^{2R}r\,dr\right)
      \underbrace{\int_{0}^{2\pi}\left(\cos\theta-\operatorname{sen}\theta\right)d\theta}
      _{=\,0}
      =0
      $$

      **Los dos caminos dan $0$**, que es lo que el enunciado quería ver.

      **Pero cero por dos motivos distintos, y decirlo es lo que vale COMP 4.**
      Por el primer camino sale cero porque el integrando es constante y la curva
      cerrada. Por el segundo sale cero porque el rotacional, **que no es nulo**,
      se cancela al integrarlo: $\frac{x-y}{r}$ es positivo por debajo de la recta
      $y=x$ y negativo por encima, y el disco es simétrico respecto de esa recta.

      $$
      \frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}
      =\frac{x-y}{r}\neq0
      \quad\text{salvo en }y=x
      $$

      Así que **el campo no es conservativo**. Que su circulación sobre esta
      circunferencia concreta sea cero no dice nada sobre otras curvas: sobre una
      circunferencia descentrada, sin ir más lejos, la simetría se rompe y el
      resultado no es cero.

      **La letra pequeña de Green.** $P$ y $Q$ son continuas en todo el plano pero
      **no son derivables en el origen**, que está dentro del recinto. Las
      derivadas parciales están acotadas —$\left|\frac{x}{r}\right|\le1$— y la
      integral doble converge sin problema, así que el resultado es correcto; pero
      la aplicación estricta del teorema pide recortar un disco pequeño alrededor
      del origen y hacer tender su radio a cero. Nombrarlo es la diferencia entre
      aplicar Green y saber cuándo se puede aplicar.

      **Y una comprobación que no cuesta nada: el resultado no depende de $R$.**
      Tiene sentido — la integral vale cero para cualquier circunferencia centrada
      en el origen, sea cual sea su tamaño.

  - id: ex1920-9-la-edo-con-resonancia-y-sin-ella
    titulo: Dos términos, y solo uno resuena
    fuente: >-
      Ejercicio 4 del SEGUNDO CUATRIMESTRAL · Convocatorias ordinaria y
      extraordinaria, mayo y junio de 2020 · Cálculo, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Resolver la EDO
      $y''+9y=-18e^{3x}+3\cos 3x$
    pide: La solución general.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué los dos términos del segundo miembro se tratan distinto?
        opciones:
          - texto: >-
              Porque $3i$ es raíz de la ecuación característica y $3$ no: el coseno
              resuena y la exponencial no
            correcta: true
            mensaje: |
              Exacto. $r^{2}+9=0$ da $r=\pm3i$. El término $\cos3x$ tiene esa misma
              frecuencia y hay que multiplicar por $x$; el $e^{3x}$ no tiene nada
              que ver con $e^{3ix}$.
          - texto: >-
              Porque uno es exponencial y el otro trigonométrico, y son familias
              distintas
            mensaje: |
              Los dos son «cuasipolinomios» y se tratan igual de bien con
              coeficientes indeterminados. Lo que decide no es la familia sino si el
              exponente **coincide con una raíz**.
          - texto: >-
              Porque el coeficiente $-18$ es negativo
            mensaje: |
              El signo del coeficiente solo cambia el signo de la constante que se
              obtiene. No tiene nada que ver con la resonancia.

      - tipo: calcular
        titulo: La parte exponencial
        pregunta: |
          En $y_{p}=Ae^{3x}$, ¿cuánto vale $A$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              $-2$ saldría de $9A=-18$, olvidando que $y''$ aporta otros $9A$. En
              total quedan $18A$.
          - valor: '1'
            mensaje: |
              El signo. $18A=-18$ da $A=-1$.
          - valor: '-18'
            mensaje: |
              $-18$ es el coeficiente del segundo miembro sin dividir entre $18$.
        pista: |
          $y''=9Ae^{3x}$, así que $y''+9y=18Ae^{3x}$.
        desarrollo: |
          $$
          y=Ae^{3x}
          \;\Longrightarrow\;
          y''=9Ae^{3x}
          \;\Longrightarrow\;
          y''+9y=18Ae^{3x}=-18e^{3x}
          $$

          $$
          A=-1
          $$

      - tipo: calcular
        titulo: La parte resonante
        pregunta: |
          En $y_{p}=x\left(B\cos3x+C\operatorname{sen}3x\right)$, ¿cuánto vale
          $C$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.0001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.1666667'
            mensaje: |
              $\frac16$ saldría de dividir entre $6\cdot3$. La fórmula es
              $\frac{a}{2\omega}$ con $a=3$ y $\omega=3$: $\frac{3}{6}=\frac12$.
          - valor: '1.5'
            mensaje: |
              $\frac32$ sale de dividir entre $2$ y olvidar el $\omega$. El
              denominador es $2\omega=6$.
          - valor: '0'
            mensaje: |
              $0$ es el valor de $B$, el coeficiente del coseno. El que queda vivo
              es el del seno.
        pista: |
          Para $y''+\omega^{2}y=a\cos\omega x$, la particular es
          $\frac{a}{2\omega}\,x\operatorname{sen}\omega x$.
        desarrollo: |
          Con $y=\frac{x}{2}\operatorname{sen}3x$:

          $$
          y'=\tfrac12\operatorname{sen}3x+\tfrac{3x}{2}\cos3x
          $$

          $$
          y''=3\cos3x-\tfrac{9x}{2}\operatorname{sen}3x
          $$

          $$
          y''+9y=3\cos3x-\tfrac{9x}{2}\operatorname{sen}3x
          +\tfrac{9x}{2}\operatorname{sen}3x=3\cos3x\;\checkmark
          $$

          Luego $B=0$ y $C=\frac12$.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La característica $r^{2}+9=0$ da $r=\pm3i$, así que
              $y_{h}=C_{1}\cos3x+C_{2}\operatorname{sen}3x$.
          - texto: >-
              Para $-18e^{3x}$ se prueba $Ae^{3x}$, que no resuena, y sale $A=-1$.
          - texto: >-
              Para $3\cos3x$ sí hay resonancia, y hay que probar
              $x\left(B\cos3x+C\operatorname{sen}3x\right)$: sale $B=0$,
              $C=\frac12$.
          - texto: >-
              Como el segundo miembro tiene dos términos, hacen falta cuatro
              constantes arbitrarias en la solución general.
            trampa: true
            mensaje: |
              Las constantes arbitrarias las pone **el orden de la ecuación**, no el
              segundo miembro: una EDO lineal de segundo orden tiene exactamente
              dos, $C_{1}$ y $C_{2}$. Los coeficientes $A$, $B$ y $C$ de las
              particulares no son arbitrarios: están determinados, y se calculan.
    resolucion: |
      **La homogénea.** $r^{2}+9=0$ da $r=\pm3i$, raíces imaginarias puras:

      $$
      y_{h}=C_{1}\cos3x+C_{2}\operatorname{sen}3x
      $$

      Y con eso ya está dicho lo importante del ejercicio: **la frecuencia propia
      del sistema es $3$**. Ahora se mira el segundo miembro con esa información
      en la mano.

      | término | ¿resuena? | por qué |
      |---|---|---|
      | $-18e^{3x}$ | **no** | $3$ no es raíz; las raíces son $\pm3i$ |
      | $3\cos3x$ | **sí** | tiene frecuencia $3$, la misma que la homogénea |

      El $3$ del exponente y el $3$ del coseno son el mismo número y no significan
      lo mismo. Esa es la trampa que el examen ha puesto a propósito.

      **La particular de la exponencial.** Se prueba $y=Ae^{3x}$:

      $$
      y''+9y=9Ae^{3x}+9Ae^{3x}=18Ae^{3x}=-18e^{3x}
      \;\Longrightarrow\;
      A=-1
      $$

      $$
      y_{p_{1}}=-e^{3x}
      $$

      **La particular del coseno, con resonancia.** Como $\cos3x$ ya es solución de
      la homogénea, la prueba estándar fallaría —daría $0=3\cos3x$—, y hay que
      **multiplicar por $x$**:

      $$
      y_{p_{2}}=x\left(B\cos3x+C\operatorname{sen}3x\right)
      $$

      Derivando dos veces y sustituyendo salen $B=0$ y $C=\frac12$. En vez de la
      cuenta larga, conviene recordar el caso general:

      $$
      y''+\omega^{2}y=a\cos\omega x
      \;\Longrightarrow\;
      y_{p}=\frac{a}{2\omega}\,x\operatorname{sen}\omega x
      $$

      Con $a=3$ y $\omega=3$: $\frac{3}{6}=\frac12$.

      $$
      y_{p_{2}}=\frac{x}{2}\operatorname{sen}3x
      $$

      **La comprobación**, que es corta y evita el error de signo más común:

      $$
      y=\tfrac{x}{2}\operatorname{sen}3x
      \;\Longrightarrow\;
      y''=3\cos3x-\tfrac{9x}{2}\operatorname{sen}3x
      $$

      $$
      y''+9y=3\cos3x-\tfrac{9x}{2}\operatorname{sen}3x
      +\tfrac{9x}{2}\operatorname{sen}3x=3\cos3x\;\checkmark
      $$

      **La solución general**, por el principio de superposición:

      $$
      \boxed{\;y=C_{1}\cos3x+C_{2}\operatorname{sen}3x
      -e^{3x}+\frac{x}{2}\operatorname{sen}3x\;}
      $$

      **Qué significa el término resonante.** El factor $x$ delante del seno hace
      que esa parte de la solución **crezca sin límite**, aunque la fuerza
      $3\cos3x$ esté acotada entre $-3$ y $3$. Es el fenómeno de resonancia: si se
      empuja un columpio justo a su ritmo, la amplitud crece sin parar. En un
      puente o en una estructura eso es un problema de ingeniería, no una
      curiosidad matemática.

      Aunque aquí, dicho sea de paso, el término $-e^{3x}$ crece mucho más deprisa
      todavía y acaba tapándolo: para $x$ grande, la solución está dominada por la
      exponencial.

  - id: ex1920-10-la-epidemia-en-un-pueblo-de-cien
    titulo: Una epidemia en un pueblo de cien habitantes
    fuente: >-
      Ejercicio 5 del SEGUNDO CUATRIMESTRAL · Convocatorias ordinaria y
      extraordinaria, mayo y junio de 2020 · Cálculo, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      La tasa de crecimiento del número de personas infectadas por cierta
      enfermedad contagiosa es proporcional al producto de las personas
      contagiadas y de las no contagiadas. En un municipio con una población de
      100 habitantes, inicialmente hay una persona contagiada y al día siguiente
      cuatro. ¿En qué momento se habrá contagiado el 90 % de la población?
    pide: El instante en que se alcanza el 90 % de contagiados.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué ecuación describe el enunciado?
        opciones:
          - texto: >-
              La logística $P'=kP\left(100-P\right)$, con la población total
              $100$ como tope
            correcta: true
            mensaje: |
              Eso es. «Proporcional al producto de contagiadas y no contagiadas» es
              literalmente $kP\left(100-P\right)$, con $100-P$ las que quedan por
              contagiar.
          - texto: >-
              El crecimiento exponencial $P'=kP$
            mensaje: |
              Ese es el modelo sin tope: crecería sin límite y pasaría de los $100$
              habitantes. El enunciado añade el factor de las **no contagiadas**,
              que es lo que frena.
          - texto: >-
              El enfriamiento de Newton $P'=-k\left(P-100\right)$
            mensaje: |
              Ese es lineal en $P$ y solo tiene un factor. La epidemia tiene
              **dos**: cuantas más contagiadas hay más contagio, y cuantas menos
              quedan sanas, menos.

      - tipo: calcular
        titulo: La constante
        pregunta: |
          ¿Cuánto vale $100k$?
        respuesta:
          tipo: numero
          valor: '1.4170661'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '1.3862944'
            mensaje: |
              $\ln4$ saldría del modelo **exponencial**, donde pasar de $1$ a $4$
              multiplica por $4$. En el logístico el factor no es ese: hay que
              contar también las sanas que se gastan.
          - valor: '0.0141707'
            mensaje: |
              Ese es $k$, no $100k$. El paso pide el exponente completo.
          - valor: '1.0986123'
            mensaje: |
              $\ln3$ está cerca, pero la cuenta da $\ln\frac{33}{8}$, no $\ln3$.
        pista: |
          De $P\left(1\right)=4$ sale $1+99e^{-100k}=25$, o sea
          $e^{-100k}=\frac{24}{99}$.
        desarrollo: |
          $$
          P\left(t\right)=\frac{100}{1+99e^{-100kt}},
          \qquad
          P\left(1\right)=4
          $$

          $$
          1+99e^{-100k}=\frac{100}{4}=25
          \;\Longrightarrow\;
          e^{-100k}=\frac{24}{99}=\frac{8}{33}
          $$

          $$
          100k=\ln\frac{33}{8}\approx1{,}41707
          $$

      - tipo: calcular
        titulo: El instante buscado
        pregunta: |
          ¿Cuántos días tardan en contagiarse el 90 % de los habitantes?
        respuesta:
          tipo: numero
          valor: '4.7932'
          tolerancia: 0.01
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '2.6'
            mensaje: |
              Parece salir de extrapolar linealmente: si en un día se pasa de $1$ a
              $4$, harían falta unos $23$ días para $90$ a ese ritmo, o menos si se
              usa el ritmo del final. La logística no es lineal en ningún tramo.
          - valor: '3.2'
            mensaje: |
              $\frac{\ln 90}{\ln\left(33/8\right)}$ da $3{,}18$, pero el numerador
              correcto es $\ln 891$, no $\ln 90$: hay que despejar del $1+99e^{...}$
              completo.
          - valor: '6.7923'
            mensaje: |
              $\ln 891=6{,}79$ es solo el numerador. Falta dividir entre
              $\ln\frac{33}{8}$.
        pista: |
          $P=90$ da $1+99e^{-100kt}=\frac{100}{90}$, y de ahí
          $e^{-100kt}=\frac{1}{891}$.
        desarrollo: |
          $$
          \frac{100}{1+99e^{-100kt}}=90
          \;\Longrightarrow\;
          1+99e^{-100kt}=\frac{10}{9}
          \;\Longrightarrow\;
          99e^{-100kt}=\frac19
          $$

          $$
          e^{-100kt}=\frac{1}{891}
          \;\Longrightarrow\;
          t=\frac{\ln 891}{\ln\left(33/8\right)}
          =\frac{6{,}79234}{1{,}41707}\approx4{,}7932
          $$

          Poco menos de cinco días: **durante el quinto día**.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Separando variables,
              $\frac{dP}{P\left(100-P\right)}=k\,dt$, y descomponiendo en
              fracciones simples sale
              $\frac{1}{100}\ln\frac{P}{100-P}=kt+C$.
          - texto: >-
              Despejando, $P=\frac{100}{1+Ae^{-100kt}}$, y $P\left(0\right)=1$ da
              $A=99$.
          - texto: >-
              $P\left(1\right)=4$ da $e^{-100k}=\frac{8}{33}$, y entonces
              $P=90$ ocurre en $t=\frac{\ln 891}{\ln\left(33/8\right)}
              \approx4{,}79$ días.
          - texto: >-
              Como la población es de 100 habitantes y el contagio es
              proporcional, al cabo de bastante tiempo se contagian los 100.
            trampa: true
            mensaje: |
              Se **acerca** a 100, pero no llega nunca: $P\left(t\right)=
              \frac{100}{1+99e^{-100kt}}$ es siempre menor que $100$, para cualquier
              $t$ finito. Es una asíntota horizontal, igual que la temperatura de la
              habitación en el enfriamiento de Newton. Y no es solo matemática: el
              modelo trata la población como continua, así que decir «se contagian
              los 100» es dar por hecho algo que la ecuación no dice.
    resolucion: |
      **El modelo, palabra por palabra.** «La tasa de crecimiento es proporcional
      al producto de las contagiadas y de las no contagiadas»:

      $$
      \frac{dP}{dt}=k\,P\left(100-P\right)
      $$

      Es la **ecuación logística**, y la lógica es transparente: el contagio
      necesita un enfermo y un sano, así que la velocidad es proporcional al
      número de encuentros posibles entre unos y otros.

      **Resolviéndola por variables separadas:**

      $$
      \frac{dP}{P\left(100-P\right)}=k\,dt
      $$

      La fracción se descompone —y el truco es que las dos partes suman $100$—:

      $$
      \frac{1}{P\left(100-P\right)}
      =\frac{1}{100}\left(\frac1P+\frac{1}{100-P}\right)
      $$

      $$
      \frac{1}{100}\ln\frac{P}{100-P}=kt+C
      \;\Longrightarrow\;
      \frac{P}{100-P}=D\,e^{100kt}
      $$

      $$
      P\left(t\right)=\frac{100}{1+Ae^{-100kt}}
      $$

      **Las dos constantes salen de los dos datos:**

      | dato | ecuación | resultado |
      |---|---|---|
      | $P\left(0\right)=1$ | $\frac{100}{1+A}=1$ | $A=99$ |
      | $P\left(1\right)=4$ | $1+99e^{-100k}=25$ | $e^{-100k}=\frac{24}{99}=\frac{8}{33}$ |

      $$
      100k=\ln\frac{33}{8}\approx1{,}41707
      $$

      $$
      P\left(t\right)=\frac{100}{1+99\left(\frac{8}{33}\right)^{t}}
      $$

      **El 90 %:**

      $$
      \frac{100}{1+99e^{-100kt}}=90
      \;\Longrightarrow\;
      99e^{-100kt}=\frac{10}{9}-1=\frac19
      \;\Longrightarrow\;
      e^{-100kt}=\frac{1}{891}
      $$

      $$
      \boxed{\;t=\frac{\ln 891}{\ln\left(33/8\right)}
      =\frac{6{,}7923}{1{,}4171}\approx4{,}79\text{ días}\;}
      $$

      Es decir, **durante el quinto día**.

      **La comprobación, que es inmediata:**

      | $t$ | $P\left(t\right)$ |
      |---|---|
      | $0$ | $1$ ✓ |
      | $1$ | $4$ ✓ |
      | $4{,}79$ | $90$ ✓ |

      **Por qué la respuesta parece sorprendentemente rápida.** De $1$ a $4$ en un
      día, y de $4$ a $90$ en menos de cuatro más. La razón es que la logística
      tiene su **punto de inflexión** en la mitad de la población:

      $$
      P=50
      \;\Longrightarrow\;
      P'=k\cdot50\cdot50=\frac{100^{2}k}{4}
      $$

      que es la velocidad máxima. Antes de $50$ la epidemia acelera; después
      frena. Los primeros contagios son lentos porque hay pocos enfermos que
      contagien; los últimos, porque quedan pocos sanos a los que contagiar. Todo
      el trabajo se hace en el medio, y por eso el tramo de $4$ a $90$ se despacha
      tan rápido.

      **Y el detalle que hay que decir:** $P$ nunca llega a $100$. La asíntota se
      acerca pero no se toca. Preguntar por el $90\,\%$ y no por «cuándo se
      contagian todos» no es casualidad del enunciado: la segunda pregunta no
      tendría respuesta.

  - id: ex1920-11-la-ecuacion-con-una-integral-dentro
    titulo: Una ecuación con una integral dentro
    fuente: >-
      Ejercicio 6 del SEGUNDO CUATRIMESTRAL · Convocatorias ordinaria y
      extraordinaria, mayo y junio de 2020 · Cálculo, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Sea

      $$
      \begin{cases}
      y'\left(t\right)+y\left(t\right)
      -2\displaystyle\int_{0}^{t}y\left(u\right)du=t\\[4pt]
      y\left(0\right)=0
      \end{cases}
      $$

      Utilizando la transformada de Laplace calcular $y\left(t\right)$.
    pide: La función y(t).

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué Laplace va tan bien en esta ecuación?
        opciones:
          - texto: >-
              Porque convierte la derivada en multiplicar por $s$ y la integral
              $\int_{0}^{t}$ en dividir entre $s$: las dos se vuelven álgebra
            correcta: true
            mensaje: |
              Ese es el motivo. Una ecuación que mezcla derivada e integral es
              incómoda en el dominio del tiempo y trivial en el de $s$.
          - texto: >-
              Porque la ecuación es lineal de coeficientes constantes
            mensaje: |
              Eso hace que Laplace sea **aplicable**, pero no explica la ventaja.
              Una EDO lineal normal también se resuelve sin Laplace; esta tiene
              además una integral, y eso es lo que cambia las cosas.
          - texto: >-
              Porque el segundo miembro es un polinomio
            mensaje: |
              Que el segundo miembro sea $t$ solo facilita la última antitransformada.
              La ventaja está en el primer miembro.

      - tipo: calcular
        titulo: El polinomio del denominador
        pregunta: |
          Al despejar, $Y\left(s\right)=\frac{1}{s\left(s^{2}+s-2\right)}$. ¿Cuál
          es la raíz positiva de $s^{2}+s-2$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es la raíz cambiada de signo: $s^{2}+s-2=\left(s+2\right)
              \left(s-1\right)$, así que las raíces son $-2$ y $1$.
          - valor: '-2'
            mensaje: |
              $-2$ es la raíz **negativa**. El paso pide la positiva.
          - valor: '0'
            mensaje: |
              $0$ es raíz del denominador completo, por el factor $s$ de delante,
              pero no de $s^{2}+s-2$.
        pista: |
          $s^{2}+s-2=\left(s+2\right)\left(s-1\right)$.
        desarrollo: |
          $$
          s^{2}+s-2=0
          \;\Longrightarrow\;
          s=\frac{-1\pm\sqrt{1+8}}{2}=\frac{-1\pm3}{2}
          \;\Longrightarrow\;
          s=1\;\text{o}\;s=-2
          $$

          Y con el factor $s$ de delante, el denominador entero es
          $s\left(s+2\right)\left(s-1\right)$: tres polos simples.

      - tipo: calcular
        titulo: El valor en t = 1
        pregunta: |
          ¿Cuánto vale $y\left(1\right)$?
        respuesta:
          tipo: numero
          valor: '0.4286498'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.9061'
            mensaje: |
              Parece salir de sumar los tres términos con todos los signos
              positivos. El de $\frac1s$ va con $-\frac12$.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es solo el término constante, y además con el signo
              cambiado.
          - valor: '0.3333333'
            mensaje: |
              $\frac13$ es el coeficiente de $e^{t}$, no el valor de $y$ en $t=1$.
        pista: |
          $y\left(t\right)=-\frac12+\frac16e^{-2t}+\frac13e^{t}$.
        desarrollo: |
          $$
          y\left(1\right)=-\frac12+\frac{e^{-2}}{6}+\frac{e}{3}
          =-0{,}5+0{,}02256+0{,}90609=0{,}42865
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Transformando:
              $sY-y\left(0\right)+Y-\frac{2Y}{s}=\frac{1}{s^{2}}$, y con
              $y\left(0\right)=0$ queda $Y\cdot\frac{s^{2}+s-2}{s}
              =\frac{1}{s^{2}}$.
          - texto: >-
              Entonces
              $Y=\frac{1}{s\left(s+2\right)\left(s-1\right)}$, con tres polos
              simples.
          - texto: >-
              Descomponiendo,
              $Y=-\frac{1}{2s}+\frac{1}{6\left(s+2\right)}
              +\frac{1}{3\left(s-1\right)}$, y antitransformando
              $y=-\frac12+\frac16e^{-2t}+\frac13e^{t}$.
          - texto: >-
              La transformada de $\int_{0}^{t}y\left(u\right)du$ es
              $sY\left(s\right)$, porque integrar es la operación contraria de
              derivar.
            trampa: true
            mensaje: |
              Es $\frac{Y\left(s\right)}{s}$, y el razonamiento de la pieza lleva al
              signo correcto pero al revés: si derivar multiplica por $s$, integrar
              tiene que **dividir**. Poner $sY$ ahí convierte la ecuación en
              $\left(s+1-2s\right)Y$, que da un denominador de primer grado y una
              solución con una sola exponencial.
    resolucion: |
      **Por qué esta ecuación es un buen anuncio de Laplace.** Mezcla una
      derivada y una integral de la propia incógnita. En el dominio del tiempo eso
      es incómodo; en el de $s$, las dos se vuelven operaciones aritméticas:

      | operación en $t$ | en $s$ |
      |---|---|
      | $y'\left(t\right)$ | $sY-y\left(0\right)$ |
      | $\displaystyle\int_{0}^{t}y\left(u\right)du$ | $\dfrac{Y}{s}$ |

      Derivar multiplica por $s$ e integrar divide entre $s$: es la misma regla
      leída en los dos sentidos, y conviene decirlo así porque evita el error de
      confundirlas.

      **Transformando la ecuación entera**, con $\mathcal{L}\left\{t\right\}
      =\frac{1}{s^{2}}$ y $y\left(0\right)=0$:

      $$
      sY+Y-\frac{2Y}{s}=\frac{1}{s^{2}}
      \;\Longrightarrow\;
      Y\cdot\frac{s^{2}+s-2}{s}=\frac{1}{s^{2}}
      $$

      $$
      Y\left(s\right)=\frac{1}{s\left(s^{2}+s-2\right)}
      =\frac{1}{s\left(s+2\right)\left(s-1\right)}
      $$

      **Tres polos simples**, así que la descomposición es la más cómoda posible.
      Con el atajo de evaluar en cada raíz:

      | se hace | queda |
      |---|---|
      | $s=0$ | $\frac{1}{2\cdot\left(-1\right)}=-\frac12$ |
      | $s=-2$ | $\frac{1}{\left(-2\right)\left(-3\right)}=\frac16$ |
      | $s=1$ | $\frac{1}{1\cdot3}=\frac13$ |

      $$
      Y=-\frac{1}{2s}+\frac{1}{6\left(s+2\right)}+\frac{1}{3\left(s-1\right)}
      $$

      $$
      \boxed{\;y\left(t\right)=-\frac12+\frac16e^{-2t}+\frac13e^{t}\;}
      $$

      **Las comprobaciones**, y aquí hay dos que salen gratis:

      $$
      y\left(0\right)=-\frac12+\frac16+\frac13=0\;\checkmark
      $$

      $$
      y'\left(0\right)=-\frac13+\frac13=0
      $$

      y esa segunda tiene que ser cero: poniendo $t=0$ en la ecuación original,
      la integral se anula y $y\left(0\right)$ también, así que
      $y'\left(0\right)=0$ ✓.

      **El segundo camino, por si en el examen se atasca la antitransformada.**
      Derivando la ecuación original —y usando el teorema fundamental para la
      integral—:

      $$
      y''+y'-2y=1
      $$

      con $y\left(0\right)=0$ e $y'\left(0\right)=0$. La característica
      $r^{2}+r-2=0$ da $r=1$ y $r=-2$; la particular constante es $-\frac12$; y las
      condiciones iniciales fijan los coeficientes a $\frac13$ y $\frac16$. **La
      misma solución**, sin Laplace.

      Merece la pena verlo porque explica de dónde salían los polos: los $r$ de la
      característica son exactamente los polos de $Y\left(s\right)$, y el polo en
      $s=0$ es el término constante que aporta el segundo miembro.

      **Cómo se comporta.** Para $t$ grande manda $\frac13e^{t}$: la solución se
      dispara. Tiene sentido, porque la integral acumulada realimenta la ecuación
      con signo positivo —el $-2\int$ pasa al otro lado como $+2\int$— y eso es
      inestabilidad. Con un $+2\int$ en la ecuación, las raíces serían complejas y
      la solución oscilaría.

  - id: ex1920-12-el-empujon-que-llega-tarde
    titulo: Un empujón que llega tarde, y en el peor momento
    fuente: >-
      Ejercicio 7 del SEGUNDO CUATRIMESTRAL · Convocatorias ordinaria y
      extraordinaria, mayo y junio de 2020 · Cálculo, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Utilizando la transformada de Laplace resolver la EDO

      $$
      \begin{cases}
      y''+y=f\left(t\right)\\
      y\left(0\right)=y'\left(0\right)=1
      \end{cases}
      \qquad\text{donde}\qquad
      f\left(t\right)=
      \begin{cases}
      0 & t<2\\
      \cos\left(t-2\right) & t\ge2
      \end{cases}
      $$
    pide: La solución y(t).

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se escribe $f$ para poder transformarla?
        opciones:
          - texto: >-
              Como $u_{2}\left(t\right)\cos\left(t-2\right)$, con la función
              escalón unidad que se enciende en $t=2$
            correcta: true
            mensaje: |
              Eso es. Y encaja perfectamente con el segundo teorema de traslación,
              porque el argumento del coseno ya está desplazado el mismo $2$ que el
              escalón.
          - texto: >-
              Como $\cos\left(t-2\right)$ a secas, porque para $t<2$ el coseno ya
              es pequeño
            mensaje: |
              No es pequeño: $\cos\left(-2\right)=-0{,}416$. Y sobre todo, la
              transformada de Laplace integra desde $0$, así que se comería un
              tramo donde $f$ vale exactamente cero.
          - texto: >-
              Como $\cos t-2$
            mensaje: |
              $\cos\left(t-2\right)$ es el coseno de $t-2$, no el coseno menos dos.
              Es un desplazamiento del argumento.

      - tipo: calcular
        titulo: La transformada del segundo miembro
        pregunta: |
          En $\mathcal{L}\left\{f\right\}=e^{-as}\frac{s}{s^{2}+1}$, ¿cuánto vale
          $a$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es el valor de las condiciones iniciales, no el retraso. El
              escalón se enciende en $t=2$.
          - valor: '-2'
            mensaje: |
              El exponente ya lleva el signo menos: $e^{-2s}$. El $a$ es $2$.
          - valor: '0'
            mensaje: |
              Con $a=0$ no habría retraso y la fuerza actuaría desde el principio.
        pista: |
          El segundo teorema de traslación:
          $\mathcal{L}\left\{u_{a}\left(t\right)g\left(t-a\right)\right\}
          =e^{-as}G\left(s\right)$.
        desarrollo: |
          $$
          f\left(t\right)=u_{2}\left(t\right)\cos\left(t-2\right)
          \;\Longrightarrow\;
          \mathcal{L}\left\{f\right\}=e^{-2s}\cdot\frac{s}{s^{2}+1}
          $$

          El $2$ del escalón y el $2$ del argumento del coseno son el mismo, y por
          eso el teorema se aplica sin retocar nada.

      - tipo: calcular
        titulo: La antitransformada del término nuevo
        pregunta: |
          $\mathcal{L}^{-1}
          \left\{\frac{s}{\left(s^{2}+1\right)^{2}}\right\}$ es
          $\frac{t}{2}\operatorname{sen}t$. ¿Cuánto vale en
          $t=\frac{\pi}{2}$?
        respuesta:
          tipo: numero
          valor: '0.7853982'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0'
            mensaje: |
              Cero sale de $\frac{t}{2}\cos t$, que es la antitransformada de
              $\frac{s^{2}-1}{\left(s^{2}+1\right)^{2}}$, no de esta. Con la $s$
              sola arriba lo que aparece es el seno.
          - valor: '1'
            mensaje: |
              $1$ es $\operatorname{sen}\frac{\pi}{2}$, sin el factor
              $\frac{t}{2}$. Ese factor viene del cuadrado del denominador.
          - valor: '1.5707963'
            mensaje: |
              $\frac{\pi}{2}$ es $t$, sin dividir entre $2$.
        pista: |
          $\operatorname{sen}\frac{\pi}{2}=1$, así que queda
          $\frac{\pi/2}{2}$.
        desarrollo: |
          $$
          \frac{t}{2}\operatorname{sen}t\Big|_{t=\pi/2}
          =\frac{\pi}{4}\cdot 1=\frac{\pi}{4}\approx0{,}7854
          $$

          Y de dónde sale la fórmula:

          $$
          G\left(s\right)=\frac{1}{s^{2}+1}
          \;\Longrightarrow\;
          -G'\left(s\right)=\frac{2s}{\left(s^{2}+1\right)^{2}}
          $$

          Y como $\mathcal{L}\left\{t\,g\left(t\right)\right\}=-G'\left(s\right)$
          con $g=\operatorname{sen}t$:

          $$
          \mathcal{L}\left\{t\operatorname{sen}t\right\}
          =\frac{2s}{\left(s^{2}+1\right)^{2}}
          \;\Longrightarrow\;
          \mathcal{L}^{-1}\left\{\frac{s}{\left(s^{2}+1\right)^{2}}\right\}
          =\frac{t}{2}\operatorname{sen}t
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Transformando con $y\left(0\right)=y'\left(0\right)=1$:
              $s^{2}Y-s-1+Y=e^{-2s}\frac{s}{s^{2}+1}$.
          - texto: >-
              Despejando,
              $Y=\frac{s+1}{s^{2}+1}
              +e^{-2s}\frac{s}{\left(s^{2}+1\right)^{2}}$.
          - texto: >-
              Antitransformando término a término,
              $y=\cos t+\operatorname{sen}t
              +u_{2}\left(t\right)\frac{t-2}{2}\operatorname{sen}
              \left(t-2\right)$.
          - texto: >-
              El factor $e^{-2s}$ se antitransforma multiplicando la función por
              $e^{-2t}$.
            trampa: true
            mensaje: |
              Eso es el **primer** teorema de traslación, y va al revés: multiplicar
              por $e^{at}$ en el tiempo desplaza la $s$. Un $e^{-as}$ en el dominio
              de $s$ desplaza el **tiempo**: retrasa la respuesta hasta $t=a$. Si se
              confunden, sale una solución que decae exponencialmente en vez de una
              que empieza a las dos unidades de tiempo.
    resolucion: |
      **La fuerza, escrita como toca.** $f$ está definida a trozos y eso no se
      transforma directamente. Con la función escalón unidad,

      $$
      f\left(t\right)=u_{2}\left(t\right)\cos\left(t-2\right)
      $$

      Y aquí hay una suerte que conviene notar: el argumento del coseno **ya viene
      desplazado** el mismo $2$ que el escalón, que es exactamente la forma
      $u_{a}\left(t\right)g\left(t-a\right)$ que pide el segundo teorema de
      traslación:

      $$
      \mathcal{L}\left\{u_{a}\left(t\right)g\left(t-a\right)\right\}
      =e^{-as}G\left(s\right)
      \;\Longrightarrow\;
      \mathcal{L}\left\{f\right\}=e^{-2s}\cdot\frac{s}{s^{2}+1}
      $$

      **Transformando la ecuación**, con $y\left(0\right)=y'\left(0\right)=1$:

      $$
      \left(s^{2}Y-s\cdot1-1\right)+Y=e^{-2s}\frac{s}{s^{2}+1}
      $$

      $$
      Y\left(s\right)=\underbrace{\frac{s+1}{s^{2}+1}}_{\text{lo que ya traía}}
      +\underbrace{e^{-2s}\frac{s}{\left(s^{2}+1\right)^{2}}}
      _{\text{lo que aporta la fuerza}}
      $$

      **La primera parte es de tabla:**

      $$
      \mathcal{L}^{-1}\left\{\frac{s+1}{s^{2}+1}\right\}
      =\cos t+\operatorname{sen}t
      $$

      **La segunda tiene el denominador al cuadrado**, y ese cuadrado es la señal
      de que va a aparecer un factor $t$. Con
      $\mathcal{L}\left\{t\,g\right\}=-G'\left(s\right)$ y
      $G=\frac{1}{s^{2}+1}$:

      $$
      -G'\left(s\right)=\frac{2s}{\left(s^{2}+1\right)^{2}}
      \;\Longrightarrow\;
      \mathcal{L}^{-1}\left\{\frac{s}{\left(s^{2}+1\right)^{2}}\right\}
      =\frac{t}{2}\operatorname{sen}t
      $$

      Y el $e^{-2s}$ de delante **retrasa** esa respuesta hasta $t=2$:

      $$
      \boxed{\;y\left(t\right)=\cos t+\operatorname{sen}t
      +u_{2}\left(t\right)\,\frac{t-2}{2}\,
      \operatorname{sen}\left(t-2\right)\;}
      $$

      es decir

      $$
      y\left(t\right)=
      \begin{cases}
      \cos t+\operatorname{sen}t & t<2\\[4pt]
      \cos t+\operatorname{sen}t
      +\dfrac{t-2}{2}\operatorname{sen}\left(t-2\right) & t\ge2
      \end{cases}
      $$

      **Las comprobaciones:**

      | qué | cuenta |
      |---|---|
      | $y\left(0\right)$ | $1+0=1$ ✓ |
      | $y'\left(0\right)$ | $-0+1=1$ ✓ |
      | continuidad en $t=2$ | el término nuevo vale $0$ y su derivada también, así que $y$ e $y'$ empalman ✓ |

      **Y lo que de verdad cuenta este ejercicio.** El sistema $y''+y$ tiene
      frecuencia propia $1$. La fuerza que llega en $t=2$ es
      $\cos\left(t-2\right)$: **la misma frecuencia**. Es una resonancia, pero con
      retraso.

      | tramo | qué hace |
      |---|---|
      | $t<2$ | oscila libre, con amplitud $\sqrt2$ y sin crecer |
      | $t\ge2$ | la amplitud crece linealmente, con el factor $\frac{t-2}{2}$ |

      El factor $t-2$, y no $t$, dice que **el reloj de la resonancia empieza
      cuando llega el empujón**, no cuando arranca el sistema. Un empujón que
      llega tarde no pierde eficacia: simplemente empieza a acumular más tarde.

      Y por eso la solución no es acotada. Si la fuerza fuese
      $\cos\left(2\left(t-2\right)\right)$ —otra frecuencia— la respuesta seguiría
      siendo una oscilación acotada, sin factor $t$ ninguno.

  - id: ex1920-13-la-rampa-ampliada-de-forma-impar
    titulo: Una rampa ampliada de forma impar
    fuente: >-
      Ejercicio 8 del SEGUNDO CUATRIMESTRAL · Convocatorias ordinaria y
      extraordinaria, mayo y junio de 2020 · Cálculo, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La figura está redibujada en SVG a partir del original
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea $f\left(t\right)$ la función definida en el intervalo
      $\left(0,\pi\right)$ que aparece en la figura.

      <figure class="figura-examen">
      <svg viewBox="0 0 320 240" role="img" width="320" height="240"
           aria-labelledby="ram20-t ram20-d">
        <title id="ram20-t">La funcion del enunciado: un segmento de altura pi a 2 pi</title>
        <desc id="ram20-d">Un segmento recto que arranca en el punto cero coma pi y sube
        hasta pi coma dos pi. Los dos extremos estan marcados con circulos huecos porque el
        intervalo es abierto.</desc>
        <style>
          .ram20-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
          .ram20-n { fill: var(--faint); font-size: 10px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
          .ram20-l { font-size: 10.5px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.4px; stroke-linejoin: round; }
          .ram20-f { stroke: var(--d1); stroke-width: 3; fill: none; }
          .ram20-g { stroke: var(--faint); stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
          .ram20-h { fill: var(--paper); stroke: var(--d1); stroke-width: 2.2; }
        </style>
        <path class="ram20-eje" d="M30 196L300 196M62 214L62 26"/>
        <path class="ram20-g" d="M62 120.6L256.8 120.6M256.8 45.2L256.8 196M62 45.2L256.8 45.2"/>
        <path class="ram20-f" d="M62 120.6L256.8 45.2"/>
        <circle class="ram20-h" cx="62" cy="120.6" r="4"/>
        <circle class="ram20-h" cx="256.8" cy="45.2" r="4"/>
        <g class="ram20-n">
          <text x="54" y="124.6" text-anchor="end">π</text>
          <text x="54" y="49.2" text-anchor="end">2π</text>
          <text x="256.8" y="212" text-anchor="middle">π</text>
          <text x="300" y="188" text-anchor="end">t</text>
          <text x="69" y="34">f</text>
        </g>
        <g class="ram20-l">
          <text x="148.8" y="96.4" fill="var(--d1)">f(t) = t + π</text>
        </g>
      </svg>
      <figcaption>
      El segmento del enunciado, redibujado: sube de π a 2π mientras t recorre
      (0,π). Los extremos van huecos porque el intervalo es abierto.
      </figcaption>
      </figure>

      a) Obtener la ampliación impar y periódica de la función
      $f\left(t\right)$.

      b) Dibujar la función ampliada.

      c) Calcular la serie de Fourier, $S\left(t\right)$, de $f\left(t\right)$.

      d) Calcular los valores de $S\left(t\right)$ y $f\left(t\right)$ en los
      puntos $t=0$ y $t=\frac{\pi}{2}$.

      e) Calcular la suma de la serie
      $\displaystyle\sum_{n=0}^{\infty}\frac{\left(-1\right)^{n+1}}{2n+1}$.
    pide: La ampliación, su dibujo, la serie, los valores y la suma.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué función es la de la figura?
        opciones:
          - texto: >-
              El segmento de $\left(0,\pi\right)$ a $\left(\pi,2\pi\right)$, o sea
              $f\left(t\right)=t+\pi$
            correcta: true
            mensaje: |
              Eso es. Pendiente $1$ y ordenada en el origen $\pi$: sube desde $\pi$
              hasta $2\pi$ mientras $t$ va de $0$ a $\pi$.
          - texto: >-
              $f\left(t\right)=t$
            mensaje: |
              Esa saldría del origen. La de la figura arranca en $\left(0,\pi\right)$,
              a la altura $\pi$: le falta el $+\pi$.
          - texto: >-
              $f\left(t\right)=2t$
            mensaje: |
              Con $f\left(t\right)=2t$ el extremo derecho sería $2\pi$, sí, pero el
              izquierdo sería $0$, no $\pi$. La recta de la figura no pasa por el
              origen.

      - tipo: calcular
        titulo: El primer coeficiente
        pregunta: |
          ¿Cuánto vale $b_{1}$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es el coeficiente que daría $f=t$ sola. El $+\pi$ aporta otros
              $4$, porque el escalón que introduce en la ampliación impar pesa
              mucho.
          - valor: '-1'
            mensaje: |
              $-1$ es $b_{2}$. Los pares y los impares siguen fórmulas distintas.
          - valor: '4'
            mensaje: |
              $4$ es lo que aporta el $\pi$ por su cuenta. Falta sumar el $2$ que
              aporta la $t$.
        pista: |
          $b_{n}=\frac{2}{\pi}\int_{0}^{\pi}
          \left(t+\pi\right)\operatorname{sen}\left(nt\right)dt$, y para $n$ impar
          sale $\frac6n$.
        desarrollo: |
          $$
          b_{n}=\frac{2}{\pi}\int_{0}^{\pi}\left(t+\pi\right)
          \operatorname{sen}\left(nt\right)dt
          =\frac{2\left[1+2\left(-1\right)^{n+1}\right]}{n}
          $$

          | $n$ | $b_{n}$ |
          |---|---|
          | impar | $\dfrac6n$ |
          | par | $-\dfrac2n$ |

          Con $n=1$: $b_{1}=6$.

      - tipo: calcular
        titulo: La suma que pide el apartado e)
        pregunta: |
          ¿Cuánto vale
          $\sum_{n=0}^{\infty}\frac{\left(-1\right)^{n+1}}{2n+1}$?
        respuesta:
          tipo: numero
          valor: '-0.7853982'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.7853982'
            mensaje: |
              $+\frac{\pi}{4}$ es la serie de Leibniz clásica, con
              $\left(-1\right)^{n}$. Esta lleva $\left(-1\right)^{n+1}$: todos los
              signos cambiados, así que el resultado es el opuesto.
          - valor: '1.5707963'
            mensaje: |
              $\frac{\pi}{2}$ es el doble. La serie de Leibniz suma $\frac{\pi}{4}$.
          - valor: '4.712389'
            mensaje: |
              $\frac{3\pi}{2}$ es el valor de $S\left(\frac{\pi}{2}\right)$, del que
              se **deduce** la suma. Falta dividir entre $6$ y cambiar el signo.
        pista: |
          De $S\left(\frac{\pi}{2}\right)=\frac{3\pi}{2}$ sale
          $6\sum\frac{\left(-1\right)^{k}}{2k+1}=\frac{3\pi}{2}$.
        desarrollo: |
          En $t=\frac{\pi}{2}$ solo sobreviven los términos impares, porque
          $\operatorname{sen}\left(n\frac{\pi}{2}\right)=0$ para $n$ par:

          $$
          S\left(\tfrac{\pi}{2}\right)
          =\sum_{k\ge0}\frac{6}{2k+1}\left(-1\right)^{k}
          =6\sum_{k\ge0}\frac{\left(-1\right)^{k}}{2k+1}
          $$

          Y como en $\frac{\pi}{2}$ la función es continua,
          $S\left(\frac{\pi}{2}\right)=f\left(\frac{\pi}{2}\right)
          =\frac{3\pi}{2}$:

          $$
          6\sum\frac{\left(-1\right)^{k}}{2k+1}=\frac{3\pi}{2}
          \;\Longrightarrow\;
          \sum\frac{\left(-1\right)^{k}}{2k+1}=\frac{\pi}{4}
          $$

          La que pide el examen lleva $\left(-1\right)^{n+1}$, o sea el signo
          contrario: $-\frac{\pi}{4}\approx-0{,}7854$.

      - tipo: justificar
        pregunta: Ordena el apartado d). Una pieza es falsa.
        piezas:
          - texto: >-
              En $t=\frac{\pi}{2}$ la función ampliada es continua, así que la serie
              converge a la propia función:
              $S\left(\frac{\pi}{2}\right)=f\left(\frac{\pi}{2}\right)
              =\frac{3\pi}{2}$.
          - texto: >-
              En $t=0$ la ampliación impar da $f\left(0^{-}\right)=-\pi$ mientras
              que $f\left(0^{+}\right)=\pi$: hay un salto.
          - texto: >-
              Dirichlet dice que en un salto la serie converge a la **media** de
              los dos límites laterales, así que
              $S\left(0\right)=\frac{-\pi+\pi}{2}=0$.
          - texto: >-
              Como todos los términos de la serie llevan
              $\operatorname{sen}\left(nt\right)$ y se anulan en $t=0$, no hay
              nada que discutir: la serie no está definida ahí.
            trampa: true
            mensaje: |
              Está perfectamente definida y vale $0$ — precisamente porque todos sus
              términos se anulan. Lo interesante es lo contrario de lo que dice la
              pieza: la serie **no puede** dar otra cosa que $0$ en el origen, y eso
              obliga a que la función ampliada valga $0$ ahí si se quiere que
              coincidan. Es el precio de ampliar de forma impar una función que no
              se anula en el origen.
    resolucion: |
      **La función de la figura.** El segmento va de $\left(0,\pi\right)$ a
      $\left(\pi,2\pi\right)$: pendiente $1$ y ordenada en el origen $\pi$.

      $$
      f\left(t\right)=t+\pi,\qquad t\in\left(0,\pi\right)
      $$

      **a) y b) La ampliación impar y periódica.** Impar quiere decir
      $f\left(-t\right)=-f\left(t\right)$, así que en $\left(-\pi,0\right)$ la
      función es

      $$
      f\left(t\right)=-\left(-t+\pi\right)=t-\pi
      $$

      y luego se repite con periodo $2\pi$.

      <figure class="figura-examen">
      <svg viewBox="0 0 336 210" role="img" width="336" height="210"
           aria-labelledby="amp20-t amp20-d">
        <title id="amp20-t">La ampliacion impar y periodica, con sus saltos</title>
        <desc id="amp20-d">Una sucesion de segmentos paralelos de pendiente uno, que se
        repiten cada dos pi. En cada multiplo de pi la funcion salta de menos pi a mas pi,
        y en el punto medio de cada salto hay un punto marcado: es donde converge la serie.</desc>
        <style>
          .amp20-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
          .amp20-n { fill: var(--faint); font-size: 10px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
          .amp20-l { font-size: 10.5px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.4px; stroke-linejoin: round; }
          .amp20-f { stroke: var(--d1); stroke-width: 2.6; fill: none; }
          .amp20-s { stroke: var(--faint); stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
          .amp20-pt { fill: var(--flag); }
        </style>
        <path class="amp20-eje" d="M12 128L324 128M166 211.6L166 44.4"/>
        <path class="amp20-s" d="M19 197.1L19 58.9M68 162.6L68 93.4M117 197.1L117 58.9M166 162.6L166 93.4M215 197.1L215 58.9M264 162.6L264 93.4M313 197.1L313 58.9"/>
        <path class="amp20-f" d="M68 93.4L117 58.9M19 197.1L68 162.6M166 93.4L215 58.9M117 197.1L166 162.6M264 93.4L313 58.9M215 197.1L264 162.6"/>
        <g class="amp20-pt"><circle cx="19" cy="128" r="3.4"/><circle cx="68" cy="128" r="3.4"/><circle cx="117" cy="128" r="3.4"/><circle cx="166" cy="128" r="3.4"/><circle cx="215" cy="128" r="3.4"/><circle cx="264" cy="128" r="3.4"/><circle cx="313" cy="128" r="3.4"/></g>
        <g class="amp20-n">
          <text x="215" y="144" text-anchor="middle">π</text>
          <text x="117" y="144" text-anchor="middle">−π</text>
          <text x="313" y="144" text-anchor="middle">3π</text>
          <text x="19" y="144" text-anchor="middle">−3π</text>
          <text x="159" y="62.9" text-anchor="end">2π</text>
          <text x="324" y="120" text-anchor="end">t</text>
        </g>
        <g class="amp20-l">
          <text x="16" y="24" fill="var(--flag)">en cada salto la serie da la media: 0</text>
        </g>
      </svg>
      <figcaption>
      La ampliación impar repetida cada 2π. Los saltos de −π a π en cada múltiplo de
      π no estaban en f: los ha creado la ampliación, y son los que fijan S(0) = 0.
      </figcaption>
      </figure>

      **Y aparecen unos saltos que no estaban.** En el origen, la rama de la
      derecha tiende a $\pi$ y la de la izquierda a $-\pi$: un salto de altura
      $2\pi$. Y en $t=\pi$ el salto es todavía mayor: por la izquierda la función
      llega a $2\pi$ y por la derecha arranca en $-2\pi$, así que salta $4\pi$ de
      golpe.

      | dónde | por la izquierda | por la derecha | salto |
      |---|---|---|---|
      | $t=0,\;\pm2\pi,\ldots$ | $-\pi$ | $\pi$ | $2\pi$ |
      | $t=\pm\pi,\;\pm3\pi,\ldots$ | $2\pi$ | $-2\pi$ | $4\pi$ |

      Esos saltos **los ha creado la ampliación**, no estaban en $f$, y son los que
      van a mandar en el comportamiento de la serie. En todos ellos el punto medio
      de los dos límites laterales es **cero**, que es lo que la serie va a
      devolver.

      **c) La serie.** Al ser impar, solo hay senos:

      $$
      S\left(t\right)=\sum_{n=1}^{\infty}b_{n}\operatorname{sen}\left(nt\right),
      \qquad
      b_{n}=\frac{2}{\pi}\int_{0}^{\pi}\left(t+\pi\right)
      \operatorname{sen}\left(nt\right)dt
      $$

      La integral se parte en dos, y las dos son conocidas:

      $$
      \int_{0}^{\pi}t\operatorname{sen}\left(nt\right)dt
      =\frac{\pi\left(-1\right)^{n+1}}{n},
      \qquad
      \int_{0}^{\pi}\pi\operatorname{sen}\left(nt\right)dt
      =\frac{\pi\left[1-\left(-1\right)^{n}\right]}{n}
      $$

      $$
      b_{n}=\frac{2}{n}\left[\left(-1\right)^{n+1}+1-\left(-1\right)^{n}\right]
      =\frac{2\left[1+2\left(-1\right)^{n+1}\right]}{n}
      $$

      | $n$ | $b_{n}$ | los primeros |
      |---|---|---|
      | impar | $\dfrac6n$ | $6,\;2,\;\frac65,\ldots$ |
      | par | $-\dfrac2n$ | $-1,\;-\frac12,\;-\frac13,\ldots$ |

      $$
      \boxed{\;S\left(t\right)=6\operatorname{sen}t
      -\operatorname{sen}2t+2\operatorname{sen}3t
      -\tfrac12\operatorname{sen}4t+\tfrac65\operatorname{sen}5t-\cdots\;}
      $$

      **d) Los dos valores.**

      *En $t=\frac{\pi}{2}$* la función ampliada es continua, así que Dirichlet
      dice que la serie converge a la función:

      $$
      S\left(\tfrac{\pi}{2}\right)=f\left(\tfrac{\pi}{2}\right)
      =\frac{\pi}{2}+\pi=\frac{3\pi}{2}\approx4{,}712
      $$

      *En $t=0$* hay salto, y ahí la serie converge a la **media de los límites
      laterales**:

      $$
      S\left(0\right)=\frac{f\left(0^{-}\right)+f\left(0^{+}\right)}{2}
      =\frac{-\pi+\pi}{2}=0
      $$

      mientras que $f\left(0^{+}\right)=\pi$. **La serie y la función no
      coinciden en el origen**, y decir por qué —el salto que introdujo la
      ampliación impar— es lo que valen aquí los puntos de COMP 4. Además se ve
      sin cuentas: todos los términos llevan
      $\operatorname{sen}\left(n\cdot0\right)=0$.

      **e) La suma de la serie numérica.** Es el regalo del apartado anterior.
      En $t=\frac{\pi}{2}$, los términos pares se anulan
      —$\operatorname{sen}\left(n\frac{\pi}{2}\right)=0$ si $n$ es par— y los
      impares valen $\pm1$ alternando:

      $$
      S\left(\tfrac{\pi}{2}\right)
      =\sum_{k=0}^{\infty}\frac{6}{2k+1}\left(-1\right)^{k}
      =6\sum_{k=0}^{\infty}\frac{\left(-1\right)^{k}}{2k+1}
      $$

      Igualando con el valor ya calculado:

      $$
      6\sum_{k=0}^{\infty}\frac{\left(-1\right)^{k}}{2k+1}=\frac{3\pi}{2}
      \;\Longrightarrow\;
      \sum_{k=0}^{\infty}\frac{\left(-1\right)^{k}}{2k+1}=\frac{\pi}{4}
      $$

      que es la célebre **serie de Leibniz**. Y la que pide el enunciado lleva
      $\left(-1\right)^{n+1}$, con todos los signos cambiados:

      $$
      \boxed{\;\sum_{n=0}^{\infty}\frac{\left(-1\right)^{n+1}}{2n+1}
      =-\frac{\pi}{4}\approx-0{,}7854\;}
      $$

      **Ojo al signo, que es donde el ejercicio pilla a más gente.** Con $n=0$ el
      primer término es $\frac{\left(-1\right)^{1}}{1}=-1$, no $+1$. La serie
      empieza en negativo y suma $-\frac{\pi}{4}$.

      **Y una nota sobre lo lenta que es.** Sumando cuatro millones de términos se
      obtiene $0{,}785398$, apenas seis decimales correctos. Como fórmula para
      calcular $\pi$ es pésima; como resultado teórico —que una suma alternada de
      inversos de impares dé exactamente $\frac{\pi}{4}$— es de los que justifican
      el tema entero.
