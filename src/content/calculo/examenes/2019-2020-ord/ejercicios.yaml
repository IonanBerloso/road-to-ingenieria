      <figcaption>
      El borde tiene tres trozos y hay que sumar los tres. El arco queda entre la
      cuerda —2√5 ≈ 4,47— y la suma de los dos catetos, que es 6.
      </figcaption>
      </figure>

      Un cuarto de «campana» con dos lados rectos y un arco. **El perímetro son
      los tres**, y este es el ejercicio donde más gente entrega solo el arco.

      **Los lados rectos**, que no necesitan integral:

      | lado | de | a | mide |
      |---|---|---|---|
      | eje $X$ | $\left(0,0\right)$ | $\left(2,0\right)$ | $2$ |
      | eje $Y$ | $\left(0,0\right)$ | $\left(0,4\right)$ | $4$ |

      **El arco.** Con $y=4-x^{2}$ y $y'=-2x$:

      $$
      L=\int_{0}^{2}\sqrt{1+\left(y'\right)^{2}}\,dx
      =\int_{0}^{2}\sqrt{1+4x^{2}}\;dx
      $$

      La primitiva de $\sqrt{1+u^{2}}$ conviene tenerla de memoria, porque en el
      examen no hay calculadora ni formulario:

      $$
      \int\sqrt{1+u^{2}}\,du
      =\frac{u\sqrt{1+u^{2}}}{2}+\frac12\ln\left(u+\sqrt{1+u^{2}}\right)+C
      $$

      Con $u=2x$, $du=2dx$:

      $$
      L=\frac12\int_{0}^{4}\sqrt{1+u^{2}}\,du
      =\frac12\left[\frac{u\sqrt{1+u^{2}}}{2}
      +\frac12\ln\left(u+\sqrt{1+u^{2}}\right)\right]_{0}^{4}
      $$

      $$
      =\frac12\left[\frac{4\sqrt{17}}{2}
      +\frac12\ln\left(4+\sqrt{17}\right)\right]
      =\sqrt{17}+\frac14\ln\left(4+\sqrt{17}\right)
      $$

      $$
      \approx4{,}1231+0{,}5237=4{,}6468
      $$

      **El perímetro:**

      $$
      \boxed{\;P=6+\sqrt{17}+\frac14\ln\left(4+\sqrt{17}\right)
      \approx10{,}6468\;}
      $$

      **La comprobación que hay que hacer siempre con un arco.** El arco tiene que
      ser **mayor que la cuerda** y menor que la suma de los catetos:

      $$
      \underbrace{\sqrt{2^{2}+4^{2}}=2\sqrt5\approx4{,}472}_{\text{cuerda}}
      \;<\;
      \underbrace{4{,}647}_{\text{arco}}
      \;<\;
      \underbrace{2+4=6}_{\text{los dos catetos}}
      $$

      Encaja, y con poco margen por abajo: la parábola se separa poco de su
      cuerda.

      **Por qué la longitud de arco casi nunca sale «bonita».** El integrando
      $\sqrt{1+4x^{2}}$ lleva una raíz de un polinomio de grado dos, y esas
      primitivas traen siempre un logaritmo o un arco hiperbólico. Que aparezca
      $\ln\left(4+\sqrt{17}\right)$ no es señal de haberse equivocado: es lo
      normal. La longitud de una parábola es un caso de los pocos que se pueden
      escribir en forma cerrada — la de una elipse, sin ir más lejos, no se puede.

  - id: ex1920-6-el-cono-que-tapa-al-paraboloide
    titulo: Un cono metido dentro de un paraboloide
    fuente: >-
      Ejercicio 1 del SEGUNDO CUATRIMESTRAL · Convocatorias ordinaria y
      extraordinaria, mayo y junio de 2020 · Cálculo, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Calcular el volumen del sólido definido por las condiciones siguientes:

      $$
      z\le 18-9x^{2}-3y^{2};
      \qquad
      9x^{2}+3y^{2}\le\left(z-6\right)^{2},
      \qquad
      z\ge 6
      $$
    pide: El volumen del sólido.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué cambio de variable convierte las dos superficies en superficies de
          revolución?
        opciones:
          - texto: >-
              $u=3x$, $v=\sqrt3\,y$, que convierte $9x^{2}+3y^{2}$ en
              $u^{2}+v^{2}$
            correcta: true
            mensaje: |
              Exacto. Las dos condiciones están escritas con la **misma**
              combinación $9x^{2}+3y^{2}$, así que un solo cambio las arregla las
              dos. El jacobiano aporta el factor $\frac{1}{3\sqrt3}$.
          - texto: >-
              Polares a secas, $x=r\cos\theta$, $y=r\operatorname{sen}\theta$
            mensaje: |
              Con polares directas queda
              $r^{2}\left(9\cos^{2}\theta+3\operatorname{sen}^{2}\theta\right)$, que
              depende del ángulo. Hay que estirar los ejes **antes** de pasar a
              polares.
          - texto: >-
              Coordenadas esféricas
            mensaje: |
              Las esféricas van bien con esferas y conos centrados en el origen.
              Aquí el cono tiene el vértice en $z=6$ y hay un paraboloide: las
              cilíndricas estiradas son mucho más cómodas.

      - tipo: calcular
        titulo: Dónde se cortan las dos superficies
        pregunta: |
          ¿A qué altura $z$ se cortan el cono y el paraboloide?
        respuesta:
          tipo: numero
          valor: '9'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '6'
            mensaje: |
              $z=6$ es el **vértice** del cono, donde el sólido empieza en punta.
              El corte está más arriba.
          - valor: '18'
            mensaje: |
              $z=18$ es la cima del paraboloide, sobre el eje. Ahí no hay corte con
              el cono.
          - valor: '2'
            mensaje: |
              $z=2$ sale de quedarse con la raíz equivocada. De
              $s^{2}+s-12=0$ con $s=z-6$ salen $s=3$ y $s=-4$; la negativa
              contradice $z\ge6$.
        pista: |
          Con $r^{2}=9x^{2}+3y^{2}$, el cono es $z=6+r$ y el paraboloide
          $z=18-r^{2}$. Iguala.
        desarrollo: |
          $$
          6+r=18-r^{2}
          \;\Longrightarrow\;
          r^{2}+r-12=0
          \;\Longrightarrow\;
          \left(r+4\right)\left(r-3\right)=0
          $$

          $r=3$ —la otra raíz es negativa y $r\ge0$—, y entonces $z=6+3=9$.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen del sólido?
        respuesta:
          tipo: numero
          valor: '29.9277'
          tolerancia: 0.01
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '155.5088'
            mensaje: |
              $\frac{99\pi}{2}$ es el volumen **antes** de deshacer el cambio: falta
              dividir entre el jacobiano $3\sqrt3$.
          - valor: '51.8363'
            mensaje: |
              Parece salir de dividir entre $3$ en vez de entre $3\sqrt3$. El
              jacobiano de $u=3x$, $v=\sqrt3y$ es $3\cdot\sqrt3$.
          - valor: '9.4248'
            mensaje: |
              $3\pi$ es el volumen del cono solo hasta $z=9$
              —$\frac{\pi\cdot9\cdot3}{3}$, en las variables $u,v$—, sin dividir por
              el jacobiano y sin el trozo del paraboloide.
        pista: |
          $V=\frac{1}{3\sqrt3}\cdot2\pi\int_{0}^{3}
          \left(12-r-r^{2}\right)r\,dr$.
        desarrollo: |
          $$
          \int_{0}^{3}\left(12r-r^{2}-r^{3}\right)dr
          =\left[6r^{2}-\frac{r^{3}}{3}-\frac{r^{4}}{4}\right]_{0}^{3}
          =54-9-\frac{81}{4}=\frac{99}{4}
          $$

          $$
          V=\frac{2\pi}{3\sqrt3}\cdot\frac{99}{4}
          =\frac{33\pi}{2\sqrt3}=\frac{11\pi\sqrt3}{2}\approx29{,}9277
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $u=3x$, $v=\sqrt3\,y$ y $r^{2}=u^{2}+v^{2}$, las condiciones
              quedan $z\le18-r^{2}$ y $r\le z-6$, y
              $dx\,dy=\frac{du\,dv}{3\sqrt3}$.
          - texto: >-
              Las dos superficies se cortan donde $6+r=18-r^{2}$, es decir en
              $r=3$, $z=9$.
          - texto: >-
              Entonces
              $V=\frac{2\pi}{3\sqrt3}\int_{0}^{3}\left(12-r-r^{2}\right)r\,dr
              =\frac{11\pi\sqrt3}{2}$.
          - texto: >-
              La condición $z\ge6$ sobra, porque el paraboloide ya obliga a que
              $z$ sea positivo.
            trampa: true
            mensaje: |
              No sobra: es la que elige **una de las dos hojas del cono**.
              $9x^{2}+3y^{2}\le\left(z-6\right)^{2}$ se cumple igual con $z-6$
              negativo, y sin $z\ge6$ el sólido incluiría también un cono que baja
              desde $z=6$ hacia abajo, sin fondo. El paraboloide no lo impide: por
              debajo de $z=6$ sigue habiendo sitio.
    resolucion: |
      **Las tres condiciones, traducidas.**

      | condición | qué superficie es |
      |---|---|
      | $z\le18-9x^{2}-3y^{2}$ | por **debajo** de un paraboloide elíptico con la cima en $\left(0,0,18\right)$ |
      | $9x^{2}+3y^{2}\le\left(z-6\right)^{2}$ | **dentro** de un cono de vértice $\left(0,0,6\right)$ |
      | $z\ge6$ | la hoja de **arriba** del cono, no la de abajo |

      **El cambio que lo pone todo en revolución.** Las dos primeras condiciones
      usan la misma combinación $9x^{2}+3y^{2}$, así que un solo cambio las arregla
      las dos:

      $$
      u=3x,\qquad v=\sqrt3\,y
      \;\Longrightarrow\;
      9x^{2}+3y^{2}=u^{2}+v^{2}=r^{2}
      $$

      $$
      dx\,dy=\frac{du\,dv}{3\sqrt3}
      $$

      Y en las nuevas variables:

      $$
      \text{cono: } z=6+r,
      \qquad
      \text{paraboloide: } z=18-r^{2}
      $$

      **Dónde se cortan:**

      $$
      6+r=18-r^{2}
      \;\Longrightarrow\;
      r^{2}+r-12=0
      \;\Longrightarrow\;
      r=3
      \quad\left(\text{la otra raíz, }-4,\text{ no vale}\right)
      $$

      $$
      z=6+3=9
      $$

