      <figcaption>
      El corte por el eje, en las coordenadas estiradas u = 3x, v = √3y. El cono
      sube en punta desde z = 6 y la parábola baja desde z = 18; se cruzan en z = 9.
      </figcaption>
      </figure>

      **El volumen.** Para cada $r$ entre $0$ y $3$, la altura del sólido va del
      cono al paraboloide:

      $$
      V=\frac{1}{3\sqrt3}\int_{0}^{2\pi}\!\!\int_{0}^{3}
      \left[\left(18-r^{2}\right)-\left(6+r\right)\right]r\,dr\,d\theta
      =\frac{2\pi}{3\sqrt3}\int_{0}^{3}\left(12-r-r^{2}\right)r\,dr
      $$

      $$
      \int_{0}^{3}\left(12r-r^{2}-r^{3}\right)dr
      =\left[6r^{2}-\frac{r^{3}}{3}-\frac{r^{4}}{4}\right]_{0}^{3}
      =54-9-\frac{81}{4}=\frac{99}{4}
      $$

      $$
      \boxed{\;V=\frac{2\pi}{3\sqrt3}\cdot\frac{99}{4}
      =\frac{33\pi}{2\sqrt3}=\frac{11\pi\sqrt3}{2}\approx29{,}93\;}
      $$

      **La comprobación, por rebanadas horizontales.** Es un camino distinto y
      conviene hacerlo, porque el jacobiano es el sitio donde más se falla. Para
      cada altura $z$, el radio de la sección en las variables $u,v$ es

      $$
      r\left(z\right)=\min\left\{z-6,\;\sqrt{18-z}\right\}
      $$

      —el cono manda abajo y el paraboloide arriba, y se cambian el turno en
      $z=9$—:

      $$
      \frac{1}{3\sqrt3}\left[\int_{6}^{9}\pi\left(z-6\right)^{2}dz
      +\int_{9}^{18}\pi\left(18-z\right)dz\right]
      =\frac{9\pi+40{,}5\pi}{3\sqrt3}
      =\frac{49{,}5\pi}{3\sqrt3}
      $$

      que es el mismo número, $29{,}9277$ ✓. **Y ojo al límite superior: $z$ llega
      hasta $18$, no hasta $9$.** Por encima del corte el sólido sigue, ya solo
      limitado por el paraboloide, y estrechándose hasta la punta.

      **La condición que parece de adorno y no lo es.** $z\ge6$ selecciona la hoja
      superior del cono. Sin ella,
      $9x^{2}+3y^{2}\le\left(z-6\right)^{2}$ se cumpliría también con $z<6$ —el
      cuadrado no distingue signos— y el sólido incluiría un segundo cono hacia
      abajo, infinito. Nombrarlo vale la mitad de los puntos de COMP 4.

  - id: ex1920-7-cambiar-el-orden-y-que-sobre-una-integral
    titulo: Cambiar el orden y quedarse con una sola integral
    fuente: >-
      Ejercicio 2 del SEGUNDO CUATRIMESTRAL · Convocatorias ordinaria y
      extraordinaria, mayo y junio de 2020 · Cálculo, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Sea la integral

      $$
      \int_{0}^{1}\left(\int_{0}^{x^{2}}dy\right)dx
      +\int_{1}^{3}\left(\int_{0}^{\frac{3-x}{2}}dy\right)dx
      $$

      a) Dibujar el dominio de integración.

      b) Cambiar el orden de integración y resolver la integral con los nuevos
      límites.
    pide: El dibujo del dominio y la integral con el orden cambiado.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el enunciado trae **dos** integrales en vez de una?
        opciones:
          - texto: >-
              Porque, integrando primero en $y$, la tapa de arriba cambia de
              fórmula en $x=1$: antes es la parábola y después la recta
            correcta: true
            mensaje: |
              Eso es. Y esa es la razón de cambiar el orden: en el otro sentido la
              frontera izquierda y la derecha son **una sola fórmula cada una**, y
              basta con una integral.
          - texto: >-
              Porque el dominio no es conexo: son dos trozos separados
            mensaje: |
              Es un solo trozo. Se comprueba en $x=1$: la parábola vale $1$ y la
              recta también, así que las dos tapas se enganchan sin dejar hueco.
          - texto: >-
              Porque el integrando cambia de una a otra
            mensaje: |
              El integrando es $1$ en las dos: la integral es un **área**. Lo que
              cambia es la frontera, no la función.

      - tipo: calcular
        titulo: Dónde se enganchan las dos tapas
        pregunta: |
          ¿Cuánto valen la parábola y la recta en $x=1$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es $3-x$ sin dividir entre $2$. La tapa derecha es
              $\frac{3-x}{2}$.
          - valor: '0.5'
            mensaje: |
              $\frac12$ saldría de $\frac{3-x}{2}$ con $x=2$. El punto de empalme
              es $x=1$.
          - valor: '3'
            mensaje: |
              $3$ es donde la recta llega al eje $X$, el extremo derecho del
              dominio.
        pista: |
          $x^{2}$ en $x=1$, y $\frac{3-x}{2}$ en $x=1$.
        desarrollo: |
          $$
          x^{2}\Big|_{x=1}=1,
          \qquad
          \frac{3-x}{2}\Big|_{x=1}=\frac{2}{2}=1
          $$

          Las dos tapas valen lo mismo, así que el dominio es **una sola región**
          y el punto $\left(1,1\right)$ es el vértice donde la parábola cede el
          turno a la recta.

      - tipo: calcular
        titulo: El valor de la integral
        pregunta: |
          ¿Cuánto vale la integral?
        respuesta:
          tipo: numero
          valor: '1.3333333'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.3333333'
            mensaje: |
              $\frac13$ es solo la primera integral, la del trozo bajo la parábola.
              Falta el trozo bajo la recta, que aporta $1$.
          - valor: '1'
            mensaje: |
              $1$ es solo la segunda. Falta el $\frac13$ de la parábola.
          - valor: '2'
            mensaje: |
              $2$ sale de tomar $3-x$ como tapa en vez de $\frac{3-x}{2}$.
        pista: |
          $\int_{0}^{1}x^{2}dx+\int_{1}^{3}\frac{3-x}{2}dx$.
        desarrollo: |
          $$
          \int_{0}^{1}x^{2}\,dx=\frac13,
          \qquad
          \int_{1}^{3}\frac{3-x}{2}\,dx
          =\frac12\left[3x-\frac{x^{2}}{2}\right]_{1}^{3}
          =\frac12\left(\frac92-\frac52\right)=1
          $$

          $$
          \frac13+1=\frac43\approx1{,}3333
          $$

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              En el dominio, $y$ va de $0$ a $1$: el punto más alto es
              $\left(1,1\right)$, donde la parábola y la recta se encuentran.
          - texto: >-
              Para cada $y$, la frontera izquierda es la parábola $x=\sqrt y$ y la
              derecha la recta $x=3-2y$.
          - texto: >-
              Así que la integral pasa a ser
              $\int_{0}^{1}\left(3-2y-\sqrt y\right)dy
              =3-1-\frac23=\frac43$.
          - texto: >-
              Al cambiar el orden de integración el resultado puede cambiar, porque
              se recorre el dominio de otra manera.
            trampa: true
            mensaje: |
              No cambia, y ese es justamente el sentido del teorema de Fubini: si la
              función es integrable sobre el recinto, las dos iteraciones dan el
              mismo número. Aquí las dos dan $\frac43$, y esa coincidencia es la
              comprobación de que el cambio de límites está bien hecho.
    resolucion: |
      **a) El dominio.** Se lee directamente de los límites: para cada $x$, la
      variable $y$ va desde $0$ hasta una tapa que cambia en $x=1$.

      | tramo | tapa de arriba |
      |---|---|
      | $0\le x\le1$ | la parábola $y=x^{2}$ |
      | $1\le x\le3$ | la recta $y=\frac{3-x}{2}$ |

      Y en $x=1$ las dos valen $1$, así que empalman sin dejar hueco:

      $$
      x^{2}\Big|_{1}=1,
      \qquad
      \frac{3-x}{2}\Big|_{1}=1
      $$

