      <figcaption>
      Los cuatro puntos donde h′ se anula: los dos ceros de y, en verde, y los dos
      cortes entre las curvas, en rojo. El máximo de y y el mínimo de y′ no cuentan.
      </figcaption>
      </figure>

      **b) El estudio de $h$.** Lo primero, derivar, y sacar factor común sin
      miedo:

      $$
      h\left(x\right)=e^{-4x}y^{4}\left(x\right)
      $$

      $$
      h'=-4e^{-4x}y^{4}+e^{-4x}\cdot 4y^{3}y'
      =\boxed{\;4e^{-4x}y^{3}\left(y'-y\right)\;}
      $$

      Y ahora lo bonito: **$e^{-4x}>0$ siempre**, así que el signo de $h'$ es el
      de $y^{3}\left(y'-y\right)$, o lo que es lo mismo:

      $$
      \operatorname{signo}\left(h'\right)
      =\operatorname{signo}\left(y\right)\cdot
      \operatorname{signo}\left(y'-y\right)
      $$

      Dos preguntas que se contestan **mirando el dibujo**: ¿dónde está $y$ por
      encima del eje?, y ¿dónde está $y'$ por encima de $y$?

      Llamando $c$ y $d$ a las dos abscisas donde las curvas se cortan, y $q$ al
      segundo cero de $y$:

      | tramo | signo de $y$ | signo de $y'-y$ | $h'$ | $h$ |
      |---|---|---|---|---|
      | $\left(a,0\right)$ | $-$ | $+$ | $-$ | decrece |
      | $\left(0,c\right)$ | $+$ | $+$ | $+$ | **crece** |
      | $\left(c,q\right)$ | $+$ | $-$ | $-$ | decrece |
      | $\left(q,d\right)$ | $-$ | $-$ | $+$ | **crece** |
      | $\left(d,b\right)$ | $-$ | $+$ | $-$ | decrece |

      $$
      \boxed{\;\text{mínimo en }0,\quad\text{máximo en }c,\quad
      \text{mínimo en }q,\quad\text{máximo en }d\;}
      $$

      **Los dos mínimos valen cero, y son absolutos.** Esto no lo pide el
      enunciado y es lo que más suma: como $h=e^{-4x}y^{4}$ y una cuarta potencia
      nunca es negativa,

      $$
      h\left(x\right)\ge 0\quad\text{para todo }x,
      \qquad
      h\left(0\right)=h\left(q\right)=0
      $$

      así que en los ceros de $y$ la función $h$ no solo tiene un mínimo
      relativo: **toca su valor mínimo posible**.

      **Y una advertencia sobre lo que NO son extremos.** El máximo de $y$ y el
      mínimo de $y'$ saltan a la vista en el dibujo y no pintan nada aquí: en
      $h'=4e^{-4x}y^{3}\left(y'-y\right)$ solo aparecen $y$ e $y'-y$. Que un punto
      sea llamativo en la figura no lo convierte en crítico para otra función.

  - id: ex1920-3-el-rectangulo-mas-grande-de-la-elipse
    titulo: El rectángulo más grande que cabe en una elipse
    fuente: >-
      Ejercicio 3 del PRIMER CUATRIMESTRAL · Convocatorias ordinaria y
      extraordinaria, mayo y junio de 2020 · Cálculo, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 8
      comp4: 1
    enunciado: |
      Sea la curva $\dfrac{x^{2}}{400}+\dfrac{y^{2}}{225}=1$. Se inscribe en la
      curva un rectángulo cuyos lados son paralelos a los ejes. Calcular las
      dimensiones del rectángulo de forma que su área sea máxima.
    pide: Las dimensiones del rectángulo de área máxima.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué cambio de variable ahorra casi toda la cuenta?
        opciones:
          - texto: >-
              El paramétrico $x=20\cos t$, $y=15\operatorname{sen}t$, que convierte
              el área en $600\operatorname{sen}2t$
            correcta: true
            mensaje: |
              Exacto. Con él la elipse se cumple sola, y el área queda como un seno:
              el máximo se ve sin derivar.
          - texto: >-
              Pasar a polares, $x=r\cos\theta$, $y=r\operatorname{sen}\theta$
            mensaje: |
              Las polares no simplifican una elipse: el radio depende del ángulo de
              una forma incómoda. Las que van bien son las **paramétricas**, con
              los semiejes puestos delante.
          - texto: >-
              Girar los ejes 45 grados
            mensaje: |
              El giro sirve cuando hay un término en $xy$. Aquí la elipse ya está
              en posición canónica.

      - tipo: calcular
        titulo: La base del rectángulo
        pregunta: |
          ¿Cuánto mide el lado horizontal del rectángulo de área máxima?
        respuesta:
          tipo: numero
          valor: '28.2842712'
          tolerancia: 0.01
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '14.1421356'
            mensaje: |
              $10\sqrt2$ es solo la **semi**base: la abscisa del vértice. El lado
              entero es el doble, porque el rectángulo va de $-x$ a $x$.
          - valor: '40'
            mensaje: |
              $40$ es el eje mayor entero. Un rectángulo con esa base tendría altura
              cero y área cero.
          - valor: '20'
            mensaje: |
              $20$ es el **semi**eje mayor, el valor de $a$. La base máxima es
              $a\sqrt2=20\sqrt2$.
        pista: |
          El vértice está en $x=\frac{a}{\sqrt2}$, y el lado mide $2x$.
        desarrollo: |
          $$
          x=\frac{a}{\sqrt2}=\frac{20}{\sqrt2}=10\sqrt2
          \;\Longrightarrow\;
          \text{base}=2x=20\sqrt2\approx28{,}2843
          $$

      - tipo: calcular
        titulo: El área máxima
        pregunta: |
          ¿Cuánto vale el área máxima?
        respuesta:
          tipo: numero
          valor: '600'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '942.4777'
            mensaje: |
              $\pi ab=300\pi$ es el área de la **elipse entera**. El rectángulo
              inscrito se queda en $600$, que es el $63{,}7\,\%$ de ella.
          - valor: '300'
            mensaje: |
              $300=ab$ es la mitad. El área máxima es $2ab$.
          - valor: '1200'
            mensaje: |
              $1200=4ab$ sería el rectángulo de lados $2a$ y $2b$, el que
              **circunscribe** a la elipse. El inscrito es justo la mitad de ese.
        pista: |
          Área $=4xy$ con $x=\frac{a}{\sqrt2}$ e $y=\frac{b}{\sqrt2}$.
        desarrollo: |
          $$
          A=4xy=4\cdot\frac{a}{\sqrt2}\cdot\frac{b}{\sqrt2}
          =4\cdot\frac{ab}{2}=2ab=2\cdot20\cdot15=600
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $x=20\cos t$, $y=15\operatorname{sen}t$ y
              $t\in\left(0,\frac{\pi}{2}\right)$, el área es
              $A=4xy=1200\cos t\operatorname{sen}t=600\operatorname{sen}2t$.
          - texto: >-
              $\operatorname{sen}2t$ vale como mucho $1$, y lo alcanza en
              $2t=\frac{\pi}{2}$, es decir $t=\frac{\pi}{4}$.
          - texto: >-
              Entonces $x=20\cos\frac{\pi}{4}=10\sqrt2$ e
              $y=15\operatorname{sen}\frac{\pi}{4}=\frac{15\sqrt2}{2}$, y los lados
              miden $20\sqrt2$ y $15\sqrt2$.
          - texto: >-
              El rectángulo de área máxima inscrito en una elipse es siempre un
              cuadrado, por simetría.
            trampa: true
            mensaje: |
              Solo lo es si la elipse es una circunferencia. Aquí los lados miden
              $20\sqrt2\approx28{,}28$ y $15\sqrt2\approx21{,}21$, y su cociente es
              $\frac{20}{15}=\frac43$ — exactamente la proporción de los semiejes.
              El rectángulo máximo **hereda la forma de la elipse**, y ese es el
              resultado bonito del ejercicio.
    resolucion: |
      **La elipse.** $\frac{x^{2}}{400}+\frac{y^{2}}{225}=1$ tiene semiejes

      $$
      a=\sqrt{400}=20,
      \qquad
      b=\sqrt{225}=15
      $$

      Un rectángulo inscrito con los lados paralelos a los ejes tiene sus cuatro
      vértices en $\left(\pm x,\pm y\right)$, así que sus lados miden $2x$ y $2y$
      y su área es

      $$
      A=4xy
      $$

      **El camino corto: parametrizar.** Con

      $$
      x=20\cos t,
      \qquad
      y=15\operatorname{sen}t,
      \qquad
      t\in\left(0,\tfrac{\pi}{2}\right)
      $$

      la ecuación de la elipse se cumple sola —es
      $\cos^{2}t+\operatorname{sen}^{2}t=1$— y el área queda

      $$
      A\left(t\right)=4\cdot20\cos t\cdot15\operatorname{sen}t
      =1200\cos t\operatorname{sen}t
      =600\operatorname{sen}2t
      $$

      Y aquí **no hace falta derivar**: el seno vale como mucho $1$, y lo alcanza
      cuando $2t=\frac{\pi}{2}$, o sea $t=\frac{\pi}{4}$.

      $$
      x=20\cos\tfrac{\pi}{4}=\frac{20}{\sqrt2}=10\sqrt2,
      \qquad
      y=15\operatorname{sen}\tfrac{\pi}{4}=\frac{15}{\sqrt2}=\frac{15\sqrt2}{2}
      $$

      $$
      \boxed{\;\text{lados }20\sqrt2\approx28{,}28
      \;\text{ y }\;15\sqrt2\approx21{,}21,
      \qquad A=600\;}
      $$

      **El camino largo, por si en el examen no sale el cambio.** Despejando
      $y=\frac{15}{20}\sqrt{400-x^{2}}$ y maximizando

      $$
      A\left(x\right)=4x\cdot\frac{15}{20}\sqrt{400-x^{2}}
      =3x\sqrt{400-x^{2}}
      $$

      Conviene maximizar $A^{2}=9x^{2}\left(400-x^{2}\right)$, que evita la raíz:

      $$
      \frac{d}{dx}\left(400x^{2}-x^{4}\right)=800x-4x^{3}=4x\left(200-x^{2}\right)=0
      \;\Longrightarrow\;
      x=\sqrt{200}=10\sqrt2
      $$

      El mismo punto. Y maximizar $A^{2}$ en vez de $A$ es legítimo porque $A>0$ y
      elevar al cuadrado conserva el orden entre positivos — es la clase de
      justificación que COMP 4 busca, aunque aquí solo valga un punto.

      **El resultado que merece un comentario.** Los lados son $a\sqrt2$ y
      $b\sqrt2$: el rectángulo máximo **tiene la misma proporción que la elipse**,
      $\frac{20}{15}=\frac43$. Y su área es

      $$
      A=2ab
      $$

      | figura | área |
      |---|---|
      | rectángulo circunscrito, de lados $2a$ y $2b$ | $4ab=1200$ |
      | **elipse** | $\pi ab\approx942{,}5$ |
      | **rectángulo inscrito máximo** | $2ab=600$ |

      El inscrito se queda con la mitad del circunscrito, y con el
      $\frac{2}{\pi}\approx63{,}7\,\%$ de la elipse. Los tres cocientes son los
      mismos que en la circunferencia, porque una elipse no es más que una
      circunferencia estirada y **el estiramiento multiplica todas las áreas por
      lo mismo**.

  - id: ex1920-4-la-recta-tangente-sin-calcular-la-integral
    titulo: La recta tangente sin calcular la integral
    fuente: >-
      Ejercicio 4 del PRIMER CUATRIMESTRAL · Convocatorias ordinaria y
      extraordinaria, mayo y junio de 2020 · Cálculo, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 6
      comp4: 2
    enunciado: |
      Sea la función
      $f\left(x\right)=3+\displaystyle\int_{0}^{x}\frac{1+\operatorname{sen}t}
      {2+t^{2}}\,dt$
      definida $\forall x\in\mathbb{R}$. Sin calcular la integral, hallar un
      polinomio de primer grado, $p\left(x\right)=a+b\,x$, que satisfaga
      $p\left(0\right)=f\left(0\right)$;
      $p'\left(0\right)=f'\left(0\right)$.
    pide: El polinomio de primer grado.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué permite derivar $f$ sin calcular la integral?
        opciones:
          - texto: >-
              El teorema fundamental del cálculo: si
              $F\left(x\right)=\int_{0}^{x}g$, con $g$ continua, entonces
              $F'=g$
            correcta: true
            mensaje: |
              Ese es todo el ejercicio. El enunciado dice «sin calcular la
              integral» precisamente porque quiere que se use el teorema y no una
              primitiva.
          - texto: >-
              La regla de Barrow
            mensaje: |
              Barrow es la otra mitad: sirve para **evaluar** una integral definida
              si ya conoces una primitiva. Aquí se necesita lo contrario: derivar
              una integral con extremo variable.
          - texto: >-
              La regla de L'Hôpital
            mensaje: |
              L'Hôpital resuelve indeterminaciones de cocientes. Aquí no hay
              ninguna indeterminación.

      - tipo: calcular
        titulo: El término independiente
        pregunta: |
          ¿Cuánto vale $f\left(0\right)$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3.5'
            mensaje: |
              $3{,}5$ mezcla $f\left(0\right)$ con $f'\left(0\right)$. La integral
              con los dos límites iguales vale **cero**, así que solo queda el $3$.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es $f'\left(0\right)$, la pendiente. El valor de la función
              es otro.
          - valor: '0'
            mensaje: |
              Cero es lo que vale la **integral** en $x=0$. Pero delante hay un $3$
              sumando.
        pista: |
          $\int_{0}^{0}$ de lo que sea vale cero.
        desarrollo: |
          $$
          f\left(0\right)=3+\int_{0}^{0}
          \frac{1+\operatorname{sen}t}{2+t^{2}}\,dt=3+0=3
          $$

          El $3$ está puesto en el enunciado justo para que la ordenada en el
          origen no sea cero y haya algo que calcular.

      - tipo: calcular
        titulo: La pendiente
        pregunta: |
          ¿Cuánto vale $f'\left(0\right)$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.0001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es solo el numerador en $t=0$. Falta dividir entre el denominador,
              que allí vale $2$.
          - valor: '0.25'
            mensaje: |
              $\frac14$ saldría con el denominador $4$. En $t=0$, $2+t^{2}=2$.
          - valor: '2'
            mensaje: |
              $2$ es el denominador. La fracción está del revés.
        pista: |
          $f'\left(x\right)=\frac{1+\operatorname{sen}x}{2+x^{2}}$, y se evalúa en
          $x=0$.
        desarrollo: |
          Por el teorema fundamental,

          $$
          f'\left(x\right)=\frac{1+\operatorname{sen}x}{2+x^{2}}
          \;\Longrightarrow\;
          f'\left(0\right)=\frac{1+0}{2+0}=\frac12
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El integrando $\frac{1+\operatorname{sen}t}{2+t^{2}}$ es continuo en
              todo $\mathbb{R}$, porque el denominador no se anula nunca.
          - texto: >-
              Entonces el teorema fundamental da
              $f'\left(x\right)=\frac{1+\operatorname{sen}x}{2+x^{2}}$, sin
              necesidad de conocer ninguna primitiva.
          - texto: >-
              Con $f\left(0\right)=3$ y $f'\left(0\right)=\frac12$ sale
              $p\left(x\right)=3+\frac{x}{2}$, que es la recta tangente a $f$ en el
              origen.
          - texto: >-
              Como $p$ y $f$ coinciden en valor y en derivada, $p\left(x\right)$
              aproxima a $f\left(x\right)$ con un error del orden de $x$.
            trampa: true
            mensaje: |
              El error es del orden de $x^{2}$, no de $x$, y esa es justamente la
              diferencia entre una recta cualquiera y **la** tangente. Se comprueba
              con números: en $x=0{,}1$ el error es $0{,}0024$ y en $x=0{,}2$ es
              $0{,}0092$ — se multiplica por cuatro al doblar $x$, no por dos.
    resolucion: |
      **Lo que pide el enunciado, traducido.** Un polinomio de primer grado que
      coincide con $f$ en valor y en derivada en $x=0$ **es la recta tangente** a
      la gráfica de $f$ en el origen, y también su polinomio de Taylor de orden
      $1$. Tres nombres para lo mismo, y decirlo ya es parte de la respuesta.

      **El término independiente sale de mirar los límites.** En $x=0$ la integral
      va de $0$ a $0$:

      $$
      f\left(0\right)=3+\int_{0}^{0}
      \frac{1+\operatorname{sen}t}{2+t^{2}}\,dt=3+0=3
      $$

      **La pendiente sale del teorema fundamental**, que es lo que el «sin
      calcular la integral» está pidiendo a gritos. El integrando

      $$
      g\left(t\right)=\frac{1+\operatorname{sen}t}{2+t^{2}}
      $$

      es continuo en todo $\mathbb{R}$ —el denominador $2+t^{2}\ge2$ no se anula
      nunca—, así que

      $$
      f'\left(x\right)=g\left(x\right)=\frac{1+\operatorname{sen}x}{2+x^{2}}
      $$

      $$
      f'\left(0\right)=\frac{1+\operatorname{sen}0}{2+0}=\frac12
      $$

      **El polinomio:**

      $$
      p\left(0\right)=a=3,
      \qquad
      p'\left(0\right)=b=\tfrac12
      $$

      $$
      \boxed{\;p\left(x\right)=3+\frac{x}{2}\;}
      $$

      **La hipótesis que hay que nombrar.** El teorema fundamental no se aplica
      porque sí: exige que el integrando sea **continuo**. Aquí lo es, y conviene
      escribir por qué —$2+t^{2}$ no se anula—, porque es la única línea de COMP 4
      que este ejercicio ofrece.

      **Cómo de buena es la aproximación**, medido:

      | $x$ | $f\left(x\right)$ | $p\left(x\right)$ | error |
      |---|---|---|---|
      | $0{,}05$ | $3{,}025614$ | $3{,}025$ | $0{,}00061$ |
      | $0{,}1$ | $3{,}052409$ | $3{,}05$ | $0{,}00241$ |
      | $0{,}2$ | $3{,}109210$ | $3{,}1$ | $0{,}00921$ |
      | $0{,}4$ | $3{,}232886$ | $3{,}2$ | $0{,}03289$ |

      **El error se multiplica por cuatro cada vez que $x$ se dobla**: va con
      $x^{2}$, como corresponde al resto de Taylor de orden uno. Eso es lo que
      distingue la tangente de cualquier otra recta que pase por
      $\left(0,3\right)$.

      **Y una comprobación que no cuesta nada.** $f$ es creciente en todo
      $\mathbb{R}$, porque $f'=\frac{1+\operatorname{sen}x}{2+x^{2}}\ge0$ —el
      numerador nunca es negativo—. Así que la recta $3+\frac{x}{2}$ tiene la
      pendiente positiva que le corresponde.

  - id: ex1920-5-el-perimetro-con-un-arco-de-parabola
    titulo: Un perímetro con un arco de parábola dentro
    fuente: >-
      Ejercicio 5 del PRIMER CUATRIMESTRAL · Convocatorias ordinaria y
      extraordinaria, mayo y junio de 2020 · Cálculo, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Calcular el perímetro del recinto limitado por las condiciones
      $x\ge0,\;y\ge0,\;y=4-x^{2}$.
    pide: El perímetro completo del recinto.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De cuántos trozos se compone el borde del recinto?
        opciones:
          - texto: >-
              Tres: un tramo del eje $X$, un tramo del eje $Y$ y el arco de
              parábola
            correcta: true
            mensaje: |
              Eso es. Las tres condiciones del enunciado son tres bordes, y el
              perímetro es la suma de los tres. Olvidar los dos rectos es el error
              más caro del ejercicio.
          - texto: >-
              Uno: solo el arco de parábola
            mensaje: |
              El arco solo va de $\left(0,4\right)$ a $\left(2,0\right)$: por sí
              solo no cierra ninguna región. Hacen falta los dos ejes para
              cerrarla.
          - texto: >-
              Dos: el arco de parábola y el segmento que une sus extremos
            mensaje: |
              Ese sería el recinto entre la parábola y la cuerda. Pero el enunciado
              dice $x\ge0$ e $y\ge0$: los bordes son los **ejes**, no la cuerda.

      - tipo: calcular
        titulo: Los dos lados rectos
        pregunta: |
          ¿Cuánto suman los dos tramos rectos del borde?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              $4$ es solo el tramo del eje $Y$, de $\left(0,0\right)$ a
              $\left(0,4\right)$. Falta el del eje $X$, que mide $2$.
          - valor: '2'
            mensaje: |
              $2$ es solo el tramo del eje $X$. La parábola corta ahí en $x=2$, y
              corta al eje $Y$ en $y=4$.
          - valor: '8'
            mensaje: |
              $8$ sale de contar dos veces alguno de los lados, o de tomar la
              parábola hasta $x=4$. Corta al eje $X$ donde $4-x^{2}=0$, o sea en
              $x=2$.
        pista: |
          La parábola corta a los ejes en $\left(2,0\right)$ y
          $\left(0,4\right)$.
        desarrollo: |
          $$
          y=0\;\Longrightarrow\;4-x^{2}=0\;\Longrightarrow\;x=2
          $$

          $$
          x=0\;\Longrightarrow\;y=4
          $$

          Los dos tramos rectos miden $2$ y $4$: en total $6$.

      - tipo: calcular
        titulo: El arco de parábola
        pregunta: |
          ¿Cuánto mide el arco de parábola?
        respuesta:
          tipo: numero
          valor: '4.6468'
          tolerancia: 0.01
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '4.4721'
            mensaje: |
              $2\sqrt5\approx4{,}472$ es la **cuerda**, la distancia en línea recta
              de $\left(0,4\right)$ a $\left(2,0\right)$. El arco es un poco más
              largo, como tiene que ser.
          - valor: '2'
            mensaje: |
              $2$ es la anchura del intervalo, $\int_{0}^{2}dx$. Falta el factor
              $\sqrt{1+y'^{2}}$.
          - valor: '5.3333'
            mensaje: |
              $\frac{16}{3}$ es el **área** bajo la parábola, no su longitud.
        pista: |
          $L=\int_{0}^{2}\sqrt{1+\left(y'\right)^{2}}\,dx$ con $y'=-2x$.
        desarrollo: |
          $$
          L=\int_{0}^{2}\sqrt{1+4x^{2}}\;dx
          =\left[\frac{x\sqrt{1+4x^{2}}}{2}
          +\frac14\ln\left(2x+\sqrt{1+4x^{2}}\right)\right]_{0}^{2}
          $$

          $$
          =\sqrt{17}+\frac14\ln\left(4+\sqrt{17}\right)
          \approx4{,}1231+0{,}5237=4{,}6468
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La parábola corta a los ejes en $\left(2,0\right)$ y
              $\left(0,4\right)$, así que el recinto es el trozo del primer
              cuadrante que queda por debajo de ella.
          - texto: >-
              Los dos lados rectos suman $2+4=6$.
          - texto: >-
              El arco es
              $\int_{0}^{2}\sqrt{1+4x^{2}}\,dx
              =\sqrt{17}+\frac14\ln\left(4+\sqrt{17}\right)\approx4{,}6468$.
          - texto: >-
              Como la longitud de arco se calcula con una integral, el resultado
              coincide con el área encerrada bajo la curva.
            trampa: true
            mensaje: |
              Que las dos se calculen con una integral no las hace la misma cosa, ni
              siquiera la misma clase de cosa: el área bajo esta parábola vale
              $\frac{16}{3}\approx5{,}33$ y el arco $4{,}65$, y además una se mide
              en unidades cuadradas y la otra en unidades lineales. El integrando es
              distinto: $y$ frente a $\sqrt{1+y'^{2}}$.
    resolucion: |
      **El recinto, antes que nada.** Las tres condiciones dibujan el trozo del
      primer cuadrante que queda por debajo de la parábola:

      $$
      y=0\;\Longrightarrow\;x=2,
      \qquad
      x=0\;\Longrightarrow\;y=4
      $$

