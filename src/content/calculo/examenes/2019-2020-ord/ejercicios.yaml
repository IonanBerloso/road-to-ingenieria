        <g class="arc20-n">
          <text x="318" y="163" text-anchor="end">Re</text>
          <text x="238" y="22">Im</text>
          <text x="154" y="164" text-anchor="middle">−3</text>
        </g>
        <g class="arc20-l">
          <text x="241" y="64" fill="var(--flag)">3i</text>
          <text x="241" y="242" fill="var(--flag)">−3i</text>
          <text x="91.6" y="111.6" text-anchor="middle" fill="var(--alt)">3√2</text>
          <text x="29.2" y="38.8" fill="var(--live)">el arco que vale: x &lt; 0</text>
          <text x="320" y="262.4" text-anchor="end" fill="var(--faint)">aquí el argumento</text>
          <text x="320" y="280.6" text-anchor="end" fill="var(--faint)">vale +3π/4</text>
        </g>
      </svg>
      <figcaption>
      La circunferencia pasa por 3i y por −3i, como tenía que pasar. Solo vale el
      arco de la izquierda: en el otro el argumento sale +3π/4 en vez de −π/4.
      </figcaption>
      </figure>

      **Y el conjugado, que es la trampa del enunciado.** Todo lo anterior es el
      lugar de $\overline{z}$. El de $z$ sería su simétrico respecto del eje
      **real**... pero tanto la circunferencia como la condición $x<0$ ya son
      simétricas respecto de ese eje. Así que **el conjunto no cambia**: la
      respuesta es la misma con $z$ o con $\overline{z}$.

      Decirlo es lo que separa un ejercicio bien hecho de uno bien resuelto. Y
      conviene decirlo con la razón, no solo con el resultado: la simetría existe
      porque los dos puntos $\pm3i$ son conjugados entre sí, y conjugar el plano
      los intercambia sin mover el par.

      **Comprobación con un punto.** El más cómodo es el extremo izquierdo,
      $x=-3-3\sqrt2\approx-7{,}243$, $y=0$:

      $$
      \frac{-7{,}243+3i}{-7{,}243-3i}
      $$

      Numerador y denominador son conjugados, así que el cociente tiene módulo $1$
      y argumento el doble del numerador: $2\left(\pi-0{,}3927\right)=5{,}498$, que
      restando $2\pi$ da $-0{,}7854=-\frac{\pi}{4}$ ✓.

  - id: ex1920-2-cual-de-las-dos-graficas-es-la-derivada
    titulo: Cuál de las dos gráficas es la derivada
    fuente: >-
      Ejercicio 2 del PRIMER CUATRIMESTRAL · Convocatorias ordinaria y
      extraordinaria, mayo y junio de 2020 · Cálculo, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU) · La figura está redibujada en SVG a partir del original
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 4
      comp4: 5
    enunciado: |
      La figura muestra las gráficas de las funciones $y\left(x\right)$ e
      $y'\left(x\right)$ definidas en $\left(a,b\right)$.

