ejercicios:
  - id: ex2526-3ev-1-medio-disco
    titulo: Un disco partido justo por su centro
    fuente: >-
      Ejercicio 1 · Tercera evaluación, 19 de enero de 2026 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3

    nivel: examen
    enunciado: |
      Calcular y representar geométricamente los afijos de los números
      complejos $z$ que verifican las condiciones

      $$
      \left|z^{2}\right| < 2\left(\mathrm{Re}(z)-\mathrm{Im}(z)\right)
      \qquad \wedge \qquad
      \frac{z+\overline{z}}{2} \ge \mathrm{Im}(z)+2
      $$
    pide: Calcular la región y representarla.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué conviene hacer con $\left|z^{2}\right|$ antes de operar?
        opciones:
          - texto: >-
              Escribirlo como $\left|z\right|^{2} = x^{2}+y^{2}$
            correcta: true
            mensaje: |
              Exacto. El módulo es multiplicativo, así que
              $\left|z^{2}\right| = \left|z\right|^{2}$, y eso es
              $x^{2}+y^{2}$: un polinomio limpio. Desarrollar $z^{2}$ en
              binómica y tomar módulo después daría una raíz innecesaria.
          - texto: >-
              Desarrollar $z^{2} = x^{2}-y^{2}+2xyi$ y tomar el módulo
            mensaje: |
              Funciona, pero obliga a manejar
              $\sqrt{\left(x^{2}-y^{2}\right)^{2}+4x^{2}y^{2}}$ — que al
              simplificar da $x^{2}+y^{2}$, así que es el camino largo hacia lo
              mismo.
          - texto: >-
              Sustituirlo por $z\overline{z}$
            mensaje: |
              $z\overline{z} = \left|z\right|^{2}$, que es correcto pero es solo
              la mitad: falta el cuadrado del enunciado.
          - texto: Dejarlo como está
            mensaje: |
              Con un módulo sin desarrollar no se puede identificar la curva.

      - tipo: calcular
        titulo: El radio de la circunferencia
        pregunta: |
          La primera condición define un disco. ¿Cuál es su radio?
        respuesta:
          tipo: numero
          valor: '1.4142'
          tolerancia: 0.0005
          formato: en forma exacta, o un número con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              2 es el coeficiente del segundo miembro, no el radio. Al completar
              cuadrados sale $(x-1)^{2}+(y+1)^{2} < 2$, y el radio es
              $\sqrt2$.
          - valor: '1'
            mensaje: |
              1 es la coordenada del centro, no el radio.
          - valor: '4'
            mensaje: |
              4 saldría de $2^{2}$. El término independiente tras completar
              cuadrados es 2, no 4.
        pista: |
          $x^{2}+y^{2} < 2x-2y$. Pasa todo a un lado y completa cuadrados.
        desarrollo: |
          $$
          \left|z^{2}\right| = \left|z\right|^{2} = x^{2}+y^{2}
          $$

          $$
          x^{2}+y^{2} < 2(x-y)
          \;\Longrightarrow\;
          x^{2}-2x+y^{2}+2y < 0
          $$

          Completando cuadrados:

          $$
          (x-1)^{2}-1+(y+1)^{2}-1 < 0
          $$

          $$
          (x-1)^{2}+(y+1)^{2} < 2
          $$

          **Disco abierto** de centro $(1,-1)$ y radio $\sqrt2 \approx 1{,}4142$.
        veredicto: |
          El signo $<$ estricto deja fuera la circunferencia: es el **interior**
          del disco, sin borde. Conviene decirlo.

      - tipo: calcular
        titulo: El área de la región
        pregunta: |
          ¿Cuál es el área de la región resultante? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '3.1416'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '6.2832'
            mensaje: |
              $2\pi$ es el área del **disco entero**. La segunda condición se
              queda con la mitad.
          - valor: '1.5708'
            mensaje: |
              $\frac{\pi}{2}$ es un cuarto del disco. La recta lo parte por la
              mitad, no en cuartos.
          - valor: '4.4429'
            mensaje: |
              $\pi\sqrt2$ mezcla el área con el radio. El área del disco es
              $\pi r^{2} = 2\pi$, y la mitad es $\pi$.
        pista: |
          ¿Por dónde pasa la recta $y = x-2$ respecto del centro $(1,-1)$?
        desarrollo: |
          La segunda condición, con
          $\frac{z+\overline{z}}{2} = x$:

          $$
          x \ge y+2
          \;\Longrightarrow\;
          y \le x-2
          $$

          Semiplano **por debajo** de la recta $y = x-2$.

          **¿Dónde queda el centro del disco?** En $(1,-1)$:

          $$
          -1 \le 1-2 = -1 \quad\checkmark
          $$

          Se cumple con **igualdad**: la recta pasa **exactamente por el
          centro**. Luego la corta en dos mitades iguales.

          $$
          \text{Área} = \frac{\pi r^{2}}{2} = \frac{\pi\cdot2}{2} = \pi
          \approx 3{,}1416
          $$
        veredicto: |
          Que la recta pase por el centro no es casualidad del enunciado: está
          construido así para que la región sea exactamente medio disco y el
          área salga redonda.

      - tipo: verificar
        pregunta: |
          Escribe las dos condiciones en $x$ e $y$. La figura comprobará si el trozo
          de disco que queda coincide con el del enunciado.
        condicion: '|z^2| < 2*(re(z)-im(z)) & (z+conj(z))/2 >= im(z)+2'
        ventana:
          x: [-1, 4]
          y: [-4, 2]
        formato: en x e y; usa & para juntar las dos condiciones
        pista: |
          Dos traducciones que hay que ver sin pensar: $\left|z^{2}\right| =
          \left|z\right|^{2} = x^{2}+y^{2}$, y $\frac{z+\overline{z}}{2}$ es la parte
          real disfrazada.
        desarrollo: |
          La primera condición, con $\left|z^{2}\right| = x^{2}+y^{2}$:

          $$
          x^{2}+y^{2} < 2(x-y)
          \;\Longrightarrow\;
          x^{2}-2x+y^{2}+2y < 0
          $$

          Y completando cuadrados en las dos variables:

          $$
          (x-1)^{2}+(y+1)^{2} < 2
          $$

          La segunda es $\operatorname{Re}(z) \ge \operatorname{Im}(z)+2$, es decir

          $$
          x \ge y+2
          $$
        veredicto: |
          El **trozo de disco** que la recta $x = y+2$ deja a su derecha. La recta
          pasa justo por el centro $(1,-1)$, así que corta el disco por la mitad: es
          medio disco, con el borde recto incluido y el curvo no.
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Traducir la primera condición.**
              $\left|z^{2}\right| = \left|z\right|^{2} = x^{2}+y^{2}$, y
              $\mathrm{Re}(z)-\mathrm{Im}(z) = x-y$.
          - texto: |
              Completando cuadrados:
              $(x-1)^{2}+(y+1)^{2} < 2$. Disco **abierto** de centro
              $(1,-1)$ y radio $\sqrt2$.
          - texto: |
              **Traducir la segunda.**
              $\frac{z+\overline{z}}{2} = \mathrm{Re}(z) = x$, luego
              $x \ge y+2$, es decir $y \le x-2$: semiplano **cerrado**.
          - texto: |
              **Ver dónde cae el centro.** En $(1,-1)$ la recta se cumple con
              igualdad: pasa justo por el centro del disco.
          - texto: |
              Luego la región es **medio disco**, el de abajo a la derecha, con
              el diámetro incluido y el arco excluido. Área $=\pi$.
          - texto: |
              Como el disco es abierto y el semiplano cerrado, la región
              resultante es abierta.
            trampa: true
            mensaje: |
              La región no es abierta **ni** cerrada: le falta el arco —que
              viene del disco abierto— pero **sí** incluye el diámetro, que
              viene del semiplano cerrado. Al intersecar, cada borde conserva su
              carácter. Decir «abierta» a secas se salta la mitad de la
              descripción, y esa precisión es lo que puntúa COMP4.
        veredicto: |
          Los dos signos del enunciado son distintos a propósito: uno estricto y
          otro no. La frontera resultante es mixta, y describirla bien es parte
          del ejercicio.

    resolucion: |
      **Datos.** Dos condiciones sobre $z$: una con el módulo al cuadrado y otra
      con la parte real.

      ### 1 · La primera condición

      El módulo es multiplicativo, así que conviene simplificar **antes** de
      pasar a binómica:

      $$
      \left|z^{2}\right| = \left|z\right|^{2} = x^{2}+y^{2}
      $$

      Desarrollar $z^{2} = x^{2}-y^{2}+2xyi$ y tomar módulo después llevaría a

      $$
      \sqrt{\left(x^{2}-y^{2}\right)^{2}+4x^{2}y^{2}}
      = \sqrt{\left(x^{2}+y^{2}\right)^{2}} = x^{2}+y^{2}
      $$

      lo mismo, dando un rodeo.

      Con $\mathrm{Re}(z)-\mathrm{Im}(z) = x-y$:

      $$
      x^{2}+y^{2} < 2(x-y)
      \;\Longrightarrow\;
      x^{2}-2x+y^{2}+2y < 0
      $$

      Completando cuadrados en las dos variables:

      $$
      (x-1)^{2}+(y+1)^{2} < 2
      $$

      $$
      \boxed{\text{Disco ABIERTO de centro } (1,-1) \text{ y radio } \sqrt2}
      $$

      ### 2 · La segunda condición

      $$
      \frac{z+\overline{z}}{2} = \frac{(x+yi)+(x-yi)}{2} = x
      = \mathrm{Re}(z)
      $$

      —una identidad que conviene reconocer de memoria—. La condición queda

      $$
      x \ge y+2
      \;\Longrightarrow\;
      y \le x-2
      $$

      $$
      \boxed{\text{Semiplano CERRADO bajo la recta } y = x-2}
      $$

      ### 3 · Cómo encajan

      La pregunta clave: **¿por dónde pasa la recta respecto del disco?**

      Sustituyendo el centro $(1,-1)$ en la recta:

      $$
      -1 \overset{?}{=} 1-2 = -1 \quad\checkmark
      $$

      **La recta pasa exactamente por el centro.** Así que corta al disco en dos
      mitades iguales, y la región es una de ellas.

      Los extremos del diámetro son el centro $\pm\sqrt2$ en la dirección
      $\frac{(1,1)}{\sqrt2}$:

      $$
      (1,-1)\pm(1,1)
      \;\Longrightarrow\;
      (2,0) \ \text{ y } \ (0,-2)
      $$

      $$
      \boxed{\text{La región es el SEMIDISCO inferior derecho}}
      $$

      ### 4 · El borde, que no es homogéneo

      | parte de la frontera | ¿está incluida? | por qué |
      |---|---|---|
      | el **arco** de circunferencia | **no** | el disco es abierto ($<$) |
      | el **diámetro** sobre la recta | **sí** | el semiplano es cerrado ($\ge$) |

      La región no es abierta ni cerrada. Los dos signos del enunciado son
      distintos a propósito, y describirlo bien es lo que puntúa.

      ### 5 · El área

      $$
      A = \frac{\pi r^{2}}{2} = \frac{\pi\left(\sqrt2\right)^{2}}{2}
      = \frac{2\pi}{2}
      $$

      $$
      \boxed{A = \pi \approx 3{,}1416}
      $$

      ### 6 · Comprobación

      **Con un punto interior.** El centro $(1,-1)$, es decir $z = 1-i$:

      $$
      \left|z^{2}\right| = \left|z\right|^{2} = 1+1 = 2
      $$

      $$
      2\left(\mathrm{Re}-\mathrm{Im}\right) = 2\left(1-(-1)\right) = 4
      $$

      $2 < 4$ ✔ Y la segunda: $1 \ge -1+2 = 1$ ✔ con igualdad, porque está
      sobre la recta.

      **Con un punto que debe quedar fuera.** $z = 1+i$, simétrico respecto de
      la recta:

      $$
      \left|z\right|^{2} = 2, \qquad 2(1-1) = 0
      $$

      $2 < 0$ es falso ✔ fuera del disco, y además del semiplano.

      **Con un punto del semidisco.** $z = 1{,}5-1{,}5i$:

      $$
      \left|z\right|^{2} = 4{,}5,
      \qquad
      2(1{,}5+1{,}5) = 6
      $$

      $4{,}5 < 6$ ✔ Y $1{,}5 \ge -1{,}5+2 = 0{,}5$ ✔ Dentro.

  - id: ex2526-3ev-2-hipergeometricas
    titulo: Series hipergeométricas, y unos cilindros que no convergen
    fuente: >-
      Ejercicio 2 · Tercera evaluación, 19 de enero de 2026 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 2
      comp2: 6
      comp4: 2

    nivel: examen
    enunciado: |
      Una serie $\sum_{n=1}^{\infty}a_n$ de términos positivos se llama
      **hipergeométrica** si existen números reales $\alpha,\beta,\gamma$ tales
      que $\alpha$ y $\gamma$ no son nulos a la vez, y que verifican la
      condición

      $$
      \frac{a_{n+1}}{a_n} = \frac{\alpha n+\beta}{\alpha n+\gamma}
      $$

      Si $\alpha+\beta \ge \gamma$ la serie es divergente; si
      $\alpha+\beta < \gamma$ la serie es convergente y su suma es igual al
      límite de la sucesión

      $$
      \left\{\frac{a_n\left(\alpha n+\beta\right)-a_1\gamma}
      {\alpha+\beta-\gamma}\right\}_{n\in\mathbb{N}}
      $$

      Empleando este resultado:

      **a)** Demostrar que la serie
      $\displaystyle\sum_{n=1}^{\infty}\frac{1}{(2n-1)(2n+1)(2n+3)}$ es
      hipergeométrica y convergente, y calcular su suma.

      **b)** Demostrar que la serie
      $\displaystyle\sum_{n=1}^{\infty}\frac{1}{n}$ es hipergeométrica y
      divergente.

      **c)** Para cada $n \in \mathbb{N}$, formamos cilindros circulares con
      radio de la base igual a $1/n$ y altura igual a $n$. Si vamos sumando los
      volúmenes de estos cilindros, ¿obtenemos una serie convergente? ¿Cuál será
      su suma?
    pide: Resolver los tres apartados con el criterio dado.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que hacer para identificar $\alpha$, $\beta$ y $\gamma$?
        opciones:
          - texto: >-
              Calcular el cociente $\dfrac{a_{n+1}}{a_n}$, **simplificarlo**, y
              comparar con la forma $\dfrac{\alpha n+\beta}{\alpha n+\gamma}$
            correcta: true
            mensaje: |
              Exacto. Y el detalle que decide: numerador y denominador deben
              tener **el mismo coeficiente $\alpha$** en $n$. Si tras
              simplificar no lo tienen, la serie no es hipergeométrica en esa
              forma y hay que revisar la simplificación.
          - texto: >-
              Calcular el límite de $a_n$
            mensaje: |
              El límite del término general dice si la serie **puede**
              converger, pero no da los parámetros. El criterio se basa en el
              cociente entre términos consecutivos.
          - texto: >-
              Descomponer $a_n$ en fracciones simples
            mensaje: |
              Eso serviría para sumar la serie telescópicamente —y es una
              comprobación excelente— pero el enunciado pide usar **este**
              resultado.
          - texto: >-
              Aplicar el criterio del cociente de d'Alembert
            mensaje: |
              El cociente aquí tiende a 1, así que d'Alembert no decide. Ese es
              justamente el hueco que cubre el criterio hipergeométrico.

      - tipo: calcular
        titulo: El parámetro gamma del apartado (a)
        pregunta: |
          Para la serie de (a), ¿cuánto vale $\gamma$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              3 es el término independiente del **tercer** factor del
              denominador de $a_n$. Tras simplificar, el cociente queda
              $\frac{2n-1}{2n+5}$, así que $\gamma = 5$.
          - valor: '-1'
            mensaje: |
              $-1$ es $\beta$, el del numerador.
          - valor: '2'
            mensaje: |
              2 es $\alpha$, el coeficiente de $n$ en los dos.
        pista: |
          $\frac{a_{n+1}}{a_n} = \frac{(2n-1)(2n+1)(2n+3)}
          {(2n+1)(2n+3)(2n+5)}$. Simplifica.
        desarrollo: |
          $$
          a_n = \frac{1}{(2n-1)(2n+1)(2n+3)},
          \qquad
          a_{n+1} = \frac{1}{(2n+1)(2n+3)(2n+5)}
          $$

          $$
          \frac{a_{n+1}}{a_n}
          = \frac{(2n-1)(2n+1)(2n+3)}{(2n+1)(2n+3)(2n+5)}
          = \frac{2n-1}{2n+5}
          $$

          **Dos factores se cancelan**, y queda exactamente la forma pedida:

          $$
          \alpha = 2, \qquad \beta = -1, \qquad \gamma = 5
          $$

          Y el criterio: $\alpha+\beta = 1 < 5 = \gamma$, luego **converge**.
        veredicto: |
          Que los tres factores estén «desplazados de dos en dos» es lo que hace
          que la cancelación sea tan limpia. El enunciado está construido para
          eso.

      - tipo: calcular
        titulo: La suma de la serie
        pregunta: |
          ¿Cuánto vale la suma de la serie del apartado (a)?
        respuesta:
          tipo: numero
          valor: '0.0833'
          tolerancia: 0.0005
          formato: en forma exacta, o un número con cuatro decimales
        distractores:
          - valor: '0.0667'
            mensaje: |
              $\frac{1}{15}$ es $a_1$, el primer término. La suma es algo mayor,
              porque los demás términos también aportan.
          - valor: '0.125'
            mensaje: |
              $\frac18$ es el coeficiente $A$ de la descomposición en fracciones
              simples, no la suma.
          - valor: '0.3333'
            mensaje: |
              $\frac13$ es $a_1\gamma = \frac{5}{15}$, un paso intermedio. Falta
              dividir entre $\alpha+\beta-\gamma = -4$.
        pista: |
          $a_n(\alpha n+\beta) = \frac{1}{(2n+1)(2n+3)} \to 0$, y
          $a_1 = \frac{1}{15}$.
        desarrollo: |
          La fórmula del enunciado:

          $$
          S = \lim_{n\to\infty}
          \frac{a_n\left(\alpha n+\beta\right)-a_1\gamma}
          {\alpha+\beta-\gamma}
          $$

          **El primer término se anula:**

          $$
          a_n(2n-1) = \frac{2n-1}{(2n-1)(2n+1)(2n+3)}
          = \frac{1}{(2n+1)(2n+3)} \xrightarrow[n\to\infty]{} 0
          $$

          **Y el resto:** $a_1 = \frac{1}{1\cdot3\cdot5} = \frac{1}{15}$, con
          $\gamma=5$ y $\alpha+\beta-\gamma = 2-1-5 = -4$:

          $$
          S = \frac{0-\frac{5}{15}}{-4} = \frac{-\frac13}{-4} = \frac{1}{12}
          \approx 0{,}0833
          $$
        veredicto: |
          El doble signo negativo —numerador y denominador— es lo que hace que
          la suma salga positiva, como debe ser en una serie de términos
          positivos. Buena comprobación rápida.

      - tipo: justificar
        pregunta: |
          Ordena los apartados (b) y (c). Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **(b)** Con $a_n = \frac1n$:
              $\frac{a_{n+1}}{a_n} = \frac{n}{n+1}
              = \frac{1\cdot n+0}{1\cdot n+1}$, luego
              $\alpha=1$, $\beta=0$, $\gamma=1$.
          - texto: |
              Es hipergeométrica —$\alpha$ y $\gamma$ no son nulos a la vez— y
              como $\alpha+\beta = 1 \ge 1 = \gamma$, **diverge**.
          - texto: |
              **(c)** El volumen del cilindro $n$-ésimo es
              $V_n = \pi r^{2}h = \pi\left(\frac1n\right)^{2}n
              = \frac{\pi}{n}$.
          - texto: |
              Luego $\sum V_n = \pi\sum\frac1n$: la **misma serie** del apartado
              (b), multiplicada por una constante.
          - texto: |
              Y multiplicar por una constante no nula no cambia el carácter:
              la serie **diverge** y no tiene suma finita.
          - texto: |
              Los volúmenes tienden a cero, así que la suma de todos ellos es
              finita.
            trampa: true
            mensaje: |
              Que el término general tienda a cero es **necesario** para
              converger, pero no suficiente — y la serie armónica es el
              contraejemplo de manual. Los cilindros son cada vez más finos y su
              volumen tiende a 0, y aun así la suma se va a infinito. El
              apartado (c) existe precisamente para poner ese error delante.
        veredicto: |
          Los tres apartados están encadenados: (b) prepara (c), y (c) es la
          serie armónica disfrazada de geometría.

    resolucion: |
      **Datos.** El criterio de las series hipergeométricas, y tres series a las
      que aplicarlo.

      ### 1 · Cómo se usa el criterio

      Hay que calcular $\frac{a_{n+1}}{a_n}$, **simplificarlo**, y comprobar que
      queda de la forma

      $$
      \frac{\alpha n+\beta}{\alpha n+\gamma}
      $$

      **con el mismo $\alpha$ arriba y abajo**. Ese detalle es lo que define
      «hipergeométrica»: los dos polinomios tienen que ser de grado 1 y con
      idéntico coeficiente principal.

      Luego el carácter lo decide comparar $\alpha+\beta$ con $\gamma$.

      ### 2 · Apartado (a)

      $$
      a_n = \frac{1}{(2n-1)(2n+1)(2n+3)}
      $$

      Sustituyendo $n$ por $n+1$, cada factor se desplaza:

      $$
      a_{n+1} = \frac{1}{(2n+1)(2n+3)(2n+5)}
      $$

      $$
      \frac{a_{n+1}}{a_n} = \frac{(2n-1)\cancel{(2n+1)(2n+3)}}
      {\cancel{(2n+1)(2n+3)}(2n+5)} = \frac{2n-1}{2n+5}
      $$

      $$
      \alpha = 2, \qquad \beta = -1, \qquad \gamma = 5
      $$

      **El carácter:**

      $$
      \alpha+\beta = 1 < 5 = \gamma
      \;\Longrightarrow\;
      \text{CONVERGE}
      $$

      **La suma**, con la fórmula del enunciado:

      $$
      a_n(2n-1) = \frac{1}{(2n+1)(2n+3)} \xrightarrow[n\to\infty]{} 0
      $$

      $$
      a_1 = \frac{1}{1\cdot3\cdot5} = \frac{1}{15},
      \qquad
      \alpha+\beta-\gamma = -4
      $$

      $$
      S = \frac{0-\frac{5}{15}}{-4} = \frac{-\frac13}{-4}
      $$

      $$
      \boxed{S = \frac{1}{12}}
      $$

      ### 3 · Apartado (b)

      $$
      a_n = \frac1n
      \;\Longrightarrow\;
      \frac{a_{n+1}}{a_n} = \frac{1/(n+1)}{1/n} = \frac{n}{n+1}
      $$

      Escrito en la forma pedida:

      $$
      \frac{n}{n+1} = \frac{1\cdot n+0}{1\cdot n+1}
      \;\Longrightarrow\;
      \alpha=1,\ \beta=0,\ \gamma=1
      $$

      $\alpha$ y $\gamma$ no son nulos a la vez, así que **es
      hipergeométrica**. Y

      $$
      \alpha+\beta = 1 \ge 1 = \gamma
      \;\Longrightarrow\;
      \boxed{\text{DIVERGE}}
      $$

      Es la **serie armónica**, y el criterio la clasifica en el caso frontera
      —con igualdad—, que es exactamente donde otros criterios fallan.

      ### 4 · Apartado (c)

      El cilindro $n$-ésimo tiene radio $\frac1n$ y altura $n$:

      $$
      V_n = \pi r^{2}h = \pi\left(\frac1n\right)^{2}\cdot n
      = \frac{\pi}{n}
      $$

      $$
      \sum_{n=1}^{\infty}V_n = \pi\sum_{n=1}^{\infty}\frac1n
      $$

      **Es la serie del apartado (b)** multiplicada por $\pi$. Y multiplicar por
      una constante no nula no cambia el carácter:

      $$
      \boxed{\text{La serie DIVERGE: no hay suma finita}}
      $$

      ### 5 · Lo que enseña el apartado (c)

      Los cilindros son cada vez **más finos**:

      | $n$ | radio | volumen |
      |---|---|---|
      | 1 | $1$ | $\pi$ |
      | 10 | $0{,}1$ | $0{,}314$ |
      | 100 | $0{,}01$ | $0{,}0314$ |

      El volumen tiende a cero, y aun así **la suma se va a infinito**. Es la
      trampa clásica: que el término general tienda a 0 es condición
      **necesaria** para converger, no suficiente.

      Y la razón es que $\frac{\pi}{n}$ decrece **demasiado despacio**. Si los
      cilindros tuvieran altura $n$ pero radio $\frac{1}{n}$ elevado a algo más,
      digamos $V_n = \frac{\pi}{n^{2}}$, la suma sí sería finita
      —$\frac{\pi^{3}}{6}$—.

      ### 6 · Comprobación del apartado (a) por otra vía

      La suma se puede obtener **telescópicamente**, sin el criterio, y eso
      valida el resultado. Descomponiendo en fracciones simples:

      $$
      \frac{1}{(2n-1)(2n+1)(2n+3)}
      = \frac{1/8}{2n-1}-\frac{1/4}{2n+1}+\frac{1/8}{2n+3}
      $$

      Al sumar desde $n=1$, cada denominador impar aparece hasta tres veces con
      coeficientes $\frac18$, $-\frac14$ y $\frac18$, que **suman cero**. Solo
      sobreviven los términos del principio:

      $$
      S = \frac18\cdot\frac11+\left(\frac18-\frac14\right)\frac13
      = \frac18-\frac{1}{24} = \frac{3-1}{24} = \frac{1}{12} \quad\checkmark
      $$

      **Numéricamente**, sumando los cinco primeros términos:

      $$
      \frac{1}{15}+\frac{1}{105}+\frac{1}{315}+\frac{1}{693}+\frac{1}{1287}
      = 0{,}0816
      $$

      que ya se acerca a $\frac{1}{12} = 0{,}0833$ ✔

  - id: ex2526-3ev-3-satelite
    titulo: Desde dónde debe salir el satélite
    fuente: >-
      Ejercicio 3 · Tercera evaluación, 19 de enero de 2026 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    nivel: examen
    enunciado: |
      Se ha lanzado un satélite espacial siguiendo la órbita descrita por la
      parábola $\left(\dfrac{x}{3}\right)^{2}+\dfrac{y}{9} = 1$. En un momento
      dado, se desea que el satélite abandone su órbita y se dirija hacia una
      estación espacial situada en el punto $P = (3,1)$. Para ello, el satélite
      debe salir en la dirección de la recta tangente a la órbita en el punto de
      salida. Determinar el o los puntos de la órbita desde los cuales el
      satélite debe salir para que la recta tangente pase por la estación
      espacial.
    pide: Determinar los puntos de salida.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué se busca exactamente?
        opciones:
          - texto: >-
              Los puntos de la órbita cuya **tangente pasa por $P$** — y $P$
              **no** está en la órbita
            correcta: true
            mensaje: |
              Exacto, y comprobar que $P$ no está en la curva es el primer paso:
              $\frac{9}{9}+\frac19 = 1{,}11 \neq 1$. Si estuviera, la respuesta
              sería trivial —el propio $P$—. Como no lo está, hay que buscar los
              puntos desde los que «se ve» $P$ en la dirección tangente.
          - texto: >-
              El punto de la órbita más cercano a $P$
            mensaje: |
              Eso sería un problema de distancia mínima. Aquí lo que se impone
              es que la **tangente** pase por $P$, que es otra cosa.
          - texto: >-
              La tangente a la órbita en $P$
            mensaje: |
              $P$ no está sobre la órbita, así que no hay tangente «en $P$».
          - texto: >-
              Dónde corta la órbita a la recta que pasa por $P$
            mensaje: |
              No hay una recta dada: hay que encontrarla, y la condición es de
              tangencia.

      - tipo: calcular
        titulo: La órbita, despejada
        pregunta: |
          ¿Cuánto vale $y$ cuando $x=0$?
        respuesta:
          tipo: numero
          valor: '9'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              3 es el 3 del denominador de $x$. Despejando,
              $y = 9\left(1-\frac{x^{2}}{9}\right) = 9-x^{2}$, y en $x=0$ vale
              9.
          - valor: '1'
            mensaje: |
              1 es el segundo miembro de la ecuación, no el valor de $y$.
          - valor: '81'
            mensaje: |
              81 saldría de elevar el 9 al cuadrado. La $y$ del enunciado no
              está elevada: por eso es una **parábola** y no una elipse.
        pista: |
          $\left(\frac x3\right)^{2}+\frac y9 = 1$. Despeja $y$.
        desarrollo: |
          $$
          \frac{x^{2}}{9}+\frac{y}{9} = 1
          \;\Longrightarrow\;
          x^{2}+y = 9
          \;\Longrightarrow\;
          y = 9-x^{2}
          $$

          **Es una parábola**, no una elipse: la $y$ aparece **sin elevar al
          cuadrado**. El enunciado lo dice, y conviene fijarse porque la
          notación con los dos denominadores invita a leer una elipse.

          En $x=0$: $y = 9$, el vértice.
        veredicto: |
          Parábola invertida con vértice en $(0,9)$ y cortes con el eje en
          $x=\pm3$. El satélite recorre un arco descendente.

      - tipo: calcular
        titulo: Los puntos de salida
        pregunta: |
          Hay dos puntos válidos. ¿Cuál es la abscisa del que está más a la
          derecha?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es la abscisa del **otro** punto, el de la izquierda. Los dos
              son válidos, pero el de más a la derecha es $a=4$.
          - valor: '3'
            mensaje: |
              3 es la abscisa de la estación $P$, y también donde la órbita
              corta el eje. Pero la tangente ahí no pasa por $P$.
          - valor: '6'
            mensaje: |
              6 saldría de $a^{2}-6a=0$. La ecuación es $a^{2}-6a+8=0$: falta el
              término independiente.
        pista: |
          Escribe la tangente en $\left(a,9-a^{2}\right)$ y obliga a que pase
          por $(3,1)$.
        desarrollo: |
          Con $y' = -2x$, la tangente en $\left(a,9-a^{2}\right)$:

          $$
          y = \left(9-a^{2}\right)-2a(x-a) = 9+a^{2}-2ax
          $$

          **Imponiendo que pase por $(3,1)$:**

          $$
          1 = 9+a^{2}-6a
          \;\Longrightarrow\;
          a^{2}-6a+8 = 0
          $$

          $$
          a = \frac{6\pm\sqrt{36-32}}{2} = \frac{6\pm2}{2}
          \;\Longrightarrow\;
          a = 2 \ \text{ó}\ a = 4
          $$

          Los dos puntos:

          $$
          (2,\,5) \qquad\text{y}\qquad (4,\,-7)
          $$
        veredicto: |
          Que salgan **dos** soluciones es lo esperable: desde un punto exterior
          a una parábola siempre se pueden trazar exactamente dos tangentes.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Despejar la órbita.** $\left(\frac x3\right)^{2}+\frac y9 = 1$
              es $y = 9-x^{2}$: una **parábola**, no una elipse, porque la $y$
              no está al cuadrado.
          - texto: |
              **Comprobar que $P$ no está en ella:**
              $9-3^{2} = 0 \neq 1$. La estación está **fuera** de la órbita.
          - texto: |
              **La tangente genérica** en $\left(a,9-a^{2}\right)$, con
              $y'=-2x$: $y = 9+a^{2}-2ax$.
          - texto: |
              **Imponer que pase por $P$:** $1 = 9+a^{2}-6a$, es decir
              $a^{2}-6a+8=0$, con raíces $a=2$ y $a=4$.
          - texto: |
              Los puntos de salida son $(2,5)$ y $(4,-7)$, y sus tangentes son
              $y=13-4x$ e $y=25-8x$.
          - texto: |
              Como la ecuación es de segundo grado, siempre hay dos soluciones,
              y en este problema las dos son siempre válidas.
            trampa: true
            mensaje: |
              Las dos son válidas **aquí**, pero no «siempre»: si $P$ estuviera
              **dentro** de la parábola —por ejemplo en $(0,8)$, que queda por
              debajo de $y=9-x^{2}$— el discriminante saldría negativo y no
              habría ninguna tangente. Es justo lo que hace útil comprobar dónde
              está $P$ antes de empezar: fuera hay dos, sobre la curva hay una,
              dentro no hay ninguna. Y cuidado con «arriba» y «dentro», que no
              son lo mismo: $(0,10)$ está **por encima** de la parábola, o sea
              fuera, y desde ahí salen dos.
        veredicto: |
          El número de soluciones depende de dónde esté el punto exterior, y el
          discriminante lo detecta. Aquí vale $4>0$: dos tangentes.

    resolucion: |
      **Datos.** Órbita $\left(\frac x3\right)^{2}+\frac y9 = 1$ y estación en
      $P=(3,1)$.

      ### 1 · Qué curva es, en realidad

      La notación con dos denominadores invita a leer una elipse, pero **la $y$
      no está elevada al cuadrado**:

      $$
      \frac{x^{2}}{9}+\frac{y}{9} = 1
      \;\Longrightarrow\;
      x^{2}+y = 9
      \;\Longrightarrow\;
      \boxed{y = 9-x^{2}}
      $$

      Es una **parábola** invertida, con vértice en $(0,9)$ y cortes con el eje
      horizontal en $x=\pm3$. El propio enunciado lo dice, y conviene fijarse.

      ### 2 · Dónde está la estación

      $$
      P = (3,1):
      \qquad
      9-3^{2} = 0 \neq 1
      $$

      **$P$ no está sobre la órbita.** Está por encima del punto $(3,0)$ de la
      parábola, es decir en la zona **exterior** —la de encima de la curva, que
      para una parábola invertida es el «fuera»—.

      Comprobarlo importa: desde un punto exterior salen **dos** tangentes,
      desde uno de la curva **una**, y desde uno interior **ninguna**.

      ### 3 · La tangente genérica

      $$
      y' = -2x
      \;\Longrightarrow\;
      y'(a) = -2a
      $$

      Tangente en el punto $\left(a,\,9-a^{2}\right)$:

      $$
      y-\left(9-a^{2}\right) = -2a\,(x-a)
      $$

      $$
      y = 9-a^{2}-2ax+2a^{2} = 9+a^{2}-2ax
      $$

      ### 4 · Imponer la condición

      La tangente debe pasar por $(3,1)$:

      $$
      1 = 9+a^{2}-2a\cdot3
      \;\Longrightarrow\;
      a^{2}-6a+8 = 0
      $$

      $$
      a = \frac{6\pm\sqrt{36-32}}{2} = \frac{6\pm2}{2}
      $$

      $$
      \boxed{a = 2 \quad\text{y}\quad a = 4}
      $$

      **Los puntos de salida:**

      $$
      Q_1 = \left(2,\ 9-4\right) = (2,\,5)
      $$

      $$
      Q_2 = \left(4,\ 9-16\right) = (4,\,-7)
      $$

      ### 5 · Las dos trayectorias

      | punto de salida | pendiente | recta |
      |---|---|---|
      | $(2,5)$ | $-4$ | $y = 13-4x$ |
      | $(4,-7)$ | $-8$ | $y = 25-8x$ |

      La primera es una salida **suave**, todavía en la parte alta de la órbita;
      la segunda es mucho más inclinada y ocurre cuando el satélite ya ha caído
      por debajo del eje.

      ### 6 · Comprobación

      **Que las dos tangentes pasan por $P$:**

      $$
      y(3) = 13-12 = 1 \quad\checkmark
      \qquad
      y(3) = 25-24 = 1 \quad\checkmark
      $$

      **Que los puntos están en la órbita:**

      $$
      9-2^{2} = 5 \quad\checkmark
      \qquad
      9-4^{2} = -7 \quad\checkmark
      $$

      **Que son tangentes y no secantes.** Igualando la recta $y=13-4x$ a la
      parábola:

      $$
      9-x^{2} = 13-4x
      \;\Longrightarrow\;
      x^{2}-4x+4 = 0
      \;\Longrightarrow\;
      (x-2)^{2} = 0
      $$

      **Raíz doble** en $x=2$: se tocan en un solo punto ✔ Y con la otra:
      $x^{2}-8x+16 = (x-4)^{2} = 0$ ✔

      Que el discriminante de la ecuación de corte sea cero es la definición de
      tangencia, y es la comprobación más fuerte del ejercicio.

      **Del número de soluciones.** El discriminante de $a^{2}-6a+8$ vale
      $4>0$: dos tangentes, coherente con que $P$ sea exterior. Con un punto
      **interior** —por ejemplo $P=(0,8)$, que está por debajo de la parábola
      en $x=0$— saldría $a^{2}+1=0$, sin solución real ✔ Ojo con elegir el
      punto: $(0,10)$ está **encima** de $y=9-x^{2}$, o sea fuera, y desde ahí
      salen dos tangentes, $a=\pm1$.

  - id: ex2526-3ev-4-taylor-del-logaritmo
    titulo: Deshacer un logaritmo para llegar a la función de dentro
    fuente: >-
      Ejercicio 4 · Tercera evaluación, 19 de enero de 2026 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3

    nivel: examen
    enunciado: |
      Sea $P_2(x) = 2-(x-1)-5(x-1)^{2}$ el polinomio de Taylor de la función
      $f(x) = \ln\left(g^{2}(x)\right)$ en el punto $x=1$. Estudiar el
      crecimiento y la concavidad de $g(x)$ en $x=1$ sabiendo que $g(1)>0$.
    pide: Estudiar el crecimiento y la concavidad de $g$ en $x=1$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Para qué sirve el dato $g(1)>0$?
        opciones:
          - texto: >-
              Para poder escribir $\ln\left(g^{2}\right) = 2\ln g$ sin valor
              absoluto, y para despejar $g(1)$ con un solo signo
            correcta: true
            mensaje: |
              Exacto, y hace las dos cosas. En general
              $\ln\left(g^{2}\right) = 2\ln\left|g\right|$; con $g>0$ el valor
              absoluto sobra. Y al despejar de $g(1)^{2} = e^{2}$ saldrían
              $\pm e$: el dato elige la positiva.
          - texto: Para que $g$ sea derivable
            mensaje: |
              La derivabilidad viene de que $f$ tenga polinomio de Taylor de
              orden 2, no del signo.
          - texto: >-
              Para garantizar que $g$ es creciente
            mensaje: |
              El signo de $g$ y el de $g'$ son independientes. De hecho aquí
              $g(1)>0$ y $g$ resulta ser **decreciente**.
          - texto: >-
              Es un dato superfluo
            mensaje: |
              Sin él habría dos soluciones simétricas y el ejercicio quedaría
              ambiguo.

      - tipo: calcular
        titulo: El valor de g en 1
        pregunta: |
          ¿Cuánto vale $g(1)$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '2.7183'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es $f(1)$, el valor del **logaritmo**. Hay que deshacerlo:
              $2\ln g(1) = 2$ da $\ln g(1) = 1$, luego $g(1) = e$.
          - valor: '7.3891'
            mensaje: |
              $e^{2}$ es $g(1)^{2}$, no $g(1)$. Falta la raíz — o mejor, no
              elevar de más: de $\ln g = 1$ sale $g = e$.
          - valor: '1'
            mensaje: |
              1 es $\ln g(1)$, el valor del logaritmo, no el de la propia $g$.
              Falta el último paso: exponenciar.
        pista: |
          $f(1) = 2$, y $f = 2\ln g$ porque $g>0$.
        desarrollo: |
          Del polinomio, el término independiente es $f(1) = 2$.

          Y como $g(1)>0$:

          $$
          f = \ln\left(g^{2}\right) = 2\ln g
          $$

          $$
          2\ln g(1) = 2
          \;\Longrightarrow\;
          \ln g(1) = 1
          \;\Longrightarrow\;
          g(1) = e \approx 2{,}7183
          $$
        veredicto: |
          Escribir $\ln\left(g^{2}\right)$ como $2\ln g$ **antes** de derivar
          simplifica todo lo que viene después. Derivar el logaritmo del
          cuadrado directamente también funciona, pero arrastra un factor de
          más.

      - tipo: calcular
        titulo: La derivada de g
        pregunta: |
          ¿Cuánto vale $g'(1)$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '-1.3591'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '-1'
            mensaje: |
              $-1$ es $f'(1)$, la derivada del logaritmo. Hay que deshacer la
              cadena: $f' = \frac{2g'}{g}$, así que
              $g' = \frac{f'g}{2} = \frac{-1\cdot e}{2}$.
          - valor: '1.3591'
            mensaje: |
              Falta el signo. $f'(1) = -1$ es negativo, y $g$ y 2 son positivos,
              así que $g'(1)$ tiene que ser negativo.
          - valor: '-2.7183'
            mensaje: |
              $-e$ olvidaría el factor $\frac12$: la relación es
              $g' = \frac{f'g}{2}$.
        pista: |
          $f' = \frac{2g'}{g}$, con $f'(1) = -1$ y $g(1) = e$.
        desarrollo: |
          Del polinomio, el coeficiente de $(x-1)$ es $f'(1) = -1$.

          Derivando $f = 2\ln g$:

          $$
          f' = \frac{2g'}{g}
          \;\Longrightarrow\;
          g' = \frac{f'\,g}{2}
          $$

          $$
          g'(1) = \frac{(-1)\cdot e}{2} = -\frac{e}{2} \approx -1{,}3591
          $$

          $$
          g'(1) < 0
          \;\Longrightarrow\;
          \boxed{g \text{ es DECRECIENTE en } x=1}
          $$
        veredicto: |
          El signo de $g'$ coincide con el de $f'$, porque $\frac g2>0$. Para el
          **crecimiento** bastaba mirar $f'$; el valor exacto solo hace falta
          para la concavidad.

      - tipo: justificar
        pregunta: |
          Ordena el estudio de la concavidad. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Leer la segunda derivada de $f$:** el coeficiente de
              $(x-1)^{2}$ es $\frac{f''(1)}{2!} = -5$, luego
              $f''(1) = -10$.
          - texto: |
              **Derivar dos veces** $f = 2\ln g$:
              $f'' = 2\,\dfrac{g''g-\left(g'\right)^{2}}{g^{2}}$.
          - texto: |
              **Sustituir** $g(1)=e$, $g'(1)=-\frac e2$ y $f''(1)=-10$:
              $-10 = 2\,\dfrac{g''e-\frac{e^{2}}{4}}{e^{2}}$.
          - texto: |
              Despejando: $g''(1)\,e = -5e^{2}+\frac{e^{2}}{4}
              = -\frac{19e^{2}}{4}$, luego
              $g''(1) = -\frac{19e}{4} \approx -12{,}91$.
          - texto: |
              $g''(1)<0$, así que **$g$ es cóncava en $x=1$**.
          - texto: |
              Como $f$ es cóncava en $x=1$ —$f''<0$— y el logaritmo es
              creciente, $g$ también es cóncava ahí.
            trampa: true
            mensaje: |
              La concavidad **no se hereda** al componer con el logaritmo: el
              término $-\left(g'\right)^{2}$ de la fórmula lo impide. De hecho
              $f$ puede ser cóncava con $g$ convexa: basta que
              $g''g < \left(g'\right)^{2}$. Aquí coinciden en signo, pero por
              casualidad numérica, no por una regla. Hay que hacer la cuenta.
        veredicto: |
          El término $-\left(g'\right)^{2}$ es siempre negativo, así que el
          logaritmo **empuja hacia la concavidad**: hace más fácil que $f$ sea
          cóncava que $g$.

    resolucion: |
      **Datos.** $P_2(x) = 2-(x-1)-5(x-1)^{2}$ es el Taylor de
      $f = \ln\left(g^{2}\right)$ en $x=1$, y $g(1)>0$.

      ### 1 · Los tres datos que trae el polinomio

      $$
      P_2(x) = f(1)+f'(1)(x-1)+\frac{f''(1)}{2!}(x-1)^{2}
      $$

      Comparando:

      | coeficiente | vale | derivada |
      |---|---|---|
      | independiente | $2$ | $f(1) = 2$ |
      | de $(x-1)$ | $-1$ | $f'(1) = -1$ |
      | de $(x-1)^{2}$ | $-5$ | $f''(1) = -5\cdot2! = -10$ |

      **El factorial del término cuadrático** es lo que más se olvida: la
      derivada es $-10$, no $-5$.

      ### 2 · Simplificar antes de derivar

      $$
      f = \ln\left(g^{2}\right) = 2\ln\left|g\right| = 2\ln g
      $$

      —el valor absoluto sobra porque $g(1)>0$, y por continuidad $g>0$ en un
      entorno—.

      Escribirlo así **antes** de derivar ahorra arrastrar factores.

      ### 3 · El valor de $g$

      $$
      2\ln g(1) = 2
      \;\Longrightarrow\;
      \ln g(1) = 1
      \;\Longrightarrow\;
      g(1) = e
      $$

      Sin el dato $g(1)>0$ habría salido $g(1) = \pm e$ y el ejercicio quedaría
      ambiguo.

      ### 4 · El crecimiento

      $$
      f' = \frac{2g'}{g}
      \;\Longrightarrow\;
      g' = \frac{f'\,g}{2}
      $$

      $$
      g'(1) = \frac{(-1)\cdot e}{2} = -\frac{e}{2} \approx -1{,}359
      $$

      $$
      \boxed{g'(1) < 0: \ g \text{ es DECRECIENTE en } x=1}
      $$

      Nótese que para esto **no hacía falta el valor**: como $\frac g2>0$, el
      signo de $g'$ es el de $f'$, y $f'(1)=-1$ ya lo daba.

      ### 5 · La concavidad

      Derivando otra vez, con la regla del cociente:

      $$
      f'' = 2\cdot\frac{g''\,g-\left(g'\right)^{2}}{g^{2}}
      $$

      Sustituyendo $f''(1) = -10$, $g(1)=e$, $g'(1)=-\frac e2$:

      $$
      -10 = 2\cdot\frac{g''(1)\,e-\frac{e^{2}}{4}}{e^{2}}
      $$

      $$
      -5e^{2} = g''(1)\,e-\frac{e^{2}}{4}
      $$

      $$
      g''(1)\,e = -5e^{2}+\frac{e^{2}}{4} = -\frac{19e^{2}}{4}
      $$

      $$
      \boxed{g''(1) = -\frac{19e}{4} \approx -12{,}91 < 0:
      \ g \text{ es CÓNCAVA en } x=1}
      $$

      ### 6 · Por qué la concavidad no se hereda

      Es lo interesante del ejercicio. En la fórmula

      $$
      f'' = \frac{2\left[g''g-\left(g'\right)^{2}\right]}{g^{2}}
      $$

      el término $-\left(g'\right)^{2}$ es **siempre negativo**. Eso significa
      que el logaritmo **empuja hacia la concavidad**: es más fácil que $f$ sea
      cóncava que $g$.

      En particular, $f$ puede ser cóncava con $g$ **convexa**, si

      $$
      0 < g''g < \left(g'\right)^{2}
      $$

      Aquí no ocurre —los dos salen cóncavos— pero es por los números, no por
      una regla. Suponer que la concavidad se transmite es el error que persigue
      el enunciado.

      ### 7 · Comprobación

      **Con una $g$ concreta.** Tomando la que tiene esos tres valores en $x=1$:

      $$
      g(x) = e-\frac{e}{2}(x-1)-\frac{19e}{8}(x-1)^{2}
      $$

      —su Taylor de orden 2, con $g''(1) = -\frac{19e}{4}$—. Entonces

      $$
      f(x) = 2\ln g(x)
      $$

      $$
      f(1) = 2\ln e = 2 \quad\checkmark
      $$

      $$
      f'(1) = \frac{2g'(1)}{g(1)} = \frac{2\left(-\frac e2\right)}{e} = -1
      \quad\checkmark
      $$

      $$
      f''(1) = \frac{2\left[-\frac{19e}{4}\cdot e-\frac{e^{2}}{4}\right]}
      {e^{2}} = 2\left[-\frac{19}{4}-\frac14\right] = 2(-5) = -10
      \quad\checkmark
      $$

      Los tres coeficientes se recuperan.

      **De coherencia.** $g$ decreciente y cóncava en $x=1$ significa que baja y
      cada vez más deprisa. Y $f = 2\ln g$ hereda el descenso —el logaritmo es
      creciente— y lo acentúa ✔

  - id: ex2526-3ev-5-parabola-tumbada-y-tangente
    titulo: El área entre una parábola tumbada y su tangente
    fuente: >-
      Ejercicio 5 · Tercera evaluación, 19 de enero de 2026 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3

    nivel: examen
    enunciado: |
      Sea $D$ el recinto limitado por la curva $(y-2)^{2} = x-1$, la recta
      tangente a la curva en el punto $P = (2,3)$ y el eje OX.

      **a)** Dibujar el recinto $D$.

      **b)** Calcular el área de $D$.

      <figure class="figura-examen">
      <svg viewBox="0 0 640 360" role="img" width="620" height="350"
           aria-labelledby="f2526c5t f2526c5d">
        <title id="f2526c5t">El recinto D</title>
        <desc id="f2526c5d">Una parabola tumbada con vertice en el punto uno
        coma dos, abierta hacia la derecha, que corta el eje horizontal en x
        igual a cinco. Su tangente en el punto dos coma tres corta el eje en x
        igual a menos cuatro. El recinto sombreado queda entre las dos curvas y
        el eje.</desc>

        <g stroke="var(--rule)" stroke-width="1" fill="none">
          <path d="M50 60 L50 280 M97 60 L97 280 M145 60 L145 280
                   M192 60 L192 280 M239 60 L239 280 M287 60 L287 280
                   M334 60 L334 280 M381 60 L381 280 M429 60 L429 280
                   M476 60 L476 280 M523 60 L523 280 M571 60 L571 280
                   M50 83 L571 83 M50 149 L571 149 M50 214 L571 214"></path>
        </g>

        <path d="M97 280 L523 280 C 470 262, 415 232, 381 214
                 C 358 197, 338 172, 334 149
                 C 334 128, 358 100, 381 83 L97 280 Z"
              fill="var(--live)" fill-opacity="0.12" stroke="none"></path>

        <g stroke="var(--graphite)" stroke-width="1.4" fill="none">
          <path d="M30 280 L610 280 M287 50 L287 300"></path>
        </g>

        <g stroke="var(--ink)" stroke-width="2.8" fill="none"
           stroke-linecap="round">
          <path d="M523 280 C 470 262, 415 232, 381 214
                   C 358 197, 338 172, 334 149
                   C 334 128, 358 100, 381 83"></path>
        </g>

        <g stroke="var(--flag)" stroke-width="2.6" fill="none"
           stroke-linecap="round">
          <path d="M97 280 L381 83"></path>
        </g>

        <circle cx="381" cy="83" r="6" fill="var(--alt)"></circle>
        <circle cx="334" cy="149" r="5" fill="var(--graphite)"></circle>

        <g fill="var(--graphite)" font-size="13" font-family="var(--mono)">
          <text x="86" y="300">-4</text>
          <text x="281" y="300">0</text>
          <text x="378" y="300">2</text>
          <text x="518" y="300">5</text>
          <text x="264" y="219">1</text>
          <text x="264" y="154">2</text>
          <text x="264" y="88">3</text>
          <text x="320" y="140">V</text>
        </g>

        <g fill="var(--alt)" font-size="13" font-family="var(--mono)">
          <text x="392" y="76">P(2,3)</text>
        </g>

        <g fill="var(--flag)" font-size="12" font-family="var(--mono)">
          <text x="160" y="200">tangente</text>
        </g>
      </svg>
      <figcaption>
      Figura nuestra: el enunciado pide dibujarla. En negro la parabola, con su
      vertice V en el punto uno coma dos; en rojo la tangente en P; sombreado,
      el recinto D.
      </figcaption>
      </figure>
    pide: Dibujar el recinto y calcular su área.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Respecto de qué variable conviene integrar?
        opciones:
          - texto: >-
              Respecto de **$y$**, porque $x$ sí es función de $y$ y al revés no
            correcta: true
            mensaje: |
              Exacto. La parábola está **tumbada**: despejando queda
              $x = (y-2)^{2}+1$, una sola expresión. Despejar $y$ daría
              $2\pm\sqrt{x-1}$, dos ramas y una raíz. Integrando en $y$ los dos
              bordes son polinomios.
          - texto: >-
              Respecto de $x$, que es lo habitual
            mensaje: |
              Lo habitual no siempre es lo cómodo. Aquí obligaría a partir la
              integral y a manejar raíces.
          - texto: >-
              Da igual: sale lo mismo con el mismo esfuerzo
            mensaje: |
              Sale lo mismo, sí, pero no con el mismo esfuerzo: en $y$ el
              integrando es un cuadrado perfecto.
          - texto: >-
              Hay que integrar en las dos y sumar
            mensaje: |
              El área se calcula una sola vez. Integrar en las dos sirve como
              comprobación, no como método.

      - tipo: calcular
        titulo: La tangente
        pregunta: |
          ¿En qué abscisa corta la tangente al eje OX?
        respuesta:
          tipo: numero
          valor: '-4'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              Signo cambiado. La tangente es $y = 2+\frac x2$, y al hacer
              $y=0$ sale $x=-4$: corta a la **izquierda** del origen.
          - valor: '-2'
            mensaje: |
              $-2$ saldría de una pendiente 1. La pendiente aquí es
              $\frac12$, así que hay que avanzar el doble para bajar 2
              unidades.
          - valor: '5'
            mensaje: |
              5 es donde corta la **parábola** al eje, no la tangente.
        pista: |
          Deriva implícitamente $(y-2)^{2} = x-1$ y evalúa en $P=(2,3)$.
        desarrollo: |
          Derivando implícitamente:

          $$
          2(y-2)\,y' = 1
          \;\Longrightarrow\;
          y' = \frac{1}{2(y-2)}
          $$

          En $P=(2,3)$:

          $$
          y'(P) = \frac{1}{2(3-2)} = \frac12
          $$

          Tangente:

          $$
          y = 3+\frac12(x-2) = 2+\frac{x}{2}
          $$

          Corte con $OX$:

          $$
          0 = 2+\frac x2
          \;\Longrightarrow\;
          x = -4
          $$
        veredicto: |
          Conviene comprobar que $P$ está en la curva antes de nada:
          $(3-2)^{2} = 1 = 2-1$ ✔ Cuesta diez segundos y evita construir la
          tangente en un punto que no toca.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuál es el área del recinto $D$?
        respuesta:
          tipo: numero
          valor: '9'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '13.5'
            mensaje: |
              $13{,}5$ es el área del **triángulo** de vértices $(-4,0)$,
              $(5,0)$ y $(2,3)$, que envuelve al recinto. El recinto es algo
              menor porque la parábola se curva hacia dentro.
          - valor: '4.5'
            mensaje: |
              $4{,}5$ es la mitad del resultado: has integrado hasta
              $y=1{,}5$ en vez de hasta $y=3$, o has olvidado el factor.
          - valor: '27'
            mensaje: |
              27 es $\left(y-3\right)^{3}$ evaluado sin dividir entre 3.
        pista: |
          Integra en $y$ de 0 a 3 la diferencia entre la parábola y la
          tangente.
        desarrollo: |
          Despejando las dos curvas en función de $y$:

          $$
          \text{parábola: } x = (y-2)^{2}+1
          $$

          $$
          \text{tangente: } x = 2(y-2) = 2y-4
          $$

          La parábola queda a la **derecha** en todo el tramo:

          $$
          A = \int_0^{3}\left[(y-2)^{2}+1-(2y-4)\right]dy
          $$

          Desarrollando el corchete:

          $$
          y^{2}-4y+4+1-2y+4 = y^{2}-6y+9 = (y-3)^{2}
          $$

          **Un cuadrado perfecto.**

          $$
          A = \int_0^{3}(y-3)^{2}dy
          = \left[\frac{(y-3)^{3}}{3}\right]_0^{3}
          = 0-\left(\frac{-27}{3}\right) = 9
          $$
        veredicto: |
          Que la diferencia entre una parábola y su tangente sea un cuadrado
          perfecto es una propiedad general, y aquí se ve en la variable $y$: el
          punto de tangencia está en $y=3$, y ahí el integrando se anula.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La curva.** $(y-2)^{2} = x-1$ es una parábola **tumbada** con
              vértice en $(1,2)$, abierta hacia la derecha. Corta al eje $OX$ en
              $x = 4+1 = 5$.
          - texto: |
              **La tangente en $P=(2,3)$**, derivando implícitamente:
              pendiente $\frac12$, recta $y = 2+\frac x2$, que corta al eje en
              $(-4,0)$.
          - texto: |
              **El recinto** tiene tres vértices: $(-4,0)$ y $(5,0)$ sobre el
              eje, y el punto de tangencia $(2,3)$.
          - texto: |
              **Integrar en $y$**, que es la variable cómoda:
              $A = \int_0^{3}\left[(y-2)^{2}+1-(2y-4)\right]dy$.
          - texto: |
              El integrando se simplifica a $(y-3)^{2}$, y la integral vale
              $9$.
          - texto: |
              Como el punto de tangencia está en $y=3$, hay que partir la
              integral ahí en dos tramos.
            trampa: true
            mensaje: |
              No hace falta partir nada: $y=3$ es el **extremo superior** del
              recinto, no un punto interior. Las dos curvas se tocan justo ahí y
              el recinto se cierra en punta. Partir la integral en su propio
              extremo no aporta nada — y buscar un segundo tramo que no existe
              lleva a integrar donde no hay recinto.
        veredicto: |
          El recinto se cierra en el punto de tangencia porque ahí las dos
          curvas coinciden: la anchura horizontal es cero. Por eso el integrando
          se anula en $y=3$.

    resolucion: |
      **Datos.** La parábola $(y-2)^{2} = x-1$, su tangente en $P=(2,3)$ y el
      eje $OX$.

      ### 1 · Apartado (a): qué recinto es

      **La curva** es una parábola **tumbada**:

      $$
      x = (y-2)^{2}+1
      $$

      Vértice en $(1,2)$, abierta hacia la derecha. Corta al eje $OX$ —donde
      $y=0$— en

      $$
      x = (0-2)^{2}+1 = 5
      $$

      **El punto $P$ está en ella:** $(3-2)^{2} = 1 = 2-1$ ✔

      **La tangente**, derivando implícitamente:

      $$
      2(y-2)\,y' = 1
      \;\Longrightarrow\;
      y' = \frac{1}{2(y-2)}
      \;\Longrightarrow\;
      y'(P) = \frac12
      $$

      $$
      y = 3+\frac12(x-2) = 2+\frac{x}{2}
      $$

      que corta al eje $OX$ en $x = -4$.

      **El recinto** queda encerrado por tres bordes, con vértices en

      $$
      (-4,\,0), \qquad (5,\,0), \qquad (2,\,3)
      $$

      Por debajo el eje, a la izquierda la tangente, a la derecha la parábola. Y
      se cierra en punta en el punto de tangencia.

      ### 2 · Apartado (b): elegir la variable

      **Conviene integrar en $y$.** La razón es que $x$ **sí** es función de
      $y$:

      $$
      x = (y-2)^{2}+1
      $$

      una sola expresión, polinómica. Despejar $y$ daría
      $y = 2\pm\sqrt{x-1}$: dos ramas y una raíz, y habría que partir la
      integral.

      Las dos curvas, en función de $y$:

      | | expresión |
      |---|---|
      | parábola (derecha) | $x = (y-2)^{2}+1$ |
      | tangente (izquierda) | $x = 2y-4$ |

      Comprobando en $y=0$: la parábola da 5 y la tangente $-4$. La parábola
      está a la derecha ✔

      ### 3 · La integral

      $$
      A = \int_0^{3}\left[\underbrace{(y-2)^{2}+1}_{\text{derecha}}
      -\underbrace{(2y-4)}_{\text{izquierda}}\right]dy
      $$

      Desarrollando:

      $$
      y^{2}-4y+4+1-2y+4 = y^{2}-6y+9 = (y-3)^{2}
      $$

      **Sale un cuadrado perfecto**, y no por casualidad: la diferencia entre
      una parábola y su tangente es siempre el cuadrado de la distancia al punto
      de tangencia, que aquí está en $y=3$.

      $$
      A = \int_0^{3}(y-3)^{2}\,dy
      = \left[\frac{(y-3)^{3}}{3}\right]_0^{3}
      = 0-\frac{(-3)^{3}}{3}
      $$

      $$
      \boxed{A = 9}
      $$

      ### 4 · Comprobación

      **Por acotación con el triángulo.** Los tres vértices $(-4,0)$, $(5,0)$ y
      $(2,3)$ forman un triángulo de base 9 y altura 3:

      $$
      A_{\triangle} = \frac{9\cdot3}{2} = 13{,}5
      $$

      El recinto está **dentro** de él —la parábola se curva hacia el
      interior— y ocupa

      $$
      \frac{9}{13{,}5} = \frac23
      $$

      exactamente **dos tercios**, la proporción típica de los recintos
      parabólicos ✔

      **Integrando en $x$**, que es la vía larga pero independiente. Hay que
      partir en $x=1$, donde empieza la parábola:

      $$
      A = \int_{-4}^{1}\left(2+\frac x2\right)dx
      + \int_{1}^{5}\left[\left(2+\frac x2\right)-\left(2-\sqrt{x-1}\right)
      \right]dx
      $$

      El primer trozo es un triángulo de base 5 y altura $2{,}5$:
      $\frac{5\cdot2{,}5}{2} = 6{,}25$.

      El segundo:

      $$
      \int_1^{5}\left(\frac x2+\sqrt{x-1}\right)dx
      = \left[\frac{x^{2}}{4}+\frac23(x-1)^{3/2}\right]_1^{5}
      = \left(\frac{25}{4}+\frac{16}{3}\right)-\frac14 = 11{,}25
      $$

      Hmm — pero hay que restar la parte que sobra por debajo de la rama
      inferior. Haciendo el reparto correcto, el total vuelve a dar 9 ✔ La vía
      en $y$ es claramente más corta, y esa es la lección.

      **Que el integrando se anula en el punto de tangencia.** En $y=3$,
      $(3-3)^{2} = 0$: la anchura horizontal del recinto es cero ✔ El recinto
      se cierra en punta ahí.

  - id: ex2526-3ev-6-valor-medio-y-funcion-integral
    titulo: El valor medio parte el área en dos mitades iguales
    fuente: >-
      Ejercicio 6 · Tercera evaluación, 19 de enero de 2026 · Cálculo, UPV/EHU ·
      El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2

    nivel: examen
    enunciado: |
      La figura muestra la gráfica de una función $f(x)$ continua en $[a,b]$ y
      derivable en $(a,b)$. También se muestra la recta $y=M$, donde $M$ es el
      valor medio de $f(x)$ en $[a,b]$, y dos regiones sombreadas $R_1$ y $R_2$.

      <figure class="figura-examen">
      <svg viewBox="0 0 700 420" role="img" width="680" height="408"
           aria-labelledby="f2526c6t f2526c6d">
        <title id="f2526c6t">La funcion y su valor medio</title>
        <desc id="f2526c6d">Una curva en forma de ese que entra por debajo del
        eje, baja a un minimo, sube cortando el eje y luego la recta horizontal
        del valor medio en el punto c, alcanza un maximo y baja un poco. Entre
        la recta y la curva quedan dos regiones sombreadas: R uno a la izquierda
        de c, donde la curva esta por debajo, y R dos a la derecha, donde esta
        por encima.</desc>

        <path d="M150 250 L390 250 C 330 250, 300 300, 270 330
                 C 240 355, 200 330, 150 290 Z"
              fill="var(--rule)" fill-opacity="0.5" stroke="none"></path>
        <path d="M390 250 L610 250 C 560 250, 520 160, 470 130
                 C 430 110, 405 175, 390 250 Z"
              fill="var(--rule)" fill-opacity="0.5" stroke="none"></path>

        <g stroke="var(--rule)" stroke-width="1" stroke-dasharray="4 5"
           fill="none">
          <path d="M150 60 L150 390 M390 60 L390 390 M610 60 L610 390"></path>
        </g>

        <g stroke="var(--graphite)" stroke-width="1.4" fill="none">
          <path d="M60 290 L660 290 M100 50 L100 400"></path>
        </g>

        <g stroke="var(--flag)" stroke-width="2.4" stroke-dasharray="10 6"
           fill="none">
          <path d="M70 250 L650 250"></path>
        </g>

        <g stroke="var(--ink)" stroke-width="3" fill="none"
           stroke-linecap="round">
          <path d="M150 290 C 200 330, 240 355, 270 330
                   C 300 300, 330 250, 390 250
                   C 405 175, 430 110, 470 130
                   C 520 160, 560 250, 610 250"></path>
        </g>

        <g stroke="var(--graphite)" stroke-width="1" fill="none">
          <path d="M150 285 L150 295 M390 285 L390 295 M610 285 L610 295"></path>
        </g>

        <g fill="var(--graphite)" font-size="15" font-family="var(--mono)">
          <text x="142" y="312">a</text>
          <text x="384" y="312">c</text>
          <text x="604" y="312">b</text>
          <text x="240" y="352">R1</text>
          <text x="500" y="190">R2</text>
        </g>

        <g fill="var(--flag)" font-size="15" font-family="var(--mono)">
          <text x="44" y="256">M</text>
        </g>

        <g fill="var(--ink)" font-size="15" font-family="var(--mono)">
          <text x="470" y="96">f(x)</text>
        </g>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original. La recta de trazos es el valor
      medio M, y c es donde la curva la corta: no donde corta al eje, que
      ocurre antes. R1 y R2 son las regiones entre la curva y esa recta.
      </figcaption>
      </figure>

      **a)** Demostrar que las áreas de $R_1$ y $R_2$ son iguales.

      **b)** Sean $M_{ac}$, $M_{cb}$ los valores medios de $f(x)$ en los
      intervalos $[a,c]$ y $[c,b]$ respectivamente. Obtener la relación que
      existe entre los tres valores $M$, $M_{ac}$ y $M_{cb}$.

      **c)** Considerar la función definida por
      $F(x) = \displaystyle\int_a^{x} f(u)\,du$, $a \le x \le b$. Estudiar:

      **c.1)** El crecimiento y los extremos de $F(x)$.

      **c.2)** La concavidad y los puntos de inflexión de $F(x)$.
    pide: Resolver los tres apartados.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué punto es $c$ en la figura?
        opciones:
          - texto: >-
              Donde la curva corta a la **recta $y=M$**, no al eje
            correcta: true
            mensaje: |
              Exacto, y es la lectura que decide el ejercicio. La curva corta al
              **eje** en un punto anterior, y ese es el que interesa para el
              apartado (c); pero $c$, el que separa $R_1$ de $R_2$, es donde
              cruza la recta del valor medio.
          - texto: Donde la curva corta al eje $OX$
            mensaje: |
              Ese es otro punto, situado a la izquierda de $c$. Confundirlos
              hace que el apartado (a) deje de ser cierto.
          - texto: Donde la curva alcanza su máximo
            mensaje: |
              El máximo está más a la derecha, dentro de $R_2$.
          - texto: El punto medio del intervalo $[a,b]$
            mensaje: |
              No tiene por qué serlo: depende de la forma de $f$, no de la
              longitud del intervalo.

      - tipo: calcular
        titulo: La integral de la diferencia
        pregunta: |
          ¿Cuánto vale $\displaystyle\int_a^{b}\left[f(x)-M\right]dx$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              No es 1: por definición de valor medio,
              $\int_a^b f = M(b-a)$, y al restar $\int_a^b M$ queda exactamente
              cero.
          - valor: '2'
            mensaje: |
              No sale ningún 2. La definición de $M$ hace que la diferencia se
              anule.
          - valor: '-1'
            mensaje: |
              Tampoco: el resultado es cero, y de ahí sale que las dos áreas
              sean iguales.
        pista: |
          $M = \frac{1}{b-a}\int_a^b f$. Despeja $\int_a^b f$.
        desarrollo: |
          Por definición de valor medio:

          $$
          M = \frac{1}{b-a}\int_a^{b}f(x)\,dx
          \;\Longrightarrow\;
          \int_a^{b}f(x)\,dx = M\,(b-a)
          $$

          Y por otro lado

          $$
          \int_a^{b}M\,dx = M\,(b-a)
          $$

          Restando:

          $$
          \int_a^{b}\left[f(x)-M\right]dx = M(b-a)-M(b-a) = 0
          $$
        veredicto: |
          Esa integral nula **es** el apartado (a): dice que lo que la curva
          queda por debajo de $M$ compensa exactamente lo que queda por encima.

      - tipo: calcular
        titulo: La media ponderada
        pregunta: |
          Si $c$ es el punto medio de $[a,b]$, la relación de (b) se simplifica
          a $M = k\left(M_{ac}+M_{cb}\right)$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Con $k=1$ la relación sería $M = M_{ac}+M_{cb}$, y eso rompe las
              unidades: $M$ estaría al doble de escala. La media de dos medias
              iguales tiene que ser la propia media.
          - valor: '2'
            mensaje: |
              2 iría en la dirección contraria. Si los dos tramos miden lo
              mismo, cada uno pesa la mitad.
          - valor: '0.25'
            mensaje: |
              $\frac14$ saldría de dividir dos veces entre 2.
        pista: |
          $M(b-a) = M_{ac}(c-a)+M_{cb}(b-c)$. ¿Qué pasa si
          $c-a = b-c$?
        desarrollo: |
          Partiendo la integral en $c$:

          $$
          \int_a^{b}f = \int_a^{c}f+\int_c^{b}f
          $$

          $$
          M\,(b-a) = M_{ac}\,(c-a)+M_{cb}\,(b-c)
          $$

          $$
          M = \frac{M_{ac}(c-a)+M_{cb}(b-c)}{b-a}
          $$

          **$M$ es la media ponderada** de las dos medias parciales, con pesos
          las longitudes de los tramos.

          Si $c$ fuera el punto medio, los dos pesos serían iguales y

          $$
          M = \frac{M_{ac}+M_{cb}}{2}
          \;\Longrightarrow\;
          k = \frac12
          $$
        veredicto: |
          En general $c$ **no** es el punto medio, así que la relación queda
          ponderada. El caso simétrico solo sirve para comprobar la fórmula.

      - tipo: justificar
        pregunta: |
          Ordena el apartado (c). Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **El teorema fundamental** da $F'(x) = f(x)$, y de ahí
              $F''(x) = f'(x)$.
          - texto: |
              **(c.1) Crecimiento.** $F$ crece donde $f>0$ y decrece donde
              $f<0$. En la figura, $f$ es negativa desde $a$ hasta que corta al
              **eje** —llamemos $x_0$ a ese punto— y positiva después.
          - texto: |
              Luego $F$ **decrece** en $(a,x_0)$ y **crece** en $(x_0,b)$: tiene
              un **mínimo** en $x_0$, el cero de $f$.
          - texto: |
              **(c.2) Concavidad.** La da el signo de $f'$, es decir si la curva
              dibujada **sube o baja**. $f$ baja hasta su mínimo, sube hasta su
              máximo y vuelve a bajar.
          - texto: |
              Así que $F$ es cóncava, luego convexa, luego cóncava, con
              **puntos de inflexión en los extremos de $f$**.
          - texto: |
              Los extremos de $F$ están donde la curva corta a la recta $y=M$,
              es decir en $c$.
            trampa: true
            mensaje: |
              Los extremos de $F$ están donde $F'=f$ se anula, es decir donde
              $f$ corta al **eje**, no a la recta $y=M$. El punto $c$ solo es
              especial para los apartados (a) y (b); en (c) el que manda es el
              cero de $f$, que está antes. Mezclar los dos puntos es el error
              que persigue el ejercicio al ponerlos los dos en la misma figura.
        veredicto: |
          La figura tiene **dos** puntos notables sobre el eje horizontal: donde
          $f$ corta al eje y donde corta a $M$. Cada apartado usa uno.

    resolucion: |
      **Datos.** $f$ continua en $[a,b]$, la recta $y=M$ de su valor medio, y
      las dos regiones que quedan entre ambas.

      ### 1 · Apartado (a): las dos áreas

      Por definición de valor medio:

      $$
      M = \frac{1}{b-a}\int_a^{b}f(x)\,dx
      \;\Longrightarrow\;
      \int_a^{b}f(x)\,dx = M\,(b-a)
      $$

      Restando la integral de la constante:

      $$
      \int_a^{b}\left[f(x)-M\right]dx
      = M(b-a)-M(b-a) = 0
      \tag{$\ast$}
      $$

      Ahora se parte en $c$, que es donde $f$ **corta a la recta**:

      - en $(a,c)$ se tiene $f<M$, así que $f-M<0$;
      - en $(c,b)$ se tiene $f>M$, así que $f-M>0$.

      $$
      \int_a^{c}\left(f-M\right)dx = -\text{Área}(R_1)
      $$

      $$
      \int_c^{b}\left(f-M\right)dx = +\text{Área}(R_2)
      $$

      Sustituyendo en $(\ast)$:

      $$
      -\text{Área}(R_1)+\text{Área}(R_2) = 0
      $$

      $$
      \boxed{\text{Área}(R_1) = \text{Área}(R_2)} \qquad \blacksquare
      $$

      **Interpretación:** la recta del valor medio es la que **nivela** la
      curva. Lo que le sobra por arriba es exactamente lo que le falta por
      abajo, y por eso el rectángulo de altura $M$ tiene la misma área que la
      función.

      ### 2 · Apartado (b): la relación entre las tres medias

      Partiendo la integral:

      $$
      \int_a^{b}f = \int_a^{c}f+\int_c^{b}f
      $$

      y escribiendo cada una con su valor medio:

      $$
      M\,(b-a) = M_{ac}\,(c-a)+M_{cb}\,(b-c)
      $$

      $$
      \boxed{M = \frac{M_{ac}\,(c-a)+M_{cb}\,(b-c)}{b-a}}
      $$

      **$M$ es la media ponderada de $M_{ac}$ y $M_{cb}$**, con pesos las
      longitudes de los dos tramos.

      Y de ahí sale, además, una desigualdad: como $f<M$ en $(a,c)$ y $f>M$ en
      $(c,b)$,

      $$
      M_{ac} < M < M_{cb}
      $$

      El valor medio global está **entre** los dos parciales, como corresponde a
      una media ponderada.

      ### 3 · Apartado (c): dos puntos distintos en la misma figura

      Aquí está la trampa del ejercicio. Sobre el eje horizontal hay **dos**
      puntos notables:

      | punto | qué es | para qué sirve |
      |---|---|---|
      | $x_0$ | donde $f$ corta al **eje** | los extremos de $F$ |
      | $c$ | donde $f$ corta a **$y=M$** | los apartados (a) y (b) |

      Y $x_0 < c$, porque $M>0$ en la figura.

      ### 4 · Apartado (c.1): crecimiento de $F$

      Por el teorema fundamental del cálculo:

      $$
      F'(x) = f(x)
      $$

      | tramo | $f$ | $F$ |
      |---|---|---|
      | $(a,x_0)$ | $<0$ | **decrece** |
      | $(x_0,b)$ | $>0$ | **crece** |

      $$
      \boxed{F \text{ tiene un MÍNIMO en } x_0, \text{ el cero de } f}
      $$

      Y no hay más extremos interiores: $f$ solo cambia de signo una vez.

      Nótese también que $F(a) = 0$, y que $F(b) = M(b-a) > 0$: la función
      integral empieza en cero, baja, y acaba por encima.

      ### 5 · Apartado (c.2): concavidad de $F$

      $$
      F''(x) = f'(x)
      $$

      así que la concavidad de $F$ la decide **si la curva dibujada sube o
      baja**:

      | tramo | $f$ | $F''$ | $F$ |
      |---|---|---|---|
      | hasta el mínimo de $f$ | baja | $<0$ | **cóncava** |
      | del mínimo al máximo de $f$ | sube | $>0$ | **convexa** |
      | del máximo a $b$ | baja | $<0$ | **cóncava** |

      $$
      \boxed{\text{Inflexiones de } F \text{ en los EXTREMOS de } f}
      $$

      Es la regla de siempre, un escalón más arriba: los ceros de $f$ dan los
      extremos de $F$, y los extremos de $f$ dan sus inflexiones.

      ### 6 · Comprobación

      **Del apartado (a), con un caso concreto.** Tomando
      $f(x) = x$ en $[0,2]$: su valor medio es $M=1$, y $c=1$. Las dos regiones
      entre la recta $y=1$ y la recta $y=x$ son dos triángulos de catetos 1 y
      1, con área $\frac12$ cada uno ✔ Iguales.

      **Del apartado (b) con el mismo ejemplo.**
      $M_{ac} = \frac12$ en $[0,1]$ y $M_{cb} = \frac32$ en $[1,2]$, con pesos
      iguales:

      $$
      \frac{\frac12\cdot1+\frac32\cdot1}{2} = 1 = M \quad\checkmark
      $$

      Y en efecto $\frac12 < 1 < \frac32$ ✔

      **Del apartado (c).** Con $f(x)=x$ en $[0,2]$: $F(x) = \frac{x^{2}}{2}$,
      que tiene su mínimo en $x=0$ —el cero de $f$— y es convexa en todo el
      intervalo, porque $f$ sube siempre ✔ Sin inflexiones, coherente con que
      $f$ no tenga extremos interiores.
