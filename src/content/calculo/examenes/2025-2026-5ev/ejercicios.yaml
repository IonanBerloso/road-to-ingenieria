      <figcaption>
      Figura redibujada del enunciado original. El monte es la superficie
      z = (1+x²+y²)⁻¹; A y B están a media altura, uno sobre el eje X y otro sobre
      el eje Y, y M es la cima. Las dos subidas C₁ y C₂ son la misma curva
      reflejada, y por eso el trabajo del viento es igual en las dos.
      </figcaption>
      </figure>

      La figura representa un fragmento de ladera, y tres trayectorias sobre la
      misma, $C_{1}$, $C_{2}$ y $C_{AB}$. Las trayectorias $C_{1}$ y $C_{2}$
      parten de los puntos A y B respectivamente y llegan hasta la cima M. Las
      proyecciones de $C_{1}$ y $C_{2}$ sobre el plano XY se encuentran sobre
      los ejes coordenados X e Y respectivamente, desde $(1,0)$ hasta $(0,0)$
      para $C_{1}$ y desde $(0,1)$ hasta $(0,0)$ para $C_{2}$. La tercera
      trayectoria $C_{AB}$ une los puntos A y B y su proyección sobre el plano
      XY es el segmento de recta $y = 1-x$, $x\in[0,1]$. Las cotas son en km.

      a) Supongamos que a cierta hora del día, el viento sopla con una fuerza
      dada por:

      $$
      F(x,y,z) = \left(xz,\; yz,\; \frac{1}{z^{2}}\right)
      $$

      Se planea realizar la subida en vehículo y utilizar la fuerza del viento
      para ahorrar combustible. ¿Cuál de las dos trayectorias de subida,
      $C_{1}$ o $C_{2}$, debe elegirse?

      b) Unas horas más tarde, el viento ha cambiado y su fuerza ahora viene
      dada por:

      $$
      F(x,y,z) = \left(2x+y,\; x+2y-z,\; -y\right)
      $$

      Calcular el trabajo efectuado por la fuerza en los siguientes casos:

      b1. Si se sigue la trayectoria $C_{AB}$.

      b2. Si se sigue la trayectoria ABMA.
    pide: Elegir entre las dos subidas, y el trabajo del segundo viento en dos recorridos.

    pasos:
      - tipo: reconocer
        pregunta: |
          Ante cualquier integral de línea de un campo de fuerzas, ¿cuál es la
          primera comprobación?
        opciones:
          - texto: >-
              Si el campo es conservativo, porque entonces el trabajo solo
              depende de los extremos y no del camino
            correcta: true
            mensaje: |
              Esa es la que decide cuánto trabajo cuesta el ejercicio. Si el
              rotacional es nulo hay potencial, y el trabajo se calcula
              restando dos números. Si no lo es, hay que parametrizar e
              integrar. Aquí los dos apartados dan respuestas distintas a esta
              misma pregunta, y ese es el diseño del problema.
          - texto: Parametrizar la curva, que es lo que siempre hay que hacer
            mensaje: |
              Solo si hace falta. Cuando el campo es conservativo, parametrizar
              es trabajo tirado: el apartado b) se resuelve sin integrar nada.
          - texto: Comprobar si la curva es cerrada
            mensaje: |
              Es útil —una curva cerrada en un campo conservativo da trabajo
              nulo—, pero por sí sola no dice nada: en un campo no conservativo
              una curva cerrada puede dar cualquier cosa.
          - texto: Calcular la longitud de la curva
            mensaje: |
              Eso sería para una integral de línea **respecto del arco**,
              $\int f\,ds$. Aquí es una integral de un campo vectorial,
              $\int \vec F\cdot d\vec r$, y la longitud no interviene.

      - tipo: calcular
        titulo: Apartado a) — el trabajo por la primera trayectoria
        pregunta: |
          Para $F = \left(xz, yz, \frac{1}{z^{2}}\right)$, ¿cuánto vale el
          trabajo a lo largo de $C_{1}$, de A hasta M?
        respuesta:
          tipo: numero
          valor: '0.6534264'
          tolerancia: 0.0005
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '-0.6534264'
            mensaje: |
              Signo cambiado: has recorrido la curva de M hacia A. El enunciado
              dice que $C_{1}$ **parte de A** y llega a la cima, así que el
              parámetro va de $x=1$ a $x=0$.
          - valor: '0.3465736'
            mensaje: |
              Eso es $\frac{\ln 2}{2}$, solo el primer sumando. Falta el
              término de la tercera componente, que aporta $+1$: el viento
              tiene componente vertical y la subida gana altura.
          - valor: '1.3068528'
            mensaje: |
              El doble. Probablemente has sumado el trabajo de $C_{1}$ y el de
              $C_{2}$, que efectivamente son iguales — pero la pregunta es por
              uno solo.
        pista: |
          Parametriza $C_{1}$ con $x=t$, $y=0$, $z = \frac{1}{1+t^{2}}$, y
          recuerda que $t$ va de 1 a 0. La tercera componente es
          $\frac{1}{z^{2}} = (1+t^{2})^{2}$, que se simplifica con $dz$.
        desarrollo: |
          Con $x=t$, $y=0$, $z=\dfrac{1}{1+t^{2}}$ y $t: 1 \to 0$:

          $$
          dz = \frac{-2t}{(1+t^{2})^{2}}\,dt,
          \qquad
          \frac{1}{z^{2}} = (1+t^{2})^{2}
          $$

          $$
          \vec F\cdot d\vec r
          = \underbrace{\frac{t}{1+t^{2}}}_{xz\,dx}\,dt
          + \underbrace{0}_{yz\,dy}
          + \underbrace{(1+t^{2})^{2}\cdot\frac{-2t}{(1+t^{2})^{2}}}_{\frac{1}{z^{2}}dz}\,dt
          = \left(\frac{t}{1+t^{2}} - 2t\right)dt
          $$

          $$
          W = \int_{1}^{0}\left(\frac{t}{1+t^{2}} - 2t\right)dt
          = -\left[\tfrac12\ln(1+t^{2}) - t^{2}\right]_{0}^{1}
          = 1 - \frac{\ln 2}{2} \approx 0{,}6534
          $$

          Fíjate en la cancelación de la tercera componente: $\frac{1}{z^{2}}$
          y $dz$ traen el mismo $(1+t^{2})^{2}$ y se van. Ese es el motivo de
          que el enunciado ponga ahí un $1/z^{2}$ y no otra cosa.

      - tipo: reconocer
        titulo: Apartado a) — cuál se elige
        pregunta: |
          ¿Cuál de las dos subidas, $C_{1}$ o $C_{2}$, conviene?
        opciones:
          - texto: >-
              Da igual: el trabajo es el mismo, y se puede ver **sin calcular
              la segunda**, por simetría
            correcta: true
            mensaje: |
              Exacto, y decirlo así vale los dos puntos de COMP4. Tanto el
              monte $z=\frac{1}{1+x^{2}+y^{2}}$ como el campo
              $F=(xz,yz,\frac{1}{z^{2}})$ quedan **iguales** al intercambiar
              $x$ por $y$, y ese intercambio convierte $C_{1}$ en $C_{2}$.
              Luego los dos trabajos coinciden y la elección es indiferente.
          - texto: $C_{1}$, porque va por el eje X y el viento tiene más componente ahí
            mensaje: |
              El campo no privilegia ningún eje: sus dos primeras componentes
              son $xz$ e $yz$, la misma expresión con las letras cambiadas.
              Calcula el segundo trabajo y sale idéntico.
          - texto: $C_{2}$, porque es la más corta
            mensaje: |
              No es más corta: las dos son la misma curva reflejada. Y aunque
              lo fuera, la longitud no decide el trabajo de un campo
              vectorial.
          - texto: >-
              $C_{1}$, porque el campo es conservativo y el trabajo solo
              depende de los extremos
            mensaje: |
              Este campo **no** es conservativo: $\operatorname{rot}\vec F =
              (y, x, 0)$, que no es nulo. Si lo fuera, las dos darían lo mismo
              trivialmente por tener los mismos extremos… que es justo lo que
              pasa en el apartado b), pero no aquí.

      - tipo: calcular
        titulo: Apartado b1) — el trabajo por C_AB
        pregunta: |
          Con $F = (2x+y,\; x+2y-z,\; -y)$, ¿cuánto vale el trabajo de A hasta
          B por la trayectoria $C_{AB}$?
        respuesta:
          tipo: numero
          valor: '-0.5'
          tolerancia: 0.0005
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              Signo cambiado: has restado al revés. El trabajo es
              $f(\text{final}) - f(\text{inicial}) = f(B) - f(A)$, y aquí
              $f(B) = \frac12$ mientras que $f(A) = 1$.
          - valor: '0'
            mensaje: |
              0 es la respuesta del apartado **b2**, donde el camino es cerrado.
              $C_{AB}$ no lo es: empieza en A y acaba en B, que son puntos
              distintos.
          - valor: '1'
            mensaje: |
              1 es $f(A)$, el potencial en el punto de partida. El trabajo es
              la **diferencia** de potencial entre los dos extremos.
        pista: |
          Comprueba primero que el campo es conservativo y busca el potencial
          $f$ con $\nabla f = F$. Después solo hay que evaluar en A$(1,0,\frac12)$
          y en B$(0,1,\frac12)$ — las alturas salen de $z(x,y)$.
        desarrollo: |
          **Es conservativo.** El rotacional se anula:

          $$
          \operatorname{rot}\vec F =
          \left(\frac{\partial(-y)}{\partial y} - \frac{\partial(x+2y-z)}{\partial z},\;
          \frac{\partial(2x+y)}{\partial z} - \frac{\partial(-y)}{\partial x},\;
          \frac{\partial(x+2y-z)}{\partial x} - \frac{\partial(2x+y)}{\partial y}\right)
          = (-1+1,\; 0,\; 1-1) = \vec 0
          $$

          **El potencial.** De $f_{x} = 2x+y$ sale $f = x^{2}+xy+g(y,z)$;
          derivando en $y$, $x + g_{y} = x+2y-z$ da $g = y^{2}-yz+h(z)$; y
          $f_{z} = -y + h'(z) = -y$ da $h$ constante:

          $$
          f(x,y,z) = x^{2} + xy + y^{2} - yz
          $$

          **Los extremos.** Las cotas salen del monte:
          $z(1,0) = z(0,1) = \frac12$, así que
          $A = \left(1,0,\tfrac12\right)$ y $B = \left(0,1,\tfrac12\right)$.

          $$
          f(A) = 1 + 0 + 0 - 0 = 1,
          \qquad
          f(B) = 0 + 0 + 1 - \tfrac12 = \tfrac12
          $$

          $$
          W = f(B) - f(A) = \tfrac12 - 1 = -\tfrac12
          $$

          Negativo: yendo de A a B el viento frena en vez de empujar.

      - tipo: justificar
        titulo: Apartado b2) — el recorrido cerrado
        pregunta: Ordena la respuesta al apartado b2). Una pieza es falsa.
        piezas:
          - texto: >-
              El recorrido ABMA empieza en A y termina en A: es una curva
              **cerrada**.
          - texto: >-
              Ya se ha comprobado en b1 que el campo es conservativo, porque su
              rotacional es nulo y está definido en todo $\mathbb{R}^{3}$.
          - texto: >-
              En un campo conservativo el trabajo vale
              $f(\text{final}) - f(\text{inicial})$, y en una curva cerrada los
              dos puntos son el mismo.
          - texto: >-
              Por tanto $W = f(A) - f(A) = 0$, sin necesidad de recorrer ningún
              tramo.
          - texto: >-
              Se puede comprobar por partes: $W_{AB} = -\frac12$,
              $W_{BM} = f(M)-f(B) = 0-\frac12 = -\frac12$ y
              $W_{MA} = f(A)-f(M) = 1-0 = 1$, que suman 0.
          - texto: >-
              El trabajo también sería nulo con el campo del apartado a), porque
              toda curva cerrada da trabajo cero.
            trampa: true
            mensaje: |
              Solo en campos conservativos. El del apartado a) no lo es
              —$\operatorname{rot}\vec F = (y,x,0)$—, y ahí una curva cerrada
              puede dar cualquier valor: es justo lo que mide el teorema de
              Stokes, que integra el rotacional sobre la superficie que la
              curva encierra. Si toda curva cerrada diera cero, «conservativo»
              no significaría nada.

    resolucion: |
      El ejercicio está construido sobre una sola pregunta hecha dos veces:
      **¿es conservativo el campo?** En el apartado a) la respuesta es no y hay
      que integrar; en el b) es sí y no hay que integrar nada.

      ## Los tres puntos

      Las cotas salen de la función del monte:

      $$
      A = \left(1, 0, \tfrac12\right),
      \qquad
      B = \left(0, 1, \tfrac12\right),
      \qquad
      M = (0, 0, 1)
      $$

      ## a) Las dos subidas dan lo mismo

      El campo $F = \left(xz, yz, \frac{1}{z^{2}}\right)$ **no** es
      conservativo:

      $$
      \operatorname{rot}\vec F = (y,\; x,\; 0) \neq \vec 0
      $$

      así que el camino importa y hay que calcular. Parametrizando $C_{1}$ con
      $x=t$, $y=0$, $z=\frac{1}{1+t^{2}}$, con $t$ de 1 a 0:

      $$
      W_{1} = \int_{1}^{0}\left(\frac{t}{1+t^{2}} - 2t\right)dt = 1 - \frac{\ln 2}{2}
      \approx 0{,}6534
      $$

      **Y aquí está la gracia del apartado: no hace falta repetir la cuenta.**
      El monte y el campo son invariantes al intercambiar $x$ por $y$ —basta
      mirarlos—, y ese intercambio lleva $C_{1}$ a $C_{2}$. Luego

      $$
      W_{2} = W_{1} = 1 - \frac{\ln 2}{2}
      $$

      **Da igual cuál se elija.** Las dos ahorran lo mismo. Decir esto con el
      argumento de simetría, en vez de calcular la segunda integral, es lo que
      se valora: la respuesta a «¿cuál conviene?» no es un número, es
      «ninguna de las dos, y por esto».

      ## b) Ahora sí es conservativo

      $$
      \operatorname{rot}\left(2x+y,\; x+2y-z,\; -y\right)
      = (-1+1,\; 0,\; 1-1) = \vec 0
      $$

      y el campo está definido en todo $\mathbb{R}^{3}$, que es simplemente
      conexo — la hipótesis que hay que decir en voz alta, porque sin ella el
      rotacional nulo no basta.

      El potencial se integra en tres pasos:

      $$
      f(x,y,z) = x^{2} + xy + y^{2} - yz
      $$

      **b1.** $W = f(B) - f(A) = \frac12 - 1 = \boxed{-\frac12}$

      **b2.** ABMA es cerrada, así que $W = f(A) - f(A) = \boxed{0}$.

      Y se puede comprobar sumando los tres tramos, que es lo que un corrector
      agradece:

      | tramo | $\Delta f$ |
      |---|---|
      | A → B | $\frac12 - 1 = -\frac12$ |
      | B → M | $0 - \frac12 = -\frac12$ |
      | M → A | $1 - 0 = +1$ |
      | **total** | **0** |

      ## Lo que este ejercicio quiere que no hagas

      Parametrizar en el apartado b). Son tres tramos, uno de ellos sobre una
      superficie curva, y todos con la coordenada $z$ ligada a $x$ e $y$: media
      hora de cuentas para llegar a dos números que salen restando potenciales.
      Comprobar el rotacional cuesta tres derivadas.

  - id: ex2526-5ev-2-clasificar-tres-edos
    titulo: Tres ecuaciones que se parecen, y solo una se resuelve igual
    fuente: >-
      Ejercicio 2 · Quinta evaluación, 11 de mayo de 2026 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp2: 7
      comp4: 3
    enunciado: |
      a) Indicar de qué tipo es cada una de las siguientes EDO:

      $$
      \text{a.1)}\quad (4y - x^{2}y)\,dx + (2x + xy^{2})\,dy = 0
      $$

      $$
      \text{a.2)}\quad x\,y'\operatorname{sen} x + y\cos x = x^{2}
      $$

      $$
      \text{a.3)}\quad x\,y' - y = y\ln(y/x)
      $$

      b) Resolver la EDO a.3.
    pide: Clasificar las tres y resolver la tercera.

    pasos:
      - tipo: reconocer
        pregunta: |
          Ante una EDO de primer orden, ¿en qué orden conviene probar los
          tipos?
        opciones:
          - texto: >-
              Separables primero, luego homogéneas, luego lineales, y exactas
              cuando viene escrita como $M\,dx + N\,dy = 0$
            correcta: true
            mensaje: |
              Ese es el orden útil: de lo más fácil de resolver a lo más caro.
              Y la forma en que está **escrita** ya sugiere por dónde mirar —
              una que llega como $M\,dx+N\,dy=0$ pide comprobar exactitud, y
              una despejada en $y'$ pide mirar si es lineal.
          - texto: Exactas primero, porque es la comprobación más rápida
            mensaje: |
              La comprobación es rápida, sí, pero resolver una exacta es más
              trabajo que separar variables. Y muchas separables **no** son
              exactas tal como vienen: la a.1 es un ejemplo.
          - texto: 'Da igual el orden: cada EDO es de un tipo y solo uno'
            mensaje: |
              No es cierto: una EDO puede ser de varios tipos a la vez —hay
              lineales que además son separables— y entonces conviene resolverla
              por el camino más corto. Clasificar no es etiquetar, es elegir
              método.
          - texto: >-
              Primero hay que comprobar si tiene solución con el teorema de
              existencia y unicidad
            mensaje: |
              Ese teorema dice si el problema de valor inicial está bien
              planteado, no cómo integrarlo. En un examen de este tipo lo que
              se pide es el método.

      - tipo: calcular
        titulo: La a.1 — ¿es exacta?
        pregunta: |
          Para $M = 4y - x^{2}y$ y $N = 2x + xy^{2}$, ¿cuánto vale
          $\dfrac{\partial M}{\partial y} - \dfrac{\partial N}{\partial x}$ en
          el punto $(2,1)$?
        respuesta:
          tipo: numero
          valor: '-3'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Si diera 0 la ecuación sería exacta, y no lo es.
              $M_{y} = 4 - x^{2}$ vale 0 en $x=2$, y $N_{x} = 2 + y^{2}$ vale 3
              en $y=1$. La diferencia es $-3$.
          - valor: '3'
            mensaje: |
              Has restado al revés: la pregunta es $M_{y} - N_{x}$, o sea
              $0 - 3$.
          - valor: '-7'
            mensaje: |
              Sale de derivar $M$ respecto de $x$ en vez de respecto de $y$. En
              el criterio de exactitud cada uno se deriva respecto de **la otra**
              variable.
        pista: |
          $M_{y} = 4 - x^{2}$ y $N_{x} = 2 + y^{2}$. Sustituye $x=2$, $y=1$.
        desarrollo: |
          $$
          M_{y} = 4 - x^{2} \;\to\; 4-4 = 0,
          \qquad
          N_{x} = 2 + y^{2} \;\to\; 2+1 = 3
          $$

          $$
          M_{y} - N_{x} = -3 \neq 0 \;\Longrightarrow\; \textbf{no es exacta}
          $$

          Pero sí es **separable**, que es lo que hay que ver. Dividiendo entre
          $xy$:

          $$
          \frac{4-x^{2}}{x}\,dx + \frac{2+y^{2}}{y}\,dy = 0
          $$

          Cada sumando depende de una sola variable. Es el caso típico de EDO
          que se disfraza de exacta por venir escrita como $M\,dx+N\,dy=0$.

      - tipo: calcular
        titulo: La solución de a.3, por un punto concreto
        pregunta: |
          La solución general de a.3 es $y = x\,e^{Cx}$. Para la que pasa por
          el punto $(1, e)$, ¿cuánto vale $y(2)$?
        respuesta:
          tipo: numero
          valor: '14.7781122'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '7.3890561'
            mensaje: |
              Eso es $e^{2}$: te has dejado el factor $x$. La solución es
              $y = x\,e^{Cx}$, y en $x=2$ hay que multiplicar por 2.
          - valor: '5.4365637'
            mensaje: |
              $2e$: has puesto $C=0$ o has olvidado que el exponente lleva $x$
              dentro. De $e = 1\cdot e^{C\cdot 1}$ sale $C=1$, así que
              $y = x e^{x}$.
          - valor: '2'
            mensaje: |
              Ese es solo el factor $x$. Falta la exponencial.
        pista: |
          Impón $y(1) = e$ en $y = x e^{Cx}$: queda $e = e^{C}$, así que
          $C=1$. Ahora evalúa en $x=2$.
        desarrollo: |
          $$
          y(1) = 1\cdot e^{C} = e \;\Longrightarrow\; C = 1
          \;\Longrightarrow\; y = x\,e^{x}
          $$

          $$
          y(2) = 2e^{2} \approx 14{,}7781
          $$

          Y conviene comprobar que $y = xe^{Cx}$ cumple la ecuación, que cuesta
          dos líneas: con $y' = e^{Cx}(1+Cx)$,

          $$
          x y' - y = xe^{Cx}(1+Cx) - xe^{Cx} = Cx^{2}e^{Cx}
          $$
          $$
          y\ln(y/x) = xe^{Cx}\ln\!\left(e^{Cx}\right) = Cx^{2}e^{Cx} \quad\checkmark
          $$

      - tipo: justificar
        titulo: La clasificación de las tres
        pregunta: Ordena la clasificación y la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              **a.1** viene como $M\,dx+N\,dy=0$, pero $M_{y} = 4-x^{2}$ y
              $N_{x} = 2+y^{2}$ no coinciden: no es exacta.
          - texto: >-
              Sacando factor común, $y(4-x^{2})\,dx + x(2+y^{2})\,dy = 0$, y
              dividiendo entre $xy$ los dos sumandos se separan: **a.1 es de
              variables separables**.
          - texto: >-
              **a.2**, dividida entre $x\operatorname{sen}x$, queda
              $y' + \frac{\cos x}{x\operatorname{sen}x}\,y = \frac{x}{\operatorname{sen}x}$:
              es **lineal de primer orden**, con $y$ e $y'$ a la primera
              potencia y sin productos entre ellas.
          - texto: >-
              **a.3** se escribe $y' = \frac{y}{x}\left[1+\ln\frac{y}{x}\right]$:
              todo depende de $y/x$, así que es **homogénea**.
          - texto: >-
              Con el cambio $v = y/x$, o sea $y = vx$ e $y' = v + xv'$, la a.3
              se convierte en $xv' = v\ln v$, que ya es separable:
              $\frac{dv}{v\ln v} = \frac{dx}{x}$.
          - texto: >-
              Integrando, $\ln|\ln v| = \ln|x| + k$, luego $\ln v = Cx$ y
              $y = x\,e^{Cx}$.
          - texto: >-
              La a.2 también es homogénea, porque todos sus términos tienen el
              mismo grado.
            trampa: true
            mensaje: |
              No lo es, y el motivo es fácil de comprobar: en una homogénea
              todo tiene que poder escribirse en función de $y/x$, y aquí
              aparecen $\operatorname{sen}x$ y $\cos x$ sueltos, que no son
              función de $y/x$. Además el término independiente $x^{2}$ rompe
              cualquier homogeneidad. «Mismo grado» es un criterio que solo
              aplica a expresiones polinómicas.

    resolucion: |
      ## a) Los tres tipos

      | | ecuación | tipo | por qué |
      |---|---|---|---|
      | a.1 | $(4y-x^{2}y)dx + (2x+xy^{2})dy = 0$ | **variables separables** | no es exacta, pero al dividir entre $xy$ cada sumando queda con una sola variable |
      | a.2 | $x\,y'\operatorname{sen}x + y\cos x = x^{2}$ | **lineal de primer orden** | $y$ e $y'$ aparecen a la primera potencia y sin multiplicarse entre sí |
      | a.3 | $x\,y' - y = y\ln(y/x)$ | **homogénea** | despejada, todo depende de $y/x$ |

      **a.1 con detalle.** Que venga escrita como $M\,dx+N\,dy=0$ invita a
      probar exactitud, y falla:

      $$
      M_{y} = 4-x^{2}, \qquad N_{x} = 2+y^{2}, \qquad M_{y}\neq N_{x}
      $$

      Pero sacando factor común se ve lo que es:

      $$
      y(4-x^{2})\,dx + x(2+y^{2})\,dy = 0
      \;\xrightarrow{\;\div\,xy\;}\;
      \frac{4-x^{2}}{x}\,dx + \frac{2+y^{2}}{y}\,dy = 0
      $$

      **a.2 con detalle.** Dividiendo entre $x\operatorname{sen}x$:

      $$
      y' + \frac{\cos x}{x\operatorname{sen}x}\,y = \frac{x}{\operatorname{sen}x}
      $$

      que es la forma canónica $y' + P(x)y = Q(x)$.

      ## b) Resolver la a.3

      $$
      x y' - y = y\ln\frac{y}{x}
      \;\Longrightarrow\;
      y' = \frac{y}{x}\left(1 + \ln\frac{y}{x}\right)
      $$

      Con el cambio de las homogéneas, $v = \dfrac{y}{x}$, es decir $y = vx$ e
      $y' = v + xv'$:

      $$
      v + xv' = v(1+\ln v) = v + v\ln v
      \;\Longrightarrow\;
      xv' = v\ln v
      $$

      Ya es separable:

      $$
      \frac{dv}{v\ln v} = \frac{dx}{x}
      \;\Longrightarrow\;
      \ln\left|\ln v\right| = \ln|x| + k
      \;\Longrightarrow\;
      \ln v = Cx
      $$

      $$
      v = e^{Cx} \;\Longrightarrow\; \boxed{y = x\,e^{Cx}}
      $$

      La integral del lado izquierdo es la que se atasca: con $u = \ln v$ se
      tiene $du = dv/v$, y queda $\int du/u$.

      ## La comprobación, que aquí vale puntos

      Sustituir la solución en la ecuación cuesta dos líneas y cierra el
      ejercicio:

      $$
      y = xe^{Cx} \;\Rightarrow\; y' = e^{Cx}(1+Cx)
      $$
      $$
      x y' - y = Cx^{2}e^{Cx},
      \qquad
      y\ln\frac{y}{x} = xe^{Cx}\cdot Cx = Cx^{2}e^{Cx} \quad\checkmark
      $$

      ## Y una observación sobre el dominio

      La solución exige $v > 0$ para que exista $\ln v$, o sea $y$ y $x$ del
      mismo signo. Y $v\neq 1$, porque $\ln v = 0$ anula el denominador al
      separar — ese caso, $y = x$, se pierde en la división y hay que
      recuperarlo aparte: es la solución constante $v\equiv 1$, que también
      satisface la ecuación y corresponde a $C=0$.

  - id: ex2526-5ev-3-variacion-de-constantes
    titulo: Cuando el término de la derecha no cabe en ningún molde
    fuente: >-
      Ejercicio 3 · Quinta evaluación, 11 de mayo de 2026 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Resolver la EDO
      $y'' - 2y' + y = \dfrac{8e^{x}}{1+x^{2}}$.
    pide: La solución general de la ecuación completa.

    pasos:
      - tipo: reconocer
        pregunta: |
          El término de la derecha es $\dfrac{8e^{x}}{1+x^{2}}$. ¿Qué método
          hay que usar para la solución particular?
        opciones:
          - texto: >-
              Variación de constantes, porque el término no es del tipo que
              admiten los coeficientes indeterminados
            correcta: true
            mensaje: |
              Eso es. Los coeficientes indeterminados solo valen cuando el
              segundo miembro es polinomio, exponencial, seno o coseno, o
              productos y sumas de esos. Un cociente con $1+x^{2}$ debajo no
              lo es: su familia de derivadas no se cierra, así que no hay
              ninguna forma finita que ensayar.
          - texto: >-
              Coeficientes indeterminados, ensayando $y_{p} = Ae^{x}/(1+x^{2})$
            mensaje: |
              Al derivar eso aparecen $(1+x^{2})^{2}$, $(1+x^{2})^{3}$… en los
              denominadores, así que nunca se cierra en una combinación finita.
              Es exactamente el caso que el método no cubre.
          - texto: Transformada de Laplace
            mensaje: |
              Serviría con condiciones iniciales, pero el enunciado no da
              ninguna: pide la solución **general**. Y la transformada de
              $\frac{e^{x}}{1+x^{2}}$ no es cómoda.
          - texto: >-
              Reducción de orden, porque la característica tiene raíz doble
            mensaje: |
              La raíz doble ya está aprovechada al escribir la solución
              homogénea, que es $(C_{1}+C_{2}x)e^{x}$. La reducción de orden
              sirve para **encontrar** la segunda solución homogénea cuando
              solo conoces una; aquí ya las tienes las dos.

      - tipo: calcular
        titulo: La raíz de la ecuación característica
        pregunta: |
          ¿Cuál es la raíz de $r^{2} - 2r + 1 = 0$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es el coeficiente de $r$ con el signo cambiado, no la raíz. La
              ecuación es $(r-1)^{2}=0$.
          - valor: '-1'
            mensaje: |
              Signo. $r^{2}-2r+1 = (r-1)^{2}$, así que la raíz es $+1$.
          - valor: '0'
            mensaje: |
              En $r=0$ la expresión vale 1, no 0. Y una raíz nula daría una
              solución constante en la homogénea, que aquí no aparece.
        pista: |
          $r^{2}-2r+1$ es un cuadrado perfecto.
        desarrollo: |
          $$
          r^{2}-2r+1 = (r-1)^{2} = 0 \;\Longrightarrow\; r = 1 \text{ (doble)}
          $$

          Al ser **doble**, la segunda solución homogénea lleva una $x$
          delante:

          $$
          y_{h} = \left(C_{1} + C_{2}x\right)e^{x}
          $$

          Ese detalle decide el resto del ejercicio: el wronskiano de
          $\{e^{x}, xe^{x}\}$ sale $e^{2x}$, muy limpio, y por eso las dos
          integrales de la variación de constantes se pueden hacer a mano.

      - tipo: calcular
        titulo: La solución particular, evaluada
        pregunta: |
          La solución particular es
          $y_{p} = e^{x}\left[8x\arctan x - 4\ln(1+x^{2})\right]$.
          ¿Cuánto vale $y_{p}(1)$?
        respuesta:
          tipo: numero
          valor: '9.5431669'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '3.5106'
            mensaje: |
              Te has dejado el factor $e^{x}$: eso es solo el corchete. En
              $x=1$ hay que multiplicarlo por $e$.
          - valor: '17.0774'
            mensaje: |
              $8e\arctan 1 = 2\pi e$: has calculado solo el primer sumando del
              corchete y te falta restar $4\ln 2$ multiplicado por $e$.
          - valor: '-7.5341'
            mensaje: |
              Signo cambiado en el corchete. El término del arcotangente entra
              **sumando** y el del logaritmo restando: $u_{1}$ sale negativo
              pero multiplica a $y_{1}$, y $u_{2}$ sale positivo.
        pista: |
          $\arctan 1 = \frac{\pi}{4}$ y $\ln 2 \approx 0{,}6931$. El corchete
          vale $2\pi - 4\ln 2$, y todo va multiplicado por $e$.
        desarrollo: |
          $$
          y_{p}(1) = e\left[8\arctan 1 - 4\ln 2\right]
          = e\left[8\cdot\frac{\pi}{4} - 4\ln 2\right]
          = e\left(2\pi - 4\ln 2\right)
          $$

          $$
          \approx 2{,}71828 \cdot (6{,}28319 - 2{,}77259)
          = 2{,}71828 \cdot 3{,}51060 \approx 9{,}5428
          $$

      - tipo: justificar
        titulo: La variación de constantes, paso a paso
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La característica $r^{2}-2r+1=0$ tiene la raíz $r=1$ doble, así
              que $y_{h} = (C_{1}+C_{2}x)e^{x}$, con
              $y_{1}=e^{x}$ e $y_{2}=xe^{x}$.
          - texto: >-
              El wronskiano vale
              $W = y_{1}y_{2}' - y_{1}'y_{2} = e^{x}(1+x)e^{x} - e^{x}\cdot xe^{x} = e^{2x}$.
          - texto: >-
              Con $g(x) = \frac{8e^{x}}{1+x^{2}}$:
              $u_{1}' = -\frac{y_{2}\,g}{W} = -\frac{8x}{1+x^{2}}$ y
              $u_{2}' = \frac{y_{1}\,g}{W} = \frac{8}{1+x^{2}}$.
          - texto: >-
              Integrando, $u_{1} = -4\ln(1+x^{2})$ y $u_{2} = 8\arctan x$; las
              constantes de integración se omiten porque ya están en la
              homogénea.
          - texto: >-
              $y_{p} = u_{1}y_{1} + u_{2}y_{2} = e^{x}\left[8x\arctan x - 4\ln(1+x^{2})\right]$.
          - texto: >-
              La solución general es la suma:
              $y = e^{x}\left[C_{1} + C_{2}x + 8x\arctan x - 4\ln(1+x^{2})\right]$.
          - texto: >-
              Como $y_{p}$ contiene un término con $x e^{x}$, hay que
              multiplicarlo por $x$ otra vez para que no se solape con la
              homogénea.
            trampa: true
            mensaje: |
              Esa regla —multiplicar por $x$ cuando el ensayo se solapa con la
              homogénea— es de **coeficientes indeterminados**, y aquí no se
              está usando ese método. La variación de constantes no ensaya
              nada: construye $y_{p}$ a partir de las propias soluciones
              homogéneas, y el resultado ya es independiente de ellas por
              construcción. Aplicar la regla aquí estropearía una solución
              correcta.

    resolucion: |
      ## Por qué no valen los coeficientes indeterminados

      El método de coeficientes indeterminados necesita que el segundo miembro
      tenga una **familia de derivadas finita**: polinomios, exponenciales,
      senos, cosenos y sus productos. Aquí el término es

      $$
      g(x) = \frac{8e^{x}}{1+x^{2}}
      $$

      y al derivarlo aparecen $(1+x^{2})^{2}$, luego $(1+x^{2})^{3}$, y así sin
      parar. No hay forma finita que ensayar. Decir esto es el punto de COMP1
      del ejercicio.

      ## La homogénea

      $$
      r^{2}-2r+1 = (r-1)^{2} = 0 \;\Longrightarrow\; r = 1 \text{ doble}
      $$

      $$
      y_{h} = (C_{1} + C_{2}x)\,e^{x},
      \qquad y_{1} = e^{x}, \quad y_{2} = xe^{x}
      $$

      ## Variación de constantes

      Se buscan $u_{1}(x)$ y $u_{2}(x)$ con
      $y_{p} = u_{1}y_{1} + u_{2}y_{2}$. El wronskiano:

      $$
      W = \begin{vmatrix} e^{x} & xe^{x} \\ e^{x} & (1+x)e^{x}\end{vmatrix}
      = e^{2x}(1+x) - xe^{2x} = e^{2x}
      $$

      —limpísimo, y es consecuencia directa de la raíz doble.

      $$
      u_{1}' = -\frac{y_{2}\,g}{W}
      = -\frac{xe^{x}}{e^{2x}}\cdot\frac{8e^{x}}{1+x^{2}}
      = -\frac{8x}{1+x^{2}}
      \;\Longrightarrow\;
      u_{1} = -4\ln(1+x^{2})
      $$

      $$
      u_{2}' = \frac{y_{1}\,g}{W}
      = \frac{e^{x}}{e^{2x}}\cdot\frac{8e^{x}}{1+x^{2}}
      = \frac{8}{1+x^{2}}
      \;\Longrightarrow\;
      u_{2} = 8\arctan x
      $$

      Las dos integrales son inmediatas, y no es casualidad: el $8$ y el
      $1+x^{2}$ del enunciado están puestos para que salgan el logaritmo y el
      arcotangente sin coeficientes feos.

      ## La solución

      $$
      y_{p} = -4\ln(1+x^{2})\,e^{x} + 8\arctan(x)\cdot xe^{x}
      $$

      $$
      \boxed{\;y = e^{x}\left[C_{1} + C_{2}x + 8x\arctan x - 4\ln\left(1+x^{2}\right)\right]\;}
      $$

      ## Dos avisos

      **Las constantes de las dos integrales se omiten.** Si se dejaran,
      producirían $k_{1}e^{x} + k_{2}xe^{x}$, que es exactamente la homogénea:
      se absorberían en $C_{1}$ y $C_{2}$. Escribirlas no está mal, pero sobra.

      **No se multiplica por $x$ nada.** Esa regla pertenece a coeficientes
      indeterminados, para cuando el ensayo choca con la homogénea. La
      variación de constantes no ensaya: construye. Aplicar aquí la regla del
      solapamiento estropea una solución que ya era correcta, y es el error que
      más aparece cuando se mezclan los dos métodos.
