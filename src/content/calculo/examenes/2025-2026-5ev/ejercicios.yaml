ejercicios:
  - id: ex2526-5ev-1-el-monte-y-las-tres-subidas
    titulo: Tres caminos hasta la cima, y un viento que a veces empuja gratis
    fuente: >-
      Ejercicio 1 · Quinta evaluación, 11 de mayo de 2026 · Cálculo, UPV/EHU
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Supongamos que la altura de un monte se modeliza mediante la función
      $z(x,y) = \left(1 + x^{2} + y^{2}\right)^{-1}$.

      <figure class="figura-examen">
      <svg viewBox="0 0 600 442" role="img" width="600" height="442"
           aria-labelledby="mt-t mt-d">
        <title id="mt-t">El monte y las tres trayectorias</title>
        <desc id="mt-d">Un monte con forma de campana, con la cima M sobre el eje
        vertical. En la ladera hay tres caminos marcados. A esta abajo a la izquierda
        y B abajo a la derecha, a la misma altura. La trayectoria C uno sube de A
        hasta la cima siguiendo la vertical del eje X, y la C dos sube de B hasta la
        cima siguiendo la del eje Y; las dos son iguales, una el reflejo de la otra.
        La tercera, C A B, cruza la ladera de A a B por debajo de la cima, y su
        sombra en el suelo es el segmento que une el uno del eje X con el uno del
        eje Y.</desc>
