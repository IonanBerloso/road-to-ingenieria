      <figcaption>
      El sector de cuarenta y cinco grados, entre la bisectriz y el eje
      vertical, dentro del disco de radio dos. El borde son tres trozos: el arco
      y los dos radios.
      </figcaption>
      </figure>

      **b) El volumen, por Pappus.** El recinto está entero en $y\ge0$ y solo
      toca el eje de giro en el origen, así que el teorema se puede aplicar:

      $$
      V=2\pi\,\overline{y}\,A
      \qquad\text{con}\qquad
      \overline{y}\,A=\iint_{D}y\,dA
      $$

      En polares el momento sale de dos integrales inmediatas:

      $$
      \iint_{D}y\,dA=\int_{\pi/4}^{\pi/2}\operatorname{sen}\theta\,d\theta
      \int_{0}^{2}r^{2}\,dr
      =\frac{\sqrt2}{2}\cdot\frac{8}{3}=\frac{4\sqrt2}{3}
      $$

      $$
      \boxed{\;V=\frac{8\sqrt2\,\pi}{3}\approx11{,}85\;}
      $$

      **La comprobación por discos**, que conviene tener hecha porque Pappus se
      olvida. Girando alrededor de OX, la sección a la altura $x$ es una corona
      entre la recta $y=x$ —abajo— y la circunferencia $y=\sqrt{4-x^{2}}$
      —arriba—, y las dos se cruzan en $x=\sqrt2$:

      $$
      V=\pi\int_{0}^{\sqrt2}\left[\left(4-x^{2}\right)-x^{2}\right]dx
      +\pi\int_{\sqrt2}^{2}\left(4-x^{2}\right)dx
      $$

      Sale lo mismo, $11{,}848$, y por dos caminos independientes.

      **c) El perímetro.** Tres trozos, y ninguno hay que integrar:

      | trozo | longitud |
      |---|---|
      | arco de $45^{\circ}$ y radio $2$ | $2\cdot\frac\pi4=\frac\pi2$ |
      | radio sobre $y=x$ | $2$ |
      | radio sobre el eje $Y$ | $2$ |

      $$
      \boxed{\;\text{perímetro}=\frac\pi2+4\approx5{,}571\;}
      $$

      **El error que este apartado busca.** Contestar solo el arco. El
      «perímetro de $D$» es el borde de la **región**, no la parte curva: los
      dos radios cierran la figura y miden más que el arco.
  - id: ex2425-ext-6-el-paraboloide-tapado-por-la-esfera
    titulo: Un paraboloide tumbado, tapado por una esfera
    fuente: >-
      Ejercicio 1 del SEGUNDO PARCIAL · Convocatoria extraordinaria, 26 de junio
      de 2025 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea $S$ el sólido definido por las condiciones $x^{2}+z^{2}\le 3y$,
      $x^{2}+y^{2}+z^{2}\le 4$.

      a) Dibujar $S$.

      b) Calcular el volumen de $S$.

      c) Calcular el área de la superficie de $S$.
    pide: El dibujo, el volumen y el área.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Alrededor de qué eje gira el paraboloide $x^{2}+z^{2}=3y$?
        opciones:
          - texto: >-
              Del eje $Y$, porque es la variable que **no** está elevada al
              cuadrado
            correcta: true
            mensaje: |
              Eso es, y es la lectura de un segundo: en $x^{2}+z^{2}=3y$ las dos
              que aparecen al cuadrado son las que forman los círculos, y la que
              queda suelta marca el eje. Aquí el cuerpo está tumbado, no de pie.
          - texto: Del eje $Z$
            mensaje: |
              El eje $Z$ sería si la ecuación fuera $x^{2}+y^{2}=3z$. Fíjate en
              cuál de las tres variables aparece sin cuadrado: esa es el eje.
          - texto: >-
              De ninguno: con tres variables ya no es una superficie de
              revolución
            mensaje: |
              Sí lo es. Que $x$ y $z$ entren solo por $x^{2}+z^{2}$ significa
              que la superficie solo depende de la distancia al eje $Y$, y eso
              **es** ser de revolución.

      - tipo: calcular
        titulo: Dónde se cortan
        pregunta: |
          ¿A qué altura $y$ se cortan el paraboloide y la esfera?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-4'
            mensaje: |
              $-4$ es la otra raíz de $y^{2}+3y-4=0$, y hay que descartarla en
              voz alta: la esfera solo llega hasta $y=-2$, así que $-4$ está
              fuera del sólido.
          - valor: '2'
            mensaje: |
              $2$ es el punto más alto de la esfera sobre el eje $Y$, no el
              corte. Allí el paraboloide tendría radio $\sqrt6$ y la esfera
              radio $0$.
          - valor: '1.7320508'
            mensaje: |
              $\sqrt3$ es el **radio** del círculo de corte, no su altura. La
              altura sale de resolver la ecuación de segundo grado.
        pista: |
          Sustituye $x^{2}+z^{2}=3y$ en la esfera: $3y+y^{2}=4$.
        desarrollo: |
          $$
          x^{2}+z^{2}=3y
          \quad\text{y}\quad
          x^{2}+y^{2}+z^{2}=4
          \;\Longrightarrow\;
          3y+y^{2}=4
          $$

          $$
          y^{2}+3y-4=0
          \;\Longrightarrow\;
          y=1\quad\text{o}\quad y=-4
          $$

          Solo $y=1$ está dentro de la esfera. El radio del círculo de corte es
          $\rho=\sqrt{3}$.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen de $S$?
        respuesta:
          tipo: numero
          valor: '9.9483767'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '4.712389'
            mensaje: |
              $\frac{3\pi}{2}$ es solo el trozo de paraboloide, de $y=0$ a
              $y=1$. Falta el casquete esférico que va de $1$ a $2$.
          - valor: '5.2359878'
            mensaje: |
              $\frac{5\pi}{3}$ es solo el casquete. La parte de abajo aporta
              $\frac{3\pi}{2}$ más.
          - valor: '33.5103216'
            mensaje: |
              $\frac{32\pi}{3}$ es la esfera **entera** de radio $2$. El sólido
              es la parte de ella que además está dentro del paraboloide, que es
              bastante menos de un tercio.
        pista: |
          Discos perpendiculares al eje $Y$: radio$^{2}=3y$ hasta $y=1$, y
          $4-y^{2}$ desde ahí.
        desarrollo: |
          $$
          V=\pi\int_{0}^{1}3y\,dy+\pi\int_{1}^{2}\left(4-y^{2}\right)dy
          =\frac{3\pi}{2}+\frac{5\pi}{3}=\frac{19\pi}{6}\approx9{,}948
          $$

      - tipo: justificar
        pregunta: Ordena el apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              La superficie de $S$ son **dos** trozos: el casquete de
              paraboloide desde el vértice hasta el corte, y el casquete
              esférico desde el corte hasta el polo.
          - texto: >-
              El del paraboloide se calcula como superficie de revolución:
              $2\pi\int_{0}^{\sqrt3}\rho\sqrt{1+\frac{4\rho^{2}}{9}}\,d\rho
              =\frac{3\pi}{2}\left[\left(\frac73\right)^{3/2}-1\right]
              \approx12{,}08$.
          - texto: >-
              El casquete esférico tiene área $2\pi R h$ con $R=2$ y $h=2-1=1$,
              o sea $4\pi\approx12{,}57$. En total, unas $24{,}65$ unidades.
          - texto: >-
              Además hay que sumar el círculo de radio $\sqrt3$ donde se cortan
              las dos superficies, porque también es parte del borde.
            trampa: true
            mensaje: |
              Ese círculo **no** es superficie del sólido: es la costura entre
              las dos partes, y está por dentro. Sumarlo sería contar una tapa
              que no existe — el cuerpo es cerrado sin ella. La regla: solo
              cuentan las caras que separan el sólido del aire, y en la
              circunferencia de corte hay sólido a los dos lados.
    resolucion: |
      **a) Qué sólido es.** Dos superficies de revolución alrededor del **eje
      $Y$** —fíjate en que es la variable que no aparece al cuadrado—: un
      paraboloide que abre hacia $+y$ y una esfera de radio $2$. El sólido es lo
      que está dentro de los dos.

      Se cortan donde $3y+y^{2}=4$, o sea

      $$
      y^{2}+3y-4=0\;\Longrightarrow\;y=1\ \text{(y }y=-4\text{, fuera)},
      \qquad \rho=\sqrt3
      $$

