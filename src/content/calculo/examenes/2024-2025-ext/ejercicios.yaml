      <figcaption>
      La semicircunferencia de diámetro el segmento de 1 a 2, sin los extremos.
      Desde cualquiera de sus puntos, ese segmento se ve bajo un ángulo recto;
      desde la mitad de abajo también, pero con el argumento cambiado de signo.
      </figcaption>
      </figure>

      **La comprobación de diez segundos.** El punto más alto es
      $z=\frac32+\frac12 i$. Entonces $z-2=-\frac12+\frac12 i$ y
      $z-1=\frac12+\frac12 i$: uno tiene argumento $\frac{3\pi}{4}$ y el otro
      $\frac\pi4$, y su diferencia es $\frac\pi2$ ✓.

  - id: ex2425-ext-2-la-curva-implicita-y-su-tangente-vertical
    titulo: Una curva que no se puede despejar, y la tangente que se pone de pie
    fuente: >-
      Ejercicio 2 del PRIMER PARCIAL · Convocatoria extraordinaria, 26 de junio
      de 2025 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 4
      comp4: 4
    enunciado: |
      Sea la curva $y=e^{xy}$.

      a) Calcular el polinomio de McLaurin de orden 2 en el punto $P(0,1)$.

      b) Aproximar el valor de la curva en $x=0.1$.

      c) ¿Cuál es la recta tangente a la curva en el punto $P(0,1)$? ¿Y en
      $R(1/e,e)$?
    pide: El polinomio, la aproximación y las dos rectas tangentes.

    pasos:
      - tipo: reconocer
        pregunta: |
          La ecuación no se puede despejar en $y$. ¿Cómo se sacan entonces las
          derivadas?
        opciones:
          - texto: >-
              Derivando la igualdad entera respecto de $x$, tratando $y$ como
              función de $x$, y despejando $y'$
            correcta: true
            mensaje: |
              Eso es: derivación implícita. Cada vez que aparece una $y$ hay que
              arrastrar su $y'$ por la regla de la cadena, y al final se despeja.
          - texto: >-
              Tomando logaritmos y despejando $y$ en función de $x$
            mensaje: |
              Tomando logaritmos queda $\ln y=xy$, que sigue teniendo la $y$ en
              los dos lados. No se puede despejar con funciones elementales — y
              esa es justamente la razón de que el ejercicio pida derivación
              implícita.
          - texto: >-
              Desarrollando la exponencial en serie y truncando
            mensaje: |
              El desarrollo de $e^{xy}$ lleva la propia $y$ dentro, así que no
              cierra: habría que sustituir la serie dentro de sí misma. Es un
              camino posible pero mucho más largo que derivar dos veces.

      - tipo: calcular
        titulo: La segunda derivada
        pregunta: |
          ¿Cuánto vale $y''(0)$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es $y'(0)$. Derivando otra vez $y'=y^{2}+xyy'$ salen tres
              términos y en el origen sobreviven dos.
          - valor: '2'
            mensaje: |
              $2$ sale de derivar solo el $y^{2}$ y olvidar el $xyy'$. Ese
              término aporta $1$ más en el origen.
          - valor: '4'
            mensaje: |
              $4$ saldría contando dos veces alguno de los sumandos. La cuenta
              es $2yy'+yy'=2+1=3$.
        pista: |
          De $y=e^{xy}$ sale $y'=y\left(y+xy'\right)=y^{2}+xyy'$. Deriva eso.
        desarrollo: |
          $$
          y'=y^{2}+xyy'
          \;\Longrightarrow\;
          y''=2yy'+\left(yy'+x\left(y'\right)^{2}+xyy''\right)
          $$

          En $(0,1)$, con $y'=1$, los términos con $x$ se van:

          $$
          y''(0)=2\cdot1\cdot1+1\cdot1=3
          $$

      - tipo: calcular
        titulo: La aproximación
        pregunta: |
          ¿Qué valor da el polinomio de orden $2$ en $x=0{,}1$?
        respuesta:
          tipo: numero
          valor: '1.115'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es $y(0)$, o sea el polinomio de orden **cero**. Aproximar con
              él es decir que la función no cambia, y el enunciado pide orden
              dos.
          - valor: '0.885'
            mensaje: |
              Signo. $1-0{,}1-0{,}015$ sale de poner el término lineal
              negativo, y $y'(0)$ vale $+1$: la curva **sube** al salir de
              $(0,1)$.
          - valor: '1.315'
            mensaje: |
              $1+3\left(0{,}1\right)+\frac32\left(0{,}1\right)^{2}$: has usado
              el $3$ como **primera** derivada. El $3$ es $y''(0)$, y la primera
              vale $1$. En el polinomio, cada derivada va en su sitio y dividida
              entre su factorial.
        pista: |
          $P_{2}(x)=1+x+\frac{3}{2}x^{2}$.
        desarrollo: |
          $$
          P_{2}(x)=1+x+\frac{3}{2}x^{2}
          \;\Longrightarrow\;
          P_{2}(0{,}1)=1+0{,}1+0{,}015=1{,}115
          $$

          El valor real es $1{,}1183$: el polinomio se queda corto en tres
          milésimas, que para un desarrollo de grado dos a esa distancia es lo
          esperable.

      - tipo: justificar
        pregunta: Ordena el apartado c). Una pieza es falsa.
        piezas:
          - texto: >-
              Despejando en $y'=y^{2}+xyy'$ queda
              $y'=\dfrac{y^{2}}{1-xy}$, y en $P(0,1)$ eso vale $1$: la tangente
              es $y=1+x$.
          - texto: >-
              El punto $R\left(\frac1e,e\right)$ está en la curva, porque
              $e^{xy}=e^{1}=e$. Pero ahí $xy=1$, así que el **denominador de
              $y'$ se anula**.
          - texto: >-
              Una derivada que se va a infinito significa tangente vertical, así
              que en $R$ la recta tangente es $x=\frac1e$.
          - texto: >-
              Como en $R$ la derivada no existe, la curva no tiene tangente en
              ese punto.
            trampa: true
            mensaje: |
              No existe como **número**, y sin embargo la tangente existe: es
              vertical. Que $y'\to\infty$ no dice que no haya recta tangente,
              dice que esa recta no tiene pendiente — es paralela al eje $Y$.
              Confundir «no hay derivada» con «no hay tangente» es el error del
              apartado, y el enunciado pregunta por $R$ precisamente por eso.
    resolucion: |
      **a) El polinomio.** La curva no se puede despejar: $\ln y=xy$ deja la
      $y$ en los dos lados. Así que se deriva implícitamente.

      $$
      y=e^{xy}
      \;\Longrightarrow\;
      y'=e^{xy}\left(y+xy'\right)=y\left(y+xy'\right)=y^{2}+xyy'
      $$

      En $(0,1)$: $y'=1$. Derivando otra vez,

      $$
      y''=2yy'+yy'+x\left(y'\right)^{2}+xyy''
      \;\Longrightarrow\;
      y''(0)=2+1=3
      $$

      $$
      \boxed{\;P_{2}(x)=1+x+\tfrac32x^{2}\;}
      $$

      **b) La aproximación.** $P_{2}(0{,}1)=1{,}115$, frente al valor real
      $1{,}1183$. Tres milésimas de error.

      **c) Las dos tangentes, que es donde está el ejercicio.** Despejando la
      derivada,

      $$
      y'\left(1-xy\right)=y^{2}
      \;\Longrightarrow\;
      y'=\frac{y^{2}}{1-xy}
      $$

      En $P(0,1)$ el denominador vale $1$ y sale $y'=1$:

      $$
      y=1+x
      $$

      En $R\left(\frac1e,e\right)$ —que está en la curva, porque
      $e^{xy}=e^{1}=e$— el producto $xy$ vale exactamente $1$ y **el
      denominador se anula**. La derivada se va a infinito, y eso significa

      $$
      \boxed{\;x=\tfrac1e\;}
      $$

      una **tangente vertical**. La curva llega a ese punto con la pendiente en
      pie y se da la vuelta: $R$ es el punto de la curva más a la derecha.

      **Por qué el examen pregunta por dos puntos y no por uno.** Porque el
      segundo no se puede contestar con la fórmula: hay que darse cuenta de que
      la fórmula falla y saber qué significa que falle. Es el apartado de COMP 4
      del ejercicio, y responderlo con «no existe la derivada» y punto se deja
      la mitad.

  - id: ex2425-ext-3-una-arcotangente-disfrazada-de-integral
    titulo: Estudiar entera una función que solo se conoce como integral
    fuente: >-
      Ejercicio 3 del PRIMER PARCIAL · Convocatoria extraordinaria, 26 de junio
      de 2025 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3
    enunciado: |
      Sea la función
      $$
      F(x)=\int_{0}^{x}\frac{1}{t^{2}+2t+2}\,dt
      $$

      a) ¿Toma $F(x)$ el valor 0? Razonar la repuesta.

      b) Estudiar el crecimiento/decrecimiento de $F(x)$.

      c) Estudiar la concavidad/convexidad de $F(x)$.

      d) Trazar la gráfica de $F(x)$.
    pide: Los cuatro apartados, y el dibujo.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la forma rápida de contestar el apartado a)?
        opciones:
          - texto: >-
              Que $F(0)=0$ por definición, porque una integral entre $0$ y $0$
              vale cero
            correcta: true
            mensaje: |
              Exacto, y no hace falta calcular nada. El apartado premia darse
              cuenta, no integrar. Y como después se ve que $F$ es
              estrictamente creciente, ese es además el **único** punto donde
              se anula.
          - texto: >-
              Resolviendo la integral y luego la ecuación $F(x)=0$
            mensaje: |
              Funciona y da lo mismo, pero es el camino largo: el apartado a)
              va antes que los demás precisamente porque se contesta sin
              resolver nada.
          - texto: >-
              Nunca vale cero, porque el integrando es siempre positivo
            mensaje: |
              El integrando es positivo, sí, pero eso no impide que la integral
              valga cero: basta con que los dos límites coincidan. Y coinciden
              en $x=0$.

      - tipo: calcular
        titulo: La primitiva
        pregunta: |
          $F(x)=\arctan(x+a)-\dfrac{\pi}{4}$. ¿Cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              El $2$ es el coeficiente de la $t$ en el denominador. Al completar
              el cuadrado, $t^{2}+2t+2=\left(t+1\right)^{2}+1$: lo que queda
              dentro del paréntesis es la **mitad**.
          - valor: '0'
            mensaje: |
              Con $a=0$ el denominador sería $t^{2}+1$, sin los términos
              lineales. Hay que completar el cuadrado antes de reconocer la
              arcotangente.
          - valor: '-1'
            mensaje: |
              Signo. $\left(t+1\right)^{2}+1$ lleva un más, así que la primitiva
              es $\arctan(t+1)$.
        pista: |
          Completa el cuadrado en el denominador.
        desarrollo: |
          $$
          t^{2}+2t+2=\left(t+1\right)^{2}+1
          \;\Longrightarrow\;
          \int\frac{dt}{\left(t+1\right)^{2}+1}=\arctan\left(t+1\right)
          $$

          $$
          F(x)=\Bigl[\arctan(t+1)\Bigr]_{0}^{x}
          =\arctan(x+1)-\frac{\pi}{4}
          $$

      - tipo: calcular
        titulo: El punto de inflexión
        pregunta: |
          ¿En qué punto tiene $F$ su punto de inflexión?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              En $x=0$ está el cero de $F$, no el de $F''$. La segunda derivada
              es $\frac{-2(x+1)}{\left[(x+1)^{2}+1\right]^{2}}$, que se anula
              donde se anula $x+1$.
          - valor: '1'
            mensaje: |
              Signo. $x+1=0$ da $x=-1$, no $x=+1$.
          - valor: '-2'
            mensaje: |
              $-2$ sería el cero si el denominador fuera $\left(t+2\right)^{2}$.
              Al completar el cuadrado sale $t+1$.
        pista: |
          Deriva $F'(x)=\dfrac{1}{(x+1)^{2}+1}$ y busca dónde se anula.
        desarrollo: |
          $$
          F''(x)=\frac{-2\left(x+1\right)}{\left[\left(x+1\right)^{2}+1\right]^{2}}
          $$

          El denominador nunca se anula, así que el signo lo pone $-(x+1)$:
          positivo a la izquierda de $-1$ —convexa— y negativo a la derecha
          —cóncava—. Inflexión en $x=-1$, y solo ahí.

      - tipo: justificar
        pregunta: Ordena el estudio. Una pieza es falsa.
        piezas:
          - texto: >-
              $F(0)=0$ por definición, y como $F$ resulta ser estrictamente
              creciente, ese es el único punto donde se anula.
          - texto: >-
              Por el teorema fundamental,
              $F'(x)=\frac{1}{\left(x+1\right)^{2}+1}>0$ para todo $x$: $F$ es
              estrictamente creciente en todo $\mathbb{R}$.
          - texto: >-
              $F''$ se anula solo en $x=-1$ y cambia de signo: convexa a la
              izquierda, cóncava a la derecha, e inflexión ahí, donde además la
              pendiente es máxima y vale $1$.
          - texto: >-
              Como $F$ es estrictamente creciente en todo $\mathbb{R}$, su
              gráfica no puede tener asíntotas horizontales.
            trampa: true
            mensaje: |
              Las tiene, y son dos. Crecer siempre no impide estar acotada:
              $F(x)=\arctan(x+1)-\frac\pi4$ tiende a $\frac\pi4$ por la derecha
              y a $-\frac{3\pi}{4}$ por la izquierda. La gráfica es una «ese»
              tumbada entre dos rectas horizontales, y dibujarla sin ellas es
              dejarse el apartado d) a medias.
    resolucion: |
      **a) Sí, y sin calcular nada.** $F(0)=\int_{0}^{0}=0$ por definición. Y
      como en el apartado siguiente se ve que $F$ es estrictamente creciente,
      **es el único** punto donde se anula. Esa segunda frase es la que
      convierte un «sí» en una respuesta completa.

      **La primitiva, que hace falta para el dibujo.** Completando el cuadrado,

      $$
      t^{2}+2t+2=\left(t+1\right)^{2}+1
      \;\Longrightarrow\;
      F(x)=\arctan\left(x+1\right)-\frac{\pi}{4}
      $$

      **b) Crecimiento.** Por el teorema fundamental del Cálculo, sin necesidad
      de la primitiva,

      $$
      F'(x)=\frac{1}{\left(x+1\right)^{2}+1}>0\quad\text{para todo }x
      $$

      Estrictamente creciente en todo $\mathbb{R}$. **No hay extremos
      relativos.**

      **c) Concavidad.**

      $$
      F''(x)=\frac{-2\left(x+1\right)}{\left[\left(x+1\right)^{2}+1\right]^{2}}
      $$

      Convexa en $\left(-\infty,-1\right)$, cóncava en
      $\left(-1,+\infty\right)$, con **punto de inflexión en $x=-1$**. Allí la
      pendiente vale $1$, que es la mayor de toda la curva.

      **d) La gráfica.** Con las dos asíntotas horizontales:

      $$
      \lim_{x\to+\infty}F=\frac{\pi}{2}-\frac{\pi}{4}=\frac{\pi}{4},
      \qquad
      \lim_{x\to-\infty}F=-\frac{\pi}{2}-\frac{\pi}{4}=-\frac{3\pi}{4}
      $$

      <figure class="figura-examen">
      <svg viewBox="0 0 420 230" role="img" width="420" height="230"
           aria-labelledby="atn25-t atn25-d">
        <title id="atn25-t">La grafica de F, una ese tumbada entre dos asintotas</title>
        <desc id="atn25-d">Una curva que sube siempre, pasa por el origen, y se aplana
        a los dos lados sin llegar a tocar dos rectas horizontales: una por encima, en
        pi cuartos, y otra mas abajo, en menos tres pi cuartos. El punto de inflexion
        esta en x igual a menos uno.</desc>
