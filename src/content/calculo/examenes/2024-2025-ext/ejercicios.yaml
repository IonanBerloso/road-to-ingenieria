      <figcaption>
      La sección que contiene el eje. El paraboloide sube desde el origen hasta
      la altura uno, donde su radio vale raíz de tres, y desde ahí la esfera lo
      cierra hasta el polo, en la altura dos.
      </figcaption>
      </figure>

      **b) El volumen.** Discos perpendiculares al eje $Y$. El radio al cuadrado
      es $3y$ mientras manda el paraboloide y $4-y^{2}$ cuando manda la esfera:

      $$
      V=\pi\int_{0}^{1}3y\,dy+\pi\int_{1}^{2}\left(4-y^{2}\right)dy
      =\frac{3\pi}{2}+\pi\left[4y-\frac{y^{3}}{3}\right]_{1}^{2}
      $$

      $$
      =\frac{3\pi}{2}+\frac{5\pi}{3}=\boxed{\;\frac{19\pi}{6}\approx9{,}95\;}
      $$

      **c) El área, que son dos superficies.**

      El paraboloide, como superficie de revolución de la curva $y=\rho^{2}/3$
      con $\rho$ de $0$ a $\sqrt3$:

      $$
      A_{1}=2\pi\int_{0}^{\sqrt3}\rho\sqrt{1+\frac{4\rho^{2}}{9}}\,d\rho
      =\frac{3\pi}{2}\left[\left(\frac{7}{3}\right)^{3/2}-1\right]\approx12{,}08
      $$

      El casquete esférico, con la fórmula que evita integrar —el área de una
      zona esférica solo depende de la altura que abarca—:

      $$
      A_{2}=2\pi R h=2\pi\cdot2\cdot\left(2-1\right)=4\pi\approx12{,}57
      $$

      $$
      \boxed{\;A=\frac{3\pi}{2}\left[\left(\tfrac73\right)^{3/2}-1\right]+4\pi
      \approx24{,}65\;}
      $$

      **Lo que no cuenta.** El círculo de radio $\sqrt3$ donde se juntan las dos
      superficies **no** es parte del área: es una costura interior, con sólido
      a los dos lados. Solo cuentan las caras que separan el cuerpo del aire.

      **Y una casualidad que ayuda a comprobar.** Las dos superficies miden casi
      lo mismo, $12{,}08$ y $12{,}57$, aunque una abarca una altura de $1$ y la
      otra también. No es casualidad del todo: la del paraboloide está más
      inclinada, pero llega a un radio menor.

  - id: ex2425-ext-7-una-edo-homogenea-con-raiz
    titulo: Una ecuación con una raíz dentro, y el cambio que la deshace
    fuente: >-
      Ejercicio 2 del SEGUNDO PARCIAL · Convocatoria extraordinaria, 26 de junio
      de 2025 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Resolver la EDO
      $$
      -y\,dx+\left(x+\sqrt{xy}\right)dy=0,
      \qquad y(e)=e
      $$
    pide: La solución particular.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De qué tipo es esta ecuación?
        opciones:
          - texto: >-
              Homogénea: los dos coeficientes son homogéneos del mismo grado, el
              uno
            correcta: true
            mensaje: |
              Eso es. Sustituyendo $x\to tx$, $y\to ty$: el $-y$ se convierte en
              $-ty$ y el $x+\sqrt{xy}$ en $t\left(x+\sqrt{xy}\right)$, porque
              $\sqrt{t^{2}xy}=t\sqrt{xy}$. Los dos multiplican por $t$ a la
              primera, así que el cambio $x=vy$ la separa.
          - texto: Exacta
            mensaje: |
              No lo es: con $M=-y$ y $N=x+\sqrt{xy}$ sale $M_{y}=-1$ y
              $N_{x}=1+\frac{y}{2\sqrt{xy}}$, que no coinciden. Comprobarlo
              cuesta diez segundos y evita empezar por el camino equivocado.
          - texto: De variables separables
            mensaje: |
              El $\sqrt{xy}$ mezcla las dos variables dentro de una raíz y no se
              puede repartir a los dos lados. Es lo primero que hay que probar,
              pero aquí no sale.

      - tipo: calcular
        titulo: El cambio, y la constante
        pregunta: |
          Con $x=vy$ la ecuación queda $\dfrac{dy}{y}=\dfrac{dv}{\sqrt v}$, e
          integrando $\ln|y|=2\sqrt{v}+C$. ¿Cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Signo. En $(e,e)$ es $v=1$ y $\ln e=1$, así que $1=2\sqrt1+C$ da
              $C=1-2=-1$.
          - valor: '3'
            mensaje: |
              $3$ saldría de $1+2$. La ecuación es $1=2+C$, y hay que **despejar**
              $C$, no sumar.
          - valor: '0'
            mensaje: |
              Con $C=0$ el punto $(e,e)$ no cumpliría la igualdad: daría $1=2$.
        pista: |
          En el punto $(e,e)$ es $v=x/y=1$ y $\ln y=1$.
        desarrollo: |
          $$
          v=\frac{x}{y}=1,\qquad \ln e=1
          \;\Longrightarrow\;
          1=2\sqrt{1}+C
          \;\Longrightarrow\;
          C=-1
          $$

          $$
          \boxed{\;\ln y=2\sqrt{\frac{x}{y}}-1\;}
          $$

      - tipo: calcular
        titulo: Un punto de la solución
        pregunta: |
          ¿Cuánto vale $y$ cuando $x=2$?
        respuesta:
          tipo: numero
          valor: '2.3386'
          tolerancia: 0.002
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              La solución no es $y=x$: si lo fuera, $\ln x=2-1=1$ solo se
              cumpliría en $x=e$. Pasa por $(e,e)$, pero no es la bisectriz.
          - valor: '2.7182818'
            mensaje: |
              $e$ es el valor en $x=e$, que es el dato inicial. En $x=2$ la
              solución vale algo menos.
          - valor: '1.6487213'
            mensaje: |
              Parece $\sqrt{e}$. La ecuación implícita hay que resolverla
              numéricamente o dejarla como está: no se despeja.
        pista: |
          Hay que resolver $\ln y=2\sqrt{2/y}-1$, y no se despeja: se tantea.
        desarrollo: |
          La ecuación $\ln y-2\sqrt{2/y}+1=0$ no tiene solución en forma
          cerrada. Tanteando: con $y=2{,}34$ el lado izquierdo vale
          $0{,}8502-1{,}8493+1=0{,}0009$, prácticamente cero.

          $$
          y(2)\approx2{,}3386
          $$

          En el examen no hay que dar este número: **la respuesta es la ecuación
          implícita**. Está aquí para que puedas comprobar la tuya.

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Los dos coeficientes son homogéneos de grado $1$, porque
              $\sqrt{t^{2}xy}=t\sqrt{xy}$: la ecuación es homogénea.
          - texto: >-
              Con $x=vy$ y $dx=v\,dy+y\,dv$, los términos en $vy$ se cancelan y
              queda $y\sqrt v\,dy=y^{2}\,dv$, o sea
              $\frac{dy}{y}=\frac{dv}{\sqrt v}$.
          - texto: >-
              Integrando, $\ln|y|=2\sqrt v+C$, y deshaciendo el cambio con
              $v=\frac{x}{y}$ e imponiendo $y(e)=e$ sale
              $\ln y=2\sqrt{\frac{x}{y}}-1$.
          - texto: >-
              Como la solución queda en forma implícita, el ejercicio está mal
              resuelto: hay que despejar $y$ para terminarlo.
            trampa: true
            mensaje: |
              Una solución implícita es una solución completa. La mayoría de las
              ecuaciones homogéneas y exactas terminan así, y despejar es a
              menudo imposible — aquí lo es. Lo que sí hay que hacer es **usar
              la condición inicial** para fijar la constante, y eso ya está
              hecho. Dejar la respuesta con la $C$ dentro sí sería incompleto.
    resolucion: |
      **Clasificar primero, que es medio ejercicio.** Con $M=-y$ y
      $N=x+\sqrt{xy}$:

      - ¿separable? No: el $\sqrt{xy}$ mezcla las variables.
      - ¿exacta? $M_{y}=-1$ y $N_{x}=1+\frac{y}{2\sqrt{xy}}$. No.
      - ¿homogénea? Sustituyendo $x\to tx$, $y\to ty$, los dos coeficientes
        quedan multiplicados por $t$ —porque $\sqrt{t^{2}xy}=t\sqrt{xy}$—.
        **Sí**, de grado $1$.

      **El cambio.** Como la $y$ aparece más limpia, conviene despejar $x$:
      $x=vy$, $dx=v\,dy+y\,dv$.

      $$
      -y\left(v\,dy+y\,dv\right)+\left(vy+\sqrt{vy\cdot y}\right)dy=0
      $$

      $$
      -yv\,dy-y^{2}dv+vy\,dy+y\sqrt{v}\,dy=0
      $$

      Los dos términos en $vy\,dy$ **se cancelan**, y queda

      $$
      y\sqrt{v}\,dy=y^{2}\,dv
      \;\Longrightarrow\;
      \frac{dy}{y}=\frac{dv}{\sqrt{v}}
      $$

      que ya es de variables separadas.

      **Integrando.**

      $$
      \ln|y|=2\sqrt{v}+C
      \qquad\text{con}\qquad v=\frac{x}{y}
      $$

      **La condición inicial.** En $(e,e)$ es $v=1$ y $\ln e=1$:

      $$
      1=2+C\;\Longrightarrow\;C=-1
      $$

      $$
      \boxed{\;\ln y=2\sqrt{\frac{x}{y}}-1\;}
      $$

      **La comprobación, que aquí se puede hacer sin despejar.** Derivando la
      igualdad implícitamente y despejando $y'$ sale exactamente
      $y'=\frac{y}{x+\sqrt{xy}}$, que es la EDO original escrita como
      $\frac{dy}{dx}$. Comprobado en tres puntos: en $x=2$, $x=e$ y $x=4$ la
      pendiente de la curva y la que pide la ecuación coinciden hasta el sexto
      decimal.

      **Y por qué el cambio se hace con $x=vy$ y no con $y=vx$.** Los dos
      funcionan; este sale más corto porque deja el $\sqrt{v}$ solo en un lado.
      Con $y=vx$ aparece $\sqrt{v}$ multiplicando a $v$ y la separación cuesta
      un paso más. Probar los dos y quedarse con el que salga es legítimo.

