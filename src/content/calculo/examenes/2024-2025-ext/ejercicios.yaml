ejercicios:
  - id: ex2425-ext-1-el-arco-capaz-de-noventa-grados
    titulo: Un cociente cuyo argumento es recto, y la media circunferencia que sale
    fuente: >-
      Ejercicio 1 del PRIMER PARCIAL · Convocatoria extraordinaria, 26 de junio
      de 2025 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Calcular y representar geométricamente los afijos de los números
      complejos $z$ que verifican la condición siguiente:
      $$
      \arg\left(\frac{z-2}{z-1}\right)=\frac{\pi}{2}
      $$
    pide: El lugar geométrico, calculado y dibujado.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dice geométricamente que ese cociente tenga argumento
          $\frac\pi2$?
        opciones:
          - texto: >-
              Que el vector que va de $2$ a $z$ y el que va de $1$ a $z$ forman
              un ángulo recto
            correcta: true
            mensaje: |
              Eso es. El argumento de un cociente es la **resta** de los
              argumentos, así que la condición dice que esos dos vectores se
              cortan en ángulo recto en $z$. Y el conjunto de puntos desde los
              que un segmento se ve bajo $90^{\circ}$ es una circunferencia con
              ese segmento por diámetro.
          - texto: Que $z$ equidista de $1$ y de $2$
            mensaje: |
              Eso sería $\left|z-1\right|=\left|z-2\right|$, una condición sobre
              los **módulos**, y da la mediatriz. Aquí la condición es sobre el
              **argumento**, que es la otra mitad de la información.
          - texto: Que $z$ está a distancia $\frac\pi2$ del punto $2$
            mensaje: |
              $\frac\pi2$ es un ángulo, no una distancia. Y el argumento nunca
              mide distancias: mide direcciones.

      - tipo: calcular
        titulo: El centro
        pregunta: |
          El lugar es un arco de la circunferencia $\left(x-c\right)^{2}+y^{2}
          =\rho^{2}$. ¿Cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es uno de los dos extremos del diámetro, no el centro. El
              centro es el punto medio entre $1$ y $2$.
          - valor: '2'
            mensaje: |
              $2$ es el otro extremo. El centro está justo en medio de los dos.
          - valor: '0'
            mensaje: |
              El origen no pinta nada aquí: la condición solo habla de las
              distancias y direcciones a $1$ y a $2$.
        pista: |
          Es el punto medio del segmento que une los dos puntos que aparecen en
          el enunciado.
        desarrollo: |
          Escribiendo $\frac{z-2}{z-1}=it$ con $t>0$ y despejando,

          $$
          z=\frac{2-it}{1-it}=\frac{2+t^{2}+it}{1+t^{2}}
          $$

          De ahí $x-1=\frac{1}{1+t^{2}}$ y $y=t\left(x-1\right)$, y eliminando
          $t$ sale $y^{2}=\left(2-x\right)\left(x-1\right)$, es decir

          $$
          \left(x-\tfrac32\right)^{2}+y^{2}=\tfrac14
          $$

      - tipo: verificar
        titulo: La región, escrita como condición
        pregunta: |
          Escribe la condición del enunciado tal cual, y comprueba que tu
          versión simplificada dibuja lo mismo.
        condicion: 'arg((z-2)/(z-1)) = pi/2'
        ventana:
          x: [-1, 4]
          y: [-2, 2]
        pista: |
          Es media circunferencia, no una entera: el signo del argumento
          selecciona un lado del eje real.
        desarrollo: |
          La curva completa $\left(x-\frac32\right)^{2}+y^{2}=\frac14$ es la
          circunferencia de diámetro $[1,2]$. Pero el enunciado pide argumento
          $+\frac\pi2$, no $\pm\frac\pi2$: en la mitad de abajo el cociente sale
          con argumento $-\frac\pi2$.

          Así que el lugar es la **semicircunferencia superior**, y sin los
          extremos $z=1$ y $z=2$, donde el cociente no está definido o vale
          cero.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El argumento de un cociente es la resta de los argumentos, así que
              la condición dice que los vectores $z-2$ y $z-1$ forman
              $90^{\circ}$.
          - texto: >-
              El conjunto de puntos desde los que el segmento de extremos $1$ y
              $2$ se ve bajo un ángulo recto es la circunferencia que tiene ese
              segmento por diámetro: centro $\frac32$ y radio $\frac12$.
          - texto: >-
              Como el enunciado pide $+\frac\pi2$ y no $\pm\frac\pi2$, solo vale
              la mitad de arriba; y los extremos $z=1$ y $z=2$ se quitan porque
              allí el cociente no tiene argumento.
          - texto: >-
              Los puntos $z=1$ y $z=2$ sí pertenecen al lugar, porque están en
              la circunferencia.
            trampa: true
            mensaje: |
              Están en la circunferencia y aun así **no** cumplen la condición.
              En $z=1$ el denominador se anula y el cociente ni existe; en $z=2$
              el numerador se anula y el cociente vale $0$, cuyo argumento es
              $0$ y no $\frac\pi2$. Un lugar geométrico se define por la
              condición, no por la curva que la contiene: los puntos donde la
              condición no tiene sentido se quitan, y decirlo vale puntos de
              COMP 4.
    resolucion: |
      **La lectura geométrica, que es la que da los puntos de explicación.**
      $\arg\frac{z-2}{z-1}=\arg(z-2)-\arg(z-1)$, así que la condición dice que
      el vector que va del punto $2$ hasta $z$ y el que va del punto $1$ hasta
      $z$ forman un ángulo recto.

      Dicho de otro modo: **desde $z$, el segmento que une $1$ y $2$ se ve bajo
      $90^{\circ}$**. Y eso, por el teorema de Tales, es la circunferencia que
      tiene ese segmento por diámetro.

      $$
      \text{centro }\tfrac32,\qquad \text{radio }\tfrac12
      $$

      **La cuenta, para quien no se fíe.** Con $\frac{z-2}{z-1}=it$, $t>0$:

      $$
      z=\frac{2-it}{1-it}=\frac{\left(2-it\right)\left(1+it\right)}{1+t^{2}}
      =\frac{2+t^{2}+it}{1+t^{2}}
      $$

      $$
      x-1=\frac{1}{1+t^{2}},\qquad y=\frac{t}{1+t^{2}}=t\left(x-1\right)
      $$

      Despejando $t^{2}=\frac{2-x}{x-1}$ y sustituyendo,

      $$
      y^{2}=\left(2-x\right)\left(x-1\right)
      \;\Longleftrightarrow\;
      \left(x-\tfrac32\right)^{2}+y^{2}=\tfrac14
      $$

      **Y ahora la mitad que sobra.** Que $t>0$ obliga a $y>0$: la mitad de
      abajo daría argumento $-\frac\pi2$. Y los dos extremos se caen: en $z=1$
      el cociente no existe y en $z=2$ vale $0$.

      $$
      \boxed{\;\left(x-\tfrac32\right)^{2}+y^{2}=\tfrac14,\quad y>0\;}
      $$

      <figure class="figura-examen">
      <svg viewBox="0 0 380 210" role="img" width="380" height="210"
