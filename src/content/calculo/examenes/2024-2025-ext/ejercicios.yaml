      **Lo que este ejercicio evalúa de verdad.** Los cuatro apartados se
      pueden contestar **sin resolver la integral**: el primero por definición y
      los otros dos con el teorema fundamental. La primitiva solo hace falta
      para las asíntotas del dibujo. Reconocer eso ahorra la mitad del tiempo, y
      es lo que separa el ejercicio de diez minutos del de media hora.

  - id: ex2425-ext-4-el-alambre-partido-en-dos
    titulo: Un alambre, un cuadrado, un triángulo y el corte que minimiza
    fuente: >-
      Ejercicio 4 del PRIMER PARCIAL · Convocatoria extraordinaria, 26 de junio
      de 2025 · Cálculo, UPV/EHU · Es el mismo enunciado, palabra por palabra,
      que el ejercicio 4 de la segunda evaluación de 2023-2024 · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Un alambre de 10 m de longitud se corta en dos partes. Con una de ellas se
      forma un cuadrado y con la otra un triángulo equilátero. ¿Cómo debe
      cortarse el alambre para que la suma de las áreas de las dos figuras sea
      mínima?
    pide: Dónde hay que cortar.

    pasos:
      - tipo: reconocer
        pregunta: |
          Si el trozo del cuadrado mide $x$, ¿cuánto mide su lado?
        opciones:
          - texto: $\dfrac{x}{4}$, porque ese trozo es el **perímetro** del cuadrado
            correcta: true
            mensaje: |
              Eso es, y es el paso que decide el ejercicio: el alambre da
              perímetros, no lados. Con el triángulo pasa lo mismo, dividiendo
              entre $3$.
          - texto: $x$, porque el trozo se dobla formando el lado
            mensaje: |
              El trozo entero se dobla formando **los cuatro** lados. Si el lado
              fuera $x$ harían falta $4x$ metros de alambre.
          - texto: $\sqrt{x}$, porque el área es el lado al cuadrado
            mensaje: |
              Esa relación es entre el lado y el **área**, no entre el lado y el
              perímetro. Aquí lo que se reparte son metros de alambre.

      - tipo: calcular
        titulo: Dónde cortar
        pregunta: |
          ¿Cuántos metros hay que dedicar al **cuadrado**?
        respuesta:
          tipo: numero
          valor: '4.3496447'
          tolerancia: 0.0005
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '5'
            mensaje: |
              Partir por la mitad es lo primero que uno prueba y no es el
              mínimo: con $5$ y $5$ el área sale $2{,}7402$, algo mayor que el
              mínimo $2{,}7185$. El triángulo equilátero es menos eficiente que
              el cuadrado, así que le toca **más** alambre.
          - valor: '5.6503553'
            mensaje: |
              Ese es el trozo del **triángulo**. La pregunta es por el cuadrado,
              que se lleva el resto: $10-5{,}6504$.
          - valor: '4.5454545'
            mensaje: |
              $\frac{50}{11}$ sale de olvidar el $\sqrt3$ del área del triángulo
              equilátero. Su área es $\frac{\sqrt3}{4}L^{2}$, no $\frac{L^{2}}{4}$.
        pista: |
          $A(x)=\dfrac{x^{2}}{16}+\dfrac{\sqrt3\left(10-x\right)^{2}}{36}$, y se
          deriva.
        desarrollo: |
          $$
          A'(x)=\frac{x}{8}-\frac{\sqrt3\left(10-x\right)}{18}=0
          \;\Longrightarrow\;
          18x=8\sqrt3\left(10-x\right)
          $$

          $$
          x=\frac{80\sqrt3}{18+8\sqrt3}=\frac{120\sqrt3-160}{11}\approx4{,}3496
          $$

      - tipo: calcular
        titulo: El área mínima
        pregunta: |
          ¿Cuánto vale la suma de las áreas en ese corte, en metros cuadrados?
        respuesta:
          tipo: numero
          valor: '2.7185283'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '2.7402'
            mensaje: |
              Ese es el área si cortas por la mitad. Está muy cerca del mínimo
              —la función es muy plana ahí— pero no es él.
          - valor: '4.8112522'
            mensaje: |
              Ese es el área si dedicas **todo** el alambre al triángulo. Es un
              extremo del intervalo, no un mínimo interior.
          - valor: '6.25'
            mensaje: |
              Ese es el área si haces solo el cuadrado, $\left(10/4\right)^{2}$,
              y es el **máximo** del problema. El cuadrado aprovecha mejor el
              perímetro, así que dárselo todo maximiza en vez de minimizar.
        pista: |
          Sustituye $x\approx4{,}3496$ en
          $A(x)=\frac{x^{2}}{16}+\frac{\sqrt3\left(10-x\right)^{2}}{36}$.
        desarrollo: |
          $$
          A\left(4{,}3496\right)=\frac{18{,}919}{16}+\frac{\sqrt3\cdot31{,}927}{36}
          =1{,}1824+1{,}5361=2{,}7185
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Si el cuadrado se lleva $x$ metros, su lado es $\frac{x}{4}$ y su
              área $\frac{x^{2}}{16}$; el triángulo se lleva $10-x$, su lado es
              $\frac{10-x}{3}$ y su área $\frac{\sqrt3}{4}\left(\frac{10-x}{3}
              \right)^{2}$.
          - texto: >-
              $A'(x)=\frac{x}{8}-\frac{\sqrt3\left(10-x\right)}{18}$ se anula en
              $x=\frac{120\sqrt3-160}{11}\approx4{,}35$, y como
              $A''(x)=\frac18+\frac{\sqrt3}{18}>0$, ese punto es un mínimo.
          - texto: >-
              El mínimo es interior y vale $2{,}7185$; los dos extremos del
              intervalo dan más —$4{,}81$ todo triángulo y $6{,}25$ todo
              cuadrado—, así que el máximo se alcanza haciendo solo el cuadrado.
          - texto: >-
              Como el cuadrado encierra más área que el triángulo con el mismo
              perímetro, para **minimizar** hay que darle al cuadrado la mayor
              parte del alambre.
            trampa: true
            mensaje: |
              Es al revés, y por eso está la trampa. Si el cuadrado es más
              eficiente, dárselo todo **maximiza** el área, no la minimiza — de
              hecho $A(10)=6{,}25$ es el máximo del problema. Para minimizar hay
              que cargar la mano en la figura menos eficiente, y por eso el
              triángulo se lleva $5{,}65$ metros de los diez.
    resolucion: |
      **El planteamiento, que es donde se decide.** El alambre reparte
      **perímetros**. Si el cuadrado se lleva $x$ metros:

      $$
      \text{lado}=\frac{x}{4},\qquad A_{\square}=\frac{x^{2}}{16}
      $$

      y el triángulo equilátero se lleva $10-x$:

      $$
      \text{lado}=\frac{10-x}{3},\qquad
      A_{\triangle}=\frac{\sqrt3}{4}\left(\frac{10-x}{3}\right)^{2}
      =\frac{\sqrt3\left(10-x\right)^{2}}{36}
      $$

      **La función a minimizar**, en $x\in[0,10]$:

      $$
      A(x)=\frac{x^{2}}{16}+\frac{\sqrt3\left(10-x\right)^{2}}{36}
      $$

      **El punto crítico.**

      $$
      A'(x)=\frac{x}{8}-\frac{\sqrt3\left(10-x\right)}{18}=0
      \;\Longrightarrow\;
      18x=80\sqrt3-8\sqrt3\,x
      $$

      $$
      x=\frac{80\sqrt3}{18+8\sqrt3}
      =\frac{120\sqrt3-160}{11}\approx4{,}3496
      $$

      Y es mínimo porque $A''(x)=\frac18+\frac{\sqrt3}{18}>0$ en todo punto: la
      función es una parábola hacia arriba.

      $$
      \boxed{\;\text{cuadrado }4{,}35\text{ m}\quad\text{triángulo }5{,}65
      \text{ m}\quad A_{\min}=2{,}72\ \text{m}^{2}\;}
      $$

      **Los extremos del intervalo, que hay que mirar.** $A(0)=4{,}81$ —todo
      triángulo— y $A(10)=6{,}25$ —todo cuadrado—. El mínimo es interior, y el
      **máximo** se alcanza dedicando todo el alambre al cuadrado.

      **Y ahí está la sorpresa del ejercicio.** El cuadrado aprovecha mejor el
      perímetro que el triángulo equilátero, así que la intuición dice «dale
      todo al cuadrado». Eso es exactamente lo que **maximiza**. Para minimizar
      hay que repartir, y cargar un poco más en la figura peor: el triángulo se
      lleva $5{,}65$ de los diez metros.

      **Racionalizar, porque en un examen sin calculadora hay que dejarlo
      bonito.** Multiplicando arriba y abajo por $18-8\sqrt3$, el denominador se
      convierte en $324-192=132$ y queda
      $x=\frac{1440\sqrt3-1920}{132}=\frac{120\sqrt3-160}{11}$. Esa fracción es
      la respuesta completa: no hace falta evaluarla.

  - id: ex2425-ext-5-el-sector-que-gira-alrededor-del-eje
    titulo: Un sector de disco que gira, y un perímetro con dos radios dentro
    fuente: >-
      Ejercicio 5 del PRIMER PARCIAL · Convocatoria extraordinaria, 26 de junio
      de 2025 · Cálculo, UPV/EHU · Es el mismo enunciado, palabra por palabra,
      que el ejercicio 4 de la tercera evaluación de 2022-2023 · El examen no
      publica solución: la resolución es propuesta nuestra, pendiente de
      revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea $D$ el recinto limitado por las condiciones $x^{2}+y^{2}\le 4$,
      $y\ge x$, $x\ge 0$.

      a) Representar gráficamente el recinto $D$.

      b) Calcular el volumen del cuerpo generado al girar el recinto $D$
      alrededor del eje OX.

      c) Calcular el perímetro de $D$.
    pide: El dibujo, el volumen y el perímetro.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué figura es $D$?
        opciones:
          - texto: >-
              Un sector circular de radio $2$, el que va de $45^{\circ}$ a
              $90^{\circ}$
            correcta: true
            mensaje: |
              Eso es. $y\ge x$ deja lo que está por encima de la bisectriz y
              $x\ge0$ lo que está a la derecha del eje $Y$: en polares, $\theta$
              entre $\frac\pi4$ y $\frac\pi2$, con $r$ de $0$ a $2$. Un octavo
              de disco.
          - texto: Un cuarto de disco
            mensaje: |
              Un cuarto sería si solo hubiera $x\ge0$ e $y\ge0$. La condición
              $y\ge x$ recorta la mitad de ese cuarto: queda un octavo.
          - texto: Un triángulo con un lado curvo
            mensaje: |
              La descripción no está mal —dos radios rectos y un arco— pero
              llamarlo triángulo despista para integrar. Lo que hay que ver es
              que en polares los cuatro límites son constantes.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen del cuerpo que se genera al girar $D$
          alrededor de OX?
        respuesta:
          tipo: numero
          valor: '11.8476876'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '16.7551608'
            mensaje: |
              $\frac{16\pi}{3}$ es el volumen de media esfera de radio $2$, que
              es lo que saldría girando el cuarto de disco entero. La condición
              $y\ge x$ quita una parte.
          - valor: '5.9238438'
            mensaje: |
              Justo la mitad del valor bueno. Parece que has usado
              $V=\pi\overline{y}A$ en vez de $V=2\pi\overline{y}A$: el teorema
              de Pappus lleva el $2\pi$ de la vuelta completa.
          - valor: '4.7123890'
            mensaje: |
              $\frac{3\pi}{2}$ no corresponde a ninguna de las cuentas: revisa
              el momento $\iint y\,dA$, que vale $\frac{4\sqrt2}{3}$.
        pista: |
          Por Pappus, $V=2\pi\overline{y}A$, y
          $\overline{y}A=\iint_{D}y\,dA=\frac{4\sqrt2}{3}$.
        desarrollo: |
          En polares, con $\theta\in\left[\frac\pi4,\frac\pi2\right]$ y
          $r\in[0,2]$:

          $$
          \iint_{D}y\,dA=\int_{\pi/4}^{\pi/2}\!\!\int_{0}^{2}
          r\operatorname{sen}\theta\cdot r\,dr\,d\theta
          =\left[-\cos\theta\right]_{\pi/4}^{\pi/2}\cdot\frac83
          =\frac{\sqrt2}{2}\cdot\frac83=\frac{4\sqrt2}{3}
          $$

          $$
          V=2\pi\cdot\frac{4\sqrt2}{3}=\frac{8\sqrt2\,\pi}{3}\approx11{,}848
          $$

      - tipo: calcular
        titulo: El perímetro
        pregunta: |
          ¿Cuánto mide el perímetro de $D$?
        respuesta:
          tipo: numero
          valor: '5.5707963'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.5707963'
            mensaje: |
              $\frac\pi2$ es solo el **arco**. El borde de $D$ tiene tres
              trozos: el arco y los dos radios rectos, que miden $2$ cada uno.
          - valor: '3.5707963'
            mensaje: |
              Te has dejado uno de los dos radios. El recinto está limitado por
              el eje $Y$ **y** por la recta $y=x$, y los dos tramos forman parte
              del borde.
          - valor: '12.5663706'
            mensaje: |
              $4\pi$ es la circunferencia entera de radio $2$. Del arco solo
              entra un octavo.
        pista: |
          Tres trozos: el arco de $45^{\circ}$ y los dos segmentos rectos que lo
          cierran.
        desarrollo: |
          $$
          \text{arco}=R\,\Delta\theta=2\cdot\frac\pi4=\frac\pi2,
          \qquad
          \text{dos radios}=2+2=4
          $$

          $$
          \text{perímetro}=\frac\pi2+4\approx5{,}571
          $$

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              El recinto no cruza el eje de giro —está entero en $y\ge x\ge0$—,
              así que se puede usar el teorema de Pappus.
          - texto: >-
              El teorema dice $V=2\pi\overline{y}A$, y $\overline{y}A$ es
              justamente el momento $\iint_{D}y\,dA$, que en polares vale
              $\frac{4\sqrt2}{3}$.
          - texto: >-
              Luego $V=\frac{8\sqrt2\pi}{3}\approx11{,}85$, y se puede
              comprobar por discos: $\pi\int_{0}^{2}\left(4-x^{2}-x^{2}\right)
              dx$ sobre el tramo donde la recta hace de tapa de abajo.
          - texto: >-
              Como el recinto es un octavo de disco, el volumen es un octavo del
              de la esfera de radio $2$.
            trampa: true
            mensaje: |
              La proporción del área **no** se traslada al volumen de
              revolución, porque al girar cada trozo barre un anillo distinto
              según lo lejos que esté del eje. Un octavo de la esfera sería
              $\frac{4}{3}\pi\cdot8/8=\frac{4\pi}{3}\approx4{,}19$, y el volumen
              real es casi el triple. La parte del recinto que está lejos del eje
              barre mucho más, y eso es lo que dice el $\overline{y}$ de Pappus.
    resolucion: |
      **a) El recinto.** Tres condiciones y las tres son fáciles de leer:
      dentro del disco de radio $2$, por encima de la bisectriz $y=x$, y a la
      derecha del eje $Y$. En polares eso es

      $$
      \frac\pi4\le\theta\le\frac\pi2,\qquad 0\le r\le 2
      $$

      un **sector de $45^{\circ}$**, o sea un octavo de disco.

