    pide: Cuál de los dos trabajos es mayor, razonado.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué no basta con mirar si el campo es conservativo?
        opciones:
          - texto: >-
              Porque **no** lo es: $Q_{x}-P_{y}=3x^{2}+3y^{2}$ no se anula, así
              que los dos caminos dan cosas distintas
            correcta: true
            mensaje: |
              Eso es, y la comprobación de diez segundos aquí sirve para lo
              contrario de lo habitual: confirma que **sí** hay que trabajar. Y
              de paso da la herramienta, porque esa diferencia es justo lo que
              integra Green.
          - texto: >-
              Porque los dos caminos no tienen los mismos extremos
            mensaje: |
              Sí los tienen: los dos van de $(-a,a)$ a $(a,a)$. Si el campo
              fuera conservativo darían lo mismo, y la pregunta no tendría
              sentido.
          - texto: >-
              Porque $C_{1}$ es curva y $C_{2}$ son rectas, y eso ya hace que
              den distinto
            mensaje: |
              La forma del camino no decide nada por sí sola: en un campo
              conservativo un arco y una recta entre los mismos puntos dan
              exactamente lo mismo. Lo que decide es el campo.

      - tipo: calcular
        titulo: El punto P
        pregunta: |
          $P(a,a)$ está en la circunferencia de radio $3$. ¿Cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '2.1213203'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '3'
            mensaje: |
              $3$ es el radio, y sería la respuesta si $P$ estuviera sobre un
              eje. Como sus dos coordenadas son iguales, $a^{2}+a^{2}=9$.
          - valor: '1.5'
            mensaje: |
              La mitad del radio no tiene por qué estar en la circunferencia.
              Hay que imponer que el punto la cumpla.
          - valor: '4.5'
            mensaje: |
              $4{,}5$ es $a^{2}$, no $a$. Falta la raíz.
        pista: |
          $a^{2}+a^{2}=9$.
        desarrollo: |
          $$
          2a^{2}=9\;\Longrightarrow\;a=\frac{3}{\sqrt2}=\frac{3\sqrt2}{2}
          \approx2{,}1213
          $$

          Los dos segmentos de $C_{2}$ están sobre las rectas $y=x$ e $y=-x$, y
          eso es lo que hace que el sector que encierran sea de $90^{\circ}$.

      - tipo: calcular
        titulo: La diferencia
        pregunta: |
          ¿Cuánto vale $\left|W(C_{1})-W(C_{2})\right|$?
        respuesta:
          tipo: numero
          valor: '95.4258842'
          tolerancia: 0.01
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '31.8086281'
            mensaje: |
              $\frac{81\pi}{8}$ sale de olvidar el $3$ del integrando: lo que se
              integra es $3\left(x^{2}+y^{2}\right)$, no $x^{2}+y^{2}$.
          - valor: '190.8517684'
            mensaje: |
              El doble. Probablemente has integrado sobre el semicírculo entero
              en vez de sobre el sector de $90^{\circ}$ que hay entre las dos
              curvas.
          - valor: '63.6172562'
            mensaje: |
              $\frac{81\pi}{4}$ saldría con un radio o un ángulo mal puestos.
              Repasa: $3\cdot\frac{\pi}{2}\cdot\frac{81}{4}$.
        pista: |
          Green sobre la región encerrada, que en polares es el sector
          $\frac\pi4\le\theta\le\frac{3\pi}{4}$ con $r$ de $0$ a $3$.
        desarrollo: |
          $$
          Q_{x}-P_{y}=3x^{2}+3y^{2}=3r^{2}
          $$

          $$
          \iint_{R}3r^{2}\,dA=3\int_{\pi/4}^{3\pi/4}\!\!\int_{0}^{3}r^{2}\cdot r
          \,dr\,d\theta=3\cdot\frac{\pi}{2}\cdot\frac{81}{4}=\frac{243\pi}{8}
          \approx95{,}43
          $$

      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              El campo no es conservativo —$Q_{x}-P_{y}=3\left(x^{2}+y^{2}\right)
              \ne0$—, así que los dos caminos dan resultados distintos y la
              pregunta tiene sentido.
          - texto: >-
              $C_{1}$ seguida de $C_{2}$ recorrida al revés forma una curva
              cerrada que encierra el sector de $90^{\circ}$ entre las dos
              rectas y el arco, y se recorre en sentido **horario**.
          - texto: >-
              Por Green, $W(C_{1})-W(C_{2})=-\iint_{R}3\left(x^{2}+y^{2}\right)
              dA=-\frac{243\pi}{8}$, luego el trabajo por $C_{2}$ es mayor.
          - texto: >-
              Como $C_{1}$ es más larga que $C_{2}$, era de esperar que diera
              más trabajo.
            trampa: true
            mensaje: |
              La longitud del camino no decide el trabajo: el campo puede
              empujar a favor en un tramo y en contra en otro. Aquí pasa lo
              contrario de lo que dice la pieza — el camino largo da **menos**—,
              y además $W(C_{2})$ vale exactamente $0$ mientras que
              $W(C_{1})=-\frac{243\pi}{8}$ es negativo. Un trabajo puede ser
              negativo, y uno nulo puede ser el mayor de dos.
    resolucion: |
      **Lo primero, la comprobación de diez segundos.** Con $P=2x-y^{3}$ y
      $Q=4y+x^{3}$:

      $$
      \frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}
      =3x^{2}+3y^{2}\ne0
      $$

      El campo **no** es conservativo, así que los dos caminos dan cosas
      distintas y la pregunta tiene sentido. Aquí la comprobación no ahorra
      trabajo: lo confirma. Pero de paso entrega la herramienta.

      **El punto $P$.** Está en la circunferencia de radio $3$ y tiene las dos
      coordenadas iguales: $2a^{2}=9$, o sea $a=\frac{3}{\sqrt2}$. Los dos
      segmentos de $C_{2}$ van sobre $y=-x$ e $y=x$, así que el sector entre
      las dos curvas abarca de $\frac\pi4$ a $\frac{3\pi}{4}$: **noventa
      grados**.

      **Green, sin calcular ninguna de las dos integrales.** La curva cerrada
      formada por $C_{1}$ y $C_{2}$ recorrida al revés encierra ese sector. Y
      se recorre en sentido **horario** —por arriba de izquierda a derecha, y
      de vuelta por abajo—, así que hay que poner un signo menos:

      $$
      W(C_{1})-W(C_{2})=-\iint_{R}3\left(x^{2}+y^{2}\right)dA
      $$

      En polares la integral es inmediata:

      $$
      \iint_{R}3r^{2}\,dA=3\int_{\pi/4}^{3\pi/4}d\theta\int_{0}^{3}r^{3}dr
      =3\cdot\frac{\pi}{2}\cdot\frac{81}{4}=\frac{243\pi}{8}\approx95{,}43
      $$

      $$
      \boxed{\;W(C_{1})-W(C_{2})=-\frac{243\pi}{8}<0
      \;\Longrightarrow\;\text{gana }C_{2}\;}
      $$

      **Y el regalo, que conviene ver.** $W(C_{2})$ vale **exactamente cero**, y
      sale sin integrar nada raro. Sobre el tramo $y=x$, con $dy=dx$:

      $$
      \left(2x-x^{3}\right)dx+\left(4x+x^{3}\right)dx=6x\,dx
      $$

      y sobre $y=-x$, con $dy=-dx$, sale también $6x\,dx$. Así que

      $$
      W(C_{2})=\int_{-a}^{0}6x\,dx+\int_{0}^{a}6x\,dx
      =-3a^{2}+3a^{2}=0
      $$

      Los dos tramos se cancelan. Con lo cual
      $W(C_{1})=-\frac{243\pi}{8}\approx-95{,}43$: **negativo**, y por eso el
      camino corto gana.

      **La lectura que puntúa en COMP 4.** El camino más largo no da más
      trabajo. El campo tiene una parte rotacional —los términos $-y^{3}$ y
      $x^{3}$— y esa parte se opone al recorrido por arriba. Contestar «$C_{2}$,
      porque el signo de la circulación por Green es negativo» es la respuesta
      completa, y no exige calcular ninguno de los dos trabajos por separado.

  - id: ex2425-ext-9-laplace-cuando-la-t-multiplica
    titulo: Una ecuación con la t delante, y una recta por respuesta
    fuente: >-
      Ejercicio 4 del SEGUNDO PARCIAL · Convocatoria extraordinaria, 26 de junio
      de 2025 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Resolver mediante la transformada de Laplace la siguiente EDO:
      $$
      t\,y''(t)+2y'(t)=5,
      \qquad y(0)=0,
      \qquad y'(0)=5/2
      $$
    pide: La solución.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el enunciado obliga a usar Laplace y no los métodos del tema
          9?
        opciones:
          - texto: >-
              Porque tiene **coeficientes variables**: la $t$ multiplica a
              $y''$, y los métodos de coeficientes constantes no se aplican
            correcta: true
            mensaje: |
              Eso es. Y la propiedad que lo resuelve es
              $\mathcal{L}\{t\,f(t)\}=-F'(s)$: multiplicar por $t$ es derivar la
              transformada, y eso convierte la ecuación algebraica en una
              ecuación diferencial de primer orden en $Y(s)$.
          - texto: Porque el segundo miembro es una constante
            mensaje: |
              Un segundo miembro constante es el caso más fácil de todos para
              los coeficientes indeterminados. Lo que estorba es la $t$ de la
              izquierda.
          - texto: >-
              Porque hay dos condiciones iniciales y el tema 9 solo admite una
            mensaje: |
              El tema 9 resuelve perfectamente problemas de segundo orden con
              dos condiciones iniciales. El obstáculo es otro.

      - tipo: calcular
        titulo: La ecuación en Y
        pregunta: |
          Al transformar, los términos en $sY$ se cancelan y queda
          $-s^{2}Y'=\dfrac{k}{s}$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2.5'
            mensaje: |
              $\frac52$ es $y'(0)$, no el segundo miembro. El $5$ viene de
              transformar la constante de la derecha:
              $\mathcal{L}\{5\}=\frac5s$.
          - valor: '1'
            mensaje: |
              $\frac1s$ es la transformada de $1$. Aquí el segundo miembro es
              $5$, y la linealidad lo saca fuera.
          - valor: '-5'
            mensaje: |
              El menos ya está en el lado izquierdo, en $-s^{2}Y'$. Poner otro
              cambiaría el signo de la solución.
        pista: |
          $\mathcal{L}\{t\,y''\}=-\frac{d}{ds}\left(s^{2}Y-sy(0)-y'(0)\right)$,
          y $\mathcal{L}\{2y'\}=2sY$.
        desarrollo: |
          $$
          \mathcal{L}\{t\,y''\}=-\frac{d}{ds}\left(s^{2}Y-\tfrac52\right)
          =-2sY-s^{2}Y'
          $$
          $$
          \mathcal{L}\{2y'\}=2\left(sY-0\right)=2sY
          $$

          Sumando, **los dos $2sY$ se cancelan** y queda

          $$
          -s^{2}Y'=\frac{5}{s}
          $$

      - tipo: calcular
        titulo: La solución
        pregunta: |
          ¿Cuánto vale $y(4)$?
        respuesta:
          tipo: numero
          valor: '10'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '20'
            mensaje: |
              $20=5\cdot4$: te falta el medio. La solución es
              $y=\frac52t$, no $5t$.
          - valor: '2.5'
            mensaje: |
              $\frac52$ es la pendiente, o sea $y'(0)$. La pregunta es por el
              valor de $y$ en $t=4$.
          - valor: '5'
            mensaje: |
              $5$ es el segundo miembro de la ecuación. La solución en $t=4$
              vale el doble.
        pista: |
          De $Y'=-\frac{5}{s^{3}}$ sale $Y=\frac{5}{2s^{2}}$, y esa es la
          transformada de una recta.
        desarrollo: |
          $$
          Y'=-\frac{5}{s^{3}}
          \;\Longrightarrow\;
          Y=\frac{5}{2s^{2}}+K
          $$

          $K=0$ porque toda transformada tiende a cero cuando $s\to\infty$. Y
          $\frac{1}{s^{2}}$ es la transformada de $t$:

          $$
          y(t)=\frac52\,t
          \;\Longrightarrow\;
          y(4)=10
          $$

      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Como la $t$ multiplica a $y''$, hay que usar
              $\mathcal{L}\{t\,f\}=-F'(s)$: se transforma $y''$ como siempre y
              luego se deriva respecto de $s$ con un signo menos.
          - texto: >-
              Los términos en $sY$ que salen de las dos derivadas se cancelan, y
              queda la ecuación de primer orden $-s^{2}Y'=\frac{5}{s}$, o sea
              $Y'=-\frac{5}{s^{3}}$.
          - texto: >-
              Integrando, $Y=\frac{5}{2s^{2}}+K$, y $K=0$ porque una transformada
              tiende a cero en el infinito. Antitransformando, $y=\frac52t$.
          - texto: >-
              La constante $K$ de la integración se fija con la condición
              inicial $y(0)=0$.
            trampa: true
            mensaje: |
              Las condiciones iniciales ya entraron al transformar, y de hecho
              aquí las dos se usaron ahí. La constante que aparece al integrar
              la ecuación en $Y(s)$ es de otra naturaleza, y se fija con un
              hecho del dominio de $s$: **toda transformada de Laplace tiende a
              cero cuando $s\to\infty$**. Si $K$ no fuera cero, $Y$ tendría un
              término constante y no sería la transformada de nada.
    resolucion: |
      **Por qué Laplace.** La $t$ delante de $y''$ hace que los coeficientes
      sean variables, y los métodos del tema 9 —característica y coeficientes
      indeterminados— dan por hecho que son constantes. La propiedad que salva
      el caso es

      $$
      \mathcal{L}\left\{t\,f(t)\right\}=-F'(s)
      $$

      **Transformando término a término.** Con $y(0)=0$ e $y'(0)=\frac52$:

      $$
      \mathcal{L}\{t\,y''\}
      =-\frac{d}{ds}\left(s^{2}Y-s\cdot0-\tfrac52\right)
      =-\left(2sY+s^{2}Y'\right)
      $$

      $$
      \mathcal{L}\{2y'\}=2\left(sY-0\right)=2sY,
      \qquad
      \mathcal{L}\{5\}=\frac{5}{s}
      $$

      Sumando las tres, **los $2sY$ se cancelan**:

      $$
      -2sY-s^{2}Y'+2sY=\frac{5}{s}
      \;\Longrightarrow\;
      -s^{2}Y'=\frac{5}{s}
      \;\Longrightarrow\;
      Y'=-\frac{5}{s^{3}}
      $$

      **Una ecuación de primer orden, e inmediata.**

      $$
      Y=\frac{5}{2s^{2}}+K
      $$

      **Y $K=0$**, por un motivo que hay que decir en voz alta: toda
      transformada de Laplace tiende a cero cuando $s\to\infty$. Un término
      constante sobreviviría a ese límite, así que no puede estar.

      $$
      Y(s)=\frac{5}{2s^{2}}
      \;\Longrightarrow\;
      \boxed{\;y(t)=\frac{5}{2}\,t\;}
      $$

      **La comprobación, y es de cinco segundos.** Con $y=\frac52t$ se tiene
      $y'=\frac52$ e $y''=0$:

      $$
      t\cdot0+2\cdot\frac52=5\quad\checkmark
      $$

      y las dos condiciones iniciales se cumplen: $y(0)=0$ ✓ y
      $y'(0)=\frac52$ ✓.

      **Lo que sorprende del resultado.** Una ecuación de segundo orden con
      coeficientes variables y la solución es una **recta**. Tiene sentido si se
      mira la ecuación de otro modo: si $y''=0$, la ecuación se reduce a
      $2y'=5$, y eso lo cumple exactamente $y=\frac52t$. El camino por Laplace
      es el que **demuestra** que no hay ninguna otra.

  - id: ex2425-ext-10-la-ampliacion-par-de-t-mas-pi
    titulo: La ampliación par, dos puntos enormes y la suma de los impares
    fuente: >-
      Ejercicio 5 del SEGUNDO PARCIAL · Convocatoria extraordinaria, 26 de junio
      de 2025 · Cálculo, UPV/EHU · El examen no publica solución: la resolución
      es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea la función $f(t)=t+\pi$, $t\in(0,\pi)$.

      a) Obtener la ampliación par y periódica, $F(t)$, de la función $f(t)$.

      b) Dibujar la función $f(t)$ y la función ampliada $F(t)$.

      c) Calcular la serie de Fourier, $S(t)$, de $F(t)$.

      d) Calcular, justificando la respuesta, los valores de $S(t)$ y $F(t)$ en
      los puntos $t=88\pi$ y $t=\dfrac{81}{4}\pi$.

      e) Calcular $\displaystyle\sum_{n=0}^{\infty}\frac{1}{\left(2n+1\right)^{2}}$.
    pide: Los cinco apartados.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo es la ampliación **par** de $f(t)=t+\pi$ en $(-\pi,0)$?
        opciones:
          - texto: $F(t)=-t+\pi$, o sea $F(t)=\left|t\right|+\pi$ en todo el periodo
            correcta: true
            mensaje: |
              Eso es. La par cumple $F(-t)=F(t)$, así que en la mitad izquierda
              se pone lo mismo con $-t$ dentro. Y las dos mitades juntas son
              $\left|t\right|+\pi$: una uve con el vértice en $\pi$.
          - texto: $F(t)=-t-\pi$
            mensaje: |
              Ese es el reflejo **impar**, con el signo cambiado entero. La par
              solo cambia el signo de la variable, no el de la función.
          - texto: $F(t)=t+\pi$, la misma fórmula
            mensaje: |
              Con la misma fórmula la función sería $t+\pi$ en todo
              $(-\pi,\pi)$, que es impar respecto del punto $(0,\pi)$ pero no
              par. En $t=-\pi/2$ daría $\pi/2$ y la par da $3\pi/2$.

      - tipo: calcular
        titulo: El término constante
        pregunta: |
          ¿Cuánto vale $\dfrac{a_{0}}{2}$?
        respuesta:
          tipo: numero
          valor: '4.712389'
          tolerancia: 0.0005
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '9.4247780'
            mensaje: |
              $3\pi$ es $a_{0}$, no $a_{0}/2$. En la serie el término
              independiente lleva la mitad.
          - valor: '3.1415927'
            mensaje: |
              $\pi$ sería el valor medio si la función fuera constante e igual a
              $\pi$. La rampa sube hasta $2\pi$, así que la media es mayor.
          - valor: '6.2831853'
            mensaje: |
              $2\pi$ es el valor **máximo** de $F$, no su media. La media de una
              rampa de $\pi$ a $2\pi$ es $\frac{3\pi}{2}$.
        pista: |
          Es el valor medio de $F$ en un periodo, y por simetría basta con
          calcularlo en $(0,\pi)$.
        desarrollo: |
          $$
          \frac{a_{0}}{2}=\frac{1}{\pi}\int_{0}^{\pi}\left(t+\pi\right)dt
          =\frac{1}{\pi}\left(\frac{\pi^{2}}{2}+\pi^{2}\right)
          =\frac{3\pi}{2}\approx4{,}712
          $$

          Es la media entre $\pi$ y $2\pi$, que es lo que uno esperaría de una
          rampa recta.

      - tipo: calcular
        titulo: El valor en el punto grande
        pregunta: |
          ¿Cuánto vale $S\left(\dfrac{81}{4}\pi\right)$?
        respuesta:
          tipo: numero
          valor: '3.9269908'
          tolerancia: 0.0005
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '3.1415927'
            mensaje: |
              $\pi$ es el valor en $t=0$, que es donde cae el **otro** punto del
              apartado, $88\pi$. Este reduce a $\frac\pi4$, no a $0$.
          - valor: '0.7853982'
            mensaje: |
              $\frac\pi4$ es el punto reducido, no el valor de la función allí.
              $F\left(\frac\pi4\right)=\frac\pi4+\pi$.
          - valor: '63.6172512'
            mensaje: |
              Ese es $\frac{81}{4}\pi$ sin reducir. La serie es periódica: hay
              que restar múltiplos enteros de $2\pi$ antes de evaluar.
        pista: |
          $\frac{81}{4}\pi$ dividido entre $2\pi$ son $\frac{81}{8}=10{,}125$
          periodos.
        desarrollo: |
          $$
          \frac{81}{4}\pi-10\cdot2\pi=\frac{81\pi-80\pi}{4}=\frac{\pi}{4}
          $$

          Ahí $F$ es continua, así que la serie vale lo mismo que la función:

          $$
          S\left(\frac{81}{4}\pi\right)=F\left(\frac\pi4\right)
          =\frac\pi4+\pi=\frac{5\pi}{4}\approx3{,}927
          $$

      - tipo: justificar
        pregunta: Ordena el apartado e). Una pieza es falsa.
        piezas:
          - texto: >-
              Como $F$ es par, todos los $b_{n}$ son cero, y los cosenos salen
              $a_{n}=\frac{2}{\pi}\cdot\frac{(-1)^{n}-1}{n^{2}}$: cero si $n$ es
              par, y $-\frac{4}{\pi n^{2}}$ si es impar.
          - texto: >-
              Así que
              $S(t)=\frac{3\pi}{2}-\frac{4}{\pi}\sum_{n\ \text{impar}}
              \frac{\cos nt}{n^{2}}$.
          - texto: >-
              Evaluando en $t=0$, donde $F$ vale $\pi$ y es continua, queda
              $\pi=\frac{3\pi}{2}-\frac{4}{\pi}\sum\frac{1}{n^{2}}$, y de ahí
              la suma vale $\frac{\pi^{2}}{8}$.
          - texto: >-
              Se elige $t=0$ porque es donde la serie converge más deprisa.
            trampa: true
            mensaje: |
              Se elige $t=0$ porque ahí **todos los cosenos valen $1$**, y eso
              convierte la serie de Fourier en la suma numérica que se busca. La
              velocidad de convergencia no pinta nada: lo que se persigue es que
              los términos queden desnudos. Y hay que comprobar que el punto
              elegido no sea un salto — aquí no lo es, porque la ampliación par
              no salta en el origen.
    resolucion: |
      **a) y b) La ampliación.** La par cumple $F(-t)=F(t)$, así que en
      $(-\pi,0)$ hay que poner $-t+\pi$:

      $$
      F(t)=\left|t\right|+\pi\quad\text{en }(-\pi,\pi),
      \qquad\text{y periódica de periodo }2\pi
      $$

      Es una **uve** con el vértice en $(0,\pi)$ y los extremos en $2\pi$.

      <figure class="figura-examen">
      <svg viewBox="0 0 470 230" role="img" width="470" height="230"
           aria-labelledby="amp25-t amp25-d">
        <title id="amp25-t">La funcion del enunciado y su ampliacion par</title>
        <desc id="amp25-d">A la izquierda, un segmento de recta que sube desde pi
        hasta dos pi, definido solo entre cero y pi. A la derecha, la misma pieza
        reflejada y repetida: una sierra de uves con los valles en pi y los picos en
        dos pi, sin ningun salto.</desc>
