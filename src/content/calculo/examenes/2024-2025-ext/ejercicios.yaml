        <text class="amp25-l" x="175" y="17.9" fill="var(--alt)">F(t) = |t| + π, periódica</text>
      </svg>
      <figcaption>
      A la izquierda la función del enunciado, solo en el intervalo de cero a
      pi. A la derecha la ampliación par repetida en tres periodos: una sierra
      de uves con el vértice en pi y los picos en dos pi.
      </figcaption>
      </figure>

      Fíjate en dónde salta: **en ningún sitio**. La ampliación par nunca
      introduce un salto en el origen, y en $\pm\pi$ las dos ramas llegan al
      mismo valor $2\pi$. $F$ es continua en todo $\mathbb{R}$, y eso hace fácil
      el apartado d).

      **c) La serie.** Al ser par, todos los $b_{n}$ se anulan. El término
      constante es la media:

      $$
      \frac{a_{0}}{2}=\frac{1}{\pi}\int_{0}^{\pi}\left(t+\pi\right)dt
      =\frac{3\pi}{2}
      $$

      Y los cosenos, integrando por partes:

      $$
      a_{n}=\frac{2}{\pi}\int_{0}^{\pi}\left(t+\pi\right)\cos nt\,dt
      =\frac{2}{\pi}\cdot\frac{\left(-1\right)^{n}-1}{n^{2}}
      $$

      —el trozo con $\pi\cos nt$ se anula porque $\operatorname{sen}(n\pi)=0$—.
      Así que $a_{n}=0$ para $n$ par y $a_{n}=-\frac{4}{\pi n^{2}}$ para $n$
      impar:

      $$
      \boxed{\;S(t)=\frac{3\pi}{2}-\frac{4}{\pi}
      \sum_{n=0}^{\infty}\frac{\cos\left(\left(2n+1\right)t\right)}
      {\left(2n+1\right)^{2}}\;}
      $$

      **d) Los dos puntos.** Los dos se reducen primero.

      | punto | periodos | cae en | valor |
      |---|---|---|---|
      | $88\pi$ | $44$ exactos | $0$ | $S=F=\pi$ |
      | $\frac{81}{4}\pi$ | $\frac{81}{8}=10{,}125$ | $\frac\pi4$ | $S=F=\frac{5\pi}{4}$ |

      Y en los dos $S$ y $F$ **coinciden**, porque $F$ es continua en todas
      partes. Esa es la respuesta al «justificando la respuesta»: no hay ningún
      salto que aplicar. Con la ampliación **impar** no habría sido así.

      **e) La suma.** Evaluando la serie en $t=0$, donde todos los cosenos valen
      $1$ y $F$ vale $\pi$:

      $$
      \pi=\frac{3\pi}{2}-\frac{4}{\pi}\sum_{n=0}^{\infty}
      \frac{1}{\left(2n+1\right)^{2}}
      $$

      $$
      \frac{4}{\pi}\sum=\frac{\pi}{2}
      \;\Longrightarrow\;
      \boxed{\;\sum_{n=0}^{\infty}\frac{1}{\left(2n+1\right)^{2}}
      =\frac{\pi^{2}}{8}\approx1{,}2337\;}
      $$

      **Por qué el punto elegido es $t=0$ y no otro.** Porque ahí los cosenos
      valen todos $1$ y los términos quedan desnudos. Y porque es un punto de
      continuidad: si hubiera un salto, el lado izquierdo no sería $F(0)$ sino
      la media de los dos límites, y la cuenta saldría otra.
