          <text x="40" y="30" fill="var(--d1)">g(x) = 2(1−x)/(3−x)³</text>
          <text x="40" y="52" fill="var(--live)">h · Σ g = 0,12761</text>
          <text x="282" y="52" text-anchor="end" fill="var(--faint)">exacto: 1/8 = 0,125</text>
