      <figcaption>
      El teorema, en un dibujo: en algún punto interior la tangente a la curva es
      paralela a la cuerda que une los extremos. La demostración consiste en
      restarle la cuerda a la función y aplicar Rolle a lo que queda.
      </figcaption>
      </figure>

      **La demostración.** La idea es reducirlo a Rolle, que solo se aplica cuando
      la función vale lo mismo en los dos extremos. Como $f$ no lo cumple en
      general, se le resta la cuerda:

      $$
      g\left(x\right)=f\left(x\right)-\underbrace{\left[f\left(a\right)
      +\frac{f\left(b\right)-f\left(a\right)}{b-a}\left(x-a\right)\right]}
      _{\text{la cuerda}}
      $$

      Geométricamente, $g$ mide la **distancia vertical** de la curva a la
      cuerda.

      **Las hipótesis de Rolle se cumplen:**

      - $g$ es continua en $\left[a,b\right]$ y derivable en $\left(a,b\right)$,
        porque lo es $f$ y la cuerda es un polinomio de grado uno.
      - $g\left(a\right)=f\left(a\right)-f\left(a\right)-0=0$.
      - $g\left(b\right)=f\left(b\right)-f\left(a\right)
        -\left(f\left(b\right)-f\left(a\right)\right)=0$.

      **Rolle** da entonces un $c\in\left(a,b\right)$ con $g'\left(c\right)=0$. Y

      $$
      g'\left(x\right)=f'\left(x\right)
      -\frac{f\left(b\right)-f\left(a\right)}{b-a}
      $$

      así que

      $$
      g'\left(c\right)=0
      \;\Longleftrightarrow\;
      f'\left(c\right)=\frac{f\left(b\right)-f\left(a\right)}{b-a}
      \qquad\blacksquare
      $$

      **Que las hipótesis no sobran, con un contraejemplo cada una:**

      | falla | ejemplo | qué pasa |
      |---|---|---|
      | derivabilidad interior | $\left\|x\right\|$ en $\left[-1,1\right]$ | la cuerda es horizontal y $f'$ nunca es $0$ |
      | continuidad en un extremo | $f=x$ en $\left[0,1\right)$ y $f\left(1\right)=5$ | la cuerda tiene pendiente $5$ y $f'\equiv1$ |

      **Para qué sirve.** Casi todo lo que se usa a diario en la asignatura sale
      de aquí: que derivada nula implique función constante, que derivada positiva
      implique creciente, la regla de L'Hôpital, las cotas del resto de Taylor. Es
      el teorema con más descendencia del temario, y decirlo al final de la
      demostración es la clase de comentario que este ejercicio premia.

  - id: ex1213-ext-4-dos-integrales-con-truco
    titulo: Dos integrales, y en cada una hay que ver el truco
    fuente: >-
      Ejercicio 4 del PRIMER CUATRIMESTRAL · Convocatoria de junio, 17 de junio
      de 2013 · Cálculo – Industriales, Donostiako Eskola Politeknikoa (UPV/EHU)
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 8
      comp4: 2
    enunciado: |
      Calcular:

      a) $\displaystyle\int\frac{\cos x}
      {\operatorname{sen}^{2}x-6\operatorname{sen}x+5}\,dx$

      b) $\displaystyle\int_{0}^{1}\frac{x\,dx}{x^{2}+x+1}$
    pide: Las dos integrales.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado a), ¿qué hace que el cambio $u=\operatorname{sen}x$
          funcione?
        opciones:
          - texto: >-
              Que el numerador es exactamente $\cos x\,dx$, o sea
              $d\left(\operatorname{sen}x\right)$
            correcta: true
            mensaje: |
              Eso es. El coseno del numerador no está de adorno: es la derivada
              del seno, y sin él el cambio dejaría una $x$ suelta.
          - texto: >-
              Que $\operatorname{sen}^{2}x=1-\cos^{2}x$
            mensaje: |
              Esa identidad sirve para otros casos. Aquí no hace falta: el
              denominador ya está escrito entero en función del seno.
          - texto: >-
              Que $\operatorname{sen}x$ está acotado entre $-1$ y $1$
            mensaje: |
              Es cierto y tiene su utilidad —sirve para quitar los valores
              absolutos al final—, pero no es lo que hace posible el cambio.

      - tipo: calcular
        titulo: Las raíces del denominador
        pregunta: |
          ¿Cuál es la raíz mayor de $u^{2}-6u+5$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es la raíz menor. Las dos son $1$ y $5$: suman $6$ y multiplican
              $5$.
          - valor: '6'
            mensaje: |
              $6$ es la **suma** de las dos raíces, que es el coeficiente de $u$
              cambiado de signo.
          - valor: '3'
            mensaje: |
              $3$ es la media de las raíces, el vértice de la parábola. Las raíces
              están a $2$ de él, en $1$ y $5$.
        pista: |
          $u^{2}-6u+5=\left(u-1\right)\left(u-5\right)$.
        desarrollo: |
          $$
          u^{2}-6u+5=\left(u-1\right)\left(u-5\right)
          $$

          Dos raíces reales distintas, así que la descomposición en fracciones
          simples es la más sencilla posible.

      - tipo: calcular
        titulo: La integral definida del apartado b)
        pregunta: |
          ¿Cuánto vale $\int_{0}^{1}\frac{x\,dx}{x^{2}+x+1}$?
        respuesta:
          tipo: numero
          valor: '0.2470'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.5493'
            mensaje: |
              $\frac12\ln3$ es solo el trozo del logaritmo. Falta restarle la
              arcotangente, que aporta $-0{,}3023$.
          - valor: '0.8516'
            mensaje: |
              Has **sumado** la arcotangente en vez de restarla. Al escribir
              $x=\frac12\left(2x+1\right)-\frac12$, el segundo trozo va con signo
              menos.
          - valor: '1.0986'
            mensaje: |
              $\ln3$ es el logaritmo sin el $\frac12$ de delante, y además sin la
              arcotangente.
        pista: |
          $x=\frac{1}{2}\left(2x+1\right)-\frac12$, y
          $x^{2}+x+1=\left(x+\frac12\right)^{2}+\frac34$.
        desarrollo: |
          $$
          \int_{0}^{1}\frac{x\,dx}{x^{2}+x+1}
          =\frac12\ln3-\frac{1}{\sqrt3}\left(\frac{\pi}{3}-\frac{\pi}{6}\right)
          =\frac{\ln3}{2}-\frac{\pi}{6\sqrt3}
          $$

          $$
          \approx0{,}54931-0{,}30230=0{,}24701
          $$

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              Se escribe el numerador en función de la derivada del denominador:
              $x=\frac12\left(2x+1\right)-\frac12$.
          - texto: >-
              El primer trozo es inmediato:
              $\frac12\int\frac{2x+1}{x^{2}+x+1}dx=\frac12\ln\left(x^{2}+x+1\right)$.
          - texto: >-
              El segundo se completa el cuadrado,
              $x^{2}+x+1=\left(x+\frac12\right)^{2}+\frac34$, y da una
              arcotangente: $-\frac{1}{\sqrt3}\arctan\frac{2x+1}{\sqrt3}$.
          - texto: >-
              Como $x^{2}+x+1$ tiene raíces complejas, hay que descomponerlo en
              fracciones simples con denominadores complejos.
            trampa: true
            mensaje: |
              No hace falta salir de los reales. Un trinomio irreducible se trata
              **entero**, partiendo el numerador en «derivada del denominador» más
              «constante»: el primer trozo da logaritmo y el segundo arcotangente.
              Es el procedimiento estándar, y el que el examen espera.
    resolucion: |
      **a) El cambio que el numerador está pidiendo.** El $\cos x\,dx$ es
      exactamente $d\left(\operatorname{sen}x\right)$:

      $$
      u=\operatorname{sen}x
      \;\Longrightarrow\;
      \int\frac{\cos x\,dx}{\operatorname{sen}^{2}x-6\operatorname{sen}x+5}
      =\int\frac{du}{u^{2}-6u+5}
      $$

      El denominador se factoriza sin esfuerzo —dos raíces que suman $6$ y
      multiplican $5$—:

      $$
      u^{2}-6u+5=\left(u-1\right)\left(u-5\right)
      $$

      **Fracciones simples**, con el atajo de evaluar en cada raíz:

      $$
      \frac{1}{\left(u-1\right)\left(u-5\right)}=\frac{A}{u-1}+\frac{B}{u-5}
      $$

      | se hace | sale |
      |---|---|
      | $u=1$ | $1=A\left(1-5\right)\Rightarrow A=-\frac14$ |
      | $u=5$ | $1=B\left(5-1\right)\Rightarrow B=\frac14$ |

      $$
      \int=\frac14\ln\left|u-5\right|-\frac14\ln\left|u-1\right|+C
      =\frac14\ln\left|\frac{u-5}{u-1}\right|+C
      $$

      $$
      \boxed{\;\int\frac{\cos x\,dx}
      {\operatorname{sen}^{2}x-6\operatorname{sen}x+5}
      =\frac14\ln\left(\frac{5-\operatorname{sen}x}{1-\operatorname{sen}x}\right)+C\;}
      $$

      **Los valores absolutos se pueden quitar**, y decirlo suma: como
      $\operatorname{sen}x\in\left[-1,1\right]$, los dos paréntesis
      $u-5$ y $u-1$ son negativos, así que su cociente es positivo y basta con
      escribirlo con los signos dados la vuelta. El único punto conflictivo es
      $\operatorname{sen}x=1$, donde el denominador original se anula.

      **b) El trinomio irreducible.** $x^{2}+x+1$ tiene discriminante
      $1-4=-3<0$: no se factoriza en los reales, y no hay que intentarlo. El
      procedimiento es partir el numerador:

      $$
      x=\frac12\left(2x+1\right)-\frac12
      $$

      donde $2x+1$ es la derivada del denominador. Eso separa la integral en dos
      pedazos de tipo conocido:

      $$
      \int\frac{x\,dx}{x^{2}+x+1}
      =\underbrace{\frac12\int\frac{2x+1}{x^{2}+x+1}dx}_{\text{logaritmo}}
      -\underbrace{\frac12\int\frac{dx}{x^{2}+x+1}}_{\text{arcotangente}}
      $$

      El segundo sale completando el cuadrado:

      $$
      x^{2}+x+1=\left(x+\tfrac12\right)^{2}+\tfrac34
      \;\Longrightarrow\;
      \int\frac{dx}{x^{2}+x+1}
      =\frac{2}{\sqrt3}\arctan\frac{2x+1}{\sqrt3}
      $$

      $$
      \int\frac{x\,dx}{x^{2}+x+1}
      =\frac12\ln\left(x^{2}+x+1\right)
      -\frac{1}{\sqrt3}\arctan\frac{2x+1}{\sqrt3}+C
      $$

      **Evaluando entre $0$ y $1$**, y con los dos arcotangentes que salen
      redondos:

      $$
      \arctan\frac{3}{\sqrt3}=\arctan\sqrt3=\frac{\pi}{3},
      \qquad
      \arctan\frac{1}{\sqrt3}=\frac{\pi}{6}
      $$

      $$
      \boxed{\;\int_{0}^{1}\frac{x\,dx}{x^{2}+x+1}
      =\frac{\ln3}{2}-\frac{\pi}{6\sqrt3}\approx0{,}2470\;}
      $$

      **La comprobación de sentido.** El integrando va de $0$ en $x=0$ a
      $\frac13$ en $x=1$, creciendo; su media anda por $0{,}25$ y el intervalo
      mide $1$. El resultado $0{,}247$ encaja.

  - id: ex1213-ext-5-el-factor-de-potencias-y-el-cadaver
    titulo: Un factor integrante que hay que buscar, y un cadáver
    fuente: >-
      Ejercicio 1 del SEGUNDO CUATRIMESTRAL · Convocatoria de junio, 17 de junio
      de 2013 · Cálculo – Industriales, Donostiako Eskola Politeknikoa (UPV/EHU)
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 6
      comp4: 3
    enunciado: |
      a) Utilizar un factor integrante de la forma $x^{n}y^{m}$ para resolver la
      EDO $y\,dx+\left(x^{2}y^{2}-x\right)dy=0$.

      b) La policía ha encontrado el cadáver de una persona dentro de una
      habitación. Un modo de determinar aproximadamente la hora de la muerte,
      cuando ha ocurrido pocas horas antes, es estudiar el proceso de
      enfriamiento del cadáver. Se ha tomado la temperatura al cadáver a las
      12:00 y a las 13:00 horas, siendo estos valores 26 ºC y 24 ºC
      respectivamente. La habitación se encuentra a 20 ºC. Utilizando la ley de
      enfriamiento de Newton, estimar a qué hora falleció la persona.
    pide: La solución de la EDO y la hora de la muerte.

    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado b), ¿qué dato hay que poner uno mismo?
        opciones:
          - texto: >-
              La temperatura del cuerpo en el momento de la muerte, $37\,°$C,
              que el enunciado no da
            correcta: true
            mensaje: |
              Exacto, y hay que decirlo en voz alta: es un supuesto, no un dato.
              Sin él el problema no tiene solución numérica, y con otro valor la
              hora cambia.
          - texto: La constante de enfriamiento $k$
            mensaje: |
              Esa **sí** sale de los datos: las dos temperaturas medidas con una
              hora de diferencia la determinan.
          - texto: La temperatura de la habitación
            mensaje: |
              La da el enunciado: $20\,°$C. Y es la asíntota a la que tiende el
              cadáver.

      - tipo: calcular
        titulo: El exponente de la x
        pregunta: |
          En el factor integrante $x^{n}y^{m}$, ¿cuánto vale $n$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              Con $n=+2$ el término problemático crecería en vez de anularse. Lo
              que obliga a $n=-2$ es que el sumando en $x^{n+2}y^{m+2}$ no tiene
              con quién emparejarse, así que su coeficiente $n+2$ debe ser cero.
          - valor: '-1'
            mensaje: |
              Con $n=-1$ quedaría $M_{y}=\left(m+1\right)x^{-1}y^{m}$ frente a
              $N_{x}=x y^{m+2}$, que no coinciden ni ajustando $m$.
          - valor: '0'
            mensaje: |
              Con $n=0$ el factor no dependería de $x$, y la ecuación seguiría sin
              ser exacta.
        pista: |
          Al multiplicar, $N^{*}=x^{n+2}y^{m+2}-x^{n+1}y^{m}$, y su derivada
          respecto de $x$ trae un término en $y^{m+2}$ que $M^{*}_{y}$ no tiene.
        desarrollo: |
          $$
          M^{*}=x^{n}y^{m+1},
          \qquad
          N^{*}=x^{n+2}y^{m+2}-x^{n+1}y^{m}
          $$

          $$
          M^{*}_{y}=\left(m+1\right)x^{n}y^{m}
          $$

          $$
          N^{*}_{x}=\left(n+2\right)x^{n+1}y^{m+2}
          -\left(n+1\right)x^{n}y^{m}
          $$

          El sumando con $y^{m+2}$ no aparece en $M^{*}_{y}$, así que su
          coeficiente tiene que anularse: $n+2=0$, o sea $n=-2$. Y entonces
          $m+1=-\left(n+1\right)=1$, luego $m=0$: **el factor es
          $\frac{1}{x^{2}}$**.

      - tipo: calcular
        titulo: La hora de la muerte
        pregunta: |
          ¿Cuántas horas antes de las 12:00 falleció? (con dos decimales)
        respuesta:
          tipo: numero
          valor: '2.5685'
          tolerancia: 0.01
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '1.7'
            mensaje: |
              Parece salir de interpolar linealmente: si baja $2\,°$C por hora, de
              $37$ a $26$ irían $5{,}5$ horas. Pero el enfriamiento es
              **exponencial** y va más rápido cuanto más caliente está el cuerpo.
          - valor: '5.5'
            mensaje: |
              Esa es justamente la respuesta lineal, y sobreestima: al principio
              el cadáver pierde más de $2\,°$C por hora, así que tarda menos en
              llegar de $37$ a $26$.
          - valor: '2'
            mensaje: |
              $2$ horas darían $T=20+6\cdot\left(\frac32\right)^{2}=33{,}5\,°$C,
              todavía lejos de $37$.
        pista: |
          $37=20+6e^{-kt}$ con $k=\ln\frac32$, y $t$ sale negativo porque la
          muerte es anterior a las 12:00.
        desarrollo: |
          $$
          6e^{-kt}=17
          \;\Longrightarrow\;
          -kt=\ln\frac{17}{6}
          \;\Longrightarrow\;
          t=-\frac{\ln\left(17/6\right)}{\ln\left(3/2\right)}
          =-\frac{1{,}04145}{0{,}40546}=-2{,}5685
          $$

          Dos horas, treinta y cuatro minutos y siete segundos **antes** de las
          12:00: alrededor de las **9:26**.

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              La ley de Newton dice $T'=-k\left(T-20\right)$, cuya solución es
              $T\left(t\right)=20+A e^{-kt}$ con $t=0$ a las 12:00.
          - texto: >-
              $T\left(0\right)=26$ da $A=6$, y $T\left(1\right)=24$ da
              $6e^{-k}=4$, o sea $k=\ln\frac32\approx0{,}405$.
          - texto: >-
              Suponiendo $37\,°$C en el momento de la muerte,
              $6e^{-kt}=17$ da $t\approx-2{,}57$ horas: alrededor de las 9:26.
          - texto: >-
              Como el cadáver pierde $2\,°$C en la primera hora, de $37$ a $26$
              hay $11\,°$C y por tanto han pasado cinco horas y media.
            trampa: true
            mensaje: |
              El enfriamiento **no es lineal**: la velocidad es proporcional a la
              diferencia con el ambiente, así que a $37\,°$C el cuerpo perdía más
              de $4\,°$C por hora y a $26$ solo $2$. Extrapolar linealmente hacia
              atrás duplica el tiempo estimado —$5{,}5$ horas en vez de $2{,}6$— y
              cambiaría la hora de la muerte de las 9:26 a las 6:30.
    resolucion: |
      **a) Buscar el factor, no comprobarlo.** Este ejercicio es más duro que los
      de otras convocatorias, donde el factor venía dado: aquí solo se da su
      **forma**, $x^{n}y^{m}$, y hay que determinar los exponentes.

      La ecuación de partida, $M_{0}=y$ y $N_{0}=x^{2}y^{2}-x$, no es exacta:

      $$
      \frac{\partial M_{0}}{\partial y}=1,
      \qquad
      \frac{\partial N_{0}}{\partial x}=2xy^{2}-1
      $$

      Multiplicando por $x^{n}y^{m}$:

      $$
      M^{*}=x^{n}y^{m+1},
      \qquad
      N^{*}=x^{n+2}y^{m+2}-x^{n+1}y^{m}
      $$

      $$
      M^{*}_{y}=\left(m+1\right)x^{n}y^{m}
      $$

      $$
      N^{*}_{x}=\left(n+2\right)x^{n+1}y^{m+2}
      -\left(n+1\right)x^{n}y^{m}
      $$

      **Y ahora se igualan término a término.** En $M^{*}_{y}$ no hay ningún
      sumando con $y^{m+2}$, así que el de $N^{*}_{x}$ tiene que desaparecer
      solo:

      $$
      n+2=0\;\Longrightarrow\;n=-2
      $$

      Y con eso, igualando lo que queda:

      $$
      m+1=-\left(n+1\right)=1\;\Longrightarrow\;m=0
      $$

      $$
      \boxed{\;\mu\left(x,y\right)=\frac{1}{x^{2}}\;}
      $$

      **La ecuación ya exacta.** Con $M=\frac{y}{x^{2}}$ y
      $N=y^{2}-\frac1x$:

      $$
      M_{y}=\frac{1}{x^{2}}=N_{x}\;\checkmark
      $$

      $$
      F=\int\frac{y}{x^{2}}dx=-\frac{y}{x}+g\left(y\right),
      \qquad
      F_{y}=-\frac1x+g'\left(y\right)=y^{2}-\frac1x
      \;\Longrightarrow\;
      g=\frac{y^{3}}{3}
      $$

      $$
      \boxed{\;\frac{y^{3}}{3}-\frac{y}{x}=C\;}
      $$

      Y hay que decir que **el factor se anula donde $x=0$**, así que la recta
      $x=0$ queda fuera del análisis; de todos modos la ecuación original tampoco
      la admite como solución.

      **b) El cadáver.** La ley de enfriamiento de Newton dice que la velocidad de
      pérdida de calor es proporcional a la diferencia con el ambiente:

      $$
      \frac{dT}{dt}=-k\left(T-20\right)
      \;\Longrightarrow\;
      T\left(t\right)=20+A\,e^{-kt}
      $$

      Tomando $t=0$ a las 12:00, los dos datos determinan las dos constantes:

      | dato | ecuación | resultado |
      |---|---|---|
      | $T\left(0\right)=26$ | $20+A=26$ | $A=6$ |
      | $T\left(1\right)=24$ | $6e^{-k}=4$ | $k=\ln\frac32\approx0{,}4055$ |

      $$
      T\left(t\right)=20+6\left(\tfrac23\right)^{t}
      $$

      **El supuesto que hay que declarar.** El enunciado no dice a qué temperatura
      estaba el cuerpo en vida. Se toma $37\,°$C, que es lo habitual, y **hay que
      escribirlo como hipótesis**: es el dato que convierte el problema en una
      cuenta.

      $$
      37=20+6e^{-kt}
      \;\Longrightarrow\;
      e^{-kt}=\frac{17}{6}
      \;\Longrightarrow\;
      t=-\frac{\ln\left(17/6\right)}{\ln\left(3/2\right)}\approx-2{,}5685
      $$

      $$
      \boxed{\;2\text{ h }34\text{ min antes de las }12{:}00,
      \text{ o sea alrededor de las }9{:}26\;}
      $$

