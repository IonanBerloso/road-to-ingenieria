      **Por qué la respuesta lineal está tan lejos.** Entre las 12:00 y las 13:00
      el cadáver pierde $2\,°$C, y es tentador extrapolar: de $37$ a $26$ hay
      $11\,°$C, o sea cinco horas y media. Pero el enfriamiento es **más rápido
      cuanto más caliente está el cuerpo**: a $37\,°$C perdía
      $k\left(37-20\right)=6{,}9\,°$C por hora, más del triple que a $26$. Por eso
      el tiempo real es menos de la mitad del que da la extrapolación lineal.

      **Y una advertencia que este problema merece.** El modelo supone la
      habitación a temperatura constante y el cuerpo homogéneo. En la práctica el
      método sirve, como dice el enunciado, «cuando ha ocurrido pocas horas
      antes»; más allá de eso el cadáver se acerca tanto a los $20\,°$C que el
      logaritmo se dispara y la estimación pierde todo su valor.

  - id: ex1213-ext-6-el-paraboloide-dentro-de-la-esfera
    titulo: Un paraboloide tapado por una esfera
    fuente: >-
      Ejercicio 2 del SEGUNDO CUATRIMESTRAL · Convocatoria de junio, 17 de junio
      de 2013 · Cálculo – Industriales, Donostiako Eskola Politeknikoa (UPV/EHU)
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3
    enunciado: |
      Considerar el sólido definido por las condiciones $x^{2}+y^{2}\le3z$;
      $x^{2}+y^{2}+z^{2}\le4$.

      a) Dibujar el sólido y calcular su volumen.

      b) Calcular el área de su superficie.

      c) Calcular el centro de gravedad del sólido.
    pide: El dibujo, el volumen, el área y el centro de gravedad.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿A qué altura se cortan el paraboloide y la esfera?
        opciones:
          - texto: >-
              En $z=1$, resolviendo $z^{2}+3z-4=0$ y descartando la raíz negativa
            correcta: true
            mensaje: |
              Eso es. Sustituyendo $r^{2}=3z$ en $r^{2}+z^{2}=4$ queda
              $3z+z^{2}=4$, con raíces $1$ y $-4$. La negativa no vale porque el
              paraboloide exige $z\ge0$.
          - texto: En $z=2$, el radio de la esfera
            mensaje: |
              $z=2$ es el punto más alto de la esfera, sobre el eje. El corte con
              el paraboloide está más abajo.
          - texto: En $z=\frac43$
            mensaje: |
              Parece salir de igualar $3z=4$, olvidando el $z^{2}$ de la esfera.
              La ecuación es de segundo grado.

      - tipo: calcular
        titulo: El radio del corte
        pregunta: |
          ¿A qué distancia del eje se cortan las dos superficies?
        respuesta:
          tipo: numero
          valor: '1.7320508'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '3'
            mensaje: |
              $3$ es $r^{2}$, no $r$. De $r^{2}=3z$ con $z=1$ sale $r=\sqrt3$.
          - valor: '2'
            mensaje: |
              $2$ es el radio de la esfera. El corte queda un poco más adentro,
              en $\sqrt3\approx1{,}73$.
          - valor: '1'
            mensaje: |
              $1$ es la **altura** del corte, no su radio.
        pista: |
          $r^{2}=3z$ con $z=1$.
        desarrollo: |
          $$
          r^{2}=3\cdot1=3
          \;\Longrightarrow\;
          r=\sqrt3\approx1{,}7321
          $$

          Y se comprueba en la esfera: $3+1=4$ ✓.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen del sólido?
        respuesta:
          tipo: numero
          valor: '9.9484'
          tolerancia: 0.01
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '33.5103'
            mensaje: |
              $\frac{4}{3}\pi\cdot8$ es la esfera entera. El paraboloide le
              recorta casi todo lo de abajo.
          - valor: '14.1372'
            mensaje: |
              $\frac{9\pi}{2}$ es el volumen encerrado por el paraboloide hasta
              $z=1$… no: ese vale $\frac{9\pi}{2}$ solo si se integra al revés. El
              sólido está **encima** del paraboloide y **dentro** de la esfera.
          - valor: '19.8968'
            mensaje: |
              Es el doble. El sólido no es simétrico respecto de $z=0$: está todo
              en $z\ge0$.
        pista: |
          $V=2\pi\int_{0}^{\sqrt3}\left(\sqrt{4-r^{2}}-\frac{r^{2}}{3}\right)r\,dr$.
        desarrollo: |
          $$
          \int_{0}^{\sqrt3}r\sqrt{4-r^{2}}\,dr
          =\left[-\tfrac13\left(4-r^{2}\right)^{3/2}\right]_{0}^{\sqrt3}
          =-\tfrac13+\tfrac83=\tfrac73
          $$

          $$
          \int_{0}^{\sqrt3}\frac{r^{3}}{3}dr=\frac{1}{3}\cdot\frac{9}{4}=\frac34
          $$

          $$
          V=2\pi\left(\frac73-\frac34\right)=2\pi\cdot\frac{19}{12}
          =\frac{19\pi}{6}\approx9{,}948
          $$

      - tipo: justificar
        pregunta: Ordena el cálculo de la superficie. Una pieza es falsa.
        piezas:
          - texto: >-
              La superficie tiene dos piezas: el trozo de paraboloide de abajo y
              el casquete esférico de arriba, y se tocan en $r=\sqrt3$, $z=1$.
          - texto: >-
              Para el paraboloide $z=\frac{r^{2}}{3}$, el factor es
              $\sqrt{1+\frac{4r^{2}}{9}}$, y su área sale
              $\frac{\pi\left(7\sqrt{21}-9\right)}{6}\approx12{,}08$.
          - texto: >-
              El casquete va de $z=1$ a $z=2$ sobre una esfera de radio $2$, así
              que su área es $2\pi Rh=2\pi\cdot2\cdot1=4\pi\approx12{,}57$.
          - texto: >-
              Como el casquete tiene radio $\sqrt3$ en su borde, su área es
              $\pi\left(\sqrt3\right)^{2}=3\pi$.
            trampa: true
            mensaje: |
              $3\pi$ es el área del **disco plano** que cierra el casquete, no la
              del casquete. La fórmula del casquete es $2\pi Rh$ —con el radio de
              la **esfera** y la **altura** del casquete—, y es siempre mayor que
              la del disco: una superficie curva tiene más área que su sombra.
    resolucion: |
      **a) Qué sólido es.** Dos condiciones:

      | condición | qué dice |
      |---|---|
      | $x^{2}+y^{2}\le3z$ | por **encima** del paraboloide $z=\frac{r^{2}}{3}$ |
      | $x^{2}+y^{2}+z^{2}\le4$ | **dentro** de la esfera de radio $2$ |

      Es un cuenco parabólico rematado por una tapa esférica. La primera
      condición obliga a $z\ge0$, así que todo el sólido está por encima del plano
      $z=0$.

      **Dónde se cortan.** Sustituyendo $r^{2}=3z$ en $r^{2}+z^{2}=4$:

      $$
      z^{2}+3z-4=0
      \;\Longrightarrow\;
      \left(z+4\right)\left(z-1\right)=0
      \;\Longrightarrow\;
      z=1
      $$

      —la raíz $z=-4$ se descarta porque el paraboloide vive en $z\ge0$—. Y
      entonces $r^{2}=3$, o sea $r=\sqrt3$.

