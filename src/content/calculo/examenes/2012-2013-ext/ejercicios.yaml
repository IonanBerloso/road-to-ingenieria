      <figcaption>
      El integrando ya transformado, sobre el intervalo acotado. Los cuatro
      rectángulos toman su altura en el punto medio de cada subintervalo: unos se
      pasan y otros se quedan cortos.
      </figcaption>
      </figure>

      **Cómo de buena es.** El valor exacto se puede calcular, y conviene
      hacerlo para juzgar:

      $$
      \int_{1}^{\infty}\frac{dr}{\left(r+1\right)^{3}}
      =\left[-\frac{1}{2\left(r+1\right)^{2}}\right]_{1}^{\infty}=\frac18=0{,}125
      $$

      El error es $0{,}0026$, un $2\,\%$, con solo cuatro evaluaciones de la
      función. Nada mal para una regla tan simple.

      **Por qué la regla del punto medio y no la del trapecio.** Con el mismo
      número de evaluaciones, el punto medio suele ser **el doble de preciso** que
      el trapecio, porque sus errores van con signos opuestos y el del punto medio
      es la mitad: $-\frac{h^{2}}{24}f''$ frente a $+\frac{h^{2}}{12}f''$. Y
      además no necesita evaluar en los extremos, cosa que aquí sería un problema
      si el integrando tuviera algo raro en $x=1$.

  - id: ex1213-ext-3-enunciar-y-demostrar-lagrange
    titulo: Enunciar y demostrar el teorema del valor medio
    fuente: >-
      Ejercicio 3 del PRIMER CUATRIMESTRAL · Convocatoria de junio, 17 de junio
      de 2013 · Cálculo – Industriales, Donostiako Eskola Politeknikoa (UPV/EHU)
      · El mismo teorema volvió a caer en la extraordinaria de 2015-2016, con
      otro reparto de puntos: allí 0/2/8 y aquí 0/0/10 · El examen no publica
      solución: la resolución es propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 0
      comp4: 10
    enunciado: |
      Enunciar y demostrar el teorema del valor medio (Lagrange).
    pide: El enunciado con sus hipótesis, y la demostración.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué se apoya la demostración?
        opciones:
          - texto: >-
              En el teorema de Rolle, aplicado a la diferencia entre $f$ y la
              cuerda que une los extremos
            correcta: true
            mensaje: |
              Eso es. La función auxiliar se anula en los dos extremos por
              construcción, que es justo la hipótesis que Rolle necesita y que $f$
              no cumple en general.
          - texto: En el teorema fundamental del cálculo
            mensaje: |
              El teorema fundamental relaciona derivada e integral, y aquí no
              aparece ninguna integral. El valor medio es un resultado de
              derivadas puras.
          - texto: >-
              En la continuidad uniforme de $f$ en el compacto
              $\left[a,b\right]$
            mensaje: |
              La continuidad uniforme se usa para otras cosas —integrabilidad,
              por ejemplo—. Aquí basta la continuidad a secas más la
              derivabilidad en el interior.

      - tipo: calcular
        titulo: Cuántos puntos garantiza el teorema
        pregunta: |
          ¿Cuántos puntos $c$ garantiza el teorema que existen, como mínimo?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              Puede haber dos o más, pero el teorema solo garantiza **uno**.
              Decir «el punto» en vez de «un punto» es un error de enunciado.
          - valor: '0'
            mensaje: |
              Si las hipótesis se cumplen, el punto existe seguro. El teorema es
              de existencia.
        pista: |
          El enunciado dice «existe al menos un $c$».
        desarrollo: |
          El teorema afirma **existencia**, no unicidad: garantiza al menos un
          $c$. Puede haber más de uno —en
          $f\left(x\right)=\operatorname{sen}x$ sobre $\left[0,2\pi\right]$ hay
          dos— y el teorema no dice cuántos ni dónde están.

      - tipo: justificar
        pregunta: Ordena la demostración. Una pieza es falsa.
        piezas:
          - texto: >-
              Enunciado: si $f$ es continua en $\left[a,b\right]$ y derivable en
              $\left(a,b\right)$, existe al menos un $c\in\left(a,b\right)$ con
              $f'\left(c\right)=\frac{f\left(b\right)-f\left(a\right)}{b-a}$.
          - texto: >-
              Se define $g\left(x\right)=f\left(x\right)-f\left(a\right)
              -\frac{f\left(b\right)-f\left(a\right)}{b-a}\left(x-a\right)$, que
              hereda de $f$ la continuidad y la derivabilidad.
          - texto: >-
              $g\left(a\right)=g\left(b\right)=0$, así que Rolle da un
              $c\in\left(a,b\right)$ con $g'\left(c\right)=0$, y eso es
              exactamente la tesis.
          - texto: >-
              La hipótesis de derivabilidad hay que exigirla también en los
              extremos $a$ y $b$, porque si no la demostración no funciona.
            trampa: true
            mensaje: |
              No hace falta, y exigirla de más debilita el teorema. La
              demostración solo usa la derivada en el punto interior $c$ que da
              Rolle. De hecho la versión con derivabilidad solo en el abierto es
              la útil: permite aplicarlo a $\sqrt{x}$ en $\left[0,1\right]$, que
              tiene tangente vertical en el origen.
    resolucion: |
      **El enunciado, con las hipótesis separadas.**

      > Si $f$ es **continua en el cerrado** $\left[a,b\right]$ y **derivable en
      > el abierto** $\left(a,b\right)$, entonces existe **al menos un**
      > $c\in\left(a,b\right)$ tal que
      > $$
      > f'\left(c\right)=\frac{f\left(b\right)-f\left(a\right)}{b-a}
      > $$

      Este ejercicio vale **diez puntos de COMP 4 y ninguno de cálculo**: no hay
      un solo número que hallar. Lo que se puntúa es escribir bien las tres
      cosas: las hipótesis, la tesis y el argumento. Y las tres tienen letra
      pequeña.

      | detalle | por qué importa |
      |---|---|
      | continua en el **cerrado** | para poder hablar de $f\left(a\right)$ y $f\left(b\right)$ |
      | derivable solo en el **abierto** | así vale para $\sqrt x$ en $\left[0,1\right]$, con tangente vertical en $0$ |
      | «al menos un» $c$ | el teorema no dice cuántos, ni dónde |

      **La lectura geométrica**, que es la que hace recordable la fórmula: en
      algún punto interior la **tangente es paralela a la cuerda**.

      <figure class="figura-examen">
      <svg viewBox="0 0 300 245" role="img" width="300" height="245"
