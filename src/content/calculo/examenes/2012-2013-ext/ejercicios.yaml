ejercicios:
  - id: ex1213-ext-1-el-rombo-y-su-area
    titulo: Un rombo del que solo se conoce una diagonal
    fuente: >-
      Ejercicio 1 del PRIMER CUATRIMESTRAL · Convocatoria de junio, 17 de junio
      de 2013 · Cálculo – Industriales, Donostiako Eskola Politeknikoa (UPV/EHU)
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 5
      comp4: 3
    enunciado: |
      Los vértices opuestos de un rombo son los afijos de los números complejos
      $z_{1}=2-i$ y $z_{2}=6+2i$. Sabiendo que la longitud de la otra diagonal
      es el doble de la que forman dichos vértices, hallar los otros vértices y
      el área del rombo.
    pide: Los otros dos vértices y el área.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué propiedad de las diagonales de un rombo resuelve el ejercicio?
        opciones:
          - texto: >-
              Que se cortan **perpendicularmente en su punto medio**
            correcta: true
            mensaje: |
              Esa es toda la clave. El punto medio da el centro y la
              perpendicularidad da la dirección; con la longitud del enunciado ya
              están los dos vértices que faltan.
          - texto: Que son iguales
            mensaje: |
              Eso pasa en el **rectángulo**, no en el rombo. Aquí el enunciado
              dice expresamente que una mide el doble que la otra.
          - texto: >-
              Que cada diagonal divide el rombo en dos triángulos equiláteros
            mensaje: |
              Los divide en dos triángulos **isósceles** e iguales, no
              equiláteros. Solo serían equiláteros en un caso muy particular.

      - tipo: calcular
        titulo: La diagonal conocida
        pregunta: |
          ¿Cuánto mide la diagonal que une $z_{1}$ con $z_{2}$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '7'
            mensaje: |
              $7$ es $4+3$, la suma de las componentes. La longitud es el módulo,
              $\sqrt{4^{2}+3^{2}}$.
          - valor: '25'
            mensaje: |
              $25$ es el cuadrado de la longitud. Falta la raíz — y de paso, $25$
              sí aparece en el ejercicio: es el área.
          - valor: '10'
            mensaje: |
              $10$ es la **otra** diagonal, la que mide el doble.
        pista: |
          $z_{2}-z_{1}=4+3i$.
        desarrollo: |
          $$
          z_{2}-z_{1}=\left(6+2i\right)-\left(2-i\right)=4+3i
          \;\Longrightarrow\;
          \left|z_{2}-z_{1}\right|=\sqrt{16+9}=5
          $$

          El clásico $3$–$4$–$5$, puesto ahí para que la cuenta salga a mano.

      - tipo: calcular
        titulo: Uno de los vértices que faltan
        pregunta: |
          ¿Cuál es el vértice con parte imaginaria positiva?
        respuesta:
          tipo: complejo
          valor: '1+4.5i'
          tolerancia: 0.01
          formato: forma binómica, por ejemplo 1+4.5i
        distractores:
          - valor: '7-3.5i'
            mensaje: |
              Ese es el otro vértice, el de parte imaginaria negativa. Los dos son
              correctos; el enunciado del paso pide el de arriba.
          - valor: '1+5.5i'
            mensaje: |
              El centro está en $\left(4;\,0{,}5\right)$, no en $\left(4,0\right)$.
              El punto medio de $-1$ y $2$ es $\frac12$.
          - valor: '2.8+4.9i'
            mensaje: |
              Parece salir de usar la perpendicular **unitaria** sin multiplicar
              por la semidiagonal, que vale $5$.
        pista: |
          El centro es $\left(4;\,0{,}5\right)$, la perpendicular unitaria es
          $\frac{\left(-3,4\right)}{5}$ y la semidiagonal mide $5$.
        desarrollo: |
          $$
          M=\frac{z_{1}+z_{2}}{2}=4+\tfrac12 i
          $$

          Girar $4+3i$ noventa grados es multiplicar por $i$:
          $i\left(4+3i\right)=-3+4i$, que ya tiene módulo $5$ — justo la
          semidiagonal que hace falta.

          $$
          z_{3}=M+\left(-3+4i\right)=1+\tfrac92 i,
          \qquad
          z_{4}=M-\left(-3+4i\right)=7-\tfrac72 i
          $$

      - tipo: justificar
        pregunta: Ordena el cálculo del área. Una pieza es falsa.
        piezas:
          - texto: >-
              La diagonal conocida mide $\left|4+3i\right|=5$, y el enunciado dice
              que la otra mide $10$.
          - texto: >-
              Se cortan perpendicularmente en su punto medio
              $M=4+\frac12 i$, así que los otros dos vértices son
              $M\pm i\left(4+3i\right)=M\pm\left(-3+4i\right)$.
          - texto: >-
              El área de un rombo es el semiproducto de sus diagonales:
              $\frac{5\cdot10}{2}=25$.
          - texto: >-
              Como los cuatro lados son iguales, el área es el lado al cuadrado:
              $\left(\frac{5\sqrt5}{2}\right)^{2}=\frac{125}{4}$.
            trampa: true
            mensaje: |
              El lado al cuadrado es el área del **cuadrado**, no la del rombo: un
              rombo es un cuadrado «aplastado» y tiene menos área con el mismo
              lado. Aquí el lado mide $\frac{5\sqrt5}{2}\approx5{,}59$ y su
              cuadrado es $31{,}25$, mientras que el área de verdad es $25$. La
              fórmula correcta lleva el seno del ángulo, o directamente el
              semiproducto de las diagonales.
    resolucion: |
      **La diagonal que dan.** Restando los dos afijos:

      $$
      z_{2}-z_{1}=\left(6+2i\right)-\left(2-i\right)=4+3i,
      \qquad
      \left|4+3i\right|=5
      $$

      Y su punto medio, que va a ser el centro del rombo:

      $$
      M=\frac{z_{1}+z_{2}}{2}=\frac{8+i}{2}=4+\tfrac12 i
      $$

      **La propiedad que lo resuelve todo.** En un rombo las diagonales se cortan
      **perpendicularmente y en su punto medio**. Así que los dos vértices que
      faltan están sobre la recta que pasa por $M$ en dirección perpendicular a
      $4+3i$, a la mitad de $10$ —o sea a $5$— de distancia.

      **Girar noventa grados es multiplicar por $i$**, y aquí sale redondo:

      $$
      i\left(4+3i\right)=4i-3=-3+4i,
      \qquad
      \left|-3+4i\right|=5
      $$

      El módulo ya es el que hace falta, así que no hay ni que normalizar.

      $$
      \boxed{\;z_{3}=M+\left(-3+4i\right)=1+\tfrac92 i,
      \qquad
      z_{4}=M-\left(-3+4i\right)=7-\tfrac72 i\;}
      $$

