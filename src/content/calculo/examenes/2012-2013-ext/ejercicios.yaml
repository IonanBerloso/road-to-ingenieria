          <text x="261.6" y="192" text-anchor="end">x</text>
        </g>
        <text class="lag13-l" x="100.6" y="108.7" fill="var(--alt)">la cuerda</text>
        <text class="lag13-l" x="257.2" y="155.1" text-anchor="end" fill="var(--flag)">tangente en c</text>
