        <g class="sol13-n">
          <text x="158" y="166" text-anchor="end">1</text>
          <text x="158" y="114" text-anchor="end">2</text>
          <text x="255.1" y="230" text-anchor="middle">√3</text>
          <text x="300.2" y="206" text-anchor="end">r</text>
          <text x="172" y="87.1">z</text>
        </g>
        <g class="sol13-l">
          <text x="37.6" y="124.6" fill="var(--alt)">esfera r = 2</text>
          <text x="295" y="143.8" text-anchor="end" fill="var(--d1)">z = r²/3</text>
          <text x="175" y="164.6" fill="var(--live)">G</text>
          <text x="37.6" y="227" fill="var(--live)">V = 19π/6</text>
        </g>
      </svg>
      <figcaption>
      El corte por el eje. La parábola sube del origen y el arco de la esfera la
      corta a la altura uno, a distancia raíz de tres. En medio, la región que se
      integra.
      </figcaption>
      </figure>

      **El volumen.** Para cada $r$ entre $0$ y $\sqrt3$, la $z$ va del
      paraboloide a la esfera:

      $$
      V=2\pi\int_{0}^{\sqrt3}
      \left(\sqrt{4-r^{2}}-\frac{r^{2}}{3}\right)r\,dr
      =2\pi\left(\frac73-\frac34\right)
      $$

      $$
      \boxed{\;V=\frac{19\pi}{6}\approx9{,}95\;}
      $$

      **b) La superficie, pieza a pieza.**

      *El paraboloide*, $z=\frac{r^{2}}{3}$, con
      $z_{x}^{2}+z_{y}^{2}=\frac{4r^{2}}{9}$:

      $$
      A_{1}=2\pi\int_{0}^{\sqrt3}r\sqrt{1+\frac{4r^{2}}{9}}\;dr
      =\frac{3\pi}{2}\left[\left(\tfrac73\right)^{3/2}-1\right]
      =\frac{\pi\left(7\sqrt{21}-9\right)}{6}\approx12{,}08
      $$

      *El casquete esférico*, de $z=1$ a $z=2$ sobre la esfera de radio $2$, con
      altura $h=1$:

      $$
      A_{2}=2\pi R h=2\pi\cdot2\cdot1=4\pi\approx12{,}57
      $$

      $$
      \boxed{\;A=\frac{\pi\left(7\sqrt{21}+15\right)}{6}\approx24{,}65\;}
      $$

      **La fórmula del casquete merece un comentario**, porque ahorra una
      integral entera: el área de un casquete esférico es $2\pi Rh$ y **no depende
      del radio del casquete**, solo de su altura. Dos rebanadas de esfera de la
      misma altura tienen la misma área, estén donde estén.

      **c) El centro de gravedad.** Por simetría de revolución
      $\overline{x}=\overline{y}=0$. Integrando primero en $z$:

      $$
      \int_{S}z\,dV=2\pi\int_{0}^{\sqrt3}
      \frac{\left(4-r^{2}\right)-\left(\frac{r^{2}}{3}\right)^{2}}{2}\,r\,dr
      =\pi\int_{0}^{\sqrt3}\left(4r-r^{3}-\frac{r^{5}}{9}\right)dr
      $$

      $$
      =\pi\left[2r^{2}-\frac{r^{4}}{4}-\frac{r^{6}}{54}\right]_{0}^{\sqrt3}
      =\pi\left(6-\frac94-\frac12\right)=\frac{13\pi}{4}
      $$

      $$
      \overline{z}=\frac{13\pi/4}{19\pi/6}=\frac{13}{4}\cdot\frac{6}{19}
      =\frac{39}{38}
      $$

      $$
      \boxed{\;G=\left(0,\,0,\;\tfrac{39}{38}\right)\approx
      \left(0;\,0;\,1{,}026\right)\;}
      $$

      **¿Es razonable?** El sólido va de $z=0$ a $z=2$, y su parte ancha está
      arriba: en $z=1$ ya tiene el radio máximo, $\sqrt3$, y hacia abajo se
      estrecha en punta. Así que el centro tiene que quedar por encima de la
      mitad de la altura del cuenco... y sin embargo sale $1{,}026$, apenas por
      encima del plano del corte. El motivo es que la tapa esférica, aunque está
      arriba, es un casquete muy plano: aporta poco volumen. Los dos efectos casi
      se cancelan.

  - id: ex1213-ext-7-la-antitransformada-por-dos-caminos
    titulo: La misma antitransformada por dos caminos
    fuente: >-
      Ejercicio 3 del SEGUNDO CUATRIMESTRAL · Convocatoria de junio, 17 de junio
      de 2013 · Cálculo – Industriales, Donostiako Eskola Politeknikoa (UPV/EHU)
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 5
      comp4: 5
    enunciado: |
      Calcular
      $\mathcal{L}^{-1}\left\{\dfrac{1}{\left(s+1\right)^{2}}\right\}$
      de dos formas diferentes.
    pide: La función, obtenida por dos métodos distintos.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál de estos NO es un camino válido para esta antitransformada?
        opciones:
          - texto: >-
              Descomponer $\frac{1}{\left(s+1\right)^{2}}$ en fracciones simples
              con dos denominadores distintos
            correcta: true
            mensaje: |
              No hay nada que descomponer: ya **es** una fracción simple, la de
              una raíz doble. Intentarlo lleva a $\frac{A}{s+1}+\frac{B}{s+1}$,
              que es lo mismo con otro nombre.
          - texto: >-
              Usar el teorema del desplazamiento sobre
              $\mathcal{L}\left\{t\right\}=\frac{1}{s^{2}}$
            mensaje: |
              Ese sí vale, y es el camino más corto: multiplicar por $e^{-t}$
              desplaza $s$ a $s+1$.
          - texto: >-
              Verlo como el producto $\frac{1}{s+1}\cdot\frac{1}{s+1}$ y
              antitransformar por convolución
            mensaje: |
              Ese también vale, y es el segundo camino natural: el producto de
              transformadas es la transformada de la convolución.

      - tipo: calcular
        titulo: El valor en t = 1
        pregunta: |
          ¿Cuánto vale la función antitransformada en $t=1$?
        respuesta:
          tipo: numero
          valor: '0.3678794'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '2.7182818'
            mensaje: |
              $e$ sería el valor de $te^{+t}$ en $t=1$. El signo del exponente es
              negativo: $\frac{1}{s+1}$ corresponde a $e^{-t}$.
          - valor: '1'
            mensaje: |
              $1$ es el valor de $t$ en $t=1$. Falta el factor $e^{-1}$.
          - valor: '0.1353353'
            mensaje: |
              $e^{-2}$ saldría de $t^{2}e^{-t}$ o de $e^{-2t}$. Aquí el exponente
              es $-t$ y el factor delante es $t$, no $t^{2}$.
        pista: |
          La respuesta es $t\,e^{-t}$, y $e^{-1}\approx0{,}3679$.
        desarrollo: |
          $$
          \mathcal{L}^{-1}\left\{\frac{1}{\left(s+1\right)^{2}}\right\}
          =t\,e^{-t}
          \;\Longrightarrow\;
          \text{en }t=1:\;e^{-1}\approx0{,}3679
          $$

      - tipo: calcular
        titulo: Dónde tiene su máximo
        pregunta: |
          ¿En qué valor de $t$ alcanza su máximo la función?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              En $t=0$ la función vale $0$: el factor $t$ la anula. Sale de cero,
              sube y luego se apaga.
          - valor: '0.5'
            mensaje: |
              $\frac12$ saldría de $\frac{1}{2}$ como constante del exponente.
              Derivando $te^{-t}$ sale $\left(1-t\right)e^{-t}$, que se anula en
              $t=1$.
          - valor: '2'
            mensaje: |
              En $t=2$ la función ya está bajando: vale $2e^{-2}=0{,}27$, menos
              que $e^{-1}=0{,}37$.
        pista: |
          Deriva $t\,e^{-t}$ con la regla del producto.
        desarrollo: |
          $$
          \frac{d}{dt}\left(te^{-t}\right)=e^{-t}-te^{-t}
          =\left(1-t\right)e^{-t}
          $$

          Se anula en $t=1$, y pasa de positiva a negativa: máximo. El valor
          máximo es $e^{-1}\approx0{,}368$.

      - tipo: justificar
        pregunta: Ordena el segundo camino, el de la convolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\frac{1}{\left(s+1\right)^{2}}$ es el producto de
              $\frac{1}{s+1}$ por sí misma, y
              $\mathcal{L}^{-1}\left\{\frac{1}{s+1}\right\}=e^{-t}$.
          - texto: >-
              El producto de dos transformadas es la transformada de la
              convolución, así que la respuesta es
              $\left(e^{-t}*e^{-t}\right)\left(t\right)
              =\int_{0}^{t}e^{-u}e^{-\left(t-u\right)}du$.
          - texto: >-
              Los exponentes se suman y dan $e^{-t}$, que sale fuera de la
              integral: queda $e^{-t}\int_{0}^{t}du=t\,e^{-t}$.
          - texto: >-
              Como el producto de transformadas es la transformada del producto,
              la respuesta es $e^{-t}\cdot e^{-t}=e^{-2t}$.
            trampa: true
            mensaje: |
              Ese es **el** error de Laplace, y por eso existe la convolución. El
              producto de dos transformadas **no** es la transformada del
              producto: si lo fuera, $\frac{1}{\left(s+1\right)^{2}}$ sería la
              transformada de $e^{-2t}$, y esa es $\frac{1}{s+2}$, otra función
              distinta.
    resolucion: |
      **La respuesta, por si se quiere ir al grano:**

      $$
      \boxed{\;\mathcal{L}^{-1}\left\{\frac{1}{\left(s+1\right)^{2}}\right\}
      =t\,e^{-t}\;}
      $$

      Lo que el ejercicio pide es llegar ahí por **dos caminos**, y le da cinco
      puntos de COMP 4: lo que se puntúa es justificar cada paso, no el resultado.

      **Camino 1 · el teorema del desplazamiento.** Es el más corto. Se parte de
      una transformada de tabla:

      $$
      \mathcal{L}\left\{t\right\}=\frac{1}{s^{2}}
      $$

      Y el primer teorema de traslación dice que multiplicar la función por
      $e^{at}$ desplaza la variable:

      $$
      \mathcal{L}\left\{e^{at}f\left(t\right)\right\}=F\left(s-a\right)
      $$

      Con $a=-1$ y $f\left(t\right)=t$:

      $$
      \mathcal{L}\left\{e^{-t}\,t\right\}=\frac{1}{\left(s+1\right)^{2}}
      \;\Longrightarrow\;
      \mathcal{L}^{-1}\left\{\frac{1}{\left(s+1\right)^{2}}\right\}=t\,e^{-t}
      $$

      **Camino 2 · la convolución.** El denominador es un cuadrado, así que la
      fracción es un **producto de dos transformadas conocidas**:

      $$
      \frac{1}{\left(s+1\right)^{2}}
      =\frac{1}{s+1}\cdot\frac{1}{s+1},
      \qquad
      \mathcal{L}^{-1}\left\{\frac{1}{s+1}\right\}=e^{-t}
      $$

      Y el teorema de convolución dice que un producto de transformadas
      antitransforma a la convolución:

      $$
      \left(f*g\right)\left(t\right)=\int_{0}^{t}
      f\left(u\right)g\left(t-u\right)du
      $$

      $$
      \left(e^{-t}*e^{-t}\right)\left(t\right)
      =\int_{0}^{t}e^{-u}\,e^{-\left(t-u\right)}du
      =\int_{0}^{t}e^{-t}\,du
      =e^{-t}\int_{0}^{t}du=t\,e^{-t}
      $$

      Los exponentes se suman y la $u$ desaparece del integrando: la exponencial
      sale fuera y solo queda integrar $1$. Esa cancelación es lo que hace que la
      convolución de dos exponenciales iguales dé exactamente un factor $t$.

      **Camino 3, de propina · derivar la transformada.** El teorema
      $\mathcal{L}\left\{t\,f\left(t\right)\right\}=-F'\left(s\right)$ lo resuelve
      en una línea:

      $$
      F\left(s\right)=\frac{1}{s+1}
      \;\Longrightarrow\;
      -F'\left(s\right)=\frac{1}{\left(s+1\right)^{2}}
      \;\Longrightarrow\;
      \mathcal{L}^{-1}=t\,e^{-t}
      $$

      **La comprobación.** Aplicando la definición al revés, con $s=3$:

      $$
      \int_{0}^{\infty}t\,e^{-t}e^{-3t}dt
      =\int_{0}^{\infty}t\,e^{-4t}dt=\frac{1}{16}
      $$

      y $\frac{1}{\left(3+1\right)^{2}}=\frac{1}{16}$ ✓.

      **Qué función es.** $t\,e^{-t}$ sale de cero, sube hasta un máximo en
      $t=1$ —donde vale $e^{-1}\approx0{,}368$— y se apaga. Es la respuesta
      típica de un sistema **críticamente amortiguado**: el polo doble en
      $s=-1$ es exactamente la frontera entre oscilar y no oscilar. Con dos polos
      reales distintos habría dos exponenciales; con dos complejos, una
      oscilación; con el doble, este $t$ que multiplica.

  - id: ex1213-ext-8-el-campo-con-dos-rectas-prohibidas
    titulo: Un campo con dos rectas prohibidas
    fuente: >-
      Ejercicio 4 del SEGUNDO CUATRIMESTRAL · Convocatoria de junio, 17 de junio
      de 2013 · Cálculo – Industriales, Donostiako Eskola Politeknikoa (UPV/EHU)
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 2
      comp2: 4
      comp4: 4
    enunciado: |
      Sea $C$ la circunferencia de centro $\left(0,0\right)$ y radio $2$.
      Calcular

      $$
      \oint_{C}\frac{\left(y+1\right)dx+\left(x+1\right)dy}
      {\left(x+1\right)\left(y+1\right)}
      $$

      a) Parametrizando la curva.

      b) Aplicando, si es posible, la fórmula de Green.
    pide: El valor por parametrización, y si Green se puede aplicar o no.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es lo primero que hay que hacer con el integrando?
        opciones:
          - texto: >-
              Simplificarlo: se parte en
              $\frac{dx}{x+1}+\frac{dy}{y+1}$
            correcta: true
            mensaje: |
              Eso es. En el primer sumando se cancela el $\left(y+1\right)$ y en
              el segundo el $\left(x+1\right)$. Lo que queda es una diferencial
              exacta, y todo el ejercicio se aclara de golpe.
          - texto: >-
              Parametrizar directamente, sustituyendo $x=2\cos\theta$ e
              $y=2\operatorname{sen}\theta$
            mensaje: |
              Se puede, pero sin simplificar antes queda una expresión mucho más
              fea. Y sobre todo: la simplificación es la que enseña qué está
              pasando.
          - texto: >-
              Comprobar si el campo es conservativo calculando el rotacional
            mensaje: |
              Es el segundo paso, no el primero. Y sale más fácil sobre la forma
              simplificada, donde se ve que $P$ depende solo de $x$ y $Q$ solo de
              $y$.

      - tipo: calcular
        titulo: Dónde falla el integrando
        pregunta: |
          ¿En cuántos puntos de la circunferencia $C$ no está definido el
          integrando?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              La recta $x=-1$ corta a la circunferencia en dos puntos, sí, pero la
              recta $y=-1$ la corta en otros dos. Son cuatro en total.
          - valor: '0'
            mensaje: |
              El denominador se anula donde $x=-1$ o donde $y=-1$, y las dos
              rectas cortan a la circunferencia de radio $2$: están a distancia
              $1$ del centro, menos que el radio.
          - valor: '1'
            mensaje: |
              Un solo punto sería el caso del campo $\frac{\left(-y,x\right)}
              {x^{2}+y^{2}}$, que falla en el origen. Aquí fallan dos **rectas**
              enteras.
        pista: |
          $x=-1$ corta a $x^{2}+y^{2}=4$ en $y=\pm\sqrt3$; y lo mismo con
          $y=-1$.
        desarrollo: |
          | recta | corte con $C$ |
          |---|---|
          | $x=-1$ | $y=\pm\sqrt{4-1}=\pm\sqrt3$: dos puntos |
          | $y=-1$ | $x=\pm\sqrt3$: otros dos |

          En total **cuatro** puntos, y en todos ellos el integrando se dispara.

      - tipo: calcular
        titulo: El valor de la integral
        pregunta: |
          ¿Cuánto vale la integral, entendida como valor principal?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '6.2831853'
            mensaje: |
              $2\pi$ es el resultado del campo $\frac{\left(-y,x\right)}
              {x^{2}+y^{2}}$, que sí da vueltas alrededor de su singularidad.
              Este es distinto: cada sumando depende de una sola variable.
          - valor: '12.5663706'
            mensaje: |
              $4\pi$ tampoco: la integral no cuenta vueltas. La primitiva
              $\ln\left\|\left(x+1\right)\left(y+1\right)\right\|$ vuelve a su
              valor de partida.
          - valor: '1.0986123'
            mensaje: |
              $\ln3$ es el valor de la primitiva en el punto de arranque
              $\left(2,0\right)$. Lo que vale la integral es la **diferencia**
              entre el final y el principio, y es el mismo punto.
        pista: |
          La primitiva es $\ln\left|x+1\right|+\ln\left|y+1\right|$, y la curva
          es cerrada.
        desarrollo: |
          El integrando es $d\left[\ln\left|x+1\right|+\ln\left|y+1\right|\right]$.
          Sobre una curva cerrada, la primitiva vuelve a su valor inicial:

          $$
          \oint_{C}=\Big[\ln\left|x+1\right|+\ln\left|y+1\right|\Big]
          _{\text{inicio}}^{\text{final}}=0
          $$

          en el sentido del valor principal, porque en cada uno de los cuatro
          puntos malos el logaritmo baja a $-\infty$ y vuelve de $-\infty$ de forma
          simétrica.

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              Simplificado, el campo es $P=\frac{1}{x+1}$, $Q=\frac{1}{y+1}$: cada
              componente depende de una sola variable.
          - texto: >-
              Por tanto $P_{y}=Q_{x}=0$ y el rotacional es nulo donde el campo
              está definido, que es en todo el plano salvo las rectas $x=-1$ e
              $y=-1$.
          - texto: >-
              Pero esas dos rectas atraviesan el disco encerrado por $C$, así que
              el campo no es de clase $C^{1}$ en todo el recinto y **Green no se
              puede aplicar**.
          - texto: >-
              Como el rotacional es nulo y el resultado es cero, se confirma que
              Green sí era aplicable.
            trampa: true
            mensaje: |
              Que el resultado coincida no valida el método: es una casualidad.
              La hipótesis de Green falla en dos rectas enteras, y el mismo
              razonamiento aplicado al campo $\frac{\left(-y,x\right)}
              {x^{2}+y^{2}}$ —también irrotacional, también con una singularidad
              dentro— daría $0$ cuando la respuesta es $2\pi$. El acierto por
              casualidad no es un acierto.
    resolucion: |
      **Lo primero: simplificar.** El integrando parece complicado y no lo es:

      $$
      \frac{\left(y+1\right)dx+\left(x+1\right)dy}
      {\left(x+1\right)\left(y+1\right)}
      =\frac{dx}{x+1}+\frac{dy}{y+1}
      $$

      En el primer sumando se cancela $\left(y+1\right)$ y en el segundo
      $\left(x+1\right)$. Lo que queda es una **diferencial exacta**:

      $$
      \frac{dx}{x+1}+\frac{dy}{y+1}
      =d\Big[\ln\left|x+1\right|+\ln\left|y+1\right|\Big]
      $$

      **a) Parametrizando.** Con $x=2\cos\theta$, $y=2\operatorname{sen}\theta$,
      $\theta$ de $0$ a $2\pi$:

      $$
      \oint_{C}=\int_{0}^{2\pi}
      \left[\frac{-2\operatorname{sen}\theta}{2\cos\theta+1}
      +\frac{2\cos\theta}{2\operatorname{sen}\theta+1}\right]d\theta
      $$

      Y los dos sumandos son derivadas de logaritmos:

      $$
      \frac{d}{d\theta}\ln\left|2\cos\theta+1\right|
      =\frac{-2\operatorname{sen}\theta}{2\cos\theta+1},
      \qquad
      \frac{d}{d\theta}\ln\left|2\operatorname{sen}\theta+1\right|
      =\frac{2\cos\theta}{2\operatorname{sen}\theta+1}
      $$

      $$
      \oint_{C}=\Big[\ln\left|2\cos\theta+1\right|
      +\ln\left|2\operatorname{sen}\theta+1\right|\Big]_{0}^{2\pi}
      =\ln3-\ln3=\boxed{\;0\;}
      $$

      **Pero hay que decir en qué sentido.** La curva pasa por **cuatro puntos
      donde el integrando ni siquiera existe**:

      | recta | corte con $C$ | $\theta$ |
      |---|---|---|
      | $x=-1$ | $\left(-1,\pm\sqrt3\right)$ | $\frac{2\pi}{3}$ y $\frac{4\pi}{3}$ |
      | $y=-1$ | $\left(\pm\sqrt3,-1\right)$ | $\frac{7\pi}{6}$ y $\frac{11\pi}{6}$ |

