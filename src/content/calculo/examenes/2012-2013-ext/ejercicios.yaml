      <figcaption>
      Las dos rectas prohibidas atraviesan el disco de lado a lado, y cortan a la
      propia curva en cuatro puntos. Por eso Green no se puede aplicar.
      </figcaption>
      </figure>

      En cada uno de ellos el logaritmo se va a $-\infty$ **y vuelve de
      $-\infty$**, de forma simétrica: cerca de $\theta_{0}$ el argumento se
      comporta como $c\left(\theta-\theta_{0}\right)$, así que
      $\ln\left|\cdot\right|$ vale lo mismo a un lado y al otro. Recortando un
      entorno de anchura $\varepsilon$ en cada punto y haciendo
      $\varepsilon\to0$, las contribuciones se cancelan y el resultado es $0$.

      Es un **valor principal**, y decirlo con esa palabra es parte de la
      respuesta.

      **b) Green: la respuesta es que no.** Con $P=\frac{1}{x+1}$ y
      $Q=\frac{1}{y+1}$, cada componente depende de una sola variable:

      $$
      \frac{\partial P}{\partial y}=0,
      \qquad
      \frac{\partial Q}{\partial x}=0
      \;\Longrightarrow\;
      \frac{\partial Q}{\partial x}-\frac{\partial P}{\partial y}=0
      $$

      Pero Green exige que $P$ y $Q$ sean de clase $C^{1}$ en **todo** el recinto
      encerrado, y aquí fallan en dos rectas enteras que lo atraviesan de lado a
      lado.

      $$
      \boxed{\;\text{Green no se puede aplicar}\;}
      $$

      **Y aquí está lo incómodo del ejercicio**: aplicándolo a lo bruto saldría
      $\iint_{D}0\,dA=0$, que **coincide** con la respuesta correcta. Coincide por
      casualidad. La prueba de que es casualidad la da otro campo del mismo
      corpus: $\frac{-y\,dx+x\,dy}{x^{2}+y^{2}}$, también irrotacional y también
      con una singularidad dentro, tiene circulación $2\pi$ y no $0$ — cayó en la
      extraordinaria de 2015-2016 con el mismo enunciado de dos apartados.

      **Por qué aquí sale cero y allí no.** La diferencia está en la topología
      del dominio. Allí el campo era irrotacional en un dominio con un **agujero
      puntual** y no admitía potencial global: al dar una vuelta, el potencial —el
      ángulo— aumentaba en $2\pi$. Aquí sí hay potencial global,
      $\ln\left|\left(x+1\right)\left(y+1\right)\right|$, y un potencial que
      existe siempre devuelve cero en cualquier curva cerrada. Lo que estropea la
      hipótesis de Green es que ese potencial **no está acotado**, no que sea
      multivaluado.

      **Los cuatro puntos de COMP 4** se ganan diciendo estas tres cosas: que el
      integrando se simplifica, que la curva pasa por cuatro puntos malos y en qué
      sentido se interpreta entonces la integral, y que el cero de Green es un
      acierto por casualidad.
