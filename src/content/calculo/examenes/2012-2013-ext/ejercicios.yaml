      <figcaption>
      Los dos vértices dados, en rojo, y los dos que hay que hallar, en morado. Las
      diagonales se cortan perpendicularmente en M, y de ahí sale todo: dirección y
      distancia.
      </figcaption>
      </figure>

      **El área.** Para cualquier cuadrilátero con las diagonales
      perpendiculares —y el rombo lo es— el área es el semiproducto:

      $$
      A=\frac{d_{1}\,d_{2}}{2}=\frac{5\cdot10}{2}
      =\boxed{\;25\;}
      $$

      **Las comprobaciones**, que son tres y todas cortas:

      | qué | cuenta |
      |---|---|
      | los cuatro lados iguales | los cuatro miden $\frac{5\sqrt5}{2}\approx5{,}59$ |
      | diagonales perpendiculares | $\left(4,3\right)\cdot\left(-3,4\right)=-12+12=0$ ✓ |
      | el área, por otro camino | $\left\|\left(z_{3}-z_{1}\right)\times\left(z_{4}-z_{1}\right)\right\|=25$ ✓ |

      **Por qué el enunciado da los vértices como complejos y no como puntos.**
      Porque así el giro de noventa grados es una multiplicación en vez de una
      matriz, y todo el ejercicio cabe en cinco líneas. Es el argumento de fondo
      del tema entero: **operar con complejos es hacer geometría sin
      coordenadas**.

  - id: ex1213-ext-2-la-impropia-y-el-punto-medio
    titulo: Meter el infinito dentro de un intervalo
    fuente: >-
      Ejercicio 2 del PRIMER CUATRIMESTRAL · Convocatoria de junio, 17 de junio
      de 2013 · Cálculo – Industriales, Donostiako Eskola Politeknikoa (UPV/EHU)
      · El examen no publica solución: la resolución es propuesta nuestra,
      pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Para calcular integrales impropias de tipo
      $\displaystyle\int_{a}^{\infty}f\left(r\right)dr$ se suele utilizar el
      cambio de variable $r=\dfrac{2a}{1-x}$. Para la integral
      $\displaystyle\int_{1}^{\infty}\frac{dr}{\left(r+1\right)^{3}}$, se pide:

      a) Aplicar dicho cambio de variable.

      b) Aproximar la integral empleando la regla del punto medio usando cuatro
      subintervalos.
    pide: La integral transformada y su aproximación numérica.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Para qué sirve el cambio $r=\frac{2a}{1-x}$?
        opciones:
          - texto: >-
              Para convertir el intervalo infinito $\left[a,\infty\right)$ en el
              intervalo acotado $\left[-1,1\right]$, donde ya se pueden usar
              fórmulas numéricas
            correcta: true
            mensaje: |
              Exacto. Con $r=a$ sale $x=-1$ y con $r\to\infty$ sale $x\to1$. Las
              reglas de cuadratura —punto medio, trapecio, Simpson— necesitan un
              intervalo finito, y este cambio se lo fabrica.
          - texto: >-
              Para eliminar la singularidad del integrando
            mensaje: |
              El integrando $\frac{1}{\left(r+1\right)^{3}}$ no tiene ninguna
              singularidad en $\left[1,\infty\right)$: es continuo y acotado. Lo
              que estorba es el intervalo, no la función.
          - texto: >-
              Para que la integral tenga primitiva elemental
            mensaje: |
              Ya la tiene: $-\frac{1}{2\left(r+1\right)^{2}}$. El cambio no busca
              eso, y de hecho aquí el valor exacto se puede calcular sin él.

      - tipo: calcular
        titulo: El extremo inferior transformado
        pregunta: |
          Con $a=1$, ¿en qué valor de $x$ se convierte $r=1$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Con $x=0$ sale $r=\frac{2a}{1}=2a=2$, no $1$. Hay que resolver
              $1=\frac{2}{1-x}$.
          - valor: '1'
            mensaje: |
              $x=1$ es el otro extremo: ahí el denominador se anula y $r$ se va a
              infinito.
          - valor: '0.5'
            mensaje: |
              Con $x=\frac12$ sale $r=4$. La ecuación es $1-x=2$.
        pista: |
          $1=\frac{2}{1-x}$, así que $1-x=2$.
        desarrollo: |
          $$
          r=\frac{2a}{1-x}=\frac{2}{1-x}
          $$

          | $r$ | $x$ |
          |---|---|
          | $1$ | $1-x=2\Rightarrow x=-1$ |
          | $\to\infty$ | $1-x\to0\Rightarrow x\to1$ |

          El intervalo infinito se convierte en $\left[-1,1\right]$.

      - tipo: calcular
        titulo: El valor exacto
        pregunta: |
          ¿Cuánto vale exactamente
          $\int_{1}^{\infty}\frac{dr}{\left(r+1\right)^{3}}$?
        respuesta:
          tipo: numero
          valor: '0.125'
          tolerancia: 0.0001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.25'
            mensaje: |
              $\frac14$ sale de olvidar el $2$ del denominador de la primitiva:
              $\int u^{-3}du=-\frac{u^{-2}}{2}$.
          - valor: '0.5'
            mensaje: |
              $\frac12$ sería $\int_{1}^{\infty}\frac{dr}{\left(r+1\right)^{2}}$,
              con exponente $2$ en vez de $3$.
          - valor: '0.0625'
            mensaje: |
              $\frac{1}{16}$ sale de evaluar en $r=1$ como si $r+1$ fuese $1$. En
              $r=1$, $r+1=2$ y $\frac{1}{2\cdot4}=\frac18$.
        pista: |
          La primitiva es $-\frac{1}{2\left(r+1\right)^{2}}$, y en $r=1$ el
          paréntesis vale $2$.
        desarrollo: |
          $$
          \int_{1}^{\infty}\frac{dr}{\left(r+1\right)^{3}}
          =\left[-\frac{1}{2\left(r+1\right)^{2}}\right]_{1}^{\infty}
          =0+\frac{1}{2\cdot 2^{2}}=\frac18=0{,}125
          $$

          Tenerlo calculado permite juzgar la aproximación del apartado b), que es
          de lo que trata el ejercicio.

      - tipo: justificar
        pregunta: Ordena el apartado b). Una pieza es falsa.
        piezas:
          - texto: >-
              Tras el cambio, la integral es
              $\int_{-1}^{1}\frac{2\left(1-x\right)}{\left(3-x\right)^{3}}dx$, con
              el integrando continuo en todo el intervalo.
          - texto: >-
              Con cuatro subintervalos de $\left[-1,1\right]$, el paso es
              $h=\frac{2}{4}=0{,}5$ y los puntos medios son
              $-0{,}75$, $-0{,}25$, $0{,}25$ y $0{,}75$.
          - texto: >-
              La regla del punto medio da
              $h\sum g\left(x_{i}\right)=0{,}5\cdot0{,}25522=0{,}12761$, frente al
              valor exacto $0{,}125$.
          - texto: >-
              Como el integrando original está definido en el infinito, los puntos
              medios hay que tomarlos sobre el intervalo original
              $\left[1,\infty\right)$.
            trampa: true
            mensaje: |
              No se puede: en un intervalo infinito no hay «puntos medios» de
              subintervalos de la misma anchura, porque la anchura sería infinita.
              Eso es exactamente lo que el cambio de variable viene a arreglar, y
              por eso el enunciado pide primero el cambio y después la
              aproximación.
    resolucion: |
      **a) El cambio.** Con $a=1$ —el extremo inferior de la integral—:

      $$
      r=\frac{2}{1-x}
      \;\Longrightarrow\;
      dr=\frac{2}{\left(1-x\right)^{2}}\,dx
      $$

      | $r$ | $x$ |
      |---|---|
      | $1$ | $-1$ |
      | $\to\infty$ | $\to1$ |

      Y el denominador:

      $$
      r+1=\frac{2}{1-x}+1=\frac{2+1-x}{1-x}=\frac{3-x}{1-x}
      \;\Longrightarrow\;
      \left(r+1\right)^{3}=\frac{\left(3-x\right)^{3}}{\left(1-x\right)^{3}}
      $$

      Juntando las dos cosas, los $\left(1-x\right)$ se simplifican casi del todo:

      $$
      \frac{dr}{\left(r+1\right)^{3}}
      =\frac{2}{\left(1-x\right)^{2}}\cdot
      \frac{\left(1-x\right)^{3}}{\left(3-x\right)^{3}}\,dx
      =\frac{2\left(1-x\right)}{\left(3-x\right)^{3}}\,dx
      $$

      $$
      \boxed{\;\int_{1}^{\infty}\frac{dr}{\left(r+1\right)^{3}}
      =\int_{-1}^{1}\frac{2\left(1-x\right)}{\left(3-x\right)^{3}}\,dx\;}
      $$

      **Y lo importante: el nuevo integrando es continuo en todo
      $\left[-1,1\right]$**, incluido el extremo $x=1$, donde vale $0$. El
      infinito ha desaparecido. Esa es toda la razón de ser del cambio.

      **b) La regla del punto medio.** Cuatro subintervalos de
      $\left[-1,1\right]$: paso $h=\frac{2}{4}=0{,}5$ y puntos medios en

      $$
      -0{,}75,\quad -0{,}25,\quad 0{,}25,\quad 0{,}75
      $$

      | $x_{i}$ | $g\left(x_{i}\right)=\frac{2\left(1-x_{i}\right)}{\left(3-x_{i}\right)^{3}}$ |
      |---|---|
      | $-0{,}75$ | $\frac{3{,}5}{52{,}734}=0{,}066370$ |
      | $-0{,}25$ | $\frac{2{,}5}{34{,}328}=0{,}072827$ |
      | $0{,}25$ | $\frac{1{,}5}{20{,}797}=0{,}072126$ |
      | $0{,}75$ | $\frac{0{,}5}{11{,}391}=0{,}043896$ |

      $$
      \int\approx h\sum g\left(x_{i}\right)=0{,}5\cdot0{,}255219
      =\boxed{\;0{,}12761\;}
      $$

