      Un diente de sierra con meseta: sube en línea recta de $0$ a $1$ en la
      primera mitad del periodo, se queda en $1$ en la segunda, y vuelve a caer.

      **b) La serie.** Con $T=4$, la frecuencia fundamental es
      $\frac{2\pi}{T}=\frac{\pi}{2}$ y

      $$
      S(t)=\frac{a_{0}}{2}
      +\sum_{n=1}^{\infty}\left[a_{n}\cos\frac{n\pi t}{2}
      +b_{n}\operatorname{sen}\frac{n\pi t}{2}\right]
      $$

      **El término independiente** es el valor medio:

      $$
      \frac{a_{0}}{2}=\frac14\left(\underbrace{\int_{0}^{2}\frac t2\,dt}_{=1}
      +\underbrace{\int_{2}^{4}1\,dt}_{=2}\right)=\frac34
      $$

      **Los cosenos.** La meseta no aporta nada —$\int_{2}^{4}\cos\frac{n\pi
      t}{2}dt=0$— y la rampa da

      $$
      a_{n}=\frac{(-1)^{n}-1}{n^{2}\pi^{2}}
      =\begin{cases}
      -\dfrac{2}{n^{2}\pi^{2}} & n\ \text{impar}\\[6pt]
      0 & n\ \text{par}
      \end{cases}
      $$

      **Los senos.** Aquí sí aportan los dos trozos, y al sumarlos se cancela
      casi todo:

      $$
      b_{n}=-\frac{1}{n\pi}
      \qquad\text{para todo }n
      $$

      $$
      S(t)=\frac34
      -\frac{2}{\pi^{2}}\sum_{n\ \text{impar}}\frac{1}{n^{2}}
      \cos\frac{n\pi t}{2}
      -\frac{1}{\pi}\sum_{n=1}^{\infty}\frac{1}{n}
      \operatorname{sen}\frac{n\pi t}{2}
      $$

      **c) Los tres puntos.** Lo primero, siempre, reducir módulo $4$.

      | $t$ | reducido | dónde cae | $f(t)$ | $S(t)$ |
      |---|---|---|---|---|
      | $-40{,}2$ | $3{,}8$ | meseta, continua | $1$ | $1$ |
      | $20$ | $0$ | salto | no definida | $\frac12$ |
      | $49{,}5$ | $1{,}5$ | rampa, continua | $0{,}75$ | $0{,}75$ |

      En los dos puntos de continuidad la serie converge al valor de la función,
      por Dirichlet. En $t=20$ hay un salto: el límite por la izquierda es $1$
      —se viene de la meseta— y por la derecha es $0$, así que la serie converge
      a la media, $\frac12$. Y $f$ **no está definida** ahí, porque el enunciado
      la da en $0<t\le 2$ y $2<t<4$ y deja fuera los múltiplos de $4$.

      **d) La suma.** Es el regalo del apartado anterior. En $t=0$ todos los
      senos se anulan y todos los cosenos valen $1$:

      $$
      S(0)=\frac34-\frac{2}{\pi^{2}}\sum_{k=0}^{\infty}\frac{1}{(2k+1)^{2}}
      $$

      y $S(0)=\frac12$ por lo del salto. Despejando:

      $$
      \sum_{n=0}^{\infty}\frac{1}{(2n+1)^{2}}=\frac{\pi^{2}}{8}\approx 1{,}2337
      $$

      **Un control.** La suma de **todos** los inversos de los cuadrados es
      $\frac{\pi^{2}}{6}$, y la de los pares es
      $\sum\frac{1}{(2k)^{2}}=\frac14\cdot\frac{\pi^{2}}{6}=\frac{\pi^{2}}{24}$.
      Restando: $\frac{\pi^{2}}{6}-\frac{\pi^{2}}{24}=\frac{\pi^{2}}{8}$.
      Coincide, y de paso explica por qué los impares se llevan las tres cuartas
      partes de la suma.
