        <g class="do25-n">
          <text x="218" y="62" text-anchor="end">4</text>
          <text x="360" y="265" text-anchor="middle">1</text>
          <text x="100" y="265" text-anchor="middle">−1</text>
          <text x="329.9" y="108.2">(√2/2, 2√2)</text>
          <text x="429" y="264">x</text>
          <text x="237" y="31">y</text>
          <text x="45.4" y="101.2">x² + y²/16 = 1</text>
          <text x="284.6" y="209.2">y = 4x</text>
        </g>
        <text class="do25-et" x="217" y="158.8">D</text>
      </svg>
      <figcaption>
      Figura nuestra: el apartado a) pide dibujar el dominio y el examen no trae
      ninguna. La elipse completa va a trazos para situar el casquete.
      </figcaption>
      </figure>

      El primer sumando recorre las franjas horizontales entre las rectas
      $x=\pm\frac{y}{4}$ —es decir $y=\pm 4x$— desde $y=0$ hasta
      $y=2\sqrt2$: una **cuña** con el vértice en el origen.

      El segundo recorre las franjas entre $x=\pm\sqrt{1-\frac{y^{2}}{16}}$, que
      es la elipse $x^{2}+\frac{y^{2}}{16}=1$ de semiejes $1$ y $4$, desde
      $y=2\sqrt2$ hasta $y=4$: el **casquete** superior.

      Y encajan sin hueco porque en $y=2\sqrt2$ las dos fórmulas dan la misma
      abscisa:

      $$
      \frac{2\sqrt2}{4}=\frac{\sqrt2}{2},
      \qquad
      \sqrt{1-\frac{8}{16}}=\frac{\sqrt2}{2}
      $$

      El resultado tiene forma de cucurucho: sale en punta del origen y se cierra
      arriba con el arco de la elipse.

      **b) El orden cambiado.** Por franjas verticales el dominio ya no se parte.
      Para cada $x$ entre $-\frac{\sqrt2}{2}$ y $\frac{\sqrt2}{2}$, la $y$ va
      desde la recta hasta la elipse:

      $$
      \int_{-\frac{\sqrt2}{2}}^{\frac{\sqrt2}{2}}
      \left(\int_{4\left|x\right|}^{4\sqrt{1-x^{2}}}dy\right)dx
      $$

      o, si se prefiere sin valor absoluto, en dos trozos simétricos con
      $y=-4x$ a la izquierda y $y=4x$ a la derecha. **Una sola integral en vez
      de dos**: ese es el premio de cambiar el orden aquí, y conviene decirlo
      porque es lo contrario de lo que suele pasar.

      **c) El área.** Sumando los dos trozos:

      $$
      \underbrace{\int_{0}^{2\sqrt2}\frac{y}{2}\,dy}_{=\,2}
      +\underbrace{\int_{2\sqrt2}^{4}2\sqrt{1-\frac{y^{2}}{16}}\,dy}_{=\,\pi-2}
      =\pi
      $$

      **La vía elegante.** El cambio $u=x$, $v=\frac{y}{4}$ tiene jacobiano
      $\frac{\partial(x,y)}{\partial(u,v)}=4$, convierte la elipse en la
      circunferencia unidad y las rectas $x=\pm\frac y4$ en $u=\pm v$. En las
      nuevas variables $D$ es el sector de $90^{\circ}$ del disco unidad centrado
      en el eje $v$, de área $\frac{\pi}{4}$. Multiplicando por el jacobiano:

      $$
      \text{área}(D)=4\cdot\frac{\pi}{4}=\pi
      $$

      Que el área salga exactamente $\pi$ no es casualidad: $D$ es un cuarto de
      elipse estirado, y la elipse entera mide $4\pi$.

  - id: ex2425-ord-6-el-montanero-y-la-ventisca
    titulo: Una EDO que se convierte en camino de montaña
    fuente: >-
      Ejercicio 2 del SEGUNDO PARCIAL · Convocatoria ordinaria, 10 de junio de 2025 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      a) Resolver la EDO $xy'-y=x^{3}$, $y(1)=1$.

      b) La solución de la EDO del apartado anterior representa la trayectoria
      $C$ de una curva en el plano $XY$. $z(x,y)=10+2y-x^{3}$ representa la
      altura de una montaña para cada punto $(x,y)$ del plano $XY$. Calcular las
      ecuaciones paramétricas $\left(x(t),y(t),z(t)\right)$ que representan la
      trayectoria de la curva $C$ anterior sobre la montaña.

      c) Un montañero se encuentra inicialmente en el punto $A=(1,1,11)$ y planea
      llegar hasta un punto $B$ siguiendo la trayectoria $C$. El punto $B$ se
      encuentra a una altitud de 12 metros. Calcular las coordenadas de $B$.

      d) Se ha formado una ventisca que aplica una fuerza
      $V(x,y,z)=\left(yz-y,\ xz-x+z,\ xy+y\right)$ sobre la posición $(x,y,z)$ en
      la que se encuentra en cada instante el montañero. Calcular el trabajo que
      efectuará la fuerza de la ventisca sobre el montañero a lo largo de la
      trayectoria anterior $C$.
    pide: La solución de la EDO, la curva sobre la montaña, el punto B y el trabajo.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De qué tipo es $xy'-y=x^{3}$?
        opciones:
          - texto: >-
              Lineal de primer orden: dividiendo entre $x$ queda
              $y'-\frac{y}{x}=x^{2}$, y su factor integrante es $\frac1x$
            correcta: true
            mensaje: |
              Eso es, y con ese factor el primer miembro se convierte en
              $\left(\frac{y}{x}\right)'$, que se integra de un golpe. Es de las
              pocas veces que el factor integrante sale a ojo.
          - texto: >-
              De variables separables
            mensaje: |
              No lo es: al despejar $y'=\frac{y+x^{3}}{x}$ el segundo miembro no
              se puede escribir como producto de una función de $x$ por una de
              $y$, porque $y$ y $x^{3}$ están sumados.
          - texto: >-
              Exacta, porque $M_{y}=N_{x}$
            mensaje: |
              Escrita como $\left(y+x^{3}\right)dx-x\,dy=0$ sale $M_{y}=1$ y
              $N_{x}=-1$: no coinciden, así que no es exacta tal cual. (Sí lo
              sería multiplicando por $\frac{1}{x^{2}}$, que es otra forma de
              llegar al mismo sitio.)

      - tipo: calcular
        titulo: La altura en función del parámetro
        pregunta: |
          Parametrizando con $x=t$, la altura sobre la montaña queda
          $z(t)=k+t$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '10'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '11'
            mensaje: |
              $11$ es la altura del punto de partida $A$, que corresponde a
              $t=1$. La constante de la fórmula es la altura en $t=0$.
          - valor: '12'
            mensaje: |
              $12$ es la altura del punto de llegada. Sustituye:
              $z=10+2\cdot\frac{t^{3}+t}{2}-t^{3}=10+t$, y los cubos se cancelan.
          - valor: '0'
            mensaje: |
              El $10$ de $z=10+2y-x^{3}$ no desaparece: es la altura del terreno
              en el origen y sobrevive a la sustitución.
        pista: |
          Sustituye $y=\frac{t^{3}+t}{2}$ y $x=t$ en $z=10+2y-x^{3}$ y mira qué
          se cancela.
        desarrollo: |
          La EDO da $y=\frac{x^{3}+x}{2}$, así que con $x=t$:

          $$
          z=10+2\cdot\frac{t^{3}+t}{2}-t^{3}
          =10+t^{3}+t-t^{3}
          =10+t
          $$

          Los cubos se cancelan y la altura crece **linealmente** con el
          parámetro. Es lo que hace fácil el apartado c).

      - tipo: calcular
        titulo: La ordenada del punto B
        pregunta: |
          ¿Cuánto vale la coordenada $y$ del punto $B$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Esa es la coordenada $x$ de $B$, que sale de $10+t=12$. Luego hay
              que meterla en $y=\frac{t^{3}+t}{2}$.
          - valor: '4'
            mensaje: |
              Has usado $y=t^{2}$ o algo parecido. Con $t=2$:
              $y=\frac{8+2}{2}=5$.
          - valor: '1'
            mensaje: |
              Ese es el valor en el punto de partida $A$, con $t=1$.
        pista: |
          Primero el parámetro: $10+t=12$.
        desarrollo: |
          $$
          z=10+t=12
          \;\Longrightarrow\;
          t=2
          $$

          $$
          x=2,
          \qquad
          y=\frac{2^{3}+2}{2}=5,
          \qquad
          z=12
          $$

          $$
          B=(2,5,12)
          $$

      - tipo: calcular
        titulo: El trabajo de la ventisca
        pregunta: |
          ¿Cuánto vale el trabajo de $V$ a lo largo de $C$, de $A$ a $B$?
        respuesta:
          tipo: numero
          valor: '149'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '170'
            mensaje: |
              Ese es el potencial en $B$. Falta restar el potencial en $A$, que
              vale $21$.
          - valor: '-149'
            mensaje: |
              Signo. El trabajo es $f(B)-f(A)$, y el montañero va de $A$ a $B$.
          - valor: '191'
            mensaje: |
              Has sumado los dos potenciales en vez de restarlos:
              $170+21$.
        pista: |
          Antes de parametrizar nada, comprueba las tres derivadas cruzadas de
          $V$.
        desarrollo: |
          El campo es conservativo:

          $$
          \frac{\partial}{\partial y}(yz-y)=z-1
          =\frac{\partial}{\partial x}(xz-x+z),
          \quad
          \frac{\partial}{\partial z}(yz-y)=y
          =\frac{\partial}{\partial x}(xy+y),
          $$

          $$
          \frac{\partial}{\partial z}(xz-x+z)=x+1
          =\frac{\partial}{\partial y}(xy+y)
          $$

          y su potencial es $f(x,y,z)=xyz-xy+yz$. Por tanto

          $$
          W=f(2,5,12)-f(1,1,11)=(120-10+60)-(11-1+11)=170-21=149
          $$

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              **a)** $y'-\frac yx=x^{2}$ es lineal; con el factor integrante
              $\frac1x$ queda $\left(\frac yx\right)'=x$, luego
              $y=\frac{x^{3}}{2}+Cx$, y $y(1)=1$ da $C=\frac12$:
              $y=\frac{x^{3}+x}{2}$.
          - texto: >-
              **b)** Con $x=t$: $\left(t,\ \frac{t^{3}+t}{2},\ 10+t\right)$,
              porque al sustituir en $z=10+2y-x^{3}$ los cubos se cancelan.
          - texto: >-
              **c)** $A$ corresponde a $t=1$ y $B$ a $10+t=12$, es decir $t=2$:
              $B=(2,5,12)$.
          - texto: >-
              **d)** $V$ es conservativo —las tres derivadas cruzadas coinciden—
              con potencial $f=xyz-xy+yz$.
          - texto: >-
              Por tanto $W=f(B)-f(A)=170-21=149$, sin parametrizar la curva.
          - texto: >-
              Como la trayectoria sube de $11$ a $12$ metros, el trabajo de la
              ventisca es la diferencia de alturas por la fuerza: $12-11=1$.
            trampa: true
            mensaje: |
              Eso sería el trabajo de una fuerza **vertical y constante**, como
              el peso. La ventisca no lo es: su valor depende de las tres
              coordenadas y tiene componentes en las tres direcciones. Lo que sí
              se puede aprovechar es que es conservativa, que es otra cosa: el
              trabajo no depende del camino, pero sí de los dos puntos enteros y
              no solo de su altura.

    resolucion: |
      **a) La EDO.** Dividiendo entre $x$ queda lineal:

      $$
      y'-\frac{y}{x}=x^{2}
      $$

      El factor integrante es $e^{\int-\frac{dx}{x}}=\frac1x$, y con él el primer
      miembro se convierte en una derivada exacta:

      $$
      \left(\frac{y}{x}\right)'=x
      \;\Longrightarrow\;
      \frac{y}{x}=\frac{x^{2}}{2}+C
      \;\Longrightarrow\;
      y=\frac{x^{3}}{2}+Cx
      $$

      Con $y(1)=1$: $\frac12+C=1$, luego $C=\frac12$ y

      $$
      y=\frac{x^{3}+x}{2}
      $$

      **b) La curva sobre la montaña.** Tomando la propia $x$ como parámetro,
      $x=t$:

      $$
      z=10+2\cdot\frac{t^{3}+t}{2}-t^{3}=10+t^{3}+t-t^{3}=10+t
      $$

      Los cubos se cancelan, y eso es lo que hace bonito el ejercicio: sobre esta
      curva concreta, **la altura crece exactamente al ritmo del parámetro**.

      $$
      \left(x(t),y(t),z(t)\right)
      =\left(t,\ \frac{t^{3}+t}{2},\ 10+t\right)
      $$

      **c) El punto $B$.** El de partida es $A=(1,1,11)$, que corresponde a
      $t=1$ —se comprueba: $y(1)=1$ y $z(1)=11$—. Y

      $$
      z=12
      \;\Longrightarrow\;
      10+t=12
      \;\Longrightarrow\;
      t=2
      \;\Longrightarrow\;
      B=\left(2,\ 5,\ 12\right)
      $$

      **d) El trabajo.** Antes de parametrizar nada, la comprobación de siempre.
      Con $V=(P,Q,R)=\left(yz-y,\ xz-x+z,\ xy+y\right)$:

      $$
      P_{y}=z-1=Q_{x},
      \qquad
      P_{z}=y=R_{x},
      \qquad
      Q_{z}=x+1=R_{y}
      $$

      Las tres coinciden y el campo está definido en todo el espacio: es
      **conservativo**. Su potencial se busca integrando:

      $$
      f(x,y,z)=xyz-xy+yz
      $$

      y se comprueba derivando las tres componentes. Por tanto el trabajo no
      depende del camino:

      $$
      W=f(B)-f(A)=f(2,5,12)-f(1,1,11)
      =170-21=149
      $$

      **Lo que hay que ver para no perder el examen.** El apartado d) parece
      pedir una integral de línea sobre una curva de tercer grado, y no lo pide:
      pide dos evaluaciones de una función. La comprobación de las tres derivadas
      cruzadas cuesta seis derivadas y ahorra veinte minutos.

  - id: ex2425-ord-7-la-integral-que-se-resuelve-con-laplace
    titulo: Una ecuación integral, y la respuesta son todas las constantes
    fuente: >-
      Ejercicio 3 del SEGUNDO PARCIAL · Convocatoria ordinaria, 10 de junio de 2025 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 1
      comp2: 7
      comp4: 2
    enunciado: |
      Resolver la ecuación

      $$
      \int_{0}^{t}y(z)\,dz=t\,y(t)
      $$
    pide: Todas las funciones y(t) que cumplen la ecuación.

    pasos:
      - tipo: reconocer
        pregunta: |
          La incógnita está dentro de una integral. ¿Qué la saca?
        opciones:
          - texto: >-
              La transformada de Laplace: convierte
              $\int_{0}^{t}y$ en $\frac{Y(s)}{s}$ y $t\,y(t)$ en $-Y'(s)$
            correcta: true
            mensaje: |
              Eso es. Las dos propiedades juntas convierten una ecuación integral
              en una ecuación diferencial de primer orden y separable en $Y(s)$.
          - texto: >-
              Derivar los dos miembros respecto de $t$
            mensaje: |
              También sirve, y es más corto: por el teorema fundamental el primer
              miembro da $y(t)$ y el segundo $y(t)+t\,y'(t)$, de donde
              $t\,y'=0$. Las dos vías llegan al mismo sitio; el enunciado está en
              el bloque de Laplace, pero conviene saber que hay atajo.
          - texto: >-
              No se puede: una ecuación integral no es una ecuación diferencial
            mensaje: |
              Sí se puede, y por dos caminos. Precisamente para eso está la
              transformada de Laplace en el temario.

      - tipo: calcular
        titulo: La transformada
        pregunta: |
          De la ecuación sale $\frac{Y}{s}=-Y'$. Resolviéndola, $Y=\frac{K}{s^{p}}$.
          ¿Cuánto vale $p$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Con $Y=\frac{K}{s^{2}}$ saldría $y=Kt$, y esa no cumple:
              $\int_{0}^{t}Kz\,dz=\frac{Kt^{2}}{2}$ y $t\cdot Kt=Kt^{2}$, que no
              son iguales.
          - valor: '-1'
            mensaje: |
              $Y=Ks$ no es la transformada de ninguna función razonable: una
              transformada tiene que tender a cero cuando $s\to\infty$.
          - valor: '0'
            mensaje: |
              $Y=K$ constante tampoco tiende a cero en el infinito. Resuelve
              $\frac{Y'}{Y}=-\frac1s$ y sale $\ln Y=-\ln s+c$.
        pista: |
          $\frac{Y'}{Y}=-\frac{1}{s}$ es de variables separadas.
        desarrollo: |
          $$
          \frac{Y}{s}=-Y'
          \;\Longrightarrow\;
          \frac{Y'}{Y}=-\frac1s
          \;\Longrightarrow\;
          \ln Y=-\ln s+c
          \;\Longrightarrow\;
          Y=\frac{K}{s}
          $$

          y $\mathcal{L}^{-1}\left\{\frac{K}{s}\right\}=K$: la solución es
          cualquier función **constante**.

      - tipo: calcular
        titulo: Cuántas soluciones
        pregunta: |
          ¿Cuántas funciones distintas cumplen la ecuación? Escribe $0$ si
          ninguna, $1$ si solo una, y $-1$ si son infinitas.
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: 0 si ninguna, 1 si solo una, -1 si son infinitas
        distractores:
          - valor: '1'
            mensaje: |
              Solo habría una si algo fijara la constante, y no hay condición
              inicial: la ecuación se cumple con $y\equiv K$ para **cualquier**
              $K$. Fíjate en que $y\equiv 0$ también vale.
          - valor: '0'
            mensaje: |
              Hay solución: cualquier constante la cumple. Compruébalo con
              $y\equiv 3$: $\int_{0}^{t}3\,dz=3t$ y $t\cdot 3=3t$.
        pista: |
          ¿Fija algo el valor de $K$?
        desarrollo: |
          La ecuación no trae condición inicial, así que $K$ queda libre: **toda
          función constante** es solución, y no hay ninguna más.

          Se comprueba de un vistazo: con $y\equiv K$,

          $$
          \int_{0}^{t}K\,dz=Kt
          \qquad\text{y}\qquad
          t\cdot y(t)=Kt
          $$

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\mathcal{L}\left\{\int_{0}^{t}y(z)dz\right\}=\dfrac{Y(s)}{s}$ y
              $\mathcal{L}\left\{t\,y(t)\right\}=-Y'(s)$.
          - texto: >-
              La ecuación se convierte en $\dfrac{Y}{s}=-Y'$, que es de variables
              separadas.
          - texto: >-
              Integrando, $\ln Y=-\ln s+c$, es decir $Y=\dfrac{K}{s}$.
          - texto: >-
              Antitransformando, $y(t)=K$: cualquier función constante, y no hay
              condición inicial que fije $K$.
          - texto: >-
              Se comprueba directamente: $\int_{0}^{t}K\,dz=Kt=t\cdot K$.
          - texto: >-
              El mismo resultado sale derivando los dos miembros:
              $y(t)=y(t)+t\,y'(t)$, luego $t\,y'(t)=0$ y $y'\equiv 0$ para
              $t>0$.
          - texto: >-
              Como la ecuación relaciona $y$ con su integral, la solución tiene
              que ser una exponencial.
            trampa: true
            mensaje: |
              Es el reflejo de siempre —«integral y función proporcionales,
              luego exponencial»— y aquí falla, porque el segundo miembro no es
              proporcional a $y$: lleva una $t$ multiplicando. Pruébalo:
              con $y=e^{at}$, $\int_{0}^{t}y=\frac{e^{at}-1}{a}$ y
              $t\,y=t\,e^{at}$, que no coinciden para ningún $a$.

    resolucion: |
      **Por qué Laplace.** La incógnita aparece dentro de una integral, y la
      transformada tiene una propiedad para cada uno de los dos miembros:

      $$
      \mathcal{L}\left\{\int_{0}^{t}y(z)\,dz\right\}=\frac{Y(s)}{s},
      \qquad
      \mathcal{L}\left\{t\,y(t)\right\}=-\frac{dY}{ds}
      $$

      **La ecuación transformada.**

      $$
      \frac{Y}{s}=-Y'
      \;\Longrightarrow\;
      \frac{Y'}{Y}=-\frac{1}{s}
      \;\Longrightarrow\;
      \ln Y=-\ln s+c
      \;\Longrightarrow\;
      Y(s)=\frac{K}{s}
      $$

      **Antitransformando.**

      $$
      y(t)=K
      $$

      **Cualquier constante**, y no hay más soluciones. No hay condición inicial
      que fije $K$, así que la respuesta es una familia entera — incluida
      $y\equiv 0$.

      **La comprobación, que aquí es obligatoria.** Con $y\equiv K$:

      $$
      \int_{0}^{t}K\,dz=Kt
      \qquad\text{y}\qquad
      t\,y(t)=Kt
      $$

      **El atajo, que conviene conocer.** Derivando los dos miembros respecto de
      $t$, el teorema fundamental da $y(t)$ a la izquierda y la regla del
      producto da $y(t)+t\,y'(t)$ a la derecha:

      $$
      y(t)=y(t)+t\,y'(t)
      \;\Longrightarrow\;
      t\,y'(t)=0
      \;\Longrightarrow\;
      y'(t)=0\ \text{para } t>0
      $$

      Mismo resultado en dos líneas. El ejercicio está en el bloque de Laplace y
      por eso se resuelve así, pero decir que hay otra vía —y que las dos
      coinciden— es exactamente lo que COMP4 premia.

  - id: ex2425-ord-8-fourier-con-meseta
    titulo: Un diente de sierra con meseta, y la suma de los inversos de los impares
    fuente: >-
      Ejercicio 4 del SEGUNDO PARCIAL · Convocatoria ordinaria, 10 de junio de 2025 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea $f(t)$ la función periódica de periodo $T=4$ definida de la forma
      siguiente:

      $$
      f(t)=
      \begin{cases}
      \dfrac{t}{2} & 0<t\le 2\\[8pt]
      1 & 2<t<4
      \end{cases}
      $$

      a) Dibujar la función $f(t)$.

      b) Calcular la serie de Fourier, $S(t)$, de $f(t)$.

      c) Calcular, justificando la respuesta, los valores de $S(t)$ y $f(t)$ en
      los puntos $t=-40{,}2$, $t=20$ y $t=49{,}5$.

      d) Calcular $\displaystyle\sum_{n=0}^{\infty}\frac{1}{(2n+1)^{2}}$.
    pide: El dibujo, la serie, los tres valores y la suma.

    pasos:
      - tipo: reconocer
        pregunta: |
          La función no es par ni impar. ¿Qué implica eso para la serie?
        opciones:
          - texto: >-
              Que hay que calcular los tres tipos de coeficiente: $a_{0}$,
              $a_{n}$ y $b_{n}$
            correcta: true
            mensaje: |
              Eso es. La paridad es lo que permite ahorrarse la mitad del
              trabajo, y aquí no la hay: la función vale entre $0$ y $1$ en todo
              el periodo, así que ni siquiera tiene media nula.
          - texto: >-
              Que la serie solo tiene senos
            mensaje: |
              Eso pasa con las funciones **impares**. Esta no lo es: sus valores
              son todos positivos, y una función impar tendría que tomar valores
              de los dos signos.
          - texto: >-
              Que la serie no converge
            mensaje: |
              La paridad no tiene nada que ver con la convergencia. Esta función
              es continua a trozos y con derivada a trozos: Dirichlet garantiza
              que la serie converge en todo punto.

      - tipo: calcular
        titulo: El término independiente
        pregunta: |
          ¿Cuánto vale $\dfrac{a_{0}}{2}$, es decir, el valor medio de $f$ en un
          periodo?
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.5'
            mensaje: |
              Ese es $a_{0}$, sin dividir entre $2$. En la escritura
              $S(t)=\frac{a_{0}}{2}+\sum\left(\ldots\right)$ el término
              independiente lleva el $\frac12$.
          - valor: '0.5'
            mensaje: |
              Has promediado solo los valores extremos, $0$ y $1$. Hay que
              integrar: la rampa aporta área $1$ y la meseta área $2$, sobre un
              periodo de longitud $4$.
          - valor: '1'
            mensaje: |
              Ese es el valor máximo, no el medio. La función pasa la mitad del
              periodo subiendo desde cero.
        pista: |
          $\frac{a_{0}}{2}=\frac{1}{T}\int_{0}^{T}f$, y el área bajo $f$ son un
          triángulo y un rectángulo.
        desarrollo: |
          $$
          \frac{a_{0}}{2}=\frac14\left(\int_{0}^{2}\frac{t}{2}\,dt
          +\int_{2}^{4}1\,dt\right)
          =\frac14\left(1+2\right)=\frac34
          $$

      - tipo: calcular
        titulo: El valor de la serie en un salto
        pregunta: |
          ¿Cuánto vale $S(20)$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              Ese es el límite por la **izquierda**: al acercarse a $t=20$ por
              debajo se viene de la meseta. Por la derecha se entra en la rampa y
              el límite es $0$. En un salto la serie converge a la media.
          - valor: '0'
            mensaje: |
              Ese es el límite por la **derecha**. Por la izquierda vale $1$, y
              la serie converge al punto medio de los dos.
          - valor: '10'
            mensaje: |
              Has sustituido en $\frac t2$ sin reducir el punto al periodo. $f$
              es periódica: $20$ es múltiplo de $4$ y equivale a $t=0$.
        pista: |
          Reduce $20$ módulo $4$ y mira los dos límites laterales.
        desarrollo: |
          $20=5\cdot 4$, así que $t=20$ equivale a $t=0$, y ahí hay un salto:

          $$
          \lim_{t\to 0^{-}}f=1
          \quad\text{(se viene de la meseta)},
          \qquad
          \lim_{t\to 0^{+}}f=0
          $$

          Por el teorema de Dirichlet la serie converge a la media:

          $$
          S(20)=\frac{1+0}{2}=\frac12
          $$

          y $f(20)$ **no está definida**: el enunciado da $f$ en $0<t\le 2$ y en
          $2<t<4$, y deja fuera los múltiplos de $4$.

      - tipo: calcular
        titulo: La suma del apartado d)
        pregunta: |
          ¿Cuánto vale $\displaystyle\sum_{n=0}^{\infty}\frac{1}{(2n+1)^{2}}$?
        respuesta:
          tipo: numero
          valor: '1.2337006'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.6449341'
            mensaje: |
              Ese es $\frac{\pi^{2}}{6}$, la suma de **todos** los inversos de
              los cuadrados. Aquí solo entran los impares, que se llevan tres
              cuartas partes de ella: $\frac34\cdot\frac{\pi^{2}}{6}
              =\frac{\pi^{2}}{8}$.
          - valor: '0.7853982'
            mensaje: |
              Ese es $\frac{\pi}{4}$, la suma de la serie de Leibniz, que lleva
              $2n+1$ pero **sin** elevar al cuadrado y con signos alternados.
          - valor: '0.4112335'
            mensaje: |
              Ese es $\frac{\pi^{2}}{24}$, la suma de los inversos de los
              cuadrados **pares**. Los impares se llevan la parte grande.
        pista: |
          Evalúa la serie de Fourier en el punto donde ya sabes que vale
          $\frac12$: solo sobreviven los cosenos.
        desarrollo: |
          En $t=0$ los senos se anulan y los cosenos valen $1$:

          $$
          S(0)=\frac34+\sum_{n\ \text{impar}}\left(-\frac{2}{n^{2}\pi^{2}}\right)
          =\frac34-\frac{2}{\pi^{2}}\sum_{k=0}^{\infty}\frac{1}{(2k+1)^{2}}
          $$

          y ya sabemos que $S(0)=\frac12$, así que

          $$
          \frac{2}{\pi^{2}}\sum_{k=0}^{\infty}\frac{1}{(2k+1)^{2}}=\frac14
          \;\Longrightarrow\;
          \sum_{k=0}^{\infty}\frac{1}{(2k+1)^{2}}=\frac{\pi^{2}}{8}
          \approx 1{,}2337
          $$

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              **b)** Con $T=4$ la frecuencia es $\frac{2\pi}{T}=\frac{\pi}{2}$, y
              $\frac{a_{0}}{2}=\frac14\left(1+2\right)=\frac34$.
          - texto: >-
              Integrando, $a_{n}=\dfrac{(-1)^{n}-1}{n^{2}\pi^{2}}$: vale
              $-\dfrac{2}{n^{2}\pi^{2}}$ si $n$ es impar y $0$ si es par.
          - texto: >-
              Y $b_{n}=-\dfrac{1}{n\pi}$ para todo $n$: los dos trozos aportan y
              se suman.
          - texto: >-
              **c)** $-40{,}2\equiv 3{,}8$ y $49{,}5\equiv 1{,}5$ módulo $4$: en
              los dos la función es continua, así que $S=f$ y valen $1$ y
              $0{,}75$.
          - texto: >-
              $20\equiv 0$ es un salto, con límites $1$ y $0$: ahí
              $S=\frac12$ y $f$ no está definida.
          - texto: >-
              **d)** Evaluando la serie en $t=0$ solo quedan los cosenos, y de
              $\frac12=\frac34-\frac{2}{\pi^{2}}\Sigma$ sale
              $\Sigma=\frac{\pi^{2}}{8}$.
          - texto: >-
              Como $f$ solo toma valores positivos, todos los coeficientes de la
              serie son positivos.
            trampa: true
            mensaje: |
              No hay ninguna relación entre el signo de la función y el de sus
              coeficientes. Aquí, de hecho, **todos** los $b_{n}$ son negativos y
              los $a_{n}$ impares también. Lo único que la positividad garantiza
              es que el término independiente, que es el valor medio, sea
              positivo.

    resolucion: |
      **a) La gráfica.**

