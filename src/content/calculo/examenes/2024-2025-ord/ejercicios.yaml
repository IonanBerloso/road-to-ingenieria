          <text x="154" y="185" text-anchor="middle">2</text>
          <text x="218" y="185" text-anchor="middle">4</text>
          <text x="282" y="185" text-anchor="middle">6</text>
          <text x="346" y="185" text-anchor="middle">8</text>
