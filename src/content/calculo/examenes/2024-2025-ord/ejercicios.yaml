  - id: ex2425-ord-5-el-dominio-en-forma-de-cucurucho
    titulo: Un dominio en dos trozos que al girarlo se hace uno
    fuente: >-
      Ejercicio 1 del SEGUNDO PARCIAL · Convocatoria ordinaria, 10 de junio de 2025 ·
      Cálculo, UPV/EHU · El examen no publica solución: la resolución es
      propuesta nuestra, pendiente de revisión.
    nivel: examen
    puntos:
      comp1: 0
      comp2: 7
      comp4: 3
    enunciado: |
      Sea la integral

      $$
      \int_{0}^{2\sqrt2}\left(\int_{-y/4}^{y/4}dx\right)dy
      +\int_{2\sqrt2}^{4}\left(\int_{-\sqrt{1-\frac{y^{2}}{16}}}
      ^{\ \sqrt{1-\frac{y^{2}}{16}}}dx\right)dy
      $$

      a) Dibujar el dominio de integración $D$.

      b) Cambiar el orden de integración.

      c) Calcular el área de $D$.
    pide: El dibujo del dominio, la integral con el orden cambiado y el área.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué describen los dos sumandos?
        opciones:
          - texto: >-
              El primero, la cuña entre las rectas $y=4x$ e $y=-4x$ hasta la
              altura $2\sqrt2$; el segundo, el casquete de la elipse
              $x^{2}+\frac{y^{2}}{16}=1$ desde esa altura hasta $y=4$
            correcta: true
            mensaje: |
              Eso es. $x=\pm\frac{y}{4}$ son las rectas $y=\pm 4x$, y
              $x=\pm\sqrt{1-\frac{y^{2}}{16}}$ es la elipse de semiejes $1$ y
              $4$. Y las dos se encuentran exactamente en $y=2\sqrt2$, que es
              donde el enunciado corta.
          - texto: >-
              Dos trozos de circunferencia de radio 1
            mensaje: |
              El segundo trozo sería una circunferencia si el denominador fuera
              $1$ en vez de $16$. Con el $16$, el semieje vertical mide $4$ y el
              horizontal $1$: es una elipse muy alta.
          - texto: >-
              Un triángulo y un rectángulo
            mensaje: |
              El primer trozo sí es un triángulo —una cuña con el vértice en el
              origen—, pero el segundo tiene el borde curvo: es un casquete de
              elipse.

      - tipo: calcular
        titulo: Dónde se cortan los dos trozos
        pregunta: |
          En $y=2\sqrt2$ los dos trozos tienen la misma anchura. ¿Cuánto vale
          $x$ en el borde derecho a esa altura?
        respuesta:
          tipo: numero
          valor: '0.7071068'
          tolerancia: 0.0001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '2.8284271'
            mensaje: |
              Eso es $2\sqrt2$, la **altura**. La abscisa a esa altura es
              $\frac{y}{4}=\frac{2\sqrt2}{4}=\frac{\sqrt2}{2}$.
          - valor: '1'
            mensaje: |
              $1$ es el semieje horizontal de la elipse, la anchura máxima, y se
              alcanza en $y=0$. A la altura $2\sqrt2$ la elipse ya se ha
              estrechado.
          - valor: '0.5'
            mensaje: |
              Comprueba las dos fórmulas: $\frac{2\sqrt2}{4}=\frac{\sqrt2}{2}$ y
              $\sqrt{1-\frac{8}{16}}=\sqrt{\frac12}=\frac{\sqrt2}{2}$. Las dos
              dan lo mismo, y no es $\frac12$.
        pista: |
          Sustituye $y=2\sqrt2$ en cualquiera de las dos: tienen que coincidir.
        desarrollo: |
          Por la recta: $x=\frac{y}{4}=\frac{2\sqrt2}{4}=\frac{\sqrt2}{2}$.

          Por la elipse:
          $x=\sqrt{1-\frac{(2\sqrt2)^{2}}{16}}=\sqrt{1-\frac{8}{16}}
          =\sqrt{\tfrac12}=\frac{\sqrt2}{2}$.

          Coinciden, que es lo que permite pegar los dos trozos sin hueco ni
          solape. $\frac{\sqrt2}{2}\approx 0{,}7071$.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área de $D$?
        respuesta:
          tipo: numero
          valor: '3.1415927'
          tolerancia: 0.001
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              Ese es solo el área de la cuña,
              $\int_{0}^{2\sqrt2}\frac{y}{2}\,dy=2$. Falta el casquete de
              elipse, que aporta $\pi-2$.
          - valor: '1.1415927'
            mensaje: |
              Ese es solo el casquete, $\pi-2$. Falta la cuña, que aporta $2$.
          - valor: '12.5663706'
            mensaje: |
              Ese es el área de la elipse **entera**, $\pi\cdot 1\cdot 4=4\pi$.
              $D$ es solo el sector que queda entre las dos rectas, que resulta
              ser la cuarta parte.
        pista: |
          Suma la cuña y el casquete; o, mejor, estira: el cambio
          $u=x$, $v=\frac{y}{4}$ convierte la elipse en la circunferencia
          unidad.
        desarrollo: |
          **Directo.** La cuña:

          $$
          \int_{0}^{2\sqrt2}\frac{y}{2}\,dy
          =\frac{\left(2\sqrt2\right)^{2}}{4}=2
          $$

          El casquete, con $y=4\operatorname{sen}\theta$:

          $$
          \int_{2\sqrt2}^{4}2\sqrt{1-\frac{y^{2}}{16}}\,dy
          =8\int_{\pi/4}^{\pi/2}\cos^{2}\theta\,d\theta
          =\pi-2
          $$

          Total: $2+(\pi-2)=\pi$.

          **Estirando.** Con $u=x$, $v=\frac{y}{4}$ el jacobiano es $4$, la
          elipse se convierte en la circunferencia unidad y las rectas
          $x=\pm\frac y4$ en $u=\pm v$. $D$ se convierte en el **cuarto** de
          disco entre esas dos rectas, de área $\frac{\pi}{4}$, y

          $$
          \text{área}(D)=4\cdot\frac{\pi}{4}=\pi
          $$

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              **a)** El primer sumando es la cuña entre $y=4x$ e $y=-4x$ desde el
              origen hasta $y=2\sqrt2$; el segundo, el casquete de la elipse
              $x^{2}+\frac{y^{2}}{16}=1$ entre $y=2\sqrt2$ e $y=4$.
          - texto: >-
              Las dos piezas encajan porque en $y=2\sqrt2$ la recta y la elipse
              dan la misma abscisa, $\frac{\sqrt2}{2}$.
          - texto: >-
              **b)** Por franjas verticales, $x$ va de $-\frac{\sqrt2}{2}$ a
              $\frac{\sqrt2}{2}$ y, para cada $x$, la $y$ va de la recta
              $y=4\left|x\right|$ a la elipse $y=4\sqrt{1-x^{2}}$.
          - texto: >-
              Es decir,
              $\displaystyle\int_{-\sqrt2/2}^{\sqrt2/2}
              \left(\int_{4\left|x\right|}^{4\sqrt{1-x^{2}}}dy\right)dx$: **una
              sola** integral, frente a las dos de partida.
          - texto: >-
              **c)** El área vale $2+(\pi-2)=\pi$, y se confirma estirando:
              $u=x$, $v=\frac y4$ convierte $D$ en un cuarto de disco unidad, de
              área $\frac\pi4$, y el jacobiano es $4$.
          - texto: >-
              Como el dominio venía escrito en dos integrales, al cambiar el
              orden seguirán haciendo falta dos.
            trampa: true
            mensaje: |
              Al revés: en este ejercicio cambiar el orden **junta** los dos
              trozos en uno. Por franjas horizontales la tapa cambia de curva en
              $y=2\sqrt2$ y hay que partir; por franjas verticales, cada franja
              va siempre de la recta a la elipse y no hay nada que partir. Ese es
              justamente el premio del apartado b).

    resolucion: |
      **a) El dominio.**

