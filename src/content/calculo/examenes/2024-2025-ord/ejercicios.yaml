        <g class="gx25-n">
          <text x="36.2" y="121" text-anchor="middle">α</text>
          <text x="383.4" y="121" text-anchor="middle">β</text>
          <text x="418.4" y="144">x</text>
        </g>
        <text class="gx25-et" x="194.3" y="79.4">g(x)</text>
      </svg>
      <figcaption>
      Figura redibujada del enunciado original, que es un esbozo: aquí se traza
      la cúbica con la misma forma —un mínimo, una sola inflexión y un máximo—
      para que la concavidad que se lee en el dibujo sea la que de verdad tiene
      la curva.
      </figcaption>
      </figure>

      Tomemos un punto cualquiera $u\in(\alpha,\beta)$ y consideremos la
      longitud de arco $L(u)$ de la curva definida en el intervalo
      $[\alpha,u]$ de $g(x)$. Se pide:

      a) Estudiar el crecimiento/decrecimiento y los extremos locales de $L(u)$.

      b) Estudiar la concavidad/convexidad y los puntos de inflexión de $L(u)$.

      c) Trazar una posible gráfica de $L(u)$.
    pide: El crecimiento, la concavidad y un dibujo de L(u).

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuánto vale $L'(u)$?
        opciones:
          - texto: >-
              $L'(u)=\sqrt{1+\left(g'(u)\right)^{2}}$, por el teorema
              fundamental del cálculo
            correcta: true
            mensaje: |
              Eso es, y fíjate en lo que ya se puede decir sin más: esa raíz es
              siempre **mayor o igual que 1**, así que $L$ crece siempre y nunca
              se para.
          - texto: >-
              $L'(u)=\sqrt{1+\left(g''(u)\right)^{2}}$
            mensaje: |
              El integrando lleva $g'$, no $g''$. La segunda derivada aparecerá
              después, al derivar otra vez.
          - texto: >-
              $L'(u)=g'(u)$
            mensaje: |
              Eso sería si el integrando fuera $g'$. Está dentro de una raíz y
              sumado a $1$, y eso cambia todo: en particular, nunca es negativo.

      - tipo: calcular
        titulo: El menor valor posible de la derivada
        pregunta: |
          ¿Cuál es el valor más pequeño que puede tomar $L'(u)$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              No puede llegar a cero: dentro de la raíz hay un $1$ sumado a un
              cuadrado. Ese $1$ es la razón geométrica de que $L$ nunca deje de
              crecer — un trozo de curva mide al menos lo que mide su sombra en
              el eje.
          - valor: '-1'
            mensaje: |
              Una raíz cuadrada nunca es negativa.
        pista: |
          ¿Cuánto vale $\sqrt{1+t^{2}}$ cuando $t=0$, y puede ser menor?
        desarrollo: |
          $$
          L'(u)=\sqrt{1+\left(g'(u)\right)^{2}}\ \ge\ \sqrt{1}=1
          $$

          con igualdad solo donde $g'(u)=0$. Por eso $L$ es **estrictamente
          creciente** en todo $[\alpha,\beta]$ y no tiene extremos locales en el
          interior: el mínimo es $L(\alpha)=0$ y el máximo $L(\beta)$, los dos en
          los bordes.

      - tipo: calcular
        titulo: Cuántos puntos de inflexión
        pregunta: |
          Según la figura, ¿cuántos puntos de inflexión tiene $L(u)$ en
          $(\alpha,\beta)$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Has contado solo la inflexión de $g$. Pero $L''$ es el producto
              $g'g''$ dividido por algo positivo, así que también cambia de signo
              donde se anula $g'$: en el mínimo y en el máximo de $g$.
          - valor: '2'
            mensaje: |
              Te falta uno. Son los dos puntos donde $g'=0$ —el mínimo y el
              máximo— más el punto donde $g''=0$, la inflexión de $g$.
          - valor: '0'
            mensaje: |
              $L''=\frac{g'g''}{\sqrt{1+(g')^{2}}}$ no es de signo constante: en
              la figura $g'$ cambia de signo dos veces y $g''$ una.
        pista: |
          Deriva otra vez y mira dónde puede cambiar de signo el producto
          $g'\,g''$.
        desarrollo: |
          $$
          L''(u)=\frac{g'(u)\,g''(u)}{\sqrt{1+\left(g'(u)\right)^{2}}}
          $$

          El denominador es siempre positivo, así que el signo es el del producto
          $g'g''$. En la figura:

          - $g'$ se anula y cambia de signo en el **mínimo** y en el **máximo**;
          - $g''$ se anula y cambia de signo en la **inflexión** de $g$, que cae
            entre los dos.

          Tres puntos, y en los tres $L''$ cambia de signo: tres puntos de
          inflexión.

      - tipo: justificar
        titulo: El razonamiento
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              **a)** Por el teorema fundamental,
              $L'(u)=\sqrt{1+\left(g'(u)\right)^{2}}\ge 1>0$: $L$ es
              estrictamente creciente y no tiene extremos locales en
              $(\alpha,\beta)$.
          - texto: >-
              **b)** Derivando otra vez,
              $L''(u)=\dfrac{g'(u)g''(u)}{\sqrt{1+\left(g'(u)\right)^{2}}}$, cuyo
              signo es el del producto $g'g''$.
          - texto: >-
              Llamando $m_{1}$ al mínimo de $g$, $i$ a su inflexión y $m_{2}$ a
              su máximo: en $(\alpha,m_{1})$ es $g'<0$ y $g''>0$, luego $L$ es
              cóncava.
          - texto: >-
              En $(m_{1},i)$ los dos son positivos y $L$ es convexa; en
              $(i,m_{2})$, $g'>0$ y $g''<0$ y vuelve a ser cóncava; y en
              $(m_{2},\beta)$ los dos son negativos y es convexa otra vez.
          - texto: >-
              Hay por tanto **tres** puntos de inflexión de $L$, y caen en el
              mínimo, la inflexión y el máximo de $g$.
          - texto: >-
              **c)** La gráfica de $L$ arranca en $L(\alpha)=0$ y sube sin parar,
              con esas cuatro curvaturas alternadas.
          - texto: >-
              Donde $g$ tiene su mínimo, $L$ también lo tiene, porque ahí la
              curva deja de bajar.
            trampa: true
            mensaje: |
              $L$ mide **longitud recorrida**, y la longitud no baja nunca aunque
              la curva sí. En el mínimo de $g$ lo que pasa es que $L$ crece lo
              más despacio que puede —a ritmo $1$, porque la curva va
              horizontal—, pero sigue creciendo. Ahí $L$ tiene un punto de
              inflexión, no un extremo.

    resolucion: |
      **a) El crecimiento.** Por el teorema fundamental del cálculo,

      $$
      L'(u)=\sqrt{1+\left(g'(u)\right)^{2}}
      $$

      y esa raíz es **siempre mayor o igual que 1**, con igualdad solo donde la
      tangente es horizontal. Por tanto:

      - $L$ es estrictamente creciente en todo $[\alpha,\beta]$;
      - **no tiene extremos locales** en el interior;
      - su mínimo absoluto es $L(\alpha)=0$ y su máximo $L(\beta)$, los dos en
        los bordes del intervalo.

      El contenido geométrico del $1$ merece decirse: un trozo de curva mide al
      menos lo que mide su proyección sobre el eje $x$. Por eso la longitud
      recorrida no puede dejar de crecer, por mucho que la curva suba o baje.

      **b) La concavidad.** Derivando otra vez, con la regla de la cadena:

      $$
      L''(u)=\frac{g'(u)\,g''(u)}{\sqrt{1+\left(g'(u)\right)^{2}}}
      $$

      El denominador es positivo, así que **el signo de $L''$ es el del producto
      $g'g''$**. Llamando $m_{1}$ al mínimo de $g$, $i$ a su punto de inflexión
      y $m_{2}$ a su máximo, con $\alpha<m_{1}<i<m_{2}<\beta$:

      | tramo | $g'$ | $g''$ | $L''$ | $L$ |
      |---|---|---|---|---|
      | $(\alpha,m_{1})$ | $-$ | $+$ | $-$ | cóncava |
      | $(m_{1},i)$ | $+$ | $+$ | $+$ | convexa |
      | $(i,m_{2})$ | $+$ | $-$ | $-$ | cóncava |
      | $(m_{2},\beta)$ | $-$ | $-$ | $+$ | convexa |

      Hay **tres puntos de inflexión** de $L$, y están exactamente en el mínimo,
      la inflexión y el máximo de $g$. Es un resultado bonito y fácil de decir
      mal: los extremos de $g$ **no** son extremos de $L$, son inflexiones.

      **c) La gráfica.**

      <figure class="figura-examen">
      <svg viewBox="0 0 460 280" role="img" width="460" height="280"
           aria-labelledby="lu25-t lu25-d">
        <title id="lu25-t">Una grafica posible de la longitud de arco L de alfa a u</title>
        <desc id="lu25-d">Una curva que arranca en cero cuando u vale alfa y sube sin
        parar hasta beta, siempre creciente. Su curvatura cambia tres veces: es
        concava, luego convexa, luego concava y por ultimo convexa otra vez. Los tres
        puntos de inflexion estan marcados con circulitos, y caen en el minimo de g,
        en la inflexion de g y en el maximo de g.</desc>
        <style>
          .lu25-eje { stroke: var(--graphite); stroke-width: 1.2; fill: none; }
          .lu25-aux { stroke: var(--faint); stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
          .lu25-c { stroke: var(--live); stroke-width: 2.6; fill: none; }
          .lu25-pt { fill: var(--alt); }
          .lu25-n { fill: var(--faint); font-size: 12px; font-family: var(--mono); }
          .lu25-et { fill: var(--live); font-size: 14px; font-family: var(--mono); font-weight: 700; }
        </style>
