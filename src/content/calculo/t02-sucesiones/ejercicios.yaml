ejercicios:
  - id: creciente-con-limite-cero
    titulo: Una sucesión creciente que tiende a cero
    fuente: >-
      Ejercicio 2.1 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2011/2012 4E)

    enunciado: |
      Supongamos que $\{a_n\}_{n\in\mathbb{N}}$ es una sucesión **creciente**
      cuyo límite es 0.
    pide: >-
      Decidir cuál de las afirmaciones es cierta, y para la sucesión
      $a_n = \frac{n-3}{n+1}$ con $\varepsilon = 10^{-10}$, encontrar el menor
      $m$ tal que $|a_n - L| < \varepsilon$ para todo $n>m$.

    pasos:
      - tipo: reconocer
        pregunta: |
          De las cuatro afirmaciones del enunciado, ¿cuál es la única cierta?
        opciones:
          - texto: $\forall n \in \mathbb{N}$, $a_n < 0$
            correcta: true
            mensaje: |
              Correcto, y el argumento es corto: si algún término fuera
              $a_{n_0} \ge 0$, al ser creciente todos los siguientes serían
              **estrictamente mayores**, y el límite tendría que ser al menos
              $a_{n_0+1} > 0$. Como el límite es 0, eso es imposible.
          - texto: $\exists n \in \mathbb{N}$ con $a_n > 0$
            mensaje: |
              Si un término fuera positivo, a partir de ahí todos lo serían y
              serían mayores que él, así que el límite no podría ser 0: sería un
              número positivo. Una sucesión creciente **se acerca a su límite
              por debajo**.
          - texto: La sucesión puede tener términos positivos y negativos
            mensaje: |
              Podría tenerlos si fuera cualquier sucesión, pero esta es
              creciente: en cuanto un término fuera positivo, todos los
              posteriores también, y el límite sería positivo. Los dos datos
              juntos —creciente y límite cero— la obligan a ser toda negativa.
          - texto: $\exists n \in \mathbb{N}$ con $a_n = 0$
            mensaje: |
              Tampoco: si algún término valiera exactamente 0, el siguiente
              sería estrictamente mayor —creciente— y ya sería positivo, con lo
              que el límite se iría por encima de 0. El cero es el límite, y no
              se alcanza.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que demuestra la afirmación cierta. Una de las
          piezas no debe entrar.
        piezas:
          - texto: |
              Se razona por reducción al absurdo: supongamos que existe $n_0$
              con $a_{n_0} \ge 0$.
          - texto: |
              Al ser creciente, $a_n > a_{n_0} \ge 0$ para todo $n > n_0$: a
              partir de ahí todos los términos son estrictamente positivos.
          - texto: |
              El límite de una sucesión creciente es el supremo de sus términos,
              y en particular es mayor o igual que cualquiera de ellos: $L \ge
              a_{n_0+1} > 0$.
          - texto: |
              Pero el enunciado dice que $L = 0$, y $0 > 0$ es falso.
              Contradicción, luego $a_n < 0$ para todo $n$.
          - texto: |
              Como el límite es 0 y la sucesión crece, sus términos se acercan a
              0, así que a partir de un momento son positivos.
            trampa: true
            mensaje: |
              Acercarse a 0 **por debajo** es acercarse igual. Una sucesión
              creciente que tiende a 0 sube hacia el cero sin llegar nunca:
              $-1, -\frac12, -\frac13, \dots$ es el ejemplo. Confundir «se
              acerca a cero» con «se hace positiva» es el error que este
              ejercicio caza.
        veredicto: |
          La imagen que hay que tener: una sucesión creciente sube hacia su
          límite y se queda siempre por debajo. Si el límite es 0, vive entera
          en los negativos.

      - tipo: calcular
        titulo: El menor m del apartado (e)
        pregunta: |
          Para $a_n = \dfrac{n-3}{n+1}$ y $\varepsilon = 10^{-10}$, ¿cuál es el
          menor $m$ tal que $|a_n - L| < \varepsilon$ para todo $n > m$?
        respuesta:
          tipo: numero
          valor: '39999999999'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '40000000000'
            mensaje: |
              Casi. La condición es $n+1 > 4\cdot 10^{10}$, es decir
              $n > 4\cdot 10^{10} - 1$. El menor $m$ que sirve es justamente ese
              número, y tú has puesto uno más: te has dejado el $-1$ del
              denominador.
          - valor: '10000000000'
            mensaje: |
              Te has dejado el 4. La distancia al límite es
              $\left|\frac{n-3}{n+1} - 1\right| = \frac{4}{n+1}$, con un 4 en el
              numerador que viene de $-3-1$.
          - valor: '4'
            mensaje: |
              Ese 4 es el numerador de la distancia al límite, no el valor de
              $m$. Falta dividirlo entre $\varepsilon$.
        pista: |
          Primero el límite: $\frac{n-3}{n+1} \to 1$. Luego calcula
          $\left|\frac{n-3}{n+1}-1\right|$ y verás que se simplifica muchísimo.
        desarrollo: |
          El límite es $L = 1$, porque numerador y denominador tienen el mismo
          grado y coeficiente principal 1.

          $$
          \left|\frac{n-3}{n+1} - 1\right|
            = \left|\frac{n-3-(n+1)}{n+1}\right|
            = \frac{4}{n+1}
          $$

          Se impone que sea menor que $\varepsilon = 10^{-10}$:

          $$
          \frac{4}{n+1} < 10^{-10}
          \;\Longleftrightarrow\;
          n+1 > 4\cdot 10^{10}
          \;\Longleftrightarrow\;
          n > 4\cdot 10^{10} - 1
          $$

          El menor $m$ que hace que la condición valga para **todo** $n>m$ es

          $$
          m = 4\cdot 10^{10} - 1 = 39\,999\,999\,999
          $$
        veredicto: |
          Cuarenta mil millones de términos para acercarse a una diezmilésima de
          millonésima. Eso es lo que significa que $m$ dependa de $\varepsilon$:
          cuanto más aprietas, más tarde empieza a cumplirse.

    resolucion: |
      **Datos.** $\{a_n\}$ creciente con $\lim a_n = 0$.

      ### 1 · Qué obliga la combinación «creciente» + «límite 0»

      Las dos condiciones por separado no dicen gran cosa; juntas fijan el signo
      de todos los términos.

      **Afirmación: $a_n < 0$ para todo $n$.** Por reducción al absurdo,
      supongamos que existe $n_0$ con $a_{n_0} \ge 0$. Al ser creciente,

      $$
      a_n > a_{n_0} \ge 0 \qquad \forall n > n_0
      $$

      Además, el límite de una sucesión creciente es el supremo de sus términos,
      así que $L \ge a_{n_0+1} > 0$. Pero $L = 0$. Contradicción.

      Por tanto **(b) es la única cierta**, y con ella caen las otras tres: no
      hay ningún término positivo (a), no puede haber términos de los dos signos
      (c), y ninguno vale exactamente cero (d).

      El ejemplo que fija la idea: $a_n = -\frac1n$ es creciente, tiende a 0 y
      es siempre negativa.

      ### 2 · El apartado (e)

      Para $a_n = \dfrac{n-3}{n+1}$, el límite es $L=1$: numerador y denominador
      son de grado 1 con el mismo coeficiente principal.

      La distancia al límite se simplifica de golpe:

      $$
      |a_n - L| = \left|\frac{n-3}{n+1} - 1\right|
        = \left|\frac{(n-3)-(n+1)}{n+1}\right|
        = \frac{4}{n+1}
      $$

      Se impone la condición de la definición de límite:

      $$
      \frac{4}{n+1} < 10^{-10}
      \;\Longleftrightarrow\;
      n+1 > \frac{4}{10^{-10}} = 4\cdot 10^{10}
      \;\Longleftrightarrow\;
      n > 4\cdot 10^{10} - 1
      $$

      Como se pide el **menor** $m$ tal que la desigualdad valga para todo
      $n > m$:

      $$
      m = 4\cdot 10^{10} - 1 = 39\,999\,999\,999
      $$

      ### 3 · Comprobación

      Con $n = m+1 = 4\cdot10^{10}$:
      $\frac{4}{4\cdot10^{10}+1} < 10^{-10}$ ✔

      Con $n = m = 4\cdot10^{10}-1$:
      $\frac{4}{4\cdot10^{10}} = 10^{-10}$, que **no** es menor estricto que
      $\varepsilon$. Por eso $m$ no puede ser más pequeño.

      ### Resultado

      $$
      \boxed{\;\text{Solo es cierta } a_n<0 \;\forall n;
      \qquad m = 4\cdot 10^{10}-1 = 39\,999\,999\,999\;}
      $$

  - id: comparar-infinitesimos
    titulo: Comparar sucesiones que tienden a cero
    fuente: >-
      Ejercicio 2.12 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2013/2014 7E)

    enunciado: |
      Se consideran las sucesiones

      $$
      \text{(a) } \left\{\frac{1}{n}\right\} \quad
      \text{(b) } \left\{\frac{1}{n^{2}}\right\} \quad
      \text{(c) } \left\{\frac{(-1)^{n}}{n}\right\} \quad
      \text{(d) } \left\{\frac{1}{n+100}\right\}
      $$
    pide: >-
      Calcular sus límites y elegir, para cada caso, dos de ellas tales que
      (i) $\lim \frac{x_n}{y_n}=0$; (ii) $=1$; (iii) $=\infty$; (iv) no exista
      pero la sucesión esté acotada.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las cuatro tienden a 0. Entonces, ¿por qué sus cocientes dan cosas
          distintas?
        opciones:
          - texto: >-
              Porque tender a cero no dice a qué **velocidad**, y el cociente
              compara precisamente eso
            correcta: true
            mensaje: |
              Exacto. Todas son infinitésimos, pero unos van más deprisa que
              otros: $\frac{1}{n^{2}}$ se hace pequeño mucho antes que
              $\frac1n$. El cociente mide esa comparación, y por eso puede dar
              0, 1, infinito o nada.
          - texto: Porque alguna de ellas en realidad no tiende a cero
            mensaje: |
              Las cuatro tienden a 0, incluida $\frac{(-1)^{n}}{n}$: su valor
              absoluto es $\frac1n$, que tiende a 0, y eso basta.
          - texto: Porque el cociente de dos sucesiones convergentes es siempre indeterminado
            mensaje: |
              No siempre: si el denominador tiende a algo distinto de cero, el
              cociente tiende al cociente de los límites. La indeterminación
              aparece justo aquí, porque **los dos** tienden a cero: es el caso
              $\frac00$.
          - texto: Porque el límite de un cociente no existe si el denominador tiende a 0
            mensaje: |
              Puede existir perfectamente. $\frac{1/n^{2}}{1/n} = \frac1n$
              tiende a 0 aunque el denominador se anule en el límite. Lo que hay
              es una indeterminación que se resuelve simplificando.

      - tipo: calcular
        titulo: El cociente que da infinito
        pregunta: |
          Para el caso (iii), $\lim \frac{x_n}{y_n} = \infty$, se toman
          $x_n = \frac1n$ e $y_n = \frac{1}{n^{2}}$. ¿A qué es igual ese
          cociente, simplificado, para $n = 7$?
        respuesta:
          tipo: numero
          valor: '7'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0.142857'
            mensaje: |
              Has calculado el cociente al revés,
              $\frac{1/n^{2}}{1/n} = \frac1n$. Ese es el caso (i), el que tiende
              a 0.
          - valor: '49'
            mensaje: |
              Has multiplicado en vez de dividir:
              $\frac1n \cdot \frac{1}{n^{2}}$ no, el cociente es
              $\frac{1}{n}\cdot n^{2} = n$.
          - valor: '1'
            mensaje: |
              El cociente vale 1 solo si las dos van a la misma velocidad, que
              es el caso (ii) con $\frac1n$ y $\frac{1}{n+100}$. Aquí una es el
              cuadrado de la otra.
        pista: |
          Dividir entre una fracción es multiplicar por su inversa:
          $\frac{1/n}{1/n^{2}} = \frac{n^{2}}{n}$.
        desarrollo: |
          $$
          \frac{x_n}{y_n} = \frac{1/n}{1/n^{2}} = \frac{n^{2}}{n} = n
          $$

          Para $n=7$ vale 7, y cuando $n \to \infty$ el cociente tiende a
          infinito.
        veredicto: |
          $\frac{1}{n^{2}}$ tiende a cero **más deprisa** que $\frac1n$, y por
          eso al dividir la lenta entre la rápida el cociente se dispara.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento del caso (iv): un cociente cuyo límite no
          existe pero que está acotado. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Se toman $x_n = \frac{(-1)^{n}}{n}$ e $y_n = \frac{1}{n}$, las dos
              con límite 0.
          - texto: |
              Al dividir, los factores $\frac1n$ se cancelan y queda
              $\frac{x_n}{y_n} = (-1)^{n}$.
          - texto: |
              La sucesión $(-1)^{n}$ va saltando entre $-1$ y $1$ sin
              estabilizarse: no tiene límite.
          - texto: |
              Pero está acotada: todos sus términos están entre $-1$ y $1$.
          - texto: |
              Como el límite no existe, la sucesión no puede estar acotada.
            trampa: true
            mensaje: |
              Justo al revés de lo que dice el teorema. Toda sucesión
              **convergente** está acotada, pero el recíproco es falso: hay
              acotadas que no convergen, y $(-1)^{n}$ es el ejemplo de manual.
              Que el enunciado pida exactamente ese caso es la pista de que se
              está evaluando esta distinción.
        veredicto: |
          Convergente $\Rightarrow$ acotada. Acotada $\not\Rightarrow$
          convergente. La flecha va en un solo sentido, y este apartado existe
          para comprobar que lo sabes.

    resolucion: |
      **Datos.** Cuatro sucesiones: $\frac1n$, $\frac{1}{n^{2}}$,
      $\frac{(-1)^{n}}{n}$ y $\frac{1}{n+100}$.

      ### 1 · Los límites

      Las cuatro tienden a **0**. Para la tercera conviene decir por qué:
      $\left|\frac{(-1)^{n}}{n}\right| = \frac1n \to 0$, y una sucesión cuyo
      valor absoluto tiende a cero tiende a cero.

      ### 2 · Por qué los cocientes dan cosas distintas

      Todas son infinitésimos, pero **no todos van a la misma velocidad**. El
      cociente de dos de ellas es una indeterminación $\frac{0}{0}$ que se
      resuelve simplificando, y el resultado mide cuál se hace pequeña antes.

      ### 3 · Los cuatro casos

      **(i) Límite 0.** Se pone arriba la que tiende a cero **más deprisa**:

      $$
      \frac{1/n^{2}}{1/n} = \frac{1}{n} \longrightarrow 0
      $$

      **(ii) Límite 1.** Dos que van a la misma velocidad:

      $$
      \frac{1/n}{1/(n+100)} = \frac{n+100}{n} = 1 + \frac{100}{n} \longrightarrow 1
      $$

      El $+100$ es irrelevante en el infinito: por eso el límite es exactamente 1.

      **(iii) Límite infinito.** El caso (i) al revés:

      $$
      \frac{1/n}{1/n^{2}} = n \longrightarrow \infty
      $$

      **(iv) Sin límite, pero acotada.**

      $$
      \frac{(-1)^{n}/n}{1/n} = (-1)^{n}
      $$

      Los factores $\frac1n$ se cancelan y queda una sucesión que alterna entre
      $-1$ y $1$. No tiene límite —no se estabiliza en ningún valor— pero está
      acotada entre $-1$ y $1$.

      ### 4 · La moraleja del apartado (iv)

      Es la que el ejercicio quiere dejar clara: **toda sucesión convergente
      está acotada, pero no toda acotada converge.** La implicación va en un
      solo sentido, y $(-1)^{n}$ es el contraejemplo estándar.

      ### Resultado

      $$
      \boxed{\;L=0 \text{ en las cuatro};\quad
      \text{(i) } \tfrac{1/n^{2}}{1/n};\;
      \text{(ii) } \tfrac{1/n}{1/(n+100)};\;
      \text{(iii) } \tfrac{1/n}{1/n^{2}};\;
      \text{(iv) } \tfrac{(-1)^{n}/n}{1/n}\;}
      $$

  - id: serie-sucesion-tres-tramos
    titulo: Una serie que no puede converger
    fuente: >-
      Ejercicio 2.15 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2019/2020 1E)

    enunciado: |
      Sea la sucesión

      $$
      \{a_n\}_{n\in\mathbb{N}} =
      \begin{cases}
      n^{3} & n < 1000 \\[2pt]
      1 & 1000 \le n < 2000 \\[2pt]
      1-\dfrac{1}{n} & n \ge 2000
      \end{cases}
      $$
    pide: ¿Es convergente la serie $\sum_{n=1}^{\infty} a_n$?

    pasos:
      - tipo: reconocer
        pregunta: |
          La sucesión tiene tres tramos y el primero crece como $n^{3}$. ¿Por
          dónde se ataca la pregunta sobre la serie?
        opciones:
          - texto: >-
              Por la condición necesaria: si la serie converge, el término
              general tiene que tender a 0
            correcta: true
            mensaje: |
              Eso es. Es la comprobación más barata que existe y aquí resuelve
              el ejercicio en una línea: el término general tiende a 1, no a 0,
              así que la serie no converge.
          - texto: Sumando los mil primeros términos para ver cuánto dan
            mensaje: |
              Esa suma es un número finito, por grande que sea, y **no decide
              nada**: la convergencia de una serie depende de la cola, no de
              cuántos términos gordos haya al principio.
          - texto: Comparando con la serie armónica
            mensaje: |
              La comparación exige que el término general tienda a 0, y aquí no
              lo hace. Antes de buscar un criterio fino conviene mirar el
              barato, que ya cierra el problema.
          - texto: Como el tercer tramo tiende a 1 y $1 < \infty$, la serie converge
            mensaje: |
              Confundes la convergencia de la **sucesión** con la de la
              **serie**. Que los sumandos tiendan a 1 significa que estás sumando
              infinitas veces algo parecido a 1: la suma se va a infinito.

      - tipo: calcular
        titulo: El límite del término general
        pregunta: ¿A qué tiende $a_n$ cuando $n \to \infty$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              El tercer tramo es $1-\frac1n$, no $\frac1n$. Lo que tiende a cero
              es el término que se resta, y lo que queda es el 1.
          - valor: '2000'
            mensaje: |
              El 2000 es donde empieza el último tramo, no el valor al que
              tiende. A partir de ahí la sucesión vale $1-\frac{1}{n}$.
        pista: |
          Solo importa el último tramo, el que vale para $n$ grande:
          $1-\frac{1}{n}$.
        desarrollo: |
          El límite solo depende de la **cola** de la sucesión, es decir del
          tramo que vale a partir de $n \ge 2000$:

          $$
          \lim_{n\to\infty} a_n = \lim_{n\to\infty}\left(1-\frac{1}{n}\right) = 1
          $$

          Los tramos $n^{3}$ y $1$ afectan a un número **finito** de términos y
          no influyen en el límite.
        veredicto: |
          Que el primer tramo llegue a $999^{3} \approx 10^{9}$ es irrelevante
          para el límite: son mil términos, y mil es finito.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que responde a la pregunta. Una de las piezas
          no debe entrar.
        piezas:
          - texto: |
              Condición necesaria de convergencia: si $\sum a_n$ converge,
              entonces $a_n \to 0$.
          - texto: |
              En contrapositivo: si $a_n \not\to 0$, la serie **no** converge.
          - texto: |
              Aquí $a_n \to 1 \neq 0$, porque la cola de la sucesión es
              $1-\frac{1}{n}$.
          - texto: |
              Luego la serie $\sum a_n$ **no** es convergente.
          - texto: |
              Como $a_n \to 1$ y 1 es finito, la suma de infinitos términos
              también será finita.
            trampa: true
            mensaje: |
              Sumar infinitas veces algo que se parece a 1 da infinito, no un
              número finito. Que cada sumando sea pequeño —o finito— no basta:
              lo que hace falta es que se hagan pequeños **lo bastante deprisa**,
              y aquí ni siquiera se hacen pequeños.
        veredicto: |
          Cuidado con el recíproco: que $a_n \to 0$ **no** garantiza que la serie
          converja. La armónica $\sum\frac1n$ es el contraejemplo. La condición
          sirve para descartar, nunca para confirmar.

    resolucion: |
      **Datos.** Una sucesión definida en tres tramos, y la pregunta de si
      $\sum a_n$ converge.

      ### 1 · La herramienta: condición necesaria

      Si una serie $\sum a_n$ converge, entonces su término general tiende a
      cero. La demostración es corta: si $S_n$ son las sumas parciales y
      $S_n \to S$, entonces

      $$
      a_n = S_n - S_{n-1} \longrightarrow S - S = 0
      $$

      Usada en contrapositivo —**si $a_n \not\to 0$, la serie diverge**— es la
      comprobación más rentable del tema: cuesta una línea y cierra muchos
      ejercicios.

      ### 2 · El límite del término general

      Solo cuenta la cola. Los tramos $n^{3}$ (para $n<1000$) y $1$ (hasta
      $n<2000$) afectan a un número finito de términos y no influyen:

      $$
      \lim_{n\to\infty} a_n = \lim_{n\to\infty}\left(1-\frac1n\right) = 1
      $$

      ### 3 · Conclusión

      Como $a_n \to 1 \neq 0$, **la serie no converge**. De hecho diverge a
      $+\infty$: a partir de $n = 2000$ se están sumando infinitos términos cada
      uno mayor que $\frac12$.

      ### 4 · Una advertencia sobre el recíproco

      Conviene dejarlo escrito porque es el error gemelo: que el término general
      tienda a cero **no** garantiza la convergencia. La serie armónica
      $\sum\frac1n$ tiene término general tendiendo a 0 y suma infinita.

      La condición sirve para **descartar**, nunca para confirmar.

      ### Resultado

      $$
      \boxed{\;\text{No: la serie } \sum a_n \text{ no es convergente,
      porque } a_n \to 1 \neq 0\;}
      $$

  - id: sucesion-tres-tramos
    titulo: Una sucesión con un pico en medio
    fuente: >-
      Ejercicio 2.7 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2014/2015 4E)

    enunciado: |
      $$
      a_n =
      \begin{cases}
      -\dfrac{1}{n^{2}} & n < 100 \\[6pt]
      n & 100 \le n \le 200 \\[6pt]
      1-\dfrac{1}{n} & n > 200
      \end{cases}
      $$
    pide: Estudiar si es creciente, decreciente, acotada y convergente.

    pasos:
      - tipo: reconocer
        pregunta: |
          El tramo de en medio llega hasta 200 y el último baja a valores
          cercanos a 1. ¿Qué tramo decide la convergencia?
        opciones:
          - texto: Solo el último, porque la convergencia mira únicamente la cola
            correcta: true
            mensaje: |
              Eso es. Los dos primeros tramos afectan a 200 términos, y 200 es
              un número finito: da igual lo que hagan. El límite lo fija
              $1-\frac1n$.
          - texto: El de en medio, porque es donde la sucesión toma los valores más grandes
            mensaje: |
              El tamaño de los términos importa para la **acotación**, no para
              el límite. Que la sucesión llegue a valer 200 no impide que
              después se estabilice en 1.
          - texto: Los tres, ponderando su longitud
            mensaje: |
              El límite no se promedia. Es lo que ocurre «al final», y al final
              solo está el tercer tramo, que además es infinito mientras que los
              otros dos son finitos.
          - texto: "Ninguno: al estar definida a trozos, la sucesión no converge"
            mensaje: |
              Estar definida a trozos no impide converger. Lo que puede romper
              un trozo es la **monotonía**, que sí mira la sucesión entera; la
              convergencia solo mira el final.

      - tipo: calcular
        titulo: El límite
        pregunta: ¿A qué converge la sucesión?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '200'
            mensaje: |
              200 es el valor máximo que alcanza la sucesión, en $n=200$. Es su
              supremo, no su límite: después de ese término la sucesión cae y se
              queda cerca de 1 para siempre.
          - valor: '0'
            mensaje: |
              El primer tramo, $-\frac{1}{n^{2}}$, sí tiende a 0, pero solo vale
              para $n<100$: son 99 términos y luego desaparece. El límite lo
              marca el tramo que vale para todo $n$ grande.
        pista: |
          Quédate solo con el tramo válido para $n$ grande: $1-\frac1n$.
        desarrollo: |
          Para $n > 200$ la sucesión vale $1-\frac1n$, y

          $$
          \lim_{n\to\infty}\left(1-\frac{1}{n}\right) = 1
          $$

          Los tramos anteriores afectan a 200 términos, un número finito, y no
          influyen en el límite.
        veredicto: |
          La sucesión llega a valer 200 y aun así converge a 1. Eso es lo que
          significa que el límite solo mire la cola.

      - tipo: calcular
        titulo: La cota superior
        pregunta: ¿Cuál es el valor más grande que alcanza la sucesión?
        respuesta:
          tipo: numero
          valor: '200'
          tolerancia: 0.5
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es el límite, no el máximo. La sucesión pasa por valores mucho
              mayores antes de estabilizarse: en $n=200$ vale exactamente 200.
          - valor: '100'
            mensaje: |
              En $n=100$ empieza el tramo creciente, pero sigue subiendo hasta
              $n=200$. El máximo está al final de ese tramo, no al principio.
          - valor: '0'
            mensaje: |
              Ese sería el máximo si la sucesión fuera solo el primer tramo,
              donde todos los valores son negativos. El segundo tramo la manda
              muy por encima.
        pista: |
          El segundo tramo es $a_n = n$ con $100 \le n \le 200$: crece hasta el
          final del intervalo.
        desarrollo: |
          - **Primer tramo** ($n<100$): $-\frac{1}{n^{2}}$ toma valores entre
            $-1$ (en $n=1$) y casi 0. Todos negativos.
          - **Segundo tramo** ($100 \le n \le 200$): $a_n = n$, que va de 100 a
            **200**.
          - **Tercer tramo** ($n>200$): $1-\frac1n$, siempre menor que 1.

          El máximo es $a_{200} = 200$ y el mínimo, $a_1 = -1$. Por tanto

          $$
          -1 \le a_n \le 200 \qquad \forall n
          $$

          y la sucesión está **acotada**.
        veredicto: |
          Que exista una cota, por grande que sea, es lo único que pide la
          definición de acotada. No hace falta que sea ajustada.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento sobre el crecimiento. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              Ser creciente exige $a_{n+1} > a_n$ para **todo** $n$, sin
              excepciones.
          - texto: |
              Entre $n=1$ y $n=2$ la sucesión sube: $-1 < -\frac14$. Así que no
              es decreciente.
          - texto: |
              Entre $n=200$ y $n=201$ baja de golpe: de $200$ a
              $1-\frac{1}{201} \approx 0{,}995$. Así que tampoco es creciente.
          - texto: |
              Al fallar las dos condiciones, la sucesión **no es creciente ni
              decreciente**.
          - texto: |
              Como no es creciente, es decreciente.
            trampa: true
            mensaje: |
              «No creciente» y «decreciente» no son lo mismo. Una sucesión puede
              subir en un sitio y bajar en otro, y entonces no es ninguna de las
              dos. Aquí pasa exactamente eso: sube en los dos primeros tramos y
              da un salto hacia abajo en $n=201$.
        veredicto: |
          Para justificar que no es monótona basta **una** pareja de términos
          consecutivos de cada tipo. No hace falta estudiar los tres tramos
          enteros.

    resolucion: |
      **Datos.** Una sucesión definida en tres tramos. Se pide estudiar
      crecimiento, acotación y convergencia.

      ### 1 · Crecimiento

      Ser creciente exige $a_{n+1} > a_n$ para **todo** $n$; decreciente, lo
      contrario. Basta un contraejemplo de cada tipo para descartar las dos.

      - **Sube** en $n=1 \to 2$: de $-1$ a $-\frac14$.
      - **Baja** en $n=200 \to 201$: de $200$ a $1-\frac{1}{201} \approx 0{,}995$.

      Luego **no es creciente ni decreciente**. Conviene decirlo así, con las
      dos palabras: «no creciente» por sí solo no descarta que sea decreciente.

      ### 2 · Acotación

      Tramo a tramo:

      | tramo | valores |
      |---|---|
      | $n<100$ | $-\frac{1}{n^{2}}$, entre $-1$ y casi 0 |
      | $100\le n\le 200$ | de 100 a 200 |
      | $n>200$ | $1-\frac1n$, entre $0{,}995$ y 1 |

      El mínimo es $a_1 = -1$ y el máximo $a_{200} = 200$:

      $$
      -1 \le a_n \le 200 \qquad \forall n \in \mathbb{N}
      $$

      La sucesión está **acotada**.

      ### 3 · Convergencia

      La convergencia depende solo de la **cola**. Los dos primeros tramos
      cubren 200 términos —un número finito— y son irrelevantes. Para $n>200$:

      $$
      \lim_{n\to\infty} a_n = \lim_{n\to\infty}\left(1-\frac{1}{n}\right) = 1
      $$

      La sucesión es **convergente con límite 1**.

      ### 4 · Una observación que merece la pena escribir

      Este ejercicio es un contraejemplo vivo de dos confusiones habituales:

      - Una sucesión puede converger **sin ser monótona**. El teorema dice que
        monótona y acotada implica convergente, no al revés.
      - Una sucesión puede alcanzar valores enormes —200— y converger a un
        número pequeño. El tamaño de los términos no dice nada del límite.

      ### Resultado

      $$
      \boxed{\;\text{Ni creciente ni decreciente. Acotada: }
      -1 \le a_n \le 200. \text{ Convergente con } L=1\;}
      $$

  - id: alternante-frente-a-salto
    titulo: Alternar infinitas veces o cambiar una sola vez
    fuente: >-
      Ejercicio 2.8 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2016/2017 3E)

    enunciado: |
      $$
      a_n = \begin{cases} 2+\dfrac{1}{n} & n \text{ impar} \\[6pt]
      -2-\dfrac{1}{n} & n \text{ par} \end{cases}
      \qquad
      b_n = \begin{cases} 2+\dfrac{1}{n} & n < 50 \\[6pt]
      -2-\dfrac{1}{n} & n \ge 50 \end{cases}
      $$
    pide: >-
      Definir el concepto de convergencia y estudiar, de forma argumentada, la
      convergencia de las dos sucesiones.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos sucesiones usan las mismas dos fórmulas. ¿Qué las diferencia?
        opciones:
          - texto: >-
              Que $a_n$ cambia de fórmula **infinitas** veces y $b_n$ solo una
            correcta: true
            mensaje: |
              Ese es todo el ejercicio. $a_n$ salta de una rama a otra en cada
              término, para siempre; $b_n$ salta una única vez, en $n=50$, y a
              partir de ahí se queda en una sola rama. Lo primero impide
              converger; lo segundo no.
          - texto: Que $b_n$ tiene términos negativos y $a_n$ no
            mensaje: |
              Las dos tienen términos de los dos signos: $a_n$ es negativa en
              los pares y positiva en los impares. La diferencia no está en los
              valores, está en el patrón.
          - texto: Que $a_n$ está acotada y $b_n$ no
            mensaje: |
              Las dos están acotadas, entre $-3$ y $3$ aproximadamente. Y eso
              confirma que la acotación no basta para converger.
          - texto: Que $b_n$ tiene un número finito de términos
            mensaje: |
              Las dos son infinitas. Lo que es finito en $b_n$ es el número de
              términos **de la primera rama**: 49. A partir de ahí queda
              infinita cola de la segunda.

      - tipo: calcular
        titulo: El límite de la segunda
        pregunta: ¿A qué converge $b_n$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Ese es el valor al que se acercaría la **primera** rama, la que
              solo vale para $n<50$: 49 términos, un número finito. La cola es
              la otra.
          - valor: '0'
            mensaje: |
              La sucesión no se acerca a 0 en ningún momento: sus valores están
              cerca de $2$ al principio y cerca de $-2$ después. No hay ningún
              tramo donde ronde el cero.
          - valor: '50'
            mensaje: |
              El 50 es dónde cambia de rama, no a qué valor tiende.
        pista: |
          Para $n \ge 50$ la sucesión vale $-2-\frac1n$ y ya no vuelve a cambiar.
        desarrollo: |
          A partir de $n = 50$ la sucesión es siempre $-2-\frac{1}{n}$, y

          $$
          \lim_{n\to\infty}\left(-2-\frac{1}{n}\right) = -2
          $$

          Los 49 primeros términos no influyen: son un número finito.
        veredicto: |
          $b_n$ converge a $-2$ **aunque empiece valiendo casi 3**. Otra vez: la
          cola manda.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento de por qué $a_n$ no converge. Una de las piezas
          no debe entrar.
        piezas:
          - texto: |
              Convergir a $L$ significa que, fijado cualquier $\varepsilon>0$,
              **todos** los términos a partir de un momento distan de $L$ menos
              que $\varepsilon$.
          - texto: |
              Los términos impares de $a_n$ están siempre por encima de 2, y los
              pares siempre por debajo de $-2$.
          - texto: |
              Sea cual sea el candidato $L$, tomando
              $\varepsilon = 1$ es imposible que los términos impares y los
              pares estén a la vez a distancia menor que 1 de $L$: están
              separados más de 4.
          - texto: |
              Por muy grande que se tome $m$, siempre quedan términos de los dos
              tipos después: nunca se cumple la condición. Luego $a_n$ no
              converge.
          - texto: |
              Como $a_n$ está acotada entre $-3$ y $3$, converge.
            trampa: true
            mensaje: |
              Estar acotada no basta. El teorema pide **monótona y acotada**, y
              $a_n$ no es monótona ni de lejos: sube y baja en cada término.
              Este ejercicio y el apartado (iv) del 2.12 insisten en lo mismo,
              porque es la confusión más repetida del tema.
        veredicto: |
          La diferencia entre las dos sucesiones no es de valores, es de
          **estructura**: una alterna para siempre y la otra se decide de una
          vez.

    resolucion: |
      **Datos.** Dos sucesiones construidas con las mismas dos expresiones,
      repartidas de forma distinta.

      ### 1 · La definición, que el enunciado pide explícitamente

      $$
      \lim_{n\to\infty} a_n = L
      \iff
      \forall \varepsilon>0 \;\exists\, m\in\mathbb{N}:\;
      n>m \Rightarrow |a_n - L| < \varepsilon
      $$

      Lo importante para este ejercicio son dos palabras: **todos** los términos
      a partir de $m$, y **para cualquier** $\varepsilon$.

      ### 2 · La sucesión $a_n$ no converge

      Sus términos impares valen $2+\frac1n > 2$ y los pares $-2-\frac1n < -2$:
      dos grupos infinitos separados por una distancia mayor que 4.

      Sea cual sea el candidato $L$, se toma $\varepsilon = 1$. Para que la
      definición se cumpliera, a partir de cierto $m$ todos los términos
      deberían estar en el intervalo $(L-1, L+1)$, que mide 2. Pero después de
      cualquier $m$ siguen apareciendo términos por encima de 2 **y** por debajo
      de $-2$, y no caben los dos en un intervalo de longitud 2.

      Luego **$a_n$ no es convergente**.

      Nótese que sí está acotada: $-3 \le a_n \le 3$. Acotada y no convergente:
      el recíproco del teorema es falso.

      ### 3 · La sucesión $b_n$ sí converge

      Aquí el cambio de rama ocurre **una sola vez**. Para todo $n \ge 50$,

      $$
      b_n = -2-\frac{1}{n}
      $$

      y por tanto

      $$
      \lim_{n\to\infty} b_n = -2
      $$

      Los 49 primeros términos —los que valen casi 3— son un número finito y no
      afectan al límite.

      ### 4 · La comparación, que es la lección

      Las dos sucesiones toman valores casi idénticos; lo que cambia es **cuándo**
      los toman. Una alterna infinitas veces y no puede estabilizarse; la otra
      cambia una vez y a partir de ahí ya solo hace una cosa.

      Convergir no es «tomar valores pequeños» ni «estar acotada»: es
      **estabilizarse**.

      ### Resultado

      $$
      \boxed{\;\{a_n\} \text{ no converge}; \qquad
      \{b_n\} \text{ converge con } L = -2\;}
      $$

  - id: cubo-y-luego-cinco
    titulo: De crecer como un cubo a estabilizarse en cinco
    fuente: >-
      Ejercicio 2.9 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2018/2019 5E)

    enunciado: |
      $$
      \{a_n\}_{n\in\mathbb{N}} =
      \begin{cases}
      5-\dfrac{2}{n} & n \ge 100 \\[6pt]
      n^{3} & n < 100
      \end{cases}
      $$
    pide: >-
      Definir formalmente sucesión creciente y sucesión convergente, y estudiar
      el crecimiento y la convergencia de $\{a_n\}$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que mirar para decidir si es creciente?
        opciones:
          - texto: >-
              Los dos tramos por dentro **y** el salto entre ellos
            correcta: true
            mensaje: |
              Eso es. Dentro de cada tramo puede crecer perfectamente y aun así
              fallar en el punto de empalme, que es justo lo que pasa aquí: se
              pasa de $99^{3}$ a menos de 5.
          - texto: Solo el tramo que vale para $n$ grande
            mensaje: |
              Eso vale para la **convergencia**, no para el crecimiento. Ser
              creciente exige $a_{n+1}>a_n$ para todo $n$, incluidos los
              primeros y el punto donde cambia la fórmula.
          - texto: Solo los primeros términos
            mensaje: |
              Los primeros términos pueden crecer y la sucesión no ser
              creciente. La definición pide **todos** los pares consecutivos.
          - texto: "Basta calcular el límite: si converge, es monótona"
            mensaje: |
              Converger no implica ser monótona. $\frac{(-1)^{n}}{n}$ converge a
              0 dando saltos de signo, y esta sucesión converge dando un salto
              gigantesco hacia abajo.

      - tipo: calcular
        titulo: El tamaño del salto
        pregunta: |
          ¿Cuánto vale $a_{99}$, el último término del primer tramo?
        respuesta:
          tipo: numero
          valor: '970299'
          tolerancia: 1
          formato: un número
        distractores:
          - valor: '4.98'
            mensaje: |
              Ese es $a_{100} = 5-\frac{2}{100}$, el **primer** término del otro
              tramo. El 99 todavía pertenece al tramo $n^{3}$.
          - valor: '297'
            mensaje: |
              Has multiplicado por 3 en vez de elevar al cubo: $99 \cdot 3$. El
              tramo es $n^{3}$.
          - valor: '9801'
            mensaje: |
              Ese es $99^{2}$. Falta multiplicar una vez más por 99.
        pista: |
          Para $n<100$ la sucesión vale $n^{3}$, así que $a_{99} = 99^{3}$.
        desarrollo: |
          $$
          a_{99} = 99^{3} = 970\,299
          $$

          y el término siguiente pertenece ya al otro tramo:

          $$
          a_{100} = 5 - \frac{2}{100} = 4{,}98
          $$

          El salto es de casi un millón hacia abajo.
        veredicto: |
          Ese salto es el que rompe el crecimiento. Todo lo demás de la sucesión
          sube.

      - tipo: justificar
        pregunta: |
          Ordena el estudio completo. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Definiciones.** Creciente: $a_{n+1} > a_n$ para todo
              $n \in \mathbb{N}$. Convergente a $L$: para todo $\varepsilon>0$
              existe $m$ tal que $|a_n - L| < \varepsilon$ si $n>m$.
          - texto: |
              Dentro de cada tramo la sucesión crece: $n^{3}$ es creciente, y
              $5-\frac2n$ también, porque lo que se resta se hace más pequeño.
          - texto: |
              Pero en el empalme baja: $a_{99} = 970\,299$ y
              $a_{100} = 4{,}98$. Como falla un solo par consecutivo, **no es
              creciente**.
          - texto: |
              La convergencia solo mira la cola: para $n \ge 100$ la sucesión es
              $5-\frac2n$, que tiende a **5**.
          - texto: |
              Como no es creciente y no está acotada superiormente por el primer
              tramo, no puede converger.
            trampa: true
            mensaje: |
              Dos errores en una frase. El primero: no ser creciente no impide
              converger —el teorema de la monotonía es una condición
              **suficiente**, no necesaria—. El segundo: el primer tramo tiene
              99 términos, así que la sucesión sí está acotada, por
              $970\,299$. Y aunque no lo estuviera en esos 99, la convergencia
              seguiría dependiendo solo de la cola.
        veredicto: |
          No creciente y convergente a la vez. Los dos conceptos miran cosas
          distintas: uno la sucesión entera, el otro solo el final.

    resolucion: |
      **Datos.** Una sucesión que crece como $n^{3}$ hasta $n=99$ y a partir de
      $n=100$ vale $5-\frac{2}{n}$.

      ### 1 · Las definiciones que pide el apartado (a)

      **Creciente:**

      $$
      \{a_n\} \text{ es creciente} \iff a_{n+1} > a_n \quad \forall n \in \mathbb{N}
      $$

      **Convergente:**

      $$
      \lim_{n\to\infty} a_n = L \iff
      \forall\varepsilon>0\;\exists\, m\in\mathbb{N}:\; n>m \Rightarrow |a_n-L|<\varepsilon
      $$

      Merece la pena subrayar el contraste, porque es de lo que va el apartado
      (b): la primera exige algo de **todos** los términos; la segunda, solo de
      los que hay a partir de cierto punto.

      ### 2 · Crecimiento

      Dentro de cada tramo la sucesión crece:

      - $n^{3}$ es creciente para $n \ge 1$;
      - $5-\frac{2}{n}$ también, porque al aumentar $n$ se resta cada vez menos.

      Pero en el empalme se desploma:

      $$
      a_{99} = 99^{3} = 970\,299, \qquad a_{100} = 5-\frac{2}{100} = 4{,}98
      $$

      Un solo par consecutivo que incumple $a_{n+1}>a_n$ basta para que **no sea
      creciente**. Tampoco es decreciente, porque sube en todo lo demás.

      ### 3 · Convergencia

      Solo cuenta la cola. Para $n\ge 100$:

      $$
      \lim_{n\to\infty}\left(5-\frac{2}{n}\right) = 5
      $$

      La sucesión es **convergente con límite 5**.

      ### 4 · Por qué las dos cosas son compatibles

      El teorema «monótona y acotada $\Rightarrow$ convergente» es una condición
      **suficiente**, no necesaria. Hay sucesiones convergentes que no son
      monótonas, y esta es una: converge a 5 después de dar un salto de casi un
      millón hacia abajo.

      ### 5 · Comprobación

      Con $\varepsilon = 0{,}01$: hace falta
      $\left|5-\frac2n-5\right| = \frac2n < 0{,}01$, es decir $n > 200$. En
      efecto, a partir de $n=201$ todos los términos están a menos de una
      centésima de 5.

      ### Resultado

      $$
      \boxed{\;\text{No creciente (ni decreciente). Convergente con } L = 5\;}
      $$
