  - id: ej-suma-geometrica
    titulo: Sumar una serie geométrica
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Calcular la suma de la serie
      $$
      \sum_{n=0}^{\infty}\left(\frac{1}{2}\right)^{n}
      = 1+\frac12+\frac14+\frac18+\cdots
      $$
    pide: La suma, y por qué la serie converge.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué esta serie converge?
        opciones:
          - texto: Porque es geométrica de razón $\frac12$, y $\left|r\right|<1$
            correcta: true
            mensaje: |
              Eso es. Cada término es el anterior por una razón fija, y mientras
              esa razón sea menor que 1 en valor absoluto, la suma es finita.
          - texto: Porque los términos tienden a cero
            mensaje: |
              Eso es **necesario pero no suficiente**, y es el error más
              repetido del bloque. Los términos de $\sum\frac1n$ también tienden
              a cero y esa serie no converge.
          - texto: Porque tiene infinitos términos
            mensaje: |
              Tener infinitos términos es lo que hace que la pregunta sea
              interesante, no lo que la contesta. Hay series de infinitos
              términos que suman un número y otras que no.
      - tipo: calcular
        titulo: La razón
        pregunta: |
          ¿Cuánto vale la razón $r$, es decir, por cuánto se multiplica cada
          término para obtener el siguiente?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.001
          formato: en forma exacta, o con dos decimales
        distractores:
          - valor: '2'
            mensaje: |
              2 es lo que crece el **denominador**, pero el término se hace más
              pequeño: se multiplica por $\frac12$, no por 2. Si la razón fuera
              2 la serie se dispararía.
          - valor: '1'
            mensaje: |
              Con razón 1 todos los términos serían iguales y la suma no podría
              ser finita. Aquí cada uno es la mitad del anterior.
        pista: |
          Divide un término entre el anterior: $\frac{1/4}{1/2}$.
        desarrollo: |
          $$
          r = \frac{a_{n+1}}{a_n} = \frac{1/4}{1/2} = \frac12
          $$

          Y como $\left|r\right| = \frac12 < 1$, la serie converge.
      - tipo: calcular
        titulo: La suma
        pregunta: |
          Con $\displaystyle\sum_{n=0}^{\infty} r^{n} = \frac{1}{1-r}$,
          ¿cuánto suma la serie?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              Has dado la razón, no la suma. Sustituye $r=\frac12$ en
              $\frac{1}{1-r}$.
          - valor: '1.5'
            mensaje: |
              Parece que has sumado solo los dos primeros términos,
              $1+\frac12$. La serie sigue, y lo que queda por sumar completa
              exactamente hasta 2.
          - valor: '1'
            mensaje: |
              1 es el primer término. La fórmula da la suma de todos:
              $\frac{1}{1-1/2}$.
        pista: |
          $\frac{1}{1-\frac12}$. Cuidado con el denominador.
        desarrollo: |
          $$
          \sum_{n=0}^{\infty}\left(\frac12\right)^{n}
          = \frac{1}{1-\frac12}
          = \frac{1}{\frac12}
          = 2
          $$

          Tiene sentido geométrico: si avanzas 1, luego medio, luego un cuarto…
          nunca pasas de 2, y te acercas tanto como quieras.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza sobra.
        piezas:
          - texto: La serie es geométrica, con $r = \frac12$.
          - texto: Como $\left|r\right| < 1$, converge.
          - texto: Su suma vale $\frac{1}{1-r} = \frac{1}{1/2} = 2$.
          - texto: Empieza en $n=0$, así que la fórmula se aplica tal cual.
          - texto: Al tender los términos a cero, la serie converge.
            trampa: true
            mensaje: |
              Ese razonamiento no vale, aunque la conclusión aquí sea cierta.
              La condición del término general sirve para **descartar**, nunca
              para confirmar: la armónica lo cumple y diverge.
    resolucion: |
      **Reconocerla.** Cada término es el anterior multiplicado por $\frac12$,
      así que es una serie geométrica de razón $r = \frac12$.

      **Que converge** se sigue de $\left|r\right| < 1$. Ojo con el argumento:
      no es que los términos tiendan a cero —eso lo cumple también la armónica,
      que diverge—, es que la razón es menor que 1.

      **La suma.** Empezando en $n=0$,

      $$
      \sum_{n=0}^{\infty} r^{n} = \frac{1}{1-r}
      = \frac{1}{1-\frac12} = 2
      $$

      **De dónde sale la fórmula**, por si la piden demostrada. La suma parcial
      es $S_N = 1+r+\cdots+r^{N}$; multiplicándola por $r$ y restando se
      cancela casi todo y queda $S_N = \frac{1-r^{N+1}}{1-r}$. Si
      $\left|r\right|<1$, el $r^{N+1}$ se va a cero y sobrevive
      $\frac{1}{1-r}$.

      **Comprobación.** Los primeros términos suman $1$, $1{,}5$, $1{,}75$,
      $1{,}875$… acercándose a 2 sin pasarse. Cuadra.

      <figure class="figura-examen">
      <svg viewBox="0 0 335 240" role="img" width="335" height="240"
           aria-labelledby="f-ej-suma-geometrica-t f-ej-suma-geometrica-d">
