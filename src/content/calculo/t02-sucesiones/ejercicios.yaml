        <desc id="t2serD">Una curva baja desde arriba, cruza la recta de trazos y igual a 1 en x igual a 1, sigue bajando y cruza la recta y igual a menos 1 en x igual a 3, hace un valle y vuelve a subir cruzando menos 1 en x igual a 4 y el 1 otra vez en x igual a 5. Los dos tramos en que la curva queda dentro de la banda están sombreados.</desc>

