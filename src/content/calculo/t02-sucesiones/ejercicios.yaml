        <desc id="f-ej-suma-geometrica-d">Una línea horizontal de puntos a la altura dos marca la suma de la serie. Debajo, los puntos de las sumas parciales: la primera vale uno, la segunda uno coma cinco, la tercera uno coma setenta y cinco, y así sucesivamente, subiendo cada vez menos y acercándose a la línea sin llegar a tocarla. Entre cada punto y la línea hay un trazo vertical que muestra lo que falta, y que se reduce a la mitad en cada paso.</desc>
