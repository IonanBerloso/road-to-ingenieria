      <svg viewBox="0 0 335 230" role="img" width="335" height="230"
           aria-labelledby="f-ej-signo-limite-t f-ej-signo-limite-d">
        <title id="f-ej-signo-limite-t">La sucesión uno partido por n, con todos sus términos positivos y límite cero</title>
        <desc id="f-ej-signo-limite-d">Los términos de la sucesión son puntos que empiezan en la altura uno y van bajando hacia el eje horizontal, cada vez más pegados a él pero siempre por encima: ninguno llega a tocarlo. Una banda sombreada marca la zona estrictamente positiva, donde están todos. El propio eje, la altura cero, es el límite, y está fuera de esa zona: esa es toda la lección del ejemplo.</desc>
