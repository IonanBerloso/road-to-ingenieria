  - id: serie-sucesion-tres-tramos
    titulo: Una serie que no puede converger
    fuente: >-
      Ejercicio 2.15 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2019/2020 1E)

    nivel: practica
    enunciado: |
      Sea la sucesión

      $$
      \{a_n\}_{n\in\mathbb{N}} =
      \begin{cases}
      n^{3} & n < 1000 \\[2pt]
      1 & 1000 \le n < 2000 \\[2pt]
      1-\dfrac{1}{n} & n \ge 2000
      \end{cases}
      $$
    pide: ¿Es convergente la serie $\sum_{n=1}^{\infty} a_n$?

    pasos:
      - tipo: reconocer
        pregunta: |
          La sucesión tiene tres tramos y el primero crece como $n^{3}$. ¿Por
          dónde se ataca la pregunta sobre la serie?
        opciones:
          - texto: >-
              Por la condición necesaria: si la serie converge, el término
              general tiene que tender a 0
            correcta: true
            mensaje: |
              Eso es. Es la comprobación más barata que existe y aquí resuelve
              el ejercicio en una línea: el término general tiende a 1, no a 0,
              así que la serie no converge.
          - texto: Sumando los mil primeros términos para ver cuánto dan
            mensaje: |
              Esa suma es un número finito, por grande que sea, y **no decide
              nada**: la convergencia de una serie depende de la cola, no de
              cuántos términos gordos haya al principio.
          - texto: Comparando con la serie armónica
            mensaje: |
              La comparación exige que el término general tienda a 0, y aquí no
              lo hace. Antes de buscar un criterio fino conviene mirar el
              barato, que ya cierra el problema.
          - texto: Como el tercer tramo tiende a 1 y $1 < \infty$, la serie converge
            mensaje: |
              Confundes la convergencia de la **sucesión** con la de la
              **serie**. Que los sumandos tiendan a 1 significa que estás sumando
              infinitas veces algo parecido a 1: la suma se va a infinito.

      - tipo: calcular
        titulo: El límite del término general
        pregunta: ¿A qué tiende $a_n$ cuando $n \to \infty$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              El tercer tramo es $1-\frac1n$, no $\frac1n$. Lo que tiende a cero
              es el término que se resta, y lo que queda es el 1.
          - valor: '2000'
            mensaje: |
              El 2000 es donde empieza el último tramo, no el valor al que
              tiende. A partir de ahí la sucesión vale $1-\frac{1}{n}$.
        pista: |
          Solo importa el último tramo, el que vale para $n$ grande:
          $1-\frac{1}{n}$.
        desarrollo: |
          El límite solo depende de la **cola** de la sucesión, es decir del
          tramo que vale a partir de $n \ge 2000$:

          $$
          \lim_{n\to\infty} a_n = \lim_{n\to\infty}\left(1-\frac{1}{n}\right) = 1
          $$

          Los tramos $n^{3}$ y $1$ afectan a un número **finito** de términos y
          no influyen en el límite.
        veredicto: |
          Que el primer tramo llegue a $999^{3} \approx 10^{9}$ es irrelevante
          para el límite: son mil términos, y mil es finito.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que responde a la pregunta. Una de las piezas
          no debe entrar.
        piezas:
          - texto: |
              Condición necesaria de convergencia: si $\sum a_n$ converge,
              entonces $a_n \to 0$.
          - texto: |
              En contrapositivo: si $a_n \not\to 0$, la serie **no** converge.
          - texto: |
              Aquí $a_n \to 1 \neq 0$, porque la cola de la sucesión es
              $1-\frac{1}{n}$.
          - texto: |
              Luego la serie $\sum a_n$ **no** es convergente.
          - texto: |
              Como $a_n \to 1$ y 1 es finito, la suma de infinitos términos
              también será finita.
            trampa: true
            mensaje: |
              Sumar infinitas veces algo que se parece a 1 da infinito, no un
              número finito. Que cada sumando sea pequeño —o finito— no basta:
              lo que hace falta es que se hagan pequeños **lo bastante deprisa**,
              y aquí ni siquiera se hacen pequeños.
        veredicto: |
          Cuidado con el recíproco: que $a_n \to 0$ **no** garantiza que la serie
          converja. La armónica $\sum\frac1n$ es el contraejemplo. La condición
          sirve para descartar, nunca para confirmar.

    resolucion: |
      **Datos.** Una sucesión definida en tres tramos, y la pregunta de si
      $\sum a_n$ converge.

      ### 1 · La herramienta: condición necesaria

      Si una serie $\sum a_n$ converge, entonces su término general tiende a
      cero. La demostración es corta: si $S_n$ son las sumas parciales y
      $S_n \to S$, entonces

      $$
      a_n = S_n - S_{n-1} \longrightarrow S - S = 0
      $$

      Usada en contrapositivo —**si $a_n \not\to 0$, la serie diverge**— es la
      comprobación más rentable del tema: cuesta una línea y cierra muchos
      ejercicios.

      ### 2 · El límite del término general

      Solo cuenta la cola. Los tramos $n^{3}$ (para $n<1000$) y $1$ (hasta
      $n<2000$) afectan a un número finito de términos y no influyen:

      $$
      \lim_{n\to\infty} a_n = \lim_{n\to\infty}\left(1-\frac1n\right) = 1
      $$

      ### 3 · Conclusión

      Como $a_n \to 1 \neq 0$, **la serie no converge**. De hecho diverge a
      $+\infty$: a partir de $n = 2000$ se están sumando infinitos términos cada
      uno mayor que $\frac12$.

      ### 4 · Una advertencia sobre el recíproco

      Conviene dejarlo escrito porque es el error gemelo: que el término general
      tienda a cero **no** garantiza la convergencia. La serie armónica
      $\sum\frac1n$ tiene término general tendiendo a 0 y suma infinita.

      La condición sirve para **descartar**, nunca para confirmar.

      ### Resultado

      $$
      \boxed{\;\text{No: la serie } \sum a_n \text{ no es convergente,
      porque } a_n \to 1 \neq 0\;}
      $$

