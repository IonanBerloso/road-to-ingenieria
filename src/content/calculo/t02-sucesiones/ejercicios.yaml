  - id: sucesion-tres-tramos
    titulo: Una sucesión con un pico en medio
    fuente: >-
      Ejercicio 2.7 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2014/2015 4E)

    nivel: practica
    enunciado: |
      $$
      a_n =
      \begin{cases}
      -\dfrac{1}{n^{2}} & n < 100 \\[6pt]
      n & 100 \le n \le 200 \\[6pt]
      1-\dfrac{1}{n} & n > 200
      \end{cases}
      $$
    pide: Estudiar si es creciente, decreciente, acotada y convergente.

    pasos:
      - tipo: reconocer
        pregunta: |
          El tramo de en medio llega hasta 200 y el último baja a valores
          cercanos a 1. ¿Qué tramo decide la convergencia?
        opciones:
          - texto: Solo el último, porque la convergencia mira únicamente la cola
            correcta: true
            mensaje: |
              Eso es. Los dos primeros tramos afectan a 200 términos, y 200 es
              un número finito: da igual lo que hagan. El límite lo fija
              $1-\frac1n$.
          - texto: El de en medio, porque es donde la sucesión toma los valores más grandes
            mensaje: |
              El tamaño de los términos importa para la **acotación**, no para
              el límite. Que la sucesión llegue a valer 200 no impide que
              después se estabilice en 1.
          - texto: Los tres, ponderando su longitud
            mensaje: |
              El límite no se promedia. Es lo que ocurre «al final», y al final
              solo está el tercer tramo, que además es infinito mientras que los
              otros dos son finitos.
          - texto: "Ninguno: al estar definida a trozos, la sucesión no converge"
            mensaje: |
              Estar definida a trozos no impide converger. Lo que puede romper
              un trozo es la **monotonía**, que sí mira la sucesión entera; la
              convergencia solo mira el final.

      - tipo: calcular
        titulo: El límite
        pregunta: ¿A qué converge la sucesión?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '200'
            mensaje: |
              200 es el valor máximo que alcanza la sucesión, en $n=200$. Es su
              supremo, no su límite: después de ese término la sucesión cae y se
              queda cerca de 1 para siempre.
          - valor: '0'
            mensaje: |
              El primer tramo, $-\frac{1}{n^{2}}$, sí tiende a 0, pero solo vale
              para $n<100$: son 99 términos y luego desaparece. El límite lo
              marca el tramo que vale para todo $n$ grande.
        pista: |
          Quédate solo con el tramo válido para $n$ grande: $1-\frac1n$.
        desarrollo: |
          Para $n > 200$ la sucesión vale $1-\frac1n$, y

          $$
          \lim_{n\to\infty}\left(1-\frac{1}{n}\right) = 1
          $$

          Los tramos anteriores afectan a 200 términos, un número finito, y no
          influyen en el límite.
        veredicto: |
          La sucesión llega a valer 200 y aun así converge a 1. Eso es lo que
          significa que el límite solo mire la cola.

      - tipo: calcular
        titulo: La cota superior
        pregunta: ¿Cuál es el valor más grande que alcanza la sucesión?
        respuesta:
          tipo: numero
          valor: '200'
          tolerancia: 0.5
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es el límite, no el máximo. La sucesión pasa por valores mucho
              mayores antes de estabilizarse: en $n=200$ vale exactamente 200.
          - valor: '100'
            mensaje: |
              En $n=100$ empieza el tramo creciente, pero sigue subiendo hasta
              $n=200$. El máximo está al final de ese tramo, no al principio.
          - valor: '0'
            mensaje: |
              Ese sería el máximo si la sucesión fuera solo el primer tramo,
              donde todos los valores son negativos. El segundo tramo la manda
              muy por encima.
        pista: |
          El segundo tramo es $a_n = n$ con $100 \le n \le 200$: crece hasta el
          final del intervalo.
        desarrollo: |
          - **Primer tramo** ($n<100$): $-\frac{1}{n^{2}}$ toma valores entre
            $-1$ (en $n=1$) y casi 0. Todos negativos.
          - **Segundo tramo** ($100 \le n \le 200$): $a_n = n$, que va de 100 a
            **200**.
          - **Tercer tramo** ($n>200$): $1-\frac1n$, siempre menor que 1.

          El máximo es $a_{200} = 200$ y el mínimo, $a_1 = -1$. Por tanto

          $$
          -1 \le a_n \le 200 \qquad \forall n
          $$

          y la sucesión está **acotada**.
        veredicto: |
          Que exista una cota, por grande que sea, es lo único que pide la
          definición de acotada. No hace falta que sea ajustada.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento sobre el crecimiento. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              Ser creciente exige $a_{n+1} > a_n$ para **todo** $n$, sin
              excepciones.
          - texto: |
              Entre $n=1$ y $n=2$ la sucesión sube: $-1 < -\frac14$. Así que no
              es decreciente.
          - texto: |
              Entre $n=200$ y $n=201$ baja de golpe: de $200$ a
              $1-\frac{1}{201} \approx 0{,}995$. Así que tampoco es creciente.
          - texto: |
              Al fallar las dos condiciones, la sucesión **no es creciente ni
              decreciente**.
          - texto: |
              Como no es creciente, es decreciente.
            trampa: true
            mensaje: |
              «No creciente» y «decreciente» no son lo mismo. Una sucesión puede
              subir en un sitio y bajar en otro, y entonces no es ninguna de las
              dos. Aquí pasa exactamente eso: sube en los dos primeros tramos y
              da un salto hacia abajo en $n=201$.
        veredicto: |
          Para justificar que no es monótona basta **una** pareja de términos
          consecutivos de cada tipo. No hace falta estudiar los tres tramos
          enteros.

    resolucion: |
      **Datos.** Una sucesión definida en tres tramos. Se pide estudiar
      crecimiento, acotación y convergencia.

      **Cómo se ataca una sucesión a trozos.** Las tres preguntas se responden
      con herramientas distintas, y conviene tenerlo claro antes de empezar
      porque cada una mira una parte diferente de la sucesión:

      | pregunta | qué hay que mirar |
      |---|---|
      | ¿monótona? | **todos** los pares consecutivos, y sobre todo los empalmes |
      | ¿acotada? | **todos** los tramos, buscando el mayor y el menor valor |
      | ¿converge? | **solo la cola**: el último tramo |

      La monotonía es la más frágil de las tres: basta un par que falle. Y los
      pares que fallan casi siempre están en los empalmes, porque dentro de cada
      tramo la fórmula suele ser monótona. Por eso se empieza por ahí.

      ### 1 · Crecimiento

      Ser creciente exige $a_{n+1} > a_n$ para **todo** $n$; decreciente, lo
      contrario. Basta un contraejemplo de cada tipo para descartar las dos.

      - **Sube** en $n=1 \to 2$: de $-1$ a $-\frac14$.
      - **Baja** en $n=200 \to 201$: de $200$ a $1-\frac{1}{201} \approx 0{,}995$.

      Luego **no es creciente ni decreciente**. Conviene decirlo así, con las
      dos palabras: «no creciente» por sí solo no descarta que sea decreciente.

      ### 2 · Acotación

      Tramo a tramo:

      | tramo | valores |
      |---|---|
      | $n<100$ | $-\frac{1}{n^{2}}$, entre $-1$ y casi 0 |
      | $100\le n\le 200$ | de 100 a 200 |
      | $n>200$ | $1-\frac1n$, entre $0{,}995$ y 1 |

      El mínimo es $a_1 = -1$ y el máximo $a_{200} = 200$:

      $$
      -1 \le a_n \le 200 \qquad \forall n \in \mathbb{N}
      $$

      La sucesión está **acotada**.

      ### 3 · Convergencia

      La convergencia depende solo de la **cola**. Los dos primeros tramos
      cubren 200 términos —un número finito— y son irrelevantes. Para $n>200$:

      $$
      \lim_{n\to\infty} a_n = \lim_{n\to\infty}\left(1-\frac{1}{n}\right) = 1
      $$

      La sucesión es **convergente con límite 1**.

      ### 4 · Una observación que merece la pena escribir

      Este ejercicio es un contraejemplo vivo de dos confusiones habituales:

      - Una sucesión puede converger **sin ser monótona**. El teorema dice que
        monótona y acotada implica convergente, no al revés.
      - Una sucesión puede alcanzar valores enormes —200— y converger a un
        número pequeño. El tamaño de los términos no dice nada del límite.

      ### 5 · Comprobación

      Las tres respuestas, contrastadas con la definición:

      - **No monótona.** Basta exhibir los dos pares que la rompen, y están
        exhibidos: $a_1 < a_2$ y $a_{200} > a_{201}$.
      - **Acotada.** Las cotas $-1$ y $200$ se alcanzan las dos, en $a_1$ y
        $a_{200}$: son mínimo y máximo, no solo ínfimo y supremo.
      - **Límite 1.** Con $\varepsilon = 10^{-3}$ hace falta
        $\left|1-\frac1n-1\right| = \frac1n < 10^{-3}$, es decir $n>1000$. Como
        $1000 > 200$, la condición cae de lleno en el tercer tramo y no hay que
        preocuparse por los otros dos.

      Esa última comprobación es la que conviene escribir en un examen: enseña
      que se ha entendido que la cola es lo único que interviene.

      ### Resultado

      $$
      \boxed{\;\text{Ni creciente ni decreciente. Acotada: }
      -1 \le a_n \le 200. \text{ Convergente con } L=1\;}
      $$

