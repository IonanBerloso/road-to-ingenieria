  - id: signos-infinitos-limite-cero
    titulo: Infinitos positivos e infinitos negativos
    fuente: >-
      Ejercicio 2.4 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2012/2013 1E) · El boletín no publica solución: la demostración es
      propuesta nuestra, pendiente de revisión.

    nivel: practica
    enunciado: |
      Supongamos que $\{a_n\}_{n\in\mathbb{N}}$ es una sucesión convergente que
      tiene infinitos términos positivos e infinitos términos negativos.
    pide: Demostrar formalmente que su límite es 0.

    pasos:
      - tipo: reconocer
        pregunta: |
          La hipótesis dice «infinitos» de cada signo. ¿Por qué es importante
          que sean infinitos y no solo «algunos»?
        opciones:
          - texto: >-
              Porque con infinitos siempre queda alguno **después** de cualquier
              índice, y la definición de límite habla del final
            correcta: true
            mensaje: |
              Ese es el corazón del ejercicio. Si solo hubiera unos cuantos
              términos negativos, a partir de un momento desaparecerían y no
              estorbarían. Al ser infinitos, siempre aparece uno más allá de
              cualquier $m$.
          - texto: Porque una sucesión con términos de los dos signos no puede converger
            mensaje: |
              Sí puede: $\frac{(-1)^{n}}{n}$ tiene infinitos de cada signo y
              converge a 0. El enunciado la da por convergente, y de ahí deduce
              cuál es el límite.
          - texto: Porque así la sucesión está acotada
            mensaje: |
              Tener términos de los dos signos no dice nada sobre la acotación.
              La acotación viene de la convergencia, que es hipótesis.
          - texto: Porque garantiza que la sucesión es alternada
            mensaje: |
              No hace falta que alternen ordenadamente. Pueden aparecer en
              cualquier orden: lo único que se usa es que nunca se agotan.

      - tipo: calcular
        titulo: El épsilon
        pregunta: |
          Si se supone que el límite es $L = 0{,}6$, sirve cualquier
          $\varepsilon$ que deje el intervalo
          $(L-\varepsilon,\,L+\varepsilon)$ entero a la derecha del cero.
          ¿Cuál es **el mayor** que sirve?
        respuesta:
          tipo: numero
          valor: '0.6'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1.2'
            mensaje: |
              Has multiplicado por dos en vez de quedarte en $L$. Con
              $\varepsilon = 1{,}2$ el extremo izquierdo es $-0{,}6$: el cero y
              los negativos quedan **dentro** del entorno, así que no
              contradicen nada.
          - valor: '0.9'
            mensaje: |
              Te pasas: el extremo izquierdo sería $-0{,}3$, y un término
              negativo cabría ahí sin incumplir la definición. Hace falta que
              todo el intervalo quede en los positivos.
          - valor: '0'
            mensaje: |
              La definición exige $\varepsilon > 0$ estrictamente. Con
              $\varepsilon = 0$ la condición $|a_n - L| < 0$ no la cumple nadie.
          - valor: '0.3'
            mensaje: |
              Sirve, y es la elección de muchos libros —la mitad de la
              distancia—, pero no es **el mayor**. Con $\varepsilon = 0{,}6$ el
              extremo izquierdo es exactamente $0$, y la desigualdad de la
              definición es **estricta**: $a_n > 0$, no $a_n \ge 0$. Los
              negativos quedan excluidos igual.
        pista: |
          El extremo izquierdo del intervalo es $L-\varepsilon$. Busca el mayor
          $\varepsilon$ que lo deja en $0$ o por encima.
        desarrollo: |
          Con $\varepsilon = L = 0{,}6$, a partir de cierto $m$:

          $$
          |a_n - 0{,}6| < 0{,}6 \;\Longrightarrow\; a_n > 0
          $$

          y ese $>$ es estricto, porque la definición de límite lo es.

          o sea, **todos** los términos desde $m$ serían positivos. Pero hay
          infinitos negativos, así que alguno tiene que aparecer después de
          $m$. Contradicción.
        veredicto: |
          El mismo épsilon que en el 2.3, y por el mismo motivo: la mitad de la
          distancia deja el entorno entero a un lado del cero.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Sea $L$ el límite, que existe por hipótesis. Se descartan por
              separado los casos $L>0$ y $L<0$.
          - texto: |
              **Si $L>0$:** tomando $\varepsilon = \frac{L}{2}$, existe $m$ tal
              que $a_n > L - \frac{L}{2} = \frac{L}{2} > 0$ para todo $n>m$.
          - texto: |
              Eso deja como mucho $m$ términos negativos, un número finito, y
              contradice que haya infinitos. Luego $L$ no puede ser positivo.
          - texto: |
              **Si $L<0$:** el mismo argumento con
              $\varepsilon = -\frac{L}{2}$ da $a_n < \frac{L}{2} < 0$ a partir
              de cierto índice, contradiciendo que haya infinitos positivos.
          - texto: |
              Descartados los dos casos, $L = 0$.
          - texto: |
              Como hay tantos positivos como negativos, se compensan y el límite
              es cero.
            trampa: true
            mensaje: |
              «Se compensan» no es un argumento: los límites no promedian
              signos. Además la hipótesis no dice que haya la misma cantidad
              —los dos conjuntos son infinitos, y eso no significa «iguales»—,
              ni los términos tienen por qué ser simétricos. La demostración
              tiene que pasar por la definición.
        veredicto: |
          Descartar dos casos por separado y concluir el tercero es un esquema
          que se repite. Lo importante es que cada caso choque con **una**
          hipótesis concreta del enunciado.

    resolucion: |
      > **Aviso.** El boletín no publica solución de este ejercicio. Lo que
      > sigue es una demostración propuesta, pendiente de revisión.

      **Enunciado.** Si $\{a_n\}$ converge y tiene infinitos términos positivos
      e infinitos términos negativos, su límite es 0.

      ### 1 · Qué hace fuerte a la hipótesis

      Que los términos de cada signo sean **infinitos** significa que, por
      grande que sea un índice $m$, siempre hay términos de los dos signos
      después de $m$. Eso es justo lo que choca con la definición de límite, que
      afirma algo sobre **todos** los términos a partir de cierto punto.

      Si solo hubiera unos cuantos negativos, desaparecerían y no dirían nada
      del límite.

      ### 2 · La demostración

      Sea $L = \lim a_n$, que existe por hipótesis. Se descartan los dos casos.

      **Caso $L > 0$.** Se toma $\varepsilon = \frac{L}{2} > 0$. Por definición
      de límite, existe $m$ tal que para todo $n>m$

      $$
      |a_n - L| < \frac{L}{2} \;\Longrightarrow\; a_n > L - \frac{L}{2} = \frac{L}{2} > 0
      $$

      Es decir, todos los términos a partir de $m$ son positivos, y por tanto
      hay como mucho $m$ términos negativos: un número **finito**. Eso
      contradice la hipótesis de que hay infinitos negativos.

      **Caso $L < 0$.** Simétrico: con $\varepsilon = -\frac{L}{2} > 0$ se
      obtiene $a_n < \frac{L}{2} < 0$ para todo $n>m$, y solo habría finitos
      términos positivos. Contradicción.

      Descartados los dos, la única posibilidad es

      $$
      L = 0 \qquad \blacksquare
      $$

      ### 3 · El ejemplo que acompaña

      $a_n = \frac{(-1)^{n}}{n}$ cumple las hipótesis: converge, y tiene
      infinitos términos de cada signo. Su límite es, en efecto, 0.

      ### 4 · Lo que no vale como argumento

      Decir que «los positivos y los negativos se compensan» no demuestra nada:
      los límites no promedian signos, la hipótesis no afirma que haya la misma
      cantidad de cada tipo, y los términos no tienen por qué ser simétricos.
      Todo el peso lo lleva la definición.

      ### 5 · Comprobación

      Se intenta construir un contraejemplo y se ve que no sale, que es la mejor
      forma de comprobar una demostración por reducción al absurdo. Para que el
      límite fuera $L = 0{,}6$ con infinitos negativos, habría que mantener
      términos por debajo de cero **sin dejar de acercarse a $0{,}6$**:

      $
      a_n = 0{,}6 + \frac{(-1)^{n}}{n}
      \;\longrightarrow\; 0{,}6
      $

      $
      a_1 = -0{,}4 < 0, \qquad a_2 = 1{,}1, \qquad a_3 = 0{,}27, \qquad
      a_4 = 0{,}85,\;\dots
      $

      Un solo término negativo. Y no es mala suerte: con
      $\varepsilon = \frac{L}{2} = 0{,}3$, a partir de $n>\frac{1}{0{,}3}$ todos
      los términos superan $0{,}3$. La oscilación que sobrevive al límite es
      cada vez más pequeña, y por eso **no puede cruzar el cero infinitas veces
      si el límite no es cero**.

      Frente a esto, $a_n = \frac{(-1)^{n}}{n}$ sí cruza infinitas veces, y su
      límite es 0.

      ### Resultado

      $
      \boxed{\;\{a_n\}\text{ convergente con infinitos términos de cada signo}
      \;\;\Longrightarrow\;\; \lim a_n = 0\;}
      $

