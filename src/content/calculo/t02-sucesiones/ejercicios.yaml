  - id: ej-signo-en-el-limite
    titulo: Por qué el límite de términos positivos no tiene por qué ser positivo
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Se sabe que $a_n > 0$ para todo $n$ y que $a_n \to L$. Decidir si se puede
      afirmar que $L > 0$, y en caso contrario dar un contraejemplo.
    pide: Si la conclusión es L > 0 o L ≥ 0, con un contraejemplo que lo justifique.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué se puede afirmar del límite?
        opciones:
          - texto: Que $L \ge 0$, pero no que sea estrictamente positivo
            correcta: true
            mensaje: |
              Exacto, y es **el punto que el examen puntúa año tras año**. El
              paso al límite conserva las desigualdades anchas, no las
              estrictas.
          - texto: Que $L > 0$, porque todos los términos lo son
            mensaje: |
              Es la respuesta intuitiva y es falsa. Una sucesión de términos
              estrictamente positivos puede acercarse al cero tanto como quiera
              sin llegar nunca, y el límite entonces vale exactamente cero.
          - texto: Que no se puede decir nada del signo de $L$
            mensaje: |
              Sí se puede decir algo: negativo no puede ser. Si lo fuera, a
              partir de un momento los términos tendrían que estar cerca de él
              y serían negativos, contra la hipótesis.
      - tipo: calcular
        titulo: El contraejemplo
        pregunta: |
          Toma $a_n = \dfrac{1}{n}$, que cumple $a_n > 0$ para todo $n$.
          ¿Cuánto vale su límite?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es el **primer término**, $a_1$. El límite mira a dónde va la
              sucesión cuando $n$ crece, no por dónde empieza.
          - valor: '0.01'
            mensaje: |
              Ningún número positivo puede ser el límite: por pequeño que lo
              elijas, la sucesión acaba pasando por debajo. Con 0,01, a partir
              del término 101 ya está por debajo. El único candidato es el cero.
        pista: |
          Los términos son $1, \frac12, \frac13, \frac14, \ldots$ ¿Hacia dónde
          van?
        desarrollo: |
          Los términos decrecen y se acercan al cero tanto como se quiera:

          $$
          \lim_{n\to\infty}\frac{1}{n} = 0
          $$

          Y sin embargo **todos** son estrictamente positivos. Esa es toda la
          contradicción con «$L>0$»: la desigualdad estricta se pierde por el
          camino.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento completo. Una pieza es falsa.
        piezas:
          - texto: Supón que fuera $L < 0$, y toma $\varepsilon = \left|L\right|$.
          - texto: Existiría un $m$ con $\left|a_n-L\right| < \left|L\right|$ para todo $n>m$.
          - texto: Eso daría $a_n < L + \left|L\right| = 0$, contra la hipótesis $a_n>0$.
          - texto: Luego $L \ge 0$; y $a_n = \frac1n$ enseña que la igualdad puede darse.
          - texto: Como ningún término vale cero, el límite tampoco puede valer cero.
            trampa: true
            mensaje: |
              El límite **no es un término de la sucesión**: es el valor al que
              se acercan, y no tiene por qué alcanzarse nunca. Confundir las dos
              cosas es lo que hace creer que la conclusión es estricta.
    resolucion: |
      **La conclusión correcta es $L \ge 0$.**

      **Que negativo no puede ser** se demuestra por reducción al absurdo, con
      la plantilla del tema. Supón $L<0$ y toma $\varepsilon = \left|L\right|$,
      que es positivo. Por definición de límite existe $m$ tal que para todo
      $n>m$

      $$
      \left|a_n - L\right| < \left|L\right|
      \;\Longrightarrow\;
      a_n < L + \left|L\right| = 0
      $$

      es decir, infinitos términos serían negativos. Contradice la hipótesis.

      **Que positivo tampoco tiene por qué ser** se ve con un contraejemplo, y
      basta uno: $a_n = \frac1n$ cumple $a_n>0$ para todo $n$ y su límite es
      $0$.

      **El detalle que decide la nota.** La elección de $\varepsilon$ no es
      libre: se toma exactamente $\left|L\right|$, la distancia de $L$ a la
      frontera que se quiere cruzar. Con un $\varepsilon$ cualquiera no sale
      nada.

