ejercicios:
  - id: creciente-con-limite-cero
    titulo: Una sucesión creciente que tiende a cero
    fuente: >-
      Ejercicio 2.1 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2011/2012 4E)

    enunciado: |
      Supongamos que $\{a_n\}_{n\in\mathbb{N}}$ es una sucesión **creciente**
      cuyo límite es 0.
    pide: >-
      Decidir cuál de las afirmaciones es cierta, y para la sucesión
      $a_n = \frac{n-3}{n+1}$ con $\varepsilon = 10^{-10}$, encontrar el menor
      $m$ tal que $|a_n - L| < \varepsilon$ para todo $n>m$.

    pasos:
      - tipo: reconocer
        pregunta: |
          De las cuatro afirmaciones del enunciado, ¿cuál es la única cierta?
        opciones:
          - texto: $\forall n \in \mathbb{N}$, $a_n < 0$
            correcta: true
            mensaje: |
              Correcto, y el argumento es corto: si algún término fuera
              $a_{n_0} \ge 0$, al ser creciente todos los siguientes serían
              **estrictamente mayores**, y el límite tendría que ser al menos
              $a_{n_0+1} > 0$. Como el límite es 0, eso es imposible.
          - texto: $\exists n \in \mathbb{N}$ con $a_n > 0$
            mensaje: |
              Si un término fuera positivo, a partir de ahí todos lo serían y
              serían mayores que él, así que el límite no podría ser 0: sería un
              número positivo. Una sucesión creciente **se acerca a su límite
              por debajo**.
          - texto: La sucesión puede tener términos positivos y negativos
            mensaje: |
              Podría tenerlos si fuera cualquier sucesión, pero esta es
              creciente: en cuanto un término fuera positivo, todos los
              posteriores también, y el límite sería positivo. Los dos datos
              juntos —creciente y límite cero— la obligan a ser toda negativa.
          - texto: $\exists n \in \mathbb{N}$ con $a_n = 0$
            mensaje: |
              Tampoco: si algún término valiera exactamente 0, el siguiente
              sería estrictamente mayor —creciente— y ya sería positivo, con lo
              que el límite se iría por encima de 0. El cero es el límite, y no
              se alcanza.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que demuestra la afirmación cierta. Una de las
          piezas no debe entrar.
        piezas:
          - texto: |
              Se razona por reducción al absurdo: supongamos que existe $n_0$
              con $a_{n_0} \ge 0$.
          - texto: |
              Al ser creciente, $a_n > a_{n_0} \ge 0$ para todo $n > n_0$: a
              partir de ahí todos los términos son estrictamente positivos.
          - texto: |
              El límite de una sucesión creciente es el supremo de sus términos,
              y en particular es mayor o igual que cualquiera de ellos: $L \ge
              a_{n_0+1} > 0$.
          - texto: |
              Pero el enunciado dice que $L = 0$, y $0 > 0$ es falso.
              Contradicción, luego $a_n < 0$ para todo $n$.
          - texto: |
              Como el límite es 0 y la sucesión crece, sus términos se acercan a
              0, así que a partir de un momento son positivos.
            trampa: true
            mensaje: |
              Acercarse a 0 **por debajo** es acercarse igual. Una sucesión
              creciente que tiende a 0 sube hacia el cero sin llegar nunca:
              $-1, -\frac12, -\frac13, \dots$ es el ejemplo. Confundir «se
              acerca a cero» con «se hace positiva» es el error que este
              ejercicio caza.
        veredicto: |
          La imagen que hay que tener: una sucesión creciente sube hacia su
          límite y se queda siempre por debajo. Si el límite es 0, vive entera
          en los negativos.

      - tipo: calcular
        titulo: El menor m del apartado (e)
        pregunta: |
          Para $a_n = \dfrac{n-3}{n+1}$ y $\varepsilon = 10^{-10}$, ¿cuál es el
          menor $m$ tal que $|a_n - L| < \varepsilon$ para todo $n > m$?
        respuesta:
          tipo: numero
          valor: '39999999999'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '40000000000'
            mensaje: |
              Casi. La condición es $n+1 > 4\cdot 10^{10}$, es decir
              $n > 4\cdot 10^{10} - 1$. El menor $m$ que sirve es justamente ese
              número, y tú has puesto uno más: te has dejado el $-1$ del
              denominador.
          - valor: '10000000000'
            mensaje: |
              Te has dejado el 4. La distancia al límite es
              $\left|\frac{n-3}{n+1} - 1\right| = \frac{4}{n+1}$, con un 4 en el
              numerador que viene de $-3-1$.
          - valor: '4'
            mensaje: |
              Ese 4 es el numerador de la distancia al límite, no el valor de
              $m$. Falta dividirlo entre $\varepsilon$.
        pista: |
          Primero el límite: $\frac{n-3}{n+1} \to 1$. Luego calcula
          $\left|\frac{n-3}{n+1}-1\right|$ y verás que se simplifica muchísimo.
        desarrollo: |
          El límite es $L = 1$, porque numerador y denominador tienen el mismo
          grado y coeficiente principal 1.

          $$
          \left|\frac{n-3}{n+1} - 1\right|
            = \left|\frac{n-3-(n+1)}{n+1}\right|
            = \frac{4}{n+1}
          $$

          Se impone que sea menor que $\varepsilon = 10^{-10}$:

          $$
          \frac{4}{n+1} < 10^{-10}
          \;\Longleftrightarrow\;
          n+1 > 4\cdot 10^{10}
          \;\Longleftrightarrow\;
          n > 4\cdot 10^{10} - 1
          $$

          El menor $m$ que hace que la condición valga para **todo** $n>m$ es

          $$
          m = 4\cdot 10^{10} - 1 = 39\,999\,999\,999
          $$
        veredicto: |
          Cuarenta mil millones de términos para acercarse a una diezmilésima de
          millonésima. Eso es lo que significa que $m$ dependa de $\varepsilon$:
          cuanto más aprietas, más tarde empieza a cumplirse.

    resolucion: |
      **Datos.** $\{a_n\}$ creciente con $\lim a_n = 0$.

      ### 1 · Qué obliga la combinación «creciente» + «límite 0»

      Las dos condiciones por separado no dicen gran cosa; juntas fijan el signo
      de todos los términos.

      **Afirmación: $a_n < 0$ para todo $n$.** Por reducción al absurdo,
      supongamos que existe $n_0$ con $a_{n_0} \ge 0$. Al ser creciente,

      $$
      a_n > a_{n_0} \ge 0 \qquad \forall n > n_0
      $$

      Además, el límite de una sucesión creciente es el supremo de sus términos,
      así que $L \ge a_{n_0+1} > 0$. Pero $L = 0$. Contradicción.

      Por tanto **(b) es la única cierta**, y con ella caen las otras tres: no
      hay ningún término positivo (a), no puede haber términos de los dos signos
      (c), y ninguno vale exactamente cero (d).

      El ejemplo que fija la idea: $a_n = -\frac1n$ es creciente, tiende a 0 y
      es siempre negativa.

      ### 2 · El apartado (e)

      Para $a_n = \dfrac{n-3}{n+1}$, el límite es $L=1$: numerador y denominador
      son de grado 1 con el mismo coeficiente principal.

      La distancia al límite se simplifica de golpe:

      $$
      |a_n - L| = \left|\frac{n-3}{n+1} - 1\right|
        = \left|\frac{(n-3)-(n+1)}{n+1}\right|
        = \frac{4}{n+1}
      $$

      Se impone la condición de la definición de límite:

      $$
      \frac{4}{n+1} < 10^{-10}
      \;\Longleftrightarrow\;
      n+1 > \frac{4}{10^{-10}} = 4\cdot 10^{10}
      \;\Longleftrightarrow\;
      n > 4\cdot 10^{10} - 1
      $$

      Como se pide el **menor** $m$ tal que la desigualdad valga para todo
      $n > m$:

      $$
      m = 4\cdot 10^{10} - 1 = 39\,999\,999\,999
      $$

      ### 3 · Comprobación

      Con $n = m+1 = 4\cdot10^{10}$:
      $\frac{4}{4\cdot10^{10}+1} < 10^{-10}$ ✔

      Con $n = m = 4\cdot10^{10}-1$:
      $\frac{4}{4\cdot10^{10}} = 10^{-10}$, que **no** es menor estricto que
      $\varepsilon$. Por eso $m$ no puede ser más pequeño.

      ### Resultado

      $$
      \boxed{\;\text{Solo es cierta } a_n<0 \;\forall n;
      \qquad m = 4\cdot 10^{10}-1 = 39\,999\,999\,999\;}
      $$

  - id: comparar-infinitesimos
    titulo: Comparar sucesiones que tienden a cero
    fuente: >-
      Ejercicio 2.12 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2013/2014 7E)

    enunciado: |
      Se consideran las sucesiones

      $$
      \text{(a) } \left\{\frac{1}{n}\right\} \quad
      \text{(b) } \left\{\frac{1}{n^{2}}\right\} \quad
      \text{(c) } \left\{\frac{(-1)^{n}}{n}\right\} \quad
      \text{(d) } \left\{\frac{1}{n+100}\right\}
      $$
    pide: >-
      Calcular sus límites y elegir, para cada caso, dos de ellas tales que
      (i) $\lim \frac{x_n}{y_n}=0$; (ii) $=1$; (iii) $=\infty$; (iv) no exista
      pero la sucesión esté acotada.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las cuatro tienden a 0. Entonces, ¿por qué sus cocientes dan cosas
          distintas?
        opciones:
          - texto: >-
              Porque tender a cero no dice a qué **velocidad**, y el cociente
              compara precisamente eso
            correcta: true
            mensaje: |
              Exacto. Todas son infinitésimos, pero unos van más deprisa que
              otros: $\frac{1}{n^{2}}$ se hace pequeño mucho antes que
              $\frac1n$. El cociente mide esa comparación, y por eso puede dar
              0, 1, infinito o nada.
          - texto: Porque alguna de ellas en realidad no tiende a cero
            mensaje: |
              Las cuatro tienden a 0, incluida $\frac{(-1)^{n}}{n}$: su valor
              absoluto es $\frac1n$, que tiende a 0, y eso basta.
          - texto: Porque el cociente de dos sucesiones convergentes es siempre indeterminado
            mensaje: |
              No siempre: si el denominador tiende a algo distinto de cero, el
              cociente tiende al cociente de los límites. La indeterminación
              aparece justo aquí, porque **los dos** tienden a cero: es el caso
              $\frac00$.
          - texto: Porque el límite de un cociente no existe si el denominador tiende a 0
            mensaje: |
              Puede existir perfectamente. $\frac{1/n^{2}}{1/n} = \frac1n$
              tiende a 0 aunque el denominador se anule en el límite. Lo que hay
              es una indeterminación que se resuelve simplificando.

      - tipo: calcular
        titulo: El cociente que da infinito
        pregunta: |
          Para el caso (iii), $\lim \frac{x_n}{y_n} = \infty$, se toman
          $x_n = \frac1n$ e $y_n = \frac{1}{n^{2}}$. ¿A qué es igual ese
          cociente, simplificado, para $n = 7$?
        respuesta:
          tipo: numero
          valor: '7'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0.142857'
            mensaje: |
              Has calculado el cociente al revés,
              $\frac{1/n^{2}}{1/n} = \frac1n$. Ese es el caso (i), el que tiende
              a 0.
          - valor: '49'
            mensaje: |
              Has multiplicado en vez de dividir:
              $\frac1n \cdot \frac{1}{n^{2}}$ no, el cociente es
              $\frac{1}{n}\cdot n^{2} = n$.
          - valor: '1'
            mensaje: |
              El cociente vale 1 solo si las dos van a la misma velocidad, que
              es el caso (ii) con $\frac1n$ y $\frac{1}{n+100}$. Aquí una es el
              cuadrado de la otra.
        pista: |
          Dividir entre una fracción es multiplicar por su inversa:
          $\frac{1/n}{1/n^{2}} = \frac{n^{2}}{n}$.
        desarrollo: |
          $$
          \frac{x_n}{y_n} = \frac{1/n}{1/n^{2}} = \frac{n^{2}}{n} = n
          $$

          Para $n=7$ vale 7, y cuando $n \to \infty$ el cociente tiende a
          infinito.
        veredicto: |
          $\frac{1}{n^{2}}$ tiende a cero **más deprisa** que $\frac1n$, y por
          eso al dividir la lenta entre la rápida el cociente se dispara.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento del caso (iv): un cociente cuyo límite no
          existe pero que está acotado. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Se toman $x_n = \frac{(-1)^{n}}{n}$ e $y_n = \frac{1}{n}$, las dos
              con límite 0.
          - texto: |
              Al dividir, los factores $\frac1n$ se cancelan y queda
              $\frac{x_n}{y_n} = (-1)^{n}$.
          - texto: |
              La sucesión $(-1)^{n}$ va saltando entre $-1$ y $1$ sin
              estabilizarse: no tiene límite.
          - texto: |
              Pero está acotada: todos sus términos están entre $-1$ y $1$.
          - texto: |
              Como el límite no existe, la sucesión no puede estar acotada.
            trampa: true
            mensaje: |
              Justo al revés de lo que dice el teorema. Toda sucesión
              **convergente** está acotada, pero el recíproco es falso: hay
              acotadas que no convergen, y $(-1)^{n}$ es el ejemplo de manual.
              Que el enunciado pida exactamente ese caso es la pista de que se
              está evaluando esta distinción.
        veredicto: |
          Convergente $\Rightarrow$ acotada. Acotada $\not\Rightarrow$
          convergente. La flecha va en un solo sentido, y este apartado existe
          para comprobar que lo sabes.

    resolucion: |
      **Datos.** Cuatro sucesiones: $\frac1n$, $\frac{1}{n^{2}}$,
      $\frac{(-1)^{n}}{n}$ y $\frac{1}{n+100}$.

      ### 1 · Los límites

      Las cuatro tienden a **0**. Para la tercera conviene decir por qué:
      $\left|\frac{(-1)^{n}}{n}\right| = \frac1n \to 0$, y una sucesión cuyo
      valor absoluto tiende a cero tiende a cero.

      ### 2 · Por qué los cocientes dan cosas distintas

      Todas son infinitésimos, pero **no todos van a la misma velocidad**. El
      cociente de dos de ellas es una indeterminación $\frac{0}{0}$ que se
      resuelve simplificando, y el resultado mide cuál se hace pequeña antes.

      ### 3 · Los cuatro casos

      **(i) Límite 0.** Se pone arriba la que tiende a cero **más deprisa**:

      $$
      \frac{1/n^{2}}{1/n} = \frac{1}{n} \longrightarrow 0
      $$

      **(ii) Límite 1.** Dos que van a la misma velocidad:

      $$
      \frac{1/n}{1/(n+100)} = \frac{n+100}{n} = 1 + \frac{100}{n} \longrightarrow 1
      $$

      El $+100$ es irrelevante en el infinito: por eso el límite es exactamente 1.

      **(iii) Límite infinito.** El caso (i) al revés:

      $$
      \frac{1/n}{1/n^{2}} = n \longrightarrow \infty
      $$

      **(iv) Sin límite, pero acotada.**

      $$
      \frac{(-1)^{n}/n}{1/n} = (-1)^{n}
      $$

      Los factores $\frac1n$ se cancelan y queda una sucesión que alterna entre
      $-1$ y $1$. No tiene límite —no se estabiliza en ningún valor— pero está
      acotada entre $-1$ y $1$.

      ### 4 · La moraleja del apartado (iv)

      Es la que el ejercicio quiere dejar clara: **toda sucesión convergente
      está acotada, pero no toda acotada converge.** La implicación va en un
      solo sentido, y $(-1)^{n}$ es el contraejemplo estándar.

      ### 5 · Comprobación

      Los cuatro cocientes, evaluados en un $n$ grande, tienen que apuntar al
      límite anunciado:

      | cociente | $n=10$ | $n=1000$ | límite |
      |---|---|---|---|
      | (i) $\frac{1/n^{2}}{1/n}$ | $0{,}1$ | $0{,}001$ | $0$ ✔ |
      | (ii) $\frac{1/n}{1/(n+100)}$ | $11$ | $1{,}1$ | $1$ ✔ |
      | (iii) $\frac{1/n}{1/n^{2}}$ | $10$ | $1000$ | $\infty$ ✔ |
      | (iv) $\frac{(-1)^{n}/n}{1/n}$ | $1$ | $1$ | no existe |

      El (ii) merece un vistazo: en $n=10$ vale 11, muy lejos de 1. Converge,
      pero despacio, porque el $+100$ tarda en hacerse irrelevante. Que un
      término esté lejos del límite no dice nada; lo que cuenta es a dónde va.

      Y el (iv) enseña por qué evaluar en un solo $n$ no basta: en $n=1000$ vale
      $1$, pero en $n=999$ vale $-1$. Mirando un único término parecería
      convergente.

      ### Resultado

      $$
      \boxed{\;L=0 \text{ en las cuatro};\quad
      \text{(i) } \tfrac{1/n^{2}}{1/n};\;
      \text{(ii) } \tfrac{1/n}{1/(n+100)};\;
      \text{(iii) } \tfrac{1/n}{1/n^{2}};\;
      \text{(iv) } \tfrac{(-1)^{n}/n}{1/n}\;}
      $$

  - id: serie-sucesion-tres-tramos
    titulo: Una serie que no puede converger
    fuente: >-
      Ejercicio 2.15 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2019/2020 1E)

    enunciado: |
      Sea la sucesión

      $$
      \{a_n\}_{n\in\mathbb{N}} =
      \begin{cases}
      n^{3} & n < 1000 \\[2pt]
      1 & 1000 \le n < 2000 \\[2pt]
      1-\dfrac{1}{n} & n \ge 2000
      \end{cases}
      $$
    pide: ¿Es convergente la serie $\sum_{n=1}^{\infty} a_n$?

    pasos:
      - tipo: reconocer
        pregunta: |
          La sucesión tiene tres tramos y el primero crece como $n^{3}$. ¿Por
          dónde se ataca la pregunta sobre la serie?
        opciones:
          - texto: >-
              Por la condición necesaria: si la serie converge, el término
              general tiene que tender a 0
            correcta: true
            mensaje: |
              Eso es. Es la comprobación más barata que existe y aquí resuelve
              el ejercicio en una línea: el término general tiende a 1, no a 0,
              así que la serie no converge.
          - texto: Sumando los mil primeros términos para ver cuánto dan
            mensaje: |
              Esa suma es un número finito, por grande que sea, y **no decide
              nada**: la convergencia de una serie depende de la cola, no de
              cuántos términos gordos haya al principio.
          - texto: Comparando con la serie armónica
            mensaje: |
              La comparación exige que el término general tienda a 0, y aquí no
              lo hace. Antes de buscar un criterio fino conviene mirar el
              barato, que ya cierra el problema.
          - texto: Como el tercer tramo tiende a 1 y $1 < \infty$, la serie converge
            mensaje: |
              Confundes la convergencia de la **sucesión** con la de la
              **serie**. Que los sumandos tiendan a 1 significa que estás sumando
              infinitas veces algo parecido a 1: la suma se va a infinito.

      - tipo: calcular
        titulo: El límite del término general
        pregunta: ¿A qué tiende $a_n$ cuando $n \to \infty$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              El tercer tramo es $1-\frac1n$, no $\frac1n$. Lo que tiende a cero
              es el término que se resta, y lo que queda es el 1.
          - valor: '2000'
            mensaje: |
              El 2000 es donde empieza el último tramo, no el valor al que
              tiende. A partir de ahí la sucesión vale $1-\frac{1}{n}$.
        pista: |
          Solo importa el último tramo, el que vale para $n$ grande:
          $1-\frac{1}{n}$.
        desarrollo: |
          El límite solo depende de la **cola** de la sucesión, es decir del
          tramo que vale a partir de $n \ge 2000$:

          $$
          \lim_{n\to\infty} a_n = \lim_{n\to\infty}\left(1-\frac{1}{n}\right) = 1
          $$

          Los tramos $n^{3}$ y $1$ afectan a un número **finito** de términos y
          no influyen en el límite.
        veredicto: |
          Que el primer tramo llegue a $999^{3} \approx 10^{9}$ es irrelevante
          para el límite: son mil términos, y mil es finito.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que responde a la pregunta. Una de las piezas
          no debe entrar.
        piezas:
          - texto: |
              Condición necesaria de convergencia: si $\sum a_n$ converge,
              entonces $a_n \to 0$.
          - texto: |
              En contrapositivo: si $a_n \not\to 0$, la serie **no** converge.
          - texto: |
              Aquí $a_n \to 1 \neq 0$, porque la cola de la sucesión es
              $1-\frac{1}{n}$.
          - texto: |
              Luego la serie $\sum a_n$ **no** es convergente.
          - texto: |
              Como $a_n \to 1$ y 1 es finito, la suma de infinitos términos
              también será finita.
            trampa: true
            mensaje: |
              Sumar infinitas veces algo que se parece a 1 da infinito, no un
              número finito. Que cada sumando sea pequeño —o finito— no basta:
              lo que hace falta es que se hagan pequeños **lo bastante deprisa**,
              y aquí ni siquiera se hacen pequeños.
        veredicto: |
          Cuidado con el recíproco: que $a_n \to 0$ **no** garantiza que la serie
          converja. La armónica $\sum\frac1n$ es el contraejemplo. La condición
          sirve para descartar, nunca para confirmar.

    resolucion: |
      **Datos.** Una sucesión definida en tres tramos, y la pregunta de si
      $\sum a_n$ converge.

      ### 1 · La herramienta: condición necesaria

      Si una serie $\sum a_n$ converge, entonces su término general tiende a
      cero. La demostración es corta: si $S_n$ son las sumas parciales y
      $S_n \to S$, entonces

      $$
      a_n = S_n - S_{n-1} \longrightarrow S - S = 0
      $$

      Usada en contrapositivo —**si $a_n \not\to 0$, la serie diverge**— es la
      comprobación más rentable del tema: cuesta una línea y cierra muchos
      ejercicios.

      ### 2 · El límite del término general

      Solo cuenta la cola. Los tramos $n^{3}$ (para $n<1000$) y $1$ (hasta
      $n<2000$) afectan a un número finito de términos y no influyen:

      $$
      \lim_{n\to\infty} a_n = \lim_{n\to\infty}\left(1-\frac1n\right) = 1
      $$

      ### 3 · Conclusión

      Como $a_n \to 1 \neq 0$, **la serie no converge**. De hecho diverge a
      $+\infty$: a partir de $n = 2000$ se están sumando infinitos términos cada
      uno mayor que $\frac12$.

      ### 4 · Una advertencia sobre el recíproco

      Conviene dejarlo escrito porque es el error gemelo: que el término general
      tienda a cero **no** garantiza la convergencia. La serie armónica
      $\sum\frac1n$ tiene término general tendiendo a 0 y suma infinita.

      La condición sirve para **descartar**, nunca para confirmar.

      ### Resultado

      $$
      \boxed{\;\text{No: la serie } \sum a_n \text{ no es convergente,
      porque } a_n \to 1 \neq 0\;}
      $$

  - id: sucesion-tres-tramos
    titulo: Una sucesión con un pico en medio
    fuente: >-
      Ejercicio 2.7 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2014/2015 4E)

    enunciado: |
      $$
      a_n =
      \begin{cases}
      -\dfrac{1}{n^{2}} & n < 100 \\[6pt]
      n & 100 \le n \le 200 \\[6pt]
      1-\dfrac{1}{n} & n > 200
      \end{cases}
      $$
    pide: Estudiar si es creciente, decreciente, acotada y convergente.

    pasos:
      - tipo: reconocer
        pregunta: |
          El tramo de en medio llega hasta 200 y el último baja a valores
          cercanos a 1. ¿Qué tramo decide la convergencia?
        opciones:
          - texto: Solo el último, porque la convergencia mira únicamente la cola
            correcta: true
            mensaje: |
              Eso es. Los dos primeros tramos afectan a 200 términos, y 200 es
              un número finito: da igual lo que hagan. El límite lo fija
              $1-\frac1n$.
          - texto: El de en medio, porque es donde la sucesión toma los valores más grandes
            mensaje: |
              El tamaño de los términos importa para la **acotación**, no para
              el límite. Que la sucesión llegue a valer 200 no impide que
              después se estabilice en 1.
          - texto: Los tres, ponderando su longitud
            mensaje: |
              El límite no se promedia. Es lo que ocurre «al final», y al final
              solo está el tercer tramo, que además es infinito mientras que los
              otros dos son finitos.
          - texto: "Ninguno: al estar definida a trozos, la sucesión no converge"
            mensaje: |
              Estar definida a trozos no impide converger. Lo que puede romper
              un trozo es la **monotonía**, que sí mira la sucesión entera; la
              convergencia solo mira el final.

      - tipo: calcular
        titulo: El límite
        pregunta: ¿A qué converge la sucesión?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '200'
            mensaje: |
              200 es el valor máximo que alcanza la sucesión, en $n=200$. Es su
              supremo, no su límite: después de ese término la sucesión cae y se
              queda cerca de 1 para siempre.
          - valor: '0'
            mensaje: |
              El primer tramo, $-\frac{1}{n^{2}}$, sí tiende a 0, pero solo vale
              para $n<100$: son 99 términos y luego desaparece. El límite lo
              marca el tramo que vale para todo $n$ grande.
        pista: |
          Quédate solo con el tramo válido para $n$ grande: $1-\frac1n$.
        desarrollo: |
          Para $n > 200$ la sucesión vale $1-\frac1n$, y

          $$
          \lim_{n\to\infty}\left(1-\frac{1}{n}\right) = 1
          $$

          Los tramos anteriores afectan a 200 términos, un número finito, y no
          influyen en el límite.
        veredicto: |
          La sucesión llega a valer 200 y aun así converge a 1. Eso es lo que
          significa que el límite solo mire la cola.

      - tipo: calcular
        titulo: La cota superior
        pregunta: ¿Cuál es el valor más grande que alcanza la sucesión?
        respuesta:
          tipo: numero
          valor: '200'
          tolerancia: 0.5
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es el límite, no el máximo. La sucesión pasa por valores mucho
              mayores antes de estabilizarse: en $n=200$ vale exactamente 200.
          - valor: '100'
            mensaje: |
              En $n=100$ empieza el tramo creciente, pero sigue subiendo hasta
              $n=200$. El máximo está al final de ese tramo, no al principio.
          - valor: '0'
            mensaje: |
              Ese sería el máximo si la sucesión fuera solo el primer tramo,
              donde todos los valores son negativos. El segundo tramo la manda
              muy por encima.
        pista: |
          El segundo tramo es $a_n = n$ con $100 \le n \le 200$: crece hasta el
          final del intervalo.
        desarrollo: |
          - **Primer tramo** ($n<100$): $-\frac{1}{n^{2}}$ toma valores entre
            $-1$ (en $n=1$) y casi 0. Todos negativos.
          - **Segundo tramo** ($100 \le n \le 200$): $a_n = n$, que va de 100 a
            **200**.
          - **Tercer tramo** ($n>200$): $1-\frac1n$, siempre menor que 1.

          El máximo es $a_{200} = 200$ y el mínimo, $a_1 = -1$. Por tanto

          $$
          -1 \le a_n \le 200 \qquad \forall n
          $$

          y la sucesión está **acotada**.
        veredicto: |
          Que exista una cota, por grande que sea, es lo único que pide la
          definición de acotada. No hace falta que sea ajustada.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento sobre el crecimiento. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              Ser creciente exige $a_{n+1} > a_n$ para **todo** $n$, sin
              excepciones.
          - texto: |
              Entre $n=1$ y $n=2$ la sucesión sube: $-1 < -\frac14$. Así que no
              es decreciente.
          - texto: |
              Entre $n=200$ y $n=201$ baja de golpe: de $200$ a
              $1-\frac{1}{201} \approx 0{,}995$. Así que tampoco es creciente.
          - texto: |
              Al fallar las dos condiciones, la sucesión **no es creciente ni
              decreciente**.
          - texto: |
              Como no es creciente, es decreciente.
            trampa: true
            mensaje: |
              «No creciente» y «decreciente» no son lo mismo. Una sucesión puede
              subir en un sitio y bajar en otro, y entonces no es ninguna de las
              dos. Aquí pasa exactamente eso: sube en los dos primeros tramos y
              da un salto hacia abajo en $n=201$.
        veredicto: |
          Para justificar que no es monótona basta **una** pareja de términos
          consecutivos de cada tipo. No hace falta estudiar los tres tramos
          enteros.

    resolucion: |
      **Datos.** Una sucesión definida en tres tramos. Se pide estudiar
      crecimiento, acotación y convergencia.

      **Cómo se ataca una sucesión a trozos.** Las tres preguntas se responden
      con herramientas distintas, y conviene tenerlo claro antes de empezar
      porque cada una mira una parte diferente de la sucesión:

      | pregunta | qué hay que mirar |
      |---|---|
      | ¿monótona? | **todos** los pares consecutivos, y sobre todo los empalmes |
      | ¿acotada? | **todos** los tramos, buscando el mayor y el menor valor |
      | ¿converge? | **solo la cola**: el último tramo |

      La monotonía es la más frágil de las tres: basta un par que falle. Y los
      pares que fallan casi siempre están en los empalmes, porque dentro de cada
      tramo la fórmula suele ser monótona. Por eso se empieza por ahí.

      ### 1 · Crecimiento

      Ser creciente exige $a_{n+1} > a_n$ para **todo** $n$; decreciente, lo
      contrario. Basta un contraejemplo de cada tipo para descartar las dos.

      - **Sube** en $n=1 \to 2$: de $-1$ a $-\frac14$.
      - **Baja** en $n=200 \to 201$: de $200$ a $1-\frac{1}{201} \approx 0{,}995$.

      Luego **no es creciente ni decreciente**. Conviene decirlo así, con las
      dos palabras: «no creciente» por sí solo no descarta que sea decreciente.

      ### 2 · Acotación

      Tramo a tramo:

      | tramo | valores |
      |---|---|
      | $n<100$ | $-\frac{1}{n^{2}}$, entre $-1$ y casi 0 |
      | $100\le n\le 200$ | de 100 a 200 |
      | $n>200$ | $1-\frac1n$, entre $0{,}995$ y 1 |

      El mínimo es $a_1 = -1$ y el máximo $a_{200} = 200$:

      $$
      -1 \le a_n \le 200 \qquad \forall n \in \mathbb{N}
      $$

      La sucesión está **acotada**.

      ### 3 · Convergencia

      La convergencia depende solo de la **cola**. Los dos primeros tramos
      cubren 200 términos —un número finito— y son irrelevantes. Para $n>200$:

      $$
      \lim_{n\to\infty} a_n = \lim_{n\to\infty}\left(1-\frac{1}{n}\right) = 1
      $$

      La sucesión es **convergente con límite 1**.

      ### 4 · Una observación que merece la pena escribir

      Este ejercicio es un contraejemplo vivo de dos confusiones habituales:

      - Una sucesión puede converger **sin ser monótona**. El teorema dice que
        monótona y acotada implica convergente, no al revés.
      - Una sucesión puede alcanzar valores enormes —200— y converger a un
        número pequeño. El tamaño de los términos no dice nada del límite.

      ### 5 · Comprobación

      Las tres respuestas, contrastadas con la definición:

      - **No monótona.** Basta exhibir los dos pares que la rompen, y están
        exhibidos: $a_1 < a_2$ y $a_{200} > a_{201}$.
      - **Acotada.** Las cotas $-1$ y $200$ se alcanzan las dos, en $a_1$ y
        $a_{200}$: son mínimo y máximo, no solo ínfimo y supremo.
      - **Límite 1.** Con $\varepsilon = 10^{-3}$ hace falta
        $\left|1-\frac1n-1\right| = \frac1n < 10^{-3}$, es decir $n>1000$. Como
        $1000 > 200$, la condición cae de lleno en el tercer tramo y no hay que
        preocuparse por los otros dos.

      Esa última comprobación es la que conviene escribir en un examen: enseña
      que se ha entendido que la cola es lo único que interviene.

      ### Resultado

      $$
      \boxed{\;\text{Ni creciente ni decreciente. Acotada: }
      -1 \le a_n \le 200. \text{ Convergente con } L=1\;}
      $$

  - id: alternante-frente-a-salto
    titulo: Alternar infinitas veces o cambiar una sola vez
    fuente: >-
      Ejercicio 2.8 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2016/2017 3E)

    enunciado: |
      $$
      a_n = \begin{cases} 2+\dfrac{1}{n} & n \text{ impar} \\[6pt]
      -2-\dfrac{1}{n} & n \text{ par} \end{cases}
      \qquad
      b_n = \begin{cases} 2+\dfrac{1}{n} & n < 50 \\[6pt]
      -2-\dfrac{1}{n} & n \ge 50 \end{cases}
      $$
    pide: >-
      Definir el concepto de convergencia y estudiar, de forma argumentada, la
      convergencia de las dos sucesiones.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos sucesiones usan las mismas dos fórmulas. ¿Qué las diferencia?
        opciones:
          - texto: >-
              Que $a_n$ cambia de fórmula **infinitas** veces y $b_n$ solo una
            correcta: true
            mensaje: |
              Ese es todo el ejercicio. $a_n$ salta de una rama a otra en cada
              término, para siempre; $b_n$ salta una única vez, en $n=50$, y a
              partir de ahí se queda en una sola rama. Lo primero impide
              converger; lo segundo no.
          - texto: Que $b_n$ tiene términos negativos y $a_n$ no
            mensaje: |
              Las dos tienen términos de los dos signos: $a_n$ es negativa en
              los pares y positiva en los impares. La diferencia no está en los
              valores, está en el patrón.
          - texto: Que $a_n$ está acotada y $b_n$ no
            mensaje: |
              Las dos están acotadas, entre $-3$ y $3$ aproximadamente. Y eso
              confirma que la acotación no basta para converger.
          - texto: Que $b_n$ tiene un número finito de términos
            mensaje: |
              Las dos son infinitas. Lo que es finito en $b_n$ es el número de
              términos **de la primera rama**: 49. A partir de ahí queda
              infinita cola de la segunda.

      - tipo: calcular
        titulo: El límite de la segunda
        pregunta: ¿A qué converge $b_n$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Ese es el valor al que se acercaría la **primera** rama, la que
              solo vale para $n<50$: 49 términos, un número finito. La cola es
              la otra.
          - valor: '0'
            mensaje: |
              La sucesión no se acerca a 0 en ningún momento: sus valores están
              cerca de $2$ al principio y cerca de $-2$ después. No hay ningún
              tramo donde ronde el cero.
          - valor: '50'
            mensaje: |
              El 50 es dónde cambia de rama, no a qué valor tiende.
        pista: |
          Para $n \ge 50$ la sucesión vale $-2-\frac1n$ y ya no vuelve a cambiar.
        desarrollo: |
          A partir de $n = 50$ la sucesión es siempre $-2-\frac{1}{n}$, y

          $$
          \lim_{n\to\infty}\left(-2-\frac{1}{n}\right) = -2
          $$

          Los 49 primeros términos no influyen: son un número finito.
        veredicto: |
          $b_n$ converge a $-2$ **aunque empiece valiendo 3**. Otra vez: la
          cola manda.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento de por qué $a_n$ no converge. Una de las piezas
          no debe entrar.
        piezas:
          - texto: |
              Convergir a $L$ significa que, fijado cualquier $\varepsilon>0$,
              **todos** los términos a partir de un momento distan de $L$ menos
              que $\varepsilon$.
          - texto: |
              Los términos impares de $a_n$ están siempre por encima de 2, y los
              pares siempre por debajo de $-2$.
          - texto: |
              Sea cual sea el candidato $L$, tomando
              $\varepsilon = 1$ es imposible que los términos impares y los
              pares estén a la vez a distancia menor que 1 de $L$: están
              separados más de 4.
          - texto: |
              Por muy grande que se tome $m$, siempre quedan términos de los dos
              tipos después: nunca se cumple la condición. Luego $a_n$ no
              converge.
          - texto: |
              Como $a_n$ está acotada entre $-3$ y $3$, converge.
            trampa: true
            mensaje: |
              Estar acotada no basta. El teorema pide **monótona y acotada**, y
              $a_n$ no es monótona ni de lejos: sube y baja en cada término.
              Este ejercicio y el apartado (iv) del 2.12 insisten en lo mismo,
              porque es la confusión más repetida del tema.
        veredicto: |
          La diferencia entre las dos sucesiones no es de valores, es de
          **estructura**: una alterna para siempre y la otra se decide de una
          vez.

    resolucion: |
      **Datos.** Dos sucesiones construidas con las mismas dos expresiones,
      repartidas de forma distinta.

      ### 1 · La definición, que el enunciado pide explícitamente

      $$
      \lim_{n\to\infty} a_n = L
      \iff
      \forall \varepsilon>0 \;\exists\, m\in\mathbb{N}:\;
      n>m \Rightarrow |a_n - L| < \varepsilon
      $$

      Lo importante para este ejercicio son dos palabras: **todos** los términos
      a partir de $m$, y **para cualquier** $\varepsilon$.

      ### 2 · La sucesión $a_n$ no converge

      Sus términos impares valen $2+\frac1n > 2$ y los pares $-2-\frac1n < -2$:
      dos grupos infinitos separados por una distancia mayor que 4.

      Sea cual sea el candidato $L$, se toma $\varepsilon = 1$. Para que la
      definición se cumpliera, a partir de cierto $m$ todos los términos
      deberían estar en el intervalo $(L-1, L+1)$, que mide 2. Pero después de
      cualquier $m$ siguen apareciendo términos por encima de 2 **y** por debajo
      de $-2$, y no caben los dos en un intervalo de longitud 2.

      Luego **$a_n$ no es convergente**.

      Nótese que sí está acotada: $-3 \le a_n \le 3$. Acotada y no convergente:
      el recíproco del teorema es falso.

      ### 3 · La sucesión $b_n$ sí converge

      Aquí el cambio de rama ocurre **una sola vez**. Para todo $n \ge 50$,

      $$
      b_n = -2-\frac{1}{n}
      $$

      y por tanto

      $$
      \lim_{n\to\infty} b_n = -2
      $$

      Los 49 primeros términos —que van de $b_1 = 3$ bajando hacia
      $b_{49} = 2+\frac{1}{49} \approx 2{,}02$, todos por encima de 2— son un
      número finito y no afectan al límite. Da igual cuántos sean y cuánto
      valgan: mientras sean finitos, la cola manda.

      ### 4 · La comparación, que es la lección

      Las dos sucesiones toman valores casi idénticos; lo que cambia es **cuándo**
      los toman. Una alterna infinitas veces y no puede estabilizarse; la otra
      cambia una vez y a partir de ahí ya solo hace una cosa.

      Convergir no es «tomar valores pequeños» ni «estar acotada»: es
      **estabilizarse**.

      ### 5 · Comprobación

      **Para $b_n$**, con $\varepsilon = 10^{-2}$:

      $
      \left|b_n - (-2)\right| = \left|-2-\frac1n+2\right| = \frac1n < 10^{-2}
      \;\Longleftrightarrow\; n > 100
      $

      Sirve $m = 100$, que además es mayor que 50: la condición cae de lleno en
      la segunda rama, como tenía que ser.

      **Para $a_n$**, la comprobación es al revés: hay que ver que **ningún**
      $L$ vale. Con $\varepsilon = 1$, si existiera ese $m$, tomando un índice
      par $n>m$ y uno impar $n'>m$ se tendría

      $
      \left|a_n - a_{n'}\right| \le |a_n - L| + |L - a_{n'}| < 1 + 1 = 2
      $

      pero $\left|a_n - a_{n'}\right| > 4$. Contradicción **sin necesidad de
      saber cuánto vale $L$**, que es lo elegante del argumento: se descarta la
      convergencia sin buscar candidato.

      ### Resultado

      $$
      \boxed{\;\{a_n\} \text{ no converge}; \qquad
      \{b_n\} \text{ converge con } L = -2\;}
      $$

  - id: cubo-y-luego-cinco
    titulo: De crecer como un cubo a estabilizarse en cinco
    fuente: >-
      Ejercicio 2.9 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2018/2019 5E)

    enunciado: |
      $$
      \{a_n\}_{n\in\mathbb{N}} =
      \begin{cases}
      5-\dfrac{2}{n} & n \ge 100 \\[6pt]
      n^{3} & n < 100
      \end{cases}
      $$
    pide: >-
      Definir formalmente sucesión creciente y sucesión convergente, y estudiar
      el crecimiento y la convergencia de $\{a_n\}$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que mirar para decidir si es creciente?
        opciones:
          - texto: >-
              Los dos tramos por dentro **y** el salto entre ellos
            correcta: true
            mensaje: |
              Eso es. Dentro de cada tramo puede crecer perfectamente y aun así
              fallar en el punto de empalme, que es justo lo que pasa aquí: se
              pasa de $99^{3}$ a menos de 5.
          - texto: Solo el tramo que vale para $n$ grande
            mensaje: |
              Eso vale para la **convergencia**, no para el crecimiento. Ser
              creciente exige $a_{n+1}>a_n$ para todo $n$, incluidos los
              primeros y el punto donde cambia la fórmula.
          - texto: Solo los primeros términos
            mensaje: |
              Los primeros términos pueden crecer y la sucesión no ser
              creciente. La definición pide **todos** los pares consecutivos.
          - texto: "Basta calcular el límite: si converge, es monótona"
            mensaje: |
              Converger no implica ser monótona. $\frac{(-1)^{n}}{n}$ converge a
              0 dando saltos de signo, y esta sucesión converge dando un salto
              gigantesco hacia abajo.

      - tipo: calcular
        titulo: El tamaño del salto
        pregunta: |
          ¿Cuánto vale $a_{99}$, el último término del primer tramo?
        respuesta:
          tipo: numero
          valor: '970299'
          tolerancia: 1
          formato: un número
        distractores:
          - valor: '4.98'
            mensaje: |
              Ese es $a_{100} = 5-\frac{2}{100}$, el **primer** término del otro
              tramo. El 99 todavía pertenece al tramo $n^{3}$.
          - valor: '297'
            mensaje: |
              Has multiplicado por 3 en vez de elevar al cubo: $99 \cdot 3$. El
              tramo es $n^{3}$.
          - valor: '9801'
            mensaje: |
              Ese es $99^{2}$. Falta multiplicar una vez más por 99.
        pista: |
          Para $n<100$ la sucesión vale $n^{3}$, así que $a_{99} = 99^{3}$.
        desarrollo: |
          $$
          a_{99} = 99^{3} = 970\,299
          $$

          y el término siguiente pertenece ya al otro tramo:

          $$
          a_{100} = 5 - \frac{2}{100} = 4{,}98
          $$

          El salto es de casi un millón hacia abajo.
        veredicto: |
          Ese salto es el que rompe el crecimiento. Todo lo demás de la sucesión
          sube.

      - tipo: justificar
        pregunta: |
          Ordena el estudio completo. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Definiciones.** Creciente: $a_{n+1} > a_n$ para todo
              $n \in \mathbb{N}$. Convergente a $L$: para todo $\varepsilon>0$
              existe $m$ tal que $|a_n - L| < \varepsilon$ si $n>m$.
          - texto: |
              Dentro de cada tramo la sucesión crece: $n^{3}$ es creciente, y
              $5-\frac2n$ también, porque lo que se resta se hace más pequeño.
          - texto: |
              Pero en el empalme baja: $a_{99} = 970\,299$ y
              $a_{100} = 4{,}98$. Como falla un solo par consecutivo, **no es
              creciente**.
          - texto: |
              La convergencia solo mira la cola: para $n \ge 100$ la sucesión es
              $5-\frac2n$, que tiende a **5**.
          - texto: |
              Como no es creciente y no está acotada superiormente por el primer
              tramo, no puede converger.
            trampa: true
            mensaje: |
              Dos errores en una frase. El primero: no ser creciente no impide
              converger —el teorema de la monotonía es una condición
              **suficiente**, no necesaria—. El segundo: el primer tramo tiene
              99 términos, así que la sucesión sí está acotada, por
              $970\,299$. Y aunque no lo estuviera en esos 99, la convergencia
              seguiría dependiendo solo de la cola.
        veredicto: |
          No creciente y convergente a la vez. Los dos conceptos miran cosas
          distintas: uno la sucesión entera, el otro solo el final.

    resolucion: |
      **Datos.** Una sucesión que crece como $n^{3}$ hasta $n=99$ y a partir de
      $n=100$ vale $5-\frac{2}{n}$.

      ### 1 · Las definiciones que pide el apartado (a)

      **Creciente:**

      $$
      \{a_n\} \text{ es creciente} \iff a_{n+1} > a_n \quad \forall n \in \mathbb{N}
      $$

      **Convergente:**

      $$
      \lim_{n\to\infty} a_n = L \iff
      \forall\varepsilon>0\;\exists\, m\in\mathbb{N}:\; n>m \Rightarrow |a_n-L|<\varepsilon
      $$

      Merece la pena subrayar el contraste, porque es de lo que va el apartado
      (b): la primera exige algo de **todos** los términos; la segunda, solo de
      los que hay a partir de cierto punto.

      ### 2 · Crecimiento

      Dentro de cada tramo la sucesión crece:

      - $n^{3}$ es creciente para $n \ge 1$;
      - $5-\frac{2}{n}$ también, porque al aumentar $n$ se resta cada vez menos.

      Pero en el empalme se desploma:

      $$
      a_{99} = 99^{3} = 970\,299, \qquad a_{100} = 5-\frac{2}{100} = 4{,}98
      $$

      Un solo par consecutivo que incumple $a_{n+1}>a_n$ basta para que **no sea
      creciente**. Tampoco es decreciente, porque sube en todo lo demás.

      ### 3 · Convergencia

      Solo cuenta la cola. Para $n\ge 100$:

      $$
      \lim_{n\to\infty}\left(5-\frac{2}{n}\right) = 5
      $$

      La sucesión es **convergente con límite 5**.

      ### 4 · Por qué las dos cosas son compatibles

      El teorema «monótona y acotada $\Rightarrow$ convergente» es una condición
      **suficiente**, no necesaria. Hay sucesiones convergentes que no son
      monótonas, y esta es una: converge a 5 después de dar un salto de casi un
      millón hacia abajo.

      ### 5 · Comprobación

      Con $\varepsilon = 0{,}01$: hace falta
      $\left|5-\frac2n-5\right| = \frac2n < 0{,}01$, es decir $n > 200$. En
      efecto, a partir de $n=201$ todos los términos están a menos de una
      centésima de 5.

      ### Resultado

      $$
      \boxed{\;\text{No creciente (ni decreciente). Convergente con } L = 5\;}
      $$

  - id: parametros-supremo-infimo
    titulo: Dos parámetros a partir del supremo y el ínfimo
    fuente: >-
      Ejercicio 2.10 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2018/2019 7E)

    enunciado: |
      Dados $a, b \in \mathbb{R}$, se considera la sucesión

      $$
      x_n = \begin{cases} -\dfrac{a}{n} & n < 10 \\[6pt]
      b\,(-1)^{n} & n \ge 10 \end{cases}
      $$

      Se sabe que $M=3$ es el supremo, $m=-2$ el ínfimo, y que
      $|x_{10}-x_{9}| = \dfrac{7}{3}$.
    pide: >-
      Determinar $a$ y $b$, y estudiar el crecimiento y la convergencia de la
      sucesión.

    pasos:
      - tipo: reconocer
        pregunta: |
          Tres datos y dos incógnitas. ¿Cuál conviene usar primero?
        opciones:
          - texto: >-
              El ínfimo, porque el segundo tramo solo puede tomar dos valores:
              $b$ y $-b$
            correcta: true
            mensaje: |
              Eso es. Para $n\ge 10$ la sucesión solo alterna entre $b$ y $-b$,
              y el primer tramo es finito. El ínfimo $-2$ tiene que salir de
              alguno de esos dos valores, y eso fija $|b| = 2$ casi de
              inmediato.
          - texto: La condición $|x_{10}-x_9| = \frac73$, porque es la más concreta
            mensaje: |
              Es útil, pero mezcla las dos incógnitas en una sola ecuación con
              valor absoluto: sale más largo. Conviene dejarla para confirmar,
              o para desempatar el signo.
          - texto: Calcular el límite, que fijará los dos parámetros
            mensaje: |
              La sucesión no converge para ningún valor de $b\ne0$: alterna para
              siempre entre $b$ y $-b$. No hay límite del que tirar.
          - texto: Derivar respecto de $n$ para ver dónde está el máximo
            mensaje: |
              Una sucesión no se deriva: su variable es un número natural, no
              continua. Los extremos se buscan mirando los valores que toma.

      - tipo: calcular
        titulo: El primer parámetro
        pregunta: |
          El supremo es 3. ¿Cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '-3'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              Signo cambiado. El primer tramo es $-\frac{a}{n}$, con un menos
              delante: para que $x_1$ valga $+3$ hace falta $a=-3$. Con $a=3$
              todos los términos serían negativos y el supremo no podría ser 3.
          - valor: '0.333'
            mensaje: |
              Ese es $x_9 = \frac13$, el **último** término del primer tramo. El
              supremo es el primero, $x_1$, porque ese tramo decrece.
          - valor: '2'
            mensaje: |
              El 2 sale del ínfimo, que fija $|b|$, no $a$. El supremo 3 es el
              que determina el primer parámetro.
        pista: |
          El mayor valor del primer tramo está en $n=1$: $x_1 = -a$. Y el
          supremo es 3.
        desarrollo: |
          En el tramo $x_n = -\frac{a}{n}$ el mayor valor —si $a<0$— es el de
          $n=1$:

          $$
          x_1 = -a = 3 \;\Longrightarrow\; a = -3
          $$

          El primer tramo queda $x_n = \frac{3}{n}$: nueve términos que van de 3
          a $\frac13$.
        veredicto: |
          El supremo se alcanza en el primer término, así que aquí es máximo
          además de supremo.

      - tipo: calcular
        titulo: El segundo parámetro
        pregunta: |
          Con el ínfimo $-2$ y el salto $|x_{10}-x_9| = \frac73$, ¿cuánto vale
          $b$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              El ínfimo solo fija $|b| = 2$: los dos signos dan los mismos dos
              valores, $2$ y $-2$. Lo que desempata es el salto: con $b=2$
              saldría $\left|2-\frac13\right| = \frac53$, y hace falta
              $\frac73$.
          - valor: '-3'
            mensaje: |
              Ese es el valor de $a$. El segundo tramo alterna entre $b$ y $-b$,
              y su valor más pequeño es $-|b| = -2$.
          - valor: '2.333'
            mensaje: |
              $\frac73$ es el tamaño del salto entre $x_9$ y $x_{10}$, no el
              valor de $b$. Hay que despejarlo de
              $\left|b-\frac13\right| = \frac73$.
        pista: |
          $x_9 = \frac13$ y $x_{10} = b\,(-1)^{10} = b$. Prueba los dos signos
          en $\left|b-\frac13\right| = \frac73$.
        desarrollo: |
          El ínfimo da $|b| = 2$, porque para $n\ge10$ los valores son $b$ y
          $-b$ y el menor es $-|b|$.

          Para el signo, el salto. Con $x_9 = \frac13$ y $x_{10} = b$:

          $$
          \left|b - \frac13\right| = \frac73
          $$

          Con $b=2$: $\left|2-\frac13\right| = \frac53$ ✗

          Con $b=-2$: $\left|-2-\frac13\right| = \frac73$ ✔

          Luego $b = -2$.
        veredicto: |
          Ninguno de los tres datos sobra: el supremo da $a$, el ínfimo da
          $|b|$, y el salto desempata su signo.

      - tipo: justificar
        pregunta: |
          Ordena el estudio del crecimiento y la convergencia. Una de las piezas
          no debe entrar.
        piezas:
          - texto: |
              Con $a=-3$ y $b=-2$, la sucesión es $\frac3n$ para $n<10$ y
              alterna entre $-2$ y $2$ para $n \ge 10$.
          - texto: |
              El primer tramo **decrece**: $3,\ \frac32,\ 1,\ \dots,\ \frac13$.
          - texto: |
              El segundo tramo alterna: sube de $-2$ a $2$ y baja de $2$ a
              $-2$, infinitas veces.
          - texto: |
              Al haber tramos que suben y tramos que bajan, la sucesión no es
              creciente ni decreciente; y al alternar para siempre entre dos
              valores distintos, tampoco converge.
          - texto: |
              Como la sucesión está acotada entre $-2$ y $3$, converge a algún
              punto intermedio.
            trampa: true
            mensaje: |
              Estar acotada no basta, y «algún punto intermedio» no es un
              argumento. Los términos se quedan pegados a $-2$ y a $2$
              alternativamente, sin acercarse a nada: no hay ningún valor del
              que disten cada vez menos.
        veredicto: |
          Ni creciente, ni decreciente, ni convergente. Los tres «no» son la
          respuesta del apartado (b).

    resolucion: |
      **Datos.** $x_n = -\frac{a}{n}$ si $n<10$ y $x_n = b(-1)^{n}$ si
      $n \ge 10$, con supremo 3, ínfimo $-2$ y $|x_{10}-x_9| = \frac73$.

      **La estrategia.** Hay dos incógnitas y tres datos, así que el problema
      está sobredeterminado: sobra información. Eso no es un descuido del
      enunciado, es la estructura del ejercicio, y la forma de resolverlo es
      **repartir los datos**, no plantear un sistema.

      El reparto sale de mirar qué puede producir cada cosa. El supremo y el
      ínfimo son valores extremos, y cada tramo solo puede aportar uno de los
      dos: el primero es monótono y su extremo está en $n=1$; el segundo solo
      toma dos valores, $b$ y $-b$. Identificar **de qué tramo viene cada
      extremo** es el paso que decide el ejercicio; lo demás es despejar.

      El tercer dato, el salto, no da un valor nuevo: **desempata un signo** que
      los otros dos dejan indeterminado. Conviene verlo desde el principio para
      no buscarle otra utilidad.

      ### 1 · El supremo fija $a$

      El segundo tramo solo toma los valores $b$ y $-b$. Si el supremo es 3 y
      $|b|$ resultara ser 3, el ínfimo sería $-3$ y no $-2$. Así que el 3 tiene
      que venir del primer tramo.

      En ese tramo, $x_n = -\frac{a}{n}$. Para que tome valores positivos hace
      falta $a<0$, y entonces el mayor es el de $n=1$:

      $$
      x_1 = -a = 3 \;\Longrightarrow\; a = -3
      $$

      El primer tramo queda $x_n = \frac{3}{n}$: nueve términos que van de 3 a
      $\frac13$.

      ### 2 · El ínfimo fija $|b|$

      Para $n\ge10$ los valores son $b$ y $-b$, y el menor es $-|b|$. Como el
      primer tramo es todo positivo, el ínfimo tiene que salir de aquí:

      $$
      -|b| = -2 \;\Longrightarrow\; |b| = 2
      $$

      ### 3 · El salto desempata el signo

      $$
      x_9 = \frac{3}{9} = \frac13, \qquad x_{10} = b\,(-1)^{10} = b
      $$

      $$
      |x_{10}-x_9| = \left|b-\frac13\right| = \frac73
      $$

      Con $b=2$: $\left|2-\frac13\right| = \frac53 \neq \frac73$ ✗

      Con $b=-2$: $\left|-2-\frac13\right| = \frac73$ ✔

      Luego $b = -2$.

      ### 4 · Crecimiento y convergencia

      La sucesión es $3,\ \frac32,\ 1,\ \frac34,\ \dots,\ \frac13$ y a partir de
      $n=10$ alterna $-2,\ 2,\ -2,\ 2,\dots$

      - **No es creciente:** decrece en todo el primer tramo.
      - **No es decreciente:** sube de $-2$ a $2$ infinitas veces.
      - **No converge:** los términos se quedan pegados a $-2$ y a $2$
        alternativamente. Con $\varepsilon=1$, ningún valor $L$ puede tener a
        la vez cerca a los dos.

      Está acotada —entre $-2$ y 3— y aun así no converge: otro recordatorio de
      que la acotación por sí sola no basta.

      ### 5 · Comprobación

      Con $a=-3$ y $b=-2$ se reconstruye la sucesión y se contrastan los tres
      datos del enunciado, que es la única forma de saber que no se ha colado un
      signo:

      $
      x_1,\dots,x_9 = 3,\ \tfrac32,\ 1,\ \tfrac34,\ \tfrac35,\ \tfrac12,\
      \tfrac37,\ \tfrac38,\ \tfrac13
      \qquad
      x_{10},x_{11},\dots = -2,\ 2,\ -2,\ 2,\dots
      $

      - **Supremo 3** ✔ — es $x_1$, y ningún término del segundo tramo pasa de 2.
      - **Ínfimo $-2$** ✔ — el primer tramo es todo positivo, así que solo puede
        venir del segundo.
      - **Salto $\frac73$** ✔ — $\left|-2 - \frac13\right| = \frac73$.

      Los tres datos son necesarios: sin el del salto quedarían dos soluciones,
      $b=2$ y $b=-2$, y solo una da el salto que pide el enunciado.

      ### Resultado

      $$
      \boxed{\;a=-3,\quad b=-2;\quad \text{ni creciente, ni decreciente, ni convergente}\;}
      $$

  - id: decreciente-y-serie
    titulo: Una sucesión decreciente y la serie que forma
    fuente: >-
      Ejercicio 2.11 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2019/2020 4E)

    enunciado: |
      $$
      \{a_n\}_{n\in\mathbb{N}} =
      \begin{cases}
      4+\dfrac{1}{n} & n < 10 \\[6pt]
      \left(\dfrac{2}{3}\right)^{n} & n \ge 10
      \end{cases}
      $$
    pide: >-
      Estudiar el crecimiento, el supremo, el ínfimo y la convergencia, y
      decidir si la serie $\sum_{n=1}^{\infty} a_n$ converge.

    pasos:
      - tipo: reconocer
        pregunta: |
          El primer tramo vale algo más de 4 y el segundo, para $n=10$, vale
          $0{,}017$. ¿Rompe eso la monotonía?
        opciones:
          - texto: >-
              No: el salto va **hacia abajo**, y el primer tramo también bajaba
            correcta: true
            mensaje: |
              Exacto. Aquí el salto empuja en la misma dirección que los dos
              tramos, así que la sucesión decrece de principio a fin. Es lo
              contrario de lo que pasaba en el 2.9, donde el salto iba al revés
              que los tramos.
          - texto: "Sí: cualquier salto entre dos tramos rompe la monotonía"
            mensaje: |
              Solo la rompe si va en dirección contraria. Un salto hacia abajo
              dentro de una sucesión que ya venía bajando la mantiene
              decreciente.
          - texto: Sí, porque el segundo tramo tiende a 0 y el primero a 4
            mensaje: |
              El primer tramo no «tiende» a nada: son nueve términos. Y que los
              valores caigan de 4 a casi 0 es justamente ir hacia abajo, que es
              lo que hace falta para decrecer.
          - texto: No se puede saber sin calcular los infinitos términos
            mensaje: |
              Sí se puede: basta comprobar que cada tramo decrece por separado y
              que el salto entre ellos también baja. Son tres comprobaciones,
              no infinitas.

      - tipo: calcular
        titulo: El supremo
        pregunta: ¿Cuál es el supremo de la sucesión?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              4 es el valor al que se acercaría el primer tramo si continuara,
              pero el mayor término es el **primero**: $a_1 = 4+\frac11 = 5$.
              Como la sucesión decrece, el supremo es su primer término.
          - valor: '0'
            mensaje: |
              0 es el ínfimo, no el supremo: es el valor al que tiende, por
              debajo de todos los términos.
          - valor: '0.0173'
            mensaje: |
              Ese es $\left(\frac23\right)^{10}$, el primer término del segundo
              tramo. Es de los más pequeños, no el mayor.
        pista: |
          La sucesión decrece, así que el supremo es su primer término:
          $a_1 = 4+\frac{1}{1}$.
        desarrollo: |
          Al ser decreciente, el mayor valor es el primero:

          $$
          a_1 = 4 + \frac{1}{1} = 5
          $$

          y como se alcanza, es máximo además de supremo.

          El ínfimo es 0: los términos $\left(\frac23\right)^{n}$ se acercan a 0
          tanto como se quiera sin llegar nunca, así que 0 es la mayor de las
          cotas inferiores y **no** es mínimo.
        veredicto: |
          Supremo 5, que sí se alcanza; ínfimo 0, que no. Esa distinción es lo
          que separa supremo de máximo.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento sobre la serie del apartado (c). Una de las
          piezas no debe entrar.
        piezas:
          - texto: |
              La serie se parte en dos: los nueve primeros términos y la cola
              desde $n=10$.
          - texto: |
              La suma de los nueve primeros es un número finito, así que no
              puede impedir la convergencia.
          - texto: |
              La cola es $\sum_{n\ge10}\left(\frac23\right)^{n}$, una serie
              geométrica de razón $r=\frac23$.
          - texto: |
              Como $|r| = \frac23 < 1$, esa geométrica converge, y por tanto la
              serie completa también.
          - texto: |
              Como $a_n \to 0$, la serie converge.
            trampa: true
            mensaje: |
              Que el término general tienda a 0 es **necesario**, no suficiente.
              La serie armónica $\sum\frac1n$ tiene término general tendiendo a
              0 y suma infinita. Aquí la serie sí converge, pero por ser
              geométrica de razón menor que 1, no por el límite del término
              general.
        veredicto: |
          La misma condición que en el 2.15 cerraba el ejercicio en una línea
          aquí no sirve para nada: allí se usaba para **descartar**, que es lo
          único que permite.

    resolucion: |
      **Datos.** Una sucesión que vale $4+\frac1n$ en sus nueve primeros
      términos y $\left(\frac23\right)^{n}$ a partir del décimo.

      ### 1 · Las definiciones que pide el apartado (a)

      - **Creciente:** $a_{n+1} > a_n$ para todo $n$. **Decreciente:** al revés.
      - **Supremo:** la menor de las cotas superiores. **Ínfimo:** la mayor de
        las cotas inferiores.
      - **Convergente a $L$:** para todo $\varepsilon>0$ existe $m$ tal que
        $|a_n-L|<\varepsilon$ si $n>m$.

      ### 2 · Crecimiento

      Tres comprobaciones:

      - **Primer tramo:** $4+\frac1n$ decrece, porque lo que se suma es cada vez
        menor: $5,\ 4{,}5,\ 4{,}33,\ \dots,\ 4{,}11$.
      - **El salto:** $a_9 = 4{,}11$ y
        $a_{10} = \left(\frac23\right)^{10} \approx 0{,}017$. Baja.
      - **Segundo tramo:** $\left(\frac23\right)^{n}$ decrece, porque la razón
        está entre 0 y 1.

      Los tres van hacia abajo, así que la sucesión es **decreciente** en todo
      su recorrido. Conviene compararlo con el ejercicio 2.9: allí el salto iba
      en contra de los tramos y rompía la monotonía; aquí va a favor y la
      conserva.

      ### 3 · Supremo, ínfimo y límite

      Al ser decreciente, el supremo es el primer término:

      $$
      \sup = a_1 = 4+1 = 5 \qquad (\text{y es máximo, porque se alcanza})
      $$

      Los términos se acercan a 0 sin alcanzarlo, luego

      $$
      \inf = 0 \qquad (\text{no es mínimo})
      $$

      $$
      \lim_{n\to\infty} a_n = \lim_{n\to\infty}\left(\frac{2}{3}\right)^{n} = 0
      $$

      porque una potencia de base entre 0 y 1 tiende a cero. La sucesión es
      **convergente con límite 0**, cosa que también garantizaba el teorema:
      decreciente y acotada inferiormente.

      ### 4 · La serie

      Se parte en dos trozos:

      $$
      \sum_{n=1}^{\infty} a_n
        = \underbrace{\sum_{n=1}^{9}\left(4+\frac1n\right)}_{\text{finita}}
        + \sum_{n=10}^{\infty}\left(\frac{2}{3}\right)^{n}
      $$

      La primera parte es una suma de nueve números: finita, y por tanto
      irrelevante para la convergencia.

      La segunda es una **serie geométrica** de razón $r=\frac23$, con
      $|r|<1$, así que converge. Su valor es

      $$
      \sum_{n=10}^{\infty}\left(\frac23\right)^{n}
        = \frac{\left(\frac23\right)^{10}}{1-\frac23}
        = 3\left(\frac{2}{3}\right)^{10} \approx 0{,}052
      $$

      Luego **la serie converge**.

      ### Resultado

      $$
      \boxed{\;\text{Decreciente};\; \sup = 5,\; \inf = 0,\; L = 0;\;
      \text{la serie converge}\;}
      $$

  - id: serie-geometrica
    titulo: La serie geométrica, y cómo empezar a sumar más tarde
    fuente: >-
      Ejercicio 2.13 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2017/2018 3E) · El boletín remite al libro para la demostración del
      apartado (a): la que aquí se da es propuesta nuestra, pendiente de
      revisión.

    enunciado: |
      Demostrar que el límite de la serie geométrica
      $\sum_{n=0}^{\infty} r^{n}$ es $\dfrac{1}{1-r}$ y, como aplicación,
      obtener el valor de $\sum_{n=3}^{\infty} r^{n}$.
    pide: Demostrar la fórmula y calcular la suma que empieza en $n=3$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se demuestra el valor de una serie?
        opciones:
          - texto: >-
              Calculando la suma parcial $S_N$ en forma cerrada y tomando el
              límite
            correcta: true
            mensaje: |
              Eso es. Una serie **es** el límite de sus sumas parciales, así que
              demostrar su valor consiste en encontrar una fórmula cerrada para
              $S_N$ y hacer $N\to\infty$.
          - texto: Sumando términos hasta que el resultado se estabilice
            mensaje: |
              Eso sugiere el valor pero no lo demuestra: por muchos términos que
              sumes, siempre te queda una cola infinita sin sumar.
          - texto: Aplicando la condición necesaria, $r^{n}\to0$
            mensaje: |
              Esa condición dice cuándo la serie **puede** converger, no cuánto
              vale. Y aquí se pide el valor exacto.
          - texto: Derivando la expresión respecto de $r$
            mensaje: |
              Derivar respecto de $r$ es un truco útil para otras series, pero
              presupone que ya conoces la suma. Aquí es justo lo que hay que
              demostrar.

      - tipo: calcular
        titulo: La suma desde n = 3
        pregunta: |
          Con $r = \frac12$, ¿cuánto vale $\sum_{n=3}^{\infty} r^{n}$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Esa es la suma completa desde $n=0$: $\frac{1}{1-1/2} = 2$. Faltan
              por descontar los tres primeros términos, que suman
              $1+\frac12+\frac14 = 1{,}75$.
          - valor: '0.125'
            mensaje: |
              Ese es solo el primer término de la suma,
              $\left(\frac12\right)^{3}$. La cola infinita que le sigue aporta
              otro tanto.
          - valor: '1.75'
            mensaje: |
              Esa es la suma de los tres términos que hay que **quitar**, no la
              que queda. Réstala del total: $2 - 1{,}75 = 0{,}25$.
        pista: |
          $\sum_{n=3}^{\infty} r^{n} = \dfrac{r^{3}}{1-r}$. Con $r=\frac12$,
          $r^{3} = \frac18$.
        desarrollo: |
          Sacando factor común $r^{3}$:

          $$
          \sum_{n=3}^{\infty} r^{n} = r^{3}\sum_{k=0}^{\infty} r^{k}
            = \frac{r^{3}}{1-r}
          $$

          Con $r = \frac12$:

          $$
          \frac{(1/2)^{3}}{1-1/2} = \frac{1/8}{1/2} = \frac{1}{4} = 0{,}25
          $$

          Se puede comprobar restando: $2 - \left(1+\frac12+\frac14\right)
          = 2 - 1{,}75 = 0{,}25$ ✔
        veredicto: |
          Empezar a sumar más tarde no cambia la razón, solo multiplica por el
          primer término que sí entra. Por eso la fórmula general es
          $\frac{\text{primer término}}{1-r}$.

      - tipo: justificar
        pregunta: |
          Ordena la demostración de la fórmula. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              Se llama $S_N = 1 + r + r^{2} + \dots + r^{N}$ a la suma parcial
              $N$-ésima.
          - texto: |
              Se multiplica por $r$ y se resta:
              $S_N - rS_N = 1 - r^{N+1}$, porque todos los términos
              intermedios se cancelan.
          - texto: |
              Si $r \neq 1$ se puede despejar:
              $S_N = \dfrac{1-r^{N+1}}{1-r}$.
          - texto: |
              Si $|r|<1$, entonces $r^{N+1} \to 0$, y por tanto
              $S_N \to \dfrac{1}{1-r}$.
          - texto: |
              La fórmula vale para todo $r$, porque el álgebra no impone
              restricciones.
            trampa: true
            mensaje: |
              El álgebra impone dos: hace falta $r \neq 1$ para poder despejar,
              y hace falta $|r|<1$ para que $r^{N+1}$ tienda a cero. Sin la
              segunda la serie no converge: con $r=2$ la fórmula daría
              $\frac{1}{1-2} = -1$ para una suma de términos positivos, que es
              absurdo.
        veredicto: |
          Escribir la condición $|r|<1$ no es un formalismo: sin ella la fórmula
          devuelve resultados imposibles, como una suma de positivos que sale
          negativa.

    resolucion: |
      > **Aviso.** El boletín remite al libro para la demostración del apartado
      > (a). Lo que sigue es una demostración propuesta, pendiente de revisión.

      ### 1 · Qué hay que demostrar

      Una serie es, por definición, el límite de sus sumas parciales:

      $$
      \sum_{n=0}^{\infty} r^{n} = \lim_{N\to\infty} S_N,
      \qquad S_N = \sum_{n=0}^{N} r^{n}
      $$

      Así que demostrar el valor de la serie es encontrar $S_N$ en forma cerrada
      y tomar el límite.

      ### 2 · La suma parcial

      El truco es multiplicar por $r$ y restar, porque casi todo se cancela:

      $$
      S_N = 1 + r + r^{2} + \dots + r^{N}
      $$

      $$
      rS_N = \phantom{1 + {}} r + r^{2} + \dots + r^{N} + r^{N+1}
      $$

      Restando:

      $$
      S_N - rS_N = 1 - r^{N+1}
      \;\Longrightarrow\;
      S_N(1-r) = 1-r^{N+1}
      $$

      Para despejar hace falta $r \neq 1$ —si $r=1$ la suma es $N+1$ y diverge—:

      $$
      S_N = \frac{1-r^{N+1}}{1-r}
      $$

      ### 3 · El límite

      Si $|r| < 1$, entonces $r^{N+1} \to 0$ cuando $N\to\infty$, y por tanto

      $$
      \sum_{n=0}^{\infty} r^{n} = \lim_{N\to\infty}\frac{1-r^{N+1}}{1-r}
        = \frac{1}{1-r}
      $$

      La condición $|r|<1$ es imprescindible: si $|r|\ge1$ el término
      $r^{N+1}$ no tiende a cero y la serie no converge. $\blacksquare$

      ### 4 · La aplicación: empezar en $n=3$

      Sacando factor común el primer término que sí entra:

      $$
      \sum_{n=3}^{\infty} r^{n}
        = r^{3} + r^{4} + r^{5} + \dots
        = r^{3}\left(1 + r + r^{2} + \dots\right)
        = r^{3}\sum_{k=0}^{\infty} r^{k}
      $$

      $$
      \boxed{\;\sum_{n=3}^{\infty} r^{n} = \frac{r^{3}}{1-r}, \qquad |r|<1\;}
      $$

      La misma idea vale en general: una serie geométrica que empieza donde sea
      vale **el primer término dividido entre $1-r$**.

      ### 5 · Comprobación

      Con $r=\frac12$, la fórmula da $\frac{1/8}{1/2} = \frac14$. Y por la otra
      vía: la suma completa vale 2, y los tres términos que se quitan suman
      $1+\frac12+\frac14 = \frac74$. En efecto, $2-\frac74 = \frac14$.

      ### Resultado

      $
      \boxed{\;\sum_{n=0}^{\infty} r^{n} = \frac{1}{1-r}
      \qquad\text{y}\qquad
      \sum_{n=3}^{\infty} r^{n} = \frac{r^{3}}{1-r},
      \qquad\text{ambas para } |r|<1\;}
      $

  - id: alpinista-geometrica
    titulo: El alpinista que nunca llega
    fuente: >-
      Ejercicio 2.14 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2019/2020 5E)

    enunciado: |
      Un alpinista quiere escalar una pared de 200 m. Es capaz de ascender 100 m
      en el primer intento, pero se va cansando, por lo que su ascensión en cada
      intento es más pequeña que en el anterior según la relación
      $a_{n+1} = a_n\,r$, donde $a_n$ es la altura que asciende en el intento
      $n$-ésimo. El tercer intento avanza 25 m.
    pide: Averiguar la razón $r$ y si el alpinista conseguirá llegar a la cima.

    pasos:
      - tipo: reconocer
        pregunta: |
          «Cada intento es una fracción fija del anterior». ¿Qué tipo de
          sucesión es?
        opciones:
          - texto: Geométrica, y la altura total es la suma de su serie
            correcta: true
            mensaje: |
              Eso es. $a_{n+1} = a_n r$ es la definición de progresión
              geométrica, y lo que sube en total es la suma de todos los
              tramos: una serie geométrica.
          - texto: Aritmética, porque cada intento resta una cantidad fija
            mensaje: |
              En una aritmética se **suma o resta** siempre lo mismo; aquí se
              **multiplica** siempre por lo mismo. La diferencia entre intentos
              no es constante: es cada vez menor.
          - texto: "No es ninguna sucesión conocida: hay que calcular intento a intento"
            mensaje: |
              Sí lo es, y por eso el problema tiene solución exacta. Ir intento
              a intento no permitiría responder a la segunda pregunta, que
              habla de infinitos intentos.
          - texto: Geométrica, y la altura total es el límite de $a_n$
            mensaje: |
              Cuidado con la diferencia. $a_n$ es lo que sube **en un intento**,
              y tiende a 0: cada vez sube menos. Lo que interesa es la **suma**
              de todos los tramos, que es otra cosa.

      - tipo: calcular
        titulo: La razón
        pregunta: ¿Cuánto vale $r$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.25'
            mensaje: |
              $\frac{25}{100} = 0{,}25$ es la razón entre el primer intento y el
              **tercero**, que son dos saltos, no uno. Como
              $a_3 = a_1 r^{2}$, hay que sacar la raíz cuadrada.
          - valor: '4'
            mensaje: |
              Has dividido al revés, $\frac{100}{25}$, y además sin la raíz. La
              razón tiene que ser menor que 1: el enunciado dice que cada
              intento es **más pequeño** que el anterior.
          - valor: '75'
            mensaje: |
              75 es lo que se pierde entre el primer intento y el tercero, en
              metros. La razón es un factor, no una diferencia.
        pista: |
          $a_3 = a_1 r^{2}$. Con $a_1 = 100$ y $a_3 = 25$, despeja $r^{2}$ y
          quédate con la raíz positiva menor que 1.
        desarrollo: |
          La relación $a_{n+1} = a_n r$ aplicada dos veces da

          $$
          a_3 = a_1 r^{2}
          $$

          Sustituyendo:

          $$
          25 = 100\,r^{2} \;\Longrightarrow\; r^{2} = \frac{1}{4}
          \;\Longrightarrow\; r = \frac{1}{2}
          $$

          Se toma la raíz positiva porque las alturas son positivas, y en efecto
          $r<1$, coherente con que el alpinista se canse.
        veredicto: |
          Cada intento sube la mitad que el anterior: 100, 50, 25, 12,5…

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento sobre si llega a la cima. Una de las piezas no
          debe entrar.
        piezas:
          - texto: |
              Lo que ha subido tras $N$ intentos es la suma parcial
              $S_N = 100\left(1 + \frac12 + \dots + \left(\frac12\right)^{N-1}\right)$.
          - texto: |
              Esa suma vale
              $S_N = 100\,\dfrac{1-(1/2)^{N}}{1-1/2} = 200\left(1-\left(\tfrac12\right)^{N}\right)$.
          - texto: |
              Como $\left(\frac12\right)^{N} > 0$ para todo $N$ finito, se tiene
              $S_N < 200$ **siempre**: nunca alcanza la cima.
          - texto: |
              El límite de $S_N$ es exactamente 200, así que se acerca tanto
              como se quiera pero necesitaría infinitos intentos.
          - texto: |
              Como la serie converge a 200 y la pared mide 200 m, el alpinista
              llega a la cima.
            trampa: true
            mensaje: |
              Convergir a 200 no es alcanzar 200. La suma **tiende** a ese
              valor, y cada suma parcial se queda estrictamente por debajo: tras
              10 intentos lleva 199,8 m; tras 20, 199,9998 m. Confundir el
              límite con un valor alcanzado es el error que este problema busca.
        veredicto: |
          La respuesta honesta es la del boletín: necesitaría infinitos
          intentos. En la práctica, tras 11 intentos le faltarían menos de 10
          centímetros.

    resolucion: |
      **Datos.** $a_1 = 100$ m, $a_{n+1} = a_n r$, $a_3 = 25$ m, pared de 200 m.

      ### 1 · Qué tipo de sucesión es

      La relación $a_{n+1} = a_n r$ define una **progresión geométrica** de
      razón $r$. Lo que el alpinista ha subido tras $N$ intentos es la suma de
      los $N$ primeros términos.

      ### 2 · La razón

      Aplicando la relación dos veces, $a_3 = a_1 r^{2}$:

      $$
      25 = 100\,r^{2} \;\Longrightarrow\; r^{2} = \frac14 \;\Longrightarrow\; r = \frac12
      $$

      Se descarta $r=-\frac12$ porque las alturas ascendidas son positivas. Y
      $r<1$, coherente con que cada intento sea menor que el anterior.

      Los intentos son entonces $100,\ 50,\ 25,\ 12{,}5,\ 6{,}25,\ \dots$

      ### 3 · ¿Llega a la cima?

      Tras $N$ intentos ha subido

      $$
      S_N = 100\sum_{k=0}^{N-1}\left(\frac12\right)^{k}
          = 100\,\frac{1-\left(\frac12\right)^{N}}{1-\frac12}
          = 200\left(1-\left(\frac{1}{2}\right)^{N}\right)
      $$

      Como $\left(\frac12\right)^{N} > 0$ para cualquier $N$ finito,

      $$
      S_N < 200 \qquad \text{para todo } N
      $$

      El alpinista **nunca alcanza la cima** en un número finito de intentos,
      aunque se acerque tanto como quiera:

      $$
      \lim_{N\to\infty} S_N = 200
      $$

      ### 4 · La distinción que evalúa el problema

      La serie **converge a 200**, pero converger no es alcanzar. Es el mismo
      error que confundir el ínfimo con el mínimo: 200 es la menor cota superior
      de las sumas parciales, y ninguna suma parcial la alcanza.

      Con números: tras 10 intentos lleva $199{,}80$ m; tras 20,
      $199{,}9998$ m. Siempre le falta algo.

      ### 5 · Comprobación

      La razón se contrasta con el dato que no se usó para calcularla. Con
      $r=\frac12$, los intentos son $100,\ 50,\ 25,\dots$, y el tercero avanza
      en efecto **25 m** ✔, que es lo que dice el enunciado.

      Y la fórmula de la suma, en un caso pequeño donde se puede sumar a mano:

      $
      S_3 = 100+50+25 = 175
      \qquad\text{frente a}\qquad
      200\left(1-\tfrac{1}{8}\right) = 200\cdot\tfrac78 = 175 \;\checkmark
      $

      Conviene además descartar la otra raíz por escrito: con $r=-\frac12$ el
      segundo intento sería de $-50$ m —bajaría—, lo que no describe a alguien
      que escala cansándose. El enunciado no lo prohíbe con una fórmula, lo
      prohíbe con su significado físico, y eso hay que argumentarlo.

      ### Resultado

      $$
      \boxed{\;r = \tfrac12;\quad \text{no llega: necesitaría infinitos intentos}\;}
      $$

  - id: definiciones-formales
    titulo: Tres definiciones que hay que saber escribir
    fuente: >-
      Ejercicio 2.2 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2018/2019 1E)

    enunciado: |
      Definir formalmente los siguientes conceptos: sucesión creciente,
      sucesión acotada, sucesión divergente hacia $-\infty$.
    pide: Escribir las tres definiciones con cuantificadores.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué distingue una definición formal de una explicación con palabras?
        opciones:
          - texto: >-
              Los cuantificadores y su **orden**, que es lo que fija de qué
              depende cada cosa
            correcta: true
            mensaje: |
              Eso es. «Para todo $M$ existe $n_0$» y «existe $n_0$ para todo
              $M$» dicen cosas distintas: en la primera $n_0$ puede depender de
              $M$, en la segunda no. Ese orden es la mitad de la nota.
          - texto: Que la formal usa símbolos matemáticos en vez de palabras
            mensaje: |
              Los símbolos son notación, no contenido. Se puede escribir una
              definición formal en castellano perfecto; lo que no se puede es
              omitir los cuantificadores ni cambiarlos de orden.
          - texto: Que la formal es más corta
            mensaje: |
              No suele serlo, y desde luego no es el criterio. Lo que se pide es
              que sea **precisa**: que no admita más de una lectura.
          - texto: Que la formal solo vale para sucesiones convergentes
            mensaje: |
              Las tres definiciones que pide el enunciado se aplican a cualquier
              sucesión. De hecho una de ellas, la de divergencia, describe justo
              lo contrario de converger.

      - tipo: calcular
        titulo: La definición, aplicada
        pregunta: |
          Para $a_n = -n^{2}$, que diverge hacia $-\infty$, y tomando
          $M = -100$: ¿cuál es el menor $n_0$ tal que $a_n < M$ para todo
          $n > n_0$?
        respuesta:
          tipo: numero
          valor: '10'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '100'
            mensaje: |
              100 es el valor de $|M|$, no el índice. La condición es
              $-n^{2} < -100$, es decir $n^{2} > 100$: hay que sacar la raíz.
          - valor: '11'
            mensaje: |
              Casi. La condición $n>10$ ya se cumple desde $n=11$, así que el
              menor $n_0$ que sirve es **10**: el índice a partir del cual
              —excluido— se cumple siempre.
          - valor: '-10'
            mensaje: |
              Los índices de una sucesión son naturales: no hay términos con
              $n$ negativo. La raíz que interesa es la positiva.
        pista: |
          $a_n < M$ es $-n^{2} < -100$, o sea $n^{2} > 100$.
        desarrollo: |
          $$
          a_n < M \iff -n^{2} < -100 \iff n^{2} > 100 \iff n > 10
          $$

          La condición se cumple para todo $n > 10$, así que el menor $n_0$
          válido es

          $$
          n_0 = 10
          $$
        veredicto: |
          Y si $M$ fuera $-10\,000$, haría falta $n_0 = 100$. Ese es el sentido
          del «para todo $M$ existe $n_0$»: el índice depende de la cota, y por
          eso el cuantificador de $M$ va primero.

      - tipo: justificar
        pregunta: |
          Ordena las tres definiciones, cada una con su estructura. Una de las
          piezas no debe entrar.
        piezas:
          - texto: |
              **Creciente:** $\{a_n\}$ es creciente si $a_{n+1} > a_n$ para todo
              $n \in \mathbb{N}$.
          - texto: |
              **Acotada:** $\{a_n\}$ es acotada si existen $p, q \in \mathbb{R}$
              tales que $p \le a_n \le q$ para todo $n \in \mathbb{N}$.
          - texto: |
              **Divergente hacia $-\infty$:** para todo $M \in \mathbb{R}$
              existe $n_0 \in \mathbb{N}$ tal que $a_n < M$ para todo $n > n_0$.
          - texto: |
              En las dos primeras el cuantificador es «para todo $n$», sin
              excepciones; en la tercera basta con que ocurra a partir de un
              índice.
          - texto: |
              **Acotada:** basta con que exista $q$ tal que $a_n \le q$ para
              todo $n$.
            trampa: true
            mensaje: |
              Eso es estar acotada **superiormente**, que es otra cosa. La
              definición de acotada a secas pide las dos cotas, la de arriba y
              la de abajo. Una sucesión como $-n^{2}$ está acotada
              superiormente y no está acotada.
        veredicto: |
          Fíjate en el contraste que marca la última pieza: crecer y estar
          acotada son propiedades de **todos** los términos; divergir y
          converger solo miran el final.

    resolucion: |
      **Enunciado.** Definir formalmente sucesión creciente, sucesión acotada y
      sucesión divergente hacia $-\infty$.

      ### 1 · Sucesión creciente

      $$
      \{a_n\} \text{ creciente} \iff a_{n+1} > a_n \quad \forall n \in \mathbb{N}
      $$

      Sin excepciones: basta un par consecutivo que no lo cumpla para que deje
      de serlo.

      ### 2 · Sucesión acotada

      $$
      \{a_n\} \text{ acotada} \iff
      \exists\, p, q \in \mathbb{R} \;:\; p \le a_n \le q \quad \forall n \in \mathbb{N}
      $$

      Las **dos** cotas. Con solo la de arriba se tiene «acotada
      superiormente», que es una propiedad más débil: $a_n = -n^{2}$ la cumple y
      no está acotada.

      Equivalentemente, y a veces más cómodo:
      $\exists\, K > 0 : |a_n| \le K$ para todo $n$.

      ### 3 · Sucesión divergente hacia $-\infty$

      $$
      \lim a_n = -\infty \iff
      \forall M \in \mathbb{R} \;\exists\, n_0 \in \mathbb{N} \;:\;
      n > n_0 \Rightarrow a_n < M
      $$

      ### 4 · Lo que de verdad se evalúa: el orden de los cuantificadores

      En la tercera definición, $n_0$ va **después** de $M$, y eso significa que
      puede depender de él. Escribirlo al revés —«existe $n_0$ tal que para todo
      $M$…»— diría que un mismo índice sirve para todas las cotas, que es falso
      y además imposible.

      Se ve con el ejemplo: para $a_n = -n^{2}$, con $M=-100$ basta $n_0=10$;
      con $M=-10\,000$ hace falta $n_0=100$. El índice crece con la exigencia.

      ### 5 · El contraste entre las tres

      Las dos primeras hablan de **todos** los términos; la tercera, solo de los
      que hay a partir de cierto punto. Es la misma diferencia que separa la
      monotonía de la convergencia, y explica por qué una sucesión definida a
      trozos puede converger sin ser monótona.

      ### 6 · Comprobación

      Una definición se comprueba usándola. Con $a_n = -n^{2}$:

      | definición | ¿la cumple? | por qué |
      |---|---|---|
      | creciente | **no** | $a_2 = -4 < -1 = a_1$ |
      | acotada | **no** | no hay cota inferior: $a_n \to -\infty$ |
      | acotada superiormente | sí | $a_n \le -1$ para todo $n$ |
      | divergente a $-\infty$ | **sí** | dado $M$, basta $n_0 = \lceil\sqrt{\lvert M\rvert}\rceil$ |

      La tercera y la cuarta fila son la razón de ser de la definición de
      acotada: si bastara la cota superior, esta sucesión estaría acotada y
      divergiría a la vez.

      ### Resultado

      $
      \boxed{
      \begin{aligned}
      \text{creciente:}\;\; & a_{n+1} > a_n \;\; \forall n \
      \text{acotada:}\;\; & \exists\, p,q \in \mathbb{R} : p \le a_n \le q \;\; \forall n \
      \text{divergente a } -\infty:\;\; & \forall M \in \mathbb{R}\; \exists\, n_0 : n>n_0 \Rightarrow a_n < M
      \end{aligned}}
      $

  - id: limite-de-no-negativos
    titulo: El límite de una sucesión de términos no negativos
    fuente: >-
      Ejercicio 2.3 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2016/2017 1E) · El boletín remite al libro: la demostración es propuesta
      nuestra, pendiente de revisión.

    enunciado: |
      Demostrar la siguiente propiedad: si $a_n \ge 0$ para todo
      $n \in \mathbb{N}$ y $\{a_n\}$ converge hacia $L$, entonces $L \ge 0$.
    pide: Demostrar formalmente la propiedad.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se demuestra que un número **no** puede ser negativo?
        opciones:
          - texto: >-
              Suponiendo que sí lo es y llegando a una contradicción
            correcta: true
            mensaje: |
              Eso es. Es una desigualdad no estricta, y las no estrictas se
              demuestran casi siempre por reducción al absurdo: se supone lo
              contrario, $L<0$, y se busca el choque.
          - texto: Calculando el límite y viendo que sale positivo
            mensaje: |
              No hay ninguna sucesión concreta que calcular: el enunciado habla
              de **cualquier** sucesión con esa propiedad. Una demostración no
              puede depender de un caso.
          - texto: Comprobándolo con varios ejemplos de sucesiones positivas
            mensaje: |
              Los ejemplos no demuestran una propiedad universal. Sirven para
              entenderla o para refutarla, no para probarla.
          - texto: Aplicando que el límite de una suma es la suma de los límites
            mensaje: |
              Esa propiedad es útil en otros contextos, pero aquí no hay ninguna
              suma que descomponer: hay una desigualdad sobre los términos.

      - tipo: calcular
        titulo: El épsilon que hace saltar la contradicción
        pregunta: |
          Si se supone $L = -0{,}4$, ¿qué valor de $\varepsilon$ conviene tomar
          para llegar al absurdo?
        respuesta:
          tipo: numero
          valor: '0.2'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.4'
            mensaje: |
              Con $\varepsilon = |L|$ el intervalo llega justo hasta 0, y la
              desigualdad $a_n < L+\varepsilon = 0$ deja de ser estricta:
              podría ser $a_n = 0$, que sí está permitido. Con la **mitad** el
              choque es limpio.
          - valor: '-0.2'
            mensaje: |
              $\varepsilon$ tiene que ser **positivo**: la definición dice «para
              todo $\varepsilon>0$». Un épsilon negativo no describe ningún
              entorno.
          - valor: '0.1'
            mensaje: |
              Serviría —cualquier $\varepsilon < 0{,}4$ vale—, pero la elección
              canónica es la mitad de la distancia: $\frac{|L|}{2}$. Es la que
              se generaliza a cualquier $L$ sin tener que justificar por qué esa
              y no otra.
        pista: |
          La distancia de $L$ a 0 es $0{,}4$. Toma la mitad.
        desarrollo: |
          Se toma

          $$
          \varepsilon = \frac{|L|}{2} = \frac{0{,}4}{2} = 0{,}2
          $$

          Con ese $\varepsilon$, a partir de cierto $m$ todos los términos
          cumplen

          $$
          a_n < L + \varepsilon = -0{,}4 + 0{,}2 = -0{,}2 < 0
          $$

          y eso contradice $a_n \ge 0$.
        veredicto: |
          «La mitad de la distancia» es el mismo truco que aparece en la
          unicidad del límite y en los ejercicios 2.4 y 2.5. Conviene tenerlo
          como reflejo.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Por reducción al absurdo, supongamos que $L < 0$.
          - texto: |
              Se toma $\varepsilon = \dfrac{|L|}{2} = -\dfrac{L}{2} > 0$, que es
              positivo precisamente porque $L$ es negativo.
          - texto: |
              Por definición de límite existe $m$ tal que
              $|a_n - L| < \varepsilon$ para todo $n>m$; en particular
              $a_n < L + \varepsilon = \dfrac{L}{2} < 0$.
          - texto: |
              Pero el enunciado dice que $a_n \ge 0$ para todo $n$.
              Contradicción, luego $L \ge 0$.
          - texto: |
              Como todos los términos son no negativos, su límite es
              estrictamente positivo.
            trampa: true
            mensaje: |
              El límite puede ser **exactamente cero**: $a_n = \frac1n$ tiene
              todos sus términos positivos y tiende a 0. Por eso el enunciado
              dice $L \ge 0$ y no $L > 0$. Las desigualdades estrictas no se
              conservan al pasar al límite; las no estrictas sí.
        veredicto: |
          Esa es la moraleja del ejercicio: al tomar límites, «$>$» se degrada a
          «$\ge$». Es la razón de que el enunciado esté escrito así.

    resolucion: |
      > **Aviso.** El boletín remite al libro para este ejercicio. Lo que sigue
      > es una demostración propuesta, pendiente de revisión.

      **Enunciado.** Si $a_n \ge 0$ para todo $n$ y $a_n \to L$, entonces
      $L \ge 0$.

      ### 1 · Estrategia

      Se trata de descartar que $L$ sea negativo. Como la conclusión es una
      desigualdad no estricta, el camino natural es la **reducción al absurdo**:
      se supone $L<0$ y se busca una contradicción con la hipótesis
      $a_n \ge 0$.

      ### 2 · La demostración

      Supongamos $L < 0$. Entonces $-L > 0$, y se puede tomar

      $$
      \varepsilon = \frac{-L}{2} = \frac{|L|}{2} > 0
      $$

      Por la definición de límite, existe $m \in \mathbb{N}$ tal que para todo
      $n > m$

      $$
      |a_n - L| < \varepsilon
      $$

      lo que en particular implica

      $$
      a_n < L + \varepsilon = L - \frac{L}{2} = \frac{L}{2} < 0
      $$

      Es decir: **todos** los términos a partir de $m$ serían estrictamente
      negativos. Pero la hipótesis dice que $a_n \ge 0$ para todo $n$.
      Contradicción.

      Por tanto la suposición era falsa y $L \ge 0$. $\blacksquare$

      ### 3 · Por qué $\ge$ y no $>$

      La conclusión no puede reforzarse: $a_n = \frac1n$ tiene todos sus
      términos **estrictamente** positivos y su límite es exactamente 0.

      La regla general que conviene recordar: al pasar al límite, las
      desigualdades **estrictas se debilitan**. De $a_n > 0$ solo se deduce
      $L \ge 0$.

      ### 4 · Sobre la elección de $\varepsilon$

      Se ha tomado la mitad de la distancia de $L$ a 0. Con
      $\varepsilon = |L|$ el intervalo llegaría justo hasta 0 y la desigualdad
      $a_n < 0$ dejaría de ser estricta, con lo que el choque no sería limpio.
      Ese «tomar la mitad» reaparece en los ejercicios 2.4, 2.5 y 2.6.

      ### 5 · Comprobación

      No demuestra nada —la demostración ya está hecha—, pero sirve para ver la
      maquinaria funcionando y detectar un signo cambiado. Se construye una
      sucesión que tienda a un límite negativo y se cuenta cuántos términos
      consigue mantener no negativos:

      $
      a_n = -0{,}4 + \frac{1}{n} \;\longrightarrow\; L = -0{,}4
      $

      $
      a_1 = 0{,}6 \ge 0, \qquad a_2 = 0{,}1 \ge 0, \qquad
      a_3 = -0{,}067 < 0, \qquad a_4 = -0{,}15 < 0,\;\dots
      $

      Solo dos. Y con el $\varepsilon = \frac{|L|}{2} = 0{,}2$ de la
      demostración, la cuenta sale igual: $\frac1n < 0{,}2$ desde $n=6$, y en
      efecto desde ahí todos los términos son menores que $-0{,}2$.

      Por muy despacio que se construya la sucesión, los términos no negativos
      son siempre **finitos**. Eso es exactamente lo que la hipótesis
      $a_n \ge 0$ para **todo** $n$ prohíbe.

      ### Resultado

      $
      \boxed{\;a_n \ge 0 \;\;\forall n \;\;\text{y}\;\; a_n \to L
      \;\;\Longrightarrow\;\; L \ge 0\;}
      $

  - id: signos-infinitos-limite-cero
    titulo: Infinitos positivos e infinitos negativos
    fuente: >-
      Ejercicio 2.4 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2012/2013 1E) · El boletín no publica solución: la demostración es
      propuesta nuestra, pendiente de revisión.

    enunciado: |
      Supongamos que $\{a_n\}_{n\in\mathbb{N}}$ es una sucesión convergente que
      tiene infinitos términos positivos e infinitos términos negativos.
    pide: Demostrar formalmente que su límite es 0.

    pasos:
      - tipo: reconocer
        pregunta: |
          La hipótesis dice «infinitos» de cada signo. ¿Por qué es importante
          que sean infinitos y no solo «algunos»?
        opciones:
          - texto: >-
              Porque con infinitos siempre queda alguno **después** de cualquier
              índice, y la definición de límite habla del final
            correcta: true
            mensaje: |
              Ese es el corazón del ejercicio. Si solo hubiera unos cuantos
              términos negativos, a partir de un momento desaparecerían y no
              estorbarían. Al ser infinitos, siempre aparece uno más allá de
              cualquier $m$.
          - texto: Porque una sucesión con términos de los dos signos no puede converger
            mensaje: |
              Sí puede: $\frac{(-1)^{n}}{n}$ tiene infinitos de cada signo y
              converge a 0. El enunciado la da por convergente, y de ahí deduce
              cuál es el límite.
          - texto: Porque así la sucesión está acotada
            mensaje: |
              Tener términos de los dos signos no dice nada sobre la acotación.
              La acotación viene de la convergencia, que es hipótesis.
          - texto: Porque garantiza que la sucesión es alternada
            mensaje: |
              No hace falta que alternen ordenadamente. Pueden aparecer en
              cualquier orden: lo único que se usa es que nunca se agotan.

      - tipo: calcular
        titulo: El épsilon
        pregunta: |
          Si se supone que el límite es $L = 0{,}6$, ¿qué $\varepsilon$ conviene
          tomar para llegar al absurdo?
        respuesta:
          tipo: numero
          valor: '0.3'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.6'
            mensaje: |
              Con $\varepsilon = L$ el intervalo llega justo hasta 0 y no se
              excluye el cero ni los negativos por los pelos. Con la mitad, el
              intervalo queda entero a la derecha del 0.
          - valor: '1.2'
            mensaje: |
              Has multiplicado por 2 en vez de dividir. Un $\varepsilon$ mayor
              que $L$ deja el 0 dentro del entorno, así que no contradice nada.
          - valor: '0'
            mensaje: |
              La definición exige $\varepsilon > 0$ estrictamente. Con
              $\varepsilon = 0$ la condición $|a_n - L| < 0$ no la cumple nadie.
        pista: |
          La distancia de $L$ a 0 es $0{,}6$. Toma la mitad, como en el 2.3.
        desarrollo: |
          Con $\varepsilon = \frac{L}{2} = 0{,}3$, a partir de cierto $m$:

          $$
          |a_n - 0{,}6| < 0{,}3 \;\Longrightarrow\; a_n > 0{,}3 > 0
          $$

          o sea, **todos** los términos desde $m$ serían positivos. Pero hay
          infinitos negativos, así que alguno tiene que aparecer después de
          $m$. Contradicción.
        veredicto: |
          El mismo épsilon que en el 2.3, y por el mismo motivo: la mitad de la
          distancia deja el entorno entero a un lado del cero.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Sea $L$ el límite, que existe por hipótesis. Se descartan por
              separado los casos $L>0$ y $L<0$.
          - texto: |
              **Si $L>0$:** tomando $\varepsilon = \frac{L}{2}$, existe $m$ tal
              que $a_n > L - \frac{L}{2} = \frac{L}{2} > 0$ para todo $n>m$.
          - texto: |
              Eso deja como mucho $m$ términos negativos, un número finito, y
              contradice que haya infinitos. Luego $L$ no puede ser positivo.
          - texto: |
              **Si $L<0$:** el mismo argumento con
              $\varepsilon = -\frac{L}{2}$ da $a_n < \frac{L}{2} < 0$ a partir
              de cierto índice, contradiciendo que haya infinitos positivos.
          - texto: |
              Descartados los dos casos, $L = 0$.
          - texto: |
              Como hay tantos positivos como negativos, se compensan y el límite
              es cero.
            trampa: true
            mensaje: |
              «Se compensan» no es un argumento: los límites no promedian
              signos. Además la hipótesis no dice que haya la misma cantidad
              —los dos conjuntos son infinitos, y eso no significa «iguales»—,
              ni los términos tienen por qué ser simétricos. La demostración
              tiene que pasar por la definición.
        veredicto: |
          Descartar dos casos por separado y concluir el tercero es un esquema
          que se repite. Lo importante es que cada caso choque con **una**
          hipótesis concreta del enunciado.

    resolucion: |
      > **Aviso.** El boletín no publica solución de este ejercicio. Lo que
      > sigue es una demostración propuesta, pendiente de revisión.

      **Enunciado.** Si $\{a_n\}$ converge y tiene infinitos términos positivos
      e infinitos términos negativos, su límite es 0.

      ### 1 · Qué hace fuerte a la hipótesis

      Que los términos de cada signo sean **infinitos** significa que, por
      grande que sea un índice $m$, siempre hay términos de los dos signos
      después de $m$. Eso es justo lo que choca con la definición de límite, que
      afirma algo sobre **todos** los términos a partir de cierto punto.

      Si solo hubiera unos cuantos negativos, desaparecerían y no dirían nada
      del límite.

      ### 2 · La demostración

      Sea $L = \lim a_n$, que existe por hipótesis. Se descartan los dos casos.

      **Caso $L > 0$.** Se toma $\varepsilon = \frac{L}{2} > 0$. Por definición
      de límite, existe $m$ tal que para todo $n>m$

      $$
      |a_n - L| < \frac{L}{2} \;\Longrightarrow\; a_n > L - \frac{L}{2} = \frac{L}{2} > 0
      $$

      Es decir, todos los términos a partir de $m$ son positivos, y por tanto
      hay como mucho $m$ términos negativos: un número **finito**. Eso
      contradice la hipótesis de que hay infinitos negativos.

      **Caso $L < 0$.** Simétrico: con $\varepsilon = -\frac{L}{2} > 0$ se
      obtiene $a_n < \frac{L}{2} < 0$ para todo $n>m$, y solo habría finitos
      términos positivos. Contradicción.

      Descartados los dos, la única posibilidad es

      $$
      L = 0 \qquad \blacksquare
      $$

      ### 3 · El ejemplo que acompaña

      $a_n = \frac{(-1)^{n}}{n}$ cumple las hipótesis: converge, y tiene
      infinitos términos de cada signo. Su límite es, en efecto, 0.

      ### 4 · Lo que no vale como argumento

      Decir que «los positivos y los negativos se compensan» no demuestra nada:
      los límites no promedian signos, la hipótesis no afirma que haya la misma
      cantidad de cada tipo, y los términos no tienen por qué ser simétricos.
      Todo el peso lo lleva la definición.

      ### 5 · Comprobación

      Se intenta construir un contraejemplo y se ve que no sale, que es la mejor
      forma de comprobar una demostración por reducción al absurdo. Para que el
      límite fuera $L = 0{,}6$ con infinitos negativos, habría que mantener
      términos por debajo de cero **sin dejar de acercarse a $0{,}6$**:

      $
      a_n = 0{,}6 + \frac{(-1)^{n}}{n}
      \;\longrightarrow\; 0{,}6
      $

      $
      a_1 = -0{,}4 < 0, \qquad a_2 = 1{,}1, \qquad a_3 = 0{,}27, \qquad
      a_4 = 0{,}85,\;\dots
      $

      Un solo término negativo. Y no es mala suerte: con
      $\varepsilon = \frac{L}{2} = 0{,}3$, a partir de $n>\frac{1}{0{,}3}$ todos
      los términos superan $0{,}3$. La oscilación que sobrevive al límite es
      cada vez más pequeña, y por eso **no puede cruzar el cero infinitas veces
      si el límite no es cero**.

      Frente a esto, $a_n = \frac{(-1)^{n}}{n}$ sí cruza infinitas veces, y su
      límite es 0.

      ### Resultado

      $
      \boxed{\;\{a_n\}\text{ convergente con infinitos términos de cada signo}
      \;\;\Longrightarrow\;\; \lim a_n = 0\;}
      $

  - id: desigualdad-en-el-limite
    titulo: Las desigualdades sobreviven al límite, pero debilitadas
    fuente: >-
      Ejercicio 2.5 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2018/2019 1E) · El boletín no publica solución: la demostración es
      propuesta nuestra, pendiente de revisión.

    enunciado: |
      Sean $\{x_n\}$ e $\{y_n\}$ dos sucesiones tales que $x_n \le y_n$ para
      todo $n \in \mathbb{N}$, con $\lim x_n = x$ y $\lim y_n = y$.
    pide: Demostrar formalmente que $x \le y$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que suponer para la reducción al absurdo?
        opciones:
          - texto: Que $x > y$, que es la negación de lo que se quiere probar
            correcta: true
            mensaje: |
              Eso es. La negación de $x \le y$ es $x > y$, y de ahí sale una
              distancia positiva, $x-y$, con la que construir el épsilon.
          - texto: Que $x < y$
            mensaje: |
              Eso no es la negación de $x\le y$: es un caso particular de lo que
              se quiere demostrar. Suponerlo no lleva a ninguna contradicción
              porque no hay nada que contradecir.
          - texto: Que las dos sucesiones son iguales
            mensaje: |
              No hay razón para suponerlo, y además el enunciado permite que
              sean distintas. La suposición del absurdo tiene que ser la
              negación exacta de la tesis.
          - texto: Que alguna de las dos no converge
            mensaje: |
              La convergencia es hipótesis del enunciado, no algo que se pueda
              negar. Lo que se niega es la **conclusión**.

      - tipo: calcular
        titulo: El épsilon
        pregunta: |
          Suponiendo $x = 2$ e $y = 1$, ¿qué $\varepsilon$ conviene tomar?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Con $\varepsilon = x-y = 1$ los dos entornos se tocan justo en el
              punto medio y la contradicción no es estricta. Con la mitad, los
              entornos quedan separados y el choque es limpio.
          - valor: '1.5'
            mensaje: |
              Ese es el punto medio entre $x$ e $y$, que sí aparece en la
              demostración —es la frontera que separa los dos entornos—, pero no
              es el $\varepsilon$.
          - valor: '2'
            mensaje: |
              Ese es el valor de $x$. Con un épsilon tan grande los dos entornos
              se solapan por completo y no hay nada que contradecir.
        pista: |
          La distancia entre los dos límites es $x-y = 1$. La mitad.
        desarrollo: |
          $$
          \varepsilon = \frac{x-y}{2} = \frac{2-1}{2} = 0{,}5
          $$

          Con ese valor, a partir de cierto índice
          $x_n > x - \varepsilon = 1{,}5$ y $y_n < y + \varepsilon = 1{,}5$, así
          que $y_n < x_n$: lo contrario de la hipótesis.
        veredicto: |
          El punto medio $1{,}5$ es la frontera: los $x_n$ acaban por encima y
          los $y_n$ por debajo.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Por reducción al absurdo, supongamos $x > y$, y sea
              $\varepsilon = \dfrac{x-y}{2} > 0$.
          - texto: |
              Por converger $x_n \to x$, existe $m_1$ con
              $x_n > x - \varepsilon = \dfrac{x+y}{2}$ para todo $n>m_1$.
          - texto: |
              Por converger $y_n \to y$, existe $m_2$ con
              $y_n < y + \varepsilon = \dfrac{x+y}{2}$ para todo $n>m_2$.
          - texto: |
              Tomando $n > \max(m_1, m_2)$ se cumplen las dos a la vez, y
              entonces $y_n < \dfrac{x+y}{2} < x_n$.
          - texto: |
              Eso contradice $x_n \le y_n$. Luego $x \le y$.
          - texto: |
              Basta tomar $m_1$, porque si la desigualdad se cumple para una
              sucesión, se cumple para las dos.
            trampa: true
            mensaje: |
              Cada sucesión tiene **su propio** índice: los dos $\varepsilon$
              son iguales pero los $m$ no tienen por qué serlo. Por eso hay que
              tomar el máximo de los dos, que es el punto a partir del cual las
              dos condiciones valen a la vez. Olvidarlo es el descuido más común
              en las demostraciones con dos sucesiones.
        veredicto: |
          Ese $\max(m_1,m_2)$ es la pieza que distingue una demostración
          cuidada de una que «se entiende».

    resolucion: |
      > **Aviso.** El boletín no publica solución de este ejercicio. Lo que
      > sigue es una demostración propuesta, pendiente de revisión.

      **Enunciado.** Si $x_n \le y_n$ para todo $n$, $x_n \to x$ e $y_n \to y$,
      entonces $x \le y$.

      ### 1 · Estrategia

      Reducción al absurdo. La negación de la tesis es $x > y$, y de ahí sale
      una distancia positiva con la que fabricar el épsilon.

      ### 2 · La demostración

      Supongamos $x > y$ y tomemos

      $$
      \varepsilon = \frac{x-y}{2} > 0
      $$

      Por la convergencia de $\{x_n\}$, existe $m_1$ tal que para $n>m_1$

      $$
      |x_n - x| < \varepsilon \;\Longrightarrow\; x_n > x - \varepsilon = \frac{x+y}{2}
      $$

      Por la de $\{y_n\}$, existe $m_2$ tal que para $n>m_2$

      $$
      |y_n - y| < \varepsilon \;\Longrightarrow\; y_n < y + \varepsilon = \frac{x+y}{2}
      $$

      Tomando $n > \max(m_1, m_2)$ se cumplen **las dos a la vez**:

      $$
      y_n < \frac{x+y}{2} < x_n
      $$

      es decir, $y_n < x_n$, en contra de la hipótesis $x_n \le y_n$.
      Contradicción, luego $x \le y$. $\blacksquare$

      ### 3 · Dos detalles que valen nota

      **El máximo de los dos índices.** Cada sucesión aporta su propio $m$. Hay
      que quedarse con el mayor para que las dos desigualdades valgan
      simultáneamente; escribir uno solo es un descuido frecuente.

      **La desigualdad se debilita.** Aunque la hipótesis fuera estricta,
      $x_n < y_n$, la conclusión seguiría siendo $x \le y$ y no $x<y$. El
      ejemplo: $x_n = 0$ e $y_n = \frac1n$ cumplen $x_n < y_n$ para todo $n$, y
      sus límites son iguales, ambos 0.

      ### 4 · Relación con el ejercicio 2.3

      El 2.3 es el caso particular $x_n = 0$: si $0 \le a_n$ y ambas convergen,
      entonces $0 \le L$. La misma demostración, con una de las sucesiones
      constante.

      ### 5 · Comprobación

      Se pone a prueba la maquinaria con $x=2$ e $y=1$, los números del paso de
      cálculo, y se ve que la hipótesis $x_n \le y_n$ **se rompe sola**:

      $
      x_n = 2 - \frac1n \;\to\; 2, \qquad y_n = 1 + \frac1n \;\to\; 1
      $

      | $n$ | $x_n$ | $y_n$ | ¿$x_n \le y_n$? |
      |---|---|---|---|
      | 1 | $1$ | $2$ | sí |
      | 2 | $1{,}5$ | $1{,}5$ | sí (empate) |
      | 3 | $1{,}67$ | $1{,}33$ | **no** |
      | 4 | $1{,}75$ | $1{,}25$ | **no** |

      A partir de $n=3$ la desigualdad se invierte y ya no vuelve. Coincide con
      lo que anuncia la demostración: con $\varepsilon = \frac{x-y}{2} = 0{,}5$
      salen $m_1 = m_2 = 2$, y el cruce ocurre justo en $n > \max(m_1,m_2) = 2$.

      Es decir, la cuenta del $\max$ no era un tecnicismo: predice el índice
      exacto a partir del cual aparece la contradicción.

      ### Resultado

      $
      \boxed{\;x_n \le y_n \;\;\forall n,\;\; x_n \to x,\;\; y_n \to y
      \;\;\Longrightarrow\;\; x \le y\;}
      $

  - id: unicidad-del-limite
    titulo: Por qué el límite es único
    fuente: >-
      Ejercicio 2.6 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2019/2020 1E) · El boletín remite al libro: la demostración es propuesta
      nuestra, pendiente de revisión.

    enunciado: |
      Demostrar que si el límite de una sucesión $\{x_n\}_{n\in\mathbb{N}}$
      existe, entonces es único.
    pide: Demostrar la unicidad del límite.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se demuestra que algo es único?
        opciones:
          - texto: >-
              Suponiendo que hay dos y demostrando que tienen que ser el mismo,
              o que su existencia es contradictoria
            correcta: true
            mensaje: |
              Ese es el esquema estándar de toda demostración de unicidad. Aquí
              se supone que hay dos límites distintos y se llega a un absurdo.
          - texto: Calculando el límite y comprobando que sale un solo número
            mensaje: |
              No hay ninguna sucesión concreta: la propiedad tiene que valer
              para todas. Y calcular un límite ya presupone que es único.
          - texto: Demostrando que la sucesión es monótona
            mensaje: |
              La monotonía no tiene nada que ver: sucesiones no monótonas
              también tienen límite único. La unicidad sale de la definición,
              no del comportamiento de la sucesión.
          - texto: Comprobándolo en varias sucesiones distintas
            mensaje: |
              Ejemplos, otra vez, no demuestran una propiedad universal.

      - tipo: calcular
        titulo: El épsilon
        pregunta: |
          Si se suponen dos límites $L_1 = 1$ y $L_2 = 1{,}4$, ¿qué
          $\varepsilon$ conviene tomar?
        respuesta:
          tipo: numero
          valor: '0.2'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.4'
            mensaje: |
              Con $\varepsilon = |L_1-L_2|$ los dos entornos se tocan y la
              contradicción deja de ser estricta. Con la mitad quedan disjuntos,
              que es lo que se necesita.
          - valor: '1.2'
            mensaje: |
              Ese es el punto medio entre los dos candidatos, no el épsilon. El
              épsilon es la **distancia** desde ese punto medio a cada uno.
          - valor: '0.7'
            mensaje: |
              Ese es la mitad de $L_2$, no la mitad de la distancia entre los
              dos. Lo que importa es cuánto se separan, $|L_1-L_2| = 0{,}4$.
        pista: |
          La distancia entre los dos candidatos es $0{,}4$. La mitad.
        desarrollo: |
          $$
          \varepsilon = \frac{|L_1-L_2|}{2} = \frac{0{,}4}{2} = 0{,}2
          $$

          Con ese valor los entornos $(L_1-\varepsilon, L_1+\varepsilon)$ y
          $(L_2-\varepsilon, L_2+\varepsilon)$ son **disjuntos**: uno acaba en
          $1{,}2$ y el otro empieza ahí.
        veredicto: |
          Cuatro ejercicios seguidos con el mismo épsilon: la mitad de la
          distancia. Es la herramienta básica de todo el tema.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Supongamos que $\{x_n\}$ tiene dos límites $L_1 \neq L_2$, y sea
              $\varepsilon = \dfrac{|L_1-L_2|}{2} > 0$.
          - texto: |
              Por ser $L_1$ límite, existe $m_1$ con
              $|x_n - L_1| < \varepsilon$ para $n>m_1$; por ser $L_2$ límite,
              existe $m_2$ con $|x_n - L_2| < \varepsilon$ para $n>m_2$.
          - texto: |
              Para $n > \max(m_1,m_2)$ se cumplen las dos, y por la desigualdad
              triangular
              $|L_1-L_2| \le |L_1-x_n| + |x_n-L_2| < \varepsilon + \varepsilon$.
          - texto: |
              Es decir, $|L_1-L_2| < |L_1-L_2|$, que es imposible. Luego
              $L_1 = L_2$.
          - texto: |
              Como los dos entornos son disjuntos, la sucesión no puede
              converger, y por eso el límite es único.
            trampa: true
            mensaje: |
              La conclusión no es que la sucesión no converja: el enunciado
              **parte** de que el límite existe. Lo que es imposible es que haya
              **dos distintos**. Confundir «no puede haber dos» con «no puede
              haber ninguno» invierte el resultado.
        veredicto: |
          La desigualdad triangular es la que cierra el argumento: mide la
          distancia entre los dos candidatos pasando por un término de la
          sucesión, que está cerca de los dos a la vez.

    resolucion: |
      > **Aviso.** El boletín remite al libro para este ejercicio. Lo que sigue
      > es una demostración propuesta, pendiente de revisión.

      **Enunciado.** Si el límite de $\{x_n\}$ existe, es único.

      ### 1 · Estrategia

      El esquema de toda demostración de unicidad: suponer que hay dos objetos
      distintos con la propiedad y llegar a una contradicción.

      ### 2 · La demostración

      Supongamos que $L_1$ y $L_2$ son límites de $\{x_n\}$ con
      $L_1 \neq L_2$. Entonces $|L_1 - L_2| > 0$ y se puede tomar

      $$
      \varepsilon = \frac{|L_1-L_2|}{2} > 0
      $$

      Por ser $L_1$ límite, existe $m_1$ tal que $|x_n - L_1| < \varepsilon$
      para todo $n>m_1$. Por ser $L_2$ límite, existe $m_2$ tal que
      $|x_n - L_2| < \varepsilon$ para todo $n>m_2$.

      Sea $n > \max(m_1, m_2)$: las dos desigualdades valen a la vez. Por la
      **desigualdad triangular**,

      $$
      |L_1 - L_2| = |L_1 - x_n + x_n - L_2| \le |L_1 - x_n| + |x_n - L_2|
        < \varepsilon + \varepsilon = |L_1-L_2|
      $$

      Es decir, $|L_1-L_2| < |L_1-L_2|$, que es imposible.

      La suposición era falsa, luego $L_1 = L_2$: **el límite es único**.
      $\blacksquare$

      ### 3 · La idea geométrica

      Con $\varepsilon$ igual a la mitad de la distancia, los dos entornos son
      **disjuntos**. Y un término de la sucesión tendría que estar dentro de los
      dos a la vez, que es imposible. La desigualdad triangular es la forma
      algebraica de decir exactamente eso.

      ### 4 · El épsilon de siempre

      Es el cuarto ejercicio seguido —2.3, 2.4, 2.5 y este— que se resuelve
      tomando **la mitad de la distancia** entre los dos valores en conflicto.
      Merece la pena quedarse con el patrón: cuando dos cantidades tienen que
      separarse, se parte la diferencia y se usa como margen.

      ### 5 · Comprobación

      Con los dos candidatos del paso de cálculo, $L_1 = 1$ y $L_2 = 1{,}4$, y
      $\varepsilon = 0{,}2$, los entornos son

      $
      \left(0{,}8,\; 1{,}2\right) \qquad\text{y}\qquad \left(1{,}2,\; 1{,}6\right)
      $

      **disjuntos**: se tocan en $1{,}2$, que no pertenece a ninguno por ser los
      dos abiertos. Un término $x_n$ con $n>\max(m_1,m_2)$ tendría que estar en
      los dos a la vez, y no hay ningún número real que lo esté.

      Conviene ver también qué falla con un $\varepsilon$ mayor. Con
      $\varepsilon = 0{,}4$ los entornos son $(0{,}6,\,1{,}4)$ y
      $(1{,}0,\,1{,}8)$, que **sí** se solapan: cualquier $x_n$ entre 1 y 1,4
      cumpliría las dos condiciones y no habría contradicción. Por eso el
      épsilon tiene que ser la mitad, y no cualquier cosa.

      ### Resultado

      $
      \boxed{\;\text{Si } \lim x_n \text{ existe, es único}\;}
      $
