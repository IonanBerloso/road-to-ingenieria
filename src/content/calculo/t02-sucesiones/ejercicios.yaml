  - id: decreciente-y-serie
    titulo: Una sucesión decreciente y la serie que forma
    fuente: >-
      Ejercicio 2.11 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2019/2020 4E)

    nivel: practica
    enunciado: |
      $$
      \{a_n\}_{n\in\mathbb{N}} =
      \begin{cases}
      4+\dfrac{1}{n} & n < 10 \\[6pt]
      \left(\dfrac{2}{3}\right)^{n} & n \ge 10
      \end{cases}
      $$
    pide: >-
      Estudiar el crecimiento, el supremo, el ínfimo y la convergencia, y
      decidir si la serie $\sum_{n=1}^{\infty} a_n$ converge.

    pasos:
      - tipo: reconocer
        pregunta: |
          El primer tramo vale algo más de 4 y el segundo, para $n=10$, vale
          $0{,}017$. ¿Rompe eso la monotonía?
        opciones:
          - texto: >-
              No: el salto va **hacia abajo**, y el primer tramo también bajaba
            correcta: true
            mensaje: |
              Exacto. Aquí el salto empuja en la misma dirección que los dos
              tramos, así que la sucesión decrece de principio a fin. Es lo
              contrario de lo que pasaba en el 2.9, donde el salto iba al revés
              que los tramos.
          - texto: "Sí: cualquier salto entre dos tramos rompe la monotonía"
            mensaje: |
              Solo la rompe si va en dirección contraria. Un salto hacia abajo
              dentro de una sucesión que ya venía bajando la mantiene
              decreciente.
          - texto: Sí, porque el segundo tramo tiende a 0 y el primero a 4
            mensaje: |
              El primer tramo no «tiende» a nada: son nueve términos. Y que los
              valores caigan de 4 a casi 0 es justamente ir hacia abajo, que es
              lo que hace falta para decrecer.
          - texto: No se puede saber sin calcular los infinitos términos
            mensaje: |
              Sí se puede: basta comprobar que cada tramo decrece por separado y
              que el salto entre ellos también baja. Son tres comprobaciones,
              no infinitas.

      - tipo: calcular
        titulo: El supremo
        pregunta: ¿Cuál es el supremo de la sucesión?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              4 es el valor al que se acercaría el primer tramo si continuara,
              pero el mayor término es el **primero**: $a_1 = 4+\frac11 = 5$.
              Como la sucesión decrece, el supremo es su primer término.
          - valor: '0'
            mensaje: |
              0 es el ínfimo, no el supremo: es el valor al que tiende, por
              debajo de todos los términos.
          - valor: '0.0173'
            mensaje: |
              Ese es $\left(\frac23\right)^{10}$, el primer término del segundo
              tramo. Es de los más pequeños, no el mayor.
        pista: |
          La sucesión decrece, así que el supremo es su primer término:
          $a_1 = 4+\frac{1}{1}$.
        desarrollo: |
          Al ser decreciente, el mayor valor es el primero:

          $$
          a_1 = 4 + \frac{1}{1} = 5
          $$

          y como se alcanza, es máximo además de supremo.

          El ínfimo es 0: los términos $\left(\frac23\right)^{n}$ se acercan a 0
          tanto como se quiera sin llegar nunca, así que 0 es la mayor de las
          cotas inferiores y **no** es mínimo.
        veredicto: |
          Supremo 5, que sí se alcanza; ínfimo 0, que no. Esa distinción es lo
          que separa supremo de máximo.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento sobre la serie del apartado (c). Una de las
          piezas no debe entrar.
        piezas:
          - texto: |
              La serie se parte en dos: los nueve primeros términos y la cola
              desde $n=10$.
          - texto: |
              La suma de los nueve primeros es un número finito, así que no
              puede impedir la convergencia.
          - texto: |
              La cola es $\sum_{n\ge10}\left(\frac23\right)^{n}$, una serie
              geométrica de razón $r=\frac23$.
          - texto: |
              Como $|r| = \frac23 < 1$, esa geométrica converge, y por tanto la
              serie completa también.
          - texto: |
              Como $a_n \to 0$, la serie converge.
            trampa: true
            mensaje: |
              Que el término general tienda a 0 es **necesario**, no suficiente.
              La serie armónica $\sum\frac1n$ tiene término general tendiendo a
              0 y suma infinita. Aquí la serie sí converge, pero por ser
              geométrica de razón menor que 1, no por el límite del término
              general.
        veredicto: |
          La misma condición que en el 2.15 cerraba el ejercicio en una línea
          aquí no sirve para nada: allí se usaba para **descartar**, que es lo
          único que permite.

    resolucion: |
      **Datos.** Una sucesión que vale $4+\frac1n$ en sus nueve primeros
      términos y $\left(\frac23\right)^{n}$ a partir del décimo.

      ### 1 · Las definiciones que pide el apartado (a)

      - **Creciente:** $a_{n+1} > a_n$ para todo $n$. **Decreciente:** al revés.
      - **Supremo:** la menor de las cotas superiores. **Ínfimo:** la mayor de
        las cotas inferiores.
      - **Convergente a $L$:** para todo $\varepsilon>0$ existe $m$ tal que
        $|a_n-L|<\varepsilon$ si $n>m$.

      ### 2 · Crecimiento

      Tres comprobaciones:

      - **Primer tramo:** $4+\frac1n$ decrece, porque lo que se suma es cada vez
        menor: $5,\ 4{,}5,\ 4{,}33,\ \dots,\ 4{,}11$.
      - **El salto:** $a_9 = 4{,}11$ y
        $a_{10} = \left(\frac23\right)^{10} \approx 0{,}017$. Baja.
      - **Segundo tramo:** $\left(\frac23\right)^{n}$ decrece, porque la razón
        está entre 0 y 1.

      Los tres van hacia abajo, así que la sucesión es **decreciente** en todo
      su recorrido. Conviene compararlo con el ejercicio 2.9: allí el salto iba
      en contra de los tramos y rompía la monotonía; aquí va a favor y la
      conserva.

      ### 3 · Supremo, ínfimo y límite

      Al ser decreciente, el supremo es el primer término:

      $$
      \sup = a_1 = 4+1 = 5 \qquad (\text{y es máximo, porque se alcanza})
      $$

      Los términos se acercan a 0 sin alcanzarlo, luego

      $$
      \inf = 0 \qquad (\text{no es mínimo})
      $$

      $$
      \lim_{n\to\infty} a_n = \lim_{n\to\infty}\left(\frac{2}{3}\right)^{n} = 0
      $$

      porque una potencia de base entre 0 y 1 tiende a cero. La sucesión es
      **convergente con límite 0**, cosa que también garantizaba el teorema:
      decreciente y acotada inferiormente.

      ### 4 · La serie

      Se parte en dos trozos:

      $$
      \sum_{n=1}^{\infty} a_n
        = \underbrace{\sum_{n=1}^{9}\left(4+\frac1n\right)}_{\text{finita}}
        + \sum_{n=10}^{\infty}\left(\frac{2}{3}\right)^{n}
      $$

      La primera parte es una suma de nueve números: finita, y por tanto
      irrelevante para la convergencia.

      La segunda es una **serie geométrica** de razón $r=\frac23$, con
      $|r|<1$, así que converge. Su valor es

      $$
      \sum_{n=10}^{\infty}\left(\frac23\right)^{n}
        = \frac{\left(\frac23\right)^{10}}{1-\frac23}
        = 3\left(\frac{2}{3}\right)^{10} \approx 0{,}052
      $$

      Luego **la serie converge**.

      ### Resultado

      $$
      \boxed{\;\text{Decreciente};\; \sup = 5,\; \inf = 0,\; L = 0;\;
      \text{la serie converge}\;}
      $$

