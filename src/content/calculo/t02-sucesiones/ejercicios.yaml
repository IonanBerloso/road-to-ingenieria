  - id: alpinista-geometrica
    titulo: El alpinista que nunca llega
    fuente: >-
      Ejercicio 2.14 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2019/2020 5E)

    nivel: practica
    enunciado: |
      Un alpinista quiere escalar una pared de 200 m. Es capaz de ascender 100 m
      en el primer intento, pero se va cansando, por lo que su ascensión en cada
      intento es más pequeña que en el anterior según la relación
      $a_{n+1} = a_n\,r$, donde $a_n$ es la altura que asciende en el intento
      $n$-ésimo. El tercer intento avanza 25 m.
    pide: Averiguar la razón $r$ y si el alpinista conseguirá llegar a la cima.

    pasos:
      - tipo: reconocer
        pregunta: |
          «Cada intento es una fracción fija del anterior». ¿Qué tipo de
          sucesión es?
        opciones:
          - texto: Geométrica, y la altura total es la suma de su serie
            correcta: true
            mensaje: |
              Eso es. $a_{n+1} = a_n r$ es la definición de progresión
              geométrica, y lo que sube en total es la suma de todos los
              tramos: una serie geométrica.
          - texto: Aritmética, porque cada intento resta una cantidad fija
            mensaje: |
              En una aritmética se **suma o resta** siempre lo mismo; aquí se
              **multiplica** siempre por lo mismo. La diferencia entre intentos
              no es constante: es cada vez menor.
          - texto: "No es ninguna sucesión conocida: hay que calcular intento a intento"
            mensaje: |
              Sí lo es, y por eso el problema tiene solución exacta. Ir intento
              a intento no permitiría responder a la segunda pregunta, que
              habla de infinitos intentos.
          - texto: Geométrica, y la altura total es el límite de $a_n$
            mensaje: |
              Cuidado con la diferencia. $a_n$ es lo que sube **en un intento**,
              y tiende a 0: cada vez sube menos. Lo que interesa es la **suma**
              de todos los tramos, que es otra cosa.

      - tipo: calcular
        titulo: La razón
        pregunta: ¿Cuánto vale $r$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.25'
            mensaje: |
              $\frac{25}{100} = 0{,}25$ es la razón entre el primer intento y el
              **tercero**, que son dos saltos, no uno. Como
              $a_3 = a_1 r^{2}$, hay que sacar la raíz cuadrada.
          - valor: '4'
            mensaje: |
              Has dividido al revés, $\frac{100}{25}$, y además sin la raíz. La
              razón tiene que ser menor que 1: el enunciado dice que cada
              intento es **más pequeño** que el anterior.
          - valor: '75'
            mensaje: |
              75 es lo que se pierde entre el primer intento y el tercero, en
              metros. La razón es un factor, no una diferencia.
        pista: |
          $a_3 = a_1 r^{2}$. Con $a_1 = 100$ y $a_3 = 25$, despeja $r^{2}$ y
          quédate con la raíz positiva menor que 1.
        desarrollo: |
          La relación $a_{n+1} = a_n r$ aplicada dos veces da

          $$
          a_3 = a_1 r^{2}
          $$

          Sustituyendo:

          $$
          25 = 100\,r^{2} \;\Longrightarrow\; r^{2} = \frac{1}{4}
          \;\Longrightarrow\; r = \frac{1}{2}
          $$

          Se toma la raíz positiva porque las alturas son positivas, y en efecto
          $r<1$, coherente con que el alpinista se canse.
        veredicto: |
          Cada intento sube la mitad que el anterior: 100, 50, 25, 12,5…

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento sobre si llega a la cima. Una de las piezas no
          debe entrar.
        piezas:
          - texto: |
              Lo que ha subido tras $N$ intentos es la suma parcial
              $S_N = 100\left(1 + \frac12 + \dots + \left(\frac12\right)^{N-1}\right)$.
          - texto: |
              Esa suma vale
              $S_N = 100\,\dfrac{1-(1/2)^{N}}{1-1/2} = 200\left(1-\left(\tfrac12\right)^{N}\right)$.
          - texto: |
              Como $\left(\frac12\right)^{N} > 0$ para todo $N$ finito, se tiene
              $S_N < 200$ **siempre**: nunca alcanza la cima.
          - texto: |
              El límite de $S_N$ es exactamente 200, así que se acerca tanto
              como se quiera pero necesitaría infinitos intentos.
          - texto: |
              Como la serie converge a 200 y la pared mide 200 m, el alpinista
              llega a la cima.
            trampa: true
            mensaje: |
              Convergir a 200 no es alcanzar 200. La suma **tiende** a ese
              valor, y cada suma parcial se queda estrictamente por debajo: tras
              10 intentos lleva 199,8 m; tras 20, 199,9998 m. Confundir el
              límite con un valor alcanzado es el error que este problema busca.
        veredicto: |
          La respuesta honesta es la del boletín: necesitaría infinitos
          intentos. En la práctica, tras 11 intentos le faltarían menos de 10
          centímetros.

    resolucion: |
      **Datos.** $a_1 = 100$ m, $a_{n+1} = a_n r$, $a_3 = 25$ m, pared de 200 m.

      ### 1 · Qué tipo de sucesión es

      La relación $a_{n+1} = a_n r$ define una **progresión geométrica** de
      razón $r$. Lo que el alpinista ha subido tras $N$ intentos es la suma de
      los $N$ primeros términos.

      ### 2 · La razón

      Aplicando la relación dos veces, $a_3 = a_1 r^{2}$:

      $$
      25 = 100\,r^{2} \;\Longrightarrow\; r^{2} = \frac14 \;\Longrightarrow\; r = \frac12
      $$

      Se descarta $r=-\frac12$ porque las alturas ascendidas son positivas. Y
      $r<1$, coherente con que cada intento sea menor que el anterior.

      Los intentos son entonces $100,\ 50,\ 25,\ 12{,}5,\ 6{,}25,\ \dots$

      ### 3 · ¿Llega a la cima?

      Tras $N$ intentos ha subido

      $$
      S_N = 100\sum_{k=0}^{N-1}\left(\frac12\right)^{k}
          = 100\,\frac{1-\left(\frac12\right)^{N}}{1-\frac12}
          = 200\left(1-\left(\frac{1}{2}\right)^{N}\right)
      $$

      Como $\left(\frac12\right)^{N} > 0$ para cualquier $N$ finito,

      $$
      S_N < 200 \qquad \text{para todo } N
      $$

      El alpinista **nunca alcanza la cima** en un número finito de intentos,
      aunque se acerque tanto como quiera:

      $$
      \lim_{N\to\infty} S_N = 200
      $$

      ### 4 · La distinción que evalúa el problema

      La serie **converge a 200**, pero converger no es alcanzar. Es el mismo
      error que confundir el ínfimo con el mínimo: 200 es la menor cota superior
      de las sumas parciales, y ninguna suma parcial la alcanza.

      Con números: tras 10 intentos lleva $199{,}80$ m; tras 20,
      $199{,}9998$ m. Siempre le falta algo.

      ### 5 · Comprobación

      La razón se contrasta con el dato que no se usó para calcularla. Con
      $r=\frac12$, los intentos son $100,\ 50,\ 25,\dots$, y el tercero avanza
      en efecto **25 m** ✔, que es lo que dice el enunciado.

      Y la fórmula de la suma, en un caso pequeño donde se puede sumar a mano:

      $
      S_3 = 100+50+25 = 175
      \qquad\text{frente a}\qquad
      200\left(1-\tfrac{1}{8}\right) = 200\cdot\tfrac78 = 175 \;\checkmark
      $

      Conviene además descartar la otra raíz por escrito: con $r=-\frac12$ el
      segundo intento sería de $-50$ m —bajaría—, lo que no describe a alguien
      que escala cansándose. El enunciado no lo prohíbe con una fórmula, lo
      prohíbe con su significado físico, y eso hay que argumentarlo.

      ### Resultado

      $$
      \boxed{\;r = \tfrac12;\quad \text{no llega: necesitaría infinitos intentos}\;}
      $$

