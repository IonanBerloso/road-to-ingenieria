  - id: creciente-con-limite-cero
    titulo: Una sucesión creciente que tiende a cero
    fuente: >-
      Ejercicio 2.1 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2011/2012 4E)

    nivel: practica
    enunciado: |
      Supongamos que $\{a_n\}_{n\in\mathbb{N}}$ es una sucesión **creciente**
      cuyo límite es 0.
    pide: >-
      Decidir cuál de las afirmaciones es cierta, y para la sucesión
      $a_n = \frac{n-3}{n+1}$ con $\varepsilon = 10^{-10}$, encontrar el menor
      $m$ tal que $|a_n - L| < \varepsilon$ para todo $n>m$.

    pasos:
      - tipo: reconocer
        pregunta: |
          De las cuatro afirmaciones del enunciado, ¿cuál es la única cierta?
        opciones:
          - texto: $\forall n \in \mathbb{N}$, $a_n < 0$
            correcta: true
            mensaje: |
              Correcto, y el argumento es corto: si algún término fuera
              $a_{n_0} \ge 0$, al ser creciente todos los siguientes serían
              **estrictamente mayores**, y el límite tendría que ser al menos
              $a_{n_0+1} > 0$. Como el límite es 0, eso es imposible.
          - texto: $\exists n \in \mathbb{N}$ con $a_n > 0$
            mensaje: |
              Si un término fuera positivo, a partir de ahí todos lo serían y
              serían mayores que él, así que el límite no podría ser 0: sería un
              número positivo. Una sucesión creciente **se acerca a su límite
              por debajo**.
          - texto: La sucesión puede tener términos positivos y negativos
            mensaje: |
              Podría tenerlos si fuera cualquier sucesión, pero esta es
              creciente: en cuanto un término fuera positivo, todos los
              posteriores también, y el límite sería positivo. Los dos datos
              juntos —creciente y límite cero— la obligan a ser toda negativa.
          - texto: $\exists n \in \mathbb{N}$ con $a_n = 0$
            mensaje: |
              Tampoco: si algún término valiera exactamente 0, el siguiente
              sería estrictamente mayor —creciente— y ya sería positivo, con lo
              que el límite se iría por encima de 0. El cero es el límite, y no
              se alcanza.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que demuestra la afirmación cierta. Una de las
          piezas no debe entrar.
        piezas:
          - texto: |
              Se razona por reducción al absurdo: supongamos que existe $n_0$
              con $a_{n_0} \ge 0$.
          - texto: |
              Al ser creciente, $a_n > a_{n_0} \ge 0$ para todo $n > n_0$: a
              partir de ahí todos los términos son estrictamente positivos.
          - texto: |
              El límite de una sucesión creciente es el supremo de sus términos,
              y en particular es mayor o igual que cualquiera de ellos: $L \ge
              a_{n_0+1} > 0$.
          - texto: |
              Pero el enunciado dice que $L = 0$, y $0 > 0$ es falso.
              Contradicción, luego $a_n < 0$ para todo $n$.
          - texto: |
              Como el límite es 0 y la sucesión crece, sus términos se acercan a
              0, así que a partir de un momento son positivos.
            trampa: true
            mensaje: |
              Acercarse a 0 **por debajo** es acercarse igual. Una sucesión
              creciente que tiende a 0 sube hacia el cero sin llegar nunca:
              $-1, -\frac12, -\frac13, \dots$ es el ejemplo. Confundir «se
              acerca a cero» con «se hace positiva» es el error que este
              ejercicio caza.
        veredicto: |
          La imagen que hay que tener: una sucesión creciente sube hacia su
          límite y se queda siempre por debajo. Si el límite es 0, vive entera
          en los negativos.

      - tipo: calcular
        titulo: El menor m del apartado (e)
        pregunta: |
          Para $a_n = \dfrac{n-3}{n+1}$ y $\varepsilon = 10^{-10}$, ¿cuál es el
          menor $m$ tal que $|a_n - L| < \varepsilon$ para todo $n > m$?
        respuesta:
          tipo: numero
          valor: '39999999999'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '40000000000'
            mensaje: |
              Casi. La condición es $n+1 > 4\cdot 10^{10}$, es decir
              $n > 4\cdot 10^{10} - 1$. El menor $m$ que sirve es justamente ese
              número, y tú has puesto uno más: te has dejado el $-1$ del
              denominador.
          - valor: '10000000000'
            mensaje: |
              Te has dejado el 4. La distancia al límite es
              $\left|\frac{n-3}{n+1} - 1\right| = \frac{4}{n+1}$, con un 4 en el
              numerador que viene de $-3-1$.
          - valor: '4'
            mensaje: |
              Ese 4 es el numerador de la distancia al límite, no el valor de
              $m$. Falta dividirlo entre $\varepsilon$.
        pista: |
          Primero el límite: $\frac{n-3}{n+1} \to 1$. Luego calcula
          $\left|\frac{n-3}{n+1}-1\right|$ y verás que se simplifica muchísimo.
        desarrollo: |
          El límite es $L = 1$, porque numerador y denominador tienen el mismo
          grado y coeficiente principal 1.

          $$
          \left|\frac{n-3}{n+1} - 1\right|
            = \left|\frac{n-3-(n+1)}{n+1}\right|
            = \frac{4}{n+1}
          $$

          Se impone que sea menor que $\varepsilon = 10^{-10}$:

          $$
          \frac{4}{n+1} < 10^{-10}
          \;\Longleftrightarrow\;
          n+1 > 4\cdot 10^{10}
          \;\Longleftrightarrow\;
          n > 4\cdot 10^{10} - 1
          $$

          El menor $m$ que hace que la condición valga para **todo** $n>m$ es

          $$
          m = 4\cdot 10^{10} - 1 = 39\,999\,999\,999
          $$
        veredicto: |
          Cuarenta mil millones de términos para acercarse a una diezmilésima de
          millonésima. Eso es lo que significa que $m$ dependa de $\varepsilon$:
          cuanto más aprietas, más tarde empieza a cumplirse.

    resolucion: |
      **Datos.** $\{a_n\}$ creciente con $\lim a_n = 0$.

      ### 1 · Qué obliga la combinación «creciente» + «límite 0»

      Las dos condiciones por separado no dicen gran cosa; juntas fijan el signo
      de todos los términos.

      **Afirmación: $a_n < 0$ para todo $n$.** Por reducción al absurdo,
      supongamos que existe $n_0$ con $a_{n_0} \ge 0$. Al ser creciente,

      $$
      a_n > a_{n_0} \ge 0 \qquad \forall n > n_0
      $$

      Además, el límite de una sucesión creciente es el supremo de sus términos,
      así que $L \ge a_{n_0+1} > 0$. Pero $L = 0$. Contradicción.

      Por tanto **(b) es la única cierta**, y con ella caen las otras tres: no
      hay ningún término positivo (a), no puede haber términos de los dos signos
      (c), y ninguno vale exactamente cero (d).

      El ejemplo que fija la idea: $a_n = -\frac1n$ es creciente, tiende a 0 y
      es siempre negativa.

      ### 2 · El apartado (e)

      Para $a_n = \dfrac{n-3}{n+1}$, el límite es $L=1$: numerador y denominador
      son de grado 1 con el mismo coeficiente principal.

      La distancia al límite se simplifica de golpe:

      $$
      |a_n - L| = \left|\frac{n-3}{n+1} - 1\right|
        = \left|\frac{(n-3)-(n+1)}{n+1}\right|
        = \frac{4}{n+1}
      $$

      Se impone la condición de la definición de límite:

      $$
      \frac{4}{n+1} < 10^{-10}
      \;\Longleftrightarrow\;
      n+1 > \frac{4}{10^{-10}} = 4\cdot 10^{10}
      \;\Longleftrightarrow\;
      n > 4\cdot 10^{10} - 1
      $$

      Como se pide el **menor** $m$ tal que la desigualdad valga para todo
      $n > m$:

      $$
      m = 4\cdot 10^{10} - 1 = 39\,999\,999\,999
      $$

      ### 3 · Comprobación

      Con $n = m+1 = 4\cdot10^{10}$:
      $\frac{4}{4\cdot10^{10}+1} < 10^{-10}$ ✔

      Con $n = m = 4\cdot10^{10}-1$:
      $\frac{4}{4\cdot10^{10}} = 10^{-10}$, que **no** es menor estricto que
      $\varepsilon$. Por eso $m$ no puede ser más pequeño.

      ### Resultado

      $$
      \boxed{\;\text{Solo es cierta } a_n<0 \;\forall n;
      \qquad m = 4\cdot 10^{10}-1 = 39\,999\,999\,999\;}
      $$

