  - id: cubo-y-luego-cinco
    titulo: De crecer como un cubo a estabilizarse en cinco
    fuente: >-
      Ejercicio 2.9 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2018/2019 5E)

    nivel: practica
    enunciado: |
      $$
      \{a_n\}_{n\in\mathbb{N}} =
      \begin{cases}
      5-\dfrac{2}{n} & n \ge 100 \\[6pt]
      n^{3} & n < 100
      \end{cases}
      $$
    pide: >-
      Definir formalmente sucesión creciente y sucesión convergente, y estudiar
      el crecimiento y la convergencia de $\{a_n\}$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que mirar para decidir si es creciente?
        opciones:
          - texto: >-
              Los dos tramos por dentro **y** el salto entre ellos
            correcta: true
            mensaje: |
              Eso es. Dentro de cada tramo puede crecer perfectamente y aun así
              fallar en el punto de empalme, que es justo lo que pasa aquí: se
              pasa de $99^{3}$ a menos de 5.
          - texto: Solo el tramo que vale para $n$ grande
            mensaje: |
              Eso vale para la **convergencia**, no para el crecimiento. Ser
              creciente exige $a_{n+1}>a_n$ para todo $n$, incluidos los
              primeros y el punto donde cambia la fórmula.
          - texto: Solo los primeros términos
            mensaje: |
              Los primeros términos pueden crecer y la sucesión no ser
              creciente. La definición pide **todos** los pares consecutivos.
          - texto: "Basta calcular el límite: si converge, es monótona"
            mensaje: |
              Converger no implica ser monótona. $\frac{(-1)^{n}}{n}$ converge a
              0 dando saltos de signo, y esta sucesión converge dando un salto
              gigantesco hacia abajo.

      - tipo: calcular
        titulo: El tamaño del salto
        pregunta: |
          ¿Cuánto vale $a_{99}$, el último término del primer tramo?
        respuesta:
          tipo: numero
          valor: '970299'
          tolerancia: 1
          formato: un número
        distractores:
          - valor: '4.98'
            mensaje: |
              Ese es $a_{100} = 5-\frac{2}{100}$, el **primer** término del otro
              tramo. El 99 todavía pertenece al tramo $n^{3}$.
          - valor: '297'
            mensaje: |
              Has multiplicado por 3 en vez de elevar al cubo: $99 \cdot 3$. El
              tramo es $n^{3}$.
          - valor: '9801'
            mensaje: |
              Ese es $99^{2}$. Falta multiplicar una vez más por 99.
        pista: |
          Para $n<100$ la sucesión vale $n^{3}$, así que $a_{99} = 99^{3}$.
        desarrollo: |
          $$
          a_{99} = 99^{3} = 970\,299
          $$

          y el término siguiente pertenece ya al otro tramo:

          $$
          a_{100} = 5 - \frac{2}{100} = 4{,}98
          $$

          El salto es de casi un millón hacia abajo.
        veredicto: |
          Ese salto es el que rompe el crecimiento. Todo lo demás de la sucesión
          sube.

      - tipo: justificar
        pregunta: |
          Ordena el estudio completo. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Definiciones.** Creciente: $a_{n+1} > a_n$ para todo
              $n \in \mathbb{N}$. Convergente a $L$: para todo $\varepsilon>0$
              existe $m$ tal que $|a_n - L| < \varepsilon$ si $n>m$.
          - texto: |
              Dentro de cada tramo la sucesión crece: $n^{3}$ es creciente, y
              $5-\frac2n$ también, porque lo que se resta se hace más pequeño.
          - texto: |
              Pero en el empalme baja: $a_{99} = 970\,299$ y
              $a_{100} = 4{,}98$. Como falla un solo par consecutivo, **no es
              creciente**.
          - texto: |
              La convergencia solo mira la cola: para $n \ge 100$ la sucesión es
              $5-\frac2n$, que tiende a **5**.
          - texto: |
              Como no es creciente y no está acotada superiormente por el primer
              tramo, no puede converger.
            trampa: true
            mensaje: |
              Dos errores en una frase. El primero: no ser creciente no impide
              converger —el teorema de la monotonía es una condición
              **suficiente**, no necesaria—. El segundo: el primer tramo tiene
              99 términos, así que la sucesión sí está acotada, por
              $970\,299$. Y aunque no lo estuviera en esos 99, la convergencia
              seguiría dependiendo solo de la cola.
        veredicto: |
          No creciente y convergente a la vez. Los dos conceptos miran cosas
          distintas: uno la sucesión entera, el otro solo el final.

    resolucion: |
      **Datos.** Una sucesión que crece como $n^{3}$ hasta $n=99$ y a partir de
      $n=100$ vale $5-\frac{2}{n}$.

      ### 1 · Las definiciones que pide el apartado (a)

      **Creciente:**

      $$
      \{a_n\} \text{ es creciente} \iff a_{n+1} > a_n \quad \forall n \in \mathbb{N}
      $$

      **Convergente:**

      $$
      \lim_{n\to\infty} a_n = L \iff
      \forall\varepsilon>0\;\exists\, m\in\mathbb{N}:\; n>m \Rightarrow |a_n-L|<\varepsilon
      $$

      Merece la pena subrayar el contraste, porque es de lo que va el apartado
      (b): la primera exige algo de **todos** los términos; la segunda, solo de
      los que hay a partir de cierto punto.

      ### 2 · Crecimiento

      Dentro de cada tramo la sucesión crece:

      - $n^{3}$ es creciente para $n \ge 1$;
      - $5-\frac{2}{n}$ también, porque al aumentar $n$ se resta cada vez menos.

      Pero en el empalme se desploma:

      $$
      a_{99} = 99^{3} = 970\,299, \qquad a_{100} = 5-\frac{2}{100} = 4{,}98
      $$

      Un solo par consecutivo que incumple $a_{n+1}>a_n$ basta para que **no sea
      creciente**. Tampoco es decreciente, porque sube en todo lo demás.

      ### 3 · Convergencia

      Solo cuenta la cola. Para $n\ge 100$:

      $$
      \lim_{n\to\infty}\left(5-\frac{2}{n}\right) = 5
      $$

      La sucesión es **convergente con límite 5**.

      ### 4 · Por qué las dos cosas son compatibles

      El teorema «monótona y acotada $\Rightarrow$ convergente» es una condición
      **suficiente**, no necesaria. Hay sucesiones convergentes que no son
      monótonas, y esta es una: converge a 5 después de dar un salto de casi un
      millón hacia abajo.

      ### 5 · Comprobación

      Con $\varepsilon = 0{,}01$: hace falta
      $\left|5-\frac2n-5\right| = \frac2n < 0{,}01$, es decir $n > 200$. En
      efecto, a partir de $n=201$ todos los términos están a menos de una
      centésima de 5.

      ### Resultado

      $$
      \boxed{\;\text{No creciente (ni decreciente). Convergente con } L = 5\;}
      $$

