      ¿Para qué valores de $x$ converge $S(x)$?
    pide: Los intervalos de x en los que la serie converge.
    pasos:
      - tipo: reconocer
        pregunta: |
          Fijado un $x$, el número $g(x)$ es una constante. ¿Qué clase de serie
          es entonces $\sum k\,r^{k}$, con $r$ fijo?
        opciones:
          - texto: >-
              Una **aritmético-geométrica**, que converge exactamente si
              $|r|<1$
            correcta: true
            mensaje: |
              Eso es. El $k$ de delante no cambia la condición: lo que decide
              es la razón. Con $|r|<1$ converge, y de hecho su suma vale
              $r/(1-r)^{2}$.
          - texto: >-
              Una serie de potencias, y hay que calcular su radio de
              convergencia
            mensaje: |
              Aquí la variable no es el exponente de una potencia de $x$: es
              $g(x)$, que para cada $x$ es **un número**. No hay radio que
              calcular, hay una condición sobre ese número.
          - texto: >-
              Una armónica generalizada, que converge si el exponente es mayor
              que 1
            mensaje: |
              La armónica generalizada es $\sum 1/k^{p}$, con $k$ en la base.
              Aquí $k$ está multiplicando y la base es $r$: es geométrica con
              un factor delante, y decide $|r|$.

      - tipo: reconocer
        pregunta: |
          Entonces hay que buscar los $x$ con $|g(x)|<1$. ¿Qué es eso en el
          dibujo?
        opciones:
          - texto: >-
              Los tramos en que la curva está **estrictamente entre** las dos
              rectas de trazos
            correcta: true
            mensaje: |
              Exacto, y de ahí que las dos rectas estén dibujadas: son
              $y=1$ e $y=-1$, y la pregunta es cuándo la curva va por dentro
              de esa banda.
          - texto: >-
              Los tramos en que la curva está por encima del eje
            mensaje: |
              Eso sería $g>0$, que no tiene nada que ver. La curva puede ser
              negativa y estar dentro de la banda — de hecho lo está entre
              $x=2$ y $x=3$— y puede ser positiva y estar fuera.
          - texto: >-
              Los puntos donde la curva corta a las rectas de trazos
            mensaje: |
              Ahí es donde $|g|=1$ exactamente, y ahí la serie **diverge**: si
              $r=1$ queda $\sum k$, y si $r=-1$ queda $\sum k(-1)^{k}$, cuyo
              término general no tiende a cero. Los cortes son la frontera, y
              quedan fuera.

      - tipo: calcular
        titulo: Cuántos intervalos hay
        pregunta: |
          Mirando la banda, ¿en cuántos intervalos separados converge $S(x)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              La curva sale de la banda por abajo entre $x=3$ y $x=4$, así que
              los tramos de dentro no son uno solo: son dos, separados por ese
              hueco.
          - valor: '4'
            mensaje: |
              Cuatro son los **cortes** con las rectas de trazos —en 1, 3, 4 y
              5—, y esos son las fronteras. Los tramos que quedan dentro entre
              ellas son dos.
        pista: |
          Cuenta los trozos sombreados.
        desarrollo: |
          La curva entra en la banda en $x=1$, sale en $x=3$, vuelve a entrar
          en $x=4$ y sale en $x=5$:

          $$
          x \in (1,3) \;\cup\; (4,5)
          $$

          **Dos** intervalos, y los dos abiertos.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Para cada $x$ fijo, $g(x)$ es un número $r$, y la serie es
              $\sum k\,r^{k}$.
          - texto: >-
              Esa serie converge exactamente cuando $|r|<1$, y el $k$ de
              delante no cambia la condición.
          - texto: >-
              Así que hay que buscar dónde la curva va **estrictamente dentro**
              de la banda: en $(1,3)$ y en $(4,5)$.
          - texto: >-
              En los cuatro cortes con las rectas la serie converge también,
              porque $|g|=1$ es el caso límite.
            trampa: true
            mensaje: |
              El caso límite **diverge**, y por eso los intervalos son
              abiertos. Con $r=1$ la serie es $\sum k$, que se va a infinito;
              con $r=-1$ es $\sum k(-1)^{k}$, cuyo término general ni siquiera
              tiende a cero. La condición es $|r|<1$ estricto, y ese «estricto»
              es lo que el enunciado del examen subraya.
        veredicto: |
          El detalle de los extremos es el que separa el aprobado del notable
          en este apartado: dar $[1,3]$ en vez de $(1,3)$ es incluir dos puntos
          donde la serie no existe.
    resolucion: |
      **El truco es dejar de ver una función.** Para cada $x$ fijo, $g(x)$ es
      **un número**. Llámalo $r$, y la serie es

      $$
      S = \sum_{k=1}^{\infty} k\,r^{k}
      $$

      que es aritmético-geométrica y converge **exactamente si $|r|<1$** — el
      factor $k$ no cambia la condición, solo la suma, que vale
      $r/(1-r)^{2}$.

      ### La condición, traducida al dibujo

      $$
      |g(x)| < 1
      \quad\Longleftrightarrow\quad
      -1 < g(x) < 1
      $$

      Eso es «la curva va por dentro de la banda», y por eso el enunciado
      dibuja las dos rectas de trazos. Leyendo los cortes:

      | tramo | dónde está la curva | la serie |
      |---|---|---|
      | $(0,1)$ | por encima de 1 | diverge |
      | $(1,3)$ | **dentro** | **converge** |
      | $(3,4)$ | por debajo de $-1$ | diverge |
      | $(4,5)$ | **dentro** | **converge** |
      | $(5,6)$ | por encima de 1 | diverge |

      $$
      \boxed{\,x \in (1,3) \cup (4,5)\,}
      $$

      ### Y los extremos, que es donde se pierden puntos

      En $x=1,3,4,5$ se tiene $|g|=1$ exactamente, y ahí la serie **no**
      converge:

      - con $r=1$: $\sum k = 1+2+3+\dots \to \infty$;
      - con $r=-1$: $\sum k(-1)^{k}$, cuyo término general no tiende a cero.

      Por eso los dos intervalos son **abiertos**. Escribir $[1,3]$ es incluir
      un punto donde la serie no existe, y es el fallo que este enunciado
      busca.

  - id: ej-definicion-de-limite
    titulo: Leer la definición de límite en un caso concreto
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Para la sucesión $a_n = \dfrac{1}{n}$, que converge a $0$, encontrar un
      $m$ que sirva en la definición de límite cuando $\varepsilon = 0{,}01$.
    pide: El menor m natural a partir del cual todos los términos distan de 0 menos de 0,01.
    pasos:
      - tipo: reconocer
        pregunta: |
          En la definición de límite, ¿quién elige primero, $\varepsilon$ o $m$?
        opciones:
          - texto: Primero se da el $\varepsilon$, y después se busca un $m$ que le sirva
            correcta: true
            mensaje: |
              Eso es, y por eso **$m$ depende de $\varepsilon$**. Cuanto más
              apretado sea el margen que te pidan, más tarde empezará a
              cumplirse. Un $m$ que no dependa de $\varepsilon$ es señal de que
              la definición no se ha entendido.
          - texto: Primero se fija $m$ y luego se mira qué $\varepsilon$ sale
            mensaje: |
              Al revés. Si eliges tú el $m$, siempre puedes hacer trampa
              tomándolo enorme. La definición te obliga a responder a
              **cualquier** margen que te pongan, por pequeño que sea.
          - texto: Los dos a la vez, porque están relacionados
            mensaje: |
              Están relacionados, pero el orden importa y es lo que se corrige.
              El cuantificador es «para todo $\varepsilon$ existe un $m$», y
              cambiarlo de orden dice algo distinto y falso.
      - tipo: calcular
        titulo: La desigualdad que hay que resolver
        pregunta: |
          $\left|a_n - 0\right| < 0{,}01$ es $\dfrac{1}{n} < 0{,}01$. ¿A partir
          de qué valor de $n$ se cumple? Da el menor natural que la cumple.
        respuesta:
          tipo: numero
          valor: '101'
          tolerancia: 0.5
          formato: un número natural
        distractores:
          - valor: '100'
            mensaje: |
              Con $n = 100$ sale $\frac{1}{100} = 0{,}01$ exactamente, y la
              desigualdad es **estricta**: hace falta que sea menor, no igual.
              El primero que la cumple es el siguiente.
          - valor: '0.01'
            mensaje: |
              Eso es el $\varepsilon$, no el término. $n$ es el número de orden
              de la sucesión: un natural, no un margen.
          - valor: '10'
            mensaje: |
              Parece que has resuelto $\frac{1}{n} < 0{,}1$. El margen es diez
              veces más pequeño, así que hay que ir diez veces más lejos.
        pista: |
          Invierte la desigualdad: $\frac1n < 0{,}01$ equivale a $n > 100$.
          Ojo a si el 100 entra o no.
        desarrollo: |
          $$
          \frac{1}{n} < 0{,}01
          \;\Longleftrightarrow\;
          n > \frac{1}{0{,}01} = 100
          $$

          El menor natural estrictamente mayor que 100 es **101**. Con $n=100$
          se tendría igualdad, y la definición pide desigualdad estricta.
      - tipo: calcular
        titulo: Y con un margen diez veces menor
        pregunta: |
          Si ahora te piden $\varepsilon = 0{,}001$, ¿cuál es el menor $n$ que
          sirve?
        respuesta:
          tipo: numero
          valor: '1001'
          tolerancia: 0.5
          formato: un número natural
        distractores:
          - valor: '1000'
            mensaje: |
              Mismo detalle que antes: con $n = 1000$ sale igualdad, no
              desigualdad estricta. Hay que pasarse uno.
          - valor: '101'
            mensaje: |
              Ese era el $m$ del margen anterior. Al apretar el margen, el
              momento a partir del cual se cumple **se va más lejos**: esa
              dependencia es justo lo que la definición captura.
        pista: |
          El mismo despeje con el nuevo margen. Y fíjate en cómo cambia el
          resultado al dividir el $\varepsilon$ entre diez.
        desarrollo: |
          $$
          \frac{1}{n} < 0{,}001 \;\Longleftrightarrow\; n > 1000
          \;\Longrightarrow\; m = 1001
          $$

          Diez veces más pequeño el margen, diez veces más lejos el momento.
          **Ahí se ve que $m$ es función de $\varepsilon$**, que es lo único
          que la definición exige.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta formal. Una pieza no debe entrar.
        piezas:
          - texto: Sea $\varepsilon > 0$ cualquiera.
          - texto: $\left|a_n - 0\right| = \frac1n$, porque todos los términos son positivos.
          - texto: $\frac1n < \varepsilon$ equivale a $n > \frac{1}{\varepsilon}$.
          - texto: Basta tomar $m$ como el primer natural mayor que $\frac{1}{\varepsilon}$.
          - texto: Como el resultado depende de $\varepsilon$, la sucesión no converge.
            trampa: true
            mensaje: |
              Es al revés: **que $m$ dependa de $\varepsilon$ es lo normal y lo
              exigido**. Lo que sería sospechoso es un $m$ que valiera para
              todos los márgenes a la vez.
    resolucion: |
      La definición dice: para todo $\varepsilon>0$ existe un $m$ tal que, para
      todo $n>m$, se cumple $\left|a_n - L\right| < \varepsilon$. Aquí $L = 0$.

      **Con $\varepsilon = 0{,}01$.** Como todos los términos son positivos,
      $\left|a_n - 0\right| = \frac1n$, y

      $$
      \frac1n < 0{,}01 \;\Longleftrightarrow\; n > 100
      $$

      así que sirve $m = 100$: a partir de $n = 101$ todos los términos están a
      menos de una centésima del cero.

      **Con $\varepsilon = 0{,}001$**, el mismo despeje da $n > 1000$.

      **Lo que hay que llevarse.** En general, dado cualquier $\varepsilon>0$
      basta tomar $m > \frac{1}{\varepsilon}$. Ese «basta tomar» es la
      demostración entera: no hay que encontrar el mejor $m$, solo **uno** que
      sirva.

