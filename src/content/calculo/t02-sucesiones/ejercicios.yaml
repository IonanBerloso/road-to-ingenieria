  - id: definiciones-formales
    titulo: Tres definiciones que hay que saber escribir
    fuente: >-
      Ejercicio 2.2 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2018/2019 1E)

    nivel: practica
    enunciado: |
      Definir formalmente los siguientes conceptos: sucesión creciente,
      sucesión acotada, sucesión divergente hacia $-\infty$.
    pide: Escribir las tres definiciones con cuantificadores.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué distingue una definición formal de una explicación con palabras?
        opciones:
          - texto: >-
              Los cuantificadores y su **orden**, que es lo que fija de qué
              depende cada cosa
            correcta: true
            mensaje: |
              Eso es. «Para todo $M$ existe $n_0$» y «existe $n_0$ para todo
              $M$» dicen cosas distintas: en la primera $n_0$ puede depender de
              $M$, en la segunda no. Ese orden es la mitad de la nota.
          - texto: Que la formal usa símbolos matemáticos en vez de palabras
            mensaje: |
              Los símbolos son notación, no contenido. Se puede escribir una
              definición formal en castellano perfecto; lo que no se puede es
              omitir los cuantificadores ni cambiarlos de orden.
          - texto: Que la formal es más corta
            mensaje: |
              No suele serlo, y desde luego no es el criterio. Lo que se pide es
              que sea **precisa**: que no admita más de una lectura.
          - texto: Que la formal solo vale para sucesiones convergentes
            mensaje: |
              Las tres definiciones que pide el enunciado se aplican a cualquier
              sucesión. De hecho una de ellas, la de divergencia, describe justo
              lo contrario de converger.

      - tipo: calcular
        titulo: La definición, aplicada
        pregunta: |
          Para $a_n = -n^{2}$, que diverge hacia $-\infty$, y tomando
          $M = -100$: ¿cuál es el menor $n_0$ tal que $a_n < M$ para todo
          $n > n_0$?
        respuesta:
          tipo: numero
          valor: '10'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '100'
            mensaje: |
              100 es el valor de $|M|$, no el índice. La condición es
              $-n^{2} < -100$, es decir $n^{2} > 100$: hay que sacar la raíz.
          - valor: '11'
            mensaje: |
              Casi. La condición $n>10$ ya se cumple desde $n=11$, así que el
              menor $n_0$ que sirve es **10**: el índice a partir del cual
              —excluido— se cumple siempre.
          - valor: '-10'
            mensaje: |
              Los índices de una sucesión son naturales: no hay términos con
              $n$ negativo. La raíz que interesa es la positiva.
        pista: |
          $a_n < M$ es $-n^{2} < -100$, o sea $n^{2} > 100$.
        desarrollo: |
          $$
          a_n < M \iff -n^{2} < -100 \iff n^{2} > 100 \iff n > 10
          $$

          La condición se cumple para todo $n > 10$, así que el menor $n_0$
          válido es

          $$
          n_0 = 10
          $$
        veredicto: |
          Y si $M$ fuera $-10\,000$, haría falta $n_0 = 100$. Ese es el sentido
          del «para todo $M$ existe $n_0$»: el índice depende de la cota, y por
          eso el cuantificador de $M$ va primero.

      - tipo: justificar
        pregunta: |
          Ordena las tres definiciones, cada una con su estructura. Una de las
          piezas no debe entrar.
        piezas:
          - texto: |
              **Creciente:** $\{a_n\}$ es creciente si $a_{n+1} > a_n$ para todo
              $n \in \mathbb{N}$.
          - texto: |
              **Acotada:** $\{a_n\}$ es acotada si existen $p, q \in \mathbb{R}$
              tales que $p \le a_n \le q$ para todo $n \in \mathbb{N}$.
          - texto: |
              **Divergente hacia $-\infty$:** para todo $M \in \mathbb{R}$
              existe $n_0 \in \mathbb{N}$ tal que $a_n < M$ para todo $n > n_0$.
          - texto: |
              En las dos primeras el cuantificador es «para todo $n$», sin
              excepciones; en la tercera basta con que ocurra a partir de un
              índice.
          - texto: |
              **Acotada:** basta con que exista $q$ tal que $a_n \le q$ para
              todo $n$.
            trampa: true
            mensaje: |
              Eso es estar acotada **superiormente**, que es otra cosa. La
              definición de acotada a secas pide las dos cotas, la de arriba y
              la de abajo. Una sucesión como $-n^{2}$ está acotada
              superiormente y no está acotada.
        veredicto: |
          Fíjate en el contraste que marca la última pieza: crecer y estar
          acotada son propiedades de **todos** los términos; divergir y
          converger solo miran el final.

      - tipo: redactar
        consigna: |
          **Escribe las tres definiciones en papel**, con cuantificadores y sin
          mirar. No con palabras: con $\forall$, $\exists$ y las desigualdades
          en su sitio, que es como las pide el examen.

          Escribir definiciones formales cae en **siete de los once cursos**
          del corpus, y es el apartado que más se subestima: parece que se sabe
          hasta que hay que ponerlo por escrito y aparecen los cuantificadores
          al revés.
        rubrica:
          - punto: |
              Cada definición empieza nombrando **qué se define**, y usa
              $\iff$ y no $=$ ni una flecha simple.
            porque: |
              Una definición es una equivalencia: dice cuándo una sucesión
              **es** creciente, no que algo valga otra cosa. Escribir
              $\Rightarrow$ define solo la mitad, y el corrector lo lee como
              que no distingues una implicación de una definición.
          - punto: |
              En **creciente**, el $\forall n$ va explícito y la comparación es
              entre términos **consecutivos**: $a_{n+1} > a_n$.
            porque: |
              Sin el $\forall n$ la condición no dice nada: se cumple para
              algún par en casi cualquier sucesión. Y comparar $a_n$ con $a_1$,
              o decir «va subiendo», no es la definición: hay sucesiones que
              suben y bajan y acaban más arriba.
          - punto: |
              En **acotada**, las **dos** cotas, con $\exists p, q$ delante del
              $\forall n$.
            porque: |
              Es el error que la pieza trampa de este mismo ejercicio ya
              señala: dar solo la cota superior define «acotada
              superiormente», que es otra cosa. Y el orden de los
              cuantificadores importa tanto como en el límite — las cotas son
              las mismas para todos los términos, así que el $\exists$ va
              primero.
          - punto: |
              En **divergente hacia $-\infty$**, la estructura
              $\forall K,\ \exists m : n > m \Rightarrow a_n < K$, con el $m$
              dependiendo de $K$.
            porque: |
              Es la definición de límite con el papel de $\varepsilon$ hecho
              por un $K$ tan negativo como se quiera. El orden
              $\forall K$ antes de $\exists m$ es lo que la hace verdadera: al
              revés afirmarías que un mismo $m$ sirve para todas las cotas a
              la vez, que es falso siempre.
          - punto: |
              Ninguna de las tres se apoya en la palabra «tiende», «se acerca»
              ni «cada vez más».
            porque: |
              Son las expresiones que el examen no acepta, y por un motivo:
              son las que hay que traducir a cuantificadores. Usarlas en una
              definición formal es dejar sin hacer justo lo que se pedía.
        veredicto: |
          Compara la tuya con la resolución de abajo símbolo por símbolo, no
          por el sentido. En una definición formal, el sentido no es lo que se
          corrige: se corrigen los cuantificadores y su orden.

    resolucion: |
      **Enunciado.** Definir formalmente sucesión creciente, sucesión acotada y
      sucesión divergente hacia $-\infty$.

      ### 1 · Sucesión creciente

      $$
      \{a_n\} \text{ creciente} \iff a_{n+1} > a_n \quad \forall n \in \mathbb{N}
      $$

      Sin excepciones: basta un par consecutivo que no lo cumpla para que deje
      de serlo.

      ### 2 · Sucesión acotada

      $$
      \{a_n\} \text{ acotada} \iff
      \exists\, p, q \in \mathbb{R} \;:\; p \le a_n \le q \quad \forall n \in \mathbb{N}
      $$

      Las **dos** cotas. Con solo la de arriba se tiene «acotada
      superiormente», que es una propiedad más débil: $a_n = -n^{2}$ la cumple y
      no está acotada.

      Equivalentemente, y a veces más cómodo:
      $\exists\, K > 0 : |a_n| \le K$ para todo $n$.

      ### 3 · Sucesión divergente hacia $-\infty$

      $$
      \lim a_n = -\infty \iff
      \forall M \in \mathbb{R} \;\exists\, n_0 \in \mathbb{N} \;:\;
      n > n_0 \Rightarrow a_n < M
      $$

      ### 4 · Lo que de verdad se evalúa: el orden de los cuantificadores

      En la tercera definición, $n_0$ va **después** de $M$, y eso significa que
      puede depender de él. Escribirlo al revés —«existe $n_0$ tal que para todo
      $M$…»— diría que un mismo índice sirve para todas las cotas, que es falso
      y además imposible.

      Se ve con el ejemplo: para $a_n = -n^{2}$, con $M=-100$ basta $n_0=10$;
      con $M=-10\,000$ hace falta $n_0=100$. El índice crece con la exigencia.

      ### 5 · El contraste entre las tres

      Las dos primeras hablan de **todos** los términos; la tercera, solo de los
      que hay a partir de cierto punto. Es la misma diferencia que separa la
      monotonía de la convergencia, y explica por qué una sucesión definida a
      trozos puede converger sin ser monótona.

      ### 6 · Comprobación

      Una definición se comprueba usándola. Con $a_n = -n^{2}$:

      | definición | ¿la cumple? | por qué |
      |---|---|---|
      | creciente | **no** | $a_2 = -4 < -1 = a_1$ |
      | acotada | **no** | no hay cota inferior: $a_n \to -\infty$ |
      | acotada superiormente | sí | $a_n \le -1$ para todo $n$ |
      | divergente a $-\infty$ | **sí** | dado $M$, basta $n_0 = \lceil\sqrt{\lvert M\rvert}\rceil$ |

      La tercera y la cuarta fila son la razón de ser de la definición de
      acotada: si bastara la cota superior, esta sucesión estaría acotada y
      divergiría a la vez.

      ### Resultado

      $
      \boxed{
      \begin{aligned}
      \text{creciente:}\;\; & a_{n+1} > a_n \;\; \forall n \
      \text{acotada:}\;\; & \exists\, p,q \in \mathbb{R} : p \le a_n \le q \;\; \forall n \
      \text{divergente a } -\infty:\;\; & \forall M \in \mathbb{R}\; \exists\, n_0 : n>n_0 \Rightarrow a_n < M
      \end{aligned}}
      $

