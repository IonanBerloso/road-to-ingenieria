  - id: unicidad-del-limite
    titulo: Por qué el límite es único
    fuente: >-
      Ejercicio 2.6 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2019/2020 1E) · El boletín remite al libro: la demostración es propuesta
      nuestra, pendiente de revisión.

    nivel: practica
    enunciado: |
      Demostrar que si el límite de una sucesión $\{x_n\}_{n\in\mathbb{N}}$
      existe, entonces es único.
    pide: Demostrar la unicidad del límite.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se demuestra que algo es único?
        opciones:
          - texto: >-
              Suponiendo que hay dos y demostrando que tienen que ser el mismo,
              o que su existencia es contradictoria
            correcta: true
            mensaje: |
              Ese es el esquema estándar de toda demostración de unicidad. Aquí
              se supone que hay dos límites distintos y se llega a un absurdo.
          - texto: Calculando el límite y comprobando que sale un solo número
            mensaje: |
              No hay ninguna sucesión concreta: la propiedad tiene que valer
              para todas. Y calcular un límite ya presupone que es único.
          - texto: Demostrando que la sucesión es monótona
            mensaje: |
              La monotonía no tiene nada que ver: sucesiones no monótonas
              también tienen límite único. La unicidad sale de la definición,
              no del comportamiento de la sucesión.
          - texto: Comprobándolo en varias sucesiones distintas
            mensaje: |
              Ejemplos, otra vez, no demuestran una propiedad universal.

      - tipo: calcular
        titulo: El épsilon
        pregunta: |
          Si se suponen dos límites $L_1 = 1$ y $L_2 = 1{,}4$, ¿qué
          $\varepsilon$ conviene tomar?
        respuesta:
          tipo: numero
          valor: '0.2'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.4'
            mensaje: |
              Con $\varepsilon = |L_1-L_2|$ los dos entornos se tocan y la
              contradicción deja de ser estricta. Con la mitad quedan disjuntos,
              que es lo que se necesita.
          - valor: '1.2'
            mensaje: |
              Ese es el punto medio entre los dos candidatos, no el épsilon. El
              épsilon es la **distancia** desde ese punto medio a cada uno.
          - valor: '0.7'
            mensaje: |
              Ese es la mitad de $L_2$, no la mitad de la distancia entre los
              dos. Lo que importa es cuánto se separan, $|L_1-L_2| = 0{,}4$.
        pista: |
          La distancia entre los dos candidatos es $0{,}4$. La mitad.
        desarrollo: |
          $$
          \varepsilon = \frac{|L_1-L_2|}{2} = \frac{0{,}4}{2} = 0{,}2
          $$

          Con ese valor los entornos $(L_1-\varepsilon, L_1+\varepsilon)$ y
          $(L_2-\varepsilon, L_2+\varepsilon)$ son **disjuntos**: uno acaba en
          $1{,}2$ y el otro empieza ahí.
        veredicto: |
          Cuatro ejercicios seguidos con el mismo épsilon: la mitad de la
          distancia. Es la herramienta básica de todo el tema.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Supongamos que $\{x_n\}$ tiene dos límites $L_1 \neq L_2$, y sea
              $\varepsilon = \dfrac{|L_1-L_2|}{2} > 0$.
          - texto: |
              Por ser $L_1$ límite, existe $m_1$ con
              $|x_n - L_1| < \varepsilon$ para $n>m_1$; por ser $L_2$ límite,
              existe $m_2$ con $|x_n - L_2| < \varepsilon$ para $n>m_2$.
          - texto: |
              Para $n > \max(m_1,m_2)$ se cumplen las dos, y por la desigualdad
              triangular
              $|L_1-L_2| \le |L_1-x_n| + |x_n-L_2| < \varepsilon + \varepsilon$.
          - texto: |
              Es decir, $|L_1-L_2| < |L_1-L_2|$, que es imposible. Luego
              $L_1 = L_2$.
          - texto: |
              Como los dos entornos son disjuntos, la sucesión no puede
              converger, y por eso el límite es único.
            trampa: true
            mensaje: |
              La conclusión no es que la sucesión no converja: el enunciado
              **parte** de que el límite existe. Lo que es imposible es que haya
              **dos distintos**. Confundir «no puede haber dos» con «no puede
              haber ninguno» invierte el resultado.
        veredicto: |
          La desigualdad triangular es la que cierra el argumento: mide la
          distancia entre los dos candidatos pasando por un término de la
          sucesión, que está cerca de los dos a la vez.

      - tipo: redactar
        consigna: |
          **Escribe la demostración entera en papel.** Es la tercera con
          rúbrica de este tema, y las tres comparten esqueleto: negar la tesis,
          elegir un épsilon que la haga imposible, y llegar a una desigualdad
          que se contradice a sí misma.

          Aquí hay dos sucesiones de índices en juego, uno por cada límite
          candidato, y ahí está el descuido que más veces la estropea.
        rubrica:
          - punto: |
              El **enunciado** y el planteamiento del absurdo: se suponen dos
              límites $L_1 \neq L_2$.
            porque: |
              Toda demostración de unicidad tiene esta forma, y decirlo de
              entrada le enseña al corrector que reconoces el esquema. «Sea $L$
              el límite» no plantea nada: da por supuesto lo que hay que
              demostrar.
          - punto: |
              El épsilon en función de la distancia entre los dos:
              $\varepsilon = \frac{|L_1-L_2|}{2}$, con **su positividad
              justificada** por $L_1 \neq L_2$.
            porque: |
              El $2$ del denominador no es decorativo: es lo que hace que las
              dos bolas no se toquen y que la contradicción salga estricta. Con
              $\varepsilon = |L_1-L_2|$ el argumento se queda a un pelo y no
              cierra.
          - punto: |
              **Dos índices distintos**, $m_1$ y $m_2$, y el
              $\max(m_1, m_2)$ para que las dos condiciones valgan a la vez.
            porque: |
              Es el mismo descuido que la otra demostración de este tema ya
              señala: cada límite da **su** índice, y no tienen por qué ser el
              mismo. Usar un único $m$ para los dos es la línea que separa una
              demostración cuidada de una que «se entiende».
          - punto: |
              La **desigualdad triangular** escrita, pasando por un término de
              la sucesión: $|L_1-L_2| \le |L_1-x_n| + |x_n-L_2|$.
            porque: |
              Es el único puente entre los dos límites, que no se tocan
              directamente. Sin ella no hay forma de comparar $L_1$ con $L_2$:
              lo que la definición da es la distancia de cada uno a los
              términos, no entre ellos.
          - punto: |
              El cierre: sale $|L_1-L_2| < |L_1-L_2|$, y por tanto los dos
              límites no pueden ser distintos.
            porque: |
              La contradicción es que un número sea estrictamente menor que sí
              mismo, y hay que escribirla tal cual. Quedarse en «llegamos a un
              absurdo» sin enseñar cuál es lo que deja el apartado a medias.
        veredicto: |
          Si tu demostración usa un solo índice $m$, todavía no está: reléela
          y mira de dónde sale. Es el fallo que comparten las tres
          demostraciones de este tema, y el que un corrector busca primero.

    resolucion: |
      > **Aviso.** El boletín remite al libro para este ejercicio. Lo que sigue
      > es una demostración propuesta, pendiente de revisión.

      **Enunciado.** Si el límite de $\{x_n\}$ existe, es único.

      ### 1 · Estrategia

      El esquema de toda demostración de unicidad: suponer que hay dos objetos
      distintos con la propiedad y llegar a una contradicción.

      ### 2 · La demostración

      Supongamos que $L_1$ y $L_2$ son límites de $\{x_n\}$ con
      $L_1 \neq L_2$. Entonces $|L_1 - L_2| > 0$ y se puede tomar

      $$
      \varepsilon = \frac{|L_1-L_2|}{2} > 0
      $$

      Por ser $L_1$ límite, existe $m_1$ tal que $|x_n - L_1| < \varepsilon$
      para todo $n>m_1$. Por ser $L_2$ límite, existe $m_2$ tal que
      $|x_n - L_2| < \varepsilon$ para todo $n>m_2$.

      Sea $n > \max(m_1, m_2)$: las dos desigualdades valen a la vez. Por la
      **desigualdad triangular**,

      $$
      |L_1 - L_2| = |L_1 - x_n + x_n - L_2| \le |L_1 - x_n| + |x_n - L_2|
        < \varepsilon + \varepsilon = |L_1-L_2|
      $$

      Es decir, $|L_1-L_2| < |L_1-L_2|$, que es imposible.

      La suposición era falsa, luego $L_1 = L_2$: **el límite es único**.
      $\blacksquare$

      ### 3 · La idea geométrica

      Con $\varepsilon$ igual a la mitad de la distancia, los dos entornos son
      **disjuntos**. Y un término de la sucesión tendría que estar dentro de los
      dos a la vez, que es imposible. La desigualdad triangular es la forma
      algebraica de decir exactamente eso.

      ### 4 · El épsilon de siempre

      Es el cuarto ejercicio seguido —2.3, 2.4, 2.5 y este— que se resuelve
      tomando **la mitad de la distancia** entre los dos valores en conflicto.
      Merece la pena quedarse con el patrón: cuando dos cantidades tienen que
      separarse, se parte la diferencia y se usa como margen.

      ### 5 · Comprobación

      Con los dos candidatos del paso de cálculo, $L_1 = 1$ y $L_2 = 1{,}4$, y
      $\varepsilon = 0{,}2$, los entornos son

      $
      \left(0{,}8,\; 1{,}2\right) \qquad\text{y}\qquad \left(1{,}2,\; 1{,}6\right)
      $

      **disjuntos**: se tocan en $1{,}2$, que no pertenece a ninguno por ser los
      dos abiertos. Un término $x_n$ con $n>\max(m_1,m_2)$ tendría que estar en
      los dos a la vez, y no hay ningún número real que lo esté.

      Conviene ver también qué falla con un $\varepsilon$ mayor. Con
      $\varepsilon = 0{,}4$ los entornos son $(0{,}6,\,1{,}4)$ y
      $(1{,}0,\,1{,}8)$, que **sí** se solapan: cualquier $x_n$ entre 1 y 1,4
      cumpliría las dos condiciones y no habría contradicción. Por eso el
      épsilon tiene que ser la mitad, y no cualquier cosa.

      ### Resultado

      $
      \boxed{\;\text{Si } \lim x_n \text{ existe, es único}\;}
      $

