  - id: desigualdad-en-el-limite
    titulo: Las desigualdades sobreviven al límite, pero debilitadas
    fuente: >-
      Ejercicio 2.5 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2018/2019 1E) · El boletín no publica solución: la demostración es
      propuesta nuestra, pendiente de revisión.

    nivel: practica
    enunciado: |
      Sean $\{x_n\}$ e $\{y_n\}$ dos sucesiones tales que $x_n \le y_n$ para
      todo $n \in \mathbb{N}$, con $\lim x_n = x$ y $\lim y_n = y$.
    pide: Demostrar formalmente que $x \le y$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que suponer para la reducción al absurdo?
        opciones:
          - texto: Que $x > y$, que es la negación de lo que se quiere probar
            correcta: true
            mensaje: |
              Eso es. La negación de $x \le y$ es $x > y$, y de ahí sale una
              distancia positiva, $x-y$, con la que construir el épsilon.
          - texto: Que $x < y$
            mensaje: |
              Eso no es la negación de $x\le y$: es un caso particular de lo que
              se quiere demostrar. Suponerlo no lleva a ninguna contradicción
              porque no hay nada que contradecir.
          - texto: Que las dos sucesiones son iguales
            mensaje: |
              No hay razón para suponerlo, y además el enunciado permite que
              sean distintas. La suposición del absurdo tiene que ser la
              negación exacta de la tesis.
          - texto: Que alguna de las dos no converge
            mensaje: |
              La convergencia es hipótesis del enunciado, no algo que se pueda
              negar. Lo que se niega es la **conclusión**.

      - tipo: calcular
        titulo: El épsilon
        pregunta: |
          Suponiendo $x = 2$ e $y = 1$, ¿qué $\varepsilon$ conviene tomar?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Con $\varepsilon = x-y = 1$ los dos entornos se tocan justo en el
              punto medio y la contradicción no es estricta. Con la mitad, los
              entornos quedan separados y el choque es limpio.
          - valor: '1.5'
            mensaje: |
              Ese es el punto medio entre $x$ e $y$, que sí aparece en la
              demostración —es la frontera que separa los dos entornos—, pero no
              es el $\varepsilon$.
          - valor: '2'
            mensaje: |
              Ese es el valor de $x$. Con un épsilon tan grande los dos entornos
              se solapan por completo y no hay nada que contradecir.
        pista: |
          La distancia entre los dos límites es $x-y = 1$. La mitad.
        desarrollo: |
          $$
          \varepsilon = \frac{x-y}{2} = \frac{2-1}{2} = 0{,}5
          $$

          Con ese valor, a partir de cierto índice
          $x_n > x - \varepsilon = 1{,}5$ y $y_n < y + \varepsilon = 1{,}5$, así
          que $y_n < x_n$: lo contrario de la hipótesis.
        veredicto: |
          El punto medio $1{,}5$ es la frontera: los $x_n$ acaban por encima y
          los $y_n$ por debajo.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Por reducción al absurdo, supongamos $x > y$, y sea
              $\varepsilon = \dfrac{x-y}{2} > 0$.
          - texto: |
              Por converger $x_n \to x$, existe $m_1$ con
              $x_n > x - \varepsilon = \dfrac{x+y}{2}$ para todo $n>m_1$.
          - texto: |
              Por converger $y_n \to y$, existe $m_2$ con
              $y_n < y + \varepsilon = \dfrac{x+y}{2}$ para todo $n>m_2$.
          - texto: |
              Tomando $n > \max(m_1, m_2)$ se cumplen las dos a la vez, y
              entonces $y_n < \dfrac{x+y}{2} < x_n$.
          - texto: |
              Eso contradice $x_n \le y_n$. Luego $x \le y$.
          - texto: |
              Basta tomar $m_1$, porque si la desigualdad se cumple para una
              sucesión, se cumple para las dos.
            trampa: true
            mensaje: |
              Cada sucesión tiene **su propio** índice: los dos $\varepsilon$
              son iguales pero los $m$ no tienen por qué serlo. Por eso hay que
              tomar el máximo de los dos, que es el punto a partir del cual las
              dos condiciones valen a la vez. Olvidarlo es el descuido más común
              en las demostraciones con dos sucesiones.
        veredicto: |
          Ese $\max(m_1,m_2)$ es la pieza que distingue una demostración
          cuidada de una que «se entiende».

      - tipo: redactar
        consigna: |
          Cierra todo lo anterior y **escribe la demostración entera en papel**,
          de principio a fin: enunciado, hipótesis, la negación de la tesis, el
          épsilon con su justificación, el término a partir del cual, y la
          contradicción.

          Esta propiedad ha caído **ocho de los últimos once años**, y en dos
          parejas de cursos el enunciado era idéntico palabra por palabra. Es
          la demostración que más rinde de todo el examen.
        rubrica:
          - punto: |
              El **enunciado completo**, con sus hipótesis, antes de empezar.
            porque: |
              Una demostración que arranca en «supongamos que $x>y$» deja sin
              decir qué se está demostrando. El corrector necesita ver que
              sabes qué se te da y qué tienes que llegar a probar.
          - punto: |
              El $\forall\varepsilon>0$ **antes** del $\exists m$, en ese orden.
            porque: |
              Es el orden de los cuantificadores de la definición, y es lo que
              distingue converger de no converger. Invertirlos afirma algo
              mucho más fuerte y falso: que un mismo $m$ vale para todos los
              épsilon a la vez.
          - punto: |
              **De qué depende el $m$**: se elige después de $\varepsilon$ y en
              función de él.
            porque: |
              Si no se dice, la demostración parece afirmar que existe un $m$
              universal. Basta con escribir «existe $m$, que dependerá de
              $\varepsilon$».
          - punto: |
              Por qué el épsilon elegido **es positivo**.
            porque: |
              Aquí es $\varepsilon = \frac{x-y}{2}$, y solo es positivo porque
              se ha supuesto $x>y$. Sin esa línea, la elección parece sacada de
              la manga — y es justo la bisagra del argumento.
          - punto: |
              El **máximo de los dos $m$** cuando hay dos sucesiones.
            porque: |
              Cada sucesión da el suyo, y las dos desigualdades solo valen a la
              vez a partir del mayor. Es el descuido más frecuente y el más
              barato de evitar.
          - punto: |
              La **contradicción explícita**, y la conclusión escrita.
            porque: |
              Llegar a $x_n>y_n$ y parar ahí deja el trabajo a medias: hay que
              decir que contradice la hipótesis, que por tanto $x>y$ era
              imposible, y que en consecuencia $x\le y$.
        veredicto: |
          Fíjate en lo que **no** está en la rúbrica: ninguna cuenta. El examen
          reparte este ejercicio como 0 de cálculo y 8 a 10 de explicación
          formal, y la lista de arriba es literalmente dónde están esos puntos.

    resolucion: |
      > **Aviso.** El boletín no publica solución de este ejercicio. Lo que
      > sigue es una demostración propuesta, pendiente de revisión.

      **Enunciado.** Si $x_n \le y_n$ para todo $n$, $x_n \to x$ e $y_n \to y$,
      entonces $x \le y$.

      ### 1 · Estrategia

      Reducción al absurdo. La negación de la tesis es $x > y$, y de ahí sale
      una distancia positiva con la que fabricar el épsilon.

      ### 2 · La demostración

      Supongamos $x > y$ y tomemos

      $$
      \varepsilon = \frac{x-y}{2} > 0
      $$

      Por la convergencia de $\{x_n\}$, existe $m_1$ tal que para $n>m_1$

      $$
      |x_n - x| < \varepsilon \;\Longrightarrow\; x_n > x - \varepsilon = \frac{x+y}{2}
      $$

      Por la de $\{y_n\}$, existe $m_2$ tal que para $n>m_2$

      $$
      |y_n - y| < \varepsilon \;\Longrightarrow\; y_n < y + \varepsilon = \frac{x+y}{2}
      $$

      Tomando $n > \max(m_1, m_2)$ se cumplen **las dos a la vez**:

      $$
      y_n < \frac{x+y}{2} < x_n
      $$

      es decir, $y_n < x_n$, en contra de la hipótesis $x_n \le y_n$.
      Contradicción, luego $x \le y$. $\blacksquare$

      ### 3 · Dos detalles que valen nota

      **El máximo de los dos índices.** Cada sucesión aporta su propio $m$. Hay
      que quedarse con el mayor para que las dos desigualdades valgan
      simultáneamente; escribir uno solo es un descuido frecuente.

      **La desigualdad se debilita.** Aunque la hipótesis fuera estricta,
      $x_n < y_n$, la conclusión seguiría siendo $x \le y$ y no $x<y$. El
      ejemplo: $x_n = 0$ e $y_n = \frac1n$ cumplen $x_n < y_n$ para todo $n$, y
      sus límites son iguales, ambos 0.

      ### 4 · Relación con el ejercicio 2.3

      El 2.3 es el caso particular $x_n = 0$: si $0 \le a_n$ y ambas convergen,
      entonces $0 \le L$. La misma demostración, con una de las sucesiones
      constante.

      ### 5 · Comprobación

      Se pone a prueba la maquinaria con $x=2$ e $y=1$, los números del paso de
      cálculo, y se ve que la hipótesis $x_n \le y_n$ **se rompe sola**:

      $
      x_n = 2 - \frac1n \;\to\; 2, \qquad y_n = 1 + \frac1n \;\to\; 1
      $

      | $n$ | $x_n$ | $y_n$ | ¿$x_n \le y_n$? |
      |---|---|---|---|
      | 1 | $1$ | $2$ | sí |
      | 2 | $1{,}5$ | $1{,}5$ | sí (empate) |
      | 3 | $1{,}67$ | $1{,}33$ | **no** |
      | 4 | $1{,}75$ | $1{,}25$ | **no** |

      A partir de $n=3$ la desigualdad se invierte y ya no vuelve. Coincide con
      lo que anuncia la demostración: con $\varepsilon = \frac{x-y}{2} = 0{,}5$
      salen $m_1 = m_2 = 2$, y el cruce ocurre justo en $n > \max(m_1,m_2) = 2$.

      Es decir, la cuenta del $\max$ no era un tecnicismo: predice el índice
      exacto a partir del cual aparece la contradicción.

      ### Resultado

      $
      \boxed{\;x_n \le y_n \;\;\forall n,\;\; x_n \to x,\;\; y_n \to y
      \;\;\Longrightarrow\;\; x \le y\;}
      $

