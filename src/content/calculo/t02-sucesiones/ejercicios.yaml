  - id: parametros-supremo-infimo
    titulo: Dos parámetros a partir del supremo y el ínfimo
    fuente: >-
      Ejercicio 2.10 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2018/2019 7E)

    nivel: practica
    enunciado: |
      Dados $a, b \in \mathbb{R}$, se considera la sucesión

      $$
      x_n = \begin{cases} -\dfrac{a}{n} & n < 10 \\[6pt]
      b\,(-1)^{n} & n \ge 10 \end{cases}
      $$

      Se sabe que $M=3$ es el supremo, $m=-2$ el ínfimo, y que
      $|x_{10}-x_{9}| = \dfrac{7}{3}$.
    pide: >-
      Determinar $a$ y $b$, y estudiar el crecimiento y la convergencia de la
      sucesión.

    pasos:
      - tipo: reconocer
        pregunta: |
          Tres datos y dos incógnitas. ¿Cuál conviene usar primero?
        opciones:
          - texto: >-
              El ínfimo, porque el segundo tramo solo puede tomar dos valores:
              $b$ y $-b$
            correcta: true
            mensaje: |
              Eso es. Para $n\ge 10$ la sucesión solo alterna entre $b$ y $-b$,
              y el primer tramo es finito. El ínfimo $-2$ tiene que salir de
              alguno de esos dos valores, y eso fija $|b| = 2$ casi de
              inmediato.
          - texto: La condición $|x_{10}-x_9| = \frac73$, porque es la más concreta
            mensaje: |
              Es útil, pero mezcla las dos incógnitas en una sola ecuación con
              valor absoluto: sale más largo. Conviene dejarla para confirmar,
              o para desempatar el signo.
          - texto: Calcular el límite, que fijará los dos parámetros
            mensaje: |
              La sucesión no converge para ningún valor de $b\ne0$: alterna para
              siempre entre $b$ y $-b$. No hay límite del que tirar.
          - texto: Derivar respecto de $n$ para ver dónde está el máximo
            mensaje: |
              Una sucesión no se deriva: su variable es un número natural, no
              continua. Los extremos se buscan mirando los valores que toma.

      - tipo: calcular
        titulo: El primer parámetro
        pregunta: |
          El supremo es 3. ¿Cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '-3'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              Signo cambiado. El primer tramo es $-\frac{a}{n}$, con un menos
              delante: para que $x_1$ valga $+3$ hace falta $a=-3$. Con $a=3$
              todos los términos serían negativos y el supremo no podría ser 3.
          - valor: '0.333'
            mensaje: |
              Ese es $x_9 = \frac13$, el **último** término del primer tramo. El
              supremo es el primero, $x_1$, porque ese tramo decrece.
          - valor: '2'
            mensaje: |
              El 2 sale del ínfimo, que fija $|b|$, no $a$. El supremo 3 es el
              que determina el primer parámetro.
        pista: |
          El mayor valor del primer tramo está en $n=1$: $x_1 = -a$. Y el
          supremo es 3.
        desarrollo: |
          En el tramo $x_n = -\frac{a}{n}$ el mayor valor —si $a<0$— es el de
          $n=1$:

          $$
          x_1 = -a = 3 \;\Longrightarrow\; a = -3
          $$

          El primer tramo queda $x_n = \frac{3}{n}$: nueve términos que van de 3
          a $\frac13$.
        veredicto: |
          El supremo se alcanza en el primer término, así que aquí es máximo
          además de supremo.

      - tipo: calcular
        titulo: El segundo parámetro
        pregunta: |
          Con el ínfimo $-2$ y el salto $|x_{10}-x_9| = \frac73$, ¿cuánto vale
          $b$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              El ínfimo solo fija $|b| = 2$: los dos signos dan los mismos dos
              valores, $2$ y $-2$. Lo que desempata es el salto: con $b=2$
              saldría $\left|2-\frac13\right| = \frac53$, y hace falta
              $\frac73$.
          - valor: '-3'
            mensaje: |
              Ese es el valor de $a$. El segundo tramo alterna entre $b$ y $-b$,
              y su valor más pequeño es $-|b| = -2$.
          - valor: '2.333'
            mensaje: |
              $\frac73$ es el tamaño del salto entre $x_9$ y $x_{10}$, no el
              valor de $b$. Hay que despejarlo de
              $\left|b-\frac13\right| = \frac73$.
        pista: |
          $x_9 = \frac13$ y $x_{10} = b\,(-1)^{10} = b$. Prueba los dos signos
          en $\left|b-\frac13\right| = \frac73$.
        desarrollo: |
          El ínfimo da $|b| = 2$, porque para $n\ge10$ los valores son $b$ y
          $-b$ y el menor es $-|b|$.

          Para el signo, el salto. Con $x_9 = \frac13$ y $x_{10} = b$:

          $$
          \left|b - \frac13\right| = \frac73
          $$

          Con $b=2$: $\left|2-\frac13\right| = \frac53$ ✗

          Con $b=-2$: $\left|-2-\frac13\right| = \frac73$ ✔

          Luego $b = -2$.
        veredicto: |
          Ninguno de los tres datos sobra: el supremo da $a$, el ínfimo da
          $|b|$, y el salto desempata su signo.

      - tipo: justificar
        pregunta: |
          Ordena el estudio del crecimiento y la convergencia. Una de las piezas
          no debe entrar.
        piezas:
          - texto: |
              Con $a=-3$ y $b=-2$, la sucesión es $\frac3n$ para $n<10$ y
              alterna entre $-2$ y $2$ para $n \ge 10$.
          - texto: |
              El primer tramo **decrece**: $3,\ \frac32,\ 1,\ \dots,\ \frac13$.
          - texto: |
              El segundo tramo alterna: sube de $-2$ a $2$ y baja de $2$ a
              $-2$, infinitas veces.
          - texto: |
              Al haber tramos que suben y tramos que bajan, la sucesión no es
              creciente ni decreciente; y al alternar para siempre entre dos
              valores distintos, tampoco converge.
          - texto: |
              Como la sucesión está acotada entre $-2$ y $3$, converge a algún
              punto intermedio.
            trampa: true
            mensaje: |
              Estar acotada no basta, y «algún punto intermedio» no es un
              argumento. Los términos se quedan pegados a $-2$ y a $2$
              alternativamente, sin acercarse a nada: no hay ningún valor del
              que disten cada vez menos.
        veredicto: |
          Ni creciente, ni decreciente, ni convergente. Los tres «no» son la
          respuesta del apartado (b).

    resolucion: |
      **Datos.** $x_n = -\frac{a}{n}$ si $n<10$ y $x_n = b(-1)^{n}$ si
      $n \ge 10$, con supremo 3, ínfimo $-2$ y $|x_{10}-x_9| = \frac73$.

      **La estrategia.** Hay dos incógnitas y tres datos, así que el problema
      está sobredeterminado: sobra información. Eso no es un descuido del
      enunciado, es la estructura del ejercicio, y la forma de resolverlo es
      **repartir los datos**, no plantear un sistema.

      El reparto sale de mirar qué puede producir cada cosa. El supremo y el
      ínfimo son valores extremos, y cada tramo solo puede aportar uno de los
      dos: el primero es monótono y su extremo está en $n=1$; el segundo solo
      toma dos valores, $b$ y $-b$. Identificar **de qué tramo viene cada
      extremo** es el paso que decide el ejercicio; lo demás es despejar.

      El tercer dato, el salto, no da un valor nuevo: **desempata un signo** que
      los otros dos dejan indeterminado. Conviene verlo desde el principio para
      no buscarle otra utilidad.

      ### 1 · El supremo fija $a$

      El segundo tramo solo toma los valores $b$ y $-b$. Si el supremo es 3 y
      $|b|$ resultara ser 3, el ínfimo sería $-3$ y no $-2$. Así que el 3 tiene
      que venir del primer tramo.

      En ese tramo, $x_n = -\frac{a}{n}$. Para que tome valores positivos hace
      falta $a<0$, y entonces el mayor es el de $n=1$:

      $$
      x_1 = -a = 3 \;\Longrightarrow\; a = -3
      $$

      El primer tramo queda $x_n = \frac{3}{n}$: nueve términos que van de 3 a
      $\frac13$.

      ### 2 · El ínfimo fija $|b|$

      Para $n\ge10$ los valores son $b$ y $-b$, y el menor es $-|b|$. Como el
      primer tramo es todo positivo, el ínfimo tiene que salir de aquí:

      $$
      -|b| = -2 \;\Longrightarrow\; |b| = 2
      $$

      ### 3 · El salto desempata el signo

      $$
      x_9 = \frac{3}{9} = \frac13, \qquad x_{10} = b\,(-1)^{10} = b
      $$

      $$
      |x_{10}-x_9| = \left|b-\frac13\right| = \frac73
      $$

      Con $b=2$: $\left|2-\frac13\right| = \frac53 \neq \frac73$ ✗

      Con $b=-2$: $\left|-2-\frac13\right| = \frac73$ ✔

      Luego $b = -2$.

      ### 4 · Crecimiento y convergencia

      La sucesión es $3,\ \frac32,\ 1,\ \frac34,\ \dots,\ \frac13$ y a partir de
      $n=10$ alterna $-2,\ 2,\ -2,\ 2,\dots$

      - **No es creciente:** decrece en todo el primer tramo.
      - **No es decreciente:** sube de $-2$ a $2$ infinitas veces.
      - **No converge:** los términos se quedan pegados a $-2$ y a $2$
        alternativamente. Con $\varepsilon=1$, ningún valor $L$ puede tener a
        la vez cerca a los dos.

      Está acotada —entre $-2$ y 3— y aun así no converge: otro recordatorio de
      que la acotación por sí sola no basta.

      ### 5 · Comprobación

      Con $a=-3$ y $b=-2$ se reconstruye la sucesión y se contrastan los tres
      datos del enunciado, que es la única forma de saber que no se ha colado un
      signo:

      $
      x_1,\dots,x_9 = 3,\ \tfrac32,\ 1,\ \tfrac34,\ \tfrac35,\ \tfrac12,\
      \tfrac37,\ \tfrac38,\ \tfrac13
      \qquad
      x_{10},x_{11},\dots = -2,\ 2,\ -2,\ 2,\dots
      $

      - **Supremo 3** ✔ — es $x_1$, y ningún término del segundo tramo pasa de 2.
      - **Ínfimo $-2$** ✔ — el primer tramo es todo positivo, así que solo puede
        venir del segundo.
      - **Salto $\frac73$** ✔ — $\left|-2 - \frac13\right| = \frac73$.

      Los tres datos son necesarios: sin el del salto quedarían dos soluciones,
      $b=2$ y $b=-2$, y solo una da el salto que pide el enunciado.

      ### Resultado

      $$
      \boxed{\;a=-3,\quad b=-2;\quad \text{ni creciente, ni decreciente, ni convergente}\;}
      $$

