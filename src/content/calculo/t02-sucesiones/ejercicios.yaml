  # ═══════════════════════════════════════════════════════════════════
  # Ejemplos introductorios del tema 2.
  #
  # Nuestros, no de examen ni del boletín, y su `fuente` lo dice. Existen
  # porque el ejercicio más simple del boletín de sucesiones ya son tres pasos
  # de nivel examen, así que no había por dónde entrar.
  #
  # Mismo criterio que en complejos: una sola idea, números que salen a mano,
  # tres o cuatro pasos. En cuanto uno necesita dos herramientas, ya lo cubre
  # el boletín.
  # ═══════════════════════════════════════════════════════════════════

  - id: ej-serie-decidida-en-la-grafica
    titulo: Una serie que se decide mirando un dibujo
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. Prepara el enunciado de la
      primera evaluación de 2024-2025, donde la convergencia de una serie se
      decide leyendo una gráfica, y que no tenía rampa ninguna: el tema 2 no
      tenía una sola figura en sus ejemplos. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      La figura es la gráfica de una función $g(x)$. Considera la serie

      $$
      S(x) = \sum_{k=1}^{\infty} k\,\big(g(x)\big)^{k}
      $$

      <figure>
