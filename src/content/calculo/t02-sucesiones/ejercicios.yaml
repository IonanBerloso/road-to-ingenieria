  - id: comparar-infinitesimos
    titulo: Comparar sucesiones que tienden a cero
    fuente: >-
      Ejercicio 2.12 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2013/2014 7E)

    nivel: practica
    enunciado: |
      Se consideran las sucesiones

      $$
      \text{(a) } \left\{\frac{1}{n}\right\} \quad
      \text{(b) } \left\{\frac{1}{n^{2}}\right\} \quad
      \text{(c) } \left\{\frac{(-1)^{n}}{n}\right\} \quad
      \text{(d) } \left\{\frac{1}{n+100}\right\}
      $$
    pide: >-
      Calcular sus límites y elegir, para cada caso, dos de ellas tales que
      (i) $\lim \frac{x_n}{y_n}=0$; (ii) $=1$; (iii) $=\infty$; (iv) no exista
      pero la sucesión esté acotada.

    pasos:
      - tipo: reconocer
        pregunta: |
          Las cuatro tienden a 0. Entonces, ¿por qué sus cocientes dan cosas
          distintas?
        opciones:
          - texto: >-
              Porque tender a cero no dice a qué **velocidad**, y el cociente
              compara precisamente eso
            correcta: true
            mensaje: |
              Exacto. Todas son infinitésimos, pero unos van más deprisa que
              otros: $\frac{1}{n^{2}}$ se hace pequeño mucho antes que
              $\frac1n$. El cociente mide esa comparación, y por eso puede dar
              0, 1, infinito o nada.
          - texto: Porque alguna de ellas en realidad no tiende a cero
            mensaje: |
              Las cuatro tienden a 0, incluida $\frac{(-1)^{n}}{n}$: su valor
              absoluto es $\frac1n$, que tiende a 0, y eso basta.
          - texto: Porque el cociente de dos sucesiones convergentes es siempre indeterminado
            mensaje: |
              No siempre: si el denominador tiende a algo distinto de cero, el
              cociente tiende al cociente de los límites. La indeterminación
              aparece justo aquí, porque **los dos** tienden a cero: es el caso
              $\frac00$.
          - texto: Porque el límite de un cociente no existe si el denominador tiende a 0
            mensaje: |
              Puede existir perfectamente. $\frac{1/n^{2}}{1/n} = \frac1n$
              tiende a 0 aunque el denominador se anule en el límite. Lo que hay
              es una indeterminación que se resuelve simplificando.

      - tipo: calcular
        titulo: El cociente que da infinito
        pregunta: |
          Para el caso (iii), $\lim \frac{x_n}{y_n} = \infty$, se toman
          $x_n = \frac1n$ e $y_n = \frac{1}{n^{2}}$. ¿A qué es igual ese
          cociente, simplificado, para $n = 7$?
        respuesta:
          tipo: numero
          valor: '7'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0.142857'
            mensaje: |
              Has calculado el cociente al revés,
              $\frac{1/n^{2}}{1/n} = \frac1n$. Ese es el caso (i), el que tiende
              a 0.
          - valor: '49'
            mensaje: |
              Has multiplicado en vez de dividir:
              $\frac1n \cdot \frac{1}{n^{2}}$ no, el cociente es
              $\frac{1}{n}\cdot n^{2} = n$.
          - valor: '1'
            mensaje: |
              El cociente vale 1 solo si las dos van a la misma velocidad, que
              es el caso (ii) con $\frac1n$ y $\frac{1}{n+100}$. Aquí una es el
              cuadrado de la otra.
        pista: |
          Dividir entre una fracción es multiplicar por su inversa:
          $\frac{1/n}{1/n^{2}} = \frac{n^{2}}{n}$.
        desarrollo: |
          $$
          \frac{x_n}{y_n} = \frac{1/n}{1/n^{2}} = \frac{n^{2}}{n} = n
          $$

          Para $n=7$ vale 7, y cuando $n \to \infty$ el cociente tiende a
          infinito.
        veredicto: |
          $\frac{1}{n^{2}}$ tiende a cero **más deprisa** que $\frac1n$, y por
          eso al dividir la lenta entre la rápida el cociente se dispara.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento del caso (iv): un cociente cuyo límite no
          existe pero que está acotado. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Se toman $x_n = \frac{(-1)^{n}}{n}$ e $y_n = \frac{1}{n}$, las dos
              con límite 0.
          - texto: |
              Al dividir, los factores $\frac1n$ se cancelan y queda
              $\frac{x_n}{y_n} = (-1)^{n}$.
          - texto: |
              La sucesión $(-1)^{n}$ va saltando entre $-1$ y $1$ sin
              estabilizarse: no tiene límite.
          - texto: |
              Pero está acotada: todos sus términos están entre $-1$ y $1$.
          - texto: |
              Como el límite no existe, la sucesión no puede estar acotada.
            trampa: true
            mensaje: |
              Justo al revés de lo que dice el teorema. Toda sucesión
              **convergente** está acotada, pero el recíproco es falso: hay
              acotadas que no convergen, y $(-1)^{n}$ es el ejemplo de manual.
              Que el enunciado pida exactamente ese caso es la pista de que se
              está evaluando esta distinción.
        veredicto: |
          Convergente $\Rightarrow$ acotada. Acotada $\not\Rightarrow$
          convergente. La flecha va en un solo sentido, y este apartado existe
          para comprobar que lo sabes.

    resolucion: |
      **Datos.** Cuatro sucesiones: $\frac1n$, $\frac{1}{n^{2}}$,
      $\frac{(-1)^{n}}{n}$ y $\frac{1}{n+100}$.

      ### 1 · Los límites

      Las cuatro tienden a **0**. Para la tercera conviene decir por qué:
      $\left|\frac{(-1)^{n}}{n}\right| = \frac1n \to 0$, y una sucesión cuyo
      valor absoluto tiende a cero tiende a cero.

      ### 2 · Por qué los cocientes dan cosas distintas

      Todas son infinitésimos, pero **no todos van a la misma velocidad**. El
      cociente de dos de ellas es una indeterminación $\frac{0}{0}$ que se
      resuelve simplificando, y el resultado mide cuál se hace pequeña antes.

      ### 3 · Los cuatro casos

      **(i) Límite 0.** Se pone arriba la que tiende a cero **más deprisa**:

      $$
      \frac{1/n^{2}}{1/n} = \frac{1}{n} \longrightarrow 0
      $$

      **(ii) Límite 1.** Dos que van a la misma velocidad:

      $$
      \frac{1/n}{1/(n+100)} = \frac{n+100}{n} = 1 + \frac{100}{n} \longrightarrow 1
      $$

      El $+100$ es irrelevante en el infinito: por eso el límite es exactamente 1.

      **(iii) Límite infinito.** El caso (i) al revés:

      $$
      \frac{1/n}{1/n^{2}} = n \longrightarrow \infty
      $$

      **(iv) Sin límite, pero acotada.**

      $$
      \frac{(-1)^{n}/n}{1/n} = (-1)^{n}
      $$

      Los factores $\frac1n$ se cancelan y queda una sucesión que alterna entre
      $-1$ y $1$. No tiene límite —no se estabiliza en ningún valor— pero está
      acotada entre $-1$ y $1$.

      ### 4 · La moraleja del apartado (iv)

      Es la que el ejercicio quiere dejar clara: **toda sucesión convergente
      está acotada, pero no toda acotada converge.** La implicación va en un
      solo sentido, y $(-1)^{n}$ es el contraejemplo estándar.

      ### 5 · Comprobación

      Los cuatro cocientes, evaluados en un $n$ grande, tienen que apuntar al
      límite anunciado:

      | cociente | $n=10$ | $n=1000$ | límite |
      |---|---|---|---|
      | (i) $\frac{1/n^{2}}{1/n}$ | $0{,}1$ | $0{,}001$ | $0$ ✔ |
      | (ii) $\frac{1/n}{1/(n+100)}$ | $11$ | $1{,}1$ | $1$ ✔ |
      | (iii) $\frac{1/n}{1/n^{2}}$ | $10$ | $1000$ | $\infty$ ✔ |
      | (iv) $\frac{(-1)^{n}/n}{1/n}$ | $1$ | $1$ | no existe |

      El (ii) merece un vistazo: en $n=10$ vale 11, muy lejos de 1. Converge,
      pero despacio, porque el $+100$ tarda en hacerse irrelevante. Que un
      término esté lejos del límite no dice nada; lo que cuenta es a dónde va.

      Y el (iv) enseña por qué evaluar en un solo $n$ no basta: en $n=1000$ vale
      $1$, pero en $n=999$ vale $-1$. Mirando un único término parecería
      convergente.

      ### Resultado

      $$
      \boxed{\;L=0 \text{ en las cuatro};\quad
      \text{(i) } \tfrac{1/n^{2}}{1/n};\;
      \text{(ii) } \tfrac{1/n}{1/(n+100)};\;
      \text{(iii) } \tfrac{1/n}{1/n^{2}};\;
      \text{(iv) } \tfrac{(-1)^{n}/n}{1/n}\;}
      $$

