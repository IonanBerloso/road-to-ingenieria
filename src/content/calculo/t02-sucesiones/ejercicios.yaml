  - id: limite-de-no-negativos
    titulo: El límite de una sucesión de términos no negativos
    fuente: >-
      Ejercicio 2.3 · Problemas complementarios, tema 2 · Cálculo, UPV/EHU
      (2016/2017 1E) · El boletín remite al libro: la demostración es propuesta
      nuestra, pendiente de revisión.

    nivel: practica
    enunciado: |
      Demostrar la siguiente propiedad: si $a_n \ge 0$ para todo
      $n \in \mathbb{N}$ y $\{a_n\}$ converge hacia $L$, entonces $L \ge 0$.
    pide: Demostrar formalmente la propiedad.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se demuestra que un número **no** puede ser negativo?
        opciones:
          - texto: >-
              Suponiendo que sí lo es y llegando a una contradicción
            correcta: true
            mensaje: |
              Eso es. Es una desigualdad no estricta, y las no estrictas se
              demuestran casi siempre por reducción al absurdo: se supone lo
              contrario, $L<0$, y se busca el choque.
          - texto: Calculando el límite y viendo que sale positivo
            mensaje: |
              No hay ninguna sucesión concreta que calcular: el enunciado habla
              de **cualquier** sucesión con esa propiedad. Una demostración no
              puede depender de un caso.
          - texto: Comprobándolo con varios ejemplos de sucesiones positivas
            mensaje: |
              Los ejemplos no demuestran una propiedad universal. Sirven para
              entenderla o para refutarla, no para probarla.
          - texto: Aplicando que el límite de una suma es la suma de los límites
            mensaje: |
              Esa propiedad es útil en otros contextos, pero aquí no hay ninguna
              suma que descomponer: hay una desigualdad sobre los términos.

      - tipo: calcular
        titulo: El épsilon que hace saltar la contradicción
        pregunta: |
          Si se supone $L = -0{,}4$, sirve cualquier $\varepsilon$ que deje el
          intervalo $(L-\varepsilon,\,L+\varepsilon)$ entero por debajo de cero.
          ¿Cuál es **el mayor** que sirve?
        respuesta:
          tipo: numero
          valor: '0.4'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.8'
            mensaje: |
              Con $\varepsilon = 2|L|$ el extremo derecho es
              $L+\varepsilon = 0{,}4$, o sea **positivo**: la definición solo
              garantiza $a_n < 0{,}4$, y eso no choca con $a_n \ge 0$. No hay
              absurdo.
          - valor: '0.5'
            mensaje: |
              Te pasas: $L+\varepsilon = 0{,}1 > 0$. Mientras el extremo derecho
              sea positivo no hay contradicción, porque $a_n$ puede estar entre
              $0$ y $0{,}1$ sin incumplir nada.
          - valor: '-0.4'
            mensaje: |
              $\varepsilon$ tiene que ser **positivo**: la definición dice «para
              todo $\varepsilon>0$». Un épsilon negativo no describe ningún
              entorno.
          - valor: '0.2'
            mensaje: |
              Sirve, y es la elección que hacen muchos libros —la mitad de la
              distancia—, pero no es **el mayor**. Con $\varepsilon=0{,}4$ el
              extremo derecho es exactamente $0$, y la desigualdad de la
              definición es **estricta**: $a_n < 0$, no $a_n \le 0$. Así que el
              choque con $a_n\ge 0$ sigue siendo limpio.
        pista: |
          El extremo derecho del intervalo es $L+\varepsilon$. Busca el mayor
          $\varepsilon$ que lo deja en $0$ o por debajo.
        desarrollo: |
          Se toma

          $$
          \varepsilon = |L| = 0{,}4
          \qquad\Longrightarrow\qquad
          a_n < L+\varepsilon = 0
          $$

          y ese $<$ es estricto, porque la definición de límite dice
          $\left|a_n-L\right| < \varepsilon$ con desigualdad estricta. Luego
          $a_n < 0$ para todo $n$ grande, que choca de frente con
          $a_n \ge 0$.

          Con ese $\varepsilon$, a partir de cierto $m$ todos los términos
          cumplen

          $$
          a_n < L + \varepsilon = -0{,}4 + 0{,}2 = -0{,}2 < 0
          $$

          y eso contradice $a_n \ge 0$.
        veredicto: |
          «La mitad de la distancia» es el mismo truco que aparece en la
          unicidad del límite y en los ejercicios 2.4 y 2.5. Conviene tenerlo
          como reflejo.

      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Por reducción al absurdo, supongamos que $L < 0$.
          - texto: |
              Se toma $\varepsilon = \dfrac{|L|}{2} = -\dfrac{L}{2} > 0$, que es
              positivo precisamente porque $L$ es negativo.
          - texto: |
              Por definición de límite existe $m$ tal que
              $|a_n - L| < \varepsilon$ para todo $n>m$; en particular
              $a_n < L + \varepsilon = \dfrac{L}{2} < 0$.
          - texto: |
              Pero el enunciado dice que $a_n \ge 0$ para todo $n$.
              Contradicción, luego $L \ge 0$.
          - texto: |
              Como todos los términos son no negativos, su límite es
              estrictamente positivo.
            trampa: true
            mensaje: |
              El límite puede ser **exactamente cero**: $a_n = \frac1n$ tiene
              todos sus términos positivos y tiende a 0. Por eso el enunciado
              dice $L \ge 0$ y no $L > 0$. Las desigualdades estrictas no se
              conservan al pasar al límite; las no estrictas sí.
        veredicto: |
          Esa es la moraleja del ejercicio: al tomar límites, «$>$» se degrada a
          «$\ge$». Es la razón de que el enunciado esté escrito así.

      - tipo: redactar
        consigna: |
          **Escribe la demostración entera en papel**: enunciado, la suposición
          del absurdo, el épsilon elegido con su justificación, el término a
          partir del cual, y dónde está la contradicción.

          Es la hermana de la desigualdad en el límite —la otra propiedad de
          este tema con rúbrica— y las dos juntas cubren **doce ejercicios de
          examen en diez cursos**. Son la misma técnica: negar la tesis y
          elegir un épsilon que la haga imposible.
        rubrica:
          - punto: |
              El **enunciado completo** antes de empezar: qué se supone
              ($a_n \ge 0$ para todo $n$, y $a_n \to L$) y qué hay que probar
              ($L \ge 0$).
            porque: |
              Es lo mismo que se le exige a la otra demostración de este tema,
              y por el mismo motivo: una demostración que arranca en «supongamos
              $L<0$» no ha dicho todavía qué está demostrando.
          - punto: |
              Decir **que es por reducción al absurdo** y por qué: se supone
              $L<0$.
            porque: |
              La conclusión es una desigualdad no estricta, y esas casi nunca
              se demuestran de frente. Nombrar la técnica no es adorno: le dice
              al corrector que la contradicción que viene después es el final
              buscado y no un error.
          - punto: |
              El épsilon **elegido explícitamente** —$\varepsilon = -L$, o
              $|L|$, o $-L/2$— y la línea que dice **por qué es positivo**.
            porque: |
              Solo es positivo porque se ha supuesto $L<0$, y esa es
              exactamente la hipótesis del absurdo. Sin esa línea la elección
              parece sacada de la nada, y es donde se ve si has entendido la
              demostración o la has copiado.
          - punto: |
              El $m$ que da la definición, y el **término concreto** que
              contradice la hipótesis: para $n>m$ sale $a_n < 0$.
            porque: |
              La contradicción no es abstracta: es que existe un término
              negativo en una sucesión de la que se dijo que todos son $\ge 0$.
              Hay que llegar a escribirla, no insinuarla.
          - punto: |
              Cerrar diciendo **qué se contradice**, y por tanto que $L<0$ es
              imposible y $L \ge 0$.
            porque: |
              Una reducción al absurdo sin la frase final se queda en un
              cálculo. El último renglón es el que convierte la contradicción
              en la tesis, y es el que muchos se dejan por prisa.
        veredicto: |
          Ojo a una tentación: demostrar $L>0$ en vez de $L \ge 0$. No se
          puede, y el propio ejercicio lo enseña — $a_n = 1/n$ tiene todos sus
          términos positivos y su límite es cero. Si tu demostración prueba de
          más, está mal.

    resolucion: |
      > **Aviso.** El boletín remite al libro para este ejercicio. Lo que sigue
      > es una demostración propuesta, pendiente de revisión.

      **Enunciado.** Si $a_n \ge 0$ para todo $n$ y $a_n \to L$, entonces
      $L \ge 0$.

      ### 1 · Estrategia

      Se trata de descartar que $L$ sea negativo. Como la conclusión es una
      desigualdad no estricta, el camino natural es la **reducción al absurdo**:
      se supone $L<0$ y se busca una contradicción con la hipótesis
      $a_n \ge 0$.

      ### 2 · La demostración

      Supongamos $L < 0$. Entonces $-L > 0$, y se puede tomar

      $$
      \varepsilon = \frac{-L}{2} = \frac{|L|}{2} > 0
      $$

      Por la definición de límite, existe $m \in \mathbb{N}$ tal que para todo
      $n > m$

      $$
      |a_n - L| < \varepsilon
      $$

      lo que en particular implica

      $$
      a_n < L + \varepsilon = L - \frac{L}{2} = \frac{L}{2} < 0
      $$

      Es decir: **todos** los términos a partir de $m$ serían estrictamente
      negativos. Pero la hipótesis dice que $a_n \ge 0$ para todo $n$.
      Contradicción.

      Por tanto la suposición era falsa y $L \ge 0$. $\blacksquare$

      ### 3 · Por qué $\ge$ y no $>$

      La conclusión no puede reforzarse: $a_n = \frac1n$ tiene todos sus
      términos **estrictamente** positivos y su límite es exactamente 0.

      La regla general que conviene recordar: al pasar al límite, las
      desigualdades **estrictas se debilitan**. De $a_n > 0$ solo se deduce
      $L \ge 0$.

      ### 4 · Sobre la elección de $\varepsilon$

      Se ha tomado la mitad de la distancia de $L$ a 0. Con
      $\varepsilon = |L|$ el intervalo llegaría justo hasta 0 y la desigualdad
      $a_n < 0$ dejaría de ser estricta, con lo que el choque no sería limpio.
      Ese «tomar la mitad» reaparece en los ejercicios 2.4, 2.5 y 2.6.

      ### 5 · Comprobación

      No demuestra nada —la demostración ya está hecha—, pero sirve para ver la
      maquinaria funcionando y detectar un signo cambiado. Se construye una
      sucesión que tienda a un límite negativo y se cuenta cuántos términos
      consigue mantener no negativos:

      $
      a_n = -0{,}4 + \frac{1}{n} \;\longrightarrow\; L = -0{,}4
      $

      $
      a_1 = 0{,}6 \ge 0, \qquad a_2 = 0{,}1 \ge 0, \qquad
      a_3 = -0{,}067 < 0, \qquad a_4 = -0{,}15 < 0,\;\dots
      $

      Solo dos. Y con el $\varepsilon = \frac{|L|}{2} = 0{,}2$ de la
      demostración, la cuenta sale igual: $\frac1n < 0{,}2$ desde $n=6$, y en
      efecto desde ahí todos los términos son menores que $-0{,}2$.

      Por muy despacio que se construya la sucesión, los términos no negativos
      son siempre **finitos**. Eso es exactamente lo que la hipótesis
      $a_n \ge 0$ para **todo** $n$ prohíbe.

      ### Resultado

      $
      \boxed{\;a_n \ge 0 \;\;\forall n \;\;\text{y}\;\; a_n \to L
      \;\;\Longrightarrow\;\; L \ge 0\;}
      $

