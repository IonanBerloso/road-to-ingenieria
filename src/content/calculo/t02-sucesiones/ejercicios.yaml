  - id: ej-telescopica-que-se-cancela
    titulo: Una serie telescópica, término a término
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Calcular
      $$
      \sum_{n=1}^{\infty}\frac{1}{n(n+1)}
      $$
    pide: La descomposición en fracciones simples y la suma.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué señal indica que esta serie es telescópica?
        opciones:
          - texto: Que el denominador se factoriza en dos términos consecutivos
            correcta: true
            mensaje: |
              Esa es la señal: $n(n+1)$, o $(2n-1)(2n+1)$. Al descomponer en
              fracciones simples, lo que resta un sumando se lo suma el
              siguiente y casi todo se cancela.
          - texto: Que los términos tienden a cero
            mensaje: |
              Eso lo cumple casi cualquier serie convergente, y también la
              armónica, que no converge. No distingue nada.
          - texto: Que hay una $n$ en el numerador
            mensaje: |
              No la hay: el numerador es 1. Y una $n$ en el numerador apuntaría
              más bien a la serie aritmético-geométrica, que es otra cosa.
      - tipo: calcular
        titulo: La descomposición
        pregunta: |
          Se escribe $\dfrac{1}{n(n+1)} = \dfrac{A}{n} + \dfrac{B}{n+1}$.
          ¿Cuánto vale $A$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-1'
            mensaje: |
              Ese es el valor de $B$. Con $n=0$ en $1 = A(n+1)+Bn$ sale
              directamente $A=1$; el signo negativo le toca al otro.
          - valor: '0.5'
            mensaje: |
              Parece que has repartido el 1 a partes iguales. No se reparte: se
              resuelve. Multiplica por $n(n+1)$ y da valores.
        pista: |
          Multiplica los dos lados por $n(n+1)$ y queda $1 = A(n+1) + Bn$.
          Ahora dale a $n$ el valor que anula uno de los dos.
        desarrollo: |
          Multiplicando por $n(n+1)$:

          $$
          1 = A(n+1) + Bn
          $$

          Con $n = 0$ queda $1 = A$. Con $n = -1$ queda $1 = -B$, es decir
          $B = -1$. Por tanto

          $$
          \frac{1}{n(n+1)} = \frac1n - \frac{1}{n+1}
          $$
      - tipo: calcular
        titulo: La suma
        pregunta: |
          Escribiendo los primeros sumandos de
          $\left(\frac11-\frac12\right)+\left(\frac12-\frac13\right)+\cdots$,
          ¿cuánto vale la suma total?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Se cancela **casi** todo, pero no todo: el primer $\frac11$ no
              tiene con quién cancelarse, porque nada viene antes de él.
          - valor: '0.5'
            mensaje: |
              Parece que te has quedado en la primera suma parcial,
              $1-\frac12$. La serie sigue y el término que resta se va a cero.
          - valor: '2'
            mensaje: |
              2 es la suma de la geométrica de razón un medio, no de esta.
              Aquí lo único que sobrevive a la cancelación es el 1 del
              principio.
        pista: |
          Escribe cuatro sumandos completos y tacha lo que se repite con signo
          opuesto. ¿Qué queda en las dos puntas?
        desarrollo: |
          La suma parcial hasta $N$ es

          $$
          S_N = \left(\frac11-\frac12\right)+\left(\frac12-\frac13\right)
          +\cdots+\left(\frac1N-\frac{1}{N+1}\right)
          = 1 - \frac{1}{N+1}
          $$

          Todo lo de en medio se cancela por parejas. Y al crecer $N$:

          $$
          \lim_{N\to\infty}\left(1-\frac{1}{N+1}\right) = 1
          $$
      - tipo: justificar
        pregunta: |
          Ordena el desarrollo. Una pieza es falsa.
        piezas:
          - texto: El denominador $n(n+1)$ son dos factores consecutivos, así que se descompone.
          - texto: $\frac{1}{n(n+1)} = \frac1n - \frac{1}{n+1}$.
          - texto: En la suma parcial se cancela todo menos el primer y el último término.
          - texto: $S_N = 1 - \frac{1}{N+1} \to 1$, luego la serie suma 1.
          - texto: Como todos los términos se cancelan, la suma es cero.
            trampa: true
            mensaje: |
              No se cancelan **todos**: los extremos quedan descolgados, porque
              al primero no le precede nadie y al último no le sigue nadie. Ese
              resto es exactamente la suma.
    resolucion: |
      **Reconocerla.** El denominador es un producto de dos enteros
      consecutivos, que es la señal de una telescópica.

      **Descomponer en fracciones simples.** Con
      $\frac{1}{n(n+1)} = \frac{A}{n}+\frac{B}{n+1}$ y multiplicando por
      $n(n+1)$ queda $1 = A(n+1)+Bn$. Dando $n=0$ sale $A=1$ y dando $n=-1$
      sale $B=-1$:

      $$
      \frac{1}{n(n+1)} = \frac{1}{n} - \frac{1}{n+1}
      $$

      **La suma parcial.** Escribiendo los sumandos en fila se ve la
      cancelación:

      $$
      S_N = \left(1-\frac12\right)+\left(\frac12-\frac13\right)+\cdots
      +\left(\frac1N-\frac{1}{N+1}\right) = 1-\frac{1}{N+1}
      $$

      **El límite.**

      $$
      \sum_{n=1}^{\infty}\frac{1}{n(n+1)} = \lim_{N\to\infty}\left(1-\frac{1}{N+1}\right) = 1
      $$

      **El consejo práctico.** Escribe siempre tres o cuatro sumandos
      desarrollados antes de decidir qué sobrevive. Con tres factores en el
      denominador no queda un término en cada punta, quedan dos, y ahí es
      donde se falla.

      <figure class="figura-examen">
      <svg viewBox="0 0 340 250" role="img" width="340" height="250"
           aria-labelledby="f-ej-telescopica-t f-ej-telescopica-d">
        <title id="f-ej-telescopica-t">Las cinco primeras filas de la telescópica, con las cancelaciones marcadas</title>
        <desc id="f-ej-telescopica-d">Cinco filas, una por término de la serie. En cada fila hay dos cajas: a la izquierda, el trozo positivo uno partido por n; a la derecha, el trozo negativo menos uno partido por n más uno. El trozo negativo de cada fila y el positivo de la fila de debajo tienen el mismo valor y están unidos por una línea diagonal que indica que se cancelan mutuamente. Al final solo quedan sin cancelar el trozo positivo de la primera fila, que vale uno, y el trozo negativo de la última, que se va haciendo cada vez más pequeño. Debajo de todo, la suma resultante: uno menos uno partido por N más uno, que tiende a uno.</desc>
        <style>
            .f-ej-telescopica-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
            .f-ej-telescopica-c { stroke: var(--d1); stroke-width: 2.8; fill: none; }
            .f-ej-telescopica-c2 { stroke: var(--alt); stroke-width: 2.8; fill: none; }
