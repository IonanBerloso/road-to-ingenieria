        <desc id="f-telescopica-hueco-tres-d">Un peine de barras verticales sobre un eje horizontal con los denominadores del uno al once. Hacia arriba salen ocho barras, que son los sumandos positivos uno partido por k para k del uno al ocho; la del uno es la más alta y van menguando. Hacia abajo salen otras ocho, que son los sumandos negativos, para k del cuatro al once. En los denominadores del cuatro al ocho hay barra arriba y barra abajo de la misma longitud, y ese par se anula. Quedan sin pareja las tres barras de arriba de los denominadores uno, dos y tres, resaltadas, y las tres de abajo de los denominadores nueve, diez y once, que son pequeñas y tienden a cero al crecer el número de sumandos. Por eso la suma vale un tercio de uno más un medio más un tercio.</desc>
