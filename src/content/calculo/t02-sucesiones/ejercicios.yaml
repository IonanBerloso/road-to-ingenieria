      <svg viewBox="0 0 426 184" role="img" width="426" height="184"
           aria-labelledby="f-alternante-vs-salto-t f-alternante-vs-salto-d">
        <title id="f-alternante-vs-salto-t">La sucesión que alterna siempre y la que solo cambia una vez</title>
        <desc id="f-alternante-vs-salto-d">Dos recuadros con los mismos dos niveles marcados, más dos y menos dos. En el primero, los términos van saltando alternativamente de arriba abajo durante todo el recorrido, y nunca se quedan en un lado: la sucesión no converge. En el segundo, los primeros cuarenta y nueve términos están todos arriba y, a partir del término cincuenta, todos abajo, sin volver a subir: la sucesión converge a menos dos. Una línea vertical marca ese término cincuenta.</desc>
