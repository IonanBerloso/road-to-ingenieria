        <desc id="f-perpendicular-al-nivel-d">El eje horizontal está resaltado con trazo grueso: es la curva de nivel f igual a dos que pasa por el origen. Desde el origen sale hacia arriba una flecha vertical de longitud dos, el gradiente, y forma con la curva un ángulo recto marcado con una escuadra. Con trazo fino se dibuja también la otra rama de ese nivel, la hipérbola x²y = −2, que queda por debajo y no pasa por el origen.</desc>
