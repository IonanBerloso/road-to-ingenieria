  - id: banista-en-el-lago
    titulo: Hacia dónde nadar para calentarse
    fuente: Ejercicio 6.10 · Problemas complementarios, tema 6 · Cálculo, UPV/EHU (2017/2018 7E)
    nivel: practica
    enunciado: |
      La temperatura de la superficie de un lago se define mediante la función
      $T(x,y) = y^{2}x + x^{2}\ln x$, donde $x$ e $y$ se miden en metros y la
      temperatura en °C.

      a) Un bañista está en el punto $(1,3)$ y nota que se está quedando frío.
      ¿En qué dirección deberá nadar para calentarse lo más rápidamente posible?
      b) Si nadase hacia el punto $P(5,5)$, ¿se enfriaría o calentaría?, ¿a qué
      velocidad?
    pide: La dirección de máximo calentamiento y la velocidad hacia P(5,5).
    pasos:
      - tipo: reconocer
        pregunta: |
          «Calentarse lo más rápidamente posible». ¿Qué se pide?
        opciones:
          - texto: La dirección del gradiente de T
            correcta: true
            mensaje: |
              Sí. Máximo crecimiento de la temperatura es exactamente la
              dirección de $\nabla T$. Si pidiera enfriarse, sería $-\nabla T$.
          - texto: La dirección perpendicular al gradiente
            mensaje: |
              Por ahí la temperatura **no cambia**: nadaría siguiendo una
              isoterma y se quedaría igual de frío.
          - texto: El punto donde la temperatura es máxima
            mensaje: |
              Eso es otra pregunta. Aquí no se busca un destino, sino hacia
              dónde salir desde donde está.
      - tipo: calcular
        titulo: La componente en x del gradiente
        pregunta: |
          Con $T_x = y^{2} + 2x\ln x + x$, ¿cuánto vale $T_x(1,3)$? Recuerda que
          $\ln 1 = 0$.
        respuesta:
          tipo: numero
          valor: '10'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '9'
            mensaje: |
              Te has dejado el término $+x$, que en $x=1$ aporta 1. Al derivar
              $x^{2}\ln x$ por partes salen **dos** términos: $2x\ln x$ y $x$.
          - valor: '11'
            mensaje: |
              Parece que has contado el $2x\ln x$ como si valiera 2. En $x=1$
              ese término es $2\cdot 1\cdot \ln 1 = 0$, porque $\ln 1 = 0$.
        pista: |
          En $x=1$, el término con logaritmo se anula. Quedan $y^{2}$ y $x$.
        desarrollo: |
          $$
          T_x = y^{2} + 2x\ln x + x
          \qquad\Longrightarrow\qquad
          T_x(1,3) = 9 + 0 + 1 = 10
          $$

          El $2x\ln x$ desaparece porque $\ln 1 = 0$. Los números del enunciado
          están elegidos justo para eso: sin calculadora, el punto $(1,3)$ es el
          único donde esto sale a mano.
      - tipo: calcular
        titulo: La velocidad hacia P(5,5)
        pregunta: |
          Con $\nabla T(1,3) = (10,6)$ y el vector hacia $P(5,5)$, que es
          $(4,2)$ de módulo $2\sqrt5$, ¿cuánto vale la derivada direccional?
        respuesta:
          tipo: numero
          valor: '11.628'
          tolerancia: 0.02
          formato: en forma exacta (52/√20) o con tres decimales
        distractores:
          - valor: '52'
            mensaje: |
              Es el producto escalar sin normalizar: $(10,6)\cdot(4,2)=52$.
              Falta dividir entre el módulo del vector dirección.
          - valor: '5.2'
            mensaje: |
              Parece que has dividido entre 10 en vez de entre
              $2\sqrt5 \approx 4{,}47$.
        pista: |
          $52$ dividido entre $\sqrt{20}$. Y $\sqrt{20} = 2\sqrt5 \approx 4{,}472$.
        desarrollo: |
          $$
          D_{\vec u}T = \frac{(10,6)\cdot(4,2)}{\lVert(4,2)\rVert}
          = \frac{40+12}{\sqrt{20}}
          = \frac{52}{2\sqrt5}
          = \frac{26}{\sqrt5} \approx 11{,}63
          $$

          **Sale positivo, así que se calentaría.** Y es menor que
          $\lVert\nabla T\rVert = \sqrt{136}\approx 11{,}66$, casi igual: la
          dirección $(4,2)$ está casi alineada con el gradiente $(10,6)$.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'a) La dirección de máximo calentamiento es $\nabla T(1,3) = (10,6)$.'
          - texto: 'b) El vector hacia $P$ es $(5,5)-(1,3) = (4,2)$, y hay que normalizarlo.'
          - texto: 'La derivada direccional sale $52/\sqrt{20}\approx 11{,}63 > 0$: se calentaría.'
          - texto: El signo positivo es lo que contesta «se enfría o se calienta», y hay que decirlo.
          - texto: 'Como el bañista está frío, el gradiente tiene que apuntar hacia el origen.'
            trampa: true
            mensaje: |
              El gradiente no sabe nada de cómo se siente el bañista: sale de
              derivar la función. Que esté frío es el contexto que justifica la
              pregunta, no un dato que restrinja el resultado.
    resolucion: |
      **a) La dirección para calentarse cuanto antes** es la del gradiente.

      $$
      T(x,y) = y^{2}x + x^{2}\ln x
      $$

      $$
      T_x = y^{2} + 2x\ln x + x,
      \qquad
      T_y = 2xy
      $$

      En $(1,3)$, aprovechando que $\ln 1 = 0$:

      $$
      \nabla T(1,3) = (9+0+1,\; 6) = (10,6)
      $$

      Debe nadar en la dirección $(10,6)$ — o, simplificando, $(5,3)$.

      **b) Hacia $P(5,5)$.** El vector es $\vec v = (5,5)-(1,3) = (4,2)$, con
      $\lVert\vec v\rVert = \sqrt{20} = 2\sqrt5$.

      $$
      D_{\vec u}T(1,3) = \frac{(10,6)\cdot(4,2)}{\sqrt{20}}
      = \frac{52}{\sqrt{20}} \approx 11{,}63\ \text{°C/m}
      $$

      **Positivo, luego se calentaría**, a razón de unos 11,6 °C por metro.

      > **La respuesta a «¿se enfriaría o calentaría?» es el signo**, y hay que
      > escribirla con esas palabras. Dar solo el número deja sin contestar la
      > mitad de la pregunta, y esa mitad es COMP4.

      <figure class="figura-examen">
      <svg viewBox="0 0 330 250" role="img" width="330" height="250"
           aria-labelledby="f-pt6-banista-t f-pt6-banista-d">
        <title id="f-pt6-banista-t">El gradiente en el punto del bañista y la dirección hacia P(5,5)</title>
        <desc id="f-pt6-banista-d">Desde el punto (1,3) salen dos flechas. La del gradiente, que vale (10,6), apunta hacia arriba a la derecha con poca inclinación: esa es la dirección en la que el agua se calienta más deprisa. La otra va hacia el punto (5,5) y forma con la primera un ángulo agudo, así que nadando hacia allí también se calienta, aunque no al máximo ritmo posible.</desc>
