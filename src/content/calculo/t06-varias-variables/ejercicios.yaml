  - id: seis-dominios-de-definicion
    titulo: Seis dominios, y los dos que se parecen y no lo son
    fuente: Ejercicio 6.1 · Problemas complementarios, tema 6 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular y dibujar los dominios de definición de las funciones
      siguientes:

      (a) $f(x,y)=\sqrt{x+y}$
      &nbsp;&nbsp;&nbsp;
      (c) $f(x,y)=\sqrt{xy}$
      &nbsp;&nbsp;&nbsp;
      (e) $f(x,y,z)=\dfrac{1}{\sqrt{16-x^{2}-y^{2}-z^{2}}}$

      (b) $f(x,y)=\sqrt{x}+\sqrt{y}$
      &nbsp;&nbsp;&nbsp;
      (d) $f(x,y)=\ln\left(9-x^{2}-9y^{2}\right)$
      &nbsp;&nbsp;&nbsp;
      (f) $f(x,y)=\sqrt{36-9x^{2}-9y^{2}}$
    pide: El dominio de definición de cada función, y su dibujo.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los apartados (a) y (b) parecen lo mismo. ¿Lo son?
        opciones:
          - texto: >-
              No: $\sqrt{x+y}$ pide que la **suma** sea positiva, y
              $\sqrt{x}+\sqrt{y}$ pide que **las dos** lo sean. El segundo
              dominio es mucho más pequeño
            correcta: true
            mensaje: |
              Eso es. El de (a) es medio plano —todo lo que queda por encima de
              la recta $y=-x$—; el de (b) es solo el primer cuadrante. El
              punto $(4,-1)$ está en el primero y no en el segundo.
          - texto: >-
              Sí: $\sqrt{x+y}=\sqrt{x}+\sqrt{y}$
            mensaje: |
              Esa igualdad es falsa: con $x=y=1$, la izquierda vale $\sqrt2$ y
              la derecha $2$. Y sus dominios tampoco coinciden.
          - texto: >-
              No, porque (b) no está definida en el origen
            mensaje: |
              Sí lo está: $\sqrt0+\sqrt0 = 0$. Lo que las separa es qué pasa
              con los puntos donde una coordenada es negativa y la otra
              compensa.

      - tipo: calcular
        titulo: El radio del disco de (f)
        pregunta: |
          El dominio de $\sqrt{36-9x^{2}-9y^{2}}$ es un disco cerrado
          centrado en el origen. ¿Qué radio tiene?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '6'
            mensaje: |
              $6$ sería el radio si la condición fuese
              $36-x^{2}-y^{2}\ge0$. Los coeficientes $9$ dividen: queda
              $x^{2}+y^{2}\le4$.
          - valor: '4'
            mensaje: |
              $4$ es $\tfrac{36}{9}$, que es el radio **al cuadrado**. Falta la
              raíz.
        pista: |
          $36-9x^{2}-9y^{2}\ge0 \iff x^{2}+y^{2}\le\tfrac{36}{9}$.
        desarrollo: |
          $$
          36-9\left(x^{2}+y^{2}\right)\ge0
          \;\Longleftrightarrow\;
          x^{2}+y^{2}\le 4
          $$

          Disco cerrado de radio $2$. **Cerrado**, porque la raíz admite el
          cero — a diferencia de (d) y (e), donde el logaritmo y el
          denominador exigen desigualdad estricta.

      - tipo: calcular
        titulo: El semieje mayor de (d)
        pregunta: |
          El dominio de $\ln\left(9-x^{2}-9y^{2}\right)$ es el interior de una
          elipse. ¿Cuánto vale su semieje mayor?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es el semieje **menor**, el del eje $y$. Dividiendo entre $9$
              queda $\tfrac{x^{2}}{9}+y^{2}<1$.
          - valor: '9'
            mensaje: |
              $9$ es el semieje al cuadrado. La ecuación normalizada tiene
              $\tfrac{x^{2}}{9}$, así que $a^{2}=9$.
        pista: |
          $9-x^{2}-9y^{2}>0 \iff \tfrac{x^{2}}{9}+y^{2}<1$.
        desarrollo: |
          $$
          \frac{x^{2}}{9}+y^{2} < 1
          $$

          Elipse de semiejes $3$ y $1$, **sin el borde**: el logaritmo exige
          que el argumento sea estrictamente positivo.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Una raíz par pide argumento $\ge0$; un logaritmo, $>0$; un
              denominador, $\ne0$.
          - texto: >-
              En (e) se juntan dos: hay raíz **y** denominador, así que el
              argumento tiene que ser estrictamente positivo y el dominio es la
              bola **abierta** de radio $4$.
          - texto: >-
              En (c), $xy\ge0$ describe el primer y el tercer cuadrante, ejes
              incluidos.
          - texto: >-
              Y en (a) y (b), como las dos funciones son sumas de raíces, los
              dos dominios son el primer cuadrante.
            trampa: true
            mensaje: |
              (a) **no** es una suma de raíces: es la raíz de una suma. Su
              dominio es el semiplano $x+y\ge0$, que incluye puntos como
              $(4,-1)$ donde $y$ es negativa. Solo (b) se queda en el primer
              cuadrante.
        veredicto: |
          El dominio lo dictan las operaciones prohibidas, y hay tres:
          raíz par de negativo, logaritmo de no positivo, y división por cero.
          Lo demás es dibujar la región que queda.
      - tipo: dibujar
        figura: |
