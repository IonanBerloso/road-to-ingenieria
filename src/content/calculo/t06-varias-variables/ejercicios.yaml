  - id: limite-por-caminos
    titulo: Un límite que no existe, y cómo se demuestra
    fuente: Ejercicio 6.4 · Problemas complementarios, tema 6 · Cálculo, UPV/EHU (2017/2018 4E)
    nivel: practica
    enunciado: |
      Estudiar el límite de la función $f(x,y) = \dfrac{xy}{x^{2}+y^{2}}$ en el
      punto $(0,0)$.
    pide: Si el límite existe, y la justificación.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para **negar** que un límite en dos variables existe, ¿qué basta?
        opciones:
          - texto: Encontrar dos caminos por los que salga distinto
            correcta: true
            mensaje: |
              Eso es. La definición exige que salga lo mismo por todos los
              caminos, así que dos que discrepen la rompen. Es la misma
              estructura que las dos subsucesiones del tema 2.
          - texto: Comprobar que por todas las rectas sale lo mismo
            mensaje: |
              Eso no demuestra nada en ningún sentido. Si coinciden, solo sabes
              que no has encontrado todavía el contraejemplo — puede estar en
              una parábola.
          - texto: Ver que la función no está definida en el punto
            mensaje: |
              No estar definida es lo normal en estos ejercicios y no impide que
              el límite exista. El límite habla de lo que pasa **cerca** del
              punto, no en el punto.
      - tipo: calcular
        titulo: Por la recta y = mx
        pregunta: |
          Sustituyendo $y = mx$ y simplificando, el límite queda
          $\dfrac{m}{1+m^{2}}$. ¿Cuánto vale para $m = 1$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.01
          formato: en forma exacta (1/2) o con dos decimales
        distractores:
          - valor: '1'
            mensaje: |
              Has puesto el numerador pero no has dividido: con $m=1$ el
              denominador es $1+1=2$, así que sale $1/2$.
          - valor: '2'
            mensaje: |
              Parece que has dado la vuelta a la fracción. Es
              $m/(1+m^{2}) = 1/2$, no $2$.
        pista: |
          Sustituye $m=1$ en $m/(1+m^{2})$. El denominador vale 2.
        desarrollo: |
          $$
          \frac{m}{1+m^{2}}\Big|_{m=1} = \frac{1}{2}
          $$

          Y por el eje $x$, que es $m=0$, sale $0$. **Dos caminos, dos valores.**
      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una pieza es falsa.
        piezas:
          - texto: 'Nos acercamos por rectas $y = mx$ y sustituimos: $\dfrac{x\cdot mx}{x^{2}+m^{2}x^{2}}$.'

          - texto: Simplificando el $x^{2}$ queda $\dfrac{m}{1+m^{2}}$, que no depende de $x$.
          - texto: 'Con $m=0$ el límite vale $0$; con $m=1$ vale $1/2$.'
          - texto: Dos caminos dan valores distintos, luego el límite no existe.
          - texto: Como el valor depende de $m$, el límite existe y vale $m/(1+m^{2})$.
            trampa: true
            mensaje: |
              Que dependa de $m$ es exactamente lo que **impide** que exista. Un
              límite es un número, no una función del camino por el que llegas.
              Si cada dirección da un valor distinto, no hay un valor al que la
              función se aproxime.
    resolucion: |
      **Se acerca uno por rectas**, que es el camino estándar:

      $$
      \lim_{\substack{(x,y)\to(0,0)\\ y=mx}} \frac{xy}{x^{2}+y^{2}}
      = \lim_{x\to 0}\frac{x\cdot mx}{x^{2}+m^{2}x^{2}}
      = \lim_{x\to 0}\frac{m x^{2}}{x^{2}(1+m^{2})}
      = \frac{m}{1+m^{2}}
      $$

      **Queda la $m$, y eso ya es la respuesta.** El valor depende de la recta
      por la que llegues, así que no hay un único número al que la función se
      aproxime.

      **Para escribirlo del todo hacen falta dos números concretos**, no una
      fórmula con parámetro:

      | camino | valor |
      |---|---|
      | $y = 0$ (el eje $x$, $m=0$) | $0$ |
      | $y = x$ ($m=1$) | $1/2$ |

      Como $0 \neq 1/2$, **el límite no existe**.

      > **Y al revés no vale.** Si al sustituir $y=mx$ se hubiera ido la $m$ y
      > hubiera salido siempre $0$, no habríamos demostrado nada: quedaría
      > probar que también sale $0$ por cualquier otro camino, y para eso las
      > rectas no bastan.

  - id: monte-con-dos-direccionales
    titulo: Deducir el gradiente a partir de dos direccionales
    fuente: Ejercicio 6.9 · Problemas complementarios, tema 6 · Cálculo, UPV/EHU (2015/2016 5E)
    nivel: practica
    enunciado: |
      La altura de un monte se define mediante la función $F(x,y)$. Si nos
      colocamos en el punto $(1,2)$ y nos dirigimos hacia el punto $(2,2)$, la
      derivada direccional es $2$. En cambio, si nos dirigimos hacia el punto
      $(1,1)$, la derivada direccional es $-2$.

      a) Calcular el vector gradiente en el punto $(1,2)$ e interpretar su
      significado.
      b) Calcular la derivada direccional en el punto $(1,2)$ siguiendo la
      dirección del vector $(4,3)$.
    pide: El gradiente en (1,2) y la derivada direccional hacia (4,3).
    pasos:
      - tipo: reconocer
        pregunta: |
          El gradiente es $\nabla F = (a,b)$, dos incógnitas. ¿Por qué bastan
          los dos datos del enunciado?
        opciones:
          - texto: Porque cada derivada direccional da una ecuación lineal en a y b
            correcta: true
            mensaje: |
              Eso es. $\nabla F\cdot\vec u = \text{dato}$ es una ecuación, y con
              dos direcciones distintas salen dos ecuaciones con dos incógnitas.
          - texto: Porque el gradiente siempre se puede deducir de una sola derivada direccional
            mensaje: |
              No: una sola ecuación con dos incógnitas deja infinitas
              soluciones. Hacen falta dos direcciones **no paralelas**.
          - texto: Porque las dos direcciones son perpendiculares y eso da el módulo
            mensaje: |
              Que sean perpendiculares ayuda a que las cuentas salgan limpias,
              pero lo que resuelve el problema es tener dos ecuaciones. Con dos
              direcciones oblicuas también saldría.
      - tipo: calcular
        titulo: La primera componente
        pregunta: |
          El vector de $(1,2)$ a $(2,2)$ es $(1,0)$, que ya es unitario. Si
          $\nabla F\cdot(1,0) = 2$, ¿cuánto vale $F_x(1,2)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              Ese es el otro dato, el de la dirección hacia $(1,1)$. Hacia
              $(2,2)$ la derivada direccional vale $+2$.
          - valor: '1'
            mensaje: |
              1 es la componente del vector dirección, no el valor de la
              derivada. El producto escalar $(a,b)\cdot(1,0)$ vale $a$, y eso
              es lo que el enunciado iguala a 2.
        pista: |
          $(a,b)\cdot(1,0) = a$. Y el enunciado dice que eso vale 2.
        desarrollo: |
          El vector de $(1,2)$ a $(2,2)$ es $(2,2)-(1,2) = (1,0)$, de módulo 1.

          $$
          \nabla F\cdot(1,0) = a = 2
          $$
      - tipo: calcular
        titulo: La segunda componente
        pregunta: |
          El vector de $(1,2)$ a $(1,1)$ es $(0,-1)$, también unitario. Si
          $\nabla F\cdot(0,-1) = -2$, ¿cuánto vale $F_y(1,2)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              Cuidado con el signo. $(a,b)\cdot(0,-1) = -b$, y eso vale $-2$;
              luego $b = +2$. Los dos signos negativos se cancelan.
          - valor: '0'
            mensaje: |
              La primera componente del vector es 0, pero eso no anula $b$:
              el producto escalar $(a,b)\cdot(0,-1)$ vale $-b$, no $0$.
        pista: |
          $(a,b)\cdot(0,-1) = -b = -2$. Despeja b, con cuidado con los signos.
        desarrollo: |
          El vector de $(1,2)$ a $(1,1)$ es $(1,1)-(1,2) = (0,-1)$.

          $$
          \nabla F\cdot(0,-1) = -b = -2
          \qquad\Longrightarrow\qquad
          b = 2
          $$

          Así que $\nabla F(1,2) = (2,2)$.
      - tipo: calcular
        titulo: La derivada direccional pedida
        pregunta: |
          Con $\nabla F(1,2) = (2,2)$ y $\vec v = (4,3)$ (que mide 5), ¿cuánto
          vale la derivada direccional?
        respuesta:
          tipo: numero
          valor: '2.8'
          tolerancia: 0.01
          formato: en forma exacta (14/5) o con dos decimales
        distractores:
          - valor: '14'
            mensaje: |
              Falta normalizar. $(2,2)\cdot(4,3) = 14$, pero hay que dividir
              entre el módulo de $\vec v$, que es 5.
          - valor: '4'
            mensaje: |
              4 es la primera componente de $\vec v$. La derivada direccional es
              el producto escalar del gradiente por el vector unitario.
        pista: |
          $(2,2)\cdot(4,3) = 14$, y hay que dividirlo entre 5.
        desarrollo: |
          $$
          D_{\vec u}F(1,2) = (2,2)\cdot\left(\tfrac{4}{5},\tfrac{3}{5}\right)
          = \frac{8+6}{5} = \frac{14}{5} = 2{,}8
          $$

          Y el control de siempre: $\lVert\nabla F\rVert = 2\sqrt2 \approx 2{,}83$,
          así que $2{,}8$ está justo por debajo. Coherente — la dirección $(4,3)$
          está casi alineada con el gradiente $(2,2)$.
      - tipo: justificar
        pregunta: |
          Ordena la interpretación del apartado a). Una pieza es falsa.
        piezas:
          - texto: $\nabla F(1,2) = (2,2)$ apunta hacia el nordeste, en la bisectriz del primer cuadrante.
          - texto: Es la dirección en la que el monte sube más deprisa desde ese punto.
          - texto: 'Su módulo, $2\sqrt2$, es esa pendiente máxima: unos 2,83 metros por metro avanzado.'
          - texto: La curva de nivel que pasa por $(1,2)$ es perpendicular a él en ese punto.
          - texto: Como sus dos componentes son iguales, el punto $(1,2)$ es una cima del monte.
            trampa: true
            mensaje: |
              Una cima exige gradiente **nulo**, no gradiente con componentes
              iguales. Aquí el gradiente vale $(2,2)\neq(0,0)$, así que desde
              ese punto todavía se sube: no es una cima.
    resolucion: |
      **La clave es leer bien las direcciones.** El enunciado no da vectores:
      da puntos de destino. El vector es siempre **destino menos origen**.

      | vamos hacia | vector | ¿unitario? |
      |---|---|---|
      | $(2,2)$ | $(2,2)-(1,2) = (1,0)$ | sí, mide 1 |
      | $(1,1)$ | $(1,1)-(1,2) = (0,-1)$ | sí, mide 1 |

      Que los dos salgan ya unitarios es una suerte del enunciado, y conviene
      **comprobarlo** en vez de darlo por hecho.

      **El sistema.** Con $\nabla F(1,2) = (a,b)$:

      $$
      \begin{cases}
      (a,b)\cdot(1,0) = a = 2\\[2pt]
      (a,b)\cdot(0,-1) = -b = -2
      \end{cases}
      \qquad\Longrightarrow\qquad
      \nabla F(1,2) = (2,2)
      $$

      **a) La interpretación**, que es donde está COMP4. El gradiente $(2,2)$
      apunta en la dirección de máxima pendiente de subida, hacia el nordeste.
      Su módulo, $2\sqrt2 \approx 2{,}83$, es esa pendiente máxima. Y la curva
      de nivel por $(1,2)$ le es perpendicular.

      **b) La derivada direccional** hacia $\vec v = (4,3)$, normalizando:

      $$
      D_{\vec u}F = (2,2)\cdot\left(\tfrac{4}{5},\tfrac{3}{5}\right)
      = \frac{14}{5} = 2{,}8
      $$

  - id: banista-en-el-lago
    titulo: Hacia dónde nadar para calentarse
    fuente: Ejercicio 6.10 · Problemas complementarios, tema 6 · Cálculo, UPV/EHU (2017/2018 7E)
    nivel: practica
    enunciado: |
      La temperatura de la superficie de un lago se define mediante la función
      $T(x,y) = y^{2}x + x^{2}\ln x$, donde $x$ e $y$ se miden en metros y la
      temperatura en °C.

      a) Un bañista está en el punto $(1,3)$ y nota que se está quedando frío.
      ¿En qué dirección deberá nadar para calentarse lo más rápidamente posible?
      b) Si nadase hacia el punto $P(5,5)$, ¿se enfriaría o calentaría?, ¿a qué
      velocidad?
    pide: La dirección de máximo calentamiento y la velocidad hacia P(5,5).
    pasos:
      - tipo: reconocer
        pregunta: |
          «Calentarse lo más rápidamente posible». ¿Qué se pide?
        opciones:
          - texto: La dirección del gradiente de T
            correcta: true
            mensaje: |
              Sí. Máximo crecimiento de la temperatura es exactamente la
              dirección de $\nabla T$. Si pidiera enfriarse, sería $-\nabla T$.
          - texto: La dirección perpendicular al gradiente
            mensaje: |
              Por ahí la temperatura **no cambia**: nadaría siguiendo una
              isoterma y se quedaría igual de frío.
          - texto: El punto donde la temperatura es máxima
            mensaje: |
              Eso es otra pregunta. Aquí no se busca un destino, sino hacia
              dónde salir desde donde está.
      - tipo: calcular
        titulo: La componente en x del gradiente
        pregunta: |
          Con $T_x = y^{2} + 2x\ln x + x$, ¿cuánto vale $T_x(1,3)$? Recuerda que
          $\ln 1 = 0$.
        respuesta:
          tipo: numero
          valor: '10'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '9'
            mensaje: |
              Te has dejado el término $+x$, que en $x=1$ aporta 1. Al derivar
              $x^{2}\ln x$ por partes salen **dos** términos: $2x\ln x$ y $x$.
          - valor: '11'
            mensaje: |
              Parece que has contado el $2x\ln x$ como si valiera 2. En $x=1$
              ese término es $2\cdot 1\cdot \ln 1 = 0$, porque $\ln 1 = 0$.
        pista: |
          En $x=1$, el término con logaritmo se anula. Quedan $y^{2}$ y $x$.
        desarrollo: |
          $$
          T_x = y^{2} + 2x\ln x + x
          \qquad\Longrightarrow\qquad
          T_x(1,3) = 9 + 0 + 1 = 10
          $$

          El $2x\ln x$ desaparece porque $\ln 1 = 0$. Los números del enunciado
          están elegidos justo para eso: sin calculadora, el punto $(1,3)$ es el
          único donde esto sale a mano.
      - tipo: calcular
        titulo: La velocidad hacia P(5,5)
        pregunta: |
          Con $\nabla T(1,3) = (10,6)$ y el vector hacia $P(5,5)$, que es
          $(4,2)$ de módulo $2\sqrt5$, ¿cuánto vale la derivada direccional?
        respuesta:
          tipo: numero
          valor: '11.628'
          tolerancia: 0.02
          formato: en forma exacta (52/√20) o con tres decimales
        distractores:
          - valor: '52'
            mensaje: |
              Es el producto escalar sin normalizar: $(10,6)\cdot(4,2)=52$.
              Falta dividir entre el módulo del vector dirección.
          - valor: '5.2'
            mensaje: |
              Parece que has dividido entre 10 en vez de entre
              $2\sqrt5 \approx 4{,}47$.
        pista: |
          $52$ dividido entre $\sqrt{20}$. Y $\sqrt{20} = 2\sqrt5 \approx 4{,}472$.
        desarrollo: |
          $$
          D_{\vec u}T = \frac{(10,6)\cdot(4,2)}{\lVert(4,2)\rVert}
          = \frac{40+12}{\sqrt{20}}
          = \frac{52}{2\sqrt5}
          = \frac{26}{\sqrt5} \approx 11{,}63
          $$

          **Sale positivo, así que se calentaría.** Y es menor que
          $\lVert\nabla T\rVert = \sqrt{136}\approx 11{,}66$, casi igual: la
          dirección $(4,2)$ está casi alineada con el gradiente $(10,6)$.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'a) La dirección de máximo calentamiento es $\nabla T(1,3) = (10,6)$.'
          - texto: 'b) El vector hacia $P$ es $(5,5)-(1,3) = (4,2)$, y hay que normalizarlo.'
          - texto: 'La derivada direccional sale $52/\sqrt{20}\approx 11{,}63 > 0$: se calentaría.'
          - texto: El signo positivo es lo que contesta «se enfría o se calienta», y hay que decirlo.
          - texto: 'Como el bañista está frío, el gradiente tiene que apuntar hacia el origen.'
            trampa: true
            mensaje: |
              El gradiente no sabe nada de cómo se siente el bañista: sale de
              derivar la función. Que esté frío es el contexto que justifica la
              pregunta, no un dato que restrinja el resultado.
    resolucion: |
      **a) La dirección para calentarse cuanto antes** es la del gradiente.

      $$
      T(x,y) = y^{2}x + x^{2}\ln x
      $$

      $$
      T_x = y^{2} + 2x\ln x + x,
      \qquad
      T_y = 2xy
      $$

      En $(1,3)$, aprovechando que $\ln 1 = 0$:

      $$
      \nabla T(1,3) = (9+0+1,\; 6) = (10,6)
      $$

      Debe nadar en la dirección $(10,6)$ — o, simplificando, $(5,3)$.

      **b) Hacia $P(5,5)$.** El vector es $\vec v = (5,5)-(1,3) = (4,2)$, con
      $\lVert\vec v\rVert = \sqrt{20} = 2\sqrt5$.

      $$
      D_{\vec u}T(1,3) = \frac{(10,6)\cdot(4,2)}{\sqrt{20}}
      = \frac{52}{\sqrt{20}} \approx 11{,}63\ \text{°C/m}
      $$

      **Positivo, luego se calentaría**, a razón de unos 11,6 °C por metro.

      > **La respuesta a «¿se enfriaría o calentaría?» es el signo**, y hay que
      > escribirla con esas palabras. Dar solo el número deja sin contestar la
      > mitad de la pregunta, y esa mitad es COMP4.

  - id: cucaracha-y-el-gas
    titulo: Escabullirse de una concentración tóxica
    fuente: Ejercicio 6.14 · Problemas complementarios, tema 6 · Cálculo, UPV/EHU (2019/2020 3E)
    nivel: practica
    enunciado: |
      Una cucaracha al verse en un ambiente tóxico cargado de AJT químico decide
      moverse en una dirección en que la concentración de AJT disminuya con la
      mayor rapidez. Si se encuentra en el punto $P(1,0)$ y la concentración de
      AJT viene dada por la expresión

      $$
      f(x,y) = e^{-(x-1)^{2}-(y-1)^{2}}
      $$

      a) ¿Hacia dónde debe escabullirse?
      b) ¿Cuál es la ecuación de la curva que tendría que seguir la cucaracha
      para que la concentración de AJT del ambiente no cambiara? Dibujar dicha
      curva.
      c) ¿Cuál es el punto de mayor concentración de AJT?
    pide: La dirección de máximo descenso, la curva de nivel por P y el máximo.
    pasos:
      - tipo: reconocer
        pregunta: |
          «Que la concentración disminuya con la mayor rapidez». ¿Qué se pide?
        opciones:
          - texto: El gradiente cambiado de signo
            correcta: true
            mensaje: |
              Sí. $-\nabla f$ es la dirección de máximo descenso: la misma
              flecha del gradiente, del revés.
          - texto: El gradiente
            mensaje: |
              Ese apunta hacia donde la concentración **aumenta** más deprisa,
              que es justo lo contrario de lo que quiere la cucaracha.
          - texto: Una dirección perpendicular al gradiente
            mensaje: |
              Por ahí la concentración no cambiaría en absoluto. Es lo que pide
              el apartado b), no el a).
      - tipo: calcular
        titulo: La segunda componente del gradiente en P
        pregunta: |
          Con $f_y = -2(y-1)\,e^{-(x-1)^{2}-(y-1)^{2}}$, ¿cuánto vale $f_y(1,0)$?
          Ten en cuenta que en $P$ el exponente vale $-1$.
        respuesta:
          tipo: numero
          valor: '0.7358'
          tolerancia: 0.01
          formato: en forma exacta (2/e) o con cuatro decimales
        distractores:
          - valor: '-0.7358'
            mensaje: |
              Cuidado con el doble signo. $-2(y-1)$ en $y=0$ es
              $-2(-1) = +2$, positivo. Los dos negativos se cancelan.
          - valor: '2'
            mensaje: |
              Ese es el factor $-2(y-1)$, pero falta multiplicarlo por la
              exponencial, que en $P$ vale $e^{-1}$.
        pista: |
          $-2(0-1) = 2$, y la exponencial en P vale $e^{-1}$. Así que $2/e$.
        desarrollo: |
          En $P(1,0)$ el exponente es $-(1-1)^{2}-(0-1)^{2} = -1$, así que la
          exponencial vale $e^{-1}$.

          $$
          f_y(1,0) = -2(0-1)\,e^{-1} = \frac{2}{e} \approx 0{,}7358
          $$

          Y $f_x(1,0) = -2(1-1)e^{-1} = 0$. El gradiente es $(0,\,2/e)$.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta completa. Una pieza es falsa.
        piezas:
          - texto: 'En $P(1,0)$ el gradiente vale $\nabla f = (0,\,2/e)$.'
          - texto: 'a) Se escabulle en la dirección opuesta: $(0,\,-2/e)$, es decir, hacia abajo.'
          - texto: 'b) La curva de cambio nulo es la de nivel por $P$: $(x-1)^{2}+(y-1)^{2} = 1$.'
          - texto: 'c) El máximo está donde el exponente se anula, en el punto $(1,1)$.'
          - texto: 'c) El máximo está donde el gradiente es máximo, o sea en $P(1,0)$.'
            trampa: true
            mensaje: |
              Al revés: en un máximo el gradiente **se anula**, no se hace
              grande. Un gradiente grande significa que la función todavía sube
              deprisa por ahí, así que $P$ no puede ser el máximo.
      - tipo: dibujar
        consigna: |
          Dibuja en el plano $XY$ el punto $P$, la dirección de huida y la curva
          de nivel que pide el apartado (b).
        comprueba:
          - punto: |
              El punto de máxima concentración en $\left(1,1\right)$, marcado.
            porque: |
              La exponencial es máxima donde el exponente se anula. Es el
              apartado (c), y sitúa toda la figura: las curvas de nivel son
              circunferencias alrededor de él.
          - punto: |
              La curva de nivel que pasa por $P\left(1,0\right)$: la
              circunferencia de centro $\left(1,1\right)$ y radio $1$.
            porque: |
              Moverse sin que cambie la concentración es moverse por la curva de
              nivel. Y como el exponente depende solo de la distancia a
              $\left(1,1\right)$, esas curvas son circunferencias.
          - punto: |
              La flecha de huida apuntando **hacia abajo**, en la dirección
              $\left(0,-1\right)$.
            porque: |
              El gradiente en $P$ apunta hacia $\left(1,1\right)$, o sea hacia
              arriba; la huida es en sentido contrario. Dibujarla hacia arriba
              sería ir hacia el veneno.
          - punto: |
              La flecha **perpendicular** a la curva de nivel en $P$.
            porque: |
              El gradiente siempre es perpendicular a las curvas de nivel, y aquí
              se ve porque la curva es una circunferencia y la flecha va en la
              dirección del radio.
        veredicto: |
          Los tres apartados están en el mismo dibujo: el centro es el punto de
          máxima concentración, la circunferencia por $P$ es la curva donde no
          cambia, y el radio hacia fuera es por dónde escapar.

    resolucion: |
      **Las tres preguntas son las tres del gradiente**, en el mismo orden en
      que aparecen en la prosa del tema.

      Las parciales, aplicando la regla de la cadena a la exponencial:

      $$
      f_x = -2(x-1)\,e^{-(x-1)^{2}-(y-1)^{2}},
      \qquad
      f_y = -2(y-1)\,e^{-(x-1)^{2}-(y-1)^{2}}
      $$

      En $P(1,0)$ el exponente vale $-1$:

      $$
      \nabla f(1,0) = \left(0,\ \tfrac{2}{e}\right)
      $$

      **a)** La dirección de máximo descenso es $-\nabla f = (0,\,-2/e)$: la
      cucaracha debe moverse **hacia abajo**, en el sentido negativo del eje $y$.

      **b)** La curva por la que la concentración no cambia es la curva de nivel
      que pasa por $P$. Su altura es $k = f(1,0) = e^{-1}$, así que

      $$
      e^{-(x-1)^{2}-(y-1)^{2}} = e^{-1}
      \;\Longleftrightarrow\;
      (x-1)^{2}+(y-1)^{2} = 1
      $$

      Una **circunferencia de centro $(1,1)$ y radio 1**. Y hay que dibujarla:
      el enunciado lo pide con todas las letras.

      **c)** La exponencial es tanto mayor cuanto **menos negativo** sea el
      exponente, y el exponente $-(x-1)^{2}-(y-1)^{2}$ alcanza su máximo —cero—
      en $(1,1)$. Ahí la concentración vale $e^{0} = 1$, el máximo.

      > Fíjate en que el máximo, $(1,1)$, es justo el centro de la
      > circunferencia del apartado b). No es casualidad: las curvas de nivel de
      > esta función son circunferencias concéntricas alrededor del pico, y el
      > gradiente en cualquier punto apunta hacia el centro.

  - id: placa-con-dos-ritmos
    titulo: Dos ritmos de cambio, y las tres preguntas del gradiente
    fuente: Ejercicio 6.17 · Problemas complementarios, tema 6 · Cálculo, UPV/EHU (2019/2020 AT)
    nivel: practica
    enunciado: |
      La temperatura de una placa metálica en cada uno de sus puntos $(x,y)$
      viene dada por la función $T(x,y)$, donde $x$ e $y$ se miden en metros y
      la temperatura $T$ en °C. Se conoce:

      (i) El ritmo de cambio de la temperatura en un punto $P$ siguiendo la
      dirección $v_1 = (1,-1)$ es de $2\sqrt2$ °C/m.

      (ii) El ritmo de cambio de la temperatura en un punto $P$ siguiendo la
      dirección $v_2 = (1,2)$ es de $3\sqrt5$ °C/m.

      Se pide: a) en qué dirección cambia más rápidamente $T$; b) el valor de
      ese cambio máximo; c) en qué dirección no cambia la temperatura.
    pide: El gradiente, su módulo y la dirección de cambio nulo.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los vectores $v_1=(1,-1)$ y $v_2=(1,2)$ **no** son unitarios. ¿Qué
          implica eso al plantear las ecuaciones?
        opciones:
          - texto: Que hay que dividir cada producto escalar entre el módulo de su vector
            correcta: true
            mensaje: |
              Exacto. Cada ecuación es
              $\nabla T\cdot \vec v/\lVert\vec v\rVert = \text{dato}$. Aquí los
              módulos son $\sqrt2$ y $\sqrt5$, y por eso los datos vienen con
              esas mismas raíces: para que el sistema salga limpio.
          - texto: Que los datos del enunciado están mal
            mensaje: |
              Están bien. El enunciado da direcciones, no vectores unitarios, y
              normalizar es trabajo nuestro. De hecho las raíces de los datos
              son la pista de que hay que hacerlo.
          - texto: Que hay que usarlos tal cual, porque solo importa la dirección
            mensaje: |
              La dirección es lo que importa, sí, pero la derivada direccional
              mide el cambio **por metro**. Sin normalizar, cada ecuación estaría
              escalada por un factor distinto y el sistema daría otro gradiente.
      - tipo: calcular
        titulo: La primera componente del gradiente
        pregunta: |
          El sistema que sale es $a-b=4$ y $a+2b=15$. ¿Cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '7.6667'
          tolerancia: 0.01
          formato: en forma exacta (23/3) o con cuatro decimales
        distractores:
          - valor: '4'
            mensaje: |
              4 es el término independiente de la primera ecuación, no la
              solución. Hay que resolver el sistema entero.
          - valor: '19'
            mensaje: |
              Parece que has sumado las dos ecuaciones sin más: eso da
              $2a+b=19$, que todavía tiene dos incógnitas.
        pista: |
          Resta la primera de la segunda para eliminar la a, saca b, y sustituye.
        desarrollo: |
          Restando la primera de la segunda:

          $$
          (a+2b)-(a-b) = 15-4
          \;\Longrightarrow\;
          3b = 11
          \;\Longrightarrow\;
          b = \tfrac{11}{3}
          $$

          Y sustituyendo en la primera:

          $$
          a = 4 + b = 4 + \tfrac{11}{3} = \tfrac{23}{3} \approx 7{,}67
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'Cada dato da una ecuación: $\nabla T\cdot \vec v_i/\lVert\vec v_i\rVert$ igual al ritmo dado.'
          - texto: 'Con $\lVert v_1\rVert=\sqrt2$ y ritmo $2\sqrt2$, la primera ecuación es $a-b=4$.'
          - texto: 'Con $\lVert v_2\rVert=\sqrt5$ y ritmo $3\sqrt5$, la segunda es $a+2b=15$.'
          - texto: 'Resolviendo, $\nabla T(P) = (23/3,\,11/3)$, y ese vector contesta a) y b).'
          - texto: 'c) La dirección de cambio nulo es $(-23/3,\,-11/3)$.'
            trampa: true
            mensaje: |
              Ese es el gradiente cambiado de signo, o sea la dirección de
              máximo **descenso**. La de cambio nulo es la perpendicular: se
              cambian de orden las componentes y se le da la vuelta a un signo,
              $(-11,23)$ salvo factor.
    resolucion: |
      **El ejercicio es un sistema disfrazado.** El gradiente $\nabla T(P)=(a,b)$
      son dos incógnitas, y cada ritmo de cambio es una ecuación.

      **Primera ecuación.** $\vec v_1 = (1,-1)$ tiene módulo $\sqrt2$:

      $$
      \frac{(a,b)\cdot(1,-1)}{\sqrt2} = 2\sqrt2
      \;\Longrightarrow\;
      a-b = 2\cdot 2 = 4
      $$

      **Segunda ecuación.** $\vec v_2 = (1,2)$ tiene módulo $\sqrt5$:

      $$
      \frac{(a,b)\cdot(1,2)}{\sqrt5} = 3\sqrt5
      \;\Longrightarrow\;
      a+2b = 3\cdot 5 = 15
      $$

      **Resolviendo:** $3b = 11$, luego $b = 11/3$ y $a = 23/3$.

      $$
      \nabla T(P) = \left(\tfrac{23}{3},\ \tfrac{11}{3}\right)
      $$

      **a)** En esa dirección cambia más rápido.

      **b)** El valor del cambio máximo es su módulo:

      $$
      \lVert\nabla T\rVert = \frac{1}{3}\sqrt{23^{2}+11^{2}}
      = \frac{\sqrt{650}}{3} = \frac{5\sqrt{26}}{3}\ \text{°C/m}
      $$

      **c)** No cambia en la dirección perpendicular: $(-11,\,23)$, o cualquier
      múltiplo suyo.

      > **Por qué los datos traen raíces.** $2\sqrt2$ y $3\sqrt5$ parecen números
      > incómodos y son justo lo contrario: al dividir entre los módulos
      > $\sqrt2$ y $\sqrt5$ las raíces se cancelan y el sistema queda con
      > enteros. Es la firma de un enunciado escrito para hacerse sin
      > calculadora.

  - id: perpendicular-a-la-curva-de-nivel
    titulo: Un vector unitario perpendicular a la curva de nivel
    fuente: Ejercicio 6.12 · Problemas complementarios, tema 6 · Cálculo, UPV/EHU (2018/2019 4E)
    nivel: practica
    enunciado: |
      Sea la función $f(x,y) = x^{2}y^{2} + 2y + 2$. Calcular un vector unitario
      perpendicular a la curva de nivel $f(x,y) = 2$ en el punto $(0,0)$.
    pide: Un vector unitario perpendicular a la curva de nivel en el origen.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué objeto es siempre perpendicular a una curva de nivel?
        opciones:
          - texto: El vector gradiente en ese punto
            correcta: true
            mensaje: |
              Ese es el hecho central del tema. Por eso el ejercicio, que parece
              de geometría, se resuelve derivando.
          - texto: La tangente a la curva de nivel
            mensaje: |
              La tangente es lo **paralelo** a la curva, no lo perpendicular. Es
              la dirección en la que la función no cambia.
          - texto: El vector de posición del punto
            mensaje: |
              Solo coincide en casos particulares, como las circunferencias
              centradas en el origen. En general no tiene nada que ver.
      - tipo: calcular
        titulo: La componente en y del gradiente
        pregunta: |
          Con $f_y = 2x^{2}y + 2$, ¿cuánto vale $f_y(0,0)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              El término $2x^{2}y$ sí se anula en el origen, pero queda el $+2$
              que viene de derivar $2y$. No todo se va.
          - valor: '4'
            mensaje: |
              Parece que has contado dos veces el 2. Solo el término $2y$ de la
              función aporta, y aporta 2.
        pista: |
          En el origen, $2x^{2}y$ vale 0. Queda solo la constante.
        desarrollo: |
          $$
          f_y(0,0) = 2\cdot 0^{2}\cdot 0 + 2 = 2
          $$

          Y $f_x = 2xy^{2}$, que en el origen vale 0. Así que
          $\nabla f(0,0) = (0,2)$.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: El gradiente es siempre perpendicular a la curva de nivel, así que basta calcularlo.
          - texto: '$f_x = 2xy^{2}$ y $f_y = 2x^{2}y+2$, luego $\nabla f(0,0) = (0,2)$.'
          - texto: 'Su módulo es 2, así que el unitario es $(0,1)$.'
          - texto: 'También vale $(0,-1)$: el enunciado pide **un** vector, y hay dos perpendiculares unitarios.'
          - texto: 'Como el punto es el origen, el vector perpendicular es $(0,0)$.'
            trampa: true
            mensaje: |
              $(0,0)$ no es un vector unitario ni tiene dirección: no puede ser
              perpendicular a nada. Que el punto sea el origen no dice nada
              sobre el gradiente en él.
    resolucion: |
      **El ejercicio es una frase disfrazada de cuenta**: el gradiente es
      perpendicular a la curva de nivel. En cuanto reconoces eso, lo que queda
      es derivar y normalizar.

      $$
      f(x,y) = x^{2}y^{2}+2y+2
      \qquad
      f_x = 2xy^{2},
      \qquad
      f_y = 2x^{2}y+2
      $$

      En el origen:

      $$
      \nabla f(0,0) = (0,\,2)
      $$

      **Normalizando**, como pide el enunciado:

      $$
      \vec u = \frac{(0,2)}{2} = (0,1)
      $$

      **Y una comprobación que conviene escribir.** La curva de nivel
      $f(x,y)=2$ es $x^{2}y^{2}+2y = 0$, que cerca del origen se comporta como
      $y = 0$: el eje horizontal. Un vector perpendicular al eje horizontal es,
      en efecto, el vertical $(0,1)$. ✓

      > El enunciado dice «**un** vector unitario», en singular indefinido, y es
      > deliberado: hay dos, $(0,1)$ y $(0,-1)$. Cualquiera de los dos vale, y
      > decirlo suma en COMP4.

  - id: maximo-paralelo-al-eje
    titulo: Deducir dos parámetros de la dirección del máximo
    fuente: Ejercicio 6.13 · Problemas complementarios, tema 6 · Cálculo, UPV/EHU (2019/2020 3E AT)
    nivel: practica
    enunciado: |
      Sea la función $f(x,y) = axy^{2} + bxy$, donde $a$ y $b$ son constantes
      reales. En el punto $P(1,2)$ la derivada direccional tiene un valor máximo
      cuando se sigue una dirección paralela al eje OX; este valor máximo es 8.
      Calcular los valores de $a$ y $b$.
    pide: Los valores de las constantes a y b.
    pasos:
      - tipo: reconocer
        pregunta: |
          «La derivada direccional tiene su valor máximo siguiendo una dirección
          paralela al eje OX». ¿Qué información da eso sobre el gradiente?
        opciones:
          - texto: Que el gradiente es paralelo al eje OX, luego su componente y es nula
            correcta: true
            mensaje: |
              Eso es. El máximo se da siempre en la dirección del gradiente, así
              que si el máximo está en la dirección de OX, el gradiente apunta
              en esa dirección: $f_y(P) = 0$.
          - texto: Que la derivada parcial respecto de x es nula
            mensaje: |
              Justo la otra. Si $f_x$ fuera nula, el gradiente sería vertical y
              el máximo se daría en la dirección de OY, no de OX.
          - texto: Que el punto P es un extremo de la función
            mensaje: |
              Un extremo tendría gradiente **nulo**, y entonces no habría
              «dirección de máximo cambio» ni valdría 8. Aquí el gradiente es
              no nulo y horizontal.
      - tipo: calcular
        titulo: La ecuación que sale del máximo
        pregunta: |
          Si el gradiente es horizontal y su módulo vale 8, ¿cuánto vale
          $f_x(1,2)$ en valor absoluto?
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              La que se anula es $f_y$, no $f_x$. Si las dos fueran cero el
              gradiente sería nulo y no habría cambio máximo de 8.
          - valor: '4'
            mensaje: |
              Parece que has repartido el 8 entre las dos componentes. Con
              $f_y=0$, todo el módulo está en $f_x$.
        pista: |
          Si el gradiente es $(f_x, 0)$, su módulo es $|f_x|$.
        desarrollo: |
          Con $f_y(1,2)=0$, el gradiente es $\nabla f = (f_x,0)$ y su módulo es
          $|f_x|$. Como el valor máximo de cambio es ese módulo:

          $$
          |f_x(1,2)| = 8
          $$

          De ahí salen los dos signos que tiene la solución.
      - tipo: justificar
        pregunta: |
          Ordena el planteamiento. Una pieza es falsa.
        piezas:
          - texto: '$f_x = ay^{2}+by$ y $f_y = 2axy + bx$.'
          - texto: 'En $P(1,2)$: $f_x = 4a+2b$ y $f_y = 4a+b$.'
          - texto: 'Máximo paralelo a OX significa $f_y(1,2)=0$, o sea $4a+b=0$.'
          - texto: 'Y el valor máximo 8 da $|4a+2b| = 8$.'
          - texto: 'Como el valor máximo es 8, hay que imponer $f_x = 8$ y $f_y = 8$.'
            trampa: true
            mensaje: |
              El valor máximo es el **módulo** del gradiente, no el valor de cada
              componente. Y aquí precisamente $f_y$ vale cero: si valiera 8 el
              gradiente no sería paralelo a OX.
    resolucion: |
      **Dos condiciones, dos incógnitas.** El enunciado esconde dos ecuaciones y
      hay que saber leerlas.

      Las parciales:

      $$
      f_x = ay^{2}+by,
      \qquad
      f_y = 2axy + bx
      $$

      Evaluadas en $P(1,2)$:

      $$
      f_x(1,2) = 4a+2b,
      \qquad
      f_y(1,2) = 4a+b
      $$

      **Condición 1 — el máximo es paralelo a OX.** La dirección de máximo
      cambio es siempre la del gradiente. Si esa dirección es horizontal,
      entonces la componente vertical se anula:

      $$
      f_y(1,2) = 4a+b = 0
      \qquad\Longrightarrow\qquad
      b = -4a
      $$

      **Condición 2 — ese máximo vale 8.** El valor máximo de la derivada
      direccional es el módulo del gradiente, que aquí es $|f_x|$:

      $$
      |4a+2b| = 8
      $$

      Sustituyendo $b=-4a$:

      $$
      |4a-8a| = |-4a| = 4|a| = 8
      \qquad\Longrightarrow\qquad
      |a| = 2
      $$

      **Solución:** $a = 2,\ b = -8$ **o bien** $a = -2,\ b = 8$.

      > **Las dos soluciones son correctas y hay que darlas.** El enunciado fija
      > la *recta* en que se da el máximo, no el sentido: el gradiente puede
      > apuntar hacia el este o hacia el oeste, y las dos opciones cumplen todo
      > lo pedido. Quedarse con una sola pierde puntos.

  - id: aproximar-con-la-diferencial
    titulo: Aproximar un valor con el plano tangente
    fuente: Ejercicios 6.5 y 6.6 · Problemas complementarios, tema 6 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Sea $f(x,y) = x^{2}+y^{2}-2xy+2y-2$.

      a) Obtener la ecuación del plano tangente a la superficie $z = f(x,y)$ en
      el punto $P(1,2,3)$.
      b) Utilizando la diferencial, aproximar el valor de $f(1{,}1;\,1{,}9)$.
    pide: El plano tangente en P y la aproximación de f(1,1; 1,9).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Para qué sirve el plano tangente al aproximar?
        opciones:
          - texto: Sustituye a la superficie cerca del punto, y es fácil de evaluar
            correcta: true
            mensaje: |
              Sí. Es la versión de dos variables de la recta tangente: cerca del
              punto de apoyo, plano y superficie casi coinciden, y el plano se
              evalúa con sumas y productos.
          - texto: Da el valor exacto de la función en cualquier punto
            mensaje: |
              Solo en el punto de apoyo. Cuanto más te alejas, más se separan —
              es la misma limitación que tenía Taylor en el tema 4.
          - texto: Indica la dirección de máximo crecimiento
            mensaje: |
              Esa es la del gradiente. El plano tangente es otra cosa, aunque se
              construya con las mismas derivadas parciales.
      - tipo: calcular
        titulo: La parcial respecto de x en P
        pregunta: |
          Con $f_x = 2x-2y$, ¿cuánto vale $f_x(1,2)$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Signo cambiado. $2\cdot 1 - 2\cdot 2 = 2-4 = -2$.
          - valor: '6'
            mensaje: |
              Parece que has sumado en vez de restar. El término $-2xy$ aporta
              $-2y$ a la derivada en $x$, con signo negativo.
        pista: |
          $2(1) - 2(2)$. Ojo al signo.
        desarrollo: |
          $$
          f_x(1,2) = 2(1)-2(2) = -2
          $$

          Y $f_y = 2y-2x+2$, que en $(1,2)$ vale $4-2+2 = 4$.
      - tipo: calcular
        titulo: La aproximación
        pregunta: |
          Con el plano $z = 3 - 2(x-1) + 4(y-2)$, ¿cuánto vale la aproximación
          de $f(1{,}1;\,1{,}9)$?
        respuesta:
          tipo: numero
          valor: '2.4'
          tolerancia: 0.01
          formato: con un decimal
        distractores:
          - valor: '3.6'
            mensaje: |
              Parece que has cambiado los signos de los incrementos.
              $x-1 = +0{,}1$ pero $y-2 = -0{,}1$, así que un término suma y el
              otro resta.
          - valor: '3'
            mensaje: |
              3 es $f(1,2)$, el valor en el punto de apoyo. Falta corregirlo con
              los dos incrementos.
        pista: |
          $3 - 2(0{,}1) + 4(-0{,}1)$. Fíjate en que el segundo incremento es negativo.
        desarrollo: |
          $$
          z = 3 - 2(1{,}1-1) + 4(1{,}9-2)
          = 3 - 2(0{,}1) + 4(-0{,}1)
          = 3 - 0{,}2 - 0{,}4 = 2{,}4
          $$
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'El plano tangente es $z = f(a,b) + f_x(a,b)(x-a) + f_y(a,b)(y-b)$.'
          - texto: 'Aquí $f(1,2)=3$, $f_x(1,2)=-2$ y $f_y(1,2)=4$.'
          - texto: 'Luego el plano es $z = 3 -2(x-1) + 4(y-2)$.'
          - texto: 'Evaluándolo en $(1{,}1;\,1{,}9)$ sale $2{,}4$, la aproximación pedida.'
          - texto: 'Como el plano es tangente, $2{,}4$ es el valor exacto de $f(1{,}1;\,1{,}9)$.'
            trampa: true
            mensaje: |
              Es una **aproximación**, no el valor exacto. El plano y la
              superficie solo coinciden exactamente en el punto de apoyo
              $(1,2)$; en cualquier otro hay error, aunque sea pequeño.
    resolucion: |
      **a) El plano tangente.** La fórmula se lee como una frase: partes de la
      altura en el punto y le sumas lo que subes al moverte en cada dirección.

      $$
      z = f(a,b) + f_x(a,b)\,(x-a) + f_y(a,b)\,(y-b)
      $$

      Con $f(x,y) = x^{2}+y^{2}-2xy+2y-2$:

      $$
      f_x = 2x-2y,
      \qquad
      f_y = 2y-2x+2
      $$

      En $(1,2)$: $f_x = -2$, $f_y = 4$, y $f(1,2) = 1+4-4+4-2 = 3$ — que
      concuerda con la $z=3$ que da el enunciado. **Conviene comprobarlo**: si
      no cuadrara, el punto no estaría en la superficie y el ejercicio no
      tendría sentido.

      $$
      \boxed{z = 3 - 2(x-1) + 4(y-2)}
      $$

      **b) La aproximación.** Se evalúa el plano donde no sabemos evaluar la
      superficie:

      $$
      f(1{,}1;\,1{,}9) \approx 3 - 2(0{,}1) + 4(-0{,}1) = 2{,}4
      $$

      **El detalle que se falla**: el segundo incremento es **negativo**, porque
      $1{,}9$ está por debajo de $2$. Tratar los dos como positivos da $3{,}6$,
      que es el distractor de este ejercicio.

      > Sin calculadora, el valor exacto sería $f(1{,}1;\,1{,}9) = 2{,}41$. El
      > plano da $2{,}4$ con un error de una centésima moviéndote una décima en
      > cada eje: eso es lo que significa que la aproximación sea **local**.

  # ═══════════════════════════════════════════════════════════════════
  # Boletín «Funciones reales de varias variables reales. Problemas» ·
  # los diez ejercicios. El boletín NO publica resultados: todos los que
  # aparecen aquí están calculados y comprobados por derivación numérica.
  # ═══════════════════════════════════════════════════════════════════

  - id: seis-parciales-de-primer-orden
    titulo: Seis parciales de primer orden, y la variable que se queda quieta
    fuente: >-
      Ejercicio 1 · Boletín «Funciones reales de varias variables reales.
      Problemas» · Cálculo, UPV/EHU. El boletín no publica resultados; los de
      aquí están comprobados por derivación numérica en tres puntos.
    nivel: practica
    enunciado: |
      Calcular las derivadas parciales de primer orden de las siguientes
      funciones:

      (a) $Z = x^{3}y^{2}+x^{2}y^{3}+x^{2}+y^{2}+3$
      &nbsp;&nbsp;&nbsp;
      (d) $Z = \operatorname{sh}(xy)$

      (b) $Z = \operatorname{sen}(xy)$
      &nbsp;&nbsp;&nbsp;
      (e) $Z = \ln\dfrac{x}{y}$

      (c) $Z = \operatorname{tg}(x+y)$
      &nbsp;&nbsp;&nbsp;
      (f) $Z = \arctan(xy)$
    pide: Las dos derivadas parciales de primer orden de cada función.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al derivar respecto de $x$, ¿qué papel juega la $y$?
        opciones:
          - texto: >-
              El de una constante: se deriva exactamente como en una variable,
              tratando $y$ como un número
            correcta: true
            mensaje: |
              Eso es todo el concepto. En (b), $\operatorname{sen}(xy)$
              derivada en $x$ es $\cos(xy)$ por la derivada de lo de dentro,
              que es $y$ — como si fuera $\operatorname{sen}(3x)$ con $3$ en
              vez de $y$.
          - texto: >-
              Hay que derivarla también, con la regla del producto
            mensaje: |
              Eso sería si $y$ dependiera de $x$. En una parcial, las otras
              variables se congelan.
          - texto: >-
              Se sustituye por cero
            mensaje: |
              Se trata como constante, que no es lo mismo que anularla. En
              (e), $\ln\tfrac{x}{y}$ derivada en $x$ da $\tfrac1x$ porque
              $\ln\tfrac{x}{y}=\ln x-\ln y$ y el segundo trozo es constante,
              no cero.

      - tipo: calcular
        titulo: El apartado (a), evaluado
        pregunta: |
          $Z_x = 3x^{2}y^{2}+2xy^{3}+2x$. ¿Cuánto vale en el punto $(1,2)$?
        respuesta:
          tipo: numero
          valor: '30'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '20'
            mensaje: |
              $20$ es $Z_y$ en ese punto. Fíjate en cuál de las dos te piden:
              $Z_x$ lleva $3x^{2}y^{2}$ delante y $Z_y$ lleva $2x^{3}y$.
          - valor: '28'
            mensaje: |
              Te has dejado el $2x$, que viene de derivar el $x^{2}$ suelto.
              El $+3$ del final sí desaparece.
        pista: |
          $3\cdot1\cdot4 + 2\cdot1\cdot8 + 2$.
        desarrollo: |
          $$
          Z_x(1,2) = 3\cdot1\cdot4 + 2\cdot1\cdot8 + 2\cdot1 = 12+16+2 = 30
          $$

      - tipo: calcular
        titulo: El apartado (f), evaluado
        pregunta: |
          $Z_x = \dfrac{y}{1+x^{2}y^{2}}$. ¿Cuánto vale en $(1,1)$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.004
          formato: en forma exacta (1/2) o con un decimal
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es el numerador, $y$. Falta dividir entre
              $1+x^{2}y^{2}=2$.
          - valor: '0.25'
            mensaje: |
              El denominador es $1+x^{2}y^{2}$, no $\left(1+xy\right)^{2}$.
              En $(1,1)$ vale $2$, no $4$.
        pista: |
          $\dfrac{1}{1+1\cdot1}$.
        desarrollo: |
          $$
          Z_x(1,1) = \frac{1}{1+1} = \frac12
          $$

          Y por la simetría de $\arctan(xy)$ en $x$ e $y$, $Z_y$ vale lo mismo
          en ese punto.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Derivar parcialmente respecto de $x$ es derivar en una variable
              tratando $y$ como constante.
          - texto: >-
              En (e), $\ln\tfrac{x}{y}=\ln x-\ln y$, así que
              $Z_x=\tfrac1x$ y $Z_y=-\tfrac1y$: cada una depende de **una
              sola** variable.
          - texto: >-
              En (b), (d) y (f) hay regla de la cadena, y la derivada de lo de
              dentro es $y$ para $Z_x$ y $x$ para $Z_y$.
          - texto: >-
              Y en (c), como $\operatorname{tg}(x+y)$ es simétrica, las dos
              parciales son iguales en todo punto, igual que en (b).
            trampa: true
            mensaje: |
              En (c) sí lo son —el argumento es $x+y$ y la cadena aporta un
              $1$ por cada lado—, pero en (b) **no**:
              $Z_x=y\cos(xy)$ y $Z_y=x\cos(xy)$ solo coinciden donde $x=y$.
              Que una función sea simétrica al intercambiar $x$ e $y$ no hace
              iguales sus parciales: las intercambia.
        veredicto: |
          Las seis son la regla de la cadena de siempre con una variable
          congelada. El único aviso es (e): partir el logaritmo del cociente
          antes de derivar convierte el ejercicio en dos derivadas de una
          variable.
    resolucion: |
      **Las seis.**

      | $Z$ | $Z_x$ | $Z_y$ |
      |---|---|---|
      | $x^{3}y^{2}+x^{2}y^{3}+x^{2}+y^{2}+3$ | $3x^{2}y^{2}+2xy^{3}+2x$ | $2x^{3}y+3x^{2}y^{2}+2y$ |
      | $\operatorname{sen}(xy)$ | $y\cos(xy)$ | $x\cos(xy)$ |
      | $\operatorname{tg}(x+y)$ | $\dfrac{1}{\cos^{2}(x+y)}$ | $\dfrac{1}{\cos^{2}(x+y)}$ |
      | $\operatorname{sh}(xy)$ | $y\operatorname{ch}(xy)$ | $x\operatorname{ch}(xy)$ |
      | $\ln\dfrac{x}{y}$ | $\dfrac1x$ | $-\dfrac1y$ |
      | $\arctan(xy)$ | $\dfrac{y}{1+x^{2}y^{2}}$ | $\dfrac{x}{1+x^{2}y^{2}}$ |

      ### 1 · La regla

      $$
      \frac{\partial Z}{\partial x}
      = \lim_{h\to0}\frac{Z(x+h,y)-Z(x,y)}{h}
      $$

      La $y$ no se mueve: es una derivada de una variable con un parámetro
      dentro.

      ### 2 · Los tres tipos que aparecen

      | tipo | ejemplos | qué hay que hacer |
      |---|---|---|
      | polinómico | (a) | derivar término a término |
      | cadena con $xy$ dentro | (b), (d), (f) | multiplicar por $y$ o por $x$ |
      | cadena con $x+y$ dentro | (c) | multiplicar por $1$ |

      El apartado (e) es aparte: **conviene simplificar antes**.
      $\ln\tfrac{x}{y}=\ln x-\ln y$, y cada parcial se queda con un solo
      término.

      ### 3 · La comprobación

      En una función simétrica —(b), (d), (f)— tiene que cumplirse
      $Z_x(x,y)=Z_y(y,x)$: al intercambiar las variables, las parciales se
      intercambian. Se comprueba de un vistazo en la tabla.

      **Lo que hay que llevarse.** No hay nada nuevo respecto de una variable
      salvo la disciplina de **congelar** las demás. Y el atajo que más veces
      sirve: si la función se puede partir en suma —como el logaritmo del
      cociente— cada parcial se queda con la mitad.

  - id: cuatro-segundas-respecto-de-x
    titulo: Cuatro segundas en x, y la que esconde un ángulo
    fuente: >-
      Ejercicio 2 · Boletín «Funciones reales de varias variables reales.
      Problemas» · Cálculo, UPV/EHU. El boletín no publica resultados; los de
      aquí están comprobados por derivación numérica.
    nivel: practica
    enunciado: |
      Calcular $\dfrac{\partial^{2}Z}{\partial x^{2}}$ para las siguientes
      funciones:

      (a) $Z = x\ln(xy)$
      &nbsp;&nbsp;&nbsp;
      (c) $Z = x\operatorname{sen}(x+y)$

      (b) $Z = e^{xy}$
      &nbsp;&nbsp;&nbsp;
      (d) $Z = \arcsin\dfrac{x}{\left(x^{2}+y^{2}\right)^{1/2}}$
    pide: La derivada segunda respecto de x de cada función.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado (d) es $\arcsin\dfrac{x}{\sqrt{x^{2}+y^{2}}}$. ¿Qué es
          ese cociente?
        opciones:
          - texto: >-
              El **coseno del ángulo polar**: si $x=r\cos\theta$ e
              $y=r\operatorname{sen}\theta$, el cociente es $\cos\theta$
            correcta: true
            mensaje: |
              Exacto, y con eso el ejercicio se derrumba:
              $\arcsin(\cos\theta)=\tfrac{\pi}{2}-\theta$, así que
              $Z=\tfrac{\pi}{2}-\arctan\tfrac{y}{x}$ y derivar es inmediato.
          - texto: >-
              Una función sin interpretación geométrica
            mensaje: |
              La tiene, y es la que resuelve el ejercicio. $x$ dividido por la
              distancia al origen es el coseno del ángulo.
          - texto: >-
              La distancia al origen
            mensaje: |
              La distancia es el denominador, $\sqrt{x^{2}+y^{2}}$. El cociente
              es adimensional y vale entre $-1$ y $1$.

      - tipo: calcular
        titulo: El apartado (a)
        pregunta: |
          $Z=x\ln(xy)$. ¿Cuánto vale $Z_{xx}$ en $x=2$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.004
          formato: en forma exacta (1/x, que en x=2 es 1/2) o con un decimal
        distractores:
          - valor: '0'
            mensaje: |
              $Z_x = \ln(xy)+1$, que **sí** depende de $x$. Su derivada es
              $\tfrac1x$, no cero.
          - valor: '-0.25'
            mensaje: |
              $-\tfrac{1}{x^{2}}$ es la **tercera** derivada. La segunda es
              $\tfrac1x$.
        pista: |
          $Z_x = \ln(xy) + 1$, y la derivada de $\ln(xy)$ respecto de $x$ es
          $\tfrac1x$.
        desarrollo: |
          $$
          Z_x = \ln(xy) + x\cdot\frac{y}{xy} = \ln(xy)+1
          $$

          $$
          Z_{xx} = \frac1x
          $$

          En $x=2$: $\tfrac12$. **Y fíjate en que no depende de $y$**: el
          $\ln y$ del desarrollo es constante en $x$ y desaparece al derivar
          dos veces.

      - tipo: calcular
        titulo: El apartado (d)
        pregunta: |
          Para $Z=\arcsin\dfrac{x}{\sqrt{x^{2}+y^{2}}}$ sale
          $Z_{xx} = \dfrac{-2xy}{\left(x^{2}+y^{2}\right)^{2}}$. ¿Cuánto vale
          en $(1,1)$?
        respuesta:
          tipo: numero
          valor: '-0.5'
          tolerancia: 0.004
          formato: en forma exacta (-1/2) o con un decimal
        distractores:
          - valor: '0.5'
            mensaje: |
              El signo. En el primer cuadrante $x$ e $y$ son positivos, así que
              $-2xy$ es negativo.
          - valor: '-1'
            mensaje: |
              El denominador es $\left(x^{2}+y^{2}\right)^{2}$, que en $(1,1)$
              vale $4$, no $2$.
        pista: |
          $\dfrac{-2\cdot1\cdot1}{\left(1+1\right)^{2}}$.
        desarrollo: |
          $$
          Z_{xx}(1,1) = \frac{-2}{4} = -\frac12
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              En (a), el producto obliga a la regla del producto, pero después
              todo se simplifica: $Z_x=\ln(xy)+1$.
          - texto: >-
              En (c), $Z_x=\operatorname{sen}(x+y)+x\cos(x+y)$ y otra vez el
              producto: $Z_{xx}=2\cos(x+y)-x\operatorname{sen}(x+y)$.
          - texto: >-
              En (d), el cociente es $\cos\theta$, así que
              $Z=\tfrac{\pi}{2}-\theta$ y $Z_x=\tfrac{y}{x^{2}+y^{2}}$.
          - texto: >-
              Y por eso $Z$ en (d) no depende de $r$, y $Z_{xx}$ tampoco.
            trampa: true
            mensaje: |
              $Z$ no depende de $r$, correcto; pero **$Z_{xx}$ sí**, y mucho:
              vale $\tfrac{-2xy}{\left(x^{2}+y^{2}\right)^{2}}$, que decrece
              como $\tfrac{1}{r^{2}}$. Derivar respecto de $x$ mezcla $r$ y
              $\theta$, así que una función de solo $\theta$ tiene derivadas
              que dependen de $r$.
        veredicto: |
          El apartado (d) es el que enseña algo: reconocer que una expresión
          es un ángulo disfrazado convierte un arcoseno con raíz en una
          arcotangente de dos líneas. Buscar ese tipo de simplificación antes
          de derivar es el hábito que ahorra ejercicios enteros.
    resolucion: |
      **Las cuatro.**

      | $Z$ | $Z_{xx}$ |
      |---|---|
      | $x\ln(xy)$ | $\dfrac1x$ |
      | $e^{xy}$ | $y^{2}e^{xy}$ |
      | $x\operatorname{sen}(x+y)$ | $2\cos(x+y)-x\operatorname{sen}(x+y)$ |
      | $\arcsin\dfrac{x}{\sqrt{x^{2}+y^{2}}}$ | $\dfrac{-2xy}{\left(x^{2}+y^{2}\right)^{2}}$ |

      ### 1 · Las tres directas

      **(a)** $Z_x=\ln(xy)+1$, y $Z_{xx}=\tfrac1x$.

      **(b)** $Z_x=ye^{xy}$, y $Z_{xx}=y^{2}e^{xy}$: cada derivada en $x$
      multiplica por $y$.

      **(c)** Regla del producto dos veces:

      $$
      Z_x = \operatorname{sen}(x+y)+x\cos(x+y)
      $$

      $$
      Z_{xx} = \cos(x+y)+\cos(x+y)-x\operatorname{sen}(x+y)
      = 2\cos(x+y)-x\operatorname{sen}(x+y)
      $$

      ### 2 · El apartado (d), por el camino corto

      En polares, $\dfrac{x}{\sqrt{x^{2}+y^{2}}}=\cos\theta$, y

      $$
      \arcsin(\cos\theta) = \frac{\pi}{2}-\theta
      \qquad (0\le\theta\le\pi)
      $$

      Así que $Z=\tfrac{\pi}{2}-\arctan\tfrac{y}{x}$, y

      $$
      Z_x = \frac{y}{x^{2}+y^{2}},
      \qquad
      Z_{xx} = \frac{-2xy}{\left(x^{2}+y^{2}\right)^{2}}
      $$

      ### 3 · Y por el camino largo, para comprobar

      Con $u=\dfrac{x}{\sqrt{x^{2}+y^{2}}}$:

      $$
      u_x = \frac{y^{2}}{\left(x^{2}+y^{2}\right)^{3/2}},
      \qquad
      \sqrt{1-u^{2}} = \frac{\lvert y\rvert}{\sqrt{x^{2}+y^{2}}}
      $$

      $$
      Z_x = \frac{u_x}{\sqrt{1-u^{2}}}
      = \frac{y^{2}}{\lvert y\rvert\left(x^{2}+y^{2}\right)}
      = \frac{y}{x^{2}+y^{2}} \quad (y>0)
      $$

      Los dos caminos coinciden. **El corto son dos líneas y el largo ocho.**

      **Lo que hay que llevarse.** Antes de derivar, mirar si la expresión
      esconde algo conocido. $\tfrac{x}{r}$ es un coseno, $\tfrac{y}{x}$ es una
      tangente, y $\ln$ de un producto es una suma: las tres simplificaciones
      convierten estos cuatro apartados en ejercicios de una línea.

  - id: las-cuartas-que-se-anulan
    titulo: Dos derivadas cuartas, y las que se anulan antes de llegar
    fuente: >-
      Ejercicio 3 · Boletín «Funciones reales de varias variables reales.
      Problemas» · Cálculo, UPV/EHU. El boletín no publica resultados; los de
      aquí están comprobados por derivación numérica.
    nivel: practica
    enunciado: |
      Calcular $\dfrac{\partial^{4}Z}{\partial x^{4}}$ y
      $\dfrac{\partial^{4}Z}{\partial x^{3}\partial y}$ para las siguientes
      funciones:

      (a) $Z = x\ln(xy)$

      (b) $Z = x^{2}\ln(2y)+\operatorname{sen}3y$
    pide: Las dos derivadas cuartas de cada función.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué significa $\dfrac{\partial^{4}Z}{\partial x^{3}\partial y}$?
        opciones:
          - texto: >-
              Derivar tres veces respecto de $x$ y una respecto de $y$, en
              cualquier orden: el teorema de Schwarz garantiza que da lo mismo
            correcta: true
            mensaje: |
              Eso es, y el orden se elige por comodidad. Aquí conviene derivar
              primero las tres veces en $x$: en las dos funciones el resultado
              es tan simple que la derivada en $y$ sale sola.
          - texto: >-
              Derivar cuatro veces en $x$ y luego una en $y$
            mensaje: |
              Son cuatro derivadas **en total**: tres en $x$ y una en $y$. El
              $4$ de arriba es la suma de los exponentes de abajo.
          - texto: >-
              Derivar tres veces en $x$ dividido por la derivada en $y$
            mensaje: |
              La notación de las parciales no es un cociente. Es una
              abreviatura de «derivar tantas veces respecto de cada
              variable».

      - tipo: calcular
        titulo: La cuarta en x del apartado (a)
        pregunta: |
          Para $Z=x\ln(xy)$ sale $Z_{xxxx}=\dfrac{2}{x^{3}}$. ¿Cuánto vale en
          $x=2$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.002
          formato: en forma exacta (1/4) o con dos decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              $\tfrac12$ es $Z_{xx}=\tfrac1x$ en $x=2$. Faltan dos derivadas
              más.
          - valor: '-0.25'
            mensaje: |
              $-\tfrac{1}{x^{2}}$ es $Z_{xxx}$, y en $x=2$ vale $-\tfrac14$.
              La siguiente derivada vuelve a cambiar el signo.
        pista: |
          La cadena es $\ln(xy)+1 \to \tfrac1x \to -\tfrac{1}{x^{2}} \to
          \tfrac{2}{x^{3}}$.
        desarrollo: |
          $$
          Z_x = \ln(xy)+1,
          \quad Z_{xx} = \frac1x,
          \quad Z_{xxx} = -\frac{1}{x^{2}},
          \quad Z_{xxxx} = \frac{2}{x^{3}}
          $$

          En $x=2$: $\tfrac{2}{8}=\tfrac14$.

      - tipo: calcular
        titulo: La mixta, en las dos
        pregunta: |
          ¿Cuánto vale $\dfrac{\partial^{4}Z}{\partial x^{3}\partial y}$ en el
          apartado (a)?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '0.25'
            mensaje: |
              $\tfrac{2}{x^{3}}$ es la cuarta en $x$. La mixta deriva solo tres
              veces en $x$ y una en $y$, y $Z_{xxx}=-\tfrac{1}{x^{2}}$ ya no
              lleva $y$.
          - valor: '1'
            mensaje: |
              Derivar una constante respecto de $y$ da $0$, no $1$.
        pista: |
          $Z_{xxx} = -\tfrac{1}{x^{2}}$. ¿Depende de $y$?
        desarrollo: |
          $$
          Z_{xxx} = -\frac{1}{x^{2}}
          \;\Longrightarrow\;
          \frac{\partial}{\partial y}\left(-\frac{1}{x^{2}}\right) = 0
          $$

          La $y$ solo aparecía en el $\ln y$ del desarrollo
          $Z=x\ln x + x\ln y$, y ese término es **lineal en $x$**: a la segunda
          derivada en $x$ ya ha desaparecido.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $x\ln(xy) = x\ln x + x\ln y$, y el segundo sumando es lineal en
              $x$: muere en la segunda derivada respecto de $x$.
          - texto: >-
              Por eso $Z_{xx}$ en (a) ya no depende de $y$, y la mixta es $0$.
          - texto: >-
              En (b), $x^{2}\ln(2y)$ es cuadrático en $x$ y
              $\operatorname{sen}3y$ no lleva $x$: las dos derivadas cuartas
              son $0$.
          - texto: >-
              Y por eso en (b) todas las derivadas de orden cuatro son cero,
              incluida $\dfrac{\partial^{4}Z}{\partial y^{4}}$.
            trampa: true
            mensaje: |
              $\dfrac{\partial^{4}Z}{\partial y^{4}}$ **no** es cero: el
              $\operatorname{sen}3y$ da $81\operatorname{sen}3y$, y el
              $x^{2}\ln(2y)$ da $-\tfrac{6x^{2}}{y^{4}}$. Lo que muere es todo
              lo que lleve tres derivadas en $x$, porque en $x$ la función es
              de grado dos.
        veredicto: |
          El grado en cada variable dice cuántas derivadas aguanta. En (b) la
          función es de grado dos en $x$: a la tercera derivada en $x$ ya no
          queda nada, y da igual lo que se haga después.
    resolucion: |
      **Los cuatro resultados.**

      | $Z$ | $\dfrac{\partial^{4}Z}{\partial x^{4}}$ | $\dfrac{\partial^{4}Z}{\partial x^{3}\partial y}$ |
      |---|---|---|
      | $x\ln(xy)$ | $\dfrac{2}{x^{3}}$ | $0$ |
      | $x^{2}\ln(2y)+\operatorname{sen}3y$ | $0$ | $0$ |

      ### 1 · El apartado (a)

      Partiendo el logaritmo, $Z = x\ln x + x\ln y$:

      | derivada | valor |
      |---|---|
      | $Z_x$ | $\ln x + 1 + \ln y = \ln(xy)+1$ |
      | $Z_{xx}$ | $\tfrac1x$ |
      | $Z_{xxx}$ | $-\tfrac{1}{x^{2}}$ |
      | $Z_{xxxx}$ | $\tfrac{2}{x^{3}}$ |

      Y como $Z_{xxx}$ ya no lleva $y$, la mixta es $0$.

      ### 2 · El apartado (b), sin derivar apenas

      $$
      Z = x^{2}\ln(2y)+\operatorname{sen}3y
      $$

      En $x$, la función es un **polinomio de grado dos**: $Z_{xxx}=0$. Y de
      ahí en adelante, todo lo que lleve tres derivadas en $x$ vale cero, sea
      cual sea lo que se haga después.

      ### 3 · La regla que se lleva uno

      | si $Z$ es, en $x$… | entonces… |
      |---|---|
      | polinomio de grado $n$ | toda derivada con más de $n$ derivadas en $x$ es $0$ |
      | lineal en $x$ | $Z_{xx}=0$ |

      Y lo mismo por el otro lado: en (b), $\dfrac{\partial^{4}Z}{\partial
      y^{4}} = -\dfrac{6x^{2}}{y^{4}}+81\operatorname{sen}3y$, que no es cero
      ni de lejos.

      **Lo que hay que llevarse.** Antes de empezar a derivar cuatro veces,
      **mirar el grado de la función en cada variable**. En estos dos
      apartados, esa mirada resuelve tres de los cuatro resultados sin
      escribir nada.

  - id: ocho-funciones-con-todas-sus-segundas
    titulo: Ocho funciones, sus dos primeras y sus tres segundas
    fuente: >-
      Ejercicio 4 · Boletín «Funciones reales de varias variables reales.
      Problemas» · Cálculo, UPV/EHU. El boletín no publica resultados; los de
      aquí están comprobados por derivación numérica.
    nivel: practica
    enunciado: |
      Calcular las derivadas parciales de primer y segundo orden de las
      siguientes funciones:

      (a) $Z = \dfrac{\cos(x^{2})}{y}$
      &nbsp;&nbsp;&nbsp;
      (e) $Z = \ln\dfrac{2x+y}{x^{2}}$

      (b) $Z = e^{ax+by}$
      &nbsp;&nbsp;&nbsp;
      (f) $Z = \dfrac{x}{y}$

      (c) $Z = \left(x^{2}+y^{2}\right)^{1/2}$
      &nbsp;&nbsp;&nbsp;
      (g) $Z = \operatorname{sen}\left(x^{2}+y^{2}\right)$

      (d) $Z = \ln(x+y)$
      &nbsp;&nbsp;&nbsp;
      (h) $Z = \cos(x^{2})\ln(2y)$
    pide: Las dos primeras y las tres segundas de cada función.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántas derivadas segundas distintas tiene una función de dos
          variables?
        opciones:
          - texto: >-
              Tres: $Z_{xx}$, $Z_{yy}$ y la cruzada $Z_{xy}=Z_{yx}$, que
              coinciden por el teorema de Schwarz
            correcta: true
            mensaje: |
              Eso es, siempre que las cruzadas sean continuas — cosa que se
              cumple en las ocho de aquí. Por eso se calculan tres y no
              cuatro.
          - texto: >-
              Cuatro, y en general distintas
            mensaje: |
              Son cuatro expresiones, pero dos de ellas coinciden. Hay
              contraejemplos con cruzadas distintas, pero exigen funciones
              artificiales con derivadas discontinuas en un punto.
          - texto: >-
              Dos, una por variable
            mensaje: |
              Falta la cruzada, que es la que mide cómo cambia la pendiente en
              $x$ al moverse en $y$ — y la que aparece en el hessiano.

      - tipo: calcular
        titulo: El apartado (c), evaluado
        pregunta: |
          Para $Z=\sqrt{x^{2}+y^{2}}$ sale
          $Z_{xx}=\dfrac{y^{2}}{\left(x^{2}+y^{2}\right)^{3/2}}$. ¿Cuánto vale
          en $(3,4)$?
        respuesta:
          tipo: numero
          valor: '0.128'
          tolerancia: 0.001
          formato: en forma exacta (16/125) o con tres decimales
        distractores:
          - valor: '0.072'
            mensaje: |
              $\tfrac{9}{125}$ es $Z_{yy}$, que lleva $x^{2}$ arriba. Las dos
              se intercambian al intercambiar las variables.
          - valor: '0.64'
            mensaje: |
              El denominador es $r^{3}=125$, no $r=5$. La potencia es
              $\tfrac32$.
        pista: |
          $r=\sqrt{9+16}=5$, así que $r^{3}=125$, y arriba va $y^{2}=16$.
        desarrollo: |
          $$
          Z_{xx}(3,4) = \frac{16}{125} = 0{,}128
          $$

          Y una comprobación bonita:
          $Z_{xx}+Z_{yy} = \dfrac{y^{2}+x^{2}}{r^{3}} = \dfrac1r$. La
          distancia al origen cumple $\Delta Z = \tfrac1r$, que es la ecuación
          de Laplace con fuente — y por eso $\sqrt{x^{2}+y^{2}}$ no es
          armónica.

      - tipo: calcular
        titulo: La cruzada del apartado (b)
        pregunta: |
          Para $Z=e^{ax+by}$, la cruzada es $Z_{xy}=ab\,e^{ax+by}$. Con
          $a=2$, $b=3$, ¿cuánto vale en $(0,0)$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '5'
            mensaje: |
              $a+b$ sería si las derivadas se sumaran. Cada derivada
              **multiplica** por su coeficiente.
          - valor: '1'
            mensaje: |
              $e^{0}=1$, sí, pero falta el $ab$ que sale de derivar una vez en
              cada variable.
        pista: |
          $e^{0}=1$, y $ab = 2\cdot3$.
        desarrollo: |
          $$
          Z_{xy}(0,0) = ab\,e^{0} = 6
          $$

          En una exponencial lineal, **cada derivada multiplica por el
          coeficiente de su variable**: $Z_{xx}=a^{2}Z$, $Z_{yy}=b^{2}Z$,
          $Z_{xy}=abZ$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              En (e) conviene partir el logaritmo:
              $\ln\tfrac{2x+y}{x^{2}} = \ln(2x+y)-2\ln x$, y así $Z_y$ solo
              lleva un término.
          - texto: >-
              En (f), $Z=\tfrac{x}{y}$ es lineal en $x$, así que $Z_{xx}=0$.
          - texto: >-
              En (b), cada derivada multiplica por el coeficiente de su
              variable: $Z_{xy}=ab\,Z$.
          - texto: >-
              Y en (c), como $Z=r$ es la distancia al origen y solo depende de
              $r$, sus segundas también dependen solo de $r$.
            trampa: true
            mensaje: |
              $Z_{xx}=\tfrac{y^{2}}{r^{3}}$ depende **también del ángulo**:
              en $(r,0)$ vale $0$ y en $(0,r)$ vale $\tfrac1r$. Que la función
              sea radial no hace radiales sus derivadas parciales, que están
              atadas a unos ejes concretos. La que sí es radial es la suma
              $Z_{xx}+Z_{yy}=\tfrac1r$.
        veredicto: |
          El truco que más veces sirve en estas ocho es **partir antes de
          derivar**: el logaritmo de un cociente en (e), el producto de
          funciones de una variable en (a) y (h). Cada partición convierte una
          derivada de dos variables en dos de una.
    resolucion: |
      **Las ocho, resumidas.**

      | $Z$ | $Z_x$ | $Z_y$ |
      |---|---|---|
      | (a) $\tfrac{\cos x^{2}}{y}$ | $\tfrac{-2x\operatorname{sen}x^{2}}{y}$ | $\tfrac{-\cos x^{2}}{y^{2}}$ |
      | (b) $e^{ax+by}$ | $aZ$ | $bZ$ |
      | (c) $r=\sqrt{x^{2}+y^{2}}$ | $\tfrac{x}{r}$ | $\tfrac{y}{r}$ |
      | (d) $\ln(x+y)$ | $\tfrac{1}{x+y}$ | $\tfrac{1}{x+y}$ |
      | (e) $\ln\tfrac{2x+y}{x^{2}}$ | $\tfrac{2}{2x+y}-\tfrac2x$ | $\tfrac{1}{2x+y}$ |
      | (f) $\tfrac{x}{y}$ | $\tfrac1y$ | $-\tfrac{x}{y^{2}}$ |
      | (g) $\operatorname{sen}(x^{2}+y^{2})$ | $2x\cos(x^{2}+y^{2})$ | $2y\cos(x^{2}+y^{2})$ |
      | (h) $\cos x^{2}\ln 2y$ | $-2x\operatorname{sen}x^{2}\ln2y$ | $\tfrac{\cos x^{2}}{y}$ |

      | $Z$ | $Z_{xx}$ | $Z_{yy}$ | $Z_{xy}$ |
      |---|---|---|---|
      | (a) | $\tfrac{-2\operatorname{sen}x^{2}-4x^{2}\cos x^{2}}{y}$ | $\tfrac{2\cos x^{2}}{y^{3}}$ | $\tfrac{2x\operatorname{sen}x^{2}}{y^{2}}$ |
      | (b) | $a^{2}Z$ | $b^{2}Z$ | $abZ$ |
      | (c) | $\tfrac{y^{2}}{r^{3}}$ | $\tfrac{x^{2}}{r^{3}}$ | $\tfrac{-xy}{r^{3}}$ |
      | (d) | $\tfrac{-1}{(x+y)^{2}}$ | $\tfrac{-1}{(x+y)^{2}}$ | $\tfrac{-1}{(x+y)^{2}}$ |
      | (e) | $\tfrac{-4}{(2x+y)^{2}}+\tfrac{2}{x^{2}}$ | $\tfrac{-1}{(2x+y)^{2}}$ | $\tfrac{-2}{(2x+y)^{2}}$ |
      | (f) | $0$ | $\tfrac{2x}{y^{3}}$ | $\tfrac{-1}{y^{2}}$ |
      | (g) | $2\cos-4x^{2}\operatorname{sen}$ | $2\cos-4y^{2}\operatorname{sen}$ | $-4xy\operatorname{sen}$ |
      | (h) | $\left(-2\operatorname{sen}x^{2}-4x^{2}\cos x^{2}\right)\ln2y$ | $\tfrac{-\cos x^{2}}{y^{2}}$ | $\tfrac{-2x\operatorname{sen}x^{2}}{y}$ |

      (En (g), el argumento de seno y coseno es siempre $x^{2}+y^{2}$.)

      ### 1 · Los dos atajos que se repiten

      **Partir sumas.** En (e), $\ln\tfrac{2x+y}{x^{2}}=\ln(2x+y)-2\ln x$: la
      segunda parte no lleva $y$, así que $Z_y$ y $Z_{yy}$ salen de un solo
      término.

      **Partir productos de funciones de una variable.** En (a) y en (h),
      $Z=f(x)g(y)$, y entonces

      $$
      Z_{xx}=f''g, \qquad Z_{yy}=fg'', \qquad Z_{xy}=f'g'
      $$

      Tres derivadas de una variable en vez de tres de dos.

      ### 2 · La comprobación de Schwarz

      En las ocho, $Z_{xy}=Z_{yx}$. Calcular la cruzada por los dos caminos
      —primero en $x$ y luego en $y$, y al revés— es la comprobación gratuita
      de todo el ejercicio, y caza casi cualquier error de signo.

      ### 3 · Dos casos con nombre

      | función | qué cumple |
      |---|---|
      | (c) $r$ | $Z_{xx}+Z_{yy}=\tfrac1r$ |
      | (d) $\ln(x+y)$ | las tres segundas son iguales |

      La (d) es especial porque solo depende de $x+y$: toda derivada respecto
      de $x$ es igual a la misma respecto de $y$.

      **Lo que hay que llevarse.** Partir antes de derivar, y comprobar con
      Schwarz al terminar. Con esas dos costumbres, ocho funciones con cinco
      derivadas cada una se hacen sin errores y en la mitad de tiempo.

  - id: dos-cruzadas-largas
    titulo: Dos cruzadas largas, y la simplificación que aparece al final
    fuente: >-
      Ejercicio 5 · Boletín «Funciones reales de varias variables reales.
      Problemas» · Cálculo, UPV/EHU. El boletín no publica resultados; los de
      aquí están comprobados por derivación numérica.
    nivel: practica
    enunciado: |
      Calcular $\dfrac{\partial^{2}Z}{\partial x\,\partial y}$ para las
      siguientes funciones:

      (a) $Z = \ln(x+y)\,\operatorname{sen}(xy)$

      (b) $Z = \cos\left(x^{2}+x\right)\,
      \operatorname{sen}\left(\dfrac{x+y^{2}}{2}\right)$
    pide: La derivada cruzada de las dos funciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos son productos de dos factores que dependen de $x$ **y** de
          $y$… ¿o no?
        opciones:
          - texto: >-
              En (a) los dos factores llevan las dos variables; en (b) el
              primero solo lleva $x$, y eso simplifica mucho
            correcta: true
            mensaje: |
              Exacto. En (b), $\cos(x^{2}+x)$ es constante respecto de $y$, así
              que al derivar primero en $y$ sale fuera del paréntesis y la
              cuenta se acorta a la mitad.
          - texto: >-
              Los dos apartados tienen la misma estructura
            mensaje: |
              No: en (b) el primer factor no depende de $y$. Ver eso es el
              primer paso del ejercicio.
          - texto: >-
              En los dos hay que usar la regla del cociente
            mensaje: |
              No hay cocientes: son productos. En (a) el logaritmo aporta un
              $\tfrac{1}{x+y}$ al derivar, pero eso no es una regla del
              cociente.

      - tipo: calcular
        titulo: El apartado (a), evaluado
        pregunta: |
          Sale $Z_{xy} = \cos(xy) - \dfrac{\operatorname{sen}(xy)}{(x+y)^{2}} + \ln(x+y)\left[\cos(xy)-xy\operatorname{sen}(xy)\right]$. ¿Cuánto vale en $(1,1)$?
        respuesta:
          tipo: numero
          valor: '0.1212'
          tolerancia: 0.0008
          formato: con cuatro decimales
        distractores:
          - valor: '0.3299'
            mensaje: |
              Te has dejado el término del logaritmo, que en $(1,1)$ vale
              $\ln2\cdot(\cos1-\operatorname{sen}1)\approx-0{,}2088$.
          - valor: '0.5403'
            mensaje: |
              $\cos1$ es solo el primer sumando. Faltan los otros dos.
        pista: |
          $\cos1\approx0{,}5403$, $\operatorname{sen}1\approx0{,}8415$ y
          $\ln2\approx0{,}6931$.
        desarrollo: |
          $$
          Z_{xy}(1,1) = 0{,}5403 - \frac{0{,}8415}{4}
          + 0{,}6931\left(0{,}5403-0{,}8415\right)
          $$

          $$
          = 0{,}5403 - 0{,}2104 - 0{,}2088 \approx 0{,}1212
          $$

      - tipo: calcular
        titulo: El factor común del apartado (b)
        pregunta: |
          En el apartado (b), todo el resultado tiene un factor común que se
          puede sacar fuera. ¿Cuál es, en $y=3$?
        respuesta:
          tipo: numero
          valor: '-3'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '3'
            mensaje: |
              El signo. Al derivar
              $\operatorname{sen}\tfrac{x+y^{2}}{2}$ respecto de $y$ sale
              $y\cos\tfrac{x+y^{2}}{2}$, y el término que queda arrastra un
              menos del seno del primer factor.
          - valor: '1.5'
            mensaje: |
              $\tfrac{y}{2}$ es lo que aporta la cadena del segundo factor,
              pero el $\tfrac12$ no es común: uno de los dos sumandos lo lleva
              y el otro no.
        pista: |
          Derivar respecto de $y$ solo toca al segundo factor, y la cadena
          saca un $y$ de $\tfrac{y^{2}}{2}$.
        desarrollo: |
          $$
          Z_{xy} = -y\left[\left(2x+1\right)\operatorname{sen}\left(x^{2}+x\right)
          \cos\frac{x+y^{2}}{2}
          + \frac12\cos\left(x^{2}+x\right)
          \operatorname{sen}\frac{x+y^{2}}{2}\right]
          $$

          El factor común es $-y$, que en $y=3$ vale $-3$. Viene de derivar
          $\tfrac{y^{2}}{2}$ dentro del seno.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La cruzada se puede calcular en el orden que convenga, porque las
              dos funciones son de clase $C^{2}$.
          - texto: >-
              En (b) conviene derivar primero en $y$: el factor
              $\cos(x^{2}+x)$ sale fuera y solo queda derivar el seno.
          - texto: >-
              En (a) no hay atajo, pero al final los dos términos con
              $\tfrac{1}{x+y}$ se suman y dan $\cos(xy)$ limpio.
          - texto: >-
              Y por eso el resultado de (a) no depende de $x+y$ más que por el
              logaritmo.
            trampa: true
            mensaje: |
              Sí depende: queda un
              $-\dfrac{\operatorname{sen}(xy)}{(x+y)^{2}}$ que no se cancela
              con nada. Lo que se simplifica es la **suma** de los dos
              términos que llevan $\tfrac{1}{x+y}$ a la primera potencia:
              $\tfrac{x\cos(xy)+y\cos(xy)}{x+y}=\cos(xy)$.
        veredicto: |
          El apartado (a) es de los que se resuelven bien solo si se ordena la
          cuenta: derivar, agrupar por potencias de $\tfrac{1}{x+y}$, y mirar
          qué se suma. Hacerlo a lo bruto da la misma expresión pero con seis
          términos donde caben tres.
    resolucion: |
      ### 1 · El apartado (a)

      $$
      Z_x = \frac{\operatorname{sen}(xy)}{x+y} + \ln(x+y)\,y\cos(xy)
      $$

      Derivando respecto de $y$, término a término:

      $$
      \frac{\partial}{\partial y}\frac{\operatorname{sen}(xy)}{x+y}
      = \frac{x\cos(xy)}{x+y} - \frac{\operatorname{sen}(xy)}{(x+y)^{2}}
      $$

      $$
      \frac{\partial}{\partial y}\left[\ln(x+y)\,y\cos(xy)\right]
      = \frac{y\cos(xy)}{x+y}
      + \ln(x+y)\left[\cos(xy)-xy\operatorname{sen}(xy)\right]
      $$

      Y ahora **la simplificación**: los dos términos con $\tfrac{1}{x+y}$ se
      suman,

      $$
      \frac{x\cos(xy)+y\cos(xy)}{x+y} = \cos(xy)
      $$

      $$
      \boxed{\;
      Z_{xy} = \cos(xy) - \frac{\operatorname{sen}(xy)}{(x+y)^{2}}
      + \ln(x+y)\left[\cos(xy)-xy\operatorname{sen}(xy)\right] \;}
      $$

      ### 2 · El apartado (b), por el lado fácil

      $\cos(x^{2}+x)$ no depende de $y$, así que conviene derivar primero en
      $y$:

      $$
      Z_y = \cos\left(x^{2}+x\right)\cdot y\cos\frac{x+y^{2}}{2}
      $$

      Y ahora en $x$, con la regla del producto:

      $$
      \boxed{\;
      Z_{xy} = -y\left[\left(2x+1\right)\operatorname{sen}\left(x^{2}+x\right)
      \cos\frac{x+y^{2}}{2}
      + \frac12\cos\left(x^{2}+x\right)\operatorname{sen}\frac{x+y^{2}}{2}
      \right] \;}
      $$

      ### 3 · Por qué importa el orden

      | orden | (a) | (b) |
      |---|---|---|
      | primero en $x$ | cuatro términos que luego se agrupan | seis términos |
      | primero en $y$ | lo mismo | **dos** términos |

      En (b), derivar primero por la variable que **solo aparece en un
      factor** ahorra la mitad del trabajo. Schwarz garantiza que el
      resultado es el mismo, así que la elección es libre y conviene usarla.

      **Lo que hay que llevarse.** Dos cosas. Elegir el orden de derivación
      mirando cuál de las dos variables aparece en menos sitios. Y agrupar al
      final: en (a), dos términos que parecían distintos se suman en uno.

  - id: la-misma-funcion-en-tres-cambios
    titulo: La misma función en tres cambios, y el que la deja sin ángulo
    fuente: >-
      Ejercicio 6 · Boletín «Funciones reales de varias variables reales.
      Problemas» · Cálculo, UPV/EHU. El boletín no publica resultados; los de
      aquí están comprobados por derivación numérica.
    nivel: practica
    enunciado: |
      Sea $Z = \operatorname{arctg}\left(x^{2}+y^{2}\right)$. Calcular $Z_u$ y
      $Z_{uv}$ en los siguientes casos:

      (a) $\begin{cases} x = u\operatorname{sen}v\\ y = u\cos v\end{cases}$
      &nbsp;&nbsp;&nbsp;
      (b) $\begin{cases} x = u\operatorname{tg}v\\ y = u\end{cases}$
      &nbsp;&nbsp;&nbsp;
      (c) $\begin{cases} x = u^{1/2}\\ y = u^{1/2}\operatorname{cotg}v\end{cases}$
    pide: Las derivadas Z_u y Z_uv en los tres cambios.
    pasos:
      - tipo: reconocer
        pregunta: |
          La función solo depende de $x^{2}+y^{2}$. ¿Qué conviene hacer antes
          de derivar?
        opciones:
          - texto: >-
              Calcular $x^{2}+y^{2}$ en las variables nuevas: en los tres casos
              sale una expresión corta, y la función se vuelve de una sola
              pieza
            correcta: true
            mensaje: |
              Eso es. En (a) sale $u^{2}$, en (b) $u^{2}\sec^{2}v$ y en (c)
              $u\csc^{2}v$. Derivar después es una cadena de un solo eslabón.
          - texto: >-
              Aplicar la regla de la cadena con las cuatro parciales
            mensaje: |
              Se puede, y sale lo mismo, pero es el camino largo: hay que
              calcular $Z_x$, $Z_y$, $x_u$, $y_u$ y combinarlos. Sustituir
              primero deja una función de $u$ y $v$ directamente.
          - texto: >-
              Nada: hay que derivar tal cual
            mensaje: |
              «Tal cual» no se puede: $Z$ está escrita en $x$ e $y$, y las
              derivadas se piden en $u$ y $v$. Hay que pasar de un lado al
              otro, y sustituir es la forma más corta.

      - tipo: calcular
        titulo: El apartado (a)
        pregunta: |
          Con $x=u\operatorname{sen}v$ e $y=u\cos v$ sale
          $Z=\operatorname{arctg}\left(u^{2}\right)$ y
          $Z_u=\dfrac{2u}{1+u^{4}}$. ¿Cuánto vale en $u=1{,}3$?
        respuesta:
          tipo: numero
          valor: '0.6743'
          tolerancia: 0.0008
          formato: con cuatro decimales
        distractores:
          - valor: '2.6'
            mensaje: |
              $2u$ es solo el numerador. Falta dividir entre $1+u^{4}$, que con
              $u=1{,}3$ vale $3{,}8561$.
          - valor: '0.8874'
            mensaje: |
              $\tfrac{2u}{1+u^{2}}$: el denominador lleva $u^{4}$, porque el
              argumento de la arcotangente es $u^{2}$ y se eleva al cuadrado.
        pista: |
          $1{,}3^{4} = 2{,}8561$.
        desarrollo: |
          $$
          Z_u = \frac{2u}{1+u^{4}}
          = \frac{2{,}6}{1+2{,}8561} \approx 0{,}6743
          $$

      - tipo: calcular
        titulo: La cruzada del apartado (a)
        pregunta: |
          ¿Cuánto vale $Z_{uv}$ en el apartado (a)?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '0.6743'
            mensaje: |
              Ese es $Z_u$. La cruzada deriva además respecto de $v$, y $Z_u$
              no lleva $v$ por ninguna parte.
          - valor: '2.6'
            mensaje: |
              $2u$ tampoco depende de $v$. La respuesta es cero por el mismo
              motivo.
        pista: |
          $Z_u = \tfrac{2u}{1+u^{4}}$. ¿Aparece $v$ ahí?
        desarrollo: |
          $$
          Z_{uv} = \frac{\partial}{\partial v}\left(\frac{2u}{1+u^{4}}\right)
          = 0
          $$

          Y la razón es geométrica: el cambio de (a) es el de las **polares**
          —con $u$ el radio y $v$ el ángulo, cambiados de papel respecto de lo
          habitual—, y $x^{2}+y^{2}$ es el radio al cuadrado. Una función que
          solo depende de la distancia al origen no ve el ángulo.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              En los tres casos conviene calcular primero $x^{2}+y^{2}$ en las
              variables nuevas.
          - texto: >-
              En (a) sale $u^{2}$; en (b),
              $u^{2}\left(1+\operatorname{tg}^{2}v\right)
              = \tfrac{u^{2}}{\cos^{2}v}$; en (c),
              $u\left(1+\operatorname{cotg}^{2}v\right)
              = \tfrac{u}{\operatorname{sen}^{2}v}$.
          - texto: >-
              Solo en (a) desaparece la $v$, y por eso solo en (a) la cruzada
              es cero.
          - texto: >-
              Y en (b) y (c) las cruzadas también se anulan, porque la
              arcotangente es simétrica.
            trampa: true
            mensaje: |
              No se anulan: en (b) y (c) la función **sí** depende de $v$, y sus
              cruzadas son expresiones largas. Lo que decide es si la $v$
              sobrevive a la sustitución, no ninguna simetría de la
              arcotangente.
        veredicto: |
          Los tres cambios son el mismo ejercicio con tres disfraces, y el
          primer paso es siempre el mismo: **sustituir y simplificar
          $x^{2}+y^{2}$**. Lo que cambie a partir de ahí es consecuencia de
          eso.
    resolucion: |
      **Los tres.**

      | cambio | $x^{2}+y^{2}$ | $Z_u$ |
      |---|---|---|
      | (a) | $u^{2}$ | $\dfrac{2u}{1+u^{4}}$ |
      | (b) | $\dfrac{u^{2}}{\cos^{2}v}$ | $\dfrac{2u\sec^{2}v}{1+u^{4}\sec^{4}v}$ |
      | (c) | $\dfrac{u}{\operatorname{sen}^{2}v}$ | $\dfrac{\csc^{2}v}{1+u^{2}\csc^{4}v}$ |

      | cambio | $Z_{uv}$ |
      |---|---|
      | (a) | $0$ |
      | (b) | $\dfrac{4u\sec^{2}v\operatorname{tg}v\left(1-u^{4}\sec^{4}v\right)}{\left(1+u^{4}\sec^{4}v\right)^{2}}$ |
      | (c) | $\dfrac{-2\csc^{2}v\operatorname{cotg}v\left(1-u^{2}\csc^{4}v\right)}{\left(1+u^{2}\csc^{4}v\right)^{2}}$ |

      ### 1 · El primer paso, común a los tres

      $$
      \text{(a)}\;\; u^{2}\operatorname{sen}^{2}v+u^{2}\cos^{2}v = u^{2}
      $$

      $$
      \text{(b)}\;\; u^{2}\operatorname{tg}^{2}v+u^{2}
      = u^{2}\left(1+\operatorname{tg}^{2}v\right) = \frac{u^{2}}{\cos^{2}v}
      $$

      $$
      \text{(c)}\;\; u+u\operatorname{cotg}^{2}v
      = u\left(1+\operatorname{cotg}^{2}v\right)
      = \frac{u}{\operatorname{sen}^{2}v}
      $$

      Las dos identidades que aparecen —$1+\operatorname{tg}^{2}=\sec^{2}$ y
      $1+\operatorname{cotg}^{2}=\csc^{2}$— son las que hacen corto el
      ejercicio.

      ### 2 · El patrón de las derivadas

      Escribiendo $Z=\operatorname{arctg}(w)$ con $w$ la expresión de arriba:

      $$
      Z_u = \frac{w_u}{1+w^{2}},
      \qquad
      Z_{uv} = \frac{w_{uv}\left(1+w^{2}\right)-2w\,w_u\,w_v}
      {\left(1+w^{2}\right)^{2}}
      $$

      En (b) y (c), $w$ es un producto de una función de $u$ por una de $v$, y
      las cuentas salen solas.

      ### 3 · Lo que enseña el apartado (a)

      El cambio $x=u\operatorname{sen}v$, $y=u\cos v$ es el de las polares con
      los papeles del seno y el coseno cambiados. Y como
      $Z$ depende solo de $x^{2}+y^{2}=u^{2}$, **el ángulo desaparece**: la
      función es radial, y en coordenadas radiales eso se ve de un vistazo.

      **Lo que hay que llevarse.** Ante un cambio de variable con una función
      que depende de una combinación concreta —aquí $x^{2}+y^{2}$—, lo primero
      es sustituir esa combinación y simplificarla. Muchas veces el ejercicio
      se acaba ahí.

  - id: un-cambio-lineal-que-simplifica-una-edp
    titulo: Un cambio lineal que deja la EDP en dos términos
    fuente: >-
      Ejercicio 7 · Boletín «Funciones reales de varias variables reales.
      Problemas» · Cálculo, UPV/EHU. El boletín no publica resultado; el de
      aquí está comprobado numéricamente con una función arbitraria.
    nivel: practica
    enunciado: |
      Realizar el cambio de variable
      $\begin{cases} u = x+2y+2\\ v = x-y-1\end{cases}$
      en la ecuación

      $$
      2Z_{xx}+Z_{xy}-Z_{yy}+Z_x+Z_y = 0
      $$
    pide: La ecuación transformada en las variables u y v.
    pasos:
      - tipo: reconocer
        pregunta: |
          El cambio es lineal. ¿Qué tiene eso de bueno?
        opciones:
          - texto: >-
              Que $u_x$, $u_y$, $v_x$ y $v_y$ son **constantes**, así que al
              derivar dos veces no aparecen términos nuevos de primer orden
            correcta: true
            mensaje: |
              Eso es. Con un cambio no lineal, derivar $Z_x$ otra vez
              produciría términos con $u_{xx}$ y $v_{xx}$; aquí esos son cero y
              el cálculo es puro reparto de coeficientes.
          - texto: >-
              Que las constantes $+2$ y $-1$ desaparecen al derivar
            mensaje: |
              Desaparecen, sí, pero eso solo dice que una traslación no cambia
              las derivadas. Lo importante es que los coeficientes de $x$ e
              $y$ sean constantes.
          - texto: >-
              Que el jacobiano es $1$
            mensaje: |
              El jacobiano es $\begin{vmatrix}1&2\\1&-1\end{vmatrix}=-3$, no
              $1$. Lo que importa es que sea constante y no nulo.

      - tipo: calcular
        titulo: El coeficiente de la cruzada
        pregunta: |
          Sustituyendo, la ecuación queda
          $A\,Z_{uu}+B\,Z_{uv}+C\,Z_{vv}+D\,Z_u+E\,Z_v=0$. ¿Cuánto vale $B$?
        respuesta:
          tipo: numero
          valor: '9'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es el coeficiente de $Z_{xy}$ en la ecuación original. Al
              cambiar de variables, los tres términos de segundo orden
              contribuyen a la cruzada nueva.
          - valor: '0'
            mensaje: |
              $0$ es lo que valen $A$ y $C$: los términos $Z_{uu}$ y $Z_{vv}$
              **sí** se cancelan. La cruzada no.
        pista: |
          $Z_{xx}$ aporta $2$, $Z_{xy}$ aporta $1$ y $-Z_{yy}$ aporta $4$:
          $2\cdot2+1+4$.
        desarrollo: |
          Con $u_x=1$, $u_y=2$, $v_x=1$, $v_y=-1$:

          $$
          Z_{xx} = Z_{uu}+2Z_{uv}+Z_{vv}
          $$

          $$
          Z_{xy} = 2Z_{uu}+Z_{uv}-Z_{vv}
          $$

          $$
          Z_{yy} = 4Z_{uu}-4Z_{uv}+Z_{vv}
          $$

          Coeficiente de $Z_{uv}$:
          $2\cdot2 + 1 - (-4) = 4+1+4 = 9$.

      - tipo: calcular
        titulo: Y el de la primera derivada
        pregunta: |
          ¿Cuánto vale $D$, el coeficiente de $Z_u$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '0'
            mensaje: |
              $0$ es el coeficiente de $Z_v$: ahí sí se cancelan. En $Z_u$ los
              dos términos suman.
          - valor: '2'
            mensaje: |
              $Z_x$ aporta $1$ y $Z_y$ aporta $2$: la suma es $3$.
        pista: |
          $Z_x = Z_u+Z_v$ y $Z_y = 2Z_u-Z_v$.
        desarrollo: |
          $$
          Z_x + Z_y = \left(Z_u+Z_v\right) + \left(2Z_u-Z_v\right)
          = 3Z_u
          $$

          El $Z_v$ se cancela solo.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $Z_x = Z_u u_x + Z_v v_x = Z_u+Z_v$ y
              $Z_y = 2Z_u-Z_v$, porque las cuatro parciales del cambio son
              constantes.
          - texto: >-
              Derivando otra vez con el mismo operador salen las tres segundas
              en función de $Z_{uu}$, $Z_{uv}$ y $Z_{vv}$.
          - texto: >-
              Sumando con los coeficientes del enunciado, $Z_{uu}$ y $Z_{vv}$
              se cancelan y queda $9Z_{uv}+3Z_u=0$.
          - texto: >-
              Y que $Z_{uu}$ y $Z_{vv}$ desaparezcan es casualidad del
              ejercicio.
            trampa: true
            mensaje: |
              No es casualidad: $2r^{2}+rs-s^{2} = (2r-s)(r+s)$, y las dos
              direcciones del cambio —$u$ y $v$— están elegidas justo sobre
              esas dos raíces. Es la **forma canónica** de una EDP hiperbólica,
              y el cambio se construye para eso.
        veredicto: |
          El resultado, $3Z_{uv}+Z_u=0$, es lo que se llama la forma canónica
          de la ecuación. Y desde ahí se integra: llamando $W=Z_u$, queda
          $3W_v+W=0$, que es una EDO en $v$ con $u$ de parámetro.
    resolucion: |
      **Datos.** $u=x+2y+2$, $v=x-y-1$, en
      $2Z_{xx}+Z_{xy}-Z_{yy}+Z_x+Z_y=0$.

      ### 1 · Las cuatro parciales del cambio

      $$
      u_x = 1,\quad u_y = 2,\quad v_x = 1,\quad v_y = -1
      $$

      Constantes, porque el cambio es lineal. Las constantes $+2$ y $-1$ del
      enunciado no intervienen en ninguna derivada.

      ### 2 · Las primeras

      $$
      Z_x = Z_u + Z_v,
      \qquad
      Z_y = 2Z_u - Z_v
      $$

      ### 3 · Las segundas

      Aplicando otra vez el mismo operador:

      $$
      Z_{xx} = Z_{uu}+2Z_{uv}+Z_{vv}
      $$

      $$
      Z_{xy} = 2Z_{uu}+Z_{uv}-Z_{vv}
      $$

      $$
      Z_{yy} = 4Z_{uu}-4Z_{uv}+Z_{vv}
      $$

      ### 4 · El resultado

      | término | $Z_{uu}$ | $Z_{uv}$ | $Z_{vv}$ | $Z_u$ | $Z_v$ |
      |---|---|---|---|---|---|
      | $2Z_{xx}$ | $2$ | $4$ | $2$ | | |
      | $+Z_{xy}$ | $2$ | $1$ | $-1$ | | |
      | $-Z_{yy}$ | $-4$ | $4$ | $-1$ | | |
      | $+Z_x$ | | | | $1$ | $1$ |
      | $+Z_y$ | | | | $2$ | $-1$ |
      | **suma** | $0$ | $9$ | $0$ | $3$ | $0$ |

      $$
      \boxed{\ 9Z_{uv}+3Z_u = 0
      \quad\Longleftrightarrow\quad
      3Z_{uv}+Z_u = 0\ }
      $$

      ### 5 · Por qué se cancelan los dos

      La parte de segundo orden es $2Z_{xx}+Z_{xy}-Z_{yy}$, cuyo símbolo es

      $$
      2r^{2}+rs-s^{2} = \left(2r-s\right)\left(r+s\right)
      $$

      Las dos direcciones $u$ y $v$ del cambio son precisamente las dos raíces
      de ese producto, y por eso los términos puros desaparecen y queda solo
      la cruzada. Es la **forma canónica de una EDP hiperbólica**, y el cambio
      no se elige a ojo: se construye a partir de esa factorización.

      **Lo que hay que llevarse.** En un cambio lineal, las cuatro parciales
      son constantes y todo el trabajo es repartir coeficientes: una tabla como
      la de arriba lo hace sin errores. Y el resultado no es casual — que
      desaparezcan $Z_{uu}$ y $Z_{vv}$ es lo que el cambio buscaba.

  - id: un-cambio-dado-al-reves
    titulo: Un cambio dado al revés, y el jacobiano que hay que invertir
    fuente: >-
      Ejercicio 8 · Boletín «Funciones reales de varias variables reales.
      Problemas» · Cálculo, UPV/EHU. El boletín no publica resultado; el de
      aquí está comprobado numéricamente en tres puntos.
    nivel: practica
    enunciado: |
      Realizar el cambio de variable
      $\begin{cases} u\cdot v = y\\[2pt] \dfrac{u}{v} = x+y\end{cases}$
      en la ecuación $Z_{xx}+Z_y = 0$.
    pide: La ecuación transformada en las variables u y v.
    pasos:
      - tipo: reconocer
        pregunta: |
          El cambio viene escrito como dos condiciones, no como
          $u=\dots$, $v=\dots$. ¿Qué conviene hacer primero?
        opciones:
          - texto: >-
              Despejar $x$ e $y$ en función de $u$ y $v$: multiplicando y
              dividiendo las dos condiciones sale $y=uv$ y
              $x=\tfrac{u}{v}-uv$
            correcta: true
            mensaje: |
              Eso es. Y ese es el sentido cómodo: con $x$ e $y$ en función de
              $u$ y $v$, las cuatro parciales del jacobiano se calculan
              derivando, y las del cambio inverso salen invirtiendo la matriz.
          - texto: >-
              Despejar $u$ y $v$ en función de $x$ e $y$
            mensaje: |
              También se puede —$u=\sqrt{y(x+y)}$, $v=\sqrt{y/(x+y)}$— pero
              esas raíces son mucho peores de derivar que las expresiones
              polinómicas del otro sentido.
          - texto: >-
              Nada: se derivan las condiciones implícitamente
            mensaje: |
              Se puede, pero es el camino más largo de los tres. Despejar
              primero deja el jacobiano a la vista.

      - tipo: calcular
        titulo: El jacobiano
        pregunta: |
          Con $x=\tfrac{u}{v}-uv$ e $y=uv$, el jacobiano
          $\dfrac{\partial(x,y)}{\partial(u,v)}$ vale $\dfrac{2u}{v}$.
          ¿Cuánto vale en $u=1{,}4$, $v=0{,}7$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '0.25'
            mensaje: |
              $\tfrac{v}{2u}$ es el jacobiano **inverso**, el del cambio de
              $(x,y)$ a $(u,v)$. Los dos son inversos uno del otro.
          - valor: '2'
            mensaje: |
              $2u$ sin dividir entre $v$. El determinante sale
              $\tfrac{u}{v}-uv+\tfrac{u}{v}+uv = \tfrac{2u}{v}$.
        pista: |
          $x_u = \tfrac1v-v$, $x_v = -\tfrac{u}{v^{2}}-u$, $y_u = v$,
          $y_v = u$.
        desarrollo: |
          $$
          \frac{\partial(x,y)}{\partial(u,v)}
          = \begin{vmatrix}
          \tfrac1v-v & -\tfrac{u}{v^{2}}-u\\[4pt]
          v & u
          \end{vmatrix}
          = \left(\frac1v-v\right)u + \left(\frac{u}{v^{2}}+u\right)v
          = \frac{2u}{v}
          $$

          Con $u=1{,}4$ y $v=0{,}7$: $\tfrac{2{,}8}{0{,}7}=4$.

      - tipo: calcular
        titulo: El coeficiente de la cruzada
        pregunta: |
          Al sustituir, la ecuación queda —multiplicada por
          $\tfrac{4u^{2}}{v^{2}}$—
          $u^{2}Z_{uu}+B\,Z_{uv}+v^{2}Z_{vv}+\dots=0$. ¿Cuánto vale $B$ con
          $u=1{,}4$ y $v=0{,}7$?
        respuesta:
          tipo: numero
          valor: '-1.96'
          tolerancia: 0.01
          formato: en forma exacta (-2uv) o con dos decimales
        distractores:
          - valor: '1.96'
            mensaje: |
              El signo. $B=-2uv$, negativo: viene del producto cruzado de
              $u_x$ y $v_x$, que tienen signos opuestos.
          - valor: '0.98'
            mensaje: |
              $uv$ sin el $2$. Al elevar al cuadrado el operador aparece el
              doble producto.
        pista: |
          $B = -2uv$, y $2\cdot1{,}4\cdot0{,}7 = 1{,}96$.
        desarrollo: |
          $$
          B = -2uv = -2\cdot1{,}4\cdot0{,}7 = -1{,}96
          $$

          El bloque de segundo orden es
          $u^{2}Z_{uu}-2uvZ_{uv}+v^{2}Z_{vv}$, que es el cuadrado del operador
          $u\partial_u - v\partial_v$ menos sus términos de primer orden.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Multiplicando y dividiendo las dos condiciones: $u^{2}=y(x+y)$ y
              $v^{2}=\tfrac{y}{x+y}$, de donde $y=uv$ y
              $x=\tfrac{u}{v}-uv$.
          - texto: >-
              Con esas expresiones se calcula el jacobiano
              $\tfrac{\partial(x,y)}{\partial(u,v)}=\tfrac{2u}{v}$, y las
              parciales de $u$ y $v$ respecto de $x$ e $y$ salen invirtiendo
              la matriz.
          - texto: >-
              Al calcular $Z_{xx}$ hay que derivar **también los
              coeficientes**, porque dependen de $u$ y $v$, que a su vez
              dependen de $x$.
          - texto: >-
              Y como el cambio no es lineal, el resultado no se puede
              comprobar.
            trampa: true
            mensaje: |
              Se comprueba igual que cualquier otro: se elige una función
              arbitraria $W(u,v)$, se define $Z(x,y)=W(u(x,y),v(x,y))$, y se
              calculan los dos lados numéricamente. Que el cambio no sea lineal
              no cambia nada de eso — y aquí es justo lo que se ha hecho,
              porque el boletín no publica resultado.
        veredicto: |
          El resultado de este ejercicio **no** se simplifica, y eso también
          enseña: no todo cambio de variable mejora la ecuación. Lo que se
          practica aquí es el procedimiento, que es el mismo salga bonito o no.
    resolucion: |
      **Datos.** $uv=y$, $\tfrac{u}{v}=x+y$, en $Z_{xx}+Z_y=0$.

      ### 1 · Despejar el cambio

      Multiplicando las dos condiciones: $u^{2}=y(x+y)$. Dividiéndolas:
      $v^{2}=\tfrac{y}{x+y}$. Y al revés, que es lo que conviene:

      $$
      y = uv, \qquad x = \frac{u}{v}-uv
      $$

      ### 2 · El jacobiano, y su inverso

      $$
      \frac{\partial(x,y)}{\partial(u,v)}
      = \begin{vmatrix}
      \tfrac1v-v & -\tfrac{u}{v^{2}}-u\\[4pt]
      v & u\end{vmatrix} = \frac{2u}{v}
      $$

      Invirtiendo la matriz:

      $$
      u_x = \frac{v}{2},
      \qquad
      u_y = \frac{1}{2v}+\frac{v}{2},
      \qquad
      v_x = -\frac{v^{2}}{2u},
      \qquad
      v_y = \frac{1-v^{2}}{2u}
      $$

      ### 3 · Las derivadas

      $$
      Z_x = \frac{v}{2}Z_u - \frac{v^{2}}{2u}Z_v
      $$

      $$
      Z_y = \left(\frac{1}{2v}+\frac{v}{2}\right)Z_u
      + \frac{1-v^{2}}{2u}Z_v
      $$

      Para $Z_{xx}$ hay que aplicar el operador
      $\tfrac{v}{2}\partial_u - \tfrac{v^{2}}{2u}\partial_v$ a $Z_x$,
      **derivando también los coeficientes**:

      $$
      Z_{xx} = \frac{v^{2}}{4}Z_{uu}
      - \frac{v^{3}}{2u}Z_{uv}
      + \frac{v^{4}}{4u^{2}}Z_{vv}
      - \frac{v^{2}}{4u}Z_u
      + \frac{3v^{3}}{4u^{2}}Z_v
      $$

      ### 4 · La ecuación transformada

      Sumando $Z_{xx}+Z_y$ y multiplicando por $\tfrac{4u^{2}}{v^{2}}$:

      $$
      \boxed{\;
      u^{2}Z_{uu} - 2uv\,Z_{uv} + v^{2}Z_{vv}
      + \frac{u}{v^{3}}\left[2u\left(1+v^{2}\right)-v^{3}\right]Z_u
      + \frac{1}{v^{2}}\left[3v^{3}+2u\left(1-v^{2}\right)\right]Z_v = 0 \;}
      $$

      ### 5 · Qué se ha ganado y qué no

      | | antes | después |
      |---|---|---|
      | orden | 2 | 2 |
      | coeficientes | constantes | variables |
      | términos | 2 | 5 |

      **No se ha ganado nada**, y eso es un resultado: hay cambios de variable
      que empeoran la ecuación. El bloque de segundo orden,
      $u^{2}Z_{uu}-2uvZ_{uv}+v^{2}Z_{vv}$, sí tiene forma reconocible —es el
      cuadrado del operador $u\partial_u-v\partial_v$, salvo términos de primer
      orden—, pero los coeficientes de $Z_u$ y $Z_v$ no se simplifican.

      ### 6 · Cómo se ha comprobado

      El boletín no publica resultado. Se ha tomado una función arbitraria
      $W(u,v)$, se ha definido $Z(x,y)=W\left(\sqrt{y(x+y)},
      \sqrt{y/(x+y)}\right)$, y se han calculado numéricamente los dos lados
      en tres puntos distintos. Coinciden con nueve cifras.

      **Lo que hay que llevarse.** Cuando el cambio viene dado como dos
      condiciones, lo primero es **despejar en el sentido que deje las
      expresiones más simples** — aquí, $x$ e $y$ en función de $u$ y $v$. Y
      con un cambio no lineal, al derivar dos veces hay que derivar también los
      coeficientes: ahí es donde aparecen los términos de primer orden que no
      estaban.

  - id: cuatro-edps-en-polares
    titulo: Cuatro ecuaciones pasadas a polares, con la misma plantilla
    fuente: >-
      Ejercicio 9 · Boletín «Funciones reales de varias variables reales.
      Problemas» · Cálculo, UPV/EHU. El boletín no publica resultados; las
      fórmulas de aquí están comprobadas numéricamente.
    nivel: practica
    enunciado: |
      Realizar el cambio a coordenadas polares:

      (a) $Z_{xy} = 0$
      &nbsp;&nbsp;&nbsp;
      (b) $3Z_{xx}+4Z_y = 0$

      (c) $Z_x+Z_{xx}-Z_{yx} = 1$
      &nbsp;&nbsp;&nbsp;
      (d) $Z_{xy}-Z_x = 0$
    pide: Las cuatro ecuaciones escritas en r y θ.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué $Z_{xx}$ en polares tiene **cinco** términos y no tres?
        opciones:
          - texto: >-
              Porque al aplicar el operador
              $\cos\theta\,\partial_r-\tfrac{\operatorname{sen}\theta}{r}
              \partial_\theta$ dos veces hay que derivar también sus
              coeficientes, que dependen de $r$ y $\theta$
            correcta: true
            mensaje: |
              Eso es. Los tres términos de segundo orden salen del producto
              directo; los dos de primer orden salen de derivar el
              $\cos\theta$ y el $\tfrac{\operatorname{sen}\theta}{r}$.
          - texto: >-
              Porque el cambio no es inyectivo en el origen
            mensaje: |
              El origen es una singularidad del sistema de coordenadas, sí,
              pero eso no añade términos. Los añade la regla del producto.
          - texto: >-
              Porque hay dos variables
            mensaje: |
              En un cambio **lineal** con dos variables, $Z_{xx}$ tiene solo
              tres términos. Lo que añade los otros dos es que los
              coeficientes no sean constantes.

      - tipo: calcular
        titulo: El coeficiente de Z_rr en el apartado (b)
        pregunta: |
          Al pasar $3Z_{xx}+4Z_y=0$ a polares, el coeficiente de $Z_{rr}$ es
          $3\cos^{2}\theta$. ¿Cuánto vale en $\theta=\tfrac{\pi}{3}$?
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.005
          formato: en forma exacta (3/4) o con dos decimales
        distractores:
          - valor: '1.5'
            mensaje: |
              $3\cos\tfrac{\pi}{3}=1{,}5$: falta elevar al cuadrado. El
              coeficiente es $\cos^{2}\theta$, porque $Z_{xx}$ aplica el
              operador dos veces.
          - valor: '2.25'
            mensaje: |
              $\left(3\cos\tfrac{\pi}{3}\right)^{2}$ eleva también el $3$. El
              $3$ es el coeficiente de la ecuación y no se eleva.
        pista: |
          $\cos\tfrac{\pi}{3}=\tfrac12$.
        desarrollo: |
          $$
          3\cos^{2}\frac{\pi}{3} = 3\cdot\frac14 = \frac34 = 0{,}75
          $$

      - tipo: calcular
        titulo: El apartado (a), simplificado
        pregunta: |
          Multiplicando el apartado (a) por $2r^{2}$, el coeficiente de
          $Z_{r\theta}$ queda $2r\cos2\theta$. ¿Cuánto vale en $r=1$ y
          $\theta=\tfrac{\pi}{6}$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.008
          formato: un número entero
        distractores:
          - valor: '1.7321'
            mensaje: |
              $\sqrt3$ es $2\cos\tfrac{\pi}{6}$, no $2\cos\tfrac{2\pi}{6}$. El
              argumento es $2\theta$.
          - valor: '2'
            mensaje: |
              $\cos\tfrac{\pi}{3}=\tfrac12$, no $1$.
        pista: |
          $2\theta = \tfrac{\pi}{3}$, y $\cos\tfrac{\pi}{3}=\tfrac12$.
        desarrollo: |
          $$
          2\cdot1\cdot\cos\frac{\pi}{3} = 2\cdot\frac12 = 1
          $$

          El $\cos2\theta$ sale de $\cos^{2}\theta-\operatorname{sen}^{2}\theta$
          en la fórmula de $Z_{xy}$, y el $\operatorname{sen}2\theta$ de
          $2\operatorname{sen}\theta\cos\theta$: reescribir con el ángulo doble
          deja la expresión mucho más corta.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Los dos operadores de primer orden son
              $\partial_x = \cos\theta\,\partial_r
              - \tfrac{\operatorname{sen}\theta}{r}\partial_\theta$ y
              $\partial_y = \operatorname{sen}\theta\,\partial_r
              + \tfrac{\cos\theta}{r}\partial_\theta$.
          - texto: >-
              Aplicándolos dos veces salen $Z_{xx}$ y $Z_{xy}$, cada una con
              tres términos de segundo orden y dos de primero.
          - texto: >-
              Una vez escritas esas dos plantillas, los cuatro apartados son
              sustituir y agrupar.
          - texto: >-
              Y como el cambio a polares es el mismo en los cuatro, las cuatro
              ecuaciones transformadas tienen los mismos coeficientes.
            trampa: true
            mensaje: |
              El cambio es el mismo, pero cada ecuación combina las plantillas
              con pesos distintos: en (b) solo interviene $Z_{xx}$ y $Z_y$; en
              (a), solo $Z_{xy}$. Lo que se reutiliza son las **plantillas**,
              no el resultado.
        veredicto: |
          Este ejercicio es una sola cosa repetida cuatro veces: escribir
          $Z_x$, $Z_y$, $Z_{xx}$ y $Z_{xy}$ en polares **una vez**, y después
          sustituir. Hacer las plantillas con cuidado y guardarlas es la mitad
          del trabajo de todo el tema.
    resolucion: |
      ### 1 · Las cuatro plantillas

      Con $c=\cos\theta$ y $s=\operatorname{sen}\theta$:

      $$
      Z_x = c\,Z_r - \frac{s}{r}Z_\theta
      $$

      $$
      Z_y = s\,Z_r + \frac{c}{r}Z_\theta
      $$

      $$
      Z_{xx} = c^{2}Z_{rr} - \frac{2sc}{r}Z_{r\theta}
      + \frac{s^{2}}{r^{2}}Z_{\theta\theta}
      + \frac{s^{2}}{r}Z_r + \frac{2sc}{r^{2}}Z_\theta
      $$

      $$
      Z_{xy} = sc\,Z_{rr} + \frac{c^{2}-s^{2}}{r}Z_{r\theta}
      - \frac{sc}{r^{2}}Z_{\theta\theta}
      - \frac{sc}{r}Z_r - \frac{c^{2}-s^{2}}{r^{2}}Z_\theta
      $$

      Con el ángulo doble, $2sc=\operatorname{sen}2\theta$ y
      $c^{2}-s^{2}=\cos2\theta$.

      ### 2 · Los cuatro apartados

      **(a)** $Z_{xy}=0$, multiplicado por $2r^{2}$:

      $$
      r^{2}\operatorname{sen}2\theta\,Z_{rr}
      + 2r\cos2\theta\,Z_{r\theta}
      - \operatorname{sen}2\theta\,Z_{\theta\theta}
      - r\operatorname{sen}2\theta\,Z_r
      - 2\cos2\theta\,Z_\theta = 0
      $$

      **(b)** $3Z_{xx}+4Z_y=0$, multiplicado por $r^{2}$:

      $$
      3r^{2}c^{2}Z_{rr} - 3r\operatorname{sen}2\theta\,Z_{r\theta}
      + 3s^{2}Z_{\theta\theta}
      + \left(3rs^{2}+4r^{2}s\right)Z_r
      + \left(3\operatorname{sen}2\theta+4rc\right)Z_\theta = 0
      $$

      **(c)** $Z_x+Z_{xx}-Z_{xy}=1$ (con $Z_{yx}=Z_{xy}$):

      $$
      c(c-s)Z_{rr}
      - \frac{\operatorname{sen}2\theta+\cos2\theta}{r}Z_{r\theta}
      + \frac{s(s+c)}{r^{2}}Z_{\theta\theta}
      $$

      $$
      + \left[c+\frac{s(s+c)}{r}\right]Z_r
      + \left[-\frac{s}{r}
      + \frac{\operatorname{sen}2\theta+\cos2\theta}{r^{2}}\right]Z_\theta = 1
      $$

      **(d)** $Z_{xy}-Z_x=0$:

      $$
      sc\,Z_{rr} + \frac{\cos2\theta}{r}Z_{r\theta}
      - \frac{sc}{r^{2}}Z_{\theta\theta}
      - \left(\frac{sc}{r}+c\right)Z_r
      + \left(\frac{s}{r}-\frac{\cos2\theta}{r^{2}}\right)Z_\theta = 0
      $$

      ### 3 · De dónde salen los cinco términos de Z_xx

      $$
      Z_{xx} = \left(c\,\partial_r - \frac{s}{r}\partial_\theta\right)
      \left(c\,Z_r - \frac{s}{r}Z_\theta\right)
      $$

      Los tres términos de segundo orden salen de aplicar cada derivada a cada
      derivada. Los dos de primer orden salen de derivar los **coeficientes**:
      $\partial_\theta c = -s$ y $\partial_r\left(\tfrac{s}{r}\right)
      = -\tfrac{s}{r^{2}}$. Olvidarlos es el error universal de este ejercicio.

      ### 4 · Cómo se han comprobado

      El boletín no publica resultados. Se ha tomado una función arbitraria
      $W(r,\theta)$, se ha definido
      $Z(x,y)=W\left(\sqrt{x^{2}+y^{2}},\arctan\tfrac{y}{x}\right)$, y se han
      comparado numéricamente $Z_x$, $Z_y$, $Z_{xx}$ y $Z_{xy}$ con las cuatro
      plantillas. Coinciden con ocho cifras.

      **Lo que hay que llevarse.** Las cuatro plantillas se escriben **una
      vez** y sirven para todo el tema —y para el tema 7, donde las polares
      vuelven—. Y el aviso: al aplicar el operador dos veces hay que derivar
      también sus coeficientes, que es de donde salen los términos de primer
      orden que nadie espera.

  - id: la-edp-que-se-vuelve-simetrica
    titulo: Una EDP que se vuelve simétrica al cambiar de variables
    fuente: >-
      Ejercicio 10 · Boletín «Funciones reales de varias variables reales.
      Problemas» · Cálculo, UPV/EHU. El boletín no publica resultado; el de
      aquí está comprobado numéricamente.
    nivel: practica
    enunciado: |
      En la ecuación
      $\cos y\,\dfrac{\partial z}{\partial x} + x\,\dfrac{\partial z}{\partial y} = 0$
      hacer el cambio de variable
      $\begin{cases} x = \operatorname{sen}u+\cos v\\ y = u+v\end{cases}$
    pide: La ecuación transformada en las variables u y v.
    pasos:
      - tipo: reconocer
        pregunta: |
          El cambio da $x$ e $y$ en función de $u$ y $v$, pero la ecuación
          lleva $z_x$ y $z_y$. ¿Cómo se relacionan?
        opciones:
          - texto: >-
              Por la cadena al revés: $z_u = z_x x_u + z_y y_u$ y
              $z_v = z_x x_v + z_y y_v$, y de ahí se despejan $z_x$ y $z_y$
            correcta: true
            mensaje: |
              Eso es. Se escriben las dos ecuaciones y se resuelve el sistema
              lineal en $z_x$ y $z_y$: dos ecuaciones, dos incógnitas.
          - texto: >-
              $z_x = \tfrac{z_u}{x_u}$
            mensaje: |
              Eso solo valdría si $z$ dependiera de $u$ y $u$ de $x$ y nada
              más. Aquí $z_u$ mezcla las dos parciales, y hay que despejarlas
              del sistema.
          - texto: >-
              Hay que invertir el cambio y escribir $u$ y $v$ en función de
              $x$ e $y$
            mensaje: |
              No hace falta, y además ese sistema no se despeja en forma
              cerrada. El sistema lineal en $z_x$ y $z_y$ evita invertir nada.

      - tipo: calcular
        titulo: El coeficiente de z_u
        pregunta: |
          La ecuación transformada es
          $\cos v\,z_u + \operatorname{sen}u\,z_v = 0$. ¿Cuánto vale el
          coeficiente de $z_u$ en $v=\tfrac{\pi}{3}$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.004
          formato: en forma exacta (1/2) o con un decimal
        distractores:
          - valor: '0.866'
            mensaje: |
              $\operatorname{sen}\tfrac{\pi}{3}$ es el coeficiente **del otro**
              término, y además evaluado en $u$, no en $v$.
          - valor: '1'
            mensaje: |
              $\cos\tfrac{\pi}{3}=\tfrac12$. Vale $1$ en $v=0$.
        pista: |
          $\cos\tfrac{\pi}{3}=\tfrac12$.
        desarrollo: |
          $$
          \cos\frac{\pi}{3} = \frac12
          $$

          Y fíjate en la simetría del resultado: el coeficiente de $z_u$
          depende de $v$, y el de $z_v$ depende de $u$. Las dos variables han
          intercambiado los papeles.

      - tipo: calcular
        titulo: El denominador común que aparece
        pregunta: |
          Al despejar, tanto $z_x$ como $z_y$ salen con el mismo denominador.
          ¿Cuánto vale ese denominador en $u=0$, $v=0$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.008
          formato: un número entero
        distractores:
          - valor: '0'
            mensaje: |
              El denominador es $\cos u+\operatorname{sen}v$, que en $(0,0)$
              vale $1+0=1$. Se anula en otros puntos, y ahí el cambio deja de
              ser válido.
          - valor: '2'
            mensaje: |
              $\cos0+\operatorname{sen}0 = 1+0 = 1$, no $2$.
        pista: |
          El denominador es el jacobiano $x_u y_v - x_v y_u
          = \cos u + \operatorname{sen}v$.
        desarrollo: |
          $$
          \frac{\partial(x,y)}{\partial(u,v)}
          = \begin{vmatrix}\cos u & -\operatorname{sen}v\\ 1 & 1\end{vmatrix}
          = \cos u + \operatorname{sen}v
          $$

          En $(0,0)$ vale $1$. Y ese mismo factor es el que se cancela al
          final, que es lo que deja la ecuación tan limpia.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $z_u = z_x\cos u + z_y$ y $z_v = -z_x\operatorname{sen}v+z_y$,
              porque $x_u=\cos u$, $x_v=-\operatorname{sen}v$ y
              $y_u=y_v=1$.
          - texto: >-
              Restando, $z_u-z_v = z_x\left(\cos u+\operatorname{sen}v\right)$,
              de donde $z_x$ sale despejada.
          - texto: >-
              Sustituyendo en la ecuación y multiplicando por
              $\cos u+\operatorname{sen}v$, los términos se agrupan y ese factor
              vuelve a salir común.
          - texto: >-
              Y por eso la ecuación transformada tiene los mismos coeficientes
              que la original, $\cos y$ y $x$.
            trampa: true
            mensaje: |
              No son los mismos: pasan de $\cos y$ y $x$ a $\cos v$ y
              $\operatorname{sen}u$. Lo llamativo es que **la forma** se
              conserve —un coeficiente trigonométrico de una variable
              multiplicando a la derivada de la otra— pero los coeficientes son
              distintos.
        veredicto: |
          El cambio deja la ecuación con la forma
          $f(v)z_u+g(u)z_v=0$, que es **separable**: se puede atacar buscando
          soluciones del tipo $z=\varphi(u)\psi(v)$. Ese es el premio, y es lo
          que justifica el cambio.
    resolucion: |
      **Datos.** $\cos y\,z_x + x\,z_y = 0$, con
      $x=\operatorname{sen}u+\cos v$, $y=u+v$.

      ### 1 · La cadena, y el sistema que deja

      $$
      z_u = z_x\,x_u + z_y\,y_u = z_x\cos u + z_y
      $$

      $$
      z_v = z_x\,x_v + z_y\,y_v = -z_x\operatorname{sen}v + z_y
      $$

      Dos ecuaciones lineales en $z_x$ y $z_y$. Restando:

      $$
      z_u - z_v = z_x\left(\cos u+\operatorname{sen}v\right)
      \;\Longrightarrow\;
      z_x = \frac{z_u-z_v}{\cos u+\operatorname{sen}v}
      $$

      $$
      z_y = \frac{z_u\operatorname{sen}v + z_v\cos u}
      {\cos u+\operatorname{sen}v}
      $$

      El denominador es el jacobiano del cambio.

      ### 2 · Sustituir y agrupar

      Con $y=u+v$ y $x=\operatorname{sen}u+\cos v$, y multiplicando por el
      denominador:

      $$
      \cos(u+v)\left(z_u-z_v\right)
      + \left(\operatorname{sen}u+\cos v\right)
      \left(z_u\operatorname{sen}v+z_v\cos u\right) = 0
      $$

      Desarrollando $\cos(u+v)=\cos u\cos v-\operatorname{sen}u\operatorname{sen}v$
      y agrupando:

      | coeficiente de | qué queda |
      |---|---|
      | $z_u$ | $\cos u\cos v+\cos v\operatorname{sen}v = \cos v\left(\cos u+\operatorname{sen}v\right)$ |
      | $z_v$ | $\operatorname{sen}u\operatorname{sen}v+\operatorname{sen}u\cos u = \operatorname{sen}u\left(\operatorname{sen}v+\cos u\right)$ |

      El factor $\cos u+\operatorname{sen}v$ es común y se cancela:

      $$
      \boxed{\ \cos v\,z_u + \operatorname{sen}u\,z_v = 0\ }
      $$

      ### 3 · Por qué es un buen cambio

      | | antes | después |
      |---|---|---|
      | ecuación | $\cos y\,z_x+x\,z_y=0$ | $\cos v\,z_u+\operatorname{sen}u\,z_v=0$ |
      | coeficiente de la primera | mezcla $y$ | solo $v$ |
      | coeficiente de la segunda | mezcla $x$ | solo $u$ |

      Cada coeficiente depende de **una sola** variable, y además de la
      contraria a la que deriva. Eso la vuelve separable:

      $$
      \frac{z_u}{\operatorname{sen}u} = -\frac{z_v}{\cos v}
      $$

      ### 4 · Cómo se ha comprobado

      El boletín no publica resultado. Tomando una $W(u,v)$ arbitraria y
      calculando los dos lados con derivación numérica, coinciden **exactamente**
      —el error sale $0$ en aritmética de doble precisión, porque la identidad
      es algebraica.

      **Lo que hay que llevarse.** Cuando el cambio da $x$ e $y$ en función de
      $u$ y $v$, las parciales viejas se despejan de un **sistema lineal de dos
      ecuaciones**, y el jacobiano aparece como denominador común. Que después
      ese denominador se cancele es la señal de que el cambio era el bueno.

  # ═══════════════════════════════════════════════════════════════════
  # Problemas complementarios del tema 6. Los que ya estaban —6.4, 6.9,
  # 6.10, 6.12, 6.13, 6.14 y 6.17— no se repiten aquí.
  # ═══════════════════════════════════════════════════════════════════

  - id: seis-dominios-de-definicion
    titulo: Seis dominios, y los dos que se parecen y no lo son
    fuente: Ejercicio 6.1 · Problemas complementarios, tema 6 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular y dibujar los dominios de definición de las funciones
      siguientes:

      (a) $f(x,y)=\sqrt{x+y}$
      &nbsp;&nbsp;&nbsp;
      (c) $f(x,y)=\sqrt{xy}$
      &nbsp;&nbsp;&nbsp;
      (e) $f(x,y,z)=\dfrac{1}{\sqrt{16-x^{2}-y^{2}-z^{2}}}$

      (b) $f(x,y)=\sqrt{x}+\sqrt{y}$
      &nbsp;&nbsp;&nbsp;
      (d) $f(x,y)=\ln\left(9-x^{2}-9y^{2}\right)$
      &nbsp;&nbsp;&nbsp;
      (f) $f(x,y)=\sqrt{36-9x^{2}-9y^{2}}$
    pide: El dominio de definición de cada función, y su dibujo.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los apartados (a) y (b) parecen lo mismo. ¿Lo son?
        opciones:
          - texto: >-
              No: $\sqrt{x+y}$ pide que la **suma** sea positiva, y
              $\sqrt{x}+\sqrt{y}$ pide que **las dos** lo sean. El segundo
              dominio es mucho más pequeño
            correcta: true
            mensaje: |
              Eso es. El de (a) es medio plano —todo lo que queda por encima de
              la recta $y=-x$—; el de (b) es solo el primer cuadrante. El
              punto $(4,-1)$ está en el primero y no en el segundo.
          - texto: >-
              Sí: $\sqrt{x+y}=\sqrt{x}+\sqrt{y}$
            mensaje: |
              Esa igualdad es falsa: con $x=y=1$, la izquierda vale $\sqrt2$ y
              la derecha $2$. Y sus dominios tampoco coinciden.
          - texto: >-
              No, porque (b) no está definida en el origen
            mensaje: |
              Sí lo está: $\sqrt0+\sqrt0 = 0$. Lo que las separa es qué pasa
              con los puntos donde una coordenada es negativa y la otra
              compensa.

      - tipo: calcular
        titulo: El radio del disco de (f)
        pregunta: |
          El dominio de $\sqrt{36-9x^{2}-9y^{2}}$ es un disco cerrado
          centrado en el origen. ¿Qué radio tiene?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '6'
            mensaje: |
              $6$ sería el radio si la condición fuese
              $36-x^{2}-y^{2}\ge0$. Los coeficientes $9$ dividen: queda
              $x^{2}+y^{2}\le4$.
          - valor: '4'
            mensaje: |
              $4$ es $\tfrac{36}{9}$, que es el radio **al cuadrado**. Falta la
              raíz.
        pista: |
          $36-9x^{2}-9y^{2}\ge0 \iff x^{2}+y^{2}\le\tfrac{36}{9}$.
        desarrollo: |
          $$
          36-9\left(x^{2}+y^{2}\right)\ge0
          \;\Longleftrightarrow\;
          x^{2}+y^{2}\le 4
          $$

          Disco cerrado de radio $2$. **Cerrado**, porque la raíz admite el
          cero — a diferencia de (d) y (e), donde el logaritmo y el
          denominador exigen desigualdad estricta.

      - tipo: calcular
        titulo: El semieje mayor de (d)
        pregunta: |
          El dominio de $\ln\left(9-x^{2}-9y^{2}\right)$ es el interior de una
          elipse. ¿Cuánto vale su semieje mayor?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es el semieje **menor**, el del eje $y$. Dividiendo entre $9$
              queda $\tfrac{x^{2}}{9}+y^{2}<1$.
          - valor: '9'
            mensaje: |
              $9$ es el semieje al cuadrado. La ecuación normalizada tiene
              $\tfrac{x^{2}}{9}$, así que $a^{2}=9$.
        pista: |
          $9-x^{2}-9y^{2}>0 \iff \tfrac{x^{2}}{9}+y^{2}<1$.
        desarrollo: |
          $$
          \frac{x^{2}}{9}+y^{2} < 1
          $$

          Elipse de semiejes $3$ y $1$, **sin el borde**: el logaritmo exige
          que el argumento sea estrictamente positivo.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Una raíz par pide argumento $\ge0$; un logaritmo, $>0$; un
              denominador, $\ne0$.
          - texto: >-
              En (e) se juntan dos: hay raíz **y** denominador, así que el
              argumento tiene que ser estrictamente positivo y el dominio es la
              bola **abierta** de radio $4$.
          - texto: >-
              En (c), $xy\ge0$ describe el primer y el tercer cuadrante, ejes
              incluidos.
          - texto: >-
              Y en (a) y (b), como las dos funciones son sumas de raíces, los
              dos dominios son el primer cuadrante.
            trampa: true
            mensaje: |
              (a) **no** es una suma de raíces: es la raíz de una suma. Su
              dominio es el semiplano $x+y\ge0$, que incluye puntos como
              $(4,-1)$ donde $y$ es negativa. Solo (b) se queda en el primer
              cuadrante.
        veredicto: |
          El dominio lo dictan las operaciones prohibidas, y hay tres:
          raíz par de negativo, logaritmo de no positivo, y división por cero.
          Lo demás es dibujar la región que queda.
      - tipo: dibujar
        consigna: |
          Dibuja los seis dominios, cada uno en unos ejes pequeños y
          etiquetados. Los apartados (e) y (f) necesitan tres ejes uno y dos el
          otro.
        comprueba:
          - punto: |
              En (a), el semiplano cerrado por encima de $y=-x$; en (b), el
              primer cuadrante cerrado.
            porque: |
              Son los dos que hay que dibujar **juntos** para ver la diferencia:
              el punto $\left(4,-1\right)$ está en el primero y no en el segundo.
              La raíz de una suma no es la suma de dos raíces.
          - punto: |
              En (c), el primer y el tercer cuadrante, ejes incluidos.
            porque: |
              $xy\ge0$ se cumple cuando los dos factores tienen el mismo signo, y
              también cuando alguno es cero. Olvidar los ejes es el error de leer
              $>$ donde pone $\ge$.
          - punto: |
              En (d), el interior **abierto** de la elipse
              $\tfrac{x^{2}}{9}+y^{2}<1$, de semiejes $3$ y $1$.
            porque: |
              El logaritmo exige argumento estrictamente positivo, así que el
              borde se dibuja a trazos. Y la elipse está muy achatada: tres veces
              más ancha que alta.
          - punto: |
              En (e), una bola **abierta** de radio $4$; en (f), un disco
              **cerrado** de radio $2$.
            porque: |
              En (e) la raíz está en el denominador y el cero queda prohibido; en
              (f) no, y el borde entra. Es la misma operación con distinta
              consecuencia, y el trazo lo tiene que decir.
        veredicto: |
          Cuatro dominios cerrados y dos abiertos, y la diferencia la marca dónde
          está la raíz: si está sola, el cero vale; si está en un denominador o
          dentro de un logaritmo, no. Eso se dibuja con trazo continuo o
          discontinuo, y forma parte de la respuesta.

    resolucion: |
      **Los seis dominios.**

      | función | condición | qué es |
      |---|---|---|
      | (a) $\sqrt{x+y}$ | $x+y\ge0$ | semiplano cerrado sobre $y=-x$ |
      | (b) $\sqrt x+\sqrt y$ | $x\ge0 \wedge y\ge0$ | primer cuadrante cerrado |
      | (c) $\sqrt{xy}$ | $xy\ge0$ | primer y tercer cuadrante |
      | (d) $\ln(9-x^{2}-9y^{2})$ | $\tfrac{x^{2}}{9}+y^{2}<1$ | interior de una elipse |
      | (e) $\left(16-x^{2}-y^{2}-z^{2}\right)^{-1/2}$ | $x^{2}+y^{2}+z^{2}<16$ | bola abierta de radio $4$ |
      | (f) $\sqrt{36-9x^{2}-9y^{2}}$ | $x^{2}+y^{2}\le4$ | disco cerrado de radio $2$ |

      ### 1 · Las tres prohibiciones

      | operación | condición |
      |---|---|
      | $\sqrt{\phantom{x}}$ (índice par) | argumento $\ge0$ |
      | $\ln$ | argumento $>0$ |
      | denominador | $\ne0$ |

      Y cuando se juntan dos, manda la más restrictiva: en (e), la raíz pediría
      $\ge0$ y el denominador $\ne0$, así que queda $>0$ — y la bola es
      **abierta**.

      ### 2 · El par que hay que distinguir

      $$
      \text{(a)}\;\; x+y\ge0
      \qquad\text{frente a}\qquad
      \text{(b)}\;\; x\ge0 \;\wedge\; y\ge0
      $$

      El punto $(4,-1)$ cumple la primera y no la segunda. **La raíz de una
      suma y la suma de dos raíces no tienen el mismo dominio**, y confundirlas
      es el error del ejercicio.

      ### 3 · Cerrado o abierto

      | apartado | borde |
      |---|---|
      | (a), (b), (c), (f) | incluido: la raíz admite el $0$ |
      | (d), (e) | excluido: logaritmo y denominador no |

      Decirlo forma parte de la respuesta, y se ve en el dibujo con línea
      continua o discontinua.

      **Lo que hay que llevarse.** El dominio no se adivina: se escribe la
      condición que impone cada operación y se dibuja la región. Y lo que más
      se olvida es decir si el borde entra o no — que es justo lo que separa
      (d) y (e) de los otros cuatro.

  - id: seis-familias-de-curvas-de-nivel
    titulo: Seis familias de curvas de nivel, y la que no es de nivel sino de superficie
    fuente: Ejercicio 6.2 · Problemas complementarios, tema 6 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Dibujar las curvas de nivel (o superficies de nivel) de las siguientes
      funciones:

      (a) $f(x,y)=x+y$
      &nbsp;&nbsp;&nbsp;
      (c) $f(x,y)=x^{2}+4y^{2}$
      &nbsp;&nbsp;&nbsp;
      (e) $f(x,y)=x^{2}-y^{2}$

      (b) $f(x,y)=\sqrt{x+y}$
      &nbsp;&nbsp;&nbsp;
      (d) $f(x,y)=x^{2}+y^{2}+1$
      &nbsp;&nbsp;&nbsp;
      (f) $f(x,y,z)=x^{2}+(y-2)^{2}+z^{2}$
    pide: Las curvas o superficies de nivel de cada función.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los apartados (a) y (b) dan la misma familia de curvas. ¿Por qué?
        opciones:
          - texto: >-
              Porque $\sqrt{x+y}=k$ equivale a $x+y=k^{2}$: las curvas son las
              mismas rectas, solo cambia **qué nivel** corresponde a cada una
            correcta: true
            mensaje: |
              Eso es. Las curvas de nivel no cambian al aplicar una función
              creciente al resultado: solo se reetiquetan. En (b) además solo
              hay niveles $k\ge0$, y las rectas con $x+y<0$ no aparecen.
          - texto: >-
              Por casualidad
            mensaje: |
              No: es una regla general. $g(f)$ tiene las mismas curvas de nivel
              que $f$ siempre que $g$ sea estrictamente monótona.
          - texto: >-
              No dan la misma familia
            mensaje: |
              La dan, salvo por el rango: los niveles de (b) son solo los
              $k\ge0$, y el espaciado entre curvas consecutivas cambia. Pero
              las **curvas** son las mismas rectas.

      - tipo: calcular
        titulo: La razón de semiejes en (c)
        pregunta: |
          Las curvas de nivel de $x^{2}+4y^{2}$ son elipses. ¿Cuántas veces es
          el semieje horizontal mayor que el vertical?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '4'
            mensaje: |
              $4$ es el coeficiente de $y^{2}$, que es la razón **al
              cuadrado**. Normalizando, $\tfrac{x^{2}}{k}+\tfrac{y^{2}}{k/4}=1$:
              semiejes $\sqrt k$ y $\tfrac{\sqrt k}{2}$.
          - valor: '0.5'
            mensaje: |
              El del revés. El coeficiente grande va con $y$, así que es la
              dirección $y$ la que se comprime.
        pista: |
          $x^{2}+4y^{2}=k$ se escribe
          $\tfrac{x^{2}}{k}+\tfrac{y^{2}}{k/4}=1$.
        desarrollo: |
          $$
          a = \sqrt{k},
          \qquad
          b = \frac{\sqrt{k}}{2}
          \;\Longrightarrow\;
          \frac{a}{b} = 2
          $$

          Y la razón no depende del nivel: **todas las elipses de la familia
          son semejantes**, con la misma forma y distinto tamaño.

      - tipo: calcular
        titulo: El nivel mínimo de (d)
        pregunta: |
          ¿Cuál es el nivel más pequeño que alcanza $x^{2}+y^{2}+1$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '0'
            mensaje: |
              $x^{2}+y^{2}$ sí llega a $0$, pero el $+1$ lo sube todo. Y por eso
              **no hay curva de nivel $0$**: el nivel $1$ es un punto, el
              origen, y por debajo no hay nada.
          - valor: '-1'
            mensaje: |
              La suma de dos cuadrados nunca es negativa: el mínimo de
              $x^{2}+y^{2}$ es $0$.
        pista: |
          $x^{2}+y^{2}\ge0$ siempre, con igualdad solo en el origen.
        desarrollo: |
          $$
          \min f = 0+0+1 = 1
          $$

          El «nivel $1$» degenera en un solo punto, y para $k>1$ son
          circunferencias de radio $\sqrt{k-1}$. Para $k<1$, la curva de nivel
          está vacía.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Una curva de nivel es el conjunto $f(x,y)=k$, y dibujarlas es
              dibujar la superficie vista desde arriba.
          - texto: >-
              En (e), $x^{2}-y^{2}=k$ son hipérbolas: con $k>0$ abren en
              horizontal, con $k<0$ en vertical, y con $k=0$ son las dos
              rectas $y=\pm x$.
          - texto: >-
              En (f) hay tres variables, así que lo que sale son
              **superficies** de nivel: esferas centradas en $(0,2,0)$.
          - texto: >-
              Y como en (d) las curvas son circunferencias concéntricas
              igualmente espaciadas en $k$, también lo están en el plano.
            trampa: true
            mensaje: |
              No lo están: el radio es $\sqrt{k-1}$, que crece cada vez más
              despacio. Los niveles $2$, $3$, $4$ y $5$ dan radios $1$,
              $1{,}41$, $1{,}73$ y $2$: las circunferencias se **juntan**
              conforme te alejas. Eso significa que la superficie es cada vez
              más empinada — que es exactamente lo que se lee en un mapa de
              niveles.
        veredicto: |
          El espaciado de las curvas de nivel es información: juntas significa
          pendiente fuerte y separadas, terreno llano. Es lo mismo que en un
          mapa topográfico, y es lo que las hace útiles.
      - tipo: dibujar
        consigna: |
          Dibuja, para cada apartado, tres o cuatro curvas de nivel con sus
          valores de $k$ anotados. El apartado (f) pide superficies, no curvas.
        comprueba:
          - punto: |
              En (a), rectas paralelas de pendiente $-1$; en (b), las mismas pero
              solo para $k\ge0$.
            porque: |
              $\sqrt{x+y}=k$ es $x+y=k^{2}$, y $k^{2}$ nunca es negativo: la
              mitad de las rectas desaparece. Es el par que hay que comparar.
          - punto: |
              En (c), elipses concéntricas cada vez más grandes, con la
              proporción $2:1$ entre semiejes; en (d), circunferencias que
              **empiezan** en $k=1$.
            porque: |
              $x^{2}+4y^{2}=k$ da semiejes $\sqrt k$ y $\tfrac{\sqrt k}{2}$. Y en
              (d) el $+1$ desplaza: para $k<1$ no hay curva, y para $k=1$ solo el
              origen.
          - punto: |
              En (e), hipérbolas en dos familias, y para $k=0$ el **par de
              rectas** $y=\pm x$.
            porque: |
              El nivel cero de $x^{2}-y^{2}$ degenera en las asíntotas. Es el
              caso que distingue una familia bien dibujada de una a medias.
          - punto: |
              En (f), **esferas** concéntricas de centro $\left(0,2,0\right)$,
              dibujadas en unos ejes de tres dimensiones.
            porque: |
              Es una función de tres variables: sus conjuntos de nivel son
              superficies. Dibujarlas como circunferencias en el plano es
              responder a otra pregunta.
        veredicto: |
          Anotar el valor de $k$ junto a cada curva no es un adorno: es lo que
          convierte un montón de líneas en un mapa. Y es lo que permite ver de un
          vistazo si la función crece hacia dentro o hacia fuera.

    resolucion: |
      **Las seis familias.**

      | función | curvas de nivel $f=k$ |
      |---|---|
      | (a) $x+y$ | rectas paralelas $y=-x+k$ |
      | (b) $\sqrt{x+y}$ | las mismas rectas, solo para $k\ge0$ |
      | (c) $x^{2}+4y^{2}$ | elipses semejantes, semiejes $\sqrt k$ y $\tfrac{\sqrt k}{2}$ |
      | (d) $x^{2}+y^{2}+1$ | circunferencias de radio $\sqrt{k-1}$, con $k\ge1$ |
      | (e) $x^{2}-y^{2}$ | hipérbolas; el nivel $0$ son las rectas $y=\pm x$ |
      | (f) $x^{2}+(y-2)^{2}+z^{2}$ | esferas concéntricas centradas en $(0,2,0)$ |

      ### 1 · La regla de la reetiquetación

      Si $g$ es estrictamente monótona, $g\circ f$ tiene **las mismas curvas
      de nivel** que $f$: solo cambia la etiqueta. Eso explica (a) y (b), y es
      lo que permite simplificar una función antes de dibujar sus niveles.

      ### 2 · Lo que dice el espaciado

      | familia | radio del nivel $k$ | espaciado |
      |---|---|---|
      | (a) | — | constante: la superficie es un plano |
      | (d) | $\sqrt{k-1}$ | decreciente: cada vez más empinada |

      Curvas juntas, pendiente fuerte. Es la misma lectura que en un mapa.

      ### 3 · Los dos casos especiales

      **(e)** El nivel $0$ **degenera**: $x^{2}-y^{2}=0$ no es una hipérbola
      sino las dos rectas $y=\pm x$, que se cortan en el origen. Ese punto es
      un punto de silla.

      **(f)** Con tres variables, los niveles son superficies. Y la $-2$ del
      $(y-2)^{2}$ solo traslada el centro.

      **Lo que hay que llevarse.** Antes de dibujar, escribir $f=k$ y
      **normalizar**: dividir por $k$, completar cuadrados, lo que haga falta
      para reconocer la cónica. Y después mirar dos cosas que se olvidan: para
      qué niveles hay curva, y si alguno degenera.

  - id: cuatro-limites-por-curvas
    titulo: Cuatro límites por curvas, y lo que un parámetro en el resultado significa
    fuente: Ejercicio 6.3 · Problemas complementarios, tema 6 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular los siguientes límites a través de las curvas dadas:

      (a) $\displaystyle\lim_{(x,y)\to(0,0)}
      \frac{y^{2}\operatorname{sen}x}{x^{2}+y^{2}}$, &nbsp; $y=mx$

      (b) $\displaystyle\lim_{(x,y)\to(0,0)}
      \frac{x^{2}+2y}{x^{2}-3y^{2}}$, &nbsp; $y=mx^{2}$

      (c) $\displaystyle\lim_{(x,y)\to(0,0)}\frac{x+y}{x-y}$, &nbsp;
      $y=m\operatorname{sen}x$

      (d) $\displaystyle\lim_{(x,y)\to(0,0)}
      \frac{2x^{3}+y^{3}+x^{2}y^{2}}{x^{2}+y^{2}+x^{4}}$, &nbsp; $y=mx$
    pide: El límite a lo largo de cada familia de curvas.
    pasos:
      - tipo: reconocer
        pregunta: |
          Si el límite por una familia de curvas sale dependiendo de $m$, ¿qué
          se concluye?
        opciones:
          - texto: >-
              Que el límite doble **no existe**: por cada curva de la familia
              se llega a un valor distinto
            correcta: true
            mensaje: |
              Eso es. Y es la única conclusión que un límite por curvas permite
              sacar en firme: sirve para **negar** la existencia, nunca para
              afirmarla.
          - texto: >-
              Que el límite es la media de los valores
            mensaje: |
              El límite doble, si existe, es un número único. Si por dos
              caminos salen dos valores, no existe — no hay nada que
              promediar.
          - texto: >-
              Que hay que probar con otra familia
            mensaje: |
              Con una familia que dé valores distintos ya está demostrado que
              no existe. Probar más curvas solo haría falta si todas dieran lo
              mismo.

      - tipo: calcular
        titulo: El apartado (b), con m = 1
        pregunta: |
          Por $y=mx^{2}$, el límite de (b) vale $1+2m$. ¿Cuánto sale con
          $m=1$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es el valor con $m=0$, o sea por el eje $x$. Con $m=1$ hay
              que sumar el $2m$.
          - valor: '2'
            mensaje: |
              $2m$ es solo la mitad de la expresión. El $1$ viene del $x^{2}$
              del numerador.
        pista: |
          Sustituyendo $y=mx^{2}$: numerador $x^{2}(1+2m)$, denominador
          $x^{2}(1-3m^{2}x^{2})$.
        desarrollo: |
          $$
          \frac{x^{2}+2mx^{2}}{x^{2}-3m^{2}x^{4}}
          = \frac{1+2m}{1-3m^{2}x^{2}}
          \;\xrightarrow[x\to0]{}\;
          1+2m
          $$

          Con $m=1$: $3$. **Y como depende de $m$, el límite doble de (b) no
          existe.**

      - tipo: calcular
        titulo: El apartado (c), con m = 2
        pregunta: |
          Por $y=m\operatorname{sen}x$, el límite de (c) vale
          $\dfrac{1+m}{1-m}$. ¿Cuánto sale con $m=2$?
        respuesta:
          tipo: numero
          valor: '-3'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '3'
            mensaje: |
              El signo. Con $m=2$, el denominador $1-m$ vale $-1$.
          - valor: '1.5'
            mensaje: |
              $\tfrac{3}{2}$ sería $\tfrac{1+m}{m}$. El denominador es
              $1-m$, no $m$.
        pista: |
          $\dfrac{1+2}{1-2}$.
        desarrollo: |
          $$
          \frac{1+2}{1-2} = -3
          $$

          Y el paso que lo hace posible:
          $\dfrac{\operatorname{sen}x}{x}\to1$, así que
          $\dfrac{x+m\operatorname{sen}x}{x-m\operatorname{sen}x}
          \to\dfrac{1+m}{1-m}$. **También depende de $m$**: el límite doble no
          existe.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Acercarse por una familia de curvas es sustituir la curva en la
              función y hacer un límite de una variable.
          - texto: >-
              Si el resultado depende del parámetro, el límite doble no existe:
              (b) y (c) están en ese caso.
          - texto: >-
              En (a) y (d) sale $0$ para todo $m$, así que las rectas no
              detectan ningún problema.
          - texto: >-
              Y por eso en (a) y (d) el límite doble vale $0$.
            trampa: true
            mensaje: |
              Que todas las rectas den $0$ **no demuestra** que el límite
              exista: podría haber una curva más rara que diera otro valor. El
              ejemplo clásico es $\tfrac{x^{2}y}{x^{4}+y^{2}}$, que da $0$ por
              toda recta y $\tfrac12$ por la parábola $y=x^{2}$. Para afirmar
              que el límite existe hace falta una acotación, no una familia de
              caminos.
        veredicto: |
          Los límites por curvas son una herramienta **negativa**: sirven para
          demostrar que un límite no existe, nunca para demostrar que existe.
          Decirlo con esa frase es lo que se puntúa.
    resolucion: |
      **Los cuatro.**

      | apartado | curva | límite |
      |---|---|---|
      | (a) | $y=mx$ | $0$ |
      | (b) | $y=mx^{2}$ | $1+2m$ |
      | (c) | $y=m\operatorname{sen}x$ | $\dfrac{1+m}{1-m}$ |
      | (d) | $y=mx$ | $0$ |

      ### 1 · Los dos que niegan el límite

      **(b)** Con $y=mx^{2}$:

      $$
      \frac{x^{2}+2mx^{2}}{x^{2}-3m^{2}x^{4}}
      = \frac{1+2m}{1-3m^{2}x^{2}} \to 1+2m
      $$

      **(c)** Con $y=m\operatorname{sen}x$, dividiendo por $x$ y usando
      $\tfrac{\operatorname{sen}x}{x}\to1$:

      $$
      \frac{1+m\frac{\operatorname{sen}x}{x}}
      {1-m\frac{\operatorname{sen}x}{x}} \to \frac{1+m}{1-m}
      $$

      Los dos dependen del parámetro: **el límite doble no existe** en ninguno
      de los dos.

      ### 2 · Los dos que dan cero

      **(a)** Con $y=mx$:

      $$
      \frac{m^{2}x^{2}\operatorname{sen}x}{x^{2}\left(1+m^{2}\right)}
      = \frac{m^{2}\operatorname{sen}x}{1+m^{2}} \to 0
      $$

      **(d)** Con $y=mx$, el numerador es de grado $3$ y el denominador de
      grado $2$: sale $x$ multiplicando y el límite es $0$.

      ### 3 · Lo que esos ceros no demuestran

      Que todas las rectas den $0$ **no basta**. El contraejemplo de
      referencia:

      $$
      f(x,y)=\frac{x^{2}y}{x^{4}+y^{2}}
      $$

      vale $0$ por cualquier recta y $\tfrac12$ por la parábola $y=x^{2}$. Para
      **afirmar** que un límite existe hay que acotar:

      $$
      \left|f(x,y)-L\right| \le g(r) \to 0
      $$

      con $r$ la distancia al punto. Las curvas solo sirven para lo contrario.

      **Lo que hay que llevarse.** Un límite por curvas que depende del
      parámetro cierra el ejercicio: no existe. Uno que no depende no cierra
      nada, y hay que decirlo — escribir «luego el límite vale 0» después de
      probar solo rectas es el error que más veces cuesta puntos en este tema.

  - id: cuatro-planos-tangentes
    titulo: Cuatro planos tangentes, y el que viene en forma implícita
    fuente: Ejercicio 6.5 · Problemas complementarios, tema 6 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Obtener las ecuaciones de los planos tangentes a las siguientes
      superficies en los puntos especificados:

      (a) $z = x^{2}+y^{2}-2xy+2y-2$, &nbsp; $P(1,2,3)$

      (b) $z^{2}-2x^{2}-2y^{2}-12 = 0$, &nbsp; $P(1,-1,4)$

      (c) $z = \ln(2x+y)$, &nbsp; $P(-1,3,0)$

      (d) $z = \dfrac{x^{2}}{16}+\dfrac{y^{2}}{9}+3$, &nbsp; $P(-4,3,5)$
    pide: La ecuación del plano tangente en cada caso.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado (b) viene como $F(x,y,z)=0$ y no como $z=f(x,y)$. ¿Qué
          cambia?
        opciones:
          - texto: >-
              Que el plano se escribe con el gradiente de $F$ en el espacio:
              $F_x(x-x_0)+F_y(y-y_0)+F_z(z-z_0)=0$
            correcta: true
            mensaje: |
              Eso es. El gradiente de $F$ es **perpendicular a la superficie de
              nivel** $F=0$, y con un punto y una normal el plano está
              determinado. Despejar $z$ también funciona, pero es más largo y
              puede dar problemas de signo.
          - texto: >-
              Nada: hay que despejar $z$ siempre
            mensaje: |
              Despejar $z=\sqrt{2x^{2}+2y^{2}+12}$ funciona aquí, pero obliga a
              elegir la rama y a derivar una raíz. La forma implícita evita las
              dos cosas.
          - texto: >-
              Que no tiene plano tangente
            mensaje: |
              Lo tiene: el gradiente de $F$ en $P$ es $(-4,4,8)$, que no es
              nulo, así que la superficie es regular ahí.

      - tipo: calcular
        titulo: El plano del apartado (a), evaluado
        pregunta: |
          El plano tangente en (a) es $z=-3-2x+4y$. ¿Cuánto vale en
          $(1{,}1;\,1{,}9)$?
        respuesta:
          tipo: numero
          valor: '2.4'
          tolerancia: 0.008
          formato: con un decimal
        distractores:
          - valor: '3'
            mensaje: |
              $3$ es el valor en el punto de tangencia $(1,2)$. Al movernos un
              poco, el plano baja.
          - valor: '2.41'
            mensaje: |
              $2{,}41$ es el valor **exacto** de la función en ese punto. El
              plano da $2{,}4$: la diferencia, una centésima, es el error de la
              aproximación.
        pista: |
          $-3-2(1{,}1)+4(1{,}9)$.
        desarrollo: |
          $$
          -3 - 2{,}2 + 7{,}6 = 2{,}4
          $$

          Y ese número es la respuesta del apartado (a) del ejercicio 6.6: el
          plano tangente **es** la aproximación por la diferencial.

      - tipo: calcular
        titulo: El coeficiente de x en el apartado (b)
        pregunta: |
          Despejando el plano de (b) en la forma $z=\alpha x+\beta y+\gamma$,
          ¿cuánto vale $\alpha$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.004
          formato: en forma exacta (1/2) o con un decimal
        distractores:
          - valor: '-0.5'
            mensaje: |
              El signo. $\nabla F=(-4,4,8)$, y al despejar $z$ el $-4$ pasa
              dividido por $8$ **cambiando de signo**: $+\tfrac12$.
          - valor: '-4'
            mensaje: |
              $-4$ es $F_x$, la componente del gradiente. Falta dividirla entre
              $-F_z=-8$.
        pista: |
          $\nabla F = \left(-4x,\,-4y,\,2z\right)$, que en $P(1,-1,4)$ vale
          $(-4,4,8)$.
        desarrollo: |
          $$
          -4(x-1)+4(y+1)+8(z-4) = 0
          $$

          $$
          8z = 4x-4y+24
          \;\Longrightarrow\;
          z = \frac{x}{2}-\frac{y}{2}+3
          $$

          $\alpha=\tfrac12$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Para $z=f(x,y)$, el plano es
              $z = f(P)+f_x(P)(x-x_0)+f_y(P)(y-y_0)$.
          - texto: >-
              Para $F(x,y,z)=0$, el plano es
              $\nabla F\cdot\left(x-x_0,\,y-y_0,\,z-z_0\right)=0$, porque el
              gradiente es normal a la superficie de nivel.
          - texto: >-
              Lo primero de todo es comprobar que el punto está en la
              superficie: si no, no hay nada que calcular.
          - texto: >-
              Y las dos fórmulas son distintas, así que una superficie dada de
              las dos formas tiene dos planos tangentes.
            trampa: true
            mensaje: |
              El plano es **el mismo**: son dos escrituras de lo mismo. Con
              $F=z-f(x,y)$, el gradiente es $(-f_x,-f_y,1)$ y la segunda
              fórmula se reduce a la primera. Lo que cambia es la comodidad,
              no el resultado.
        veredicto: |
          Las dos fórmulas son la misma, y conviene usar la que evite despejar.
          En (b), despejar $z$ obligaría a derivar una raíz y a elegir rama;
          con el gradiente son tres derivadas de un polinomio.
    resolucion: |
      **Los cuatro planos.**

      | apartado | plano tangente |
      |---|---|
      | (a) | $z = -3-2x+4y$ |
      | (b) | $z = \tfrac{x}{2}-\tfrac{y}{2}+3$ |
      | (c) | $z = -1+2x+y$ |
      | (d) | $z = 1-\tfrac{x}{2}+\tfrac{2y}{3}$ |

      ### 0 · Lo primero: comprobar el punto

      | apartado | $f$ o $F$ en $P$ | ¿está? |
      |---|---|---|
      | (a) | $1+4-4+4-2=3$ | ✓ |
      | (b) | $16-2-2-12=0$ | ✓ |
      | (c) | $\ln(-2+3)=\ln1=0$ | ✓ |
      | (d) | $1+1+3=5$ | ✓ |

      ### 1 · Las dos fórmulas

      $$
      z = f(P)+f_x(P)\left(x-x_0\right)+f_y(P)\left(y-y_0\right)
      $$

      $$
      F_x\left(x-x_0\right)+F_y\left(y-y_0\right)+F_z\left(z-z_0\right)=0
      $$

      La segunda es la general, y la primera es su caso particular con
      $F=z-f(x,y)$.

      ### 2 · Las derivadas en cada punto

      | apartado | $f_x(P)$ | $f_y(P)$ |
      |---|---|---|
      | (a) | $2x-2y = -2$ | $2y-2x+2 = 4$ |
      | (c) | $\tfrac{2}{2x+y} = 2$ | $\tfrac{1}{2x+y} = 1$ |
      | (d) | $\tfrac{x}{8} = -\tfrac12$ | $\tfrac{2y}{9} = \tfrac23$ |

      Y en (b), $\nabla F(1,-1,4) = (-4,4,8)$.

      ### 3 · Para qué sirven

      Cada uno de estos cuatro planos es la respuesta del apartado
      correspondiente del ejercicio siguiente: **aproximar la función cerca
      del punto es evaluar el plano**. Por eso el 6.6 dice «utilizar los planos
      tangentes obtenidos en el problema anterior».

      **Lo que hay que llevarse.** Comprobar primero que el punto está en la
      superficie —cuesta diez segundos y evita construir un plano tangente a
      nada—, y elegir la forma que evite despejar. Con $F(x,y,z)=0$, el
      gradiente es la normal y el plano sale en una línea.

  - id: cuatro-aproximaciones-con-la-diferencial
    titulo: Cuatro aproximaciones, que son los cuatro planos evaluados
    fuente: Ejercicio 6.6 · Problemas complementarios, tema 6 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Utilizando la diferencial aproximar los valores de las siguientes
      funciones en los puntos dados. *Ayuda:* utilizar los planos tangentes
      obtenidos en el problema anterior.

      (a) $f(x,y)=x^{2}+y^{2}-2xy+2y-2$, &nbsp; $f(1{,}1;\,1{,}9)\approx$

      (b) $f(x,y)=\sqrt{2x^{2}+2y^{2}+12}$, &nbsp; $f(1{,}2;\,-0{,}9)\approx$

      (c) $f(x,y)=\ln(2x+y)$, &nbsp; $f(-1{,}1;\,2{,}9)\approx$

      (d) $f(x,y)=\dfrac{x^{2}}{16}+\dfrac{y^{2}}{9}+3$, &nbsp;
      $f(-3{,}9;\,3{,}2)\approx$
    pide: El valor aproximado de las cuatro funciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué relación hay entre «aproximar con la diferencial» y «el plano
          tangente»?
        opciones:
          - texto: >-
              Son lo mismo: aproximar con la diferencial es sustituir la
              función por su plano tangente en el punto de partida
            correcta: true
            mensaje: |
              Eso es, y por eso el enunciado remite al ejercicio anterior: los
              cuatro planos ya están calculados y solo hay que evaluarlos.
          - texto: >-
              La diferencial es más precisa que el plano tangente
            mensaje: |
              Son la misma aproximación escrita de dos maneras:
              $f\approx f(P)+df$ y $z=$ plano tangente son idénticas.
          - texto: >-
              El plano tangente sirve para superficies y la diferencial para
              funciones
            mensaje: |
              La superficie **es** la gráfica de la función. No son objetos
              distintos.

      - tipo: calcular
        titulo: El apartado (c)
        pregunta: |
          El plano de (c) es $z=-1+2x+y$. ¿Cuánto vale en
          $(-1{,}1;\,2{,}9)$?
        respuesta:
          tipo: numero
          valor: '-0.3'
          tolerancia: 0.004
          formato: con un decimal
        distractores:
          - valor: '-0.3567'
            mensaje: |
              $-0{,}3567$ es el valor **exacto**, $\ln 0{,}7$. El plano da
              $-0{,}3$: la diferencia, cinco centésimas, es el error de la
              aproximación lineal.
          - valor: '0'
            mensaje: |
              $0$ es el valor en el punto de tangencia $(-1,3)$. Al movernos un
              poco, el plano baja.
        pista: |
          $-1 + 2\cdot(-1{,}1) + 2{,}9$.
        desarrollo: |
          $$
          -1 - 2{,}2 + 2{,}9 = -0{,}3
          $$

          Y el valor exacto es $\ln\left(2\cdot(-1{,}1)+2{,}9\right)
          = \ln 0{,}7 = -0{,}3567$: el plano se equivoca en cinco centésimas.

      - tipo: calcular
        titulo: El apartado (b)
        pregunta: |
          El plano de (b) es $z=\tfrac{x}{2}-\tfrac{y}{2}+3$. ¿Cuánto vale en
          $(1{,}2;\,-0{,}9)$?
        respuesta:
          tipo: numero
          valor: '4.05'
          tolerancia: 0.008
          formato: con dos decimales
        distractores:
          - valor: '4'
            mensaje: |
              $4$ es el valor en el punto de tangencia $(1,-1)$. Los dos
              desplazamientos suman: $+0{,}1$ por $x$ y $-0{,}05$… no,
              revisa el signo del término en $y$.
          - valor: '3.15'
            mensaje: |
              Has sumado el término en $y$ en vez de restarlo. Con $y=-0{,}9$,
              $-\tfrac{y}{2}$ es $+0{,}45$.
        pista: |
          $\tfrac{1{,}2}{2} + \tfrac{0{,}9}{2} + 3$.
        desarrollo: |
          $$
          0{,}6 + 0{,}45 + 3 = 4{,}05
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La aproximación es
              $f(P+\Delta)\approx f(P)+f_x\Delta x+f_y\Delta y$, que es el
              plano tangente evaluado.
          - texto: >-
              En los cuatro apartados el punto pedido está a una o dos décimas
              del punto de tangencia, que es donde la aproximación funciona.
          - texto: >-
              El error es de orden $\Delta^{2}$: al acercarse el punto, el
              error cae con el cuadrado.
          - texto: >-
              Y por eso la aproximación es exacta cuando la función es lineal
              en una de las dos variables.
            trampa: true
            mensaje: |
              Hace falta que sea lineal en **las dos**, o sea que la superficie
              sea un plano. En (a), la función es cuadrática en las dos y el
              error es de una centésima; que fuese lineal en $x$ sola no
              bastaría, porque la curvatura en $y$ seguiría ahí.
        veredicto: |
          El error de estas cuatro aproximaciones está en la tercera o la
          cuarta cifra, y eso es lo que significa «local»: a una décima del
          punto, el plano y la superficie casi no se distinguen.
    resolucion: |
      **Las cuatro.**

      | apartado | plano evaluado | valor exacto | error |
      |---|---|---|---|
      | (a) | $2{,}4$ | $2{,}41$ | $0{,}01$ |
      | (b) | $4{,}05$ | $4{,}0497$ | $0{,}0003$ |
      | (c) | $-0{,}3$ | $-0{,}3011$ | $0{,}0011$ |
      | (d) | $5{,}0833$ | $5{,}0847$ | $0{,}0014$ |

      ### 1 · La fórmula

      $$
      f(P+\Delta) \approx f(P) + f_x(P)\,\Delta x + f_y(P)\,\Delta y
      $$

      que es el plano tangente evaluado en el punto nuevo. **Aproximar con la
      diferencial y usar el plano tangente son la misma operación.**

      ### 2 · Los cuatro, en una línea cada uno

      $$
      \text{(a)}\;\; -3-2(1{,}1)+4(1{,}9) = 2{,}4
      $$

      $$
      \text{(b)}\;\; \frac{1{,}2}{2}+\frac{0{,}9}{2}+3 = 4{,}05
      $$

      $$
      \text{(c)}\;\; -1+2(-1{,}1)+2{,}9 = -0{,}3
      $$

      $$
      \text{(d)}\;\; 1+1{,}95+2{,}1\overline{3} = 5{,}0833
      $$

      ### 3 · Por qué funciona tan bien

      El error de la aproximación lineal es de orden $\lVert\Delta\rVert^{2}$.
      Aquí los desplazamientos son de una o dos décimas, así que el error es
      del orden de una centésima o menos — que es justo lo que se ve en la
      tabla.

      Y el apartado (b) enseña algo más: la raíz $\sqrt{2x^{2}+2y^{2}+12}$ es
      muy poco curvada en esa zona, y por eso su error es diez veces menor que
      el de (a) con un desplazamiento parecido.

      **Lo que hay que llevarse.** Este ejercicio no tiene cuentas nuevas: son
      los cuatro planos del ejercicio anterior evaluados en un punto. Y esa es
      la idea que hay que quedarse — **la diferencial es el plano tangente**, y
      todo lo que se sepa de uno vale para el otro.

  - id: la-direccional-hacia-un-punto-lejano
    titulo: Una direccional hacia un punto, y el punto está lejísimos
    fuente: Ejercicio 6.7 · Problemas complementarios, tema 6 · Cálculo, UPV/EHU (2017/2018 4E)
    nivel: practica
    enunciado: |
      Calcular la derivada direccional de la función
      $f(x,y)=x^{2}\operatorname{sen}2y$ cuando nos dirigimos desde el punto
      $P=\left(1,\tfrac{\pi}{2}\right)$ al punto
      $Q=\left(4,\tfrac{\pi}{2}-4\right)$.
    pide: La derivada direccional de $f$ en $P$ hacia $Q$.
    pasos:
      - tipo: reconocer
        pregunta: |
          $Q$ está a distancia $5$ de $P$. ¿Influye eso en el resultado?
        opciones:
          - texto: >-
              No: de $Q$ solo se usa la **dirección**, y el vector
              $\overrightarrow{PQ}$ se normaliza antes de nada
            correcta: true
            mensaje: |
              Eso es. «Dirigirse hacia $Q$» fija una dirección, no una
              distancia. La derivada direccional mide el ritmo de cambio **por
              unidad de longitud**, y por eso el vector tiene que ser unitario.
          - texto: >-
              Sí: hay que multiplicar el gradiente por el vector
              $\overrightarrow{PQ}$ entero
            mensaje: |
              Eso daría $8$ en vez de $\tfrac85$, y el resultado dependería de
              dónde se ponga $Q$ sobre la misma recta — que es justo lo que no
              puede pasar.
          - texto: >-
              Sí: hay que evaluar $f$ también en $Q$
            mensaje: |
              Eso sería una tasa de variación media entre dos puntos, no una
              derivada. La derivada direccional solo mira lo que pasa **en
              $P$**.

      - tipo: calcular
        titulo: El gradiente en P
        pregunta: |
          ¿Cuánto vale $f_y$ en $P\left(1,\tfrac{\pi}{2}\right)$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              El signo. $f_y = 2x^{2}\cos 2y$, y en $y=\tfrac{\pi}{2}$ el
              coseno vale $\cos\pi = -1$.
          - valor: '0'
            mensaje: |
              $0$ es $f_x$, porque $f_x = 2x\operatorname{sen}2y$ y
              $\operatorname{sen}\pi = 0$. La derivada respecto de $y$ es la
              que sobrevive.
        pista: |
          $f_y = 2x^{2}\cos 2y$, y $\cos\pi = -1$.
        desarrollo: |
          $$
          f_x = 2x\operatorname{sen}2y
          \quad\Longrightarrow\quad
          f_x\left(1,\tfrac{\pi}{2}\right) = 2\operatorname{sen}\pi = 0
          $$

          $$
          f_y = 2x^{2}\cos 2y
          \quad\Longrightarrow\quad
          f_y\left(1,\tfrac{\pi}{2}\right) = 2\cos\pi = -2
          $$

          Así que $\nabla f(P) = (0,-2)$.

      - tipo: calcular
        titulo: La derivada direccional
        pregunta: |
          Con $\nabla f(P)=(0,-2)$ y el unitario de
          $\overrightarrow{PQ}=(3,-4)$, ¿cuánto vale $D_{u}f(P)$?
        respuesta:
          tipo: numero
          valor: '1.6'
          tolerancia: 0.008
          formato: en forma exacta (8/5) o con un decimal
        distractores:
          - valor: '8'
            mensaje: |
              $8$ es $\nabla f\cdot(3,-4)$ **sin normalizar**. Hay que dividir
              entre $\lVert(3,-4)\rVert = 5$.
          - valor: '-1.6'
            mensaje: |
              El signo. $(-2)\cdot\left(-\tfrac45\right)$ es **positivo**: dos
              negativos.
        pista: |
          $\lVert(3,-4)\rVert = 5$, así que el unitario es
          $\left(\tfrac35,-\tfrac45\right)$.
        desarrollo: |
          $$
          D_{u}f(P) = (0,-2)\cdot\left(\frac35,-\frac45\right)
          = 0 + \frac85 = \frac85 = 1{,}6
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La dirección la marca $\overrightarrow{PQ}=Q-P=(3,-4)$, que hay
              que normalizar: $u=\left(\tfrac35,-\tfrac45\right)$.
          - texto: >-
              La derivada direccional es
              $D_{u}f(P)=\nabla f(P)\cdot u$, con el gradiente evaluado en $P$.
          - texto: >-
              Sale $\tfrac85>0$, así que $f$ **crece** al salir de $P$ hacia
              $Q$.
          - texto: >-
              Y como $\tfrac85$ es positivo, esa es la dirección de máximo
              crecimiento.
            trampa: true
            mensaje: |
              La de máximo crecimiento es la del **gradiente**, $(0,-2)$, y
              vale $\lVert\nabla f\rVert = 2$. Nuestra dirección da $1{,}6$,
              que es menos: crece, pero no lo más deprisa posible. Que una
              direccional salga positiva solo dice que se sube, no que se suba
              por la pendiente más fuerte.
        veredicto: |
          Dos cosas que se cobran en el examen: **normalizar** —si no, el
          resultado depende de lo lejos que esté $Q$— y no confundir «crece»
          con «crece lo máximo».
    resolucion: |
      **Resultado: $D_{u}f(P) = \dfrac{8}{5} = 1{,}6$.**

      ### 1 · La dirección

      $$
      \overrightarrow{PQ} = Q-P
      = \left(4-1,\; \tfrac{\pi}{2}-4-\tfrac{\pi}{2}\right) = (3,-4)
      $$

      El $\tfrac{\pi}{2}$ se cancela: ese es todo el truco del enunciado, que
      lo pone para que la resta salga limpia. Y
      $\lVert(3,-4)\rVert = 5$, así que

      $$
      u = \left(\frac35,\,-\frac45\right)
      $$

      ### 2 · El gradiente en P

      $$
      \nabla f = \left(2x\operatorname{sen}2y,\; 2x^{2}\cos 2y\right)
      $$

      En $P\left(1,\tfrac{\pi}{2}\right)$, con $2y=\pi$:

      $$
      \nabla f(P) = \left(2\operatorname{sen}\pi,\; 2\cos\pi\right) = (0,-2)
      $$

      ### 3 · El producto escalar

      $$
      D_{u}f(P) = (0,-2)\cdot\left(\frac35,-\frac45\right)
      = \frac{8}{5}
      $$

      ### 4 · Lo que el número dice

      Positivo: saliendo de $P$ hacia $Q$, la función **crece** a razón de
      $1{,}6$ unidades por unidad de longitud recorrida.

      Y una comprobación que siempre conviene: $\lVert\nabla f(P)\rVert = 2$,
      y en efecto $1{,}6 \le 2$. **Ninguna derivada direccional puede superar
      al módulo del gradiente** — si sale una que lo supera, hay un error de
      normalización.

      **Lo que hay que llevarse.** «Desde $P$ hacia $Q$» son tres pasos
      mecánicos: restar, normalizar, multiplicar escalarmente por el gradiente.
      El único sitio donde se pierden puntos es olvidar el segundo.

  - id: mayor-o-menor-sin-conocer-la-funcion
    titulo: ¿Mayor o menor?, sin saber qué función es
    fuente: Ejercicio 6.8 · Problemas complementarios, tema 6 · Cálculo, UPV/EHU (2011/2012 4E)
    nivel: practica
    enunciado: |
      Se sabe que la función $F(x,y)$ verifica $\nabla F(1,1) = (3,-5)$.
      Supongamos que realizamos un pequeño desplazamiento partiendo del punto
      $(1,1)$ siguiendo la dirección $v(4,2)$. El nuevo valor de la función
      $F(x,y)$, ¿es mayor o menor que $F(1,1)$?
    pide: Si el valor nuevo es mayor o menor, y por qué.
    pasos:
      - tipo: reconocer
        pregunta: |
          No se da la fórmula de $F$. ¿Se puede responder igual?
        opciones:
          - texto: >-
              Sí: el **signo** de la derivada direccional decide si sube o
              baja, y para ese signo basta el gradiente
            correcta: true
            mensaje: |
              Eso es. El gradiente en el punto es toda la información de primer
              orden que hace falta; la fórmula de $F$ no aporta nada más para
              esta pregunta.
          - texto: >-
              No: sin la fórmula no hay manera de saberlo
            mensaje: |
              El gradiente **es** la derivada. Con $\nabla F(1,1)$ y una
              dirección ya está determinado el ritmo de cambio en ese punto.
          - texto: >-
              Sí, y además se puede calcular el valor nuevo exactamente
            mensaje: |
              El valor nuevo no: para eso haría falta $F(1,1)$ y el tamaño del
              desplazamiento. Lo que se puede decidir es si sube o baja.

      - tipo: calcular
        titulo: La derivada direccional
        pregunta: |
          ¿Cuánto vale $D_{v}F(1,1)$ con $v=(4,2)$ normalizado?
        respuesta:
          tipo: numero
          valor: '0.4472'
          tolerancia: 0.004
          formato: con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es $\nabla F\cdot(4,2)$ **sin normalizar**. Hay que dividir
              entre $\lVert(4,2)\rVert = \sqrt{20}$.
          - valor: '-3.1305'
            mensaje: |
              Has cruzado las componentes: $3$ va con el $4$ y $-5$ con el $2$,
              no al revés.
        pista: |
          $\dfrac{3\cdot4+(-5)\cdot2}{\sqrt{4^{2}+2^{2}}}$.
        desarrollo: |
          $$
          D_{v}F(1,1) = \frac{(3,-5)\cdot(4,2)}{\sqrt{20}}
          = \frac{12-10}{\sqrt{20}} = \frac{2}{2\sqrt5}
          = \frac{1}{\sqrt5} \approx 0{,}4472
          $$

      - tipo: calcular
        titulo: Lo máximo que podría haber salido
        pregunta: |
          ¿Cuánto vale la derivada direccional **máxima** en $(1,1)$, o sea
          $\lVert\nabla F(1,1)\rVert$?
        respuesta:
          tipo: numero
          valor: '5.831'
          tolerancia: 0.006
          formato: con tres decimales
        distractores:
          - valor: '8'
            mensaje: |
              $8$ sería $3+5$. El módulo es
              $\sqrt{3^{2}+5^{2}}$, no la suma.
          - valor: '34'
            mensaje: |
              $34$ es $3^{2}+5^{2}$: falta la raíz.
        pista: |
          $\sqrt{9+25}$.
        desarrollo: |
          $$
          \lVert\nabla F(1,1)\rVert = \sqrt{34} \approx 5{,}831
          $$

          Y compárese con $0{,}4472$: la dirección $v(4,2)$ es de las que
          **casi** no cambian la función. Está a punto de ser tangente a la
          curva de nivel.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Un desplazamiento pequeño en la dirección unitaria $u$ cambia $F$
              en $\Delta F \approx D_{u}F\cdot\lVert\Delta\rVert$.
          - texto: >-
              $D_{v}F(1,1)=\tfrac{1}{\sqrt5}>0$, así que $\Delta F>0$: el valor
              nuevo es **mayor**.
          - texto: >-
              Y el signo no depende de normalizar: dividir por un número
              positivo no lo cambia, así que para responder «mayor o menor»
              basta mirar $\nabla F\cdot v$.
          - texto: >-
              Y como $\nabla F$ tiene una componente negativa, hay direcciones
              en las que $F$ baja — luego la respuesta depende del tamaño del
              desplazamiento.
            trampa: true
            mensaje: |
              Que haya direcciones donde baja es cierto, pero **no es esta**.
              Y el tamaño no interviene en el signo: mientras el
              desplazamiento sea pequeño, $\Delta F$ tiene el signo de
              $D_{u}F$, que aquí es positivo. El tamaño solo cambia cuánto
              sube, no si sube.
        veredicto: |
          Para responder «mayor o menor» basta el **signo** de
          $\nabla F\cdot v$, y ese signo no necesita normalizar nada. Ahora
          bien, si el enunciado pide el valor del ritmo, normalizar es
          obligatorio.
    resolucion: |
      **Resultado: es mayor.** Y el ritmo es
      $D_{v}F(1,1)=\dfrac{1}{\sqrt5}\approx 0{,}4472$.

      ### 1 · La cuenta

      $$
      u = \frac{(4,2)}{\sqrt{20}}
      \qquad
      D_{v}F(1,1) = \frac{(3,-5)\cdot(4,2)}{\sqrt{20}}
      = \frac{12-10}{2\sqrt5} = \frac{1}{\sqrt5} > 0
      $$

      Positiva $\Rightarrow$ al desplazarse un poco en esa dirección, $F$
      **aumenta**.

      ### 2 · Por qué el signo es lo único que importa aquí

      Para un desplazamiento pequeño $\Delta = t\,u$ con $t>0$:

      $$
      F\left(P+\Delta\right) - F(P) \approx t\, D_{u}F(P)
      $$

      y $t>0$, así que el signo de la diferencia **es** el de $D_{u}F$. Como
      normalizar consiste en dividir por $\lVert v\rVert>0$, para decidir el
      signo basta con $\nabla F\cdot v = 2 > 0$ — el $\sqrt{20}$ no hace falta.

      ### 3 · El matiz que da nota

      $$
      \frac{1}{\sqrt5} \approx 0{,}447
      \qquad\text{frente a}\qquad
      \lVert\nabla F\rVert = \sqrt{34} \approx 5{,}83
      $$

      El ritmo en esa dirección es **trece veces menor** que el máximo
      posible. Dicho de otro modo: $v(4,2)$ está casi alineada con la curva de
      nivel, que va en la dirección perpendicular al gradiente, o sea $(5,3)$.
      El ángulo entre $(4,2)$ y $(5,3)$ es de apenas $3^\circ$.

      Decir «mayor, pero muy poco, porque la dirección está casi sobre la
      curva de nivel» es la respuesta completa.

      **Lo que hay que llevarse.** Preguntas del tipo «¿sube o baja?» se
      resuelven con un producto escalar y un signo. No hace falta la función,
      no hace falta normalizar y no hace falta el tamaño del paso.

  - id: los-dos-parametros-que-fija-el-gradiente
    titulo: Dos parámetros, y el gradiente los fija los dos
    fuente: Ejercicio 6.11 · Problemas complementarios, tema 6 · Cálculo, UPV/EHU (2014/2015 6E)
    nivel: practica
    enunciado: |
      Sea la función $f(x,y)=e^{xy}\operatorname{sen}(ax+by)$. Sabiendo que el
      gradiente de $f$ en el punto $A(0,0)$ es paralelo a la recta
      $2x-y-1=0$, y que en dicho punto la derivada direccional en el sentido
      positivo del eje $OX$ vale $2$, calcular $a$ y $b$.
    pide: Los valores de $a$ y $b$.
    pasos:
      - tipo: reconocer
        pregunta: |
          La recta es $2x-y-1=0$. ¿Qué vector es **paralelo** a ella?
        opciones:
          - texto: >-
              $(1,2)$, porque despejando $y=2x-1$ la pendiente es $2$
            correcta: true
            mensaje: |
              Eso es. Un avance de $1$ en $x$ sube $2$ en $y$: dirección
              $(1,2)$. El $-1$ del término independiente no interviene, porque
              solo desplaza la recta sin girarla.
          - texto: >-
              $(2,-1)$, los coeficientes de la ecuación
            mensaje: |
              $(2,-1)$ es el vector **normal**, no el director. Los
              coeficientes de $Ax+By+C=0$ dan la perpendicular; el director es
              $(-B,A)=(1,2)$.
          - texto: >-
              $(2,1)$
            mensaje: |
              La pendiente de $y=2x-1$ es $2 = \tfrac{\Delta y}{\Delta x}$, así
              que el director es $(1,2)$: primero $1$, después $2$.

      - tipo: calcular
        titulo: El parámetro a
        pregunta: |
          La direccional en el sentido positivo de $OX$ es $f_x(0,0)$, y vale
          $2$. ¿Cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              $f_x(0,0)$ sale exactamente $a$, sin factores: el
              $e^{xy}$ vale $1$ y el $\cos 0$ vale $1$. Así que $a=2$.
          - valor: '4'
            mensaje: |
              $4$ es el valor de $b$. La condición del eje $OX$ fija $a$, y la
              del paralelismo fija después $b$ a partir de $a$.
        pista: |
          $f_x = y\,e^{xy}\operatorname{sen}(ax+by) + a\,e^{xy}\cos(ax+by)$, y
          en $(0,0)$ el primer sumando se anula.
        desarrollo: |
          $$
          f_x(0,0) = 0\cdot 1\cdot \operatorname{sen}0 + a\cdot 1\cdot\cos 0
          = a
          $$

          Y como esa derivada vale $2$: **$a=2$**.

      - tipo: calcular
        titulo: El parámetro b
        pregunta: |
          $\nabla f(0,0)=(a,b)$ ha de ser paralelo a $(1,2)$, y $a=2$. ¿Cuánto
          vale $b$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '-1'
            mensaje: |
              $-1$ sale de usar $(2,-1)$ como dirección de la recta: ese es el
              vector **normal**. El director es $(1,2)$.
          - valor: '1'
            mensaje: |
              $b=1$ daría gradiente $(2,1)$, con pendiente $\tfrac12$. La recta
              tiene pendiente $2$.
        pista: |
          Paralelo a $(1,2)$ significa $\dfrac{b}{a}=2$.
        desarrollo: |
          $$
          \frac{b}{a} = 2
          \quad\Longrightarrow\quad
          b = 2a = 4
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La derivada direccional en el sentido positivo de $OX$ es la
              direccional con $u=(1,0)$, o sea $f_x$.
          - texto: >-
              En $(0,0)$, $f_x=a$ y $f_y=b$, así que $\nabla f(0,0)=(a,b)$.
          - texto: >-
              Paralelo a $2x-y-1=0$ es paralelo a su vector director $(1,2)$,
              luego $b=2a$; con $a=2$ sale $b=4$.
          - texto: >-
              Y hay que comprobar además que $(0,0)$ esté sobre la recta
              $2x-y-1=0$.
            trampa: true
            mensaje: |
              No hace falta, y de hecho no lo está: $2\cdot0-0-1=-1\ne0$. La
              recta aparece solo para **dar una dirección**; dónde esté situada
              es irrelevante. Por eso el término independiente no se usa en
              ningún momento.
        veredicto: |
          Dos datos, dos incógnitas, y cada dato despeja una: la del eje $OX$
          da $a$ directamente, y la del paralelismo da $b$ a partir de $a$. El
          orden importa, porque el paralelismo solo fija la **razón**
          $\tfrac ba$.
    resolucion: |
      **Resultado: $a=2$ y $b=4$.**

      ### 1 · El gradiente en el origen

      $$
      f_x = y\,e^{xy}\operatorname{sen}(ax+by) + a\,e^{xy}\cos(ax+by)
      $$

      $$
      f_y = x\,e^{xy}\operatorname{sen}(ax+by) + b\,e^{xy}\cos(ax+by)
      $$

      En $(0,0)$: $e^{0}=1$, $\operatorname{sen}0=0$, $\cos 0=1$, y además los
      factores $y$ y $x$ de los primeros sumandos se anulan. Queda

      $$
      \nabla f(0,0) = (a,\,b)
      $$

      Una coincidencia muy cómoda, y el motivo de que el enunciado elija el
      origen: **el gradiente es directamente el par de parámetros**.

      ### 2 · La condición del eje OX

      «Derivada direccional en el sentido positivo del eje $OX$» significa
      $u=(1,0)$:

      $$
      D_{u}f(0,0) = (a,b)\cdot(1,0) = a = 2
      $$

      ### 3 · La condición de paralelismo

      La recta $2x-y-1=0$ es $y=2x-1$: pendiente $2$, vector director
      $(1,2)$. Que el gradiente sea paralelo significa proporcional:

      $$
      \frac{a}{1} = \frac{b}{2}
      \quad\Longrightarrow\quad
      b = 2a = 4
      $$

      ### 4 · Comprobación

      Con $a=2$, $b=4$: $\nabla f(0,0)=(2,4)=2\,(1,2)$, paralelo a la recta
      ✓, y $f_x(0,0)=2$ ✓.

      **Lo que hay que llevarse.** El error clásico está en el vector de la
      recta: de $Ax+By+C=0$, los coeficientes $(A,B)$ dan la **normal** y
      $(-B,A)$ el **director**. Confundirlos aquí da $b=-1$, que es el
      distractor que más se marca.

  - id: donde-la-maxima-vale-cuatro
    titulo: Dónde la derivada máxima vale 4, y en qué punto apunta hacia arriba
    fuente: Ejercicio 6.15 · Problemas complementarios, tema 6 · Cálculo, UPV/EHU (2014/2015 4E)
    nivel: practica
    enunciado: |
      Dada la función $F(x,y)=2x^{2}+y^{2}$, calcular y representar
      gráficamente los puntos $(x,y)$ en los que la derivada direccional
      máxima vale $4$. Si se sabe además que la dirección en la que se da la
      derivada máxima es $v=(0,1)$, calcular las coordenadas del punto en el
      que sucede.
    pide: El lugar geométrico y el punto concreto.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuánto vale la derivada direccional **máxima** en un punto?
        opciones:
          - texto: >-
              $\lVert\nabla F\rVert$, y se alcanza en la dirección del propio
              gradiente
            correcta: true
            mensaje: |
              Eso es. Como $D_{u}F=\nabla F\cdot u=\lVert\nabla F\rVert\cos\theta$
              con $u$ unitario, el máximo es $\cos\theta=1$: la dirección del
              gradiente.
          - texto: >-
              La mayor de $F_x$ y $F_y$
            mensaje: |
              Esas son solo dos direcciones de infinitas. El máximo es el
              módulo del vector, que es mayor que cualquiera de sus
              componentes.
          - texto: >-
              $F_x+F_y$
            mensaje: |
              Eso sería $\nabla F\cdot(1,1)$ sin normalizar. El máximo es el
              módulo: $\sqrt{F_x^{2}+F_y^{2}}$.

      - tipo: calcular
        titulo: Un punto del lugar
        pregunta: |
          El lugar es $x^{2}+\dfrac{y^{2}}{4}=1$. Para $x=\tfrac12$ y $y>0$,
          ¿cuánto vale $y$?
        respuesta:
          tipo: numero
          valor: '1.7320508'
          tolerancia: 0.00002
          formato: con siete decimales
        distractores:
          - valor: '0.8660254'
            mensaje: |
              $\tfrac{\sqrt3}{2}$ saldría de $x^{2}+y^{2}=1$. Aquí el $y$ va
              dividido entre $4$, así que $y^{2}=4\left(1-x^{2}\right)$.
          - valor: '3'
            mensaje: |
              $3$ es $y^{2}$, no $y$. Falta la raíz.
        pista: |
          $y^{2} = 4\left(1-\tfrac14\right) = 3$.
        desarrollo: |
          $$
          \frac14 + \frac{y^{2}}{4} = 1
          \;\Longrightarrow\;
          y^{2} = 3
          \;\Longrightarrow\;
          y = \sqrt3 \approx 1{,}7320508
          $$

      - tipo: calcular
        titulo: La ordenada del punto
        pregunta: |
          Si la dirección de máximo crecimiento es $v=(0,1)$, el gradiente
          $(4x,2y)$ ha de ser $(0,\text{positivo})$. ¿Cuánto vale $y$ en ese
          punto?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '-2'
            mensaje: |
              $(0,-2)$ también está en la elipse, pero allí el gradiente es
              $(0,-4)$, que apunta hacia **abajo**: la dirección sería
              $(0,-1)$, no $(0,1)$.
          - valor: '1'
            mensaje: |
              Con $y=1$ el módulo del gradiente sería $2$, no $4$. Hay que
              imponer las dos condiciones a la vez.
        pista: |
          $4x=0$ obliga a $x=0$, y entonces la elipse da
          $\tfrac{y^{2}}{4}=1$.
        desarrollo: |
          $$
          \nabla F = (4x,\,2y) \parallel (0,1)
          \;\Longrightarrow\;
          4x=0 \;\Longrightarrow\; x=0
          $$

          Y en la elipse con $x=0$: $\tfrac{y^{2}}{4}=1$, o sea $y=\pm2$. El
          **sentido** $(0,1)$ obliga a $2y>0$: **$P(0,2)$**.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La derivada máxima es $\lVert\nabla F\rVert$, así que la
              condición es $\sqrt{16x^{2}+4y^{2}}=4$.
          - texto: >-
              Elevando al cuadrado y dividiendo entre $16$:
              $x^{2}+\tfrac{y^{2}}{4}=1$, una **elipse** de semiejes $1$ y $2$.
          - texto: >-
              El segundo dato añade la dirección: $\nabla F\parallel(0,1)$
              obliga a $x=0$, y el sentido descarta $y=-2$.
          - texto: >-
              Y como la elipse es curva de nivel de $F$, sobre ella $F$ vale
              siempre lo mismo.
            trampa: true
            mensaje: |
              No lo es. Sobre esa elipse lo constante es
              $\lVert\nabla F\rVert$, no $F$. De hecho $F(1,0)=2$ y
              $F(0,2)=4$: la función toma valores distintos en ella. Es un
              lugar de **pendiente** constante, no de altura constante.
        veredicto: |
          El primer dato da una curva entera —infinitos puntos— y el segundo
          selecciona uno. Conviene resolverlos en ese orden, porque la
          dirección solo tiene sentido una vez que se sabe dónde mirar.
      - tipo: dibujar
        consigna: |
          Dibuja en el plano $XY$ el lugar geométrico pedido y el punto concreto,
          con una flecha que indique la dirección del gradiente allí.
        comprueba:
          - punto: |
              Una **elipse** de semiejes $1$ en horizontal y $2$ en vertical,
              centrada en el origen.
            porque: |
              De $\lVert\nabla F\rVert=4$ sale $x^{2}+\tfrac{y^{2}}{4}=1$. Es más
              alta que ancha, al revés que las curvas de nivel de $F$, y
              confundirlas es el error del ejercicio.
          - punto: |
              El punto $P\left(0,2\right)$ marcado, en lo más alto de la elipse.
            porque: |
              La condición $\nabla F\parallel\left(0,1\right)$ obliga a $x=0$, y
              el **sentido** descarta $\left(0,-2\right)$.
          - punto: |
              La flecha del gradiente en $P$ apuntando hacia arriba, de módulo
              $4$.
            porque: |
              $\nabla F(0,2)=(0,4)$. Dibujar la flecha con su longitud a escala
              es lo que comprueba las dos condiciones a la vez.
          - punto: |
              El punto $\left(0,-2\right)$ marcado también, con su flecha hacia
              **abajo** y tachado.
            porque: |
              Está en el lugar geométrico pero no cumple el sentido. Dibujarlo y
              descartarlo explícitamente es la mitad de la justificación.
        veredicto: |
          La elipse es un lugar de **pendiente** constante, no de altura
          constante: sobre ella $F$ vale $2$ en $\left(1,0\right)$ y $4$ en
          $\left(0,2\right)$. Confundirla con una curva de nivel es el malentendido
          que el dibujo deshace.

    resolucion: |
      **Resultados.** El lugar es la elipse $x^{2}+\dfrac{y^{2}}{4}=1$, y el
      punto es $P(0,2)$.

      ### 1 · El lugar geométrico

      $$
      \nabla F = (4x,\,2y)
      \qquad
      \lVert\nabla F\rVert = \sqrt{16x^{2}+4y^{2}} = 4
      $$

      Elevando al cuadrado y dividiendo entre $16$:

      $$
      x^{2} + \frac{y^{2}}{4} = 1
      $$

      Una **elipse centrada en el origen**, de semieje $1$ en $x$ y semieje
      $2$ en $y$. Pasa por $(\pm1,0)$ y $(0,\pm2)$.

      ### 2 · Qué es esa elipse

      Es el conjunto de puntos donde la superficie $z=2x^{2}+y^{2}$ tiene
      **pendiente máxima igual a 4**. No es una curva de nivel: sobre ella $F$
      vale $2$ en $(1,0)$ y $4$ en $(0,2)$. Las curvas de nivel de $F$ son las
      elipses $2x^{2}+y^{2}=k$, que son otra familia — más achatadas, con la
      proporción al revés.

      Dentro de la elipse la pendiente máxima es menor que $4$; fuera, mayor.
      En el origen vale $0$, que es el mínimo de la función.

      ### 3 · El punto

      La dirección de máximo crecimiento es siempre la del gradiente. Que sea
      $(0,1)$ exige

      $$
      (4x,\,2y) = \lambda\,(0,1),\quad \lambda>0
      $$

      De la primera componente, $x=0$. Llevándolo a la elipse,
      $\tfrac{y^{2}}{4}=1$, o sea $y=\pm2$. Y $\lambda=2y>0$ descarta el
      negativo:

      $$
      \boxed{P(0,2)}
      $$

      Comprobación: $\nabla F(0,2)=(0,4)$, que tiene módulo $4$ ✓ y dirección
      $(0,1)$ ✓.

      ### 4 · El dibujo

      La elipse de semiejes $1$ y $2$, con $P$ marcado en su punto más alto y
      una flecha vertical saliendo de él. En $(0,-2)$ conviene dibujar la
      flecha contraria: mismo módulo, sentido opuesto, y por eso se descarta.

      **Lo que hay que llevarse.** «Derivada direccional máxima» es
      $\lVert\nabla F\rVert$ — una ecuación, no un valor — y por eso el primer
      apartado da una curva. Y cuando el enunciado da un **sentido**, hay que
      usarlo: es lo que distingue $(0,2)$ de $(0,-2)$, y olvidarlo deja el
      ejercicio a medias.

  - id: la-velocidad-que-sale-del-plano-tangente
    titulo: La velocidad de cambio, leída de un plano tangente
    fuente: Ejercicio 6.16 · Problemas complementarios, tema 6 · Cálculo, UPV/EHU (2019/2020 4E AT)
    nivel: practica
    enunciado: |
      Sea $f(x,y)$ una función que admite derivadas parciales continuas. Se
      sabe que el plano tangente a la superficie definida por $f(x,y)$ en el
      punto $P(1,2)$ es $2x+3y+4z=1$. Calcular la velocidad a la que cambia
      $f(x,y)$ si nos desplazamos desde $P$ hasta el punto $Q(3,4)$.
    pide: La derivada direccional de $f$ en $P$ hacia $Q$.
    pasos:
      - tipo: reconocer
        pregunta: |
          Del plano $2x+3y+4z=1$, ¿cómo se sacan $f_x$ y $f_y$ en $P$?
        opciones:
          - texto: >-
              Despejando $z$: los coeficientes de $x$ y de $y$ en
              $z=\tfrac{1-2x-3y}{4}$ **son** las dos parciales
            correcta: true
            mensaje: |
              Eso es. El plano tangente es
              $z=f(P)+f_x(x-1)+f_y(y-2)$, así que al escribirlo como
              $z=\alpha x+\beta y+\gamma$ resulta $f_x=\alpha$ y $f_y=\beta$.
          - texto: >-
              Son $2$ y $3$, los coeficientes tal como vienen
            mensaje: |
              Falta dividir entre $4$ y cambiar de signo al pasarlos al otro
              lado. Salen $-\tfrac12$ y $-\tfrac34$.
          - texto: >-
              No se pueden sacar sin conocer $f$
            mensaje: |
              El plano tangente **contiene** toda la información de primer
              orden de $f$ en el punto: eso es exactamente lo que es.

      - tipo: calcular
        titulo: La parcial respecto de y
        pregunta: |
          ¿Cuánto vale $f_y(1,2)$?
        respuesta:
          tipo: numero
          valor: '-0.75'
          tolerancia: 0.006
          formato: en forma exacta (-3/4) o con dos decimales
        distractores:
          - valor: '0.75'
            mensaje: |
              El signo. Al despejar, $3y$ pasa al otro lado como $-3y$, y luego
              se divide entre $4$.
          - valor: '-1.3333'
            mensaje: |
              $-\tfrac43$ es el inverso. El coeficiente es
              $-\tfrac{3}{4}$: el $3$ arriba y el $4$ abajo.
        pista: |
          $z = \dfrac{1-2x-3y}{4}$.
        desarrollo: |
          $$
          z = \frac14 - \frac{x}{2} - \frac{3y}{4}
          \quad\Longrightarrow\quad
          f_x(P)=-\frac12,\qquad f_y(P)=-\frac34
          $$

      - tipo: calcular
        titulo: La velocidad de cambio
        pregunta: |
          Con $\nabla f(P)=\left(-\tfrac12,-\tfrac34\right)$ y la dirección
          $\overrightarrow{PQ}=(2,2)$ normalizada, ¿cuánto vale la derivada
          direccional?
        respuesta:
          tipo: numero
          valor: '-0.8839'
          tolerancia: 0.002
          formato: con cuatro decimales
        distractores:
          - valor: '-1.25'
            mensaje: |
              $-1{,}25$ es $\nabla f\cdot(2,2)$ **sin normalizar**. Hay que
              dividir entre $\lVert(2,2)\rVert = 2\sqrt2$.
          - valor: '0.8839'
            mensaje: |
              El signo. Las dos parciales son negativas y las dos componentes
              de la dirección positivas: el producto escalar no puede salir
              positivo.
        pista: |
          $\dfrac{-\tfrac12-\tfrac34}{\sqrt2}$, porque el unitario de $(2,2)$
          es $\left(\tfrac{1}{\sqrt2},\tfrac{1}{\sqrt2}\right)$.
        desarrollo: |
          $$
          D_{u}f(P)
          = \left(-\frac12,-\frac34\right)\cdot
            \left(\frac{1}{\sqrt2},\frac{1}{\sqrt2}\right)
          = \frac{-\tfrac54}{\sqrt2}
          = -\frac{5}{4\sqrt2} \approx -0{,}8839
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El plano tangente escrito como $z=\alpha x+\beta y+\gamma$ tiene
              por coeficientes las dos parciales en el punto.
          - texto: >-
              Despejando, $\nabla f(1,2)=\left(-\tfrac12,-\tfrac34\right)$.
          - texto: >-
              La dirección es $\overrightarrow{PQ}=(2,2)$, unitaria
              $\left(\tfrac{1}{\sqrt2},\tfrac{1}{\sqrt2}\right)$, y la
              direccional sale $-\tfrac{5}{4\sqrt2}$: $f$ **decrece**.
          - texto: >-
              Y como $Q$ está a distancia $2\sqrt2$, la función baja
              $2\sqrt2\cdot0{,}8839 = 2{,}5$ al llegar a $Q$.
            trampa: true
            mensaje: |
              Eso solo valdría si $f$ fuese lineal. La derivada direccional es
              el ritmo **en $P$**, y $Q$ no está cerca: multiplicarla por la
              distancia da la bajada que habría sobre el **plano tangente**, no
              sobre la superficie. El enunciado pide la velocidad, no el valor
              en $Q$.
        veredicto: |
          El plano tangente da el gradiente de balde, y a partir de ahí es la
          derivada direccional de siempre. Lo que no da es el valor de $f$
          lejos del punto.
    resolucion: |
      **Resultado:**
      $D_{u}f(1,2) = -\dfrac{5}{4\sqrt2} = -\dfrac{5\sqrt2}{8}
      \approx -0{,}8839$. La función **decrece**.

      ### 1 · Leer el gradiente en el plano

      El plano tangente a $z=f(x,y)$ en $P$ es

      $$
      z = f(P) + f_x(P)\left(x-x_0\right) + f_y(P)\left(y-y_0\right)
      $$

      y por tanto, escrito en la forma $z=\alpha x+\beta y+\gamma$, los
      coeficientes $\alpha$ y $\beta$ **son** las parciales. Despejando el
      plano dado:

      $$
      4z = 1-2x-3y
      \quad\Longrightarrow\quad
      z = \frac14-\frac{x}{2}-\frac{3y}{4}
      $$

      $$
      \nabla f(1,2) = \left(-\frac12,\,-\frac34\right)
      $$

      *(De paso: $f(1,2)=\tfrac14-\tfrac12-\tfrac32=-\tfrac74$, que aquí no
      hace falta pero sale gratis.)*

      ### 2 · La dirección

      $$
      \overrightarrow{PQ} = (3-1,\,4-2) = (2,2),
      \qquad
      u = \left(\frac{1}{\sqrt2},\,\frac{1}{\sqrt2}\right)
      $$

      ### 3 · La velocidad

      $$
      D_{u}f(1,2)
      = -\frac12\cdot\frac{1}{\sqrt2} - \frac34\cdot\frac{1}{\sqrt2}
      = -\frac{5}{4\sqrt2}
      = -\frac{5\sqrt2}{8} \approx -0{,}8839
      $$

      Negativa: al salir de $P$ hacia $Q$, $f$ **disminuye** a razón de
      $0{,}88$ unidades por unidad de longitud.

      ### 4 · Lo que no se puede concluir

      Multiplicar $0{,}8839$ por la distancia $2\sqrt2\approx2{,}83$ daría
      $2{,}5$, y es tentador decir «luego $f(Q)\approx-1{,}75-2{,}5=-4{,}25$».
      **Eso es el valor del plano tangente en $Q$, no el de $f$.** Con $Q$ a
      casi tres unidades de $P$, la aproximación lineal ya no está garantizada.

      Comprobación de cordura: $\lVert\nabla f\rVert=\sqrt{\tfrac14+\tfrac9{16}}
      =\tfrac{\sqrt{13}}{4}\approx0{,}901$, y en efecto
      $0{,}8839\le0{,}901$. La dirección elegida está muy cerca de la de
      máximo decrecimiento, que sería $\left(\tfrac12,\tfrac34\right)$
      normalizada — de ahí que los dos números casi coincidan.

      **Lo que hay que llevarse.** Cuando el enunciado regala el plano
      tangente, está regalando el gradiente: se despeja $z$ y se leen los
      coeficientes. A partir de ahí, restar, normalizar y multiplicar
      escalarmente.
