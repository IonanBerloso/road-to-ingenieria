        <desc id="f-pt6-monte-d">Desde el punto (1,2) salen dos flechas: una hacia (2,2), que es la dirección del eje x, y otra hacia (1,1), que es la del eje y cambiada de signo. La primera da una direccional de dos, o sea la parcial respecto de x; la segunda da menos dos, o sea menos la parcial respecto de y. Con las dos parciales, el gradiente es (2,2) y apunta a cuarenta y cinco grados: la dirección de máxima subida.</desc>
