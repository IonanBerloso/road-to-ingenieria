        <title id="f-ej-gradiente-tres-t">El gradiente en el punto P, la circunferencia de nivel y la dirección de cambio nulo</title>
        <desc id="f-ej-gradiente-tres-d">Varias circunferencias concéntricas centradas en el origen son las curvas de nivel de la función. En el punto de coordenadas tres y cuatro, que está sobre una de ellas, nace una flecha que apunta hacia fuera en la dirección del radio: es el gradiente, y está rotulado con sus componentes, seis y ocho. Otra flecha, más corta y de otro color, sale del mismo punto perpendicular a la primera, tangente a la circunferencia: es la dirección en la que la función no cambia.</desc>
