  - id: ej-gradiente-al-reves
    titulo: El gradiente, deducido de dos direccionales
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      De una función $f$ se sabe que en el punto $P$ su derivada direccional en
      la dirección de $\vec{u}=\left(1,0\right)$ vale $3$, y en la de
      $\vec{v}=\left(0,1\right)$ vale $4$. Hallar el gradiente en $P$ y la
      derivada direccional máxima.
    pide: El gradiente y el valor de la derivada direccional máxima.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué relación hay entre una derivada direccional y el gradiente?
        opciones:
          - texto: La direccional es el producto escalar del gradiente por el vector unitario
            correcta: true
            mensaje: |
              Eso es, y es lo que permite ir al revés: cada direccional conocida
              da una ecuación lineal en las componentes del gradiente. Con dos
              datos, dos ecuaciones.
          - texto: La direccional es el módulo del gradiente
            mensaje: |
              El módulo del gradiente es la direccional **máxima**, que es un
              caso particular: el que sale cuando la dirección coincide con la
              del gradiente. En otra dirección vale menos.
          - texto: La direccional es la suma de las derivadas parciales
            mensaje: |
              Eso solo coincidiría con la dirección $\left(1,1\right)$ sin
              normalizar, que además no es unitaria. La relación general es un
              producto escalar.
      - tipo: calcular
        titulo: La direccional máxima
        pregunta: |
          Como $\vec{u}$ y $\vec{v}$ son los dos vectores de los ejes, las dos
          direccionales **son** las parciales: $\nabla f=\left(3,4\right)$.
          ¿Cuánto vale la derivada direccional máxima en $P$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '7'
            mensaje: |
              Has sumado las dos componentes. La direccional máxima es el
              **módulo** del gradiente, que se calcula con Pitágoras y no
              sumando.
          - valor: '12'
            mensaje: |
              Ese es el producto de las dos componentes, que no significa nada
              aquí. El módulo de $\left(3,4\right)$ es $\sqrt{9+16}$.
        pista: |
          La direccional máxima es $\left|\nabla f\right|$, y el gradiente es
          $\left(3,4\right)$: el triángulo más conocido que existe.
        desarrollo: |
          Como $\vec{u}=\left(1,0\right)$ y $\vec{v}=\left(0,1\right)$ ya son
          unitarios y apuntan según los ejes:

          $$
          D_{\vec{u}}f = \nabla f\cdot\left(1,0\right)=f_{x}=3,
          \qquad
          D_{\vec{v}}f = \nabla f\cdot\left(0,1\right)=f_{y}=4
          $$

          $$
          \nabla f\left(P\right)=\left(3,4\right)
          \;\Longrightarrow\;
          \left|\nabla f\right|=\sqrt{3^{2}+4^{2}}=5
          $$

          Esa es la derivada direccional máxima, y se alcanza en la dirección del
          propio gradiente, $\frac{1}{5}\left(3,4\right)$.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: Cada derivada direccional conocida es una ecuación, porque es el producto escalar del gradiente por un vector unitario.
          - texto: Con las direcciones de los ejes, esos productos escalares son directamente las derivadas parciales.
          - texto: El gradiente en $P$ es, por tanto, $\left(3,4\right)$.
          - texto: La direccional máxima es su módulo, $5$, y se alcanza en la dirección del gradiente.
          - texto: Si las dos direcciones dadas no fuesen perpendiculares, el problema no tendría solución.
            trampa: true
            mensaje: |
              Sí la tiene: con dos direcciones cualesquiera que no sean
              paralelas, los dos productos escalares forman un sistema de dos
              ecuaciones con dos incógnitas que se resuelve igual. Lo que hace
              fácil este caso es que las direcciones sean las de los ejes, no que
              sean perpendiculares.
    resolucion: |
      Este escalón es el **problema inverso** del gradiente: en vez de derivar
      para obtener direccionales, se dan direccionales y se busca el gradiente.

      La herramienta es una sola igualdad, usada al revés:

      $$
      D_{\vec{u}}f = \nabla f\cdot \vec{u}
      \qquad\text{con }\vec{u}\text{ unitario}
      $$

      Cada dato es **una ecuación lineal** en $f_{x}$ y $f_{y}$. Con dos datos
      hay dos ecuaciones y el sistema se resuelve.

      Aquí el caso es el más fácil posible, porque las direcciones son las de los
      ejes y entonces las direccionales **son** las parciales:

      $$
      \nabla f=\left(3,4\right),
      \qquad
      \left|\nabla f\right|=5
      $$

      Con direcciones cualesquiera —no paralelas entre sí— el método es el mismo;
      solo cambia que hay que normalizarlas antes y resolver un sistema de dos
      por dos en vez de leer las componentes directamente.

      <figure class="figura-examen">
      <svg viewBox="0 0 320 275" role="img" width="320" height="275"
           aria-labelledby="f-ej-gradiente-al-reves-t f-ej-gradiente-al-reves-d">
