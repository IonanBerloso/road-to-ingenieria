        <desc id="f-ej-gradiente-al-reves-d">Del origen salen dos flechas cortas sobre los ejes, una horizontal y otra vertical, de longitud uno: son las dos direcciones del enunciado, y llevan escritos los valores tres y cuatro que toman en ellas las derivadas direccionales. Una tercera flecha, más larga y de trazo grueso, va del origen al punto tres coma cuatro: es el gradiente. Dos líneas de puntos bajan de su extremo a los ejes, en el tres y en el cuatro, mostrando que sus componentes son exactamente aquellos dos valores.</desc>
