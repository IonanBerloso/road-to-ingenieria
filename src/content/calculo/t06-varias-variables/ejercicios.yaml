  - id: ej-plano-tangente-y-aproximar
    titulo: El plano tangente, y aproximar con él
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Dada $f\left(x,y\right)=x^{2}+y^{2}$, escribir el plano tangente a su
      gráfica en el punto $\left(1,1\right)$ y usarlo para aproximar
      $f\left(1{,}1;\,0{,}9\right)$.
    pide: La ecuación del plano tangente y el valor aproximado.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace falta para escribir el plano tangente en un punto?
        opciones:
          - texto: El valor de la función y sus dos derivadas parciales en ese punto
            correcta: true
            mensaje: |
              Eso es: tres números. El valor da la altura y las dos parciales dan
              las dos pendientes, que es todo lo que un plano necesita.
          - texto: Las tres derivadas segundas
            mensaje: |
              Las segundas hacen falta para la aproximación **cuadrática** o para
              clasificar un punto crítico. Para el plano tangente, que es la
              aproximación lineal, bastan las primeras.
          - texto: La ecuación de la curva de nivel que pasa por el punto
            mensaje: |
              La curva de nivel dice por dónde la función no cambia, que es una
              de las direcciones del plano. Pero el plano necesita también cuánto
              sube en la otra, y eso no está en la curva de nivel.
      - tipo: calcular
        titulo: La aproximación
        pregunta: |
          Con $f\left(1,1\right)=2$ y $\nabla f\left(1,1\right)=\left(2,2\right)$,
          el plano es $z = 2 + 2\left(x-1\right)+2\left(y-1\right)$. ¿Qué valor
          aproximado da en $\left(1{,}1;\,0{,}9\right)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número, con dos decimales si hace falta
        distractores:
          - valor: '2.02'
            mensaje: |
              Ese es el valor **exacto**, $1{,}1^{2}+0{,}9^{2}=2{,}02$. El plano
              da $2$: la diferencia de dos centésimas es justo el error de la
              aproximación lineal.
          - valor: '2.4'
            mensaje: |
              Has sumado los dos incrementos con el mismo signo. Uno vale $+0{,}1$
              y el otro $-0{,}1$, así que se cancelan.
        pista: |
          Sustituye $x=1{,}1$ e $y=0{,}9$ en el plano. Los dos incrementos son
          iguales y de signo contrario.
        desarrollo: |
          $$
          z = 2 + 2\left(1{,}1-1\right)+2\left(0{,}9-1\right)
          = 2 + 2\left(0{,}1\right) + 2\left(-0{,}1\right)
          = 2
          $$

          El valor exacto es $1{,}1^{2}+0{,}9^{2}=1{,}21+0{,}81=2{,}02$, así que
          la aproximación se equivoca en dos centésimas. Y ese error es de
          **segundo orden**: al alejarse el doble del punto, se multiplica por
          cuatro.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'El plano tangente necesita tres números: el valor de la función y sus dos parciales en el punto.'
          - texto: Aquí valen $f=2$ y $\nabla f=\left(2,2\right)$, así que el plano es $z=2+2(x-1)+2(y-1)$.
          - texto: Aproximar es sustituir las coordenadas nuevas en la ecuación del plano.
          - texto: 'Sale $2$, frente al valor exacto $2{,}02$: el error es de dos centésimas.'
          - texto: La aproximación es exacta, porque el plano toca la superficie en ese punto.
            trampa: true
            mensaje: |
              Es exacta **solo** en el punto de tangencia. Al moverse, el plano y
              la superficie se separan, y esa separación es el error de la
              aproximación lineal. Si fuese exacta en todas partes, la superficie
              sería un plano.
    resolucion: |
      El plano tangente es la **aproximación lineal** de una función de dos
      variables, y se construye con tres números:

      $$
      z = f\left(a,b\right)
      + f_{x}\left(a,b\right)\left(x-a\right)
      + f_{y}\left(a,b\right)\left(y-b\right)
      $$

      Aquí $f\left(1,1\right)=2$, $f_{x}=2x=2$ y $f_{y}=2y=2$, así que

      $$
      z = 2 + 2\left(x-1\right) + 2\left(y-1\right) = 2x+2y-2
      $$

      **Aproximar es sustituir en el plano**, no en la función. En
      $\left(1{,}1;\,0{,}9\right)$ los dos incrementos se cancelan y da
      exactamente $2$, frente al valor real $2{,}02$.

      Esas dos centésimas son el error, y tiene una propiedad que conviene
      conocer: es de **segundo orden**. Al doble de distancia del punto de
      tangencia, el error se multiplica por cuatro — por eso la aproximación
      lineal solo sirve cerca.

      <figure class="figura-examen">
      <svg viewBox="0 0 330 235" role="img" width="330" height="235"
           aria-labelledby="f-ej-plano-tangente-t f-ej-plano-tangente-d">
        <title id="f-ej-plano-tangente-t">El corte por y = 1: la parábola y la recta tangente que la aproxima</title>
        <desc id="f-ej-plano-tangente-d">Cortando la superficie por el plano y igual a uno queda la parábola z igual a x al cuadrado más uno. Su tangente en x igual a uno es la recta z igual a dos más dos por x menos uno. En x igual a uno coma uno la parábola vale 2,21 y la recta 2,20: la diferencia es una centésima, y ese hueco es exactamente el error de la aproximación.</desc>
