  - id: ej-limite-dos-variables-por-caminos
    titulo: Un límite que depende del camino
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Estudiar si existe
      $$
      \lim_{\left(x,y\right)\to\left(0,0\right)}\frac{xy}{x^{2}+y^{2}}
      $$
    pide: Si el límite existe, y la demostración.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace falta para demostrar que un límite en dos variables NO existe?
        opciones:
          - texto: Encontrar dos caminos por los que salga distinto
            correcta: true
            mensaje: |
              Eso es, y basta con dos. El límite, si existe, tiene que valer lo
              mismo acercándose por cualquier sitio; si dos caminos discrepan, ya
              está demostrado que no hay límite.
          - texto: Probar por muchas rectas y ver que siempre sale lo mismo
            mensaje: |
              Eso no demuestra nada en el sentido bueno: aunque todas las rectas
              coincidan, puede haber una parábola por la que salga otra cosa. Las
              rectas sirven para **negar**, nunca para afirmar.
          - texto: Comprobar que la función no está definida en el origen
            mensaje: |
              No estar definida en el punto es lo normal en un límite: el límite
              habla de lo que pasa **cerca**, no en el punto. Eso solo no dice si
              existe o no.
      - tipo: calcular
        titulo: El límite por la recta y = x
        pregunta: |
          Sustituyendo $y=x$ y simplificando, ¿a qué valor tiende la expresión?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.001
          formato: en forma exacta, o con dos decimales
        distractores:
          - valor: '0'
            mensaje: |
              El $0$ es lo que sale por los ejes, por ejemplo con $y=0$. Justo por
              eso el límite no existe: por los ejes da $0$ y por la diagonal da
              otra cosa.
          - valor: '1'
            mensaje: |
              Te ha faltado sumar los dos términos del denominador. Con $y=x$
              queda $\frac{x^{2}}{x^{2}+x^{2}}=\frac{x^{2}}{2x^{2}}$.
        pista: |
          Sustituye $y=x$ en numerador y denominador y simplifica el $x^{2}$
          antes de hacer tender nada.
        desarrollo: |
          **Por la recta $y=x$**:

          $$
          \frac{x\cdot x}{x^{2}+x^{2}}=\frac{x^{2}}{2x^{2}}=\frac{1}{2}
          $$

          constante, así que el límite por ese camino es $\frac{1}{2}$.

          **Por el eje $y=0$**:

          $$
          \frac{x\cdot 0}{x^{2}+0}=0
          $$

          Dos caminos, dos valores distintos: el límite **no existe**.

          En general, con $y=mx$ sale $\frac{m}{1+m^{2}}$, que depende de $m$ —y
          eso solo ya es la demostración completa.
      - tipo: justificar
        pregunta: |
          Ordena la demostración. Una pieza es falsa.
        piezas:
          - texto: Si el límite existiera, tendría que valer lo mismo por cualquier camino que llegue al origen.
          - texto: Por el eje $y=0$ la expresión vale $0$ en todo el camino.
          - texto: Por la recta $y=x$ vale $\frac{1}{2}$ en todo el camino.
          - texto: Dos caminos dan valores distintos, luego el límite no existe.
          - texto: Como por las rectas $y=mx$ sale siempre el mismo valor, el límite existe y vale eso.
            trampa: true
            mensaje: |
              Doblemente falso. Aquí por las rectas **no** sale siempre lo mismo:
              sale $\frac{m}{1+m^{2}}$, que depende de la recta. Y aunque saliera
              lo mismo, no bastaría: las rectas son infinitos caminos, pero no
              todos los caminos.
    resolucion: |
      En una variable solo hay dos formas de acercarse a un punto; en dos hay
      infinitas, y el límite existe solo si **todas** dan lo mismo. Eso hace que
      negar sea fácil y afirmar sea difícil.

      **Dos caminos bastan para negar.**

      $$
      \text{por } y=0:\quad \frac{x\cdot 0}{x^{2}}=0
      \qquad\qquad
      \text{por } y=x:\quad \frac{x^{2}}{2x^{2}}=\frac{1}{2}
      $$

      Como $0\neq\frac{1}{2}$, el límite no existe. Y escribiéndolo con la
      familia entera de rectas, $y=mx$ da $\frac{m}{1+m^{2}}$: **queda la $m$
      dentro**, que es la señal de que se ha terminado.

      **Lo que no vale**: probar muchas rectas, ver que coinciden, y concluir que
      el límite existe. Hay funciones donde todas las rectas dan $0$ y una
      parábola da otra cosa. Las rectas sirven para negar; para afirmar hacen
      falta coordenadas polares o una acotación.

      <figure class="figura-examen">
      <svg viewBox="0 0 320 275" role="img" width="320" height="275"
           aria-labelledby="f-ej-limite-por-caminos-t f-ej-limite-por-caminos-d">
        <title id="f-ej-limite-por-caminos-t">Varias rectas de acercamiento al origen, cada una con el valor que da el cociente</title>
        <desc id="f-ej-limite-por-caminos-d">Del origen salen cuatro rectas con pendientes distintas, dibujadas con trazo fino y con una flecha que apunta hacia el origen: son los caminos por los que uno se puede acercar. Junto al extremo de cada una está escrito el valor que toma el cociente a lo largo de ella: cero por el eje horizontal, un medio por la bisectriz, cuatro décimas por la de pendiente dos y menos un medio por la de pendiente menos uno. Como los valores no coinciden, el límite no existe.</desc>
