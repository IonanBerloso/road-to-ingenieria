ejercicios:
  # ═══════════════════════════════════════════════════════════════════
  # Ejemplos introductorios del tema 6. Nuestros, no de examen ni del boletín.
  # El boletín de este tema empieza directamente en «calcula las derivadas
  # parciales de estas seis funciones», y el examen pregunta otra cosa: el
  # gradiente aplicado. Estos cuatro son el puente.
  # ═══════════════════════════════════════════════════════════════════

  - id: ej-leer-un-mapa-de-niveles
    titulo: Un mapa de niveles, sin conocer la función
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería. Prepara el hueco de leer un
      mapa de nivel, que cae en tres convocatorias —2016-2017 ordinaria,
      2018-2019 extraordinaria y el mapa del Mauna Kea de 2025-2026— y no
      tenía ninguna rampa: era el único tema con ejemplos y sin una sola
      figura. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      El mapa de abajo son las curvas de nivel de una función $f(x,y)$ que
      **no se conoce**. Cada curva lleva escrito el valor de $f$ sobre ella.

      <figure>
      <svg viewBox="10 20 250 170" role="img" aria-labelledby="t6nivT t6nivD">
        <title id="t6nivT">Un mapa de cuatro curvas de nivel, más juntas por la derecha</title>
        <desc id="t6nivD">Cuatro curvas cerradas encajadas una dentro de otra, rotuladas 10, 20, 30 y 40 de fuera hacia dentro. Las curvas están más separadas por la izquierda que por la derecha. Hay un punto marcado con la letra P sobre el lado derecho, entre la curva 20 y la 30.</desc>

        <ellipse cx="130" cy="105" rx="105" ry="66" fill="none" stroke="var(--live)" stroke-width="1.4"></ellipse>
        <ellipse cx="138" cy="105" rx="72" ry="48" fill="none" stroke="var(--live)" stroke-width="1.4"></ellipse>
        <ellipse cx="145" cy="105" rx="42" ry="30" fill="none" stroke="var(--live)" stroke-width="1.4"></ellipse>
        <ellipse cx="150" cy="105" rx="18" ry="14" fill="none" stroke="var(--live)" stroke-width="1.8"></ellipse>

        <text x="18" y="108" font-size="10" fill="var(--faint)" font-family="var(--mono)">10</text>
        <text x="59" y="108" font-size="10" fill="var(--faint)" font-family="var(--mono)">20</text>
        <text x="96" y="108" font-size="10" fill="var(--faint)" font-family="var(--mono)">30</text>
        <text x="143" y="108" font-size="10" fill="var(--faint)" font-family="var(--mono)">40</text>

        <circle cx="198" cy="105" r="3.5" fill="var(--alt)"></circle>
        <text x="203" y="101" font-size="11" fill="var(--alt)" font-family="var(--mono)">P</text>

        <text x="30" y="34" font-size="9.5" fill="var(--graphite)" font-family="var(--mono)">más separadas</text>
        <text x="192" y="34" font-size="9.5" fill="var(--graphite)" font-family="var(--mono)">más juntas</text>
      </svg>
      <figcaption>Cuatro curvas de nivel de una función desconocida. Todo lo que se pregunta se lee de su forma y de su separación.</figcaption>
      </figure>

      Medido sobre el mapa: entre dos curvas consecutivas hay unos
      $0{,}5$ km por el lado derecho y unos $0{,}8$ km por el izquierdo.

      a) ¿Hacia dónde apunta $\nabla f$ en el punto $P$?

      b) ¿Dónde es mayor $\lVert\nabla f\rVert$, en la zona de la izquierda o
      en la de la derecha?

      c) Estima $\lVert\nabla f\rVert$ en $P$.
    pide: La dirección del gradiente en P, dónde es mayor su módulo y cuánto vale ahí.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué relación hay entre el gradiente y la curva de nivel que pasa por
          un punto?
        opciones:
          - texto: >-
              El gradiente es **perpendicular** a la curva de nivel, y apunta
              hacia donde $f$ crece
            correcta: true
            mensaje: |
              Eso es, y es la propiedad que hace que un mapa se pueda leer sin
              fórmula. A lo largo de la curva $f$ no cambia, así que la
              derivada direccional en esa dirección es cero — y el gradiente,
              que mide el cambio máximo, tiene que ser perpendicular a ella.
          - texto: >-
              Es **tangente** a la curva de nivel
            mensaje: |
              Tangente a la curva es la dirección en la que $f$ **no cambia**:
              ahí la derivada direccional vale cero. El gradiente es justo la
              contraria, la de máximo cambio.
          - texto: >-
              Depende de la función, y sin conocerla no se puede decir
            mensaje: |
              No depende: es perpendicular a la curva de nivel **siempre**, sea
              cual sea $f$. Por eso estos enunciados se atreven a no dar la
              función.

      - tipo: reconocer
        pregunta: |
          $P$ está entre la curva 20 y la 30, en el lado derecho. ¿Hacia dónde
          apunta $\nabla f(P)$?
        opciones:
          - texto: >-
              Hacia dentro, perpendicular a la curva, en la dirección de la
              curva 30 y del centro
            correcta: true
            mensaje: |
              Exacto: perpendicular a la curva y **hacia los valores mayores**,
              que aquí están hacia dentro porque los rótulos crecen del 10 al
              40 según nos acercamos al centro.
          - texto: >-
              Hacia fuera, perpendicular a la curva
            mensaje: |
              Esa es la dirección en la que $f$ **decrece**: es $-\nabla f$.
              Los rótulos van del 10 por fuera al 40 por dentro, así que crecer
              es ir hacia dentro.
          - texto: >-
              Hacia el centro exacto del mapa, en línea recta
            mensaje: |
              Casi, y por eso es el error fino de este ejercicio: el gradiente
              es perpendicular **a la curva de nivel**, no una recta al centro.
              Solo coinciden si las curvas son circunferencias concéntricas, y
              aquí no lo son — están desplazadas.

      - tipo: reconocer
        pregunta: |
          Por la derecha las curvas están más juntas que por la izquierda.
          ¿Dónde es mayor $\lVert\nabla f\rVert$?
        opciones:
          - texto: >-
              En la derecha: la misma diferencia de altura en menos distancia
              es más pendiente
            correcta: true
            mensaje: |
              Eso es todo el razonamiento. Entre dos curvas consecutivas $f$
              cambia siempre lo mismo —diez— así que donde ese salto se recorre
              en menos espacio, el cambio por unidad de longitud es mayor.
          - texto: >-
              En la izquierda, porque hay más curvas visibles
            mensaje: |
              Hay las mismas cuatro a los dos lados. Lo que cambia es la
              **separación**, y estar más separadas significa subir lo mismo en
              más distancia: menos pendiente.
          - texto: >-
              Es igual en las dos: el gradiente solo depende del nivel
            mensaje: |
              El gradiente cambia de un punto a otro. Dos puntos sobre la misma
              curva de nivel tienen el mismo valor de $f$ y pueden tener
              gradientes muy distintos — es justo lo que este mapa enseña.

      - tipo: calcular
        titulo: Cuánto vale el gradiente en P
        pregunta: |
          $P$ está en el lado derecho, donde entre dos curvas consecutivas hay
          unos $0{,}5$ km y $f$ cambia 10. Estima $\lVert\nabla f\rVert$ ahí,
          en unidades por kilómetro.
        respuesta:
          tipo: numero
          valor: '20'
          tolerancia: 0.5
          formato: un número
        distractores:
          - valor: '5'
            mensaje: |
              Has multiplicado en vez de dividir: $10 \cdot 0{,}5$. El
              gradiente es cambio **por unidad de distancia**, así que la
              distancia va debajo.
          - valor: '12.5'
            mensaje: |
              Ese es el valor del lado **izquierdo**, con sus $0{,}8$ km. $P$
              está a la derecha, donde las curvas están más juntas y la
              pendiente es mayor.
          - valor: '10'
            mensaje: |
              Ese es $\Delta f$, el salto entre dos curvas, y es el mismo en
              todo el mapa. El gradiente no es ese salto: es ese salto dividido
              entre lo que cuesta recorrerlo.
        pista: |
          Pendiente = lo que sube entre lo que avanza.
        desarrollo: |
          $$
          \lVert\nabla f\rVert \approx \frac{\Delta f}{\Delta s}
          = \frac{10}{0{,}5} = 20 \ \text{unidades/km}
          $$

          Y de paso queda la comparación con el otro lado, que es la respuesta
          del apartado b) con número: $10/0{,}8 = 12{,}5$, bastante menos.

          Es una **estimación**, no un valor exacto: el gradiente cambia de un
          punto a otro y esto es la pendiente media entre dos curvas. El examen
          pide exactamente eso, y por eso el enunciado dice «unos 0,5 km».

      - tipo: justificar
        pregunta: Ordena la lectura del mapa. Una pieza es falsa.
        piezas:
          - texto: >-
              Sobre una curva de nivel $f$ es constante, así que la derivada
              direccional a lo largo de ella vale cero.
          - texto: >-
              Por eso el gradiente es perpendicular a la curva, y apunta hacia
              los rótulos mayores: hacia dentro.
          - texto: >-
              Entre dos curvas consecutivas $f$ cambia siempre 10, así que
              donde están más juntas la pendiente es mayor: la derecha.
          - texto: >-
              Como todos los puntos de la curva 20 valen lo mismo, el gradiente
              es el mismo en todos ellos.
            trampa: true
            mensaje: |
              Valer lo mismo no es cambiar igual. En el lado derecho la curva
              20 está pegada a la 30 y en el izquierdo está lejos, así que el
              gradiente es mucho mayor a la derecha aunque $f$ valga 20 en los
              dos sitios. Confundir el **valor** con la **variación** es el
              error que este mapa está diseñado para enseñar.
        veredicto: |
          Ese es el reparto: los rótulos dicen cuánto vale $f$ y la
          **separación** dice cuánto cambia. Son dos lecturas distintas del
          mismo dibujo.
    resolucion: |
      **No hace falta la función.** Las dos preguntas se contestan con una sola
      propiedad y una sola observación.

      ### a) La dirección del gradiente en $P$

      A lo largo de una curva de nivel $f$ es constante, así que la derivada
      direccional en la dirección tangente vale cero:

      $$
      D_{\vec u}f = \nabla f \cdot \vec u = 0
      \quad\Longrightarrow\quad
      \nabla f \perp \text{curva de nivel}
      $$

      Y de las dos perpendiculares posibles, el gradiente apunta hacia donde
      $f$ **crece**. Los rótulos van del 10 por fuera al 40 por dentro, así que
      en $P$ apunta **hacia dentro**, perpendicular a la curva que pasa por él.

      Ojo al matiz: perpendicular **a la curva**, no en línea recta al centro.
      Coincidirían solo si el mapa fuesen circunferencias concéntricas.

      ### b) Dónde es mayor el módulo

      Entre dos curvas consecutivas $f$ cambia siempre lo mismo, 10. Lo único
      que cambia es la distancia que hay que recorrer para ese salto:

      | lado | separación entre curvas | $\lVert\nabla f\rVert \approx 10/\Delta s$ |
      |---|---|---|
      | izquierda | $0{,}8$ km | $12{,}5$ |
      | derecha | $0{,}5$ km | $\mathbf{20}$ |

      Con $\Delta f$ fijo, el módulo es tanto mayor cuanto menor es $\Delta s$.
      **En la derecha**, y ahí vale unas 20 unidades por kilómetro.

      ### c) El valor en $P$

      $$
      \lVert\nabla f(P)\rVert \approx \frac{\Delta f}{\Delta s}
      = \frac{10}{0{,}5} = 20
      $$

      Es una **estimación**: el gradiente cambia punto a punto y esto es la
      pendiente media entre dos curvas. Es lo que el examen pide, y por eso el
      enunciado da la distancia con un «unos».

      **Lo que hay que llevarse.** Un mapa de niveles se lee dos veces: los
      rótulos dicen **cuánto vale** $f$ y la separación dice **cuánto cambia**.
      Es la misma distinción que en un mapa de montaña — la cota y la
      pendiente— y es lo que estos enunciados comprueban al no darte la
      función.

  - id: ej-curva-de-nivel-basica
    titulo: La curva de nivel que pasa por un punto
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Para $f(x,y) = x^{2} + y$, encontrar la ecuación de la curva de nivel que
      pasa por el punto $P(-1,1)$.
    pide: La ecuación de la curva de nivel por P.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es una curva de nivel de $f(x,y)$?
        opciones:
          - texto: El conjunto de puntos donde la función vale una constante
            correcta: true
            mensaje: |
              Eso es. Cortas el paisaje con un plano horizontal y te quedas con
              el borde: una ecuación en $x$ e $y$, **sin** $z$.
          - texto: La gráfica de la función en tres dimensiones
            mensaje: |
              Esa es la superficie entera. La curva de nivel es solo un corte
              suyo a una altura fija, y vive en el plano.
          - texto: La recta tangente a la superficie en un punto
            mensaje: |
              Eso es otra cosa, y además con dos variables la tangente es un
              plano, no una recta. Una curva de nivel no toca la superficie:
              es su sombra a una altura.
      - tipo: calcular
        titulo: El valor de la constante
        pregunta: |
          ¿Cuánto vale $k = f(-1,1)$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Parece que has hecho $(-1)^{2}$ como $-1$. Un cuadrado nunca es
              negativo: $(-1)^{2} = 1$, y $1+1=2$.
          - valor: '-1'
            mensaje: |
              Has sustituido la $x$ pero no has elevado al cuadrado. La función
              es $x^{2}+y$, no $x+y$.
        pista: |
          Sustituye $x=-1$ e $y=1$ en $x^{2}+y$. Cuidado con el cuadrado.
        desarrollo: |
          $$
          k = f(-1,1) = (-1)^{2} + 1 = 1 + 1 = 2
          $$

          La curva de nivel que buscamos es la de altura $2$.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: Se evalúa la función en el punto, y sale $k = 2$.
          - texto: La curva de nivel es $x^{2} + y = 2$.
          - texto: 'Despejada, es la parábola $y = 2 - x^{2}$: una parábola hacia abajo.'
          - texto: Es una ecuación en $x$ e $y$ sin $z$, porque vive en el plano del mapa.
          - texto: Como el punto tiene $y=1$, la curva de nivel es la recta $y=1$.
            trampa: true
            mensaje: |
              La curva de nivel no es una de las coordenadas del punto: es el
              conjunto entero de puntos que comparten altura con él. Aquí es
              una parábola, y el punto $P$ es solo uno de sus infinitos puntos.
    resolucion: |
      **El procedimiento entero son dos pasos**, y el primero es el que se
      olvida: hay que saber a qué altura estamos antes de poder escribir la
      curva.

      **Paso 1 — la altura.** Se evalúa la función en el punto:

      $$
      k = f(-1,1) = (-1)^{2} + 1 = 2
      $$

      **Paso 2 — la ecuación.** Se iguala la función a esa altura:

      $$
      x^{2} + y = 2
      \qquad\Longleftrightarrow\qquad
      y = 2 - x^{2}
      $$

      Es una parábola con las ramas hacia abajo y vértice en $(0,2)$. Y una
      comprobación que cuesta cinco segundos: $P(-1,1)$ tiene que estar en
      ella, y en efecto $2-(-1)^{2} = 1$. ✓

  - id: ej-parcial-con-y-congelada
    titulo: Una derivada parcial, con la otra variable congelada
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Calcular $f_x$ y $f_y$ para $f(x,y) = x^{3}y^{2} + 4y$.
    pide: Las dos derivadas parciales de primer orden.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al derivar respecto de $x$, ¿qué se hace con la $y$?
        opciones:
          - texto: Se trata como si fuera un número cualquiera
            correcta: true
            mensaje: |
              Exacto. Derivar parcialmente respecto de $x$ es preguntarse cómo
              cambia la función moviéndote solo hacia el este, con la $y$
              congelada. La $y$ se comporta como un $7$.
          - texto: Se deriva también, aplicando la regla del producto
            mensaje: |
              Eso sería derivar respecto de las dos a la vez, que no es lo que
              significa $\partial/\partial x$. La regla del producto se usa si
              hay dos factores **que dependen de $x$**.
          - texto: Se sustituye por cero
            mensaje: |
              Cuidado: eso es lo que le pasa a la **derivada** de una constante,
              no a la constante. Si $y$ es como un $7$, entonces $x^{3}y^{2}$ es
              como $49x^{3}$, y su derivada no es cero.
      - tipo: calcular
        titulo: Evaluar la parcial respecto de x
        pregunta: |
          Con $f_x = 3x^{2}y^{2}$, ¿cuánto vale $f_x(1,2)$?
        respuesta:
          tipo: numero
          valor: '12'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '6'
            mensaje: |
              Parece que has puesto $y$ en vez de $y^{2}$: sería
              $3\cdot 1\cdot 2 = 6$. El exponente del $y^{2}$ no se toca al
              derivar respecto de $x$.
          - valor: '24'
            mensaje: |
              Has derivado de más. $f_x = 3x^{2}y^{2}$, y en $(1,2)$ eso es
              $3\cdot 1\cdot 4 = 12$. Un $24$ sale de duplicar en algún sitio.
        pista: |
          Sustituye $x=1$ e $y=2$ en $3x^{2}y^{2}$. El $y^{2}$ vale 4.
        desarrollo: |
          $$
          f_x(1,2) = 3\cdot 1^{2}\cdot 2^{2} = 3\cdot 4 = 12
          $$
      - tipo: calcular
        titulo: Y la parcial respecto de y
        pregunta: |
          ¿Cuánto vale $f_y(1,2)$, sabiendo que $f_y = 2x^{3}y + 4$?
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              Te has dejado el término $2x^{3}y$, que en $(1,2)$ vale 4. El $+4y$
              aporta su 4, pero no es lo único.
          - valor: '12'
            mensaje: |
              Parece que has derivado $4y$ como $4y$ en vez de como $4$. La
              derivada de $4y$ respecto de $y$ es la constante 4.
        pista: |
          $2x^{3}y$ en $(1,2)$ vale 4, y hay que sumarle el 4 del último término.
        desarrollo: |
          $$
          f_y(1,2) = 2\cdot 1^{3}\cdot 2 + 4 = 4 + 4 = 8
          $$

          Fíjate en la asimetría: al derivar respecto de $y$, el término $4y$
          sí aporta; al derivar respecto de $x$ desaparece, porque para la $x$
          es una constante.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: Para $f_x$, la $y$ se congela; $x^{3}y^{2}$ deriva a $3x^{2}y^{2}$.
          - texto: El término $4y$ es constante para la $x$, así que desaparece en $f_x$.
          - texto: Para $f_y$, la $x$ se congela; $x^{3}y^{2}$ deriva a $2x^{3}y$.
          - texto: Y el término $4y$ sí aporta en $f_y$, con su 4.
          - texto: Como hay un producto $x^{3}y^{2}$, hace falta la regla del producto en las dos.
            trampa: true
            mensaje: |
              No hace falta. La regla del producto se usa cuando **los dos**
              factores dependen de la variable respecto de la que derivas. Aquí,
              al derivar en $x$, el factor $y^{2}$ es constante: es un producto
              por un número, no un producto de dos funciones.
    resolucion: |
      **La única idea del ejercicio**: derivar parcialmente no es una regla
      nueva. Son las reglas de siempre con una letra haciendo de número.

      $$
      f(x,y) = x^{3}y^{2} + 4y
      $$

      **Respecto de $x$** (la $y$ es un número):

      $$
      f_x = 3x^{2}y^{2} + 0 = 3x^{2}y^{2}
      $$

      El $4y$ se va porque, mirado desde la $x$, es una constante.

      **Respecto de $y$** (la $x$ es un número):

      $$
      f_y = 2x^{3}y + 4
      $$

      **Evaluadas en $(1,2)$:** $f_x = 12$ y $f_y = 8$. Puestas juntas forman el
      gradiente, $\nabla f(1,2) = (12,8)$ — que es de lo que va el resto del
      tema.

  - id: ej-gradiente-tres-preguntas
    titulo: El gradiente contesta tres preguntas de golpe
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Sea $f(x,y) = x^{2} + y^{2}$, y el punto $P(3,4)$. Calcular el gradiente
      en $P$, la velocidad máxima de cambio, y una dirección en la que la
      función no cambie.
    pide: El gradiente, su módulo y una dirección de cambio nulo.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dirección indica el vector gradiente en un punto?
        opciones:
          - texto: Aquella en la que la función crece más rápido
            correcta: true
            mensaje: |
              Sí. Y su módulo dice **cuánto** crece: es la velocidad de ese
              crecimiento máximo.
          - texto: Aquella en la que la función no cambia
            mensaje: |
              Justo la perpendicular. La dirección de cambio nulo es la tangente
              a la curva de nivel, y el gradiente es perpendicular a ella.
          - texto: La tangente a la superficie en el punto
            mensaje: |
              La tangente a la superficie es un **plano**, no un vector. El
              gradiente vive en el plano del mapa, no en el espacio.
      - tipo: calcular
        titulo: El módulo del gradiente
        pregunta: |
          Con $\nabla f(3,4) = (6,8)$, ¿cuánto vale la velocidad máxima de
          cambio en $P$?
        respuesta:
          tipo: numero
          valor: '10'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '14'
            mensaje: |
              Has sumado las componentes. El módulo no es $6+8$: es
              $\sqrt{6^{2}+8^{2}}$, que sale 10.
          - valor: '48'
            mensaje: |
              Eso es el producto de las componentes. El módulo de un vector es
              la raíz de la suma de sus cuadrados.
        pista: |
          El módulo de $(6,8)$ es $\sqrt{36+64}$. Es el triángulo 3-4-5 escalado.
        desarrollo: |
          $$
          \lVert \nabla f(3,4)\rVert = \sqrt{6^{2}+8^{2}} = \sqrt{100} = 10
          $$

          Sale exacto porque $(6,8)$ es el triángulo $3\text{-}4\text{-}5$
          multiplicado por 2. En un examen sin calculadora, los números están
          elegidos para que salga así.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta completa. Una pieza es falsa.
        piezas:
          - texto: $f_x = 2x$ y $f_y = 2y$, luego $\nabla f(3,4) = (6,8)$.
          - texto: La velocidad máxima de cambio es $\lVert\nabla f\rVert = 10$.
          - texto: 'Una dirección de cambio nulo es la perpendicular: $(-8,6)$, o su opuesta $(8,-6)$.'
          - texto: Esa perpendicular es tangente a la curva de nivel, que aquí es la circunferencia $x^{2}+y^{2}=25$.
          - texto: La dirección de cambio nulo es $(-6,-8)$, el gradiente cambiado de signo.
            trampa: true
            mensaje: |
              $-\nabla f$ es la dirección de **máximo descenso**, no la de cambio
              nulo. Por ahí la función cambia todo lo que puede, solo que hacia
              abajo. La de cambio nulo es la **perpendicular**.
    resolucion: |
      **Las tres preguntas, y las tres las contesta el mismo vector.**

      **El gradiente.** $f_x = 2x$, $f_y = 2y$, así que

      $$
      \nabla f(3,4) = (6,8)
      $$

      **La velocidad máxima de cambio** es su módulo:

      $$
      \lVert \nabla f \rVert = \sqrt{36+64} = 10
      $$

      **La dirección de cambio nulo** es cualquiera perpendicular al gradiente.
      Para obtener una perpendicular a $(a,b)$ basta con **cambiar el orden y
      un signo**: $(-b,a)$. Aquí, $(-8,6)$.

      **Por qué tiene sentido.** Las curvas de nivel de $x^{2}+y^{2}$ son
      circunferencias centradas en el origen. En $P(3,4)$ pasa la de radio 5, y
      el gradiente $(6,8)$ apunta justo hacia afuera, en la dirección radial —
      que es, en efecto, perpendicular a la circunferencia. La geometría
      confirma la cuenta.

  - id: ej-direccional-sin-normalizar
    titulo: La derivada direccional, y el vector que hay que normalizar
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Sabiendo que $\nabla f(P) = (3,4)$, calcular la derivada direccional de
      $f$ en $P$ siguiendo la dirección del vector $\vec v = (4,3)$.
    pide: La derivada direccional en la dirección de v.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de hacer el producto escalar con el gradiente, ¿qué hay que
          hacerle al vector $\vec v$?
        opciones:
          - texto: Normalizarlo, para que tenga módulo 1
            correcta: true
            mensaje: |
              Exacto, y no es un formalismo. La derivada direccional mide cuánto
              cambia la función **por cada unidad que avanzas**. Si el vector
              mide 5, estarías midiendo cinco pasos y llamándolo uno.
          - texto: Nada, se usa tal cual
            mensaje: |
              Ese es el error más caro del tema, y el más difícil de detectar
              porque el resultado sale creíble. Aquí $\vec v$ mide 5, así que la
              respuesta saldría cinco veces más grande de lo que debe.
          - texto: Hacerlo perpendicular al gradiente
            mensaje: |
              No: la dirección la elige el enunciado y no se toca. La
              perpendicular al gradiente es otra cosa — la dirección en la que
              la función no cambia.
      - tipo: calcular
        titulo: El módulo del vector dirección
        pregunta: |
          ¿Cuánto mide $\vec v = (4,3)$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '7'
            mensaje: |
              Has sumado las componentes. El módulo es $\sqrt{4^{2}+3^{2}}$,
              no $4+3$.
          - valor: '25'
            mensaje: |
              Eso es $4^{2}+3^{2}$, la suma de los cuadrados. Falta la raíz.
        pista: |
          $\sqrt{16+9}$. Otra vez el triángulo 3-4-5.
        desarrollo: |
          $$
          \lVert \vec v\rVert = \sqrt{16+9} = 5
          \qquad\Longrightarrow\qquad
          \vec u = \left(\tfrac{4}{5}, \tfrac{3}{5}\right)
          $$
      - tipo: calcular
        titulo: La derivada direccional
        pregunta: |
          ¿Cuánto vale $D_{\vec u} f(P) = (3,4)\cdot\left(\frac{4}{5},\frac{3}{5}\right)$?
        respuesta:
          tipo: numero
          valor: '4.8'
          tolerancia: 0.01
          formato: en forma exacta (24/5) o con dos decimales
        distractores:
          - valor: '24'
            mensaje: |
              Ese es el producto escalar **sin normalizar**: $(3,4)\cdot(4,3)=24$.
              Es exactamente el error del enunciado: falta dividir entre el
              módulo, que es 5.
          - valor: '5'
            mensaje: |
              5 es el módulo del gradiente, y también el de $\vec v$. La derivada
              direccional es otra cosa: el producto escalar del gradiente por el
              vector **unitario**.
        pista: |
          $(3\cdot 4 + 4\cdot 3)/5$. El numerador es 24.
        desarrollo: |
          $$
          D_{\vec u} f(P) = (3,4)\cdot\left(\tfrac{4}{5},\tfrac{3}{5}\right)
          = \frac{12}{5} + \frac{12}{5} = \frac{24}{5} = 4{,}8
          $$

          Y una comprobación que siempre vale la pena: la derivada direccional
          **nunca puede pasar del módulo del gradiente**, que aquí es 5. Sale
          $4{,}8 < 5$, así que es plausible. Si te hubiera salido 24, ese solo
          control ya delataba el fallo.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: El vector $\vec v=(4,3)$ mide 5, así que $\vec u = (4/5,\,3/5)$.
          - texto: $D_{\vec u} f = \nabla f \cdot \vec u = 24/5 = 4{,}8$.
          - texto: 'Es positiva, así que en esa dirección la función crece.'
          - texto: Y es menor que $\lVert\nabla f\rVert = 5$, como tiene que ser.
          - texto: Como $\vec v$ y $\nabla f$ tienen las mismas componentes cambiadas de orden, la derivada direccional es la máxima posible.
            trampa: true
            mensaje: |
              Al revés: la máxima se da cuando $\vec v$ apunta **en la misma
              dirección** que el gradiente, no cuando tiene sus componentes
              intercambiadas. Aquí $(4,3)$ y $(3,4)$ forman un ángulo pequeño
              pero no nulo, y por eso sale $4{,}8$ y no 5.
    resolucion: |
      **El error que este ejercicio existe para cazar** es hacer
      $\nabla f \cdot \vec v$ sin normalizar, y sale $24$: cinco veces la
      respuesta.

      **Normalizar.**

      $$
      \lVert\vec v\rVert = \sqrt{4^{2}+3^{2}} = 5,
      \qquad
      \vec u = \left(\tfrac{4}{5},\tfrac{3}{5}\right)
      $$

      **El producto escalar.**

      $$
      D_{\vec u} f(P) = (3,4)\cdot\left(\tfrac{4}{5},\tfrac{3}{5}\right)
      = \frac{12+12}{5} = \frac{24}{5} = 4{,}8
      $$

      **El control que lo delata.** La derivada direccional está siempre entre
      $-\lVert\nabla f\rVert$ y $+\lVert\nabla f\rVert$, porque
      $D_{\vec u}f = \lVert\nabla f\rVert\cos\theta$. Aquí eso es el intervalo
      $[-5,5]$, y $24$ se sale con mucho. **Comprobar esa cota cuesta un segundo
      y caza el error más frecuente del tema.**

  # ═══════════════════════════════════════════════════════════════════
  # Del boletín de problemas complementarios del tema 6.
