        consigna: |
          Dibuja el sólido en perspectiva y, aparte, su proyección sobre el plano
          $XY$. Marca la curva donde se cortan las dos superficies.
        comprueba:
          - punto: |
              Dos paraboloides **elípticos**, no de revolución: la sección
              horizontal es una elipse con la proporción $2:1$.
            porque: |
              El $4y^{2}$ aplasta la figura en la dirección $y$. Dibujarlos
              circulares es olvidar el coeficiente.
          - punto: |
              Uno abriendo hacia **arriba** desde el origen y otro hacia
              **abajo** desde $\left(0,0,8\right)$.
            porque: |
              $z=x^{2}+4y^{2}$ es el suelo y $z=8-x^{2}-4y^{2}$ el techo. El
              sólido es la lente entre ellos.
          - punto: |
              El corte a la altura $z=4$, en la elipse $x^{2}+4y^{2}=4$.
            porque: |
              De $x^{2}+4y^{2}=8-x^{2}-4y^{2}$ sale $x^{2}+4y^{2}=4$. Es la
              «cintura» del sólido y la frontera de la proyección.
          - punto: |
              La proyección sobre $XY$: el interior de la elipse
              $\tfrac{x^{2}}{4}+y^{2}\le1$, de semiejes $2$ y $1$.
            porque: |
              Es el recinto de integración de la doble. Sin él no se pueden
              poner los límites, y el cambio a coordenadas elípticas sale de
              ahí.
        veredicto: |
          El sólido es simétrico respecto del plano $z=4$: las dos superficies
          son la misma reflejada. Eso permite calcular la mitad y duplicar, y se
          ve en el dibujo.

    resolucion: |
      **El sólido** es una lente: un paraboloide elíptico que abre hacia arriba
      y otro que abre hacia abajo, encerrando el trozo entre los dos.

      **La sombra.** Donde se tocan las dos tapas:

      $$
      x^{2}+4y^{2} = 8-x^{2}-4y^{2}
      \;\Longrightarrow\;
      x^{2}+4y^{2}=4
      \;\Longleftrightarrow\;
      \frac{x^{2}}{4}+y^{2}=1
      $$

      Una elipse de semiejes $a=2$ y $b=1$, y las tapas se encuentran a altura
      $z=4$.

      **La altura del sólido** en cada punto de esa sombra:

      $$
      h(x,y) = \bigl(8-x^{2}-4y^{2}\bigr)-\bigl(x^{2}+4y^{2}\bigr) = 8-2(x^{2}+4y^{2})
      $$

      **El cambio.** Polares generalizadas con $a=2$, $b=1$, jacobiano $2\rho$, y
      la elipse se convierte en $\rho\le 1$. Además $x^{2}+4y^{2} = 4\rho^{2}$:

      $$
      V = \int_{0}^{2\pi}\!\!\int_{0}^{1}\bigl(8-8\rho^{2}\bigr)\,2\rho\;d\rho\,d\theta
      = 16\cdot 2\pi\int_{0}^{1}(\rho-\rho^{3})\,d\rho
      = 32\pi\left(\tfrac12-\tfrac14\right) = 8\pi
      $$

      **La comprobación de plausibilidad**, que vale un punto de COMP4: el
      sólido cabe en un cilindro elíptico de base $\pi ab = 2\pi$ y altura 8,
      o sea $16\pi$. Sale $8\pi$, la mitad exacta — razonable para una lente
      que se estrecha hacia el borde. ✓

  - id: cono-y-paraboloide
    titulo: Un cono y un paraboloide, volumen y superficie
    fuente: Ejercicio 7.19 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU (2016/2017 6E)
    nivel: practica
    enunciado: |
      Sea el sólido definido por las condiciones $x^{2}+y^{2}\le z^{2}$,
      $z\le 2-x^{2}-y^{2}$ y $z\ge 0$. Dibujar el sólido, calcular su volumen y
      el área de su superficie.
    pide: El dibujo, el volumen y el área de la superficie.
    pasos:
      - tipo: reconocer
        pregunta: |
          El sólido está limitado por un cono por debajo y un paraboloide por
          arriba. ¿Dónde está el borde?
        opciones:
          - texto: Donde el cono y el paraboloide se cortan
            correcta: true
            mensaje: |
              Sí, y esa intersección da el radio de la sombra. Igualando
              $\rho = 2-\rho^{2}$ sale $\rho = 1$.
          - texto: En z = 0, donde el cono toca el suelo
            mensaje: |
              El cono toca el suelo solo en un punto, el vértice. El borde del
              sólido está arriba, donde las dos superficies se encuentran.
          - texto: En z = 2, el vértice del paraboloide
            mensaje: |
              Ese es el punto más alto del paraboloide, pero el sólido no llega
              ahí: el cono lo corta antes.
      - tipo: calcular
        titulo: El radio de la intersección
        pregunta: |
          En cilíndricas, el cono es $z=\rho$ y el paraboloide $z=2-\rho^{2}$.
          Igualando, ¿cuál es el valor positivo de $\rho$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es el término independiente del paraboloide, no la raíz. De
              $\rho^{2}+\rho-2=0$ sale $(\rho+2)(\rho-1)=0$, y la positiva es 1.
          - valor: '1.414'
            mensaje: |
              $\sqrt2$ saldría de $\rho^{2}=2$, o sea de olvidar el término
              lineal. La ecuación completa es $\rho^{2}+\rho-2=0$.
        pista: |
          $\rho = 2-\rho^2$ es $\rho^2+\rho-2=0$. Factoriza.
        desarrollo: |
          $$
          \rho = 2-\rho^{2}
          \;\Longrightarrow\;
          \rho^{2}+\rho-2 = 0
          \;\Longrightarrow\;
          (\rho+2)(\rho-1)=0
          $$

          La raíz positiva es $\rho=1$, y ahí $z=1$. La sombra es el círculo
          unidad.
      - tipo: calcular
        titulo: El volumen
        pregunta: |
          El volumen sale $\frac{5\pi}{6}$. ¿Cuánto vale con cuatro decimales?
        respuesta:
          tipo: numero
          valor: '2.618'
          tolerancia: 0.02
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.0472'
            mensaje: |
              $\pi/3$ es solo el volumen del cono hasta $z=1$. Falta el casquete
              de paraboloide que va encima.
          - valor: '4.7124'
            mensaje: |
              $3\pi/2$ sería el volumen bajo el paraboloide sin restarle el cono.
              El sólido es lo que queda **entre** los dos.
        pista: |
          $5\pi/6$, con pi = 3,14159...
        desarrollo: |
          $$
          V = \int_{0}^{2\pi}\!\!\int_{0}^{1}\bigl[(2-\rho^{2})-\rho\bigr]\rho\;d\rho\,d\theta
          = 2\pi\int_{0}^{1}\bigl(2\rho-\rho^{3}-\rho^{2}\bigr)d\rho
          = 2\pi\left(1-\tfrac14-\tfrac13\right) = \frac{5\pi}{6}
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'En cilíndricas el cono es $z=\rho$ y el paraboloide $z=2-\rho^{2}$.'
          - texto: 'Se cortan en $\rho=1$, así que la sombra es el círculo unidad.'
          - texto: 'El volumen es la integral de la diferencia de alturas, y sale $5\pi/6$.'
          - texto: 'El área de la superficie son **dos** trozos: el lateral del cono y el casquete del paraboloide.'
          - texto: 'El área de la superficie es el perímetro del círculo unidad por la altura.'
            trampa: true
            mensaje: |
              Eso sería el área lateral de un cilindro. Aquí las dos tapas son
              curvas y hay que integrar cada una con su elemento de superficie:
              el cono aporta $\sqrt2\,\pi$ y el paraboloide
              $\frac{\pi}{6}(5\sqrt5-1)$.
      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 416 201" role="img" width="416" height="201"
               aria-labelledby="f-cono-paraboloide-t f-cono-paraboloide-d">
            <title id="f-cono-paraboloide-t">La peonza: cono por debajo, paraboloide por encima, cortándose en r igual a uno</title>
            <desc id="f-cono-paraboloide-d">A la izquierda, el corte: dos rectas que salen del origen con pendiente uno y menos uno —el cono— y, encima, la parábola z igual a dos menos x al cuadrado, con el vértice en z igual a dos. Se cortan en x igual a más y menos uno, a la altura uno. La región entre las dos tiene forma de peonza: punta abajo y panza arriba. A la derecha, la proyección: el disco de radio uno.</desc>
