        consigna: |
          Dibuja el sólido en perspectiva y su corte por el plano $XZ$. Marca la
          circunferencia de intersección.
        comprueba:
          - punto: |
              El cono $z=\sqrt{x^{2}+y^{2}}$ como superficie lateral, con el
              vértice en el origen.
            porque: |
              $x^{2}+y^{2}\le z^{2}$ describe el interior del cono. Con la
              condición implícita $z\ge0$ queda solo la hoja superior.
          - punto: |
              El paraboloide $z=6-x^{2}-y^{2}$ como tapa, con el vértice en
              $\left(0,0,6\right)$.
            porque: |
              Abre hacia abajo desde la altura $6$. Es lo que cierra el sólido
              por arriba.
          - punto: |
              El corte en $r=2$, $z=2$.
            porque: |
              De $r=6-r^{2}$ sale $r=2$. Ese radio es el límite superior de la
              integral en cilíndricas, y el único número que hace falta buscar.
          - punto: |
              La proyección sobre $XY$: el disco de radio $2$.
            porque: |
              Con ella los límites en cilíndricas son inmediatos, y el momento de
              inercia del apartado (b) se plantea sobre el mismo recinto.
        veredicto: |
          El sólido es un cono truncado por arriba con una cúpula parabólica. En
          cilíndricas, $z$ va de $r$ a $6-r^{2}$ y $r$ de $0$ a $2$: los tres
          límites se leen del corte por $XZ$.

    resolucion: |
      **Datos.** $S$: dentro del cono $x^{2}+y^{2}\le z^{2}$ y por debajo del
      paraboloide $z=6-x^{2}-y^{2}$.

      ### 1 · Dónde acaba el sólido

      Sobre el cono, $z=\rho$. Sustituyendo en la tapa:

      $$
      \rho = 6-\rho^{2} \;\Longrightarrow\; \rho^{2}+\rho-6=0
      \;\Longrightarrow\; \rho = 2
      $$

      El empalme está en $\rho=2$, $z=2$: un cucurucho cónico rematado por un
      casquete parabólico.

      ### 2 · El volumen

      $$
      V = 2\pi\int_0^{2}\rho\left(6-\rho^{2}-\rho\right)d\rho
      = 2\pi\cdot\frac{16}{3}
      $$

      $$
      \boxed{\ V = \frac{32\pi}{3} \approx 33{,}51\ }
      $$

      ### 3 · La inercia, planteada

      Distancia al eje $OZ$ al cuadrado: $x^{2}+y^{2}=\rho^{2}$. Densidad:
      $ky^{2}=k\rho^{2}\operatorname{sen}^{2}\theta$. Jacobiano: $\rho$.

      $$
      \boxed{\ I_{z}=\int_0^{2\pi}\!\!\int_0^{2}\!\!\int_{\rho}^{6-\rho^{2}}
      k\rho^{5}\operatorname{sen}^{2}\theta\;dz\,d\rho\,d\theta\ }
      $$

      Que es la expresión que publica el boletín.

      ### 4 · Y si hubiera que calcularla

      La $\theta$ se separa,
      $\int_0^{2\pi}\operatorname{sen}^{2}\theta\,d\theta=\pi$:

      $$
      I_{z} = k\pi\int_0^{2}\rho^{5}\left(6-\rho^{2}-\rho\right)d\rho
      = k\pi\left[64-32-\frac{128}{7}\right] = \frac{96k\pi}{7}
      $$

      **Lo que hay que llevarse.** En un momento de inercia hay **tres**
      factores que multiplican: la densidad, el cuadrado de la distancia al eje
      y el jacobiano. Contar los exponentes de $\rho$ antes de integrar —aquí
      $2+2+1=5$— es la forma más rápida de comprobar que el planteamiento está
      completo.

  - id: el-cono-truncado-por-un-cilindro
    titulo: Un cono recortado por un cilindro, y una solución impresa que no cuadra
    fuente: >-
      Ejercicio 7.24 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU
      (2014/2015 6E). El boletín publica z = 57/13, aproximadamente 4,38. Las
      condiciones tal como están escritas dan z = 9/5: ver el apartado final de
      la resolución, donde se explica la discrepancia.
    nivel: practica
    enunciado: |
      Suponiendo la densidad constante, calcular el centro de gravedad del
      sólido definido por las condiciones $x^{2}+y^{2}\le16$,
      $x^{2}+y^{2}\le(z-6)^{2}$ y $0\le z\le6$.
    pide: Las tres coordenadas del centro de gravedad.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con $0\le z\le6$ se cumple $z-6\le0$. ¿Qué dice entonces la segunda
          condición?
        opciones:
          - texto: >-
              Que $\rho\le 6-z$, o sea que el sólido está **dentro** del cono
              de vértice $(0,0,6)$ que se abre hacia abajo
            correcta: true
            mensaje: |
              Eso es. $(z-6)^{2}=(6-z)^{2}$ y la raíz positiva es $6-z$, así
              que la condición se lee $\rho\le6-z$, o equivalentemente
              $z\le6-\rho$.
          - texto: >-
              Que $\rho\le z-6$, que es imposible
            mensaje: |
              Al tomar la raíz de $(z-6)^{2}$ hay que quedarse con el valor
              **absoluto**, que aquí es $6-z$. Por eso la condición sí tiene
              solución.
          - texto: >-
              Que el sólido está fuera del cono
            mensaje: |
              La desigualdad es $\le$, así que el sólido está dentro. Fuera
              sería $\ge$, y daría un cuerpo distinto — con el centro de
              gravedad mucho más alto.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          El sólido es, para cada $\rho\in[0,4]$, la columna
          $0\le z\le 6-\rho$. ¿Cuánto vale su volumen?
        respuesta:
          tipo: numero
          valor: '167.5516'
          tolerancia: 0.05
          formato: en forma exacta (160pi/3) o con cuatro decimales
        distractores:
          - valor: '301.5929'
            mensaje: |
              $96\pi$ es el cilindro entero de radio $4$ y altura $6$. El cono
              le quita la esquina de arriba.
          - valor: '134.0413'
            mensaje: |
              $\tfrac{128\pi}{3}$ es justamente **lo que sobra**: el cilindro
              menos este sólido. Si te sale eso, has puesto la desigualdad al
              revés.
        pista: |
          $V=\displaystyle\int_0^{2\pi}\!\!\int_0^{4}\rho\left(6-\rho\right)
          d\rho\,d\theta$.
        desarrollo: |
          $$
          V = 2\pi\int_0^{4}\rho\left(6-\rho\right)d\rho
          = 2\pi\left[3\cdot16-\frac{64}{3}\right]
          = 2\pi\cdot\frac{80}{3} = \frac{160\pi}{3}
          $$

          $\tfrac{160\pi}{3}\approx167{,}5516$.

      - tipo: calcular
        titulo: La altura del centro de gravedad
        pregunta: |
          ¿A qué altura está el centro de gravedad?
        respuesta:
          tipo: numero
          valor: '1.8'
          tolerancia: 0.01
          formato: en forma exacta (9/5) o con dos decimales
        distractores:
          - valor: '4.5'
            mensaje: |
              $\tfrac92$ es el centro de gravedad del sólido
              **complementario**, el que queda entre el cono y el cilindro. Si
              te sale eso, has leído la desigualdad al revés.
          - valor: '3'
            mensaje: |
              $3$ es la mitad de la altura, y sería la respuesta si el sólido
              fuese un cilindro. Este se estrecha hacia arriba, así que el
              centro cae por debajo.
          - valor: '4.3846'
            mensaje: |
              $\tfrac{57}{13}$ es el valor que publica el boletín, y **no
              cuadra con las condiciones escritas**: el sólido que describen es
              ancho abajo y en punta arriba, así que su centro tiene que estar
              por debajo de la mitad. La cuenta, hecha por dos caminos, da
              $\tfrac95$.
        pista: |
          $\overline{z}=\dfrac{1}{V}\displaystyle\int_0^{2\pi}\!\!\int_0^{4}
          \rho\,\frac{(6-\rho)^{2}}{2}\,d\rho\,d\theta$.
        desarrollo: |
          $$
          \iiint z\,dV
          = \int_0^{2\pi}\!\!\int_0^{4}\rho\,\frac{\left(6-\rho\right)^{2}}{2}
          \,d\rho\,d\theta
          = \pi\int_0^{4}\rho\left(36-12\rho+\rho^{2}\right)d\rho
          $$

          $$
          = \pi\left[288-256+64\right] = 96\pi
          $$

          $$
          \overline{z} = \frac{96\pi}{160\pi/3} = \frac{288}{160}
          = \frac95 = 1{,}8
          $$

          Y por simetría de revolución, $\overline{x}=\overline{y}=0$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $0\le z\le6$, la condición $\rho^{2}\le(z-6)^{2}$ se lee
              $\rho\le6-z$: el sólido está dentro del cono de vértice
              $(0,0,6)$.
          - texto: >-
              El cono, a nivel del suelo, tendría radio $6$; el cilindro lo
              recorta a $4$, así que la base es un disco de radio $4$.
          - texto: >-
              El sólido es ancho abajo y termina en punta arriba, luego su
              centro de gravedad tiene que caer **por debajo** de la mitad de
              la altura.
          - texto: >-
              Y como el cilindro recorta el cono, el centro sube respecto al
              del cono completo, que estaría en $z=\tfrac32$.
            trampa: true
            mensaje: |
              Sube, sí — de $\tfrac32$ a $\tfrac95=1{,}8$ — pero el motivo está
              al revés de como suena: el cilindro **quita material de abajo**,
              que es la parte ancha, y al quitar peso abajo el centro se eleva.
              Esa frase es correcta; lo falso es lo que se afirma en la pieza
              anterior a la de la punta si se lee «el cilindro lo recorta a 4»
              como que el cono se corta por arriba. Lo que se corta es la
              corona exterior de la base.
        veredicto: |
          Tres controles de sentido que valen para cualquier centro de
          gravedad: mirar hacia dónde se ensancha el cuerpo, comprobar que el
          resultado cae dentro del intervalo de alturas, y contrastar con una
          figura conocida — aquí, el cono completo.
    resolucion: |
      **Datos.** $x^{2}+y^{2}\le16$, $x^{2}+y^{2}\le(z-6)^{2}$, $0\le z\le6$,
      densidad constante.

      ### 1 · Qué sólido es

      Como $0\le z\le6$, $(z-6)^{2}=(6-z)^{2}$ y la segunda condición es

      $$
      \rho \le 6-z \iff z \le 6-\rho
      $$

      Es el cono de vértice $(0,0,6)$ que se abriría hasta radio $6$ en el
      suelo, **recortado** por el cilindro de radio $4$. En el eje mide $6$ de
      alto; en el borde, $2$.

      ### 2 · El volumen

      $$
      V = 2\pi\int_0^{4}\rho\left(6-\rho\right)d\rho = \frac{160\pi}{3}
      \approx 167{,}55
      $$

      ### 3 · El centro de gravedad

      Por simetría de revolución, $\overline{x}=\overline{y}=0$.

      $$
      \iiint z\,dV = \pi\int_0^{4}\rho\left(6-\rho\right)^{2}d\rho = 96\pi
      $$

      $$
      \boxed{\ \left(0,\,0,\,\tfrac95\right)\ }
      $$

      ### 4 · La discrepancia con el impreso

      El boletín publica $\overline{z}=\tfrac{57}{13}\approx4{,}38$. Con las
      condiciones tal como están escritas ese valor **no sale**, y hay tres
      razones para pensar que la cuenta de arriba es la buena:

      1. El sólido es ancho abajo —un disco de radio $4$— y termina en punta a
         los $6$ de altura. Un cuerpo así no puede tener el centro por encima
         de la mitad.
      2. El cono completo de vértice $(0,0,6)$ tiene su centro en $z=\tfrac32$.
         Recortarle la corona exterior de la base sube el centro un poco, hasta
         $1{,}8$. Un salto hasta $4{,}38$ no lo explica nada.
      3. El otro sólido plausible —el que queda **entre** el cono y el
         cilindro, o sea con la desigualdad al revés— da $\overline{z}=4{,}5$,
         que tampoco es $\tfrac{57}{13}$.

      Así que se publica $\tfrac95$, y el $\tfrac{57}{13}$ del impreso queda
      como distractor con su aviso.

      **Lo que hay que llevarse.** Al elevar al cuadrado, $(z-6)^{2}$ y
      $(6-z)^{2}$ son lo mismo: la raíz se toma con el signo que hace el
      resultado positivo en el rango en que se trabaja. Y el control de
      siempre: **el centro de gravedad cae hacia donde el cuerpo es más
      ancho**, y comprobarlo cuesta un vistazo.

  - id: la-esfera-mordida-por-el-cilindro
    titulo: La esfera mordida por un cilindro que la toca por dentro
    fuente: Ejercicio 7.26 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU (2019/2020 5E)
    nivel: practica
    enunciado: |
      Sea el sólido definido por las condiciones $x^{2}+y^{2}+z^{2}\le4$ y
      $x^{2}+y^{2}\le2x$. Dibujar el sólido y calcular su volumen.
    pide: El dibujo del sólido y su volumen.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es $x^{2}+y^{2}\le2x$?
        opciones:
          - texto: >-
              El cilindro de radio $1$ con eje en la recta $x=1$, $y=0$: en
              polares, $\rho\le2\cos\theta$
            correcta: true
            mensaje: |
              Eso es. Completando cuadrados, $(x-1)^{2}+y^{2}\le1$. Tiene la
              mitad del radio de la esfera y pasa por el origen.
          - texto: >-
              El cilindro de radio $2$ centrado en el eje $z$
            mensaje: |
              Ese sería $x^{2}+y^{2}\le4$. El término $2x$ desplaza el centro y
              reduce el radio a la mitad.
          - texto: >-
              Un paraboloide
            mensaje: |
              No aparece $z$ en la condición, así que la superficie es la misma
              curva a cualquier altura: una pared vertical, o sea un cilindro.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen del sólido?
        respuesta:
          tipo: numero
          valor: '9.6440'
          tolerancia: 0.02
          formato: en forma exacta ((48pi-64)/9) o con cuatro decimales
        distractores:
          - valor: '33.5103'
            mensaje: |
              $\tfrac{32\pi}{3}$ es la bola entera de radio $2$. El cilindro se
              queda con una mordida de menos de un tercio de ella.
          - valor: '4.8220'
            mensaje: |
              La mitad: has integrado solo $z\ge0$. La esfera está cortada por
              el cilindro arriba y abajo.
          - valor: '16.7552'
            mensaje: |
              $\tfrac{16\pi}{3}$ sale de evaluar
              $\left(4-\rho^{2}\right)^{3/2}$ solo en $\rho=0$ y olvidar el
              límite superior $\rho=2\cos\theta$.
        pista: |
          $V=\displaystyle\int_{-\pi/2}^{\pi/2}\!\!\int_0^{2\cos\theta}
          2\sqrt{4-\rho^{2}}\;\rho\,d\rho\,d\theta$, con el $2$ de las dos
          mitades.
        desarrollo: |
          $$
          \int_0^{2\cos\theta} 2\sqrt{4-\rho^{2}}\,\rho\,d\rho
          = \frac23\left[8 - \left(4-4\cos^{2}\theta\right)^{3/2}\right]
          = \frac{16}{3}\left(1-\left|\operatorname{sen}\theta\right|^{3}\right)
          $$

          $$
          V = \frac{16}{3}\int_{-\pi/2}^{\pi/2}
          \left(1-\left|\operatorname{sen}\theta\right|^{3}\right)d\theta
          = \frac{16}{3}\left(\pi-\frac43\right)
          $$

          $$
          V = \frac{48\pi-64}{9} \approx 9{,}6440
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El cilindro es $\rho\le2\cos\theta$, con
              $\theta\in\left[-\tfrac{\pi}{2},\tfrac{\pi}{2}\right]$: es el que
              recorta el contorno.
          - texto: >-
              La esfera pone la tapa y el suelo, $z=\pm\sqrt{4-\rho^{2}}$, así
              que la altura de cada columna es $2\sqrt{4-\rho^{2}}$.
          - texto: >-
              $\int_{-\pi/2}^{\pi/2}
              \left|\operatorname{sen}\theta\right|^{3}d\theta = \tfrac43$, y de
              ahí sale el $-64$ del resultado.
          - texto: >-
              Y como el cilindro tiene la mitad del radio de la esfera, el
              sólido es la mitad de la bola.
            trampa: true
            mensaje: |
              Ni de lejos: $9{,}64$ frente a los $33{,}51$ de la bola, o sea un
              $29\%$. El cilindro tiene la mitad del radio y además está
              **desplazado**, así que muerde por un solo lado. Media bola
              serían $16{,}76$.
        veredicto: |
          Este es el sólido de Viviani con la esfera del doble de radio que el
          cilindro. La comprobación de tamaño —el $29\%$ de la bola— es la que
          hay que hacer siempre que un cuerpo salga de cortar dos superficies.
      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 416 201" role="img" width="416" height="201"
               aria-labelledby="f-esfera-cilindro-t f-esfera-cilindro-d">
