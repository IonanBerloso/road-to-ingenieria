          </svg>
        consigna: |
          Dibuja el recinto $D$ en el plano $XY$ y, al lado, su imagen en el
          plano $UV$ tras el cambio. Marca los cuatro vértices en los dos
          dibujos.
        comprueba:
          - punto: |
              Los cuatro vértices del rombo: $\left(1,0\right)$,
              $\left(0,4\right)$, $\left(-1,0\right)$ y $\left(0,-4\right)$.
            porque: |
              Salen de cortar las rectas dos a dos. El rombo es **cuatro veces
              más alto que ancho**, y dibujarlo como un cuadrado girado es el
              error que lo estropea.
          - punto: |
              Las cuatro rectas etiquetadas, dos de pendiente $4$ y dos de
              pendiente $-4$.
            porque: |
              Son muy inclinadas. Dibujarlas a $45^\circ$ produce un rombo con
              las proporciones cambiadas y esconde por qué el cambio de variable
              ayuda.
          - punto: |
              En el plano $UV$, un **cuadrado** de lado $2$, con
              $-1\le u\le1$ y $-1\le v\le1$.
            porque: |
              Ese es el objetivo del cambio: convertir un rombo inclinado en un
              cuadrado con los lados paralelos a los ejes. Si en tu dibujo no sale
              un cuadrado, el cambio está mal aplicado.
          - punto: |
              Los vértices emparejados entre los dos dibujos, con flechas o
              colores.
            porque: |
              Es lo que demuestra que el cambio es biyectivo y que los límites
              nuevos son los correctos. Sin el emparejamiento, el cuadrado es una
              afirmación sin prueba.
        veredicto: |
          El cambio no simplifica el integrando: simplifica el **recinto**. Ese
          es el motivo más frecuente para cambiar de variable en una integral
          doble, y los dos dibujos juntos lo enseñan mejor que el jacobiano.

    resolucion: |
      **Datos.** $I=\iint_D(2x-y+1)\,dA$ sobre el rombo limitado por
      $y=4x\pm4$ e $y=-4x\pm4$, con el cambio $x=\tfrac12(u+v)$, $y=2v-2u$.

      ### 1 · El recinto

      Los vértices salen cortando las rectas de dos en dos:

      | rectas | vértice |
      |---|---|
      | $y=4x-4$ y $y=-4x-4$ | $(0,-4)$ |
      | $y=4x+4$ y $y=-4x+4$ | $(0,4)$ |
      | $y=4x-4$ y $y=-4x+4$ | $(1,0)$ |
      | $y=4x+4$ y $y=-4x-4$ | $(-1,0)$ |

      Un rombo de diagonales $2$ y $8$, de área $8$.

      ### 2 · Qué hace el cambio

      Combinando las dos ecuaciones del cambio:

      $$
      y-4x = -4u, \qquad y+4x = 4v
      $$

      así que $u=\tfrac{4x-y}{4}$ y $v=\tfrac{4x+y}{4}$. Los cuatro lados del
      rombo son $u=\pm1$ y $v=\pm1$: el recinto nuevo es el cuadrado
      $[-1,1]^{2}$.

      ### 3 · El jacobiano y la integral

      $$
      \frac{\partial(x,y)}{\partial(u,v)}
      = \begin{vmatrix} \tfrac12 & \tfrac12\\[2pt] -2 & 2\end{vmatrix} = 2
      $$

      $$
      2x-y+1 = 3u-v+1
      $$

      $$
      I = 2\int_{-1}^{1}\!\!\int_{-1}^{1}(3u-v+1)\,du\,dv = 2\cdot4 = 8
      $$

      $$
      \boxed{\ I = 8\ }
      $$

      ### 4 · Por qué sale el área

      Los términos $3u$ y $-v$ son impares sobre un cuadrado centrado en el
      origen y se anulan, así que la integral se reduce a la del $1$: el área
      del rombo. Y esa se sabe por geometría, $\tfrac12\cdot2\cdot8=8$.

      **Lo que hay que llevarse.** Un cambio de variable lineal se **descubre**
      mirando qué combinaciones son constantes sobre los lados; el enunciado te
      lo dio hecho, pero en el examen a veces no. Y si el integrando acaba
      siendo constante, el resultado es el área del recinto original — una
      comprobación que no cuesta nada.

  - id: el-paralelogramo-inclinado
    titulo: Un paralelogramo inclinado, y el cambio que lo pone recto
    fuente: Ejercicio 7.8 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Utilizando el cambio de variable $x=\tfrac34(v-u)$,
      $y=\tfrac14 u+\tfrac34 v$, calcular la integral
      $I=\displaystyle\iint_D (y-x)\,dx\,dy$, siendo $D$ el recinto delimitado
      por las condiciones $y=x+1$, $y=x-3$, $y=-\tfrac{x}{3}+2$ e
      $y=-\tfrac{x}{3}+4$.
    pide: El valor de la integral.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué son $u$ y $v$ en términos de $x$ e $y$?
        opciones:
          - texto: >-
              $u=y-x$ y $v=y+\tfrac{x}{3}$, que son justo las combinaciones
              constantes sobre los cuatro lados
            correcta: true
            mensaje: |
              Eso es, y sustituyendo se comprueba enseguida:
              $y-x=\tfrac14u+\tfrac34v-\tfrac34v+\tfrac34u = u$, y
              $y+\tfrac{x}{3}=\tfrac14u+\tfrac34v+\tfrac14v-\tfrac14u = v$.
          - texto: >-
              $u=x$ y $v=y$ reescalados
            mensaje: |
              Si fuera un simple reescalado, el recinto seguiría siendo un
              paralelogramo inclinado. Lo que hace este cambio es **enderezar
              los lados**, y eso exige mezclar $x$ con $y$.
          - texto: >-
              $u=y+x$ y $v=y-\tfrac{x}{3}$
            mensaje: |
              Los signos al revés. Compruébalo sustituyendo: con el cambio dado
              sale $y-x=u$, no $y+x$.

      - tipo: calcular
        titulo: El jacobiano
        pregunta: |
          ¿Cuánto vale
          $\left|\dfrac{\partial(x,y)}{\partial(u,v)}\right|$?
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.005
          formato: en forma exacta (3/4) o con dos decimales
        distractores:
          - valor: '1.3333'
            mensaje: |
              $4/3$ es el inverso. El que multiplica a $du\,dv$ es
              $\partial(x,y)/\partial(u,v)$, no el otro.
          - valor: '0.375'
            mensaje: |
              La mitad. El determinante es
              $-\tfrac34\cdot\tfrac34-\tfrac34\cdot\tfrac14=-\tfrac{12}{16}$, y
              su valor absoluto es $\tfrac34$.
        pista: |
          $\begin{vmatrix}
          -\tfrac34 & \tfrac34\\[2pt] \tfrac14 & \tfrac34
          \end{vmatrix}$, y luego el valor absoluto.
        desarrollo: |
          $$
          \frac{\partial(x,y)}{\partial(u,v)}
          = \begin{vmatrix}
          -\tfrac34 & \tfrac34\\[2pt]
          \tfrac14 & \tfrac34
          \end{vmatrix}
          = -\frac{9}{16}-\frac{3}{16} = -\frac{3}{4}
          $$

          El signo negativo solo dice que el cambio invierte la orientación; lo
          que entra en la integral es $\left|J\right|=\tfrac34$.

      - tipo: calcular
        titulo: La integral
        pregunta: |
          Los cuatro lados son $u=1$, $u=-3$, $v=2$ y $v=4$. ¿Cuánto vale $I$?
        respuesta:
          tipo: numero
          valor: '-6'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '6'
            mensaje: |
              El signo. La $u$ recorre $[-3,1]$, que está mucho más en la parte
              negativa: su valor medio es $-1$, y $I$ tiene que salir
              negativa.
          - valor: '-8'
            mensaje: |
              Te has dejado el jacobiano. Sin él sale $-8$; con el
              $\tfrac34$, $-6$.
        pista: |
          El integrando es exactamente $u$, así que
          $I=\tfrac34\int_{2}^{4}\!\!\int_{-3}^{1} u\,du\,dv$.
        desarrollo: |
          $$
          y-x = u
          \quad\Longrightarrow\quad
          I = \frac34\int_{2}^{4}\!\!\int_{-3}^{1} u\;du\,dv
          $$

          $$
          \int_{-3}^{1} u\,du = \frac{1-9}{2} = -4,
          \qquad
          \int_2^4 dv = 2
          $$

          $$
          I = \frac34\cdot(-4)\cdot 2 = -6
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Los cuatro lados son $y-x=1$, $y-x=-3$, $y+\tfrac{x}{3}=2$ e
              $y+\tfrac{x}{3}=4$: dos combinaciones lineales, dos valores cada
              una.
          - texto: >-
              El cambio del enunciado es esas dos combinaciones despejadas, así
              que el recinto nuevo es el rectángulo
              $[-3,1]\times[2,4]$.
          - texto: >-
              El integrando $y-x$ **es** la variable $u$, así que la integral
              se vuelve inmediata.
          - texto: >-
              Y como $|J|=\tfrac34$ es menor que $1$, el rectángulo en $(u,v)$
              es más pequeño que el paralelogramo original.
            trampa: true
            mensaje: |
              Al revés. $|J|=\tfrac34$ significa que un trozo de área $1$ en
              $(u,v)$ se convierte en uno de área $\tfrac34$ en $(x,y)$: el
              rectángulo, de área $8$, es **mayor** que el paralelogramo, de
              área $6$. El jacobiano multiplica al ir de $(u,v)$ a $(x,y)$, no
              al revés.
        veredicto: |
          El buen cambio de variable no es el que simplifica el integrando ni
          el que simplifica el recinto: es el que hace las dos cosas a la vez.
          Aquí el recinto se vuelve un rectángulo y el integrando se vuelve una
          de las variables nuevas.
    resolucion: |
      **Datos.** $I=\iint_D(y-x)\,dA$ sobre el paralelogramo limitado por
      $y=x+1$, $y=x-3$, $y=-\tfrac{x}{3}+2$ e $y=-\tfrac{x}{3}+4$, con el
      cambio $x=\tfrac34(v-u)$, $y=\tfrac14u+\tfrac34v$.

      ### 1 · Las dos combinaciones que definen el recinto

      Reescritas, las cuatro rectas son

      $$
      y-x = 1, \quad y-x = -3, \quad
      y+\frac{x}{3} = 2, \quad y+\frac{x}{3} = 4
      $$

      Dos familias de paralelas: el recinto es un paralelogramo.

      ### 2 · Qué hace el cambio

      Sustituyendo:

      $$
      y-x = u, \qquad y+\frac{x}{3} = v
      $$

      así que $D$ se convierte en el rectángulo
      $u\in[-3,1]$, $v\in[2,4]$.

      ### 3 · El jacobiano

      $$
      \frac{\partial(x,y)}{\partial(u,v)}
      = \begin{vmatrix}
      -\tfrac34 & \tfrac34\\[2pt]
      \tfrac14 & \tfrac34
      \end{vmatrix}
      = -\frac34
      \qquad\Longrightarrow\qquad
      |J| = \frac34
      $$

      ### 4 · La integral

      $$
      I = \frac34\int_2^4\!\!\int_{-3}^{1} u\;du\,dv
      = \frac34\cdot(-4)\cdot 2
      $$

      $$
      \boxed{\ I = -6\ }
      $$

      ### 5 · La comprobación de tamaño

      El rectángulo en $(u,v)$ tiene área $4\cdot2=8$, así que el
      paralelogramo tiene área $\tfrac34\cdot8=6$. Y el valor medio de $u$
      sobre $[-3,1]$ es $-1$, de modo que $I \approx (-1)\cdot 6 = -6$.
      Exacto, porque el integrando es lineal.

      **Lo que hay que llevarse.** Cuando un enunciado regala el cambio, la
      primera tarea es **entender qué son $u$ y $v$**: casi siempre son las
      combinaciones que se mantienen constantes sobre los lados del recinto. Y
      el jacobiano va en un sentido concreto — $|J|$ multiplica al pasar de las
      variables nuevas a las viejas.

  - id: la-corona-y-el-sector
    titulo: La corona circular, que en polares es un rectángulo
    fuente: >-
      Ejercicio 7.10 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU.
      El boletín da los dos recintos en una figura; aquí se describen con
      palabras.
    nivel: practica
    enunciado: |
      Utilizando *coordenadas polares*, calcular la integral
      $I=\displaystyle\iint_D (x^{2}+y^{2})\,dx\,dy$ en cada uno de los
      recintos indicados:

      (a) la corona circular $1\le x^{2}+y^{2}\le 4$;

      (b) el sector de esa misma corona comprendido entre
      $\theta=\tfrac{\pi}{4}$ y $\theta=\pi$.
    pide: El valor de la integral en los dos recintos.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué la corona es el recinto ideal para polares?
        opciones:
          - texto: >-
              Porque en $(\rho,\theta)$ es un **rectángulo**:
              $1\le\rho\le2$, $0\le\theta\le2\pi$, con los cuatro límites
              constantes
            correcta: true
            mensaje: |
              Eso es. En cartesianas haría falta partirla en cuatro trozos con
              raíces por todas partes; en polares es el rectángulo más simple
              que hay.
          - texto: >-
              Porque el integrando $x^{2}+y^{2}$ se vuelve $\rho$
            mensaje: |
              Se vuelve $\rho^{2}$, no $\rho$. Y con el $\rho$ del diferencial,
              el integrando completo es $\rho^{3}$ — que también es lo más
              cómodo posible, pero el motivo principal es el recinto.
          - texto: >-
              Porque el jacobiano es $1$
            mensaje: |
              El jacobiano de las polares es $\rho$, no $1$. Justamente por eso
              hay que escribir $\rho\,d\rho\,d\theta$ y no $d\rho\,d\theta$.

      - tipo: calcular
        titulo: El apartado (a)
        pregunta: |
          $\displaystyle\iint_D (x^{2}+y^{2})\,dA$ sobre la corona
          $1\le x^{2}+y^{2}\le4$.
        respuesta:
          tipo: numero
          valor: '23.5619'
          tolerancia: 0.02
          formato: en forma exacta (15pi/2) o con cuatro decimales
        distractores:
          - valor: '25.1327'
            mensaje: |
              $8\pi$ es el disco entero de radio $2$: te has olvidado del
              agujero. El límite inferior de $\rho$ es $1$, no $0$.
          - valor: '47.1239'
            mensaje: |
              $15\pi$ es el doble. $\int\rho^{3}d\rho=\tfrac{\rho^{4}}{4}$, no
              $\tfrac{\rho^{4}}{2}$.
        pista: |
          $I=\displaystyle\int_0^{2\pi}\!\!\int_1^{2}\rho^{2}\cdot\rho
          \,d\rho\,d\theta$ — el $\rho^{2}$ es el integrando y el otro $\rho$
          es el jacobiano.
        desarrollo: |
          $$
          I = \int_0^{2\pi}\!\!\int_1^{2}\rho^{3}\,d\rho\,d\theta
          = 2\pi\left[\frac{\rho^{4}}{4}\right]_1^{2}
          = 2\pi\cdot\frac{16-1}{4}
          = \frac{15\pi}{2} \approx 23{,}5619
          $$

      - tipo: calcular
        titulo: El apartado (b)
        pregunta: |
          El mismo integrando sobre el sector de esa corona con
          $\tfrac{\pi}{4}\le\theta\le\pi$.
        respuesta:
          tipo: numero
          valor: '8.8357'
          tolerancia: 0.01
          formato: en forma exacta (45pi/16) o con cuatro decimales
        distractores:
          - valor: '23.5619'
            mensaje: |
              Esa es la corona entera, el apartado (a). Aquí solo hay
              $\tfrac{3\pi}{4}$ de los $2\pi$ de vuelta.
          - valor: '11.781'
            mensaje: |
              $\tfrac{15\pi}{4}$ es media corona, o sea $\theta$ de $0$ a
              $\pi$. El sector empieza en $\tfrac{\pi}{4}$, no en $0$.
        pista: |
          Solo cambia el intervalo de $\theta$: la integral en $\rho$ es la
          misma de antes, $\tfrac{15}{4}$.
        desarrollo: |
          $$
          I = \int_{\pi/4}^{\pi}\!\!\int_1^{2}\rho^{3}\,d\rho\,d\theta
          = \frac{15}{4}\left(\pi-\frac{\pi}{4}\right)
          = \frac{45\pi}{16} \approx 8{,}8357
          $$

          Es $\tfrac{3}{8}$ del apartado (a), que es exactamente la fracción de
          vuelta que abarca el sector.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              En polares la corona es el rectángulo
              $[1,2]\times[0,2\pi]$, con los cuatro límites constantes.
          - texto: >-
              El integrando $x^{2}+y^{2}$ se vuelve $\rho^{2}$, y con el
              jacobiano $\rho$ queda $\rho^{3}$.
          - texto: >-
              Como los límites son constantes y el integrando no depende de
              $\theta$, la doble se separa en el producto de dos simples.
          - texto: >-
              Y por eso el apartado (b) sale restando al (a) la parte que
              corresponde a $\theta$ entre $0$ y $\tfrac{\pi}{4}$, que es un
              octavo de $\tfrac{15\pi}{2}$.
            trampa: true
            mensaje: |
              Un octavo de vuelta es $\tfrac{\pi}{4}$ de un total de $2\pi$, sí,
              pero el sector de (b) va de $\tfrac{\pi}{4}$ a $\pi$: le falta
              **también** la mitad de $\pi$ a $2\pi$. Lo que sobra son
              $\tfrac{5\pi}{4}$ de los $2\pi$, o sea cinco octavos, y por eso
              (b) es tres octavos de (a).
        veredicto: |
          Cuando el integrando no depende de $\theta$, la integral es
          proporcional al ángulo barrido. Comprobar la proporción —aquí,
          $\tfrac38$— es un contraste que cuesta una división.
    resolucion: |
      **Datos.** $I=\iint_D(x^{2}+y^{2})\,dA$ sobre (a) la corona
      $1\le x^{2}+y^{2}\le4$ y (b) el sector de esa corona con
      $\tfrac{\pi}{4}\le\theta\le\pi$.

      ### 1 · Las polares

      $$
      x^{2}+y^{2}=\rho^{2}, \qquad dA = \rho\,d\rho\,d\theta
      $$

      El integrando completo es $\rho^{3}$, y la integral radial es la misma en
      los dos apartados:

      $$
      \int_1^{2}\rho^{3}\,d\rho = \frac{16-1}{4} = \frac{15}{4}
      $$

      ### 2 · Los dos resultados

      | recinto | ángulo barrido | $I$ |
      |---|---|---|
      | (a) corona completa | $2\pi$ | $\tfrac{15\pi}{2}\approx23{,}56$ |
      | (b) sector | $\tfrac{3\pi}{4}$ | $\tfrac{45\pi}{16}\approx8{,}84$ |

      $$
      \frac{45\pi/16}{15\pi/2} = \frac{3}{8}
      = \frac{3\pi/4}{2\pi}
      $$

      **Lo que hay que llevarse.** Un recinto limitado por circunferencias
      concéntricas y por radios es, en polares, un rectángulo — y ese es el
      único motivo por el que se cambia de coordenadas. Si el recinto no
      mejora, el cambio no compensa aunque el integrando parezca pedirlo.

  - id: nueve-integrales-en-polares
    titulo: Nueve integrales en polares, y el círculo que no está centrado
    fuente: >-
      Ejercicio 7.11, apartados (a) a (i) · Problemas complementarios, tema 7 ·
      Cálculo, UPV/EHU. El apartado (f) es de la convocatoria 2011/2012 5E.
    nivel: practica
    enunciado: |
      Utilizando *coordenadas polares* o *polares generalizadas*, calcular el
      valor de las siguientes integrales en los recintos $D$ indicados:

      (a) $\displaystyle\iint_D e^{x^{2}+y^{2}}dx\,dy$, $D$ es el círculo de
      radio $R=1$ centrado en el origen.

      (b) $\displaystyle\int_{-1}^{1}\!\!\int_{-\sqrt{1-x^{2}}}^{0}
      \cos(x^{2}+y^{2})\,dy\,dx$

      (c) $\displaystyle\iint_D (x^{2}-y^{2})dx\,dy$, $D$: recinto delimitado
      por las condiciones $1\le x^{2}+y^{2}\le4$ y $-x\le y\le x$.

      (d) $\displaystyle\iint_D \operatorname{sen}\sqrt{x^{2}+y^{2}}\,dx\,dy$,
      $D$ es el círculo $x^{2}+y^{2}\le\pi^{2}$.

      (e) $\displaystyle\iint_D (x^{2}+y^{2})dx\,dy$, $D$ es el círculo
      $(x-1)^{2}+y^{2}\le1$.

      (f) $\displaystyle\int_0^{1}\!\!\int_0^{2\sqrt{1-y^{2}}}
      \left(x^{2}-y^{2}\right)dx\,dy$

      (g) Calcular el área de un círculo de radio $R$.

      (h) Calcular el área de una elipse de semiejes $a$ y $b$.

      (i) $\displaystyle\iint_R \frac{y\,dx\,dy}{x^{2}+y^{2}}$, donde $R$ es la
      mitad superior del cardioide $\rho=1+\cos\theta$.
    pide: El valor de las nueve integrales.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado (b) viene en cartesianas. ¿Qué recinto describe?
        opciones:
          - texto: >-
              El **semicírculo inferior** del disco unidad, porque $y$ va desde
              $-\sqrt{1-x^{2}}$ hasta $0$
            correcta: true
            mensaje: |
              Eso es: $\theta$ de $\pi$ a $2\pi$. En polares, media vuelta.
          - texto: >-
              El disco unidad entero
            mensaje: |
              El límite superior de $y$ es $0$, no $+\sqrt{1-x^{2}}$: solo la
              mitad de abajo.
          - texto: >-
              El cuadrado $[-1,1]\times[-1,0]$
            mensaje: |
              La raíz $\sqrt{1-x^{2}}$ es la ecuación de la circunferencia. Si
              el límite fuese $-1$ sí sería un cuadrado.

      - tipo: calcular
        titulo: El apartado (a)
        pregunta: |
          $\displaystyle\iint_D e^{x^{2}+y^{2}}dA$ sobre el disco unidad.
        respuesta:
          tipo: numero
          valor: '5.3981'
          tolerancia: 0.006
          formato: en forma exacta (pi(e-1)) o con cuatro decimales
        distractores:
          - valor: '10.7963'
            mensaje: |
              El doble. $\int_0^{1}e^{\rho^{2}}\rho\,d\rho =
              \tfrac12\left(e-1\right)$, con el $\tfrac12$ que sale del cambio
              $t=\rho^{2}$.
          - valor: '9.1901'
            mensaje: |
              Te has dejado el $\rho$ del diferencial. Y fíjate en lo que eso
              significa: sin ese $\rho$, la integral **no es elemental** —
              $\int e^{\rho^{2}}d\rho$ no tiene primitiva en funciones
              conocidas. Que aparezca es lo único que hace el ejercicio
              posible.
        pista: |
          $\int_0^{1} e^{\rho^{2}}\rho\,d\rho$ se hace con $t=\rho^{2}$, que
          trae un $\tfrac12$.
        desarrollo: |
          $$
          I = \int_0^{2\pi}\!\!\int_0^{1} e^{\rho^{2}}\rho\,d\rho\,d\theta
          = 2\pi\cdot\frac{e-1}{2}
          = \pi\left(e-1\right) \approx 5{,}3981
          $$

      - tipo: calcular
        titulo: El apartado (e), el círculo desplazado
        pregunta: |
          $\displaystyle\iint_D (x^{2}+y^{2})dA$ sobre $(x-1)^{2}+y^{2}\le1$.
        respuesta:
          tipo: numero
          valor: '4.7124'
          tolerancia: 0.006
          formato: en forma exacta (3pi/2) o con cuatro decimales
        distractores:
          - valor: '1.5708'
            mensaje: |
              $\pi/2$ es el resultado sobre el disco unidad **centrado en el
              origen**. Este está desplazado a $(1,0)$, y en polares eso lo
              cambia todo: el radio deja de ser constante.
          - valor: '9.4248'
            mensaje: |
              $3\pi$ es el doble, y sale de tomar $\theta$ de $0$ a $2\pi$. Con
              $\rho\le2\cos\theta$ eso recorrería el círculo dos veces —y con
              radios negativos en media vuelta. El intervalo correcto es
              $\left[-\tfrac{\pi}{2},\tfrac{\pi}{2}\right]$.
        pista: |
          $(x-1)^{2}+y^{2}\le1$ es $x^{2}+y^{2}\le2x$, o sea
          $\rho\le2\cos\theta$.
        desarrollo: |
          $$
          (x-1)^{2}+y^{2}\le1 \iff \rho^{2}\le 2\rho\cos\theta
          \iff \rho \le 2\cos\theta
          $$

          $$
          I = \int_{-\pi/2}^{\pi/2}\!\!\int_0^{2\cos\theta}\rho^{3}
          \,d\rho\,d\theta
          = \int_{-\pi/2}^{\pi/2} 4\cos^{4}\theta\,d\theta
          $$

          El valor medio de $\cos^{4}$ es $\tfrac38$ y el intervalo mide $\pi$:

          $$
          I = 4\cdot\frac{3}{8}\pi = \frac{3\pi}{2} \approx 4{,}7124
          $$

      - tipo: calcular
        titulo: El apartado (i), el cardioide
        pregunta: |
          $\displaystyle\iint_R \frac{y}{x^{2}+y^{2}}\,dA$ sobre la mitad
          superior del cardioide $\rho=1+\cos\theta$.
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '0'
            mensaje: |
              Eso es lo que da el cardioide **entero**, $\theta$ de $0$ a
              $2\pi$, porque el integrando es impar en $y$. La figura sombrea
              solo la mitad de arriba.
          - valor: '1.3333'
            mensaje: |
              No has simplificado del todo:
              $\tfrac{y}{x^{2}+y^{2}}=\tfrac{\operatorname{sen}\theta}{\rho}$, y
              el $\rho$ del diferencial lo cancela. Lo que queda dentro es
              $\operatorname{sen}\theta$ a secas, no
              $\rho\operatorname{sen}\theta$.
        pista: |
          $\dfrac{y}{x^{2}+y^{2}}\cdot\rho\,d\rho\,d\theta =
          \dfrac{\rho\operatorname{sen}\theta}{\rho^{2}}\cdot\rho
          \,d\rho\,d\theta = \operatorname{sen}\theta\,d\rho\,d\theta$.
        desarrollo: |
          $$
          I = \int_0^{\pi}\!\!\int_0^{1+\cos\theta}
          \operatorname{sen}\theta\,d\rho\,d\theta
          = \int_0^{\pi}\operatorname{sen}\theta\left(1+\cos\theta\right)d\theta
          $$

          $$
          = \left[-\cos\theta\right]_0^{\pi}
          + \left[\frac{\operatorname{sen}^{2}\theta}{2}\right]_0^{\pi}
          = 2 + 0 = 2
          $$

          El integrando, que en cartesianas asusta, se queda en
          $\operatorname{sen}\theta$ — y la integral en $\rho$ es la de una
          constante.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Un círculo centrado en el origen da $\rho$ constante; uno
              desplazado, como el de (e), da $\rho\le2a\cos\theta$ y hay que
              recorrer $\theta$ solo media vuelta.
          - texto: >-
              El $\rho$ del jacobiano no es un adorno: en (a) es lo que
              convierte una integral sin primitiva elemental en una inmediata.
          - texto: >-
              En (i), al escribir el integrando en polares se cancela con el
              $\rho$ del diferencial y queda $\operatorname{sen}\theta$.
          - texto: >-
              Y en (f) el recinto es un cuarto de círculo de radio $2$, así que
              basta con polares normales.
            trampa: true
            mensaje: |
              Es un cuarto de **elipse**: $x$ llega hasta $2\sqrt{1-y^{2}}$,
              con $y$ hasta $1$, o sea $\tfrac{x^{2}}{4}+y^{2}\le1$. Ahí hacen
              falta polares **generalizadas**, $x=2\rho\cos\theta$,
              $y=\rho\operatorname{sen}\theta$, con jacobiano $2\rho$.
        veredicto: |
          Tres avisos que valen para todo el tema: mirar si el círculo está
          centrado, mirar si es círculo o elipse, y no perder nunca el
          jacobiano de vista — es lo que hace que estas integrales existan.
    resolucion: |
      **Los nueve resultados.**

      | apartado | recinto | valor |
      |---|---|---|
      | (a) | disco unidad | $\pi(e-1)$ |
      | (b) | semidisco inferior | $\tfrac{\pi}{2}\operatorname{sen}(1)$ |
      | (c) | corona, $\lvert\theta\rvert\le\tfrac{\pi}{4}$ | $\tfrac{15}{4}$ |
      | (d) | disco de radio $\pi$ | $2\pi^{2}$ |
      | (e) | círculo desplazado | $\tfrac{3\pi}{2}$ |
      | (f) | cuarto de elipse | $\tfrac{3\pi}{8}$ |
      | (g) | círculo de radio $R$ | $\pi R^{2}$ |
      | (h) | elipse de semiejes $a,b$ | $\pi ab$ |
      | (i) | medio cardioide | $2$ |

      ### 1 · Los que solo cambian de coordenadas

      En (a), (b) y (d) el recinto es un disco centrado y el integrando depende
      solo de la distancia al origen, así que la integral en $\theta$ es un
      factor:

      $$
      \text{(a)}\;2\pi\!\int_0^{1}\!e^{\rho^{2}}\rho\,d\rho = \pi(e-1),
      \qquad
      \text{(d)}\;2\pi\!\int_0^{\pi}\!\rho\operatorname{sen}\rho\,d\rho
      = 2\pi^{2}
      $$

      En (b) el ángulo barrido es $\pi$ y no $2\pi$, de donde
      $\tfrac{\pi}{2}\operatorname{sen}(1)$.

      ### 2 · Los que además necesitan cabeza

      **(c)** $x^{2}-y^{2}=\rho^{2}\cos2\theta$, y la condición $-x\le y\le x$
      es $|\theta|\le\tfrac{\pi}{4}$:

      $$
      I = \frac{15}{4}\int_{-\pi/4}^{\pi/4}\cos2\theta\,d\theta = \frac{15}{4}
      $$

      **(e)** El círculo desplazado es $\rho\le2\cos\theta$ con
      $|\theta|\le\tfrac{\pi}{2}$, y sale $\tfrac{3\pi}{2}$.

      **(f)** Es un cuarto de la elipse $\tfrac{x^{2}}{4}+y^{2}\le1$. Con
      polares generalizadas $x=2\rho\cos\theta$,
      $y=\rho\operatorname{sen}\theta$ y jacobiano $2\rho$, sale
      $\tfrac{3\pi}{8}$.

      **(i)** El integrando se simplifica a $\operatorname{sen}\theta$ y queda
      $\int_0^{\pi}\operatorname{sen}\theta(1+\cos\theta)\,d\theta = 2$.

      ### 3 · Las dos áreas, que son la razón de todo

      $$
      \text{(g)}\;\int_0^{2\pi}\!\!\int_0^{R}\rho\,d\rho\,d\theta = \pi R^{2},
      \qquad
      \text{(h)}\;\int_0^{2\pi}\!\!\int_0^{1}ab\,\rho\,d\rho\,d\theta = \pi ab
      $$

      **Lo que hay que llevarse.** Antes de escribir nada, tres preguntas: ¿el
      recinto es redondo? ¿está centrado en el origen? ¿es círculo o elipse?
      Las tres respuestas juntas deciden entre polares, polares desplazadas y
      polares generalizadas, y equivocarse en cualquiera cuesta el ejercicio
      entero.

  - id: la-integral-de-gauss
    titulo: La campana de Gauss, que solo se puede integrar en el plano
    fuente: Ejercicio 7.12 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular el valor de la integral
      $I=\displaystyle\int_{-\infty}^{\infty} e^{-x^{2}}dx$.

      *Ayuda:* en lugar de calcular directamente $I$, obtener $I^{2}$
      utilizando coordenadas polares.
    pide: El valor de la integral.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el enunciado manda calcular $I^{2}$ y no $I$?
        opciones:
          - texto: >-
              Porque $e^{-x^{2}}$ **no tiene primitiva elemental**, y en cambio
              $I^{2}$ es una integral doble que en polares sí sale
            correcta: true
            mensaje: |
              Exacto. Es el truco más famoso del cálculo: subir de dimensión
              para poder bajar. El $\rho$ del jacobiano es lo que aparece de
              regalo y lo que hace la integral inmediata.
          - texto: >-
              Porque $I$ es negativa y hay que quitarle el signo
            mensaje: |
              $e^{-x^{2}}$ es positiva en toda la recta, así que $I$ también.
              El cuadrado no está ahí por el signo.
          - texto: >-
              Porque $I$ diverge y $I^{2}$ no
            mensaje: |
              $I$ converge: $e^{-x^{2}}$ decae más rápido que cualquier
              exponencial. El problema no es la convergencia, es la primitiva.

      - tipo: calcular
        titulo: El cuadrado
        pregunta: |
          $I^{2}=\displaystyle\iint_{\mathbb{R}^{2}} e^{-(x^{2}+y^{2})}dx\,dy$.
          ¿Cuánto vale?
        respuesta:
          tipo: numero
          valor: '3.1416'
          tolerancia: 0.004
          formato: en forma exacta (pi) o con cuatro decimales
        distractores:
          - valor: '6.2832'
            mensaje: |
              $2\pi$ es el doble. $\int_0^{\infty}e^{-\rho^{2}}\rho\,d\rho$ vale
              $\tfrac12$, no $1$: el cambio $t=\rho^{2}$ trae un $\tfrac12$.
          - valor: '1.5708'
            mensaje: |
              $\pi/2$ es la mitad. Has barrido medio plano; la integral doble va
              sobre **todo** $\mathbb{R}^{2}$, o sea $\theta$ de $0$ a $2\pi$.
        pista: |
          $\int_0^{\infty} e^{-\rho^{2}}\rho\,d\rho = \tfrac12$, con
          $t=\rho^{2}$.
        desarrollo: |
          El producto de dos integrales de una variable es una integral doble
          sobre todo el plano:

          $$
          I^{2}
          = \left(\int_{-\infty}^{\infty}e^{-x^{2}}dx\right)
            \left(\int_{-\infty}^{\infty}e^{-y^{2}}dy\right)
          = \iint_{\mathbb{R}^{2}} e^{-(x^{2}+y^{2})}dx\,dy
          $$

          $$
          = \int_0^{2\pi}\!\!\int_0^{\infty} e^{-\rho^{2}}\rho\,d\rho\,d\theta
          = 2\pi\cdot\frac12 = \pi
          $$

      - tipo: calcular
        titulo: Y la integral
        pregunta: |
          ¿Cuánto vale entonces $I$?
        respuesta:
          tipo: numero
          valor: '1.7725'
          tolerancia: 0.002
          formato: en forma exacta (sqrt(pi)) o con cuatro decimales
        distractores:
          - valor: '3.1416'
            mensaje: |
              Ese es $I^{2}$. Falta la raíz.
          - valor: '0.8862'
            mensaje: |
              $\tfrac{\sqrt{\pi}}{2}$ es
              $\int_0^{\infty}e^{-x^{2}}dx$, la mitad. El enunciado integra
              desde $-\infty$.
        pista: |
          $I>0$, así que de las dos raíces de $\pi$ hay que quedarse con la
          positiva.
        desarrollo: |
          $$
          I^{2} = \pi
          \quad\text{y}\quad I>0
          \quad\Longrightarrow\quad
          \boxed{\ I = \sqrt{\pi} \approx 1{,}7725\ }
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $e^{-x^{2}}$ no tiene primitiva elemental, así que la integral no
              se puede atacar por Barrow.
          - texto: >-
              El producto de dos integrales simples con variables distintas es
              una integral doble sobre el producto de los recintos: aquí, todo
              el plano.
          - texto: >-
              En polares ese plano es
              $\rho\in[0,\infty)$, $\theta\in[0,2\pi]$, y el jacobiano $\rho$
              convierte $e^{-\rho^{2}}$ en algo con primitiva inmediata.
          - texto: >-
              Y al final se toma la raíz, quedándose con la positiva porque el
              recinto de integración es simétrico.
            trampa: true
            mensaje: |
              La raíz se toma positiva porque **el integrando es positivo**, no
              por la simetría del recinto. Una integral de una función positiva
              es positiva; la simetría no dice nada sobre el signo.
        veredicto: |
          El truco es general y conviene tenerlo fichado: cuando una integral
          de una variable no sale, a veces sale su cuadrado, porque una doble
          admite cambios de variable que una simple no.
    resolucion: |
      **Datos.** $I=\int_{-\infty}^{\infty}e^{-x^{2}}dx$.

      ### 1 · Por qué hay que subir de dimensión

      $e^{-x^{2}}$ no tiene primitiva elemental. La función error, $\text{erf}$,
      se **define** como esa primitiva: no hay nada que sustituir en Barrow.

      ### 2 · El cuadrado

      $$
      I^{2} = \left(\int_{-\infty}^{\infty}e^{-x^{2}}dx\right)
              \left(\int_{-\infty}^{\infty}e^{-y^{2}}dy\right)
      = \iint_{\mathbb{R}^{2}} e^{-(x^{2}+y^{2})}\,dA
      $$

      El paso clave es que las dos variables son mudas e independientes, así
      que el producto de las dos simples **es** la doble sobre el plano entero.

      ### 3 · Polares

      $$
      I^{2} = \int_0^{2\pi}\!\!\int_0^{\infty} e^{-\rho^{2}}\rho\,d\rho\,d\theta
      = 2\pi\left[-\frac{e^{-\rho^{2}}}{2}\right]_0^{\infty}
      = 2\pi\cdot\frac12 = \pi
      $$

      $$
      \boxed{\ I = \sqrt{\pi} \approx 1{,}7725\ }
      $$

      ### 4 · Dónde está exactamente el truco

      En el $\rho$ del jacobiano. Sin él, el integrando sería
      $e^{-\rho^{2}}$ y estaríamos igual de atascados; con él, es
      $e^{-\rho^{2}}\rho$, cuya primitiva es inmediata.

      **Lo que hay que llevarse.** Cuando una integral no tiene primitiva, no
      siempre está perdida: **cambiar de dimensión cambia las herramientas
      disponibles**. Y este resultado concreto,
      $\int_{-\infty}^{\infty}e^{-x^{2}}dx=\sqrt{\pi}$, es el que normaliza la
      campana de Gauss y aparece en toda la estadística.

  - id: de-donde-sale-el-jacobiano-de-las-polares
    titulo: De dónde sale el ρ de las polares, y el ab de las generalizadas
    fuente: Ejercicio 7.9 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      (a) Demostrar que el Jacobiano del cambio de variables a coordenadas
      polares es $J=\rho$.

      (b) Demostrar que el Jacobiano del cambio de variables a coordenadas
      polares generalizadas es $J=\rho\,ab$.
    pide: Las dos demostraciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          El jacobiano que se usa en $dA = |J|\,d\rho\,d\theta$, ¿es
          $\dfrac{\partial(x,y)}{\partial(\rho,\theta)}$ o
          $\dfrac{\partial(\rho,\theta)}{\partial(x,y)}$?
        opciones:
          - texto: >-
              El primero: derivadas de las **viejas** respecto de las
              **nuevas**
            correcta: true
            mensaje: |
              Eso es. Se deriva lo que se sustituye. Como escribimos
              $x=\rho\cos\theta$ e $y=\rho\operatorname{sen}\theta$, las
              derivadas son de $x$ e $y$ respecto de $\rho$ y $\theta$.
          - texto: >-
              El segundo
            mensaje: |
              Ese es el inverso, y vale $1/\rho$. Si lo usaras, el área de un
              círculo saldría infinita cerca del origen en vez de $\pi R^{2}$.
          - texto: >-
              Cualquiera de los dos, porque son iguales
            mensaje: |
              Son **inversos** el uno del otro, no iguales:
              $\tfrac{\partial(\rho,\theta)}{\partial(x,y)}=\tfrac{1}{\rho}$.
              Solo coinciden si el jacobiano vale $\pm1$.

      - tipo: redactar
        consigna: |
          Escribe en papel la demostración del apartado (b): plantea el cambio
          a polares generalizadas, monta la matriz de derivadas parciales,
          calcula el determinante y simplifica hasta $\rho\,ab$. Tres o cuatro
          líneas.
        rubrica:
          - punto: >-
              El cambio escrito explícitamente: $x=a\rho\cos\theta$,
              $y=b\rho\operatorname{sen}\theta$.
            porque: >-
              Sin esa línea el corrector no sabe qué convenio usas, y hay más
              de uno: algunos textos ponen $a$ y $b$ dentro del radio en vez de
              fuera. Lo que se demuestra depende de lo que se ha escrito.
          - punto: >-
              La matriz $2\times2$ de derivadas parciales, con las cuatro
              entradas.
            porque: >-
              El jacobiano **es** ese determinante, y escribirlo es el paso que
              se puntúa. Saltar de las ecuaciones al resultado deja la
              demostración sin cuerpo.
          - punto: >-
              El determinante desarrollado:
              $ab\rho\cos^{2}\theta + ab\rho\operatorname{sen}^{2}\theta$, y la
              identidad fundamental para rematarlo.
            porque: >-
              Ahí se ve por qué el resultado no depende de $\theta$, que es lo
              que hace útil el cambio. Escribir directamente $ab\rho$ sin pasar
              por la identidad se lee como si te lo supieras de memoria en vez
              de haberlo deducido.
          - punto: >-
              El caso $a=b=1$ señalado al final, que recupera el apartado (a).
            porque: >-
              Es la comprobación de que lo demostrado en (b) contiene a (a), y
              cuesta media línea. Una demostración que no se contrasta con un
              caso conocido es una demostración a medias.
        veredicto: |
          Los dos apartados son la misma cuenta con dos constantes de más. Si
          escribes el (b), el (a) sale poniendo $a=b=1$ — y decirlo así es más
          elegante que repetir el determinante.

      - tipo: calcular
        titulo: El jacobiano, usado para algo
        pregunta: |
          Usa el resultado de (b) para calcular el área de la elipse de
          semiejes $a=3$ y $b=\tfrac12$.
        respuesta:
          tipo: numero
          valor: '4.7124'
          tolerancia: 0.006
          formato: en forma exacta (3pi/2) o con cuatro decimales
        distractores:
          - valor: '3.1416'
            mensaje: |
              $\pi$ es el área del círculo unidad, o sea lo que sale si te
              olvidas del $ab$ del jacobiano. Ese factor es exactamente lo que
              convierte el círculo en elipse.
          - valor: '9.4248'
            mensaje: |
              El doble. En polares generalizadas $\rho$ va de $0$ a $1$, no de
              $0$ a $2$: los semiejes ya están dentro del cambio.
        pista: |
          $A=\displaystyle\int_0^{2\pi}\!\!\int_0^{1} ab\,\rho\,d\rho\,d\theta$,
          porque en las variables nuevas la elipse es el disco unidad.
        desarrollo: |
          Con $x=a\rho\cos\theta$, $y=b\rho\operatorname{sen}\theta$, la elipse
          $\tfrac{x^{2}}{a^{2}}+\tfrac{y^{2}}{b^{2}}\le1$ es simplemente
          $\rho\le1$:

          $$
          A = \int_0^{2\pi}\!\!\int_0^{1} ab\,\rho\,d\rho\,d\theta
          = ab\cdot2\pi\cdot\frac12 = \pi ab
          $$

          Con $a=3$ y $b=\tfrac12$: $A = \tfrac{3\pi}{2}\approx4{,}7124$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El jacobiano que multiplica es
              $\tfrac{\partial(x,y)}{\partial(\rho,\theta)}$: las viejas
              derivadas respecto de las nuevas.
          - texto: >-
              Para las polares generalizadas la matriz es
              $\begin{pmatrix} a\cos\theta & -a\rho\operatorname{sen}\theta\\
              b\operatorname{sen}\theta & b\rho\cos\theta\end{pmatrix}$.
          - texto: >-
              Su determinante es
              $ab\rho\left(\cos^{2}\theta+\operatorname{sen}^{2}\theta\right)
              = ab\rho$, que no depende de $\theta$.
          - texto: >-
              Y como $ab\rho$ es positivo siempre, el valor absoluto del
              enunciado sobra.
            trampa: true
            mensaje: |
              $\rho\ge0$ y $a,b>0$, así que aquí sí es positivo — pero el valor
              absoluto **no sobra en general**: hay cambios perfectamente
              válidos con jacobiano negativo, como el del ejercicio 7.8, donde
              vale $-\tfrac34$. El signo solo indica que se invierte la
              orientación, y en una integral de área no interesa.
        veredicto: |
          El jacobiano tiene una lectura geométrica: es **cuánto estira las
          áreas** el cambio en cada punto. En polares crece con $\rho$ porque
          los sectores lejanos son más grandes; en las generalizadas,
          multiplica además por $ab$ porque el estiramiento de los ejes es
          uniforme.
    resolucion: |
      ### 1 · Polares

      $$
      x = \rho\cos\theta, \qquad y = \rho\operatorname{sen}\theta
      $$

      $$
      J = \frac{\partial(x,y)}{\partial(\rho,\theta)}
      = \begin{vmatrix}
      \cos\theta & -\rho\operatorname{sen}\theta\\
      \operatorname{sen}\theta & \rho\cos\theta
      \end{vmatrix}
      = \rho\cos^{2}\theta + \rho\operatorname{sen}^{2}\theta = \rho
      $$

      ### 2 · Polares generalizadas

      $$
      x = a\rho\cos\theta, \qquad y = b\rho\operatorname{sen}\theta
      $$

      $$
      J = \begin{vmatrix}
      a\cos\theta & -a\rho\operatorname{sen}\theta\\
      b\operatorname{sen}\theta & b\rho\cos\theta
      \end{vmatrix}
      = ab\rho\left(\cos^{2}\theta+\operatorname{sen}^{2}\theta\right)
      = ab\,\rho
      $$

      Con $a=b=1$ se recupera el apartado (a).

      ### 3 · Qué significa

      | cambio | $J$ | qué hace |
      |---|---|---|
      | polares | $\rho$ | los anillos lejanos son más largos |
      | polares generalizadas | $ab\rho$ | además estira los dos ejes |

      La comprobación de siempre: el área de la elipse.

      $$
      A = \int_0^{2\pi}\!\!\int_0^{1} ab\rho\,d\rho\,d\theta = \pi ab
      $$

      **Lo que hay que llevarse.** El jacobiano se deriva **de las viejas
      respecto de las nuevas**, y su valor absoluto mide cuánto estira las
      áreas el cambio. Recordar eso evita el error de invertirlo, que es el que
      hace que las cuentas salgan al revés sin que nada chirríe.

  - id: de-donde-salen-los-jacobianos-de-cilindricas-y-esfericas
    titulo: Los jacobianos de cilíndricas y esféricas, deducidos
    fuente: Ejercicio 7.13 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      (a) Demostrar que el Jacobiano del cambio de variables a coordenadas
      cilíndricas es $J=\rho$.

      (b) Demostrar que el Jacobiano del cambio de variables a coordenadas
      esféricas es $J=r^{2}\operatorname{sen}\varphi$.
    pide: Las dos demostraciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el jacobiano de las cilíndricas es el mismo que el de las
          polares?
        opciones:
          - texto: >-
              Porque las cilíndricas son las polares del plano más una $z$ que
              no se mezcla con nada
            correcta: true
            mensaje: |
              Eso es. La matriz $3\times3$ tiene una fila y una columna con un
              solo $1$, y al desarrollar por ella queda el determinante
              $2\times2$ de las polares.
          - texto: >-
              Por casualidad
            mensaje: |
              No: es estructural. Cuando un cambio deja una variable intacta,
              su jacobiano es el del cambio en las otras.
          - texto: >-
              Porque en las dos el volumen se conserva
            mensaje: |
              Ni en una ni en otra se conserva: por eso el jacobiano es $\rho$
              y no $1$. Un trozo de rejilla polar lejano ocupa más que uno
              cercano.

      - tipo: redactar
        consigna: |
          Escribe en papel la demostración del apartado (b): plantea el cambio
          a esféricas, monta la matriz $3\times3$ de derivadas parciales,
          desarrolla el determinante y simplifica hasta
          $r^{2}\operatorname{sen}\varphi$.
        rubrica:
          - punto: >-
              El convenio escrito: $x=r\operatorname{sen}\varphi\cos\theta$,
              $y=r\operatorname{sen}\varphi\operatorname{sen}\theta$,
              $z=r\cos\varphi$, diciendo que $\varphi$ se mide **desde el eje
              $z$**.
            porque: >-
              Hay dos convenios en circulación y en el otro el jacobiano lleva
              coseno en vez de seno. Sin declarar cuál usas, la demostración no
              demuestra nada.
          - punto: >-
              La matriz $3\times3$ completa, con las nueve derivadas.
            porque: >-
              Es el objeto que hay que calcular. Copiar el resultado sin la
              matriz es enunciar, no demostrar.
          - punto: >-
              El desarrollo del determinante por la fila o columna que más
              ceros tenga —la de $\theta$, que no aparece en $z$— y la
              simplificación con
              $\cos^{2}+\operatorname{sen}^{2}=1$ dos veces.
            porque: >-
              Elegir bien la fila convierte nueve productos en cuatro, y es
              justo lo que distingue una demostración que cabe en media
              página de una que se atasca.
          - punto: >-
              Una frase sobre el signo y sobre dónde se anula: $J\ge0$ porque
              $\varphi\in[0,\pi]$, y $J=0$ en el eje.
            porque: >-
              Explica por qué no hace falta el valor absoluto con ese convenio,
              y de paso por qué el eje $z$ es una singularidad del sistema de
              coordenadas — la misma que el origen en polares.
        veredicto: |
          Si el determinante te sale con signo negativo, casi siempre es que
          has ordenado las columnas como $(\theta,\varphi,r)$ en vez de
          $(r,\varphi,\theta)$. Cambiar dos columnas cambia el signo, y por eso
          en la fórmula del cambio de variable va el valor absoluto.

      - tipo: calcular
        titulo: El jacobiano, usado para algo
        pregunta: |
          Usa el jacobiano esférico para calcular el volumen de la bola de
          radio $2$.
        respuesta:
          tipo: numero
          valor: '33.5103'
          tolerancia: 0.02
          formato: en forma exacta (32pi/3) o con cuatro decimales
        distractores:
          - valor: '16.7552'
            mensaje: |
              La mitad. $\int_0^{\pi}\operatorname{sen}\varphi\,d\varphi = 2$,
              no $1$: $\varphi$ recorre de $0$ a $\pi$, no a $\tfrac{\pi}{2}$.
          - valor: '67.0206'
            mensaje: |
              El doble. Si has puesto $\varphi$ de $0$ a $2\pi$, estás dando
              dos vueltas al mismo sólido: con $\theta$ ya en $[0,2\pi]$, el
              ángulo polar solo llega a $\pi$.
        pista: |
          $\displaystyle\int_0^{2\pi}\!\!\int_0^{\pi}\!\!\int_0^{2}
          r^{2}\operatorname{sen}\varphi\,dr\,d\varphi\,d\theta$, y las tres
          integrales se separan.
        desarrollo: |
          $$
          V = \underbrace{\int_0^{2\pi}d\theta}_{2\pi}
          \underbrace{\int_0^{\pi}\operatorname{sen}\varphi\,d\varphi}_{2}
          \underbrace{\int_0^{2} r^{2}dr}_{8/3}
          = \frac{32\pi}{3} \approx 33{,}5103
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              En cilíndricas la $z$ no se mezcla con nada, así que el
              determinante $3\times3$ se reduce al $2\times2$ de las polares y
              vale $\rho$.
          - texto: >-
              En esféricas, con $\varphi$ medido desde el eje $z$, el
              determinante sale
              $r^{2}\operatorname{sen}\varphi$ tras usar dos veces la identidad
              fundamental.
          - texto: >-
              Como $\varphi\in[0,\pi]$, el seno es no negativo y el jacobiano
              tampoco: no hace falta valor absoluto.
          - texto: >-
              Y como $J$ se anula en $\varphi=0$ y $\varphi=\pi$, el eje $z$
              queda fuera del recinto de integración.
            trampa: true
            mensaje: |
              El eje $z$ **sí** está dentro del sólido; lo que pasa es que las
              coordenadas esféricas lo describen mal ahí —$\theta$ no está
              definido—, igual que las polares describen mal el origen. Que el
              jacobiano se anule en un conjunto de medida nula no quita ni
              añade nada a la integral.
        veredicto: |
          El $r^{2}\operatorname{sen}\varphi$ tiene una lectura física: $r^{2}$
          porque las capas lejanas son más grandes, y
          $\operatorname{sen}\varphi$ porque los paralelos se encogen al
          acercarse a los polos. Es la misma razón por la que Groenlandia
          parece enorme en un mapa.
    resolucion: |
      ### 1 · Cilíndricas

      $$
      x = \rho\cos\theta, \quad y = \rho\operatorname{sen}\theta, \quad z = z
      $$

      $$
      J = \begin{vmatrix}
      \cos\theta & -\rho\operatorname{sen}\theta & 0\\
      \operatorname{sen}\theta & \rho\cos\theta & 0\\
      0 & 0 & 1
      \end{vmatrix}
      = 1\cdot\begin{vmatrix}
      \cos\theta & -\rho\operatorname{sen}\theta\\
      \operatorname{sen}\theta & \rho\cos\theta
      \end{vmatrix}
      = \rho
      $$

      La tercera fila tiene dos ceros, así que el determinante se reduce al de
      las polares. **Cuando un cambio deja una variable intacta, su jacobiano
      es el del cambio en las demás.**

      ### 2 · Esféricas

      Con $\varphi$ medido desde el eje $z$:

      $$
      x = r\operatorname{sen}\varphi\cos\theta, \quad
      y = r\operatorname{sen}\varphi\operatorname{sen}\theta, \quad
      z = r\cos\varphi
      $$

      $$
      J = \begin{vmatrix}
      \operatorname{sen}\varphi\cos\theta &
      r\cos\varphi\cos\theta &
      -r\operatorname{sen}\varphi\operatorname{sen}\theta\\
      \operatorname{sen}\varphi\operatorname{sen}\theta &
      r\cos\varphi\operatorname{sen}\theta &
      r\operatorname{sen}\varphi\cos\theta\\
      \cos\varphi & -r\operatorname{sen}\varphi & 0
      \end{vmatrix}
      $$

      Desarrollando por la tercera fila, que tiene un cero:

      $$
      J = \cos\varphi\left(r^{2}\operatorname{sen}\varphi\cos\varphi\right)
      + r\operatorname{sen}\varphi
      \left(r\operatorname{sen}^{2}\varphi\right)
      $$

      $$
      = r^{2}\operatorname{sen}\varphi
      \left(\cos^{2}\varphi+\operatorname{sen}^{2}\varphi\right)
      = r^{2}\operatorname{sen}\varphi
      $$

      ### 3 · La comprobación

      $$
      V_{\text{bola}}
      = \int_0^{2\pi}\!\!\int_0^{\pi}\!\!\int_0^{R}
      r^{2}\operatorname{sen}\varphi\,dr\,d\varphi\,d\theta
      = 2\pi\cdot2\cdot\frac{R^{3}}{3} = \frac{4\pi R^{3}}{3}
      $$

      **Lo que hay que llevarse.** Los dos jacobianos se leen: $\rho$ dice que
      los anillos lejanos son más largos, y
      $r^{2}\operatorname{sen}\varphi$ dice además que los paralelos se
      encogen hacia los polos. Y el aviso de convenio: si $\varphi$ se mide
      desde el plano $xy$ en vez de desde el eje $z$, el jacobiano lleva
      **coseno**. Declarar cuál se usa es parte de la respuesta.

  - id: tres-triples-en-cilindricas
    titulo: Tres triples en cilíndricas, y la tapa que hay que restar
    fuente: Ejercicio 7.14 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Utilizando *coordenadas cilíndricas*, calcular las siguientes integrales:

      (a) $\displaystyle\iiint_R (x^{2}+y^{2})\,dx\,dy\,dz$, $R$: sólido
      delimitado por $x^{2}+y^{2}=3z$ y $z=3$.

      (b) $\displaystyle\iiint_R (x^{4}+2x^{2}y^{2}+y^{4})\,dx\,dy\,dz$, $R$:
      sólido delimitado por el cilindro $x^{2}+y^{2}=1$ y por los planos
      $z=0$, $z=1$.

      (c) $\displaystyle\iiint_R \sqrt{x^{2}+y^{2}}\,dx\,dy\,dz$, $R$: sólido
      delimitado por el paraboloide $z=4-x^{2}-y^{2}$ y los planos $y>0$,
      $z>0$.
    pide: El valor de las tres integrales.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado (b) el integrando es
          $x^{4}+2x^{2}y^{2}+y^{4}$. ¿Qué conviene ver antes de sustituir?
        opciones:
          - texto: >-
              Que es $\left(x^{2}+y^{2}\right)^{2}$, o sea $\rho^{4}$
            correcta: true
            mensaje: |
              Eso es. Escrito así asusta; reconocido como un cuadrado perfecto,
              la integral es de las más cortas del boletín.
          - texto: >-
              Que se puede separar en tres integrales
            mensaje: |
              Se puede, pero es el camino largo: tres integrales de $\rho^{5}$
              con potencias distintas de seno y coseno, cuando el cuadrado
              perfecto lo deja en una.
          - texto: >-
              Que es impar y se anula
            mensaje: |
              Es una suma de potencias pares: positiva en todas partes salvo en
              el origen. No se anula nada.

      - tipo: calcular
        titulo: El apartado (a)
        pregunta: |
          $\displaystyle\iiint_R (x^{2}+y^{2})\,dV$ entre el paraboloide
          $x^{2}+y^{2}=3z$ y el plano $z=3$.
        respuesta:
          tipo: numero
          valor: '127.2345'
          tolerancia: 0.05
          formato: en forma exacta (81pi/2) o con cuatro decimales
        distractores:
          - valor: '381.7035'
            mensaje: |
              $121{,}5\pi$ es el **cilindro** de radio $3$ y altura $3$: has
              integrado desde $z=0$. El suelo del sólido es el paraboloide, que
              sube hasta $z=3$ en el borde.
          - valor: '67.8584'
            mensaje: |
              Te has dejado el $\rho$ del jacobiano. El integrando completo es
              $\rho^{2}\cdot\rho$, no $\rho^{2}$ a secas.
        pista: |
          El paraboloide corta a $z=3$ en $\rho=3$, y para cada $\rho$ la $z$ va
          de $\tfrac{\rho^{2}}{3}$ a $3$.
        desarrollo: |
          $$
          I = \int_0^{2\pi}\!\!\int_0^{3}\!\!\int_{\rho^{2}/3}^{3}
          \rho^{2}\cdot\rho\;dz\,d\rho\,d\theta
          = 2\pi\int_0^{3}\rho^{3}\left(3-\frac{\rho^{2}}{3}\right)d\rho
          $$

          $$
          = 2\pi\left[\frac{3\cdot81}{4}-\frac{729}{18}\right]
          = 2\pi\cdot\frac{81}{4}
          = \frac{81\pi}{2} \approx 127{,}2345
          $$

      - tipo: calcular
        titulo: El apartado (c)
        pregunta: |
          $\displaystyle\iiint_R \sqrt{x^{2}+y^{2}}\,dV$ bajo el paraboloide
          $z=4-x^{2}-y^{2}$, con $y>0$ y $z>0$.
        respuesta:
          tipo: numero
          valor: '13.4041'
          tolerancia: 0.02
          formato: en forma exacta (64pi/15) o con cuatro decimales
        distractores:
          - valor: '26.8083'
            mensaje: |
              El doble: has barrido $\theta$ de $0$ a $2\pi$. La condición
              $y>0$ deja solo el semiplano superior, o sea media vuelta.
          - valor: '12.5664'
            mensaje: |
              $4\pi$ sale sin el $\rho$ del jacobiano. El integrando completo es
              $\rho\cdot\rho=\rho^{2}$.
        pista: |
          $z>0$ obliga a $\rho\le2$, e $y>0$ deja $\theta\in[0,\pi]$.
        desarrollo: |
          $$
          I = \int_0^{\pi}\!\!\int_0^{2}\!\!\int_0^{4-\rho^{2}}
          \rho\cdot\rho\;dz\,d\rho\,d\theta
          = \pi\int_0^{2}\rho^{2}\left(4-\rho^{2}\right)d\rho
          $$

          $$
          = \pi\left[\frac{32}{3}-\frac{32}{5}\right]
          = \frac{64\pi}{15} \approx 13{,}4041
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Los tres sólidos tienen eje de simetría vertical, que es
              exactamente la señal de las cilíndricas.
          - texto: >-
              En (a) el sólido está **entre** el paraboloide y el plano
              $z=3$, así que la $z$ va de $\tfrac{\rho^{2}}{3}$ a $3$, no de
              $0$ a $3$.
          - texto: >-
              En (b) el integrando es $\left(x^{2}+y^{2}\right)^{2}=\rho^{4}$,
              y con el jacobiano queda $\rho^{5}$, que da $\tfrac{\pi}{3}$.
          - texto: >-
              Y en (c) la condición $y>0$ no afecta al resultado, porque el
              integrando $\sqrt{x^{2}+y^{2}}$ no depende del ángulo.
            trampa: true
            mensaje: |
              Que el integrando no dependa de $\theta$ es justo lo que hace que
              el ángulo entre como **factor multiplicativo**: con media vuelta
              sale la mitad. Lo que no afectaría es una condición que no
              recortara ángulo, como $z>0$ aquí.
        veredicto: |
          Las cilíndricas convierten estos tres ejercicios en integrales de
          potencias de $\rho$. Todo el trabajo está en leer los límites de
          $z$ —qué es suelo y qué es tapa— y en no perder el jacobiano.
    resolucion: |
      **Los tres resultados.**

      | apartado | valor |
      |---|---|
      | (a) | $\tfrac{81\pi}{2}\approx127{,}23$ |
      | (b) | $\tfrac{\pi}{3}\approx1{,}05$ |
      | (c) | $\tfrac{64\pi}{15}\approx13{,}40$ |

      ### 1 · (a) Entre el paraboloide y la tapa

      El paraboloide $z=\tfrac{\rho^{2}}{3}$ corta a $z=3$ en $\rho=3$.

      $$
      I = 2\pi\int_0^{3}\rho^{3}\left(3-\frac{\rho^{2}}{3}\right)d\rho
      = \frac{81\pi}{2}
      $$

      ### 2 · (b) El cuadrado perfecto

      $$
      x^{4}+2x^{2}y^{2}+y^{4} = \left(x^{2}+y^{2}\right)^{2} = \rho^{4}
      $$

      $$
      I = \int_0^{2\pi}\!\!\int_0^{1}\!\!\int_0^{1}\rho^{5}\,dz\,d\rho\,d\theta
      = 2\pi\cdot\frac16 = \frac{\pi}{3}
      $$

      ### 3 · (c) Media vuelta

      $$
      I = \pi\int_0^{2}\rho^{2}\left(4-\rho^{2}\right)d\rho = \frac{64\pi}{15}
      $$

      **Lo que hay que llevarse.** Antes de cambiar de coordenadas, **mirar si
      el integrando es una potencia de $x^{2}+y^{2}$ disfrazada**. En (b) el
      disfraz es un cuadrado perfecto y quitarlo convierte cinco minutos de
      cuentas en una línea.

  - id: tres-triples-en-esfericas
    titulo: Tres triples en esféricas, y la que viene escrita en cartesianas
    fuente: Ejercicio 7.15 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Utilizando *coordenadas esféricas*, calcular las siguientes integrales:

      (a) $\displaystyle\iiint_R \sqrt{x^{2}+y^{2}+z^{2}}\,dx\,dy\,dz$, $R$:
      sólido esférico $x^{2}+y^{2}+z^{2}=25$.

      (b) $\displaystyle\int_0^{1}\!\!\int_0^{\sqrt{1-x^{2}}}
      \!\!\int_0^{\sqrt{1-x^{2}-y^{2}}}
      \left(x^{2}+y^{2}+z^{2}\right)^{2}dz\,dy\,dx$

      (c) $\displaystyle\iiint_S (xyz)\,dx\,dy\,dz$, $S$: sólido delimitado por
      las condiciones $x^{2}+y^{2}+z^{2}\le R^{2}$, $x\ge0$, $y\ge0$ y
      $z\ge0$.
    pide: El valor de las tres integrales.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado (b) viene en cartesianas, con tres raíces encajadas. ¿Qué
          sólido es?
        opciones:
          - texto: >-
              El **primer octante** de la bola unidad, o sea un octavo
            correcta: true
            mensaje: |
              Eso es: las tres variables van de $0$ hacia arriba y cada límite
              recorta la esfera. Reconocerlo es todo el ejercicio; lo demás es
              separar tres integrales.
          - texto: >-
              El cubo unidad
            mensaje: |
              Los límites de $y$ y de $z$ son raíces, no constantes. Solo el de
              $x$ es fijo.
          - texto: >-
              La media bola superior
            mensaje: |
              Sería la media bola si $x$ e $y$ recorrieran valores negativos
              también. Aquí las tres empiezan en $0$: es un octavo.

      - tipo: calcular
        titulo: El apartado (a)
        pregunta: |
          $\displaystyle\iiint_R \sqrt{x^{2}+y^{2}+z^{2}}\,dV$ sobre la bola de
          radio $5$.
        respuesta:
          tipo: numero
          valor: '1963.4954'
          tolerancia: 0.5
          formato: en forma exacta (625pi) o con cuatro decimales
        distractores:
          - valor: '1570.7963'
            mensaje: |
              $500\pi$ sale de $\int_0^{5}r^{3}dr=\tfrac{5^{4}}{5}$. La
              primitiva de $r^{3}$ es $\tfrac{r^{4}}{4}$, no
              $\tfrac{r^{4}}{5}$.
          - valor: '523.5988'
            mensaje: |
              $\tfrac{500\pi}{3}$ es el **volumen** de la bola. Aquí el
              integrando es $r$, no $1$.
        pista: |
          El integrando es $r$ y el jacobiano
          $r^{2}\operatorname{sen}\varphi$, así que dentro queda $r^{3}$ y las
          tres integrales se separan.
        desarrollo: |
          $$
          I = \underbrace{\int_0^{2\pi}\!d\theta}_{2\pi}
          \underbrace{\int_0^{\pi}\!\operatorname{sen}\varphi\,d\varphi}_{2}
          \underbrace{\int_0^{5}\! r^{3}dr}_{625/4}
          = 4\pi\cdot\frac{625}{4} = 625\pi
          $$

          $625\pi \approx 1963{,}4954$.

      - tipo: calcular
        titulo: El apartado (c), con R = 2
        pregunta: |
          $\displaystyle\iiint_S xyz\,dV$ sobre el octante de la bola de radio
          $R=2$.
        respuesta:
          tipo: numero
          valor: '1.3333'
          tolerancia: 0.006
          formato: en forma exacta (R^6/48) o con cuatro decimales
        distractores:
          - valor: '1.7778'
            mensaje: |
              $\tfrac{R^{6}}{36}$ sale con $\operatorname{sen}^{2}\varphi$ en
              vez de $\operatorname{sen}^{3}$. El jacobiano aporta **un tercer**
              seno, además de los dos que traen $x$ e $y$.
          - valor: '2.6667'
            mensaje: |
              $\tfrac{R^{6}}{24}$ sale si tomas
              $\int_0^{\pi/2}\operatorname{sen}\theta\cos\theta\,d\theta=1$.
              Vale $\tfrac12$.
        pista: |
          $xyz = r^{3}\operatorname{sen}^{2}\varphi\cos\varphi
          \operatorname{sen}\theta\cos\theta$, y con el jacobiano queda
          $r^{5}\operatorname{sen}^{3}\varphi\cos\varphi
          \operatorname{sen}\theta\cos\theta$.
        desarrollo: |
          $$
          I = \underbrace{\int_0^{\pi/2}\!\operatorname{sen}\theta\cos\theta
          \,d\theta}_{1/2}
          \underbrace{\int_0^{\pi/2}\!\operatorname{sen}^{3}\varphi\cos\varphi
          \,d\varphi}_{1/4}
          \underbrace{\int_0^{R}\! r^{5}dr}_{R^{6}/6}
          = \frac{R^{6}}{48}
          $$

          Con $R=2$: $\tfrac{64}{48}=\tfrac43\approx1{,}3333$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Cuando el sólido es una bola centrada y el integrando depende
              solo de la distancia al centro, las tres integrales esféricas se
              separan en un producto.
          - texto: >-
              El apartado (b) está escrito en cartesianas, pero sus límites
              describen el primer octante de la bola unidad: se pasa a
              esféricas y sale $\tfrac{\pi}{14}$.
          - texto: >-
              En (c) el integrando $xyz$ trae dos senos y un coseno de
              $\varphi$, y el jacobiano añade otro seno.
          - texto: >-
              Y como el octante es un octavo de la bola, el resultado de (c)
              es un octavo del que daría la bola entera.
            trampa: true
            mensaje: |
              Sobre la bola entera, $\iiint xyz\,dV = 0$ por simetría —el
              integrando es impar en las tres variables—, así que su octava
              parte sería $0$ y no $\tfrac{R^{6}}{48}$. La regla de «un octavo»
              solo vale para integrandos que no cambian de signo al reflejar,
              como el $1$ del volumen o el $r$ del apartado (a).
        veredicto: |
          Dos reglas. Una: cuando el recinto es una bola centrada y el
          integrando depende solo de $r$, la triple se separa en tres simples.
          Y otra: la fracción del sólido solo se puede aplicar al resultado si
          el integrando tiene la misma simetría que el recinto.
    resolucion: |
      **Los tres resultados.**

      | apartado | valor |
      |---|---|
      | (a) | $625\pi \approx 1963{,}50$ |
      | (b) | $\tfrac{\pi}{14}\approx0{,}2244$ |
      | (c) | $\tfrac{R^{6}}{48}$ |

      ### 1 · (a) Todo se separa

      $$
      I = 2\pi\cdot 2\cdot\int_0^{5}r^{3}dr = 4\pi\cdot\frac{625}{4} = 625\pi
      $$

      ### 2 · (b) Reconocer el octante

      Los límites $0\le x\le1$, $0\le y\le\sqrt{1-x^{2}}$,
      $0\le z\le\sqrt{1-x^{2}-y^{2}}$ describen un octavo de la bola unidad.

      $$
      I = \frac18\int_0^{2\pi}\!\!\int_0^{\pi}\!\!\int_0^{1}
      r^{4}\cdot r^{2}\operatorname{sen}\varphi\,dr\,d\varphi\,d\theta
      = \frac18\cdot4\pi\cdot\frac17 = \frac{\pi}{14}
      $$

      ### 3 · (c) El integrando con tres factores

      $$
      xyz = r^{3}\operatorname{sen}^{2}\varphi\cos\varphi
      \operatorname{sen}\theta\cos\theta
      $$

      Multiplicado por el jacobiano $r^{2}\operatorname{sen}\varphi$:

      $$
      I = \frac12\cdot\frac14\cdot\frac{R^{6}}{6} = \frac{R^{6}}{48}
      $$

      **Lo que hay que llevarse.** El aviso está en (b): **una integral escrita
      en cartesianas puede ser un ejercicio de esféricas disfrazado**. Antes de
      empezar a integrar raíces encajadas, mira qué sólido describen los
      límites — casi siempre es una figura con nombre.

  - id: el-cilindro-cortado-por-un-plano-inclinado
    titulo: Un cilindro cortado en diagonal, y la simetría que borra dos términos
    fuente: Ejercicio 7.16 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU (2013/2014 3E AT)
    nivel: practica
    enunciado: |
      Sea el sólido $S$ definido por las condiciones $x+y+z\le3$,
      $x^{2}+y^{2}\le1$ y $z\ge0$.

      (a) Calcular el volumen de $S$.

      (b) Si la densidad de $S$ viene dada por la función
      $f(x,y,z)=x^{2}+y^{2}$, calcular su masa.
    pide: El volumen y la masa del sólido.
    pasos:
      - tipo: reconocer
        pregunta: |
          El plano $x+y+z=3$ hace de tapa. ¿Corta al cilindro por debajo de
          $z=0$ en algún punto?
        opciones:
          - texto: >-
              No: sobre el disco unidad, $x+y$ no baja de $-\sqrt2$, así que la
              tapa $z=3-x-y$ es siempre positiva
            correcta: true
            mensaje: |
              Exacto, y comprobarlo es obligatorio: si la tapa cortara el
              suelo, el sólido habría que partirlo y la integral serían dos.
              Aquí $3-x-y$ vale como poco $3-\sqrt2\approx1{,}59$.
          - texto: >-
              Sí, en el borde $x=y=1$
            mensaje: |
              El punto $(1,1)$ no está en el disco unidad: $1+1=2>1$. El máximo
              de $x+y$ sobre $x^{2}+y^{2}\le1$ es $\sqrt2$.
          - texto: >-
              No se puede saber sin integrar
            mensaje: |
              Sí se puede, y es una cuenta de diez segundos: el máximo de
              $x+y$ sobre el disco unidad es $\sqrt2$, y $3-\sqrt2>0$.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen de $S$?
        respuesta:
          tipo: numero
          valor: '9.4248'
          tolerancia: 0.02
          formato: en forma exacta (3pi) o con cuatro decimales
        distractores:
          - valor: '6.2832'
            mensaje: |
              Parece que has restado algo a la altura. El valor medio de
              $x+y$ sobre el disco unidad es **cero** por simetría, así que la
              altura media es exactamente $3$ y el volumen es el del cilindro
              de altura $3$.
          - valor: '4.7124'
            mensaje: |
              Esa es la masa del apartado (b). El volumen integra $1$; la masa,
              $x^{2}+y^{2}$.
        pista: |
          $V=\displaystyle\iint_{\rho\le1}\left(3-x-y\right)dA$, y los dos
          términos lineales se anulan por simetría.
        desarrollo: |
          $$
          V = \iint_{x^{2}+y^{2}\le1}\left(3-x-y\right)dA
          = 3\pi - \underbrace{\iint x\,dA}_{0} - \underbrace{\iint y\,dA}_{0}
          $$

          $$
          V = 3\pi \approx 9{,}4248
          $$

          El plano inclinado quita por un lado exactamente lo que añade por el
          otro.

      - tipo: calcular
        titulo: La masa
        pregunta: |
          Con densidad $f(x,y,z)=x^{2}+y^{2}$, ¿cuánto vale la masa?
        respuesta:
          tipo: numero
          valor: '4.7124'
          tolerancia: 0.01
          formato: en forma exacta (3pi/2) o con cuatro decimales
        distractores:
          - valor: '9.4248'
            mensaje: |
              Ese es el volumen. La masa integra la densidad, no el $1$.
          - valor: '1.5708'
            mensaje: |
              $\tfrac{\pi}{2}$ es $\iint\rho^{2}dA$ sobre el disco, sin
              multiplicar por la altura de la columna, que vale $3$ de media.
        pista: |
          $M=\displaystyle\iint_{\rho\le1}\rho^{2}\left(3-x-y\right)dA$, y otra
          vez los términos lineales desaparecen — ahora porque
          $\rho^{2}x$ y $\rho^{2}y$ siguen siendo impares.
        desarrollo: |
          $$
          M = \iint_{\rho\le1}\left(x^{2}+y^{2}\right)\left(3-x-y\right)dA
          = 3\iint\rho^{2}\,dA
          $$

          $$
          = 3\int_0^{2\pi}\!\!\int_0^{1}\rho^{3}\,d\rho\,d\theta
          = 3\cdot2\pi\cdot\frac14 = \frac{3\pi}{2} \approx 4{,}7124
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Lo primero es comprobar que la tapa $z=3-x-y$ no baja de $0$
              sobre el disco: su mínimo es $3-\sqrt2>0$.
          - texto: >-
              Al integrar $3-x-y$ sobre el disco, los dos términos lineales se
              anulan porque el disco es simétrico respecto de los dos ejes.
          - texto: >-
              En la masa pasa lo mismo: $\rho^{2}x$ y $\rho^{2}y$ siguen siendo
              impares, así que solo sobrevive el $3\rho^{2}$.
          - texto: >-
              Y por eso el sólido cortado en diagonal tiene el mismo centro de
              gravedad que el cilindro recto de altura $3$.
            trampa: true
            mensaje: |
              El **volumen** coincide, pero el centro de gravedad no: el sólido
              es más alto por el lado de $x+y$ negativo, así que su centro se
              corre hacia allí. La simetría anula $\iint x\,dA$, no
              $\iiint x\,dV$ — que lleva la altura dentro y sí depende de la
              inclinación.
        veredicto: |
          La simetría es la herramienta más rentable del tema, pero hay que
          mirar **el integrando completo**, altura incluida. Aquí anula dos
          términos en el volumen y dos en la masa, y no anularía nada en un
          centro de gravedad.
    resolucion: |
      **Datos.** $S$: cilindro $x^{2}+y^{2}\le1$, suelo $z=0$, tapa el plano
      $x+y+z=3$.

      ### 1 · La comprobación previa

      $$
      \min_{x^{2}+y^{2}\le1}\left(3-x-y\right) = 3-\sqrt2 \approx 1{,}59 > 0
      $$

      La tapa no corta al suelo: el sólido es una sola pieza y basta una
      integral.

      ### 2 · El volumen

      $$
      V = \iint_{\rho\le1}\left(3-x-y\right)dA = 3\pi
      $$

      Los términos $x$ e $y$ se anulan por simetría del disco. **El plano
      inclinado quita por un lado lo que añade por el otro**, y el volumen es
      el del cilindro recto de altura $3$.

      ### 3 · La masa

      $$
      M = \iint_{\rho\le1}\rho^{2}\left(3-x-y\right)dA
      = 3\int_0^{2\pi}\!\!\int_0^{1}\rho^{3}d\rho\,d\theta
      = \frac{3\pi}{2}
      $$

      ### 4 · La lectura

      | magnitud | valor | qué dice |
      |---|---|---|
      | $V$ | $3\pi\approx9{,}42$ | igual que el cilindro recto |
      | $M$ | $\tfrac{3\pi}{2}\approx4{,}71$ | densidad media $\tfrac12$ |

      La densidad media es $M/V = \tfrac12$, que es exactamente el valor medio
      de $\rho^{2}$ sobre el disco unidad. Coherente.

      **Lo que hay que llevarse.** Dos hábitos. Comprobar que la tapa no corta
      al suelo **antes** de integrar, porque si lo hiciera el ejercicio sería
      otro. Y buscar términos impares sobre recintos simétricos: aquí borran
      dos sumandos en cada apartado sin escribir una sola primitiva.

  - id: el-cuenco-parabolico-con-tapa-esferica
    titulo: Un cuenco con tapa de esfera, y las dos áreas que hay que sumar
    fuente: Ejercicio 7.17 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU (2015/2016 6E)
    nivel: practica
    enunciado: |
      Considerar el sólido delimitado por las condiciones $x^{2}+y^{2}\le z$ y
      $x^{2}+y^{2}+z^{2}\le6$. Dibujar el sólido y calcular el área de su
      superficie.
    pide: El dibujo del sólido y el área total de su superficie.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde se cortan el paraboloide y la esfera?
        opciones:
          - texto: >-
              En $z=2$, con radio $\rho=\sqrt2$
            correcta: true
            mensaje: |
              Eso es: sustituyendo $\rho^{2}=z$ en $\rho^{2}+z^{2}=6$ queda
              $z^{2}+z-6=0$, cuyas raíces son $2$ y $-3$. Solo $z=2$ vale,
              porque el paraboloide vive en $z\ge0$.
          - texto: >-
              En $z=\sqrt6$, el polo de la esfera
            mensaje: |
              Ese es el punto más alto de la esfera, que está **por encima** de
              la intersección. El corte se calcula igualando las dos
              ecuaciones.
          - texto: >-
              En $z=3$
            mensaje: |
              $z=-3$ es la otra raíz de $z^{2}+z-6=0$, y hay que descartarla:
              el paraboloide $z=\rho^{2}$ nunca toma valores negativos.

      - tipo: calcular
        titulo: El casquete esférico
        pregunta: |
          ¿Cuánto vale el área de la parte esférica de la superficie?
        respuesta:
          tipo: numero
          valor: '6.9179'
          tolerancia: 0.01
          formato: en forma exacta (2pi(6-2sqrt(6))) o con cuatro decimales
        distractores:
          - valor: '75.3982'
            mensaje: |
              $4\pi\cdot6$ es la esfera **entera** de radio $\sqrt6$. Aquí solo
              entra el casquete por encima de $z=2$.
          - valor: '13.6136'
            mensaje: |
              Ese es el trozo de **paraboloide**, la otra mitad del ejercicio.
        pista: |
          El área de un casquete esférico de radio $R$ y altura $h$ es
          $2\pi R h$, y aquí $h = \sqrt6 - 2$.
        desarrollo: |
          El casquete va de $z=2$ al polo $z=\sqrt6$, así que su altura es
          $h=\sqrt6-2$:

          $$
          A_{\text{esf}} = 2\pi R h = 2\pi\sqrt6\left(\sqrt6-2\right)
          = 2\pi\left(6-2\sqrt6\right) \approx 6{,}9179
          $$

      - tipo: calcular
        titulo: El paraboloide, y el total
        pregunta: |
          Suma el trozo de paraboloide y da el área **total** de la superficie.
        respuesta:
          tipo: numero
          valor: '20.5315'
          tolerancia: 0.02
          formato: con cuatro decimales
        distractores:
          - valor: '13.6136'
            mensaje: |
              Esa es solo la parte parabólica. El sólido tiene **dos** caras y
              el enunciado pide el área de su superficie, o sea las dos.
          - valor: '6.9179'
            mensaje: |
              Esa es solo la tapa esférica. Falta el cuenco.
        pista: |
          $A_{\text{par}}=\displaystyle\int_0^{2\pi}\!\!\int_0^{\sqrt2}
          \sqrt{1+4\rho^{2}}\;\rho\,d\rho\,d\theta$.
        desarrollo: |
          Sobre $z=\rho^{2}$ el factor de área es $\sqrt{1+4\rho^{2}}$:

          $$
          A_{\text{par}}
          = 2\pi\left[\frac{\left(1+4\rho^{2}\right)^{3/2}}{12}\right]_0^{\sqrt2}
          = 2\pi\cdot\frac{27-1}{12}
          = 2\pi\cdot\frac{13}{6} \approx 13{,}6136
          $$

          $$
          A = 2\pi\left(6-2\sqrt6\right) + 2\pi\cdot\frac{13}{6}
          \approx 6{,}9179 + 13{,}6136 = 20{,}5315
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Las dos superficies se cortan donde $z^{2}+z-6=0$ con $z\ge0$, o
              sea en $z=2$ y $\rho=\sqrt2$.
          - texto: >-
              El sólido tiene dos caras: el cuenco parabólico por abajo y el
              casquete esférico por arriba, así que el área es la suma.
          - texto: >-
              El casquete se puede calcular con la fórmula $2\pi R h$, que no
              necesita integrar.
          - texto: >-
              Y como las dos superficies se juntan en la circunferencia
              $\rho=\sqrt2$, la circunferencia hay que contarla una vez en el
              área.
            trampa: true
            mensaje: |
              Una curva no tiene área. La circunferencia de empalme es el borde
              común de las dos caras y no aporta nada a la suma: en una
              integral de superficie, un conjunto de dimensión $1$ tiene medida
              nula.
        veredicto: |
          «El área de su superficie» significa **todas** las caras. Este sólido
          tiene dos, y cada una pide una técnica distinta: la esférica sale de
          una fórmula, la parabólica de una integral.
      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 416 201" role="img" width="416" height="201"
               aria-labelledby="f-cuenco-esfera-t f-cuenco-esfera-d">
            <title id="f-cuenco-esfera-t">El cuenco parabólico con tapa esférica, y el disco de radio raíz de dos</title>
            <desc id="f-cuenco-esfera-d">A la izquierda, el corte por el plano y igual a cero: la parábola z igual a x al cuadrado, que sale en punta del origen, y encima el arco de la circunferencia de radio raíz de seis, unos dos coma cuarenta y cinco. Se cortan a la altura dos, en x igual a más y menos raíz de dos. Entre las dos queda la sección del sólido. A la derecha, la proyección sobre el plano XY: el disco de radio raíz de dos.</desc>
            <style>
                .f-cuenco-esfera-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
                .f-cuenco-esfera-c { stroke: var(--d1); stroke-width: 2.8; fill: none; }
