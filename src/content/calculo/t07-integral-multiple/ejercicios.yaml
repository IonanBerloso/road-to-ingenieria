          </svg>
        consigna: |
          Dibuja los seis recintos, cada uno en unos ejes pequeños etiquetados
          con su letra. Todos son rectángulos.
        comprueba:
          - punto: |
              Que (a) y (b) tienen **el mismo** recinto,
              $\left[0,1\right]\times\left[0,2\right]$.
            porque: |
              Lo único que cambia entre los dos apartados es el orden de
              integración, no el recinto. Dibujarlos distintos delata que se han
              leído mal los límites.
          - punto: |
              En (a) y (b), leer bien qué variable va de $0$ a $1$: la del
              diferencial **interior**.
            porque: |
              En $\int_0^2\int_0^1 \ldots dx\,dy$ el $dx$ va de $0$ a $1$ y el
              $dy$ de $0$ a $2$. Cruzarlos es el error que este par de apartados
              está puesto para provocar.
          - punto: |
              En (c) y (d), el rectángulo
              $\left[-1,1\right]\times\left[0,1\right]$, con una de las
              variables tomando valores **negativos**.
            porque: |
              Ese intervalo simétrico es lo que anula la integral de la parte
              impar del integrando. Verlo en el dibujo ahorra la mitad de las
              cuentas.
          - punto: |
              En (f), el rectángulo
              $\left[0,\tfrac\pi4\right]\times\left[0,\tfrac\pi2\right]$, con los
              dos lados distintos.
            porque: |
              Los límites no son iguales aunque los dos lleven $\pi$. Y el
              integrando no depende de $y$, así que la integral exterior es solo
              multiplicar por la longitud $\tfrac\pi2$.
        veredicto: |
          Sobre un rectángulo el orden **no** cambia el resultado, y ese es el
          punto de los apartados (a) y (b): dos caminos, el mismo número. Lo que
          sí cambia es cuánto trabajo cuesta, y el dibujo no decide eso — lo
          decide el integrando.

    resolucion: |
      **Los seis resultados.**

      | apartado | valor |
      |---|---|
      | (a) | $11$ |
      | (b) | $8$ |
      | (c) | $2$ |
      | (d) | $1$ |
      | (e) | $(e-1)^{2}$ |
      | (f) | $\pi/8$ |

      ### 1 · El par (a)–(b), que es el ejercicio de verdad

      $$
      \int_0^2\!\!\int_0^1 (1+x+4y)\,dx\,dy
      = \int_0^2\left(\frac32+4y\right)dy = 11
      $$

      $$
      \int_0^2\!\!\int_0^1 (1+x+4y)\,dy\,dx
      = \int_0^2 (3+x)\,dx = 8
      $$

      Mismos números, mismo integrando, distinto resultado — porque el recinto
      **no es el mismo**: en el primero $x\in[0,1]$ e $y\in[0,2]$; en el
      segundo, al revés.

      ### 2 · El par (c)–(d), que enseña otra cosa

      $$
      \int_0^1\!\!\int_{-1}^1 (2x^{3}+4y^{3})\,dx\,dy
      $$

      Al integrar en $x$ sobre $[-1,1]$, el $2x^{3}$ **se anula por impar** y
      queda $\int_0^1 8y^{3}dy = 2$. En (d) se anula el otro sumando y queda
      $\int_0^1 4x^{3}dx = 1$.

      ### 3 · (e), que se separa

      $$
      \int_0^1\!\!\int_0^1 e^{x}e^{y}\,dx\,dy
      = \left(\int_0^1 e^{x}dx\right)^{2} = (e-1)^{2}
      $$

      **Lo que hay que llevarse.** Dos reglas que ahorran cuentas. La primera:
      cuando el integrando es un **producto de una función de $x$ por una de
      $y$** y los límites son constantes, la doble es el producto de dos
      simples. La segunda: sobre un intervalo simétrico, todo sumando impar se
      va sin integrar.

  - id: cinco-recintos-que-hay-que-dibujar
    titulo: Cinco recintos, y el que se acaba antes de lo que parece
    fuente: Ejercicio 7.2 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Representar gráficamente el recinto de integración y calcular:

      (a) $\displaystyle\iint_D (x-y)\,dx\,dy$, $D$: recinto delimitado por
      las condiciones $x\ge0$ y $x\le y\le 2-x^{2}$.

      (b) $\displaystyle\iint_D (x+y)\,dx\,dy$, $D$: $x\ge0$, $y\ge0$ y
      $x+y\le2$.

      (c) $\displaystyle\iint_D x\,dx\,dy$, $D$: recinto delimitado por las
      condiciones $y\ge x^{3}$, $x+y\le2$ y $x\ge0$.

      (d) $\displaystyle\iint_D x^{2}y\,dx\,dy$, $D$: recinto delimitado por
      las condiciones $x^{2}+y^{2}\le4$ y $x+y-2\ge0$.

      (e) $\displaystyle\iint_D \operatorname{sen}(x+y)\,dx\,dy$, $D$: recinto
      delimitado por las rectas $y=x$, $x+y=\tfrac{\pi}{2}$ e $y=0$.
    pide: El valor de las cinco integrales.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado (a) el enunciado no dice hasta dónde llega la $x$.
          ¿Cómo se averigua?
        opciones:
          - texto: >-
              Imponiendo que la tapa esté por encima del suelo:
              $x \le 2-x^{2}$, que da $x\le1$
            correcta: true
            mensaje: |
              Exacto. Cuando el recinto viene dado por $g(x)\le y\le h(x)$, los
              extremos en $x$ son **donde se cortan las dos curvas**. Aquí
              $x^{2}+x-2\le0$, o sea $-2\le x\le1$, y con $x\ge0$ queda
              $[0,1]$.
          - texto: >-
              Se toma $x$ de $0$ a $2$, que es donde la parábola corta al eje
            mensaje: |
              La parábola corta al eje $x$ en $\sqrt2$, no en $2$ — y aunque
              así fuera, más allá de $x=1$ la recta $y=x$ va **por encima** de
              la parábola y el recinto se vuelve vacío.
          - texto: >-
              Falta un dato en el enunciado
            mensaje: |
              No falta: las dos condiciones bastan. Un recinto descrito por dos
              curvas siempre se cierra donde se cortan, y eso es una ecuación,
              no un dato que dar.

      - tipo: calcular
        titulo: El apartado (a)
        pregunta: |
          $\displaystyle\iint_D (x-y)\,dx\,dy$ con $x\ge0$ y
          $x\le y\le 2-x^{2}$.
        respuesta:
          tipo: numero
          valor: '-0.85'
          tolerancia: 0.004
          formato: en forma exacta (-17/20) o con dos decimales
        distractores:
          - valor: '0.85'
            mensaje: |
              El signo. En todo el recinto $y\ge x$, así que $x-y$ es
              **negativo** en todas partes y la integral no puede salir
              positiva. Comprobar el signo con un punto cualquiera del recinto
              cuesta cinco segundos.
          - valor: '0'
            mensaje: |
              Se anularía si el recinto fuese simétrico al intercambiar $x$ e
              $y$, y no lo es: por arriba lo cierra una parábola y por abajo
              una recta.
        pista: |
          $\displaystyle\int_0^1\!\!\int_x^{2-x^{2}}(x-y)\,dy\,dx$, y la de
          dentro es $\left[xy-\tfrac{y^{2}}{2}\right]$.
        desarrollo: |
          $$
          \int_x^{2-x^{2}}(x-y)\,dy
          = 2x - x^{3} - \frac{(2-x^{2})^{2}}{2} - \frac{x^{2}}{2}
          $$

          $$
          = 2x - x^{3} - 2 + \frac{3x^{2}}{2} - \frac{x^{4}}{2}
          $$

          $$
          \int_0^1\!\left(2x-x^{3}-2+\frac{3x^{2}}{2}-\frac{x^{4}}{2}\right)dx
          = 1-\frac14-2+\frac12-\frac1{10} = -\frac{17}{20}
          $$

      - tipo: calcular
        titulo: El apartado (d)
        pregunta: |
          $\displaystyle\iint_D x^{2}y\,dx\,dy$ con $x^{2}+y^{2}\le4$ y
          $x+y\ge2$.
        respuesta:
          tipo: numero
          valor: '1.6'
          tolerancia: 0.008
          formato: en forma exacta (8/5) o con dos decimales
        distractores:
          - valor: '0'
            mensaje: |
              Sobre el círculo entero sí saldría $0$, porque $x^{2}y$ es impar
              en $y$. Pero el recinto es solo el **segmento circular** que
              queda por encima de la cuerda $x+y=2$, y ahí $y$ casi siempre es
              positiva.
          - valor: '3.2'
            mensaje: |
              El doble. Al integrar $y$ entre la recta y la circunferencia
              aparece $\tfrac{y^{2}}{2}$, no $y^{2}$.
        pista: |
          Cartesianas, no polares: la cuerda $x+y=2$ en polares es
          $\rho=\tfrac{2}{\cos\theta+\operatorname{sen}\theta}$, y eso complica
          más de lo que ayuda. Con $x$ de $0$ a $2$, la $y$ va de $2-x$ a
          $\sqrt{4-x^{2}}$.
        desarrollo: |
          $$
          \int_0^2 x^{2}\left[\frac{y^{2}}{2}\right]_{2-x}^{\sqrt{4-x^{2}}}dx
          = \int_0^2 x^{2}\,\frac{(4-x^{2})-(2-x)^{2}}{2}\,dx
          $$

          $$
          = \int_0^2 x^{2}\,\frac{4x-2x^{2}}{2}\,dx
          = \int_0^2\left(2x^{3}-x^{4}\right)dx
          = 8-\frac{32}{5} = \frac{8}{5}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Cuando el recinto viene como $g(x)\le y\le h(x)$, los extremos en
              $x$ salen de resolver $g(x)=h(x)$; no son un dato que falte.
          - texto: >-
              El signo del resultado se puede predecir mirando el integrando
              sobre el recinto: en (a) $x-y\le0$ en todas partes, así que la
              integral es negativa.
          - texto: >-
              En (d) la simetría del círculo no sirve, porque la cuerda
              $x+y=2$ recorta justo la mitad donde $y>0$.
          - texto: >-
              Y en (e) conviene el orden $dy\,dx$, porque el triángulo se
              describe con una sola fórmula barriendo en vertical.
            trampa: true
            mensaje: |
              Al revés: barriendo en vertical el triángulo de vértices $(0,0)$,
              $(\pi/4,\pi/4)$ y $(\pi/2,0)$ **hay que partirlo en dos**, porque
              la tapa cambia de $y=x$ a $y=\tfrac{\pi}{2}-x$ en $x=\pi/4$.
              Barriendo en horizontal es una sola integral, con $x$ de $y$ a
              $\tfrac{\pi}{2}-y$.
        veredicto: |
          Tres hábitos, y los tres son de antes de integrar: cerrar el recinto
          resolviendo la ecuación, predecir el signo mirando el integrando, y
          elegir el orden que evita partir.
      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 540 354" role="img" width="540" height="354"
               aria-labelledby="f-cinco-recintos-t f-cinco-recintos-d">
            <title id="f-cinco-recintos-t">Los cinco recintos, y sus puntos de corte</title>
            <desc id="f-cinco-recintos-d">Cinco dibujos independientes. El a, entre la recta y igual a x por abajo y la parábola y igual a dos menos x al cuadrado por arriba, que se cortan en el punto (1,1). El b, el triángulo de vértices el origen, (2,0) y (0,2). El c, entre la cúbica y igual a x al cubo y la recta x más y igual a dos, que se cortan también en (1,1). El d, el segmento circular entre la cuerda que une (2,0) con (0,2) y el arco de la circunferencia de radio dos. Y el e, el triángulo de vértices el origen, (pi medios, 0) y (pi cuartos, pi cuartos).</desc>
