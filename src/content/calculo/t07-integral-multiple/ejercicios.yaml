  - id: ej-area-del-casquete-de-paraboloide
    titulo: El área de un cuenco, y la raíz que aparece en polares
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre el área de una
      superficie del tema 7. Es el peldaño entre el plano inclinado —donde la
      raíz es constante— y los cuerpos del examen, donde además hay que
      averiguar el recinto. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Calcular el área del trozo del paraboloide $z = x^{2}+y^{2}$ que queda
      por debajo del plano $z = 1$.
    pide: El área de esa superficie curva.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Sobre qué región se integra, y qué se integra sobre ella?
        opciones:
          - texto: >-
              Sobre la **sombra** del cuenco en el plano XY, integrando
              $\sqrt{1+z_x^{2}+z_y^{2}}$
            correcta: true
            mensaje: |
              Eso es. El recinto de integración es siempre plano —la sombra—, y
              lo que corrige que la superficie esté inclinada es la raíz. Si la
              superficie fuera horizontal la raíz valdría 1 y saldría el área
              de la sombra, que es justo lo que tiene que pasar.
          - texto: >-
              Sobre la sombra, integrando 1
            mensaje: |
              Eso da el área de la **sombra**, no la de la superficie. Aquí
              serían $\pi$, y la respuesta buena es un 70 % mayor: el cuenco
              está inclinado y por eso hay más superficie que suelo debajo.
          - texto: >-
              Sobre la propia superficie curva, integrando 1
            mensaje: |
              Conceptualmente es lo que se quiere, pero no se puede integrar
              directamente sobre una superficie curva con una integral doble
              corriente: hay que proyectarla sobre un recinto plano, y el
              precio de esa proyección es exactamente la raíz.

      - tipo: calcular
        titulo: La integral en el radio
        pregunta: |
          En polares el integrando queda $\sqrt{1+4r^{2}}$ y el recinto es el
          disco $r\le 1$. ¿Cuánto vale
          $\displaystyle\int_0^{1}\sqrt{1+4r^{2}}\;r\,dr$?
        respuesta:
          tipo: numero
          valor: '(5*sqrt(5)-1)/12'
          tolerancia: 0.0005
          formato: un número, en forma exacta o con cuatro decimales
        distractores:
          - valor: '1/3'
            mensaje: |
              Has integrado como si el cambio $u = 1+4r^{2}$ diera $u$ y no
              $u^{3/2}$. Al integrar $\sqrt{u}$ sale $\frac{2}{3}u^{3/2}$, y esa
              potencia de tres medios es la que convierte el 4 en
              $5\sqrt5 - 1$.
          - valor: '10.1803'
            mensaje: |
              Ese es $5\sqrt5-1$ sin dividir entre 12. El 12 sale de juntar el
              $1/8$ del cambio de variable con el $2/3$ de la integral.
        pista: |
          Cambio $u = 1+4r^{2}$, y fíjate en que el $r$ que acompaña —el
          jacobiano de las polares— es justo lo que hace falta para que el
          cambio funcione.
        desarrollo: |
          Con $u = 1+4r^{2}$ se tiene $du = 8r\,dr$, así que

          $$
          \int_0^{1}\sqrt{1+4r^{2}}\;r\,dr
          = \frac{1}{8}\int_1^{5}\sqrt{u}\,du
          = \frac{1}{8}\cdot\frac{2}{3}\Bigl[u^{3/2}\Bigr]_1^{5}
          = \frac{5\sqrt5-1}{12}
          $$

          Numéricamente, $0{,}8484$. Y merece la pena ver por qué el ejercicio
          sale: **el jacobiano de las polares es el $r$ que el cambio de
          variable necesitaba**. En cartesianas esta integral no es elemental;
          en polares es inmediata. No es que las polares sean más cómodas: es
          que son las que hacen que exista la primitiva.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área de la superficie? Da la forma exacta, o cuatro
          decimales.
        respuesta:
          tipo: numero
          valor: 'pi*(5*sqrt(5)-1)/6'
          tolerancia: 0.0005
          formato: un número, en forma exacta o con cuatro decimales
        distractores:
          - valor: 'pi'
            mensaje: |
              Ese es el área de la **sombra**, el disco de radio 1. Es la
              respuesta que sale si se olvida la raíz, y siempre se queda
              corta: una superficie inclinada nunca mide menos que su
              proyección.
          - valor: '0.8484'
            mensaje: |
              Te has quedado en la integral del radio y falta la de $\theta$.
              Como el integrando no depende del ángulo, esa segunda integral es
              solo un factor $2\pi$.
        pista: |
          El integrando no depende de $\theta$, así que la integral en el
          ángulo es un factor.
        desarrollo: |
          $$
          S = \int_0^{2\pi}\!\!\int_0^{1}\sqrt{1+4r^{2}}\;r\,dr\,d\theta
          = 2\pi\cdot\frac{5\sqrt5-1}{12}
          = \frac{\pi\left(5\sqrt5-1\right)}{6}
          $$

          Es decir $5{,}3304$.

      - tipo: calcular
        titulo: Cuánto más que su sombra
        pregunta: |
          ¿Cuántas veces mayor es la superficie que su sombra?
        respuesta:
          tipo: numero
          valor: '1.6967'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '0.5895'
            mensaje: |
              Has dividido al revés. La superficie es la grande: una
              proyección nunca es mayor que lo proyectado, así que el cociente
              tiene que salir mayor que uno.
        pista: |
          Divide el área que acabas de calcular entre el área del disco.
        desarrollo: |
          $$
          \frac{S}{\pi} = \frac{5\sqrt5-1}{6} = 1{,}6967
          $$

          Un **70 % más de superficie que de suelo**, y ese número es toda la
          intuición del apartado: la raíz no es un adorno de la fórmula, es lo
          que separa un cuenco de un disco. En el borde, donde el paraboloide
          está más empinado, la raíz vale $\sqrt5 = 2{,}24$; en el fondo, donde
          es horizontal, vale 1.

      - tipo: justificar
        pregunta: Ordena el planteamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La sombra del cuenco es el disco $x^{2}+y^{2}\le 1$, porque el
              paraboloide llega a $z=1$ justo cuando $x^{2}+y^{2}=1$.
          - texto: >-
              Con $z_x = 2x$ y $z_y = 2y$, el integrando es
              $\sqrt{1+4x^{2}+4y^{2}}$, que en polares es
              $\sqrt{1+4r^{2}}$.
          - texto: >-
              El recinto es un disco y el integrando solo depende de $r$, así
              que las polares dejan la integral en un producto de dos.
          - texto: >-
              Y como el recinto es el mismo disco, este resultado es también el
              volumen que encierra el cuenco.
            trampa: true
            mensaje: |
              Son dos cosas distintas y salen de integrales distintas. El
              **área** integra la raíz; el **volumen** integraría la altura,
              $\iint (1 - r^{2})\,r\,dr\,d\theta$, y vale $\pi/2$. Que
              compartan recinto no los hace iguales: lo que cambia es qué se
              suma sobre él, y esa es la pregunta que hay que leer bien en el
              enunciado.
    resolucion: |
      **La sombra.** El paraboloide alcanza $z=1$ cuando $x^{2}+y^{2}=1$, así
      que el recinto de integración es el disco unidad.

      **El integrando.** Con $z = x^{2}+y^{2}$ se tiene $z_x = 2x$ y
      $z_y = 2y$:

      $$
      \sqrt{1+z_x^{2}+z_y^{2}} = \sqrt{1+4x^{2}+4y^{2}}
      \;\xrightarrow{\ \text{polares}\ }\;
      \sqrt{1+4r^{2}}
      $$

      **La integral.** Disco más integrando radial: polares, con su jacobiano.

      $$
      S = \int_0^{2\pi}\!\!\int_0^{1}\sqrt{1+4r^{2}}\;r\,dr\,d\theta
      = 2\pi\cdot\frac{1}{8}\int_1^{5}\sqrt{u}\,du
      = \frac{\pi\left(5\sqrt5-1\right)}{6} \approx 5{,}3304
      $$

      **Lo que hay que llevarse.** Dos cosas, y la segunda es la que hace
      falta para el examen.

      La primera: **el recinto de integración siempre es plano**. Por curvada
      que esté la superficie, se integra sobre su sombra, y todo lo que la
      curvatura añade está dentro de la raíz. Aquí la sombra mide $\pi$ y la
      superficie 5,33: un 70 % más.

      La segunda: **el $r$ del jacobiano no es un estorbo, es lo que hace que
      la integral exista**. En cartesianas $\iint\sqrt{1+4x^{2}+4y^{2}}$ no
      tiene primitiva elemental; en polares, el $r$ que aparece al cambiar de
      coordenadas es exactamente el factor que pide el cambio
      $u = 1+4r^{2}$. Cuando en un examen la raíz se resiste, la pregunta que
      hay que hacerse no es «qué primitiva es esta» sino **«estoy en las
      coordenadas buenas»**.

  # ── Boletín básico «Integral múltiple. Problemas» ──────────────────
  # Los de clase, y los que traen «Sol:» impreso. Empieza aquí el encargo 1
  # de la auditoría del 14 de septiembre de 2026: de los 23 de este boletín no
  # había ni uno transcrito, y el tema es el que más demanda el examen —41
  # ejercicios de convocatoria—. Método de la colección de Fluidos: resolver
  # a ciegas, contrastar con el impreso, y si discrepan publicar lo que dan
  # los datos con el impreso de distractor explicado (§13).
  - id: area-con-tres-desigualdades
    titulo: El área de un recinto dado por tres desigualdades
    fuente: >-
      Ejercicio 4 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él: sale ln 4 exacto.
    nivel: practica
    enunciado: |
      Sea
      $D = \left\{(x,y) \ / \ y-2x \le 0,\ 2y-x \ge 0,\ xy \le 2\right\}$.
      Calcular el área de $D$.
    pide: El área del recinto.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las tres desigualdades no describen un recinto cómodo en $x$ e $y$.
          ¿Qué sugieren las dos primeras?
        opciones:
          - texto: >-
              Que la variable natural es el **cociente** $y/x$: las dos dicen
              $\tfrac12 \le \tfrac{y}{x} \le 2$
            correcta: true
            mensaje: |
              Eso es. $y \le 2x$ y $2y \ge x$ son dos rectas por el origen, y
              lo que acotan es la **pendiente**. Escribirlas como cociente es
              lo que convierte el recinto en un rectángulo.
          - texto: >-
              Que hay que integrar en $y$ primero, porque las dos despejan $y$
            mensaje: |
              Se puede intentar, y sale: pero hay que partir el recinto porque
              la tapa cambia de recta a hipérbola. El cambio de variable lo
              evita entero, y es lo que el enunciado está pidiendo con esa
              forma.
          - texto: >-
              Que el recinto no está acotado y el área es infinita
            mensaje: |
              La tercera condición, $xy \le 2$, es la que lo cierra: sin ella
              el sector entre las dos rectas sí sería infinito. Las tres juntas
              acotan.

      - tipo: reconocer
        pregunta: |
          Con $u=\dfrac{y}{x}$ y $v=xy$, ¿en qué se convierte $D$?
        opciones:
          - texto: >-
              En el rectángulo $\tfrac12 \le u \le 2$, $0 < v \le 2$
            correcta: true
            mensaje: |
              Exacto, y ahí está todo el ejercicio: las tres desigualdades se
              vuelven tres constantes. Un recinto curvo pasa a ser un
              rectángulo, y eso es lo que un cambio de variable busca.
          - texto: >-
              En el cuadrado $0 \le u \le 2$, $0 \le v \le 2$
            mensaje: |
              El $u$ no llega a cero: la condición $2y \ge x$ da
              $u \ge \tfrac12$. Y en $u=0$ el cambio degenera —serían los
              puntos del eje $y=0$—, que es justo lo que la desigualdad evita.
          - texto: >-
              En un triángulo, porque dos de las condiciones son rectas
            mensaje: |
              Son rectas en el plano $xy$, pero en las variables nuevas cada
              una es $u = $ constante. Ahí está la ganancia: lo que era una
              recta oblicua pasa a ser un lado del rectángulo.

      - tipo: calcular
        titulo: El jacobiano del cambio
        pregunta: |
          Despejando, $x=\sqrt{v/u}$ e $y=\sqrt{uv}$. ¿Cuánto vale
          $\left|\dfrac{\partial(x,y)}{\partial(u,v)}\right|$?
        respuesta:
          tipo: numero
          valor: '0.3846'
          tolerancia: 0.001
          formato: su valor en u = 1,3, con cuatro decimales
        distractores:
          - valor: '2.6'
            mensaje: |
              Has calculado el jacobiano **del revés**, el de $(u,v)$ respecto
              de $(x,y)$, que vale $2u$. El que hace falta es el inverso: al
              cambiar de variables en una integral doble se multiplica por el
              jacobiano de las **viejas respecto de las nuevas**.
          - valor: '0.7692'
            mensaje: |
              Te falta el 2 del denominador. Los dos productos cruzados dan
              $-\tfrac{1}{4u}$ cada uno, y suman $-\tfrac{1}{2u}$, no
              $-\tfrac{1}{u}$.
        pista: |
          $|J| = \dfrac{1}{2u}$. Sustituye $u=1{,}3$.
        desarrollo: |
          $$
          \frac{\partial x}{\partial u} = -\frac{\sqrt v}{2u^{3/2}},
          \qquad
          \frac{\partial x}{\partial v} = \frac{1}{2\sqrt{uv}},
          \qquad
          \frac{\partial y}{\partial u} = \frac{\sqrt v}{2\sqrt u},
          \qquad
          \frac{\partial y}{\partial v} = \frac{\sqrt u}{2\sqrt v}
          $$

          $$
          J = \frac{\partial x}{\partial u}\frac{\partial y}{\partial v}
            - \frac{\partial x}{\partial v}\frac{\partial y}{\partial u}
            = -\frac{1}{4u} - \frac{1}{4u} = -\frac{1}{2u}
          $$

          $$
          |J| = \frac{1}{2u}
          \quad\Longrightarrow\quad
          |J|_{u=1{,}3} = \frac{1}{2{,}6} = 0{,}3846
          $$

          Fíjate en que **no depende de $v$**: por eso la integral de dentro
          sale sola.

      - tipo: calcular
        titulo: El área
        pregunta: |
          Con el rectángulo y el jacobiano, el área es
          $\displaystyle\int_{1/2}^{2}\!\!\int_0^2 \frac{1}{2u}\,dv\,du$.
          ¿Cuánto vale?
        respuesta:
          tipo: numero
          valor: '1.3863'
          tolerancia: 0.001
          formato: en forma exacta (ln 4) o con cuatro decimales
        distractores:
          - valor: '0.6931'
            mensaje: |
              Eso es $\ln 2$, y es el resultado de integrar $u$ solo de 1 a 2.
              El intervalo empieza en $\tfrac12$, y $\ln 2 - \ln\tfrac12$ son
              **dos** logaritmos de dos, no uno.
          - valor: '2.7726'
            mensaje: |
              Te has dejado el $\tfrac12$ del jacobiano sin usar: con $1/u$ en
              vez de $1/(2u)$ sale el doble.
        pista: |
          La integral en $v$ da un 2, que se come el 2 del jacobiano.
        desarrollo: |
          $$
          \int_{1/2}^{2}\!\!\int_0^2 \frac{1}{2u}\,dv\,du
          = \int_{1/2}^{2} \frac{2}{2u}\,du
          = \int_{1/2}^{2} \frac{du}{u}
          = \big[\ln u\big]_{1/2}^{2}
          $$

          $$
          = \ln 2 - \ln\tfrac12 = \ln 2 + \ln 2 = \ln 4 \approx 1{,}3863
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Las dos primeras desigualdades acotan el cociente:
              $\tfrac12 \le y/x \le 2$. La tercera acota el producto:
              $xy \le 2$.
          - texto: >-
              Con $u=y/x$ y $v=xy$ el recinto se vuelve el rectángulo
              $[\tfrac12,2]\times(0,2]$: tres curvas pasan a tres constantes.
          - texto: >-
              El jacobiano de las viejas respecto de las nuevas es
              $|J|=\tfrac{1}{2u}$, y no depende de $v$.
          - texto: >-
              Como el recinto nuevo es un rectángulo, el área en las variables
              nuevas es su base por su altura: $\tfrac32 \cdot 2 = 3$.
            trampa: true
            mensaje: |
              El área **no se conserva** al cambiar de variables: eso es
              exactamente lo que mide el jacobiano. El rectángulo mide 3 en el
              plano $uv$, pero el recinto original mide $\ln 4 \approx 1{,}39$.
              Olvidar el jacobiano —o darlo por 1— es el error que invalida
              cualquier cambio de variable.
        veredicto: |
          Ese es el papel del jacobiano: el factor por el que hay que
          multiplicar para que el área del plano nuevo mida lo que mide en el
          viejo. Sin él, cambiar de variables sería hacer trampa.
    resolucion: |
      **Datos.** $D$ dado por $y-2x \le 0$, $2y-x \ge 0$, $xy \le 2$. Se pide
      su área.

      ### 1 · Leer las desigualdades

      Las dos primeras son rectas por el origen y acotan la **pendiente**:

      $$
      y \le 2x \;\Rightarrow\; \frac{y}{x} \le 2,
      \qquad
      2y \ge x \;\Rightarrow\; \frac{y}{x} \ge \frac12
      $$

      La tercera acota el **producto**: $xy \le 2$. Un cociente y un producto:
      el enunciado está pidiendo el cambio

      $$
      u = \frac{y}{x}, \qquad v = xy
      $$

      con el que $D$ se convierte en un rectángulo:

      $$
      \frac12 \le u \le 2, \qquad 0 < v \le 2
      $$

      ### 2 · El jacobiano

      Despejando, $x=\sqrt{v/u}$ e $y=\sqrt{uv}$, y con las cuatro parciales:

      $$
      J = -\frac{1}{4u} - \frac{1}{4u} = -\frac{1}{2u},
      \qquad
      |J| = \frac{1}{2u}
      $$

      No depende de $v$, así que la integral interior es inmediata.

      ### 3 · El área

      $$
      \text{Área}(D) = \iint_{D} dx\,dy
      = \int_{1/2}^{2}\!\!\int_{0}^{2} \frac{1}{2u}\,dv\,du
      = \int_{1/2}^{2} \frac{du}{u}
      = \ln 2 - \ln\frac12
      $$

      $$
      \boxed{\ \text{Área}(D) = \ln 4 \approx 1{,}3863\ }
      $$

      Coincide con el resultado del boletín.

      **Lo que hay que llevarse.** Cuando las condiciones del recinto son
      **cocientes y productos** en vez de rectas y parábolas, el cambio de
      variable no es un atajo: es la forma natural de escribirlo. Y el
      jacobiano no es un trámite — es lo único que impide que el área cambie al
      cambiar de coordenadas.

  - id: centro-de-gravedad-triangulo-densidad-lineal
    titulo: Un triángulo que pesa más cuanto más se aleja de un cateto
    fuente: >-
      Ejercicio 6 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él: sale (b/4, a/2) exacto.
    nivel: practica
    enunciado: |
      Calcular las coordenadas del centro de gravedad el triángulo rectángulo
      cuyos catetos son $OB = a$ y $OA = b$, siendo la densidad puntual
      proporcional a la distancia entre el punto y el cateto $OA$.
    pide: Las dos coordenadas del centro de gravedad.
    pasos:
      - tipo: reconocer
        pregunta: |
          El boletín no dibuja los ejes. Poniendo $OA$ sobre el eje $x$ —de
          largo $b$— y $OB$ sobre el eje $y$ —de largo $a$—, ¿qué es «la
          distancia entre el punto y el cateto $OA$»?
        opciones:
          - texto: >-
              La coordenada $y$ del punto, así que $\delta(x,y)=k\,y$
            correcta: true
            mensaje: |
              Eso es. $OA$ está sobre el eje $x$, y la distancia de un punto a
              ese eje es $y$. La densidad crece linealmente conforme subes.
          - texto: >-
              La coordenada $x$ del punto
            mensaje: |
              Esa sería la distancia al **otro** cateto, $OB$. Cuidado con
              cuál de los dos nombra el enunciado: cambia el resultado.
          - texto: >-
              La distancia al origen, $\sqrt{x^{2}+y^{2}}$
            mensaje: |
              Esa es la distancia al **vértice** $O$, no al cateto. La
              distancia a una recta se mide perpendicularmente a ella.

      - tipo: calcular
        titulo: La altura del centro de gravedad
        pregunta: |
          Con $a=1{,}6$, $b=1{,}1$ y la constante $k=1$, ¿cuánto vale
          $\overline{y}$?
        respuesta:
          tipo: numero
          valor: '0.8'
          tolerancia: 0.005
          formato: en forma exacta (a/2) o con tres decimales
        distractores:
          - valor: '0.5333'
            mensaje: |
              Ese es $a/3$: el centro de gravedad del triángulo **homogéneo**.
              Aquí la densidad crece con $y$, así que el centro tiene que
              subir por encima de $a/3$, no quedarse ahí.
          - valor: '1.0667'
            mensaje: |
              $2a/3$ es la altura del **baricentro medida desde el vértice
              opuesto**, no desde el cateto. Ojo con desde dónde mides.
        pista: |
          $\overline{y}=\dfrac{\iint y\,\delta\,dA}{\iint \delta\,dA}$, y con
          $\delta=k y$ los dos integrandos son $k y^{2}$ y $k y$. La $k$ se va.
        desarrollo: |
          La hipotenusa es $\tfrac{x}{b}+\tfrac{y}{a}=1$, así que para cada
          $y\in[0,a]$ la $x$ va de $0$ a $b\left(1-\tfrac{y}{a}\right)$.

          $$
          m = k\int_0^{a} y\,b\left(1-\frac{y}{a}\right)dy
          = kb\left(\frac{a^{2}}{2}-\frac{a^{2}}{3}\right)
          = \frac{k\,b\,a^{2}}{6}
          $$

          $$
          \iint y\,\delta\,dA
          = kb\int_0^{a} y^{2}\left(1-\frac{y}{a}\right)dy
          = kb\left(\frac{a^{3}}{3}-\frac{a^{3}}{4}\right)
          = \frac{k\,b\,a^{3}}{12}
          $$

          $$
          \overline{y} = \frac{k b a^{3}/12}{k b a^{2}/6} = \frac{a}{2} = 0{,}8
          $$

      - tipo: calcular
        titulo: Y la otra coordenada
        pregunta: |
          Con los mismos datos, ¿cuánto vale $\overline{x}$?
        respuesta:
          tipo: numero
          valor: '0.275'
          tolerancia: 0.002
          formato: en forma exacta (b/4) o con tres decimales
        distractores:
          - valor: '0.3667'
            mensaje: |
              $b/3$ es otra vez el triángulo homogéneo. Y aquí el centro se
              mueve al revés que en $y$: como el peso se concentra arriba, y
              arriba el triángulo es **estrecho**, $\overline{x}$ baja de $b/3$.
          - valor: '0.55'
            mensaje: |
              $b/2$ sería el centro de un rectángulo. El triángulo se
              estrecha, y además aquí está lastrado hacia arriba.
        pista: |
          Integra primero en $x$: $\int_0^{b(1-y/a)} x\,dx =
          \tfrac{b^{2}}{2}\left(1-\tfrac{y}{a}\right)^{2}$. Lo que queda es
          $\int_0^a y\left(1-\tfrac{y}{a}\right)^{2}dy = \tfrac{a^{2}}{12}$.
        desarrollo: |
          $$
          \iint x\,\delta\,dA
          = \frac{k b^{2}}{2}\int_0^{a} y\left(1-\frac{y}{a}\right)^{2}dy
          = \frac{k b^{2}}{2}\cdot\frac{a^{2}}{12}
          = \frac{k\,a^{2}b^{2}}{24}
          $$

          $$
          \overline{x} = \frac{k a^{2}b^{2}/24}{k b a^{2}/6}
          = \frac{b}{4} = 0{,}275
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La densidad $\delta = k y$ es proporcional a la distancia al
              cateto $OA$, que con $OA$ sobre el eje $x$ es la propia $y$.
          - texto: >-
              La constante $k$ aparece en el numerador y en el denominador de
              las dos medias, así que se cancela: el resultado no depende de
              ella.
          - texto: >-
              El peso se concentra donde $y$ es grande, y allí el triángulo es
              estrecho: por eso $\overline{y}$ sube de $a/3$ a $a/2$ y $\overline{x}$
              baja de $b/3$ a $b/4$.
          - texto: >-
              Y como la densidad depende solo de $y$, el centro de gravedad en
              $x$ tiene que salir igual que el del triángulo homogéneo.
            trampa: true
            mensaje: |
              No: que la densidad no dependa de $x$ **no** deja $\overline{x}$
              quieto. Cada franja horizontal sí tiene su centro en el mismo
              sitio que si fuera homogénea, pero las franjas de arriba —las
              más cortas, las que están más a la izquierda— pesan más que las
              de abajo, y la media se corre hacia la izquierda. De $b/3$ a
              $b/4$.
        veredicto: |
          Dos moralejas. Una: la constante de proporcionalidad de una densidad
          casi nunca hace falta, porque el centro de gravedad es un cociente.
          Y otra: ponderar por $y$ mueve **las dos** coordenadas, no solo la
          $y$ — porque en un triángulo la anchura y la altura están atadas.
    resolucion: |
      **Datos.** Triángulo rectángulo de catetos $OB=a$ y $OA=b$, con densidad
      proporcional a la distancia al cateto $OA$.

      ### 0 · El convenio de ejes

      El boletín no dibuja la figura. La solución publicada, $(b/4,\,a/2)$,
      fija el convenio: **$OA$ sobre el eje $x$ con longitud $b$, y $OB$ sobre
      el eje $y$ con longitud $a$**. Con esa colocación la distancia de un
      punto al cateto $OA$ es su coordenada $y$:

      $$
      \delta(x,y) = k\,y
      $$

      y el recinto es $0\le y\le a$, $0\le x\le b\left(1-\tfrac{y}{a}\right)$.

      ### 1 · La masa

      $$
      m = k\int_0^{a}\!\!\int_0^{b(1-y/a)} y\;dx\,dy
      = kb\int_0^{a}\left(y-\frac{y^{2}}{a}\right)dy
      = \frac{k\,a^{2}b}{6}
      $$

      ### 2 · Los dos momentos

      $$
      \iint y\,\delta\,dA = \frac{k\,a^{3}b}{12},
      \qquad
      \iint x\,\delta\,dA = \frac{k\,a^{2}b^{2}}{24}
      $$

      ### 3 · El centro de gravedad

      $$
      \boxed{\ \overline{x} = \frac{b}{4}, \qquad \overline{y} = \frac{a}{2}\ }
      $$

      Coincide con el resultado del boletín.

      ### 4 · El contraste que hay que hacer siempre

      | | homogéneo | con $\delta = k y$ |
      |---|---|---|
      | $\overline{x}$ | $b/3$ | $b/4$ |
      | $\overline{y}$ | $a/3$ | $a/2$ |

      Sube en $y$ y baja en $x$, y las dos cosas por la misma razón: el peso
      se va arriba, y arriba el triángulo es estrecho. **Comparar contra el
      caso homogéneo cuesta diez segundos y caza el error de signo del
      razonamiento**, que es el que de verdad se comete.

      **Lo que hay que llevarse.** La $k$ se cancela: en un centro de gravedad
      solo importa **cómo** varía la densidad, no cuánto vale.

  - id: centro-de-gravedad-sector-circular
    titulo: El centro de gravedad de un trozo de tarta
    fuente: >-
      Ejercicio 7 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él: sale 2a·sen(alfa)/(3·alfa)
      exacto.
    nivel: practica
    enunciado: |
      Calcular las coordenadas del centro de gravedad de un sector circular de
      radio $a$ y ángulo $2\alpha$.
    pide: Las coordenadas del centro de gravedad.
    pasos:
      - tipo: reconocer
        pregunta: |
          Colocamos el sector simétrico respecto al eje $x$, con el vértice en
          el origen: $-\alpha\le\theta\le\alpha$, $0\le r\le a$. ¿Qué se sabe
          ya sin integrar?
        opciones:
          - texto: >-
              Que $\overline{y}=0$, porque el recinto es simétrico respecto al eje
              $x$ y la densidad es constante
            correcta: true
            mensaje: |
              Exacto. Media integral menos que hacer. Colocar la figura para
              que tenga simetría **antes** de plantear es parte del oficio.
          - texto: >-
              Que $\overline{x}=a/2$, el punto medio del radio
            mensaje: |
              No: en polares el diferencial es $r\,dr\,d\theta$, y esa $r$
              pesa más los puntos lejanos. El centro sale más allá de $a/2$.
          - texto: >-
              Que el centro está sobre el arco
            mensaje: |
              El centro de gravedad de una figura maciza está **dentro** de
              ella, nunca en el borde exterior.

      - tipo: calcular
        titulo: La coordenada que queda
        pregunta: |
          Con $a=1{,}6$ y $\alpha=0{,}7$ radianes, ¿cuánto vale $\overline{x}$?
        respuesta:
          tipo: numero
          valor: '0.9817'
          tolerancia: 0.004
          formato: en forma exacta (2a·sen(alfa)/(3·alfa)) o con cuatro decimales
        distractores:
          - valor: '1.0667'
            mensaje: |
              $2a/3$ es el **límite** cuando $\alpha\to 0$, o sea el sector
              afilado como una aguja. Te has dejado el factor
              $\operatorname{sen}\alpha/\alpha$, que es el que castiga la
              apertura.
          - valor: '0.6791'
            mensaje: |
              $4a/(3\pi)$ es el caso particular del **semicírculo**
              ($\alpha=\pi/2$). Aquí $\alpha$ vale $0{,}7$, no $\pi/2$.
          - valor: '0.8'
            mensaje: |
              $a/2$ es el punto medio del radio. Sería la respuesta si el
              diferencial de área fuese $dr\,d\theta$, pero es
              $r\,dr\,d\theta$: los puntos lejanos ocupan más sitio.
        pista: |
          $\overline{x}=\dfrac{1}{A}\displaystyle\int_{-\alpha}^{\alpha}\!\!\int_0^a
          (r\cos\theta)\,r\,dr\,d\theta$, con $A=\alpha a^{2}$.
        desarrollo: |
          El área del sector es $A=\tfrac{1}{2}a^{2}(2\alpha)=\alpha a^{2}$.

          $$
          \iint x\,dA
          = \int_{-\alpha}^{\alpha}\!\!\int_0^a r^{2}\cos\theta\;dr\,d\theta
          = \frac{a^{3}}{3}\int_{-\alpha}^{\alpha}\cos\theta\,d\theta
          = \frac{2a^{3}\operatorname{sen}\alpha}{3}
          $$

          $$
          \overline{x} = \frac{2a^{3}\operatorname{sen}\alpha/3}{\alpha a^{2}}
          = \frac{2a\operatorname{sen}\alpha}{3\alpha}
          $$

          Con $a=1{,}6$ y $\alpha=0{,}7$: $0{,}9817$.

      - tipo: calcular
        titulo: Los dos casos que ya te sabes
        pregunta: |
          La fórmula $\overline{x}=\dfrac{2a\operatorname{sen}\alpha}{3\alpha}$
          tiene que reproducir dos casos conocidos. Comprueba el del
          semicírculo: pon $\alpha=\pi/2$ y da el valor con $a=1{,}6$.
        respuesta:
          tipo: numero
          valor: '0.6791'
          tolerancia: 0.004
          formato: en forma exacta (4a/(3pi)) o con cuatro decimales
        distractores:
          - valor: '0.9817'
            mensaje: |
              Ese es el valor del apartado anterior, con $\alpha=0{,}7$. Aquí
              hay que sustituir $\alpha=\pi/2\approx1{,}5708$.
          - valor: '1.0667'
            mensaje: |
              $2a/3$ es el otro límite, el del sector afilado
              ($\alpha\to0$, donde $\operatorname{sen}\alpha/\alpha\to1$). El
              semicírculo es el extremo contrario.
        pista: |
          $\operatorname{sen}(\pi/2)=1$, así que queda
          $\overline{x}=\dfrac{2a}{3\pi/2}=\dfrac{4a}{3\pi}$.
        desarrollo: |
          $$
          \alpha=\frac{\pi}{2}
          \;\Longrightarrow\;
          \overline{x}=\frac{2a\cdot 1}{3\pi/2}=\frac{4a}{3\pi}=0{,}6791
          $$

          Que es la fórmula del semicírculo que sale en todas las tablas. Y en
          el otro extremo, $\alpha\to0$ da $\overline{x}\to\tfrac{2a}{3}$: el
          centro de gravedad de un triángulo isósceles muy afilado, medido
          desde el vértice. **Las dos comprobaciones son gratis y cazan
          cualquier error de constante.**
        veredicto: |
          Una fórmula con un parámetro se comprueba en sus extremos. Si los
          dos casos conocidos salen, el factor $\operatorname{sen}\alpha/\alpha$
          está bien puesto.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Colocado simétrico respecto al eje $x$, la simetría da
              $\overline{y}=0$ sin integrar nada.
          - texto: >-
              En polares $dA = r\,dr\,d\theta$, así que el integrando de
              $\iint x\,dA$ es $r^{2}\cos\theta$.
          - texto: >-
              El área es $\alpha a^{2}$ y el momento $\tfrac{2a^{3}}{3}
              \operatorname{sen}\alpha$, de donde
              $\overline{x}=\tfrac{2a\operatorname{sen}\alpha}{3\alpha}$.
          - texto: >-
              Y como el sector es una porción del círculo, su centro está a la
              misma distancia del origen que el del círculo entero.
            trampa: true
            mensaje: |
              El centro del círculo entero **es** el origen: si eso valiera,
              $\overline{x}$ saldría $0$. Lo que pasa es justo lo contrario: al
              recortar un sector se rompe la simetría en $\theta$, y el centro
              se aleja del vértice tanto más cuanto más estrecho es el sector.
        veredicto: |
          El factor $\operatorname{sen}\alpha/\alpha$ es el precio de la
          apertura: vale $1$ cuando el sector es una aguja y baja a
          $2/\pi\approx0{,}64$ en el semicírculo. Cuanto más abierto, más
          cerca del vértice queda el centro.
    resolucion: |
      **Datos.** Sector circular macizo y homogéneo, de radio $a$ y ángulo
      total $2\alpha$.

      ### 1 · La colocación

      Vértice en el origen y sector simétrico respecto al eje $x$:

      $$
      -\alpha \le \theta \le \alpha, \qquad 0 \le r \le a
      $$

      La simetría respecto al eje $x$ da $\overline{y}=0$ de entrada.

      ### 2 · Área y momento

      $$
      A = \int_{-\alpha}^{\alpha}\!\!\int_0^a r\,dr\,d\theta = \alpha a^{2}
      $$

      $$
      \iint x\,dA
      = \int_{-\alpha}^{\alpha}\!\!\int_0^a r^{2}\cos\theta\;dr\,d\theta
      = \frac{2a^{3}}{3}\operatorname{sen}\alpha
      $$

      ### 3 · El centro

      $$
      \boxed{\ \left(\frac{2a\operatorname{sen}\alpha}{3\alpha},\ 0\right)\ }
      $$

      Coincide con el resultado del boletín.

      ### 4 · Los dos extremos

      | $\alpha$ | $\overline{x}$ | qué figura es |
      |---|---|---|
      | $\to 0$ | $\to 2a/3$ | un triángulo isósceles afilado |
      | $\pi/2$ | $4a/(3\pi)\approx0{,}42a$ | el semicírculo de las tablas |
      | $\pi$ | $0$ | el círculo entero |

      **Lo que hay que llevarse.** Dos cosas. La primera, que el $r$ del
      diferencial en polares **no es decoración**: es lo que empuja el centro
      de gravedad más allá de la mitad del radio. La segunda, que una fórmula
      con parámetro se verifica sola: si los extremos dan las figuras
      conocidas, está bien.

  - id: area-de-la-ventana-de-viviani
    titulo: Cuánta esfera recorta la ventana de Viviani
    fuente: >-
      Ejercicio 11 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él: sale 4R²(pi/2 − 1) exacto.
    nivel: practica
    enunciado: |
      Calcular el área de la superficie esférica $x^{2}+y^{2}+z^{2}=R^{2}$
      cortada por el cilindro circular recto $x^{2}+y^{2}-Rx=0$.
    pide: El área de la porción de esfera que queda dentro del cilindro.
    pasos:
      - tipo: reconocer
        pregunta: |
          Es la misma pareja de superficies que la bóveda de Viviani, pero
          ahora se pide un **área de superficie**, no un volumen. ¿Qué cambia?
        opciones:
          - texto: >-
              Que hay que integrar
              $\sqrt{1+z_x^{2}+z_y^{2}}\,dA$ sobre la proyección, en vez de la
              altura $z$
            correcta: true
            mensaje: |
              Eso es. La proyección —el disco $x^{2}+y^{2}\le Rx$— es la
              misma; lo que cambia es el integrando.
          - texto: >-
              Nada: el área es el volumen dividido por el radio
            mensaje: |
              Eso solo vale para el cono y la esfera completos, y aquí el
              cuerpo no está centrado. Un área de superficie curva se calcula
              con su propio factor.
          - texto: >-
              Que hay que usar coordenadas esféricas obligatoriamente
            mensaje: |
              Se puede, pero no hace falta: la proyección sobre $OXY$ es un
              disco, y en polares del plano sale en cuatro líneas.

      - tipo: reconocer
        pregunta: |
          El enunciado dice «la superficie esférica», sin más. ¿Cuántos trozos
          hay?
        opciones:
          - texto: >-
              Dos: el casquete de arriba y el de abajo, iguales por simetría.
              Se calcula uno y se dobla
            correcta: true
            mensaje: |
              Sí. El cilindro es vertical y la esfera está centrada en el
              origen, así que lo que recorta arriba lo recorta igual abajo.
          - texto: >-
              Uno solo, el de arriba
            mensaje: |
              La esfera entera está cortada por el cilindro, no media esfera.
              Si te quedas con el casquete superior das la mitad del área.
          - texto: >-
              Cuatro, uno por cuadrante
            mensaje: |
              El cilindro $x^{2}+y^{2}\le Rx$ solo vive en $x\ge0$, así que no
              hay cuatro trozos. Hay dos, arriba y abajo.

      - tipo: calcular
        titulo: El área
        pregunta: |
          Con $R=1{,}3$, ¿cuánto vale el área de la porción de esfera dentro
          del cilindro?
        respuesta:
          tipo: numero
          valor: '3.8586'
          tolerancia: 0.006
          formato: en forma exacta (4R²(pi/2−1)) o con cuatro decimales
        distractores:
          - valor: '1.9293'
            mensaje: |
              Te has quedado solo con el casquete de arriba. La esfera está
              cortada por el cilindro **entera**: hay dos casquetes iguales.
          - valor: '21.2372'
            mensaje: |
              $4\pi R^{2}$ es la esfera completa. La ventana de Viviani es una
              fracción pequeña de ella: aquí, un $18\%$.
          - valor: '1.3273'
            mensaje: |
              $\pi R^{2}/4$ es el área del **disco proyección**, no de la
              superficie curva que está encima. Falta el factor
              $R/\sqrt{R^{2}-r^{2}}$, que es mayor que $1$ y crece hacia el
              borde.
        pista: |
          Con $z=\sqrt{R^{2}-x^{2}-y^{2}}$ sale
          $\sqrt{1+z_x^{2}+z_y^{2}}=\dfrac{R}{\sqrt{R^{2}-r^{2}}}$, y la
          proyección en polares es $r\le R\cos\theta$ con
          $\theta\in[-\tfrac{\pi}{2},\tfrac{\pi}{2}]$.
        desarrollo: |
          $$
          S = 2\int_{-\pi/2}^{\pi/2}\!\!\int_0^{R\cos\theta}
          \frac{R\,r}{\sqrt{R^{2}-r^{2}}}\;dr\,d\theta
          $$

          La integral de dentro es inmediata:

          $$
          \int_0^{R\cos\theta}\frac{r\,dr}{\sqrt{R^{2}-r^{2}}}
          = \Big[-\sqrt{R^{2}-r^{2}}\Big]_0^{R\cos\theta}
          = R - R\left|\operatorname{sen}\theta\right|
          $$

          $$
          S = 2R^{2}\int_{-\pi/2}^{\pi/2}
          \left(1-\left|\operatorname{sen}\theta\right|\right)d\theta
          = 2R^{2}\left(\pi - 2\right)
          = 4R^{2}\left(\frac{\pi}{2}-1\right)
          $$

          Con $R=1{,}3$: $3{,}8586$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La proyección de la superficie sobre $OXY$ es el disco
              $x^{2}+y^{2}\le Rx$, que en polares es $r\le R\cos\theta$ con
              $\theta\in[-\tfrac{\pi}{2},\tfrac{\pi}{2}]$.
          - texto: >-
              Sobre el casquete superior $z=\sqrt{R^{2}-r^{2}}$, y el factor de
              área es $R/\sqrt{R^{2}-r^{2}}$.
          - texto: >-
              Ese factor se dispara en el ecuador, donde $r\to R$, pero la
              integral converge porque el $r\,dr$ del diferencial polar lo
              compensa.
          - texto: >-
              Y como el factor de área es mayor que $1$ en todo el disco, el
              área de la superficie es mayor que la del disco multiplicada por
              el valor máximo del factor.
            trampa: true
            mensaje: |
              Al revés: mayor que el disco **por el valor mínimo** y menor que
              el disco por el máximo — y aquí el máximo es infinito, así que
              esa cota no dice nada. La comparación útil es la de abajo:
              $3{,}86$ frente a los $1{,}33$ del disco, o sea casi el triple.
        veredicto: |
          El área de la ventana es $2R^{2}(\pi-2)\approx 2{,}28R^{2}$, frente
          a los $4\pi R^{2}\approx 12{,}57R^{2}$ de la esfera entera: un
          $18\%$. Y frente al disco que proyecta, $\pi R^{2}/4\approx
          0{,}79R^{2}$, casi el triple — porque la esfera se pone casi
          vertical al llegar al ecuador.
    resolucion: |
      **Datos.** Esfera $x^{2}+y^{2}+z^{2}=R^{2}$ y cilindro
      $x^{2}+y^{2}=Rx$, que es el cilindro de radio $R/2$ apoyado en el eje
      $z$ y tangente a él por dentro.

      ### 1 · Qué se pide, y qué no

      Este ejercicio y la bóveda de Viviani comparten las dos superficies pero
      preguntan cosas distintas:

      | | qué mide | resultado |
      |---|---|---|
      | ejercicio 15 | el **volumen** encerrado | $\tfrac{a^{3}}{9}(3\pi-4)$ |
      | este | el **área de esfera** recortada | $4R^{2}\left(\tfrac{\pi}{2}-1\right)$ |

      ### 2 · El factor de área

      Sobre el casquete superior, $z=\sqrt{R^{2}-x^{2}-y^{2}}$, y

      $$
      \sqrt{1+z_x^{2}+z_y^{2}}
      = \sqrt{1+\frac{x^{2}+y^{2}}{R^{2}-x^{2}-y^{2}}}
      = \frac{R}{\sqrt{R^{2}-r^{2}}}
      $$

      ### 3 · La proyección, en polares

      $x^{2}+y^{2}=Rx$ es $r = R\cos\theta$, con
      $\theta\in\left[-\tfrac{\pi}{2},\tfrac{\pi}{2}\right]$.

      ### 4 · La integral

      Por los dos casquetes:

      $$
      S = 2\int_{-\pi/2}^{\pi/2}\!\!\int_0^{R\cos\theta}
      \frac{R\,r}{\sqrt{R^{2}-r^{2}}}\,dr\,d\theta
      = 2R^{2}\int_{-\pi/2}^{\pi/2}
      \left(1-\left|\operatorname{sen}\theta\right|\right)d\theta
      $$

      $$
      \boxed{\ S = 2R^{2}(\pi-2) = 4R^{2}\left(\frac{\pi}{2}-1\right)\ }
      $$

      Coincide con el resultado del boletín.

      ### 5 · La comprobación de tamaño

      $$
      \frac{S}{4\pi R^{2}} = \frac{2(\pi-2)}{4\pi} = \frac{\pi-2}{2\pi}
      \approx 0{,}18
      $$

      Un $18\%$ de la esfera. Es creíble: el cilindro tiene la mitad del radio
      de la esfera y solo muerde por un lado.

      **Lo que hay que llevarse.** El factor $R/\sqrt{R^{2}-r^{2}}$ se hace
      infinito en el ecuador y aun así la integral converge, porque el
      $r\,dr$ de las polares mata la singularidad. **Un integrando que se
      dispara no significa que el área sea infinita**: hay que mirar el
      diferencial completo antes de asustarse.

  - id: paraboloide-eliptico-cortado-por-un-plano
    titulo: El paraboloide es exactamente medio cilindro
    fuente: >-
      Ejercicio 16 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él: sale pi·a·b·c exacto.
    nivel: practica
    enunciado: |
      Calcular el volumen del sólido limitado por el paraboloide

      $$
      \frac{y^{2}}{b^{2}}+\frac{z^{2}}{c^{2}} = 2\,\frac{x}{a}
      $$

      y el plano $x=a$.
    pide: El volumen del sólido.
    pasos:
      - tipo: reconocer
        pregunta: |
          El paraboloide se abre a lo largo del eje $x$. ¿Qué es la sección
          del sólido por un plano $x=$ constante?
        opciones:
          - texto: >-
              Una elipse de semiejes $b\sqrt{2x/a}$ y $c\sqrt{2x/a}$
            correcta: true
            mensaje: |
              Eso es: fijando $x$, la ecuación queda
              $\tfrac{y^{2}}{b^{2}}+\tfrac{z^{2}}{c^{2}}=\text{cte}$, que es
              una elipse. Y crece con $x$: el sólido se ensancha hacia el
              plano $x=a$.
          - texto: >-
              Una circunferencia de radio $\sqrt{2x/a}$
            mensaje: |
              Solo si $b=c$. Con semiejes distintos la sección es una elipse,
              y ahí está la gracia del ejercicio.
          - texto: >-
              Una parábola
            mensaje: |
              La parábola aparece si cortas por un plano que **contenga** el
              eje $x$ (por ejemplo $z=0$). Cortando perpendicularmente al eje
              sale la elipse.

      - tipo: reconocer
        pregunta: |
          El área de esa elipse es $A(x)=\pi bc\,\dfrac{2x}{a}$. ¿Qué tiene de
          particular?
        opciones:
          - texto: >-
              Que es **lineal** en $x$, así que el volumen es el área final
              por la longitud, dividido entre dos
            correcta: true
            mensaje: |
              Exacto: $\int_0^a A(x)dx = \tfrac{A(a)\cdot a}{2}$, como el área
              de un triángulo. Es la razón de que el paraboloide sea justo
              medio cilindro.
          - texto: >-
              Que es constante
            mensaje: |
              Depende de $x$: en $x=0$ vale $0$ —el vértice— y en $x=a$ vale
              $2\pi bc$. Ese crecimiento es el ejercicio.
          - texto: >-
              Que crece como $x^{2}$
            mensaje: |
              Los **semiejes** crecen como $\sqrt{x}$, así que el área, que es
              su producto, crece como $x$. Un cono sería el que crece como
              $x^{2}$.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Con $a=1{,}6$, $b=1{,}1$ y $c=0{,}8$, ¿cuánto vale el volumen?
        respuesta:
          tipo: numero
          valor: '4.4234'
          tolerancia: 0.006
          formato: en forma exacta (pi·a·b·c) o con cuatro decimales
        distractores:
          - valor: '8.8467'
            mensaje: |
              $2\pi abc$ es el volumen del **cilindro** que tiene por base la
              elipse final y por altura $a$. El paraboloide es exactamente la
              mitad de eso.
          - valor: '2.9489'
            mensaje: |
              $\tfrac{2\pi abc}{3}$ es lo que saldría si el área de la sección
              creciera como $x^{2}$, o sea si fuera un **cono**. Aquí crece
              como $x$, y el factor es $1/2$, no $1/3$.
        pista: |
          $V=\displaystyle\int_0^a A(x)\,dx$ con $A(x)=\pi bc\,\tfrac{2x}{a}$.
          No hace falta integral doble ni triple.
        desarrollo: |
          $$
          V = \int_0^{a} \pi b c\,\frac{2x}{a}\,dx
          = \frac{2\pi bc}{a}\cdot\frac{a^{2}}{2}
          = \pi\,a\,b\,c
          $$

          Con $a=1{,}6$, $b=1{,}1$, $c=0{,}8$: $4{,}4234$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Fijado $x$, la sección es la elipse
              $\tfrac{y^{2}}{b^{2}}+\tfrac{z^{2}}{c^{2}}=\tfrac{2x}{a}$, de
              semiejes $b\sqrt{2x/a}$ y $c\sqrt{2x/a}$.
          - texto: >-
              Su área es $\pi$ por el producto de los semiejes:
              $A(x)=\pi bc\,\tfrac{2x}{a}$, lineal en $x$.
          - texto: >-
              Integrando de $0$ a $a$ sale $\pi abc$, que es la mitad del
              cilindro de base $A(a)=2\pi bc$ y altura $a$.
          - texto: >-
              Y por eso mismo el centro de gravedad del sólido está en el
              punto medio, $x=a/2$.
            trampa: true
            mensaje: |
              No. Que el **volumen** sea la mitad del cilindro no pone el
              centro en la mitad: el sólido es mucho más gordo cerca de $x=a$,
              así que el centro se va hacia allí. Sale en $x=\tfrac{2a}{3}$ —y
              eso es justo lo que pide el ejercicio 20 del boletín.
        veredicto: |
          La regla que hay que fichar: **cuando el área de la sección es una
          función lineal de la variable, el volumen es el área final por la
          longitud partido por dos.** Es el mismo $1/2$ del área del triángulo,
          y ahorra plantear una triple.
    resolucion: |
      **Datos.** Paraboloide elíptico
      $\tfrac{y^{2}}{b^{2}}+\tfrac{z^{2}}{c^{2}}=2\tfrac{x}{a}$, con vértice
      en el origen y eje $OX$, cerrado por el plano $x=a$.

      ### 1 · Cortar por secciones, no por casillas

      Este es el ejercicio prototipo del **método de las secciones**: cuando
      el sólido está descrito por una familia de cortes paralelos, no hace
      falta montar la triple.

      Fijado $x\in[0,a]$:

      $$
      \frac{y^{2}}{b^{2}}+\frac{z^{2}}{c^{2}} = \frac{2x}{a}
      \;\Longleftrightarrow\;
      \frac{y^{2}}{\left(b\sqrt{2x/a}\right)^{2}}
      +\frac{z^{2}}{\left(c\sqrt{2x/a}\right)^{2}} = 1
      $$

      una elipse de semiejes $b\sqrt{2x/a}$ y $c\sqrt{2x/a}$, de área

      $$
      A(x) = \pi\,b\,c\,\frac{2x}{a}
      $$

      ### 2 · La integral

      $$
      V = \int_0^{a} \pi bc\,\frac{2x}{a}\,dx
      = \frac{2\pi bc}{a}\left[\frac{x^{2}}{2}\right]_0^{a}
      $$

      $$
      \boxed{\ V = \pi\,a\,b\,c\ }
      $$

      Coincide con el resultado del boletín.

      ### 3 · La lectura

      El área de la sección final es $A(a)=2\pi bc$, así que el cilindro que
      encierra al sólido mide $2\pi abc$. El paraboloide es **exactamente la
      mitad**.

      | sólido | cómo crece $A(x)$ | fracción del cilindro |
      |---|---|---|
      | cilindro | constante | $1$ |
      | paraboloide | lineal | $1/2$ |
      | cono | como $x^{2}$ | $1/3$ |

      **Lo que hay que llevarse.** Esa tabla. El exponente con que crece el
      área de la sección decide la fracción, y saberla de memoria permite
      comprobar cualquier volumen de revolución en cinco segundos.

  - id: elipsoide-cortado-por-cono
    titulo: Un elipsoide recortado por un cono, con todo estirado a la vez
    fuente: >-
      Ejercicio 17 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él: sale 4π(√2−1)abc/3 exacto.
    nivel: practica
    enunciado: |
      Calcular el volumen del sólido limitado por las condiciones siguientes:

      $$
      \frac{x^{2}}{a^{2}}+\frac{y^{2}}{b^{2}}+\frac{z^{2}}{c^{2}} \le 2,
      \qquad
      \frac{x^{2}}{a^{2}}+\frac{y^{2}}{b^{2}}-\frac{z^{2}}{c^{2}} \le 0
      \qquad (z \ge 0)
      $$
    pide: El volumen del sólido.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos condiciones tienen las mismas tres fracciones. ¿Qué sugiere
          eso?
        opciones:
          - texto: >-
              El cambio $x=aX$, $y=bY$, $z=cZ$: las dos se vuelven condiciones
              sobre una esfera y un cono **normales**
            correcta: true
            mensaje: |
              Eso es. Con ese cambio quedan $X^{2}+Y^{2}+Z^{2}\le 2$ y
              $X^{2}+Y^{2}\le Z^{2}$: exactamente el ejercicio 14, pero con la
              desigualdad al revés y solo la mitad de arriba.
          - texto: >-
              Que hay que usar esféricas directamente sobre $x$, $y$, $z$
            mensaje: |
              Las esféricas de siempre convertirían la primera condición en
              $\rho\le\sqrt2$ solo si los tres semiejes fuesen iguales. Con
              $a\ne b\ne c$ hay que estirar primero.
          - texto: >-
              Que las dos superficies son paralelas
            mensaje: |
              No lo son: una es cerrada (un elipsoide) y la otra abierta (un
              cono). Lo que comparten es la **forma de las fracciones**, y eso
              es lo que permite el mismo cambio para las dos.

      - tipo: reconocer
        pregunta: |
          Tras el cambio, $X^{2}+Y^{2}\le Z^{2}$ con $Z\ge0$. ¿Qué región es?
        opciones:
          - texto: >-
              El **interior** del cono de 45°, la mitad de arriba:
              $0\le\varphi\le\tfrac{\pi}{4}$
            correcta: true
            mensaje: |
              Sí, y es el complementario del ejercicio 14: allí la desigualdad
              era $\ge$ y salía la franja del ecuador; aquí es $\le$ y sale el
              casquete alrededor del polo norte.
          - texto: >-
              El exterior del cono, $\tfrac{\pi}{4}\le\varphi\le\tfrac{\pi}{2}$
            mensaje: |
              Esa es la desigualdad contraria. Comprueba con un punto: el
              $(0,0,1)$ tiene $X^{2}+Y^{2}=0 \le 1 = Z^{2}$, así que el eje
              **sí** está dentro.
          - texto: >-
              Un semiespacio
            mensaje: |
              El semiespacio lo pone $z\ge0$ por su cuenta. La otra condición
              recorta además un cono dentro de él.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Con el jacobiano del estiramiento ($abc$) y esféricas en las
          variables nuevas, el volumen es
          $abc\displaystyle\int_0^{2\pi}\!\!\int_0^{\pi/4}\!\!\int_0^{\sqrt2}
          \rho^{2}\operatorname{sen}\varphi\,d\rho\,d\varphi\,d\theta$.
          Con $a=1{,}6$, $b=1{,}1$ y $c=0{,}8$, ¿cuánto vale?
        respuesta:
          tipo: numero
          valor: '2.4430'
          tolerancia: 0.005
          formato: en forma exacta (4pi(sqrt(2)-1)abc/3) o con cuatro decimales
        distractores:
          - valor: '5.8988'
            mensaje: |
              Eso es lo que sale con $\rho$ hasta $\sqrt2$ y **sin** el cono, o
              sea media bola estirada. El cono recorta bastante más de la
              mitad.
          - valor: '1.7168'
            mensaje: |
              Probablemente has usado $\rho\le1$ en vez de $\rho\le\sqrt2$: la
              primera condición es $\le 2$, no $\le 1$, así que el radio en las
              variables nuevas llega a $\sqrt2$.
        pista: |
          $\int_0^{\pi/4}\operatorname{sen}\varphi\,d\varphi = 1-\tfrac{\sqrt2}{2}$
          y $\int_0^{\sqrt2}\rho^{2}d\rho = \tfrac{2\sqrt2}{3}$.
        desarrollo: |
          $$
          V = abc\cdot 2\pi
          \underbrace{\left(1-\frac{\sqrt2}{2}\right)}_{\int\operatorname{sen}\varphi}
          \underbrace{\frac{2\sqrt2}{3}}_{\int\rho^{2}}
          $$

          $$
          = abc\cdot\frac{4\pi\sqrt2}{3}\left(1-\frac{\sqrt2}{2}\right)
          = \frac{4\pi\left(\sqrt2-1\right)abc}{3}
          $$

          Con $a=1{,}6$, $b=1{,}1$, $c=0{,}8$: $2{,}4430$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Las dos condiciones comparten las mismas fracciones, así que el
              cambio $x=aX$, $y=bY$, $z=cZ$ las simplifica **las dos a la vez**.
          - texto: >-
              Quedan $X^{2}+Y^{2}+Z^{2}\le2$ —esfera de radio $\sqrt2$— y
              $X^{2}+Y^{2}\le Z^{2}$ con $Z\ge0$ —dentro del cono de 45°,
              arriba—.
          - texto: >-
              El jacobiano del estiramiento es $abc$, constante, así que sale
              fuera de la integral.
          - texto: >-
              Y como el cambio deforma el cuerpo, hay que ajustar además el
              ángulo $\varphi$ multiplicándolo por $c/a$.
            trampa: true
            mensaje: |
              No hay ajuste de ángulos. En las variables nuevas el cuerpo es
              una figura de revolución **perfecta**, y ahí $\varphi$ recorre
              $[0,\pi/4]$ sin corrección ninguna. Toda la deformación está en
              el jacobiano $abc$ — es la misma idea que en las polares
              generalizadas del ejercicio 3, y si además hubiera que tocar los
              ángulos el jacobiano no serviría para nada.
        veredicto: |
          Este ejercicio es el 14 y el 3 combinados: el estiramiento del 3 para
          quitar los semiejes, y las esféricas del 14 para el cono. Cuando dos
          condiciones comparten la misma combinación de variables, el cambio
          las arregla las dos.
    resolucion: |
      **Datos.** Dentro del elipsoide
      $\tfrac{x^{2}}{a^{2}}+\tfrac{y^{2}}{b^{2}}+\tfrac{z^{2}}{c^{2}}\le2$ y
      dentro del cono elíptico
      $\tfrac{x^{2}}{a^{2}}+\tfrac{y^{2}}{b^{2}}\le\tfrac{z^{2}}{c^{2}}$, con
      $z\ge0$.

      ### 1 · El cambio que arregla las dos

      Las dos condiciones están escritas con las mismas tres fracciones, así
      que el estiramiento

      $$
      x = aX, \qquad y = bY, \qquad z = cZ
      $$

      las convierte a las dos en figuras de revolución:

      $$
      X^{2}+Y^{2}+Z^{2} \le 2,
      \qquad
      X^{2}+Y^{2} \le Z^{2}, \quad Z\ge0
      $$

      Una esfera de radio $\sqrt2$ y el **interior** del cono de 45° por
      arriba. El jacobiano es $abc$, constante.

      ### 2 · Esféricas en las variables nuevas

      | variable | de | a |
      |---|---|---|
      | $\theta$ | $0$ | $2\pi$ |
      | $\varphi$ | $0$ | $\pi/4$ |
      | $\rho$ | $0$ | $\sqrt2$ |

      $$
      V = abc\int_0^{2\pi}\!\!\int_0^{\pi/4}\!\!\int_0^{\sqrt2}
      \rho^{2}\operatorname{sen}\varphi\,d\rho\,d\varphi\,d\theta
      $$

      $$
      = abc \cdot 2\pi\left(1-\frac{\sqrt2}{2}\right)\frac{2\sqrt2}{3}
      $$

      $$
      \boxed{\ V = \frac{4\pi\left(\sqrt2-1\right)abc}{3}\ }
      $$

      Coincide con el resultado del boletín.

      **Lo que hay que llevarse.** Es el ejercicio 3 y el 14 juntos: el
      estiramiento del 3 para quitar los semiejes de en medio, y las esféricas
      del 14 para el cono. Y la regla que los une: **cuando dos condiciones
      comparten la misma combinación de variables, hay un cambio que las
      simplifica las dos a la vez** — buscarlo antes de integrar es lo que
      convierte un ejercicio imposible en uno de tres líneas.

  - id: centro-de-gravedad-del-paraboloide
    titulo: Dónde está el centro de gravedad de un paraboloide
    fuente: >-
      Ejercicio 20 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él: sale (4/3, 0, 0) exacto.
    nivel: practica
    enunciado: |
      Calcular las coordenadas del centro de gravedad del cuerpo limitado por
      el paraboloide $y^{2}+2z^{2}=4x$ y el plano $x=2$.
    pide: Las tres coordenadas del centro de gravedad.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de integrar nada, ¿qué coordenadas ya se saben?
        opciones:
          - texto: >-
              $\overline{y}=\overline{z}=0$, porque el cuerpo es simétrico respecto a los
              planos $y=0$ y $z=0$
            correcta: true
            mensaje: |
              Eso es: en la ecuación $y$ y $z$ aparecen al cuadrado, así que
              cambiar $y$ por $-y$ deja el cuerpo igual. Dos integrales menos.
          - texto: >-
              $\overline{x}=1$, el punto medio entre $x=0$ y $x=2$
            mensaje: |
              Esa sería la respuesta si el cuerpo fuese un cilindro. El
              paraboloide se ensancha hacia $x=2$, así que el centro se
              desplaza hacia allí.
          - texto: >-
              Ninguna: hay que calcular las tres
            mensaje: |
              La simetría regala dos de las tres. Buscarla antes de plantear
              es lo primero que hay que hacer en un centro de gravedad.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          La sección por un plano $x=$ cte es una elipse de semiejes
          $2\sqrt{x}$ y $\sqrt{2x}$. ¿Cuánto vale el volumen del cuerpo?
        respuesta:
          tipo: numero
          valor: '17.7715'
          tolerancia: 0.02
          formato: en forma exacta (4·sqrt(2)·pi) o con cuatro decimales
        distractores:
          - valor: '35.5431'
            mensaje: |
              $8\sqrt2\,\pi$ es el **cilindro** de base la elipse final y
              altura $2$. El paraboloide es la mitad, porque el área de su
              sección crece linealmente.
          - valor: '8.8858'
            mensaje: |
              Has dividido dos veces entre dos. El área de la sección es
              $A(x)=2\sqrt2\,\pi x$, y su integral de $0$ a $2$ vale
              $2\sqrt2\,\pi\cdot 2 = 4\sqrt2\,\pi$.
        pista: |
          $A(x)=\pi\cdot 2\sqrt{x}\cdot\sqrt{2x} = 2\sqrt2\,\pi\,x$, y
          $V=\int_0^2 A(x)\,dx$.
        desarrollo: |
          $$
          V = \int_0^{2} 2\sqrt2\,\pi\,x\;dx
          = 2\sqrt2\,\pi\cdot\frac{4}{2}
          = 4\sqrt2\,\pi \approx 17{,}7715
          $$

      - tipo: calcular
        titulo: La coordenada que falta
        pregunta: |
          ¿Cuánto vale $\overline{x}$?
        respuesta:
          tipo: numero
          valor: '1.3333'
          tolerancia: 0.006
          formato: en forma exacta (4/3) o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es el punto medio, y sería la respuesta si el cuerpo tuviera
              la misma anchura en todo su largo. Se ensancha hacia $x=2$, así
              que el centro se corre hacia allí.
          - valor: '1.5'
            mensaje: |
              $3L/4$ es el centro de gravedad de un **cono** medido desde el
              vértice, porque en un cono el área crece como $x^{2}$. En el
              paraboloide crece como $x$, y el centro queda en $2L/3$.
        pista: |
          $\overline{x}=\dfrac{\int_0^2 x\,A(x)\,dx}{\int_0^2 A(x)\,dx}$, y como
          $A(x)$ es proporcional a $x$, las dos integrales son de $x^{2}$ y de
          $x$.
        desarrollo: |
          $$
          \overline{x}
          = \frac{\int_0^{2} x\cdot 2\sqrt2\,\pi x\;dx}
                 {\int_0^{2} 2\sqrt2\,\pi x\;dx}
          = \frac{8/3}{2}
          = \frac{4}{3}
          $$

          La constante $2\sqrt2\,\pi$ se cancela: **el centro de gravedad no
          depende de los semiejes, solo de cómo crece el área**.

          $$
          \boxed{\ \left(\tfrac{4}{3},\,0,\,0\right)\ }
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $y$ y $z$ entran al cuadrado, así que el cuerpo es simétrico
              respecto a los planos $y=0$ y $z=0$: $\overline{y}=\overline{z}=0$.
          - texto: >-
              La sección en $x$ es una elipse de área
              $A(x)=2\sqrt{2}\,\pi x$, proporcional a $x$.
          - texto: >-
              Por eso $\overline{x}=\tfrac{\int_0^{2}x^{2}dx}{\int_0^{2}x\,dx}
              =\tfrac{8/3}{2}=\tfrac{4}{3}$, o sea dos tercios de la longitud.
          - texto: >-
              Y si el plano de corte se pusiera en $x=4$ en vez de $x=2$, el
              centro seguiría en $x=4/3$, porque el vértice no se mueve.
            trampa: true
            mensaje: |
              El centro está en **dos tercios de la longitud**, no en un punto
              fijo: con el corte en $x=L$ sale $\overline{x}=\tfrac{2L}{3}$. Con
              $L=4$ daría $8/3$. Lo que no depende de $L$ es la **fracción**.
        veredicto: |
          Dos tercios de la longitud, medidos desde el vértice. El mismo
          número que el baricentro de un triángulo medido desde su vértice —y
          por la misma razón: en los dos casos lo que se promedia crece
          linealmente.
    resolucion: |
      **Datos.** Paraboloide elíptico $y^{2}+2z^{2}=4x$ con vértice en el
      origen y eje $OX$, cortado por el plano $x=2$.

      ### 1 · Lo que da la simetría

      En la ecuación $y$ y $z$ aparecen al cuadrado, y el cuerpo es homogéneo:

      $$
      \overline{y} = 0, \qquad \overline{z} = 0
      $$

      Solo queda una integral.

      ### 2 · La sección

      Fijado $x$:

      $$
      \frac{y^{2}}{4x}+\frac{z^{2}}{2x} = 1
      \;\Longrightarrow\;
      A(x) = \pi\cdot 2\sqrt{x}\cdot\sqrt{2x} = 2\sqrt{2}\,\pi\,x
      $$

      ### 3 · El centro

      $$
      V = \int_0^{2} 2\sqrt2\,\pi x\,dx = 4\sqrt2\,\pi
      $$

      $$
      \overline{x} = \frac{1}{V}\int_0^{2} x\,A(x)\,dx
      = \frac{2\sqrt2\,\pi\cdot 8/3}{4\sqrt2\,\pi}
      = \frac{4}{3}
      $$

      $$
      \boxed{\ \left(\frac{4}{3},\,0,\,0\right)\ }
      $$

      Coincide con el resultado del boletín.

      ### 4 · La tabla que conviene memorizar

      Si el área de la sección crece como $x^{n}$ y el sólido va de $0$ a $L$:

      | $n$ | sólido | $V/(A(L)\,L)$ | $\overline{x}/L$ |
      |---|---|---|---|
      | $0$ | cilindro | $1$ | $1/2$ |
      | $1$ | paraboloide | $1/2$ | $2/3$ |
      | $2$ | cono | $1/3$ | $3/4$ |

      En general, $V=\tfrac{A(L)L}{n+1}$ y $\overline{x}=\tfrac{n+1}{n+2}L$.

      **Lo que hay que llevarse.** Con esa tabla, el ejercicio 16 y este se
      resuelven de cabeza, y cualquier resultado que se salga de ella está
      mal. Es la comprobación más barata que hay en todo el tema.

  - id: centro-de-gravedad-del-octante-del-elipsoide
    titulo: El octante del elipsoide, sin integrar tres veces
    fuente: >-
      Ejercicio 21 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él: sale (3a/8, 3b/8, 3c/8)
      exacto.
    nivel: practica
    enunciado: |
      Calcular las coordenadas del centro de gravedad de la parte del
      elipsoide
      $\dfrac{x^{2}}{a^{2}}+\dfrac{y^{2}}{b^{2}}+\dfrac{z^{2}}{c^{2}}=1$
      que se encuentra en el primer octante.
    pide: Las tres coordenadas del centro de gravedad.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con el cambio $x=aX$, $y=bY$, $z=cZ$ el cuerpo pasa a ser el octante
          de la **bola unidad**. ¿Qué le pasa al centro de gravedad?
        opciones:
          - texto: >-
              Que se transforma igual que los puntos: si el de la bola es
              $(\overline{X},\overline{Y},\overline{Z})$, el del elipsoide es
              $(a\overline{X},\,b\overline{Y},\,c\overline{Z})$
            correcta: true
            mensaje: |
              Eso es, y es lo que ahorra el trabajo: el jacobiano $abc$ es
              constante, así que sale fuera del numerador y del denominador y
              se cancela. Una sola cuenta sirve para los tres ejes.
          - texto: >-
              Que se queda igual, porque el jacobiano es constante
            mensaje: |
              El jacobiano constante hace que se **cancele**, sí, pero el
              punto en sí se mueve: la $X$ hay que devolverla a $x=aX$.
          - texto: >-
              Que hay que dividirlo entre $abc$
            mensaje: |
              El jacobiano no divide coordenadas. Aparece en el numerador y en
              el denominador del cociente que define el centro, y desaparece.

      - tipo: calcular
        titulo: Una coordenada, y las otras dos salen solas
        pregunta: |
          Con $a=1{,}6$, ¿cuánto vale $\overline{x}$?
        respuesta:
          tipo: numero
          valor: '0.6'
          tolerancia: 0.004
          formato: en forma exacta (3a/8) o con tres decimales
        distractores:
          - valor: '0.8'
            mensaje: |
              $a/2$ sería la mitad del semieje. El octante se estrecha conforme
              te alejas del origen, así que el centro queda **antes** de la
              mitad.
          - valor: '0.64'
            mensaje: |
              $2a/5$ es el resultado del ejercicio 19, la semiesfera con
              densidad proporcional al radio. Aquí el cuerpo es **homogéneo**,
              y sale $3a/8$, un poco más cerca del centro.
          - valor: '0.5333'
            mensaje: |
              $a/3$ es el baricentro de un **triángulo** o de un tetraedro con
              vértice en el origen. El octante del elipsoide es más gordo que
              eso, y su centro queda más lejos.
        pista: |
          Sobre la bola unidad, $\overline{X}=\dfrac{\iiint X\,dV}{\iiint dV}$ con
          $V=\tfrac{\pi}{6}$ y $\iiint X\,dV = \tfrac{\pi}{16}$.
        desarrollo: |
          En las variables nuevas el cuerpo es el octante de la bola unidad.
          Por secciones en $X$, el corte es un cuarto de disco de radio
          $\sqrt{1-X^{2}}$:

          $$
          \iiint dV = \int_0^{1}\frac{\pi}{4}\left(1-X^{2}\right)dX
          = \frac{\pi}{4}\cdot\frac{2}{3} = \frac{\pi}{6}
          $$

          $$
          \iiint X\,dV = \int_0^{1}\frac{\pi}{4}X\left(1-X^{2}\right)dX
          = \frac{\pi}{4}\cdot\frac{1}{4} = \frac{\pi}{16}
          $$

          $$
          \overline{X} = \frac{\pi/16}{\pi/6} = \frac{3}{8}
          \;\Longrightarrow\;
          \overline{x} = \frac{3a}{8} = 0{,}6
          $$

          Y por el mismo argumento en los otros dos ejes,
          $\overline{y}=\tfrac{3b}{8}$ y $\overline{z}=\tfrac{3c}{8}$.

      - tipo: calcular
        titulo: El mismo 3/8 de la semiesfera
        pregunta: |
          Ese $3/8$ no es casual: es la altura del centro de gravedad de una
          **semiesfera homogénea** de radio $R$, que vale $3R/8$. Comprueba
          que sale lo mismo: con $R=1{,}6$, ¿a qué altura está el centro de
          una semiesfera homogénea?
        respuesta:
          tipo: numero
          valor: '0.6'
          tolerancia: 0.004
          formato: en forma exacta (3R/8) o con tres decimales
        distractores:
          - valor: '0.64'
            mensaje: |
              $2R/5$ es la semiesfera del ejercicio 19, la que tiene densidad
              proporcional al radio. La homogénea da $3R/8$, más abajo:
              cargar peso hacia la superficie sube el centro.
          - valor: '0.8'
            mensaje: |
              $R/2$ es la mitad de la altura. La semiesfera es ancha abajo y
              estrecha arriba, así que el centro cae por debajo de la mitad.
        pista: |
          El octante es la semiesfera cortada por dos planos que **contienen**
          el eje $z$. Esos cortes no cambian la distribución de masa en
          altura.
        desarrollo: |
          El octante de la bola es exactamente **un cuarto** de la
          semiesfera, obtenido con dos cortes por planos que contienen el eje
          $z$. Cortar así no altera cómo se reparte la masa a lo largo de $z$,
          así que la altura del centro es la misma:

          $$
          \overline{z}_{\text{semiesfera}} = \frac{3R}{8} = 0{,}6
          $$

          Y como el octante es simétrico bajo intercambiar los tres ejes, ese
          mismo $3/8$ vale para las tres coordenadas. **Una comprobación con
          una fórmula de tablas y cero integrales.**
        veredicto: |
          Cuando un resultado coincide con una fórmula que ya te sabes, casi
          siempre hay una razón geométrica detrás. Buscarla es la mejor forma
          de comprobar que no te has equivocado.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El cambio $x=aX$, $y=bY$, $z=cZ$ convierte el octante del
              elipsoide en el octante de la bola unidad, con jacobiano $abc$.
          - texto: >-
              Ese jacobiano es constante, así que se cancela entre el
              numerador y el denominador del centro de gravedad.
          - texto: >-
              En la bola unidad el centro del octante es $(3/8,3/8,3/8)$, y al
              deshacer el cambio queda $(3a/8,\,3b/8,\,3c/8)$.
          - texto: >-
              Y como el octante ocupa un octavo del elipsoide, su centro está
              a un octavo de la distancia del origen al vértice.
            trampa: true
            mensaje: |
              La fracción de volumen y la posición del centro no tienen nada
              que ver. El octante ocupa $1/8$ del elipsoide, y su centro está
              a $3/8$ del semieje: son dos $8$ que se parecen y no significan
              lo mismo.
        veredicto: |
          Un estiramiento con jacobiano constante deja el centro de gravedad
          **en el punto correspondiente**: se calcula una vez en la figura
          redonda y se devuelve multiplicando cada coordenada por su semieje.
    resolucion: |
      **Datos.** Parte del elipsoide
      $\tfrac{x^{2}}{a^{2}}+\tfrac{y^{2}}{b^{2}}+\tfrac{z^{2}}{c^{2}}\le1$ que
      cae en el primer octante, homogénea.

      ### 1 · El estiramiento

      $$
      x = aX, \quad y = bY, \quad z = cZ, \qquad J = abc
      $$

      El cuerpo pasa a ser el octante de la bola unidad, y como $J$ es
      constante se cancela en el cociente que define el centro:

      $$
      \overline{x}
      = \frac{\iiint x\,dV}{\iiint dV}
      = \frac{abc\cdot a\iiint X\,dV'}{abc\iiint dV'}
      = a\,\overline{X}
      $$

      ### 2 · El octante de la bola unidad

      Por secciones perpendiculares a $OX$ —cuartos de disco de radio
      $\sqrt{1-X^{2}}$—:

      $$
      V' = \int_0^{1}\frac{\pi}{4}\left(1-X^{2}\right)dX = \frac{\pi}{6},
      \qquad
      \iiint X\,dV' = \frac{\pi}{16}
      $$

      $$
      \overline{X} = \frac{3}{8}
      $$

      ### 3 · Deshacer el cambio

      $$
      \boxed{\ \left(\frac{3a}{8},\ \frac{3b}{8},\ \frac{3c}{8}\right)\ }
      $$

      Coincide con el resultado del boletín.

      ### 4 · Por qué $3/8$ y no otro número

      El octante es la semiesfera partida por dos planos que contienen el eje
      $z$, y esos cortes no cambian el reparto de masa en altura. Por eso
      $\overline{z}$ vale lo mismo que en la semiesfera homogénea: $3c/8$. Y como
      el octante trata igual a los tres ejes, las otras dos coordenadas
      repiten el número.

      Contraste con el ejercicio 19, la semiesfera con $\delta = k\rho$:

      | cuerpo | altura del centro |
      |---|---|
      | semiesfera homogénea | $3a/8 = 0{,}375\,a$ |
      | semiesfera con $\delta=k\rho$ | $2a/5 = 0{,}400\,a$ |

      Más peso cerca de la superficie, centro más alto. Es la comprobación de
      sentido que hay que hacer siempre que aparezca una densidad variable.

      **Lo que hay que llevarse.** El estiramiento con jacobiano constante no
      solo simplifica el volumen: transporta el centro de gravedad punto por
      punto. Una integral en vez de tres.

  - id: inercia-del-cilindro-respecto-al-diametro-de-la-base
    titulo: El cilindro girando sobre el borde de su base
    fuente: >-
      Ejercicio 22 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él: sale pi·a²·h·(3a²+4h²)/12
      exacto.
    nivel: practica
    enunciado: |
      Calcular el momento de inercia de un cilindro circular recto de radio
      $a$ y altura $h$ con respecto a un diámetro de la base.
    pide: El momento de inercia respecto a un diámetro de la base.
    pasos:
      - tipo: reconocer
        pregunta: |
          Ponemos la base en el plano $z=0$ y el eje de giro sobre el eje
          $OX$. ¿Cuál es la distancia de un punto $(x,y,z)$ a ese eje?
        opciones:
          - texto: >-
              $\sqrt{y^{2}+z^{2}}$, así que el integrando es $y^{2}+z^{2}$
            correcta: true
            mensaje: |
              Eso es: la distancia a un eje se mide en el plano perpendicular
              a él, y para el eje $OX$ ese plano es el $YZ$.
          - texto: >-
              $\sqrt{x^{2}+y^{2}}$
            mensaje: |
              Esa es la distancia al eje $OZ$, que es el eje **del propio
              cilindro**. El enunciado pide respecto a un diámetro de la base,
              que es horizontal.
          - texto: >-
              $|z|$, la altura sobre la base
            mensaje: |
              Esa es la distancia al **plano** de la base, no al diámetro. Un
              punto puede estar en la base y aun así lejos del eje de giro.

      - tipo: calcular
        titulo: El momento de inercia
        pregunta: |
          Con densidad $1$, $a=1{,}6$ y $h=0{,}9$, ¿cuánto vale $I$?
        respuesta:
          tipo: numero
          valor: '6.5868'
          tolerancia: 0.01
          formato: en forma exacta (pi·a²·h·(3a²+4h²)/12) o con cuatro decimales
        distractores:
          - valor: '5.1210'
            mensaje: |
              Ese es el momento respecto al diámetro que pasa por el **centro
              de masas**, a media altura. Falta el término de Steiner,
              $M\left(\tfrac{h}{2}\right)^{2}$, porque el eje pedido está en
              la base.
          - valor: '9.2644'
            mensaje: |
              $\tfrac{\pi a^{4}h}{2}$ es el momento respecto al **eje del
              cilindro**, el vertical. El enunciado pide respecto a un
              diámetro de la base, que es horizontal.
        pista: |
          $I=\iiint (y^{2}+z^{2})\,dV$ se parte en dos sumandos independientes:
          $\iiint y^{2}dV = h\cdot\tfrac{\pi a^{4}}{4}$ y
          $\iiint z^{2}dV = \pi a^{2}\cdot\tfrac{h^{3}}{3}$.
        desarrollo: |
          Los dos sumandos se calculan por separado porque el cilindro es un
          producto: el disco por el intervalo de alturas.

          $$
          \iiint y^{2}\,dV = h\iint_{\text{disco}} y^{2}\,dA
          = h\cdot\frac{\pi a^{4}}{4}
          $$

          $$
          \iiint z^{2}\,dV = \pi a^{2}\int_0^{h} z^{2}\,dz
          = \frac{\pi a^{2} h^{3}}{3}
          $$

          $$
          I = \frac{\pi a^{4}h}{4}+\frac{\pi a^{2}h^{3}}{3}
          = \frac{\pi a^{2} h}{12}\left(3a^{2}+4h^{2}\right)
          $$

          Con $a=1{,}6$ y $h=0{,}9$: $6{,}5868$.

      - tipo: calcular
        titulo: Steiner, que aquí es gratis
        pregunta: |
          El momento respecto al diámetro **central** —el que pasa por el
          centro de masas, a altura $h/2$— vale
          $\tfrac{\pi a^{2}h}{12}\left(3a^{2}+h^{2}\right)$. Comprueba que
          Steiner reconstruye el resultado: calcula
          $I_{\text{cm}}+M\left(\tfrac{h}{2}\right)^{2}$ con los mismos datos.
        respuesta:
          tipo: numero
          valor: '6.5868'
          tolerancia: 0.01
          formato: con cuatro decimales
        distractores:
          - valor: '5.1210'
            mensaje: |
              Eso es $I_{\text{cm}}$ solo. Falta sumarle
              $M\left(\tfrac{h}{2}\right)^{2}$, que con $M=\pi a^{2}h$ vale
              $\tfrac{\pi a^{2}h^{3}}{4}$.
          - valor: '10.9840'
            mensaje: |
              Has usado $M h^{2}$ en vez de $M\left(\tfrac{h}{2}\right)^{2}$.
              La distancia entre los dos ejes es media altura, no la altura
              entera, y en Steiner va al cuadrado.
        pista: |
          $M = \pi a^{2}h$, y la distancia entre el diámetro central y el de
          la base es $h/2$.
        desarrollo: |
          $$
          I_{\text{cm}} + M\left(\frac{h}{2}\right)^{2}
          = \frac{\pi a^{2}h}{12}\left(3a^{2}+h^{2}\right)
          + \pi a^{2}h\cdot\frac{h^{2}}{4}
          $$

          $$
          = \frac{\pi a^{2}h}{12}\left(3a^{2}+h^{2}+3h^{2}\right)
          = \frac{\pi a^{2}h}{12}\left(3a^{2}+4h^{2}\right)
          $$

          Idéntico. Con los números, $5{,}1210 + 1{,}4658 = 6{,}5868$.
        veredicto: |
          Steiner no es solo una herramienta para calcular: es el contraste más
          rápido que hay. Si el momento respecto a un eje desplazado no supera
          al central en exactamente $M d^{2}$, uno de los dos está mal.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con la base en $z=0$ y el eje de giro sobre $OX$, la distancia
              al eje es $\sqrt{y^{2}+z^{2}}$ y el integrando $y^{2}+z^{2}$.
          - texto: >-
              La integral se parte en dos: la de $y^{2}$, que es la inercia
              diametral del disco por la altura, y la de $z^{2}$, que es el
              área de la base por $\int_0^{h}z^{2}dz$.
          - texto: >-
              Sumando sale $\tfrac{\pi a^{2}h}{12}\left(3a^{2}+4h^{2}\right)$,
              y Steiner lo confirma desde el eje central.
          - texto: >-
              Y como los dos sumandos son positivos, el momento respecto al
              diámetro de la base siempre es mayor que el momento respecto al
              eje del cilindro.
            trampa: true
            mensaje: |
              Depende de la forma. El del eje del cilindro es
              $\tfrac{\pi a^{4}h}{2}$, y comparándolo con
              $\tfrac{\pi a^{2}h}{12}(3a^{2}+4h^{2})$ resulta que el diametral
              es mayor solo si $4h^{2}>3a^{2}$, o sea si el cilindro es
              suficientemente alto. Con $a=1{,}6$ y $h=0{,}9$ —un disco
              achatado— pasa justo lo contrario: $6{,}59$ frente a $9{,}26$.
        veredicto: |
          Un cilindro largo y fino cuesta más de voltear que de girar sobre su
          propio eje; un disco plano, al revés. El umbral exacto está en
          $4h^{2}=3a^{2}$.
    resolucion: |
      **Datos.** Cilindro circular recto homogéneo de radio $a$ y altura $h$,
      densidad $1$. Eje de giro: un diámetro de la base.

      ### 1 · La colocación

      Base en $z=0$, eje del cilindro sobre $OZ$, eje de giro sobre $OX$. La
      distancia de un punto al eje de giro es $\sqrt{y^{2}+z^{2}}$:

      $$
      I = \iiint_{V}\left(y^{2}+z^{2}\right)dV
      $$

      ### 2 · Los dos sumandos, por separado

      El cilindro es el producto de un disco por un intervalo, así que cada
      sumando se factoriza:

      $$
      \iiint y^{2}\,dV = h\iint_{r\le a} y^{2}\,dA = h\cdot\frac{\pi a^{4}}{4}
      $$

      $$
      \iiint z^{2}\,dV = \left(\pi a^{2}\right)\int_0^{h}z^{2}dz
      = \frac{\pi a^{2}h^{3}}{3}
      $$

      ### 3 · El resultado

      $$
      \boxed{\ I = \frac{\pi a^{2}h}{12}\left(3a^{2}+4h^{2}\right)\ }
      $$

      Coincide con el resultado del boletín.

      ### 4 · La comprobación por Steiner

      | eje | momento |
      |---|---|
      | diámetro por el centro de masas | $\tfrac{\pi a^{2}h}{12}(3a^{2}+h^{2})$ |
      | $+\,M\left(\tfrac{h}{2}\right)^{2}$ | $+\,\tfrac{\pi a^{2}h^{3}}{4}$ |
      | diámetro de la base | $\tfrac{\pi a^{2}h}{12}(3a^{2}+4h^{2})$ |

      Cuadra exactamente.

      **Lo que hay que llevarse.** Dos cosas. La primera, que
      $I=\iiint(y^{2}+z^{2})dV$ **se parte en dos integrales independientes**
      cuando el cuerpo es un producto, y cada una es un caso conocido. La
      segunda, que Steiner sirve tanto para calcular como para verificar: si
      el eje desplazado no da exactamente $M d^{2}$ de más, hay un error.

  - id: inercia-del-elipsoide-respecto-a-ox
    titulo: La inercia del elipsoide, estirando la bola
    fuente: >-
      Ejercicio 23 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él: sale 4·pi·a·b·c·(b²+c²)/15
      exacto.
    nivel: practica
    enunciado: |
      Calcular el momento de inercia del elipsoide
      $\dfrac{x^{2}}{a^{2}}+\dfrac{y^{2}}{b^{2}}+\dfrac{z^{2}}{c^{2}}=1$
      con respecto al eje $OX$.
    pide: El momento de inercia respecto al eje OX.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con el cambio $x=aX$, $y=bY$, $z=cZ$, el integrando $y^{2}+z^{2}$
          pasa a ser $b^{2}Y^{2}+c^{2}Z^{2}$. ¿Se puede sacar algo fuera?
        opciones:
          - texto: >-
              No entero, pero sí por partes: $b^{2}\iiint Y^{2}dV' +
              c^{2}\iiint Z^{2}dV'$, y las dos integrales sobre la bola valen
              lo mismo
            correcta: true
            mensaje: |
              Exacto, y ahí está el truco: el integrando **no** es un múltiplo
              de $Y^{2}+Z^{2}$, pero se parte en dos trozos que sí se conocen.
          - texto: >-
              Sí: sale $b^{2}c^{2}$ multiplicando a $\iiint(Y^{2}+Z^{2})dV'$
            mensaje: |
              Eso sería si los dos coeficientes fueran iguales. Con
              $b\ne c$ hay que separar los sumandos: no se puede sacar un
              factor común que no existe.
          - texto: >-
              No se puede: el cambio no sirve para inercias
            mensaje: |
              Sí sirve, y muy bien. Lo que no se puede es tratar la inercia
              como el volumen, con un único factor de escala.

      - tipo: calcular
        titulo: El momento de inercia
        pregunta: |
          Sabiendo que sobre la bola unidad
          $\iiint Y^{2}\,dV' = \tfrac{4\pi}{15}$, y con densidad $1$,
          $a=1{,}6$, $b=1{,}1$ y $c=0{,}8$, ¿cuánto vale $I_{x}$?
        respuesta:
          tipo: numero
          valor: '2.1822'
          tolerancia: 0.004
          formato: en forma exacta (4·pi·a·b·c·(b²+c²)/15) o con cuatro decimales
        distractores:
          - valor: '4.4470'
            mensaje: |
              Has usado $a^{2}+b^{2}$: eso es la inercia respecto a $OZ$. Para
              el eje $OX$ entran los **otros dos** semiejes, $b$ y $c$.
          - valor: '1.4273'
            mensaje: |
              Te has quedado con un solo sumando, el de $y^{2}$. La distancia
              al eje $OX$ es $\sqrt{y^{2}+z^{2}}$: hacen falta los dos.
        pista: |
          $I_x = abc\left(b^{2}\iiint Y^{2}dV' + c^{2}\iiint Z^{2}dV'\right)$,
          y por simetría de la bola las dos integrales valen $\tfrac{4\pi}{15}$.
        desarrollo: |
          $$
          I_x = \iiint\left(y^{2}+z^{2}\right)dV
          = abc\iiint\left(b^{2}Y^{2}+c^{2}Z^{2}\right)dV'
          $$

          $$
          = abc\left(b^{2}+c^{2}\right)\frac{4\pi}{15}
          $$

          $$
          \boxed{\ I_x = \frac{4\pi}{15}\,abc\left(b^{2}+c^{2}\right)\ }
          $$

          Con $a=1{,}6$, $b=1{,}1$, $c=0{,}8$: $2{,}1822$.

      - tipo: calcular
        titulo: La esfera, que ya te la sabes
        pregunta: |
          Si $a=b=c=R$ el elipsoide es una bola y la fórmula tiene que dar
          $\tfrac{2}{5}MR^{2}$. Con $R=1{,}3$ y densidad $1$, ¿cuánto vale?
        respuesta:
          tipo: numero
          valor: '6.2211'
          tolerancia: 0.01
          formato: en forma exacta (8·pi·R⁵/15) o con cuatro decimales
        distractores:
          - valor: '15.5527'
            mensaje: |
              $M R^{2}$ sin el $\tfrac{2}{5}$. El factor $2/5$ es lo que
              distingue una bola maciza de un aro.
          - valor: '3.1105'
            mensaje: |
              Ese es $\tfrac{1}{5}MR^{2}$: has puesto un solo sumando de los
              dos, igual que en el distractor del apartado anterior.
        pista: |
          $\tfrac{4\pi}{15}R^{3}\left(R^{2}+R^{2}\right)=\tfrac{8\pi R^{5}}{15}$,
          y $M=\tfrac{4}{3}\pi R^{3}$.
        desarrollo: |
          $$
          I_x = \frac{4\pi}{15}R^{3}\cdot 2R^{2} = \frac{8\pi R^{5}}{15}
          $$

          Y con $M=\tfrac{4}{3}\pi R^{3}$:

          $$
          \frac{2}{5}MR^{2} = \frac{2}{5}\cdot\frac{4}{3}\pi R^{3}\cdot R^{2}
          = \frac{8\pi R^{5}}{15}
          $$

          Idéntico. Con $R=1{,}3$: $6{,}2211$.
        veredicto: |
          En general, $I_x = \tfrac{M\left(b^{2}+c^{2}\right)}{5}$ con
          $M=\tfrac{4}{3}\pi abc$. Es la fórmula de tablas, y ahora sabes de
          dónde sale.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El estiramiento $x=aX$, $y=bY$, $z=cZ$ lleva el elipsoide a la
              bola unidad con jacobiano $abc$.
          - texto: >-
              El integrando $y^{2}+z^{2}$ se convierte en
              $b^{2}Y^{2}+c^{2}Z^{2}$, que no es un múltiplo de
              $Y^{2}+Z^{2}$: hay que separarlo en dos sumandos.
          - texto: >-
              Por simetría de la bola,
              $\iiint Y^{2}dV' = \iiint Z^{2}dV' = \tfrac{4\pi}{15}$, y sale
              $I_x=\tfrac{4\pi}{15}abc\left(b^{2}+c^{2}\right)$.
          - texto: >-
              Y como el eje $OX$ es el del semieje $a$, el resultado tiene que
              crecer si $a$ crece manteniendo $b$ y $c$: por eso $a$ aparece
              elevado al cuadrado.
            trampa: true
            mensaje: |
              $a$ aparece **elevado a uno**, dentro del factor $abc$. Alargar
              el elipsoide a lo largo del eje de giro añade masa, sí, pero esa
              masa se coloca a la misma distancia del eje que la que ya había:
              la inercia crece proporcionalmente a $a$, no a $a^{2}$. Los que
              van al cuadrado son los semiejes **perpendiculares** al eje.
        veredicto: |
          La regla de bolsillo: en un momento de inercia, los semiejes
          perpendiculares al eje de giro entran al cuadrado y el paralelo solo
          contribuye masa. Mirar los exponentes es la primera comprobación de
          cualquier fórmula de inercia.
    resolucion: |
      **Datos.** Elipsoide macizo homogéneo de semiejes $a$, $b$, $c$ y
      densidad $1$. Eje de giro: $OX$.

      ### 1 · El estiramiento, y por qué no basta con un factor

      $$
      x = aX, \quad y = bY, \quad z = cZ, \qquad J = abc
      $$

      $$
      I_x = \iiint\left(y^{2}+z^{2}\right)dV
      = abc\iiint_{\text{bola}}\left(b^{2}Y^{2}+c^{2}Z^{2}\right)dV'
      $$

      Aquí está la trampa del ejercicio: en el volumen, el cambio saca un
      único factor $abc$; en la inercia, **el integrando también se
      transforma, y con pesos distintos en cada eje**. Por eso hay que
      separar.

      ### 2 · La integral sobre la bola unidad

      Por simetría, $\iiint X^{2}dV' = \iiint Y^{2}dV' = \iiint Z^{2}dV'$, y
      como su suma es $\iiint \rho^{2}dV' = \tfrac{4\pi}{5}$:

      $$
      \iiint Y^{2}\,dV' = \frac{1}{3}\cdot\frac{4\pi}{5} = \frac{4\pi}{15}
      $$

      ### 3 · El resultado

      $$
      \boxed{\ I_x = \frac{4}{15}\,\pi\,abc\left(b^{2}+c^{2}\right)\ }
      $$

      Coincide con el resultado del boletín. En términos de la masa
      $M=\tfrac{4}{3}\pi abc$:

      $$
      I_x = \frac{M\left(b^{2}+c^{2}\right)}{5}
      $$

      ### 4 · Las comprobaciones

      | caso | qué da | qué debería dar |
      |---|---|---|
      | $a=b=c=R$ | $\tfrac{8\pi R^{5}}{15}$ | $\tfrac{2}{5}MR^{2}$ ✓ |
      | eje $OZ$ | $\tfrac{4\pi}{15}abc(a^{2}+b^{2})$ | los otros dos semiejes ✓ |
      | doblar $a$ | doble | solo añade masa a la misma distancia ✓ |

      **Lo que hay que llevarse.** El truco del estiramiento vale también para
      inercias, pero **el integrando se transforma con el cambio**: no basta
      con multiplicar por el jacobiano. Y el resultado se lee en los
      exponentes — los semiejes perpendiculares al eje al cuadrado, el
      paralelo a la primera.

  - id: centro-de-gravedad-semiesfera-densidad-radial
    titulo: El centro de gravedad de una semiesfera que pesa más por fuera
    fuente: >-
      Ejercicio 19 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él: sale (0, 0, 2a/5) exacto.
    nivel: practica
    enunciado: |
      La densidad en cada punto de la parte superior de la semiesfera
      $x^{2}+y^{2}+z^{2} \le a^{2}$ es proporcional a la distancia desde dicho
      punto al centro de la superficie. Calcular las coordenadas del centro de
      gravedad del sólido.
    pide: Las tres coordenadas del centro de gravedad.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de integrar nada: ¿qué se puede decir de $\overline{x}$ y $\overline{y}$?
        opciones:
          - texto: >-
              Que valen **cero**, por simetría: el cuerpo y la densidad son
              iguales al girar alrededor del eje $z$
            correcta: true
            mensaje: |
              Eso es, y ahorra dos terceras partes del ejercicio. La densidad
              solo depende de la distancia al centro, así que no distingue
              direcciones: para cada punto hay otro simétrico con la misma
              densidad.
          - texto: >-
              Que hay que calcularlas igual, porque la densidad no es constante
            mensaje: |
              La densidad no es constante pero **sí es radial**: vale lo mismo
              en todos los puntos que están a la misma distancia del centro. Esa
              es exactamente la simetría que anula $\overline{x}$ y $\overline{y}$.
          - texto: >-
              Que valen $a/2$, el centro del cuerpo
            mensaje: |
              El cuerpo está centrado en el eje $z$: su sección a cualquier
              altura es un disco centrado en el origen. Su centroide no puede
              estar desplazado hacia un lado.

      - tipo: reconocer
        pregunta: |
          «Proporcional a la distancia al centro» significa
          $\delta = k\rho$. ¿Qué queda en la integral de la masa?
        opciones:
          - texto: >-
              $k\rho \cdot \rho^{2}\operatorname{sen}\varphi$, o sea
              $k\rho^{3}\operatorname{sen}\varphi$
            correcta: true
            mensaje: |
              Sí: la densidad aporta un $\rho$ y el jacobiano de las esféricas
              otros dos, más el seno. La $k$ se cancelará al dividir, así que
              ni hace falta darle valor.
          - texto: >-
              $k\rho^{2}\operatorname{sen}\varphi$, porque el jacobiano ya
              incluye la densidad
            mensaje: |
              El jacobiano es una cosa —cómo se deforma el volumen al cambiar
              de coordenadas— y la densidad otra. Se multiplican los dos.
          - texto: >-
              $k\rho$, porque en esféricas el elemento de volumen es
              $d\rho\,d\varphi\,d\theta$
            mensaje: |
              El elemento de volumen en esféricas es
              $\rho^{2}\operatorname{sen}\varphi\,d\rho\,d\varphi\,d\theta$. Sin
              ese factor, la integral no mide un volumen.

      - tipo: calcular
        titulo: La masa
        pregunta: |
          Con $\varphi$ de 0 a $\tfrac{\pi}{2}$ —solo la mitad superior—,
          calcula la masa
          $\displaystyle\int_0^{2\pi}\!\!\int_0^{\pi/2}\!\!\int_0^{a}
          k\rho^{3}\operatorname{sen}\varphi\,d\rho\,d\varphi\,d\theta$,
          con $k=1$ y $a=1{,}5$.
        respuesta:
          tipo: numero
          valor: '7.9522'
          tolerancia: 0.01
          formato: en forma exacta (pi·a^4/2) o con cuatro decimales
        distractores:
          - valor: '15.9043'
            mensaje: |
              El doble: has integrado $\varphi$ hasta $\pi$, o sea la esfera
              entera. El enunciado dice la **parte superior**.
          - valor: '7.0686'
            mensaje: |
              Eso es $\tfrac23\pi a^{3}$, el **volumen** de la semiesfera. Con
              densidad no constante, masa y volumen no coinciden ni en valor ni
              en dimensiones.
        pista: |
          $\int_0^{\pi/2}\operatorname{sen}\varphi\,d\varphi = 1$ y
          $\int_0^a \rho^{3}d\rho = a^{4}/4$.
        desarrollo: |
          Los tres límites son constantes, así que la triple se separa:

          $$
          m = k\underbrace{\int_0^{2\pi}\!d\theta}_{2\pi}
          \underbrace{\int_0^{\pi/2}\!\operatorname{sen}\varphi\,d\varphi}_{1}
          \underbrace{\int_0^{a}\!\rho^{3}d\rho}_{a^{4}/4}
          = \frac{k\pi a^{4}}{2}
          $$

          Con $k=1$ y $a=1{,}5$: $7{,}9522$.

      - tipo: calcular
        titulo: La altura del centro de gravedad
        pregunta: |
          El momento es
          $\displaystyle\iiint z\,\delta\,dV$ con
          $z=\rho\cos\varphi$. Dividiendo entre la masa, ¿a qué altura está el
          centro de gravedad, con $a=1{,}5$?
        respuesta:
          tipo: numero
          valor: '0.6'
          tolerancia: 0.002
          formato: en forma exacta (2a/5) o con cuatro decimales
        distractores:
          - valor: '0.5625'
            mensaje: |
              Eso es $3a/8$, la altura del centroide de una semiesfera
              **homogénea**. Aquí la densidad crece hacia fuera, así que la
              masa se corre hacia arriba: $2a/5 > 3a/8$.
          - valor: '0.75'
            mensaje: |
              $a/2$ sería el punto medio de la altura, y ningún cuerpo con la
              sección estrechándose arriba tiene ahí su centroide.
        pista: |
          $\int_0^{\pi/2}\operatorname{sen}\varphi\cos\varphi\,d\varphi=\tfrac12$
          y $\int_0^a\rho^{4}d\rho=\tfrac{a^{5}}{5}$.
        desarrollo: |
          $$
          \iiint z\,\delta\,dV
          = k\int_0^{2\pi}\!d\theta
          \int_0^{\pi/2}\!\operatorname{sen}\varphi\cos\varphi\,d\varphi
          \int_0^{a}\!\rho^{4}d\rho
          = k\cdot 2\pi\cdot\frac12\cdot\frac{a^{5}}{5}
          $$

          $$
          \overline{z} = \frac{k\pi a^{5}/5}{k\pi a^{4}/2} = \frac{2a}{5}
          $$

          La $k$ se cancela, como tenía que pasar: el centro de gravedad no
          depende de la constante de proporcionalidad.

          Con $a=1{,}5$: $\overline{z} = 0{,}6$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Por simetría de revolución alrededor del eje $z$ —el cuerpo y la
              densidad—, $\overline{x} = \overline{y} = 0$.
          - texto: >-
              La densidad es $\delta = k\rho$, así que el integrando de la masa
              es $k\rho^{3}\operatorname{sen}\varphi$ y el del momento, ese por
              $\rho\cos\varphi$.
          - texto: >-
              La constante $k$ aparece en el numerador y en el denominador, así
              que se cancela y no hace falta conocerla.
          - texto: >-
              Y como la densidad crece con el radio, el centro de gravedad sale
              **más bajo** que el de la semiesfera homogénea.
            trampa: true
            mensaje: |
              Más **alto**, no más bajo. La densidad crece hacia la superficie,
              y en una semiesfera la superficie está sobre todo arriba y en los
              bordes; el material pesado de la cúpula tira del centroide hacia
              arriba. Los números: $\tfrac{2a}{5}=0{,}4a$ frente a los
              $\tfrac{3a}{8}=0{,}375a$ del caso homogéneo.
        veredicto: |
          Esa comparación con el caso homogéneo es la comprobación gratis del
          ejercicio: si tu resultado sale **por debajo** de $3a/8$, la densidad
          está aplicada al revés.
    resolucion: |
      **Datos.** Media bola de radio $a$, la superior, con densidad
      proporcional a la distancia al centro: $\delta = k\rho$.

      ### 1 · Dos coordenadas gratis

      El cuerpo es de revolución alrededor del eje $z$ **y la densidad
      también** —solo depende de $\rho$, que no distingue direcciones—. Por
      tanto

      $$
      \overline{x} = \overline{y} = 0
      $$

      sin integrar nada. Solo queda $\overline{z}$.

      ### 2 · Masa y momento

      En esféricas, $dV = \rho^{2}\operatorname{sen}\varphi\,d\rho\,d\varphi\,d\theta$
      y $z = \rho\cos\varphi$. Con $\varphi\in[0,\pi/2]$ por ser la mitad de
      arriba, los tres límites son constantes y todo se separa:

      $$
      m = k\,(2\pi)(1)\frac{a^{4}}{4} = \frac{k\pi a^{4}}{2}
      $$

      $$
      \iiint z\,\delta\,dV
      = k\,(2\pi)\left(\frac12\right)\frac{a^{5}}{5} = \frac{k\pi a^{5}}{5}
      $$

      ### 3 · El centro de gravedad

      $$
      \overline{z} = \frac{k\pi a^{5}/5}{k\pi a^{4}/2} = \frac{2a}{5}
      $$

      $$
      \boxed{\ (\overline{x},\overline{y},\overline{z}) = \left(0,\,0,\,\frac{2a}{5}\right)\ }
      $$

      Coincide con el resultado del boletín.

      **Dos cosas que hay que llevarse.** La primera: la constante $k$ **se
      cancela**, y tenía que hacerlo — el centro de gravedad no puede depender
      de en qué unidades se mida la densidad. Si no se te cancela, hay un
      error.

      La segunda es la comprobación: una semiesfera **homogénea** tiene su
      centroide en $\tfrac{3a}{8}=0{,}375a$, y aquí sale $\tfrac{2a}{5}=0{,}4a$,
      **más arriba**. Tiene sentido, porque la densidad crece hacia la
      superficie y en una semiesfera la superficie está sobre todo en la
      cúpula. Si te saliera más bajo que $3a/8$, la densidad está al revés.

  - id: boveda-de-viviani
    titulo: La esfera recortada por un cilindro que la toca por dentro
    fuente: >-
      Ejercicio 15 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él: sale a³(3π−4)/9 exacto.
    nivel: practica
    enunciado: |
      Calcular el volumen del cuerpo limitado por las condiciones
      $z \ge 0$, $x^{2}+y^{2} \le ax$ y $x^{2}+y^{2}+z^{2} \le a^{2}$.
    pide: El volumen del cuerpo.
    pasos:
      - tipo: reconocer
        pregunta: |
          Tres condiciones. ¿Cuál pone el contorno del suelo y cuál la tapa?
        opciones:
          - texto: >-
              El **cilindro** $x^{2}+y^{2}\le ax$ pone el contorno; la
              **esfera** pone la tapa, $z=\sqrt{a^{2}-r^{2}}$
            correcta: true
            mensaje: |
              Eso es, y con la misma regla del ejercicio 10: el cilindro no
              lleva $z$ en su ecuación, así que es una pared. Este cuerpo tiene
              nombre propio, la **bóveda de Viviani**.
          - texto: >-
              La esfera pone el contorno y el cilindro la tapa
            mensaje: |
              El cilindro no puede ser la tapa: su ecuación no contiene $z$, y
              por tanto es la misma curva a cualquier altura. Una pared
              vertical no tapa nada.
          - texto: >-
              El plano $z\ge0$ pone la tapa
            mensaje: |
              $z\ge 0$ dice que el cuerpo está **por encima** del plano, o sea
              que ese plano es el suelo. La tapa es la superficie que lo cierra
              por arriba, y esa es la esfera.

      - tipo: reconocer
        pregunta: |
          El cilindro $x^{2}+y^{2}\le ax$ en polares, ¿qué es?
        opciones:
          - texto: >-
              $r \le a\cos\theta$, con
              $\theta\in\left[-\tfrac{\pi}{2},\tfrac{\pi}{2}\right]$
            correcta: true
            mensaje: |
              Sí: es la circunferencia de centro $(a/2,\,0)$ y radio $a/2$, que
              pasa por el origen y **toca a la esfera por dentro**. Ojo a la
              diferencia con los ejercicios 2 y 10: allí era $2a\cos\theta$
              porque el término lineal era $2ax$; aquí es $ax$, y sale la
              mitad.
          - texto: >-
              $r \le 2a\cos\theta$
            mensaje: |
              Ese es el de los ejercicios 2 y 10, donde el enunciado dice
              $2ax$. Aquí dice $ax$, así que el radio es $a/2$ y la ecuación
              polar es $r=a\cos\theta$. Confundirlos hace que el cilindro se
              salga de la esfera.
          - texto: >-
              $r \le a$
            mensaje: |
              Eso sería un cilindro centrado en el eje $z$, del mismo radio que
              la esfera: no recortaría nada. El término lineal en $x$ desplaza
              el centro.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Queda
          $\displaystyle\int_{-\pi/2}^{\pi/2}\!\!\int_0^{a\cos\theta}\sqrt{a^{2}-r^{2}}\;r\,dr\,d\theta$.
          Con $a=1{,}4$, ¿cuánto vale?
        respuesta:
          tipo: numero
          valor: '1.6540'
          tolerancia: 0.005
          formato: en forma exacta (a^3(3pi-4)/9) o con cuatro decimales
        distractores:
          - valor: '5.7470'
            mensaje: |
              Eso es media esfera, $\tfrac23\pi a^{3}$: es lo que saldría sin
              el cilindro. La bóveda es bastante menos de la tercera parte de
              la semiesfera.
          - valor: '0.8270'
            mensaje: |
              La mitad del resultado: probablemente $\theta$ de 0 a $\pi/2$. El
              cilindro se recorre entero con $\theta$ entre $-\pi/2$ y
              $\pi/2$.
          - valor: '3.3080'
            mensaje: |
              El doble. Suele venir de usar $2a\cos\theta$ de límite —el
              cilindro de los ejercicios 2 y 10— en vez de $a\cos\theta$.
        pista: |
          La integral en $r$ da
          $\tfrac{a^{3}}{3}\left(1-\lvert\operatorname{sen}\theta\rvert^{3}\right)$,
          y $\int_{-\pi/2}^{\pi/2}\lvert\operatorname{sen}\theta\rvert^{3}d\theta=\tfrac43$.
        desarrollo: |
          La integral en $r$, con $t=a^{2}-r^{2}$:

          $$
          \int_0^{a\cos\theta} r\sqrt{a^{2}-r^{2}}\,dr
          = \frac{a^{3}}{3}\left(1-\lvert\operatorname{sen}\theta\rvert^{3}\right)
          $$

          —el valor absoluto aparece porque
          $\left(a^{2}-a^{2}\cos^{2}\theta\right)^{3/2}
          = a^{3}\lvert\operatorname{sen}\theta\rvert^{3}$, y $\theta$ toma
          valores negativos.

          $$
          V = \frac{a^{3}}{3}\left[\pi - \frac43\right]
          = \frac{a^{3}(3\pi-4)}{9}
          $$

          Con $a=1{,}4$: $1{,}6540$.

      - tipo: justificar
        pregunta: Ordena el planteamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El cilindro no lleva $z$: es una pared, y en polares es
              $r=a\cos\theta$ — radio $a/2$, centro en $(a/2,0)$.
          - texto: >-
              La tapa es la esfera, $z=\sqrt{a^{2}-r^{2}}$, y el suelo el plano
              $z=0$.
          - texto: >-
              Al integrar en $r$ aparece
              $\lvert\operatorname{sen}\theta\rvert^{3}$, con valor absoluto,
              porque $\theta$ recorre también valores negativos.
          - texto: >-
              Como el cilindro pasa por el centro de la esfera, el cuerpo es
              exactamente la mitad de la semiesfera.
            trampa: true
            mensaje: |
              El cilindro pasa por el **origen** y es tangente a la esfera por
              dentro, pero no la parte por la mitad: su base es un disco de
              radio $a/2$ dentro de un disco de radio $a$, o sea la **cuarta
              parte** del área. Y como la esfera es más baja en los bordes, el
              volumen sale aún menor: $\tfrac{3\pi-4}{9}\approx 0{,}60\,a^{3}$
              frente a los $2{,}09\,a^{3}$ de la semiesfera, un 29 %.
        veredicto: |
          Este cuerpo tiene nombre —la **bóveda de Viviani**— y es famoso
          precisamente porque su volumen sale sin funciones trascendentes pese
          a mezclar una esfera con un cilindro.
    resolucion: |
      **Datos.** $z\ge0$, dentro del cilindro $x^{2}+y^{2}\le ax$ y dentro de
      la esfera $x^{2}+y^{2}+z^{2}\le a^{2}$.

      ### 1 · Quién es quién

      | superficie | ¿lleva $z$? | papel |
      |---|---|---|
      | $x^{2}+y^{2}=ax$ | no | pared → **contorno** |
      | $x^{2}+y^{2}+z^{2}=a^{2}$ | sí | **tapa**, $z=\sqrt{a^{2}-r^{2}}$ |
      | $z=0$ | — | suelo |

      El cilindro tiene radio $a/2$ y centro $(a/2,0)$: pasa por el origen y es
      **tangente por dentro** a la esfera. El cuerpo es la **bóveda de
      Viviani**.

      Ojo a la diferencia con los ejercicios 2 y 10: allí el término lineal era
      $2ax$ y salía $r=2a\cos\theta$; aquí es $ax$ y sale la mitad.

      ### 2 · El volumen

      $$
      V = \int_{-\pi/2}^{\pi/2}\!\!\int_0^{a\cos\theta}
      \sqrt{a^{2}-r^{2}}\;r\,dr\,d\theta
      $$

      La de dentro, con $t=a^{2}-r^{2}$:

      $$
      \left[-\frac{(a^{2}-r^{2})^{3/2}}{3}\right]_0^{a\cos\theta}
      = \frac{a^{3}}{3}\left(1-\lvert\operatorname{sen}\theta\rvert^{3}\right)
      $$

      El **valor absoluto** importa: $\theta$ recorre valores negativos y
      $(a^{2}\operatorname{sen}^{2}\theta)^{3/2}$ es
      $a^{3}\lvert\operatorname{sen}\theta\rvert^{3}$, no
      $a^{3}\operatorname{sen}^{3}\theta$. Sin él, la integral daría cero por
      simetría impar y el resultado sería $\tfrac{\pi a^{3}}{3}$: mal.

      $$
      V = \frac{a^{3}}{3}\left[\int_{-\pi/2}^{\pi/2}d\theta
      - \int_{-\pi/2}^{\pi/2}\lvert\operatorname{sen}\theta\rvert^{3}d\theta\right]
      = \frac{a^{3}}{3}\left[\pi-\frac43\right]
      $$

      $$
      \boxed{\ V = \frac{a^{3}\left(3\pi-4\right)}{9}\ }
      $$

      Coincide con el resultado del boletín.

      **La comprobación.** $\tfrac{3\pi-4}{9}\approx 0{,}60$, y la semiesfera
      vale $\tfrac23\pi a^{3}\approx 2{,}09\,a^{3}$: la bóveda es el **29 %**
      de ella. Tiene sentido — su base es un disco de radio $a/2$ dentro de uno
      de radio $a$, la cuarta parte del área, y encima la esfera baja hacia los
      bordes.

  - id: esfera-cortada-por-el-cono
    titulo: La esfera partida por un cono, y el ángulo que lo decide todo
    fuente: >-
      Ejercicio 14 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él: sale 2√2πa³/3 exacto.
    nivel: practica
    enunciado: |
      Calcular el volumen del cuerpo limitado por las condiciones
      $x^{2}+y^{2}+z^{2} \le a^{2}$ y $x^{2}+y^{2} \ge z^{2}$.
    pide: El volumen del cuerpo.
    pasos:
      - tipo: reconocer
        pregunta: |
          La segunda condición, $x^{2}+y^{2} \ge z^{2}$, ¿qué región describe?
        opciones:
          - texto: >-
              Lo que queda **fuera** de un cono doble de 45°, con el vértice en
              el origen
            correcta: true
            mensaje: |
              Eso es. La igualdad $x^{2}+y^{2}=z^{2}$ es el cono de 45° abierto
              hacia arriba **y** hacia abajo; la desigualdad $\ge$ deja lo de
              fuera, que es la parte ancha, en forma de rosquilla alrededor del
              ecuador.
          - texto: >-
              Lo que queda **dentro** del cono
            mensaje: |
              Al revés. Dentro del cono el eje $z$ manda: por ejemplo el punto
              $(0,0,1)$ tiene $x^{2}+y^{2}=0$ y $z^{2}=1$, así que **no**
              cumple $x^{2}+y^{2}\ge z^{2}$. El polo queda fuera del cuerpo.
          - texto: >-
              Un cilindro de radio $z$
            mensaje: |
              Un cilindro tendría el radio constante. Aquí el límite crece con
              la altura: en cada $z$ el corte es el exterior de un disco de
              radio $|z|$, y eso es un cono.

      - tipo: reconocer
        pregunta: |
          En esféricas, con $\varphi$ el ángulo desde el eje $z$, ¿en qué se
          convierte esa condición?
        opciones:
          - texto: >-
              $\dfrac{\pi}{4} \le \varphi \le \dfrac{3\pi}{4}$
            correcta: true
            mensaje: |
              Exacto, y eso es lo que hace las esféricas obligatorias aquí:
              el cono es una **superficie coordenada** suya, así que la
              condición se vuelve un intervalo constante de $\varphi$. En
              cilíndricas habría que partir el cuerpo.
          - texto: >-
              $0 \le \varphi \le \dfrac{\pi}{4}$
            mensaje: |
              Ese es el casquete de **dentro** del cono, alrededor del polo
              norte. La condición del enunciado deja fuera los dos polos y se
              queda con la franja del ecuador.
          - texto: >-
              $\rho \ge z$, y hay que despejar
            mensaje: |
              En esféricas $x^{2}+y^{2} = \rho^{2}\operatorname{sen}^{2}\varphi$
              y $z^{2}=\rho^{2}\cos^{2}\varphi$, así que $\rho$ **se cancela**:
              la condición no depende del radio, solo del ángulo. Ese es
              justamente el regalo del ejercicio.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Con $\rho$ de 0 a $a$, $\theta$ de 0 a $2\pi$ y $\varphi$ entre
          $\tfrac{\pi}{4}$ y $\tfrac{3\pi}{4}$, y el jacobiano
          $\rho^{2}\operatorname{sen}\varphi$, ¿cuánto vale el volumen con
          $a=1{,}4$?
        respuesta:
          tipo: numero
          valor: '8.1275'
          tolerancia: 0.01
          formato: en forma exacta (2·sqrt(2)·pi·a^3/3) o con cuatro decimales
        distractores:
          - valor: '11.4939'
            mensaje: |
              Eso es $\tfrac43\pi a^{3}$, la esfera **entera**. El cono le quita
              dos casquetes, uno por polo, así que el cuerpo es
              $\tfrac{2\sqrt2}{3}\pi a^{3}\approx 2{,}96a^{3}$ frente a
              $4{,}19a^{3}$.
          - valor: '5.7470'
            mensaje: |
              La mitad de la esfera. El cuerpo no es medio: es la franja del
              ecuador, que resulta ser el $\tfrac{\sqrt2}{2} \approx 71\%$ de
              la esfera.
          - valor: '4.0638'
            mensaje: |
              La mitad del resultado: probablemente has tomado $\varphi$ solo
              de $\pi/4$ a $\pi/2$, quedándote con la mitad de arriba.
        pista: |
          $\int_{\pi/4}^{3\pi/4}\operatorname{sen}\varphi\,d\varphi = \sqrt2$.
        desarrollo: |
          Las tres integrales se separan porque los límites son constantes:

          $$
          V = \underbrace{\int_0^{2\pi}\!\!d\theta}_{2\pi}
          \underbrace{\int_{\pi/4}^{3\pi/4}\!\operatorname{sen}\varphi\,d\varphi}_{\sqrt2}
          \underbrace{\int_0^{a}\!\rho^{2}\,d\rho}_{a^{3}/3}
          $$

          $$
          V = 2\pi\cdot\sqrt2\cdot\frac{a^{3}}{3} = \frac{2\sqrt2\,\pi a^{3}}{3}
          $$

          Con $a=1{,}4$: $8{,}1275$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $x^{2}+y^{2}=z^{2}$ es un cono doble de 45°, y la desigualdad
              $\ge$ deja la franja de **fuera**, alrededor del ecuador.
          - texto: >-
              En esféricas $\rho$ se cancela en esa condición, que se reduce a
              $\tan^{2}\varphi \ge 1$, o sea
              $\tfrac{\pi}{4}\le\varphi\le\tfrac{3\pi}{4}$.
          - texto: >-
              Los tres límites son constantes, así que la triple se separa en
              producto y sale $\tfrac{2\sqrt2}{3}\pi a^{3}$.
          - texto: >-
              Y como el cono corta la esfera justo por la mitad de su altura,
              el cuerpo es exactamente la mitad de la esfera.
            trampa: true
            mensaje: |
              El cono corta a la esfera en el paralelo $z = \pm a/\sqrt2$, no
              por la mitad — y aunque cortara por la mitad, «mitad de la
              altura» no es «mitad del volumen»: cerca del ecuador la esfera es
              mucho más ancha. Los números lo dicen: el cuerpo es el
              $\tfrac{\sqrt2}{2}\approx 71\,\%$ de la esfera, no el 50 %.
        veredicto: |
          Lo que hace fácil este ejercicio es que **las tres variables tienen
          límites constantes**: no es que las esféricas sean más cómodas en
          general, es que aquí el cono y la esfera son las dos superficies
          coordenadas del sistema.
    resolucion: |
      **Datos.** El cuerpo limitado por $x^{2}+y^{2}+z^{2}\le a^{2}$ (dentro de
      la esfera) y $x^{2}+y^{2}\ge z^{2}$ (fuera del cono).

      ### 1 · Qué cuerpo es

      $x^{2}+y^{2}=z^{2}$ es un **cono doble de 45°** con el vértice en el
      origen. La desigualdad $\ge$ se queda con lo de fuera: la esfera menos
      los dos casquetes polares, o sea una franja gruesa alrededor del ecuador.

      ### 2 · Por qué esféricas, y no cilíndricas

      Con $x^{2}+y^{2}=\rho^{2}\operatorname{sen}^{2}\varphi$ y
      $z^{2}=\rho^{2}\cos^{2}\varphi$, la condición del cono queda

      $$
      \rho^{2}\operatorname{sen}^{2}\varphi \ge \rho^{2}\cos^{2}\varphi
      \;\Longleftrightarrow\;
      \tan^{2}\varphi \ge 1
      \;\Longleftrightarrow\;
      \frac{\pi}{4}\le\varphi\le\frac{3\pi}{4}
      $$

      **El $\rho$ se cancela**: la condición no depende del radio. Por eso los
      tres límites salen constantes y la triple se parte en producto. En
      cilíndricas habría que partir el cuerpo en tres trozos.

      ### 3 · El volumen

      $$
      V = \int_0^{2\pi}\!\!\int_{\pi/4}^{3\pi/4}\!\!\int_0^{a}
      \rho^{2}\operatorname{sen}\varphi\;d\rho\,d\varphi\,d\theta
      = 2\pi \cdot \sqrt2 \cdot \frac{a^{3}}{3}
      $$

      $$
      \boxed{\ V = \frac{2\sqrt2\,\pi a^{3}}{3}\ }
      $$

      Coincide con el resultado del boletín.

      **La comprobación que conviene.** La esfera entera vale
      $\tfrac43\pi a^{3}$, así que el cuerpo es
      $\tfrac{2\sqrt2/3}{4/3} = \tfrac{\sqrt2}{2} \approx 71\,\%$ de ella.
      Tiene sentido: el cono quita dos casquetes que llegan hasta
      $z=\pm a/\sqrt2$, y cerca de los polos la esfera es estrecha. Si te
      saliera más del 100 % o menos del 50 %, hay un error de límites.

  - id: cilindro-bajo-paraboloide
    titulo: El mismo cilindro descentrado, ahora con un paraboloide encima
    fuente: >-
      Ejercicio 13 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él: sale 3πa³/4 exacto.
    nivel: practica
    enunciado: |
      Calcular el volumen de la parte del cilindro $x^{2}+y^{2}=2ax$ limitada
      por el paraboloide $x^{2}+y^{2}=2az$ y el plano $OXY$.
    pide: El volumen del cuerpo.
    pasos:
      - tipo: reconocer
        pregunta: |
          Es el mismo cilindro del ejercicio 10, pero la tapa ha cambiado.
          ¿En qué se diferencia un paraboloide de un cono en polares?
        opciones:
          - texto: >-
              El cono es $z=r$ y el paraboloide $z=\dfrac{r^{2}}{2a}$: uno
              crece lineal y el otro cuadrático
            correcta: true
            mensaje: |
              Eso es. $x^{2}+y^{2}=2az$ da $r^{2}=2az$, o sea
              $z=\tfrac{r^{2}}{2a}$. Cerca del eje el paraboloide es **más
              plano** que el cono, y lejos sube mucho más deprisa.
          - texto: >-
              En nada: los dos son $z=r$
            mensaje: |
              El cono lleva $z^{2}$ en su ecuación y el paraboloide lleva $z$
              a la primera. Esa diferencia de exponente es la que separa
              $z=r$ de $z=r^{2}/(2a)$.
          - texto: >-
              El paraboloide es $z=r^{2}$, sin más
            mensaje: |
              Falta el $2a$ del denominador, y no es un detalle: sin él las
              unidades no cuadran y el resultado sale con una potencia de más
              de $a$.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Con el contorno $r=2a\cos\theta$ y la tapa $z=\tfrac{r^{2}}{2a}$, el
          volumen es
          $\displaystyle\int_{-\pi/2}^{\pi/2}\!\!\int_0^{2a\cos\theta}\frac{r^{2}}{2a}\,r\,dr\,d\theta$.
          Con $a=1{,}3$, ¿cuánto vale?
        respuesta:
          tipo: numero
          valor: '5.1766'
          tolerancia: 0.01
          formato: en forma exacta (3·pi·a^3/4) o con cuatro decimales
        distractores:
          - valor: '7.8116'
            mensaje: |
              Ese es el resultado del ejercicio 10, con el **cono** de tapa. El
              paraboloide es más plano cerca del eje, así que encierra menos
              volumen: $\tfrac34\pi a^{3}$ frente a $\tfrac{32}{9}a^{3}$.
          - valor: '2.5883'
            mensaje: |
              La mitad: probablemente $\theta$ de 0 a $\pi/2$ en vez del
              intervalo entero.
        pista: |
          La integral en $r$ deja $\tfrac{(2a\cos\theta)^{4}}{8a}$, y
          $\displaystyle\int_{-\pi/2}^{\pi/2}\cos^{4}\theta\,d\theta=\frac{3\pi}{8}$.
        desarrollo: |
          $$
          \int_0^{2a\cos\theta}\frac{r^{3}}{2a}\,dr
          = \frac{(2a\cos\theta)^{4}}{8a}
          = 2a^{3}\cos^{4}\theta
          $$

          $$
          V = 2a^{3}\int_{-\pi/2}^{\pi/2}\cos^{4}\theta\,d\theta
          = 2a^{3}\cdot\frac{3\pi}{8} = \frac{3\pi a^{3}}{4}
          $$

          Con $a=1{,}3$: $5{,}1766$.

      - tipo: justificar
        pregunta: Ordena la comparación con el ejercicio 10. Una pieza es falsa.
        piezas:
          - texto: >-
              El contorno es el mismo en los dos: $r=2a\cos\theta$, el cilindro
              que pasa por el eje $z$.
          - texto: >-
              Lo que cambia es la tapa: allí el cono, $z=r$; aquí el
              paraboloide, $z=\tfrac{r^{2}}{2a}$.
          - texto: >-
              Por eso la integral en $\theta$ pasa de $\cos^{3}$ a $\cos^{4}$,
              y de $\tfrac43$ a $\tfrac{3\pi}{8}$.
          - texto: >-
              Y como el paraboloide crece más deprisa que el cono, encierra
              **más** volumen que él.
            trampa: true
            mensaje: |
              Crece más deprisa **lejos** del eje, pero aquí el recinto llega
              como mucho hasta $r=2a$, y en ese tramo el paraboloide va por
              debajo: en $r=a$ el cono está a altura $a$ y el paraboloide a
              $a/2$. Los números lo confirman —$\tfrac34\pi a^{3}\approx
              2{,}36a^{3}$ frente a $\tfrac{32}{9}a^{3}\approx 3{,}56a^{3}$—.
              Comparar tasas de crecimiento sin mirar **en qué intervalo** es
              el error.
        veredicto: |
          Dos ejercicios con el mismo recinto y distinta tapa, puestos juntos a
          propósito: enseñan que el contorno y la altura se leen por separado,
          y que cambiar solo una de las dos cambia el resultado por completo.
    resolucion: |
      **Datos.** El cilindro $x^{2}+y^{2}=2ax$, limitado por arriba por el
      paraboloide $x^{2}+y^{2}=2az$ y por abajo por el plano $OXY$.

      ### 1 · Lo que se repite y lo que cambia

      | superficie | en polares | papel |
      |---|---|---|
      | $x^{2}+y^{2}=2ax$ | $r=2a\cos\theta$ | contorno (pared vertical) |
      | $x^{2}+y^{2}=2az$ | $z=\tfrac{r^{2}}{2a}$ | **tapa** |
      | $z=0$ | — | suelo |

      Es el mismo contorno del ejercicio 10 con otra tapa. Y la diferencia
      está en el exponente: el cono era $z=r$, lineal; el paraboloide es
      cuadrático.

      ### 2 · El volumen

      $$
      V = \int_{-\pi/2}^{\pi/2}\!\!\int_0^{2a\cos\theta}
      \underbrace{\frac{r^{2}}{2a}}_{\text{altura}}\cdot
      \underbrace{r}_{\text{jacobiano}}\,dr\,d\theta
      $$

      La de dentro:

      $$
      \frac{1}{2a}\cdot\frac{(2a\cos\theta)^{4}}{4} = 2a^{3}\cos^{4}\theta
      $$

      Y con $\int_{-\pi/2}^{\pi/2}\cos^{4}\theta\,d\theta = \tfrac{3\pi}{8}$:

      $$
      \boxed{\ V = 2a^{3}\cdot\frac{3\pi}{8} = \frac{3\pi a^{3}}{4}\ }
      $$

      Coincide con el resultado del boletín.

      **Lo que hay que llevarse.** Comparado con el ejercicio 10 —mismo
      cilindro, tapa de cono— este da **menos** volumen:
      $\tfrac34\pi a^{3} \approx 2{,}36a^{3}$ frente a
      $\tfrac{32}{9}a^{3}\approx 3{,}56a^{3}$. Y no porque el paraboloide
      crezca menos en general, sino porque **en este intervalo** va por
      debajo: en $r=a$ el cono está a altura $a$ y el paraboloide a $a/2$. Las
      comparaciones de crecimiento hay que hacerlas en el tramo que toca.

  - id: masa-del-paralelepipedo
    titulo: La masa de un ladrillo, y las tres integrales que salen solas
    fuente: >-
      Ejercicio 18 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él: sale abc(a+b+c)/2 exacto.
    nivel: practica
    enunciado: |
      Calcular la masa del paralelepípedo rectangular
      $0\le x\le a$, $0\le y\le b$, $0\le z\le c$, cuya densidad en cada punto
      $(x,y,z)$ es $f(x,y,z) = x+y+z$.
    pide: La masa del paralelepípedo.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los límites son constantes y el integrando es una suma. ¿Qué permite
          eso?
        opciones:
          - texto: >-
              Partir la integral en **tres**, y en cada una integrar la
              variable que aparece y multiplicar por lo demás
            correcta: true
            mensaje: |
              Eso es. Con límites constantes el recinto es un producto de
              intervalos, y la integral de una suma es la suma de las
              integrales. Las tres salen iguales cambiando el nombre.
          - texto: >-
              Nada especial: hay que hacer la triple entera de dentro afuera
            mensaje: |
              Se puede, y sale. Pero mirar la estructura antes ahorra dos
              tercios del trabajo: los tres sumandos son el mismo cálculo con
              las letras cambiadas, y el resultado lo enseña —el
              $(a+b+c)$ del final es justo esa simetría.
          - texto: >-
              Que la masa es el volumen por la densidad en el centro
            mensaje: |
              Aquí resulta ser cierto, porque la densidad es **lineal**: su
              valor medio coincide con el del centro. Pero eso hay que
              justificarlo, y con una densidad como $xyz$ o $x^{2}$ sería
              falso. Como atajo sirve; como respuesta, no.

      - tipo: calcular
        titulo: El primer sumando
        pregunta: |
          Calcula $\displaystyle\int_0^{c}\!\!\int_0^{b}\!\!\int_0^{a} x\,dx\,dy\,dz$
          con $a=1{,}3$, $b=2{,}1$ y $c=0{,}9$.
        respuesta:
          tipo: numero
          valor: '1.5970'
          tolerancia: 0.002
          formato: en forma exacta (a^2·b·c/2) o con cuatro decimales
        distractores:
          - valor: '3.1941'
            mensaje: |
              El doble: te falta el $\tfrac12$ de la primitiva de $x$.
              $\int_0^a x\,dx = a^{2}/2$, no $a^{2}$.
          - valor: '2.4570'
            mensaje: |
              Eso es $abc$, el volumen: has integrado 1 en vez de $x$.
        pista: |
          $\int_0^a x\,dx = \tfrac{a^{2}}{2}$, y las otras dos son constantes
          que dan $b$ y $c$.
        desarrollo: |
          Las tres integrales se separan porque los límites son constantes:

          $$
          \int_0^{c}\!\!\int_0^{b}\!\!\int_0^{a} x\,dx\,dy\,dz
          = \underbrace{\left(\int_0^a x\,dx\right)}_{a^{2}/2}
            \underbrace{\left(\int_0^b dy\right)}_{b}
            \underbrace{\left(\int_0^c dz\right)}_{c}
          = \frac{a^{2}bc}{2}
          $$

          Con $a=1{,}3$, $b=2{,}1$, $c=0{,}9$:
          $\tfrac{1{,}69\cdot 2{,}1\cdot 0{,}9}{2} = 1{,}5970$.

      - tipo: calcular
        titulo: La masa
        pregunta: |
          Los otros dos sumandos son iguales con las letras cambiadas. ¿Cuánto
          vale la masa total, con los mismos $a$, $b$ y $c$?
        respuesta:
          tipo: numero
          valor: '5.2826'
          tolerancia: 0.005
          formato: en forma exacta (abc(a+b+c)/2) o con cuatro decimales
        distractores:
          - valor: '4.7911'
            mensaje: |
              Eso es tres veces el primer sumando: los tres **no** son iguales
              en valor, solo en forma. El primero lleva $a^{2}$, el segundo
              $b^{2}$ y el tercero $c^{2}$.
          - valor: '10.5651'
            mensaje: |
              El doble del resultado: sobra el $\tfrac12$, o se ha sumado dos
              veces.
        pista: |
          $\tfrac{a^{2}bc}{2}+\tfrac{ab^{2}c}{2}+\tfrac{abc^{2}}{2}$: saca
          $\tfrac{abc}{2}$ factor común.
        desarrollo: |
          $$
          m = \frac{a^{2}bc}{2}+\frac{ab^{2}c}{2}+\frac{abc^{2}}{2}
          = \frac{abc}{2}\,(a+b+c)
          $$

          Con $a=1{,}3$, $b=2{,}1$, $c=0{,}9$:
          $\tfrac{2{,}457}{2}\cdot 4{,}3 = 5{,}2826$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Los límites son constantes, así que la triple se separa en
              producto de tres simples.
          - texto: >-
              Y el integrando es una suma, así que la integral se parte en
              tres, cada una con una sola variable viva.
          - texto: >-
              Los tres sumandos tienen la misma forma con las letras
              intercambiadas, y sacando $\tfrac{abc}{2}$ factor común queda
              $a+b+c$.
          - texto: >-
              Como los tres sumandos son simétricos, valen lo mismo y basta
              calcular uno y multiplicarlo por tres.
            trampa: true
            mensaje: |
              Son simétricos en la **forma**, no en el valor: el primero es
              $\tfrac{a^{2}bc}{2}$ y el segundo $\tfrac{ab^{2}c}{2}$, que solo
              coinciden si $a=b$. La simetría permite escribir los tres sin
              volver a integrar, que ya es bastante — pero no permite
              multiplicar por tres.
        veredicto: |
          Esa distinción vale para todo el tema: reconocer una simetría ahorra
          **escribir** el cálculo, no siempre ahorra el cálculo. Aquí ahorra
          dos integraciones y ninguna suma.
    resolucion: |
      **Datos.** El ladrillo $[0,a]\times[0,b]\times[0,c]$ con densidad
      $f = x+y+z$. Se pide su masa.

      ### 1 · Dos cosas que mirar antes de integrar

      **Los límites son constantes**, así que el recinto es un producto de
      intervalos y la triple se separa en producto de simples. Y **el
      integrando es una suma**, así que la integral se parte en tres. Juntas,
      las dos convierten el ejercicio en tres cálculos de una línea.

      ### 2 · Los tres sumandos

      $$
      m = \iiint_V (x+y+z)\,dV
      = \iiint_V x\,dV + \iiint_V y\,dV + \iiint_V z\,dV
      $$

      El primero:

      $$
      \iiint_V x\,dV
      = \left(\int_0^a x\,dx\right)\left(\int_0^b dy\right)\left(\int_0^c dz\right)
      = \frac{a^{2}}{2}\,b\,c
      $$

      Y los otros dos son el mismo con las letras rotadas:
      $\tfrac{ab^{2}c}{2}$ y $\tfrac{abc^{2}}{2}$.

      ### 3 · La masa

      $$
      m = \frac{a^{2}bc + ab^{2}c + abc^{2}}{2}
      $$

      $$
      \boxed{\ m = \frac{abc}{2}\,(a+b+c)\ }
      $$

      Coincide con el resultado del boletín.

      **La comprobación que conviene hacer.** El volumen es $abc$ y la
      densidad media que sale es $\tfrac{a+b+c}{2}$, que es exactamente la
      densidad **en el centro** del ladrillo, $\left(\tfrac a2,\tfrac b2,\tfrac
      c2\right)$. Eso pasa porque la densidad es **lineal**, y es una buena
      forma de comprobar el resultado — pero no un atajo general: con densidad
      $xyz$ o $x^{2}$ deja de ser cierto.

  - id: volumen-cilindro-cono
    titulo: El volumen entre un cilindro descentrado y un cono
    fuente: >-
      Ejercicio 10 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él: sale 32a³/9 exacto.
    nivel: practica
    enunciado: |
      Calcular el volumen del cuerpo limitado por el plano $OXY$, el cilindro
      $2ax = x^{2}+y^{2}$ y el cono $x^{2}+y^{2}=z^{2}$.
    pide: El volumen del cuerpo.
    pasos:
      - tipo: reconocer
        pregunta: |
          Tres superficies. ¿Cuál pone la tapa de arriba y cuál el contorno?
        opciones:
          - texto: >-
              El **cono** pone la tapa, $z=r$; el **cilindro** pone el contorno,
              $r=2a\cos\theta$; y el plano $OXY$ el suelo
            correcta: true
            mensaje: |
              Eso es, y conviene ver por qué: el cilindro es vertical —su
              ecuación no lleva $z$— así que solo puede recortar en el plano.
              El cono sí depende de $z$ y por eso es el que tapa.
          - texto: >-
              El cilindro pone la tapa y el cono el contorno
            mensaje: |
              Al revés. La ecuación del cilindro, $x^{2}+y^{2}=2ax$, **no
              contiene $z$**: es la misma curva a cualquier altura, o sea una
              pared vertical. Una pared no puede ser la tapa.
          - texto: >-
              El plano $OXY$ pone la tapa y el cono el suelo
            mensaje: |
              El plano $OXY$ es $z=0$, y el cuerpo está por encima: es el
              suelo. Si fuese la tapa, el cuerpo estaría bajo tierra.

      - tipo: reconocer
        pregunta: |
          El cilindro $x^{2}+y^{2}=2ax$, ¿qué es en polares?
        opciones:
          - texto: >-
              $r = 2a\cos\theta$, con $\theta\in[-\tfrac{\pi}{2},\tfrac{\pi}{2}]$
            correcta: true
            mensaje: |
              La misma circunferencia desplazada del ejercicio 2, ahora
              levantada en vertical. Es un cilindro **tangente al eje $z$** por
              dentro, no centrado en él.
          - texto: >-
              $r = 2a$, un cilindro de radio $2a$ centrado en el eje
            mensaje: |
              Eso sería $x^{2}+y^{2}=4a^{2}$. Aquí el término lineal en $x$
              desplaza el centro: completando cuadrados,
              $(x-a)^{2}+y^{2}=a^{2}$, radio $a$ y centro en $(a,0)$.
          - texto: >-
              $r = a$, porque el radio es $a$
            mensaje: |
              El radio **es** $a$, pero la circunferencia no está centrada en
              el origen, así que su ecuación polar no es $r$ constante. Pasa
              por el origen, y eso da $r=2a\cos\theta$.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Con la tapa en $z=r$ y el contorno en $r=2a\cos\theta$, el volumen es
          $\displaystyle\int_{-\pi/2}^{\pi/2}\!\!\int_0^{2a\cos\theta} r\cdot r\,dr\,d\theta$.
          Con $a=1{,}3$, ¿cuánto vale?
        respuesta:
          tipo: numero
          valor: '7.8116'
          tolerancia: 0.01
          formato: en forma exacta (32a^3/9) o con cuatro decimales
        distractores:
          - valor: '11.4956'
            mensaje: |
              Eso es $\pi a^{3}$·algo: suele salir de usar $\cos^{2}$ en vez de
              $\cos^{3}$ al integrar en $\theta$. La altura es $r$, así que con
              el jacobiano queda $r^{2}$ y su primitiva deja un cubo.
          - valor: '3.9058'
            mensaje: |
              La mitad: has tomado $\theta$ solo de 0 a $\pi/2$. El cilindro se
              recorre entero con $\theta$ entre $-\pi/2$ y $\pi/2$.
          - valor: '2.6034'
            mensaje: |
              $\int\cos^{3}$ no vale $\tfrac23$ en ese intervalo, vale
              $\tfrac43$. Es la integral de una potencia impar del coseno:
              sale con $\operatorname{sen}$ como variable.
        pista: |
          $\displaystyle\int_{-\pi/2}^{\pi/2}\cos^{3}\theta\,d\theta = \frac43$.
        desarrollo: |
          La altura sobre cada punto es la del cono, $z=r$:

          $$
          V = \int_{-\pi/2}^{\pi/2}\!\!\int_0^{2a\cos\theta} r\cdot r\,dr\,d\theta
          = \int_{-\pi/2}^{\pi/2}\frac{8a^{3}\cos^{3}\theta}{3}\,d\theta
          $$

          $$
          = \frac{8a^{3}}{3}\cdot\frac43 = \frac{32a^{3}}{9}
          $$

          Con $a=1{,}3$: $7{,}8116$.

      - tipo: justificar
        pregunta: Ordena el planteamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El cilindro no lleva $z$ en su ecuación: es una pared vertical, y
              por eso solo puede poner el **contorno** del recinto plano.
          - texto: >-
              En polares ese contorno es $r=2a\cos\theta$, la circunferencia
              que pasa por el origen.
          - texto: >-
              La tapa es el cono, que en polares es $z=r$, y el suelo el plano
              $z=0$: la altura sobre cada punto es $r$.
          - texto: >-
              Como el cono es $x^{2}+y^{2}=z^{2}$, su ecuación en polares es
              $z=r^{2}$.
            trampa: true
            mensaje: |
              $x^{2}+y^{2}$ es $r^{2}$, así que la ecuación queda $r^{2}=z^{2}$
              y de ahí $z=r$, no $z=r^{2}$. Es un cono, y un cono crece
              **linealmente** con el radio: si creciera como $r^{2}$ sería un
              paraboloide. Elevar de más aquí cambia la figura y el resultado.
        veredicto: |
          Dos superficies con $x^{2}+y^{2}$ en la ecuación y papeles opuestos:
          la que **no** lleva $z$ recorta el suelo, la que sí lo lleva pone la
          tapa. Distinguirlo es todo el planteamiento.
    resolucion: |
      **Datos.** Cuerpo limitado por el plano $OXY$, el cilindro
      $2ax=x^{2}+y^{2}$ y el cono $x^{2}+y^{2}=z^{2}$.

      ### 1 · Quién es quién

      | superficie | ¿lleva $z$? | papel |
      |---|---|---|
      | $x^{2}+y^{2}=2ax$ | no | pared vertical → **contorno** |
      | $x^{2}+y^{2}=z^{2}$ | sí | **tapa**, $z=r$ |
      | $z=0$ | — | **suelo** |

      Que el cilindro no lleve $z$ es lo que lo delata: su corte es el mismo a
      cualquier altura.

      ### 2 · En polares

      El contorno, completando cuadrados, es $(x-a)^{2}+y^{2}=a^{2}$: pasa por
      el origen, y por tanto

      $$
      r = 2a\cos\theta, \qquad \theta\in\left[-\tfrac{\pi}{2},\tfrac{\pi}{2}\right]
      $$

      La tapa: $r^{2}=z^{2} \Rightarrow z=r$. **Lineal en $r$**, que es lo que
      hace a un cono un cono.

      ### 3 · El volumen

      $$
      V = \int_{-\pi/2}^{\pi/2}\!\!\int_0^{2a\cos\theta} \underbrace{r}_{\text{altura}}\cdot \underbrace{r}_{\text{jacobiano}}\,dr\,d\theta
      = \frac{8a^{3}}{3}\int_{-\pi/2}^{\pi/2}\cos^{3}\theta\,d\theta
      $$

      La integral de una potencia **impar** del coseno sale sola con
      $u=\operatorname{sen}\theta$, y vale $\tfrac43$:

      $$
      \boxed{\ V = \frac{8a^{3}}{3}\cdot\frac43 = \frac{32a^{3}}{9}\ }
      $$

      Coincide con el resultado del boletín.

      **Lo que hay que llevarse.** Es el mismo contorno del ejercicio 2 —la
      circunferencia que pasa por el origen— pero ahora en tres dimensiones y
      con una tapa encima. Y la regla que resuelve el planteamiento en diez
      segundos: **la superficie cuya ecuación no contiene $z$ es una pared, y
      una pared nunca es la tapa**.

  - id: inercia-del-triangulo
    titulo: El momento de inercia de un triángulo, y qué lado conviene barrer
    fuente: >-
      Ejercicio 8 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él: sale Iₓ = 4 exacto.
    nivel: practica
    enunciado: |
      Calcular el momento de inercia con respecto al eje $OX$ del triángulo
      limitado por las condiciones $x+y=2$, $x=2$ e $y=2$.
    pide: El momento de inercia respecto del eje OX.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuáles son los tres vértices del triángulo?
        opciones:
          - texto: >-
              $(0,2)$, $(2,0)$ y $(2,2)$
            correcta: true
            mensaje: |
              Eso es: la recta $x+y=2$ corta a $y=2$ en $(0,2)$ y a $x=2$ en
              $(2,0)$, y las dos rectas se cortan entre sí en $(2,2)$. El
              triángulo es la esquina de arriba a la derecha.
          - texto: >-
              $(0,0)$, $(2,0)$ y $(0,2)$
            mensaje: |
              Ese es el triángulo de **debajo** de la recta $x+y=2$, y el
              origen no cumple ni $x=2$ ni $y=2$. Las tres condiciones del
              enunciado dejan la región del otro lado.
          - texto: >-
              $(0,0)$, $(2,2)$ y $(2,0)$
            mensaje: |
              El origen no está en ninguna de las tres rectas. Los vértices son
              las tres intersecciones **dos a dos** de las rectas dadas.

      - tipo: reconocer
        pregunta: |
          $I_x = \iint y^{2}\,dA$. ¿Qué orden de integración evita partir el
          recinto?
        opciones:
          - texto: >-
              Barrer en horizontal: para cada $y$, la $x$ va de $2-y$ a $2$
            correcta: true
            mensaje: |
              Exacto, y además ese es el orden que conviene por el integrando:
              como $y^{2}$ no depende de $x$, la integral interior es solo la
              **longitud** del segmento, que vale $y$.
          - texto: >-
              Barrer en vertical: para cada $x$, la $y$ va de $2-x$ a $2$
            correcta: false
            mensaje: |
              También vale y tampoco parte nada — el triángulo es simétrico
              respecto de la diagonal. Pero deja $\int y^{2}dy$ dentro, con una
              primitiva cúbica evaluada en dos extremos: sale, con más
              cuentas. Con el otro orden la integral interior es inmediata.
          - texto: >-
              Ninguno: hay que partirlo en dos porque el triángulo no tiene
              lados paralelos a los ejes
            mensaje: |
              Tiene dos: $x=2$ es vertical e $y=2$ horizontal. Solo la
              hipotenusa es oblicua, y con eso basta para barrerlo de una vez
              en cualquiera de los dos sentidos.

      - tipo: calcular
        titulo: La integral interior
        pregunta: |
          Con $y$ fijo, $\displaystyle\int_{2-y}^{2} y^{2}\,dx$. ¿A qué es
          igual?
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.001
          formato: su valor en y = 2
        distractores:
          - valor: '4'
            mensaje: |
              Eso es $y^{2}$ en $y=2$, sin multiplicar por la longitud del
              segmento. Como $y^{2}$ no depende de $x$, sale fuera y queda
              multiplicado por $2-(2-y)=y$.
          - valor: '2'
            mensaje: |
              Esa es la longitud del segmento en $y=2$, pero falta el
              integrando.
        pista: |
          $y^{2}$ es constante respecto de $x$: sale fuera y multiplica a la
          longitud del intervalo.
        desarrollo: |
          $$
          \int_{2-y}^{2} y^{2}\,dx = y^{2}\big[2-(2-y)\big] = y^{3}
          $$

          En $y=2$: $2^{3}=8$.

      - tipo: calcular
        titulo: El momento
        pregunta: |
          Queda $\displaystyle\int_0^{2} y^{3}\,dy$. ¿Cuánto vale $I_x$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2.6667'
            mensaje: |
              $8/3$ es $\int_0^2 y^{2}dy$: te has quedado con el integrando
              original en vez de con $y^{3}$, que es lo que deja la integral
              interior.
          - valor: '16'
            mensaje: |
              Te falta el $\tfrac14$ de la primitiva: $\int y^{3}dy = y^{4}/4$,
              y $2^{4}=16$ dividido entre 4 son 4.
        pista: |
          $\int_0^2 y^{3}dy = \left[\tfrac{y^{4}}{4}\right]_0^2$.
        desarrollo: |
          $$
          I_x = \int_0^{2} y^{3}\,dy = \left[\frac{y^{4}}{4}\right]_0^{2}
          = \frac{16}{4} = 4
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Los vértices son $(0,2)$, $(2,0)$ y $(2,2)$: las tres rectas
              cortadas dos a dos.
          - texto: >-
              $I_x=\iint y^{2}dA$, y barriendo en horizontal la $x$ va de
              $2-y$ a $2$ para cada $y\in[0,2]$.
          - texto: >-
              Como $y^{2}$ no depende de $x$, la integral interior es
              $y^{2}\cdot y = y^{3}$, y la exterior da 4.
          - texto: >-
              Y como el triángulo es simétrico respecto de la diagonal $y=x$,
              su momento respecto de $OY$ vale también 4.
            trampa: true
            mensaje: |
              La simetría es cierta y la conclusión no se sigue de ella tal
              cual: intercambiar $x$ por $y$ deja el recinto igual, así que
              $I_y = \iint x^{2}dA$ **sí** vale 4 — pero por esa simetría, no
              porque los momentos coincidan en general. En el disco anular del
              ejercicio 9 pasa lo mismo y en un triángulo cualquiera **no**
              pasa. Lo que se puede afirmar sin más es lo que la simetría dice,
              y hay que decir cuál es.
        veredicto: |
          Fíjate en el atajo del integrando: como $y^{2}$ no depende de $x$, la
          integral interior es solo la **longitud** del segmento horizontal.
          Elegir ese orden convierte una integral doble en una simple.
    resolucion: |
      **Datos.** El triángulo limitado por $x+y=2$, $x=2$ e $y=2$. Se pide
      $I_x$.

      ### 1 · Dónde está el triángulo

      Las tres rectas cortadas dos a dos:

      | corte | vértice |
      |---|---|
      | $x+y=2$ con $y=2$ | $(0,2)$ |
      | $x+y=2$ con $x=2$ | $(2,0)$ |
      | $x=2$ con $y=2$ | $(2,2)$ |

      Es la esquina superior derecha, **por encima** de la hipotenusa.

      ### 2 · El orden que conviene

      $$
      I_x = \iint_D y^{2}\,dA
      $$

      El integrando no depende de $x$, así que barrer en horizontal deja la
      integral interior en una simple multiplicación:

      $$
      \int_{2-y}^{2} y^{2}\,dx = y^{2}\cdot\big[2-(2-y)\big] = y^{3}
      $$

      Ese $y$ que multiplica es la **longitud del segmento** horizontal a esa
      altura, que va estrechándose hacia abajo.

      ### 3 · El resultado

      $$
      I_x = \int_0^{2} y^{3}\,dy = \left[\frac{y^{4}}{4}\right]_0^{2} = 4
      $$

      $$
      \boxed{\ I_x = 4\ }
      $$

      Coincide con el resultado del boletín.

      **Lo que hay que llevarse.** Cuando el integrando depende de **una sola**
      variable, conviene barrer de modo que esa variable quede **fuera**: la
      integral interior se reduce a la longitud del corte y la doble se vuelve
      una simple. Aquí eso convierte el ejercicio en dos líneas; con el otro
      orden sale igual, pero con una cúbica evaluada en dos extremos.

  - id: inercias-del-disco-anular
    titulo: Los dos momentos de inercia de una arandela, y el que sale gratis
    fuente: >-
      Ejercicio 9 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica los dos
      resultados y el desarrollo está contrastado contra ellos: salen
      π(D⁴−d⁴)/32 y π(D⁴−d⁴)/64 exactos.
    nivel: practica
    enunciado: |
      Consideremos un disco cuyos diámetros son $d$ y $D$ (con $d<D$).
      Calcular los momentos de inercia con respecto al centro y con respecto a
      uno de sus diámetros.
    pide: El momento polar y el momento respecto a un diámetro.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué distingue al momento respecto **al centro** del momento respecto
          a **un diámetro**?
        opciones:
          - texto: >-
              La distancia que se eleva al cuadrado: al centro es $r^{2}$, a un
              diámetro es solo la coordenada perpendicular a él
            correcta: true
            mensaje: |
              Eso es. $I_0 = \iint r^{2}\,dA$ y $I_x = \iint y^{2}\,dA$: en el
              primero cuenta la distancia entera al centro, en el segundo solo
              lo que se separa del eje.
          - texto: >-
              Nada: los dos son $\iint r^{2}\,dA$, cambia solo el nombre
            mensaje: |
              Si fuesen iguales, el enunciado no pediría los dos. La distancia
              de un punto al eje $OX$ es $|y|$, no $r$ — y $r$ solo coincide
              con $|y|$ para los puntos del eje $OY$.
          - texto: >-
              Que uno se calcula en polares y el otro en cartesianas
            mensaje: |
              Los dos salen mejor en polares, porque el recinto es una corona.
              Lo que cambia es el integrando: $r^{2}$ frente a
              $r^{2}\operatorname{sen}^{2}\theta$.

      - tipo: calcular
        titulo: El momento polar
        pregunta: |
          La corona va de $r=\tfrac{d}{2}$ a $r=\tfrac{D}{2}$. Calcula
          $I_0 = \displaystyle\int_0^{2\pi}\!\!\int_{d/2}^{D/2} r^{3}\,dr\,d\theta$
          con $D=3{,}2$ y $d=1{,}4$.
        respuesta:
          tipo: numero
          valor: '9.9172'
          tolerancia: 0.01
          formato: en forma exacta (pi(D^4-d^4)/32) o con cuatro decimales
        distractores:
          - valor: '158.6755'
            mensaje: |
              Has usado los **diámetros** como radios. Los límites de $r$ son
              $d/2$ y $D/2$, y al elevar a la cuarta ese factor 2 se convierte
              en 16: por eso el resultado impreso lleva un 32 y no un 2 en el
              denominador.
          - valor: '19.8344'
            mensaje: |
              El doble. Suele venir de olvidar el $\tfrac14$ de la primitiva de
              $r^{3}$, o de contar la corona dos veces.
        pista: |
          $\int r^{3}dr = r^{4}/4$, y con radios $D/2$ y $d/2$ aparece un 16 en
          el denominador.
        desarrollo: |
          $$
          I_0 = \int_0^{2\pi}\!\!\int_{d/2}^{D/2} r^{2}\cdot r\,dr\,d\theta
          = 2\pi\left[\frac{r^{4}}{4}\right]_{d/2}^{D/2}
          = \frac{2\pi}{4}\cdot\frac{D^{4}-d^{4}}{16}
          $$

          $$
          I_0 = \frac{\pi\left(D^{4}-d^{4}\right)}{32}
          $$

          Con $D=3{,}2$ y $d=1{,}4$: $9{,}9172$.

      - tipo: calcular
        titulo: El momento respecto a un diámetro
        pregunta: |
          Ahora el integrando es $y^{2} = r^{2}\operatorname{sen}^{2}\theta$.
          ¿Cuánto vale $I_x$, con los mismos $D$ y $d$?
        respuesta:
          tipo: numero
          valor: '4.9586'
          tolerancia: 0.01
          formato: en forma exacta (pi(D^4-d^4)/64) o con cuatro decimales
        distractores:
          - valor: '9.9172'
            mensaje: |
              Ese es $I_0$. No son iguales: al pasar de la distancia al centro
              a la distancia al eje, la integral angular pasa de $2\pi$ a
              $\pi$ — porque $\int_0^{2\pi}\operatorname{sen}^{2}\theta\,d\theta = \pi$.
          - valor: '2.4793'
            mensaje: |
              La mitad de $I_x$: probablemente has integrado $\theta$ solo
              hasta $\pi$ además de meter el seno al cuadrado.
        pista: |
          $\int_0^{2\pi}\operatorname{sen}^{2}\theta\,d\theta = \pi$, no
          $2\pi$.
        desarrollo: |
          $$
          I_x = \int_0^{2\pi}\!\!\int_{d/2}^{D/2}
          r^{2}\operatorname{sen}^{2}\theta \cdot r\,dr\,d\theta
          = \underbrace{\int_0^{2\pi}\operatorname{sen}^{2}\theta\,d\theta}_{=\pi}
          \cdot \frac{D^{4}-d^{4}}{64}
          $$

          $$
          I_x = \frac{\pi\left(D^{4}-d^{4}\right)}{64} = \frac{I_0}{2}
          $$

          Con $D=3{,}2$ y $d=1{,}4$: $4{,}9586$, justo la mitad del anterior.

      - tipo: justificar
        pregunta: Ordena lo que relaciona los dos momentos. Una pieza es falsa.
        piezas:
          - texto: >-
              Por definición, $r^{2}=x^{2}+y^{2}$, así que
              $I_0 = \iint (x^{2}+y^{2})\,dA = I_y + I_x$.
          - texto: >-
              La arandela es **simétrica respecto de los dos ejes**, así que
              $I_x = I_y$.
          - texto: >-
              De las dos cosas sale $I_0 = 2I_x$ sin integrar nada, y por eso
              el segundo resultado es el primero partido por dos.
          - texto: >-
              Y como el recinto tiene un agujero, hay que restar además el
              momento del disco pequeño al del grande **dos veces**: una por
              cada eje.
            trampa: true
            mensaje: |
              Una vez, no dos. Restar el disco pequeño es lo que hace el
              $-d^{4}$ del resultado, y esa resta ya está hecha dentro de cada
              momento: se ve en que los límites de $r$ empiezan en $d/2$ en vez
              de en cero. Restarlo otra vez sería quitar el agujero dos veces.
        veredicto: |
          Ese $I_0 = I_x + I_y$ es el teorema de los ejes perpendiculares, y
          con la simetría del disco convierte el segundo apartado en una
          división. Verlo antes de integrar ahorra la mitad del ejercicio — y,
          si integras los dos, te sirve de comprobación gratis.
    resolucion: |
      **Datos.** Una corona circular de diámetros $d$ (interior) y $D$
      (exterior). Se piden $I_0$ —respecto del centro— e $I_x$ —respecto de un
      diámetro—.

      ### 1 · Qué es cada uno

      | momento | distancia que se eleva al cuadrado | integrando en polares |
      |---|---|---|
      | $I_0$ (polar) | al **centro**: $r$ | $r^{2}\cdot r$ |
      | $I_x$ (a un diámetro) | al **eje**: $\lvert y\rvert$ | $r^{2}\operatorname{sen}^{2}\theta\cdot r$ |

      En los dos, el último $r$ es el jacobiano.

      ### 2 · El momento polar

      Ojo al dato: el enunciado da **diámetros**, así que los radios son $d/2$
      y $D/2$.

      $$
      I_0 = \int_0^{2\pi}\!\!\int_{d/2}^{D/2} r^{3}\,dr\,d\theta
      = 2\pi\cdot\frac{1}{4}\left(\frac{D^{4}}{16}-\frac{d^{4}}{16}\right)
      $$

      $$
      \boxed{\ I_0 = \frac{\pi\left(D^{4}-d^{4}\right)}{32}\ }
      $$

      Ese 32 del denominador es $4 \times 16 \div 2$: el $\tfrac14$ de la
      primitiva y el $\tfrac1{16}$ de pasar de diámetro a radio.

      ### 3 · El del diámetro, que sale gratis

      Se puede integrar —$\int_0^{2\pi}\operatorname{sen}^{2}\theta\,d\theta=\pi$
      en vez de $2\pi$, así que sale la mitad— pero conviene verlo por el otro
      camino:

      $$
      I_0 = \iint (x^{2}+y^{2})\,dA = I_y + I_x
      $$

      y como la corona es simétrica respecto de los dos ejes, $I_x = I_y$:

      $$
      \boxed{\ I_x = \frac{I_0}{2} = \frac{\pi\left(D^{4}-d^{4}\right)}{64}\ }
      $$

      Los dos coinciden con los resultados del boletín.

      **Lo que hay que llevarse.** Dos cosas. La primera, que el enunciado da
      **diámetros** y la integral quiere **radios**: ese factor 2 elevado a la
      cuarta es el 16 que aparece en los denominadores, y saltárselo multiplica
      el resultado por dieciséis. La segunda, el teorema de los ejes
      perpendiculares: $I_0 = I_x + I_y$ convierte el segundo apartado en una
      división, y si prefieres integrarlo, te queda como comprobación.

  - id: triple-del-cono-hasta-la-tapa
    titulo: Una integral triple sobre el cono, y de dónde salen sus límites
    fuente: >-
      Ejercicio 12 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él: sale πh²R²/4 exacto.
    nivel: practica
    enunciado: |
      Calcular $\displaystyle\iiint_{V} z\,dx\,dy\,dz$, donde $V$ es el cuerpo
      limitado por el cono
      $z^{2}=\dfrac{h^{2}}{R^{2}}\left(x^{2}+y^{2}\right)$ y el plano $z=h$.
    pide: El valor de la integral triple, en función de h y R.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué cuerpo es $V$, y qué coordenadas pide?
        opciones:
          - texto: >-
              Un cono con el **vértice abajo** y la tapa plana arriba, y pide
              **cilíndricas**
            correcta: true
            mensaje: |
              Eso es. La ecuación del cono se reescribe como
              $z = \tfrac{h}{R}\,r$: el vértice está en el origen y la
              superficie se abre hacia arriba hasta cortar el plano $z=h$ en
              la circunferencia $r=R$. Con cilíndricas, la $\theta$ ni aparece.
          - texto: >-
              Un cono con el vértice arriba, y pide esféricas
            mensaje: |
              El vértice está en el origen, que es **abajo**: para $z$ pequeño
              el radio también lo es. Y las esféricas complican esto, porque la
              tapa plana $z=h$ no es una superficie coordenada suya.
          - texto: >-
              Un cilindro de radio $R$ y altura $h$
            mensaje: |
              Un cilindro tendría el radio constante. Aquí el radio **crece con
              la altura**: en $z$ vale $rR/h$, y solo llega a $R$ en la tapa.
              Es exactamente lo que distingue este ejercicio del cilindro.

      - tipo: reconocer
        pregunta: |
          Con cilíndricas y barriendo primero en $z$, ¿entre qué valores va?
        opciones:
          - texto: >-
              De $\dfrac{h}{R}\,r$ —la superficie del cono— hasta $h$ —la tapa—
            correcta: true
            mensaje: |
              Exacto. Fijado un radio $r$, la columna vertical empieza en el
              cono y acaba en la tapa. Y ojo al detalle: el límite de abajo
              depende de $r$, el de arriba no.
          - texto: >-
              De $0$ a $h$, porque el cuerpo llega hasta el plano $z=0$
            mensaje: |
              Eso sería el cilindro entero. El cuerpo está **por encima** del
              cono: para un radio $r$ dado, todo lo que hay por debajo de
              $z=\tfrac{h}{R}r$ queda fuera.
          - texto: >-
              De $0$ a $\dfrac{h}{R}\,r$
            mensaje: |
              Ese es el cuerpo de **dentro** del cono, el que tiene el vértice
              abajo y la base arriba mirando al revés. El enunciado limita con
              el cono y con el plano: lo que queda es lo de arriba.

      - tipo: calcular
        titulo: La integral en z
        pregunta: |
          $\displaystyle\int_{hr/R}^{h} z\,dz$. ¿A qué es igual?
        respuesta:
          tipo: numero
          valor: '1.6538'
          tolerancia: 0.002
          formato: su valor con h = 2,1, R = 1,4 y r = 0,7, con cuatro decimales
        distractores:
          - valor: '2.2050'
            mensaje: |
              Eso es $h^{2}/2$: te has dejado el límite de abajo. La columna no
              empieza en cero, empieza en la superficie del cono.
          - valor: '1.0500'
            mensaje: |
              Has restado los límites sin elevar al cuadrado. La primitiva de
              $z$ es $z^{2}/2$, así que restan los **cuadrados**.
        pista: |
          $\tfrac12\left(h^{2}-\tfrac{h^{2}r^{2}}{R^{2}}\right)$. Sustituye.
        desarrollo: |
          $$
          \int_{hr/R}^{h} z\,dz
          = \left[\frac{z^{2}}{2}\right]_{hr/R}^{h}
          = \frac{h^{2}}{2}\left(1-\frac{r^{2}}{R^{2}}\right)
          $$

          Con $h=2{,}1$, $R=1{,}4$, $r=0{,}7$:
          $\tfrac{4{,}41}{2}\left(1-\tfrac{0{,}49}{1{,}96}\right)
          = 2{,}205\cdot 0{,}75 = 1{,}65375$.

      - tipo: calcular
        titulo: La integral entera
        pregunta: |
          Queda
          $\displaystyle\int_0^{2\pi}\!\!\int_0^{R}\frac{h^{2}}{2}\left(1-\frac{r^{2}}{R^{2}}\right)r\,dr\,d\theta$.
          Con $h=2{,}1$ y $R=1{,}4$, ¿cuánto vale?
        respuesta:
          tipo: numero
          valor: '6.7887'
          tolerancia: 0.01
          formato: en forma exacta (pi·h^2·R^2/4) o con cuatro decimales
        distractores:
          - valor: '13.5774'
            mensaje: |
              El doble. Suele salir de olvidar el $\tfrac12$ de la primitiva de
              $z$, o de integrar $\theta$ hasta $4\pi$.
          - valor: '3.3943'
            mensaje: |
              La mitad: probablemente has usado $\theta$ de 0 a $\pi$. El
              cuerpo es de revolución completo.
          - valor: '9.0516'
            mensaje: |
              Eso es $\pi h^{2}R^{2}/3$, el resultado que saldría con el
              volumen del cono en vez de con esta integral. Aquí el integrando
              es $z$, no 1.
        pista: |
          $\int_0^R\left(r-\tfrac{r^{3}}{R^{2}}\right)dr = \tfrac{R^{2}}{4}$.
        desarrollo: |
          No hay dependencia de $\theta$, así que sale un $2\pi$ limpio:

          $$
          \int_0^{R}\left(1-\frac{r^{2}}{R^{2}}\right)r\,dr
          = \left[\frac{r^{2}}{2}-\frac{r^{4}}{4R^{2}}\right]_0^{R}
          = \frac{R^{2}}{2}-\frac{R^{2}}{4} = \frac{R^{2}}{4}
          $$

          $$
          \iiint_V z\,dV = 2\pi \cdot \frac{h^{2}}{2}\cdot\frac{R^{2}}{4}
          = \frac{\pi h^{2}R^{2}}{4}
          $$

          Con $h=2{,}1$ y $R=1{,}4$: $6{,}7887$.

      - tipo: justificar
        pregunta: Ordena el planteamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El cono $z^{2}=\tfrac{h^{2}}{R^{2}}(x^{2}+y^{2})$ es, en
              cilíndricas, $z=\tfrac{h}{R}r$: vértice en el origen y abierto
              hacia arriba.
          - texto: >-
              Corta al plano $z=h$ en $r=R$, así que el radio recorre $[0,R]$ y
              el ángulo, $[0,2\pi]$.
          - texto: >-
              Para cada $r$, la columna va del cono a la tapa: $z$ de
              $\tfrac{h}{R}r$ a $h$.
          - texto: >-
              Y como el integrando es $z$, el resultado es el volumen del
              cuerpo multiplicado por la altura media, $h/2$.
            trampa: true
            mensaje: |
              Suena razonable y no lo es. $\iiint z\,dV$ es el volumen por la
              altura del **centro de gravedad**, no por la media de los
              extremos. Y aquí el cuerpo tiene mucha más materia arriba que
              abajo —la sección es un disco de radio $\tfrac{R}{h}z$, que crece
              con la altura—, así que su centroide está muy por encima de la
              mitad: en $\tfrac{3h}{4}$.

              La comprobación cierra el argumento. El volumen del cono es
              $\tfrac{\pi R^{2}h}{3}$, y

              $$
              \frac{\pi R^{2}h}{3}\cdot\frac{3h}{4} = \frac{\pi h^{2}R^{2}}{4}
              $$

              que es exactamente el resultado. Con $h/2$ saldría
              $\tfrac{\pi R^{2}h^{2}}{6}$, un tercio menos.
        veredicto: |
          Lo que decide el ejercicio son los **límites de $z$**: de la
          superficie del cono a la tapa, no de cero a la tapa. Todo lo demás es
          una integral inmediata.
    resolucion: |
      **Datos.** $V$ limitado por el cono
      $z^{2}=\tfrac{h^{2}}{R^{2}}(x^{2}+y^{2})$ y el plano $z=h$. Se pide
      $\iiint_V z\,dV$.

      ### 1 · Qué cuerpo es

      En cilíndricas, $x^{2}+y^{2}=r^{2}$ y la ecuación del cono queda

      $$
      z = \frac{h}{R}\,r
      $$

      Vértice en el origen, abierto hacia arriba, y corta al plano $z=h$
      exactamente en $r=R$.

      El cuerpo es el **cono macizo**: la condición $z \ge \tfrac{h}{R}r$ es lo
      mismo que $r \le \tfrac{R}{h}z$, o sea que a cada altura la sección es un
      disco cuyo radio **crece** con $z$, de cero en el vértice a $R$ en la
      tapa. Merece la pena escribirlo de las dos formas antes de poner
      límites: la primera dice «por encima del cono» y la segunda dice qué
      disco hay a cada altura, y son la misma condición.

      ### 2 · Los límites

      | variable | de | a |
      |---|---|---|
      | $\theta$ | $0$ | $2\pi$ |
      | $r$ | $0$ | $R$ |
      | $z$ | $\tfrac{h}{R}r$ | $h$ |

      El de abajo depende de $r$; el de arriba, no. Por eso conviene barrer
      $z$ primero.

      ### 3 · La integral

      $$
      \int_{hr/R}^{h} z\,dz = \frac{h^{2}}{2}\left(1-\frac{r^{2}}{R^{2}}\right)
      $$

      $$
      \iiint_V z\,dV
      = 2\pi\cdot\frac{h^{2}}{2}\int_0^{R}\left(1-\frac{r^{2}}{R^{2}}\right)r\,dr
      = 2\pi\cdot\frac{h^{2}}{2}\cdot\frac{R^{2}}{4}
      $$

      $$
      \boxed{\ \iiint_V z\,dV = \frac{\pi h^{2}R^{2}}{4}\ }
      $$

      Coincide con el resultado del boletín.

      **Lo que hay que llevarse.** En una triple, lo que cuesta no es integrar:
      es decidir **qué variable se barre primero** y de dónde a dónde. Aquí la
      pista es que el límite inferior de $z$ depende de $r$ y el superior no,
      así que barrer $z$ primero deja una integral en $r$ inmediata. Al revés
      —$r$ primero— habría que despejar $r$ del cono y sale lo mismo con más
      trabajo.

  - id: tres-dobles-directas
    titulo: Tres integrales dobles, y en cada una manda el recinto
    fuente: >-
      Ejercicio 1 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica los tres
      resultados y el desarrollo está contrastado contra ellos: salen 1/6, 4/3
      y ln 2 exactos.
    nivel: practica
    enunciado: |
      Calcular las siguientes integrales dobles:

      **a)** $\displaystyle\iint_{D} x\,dx\,dy$, donde $D$ es el triángulo
      limitado por los puntos $O(0,0)$, $A(1,1)$ y $B(0,1)$.

      **b)** $\displaystyle\iint_{D} xy\,dx\,dy$, donde $D$ es el dominio
      limitado por la semicircunferencia superior $(x-2)^{2}+y^{2}=1$ y el eje
      $OX$.

      **c)** $\displaystyle\iint_{D} \frac{x}{x^{2}+y^{2}}\,dx\,dy$, donde $D$
      es el dominio limitado por las gráficas de las funciones $y=x$ e
      $y=\dfrac{x^{2}}{2}$.
    pide: El valor de las tres integrales.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado **a)**, el triángulo tiene vértices $O(0,0)$,
          $A(1,1)$ y $B(0,1)$. ¿Cuál es el orden cómodo?
        opciones:
          - texto: >-
              Primero $x$, de $0$ a $y$; después $y$, de $0$ a $1$
            correcta: true
            mensaje: |
              Eso es. Los lados son $x=0$, $y=1$ y la recta $y=x$, así que
              barriendo en horizontal el tramo va del eje vertical a la
              diagonal: $0 \le x \le y$. Sin partir nada.
          - texto: >-
              Primero $y$, de $0$ a $1$; después $x$, de $0$ a $1$
            mensaje: |
              Eso integraría sobre el **cuadrado** entero, no sobre el
              triángulo: incluiría los puntos con $y<x$, que están fuera. Los
              límites de dentro tienen que depender de la variable de fuera.
          - texto: >-
              Hay que partirlo en dos, porque el triángulo no es rectángulo
            mensaje: |
              Sí lo es: los lados $x=0$ e $y=1$ son perpendiculares. Y aunque
              no lo fuera, barrer en horizontal lo resuelve de una vez porque
              en cada altura el tramo es un solo segmento.

      - tipo: calcular
        titulo: a) El triángulo
        pregunta: |
          Calcula $\displaystyle\int_0^1\!\!\int_0^y x\,dx\,dy$.
        respuesta:
          tipo: numero
          valor: '0.1667'
          tolerancia: 0.001
          formato: en forma exacta (1/6) o con cuatro decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              Eso es $\int_0^1\!\int_0^1 x\,dx\,dy$: has integrado sobre el
              cuadrado. El límite de dentro es $y$, no 1.
          - valor: '0.3333'
            mensaje: |
              $1/3$ sale de integrar $y^{2}$ sin el $\tfrac12$ que deja la
              primitiva de $x$. Ojo: $\int_0^y x\,dx = y^{2}/2$.
        pista: |
          $\int_0^y x\,dx = \tfrac{y^{2}}{2}$, y luego integra en $y$.
        desarrollo: |
          $$
          \int_0^1\!\!\int_0^y x\,dx\,dy
          = \int_0^1 \frac{y^{2}}{2}\,dy
          = \left[\frac{y^{3}}{6}\right]_0^1 = \frac16
          $$

      - tipo: calcular
        titulo: b) El semidisco desplazado
        pregunta: |
          El recinto es el medio disco de centro $(2,0)$ y radio 1, por encima
          del eje. Calcula $\displaystyle\iint_D xy\,dx\,dy$.
        respuesta:
          tipo: numero
          valor: '1.3333'
          tolerancia: 0.002
          formato: en forma exacta (4/3) o con cuatro decimales
        distractores:
          - valor: '0.6667'
            mensaje: |
              La mitad: has integrado sobre un cuarto de disco, o has olvidado
              que la $y$ va de 0 hasta la semicircunferencia entera.
          - valor: '2.0944'
            mensaje: |
              Eso es $2\pi/3$, lo que saldría con el disco **entero** o con
              otro integrando. Aquí solo entra la mitad superior, y el
              resultado es racional: la $y$ del integrando hace que el $\pi$
              desaparezca.
        pista: |
          $\int_0^{h} y\,dy = h^{2}/2$ con $h=\sqrt{1-(x-2)^{2}}$, y luego
          integra en $x$ de 1 a 3.
        desarrollo: |
          Con el orden $dy\,dx$, para cada $x\in[1,3]$ la $y$ va de 0 a
          $\sqrt{1-(x-2)^{2}}$:

          $$
          \iint_D xy\,dx\,dy
          = \int_1^3 x\left[\frac{y^{2}}{2}\right]_0^{\sqrt{1-(x-2)^{2}}}dx
          = \frac12\int_1^3 x\big(1-(x-2)^{2}\big)\,dx
          $$

          Con $t=x-2$, el intervalo pasa a $[-1,1]$ y $x=t+2$:

          $$
          = \frac12\int_{-1}^{1} (t+2)(1-t^{2})\,dt
          = \frac12\left[\underbrace{\int_{-1}^{1} t(1-t^{2})\,dt}_{=0}
          + 2\int_{-1}^{1}(1-t^{2})\,dt\right]
          $$

          La primera es **impar** y se anula. La segunda vale $2\cdot\tfrac43$:

          $$
          = \frac12 \cdot 2 \cdot \frac43 = \frac43
          $$

      - tipo: calcular
        titulo: c) Entre la recta y la parábola
        pregunta: |
          $y=x$ e $y=x^{2}/2$ se cortan en $x=0$ y $x=2$. Calcula
          $\displaystyle\iint_D \frac{x}{x^{2}+y^{2}}\,dx\,dy$.
        respuesta:
          tipo: numero
          valor: '0.6931'
          tolerancia: 0.001
          formato: en forma exacta (ln 2) o con cuatro decimales
        distractores:
          - valor: '1.5708'
            mensaje: |
              Eso es $\pi/2$: has integrado el arcotangente hasta infinito, o
              te has dejado el término $-\arctan(x/2)$. La diferencia entre los
              dos arcotangentes es lo que hace que salga un logaritmo.
          - valor: '1.3863'
            mensaje: |
              $\ln 4$, el doble. Suele venir de integrar $2x/(x^{2}+y^{2})$ o
              de duplicar el recinto.
        pista: |
          $\displaystyle\int \frac{x}{x^{2}+y^{2}}\,dy = \arctan\frac{y}{x}$.
        desarrollo: |
          La clave es integrar **primero en $y$**, porque con $x$ fijo el
          integrando es la derivada de un arcotangente:

          $$
          \int \frac{x}{x^{2}+y^{2}}\,dy = \arctan\frac{y}{x}
          $$

          Entre $y=x^{2}/2$ e $y=x$:

          $$
          \arctan\frac{x}{x} - \arctan\frac{x^{2}/2}{x}
          = \frac{\pi}{4} - \arctan\frac{x}{2}
          $$

          Y ahora en $x$, de 0 a 2, integrando por partes el arcotangente:

          $$
          \int_0^2\left(\frac{\pi}{4}-\arctan\frac{x}{2}\right)dx
          = \frac{\pi}{2} - \left[x\arctan\frac{x}{2} - \ln\big(4+x^{2}\big)\right]_0^2
          $$

          $$
          = \frac{\pi}{2} - \left(\frac{\pi}{2} - \ln 8 + \ln 4\right) = \ln 2
          $$

      - tipo: justificar
        pregunta: Ordena lo que decide cada apartado. Una pieza es falsa.
        piezas:
          - texto: >-
              En **a)** manda la forma del recinto: barriendo en horizontal, el
              tramo va de $x=0$ a $x=y$ y no hay que partir nada.
          - texto: >-
              En **b)** manda una simetría: al centrar con $t=x-2$, la parte
              impar del integrando se anula y solo queda la par.
          - texto: >-
              En **c)** manda el integrando: con $x$ fijo, $x/(x^{2}+y^{2})$ es
              la derivada de un arcotangente, así que hay que integrar en $y$
              primero.
          - texto: >-
              Y en los tres, como el integrando es positivo, el resultado tiene
              que ser mayor que el área del recinto.
            trampa: true
            mensaje: |
              No hay tal relación. En **c)** el recinto tiene área $2/3$ y la
              integral vale $\ln 2 \approx 0{,}69$, que es mayor; pero en
              **a)** el área es $1/2$ y la integral $1/6$, que es **menor**,
              porque ahí el integrando $x$ vale entre 0 y 1. La integral
              compara con el área solo si el integrando es mayor o menor que 1
              en todo el recinto, y eso hay que mirarlo.
        veredicto: |
          Tres apartados y tres motivos distintos para elegir el orden: la
          forma del recinto, una simetría, y la primitiva que se busca. Eso es
          lo que este ejercicio entrena, no las cuentas.
    resolucion: |
      **Datos.** Tres integrales dobles sobre tres recintos distintos.

      ### a) El triángulo · $\iint x\,dA$

      Vértices $O(0,0)$, $A(1,1)$, $B(0,1)$: los lados son $x=0$, $y=1$ y la
      recta $y=x$. Barriendo en horizontal, para cada $y$ la $x$ va de 0 a $y$:

      $$
      \int_0^1\!\!\int_0^y x\,dx\,dy = \int_0^1 \frac{y^{2}}{2}\,dy = \frac16
      $$

      ### b) El semidisco · $\iint xy\,dA$

      $(x-2)^{2}+y^{2}=1$ es la circunferencia de centro $(2,0)$ y radio 1; con
      el eje $OX$ cierra el **medio disco superior**. Para cada $x\in[1,3]$:

      $$
      \iint_D xy\,dA = \frac12\int_1^3 x\big(1-(x-2)^{2}\big)dx
      $$

      Centrando con $t=x-2$ el integrando se parte en una función impar —que se
      anula al integrar en $[-1,1]$— y una par:

      $$
      = \frac12\left[0 + 2\int_{-1}^{1}(1-t^{2})dt\right]
      = \frac12\cdot 2\cdot\frac43 = \frac43
      $$

      Ese cero por simetría es el atajo del apartado, y se ve **antes** de
      calcular nada.

      ### c) Entre la recta y la parábola · $\iint \frac{x}{x^{2}+y^{2}}\,dA$

      Los cortes: $x = x^{2}/2 \Rightarrow x=0$ y $x=2$, con la parábola por
      debajo. Aquí manda el **integrando**: con $x$ fijo,

      $$
      \int \frac{x}{x^{2}+y^{2}}\,dy = \arctan\frac{y}{x}
      $$

      $$
      \int_0^2\left[\arctan\frac{y}{x}\right]_{x^{2}/2}^{x}dx
      = \int_0^2\left(\frac{\pi}{4}-\arctan\frac{x}{2}\right)dx = \ln 2
      $$

      Los tres coinciden con los resultados del boletín.

      **Lo que hay que llevarse.** Los tres apartados se resuelven eligiendo
      bien el orden, y en cada uno lo decide una cosa distinta: en **a)** la
      forma del recinto, en **b)** una simetría que anula media integral, y en
      **c)** la primitiva que se busca. Empezar a integrar sin haber mirado
      cuál de las tres manda es lo que convierte un ejercicio de cinco líneas
      en uno de media página.

  - id: dos-dobles-en-polares
    titulo: Dos en polares, y la circunferencia que no está centrada
    fuente: >-
      Ejercicio 2 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica los dos
      resultados y el desarrollo está contrastado contra ellos: salen 3πa⁴/2 y
      πa³/3 exactos.
    nivel: practica
    enunciado: |
      Calcular las siguientes integrales dobles utilizando coordenadas
      polares:

      **a)** $\displaystyle\iint_{D}\left(x^{2}+y^{2}\right)dx\,dy$, donde $D$
      es el dominio limitado por la circunferencia $x^{2}+y^{2}=2ax$.

      **b)** $\displaystyle\iint_{D}\sqrt{a^{2}-x^{2}-y^{2}}\;dx\,dy$, donde
      $D$ es el semicírculo de radio $a$ con centro en $O(0,0)$ y situado sobre
      el eje $OX$.
    pide: El valor de las dos integrales, en función de a.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos recintos son circulares, pero **no son iguales**. ¿Cuál es la
          diferencia que importa?
        opciones:
          - texto: >-
              El de **a)** pasa por el origen y el de **b)** está centrado en
              él: uno da $r=2a\cos\theta$ y el otro $r=a$
            correcta: true
            mensaje: |
              Esa es toda la diferencia, y decide el ejercicio. Una
              circunferencia centrada en el origen tiene radio constante; una
              que **pasa** por él tiene el radio dependiendo del ángulo.
          - texto: >-
              Que uno es un círculo entero y el otro medio: por eso uno vale el
              doble
            mensaje: |
              Es cierto que uno es medio, pero los integrandos también son
              distintos, así que no hay factor 2 entre ellos. Y lo que cambia
              la forma de los límites no es eso: es dónde está el centro.
          - texto: >-
              Ninguna: en polares los dos son $0 \le r \le a$
            mensaje: |
              El de **a)** no. Completando cuadrados es
              $(x-a)^{2}+y^{2}=a^{2}$: centro en $(a,0)$ y radio $a$, así que
              pasa por el origen y su ecuación polar es $r=2a\cos\theta$.

      - tipo: calcular
        titulo: a) El círculo desplazado
        pregunta: |
          En polares queda
          $\displaystyle\int_{-\pi/2}^{\pi/2}\!\!\int_0^{2a\cos\theta} r^{3}\,dr\,d\theta$.
          Con $a=1{,}7$, ¿cuánto vale?
        respuesta:
          tipo: numero
          valor: '39.3583'
          tolerancia: 0.02
          formato: en forma exacta (3·pi·a^4/2) o con cuatro decimales
        distractores:
          - valor: '26.2389'
            mensaje: |
              Eso es $\pi a^{4}$, y sale de integrar $\cos^{4}$ mal: su
              integral en $[-\pi/2,\pi/2]$ vale $\tfrac{3\pi}{8}$, no
              $\tfrac{\pi}{4}$.
          - valor: '19.6792'
            mensaje: |
              La mitad. Suele venir de tomar $\theta$ solo de 0 a $\pi/2$: la
              circunferencia se recorre entera con $\theta$ de $-\pi/2$ a
              $\pi/2$, porque para ángulos mayores el radio saldría negativo.
        pista: |
          $\int_0^{R} r^{3}dr = R^{4}/4$, y
          $\int_{-\pi/2}^{\pi/2}\cos^{4}\theta\,d\theta = \tfrac{3\pi}{8}$.
        desarrollo: |
          El integrando $x^{2}+y^{2}$ es $r^{2}$, y con el $r$ del jacobiano
          queda $r^{3}$:

          $$
          \int_0^{2a\cos\theta} r^{3}\,dr = \frac{16a^{4}\cos^{4}\theta}{4}
          = 4a^{4}\cos^{4}\theta
          $$

          $$
          \iint_D = 4a^{4}\int_{-\pi/2}^{\pi/2}\cos^{4}\theta\,d\theta
          = 4a^{4}\cdot\frac{3\pi}{8} = \frac{3\pi a^{4}}{2}
          $$

          Con $a=1{,}7$: $\tfrac{3\pi}{2}(1{,}7)^{4} = 39{,}3583$.

      - tipo: calcular
        titulo: b) El semicírculo centrado
        pregunta: |
          Aquí el radio sí es constante:
          $\displaystyle\int_0^{\pi}\!\!\int_0^{a}\sqrt{a^{2}-r^{2}}\;r\,dr\,d\theta$.
          Con $a=1{,}7$, ¿cuánto vale?
        respuesta:
          tipo: numero
          valor: '5.1449'
          tolerancia: 0.01
          formato: en forma exacta (pi·a^3/3) o con cuatro decimales
        distractores:
          - valor: '10.2898'
            mensaje: |
              El doble: has integrado $\theta$ de 0 a $2\pi$. El enunciado dice
              **semicírculo** situado sobre el eje $OX$, así que $\theta$ va de
              0 a $\pi$.
          - valor: '15.4347'
            mensaje: |
              Eso es $\pi a^{3}$: te has dejado el $\tfrac13$ que deja la
              integral en $r$.
        pista: |
          Con $t=a^{2}-r^{2}$, $\int_0^a r\sqrt{a^{2}-r^{2}}\,dr = a^{3}/3$.
        desarrollo: |
          $$
          \int_0^{a} r\sqrt{a^{2}-r^{2}}\,dr
          = \left[-\frac{(a^{2}-r^{2})^{3/2}}{3}\right]_0^{a} = \frac{a^{3}}{3}
          $$

          $$
          \iint_D = \int_0^{\pi} \frac{a^{3}}{3}\,d\theta = \frac{\pi a^{3}}{3}
          $$

          Con $a=1{,}7$: $\tfrac{\pi}{3}(1{,}7)^{3} = 5{,}1449$.

      - tipo: justificar
        pregunta: Ordena la diferencia entre los dos apartados. Una pieza es falsa.
        piezas:
          - texto: >-
              En **a)**, $x^{2}+y^{2}=2ax$ es $(x-a)^{2}+y^{2}=a^{2}$: pasa por
              el origen, y su ecuación polar es $r=2a\cos\theta$.
          - texto: >-
              Por eso el límite superior de $r$ depende del ángulo, y $\theta$
              recorre $[-\pi/2,\pi/2]$: fuera de ahí el radio saldría negativo.
          - texto: >-
              En **b)** el centro **es** el origen, así que $r$ va de 0 a $a$
              con $\theta$ de 0 a $\pi$ por ser medio círculo.
          - texto: >-
              Y en los dos el jacobiano es $r$, salvo en **a)**, donde al estar
              desplazado hay que multiplicar además por $\cos\theta$.
            trampa: true
            mensaje: |
              El jacobiano de las polares es $r$ **siempre**, esté el recinto
              donde esté: no depende del dominio, solo del cambio de variables.
              Que el recinto esté desplazado se refleja en los **límites**
              —el $2a\cos\theta$— y en ningún sitio más. Meter el coseno dos
              veces es el error que duplica el resultado.
        veredicto: |
          Ahí está el reparto: el jacobiano lo pone el **cambio**, y los
          límites los pone el **recinto**. Confundirlos es lo que hace que un
          ejercicio de polares salga con un factor de más.
    resolucion: |
      **Datos.** Dos integrales dobles, las dos en polares, sobre dos recintos
      circulares distintos.

      ### a) El círculo que pasa por el origen

      $$
      x^{2}+y^{2}=2ax \iff (x-a)^{2}+y^{2}=a^{2}
      $$

      Centro $(a,0)$, radio $a$: **pasa por el origen**, y su ecuación polar es

      $$
      r^{2} = 2ar\cos\theta \;\Longrightarrow\; r = 2a\cos\theta
      $$

      El ángulo recorre $[-\pi/2,\pi/2]$ — fuera de ahí el coseno es negativo y
      el radio no existe. Con $x^{2}+y^{2}=r^{2}$ y el jacobiano $r$:

      $$
      \iint_D (x^{2}+y^{2})\,dA
      = \int_{-\pi/2}^{\pi/2}\!\!\int_0^{2a\cos\theta} r^{3}\,dr\,d\theta
      = 4a^{4}\int_{-\pi/2}^{\pi/2}\cos^{4}\theta\,d\theta
      $$

      $$
      = 4a^{4}\cdot\frac{3\pi}{8} = \boxed{\ \frac{3\pi a^{4}}{2}\ }
      $$

      ### b) El semicírculo centrado en el origen

      Aquí el radio **sí** es constante: $0\le r\le a$, y por ser medio
      círculo sobre el eje $OX$, $0\le\theta\le\pi$.

      $$
      \iint_D \sqrt{a^{2}-x^{2}-y^{2}}\,dA
      = \int_0^{\pi}\!\!\int_0^{a}\sqrt{a^{2}-r^{2}}\;r\,dr\,d\theta
      = \pi\cdot\frac{a^{3}}{3}
      $$

      $$
      \boxed{\ \frac{\pi a^{3}}{3}\ }
      $$

      Los dos coinciden con los resultados del boletín.

      **Lo que hay que llevarse.** Los dos apartados están puestos juntos a
      propósito: son el mismo cambio con recintos distintos, y lo único que
      cambia son los **límites**. El jacobiano es $r$ en los dos, esté el
      círculo donde esté. Si al resolver uno desplazado te aparece un coseno de
      más, casi siempre es que lo has metido dos veces — una en el límite y
      otra en el jacobiano.

  - id: polares-generalizadas-en-la-elipse
    titulo: Polares generalizadas, y por qué la elipse deja de estorbar
    fuente: >-
      Ejercicio 3 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él: sale 2πab/3 exacto.
    nivel: practica
    enunciado: |
      Utilizando coordenadas polares generalizadas, calcular

      $$
      \iint_{D} \sqrt{\,1-\frac{x^{2}}{a^{2}}-\frac{y^{2}}{b^{2}}\,}\;dx\,dy
      $$

      donde $D$ es el recinto limitado por la elipse
      $\dfrac{x^{2}}{a^{2}}+\dfrac{y^{2}}{b^{2}}=1$.
    pide: El valor de la integral, en función de a y b.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué son las polares **generalizadas** y por qué aquí?
        opciones:
          - texto: >-
              $x = a\,r\cos\theta$, $y = b\,r\operatorname{sen}\theta$: cada eje
              con su semieje delante
            correcta: true
            mensaje: |
              Eso es. Con ese cambio,
              $\frac{x^{2}}{a^{2}}+\frac{y^{2}}{b^{2}} = r^{2}$, así que la
              elipse pasa a ser $r=1$ y el integrando se vuelve
              $\sqrt{1-r^{2}}$. Toda la dificultad del enunciado desaparece de
              golpe.
          - texto: >-
              Las de siempre, $x=r\cos\theta$ e $y=r\operatorname{sen}\theta$,
              pero con $r$ hasta el semieje mayor
            mensaje: |
              Con las de siempre la elipse **no** es $r$ constante: su radio
              depende del ángulo, y el recinto vuelve a tener un borde curvo
              variable. El cambio generalizado existe precisamente para
              evitarlo.
          - texto: >-
              Un cambio a coordenadas cilíndricas
            mensaje: |
              Las cilíndricas son para tres variables. Aquí la integral es
              doble: lo que hace falta es estirar cada eje por su semieje.

      - tipo: calcular
        titulo: El jacobiano
        pregunta: |
          Con $x = a\,r\cos\theta$ e $y = b\,r\operatorname{sen}\theta$,
          ¿cuánto vale $\left|\dfrac{\partial(x,y)}{\partial(r,\theta)}\right|$
          para $a=2$, $b=3$ y $r=1$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Ese sería el jacobiano si el cambio fuese la identidad. Al
              estirar cada eje, las áreas se multiplican por $ab$ — y además
              queda el $r$ de las polares de siempre.
          - valor: '5'
            mensaje: |
              Has sumado los semiejes en vez de multiplicarlos. El jacobiano de
              un estiramiento es el **producto** de los factores de cada eje.
        pista: |
          $|J| = ab\,r$. Con $a=2$, $b=3$, $r=1$.
        desarrollo: |
          $$
          \frac{\partial(x,y)}{\partial(r,\theta)}
          = \begin{vmatrix}
            a\cos\theta & -a\,r\operatorname{sen}\theta \\[2pt]
            b\operatorname{sen}\theta & b\,r\cos\theta
          \end{vmatrix}
          = ab\,r\cos^{2}\theta + ab\,r\operatorname{sen}^{2}\theta = ab\,r
          $$

          Es el $r$ de las polares de siempre multiplicado por $ab$: el factor
          por el que el cambio estira las áreas.

          Con $a=2$, $b=3$, $r=1$: $|J| = 6$.

      - tipo: calcular
        titulo: La integral
        pregunta: |
          Queda
          $\displaystyle\int_0^{2\pi}\!\!\int_0^{1} \sqrt{1-r^{2}}\;ab\,r\,dr\,d\theta$.
          Para $a=2$ y $b=3$, ¿cuánto vale?
        respuesta:
          tipo: numero
          valor: '12.5664'
          tolerancia: 0.002
          formato: en forma exacta (4pi) o con cuatro decimales
        distractores:
          - valor: '6.2832'
            mensaje: |
              La mitad: te has dejado el $2$ del $2\pi$, o has integrado
              $\theta$ solo hasta $\pi$. La elipse entera son $2\pi$ radianes.
          - valor: '4.1888'
            mensaje: |
              Eso es $2\pi/3$, el resultado **sin** el $ab$: es lo que saldría
              con la circunferencia unidad. Falta multiplicar por $ab=6$.
        pista: |
          $\int_0^1 r\sqrt{1-r^{2}}\,dr = \tfrac13$, y el resto es una
          constante por $2\pi$.
        desarrollo: |
          La integral en $r$ sale con el cambio $t=1-r^{2}$:

          $$
          \int_0^{1} r\sqrt{1-r^{2}}\,dr
          = \left[-\frac{(1-r^{2})^{3/2}}{3}\right]_0^{1} = \frac13
          $$

          Y el resto es constante:

          $$
          \iint_D = ab \int_0^{2\pi}\!\!d\theta \cdot \frac13
          = ab \cdot 2\pi \cdot \frac13 = \frac{2\pi ab}{3}
          $$

          Con $a=2$ y $b=3$: $\dfrac{2\pi\cdot 6}{3} = 4\pi \approx 12{,}5664$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $x=ar\cos\theta$ e $y=br\operatorname{sen}\theta$, la
              expresión $\tfrac{x^{2}}{a^{2}}+\tfrac{y^{2}}{b^{2}}$ se vuelve
              $r^{2}$, y la elipse pasa a ser $r=1$.
          - texto: >-
              El jacobiano es $ab\,r$: el $r$ de las polares por el factor de
              estiramiento de los dos ejes.
          - texto: >-
              El integrando queda $\sqrt{1-r^{2}}$, que ya no depende de
              $\theta$, así que la integral angular es solo $2\pi$.
          - texto: >-
              Y como el recinto es una elipse y no un círculo, el ángulo
              $\theta$ tiene que ir de 0 a $2\pi$ **corregido** por la
              excentricidad.
            trampa: true
            mensaje: |
              No hay corrección ninguna: en las variables nuevas el recinto es
              el **disco unidad**, y ahí $\theta$ recorre $[0,2\pi]$ como
              siempre. Toda la deformación de la elipse está metida en el
              jacobiano $ab$ — ese es el sentido del cambio. Si además hubiera
              que corregir el ángulo, el jacobiano no serviría para nada.
        veredicto: |
          El resultado, $\tfrac{2\pi ab}{3}$, es el del círculo unidad
          multiplicado por $ab$. Tiene sentido: el cambio convierte la elipse
          en un círculo y todo el precio está en un factor constante.
    resolucion: |
      **Datos.** La integral de $\sqrt{1-\frac{x^{2}}{a^{2}}-\frac{y^{2}}{b^{2}}}$
      sobre el interior de la elipse de semiejes $a$ y $b$.

      ### 1 · El cambio, que el enunciado ya nombra

      $$
      x = a\,r\cos\theta, \qquad y = b\,r\operatorname{sen}\theta
      $$

      Con él, la combinación que aparece en el integrando **y** en la ecuación
      del recinto es la misma:

      $$
      \frac{x^{2}}{a^{2}}+\frac{y^{2}}{b^{2}} = r^{2}
      $$

      Así que la elipse es $r=1$ y el integrando es $\sqrt{1-r^{2}}$. El
      recinto pasa a ser el **disco unidad**.

      ### 2 · El jacobiano

      $$
      \frac{\partial(x,y)}{\partial(r,\theta)}
      = ab\,r\left(\cos^{2}\theta+\operatorname{sen}^{2}\theta\right) = ab\,r
      $$

      El $r$ de las polares de siempre, por el factor $ab$ con que el cambio
      estira las áreas.

      ### 3 · La integral

      $$
      \iint_D \sqrt{1-\tfrac{x^{2}}{a^{2}}-\tfrac{y^{2}}{b^{2}}}\;dx\,dy
      = \int_0^{2\pi}\!\!\int_0^1 \sqrt{1-r^{2}}\;ab\,r\,dr\,d\theta
      $$

      La de dentro, con $t = 1-r^{2}$:

      $$
      \int_0^1 r\sqrt{1-r^{2}}\,dr = \left[-\frac{(1-r^{2})^{3/2}}{3}\right]_0^1 = \frac13
      $$

      $$
      \boxed{\ \iint_D = ab \cdot 2\pi \cdot \frac13 = \frac{2\pi ab}{3}\ }
      $$

      Coincide con el resultado del boletín.

      **Lo que hay que llevarse.** El resultado es el del **círculo unidad**
      multiplicado por $ab$, y eso no es casualidad: el cambio convierte la
      elipse en un círculo y todo el precio de la deformación cabe en un factor
      constante. Cuando el integrando y el recinto comparten la misma
      combinación de $x$ e $y$ —aquí $\frac{x^{2}}{a^{2}}+\frac{y^{2}}{b^{2}}$—
      esa combinación es la variable nueva.

  - id: area-entre-dos-circunferencias-en-polares
    titulo: El área entre dos circunferencias que se tocan en el origen
    fuente: >-
      Ejercicio 5 · Boletín «Integral múltiple. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él: sale (3/4)(π+2) exacto.
    nivel: practica
    enunciado: |
      Calcular el área del dominio limitado por las condiciones
      $x^{2}+y^{2} \ge 2x$, $x^{2}+y^{2} \le 4x$, $y \ge 0$, $y \le x$.
    pide: El área del dominio.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos primeras condiciones tienen $x^{2}+y^{2}$ a un lado y un
          múltiplo de $x$ al otro. ¿Qué son?
        opciones:
          - texto: >-
              Dos **circunferencias** que pasan por el origen, de centro en el
              eje $OX$
            correcta: true
            mensaje: |
              Eso es: $x^{2}+y^{2}=2x$ se reescribe como
              $(x-1)^{2}+y^{2}=1$, y la otra como $(x-2)^{2}+y^{2}=4$. Las dos
              pasan por el origen y el recinto es lo que hay entre ellas.
          - texto: >-
              Dos parábolas, porque una variable está al cuadrado y la otra no
            mensaje: |
              Están **las dos** al cuadrado: $x^{2}$ e $y^{2}$, con el mismo
              coeficiente. Eso es una circunferencia; lo que despista es que el
              término lineal en $x$ está sin completar el cuadrado.
          - texto: >-
              Dos rectas, porque $2x$ y $4x$ son lineales
            mensaje: |
              El lado izquierdo no es lineal. Pasando todo a un lado queda
              $x^{2}+y^{2}-2x \ge 0$, que es el exterior de una circunferencia.

      - tipo: reconocer
        pregunta: |
          En polares, $x^{2}+y^{2}=r^{2}$ y $x=r\cos\theta$. ¿En qué se
          convierten las cuatro condiciones?
        opciones:
          - texto: >-
              $2\cos\theta \le r \le 4\cos\theta$, con
              $0 \le \theta \le \tfrac{\pi}{4}$
            correcta: true
            mensaje: |
              Exacto, y ahí está la ganancia: los dos radios dependen del
              ángulo pero **el intervalo de $\theta$ es fijo**, que es lo que
              hace la integral inmediata. La $r$ se simplifica en las dos
              desigualdades porque es positiva.
          - texto: >-
              $2 \le r \le 4$, con $0 \le \theta \le \tfrac{\pi}{4}$
            mensaje: |
              Falta el coseno. Si las circunferencias estuviesen centradas en
              el origen sí serían $r=2$ y $r=4$, pero pasan **por** el origen:
              su ecuación polar es $r = 2a\cos\theta$.
          - texto: >-
              $2\cos\theta \le r \le 4\cos\theta$, con
              $0 \le \theta \le \tfrac{\pi}{2}$
            mensaje: |
              El $\pi/2$ sería solo con $y \ge 0$. La cuarta condición,
              $y \le x$, recorta hasta la bisectriz: $\tan\theta \le 1$, o sea
              $\theta \le \pi/4$.

      - tipo: calcular
        titulo: La integral en r
        pregunta: |
          Con $dA = r\,dr\,d\theta$, la integral interior es
          $\int_{2\cos\theta}^{4\cos\theta} r\,dr$. ¿A qué es igual, en función
          de $\cos^{2}\theta$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: el coeficiente que multiplica a cos²θ
        distractores:
          - valor: '2'
            mensaje: |
              Has restado los radios en vez de sus cuadrados. La primitiva de
              $r$ es $r^{2}/2$, así que queda
              $\tfrac12(16\cos^{2}\theta - 4\cos^{2}\theta)$.
          - valor: '12'
            mensaje: |
              Te falta el $\tfrac12$ de la primitiva: $16-4=12$, y la mitad es
              6.
        pista: |
          $\int r\,dr = r^{2}/2$, evaluada entre los dos radios.
        desarrollo: |
          $$
          \int_{2\cos\theta}^{4\cos\theta} r\,dr
          = \left[\frac{r^{2}}{2}\right]_{2\cos\theta}^{4\cos\theta}
          = \frac{16\cos^{2}\theta - 4\cos^{2}\theta}{2}
          = 6\cos^{2}\theta
          $$

      - tipo: calcular
        titulo: El área
        pregunta: |
          Queda $\displaystyle\int_0^{\pi/4} 6\cos^{2}\theta\,d\theta$.
          ¿Cuánto vale?
        respuesta:
          tipo: numero
          valor: '3.8562'
          tolerancia: 0.001
          formato: en forma exacta (3(pi+2)/4) o con cuatro decimales
        distractores:
          - valor: '2.3562'
            mensaje: |
              Eso es $3\pi/4$: te has dejado el término del seno. Al integrar
              $\cos^{2}$ con el ángulo doble aparecen **dos** sumandos, y el
              segundo vale $\tfrac{\operatorname{sen}(\pi/2)}{2}=\tfrac12$.
          - valor: '1.9281'
            mensaje: |
              La mitad del resultado: has usado $3\cos^{2}\theta$ en vez de
              $6\cos^{2}\theta$, o has dividido de más al bajar el ángulo
              doble.
        pista: |
          $\cos^{2}\theta = \dfrac{1+\cos 2\theta}{2}$.
        desarrollo: |
          $$
          \int_0^{\pi/4} 6\cos^{2}\theta\,d\theta
          = 3\int_0^{\pi/4}\big(1+\cos 2\theta\big)\,d\theta
          = 3\left[\theta + \frac{\operatorname{sen}2\theta}{2}\right]_0^{\pi/4}
          $$

          $$
          = 3\left(\frac{\pi}{4} + \frac12\right)
          = \frac{3}{4}\,(\pi+2) \approx 3{,}8562
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $x^{2}+y^{2}=2x$ es $(x-1)^{2}+y^{2}=1$ y $x^{2}+y^{2}=4x$ es
              $(x-2)^{2}+y^{2}=4$: dos circunferencias por el origen.
          - texto: >-
              En polares son $r=2\cos\theta$ y $r=4\cos\theta$, así que el
              radio va de una a otra con el ángulo fijo entre 0 y $\pi/4$.
          - texto: >-
              La integral interior da $6\cos^{2}\theta$, y bajando el ángulo
              doble sale $\tfrac34(\pi+2)$.
          - texto: >-
              Como las dos circunferencias pasan por el origen, el recinto
              incluye ese punto y hay que tratarlo como una impropia.
            trampa: true
            mensaje: |
              El origen es un punto, y un punto no tiene área: no hay nada
              impropio. De hecho en $\theta$ las dos curvas se juntan solo en
              $\theta=\pi/2$, que queda fuera del intervalo. El integrando
              $6\cos^{2}\theta$ es continuo y acotado en todo $[0,\pi/4]$.
        veredicto: |
          Lo que hace fácil este ejercicio es que **el intervalo de $\theta$ es
          constante** aunque los radios no lo sean: por eso la integral doble
          se deshace en dos simples sin partir nada.
    resolucion: |
      **Datos.** Cuatro condiciones: $x^{2}+y^{2} \ge 2x$,
      $x^{2}+y^{2} \le 4x$, $y \ge 0$, $y \le x$.

      ### 1 · Qué es cada condición

      Completando cuadrados:

      $$
      x^{2}+y^{2}=2x \iff (x-1)^{2}+y^{2}=1,
      \qquad
      x^{2}+y^{2}=4x \iff (x-2)^{2}+y^{2}=4
      $$

      Dos circunferencias **que pasan por el origen**, con centro en el eje
      $OX$. El recinto es lo que queda **fuera** de la pequeña y **dentro** de
      la grande, en el sector entre el eje $OX$ y la bisectriz.

      ### 2 · Polares, que es lo que el enunciado pide a gritos

      Con $x=r\cos\theta$ e $y=r\operatorname{sen}\theta$:

      | condición | en polares |
      |---|---|
      | $x^{2}+y^{2} \ge 2x$ | $r \ge 2\cos\theta$ |
      | $x^{2}+y^{2} \le 4x$ | $r \le 4\cos\theta$ |
      | $y \ge 0$ | $\theta \ge 0$ |
      | $y \le x$ | $\theta \le \pi/4$ |

      La $r$ se simplifica en las dos primeras porque es positiva. Y lo
      importante: **el intervalo de $\theta$ no depende de nada**.

      ### 3 · La integral

      $$
      \text{Área} = \int_0^{\pi/4}\!\!\int_{2\cos\theta}^{4\cos\theta} r\,dr\,d\theta
      = \int_0^{\pi/4} \frac{16\cos^{2}\theta-4\cos^{2}\theta}{2}\,d\theta
      = \int_0^{\pi/4} 6\cos^{2}\theta\,d\theta
      $$

      Bajando el ángulo doble:

      $$
      = 3\left[\theta+\frac{\operatorname{sen}2\theta}{2}\right]_0^{\pi/4}
      = 3\left(\frac{\pi}{4}+\frac12\right)
      $$

      $$
      \boxed{\ \text{Área} = \frac{3}{4}(\pi+2) \approx 3{,}8562\ }
      $$

      Coincide con el resultado del boletín.

      **Lo que hay que llevarse.** Una circunferencia que pasa por el origen
      tiene ecuación polar $r=2a\cos\theta$, no $r=$ constante. Confundirlas es
      el error que convierte este ejercicio en otro mucho más fácil y
      equivocado — y se detecta solo: con $r$ constante, el $\cos^{2}\theta$
      desaparece y el resultado no tiene el $+2$.

  - id: invertir-el-orden
    titulo: Invertir el orden de integración
    fuente: Ejercicio 7.3 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU (2017/2018 5E)
    nivel: practica
    enunciado: |
      Sea la integral $\displaystyle\int_{0}^{1}\!\!\int_{\sqrt{y}}^{3-2y} dx\,dy$.
      Representar gráficamente el recinto de integración, invertir el orden de
      integración y calcular la integral en el nuevo orden obtenido.
    pide: El dibujo del recinto, la integral con el orden invertido y su valor.
    pasos:
      - tipo: dibujar
        consigna: |
          Dibuja el recinto de integración en unos ejes $x$–$y$, con los tres
          vértices marcados y sus coordenadas escritas. No sigas sin hacerlo:
          este ejercicio **no se puede invertir de cabeza**, y el enunciado te
          lo pide como primer apartado.
        comprueba:
          - punto: >-
              El borde izquierdo es la **parábola** $y=x^{2}$, no una recta.
            porque: >-
              El enunciado la da como $x=\sqrt{y}$, y elevando al cuadrado sale
              $y=x^{2}$. Dibujarla recta es el error que más veces convierte
              este ejercicio en uno más fácil que no es el que han puesto: con
              una recta ahí no hay que partir nada, y toda la dificultad
              desaparece.
          - punto: >-
              Los tres vértices son $(0,0)$, $(1,1)$ y $(3,0)$, escritos.
            porque: >-
              El $(1,1)$ es el que decide el ejercicio: es donde la parábola
              corta a la recta $x=3-2y$, y por tanto donde cambia la tapa de
              arriba. Si no lo has calculado antes de dibujar, el dibujo sale
              a ojo y los límites saldrán mal.
          - punto: >-
              Una **vertical de puntos en $x=1$**, partiendo el recinto en dos.
            porque: >-
              Es la respuesta del ejercicio dibujada. Barriendo en vertical, la
              tapa de arriba es la parábola a la izquierda de $x=1$ y la recta
              a la derecha, así que la integral invertida son **dos** y no una.
              Quien no dibuja esa línea escribe una sola integral y pierde el
              ejercicio entero.
          - punto: >-
              El barrido que vas a usar, con un par de tiras **verticales**.
            porque: >-
              Invertir el orden a $dy\,dx$ es barrer en vertical. Dibujar dos
              tiras —una a cada lado de $x=1$— enseña de un vistazo que sus
              extremos de arriba son curvas distintas, que es justo lo que hay
              que traducir a límites.
        figura: |
          <figure>
          <svg viewBox="-15 -20 340 200" role="img" aria-labelledby="t7invT t7invD">
            <title id="t7invT">El recinto de integración, partido en x = 1</title>
            <desc id="t7invD">Un triángulo curvo con vértices en el origen, en el punto (1,1) y en el punto (3,0). Su borde de arriba a la izquierda es la parábola y igual a x al cuadrado, que sube del origen hasta (1,1); a la derecha de (1,1) el borde es la recta que baja hasta (3,0); abajo cierra el eje horizontal. Una línea vertical de puntos en x igual a 1 parte la región en dos mitades, y en cada mitad hay una tira vertical dibujada que llega hasta un borde superior distinto.</desc>

            <line x1="20" y1="130" x2="320" y2="130" stroke="var(--rule)" stroke-width="1.2"></line>
            <line x1="30" y1="145" x2="30" y2="15" stroke="var(--rule)" stroke-width="1.2"></line>
            <text x="313" y="145" font-size="10" fill="var(--faint)" font-family="var(--mono)">x</text>
            <text x="20" y="18" font-size="10" fill="var(--faint)" font-family="var(--mono)">y</text>

            <path d="M30 130 Q75 130 120 40 L300 130 Z" fill="var(--live-soft)" stroke="var(--live)" stroke-width="1.8"></path>

            <line x1="120" y1="130" x2="120" y2="40" stroke="var(--alt)" stroke-width="1.4" stroke-dasharray="4 3"></line>

            <line x1="75" y1="130" x2="75" y2="107.5" stroke="var(--live)" stroke-width="1.3"></line>
            <line x1="210" y1="130" x2="210" y2="85" stroke="var(--live)" stroke-width="1.3"></line>

            <circle cx="30" cy="130" r="3" fill="var(--live)"></circle>
            <circle cx="120" cy="40" r="3" fill="var(--live)"></circle>
            <circle cx="300" cy="130" r="3" fill="var(--live)"></circle>

            <text x="16" y="144" font-size="10" fill="var(--ink)" font-family="var(--mono)">(0,0)</text>
            <text x="126" y="36" font-size="10" fill="var(--ink)" font-family="var(--mono)">(1,1)</text>
            <text x="286" y="144" font-size="10" fill="var(--ink)" font-family="var(--mono)">(3,0)</text>
            <text x="110" y="146" font-size="10" fill="var(--alt)" font-family="var(--mono)">x = 1</text>

            <text x="34" y="70" font-size="10" fill="var(--live)" font-family="var(--mono)">y = x²</text>
            <text x="212" y="62" font-size="10" fill="var(--live)" font-family="var(--mono)">y = (3−x)/2</text>
          </svg>
          <figcaption>El recinto, y la vertical en x = 1 que obliga a partirlo: a su izquierda la tapa es la parábola, a su derecha la recta.</figcaption>
          </figure>
        veredicto: >-
          Si tu dibujo tiene la parábola y la vertical en $x=1$, el resto del
          ejercicio es traducir el dibujo a límites. Si te falta alguna de las
          dos, lo que viene detrás no se puede hacer bien por mucho que
          integres bien.
      - tipo: reconocer
        pregunta: |
          Los límites dados son $x$ desde $\sqrt{y}$ hasta $3-2y$, con $y$ de 0 a
          1. ¿Qué describe eso?
        opciones:
          - texto: Tiras horizontales que entran por la parábola y salen por la recta
            correcta: true
            mensaje: |
              Eso es. Con $dx$ dentro, te quedas en un $y$ y te mueves en
              horizontal: entras por $x=\sqrt{y}$ y sales por $x=3-2y$.
          - texto: Tiras verticales entre dos curvas
            mensaje: |
              Las tiras verticales corresponden a $dy$ dentro. Aquí el
              diferencial interior es $dx$, así que las tiras son horizontales.
          - texto: Un rectángulo, porque los límites de y son números
            mensaje: |
              Los de $y$ sí son números, pero los de $x$ llevan $y$ dentro: por
              eso el recinto tiene lados curvos y no es un rectángulo.
      - tipo: calcular
        titulo: Dónde se cortan las dos curvas
        pregunta: |
          $x=\sqrt{y}$ es $y=x^{2}$, y $x=3-2y$ es $y=(3-x)/2$. ¿Para qué valor
          positivo de $x$ se cortan?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1.5'
            mensaje: |
              $1{,}5$ sale de resolver $3-2y=0$, o sea de dónde la recta corta al
              eje $y$. Dos cosas fallan ahí: es un valor de **$y$**, no de $x$, y
              es el corte con el eje, no con la parábola.
          - valor: '3'
            mensaje: |
              3 sale de $3-2y$ con $y=0$ en la forma original. El corte con la
              parábola se obtiene igualando $x^{2} = (3-x)/2$.
        pista: |
          Iguala $x^{2} = (3-x)/2$, o sea $2x^{2}+x-3=0$. Una raíz es positiva.
        desarrollo: |
          $$
          x^{2} = \frac{3-x}{2}
          \;\Longrightarrow\;
          2x^{2}+x-3 = 0
          \;\Longrightarrow\;
          (2x+3)(x-1)=0
          $$

          La raíz positiva es $x=1$, y ahí $y=1$. El punto de corte es $(1,1)$,
          que es justo la esquina superior del recinto.
      - tipo: justificar
        pregunta: |
          Ordena la inversión del orden. Una pieza es falsa.
        piezas:
          - texto: 'El recinto va de $y=0$ a $y=1$, entre la parábola $x=\sqrt{y}$ y la recta $x=3-2y$.'
          - texto: 'En el nuevo orden hay que partirlo en dos, porque la tapa de arriba cambia en $x=1$.'
          - texto: 'Para $x$ de 0 a 1, la vertical va de $y=0$ a la parábola $y=x^{2}$.'
          - texto: 'Para $x$ de 1 a 3, la vertical va de $y=0$ a la recta $y=(3-x)/2$.'
          - texto: 'Al invertir el orden basta con escribir $\int_{\sqrt y}^{3-2y}\int_0^1 dy\,dx$.'
            trampa: true
            mensaje: |
              Han quedado dos $y$ en el límite exterior. Invertir el orden no es
              intercambiar los límites de sitio: hay que releer el dibujo con la
              otra pregunta, y aquí eso además obliga a partir el recinto en dos.
    resolucion: |
      **El dibujo primero**, que es lo que pide el enunciado y lo que hace
      posible el resto.

      El recinto está entre $y=0$ e $y=1$. Su borde izquierdo es la parábola
      $x=\sqrt{y}$ (o sea $y=x^{2}$) y el derecho la recta $x=3-2y$.

      Los tres vértices salen de cortar:

      | corte | punto |
      |---|---|
      | parábola con recta | $(1,1)$ |
      | parábola con $y=0$ | $(0,0)$ |
      | recta con $y=0$ | $(3,0)$ |

      **Invertir el orden obliga a partir el recinto**, y esa es la dificultad
      real del ejercicio. Barriendo en vertical, la tapa de arriba **no es la
      misma** a la izquierda y a la derecha de $x=1$:

      $$
      \int_{0}^{1}\!\!\int_{0}^{x^{2}} dy\,dx
      \;+\;
      \int_{1}^{3}\!\!\int_{0}^{(3-x)/2} dy\,dx
      $$

      **Calculando:**

      $$
      \int_{0}^{1} x^{2}\,dx = \frac{1}{3},
      \qquad
      \int_{1}^{3}\frac{3-x}{2}\,dx
      = \frac{1}{2}\Bigl[3x - \tfrac{x^{2}}{2}\Bigr]_{1}^{3}
      = \frac{1}{2}\cdot 2 = 1
      $$

      $$
      \boxed{\;\int_{0}^{1}\!\!\int_{\sqrt y}^{3-2y} dx\,dy = \frac{1}{3}+1 = \frac{4}{3}\;}
      $$

      > **Que haya que partir el recinto es la señal de que el orden original
      > era el bueno.** Cuando un enunciado te hace invertir hacia el orden
      > incómodo, lo que está evaluando es si sabes leer el dibujo — no si sabes
      > integrar.

  - id: solido-con-tres-ordenes
    titulo: Un sólido, y la misma integral en tres órdenes
    fuente: Ejercicio 7.6 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU (2014/2015 4E)
    nivel: practica
    enunciado: |
      Considerar el sólido $R$ delimitado por las condiciones $z \le 5-2y$,
      $0\le x\le 4$, $0\le y\le 2$ y $z\ge 0$. Se pide:

      a) Representar gráficamente el sólido.
      b) Expresar (sin hacer el cálculo) la integral $\iiint_R dx\,dy\,dz$ en los
      órdenes $dz\,dx\,dy$, $dy\,dx\,dz$ y $dx\,dy\,dz$.
      c) Calcular el valor de $V$ empleando alguno de los órdenes obtenidos.
    pide: El dibujo, la integral en tres órdenes y el volumen.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado pide expresar la integral en tres órdenes **sin
          calcularla**. ¿Qué se está evaluando?
        opciones:
          - texto: Saber leer el sólido y traducirlo a límites, que es lo que puntúa en COMP4
            correcta: true
            mensaje: |
              Exacto. El apartado b) es explícitamente «sin hacer el cálculo»:
              lo que se corrige es el planteamiento. En esta evaluación COMP4
              vale la mitad de la nota del ejercicio.
          - texto: La rapidez de cálculo
            mensaje: |
              Al contrario: el enunciado prohíbe calcular en ese apartado. Lo que
              se mide es si entiendes la geometría, no si integras deprisa.
          - texto: Que te sepas de memoria las fórmulas del volumen
            mensaje: |
              No hay fórmula que memorizar: el volumen es $\iiint dV$ y todo el
              trabajo está en los límites, que salen del dibujo.
      - tipo: calcular
        titulo: La altura del sólido en y = 0
        pregunta: |
          La tapa superior es el plano $z = 5-2y$. ¿Qué altura tiene el sólido
          en $y=0$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es la altura en $y=2$, el otro extremo: $5-2(2)=1$. En $y=0$ el
              término $-2y$ no resta nada.
          - valor: '3'
            mensaje: |
              3 sería la altura en $y=1$, en el centro. La pregunta es en $y=0$.
        pista: |
          Sustituye y=0 en 5-2y.
        desarrollo: |
          $$
          z = 5-2(0) = 5
          $$

          Y en $y=2$ la altura es $5-4=1$. El sólido es un **prisma de sección
          trapecial**: la tapa baja de 5 a 1 al avanzar en $y$, y nunca llega a
          cero dentro del recinto.
      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Integrando, $V = \int_0^2\!\int_0^4\!\int_0^{5-2y} dz\,dx\,dy$.
          ¿Cuánto vale?
        respuesta:
          tipo: numero
          valor: '24'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '40'
            mensaje: |
              40 es $4\times 2\times 5$: la caja completa con altura constante 5.
              Pero la tapa es inclinada, así que el volumen es menor.
          - valor: '12'
            mensaje: |
              Parece que has usado solo la altura media de una de las mitades.
              El área del trapecio de sección es $(5+1)/2\times 2 = 6$, y por los
              4 de anchura sale 24.
        pista: |
          La sección en el plano YZ es un trapecio de bases 5 y 1 y altura 2. Multiplica su área por 4.
        desarrollo: |
          $$
          V = \int_0^2\!\!\int_0^4 (5-2y)\,dx\,dy
          = 4\int_0^2 (5-2y)\,dy
          = 4\bigl[5y-y^{2}\bigr]_0^2
          = 4(10-4) = 24
          $$

          **Comprobación geométrica**: la sección es un trapecio de bases 5 y 1 y
          altura 2, de área $(5+1)/2\cdot 2 = 6$; por la longitud 4 en $x$ da 24. ✓
      - tipo: justificar
        pregunta: |
          Ordena la respuesta del apartado b). Una pieza es falsa.
        piezas:
          - texto: 'En el orden $dz\,dx\,dy$: $z$ de 0 a $5-2y$, $x$ de 0 a 4, $y$ de 0 a 2.'
          - texto: 'En el orden $dx\,dy\,dz$ la $x$ es libre de 0 a 4, porque nada la liga a las otras.'
          - texto: 'En ese mismo orden hay que partir en $z=1$, porque por debajo de 1 la $y$ recorre todo $[0,2]$.'
          - texto: 'Y por encima de $z=1$, la $y$ solo llega hasta $(5-z)/2$.'
          - texto: 'Los tres órdenes dan integrales distintas, así que el volumen depende del orden elegido.'
            trampa: true
            mensaje: |
              Las **integrales** se escriben distinto, pero el **volumen** es el
              mismo: es una propiedad del sólido, no del orden en que lo barras.
              Que salga lo mismo por los tres caminos es la comprobación de que
              los tres están bien planteados.
      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 350 250" role="img" width="350" height="250"
               aria-labelledby="f-prisma-trapecial-t f-prisma-trapecial-d">
            <title id="f-prisma-trapecial-t">El prisma de base rectangular con el techo inclinado solo en la dirección y</title>
            <desc id="f-prisma-trapecial-d">Una caja de cuatro por dos en el suelo, con el techo cortado por un plano que baja de altura cinco sobre el borde y igual a cero a altura uno sobre el borde y igual a dos. El techo no se inclina en la dirección x: todas las secciones perpendiculares al eje x son el mismo trapecio.</desc>
            <style>
                .f-prisma-trapecial-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
                .f-prisma-trapecial-c { stroke: var(--d1); stroke-width: 2.8; fill: none; }
                .f-prisma-trapecial-c2 { stroke: var(--alt); stroke-width: 2.8; fill: none; }
                .f-prisma-trapecial-cp { stroke: var(--d1); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
                .f-prisma-trapecial-cp2 { stroke: var(--alt); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
                .f-prisma-trapecial-g { stroke: var(--faint); stroke-width: 1.1; fill: none; stroke-dasharray: 3 3; }
                .f-prisma-trapecial-fue { stroke: var(--faint); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
                .f-prisma-trapecial-f { fill: var(--live); fill-opacity: .12; stroke: none; }
                .f-prisma-trapecial-f2 { fill: var(--alt); fill-opacity: .12; stroke: none; }
                .f-prisma-trapecial-pt { fill: var(--live); }
                .f-prisma-trapecial-punta { fill: var(--live); stroke: none; }
                .f-prisma-trapecial-hueco { fill: var(--paper); stroke: var(--live); stroke-width: 2; }
                .f-prisma-trapecial-o { fill: var(--flag); }
                .f-prisma-trapecial-n { fill: var(--faint); font-size: 10px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
                .f-prisma-trapecial-l { font-size: 10.5px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.4px; stroke-linejoin: round; }
            </style>
            <path class="f-prisma-trapecial-g" d="M133.6 184.4L248.3 159.6L191 147.3L76.3 172Z"/>
            <path class="f-prisma-trapecial-f" d="M133.6 60.7L248.3 35.9L191 122.5L76.3 147.3Z"/>
            <path class="f-prisma-trapecial-c" d="M133.6 184.4L248.3 159.6L248.3 35.9L133.6 60.7Z"/>
            <path class="f-prisma-trapecial-c" d="M248.3 159.6L191 147.3L191 122.5L248.3 35.9Z"/>
            <path class="f-prisma-trapecial-c2" d="M133.6 60.7L248.3 35.9L191 122.5L76.3 147.3Z"/>
            <path class="f-prisma-trapecial-g" d="M76.3 172L76.3 147.3"/>
            <path class="f-prisma-trapecial-g" d="M133.6 184.4L133.6 60.7"/>
            <text class="f-prisma-trapecial-n" x="260.9" y="161.8" text-anchor="start" fill="var(--faint)">x</text>
            <text class="f-prisma-trapecial-n" x="55.7" y="176.2" text-anchor="start" fill="var(--faint)">y</text>
            <text class="f-prisma-trapecial-l" x="139.6" y="54.7" text-anchor="start" fill="var(--alt)">z = 5</text>
            <text class="f-prisma-trapecial-l" x="197" y="124.5" text-anchor="start" fill="var(--alt)">z = 1</text>
            <text class="f-prisma-trapecial-l" x="16" y="18" text-anchor="start" fill="var(--live)">techo z = 5 − 2y</text>
          </svg>
        consigna: |
          Dibuja el sólido en perspectiva, con los tres ejes marcados y la escala
          en enteros. Señala la cara inclinada y las cinco planas.
        comprueba:
          - punto: |
              La base rectangular $\left[0,4\right]\times\left[0,2\right]$ sobre
              el plano $z=0$.
            porque: |
              Es el suelo del sólido y la proyección sobre $XY$. Los tres órdenes
              del apartado (b) se leen de ella.
          - punto: |
              El techo, el plano $z=5-2y$, inclinado **solo** en la dirección
              $y$.
            porque: |
              No depende de $x$, así que el plano es horizontal en esa dirección:
              el sólido tiene la misma sección en todo $x$. Dibujarlo inclinado
              en las dos direcciones lo convierte en otro cuerpo.
          - punto: |
              Las alturas del techo: $5$ sobre el borde $y=0$ y $1$ sobre el
              borde $y=2$.
            porque: |
              Son los dos números que fijan la inclinación, y demuestran que
              $5-2y$ no se anula dentro del recinto: el sólido es un prisma
              completo, no una cuña.
          - punto: |
              Que el sólido es un **prisma de base trapecial** tumbado, con el
              trapecio en el plano $YZ$.
            porque: |
              Reconocer la forma da el volumen sin integrar: área del trapecio
              $\tfrac{5+1}{2}\cdot2=6$, por la longitud $4$, igual a $24$.
        veredicto: |
          Que el techo no dependa de $x$ es lo que hace que los tres órdenes del
          apartado (b) tengan la misma dificultad. Verlo en el dibujo evita
          elegir el orden a ciegas.

    resolucion: |
      **a) El sólido.** Una caja de base $4\times 2$ en el plano $XY$, con suelo
      en $z=0$ y **tapa inclinada** $z=5-2y$. Como la tapa baja de 5 (en $y=0$)
      a 1 (en $y=2$) y nunca cruza el suelo, el sólido es un prisma de sección
      trapecial tumbado en la dirección $x$.

      **b) Los tres órdenes.** El de $x$ es siempre libre, porque ninguna
      condición liga la $x$ a las demás.

      $$
      \int_{0}^{2}\!\!\int_{0}^{4}\!\!\int_{0}^{5-2y} dz\,dx\,dy
      $$

      $$
      \int_{0}^{5}\!\!\int_{0}^{4}\!\!\int_{0}^{\min(2,\,(5-z)/2)} dy\,dx\,dz
      $$

      que **hay que partir en $z=1$**, porque por debajo de esa altura la $y$
      recorre el intervalo entero:

      $$
      \int_{0}^{1}\!\!\int_{0}^{4}\!\!\int_{0}^{2} dy\,dx\,dz
      \;+\;
      \int_{1}^{5}\!\!\int_{0}^{4}\!\!\int_{0}^{(5-z)/2} dy\,dx\,dz
      $$

      Y el tercero, $dx\,dy\,dz$, con la misma partición en $z=1$ y la $x$ de 0
      a 4 en los dos trozos.

      **c) El volumen**, por el primero, que es el cómodo:

      $$
      V = 4\int_{0}^{2}(5-2y)\,dy = 4(10-4) = 24
      $$

      > **La lección del ejercicio** está en el apartado b): un orden lleva a una
      > integral y otro obliga a **partir el sólido en dos**. Elegir bien no es
      > estética, es la diferencia entre una integral y tres.

  - id: centro-de-gravedad-elipse
    titulo: El centro de gravedad de un cuarto de elipse
    fuente: >-
      Ejercicio 7.20 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU
      (2017/2018 4E) · Su hoja de soluciones tiene una errata en este
      ejercicio: da las dos coordenadas iguales a 8/(3π) y solo la primera lo
      es. Ver la nota al final de la resolución. Lo dice desde el 13 de
      septiembre de 2026: hasta entonces la errata solo estaba explicada en el
      desarrollo, mientras su gemelo de examen —el ejercicio 2 de la cuarta
      evaluación de 2017-2018, que es el mismo problema— sí la declaraba aquí
      arriba.
    nivel: practica
    enunciado: |
      Sea $D$ el recinto delimitado por las condiciones
      $\dfrac{x^{2}}{4}+y^{2}\le 1$, $x\ge 0$ e $y\ge 0$. Calcular las
      coordenadas del centro de gravedad del recinto $D$, suponiendo que la
      densidad en cada punto es $k$.
    pide: Las coordenadas del centro de gravedad.
    pasos:
      - tipo: reconocer
        pregunta: |
          El recinto es un cuarto de elipse de semiejes 2 y 1. ¿Qué cambio de
          variable lo convierte en algo cómodo?
        opciones:
          - texto: Polares generalizadas, con x = 2ρcosθ e y = ρsenθ
            correcta: true
            mensaje: |
              Sí. Con los semiejes metidos en el cambio, la elipse pasa a ser
              $\rho\le 1$, y el jacobiano es $J = ab\rho = 2\rho$.
          - texto: Polares normales, con x = ρcosθ e y = ρsenθ
            mensaje: |
              Las normales convierten circunferencias en rectas, no elipses. Aquí
              dejarían la condición como
              $\rho^{2}(\cos^{2}\theta/4 + \text{sen}^{2}\theta)\le 1$, que no
              simplifica nada.
          - texto: Ninguno; se hace mejor en cartesianas
            mensaje: |
              En cartesianas el límite en $y$ es $\sqrt{1-x^{2}/4}$, con raíz. Se
              puede, pero los momentos salen mucho más largos.
      - tipo: calcular
        titulo: La masa del recinto
        pregunta: |
          El área de un cuarto de elipse de semiejes 2 y 1 es $\pi ab/4$. Con
          densidad constante $k$, ¿cuánto vale la masa dividida entre $k$?
        respuesta:
          tipo: numero
          valor: '1.5708'
          tolerancia: 0.01
          formato: en forma exacta (pi/2) o con cuatro decimales
        distractores:
          - valor: '6.2832'
            mensaje: |
              Eso es $2\pi$, el área de la elipse **entera** ($\pi ab$ con $a=2$,
              $b=1$) multiplicada por... no: $\pi ab = 2\pi$ es la elipse entera.
              El enunciado pide solo un cuarto.
          - valor: '3.1416'
            mensaje: |
              $\pi$ sería la mitad de la elipse. El recinto tiene además $x\ge 0$
              **e** $y\ge 0$, así que es un cuarto.
        pista: |
          $\pi ab/4$ con a=2 y b=1. Eso es $2\pi/4$.
        desarrollo: |
          $$
          M = k\cdot \frac{\pi a b}{4} = k\cdot\frac{\pi\cdot 2\cdot 1}{4}
          = \frac{\pi k}{2}
          $$

          Dividido entre $k$, $\pi/2 \approx 1{,}571$.
      - tipo: justificar
        pregunta: |
          Ordena el planteamiento. Una pieza es falsa.
        piezas:
          - texto: 'Con $x=2\rho\cos\theta$, $y=\rho\,\text{sen}\,\theta$, el recinto es $\rho\in[0,1]$, $\theta\in[0,\pi/2]$.'
          - texto: 'El jacobiano de las polares generalizadas es $J = ab\rho = 2\rho$.'
          - texto: 'La masa es $M = k\iint 2\rho\,d\rho\,d\theta = k\pi/2$.'
          - texto: 'Y $\overline{x} = \frac{1}{M}\iint x\,k\,dA$, con $x = 2\rho\cos\theta$ dentro.'
          - texto: 'Como la densidad es constante, por simetría el centro de gravedad está en el origen.'
            trampa: true
            mensaje: |
              El recinto es solo un **cuarto** de elipse, en el primer cuadrante:
              no es simétrico respecto del origen. Si fuera la elipse entera, sí
              estaría en el centro; aquí el centro de gravedad cae dentro del
              cuarto, con las dos coordenadas positivas.
    resolucion: |
      **La densidad es constante**, así que $k$ se simplifica y el centro de
      gravedad es puramente geométrico — el **centroide**. Conviene decirlo,
      porque ahorra arrastrar la $k$ por todas las cuentas.

      **El cambio.** Polares generalizadas con $a=2$, $b=1$:

      $$
      x = 2\rho\cos\theta,
      \qquad
      y = \rho\,\text{sen}\,\theta,
      \qquad
      J = 2\rho
      $$

      El recinto pasa a ser $\rho\in[0,1]$, $\theta\in[0,\pi/2]$ — un rectángulo.

      **La masa:**

      $$
      M = k\int_{0}^{\pi/2}\!\!\int_{0}^{1} 2\rho\,d\rho\,d\theta
      = k\cdot 2\cdot\tfrac{1}{2}\cdot\tfrac{\pi}{2} = \frac{\pi k}{2}
      $$

      **El momento respecto de $YZ$:**

      $$
      \iint_D x\,k\,dA
      = k\int_{0}^{\pi/2}\!\!\int_{0}^{1} (2\rho\cos\theta)(2\rho)\,d\rho\,d\theta
      = 4k\int_{0}^{\pi/2}\!\!\cos\theta\,d\theta\int_{0}^{1}\!\rho^{2}d\rho
      = \frac{4k}{3}
      $$

      $$
      \overline{x} = \frac{4k/3}{\pi k/2} = \frac{8}{3\pi} \approx 0{,}849
      $$

      **Y el otro, con $y = \rho\,\text{sen}\,\theta$:**

      $$
      \iint_D y\,k\,dA
      = k\int_{0}^{\pi/2}\!\!\int_{0}^{1}(\rho\,\text{sen}\,\theta)(2\rho)\,d\rho\,d\theta
      = \frac{2k}{3}
      \qquad\Longrightarrow\qquad
      \overline{y} = \frac{4}{3\pi} \approx 0{,}424
      $$

      $$
      \boxed{\;G = \left(\frac{8}{3\pi},\ \frac{4}{3\pi}\right)\;}
      $$

      **La comprobación de sentido común**, que vale un punto de COMP4: el
      recinto ocupa $x\in[0,2]$ e $y\in[0,1]$, y el centro sale en
      $(0{,}85;\,0{,}42)$ — dentro, y algo por debajo del centro geométrico de
      la caja, que es donde tiene que estar porque la elipse se estrecha al
      subir. Y fíjate en que $\overline{x} = 2\overline{y}$: es la misma proporción que
      entre los semiejes, y no es casualidad.

      > ### Cuidado: la solución del boletín tiene una errata
      >
      > La hoja de soluciones de los problemas complementarios da, para este
      > ejercicio, **las dos coordenadas iguales a $8/(3\pi)$**. La primera lo
      > es; la segunda no.
      >
      > No es una opinión, y conviene poder comprobarlo uno mismo por tres
      > caminos independientes:
      >
      > 1. **La fórmula del centroide** de un cuarto de elipse de semiejes $a$ y
      >    $b$ es $\left(\frac{4a}{3\pi},\frac{4b}{3\pi}\right)$. Con $a=2$ y
      >    $b=1$ eso es $\left(\frac{8}{3\pi},\frac{4}{3\pi}\right)$.
      > 2. **El argumento de escala.** Un cuarto de círculo de radio 1 tiene su
      >    centro en $\left(\frac{4}{3\pi},\frac{4}{3\pi}\right)$. Esta elipse es
      >    ese cuarto de círculo **estirado al doble solo en $x$**, así que la
      >    primera coordenada se duplica y la segunda no se toca.
      > 3. **Las integrales de arriba**, que dan momentos $4/3$ y $2/3$: el
      >    doble uno del otro, no iguales.
      >
      > Si te sale $0{,}42$ y el boletín dice $0{,}85$, **el que está bien eres
      > tú**. Este proyecto existe en buena parte para eso: sin esta nota, ahí
      > hay una tarde perdida buscando un error que no existe.

  - id: cilindricas-o-esfericas
    titulo: El mismo sólido, en cilíndricas y en esféricas
    fuente: Ejercicio 7.23 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU (2016/2017 4E)
    nivel: practica
    enunciado: |
      Sea el sólido $S$ delimitado por las condiciones $x^{2}+y^{2}+z^{2}\le 4$,
      $x^{2}+y^{2}\le z^{2}$ y $z\ge 0$.

      a) Plantear el volumen de $S$ en coordenadas cilíndricas.
      b) Plantear el volumen de $S$ en coordenadas esféricas.
      c) Calcular el volumen de $S$ utilizando la integral planteada en (a) o
      en (b).
    pide: El volumen planteado de las dos formas, y calculado.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las tres condiciones describen un sólido. ¿Cuál es?
        opciones:
          - texto: Un cono de helado, la parte de la esfera dentro del cono superior
            correcta: true
            mensaje: |
              Eso es. La esfera de radio 2 recortada por el cono
              $z^{2} = x^{2}+y^{2}$, y con $z\ge 0$ solo la mitad de arriba.
              La forma exacta de un cucurucho con la bola encima.
          - texto: Una esfera entera de radio 2
            mensaje: |
              La esfera sola sería la primera condición. Las otras dos la
              recortan: el cono se queda con un huso y $z\ge 0$ con la mitad
              superior.
          - texto: Un cilindro de radio 2
            mensaje: |
              Un cilindro sería $x^{2}+y^{2}\le 4$, sin $z$. Aquí la primera
              condición lleva $z^{2}$, así que es una esfera.
      - tipo: calcular
        titulo: El ángulo del cono, en esféricas
        pregunta: |
          La condición $x^{2}+y^{2}\le z^{2}$ con $z\ge 0$ significa, en
          esféricas, que $\varphi$ va de 0 hasta un ángulo fijo. ¿Cuál, en
          grados?
        respuesta:
          tipo: numero
          valor: '45'
          tolerancia: 0.1
          formato: en grados
        distractores:
          - valor: '90'
            mensaje: |
              90° sería el plano $z=0$, o sea media esfera entera sin recortar.
              El cono $z^{2}=x^{2}+y^{2}$ abre justo a la mitad de eso.
          - valor: '30'
            mensaje: |
              30° saldría de un cono más estrecho. Con
              $z^{2}=x^{2}+y^{2}$ la tangente del ángulo vale 1, y eso es 45°.
        pista: |
          En el borde del cono, $z = \sqrt{x^2+y^2}$, así que la altura iguala al radio. ¿Qué ángulo tiene esa pendiente?
        desarrollo: |
          En el borde del cono la altura iguala a la distancia al eje, así que
          $\tan\varphi = 1$ y

          $$
          \varphi = \frac{\pi}{4} = 45°
          $$

          Los límites en esféricas quedan $r\in[0,2]$, $\varphi\in[0,\pi/4]$,
          $\theta\in[0,2\pi]$: **tres pares de números**, que es lo que se busca
          al elegir coordenadas.
      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Integrando, el volumen sale $\frac{8\pi}{3}\left(2-\sqrt{2}\right)$.
          ¿Cuánto vale?
        respuesta:
          tipo: numero
          valor: '4.9074'
          tolerancia: 0.02
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '33.51'
            mensaje: |
              $33{,}51$ es $32\pi/3$, el volumen de la **esfera entera** de radio
              2. El cono se queda con una fracción bastante menor.
          - valor: '16.755'
            mensaje: |
              Esa es la media esfera, $16\pi/3$. Falta recortar con el cono, que
              se lleva casi las dos terceras partes de lo que queda.
        pista: |
          $8\pi/3 \approx 8{,}378$, y $2-\sqrt{2}\approx 0{,}586$. Multiplica.
        desarrollo: |
          $$
          V = \int_{0}^{2\pi}\!\!\int_{0}^{\pi/4}\!\!\int_{0}^{2} r^{2}\text{sen}\,\varphi\;dr\,d\varphi\,d\theta
          = 2\pi\cdot\frac{8}{3}\cdot\bigl[-\cos\varphi\bigr]_{0}^{\pi/4}
          = \frac{16\pi}{3}\left(1-\frac{\sqrt2}{2}\right)
          $$

          que es $\dfrac{8\pi}{3}(2-\sqrt2) \approx 4{,}907$.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'a) En cilíndricas: $\rho$ de 0 a $\sqrt2$ dentro del cono, y $z$ del cono a la esfera.'
          - texto: 'b) En esféricas: $r\in[0,2]$, $\varphi\in[0,\pi/4]$, $\theta\in[0,2\pi]$, con jacobiano $r^{2}\text{sen}\,\varphi$.'
          - texto: 'c) Las dos integrales dan el mismo número, $\frac{8\pi}{3}(2-\sqrt2)$.'
          - texto: 'Las esféricas salen más cortas porque convierten el recinto en un bloque de límites constantes.'
          - texto: 'Como el sólido tiene un eje de simetría, las esféricas no valen y hay que usar cilíndricas.'
            trampa: true
            mensaje: |
              Tener eje de simetría es un argumento **a favor** de las
              cilíndricas, no en contra de las esféricas. Y aquí manda algo más
              fuerte: hay también simetría respecto de un punto —el centro de la
              esfera—, y por eso las esféricas son las que dejan todos los
              límites constantes.
    resolucion: |
      **El ejercicio existe para comparar los dos sistemas** sobre el mismo
      sólido, y el apartado c) deja elegir. Elegir bien es la mitad de la nota.

      **El sólido** es un cono de helado: la esfera de radio 2 recortada por el
      cono $z^{2}=x^{2}+y^{2}$, y con $z\ge 0$ solo la parte de arriba. El cono
      y la esfera se cortan donde $2\rho^{2}=4$, o sea $\rho=\sqrt2$.

      **a) En cilíndricas**, los límites de $z$ dependen de $\rho$, así que la
      integral es más incómoda:

      $$
      V = \int_{0}^{2\pi}\!\!\int_{0}^{\sqrt2}\!\!\int_{\rho}^{\sqrt{4-\rho^{2}}} \rho\;dz\,d\rho\,d\theta
      $$

      **b) En esféricas**, los tres límites son constantes:

      $$
      V = \int_{0}^{2\pi}\!\!\int_{0}^{\pi/4}\!\!\int_{0}^{2} r^{2}\text{sen}\,\varphi\;dr\,d\varphi\,d\theta
      $$

      **c) Calculando por la segunda**, que se separa en tres factores:

      $$
      V = 2\pi \cdot \frac{2^{3}}{3}\cdot\left(1-\frac{\sqrt2}{2}\right)
      = \frac{8\pi}{3}\left(2-\sqrt2\right) \approx 4{,}907
      $$

      > **Por qué las esféricas ganan aquí.** No es que las cilíndricas estén
      > mal: dan el mismo número. Es que en esféricas los tres límites son
      > números y la integral se parte en tres factores independientes; en
      > cilíndricas el límite superior de $z$ lleva una raíz que hay que
      > arrastrar. La regla de siempre en acción: **las coordenadas buenas son las
      > que convierten el recinto en un rectángulo.**

  - id: volumen-entre-dos-paraboloides
    titulo: El volumen encerrado entre dos paraboloides
    fuente: Ejercicio 7.25 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU (2019/2020 5E)
    nivel: practica
    enunciado: |
      Sea el sólido definido por las condiciones $x^{2}+4y^{2}\le z$ y
      $z\le 8-x^{2}-4y^{2}$. Dibujar el sólido y calcular su volumen.
    pide: El dibujo del sólido y su volumen.
    pasos:
      - tipo: reconocer
        pregunta: |
          El sólido está entre dos superficies. ¿Cómo se encuentra la sombra que
          proyecta sobre el plano $XY$?
        opciones:
          - texto: Igualando las dos superficies, para ver dónde se cortan
            correcta: true
            mensaje: |
              Sí. Donde las dos tapas se tocan está el borde del sólido, y su
              proyección es el recinto sobre el que hay que integrar.
          - texto: Poniendo z = 0 en las dos
            mensaje: |
              Eso da dónde cada superficie corta al suelo, que no es lo mismo.
              El sólido puede estar entero por encima del suelo, como aquí.
          - texto: Es siempre un círculo
            mensaje: |
              Aquí no lo es: los coeficientes de $x^{2}$ y de $y^{2}$ son
              distintos, así que sale una **elipse**. Y eso decide las
              coordenadas.
      - tipo: calcular
        titulo: Dónde se cortan las dos tapas
        pregunta: |
          Igualando $x^{2}+4y^{2} = 8-x^{2}-4y^{2}$, ¿a cuánto equivale
          $x^{2}+4y^{2}$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '8'
            mensaje: |
              8 es el término independiente. Al pasar todo a un lado quedan
              **dos** veces $x^{2}+4y^{2}$, así que hay que dividir entre 2.
          - valor: '2'
            mensaje: |
              Parece que has dividido 8 entre 4. La ecuación es
              $2(x^{2}+4y^{2}) = 8$, y de ahí sale 4.
        pista: |
          Pasa todo a la izquierda: $2(x^2+4y^2) = 8$.
        desarrollo: |
          $$
          x^{2}+4y^{2} = 8-x^{2}-4y^{2}
          \;\Longrightarrow\;
          2(x^{2}+4y^{2}) = 8
          \;\Longrightarrow\;
          x^{2}+4y^{2} = 4
          $$

          La sombra es la **elipse** $\frac{x^{2}}{4}+y^{2}=1$, de semiejes 2 y
          1. Y a esa altura, $z=4$.
      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Integrando, el volumen sale $8\pi$. ¿Cuánto vale con cuatro decimales?
        respuesta:
          tipo: numero
          valor: '25.1327'
          tolerancia: 0.02
          formato: en forma exacta (8pi) o con cuatro decimales
        distractores:
          - valor: '12.566'
            mensaje: |
              $4\pi$ es la mitad, y sale de usar el jacobiano de las polares
              normales —$\rho$— en vez del de las generalizadas, que es
              $ab\rho = 2\rho$. El factor que falta es exactamente el $a=2$ del
              cambio $x = 2\rho\cos\theta$.
          - valor: '50.265'
            mensaje: |
              $16\pi$ sale de integrar una altura constante $8$ en vez de la
              diferencia $8-8\rho^{2}$: eso es el volumen de un **cilindro**
              elíptico, no el del sólido entre las dos tapas. La altura solo
              vale 8 en el eje, y se va a cero en el borde.
        pista: |
          $8\pi$, con pi = 3,14159...
        desarrollo: |
          Con polares generalizadas $x=2\rho\cos\theta$, $y=\rho\,\text{sen}\,\theta$
          y jacobiano $2\rho$, la elipse pasa a ser $\rho\le 1$ y

          $$
          V = \int_{0}^{2\pi}\!\!\int_{0}^{1} \bigl(8-8\rho^{2}\bigr)\,2\rho\,d\rho\,d\theta
          = 2\pi\cdot 16\left(\tfrac{1}{2}-\tfrac{1}{4}\right) = 8\pi
          $$
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Las dos tapas se cortan donde $x^{2}+4y^{2}=4$, una elipse de semiejes 2 y 1.'
          - texto: 'El sólido está entre el paraboloide de abajo y el de arriba, sobre esa elipse.'
          - texto: 'La altura en cada punto es $\bigl(8-x^{2}-4y^{2}\bigr)-\bigl(x^{2}+4y^{2}\bigr) = 8-2(x^{2}+4y^{2})$.'
          - texto: 'Con polares generalizadas —jacobiano $2\rho$— la elipse pasa a ser $\rho\le 1$ y sale $V=8\pi$.'
          - texto: 'Como la sombra es una elipse, hay que integrar en cartesianas con raíces en los límites.'
            trampa: true
            mensaje: |
              Se puede, y es el camino largo. Justamente para eso están las
              polares **generalizadas**: meten los semiejes dentro del cambio y
              convierten la elipse en $\rho\le 1$, con límites constantes.
      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 416 201" role="img" width="416" height="201"
               aria-labelledby="f-dos-paraboloides-t f-dos-paraboloides-d">
            <title id="f-dos-paraboloides-t">El corte por el plano y=0 y la elipse de la proyección</title>
            <desc id="f-dos-paraboloides-d">A la izquierda, el corte por el plano y igual a cero: la parábola z igual a x al cuadrado abriendo hacia arriba desde el origen y, encima, la parábola z igual a ocho menos x al cuadrado abriendo hacia abajo desde z igual a ocho. Se cortan a la altura cuatro, en x igual a más y menos dos, y encierran una lente. A la derecha, la proyección: el interior de la elipse de semiejes dos en horizontal y uno en vertical.</desc>
            <style>
                .f-dos-paraboloides-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
                .f-dos-paraboloides-c { stroke: var(--d1); stroke-width: 2.8; fill: none; }
                .f-dos-paraboloides-c2 { stroke: var(--alt); stroke-width: 2.8; fill: none; }
                .f-dos-paraboloides-cp { stroke: var(--d1); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
                .f-dos-paraboloides-cp2 { stroke: var(--alt); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
                .f-dos-paraboloides-g { stroke: var(--faint); stroke-width: 1.1; fill: none; stroke-dasharray: 3 3; }
                .f-dos-paraboloides-fue { stroke: var(--faint); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
                .f-dos-paraboloides-f { fill: var(--live); fill-opacity: .12; stroke: none; }
                .f-dos-paraboloides-f2 { fill: var(--alt); fill-opacity: .12; stroke: none; }
                .f-dos-paraboloides-pt { fill: var(--live); }
                .f-dos-paraboloides-punta { fill: var(--live); stroke: none; }
                .f-dos-paraboloides-hueco { fill: var(--paper); stroke: var(--live); stroke-width: 2; }
                .f-dos-paraboloides-o { fill: var(--flag); }
                .f-dos-paraboloides-n { fill: var(--faint); font-size: 10px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
