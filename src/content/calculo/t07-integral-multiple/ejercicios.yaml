        consigna: |
          Dibuja el sólido en perspectiva y su proyección sobre $XY$. Marca la
          circunferencia donde el cono y el paraboloide se cortan.
        comprueba:
          - punto: |
              El cono $z=\sqrt{x^{2}+y^{2}}$ como **suelo**, abriendo hacia
              arriba desde el origen con pendiente $1$.
            porque: |
              La condición $x^{2}+y^{2}\le z^{2}$ con $z\ge0$ significa estar
              **dentro** del cono, o sea por encima de su superficie. Es lo que
              más se confunde.
          - punto: |
              El paraboloide $z=2-x^{2}-y^{2}$ como **techo**, con el vértice en
              $\left(0,0,2\right)$.
            porque: |
              Abre hacia abajo desde la altura $2$. Los dos se cortan, y entre
              ellos queda el sólido.
          - punto: |
              El corte en $r=1$, $z=1$.
            porque: |
              De $r=2-r^{2}$ sale $r=1$. Es la circunferencia que separa la parte
              cónica de la parabólica de la superficie, y decide los dos trozos
              del área.
          - punto: |
              La proyección sobre $XY$: el disco $x^{2}+y^{2}\le1$.
            porque: |
              Es el recinto de la doble, y con esa forma el cambio a cilíndricas
              es inmediato: $r$ de $0$ a $1$, $\theta$ de $0$ a $2\pi$.
        veredicto: |
          Es un sólido con forma de peonza: punta abajo, panza arriba. Y su
          superficie tiene **dos** trozos —el lateral cónico y la tapa
          parabólica—, que es lo que el apartado del área necesita separar.

    resolucion: |
      **El sólido** es la lente entre un cono que abre hacia arriba desde el
      origen y un paraboloide que abre hacia abajo desde $z=2$.

      **El borde.** En cilíndricas, cono $z=\rho$ y paraboloide $z=2-\rho^{2}$:

      $$
      \rho^{2}+\rho-2=0 \;\Longrightarrow\; \rho=1
      $$

      La sombra es el círculo unidad, y las dos superficies se tocan a altura
      $z=1$.

      **El volumen**, integrando la diferencia de alturas con jacobiano $\rho$:

      $$
      V = 2\pi\int_{0}^{1}\bigl(2-\rho^{2}-\rho\bigr)\rho\,d\rho
      = 2\pi\left(1-\tfrac14-\tfrac13\right) = \frac{5\pi}{6} \approx 2{,}618
      $$

      **El área de la superficie** son **dos** trozos, y ese es el detalle que
      se pierde:

      $$
      A = A_{\text{cono}} + A_{\text{paraboloide}}
      = \sqrt2\,\pi + \frac{\pi}{6}\bigl(5\sqrt5-1\bigr)
      $$

      > **Por qué el área es más difícil que el volumen.** El volumen se integra
      > sobre la sombra con la diferencia de alturas: una sola integral. El área
      > exige recorrer **cada superficie curva por separado**, con su propio
      > elemento $\sqrt{1+z_x^{2}+z_y^{2}}$. Enumerar los trozos antes de
      > integrar es lo que evita dejarse uno.

  - id: centro-de-gravedad-de-una-figura
    titulo: El centro de gravedad de una figura recortada
    fuente: Ejercicio 7.22 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU (2018/2019 5E)
    nivel: practica
    enunciado: |
      Calcular el centro de gravedad del dominio plano formado por el cuarto de
      corona circular del primer cuadrante comprendido entre los radios 1 y 2,
      es decir, el recinto $1\le x^{2}+y^{2}\le 4$ con $x\ge 0$ e $y\ge 0$. La
      densidad es constante.
    pide: Las coordenadas del centro de gravedad.
    pasos:
      - tipo: reconocer
        pregunta: |
          El recinto es simétrico respecto de la recta $y=x$. ¿Qué se deduce sin
          calcular nada?
        opciones:
          - texto: Que las dos coordenadas del centro de gravedad coinciden
            correcta: true
            mensaje: |
              Exacto, y eso ahorra media integral. Basta calcular una y decir
              que la otra vale lo mismo **por simetría** — y decirlo puntúa.
          - texto: Que el centro de gravedad está en el origen
            mensaje: |
              El origen ni siquiera pertenece al recinto: hay un agujero de
              radio 1. La simetría dice que está **sobre la recta** $y=x$, no
              dónde exactamente.
          - texto: Que las dos coordenadas son opuestas
            mensaje: |
              Serían opuestas con simetría respecto de $y=-x$. Aquí el eje de
              simetría es la bisectriz del primer cuadrante, así que coinciden.
      - tipo: calcular
        titulo: El área del recinto
        pregunta: |
          Es un cuarto de corona entre radios 1 y 2. ¿Cuánto vale su área?
        respuesta:
          tipo: numero
          valor: '2.3562'
          tolerancia: 0.02
          formato: en forma exacta (3pi/4) o con cuatro decimales
        distractores:
          - valor: '9.4248'
            mensaje: |
              $3\pi$ es la corona **entera**, sin quedarse con un cuarto. Hay
              que dividir entre 4.
          - valor: '3.1416'
            mensaje: |
              $\pi$ sería el cuarto de círculo de radio 2 sin restarle el
              agujero. El agujero se lleva $\pi/4$.
        pista: |
          Cuarto de círculo de radio 2 menos cuarto de radio 1: $(4\pi - \pi)/4$.
        desarrollo: |
          $$
          A = \frac{\pi\cdot 2^{2}}{4} - \frac{\pi\cdot 1^{2}}{4}
          = \frac{3\pi}{4} \approx 2{,}356
          $$
      - tipo: calcular
        titulo: La coordenada del centro
        pregunta: |
          El momento vale $\frac{7}{3}$, y el área $\frac{3\pi}{4}$. ¿Cuánto
          vale $\overline{x}$?
        respuesta:
          tipo: numero
          valor: '0.9905'
          tolerancia: 0.01
          formato: en forma exacta (28/9pi) o con cuatro decimales
        distractores:
          - valor: '2.3333'
            mensaje: |
              $7/3$ es el **momento**, no la coordenada. Falta dividir entre el
              área.
          - valor: '1.5'
            mensaje: |
              $1{,}5$ es el radio medio de la corona, y sería la respuesta si la
              masa estuviera repartida por igual en el radio. No lo está: hay
              más área lejos del centro, y aun así el centro cae más cerca
              porque el recinto se abre.
        pista: |
          $(7/3)$ dividido entre $(3\pi/4)$, que es $28/(9\pi)$.
        desarrollo: |
          $$
          \overline{x} = \frac{7/3}{3\pi/4} = \frac{28}{9\pi} \approx 0{,}9905
          $$

          Y por simetría $\overline{y}$ vale lo mismo.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'Por simetría respecto de $y=x$, se cumple $\overline{x}=\overline{y}$: basta una integral.'
          - texto: 'En polares el recinto es $\rho\in[1,2]$, $\theta\in[0,\pi/2]$, con jacobiano $\rho$.'
          - texto: 'El momento es $\iint x\,dA = \int\!\!\int \rho\cos\theta\cdot\rho\,d\rho\,d\theta = 7/3$.'
          - texto: 'Dividiendo entre el área $3\pi/4$ sale $\overline{x}=\overline{y}=28/(9\pi)\approx 0{,}99$.'
          - texto: 'El resultado tiene que caer dentro del recinto, y $0{,}99$ está entre 1 y 2, así que cuadra.'
            trampa: true
            mensaje: |
              $0{,}99$ **no** está entre 1 y 2 — está justo por debajo de 1. Y no
              pasa nada: el centro de gravedad de una figura cóncava puede caer
              **fuera** de ella, como en una herradura. Aquí el punto
              $(0{,}99;\,0{,}99)$ está a distancia $1{,}40$ del origen, o sea
              dentro de la corona; lo que falla es el razonamiento, no el número.
    resolucion: |
      **La simetría primero**, que ahorra media respuesta. El recinto es
      simétrico respecto de la bisectriz $y=x$, así que

      $$
      \overline{x} = \overline{y}
      $$

      y basta calcular una. **Decirlo justificado vale tanto como la integral
      que te ahorras.**

      **En polares** el recinto es un rectángulo: $\rho\in[1,2]$,
      $\theta\in[0,\pi/2]$.

      **El área:**

      $$
      A = \int_{0}^{\pi/2}\!\!\int_{1}^{2}\rho\,d\rho\,d\theta
      = \frac{\pi}{2}\cdot\frac{3}{2} = \frac{3\pi}{4}
      $$

      **El momento**, con $x = \rho\cos\theta$:

      $$
      \iint x\,dA = \int_{0}^{\pi/2}\!\!\cos\theta\,d\theta\int_{1}^{2}\rho^{2}d\rho
      = 1\cdot\frac{7}{3} = \frac{7}{3}
      $$

      **El centro:**

      $$
      \boxed{\;\overline{x} = \overline{y} = \frac{7/3}{3\pi/4} = \frac{28}{9\pi} \approx 0{,}99\;}
      $$

      > **El control de plausibilidad, con matiz.** El punto
      > $(0{,}99;\,0{,}99)$ está a distancia $\sqrt{2}\cdot 0{,}99 \approx 1{,}40$
      > del origen: entre 1 y 2, dentro de la corona. ✓ Pero cuidado con
      > generalizar: **el centro de gravedad de una figura cóncava puede caer
      > fuera de ella**. Comprobar que «está dentro» no es una demostración, es
      > un indicio.

  # ═══════════════════════════════════════════════════════════════════
  # Problemas complementarios del tema 7. Los que ya estaban —7.3, 7.6,
  # 7.19, 7.20, 7.22, 7.23 y 7.25— no se repiten aquí.
  # ═══════════════════════════════════════════════════════════════════

  - id: seis-dobles-sobre-rectangulos
    titulo: Seis dobles sobre rectángulos, y el orden que sí importa
    fuente: Ejercicio 7.1 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Representar gráficamente el recinto de integración y calcular:

      (a) $\displaystyle\int_0^2\!\!\int_0^1 (1+x+4y)\,dx\,dy$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (d) $\displaystyle\int_0^1\!\!\int_{-1}^1 (2x^{3}+4y^{3})\,dy\,dx$

      (b) $\displaystyle\int_0^2\!\!\int_0^1 (1+x+4y)\,dy\,dx$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (e) $\displaystyle\int_0^1\!\!\int_0^1 e^{x+y}\,dx\,dy$

      (c) $\displaystyle\int_0^1\!\!\int_{-1}^1 (2x^{3}+4y^{3})\,dx\,dy$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (f) $\displaystyle\int_0^{\pi/2}\!\!\int_0^{\pi/4}
      \operatorname{sen} x\cos x\,dx\,dy$
    pide: El valor de las seis integrales.
    pasos:
      - tipo: reconocer
        pregunta: |
          En $\displaystyle\int_0^2\!\!\int_0^1 f\,dx\,dy$, ¿qué variable
          recorre el intervalo $[0,1]$?
        opciones:
          - texto: >-
              La $x$, porque los diferenciales se leen **de dentro afuera** y
              el de dentro es $dx$
            correcta: true
            mensaje: |
              Eso es. La integral pegada al integrando va con el diferencial
              pegado al integrando, y el orden de los signos $\int$ es el
              inverso del de los diferenciales.
          - texto: >-
              La $y$, porque el $\int_0^1$ está escrito el segundo
            mensaje: |
              El segundo signo $\int$ es el de **dentro**, y el de dentro va
              con el diferencial de dentro, que aquí es $dx$. Los signos y los
              diferenciales se emparejan de fuera hacia dentro y de dentro
              hacia fuera, no en el mismo sentido.
          - texto: >-
              Da igual, porque los límites son constantes
            mensaje: |
              Que sean constantes permite **intercambiar el orden**, pero no
              permite intercambiar los límites: los apartados (a) y (b) tienen
              los mismos números y las mismas letras, y no dan lo mismo.

      - tipo: calcular
        titulo: El apartado (a)
        pregunta: |
          $\displaystyle\int_0^2\!\!\int_0^1 (1+x+4y)\,dx\,dy$
        respuesta:
          tipo: numero
          valor: '11'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '8'
            mensaje: |
              Ese es el apartado (b), el que tiene la $x$ recorriendo $[0,2]$.
              Aquí es la $y$ la que llega hasta $2$, y como el integrando lleva
              $4y$ y solo $x$, pesa mucho más.
          - valor: '9'
            mensaje: |
              Te has dejado el $1$ del integrando. Su aportación es el área del
              rectángulo, $2$, y sin ella salen $9$ en vez de $11$.
        pista: |
          Integra primero en $x$ de $0$ a $1$, tratando $y$ como constante:
          queda $1+\tfrac12+4y$.
        desarrollo: |
          $$
          \int_0^1 (1+x+4y)\,dx = 1+\frac12+4y = \frac32+4y
          $$

          $$
          \int_0^2\left(\frac32+4y\right)dy = 3 + 8 = 11
          $$

      - tipo: calcular
        titulo: El apartado (b)
        pregunta: |
          $\displaystyle\int_0^2\!\!\int_0^1 (1+x+4y)\,dy\,dx$
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '11'
            mensaje: |
              Ese es el apartado (a). Aquí quien recorre $[0,2]$ es la $x$, y
              el integrando la lleva con coeficiente $1$, no $4$.
          - valor: '6'
            mensaje: |
              Te has dejado el $1$ del integrando, que vale el área del
              rectángulo: $2$.
        pista: |
          Ahora la de dentro es en $y$, de $0$ a $1$: queda $1+x+2$.
        desarrollo: |
          $$
          \int_0^1 (1+x+4y)\,dy = 1+x+2 = 3+x
          $$

          $$
          \int_0^2 (3+x)\,dx = 6+2 = 8
          $$

      - tipo: calcular
        titulo: El apartado (f)
        pregunta: |
          $\displaystyle\int_0^{\pi/2}\!\!\int_0^{\pi/4}
          \operatorname{sen} x\cos x\,dx\,dy$
        respuesta:
          tipo: numero
          valor: '0.3927'
          tolerancia: 0.002
          formato: en forma exacta (pi/8) o con cuatro decimales
        distractores:
          - valor: '0.25'
            mensaje: |
              Ese es el valor de la integral de dentro. Falta multiplicarlo por
              la longitud del intervalo de $y$, que es $\pi/2$ — el integrando
              no depende de $y$, así que la de fuera es solo eso.
          - valor: '0.7854'
            mensaje: |
              $\pi/4$ es el doble. La primitiva de
              $\operatorname{sen} x\cos x$ es
              $\tfrac{\operatorname{sen}^{2}x}{2}$, no
              $\operatorname{sen}^{2}x$.
        pista: |
          $\operatorname{sen} x\cos x$ no lleva $y$, así que la integral de
          fuera solo multiplica por $\pi/2$.
        desarrollo: |
          $$
          \int_0^{\pi/4}\operatorname{sen} x\cos x\,dx
          = \left[\frac{\operatorname{sen}^{2}x}{2}\right]_0^{\pi/4}
          = \frac{1}{4}
          $$

          $$
          \int_0^{\pi/2}\frac{1}{4}\,dy = \frac{\pi}{8} \approx 0{,}3927
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Los signos $\int$ y los diferenciales se emparejan al revés: el
              $\int$ más interno va con el diferencial más interno.
          - texto: >-
              Por eso (a) y (b) son integrales **distintas** aunque tengan el
              mismo integrando y los mismos números: en (a) la $y$ llega a $2$
              y en (b) la que llega a $2$ es la $x$.
          - texto: >-
              En (c) y (d) pasa lo mismo, y además cada una anula un sumando
              distinto, porque $[-1,1]$ es simétrico y $x^{3}$ e $y^{3}$ son
              impares.
          - texto: >-
              Y como los cuatro recintos son rectángulos, el teorema de Fubini
              garantiza que (a) y (b) valen lo mismo.
            trampa: true
            mensaje: |
              Fubini dice que se puede **intercambiar el orden de integración
              sobre el mismo recinto**, no que dos recintos distintos den lo
              mismo. El de (a) es $[0,1]\times[0,2]$ en $(x,y)$ y el de (b) es
              $[0,2]\times[0,1]$: son rectángulos distintos, y por eso $11$ y
              $8$.
        veredicto: |
          Este ejercicio parece una lista de cuentas y en realidad es una
          trampa de notación. **El orden de los diferenciales decide qué
          variable recorre qué intervalo**, y equivocarse ahí cambia el
          resultado sin que ninguna cuenta salga mal.
      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 540 350" role="img" width="540" height="350"
               aria-labelledby="f-seis-rectangulos-t f-seis-rectangulos-d">
            <title id="f-seis-rectangulos-t">Los seis recintos, todos rectángulos, y los dos pares que comparten recinto</title>
            <desc id="f-seis-rectangulos-d">Seis dibujos independientes, todos rectángulos. Los apartados a y b comparten el mismo recinto, de cero a uno en x y de cero a dos en y: cambia el orden de integración, no la región. Los apartados c y d comparten otro, de menos uno a uno en x y de cero a uno en y. El e es el cuadrado unidad. Y el f va de cero a pi cuartos en x y de cero a pi medios en y.</desc>
