        consigna: |
          Dibuja el sólido en perspectiva y, aparte, la proyección sobre el plano
          $XY$. Esa proyección es la clave del ejercicio.
        comprueba:
          - punto: |
              La esfera de radio $2$ centrada en el origen.
            porque: |
              $x^{2}+y^{2}+z^{2}\le4$ da radio $2$, no $4$. La raíz es el primer
              sitio donde se falla.
          - punto: |
              El cilindro $x^{2}+y^{2}\le2x$, que en $XY$ es la circunferencia de
              centro $\left(1,0\right)$ y **radio $1$**.
            porque: |
              Completando cuadrados, $\left(x-1\right)^{2}+y^{2}\le1$. Está
              descentrado y pasa por el origen: no es un cilindro alrededor del
              eje $OZ$.
          - punto: |
              Que el cilindro es **tangente interiormente** a la esfera en
              $\left(2,0,0\right)$ y pasa por el eje $OZ$ en el origen.
            porque: |
              Es lo que hace que el sólido tenga forma de gajo y no de anillo. Y
              explica que en polares el radio vaya de $0$ a $2\cos\theta$.
          - punto: |
              En la proyección, el disco pequeño con el origen **en su borde**.
            porque: |
              Por eso el ángulo polar recorre solo
              $\left(-\tfrac\pi2,\tfrac\pi2\right)$: fuera de ahí,
              $2\cos\theta$ es negativo y no hay recinto.
        veredicto: |
          La proyección descentrada es todo el ejercicio: convierte una triple en
          polares con límite variable $r\le2\cos\theta$. Es el sólido de Viviani
          en su versión con esfera.

    resolucion: |
      **Datos.** Esfera $x^{2}+y^{2}+z^{2}\le4$ y cilindro
      $x^{2}+y^{2}\le2x$, que es $(x-1)^{2}+y^{2}\le1$.

      ### 1 · Quién pone qué

      | superficie | papel |
      |---|---|
      | cilindro (no lleva $z$) | el contorno, $\rho\le2\cos\theta$ |
      | esfera | la tapa y el suelo, $z=\pm\sqrt{4-\rho^{2}}$ |

      ### 2 · La integral

      $$
      V = \int_{-\pi/2}^{\pi/2}\!\!\int_0^{2\cos\theta}
      2\sqrt{4-\rho^{2}}\;\rho\,d\rho\,d\theta
      $$

      La radial es inmediata:

      $$
      \int_0^{2\cos\theta}2\sqrt{4-\rho^{2}}\,\rho\,d\rho
      = \frac{16}{3}\left(1-\left|\operatorname{sen}\theta\right|^{3}\right)
      $$

      $$
      V = \frac{16}{3}\left(\pi - \frac43\right)
      $$

      $$
      \boxed{\ V = \frac{48\pi-64}{9} \approx 9{,}64\ }
      $$

      ### 3 · La comprobación de tamaño

      $$
      \frac{V}{\tfrac{32\pi}{3}} = \frac{48\pi-64}{9}\cdot\frac{3}{32\pi}
      \approx 0{,}29
      $$

      Un $29\%$ de la bola. Creíble: el cilindro tiene la mitad del radio y
      muerde por un solo lado.

      **Lo que hay que llevarse.** Es la bóveda de Viviani otra vez, y la
      regla que la resuelve es siempre la misma: **la superficie que no lleva
      $z$ en su ecuación pone el contorno; la que sí, la tapa.** Con eso, la
      integral se monta sin pensar.

  - id: el-paraboloide-eliptico-tumbado
    titulo: Un paraboloide elíptico tumbado, y el área que solo hay que plantear
    fuente: Ejercicio 7.27 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU (2021/2022 4E)
    nivel: practica
    enunciado: |
      Sea el sólido $S$ definido por las condiciones
      $\dfrac{y^{2}}{9}+\dfrac{z^{2}}{3}\le x$, $x\le3$.

      (a) Dibujar el sólido $S$.

      (b) Calcular el volumen de $S$.

      (c) Plantear (poniendo los límites de integración), sin calcular, el área
      de la superficie de $S$.
    pide: El dibujo, el volumen y el planteamiento del área.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la sección del sólido por un plano $x=$ constante?
        opciones:
          - texto: >-
              Una elipse de semiejes $3\sqrt{x}$ y $\sqrt{3}\sqrt{x}$, cuya
              área crece **linealmente** con $x$
            correcta: true
            mensaje: |
              Eso es. $\tfrac{y^{2}}{9x}+\tfrac{z^{2}}{3x}\le1$, y el área es
              $\pi\cdot3\sqrt{x}\cdot\sqrt{3x}=3\sqrt3\,\pi x$.
          - texto: >-
              Una circunferencia de radio $\sqrt{x}$
            mensaje: |
              Los dos denominadores son distintos, $9$ y $3$: la sección es una
              elipse, no una circunferencia.
          - texto: >-
              Una parábola
            mensaje: |
              La parábola sale al cortar por un plano que **contenga** el eje
              $x$. Perpendicularmente al eje, la sección es cerrada.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen de $S$?
        respuesta:
          tipo: numero
          valor: '73.4589'
          tolerancia: 0.03
          formato: en forma exacta (27sqrt(3)pi/2) o con cuatro decimales
        distractores:
          - valor: '146.9178'
            mensaje: |
              El doble: eso es el **cilindro** que tiene por base la elipse
              final y por altura $3$. Como el área de la sección crece
              linealmente, el paraboloide es la mitad.
          - valor: '48.9757'
            mensaje: |
              $9\sqrt3\,\pi$ es el **área** de la tapa plana en $x=3$, no el
              volumen.
        pista: |
          $V=\displaystyle\int_0^{3} 3\sqrt3\,\pi\,x\,dx$ — la misma cuenta del
          ejercicio 16 del boletín básico.
        desarrollo: |
          $$
          V = \int_0^{3} 3\sqrt3\,\pi\,x\;dx
          = 3\sqrt3\,\pi\cdot\frac92
          = \frac{27\sqrt3\,\pi}{2} \approx 73{,}4589
          $$

      - tipo: calcular
        titulo: El jacobiano del cambio que endereza la tapa
        pregunta: |
          La tapa plana es la elipse $\tfrac{y^{2}}{27}+\tfrac{z^{2}}{9}\le1$.
          Con polares generalizadas $y=3\sqrt3\,\rho\cos\theta$,
          $z=3\rho\operatorname{sen}\theta$, ¿cuánto vale el jacobiano en
          $\rho=1$?
        respuesta:
          tipo: numero
          valor: '15.5885'
          tolerancia: 0.01
          formato: en forma exacta (9sqrt(3)) o con cuatro decimales
        distractores:
          - valor: '9'
            mensaje: |
              Has multiplicado mal los semiejes: son $3\sqrt3$ y $3$, y su
              producto es $9\sqrt3$, no $9$.
          - valor: '5.1962'
            mensaje: |
              $3\sqrt3$ es solo uno de los dos semiejes. El jacobiano de las
              polares generalizadas es el producto de los dos, por $\rho$.
        pista: |
          Para $y=a\rho\cos\theta$, $z=b\rho\operatorname{sen}\theta$ el
          jacobiano es $ab\,\rho$, y aquí $a=3\sqrt3$, $b=3$.
        desarrollo: |
          $$
          J = ab\,\rho = 3\sqrt3\cdot 3\cdot\rho = 9\sqrt3\,\rho
          $$

          En $\rho=1$: $9\sqrt3\approx15{,}5885$. Y con eso el área de la tapa
          sale sin integrar apenas:
          $\int_0^{2\pi}\!\int_0^{1} 9\sqrt3\rho\,d\rho\,d\theta = 9\sqrt3\pi$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La sección en $x$ es una elipse de área $3\sqrt3\,\pi x$, lineal
              en $x$, así que el volumen es la mitad del cilindro.
          - texto: >-
              La superficie de $S$ tiene **dos** caras: el paraboloide y la
              tapa plana en $x=3$.
          - texto: >-
              Sobre el paraboloide, $x=\tfrac{y^{2}}{9}+\tfrac{z^{2}}{3}$, el
              factor de área es
              $\sqrt{1+\tfrac{4y^{2}}{81}+\tfrac{4z^{2}}{9}}$.
          - texto: >-
              Y como el enunciado solo pide plantear el área, los límites
              pueden dejarse indicados sin concretar.
            trampa: true
            mensaje: |
              «Plantear (poniendo los límites de integración)» es
              exactamente lo contrario: los límites **son** la respuesta. Lo
              que no hay que hacer es la primitiva.
        veredicto: |
          Este ejercicio es el 16 del boletín básico con números concretos y
          dos apartados más. Y el aviso de los enunciados que dicen
          «plantear»: la nota está en los límites.
      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 416 201" role="img" width="416" height="201"
               aria-labelledby="f-parab-tumbado-t f-parab-tumbado-d">
            <title id="f-parab-tumbado-t">El paraboloide elíptico tumbado sobre el eje x, y sus secciones elípticas</title>
            <desc id="f-parab-tumbado-d">A la izquierda, el corte por el plano z igual a cero: la parábola x igual a y al cuadrado, tumbada y abierta hacia la derecha desde el origen, cerrada por la vertical en x igual a cuatro. A la derecha, las secciones perpendiculares al eje x: elipses cada vez más grandes, dibujadas para x igual a uno, dos y cuatro, con la proporción entre semiejes constante.</desc>
