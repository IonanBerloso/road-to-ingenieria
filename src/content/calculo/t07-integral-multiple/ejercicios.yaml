        consigna: |
          Dibuja el sólido en perspectiva y, aparte, su corte por el plano $XZ$.
          Marca la circunferencia donde se cortan las dos superficies.
        comprueba:
          - punto: |
              El paraboloide $z=x^{2}+y^{2}$ como **cuenco**, abriendo hacia
              arriba desde el origen.
            porque: |
              La condición $x^{2}+y^{2}\le z$ es estar por encima de él. Es el
              fondo del sólido.
          - punto: |
              La esfera de radio $\sqrt6\approx2{,}45$ centrada en el origen,
              como **tapa**.
            porque: |
              Solo su casquete superior forma parte de la superficie: la parte de
              abajo queda dentro del paraboloide y no cuenta.
          - punto: |
              El corte en $z=2$, en la circunferencia de radio $\sqrt2$.
            porque: |
              De $z+z^{2}=6$ sale $z=2$ —la otra raíz, $-3$, no vale—. Es el
              borde común de las dos piezas de superficie.
          - punto: |
              La proyección sobre $XY$: el disco de radio $\sqrt2$.
            porque: |
              Es el recinto de las dos integrales de área, la del cuenco y la de
              la tapa. Las dos se plantean sobre el mismo disco.
        veredicto: |
          La superficie tiene **dos** piezas y hay que sumarlas: el trozo de
          paraboloide de abajo y el casquete esférico de arriba. Dibujar el corte
          por $XZ$ es lo que impide olvidar una de las dos.

    resolucion: |
      **Datos.** Sólido entre el paraboloide $z=x^{2}+y^{2}$ (por debajo) y la
      esfera $x^{2}+y^{2}+z^{2}=6$ (por arriba).

      ### 1 · Dónde se cortan

      $$
      \rho^{2}=z, \quad \rho^{2}+z^{2}=6
      \;\Longrightarrow\;
      z^{2}+z-6 = 0
      \;\Longrightarrow\;
      z = 2 \;(\text{y } z=-3, \text{descartada})
      $$

      El empalme está en $z=2$, $\rho=\sqrt2$.

      ### 2 · El cuenco parabólico

      $$
      A_{\text{par}} = \int_0^{2\pi}\!\!\int_0^{\sqrt2}
      \sqrt{1+4\rho^{2}}\;\rho\,d\rho\,d\theta
      = 2\pi\cdot\frac{13}{6} \approx 13{,}61
      $$

      ### 3 · La tapa esférica

      El casquete por encima de $z=2$ en una esfera de radio $\sqrt6$ tiene
      altura $h=\sqrt6-2$:

      $$
      A_{\text{esf}} = 2\pi\sqrt6\left(\sqrt6-2\right)
      = 2\pi\left(6-2\sqrt6\right) \approx 6{,}92
      $$

      ### 4 · El total

      $$
      \boxed{\ A = 2\pi\left(6-2\sqrt6\right) + 2\pi\cdot\frac{13}{6}
      \approx 20{,}53\ }
      $$

      ### 5 · La comprobación

      El disco de empalme tiene área $\pi\left(\sqrt2\right)^{2}=2\pi\approx
      6{,}28$. Las dos caras curvas tienen que medir **más** que su sombra:
      $13{,}61 > 6{,}28$ y $6{,}92 > 6{,}28$. Cuadra.

      **Lo que hay que llevarse.** Dos cosas. Que el área de un casquete
      esférico es $2\pi R h$ y **no hace falta integrarla** — ahorra cinco
      minutos en el examen. Y que «el área de la superficie» de un sólido
      formado por dos trozos son dos integrales, no una: dejarse una cara es
      el error más caro de este apartado.

  - id: dos-piezas-con-densidad-cuadratica
    titulo: Dos piezas del mismo material, y dos sistemas de coordenadas
    fuente: >-
      Ejercicio 7.18 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU.
      El boletín describe la pieza (a) con una figura; aquí se escribe con
      desigualdades.
    nivel: practica
    enunciado: |
      Las piezas que se describen están fabricadas con un material cuya
      densidad de masa en cada punto está dada por la función
      $f(x,y,z)=x^{2}+y^{2}+z^{2}$. Calcular la masa de cada pieza.

      (a) El límite exterior es el cilindro $x^{2}+y^{2}=4$ y el interior el
      cono $z^{2}=x^{2}+y^{2}$: la pieza es el cilindro con los dos huecos
      cónicos vaciados, es decir $x^{2}+y^{2}\le4$ y $z^{2}\le x^{2}+y^{2}$.

      (b) Los límites son la esfera $x^{2}+y^{2}+z^{2}=1$ y los planos
      $x\ge0$, $y\ge0$, $z\le0$.
    pide: La masa de cada una de las dos piezas.
    pasos:
      - tipo: reconocer
        pregunta: |
          Misma densidad, dos piezas. ¿Qué coordenadas convienen en cada una?
        opciones:
          - texto: >-
              Cilíndricas en (a), porque el cono y el cilindro son paredes
              verticales; esféricas en (b), porque el límite es una esfera
              centrada
            correcta: true
            mensaje: |
              Eso es. La densidad $x^{2}+y^{2}+z^{2}$ se escribe bien en las
              dos: $\rho^{2}+z^{2}$ en cilíndricas y $r^{2}$ en esféricas. Lo
              que decide es **el recinto**, no el integrando.
          - texto: >-
              Esféricas en las dos, porque la densidad es $r^{2}$
            mensaje: |
              La densidad sale más limpia en esféricas, sí, pero en (a) el
              recinto es un cilindro: en esféricas su límite exterior sería
              $r\le\tfrac{2}{\operatorname{sen}\varphi}$, que complica más de
              lo que la densidad simplifica.
          - texto: >-
              Cilíndricas en las dos
            mensaje: |
              En (b) el octante de esfera en cilíndricas obliga a
              $z$ entre $-\sqrt{1-\rho^{2}}$ y $0$: se puede, pero en esféricas
              las tres integrales se separan.

      - tipo: calcular
        titulo: La pieza (a)
        pregunta: |
          Con densidad $x^{2}+y^{2}+z^{2}$, ¿cuánto pesa el cilindro de radio
          $2$ con los dos conos vaciados?
        respuesta:
          tipo: numero
          valor: '107.2330'
          tolerancia: 0.05
          formato: en forma exacta (512pi/15) o con cuatro decimales
        distractores:
          - valor: '167.5516'
            mensaje: |
              Eso es el cilindro **macizo** de radio $2$ y altura $4$, sin
              vaciar los conos. Los huecos se llevan la parte central, que es
              donde la densidad es menor — por eso quitan menos de lo que
              parece.
          - valor: '53.6165'
            mensaje: |
              La mitad: has integrado solo $z\ge0$. La pieza es simétrica
              respecto del plano $z=0$ y tiene las dos mitades.
        pista: |
          La condición $z^{2}\le\rho^{2}$ es $-\rho\le z\le\rho$, así que para
          cada $\rho$ la altura disponible va de $-\rho$ a $\rho$.
        desarrollo: |
          $$
          M = \int_0^{2\pi}\!\!\int_0^{2}\!\!\int_{-\rho}^{\rho}
          \left(\rho^{2}+z^{2}\right)\rho\;dz\,d\rho\,d\theta
          $$

          $$
          = 2\pi\int_0^{2}\rho\left(2\rho^{3}+\frac{2\rho^{3}}{3}\right)d\rho
          = 2\pi\cdot\frac83\int_0^{2}\rho^{4}\,d\rho
          $$

          $$
          = 2\pi\cdot\frac83\cdot\frac{32}{5} = \frac{512\pi}{15}
          \approx 107{,}2330
          $$

      - tipo: calcular
        titulo: La pieza (b)
        pregunta: |
          ¿Cuánto pesa el octante de la bola unidad con
          $x\ge0$, $y\ge0$, $z\le0$?
        respuesta:
          tipo: numero
          valor: '0.31416'
          tolerancia: 0.0006
          formato: en forma exacta (pi/10) o con cinco decimales
        distractores:
          - valor: '2.51327'
            mensaje: |
              $\tfrac{4\pi}{5}$ es la bola **entera**. Tres planos dejan un
              octavo de ella.
          - valor: '0.62832'
            mensaje: |
              $\tfrac{\pi}{5}$ es un cuarto de bola. Los tres planos recortan
              un octavo, no un cuarto.
        pista: |
          En esféricas la densidad es $r^{2}$ y el jacobiano
          $r^{2}\operatorname{sen}\varphi$: dentro queda $r^{4}$, y las tres
          integrales se separan.
        desarrollo: |
          $$
          M = \frac18\int_0^{2\pi}\!\!\int_0^{\pi}\!\!\int_0^{1}
          r^{4}\operatorname{sen}\varphi\,dr\,d\varphi\,d\theta
          = \frac18\cdot 4\pi\cdot\frac15 = \frac{\pi}{10}
          $$

          $\tfrac{\pi}{10}\approx0{,}31416$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Lo que decide el sistema de coordenadas es el **recinto**: un
              cilindro con conos pide cilíndricas, una esfera centrada pide
              esféricas.
          - texto: >-
              En (a) la condición $z^{2}\le\rho^{2}$ deja
              $-\rho\le z\le\rho$, y la altura disponible crece con el radio.
          - texto: >-
              En (b) el integrando $r^{4}$ y los límites constantes hacen que
              la triple se separe en tres integrales simples.
          - texto: >-
              Y como en (a) la densidad crece con la distancia al origen, los
              huecos cónicos se llevan más de la mitad de la masa del cilindro.
            trampa: true
            mensaje: |
              Se llevan **menos** de lo que ocupan, justamente porque la
              densidad crece hacia fuera: los conos están pegados al eje, donde
              el material pesa poco. En números: el cilindro macizo pesa
              $167{,}55$ y la pieza $107{,}23$, o sea los huecos se llevan un
              $36\%$ de la masa — mientras que en volumen ocupan un tercio.
        veredicto: |
          Una densidad que crece con la distancia cambia las proporciones: la
          masa no se reparte como el volumen. Comparar los dos porcentajes es
          la comprobación de sentido de estos ejercicios.
    resolucion: |
      **Datos.** Densidad $f=x^{2}+y^{2}+z^{2}$ en las dos piezas.

      ### 1 · La pieza (a), en cilíndricas

      La condición $z^{2}\le x^{2}+y^{2}$ es $-\rho\le z\le\rho$: el cilindro
      de radio $2$ con dos conos vaciados por arriba y por abajo.

      $$
      M_a = \int_0^{2\pi}\!\!\int_0^{2}\!\!\int_{-\rho}^{\rho}
      \left(\rho^{2}+z^{2}\right)\rho\,dz\,d\rho\,d\theta
      = 2\pi\cdot\frac83\cdot\frac{32}{5}
      = \frac{512\pi}{15} \approx 107{,}23
      $$

      ### 2 · La pieza (b), en esféricas

      $$
      M_b = \frac18\int_0^{2\pi}\!\!\int_0^{\pi}\!\!\int_0^{1}
      r^{4}\operatorname{sen}\varphi\,dr\,d\varphi\,d\theta
      = \frac{\pi}{10} \approx 0{,}314
      $$

      ### 3 · La comprobación que enseña algo

      | | volumen | masa |
      |---|---|---|
      | cilindro macizo | $16\pi\approx50{,}3$ | $\tfrac{160\pi}{3}\approx167{,}6$ |
      | pieza (a) | $\tfrac{32\pi}{3}\approx33{,}5$ | $\tfrac{512\pi}{15}\approx107{,}2$ |
      | los huecos | $33\%$ | $36\%$ |

      Los conos ocupan un tercio del volumen y se llevan un $36\%$ de la masa.
      Que las dos cifras se parezcan pero no coincidan es lo esperable con una
      densidad que crece hacia fuera y unos huecos pegados al eje.

      **Lo que hay que llevarse.** El sistema de coordenadas lo elige **el
      recinto**, aunque el integrando pida otro. Y cuando hay densidad
      variable, comparar el porcentaje de masa con el de volumen es un
      contraste que cuesta una división y caza los errores de bulto.

  - id: el-cono-tapado-por-un-paraboloide
    titulo: Un cono con tapa de paraboloide, y una inercia que solo hay que plantear
    fuente: Ejercicio 7.21 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU (2018/2019 4E)
    nivel: practica
    enunciado: |
      Sea el sólido $S$ limitado por las condiciones $x^{2}+y^{2}\le z^{2}$,
      $z\le6-x^{2}-y^{2}$.

      (a) Dibujar el sólido y calcular su volumen.

      (b) Sabiendo que $f(x,y,z)=ky^{2}$ denota la densidad en cada punto,
      plantear el momento de inercia de $S$ respecto del eje $OZ$.
    pide: El volumen del sólido y el planteamiento del momento de inercia.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Dónde se cortan el cono y el paraboloide?
        opciones:
          - texto: >-
              En $\rho=2$, $z=2$, resolviendo $\rho = 6-\rho^{2}$
            correcta: true
            mensaje: |
              Eso es. Sobre el cono $z=\rho$, y sustituyendo en la tapa queda
              $\rho^{2}+\rho-6=0$, cuya raíz positiva es $2$.
          - texto: >-
              En $\rho=\sqrt6$, donde el paraboloide corta al suelo
            mensaje: |
              Ahí es donde el paraboloide llega a $z=0$, pero el sólido acaba
              antes: lo cierra el cono, que sube más deprisa.
          - texto: >-
              En $\rho=3$
            mensaje: |
              $\rho=-3$ es la otra raíz de $\rho^{2}+\rho-6=0$, y no vale: el
              radio polar no es negativo.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen de $S$?
        respuesta:
          tipo: numero
          valor: '33.5103'
          tolerancia: 0.02
          formato: en forma exacta (32pi/3) o con cuatro decimales
        distractores:
          - valor: '50.2655'
            mensaje: |
              $16\pi$ es lo que sale integrando la tapa desde $z=0$ en vez de
              desde el cono. El suelo del sólido no es el plano: es la
              superficie cónica.
          - valor: '16.7552'
            mensaje: |
              La mitad. Revisa el $2\pi$ de la integral en $\theta$ o el
              $\tfrac{16}{3}$ de la radial.
        pista: |
          Para cada $\rho\in[0,2]$, la $z$ va del cono $z=\rho$ a la tapa
          $z=6-\rho^{2}$.
        desarrollo: |
          $$
          V = \int_0^{2\pi}\!\!\int_0^{2}\!\!\int_{\rho}^{6-\rho^{2}}
          \rho\;dz\,d\rho\,d\theta
          = 2\pi\int_0^{2}\rho\left(6-\rho^{2}-\rho\right)d\rho
          $$

          $$
          = 2\pi\left[12-4-\frac83\right]
          = 2\pi\cdot\frac{16}{3} = \frac{32\pi}{3} \approx 33{,}5103
          $$

      - tipo: calcular
        titulo: El exponente que delata el planteamiento
        pregunta: |
          Al montar $I_{z}=\displaystyle\iiint_S ky^{2}\left(x^{2}+y^{2}\right)dV$
          en cilíndricas, ¿a qué potencia queda elevada $\rho$ dentro de la
          integral?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '4'
            mensaje: |
              Te falta el $\rho$ del jacobiano. La cuenta es
              $2+2+1$: dos de la densidad $y^{2}$, dos de la distancia al eje
              al cuadrado, y uno del diferencial.
          - valor: '3'
            mensaje: |
              Has contado solo la densidad y el jacobiano. Falta el
              $x^{2}+y^{2}=\rho^{2}$, que es el cuadrado de la distancia al eje
              $OZ$ y es lo que define un momento de inercia.
        pista: |
          $y^{2}=\rho^{2}\operatorname{sen}^{2}\theta$, la distancia al eje al
          cuadrado es $\rho^{2}$, y el jacobiano aporta otro $\rho$.
        desarrollo: |
          $$
          k y^{2}\left(x^{2}+y^{2}\right)\cdot\rho
          = k\rho^{2}\operatorname{sen}^{2}\theta\cdot\rho^{2}\cdot\rho
          = k\rho^{5}\operatorname{sen}^{2}\theta
          $$

          $$
          I_{z} = \int_0^{2\pi}\!\!\int_0^{2}\!\!\int_{\rho}^{6-\rho^{2}}
          k\rho^{5}\operatorname{sen}^{2}\theta \;dz\,d\rho\,d\theta
          $$

          Que es exactamente lo que pide el enunciado: plantearla, con los
          límites puestos.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El cono y el paraboloide se cortan donde $\rho=6-\rho^{2}$, o sea
              en $\rho=2$ y $z=2$.
          - texto: >-
              Entre $\rho=0$ y $\rho=2$, el sólido va del cono $z=\rho$ hasta
              la tapa $z=6-\rho^{2}$.
          - texto: >-
              El integrando del momento de inercia lleva la densidad por el
              cuadrado de la distancia al eje, y con el jacobiano queda
              $k\rho^{5}\operatorname{sen}^{2}\theta$.
          - texto: >-
              Y como la densidad $ky^{2}$ no es simétrica en $\theta$, la
              integral en $\theta$ no se puede separar del resto.
            trampa: true
            mensaje: |
              Sí se separa: el factor $\operatorname{sen}^{2}\theta$ depende
              solo de $\theta$ y los límites en $\rho$ y $z$ no dependen de
              $\theta$, así que
              $\int_0^{2\pi}\operatorname{sen}^{2}\theta\,d\theta=\pi$ sale
              fuera. Eso deja la inercia en $k\pi\int_0^{2}\rho^{5}
              \left(6-\rho^{2}-\rho\right)d\rho$, que vale
              $\tfrac{96k\pi}{7}$.
        veredicto: |
          Cuando el enunciado dice «plantear», la nota está en los **límites**
          y en el integrando completo, no en el resultado. Aun así conviene
          mirar si se separa: aquí la $\theta$ sale fuera y la integral que
          queda es de las fáciles.
      - tipo: dibujar
        figura: |
