            <g transform="translate(182 196)"><text class="f-cinco-recintos-l" x="2" y="-5" fill="var(--live)">(e) triángulo con π</text><path class="f-cinco-recintos-f" d="M34.7 120.3L139.4 120.3L87 58.5Z"/><path class="f-cinco-recintos-eje" d="M18 120.3L158 120.3M34.7 140L34.7 18"/><path class="f-cinco-recintos-eje" d="M139.4 116.8L139.4 123.8"/><path class="f-cinco-recintos-eje" d="M31.2 58.5L38.2 58.5"/><g class="f-cinco-recintos-n"><text x="139.4" y="135.3" text-anchor="middle">π/2</text><text x="27.7" y="62.1" text-anchor="end">π/4</text><text x="158" y="112.3" text-anchor="end">x</text><text x="40.7" y="28">y</text></g><path class="f-cinco-recintos-c" d="M34.7 120.3L139.4 120.3L87 58.5Z"/><circle class="f-cinco-recintos-o" cx="87" cy="58.5" r="3.4"/></g>
