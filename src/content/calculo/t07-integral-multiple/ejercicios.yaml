ejercicios:
  # ═══════════════════════════════════════════════════════════════════
  # Ejemplos introductorios del tema 7. Nuestros, no de examen ni del boletín.
  # ═══════════════════════════════════════════════════════════════════

  - id: ej-doble-sobre-rectangulo
    titulo: La primera integral doble, sobre un rectángulo
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Calcular $\displaystyle\int_{0}^{2}\!\!\int_{0}^{1} (x+y)\,dy\,dx$.
    pide: El valor de la integral doble.
    pasos:
      - tipo: reconocer
        pregunta: |
          En $\int_{0}^{2}\!\int_{0}^{1} (x+y)\,dy\,dx$, ¿cuál se integra primero
          y respecto de qué variable?
        opciones:
          - texto: La de dentro, respecto de y, entre 0 y 1
            correcta: true
            mensaje: |
              Eso es. Se lee de dentro hacia fuera, y el diferencial que está
              pegado a la función dice cuál es la variable: aquí $dy$.
          - texto: La de fuera, respecto de x, entre 0 y 2
            mensaje: |
              Al revés. La de fuera se hace la última, cuando ya no queda $y$.
              El orden lo marcan los diferenciales, de dentro hacia fuera.
          - texto: Da igual el orden, porque el recinto es un rectángulo
            mensaje: |
              El **resultado** sí da igual sobre un rectángulo con límites
              constantes, y eso es cierto. Pero el orden de ejecución lo fija la
              notación: primero $dy$, después $dx$.
      - tipo: calcular
        titulo: La integral de dentro
        pregunta: |
          ¿Cuánto vale $\int_{0}^{1}(x+y)\,dy$, tratando $x$ como constante?
          Escribe el resultado evaluado en $x=1$.
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.01
          formato: en forma exacta (3/2) o con un decimal
        distractores:
          - valor: '1'
            mensaje: |
              Te has dejado el término $1/2$ que viene de integrar la $y$. La
              primitiva es $xy + y^{2}/2$, y en $y=1$ vale $x + 1/2$.
          - valor: '2'
            mensaje: |
              Parece que has integrado la $x$ también. Con $dy$, la $x$ es
              constante: $\int x\,dy = xy$, no $x^{2}/2$.
        pista: |
          La primitiva respecto de y es $xy + y^{2}/2$. Evalúala en 1 y en 0, con x=1.
        desarrollo: |
          $$
          \int_{0}^{1}(x+y)\,dy = \Bigl[xy + \tfrac{y^{2}}{2}\Bigr]_{0}^{1}
          = x + \tfrac{1}{2}
          $$

          En $x=1$ eso vale $3/2$. Fíjate en que **el resultado todavía depende
          de $x$**: es lo normal, porque queda una integral por hacer.
      - tipo: calcular
        titulo: La integral de fuera
        pregunta: |
          ¿Cuánto vale $\int_{0}^{2}\left(x+\frac{1}{2}\right)dx$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Te has dejado el término $1/2$, que integrado entre 0 y 2 aporta 1.
              $\int_0^2 x\,dx = 2$, y hay que sumarle ese 1.
          - valor: '4.5'
            mensaje: |
              Parece que has usado $3/2$ como si fuera constante:
              $\int_0^2 (3/2)dx = 3$... pero además has sumado la $x$. El
              integrando es $x+1/2$, no $x+3/2$.
        pista: |
          $\int_0^2 x\,dx = 2$ y $\int_0^2 (1/2)dx = 1$.
        desarrollo: |
          $$
          \int_{0}^{2}\left(x+\tfrac{1}{2}\right)dx
          = \Bigl[\tfrac{x^{2}}{2} + \tfrac{x}{2}\Bigr]_{0}^{2}
          = 2 + 1 = 3
          $$
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: Se integra de dentro hacia fuera; primero respecto de $y$, con la $x$ congelada.
          - texto: 'Sale $x + 1/2$, que todavía depende de $x$: queda una integral.'
          - texto: Integrando eso entre 0 y 2 sale 3.
          - texto: 'Sobre un rectángulo con límites constantes, el otro orden daría lo mismo.'
          - texto: 'Como el resultado de la primera integral depende de $x$, hay un error de planteamiento.'
            trampa: true
            mensaje: |
              Es justo lo esperable. Después de integrar en $y$ la variable $y$
              desaparece, pero la $x$ sigue ahí hasta que se integra en el paso
              siguiente. Lo que sería un error es que quedara una $y$.
    resolucion: |
      **Una integral doble se hace por dentro.** No hay técnica nueva: son dos
      integrales de una variable, encadenadas.

      **Primera, en $y$**, con la $x$ como si fuera un número:

      $$
      \int_{0}^{1}(x+y)\,dy = \Bigl[xy + \tfrac{y^{2}}{2}\Bigr]_{0}^{1}
      = x + \tfrac{1}{2}
      $$

      **Segunda, en $x$**, ya sobre una función de una sola variable:

      $$
      \int_{0}^{2}\left(x+\tfrac{1}{2}\right)dx = 2 + 1 = 3
      $$

      **Por qué este caso es el fácil.** Los cuatro límites son números, así que
      el recinto es un rectángulo y el orden da igual. En cuanto el recinto deja
      de ser un rectángulo, los límites de dentro llevan la otra variable y el
      orden **sí** importa — que es de lo que va el resto del tema.

  - id: ej-recinto-y-limites
    titulo: Leer los límites de un recinto dibujado
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Sea $D$ el triángulo limitado por las rectas $y=0$, $x=2$ e $y=x$.
      Escribir $\iint_D f\,dA$ con el orden $dy\,dx$.
    pide: Los límites de integración en el orden dy dx.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con el orden $dy\,dx$, ¿qué representan los límites de la integral
          **interior**?
        opciones:
          - texto: Por dónde entra y por dónde sale una recta vertical fijada en un x
            correcta: true
            mensaje: |
              Exacto. Te quedas en un $x$, subes en vertical, y anotas la curva
              por la que entras y la curva por la que sales.
          - texto: El rango total de valores que toma y en toda la región
            mensaje: |
              Eso valdría solo si la región fuera un rectángulo. En general la
              altura de la región cambia con $x$, y por eso los límites de dentro
              dependen de $x$.
          - texto: Los valores extremos de x
            mensaje: |
              Esos son los límites de **fuera**. Los de dentro, con orden
              $dy\,dx$, van en $y$.
      - tipo: calcular
        titulo: El límite superior interior
        pregunta: |
          Fijado un $x$ entre 0 y 2, la vertical entra por $y=0$. ¿Por dónde
          sale, evaluado en $x=1{,}5$?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es el límite de la $x$, no la altura del triángulo en ese punto.
              La tapa superior es la recta $y=x$, así que en $x=1{,}5$ la altura
              es $1{,}5$.
          - valor: '0'
            mensaje: |
              Por $y=0$ es por donde **entra** la vertical, no por donde sale.
              Sale por la recta inclinada $y=x$.
        pista: |
          La tapa de arriba es la recta y=x. Sustituye x=1,5.
        desarrollo: |
          La región está entre $y=0$ (abajo) e $y=x$ (arriba), así que

          $$
          \int_{0}^{2}\!\!\int_{0}^{x} f(x,y)\,dy\,dx
          $$

          En $x=1{,}5$ la vertical va de $y=0$ a $y=1{,}5$.
      - tipo: justificar
        pregunta: |
          Ordena el planteamiento. Una pieza es falsa.
        piezas:
          - texto: 'El triángulo tiene vértices $(0,0)$, $(2,0)$ y $(2,2)$.'
          - texto: 'Con orden $dy\,dx$, fijas $x$ y subes: entras por $y=0$ y sales por $y=x$.'
          - texto: 'La vertical corta al triángulo para $x$ entre 0 y 2.'
          - texto: 'Luego la integral es $\int_{0}^{2}\int_{0}^{x} f\,dy\,dx$.'
          - texto: 'Con el otro orden saldría $\int_{0}^{x}\int_{0}^{2} f\,dx\,dy$.'
            trampa: true
            mensaje: |
              Ha quedado una $x$ en el límite **exterior**, y eso es imposible:
              el resultado no puede depender de una variable ya integrada. El
              orden correcto es $\int_{0}^{2}\int_{y}^{2} f\,dx\,dy$.
    resolucion: |
      **Dibujar primero.** El triángulo tiene vértices $(0,0)$, $(2,0)$ y
      $(2,2)$: la hipotenusa es la recta $y=x$ y el lado derecho es $x=2$.

      **La pregunta del orden $dy\,dx$:** me quedo en un $x$ y subo.

      - **Entro** por $y=0$, el eje horizontal.
      - **Salgo** por $y=x$, la hipotenusa.
      - Y eso pasa para $x$ entre $0$ y $2$.

      $$
      \iint_D f\,dA = \int_{0}^{2}\!\!\int_{0}^{x} f(x,y)\,dy\,dx
      $$

      **El control de siempre**: el límite interior lleva una $x$ — correcto,
      porque la altura del triángulo cambia con $x$. Los exteriores son números
      — correcto.

      > **Y con el otro orden, para practicar la vista:** fijas un $y$ y vas
      > hacia la derecha. Entras por la hipotenusa, $x=y$, y sales por $x=2$;
      > y eso pasa para $y$ entre 0 y 2. Sale
      > $\int_{0}^{2}\int_{y}^{2} f\,dx\,dy$. Mismo recinto, otra lectura.

  - id: ej-polares-primera
    titulo: La primera integral en polares, y el jacobiano
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Calcular el área del círculo de radio 3 centrado en el origen mediante una
      integral doble en coordenadas polares.
    pide: El área del círculo, calculada con la integral.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al cambiar a polares, ¿en qué se convierte el diferencial de área?
        opciones:
          - texto: En ρ·dρ·dθ, con el factor ρ del jacobiano
            correcta: true
            mensaje: |
              Sí, y ese $\rho$ no es decoración: dos trocitos con el mismo
              $d\rho$ y el mismo $d\theta$ tienen áreas distintas según lo lejos
              que estén del centro.
          - texto: En dρ·dθ, sin ningún factor extra
            mensaje: |
              Ese es el error número uno del tema. Sin el $\rho$, el área de este
              círculo saldría $6\pi$ — que es su **perímetro**, no su área.
          - texto: En ρ²·dρ·dθ
            mensaje: |
              El $\rho^{2}$ aparece en las esféricas, no en las polares. En el
              plano el factor es $\rho$ a la primera.
      - tipo: calcular
        titulo: La integral en el radio
        pregunta: |
          ¿Cuánto vale $\int_{0}^{3}\rho\,d\rho$?
        respuesta:
          tipo: numero
          valor: '4.5'
          tolerancia: 0.01
          formato: en forma exacta (9/2) o con un decimal
        distractores:
          - valor: '3'
            mensaje: |
              Eso sería $\int_0^3 d\rho$, sin el jacobiano. Con el $\rho$ la
              primitiva es $\rho^{2}/2$, que en 3 vale $9/2$.
          - valor: '9'
            mensaje: |
              9 es $3^{2}$. Falta dividir entre 2, que viene de la primitiva
              $\rho^{2}/2$.
        pista: |
          La primitiva de ρ es ρ²/2. Evalúala en 3.
        desarrollo: |
          $$
          \int_{0}^{3}\rho\,d\rho = \Bigl[\tfrac{\rho^{2}}{2}\Bigr]_{0}^{3}
          = \tfrac{9}{2}
          $$
      - tipo: calcular
        titulo: El área total
        pregunta: |
          Multiplicando por la integral en el ángulo, $\int_0^{2\pi}d\theta = 2\pi$,
          ¿cuánto vale el área?
        respuesta:
          tipo: numero
          valor: '28.274'
          tolerancia: 0.02
          formato: en forma exacta (9pi) o con tres decimales
        distractores:
          - valor: '18.85'
            mensaje: |
              Eso es $6\pi$, el **perímetro** de la circunferencia de radio 3.
              Sale justo cuando te dejas el jacobiano: es la señal de ese error.
          - valor: '14.137'
            mensaje: |
              Eso es $9\pi/2$: te has dejado el 2 del $2\pi$ del ángulo. La
              vuelta completa son $2\pi$ radianes, no $\pi$.
        pista: |
          $(9/2)\cdot 2\pi$. El 2 se cancela con el denominador.
        desarrollo: |
          $$
          A = \int_{0}^{2\pi}\!\!\int_{0}^{3}\rho\,d\rho\,d\theta
          = \frac{9}{2}\cdot 2\pi = 9\pi \approx 28{,}27
          $$

          Y coincide con $\pi R^{2} = \pi\cdot 9$. **Esa coincidencia es la
          comprobación**: si no cuadrara, el jacobiano estaría mal.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'En polares el círculo de radio 3 es el rectángulo $\rho\in[0,3]$, $\theta\in[0,2\pi]$.'
          - texto: 'El área es $\iint dA$, y en polares $dA = \rho\,d\rho\,d\theta$.'
          - texto: 'La integral se separa porque los límites son constantes y el integrando también.'
          - texto: 'Sale $(9/2)(2\pi) = 9\pi$, que coincide con $\pi R^{2}$.'
          - texto: 'Si se olvidara el jacobiano saldría $9\pi/2$, que es la mitad del área.'
            trampa: true
            mensaje: |
              Sin el jacobiano saldría $\int_0^{2\pi}\int_0^3 d\rho\,d\theta =
              3\cdot 2\pi = 6\pi$, que **no** es la mitad de $9\pi$: es el
              perímetro. Y esa es justo la pista que delata el error — sale una
              longitud donde debía salir un área.
    resolucion: |
      **En polares el círculo deja de tener forma.** Lo que en cartesianas exige
      límites con raíces, aquí son dos pares de números:

      $$
      \rho\in[0,3],
      \qquad
      \theta\in[0,2\pi]
      $$

      **El área**, sin olvidar el jacobiano:

      $$
      A = \int_{0}^{2\pi}\!\!\int_{0}^{3}\rho\,d\rho\,d\theta
      = \int_{0}^{2\pi}\Bigl[\tfrac{\rho^{2}}{2}\Bigr]_{0}^{3} d\theta
      = \int_{0}^{2\pi}\tfrac{9}{2}\,d\theta
      = 9\pi
      $$

      **La comprobación que hay que hacer siempre.** El área de un círculo de
      radio 3 es $\pi R^{2} = 9\pi$. ✓

      Y si el jacobiano se hubiera perdido:

      $$
      \int_{0}^{2\pi}\!\!\int_{0}^{3} d\rho\,d\theta = 3\cdot 2\pi = 6\pi
      $$

      que es la **longitud** de la circunferencia. Cuando una cuenta de áreas te
      devuelve algo que se parece a un perímetro, el jacobiano se ha quedado por
      el camino.

  - id: ej-area-de-un-plano-inclinado
    titulo: La primera área de una superficie, sin integrar nada
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Calcular el área del trozo del plano $z=2x+2y+1$ que queda justo encima
      del rectángulo $D=[0,2]\times[0,1]$ del plano $XY$.
    pide: El área de ese trozo de plano.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué el área de ese trozo de plano no es la del rectángulo?
        opciones:
          - texto: >-
              Porque el plano está inclinado, y un trozo inclinado abarca más
              que su sombra
            correcta: true
            mensaje: |
              Eso es. El rectángulo es la **sombra**, y la superficie que la
              proyecta es más grande. Cuánto más grande lo dice el factor
              $1/\cos\gamma$, que es exactamente la raíz de la fórmula.
          - texto: Porque un plano es infinito y el rectángulo no
            mensaje: |
              El plano entero sí es infinito, pero aquí no se pide el plano: se
              pide **el trozo que está encima de $D$**, que es acotado. Lo que
              hace que su área no sea $2$ es la inclinación, no el tamaño.
          - texto: >-
              Porque hay que sumarle el $1$ del término independiente
            mensaje: |
              El $1$ solo sube el plano sin inclinarlo, y subir una superficie
              no le cambia el área. Lo que decide son las **pendientes**, o sea
              las derivadas parciales.

      - tipo: calcular
        titulo: El factor de la raíz
        pregunta: |
          ¿Cuánto vale $\sqrt{1+z_{x}^{2}+z_{y}^{2}}$ para este plano?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '9'
            mensaje: |
              $1+4+4=9$ es lo que hay **dentro** de la raíz. Falta sacarla:
              $\sqrt{9}=3$.
          - valor: '5'
            mensaje: |
              Parece que has sumado las derivadas sin elevarlas al cuadrado:
              $1+2+2$. La fórmula lleva los cuadrados, y por eso el signo de la
              pendiente da igual.
          - valor: '2.2360680'
            mensaje: |
              $\sqrt5$ sale de usar solo una de las dos parciales. El plano se
              inclina en las dos direcciones y las dos cuentan.
        pista: |
          Las dos pendientes valen $2$, así que dentro de la raíz hay
          $1+2^{2}+2^{2}$.
        desarrollo: |
          $$
          z_{x}=2,\qquad z_{y}=2
          \;\Longrightarrow\;
          \sqrt{1+2^{2}+2^{2}}=\sqrt{9}=3
          $$

          Y aquí está la gracia de que sea un **plano**: el factor es una
          constante, no depende del punto. Por eso este ejemplo no exige
          integrar nada.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área de ese trozo de plano?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es el área del rectángulo, o sea la de la **sombra**. Falta
              multiplicar por el factor de la inclinación.
          - valor: '3'
            mensaje: |
              $3$ es el factor, no el área. Hay que multiplicarlo por el área
              del recinto sobre el que se levanta la superficie.
          - valor: '18'
            mensaje: |
              $18=9\cdot 2$: te has dejado la raíz. Dentro de la raíz hay $9$,
              pero lo que multiplica es $3$.
        pista: |
          El factor es constante, así que sale fuera de la integral y lo que
          queda dentro es $\iint_{D}dA$, que es el área de $D$.
        desarrollo: |
          $$
          S=\iint_{D}3\,dA=3\iint_{D}dA=3\cdot\text{área}(D)=3\cdot 2=6
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El área de una superficie $z=f(x,y)$ sobre un recinto $D$ es
              $\iint_{D}\sqrt{1+z_{x}^{2}+z_{y}^{2}}\,dA$, y la raíz es el
              factor $1/\cos\gamma$ que corrige la inclinación.
          - texto: >-
              Aquí $z_{x}=z_{y}=2$, así que la raíz vale $3$ **en todos los
              puntos**: es una constante y sale fuera de la integral.
          - texto: >-
              Lo que queda dentro es $\iint_{D}dA$, el área del rectángulo, que
              vale $2$. El área buscada es $3\cdot 2=6$.
          - texto: >-
              Como el plano lleva un $+1$, el trozo está una unidad más alto y
              por eso su área es mayor que la del rectángulo.
            trampa: true
            mensaje: |
              Subir una superficie no le cambia el área: el plano $z=2x+2y+1$ y
              el plano $z=2x+2y$ son el mismo plano trasladado, y los dos dan
              $6$. El término independiente no aparece en la fórmula porque su
              derivada es cero. Lo que agranda el área es la **pendiente**.
    resolucion: |
      **La idea.** El rectángulo $D$ es la sombra que proyecta el trozo de
      plano. Como el plano está inclinado, la pieza real es mayor que su sombra,
      y el factor entre las dos es $1/\cos\gamma$ — que es lo que la fórmula
      escribe como una raíz:

      $$
      S=\iint_{D}\sqrt{1+z_{x}^{2}+z_{y}^{2}}\;dA
      $$

      **La cuenta.** Con $z=2x+2y+1$ las dos pendientes valen $2$:

      $$
      \sqrt{1+2^{2}+2^{2}}=\sqrt{9}=3
      $$

      Es **constante**, porque un plano se inclina igual en todos sus puntos.
      Sale fuera de la integral y deja dentro el área de $D$:

      $$
      S=3\iint_{D}dA=3\cdot(2\cdot 1)=\boxed{\;6\;}
      $$

      **Por qué este ejemplo va el primero.** Porque es el único caso en que la
      fórmula del área de una superficie no exige integrar: el factor es una
      constante y todo se reduce a una multiplicación. En cuanto la superficie
      se curva —un paraboloide, una esfera— el factor depende del punto y hay
      que integrarlo de verdad, casi siempre en polares. Pero la idea es la
      misma, y aquí se ve sin que la cuenta la tape.

      **La comprobación que conviene hacerse.** El área ha salido tres veces la
      de la sombra, y eso encaja: el plano sube dos unidades por cada una que
      avanza en $x$ y otras dos en $y$, así que está muy empinado. Si te sale un
      área **menor** que la del recinto, el error es seguro — la raíz nunca vale
      menos de $1$, porque el $1$ de dentro ya está.

