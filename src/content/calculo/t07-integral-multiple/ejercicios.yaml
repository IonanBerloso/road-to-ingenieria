        consigna: |
          Dibuja los cinco recintos, cada uno en unos ejes etiquetados con su
          letra. Marca en cada uno los puntos de corte de las curvas frontera.
        comprueba:
          - punto: |
              En (a), la recta $y=x$ como suelo y la parábola $y=2-x^{2}$ como
              techo, cortándose en $\left(1,1\right)$.
            porque: |
              De $x=2-x^{2}$ sale $x=1$ —la otra raíz es negativa y la descarta
              $x\ge0$—. El recinto acaba antes de lo que parece: en $x=1$, no en
              $x=\sqrt2$.
          - punto: |
              En (b), el triángulo de vértices $\left(0,0\right)$,
              $\left(2,0\right)$ y $\left(0,2\right)$.
            porque: |
              Tres desigualdades lineales, tres lados. Es el recinto más simple
              de los cinco y conviene despacharlo primero.
          - punto: |
              En (c), la cúbica $y=x^{3}$ y la recta $x+y=2$, que se cortan en
              $\left(1,1\right)$.
            porque: |
              De $x^{3}=2-x$ sale $x=1$ por tanteo. La cúbica sale casi plana del
              origen y sube de golpe: dibujarla como una parábola cambia la
              forma del recinto.
          - punto: |
              En (d), el **segmento circular** entre la cuerda $x+y=2$ y el arco
              de $x^{2}+y^{2}=4$, con los extremos en $\left(2,0\right)$ y
              $\left(0,2\right)$.
            porque: |
              La recta pasa justo por los dos puntos donde la circunferencia
              corta los ejes. El recinto es la «rebanada» entre cuerda y arco, no
              el cuarto de disco.
          - punto: |
              En (e), el triángulo de vértices $\left(0,0\right)$,
              $\left(\tfrac\pi2,0\right)$ y
              $\left(\tfrac\pi4,\tfrac\pi4\right)$.
            porque: |
              Las tres rectas se cortan dos a dos ahí. El vértice superior sale
              de $y=x$ con $x+y=\tfrac\pi2$, y es el que más se falla.
        veredicto: |
          Cinco recintos y cinco formas distintas: región entre recta y parábola,
          triángulo, región bajo una cúbica, segmento circular y otro triángulo.
          Identificar el tipo antes de poner límites es la mitad del trabajo.

    resolucion: |
      **Los cinco resultados.**

      | apartado | valor |
      |---|---|
      | (a) | $-17/20$ |
      | (b) | $8/3$ |
      | (c) | $7/15$ |
      | (d) | $8/5$ |
      | (e) | $1/2$ |

      ### 1 · (a) El recinto se cierra solo

      $x\le y\le 2-x^{2}$ exige $x\le 2-x^{2}$, o sea $x\in[-2,1]$; con
      $x\ge0$, queda $x\in[0,1]$.

      $$
      I = \int_0^1\!\!\int_x^{2-x^{2}}(x-y)\,dy\,dx = -\frac{17}{20}
      $$

      ### 2 · (c) Lo mismo, con una cúbica

      $y\ge x^{3}$ y $y\le 2-x$ se cortan donde $x^{3}=2-x$, que tiene la raíz
      evidente $x=1$.

      $$
      I = \int_0^1 x\left(2-x-x^{3}\right)dx
      = 1-\frac13-\frac15 = \frac{7}{15}
      $$

      ### 3 · (d) El segmento circular

      $$
      I = \int_0^2 x^{2}\,\frac{(4-x^{2})-(2-x)^{2}}{2}\,dx = \frac{8}{5}
      $$

      ### 4 · (e) El orden que no parte

      Triángulo de vértices $(0,0)$, $\left(\tfrac{\pi}{4},\tfrac{\pi}{4}\right)$
      y $\left(\tfrac{\pi}{2},0\right)$. Barriendo en **horizontal**:

      $$
      I = \int_0^{\pi/4}\!\!\int_y^{\pi/2-y}\operatorname{sen}(x+y)\,dx\,dy
      = \int_0^{\pi/4}\cos 2y\,dy = \frac12
      $$

      Barriendo en vertical harían falta dos integrales.

      **Lo que hay que llevarse.** El recinto se cierra resolviendo una
      ecuación, no buscando un dato. Y elegir el orden **antes** de escribir
      nada es lo que decide si el ejercicio es una integral o son dos.

  - id: tres-triples-en-cartesianas
    titulo: Tres integrales triples, y los límites que dependen unos de otros
    fuente: >-
      Ejercicio 7.4, apartados (a), (b) y (c) · Problemas complementarios,
      tema 7 · Cálculo, UPV/EHU. Los apartados (d) y (e) se apoyan en una
      figura del boletín y no se transcriben aquí.
    nivel: practica
    enunciado: |
      Calcular las siguientes integrales triples:

      (a) $\displaystyle\int_0^2\!\!\int_0^z\!\!\int_0^y (xyz)\,dx\,dy\,dz$

      (b) $\displaystyle\iiint_R (1-x)\,dx\,dy\,dz$, $R$: sólido delimitado
      por los planos $x\ge0$, $y\ge0$, $z\ge0$ y $3x+2y+z\le6$.

      (c) $\displaystyle\iiint_R (xy^{2}z^{3})\,dx\,dy\,dz$, $R$: sólido
      delimitado por $z=xy$, $y=x$, $x=1$ y $z=0$.
    pide: El valor de las tres integrales.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado (a) los límites son $0\le x\le y$, $0\le y\le z$,
          $0\le z\le 2$. ¿Se puede cambiar el orden libremente?
        opciones:
          - texto: >-
              No tal cual: hay que **reescribir** los límites primero, porque
              cada uno depende de la variable de fuera
            correcta: true
            mensaje: |
              Eso es. El orden que da el enunciado es el único que se puede
              usar sin tocar nada; cualquier otro exige describir el mismo
              sólido al revés.
          - texto: >-
              Sí, Fubini lo permite siempre
            mensaje: |
              Fubini permite cambiar el orden **del sólido**, no de los
              símbolos. Si dejas los números donde están y solo mueves los
              diferenciales, estás integrando otro sólido.
          - texto: >-
              No, un sólido solo admite un orden
            mensaje: |
              Admite los seis. Lo que cambia son los límites, que hay que
              recalcular en cada uno — y ese es justo el ejercicio 7.6 del
              mismo boletín.

      - tipo: calcular
        titulo: El apartado (a)
        pregunta: |
          $\displaystyle\int_0^2\!\!\int_0^z\!\!\int_0^y (xyz)\,dx\,dy\,dz$
        respuesta:
          tipo: numero
          valor: '1.3333'
          tolerancia: 0.006
          formato: en forma exacta (4/3) o con cuatro decimales
        distractores:
          - valor: '8'
            mensaje: |
              Has tomado los tres límites superiores como el número $2$. Solo
              el de $z$ lo es; los otros dos son variables.
          - valor: '2.1333'
            mensaje: |
              $\int_0^{y} x\,dx$ vale $\tfrac{y^{2}}{2}$, no $y$. Con ese fallo
              sale $32/15$.
        pista: |
          De dentro afuera: $\int_0^y x\,dx = \tfrac{y^{2}}{2}$, así que queda
          $\tfrac{y^{3}z}{2}$.
        desarrollo: |
          $$
          \int_0^y xyz\,dx = \frac{y^{3}z}{2},
          \qquad
          \int_0^z \frac{y^{3}z}{2}\,dy = \frac{z^{5}}{8}
          $$

          $$
          \int_0^2 \frac{z^{5}}{8}\,dz = \frac{64}{48} = \frac43
          $$

      - tipo: calcular
        titulo: El apartado (b), sin integrar apenas
        pregunta: |
          El tetraedro $x,y,z\ge0$, $3x+2y+z\le6$ tiene vértices en $(2,0,0)$,
          $(0,3,0)$ y $(0,0,6)$. Sabiendo que su volumen es
          $\tfrac{1}{6}\cdot2\cdot3\cdot6$ y que su centro de gravedad está en
          la cuarta parte de cada arista desde el origen, ¿cuánto vale
          $\displaystyle\iiint_R (1-x)\,dV$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '6'
            mensaje: |
              Ese es el volumen, o sea $\iiint 1\,dV$. Falta restarle
              $\iiint x\,dV$.
          - valor: '2'
            mensaje: |
              Has usado $\overline{x}=\tfrac{2}{3}$. El centro de gravedad de
              un tetraedro está a **un cuarto** de cada arista desde el
              vértice donde concurren, no a un tercio: eso es el triángulo.
        pista: |
          $\iiint(1-x)\,dV = V - \iiint x\,dV = V - V\,\overline{x}$.
        desarrollo: |
          $$
          V = \frac{1}{6}\cdot2\cdot3\cdot6 = 6,
          \qquad
          \overline{x} = \frac{2}{4} = \frac12
          $$

          $$
          \iiint_R (1-x)\,dV = V\left(1-\overline{x}\right) = 6\cdot\frac12 = 3
          $$

          Se puede montar la triple y sale lo mismo, pero **reconocer que la
          integral de $x$ es el volumen por la abscisa del centro de gravedad**
          convierte tres integrales en una multiplicación.

      - tipo: calcular
        titulo: El apartado (c)
        pregunta: |
          $\displaystyle\iiint_R (xy^{2}z^{3})\,dx\,dy\,dz$ sobre el sólido
          $0\le z\le xy$, $0\le y\le x$, $0\le x\le1$.
        respuesta:
          tipo: numero
          valor: '0.002747'
          tolerancia: 0.00006
          formato: en forma exacta (1/364) o con seis decimales
        distractores:
          - valor: '0.035714'
            mensaje: |
              $1/28$ es lo que queda si te dejas la última integral, la de $x$
              de $0$ a $1$ sobre $x^{12}$.
          - valor: '0.005952'
            mensaje: |
              $1/168$ sale al poner $y$ de $0$ a $1$. El enunciado da $y=x$
              como frontera, así que $y$ va de $0$ a $x$.
        pista: |
          $\int_0^{xy} z^{3}dz = \tfrac{(xy)^{4}}{4}$, y al multiplicarlo por
          $xy^{2}$ queda $\tfrac{x^{5}y^{6}}{4}$.
        desarrollo: |
          $$
          \int_0^{xy} xy^{2}z^{3}\,dz = \frac{x^{5}y^{6}}{4}
          $$

          $$
          \int_0^{x}\frac{x^{5}y^{6}}{4}\,dy = \frac{x^{12}}{28}
          $$

          $$
          \int_0^{1}\frac{x^{12}}{28}\,dx = \frac{1}{364} \approx 0{,}002747
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              En una triple con límites variables, el orden viene impuesto: la
              variable más interna es la que depende de las otras dos.
          - texto: >-
              En (b) no hace falta integrar: $\iiint x\,dV = V\,\overline{x}$,
              y el centro de gravedad de un tetraedro está a un cuarto de cada
              arista.
          - texto: >-
              En (c) las fronteras $z=xy$, $y=x$ y $x=1$ encajan justo en el
              orden $dz\,dy\,dx$, cada una con la variable siguiente.
          - texto: >-
              Y como los tres integrandos son productos de potencias, las tres
              integrales se pueden separar en producto de integrales simples.
            trampa: true
            mensaje: |
              Solo se separan cuando **los límites son constantes**. En (a) y
              en (c) dependen unos de otros, y ahí la separación no vale: hay
              que integrar de dentro afuera, arrastrando lo que queda.
        veredicto: |
          Un límite variable manda sobre todo lo demás: fija el orden y
          prohíbe separar. Cuando los tres son constantes, la triple es un
          producto de tres simples y se hace de cabeza.
    resolucion: |
      **Los tres resultados.**

      | apartado | valor |
      |---|---|
      | (a) | $4/3$ |
      | (b) | $3$ |
      | (c) | $1/364$ |

      ### 1 · (a) De dentro afuera, sin atajos

      $$
      \int_0^y xyz\,dx = \frac{y^{3}z}{2}
      \;\to\;
      \int_0^z \frac{y^{3}z}{2}dy = \frac{z^{5}}{8}
      \;\to\;
      \int_0^2 \frac{z^{5}}{8}dz = \frac43
      $$

      ### 2 · (b) La integral que es una multiplicación

      El tetraedro tiene volumen $V=\tfrac{1}{6}\cdot2\cdot3\cdot6=6$ y centro
      de gravedad en $\left(\tfrac12,\tfrac34,\tfrac32\right)$ — un cuarto de
      cada arista.

      $$
      \iiint_R (1-x)\,dV = V - V\,\overline{x} = 6 - 3 = 3
      $$

      ### 3 · (c) Las fronteras ya vienen ordenadas

      $$
      \int_0^{1}\!\!\int_0^{x}\!\!\int_0^{xy} xy^{2}z^{3}\,dz\,dy\,dx
      = \int_0^{1}\frac{x^{12}}{28}\,dx = \frac{1}{364}
      $$

      **Lo que hay que llevarse.** Dos cosas. Una: **mirar si el integrando es
      $1$, $x$, $y$ o $z$ antes de montar la triple** — esos cuatro casos son
      el volumen y los momentos, y salen de fórmulas que ya te sabes. Y otra:
      los límites variables imponen el orden, así que el trabajo de verdad es
      leerlos bien, no integrar.

  - id: el-solido-de-una-triple-y-el-otro-orden
    titulo: Dibujar el sólido que una integral describe, y recorrerlo al revés
    fuente: Ejercicio 7.5 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU (2012/2013 5E)
    nivel: practica
    enunciado: |
      Dibujar el sólido cuyo volumen representa la siguiente integral triple y
      calcularla empleando un orden de integración diferente.

      $$
      \int_0^1\!\!\int_0^3\!\!\int_0^{(x-2)^{2}} dz\,dy\,dx
      $$
    pide: El dibujo del sólido y el valor de la integral en otro orden.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de dibujar nada: ¿de qué depende la tapa del sólido?
        opciones:
          - texto: >-
              Solo de $x$, así que el sólido es un **cilindro parabólico**: la
              misma curva repetida a lo largo de todo el intervalo de $y$
            correcta: true
            mensaje: |
              Eso es, y es lo que hace fácil el ejercicio: la $y$ solo aporta un
              factor $3$, y todo lo demás ocurre en el plano $xz$.
          - texto: >-
              De $x$ y de $y$, porque los dos límites exteriores son
              constantes
            mensaje: |
              Que los límites de $x$ e $y$ sean constantes solo dice que la
              **base** es un rectángulo. La tapa es $z=(x-2)^{2}$, y ahí no
              aparece la $y$ por ningún lado.
          - texto: >-
              De $z$, que es la variable de dentro
            mensaje: |
              La tapa **es** el límite de $z$; no puede depender de $z$. Los
              límites de la variable más interna se escriben siempre en
              función de las de fuera.

      - tipo: dibujar
        consigna: |
          Dibuja el sólido en unos ejes $x$–$y$–$z$, con la base y la tapa
          marcadas y las cotas escritas. Este ejercicio pide el dibujo como
          primer apartado, y sin él no se puede plantear el otro orden.
        comprueba:
          - punto: >-
              La base es el rectángulo $0\le x\le1$, $0\le y\le3$ en el plano
              $z=0$.
            porque: >-
              Son los dos límites de fuera, que son constantes. Todo lo que no
              sea un rectángulo ahí significa que has leído mal el orden de los
              diferenciales.
          - punto: >-
              La tapa es la superficie $z=(x-2)^{2}$, que **no depende de
              $y$**.
            porque: >-
              Por eso el sólido es un cilindro parabólico: la misma curva
              repetida a lo largo de todo el intervalo de $y$. Dibujarla
              curvándose también en $y$ es el error más común aquí.
          - punto: >-
              En $x=0$ la tapa está a altura $4$ y en $x=1$ a altura $1$; la
              curva **baja** al avanzar en $x$.
            porque: >-
              El vértice de la parábola está en $x=2$, fuera del intervalo. En
              $[0,1]$ solo se ve la rama descendente, y quien dibuja el vértice
              dentro se inventa un mínimo que no existe.
        figura: >-
          Un cilindro parabólico apoyado en el rectángulo $[0,1]\times[0,3]$
          del plano $z=0$, con la tapa cayendo de $z=4$ en $x=0$ a $z=1$ en
          $x=1$, igual para todo $y$.
        veredicto: |
          El dibujo contesta solo la segunda parte: como la tapa no depende de
          $y$, cualquier orden que ponga $y$ el primero deja el problema en dos
          dimensiones.

      - tipo: calcular
        titulo: El valor de la integral
        pregunta: |
          ¿Cuánto vale la integral?
        respuesta:
          tipo: numero
          valor: '7'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '2.3333'
            mensaje: |
              $7/3$ es la integral sin el factor $3$ de la longitud en $y$. El
              integrando no depende de $y$, pero el intervalo sigue estando
              ahí.
          - valor: '21'
            mensaje: |
              Has multiplicado dos veces por $3$. La longitud en $y$ entra una
              sola vez.
        pista: |
          $\int_0^{(x-2)^{2}}dz = (x-2)^{2}$, y luego la $y$ solo multiplica
          por $3$.
        desarrollo: |
          $$
          \int_0^1\!\!\int_0^3 (x-2)^{2}\,dy\,dx
          = 3\int_0^1 (x-2)^{2}\,dx
          = 3\left[\frac{(x-2)^{3}}{3}\right]_0^1
          $$

          $$
          = (-1)^{3} - (-2)^{3} = -1 + 8 = 7
          $$

      - tipo: calcular
        titulo: El otro orden, que es lo que se pide
        pregunta: |
          En el orden $dx\,dz\,dy$ el sólido se parte en dos por $z=1$. Para
          $1\le z\le4$, la $x$ va de $0$ a un tope que depende de $z$. ¿Cuál
          es ese tope en $z=4$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              En $z=4$ el sólido ya se ha acabado: solo el punto $x=0$ llega a
              esa altura. Si el tope fuera $1$, el sólido sería un prisma
              recto.
          - valor: '2'
            mensaje: |
              $x=2$ es el vértice de la parábola, que está **fuera** del
              intervalo $[0,1]$. El tope es $2-\sqrt{z}$, y en $z=4$ vale $0$.
        pista: |
          $(x-2)^{2}\ge z$ con $x\le1<2$ equivale a $2-x\ge\sqrt{z}$, o sea
          $x\le 2-\sqrt{z}$.
        desarrollo: |
          Para que un punto $(x,y,z)$ esté dentro hace falta
          $z\le(x-2)^{2}$. Como en el intervalo $x\le1$ se cumple $x<2$, la
          raíz se toma con signo:

          $$
          z\le(2-x)^{2} \iff 2-x\ge\sqrt{z} \iff x\le 2-\sqrt{z}
          $$

          En $z=4$ eso da $x\le0$: el tope es $0$. Y el reparto queda:

          $$
          V = 3\left[\int_0^1 1\,dz + \int_1^4\left(2-\sqrt{z}\right)dz\right]
          = 3\left[1 + \frac43\right] = 7
          $$

          Mismo resultado, otro camino.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Los dos límites de fuera son constantes, así que la base es el
              rectángulo $[0,1]\times[0,3]$.
          - texto: >-
              La tapa $z=(x-2)^{2}$ no lleva $y$, así que el sólido es un
              cilindro parabólico y la $y$ solo multiplica por $3$.
          - texto: >-
              En el intervalo $[0,1]$ la parábola solo enseña su rama
              descendente, de $z=4$ a $z=1$, porque su vértice está en $x=2$.
          - texto: >-
              Y por eso, al invertir a $dx\,dz\,dy$, la $z$ va de $0$ a $1$,
              que es la altura de la tapa en el extremo derecho.
            trampa: true
            mensaje: |
              La $z$ llega hasta $4$, que es la altura **máxima** de la tapa,
              alcanzada en $x=0$. Tomar $1$ como techo recorta tres cuartas
              partes de la altura del sólido. Al invertir un orden, cada
              variable nueva va de su mínimo global a su máximo global sobre
              todo el sólido, no sobre un punto.
        veredicto: |
          Invertir el orden en tres dimensiones es lo mismo que en dos, con un
          paso más: la variable que pasa a ir por fuera recorre **todo** su
          rango en el sólido, y las de dentro se recalculan en función de ella.
    resolucion: |
      **Datos.** La integral
      $\displaystyle\int_0^1\!\!\int_0^3\!\!\int_0^{(x-2)^{2}}dz\,dy\,dx$.

      ### 1 · Qué sólido es

      Leyendo de fuera adentro: $x\in[0,1]$, $y\in[0,3]$ y $z$ desde el suelo
      hasta $z=(x-2)^{2}$.

      Como la tapa **no depende de $y$**, el sólido es un cilindro parabólico:
      la parábola $z=(x-2)^{2}$ dibujada en el plano $xz$ y arrastrada tres
      unidades en $y$. En $x=0$ la tapa está a $4$ y en $x=1$ a $1$.

      ### 2 · El valor, en el orden dado

      $$
      V = 3\int_0^1 (x-2)^{2}dx = 3\cdot\frac{7}{3} = 7
      $$

      ### 3 · El otro orden, $dx\,dz\,dy$

      La altura recorre $z\in[0,4]$. Para cada $z$:

      | tramo | $x$ va de | a |
      |---|---|---|
      | $0\le z\le1$ | $0$ | $1$ |
      | $1\le z\le4$ | $0$ | $2-\sqrt{z}$ |

      $$
      V = \int_0^3\!\!\left[\int_0^1\!\!\int_0^1 dx\,dz
      + \int_1^4\!\!\int_0^{2-\sqrt{z}} dx\,dz\right]dy
      = 3\left(1+\frac43\right) = 7
      $$

      **Lo que hay que llevarse.** El dibujo no es decoración: es lo que dice
      **dónde hay que partir**. Aquí el corte en $z=1$ se ve en el dibujo
      antes de escribir nada, y sin dibujo se descubre a mitad de la cuenta,
      cuando ya no hay tiempo.

  - id: el-rombo-y-el-cambio-que-lo-endereza
    titulo: Cuatro rectas que forman un rombo, y el cambio que lo vuelve cuadrado
    fuente: Ejercicio 7.7 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU (2018/2019 4E)
    nivel: practica
    enunciado: |
      Sea la integral $I=\displaystyle\iint_D (2x-y+1)\,dx\,dy$ donde $D$ es el
      recinto delimitado por las condiciones $y=4x-4$, $y=4x+4$, $y=-4x-4$ e
      $y=-4x+4$. Representar el recinto $D$ y calcular la integral utilizando
      el cambio de variable $x=\tfrac12(u+v)$, $y=2v-2u$.
    pide: El recinto y el valor de la integral.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las cuatro rectas se agrupan de dos en dos. ¿Qué combinación de $x$ e
          $y$ es constante en cada par?
        opciones:
          - texto: >-
              $y-4x$ vale $-4$ y $+4$ en el primer par, e $y+4x$ vale $+4$ y
              $-4$ en el segundo
            correcta: true
            mensaje: |
              Exacto, y eso es lo que hay que ver **antes** de mirar el cambio
              que da el enunciado: las dos combinaciones que se mantienen
              constantes sobre los lados son las variables nuevas.
          - texto: >-
              $x$ vale $\pm1$ y $y$ vale $\pm4$
            mensaje: |
              Esos son los vértices, no los lados. Sobre un lado ni $x$ ni $y$
              son constantes: lo que es constante es una combinación de las
              dos.
          - texto: >-
              El producto $xy$
            mensaje: |
              Sobre $y=4x-4$ el producto $xy=4x^{2}-4x$ cambia con $x$. Las
              rectas se reconocen por combinaciones **lineales** constantes.

      - tipo: calcular
        titulo: El jacobiano
        pregunta: |
          Con $x=\tfrac12(u+v)$ e $y=2v-2u$, ¿cuánto vale
          $\left|\dfrac{\partial(x,y)}{\partial(u,v)}\right|$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              $1/2$ es el jacobiano **inverso**,
              $\partial(u,v)/\partial(x,y)$. El que multiplica a $du\,dv$ es el
              otro.
          - valor: '1'
            mensaje: |
              Te has dejado un término. El determinante es
              $\tfrac12\cdot2-\tfrac12\cdot(-2)$, y los dos suman porque el
              segundo lleva un signo menos delante de otro signo menos.
        pista: |
          $\begin{vmatrix}
          \tfrac12 & \tfrac12\\[2pt] -2 & 2
          \end{vmatrix}$
        desarrollo: |
          $$
          \frac{\partial(x,y)}{\partial(u,v)}
          = \begin{vmatrix}
          \tfrac12 & \tfrac12\\[2pt]
          -2 & 2
          \end{vmatrix}
          = \frac12\cdot2 - \frac12\cdot(-2) = 1+1 = 2
          $$

      - tipo: calcular
        titulo: La integral
        pregunta: |
          El cambio lleva $D$ al cuadrado $-1\le u\le1$, $-1\le v\le1$. ¿Cuánto
          vale $I$?
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '4'
            mensaje: |
              Te has dejado el jacobiano. El área del cuadrado en $(u,v)$ es
              $4$, y la del rombo en $(x,y)$ es $8$: el cambio duplica áreas, y
              eso es exactamente lo que dice el $2$.
          - valor: '16'
            mensaje: |
              Has multiplicado por el jacobiano dos veces, o has usado $4$ como
              jacobiano. Entra una sola vez.
        pista: |
          $2x-y = (u+v)-(2v-2u) = 3u-v$, y sobre el cuadrado simétrico
          $\iint (3u-v)\,du\,dv = 0$.
        desarrollo: |
          $$
          2x - y + 1 = 3u - v + 1
          $$

          $$
          I = \int_{-1}^{1}\!\!\int_{-1}^{1}\left(3u-v+1\right)\cdot 2\;du\,dv
          $$

          Los dos primeros sumandos son impares sobre un cuadrado simétrico y
          se anulan:

          $$
          I = 2\int_{-1}^{1}\!\!\int_{-1}^{1} 1\;du\,dv = 2\cdot 4 = 8
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Las cuatro rectas son $y-4x=\pm4$ e $y+4x=\pm4$, así que el
              recinto es un rombo de vértices $(\pm1,0)$ y $(0,\pm4)$.
          - texto: >-
              El cambio del enunciado es exactamente $u=\tfrac{4x-y}{4}$,
              $v=\tfrac{4x+y}{4}$ despejado al revés, y convierte el rombo en
              el cuadrado $[-1,1]^{2}$.
          - texto: >-
              El jacobiano vale $2$, constante, y el integrando se vuelve
              $3u-v+1$, cuyos dos primeros sumandos se anulan por simetría.
          - texto: >-
              Y como el integrando acaba siendo $1$, el resultado es el área
              del cuadrado, $4$.
            trampa: true
            mensaje: |
              Falta el jacobiano. La integral de $1$ sobre el recinto es el
              área **del rombo**, no la del cuadrado, y el jacobiano es
              justamente lo que las relaciona: $8 = 2\cdot4$. Se comprueba sin
              integrar nada, con la fórmula del rombo:
              $\tfrac12 d_1 d_2 = \tfrac12\cdot2\cdot8 = 8$.
        veredicto: |
          Dos comprobaciones gratis en este ejercicio. Una: los sumandos
          impares sobre un recinto simétrico se van sin integrar. Y otra: el
          resultado es el área del rombo, que se sabe por geometría
          elemental — si no coincide, el jacobiano está mal.
      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 416 201" role="img" width="416" height="201"
               aria-labelledby="f-rombo-cambio-t f-rombo-cambio-d">
