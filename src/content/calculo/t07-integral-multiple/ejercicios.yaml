  - id: invertir-el-orden
    titulo: Invertir el orden de integración
    fuente: Ejercicio 7.3 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU (2017/2018 5E)
    nivel: examen
    enunciado: |
      Sea la integral $\displaystyle\int_{0}^{1}\!\!\int_{\sqrt{y}}^{3-2y} dx\,dy$.
      Representar gráficamente el recinto de integración, invertir el orden de
      integración y calcular la integral en el nuevo orden obtenido.
    pide: El dibujo del recinto, la integral con el orden invertido y su valor.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los límites dados son $x$ desde $\sqrt{y}$ hasta $3-2y$, con $y$ de 0 a
          1. ¿Qué describe eso?
        opciones:
          - texto: Tiras horizontales que entran por la parábola y salen por la recta
            correcta: true
            mensaje: |
              Eso es. Con $dx$ dentro, te quedas en un $y$ y te mueves en
              horizontal: entras por $x=\sqrt{y}$ y sales por $x=3-2y$.
          - texto: Tiras verticales entre dos curvas
            mensaje: |
              Las tiras verticales corresponden a $dy$ dentro. Aquí el
              diferencial interior es $dx$, así que las tiras son horizontales.
          - texto: Un rectángulo, porque los límites de y son números
            mensaje: |
              Los de $y$ sí son números, pero los de $x$ llevan $y$ dentro: por
              eso el recinto tiene lados curvos y no es un rectángulo.
      - tipo: calcular
        titulo: Dónde se cortan las dos curvas
        pregunta: |
          $x=\sqrt{y}$ es $y=x^{2}$, y $x=3-2y$ es $y=(3-x)/2$. ¿Para qué valor
          positivo de $x$ se cortan?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1.5'
            mensaje: |
              $1{,}5$ es donde la recta corta al eje $x$ (con $y=0$), no donde
              corta a la parábola.
          - valor: '3'
            mensaje: |
              3 sale de $3-2y$ con $y=0$ en la forma original. El corte con la
              parábola se obtiene igualando $x^{2} = (3-x)/2$.
        pista: |
          Iguala $x^{2} = (3-x)/2$, o sea $2x^{2}+x-3=0$. Una raíz es positiva.
        desarrollo: |
          $$
          x^{2} = \frac{3-x}{2}
          \;\Longrightarrow\;
          2x^{2}+x-3 = 0
          \;\Longrightarrow\;
          (2x+3)(x-1)=0
          $$

          La raíz positiva es $x=1$, y ahí $y=1$. El punto de corte es $(1,1)$,
          que es justo la esquina superior del recinto.
      - tipo: justificar
        pregunta: |
          Ordena la inversión del orden. Una pieza es falsa.
        piezas:
          - texto: 'El recinto va de $y=0$ a $y=1$, entre la parábola $x=\sqrt{y}$ y la recta $x=3-2y$.'
          - texto: 'En el nuevo orden hay que partirlo en dos, porque la tapa de arriba cambia en $x=1$.'
          - texto: 'Para $x$ de 0 a 1, la vertical va de $y=0$ a la parábola $y=x^{2}$.'
          - texto: 'Para $x$ de 1 a 3, la vertical va de $y=0$ a la recta $y=(3-x)/2$.'
          - texto: 'Al invertir el orden basta con escribir $\int_{\sqrt y}^{3-2y}\int_0^1 dy\,dx$.'
            trampa: true
            mensaje: |
              Han quedado dos $y$ en el límite exterior. Invertir el orden no es
              intercambiar los límites de sitio: hay que releer el dibujo con la
              otra pregunta, y aquí eso además obliga a partir el recinto en dos.
    resolucion: |
      **El dibujo primero**, que es lo que pide el enunciado y lo que hace
      posible el resto.

      El recinto está entre $y=0$ e $y=1$. Su borde izquierdo es la parábola
      $x=\sqrt{y}$ (o sea $y=x^{2}$) y el derecho la recta $x=3-2y$.

      Los tres vértices salen de cortar:

      | corte | punto |
      |---|---|
      | parábola con recta | $(1,1)$ |
      | parábola con $y=0$ | $(0,0)$ |
      | recta con $y=0$ | $(3,0)$ |

      **Invertir el orden obliga a partir el recinto**, y esa es la dificultad
      real del ejercicio. Barriendo en vertical, la tapa de arriba **no es la
      misma** a la izquierda y a la derecha de $x=1$:

      $$
      \int_{0}^{1}\!\!\int_{0}^{x^{2}} dy\,dx
      \;+\;
      \int_{1}^{3}\!\!\int_{0}^{(3-x)/2} dy\,dx
      $$

      **Calculando:**

      $$
      \int_{0}^{1} x^{2}\,dx = \frac{1}{3},
      \qquad
      \int_{1}^{3}\frac{3-x}{2}\,dx
      = \frac{1}{2}\Bigl[3x - \tfrac{x^{2}}{2}\Bigr]_{1}^{3}
      = \frac{1}{2}\cdot 2 = 1
      $$

      $$
      \boxed{\;\int_{0}^{1}\!\!\int_{\sqrt y}^{3-2y} dx\,dy = \frac{1}{3}+1 = \frac{4}{3}\;}
      $$

      > **Que haya que partir el recinto es la señal de que el orden original
      > era el bueno.** Cuando un enunciado te hace invertir hacia el orden
      > incómodo, lo que está evaluando es si sabes leer el dibujo — no si sabes
      > integrar.

  - id: solido-con-tres-ordenes
    titulo: Un sólido, y la misma integral en tres órdenes
    fuente: Ejercicio 7.6 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU (2014/2015 4E)
    nivel: examen
    enunciado: |
      Considerar el sólido $R$ delimitado por las condiciones $z \le 5-2y$,
      $0\le x\le 4$, $0\le y\le 2$ y $z\ge 0$. Se pide:

      a) Representar gráficamente el sólido.
      b) Expresar (sin hacer el cálculo) la integral $\iiint_R dx\,dy\,dz$ en los
      órdenes $dz\,dx\,dy$, $dy\,dx\,dz$ y $dx\,dy\,dz$.
      c) Calcular el valor de $V$ empleando alguno de los órdenes obtenidos.
    pide: El dibujo, la integral en tres órdenes y el volumen.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado pide expresar la integral en tres órdenes **sin
          calcularla**. ¿Qué se está evaluando?
        opciones:
          - texto: Saber leer el sólido y traducirlo a límites, que es lo que puntúa en COMP4
            correcta: true
            mensaje: |
              Exacto. El apartado b) es explícitamente «sin hacer el cálculo»:
              lo que se corrige es el planteamiento. En esta evaluación COMP4
              vale la mitad de la nota del ejercicio.
          - texto: La rapidez de cálculo
            mensaje: |
              Al contrario: el enunciado prohíbe calcular en ese apartado. Lo que
              se mide es si entiendes la geometría, no si integras deprisa.
          - texto: Que te sepas de memoria las fórmulas del volumen
            mensaje: |
              No hay fórmula que memorizar: el volumen es $\iiint dV$ y todo el
              trabajo está en los límites, que salen del dibujo.
      - tipo: calcular
        titulo: La altura del sólido en y = 0
        pregunta: |
          La tapa superior es el plano $z = 5-2y$. ¿Qué altura tiene el sólido
          en $y=0$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es la altura en $y=2$, el otro extremo: $5-2(2)=1$. En $y=0$ el
              término $-2y$ no resta nada.
          - valor: '3'
            mensaje: |
              3 sería la altura en $y=1$, en el centro. La pregunta es en $y=0$.
        pista: |
          Sustituye y=0 en 5-2y.
        desarrollo: |
          $$
          z = 5-2(0) = 5
          $$

          Y en $y=2$ la altura es $5-4=1$. El sólido es un **prisma de sección
          trapecial**: la tapa baja de 5 a 1 al avanzar en $y$, y nunca llega a
          cero dentro del recinto.
      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Integrando, $V = \int_0^2\!\int_0^4\!\int_0^{5-2y} dz\,dx\,dy$.
          ¿Cuánto vale?
        respuesta:
          tipo: numero
          valor: '24'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '40'
            mensaje: |
              40 es $4\times 2\times 5$: la caja completa con altura constante 5.
              Pero la tapa es inclinada, así que el volumen es menor.
          - valor: '12'
            mensaje: |
              Parece que has usado solo la altura media de una de las mitades.
              El área del trapecio de sección es $(5+1)/2\times 2 = 6$, y por los
              4 de anchura sale 24.
        pista: |
          La sección en el plano YZ es un trapecio de bases 5 y 1 y altura 2. Multiplica su área por 4.
        desarrollo: |
          $$
          V = \int_0^2\!\!\int_0^4 (5-2y)\,dx\,dy
          = 4\int_0^2 (5-2y)\,dy
          = 4\bigl[5y-y^{2}\bigr]_0^2
          = 4(10-4) = 24
          $$

          **Comprobación geométrica**: la sección es un trapecio de bases 5 y 1 y
          altura 2, de área $(5+1)/2\cdot 2 = 6$; por la longitud 4 en $x$ da 24. ✓
      - tipo: justificar
        pregunta: |
          Ordena la respuesta del apartado b). Una pieza es falsa.
        piezas:
          - texto: 'En el orden $dz\,dx\,dy$: $z$ de 0 a $5-2y$, $x$ de 0 a 4, $y$ de 0 a 2.'
          - texto: 'En el orden $dx\,dy\,dz$ la $x$ es libre de 0 a 4, porque nada la liga a las otras.'
          - texto: 'En ese mismo orden hay que partir en $z=1$, porque por debajo de 1 la $y$ recorre todo $[0,2]$.'
          - texto: 'Y por encima de $z=1$, la $y$ solo llega hasta $(5-z)/2$.'
          - texto: 'Los tres órdenes dan integrales distintas, así que el volumen depende del orden elegido.'
            trampa: true
            mensaje: |
              Las **integrales** se escriben distinto, pero el **volumen** es el
              mismo: es una propiedad del sólido, no del orden en que lo barras.
              Que salga lo mismo por los tres caminos es la comprobación de que
              los tres están bien planteados.
    resolucion: |
      **a) El sólido.** Una caja de base $4\times 2$ en el plano $XY$, con suelo
      en $z=0$ y **tapa inclinada** $z=5-2y$. Como la tapa baja de 5 (en $y=0$)
      a 1 (en $y=2$) y nunca cruza el suelo, el sólido es un prisma de sección
      trapecial tumbado en la dirección $x$.

      **b) Los tres órdenes.** El de $x$ es siempre libre, porque ninguna
      condición liga la $x$ a las demás.

      $$
      \int_{0}^{2}\!\!\int_{0}^{4}\!\!\int_{0}^{5-2y} dz\,dx\,dy
      $$

      $$
      \int_{0}^{5}\!\!\int_{0}^{4}\!\!\int_{0}^{\min(2,\,(5-z)/2)} dy\,dx\,dz
      $$

      que **hay que partir en $z=1$**, porque por debajo de esa altura la $y$
      recorre el intervalo entero:

      $$
      \int_{0}^{1}\!\!\int_{0}^{4}\!\!\int_{0}^{2} dy\,dx\,dz
      \;+\;
      \int_{1}^{5}\!\!\int_{0}^{4}\!\!\int_{0}^{(5-z)/2} dy\,dx\,dz
      $$

      Y el tercero, $dx\,dy\,dz$, con la misma partición en $z=1$ y la $x$ de 0
      a 4 en los dos trozos.

      **c) El volumen**, por el primero, que es el cómodo:

      $$
      V = 4\int_{0}^{2}(5-2y)\,dy = 4(10-4) = 24
      $$

      > **La lección del ejercicio** está en el apartado b): un orden lleva a una
      > integral y otro obliga a **partir el sólido en dos**. Elegir bien no es
      > estética, es la diferencia entre una integral y tres.

  - id: centro-de-gravedad-elipse
    titulo: El centro de gravedad de un cuarto de elipse
    fuente: Ejercicio 7.20 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU (2017/2018 4E)
    nivel: examen
    enunciado: |
      Sea $D$ el recinto delimitado por las condiciones
      $\dfrac{x^{2}}{4}+y^{2}\le 1$, $x\ge 0$ e $y\ge 0$. Calcular las
      coordenadas del centro de gravedad del recinto $D$, suponiendo que la
      densidad en cada punto es $k$.
    pide: Las coordenadas del centro de gravedad.
    pasos:
      - tipo: reconocer
        pregunta: |
          El recinto es un cuarto de elipse de semiejes 2 y 1. ¿Qué cambio de
          variable lo convierte en algo cómodo?
        opciones:
          - texto: Polares generalizadas, con x = 2ρcosθ e y = ρsenθ
            correcta: true
            mensaje: |
              Sí. Con los semiejes metidos en el cambio, la elipse pasa a ser
              $\rho\le 1$, y el jacobiano es $J = ab\rho = 2\rho$.
          - texto: Polares normales, con x = ρcosθ e y = ρsenθ
            mensaje: |
              Las normales convierten circunferencias en rectas, no elipses. Aquí
              dejarían la condición como
              $\rho^{2}(\cos^{2}\theta/4 + \text{sen}^{2}\theta)\le 1$, que no
              simplifica nada.
          - texto: Ninguno; se hace mejor en cartesianas
            mensaje: |
              En cartesianas el límite en $y$ es $\sqrt{1-x^{2}/4}$, con raíz. Se
              puede, pero los momentos salen mucho más largos.
      - tipo: calcular
        titulo: La masa del recinto
        pregunta: |
          El área de un cuarto de elipse de semiejes 2 y 1 es $\pi ab/4$. Con
          densidad constante $k$, ¿cuánto vale la masa dividida entre $k$?
        respuesta:
          tipo: numero
          valor: '1.5708'
          tolerancia: 0.01
          formato: en forma exacta (pi/2) o con cuatro decimales
        distractores:
          - valor: '6.2832'
            mensaje: |
              Eso es $2\pi$, el área de la elipse **entera** ($\pi ab$ con $a=2$,
              $b=1$) multiplicada por... no: $\pi ab = 2\pi$ es la elipse entera.
              El enunciado pide solo un cuarto.
          - valor: '3.1416'
            mensaje: |
              $\pi$ sería la mitad de la elipse. El recinto tiene además $x\ge 0$
              **e** $y\ge 0$, así que es un cuarto.
        pista: |
          $\pi ab/4$ con a=2 y b=1. Eso es $2\pi/4$.
        desarrollo: |
          $$
          M = k\cdot \frac{\pi a b}{4} = k\cdot\frac{\pi\cdot 2\cdot 1}{4}
          = \frac{\pi k}{2}
          $$

          Dividido entre $k$, $\pi/2 \approx 1{,}571$.
      - tipo: justificar
        pregunta: |
          Ordena el planteamiento. Una pieza es falsa.
        piezas:
          - texto: 'Con $x=2\rho\cos\theta$, $y=\rho\,\text{sen}\,\theta$, el recinto es $\rho\in[0,1]$, $\theta\in[0,\pi/2]$.'
          - texto: 'El jacobiano de las polares generalizadas es $J = ab\rho = 2\rho$.'
          - texto: 'La masa es $M = k\iint 2\rho\,d\rho\,d\theta = k\pi/2$.'
          - texto: 'Y $\overline{x} = \frac{1}{M}\iint x\,k\,dA$, con $x = 2\rho\cos\theta$ dentro.'
          - texto: 'Como la densidad es constante, por simetría el centro de gravedad está en el origen.'
            trampa: true
            mensaje: |
              El recinto es solo un **cuarto** de elipse, en el primer cuadrante:
              no es simétrico respecto del origen. Si fuera la elipse entera, sí
              estaría en el centro; aquí el centro de gravedad cae dentro del
              cuarto, con las dos coordenadas positivas.
    resolucion: |
      **La densidad es constante**, así que $k$ se simplifica y el centro de
      gravedad es puramente geométrico — el **centroide**. Conviene decirlo,
      porque ahorra arrastrar la $k$ por todas las cuentas.

      **El cambio.** Polares generalizadas con $a=2$, $b=1$:

      $$
      x = 2\rho\cos\theta,
      \qquad
      y = \rho\,\text{sen}\,\theta,
      \qquad
      J = 2\rho
      $$

      El recinto pasa a ser $\rho\in[0,1]$, $\theta\in[0,\pi/2]$ — un rectángulo.

      **La masa:**

      $$
      M = k\int_{0}^{\pi/2}\!\!\int_{0}^{1} 2\rho\,d\rho\,d\theta
      = k\cdot 2\cdot\tfrac{1}{2}\cdot\tfrac{\pi}{2} = \frac{\pi k}{2}
      $$

      **El momento respecto de $YZ$:**

      $$
      \iint_D x\,k\,dA
      = k\int_{0}^{\pi/2}\!\!\int_{0}^{1} (2\rho\cos\theta)(2\rho)\,d\rho\,d\theta
      = 4k\int_{0}^{\pi/2}\!\!\cos\theta\,d\theta\int_{0}^{1}\!\rho^{2}d\rho
      = \frac{4k}{3}
      $$

      $$
      \overline{x} = \frac{4k/3}{\pi k/2} = \frac{8}{3\pi} \approx 0{,}849
      $$

      **Y el otro, con $y = \rho\,\text{sen}\,\theta$:**

      $$
      \iint_D y\,k\,dA
      = k\int_{0}^{\pi/2}\!\!\int_{0}^{1}(\rho\,\text{sen}\,\theta)(2\rho)\,d\rho\,d\theta
      = \frac{2k}{3}
      \qquad\Longrightarrow\qquad
      \overline{y} = \frac{4}{3\pi} \approx 0{,}424
      $$

      $$
      \boxed{\;G = \left(\frac{8}{3\pi},\ \frac{4}{3\pi}\right)\;}
      $$

      **La comprobación de sentido común**, que vale un punto de COMP4: el
      recinto ocupa $x\in[0,2]$ e $y\in[0,1]$, y el centro sale en
      $(0{,}85;\,0{,}42)$ — dentro, y algo por debajo del centro geométrico de
      la caja, que es donde tiene que estar porque la elipse se estrecha al
      subir. Y fíjate en que $\overline{x} = 2\overline{y}$: es la misma proporción que
      entre los semiejes, y no es casualidad.

  - id: cilindricas-o-esfericas
    titulo: El mismo sólido, en cilíndricas y en esféricas
    fuente: Ejercicio 7.23 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU (2016/2017 4E)
    nivel: examen
    enunciado: |
      Sea el sólido $S$ delimitado por las condiciones $x^{2}+y^{2}+z^{2}\le 4$,
      $x^{2}+y^{2}\le z^{2}$ y $z\ge 0$.

      a) Plantear el volumen de $S$ en coordenadas cilíndricas.
      b) Plantear el volumen de $S$ en coordenadas esféricas.
      c) Calcular el volumen de $S$ utilizando la integral planteada en (a) o
      en (b).
    pide: El volumen planteado de las dos formas, y calculado.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las tres condiciones describen un sólido. ¿Cuál es?
        opciones:
          - texto: Un cono de helado, la parte de la esfera dentro del cono superior
            correcta: true
            mensaje: |
              Eso es. La esfera de radio 2 recortada por el cono
              $z^{2} = x^{2}+y^{2}$, y con $z\ge 0$ solo la mitad de arriba.
              La forma exacta de un cucurucho con la bola encima.
          - texto: Una esfera entera de radio 2
            mensaje: |
              La esfera sola sería la primera condición. Las otras dos la
              recortan: el cono se queda con un huso y $z\ge 0$ con la mitad
              superior.
          - texto: Un cilindro de radio 2
            mensaje: |
              Un cilindro sería $x^{2}+y^{2}\le 4$, sin $z$. Aquí la primera
              condición lleva $z^{2}$, así que es una esfera.
      - tipo: calcular
        titulo: El ángulo del cono, en esféricas
        pregunta: |
          La condición $x^{2}+y^{2}\le z^{2}$ con $z\ge 0$ significa, en
          esféricas, que $\varphi$ va de 0 hasta un ángulo fijo. ¿Cuál, en
          grados?
        respuesta:
          tipo: numero
          valor: '45'
          tolerancia: 0.1
          formato: en grados
        distractores:
          - valor: '90'
            mensaje: |
              90° sería el plano $z=0$, o sea media esfera entera sin recortar.
              El cono $z^{2}=x^{2}+y^{2}$ abre justo a la mitad de eso.
          - valor: '30'
            mensaje: |
              30° saldría de un cono más estrecho. Con
              $z^{2}=x^{2}+y^{2}$ la tangente del ángulo vale 1, y eso es 45°.
        pista: |
          En el borde del cono, $z = \sqrt{x^2+y^2}$, así que la altura iguala al radio. ¿Qué ángulo tiene esa pendiente?
        desarrollo: |
          En el borde del cono la altura iguala a la distancia al eje, así que
          $\tan\varphi = 1$ y

          $$
          \varphi = \frac{\pi}{4} = 45°
          $$

          Los límites en esféricas quedan $r\in[0,2]$, $\varphi\in[0,\pi/4]$,
          $\theta\in[0,2\pi]$: **tres pares de números**, que es lo que se busca
          al elegir coordenadas.
      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Integrando, el volumen sale $\frac{8\pi}{3}\left(2-\sqrt{2}\right)$.
          ¿Cuánto vale?
        respuesta:
          tipo: numero
          valor: '4.9074'
          tolerancia: 0.02
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '33.51'
            mensaje: |
              $33{,}51$ es $32\pi/3$, el volumen de la **esfera entera** de radio
              2. El cono se queda con una fracción bastante menor.
          - valor: '16.755'
            mensaje: |
              Esa es la media esfera, $16\pi/3$. Falta recortar con el cono, que
              se lleva casi las dos terceras partes de lo que queda.
        pista: |
          $8\pi/3 \approx 8{,}378$, y $2-\sqrt{2}\approx 0{,}586$. Multiplica.
        desarrollo: |
          $$
          V = \int_{0}^{2\pi}\!\!\int_{0}^{\pi/4}\!\!\int_{0}^{2} r^{2}\text{sen}\,\varphi\;dr\,d\varphi\,d\theta
          = 2\pi\cdot\frac{8}{3}\cdot\bigl[-\cos\varphi\bigr]_{0}^{\pi/4}
          = \frac{16\pi}{3}\left(1-\frac{\sqrt2}{2}\right)
          $$

          que es $\dfrac{8\pi}{3}(2-\sqrt2) \approx 4{,}907$.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'a) En cilíndricas: $\rho$ de 0 a $\sqrt2$ dentro del cono, y $z$ del cono a la esfera.'
          - texto: 'b) En esféricas: $r\in[0,2]$, $\varphi\in[0,\pi/4]$, $\theta\in[0,2\pi]$, con jacobiano $r^{2}\text{sen}\,\varphi$.'
          - texto: 'c) Las dos integrales dan el mismo número, $\frac{8\pi}{3}(2-\sqrt2)$.'
          - texto: 'Las esféricas salen más cortas porque convierten el recinto en un bloque de límites constantes.'
          - texto: 'Como el sólido tiene un eje de simetría, las esféricas no valen y hay que usar cilíndricas.'
            trampa: true
            mensaje: |
              Tener eje de simetría es un argumento **a favor** de las
              cilíndricas, no en contra de las esféricas. Y aquí manda algo más
              fuerte: hay también simetría respecto de un punto —el centro de la
              esfera—, y por eso las esféricas son las que dejan todos los
              límites constantes.
    resolucion: |
      **El ejercicio existe para comparar los dos sistemas** sobre el mismo
      sólido, y el apartado c) deja elegir. Elegir bien es la mitad de la nota.

      **El sólido** es un cono de helado: la esfera de radio 2 recortada por el
      cono $z^{2}=x^{2}+y^{2}$, y con $z\ge 0$ solo la parte de arriba. El cono
      y la esfera se cortan donde $2\rho^{2}=4$, o sea $\rho=\sqrt2$.

      **a) En cilíndricas**, los límites de $z$ dependen de $\rho$, así que la
      integral es más incómoda:

      $$
      V = \int_{0}^{2\pi}\!\!\int_{0}^{\sqrt2}\!\!\int_{\rho}^{\sqrt{4-\rho^{2}}} \rho\;dz\,d\rho\,d\theta
      $$

      **b) En esféricas**, los tres límites son constantes:

      $$
      V = \int_{0}^{2\pi}\!\!\int_{0}^{\pi/4}\!\!\int_{0}^{2} r^{2}\text{sen}\,\varphi\;dr\,d\varphi\,d\theta
      $$

      **c) Calculando por la segunda**, que se separa en tres factores:

      $$
      V = 2\pi \cdot \frac{2^{3}}{3}\cdot\left(1-\frac{\sqrt2}{2}\right)
      = \frac{8\pi}{3}\left(2-\sqrt2\right) \approx 4{,}907
      $$

      > **Por qué las esféricas ganan aquí.** No es que las cilíndricas estén
      > mal: dan el mismo número. Es que en esféricas los tres límites son
      > números y la integral se parte en tres factores independientes; en
      > cilíndricas el límite superior de $z$ lleva una raíz que hay que
      > arrastrar. La regla de §07 en acción: **las coordenadas buenas son las
      > que convierten el recinto en un rectángulo.**

  - id: volumen-entre-dos-paraboloides
    titulo: El volumen encerrado entre dos paraboloides
    fuente: Ejercicio 7.25 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU (2019/2020 5E)
    nivel: examen
    enunciado: |
      Sea el sólido definido por las condiciones $x^{2}+4y^{2}\le z$ y
      $z\le 8-x^{2}-4y^{2}$. Dibujar el sólido y calcular su volumen.
    pide: El dibujo del sólido y su volumen.
    pasos:
      - tipo: reconocer
        pregunta: |
          El sólido está entre dos superficies. ¿Cómo se encuentra la sombra que
          proyecta sobre el plano $XY$?
        opciones:
          - texto: Igualando las dos superficies, para ver dónde se cortan
            correcta: true
            mensaje: |
              Sí. Donde las dos tapas se tocan está el borde del sólido, y su
              proyección es el recinto sobre el que hay que integrar.
          - texto: Poniendo z = 0 en las dos
            mensaje: |
              Eso da dónde cada superficie corta al suelo, que no es lo mismo.
              El sólido puede estar entero por encima del suelo, como aquí.
          - texto: Es siempre un círculo
            mensaje: |
              Aquí no lo es: los coeficientes de $x^{2}$ y de $y^{2}$ son
              distintos, así que sale una **elipse**. Y eso decide las
              coordenadas.
      - tipo: calcular
        titulo: Dónde se cortan las dos tapas
        pregunta: |
          Igualando $x^{2}+4y^{2} = 8-x^{2}-4y^{2}$, ¿a cuánto equivale
          $x^{2}+4y^{2}$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '8'
            mensaje: |
              8 es el término independiente. Al pasar todo a un lado quedan
              **dos** veces $x^{2}+4y^{2}$, así que hay que dividir entre 2.
          - valor: '2'
            mensaje: |
              Parece que has dividido 8 entre 4. La ecuación es
              $2(x^{2}+4y^{2}) = 8$, y de ahí sale 4.
        pista: |
          Pasa todo a la izquierda: $2(x^2+4y^2) = 8$.
        desarrollo: |
          $$
          x^{2}+4y^{2} = 8-x^{2}-4y^{2}
          \;\Longrightarrow\;
          2(x^{2}+4y^{2}) = 8
          \;\Longrightarrow\;
          x^{2}+4y^{2} = 4
          $$

          La sombra es la **elipse** $\frac{x^{2}}{4}+y^{2}=1$, de semiejes 2 y
          1. Y a esa altura, $z=4$.
      - tipo: calcular
        titulo: El volumen
        pregunta: |
          Integrando, el volumen sale $8\pi$. ¿Cuánto vale con cuatro decimales?
        respuesta:
          tipo: numero
          valor: '25.1327'
          tolerancia: 0.02
          formato: en forma exacta (8pi) o con cuatro decimales
        distractores:
          - valor: '12.566'
            mensaje: |
              $4\pi$ es la mitad. Es lo que sale si te olvidas de que hay **dos**
              tapas y calculas solo el volumen bajo una.
          - valor: '50.265'
            mensaje: |
              $16\pi$ es el doble. Probablemente has usado el jacobiano de las
              polares normales en vez del $ab\rho = 2\rho$ de las generalizadas.
        pista: |
          $8\pi$, con pi = 3,14159...
        desarrollo: |
          Con polares generalizadas $x=2\rho\cos\theta$, $y=\rho\,\text{sen}\,\theta$
          y jacobiano $2\rho$, la elipse pasa a ser $\rho\le 1$ y

          $$
          V = \int_{0}^{2\pi}\!\!\int_{0}^{1} \bigl(8-8\rho^{2}\bigr)\,2\rho\,d\rho\,d\theta
          = 2\pi\cdot 16\left(\tfrac{1}{2}-\tfrac{1}{4}\right) = 8\pi
          $$
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Las dos tapas se cortan donde $x^{2}+4y^{2}=4$, una elipse de semiejes 2 y 1.'
          - texto: 'El sólido está entre el paraboloide de abajo y el de arriba, sobre esa elipse.'
          - texto: 'La altura en cada punto es $\bigl(8-x^{2}-4y^{2}\bigr)-\bigl(x^{2}+4y^{2}\bigr) = 8-2(x^{2}+4y^{2})$.'
          - texto: 'Con polares generalizadas —jacobiano $2\rho$— la elipse pasa a ser $\rho\le 1$ y sale $V=8\pi$.'
          - texto: 'Como la sombra es una elipse, hay que integrar en cartesianas con raíces en los límites.'
            trampa: true
            mensaje: |
              Se puede, y es el camino largo. Justamente para eso están las
              polares **generalizadas**: meten los semiejes dentro del cambio y
              convierten la elipse en $\rho\le 1$, con límites constantes.
    resolucion: |
      **El sólido** es una lente: un paraboloide elíptico que abre hacia arriba
      y otro que abre hacia abajo, encerrando el trozo entre los dos.

      **La sombra.** Donde se tocan las dos tapas:

      $$
      x^{2}+4y^{2} = 8-x^{2}-4y^{2}
      \;\Longrightarrow\;
      x^{2}+4y^{2}=4
      \;\Longleftrightarrow\;
      \frac{x^{2}}{4}+y^{2}=1
      $$

      Una elipse de semiejes $a=2$ y $b=1$, y las tapas se encuentran a altura
      $z=4$.

      **La altura del sólido** en cada punto de esa sombra:

      $$
      h(x,y) = \bigl(8-x^{2}-4y^{2}\bigr)-\bigl(x^{2}+4y^{2}\bigr) = 8-2(x^{2}+4y^{2})
      $$

      **El cambio.** Polares generalizadas con $a=2$, $b=1$, jacobiano $2\rho$, y
      la elipse se convierte en $\rho\le 1$. Además $x^{2}+4y^{2} = 4\rho^{2}$:

      $$
      V = \int_{0}^{2\pi}\!\!\int_{0}^{1}\bigl(8-8\rho^{2}\bigr)\,2\rho\;d\rho\,d\theta
      = 16\cdot 2\pi\int_{0}^{1}(\rho-\rho^{3})\,d\rho
      = 32\pi\left(\tfrac12-\tfrac14\right) = 8\pi
      $$

      **La comprobación de plausibilidad**, que vale un punto de COMP4: el
      sólido cabe en un cilindro elíptico de base $\pi ab = 2\pi$ y altura 8,
      o sea $16\pi$. Sale $8\pi$, la mitad exacta — razonable para una lente
      que se estrecha hacia el borde. ✓

  - id: cono-y-paraboloide
    titulo: Un cono y un paraboloide, volumen y superficie
    fuente: Ejercicio 7.19 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU (2016/2017 6E)
    nivel: examen
    enunciado: |
      Sea el sólido definido por las condiciones $x^{2}+y^{2}\le z^{2}$,
      $z\le 2-x^{2}-y^{2}$ y $z\ge 0$. Dibujar el sólido, calcular su volumen y
      el área de su superficie.
    pide: El dibujo, el volumen y el área de la superficie.
    pasos:
      - tipo: reconocer
        pregunta: |
          El sólido está limitado por un cono por debajo y un paraboloide por
          arriba. ¿Dónde está el borde?
        opciones:
          - texto: Donde el cono y el paraboloide se cortan
            correcta: true
            mensaje: |
              Sí, y esa intersección da el radio de la sombra. Igualando
              $\rho = 2-\rho^{2}$ sale $\rho = 1$.
          - texto: En z = 0, donde el cono toca el suelo
            mensaje: |
              El cono toca el suelo solo en un punto, el vértice. El borde del
              sólido está arriba, donde las dos superficies se encuentran.
          - texto: En z = 2, el vértice del paraboloide
            mensaje: |
              Ese es el punto más alto del paraboloide, pero el sólido no llega
              ahí: el cono lo corta antes.
      - tipo: calcular
        titulo: El radio de la intersección
        pregunta: |
          En cilíndricas, el cono es $z=\rho$ y el paraboloide $z=2-\rho^{2}$.
          Igualando, ¿cuál es el valor positivo de $\rho$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es el término independiente del paraboloide, no la raíz. De
              $\rho^{2}+\rho-2=0$ sale $(\rho+2)(\rho-1)=0$, y la positiva es 1.
          - valor: '1.414'
            mensaje: |
              $\sqrt2$ saldría de $\rho^{2}=2$, o sea de olvidar el término
              lineal. La ecuación completa es $\rho^{2}+\rho-2=0$.
        pista: |
          $\rho = 2-\rho^2$ es $\rho^2+\rho-2=0$. Factoriza.
        desarrollo: |
          $$
          \rho = 2-\rho^{2}
          \;\Longrightarrow\;
          \rho^{2}+\rho-2 = 0
          \;\Longrightarrow\;
          (\rho+2)(\rho-1)=0
          $$

          La raíz positiva es $\rho=1$, y ahí $z=1$. La sombra es el círculo
          unidad.
      - tipo: calcular
        titulo: El volumen
        pregunta: |
          El volumen sale $\frac{5\pi}{6}$. ¿Cuánto vale con cuatro decimales?
        respuesta:
          tipo: numero
          valor: '2.618'
          tolerancia: 0.02
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.0472'
            mensaje: |
              $\pi/3$ es solo el volumen del cono hasta $z=1$. Falta el casquete
              de paraboloide que va encima.
          - valor: '4.7124'
            mensaje: |
              $3\pi/2$ sería el volumen bajo el paraboloide sin restarle el cono.
              El sólido es lo que queda **entre** los dos.
        pista: |
          $5\pi/6$, con pi = 3,14159...
        desarrollo: |
          $$
          V = \int_{0}^{2\pi}\!\!\int_{0}^{1}\bigl[(2-\rho^{2})-\rho\bigr]\rho\;d\rho\,d\theta
          = 2\pi\int_{0}^{1}\bigl(2\rho-\rho^{3}-\rho^{2}\bigr)d\rho
          = 2\pi\left(1-\tfrac14-\tfrac13\right) = \frac{5\pi}{6}
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'En cilíndricas el cono es $z=\rho$ y el paraboloide $z=2-\rho^{2}$.'
          - texto: 'Se cortan en $\rho=1$, así que la sombra es el círculo unidad.'
          - texto: 'El volumen es la integral de la diferencia de alturas, y sale $5\pi/6$.'
          - texto: 'El área de la superficie son **dos** trozos: el lateral del cono y el casquete del paraboloide.'
          - texto: 'El área de la superficie es el perímetro del círculo unidad por la altura.'
            trampa: true
            mensaje: |
              Eso sería el área lateral de un cilindro. Aquí las dos tapas son
              curvas y hay que integrar cada una con su elemento de superficie:
              el cono aporta $\sqrt2\,\pi$ y el paraboloide
              $\frac{\pi}{6}(5\sqrt5-1)$.
    resolucion: |
      **El sólido** es la lente entre un cono que abre hacia arriba desde el
      origen y un paraboloide que abre hacia abajo desde $z=2$.

      **El borde.** En cilíndricas, cono $z=\rho$ y paraboloide $z=2-\rho^{2}$:

      $$
      \rho^{2}+\rho-2=0 \;\Longrightarrow\; \rho=1
      $$

      La sombra es el círculo unidad, y las dos superficies se tocan a altura
      $z=1$.

      **El volumen**, integrando la diferencia de alturas con jacobiano $\rho$:

      $$
      V = 2\pi\int_{0}^{1}\bigl(2-\rho^{2}-\rho\bigr)\rho\,d\rho
      = 2\pi\left(1-\tfrac14-\tfrac13\right) = \frac{5\pi}{6} \approx 2{,}618
      $$

      **El área de la superficie** son **dos** trozos, y ese es el detalle que
      se pierde:

      $$
      A = A_{\text{cono}} + A_{\text{paraboloide}}
      = \sqrt2\,\pi + \frac{\pi}{6}\bigl(5\sqrt5-1\bigr)
      $$

      > **Por qué el área es más difícil que el volumen.** El volumen se integra
      > sobre la sombra con la diferencia de alturas: una sola integral. El área
      > exige recorrer **cada superficie curva por separado**, con su propio
      > elemento $\sqrt{1+z_x^{2}+z_y^{2}}$. Enumerar los trozos antes de
      > integrar es lo que evita dejarse uno.

  - id: centro-de-gravedad-de-una-figura
    titulo: El centro de gravedad de una figura recortada
    fuente: Ejercicio 7.22 · Problemas complementarios, tema 7 · Cálculo, UPV/EHU (2018/2019 5E)
    nivel: examen
    enunciado: |
      Calcular el centro de gravedad del dominio plano formado por el cuarto de
      corona circular del primer cuadrante comprendido entre los radios 1 y 2,
      es decir, el recinto $1\le x^{2}+y^{2}\le 4$ con $x\ge 0$ e $y\ge 0$. La
      densidad es constante.
    pide: Las coordenadas del centro de gravedad.
    pasos:
      - tipo: reconocer
        pregunta: |
          El recinto es simétrico respecto de la recta $y=x$. ¿Qué se deduce sin
          calcular nada?
        opciones:
          - texto: Que las dos coordenadas del centro de gravedad coinciden
            correcta: true
            mensaje: |
              Exacto, y eso ahorra media integral. Basta calcular una y decir
              que la otra vale lo mismo **por simetría** — y decirlo puntúa.
          - texto: Que el centro de gravedad está en el origen
            mensaje: |
              El origen ni siquiera pertenece al recinto: hay un agujero de
              radio 1. La simetría dice que está **sobre la recta** $y=x$, no
              dónde exactamente.
          - texto: Que las dos coordenadas son opuestas
            mensaje: |
              Serían opuestas con simetría respecto de $y=-x$. Aquí el eje de
              simetría es la bisectriz del primer cuadrante, así que coinciden.
      - tipo: calcular
        titulo: El área del recinto
        pregunta: |
          Es un cuarto de corona entre radios 1 y 2. ¿Cuánto vale su área?
        respuesta:
          tipo: numero
          valor: '2.3562'
          tolerancia: 0.02
          formato: en forma exacta (3pi/4) o con cuatro decimales
        distractores:
          - valor: '9.4248'
            mensaje: |
              $3\pi$ es la corona **entera**, sin quedarse con un cuarto. Hay
              que dividir entre 4.
          - valor: '3.1416'
            mensaje: |
              $\pi$ sería el cuarto de círculo de radio 2 sin restarle el
              agujero. El agujero se lleva $\pi/4$.
        pista: |
          Cuarto de círculo de radio 2 menos cuarto de radio 1: $(4\pi - \pi)/4$.
        desarrollo: |
          $$
          A = \frac{\pi\cdot 2^{2}}{4} - \frac{\pi\cdot 1^{2}}{4}
          = \frac{3\pi}{4} \approx 2{,}356
          $$
      - tipo: calcular
        titulo: La coordenada del centro
        pregunta: |
          El momento vale $\frac{7}{3}$, y el área $\frac{3\pi}{4}$. ¿Cuánto
          vale $\overline{x}$?
        respuesta:
          tipo: numero
          valor: '0.9905'
          tolerancia: 0.01
          formato: en forma exacta (28/9pi) o con cuatro decimales
        distractores:
          - valor: '2.3333'
            mensaje: |
              $7/3$ es el **momento**, no la coordenada. Falta dividir entre el
              área.
          - valor: '1.5'
            mensaje: |
              $1{,}5$ es el radio medio de la corona, y sería la respuesta si la
              masa estuviera repartida por igual en el radio. No lo está: hay
              más área lejos del centro, y aun así el centro cae más cerca
              porque el recinto se abre.
        pista: |
          $(7/3)$ dividido entre $(3\pi/4)$, que es $28/(9\pi)$.
        desarrollo: |
          $$
          \overline{x} = \frac{7/3}{3\pi/4} = \frac{28}{9\pi} \approx 0{,}9905
          $$

          Y por simetría $\overline{y}$ vale lo mismo.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'Por simetría respecto de $y=x$, se cumple $\overline{x}=\overline{y}$: basta una integral.'
          - texto: 'En polares el recinto es $\rho\in[1,2]$, $\theta\in[0,\pi/2]$, con jacobiano $\rho$.'
          - texto: 'El momento es $\iint x\,dA = \int\!\!\int \rho\cos\theta\cdot\rho\,d\rho\,d\theta = 7/3$.'
          - texto: 'Dividiendo entre el área $3\pi/4$ sale $\overline{x}=\overline{y}=28/(9\pi)\approx 0{,}99$.'
          - texto: 'El resultado tiene que caer dentro del recinto, y $0{,}99$ está entre 1 y 2, así que cuadra.'
            trampa: true
            mensaje: |
              $0{,}99$ **no** está entre 1 y 2 — está justo por debajo de 1. Y no
              pasa nada: el centro de gravedad de una figura cóncava puede caer
              **fuera** de ella, como en una herradura. Aquí el punto
              $(0{,}99;\,0{,}99)$ está a distancia $1{,}40$ del origen, o sea
              dentro de la corona; lo que falla es el razonamiento, no el número.
    resolucion: |
      **La simetría primero**, que ahorra media respuesta. El recinto es
      simétrico respecto de la bisectriz $y=x$, así que

      $$
      \overline{x} = \overline{y}
      $$

      y basta calcular una. **Decirlo justificado vale tanto como la integral
      que te ahorras.**

      **En polares** el recinto es un rectángulo: $\rho\in[1,2]$,
      $\theta\in[0,\pi/2]$.

      **El área:**

      $$
      A = \int_{0}^{\pi/2}\!\!\int_{1}^{2}\rho\,d\rho\,d\theta
      = \frac{\pi}{2}\cdot\frac{3}{2} = \frac{3\pi}{4}
      $$

      **El momento**, con $x = \rho\cos\theta$:

      $$
      \iint x\,dA = \int_{0}^{\pi/2}\!\!\cos\theta\,d\theta\int_{1}^{2}\rho^{2}d\rho
      = 1\cdot\frac{7}{3} = \frac{7}{3}
      $$

      **El centro:**

      $$
      \boxed{\;\overline{x} = \overline{y} = \frac{7/3}{3\pi/4} = \frac{28}{9\pi} \approx 0{,}99\;}
      $$

      > **El control de plausibilidad, con matiz.** El punto
      > $(0{,}99;\,0{,}99)$ está a distancia $\sqrt{2}\cdot 0{,}99 \approx 1{,}40$
      > del origen: entre 1 y 2, dentro de la corona. ✓ Pero cuidado con
      > generalizar: **el centro de gravedad de una figura cóncava puede caer
      > fuera de ella**. Comprobar que «está dentro» no es una demostración, es
      > un indicio.
