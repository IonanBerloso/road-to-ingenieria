  - id: ej-green-en-un-triangulo
    titulo: Green en un triángulo, con el integrando constante
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Calcular $\displaystyle\oint_C (-y)\,dx + x\,dy$, donde $C$ es el borde
      del triángulo de vértices $(0,0)$, $(4,0)$ y $(0,3)$, recorrido en
      sentido antihorario.
    pide: El valor de la integral sobre el contorno cerrado.
    pasos:
      - tipo: reconocer
        pregunta: |
          El borde son **tres** segmentos. ¿Qué hace Green con ellos?
        opciones:
          - texto: >-
              Los cambia por una sola integral doble sobre el triángulo, sin
              parametrizar ninguno
            correcta: true
            mensaje: |
              Eso es lo que compensa. Tres tramos son tres parametrizaciones y
              tres integrales; la doble es una, y aquí además el integrando
              sale constante.
          - texto: Los suma después de parametrizar cada uno
            mensaje: |
              Eso es hacerlo **sin** Green, que también llega al mismo número
              pero cuesta el triple. Green existe precisamente para no tener
              que recorrer el borde.
          - texto: Los reduce a dos, porque uno está sobre un eje
            mensaje: |
              Que un tramo esté sobre un eje simplifica esa integral, pero no
              es lo que hace Green. Green cambia **todo** el borde por el
              interior.
      - tipo: calcular
        titulo: El integrando de la doble
        pregunta: |
          Con $P = -y$ y $Q = x$, ¿cuánto vale $Q_x - P_y$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              $0$ saldría de $1 - 1$, o sea de olvidar el signo menos de
              $P=-y$. Como $P_y = -1$, la resta es $1-(-1) = 2$. Y si valiera
              cero el campo sería conservativo y la integral sería cero.
          - valor: '1'
            mensaje: |
              $1$ es solo $Q_x$. Falta restarle $P_y$, que vale $-1$: restar un
              negativo suma.
          - valor: '-2'
            mensaje: |
              Signo cambiado: es $Q_x - P_y$, no $P_y - Q_x$. El orden importa
              y es el que hace que el sentido antihorario dé positivo.
        pista: |
          $Q_x = 1$ y $P_y = -1$. Réstalos en ese orden.
        desarrollo: |
          $$
          Q_x = \frac{\partial}{\partial x}(x) = 1,
          \qquad
          P_y = \frac{\partial}{\partial y}(-y) = -1
          $$

          $$
          Q_x - P_y = 1 - (-1) = 2
          $$

          Es **constante**, así que la integral doble se convierte en dos veces
          el área.
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La curva es cerrada y va en sentido antihorario: Green se puede aplicar.'
          - texto: '$Q_x - P_y = 1-(-1) = 2$, constante en todo el plano.'
          - texto: 'Luego $\oint_C = \iint_D 2\,dA = 2\cdot\text{área}(D)$.'
          - texto: 'El triángulo tiene área $\frac{4\cdot3}{2}=6$, así que la integral vale 12.'
          - texto: 'Si la curva se recorriera en sentido horario el resultado sería el mismo, porque es cerrada.'
            trampa: true
            mensaje: |
              Sería $-12$. El sentido es una de las tres hipótesis de Green
              precisamente porque cambia el signo: recorrer el borde al revés
              equivale a cambiar el orden de los extremos en cada tramo. Que la
              curva sea cerrada no borra su orientación.
    resolucion: |
      **Las tres condiciones, dichas antes de empezar:** la curva es cerrada ✓,
      se recorre en sentido antihorario ✓, y $P$ y $Q$ son polinomios, con
      parciales continuas en todo el plano ✓ Green se puede aplicar.

      $$
      Q_x - P_y = \frac{\partial x}{\partial x} - \frac{\partial(-y)}{\partial y}
      = 1 - (-1) = 2
      $$

      **Y aquí está la gracia:** el integrando es **constante**, así que la
      integral doble no hay ni que plantearla con límites.

      $$
      \oint_C (-y)\,dx + x\,dy
      = \iint_D 2\,dA
      = 2\,\text{área}(D)
      $$

      El triángulo tiene catetos 4 y 3:

      $$
      \text{área}(D) = \frac{4\cdot 3}{2} = 6
      \qquad\Longrightarrow\qquad
      \boxed{\;\oint_C = 12\;}
      $$

      > **Este caso concreto es una fórmula que conviene reconocer.** Cuando
      > $Q_x-P_y$ vale una constante $k$, la integral de línea es $k$ por el
      > área encerrada — y con $k=2$, como aquí, la integral vale **el doble del
      > área**. Eso se usa en los dos sentidos: para calcular la integral
      > sabiendo el área, y para calcular el área sabiendo la integral. Los
      > exámenes lo piden de las dos formas, y tres años seguidos lo pidieron
      > con una curva de la que no se daba la ecuación, solo el área.

      <figure class="figura-examen">
      <svg viewBox="0 0 320 250" role="img" width="320" height="250"
           aria-labelledby="f-ej-green-triangulo-t f-ej-green-triangulo-d">
