        <title id="f-astroide-t">La astroide inscrita en el cuadrado de lado dos</title>
        <desc id="f-astroide-d">La curva tiene cuatro picos, uno en cada uno de los puntos uno coma cero, cero coma uno, menos uno coma cero y cero coma menos uno. Entre pico y pico el trazo no es recto sino que se hunde hacia el centro, de modo que la figura parece una estrella de cuatro puntas con los lados cóncavos. El interior está sombreado. Alrededor, con trazo discontinuo, el cuadrado de vértices más y menos uno en cada eje, que la curva toca solo en los cuatro picos.</desc>
