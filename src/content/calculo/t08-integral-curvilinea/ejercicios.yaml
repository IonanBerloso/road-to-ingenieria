  - id: tres-caminos-mismo-trabajo
    titulo: Tres curvas, y el atajo que las contesta todas
    fuente: Ejercicio 8.8 · Problemas complementarios, tema 8 · Cálculo, UPV/EHU (2015/2016 5E)
    nivel: examen
    enunciado: |
      Calcular el valor de
      $I = \int_C (6xy^{2}-y^{3})\,dx + (6x^{2}y-3xy^{2})\,dy$
      para cada una de las siguientes curvas $C$:

      a) $C$ es el segmento de recta $AB$, con $A(1,2)$ y $B(3,4)$.
      b) $C$ es el arco de circunferencia de centro $(2,3)$ que pasa por los
      puntos $A(1,2)$ y $B(3,4)$.
      c) $C$ es toda la circunferencia del apartado anterior.
    pide: El valor de la integral en las tres curvas.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado pide la misma integral sobre tres curvas distintas. ¿Qué
          sugiere eso antes de calcular nada?
        opciones:
          - texto: Que conviene comprobar si el campo es conservativo
            correcta: true
            mensaje: |
              Exacto. Un enunciado con tres caminos entre los mismos puntos casi
              siempre está pidiendo que descubras que da igual el camino. Y el
              apartado c) —la curva cerrada— lo confirma.
          - texto: Que hay que parametrizar las tres y hacer tres integrales
            mensaje: |
              Se puede, y el arco de circunferencia sale largo. Pero si el campo
              es conservativo las tres se contestan de golpe, y eso es lo que el
              ejercicio evalúa.
          - texto: Que las tres darán resultados distintos
            mensaje: |
              Es lo que se comprueba, no lo que se supone. Y aquí resulta que
              a) y b) coinciden, precisamente porque el campo es conservativo.
      - tipo: calcular
        titulo: La comprobación
        pregunta: |
          Con $P = 6xy^{2}-y^{3}$, $\partial P/\partial y = 12xy - 3y^{2}$.
          ¿Cuánto vale en el punto $(1,2)$?
        respuesta:
          tipo: numero
          valor: '12'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '24'
            mensaje: |
              Parece que te has dejado el término $-3y^{2}$, que en $(1,2)$ resta
              12. $12\cdot 1\cdot 2 = 24$, y $24-12 = 12$.
          - valor: '0'
            mensaje: |
              0 saldría si los dos términos se cancelaran, y no lo hacen aquí:
              $24 - 12 = 12$.
        pista: |
          $12(1)(2) - 3(2)^2 = 24 - 12$.
        desarrollo: |
          $$
          P_y = 12xy-3y^{2}
          \qquad\Longrightarrow\qquad
          P_y(1,2) = 24-12 = 12
          $$

          Y $Q = 6x^{2}y-3xy^{2}$ da $Q_x = 12xy-3y^{2}$, **la misma expresión**.
          El campo es conservativo.
      - tipo: calcular
        titulo: El valor en el punto B
        pregunta: |
          El potencial es $F(x,y) = 3x^{2}y^{2}-xy^{3}$. ¿Cuánto vale $F(3,4)$?
        respuesta:
          tipo: numero
          valor: '240'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '432'
            mensaje: |
              432 es solo el primer término, $3\cdot 9\cdot 16$. Falta restarle
              $xy^{3} = 3\cdot 64 = 192$.
          - valor: '624'
            mensaje: |
              Has sumado los dos términos en vez de restar. El potencial es
              $3x^{2}y^{2} - xy^{3}$, con signo menos.
        pista: |
          $3(9)(16) - 3(64) = 432 - 192$.
        desarrollo: |
          $$
          F(3,4) = 3\cdot 3^{2}\cdot 4^{2} - 3\cdot 4^{3}
          = 432 - 192 = 240
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta completa. Una pieza es falsa.
        piezas:
          - texto: '$P_y = Q_x = 12xy-3y^{2}$, luego el campo es conservativo.'
          - texto: 'El potencial es $F(x,y)=3x^{2}y^{2}-xy^{3}$, y se comprueba derivando.'
          - texto: 'a) y b) valen lo mismo, $F(B)-F(A) = 240-4 = 236$, porque la integral no depende del camino.'
          - texto: 'c) Sobre la circunferencia entera vale 0, porque es una curva cerrada y el campo es conservativo.'
          - texto: 'c) Sobre la circunferencia entera vale el doble que en el arco, porque se recorre dos veces.'
            trampa: true
            mensaje: |
              Una curva cerrada empieza y acaba en el mismo punto, así que
              $F(B)-F(A) = F(A)-F(A) = 0$. No se recorre dos veces nada: se da
              una vuelta y se vuelve al principio.
    resolucion: |
      **Los tres apartados son el mismo ejercicio**, y verlo es la mitad de la
      nota.

      **Paso 1 — ¿es conservativo?**

      $$
      P = 6xy^{2}-y^{3}
      \;\Longrightarrow\;
      P_y = 12xy-3y^{2}
      $$

      $$
      Q = 6x^{2}y-3xy^{2}
      \;\Longrightarrow\;
      Q_x = 12xy-3y^{2}
      $$

      Coinciden. **El campo es conservativo**, y con eso los tres apartados se
      resuelven sin parametrizar ni una curva.

      **Paso 2 — el potencial.** Integrando $P$ respecto de $x$:

      $$
      F = 3x^{2}y^{2}-xy^{3} + g(y)
      $$

      Derivando respecto de $y$ e igualando a $Q$:

      $$
      6x^{2}y-3xy^{2}+g'(y) = 6x^{2}y-3xy^{2}
      \;\Longrightarrow\;
      g'(y)=0
      $$

      Así que $F(x,y) = 3x^{2}y^{2}-xy^{3}$, tomando la constante nula.

      **Paso 3 — los tres apartados.**

      | | curva | valor |
      |---|---|---|
      | a) | segmento $AB$ | $F(3,4)-F(1,2) = 240-4 = 236$ |
      | b) | arco de circunferencia de $A$ a $B$ | **236**, el mismo |
      | c) | circunferencia entera | **0** |

      **a) y b) coinciden** porque la integral de un campo conservativo solo
      depende de los extremos, y los dos caminos van de $A$ a $B$.

      **c) vale cero** porque la curva es cerrada: sale y llega al mismo punto,
      así que $F(A)-F(A)=0$.

      > **Lo que este ejercicio evalúa no es integrar.** Parametrizar el arco de
      > circunferencia y sustituirlo en ese campo de tercer grado es un cuarto de
      > hora de cuentas que no hacen falta. Evalúa si compruebas
      > $P_y = Q_x$ antes de empezar.

  - id: green-en-un-recinto-cerrado
    titulo: Green, y el trabajo a lo largo de un contorno
    fuente: Ejercicio 8.9 · Problemas complementarios, tema 8 · Cálculo, UPV/EHU (2014/2015 7E)
    nivel: examen
    enunciado: |
      a) Calcular el trabajo realizado por el campo vectorial
      $V(x,y) = (3x^{2}+y^{2},\; 2xy)$ desde el punto $A$ hasta el punto $B$ a lo
      largo de cada una de las trayectorias $C_1$, $C_2$ y $C_3$.

      b) Aplicando el teorema de Green, calcular el trabajo realizado por el
      campo vectorial $W(x,y) = (x-y^{3},\; x^{3}+y)$ a lo largo del contorno del
      recinto encerrado por las curvas $C_1$ y $C_3$.
    pide: El trabajo por los tres caminos, y el del contorno cerrado con Green.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado b) el enunciado **ordena** usar Green. ¿Qué tres
          condiciones hay que comprobar antes de aplicarlo?
        opciones:
          - texto: Curva cerrada, sentido antihorario, y parciales continuas en toda la región
            correcta: true
            mensaje: |
              Esas tres, y decirlas puntúa en COMP4 aunque el enunciado no las
              pida explícitamente. La tercera es la que se olvida.
          - texto: Que el campo sea conservativo
            mensaje: |
              Justo al revés: si el campo fuera conservativo la integral sobre
              una curva cerrada valdría cero y Green sobraría. Green sirve
              precisamente cuando **no** lo es.
          - texto: Que la región sea un círculo
            mensaje: |
              Green vale para cualquier región razonable con borde cerrado, no
              solo para círculos.
      - tipo: calcular
        titulo: El integrando de Green
        pregunta: |
          Para $W = (x-y^{3},\; x^{3}+y)$, ¿cuánto vale
          $\partial Q/\partial x - \partial P/\partial y$ en el punto $(1,1)$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              0 saldría si el campo fuera conservativo, y no lo es:
              $Q_x = 3x^{2}$ y $P_y = -3y^{2}$, que en $(1,1)$ dan $3-(-3)=6$.
          - valor: '3'
            mensaje: |
              Parece que te has quedado solo con $Q_x = 3$. Falta restar
              $P_y = -3$, y restar un negativo suma.
        pista: |
          $Q_x = 3x^2$ y $P_y = -3y^2$. La resta es $3 - (-3)$.
        desarrollo: |
          $$
          Q_x = 3x^{2},
          \qquad
          P_y = -3y^{2}
          $$

          $$
          Q_x - P_y = 3x^{2}+3y^{2}
          \qquad\Longrightarrow\qquad
          \text{en }(1,1):\; 6
          $$

          Fíjate en lo que ha aparecido: $3(x^{2}+y^{2})$, que en polares es
          $3\rho^{2}$. **Green ha convertido un problema de curvas en una
          integral doble que pide polares.**
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento del apartado a). Una pieza es falsa.
        piezas:
          - texto: 'Para $V=(3x^{2}+y^{2},\,2xy)$: $P_y = 2y$ y $Q_x = 2y$, coinciden.'
          - texto: 'Luego $V$ es conservativo y las tres trayectorias dan el mismo trabajo.'
          - texto: 'Su potencial es $F = x^{3}+xy^{2}$, y basta evaluar $F(B)-F(A)$.'
          - texto: 'Por eso el apartado a) se contesta una sola vez, no tres.'
          - texto: 'Y como $V$ es conservativo, también se puede aplicar Green a $V$ para el apartado b).'
            trampa: true
            mensaje: |
              El apartado b) usa **otro campo**, $W$, no $V$. Y ahí está la
              gracia del ejercicio: el primero es conservativo y el segundo no,
              y por eso a cada uno le toca una herramienta distinta.
    resolucion: |
      **El ejercicio enfrenta los dos atajos**, uno en cada apartado, y con dos
      campos distintos a propósito.

      **a) El campo $V$ es conservativo.**

      $$
      P_y = \frac{\partial}{\partial y}(3x^{2}+y^{2}) = 2y,
      \qquad
      Q_x = \frac{\partial}{\partial x}(2xy) = 2y
      $$

      Coinciden, luego existe potencial. Integrando $P$ en $x$:

      $$
      F = x^{3}+xy^{2}+g(y),
      \qquad
      F_y = 2xy + g'(y) = 2xy
      \;\Longrightarrow\;
      g'(y)=0
      $$

      $$
      F(x,y) = x^{3}+xy^{2}
      $$

      **Las tres trayectorias dan el mismo trabajo**, $F(B)-F(A)$, y eso es la
      respuesta completa del apartado. No hay que parametrizar ninguna.

      **b) El campo $W$ no es conservativo**, y por eso toca Green.

      $$
      Q_x - P_y = 3x^{2} - (-3y^{2}) = 3(x^{2}+y^{2})
      $$

      $$
      \oint_C W\cdot d\vec r = \iint_D 3(x^{2}+y^{2})\,dA
      $$

      Y esa integral doble, con un $x^{2}+y^{2}$ dentro y un recinto limitado por
      un arco, **pide polares** (tema 7): pasa a $3\rho^{2}$ con jacobiano
      $\rho$, o sea $3\rho^{3}$.

      > **La lección de los dos apartados juntos.** Ante una integral curvilínea
      > hay que preguntarse dos cosas en este orden: ¿es conservativo? y ¿está
      > cerrada la curva? La primera respuesta afirmativa te ahorra el trabajo
      > entero; la segunda te lo cambia por una integral doble. Solo si las dos
      > fallan hay que parametrizar.
