      <figcaption>Los cinco recintos de Green, con su sentido. Dos de ellos —el cuarto de corona y el triángulo— vienen recorridos en sentido horario, y eso cambia el signo del resultado: el teorema se enuncia para el sentido positivo.</figcaption>
