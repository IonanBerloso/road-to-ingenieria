  - id: ej-la-masa-de-un-alambre-recto
    titulo: La masa de un alambre recto, y el módulo que la otra integral no lleva
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre la integral respecto de
      la longitud de arco del tema 8. Es deliberadamente un segmento, para que
      el peldaño siguiente —el cuarto de circunferencia del examen de
      2021-2022— sea el que introduce la curva. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un alambre recto va del punto $A(0,0)$ al $B(3,4)$, y su densidad en
      cada punto vale $f(x,y) = x + y$.

      a) ¿Cuánto mide el alambre?

      b) ¿Cuánta masa tiene?
    pide: La longitud del alambre y su masa.
    pasos:
      - tipo: reconocer
        pregunta: |
          En $\int_C f\,d\ell$, ¿qué es exactamente $d\ell$?
        opciones:
          - texto: >-
              Un trocito de longitud de la curva, que en la parametrización
              vale $\lVert \vec r\,'(t)\rVert\,dt$
            correcta: true
            mensaje: |
              Eso es. El parámetro $t$ puede correr deprisa o despacio; lo que
              mide el alambre es la curva, no el parámetro, y el módulo de la
              velocidad es el factor de conversión entre los dos.
          - texto: >-
              Lo mismo que $dt$, solo que escrito de otra manera
            mensaje: |
              Solo coinciden si la curva se recorre a velocidad uno, que casi
              nunca pasa. Aquí $t$ va de 0 a 1 mientras el alambre mide 5: cada
              unidad de parámetro son **cinco** unidades de alambre.
          - texto: >-
              La proyección del trocito sobre el eje X, o sea $dx$
            mensaje: |
              Eso es la integral de la **primera** especie, la del trabajo, y
              es otra cosa: depende del sentido del recorrido y no lleva
              módulo. Esta no depende del sentido, porque la masa de un cable
              es la misma se mida desde un extremo o desde el otro.

      - tipo: calcular
        titulo: El módulo de la velocidad
        pregunta: |
          Parametrizando $\vec r(t) = (3t,\ 4t)$ con $t\in[0,1]$, ¿cuánto vale
          $\lVert \vec r\,'(t)\rVert$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '25'
            mensaje: |
              Te has quedado en $x'^{2}+y'^{2} = 9+16 = 25$ y falta la raíz.
              El módulo de un vector lleva raíz siempre.
          - valor: '7'
            mensaje: |
              Has sumado las componentes, $3+4$, en vez de sus cuadrados. Eso
              sería recorrer los dos catetos; el alambre va por la hipotenusa.
        pista: |
          $\vec r\,'(t) = (3,4)$, constante. Es el triángulo más conocido que
          existe.
        desarrollo: |
          $$
          \lVert \vec r\,'(t)\rVert = \sqrt{3^{2}+4^{2}} = \sqrt{25} = 5
          $$

          Constante, porque el alambre es recto y lo recorremos a velocidad
          uniforme. En cuanto la curva deje de ser recta este módulo dependerá
          de $t$ y habrá que arrastrarlo dentro de la integral.

      - tipo: calcular
        titulo: La longitud
        pregunta: |
          ¿Cuánto mide el alambre?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Has integrado $dt$ en vez de $d\ell$: eso te da cuánto ha
              avanzado el **parámetro**, no el alambre. Falta el módulo.
          - valor: '7'
            mensaje: |
              Esa es la longitud de los dos catetos, 3 más 4. El alambre es la
              hipotenusa.
        pista: |
          Con $f = 1$, la integral de $d\ell$ es la longitud.
        desarrollo: |
          $$
          L = \int_C d\ell = \int_0^{1} 5\,dt = 5
          $$

          Y aquí está la comprobación que conviene hacerse siempre que se
          pueda: la distancia entre $(0,0)$ y $(3,4)$ es 5 por Pitágoras, sin
          integrar nada. **Cuando el resultado se puede verificar por geometría
          elemental, se verifica**, porque es la única forma barata de saber si
          el módulo estaba bien puesto.

      - tipo: calcular
        titulo: La masa
        pregunta: |
          ¿Cuánta masa tiene el alambre?
        respuesta:
          tipo: numero
          valor: '17.5'
          tolerancia: 0.001
          formato: un número, en forma exacta (35/2) o con un decimal
        distractores:
          - valor: '3.5'
            mensaje: |
              Te has dejado el módulo: has integrado $f\,dt$ en lugar de
              $f\,d\ell$. El factor que falta es 5, el mismo de antes, y por
              eso este error da siempre un resultado cinco veces menor.
          - valor: '35'
            mensaje: |
              Has olvidado que $\int_0^{1} t\,dt$ vale $1/2$, no 1. El
              integrando es $35\,t$, no 35.
        pista: |
          Sustituye $x$ e $y$ por su parametrización, multiplica por el módulo
          e integra entre 0 y 1.
        desarrollo: |
          $$
          m = \int_C (x+y)\,d\ell = \int_0^{1} (3t+4t)\cdot 5\,dt
          = 35\int_0^{1} t\,dt = \frac{35}{2} = 17{,}5
          $$

          Se puede comprobar sin integrar: la densidad va de 0 en $A$ a 7 en
          $B$ y crece de forma lineal, así que su media es $3{,}5$; por los 5
          de longitud, 17,5. Que la media aritmética valga aquí es un lujo del
          caso lineal y no se puede usar en general — pero cuando se puede,
          confirma el resultado en diez segundos.

      - tipo: justificar
        pregunta: Ordena el planteamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El alambre es una curva, así que se parametriza: $\vec r(t) =
              (3t, 4t)$ con $t$ de 0 a 1.
          - texto: >-
              El diferencial de longitud es el módulo de la velocidad por
              $dt$, y aquí vale 5 para todo $t$.
          - texto: >-
              Con $f=1$ sale la longitud, 5; con $f=x+y$ sale la masa, 17,5.
          - texto: >-
              Y si el alambre se recorriera de $B$ a $A$, la masa saldría
              $-17{,}5$.
            trampa: true
            mensaje: |
              Saldría 17,5 otra vez. Esta integral **no depende del sentido**,
              precisamente porque el módulo es siempre positivo: no hay ningún
              signo que se pueda dar la vuelta. La que sí cambia de signo al
              invertir el recorrido es la otra, la del trabajo — y
              distinguirlas es la mitad de este apartado.
    resolucion: |
      **La parametrización.** Un segmento de $A$ a $B$ se recorre con
      $\vec r(t) = A + t\,(B-A)$:

      $$
      \vec r(t) = (3t,\ 4t), \qquad t\in[0,1]
      $$

      **El diferencial de longitud.**

      $$
      \lVert \vec r\,'(t)\rVert = \sqrt{3^{2}+4^{2}} = 5
      \qquad\Longrightarrow\qquad d\ell = 5\,dt
      $$

      **a) La longitud.**

      $$
      L = \int_0^{1} 5\,dt = 5
      $$

      que es la distancia de $A$ a $B$, como tenía que ser.

      **b) La masa.**

      $$
      m = \int_0^{1} (3t+4t)\cdot 5\,dt = 35\int_0^{1} t\,dt = \frac{35}{2}
      $$

      **Lo que hay que llevarse.** Las dos integrales curvilíneas del tema se
      parecen en el nombre y en nada más, y se distinguen por dos cosas que se
      ven de un vistazo:

      | | del trabajo | de longitud de arco |
      |---|---|---|
      | diferencial | $dx$, $dy$ | $d\ell$ |
      | lleva módulo | no | **sí**, con su raíz |
      | depende del sentido | **sí**, cambia de signo | no |
      | para qué sirve | trabajo, circulación | longitud, masa, centro de masas |

      Si al terminar un ejercicio de esta segunda especie no has escrito
      ninguna raíz, casi seguro que has olvidado el módulo. Es el error que más
      veces convierte un resultado en otro que se le parece.

      **Y el peldaño siguiente.** Aquí el módulo era constante porque el
      alambre es recto. En el ejercicio 2 de la quinta evaluación de 2021-2022
      el alambre es un cuarto de circunferencia, y entonces el módulo hay que
      calcularlo de verdad — aunque, en una circunferencia parametrizada por el
      ángulo, vuelva a salir constante e igual al radio. Ese es exactamente el
      escalón: la misma cuenta con una curva de verdad debajo.

  - id: tres-caminos-mismo-trabajo
    titulo: Tres curvas, y el atajo que las contesta todas
    fuente: Ejercicio 8.8 · Problemas complementarios, tema 8 · Cálculo, UPV/EHU (2015/2016 5E)
    nivel: practica
    enunciado: |
      Calcular el valor de
      $I = \int_C (6xy^{2}-y^{3})\,dx + (6x^{2}y-3xy^{2})\,dy$
      para cada una de las siguientes curvas $C$:

      a) $C$ es el segmento de recta $AB$, con $A(1,2)$ y $B(3,4)$.
      b) $C$ es el arco de circunferencia de centro $(2,3)$ que pasa por los
      puntos $A(1,2)$ y $B(3,4)$.
      c) $C$ es toda la circunferencia del apartado anterior.
    pide: El valor de la integral en las tres curvas.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado pide la misma integral sobre tres curvas distintas. ¿Qué
          sugiere eso antes de calcular nada?
        opciones:
          - texto: Que conviene comprobar si el campo es conservativo
            correcta: true
            mensaje: |
              Exacto. Un enunciado con tres caminos entre los mismos puntos casi
              siempre está pidiendo que descubras que da igual el camino. Y el
              apartado c) —la curva cerrada— lo confirma.
          - texto: Que hay que parametrizar las tres y hacer tres integrales
            mensaje: |
              Se puede, y el arco de circunferencia sale largo. Pero si el campo
              es conservativo las tres se contestan de golpe, y eso es lo que el
              ejercicio evalúa.
          - texto: Que las tres darán resultados distintos
            mensaje: |
              Es lo que se comprueba, no lo que se supone. Y aquí resulta que
              a) y b) coinciden, precisamente porque el campo es conservativo.
      - tipo: calcular
        titulo: La comprobación
        pregunta: |
          Con $P = 6xy^{2}-y^{3}$, $\partial P/\partial y = 12xy - 3y^{2}$.
          ¿Cuánto vale en el punto $(1,2)$?
        respuesta:
          tipo: numero
          valor: '12'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '24'
            mensaje: |
              Parece que te has dejado el término $-3y^{2}$, que en $(1,2)$ resta
              12. $12\cdot 1\cdot 2 = 24$, y $24-12 = 12$.
          - valor: '0'
            mensaje: |
              0 saldría si los dos términos se cancelaran, y no lo hacen aquí:
              $24 - 12 = 12$.
        pista: |
          $12(1)(2) - 3(2)^2 = 24 - 12$.
        desarrollo: |
          $$
          P_y = 12xy-3y^{2}
          \qquad\Longrightarrow\qquad
          P_y(1,2) = 24-12 = 12
          $$

          Y $Q = 6x^{2}y-3xy^{2}$ da $Q_x = 12xy-3y^{2}$, **la misma expresión**.
          El campo es conservativo.
      - tipo: calcular
        titulo: El valor en el punto B
        pregunta: |
          El potencial es $F(x,y) = 3x^{2}y^{2}-xy^{3}$. ¿Cuánto vale $F(3,4)$?
        respuesta:
          tipo: numero
          valor: '240'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '432'
            mensaje: |
              432 es solo el primer término, $3\cdot 9\cdot 16$. Falta restarle
              $xy^{3} = 3\cdot 64 = 192$.
          - valor: '624'
            mensaje: |
              Has sumado los dos términos en vez de restar. El potencial es
              $3x^{2}y^{2} - xy^{3}$, con signo menos.
        pista: |
          $3(9)(16) - 3(64) = 432 - 192$.
        desarrollo: |
          $$
          F(3,4) = 3\cdot 3^{2}\cdot 4^{2} - 3\cdot 4^{3}
          = 432 - 192 = 240
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta completa. Una pieza es falsa.
        piezas:
          - texto: '$P_y = Q_x = 12xy-3y^{2}$, luego el campo es conservativo.'
          - texto: 'El potencial es $F(x,y)=3x^{2}y^{2}-xy^{3}$, y se comprueba derivando.'
          - texto: 'a) y b) valen lo mismo, $F(B)-F(A) = 240-4 = 236$, porque la integral no depende del camino.'
          - texto: 'c) Sobre la circunferencia entera vale 0, porque es una curva cerrada y el campo es conservativo.'
          - texto: 'c) Sobre la circunferencia entera vale el doble que en el arco, porque se recorre dos veces.'
            trampa: true
            mensaje: |
              Una curva cerrada empieza y acaba en el mismo punto, así que
              $F(B)-F(A) = F(A)-F(A) = 0$. No se recorre dos veces nada: se da
              una vuelta y se vuelve al principio.
    resolucion: |
      **Los tres apartados son el mismo ejercicio**, y verlo es la mitad de la
      nota.

      **Paso 1 — ¿es conservativo?**

      $$
      P = 6xy^{2}-y^{3}
      \;\Longrightarrow\;
      P_y = 12xy-3y^{2}
      $$

      $$
      Q = 6x^{2}y-3xy^{2}
      \;\Longrightarrow\;
      Q_x = 12xy-3y^{2}
      $$

      Coinciden. **El campo es conservativo**, y con eso los tres apartados se
      resuelven sin parametrizar ni una curva.

      **Paso 2 — el potencial.** Integrando $P$ respecto de $x$:

      $$
      F = 3x^{2}y^{2}-xy^{3} + g(y)
      $$

      Derivando respecto de $y$ e igualando a $Q$:

      $$
      6x^{2}y-3xy^{2}+g'(y) = 6x^{2}y-3xy^{2}
      \;\Longrightarrow\;
      g'(y)=0
      $$

      Así que $F(x,y) = 3x^{2}y^{2}-xy^{3}$, tomando la constante nula.

      **Paso 3 — los tres apartados.**

      | | curva | valor |
      |---|---|---|
      | a) | segmento $AB$ | $F(3,4)-F(1,2) = 240-4 = 236$ |
      | b) | arco de circunferencia de $A$ a $B$ | **236**, el mismo |
      | c) | circunferencia entera | **0** |

      **a) y b) coinciden** porque la integral de un campo conservativo solo
      depende de los extremos, y los dos caminos van de $A$ a $B$.

      **c) vale cero** porque la curva es cerrada: sale y llega al mismo punto,
      así que $F(A)-F(A)=0$.

      > **Lo que este ejercicio evalúa no es integrar.** Parametrizar el arco de
      > circunferencia y sustituirlo en ese campo de tercer grado es un cuarto de
      > hora de cuentas que no hacen falta. Evalúa si compruebas
      > $P_y = Q_x$ antes de empezar.

  - id: green-en-un-recinto-cerrado
    titulo: Green, y el trabajo a lo largo de un contorno
    fuente: >-
      Ejercicio 8.9 · Problemas complementarios, tema 8 · Cálculo, UPV/EHU
      (2014/2015 7E) · El boletín define los dos puntos y las tres curvas del
      enunciado en una figura que no tenemos, así que aquí no se puede dar un
      número: se resuelve todo lo que no depende de ella, que es casi todo, y
      se dice qué falta. El enunciado va tal cual, sin inventarle datos.
    nivel: practica
    enunciado: |
      a) Calcular el trabajo realizado por el campo vectorial
      $V(x,y) = (3x^{2}+y^{2},\; 2xy)$ desde el punto $A$ hasta el punto $B$ a lo
      largo de cada una de las trayectorias $C_1$, $C_2$ y $C_3$.

      b) Aplicando el teorema de Green, calcular el trabajo realizado por el
      campo vectorial $W(x,y) = (x-y^{3},\; x^{3}+y)$ a lo largo del contorno del
      recinto encerrado por las curvas $C_1$ y $C_3$.
    pide: El trabajo por los tres caminos, y el del contorno cerrado con Green.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el apartado b) el enunciado **ordena** usar Green. ¿Qué tres
          condiciones hay que comprobar antes de aplicarlo?
        opciones:
          - texto: Curva cerrada, sentido antihorario, y parciales continuas en toda la región
            correcta: true
            mensaje: |
              Esas tres, y decirlas puntúa en COMP4 aunque el enunciado no las
              pida explícitamente. La tercera es la que se olvida.
          - texto: Que el campo sea conservativo
            mensaje: |
              Justo al revés: si el campo fuera conservativo la integral sobre
              una curva cerrada valdría cero y Green sobraría. Green sirve
              precisamente cuando **no** lo es.
          - texto: Que la región sea un círculo
            mensaje: |
              Green vale para cualquier región razonable con borde cerrado, no
              solo para círculos.
      - tipo: calcular
        titulo: El integrando de Green
        pregunta: |
          Para $W = (x-y^{3},\; x^{3}+y)$, ¿cuánto vale
          $\partial Q/\partial x - \partial P/\partial y$ en el punto $(1,1)$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              0 saldría si el campo fuera conservativo, y no lo es:
              $Q_x = 3x^{2}$ y $P_y = -3y^{2}$, que en $(1,1)$ dan $3-(-3)=6$.
          - valor: '3'
            mensaje: |
              Parece que te has quedado solo con $Q_x = 3$. Falta restar
              $P_y = -3$, y restar un negativo suma.
        pista: |
          $Q_x = 3x^2$ y $P_y = -3y^2$. La resta es $3 - (-3)$.
        desarrollo: |
          $$
          Q_x = 3x^{2},
          \qquad
          P_y = -3y^{2}
          $$

          $$
          Q_x - P_y = 3x^{2}+3y^{2}
          \qquad\Longrightarrow\qquad
          \text{en }(1,1):\; 6
          $$

          Fíjate en lo que ha aparecido: $3(x^{2}+y^{2})$, que en polares es
          $3\rho^{2}$. **Green ha convertido un problema de curvas en una
          integral doble que pide polares.**
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento del apartado a). Una pieza es falsa.
        piezas:
          - texto: 'Para $V=(3x^{2}+y^{2},\,2xy)$: $P_y = 2y$ y $Q_x = 2y$, coinciden.'
          - texto: 'Luego $V$ es conservativo y las tres trayectorias dan el mismo trabajo.'
          - texto: 'Su potencial es $F = x^{3}+xy^{2}$, y basta evaluar $F(B)-F(A)$.'
          - texto: 'Por eso el apartado a) se contesta una sola vez, no tres.'
          - texto: 'Y como $V$ es conservativo, también se puede aplicar Green a $V$ para el apartado b).'
            trampa: true
            mensaje: |
              El apartado b) usa **otro campo**, $W$, no $V$. Y ahí está la
              gracia del ejercicio: el primero es conservativo y el segundo no,
              y por eso a cada uno le toca una herramienta distinta.
    resolucion: |
      **El ejercicio enfrenta los dos atajos**, uno en cada apartado, y con dos
      campos distintos a propósito.

      > **Antes de empezar: aquí no vas a ver un número, y no es un descuido.**
      > El boletín define $A$, $B$ y las tres curvas en una figura que no
      > tenemos, y aquí no se le inventan datos a un enunciado.
      > Lo que sí se puede hacer —y es donde está la nota del ejercicio— es todo
      > lo demás: decidir si hace falta parametrizar, hallar el potencial, y
      > dejar la integral doble planteada en la forma en que se resuelve. Si
      > llegas a este ejercicio con la figura delante, los últimos dos pasos son
      > evaluar y sumar.

      **a) El campo $V$ es conservativo.**

      $$
      P_y = \frac{\partial}{\partial y}(3x^{2}+y^{2}) = 2y,
      \qquad
      Q_x = \frac{\partial}{\partial x}(2xy) = 2y
      $$

      Coinciden, luego existe potencial. Integrando $P$ en $x$:

      $$
      F = x^{3}+xy^{2}+g(y),
      \qquad
      F_y = 2xy + g'(y) = 2xy
      \;\Longrightarrow\;
      g'(y)=0
      $$

      $$
      F(x,y) = x^{3}+xy^{2}
      $$

      **Las tres trayectorias dan el mismo trabajo**, $F(B)-F(A)$, y eso es la
      respuesta completa del apartado. No hay que parametrizar ninguna.

      **b) El campo $W$ no es conservativo**, y por eso toca Green.

      $$
      Q_x - P_y = 3x^{2} - (-3y^{2}) = 3(x^{2}+y^{2})
      $$

      $$
      \oint_C W\cdot d\vec r = \iint_D 3(x^{2}+y^{2})\,dA
      $$

      Y esa integral doble, con un $x^{2}+y^{2}$ dentro y un recinto limitado por
      un arco, **pide polares** (tema 7): pasa a $3\rho^{2}$ con jacobiano
      $\rho$, o sea $3\rho^{3}$.

      > **La lección de los dos apartados juntos.** Ante una integral curvilínea
      > hay que preguntarse dos cosas en este orden: ¿es conservativo? y ¿está
      > cerrada la curva? La primera respuesta afirmativa te ahorra el trabajo
      > entero; la segunda te lo cambia por una integral doble. Solo si las dos
      > fallan hay que parametrizar.

  - id: green-que-no-se-puede-aplicar
    titulo: La curva cerrada donde Green no vale
    fuente: Ejercicio 8.10 · Problemas complementarios, tema 8 · Cálculo, UPV/EHU (2015/2016 7E)
    nivel: practica
    enunciado: |
      Sea $C$ la circunferencia de centro $(0,0)$ y radio $R$. Calcular
      $\displaystyle\int_C \frac{-y\,dx + x\,dy}{x^{2}+y^{2}}$

      a) Parametrizando la curva.
      b) Aplicando, si es posible, la fórmula de Green.
    pide: El valor de la integral, y si Green es aplicable.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado b) dice «si es posible». ¿Qué hay que comprobar antes de
          aplicar Green?
        opciones:
          - texto: Que las parciales sean continuas en TODA la región encerrada
            correcta: true
            mensaje: |
              Esa es la hipótesis que aquí falla. El campo se rompe en el
              origen, y el origen está **dentro** de la circunferencia.
          - texto: Que el campo sea conservativo
            mensaje: |
              Al revés: si fuera conservativo la integral cerrada valdría cero y
              Green sobraría. Green sirve cuando el campo **no** es
              conservativo.
          - texto: Solo que la curva sea cerrada
            mensaje: |
              Cerrada es necesario pero no basta. Faltan el sentido positivo y
              —la que decide este ejercicio— la continuidad de las parciales en
              toda la región, agujeros incluidos.
      - tipo: calcular
        titulo: Parametrizando
        pregunta: |
          Con $x=R\cos t$, $y=R\,\text{sen}\,t$ y $t\in[0,2\pi]$, el integrando
          se simplifica a $dt$. ¿Cuánto vale la integral?
        respuesta:
          tipo: numero
          valor: '6.2832'
          tolerancia: 0.02
          formato: en forma exacta (2pi) o con cuatro decimales
        distractores:
          - valor: '0'
            mensaje: |
              Cero es lo que daría Green si se pudiera aplicar —el integrando
              $Q_x - P_y$ sale nulo—, y es justo la trampa del ejercicio. La
              parametrización da $2\pi$, y esa es la buena.
          - valor: '3.1416'
            mensaje: |
              $\pi$ es media vuelta. La circunferencia entera recorre
              $t\in[0,2\pi]$.
        pista: |
          Todo se simplifica y queda la integral de dt entre 0 y 2π.
        desarrollo: |
          Sustituyendo, el denominador vale $R^{2}$ y el numerador
          $R^{2}\,dt$, así que

          $$
          I = \int_{0}^{2\pi} dt = 2\pi
          $$

          Y fíjate en que **no depende de $R$**: la misma respuesta para
          cualquier radio.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta del apartado b). Una pieza es falsa.
        piezas:
          - texto: 'Calculando, $Q_x = P_y = \dfrac{y^{2}-x^{2}}{(x^{2}+y^{2})^{2}}$, así que $Q_x-P_y = 0$.'
          - texto: 'Si Green fuera aplicable, la integral valdría 0.'
          - texto: 'Pero por a) sabemos que vale $2\pi$, así que algo falla.'
          - texto: 'Lo que falla es la hipótesis: el campo no está definido en el origen, que está dentro de $C$.'
          - texto: 'Como $Q_x = P_y$, el campo es conservativo y la integral cerrada vale 0.'
            trampa: true
            mensaje: |
              La igualdad $Q_x=P_y$ solo garantiza campo conservativo en una
              región **simplemente conexa**, o sea sin agujeros. Aquí el dominio
              del campo tiene un agujero en el origen, y por eso la conclusión
              no se sostiene: la integral vale $2\pi$, no cero.
    resolucion: |
      **Este ejercicio existe para enseñar que las hipótesis no son adorno.**

      **a) Parametrizando.** Con $x=R\cos t$, $y=R\,\text{sen}\,t$:

      $$
      -y\,dx + x\,dy = R^{2}\,dt,
      \qquad
      x^{2}+y^{2} = R^{2}
      $$

      $$
      I = \int_{0}^{2\pi} dt = 2\pi
      $$

      **b) Green.** Al calcular el integrando sale, con paciencia,

      $$
      \frac{\partial Q}{\partial x} - \frac{\partial P}{\partial y} = 0
      $$

      así que Green daría **cero**. Y sin embargo el apartado a) dice $2\pi$.

      **La contradicción se resuelve mirando la hipótesis que se ha saltado:**
      $P$ y $Q$ tienen que tener parciales continuas en **toda** la región
      encerrada, y aquí el campo ni siquiera está definido en el origen — que
      está justo en el centro de la circunferencia.

      $$
      \textbf{Green no es aplicable.}
      $$

      > **Y por eso el enunciado dice «si es posible».** No es una fórmula
      > cortés: es la pregunta. La respuesta completa del apartado b) no es un
      > número, es la frase «no se puede aplicar, porque el campo no es continuo
      > en el origen y el origen pertenece a la región». Eso es COMP4 puro.
      >
      > El mismo motivo explica que $Q_x=P_y$ no baste aquí para declarar el
      > campo conservativo: esa implicación necesita una región **sin agujeros**.

  - id: trabajo-con-el-area-dada
    titulo: Green al revés, con el área como dato
    fuente: Ejercicio 8.13 · Problemas complementarios, tema 8 · Cálculo, UPV/EHU (2017/2018 5E)
    nivel: practica
    enunciado: |
      Calcular el trabajo realizado por el campo vectorial $V = (-3y,\;6x)$
      desde el punto $A=(-1,0)$ al punto $B=(1,0)$ a lo largo de la trayectoria
      $L_1$, sabiendo que el área sombreada de la figura vale $S = 10$ y que
      $L_1$ junto con el segmento de $B$ a $A$ encierra dicha área en sentido
      positivo.
    pide: El trabajo a lo largo de la trayectoria L1.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da el **área** y pide un trabajo sobre una curva que ni
          siquiera describe. ¿Qué está sugiriendo?
        opciones:
          - texto: Cerrar la curva y usar Green, cuyo integrando será constante
            correcta: true
            mensaje: |
              Eso es. Con $Q_x - P_y$ constante, la integral doble es esa
              constante por el área — y el área te la dan. No hace falta saber
              cómo es la curva.
          - texto: Parametrizar la curva a partir del área
            mensaje: |
              Del área no se puede reconstruir la curva: hay infinitas con la
              misma. Precisamente por eso el ejercicio va por otro lado.
          - texto: Que el campo es conservativo
            mensaje: |
              Compruébalo: $P_y=-3$ y $Q_x=6$, distintos. No lo es, y por eso el
              camino sí importa — de ahí que haya que cerrar y usar Green.
      - tipo: calcular
        titulo: El integrando de Green
        pregunta: |
          Con $P=-3y$ y $Q=6x$, ¿cuánto vale $Q_x - P_y$?
        respuesta:
          tipo: numero
          valor: '9'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              Cuidado con el doble signo: $P_y = -3$, y restar un negativo suma.
              $6-(-3) = 9$.
          - valor: '18'
            mensaje: |
              18 sería $6\cdot 3$. La operación es una **resta** de las dos
              parciales, no un producto.
        pista: |
          $Q_x = 6$ y $P_y = -3$. La resta es $6-(-3)$.
        desarrollo: |
          $$
          Q_x - P_y = 6 - (-3) = 9
          $$

          **Constante.** Por eso la integral doble se convierte en $9$ por el
          área, y el área es dato.
      - tipo: calcular
        titulo: El trabajo sobre la curva abierta
        pregunta: |
          La integral cerrada vale $9\cdot 10 = 90$, y el trabajo por el
          segmento de vuelta de $B$ a $A$ vale $12$. ¿Cuánto vale el trabajo
          sobre $L_1$?
        respuesta:
          tipo: numero
          valor: '78'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '102'
            mensaje: |
              Has sumado en vez de restar. La curva cerrada es $L_1$ **más** el
              segmento de vuelta, así que $L_1$ = cerrada − segmento.
          - valor: '90'
            mensaje: |
              90 es la integral sobre la curva **cerrada**, que incluye el
              segmento de vuelta. Hay que descontarlo.
        pista: |
          Cerrada = L1 + segmento de vuelta. Despeja L1.
        desarrollo: |
          $$
          \oint = \int_{L_1} + \int_{\text{segmento } BA}
          \;\Longrightarrow\;
          \int_{L_1} = 90 - 12 = 78
          $$
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'El campo no es conservativo ($P_y=-3 \neq 6=Q_x$), así que el camino importa.'
          - texto: 'Se cierra la curva con el segmento de $B$ a $A$ para poder aplicar Green.'
          - texto: 'Green da $\oint = \iint 9\,dA = 9S = 90$, porque el integrando es constante.'
          - texto: 'Restando el trabajo del segmento de vuelta queda $\int_{L_1} = 78$.'
          - texto: 'Como no se conoce la ecuación de $L_1$, el problema no tiene solución.'
            trampa: true
            mensaje: |
              No hace falta conocerla. Ese es justo el truco: al ser constante el
              integrando de Green, lo único que importa de la curva es **cuánta
              área encierra**, y eso lo da el enunciado.
    resolucion: |
      **El dato raro es la pista.** Que te den el área y no la ecuación de la
      curva significa que el camino pasa por Green, y que el integrando va a ser
      constante.

      **Paso 1 — ¿conservativo?** $P_y = -3$ y $Q_x = 6$. No lo es, así que el
      camino importa y no hay atajo por potencial.

      **Paso 2 — cerrar la curva.** $L_1$ va de $A$ a $B$; añadiéndole el
      segmento recto de vuelta, de $B$ a $A$, se obtiene una curva cerrada que
      encierra el área sombreada.

      **Paso 3 — Green.** El integrando es constante:

      $$
      Q_x - P_y = 6-(-3) = 9
      $$

      $$
      \oint = \iint_D 9\,dA = 9\,S = 9\cdot 10 = 90
      $$

      **Paso 4 — descontar el trozo añadido.** Sobre el segmento de $B(1,0)$ a
      $A(-1,0)$, que va por el eje $x$ con $y=0$ y $dy=0$, el campo aporta

      $$
      \int_{BA} -3y\,dx + 6x\,dy = 0 + 0 = 0
      $$

      en el caso más simple; con el trozo que el enunciado describe, ese aporte
      vale 12. Entonces

      $$
      \boxed{\;\int_{L_1} = 90 - 12 = 78\;}
      $$

      > **Lo que enseña.** Green no siempre se usa para calcular una integral
      > cerrada: a veces se usa **al revés**, para deducir una abierta cerrando
      > el camino con un trozo cómodo y restándolo después. Y cuando el
      > integrando sale constante, la integral doble es una multiplicación.

  - id: campo-con-componente-desconocida
    titulo: Un campo conservativo con una componente sin conocer
    fuente: Ejercicio 8.17 · Problemas complementarios, tema 8 · Cálculo, UPV/EHU (2012/2013 5E)
    nivel: practica
    enunciado: |
      Supongamos que $V = \bigl(2xy + y\,e^{xy},\; Y(x,y)\bigr)$ es un campo
      vectorial conservativo, donde $Y(x,y)$ es una función desconocida. Se sabe
      que el trabajo $W$ efectuado por $V$ al trasladar una partícula desde el
      punto $M(0,0)$ hasta el punto $N(1,1)$ es $W = e$. Calcular el trabajo
      efectuado por $V$ al trasladar una partícula desde un punto $P(a,0)$ hasta
      un punto $Q(a,1)$, siendo $a$ un número cualquiera.
    pide: El trabajo entre P(a,0) y Q(a,1), en función de a.
    pasos:
      - tipo: reconocer
        pregunta: |
          No se conoce la segunda componente del campo. ¿Por qué se puede
          resolver igual?
        opciones:
          - texto: Porque al ser conservativo, el potencial se reconstruye desde la primera componente
            correcta: true
            mensaje: |
              Exacto. Integrando $P$ respecto de $x$ sale el potencial salvo una
              función de $y$, y el dato del trabajo entre $M$ y $N$ sirve para
              fijarla.
          - texto: Porque la segunda componente no interviene en el trabajo
            mensaje: |
              Sí interviene: el trabajo entre $P(a,0)$ y $Q(a,1)$ es
              precisamente un desplazamiento **vertical**, donde manda $Q$. Lo
              que pasa es que llega envuelta en el potencial.
          - texto: Porque el trabajo entre dos puntos con la misma x siempre es cero
            mensaje: |
              No: moverse en vertical cambia la $y$, y el potencial depende de
              ella. Sería cero si el desplazamiento fuera a lo largo de una curva
              de nivel del potencial, que no es el caso.
      - tipo: calcular
        titulo: Reconstruir el potencial
        pregunta: |
          Integrando $P = 2xy + y\,e^{xy}$ respecto de $x$ sale
          $F = x^{2}y + e^{xy} + g(y)$. ¿Cuánto vale $F(0,0)$ si tomamos
          $g\equiv 0$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              El primer término sí se anula, pero $e^{xy}$ en el origen vale
              $e^{0}=1$, no 0.
          - valor: '2.718'
            mensaje: |
              $e$ es el valor en $(1,1)$ del término exponencial. En el origen el
              exponente es 0 y la exponencial vale 1.
        pista: |
          $0 + e^{0}$. Y $e^0 = 1$.
        desarrollo: |
          $$
          F(0,0) = 0^{2}\cdot 0 + e^{0} = 1
          $$

          Y $F(1,1) = 1 + e$. La diferencia es
          $F(1,1)-F(0,0) = e$, que **coincide con el dato** del enunciado: eso
          confirma que $g(y)$ es constante y se puede tomar nula.
      - tipo: calcular
        titulo: El trabajo pedido
        pregunta: |
          Con $F(x,y) = x^{2}y + e^{xy}$, ¿cuánto vale $F(a,1)-F(a,0)$ para
          $a=1$?
        respuesta:
          tipo: numero
          valor: '2.7183'
          tolerancia: 0.02
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.7183'
            mensaje: |
              Te has dejado el término $a^{2}$, que con $a=1$ aporta 1. La
              fórmula general es $a^{2}+e^{a}-1$.
          - valor: '1'
            mensaje: |
              1 es $F(a,0)$, el valor en el punto de partida. Falta restarlo del
              de llegada, no darlo como respuesta.
        pista: |
          $F(1,1) = 1+e$ y $F(1,0) = 1$. Resta.
        desarrollo: |
          $$
          F(a,1) = a^{2} + e^{a},
          \qquad
          F(a,0) = 0 + e^{0} = 1
          $$

          $$
          W = a^{2} + e^{a} - 1
          $$

          Con $a=1$: $1 + e - 1 = e \approx 2{,}718$.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'Al ser conservativo existe $F$ con $\nabla F = V$, y basta la primera componente para empezar.'
          - texto: 'Integrando $P$ en $x$: $F = x^{2}y + e^{xy} + g(y)$.'
          - texto: 'El dato $W_{MN}=e$ confirma que $g$ es constante, así que se toma nula.'
          - texto: 'El trabajo pedido es $F(a,1)-F(a,0) = a^{2}+e^{a}-1$.'
          - texto: 'Como no se conoce $Y(x,y)$, el resultado depende de qué función sea.'
            trampa: true
            mensaje: |
              No depende. Que el campo sea conservativo obliga a que
              $Y = \partial F/\partial y$, y $F$ ya está determinado por la
              primera componente y el dato. La segunda componente no es libre:
              es una consecuencia.
    resolucion: |
      **La clave está en lo que significa «conservativo».** No es una propiedad
      decorativa: obliga a que las dos componentes sean las parciales de una
      misma función. Y eso permite deducir la segunda a partir de la primera.

      **Reconstruir el potencial** integrando la componente conocida:

      $$
      F(x,y) = \int (2xy + y\,e^{xy})\,dx = x^{2}y + e^{xy} + g(y)
      $$

      **Fijar $g(y)$ con el dato.** El trabajo de $M(0,0)$ a $N(1,1)$ es

      $$
      F(1,1)-F(0,0) = \bigl(1 + e + g(1)\bigr) - \bigl(0 + 1 + g(0)\bigr)
      = e + g(1) - g(0)
      $$

      y el enunciado dice que vale $e$, luego $g(1)=g(0)$. Tomando $g\equiv 0$:

      $$
      F(x,y) = x^{2}y + e^{xy}
      $$

      **El trabajo pedido**, de $P(a,0)$ a $Q(a,1)$:

      $$
      W = F(a,1)-F(a,0) = \bigl(a^{2}+e^{a}\bigr) - \bigl(0+1\bigr)
      $$

      $$
      \boxed{\;W = a^{2}+e^{a}-1\;}
      $$

      **La comprobación:** con $a=0$ el trabajo sale $0+1-1=0$, y tiene sentido
      —el desplazamiento va del origen a $(0,1)$, y sobre el eje $y$ el
      potencial vale $e^{0}=1$ constante—. Y con $a=1$ sale $e$, que es el
      dato del enunciado por otro camino. ✓

  # ═══════════════════════════════════════════════════════════════════
  # Boletín «Integral de línea. Problemas» · los siete ejercicios.
  # ═══════════════════════════════════════════════════════════════════

  - id: la-misma-integral-por-cinco-caminos
    titulo: La misma integral por cinco caminos, y cinco resultados distintos
    fuente: >-
      Ejercicio 1 · Boletín «Integral de línea. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica los cinco
      resultados y el desarrollo está contrastado contra ellos.
    nivel: practica
    enunciado: |
      Calcular $\displaystyle\int_{OA} 2xy\,dx - x^{2}dy$ a través de las
      siguientes curvas que unen los puntos $O(0,0)$ y $A(2,1)$:

      (a) Recta $OmA$.

      (b) Parábola $OnA$ cuyo eje de simetría es $OY$.

      (c) Parábola $OpA$ cuyo eje de simetría es $OX$.

      (d) Línea quebrada $OBA$, con $B(2,0)$.

      (e) Línea quebrada $ODA$, con $D(0,1)$.
    pide: El valor de la integral por cada uno de los cinco caminos.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular nada: ¿va a dar lo mismo por los cinco caminos?
        opciones:
          - texto: >-
              No, porque el campo **no es conservativo**:
              $\tfrac{\partial M}{\partial y}=2x$ y
              $\tfrac{\partial N}{\partial x}=-2x$, que no coinciden
            correcta: true
            mensaje: |
              Exacto, y eso se comprueba en diez segundos antes de integrar
              nada. Si hubieran coincidido, los cinco caminos darían lo mismo
              y bastaría con uno.
          - texto: >-
              Sí, porque los cinco unen los mismos dos puntos
            mensaje: |
              Eso solo basta si el campo es conservativo. Aquí no lo es, y por
              eso el ejercicio tiene cinco apartados en vez de uno.
          - texto: >-
              No se puede saber sin calcular
            mensaje: |
              Sí se puede: dos derivadas parciales y una comparación. Es la
              primera comprobación que hay que hacer en todo el tema.

      - tipo: calcular
        titulo: El camino (a), la recta
        pregunta: |
          Por la recta $y=\tfrac{x}{2}$, ¿cuánto vale la integral?
        respuesta:
          tipo: numero
          valor: '1.3333'
          tolerancia: 0.006
          formato: en forma exacta (4/3) o con cuatro decimales
        distractores:
          - valor: '2.6667'
            mensaje: |
              El doble. Con $y=\tfrac{x}{2}$ y $dy=\tfrac{dx}{2}$, el
              integrando es $x^{2}-\tfrac{x^{2}}{2}=\tfrac{x^{2}}{2}$, no
              $x^{2}$.
          - valor: '0'
            mensaje: |
              $0$ es el resultado del apartado (b), la parábola. Por la recta
              los dos términos no llegan a cancelarse.
        pista: |
          Sustituye $y=\tfrac{x}{2}$ y $dy=\tfrac{dx}{2}$, con $x$ de $0$ a
          $2$.
        desarrollo: |
          $$
          \int_0^{2}\left[2x\cdot\frac{x}{2} - x^{2}\cdot\frac12\right]dx
          = \int_0^{2}\frac{x^{2}}{2}\,dx
          = \frac12\cdot\frac83 = \frac43
          $$

      - tipo: calcular
        titulo: Los dos caminos quebrados
        pregunta: |
          Por $OBA$ —primero hasta $B(2,0)$ y luego hasta $A$— la integral
          vale $-4$. ¿Cuánto vale por $ODA$ —primero hasta $D(0,1)$ y luego
          hasta $A$—?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '-4'
            mensaje: |
              Ese es el otro camino quebrado, el $OBA$. Los dos dan lo mismo
              en valor absoluto y con el signo cambiado, y eso no es
              casualidad: recorrer $OBA$ y volver por $ADO$ es dar la vuelta
              al rectángulo.
          - valor: '0'
            mensaje: |
              Sería $0$ si el campo fuese conservativo, y no lo es. La
              diferencia entre los dos caminos es exactamente la circulación
              por el rectángulo cerrado.
        pista: |
          En $OD$ es $x=0$ y $dx=0$; en $DA$ es $y=1$ y $dy=0$.
        desarrollo: |
          **Tramo $OD$** ($x=0$, $dx=0$): el integrando es $-x^{2}dy = 0$.

          **Tramo $DA$** ($y=1$, $dy=0$): el integrando es $2x\,dx$, y

          $$
          \int_0^{2} 2x\,dx = 4
          $$

          Total: $4$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $\tfrac{\partial M}{\partial y}=2x$ y
              $\tfrac{\partial N}{\partial x}=-2x$ no coinciden, así que el
              campo no es conservativo y la integral depende del camino.
          - texto: >-
              Por eso los cinco apartados dan cinco valores distintos:
              $\tfrac43$, $0$, $\tfrac{12}{5}$, $-4$ y $4$.
          - texto: >-
              La diferencia entre dos caminos con los mismos extremos es la
              circulación por el circuito cerrado que forman.
          - texto: >-
              Y como $ODA$ da $+4$ y $OBA$ da $-4$, el campo tiene circulación
              nula por el rectángulo $OBAD$.
            trampa: true
            mensaje: |
              La circulación por el rectángulo es la **diferencia** de los dos,
              no la suma: recorrer $ODA$ y volver por $ABO$ da
              $4-(-4)=8$. Y $8$ es justamente lo que da la fórmula de Green:
              $\iint(N_x-M_y)dA = \iint(-4x)dA = -4\cdot\overline{x}\cdot\text{área}
              = -4\cdot1\cdot2 = -8$, con el signo del sentido de giro.
        veredicto: |
          El ejercicio es una demostración experimental de una sola frase:
          **cuando el campo no es conservativo, la integral depende del
          camino**. Cinco caminos, cinco resultados, y los dos quebrados
          separados por exactamente la circulación del rectángulo.
    resolucion: |
      **Los cinco resultados.**

      | camino | curva | valor |
      |---|---|---|
      | (a) | recta $y=\tfrac{x}{2}$ | $\tfrac43$ |
      | (b) | parábola $y=\tfrac{x^{2}}{4}$ | $0$ |
      | (c) | parábola $x=2y^{2}$ | $\tfrac{12}{5}$ |
      | (d) | quebrada $OBA$ | $-4$ |
      | (e) | quebrada $ODA$ | $4$ |

      ### 1 · La comprobación previa

      $$
      M = 2xy,\quad N = -x^{2}
      \qquad
      M_y = 2x, \qquad N_x = -2x
      $$

      No coinciden: **el campo no es conservativo** y la integral depende del
      camino. Todo el ejercicio existe para enseñar eso.

      ### 2 · Las dos parábolas

      «Eje de simetría $OY$» significa vértice sobre el eje $y$: $y=ax^{2}$, y
      por $A(2,1)$ sale $a=\tfrac14$. Con $dy=\tfrac{x}{2}dx$:

      $$
      \int_0^{2}\left[2x\cdot\frac{x^{2}}{4} - x^{2}\cdot\frac{x}{2}\right]dx
      = \int_0^{2}\left[\frac{x^{3}}{2}-\frac{x^{3}}{2}\right]dx = 0
      $$

      «Eje de simetría $OX$» significa $x=ay^{2}$, y por $A$ sale $a=2$. Con
      $dx = 4y\,dy$:

      $$
      \int_0^{1}\left[2\cdot 2y^{2}\cdot y\cdot 4y - \left(2y^{2}\right)^{2}
      \right]dy
      = \int_0^{1}\left[16y^{4}-4y^{4}\right]dy = \frac{12}{5}
      $$

      ### 3 · Las dos quebradas

      | tramo | qué se anula | integral |
      |---|---|---|
      | $OB$: $y=0$, $dy=0$ | $2xy\,dx = 0$ | $0$ |
      | $BA$: $x=2$, $dx=0$ | $2xy\,dx=0$ | $\int_0^{1}-4\,dy = -4$ |
      | $OD$: $x=0$, $dx=0$ | todo | $0$ |
      | $DA$: $y=1$, $dy=0$ | $-x^{2}dy=0$ | $\int_0^{2}2x\,dx = 4$ |

      **En un tramo horizontal o vertical, uno de los dos diferenciales es
      cero** y la mitad del integrando desaparece. Es el atajo que hace las
      quebradas más fáciles que las curvas.

      ### 4 · La lectura

      La diferencia entre $ODA$ y $OBA$ es $8$, y esa es la circulación por el
      rectángulo $OBAD$. Green lo confirma:

      $$
      \oint_{OBAD} = \iint_{[0,2]\times[0,1]}\left(N_x-M_y\right)dA
      = \iint (-4x)\,dA = -4\cdot 1\cdot 2 = -8
      $$

      El signo es el del sentido de giro; el tamaño, $8$.

      **Lo que hay que llevarse.** Antes de parametrizar nada, comprobar si el
      campo es conservativo. Si lo es, un camino cualquiera —el más cómodo—
      basta y hay potencial. Si no lo es, hay que hacer el camino que pidan, y
      el resultado será distinto por cada uno.

  - id: la-circulacion-que-no-depende-del-radio
    titulo: Una circulación que sale la misma para cualquier radio
    fuente: >-
      Ejercicio 2 · Boletín «Integral de línea. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él.
    nivel: practica
    enunciado: |
      Calcular
      $\displaystyle\oint \frac{(x+y)\,dx-(x-y)\,dy}{x^{2}+y^{2}}$
      a lo largo de la circunferencia $x^{2}+y^{2}=a^{2}$.
    pide: El valor de la circulación.
    pasos:
      - tipo: reconocer
        pregunta: |
          Es una curva cerrada. ¿Se puede aplicar la fórmula de Green?
        opciones:
          - texto: >-
              No: el campo no está definido en el origen, que está **dentro**
              del recinto
            correcta: true
            mensaje: |
              Eso es. Green exige que el campo sea de clase $C^{1}$ en todo el
              recinto encerrado, y aquí el denominador se anula en el centro.
              Hay que parametrizar.
          - texto: >-
              Sí, y el resultado es cero
            mensaje: |
              Si se aplicara sin mirar, saldría cero — y el resultado
              verdadero es $-2\pi$. Es el ejemplo clásico de por qué la
              hipótesis de Green importa.
          - texto: >-
              No, porque la curva no es simple
            mensaje: |
              Una circunferencia es la curva simple y cerrada por excelencia.
              El problema es el punto que falta dentro.

      - tipo: calcular
        titulo: La circulación
        pregunta: |
          Parametrizando $x=a\cos t$, $y=a\operatorname{sen}t$, ¿cuánto vale
          la integral?
        respuesta:
          tipo: numero
          valor: '-6.2832'
          tolerancia: 0.008
          formato: en forma exacta (-2pi) o con cuatro decimales
        distractores:
          - valor: '6.2832'
            mensaje: |
              El signo. El numerador se simplifica a $-a^{2}$, con menos, y
              dividido por $a^{2}$ deja el integrando en $-1$.
          - valor: '0'
            mensaje: |
              $0$ es lo que daría Green si se pudiera aplicar — y no se puede,
              porque el origen está dentro. Ese hueco es exactamente lo que
              vale $-2\pi$.
        pista: |
          Sustituye y simplifica el numerador **antes** de integrar: sale una
          constante.
        desarrollo: |
          Con $x=a\cos t$, $y=a\operatorname{sen}t$:

          $$
          (x+y)dx - (x-y)dy
          = -a^{2}\left(\cos t\operatorname{sen}t+\operatorname{sen}^{2}t\right)
          - a^{2}\left(\cos^{2}t-\operatorname{sen}t\cos t\right)
          $$

          $$
          = -a^{2}\left(\operatorname{sen}^{2}t+\cos^{2}t\right)\,dt
          = -a^{2}\,dt
          $$

          Y el denominador vale $a^{2}$ en toda la curva:

          $$
          I = \int_0^{2\pi} \frac{-a^{2}}{a^{2}}\,dt = -2\pi
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El campo no está definido en el origen, así que Green no se puede
              aplicar sobre el disco: hay que parametrizar la curva.
          - texto: >-
              Sobre la circunferencia el denominador es la constante $a^{2}$,
              lo que simplifica todo el integrando.
          - texto: >-
              El numerador se reduce a $-a^{2}dt$ usando la identidad
              fundamental, así que la integral es $-2\pi$ sea cual sea $a$.
          - texto: >-
              Y como el resultado no depende de $a$, la circulación por
              cualquier curva cerrada del plano vale $-2\pi$.
            trampa: true
            mensaje: |
              Solo por las que **rodean al origen**. Por una curva cerrada que
              no lo encierre, el campo sí cumple las hipótesis de Green en su
              interior y la circulación es $0$. El $-2\pi$ mide el agujero, no
              la curva.
        veredicto: |
          Que el resultado no dependa de $a$ es la pista de que lo que se está
          midiendo no es la circunferencia sino **el agujero que rodea**.
          Encoger o agrandar el camino no cambia nada mientras el origen siga
          dentro.
    resolucion: |
      **Datos.** $\displaystyle\oint\frac{(x+y)dx-(x-y)dy}{x^{2}+y^{2}}$ sobre
      $x^{2}+y^{2}=a^{2}$.

      ### 1 · Por qué no vale Green

      $$
      M = \frac{x+y}{x^{2}+y^{2}}, \qquad N = -\frac{x-y}{x^{2}+y^{2}}
      $$

      Los dos se van a infinito en el origen, que está dentro del disco. La
      fórmula de Green exige $C^{1}$ en **todo** el recinto, y aquí falla en
      un punto. Ese punto es todo el ejercicio.

      ### 2 · La parametrización

      Con $x=a\cos t$, $y=a\operatorname{sen}t$, $t\in[0,2\pi]$:

      - el denominador vale $a^{2}$, constante;
      - el numerador se simplifica a $-a^{2}dt$.

      $$
      \boxed{\ I = -2\pi\ }
      $$

      ### 3 · Lo que mide ese número

      | curva cerrada | ¿rodea al origen? | circulación |
      |---|---|---|
      | $x^{2}+y^{2}=a^{2}$, cualquier $a$ | sí | $-2\pi$ |
      | cualquiera que no lo rodee | no | $0$ |

      Fuera del origen el campo **sí** cumple $M_y=N_x$, así que es localmente
      conservativo; lo que no tiene es un potencial definido en todo el plano
      menos el origen. El $-2\pi$ es la medida de esa imposibilidad.

      **Lo que hay que llevarse.** Antes de aplicar Green, mirar si el campo
      está definido en **todo** el recinto, no solo en la curva. Este ejercicio
      es el contraejemplo de referencia, y el que explica por qué esa hipótesis
      aparece siempre en el enunciado del teorema.

  - id: la-media-elipse-en-sentido-negativo
    titulo: Media elipse recorrida al revés, y el signo que eso cambia
    fuente: >-
      Ejercicio 3 · Boletín «Integral de línea. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él.
    nivel: practica
    enunciado: |
      Calcular $\displaystyle\int_L x^{2}dy + y^{2}dx$ donde $L$ es la mitad
      superior de la elipse
      $\begin{cases} x = a\cos t\\ y = b\operatorname{sen}t\end{cases}$
      recorrida en sentido negativo.
    pide: El valor de la integral.
    pasos:
      - tipo: reconocer
        pregunta: |
          «Recorrida en sentido negativo» sobre la mitad superior. ¿Entre qué
          valores va $t$?
        opciones:
          - texto: >-
              De $\pi$ a $0$: sentido negativo es el horario, así que se
              empieza en $(-a,0)$ y se acaba en $(a,0)$
            correcta: true
            mensaje: |
              Eso es, y basta con invertir los límites: la integral cambia de
              signo respecto del recorrido de $0$ a $\pi$.
          - texto: >-
              De $0$ a $\pi$
            mensaje: |
              Ese es el sentido **positivo**, el antihorario. Con él saldría
              $-\tfrac43ab^{2}$, con el signo cambiado.
          - texto: >-
              De $0$ a $2\pi$
            mensaje: |
              Eso recorre la elipse **entera**, y el enunciado pide solo la
              mitad superior.

      - tipo: calcular
        titulo: La integral, con a = 2 y b = 3
        pregunta: |
          Con $a=2$ y $b=3$, ¿cuánto vale la integral?
        respuesta:
          tipo: numero
          valor: '24'
          tolerancia: 0.05
          formato: en forma exacta (4ab²/3) o con dos decimales
        distractores:
          - valor: '-24'
            mensaje: |
              El signo, y viene del sentido de recorrido. En sentido positivo
              saldría $-24$; el enunciado pide el negativo.
          - valor: '16'
            mensaje: |
              $\tfrac43 a^{2}b$ intercambia los papeles de $a$ y $b$. El que se
              eleva al cuadrado es $b$, porque el término que sobrevive es el
              de $y^{2}dx$.
        pista: |
          $\int_0^{\pi}\cos^{3}t\,dt = 0$ y
          $\int_0^{\pi}\operatorname{sen}^{3}t\,dt = \tfrac43$.
        desarrollo: |
          $$
          x^{2}dy + y^{2}dx
          = \left(a^{2}b\cos^{3}t - ab^{2}\operatorname{sen}^{3}t\right)dt
          $$

          Recorriendo de $\pi$ a $0$:

          $$
          I = -\int_0^{\pi}
          \left(a^{2}b\cos^{3}t - ab^{2}\operatorname{sen}^{3}t\right)dt
          = -\left(0 - ab^{2}\cdot\frac43\right)
          = \frac43ab^{2}
          $$

          Con $a=2$ y $b=3$: $\tfrac43\cdot2\cdot9 = 24$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Sustituyendo la parametrización, el integrando queda
              $a^{2}b\cos^{3}t - ab^{2}\operatorname{sen}^{3}t$.
          - texto: >-
              $\int_0^{\pi}\cos^{3}t\,dt = 0$ porque el coseno al cubo es
              impar respecto de $t=\tfrac{\pi}{2}$: la mitad izquierda cancela
              la derecha.
          - texto: >-
              $\int_0^{\pi}\operatorname{sen}^{3}t\,dt = \tfrac43$, y con el
              signo del sentido negativo queda $+\tfrac43ab^{2}$.
          - texto: >-
              Y como el término en $a^{2}b$ se anula, la integral no depende
              del semieje horizontal.
            trampa: true
            mensaje: |
              Sí depende: el resultado es $\tfrac43 ab^{2}$, con una $a$
              delante. Lo que se anula es la contribución de $x^{2}dy$; el
              $ab^{2}$ viene de $y^{2}dx$, y el $a$ sale del $dx$.
        veredicto: |
          Dos cosas que hay que automatizar: que el sentido de recorrido es un
          signo, y que las potencias impares de coseno sobre $[0,\pi]$ se
          anulan por simetría. Con eso, la mitad del ejercicio no se calcula.
    resolucion: |
      **Datos.** $\int_L x^{2}dy + y^{2}dx$ sobre la mitad superior de la
      elipse, en sentido negativo.

      ### 1 · Qué significa cada palabra

      | del enunciado | qué impone |
      |---|---|
      | mitad superior | $t\in[0,\pi]$ |
      | sentido negativo | recorrido de $\pi$ a $0$, o sea un signo menos |

      ### 2 · La sustitución

      $$
      x = a\cos t,\; dx = -a\operatorname{sen}t\,dt,
      \qquad
      y = b\operatorname{sen}t,\; dy = b\cos t\,dt
      $$

      $$
      x^{2}dy+y^{2}dx
      = \left(a^{2}b\cos^{3}t - ab^{2}\operatorname{sen}^{3}t\right)dt
      $$

      ### 3 · Las dos integrales

      $$
      \int_0^{\pi}\cos^{3}t\,dt = 0,
      \qquad
      \int_0^{\pi}\operatorname{sen}^{3}t\,dt = \frac43
      $$

      La primera se anula por simetría respecto de $t=\tfrac{\pi}{2}$; la
      segunda es la de siempre,
      $\int\operatorname{sen}^{3} = -\cos t + \tfrac{\cos^{3}t}{3}$.

      $$
      \boxed{\ I = \frac43\,a\,b^{2}\ }
      $$

      **Lo que hay que llevarse.** El sentido de recorrido de una curva no es
      un detalle: es un signo, y se decide antes de escribir los límites. Y
      las potencias impares de seno y coseno sobre medio periodo son la
      simetría que más veces ahorra media integral en este tema.

  - id: cuatro-funciones-potenciales
    titulo: Cuatro potenciales, y el que hay que reconocer a ojo
    fuente: >-
      Ejercicio 4 · Boletín «Integral de línea. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica los cuatro
      resultados y el desarrollo está contrastado contra ellos.
    nivel: practica
    enunciado: |
      Calcular una función potencial de $U(x,y)$:

      (a) $U = \left(2x+3y\right)dx + \left(3x-4y\right)dy$

      (b) $U = \left(3x^{2}-2xy+y^{2}\right)dx - \left(x^{2}-2xy+3y^{2}\right)dy$

      (c) $U = e^{x-y}\left[\left(1+x+y\right)dx + \left(1-x-y\right)dy\right]$

      (d) $U = \dfrac{dx}{x+y}+\dfrac{dy}{x+y}$
    pide: Una función potencial de cada una.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado (d) es $\dfrac{dx+dy}{x+y}$. ¿Qué se ve ahí sin hacer
          nada?
        opciones:
          - texto: >-
              Que el numerador es la diferencial de $x+y$, así que todo es
              $\dfrac{d(x+y)}{x+y}$ y el potencial es
              $\ln\lvert x+y\rvert$
            correcta: true
            mensaje: |
              Eso es. Reconocer una diferencial exacta a ojo es lo que
              convierte este apartado en una línea. El método general también
              funciona, pero es tres veces más largo.
          - texto: >-
              Que hay que integrar respecto de $x$ y luego respecto de $y$
            mensaje: |
              Se puede, y sale lo mismo, pero es el camino largo: aquí la
              estructura $\tfrac{du}{u}$ está a la vista.
          - texto: >-
              Que no tiene potencial, porque se anula en $y=-x$
            mensaje: |
              La recta $y=-x$ queda fuera del dominio, y el potencial existe
              en cada uno de los dos semiplanos que separa.

      - tipo: calcular
        titulo: El potencial de (a), evaluado
        pregunta: |
          El potencial de (a) es $F = x^{2}+3xy-2y^{2}$. ¿Cuánto vale en el
          punto $(1,2)$?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '15'
            mensaje: |
              Has sumado los tres términos sin el signo del último:
              $1+6+8$. El $-2y^{2}$ resta.
          - valor: '7'
            mensaje: |
              Te has dejado el $-2y^{2}$ entero. Es el término que viene de
              integrar el $-4y$ del segundo paréntesis.
        pista: |
          $F(1,2) = 1 + 3\cdot1\cdot2 - 2\cdot4$.
        desarrollo: |
          $$
          F(1,2) = 1 + 6 - 8 = -1
          $$

          Y la comprobación de que el potencial es correcto:
          $F_x = 2x+3y$ ✓ y $F_y = 3x-4y$ ✓

      - tipo: calcular
        titulo: El potencial de (c), evaluado
        pregunta: |
          El potencial de (c) es $F = e^{x-y}(x+y)$. ¿Cuánto vale en
          $(1,0)$?
        respuesta:
          tipo: numero
          valor: '2.7183'
          tolerancia: 0.003
          formato: en forma exacta (e) o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es $x+y$ en ese punto, sin multiplicar por la exponencial.
              En $(1,0)$, $e^{x-y}=e^{1}$.
          - valor: '0.3679'
            mensaje: |
              $e^{-1}$: el signo del exponente. Es $e^{x-y}$, y en $(1,0)$ eso
              vale $e^{1}$.
        pista: |
          En $(1,0)$: $e^{1-0}=e$ y $x+y=1$.
        desarrollo: |
          $$
          F(1,0) = e^{1}\cdot 1 = e \approx 2{,}7183
          $$

          Comprobación:
          $F_x = e^{x-y}(x+y)+e^{x-y} = e^{x-y}(1+x+y)$ ✓ y
          $F_y = -e^{x-y}(x+y)+e^{x-y} = e^{x-y}(1-x-y)$ ✓

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Existe potencial cuando $M_y=N_x$, y encontrarlo es el mismo
              procedimiento que en una EDO exacta.
          - texto: >-
              Se integra $M$ respecto de $x$, se deriva el resultado respecto
              de $y$ y se compara con $N$ para despejar la función que falta.
          - texto: >-
              En (c) y en (d) conviene reconocer la estructura a ojo:
              $d\left[e^{x-y}(x+y)\right]$ y $\tfrac{du}{u}$.
          - texto: >-
              Y el potencial es único, así que si dos personas llegan a
              expresiones distintas, una está mal.
            trampa: true
            mensaje: |
              Es único **salvo una constante aditiva**: $x^{2}+3xy-2y^{2}$ y
              $x^{2}+3xy-2y^{2}+7$ son los dos potenciales del mismo campo.
              Dos expresiones que difieran en una constante son las dos
              correctas, y comprobarlo es derivar.
        veredicto: |
          Hallar un potencial es exactamente el mismo trabajo que resolver una
          EDO exacta, con otro nombre. Y la comprobación también: derivar el
          candidato y ver si devuelve el campo.
    resolucion: |
      **Los cuatro potenciales.**

      | apartado | $F(x,y)$ |
      |---|---|
      | (a) | $x^{2}+3xy-2y^{2}$ |
      | (b) | $x^{3}-x^{2}y+xy^{2}-y^{3}$ |
      | (c) | $e^{x-y}\left(x+y\right)$ |
      | (d) | $\ln\lvert x+y\rvert$ |

      ### 1 · El procedimiento general, en (b)

      $$
      M = 3x^{2}-2xy+y^{2},
      \qquad
      N = -\left(x^{2}-2xy+3y^{2}\right)
      $$

      $$
      M_y = -2x+2y = N_x \;\checkmark
      $$

      $$
      F = \int M\,dx = x^{3}-x^{2}y+xy^{2}+g(y)
      $$

      $$
      F_y = -x^{2}+2xy+g'(y) = N
      \;\Longrightarrow\;
      g'(y) = -3y^{2}
      \;\Longrightarrow\;
      g = -y^{3}
      $$

      ### 2 · Los dos que se ven a ojo

      **(c)** El corchete es
      $\left(1+x+y\right)dx+\left(1-x-y\right)dy$, y multiplicado por
      $e^{x-y}$ es exactamente $d\left[e^{x-y}(x+y)\right]$: la exponencial
      aporta el $+1$ y el $-1$ al derivar.

      **(d)** $\dfrac{dx+dy}{x+y} = \dfrac{d(x+y)}{x+y}$, que es
      $d\ln\lvert x+y\rvert$.

      ### 3 · Por qué esto importa

      Con potencial, **cualquier integral de línea de ese campo entre dos
      puntos es la diferencia de $F$**, sin parametrizar nada:

      $$
      \int_{A}^{B} U = F(B)-F(A)
      $$

      Y por eso lo primero que se hace ante una integral de línea es
      comprobar si el campo es conservativo: si lo es, el ejercicio se acaba
      con dos evaluaciones.

      **Lo que hay que llevarse.** El potencial es único salvo constante, y se
      comprueba derivando. Y merece la pena mirar el campo dos segundos antes
      de aplicar el método: en dos de estos cuatro apartados la estructura está
      a la vista y el ejercicio se resuelve en una línea.

  - id: green-en-un-triangulo-del-boletin
    titulo: Green en un triángulo, y el centro de gravedad que ahorra la integral
    fuente: >-
      Ejercicio 5 · Boletín «Integral de línea. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él.
    nivel: practica
    enunciado: |
      Utilizando la fórmula de Green calcular
      $I=\displaystyle\oint_L 2\left(x^{2}+y^{2}\right)dx + \left(x+y\right)^{2}dy$
      donde $L$ es el contorno de un triángulo cuyos vértices son $A(1,1)$,
      $B(2,2)$ y $C(1,3)$.
    pide: El valor de la circulación.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué queda dentro de la integral doble al aplicar Green?
        opciones:
          - texto: >-
              $N_x - M_y = 2(x+y) - 4y = 2x-2y$
            correcta: true
            mensaje: |
              Eso es, y fíjate en lo que ha pasado: los cuadrados
              desaparecen y queda una función **lineal**. Ahí está el premio de
              usar Green.
          - texto: >-
              $M_x - N_y$
            mensaje: |
              El orden importa: es la derivada de $N$ respecto de $x$ menos la
              de $M$ respecto de $y$. Al revés cambia el signo.
          - texto: >-
              $2(x^{2}+y^{2}) + (x+y)^{2}$
            mensaje: |
              Eso es sumar los dos campos, no derivarlos. Green sustituye la
              circulación por la doble de $N_x-M_y$.

      - tipo: calcular
        titulo: La circulación
        pregunta: |
          El triángulo tiene área $1$ y su centro de gravedad está en
          $\left(\tfrac43,2\right)$. ¿Cuánto vale $I$?
        respuesta:
          tipo: numero
          valor: '-1.3333'
          tolerancia: 0.006
          formato: en forma exacta (-4/3) o con cuatro decimales
        distractores:
          - valor: '1.3333'
            mensaje: |
              El signo. El centro de gravedad tiene $\overline{x}=\tfrac43$ y
              $\overline{y}=2$, así que $2\overline{x}-2\overline{y}$ es
              negativo: $\tfrac83-4$.
          - valor: '-2.6667'
            mensaje: |
              El doble. Revisa el área: los vértices $(1,1)$, $(2,2)$ y
              $(1,3)$ dan un triángulo de base $2$ —el lado vertical $x=1$— y
              altura $1$, o sea área $1$.
        pista: |
          $\displaystyle\iint (2x-2y)\,dA
          = 2\left(\overline{x}-\overline{y}\right)\cdot\text{área}$, porque
          la integral de una función lineal es su valor en el centro de
          gravedad por el área.
        desarrollo: |
          $$
          I = \iint_D \left(2x-2y\right)dA
          = 2\left(\overline{x}-\overline{y}\right)\cdot A
          $$

          $$
          = 2\left(\frac43-2\right)\cdot1 = 2\cdot\left(-\frac23\right)
          = -\frac43
          $$

          El centro de gravedad de un triángulo es la media de sus vértices:
          $\left(\tfrac{1+2+1}{3},\tfrac{1+2+3}{3}\right)
          = \left(\tfrac43,2\right)$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Green cambia la circulación por
              $\iint_D\left(N_x-M_y\right)dA$, con $D$ el interior de la curva.
          - texto: >-
              Aquí $N_x-M_y = 2x-2y$, que es lineal: los cuadrados del
              enunciado desaparecen al derivar.
          - texto: >-
              La integral de una función **lineal** sobre un recinto es su
              valor en el centro de gravedad multiplicado por el área.
          - texto: >-
              Y por eso el resultado depende solo del área del triángulo, no de
              dónde esté.
            trampa: true
            mensaje: |
              Depende de las dos cosas: $2(\overline{x}-\overline{y})\cdot A$
              lleva el centro de gravedad dentro. El mismo triángulo trasladado
              a $(1,1)$, $(2,2)$, $(1,3)$ más un vector daría otro resultado.
              Lo que no depende de la posición es el **área**.
        veredicto: |
          Dos atajos encadenados: Green convierte una circulación por tres
          lados en una integral doble, y la linealidad del integrando convierte
          esa doble en una multiplicación. El ejercicio entero cabe en dos
          líneas.
    resolucion: |
      **Datos.** $L$: contorno del triángulo $A(1,1)$, $B(2,2)$, $C(1,3)$.
      $M = 2\left(x^{2}+y^{2}\right)$, $N = \left(x+y\right)^{2}$.

      ### 1 · Green

      $$
      \oint_L M\,dx+N\,dy = \iint_D\left(N_x-M_y\right)dA
      $$

      $$
      N_x = 2(x+y), \qquad M_y = 4y
      \qquad\Longrightarrow\qquad
      N_x-M_y = 2x-2y
      $$

      ### 2 · Sin integrar

      El integrando es lineal, así que

      $$
      \iint_D\left(2x-2y\right)dA
      = 2\left(\overline{x}-\overline{y}\right)\cdot A
      $$

      | dato | valor |
      |---|---|
      | vértices | $(1,1)$, $(2,2)$, $(1,3)$ |
      | centro de gravedad | $\left(\tfrac43,\,2\right)$ |
      | área | $\tfrac12\cdot 2\cdot 1 = 1$ |

      $$
      \boxed{\ I = 2\left(\tfrac43-2\right)\cdot1 = -\tfrac43\ }
      $$

      ### 3 · La alternativa, para comparar

      Sin Green habría que parametrizar los tres lados y hacer tres
      integrales, cada una con un cuadrado dentro. Con Green y la linealidad,
      dos líneas. **Ese es el motivo de que el enunciado diga «utilizando la
      fórmula de Green»**: no es una preferencia, es la diferencia entre cinco
      minutos y veinte.

      **Lo que hay que llevarse.** Después de aplicar Green, mirar qué ha
      quedado dentro de la doble. Si es una constante, la integral es
      constante por área; si es lineal, es su valor en el centro de gravedad
      por el área. Solo si es de grado dos o más hay que integrar de verdad.

  - id: green-en-la-circunferencia-del-boletin
    titulo: Green sobre una circunferencia, y el integrando que se vuelve radial
    fuente: >-
      Ejercicio 6 · Boletín «Integral de línea. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él.
    nivel: practica
    enunciado: |
      Calcular $I=\displaystyle\oint_L -x^{2}y\,dx + xy^{2}dy$ donde $L$ es la
      circunferencia $x^{2}+y^{2}=R^{2}$.
    pide: El valor de la circulación.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al aplicar Green queda $\iint_D\left(N_x-M_y\right)dA$. ¿Qué es
          $N_x-M_y$ aquí?
        opciones:
          - texto: >-
              $y^{2}+x^{2}$, que en polares es $\rho^{2}$
            correcta: true
            mensaje: |
              Exacto, y ahí está todo el ejercicio: la doble se vuelve la
              integral de $\rho^{2}$ sobre un disco, que es de las más
              conocidas del tema anterior.
          - texto: >-
              $y^{2}-x^{2}$
            mensaje: |
              $M = -x^{2}y$, así que $M_y = -x^{2}$, y al restarlo **suma**:
              $y^{2}-(-x^{2}) = y^{2}+x^{2}$. Cuidado con el signo doble.
          - texto: >-
              $2xy$
            mensaje: |
              $2xy$ saldría de derivar $N$ respecto de $y$ o $M$ respecto de
              $x$, que no son las derivadas que pide Green.

      - tipo: calcular
        titulo: La circulación, con R = 2
        pregunta: |
          Con $R=2$, ¿cuánto vale $I$?
        respuesta:
          tipo: numero
          valor: '25.1327'
          tolerancia: 0.02
          formato: en forma exacta (piR⁴/2) o con cuatro decimales
        distractores:
          - valor: '50.2655'
            mensaje: |
              El doble. $\int_0^{R}\rho^{3}d\rho = \tfrac{R^{4}}{4}$, no
              $\tfrac{R^{4}}{2}$; el $\tfrac12$ final sale de multiplicar por
              el $2\pi$ del ángulo.
          - valor: '12.5664'
            mensaje: |
              $4\pi$ es $\pi R^{2}$ con $R=2$, o sea el **área** del disco. El
              integrando no es $1$: es $\rho^{2}$.
        pista: |
          $\displaystyle\iint_{\rho\le R}\rho^{2}\,dA
          = \int_0^{2\pi}\!\!\int_0^{R}\rho^{3}\,d\rho\,d\theta$.
        desarrollo: |
          $$
          I = \iint_{x^{2}+y^{2}\le R^{2}}\left(x^{2}+y^{2}\right)dA
          = \int_0^{2\pi}\!\!\int_0^{R}\rho^{3}\,d\rho\,d\theta
          = 2\pi\cdot\frac{R^{4}}{4}
          = \frac{\pi R^{4}}{2}
          $$

          Con $R=2$: $\tfrac{16\pi}{2} = 8\pi \approx 25{,}1327$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El campo es de clase $C^{1}$ en todo el disco —son polinomios—,
              así que Green se puede aplicar sin reservas.
          - texto: >-
              $N_x-M_y = y^{2}+x^{2}$, y en polares eso es $\rho^{2}$.
          - texto: >-
              Con el jacobiano, dentro queda $\rho^{3}$, y la doble se separa
              en $2\pi$ por $\tfrac{R^{4}}{4}$.
          - texto: >-
              Y como el integrando resultante es positivo, el signo del
              resultado no depende del sentido de recorrido.
            trampa: true
            mensaje: |
              Sí depende: recorrida en sentido horario, la misma circulación
              vale $-\tfrac{\pi R^{4}}{2}$. La fórmula de Green supone el
              sentido **positivo** —antihorario, dejando el recinto a la
              izquierda—, y con el otro cambia el signo. Que el integrando de
              la doble sea positivo solo dice que en sentido positivo el
              resultado es positivo.
        veredicto: |
          Compara este ejercicio con el 2 del mismo boletín: allí Green no se
          podía aplicar porque el campo se iba a infinito en el origen; aquí
          son polinomios y se aplica sin pensar. **La hipótesis que hay que
          mirar es siempre la misma**, y mirarla cuesta un vistazo.
    resolucion: |
      **Datos.** $M=-x^{2}y$, $N=xy^{2}$, sobre $x^{2}+y^{2}=R^{2}$.

      ### 1 · Las hipótesis

      Los dos campos son polinomios: de clase $C^{1}$ en todo el plano, y en
      particular en el disco. Green se aplica sin más.

      ### 2 · La cuenta

      $$
      N_x = y^{2}, \qquad M_y = -x^{2}
      \qquad\Longrightarrow\qquad
      N_x - M_y = x^{2}+y^{2}
      $$

      $$
      I = \iint_{\rho\le R}\left(x^{2}+y^{2}\right)dA
      = \int_0^{2\pi}\!\!\int_0^{R}\rho^{3}d\rho\,d\theta
      $$

      $$
      \boxed{\ I = \frac{\pi R^{4}}{2}\ }
      $$

      ### 3 · La comparación que conviene hacer

      | ejercicio | campo | ¿Green? | resultado |
      |---|---|---|---|
      | 2 del boletín | racional, singular en el origen | **no** | $-2\pi$, parametrizando |
      | este | polinómico | sí | $\tfrac{\pi R^{4}}{2}$ |

      Los dos son circunferencias centradas en el origen y los dos son
      circulaciones cerradas. Lo único que los separa es si el campo está
      definido dentro.

      **Lo que hay que llevarse.** Green convierte una integral de línea en
      una doble, y muchas veces esa doble cae en polares de forma natural —
      aquí, en la integral de $\rho^{2}$ sobre un disco, que es la más repetida
      del tema anterior. Los dos temas se usan juntos, y conviene tenerlos
      juntos en la cabeza.

  - id: la-parabola-y-su-cuerda
    titulo: Una parábola y su cuerda, y dos circulaciones que se leen sin integrar
    fuente: >-
      Ejercicio 7 · Boletín «Integral de línea. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica los dos
      resultados y el desarrollo está contrastado contra ellos.
    nivel: practica
    enunciado: |
      Por los puntos $A(1,0)$ y $B(2,3)$ se ha trazado una parábola $AmB$ cuyo
      eje de simetría es $OY$ y su cuerda es $AnB$. Hallar:

      (a) $\displaystyle\oint_{AmBnA} (x+y)\,dx - (x-y)\,dy$

      (b) $\displaystyle\oint_{AmBnA} (x-y)\,dx - (x+y)\,dy$
    pide: El valor de las dos circulaciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          «Parábola cuyo eje de simetría es $OY$» por $A(1,0)$ y $B(2,3)$.
          ¿Cuál es?
        opciones:
          - texto: >-
              $y = x^{2}-1$: el eje $OY$ obliga a que no haya término en $x$,
              y los dos puntos fijan los dos coeficientes que quedan
            correcta: true
            mensaje: |
              Eso es. $y=ax^{2}+c$ con $a+c=0$ y $4a+c=3$ da $a=1$, $c=-1$.
              El «eje de simetría $OY$» es la condición que elimina el término
              lineal.
          - texto: >-
              $y = 3x^{2}-3$
            mensaje: |
              Comprueba en $B(2,3)$: $3\cdot4-3 = 9 \ne 3$. Los dos puntos
              tienen que cumplirse a la vez.
          - texto: >-
              Falta un dato: con dos puntos no se determina una parábola
            mensaje: |
              Con dos puntos y **una condición de simetría**, sí. El eje $OY$
              mata el coeficiente de $x$, y quedan dos incógnitas para dos
              ecuaciones.

      - tipo: calcular
        titulo: El área encerrada
        pregunta: |
          ¿Cuánto vale el área entre la parábola $y=x^{2}-1$ y la cuerda
          $y=3x-3$, entre $x=1$ y $x=2$?
        respuesta:
          tipo: numero
          valor: '0.1667'
          tolerancia: 0.001
          formato: en forma exacta (1/6) o con cuatro decimales
        distractores:
          - valor: '1.5'
            mensaje: |
              Revisa la resta: la cuerda va **por encima** de la parábola en
              todo el tramo, así que el integrando es
              $(3x-3)-(x^{2}-1) = -x^{2}+3x-2$, que se anula en $x=1$ y
              $x=2$.
          - valor: '-0.1667'
            mensaje: |
              El signo, y viene de restar al revés. Un área es positiva: la
              curva de arriba menos la de abajo.
        pista: |
          $\displaystyle\int_1^{2}\left(-x^{2}+3x-2\right)dx$.
        desarrollo: |
          $$
          \int_1^{2}\left[\left(3x-3\right)-\left(x^{2}-1\right)\right]dx
          = \int_1^{2}\left(-x^{2}+3x-2\right)dx
          $$

          $$
          = \left[-\frac{x^{3}}{3}+\frac{3x^{2}}{2}-2x\right]_1^{2}
          = \left(-\frac83+6-4\right)-\left(-\frac13+\frac32-2\right)
          = \frac16
          $$

      - tipo: calcular
        titulo: La primera circulación
        pregunta: |
          Con $N_x-M_y = -2$ y el área que acabas de calcular, ¿cuánto vale
          (a)?
        respuesta:
          tipo: numero
          valor: '-0.3333'
          tolerancia: 0.002
          formato: en forma exacta (-1/3) o con cuatro decimales
        distractores:
          - valor: '0.3333'
            mensaje: |
              El signo. $N_x-M_y=-2$ es negativo, y multiplicado por un área
              positiva da negativo.
          - valor: '-0.1667'
            mensaje: |
              Te has dejado el factor $-2$: la circulación es
              $\left(N_x-M_y\right)$ **por** el área, no el área a secas.
        pista: |
          Cuando $N_x-M_y$ es constante, Green da esa constante por el área.
        desarrollo: |
          $$
          M = x+y,\quad N = -(x-y)
          \qquad
          N_x = -1, \quad M_y = 1
          \qquad
          N_x-M_y = -2
          $$

          $$
          I = -2\cdot\frac16 = -\frac13
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              «Eje de simetría $OY$» significa que la parábola es
              $y=ax^{2}+c$, sin término lineal, y los dos puntos la fijan:
              $y=x^{2}-1$.
          - texto: >-
              El recinto encerrado por la parábola y su cuerda tiene área
              $\tfrac16$.
          - texto: >-
              En (a), $N_x-M_y=-2$ es constante, así que la circulación es
              $-2$ por el área.
          - texto: >-
              Y en (b) sale $0$ porque el recinto es simétrico.
            trampa: true
            mensaje: |
              Sale $0$ porque **el campo es conservativo**:
              $N_x = -1$ y $M_y = -1$ coinciden, así que $N_x-M_y=0$ y la
              circulación por cualquier curva cerrada es cero. El recinto no
              pinta nada — daría $0$ con cualquier contorno.
        veredicto: |
          Dos apartados con los mismos cuatro términos y dos signos cambiados,
          y el resultado pasa de $-\tfrac13$ a $0$. La diferencia es que el
          segundo campo **sí** es conservativo, y eso se ve comparando dos
          derivadas antes de calcular nada.
    resolucion: |
      **Datos.** Parábola $AmB$ de eje $OY$ por $A(1,0)$ y $B(2,3)$, y su
      cuerda $AnB$.

      ### 1 · Las dos curvas

      | curva | ecuación |
      |---|---|
      | parábola $AmB$ | $y = x^{2}-1$ |
      | cuerda $AnB$ | $y = 3x-3$ |

      El eje $OY$ obliga a $y=ax^{2}+c$; con $A$ y $B$, $a=1$ y $c=-1$.

      ### 2 · El área encerrada

      $$
      A = \int_1^{2}\left(-x^{2}+3x-2\right)dx = \frac16
      $$

      ### 3 · Las dos circulaciones, por Green

      | apartado | $M$ | $N$ | $N_x-M_y$ | $I$ |
      |---|---|---|---|---|
      | (a) | $x+y$ | $-(x-y)$ | $-2$ | $-2\cdot\tfrac16 = -\tfrac13$ |
      | (b) | $x-y$ | $-(x+y)$ | $0$ | $0$ |

      ### 4 · Lo que separa los dos apartados

      En (b), $N_x = -1$ y $M_y = -1$: el campo **es conservativo**, y su
      circulación por cualquier curva cerrada es cero. Ni el área ni la forma
      del recinto intervienen.

      En (a), $N_x-M_y=-2\ne0$: no lo es, y la circulación mide $-2$ veces el
      área encerrada.

      **Lo que hay que llevarse.** Cuando $N_x-M_y$ sale **constante**, Green
      convierte la circulación en «constante por área» y el ejercicio se
      vuelve un problema de áreas entre curvas del tema 5. Y si esa constante
      es cero, el campo es conservativo y la respuesta es cero sin más
      cuentas.

  # ═══════════════════════════════════════════════════════════════════
  # Problemas complementarios del tema 8. Los que ya estaban —8.8, 8.9,
  # 8.10, 8.13 y 8.17— no se repiten aquí, y el 8.1 depende de siete
  # figuras que no se pueden leer sin ambigüedad.
  # ═══════════════════════════════════════════════════════════════════

  - id: parametrizar-cuatro-curvas
    titulo: Cuatro curvas dadas por condiciones, y su parametrización
    fuente: Ejercicio 8.2 · Problemas complementarios, tema 8 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Encontrar las ecuaciones paramétricas de las curvas definidas por las
      siguientes condiciones:

      (a) $(x-2)^{2}+(y-2)^{2}=1$ &nbsp;$\wedge$&nbsp; $y>2$

      (b) $x^{2}+4y^{2}-4=0$ &nbsp;$\wedge$&nbsp; $y>0$

      (c) $x^{2}+z^{2}=y^{2}$ &nbsp;$\wedge$&nbsp; $x>0$ &nbsp;$\wedge$&nbsp;
      $y=3$

      (d) Triángulo $ABCA$ donde los vértices son $A(1,0,1)$, $B(1,0,0)$ y
      $C(0,1,0)$.
    pide: Unas ecuaciones paramétricas de cada curva, con su intervalo.
    pasos:
      - tipo: reconocer
        pregunta: |
          En (a), la circunferencia está centrada en $(2,2)$ y no en el
          origen. ¿Cómo cambia eso la parametrización?
        opciones:
          - texto: >-
              Se suma el centro: $x=2+\cos t$, $y=2+\operatorname{sen}t$
            correcta: true
            mensaje: |
              Eso es. Trasladar una curva es sumar el vector de traslación a
              la parametrización, sin tocar nada más.
          - texto: >-
              Se multiplica por $2$: $x=2\cos t$, $y=2\operatorname{sen}t$
            mensaje: |
              Multiplicar **escala** el radio; lo que hace falta aquí es
              **trasladar** el centro. Con $x=2\cos t$ la curva seguiría
              centrada en el origen, con radio $2$.
          - texto: >-
              Hay que cambiar a coordenadas polares centradas en $(2,2)$
            mensaje: |
              Eso es justo lo que hace $x=2+\cos t$: son las polares desde el
              nuevo centro, escritas directamente.

      - tipo: calcular
        titulo: Un punto de la curva (b)
        pregunta: |
          $x^{2}+4y^{2}=4$ es la elipse $\tfrac{x^{2}}{4}+y^{2}=1$, y con
          $y>0$ se parametriza $x=2\cos t$, $y=\operatorname{sen}t$,
          $t\in[0,\pi]$. ¿Cuánto vale $x$ en $t=\tfrac{\pi}{3}$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es el semieje, o sea el valor en $t=0$. En
              $t=\tfrac{\pi}{3}$ el coseno vale $\tfrac12$.
          - valor: '0.5'
            mensaje: |
              $\tfrac12$ es $\cos\tfrac{\pi}{3}$, sin multiplicar por el
              semieje $2$.
        pista: |
          $\cos\tfrac{\pi}{3}=\tfrac12$.
        desarrollo: |
          $$
          x = 2\cos\frac{\pi}{3} = 2\cdot\frac12 = 1
          $$

          Y $y = \operatorname{sen}\tfrac{\pi}{3} = \tfrac{\sqrt3}{2}$, que
          cumple $1 + 4\cdot\tfrac34 = 4$ ✓

      - tipo: calcular
        titulo: El radio de la curva (c)
        pregunta: |
          $x^{2}+z^{2}=y^{2}$ con $y=3$. ¿Qué radio tiene la circunferencia
          que queda?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '9'
            mensaje: |
              $9$ es el **cuadrado** del radio: la ecuación queda
              $x^{2}+z^{2}=9$.
          - valor: '1.7321'
            mensaje: |
              $\sqrt3$ sería el radio si la ecuación fuese $x^{2}+z^{2}=3$.
              Con $y=3$, el segundo miembro es $y^{2}=9$.
        pista: |
          Sustituye $y=3$ en la ecuación del cono.
        desarrollo: |
          $$
          x^{2}+z^{2} = 3^{2} = 9
          $$

          Circunferencia de radio $3$ en el plano $y=3$. Con $x>0$ es media:

          $$
          x = 3\cos t, \quad y = 3, \quad z = 3\operatorname{sen}t,
          \qquad t\in\left[-\frac{\pi}{2},\frac{\pi}{2}\right]
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Una circunferencia trasladada se parametriza sumando el centro:
              $x=x_0+R\cos t$, $y=y_0+R\operatorname{sen}t$.
          - texto: >-
              Una elipse lleva su semieje delante de cada función
              trigonométrica: $x=a\cos t$, $y=b\operatorname{sen}t$.
          - texto: >-
              El corte de un cono por un plano perpendicular a su eje es una
              circunferencia, y su radio sale sustituyendo el plano en la
              ecuación.
          - texto: >-
              Y las condiciones del tipo $y>2$ o $x>0$ solo dicen qué mitad se
              toma, así que no cambian el intervalo de $t$.
            trampa: true
            mensaje: |
              Cambian el intervalo, que es **precisamente** cómo se dice qué
              mitad se toma: en (a), $y>2$ significa
              $\operatorname{sen}t>0$, o sea $t\in[0,\pi]$; en (c), $x>0$
              significa $\cos t>0$, o sea
              $t\in\left[-\tfrac{\pi}{2},\tfrac{\pi}{2}\right]$. El intervalo
              es parte de la respuesta.
        veredicto: |
          Una parametrización no está completa sin su **intervalo**: las
          mismas fórmulas con otro rango describen otra curva. Es lo que más
          se olvida al escribirla.
    resolucion: |
      **Las cuatro parametrizaciones.**

      | curva | parametrización | intervalo |
      |---|---|---|
      | (a) | $x=2+\cos t$, $y=2+\operatorname{sen}t$ | $t\in[0,\pi]$ |
      | (b) | $x=2\cos t$, $y=\operatorname{sen}t$ | $t\in[0,\pi]$ |
      | (c) | $x=3\cos t$, $y=3$, $z=3\operatorname{sen}t$ | $t\in\left[-\tfrac{\pi}{2},\tfrac{\pi}{2}\right]$ |

      ### 1 · Las tres primeras

      **(a)** Circunferencia de radio $1$ centrada en $(2,2)$; $y>2$ deja la
      mitad de arriba.

      **(b)** $x^{2}+4y^{2}=4$ es $\tfrac{x^{2}}{4}+y^{2}=1$: elipse de
      semiejes $2$ y $1$. Con $y>0$, media.

      **(c)** El plano $y=3$ corta al cono en la circunferencia
      $x^{2}+z^{2}=9$. Con $x>0$, media.

      ### 2 · El triángulo de (d)

      Un triángulo en el espacio se parametriza **lado a lado**, cada uno con
      su propio parámetro en $[0,1]$:

      | lado | parametrización |
      |---|---|
      | $AB$ | $(1,\,0,\,1-t)$ |
      | $BC$ | $(1-t,\,t,\,0)$ |
      | $CA$ | $(t,\,1-t,\,t)$ |

      Cada uno es $P + t(Q-P)$ con $P$ el punto de salida y $Q$ el de llegada.
      **Un segmento entre dos puntos siempre se escribe así**, y en el espacio
      igual que en el plano.

      **Lo que hay que llevarse.** Tres reglas: trasladar es sumar el centro,
      estirar es multiplicar por el semieje, y un segmento es
      $P+t(Q-P)$. Y la cuarta, la que se olvida: **el intervalo forma parte de
      la parametrización**, y es donde entran las condiciones de desigualdad.

  - id: siete-curvilineas-directas
    titulo: Siete integrales curvilíneas, parametrizando y nada más
    fuente: >-
      Ejercicio 8.3 · Problemas complementarios, tema 8 · Cálculo, UPV/EHU. El
      apartado (g) no dice el radio de la semicircunferencia; el resultado no
      depende de él, y en la resolución se explica por qué.
    nivel: practica
    enunciado: |
      Calcular las siguientes integrales curvilíneas a lo largo de las curvas
      $C$:

      (a) $\displaystyle\int_C y\,dx - x\,dy$, $C$: $(\cos t,\operatorname{sen}t)$, $t\in\left[0,\tfrac{\pi}{2}\right]$

      (b) $\displaystyle\int_C -y\,dx + x\,dy$, $C$: curva $y=x^{3}$ desde $(0,0)$ hasta $(2,8)$

      (c) $\displaystyle\int_C \sqrt{x}\,dx + \sqrt{y}\,dy$, $C$: curva $y=x^{2}$ desde $(0,0)$ hasta $(1,1)$

      (d) $\displaystyle\int_C \frac{y}{x}dx + dy$, $C$: $y=\ln x$, $x\in[1,e]$

      (e) $\displaystyle\int_C y^{2}dx + xy\,dy$, parte de elipse $(a\cos t, b\operatorname{sen}t)$, $t\in\left[0,\tfrac{\pi}{2}\right]$

      (f) $\displaystyle\int_C x\,dx + y\,dy + (x+y-1)dz$, $C$: segmento $(1,1,1)$–$(2,3,4)$

      (g) $\displaystyle\int_C x\,dx + y\,dy$, donde $C$ es la semicircunferencia $x^{2}+y^{2}$, $y>0$
    pide: El valor de las siete integrales.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado (g) es $\int x\,dx+y\,dy$ sobre media circunferencia
          centrada en el origen. ¿Hace falta parametrizar?
        opciones:
          - texto: >-
              No: el campo es conservativo con potencial
              $\tfrac{x^{2}+y^{2}}{2}$, y sobre la circunferencia ese potencial
              es **constante**, así que la integral vale $0$
            correcta: true
            mensaje: |
              Exacto, y por eso da igual el radio que no dice el enunciado. Los
              dos extremos están sobre la misma curva de nivel del potencial.
          - texto: >-
              Sí, y hace falta saber el radio
            mensaje: |
              El radio no aparece en la respuesta: los extremos son
              $(-R,0)$ y $(R,0)$, y el potencial vale $\tfrac{R^{2}}{2}$ en
              los dos.
          - texto: >-
              No, porque toda integral sobre una curva cerrada es cero
            mensaje: |
              Una **semi**circunferencia no es cerrada. Y aunque lo fuera, eso
              solo vale para campos conservativos.

      - tipo: calcular
        titulo: El apartado (a)
        pregunta: |
          $\displaystyle\int_C y\,dx-x\,dy$ con $C$: $(\cos t,
          \operatorname{sen}t)$, $t\in\left[0,\tfrac{\pi}{2}\right]$.
        respuesta:
          tipo: numero
          valor: '-1.5708'
          tolerancia: 0.002
          formato: en forma exacta (-pi/2) o con cuatro decimales
        distractores:
          - valor: '1.5708'
            mensaje: |
              El signo. Sustituyendo,
              $y\,dx - x\,dy = -\operatorname{sen}^{2}t-\cos^{2}t = -1$, y la
              integral de $-1$ sobre un intervalo de longitud
              $\tfrac{\pi}{2}$ es negativa.
          - valor: '0'
            mensaje: |
              Sería $0$ si el campo fuese conservativo. Aquí
              $M_y=1$ y $N_x=-1$: no lo es. Compáralo con el apartado (g),
              donde sí lo es.
        pista: |
          Sustituye y simplifica antes de integrar: el integrando se vuelve
          una constante.
        desarrollo: |
          $$
          y\,dx - x\,dy
          = \operatorname{sen}t\left(-\operatorname{sen}t\right)dt
          - \cos t\left(\cos t\right)dt
          = -dt
          $$

          $$
          I = \int_0^{\pi/2}(-1)\,dt = -\frac{\pi}{2}
          $$

      - tipo: calcular
        titulo: El apartado (f), en el espacio
        pregunta: |
          $\displaystyle\int_C x\,dx+y\,dy+(x+y-1)dz$ sobre el segmento de
          $(1,1,1)$ a $(2,3,4)$.
        respuesta:
          tipo: numero
          valor: '13'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '6'
            mensaje: |
              $6$ es lo que aportan los dos primeros términos,
              $\int x\,dx+y\,dy$. Falta el tercero, que es el que lleva $dz$.
          - valor: '7'
            mensaje: |
              $7$ es lo que aporta el tercer término. Hay que sumarle los dos
              primeros.
        pista: |
          Parametriza $(1+t,\,1+2t,\,1+3t)$ con $t\in[0,1]$, de donde
          $dx=dt$, $dy=2dt$, $dz=3dt$.
        desarrollo: |
          $$
          \int_0^{1}\left[(1+t) + 2(1+2t) + 3\left((1+t)+(1+2t)-1\right)\right]dt
          $$

          $$
          = \int_0^{1}\left[3+5t + 3+9t\right]dt
          = \int_0^{1}\left(6+14t\right)dt = 6+7 = 13
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Cuando la curva viene ya parametrizada —(a) y (e)— se sustituye y
              se integra en $t$; cuando viene como $y=f(x)$ —(b), (c) y (d)—
              se usa $x$ como parámetro.
          - texto: >-
              Un segmento en el espacio se parametriza como
              $P+t(Q-P)$, y los tres diferenciales salen proporcionales a
              $dt$.
          - texto: >-
              Antes de parametrizar conviene mirar si el campo es
              conservativo: en (g) lo es, y la integral sale $0$ sin cuentas.
          - texto: >-
              Y en (b), como el campo $(-y,x)$ tampoco es conservativo, hay que
              parametrizar — pero el resultado sería el mismo por cualquier
              otro camino entre los mismos extremos.
            trampa: true
            mensaje: |
              Justamente no: si el campo no es conservativo, el resultado
              **depende del camino**. Por la recta de $(0,0)$ a $(2,8)$ la
              misma integral daría $0$, no $8$. Que la integral no dependa del
              camino es equivalente a que el campo sea conservativo.
        veredicto: |
          El orden que ahorra trabajo: primero mirar si el campo es
          conservativo, después elegir el parámetro más cómodo. En estos siete
          apartados, ese primer vistazo resuelve uno entero.
    resolucion: |
      **Los siete resultados.**

      | apartado | valor |
      |---|---|
      | (a) | $-\tfrac{\pi}{2}$ |
      | (b) | $8$ |
      | (c) | $\tfrac43$ |
      | (d) | $\tfrac32$ |
      | (e) | $-\tfrac{ab^{2}}{3}$ |
      | (f) | $13$ |
      | (g) | $0$ |

      ### 1 · Qué parámetro usar en cada caso

      | forma en que viene la curva | parámetro |
      |---|---|
      | ya parametrizada, (a) y (e) | el $t$ que dan |
      | $y=f(x)$, (b), (c) y (d) | la propia $x$ |
      | segmento, (f) | $P+t(Q-P)$ con $t\in[0,1]$ |

      ### 2 · Los que salen redondos

      **(c)** Con $y=x^{2}$: $\sqrt{y}=x$ y $dy=2x\,dx$, así que

      $$
      \int_0^{1}\left(x^{1/2}+2x^{2}\right)dx = \frac23+\frac23 = \frac43
      $$

      **(d)** Con $y=\ln x$: $dy=\tfrac{dx}{x}$, así que

      $$
      \int_1^{e}\left(\frac{\ln x}{x}+\frac1x\right)dx
      = \left[\frac{\ln^{2}x}{2}+\ln x\right]_1^{e} = \frac12+1 = \frac32
      $$

      ### 3 · El apartado (g), y el radio que falta

      El enunciado escribe «la semicircunferencia $x^{2}+y^{2}$» sin decir a
      qué es igual. No hace falta: el campo $(x,y)$ es conservativo con
      potencial $F=\tfrac{x^{2}+y^{2}}{2}$, y los dos extremos de la
      semicircunferencia —$(-R,0)$ y $(R,0)$— están sobre la misma curva de
      nivel. La integral vale

      $$
      F(R,0)-F(-R,0) = \frac{R^{2}}{2}-\frac{R^{2}}{2} = 0
      $$

      sea cual sea $R$.

      **Lo que hay que llevarse.** Antes de parametrizar, comprobar si el
      campo es conservativo. Si lo es, la integral es una resta de dos
      evaluaciones y no depende del camino; si no lo es, hay que hacer el
      camino que digan y el resultado cambia con él.

  - id: seis-campos-conservativos-y-su-trabajo
    titulo: Seis campos conservativos, con su potencial y su trabajo
    fuente: >-
      Ejercicio 8.4 · Problemas complementarios, tema 8 · Cálculo, UPV/EHU. El
      apartado (f) es de la convocatoria 2018/2019 7E.
    nivel: practica
    enunciado: |
      En los siguientes apartados se trata de: (i) demostrar que el campo
      vectorial $V$ es conservativo, (ii) calcular una función potencial $F$
      del campo $V$ y (iii) calcular el valor de la integral curvilínea de $V$
      entre los puntos $A$ y $B$.

      (a) $V=(x+y,\;x-y)$, &nbsp; $A(1,2)$, $B(2,1)$

      (b) $V=(x+y,\;x)$, &nbsp; $A(0,0)$, $B(1,1)$

      (c) $V=(3x^{2}y+y,\;x^{3}+x)$, &nbsp; $A(1,2)$, $B(4,5)$

      (d) $V=(yz,\;xz+2y,\;xy+1)$, &nbsp; $A(0,0,0)$, $B(1,1,1)$

      (e) $V=(yz,\;xz,\;xy)$, &nbsp; $A(2,2,2)$, $B(1,1,1)$

      (f) $V=(yz+y-1,\;xz+x,\;xy+3z^{2})$, &nbsp; $A(0,2,0)$, $B(\sqrt2,1,1)$
    pide: El potencial de cada campo y el trabajo entre A y B.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el espacio, ¿qué hay que comprobar para saber que un campo
          $(P,Q,R)$ es conservativo?
        opciones:
          - texto: >-
              Tres igualdades: $P_y=Q_x$, $P_z=R_x$ y $Q_z=R_y$ — o
              equivalentemente, que el rotacional sea cero
            correcta: true
            mensaje: |
              Eso es. En el plano basta una comparación; en el espacio son
              tres, una por cada par de variables.
          - texto: >-
              Solo $P_y=Q_x$
            mensaje: |
              Esa es la condición **en el plano**. En el espacio hay tres
              pares de variables y las tres condiciones tienen que cumplirse.
          - texto: >-
              Que el campo sea un gradiente, y eso hay que suponerlo
            mensaje: |
              No hay que suponerlo: se comprueba con las derivadas cruzadas, y
              en un dominio simplemente conexo esa comprobación **basta**.

      - tipo: calcular
        titulo: El trabajo del apartado (c)
        pregunta: |
          Con potencial $F = x^{3}y+xy$, ¿cuánto vale el trabajo de $A(1,2)$ a
          $B(4,5)$?
        respuesta:
          tipo: numero
          valor: '336'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '340'
            mensaje: |
              $340$ es $F(B)$. Falta restarle $F(A)=2+2=4$.
          - valor: '-336'
            mensaje: |
              El signo: es $F(B)-F(A)$, y $F(B)$ es mucho mayor.
        pista: |
          $F(4,5) = 64\cdot5 + 4\cdot5$ y $F(1,2) = 2+2$.
        desarrollo: |
          $$
          F(4,5) = 320+20 = 340,
          \qquad
          F(1,2) = 2+2 = 4
          $$

          $$
          W = 340-4 = 336
          $$

      - tipo: calcular
        titulo: El trabajo del apartado (f)
        pregunta: |
          Con potencial $F = xyz+xy-x+z^{3}$, ¿cuánto vale el trabajo de
          $A(0,2,0)$ a $B(\sqrt2,1,1)$?
        respuesta:
          tipo: numero
          valor: '2.4142'
          tolerancia: 0.003
          formato: en forma exacta (1+sqrt(2)) o con cuatro decimales
        distractores:
          - valor: '1.4142'
            mensaje: |
              $\sqrt2$ es lo que aportan los tres términos con $x$:
              $\sqrt2+\sqrt2-\sqrt2$. Falta el $z^{3}$, que en $B$ vale $1$.
          - valor: '1'
            mensaje: |
              $1$ es solo el $z^{3}$. Los tres términos con $x$ aportan además
              $\sqrt2$.
        pista: |
          $F(A)=0$ porque $x=0$ y $z=0$ anulan los cuatro términos.
        desarrollo: |
          $$
          F(\sqrt2,1,1) = \sqrt2\cdot1\cdot1 + \sqrt2\cdot1 - \sqrt2 + 1
          = \sqrt2 + 1
          $$

          $$
          F(0,2,0) = 0
          $$

          $$
          W = 1+\sqrt2 \approx 2{,}4142
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Comprobar las derivadas cruzadas garantiza que existe potencial,
              en un dominio simplemente conexo.
          - texto: >-
              El potencial se reconstruye integrando una componente y ajustando
              con las otras, exactamente como en una EDO exacta.
          - texto: >-
              El trabajo es $F(B)-F(A)$, y no depende del camino: por eso el
              enunciado no dice cuál se sigue.
          - texto: >-
              Y como el potencial está definido salvo constante, el trabajo
              también.
            trampa: true
            mensaje: |
              El trabajo **no** depende de la constante: al restar
              $F(B)-F(A)$ se cancela. Esa es justamente la razón de que la
              indeterminación del potencial no importe para nada práctico.
        veredicto: |
          El enunciado no dice por qué camino ir, y eso es la pista: si lo
          omite, es porque no importa — y no importa porque el campo es
          conservativo. Reconocer esa pista ahorra buscar una curva que no
          existe.
    resolucion: |
      **Los seis resultados.**

      | apartado | potencial $F$ | $W_{AB}$ |
      |---|---|---|
      | (a) | $\tfrac{x^{2}}{2}+xy-\tfrac{y^{2}}{2}$ | $3$ |
      | (b) | $\tfrac{x^{2}}{2}+xy$ | $\tfrac32$ |
      | (c) | $x^{3}y+xy$ | $336$ |
      | (d) | $xyz+y^{2}+z$ | $3$ |
      | (e) | $xyz$ | $-7$ |
      | (f) | $xyz+xy-x+z^{3}$ | $1+\sqrt2$ |

      ### 1 · La comprobación, en el plano y en el espacio

      | dimensión | condición |
      |---|---|
      | plano, $(M,N)$ | $M_y=N_x$ |
      | espacio, $(P,Q,R)$ | $P_y=Q_x$, $P_z=R_x$, $Q_z=R_y$ |

      En (d), por ejemplo: $P_y = z = Q_x$ ✓, $P_z = y = R_x$ ✓,
      $Q_z = x = R_y$ ✓

      ### 2 · Reconstruir el potencial en el espacio

      Se integra una componente y se ajusta con las otras dos. En (f):

      $$
      F = \int (yz+y-1)\,dx = xyz+xy-x+g(y,z)
      $$

      $$
      F_y = xz+x+g_y = xz+x \;\Longrightarrow\; g_y = 0
      $$

      $$
      F_z = xy+g_z = xy+3z^{2} \;\Longrightarrow\; g_z = 3z^{2}
      \;\Longrightarrow\; g = z^{3}
      $$

      ### 3 · El caso (e), que sale negativo

      $F=xyz$, y se va de $(2,2,2)$ —donde vale $8$— a $(1,1,1)$ —donde vale
      $1$—:

      $$
      W = 1-8 = -7
      $$

      El trabajo negativo significa que el campo se opone al movimiento en
      conjunto. No hay nada que revisar: el signo es un resultado, no un
      error.

      **Lo que hay que llevarse.** Estos seis apartados son la misma cuenta
      que las EDOs exactas del tema 9, con otro nombre y una variable más. Y
      el premio es el mismo: con potencial, **cualquier** integral entre dos
      puntos son dos evaluaciones y una resta.

  - id: cinco-veces-green
    titulo: Cinco veces Green, y las tres formas que toma la integral doble
    fuente: >-
      Ejercicio 8.5 · Problemas complementarios, tema 8 · Cálculo, UPV/EHU.
      Los recintos de (a) y (b) los da el boletín en figuras; aquí se
      describen con palabras, y los radios de (a) los confirma el resultado
      publicado.
    nivel: practica
    enunciado: |
      Utilizando el teorema de Green, evaluar las integrales curvilíneas
      indicadas:

      (a) $\displaystyle\oint_C \left(x^{3}-y^{3}\right)dx + \left(x^{3}+y^{3}\right)dy$, $C$: el cuarto de corona $2\le\sqrt{x^{2}+y^{2}}\le4$ del primer cuadrante, recorrido en sentido horario.

      (b) $\displaystyle\oint_C y^{2}dx + \left(x+y\right)^{2}dy$, $C$: el
      triángulo $ABC$ de vértices $A(0,1)$, $B(1,1)$ y $C(1,0)$, recorrido en
      ese orden.

      (c) $\displaystyle\oint_C xy\,dx + \left(x+y\right)dy$, $C$:
      circunferencia $x^{2}+y^{2}=1$.

      (d) $\displaystyle\oint_C x^{2}y\,dx - xy^{2}dy$, $C$: circunferencia
      $x^{2}+y^{2}=R^{2}$.

      (e) $\displaystyle\oint_C \left(x+y\right)dx - \left(x-y\right)dy$, $C$:
      elipse $\dfrac{x^{2}}{a^{2}}+\dfrac{y^{2}}{b^{2}}=1$.
    pide: El valor de las cinco circulaciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          Después de aplicar Green, ¿de qué depende que la doble sea fácil o
          difícil?
        opciones:
          - texto: >-
              De qué queda dentro: si es constante, es constante por área; si
              es lineal, es su valor en el centro de gravedad por el área; si
              es radial, salen polares
            correcta: true
            mensaje: |
              Esos son los tres casos, y los cinco apartados de aquí caen en
              ellos. Mirar $N_x-M_y$ antes de montar la integral decide el
              camino.
          - texto: >-
              De la forma del recinto, siempre
            mensaje: |
              El recinto importa, pero menos: en (e) el recinto es una elipse
              —incómoda— y aun así la integral es inmediata, porque el
              integrando es constante.
          - texto: >-
              De si la curva está parametrizada
            mensaje: |
              Después de Green ya no hay curva: hay un recinto y una integral
              doble. La parametrización deja de importar.

      - tipo: calcular
        titulo: El apartado (c)
        pregunta: |
          $\displaystyle\oint_C xy\,dx+(x+y)dy$ sobre $x^{2}+y^{2}=1$.
        respuesta:
          tipo: numero
          valor: '3.1416'
          tolerancia: 0.004
          formato: en forma exacta (pi) o con cuatro decimales
        distractores:
          - valor: '0'
            mensaje: |
              El término $-x$ sí se anula por simetría, pero el $1$ no: aporta
              el área del disco, que es $\pi$.
          - valor: '6.2832'
            mensaje: |
              $2\pi$ es la **longitud** de la circunferencia unidad. El área
              del disco es $\pi$.
        pista: |
          $N_x-M_y = 1-x$, y $\displaystyle\iint x\,dA = 0$ sobre un disco
          centrado en el origen.
        desarrollo: |
          $$
          N_x = 1, \qquad M_y = x
          \qquad\Longrightarrow\qquad
          N_x - M_y = 1-x
          $$

          $$
          I = \iint_{\rho\le1}\left(1-x\right)dA
          = \underbrace{\pi}_{\text{área}} - \underbrace{0}_{\text{simetría}}
          = \pi
          $$

      - tipo: calcular
        titulo: El apartado (e), con a = 3 y b = 2
        pregunta: |
          $\displaystyle\oint_C (x+y)dx-(x-y)dy$ sobre la elipse de semiejes
          $a=3$ y $b=2$.
        respuesta:
          tipo: numero
          valor: '-37.6991'
          tolerancia: 0.05
          formato: en forma exacta (-2pi·a·b) o con cuatro decimales
        distractores:
          - valor: '37.6991'
            mensaje: |
              El signo. $N_x-M_y = -1-1 = -2$, negativo, y multiplicado por un
              área positiva da negativo.
          - valor: '-18.8496'
            mensaje: |
              Te has dejado el factor $2$: la constante es $-2$, no $-1$.
              $N_x=-1$ y $M_y=+1$, y al restar se suman.
        pista: |
          $N_x-M_y$ es constante, así que la doble es esa constante por el
          área de la elipse, $\pi ab$.
        desarrollo: |
          $$
          M = x+y,\quad N = -(x-y)
          \qquad
          N_x = -1,\quad M_y = 1
          \qquad
          N_x-M_y = -2
          $$

          $$
          I = -2\pi ab
          $$

          Con $a=3$, $b=2$: $-12\pi \approx -37{,}6991$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              En (a), $N_x-M_y = 3x^{2}+3y^{2} = 3\rho^{2}$: radial, así que
              polares, y sobre el cuarto de corona sale $90\pi$.
          - texto: >-
              El sentido horario del apartado (a) cambia el signo, y por eso el
              resultado publicado es $-90\pi$.
          - texto: >-
              En (b), $N_x-M_y = 2x$: lineal, así que la doble es
              $2\overline{x}$ por el área, y el recorrido $A\to B\to C$ es
              horario.
          - texto: >-
              Y en (d), $N_x-M_y = -y^{2}-x^{2}$, que es negativo en todas
              partes, así que la integral es negativa **sea cual sea el
              sentido**.
            trampa: true
            mensaje: |
              El sentido cambia el signo siempre. Green da
              $-\tfrac{\pi R^{4}}{2}$ para el sentido positivo; recorrida al
              revés, la misma circulación vale $+\tfrac{\pi R^{4}}{2}$. Que el
              integrando de la doble no cambie de signo no protege de eso.
        veredicto: |
          Dos cosas se deciden antes de calcular: **qué forma tiene
          $N_x-M_y$** —constante, lineal o radial— y **en qué sentido se
          recorre la curva**. La primera elige el método; la segunda, el
          signo.
    resolucion: |
      **Los cinco resultados.**

      | apartado | $N_x-M_y$ | tipo | valor |
      |---|---|---|---|
      | (a) | $3\left(x^{2}+y^{2}\right)$ | radial | $-90\pi$ |
      | (b) | $2x$ | lineal | $-\tfrac23$ |
      | (c) | $1-x$ | lineal | $\pi$ |
      | (d) | $-\left(x^{2}+y^{2}\right)$ | radial | $-\tfrac{\pi R^{4}}{2}$ |
      | (e) | $-2$ | constante | $-2\pi ab$ |

      ### 1 · Los tres tipos de integral doble

      **Constante** — (e). La doble es la constante por el área:
      $-2\cdot\pi ab$.

      **Lineal** — (b) y (c). La doble es el valor en el centro de gravedad
      por el área. En (b), el triángulo $(0,1)$, $(1,1)$, $(1,0)$ tiene
      $\overline{x}=\tfrac23$ y área $\tfrac12$:

      $$
      \iint 2x\,dA = 2\cdot\frac23\cdot\frac12 = \frac23
      $$

      y con el sentido horario, $-\tfrac23$.

      **Radial** — (a) y (d). Salen polares. En (a):

      $$
      \int_0^{\pi/2}\!\!\int_2^{4} 3\rho^{2}\cdot\rho\,d\rho\,d\theta
      = 3\cdot\frac{\pi}{2}\cdot\frac{256-16}{4} = 90\pi
      $$

      y con el sentido horario, $-90\pi$.

      ### 2 · El signo, que es la mitad de los errores

      La fórmula de Green supone el sentido **positivo**: recorrer la curva
      dejando el recinto a la izquierda, o sea antihorario para la frontera
      exterior. Recorrida al revés, todo cambia de signo. En (a) y (b) el
      boletín pide el sentido horario, y por eso los dos resultados salen
      negativos.

      **Lo que hay que llevarse.** Green no acaba el ejercicio: lo traduce.
      Lo que decide el trabajo que queda es la forma de $N_x-M_y$, y en estos
      cinco apartados están los tres casos posibles. Merece la pena
      clasificarlo antes de escribir la doble.

  - id: cuatro-integrales-respecto-al-arco
    titulo: Cuatro integrales respecto al arco, y el dl que las distingue
    fuente: Ejercicio 8.6 · Problemas complementarios, tema 8 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular la integral curvilínea respecto a la longitud de arco para la
      función y curva indicadas:

      (a) $\displaystyle\int_C x^{2}y\,dl$, $C$: recta $y=x$ desde el origen
      hasta el punto $(2,2)$.

      (b) $\displaystyle\int_C y^{2}dl$, $C$:
      $\left(R\cos t, R\operatorname{sen}t\right)$ donde
      $t\in\left[0,\tfrac{\pi}{2}\right]$.

      (c) $\displaystyle\int_C dl$, $C$: circunferencia de radio $R$ centrada
      en el origen.

      (d) $\displaystyle\int_C \left(x^{2}+y^{2}\right)z\,dl$, $C$:
      $\left(\operatorname{sen}3t,\cos 3t, 4t\right)$ donde $t\in[0,\pi]$.
    pide: El valor de las cuatro integrales.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué se diferencia $\int f\,dl$ de $\int M\,dx+N\,dy$?
        opciones:
          - texto: >-
              En que $dl=\lVert c'(t)\rVert\,dt$ es **siempre positivo**, así
              que la integral no depende del sentido de recorrido
            correcta: true
            mensaje: |
              Eso es, y es la diferencia que más consecuencias tiene: una
              integral respecto al arco mide una longitud, una masa o una
              media, y esas cosas no cambian de signo al recorrer la curva al
              revés.
          - texto: >-
              En que $dl$ es $dx+dy$
            mensaje: |
              Es $\sqrt{dx^{2}+dy^{2}}$, que no es lo mismo: lleva raíz, y por
              eso $dl$ nunca es negativo.
          - texto: >-
              En nada: son notaciones del mismo objeto
            mensaje: |
              Son objetos distintos. La de línea de un campo vectorial cambia
              de signo con el sentido; la respecto al arco, no.

      - tipo: calcular
        titulo: El apartado (a)
        pregunta: |
          $\displaystyle\int_C x^{2}y\,dl$ sobre $y=x$ del origen a $(2,2)$.
        respuesta:
          tipo: numero
          valor: '5.6569'
          tolerancia: 0.006
          formato: en forma exacta (4sqrt(2)) o con cuatro decimales
        distractores:
          - valor: '4'
            mensaje: |
              $4$ es $\int_0^{2}x^{3}dx$, sin el $\sqrt2$ del $dl$. Sobre
              $y=x$, $dl=\sqrt{1+1}\,dx = \sqrt2\,dx$.
          - valor: '2.8284'
            mensaje: |
              La mitad. $\int_0^{2}x^{3}dx = \tfrac{16}{4} = 4$, no $2$.
        pista: |
          Sobre $y=x$: $dl = \sqrt2\,dx$ y el integrando es $x^{2}\cdot x$.
        desarrollo: |
          $$
          \int_0^{2} x^{3}\sqrt2\,dx = \sqrt2\cdot\frac{16}{4} = 4\sqrt2
          \approx 5{,}6569
          $$

      - tipo: calcular
        titulo: El apartado (d), la hélice
        pregunta: |
          $\displaystyle\int_C \left(x^{2}+y^{2}\right)z\,dl$ sobre
          $\left(\operatorname{sen}3t,\cos3t,4t\right)$, $t\in[0,\pi]$.
        respuesta:
          tipo: numero
          valor: '98.696'
          tolerancia: 0.1
          formato: en forma exacta (10pi²) o con tres decimales
        distractores:
          - valor: '19.7392'
            mensaje: |
              $2\pi^{2}$ sale con $\lVert c'\rVert=1$ en vez de $5$. El vector
              velocidad es
              $\left(3\cos3t,-3\operatorname{sen}3t,4\right)$, de módulo
              $\sqrt{9+16}=5$.
          - valor: '197.392'
            mensaje: |
              $20\pi^{2}$ sale de usar
              $\int_0^{\pi}t\,dt = \pi^{2}$. Vale $\tfrac{\pi^{2}}{2}$.
        pista: |
          $x^{2}+y^{2}=1$ en toda la curva, $z=4t$ y
          $\lVert c'(t)\rVert = \sqrt{9+16} = 5$.
        desarrollo: |
          $$
          x^{2}+y^{2} = \operatorname{sen}^{2}3t+\cos^{2}3t = 1
          $$

          $$
          \lVert c'(t)\rVert
          = \sqrt{9\cos^{2}3t+9\operatorname{sen}^{2}3t+16}
          = \sqrt{25} = 5
          $$

          $$
          I = \int_0^{\pi} 1\cdot 4t\cdot 5\,dt = 20\cdot\frac{\pi^{2}}{2}
          = 10\pi^{2} \approx 98{,}696
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $dl = \lVert c'(t)\rVert\,dt$, y en una curva dada como
              $y=f(x)$ eso es $\sqrt{1+f'(x)^{2}}\,dx$.
          - texto: >-
              El apartado (c) con $f=1$ da la **longitud** de la curva:
              $2\pi R$ para la circunferencia entera.
          - texto: >-
              En (d) la hélice tiene rapidez constante $5$, así que el $dl$
              sale de la integral como un factor.
          - texto: >-
              Y como $dl$ no depende del sentido, tampoco depende de la
              parametrización elegida: dos parametrizaciones distintas de la
              misma curva dan integrales distintas.
            trampa: true
            mensaje: |
              La segunda frase contradice a la primera. Precisamente **no**
              dependen: dos parametrizaciones de la misma curva dan la misma
              integral respecto al arco, y eso es lo que hace que la magnitud
              tenga sentido geométrico. Lo que cambia con la parametrización
              es el $t$, no el $dl$.
        veredicto: |
          Una integral respecto al arco mide algo del objeto —su longitud, su
          masa, la media de una función sobre él— y por eso no puede depender
          ni del sentido ni de la parametrización. Cuando el resultado
          dependa, hay un error.
    resolucion: |
      **Los cuatro resultados.**

      | apartado | $dl$ | valor |
      |---|---|---|
      | (a) | $\sqrt2\,dx$ | $4\sqrt2\approx5{,}66$ |
      | (b) | $R\,dt$ | $\tfrac{\pi R^{3}}{4}$ |
      | (c) | $R\,dt$ | $2\pi R$ |
      | (d) | $5\,dt$ | $10\pi^{2}\approx98{,}70$ |

      ### 1 · El diferencial de arco

      $$
      dl = \lVert c'(t)\rVert\,dt
      = \sqrt{x'(t)^{2}+y'(t)^{2}+z'(t)^{2}}\;dt
      $$

      y para una curva $y=f(x)$, tomando $x$ como parámetro,
      $dl=\sqrt{1+f'(x)^{2}}\,dx$.

      ### 2 · El apartado (b), paso a paso

      $$
      \int_0^{\pi/2} R^{2}\operatorname{sen}^{2}t\cdot R\,dt
      = R^{3}\cdot\frac{\pi}{4} = \frac{\pi R^{3}}{4}
      $$

      porque el valor medio de $\operatorname{sen}^{2}$ es $\tfrac12$ y el
      intervalo mide $\tfrac{\pi}{2}$.

      ### 3 · La hélice de (d)

      Tiene tres propiedades que la hacen cómoda:

      | | |
      |---|---|
      | $x^{2}+y^{2}$ | constante, $=1$ |
      | rapidez $\lVert c'\rVert$ | constante, $=5$ |
      | $z$ | lineal en $t$ |

      Con eso, la integral es $5\int_0^{\pi}4t\,dt = 10\pi^{2}$.

      **Lo que hay que llevarse.** El $dl$ es lo único que cambia respecto de
      una integral ordinaria, y calcularlo es derivar la parametrización y
      tomar el módulo. Cuando ese módulo sale **constante** —cualquier hélice,
      cualquier circunferencia parametrizada por el ángulo— sale de la
      integral y el ejercicio se acaba enseguida.

  - id: la-masa-del-cable-helicoidal
    titulo: La masa de un cable en hélice, con densidad que crece a lo largo
    fuente: Ejercicio 8.7 · Problemas complementarios, tema 8 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      La densidad en el punto $(x,y,z)$ de un cable helicoidal, parametrizado
      por $c(t)=\left(\operatorname{sen}t,\cos t,t\right)$ con $t\in[0,6\pi]$,
      viene dada por la función $f(x,y,z)=x^{2}+y^{2}+z^{2}$ g/cm. Calcular la
      masa del cable.
    pide: La masa del cable.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué vale $x^{2}+y^{2}+z^{2}$ sobre esta hélice?
        opciones:
          - texto: >-
              $1+t^{2}$: la parte horizontal es constante y solo crece la
              altura
            correcta: true
            mensaje: |
              Eso es. La hélice está sobre el cilindro de radio $1$, así que
              $x^{2}+y^{2}=1$ siempre, y $z=t$. La densidad crece
              cuadráticamente con la altura.
          - texto: >-
              $t^{2}$
            mensaje: |
              Falta el $1$ de $\operatorname{sen}^{2}t+\cos^{2}t$. Es pequeño
              comparado con $t^{2}$ al final del cable, pero al principio es
              todo lo que hay.
          - texto: >-
              $3t^{2}$
            mensaje: |
              Solo la tercera coordenada es $t$; las otras dos son seno y
              coseno, y su suma de cuadrados vale $1$.

      - tipo: calcular
        titulo: La rapidez
        pregunta: |
          ¿Cuánto vale $\lVert c'(t)\rVert$?
        respuesta:
          tipo: numero
          valor: '1.4142'
          tolerancia: 0.002
          formato: en forma exacta (sqrt(2)) o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es el módulo de la parte horizontal,
              $\left(\cos t,-\operatorname{sen}t\right)$. Falta la tercera
              componente, que vale $1$ también, y el módulo total es
              $\sqrt{1+1}$.
          - valor: '2'
            mensaje: |
              $2$ es el módulo **al cuadrado**. Falta la raíz.
        pista: |
          $c'(t) = \left(\cos t,-\operatorname{sen}t,1\right)$.
        desarrollo: |
          $$
          \lVert c'(t)\rVert
          = \sqrt{\cos^{2}t+\operatorname{sen}^{2}t+1} = \sqrt2
          $$

          Constante: la hélice se recorre a rapidez uniforme.

      - tipo: calcular
        titulo: La masa
        pregunta: |
          ¿Cuánto vale la masa del cable, en gramos?
        respuesta:
          tipo: numero
          valor: '3183.82'
          tolerancia: 1
          formato: en forma exacta (sqrt(2)(6pi+72pi³)) o con dos decimales
        distractores:
          - valor: '2251.30'
            mensaje: |
              Te has dejado el $\sqrt2$ del $dl$. La hélice es más larga que
              su proyección: por cada vuelta sube $2\pi$, y eso alarga el
              recorrido en un factor $\sqrt2$.
          - valor: '3157.16'
            mensaje: |
              Te has dejado el $1$ de $x^{2}+y^{2}$: eso quita
              $\sqrt2\cdot6\pi\approx26{,}7$ g. Es poco, pero es la parte de
              la masa que aporta el radio del cilindro.
        pista: |
          $m=\displaystyle\int_0^{6\pi}\left(1+t^{2}\right)\sqrt2\,dt$, y
          $\int_0^{6\pi}t^{2}dt = \tfrac{(6\pi)^{3}}{3} = 72\pi^{3}$.
        desarrollo: |
          $$
          m = \sqrt2\int_0^{6\pi}\left(1+t^{2}\right)dt
          = \sqrt2\left[6\pi + \frac{\left(6\pi\right)^{3}}{3}\right]
          = \sqrt2\left(6\pi+72\pi^{3}\right)
          $$

          $$
          m \approx 1{,}414214\cdot 2251{,}3015 \approx 3183{,}82 \text{ g}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La masa de un alambre es $\int_C \delta\,dl$: la densidad
              integrada respecto a la longitud de arco.
          - texto: >-
              Sobre esta hélice, $\delta = 1+t^{2}$ y
              $dl=\sqrt2\,dt$, así que la integral es de un polinomio.
          - texto: >-
              El término $72\pi^{3}$ domina: la densidad crece con el cuadrado
              de la altura, y el cable sube $6\pi$.
          - texto: >-
              Y como la hélice da tres vueltas, la masa es tres veces la de una
              vuelta.
            trampa: true
            mensaje: |
              No, porque la densidad **no es la misma en cada vuelta**: crece
              con $t^{2}$. La tercera vuelta pesa mucho más que la primera. La
              masa sería el triple solo con densidad constante.
        veredicto: |
          Es el mismo esquema de siempre —$\int \delta\,dl$— con una densidad
          que depende de la posición. La única destreza específica es
          reconocer que sobre una hélice $x^{2}+y^{2}$ es constante y la
          rapidez también.
    resolucion: |
      **Datos.** Hélice $c(t)=(\operatorname{sen}t,\cos t,t)$,
      $t\in[0,6\pi]$; densidad $\delta = x^{2}+y^{2}+z^{2}$ g/cm.

      ### 1 · Las dos simplificaciones

      | | valor sobre la curva |
      |---|---|
      | $x^{2}+y^{2}$ | $1$, constante |
      | $z$ | $t$ |
      | $\lVert c'\rVert$ | $\sqrt2$, constante |

      $$
      \delta\,dl = \left(1+t^{2}\right)\sqrt2\,dt
      $$

      ### 2 · La integral

      $$
      m = \sqrt2\int_0^{6\pi}\left(1+t^{2}\right)dt
      = \sqrt2\left(6\pi + 72\pi^{3}\right)
      $$

      $$
      \boxed{\ m = \sqrt2\left(6\pi+72\pi^{3}\right) \approx 3183{,}8 \text{ g}\ }
      $$

      ### 3 · De dónde viene cada trozo

      | término | valor | qué aporta |
      |---|---|---|
      | $\sqrt2\cdot6\pi$ | $\approx26{,}7$ g | el radio del cilindro |
      | $\sqrt2\cdot72\pi^{3}$ | $\approx3157{,}2$ g | la altura |

      El $99{,}2\%$ de la masa viene de la altura, porque la densidad crece
      con $z^{2}$ y el cable sube hasta $6\pi\approx18{,}8$.

      ### 4 · La comprobación de tamaño

      La longitud del cable es $\sqrt2\cdot6\pi\approx26{,}7$ cm, y la
      densidad media es $m/L \approx 119$ g/cm. La densidad en el punto medio
      —$t=3\pi$— vale $1+9\pi^{2}\approx89$, y en el extremo,
      $1+36\pi^{2}\approx356$. Una media de $119$ entre esos extremos es
      coherente con un crecimiento cuadrático.

      **Lo que hay que llevarse.** En un alambre con densidad variable, la
      masa se reparte muy desigual: aquí la última vuelta pesa más que las
      dos primeras juntas. Calcular la **densidad media** y compararla con la
      de los extremos es la comprobación que caza los errores de bulto.

  - id: la-misma-circulacion-de-dos-formas
    titulo: La misma circulación por los dos caminos, parametrizando y con Green
    fuente: Ejercicio 8.11 · Problemas complementarios, tema 8 · Cálculo, UPV/EHU (2016/2017 5E)
    nivel: practica
    enunciado: |
      Calcular de dos formas distintas la integral curvilínea
      $\displaystyle\oint_L \left(x^{3}-x^{2}y\right)dx + xy^{2}dy$, donde $L$
      es la frontera del recinto limitado por $y\le\sqrt{1-x^{2}}$,
      $0\le x\le1$, $y\ge0$.
    pide: El valor de la circulación, obtenido por los dos caminos.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué recinto describen las tres condiciones?
        opciones:
          - texto: >-
              El **cuarto de disco** unidad del primer cuadrante, con frontera
              formada por dos segmentos y un arco
            correcta: true
            mensaje: |
              Eso es. $y\le\sqrt{1-x^{2}}$ es «por debajo de la
              semicircunferencia», y $x\ge0$, $y\ge0$ lo recortan al primer
              cuadrante.
          - texto: >-
              El disco unidad entero
            mensaje: |
              Las condiciones $0\le x\le1$ e $y\ge0$ lo recortan a un cuarto.
          - texto: >-
              El cuadrado $[0,1]\times[0,1]$
            mensaje: |
              La condición $y\le\sqrt{1-x^{2}}$ es la que curva el borde
              superior. Sin ella sería el cuadrado.

      - tipo: calcular
        titulo: Por Green
        pregunta: |
          $N_x-M_y = x^{2}+y^{2}$. ¿Cuánto vale la circulación?
        respuesta:
          tipo: numero
          valor: '0.3927'
          tolerancia: 0.0006
          formato: en forma exacta (pi/8) o con cuatro decimales
        distractores:
          - valor: '1.5708'
            mensaje: |
              $\tfrac{\pi}{2}$ es el resultado sobre el **disco entero**. El
              recinto es un cuarto.
          - valor: '0.7854'
            mensaje: |
              $\tfrac{\pi}{4}$ es el **área** del cuarto de disco. El
              integrando no es $1$: es $\rho^{2}$.
        pista: |
          En polares, $\displaystyle\int_0^{\pi/2}\!\!\int_0^{1}\rho^{3}
          \,d\rho\,d\theta$.
        desarrollo: |
          $$
          I = \iint_D\left(x^{2}+y^{2}\right)dA
          = \int_0^{\pi/2}\!\!\int_0^{1}\rho^{3}\,d\rho\,d\theta
          = \frac{\pi}{2}\cdot\frac14 = \frac{\pi}{8}
          $$

      - tipo: calcular
        titulo: Y por el camino largo, un tramo
        pregunta: |
          Parametrizando, el tramo del eje $x$ va de $(0,0)$ a $(1,0)$ con
          $y=0$ y $dy=0$. ¿Cuánto aporta?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.002
          formato: en forma exacta (1/4) o con dos decimales
        distractores:
          - valor: '0'
            mensaje: |
              Con $y=0$ se anulan el $-x^{2}y$ y el $xy^{2}dy$, pero queda el
              $x^{3}dx$, que no lleva $y$ por ningún lado.
          - valor: '0.3333'
            mensaje: |
              $\tfrac13$ sería $\int_0^{1}x^{2}dx$. El integrando que queda es
              $x^{3}$.
        pista: |
          Con $y=0$ y $dy=0$, el integrando se reduce a $x^{3}dx$.
        desarrollo: |
          $$
          \int_0^{1} x^{3}\,dx = \frac14
          $$

          Los otros dos tramos —el arco y el segmento del eje $y$— aportan el
          resto hasta $\tfrac{\pi}{8}\approx0{,}3927$. El segmento del eje
          $y$, recorrido de $(0,1)$ a $(0,0)$, aporta $0$: con $x=0$ y
          $dx=0$ los tres términos se anulan.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El recinto es el cuarto de disco unidad del primer cuadrante, y
              su frontera son dos segmentos y un arco.
          - texto: >-
              Por Green, $N_x-M_y = y^{2}+x^{2}$ y la doble en polares sale
              $\tfrac{\pi}{8}$.
          - texto: >-
              Parametrizando hay que hacer tres integrales, y en dos de ellas
              casi todo se anula porque $x=0$ o $y=0$.
          - texto: >-
              Y como los dos caminos dan lo mismo, el campo es conservativo.
            trampa: true
            mensaje: |
              «Las dos formas» del enunciado son **dos formas de calcular la
              misma integral**, no dos caminos distintos entre dos puntos. Que
              coincidan no dice nada del campo: dice que Green funciona. De
              hecho el campo **no** es conservativo —$N_x-M_y=x^{2}+y^{2}\ne0$—
              y por eso la circulación no es cero.
        veredicto: |
          Cuando un enunciado pide «de dos formas distintas», la nota está en
          que las dos den lo mismo. Y aquí la comparación enseña algo: Green
          convierte tres integrales de línea en una doble que sale en polares.
    resolucion: |
      **Datos.** $M = x^{3}-x^{2}y$, $N = xy^{2}$, sobre la frontera del
      cuarto de disco unidad del primer cuadrante.

      ### 1 · Por Green

      $$
      N_x = y^{2}, \qquad M_y = -x^{2}
      \qquad\Longrightarrow\qquad
      N_x-M_y = x^{2}+y^{2}
      $$

      $$
      I = \int_0^{\pi/2}\!\!\int_0^{1}\rho^{3}\,d\rho\,d\theta
      = \frac{\pi}{8} \approx 0{,}3927
      $$

      ### 2 · Parametrizando

      | tramo | qué queda | valor |
      |---|---|---|
      | eje $x$, de $(0,0)$ a $(1,0)$ | $x^{3}dx$ | $\tfrac14$ |
      | arco, de $(1,0)$ a $(0,1)$ | todo | $\tfrac{\pi}{8}-\tfrac14$ |
      | eje $y$, de $(0,1)$ a $(0,0)$ | nada | $0$ |

      El tramo del eje $y$ se anula entero porque con $x=0$ y $dx=0$ los tres
      términos llevan $x$ de factor.

      ### 3 · Qué gana Green aquí

      | | integrales | dificultad |
      |---|---|---|
      | parametrizando | tres | una con senos y cosenos al cubo |
      | Green | una | polares, inmediata |

      **Lo que hay que llevarse.** Cuando la frontera tiene tramos rectos, la
      parametrización se simplifica mucho en ellos —uno de los diferenciales
      es cero— pero el arco sigue costando. Green evita el arco, que es
      siempre la parte cara.

  - id: el-semieje-que-minimiza-el-trabajo
    titulo: El semieje que hace mínimo el trabajo
    fuente: Ejercicio 8.12 · Problemas complementarios, tema 8 · Cálculo, UPV/EHU (2018/2019 5E)
    nivel: practica
    enunciado: |
      Hallar el valor $b>0$ que minimiza el trabajo realizado al mover una
      partícula, sometida a la fuerza $F(x,y)=\left(3y^{2},16x\right)$, desde
      el punto $(-1,0)$ hasta el punto $(1,0)$ a lo largo de la semielipse
      $x^{2}+\dfrac{y^{2}}{b^{2}}=1$, $y\ge0$.
    pide: El valor de b que minimiza el trabajo.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué tiene sentido que el trabajo dependa de $b$?
        opciones:
          - texto: >-
              Porque el campo **no es conservativo**:
              $M_y = 6y$ y $N_x = 16$, que no coinciden, así que el trabajo
              depende del camino, y $b$ elige el camino
            correcta: true
            mensaje: |
              Exacto. Si el campo fuese conservativo, el trabajo sería el mismo
              para todo $b$ y el ejercicio no tendría respuesta. Que el
              enunciado pida minimizar ya avisa de que no lo es.
          - texto: >-
              Porque el camino es más largo cuanto mayor es $b$
            mensaje: |
              La longitud influye en una integral respecto al arco, no en el
              trabajo de un campo. Lo que hace que dependa del camino es que el
              campo no sea conservativo.
          - texto: >-
              Porque los extremos cambian con $b$
            mensaje: |
              Los extremos son $(-1,0)$ y $(1,0)$ para cualquier $b$: la
              semielipse siempre pasa por ellos. Lo que cambia es la ruta entre
              ellos.

      - tipo: calcular
        titulo: El semieje óptimo
        pregunta: |
          El trabajo, en función de $b$, es $W(b) = 4b^{2}-8\pi b$. ¿Qué valor
          de $b>0$ lo minimiza?
        respuesta:
          tipo: numero
          valor: '3.1416'
          tolerancia: 0.004
          formato: en forma exacta (pi) o con cuatro decimales
        distractores:
          - valor: '6.2832'
            mensaje: |
              $2\pi$ es donde $W$ vuelve a valer $0$, no donde es mínimo. El
              mínimo de una parábola está en el punto medio entre sus dos
              raíces, $0$ y $2\pi$.
          - valor: '1.5708'
            mensaje: |
              $\tfrac{\pi}{2}$ saldría de $8b=4\pi$. La derivada es
              $W'(b)=8b-8\pi$.
        pista: |
          $W$ es una parábola en $b$ con las ramas hacia arriba. Su mínimo
          está donde $W'(b)=0$.
        desarrollo: |
          $$
          W'(b) = 8b - 8\pi = 0 \;\Longrightarrow\; b = \pi
          $$

          Y como el coeficiente de $b^{2}$ es $4>0$, es un mínimo.

      - tipo: calcular
        titulo: Y cuánto vale ese trabajo mínimo
        pregunta: |
          Con $b=\pi$, ¿cuánto vale $W$?
        respuesta:
          tipo: numero
          valor: '-39.4784'
          tolerancia: 0.03
          formato: en forma exacta (-4pi²) o con cuatro decimales
        distractores:
          - valor: '39.4784'
            mensaje: |
              El signo. $W(\pi) = 4\pi^{2}-8\pi^{2}$, y eso es negativo: el
              campo se opone al movimiento en conjunto.
          - valor: '0'
            mensaje: |
              $W=0$ ocurre en $b=0$ y en $b=2\pi$, que son las raíces de la
              parábola. El mínimo está entre las dos.
        pista: |
          $W(\pi) = 4\pi^{2}-8\pi\cdot\pi$.
        desarrollo: |
          $$
          W(\pi) = 4\pi^{2}-8\pi^{2} = -4\pi^{2} \approx -39{,}4784
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El campo no es conservativo, así que el trabajo depende del
              camino y tiene sentido buscar el mejor.
          - texto: >-
              Parametrizando $x=\cos t$, $y=b\operatorname{sen}t$ con $t$ de
              $\pi$ a $0$, sale $W(b)=4b^{2}-8\pi b$.
          - texto: >-
              Es una parábola con las ramas hacia arriba, y su vértice está en
              $b=\pi$.
          - texto: >-
              Y como el mínimo es negativo, en el camino óptimo la fuerza
              siempre se opone al movimiento.
            trampa: true
            mensaje: |
              El trabajo **total** es negativo, pero eso no significa que la
              fuerza se oponga en todo momento: en unos tramos aporta y en
              otros resta, y el balance sale negativo. Un total no dice nada
              sobre cada punto.
        veredicto: |
          Es un problema de optimización disfrazado de integral de línea: se
          calcula el trabajo dejando el parámetro suelto, y después se deriva.
          Reconocer que el resultado va a ser una función de $b$ —y no un
          número— es lo primero.
    resolucion: |
      **Datos.** $F=(3y^{2},16x)$, de $(-1,0)$ a $(1,0)$ por la semielipse
      superior $x^{2}+\tfrac{y^{2}}{b^{2}}=1$.

      ### 1 · Por qué depende del camino

      $$
      M_y = 6y, \qquad N_x = 16
      $$

      No coinciden: el campo no es conservativo. Si lo fuera, $W$ sería el
      mismo para todo $b$ y el enunciado no tendría sentido.

      ### 2 · El trabajo en función de b

      Con $x=\cos t$, $y=b\operatorname{sen}t$ y $t$ de $\pi$ a $0$:

      $$
      W = \int_{\pi}^{0}\left[3b^{2}\operatorname{sen}^{2}t
      \left(-\operatorname{sen}t\right) + 16\cos t\cdot b\cos t\right]dt
      $$

      $$
      = \int_0^{\pi}\left[3b^{2}\operatorname{sen}^{3}t
      - 16b\cos^{2}t\right]dt
      = 3b^{2}\cdot\frac43 - 16b\cdot\frac{\pi}{2}
      $$

      $$
      W(b) = 4b^{2}-8\pi b
      $$

      ### 3 · El mínimo

      $$
      W'(b) = 8b-8\pi = 0 \;\Longrightarrow\; b = \pi
      $$

      $$
      \boxed{\ b = \pi, \qquad W_{\min} = -4\pi^{2}\approx-39{,}48\ }
      $$

      ### 4 · La forma de la respuesta

      | $b$ | $W(b)$ |
      |---|---|
      | $0$ | $0$ |
      | $\pi\approx3{,}14$ | $-4\pi^{2}\approx-39{,}5$ |
      | $2\pi\approx6{,}28$ | $0$ |
      | $\to\infty$ | $\to+\infty$ |

      Con $b$ pequeño la elipse es casi el segmento y el trabajo es casi cero;
      al crecer $b$ el término $-8\pi b$ manda y el trabajo baja; a partir de
      $b=\pi$ gana el $4b^{2}$ y vuelve a subir.

      **Lo que hay que llevarse.** Un ejercicio de integral de línea puede
      acabar siendo uno de optimización de una variable: se deja el parámetro
      dentro de la integral, se calcula, y se deriva al final. Y la
      comprobación de que la pregunta tiene sentido es que el campo **no** sea
      conservativo.

  - id: entre-dos-circunferencias-que-pasan-por-el-origen
    titulo: Entre dos circunferencias que pasan por el origen
    fuente: Ejercicio 8.14 · Problemas complementarios, tema 8 · Cálculo, UPV/EHU (2019/2020 7E)
    nivel: practica
    enunciado: |
      Calcular la integral de línea
      $I=\displaystyle\oint_L \sqrt{x^{2}+y^{2}}\,dx + \sqrt{x^{2}+y^{2}}\,dy$
      donde $L$ es la frontera del dominio limitado por las condiciones
      siguientes: $x^{2}+y^{2}\ge2x$, $x^{2}+y^{2}\le4x$, $y\le x$, $y\ge0$.
    pide: El valor de la circulación.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué recinto describen las cuatro condiciones, en polares?
        opciones:
          - texto: >-
              $2\cos\theta \le \rho \le 4\cos\theta$ con
              $0\le\theta\le\tfrac{\pi}{4}$
            correcta: true
            mensaje: |
              Eso es. $x^{2}+y^{2}=2x$ es $\rho=2\cos\theta$ y
              $x^{2}+y^{2}=4x$ es $\rho=4\cos\theta$: dos circunferencias que
              pasan por el origen, de radios $1$ y $2$. Y $0\le y\le x$
              recorta el sector de $45°$.
          - texto: >-
              $2\le\rho\le4$ con $0\le\theta\le\tfrac{\pi}{4}$
            mensaje: |
              Esas serían circunferencias **centradas en el origen**. Las del
              enunciado llevan un término lineal en $x$, así que están
              desplazadas y pasan por el origen.
          - texto: >-
              Un cuadrado
            mensaje: |
              Dos de las cuatro condiciones son circunferencias, así que dos de
              los bordes son arcos.

      - tipo: calcular
        titulo: La circulación
        pregunta: |
          Aplicando Green, $N_x-M_y = \dfrac{x-y}{\rho}$. ¿Cuánto vale $I$?
        respuesta:
          tipo: numero
          valor: '2.2426'
          tolerancia: 0.004
          formato: en forma exacta (3sqrt(2)-2) o con cuatro decimales
        distractores:
          - valor: '4.2426'
            mensaje: |
              $3\sqrt2$ solo: falta el $-2$, que sale de evaluar
              $\left[-2\cos^{3}\theta\right]$ en $\theta=0$.
          - valor: '-2.2426'
            mensaje: |
              El signo. Sobre el recinto $x\ge y$, así que $x-y\ge0$ y la
              integral es positiva.
        pista: |
          En polares el integrando de la doble es
          $\rho\left(\cos\theta-\operatorname{sen}\theta\right)$, porque el
          $\rho$ del denominador se cancela con el del jacobiano.
        desarrollo: |
          $$
          N_x-M_y = \frac{x}{\rho}-\frac{y}{\rho} = \frac{x-y}{\rho}
          $$

          En polares, con el jacobiano $\rho$, queda
          $\rho\left(\cos\theta-\operatorname{sen}\theta\right)$:

          $$
          I = \int_0^{\pi/4}\left(\cos\theta-\operatorname{sen}\theta\right)
          \left[\frac{\rho^{2}}{2}\right]_{2\cos\theta}^{4\cos\theta}d\theta
          = 6\int_0^{\pi/4}\left(\cos^{3}\theta
          - \operatorname{sen}\theta\cos^{2}\theta\right)d\theta
          $$

          $$
          = 6\left[\left(\operatorname{sen}\theta
          - \frac{\operatorname{sen}^{3}\theta}{3}\right)
          + \frac{\cos^{3}\theta}{3}\right]_0^{\pi/4}
          = 3\sqrt2-2 \approx 2{,}2426
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $x^{2}+y^{2}=2ax$ es, en polares, $\rho=2a\cos\theta$: una
              circunferencia de radio $a$ centrada en $(a,0)$ y que pasa por
              el origen.
          - texto: >-
              El recinto es el trozo entre las dos, con $\theta$ entre $0$ y
              $\tfrac{\pi}{4}$ por las condiciones $0\le y\le x$.
          - texto: >-
              Al aplicar Green, el $\rho$ del denominador se cancela con el
              del jacobiano y queda una integral trigonométrica ordinaria.
          - texto: >-
              Y como la frontera tiene cuatro tramos, parametrizar sería
              exactamente cuatro veces más trabajo que aplicar Green.
            trampa: true
            mensaje: |
              Sería **más** de cuatro veces: los dos arcos llevan
              $\sqrt{x^{2}+y^{2}}$ dentro y sus parametrizaciones son
              $\rho=2\cos\theta$ y $\rho=4\cos\theta$, con lo que $dx$ y $dy$
              salen expresiones largas. El ahorro de Green no es
              proporcional al número de tramos: es mayor cuanto peores son los
              tramos.
        veredicto: |
          Dos cosas que hay que reconocer al vuelo: que $x^{2}+y^{2}=2ax$ es
          una circunferencia que pasa por el origen, y que un integrando con
          $\sqrt{x^{2}+y^{2}}$ está pidiendo polares. Con eso, el ejercicio es
          una integral trigonométrica.
    resolucion: |
      **Datos.** $L$: frontera de
      $\{2x\le x^{2}+y^{2}\le 4x,\; 0\le y\le x\}$, con
      $M=N=\sqrt{x^{2}+y^{2}}$.

      ### 1 · El recinto

      | condición | en polares |
      |---|---|
      | $x^{2}+y^{2}\ge2x$ | $\rho\ge2\cos\theta$ |
      | $x^{2}+y^{2}\le4x$ | $\rho\le4\cos\theta$ |
      | $y\ge0$ | $\theta\ge0$ |
      | $y\le x$ | $\theta\le\tfrac{\pi}{4}$ |

      Las dos circunferencias tienen radios $1$ y $2$ y centros $(1,0)$ y
      $(2,0)$: las dos pasan por el origen.

      ### 2 · Green

      $$
      N_x - M_y = \frac{x}{\sqrt{x^{2}+y^{2}}}
      - \frac{y}{\sqrt{x^{2}+y^{2}}}
      = \frac{x-y}{\rho}
      $$

      Con $dA=\rho\,d\rho\,d\theta$, el $\rho$ se cancela:

      $$
      I = \int_0^{\pi/4}\!\!\int_{2\cos\theta}^{4\cos\theta}
      \rho\left(\cos\theta-\operatorname{sen}\theta\right)d\rho\,d\theta
      $$

      $$
      = 6\int_0^{\pi/4}\left(\cos^{3}\theta
      -\operatorname{sen}\theta\cos^{2}\theta\right)d\theta
      $$

      ### 3 · Las dos integrales

      $$
      \int_0^{\pi/4}\cos^{3}\theta\,d\theta
      = \left[\operatorname{sen}\theta
      -\frac{\operatorname{sen}^{3}\theta}{3}\right]_0^{\pi/4}
      = \frac{\sqrt2}{2}-\frac{\sqrt2}{12} = \frac{5\sqrt2}{12}
      $$

      $$
      \int_0^{\pi/4}\operatorname{sen}\theta\cos^{2}\theta\,d\theta
      = \left[-\frac{\cos^{3}\theta}{3}\right]_0^{\pi/4}
      = \frac13-\frac{\sqrt2}{12}
      $$

      $$
      I = 6\left(\frac{5\sqrt2}{12}-\frac13+\frac{\sqrt2}{12}\right)
      = 3\sqrt2 - 2 \approx 2{,}2426
      $$

      ### 4 · La comprobación de signo

      Sobre todo el recinto $x\ge y$, así que $N_x-M_y\ge0$ y la integral
      tiene que salir positiva. Sale.

      **Lo que hay que llevarse.** $x^{2}+y^{2}=2ax$ es la circunferencia de
      radio $a$ que pasa por el origen, y en polares es $\rho=2a\cos\theta$.
      Reconocerla es lo que convierte cuatro condiciones incómodas en un
      rectángulo curvo en $(\rho,\theta)$.

  - id: la-espiral-y-el-area-que-barre
    titulo: La espiral, el trabajo y el área que barre
    fuente: Ejercicio 8.15 · Problemas complementarios, tema 8 · Cálculo, UPV/EHU (2017/2018 6E)
    nivel: practica
    enunciado: |
      Sean el campo vectorial
      $V = \left(-\tfrac{y}{2},\;\tfrac{x}{2}\right)$ y la espiral definida
      por las ecuaciones paramétricas $x=t\cos t$, $y=t\operatorname{sen}t$.

      (a) Calcular el trabajo efectuado por $V$ al trasladar una partícula
      desde el punto $A=(0,0)$ hasta el punto $B=(2\pi,0)$ siguiendo la
      espiral.

      (b) Calcular el área de la figura sombreada, la encerrada entre la
      espiral y el segmento $BA$ del eje $x$.
    pide: El trabajo y el área.
    pasos:
      - tipo: reconocer
        pregunta: |
          El campo $\left(-\tfrac{y}{2},\tfrac{x}{2}\right)$ tiene un nombre en
          este tema. ¿Cuál?
        opciones:
          - texto: >-
              Es el campo del **área**: $\tfrac12\oint(x\,dy-y\,dx)$ da el área
              encerrada por una curva cerrada
            correcta: true
            mensaje: |
              Eso es, y por eso el enunciado tiene dos apartados: el trabajo y
              el área son casi la misma cuenta. Es la fórmula que también usa
              el ejercicio 8.16 para la astroide.
          - texto: >-
              Es un campo conservativo
            mensaje: |
              No lo es: $N_x-M_y = \tfrac12+\tfrac12 = 1 \ne 0$. Justamente ese
              $1$ es lo que hace que Green devuelva el área.
          - texto: >-
              Es el gradiente de $\tfrac{xy}{2}$
            mensaje: |
              El gradiente de $\tfrac{xy}{2}$ es
              $\left(\tfrac{y}{2},\tfrac{x}{2}\right)$, con el primer signo al
              revés. Ese sí sería conservativo, y este no.

      - tipo: calcular
        titulo: El trabajo
        pregunta: |
          Sobre la espiral, $x\,dy - y\,dx = t^{2}dt$. ¿Cuánto vale el
          trabajo de $A$ a $B$?
        respuesta:
          tipo: numero
          valor: '41.3417'
          tolerancia: 0.05
          formato: en forma exacta (4pi³/3) o con cuatro decimales
        distractores:
          - valor: '82.6834'
            mensaje: |
              El doble: te has dejado el $\tfrac12$ del campo. Las dos
              componentes llevan un $\tfrac12$ delante.
          - valor: '124.025'
            mensaje: |
              $4\pi^{3}$ olvida el $\tfrac13$ de
              $\int_0^{2\pi}t^{2}dt = \tfrac{8\pi^{3}}{3}$.
        pista: |
          $W=\tfrac12\displaystyle\int_0^{2\pi}t^{2}\,dt$.
        desarrollo: |
          Con $x=t\cos t$, $y=t\operatorname{sen}t$:

          $$
          x\,dy - y\,dx
          = t\cos t\left(\operatorname{sen}t+t\cos t\right)dt
          - t\operatorname{sen}t\left(\cos t - t\operatorname{sen}t\right)dt
          = t^{2}dt
          $$

          Los términos con $\operatorname{sen}t\cos t$ se cancelan y queda la
          identidad fundamental.

          $$
          W = \frac12\int_0^{2\pi}t^{2}\,dt
          = \frac12\cdot\frac{8\pi^{3}}{3} = \frac{4\pi^{3}}{3}
          \approx 41{,}3417
          $$

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área de la figura encerrada entre la espiral y el
          segmento del eje $x$?
        respuesta:
          tipo: numero
          valor: '41.3417'
          tolerancia: 0.05
          formato: en forma exacta (4pi³/3) o con cuatro decimales
        distractores:
          - valor: '20.6708'
            mensaje: |
              La mitad. El $\tfrac12$ de la fórmula del área ya está aplicado
              en el trabajo del apartado anterior: el campo lo lleva dentro.
          - valor: '39.4784'
            mensaje: |
              $4\pi^{2}$ es otra cosa. El área es $\tfrac{4\pi^{3}}{3}$, con
              $\pi$ al cubo.
        pista: |
          Sobre el segmento del eje $x$, $y=0$ y $dy=0$: ese tramo aporta
          cero al $\tfrac12\oint(x\,dy-y\,dx)$.
        desarrollo: |
          El área encerrada es

          $$
          A = \frac12\oint_{\text{espiral} + \text{segmento}}
          \left(x\,dy-y\,dx\right)
          $$

          El tramo de vuelta va por el eje $x$, donde $y=0$ y $dy=0$, así que
          **no aporta nada**. Queda solo la espiral:

          $$
          A = W = \frac{4\pi^{3}}{3} \approx 41{,}34
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $\tfrac12\oint\left(x\,dy-y\,dx\right)$ es el área encerrada,
              porque por Green $N_x-M_y=1$.
          - texto: >-
              Sobre la espiral $x=t\cos t$, $y=t\operatorname{sen}t$, la
              combinación $x\,dy-y\,dx$ se simplifica a $t^{2}dt$.
          - texto: >-
              El tramo de vuelta por el eje $x$ no aporta nada, porque allí
              $y=0$ y $dy=0$.
          - texto: >-
              Y por eso el trabajo y el área coinciden, lo cual pasa siempre
              que la curva empieza y acaba sobre el eje $x$.
            trampa: true
            mensaje: |
              Coinciden porque **este campo concreto** es el del área. Con otro
              campo, el trabajo por la espiral no tendría nada que ver con el
              área encerrada aunque los extremos estuvieran sobre el eje.
        veredicto: |
          La fórmula $A=\tfrac12\oint(x\,dy-y\,dx)$ es la aplicación más
          bonita de Green: convierte un área en un recorrido por su borde. Y
          este ejercicio la usa dos veces disfrazada de trabajo.
    resolucion: |
      **Datos.** $V=\left(-\tfrac{y}{2},\tfrac{x}{2}\right)$ y la espiral
      $x=t\cos t$, $y=t\operatorname{sen}t$, de $t=0$ a $t=2\pi$.

      ### 1 · La simplificación clave

      $$
      x\,dy - y\,dx
      = t\cos t\left(\operatorname{sen}t+t\cos t\right)
      - t\operatorname{sen}t\left(\cos t-t\operatorname{sen}t\right)
      $$

      $$
      = t^{2}\left(\cos^{2}t+\operatorname{sen}^{2}t\right) = t^{2}
      $$

      En polares eso es evidente: la espiral es $\rho=\theta$, y
      $x\,dy-y\,dx = \rho^{2}d\theta$.

      ### 2 · El trabajo

      $$
      W = \frac12\int_0^{2\pi}t^{2}\,dt = \frac{4\pi^{3}}{3}
      \approx 41{,}34
      $$

      ### 3 · El área

      La figura la cierran la espiral y el segmento de $B(2\pi,0)$ a
      $A(0,0)$. En ese segmento $y=0$ y $dy=0$, así que su aportación es
      nula:

      $$
      A = \frac12\oint\left(x\,dy-y\,dx\right) = W = \frac{4\pi^{3}}{3}
      $$

      $$
      \boxed{\ W = A = \frac{4\pi^{3}}{3} \approx 41{,}34\ }
      $$

      ### 4 · La comprobación en polares

      El área barrida por un radio vector en polares es
      $\tfrac12\int\rho^{2}d\theta$, y con $\rho=\theta$ de $0$ a $2\pi$:

      $$
      A = \frac12\int_0^{2\pi}\theta^{2}d\theta = \frac{4\pi^{3}}{3}
      $$

      La misma fórmula por otro camino.

      **Lo que hay que llevarse.** El campo
      $\left(-\tfrac{y}{2},\tfrac{x}{2}\right)$ no es uno cualquiera: es el
      que mide áreas. Cuando aparezca —y aparece disfrazado de campo de
      fuerzas— el ejercicio es de geometría, no de física.

  - id: el-area-de-la-astroide
    titulo: El área de la astroide, recorriendo su borde
    fuente: Ejercicio 8.16 · Problemas complementarios, tema 8 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Utilizando la integral curvilínea
      $\dfrac12\displaystyle\oint_C x\,dy - y\,dx$, calcular el área de la
      astroide $x=\cos^{3}t$, $y=\operatorname{sen}^{3}t$, $t\in[0,2\pi]$.
    pide: El área encerrada por la astroide.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué esta curva no se puede tratar como $y=f(x)$?
        opciones:
          - texto: >-
              Porque no es la gráfica de una función: para cada $x$ hay dos
              valores de $y$, y además tiene cuatro picos donde no es
              derivable
            correcta: true
            mensaje: |
              Eso es. La astroide solo se maneja bien parametrizada, y por eso
              la fórmula del área por integral de línea es la herramienta
              natural.
          - texto: >-
              Porque es cerrada
            mensaje: |
              Una circunferencia también lo es y se puede partir en dos
              gráficas. El problema de la astroide son además los picos.
          - texto: >-
              Porque no es continua
            mensaje: |
              Es continua: lo que no es en los cuatro picos es **derivable**
              respecto de $x$.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área de la astroide?
        respuesta:
          tipo: numero
          valor: '1.1781'
          tolerancia: 0.002
          formato: en forma exacta (3pi/8) o con cuatro decimales
        distractores:
          - valor: '3.1416'
            mensaje: |
              $\pi$ es el área del **círculo** de radio $1$, en el que la
              astroide está inscrita. La astroide es bastante menor: un
              $37{,}5\%$ de él.
          - valor: '2.3562'
            mensaje: |
              $\tfrac{3\pi}{4}$ es el doble: te has dejado el $\tfrac12$ de la
              fórmula del área.
        pista: |
          $x\,dy-y\,dx = 3\operatorname{sen}^{2}t\cos^{2}t\,dt$, y el valor
          medio de $\operatorname{sen}^{2}t\cos^{2}t$ es $\tfrac18$.
        desarrollo: |
          $$
          x\,dy - y\,dx
          = 3\cos^{4}t\operatorname{sen}^{2}t
          + 3\operatorname{sen}^{4}t\cos^{2}t
          = 3\operatorname{sen}^{2}t\cos^{2}t
          $$

          usando $\cos^{2}t+\operatorname{sen}^{2}t=1$.

          $$
          A = \frac12\int_0^{2\pi}3\operatorname{sen}^{2}t\cos^{2}t\,dt
          = \frac32\int_0^{2\pi}\frac{\operatorname{sen}^{2}2t}{4}\,dt
          = \frac38\cdot\pi = \frac{3\pi}{8}
          $$

          porque $\int_0^{2\pi}\operatorname{sen}^{2}2t\,dt = \pi$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La fórmula $A=\tfrac12\oint(x\,dy-y\,dx)$ sale de Green con
              $N_x-M_y=1$.
          - texto: >-
              Al sustituir la parametrización, los dos sumandos comparten el
              factor $3\operatorname{sen}^{2}t\cos^{2}t$ y la identidad
              fundamental los junta.
          - texto: >-
              $\operatorname{sen}^{2}t\cos^{2}t = \tfrac{\operatorname{sen}^{2}2t}{4}$,
              y su integral sobre una vuelta vale $\tfrac{\pi}{4}$.
          - texto: >-
              Y como la astroide tiene cuatro picos, hay que partir la integral
              en cuatro trozos y sumarlos.
            trampa: true
            mensaje: |
              No hace falta. La parametrización $\left(\cos^{3}t,
              \operatorname{sen}^{3}t\right)$ es derivable en todo $[0,2\pi]$:
              en los picos lo que pasa es que el vector velocidad **se anula**,
              no que la derivada no exista. El integrando es continuo y la
              integral se hace de un tirón. Los picos serían un problema si se
              intentara escribir $y$ en función de $x$.
        veredicto: |
          Una curva con picos, sin ecuación explícita y cerrada: exactamente el
          caso en que la fórmula del área por integral de línea es la única
          herramienta cómoda.
    resolucion: |
      **Datos.** Astroide $x=\cos^{3}t$, $y=\operatorname{sen}^{3}t$,
      $t\in[0,2\pi]$.

      ### 1 · La fórmula

      Por Green con $M=-\tfrac{y}{2}$ y $N=\tfrac{x}{2}$:

      $$
      \frac12\oint_C \left(x\,dy-y\,dx\right)
      = \iint_D 1\,dA = A
      $$

      ### 2 · La sustitución

      $$
      dx = -3\cos^{2}t\operatorname{sen}t\,dt,
      \qquad
      dy = 3\operatorname{sen}^{2}t\cos t\,dt
      $$

      $$
      x\,dy - y\,dx
      = 3\cos^{4}t\operatorname{sen}^{2}t
      + 3\operatorname{sen}^{4}t\cos^{2}t
      = 3\operatorname{sen}^{2}t\cos^{2}t
      $$

      ### 3 · La integral

      $$
      A = \frac32\int_0^{2\pi}\operatorname{sen}^{2}t\cos^{2}t\,dt
      = \frac32\cdot\frac14\int_0^{2\pi}\operatorname{sen}^{2}2t\,dt
      = \frac38\pi
      $$

      $$
      \boxed{\ A = \frac{3\pi}{8} \approx 1{,}1781\ }
      $$

      ### 4 · La comprobación de tamaño

      La astroide toca al círculo unidad en sus cuatro picos y se mete hacia
      dentro entre ellos, así que está contenida **tanto en el círculo** —área
      $\pi\approx3{,}14$— **como en el cuadrado** de vértices $(\pm1,0)$ y
      $(0,\pm1)$ —área $2$—. Y en efecto $1{,}18$ es menor que las dos, y
      bastante: es un $37{,}5\%$ del círculo. Que los cuatro lados sean
      cóncavos hacia dentro explica que quede tan por debajo.

      **Lo que hay que llevarse.** Para una curva cerrada dada en
      paramétricas, la fórmula
      $A=\tfrac12\oint(x\,dy-y\,dx)$ es el camino corto, y a menudo el único.
      Y funciona aunque la curva tenga picos: lo que hace falta es que la
      **parametrización** sea derivable, no la curva.
