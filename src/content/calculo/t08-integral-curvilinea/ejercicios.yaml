  - id: green-en-la-circunferencia-del-boletin
    titulo: Green sobre una circunferencia, y el integrando que se vuelve radial
    fuente: >-
      Ejercicio 6 · Boletín «Integral de línea. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él.
    nivel: practica
    enunciado: |
      Calcular $I=\displaystyle\oint_L -x^{2}y\,dx + xy^{2}dy$ donde $L$ es la
      circunferencia $x^{2}+y^{2}=R^{2}$.
    pide: El valor de la circulación.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al aplicar Green queda $\iint_D\left(N_x-M_y\right)dA$. ¿Qué es
          $N_x-M_y$ aquí?
        opciones:
          - texto: >-
              $y^{2}+x^{2}$, que en polares es $\rho^{2}$
            correcta: true
            mensaje: |
              Exacto, y ahí está todo el ejercicio: la doble se vuelve la
              integral de $\rho^{2}$ sobre un disco, que es de las más
              conocidas del tema anterior.
          - texto: >-
              $y^{2}-x^{2}$
            mensaje: |
              $M = -x^{2}y$, así que $M_y = -x^{2}$, y al restarlo **suma**:
              $y^{2}-(-x^{2}) = y^{2}+x^{2}$. Cuidado con el signo doble.
          - texto: >-
              $2xy$
            mensaje: |
              $2xy$ saldría de derivar $N$ respecto de $y$ o $M$ respecto de
              $x$, que no son las derivadas que pide Green.

      - tipo: calcular
        titulo: La circulación, con R = 2
        pregunta: |
          Con $R=2$, ¿cuánto vale $I$?
        respuesta:
          tipo: numero
          valor: '25.1327'
          tolerancia: 0.02
          formato: en forma exacta (piR⁴/2) o con cuatro decimales
        distractores:
          - valor: '50.2655'
            mensaje: |
              El doble. $\int_0^{R}\rho^{3}d\rho = \tfrac{R^{4}}{4}$, no
              $\tfrac{R^{4}}{2}$; el $\tfrac12$ final sale de multiplicar por
              el $2\pi$ del ángulo.
          - valor: '12.5664'
            mensaje: |
              $4\pi$ es $\pi R^{2}$ con $R=2$, o sea el **área** del disco. El
              integrando no es $1$: es $\rho^{2}$.
        pista: |
          $\displaystyle\iint_{\rho\le R}\rho^{2}\,dA
          = \int_0^{2\pi}\!\!\int_0^{R}\rho^{3}\,d\rho\,d\theta$.
        desarrollo: |
          $$
          I = \iint_{x^{2}+y^{2}\le R^{2}}\left(x^{2}+y^{2}\right)dA
          = \int_0^{2\pi}\!\!\int_0^{R}\rho^{3}\,d\rho\,d\theta
          = 2\pi\cdot\frac{R^{4}}{4}
          = \frac{\pi R^{4}}{2}
          $$

          Con $R=2$: $\tfrac{16\pi}{2} = 8\pi \approx 25{,}1327$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El campo es de clase $C^{1}$ en todo el disco —son polinomios—,
              así que Green se puede aplicar sin reservas.
          - texto: >-
              $N_x-M_y = y^{2}+x^{2}$, y en polares eso es $\rho^{2}$.
          - texto: >-
              Con el jacobiano, dentro queda $\rho^{3}$, y la doble se separa
              en $2\pi$ por $\tfrac{R^{4}}{4}$.
          - texto: >-
              Y como el integrando resultante es positivo, el signo del
              resultado no depende del sentido de recorrido.
            trampa: true
            mensaje: |
              Sí depende: recorrida en sentido horario, la misma circulación
              vale $-\tfrac{\pi R^{4}}{2}$. La fórmula de Green supone el
              sentido **positivo** —antihorario, dejando el recinto a la
              izquierda—, y con el otro cambia el signo. Que el integrando de
              la doble sea positivo solo dice que en sentido positivo el
              resultado es positivo.
        veredicto: |
          Compara este ejercicio con el 2 del mismo boletín: allí Green no se
          podía aplicar porque el campo se iba a infinito en el origen; aquí
          son polinomios y se aplica sin pensar. **La hipótesis que hay que
          mirar es siempre la misma**, y mirarla cuesta un vistazo.
    resolucion: |
      **Datos.** $M=-x^{2}y$, $N=xy^{2}$, sobre $x^{2}+y^{2}=R^{2}$.

      ### 1 · Las hipótesis

      Los dos campos son polinomios: de clase $C^{1}$ en todo el plano, y en
      particular en el disco. Green se aplica sin más.

      ### 2 · La cuenta

      $$
      N_x = y^{2}, \qquad M_y = -x^{2}
      \qquad\Longrightarrow\qquad
      N_x - M_y = x^{2}+y^{2}
      $$

      $$
      I = \iint_{\rho\le R}\left(x^{2}+y^{2}\right)dA
      = \int_0^{2\pi}\!\!\int_0^{R}\rho^{3}d\rho\,d\theta
      $$

      $$
      \boxed{\ I = \frac{\pi R^{4}}{2}\ }
      $$

      ### 3 · La comparación que conviene hacer

      | ejercicio | campo | ¿Green? | resultado |
      |---|---|---|---|
      | 2 del boletín | racional, singular en el origen | **no** | $-2\pi$, parametrizando |
      | este | polinómico | sí | $\tfrac{\pi R^{4}}{2}$ |

      Los dos son circunferencias centradas en el origen y los dos son
      circulaciones cerradas. Lo único que los separa es si el campo está
      definido dentro.

      **Lo que hay que llevarse.** Green convierte una integral de línea en
      una doble, y muchas veces esa doble cae en polares de forma natural —
      aquí, en la integral de $\rho^{2}$ sobre un disco, que es la más repetida
      del tema anterior. Los dos temas se usan juntos, y conviene tenerlos
      juntos en la cabeza.

