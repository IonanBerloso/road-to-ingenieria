        <title id="f-espiral-area-t">La espiral de Arquímedes tras una vuelta completa, y el área que barre</title>
        <desc id="f-espiral-area-d">Una espiral sale del origen y da una vuelta completa en sentido antihorario, alejándose poco a poco del centro, hasta llegar al punto de abscisa dos pi sobre el eje x, algo más de seis. El segmento del eje x que vuelve de ese punto al origen cierra la curva. La región encerrada entre la espiral y ese segmento está sombreada: es una espira completa, más ancha por la derecha que por la izquierda. El punto de partida A está en el origen y el de llegada B en dos pi coma cero.</desc>
