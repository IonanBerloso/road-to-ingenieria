  - id: campo-con-componente-desconocida
    titulo: Un campo conservativo con una componente sin conocer
    fuente: Ejercicio 8.17 · Problemas complementarios, tema 8 · Cálculo, UPV/EHU (2012/2013 5E)
    nivel: practica
    enunciado: |
      Supongamos que $V = \bigl(2xy + y\,e^{xy},\; Y(x,y)\bigr)$ es un campo
      vectorial conservativo, donde $Y(x,y)$ es una función desconocida. Se sabe
      que el trabajo $W$ efectuado por $V$ al trasladar una partícula desde el
      punto $M(0,0)$ hasta el punto $N(1,1)$ es $W = e$. Calcular el trabajo
      efectuado por $V$ al trasladar una partícula desde un punto $P(a,0)$ hasta
      un punto $Q(a,1)$, siendo $a$ un número cualquiera.
    pide: El trabajo entre P(a,0) y Q(a,1), en función de a.
    pasos:
      - tipo: reconocer
        pregunta: |
          No se conoce la segunda componente del campo. ¿Por qué se puede
          resolver igual?
        opciones:
          - texto: Porque al ser conservativo, el potencial se reconstruye desde la primera componente
            correcta: true
            mensaje: |
              Exacto. Integrando $P$ respecto de $x$ sale el potencial salvo una
              función de $y$, y el dato del trabajo entre $M$ y $N$ sirve para
              fijarla.
          - texto: Porque la segunda componente no interviene en el trabajo
            mensaje: |
              Sí interviene: el trabajo entre $P(a,0)$ y $Q(a,1)$ es
              precisamente un desplazamiento **vertical**, donde manda $Q$. Lo
              que pasa es que llega envuelta en el potencial.
          - texto: Porque el trabajo entre dos puntos con la misma x siempre es cero
            mensaje: |
              No: moverse en vertical cambia la $y$, y el potencial depende de
              ella. Sería cero si el desplazamiento fuera a lo largo de una curva
              de nivel del potencial, que no es el caso.
      - tipo: calcular
        titulo: Reconstruir el potencial
        pregunta: |
          Integrando $P = 2xy + y\,e^{xy}$ respecto de $x$ sale
          $F = x^{2}y + e^{xy} + g(y)$. ¿Cuánto vale $F(0,0)$ si tomamos
          $g\equiv 0$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              El primer término sí se anula, pero $e^{xy}$ en el origen vale
              $e^{0}=1$, no 0.
          - valor: '2.718'
            mensaje: |
              $e$ es el valor en $(1,1)$ del término exponencial. En el origen el
              exponente es 0 y la exponencial vale 1.
        pista: |
          $0 + e^{0}$. Y $e^0 = 1$.
        desarrollo: |
          $$
          F(0,0) = 0^{2}\cdot 0 + e^{0} = 1
          $$

          Y $F(1,1) = 1 + e$. La diferencia es
          $F(1,1)-F(0,0) = e$, que **coincide con el dato** del enunciado: eso
          confirma que $g(y)$ es constante y se puede tomar nula.
      - tipo: calcular
        titulo: El trabajo pedido
        pregunta: |
          Con $F(x,y) = x^{2}y + e^{xy}$, ¿cuánto vale $F(a,1)-F(a,0)$ para
          $a=1$?
        respuesta:
          tipo: numero
          valor: '2.7183'
          tolerancia: 0.02
          formato: en forma exacta o con cuatro decimales
        distractores:
          - valor: '1.7183'
            mensaje: |
              Te has dejado el término $a^{2}$, que con $a=1$ aporta 1. La
              fórmula general es $a^{2}+e^{a}-1$.
          - valor: '1'
            mensaje: |
              1 es $F(a,0)$, el valor en el punto de partida. Falta restarlo del
              de llegada, no darlo como respuesta.
        pista: |
          $F(1,1) = 1+e$ y $F(1,0) = 1$. Resta.
        desarrollo: |
          $$
          F(a,1) = a^{2} + e^{a},
          \qquad
          F(a,0) = 0 + e^{0} = 1
          $$

          $$
          W = a^{2} + e^{a} - 1
          $$

          Con $a=1$: $1 + e - 1 = e \approx 2{,}718$.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'Al ser conservativo existe $F$ con $\nabla F = V$, y basta la primera componente para empezar.'
          - texto: 'Integrando $P$ en $x$: $F = x^{2}y + e^{xy} + g(y)$.'
          - texto: 'El dato $W_{MN}=e$ confirma que $g$ es constante, así que se toma nula.'
          - texto: 'El trabajo pedido es $F(a,1)-F(a,0) = a^{2}+e^{a}-1$.'
          - texto: 'Como no se conoce $Y(x,y)$, el resultado depende de qué función sea.'
            trampa: true
            mensaje: |
              No depende. Que el campo sea conservativo obliga a que
              $Y = \partial F/\partial y$, y $F$ ya está determinado por la
              primera componente y el dato. La segunda componente no es libre:
              es una consecuencia.
    resolucion: |
      **La clave está en lo que significa «conservativo».** No es una propiedad
      decorativa: obliga a que las dos componentes sean las parciales de una
      misma función. Y eso permite deducir la segunda a partir de la primera.

      **Reconstruir el potencial** integrando la componente conocida:

      $$
      F(x,y) = \int (2xy + y\,e^{xy})\,dx = x^{2}y + e^{xy} + g(y)
      $$

      **Fijar $g(y)$ con el dato.** El trabajo de $M(0,0)$ a $N(1,1)$ es

      $$
      F(1,1)-F(0,0) = \bigl(1 + e + g(1)\bigr) - \bigl(0 + 1 + g(0)\bigr)
      = e + g(1) - g(0)
      $$

      y el enunciado dice que vale $e$, luego $g(1)=g(0)$. Tomando $g\equiv 0$:

      $$
      F(x,y) = x^{2}y + e^{xy}
      $$

      **El trabajo pedido**, de $P(a,0)$ a $Q(a,1)$:

      $$
      W = F(a,1)-F(a,0) = \bigl(a^{2}+e^{a}\bigr) - \bigl(0+1\bigr)
      $$

      $$
      \boxed{\;W = a^{2}+e^{a}-1\;}
      $$

      **La comprobación:** con $a=0$ el trabajo sale $0+1-1=0$, y tiene sentido
      —el desplazamiento va del origen a $(0,1)$, y sobre el eje $y$ el
      potencial vale $e^{0}=1$ constante—. Y con $a=1$ sale $e$, que es el
      dato del enunciado por otro camino. ✓

