        <title id="f-luna-dos-circunferencias-t">La luna entre las dos circunferencias, cortada por el sector de cuarenta y cinco grados</title>
        <desc id="f-luna-dos-circunferencias-d">Dos circunferencias pasan por el origen y tienen su centro sobre el eje x: la pequeña, de radio uno y centro en el uno, y la grande, de radio dos y centro en el dos. De ellas se dibuja solo la mitad de arriba, con trazo discontinuo. La recta y igual a x sale del origen a cuarenta y cinco grados. La región sombreada es lo que queda fuera de la circunferencia pequeña, dentro de la grande y entre el eje x y esa recta. Su frontera tiene cuatro tramos: el segmento del eje x que va de dos a cuatro, el arco grande hasta el punto dos coma dos, el segmento que baja por la recta hasta el punto uno coma uno, y el arco pequeño que vuelve al punto de partida.</desc>
