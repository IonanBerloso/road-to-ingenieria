  # ═══════════════════════════════════════════════════════════════════
  # Ejemplos introductorios del tema 8. Nuestros, no de examen ni del boletín.
  # ═══════════════════════════════════════════════════════════════════

  - id: ej-parametrizar-un-segmento
    titulo: Parametrizar un segmento, con su sentido
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Parametrizar el segmento que va desde $A(1,2)$ hasta $B(3,6)$, y comprobar
      que el sentido es el correcto.
    pide: La parametrización del segmento de A a B.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la forma estándar de parametrizar el segmento de $A$ a $B$?
        opciones:
          - texto: r(t) = A + t(B − A), con t entre 0 y 1
            correcta: true
            mensaje: |
              Sí. En $t=0$ estás en $A$ y en $t=1$ en $B$, así que el sentido
              queda garantizado por construcción.
          - texto: r(t) = B + t(A − B), con t entre 0 y 1
            mensaje: |
              Eso recorre el segmento **al revés**, de $B$ a $A$, y en una
              integral curvilínea de un campo eso cambia el signo del resultado.
          - texto: r(t) = (t, t), con t entre A y B
            mensaje: |
              Eso solo sirve para la recta $y=x$. Aquí la recta que une $A$ y $B$
              no es esa, y además $A$ y $B$ son puntos, no números.
      - tipo: calcular
        titulo: La primera componente
        pregunta: |
          Con $\vec r(t) = (1,2) + t\,(2,4)$, ¿cuánto vale $x(t)$ en $t = 0{,}5$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              3 es $x$ en $t=1$, o sea en el punto $B$. En la mitad del recorrido
              vale $1 + 0{,}5\cdot 2 = 2$.
          - valor: '1'
            mensaje: |
              1 es $x$ en $t=0$, en el punto $A$. En $t=0{,}5$ ya te has movido
              media unidad de las dos que hay que avanzar en $x$.
        pista: |
          $x(t) = 1 + 2t$. Sustituye t = 0,5.
        desarrollo: |
          $$
          B - A = (3,6)-(1,2) = (2,4)
          \qquad\Longrightarrow\qquad
          \vec r(t) = (1+2t,\; 2+4t)
          $$

          En $t=0{,}5$: $x = 1+1 = 2$, $y = 2+2 = 4$. El punto medio del
          segmento, como tiene que ser.
      - tipo: justificar
        pregunta: |
          Ordena la comprobación. Una pieza es falsa.
        piezas:
          - texto: '$\vec r(t) = (1+2t,\;2+4t)$ con $t\in[0,1]$.'
          - texto: 'En $t=0$ sale $(1,2) = A$, que es el punto de salida. ✓'
          - texto: 'En $t=1$ sale $(3,6) = B$, el de llegada. ✓'
          - texto: 'Las derivadas valen $\frac{dx}{dt}=2$ y $\frac{dy}{dt}=4$, constantes, como corresponde a una recta.'
          - texto: 'Como el parámetro va de 0 a 1, el segmento mide 1 de longitud.'
            trampa: true
            mensaje: |
              El rango del parámetro no es la longitud. El segmento mide
              $\lVert B-A\rVert = \sqrt{4+16} = \sqrt{20}$. El parámetro es solo
              una forma de recorrerlo, y podría ir de 0 a 1 o de 0 a 100.
    resolucion: |
      **La fórmula, y por qué funciona.** Un segmento de $A$ a $B$ se recorre
      partiendo de $A$ y avanzando una fracción $t$ del vector que lleva a $B$:

      $$
      \vec r(t) = A + t\,(B-A),
      \qquad t\in[0,1]
      $$

      Con $A(1,2)$ y $B(3,6)$:

      $$
      \vec r(t) = (1,2) + t\,(2,4) = (1+2t,\; 2+4t)
      $$

      **La comprobación del sentido**, que es lo que hay que hacer siempre:

      | $t$ | punto |
      |---|---|
      | $0$ | $(1,2) = A$ ✓ |
      | $1$ | $(3,6) = B$ ✓ |

      Sale $A$ al principio y $B$ al final, así que el recorrido va en el sentido
      que pide el enunciado. **Si saliera al revés, la integral curvilínea de un
      campo tendría el signo cambiado** — y eso convierte un trabajo de $+12$ en
      un $-12$, que no es un error pequeño.

      > Las derivadas, que hacen falta enseguida: $x'(t)=2$ e $y'(t)=4$. Al ser
      > una recta son constantes, y eso hace que el módulo
      > $\lVert\vec r\,'\rVert = \sqrt{20}$ salga de la integral.

      <figure class="figura-examen">
      <svg viewBox="0 0 300 265" role="img" width="300" height="265"
           aria-labelledby="f-ej-parametrizar-segmento-t f-ej-parametrizar-segmento-d">
