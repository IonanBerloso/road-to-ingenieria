  - id: ej-conservativo-o-no
    titulo: Comprobar si un campo es conservativo
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Determinar cuál de estos dos campos es conservativo:

      $$
      \vec V = (2xy,\; x^{2})
      \qquad\text{y}\qquad
      \vec W = (y,\; 2x)
      $$
    pide: Cuál de los dos campos es conservativo, y por qué.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué igualdad hay que comprobar para saber si $(P,Q)$ es conservativo
          en el plano?
        opciones:
          - texto: Que la derivada de P respecto de y coincida con la de Q respecto de x
            correcta: true
            mensaje: |
              Eso es. Sale de que, si hubiera potencial, esas dos serían las
              derivadas cruzadas del mismo $F$ — y Schwarz obliga a que
              coincidan.
          - texto: Que P y Q sean iguales
            mensaje: |
              Eso no tiene nada que ver. $(2xy, x^{2})$ tiene componentes
              distintas y sí es conservativo.
          - texto: Que las dos parciales respecto de x coincidan
            mensaje: |
              La comprobación es **cruzada**: $P$ se deriva respecto de $y$ y $Q$
              respecto de $x$. Comparar dos derivadas respecto de la misma
              variable no dice nada.
      - tipo: calcular
        titulo: La derivada cruzada del primero
        pregunta: |
          Para $\vec V = (2xy,\,x^{2})$, ¿cuánto vale $\partial P/\partial y$?
          Evalúalo en $x = 3$.
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              Parece que has derivado como si el coeficiente fuera 1. $P = 2xy$,
              y su derivada respecto de $y$ es $2x$, que en $x=3$ vale 6.
          - valor: '9'
            mensaje: |
              9 es $x^{2}$ evaluado en 3, o sea $Q$ mismo. Lo que se pide es la
              derivada de $P$ respecto de $y$.
        pista: |
          Deriva $2xy$ respecto de y tratando x como constante. Y sustituye x=3.
        desarrollo: |
          $$
          \frac{\partial P}{\partial y} = \frac{\partial}{\partial y}(2xy) = 2x
          \qquad\Longrightarrow\qquad
          \text{en } x=3: \; 6
          $$

          Y $\partial Q/\partial x = \partial(x^{2})/\partial x = 2x$, que también
          vale 6. **Coinciden**, así que $\vec V$ es conservativo.
      - tipo: justificar
        pregunta: |
          Ordena la conclusión. Una pieza es falsa.
        piezas:
          - texto: 'Para $\vec V$: $P_y = 2x$ y $Q_x = 2x$, coinciden, luego es conservativo.'
          - texto: 'Su potencial es $F = x^{2}y$, y en efecto $\nabla F = (2xy,\,x^{2})$.'
          - texto: 'Para $\vec W$: $P_y = 1$ y $Q_x = 2$, no coinciden.'
          - texto: 'Luego $\vec W$ no es conservativo, y su integral sí depende del camino.'

          - texto: 'Como $\vec W$ no es conservativo, su integral sobre una curva cerrada no puede calcularse.'
            trampa: true
            mensaje: |
              Sí puede: se calcula parametrizando, o con Green si la curva es
              cerrada. Lo que pierdes al no ser conservativo es el **atajo** de
              $F(B)-F(A)$, no la posibilidad de calcularla.
    resolucion: |
      **La comprobación es una sola igualdad**, y hay que hacerla antes de
      decidir cómo se ataca cualquier ejercicio del tema.

      $$
      \vec V = (P,Q) \text{ es conservativo}
      \iff
      \frac{\partial P}{\partial y} = \frac{\partial Q}{\partial x}
      $$

      **El primero, $\vec V = (2xy,\;x^{2})$:**

      $$
      P_y = 2x,
      \qquad
      Q_x = 2x
      \qquad\Longrightarrow\qquad
      \text{coinciden: es conservativo}
      $$

      Y se puede exhibir el potencial, que es la prueba definitiva:
      $F(x,y) = x^{2}y$, porque $\nabla F = (2xy,\,x^{2})$. ✓

      **El segundo, $\vec W = (y,\;2x)$:**

      $$
      P_y = 1,
      \qquad
      Q_x = 2
      \qquad\Longrightarrow\qquad
      1 \neq 2: \text{ no es conservativo}
      $$

      **Qué significa la diferencia.** Con $\vec V$, la integral entre dos puntos
      solo depende de los extremos y sobre cualquier curva cerrada vale cero. Con
      $\vec W$ hay que parametrizar el camino concreto, y dos caminos distintos
      entre los mismos puntos pueden dar números distintos.

      > Fíjate en lo poco que se parecen los dos campos y lo mucho que cambia la
      > estrategia. **Por eso la comprobación va primero y cuesta diez segundos.**

      <figure class="figura-examen">
      <svg viewBox="0 0 406 186" role="img" width="406" height="186"
           aria-labelledby="f-ej-conservativo-o-no-t f-ej-conservativo-o-no-d">
        <title id="f-ej-conservativo-o-no-t">Los dos campos con el mismo cuadrado recorrido en sentido positivo</title>
        <desc id="f-ej-conservativo-o-no-d">Dos recuadros, cada uno con una malla de flechas finas que representa un campo vectorial, y encima el mismo cuadrado de lado uno coma cuatro recorrido en sentido antihorario. En el primero, el campo V, la circulación a lo largo del cuadrado vale cero. En el segundo, el campo W, vale uno. Las flechas del primer campo apuntan hacia fuera abriéndose desde el origen; las del segundo giran, y ese giro es lo que hace que la circulación no se anule.</desc>
