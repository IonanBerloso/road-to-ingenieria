  - id: ej-trabajo-parametrizando
    titulo: Un trabajo calculado a pelo, sin ningún atajo
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Calcular el trabajo del campo $\vec F = (y,\;x^{2})$ a lo largo del
      segmento que va de $(0,0)$ a $(1,1)$.
    pide: El valor del trabajo sobre ese segmento.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué aquí hay que parametrizar, y no vale ningún atajo?
        opciones:
          - texto: >-
              Porque el campo **no** es conservativo —$P_y = 1$ y $Q_x = 2x$ no
              coinciden— y la curva no es cerrada
            correcta: true
            mensaje: |
              Eso es. Los dos atajos del tema piden una cosa cada uno: el
              potencial pide campo conservativo y Green pide curva cerrada.
              Fallan los dos, así que toca la definición.
          - texto: Porque el campo tiene un cuadrado
            mensaje: |
              Que haya un cuadrado no impide nada. Lo que decide es si las dos
              derivadas cruzadas coinciden, y aquí no lo hacen.
          - texto: Porque la curva es un segmento
            mensaje: |
              Sobre un segmento se puede usar el potencial perfectamente, si el
              campo es conservativo. Lo que obliga a parametrizar aquí es que
              no lo sea.
      - tipo: calcular
        titulo: El trabajo
        pregunta: |
          Con $\vec r(t) = (t,t)$ para $t\in[0,1]$, ¿cuánto vale el trabajo?
          En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.8333333'
          tolerancia: 0.0005
          formato: en forma exacta (5/6), o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $1$ sale de integrar solo la primera componente, $\int_0^1 t\,dt$
              dos veces, o de olvidar que $Q = x^{2}$ y no $x$. Los dos sumandos
              son $\frac12$ y $\frac13$.
          - valor: '0.6666667'
            mensaje: |
              $\frac23$ sale de integrar $\int_0^1 (t + t^{2})\,dt$ sin
              multiplicar por los $dx$ e $dy$… que aquí valen $dt$ los dos, así
              que el error está en otro sitio: revisa que la suma es
              $\frac12 + \frac13$, no $\frac13 + \frac13$.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es solo el primer sumando, $\int_0^1 t\,dt$. Falta el
              segundo, $\int_0^1 t^{2}\,dt = \frac13$.
        pista: |
          Con $x=y=t$: $P\,dx = t\,dt$ y $Q\,dy = t^{2}\,dt$. Suma las dos
          integrales de 0 a 1.
        desarrollo: |
          $$
          \vec r(t) = (t,\,t),
          \qquad dx = dt,\quad dy = dt,
          \qquad t \in [0,1]
          $$

          $$
          \int_C P\,dx + Q\,dy
          = \int_0^{1} \underbrace{t}_{y}\,dt + \int_0^{1}\underbrace{t^{2}}_{x^{2}}\,dt
          = \frac12 + \frac13 = \frac56 \approx 0{,}8333
          $$
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: '$P_y = 1$ y $Q_x = 2x$ no coinciden, así que el campo no es conservativo.'
          - texto: 'La curva no es cerrada, así que Green tampoco vale: hay que parametrizar.'
          - texto: 'Con $\vec r(t)=(t,t)$ y $t\in[0,1]$ se recorre de $(0,0)$ a $(1,1)$.'
          - texto: 'Sustituyendo, la integral queda $\int_0^1 (t+t^{2})\,dt = \frac56$.'
          - texto: 'Como el resultado sale positivo, el campo era conservativo después de todo.'
            trampa: true
            mensaje: |
              El signo del resultado no dice nada sobre si el campo tiene
              potencial. Un campo no conservativo puede dar trabajos positivos,
              negativos o cero según el camino — y eso es justamente lo que
              significa que **dependa del camino**.
    resolucion: |
      **Primero las dos comprobaciones**, que son gratis y a veces ahorran el
      ejercicio entero:

      | pregunta | aquí |
      |---|---|
      | ¿es conservativo? | $P_y = 1$, $Q_x = 2x$ → **no** |
      | ¿es cerrada la curva? | va de $(0,0)$ a $(1,1)$ → **no** |

      Fallan las dos, así que toca la definición: parametrizar y sustituir.

      **La parametrización.** El segmento de $(0,0)$ a $(1,1)$ es
      $\vec r(t) = (t,t)$ con $t\in[0,1]$ — y conviene comprobar el sentido:
      en $t=0$ sale el origen y en $t=1$ el punto de llegada ✓

      $$
      dx = dt,
      \qquad
      dy = dt
      $$

      **Sustituyendo**, con $y = t$ y $x^{2} = t^{2}$:

      $$
      W = \int_0^{1} t\,dt + \int_0^{1} t^{2}\,dt
      = \left[\frac{t^{2}}{2}\right]_0^1 + \left[\frac{t^{3}}{3}\right]_0^1
      = \frac12 + \frac13
      $$

      $$
      \boxed{\;W = \frac56 \approx 0{,}8333\;}
      $$

      > **Para qué sirve haber hecho este.** Es el caso sin atajo, y por eso es
      > la referencia: cuando en un ejercicio de examen el campo **sí** sea
      > conservativo, lo que te ahorras es exactamente este trabajo — dos
      > integrales y una parametrización — y se sustituye por restar el
      > potencial en dos puntos. Verlo una vez a pelo es lo que hace que el
      > atajo signifique algo.

      <figure class="figura-examen">
      <svg viewBox="0 0 300 265" role="img" width="300" height="265"
