  - id: la-espiral-y-el-area-que-barre
    titulo: La espiral, el trabajo y el área que barre
    fuente: Ejercicio 8.15 · Problemas complementarios, tema 8 · Cálculo, UPV/EHU (2017/2018 6E)
    nivel: practica
    enunciado: |
      Sean el campo vectorial
      $V = \left(-\tfrac{y}{2},\;\tfrac{x}{2}\right)$ y la espiral definida
      por las ecuaciones paramétricas $x=t\cos t$, $y=t\operatorname{sen}t$.

      (a) Calcular el trabajo efectuado por $V$ al trasladar una partícula
      desde el punto $A=(0,0)$ hasta el punto $B=(2\pi,0)$ siguiendo la
      espiral.

      (b) Calcular el área de la figura sombreada, la encerrada entre la
      espiral y el segmento $BA$ del eje $x$.
    pide: El trabajo y el área.
    pasos:
      - tipo: reconocer
        pregunta: |
          El campo $\left(-\tfrac{y}{2},\tfrac{x}{2}\right)$ tiene un nombre en
          este tema. ¿Cuál?
        opciones:
          - texto: >-
              Es el campo del **área**: $\tfrac12\oint(x\,dy-y\,dx)$ da el área
              encerrada por una curva cerrada
            correcta: true
            mensaje: |
              Eso es, y por eso el enunciado tiene dos apartados: el trabajo y
              el área son casi la misma cuenta. Es la fórmula que también usa
              el ejercicio 8.16 para la astroide.
          - texto: >-
              Es un campo conservativo
            mensaje: |
              No lo es: $N_x-M_y = \tfrac12+\tfrac12 = 1 \ne 0$. Justamente ese
              $1$ es lo que hace que Green devuelva el área.
          - texto: >-
              Es el gradiente de $\tfrac{xy}{2}$
            mensaje: |
              El gradiente de $\tfrac{xy}{2}$ es
              $\left(\tfrac{y}{2},\tfrac{x}{2}\right)$, con el primer signo al
              revés. Ese sí sería conservativo, y este no.

      - tipo: calcular
        titulo: El trabajo
        pregunta: |
          Sobre la espiral, $x\,dy - y\,dx = t^{2}dt$. ¿Cuánto vale el
          trabajo de $A$ a $B$?
        respuesta:
          tipo: numero
          valor: '41.3417'
          tolerancia: 0.05
          formato: en forma exacta (4pi³/3) o con cuatro decimales
        distractores:
          - valor: '82.6834'
            mensaje: |
              El doble: te has dejado el $\tfrac12$ del campo. Las dos
              componentes llevan un $\tfrac12$ delante.
          - valor: '124.025'
            mensaje: |
              $4\pi^{3}$ olvida el $\tfrac13$ de
              $\int_0^{2\pi}t^{2}dt = \tfrac{8\pi^{3}}{3}$.
        pista: |
          $W=\tfrac12\displaystyle\int_0^{2\pi}t^{2}\,dt$.
        desarrollo: |
          Con $x=t\cos t$, $y=t\operatorname{sen}t$:

          $$
          x\,dy - y\,dx
          = t\cos t\left(\operatorname{sen}t+t\cos t\right)dt
          - t\operatorname{sen}t\left(\cos t - t\operatorname{sen}t\right)dt
          = t^{2}dt
          $$

          Los términos con $\operatorname{sen}t\cos t$ se cancelan y queda la
          identidad fundamental.

          $$
          W = \frac12\int_0^{2\pi}t^{2}\,dt
          = \frac12\cdot\frac{8\pi^{3}}{3} = \frac{4\pi^{3}}{3}
          \approx 41{,}3417
          $$

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área de la figura encerrada entre la espiral y el
          segmento del eje $x$?
        respuesta:
          tipo: numero
          valor: '41.3417'
          tolerancia: 0.05
          formato: en forma exacta (4pi³/3) o con cuatro decimales
        distractores:
          - valor: '20.6708'
            mensaje: |
              La mitad. El $\tfrac12$ de la fórmula del área ya está aplicado
              en el trabajo del apartado anterior: el campo lo lleva dentro.
          - valor: '39.4784'
            mensaje: |
              $4\pi^{2}$ es otra cosa. El área es $\tfrac{4\pi^{3}}{3}$, con
              $\pi$ al cubo.
        pista: |
          Sobre el segmento del eje $x$, $y=0$ y $dy=0$: ese tramo aporta
          cero al $\tfrac12\oint(x\,dy-y\,dx)$.
        desarrollo: |
          El área encerrada es

          $$
          A = \frac12\oint_{\text{espiral} + \text{segmento}}
          \left(x\,dy-y\,dx\right)
          $$

          El tramo de vuelta va por el eje $x$, donde $y=0$ y $dy=0$, así que
          **no aporta nada**. Queda solo la espiral:

          $$
          A = W = \frac{4\pi^{3}}{3} \approx 41{,}34
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $\tfrac12\oint\left(x\,dy-y\,dx\right)$ es el área encerrada,
              porque por Green $N_x-M_y=1$.
          - texto: >-
              Sobre la espiral $x=t\cos t$, $y=t\operatorname{sen}t$, la
              combinación $x\,dy-y\,dx$ se simplifica a $t^{2}dt$.
          - texto: >-
              El tramo de vuelta por el eje $x$ no aporta nada, porque allí
              $y=0$ y $dy=0$.
          - texto: >-
              Y por eso el trabajo y el área coinciden, lo cual pasa siempre
              que la curva empieza y acaba sobre el eje $x$.
            trampa: true
            mensaje: |
              Coinciden porque **este campo concreto** es el del área. Con otro
              campo, el trabajo por la espiral no tendría nada que ver con el
              área encerrada aunque los extremos estuvieran sobre el eje.
        veredicto: |
          La fórmula $A=\tfrac12\oint(x\,dy-y\,dx)$ es la aplicación más
          bonita de Green: convierte un área en un recorrido por su borde. Y
          este ejercicio la usa dos veces disfrazada de trabajo.
    resolucion: |
      **Datos.** $V=\left(-\tfrac{y}{2},\tfrac{x}{2}\right)$ y la espiral
      $x=t\cos t$, $y=t\operatorname{sen}t$, de $t=0$ a $t=2\pi$.

      ### 1 · La simplificación clave

      $$
      x\,dy - y\,dx
      = t\cos t\left(\operatorname{sen}t+t\cos t\right)
      - t\operatorname{sen}t\left(\cos t-t\operatorname{sen}t\right)
      $$

      $$
      = t^{2}\left(\cos^{2}t+\operatorname{sen}^{2}t\right) = t^{2}
      $$

      En polares eso es evidente: la espiral es $\rho=\theta$, y
      $x\,dy-y\,dx = \rho^{2}d\theta$.

      ### 2 · El trabajo

      $$
      W = \frac12\int_0^{2\pi}t^{2}\,dt = \frac{4\pi^{3}}{3}
      \approx 41{,}34
      $$

      ### 3 · El área

      La figura la cierran la espiral y el segmento de $B(2\pi,0)$ a
      $A(0,0)$. En ese segmento $y=0$ y $dy=0$, así que su aportación es
      nula:

      $$
      A = \frac12\oint\left(x\,dy-y\,dx\right) = W = \frac{4\pi^{3}}{3}
      $$

      $$
      \boxed{\ W = A = \frac{4\pi^{3}}{3} \approx 41{,}34\ }
      $$

      ### 4 · La comprobación en polares

      El área barrida por un radio vector en polares es
      $\tfrac12\int\rho^{2}d\theta$, y con $\rho=\theta$ de $0$ a $2\pi$:

      $$
      A = \frac12\int_0^{2\pi}\theta^{2}d\theta = \frac{4\pi^{3}}{3}
      $$

      La misma fórmula por otro camino.

      **Lo que hay que llevarse.** El campo
      $\left(-\tfrac{y}{2},\tfrac{x}{2}\right)$ no es uno cualquiera: es el
      que mide áreas. Cuando aparezca —y aparece disfrazado de campo de
      fuerzas— el ejercicio es de geometría, no de física.

