  - id: la-circulacion-que-no-depende-del-radio
    titulo: Una circulación que sale la misma para cualquier radio
    fuente: >-
      Ejercicio 2 · Boletín «Integral de línea. Problemas» · Cálculo, UPV/EHU
      · Departamento de Matemática Aplicada. El boletín publica el resultado y
      el desarrollo está contrastado contra él.
    nivel: practica
    enunciado: |
      Calcular
      $\displaystyle\oint \frac{(x+y)\,dx-(x-y)\,dy}{x^{2}+y^{2}}$
      a lo largo de la circunferencia $x^{2}+y^{2}=a^{2}$.
    pide: El valor de la circulación.
    pasos:
      - tipo: reconocer
        pregunta: |
          Es una curva cerrada. ¿Se puede aplicar la fórmula de Green?
        opciones:
          - texto: >-
              No: el campo no está definido en el origen, que está **dentro**
              del recinto
            correcta: true
            mensaje: |
              Eso es. Green exige que el campo sea de clase $C^{1}$ en todo el
              recinto encerrado, y aquí el denominador se anula en el centro.
              Hay que parametrizar.
          - texto: >-
              Sí, y el resultado es cero
            mensaje: |
              Si se aplicara sin mirar, saldría cero — y el resultado
              verdadero es $-2\pi$. Es el ejemplo clásico de por qué la
              hipótesis de Green importa.
          - texto: >-
              No, porque la curva no es simple
            mensaje: |
              Una circunferencia es la curva simple y cerrada por excelencia.
              El problema es el punto que falta dentro.

      - tipo: calcular
        titulo: La circulación
        pregunta: |
          Parametrizando $x=a\cos t$, $y=a\operatorname{sen}t$, ¿cuánto vale
          la integral?
        respuesta:
          tipo: numero
          valor: '-6.2832'
          tolerancia: 0.008
          formato: en forma exacta (-2pi) o con cuatro decimales
        distractores:
          - valor: '6.2832'
            mensaje: |
              El signo. El numerador se simplifica a $-a^{2}$, con menos, y
              dividido por $a^{2}$ deja el integrando en $-1$.
          - valor: '0'
            mensaje: |
              $0$ es lo que daría Green si se pudiera aplicar — y no se puede,
              porque el origen está dentro. Ese hueco es exactamente lo que
              vale $-2\pi$.
        pista: |
          Sustituye y simplifica el numerador **antes** de integrar: sale una
          constante.
        desarrollo: |
          Con $x=a\cos t$, $y=a\operatorname{sen}t$:

          $$
          (x+y)dx - (x-y)dy
          = -a^{2}\left(\cos t\operatorname{sen}t+\operatorname{sen}^{2}t\right)
          - a^{2}\left(\cos^{2}t-\operatorname{sen}t\cos t\right)
          $$

          $$
          = -a^{2}\left(\operatorname{sen}^{2}t+\cos^{2}t\right)\,dt
          = -a^{2}\,dt
          $$

          Y el denominador vale $a^{2}$ en toda la curva:

          $$
          I = \int_0^{2\pi} \frac{-a^{2}}{a^{2}}\,dt = -2\pi
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El campo no está definido en el origen, así que Green no se puede
              aplicar sobre el disco: hay que parametrizar la curva.
          - texto: >-
              Sobre la circunferencia el denominador es la constante $a^{2}$,
              lo que simplifica todo el integrando.
          - texto: >-
              El numerador se reduce a $-a^{2}dt$ usando la identidad
              fundamental, así que la integral es $-2\pi$ sea cual sea $a$.
          - texto: >-
              Y como el resultado no depende de $a$, la circulación por
              cualquier curva cerrada del plano vale $-2\pi$.
            trampa: true
            mensaje: |
              Solo por las que **rodean al origen**. Por una curva cerrada que
              no lo encierre, el campo sí cumple las hipótesis de Green en su
              interior y la circulación es $0$. El $-2\pi$ mide el agujero, no
              la curva.
        veredicto: |
          Que el resultado no dependa de $a$ es la pista de que lo que se está
          midiendo no es la circunferencia sino **el agujero que rodea**.
          Encoger o agrandar el camino no cambia nada mientras el origen siga
          dentro.
    resolucion: |
      **Datos.** $\displaystyle\oint\frac{(x+y)dx-(x-y)dy}{x^{2}+y^{2}}$ sobre
      $x^{2}+y^{2}=a^{2}$.

      ### 1 · Por qué no vale Green

      $$
      M = \frac{x+y}{x^{2}+y^{2}}, \qquad N = -\frac{x-y}{x^{2}+y^{2}}
      $$

      Los dos se van a infinito en el origen, que está dentro del disco. La
      fórmula de Green exige $C^{1}$ en **todo** el recinto, y aquí falla en
      un punto. Ese punto es todo el ejercicio.

      ### 2 · La parametrización

      Con $x=a\cos t$, $y=a\operatorname{sen}t$, $t\in[0,2\pi]$:

      - el denominador vale $a^{2}$, constante;
      - el numerador se simplifica a $-a^{2}dt$.

      $$
      \boxed{\ I = -2\pi\ }
      $$

      ### 3 · Lo que mide ese número

      | curva cerrada | ¿rodea al origen? | circulación |
      |---|---|---|
      | $x^{2}+y^{2}=a^{2}$, cualquier $a$ | sí | $-2\pi$ |
      | cualquiera que no lo rodee | no | $0$ |

      Fuera del origen el campo **sí** cumple $M_y=N_x$, así que es localmente
      conservativo; lo que no tiene es un potencial definido en todo el plano
      menos el origen. El $-2\pi$ es la medida de esa imposibilidad.

      **Lo que hay que llevarse.** Antes de aplicar Green, mirar si el campo
      está definido en **todo** el recinto, no solo en la curva. Este ejercicio
      es el contraejemplo de referencia, y el que explica por qué esa hipótesis
      aparece siempre en el enunciado del teorema.

