  - id: la-masa-del-cable-helicoidal
    titulo: La masa de un cable en hélice, con densidad que crece a lo largo
    fuente: Ejercicio 8.7 · Problemas complementarios, tema 8 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      La densidad en el punto $(x,y,z)$ de un cable helicoidal, parametrizado
      por $c(t)=\left(\operatorname{sen}t,\cos t,t\right)$ con $t\in[0,6\pi]$,
      viene dada por la función $f(x,y,z)=x^{2}+y^{2}+z^{2}$ g/cm. Calcular la
      masa del cable.
    pide: La masa del cable.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué vale $x^{2}+y^{2}+z^{2}$ sobre esta hélice?
        opciones:
          - texto: >-
              $1+t^{2}$: la parte horizontal es constante y solo crece la
              altura
            correcta: true
            mensaje: |
              Eso es. La hélice está sobre el cilindro de radio $1$, así que
              $x^{2}+y^{2}=1$ siempre, y $z=t$. La densidad crece
              cuadráticamente con la altura.
          - texto: >-
              $t^{2}$
            mensaje: |
              Falta el $1$ de $\operatorname{sen}^{2}t+\cos^{2}t$. Es pequeño
              comparado con $t^{2}$ al final del cable, pero al principio es
              todo lo que hay.
          - texto: >-
              $3t^{2}$
            mensaje: |
              Solo la tercera coordenada es $t$; las otras dos son seno y
              coseno, y su suma de cuadrados vale $1$.

      - tipo: calcular
        titulo: La rapidez
        pregunta: |
          ¿Cuánto vale $\lVert c'(t)\rVert$?
        respuesta:
          tipo: numero
          valor: '1.4142'
          tolerancia: 0.002
          formato: en forma exacta (sqrt(2)) o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es el módulo de la parte horizontal,
              $\left(\cos t,-\operatorname{sen}t\right)$. Falta la tercera
              componente, que vale $1$ también, y el módulo total es
              $\sqrt{1+1}$.
          - valor: '2'
            mensaje: |
              $2$ es el módulo **al cuadrado**. Falta la raíz.
        pista: |
          $c'(t) = \left(\cos t,-\operatorname{sen}t,1\right)$.
        desarrollo: |
          $$
          \lVert c'(t)\rVert
          = \sqrt{\cos^{2}t+\operatorname{sen}^{2}t+1} = \sqrt2
          $$

          Constante: la hélice se recorre a rapidez uniforme.

      - tipo: calcular
        titulo: La masa
        pregunta: |
          ¿Cuánto vale la masa del cable, en gramos?
        respuesta:
          tipo: numero
          valor: '3183.82'
          tolerancia: 1
          formato: en forma exacta (sqrt(2)(6pi+72pi³)) o con dos decimales
        distractores:
          - valor: '2251.30'
            mensaje: |
              Te has dejado el $\sqrt2$ del $dl$. La hélice es más larga que
              su proyección: por cada vuelta sube $2\pi$, y eso alarga el
              recorrido en un factor $\sqrt2$.
          - valor: '3157.16'
            mensaje: |
              Te has dejado el $1$ de $x^{2}+y^{2}$: eso quita
              $\sqrt2\cdot6\pi\approx26{,}7$ g. Es poco, pero es la parte de
              la masa que aporta el radio del cilindro.
        pista: |
          $m=\displaystyle\int_0^{6\pi}\left(1+t^{2}\right)\sqrt2\,dt$, y
          $\int_0^{6\pi}t^{2}dt = \tfrac{(6\pi)^{3}}{3} = 72\pi^{3}$.
        desarrollo: |
          $$
          m = \sqrt2\int_0^{6\pi}\left(1+t^{2}\right)dt
          = \sqrt2\left[6\pi + \frac{\left(6\pi\right)^{3}}{3}\right]
          = \sqrt2\left(6\pi+72\pi^{3}\right)
          $$

          $$
          m \approx 1{,}414214\cdot 2251{,}3015 \approx 3183{,}82 \text{ g}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La masa de un alambre es $\int_C \delta\,dl$: la densidad
              integrada respecto a la longitud de arco.
          - texto: >-
              Sobre esta hélice, $\delta = 1+t^{2}$ y
              $dl=\sqrt2\,dt$, así que la integral es de un polinomio.
          - texto: >-
              El término $72\pi^{3}$ domina: la densidad crece con el cuadrado
              de la altura, y el cable sube $6\pi$.
          - texto: >-
              Y como la hélice da tres vueltas, la masa es tres veces la de una
              vuelta.
            trampa: true
            mensaje: |
              No, porque la densidad **no es la misma en cada vuelta**: crece
              con $t^{2}$. La tercera vuelta pesa mucho más que la primera. La
              masa sería el triple solo con densidad constante.
        veredicto: |
          Es el mismo esquema de siempre —$\int \delta\,dl$— con una densidad
          que depende de la posición. La única destreza específica es
          reconocer que sobre una hélice $x^{2}+y^{2}$ es constante y la
          rapidez también.
    resolucion: |
      **Datos.** Hélice $c(t)=(\operatorname{sen}t,\cos t,t)$,
      $t\in[0,6\pi]$; densidad $\delta = x^{2}+y^{2}+z^{2}$ g/cm.

      ### 1 · Las dos simplificaciones

      | | valor sobre la curva |
      |---|---|
      | $x^{2}+y^{2}$ | $1$, constante |
      | $z$ | $t$ |
      | $\lVert c'\rVert$ | $\sqrt2$, constante |

      $$
      \delta\,dl = \left(1+t^{2}\right)\sqrt2\,dt
      $$

      ### 2 · La integral

      $$
      m = \sqrt2\int_0^{6\pi}\left(1+t^{2}\right)dt
      = \sqrt2\left(6\pi + 72\pi^{3}\right)
      $$

      $$
      \boxed{\ m = \sqrt2\left(6\pi+72\pi^{3}\right) \approx 3183{,}8 \text{ g}\ }
      $$

      ### 3 · De dónde viene cada trozo

      | término | valor | qué aporta |
      |---|---|---|
      | $\sqrt2\cdot6\pi$ | $\approx26{,}7$ g | el radio del cilindro |
      | $\sqrt2\cdot72\pi^{3}$ | $\approx3157{,}2$ g | la altura |

      El $99{,}2\%$ de la masa viene de la altura, porque la densidad crece
      con $z^{2}$ y el cable sube hasta $6\pi\approx18{,}8$.

      ### 4 · La comprobación de tamaño

      La longitud del cable es $\sqrt2\cdot6\pi\approx26{,}7$ cm, y la
      densidad media es $m/L \approx 119$ g/cm. La densidad en el punto medio
      —$t=3\pi$— vale $1+9\pi^{2}\approx89$, y en el extremo,
      $1+36\pi^{2}\approx356$. Una media de $119$ entre esos extremos es
      coherente con un crecimiento cuadrático.

      **Lo que hay que llevarse.** En un alambre con densidad variable, la
      masa se reparte muy desigual: aquí la última vuelta pesa más que las
      dos primeras juntas. Calcular la **densidad media** y compararla con la
      de los extremos es la comprobación que caza los errores de bulto.

