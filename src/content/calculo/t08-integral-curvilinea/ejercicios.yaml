  - id: ej-la-masa-de-un-alambre-recto
    titulo: La masa de un alambre recto, y el módulo que la otra integral no lleva
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre la integral respecto de
      la longitud de arco del tema 8. Es deliberadamente un segmento, para que
      el peldaño siguiente —el cuarto de circunferencia del examen de
      2021-2022— sea el que introduce la curva. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un alambre recto va del punto $A(0,0)$ al $B(3,4)$, y su densidad en
      cada punto vale $f(x,y) = x + y$.

      a) ¿Cuánto mide el alambre?

      b) ¿Cuánta masa tiene?
    pide: La longitud del alambre y su masa.
    pasos:
      - tipo: reconocer
        pregunta: |
          En $\int_C f\,d\ell$, ¿qué es exactamente $d\ell$?
        opciones:
          - texto: >-
              Un trocito de longitud de la curva, que en la parametrización
              vale $\lVert \vec r\,'(t)\rVert\,dt$
            correcta: true
            mensaje: |
              Eso es. El parámetro $t$ puede correr deprisa o despacio; lo que
              mide el alambre es la curva, no el parámetro, y el módulo de la
              velocidad es el factor de conversión entre los dos.
          - texto: >-
              Lo mismo que $dt$, solo que escrito de otra manera
            mensaje: |
              Solo coinciden si la curva se recorre a velocidad uno, que casi
              nunca pasa. Aquí $t$ va de 0 a 1 mientras el alambre mide 5: cada
              unidad de parámetro son **cinco** unidades de alambre.
          - texto: >-
              La proyección del trocito sobre el eje X, o sea $dx$
            mensaje: |
              Eso es la integral de la **primera** especie, la del trabajo, y
              es otra cosa: depende del sentido del recorrido y no lleva
              módulo. Esta no depende del sentido, porque la masa de un cable
              es la misma se mida desde un extremo o desde el otro.

      - tipo: calcular
        titulo: El módulo de la velocidad
        pregunta: |
          Parametrizando $\vec r(t) = (3t,\ 4t)$ con $t\in[0,1]$, ¿cuánto vale
          $\lVert \vec r\,'(t)\rVert$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '25'
            mensaje: |
              Te has quedado en $x'^{2}+y'^{2} = 9+16 = 25$ y falta la raíz.
              El módulo de un vector lleva raíz siempre.
          - valor: '7'
            mensaje: |
              Has sumado las componentes, $3+4$, en vez de sus cuadrados. Eso
              sería recorrer los dos catetos; el alambre va por la hipotenusa.
        pista: |
          $\vec r\,'(t) = (3,4)$, constante. Es el triángulo más conocido que
          existe.
        desarrollo: |
          $$
          \lVert \vec r\,'(t)\rVert = \sqrt{3^{2}+4^{2}} = \sqrt{25} = 5
          $$

          Constante, porque el alambre es recto y lo recorremos a velocidad
          uniforme. En cuanto la curva deje de ser recta este módulo dependerá
          de $t$ y habrá que arrastrarlo dentro de la integral.

      - tipo: calcular
        titulo: La longitud
        pregunta: |
          ¿Cuánto mide el alambre?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Has integrado $dt$ en vez de $d\ell$: eso te da cuánto ha
              avanzado el **parámetro**, no el alambre. Falta el módulo.
          - valor: '7'
            mensaje: |
              Esa es la longitud de los dos catetos, 3 más 4. El alambre es la
              hipotenusa.
        pista: |
          Con $f = 1$, la integral de $d\ell$ es la longitud.
        desarrollo: |
          $$
          L = \int_C d\ell = \int_0^{1} 5\,dt = 5
          $$

          Y aquí está la comprobación que conviene hacerse siempre que se
          pueda: la distancia entre $(0,0)$ y $(3,4)$ es 5 por Pitágoras, sin
          integrar nada. **Cuando el resultado se puede verificar por geometría
          elemental, se verifica**, porque es la única forma barata de saber si
          el módulo estaba bien puesto.

      - tipo: calcular
        titulo: La masa
        pregunta: |
          ¿Cuánta masa tiene el alambre?
        respuesta:
          tipo: numero
          valor: '17.5'
          tolerancia: 0.001
          formato: un número, en forma exacta (35/2) o con un decimal
        distractores:
          - valor: '3.5'
            mensaje: |
              Te has dejado el módulo: has integrado $f\,dt$ en lugar de
              $f\,d\ell$. El factor que falta es 5, el mismo de antes, y por
              eso este error da siempre un resultado cinco veces menor.
          - valor: '35'
            mensaje: |
              Has olvidado que $\int_0^{1} t\,dt$ vale $1/2$, no 1. El
              integrando es $35\,t$, no 35.
        pista: |
          Sustituye $x$ e $y$ por su parametrización, multiplica por el módulo
          e integra entre 0 y 1.
        desarrollo: |
          $$
          m = \int_C (x+y)\,d\ell = \int_0^{1} (3t+4t)\cdot 5\,dt
          = 35\int_0^{1} t\,dt = \frac{35}{2} = 17{,}5
          $$

          Se puede comprobar sin integrar: la densidad va de 0 en $A$ a 7 en
          $B$ y crece de forma lineal, así que su media es $3{,}5$; por los 5
          de longitud, 17,5. Que la media aritmética valga aquí es un lujo del
          caso lineal y no se puede usar en general — pero cuando se puede,
          confirma el resultado en diez segundos.

      - tipo: justificar
        pregunta: Ordena el planteamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El alambre es una curva, así que se parametriza: $\vec r(t) =
              (3t, 4t)$ con $t$ de 0 a 1.
          - texto: >-
              El diferencial de longitud es el módulo de la velocidad por
              $dt$, y aquí vale 5 para todo $t$.
          - texto: >-
              Con $f=1$ sale la longitud, 5; con $f=x+y$ sale la masa, 17,5.
          - texto: >-
              Y si el alambre se recorriera de $B$ a $A$, la masa saldría
              $-17{,}5$.
            trampa: true
            mensaje: |
              Saldría 17,5 otra vez. Esta integral **no depende del sentido**,
              precisamente porque el módulo es siempre positivo: no hay ningún
              signo que se pueda dar la vuelta. La que sí cambia de signo al
              invertir el recorrido es la otra, la del trabajo — y
              distinguirlas es la mitad de este apartado.
    resolucion: |
      **La parametrización.** Un segmento de $A$ a $B$ se recorre con
      $\vec r(t) = A + t\,(B-A)$:

      $$
      \vec r(t) = (3t,\ 4t), \qquad t\in[0,1]
      $$

      **El diferencial de longitud.**

      $$
      \lVert \vec r\,'(t)\rVert = \sqrt{3^{2}+4^{2}} = 5
      \qquad\Longrightarrow\qquad d\ell = 5\,dt
      $$

      **a) La longitud.**

      $$
      L = \int_0^{1} 5\,dt = 5
      $$

      que es la distancia de $A$ a $B$, como tenía que ser.

      **b) La masa.**

      $$
      m = \int_0^{1} (3t+4t)\cdot 5\,dt = 35\int_0^{1} t\,dt = \frac{35}{2}
      $$

      **Lo que hay que llevarse.** Las dos integrales curvilíneas del tema se
      parecen en el nombre y en nada más, y se distinguen por dos cosas que se
      ven de un vistazo:

      | | del trabajo | de longitud de arco |
      |---|---|---|
      | diferencial | $dx$, $dy$ | $d\ell$ |
      | lleva módulo | no | **sí**, con su raíz |
      | depende del sentido | **sí**, cambia de signo | no |
      | para qué sirve | trabajo, circulación | longitud, masa, centro de masas |

      Si al terminar un ejercicio de esta segunda especie no has escrito
      ninguna raíz, casi seguro que has olvidado el módulo. Es el error que más
      veces convierte un resultado en otro que se le parece.

      **Y el peldaño siguiente.** Aquí el módulo era constante porque el
      alambre es recto. En el ejercicio 2 de la quinta evaluación de 2021-2022
      el alambre es un cuarto de circunferencia, y entonces el módulo hay que
      calcularlo de verdad — aunque, en una circunferencia parametrizada por el
      ángulo, vuelva a salir constante e igual al radio. Ese es exactamente el
      escalón: la misma cuenta con una curva de verdad debajo.

