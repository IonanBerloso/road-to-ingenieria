      </figcaption>
      </figure>
    pide: Calcular el volumen y describir el sólido.

    pasos:
      - tipo: reconocer
        pregunta: |
          El eje de giro es $y=1$, no $OX$. ¿Cómo cambia eso la fórmula?
        opciones:
          - texto: >-
              El radio deja de ser $f(x)$ y pasa a ser
              $f(x)-1$: **la distancia al eje**
            correcta: true
            mensaje: |
              Eso es. La fórmula de discos no dice «$\pi\int f^{2}$»: dice
              $\pi\int(\text{radio})^{2}$, y el radio es siempre la distancia
              vertical desde la curva hasta el eje de giro. Con $OX$ esa
              distancia es $f$; con $y=1$, es $f-1$.
          - texto: Hay que usar arandelas
            mensaje: |
              Solo si el sólido tuviera hueco. Aquí el dominio **toca** el eje de
              giro en toda su base, así que no lo hay: son discos macizos.
          - texto: Hay que sumar 1 al resultado final
            mensaje: |
              El desplazamiento del eje no se corrige al final: cambia el
              integrando, y de forma no lineal, porque va al cuadrado.
          - texto: Hay que integrar respecto de $y$
            mensaje: |
              El eje de giro es horizontal, así que los discos se siguen apilando
              a lo largo de $x$. La variable no cambia.

      - tipo: calcular
        titulo: Los límites
        pregunta: |
          ¿Entre qué valores de $x$ existe el dominio? Da el límite inferior en
          radianes, en forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.5236'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              En $x=0$ la curva vale 0, por debajo de la recta $y=1$: la
              condición $g(x)\ge1$ no se cumple. El dominio empieza donde
              $2\,\mathrm{sen}\,x = 1$.
          - valor: '2.6180'
            mensaje: |
              $\frac{5\pi}{6} \approx 2{,}618$ es el límite **superior**, la otra
              solución de $\mathrm{sen}\,x = \frac12$ en $(0,\pi)$.
          - valor: '1.5708'
            mensaje: |
              $\frac{\pi}{2}$ es donde la curva alcanza su **máximo**, no donde
              corta a la recta.
        pista: |
          Resuelve $2\,\mathrm{sen}\,x = 1$ en $(0,\pi)$.
        desarrollo: |
          La condición $y\ge1$ junto con $y \le 2\,\mathrm{sen}\,x$ solo se
          puede cumplir donde

          $$
          2\,\mathrm{sen}\,x \ge 1
          \;\Longleftrightarrow\;
          \mathrm{sen}\,x \ge \frac12
          $$

          En $(0,\pi)$ eso ocurre entre

          $$
          x = \frac{\pi}{6} \approx 0{,}5236
          \qquad\text{y}\qquad
          x = \frac{5\pi}{6} \approx 2{,}6180
          $$
        veredicto: |
          Los dos extremos son donde la curva **corta** al eje de giro: ahí el
          radio se anula y el sólido termina en punta.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '3.4148'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '19.7392'
            mensaje: |
              $2\pi^{2} \approx 19{,}74$ es solo el primer término de
              $\pi\left(2\pi-3\sqrt3\right)$. Falta restar $3\sqrt3\pi$.
          - valor: '1.0870'
            mensaje: |
              $2\pi-3\sqrt3 \approx 1{,}087$ es el contenido del paréntesis.
              Falta multiplicar por $\pi$.
          - valor: '9.8696'
            mensaje: |
              $\pi^{2}$ saldría de olvidar el 2. El desarrollo de
              $(2\,\mathrm{sen}\,x-1)^{2}$ deja un término $3x$, no
              $\frac32 x$.
        pista: |
          $V = \pi\int_{\pi/6}^{5\pi/6}\left(2\,\mathrm{sen}\,x-1\right)^{2}dx$,
          y $\mathrm{sen}^{2}x = \frac{1-\cos2x}{2}$.
        desarrollo: |
          $$
          \left(2\,\mathrm{sen}\,x-1\right)^{2}
          = 4\,\mathrm{sen}^{2}x-4\,\mathrm{sen}\,x+1
          $$

          Bajando el grado con $\mathrm{sen}^{2}x = \frac{1-\cos2x}{2}$:

          $$
          = 2-2\cos2x-4\,\mathrm{sen}\,x+1
          = 3-2\cos2x-4\,\mathrm{sen}\,x
          $$

          $$
          \int\left(3-2\cos2x-4\,\mathrm{sen}\,x\right)dx
          = 3x-\mathrm{sen}\,2x+4\cos x
          $$

          En $x = \frac{5\pi}{6}$:
          $\frac{5\pi}{2}+\frac{\sqrt3}{2}-2\sqrt3
          = \frac{5\pi}{2}-\frac{3\sqrt3}{2}$

          En $x = \frac{\pi}{6}$:
          $\frac{\pi}{2}-\frac{\sqrt3}{2}+2\sqrt3
          = \frac{\pi}{2}+\frac{3\sqrt3}{2}$

          $$
          V = \pi\left(2\pi-3\sqrt3\right)
          \approx \pi(6{,}2832-5{,}1962) \approx 3{,}4148
          $$
        veredicto: |
          Sale un número **pequeño**, y tiene sentido: el radio máximo es 1 y el
          sólido se afila en los dos extremos. Un cilindro de radio 1 y la misma
          longitud mediría $\pi\cdot\frac{2\pi}{3} \approx 6{,}6$.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **El dominio:** entre la recta $y=1$ y la curva
              $y = 2\,\mathrm{sen}\,x$, donde esta va por encima, o sea entre
              $\frac{\pi}{6}$ y $\frac{5\pi}{6}$.
          - texto: |
              **El radio** no es $f(x)$, sino la distancia al eje de giro:
              $r(x) = 2\,\mathrm{sen}\,x-1$.
          - texto: |
              **No hay hueco:** el dominio llega hasta el propio eje de giro, así
              que son discos macizos, no arandelas.
          - texto: |
              $V = \pi\int_{\pi/6}^{5\pi/6}
              \left(2\,\mathrm{sen}\,x-1\right)^{2}dx$, y se baja el grado del
              seno al cuadrado antes de integrar.
          - texto: |
              $V = \pi\left(2\pi-3\sqrt3\right) \approx 3{,}41$. El sólido tiene
              forma de **huso**: grueso en el centro, afilado en los extremos.
          - texto: |
              El radio es $2\,\mathrm{sen}\,x$, y al final se resta el volumen
              del cilindro de radio 1 que ocupa el eje.
            trampa: true
            mensaje: |
              Eso sería válido si el dominio empezara en $y=0$ y hubiera que
              vaciar un cilindro. Aquí el dominio **empieza** en $y=1$: no hay
              nada que vaciar. Y además $\int(f-1)^{2} \neq \int f^{2}-\int1$,
              porque el cuadrado de una diferencia no es la diferencia de los
              cuadrados.
        veredicto: |
          La pieza trampa es el error clásico de los ejes desplazados: tratar el
          desplazamiento como una resta al final en vez de meterlo en el radio.

      - tipo: dibujar
        consigna: |
          Dibuja el dominio $D$ en el plano $XY$, la recta $y=1$ que hace de eje
          de giro, y un croquis del sólido que resulta.
        comprueba:
          - punto: |
              La curva $y=2\operatorname{sen}x$ en $\left(0,\pi\right)$, con el
              máximo $2$ en $x=\tfrac\pi2$.
            porque: |
              Es la amplitud $2$, no $1$. El máximo de la curva fija la altura
              del dominio y, con ella, el radio máximo del sólido.
          - punto: |
              La recta $y=1$ cortando la curva en $x=\tfrac\pi6$ y
              $x=\tfrac{5\pi}{6}$.
            porque: |
              De $2\operatorname{sen}x=1$ sale $\operatorname{sen}x=\tfrac12$.
              Esos dos valores son los límites reales de integración, y **no**
              son $0$ y $\pi$ como podría sugerir el enunciado.
          - punto: |
              El dominio sombreado **entre** la recta y la curva, solo en ese
              intervalo.
            porque: |
              Fuera de $\left[\tfrac\pi6,\tfrac{5\pi}{6}\right]$ la curva está por
              debajo de $1$ y no hay región. Sombrear de $0$ a $\pi$ cuenta área
              que no existe.
          - punto: |
              En el croquis del sólido, que el eje de giro es la **recta
              $y=1$**, no el eje $OX$.
            porque: |
              El radio de cada disco es $2\operatorname{sen}x-1$, la distancia a
              esa recta. Usar $2\operatorname{sen}x$ es el error que este
              ejercicio está diseñado para provocar.
        veredicto: |
          Girar alrededor de una recta $y=c$ es lo mismo de siempre con el radio
          medido **desde esa recta**. Dibujar el eje de giro en el propio plano
          $XY$ es lo que impide olvidar el $-1$.

    resolucion: |
      **Datos.** $D$ entre $y=1$ y $y = 2\,\mathrm{sen}\,x$ en $(0,\pi)$, girado
      alrededor de la recta $y=1$.

      ### 1 · Leer el dominio

      La notación del enunciado es peculiar, pero dice esto: $y$ por debajo de
      $2\,\mathrm{sen}\,x$ y por encima de 1. Las dos condiciones solo son
      compatibles donde

      $$
      2\,\mathrm{sen}\,x \ge 1
      \;\Longleftrightarrow\;
      \mathrm{sen}\,x \ge \frac12
      \;\Longleftrightarrow\;
      \frac{\pi}{6} \le x \le \frac{5\pi}{6}
      $$

      ### 2 · El eje desplazado

      La fórmula de discos no es «$\pi\int f^{2}$». Es

      $$
      V = \pi\int_a^{b}\left(\text{radio}\right)^{2}dx
      $$

      y el **radio es la distancia al eje de giro**. Con $OX$ esa distancia es
      $f(x)$; con $y=1$ es

      $$
      r(x) = 2\,\mathrm{sen}\,x-1
      $$

      Y no hay hueco: el dominio llega **hasta** el eje de giro, así que los
      discos son macizos.

      $$
      V = \pi\int_{\pi/6}^{5\pi/6}\left(2\,\mathrm{sen}\,x-1\right)^{2}dx
      $$

      ### 3 · La integral

      Desarrollando y bajando el grado del seno:

      $$
      \left(2\,\mathrm{sen}\,x-1\right)^{2}
      = 4\,\mathrm{sen}^{2}x-4\,\mathrm{sen}\,x+1
      $$

      $$
      4\,\mathrm{sen}^{2}x = 4\cdot\frac{1-\cos2x}{2} = 2-2\cos2x
      $$

      $$
      \left(2\,\mathrm{sen}\,x-1\right)^{2} = 3-2\cos2x-4\,\mathrm{sen}\,x
      $$

      **Bajar el grado antes de integrar** es obligatorio: $\mathrm{sen}^{2}x$ no
      tiene primitiva inmediata, y $\frac{\mathrm{sen}^{3}x}{3}$ es un error, no
      un atajo.

      $$
      \int\left(3-2\cos2x-4\,\mathrm{sen}\,x\right)dx
      = 3x-\mathrm{sen}\,2x+4\cos x
      $$

      **En el extremo superior**, $x = \frac{5\pi}{6}$:

      $$
      \frac{5\pi}{2}-\mathrm{sen}\frac{5\pi}{3}+4\cos\frac{5\pi}{6}
      = \frac{5\pi}{2}+\frac{\sqrt3}{2}-2\sqrt3
      = \frac{5\pi}{2}-\frac{3\sqrt3}{2}
      $$

      **En el inferior**, $x = \frac{\pi}{6}$:

      $$
      \frac{\pi}{2}-\mathrm{sen}\frac{\pi}{3}+4\cos\frac{\pi}{6}
      = \frac{\pi}{2}-\frac{\sqrt3}{2}+2\sqrt3
      = \frac{\pi}{2}+\frac{3\sqrt3}{2}
      $$

      **Restando:**

      $$
      \left(\frac{5\pi}{2}-\frac{3\sqrt3}{2}\right)
      -\left(\frac{\pi}{2}+\frac{3\sqrt3}{2}\right)
      = 2\pi-3\sqrt3
      $$

      $$
      \boxed{V = \pi\left(2\pi-3\sqrt3\right) \approx 3{,}415}
      $$

      ### 4 · El sólido

      Un **huso**: la sección en el centro, $x=\frac{\pi}{2}$, es un disco de
      radio $2-1 = 1$; hacia los dos extremos el radio decrece hasta anularse en
      $\frac{\pi}{6}$ y $\frac{5\pi}{6}$. Simétrico respecto del plano
      $x = \frac{\pi}{2}$.

      La figura del enunciado muestra la sección meridiana: al girarla media
      vuelta se obtiene el sólido.

      ### 5 · Comprobación

      **Por acotación.** El sólido cabe en el cilindro de radio 1 y longitud
      $\frac{5\pi}{6}-\frac{\pi}{6} = \frac{2\pi}{3}$:

      $$
      \pi\cdot1^{2}\cdot\frac{2\pi}{3} \approx 6{,}58
      \qquad\text{y}\qquad
      3{,}415 < 6{,}58 \quad\checkmark
      $$

      Ocupa aproximadamente la mitad, coherente con una figura que se afila en
      los dos extremos.

      **Por el signo.** $2\pi \approx 6{,}283$ y $3\sqrt3 \approx 5{,}196$, luego
      el paréntesis es positivo ✔ Si hubiera salido negativo, el radio estaría
      mal planteado.

      **Por simetría.** El integrando es simétrico respecto de
      $x = \frac{\pi}{2}$, así que el volumen es el doble del de media figura.
      Integrando de $\frac{\pi}{6}$ a $\frac{\pi}{2}$ sale
      $\pi-\frac{3\sqrt3}{2}$, y su doble es $2\pi-3\sqrt3$ ✔

  - id: parabola-y-su-tangente-paralela
    titulo: Una parábola y su tangente paralela a una recta dada
    fuente: >-
      Ejercicio 5.21 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU ·
      Cayó en 2016/2017 6E
    nivel: practica
    enunciado: |
      Sea la función $y = 4x^{2}$. (2016/2017 6E)

      **(a)** Calcular el área del dominio situado en el primer cuadrante y
      delimitado por la curva y su tangente pararela a la recta $y = 8x$.

      **(b)** Calcular el volumen generado al girar el dominio anterior sobre el
      eje $OX$.
    pide: Calcular el área y el volumen.

    pasos:
      - tipo: reconocer
        pregunta: |
          «Tangente paralela a $y=8x$». ¿Qué condición impone eso?
        opciones:
          - texto: >-
              Que la tangente tenga **pendiente 8**, o sea $y'(x) = 8$
            correcta: true
            mensaje: |
              Eso es: paralelas significa misma pendiente. La recta $y=8x$ solo
              sirve para leer el 8; no interviene en la figura, y ese es el
              despiste que busca el enunciado.
          - texto: Que la tangente pase por el origen
            mensaje: |
              La recta $y=8x$ pasa por el origen, pero la tangente no tiene por
              qué: sale $y = 8x-4$, que corta al eje en $x=\frac12$.
          - texto: Que la tangente sea la propia recta $y=8x$
            mensaje: |
              Si lo fuera, tocaría a la curva donde $4x^{2}=8x$, o sea en $x=2$,
              y ahí la pendiente de la parábola es 16, no 8. No es tangente.
          - texto: Que corten en un solo punto
            mensaje: |
              Eso lo cumple cualquier tangente, no solo la paralela a $y=8x$.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área del dominio? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.3333'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '1.3333'
            mensaje: |
              $\frac43$ es $\int_0^{1}4x^{2}dx$, el área bajo la parábola. Falta
              restar el triángulo que hay bajo la tangente.
          - valor: '1'
            mensaje: |
              1 es el área del **triángulo** bajo la tangente, de base
              $\frac12$ y altura 4. Es lo que hay que restar, no el resultado.
          - valor: '0.6666667'
            mensaje: |
              $\frac23$ es el doble del resultado: has restado solo la mitad del
              triángulo.
        pista: |
          $A = \int_0^{1}4x^{2}dx-\text{área del triángulo bajo la tangente}$.
        desarrollo: |
          **La tangente.** $y' = 8x = 8$ da $x=1$, y $y(1) = 4$:

          $$
          y = 4+8(x-1) = 8x-4
          $$

          Corta al eje $OX$ en $x = \frac12$.

          **El área bajo la parábola:**

          $$
          \int_0^{1}4x^{2}dx = \left[\frac{4x^{3}}{3}\right]_0^{1} = \frac43
          $$

          **El triángulo bajo la tangente**, de base
          $1-\frac12 = \frac12$ y altura 4:

          $$
          \frac12\cdot\frac12\cdot4 = 1
          $$

          $$
          A = \frac43-1 = \frac13 \approx 0{,}3333
          $$
        veredicto: |
          El triángulo se puede calcular sin integrar. Merece la pena: ahorra un
          desarrollo y reduce las ocasiones de equivocarse.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen al girar sobre $OX$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '1.6755'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '10.0531'
            mensaje: |
              $\frac{16\pi}{5}$ es solo el sólido que genera la parábola. Falta
              restar el **cono** que genera la tangente.
          - valor: '8.3776'
            mensaje: |
              $\frac{8\pi}{3}$ es el volumen del cono que genera la tangente. Es
              lo que hay que restar, no el resultado.
          - valor: '1.0472'
            mensaje: |
              $\frac{\pi}{3}$ es $\pi$ por el área. El volumen no se obtiene
              multiplicando el área por $\pi$: el radio va al cuadrado dentro de
              la integral.
        pista: |
          $V = \pi\int_0^{1}\left(4x^{2}\right)^{2}dx
          -\pi\int_{1/2}^{1}(8x-4)^{2}dx$.
        desarrollo: |
          **El sólido de la parábola:**

          $$
          \pi\int_0^{1}16x^{4}dx = \pi\left[\frac{16x^{5}}{5}\right]_0^{1}
          = \frac{16\pi}{5}
          $$

          **El cono de la tangente**, que hay que restar:

          $$
          \pi\int_{1/2}^{1}(8x-4)^{2}dx
          = \pi\left[\frac{(8x-4)^{3}}{24}\right]_{1/2}^{1}
          = \pi\cdot\frac{64}{24} = \frac{8\pi}{3}
          $$

          $$
          V = \frac{16\pi}{5}-\frac{8\pi}{3}
          = \frac{48\pi-40\pi}{15} = \frac{8\pi}{15} \approx 1{,}6755
          $$
        veredicto: |
          El cono se puede comprobar con la fórmula elemental: radio 4, altura
          $\frac12$, luego $\frac13\pi\cdot16\cdot\frac12 = \frac{8\pi}{3}$ ✔

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La tangente** paralela a $y=8x$ tiene pendiente 8: de
              $y'=8x=8$ sale $x=1$, y la recta es $y = 8x-4$.
          - texto: |
              **El dominio** está en el primer cuadrante, entre la parábola por
              arriba y por la izquierda, y la tangente y el eje $OX$ por abajo.
              La tangente corta al eje en $x=\frac12$.
          - texto: |
              **(a)** $A = \int_0^{1}4x^{2}dx-\text{triángulo}
              = \frac43-1 = \frac13$.
          - texto: |
              **(b)** Al girar, la parábola genera
              $\frac{16\pi}{5}$ y la tangente un **cono** de
              $\frac{8\pi}{3}$.
          - texto: |
              $V = \frac{16\pi}{5}-\frac{8\pi}{3} = \frac{8\pi}{15}$.
          - texto: |
              La recta $y=8x$ es una de las fronteras del dominio, junto con la
              parábola.
            trampa: true
            mensaje: |
              $y=8x$ **no aparece en la figura**. Solo sirve para leer la
              pendiente: la frontera es la **tangente** $y = 8x-4$, que es otra
              recta, paralela a ella pero desplazada. Confundirlas cambia todos
              los límites de integración.
        veredicto: |
          Es un enunciado que da un dato en forma de recta cuando en realidad
          solo quiere dar un número. Distinguirlo es la mitad del ejercicio.

    resolucion: |
      **Datos.** $y = 4x^{2}$, su tangente paralela a $y=8x$, y el primer
      cuadrante.

      ### 1 · La tangente

      Paralela significa **misma pendiente**:

      $$
      y' = 8x = 8 \;\Longrightarrow\; x = 1,\quad y(1) = 4
      $$

      $$
      y-4 = 8(x-1) \;\Longrightarrow\; y = 8x-4
      $$

      **La recta $y=8x$ no vuelve a aparecer.** Solo servía para leer el 8.
      Tomarla como frontera es el error que arruina el ejercicio.

      La tangente corta al eje $OX$ en

      $$
      8x-4 = 0 \;\Longrightarrow\; x = \frac12
      $$

      ### 2 · Qué región es

      En el primer cuadrante, entre la parábola y su tangente, cerrando por
      abajo con el eje $OX$:

      | tramo | techo | suelo |
      |---|---|---|
      | $0 \le x \le \frac12$ | $4x^{2}$ | $y=0$ |
      | $\frac12 \le x \le 1$ | $4x^{2}$ | $8x-4$ |

      El punto de tangencia $(1,4)$ cierra la figura por la derecha.

      ### 3 · Apartado (a): el área

      Es más cómodo restar de golpe:

      $$
      A = \int_0^{1}4x^{2}\,dx
      -\underbrace{\frac12\cdot\frac12\cdot4}_{\text{triángulo}}
      $$

      $$
      \int_0^{1}4x^{2}dx = \frac43,
      \qquad
      \text{triángulo} = 1
      $$

      $$
      \boxed{A = \frac43-1 = \frac13}
      $$

      El triángulo tiene base $1-\frac12 = \frac12$ —de donde corta al eje al
      punto de tangencia— y altura 4. No hace falta integrarlo.

      ### 4 · Apartado (b): el volumen

      $$
      V = \pi\int_0^{1}\left(4x^{2}\right)^{2}dx
      -\pi\int_{1/2}^{1}\left(8x-4\right)^{2}dx
      $$

      **La parábola:**

      $$
      \pi\int_0^{1}16x^{4}dx = \frac{16\pi}{5}
      $$

      **La tangente**, que genera un cono:

      $$
      \pi\int_{1/2}^{1}(8x-4)^{2}dx
      = \pi\left[\frac{(8x-4)^{3}}{24}\right]_{1/2}^{1}
      = \frac{64\pi}{24} = \frac{8\pi}{3}
      $$

      $$
      \boxed{V = \frac{16\pi}{5}-\frac{8\pi}{3}
      = \frac{8\pi}{15} \approx 1{,}676}
      $$

      ### 5 · Comprobación

      **Del cono, por la fórmula elemental.** Al girar la tangente entre
      $x=\frac12$ y $x=1$ se genera un cono de radio 4 y altura $\frac12$:

      $$
      \frac13\pi R^{2}h = \frac13\pi\cdot16\cdot\frac12 = \frac{8\pi}{3}
      \quad\checkmark
      $$

      **Del área, por acotación.** La separación máxima entre parábola y
      tangente se da en $x=\frac12$, donde la parábola vale 1 y la tangente 0.
      El recinto cabe en un rectángulo de base 1 y altura 1:

      $$
      \frac13 < 1 \quad\checkmark
      $$

      **De coherencia entre los dos apartados.** El sólido cabe en el cilindro de
      radio 4 y longitud 1, de volumen $16\pi \approx 50$; y
      $1{,}68 \ll 50$ ✔ Es pequeño porque casi todo el disco grande se lo lleva
      el cono que se resta.

  - id: parabola-y-sus-dos-tangentes-en-los-cortes
    titulo: La parábola y las tangentes en sus dos cortes con el eje
    fuente: >-
      Ejercicio 5.22 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU ·
      Cayó en 2018/2019 3E
    nivel: practica
    enunciado: |
      Sea $D$ el dominio delimitado por la gráfica de la función
      $y = 2x-x^{2}$ y por su recta tangente en el punto de corte de la gráfica
      de la función con el eje OX. (2018/2019 3E)

      **(a)** Calcular el área del dominio $D$.

      **(b)** Calcular el volumen generado al girar el dominio $D$ alrededor del
      eje OX.
    pide: Calcular el área y el volumen.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice «el punto de corte», en singular. ¿Cuántos hay?
        opciones:
          - texto: >-
              **Dos**, $x=0$ y $x=2$, y el dominio necesita las **dos**
              tangentes para quedar cerrado
            correcta: true
            mensaje: |
              Eso es. Con una sola tangente la región no se cierra: la tangente
              y la parábola solo se tocan en un punto. Con las dos, se cortan
              entre sí en $x=1$ y forman un triángulo curvilíneo. El singular del
              enunciado es una imprecisión de redacción.
          - texto: Uno, el origen
            mensaje: |
              $2x-x^{2} = x(2-x)$ se anula también en $x=2$. Son dos.
          - texto: Uno, el vértice
            mensaje: |
              El vértice está en $(1,1)$, que **no** está sobre el eje $OX$: la
              parábola vale 1 ahí.
          - texto: Ninguno, la parábola no corta al eje
            mensaje: |
              $2x-x^{2}$ es un producto de dos factores lineales: corta al eje
              donde cada uno se anula.

      - tipo: calcular
        titulo: Dónde se cortan las tangentes
        pregunta: |
          Las dos tangentes son $y=2x$ e $y=-2x+4$. ¿En qué $x$ se cortan?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es el segundo punto de tangencia, donde la recta $y=-2x+4$ toca a
              la parábola. Las dos rectas se cortan entre sí antes.
          - valor: '0'
            mensaje: |
              0 es el primer punto de tangencia. En $x=0$ la recta $y=2x$ vale 0
              y la otra vale 4: no coinciden.
          - valor: '4'
            mensaje: |
              4 es el término independiente de la segunda tangente. Hay que
              resolver $2x = -2x+4$.
        pista: |
          Iguala $2x = -2x+4$.
        desarrollo: |
          **Las tangentes.** $y' = 2-2x$.

          En $x=0$: pendiente 2, y la recta pasa por el origen:

          $$
          y = 2x
          $$

          En $x=2$: pendiente $2-4 = -2$, y la recta pasa por $(2,0)$:

          $$
          y = -2(x-2) = -2x+4
          $$

          **Su corte:**

          $$
          2x = -2x+4 \;\Longrightarrow\; 4x = 4 \;\Longrightarrow\; x = 1
          $$

          En $x=1$ las dos valen 2, mientras que la parábola vale 1. La figura es
          un triángulo curvilíneo con vértices en $(0,0)$, $(2,0)$ y $(1,2)$.
        veredicto: |
          El punto de corte cae justo encima del vértice de la parábola, en la
          misma vertical $x=1$. Ahí la separación entre las tangentes y la
          parábola es máxima: $2-1 = 1$.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área de $D$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.6667'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0.3333'
            mensaje: |
              $\frac13$ es solo **uno** de los dos trozos. Los dos valen lo
              mismo y hay que sumarlos.
          - valor: '1.3333'
            mensaje: |
              $\frac43$ es el área **bajo la parábola**,
              $\int_0^{2}\left(2x-x^{2}\right)dx$. El dominio $D$ es el de
              **encima** de la parábola, entre ella y las tangentes.
          - valor: '2'
            mensaje: |
              2 es el área del triángulo de vértices $(0,0)$, $(2,0)$ y
              $(1,2)$, que envuelve al dominio. $D$ es ese triángulo **menos**
              lo que hay bajo la parábola.
        pista: |
          Parte en $x=1$: $A = \int_0^{1}\left[2x-(2x-x^{2})\right]dx
          +\int_1^{2}\left[(-2x+4)-(2x-x^{2})\right]dx$.
        desarrollo: |
          **Trozo izquierdo**, con la tangente $y=2x$ por encima:

          $$
          2x-\left(2x-x^{2}\right) = x^{2}
          $$

          $$
          \int_0^{1}x^{2}dx = \frac13
          $$

          **Trozo derecho**, con $y=-2x+4$ por encima:

          $$
          -2x+4-2x+x^{2} = x^{2}-4x+4 = (x-2)^{2}
          $$

          $$
          \int_1^{2}(x-2)^{2}dx = \left[\frac{(x-2)^{3}}{3}\right]_1^{2}
          = 0+\frac13 = \frac13
          $$

          $$
          A = \frac13+\frac13 = \frac23 \approx 0{,}6667
          $$
        veredicto: |
          Otra vez cuadrados perfectos: la diferencia entre una parábola y su
          tangente es siempre el cuadrado de la distancia al punto de tangencia,
          escalado por el coeficiente principal —aquí $-1$, que da el signo
          correcto porque la parábola queda **por debajo**—.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen al girar sobre $OX$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '5.0265'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '2.5133'
            mensaje: |
              $\frac{4\pi}{5}$ es solo **uno** de los dos trozos. Los dos valen
              lo mismo por simetría respecto de $x=1$.
          - valor: '3.3510'
            mensaje: |
              $\frac{16\pi}{15}$ es el volumen que genera **la parábola sola**
              al girar. Aquí hay que restar ese sólido del que generan las
              tangentes.
          - valor: '8.3776'
            mensaje: |
              $\frac{8\pi}{3}$ es el volumen del **doble cono** que generan las
              dos tangentes. Es el término del que hay que restar, no el
              resultado.
        pista: |
          Arandelas: $V = \pi\int\left(R^{2}-r^{2}\right)$, con $R$ la tangente
          y $r$ la parábola.
        desarrollo: |
          **Trozo izquierdo**, $R = 2x$ y $r = 2x-x^{2}$:

          $$
          R^{2}-r^{2} = 4x^{2}-\left(4x^{2}-4x^{3}+x^{4}\right)
          = 4x^{3}-x^{4}
          $$

          $$
          \pi\int_0^{1}\left(4x^{3}-x^{4}\right)dx
          = \pi\left(1-\frac15\right) = \frac{4\pi}{5}
          $$

          **Trozo derecho.** Por simetría respecto de $x=1$ vale lo mismo:
          $\frac{4\pi}{5}$.

          $$
          V = \frac{4\pi}{5}+\frac{4\pi}{5} = \frac{8\pi}{5}
          \approx 5{,}0265
          $$
        veredicto: |
          La simetría respecto de $x=1$ ahorra la mitad del trabajo, y además
          sirve de comprobación: si los dos trozos salieran distintos, habría un
          error en alguno.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Los cortes con $OX$:** $2x-x^{2} = x(2-x) = 0$ da $x=0$ y $x=2$.
              Son **dos**, aunque el enunciado hable en singular.
          - texto: |
              **Las tangentes:** $y=2x$ en el origen e $y=-2x+4$ en $(2,0)$. Se
              cortan en $(1,2)$, justo encima del vértice de la parábola.
          - texto: |
              **La parábola queda por debajo** de las dos tangentes, porque es
              cóncava ($y''=-2<0$). Las tangentes son el techo y la parábola el
              suelo.
          - texto: |
              **(a)** $\int_0^{1}x^{2}dx+\int_1^{2}(x-2)^{2}dx
              = \frac13+\frac13 = \frac23$.
          - texto: |
              **(b)** Con arandelas,
              $\pi\int\left(R^{2}-r^{2}\right)$, sale
              $\frac{4\pi}{5}$ por trozo, y en total $\frac{8\pi}{5}$.
          - texto: |
              Con una sola tangente basta: el enunciado dice «el punto de corte»
              en singular, y la región queda cerrada por la parábola y esa recta.
            trampa: true
            mensaje: |
              Con una sola tangente la región **no se cierra**: una recta
              tangente toca a la parábola en un único punto y las dos se separan
              indefinidamente. Hacen falta las dos, y entonces se cortan entre sí
              formando un triángulo curvilíneo. El singular del enunciado es una
              imprecisión de redacción; la solución publicada confirma que son
              las dos.
        veredicto: |
          Este ejercicio y el 5.13 son el mismo esquema —parábola más dos
          tangentes— con la parábola volteada. Merece la pena verlos juntos.

    resolucion: |
      **Datos.** $y = 2x-x^{2}$ y sus tangentes en los cortes con $OX$.

      ### 1 · Una imprecisión del enunciado que hay que resolver

      El enunciado dice «su recta tangente en **el** punto de corte», en
      singular. Pero

      $$
      2x-x^{2} = x(2-x) = 0
      \;\Longrightarrow\;
      x = 0,\quad x = 2
      $$

      Hay **dos** cortes. Y con una sola tangente el dominio no queda cerrado: la
      recta toca a la parábola en un punto y a partir de ahí las dos se separan
      sin volver a encontrarse.

      Con **las dos** tangentes sí se cierra: se cortan entre sí y forman un
      triángulo curvilíneo. Es la lectura que hace el ejercicio resoluble, y la
      que confirma la solución publicada del boletín.

      ### 2 · Las dos tangentes

      $$
      y' = 2-2x
      $$

      **En $(0,0)$:** pendiente $y'(0) = 2$, luego $y = 2x$.

      **En $(2,0)$:** pendiente $y'(2) = -2$, luego $y = -2(x-2) = -2x+4$.

      **Se cortan** donde $2x = -2x+4$, es decir en $x=1$, con $y=2$. Ese punto
      está justo encima del **vértice** de la parábola, $(1,1)$.

      La figura tiene vértices en $(0,0)$, $(2,0)$ y $(1,2)$, con el lado
      inferior curvado hacia arriba.

      ### 3 · Quién va encima

      La parábola es **cóncava** ($y'' = -2 < 0$), así que queda siempre **por
      debajo** de sus tangentes. Las rectas son el techo y la parábola el suelo.

      | tramo | techo | suelo |
      |---|---|---|
      | $0\le x\le1$ | $2x$ | $2x-x^{2}$ |
      | $1\le x\le2$ | $-2x+4$ | $2x-x^{2}$ |

      ### 4 · Apartado (a): el área

      **Trozo izquierdo:**

      $$
      2x-\left(2x-x^{2}\right) = x^{2}
      \;\Longrightarrow\;
      \int_0^{1}x^{2}dx = \frac13
      $$

      **Trozo derecho:**

      $$
      (-2x+4)-\left(2x-x^{2}\right) = x^{2}-4x+4 = (x-2)^{2}
      $$

      $$
      \int_1^{2}(x-2)^{2}dx = \left[\frac{(x-2)^{3}}{3}\right]_1^{2}
      = 0-\left(-\frac13\right) = \frac13
      $$

      $$
      \boxed{A = \frac13+\frac13 = \frac23}
      $$

      Otra vez **cuadrados perfectos**: la diferencia entre una parábola y su
      tangente en $x_0$ es $a\left(x-x_0\right)^{2}$, aquí con $a=-1$ y la
      diferencia tomada al revés porque la parábola va por debajo.

      ### 5 · Apartado (b): el volumen

      Al girar alrededor de $OX$, el dominio no toca el eje salvo en los dos
      extremos: hace falta **arandelas**.

      $$
      V = \pi\int\left(R^{2}-r^{2}\right)dx
      $$

      con $R$ la tangente —el radio exterior, porque está arriba— y $r$ la
      parábola.

      **Trozo izquierdo:**

      $$
      R^{2}-r^{2} = (2x)^{2}-\left(2x-x^{2}\right)^{2}
      = 4x^{2}-4x^{2}+4x^{3}-x^{4} = 4x^{3}-x^{4}
      $$

      $$
      \pi\int_0^{1}\left(4x^{3}-x^{4}\right)dx
      = \pi\left[x^{4}-\frac{x^{5}}{5}\right]_0^{1}
      = \pi\left(1-\frac15\right) = \frac{4\pi}{5}
      $$

      **Trozo derecho.** La figura es simétrica respecto de $x=1$ —la parábola lo
      es, y las dos tangentes son reflejo una de otra—, así que vale lo mismo:

      $$
      \frac{4\pi}{5}
      $$

      $$
      \boxed{V = \frac{8\pi}{5} \approx 5{,}027}
      $$

      ### 6 · Comprobación

      **Del área, por diferencia de figuras.** El triángulo de vértices $(0,0)$,
      $(2,0)$ y $(1,2)$ tiene área $\frac12\cdot2\cdot2 = 2$. El área bajo la
      parábola es

      $$
      \int_0^{2}\left(2x-x^{2}\right)dx = 4-\frac83 = \frac43
      $$

      $$
      2-\frac43 = \frac23 \quad\checkmark
      $$

      **Del volumen, por diferencia de sólidos.** Las dos tangentes generan un
      **doble cono** de radio 2 y altura 1 cada mitad:

      $$
      2\cdot\frac13\pi\cdot4\cdot1 = \frac{8\pi}{3}
      $$

      La parábola genera

      $$
      \pi\int_0^{2}\left(2x-x^{2}\right)^{2}dx = \frac{16\pi}{15}
      $$

      $$
      \frac{8\pi}{3}-\frac{16\pi}{15} = \frac{40\pi-16\pi}{15}
      = \frac{24\pi}{15} = \frac{8\pi}{5} \quad\checkmark
      $$

      Dos comprobaciones por vía independiente, las dos exactas.

      ### 7 · Comparación con el ejercicio 5.13

      Los dos son «parábola más dos tangentes», y salen áreas parecidas por la
      misma razón. La diferencia:

      | | 5.13 | 5.22 |
      |---|---|---|
      | parábola | convexa, $a=+1$ | cóncava, $a=-1$ |
      | dónde queda | **encima** de sus tangentes | **debajo** de sus tangentes |
      | quién es el techo | la parábola | las tangentes |
      | integrando | $(x-x_0)^{2}$ | $(x-x_0)^{2}$ |

      El integrando sale igual porque el signo de $a$ y el orden de la resta se
      compensan: en 5.13 se resta la tangente a la parábola, y en 5.22 al revés.
      Verlo evita rehacer el razonamiento entero la segunda vez.

  - id: integrales-inmediatas
    titulo: Diez inmediatas, o cómo reconocer una derivada escondida
    fuente: >-
      Ejercicio 5.23 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU ·
      El boletín no publica solución; el desarrollo es nuestro
    nivel: practica
    enunciado: |
      Integrales inmediatas

      **(a)** $\displaystyle\int e^{\mathrm{sen}^{2}x}\,\mathrm{sen}(2x)\,dx$ ·
      **(b)** $\displaystyle\int x\,\mathrm{sen}\left(x^{2}\right)dx$ ·
      **(c)** $\displaystyle\int\frac{e^{x}}{1+e^{2x}}dx$ ·
      **(d)** $\displaystyle\int\frac{17x}{\sqrt[3]{6x^{2}+8}}dx$ ·
      **(e)** $\displaystyle\int\sec^{2}x\sqrt{\tan x}\,dx$

      **(f)** $\displaystyle\int\frac{\ln x}{x}dx$ ·
      **(g)** $\displaystyle\int\frac{dx}{x\ln x}$ ·
      **(h)** $\displaystyle\int\frac{\cos\sqrt x}{\sqrt x}dx$ ·
      **(i)** $\displaystyle\int\frac{x}{\sqrt{1-x^{4}}}dx$ ·
      **(j)** $\displaystyle\int\mathrm{sen}\,x\cos x\,dx$
    pide: Calcular las diez primitivas.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tienen en común las diez?
        opciones:
          - texto: >-
              En todas aparece **una función y su derivada** multiplicando: son
              de la forma $\int g'(x)\,h\big(g(x)\big)dx$
            correcta: true
            mensaje: |
              Eso es, y por eso se llaman inmediatas: se resuelven con el cambio
              $u = g(x)$, que las convierte en una primitiva de tabla. Todo el
              trabajo está en **ver** cuál es la $g$.
          - texto: Todas se hacen por partes
            mensaje: |
              Ninguna lo necesita. Por partes es el recurso cuando **no** se
              reconoce una función con su derivada.
          - texto: Todas son racionales
            mensaje: |
              Solo (c), (g) e (i) tienen aspecto de cociente, y ninguna se
              resuelve descomponiendo en fracciones simples.
          - texto: Todas dan un logaritmo
            mensaje: |
              Solo (g) lo da. Las demás dan exponenciales, senos, arcotangentes,
              arcosenos y potencias.

      - tipo: calcular
        titulo: El apartado (d), el de los números feos
        pregunta: |
          En $\int\frac{17x}{\sqrt[3]{6x^{2}+8}}dx$, el resultado tiene la forma
          $k\left(6x^{2}+8\right)^{2/3}$. ¿Cuánto vale $k$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '2.1250'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '1.4166667'
            mensaje: |
              $\frac{17}{12}$ es el factor antes de integrar. Falta multiplicar
              por el $\frac32$ que aparece al subir de $u^{-1/3}$ a $u^{2/3}$.
          - valor: '0.9444444'
            mensaje: |
              $\frac{17}{18}$ saldría de **dividir** entre $\frac32$ en vez de
              multiplicar. Al integrar $u^{-1/3}$ el exponente sube a
              $\frac23$, y se divide entre $\frac23$, es decir se multiplica por
              $\frac32$.
          - valor: '8.5'
            mensaje: |
              $\frac{17}{2}$ olvida el 6 de la derivada interna: $du = 12x\,dx$,
              no $2x\,dx$.
        pista: |
          $u = 6x^{2}+8$, $du = 12x\,dx$.
        desarrollo: |
          $$
          u = 6x^{2}+8 \;\Longrightarrow\; du = 12x\,dx
          \;\Longrightarrow\; x\,dx = \frac{du}{12}
          $$

          $$
          \int\frac{17x\,dx}{\sqrt[3]{6x^{2}+8}}
          = \frac{17}{12}\int u^{-1/3}du
          = \frac{17}{12}\cdot\frac{u^{2/3}}{2/3}
          = \frac{17}{12}\cdot\frac32\,u^{2/3}
          $$

          $$
          = \frac{17}{8}\left(6x^{2}+8\right)^{2/3}+C
          $$

          $$
          k = \frac{17}{8} = 2{,}125
          $$
        veredicto: |
          El 17 está puesto a mala idea: obliga a arrastrar una fracción y a no
          confiar en que «los números salgan redondos».

      - tipo: calcular
        titulo: El apartado (i)
        pregunta: |
          $\int\frac{x\,dx}{\sqrt{1-x^{4}}} = k\arcsin\left(x^{2}\right)+C$.
          ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Falta el $\frac12$ que viene de $du = 2x\,dx$: hay una $x$ suelta y
              la derivada de $x^{2}$ es $2x$.
          - valor: '2'
            mensaje: |
              Has multiplicado por 2 en vez de dividir. $x\,dx = \frac{du}{2}$.
          - valor: '0.25'
            mensaje: |
              $\frac14$ saldría de dividir dos veces entre 2. Solo hay un cambio
              de variable.
        pista: |
          $x^{4} = \left(x^{2}\right)^{2}$. Prueba $u = x^{2}$.
        desarrollo: |
          Reescribiendo $x^{4} = \left(x^{2}\right)^{2}$, aparece la forma del
          arcoseno:

          $$
          u = x^{2} \;\Longrightarrow\; du = 2x\,dx
          $$

          $$
          \int\frac{x\,dx}{\sqrt{1-\left(x^{2}\right)^{2}}}
          = \frac12\int\frac{du}{\sqrt{1-u^{2}}}
          = \frac12\arcsin u
          $$

          $$
          = \frac12\arcsin\left(x^{2}\right)+C
          $$
        veredicto: |
          Reescribir $x^{4}$ como $\left(x^{2}\right)^{2}$ es el paso entero. Sin
          ese gesto la integral parece irracional y no lo es.

      - tipo: justificar
        pregunta: |
          Ordena las diez, agrupadas por el cambio que las resuelve. Una de las
          piezas no debe entrar.
        piezas:
          - texto: |
              **El método:** buscar una función $g$ cuya derivada aparezca
              multiplicando, y hacer $u=g(x)$.
          - texto: |
              **(a)** $u=\mathrm{sen}^{2}x$, cuya derivada es
              $\mathrm{sen}\,2x$: da $e^{\mathrm{sen}^{2}x}$.
              **(b)** $u=x^{2}$: da $-\frac{\cos\left(x^{2}\right)}{2}$.
          - texto: |
              **(c)** $u=e^{x}$, y como $e^{2x} = \left(e^{x}\right)^{2}$ queda
              un arcotangente: $\arctan\left(e^{x}\right)$.
              **(d)** $u=6x^{2}+8$: da
              $\frac{17}{8}\left(6x^{2}+8\right)^{2/3}$.
          - texto: |
              **(e)** $u=\tan x$, cuya derivada es $\sec^{2}x$: da
              $\frac23\tan^{3/2}x$.
              **(f)** $u=\ln x$: da $\frac{\ln^{2}x}{2}$.
              **(g)** también $u=\ln x$, pero ahora en el denominador: da
              $\ln\left|\ln x\right|$.
          - texto: |
              **(h)** $u=\sqrt x$: da $2\,\mathrm{sen}\sqrt x$.
              **(i)** $u=x^{2}$: da $\frac12\arcsin\left(x^{2}\right)$.
              **(j)** $u=\mathrm{sen}\,x$: da $\frac{\mathrm{sen}^{2}x}{2}$.
          - texto: |
              En (f) y (g) el cambio es el mismo, así que las dos primitivas se
              diferencian solo en una constante.
            trampa: true
            mensaje: |
              El cambio es el mismo, $u=\ln x$, pero las integrales resultantes
              son **distintas**: $\int u\,du$ en (f) y $\int\frac{du}{u}$ en (g).
              Una da $\frac{u^{2}}{2}$ y la otra $\ln\left|u\right|$: no se
              parecen en nada. Compartir cambio no es compartir resultado.
        veredicto: |
          El par (f)/(g) es el mejor del ejercicio: mismo cambio, resultados
          completamente distintos según dónde esté el $\ln x$.

    resolucion: |
      **Datos.** Diez integrales indefinidas, todas resolubles con un cambio de
      variable inmediato.

      ### 1 · El patrón

      Todas tienen la forma

      $$
      \int g'(x)\cdot h\big(g(x)\big)\,dx
      $$

      es decir, **una función y su derivada** multiplicando. El cambio
      $u = g(x)$, $du = g'(x)dx$ las convierte en $\int h(u)\,du$, que es de
      tabla.

      El trabajo entero está en **ver cuál es la $g$**, y para eso ayuda mirar
      qué hay dentro de la parte complicada —del exponente, de la raíz, del
      logaritmo— y comprobar si su derivada anda suelta por ahí.

      ### 2 · Las diez, una a una

      **(a)** Dentro del exponente hay $\mathrm{sen}^{2}x$, y su derivada es
      $2\,\mathrm{sen}\,x\cos x = \mathrm{sen}\,2x$, que es justo lo que
      multiplica:

      $$
      \int e^{\mathrm{sen}^{2}x}\,\mathrm{sen}(2x)\,dx
      = e^{\mathrm{sen}^{2}x}+C
      $$

      **(b)** $u = x^{2}$, $du = 2x\,dx$:

      $$
      \int x\,\mathrm{sen}\left(x^{2}\right)dx
      = \frac12\int\mathrm{sen}\,u\,du
      = -\frac{\cos\left(x^{2}\right)}{2}+C
      $$

      **(c)** Reescribiendo $e^{2x} = \left(e^{x}\right)^{2}$ aparece la forma
      del arcotangente, con $u=e^{x}$:

      $$
      \int\frac{e^{x}dx}{1+\left(e^{x}\right)^{2}}
      = \arctan\left(e^{x}\right)+C
      $$

      **(d)** $u = 6x^{2}+8$, $du = 12x\,dx$:

      $$
      \frac{17}{12}\int u^{-1/3}du = \frac{17}{12}\cdot\frac32 u^{2/3}
      = \frac{17}{8}\left(6x^{2}+8\right)^{2/3}+C
      $$

      **(e)** $u = \tan x$, y $\sec^{2}x\,dx = du$:

      $$
      \int u^{1/2}du = \frac23\tan^{3/2}x+C
      $$

      **(f)** $u = \ln x$, $du = \frac{dx}{x}$:

      $$
      \int u\,du = \frac{\ln^{2}x}{2}+C
      $$

      **(g)** El **mismo** cambio, pero el $\ln x$ está abajo:

      $$
      \int\frac{du}{u} = \ln\left|\ln x\right|+C
      $$

      **(h)** $u = \sqrt x$, $du = \frac{dx}{2\sqrt x}$, o sea
      $\frac{dx}{\sqrt x} = 2\,du$:

      $$
      2\int\cos u\,du = 2\,\mathrm{sen}\sqrt x+C
      $$

      **(i)** $x^{4} = \left(x^{2}\right)^{2}$, luego $u = x^{2}$:

      $$
      \frac12\int\frac{du}{\sqrt{1-u^{2}}} = \frac12\arcsin\left(x^{2}\right)+C
      $$

      **(j)** $u = \mathrm{sen}\,x$:

      $$
      \int u\,du = \frac{\mathrm{sen}^{2}x}{2}+C
      $$

      ### 3 · Una advertencia sobre (j)

      La misma integral admite otras dos formas:

      $$
      -\frac{\cos^{2}x}{2}+C
      \qquad\text{y}\qquad
      -\frac{\cos 2x}{4}+C
      $$

      Las tres son correctas. **Se diferencian en una constante**, y una
      primitiva está definida salvo constante:

      $$
      \frac{\mathrm{sen}^{2}x}{2}-\left(-\frac{\cos^{2}x}{2}\right)
      = \frac{\mathrm{sen}^{2}x+\cos^{2}x}{2} = \frac12
      $$

      Un resultado que no coincide con el del libro no está necesariamente mal:
      hay que restar y ver si la diferencia es constante.

      ### 4 · El par que más enseña

      **(f)** y **(g)** usan el mismo cambio, $u = \ln x$, y dan cosas
      completamente distintas:

      | | integral en $u$ | resultado |
      |---|---|---|
      | (f) | $\int u\,du$ | $\frac{\ln^{2}x}{2}$ |
      | (g) | $\int\frac{du}{u}$ | $\ln\lvert\ln x\rvert$ |

      Compartir cambio no es compartir resultado. Lo que decide es **dónde**
      está la función: multiplicando o dividiendo.

      ### 5 · Comprobación

      La comprobación de una primitiva es siempre la misma: **derivarla**. Tres
      ejemplos:

      $$
      \frac{d}{dx}\left[e^{\mathrm{sen}^{2}x}\right]
      = e^{\mathrm{sen}^{2}x}\cdot2\,\mathrm{sen}\,x\cos x
      = e^{\mathrm{sen}^{2}x}\,\mathrm{sen}\,2x \quad\checkmark
      $$

      $$
      \frac{d}{dx}\left[\frac{17}{8}\left(6x^{2}+8\right)^{2/3}\right]
      = \frac{17}{8}\cdot\frac23\left(6x^{2}+8\right)^{-1/3}\cdot12x
      = \frac{17x}{\sqrt[3]{6x^{2}+8}} \quad\checkmark
      $$

      $$
      \frac{d}{dx}\left[\ln\left|\ln x\right|\right]
      = \frac{1}{\ln x}\cdot\frac1x = \frac{1}{x\ln x} \quad\checkmark
      $$

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \text{(a)}\ & e^{\mathrm{sen}^{2}x} &
      \text{(f)}\ & \tfrac{\ln^{2}x}{2} \\
      \text{(b)}\ & -\tfrac{\cos(x^{2})}{2} &
      \text{(g)}\ & \ln\left|\ln x\right| \\
      \text{(c)}\ & \arctan(e^{x}) &
      \text{(h)}\ & 2\,\mathrm{sen}\sqrt x \\
      \text{(d)}\ & \tfrac{17}{8}(6x^{2}+8)^{2/3} &
      \text{(i)}\ & \tfrac12\arcsin(x^{2}) \\
      \text{(e)}\ & \tfrac23\tan^{3/2}x &
      \text{(j)}\ & \tfrac{\mathrm{sen}^{2}x}{2}
      \end{aligned}}
      $$

      (todas con $+C$)

  - id: integracion-por-partes
    titulo: Nueve por partes, y la regla ALPES
    fuente: >-
      Ejercicio 5.24 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU ·
      El boletín no publica solución; el desarrollo es nuestro
    nivel: practica
    enunciado: |
      Calcular las siguientes integrales utilizando integración por partes:

      **(a)** $\displaystyle\int x\ln x\,dx$ ·
      **(b)** $\displaystyle\int x\,\mathrm{sen}\,x\,dx$ ·
      **(c)** $\displaystyle\int x^{2}\,\mathrm{sen}\,x\,dx$ ·
      **(d)** $\displaystyle\int\ln x\,dx$ ·
      **(e)** $\displaystyle\int\arctan x\,dx$

      **(f)** $\displaystyle\int\arcsin x\,dx$ ·
      **(g)** $\displaystyle\int\left(x^{2}-2x+5\right)e^{-x}dx$ ·
      **(h)** $\displaystyle\int x\,\mathrm{sen}\,x\cos x\,dx$ ·
      **(i)** $\displaystyle\int e^{x}\,\mathrm{sen}\,x\,dx$
    pide: Calcular las nueve primitivas por partes.

    pasos:
      - tipo: reconocer
        pregunta: |
          En (d), (e) y (f) hay **una sola** función. ¿Cómo se aplica por partes?
        opciones:
          - texto: >-
              Tomando $u$ = la función y $dv = dx$, es decir inventando el
              factor 1
            correcta: true
            mensaje: |
              Exacto. $\int\ln x\,dx = \int 1\cdot\ln x\,dx$, y por partes la
              derivada del logaritmo —que es $\frac1x$— se combina con la
              primitiva de 1 —que es $x$— dando $\int1\,dx$. El truco convierte
              una función sin primitiva evidente en una trivial.
          - texto: 'No se puede: por partes necesita dos factores'
            mensaje: |
              El segundo factor es 1, y siempre está ahí. Es el uso más elegante
              del método.
          - texto: Tomando $u=1$ y $dv$ = la función
            mensaje: |
              Al revés: si $u=1$ entonces $du=0$ y la fórmula no avanza. Además
              $dv$ = la función exige saber su primitiva, que es justo lo que se
              busca.
          - texto: Hay que hacer primero un cambio de variable
            mensaje: |
              No hace falta en ninguna de las tres. Sale directamente con el
              factor 1.

      - tipo: calcular
        titulo: El apartado (a)
        pregunta: |
          $\int x\ln x\,dx = \frac{x^{2}}{2}\ln x-kx^{2}+C$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              $\frac12$ es el coeficiente que sale antes de integrar. La
              integral restante es $\int\frac x2 dx = \frac{x^{2}}{4}$: el 2 del
              denominador se convierte en 4.
          - valor: '0.3333333'
            mensaje: |
              $\frac13$ saldría de integrar $x^{2}$. Aquí lo que se integra es
              $\frac x2$, de grado 1.
          - valor: '1'
            mensaje: |
              1 olvida los dos factores $\frac12$: el de $v = \frac{x^{2}}{2}$ y
              el de integrar $x$.
        pista: |
          ALPES: el **L**ogaritmo va antes que la **P**otencia, así que
          $u = \ln x$.
        desarrollo: |
          $$
          u = \ln x,\qquad dv = x\,dx
          $$

          $$
          du = \frac{dx}{x},\qquad v = \frac{x^{2}}{2}
          $$

          $$
          \int x\ln x\,dx = \frac{x^{2}}{2}\ln x-\int\frac{x^{2}}{2}\cdot
          \frac{dx}{x} = \frac{x^{2}}{2}\ln x-\frac12\int x\,dx
          $$

          $$
          = \frac{x^{2}}{2}\ln x-\frac{x^{2}}{4}+C
          $$

          $$
          k = \frac14 = 0{,}25
          $$
        veredicto: |
          Elegir $u = \ln x$ es lo que hace funcionar el método: al derivarlo
          desaparece el logaritmo. Al revés, con $u=x$, la integral restante
          sería peor que la de partida.

      - tipo: calcular
        titulo: El apartado (i), el que se muerde la cola
        pregunta: |
          $\int e^{x}\,\mathrm{sen}\,x\,dx
          = k\,e^{x}\left(\mathrm{sen}\,x-\cos x\right)+C$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Falta el $\frac12$. Al aplicar partes dos veces reaparece la
              integral original, y al despejarla queda
              $2I = e^{x}(\mathrm{sen}\,x-\cos x)$.
          - valor: '-0.5'
            mensaje: |
              Signo cambiado. Comprueba derivando: la derivada de
              $\frac{e^{x}}{2}(\mathrm{sen}\,x-\cos x)$ tiene que dar
              $e^{x}\,\mathrm{sen}\,x$, positivo.
          - valor: '0.25'
            mensaje: |
              $\frac14$ saldría de dividir dos veces entre 2. Solo se despeja una
              vez.
        pista: |
          Aplica partes **dos** veces y observa que reaparece la integral de
          partida.
        desarrollo: |
          Llamando $I$ a la integral y tomando $u = \mathrm{sen}\,x$,
          $dv = e^{x}dx$:

          $$
          I = e^{x}\,\mathrm{sen}\,x-\int e^{x}\cos x\,dx
          $$

          Y otra vez, con $u = \cos x$:

          $$
          \int e^{x}\cos x\,dx = e^{x}\cos x+\int e^{x}\,\mathrm{sen}\,x\,dx
          = e^{x}\cos x+I
          $$

          Sustituyendo:

          $$
          I = e^{x}\,\mathrm{sen}\,x-e^{x}\cos x-I
          $$

          $$
          2I = e^{x}\left(\mathrm{sen}\,x-\cos x\right)
          \;\Longrightarrow\;
          I = \frac{e^{x}}{2}\left(\mathrm{sen}\,x-\cos x\right)+C
          $$
        veredicto: |
          **Es imprescindible mantener el mismo criterio en las dos
          aplicaciones**: si en la segunda se toma $u = e^{x}$, todo se cancela y
          queda $I=I$, cierto e inútil.

      - tipo: justificar
        pregunta: |
          Ordena el método y sus nueve resultados. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **La fórmula:** $\int u\,dv = uv-\int v\,du$, y el criterio
              **ALPES** para elegir $u$: **A**rcos, **L**ogaritmos,
              **P**otencias, **E**xponenciales, **S**enos. El que aparezca antes
              es $u$.
          - texto: |
              **Con una sola función**, (d) (e) (f), se toma $dv = dx$:
              $\int\ln x = x\ln x-x$;
              $\int\arctan x = x\arctan x-\frac12\ln\left(1+x^{2}\right)$;
              $\int\arcsin x = x\arcsin x+\sqrt{1-x^{2}}$.
          - texto: |
              **Potencia por seno**, (b) y (c): $u$ es la potencia, y cada
              aplicación le baja un grado.
              $\int x\,\mathrm{sen}\,x = -x\cos x+\mathrm{sen}\,x$;
              $\int x^{2}\mathrm{sen}\,x = -x^{2}\cos x+2x\,\mathrm{sen}\,x
              +2\cos x$.
          - texto: |
              **(a)** $\frac{x^{2}}{2}\ln x-\frac{x^{2}}{4}$.
              **(g)** $-e^{-x}\left(x^{2}+5\right)$, aplicando partes dos veces.
          - texto: |
              **(h)** Conviene simplificar antes:
              $\mathrm{sen}\,x\cos x = \frac{\mathrm{sen}\,2x}{2}$, y sale
              $-\frac{x\cos2x}{4}+\frac{\mathrm{sen}\,2x}{8}$.
              **(i)** Sale despejando: $\frac{e^{x}}{2}\left(\mathrm{sen}\,x
              -\cos x\right)$.
          - texto: |
              En (i) conviene tomar $u = \mathrm{sen}\,x$ la primera vez y
              $u = e^{x}$ la segunda, para que la integral se cierre antes.
            trampa: true
            mensaje: |
              Justo lo contrario: cambiar de criterio en la segunda aplicación
              **deshace** la primera y devuelve la identidad $I = I$, cierta e
              inútil. Hay que mantener el mismo papel para el exponencial en las
              dos vueltas.
        veredicto: |
          ALPES no es una regla mágica: funciona porque coloca primero las
          funciones que **se simplifican al derivar** —arcos y logaritmos— y
          últimas las que no cambian.

    resolucion: |
      **Datos.** Nueve integrales por partes.

      ### 1 · La fórmula y el criterio

      $$
      \int u\,dv = uv-\int v\,du
      $$

      La elección de $u$ decide si el método sirve o empeora las cosas. El
      criterio práctico es **ALPES**:

      $$
      \textbf{A}\text{rcos} \;>\;
      \textbf{L}\text{ogaritmos} \;>\;
      \textbf{P}\text{otencias} \;>\;
      \textbf{E}\text{xponenciales} \;>\;
      \textbf{S}\text{enos}
      $$

      El que aparezca **antes** en la lista es $u$.

      No es arbitrario: la lista está ordenada por «cuánto se simplifica al
      derivar». Un arcotangente derivado se convierte en una función racional;
      un logaritmo, en $\frac1x$; una potencia baja un grado; una exponencial no
      cambia; un seno tampoco.

      ### 2 · Las que solo tienen una función

      El truco es escribir $dv = dx$, es decir multiplicar por 1.

      **(d)** $u = \ln x$, $dv = dx$:

      $$
      \int\ln x\,dx = x\ln x-\int x\cdot\frac{dx}{x} = x\ln x-x+C
      $$

      **(e)** $u = \arctan x$, $du = \frac{dx}{1+x^{2}}$:

      $$
      \int\arctan x\,dx = x\arctan x-\int\frac{x\,dx}{1+x^{2}}
      = x\arctan x-\frac12\ln\left(1+x^{2}\right)+C
      $$

      **(f)** $u = \arcsin x$, $du = \frac{dx}{\sqrt{1-x^{2}}}$:

      $$
      \int\arcsin x\,dx = x\arcsin x-\int\frac{x\,dx}{\sqrt{1-x^{2}}}
      = x\arcsin x+\sqrt{1-x^{2}}+C
      $$

      ### 3 · Potencia por función trigonométrica o logaritmo

      **(a)** ALPES pone el logaritmo antes que la potencia, luego $u = \ln x$:

      $$
      \frac{x^{2}}{2}\ln x-\frac12\int x\,dx
      = \frac{x^{2}}{2}\ln x-\frac{x^{2}}{4}+C
      $$

      **(b)** Aquí $u = x$, porque la potencia va antes que el seno:

      $$
      \int x\,\mathrm{sen}\,x\,dx = -x\cos x+\int\cos x\,dx
      = -x\cos x+\mathrm{sen}\,x+C
      $$

      **(c)** El mismo criterio, **dos** veces, porque el grado es 2:

      $$
      \int x^{2}\mathrm{sen}\,x\,dx = -x^{2}\cos x+2\int x\cos x\,dx
      $$

      $$
      = -x^{2}\cos x+2\left(x\,\mathrm{sen}\,x+\cos x\right)+C
      $$

      $$
      = -x^{2}\cos x+2x\,\mathrm{sen}\,x+2\cos x+C
      $$

      **Cada aplicación baja un grado.** Con $x^{n}$ hacen falta $n$ vueltas.

      ### 4 · El polinomio por exponencial

      **(g)** Con $P(x) = x^{2}-2x+5$ y $dv = e^{-x}dx$, dos aplicaciones dan

      $$
      \int P(x)e^{-x}dx = -e^{-x}\left(P+P'+P''\right)+C
      $$

      $$
      P+P'+P'' = \left(x^{2}-2x+5\right)+\left(2x-2\right)+2 = x^{2}+5
      $$

      $$
      \boxed{\int\left(x^{2}-2x+5\right)e^{-x}dx = -e^{-x}\left(x^{2}+5\right)+C}
      $$

      Esa fórmula compacta —sumar el polinomio y todas sus derivadas— vale para
      cualquier $\int P(x)e^{-x}dx$, y ahorra las dos vueltas.

      ### 5 · El que conviene simplificar antes

      **(h)** Aplicar partes directamente funciona, pero es más largo. Usando
      primero la fórmula del ángulo doble:

      $$
      \mathrm{sen}\,x\cos x = \frac{\mathrm{sen}\,2x}{2}
      $$

      $$
      \int x\,\mathrm{sen}\,x\cos x\,dx = \frac12\int x\,\mathrm{sen}\,2x\,dx
      $$

      $$
      = \frac12\left(-\frac{x\cos2x}{2}+\frac{\mathrm{sen}\,2x}{4}\right)
      = -\frac{x\cos2x}{4}+\frac{\mathrm{sen}\,2x}{8}+C
      $$

      **Simplificar el integrando antes de aplicar el método** es siempre la
      primera pregunta que hay que hacerse.

      ### 6 · El que se muerde la cola

      **(i)** Llamando $I$ a la integral, con $u = \mathrm{sen}\,x$ y
      $dv = e^{x}dx$:

      $$
      I = e^{x}\,\mathrm{sen}\,x-\int e^{x}\cos x\,dx
      $$

      Segunda vuelta, **manteniendo el criterio** ($u$ trigonométrica):

      $$
      \int e^{x}\cos x\,dx = e^{x}\cos x+I
      $$

      $$
      I = e^{x}\,\mathrm{sen}\,x-e^{x}\cos x-I
      \;\Longrightarrow\;
      \boxed{I = \frac{e^{x}}{2}\left(\mathrm{sen}\,x-\cos x\right)+C}
      $$

      **El error clásico** es cambiar de criterio en la segunda vuelta: entonces
      se deshace la primera y queda $I=I$, cierto y estéril.

      ### 7 · Comprobación

      Derivando tres de ellas:

      $$
      \frac{d}{dx}\left[x\ln x-x\right] = \ln x+1-1 = \ln x \quad\checkmark
      $$

      $$
      \frac{d}{dx}\left[-e^{-x}\left(x^{2}+5\right)\right]
      = e^{-x}\left(x^{2}+5\right)-e^{-x}\cdot2x
      = e^{-x}\left(x^{2}-2x+5\right) \quad\checkmark
      $$

      $$
      \frac{d}{dx}\left[\frac{e^{x}}{2}\left(\mathrm{sen}\,x-\cos x\right)\right]
      = \frac{e^{x}}{2}\left(\mathrm{sen}\,x-\cos x
      +\cos x+\mathrm{sen}\,x\right) = e^{x}\,\mathrm{sen}\,x \quad\checkmark
      $$

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \text{(a)}\ & \tfrac{x^{2}}{2}\ln x-\tfrac{x^{2}}{4} \\
      \text{(b)}\ & -x\cos x+\mathrm{sen}\,x \\
      \text{(c)}\ & -x^{2}\cos x+2x\,\mathrm{sen}\,x+2\cos x \\
      \text{(d)}\ & x\ln x-x \\
      \text{(e)}\ & x\arctan x-\tfrac12\ln\left(1+x^{2}\right) \\
      \text{(f)}\ & x\arcsin x+\sqrt{1-x^{2}} \\
      \text{(g)}\ & -e^{-x}\left(x^{2}+5\right) \\
      \text{(h)}\ & -\tfrac{x\cos2x}{4}+\tfrac{\mathrm{sen}\,2x}{8} \\
      \text{(i)}\ & \tfrac{e^{x}}{2}\left(\mathrm{sen}\,x-\cos x\right)
      \end{aligned}}
      $$

      (todas con $+C$)

  - id: integrales-racionales
    titulo: Siete racionales, y la comprobación que hay que hacer primero
    fuente: >-
      Ejercicio 5.25 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU ·
      El boletín no publica solución; el desarrollo es nuestro
    nivel: practica
    enunciado: |
      Calcular las integrales de las siguientes funciones racionales:

      **(a)** $\displaystyle\int\frac{dx}{(x-1)(x+2)(x+3)}$ ·
      **(b)** $\displaystyle\int\frac{4x^{2}}{x^{2}+4}dx$ ·
      **(c)** $\displaystyle\int\frac{x^{2}+2}{(x+1)^{3}(x-2)}dx$ ·
      **(d)** $\displaystyle\int\frac{x^{2}+3}{x^{2}-1}dx$

      **(e)** $\displaystyle\int\frac{2x^{2}-3x+2}{x^{3}+x}dx$ ·
      **(f)** $\displaystyle\int\frac{x^{2}}{x^{2}+2x+5}dx$ ·
      **(g)** $\displaystyle\int\frac{x+2}{x^{2}+2x+2}dx$
    pide: Calcular las siete primitivas.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que comprobar **antes** de descomponer en fracciones simples?
        opciones:
          - texto: >-
              Que el grado del numerador sea **menor** que el del denominador;
              si no, hay que **dividir** primero
            correcta: true
            mensaje: |
              Eso es, y es el fallo más común del bloque. En (b), (d) y (f) los
              grados son iguales, así que descomponer directamente da un sistema
              incompatible. Hay que dividir y quedarse con cociente más resto
              partido por el divisor.
          - texto: Que el denominador tenga raíces reales
            mensaje: |
              No hace falta: los factores cuadráticos irreducibles se tratan con
              términos de la forma $\frac{Ax+B}{x^{2}+px+q}$, que dan logaritmos
              y arcotangentes.
          - texto: Que la fracción sea positiva
            mensaje: |
              El signo no interviene en absoluto.
          - texto: Que el denominador esté factorizado
            mensaje: |
              Hay que factorizarlo, sí, pero **después** de comprobar los grados.
              Si el numerador manda, factorizar no sirve de nada todavía.

      - tipo: calcular
        titulo: El apartado (b), donde hay que dividir
        pregunta: |
          $\int\frac{4x^{2}}{x^{2}+4}dx = 4x-k\arctan\frac x2+C$. ¿Cuánto vale
          $k$?
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '16'
            mensaje: |
              16 es el numerador del resto: $\frac{4x^{2}}{x^{2}+4}
              = 4-\frac{16}{x^{2}+4}$. Falta el $\frac12$ de la primitiva del
              arcotangente, porque $a=2$.
          - valor: '4'
            mensaje: |
              4 es el cociente de la división, el término que da $4x$. El
              coeficiente del arcotangente es otro.
          - valor: '2'
            mensaje: |
              2 es el $a$ del denominador $x^{2}+a^{2}$. Aparece en la fórmula,
              pero el coeficiente final es $\frac{16}{2} = 8$.
        pista: |
          Divide primero: $\frac{4x^{2}}{x^{2}+4} = 4-\frac{16}{x^{2}+4}$.
        desarrollo: |
          Los dos grados son 2: **hay que dividir**.

          $$
          \frac{4x^{2}}{x^{2}+4} = \frac{4\left(x^{2}+4\right)-16}{x^{2}+4}
          = 4-\frac{16}{x^{2}+4}
          $$

          $$
          \int\frac{dx}{x^{2}+4} = \frac12\arctan\frac x2
          $$

          $$
          \int\frac{4x^{2}}{x^{2}+4}dx = 4x-16\cdot\frac12\arctan\frac x2
          = 4x-8\arctan\frac x2+C
          $$
        veredicto: |
          Si se descompusiera sin dividir, saldría un sistema sin solución. La
          división no es un adorno: es lo que hace posible la descomposición.

      - tipo: calcular
        titulo: El apartado (c), la raíz triple
        pregunta: |
          En la descomposición
          $\frac{x^{2}+2}{(x+1)^{3}(x-2)}$, el coeficiente del término
          $\frac{D}{x-2}$ vale $D$. ¿Cuánto es? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.2222'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0.6666667'
            mensaje: |
              $\frac23$ olvida el 27 del denominador: al sustituir $x=2$ queda
              $6 = D(2+1)^{3} = 27D$, no $6 = 9D$.
          - valor: '6'
            mensaje: |
              6 es el numerador evaluado en $x=2$: $2^{2}+2 = 6$. Falta dividir
              entre $(2+1)^{3} = 27$.
          - valor: '-1'
            mensaje: |
              $-1$ es el coeficiente $C$ del término
              $\frac{C}{(x+1)^{3}}$, que sale de sustituir $x=-1$.
        pista: |
          Sustituye $x=2$ en la identidad
          $x^{2}+2 = A(x+1)^{2}(x-2)+B(x+1)(x-2)+C(x-2)+D(x+1)^{3}$.
        desarrollo: |
          Una raíz **triple** exige tres términos, uno por cada potencia:

          $$
          \frac{x^{2}+2}{(x+1)^{3}(x-2)}
          = \frac{A}{x+1}+\frac{B}{(x+1)^{2}}+\frac{C}{(x+1)^{3}}
          +\frac{D}{x-2}
          $$

          Multiplicando por el denominador:

          $$
          x^{2}+2 = A(x+1)^{2}(x-2)+B(x+1)(x-2)+C(x-2)+D(x+1)^{3}
          $$

          **En $x=2$** se anulan los tres primeros:

          $$
          6 = D\cdot3^{3} = 27D \;\Longrightarrow\; D = \frac{2}{9}
          \approx 0{,}2222
          $$
        veredicto: |
          Sustituir las raíces del denominador anula casi todos los términos y
          da los coeficientes «de golpe». Los que quedan salen igualando
          coeficientes.

      - tipo: justificar
        pregunta: |
          Ordena el método y sus siete resultados. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **Paso cero:** comparar grados. En (b), (d) y (f) el numerador no
              es de grado menor, así que **hay que dividir** antes de nada.
          - texto: |
              **Raíces simples**, (a) y (d): un término
              $\frac{A}{x-r}$ por raíz, y cada uno da un logaritmo.
              (a) $= \frac{1}{12}\ln\left|x-1\right|-\frac13\ln\left|x+2\right|
              +\frac14\ln\left|x+3\right|$.
              (d) $= x+2\ln\left|\frac{x-1}{x+1}\right|$.
          - texto: |
              **Raíz múltiple**, (c): tantos términos como el orden.
              $= \frac29\ln\left|\frac{x-2}{x+1}\right|-\frac{1}{3(x+1)}
              +\frac{1}{2(x+1)^{2}}$.
          - texto: |
              **Factor cuadrático irreducible**, (b) (e) (f) (g): el término es
              $\frac{Ax+B}{x^{2}+px+q}$, y se parte en un logaritmo más un
              arcotangente completando cuadrados.
          - texto: |
              (b) $= 4x-8\arctan\frac x2$.
              (e) $= 2\ln\left|x\right|-3\arctan x$.
              (f) $= x-\ln\left(x^{2}+2x+5\right)-\frac32\arctan\frac{x+1}{2}$.
              (g) $= \frac12\ln\left(x^{2}+2x+2\right)+\arctan(x+1)$.
          - texto: |
              En (f) y (g) los denominadores no tienen raíces reales, así que
              esas integrales no se pueden resolver con fracciones simples.
            trampa: true
            mensaje: |
              Sí se pueden: un factor cuadrático irreducible **es** un caso
              contemplado por el método. Se le asigna un término
              $\frac{Ax+B}{x^{2}+px+q}$, que se separa en la parte que da un
              logaritmo —la que lleva la derivada del denominador— y la que da
              un arcotangente, completando cuadrados.
        veredicto: |
          Completar cuadrados es la maniobra que convierte cualquier cuadrático
          irreducible en la forma $u^{2}+a^{2}$ del arcotangente.

    resolucion: |
      **Datos.** Siete integrales de funciones racionales.

      ### 1 · El paso cero: comparar grados

      **Antes de descomponer nada**, hay que mirar los grados. Si el numerador
      tiene grado mayor o igual que el denominador, la descomposición en
      fracciones simples **no existe**: hay que dividir primero.

      | | grado num. | grado den. | ¿dividir? |
      |---|---|---|---|
      | (a) | 0 | 3 | no |
      | (b) | 2 | 2 | **sí** |
      | (c) | 2 | 4 | no |
      | (d) | 2 | 2 | **sí** |
      | (e) | 2 | 3 | no |
      | (f) | 2 | 2 | **sí** |
      | (g) | 1 | 2 | no |

      Tres de siete. Saltarse este paso es el fallo más frecuente del bloque.

      ### 2 · Los tres tipos de término

      | factor del denominador | término correspondiente | da |
      |---|---|---|
      | $x-r$ simple | $\frac{A}{x-r}$ | logaritmo |
      | $(x-r)^{n}$ | $\frac{A_1}{x-r}+\cdots+\frac{A_n}{(x-r)^{n}}$ | log + potencias |
      | $x^{2}+px+q$ irreducible | $\frac{Ax+B}{x^{2}+px+q}$ | log + arcotangente |

      ### 3 · (a) Tres raíces simples

      $$
      \frac{1}{(x-1)(x+2)(x+3)}
      = \frac{A}{x-1}+\frac{B}{x+2}+\frac{C}{x+3}
      $$

      Sustituyendo cada raíz:

      $$
      A = \frac{1}{3\cdot4} = \frac{1}{12},
      \quad
      B = \frac{1}{(-3)(1)} = -\frac13,
      \quad
      C = \frac{1}{(-4)(-1)} = \frac14
      $$

      $$
      \int = \frac{1}{12}\ln\left|x-1\right|-\frac13\ln\left|x+2\right|
      +\frac14\ln\left|x+3\right|+C
      $$

      ### 4 · (b) y (d), donde hay que dividir

      **(b)**

      $$
      \frac{4x^{2}}{x^{2}+4} = 4-\frac{16}{x^{2}+4}
      \;\Longrightarrow\;
      \int = 4x-8\arctan\frac{x}{2}+C
      $$

      **(d)**

      $$
      \frac{x^{2}+3}{x^{2}-1} = 1+\frac{4}{x^{2}-1}
      = 1+\frac{2}{x-1}-\frac{2}{x+1}
      $$

      $$
      \int = x+2\ln\left|\frac{x-1}{x+1}\right|+C
      $$

      ### 5 · (c) La raíz triple

      $$
      x^{2}+2 = A(x+1)^{2}(x-2)+B(x+1)(x-2)+C(x-2)+D(x+1)^{3}
      $$

      **$x=-1$:** $3 = -3C \Rightarrow C = -1$

      **$x=2$:** $6 = 27D \Rightarrow D = \frac29$

      **Coeficiente de $x^{3}$:** $0 = A+D \Rightarrow A = -\frac29$

      **Término independiente ($x=0$):**
      $2 = -2A-2B-2C+D = \frac49-2B+2+\frac29$, de donde $B = \frac13$.

      $$
      \int = -\frac29\ln\left|x+1\right|-\frac{1}{3(x+1)}
      +\frac{1}{2(x+1)^{2}}+\frac29\ln\left|x-2\right|+C
      $$

      $$
      = \frac29\ln\left|\frac{x-2}{x+1}\right|-\frac{1}{3(x+1)}
      +\frac{1}{2(x+1)^{2}}+C
      $$

      Nótese que $\int\frac{C\,dx}{(x+1)^{3}}
      = -\frac{C}{2(x+1)^{2}}$, y con $C=-1$ sale el $+\frac{1}{2(x+1)^{2}}$.

      ### 6 · (e) Factor lineal más cuadrático

      $x^{3}+x = x\left(x^{2}+1\right)$, y $x^{2}+1$ es irreducible:

      $$
      \frac{2x^{2}-3x+2}{x\left(x^{2}+1\right)}
      = \frac{A}{x}+\frac{Bx+C}{x^{2}+1}
      $$

      $$
      2x^{2}-3x+2 = A\left(x^{2}+1\right)+(Bx+C)x
      = (A+B)x^{2}+Cx+A
      $$

      $$
      A = 2,\quad C = -3,\quad B = 0
      $$

      $$
      \int = 2\ln\left|x\right|-3\arctan x+C
      $$

      ### 7 · (f) y (g), completando cuadrados

      **(g)** El truco es separar la **derivada del denominador**, que es
      $2x+2$:

      $$
      \frac{x+2}{x^{2}+2x+2} = \frac{x+1}{x^{2}+2x+2}+\frac{1}{x^{2}+2x+2}
      $$

      El primero da un logaritmo; el segundo, completando cuadrados
      $x^{2}+2x+2 = (x+1)^{2}+1$, da un arcotangente:

      $$
      \int = \frac12\ln\left(x^{2}+2x+2\right)+\arctan(x+1)+C
      $$

      **(f)** Primero dividir, y luego lo mismo:

      $$
      \frac{x^{2}}{x^{2}+2x+5} = 1-\frac{2x+5}{x^{2}+2x+5}
      $$

      $$
      \frac{2x+5}{x^{2}+2x+5} = \frac{2x+2}{x^{2}+2x+5}
      +\frac{3}{(x+1)^{2}+4}
      $$

      $$
      \int = x-\ln\left(x^{2}+2x+5\right)-\frac32\arctan\frac{x+1}{2}+C
      $$

      El $\frac32$ sale de $3\cdot\frac12$, con el $\frac12$ de
      $\int\frac{du}{u^{2}+4}$.

      ### 8 · Comprobación

      **De (b), derivando:**

      $$
      \frac{d}{dx}\left[4x-8\arctan\frac x2\right]
      = 4-8\cdot\frac{1/2}{1+\frac{x^{2}}{4}}
      = 4-\frac{16}{x^{2}+4} = \frac{4x^{2}}{x^{2}+4} \quad\checkmark
      $$

      **De (c), evaluando la descomposición** en un punto que no sea raíz,
      $x=1$:

      $$
      \text{izquierda: } \frac{3}{2^{3}\cdot(-1)} = -\frac38
      $$

      $$
      \text{derecha: } -\frac{2}{9\cdot2}+\frac{1}{3\cdot4}
      -\frac{1}{8}-\frac{2}{9} = -\frac38 \quad\checkmark
      $$

      **De (e), derivando:**

      $$
      \frac{2}{x}-\frac{3}{1+x^{2}}
      = \frac{2\left(1+x^{2}\right)-3x}{x\left(1+x^{2}\right)}
      = \frac{2x^{2}-3x+2}{x^{3}+x} \quad\checkmark
      $$

  - id: integrales-irracionales
    titulo: 'Siete irracionales: hacer desaparecer la raíz'
    fuente: >-
      Ejercicio 5.26 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU ·
      El boletín no publica solución; el desarrollo es nuestro
    nivel: practica
    enunciado: |
      Calcular las integrales de las siguientes funciones irracionales:

      **(a)** $\displaystyle\int\frac{\sqrt x}{\sqrt[4]{x^{3}}+1}dx$ ·
      **(b)** $\displaystyle\int x\sqrt{x+1}\,dx$ ·
      **(c)** $\displaystyle\int\frac{\sqrt x-2\sqrt[3]{x^{2}}+1}{\sqrt[4]x}dx$ ·
      **(d)** $\displaystyle\int\frac{\sqrt{x+4}}{x}dx$

      **(e)** $\displaystyle\int\frac{dx}{\sqrt{8-5x^{2}}}$ ·
      **(f)** $\displaystyle\int\sqrt{1+x^{2}}\,dx$ ·
      **(g)** $\displaystyle\int\sqrt{1-x^{2}}\,dx$
    pide: Calcular las siete primitivas.

    pasos:
      - tipo: reconocer
        pregunta: |
          En (a) hay una raíz cuadrada y una cuarta. ¿Qué cambio las quita las
          dos a la vez?
        opciones:
          - texto: >-
              $x = t^{4}$, con el **mínimo común múltiplo** de los índices
            correcta: true
            mensaje: |
              Eso es. Los índices son 2 y 4, y su m.c.m. es 4. Con $x=t^{4}$ la
              raíz cuadrada se vuelve $t^{2}$ y la cuarta $t$: las dos
              desaparecen y queda una función racional.
          - texto: $x = t^{2}$
            mensaje: |
              Quitaría la raíz cuadrada, pero $\sqrt[4]{x^{3}}$ se convertiría en
              $\sqrt{t^{3}}$, que sigue siendo irracional. Hace falta el m.c.m.
          - texto: $x = t^{8}$
            mensaje: |
              Funcionaría, pero deja exponentes innecesariamente altos y una
              racional mucho más fea. Se usa el **mínimo** común múltiplo por
              algo.
          - texto: $x = \mathrm{sen}\,t$
            mensaje: |
              Los cambios trigonométricos sirven para raíces de la forma
              $\sqrt{a^{2}-x^{2}}$, como en (e) y (g). Aquí no hay ninguna suma
              ni diferencia de cuadrados.

      - tipo: calcular
        titulo: El apartado (b)
        pregunta: |
          $\int x\sqrt{x+1}\,dx = k(x+1)^{5/2}-\frac23(x+1)^{3/2}+C$. ¿Cuánto
          vale $k$?
        respuesta:
          tipo: numero
          valor: '0.4'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.2'
            mensaje: |
              $\frac15$ olvida el factor 2 que aparece al deshacer
              $dx = 2t\,dt$.
          - valor: '0.6666667'
            mensaje: |
              $\frac23$ es el coeficiente del **segundo** término, el de
              exponente $\frac32$.
          - valor: '1'
            mensaje: |
              1 olvida el $\frac15$ de integrar $t^{4}$. La cuenta es
              $2\cdot\frac{t^{5}}{5}$.
        pista: |
          $t = \sqrt{x+1}$, luego $x = t^{2}-1$ y $dx = 2t\,dt$.
        desarrollo: |
          $$
          t = \sqrt{x+1}
          \;\Longrightarrow\;
          x = t^{2}-1,\quad dx = 2t\,dt
          $$

          $$
          \int x\sqrt{x+1}\,dx = \int\left(t^{2}-1\right)t\cdot2t\,dt
          = 2\int\left(t^{4}-t^{2}\right)dt
          $$

          $$
          = 2\left(\frac{t^{5}}{5}-\frac{t^{3}}{3}\right)
          = \frac25(x+1)^{5/2}-\frac23(x+1)^{3/2}+C
          $$

          $$
          k = \frac25 = 0{,}4
          $$
        veredicto: |
          El cambio $t=\sqrt{\text{lo de dentro}}$ es el recurso estándar cuando
          hay **una sola** raíz de un binomio lineal. Racionaliza siempre.

      - tipo: calcular
        titulo: El apartado (e)
        pregunta: |
          $\int\frac{dx}{\sqrt{8-5x^{2}}} = k\arcsin\frac{x\sqrt{10}}{4}+C$.
          ¿Cuánto vale $k$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.4472'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '2.2360680'
            mensaje: |
              $\sqrt5$ es el inverso: hay que **dividir** entre $\sqrt5$ al
              sacarlo del radical, no multiplicar. $k = \frac{1}{\sqrt5}$.
          - valor: '1'
            mensaje: |
              1 olvida el coeficiente 5 del $x^{2}$. Si el radicando fuera
              $8-x^{2}$ el resultado sería un arcoseno limpio.
          - valor: '0.3535534'
            mensaje: |
              $\frac{1}{2\sqrt2}$ sale de sacar el 8 en vez del 5. Lo que hay que
              sacar factor común es el coeficiente de $x^{2}$.
        pista: |
          Saca el 5 fuera del radical:
          $\sqrt{8-5x^{2}} = \sqrt5\sqrt{\frac85-x^{2}}$.
        desarrollo: |
          $$
          \sqrt{8-5x^{2}} = \sqrt{5}\sqrt{\frac85-x^{2}}
          $$

          $$
          \int\frac{dx}{\sqrt{8-5x^{2}}}
          = \frac{1}{\sqrt5}\int\frac{dx}{\sqrt{\left(\sqrt{8/5}\right)^{2}
          -x^{2}}}
          = \frac{1}{\sqrt5}\arcsin\frac{x}{\sqrt{8/5}}
          $$

          Y como $\sqrt{\frac85} = \frac{2\sqrt{10}}{5}$:

          $$
          \frac{x}{\sqrt{8/5}} = \frac{5x}{2\sqrt{10}}
          = \frac{x\sqrt{10}}{4}
          $$

          $$
          \int = \frac{1}{\sqrt5}\arcsin\frac{x\sqrt{10}}{4}+C,
          \qquad k = \frac{1}{\sqrt5} \approx 0{,}4472
          $$
        veredicto: |
          Sacar factor común el coeficiente de $x^{2}$ es lo que devuelve la
          forma de tabla $\sqrt{a^{2}-x^{2}}$. Sin eso, la integral no se
          reconoce.

      - tipo: justificar
        pregunta: |
          Ordena los cambios y los siete resultados. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **La idea:** todo cambio busca lo mismo, **hacer desaparecer la
              raíz** y dejar una racional o una trigonométrica.
          - texto: |
              **Varias raíces del mismo $x$**, (a) y (c): $x = t^{m}$ con $m$ el
              **m.c.m.** de los índices. En (c) ni siquiera hace falta: basta
              sumar exponentes.
              (a) $= \frac43\left(x^{3/4}-\ln\left(x^{3/4}+1\right)\right)$.
              (c) $= \frac45x^{5/4}-\frac{24}{17}x^{17/12}+\frac43x^{3/4}$.
          - texto: |
              **Una raíz de un binomio lineal**, (b) y (d):
              $t = \sqrt{\text{radicando}}$.
              (b) $= \frac25(x+1)^{5/2}-\frac23(x+1)^{3/2}$.
              (d) $= 2\sqrt{x+4}+2\ln\left|\frac{\sqrt{x+4}-2}
              {\sqrt{x+4}+2}\right|$.
          - texto: |
              **Diferencia de cuadrados**, (e) y (g): dan arcoseno.
              (e) $= \frac{1}{\sqrt5}\arcsin\frac{x\sqrt{10}}{4}$.
              (g) $= \frac{x\sqrt{1-x^{2}}}{2}+\frac{\arcsin x}{2}$.
          - texto: |
              **Suma de cuadrados**, (f): da el argumento del seno hiperbólico.
              $= \frac{x\sqrt{1+x^{2}}}{2}+\frac{\mathrm{argsh}\,x}{2}$.
          - texto: |
              En (f) y (g) los resultados son iguales salvo el signo del
              radicando, porque las dos integrales son la misma con $x$ imaginaria.
            trampa: true
            mensaje: |
              Las estructuras se parecen, pero las funciones que aparecen son
              **distintas**: un arcoseno en (g) y un argumento del seno
              hiperbólico —es decir, un logaritmo— en (f). Y el paralelismo no
              es una razón: hay que hacer las dos. Invocar números imaginarios
              aquí no demuestra nada.
        veredicto: |
          Los siete cambios responden a tres situaciones: varias raíces del mismo
          $x$, una raíz de un binomio, y una raíz de una suma o diferencia de
          cuadrados. Reconocer cuál es cuál es la mitad del trabajo.

    resolucion: |
      **Datos.** Siete integrales con raíces.

      ### 1 · La estrategia común

      Todos los cambios de este bloque persiguen lo mismo: **quitar la raíz**.
      Lo que cambia es cómo, y hay tres situaciones:

      | qué aparece | cambio | deja |
      |---|---|---|
      | varias raíces de $x$ | $x = t^{m}$, $m$ = m.c.m. de índices | racional |
      | una raíz de $ax+b$ | $t = \sqrt{ax+b}$ | racional |
      | $\sqrt{a^{2}\pm x^{2}}$ | trigonométrico o hiperbólico | trigonométrica |

      ### 2 · (a) Varias raíces: el m.c.m.

      Los índices son 2 y 4, luego $x = t^{4}$, $dx = 4t^{3}dt$:

      $$
      \int\frac{t^{2}}{t^{3}+1}\cdot4t^{3}dt = 4\int\frac{t^{5}}{t^{3}+1}dt
      $$

      Grado 5 sobre grado 3: **hay que dividir**.

      $$
      \frac{t^{5}}{t^{3}+1} = t^{2}-\frac{t^{2}}{t^{3}+1}
      $$

      $$
      4\left[\frac{t^{3}}{3}-\frac13\ln\left|t^{3}+1\right|\right]
      = \frac43\left(t^{3}-\ln\left(t^{3}+1\right)\right)
      $$

      Y deshaciendo, $t^{3} = x^{3/4}$:

      $$
      \boxed{\frac43\left(x^{3/4}-\ln\left(x^{3/4}+1\right)\right)+C}
      $$

      ### 3 · (c) La que no necesita cambio

      Repartiendo el denominador y sumando exponentes:

      $$
      \frac{x^{1/2}-2x^{2/3}+1}{x^{1/4}}
      = x^{1/4}-2x^{5/12}+x^{-1/4}
      $$

      $$
      \int = \frac{x^{5/4}}{5/4}-2\cdot\frac{x^{17/12}}{17/12}
      +\frac{x^{3/4}}{3/4}
      $$

      $$
      \boxed{\frac45x^{5/4}-\frac{24}{17}x^{17/12}+\frac43x^{3/4}+C}
      $$

      **Antes de cambiar de variable, mirar si basta con reescribir.** Aquí sí.

      ### 4 · (b) y (d): raíz de un binomio lineal

      **(b)** $t = \sqrt{x+1}$, $x = t^{2}-1$, $dx = 2t\,dt$:

      $$
      2\int\left(t^{4}-t^{2}\right)dt
      = \boxed{\frac25(x+1)^{5/2}-\frac23(x+1)^{3/2}+C}
      $$

      **(d)** $t = \sqrt{x+4}$, $x = t^{2}-4$, $dx = 2t\,dt$:

      $$
      \int\frac{t}{t^{2}-4}\cdot2t\,dt = 2\int\frac{t^{2}}{t^{2}-4}dt
      $$

      Otra vez grados iguales: dividir.

      $$
      = 2\int\left(1+\frac{4}{t^{2}-4}\right)dt
      = 2t+8\cdot\frac14\ln\left|\frac{t-2}{t+2}\right|
      $$

      $$
      \boxed{2\sqrt{x+4}+2\ln\left|\frac{\sqrt{x+4}-2}{\sqrt{x+4}+2}\right|+C}
      $$

      ### 5 · (e): la forma de tabla del arcoseno

      $$
      \int\frac{dx}{\sqrt{a^{2}-x^{2}}} = \arcsin\frac xa
      $$

      Para llegar a esa forma hay que **sacar factor común el coeficiente de
      $x^{2}$**:

      $$
      \sqrt{8-5x^{2}} = \sqrt5\sqrt{\frac85-x^{2}}
      $$

      $$
      \int = \frac{1}{\sqrt5}\arcsin\frac{x}{\sqrt{8/5}}
      = \boxed{\frac{1}{\sqrt5}\arcsin\frac{x\sqrt{10}}{4}+C}
      $$

      ### 6 · (f) y (g): las dos hermanas

      **(g)** Con $x = \mathrm{sen}\,t$, $dx = \cos t\,dt$:

      $$
      \int\cos^{2}t\,dt = \frac t2+\frac{\mathrm{sen}\,2t}{4}
      = \frac{t}{2}+\frac{\mathrm{sen}\,t\cos t}{2}
      $$

      $$
      \boxed{\int\sqrt{1-x^{2}}\,dx
      = \frac{x\sqrt{1-x^{2}}}{2}+\frac{\arcsin x}{2}+C}
      $$

      **(f)** Con $x = \mathrm{senh}\,t$, porque
      $1+\mathrm{senh}^{2}t = \cosh^{2}t$:

      $$
      \int\cosh^{2}t\,dt = \frac t2+\frac{\mathrm{senh}\,t\cosh t}{2}
      $$

      $$
      \boxed{\int\sqrt{1+x^{2}}\,dx
      = \frac{x\sqrt{1+x^{2}}}{2}+\frac{\mathrm{argsh}\,x}{2}+C}
      $$

      La **estructura** es la misma, pero las funciones no: un arcoseno en un
      caso y un logaritmo disfrazado —$\mathrm{argsh}\,x
      = \ln\left(x+\sqrt{1+x^{2}}\right)$— en el otro.

      Y (f) es exactamente la integral que apareció en el ejercicio 5.19, el de
      la longitud de arco. No es casualidad: la longitud de arco de cualquier
      parábola acaba en $\sqrt{1+u^{2}}$.

      ### 7 · Comprobación

      **De (b):**

      $$
      \frac{d}{dx}\left[\frac25(x+1)^{5/2}-\frac23(x+1)^{3/2}\right]
      = (x+1)^{3/2}-(x+1)^{1/2}
      $$

      $$
      = \sqrt{x+1}\left[(x+1)-1\right] = x\sqrt{x+1} \quad\checkmark
      $$

      **De (g):**

      $$
      \frac{d}{dx}\left[\frac{x\sqrt{1-x^{2}}}{2}+\frac{\arcsin x}{2}\right]
      = \frac{\sqrt{1-x^{2}}}{2}-\frac{x^{2}}{2\sqrt{1-x^{2}}}
      +\frac{1}{2\sqrt{1-x^{2}}}
      $$

      $$
      = \frac{1-x^{2}-x^{2}+1}{2\sqrt{1-x^{2}}}
      = \frac{2-2x^{2}}{2\sqrt{1-x^{2}}} = \sqrt{1-x^{2}} \quad\checkmark
      $$

      **De (g), geométricamente:** entre $-1$ y 1 debe dar el área del
      semicírculo de radio 1, es decir $\frac{\pi}{2}$:

      $$
      \left[\frac{x\sqrt{1-x^{2}}}{2}+\frac{\arcsin x}{2}\right]_{-1}^{1}
      = \frac{\pi}{4}+\frac{\pi}{4} = \frac{\pi}{2} \quad\checkmark
      $$

  - id: integrales-trigonometricas
    titulo: Diez trigonométricas, y dos erratas del enunciado
    fuente: >-
      Ejercicio 5.27 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU ·
      El (i) cayó en 2018/2019 3E y el (j) en 2019/2020 3E · El boletín no
      publica solución; el desarrollo es nuestro · Dos de los diez enunciados
      llevan errata: en el (i) falta un coseno —tal como está escrito, la
      fracción se simplifica a una constante y el ejercicio se vuelve
      trivial— y en el (j) falta el argumento del primer seno. Los dos se
      reproducen tal cual y la resolución da las dos lecturas.
    nivel: practica
    enunciado: |
      Calcular las integrales de las siguientes funciones trigonométricas:

      **(a)** $\displaystyle\int\cos^{2}x\,dx$ ·
      **(b)** $\displaystyle\int\mathrm{sen}^{2}x\,dx$ ·
      **(c)** $\displaystyle\int\cos^{3}x\,dx$ ·
      **(d)** $\displaystyle\int\frac{\mathrm{sen}^{3}x\,dx}{2+\cos x}$ ·
      **(e)** $\displaystyle\int\frac{\mathrm{sen}\,x\,dx}
      {\cos x\left(1+\cos^{2}x\right)}$

      **(f)** $\displaystyle\int\frac{dx}{\tan^{2}x\left(1+3\cos^{2}x\right)}$ ·
      **(g)** $\displaystyle\int\mathrm{sen}^{2}x\cos^{2}x\,dx$ ·
      **(h)** $\displaystyle\int\mathrm{sen}^{2}x\cos^{5}x\,dx$ ·
      **(i)** $\displaystyle\int\frac{\mathrm{sen}^{2}x\,dx}
      {\mathrm{sen}^{2}x-4\,\mathrm{sen}^{2}x}$ (2018/2019 3E) ·
      **(j)** $\displaystyle\int\frac{dx}{\mathrm{sen}^{2}
      -5\,\mathrm{sen}\,x\cos x}$ (2019/2020 3E)
    pide: Calcular las diez primitivas.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué distingue a (c) y (h) de (a), (b) y (g)?
        opciones:
          - texto: >-
              En (c) y (h) hay un **exponente impar**, y eso permite separar un
              factor y hacer un cambio directo
            correcta: true
            mensaje: |
              Exacto. Con exponente impar se aparta un $\cos x\,dx$ —que es
              $d(\mathrm{sen}\,x)$— y el resto se convierte en potencias de
              $\mathrm{sen}\,x$ usando $\cos^{2} = 1-\mathrm{sen}^{2}$. Con
              todos los exponentes pares no hay factor que apartar y hay que
              bajar el grado con el ángulo doble.
          - texto: Que (c) y (h) son productos
            mensaje: |
              (g) también es un producto y tiene los dos exponentes pares. Lo que
              decide es la **paridad**.
          - texto: Que en (c) y (h) el resultado es racional
            mensaje: |
              Ninguno de los cinco da una función racional: todos dan senos y
              cosenos.
          - texto: Que (a), (b) y (g) necesitan el cambio de Weierstrass
            mensaje: |
              Ninguna de las tres lo necesita: basta con las fórmulas del ángulo
              doble, que son mucho más rápidas.

      - tipo: calcular
        titulo: El apartado (g)
        pregunta: |
          $\int\mathrm{sen}^{2}x\cos^{2}x\,dx
          = \frac x8-k\,\mathrm{sen}\,4x+C$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.03125'
          tolerancia: 0.0005
          formato: en forma exacta, o un número con cuatro decimales
        distractores:
          - valor: '0.125'
            mensaje: |
              $\frac18$ es el coeficiente de $x$, no el del seno. Al integrar
              $\mathrm{sen}^{2}2x$ aparece un $\frac{\mathrm{sen}\,4x}{4}$ que
              divide otra vez.
          - valor: '0.25'
            mensaje: |
              $\frac14$ es el factor que sale de
              $\mathrm{sen}\,x\cos x = \frac{\mathrm{sen}\,2x}{2}$ al elevarlo al
              cuadrado. Todavía queda integrar.
          - valor: '0.0625'
            mensaje: |
              $\frac{1}{16}$ es el doble del resultado: has dividido una vez
              menos. La cuenta es
              $\frac14\cdot\frac18 = \frac{1}{32}$.
        pista: |
          $\mathrm{sen}\,x\cos x = \frac{\mathrm{sen}\,2x}{2}$, y luego baja otra
          vez el grado.
        desarrollo: |
          **Primer paso**, ángulo doble:

          $$
          \mathrm{sen}^{2}x\cos^{2}x
          = \left(\mathrm{sen}\,x\cos x\right)^{2}
          = \left(\frac{\mathrm{sen}\,2x}{2}\right)^{2}
          = \frac{\mathrm{sen}^{2}2x}{4}
          $$

          **Segundo paso**, otra vez ángulo doble:

          $$
          \mathrm{sen}^{2}2x = \frac{1-\cos4x}{2}
          $$

          $$
          \int\frac{1-\cos4x}{8}dx
          = \frac x8-\frac{\mathrm{sen}\,4x}{32}
          $$

          $$
          k = \frac{1}{32} = 0{,}03125
          $$
        veredicto: |
          Dos aplicaciones del ángulo doble, y por eso aparece un $4x$: cada
          aplicación duplica la frecuencia.

      - tipo: calcular
        titulo: El apartado (h)
        pregunta: |
          En $\int\mathrm{sen}^{2}x\cos^{5}x\,dx$, el coeficiente de
          $\mathrm{sen}^{7}x$ vale $k$. ¿Cuánto es? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.1429'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '-0.4'
            mensaje: |
              $-\frac25$ es el coeficiente de $\mathrm{sen}^{5}x$, el término
              central. El de grado 7 es positivo.
          - valor: '0.3333333'
            mensaje: |
              $\frac13$ es el coeficiente de $\mathrm{sen}^{3}x$, el primer
              término.
          - valor: '0.2'
            mensaje: |
              $\frac15$ olvida el desarrollo completo de
              $\left(1-u^{2}\right)^{2}$: el último término da $u^{6}$, que al
              integrar produce $\frac{u^{7}}{7}$.
        pista: |
          Aparta un $\cos x\,dx$ y usa $\cos^{4}x
          = \left(1-\mathrm{sen}^{2}x\right)^{2}$.
        desarrollo: |
          El exponente del coseno es **impar**, así que se aparta un factor:

          $$
          \cos^{5}x\,dx = \cos^{4}x\cdot\cos x\,dx
          = \left(1-\mathrm{sen}^{2}x\right)^{2}d\left(\mathrm{sen}\,x\right)
          $$

          Con $u = \mathrm{sen}\,x$:

          $$
          \int u^{2}\left(1-u^{2}\right)^{2}du
          = \int u^{2}\left(1-2u^{2}+u^{4}\right)du
          $$

          $$
          = \int\left(u^{2}-2u^{4}+u^{6}\right)du
          = \frac{u^{3}}{3}-\frac{2u^{5}}{5}+\frac{u^{7}}{7}
          $$

          $$
          k = \frac17 \approx 0{,}1429
          $$
        veredicto: |
          Con exponente impar todo es mecánico. Con los dos pares —como en (g)—
          hay que bajar el grado, que es bastante más laborioso.

      - tipo: justificar
        pregunta: |
          Ordena la estrategia. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Exponente impar** en (c) y (h): apartar un factor y cambiar
              variable.
              (c) $= \mathrm{sen}\,x-\frac{\mathrm{sen}^{3}x}{3}$.
              (h) $= \frac{\mathrm{sen}^{3}x}{3}-\frac{2\,\mathrm{sen}^{5}x}{5}
              +\frac{\mathrm{sen}^{7}x}{7}$.
          - texto: |
              **Todos pares** en (a), (b) y (g): bajar el grado con
              $\cos^{2} = \frac{1+\cos2x}{2}$ y
              $\mathrm{sen}^{2} = \frac{1-\cos2x}{2}$.
              (a) $= \frac x2+\frac{\mathrm{sen}\,2x}{4}$; (b) el mismo con
              signo menos; (g) $= \frac x8-\frac{\mathrm{sen}\,4x}{32}$.
          - texto: |
              **Con seno impar y coseno en el denominador**, (d) y (e): el
              cambio $u=\cos x$ las convierte en racionales.
              (d) $= \frac{\cos^{2}x}{2}-2\cos x+3\ln(2+\cos x)$.
              (e) $= \ln\frac{\sqrt{1+\cos^{2}x}}{\left|\cos x\right|}$.
          - texto: |
              **Cuando solo hay potencias pares o productos $\mathrm{sen}\cos$**,
              (f), (i) y (j): el cambio $t=\tan x$ las racionaliza sin necesidad
              de Weierstrass.
          - texto: |
              (f) $= -\frac{1}{4\tan x}-\frac18\arctan\frac{\tan x}{2}$;
              (j) $= \frac15\ln\left|\frac{\tan x-5}{\tan x}\right|$.
          - texto: |
              En (a) y (b) conviene usar el cambio de Weierstrass
              $t = \tan\frac x2$, que sirve para cualquier trigonométrica.
            trampa: true
            mensaje: |
              Weierstrass **siempre** funciona, y por eso es tentador; pero
              produce racionales mucho más feas que las que salen bajando el
              grado. Es el último recurso, no el primero. Para $\cos^{2}x$ el
              ángulo doble resuelve en una línea.
        veredicto: |
          Weierstrass es la red de seguridad. Usarla de entrada convierte
          ejercicios de dos líneas en ejercicios de página y media.

    resolucion: |
      **Datos.** Diez integrales trigonométricas.

      ### 1 · El árbol de decisión

      | qué hay | qué hacer |
      |---|---|
      | algún exponente **impar** | apartar un factor y cambiar variable |
      | todos **pares** | bajar el grado con el ángulo doble |
      | solo pares o $\mathrm{sen}\,x\cos x$ | $t = \tan x$ |
      | nada de lo anterior | Weierstrass, $t = \tan\frac x2$ |

      Weierstrass es el último recurso: siempre funciona, y siempre produce la
      racional más fea.

      ### 2 · Los pares: bajar el grado

      $$
      \cos^{2}x = \frac{1+\cos2x}{2},
      \qquad
      \mathrm{sen}^{2}x = \frac{1-\cos2x}{2}
      $$

      **(a)** $\int\cos^{2}x\,dx = \frac x2+\frac{\mathrm{sen}\,2x}{4}+C$

      **(b)** $\int\mathrm{sen}^{2}x\,dx = \frac x2-\frac{\mathrm{sen}\,2x}{4}+C$

      **(g)** Dos aplicaciones:

      $$
      \mathrm{sen}^{2}x\cos^{2}x = \frac{\mathrm{sen}^{2}2x}{4}
      = \frac{1-\cos4x}{8}
      $$

      $$
      \int = \frac x8-\frac{\mathrm{sen}\,4x}{32}+C
      $$

      ### 3 · Los impares: apartar un factor

      **(c)** $\cos^{3}x\,dx = \left(1-\mathrm{sen}^{2}x\right)
      d\left(\mathrm{sen}\,x\right)$:

      $$
      \int\left(1-u^{2}\right)du
      = \mathrm{sen}\,x-\frac{\mathrm{sen}^{3}x}{3}+C
      $$

      **(h)** $\cos^{5}x\,dx = \left(1-\mathrm{sen}^{2}x\right)^{2}
      d\left(\mathrm{sen}\,x\right)$:

      $$
      \int u^{2}\left(1-2u^{2}+u^{4}\right)du
      = \frac{\mathrm{sen}^{3}x}{3}-\frac{2\,\mathrm{sen}^{5}x}{5}
      +\frac{\mathrm{sen}^{7}x}{7}+C
      $$

      ### 4 · Los que se vuelven racionales con $u=\cos x$

      **(d)** El seno tiene exponente impar, así que $u = \cos x$,
      $du = -\mathrm{sen}\,x\,dx$:

      $$
      \int\frac{\left(1-u^{2}\right)}{2+u}\left(-du\right)
      $$

      Dividiendo, $\frac{1-u^{2}}{2+u} = -u+2-\frac{3}{u+2}$:

      $$
      -\int\left(-u+2-\frac{3}{u+2}\right)du
      = \frac{u^{2}}{2}-2u+3\ln\left|u+2\right|
      $$

      $$
      \boxed{\frac{\cos^{2}x}{2}-2\cos x+3\ln\left(2+\cos x\right)+C}
      $$

      **(e)** Igual, con $u = \cos x$:

      $$
      -\int\frac{du}{u\left(1+u^{2}\right)}
      = -\int\left(\frac1u-\frac{u}{1+u^{2}}\right)du
      = -\ln\left|u\right|+\frac12\ln\left(1+u^{2}\right)
      $$

      $$
      \boxed{\ln\frac{\sqrt{1+\cos^{2}x}}{\left|\cos x\right|}+C}
      $$

      ### 5 · Los del cambio $t = \tan x$

      Con $t = \tan x$:

      $$
      \mathrm{sen}^{2}x = \frac{t^{2}}{1+t^{2}},
      \qquad
      \cos^{2}x = \frac{1}{1+t^{2}},
      \qquad
      \mathrm{sen}\,x\cos x = \frac{t}{1+t^{2}},
      \qquad
      dx = \frac{dt}{1+t^{2}}
      $$

      **(f)** El denominador se transforma en

      $$
      1+3\cos^{2}x = 1+\frac{3}{1+t^{2}} = \frac{t^{2}+4}{1+t^{2}}
      $$

      $$
      \int\frac{1+t^{2}}{t^{2}\left(t^{2}+4\right)}\cdot\frac{dt}{1+t^{2}}
      = \int\frac{dt}{t^{2}\left(t^{2}+4\right)}
      $$

      Descomponiendo, $\frac{1}{t^{2}(t^{2}+4)}
      = \frac{1}{4t^{2}}-\frac{1}{4\left(t^{2}+4\right)}$:

      $$
      \boxed{-\frac{1}{4\tan x}-\frac18\arctan\frac{\tan x}{2}+C}
      $$

      ### 6 · Los dos con errata

      **(i)** Tal como está escrito, el denominador es

      $$
      \mathrm{sen}^{2}x-4\,\mathrm{sen}^{2}x = -3\,\mathrm{sen}^{2}x
      $$

      y toda la fracción se simplifica a la **constante** $-\frac13$:

      $$
      \int-\frac13\,dx = -\frac{x}{3}+C
      $$

      Es una respuesta correcta para el enunciado literal, pero convierte en
      trivial un ejercicio que cayó en un examen. **Casi con seguridad falta un
      coseno**: el planteamiento habitual es

      $$
      \int\frac{\mathrm{sen}^{2}x\,dx}{\cos^{2}x-4\,\mathrm{sen}^{2}x}
      $$

      y con $t = \tan x$:

      $$
      \int\frac{t^{2}}{\left(1-4t^{2}\right)\left(1+t^{2}\right)}dt
      = \frac15\int\frac{dt}{1-4t^{2}}-\frac15\int\frac{dt}{1+t^{2}}
      $$

      $$
      = \frac{1}{20}\ln\left|\frac{1+2\tan x}{1-2\tan x}\right|
      -\frac{x}{5}+C
      $$

      **(j)** Aquí la errata es evidente: al primer $\mathrm{sen}^{2}$ le falta
      el argumento. Con $\mathrm{sen}^{2}x$:

      $$
      \int\frac{1+t^{2}}{t^{2}-5t}\cdot\frac{dt}{1+t^{2}}
      = \int\frac{dt}{t(t-5)}
      = \frac15\int\left(\frac{1}{t-5}-\frac1t\right)dt
      $$

      $$
      \boxed{\frac15\ln\left|\frac{\tan x-5}{\tan x}\right|+C}
      $$

      > **Nota sobre las dos erratas.** Los enunciados están reproducidos tal
      > cual aparecen en el boletín, como exige el criterio de este sitio. En
      > (i) el denominador escrito hace que la integral se reduzca a una
      > constante; en (j) falta el argumento del primer seno. Las dos versiones
      > —la literal y la razonable— están resueltas arriba, para que el alumno
      > reconozca la intención sin tener que adivinarla.

      ### 7 · Comprobación

      **De (c), derivando:**

      $$
      \frac{d}{dx}\left[\mathrm{sen}\,x-\frac{\mathrm{sen}^{3}x}{3}\right]
      = \cos x-\mathrm{sen}^{2}x\cos x
      = \cos x\left(1-\mathrm{sen}^{2}x\right) = \cos^{3}x \quad\checkmark
      $$

      **De (a) y (b), sumando:** las dos primitivas suman

      $$
      \left(\frac x2+\frac{\mathrm{sen}\,2x}{4}\right)
      +\left(\frac x2-\frac{\mathrm{sen}\,2x}{4}\right) = x
      $$

      y en efecto $\int\left(\cos^{2}x+\mathrm{sen}^{2}x\right)dx
      = \int1\,dx = x$ ✔ Una comprobación que valida las dos a la vez.

      **De (g), por un valor definido.** En $[0,\frac{\pi}{2}]$:

      $$
      \left[\frac x8-\frac{\mathrm{sen}\,4x}{32}\right]_0^{\pi/2}
      = \frac{\pi}{16}
      $$

      y $\mathrm{sen}^{2}x\cos^{2}x$ tiene valor medio $\frac18$ sobre un cuarto
      de periodo, luego $\frac18\cdot\frac{\pi}{2} = \frac{\pi}{16}$ ✔

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \text{(a)}\ & \tfrac x2+\tfrac{\mathrm{sen}\,2x}{4} \\
      \text{(b)}\ & \tfrac x2-\tfrac{\mathrm{sen}\,2x}{4} \\
      \text{(c)}\ & \mathrm{sen}\,x-\tfrac{\mathrm{sen}^{3}x}{3} \\
      \text{(d)}\ & \tfrac{\cos^{2}x}{2}-2\cos x+3\ln(2+\cos x) \\
      \text{(e)}\ & \ln\tfrac{\sqrt{1+\cos^{2}x}}{\left|\cos x\right|} \\
      \text{(f)}\ & -\tfrac{1}{4\tan x}-\tfrac18\arctan\tfrac{\tan x}{2} \\
      \text{(g)}\ & \tfrac x8-\tfrac{\mathrm{sen}\,4x}{32} \\
      \text{(h)}\ & \tfrac{\mathrm{sen}^{3}x}{3}
      -\tfrac{2\,\mathrm{sen}^{5}x}{5}+\tfrac{\mathrm{sen}^{7}x}{7} \\
      \text{(i)}\ & -\tfrac x3 \ \text{(literal)} \\
      \text{(j)}\ & \tfrac15\ln\left|\tfrac{\tan x-5}{\tan x}\right|
      \end{aligned}}
      $$

      (todas con $+C$)

  # ═══════════════════════════════════════════════════════════════════
  # Boletín básico del tema 5, «Integración. Problemas». Publica las
  # soluciones, y doce de ellas están mal: cada errata va declarada en su
  # resolución, comprobada derivando la primitiva impresa.
  # ═══════════════════════════════════════════════════════════════════

  - id: ocho-integrales-por-partes
    titulo: Ocho por partes, y tres resultados impresos que no cuadran
    fuente: >-
      Ejercicio 1 · Problemas, tema 5 · Cálculo, UPV/EHU · Tres de las ocho
      soluciones impresas no derivan al integrando: la (f) lleva un
      e^(-x) de más y le falta el signo, la (g) un x³ de más delante de la
      exponencial, y la (h) termina en -1/4 donde debería poner -x/4. Los
      tres valores corregidos están en la resolución, comprobados derivando.
    nivel: practica
    enunciado: |
      Calcular las siguientes integrales utilizando el método de integración
      por partes:

      (a) $\displaystyle\int x\ln x\,dx$ &nbsp;&nbsp;
      (b) $\displaystyle\int x^{2}\operatorname{sen}x\,dx$ &nbsp;&nbsp;
      (c) $\displaystyle\int \ln x\,dx$ &nbsp;&nbsp;
      (d) $\displaystyle\int \arctan x\,dx$

      (e) $\displaystyle\int \operatorname{arcsen}x\,dx$ &nbsp;&nbsp;
      (f) $\displaystyle\int \left(x^{2}-2x+5\right)e^{-x}\,dx$ &nbsp;&nbsp;
      (g) $\displaystyle\int x^{3}e^{-x/3}\,dx$ &nbsp;&nbsp;
      (h) $\displaystyle\int x\operatorname{sen}x\cos x\,dx$
    pide: Las ocho primitivas.
    pasos:
      - tipo: reconocer
        pregunta: |
          En (c), (d) y (e) el integrando es una sola función. ¿Qué se toma
          como $dv$?
        opciones:
          - texto: >-
              $dv = dx$, y $u$ la propia función: derivarla es lo que la
              simplifica
            correcta: true
            mensaje: |
              Eso es. El truco de $\int\ln x\,dx$ es multiplicar por $1$: con
              $u=\ln x$ y $dv=dx$ queda $x\ln x - \int x\cdot\tfrac1x\,dx$, y
              la integral que sobra es trivial. Vale igual para el arco
              tangente y el arco seno.
          - texto: >-
              No se puede aplicar por partes con un solo factor
            mensaje: |
              Siempre hay un segundo factor: el $1$. Y en estas tres funciones
              es justo lo que hace falta, porque sus derivadas son racionales o
              algebraicas.
          - texto: >-
              $dv$ igual a la función y $u=1$
            mensaje: |
              Entonces $du=0$ y habría que integrar $dv$, que es el problema
              original. Al revés: $u$ es la función que conviene **derivar**.

      - tipo: calcular
        titulo: El apartado (a), entre 1 y e
        pregunta: |
          Con $\displaystyle\int x\ln x\,dx = \tfrac{x^{2}}{2}\ln x - \tfrac{x^{2}}{4}$, ¿cuánto vale
          $\displaystyle\int_{1}^{e} x\ln x\,dx$?
        respuesta:
          tipo: numero
          valor: '2.097264'
          tolerancia: 0.002
          formato: con seis decimales
        distractores:
          - valor: '1.847264'
            mensaje: |
              $\tfrac{e^{2}}{4}$ olvida el término del extremo inferior: en
              $x=1$ la primitiva vale $-\tfrac14$, y restarlo suma $\tfrac14$.
          - valor: '3.694528'
            mensaje: |
              $\tfrac{e^{2}}{2}$ olvida restar $\tfrac{x^{2}}{4}$ en $x=e$. La
              primitiva completa en $e$ vale $\tfrac{e^{2}}{4}$.
        pista: |
          En $x=e$ la primitiva vale $\tfrac{e^{2}}{2}-\tfrac{e^{2}}{4} = \tfrac{e^{2}}{4}$, y en $x=1$ vale $-\tfrac14$.
        desarrollo: |
          $$
          \left[\frac{x^{2}}{2}\ln x-\frac{x^{2}}{4}\right]_{1}^{e}
          = \frac{e^{2}}{4} + \frac14 = \frac{e^{2}+1}{4}
          \approx 2{,}097264
          $$

      - tipo: calcular
        titulo: El apartado (h), entre 0 y π/2
        pregunta: |
          ¿Cuánto vale $\displaystyle\int_{0}^{\pi/2} x\operatorname{sen}x\cos x\,dx$?
        respuesta:
          tipo: numero
          valor: '0.392699'
          tolerancia: 0.002
          formato: con seis decimales
        distractores:
          - valor: '0.785398'
            mensaje: |
              $\tfrac\pi4$ es el doble. La integral es
              $\tfrac12\int x\operatorname{sen}2x\,dx$, y ese $\tfrac12$ hay
              que arrastrarlo.
          - valor: '1.570796'
            mensaje: |
              $\tfrac\pi2$ es la longitud del intervalo, no la integral.
        pista: |
          $\operatorname{sen}x\cos x=\tfrac12\operatorname{sen}2x$, y la
          primitiva es $-\tfrac{x\cos 2x}{4}+\tfrac{\operatorname{sen}2x}{8}$.
        desarrollo: |
          $$
          \left[-\frac{x\cos 2x}{4}+\frac{\operatorname{sen}2x}{8}
          \right]_{0}^{\pi/2}
          = \frac{\pi}{8} \approx 0{,}392699
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento sobre las erratas. Una pieza es falsa.
        piezas:
          - texto: >-
              Toda primitiva se audita derivándola: si la derivada no es el
              integrando, el resultado está mal.
          - texto: >-
              El (f) impreso lleva $e^{-x}$ dos veces y le falta el signo
              menos: la primitiva correcta es
              $-e^{-x}\left(x^{2}+5\right)$.
          - texto: >-
              El (g) impreso lleva un $x^{3}$ de más delante de la
              exponencial: lo correcto es
              $-3e^{-x/3}\left(x^{3}+9x^{2}+54x+162\right)$.
          - texto: >-
              Y el (h) impreso termina en $-\tfrac14$, que al ser constante da
              igual: la primitiva es correcta.
            trampa: true
            mensaje: |
              Precisamente por ser constante **no puede estar ahí**: si se
              quita, la derivada sigue sin dar el integrando. Lo que debería
              poner es $-\tfrac{x}{4}$, que sí deriva. Derivando lo impreso
              sale $x\operatorname{sen}x\cos x+\tfrac14$: sobra un cuarto.
        veredicto: |
          Derivar la primitiva es la comprobación que cierra cualquier
          integral, y cuesta menos que calcularla. Aquí ha destapado tres
          resultados impresos que no derivan al integrando.
    resolucion: |
      **Las ocho.**

      | ap. | primitiva |
      |---|---|
      | (a) | $\tfrac{x^{2}}{2}\ln x-\tfrac{x^{2}}{4}$ |
      | (b) | $-x^{2}\cos x+2x\operatorname{sen}x+2\cos x$ |
      | (c) | $x\ln x-x$ |
      | (d) | $x\arctan x-\tfrac12\ln\left(1+x^{2}\right)$ |
      | (e) | $x\operatorname{arcsen}x+\sqrt{1-x^{2}}$ |
      | (f) | $-e^{-x}\left(x^{2}+5\right)$ |
      | (g) | $-3e^{-x/3}\left(x^{3}+9x^{2}+54x+162\right)$ |
      | (h) | $\tfrac12 x\operatorname{sen}^{2}x +\tfrac18\operatorname{sen}2x-\tfrac{x}{4}$ |

      ### 1 · La regla de elección

      $$
      \int u\,dv = uv - \int v\,du
      $$

      $u$ es lo que conviene **derivar**; $dv$, lo que se sabe integrar. El
      orden habitual, de mejor a peor candidato a $u$: logaritmos, arcos,
      polinomios, exponenciales, senos y cosenos.

      - **(a), (b), (g)**: $u$ polinomio o logaritmo, y se repite por partes
        hasta que el polinomio desaparece.
      - **(c), (d), (e)**: $dv=dx$ — el truco de multiplicar por $1$.
      - **(f), (g)**: hay un atajo, más abajo.
      - **(h)**: antes de nada, $\operatorname{sen}x\cos x = \tfrac12\operatorname{sen}2x$.

      ### 2 · El atajo para polinomio por exponencial

      $$
      \int P(x)e^{ax}\,dx
      = e^{ax}\left(\frac{P}{a}-\frac{P'}{a^{2}}+\frac{P''}{a^{3}}
      -\dots\right)
      $$

      **(f)** con $a=-1$ y $P=x^{2}-2x+5$:

      $$
      -e^{-x}\left(P+P'+P''\right)
      = -e^{-x}\left(x^{2}-2x+5+2x-2+2\right)
      = -e^{-x}\left(x^{2}+5\right)
      $$

      **(g)** con $a=-\tfrac13$ y $P=x^{3}$, donde
      $\tfrac1a=-3$, $\tfrac1{a^{2}}=9$, $\tfrac1{a^{3}}=-27$,
      $\tfrac1{a^{4}}=81$:

      $$
      e^{-x/3}\left(-3x^{3}-27x^{2}-162x-486\right)
      = -3e^{-x/3}\left(x^{3}+9x^{2}+54x+162\right)
      $$

      ### 3 · Las tres erratas del boletín

      | ap. | lo impreso | lo que sale |
      |---|---|---|
      | (f) | $e^{-x}\left(x^{2}+5\right)e^{-x}$ | $-e^{-x}\left(x^{2}+5\right)$ |
      | (g) | $-3x^{3}e^{-x/3}\left(x^{3}+9x^{2}+54x+162\right)$ | sin el $x^{3}$ de delante |
      | (h) | $\dots-\tfrac14$ | $\dots-\tfrac{x}{4}$ |

      Las tres comprobadas derivando: la primitiva impresa de (f) da
      $-4{,}28$ en $x=0{,}4$ donde el integrando vale $2{,}92$; la de (g) se
      dispara a $-4188$ en $x=1{,}7$ frente a $2{,}79$; y la de (h) da
      $x\operatorname{sen}x\cos x+\tfrac14$, con un cuarto de sobra.

      ### 4 · El (h), por si se prefiere la otra forma

      $$
      \int x\operatorname{sen}x\cos x\,dx
      = \frac12\int x\operatorname{sen}2x\,dx
      = -\frac{x\cos 2x}{4}+\frac{\operatorname{sen}2x}{8}
      $$

      que es la misma primitiva del cuadro: basta usar
      $\operatorname{sen}^{2}x=\tfrac{1-\cos 2x}{2}$ para pasar de una a otra.

      **Lo que hay que llevarse.** Por partes se elige $u$ por lo que se
      simplifica al derivar, y para polinomio por exponencial la fórmula
      alterna evita repetir el proceso. Y sobre todo: **derivar el resultado**,
      que aquí caza tres erratas seguidas.

  - id: seis-integrales-racionales
    titulo: Seis racionales, una por cada tipo de denominador
    fuente: Ejercicio 2 · Problemas, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular las integrales de las siguientes funciones racionales:

      (a) $\displaystyle\int\frac{dx}{\left(x-1\right)\left(x+2\right) \left(x+3\right)}$ &nbsp;&nbsp;
      (b) $\displaystyle\int\frac{dx}{x^{3}+1}$

      (c) $\displaystyle\int\frac{x^{2}+2}{\left(x+1\right)^{3} \left(x-2\right)}\,dx$ &nbsp;&nbsp;
      (d) $\displaystyle\int\frac{x^{2}+3}{x^{2}-1}\,dx$

      (e) $\displaystyle\int\frac{x^{2}}{x^{2}+2x+5}\,dx$ &nbsp;&nbsp;
      (f) $\displaystyle\int\frac{x+2}{x^{2}+2x+2}\,dx$
    pide: Las seis primitivas.
    pasos:
      - tipo: reconocer
        pregunta: |
          En (d) y (e) el numerador tiene el mismo grado que el denominador.
          ¿Qué hay que hacer primero?
        opciones:
          - texto: >-
              Dividir: sale una constante más una fracción propia, y solo esa
              se descompone
            correcta: true
            mensaje: |
              Eso es. La descomposición en fracciones simples **exige** que el
              grado del numerador sea menor. Saltarse la división es el error
              más común de todo el tema.
          - texto: >-
              Descomponer directamente en fracciones simples
            mensaje: |
              No funciona: el sistema de coeficientes sale incompatible. Antes
              hay que dividir hasta que el resto tenga grado menor.
          - texto: >-
              Completar cuadrados en el numerador
            mensaje: |
              Completar cuadrados sirve para el **denominador** irreducible de
              segundo grado. El grado del numerador se arregla dividiendo.

      - tipo: calcular
        titulo: El apartado (e), entre 0 y 1
        pregunta: |
          ¿Cuánto vale $\displaystyle\int_{0}^{1} \frac{x^{2}}{x^{2}+2x+5}\,dx$?
        respuesta:
          tipo: numero
          valor: '0.047370'
          tolerancia: 0.0006
          formato: con seis decimales
        distractores:
          - valor: '0.333333'
            mensaje: |
              $\tfrac13$ sería $\int_{0}^{1}x^{2}dx$: has olvidado el
              denominador, que en ese intervalo vale entre $5$ y $8$.
          - valor: '0.200000'
            mensaje: |
              $0{,}2$ sería $\tfrac{1}{5}$, el valor del integrando si el
              numerador fuese $1$. Aquí el numerador es $x^{2}$, que en casi
              todo el intervalo es pequeño.
        pista: |
          La primitiva es $x-\ln\left(x^{2}+2x+5\right) -\tfrac32\arctan\tfrac{x+1}{2}$; evalúala en $1$ y en $0$.
        desarrollo: |
          $$
          \left[x-\ln\left(x^{2}+2x+5\right)
          -\frac32\arctan\frac{x+1}{2}\right]_{0}^{1}
          \approx 0{,}047370
          $$

          El número es pequeño porque en $\left[0,1\right]$ el numerador va de
          $0$ a $1$ y el denominador de $5$ a $8$.

      - tipo: calcular
        titulo: El apartado (f), entre 0 y 1
        pregunta: |
          ¿Cuánto vale $\displaystyle\int_{0}^{1} \frac{x+2}{x^{2}+2x+2}\,dx$?
        respuesta:
          tipo: numero
          valor: '0.779896'
          tolerancia: 0.002
          formato: con seis decimales
        distractores:
          - valor: '0.549306'
            mensaje: |
              $\tfrac12\ln 5 - \tfrac12\ln 2$ es solo la parte logarítmica.
              Falta el arco tangente, que aporta unas dos décimas.
          - valor: '0.230582'
            mensaje: |
              Esa es solo la parte del arco tangente,
              $\arctan 2-\arctan 1$. Falta el logaritmo.
        pista: |
          La primitiva es $\tfrac12\ln\left(x^{2}+2x+2\right) +\arctan\left(x+1\right)$.
        desarrollo: |
          $$
          \left[\frac12\ln\left(x^{2}+2x+2\right)+\arctan\left(x+1\right)
          \right]_{0}^{1}
          = \frac12\ln\frac52 + \arctan 2 - \frac\pi4
          \approx 0{,}779896
          $$

      - tipo: justificar
        pregunta: Ordena el método. Una pieza es falsa.
        piezas:
          - texto: >-
              Primero, si el grado del numerador no es menor, **dividir**.
          - texto: >-
              Después, factorizar el denominador: raíces simples, múltiples y
              factores de segundo grado irreducibles.
          - texto: >-
              Cada factor irreducible $x^{2}+bx+c$ aporta un término
              $\tfrac{Ax+B}{x^{2}+bx+c}$, que se parte en un logaritmo más un
              arco tangente completando cuadrados.
          - texto: >-
              Y una raíz triple como la de (c) aporta un solo término
              $\tfrac{A}{\left(x+1\right)^{3}}$.
            trampa: true
            mensaje: |
              Aporta **tres**: $\tfrac{A}{x+1}+\tfrac{B}{\left(x+1\right)^{2}} +\tfrac{C}{\left(x+1\right)^{3}}$. Con uno solo el sistema no
              tiene solución. Una raíz de multiplicidad $m$ pide $m$ términos,
              con todas las potencias de $1$ a $m$.
        veredicto: |
          El método tiene un orden fijo: dividir, factorizar, escribir tantos
          términos como pide cada multiplicidad, y resolver el sistema. Los
          factores irreducibles son los únicos que producen arcos tangentes.
    resolucion: |
      **Las seis.**

      | ap. | primitiva |
      |---|---|
      | (a) | $\tfrac1{12}\ln\lvert x-1\rvert-\tfrac13\ln\lvert x+2\rvert+\tfrac14\ln\lvert x+3\rvert$ |
      | (b) | $\tfrac13\ln\lvert x+1\rvert-\tfrac16\ln\left(x^{2}-x+1\right)+\tfrac{\sqrt3}{3}\arctan\tfrac{2x-1}{\sqrt3}$ |
      | (c) | $\tfrac29\ln\left\lvert\tfrac{x-2}{x+1}\right\rvert-\tfrac13\tfrac1{x+1}+\tfrac12\tfrac1{\left(x+1\right)^{2}}$ |
      | (d) | $x+2\ln\left\lvert\tfrac{x-1}{x+1}\right\rvert$ |
      | (e) | $x-\ln\left(x^{2}+2x+5\right)-\tfrac32\arctan\tfrac{x+1}{2}$ |
      | (f) | $\tfrac12\ln\left(x^{2}+2x+2\right)+\arctan\left(x+1\right)$ |

      **Las seis derivan al integrando**: este ejercicio del boletín no tiene
      ninguna errata.

      ### 1 · Los cuatro casos, uno por apartado

      | ap. | denominador | qué aporta |
      |---|---|---|
      | (a) | tres raíces simples | tres logaritmos |
      | (b) | $\left(x+1\right)\left(x^{2}-x+1\right)$ | logaritmo + logaritmo y arco tangente |
      | (c) | raíz triple y raíz simple | tres términos del triple + uno |
      | (d) | grados iguales | división previa, después dos logaritmos |
      | (e) | irreducible, grados iguales | división previa, logaritmo y arco tangente |
      | (f) | irreducible | logaritmo y arco tangente |

      ### 2 · El patrón del factor irreducible

      Con $x^{2}+2x+2=\left(x+1\right)^{2}+1$ y el numerador $x+2$, se parte
      en «media derivada del denominador» más «resto»:

      $$
      x+2 = \frac12\left(2x+2\right) + 1
      $$

      $$
      \int\frac{x+2}{x^{2}+2x+2}\,dx
      = \frac12\ln\left(x^{2}+2x+2\right)
      + \int\frac{dx}{\left(x+1\right)^{2}+1}
      $$

      y la segunda es directamente $\arctan\left(x+1\right)$. **Ese es el
      patrón**, y funciona igual en (b) y en (e).

      ### 3 · Las dos divisiones previas

      $$
      \frac{x^{2}+3}{x^{2}-1} = 1 + \frac{4}{x^{2}-1}
      \qquad
      \frac{x^{2}}{x^{2}+2x+5} = 1 - \frac{2x+5}{x^{2}+2x+5}
      $$

      De ahí el $x$ suelto que aparece al principio de las primitivas (d) y
      (e): es la integral del $1$.

      ### 4 · La raíz triple del (c)

      $$
      \frac{x^{2}+2}{\left(x+1\right)^{3}\left(x-2\right)}
      = \frac{A}{x+1}+\frac{B}{\left(x+1\right)^{2}}
      +\frac{C}{\left(x+1\right)^{3}}+\frac{D}{x-2}
      $$

      Cuatro incógnitas para un denominador de grado cuatro. Con
      $x=-1$ sale $C=-1$; con $x=2$, $D=\tfrac29$; y los otros dos, igualando
      coeficientes: $A=-\tfrac29$, $B=\tfrac13$.

      **Lo que hay que llevarse.** El método no se improvisa: dividir si hace
      falta, factorizar, poner **tantos términos como pide cada
      multiplicidad**, y resolver. Los arcos tangentes salen solo de los
      factores de segundo grado sin raíces reales.

  - id: cinco-integrales-trigonometricas
    titulo: Cinco trigonométricas, y dos resultados impresos con un término de más o de menos
    fuente: >-
      Ejercicio 3 · Problemas, tema 5 · Cálculo, UPV/EHU · Dos de las cinco
      soluciones impresas llevan errata dentro de un arco tangente: a la (b)
      le sobra un «+1» y a la (e) le falta un factor raíz de tres. Las dos
      comprobadas derivando, y corregidas en la resolución.
    nivel: practica
    enunciado: |
      Calcular las integrales de las siguientes funciones trigonométricas:

      (a) $\displaystyle\int\frac{\operatorname{sen}x} {\cos x\left(1+\cos^{2}x\right)}\,dx$ &nbsp;&nbsp;
      (b) $\displaystyle\int\frac{dx}{\tan^{2}x \left(1+3\cos^{2}x\right)}$

      (c) $\displaystyle\int\operatorname{sen}^{2}x\cos^{2}x\,dx$
      &nbsp;&nbsp;
      (d) $\displaystyle\int\operatorname{sen}^{2}x\cos^{5}x\,dx$
      &nbsp;&nbsp;
      (e) $\displaystyle\int\frac{dx}{2-\cos x}$
    pide: Las cinco primitivas.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué cambio conviene en cada uno? Fíjate en las paridades.
        opciones:
          - texto: >-
              $t=\cos x$ en (a) y $t=\operatorname{sen}x$ en (d), porque el
              integrando es impar en el seno y en el coseno respectivamente;
              $t=\tan x$ en (b); ángulo doble en (c); y Weierstrass en (e)
            correcta: true
            mensaje: |
              Exacto, y ese es el orden de preferencia: primero las paridades,
              después $t=\tan x$, y **Weierstrass en último lugar**, porque es
              el que más ensucia.
          - texto: >-
              Weierstrass en los cinco
            mensaje: |
              Funciona siempre, pero convierte (c) y (d) en racionales
              horribles. El cambio universal es el último recurso, no el
              primero.
          - texto: >-
              $t=\operatorname{sen}x$ en todos
            mensaje: |
              En (a) el integrando es impar en el **seno**, así que el cambio
              bueno es $t=\cos x$. Poner siempre el mismo cambio deja
              integrales que no se simplifican.

      - tipo: calcular
        titulo: El apartado (d), entre 0 y π/2
        pregunta: |
          ¿Cuánto vale $\displaystyle\int_{0}^{\pi/2} \operatorname{sen}^{2}x\cos^{5}x\,dx$?
        respuesta:
          tipo: numero
          valor: '0.076190'
          tolerancia: 0.0006
          formato: con seis decimales
        distractores:
          - valor: '0.196350'
            mensaje: |
              $\tfrac{\pi}{16}$ es el valor del apartado (c) en ese mismo
              intervalo. Con la quinta potencia del coseno el resultado es
              bastante menor.
          - valor: '0.333333'
            mensaje: |
              $\tfrac13$ sería solo el primer término,
              $\tfrac{\operatorname{sen}^{3}x}{3}$, olvidando los otros dos.
        pista: |
          $\tfrac13-\tfrac25+\tfrac17 = \tfrac{8}{105}$.
        desarrollo: |
          $$
          \left[\frac{\operatorname{sen}^{3}x}{3}
          -\frac25\operatorname{sen}^{5}x
          +\frac17\operatorname{sen}^{7}x\right]_{0}^{\pi/2}
          = \frac13-\frac25+\frac17 = \frac{8}{105} \approx 0{,}076190
          $$

      - tipo: calcular
        titulo: El apartado (e), entre 0 y π/2
        pregunta: |
          Con la primitiva correcta, ¿cuánto vale
          $\displaystyle\int_{0}^{\pi/2}\frac{dx}{2-\cos x}$?
        respuesta:
          tipo: numero
          valor: '1.209200'
          tolerancia: 0.002
          formato: con seis decimales
        distractores:
          - valor: '0.906900'
            mensaje: |
              $\tfrac{\pi}{2\sqrt3}$ es lo que da la primitiva **impresa**,
              a la que le falta el $\sqrt3$ dentro del arco tangente.
          - valor: '1.570796'
            mensaje: |
              $\tfrac\pi2$ sería la integral si el integrando valiese $1$. Aquí
              vale entre $1$ y $\tfrac12$.
        pista: |
          La primitiva es $\tfrac{2}{\sqrt3} \arctan\left(\sqrt3\tan\tfrac{x}{2}\right)$, y en $x=\tfrac\pi2$ el
          arco tangente vale $\tfrac\pi3$.
        desarrollo: |
          $$
          \left[\frac{2}{\sqrt3}\arctan\left(\sqrt3\tan\frac{x}{2}\right)
          \right]_{0}^{\pi/2}
          = \frac{2}{\sqrt3}\cdot\frac{\pi}{3}
          = \frac{2\pi}{3\sqrt3} \approx 1{,}209200
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $t=\tan\tfrac{x}{2}$ —Weierstrass—,
              $\cos x=\tfrac{1-t^{2}}{1+t^{2}}$ y
              $dx=\tfrac{2\,dt}{1+t^{2}}$.
          - texto: >-
              En (e) queda $2\displaystyle\int\frac{dt}{1+3t^{2}}$, cuya
              primitiva es $\tfrac{2}{\sqrt3}\arctan\left(\sqrt3\,t\right)$.
          - texto: >-
              El boletín imprime $\tfrac{2}{\sqrt3}\arctan\left(\tan \tfrac{x}{2}\right)$: le falta el $\sqrt3$ de dentro.
          - texto: >-
              Y como el $\sqrt3$ que falta está dentro del arco tangente, el
              error es solo una constante y la primitiva sigue valiendo.
            trampa: true
            mensaje: |
              Una constante **multiplicando el argumento** de un arco tangente
              no es una constante aditiva: cambia la función entera. Derivando
              lo impreso sale $\tfrac{1}{\sqrt3}$ constante, que no se parece
              al integrando. Solo las constantes **sumadas** son irrelevantes.
        veredicto: |
          En un arco tangente, el factor de dentro y el de fuera están atados:
          $\int\tfrac{dt}{1+a^{2}t^{2}}=\tfrac1a\arctan\left(at\right)$.
          Perder uno de los dos rompe la primitiva.
    resolucion: |
      **Las cinco.**

      | ap. | primitiva |
      |---|---|
      | (a) | $-\ln\lvert\cos x\rvert+\ln\sqrt{1+\cos^{2}x}$ |
      | (b) | $-\tfrac{1}{4\tan x}-\tfrac18\arctan\tfrac{\tan x}{2}$ |
      | (c) | $\tfrac18\left(x-\tfrac{\operatorname{sen}4x}{4}\right)$ |
      | (d) | $\tfrac{\operatorname{sen}^{3}x}{3}-\tfrac25\operatorname{sen}^{5}x+\tfrac17\operatorname{sen}^{7}x$ |
      | (e) | $\tfrac{2}{\sqrt3}\arctan\left(\sqrt3\tan\tfrac{x}{2}\right)$ |

      ### 1 · Qué cambio pide cada uno

      | ap. | paridad del integrando | cambio |
      |---|---|---|
      | (a) | impar en $\operatorname{sen}x$ | $t=\cos x$ |
      | (b) | par en los dos | $t=\tan x$ |
      | (c) | par en los dos | ángulo doble |
      | (d) | impar en $\cos x$ | $t=\operatorname{sen}x$ |
      | (e) | ninguna | Weierstrass $t=\tan\tfrac{x}{2}$ |

      La regla: si es impar en el seno, $t=\cos x$; si es impar en el coseno,
      $t=\operatorname{sen}x$; si es par en los dos, $t=\tan x$; y si no hay
      paridad, Weierstrass.

      ### 2 · El (b), con $t=\tan x$

      Con $\cos^{2}x=\tfrac{1}{1+t^{2}}$ y $dx=\tfrac{dt}{1+t^{2}}$:

      $$
      1+3\cos^{2}x = \frac{t^{2}+4}{1+t^{2}}
      \quad\Longrightarrow\quad
      \int\frac{dt}{t^{2}\left(t^{2}+4\right)}
      $$

      y en fracciones simples,
      $\tfrac{1}{t^{2}\left(t^{2}+4\right)} = \tfrac{1}{4t^{2}}-\tfrac{1}{4\left(t^{2}+4\right)}$:

      $$
      -\frac{1}{4t}-\frac18\arctan\frac{t}{2}
      $$

      ### 3 · Las dos erratas

      | ap. | lo impreso | lo que sale |
      |---|---|---|
      | (b) | $\arctan\left(\tfrac{\tan x}{2}+1\right)$ | $\arctan\tfrac{\tan x}{2}$ — sobra el $+1$ |
      | (e) | $\arctan\left(\tan\tfrac{x}{2}\right)$ | $\arctan\left(\sqrt3\tan\tfrac{x}{2}\right)$ — falta el $\sqrt3$ |

      Las dos comprobadas derivando. La de (b) da $0{,}17$ en $x=1{,}3$ donde
      el integrando vale $0{,}063$; la de (e) da la constante
      $\tfrac{1}{\sqrt3}$ en lugar del integrando.

      ### 4 · El (c), y por qué el (d) es más corto

      **(c)** $\operatorname{sen}x\cos x=\tfrac12\operatorname{sen}2x$, así
      que el integrando es
      $\tfrac14\operatorname{sen}^{2}2x=\tfrac{1-\cos 4x}{8}$, e integrar es
      inmediato.

      **(d)** Con potencia **impar** del coseno se aparta un coseno para el
      diferencial:

      $$
      \operatorname{sen}^{2}x\cos^{4}x\cdot\cos x\,dx
      = t^{2}\left(1-t^{2}\right)^{2}dt,\qquad t=\operatorname{sen}x
      $$

      y queda un polinomio. **La paridad decide qué método es corto**: por eso
      (d) sale en tres líneas y (c) necesita el ángulo doble.

      **Lo que hay que llevarse.** Mirar la paridad antes de elegir el cambio
      ahorra la mitad del trabajo, y Weierstrass es el último recurso. Y al
      terminar, derivar: aquí destapa que a dos de las cinco soluciones
      impresas les sobra o les falta algo dentro de un arco tangente.

  - id: cinco-integrales-irracionales
    titulo: Cinco irracionales, y el radical que se lee mal
    fuente: >-
      Ejercicio 4 · Problemas, tema 5 · Cálculo, UPV/EHU · El radical del
      apartado (d) se puede leer como raíz de cinco partido por ocho, y el
      número que deriva al integrando es la raíz de cinco octavos. La
      resolución lo explica y da los dos valores.
    nivel: practica
    enunciado: |
      Calcular las integrales de las siguientes funciones irracionales:

      (a) $\displaystyle\int x\sqrt{x+1}\,dx$ &nbsp;&nbsp;
      (b) $\displaystyle\int\frac{\sqrt{x}-2\sqrt[3]{x^{2}}+1} {\sqrt[4]{x}}\,dx$ &nbsp;&nbsp;
      (c) $\displaystyle\int\frac{\sqrt{x+4}}{x}\,dx$

      (d) $\displaystyle\int\frac{dx}{\sqrt{8-5x^{2}}}$ &nbsp;&nbsp;
      (e) $\displaystyle\int\sqrt{2+x^{2}}\,dx$
    pide: Las cinco primitivas.
    pasos:
      - tipo: reconocer
        pregunta: |
          En (b) aparecen raíces de índices $2$, $3$ y $4$. ¿Qué cambio las
          arregla todas a la vez?
        opciones:
          - texto: >-
              Ninguno hace falta: se escriben como potencias y se integra
              término a término
            correcta: true
            mensaje: |
              Eso es. $\tfrac{x^{1/2}-2x^{2/3}+1}{x^{1/4}} = x^{1/4}-2x^{5/12}+x^{-1/4}$, y cada sumando es una potencia.
              El cambio $x=t^{12}$ también funciona, pero aquí es innecesario.
          - texto: >-
              $x=t^{12}$, el mínimo común múltiplo de los índices
            mensaje: |
              Es el cambio general para radicales de $x$ con varios índices, y
              funciona. Pero aquí no hace falta: dividir la potencia ya deja
              tres monomios.
          - texto: >-
              $x=t^{9}$
            mensaje: |
              $9$ no es múltiplo de $2$ ni de $4$. Si se quiere el cambio, el
              exponente ha de ser el mínimo común múltiplo de $2$, $3$ y $4$,
              que es $12$.

      - tipo: calcular
        titulo: El apartado (a), entre 0 y 3
        pregunta: |
          ¿Cuánto vale $\displaystyle\int_{0}^{3}x\sqrt{x+1}\,dx$?
        respuesta:
          tipo: numero
          valor: '7.733333'
          tolerancia: 0.002
          formato: con seis decimales
        distractores:
          - valor: '9.066667'
            mensaje: |
              $\tfrac{136}{15}$ olvida restar el valor en $x=0$, que es
              $2\left(\tfrac15-\tfrac13\right)=-\tfrac4{15}$.
          - valor: '6.400000'
            mensaje: |
              $\tfrac{32}{5}$ es solo el primer término en $x=3$. Falta
              restarle $\tfrac{2\cdot8}{3}$ y ajustar el extremo inferior.
        pista: |
          Con $t=x+1$: $\int\left(t^{3/2}-t^{1/2}\right)dt$, y la primitiva es
          $2\left(\tfrac{\left(x+1\right)^{5/2}}{5} -\tfrac{\left(x+1\right)^{3/2}}{3}\right)$.
        desarrollo: |
          $$
          2\left[\frac{\left(x+1\right)^{5/2}}{5}
          -\frac{\left(x+1\right)^{3/2}}{3}\right]_{0}^{3}
          = 2\left(\frac{32}{5}-\frac83\right)-2\left(\frac15-\frac13\right)
          = \frac{116}{15} \approx 7{,}733333
          $$

      - tipo: calcular
        titulo: El apartado (d), entre 0 y 1
        pregunta: |
          Con el radical bien leído, ¿cuánto vale
          $\displaystyle\int_{0}^{1}\frac{dx}{\sqrt{8-5x^{2}}}$?
        respuesta:
          tipo: numero
          valor: '0.407742'
          tolerancia: 0.0008
          formato: con seis decimales
        distractores:
          - valor: '0.126188'
            mensaje: |
              Eso es lo que da la lectura equivocada, con
              $\tfrac{\sqrt5}{8}$ dentro del arco seno en vez de
              $\sqrt{\tfrac58}$.
          - valor: '0.353553'
            mensaje: |
              $\tfrac{1}{2\sqrt2}$ es el valor del **integrando** en $x=0$, no
              de la integral. En el intervalo el integrando crece hasta
              $0{,}577$.
        pista: |
          La primitiva es $\tfrac{1}{\sqrt5} \operatorname{arcsen}\left(\sqrt{\tfrac58}\,x\right)$, y
          $\sqrt{\tfrac58}=\tfrac{\sqrt{10}}{4}\approx0{,}7906$.
        desarrollo: |
          $$
          \frac{1}{\sqrt5}\operatorname{arcsen}\sqrt{\frac58}
          \approx \frac{0{,}911738}{2{,}236068} \approx 0{,}407742
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              En (d) se saca el $5$ del radical:
              $\sqrt{8-5x^{2}}=\sqrt5\sqrt{\tfrac85-x^{2}}$.
          - texto: >-
              Y $\int\tfrac{dx}{\sqrt{a^{2}-x^{2}}} = \operatorname{arcsen}\tfrac{x}{a}$ con
              $a=\sqrt{\tfrac85}$, así que sale
              $\tfrac{1}{\sqrt5}\operatorname{arcsen}\left(x\sqrt{\tfrac58} \right)$.
          - texto: >-
              El factor de dentro es el inverso de $a$, o sea
              $\sqrt{\tfrac58}=\tfrac{\sqrt{10}}{4}\approx0{,}79$, y no
              $\tfrac{\sqrt5}{8}\approx0{,}28$.
          - texto: >-
              Y como los dos valores están entre $0$ y $1$, la diferencia solo
              cambia el resultado en las últimas cifras.
            trampa: true
            mensaje: |
              La cambia por completo: con $\sqrt{\tfrac58}$ la integral entre
              $0$ y $1$ vale $0{,}4077$ y con $\tfrac{\sqrt5}{8}$ vale
              $0{,}1262$. Más del triple. Y además, derivando la segunda no
              sale el integrando.
        veredicto: |
          En $\operatorname{arcsen}\tfrac{x}{a}$, el número que acompaña a $x$
          es $\tfrac1a$, y aquí $a=\sqrt{\tfrac85}$. Comprobarlo en un punto
          cuesta diez segundos y decide entre dos lecturas del mismo símbolo
          impreso.
    resolucion: |
      **Las cinco.**

      | ap. | primitiva |
      |---|---|
      | (a) | $2\left(\tfrac{\left(x+1\right)^{5/2}}{5}-\tfrac{\left(x+1\right)^{3/2}}{3}\right)$ |
      | (b) | $12\left(\tfrac{1}{15}x^{5/4}-\tfrac{2}{17}x^{17/12}+\tfrac19 x^{3/4}\right)$ |
      | (c) | $2\left(\sqrt{x+4}+\ln\left\lvert\tfrac{\sqrt{x+4}-2}{\sqrt{x+4}+2}\right\rvert\right)$ |
      | (d) | $\tfrac{1}{\sqrt5}\operatorname{arcsen}\left(\sqrt{\tfrac58}\,x\right)$ |
      | (e) | $\operatorname{argsh}\tfrac{x}{\sqrt2}+\tfrac{x}{\sqrt2}\operatorname{ch}\left(\operatorname{argsh}\tfrac{x}{\sqrt2}\right)$ |

      ### 1 · Un cambio por familia

      | ap. | forma | cambio |
      |---|---|---|
      | (a) | $\sqrt{\text{lineal}}$ | $t=x+1$ |
      | (b) | potencias racionales | ninguno: se separan |
      | (c) | $\sqrt{\text{lineal}}$ en un cociente | $t=\sqrt{x+4}$ |
      | (d) | $\sqrt{a^{2}-x^{2}}$ | arco seno directo |
      | (e) | $\sqrt{a^{2}+x^{2}}$ | $x=\sqrt2\operatorname{sh}u$ |

      ### 2 · El (b), sin cambio ninguno

      $$
      \frac{x^{1/2}-2x^{2/3}+1}{x^{1/4}}
      = x^{1/4}-2x^{5/12}+x^{-1/4}
      $$

      Integrando cada potencia:

      $$
      \frac{4}{5}x^{5/4}-\frac{24}{17}x^{17/12}+\frac{4}{3}x^{3/4}
      = 12\left(\frac{1}{15}x^{5/4}-\frac{2}{17}x^{17/12}
      +\frac19 x^{3/4}\right)
      $$

      ### 3 · El (e), y por qué es la misma fórmula de siempre

      Con $x=\sqrt2\operatorname{sh}u$:

      $$
      \operatorname{argsh}\frac{x}{\sqrt2}
      + \frac{x}{\sqrt2}\operatorname{ch}\left(\operatorname{argsh}
      \frac{x}{\sqrt2}\right)
      = \ln\left(x+\sqrt{2+x^{2}}\right)
      + \frac{x\sqrt{2+x^{2}}}{2} + \text{cte}
      $$

      porque $\operatorname{ch}\left(\operatorname{argsh}u\right) =\sqrt{1+u^{2}}$. Es exactamente
      $\int\sqrt{a^{2}+x^{2}}\,dx = \tfrac{x}{2}\sqrt{a^{2}+x^{2}}+\tfrac{a^{2}}{2} \ln\left(x+\sqrt{a^{2}+x^{2}}\right)$ con $a^{2}=2$.

      ### 4 · La lectura del (d)

      El boletín imprime el factor de dentro del arco seno de forma que se
      puede leer como $\tfrac{\sqrt5}{8}$. **No es eso**: el número correcto es
      $\sqrt{\tfrac58}=\tfrac{\sqrt{10}}{4}\approx0{,}7906$, casi tres veces
      mayor. Con la otra lectura, la derivada no da el integrando y la
      integral entre $0$ y $1$ sale $0{,}126$ en vez de $0{,}408$.

      **Lo que hay que llevarse.** Cada tipo de radical tiene su cambio, y hay
      que reconocerlo antes de empezar. Y cuando un resultado impreso admite
      dos lecturas, la que vale es la que deriva al integrando: sustituir un
      número y comprobar es más rápido que dudar.

  - id: cinco-integrales-variadas
    titulo: Cinco integrales sin método asignado, y dos erratas por el camino
    fuente: >-
      Ejercicio 5 (a)–(e) · Problemas, tema 5 · Cálculo, UPV/EHU · Dos
      soluciones impresas con errata: en la (b), tres de los cuatro términos
      salen multiplicados por tres, y en la (d) el arco tangente lleva la
      mitad del coeficiente que le corresponde. Las dos comprobadas
      derivando y corregidas en la resolución.
    nivel: practica
    enunciado: |
      Calcular las integrales siguientes:

      (a) $\displaystyle\int\operatorname{arcsen}\sqrt{\frac{x}{x+1}}\,dx$
      &nbsp;&nbsp;
      (b) $\displaystyle\int x\ln\left(1+x^{3}\right)dx$

      (c) $\displaystyle\int x\cos^{2}x\,dx$ &nbsp;&nbsp;
      (d) $\displaystyle\int\frac{x-2}{x^{4}-x^{3}-x+1}\,dx$

      (e) $\displaystyle\int\frac{2x^{3}-x-7}{x^{3}-x^{2}-x-2}\,dx$
    pide: Las cinco primitivas.
    pasos:
      - tipo: reconocer
        pregunta: |
          El denominador de (d) es $x^{4}-x^{3}-x+1$. ¿Cómo se factoriza?
        opciones:
          - texto: >-
              Agrupando: $x^{3}\left(x-1\right)-\left(x-1\right) = \left(x-1\right)^{2}\left(x^{2}+x+1\right)$
            correcta: true
            mensaje: |
              Eso es, y el detalle importante es que sale una raíz **doble**:
              $x^{3}-1$ vuelve a contener el factor $x-1$. Por eso la
              descomposición necesita $\tfrac{A}{x-1}$ **y**
              $\tfrac{B}{\left(x-1\right)^{2}}$.
          - texto: >-
              $\left(x-1\right)\left(x^{3}-1\right)$ y ahí se para
            mensaje: |
              Casi: $x^{3}-1$ todavía se factoriza como
              $\left(x-1\right)\left(x^{2}+x+1\right)$, y eso convierte la raíz
              $x=1$ en doble.
          - texto: >-
              No se factoriza: es irreducible
            mensaje: |
              $x=1$ lo anula, así que $x-1$ es factor. Probar los divisores del
              término independiente es lo primero que hay que hacer.

      - tipo: calcular
        titulo: El apartado (c), entre 0 y π
        pregunta: |
          ¿Cuánto vale $\displaystyle\int_{0}^{\pi} x\cos^{2}x\,dx$?
        respuesta:
          tipo: numero
          valor: '2.467401'
          tolerancia: 0.002
          formato: con seis decimales
        distractores:
          - valor: '4.934802'
            mensaje: |
              $\tfrac{\pi^{2}}{2}$ sería $\int_{0}^{\pi}x\,dx$: eso es lo que
              saldría si $\cos^{2}x$ valiese siempre $1$. Su valor medio es
              $\tfrac12$.
          - valor: '1.233701'
            mensaje: |
              $\tfrac{\pi^{2}}{8}$ es la mitad de lo correcto: has dividido dos
              veces entre dos.
        pista: |
          $\cos^{2}x=\tfrac{1+\cos 2x}{2}$, y los términos oscilantes se
          cancelan entre los dos extremos.
        desarrollo: |
          $$
          \left[\frac{x^{2}}{4}+\frac{x}{2}\operatorname{sen}x\cos x
          +\frac{\cos 2x}{8}\right]_{0}^{\pi}
          = \frac{\pi^{2}}{4}+0+\frac18-\frac18
          = \frac{\pi^{2}}{4} \approx 2{,}467401
          $$

      - tipo: calcular
        titulo: El apartado (b), entre 0 y 1
        pregunta: |
          Con la primitiva correcta, ¿cuánto vale
          $\displaystyle\int_{0}^{1} x\ln\left(1+x^{3}\right)dx$?
        respuesta:
          tipo: numero
          valor: '0.156900'
          tolerancia: 0.0004
          formato: con seis decimales
        distractores:
          - valor: '0.346574'
            mensaje: |
              $\tfrac{\ln 2}{2}$ sería el resultado si $\ln\left(1+x^{3}\right)$
              valiese $\ln 2$ en todo el intervalo. Solo lo vale en $x=1$.
          - valor: '0.693147'
            mensaje: |
              $\ln 2$ es el valor del logaritmo en el extremo, no la integral.
        pista: |
          Por partes con $u=\ln\left(1+x^{3}\right)$ y $v=\tfrac{x^{2}}{2}$; el
          integrando es pequeño porque el logaritmo se anula en $x=0$.
        desarrollo: |
          $$
          \int_{0}^{1} x\ln\left(1+x^{3}\right)dx \approx 0{,}156900
          $$

          Con la primitiva

          $$
          \frac{x^{2}}{2}\ln\left(1+x^{3}\right)-\frac34 x^{2}
          -\frac12\ln\lvert 1+x\rvert+\frac14\ln\left(x^{2}-x+1\right)
          +\frac{\sqrt3}{2}\arctan\frac{2x-1}{\sqrt3}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento sobre el apartado (b). Una pieza es falsa.
        piezas:
          - texto: >-
              Por partes con $u=\ln\left(1+x^{3}\right)$ y
              $dv=x\,dx$ queda
              $\tfrac{x^{2}}{2}\ln\left(1+x^{3}\right) -\tfrac32\displaystyle\int\frac{x^{4}}{1+x^{3}}\,dx$.
          - texto: >-
              Esa fracción es impropia:
              $\tfrac{x^{4}}{1+x^{3}} = x-\tfrac{x}{1+x^{3}}$.
          - texto: >-
              Y $\tfrac{x}{1+x^{3}}$ se descompone con
              $1+x^{3}=\left(1+x\right)\left(x^{2}-x+1\right)$, lo que produce
              un logaritmo, otro logaritmo y un arco tangente.
          - texto: >-
              El resultado impreso del boletín coincide con este salvo en el
              término en $x^{2}$, que es el único que hay que corregir.
            trampa: true
            mensaje: |
              Al revés: el término en $x^{2}$ es el **único que está bien**. Lo
              que el boletín imprime multiplicado por tres son los otros tres:
              el $\ln\lvert1+x\rvert$, el $\ln\left(x^{2}-x+1\right)$ y el arco
              tangente. Derivando lo impreso sale $2{,}05$ en $x=0{,}9$ donde
              el integrando vale $0{,}49$.
        veredicto: |
          El factor $\tfrac32$ de delante de la integral que queda hay que
          repartirlo entre **todos** los términos que salgan de ella. Olvidarlo
          en unos y no en otros es lo que produce el resultado impreso.
    resolucion: |
      **Las cinco.**

      | ap. | primitiva |
      |---|---|
      | (a) | $x\operatorname{arcsen}\sqrt{\tfrac{x}{x+1}}-\sqrt{x}+\arctan\sqrt{x}$ |
      | (b) | $\tfrac{x^{2}}{2}\ln\left\lvert1+x^{3}\right\rvert-\tfrac34x^{2}-\tfrac12\ln\lvert1+x\rvert+\tfrac14\ln\left(x^{2}-x+1\right)+\tfrac{\sqrt3}{2}\arctan\tfrac{2x-1}{\sqrt3}$ |
      | (c) | $\tfrac{x^{2}}{4}+\tfrac{x}{2}\operatorname{sen}x\cos x+\tfrac{\cos 2x}{8}$ |
      | (d) | $\tfrac23\ln\lvert x-1\rvert+\tfrac{1}{3\left(x-1\right)}-\tfrac13\ln\left(x^{2}+x+1\right)-\tfrac{4\sqrt3}{9}\arctan\tfrac{2x+1}{\sqrt3}$ |
      | (e) | $2x+\ln\lvert x-2\rvert+\tfrac12\ln\left(x^{2}+x+1\right)+\sqrt3\arctan\tfrac{2x+1}{\sqrt3}$ |

      ### 1 · Las dos erratas

      | ap. | lo impreso | lo que sale |
      |---|---|---|
      | (b) | $-\tfrac32\ln\lvert1+x\rvert$, $+\tfrac34\ln\left(x^{2}-x+1\right)$, $+\tfrac{3\sqrt3}{2}\arctan$ | los tres divididos entre $3$ |
      | (d) | $-\tfrac{2\sqrt3}{9}\arctan\tfrac{2x+1}{\sqrt3}$ | $-\tfrac{4\sqrt3}{9}\arctan\tfrac{2x+1}{\sqrt3}$ |

      Comprobadas derivando: la de (b) da $2{,}05$ en $x=0{,}9$ frente a
      $0{,}49$; la de (d), $-2{,}635$ en $x=0{,}4$ frente a $-2{,}849$.

      Los apartados (a), (c) y (e) están **bien impresos**.

      ### 2 · El (a), que es el más bonito

      Por partes con $dv=dx$:

      $$
      x\operatorname{arcsen}\sqrt{\frac{x}{x+1}}
      - \int \frac{x}{2\sqrt{x}\left(1+x\right)}\,dx
      $$

      porque la derivada de $\operatorname{arcsen}\sqrt{\tfrac{x}{x+1}}$ es
      $\tfrac{1}{2\sqrt x\left(1+x\right)}$ — el radical desaparece por
      completo. Y con $t=\sqrt x$ la integral que queda es
      $\int\tfrac{t^{2}}{1+t^{2}}\,dt = t-\arctan t$.

      ### 3 · El (d), donde la raíz es doble

      $$
      x^{4}-x^{3}-x+1 = \left(x-1\right)\left(x^{3}-1\right)
      = \left(x-1\right)^{2}\left(x^{2}+x+1\right)
      $$

      $$
      \frac{x-2}{\left(x-1\right)^{2}\left(x^{2}+x+1\right)}
      = \frac{2/3}{x-1}-\frac{1/3}{\left(x-1\right)^{2}}
      +\frac{-\tfrac23 x-1}{x^{2}+x+1}
      $$

      y el último término da $-\tfrac13\ln\left(x^{2}+x+1\right) -\tfrac23\cdot\tfrac{2}{\sqrt3}\arctan\tfrac{2x+1}{\sqrt3}$, con ese
      $\tfrac{4}{3\sqrt3}=\tfrac{4\sqrt3}{9}$ que el boletín deja a la mitad.

      ### 4 · El (e), que empieza dividiendo

      $$
      \frac{2x^{3}-x-7}{x^{3}-x^{2}-x-2} = 2 + \frac{2x^{2}+x-3}{x^{3}-x^{2}-x-2}
      $$

      y $x^{3}-x^{2}-x-2=\left(x-2\right)\left(x^{2}+x+1\right)$. De ahí el
      $2x$ del principio.

      **Lo que hay que llevarse.** Estos cinco no dicen qué método usar, y esa
      es la dificultad real del examen. El orden que casi siempre funciona:
      mirar si hay que dividir, factorizar lo que se pueda, y solo entonces
      elegir entre partes, cambio o fracciones simples.

  - id: las-otras-cinco-variadas
    titulo: Las otras cinco, con tres resultados impresos que no derivan
    fuente: >-
      Ejercicio 5 (f)–(j) · Problemas, tema 5 · Cálculo, UPV/EHU · Tres
      soluciones impresas con errata: la (f), la (g) —que además escribe
      x²-x+1 donde el integrando lleva x²+x+1— y la (j). Las tres
      comprobadas derivando y corregidas en la resolución.
    nivel: practica
    enunciado: |
      Calcular las integrales siguientes:

      (f) $\displaystyle\int\cos^{2}\left(\ln x\right)dx$ &nbsp;&nbsp;
      (g) $\displaystyle\int\frac{\ln\left(x^{2}+x+1\right)} {\left(x+1\right)^{2}}\,dx$

      (h) $\displaystyle\int\ln\left(x+\sqrt{x^{2}+1}\right)^{1/x^{2}}dx$
      &nbsp;&nbsp;
      (i) $\displaystyle\int\frac{\arctan x}{x^{3}}\,dx$ &nbsp;&nbsp;
      (j) $\displaystyle\int\frac{1+\tan x}{1-\tan^{3}x}\,dx$
    pide: Las cinco primitivas.
    pasos:
      - tipo: reconocer
        pregunta: |
          El (f) tiene $\ln x$ dentro de un coseno. ¿Qué hace que salga?
        opciones:
          - texto: >-
              Integrar dos veces por partes: reaparece la misma integral y se
              despeja
            correcta: true
            mensaje: |
              Eso es, el truco de la **integral cíclica**. Es el mismo de
              $\int e^{x}\operatorname{sen}x\,dx$: después de dos pasos vuelve
              a salir $I$, y se despeja como en una ecuación.
          - texto: >-
              El cambio $t=\ln x$, que la deja trivial
            mensaje: |
              El cambio $t=\ln x$ da $\int e^{t}\cos^{2}t\,dt$, que **también**
              es cíclica. Ayuda a verlo, pero no evita el despeje.
          - texto: >-
              Desarrollar el coseno en serie
            mensaje: |
              No hace falta: la primitiva es elemental, y se obtiene con dos
              integraciones por partes.

      - tipo: calcular
        titulo: El apartado (i), entre 1 y 2
        pregunta: |
          ¿Cuánto vale $\displaystyle\int_{1}^{2}\frac{\arctan x}{x^{3}}\,dx$?
        respuesta:
          tipo: numero
          valor: '0.343430'
          tolerancia: 0.0008
          formato: con seis decimales
        distractores:
          - valor: '0.785398'
            mensaje: |
              $\tfrac\pi4$ es $\arctan 1$, el valor del numerador en el extremo
              izquierdo. La integral divide además por $x^{3}$.
          - valor: '0.589049'
            mensaje: |
              Eso sería $\tfrac\pi4\cdot\tfrac{3}{4}$, o sea suponer el arco
              tangente constante. Crece de $0{,}785$ a $1{,}107$.
        pista: |
          La primitiva es $\tfrac12\left(-\tfrac{\arctan x}{x^{2}} -\arctan x-\tfrac1x\right)$.
        desarrollo: |
          $$
          \frac12\left[-\frac{\arctan x}{x^{2}}-\arctan x-\frac1x
          \right]_{1}^{2} \approx 0{,}343430
          $$

      - tipo: calcular
        titulo: El apartado (f), entre 1 y e
        pregunta: |
          Con la primitiva correcta, ¿cuánto vale
          $\displaystyle\int_{1}^{e}\cos^{2}\left(\ln x\right)dx$?
        respuesta:
          tipo: numero
          valor: '1.140366'
          tolerancia: 0.0024
          formato: con seis decimales
        distractores:
          - valor: '1.718282'
            mensaje: |
              $e-1$ es la longitud del intervalo, o sea lo que valdría la
              integral si $\cos^{2}$ fuese siempre $1$.
          - valor: '0.859141'
            mensaje: |
              $\tfrac{e-1}{2}$ supone que el valor medio de
              $\cos^{2}\left(\ln x\right)$ es exactamente $\tfrac12$. Se le
              acerca, pero no lo es: el intervalo no cubre un periodo entero.
        pista: |
          La primitiva es $\tfrac{x}{2}+\tfrac{x}{10} \left(\cos\left(2\ln x\right)+2\operatorname{sen}\left(2\ln x\right) \right)$.
        desarrollo: |
          $$
          \left[\frac{x}{2}+\frac{x}{10}\left(\cos 2\ln x
          +2\operatorname{sen}2\ln x\right)\right]_{1}^{e}
          \approx 1{,}140366
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento sobre el (f). Una pieza es falsa.
        piezas:
          - texto: >-
              $\cos^{2}u=\tfrac{1+\cos 2u}{2}$, así que
              $\int\cos^{2}\left(\ln x\right)dx = \tfrac{x}{2}+\tfrac12 I$ con
              $I=\int\cos\left(2\ln x\right)dx$.
          - texto: >-
              Por partes dos veces:
              $I = x\cos 2\ln x + 2J$ y
              $J = x\operatorname{sen}2\ln x - 2I$.
          - texto: >-
              Sustituyendo, $5I = x\left(\cos 2\ln x +2\operatorname{sen}2\ln x\right)$, y de ahí el $\tfrac{x}{10}$
              del resultado.
          - texto: >-
              El boletín imprime $\tfrac{x}{6}$ en lugar de $\tfrac{x}{10}$,
              pero como el paréntesis es el mismo, el error es pequeño.
            trampa: true
            mensaje: |
              El paréntesis **no** es el mismo: el boletín escribe
              $\cos+\operatorname{sen}$ y lo correcto es
              $\cos+2\operatorname{sen}$. Son dos errores, no uno, y derivando
              lo impreso sale $0{,}53$ en $x=0{,}4$ donde el integrando vale
              $0{,}37$.
        veredicto: |
          En una integral cíclica el coeficiente final —aquí el $5$ que produce
          el $\tfrac{x}{10}$— sale del despeje, y basta equivocarse en un signo
          para que cambie. Derivar el resultado es lo único que lo garantiza.
    resolucion: |
      **Las cinco.**

      | ap. | primitiva |
      |---|---|
      | (f) | $\tfrac{x}{2}+\tfrac{x}{10}\left(\cos 2\ln x+2\operatorname{sen}2\ln x\right)$ |
      | (g) | $\ln\left(x^{2}+x+1\right)\left(\tfrac12-\tfrac{1}{x+1}\right)-\ln\lvert1+x\rvert+\sqrt3\arctan\tfrac{2x+1}{\sqrt3}$ |
      | (h) | $-\tfrac1x\ln\left(x+\sqrt{1+x^{2}}\right)+\tfrac12\ln\left\lvert\tfrac{\sqrt{1+x^{2}}-1}{\sqrt{1+x^{2}}+1}\right\rvert$ |
      | (i) | $\tfrac12\left(-\tfrac{\arctan x}{x^{2}}-\arctan x-\tfrac1x\right)$ |
      | (j) | $x-\tfrac13\ln\lvert1-\tan x\rvert+\tfrac16\ln\left(\tan^{2}x+\tan x+1\right)-\tfrac{1}{\sqrt3}\arctan\tfrac{2\tan x+1}{\sqrt3}$ |

      ### 1 · Las tres erratas

      | ap. | lo impreso | lo que sale |
      |---|---|---|
      | (f) | $\tfrac{x}{6}\left(\cos 2\ln x+\operatorname{sen}2\ln x\right)$ | $\tfrac{x}{10}\left(\cos 2\ln x+2\operatorname{sen}2\ln x\right)$ |
      | (g) | $\ln\lvert x^{2}-x+1\rvert$ y $\tfrac{\sqrt3}{2}\arctan$ | $\ln\left(x^{2}+x+1\right)$ y $\sqrt3\arctan$ |
      | (j) | otra combinación, con un $\ln\lvert\tan^{2}x+1\rvert^{3}$ que no aparece | la de la tabla |

      Las tres comprobadas derivando en cuatro puntos distintos. Los apartados
      (h) e (i) están bien impresos.

      ### 2 · El (g), por partes con el cuadrado abajo

      $u=\ln\left(x^{2}+x+1\right)$, $dv=\tfrac{dx}{\left(x+1\right)^{2}}$,
      $v=-\tfrac{1}{x+1}$:

      $$
      -\frac{\ln\left(x^{2}+x+1\right)}{x+1}
      + \int\frac{2x+1}{\left(x+1\right)\left(x^{2}+x+1\right)}\,dx
      $$

      La fracción se descompone como
      $\tfrac{-1}{x+1}+\tfrac{x+2}{x^{2}+x+1}$, y el segundo trozo da
      $\tfrac12\ln\left(x^{2}+x+1\right)+\sqrt3\arctan\tfrac{2x+1}{\sqrt3}$.
      Agrupando los dos logaritmos sale el paréntesis del resultado.

      ### 3 · El (j), que es racional disfrazado

      $\tan^{3}x$ pide $t=\tan x$, con $dx=\tfrac{dt}{1+t^{2}}$:

      $$
      \int\frac{1+t}{\left(1-t\right)\left(1+t+t^{2}\right)
      \left(1+t^{2}\right)}\,dt
      $$

      y en fracciones simples

      $$
      \frac{1}{3\left(1-t\right)}+\frac{t-1}{3\left(t^{2}+t+1\right)}
      +\frac{1}{1+t^{2}}
      $$

      El último término da $\arctan t = x$: **de ahí sale la $x$ suelta**, y es
      lo que delata que el resultado impreso, que la lleva multiplicada por
      $\tfrac12$, no puede ser.

      ### 4 · El (h), y su exponente

      $$
      \ln\left(x+\sqrt{x^{2}+1}\right)^{1/x^{2}}
      = \frac{1}{x^{2}}\ln\left(x+\sqrt{x^{2}+1}\right)
      $$

      Por partes con $dv=\tfrac{dx}{x^{2}}$, y la integral que queda,
      $\int\tfrac{dx}{x\sqrt{1+x^{2}}}$, sale con $t=\sqrt{1+x^{2}}$.

      **Lo que hay que llevarse.** Cinco integrales de examen, cada una con su
      truco: cíclica, partes con cuadrado abajo, exponente que sale del
      logaritmo, partes con $\tfrac{1}{x^{3}}$, y racional en $\tan x$. Y tres
      soluciones impresas que no derivan al integrando — motivo suficiente para
      no dar por buena ninguna sin comprobarla.

  - id: la-funcion-valor-medio-de-una-a-trozos
    titulo: La función valor medio, que no es el valor medio
    fuente: Valor medio · Problemas, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Consideremos la función definida de la siguiente forma:

      $$
      y(x)=\begin{cases}
      x & x\in\left[0,1\right)\\[4pt]
      e^{\,1-x} & x\in\left[1,2\right]
      \end{cases}
      $$

      (a) Dibujar $y(x)$.

      (b) Calcular la función valor medio $\overline{y}(x)$ de $y(x)$ en el
      intervalo $\left[a,b\right]$.

      (c) Calcular el valor medio $\overline{y}$ de $y(x)$ en $\left[a,b\right]$.
    pide: La función valor medio y el valor medio.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué diferencia hay entre $\overline{y}(x)$ y $\overline{y}$?
        opciones:
          - texto: >-
              $\overline{y}(x)$ es una **función** —la media de $y$ desde $a$ hasta
              $x$— y $\overline{y}$ es el número que resulta al llegar a $b$
            correcta: true
            mensaje: |
              Eso es. $\overline{y}(x)=\tfrac{1}{x-a}\int_{a}^{x}y$, y el valor medio
              del enunciado es $\overline{y} = \overline{y}(b)$. Una es una función de $x$;
              el otro, un número.
          - texto: >-
              Son lo mismo escrito de dos maneras
            mensaje: |
              No: $\overline{y}(x)$ depende de $x$. Aquí vale $\tfrac{x}{2}$ en el
              primer tramo, que cambia con $x$; $\overline{y}$ es un solo número,
              $0{,}566$.
          - texto: >-
              $\overline{y}$ es la media de los valores extremos de $y$
            mensaje: |
              Eso sería la media de dos números. El valor medio integral pesa
              **todos** los valores de la función.

      - tipo: calcular
        titulo: La función valor medio en x = 1,6
        pregunta: |
          ¿Cuánto vale $\overline{y}\left(1{,}6\right)$?
        respuesta:
          tipo: numero
          valor: '0.594493'
          tolerancia: 0.0012
          formato: con seis decimales
        distractores:
          - valor: '0.800000'
            mensaje: |
              $\tfrac{1{,}6}{2}$ es la fórmula del **primer** tramo, y $1{,}6$
              está en el segundo. Ahí la fórmula es
              $\tfrac1x\left(\tfrac32-e^{1-x}\right)$.
          - valor: '0.548812'
            mensaje: |
              $e^{-0{,}6}$ es el **valor de la función** en $x=1{,}6$, no su
              media desde $0$.
        pista: |
          $\overline{y}(x)=\tfrac1x\left(\tfrac32-e^{1-x}\right)$ para
          $x\in\left[1,2\right]$, y $e^{-0{,}6}\approx0{,}5488$.
        desarrollo: |
          $$
          \overline{y}\left(1{,}6\right)
          = \frac{1}{1{,}6}\left(\frac32-e^{-0{,}6}\right)
          = \frac{1{,}5-0{,}548812}{1{,}6} \approx 0{,}594493
          $$

      - tipo: calcular
        titulo: El valor medio en todo el intervalo
        pregunta: |
          ¿Cuánto vale $\overline{y}$ en $\left[0,2\right]$?
        respuesta:
          tipo: numero
          valor: '0.566060'
          tolerancia: 0.0012
          formato: con seis decimales
        distractores:
          - valor: '0.750000'
            mensaje: |
              $\tfrac34$ olvida el $-\tfrac{1}{2e}$: el segundo tramo aporta
              $1-\tfrac1e$, no $1$.
          - valor: '1.132121'
            mensaje: |
              Ese es el valor de la **integral** $\int_{0}^{2}y$, sin dividir
              entre la longitud del intervalo, que es $2$.
        pista: |
          $\overline{y} = \tfrac34-\tfrac{1}{2e}$, y $\tfrac{1}{2e}\approx0{,}1839$.
        desarrollo: |
          $$
          \overline{y} = \frac12\int_{0}^{2}y
          = \frac12\left(\frac12+1-\frac1e\right)
          = \frac34-\frac{1}{2e} \approx 0{,}566060
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $\overline{y}(x)=\tfrac{1}{x-a}\displaystyle\int_{a}^{x}y(t)\,dt$, con
              $a=0$ aquí.
          - texto: >-
              En $\left[0,1\right)$ eso es
              $\tfrac1x\cdot\tfrac{x^{2}}{2}=\tfrac{x}{2}$.
          - texto: >-
              En $\left[1,2\right]$ hay que arrastrar lo acumulado en el primer
              tramo, $\tfrac12$, y sumarle
              $\int_{1}^{x}e^{1-t}dt = 1-e^{1-x}$.
          - texto: >-
              Y como $y$ tiene un salto en $x=1$, $\overline{y}(x)$ también salta
              ahí.
            trampa: true
            mensaje: |
              $\overline{y}$ es **continua** aunque $y$ no lo sea: es una integral
              dividida por $x$, y las integrales suavizan. En $x=1$ los dos
              trozos valen $\tfrac12$: por la izquierda $\tfrac{1}{2}$, y por la
              derecha $\tfrac11\left(\tfrac32-1\right)=\tfrac12$. Encajan.
        veredicto: |
          Promediar suaviza: la función valor medio de una función con saltos es
          continua, y comprobar que los trozos encajan en el punto de unión es
          la verificación que cierra el ejercicio.
      - tipo: dibujar
        consigna: |
          Dibuja $y(x)$ en $\left[0,2\right]$, con los dos tramos y el punto de
          unión bien marcado.
        comprueba:
          - punto: |
              El primer tramo, una recta de $\left(0,0\right)$ a
              $\left(1,1\right)$.
            porque: |
              Es $y=x$ en $\left[0,1\right)$, la recta más simple posible. Su
              media es $\tfrac x2$, y eso se ve en el dibujo sin integrar.
          - punto: |
              El segundo tramo, $e^{1-x}$, bajando de $1$ en $x=1$ a
              $e^{-1}\approx0{,}37$ en $x=2$.
            porque: |
              La exponencial decreciente empieza justo donde acaba la recta. Y
              nunca llega a cero: eso es lo que hace que el valor medio sea
              $\tfrac34-\tfrac{1}{2e}$ y no $\tfrac34$.
          - punto: |
              Que en $x=1$ **no hay salto**.
            porque: |
              Los dos trozos valen $1$. Una función definida a trozos no tiene
              por qué ser discontinua, y aquí no lo es.
          - punto: |
              El máximo de la función en $\left(1,1\right)$, que es el vértice.
            porque: |
              Sube linealmente y después baja: el pico está en el empalme. Es una
              esquina, no un máximo suave, y conviene dibujarla angulosa.
        veredicto: |
          La función vale entre $0$ y $1$, así que su valor medio tiene que caer
          ahí. Sale $0{,}566$: una comprobación de sentido que cuesta cero y que
          caza cualquier error de signo en las integrales.

    resolucion: |
      **Resultados.**

      $$
      \overline{y}(x)=\begin{cases}
      \dfrac{x}{2} & x\in\left[0,1\right)\\[10pt]
      \dfrac1x\left(\dfrac32-e^{\,1-x}\right) & x\in\left[1,2\right]
      \end{cases}
      \qquad
      \overline{y} = \frac34-\frac{1}{2e} \approx 0{,}566060
      $$

      ### 1 · La función

      En $\left[0,1\right)$ sube de $0$ a $1$ en línea recta. En $x=1$ salta a
      $e^{0}=1$ — o sea que **no salta**: los dos trozos valen $1$ ahí. Y
      después baja exponencialmente hasta $e^{-1}\approx0{,}368$.

      ### 2 · El primer tramo

      $$
      \overline{y}(x) = \frac1x\int_{0}^{x}t\,dt = \frac1x\cdot\frac{x^{2}}{2}
      = \frac{x}{2}
      $$

      La media de una recta que sale del origen es la mitad de su valor: era
      previsible sin integrar.

      ### 3 · El segundo tramo

      Lo acumulado hasta $1$ es $\tfrac12$. Y a partir de ahí:

      $$
      \int_{1}^{x}e^{1-t}\,dt = \left[-e^{1-t}\right]_{1}^{x}
      = 1-e^{1-x}
      $$

      $$
      \overline{y}(x) = \frac1x\left(\frac12+1-e^{1-x}\right)
      = \frac1x\left(\frac32-e^{1-x}\right)
      $$

      ### 4 · El valor medio

      $$
      \overline{y} = \overline{y}(2) = \frac12\left(\frac32-e^{-1}\right)
      = \frac34-\frac{1}{2e} \approx 0{,}566
      $$

      Y una comprobación de sentido: la función toma valores entre $0$ y $1$,
      así que su media tenía que caer ahí ✓

      ### 5 · La continuidad, que es la comprobación

      En $x=1$: por la izquierda $\tfrac12$; por la derecha
      $\tfrac11\left(\tfrac32-1\right)=\tfrac12$. **Encajan**, y tenían que
      hacerlo: $\overline{y}$ es una integral dividida entre $x$, y eso es continuo
      aunque $y$ tenga saltos.

      **Lo que hay que llevarse.** La función valor medio se construye tramo a
      tramo **arrastrando lo acumulado**, y el valor medio del enunciado es
      simplemente su valor en el extremo derecho. Comprobar que los trozos
      encajan es gratis y caza casi cualquier error de arrastre.

  - id: el-valor-medio-con-cuatro-tramos
    titulo: Cuatro tramos, y un valor absoluto que se parte en dos
    fuente: Valor medio · Problemas, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Consideremos la función definida de la siguiente forma:

      $$
      y(x)=\begin{cases}
      x^{2} & x\in\left[0,1\right]\\[4pt]
      \left\lvert x-2\right\rvert & x\in\left(1,4\right]\\[4pt]
      2 & x\in\left(4,5\right]
      \end{cases}
      $$

      (a) Dibujar $y(x)$. &nbsp; (b) Calcular la función valor medio
      $\overline{y}(x)$. &nbsp; (c) Calcular el valor medio $\overline{y}$.
    pide: La función valor medio y el valor medio.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da tres tramos, pero la respuesta tiene cuatro. ¿Por
          qué?
        opciones:
          - texto: >-
              Porque el valor absoluto se parte en $x=2$: allí
              $\lvert x-2\rvert$ cambia de $2-x$ a $x-2$
            correcta: true
            mensaje: |
              Eso es. Para integrar hay que quitar el valor absoluto, y eso
              obliga a separar $\left(1,2\right]$ de $\left(2,4\right]$. Los
              tramos de la función y los tramos de la integral no tienen por
              qué coincidir.
          - texto: >-
              Porque hay que añadir el punto $x=0$
            mensaje: |
              En $x=0$ no empieza ningún tramo nuevo: es el extremo del
              intervalo, y la fórmula $\tfrac{x^{2}}{3}$ ya lo cubre.
          - texto: >-
              Porque el tramo constante se cuenta dos veces
            mensaje: |
              El tramo constante es uno solo, $\left(4,5\right]$. El que se
              desdobla es el del valor absoluto.

      - tipo: calcular
        titulo: La función valor medio en x = 3
        pregunta: |
          ¿Cuánto vale $\overline{y}(3)$?
        respuesta:
          tipo: numero
          valor: '0.444444'
          tolerancia: 0.0009
          formato: con seis decimales
        distractores:
          - valor: '1.000000'
            mensaje: |
              $1$ es el **valor de la función** en $x=3$, o sea
              $\lvert 3-2\rvert$. La media desde $0$ es bastante menor, porque
              la función pasa por cero en $x=2$.
          - valor: '1.333333'
            mensaje: |
              $\tfrac43$ es la integral acumulada
              $\tfrac56+\tfrac12$, sin dividir entre $x=3$.
        pista: |
          $\overline{y}(x)=\tfrac1x\left(\tfrac56+\tfrac{\left(x-2\right)^{2}}{2} \right)$ en $\left(2,4\right]$.
        desarrollo: |
          $$
          \overline{y}(3) = \frac13\left(\frac56+\frac12\right)
          = \frac13\cdot\frac43 = \frac49 \approx 0{,}444444
          $$

      - tipo: calcular
        titulo: El valor medio
        pregunta: |
          ¿Cuánto vale $\overline{y}$ en $\left[0,5\right]$?
        respuesta:
          tipo: numero
          valor: '0.966667'
          tolerancia: 0.0019
          formato: con seis decimales
        distractores:
          - valor: '1.000000'
            mensaje: |
              $1$ está cerca pero no es exacto: la integral total vale
              $\tfrac{29}{6}$, y dividida entre $5$ da $\tfrac{29}{30}$.
          - valor: '4.833333'
            mensaje: |
              $\tfrac{29}{6}$ es la integral total, sin dividir entre la
              longitud $5$ del intervalo.
        pista: |
          Los cuatro trozos aportan $\tfrac13$, $\tfrac12$, $2$ y $2$; en
          total $\tfrac{29}{6}$.
        desarrollo: |
          $$
          \int_{0}^{5}y = \frac13+\frac12+2+2 = \frac{29}{6}
          \qquad
          \overline{y} = \frac{29}{30} \approx 0{,}966667
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Se acumula tramo a tramo: hasta $1$, $\tfrac13$; de $1$ a $2$,
              $\tfrac12$; de $2$ a $4$, $2$; y de $4$ a $5$, $2$.
          - texto: >-
              En cada tramo, $\overline{y}(x)$ es lo acumulado antes más la integral
              del tramo hasta $x$, todo dividido entre $x$.
          - texto: >-
              Por eso los cuatro trozos de $\overline{y}$ tienen $\tfrac1x$ delante y
              se pegan sin salto.
          - texto: >-
              Y como en $x=2$ la función vale $0$, la función valor medio
              también se anula ahí.
            trampa: true
            mensaje: |
              En $x=2$, $\overline{y}$ vale
              $\tfrac12\left(\tfrac13+\tfrac12\right)=\tfrac{5}{12}$, no $0$.
              La media recuerda todo lo anterior: que la función pase por cero
              en un punto no borra lo acumulado.
        veredicto: |
          La media acumulada es siempre positiva mientras la función lo haya
          sido, aunque en ese punto valga cero. Es la diferencia entre el valor
          y la memoria de todos los valores.
      - tipo: dibujar
        consigna: |
          Dibuja $y(x)$ en $\left[0,5\right]$. Marca los tres puntos donde cambia
          la definición y el vértice de la uve.
        comprueba:
          - punto: |
              Una parábola de $\left(0,0\right)$ a $\left(1,1\right)$.
            porque: |
              $y=x^{2}$ sale del origen con tangente horizontal y llega a $1$.
              Dibujarla como recta borra la diferencia con el tramo siguiente.
          - punto: |
              Una **uve** con el vértice en $\left(2,0\right)$: baja de $1$ a $0$
              y sube de $0$ a $2$.
            porque: |
              $\lvert x-2\rvert$ se anula en $x=2$. Ese vértice es lo que obliga a
              partir la integral en cuatro tramos y no en tres.
          - punto: |
              Un tramo horizontal a altura $2$ de $x=4$ a $x=5$.
            porque: |
              Empalma con el final de la uve, que también vale $2$ en $x=4$: la
              función es continua ahí.
          - punto: |
              Que la función es **continua** en los tres empalmes: $x=1$, $x=4$ y
              también en el vértice $x=2$.
            porque: |
              No hay ningún salto en todo el intervalo. Dibujar uno cambiaría el
              valor medio, y comprobar los tres empalmes cuesta tres
              sustituciones.
        veredicto: |
          Cuatro tramos en el dibujo aunque el enunciado dé tres: el valor
          absoluto se parte en su vértice. Verlo antes de integrar es lo que
          evita el error de tratar $\lvert x-2\rvert$ como si fuese $x-2$.

    resolucion: |
      **Resultados.**

      $$
      \overline{y}(x)=\begin{cases}
      \dfrac{x^{2}}{3} & x\in\left[0,1\right]\\[10pt]
      \dfrac1x\left(\dfrac56-\dfrac{\left(2-x\right)^{2}}{2}\right)
      & x\in\left(1,2\right]\\[10pt]
      \dfrac1x\left(\dfrac56+\dfrac{\left(x-2\right)^{2}}{2}\right)
      & x\in\left(2,4\right]\\[10pt]
      \dfrac1x\left(-\dfrac{31}{6}+2x\right) & x\in\left(4,5\right]
      \end{cases}
      $$

      $$
      \overline{y} = \frac{29}{30} \approx 0{,}966667
      $$

      ### 1 · La función

      Una parábola de $0$ a $1$; después una uve con vértice en
      $\left(2,0\right)$ que baja de $1$ a $0$ y sube de $0$ a $2$; y por
      último la constante $2$.

      ### 2 · Lo acumulado en cada punto de corte

      | hasta | aporta | acumulado |
      |---|---|---|
      | $1$ | $\int_{0}^{1}x^{2}=\tfrac13$ | $\tfrac13$ |
      | $2$ | $\int_{1}^{2}\left(2-x\right)=\tfrac12$ | $\tfrac56$ |
      | $4$ | $\int_{2}^{4}\left(x-2\right)=2$ | $\tfrac{17}{6}$ |
      | $5$ | $\int_{4}^{5}2=2$ | $\tfrac{29}{6}$ |

      El $\tfrac56$ que aparece en dos de los cuatro trozos es exactamente lo
      acumulado hasta $x=2$.

      ### 3 · Los cuatro trozos, uno a uno

      En $\left(1,2\right]$: $\int_{1}^{x}\left(2-t\right)dt = \tfrac12-\tfrac{\left(2-x\right)^{2}}{2}$, así que sumando lo anterior
      queda $\tfrac56-\tfrac{\left(2-x\right)^{2}}{2}$ dentro del paréntesis.

      En $\left(2,4\right]$: $\int_{2}^{x}\left(t-2\right)dt = \tfrac{\left(x-2\right)^{2}}{2}$, que se suma al $\tfrac56$.

      En $\left(4,5\right]$: $\tfrac{17}{6}+2\left(x-4\right) = 2x-\tfrac{31}{6}$.

      ### 4 · Que los trozos encajan

      | $x$ | por la izquierda | por la derecha |
      |---|---|---|
      | $1$ | $\tfrac13$ | $\tfrac11\left(\tfrac56-\tfrac12\right)=\tfrac13$ |
      | $2$ | $\tfrac12\cdot\tfrac56=\tfrac5{12}$ | $\tfrac12\cdot\tfrac56=\tfrac5{12}$ |
      | $4$ | $\tfrac14\left(\tfrac56+2\right)=\tfrac{17}{24}$ | $\tfrac14\left(8-\tfrac{31}{6}\right)=\tfrac{17}{24}$ |

      Tres comprobaciones gratis, y las tres cuadran.

      ### 5 · El valor medio

      $$
      \overline{y} = \frac{1}{5}\cdot\frac{29}{6} = \frac{29}{30}
      $$

      **Lo que hay que llevarse.** Un valor absoluto dentro de una integral
      obliga a partir el intervalo donde cambia de signo, aunque el enunciado
      no lo diga. Y el resto es contabilidad: acumular, sumar, dividir entre
      $x$, y comprobar que los trozos se pegan.

  - id: dos-integrales-impropias
    titulo: Dos impropias, y son impropias por motivos distintos
    fuente: Integral impropia · Problemas, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular las siguientes integrales impropias:

      (a) $\displaystyle\int_{0}^{4}\frac{dx}{\sqrt[3]{x-1}}$ &nbsp;&nbsp;
      (b) $\displaystyle\int_{-\infty}^{\infty}\frac{e^{x}}{1+e^{2x}}\,dx$
    pide: El valor de las dos integrales.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué es impropia cada una?
        opciones:
          - texto: >-
              La (a) por una **singularidad interior**, en $x=1$; la (b) por
              tener los dos límites **infinitos**
            correcta: true
            mensaje: |
              Eso es, y son los dos tipos que hay. La de (a) es la más
              traicionera, porque el punto malo está **dentro** del intervalo y
              se pasa por alto con facilidad.
          - texto: >-
              Las dos por límites infinitos
            mensaje: |
              La (a) tiene límites finitos, $0$ y $4$. Lo que la hace impropia
              es que el integrando se dispara en $x=1$.
          - texto: >-
              La (a) no es impropia: el integrando está definido en todo
              $\left[0,4\right]$
            mensaje: |
              En $x=1$ el denominador se anula y el integrando no existe. Hay
              que partir en $\int_{0}^{1}+\int_{1}^{4}$ y tomar límites.

      - tipo: calcular
        titulo: La primera
        pregunta: |
          ¿Cuánto vale $\displaystyle\int_{0}^{4}\frac{dx}{\sqrt[3]{x-1}}$?
        respuesta:
          tipo: numero
          valor: '1.620126'
          tolerancia: 0.0033
          formato: con seis decimales
        distractores:
          - valor: '3.120126'
            mensaje: |
              $\tfrac32\sqrt[3]{9}$ es solo el trozo de la derecha,
              $\int_{1}^{4}$. Falta el de la izquierda, que es **negativo**:
              $-\tfrac32$.
          - valor: '4.620126'
            mensaje: |
              Has sumado $\tfrac32$ en vez de restarlo. En
              $\left[0,1\right)$ el integrando es negativo, porque la raíz
              cúbica de un número negativo lo es.
        pista: |
          $\tfrac32\left(\sqrt[3]{9}-1\right)$, y $\sqrt[3]{9}\approx2{,}0801$.
        desarrollo: |
          $$
          \left[\frac32\left(x-1\right)^{2/3}\right]_{0}^{1}
          + \left[\frac32\left(x-1\right)^{2/3}\right]_{1}^{4}
          = -\frac32 + \frac32\sqrt[3]{9}
          = \frac32\left(\sqrt[3]{9}-1\right) \approx 1{,}620126
          $$

      - tipo: calcular
        titulo: La segunda
        pregunta: |
          ¿Cuánto vale $\displaystyle\int_{-\infty}^{\infty} \frac{e^{x}}{1+e^{2x}}\,dx$?
        respuesta:
          tipo: numero
          valor: '1.570796'
          tolerancia: 0.0032
          formato: con seis decimales
        distractores:
          - valor: '3.141593'
            mensaje: |
              $\pi$ sería el resultado si el arco tangente barriera de
              $-\tfrac\pi2$ a $\tfrac\pi2$. Pero $e^{x}$ es siempre
              **positivo**: solo barre de $0$ a $\tfrac\pi2$.
          - valor: '0.785398'
            mensaje: |
              $\tfrac\pi4$ sería $\arctan 1$, el valor en $x=0$. La integral
              completa llega hasta el límite $\tfrac\pi2$.
        pista: |
          Con $t=e^{x}$ queda $\int_{0}^{\infty}\tfrac{dt}{1+t^{2}}$.
        desarrollo: |
          $$
          \int_{-\infty}^{\infty}\frac{e^{x}}{1+e^{2x}}\,dx
          = \left[\arctan e^{x}\right]_{-\infty}^{\infty}
          = \frac\pi2 - 0 = \frac\pi2 \approx 1{,}570796
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Una integral con una singularidad interior hay que partirla en el
              punto malo y estudiar los dos trozos por separado.
          - texto: >-
              En (a), $\int\left(x-1\right)^{-1/3}dx = \tfrac32\left(x-1\right)^{2/3}$, que es continua en $x=1$: los
              dos límites existen y valen $0$.
          - texto: >-
              De ahí que la integral converja, y valga
              $\tfrac32\left(\sqrt[3]{9}-1\right)$.
          - texto: >-
              Y como el integrando de (a) se hace infinito en $x=1$, la
              integral tenía que salir infinita.
            trampa: true
            mensaje: |
              Que el integrando se dispare **no** implica que la integral
              diverja: depende de la velocidad. Aquí el exponente es
              $-\tfrac13$, y $\int\tfrac{dx}{x^{p}}$ converge cerca del origen
              siempre que $p<1$. Con $p=\tfrac13$ converge holgadamente.
        veredicto: |
          La regla que decide: cerca de una singularidad,
          $\tfrac{1}{\left(x-a\right)^{p}}$ converge si $p<1$ y diverge si
          $p\ge1$. En el infinito, al revés: converge si $p>1$.
    resolucion: |
      **Resultados.**

      $$
      \text{(a)}\quad \frac32\left(\sqrt[3]{9}-1\right) \approx 1{,}620126
      \qquad
      \text{(b)}\quad \frac\pi2 \approx 1{,}570796
      $$

      ### 1 · La (a), con la singularidad dentro

      El integrando se dispara en $x=1$, que está **dentro** del intervalo. Hay
      que partir:

      $$
      \int_{0}^{4} = \lim_{\varepsilon\to0^{+}}\int_{0}^{1-\varepsilon}
      + \lim_{\delta\to0^{+}}\int_{1+\delta}^{4}
      $$

      La primitiva es $\tfrac32\left(x-1\right)^{2/3}$, continua en $x=1$
      —vale $0$ ahí—, así que los dos límites existen:

      $$
      \left(0-\frac32\right)+\left(\frac32\sqrt[3]{9}-0\right)
      = \frac32\left(\sqrt[3]{9}-1\right)
      $$

      Ojo al signo del primer trozo: en $\left[0,1\right)$ la raíz cúbica de
      $x-1$ es **negativa**, y también lo es el integrando. Ese trozo resta.

      ### 2 · Por qué converge

      Cerca de $x=1$ el integrando se comporta como
      $\lvert x-1\rvert^{-1/3}$, y

      $$
      \int_{0}^{1}\frac{dx}{x^{p}} \text{ converge } \iff p<1
      $$

      Con $p=\tfrac13$ converge con mucho margen. Si el índice de la raíz fuese
      $1$ en vez de $3$, divergería.

      ### 3 · La (b), con los dos límites infinitos

      $$
      \frac{e^{x}}{1+e^{2x}} = \frac{e^{x}}{1+\left(e^{x}\right)^{2}}
      $$

      que es exactamente $\tfrac{t'}{1+t^{2}}$ con $t=e^{x}$:

      $$
      \int \frac{e^{x}}{1+e^{2x}}\,dx = \arctan e^{x}
      $$

      $$
      \lim_{x\to\infty}\arctan e^{x} = \frac\pi2,
      \qquad
      \lim_{x\to-\infty}\arctan e^{x} = \arctan 0 = 0
      $$

      $$
      \int_{-\infty}^{\infty} = \frac\pi2
      $$

      ### 4 · El detalle que se cobra

      El resultado es $\tfrac\pi2$ y no $\pi$ **porque $e^{x}>0$ siempre**: el
      cambio $t=e^{x}$ manda toda la recta real al intervalo
      $\left(0,\infty\right)$, no a todo $\mathbb{R}$. Escribir $\pi$ es el
      error clásico, y sale de no mirar el recorrido del cambio.

      **Lo que hay que llevarse.** Antes de integrar, localizar qué la hace
      impropia: si es una singularidad, hay que partir ahí; si es el infinito,
      hay que tomar límite. Y en los cambios de variable, comprobar a dónde van
      los extremos.

  - id: el-area-y-el-volumen-de-la-exponencial
    titulo: El área bajo la exponencial, y el volumen que genera al girar
    fuente: Aplicaciones de la integral, problema 1 · Problemas, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Sea $D$ el dominio limitado por las condiciones $y=e^{x}$,
      $1\le x\le 2$.

      (a) Dibujar $D$. &nbsp; (b) Calcular el área de $D$. &nbsp;
      (c) Calcular el volumen generado al girar el dominio $D$ alrededor del
      eje $OX$.
    pide: El área y el volumen de revolución.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al girar alrededor de $OX$, ¿cuál es el integrando del volumen?
        opciones:
          - texto: >-
              $\pi y^{2}$, o sea $\pi e^{2x}$: cada sección es un disco de
              radio $y$
            correcta: true
            mensaje: |
              Eso es, el método de los discos. Y el detalle que lo hace todo:
              **el radio se eleva al cuadrado**, así que la exponencial duplica
              su exponente.
          - texto: >-
              $2\pi y$, la longitud de la circunferencia
            mensaje: |
              $2\pi y$ es el integrando del **área lateral** de la superficie
              de revolución, no del volumen. El volumen usa el área del disco,
              $\pi y^{2}$.
          - texto: >-
              $\pi y$, sin elevar al cuadrado
            mensaje: |
              El área de un círculo de radio $y$ es $\pi y^{2}$. Sin el
              cuadrado, ni siquiera saldrían unidades de volumen.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área de $D$?
        respuesta:
          tipo: numero
          valor: '4.670774'
          tolerancia: 0.0094
          formato: con seis decimales
        distractores:
          - valor: '7.389056'
            mensaje: |
              $e^{2}$ es solo la primitiva en el extremo superior. Falta
              restarle su valor en $x=1$, que es $e$.
          - valor: '2.718282'
            mensaje: |
              $e$ es la altura del dominio en su borde izquierdo, no el área.
        pista: |
          $\left[e^{x}\right]_{1}^{2} = e^{2}-e$, y
          $e^{2}\approx7{,}389$.
        desarrollo: |
          $$
          A = \int_{1}^{2}e^{x}\,dx = e^{2}-e \approx 4{,}670774
          $$

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen generado al girar $D$ alrededor de $OX$?
        respuesta:
          tipo: numero
          valor: '74.155871'
          tolerancia: 0.15
          formato: con seis decimales
        distractores:
          - valor: '14.673686'
            mensaje: |
              $\pi\left(e^{2}-e\right)$ multiplica el **área** por $\pi$, que
              no es el volumen. Hay que integrar $\pi y^{2}$, con la
              exponencial al cuadrado.
          - valor: '148.311743'
            mensaje: |
              $\pi\left(e^{4}-e^{2}\right)$ olvida el $\tfrac12$ que sale de
              integrar $e^{2x}$.
        pista: |
          $\pi\displaystyle\int_{1}^{2}e^{2x}dx = \tfrac\pi2\left(e^{4}-e^{2}\right)$, y $e^{4}\approx54{,}598$.
        desarrollo: |
          $$
          B = \pi\int_{1}^{2}e^{2x}\,dx
          = \frac\pi2\left(e^{4}-e^{2}\right) \approx 74{,}155871
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El dominio está limitado por la curva, el eje $OX$ y las dos
              verticales $x=1$ y $x=2$.
          - texto: >-
              El área es $\int_{1}^{2}e^{x}dx$, porque la altura de cada franja
              vertical es $e^{x}$.
          - texto: >-
              Al girar, cada franja produce un disco de radio $e^{x}$ y grosor
              $dx$, de volumen $\pi e^{2x}dx$.
          - texto: >-
              Y por eso el volumen es $\pi$ veces el área, ya que el radio es
              la altura.
            trampa: true
            mensaje: |
              Solo lo sería si el radio fuese constante. Aquí el volumen sale
              $74{,}16$ y $\pi$ veces el área es $14{,}67$: cinco veces menos.
              **El cuadrado no es lineal**, y por eso el volumen pesa mucho más
              la parte alta del dominio.
        veredicto: |
          Al elevar el radio al cuadrado, las zonas altas dominan el volumen
          mucho más de lo que dominan el área. Aquí el borde derecho, que mide
          $e^{2}\approx7{,}4$, se lleva casi todo.
      - tipo: dibujar
        consigna: |
          Dibuja el dominio $D$ en el plano $XY$ y, al lado, un croquis del
          sólido que genera al girar alrededor de $OX$.
        comprueba:
          - punto: |
              La curva $y=e^{x}$ entre $x=1$ y $x=2$, subiendo de
              $e\approx2{,}72$ a $e^{2}\approx7{,}39$.
            porque: |
              Es una subida de casi el triple en una unidad de $x$. Si tu dibujo
              parece una recta, la escala vertical está comprimida y el croquis
              del sólido saldrá mal.
          - punto: |
              El eje $OX$ como borde inferior del dominio.
            porque: |
              El enunciado no lo dice, pero es lo que se entiende cuando se da
              una curva y un intervalo. Sin ese borde el dominio no está acotado.
          - punto: |
              Los dos lados verticales en $x=1$ y $x=2$.
            porque: |
              Son los límites de integración, y cierran la figura. Un «trapecio
              curvo» con cuatro bordes, tres rectos y uno curvo.
          - punto: |
              En el croquis, un sólido tipo trompeta que se ensancha mucho hacia
              la derecha.
            porque: |
              El radio pasa de $2{,}72$ a $7{,}39$, así que el área de la sección
              se multiplica por más de siete. Es lo que explica que el volumen
              sea dieciséis veces el área.
        veredicto: |
          El dibujo contesta una pregunta que la fórmula no: dónde está el
          volumen. Casi todo en la mitad derecha, porque el radio va al cuadrado.

    resolucion: |
      **Resultados.** $A = e^{2}-e \approx 4{,}6708$ y
      $B = \dfrac{\pi}{2}\left(e^{4}-e^{2}\right) \approx 74{,}1559$.

      ### 1 · El dominio

      La región bajo $y=e^{x}$ entre $x=1$ y $x=2$: un «trapecio curvo» que
      sube de altura $e\approx2{,}72$ a $e^{2}\approx7{,}39$. El enunciado no
      lo dice, pero el eje $OX$ es el borde inferior — es lo que se entiende
      cuando solo se da una curva y un intervalo.

      ### 2 · El área

      $$
      A = \int_{1}^{2}e^{x}\,dx = \left[e^{x}\right]_{1}^{2}
      = e^{2}-e \approx 4{,}670774
      $$

      Comprobación de orden de magnitud: la altura media está entre $2{,}7$ y
      $7{,}4$, y la base mide $1$. Un área de $4{,}67$ encaja.

      ### 3 · El volumen

      Método de los discos: cada franja vertical de anchura $dx$ genera un
      disco de radio $y=e^{x}$.

      $$
      B = \pi\int_{1}^{2}\left(e^{x}\right)^{2}dx
      = \pi\int_{1}^{2}e^{2x}\,dx
      = \pi\left[\frac{e^{2x}}{2}\right]_{1}^{2}
      = \frac{\pi}{2}\left(e^{4}-e^{2}\right)
      $$

      $$
      \approx \frac{\pi}{2}\left(54{,}598-7{,}389\right) \approx 74{,}156
      $$

      ### 4 · Por qué el volumen es tan grande

      El área da $4{,}67$ y el volumen $74{,}16$: **dieciséis veces más**. La
      razón es el cuadrado. En $x=2$ el radio es $7{,}39$ y el disco mide
      $\pi\cdot54{,}6\approx171$; en $x=1$ el radio es $2{,}72$ y el disco
      $\pi\cdot7{,}39\approx23$. El extremo derecho aporta siete veces más que
      el izquierdo, mientras que en el área solo aporta tres veces más.

      **Lo que hay que llevarse.** Área e integral de $y$; volumen e integral
      de $\pi y^{2}$. Y una comprobación mental que evita errores tontos: el
      volumen siempre está dominado por la parte donde la curva es más alta.

  - id: la-parabola-entre-sus-dos-tangentes
    titulo: Una parábola encerrada entre dos de sus tangentes
    fuente: Aplicaciones de la integral, problema 2 · Problemas, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular el área del dominio $D$ limitado por la gráfica de la función
      $y=x^{2}+2x+2$, la recta tangente que pasa por el mínimo de la función y
      la recta tangente cuya pendiente es $6$.
    pide: El área encerrada.
    pasos:
      - tipo: reconocer
        pregunta: |
          El dominio está limitado por tres curvas. ¿Cómo se plantea la
          integral?
        opciones:
          - texto: >-
              Partiendo el intervalo en el punto donde se cruzan las dos
              tangentes: a la izquierda resta una, a la derecha la otra
            correcta: true
            mensaje: |
              Eso es. Las dos tangentes se cortan en un punto, y ese punto
              marca dónde cambia el borde inferior del dominio. Sin partir, la
              integral no representa la región.
          - texto: >-
              Restando las dos tangentes a la parábola en todo el intervalo
            mensaje: |
              Eso restaría dos veces. En cada tramo el borde inferior es **una**
              de las dos tangentes, no las dos.
          - texto: >-
              Integrando solo entre los dos puntos de tangencia
            mensaje: |
              Los límites sí son los dos puntos de tangencia, $x=-1$ y $x=2$.
              Pero entre medias hay que partir en el corte de las tangentes.

      - tipo: calcular
        titulo: Dónde se cortan las dos tangentes
        pregunta: |
          Las tangentes son $y=1$ e $y=6x-2$. ¿En qué $x$ se cortan?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.004
          formato: en forma exacta (1/2) o con un decimal
        distractores:
          - valor: '2'
            mensaje: |
              $x=2$ es el punto de **tangencia** de la segunda recta, no el
              corte entre las dos. Ahí la recta toca la parábola.
          - valor: '-1'
            mensaje: |
              $x=-1$ es el mínimo de la parábola, donde toca la primera
              tangente.
        pista: |
          $1 = 6x-2$.
        desarrollo: |
          El mínimo está en $x=-1$, con $y=1$: la tangente es $y=1$.

          La pendiente $6$ se alcanza donde $2x+2=6$, o sea $x=2$, con $y=10$:
          la tangente es $y=6\left(x-2\right)+10=6x-2$.

          $$
          1 = 6x-2 \;\Longrightarrow\; x=\frac12
          $$

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área de $D$?
        respuesta:
          tipo: numero
          valor: '2.25'
          tolerancia: 0.005
          formato: en forma exacta (9/4) o con dos decimales
        distractores:
          - valor: '1.125'
            mensaje: |
              $\tfrac98$ es solo **uno** de los dos trozos. Los dos valen lo
              mismo, y hay que sumarlos.
          - valor: '4.5'
            mensaje: |
              $\tfrac92$ es el doble: probablemente has contado cada trozo dos
              veces.
        pista: |
          Cada trozo es $\int\left(x-a\right)^{2}dx$ sobre un intervalo de
          longitud $\tfrac32$, y $\tfrac{\left(3/2\right)^{3}}{3}=\tfrac98$.
        desarrollo: |
          $$
          A = \int_{-1}^{1/2}\left(x+1\right)^{2}dx
          + \int_{1/2}^{2}\left(x-2\right)^{2}dx
          = \frac98+\frac98 = \frac94 = 2{,}25
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La diferencia entre una parábola y su tangente en $x=a$ es
              siempre $\left(x-a\right)^{2}$ cuando el coeficiente principal es
              $1$.
          - texto: >-
              Por eso el primer trozo integra $\left(x+1\right)^{2}$ y el
              segundo $\left(x-2\right)^{2}$.
          - texto: >-
              Las dos tangentes se cortan en $x=\tfrac12$, que es el punto
              medio de $-1$ y $2$.
          - texto: >-
              Y ese punto medio es una casualidad de este ejercicio.
            trampa: true
            mensaje: |
              **Siempre** pasa: dos tangentes a una parábola en $x=p$ y $x=q$
              se cortan en $x=\tfrac{p+q}{2}$. Es una propiedad general, y
              conviene saberla porque ahorra resolver el sistema.
        veredicto: |
          Dos hechos generales resuelven el ejercicio casi sin cuentas: la
          diferencia parábola-tangente es un cuadrado perfecto, y dos tangentes
          se cortan en la abscisa media de sus puntos de tangencia.
    resolucion: |
      **Resultado.** $A = \dfrac94 = 2{,}25$.

      ### 1 · Las dos tangentes

      | | dónde | punto | tangente |
      |---|---|---|---|
      | mínimo | $y'=2x+2=0 \Rightarrow x=-1$ | $\left(-1,1\right)$ | $y=1$ |
      | pendiente $6$ | $2x+2=6 \Rightarrow x=2$ | $\left(2,10\right)$ | $y=6x-2$ |

      Se cortan donde $1=6x-2$, o sea en $x=\tfrac12$ — el punto medio de $-1$
      y $2$, como tenía que ser.

      ### 2 · La propiedad que lo simplifica todo

      Para $y=x^{2}+bx+c$ y su tangente en $x=a$:

      $$
      \left(x^{2}+bx+c\right) - \left[\text{tangente en }a\right]
      = \left(x-a\right)^{2}
      $$

      Es exactamente el resto de Taylor de segundo orden, y aquí es **exacto**
      porque la función es un polinomio de grado dos. Comprobación con $a=-1$:

      $$
      x^{2}+2x+2-1 = x^{2}+2x+1 = \left(x+1\right)^{2} \;\checkmark
      $$

      y con $a=2$: $x^{2}+2x+2-\left(6x-2\right) = x^{2}-4x+4 = \left(x-2\right)^{2}$ ✓

      ### 3 · La integral, partida en dos

      $$
      A = \int_{-1}^{1/2}\left(x+1\right)^{2}dx
      + \int_{1/2}^{2}\left(x-2\right)^{2}dx
      $$

      $$
      = \left[\frac{\left(x+1\right)^{3}}{3}\right]_{-1}^{1/2}
      + \left[\frac{\left(x-2\right)^{3}}{3}\right]_{1/2}^{2}
      = \frac{\left(3/2\right)^{3}}{3} + \frac{\left(3/2\right)^{3}}{3}
      = \frac98+\frac98 = \frac94
      $$

      Los dos trozos valen lo mismo, y no es casualidad: la figura es simétrica
      respecto de la vertical $x=\tfrac12$.

      ### 4 · El caso general, de regalo

      El área encerrada entre una parábola $y=x^{2}+\dots$ y sus tangentes en
      $x=p$ y $x=q$ vale

      $$
      A = \frac{\left(q-p\right)^{3}}{12}
      $$

      Aquí $q-p=3$ y $\tfrac{27}{12}=\tfrac94$ ✓. Con esa fórmula el ejercicio
      se responde en una línea.

      **Lo que hay que llevarse.** Cuando el borde inferior de una región
      cambia a mitad de camino, hay que partir la integral ahí. Y en las
      parábolas conviene recordar las dos propiedades: la diferencia con la
      tangente es un cuadrado perfecto, y las tangentes se cortan en la abscisa
      media.

  - id: area-volumen-y-perimetro-de-un-mismo-dominio
    titulo: Área, volumen y perímetro del mismo dominio
    fuente: Aplicaciones de la integral, problema 3 · Problemas, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Sea $D$ el dominio limitado por las condiciones $y\le x$, $y\ge x^{2}$,
      $x=0$, $x=1$.

      (a) Dibujar $D$. &nbsp; (b) Calcular el área de $D$. &nbsp;
      (c) Calcular el volumen generado al girar $D$ alrededor del eje $OX$.
      &nbsp; (d) Calcular el perímetro de $D$.
    pide: El área, el volumen y el perímetro.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para el volumen al girar alrededor de $OX$, ¿qué integrando hay que
          usar?
        opciones:
          - texto: >-
              $\pi\left(x^{2}-x^{4}\right)$: el disco exterior menos el
              interior, porque el dominio no toca el eje
            correcta: true
            mensaje: |
              Eso es, el método de las **arandelas**. El dominio está entre dos
              curvas, así que al girar deja un agujero en el medio y hay que
              restar el disco interior.
          - texto: >-
              $\pi\left(x-x^{2}\right)^{2}$, el cuadrado de la altura
            mensaje: |
              El cuadrado de la diferencia no es la diferencia de los
              cuadrados. Cada radio se eleva al cuadrado **por separado** y
              después se restan.
          - texto: >-
              $\pi x^{2}$, el radio exterior
            mensaje: |
              Eso daría el volumen del cono macizo bajo $y=x$, incluyendo el
              hueco que deja la parábola.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen generado al girar $D$ alrededor de $OX$?
        respuesta:
          tipo: numero
          valor: '0.418879'
          tolerancia: 0.0009
          formato: con seis decimales
        distractores:
          - valor: '1.047198'
            mensaje: |
              $\tfrac\pi3$ es el volumen del cono entero, sin restar el hueco
              de la parábola.
          - valor: '0.104720'
            mensaje: |
              $\tfrac{\pi}{30}$ sale de integrar
              $\left(x-x^{2}\right)^{2}$, que es el error de elevar al
              cuadrado la diferencia en vez de restar los cuadrados.
        pista: |
          $\pi\left(\tfrac13-\tfrac15\right) = \tfrac{2\pi}{15}$.
        desarrollo: |
          $$
          B = \pi\int_{0}^{1}\left(x^{2}-x^{4}\right)dx
          = \pi\left(\frac13-\frac15\right) = \frac{2\pi}{15}
          \approx 0{,}418879
          $$

      - tipo: calcular
        titulo: El perímetro
        pregunta: |
          ¿Cuánto vale el perímetro de $D$?
        respuesta:
          tipo: numero
          valor: '2.893156'
          tolerancia: 0.006
          formato: con seis decimales
        distractores:
          - valor: '1.414214'
            mensaje: |
              $\sqrt2$ es solo el lado recto, la diagonal $y=x$. Falta el arco
              de parábola, que mide algo más.
          - valor: '2.828427'
            mensaje: |
              $2\sqrt2$ supone que el arco de parábola mide lo mismo que la
              recta. Mide un poco más: $1{,}479$.
        pista: |
          $\sqrt2 + \tfrac14\left(2\sqrt5+\operatorname{argsh}2\right)$, y
          $\operatorname{argsh}2\approx1{,}4436$.
        desarrollo: |
          $$
          P = \sqrt2 + \int_{0}^{1}\sqrt{1+4x^{2}}\,dx
          = \sqrt2 + \frac{2\sqrt5+\operatorname{argsh}2}{4}
          \approx 1{,}414214 + 1{,}478943 = 2{,}893156
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento del perímetro. Una pieza es falsa.
        piezas:
          - texto: >-
              El dominio tiene solo dos bordes: el segmento $y=x$ y el arco
              $y=x^{2}$, ambos de $\left(0,0\right)$ a $\left(1,1\right)$.
          - texto: >-
              La longitud de un arco $y=f(x)$ es
              $\int\sqrt{1+f'(x)^{2}}\,dx$.
          - texto: >-
              Para $y=x^{2}$ eso es $\int_{0}^{1}\sqrt{1+4x^{2}}\,dx$, que con
              $u=2x$ se reduce a
              $\tfrac12\int_{0}^{2}\sqrt{1+u^{2}}\,du$.
          - texto: >-
              Y hay que añadir los lados $x=0$ y $x=1$, que también son bordes
              del dominio.
            trampa: true
            mensaje: |
              No lo son: las dos curvas se cortan justo en $x=0$ y en $x=1$, así
              que las verticales del enunciado se reducen a dos **puntos**, de
              longitud cero. El dominio es una lúnula con solo dos bordes.
        veredicto: |
          Antes de sumar longitudes hay que mirar el dibujo: aquí las
          condiciones $x=0$ y $x=1$ no aportan lado, porque las dos curvas ya
          se cortan ahí.
      - tipo: dibujar
        consigna: |
          Dibuja el dominio $D$ en el plano $XY$, con las dos curvas y sus dos
          puntos de corte. Señala cuál es el borde superior y cuál el inferior.
        comprueba:
          - punto: |
              La recta $y=x$ **por encima** y la parábola $y=x^{2}$ **por
              debajo**, en todo $\left(0,1\right)$.
            porque: |
              Entre $0$ y $1$ el cuadrado empequeñece. Confundir cuál va arriba
              invierte el signo del área.
          - punto: |
              Los dos cortes exactamente en $\left(0,0\right)$ y
              $\left(1,1\right)$.
            porque: |
              Las condiciones $x=0$ y $x=1$ del enunciado no recortan nada: las
              curvas ya se tocan ahí. Dibujar lados verticales sería añadir
              bordes que no existen, y el apartado (d) los contaría.
          - punto: |
              Una lente delgada, con anchura máxima $\tfrac14$ en
              $x=\tfrac12$.
            porque: |
              Es la diferencia $x-x^{2}$ en su máximo. Da la escala del dibujo y
              explica que el área sea solo $\tfrac16$.
          - punto: |
              Que el dominio **no toca** el eje $OX$ salvo en el origen.
            porque: |
              Al girar deja un hueco, así que el volumen es de arandelas. Es lo
              que el apartado (c) necesita saber antes de plantear la integral.
        veredicto: |
          El perímetro solo tiene dos lados, porque las verticales del enunciado
          se reducen a puntos. Contarlas como lados es el error que el dibujo
          impide, y vale la mitad del apartado (d).

    resolucion: |
      **Resultados.**

      $$
      A = \frac16
      \qquad
      B = \frac{2\pi}{15} \approx 0{,}4189
      \qquad
      P = \sqrt2 + \frac{2\sqrt5+\operatorname{argsh}2}{4} \approx 2{,}8932
      $$

      ### 1 · El dominio

      Entre $y=x^{2}$ (abajo) y $y=x$ (arriba), de $x=0$ a $x=1$. Las dos
      curvas se cortan exactamente en los extremos, así que las condiciones
      $x=0$ y $x=1$ **no recortan nada**: la región es la lúnula clásica entre
      recta y parábola.

      ### 2 · El área

      $$
      A = \int_{0}^{1}\left(x-x^{2}\right)dx = \frac12-\frac13 = \frac16
      $$

      ### 3 · El volumen, por arandelas

      El dominio no toca el eje $OX$ salvo en los extremos, así que al girar
      queda un hueco:

      $$
      B = \pi\int_{0}^{1}\left[\left(x\right)^{2}-\left(x^{2}\right)^{2}
      \right]dx
      = \pi\int_{0}^{1}\left(x^{2}-x^{4}\right)dx
      = \pi\left(\frac13-\frac15\right) = \frac{2\pi}{15}
      $$

      **El error clásico** es integrar $\pi\left(x-x^{2}\right)^{2}$, que daría
      $\tfrac{\pi}{30}$ — la mitad de lo correcto. La diferencia de cuadrados
      no es el cuadrado de la diferencia.

      ### 4 · El perímetro

      **El lado recto.** De $\left(0,0\right)$ a $\left(1,1\right)$ sobre
      $y=x$: longitud $\sqrt2$.

      **El arco de parábola.** Con $y'=2x$:

      $$
      L = \int_{0}^{1}\sqrt{1+4x^{2}}\,dx
      \;\overset{u=2x}{=}\;
      \frac12\int_{0}^{2}\sqrt{1+u^{2}}\,du
      $$

      $$
      = \frac12\left[\frac{u\sqrt{1+u^{2}}+\operatorname{argsh}u}{2}
      \right]_{0}^{2}
      = \frac{2\sqrt5+\operatorname{argsh}2}{4} \approx 1{,}478943
      $$

      $$
      P = \sqrt2 + \frac{2\sqrt5+\operatorname{argsh}2}{4}
      \approx 2{,}893156
      $$

      ### 5 · Que los tres números son coherentes

      - El área, $\tfrac16\approx0{,}167$, es pequeña: la lúnula es delgada, con
        anchura máxima $\tfrac14$ en $x=\tfrac12$.
      - El arco de parábola mide $1{,}479$, un poco más que la cuerda recta
        $\sqrt2\approx1{,}414$ — tiene que ser así, porque la recta es el
        camino más corto entre los mismos extremos.

      **Lo que hay que llevarse.** Tres preguntas y tres integrales distintas
      sobre el mismo dominio: $y$ para el área, $\pi y^{2}$ —restando— para el
      volumen, y $\sqrt{1+y'^{2}}$ para la longitud. Y antes de sumar bordes,
      mirar cuáles existen de verdad.

  - id: la-raiz-contra-el-valor-absoluto
    titulo: Una raíz contra un valor absoluto, y dónde se cruzan
    fuente: Aplicaciones de la integral, problema 4 · Problemas, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Sea $D$ el dominio limitado por la gráfica de la función
      $y=\sqrt{\dfrac{x}{2}}$ y la condición $y\ge\left\lvert1-x\right\rvert$,
      con $0\le x\le 2$.

      (a) Dibujar $D$. &nbsp; (b) Calcular el área de $D$. &nbsp;
      (c) Calcular el volumen generado al girar $D$ alrededor del eje $OX$.
    pide: El área y el volumen.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Entre qué valores de $x$ existe realmente el dominio?
        opciones:
          - texto: >-
              Entre $x=\tfrac12$ y $x=2$, que es donde la raíz queda por encima
              de la uve
            correcta: true
            mensaje: |
              Eso es. El enunciado dice $0\le x\le2$, pero para $x<\tfrac12$ la
              uve va por encima de la raíz y no hay región. **Los límites reales
              los marcan los cortes**, no el enunciado.
          - texto: >-
              Entre $0$ y $2$, como dice el enunciado
            mensaje: |
              En $x=0$ la raíz vale $0$ y $\lvert1-x\rvert$ vale $1$: la
              condición $y\ge\lvert1-x\rvert$ no se puede cumplir por debajo de
              la raíz. Ahí el dominio está vacío.
          - texto: >-
              Entre $1$ y $2$, a partir del vértice de la uve
            mensaje: |
              El corte de la izquierda está en $x=\tfrac12$, antes del vértice.
              Se obtiene resolviendo $\sqrt{\tfrac x2}=1-x$.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área de $D$?
        respuesta:
          tipo: numero
          valor: '0.541667'
          tolerancia: 0.0011
          formato: con seis decimales
        distractores:
          - valor: '1.166667'
            mensaje: |
              $\tfrac76$ es solo $\int_{1/2}^{2}\sqrt{\tfrac x2}\,dx$: falta
              restar el área bajo la uve, que son $\tfrac18+\tfrac12$.
          - valor: '0.666667'
            mensaje: |
              $\tfrac23$ saldría de restar solo uno de los dos trozos de la
              uve. Hay que restar los dos: el de bajada y el de subida.
        pista: |
          $\tfrac76-\tfrac18-\tfrac12 = \tfrac{13}{24}$.
        desarrollo: |
          $$
          A = \int_{1/2}^{2}\sqrt{\frac x2}\,dx
          - \int_{1/2}^{1}\left(1-x\right)dx
          - \int_{1}^{2}\left(x-1\right)dx
          $$

          $$
          = \frac76 - \frac18 - \frac12 = \frac{13}{24}
          \approx 0{,}541667
          $$

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen generado al girar $D$ alrededor de $OX$?
        respuesta:
          tipo: numero
          valor: '1.767146'
          tolerancia: 0.0036
          formato: con seis decimales
        distractores:
          - valor: '2.945243'
            mensaje: |
              $\tfrac{15\pi}{16}$ sería el disco exterior sin restar el
              interior. El dominio tiene la uve por debajo, y eso deja hueco.
          - valor: '0.920388'
            mensaje: |
              Ese número sale de elevar al cuadrado la **diferencia** de las
              dos funciones en vez de restar sus cuadrados.
        pista: |
          $\pi\displaystyle\int_{1/2}^{2}\left[\tfrac x2 -\left(1-x\right)^{2}\right]dx$, y el corchete integra a
          $\tfrac{9}{16}$.
        desarrollo: |
          $$
          B = \pi\int_{1/2}^{2}\left[\frac{x}{2}
          -\left(x-1\right)^{2}\right]dx
          = \pi\left(\frac{15}{16}-\frac38\right)
          = \frac{9\pi}{16} \approx 1{,}767146
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Los cortes salen de $\sqrt{\tfrac x2}=\lvert1-x\rvert$, que
              elevando al cuadrado da $2x^{2}-5x+2=0$ en los dos casos.
          - texto: >-
              Las raíces son $x=\tfrac12$ y $x=2$, y las dos son válidas: una
              está a la izquierda del vértice y la otra a la derecha.
          - texto: >-
              Entre esos dos valores la raíz va por encima, así que el dominio
              es la región entre las dos gráficas.
          - texto: >-
              Y como el valor absoluto cambia de rama en $x=1$, hay que partir
              también la integral del volumen.
            trampa: true
            mensaje: |
              Para el **volumen** no hace falta: el integrando lleva
              $\lvert1-x\rvert^{2}=\left(x-1\right)^{2}$, y el cuadrado borra
              el valor absoluto. Es una sola integral. Para el **área** sí hay
              que partir, porque ahí el valor absoluto aparece a la primera.
        veredicto: |
          El cuadrado del método de discos elimina el valor absoluto, así que
          el volumen es una integral sola mientras que el área necesita dos.
          Notarlo ahorra la mitad del trabajo en el apartado (c).
      - tipo: dibujar
        consigna: |
          Dibuja el dominio $D$ en el plano $XY$: la raíz, la uve del valor
          absoluto y la región entre ellas. Marca los dos cortes.
        comprueba:
          - punto: |
              La curva $y=\sqrt{x/2}$, creciente y cóncava, de
              $\left(0,0\right)$ a $\left(2,1\right)$.
            porque: |
              El $\tfrac12$ de dentro la aplana: en $x=2$ vale $1$, no
              $\sqrt2$. Es el factor que más se olvida.
          - punto: |
              La uve $y=\lvert1-x\rvert$, con el vértice en $\left(1,0\right)$ y
              los extremos en $\left(0,1\right)$ y $\left(2,1\right)$.
            porque: |
              Baja de $1$ a $0$ y vuelve a subir a $1$. El vértice es donde el
              valor absoluto cambia de rama, y es la punta inferior del dominio.
          - punto: |
              Los cortes en $\left(\tfrac12,\tfrac12\right)$ y
              $\left(2,1\right)$.
            porque: |
              Salen de $2x^{2}-5x+2=0$, cuyas raíces son $\tfrac12$ y $2$. El
              dominio **no** empieza en $x=0$, aunque el enunciado diga
              $0\le x\le2$.
          - punto: |
              El dominio con forma de hoja, entre $x=\tfrac12$ y $x=2$, con la
              punta inferior tocando el eje en $\left(1,0\right)$.
            porque: |
              Que el dominio toque el eje en un punto es lo que hace que al girar
              el sólido se estrangule ahí, y es información que solo da el
              dibujo.
        veredicto: |
          Los límites de integración los dan los cortes, no el enunciado. Aquí el
          intervalo real es $\left[\tfrac12,2\right]$, y empezar en $0$ añadiría
          área que no existe.

    resolucion: |
      **Resultados.** $A = \dfrac{13}{24}\approx0{,}5417$ y
      $B = \dfrac{9\pi}{16}\approx1{,}7671$.

      ### 1 · Los cortes

      $$
      \sqrt{\frac x2} = \left\lvert1-x\right\rvert
      \;\Longrightarrow\;
      \frac x2 = \left(1-x\right)^{2}
      \;\Longrightarrow\;
      2x^{2}-5x+2 = 0
      $$

      $$
      x = \frac{5\pm3}{4} = 2 \;\text{ o }\; \frac12
      $$

      Las dos valen: $\tfrac12$ está en la rama izquierda de la uve y $2$ en la
      derecha. **El dominio vive entre $\tfrac12$ y $2$**, no entre $0$ y $2$.

      ### 2 · El dibujo

      La raíz $y=\sqrt{x/2}$ sube despacio de $0$ a $1$. La uve
      $y=\lvert1-x\rvert$ baja de $1$ a $0$ y vuelve a subir hasta $1$. Se
      cortan en $\left(\tfrac12,\tfrac12\right)$ y en $\left(2,1\right)$, y
      entre medias la raíz va por encima. La región tiene forma de hoja, con la
      punta inferior justo en el vértice de la uve, $\left(1,0\right)$.

      ### 3 · El área, en tres trozos

      $$
      \int_{1/2}^{2}\sqrt{\frac x2}\,dx
      = \frac{2}{3\sqrt2}\left[x^{3/2}\right]_{1/2}^{2}
      = \frac76
      $$

      $$
      \int_{1/2}^{1}\left(1-x\right)dx = \frac18
      \qquad
      \int_{1}^{2}\left(x-1\right)dx = \frac12
      $$

      $$
      A = \frac76-\frac18-\frac12 = \frac{28-3-12}{24} = \frac{13}{24}
      $$

      ### 4 · El volumen, en una sola integral

      $$
      B = \pi\int_{1/2}^{2}\left[\left(\sqrt{\frac x2}\right)^{2}
      -\left\lvert1-x\right\rvert^{2}\right]dx
      = \pi\int_{1/2}^{2}\left[\frac{x}{2}-\left(x-1\right)^{2}\right]dx
      $$

      El valor absoluto desaparece al elevarlo al cuadrado, y por eso no hay
      que partir.

      $$
      = \pi\left[\frac{x^{2}}{4}-\frac{\left(x-1\right)^{3}}{3}
      \right]_{1/2}^{2}
      = \pi\left(1-\frac13\right)-\pi\left(\frac1{16}+\frac1{24}\right)
      = \frac{9\pi}{16}
      $$

      **Lo que hay que llevarse.** Los límites de integración no los da el
      enunciado: los dan los cortes. Y una vez planteado el volumen, mirar si
      el cuadrado simplifica el integrando — aquí borra un valor absoluto y
      convierte dos integrales en una.

  - id: entre-la-hiperbola-y-la-bisectriz
    titulo: Entre la hipérbola y la bisectriz, y el logaritmo que aparece
    fuente: Aplicaciones de la integral, problema 5 · Problemas, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Sea $D$ el dominio limitado por las condiciones $y\ge\dfrac1x$,
      $y\le x$, $x=1$, $x=2$.

      (a) Dibujar $D$. &nbsp; (b) Calcular el área de $D$. &nbsp;
      (c) Calcular el volumen generado al girar $D$ alrededor del eje $OX$.
    pide: El área y el volumen.
    pasos:
      - tipo: reconocer
        pregunta: |
          En $x=1$ las dos curvas valen $1$. ¿Qué significa para el dominio?
        opciones:
          - texto: >-
              Que el dominio arranca **en punta**: en $x=1$ tiene altura cero y
              se abre hacia la derecha
            correcta: true
            mensaje: |
              Eso es. La condición $x=1$ no recorta nada, porque las dos curvas
              ya se tocan ahí. El único borde vertical de verdad es $x=2$.
          - texto: >-
              Que el dominio está vacío
            mensaje: |
              Solo en ese punto. Para $x>1$, $x$ crece y $\tfrac1x$ decrece, así
              que se separan y hay región entre ellas.
          - texto: >-
              Que hay que integrar desde $x=0$
            mensaje: |
              En $\left(0,1\right)$ la hipérbola va por **encima** de la
              bisectriz, así que la condición $y\ge\tfrac1x$ e $y\le x$ es
              imposible ahí.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área de $D$?
        respuesta:
          tipo: numero
          valor: '0.806853'
          tolerancia: 0.0016
          formato: con seis decimales
        distractores:
          - valor: '1.500000'
            mensaje: |
              $\tfrac32$ es $\int_{1}^{2}x\,dx$: falta restar el área bajo la
              hipérbola, que vale $\ln 2$.
          - valor: '0.693147'
            mensaje: |
              $\ln 2$ es justo lo que hay que **restar**, no el resultado.
        pista: |
          $\tfrac32-\ln 2$, y $\ln 2\approx0{,}6931$.
        desarrollo: |
          $$
          A = \int_{1}^{2}\left(x-\frac1x\right)dx
          = \left[\frac{x^{2}}{2}-\ln x\right]_{1}^{2}
          = \left(2-\ln 2\right)-\frac12 = \frac32-\ln 2
          \approx 0{,}806853
          $$

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen generado al girar $D$ alrededor de $OX$?
        respuesta:
          tipo: numero
          valor: '5.759587'
          tolerancia: 0.012
          formato: con seis decimales
        distractores:
          - valor: '7.330383'
            mensaje: |
              $\tfrac{7\pi}{3}$ es el disco exterior solo,
              $\pi\int_{1}^{2}x^{2}dx$. Falta restar el hueco de la hipérbola.
          - valor: '2.534518'
            mensaje: |
              Eso sale de elevar al cuadrado la diferencia
              $\left(x-\tfrac1x\right)$ en vez de restar los cuadrados.
        pista: |
          $\pi\left[\tfrac{x^{3}}{3}+\tfrac1x\right]_{1}^{2}$, y la resta da
          $\tfrac{11}{6}$.
        desarrollo: |
          $$
          B = \pi\int_{1}^{2}\left(x^{2}-\frac{1}{x^{2}}\right)dx
          = \pi\left[\frac{x^{3}}{3}+\frac1x\right]_{1}^{2}
          = \pi\left(\frac83+\frac12-\frac13-1\right)
          = \frac{11\pi}{6} \approx 5{,}759587
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              En $\left[1,2\right]$ la bisectriz va por encima de la hipérbola,
              así que la altura de cada franja es $x-\tfrac1x$.
          - texto: >-
              El área es $\int_{1}^{2}\left(x-\tfrac1x\right)dx = \tfrac32-\ln 2$.
          - texto: >-
              Para el volumen, arandelas: radio exterior $x$, interior
              $\tfrac1x$, y el integrando es
              $\pi\left(x^{2}-\tfrac1{x^{2}}\right)$.
          - texto: >-
              Y como $\int\tfrac{dx}{x^{2}}$ vuelve a dar un logaritmo, el
              volumen también lleva un $\ln 2$.
            trampa: true
            mensaje: |
              $\int\tfrac{dx}{x^{2}} = -\tfrac1x$, no un logaritmo. Solo
              $\tfrac1x$ da logaritmo. Por eso el área lleva $\ln 2$ y el
              volumen sale **racional por completo**: $\tfrac{11\pi}{6}$.
        veredicto: |
          Elevar al cuadrado cambia $\tfrac1x$ por $\tfrac1{x^{2}}$, y con ello
          desaparece el logaritmo. Es la diferencia entre un área con $\ln 2$ y
          un volumen limpio.
      - tipo: dibujar
        consigna: |
          Dibuja el dominio $D$ en el plano $XY$, con la bisectriz, la hipérbola
          y el lado vertical. Marca el vértice donde se cierra.
        comprueba:
          - punto: |
              La bisectriz $y=x$ **por encima** y la hipérbola $y=\tfrac1x$ **por
              debajo** en todo $\left(1,2\right]$.
            porque: |
              Se cortan en $x=1$, y a partir de ahí una sube y la otra baja. Si
              en tu dibujo se cruzan otra vez, la hipérbola está mal.
          - punto: |
              El vértice izquierdo en $\left(1,1\right)$, donde el dominio se
              cierra en punta.
            porque: |
              La condición $x=1$ del enunciado no añade ningún lado: las dos
              curvas ya coinciden ahí. Dibujar una vertical sería inventar un
              borde.
          - punto: |
              El lado derecho vertical en $x=2$, de $y=\tfrac12$ a $y=2$.
            porque: |
              Es el único borde recto de la figura, y mide $\tfrac32$: la altura
              máxima del dominio.
          - punto: |
              Que el dominio **no toca** el eje $OX$.
            porque: |
              La hipérbola se mantiene por encima de $\tfrac12$. Al girar queda
              un agujero, así que el volumen es de arandelas.
        veredicto: |
          Una cuña que se abre de izquierda a derecha, de altura $0$ a
          $\tfrac32$. Esa forma explica los dos resultados: un área pequeña, con
          logaritmo, y un volumen limpio sin él.

    resolucion: |
      **Resultados.** $A = \dfrac32-\ln 2\approx0{,}8069$ y
      $B = \dfrac{11\pi}{6}\approx5{,}7596$.

      ### 1 · El dominio

      La bisectriz $y=x$ y la hipérbola $y=\tfrac1x$ se cortan en
      $\left(1,1\right)$. A partir de ahí la bisectriz sube y la hipérbola
      baja, así que la región se abre en cuña hasta $x=2$, donde va de
      $y=\tfrac12$ a $y=2$.

      La condición $x=1$ **no recorta nada**: es el punto donde las curvas se
      tocan. El único lado vertical es el de la derecha.

      ### 2 · El área

      $$
      A = \int_{1}^{2}\left(x-\frac1x\right)dx
      = \left[\frac{x^{2}}{2}-\ln x\right]_{1}^{2}
      = \frac32-\ln 2 \approx 0{,}8069
      $$

      ### 3 · El volumen, por arandelas

      $$
      B = \pi\int_{1}^{2}\left(x^{2}-\frac{1}{x^{2}}\right)dx
      = \pi\left[\frac{x^{3}}{3}+\frac1x\right]_{1}^{2}
      $$

      $$
      = \pi\left(\frac83+\frac12\right)-\pi\left(\frac13+1\right)
      = \pi\left(\frac{19}{6}-\frac43\right) = \frac{11\pi}{6}
      $$

      Atención al signo: la primitiva de $-\tfrac1{x^{2}}$ es $+\tfrac1x$.

      ### 4 · El logaritmo que aparece y desaparece

      | | integrando | primitiva |
      |---|---|---|
      | área | $\tfrac1x$ | $\ln x$ |
      | volumen | $\tfrac1{x^{2}}$ | $-\tfrac1x$ |

      El área lleva un logaritmo y el volumen no, y la razón es sencilla: al
      elevar el radio al cuadrado, $\tfrac1x$ se convierte en
      $\tfrac1{x^{2}}$, que ya no es el caso excepcional de la regla de la
      potencia.

      **Lo que hay que llevarse.** Cuando el dominio está entre dos curvas y
      ninguna toca el eje, el volumen es de arandelas: cuadrado exterior menos
      cuadrado interior. Y merece la pena mirar qué condiciones del enunciado
      recortan de verdad — aquí, solo una de las dos verticales.

  - id: la-parabola-tumbada-y-el-parametro-del-area
    titulo: Una parábola tumbada, y un parámetro que fija el área
    fuente: Aplicaciones de la integral, problemas 6 y 7 · Problemas, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      **Problema 6.** Sea $D$ el dominio limitado por las condiciones
      $y^{2}=4+x$ y $x=2$.

      (a) Dibujar $D$. &nbsp; (b) Calcular el área de $D$. &nbsp;
      (c) Calcular el volumen generado al girar $D$ alrededor del eje $OX$.

      **Problema 7.** El área limitada por las gráficas de las funciones
      $y=ax$ e $y=x^{2}$ es $\dfrac92$. Calcular el valor de $a$.
    pide: El área y el volumen del problema 6, y el parámetro del 7.
    pasos:
      - tipo: reconocer
        pregunta: |
          $y^{2}=4+x$ es una parábola tumbada. ¿Cómo conviene integrar el área?
        opciones:
          - texto: >-
              Respecto de $y$: franjas horizontales de longitud
              $2-\left(y^{2}-4\right)$
            correcta: true
            mensaje: |
              Eso es. Integrar respecto de $x$ obligaría a poner
              $y=\pm\sqrt{4+x}$ y duplicar la integral. Con franjas
              horizontales sale en una línea.
          - texto: >-
              Respecto de $x$, con $y=\sqrt{4+x}$
            mensaje: |
              Funciona, pero hay que acordarse de multiplicar por $2$ para
              contar la rama de abajo. Más corto es integrar en $y$.
          - texto: >-
              No se puede: no es una función
            mensaje: |
              No es función de $x$, pero sí lo es **de $y$**: $x=y^{2}-4$. Basta
              cambiar el papel de las variables.

      - tipo: calcular
        titulo: El área del problema 6
        pregunta: |
          ¿Cuánto vale el área de $D$?
        respuesta:
          tipo: numero
          valor: '19.595918'
          tolerancia: 0.04
          formato: con seis decimales
        distractores:
          - valor: '9.797959'
            mensaje: |
              $4\sqrt6$ es la mitad: has integrado solo la rama de arriba y no
              has duplicado.
          - valor: '14.696938'
            mensaje: |
              $6\sqrt6$ sale de olvidar el $\tfrac{y^{3}}{3}$ y quedarse con
              $6y$ solo.
        pista: |
          $\int_{-\sqrt6}^{\sqrt6}\left(6-y^{2}\right)dy = 8\sqrt6$, y
          $\sqrt6\approx2{,}449$.
        desarrollo: |
          $$
          A = \int_{-\sqrt6}^{\sqrt6}\left[2-\left(y^{2}-4\right)\right]dy
          = \left[6y-\frac{y^{3}}{3}\right]_{-\sqrt6}^{\sqrt6}
          = 8\sqrt6 \approx 19{,}595918
          $$

      - tipo: calcular
        titulo: El parámetro del problema 7
        pregunta: |
          ¿Cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '27'
            mensaje: |
              $27$ es $a^{3}$, no $a$. De $\tfrac{a^{3}}{6}=\tfrac92$ sale
              $a^{3}=27$ y hay que sacar la raíz cúbica.
          - valor: '4.5'
            mensaje: |
              $\tfrac92$ es el área, no el parámetro.
        pista: |
          El área entre $y=ax$ e $y=x^{2}$ es $\tfrac{a^{3}}{6}$.
        desarrollo: |
          Se cortan en $x=0$ y $x=a$:

          $$
          A = \int_{0}^{a}\left(ax-x^{2}\right)dx
          = \frac{a^{3}}{2}-\frac{a^{3}}{3} = \frac{a^{3}}{6}
          $$

          $$
          \frac{a^{3}}{6} = \frac92 \;\Longrightarrow\; a^{3}=27
          \;\Longrightarrow\; a=3
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento del volumen del problema 6. Una pieza es falsa.
        piezas:
          - texto: >-
              Al girar alrededor de $OX$, la sección en cada $x$ es un disco de
              radio $\sqrt{4+x}$, porque la parábola es simétrica respecto del
              eje.
          - texto: >-
              El volumen es entonces
              $\pi\int_{-4}^{2}\left(4+x\right)dx$.
          - texto: >-
              Y eso vale $\pi\left[4x+\tfrac{x^{2}}{2}\right]_{-4}^{2} = 18\pi$.
          - texto: >-
              Y hay que multiplicarlo por $2$, porque el dominio tiene dos
              mitades, una encima del eje y otra debajo.
            trampa: true
            mensaje: |
              No: al girar, la mitad de abajo **barre el mismo sólido** que la
              de arriba. Duplicar contaría dos veces el mismo volumen. En el
              área sí hay que contar las dos mitades, porque están una al lado
              de la otra; al girar se superponen.
        veredicto: |
          La simetría respecto del eje de giro duplica el área pero **no** el
          volumen: las dos mitades generan el mismo sólido. Es el error más
          repetido en las figuras simétricas.
      - tipo: dibujar
        consigna: |
          Dibuja los dos dominios en ejes separados: el del problema 6 —parábola
          tumbada y recta vertical— y el del problema 7 con $a=3$.
        comprueba:
          - punto: |
              En el 6, la parábola $y^{2}=4+x$ **tumbada**, abierta hacia la
              derecha, con el vértice en $\left(-4,0\right)$.
            porque: |
              La $y$ está al cuadrado, así que el eje de la parábola es
              horizontal. Dibujarla abierta hacia arriba es el error clásico de
              las cónicas escritas al revés.
          - punto: |
              El corte con $x=2$ en $\left(2,\pm\sqrt6\right)$, con
              $\sqrt6\approx2{,}45$.
            porque: |
              Son los dos extremos de la hoja, y fijan la escala vertical. Sin
              ellos el dibujo no dice cuánto mide el dominio.
          - punto: |
              En el 7, la recta $y=3x$ **por encima** de la parábola $y=x^{2}$
              entre $x=0$ y $x=3$.
            porque: |
              Se cortan en $0$ y en $a=3$. El parámetro es exactamente la
              abscisa del segundo corte, y verlo así explica que el área dependa
              de $a^{3}$.
          - punto: |
              En el 7, que el dominio es una lente con anchura máxima
              $\tfrac94$ en $x=\tfrac32$.
            porque: |
              Es la diferencia $3x-x^{2}$ en su máximo. Da la escala y hace
              plausible que el área sea $\tfrac92$.
        veredicto: |
          El problema 6 se integra en $y$ —franjas horizontales— y el 7 en $x$ —
          franjas verticales—. Cada figura pide su variable, y el dibujo es donde
          se decide cuál.

    resolucion: |
      **Resultados.** Problema 6: $A = 8\sqrt6\approx19{,}596$ y
      $B = 18\pi\approx56{,}549$. Problema 7: $a=3$.

      ### 1 · El problema 6: el dominio

      $y^{2}=4+x$ es una parábola con el eje horizontal y el vértice en
      $\left(-4,0\right)$, abierta hacia la derecha. Cortada por $x=2$, deja
      una región cerrada en forma de hoja, con los extremos en
      $\left(2,\pm\sqrt6\right)$.

      ### 2 · El área, en $y$

      $$
      A = \int_{-\sqrt6}^{\sqrt6}\left[2-\left(y^{2}-4\right)\right]dy
      = \int_{-\sqrt6}^{\sqrt6}\left(6-y^{2}\right)dy
      $$

      $$
      = 2\left[6y-\frac{y^{3}}{3}\right]_{0}^{\sqrt6}
      = 2\left(6\sqrt6-2\sqrt6\right) = 8\sqrt6 \approx 19{,}596
      $$

      ### 3 · El volumen, en $x$

      Al girar alrededor de $OX$, cada sección vertical es un disco lleno de
      radio $\sqrt{4+x}$:

      $$
      B = \pi\int_{-4}^{2}\left(4+x\right)dx
      = \pi\left[4x+\frac{x^{2}}{2}\right]_{-4}^{2}
      = \pi\left(10+8\right) = 18\pi
      $$

      **Sin duplicar**: la mitad inferior del dominio genera exactamente el
      mismo sólido que la superior.

      ### 4 · El problema 7

      $y=ax$ e $y=x^{2}$ se cortan donde $ax=x^{2}$, o sea en $x=0$ y $x=a$.
      Para que haya región cerrada hace falta $a>0$, y entonces la recta va por
      encima:

      $$
      A = \int_{0}^{a}\left(ax-x^{2}\right)dx
      = \frac{a^{3}}{2}-\frac{a^{3}}{3} = \frac{a^{3}}{6}
      $$

      $$
      \frac{a^{3}}{6} = \frac92
      \;\Longrightarrow\;
      a^{3} = 27
      \;\Longrightarrow\;
      a = 3
      $$

      Y merece la pena quedarse con la fórmula $A=\tfrac{a^{3}}{6}$: el área
      crece con el **cubo** del parámetro, así que duplicar $a$ multiplica el
      área por ocho.

      **Lo que hay que llevarse.** Elegir la variable de integración según cómo
      esté tumbada la figura, y no duplicar volúmenes por simetría cuando el
      eje de simetría es el eje de giro. Y en los problemas con parámetro,
      dejar el área en función de él antes de sustituir el dato.

  - id: la-longitud-que-el-boletin-deja-a-medias
    titulo: Una longitud de arco que el boletín deja a medias, y dos elipsoides
    fuente: >-
      Aplicaciones de la integral, problemas 8 y 9 · Problemas, tema 5 ·
      Cálculo, UPV/EHU · La longitud impresa del problema 8 es argsh 3
      partido por dos, unos 0,91, y el arco une dos puntos que distan 3: no
      puede medir menos. La que sale es (3·raíz de 10 + argsh 3)/2, unos
      5,65, y está en la resolución.
    nivel: practica
    enunciado: |
      **Problema 8.** Calcular la longitud del arco $y=x^{2}+x-2$ con
      $x\in\left[-2,1\right]$.

      **Problema 9.** (a) Calcular el volumen del elipsoide generado al girar
      la elipse $\dfrac{x^{2}}{25}+y^{2}=1$ alrededor del eje $OX$.
      &nbsp; (b) Lo mismo alrededor del eje $OY$.
    pide: La longitud del arco y los dos volúmenes.
    pasos:
      - tipo: reconocer
        pregunta: |
          El mismo elipsoide, dos ejes de giro y dos volúmenes distintos. ¿Por
          qué?
        opciones:
          - texto: >-
              Porque no es el mismo sólido: girando en torno a $OX$ sale un
              balón alargado y en torno a $OY$ uno achatado
            correcta: true
            mensaje: |
              Eso es. Con $a=5$ y $b=1$, la fórmula $\tfrac43\pi a b^{2}$ da
              $\tfrac{20\pi}{3}$ girando en $OX$, y $\tfrac43\pi a^{2}b$ da
              $\tfrac{100\pi}{3}$ girando en $OY$: el semieje que se repite es
              el perpendicular al eje de giro.
          - texto: >-
              Porque uno de los dos cálculos está mal
            mensaje: |
              Los dos son correctos. La misma curva plana genera sólidos
              distintos según el eje alrededor del cual gire.
          - texto: >-
              Porque la elipse no es simétrica
            mensaje: |
              Sí lo es, respecto de los dos ejes. Lo que cambia es cuál de los
              dos semiejes barre el círculo y cuál queda como longitud.

      - tipo: calcular
        titulo: La longitud del arco
        pregunta: |
          ¿Cuánto mide el arco $y=x^{2}+x-2$ entre $x=-2$ y $x=1$?
        respuesta:
          tipo: numero
          valor: '5.652640'
          tolerancia: 0.012
          formato: con seis decimales
        distractores:
          - valor: '0.909223'
            mensaje: |
              $\tfrac{\operatorname{argsh}3}{2}$ es lo que imprime el boletín, y
              es imposible: el arco va de $\left(-2,0\right)$ a
              $\left(1,0\right)$, así que **mide al menos $3$**.
          - valor: '3.000000'
            mensaje: |
              $3$ es la distancia en línea recta entre los extremos. La curva es
              más larga.
        pista: |
          $\int_{-2}^{1}\sqrt{1+\left(2x+1\right)^{2}}\,dx$, y con $u=2x+1$ se
          reduce a $\int_{0}^{3}\sqrt{1+u^{2}}\,du$.
        desarrollo: |
          $$
          L = \int_{0}^{3}\sqrt{1+u^{2}}\,du
          = \left[\frac{u\sqrt{1+u^{2}}+\operatorname{argsh}u}{2}
          \right]_{0}^{3}
          = \frac{3\sqrt{10}+\operatorname{argsh}3}{2} \approx 5{,}652640
          $$

      - tipo: calcular
        titulo: El elipsoide alrededor de OY
        pregunta: |
          ¿Cuánto vale el volumen del elipsoide generado al girar alrededor de
          $OY$?
        respuesta:
          tipo: numero
          valor: '104.719755'
          tolerancia: 0.21
          formato: con seis decimales
        distractores:
          - valor: '20.943951'
            mensaje: |
              $\tfrac{20\pi}{3}$ es el volumen girando alrededor de **$OX$**.
              Girando en $OY$ el radio de cada disco es $5\sqrt{1-y^{2}}$, y
              ese $5$ va al cuadrado.
          - valor: '523.598776'
            mensaje: |
              $\tfrac{500\pi}{3}$ sería $\tfrac43\pi\cdot125$: has elevado al
              cubo el semieje $5$ en vez de al cuadrado.
        pista: |
          $\pi\displaystyle\int_{-1}^{1}25\left(1-y^{2}\right)dy = \tfrac{100\pi}{3}$.
        desarrollo: |
          $$
          B = \pi\int_{-1}^{1}x^{2}\,dy
          = \pi\int_{-1}^{1}25\left(1-y^{2}\right)dy
          = 25\pi\cdot\frac43 = \frac{100\pi}{3} \approx 104{,}719755
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento sobre la errata del problema 8. Una pieza es falsa.
        piezas:
          - texto: >-
              La longitud de arco es
              $\int\sqrt{1+y'^{2}}\,dx$, con $y'=2x+1$.
          - texto: >-
              Con $u=2x+1$ y aprovechando la paridad, queda
              $\int_{0}^{3}\sqrt{1+u^{2}}\,du$.
          - texto: >-
              Esa integral vale
              $\tfrac{u\sqrt{1+u^{2}}+\operatorname{argsh}u}{2}$ evaluada en
              $3$, o sea $\tfrac{3\sqrt{10}+\operatorname{argsh}3}{2}$.
          - texto: >-
              El boletín escribe $\tfrac{\operatorname{argsh}3}{2}$, que es la
              misma cantidad expresada de otro modo.
            trampa: true
            mensaje: |
              No lo es: $\tfrac{\operatorname{argsh}3}{2}\approx0{,}91$ y lo
              correcto es $5{,}65$. Y hay un argumento que lo cierra sin
              calcular nada: **el arco une $\left(-2,0\right)$ con
              $\left(1,0\right)$, así que no puede medir menos de $3$.** Al
              boletín se le ha quedado solo el segundo sumando.
        veredicto: |
          Una longitud siempre es mayor o igual que la distancia en línea recta
          entre los extremos. Esa cota inferior descarta el resultado impreso
          en dos segundos, sin hacer ninguna cuenta.
    resolucion: |
      **Resultados.** Problema 8:
      $L = \dfrac{3\sqrt{10}+\operatorname{argsh}3}{2} \approx 5{,}6526$.
      Problema 9: $\dfrac{20\pi}{3}\approx20{,}944$ y
      $\dfrac{100\pi}{3}\approx104{,}720$.

      ### 1 · La longitud, paso a paso

      $$
      L = \int_{-2}^{1}\sqrt{1+\left(2x+1\right)^{2}}\,dx
      $$

      Con $u=2x+1$, $du=2\,dx$; $x=-2\Rightarrow u=-3$ y
      $x=1\Rightarrow u=3$:

      $$
      L = \frac12\int_{-3}^{3}\sqrt{1+u^{2}}\,du
      = \int_{0}^{3}\sqrt{1+u^{2}}\,du
      $$

      por paridad. Y con
      $\int\sqrt{1+u^{2}}\,du = \tfrac{u\sqrt{1+u^{2}}+\operatorname{argsh}u}{2}$:

      $$
      L = \frac{3\sqrt{10}+\operatorname{argsh}3}{2}
      \approx \frac{9{,}4868+1{,}8184}{2} \approx 5{,}6526
      $$

      ### 2 · La errata

      El boletín imprime $L=\tfrac{\operatorname{argsh}3}{2}\approx0{,}909$:
      **le falta el sumando $\tfrac{3\sqrt{10}}{2}$**, que es el que más pesa.

      Y no hace falta integrar para descartarlo. El arco va de
      $\left(-2,0\right)$ a $\left(1,0\right)$, dos puntos que distan $3$; una
      curva entre ellos mide **al menos** $3$. El resultado impreso es tres
      veces menor que esa cota.

      ### 3 · Los dos elipsoides

      **Alrededor de $OX$.** Cada sección es un disco de radio $y$:

      $$
      B = \pi\int_{-5}^{5}y^{2}\,dx
      = \pi\int_{-5}^{5}\left(1-\frac{x^{2}}{25}\right)dx
      = \pi\left(10-\frac{2}{3}\cdot 5\right) = \frac{20\pi}{3}
      $$

      **Alrededor de $OY$.** Ahora el radio es $x$:

      $$
      B = \pi\int_{-1}^{1}x^{2}\,dy
      = \pi\int_{-1}^{1}25\left(1-y^{2}\right)dy
      = 25\pi\cdot\frac43 = \frac{100\pi}{3}
      $$

      ### 4 · La regla general

      Para la elipse de semiejes $a$ y $b$:

      $$
      V_{OX} = \frac43\pi a b^{2}
      \qquad
      V_{OY} = \frac43\pi a^{2} b
      $$

      **El semieje perpendicular al eje de giro va al cuadrado**, porque es el
      que hace de radio. Con $a=5$ y $b=1$ eso da $\tfrac{20\pi}{3}$ y
      $\tfrac{100\pi}{3}$: el segundo es cinco veces mayor, exactamente la
      razón $\tfrac ab$.

      Y de paso: si $a=b=R$, las dos fórmulas dan $\tfrac43\pi R^{3}$, el
      volumen de la esfera.

      **Lo que hay que llevarse.** Toda longitud de arco está acotada por
      debajo por la distancia entre los extremos, y esa comprobación cuesta
      cero. En los sólidos de revolución, el semieje que hace de radio es el
      **perpendicular** al eje de giro, y es el que aparece al cuadrado.
  - id: ej-taylor-de-una-integral
    titulo: El desarrollo de una función que no se puede escribir
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Sea
      $$
      F\left(x\right)=\int_{0}^{x} e^{-t^{2}}\,dt
      $$
      Hallar los primeros términos de su desarrollo de McLaurin.
    pide: Los términos hasta el de grado tres.
    pasos:
      - tipo: reconocer
        pregunta: |
          $F$ no se puede escribir con funciones elementales. ¿Cómo se desarrolla entonces?
        opciones:
          - texto: Derivando con el teorema fundamental, que da $F'$ sin resolver la integral
            correcta: true
            mensaje: |
              Eso es. El teorema fundamental dice que $F'(x)=e^{-x^{2}}$ sin
              necesidad de conocer $F$. Y con las derivadas en el origen ya se
              escribe el polinomio de Taylor.
          - texto: Calculando primero la integral y desarrollando después
            mensaje: |
              No se puede: $e^{-t^{2}}$ no tiene primitiva elemental, que es
              justamente por lo que este ejercicio existe. Si se pudiera, no
              haría falta ningún método especial.
          - texto: Aproximando la integral numéricamente en varios puntos
            mensaje: |
              Eso daría valores, no un polinomio. El desarrollo de Taylor sale de
              las derivadas en un punto, y esas se pueden obtener exactamente.
      - tipo: calcular
        titulo: El coeficiente de grado tres
        pregunta: |
          Por el teorema fundamental, $F'(x)=e^{-x^{2}}$. Desarrollando esa
          exponencial e integrando término a término, ¿cuál es el coeficiente de
          $x^{3}$ en el desarrollo de $F$?
        respuesta:
          tipo: numero
          valor: '-0.33333333'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.33333'
            mensaje: |
              Signo cambiado. El exponente es $-t^{2}$, así que el segundo
              término del desarrollo de la exponencial es $-t^{2}$ y su integral
              sale negativa.
          - valor: '-1'
            mensaje: |
              Te has dejado el $\frac{1}{3}$ de integrar $t^{2}$. Al integrar
              $-t^{2}$ entre $0$ y $x$ sale $-\frac{x^{3}}{3}$, no $-x^{3}$.
        pista: |
          Usa $e^{u}=1+u+\frac{u^{2}}{2}+\dots$ con $u=-t^{2}$, y después integra
          cada término entre $0$ y $x$.
        desarrollo: |
          Con $u=-t^{2}$ en el desarrollo de la exponencial:

          $$
          e^{-t^{2}} = 1 - t^{2} + \frac{t^{4}}{2} - \cdots
          $$

          Integrando término a término entre $0$ y $x$ —que se puede, porque la
          serie converge uniformemente en cualquier intervalo acotado—:

          $$
          F\left(x\right) = x - \frac{x^{3}}{3} + \frac{x^{5}}{10} - \cdots
          $$

          El coeficiente de $x^{3}$ es $-\frac{1}{3}\approx -0{,}3333$.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: El teorema fundamental da $F'(x)=e^{-x^{2}}$ sin necesidad de calcular la integral.
          - texto: La exponencial se desarrolla sustituyendo $u=-t^{2}$ en la serie conocida.
          - texto: La serie se integra término a término entre $0$ y $x$.
          - texto: Queda $F(x)=x-\frac{x^{3}}{3}+\frac{x^{5}}{10}-\cdots$, con $F(0)=0$.
          - texto: Antes de desarrollar hay que calcular la primitiva de $e^{-t^{2}}$.
            trampa: true
            mensaje: |
              No existe en términos elementales, y ese es el punto entero del
              ejercicio. Todo el método está construido para no necesitarla: se
              trabaja con la derivada, que sí se conoce.
    resolucion: |
      La función $F$ **no se puede escribir** con funciones elementales, y aun así
      su desarrollo es de los más fáciles del tema. La clave es no intentar
      conocerla: basta conocer su derivada.

      **El teorema fundamental** da $F'(x)=e^{-x^{2}}$, y además $F(0)=0$ porque
      la integral de $0$ a $0$ vale cero.

      **Dos caminos, el mismo resultado.** O se derivan sucesivamente a partir de
      $F'$, o —más corto— se desarrolla el integrando y se integra:

      $$
      e^{-t^{2}} = 1 - t^{2} + \frac{t^{4}}{2} - \cdots
      \;\Longrightarrow\;
      F\left(x\right)=x-\frac{x^{3}}{3}+\frac{x^{5}}{10}-\cdots
      $$

      El coeficiente de $x^{3}$ es $-\frac{1}{3}$. Y obsérvese que el desarrollo
      solo tiene potencias **impares**: tenía que ser así, porque $F$ es una
      función impar — el integrando es par y la integral empieza en el origen.

  - id: ej-longitud-de-arco-basica
    titulo: La longitud de una curva, con números que salen
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Calcular la longitud del arco de la curva
      $$
      y = \frac{2}{3}x^{3/2}
      $$
      entre $x=0$ y $x=3$.
    pide: La longitud del arco.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De dónde sale la fórmula de la longitud de arco?
        opciones:
          - texto: De sumar hipotenusas infinitesimales, con Pitágoras
            correcta: true
            mensaje: |
              Eso es. Un trocito de curva es casi un segmento de catetos $dx$ y
              $dy$, y su longitud es $\sqrt{dx^{2}+dy^{2}}$. Sacando $dx$ factor
              común queda $\sqrt{1+\left(y'\right)^{2}}\,dx$.
          - texto: De integrar la propia función
            mensaje: |
              Integrar la función da el **área** bajo la curva, no su longitud.
              Son dos cosas distintas y se calculan con integrandos distintos.
          - texto: De derivar la función y evaluarla en los extremos
            mensaje: |
              Eso da la pendiente en dos puntos, que no dice nada de lo que mide
              la curva entre ellos. La longitud es una suma, o sea una integral.
      - tipo: calcular
        titulo: La longitud
        pregunta: |
          Con $y'=x^{1/2}$, el integrando es $\sqrt{1+x}$. ¿Cuánto vale
          $\int_{0}^{3}\sqrt{1+x}\,dx$?
        respuesta:
          tipo: numero
          valor: '4.66666667'
          tolerancia: 0.001
          formato: en forma exacta, o con tres decimales
        distractores:
          - valor: '3.1547'
            mensaje: |
              Eso es lo que sale si se olvida el $\frac{2}{3}$ al integrar la
              raíz. La primitiva de $\sqrt{1+x}$ es
              $\frac{2}{3}\left(1+x\right)^{3/2}$.
          - valor: '3'
            mensaje: |
              Esa es la longitud del intervalo en el eje $x$, o sea la de la
              cuerda horizontal. La curva sube, así que tiene que medir más que
              eso — y es una buena comprobación de sentido común.
        pista: |
          La primitiva de $\left(1+x\right)^{1/2}$ es
          $\frac{2}{3}\left(1+x\right)^{3/2}$. Evalúa entre $0$ y $3$.
        desarrollo: |
          $$
          y'=x^{1/2}
          \;\Longrightarrow\;
          1+\left(y'\right)^{2}=1+x
          $$

          $$
          L=\int_{0}^{3}\sqrt{1+x}\,dx
          =\left[\frac{2}{3}\left(1+x\right)^{3/2}\right]_{0}^{3}
          =\frac{2}{3}\left(8-1\right)
          =\frac{14}{3}\approx 4{,}667
          $$

          Comprobación: la curva va de $(0,0)$ a $(3,2\sqrt{3})\approx(3;3{,}46)$,
          cuya cuerda mide $\sqrt{9+12}\approx 4{,}58$. La curva mide algo más,
          $4{,}67$, como tiene que ser.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: Un trozo infinitesimal de curva mide $\sqrt{dx^{2}+dy^{2}}$, por Pitágoras.
          - texto: Sacando $dx$ factor común queda el integrando $\sqrt{1+\left(y'\right)^{2}}$.
          - texto: Aquí $y'=x^{1/2}$, así que el integrando se simplifica a $\sqrt{1+x}$.
          - texto: La integral vale $14/3$, algo más que la cuerda que une los extremos.
          - texto: La longitud tiene que salir menor que la distancia en línea recta entre los extremos.
            trampa: true
            mensaje: |
              Es al revés, y es la comprobación que conviene hacer siempre: la
              recta es el camino más corto, así que **cualquier** curva que una
              dos puntos mide más que la cuerda. Si sale menos, hay un error.
    resolucion: |
      Este enunciado está elegido para que la raíz se simplifique, que es lo
      excepcional: con casi cualquier otra función, $\sqrt{1+\left(y'\right)^{2}}$
      no tiene primitiva elemental.

      $$
      y=\frac{2}{3}x^{3/2}
      \;\Longrightarrow\;
      y'=x^{1/2}
      \;\Longrightarrow\;
      1+\left(y'\right)^{2}=1+x
      $$

      $$
      L=\int_{0}^{3}\sqrt{1+x}\,dx
      =\left[\frac{2}{3}\left(1+x\right)^{3/2}\right]_{0}^{3}
      =\frac{2}{3}\left(8-1\right)=\frac{14}{3}\approx 4{,}67
      $$

      **La comprobación que vale siempre**: la cuerda que une los extremos mide
      $\sqrt{3^{2}+\left(2\sqrt{3}\right)^{2}}\approx 4{,}58$, y la curva mide
      algo más. La recta es el camino más corto entre dos puntos, así que una
      longitud de arco menor que la cuerda es siempre un error.

  - id: ej-valor-medio-de-una-funcion
    titulo: El valor medio, que es una altura
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Hallar el valor medio de $f\left(x\right)=x^{2}$ en el intervalo
      $\left[0,3\right]$.
    pide: El valor medio, y qué significa geométricamente.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es geométricamente el valor medio de una función en un intervalo?
        opciones:
          - texto: La altura del rectángulo que tiene la misma área que la función
            correcta: true
            mensaje: |
              Eso es, y es la mejor forma de recordarlo. Se aplana la función
              dejando el área igual: la altura que queda es el valor medio.
          - texto: La media entre el valor mínimo y el máximo
            mensaje: |
              Eso sería cierto solo para una recta. Con $x^{2}$ en
              $\left[0,3\right]$ daría $4{,}5$, y el valor medio es $3$: la
              función pasa más tiempo abajo que arriba.
          - texto: El valor de la función en el punto medio del intervalo
            mensaje: |
              Aquí sería $f(1{,}5)=2{,}25$, que tampoco es. Ese valor se alcanza
              en algún punto —lo garantiza el teorema del valor medio— pero no
              tiene por qué ser el centro.
      - tipo: calcular
        titulo: El valor medio
        pregunta: |
          Aplicando $\overline{f}=\frac{1}{b-a}\int_{a}^{b}f$, ¿cuánto vale el valor
          medio de $x^{2}$ en $\left[0,3\right]$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '9'
            mensaje: |
              Ese es el valor de la integral, $\int_{0}^{3}x^{2}dx=9$. Falta
              dividir entre la longitud del intervalo, que es $3$.
          - valor: '4.5'
            mensaje: |
              Esa es la media entre el mínimo $0$ y el máximo $9$, que solo
              valdría si la función fuese una recta. $x^{2}$ crece despacio al
              principio, así que su media queda por debajo.
        pista: |
          Calcula primero la integral y después divide entre la longitud del
          intervalo. Son las dos operaciones de la fórmula, en ese orden.
        desarrollo: |
          $$
          \int_{0}^{3}x^{2}\,dx=\left[\frac{x^{3}}{3}\right]_{0}^{3}=9
          $$

          $$
          \overline{f}=\frac{1}{3-0}\cdot 9 = 3
          $$

          Geométricamente: el rectángulo de base $3$ y altura $3$ tiene área $9$,
          la misma que encierra la parábola. Y ese valor $3$ lo alcanza la función
          en $x=\sqrt{3}\approx 1{,}73$, que no es el centro del intervalo.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: El valor medio es la altura del rectángulo de la misma base que tiene el área de la función.
          - texto: El área bajo $x^{2}$ entre $0$ y $3$ vale $9$.
          - texto: Dividiendo entre la longitud del intervalo, que es $3$, sale un valor medio de $3$.
          - texto: La función alcanza ese valor en $x=\sqrt{3}$, dentro del intervalo.
          - texto: El valor medio es siempre el valor de la función en el punto medio del intervalo.
            trampa: true
            mensaje: |
              Solo coincide si la función es una recta. El teorema del valor
              medio garantiza que el valor medio **se alcanza** en algún punto,
              pero no dice en cuál — aquí es $\sqrt{3}\approx 1{,}73$ y no $1{,}5$.
    resolucion: |
      La fórmula es corta y lo que hay que entender es lo que significa.

      $$
      \overline{f}=\frac{1}{b-a}\int_{a}^{b}f\left(x\right)dx
      =\frac{1}{3}\int_{0}^{3}x^{2}dx
      =\frac{9}{3}=3
      $$

      **La imagen que lo explica**: se aplana la función hasta dejarla horizontal,
      sin cambiar el área que encierra. La altura que queda es el valor medio. Por
      eso la fórmula es «área partido por base»: es despejar la altura de un
      rectángulo.

      **Dos avisos que caen en examen.** El valor medio no es la media entre el
      máximo y el mínimo —aquí daría $4{,}5$—, y no se alcanza en el centro del
      intervalo sino donde $x^{2}=3$, es decir en $\sqrt{3}\approx 1{,}73$. Que se
      alcance en algún punto es lo que afirma el teorema del valor medio integral,
      y hace falta que la función sea continua.

  - id: ej-elegir-el-metodo-de-integracion
    titulo: Mirar una integral y saber por dónde va
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Decidir qué método pide cada una de estas integrales, y calcular la
      primera:
      $$
      \int x\,e^{x}\,dx,
      \qquad
      \int \frac{2x}{x^{2}+1}\,dx,
      \qquad
      \int \frac{1}{x^{2}-1}\,dx
      $$
    pide: El método de cada una, y el valor de la primera entre 0 y 1.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué método pide $\int x\,e^{x}\,dx$?
        opciones:
          - texto: Integración por partes
            correcta: true
            mensaje: |
              Eso es. Hay un producto de dos funciones de familias distintas —un
              polinomio y una exponencial— y ninguna es la derivada de la otra.
              Esa es la firma de las partes.
          - texto: Cambio de variable con $u=x^{2}$
            mensaje: |
              El cambio funciona cuando dentro está la derivada de algo, salvo
              constantes. Aquí la derivada de $x^{2}$ es $2x$, que no aparece
              multiplicando a la exponencial.
          - texto: Fracciones simples
            mensaje: |
              Las fracciones simples son para cocientes de polinomios. Aquí no
              hay ningún cociente.
      - tipo: calcular
        titulo: La primera, entre 0 y 1
        pregunta: |
          Integrando por partes con $u=x$ y $dv=e^{x}dx$, ¿cuánto vale
          $\int_{0}^{1} x\,e^{x}\,dx$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '1.718281'
            mensaje: |
              Ese es $e-1$, que es $\int_{0}^{1}e^{x}dx$ sin la $x$ delante. Te
              has dejado el factor $x$ del integrando.
          - valor: '2.718281'
            mensaje: |
              Ese es $e$. Al evaluar $\left[xe^{x}-e^{x}\right]$ en $1$ sale
              $e-e=0$, y lo que queda es lo de la evaluación en $0$, que es $-(-1)$.
        pista: |
          Con $u=x$ y $dv=e^{x}dx$ queda $xe^{x}-\int e^{x}dx$. Evalúa la
          primitiva completa entre $0$ y $1$ con cuidado en el extremo inferior.
        desarrollo: |
          $$
          \int x e^{x}dx = x e^{x} - \int e^{x}dx = x e^{x} - e^{x} + C
          $$

          $$
          \int_{0}^{1} x e^{x}dx
          = \left[xe^{x}-e^{x}\right]_{0}^{1}
          = \left(e - e\right) - \left(0 - 1\right)
          = 1
          $$

          En $x=1$ los dos términos se cancelan, y todo el resultado viene del
          extremo inferior. Es un caso donde equivocarse de signo en el $0$ cuesta
          la respuesta entera.
      - tipo: justificar
        pregunta: |
          Ordena el criterio para elegir método. Una pieza es falsa.
        piezas:
          - texto: Si dentro está la derivada de algo, salvo constantes, es cambio de variable — como en la segunda, con $u=x^{2}+1$.
          - texto: Si hay un producto de familias distintas y ninguna es la derivada de la otra, son partes — como en la primera.
          - texto: Si es un cociente de polinomios con el denominador factorizable, son fracciones simples — como en la tercera.
          - texto: Y antes de todo eso conviene mirar si la integral es inmediata, que ahorra el método entero.
          - texto: Ante la duda siempre se puede empezar por partes, porque funciona con cualquier integrando.
            trampa: true
            mensaje: |
              No funciona con cualquiera, y además puede complicarla: aplicar
              partes a la segunda integral daría algo peor que el original. El
              criterio no es probar, es **mirar la forma** del integrando antes de
              escribir nada.
    resolucion: |
      Lo que se entrena aquí no es integrar: es **decidir**. Las tres del
      enunciado son de tres familias distintas y se reconocen por su forma.

      | integral | qué se ve | método |
      |---|---|---|
      | $\int x e^{x}dx$ | producto de familias distintas | **por partes** |
      | $\int \frac{2x}{x^{2}+1}dx$ | arriba está la derivada de abajo | **cambio de variable** |
      | $\int \frac{1}{x^{2}-1}dx$ | cociente de polinomios, denominador factorizable | **fracciones simples** |

      Y la primera, calculada:

      $$
      \int_{0}^{1}xe^{x}dx=\left[xe^{x}-e^{x}\right]_{0}^{1}=\left(e-e\right)-\left(-1\right)=1
      $$

      **El orden en que conviene mirar** es siempre el mismo: primero si es
      inmediata, después si dentro está la derivada de algo, después si es un
      cociente de polinomios, y solo entonces las partes. Probar a ciegas cuesta
      el tiempo del examen.

  - id: ej-mclaurin-por-dos-caminos
    titulo: El mismo desarrollo por dos caminos
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Sea
      $$
      G\left(x\right)=\int_{0}^{x}\frac{\operatorname{sen}t}{t}\,dt
      $$
      Hallar el coeficiente de $x^{3}$ en su desarrollo de McLaurin.
    pide: El coeficiente de x cubo.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál de los dos caminos es más corto aquí?
        opciones:
          - texto: Desarrollar el integrando e integrar término a término
            correcta: true
            mensaje: |
              Eso es. La serie del seno se sabe de memoria, dividir entre $t$ es
              bajar un grado a cada término, e integrar es subirlo otra vez. Tres
              operaciones y está.
          - texto: Derivar $G$ tres veces y evaluar en el origen
            mensaje: |
              Se puede y da lo mismo, pero la tercera derivada de
              $\frac{\operatorname{sen}x}{x}$ es larga y el origen es un punto
              delicado — el integrando ni siquiera está definido ahí sin
              extenderlo por continuidad.
          - texto: Calcular la integral y desarrollar el resultado
            mensaje: |
              No se puede: $\frac{\operatorname{sen}t}{t}$ no tiene primitiva
              elemental. Su integral es una función con nombre propio, el seno
              integral, precisamente porque no se puede escribir de otro modo.
      - tipo: calcular
        titulo: El coeficiente
        pregunta: |
          De $\operatorname{sen}t = t-\frac{t^{3}}{6}+\cdots$ sale
          $\frac{\operatorname{sen}t}{t}=1-\frac{t^{2}}{6}+\cdots$. Integrando
          entre $0$ y $x$, ¿cuál es el coeficiente de $x^{3}$?
        respuesta:
          tipo: numero
          valor: '-0.05555556'
          tolerancia: 0.0001
          formato: en forma exacta, o con cinco decimales
        distractores:
          - valor: '-0.16667'
            mensaje: |
              Ese es $-\frac{1}{6}$, el coeficiente del integrando **antes** de
              integrar. Al integrar $-\frac{t^{2}}{6}$ aparece un $3$ en el
              denominador y queda $-\frac{1}{18}$.
          - valor: '-0.33333'
            mensaje: |
              Ese sería el resultado de integrar $-t^{2}$ sin el $\frac{1}{6}$.
              El seno trae ese sexto en su tercer término y hay que arrastrarlo.
        pista: |
          Divide la serie del seno entre $t$ y después integra: el término
          $-\frac{t^{2}}{6}$ se convierte en $-\frac{x^{3}}{18}$.
        desarrollo: |
          $$
          \operatorname{sen}t = t - \frac{t^{3}}{6} + \frac{t^{5}}{120}-\cdots
          \;\Longrightarrow\;
          \frac{\operatorname{sen}t}{t} = 1 - \frac{t^{2}}{6} + \frac{t^{4}}{120}-\cdots
          $$

          Integrando entre $0$ y $x$:

          $$
          G\left(x\right)= x - \frac{x^{3}}{18} + \frac{x^{5}}{600} - \cdots
          $$

          El coeficiente de $x^{3}$ es $-\frac{1}{18}\approx -0{,}05556$.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: Se parte de la serie del seno, que se sabe de memoria.
          - texto: Se divide entre $t$, lo que baja un grado a cada término.
          - texto: Se integra término a término entre $0$ y $x$, lo que sube un grado y divide por el nuevo exponente.
          - texto: El término $-\frac{t^{2}}{6}$ se convierte en $-\frac{x^{3}}{18}$.
          - texto: El coeficiente de $x^{3}$ en $G$ es el mismo que en el integrando, porque integrar no cambia los coeficientes.
            trampa: true
            mensaje: |
              Integrar sí los cambia: sube el exponente y divide por el nuevo.
              Confundir el desarrollo del integrando con el de su integral es el
              error de este tipo, y se detecta porque el grado no cuadra.
    resolucion: |
      Hay dos caminos y los dos son correctos; lo que se entrena es elegir el
      corto.

      **El camino corto: desarrollar e integrar.**

      $$
      \operatorname{sen}t=t-\frac{t^{3}}{6}+\cdots
      \;\Longrightarrow\;
      \frac{\operatorname{sen}t}{t}=1-\frac{t^{2}}{6}+\cdots
      $$

      $$
      G\left(x\right)=\int_{0}^{x}\left(1-\frac{t^{2}}{6}+\cdots\right)dt
      = x-\frac{x^{3}}{18}+\cdots
      $$

      El coeficiente de $x^{3}$ es $-\frac{1}{18}$.

      **El camino largo** —derivar $G$ tres veces con el teorema fundamental y
      evaluar en el origen— da lo mismo, pero obliga a derivar tres veces un
      cociente y a tratar el $0$, donde el integrando solo está definido por
      continuidad. En un examen con reloj, el primero.

      Obsérvese además que $G$ solo tiene potencias impares, igual que el seno:
      integrar una función par desde el origen siempre da una función impar.
