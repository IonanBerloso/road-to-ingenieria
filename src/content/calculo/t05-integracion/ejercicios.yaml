      </figcaption>
      </figure>
    pide: Calcular el volumen y describir el sólido.

    pasos:
      - tipo: reconocer
        pregunta: |
          El eje de giro es $y=1$, no $OX$. ¿Cómo cambia eso la fórmula?
        opciones:
          - texto: >-
              El radio deja de ser $f(x)$ y pasa a ser
              $f(x)-1$: **la distancia al eje**
            correcta: true
            mensaje: |
              Eso es. La fórmula de discos no dice «$\pi\int f^{2}$»: dice
              $\pi\int(\text{radio})^{2}$, y el radio es siempre la distancia
              vertical desde la curva hasta el eje de giro. Con $OX$ esa
              distancia es $f$; con $y=1$, es $f-1$.
          - texto: Hay que usar arandelas
            mensaje: |
              Solo si el sólido tuviera hueco. Aquí el dominio **toca** el eje de
              giro en toda su base, así que no lo hay: son discos macizos.
          - texto: Hay que sumar 1 al resultado final
            mensaje: |
              El desplazamiento del eje no se corrige al final: cambia el
              integrando, y de forma no lineal, porque va al cuadrado.
          - texto: Hay que integrar respecto de $y$
            mensaje: |
              El eje de giro es horizontal, así que los discos se siguen apilando
              a lo largo de $x$. La variable no cambia.

      - tipo: calcular
        titulo: Los límites
        pregunta: |
          ¿Entre qué valores de $x$ existe el dominio? Da el límite inferior en
          radianes, en forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.5236'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              En $x=0$ la curva vale 0, por debajo de la recta $y=1$: la
              condición $g(x)\ge1$ no se cumple. El dominio empieza donde
              $2\,\mathrm{sen}\,x = 1$.
          - valor: '2.6180'
            mensaje: |
              $\frac{5\pi}{6} \approx 2{,}618$ es el límite **superior**, la otra
              solución de $\mathrm{sen}\,x = \frac12$ en $(0,\pi)$.
          - valor: '1.5708'
            mensaje: |
              $\frac{\pi}{2}$ es donde la curva alcanza su **máximo**, no donde
              corta a la recta.
        pista: |
          Resuelve $2\,\mathrm{sen}\,x = 1$ en $(0,\pi)$.
        desarrollo: |
          La condición $y\ge1$ junto con $y \le 2\,\mathrm{sen}\,x$ solo se
          puede cumplir donde

          $$
          2\,\mathrm{sen}\,x \ge 1
          \;\Longleftrightarrow\;
          \mathrm{sen}\,x \ge \frac12
          $$

          En $(0,\pi)$ eso ocurre entre

          $$
          x = \frac{\pi}{6} \approx 0{,}5236
          \qquad\text{y}\qquad
          x = \frac{5\pi}{6} \approx 2{,}6180
          $$
        veredicto: |
          Los dos extremos son donde la curva **corta** al eje de giro: ahí el
          radio se anula y el sólido termina en punta.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '3.4148'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '19.7392'
            mensaje: |
              $2\pi^{2} \approx 19{,}74$ es solo el primer término de
              $\pi\left(2\pi-3\sqrt3\right)$. Falta restar $3\sqrt3\pi$.
          - valor: '1.0870'
            mensaje: |
              $2\pi-3\sqrt3 \approx 1{,}087$ es el contenido del paréntesis.
              Falta multiplicar por $\pi$.
          - valor: '9.8696'
            mensaje: |
              $\pi^{2}$ saldría de olvidar el 2. El desarrollo de
              $(2\,\mathrm{sen}\,x-1)^{2}$ deja un término $3x$, no
              $\frac32 x$.
        pista: |
          $V = \pi\int_{\pi/6}^{5\pi/6}\left(2\,\mathrm{sen}\,x-1\right)^{2}dx$,
          y $\mathrm{sen}^{2}x = \frac{1-\cos2x}{2}$.
        desarrollo: |
          $$
          \left(2\,\mathrm{sen}\,x-1\right)^{2}
          = 4\,\mathrm{sen}^{2}x-4\,\mathrm{sen}\,x+1
          $$

          Bajando el grado con $\mathrm{sen}^{2}x = \frac{1-\cos2x}{2}$:

          $$
          = 2-2\cos2x-4\,\mathrm{sen}\,x+1
          = 3-2\cos2x-4\,\mathrm{sen}\,x
          $$

          $$
          \int\left(3-2\cos2x-4\,\mathrm{sen}\,x\right)dx
          = 3x-\mathrm{sen}\,2x+4\cos x
          $$

          En $x = \frac{5\pi}{6}$:
          $\frac{5\pi}{2}+\frac{\sqrt3}{2}-2\sqrt3
          = \frac{5\pi}{2}-\frac{3\sqrt3}{2}$

          En $x = \frac{\pi}{6}$:
          $\frac{\pi}{2}-\frac{\sqrt3}{2}+2\sqrt3
          = \frac{\pi}{2}+\frac{3\sqrt3}{2}$

          $$
          V = \pi\left(2\pi-3\sqrt3\right)
          \approx \pi(6{,}2832-5{,}1962) \approx 3{,}4148
          $$
        veredicto: |
          Sale un número **pequeño**, y tiene sentido: el radio máximo es 1 y el
          sólido se afila en los dos extremos. Un cilindro de radio 1 y la misma
          longitud mediría $\pi\cdot\frac{2\pi}{3} \approx 6{,}6$.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **El dominio:** entre la recta $y=1$ y la curva
              $y = 2\,\mathrm{sen}\,x$, donde esta va por encima, o sea entre
              $\frac{\pi}{6}$ y $\frac{5\pi}{6}$.
          - texto: |
              **El radio** no es $f(x)$, sino la distancia al eje de giro:
              $r(x) = 2\,\mathrm{sen}\,x-1$.
          - texto: |
              **No hay hueco:** el dominio llega hasta el propio eje de giro, así
              que son discos macizos, no arandelas.
          - texto: |
              $V = \pi\int_{\pi/6}^{5\pi/6}
              \left(2\,\mathrm{sen}\,x-1\right)^{2}dx$, y se baja el grado del
              seno al cuadrado antes de integrar.
          - texto: |
              $V = \pi\left(2\pi-3\sqrt3\right) \approx 3{,}41$. El sólido tiene
              forma de **huso**: grueso en el centro, afilado en los extremos.
          - texto: |
              El radio es $2\,\mathrm{sen}\,x$, y al final se resta el volumen
              del cilindro de radio 1 que ocupa el eje.
            trampa: true
            mensaje: |
              Eso sería válido si el dominio empezara en $y=0$ y hubiera que
              vaciar un cilindro. Aquí el dominio **empieza** en $y=1$: no hay
              nada que vaciar. Y además $\int(f-1)^{2} \neq \int f^{2}-\int1$,
              porque el cuadrado de una diferencia no es la diferencia de los
              cuadrados.
        veredicto: |
          La pieza trampa es el error clásico de los ejes desplazados: tratar el
          desplazamiento como una resta al final en vez de meterlo en el radio.

    resolucion: |
      **Datos.** $D$ entre $y=1$ y $y = 2\,\mathrm{sen}\,x$ en $(0,\pi)$, girado
      alrededor de la recta $y=1$.

      ### 1 · Leer el dominio

      La notación del enunciado es peculiar, pero dice esto: $y$ por debajo de
      $2\,\mathrm{sen}\,x$ y por encima de 1. Las dos condiciones solo son
      compatibles donde

      $$
      2\,\mathrm{sen}\,x \ge 1
      \;\Longleftrightarrow\;
      \mathrm{sen}\,x \ge \frac12
      \;\Longleftrightarrow\;
      \frac{\pi}{6} \le x \le \frac{5\pi}{6}
      $$

      ### 2 · El eje desplazado

      La fórmula de discos no es «$\pi\int f^{2}$». Es

      $$
      V = \pi\int_a^{b}\left(\text{radio}\right)^{2}dx
      $$

      y el **radio es la distancia al eje de giro**. Con $OX$ esa distancia es
      $f(x)$; con $y=1$ es

      $$
      r(x) = 2\,\mathrm{sen}\,x-1
      $$

      Y no hay hueco: el dominio llega **hasta** el eje de giro, así que los
      discos son macizos.

      $$
      V = \pi\int_{\pi/6}^{5\pi/6}\left(2\,\mathrm{sen}\,x-1\right)^{2}dx
      $$

      ### 3 · La integral

      Desarrollando y bajando el grado del seno:

      $$
      \left(2\,\mathrm{sen}\,x-1\right)^{2}
      = 4\,\mathrm{sen}^{2}x-4\,\mathrm{sen}\,x+1
      $$

      $$
      4\,\mathrm{sen}^{2}x = 4\cdot\frac{1-\cos2x}{2} = 2-2\cos2x
      $$

      $$
      \left(2\,\mathrm{sen}\,x-1\right)^{2} = 3-2\cos2x-4\,\mathrm{sen}\,x
      $$

      **Bajar el grado antes de integrar** es obligatorio: $\mathrm{sen}^{2}x$ no
      tiene primitiva inmediata, y $\frac{\mathrm{sen}^{3}x}{3}$ es un error, no
      un atajo.

      $$
      \int\left(3-2\cos2x-4\,\mathrm{sen}\,x\right)dx
      = 3x-\mathrm{sen}\,2x+4\cos x
      $$

      **En el extremo superior**, $x = \frac{5\pi}{6}$:

      $$
      \frac{5\pi}{2}-\mathrm{sen}\frac{5\pi}{3}+4\cos\frac{5\pi}{6}
      = \frac{5\pi}{2}+\frac{\sqrt3}{2}-2\sqrt3
      = \frac{5\pi}{2}-\frac{3\sqrt3}{2}
      $$

      **En el inferior**, $x = \frac{\pi}{6}$:

      $$
      \frac{\pi}{2}-\mathrm{sen}\frac{\pi}{3}+4\cos\frac{\pi}{6}
      = \frac{\pi}{2}-\frac{\sqrt3}{2}+2\sqrt3
      = \frac{\pi}{2}+\frac{3\sqrt3}{2}
      $$

      **Restando:**

      $$
      \left(\frac{5\pi}{2}-\frac{3\sqrt3}{2}\right)
      -\left(\frac{\pi}{2}+\frac{3\sqrt3}{2}\right)
      = 2\pi-3\sqrt3
      $$

      $$
      \boxed{V = \pi\left(2\pi-3\sqrt3\right) \approx 3{,}415}
      $$

      ### 4 · El sólido

      Un **huso**: la sección en el centro, $x=\frac{\pi}{2}$, es un disco de
      radio $2-1 = 1$; hacia los dos extremos el radio decrece hasta anularse en
      $\frac{\pi}{6}$ y $\frac{5\pi}{6}$. Simétrico respecto del plano
      $x = \frac{\pi}{2}$.

      La figura del enunciado muestra la sección meridiana: al girarla media
      vuelta se obtiene el sólido.

      ### 5 · Comprobación

      **Por acotación.** El sólido cabe en el cilindro de radio 1 y longitud
      $\frac{5\pi}{6}-\frac{\pi}{6} = \frac{2\pi}{3}$:

      $$
      \pi\cdot1^{2}\cdot\frac{2\pi}{3} \approx 6{,}58
      \qquad\text{y}\qquad
      3{,}415 < 6{,}58 \quad\checkmark
      $$

      Ocupa aproximadamente la mitad, coherente con una figura que se afila en
      los dos extremos.

      **Por el signo.** $2\pi \approx 6{,}283$ y $3\sqrt3 \approx 5{,}196$, luego
      el paréntesis es positivo ✔ Si hubiera salido negativo, el radio estaría
      mal planteado.

      **Por simetría.** El integrando es simétrico respecto de
      $x = \frac{\pi}{2}$, así que el volumen es el doble del de media figura.
      Integrando de $\frac{\pi}{6}$ a $\frac{\pi}{2}$ sale
      $\pi-\frac{3\sqrt3}{2}$, y su doble es $2\pi-3\sqrt3$ ✔

  - id: parabola-y-su-tangente-paralela
    titulo: Una parábola y su tangente paralela a una recta dada
    fuente: >-
      Ejercicio 5.21 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU ·
      Cayó en 2016/2017 6E
    nivel: practica
    enunciado: |
      Sea la función $y = 4x^{2}$. (2016/2017 6E)

      **(a)** Calcular el área del dominio situado en el primer cuadrante y
      delimitado por la curva y su tangente pararela a la recta $y = 8x$.

      **(b)** Calcular el volumen generado al girar el dominio anterior sobre el
      eje $OX$.
    pide: Calcular el área y el volumen.

    pasos:
      - tipo: reconocer
        pregunta: |
          «Tangente paralela a $y=8x$». ¿Qué condición impone eso?
        opciones:
          - texto: >-
              Que la tangente tenga **pendiente 8**, o sea $y'(x) = 8$
            correcta: true
            mensaje: |
              Eso es: paralelas significa misma pendiente. La recta $y=8x$ solo
              sirve para leer el 8; no interviene en la figura, y ese es el
              despiste que busca el enunciado.
          - texto: Que la tangente pase por el origen
            mensaje: |
              La recta $y=8x$ pasa por el origen, pero la tangente no tiene por
              qué: sale $y = 8x-4$, que corta al eje en $x=\frac12$.
          - texto: Que la tangente sea la propia recta $y=8x$
            mensaje: |
              Si lo fuera, tocaría a la curva donde $4x^{2}=8x$, o sea en $x=2$,
              y ahí la pendiente de la parábola es 16, no 8. No es tangente.
          - texto: Que corten en un solo punto
            mensaje: |
              Eso lo cumple cualquier tangente, no solo la paralela a $y=8x$.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área del dominio? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.3333'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '1.3333'
            mensaje: |
              $\frac43$ es $\int_0^{1}4x^{2}dx$, el área bajo la parábola. Falta
              restar el triángulo que hay bajo la tangente.
          - valor: '1'
            mensaje: |
              1 es el área del **triángulo** bajo la tangente, de base
              $\frac12$ y altura 4. Es lo que hay que restar, no el resultado.
          - valor: '0.6666667'
            mensaje: |
              $\frac23$ es el doble del resultado: has restado solo la mitad del
              triángulo.
        pista: |
          $A = \int_0^{1}4x^{2}dx-\text{área del triángulo bajo la tangente}$.
        desarrollo: |
          **La tangente.** $y' = 8x = 8$ da $x=1$, y $y(1) = 4$:

          $$
          y = 4+8(x-1) = 8x-4
          $$

          Corta al eje $OX$ en $x = \frac12$.

          **El área bajo la parábola:**

          $$
          \int_0^{1}4x^{2}dx = \left[\frac{4x^{3}}{3}\right]_0^{1} = \frac43
          $$

          **El triángulo bajo la tangente**, de base
          $1-\frac12 = \frac12$ y altura 4:

          $$
          \frac12\cdot\frac12\cdot4 = 1
          $$

          $$
          A = \frac43-1 = \frac13 \approx 0{,}3333
          $$
        veredicto: |
          El triángulo se puede calcular sin integrar. Merece la pena: ahorra un
          desarrollo y reduce las ocasiones de equivocarse.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen al girar sobre $OX$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '1.6755'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '10.0531'
            mensaje: |
              $\frac{16\pi}{5}$ es solo el sólido que genera la parábola. Falta
              restar el **cono** que genera la tangente.
          - valor: '8.3776'
            mensaje: |
              $\frac{8\pi}{3}$ es el volumen del cono que genera la tangente. Es
              lo que hay que restar, no el resultado.
          - valor: '1.0472'
            mensaje: |
              $\frac{\pi}{3}$ es $\pi$ por el área. El volumen no se obtiene
              multiplicando el área por $\pi$: el radio va al cuadrado dentro de
              la integral.
        pista: |
          $V = \pi\int_0^{1}\left(4x^{2}\right)^{2}dx
          -\pi\int_{1/2}^{1}(8x-4)^{2}dx$.
        desarrollo: |
          **El sólido de la parábola:**

          $$
          \pi\int_0^{1}16x^{4}dx = \pi\left[\frac{16x^{5}}{5}\right]_0^{1}
          = \frac{16\pi}{5}
          $$

          **El cono de la tangente**, que hay que restar:

          $$
          \pi\int_{1/2}^{1}(8x-4)^{2}dx
          = \pi\left[\frac{(8x-4)^{3}}{24}\right]_{1/2}^{1}
          = \pi\cdot\frac{64}{24} = \frac{8\pi}{3}
          $$

          $$
          V = \frac{16\pi}{5}-\frac{8\pi}{3}
          = \frac{48\pi-40\pi}{15} = \frac{8\pi}{15} \approx 1{,}6755
          $$
        veredicto: |
          El cono se puede comprobar con la fórmula elemental: radio 4, altura
          $\frac12$, luego $\frac13\pi\cdot16\cdot\frac12 = \frac{8\pi}{3}$ ✔

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La tangente** paralela a $y=8x$ tiene pendiente 8: de
              $y'=8x=8$ sale $x=1$, y la recta es $y = 8x-4$.
          - texto: |
              **El dominio** está en el primer cuadrante, entre la parábola por
              arriba y por la izquierda, y la tangente y el eje $OX$ por abajo.
              La tangente corta al eje en $x=\frac12$.
          - texto: |
              **(a)** $A = \int_0^{1}4x^{2}dx-\text{triángulo}
              = \frac43-1 = \frac13$.
          - texto: |
              **(b)** Al girar, la parábola genera
              $\frac{16\pi}{5}$ y la tangente un **cono** de
              $\frac{8\pi}{3}$.
          - texto: |
              $V = \frac{16\pi}{5}-\frac{8\pi}{3} = \frac{8\pi}{15}$.
          - texto: |
              La recta $y=8x$ es una de las fronteras del dominio, junto con la
              parábola.
            trampa: true
            mensaje: |
              $y=8x$ **no aparece en la figura**. Solo sirve para leer la
              pendiente: la frontera es la **tangente** $y = 8x-4$, que es otra
              recta, paralela a ella pero desplazada. Confundirlas cambia todos
              los límites de integración.
        veredicto: |
          Es un enunciado que da un dato en forma de recta cuando en realidad
          solo quiere dar un número. Distinguirlo es la mitad del ejercicio.

    resolucion: |
      **Datos.** $y = 4x^{2}$, su tangente paralela a $y=8x$, y el primer
      cuadrante.

      ### 1 · La tangente

      Paralela significa **misma pendiente**:

      $$
      y' = 8x = 8 \;\Longrightarrow\; x = 1,\quad y(1) = 4
      $$

      $$
      y-4 = 8(x-1) \;\Longrightarrow\; y = 8x-4
      $$

      **La recta $y=8x$ no vuelve a aparecer.** Solo servía para leer el 8.
      Tomarla como frontera es el error que arruina el ejercicio.

      La tangente corta al eje $OX$ en

      $$
      8x-4 = 0 \;\Longrightarrow\; x = \frac12
      $$

      ### 2 · Qué región es

      En el primer cuadrante, entre la parábola y su tangente, cerrando por
      abajo con el eje $OX$:

      | tramo | techo | suelo |
      |---|---|---|
      | $0 \le x \le \frac12$ | $4x^{2}$ | $y=0$ |
      | $\frac12 \le x \le 1$ | $4x^{2}$ | $8x-4$ |

      El punto de tangencia $(1,4)$ cierra la figura por la derecha.

      ### 3 · Apartado (a): el área

      Es más cómodo restar de golpe:

      $$
      A = \int_0^{1}4x^{2}\,dx
      -\underbrace{\frac12\cdot\frac12\cdot4}_{\text{triángulo}}
      $$

      $$
      \int_0^{1}4x^{2}dx = \frac43,
      \qquad
      \text{triángulo} = 1
      $$

      $$
      \boxed{A = \frac43-1 = \frac13}
      $$

      El triángulo tiene base $1-\frac12 = \frac12$ —de donde corta al eje al
      punto de tangencia— y altura 4. No hace falta integrarlo.

      ### 4 · Apartado (b): el volumen

      $$
      V = \pi\int_0^{1}\left(4x^{2}\right)^{2}dx
      -\pi\int_{1/2}^{1}\left(8x-4\right)^{2}dx
      $$

      **La parábola:**

      $$
      \pi\int_0^{1}16x^{4}dx = \frac{16\pi}{5}
      $$

      **La tangente**, que genera un cono:

      $$
      \pi\int_{1/2}^{1}(8x-4)^{2}dx
      = \pi\left[\frac{(8x-4)^{3}}{24}\right]_{1/2}^{1}
      = \frac{64\pi}{24} = \frac{8\pi}{3}
      $$

      $$
      \boxed{V = \frac{16\pi}{5}-\frac{8\pi}{3}
      = \frac{8\pi}{15} \approx 1{,}676}
      $$

      ### 5 · Comprobación

      **Del cono, por la fórmula elemental.** Al girar la tangente entre
      $x=\frac12$ y $x=1$ se genera un cono de radio 4 y altura $\frac12$:

      $$
      \frac13\pi R^{2}h = \frac13\pi\cdot16\cdot\frac12 = \frac{8\pi}{3}
      \quad\checkmark
      $$

      **Del área, por acotación.** La separación máxima entre parábola y
      tangente se da en $x=\frac12$, donde la parábola vale 1 y la tangente 0.
      El recinto cabe en un rectángulo de base 1 y altura 1:

      $$
      \frac13 < 1 \quad\checkmark
      $$

      **De coherencia entre los dos apartados.** El sólido cabe en el cilindro de
      radio 4 y longitud 1, de volumen $16\pi \approx 50$; y
      $1{,}68 \ll 50$ ✔ Es pequeño porque casi todo el disco grande se lo lleva
      el cono que se resta.

  - id: parabola-y-sus-dos-tangentes-en-los-cortes
    titulo: La parábola y las tangentes en sus dos cortes con el eje
    fuente: >-
      Ejercicio 5.22 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU ·
      Cayó en 2018/2019 3E
    nivel: practica
    enunciado: |
      Sea $D$ el dominio delimitado por la gráfica de la función
      $y = 2x-x^{2}$ y por su recta tangente en el punto de corte de la gráfica
      de la función con el eje OX. (2018/2019 3E)

      **(a)** Calcular el área del dominio $D$.

      **(b)** Calcular el volumen generado al girar el dominio $D$ alrededor del
      eje OX.
    pide: Calcular el área y el volumen.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice «el punto de corte», en singular. ¿Cuántos hay?
        opciones:
          - texto: >-
              **Dos**, $x=0$ y $x=2$, y el dominio necesita las **dos**
              tangentes para quedar cerrado
            correcta: true
            mensaje: |
              Eso es. Con una sola tangente la región no se cierra: la tangente
              y la parábola solo se tocan en un punto. Con las dos, se cortan
              entre sí en $x=1$ y forman un triángulo curvilíneo. El singular del
              enunciado es una imprecisión de redacción.
          - texto: Uno, el origen
            mensaje: |
              $2x-x^{2} = x(2-x)$ se anula también en $x=2$. Son dos.
          - texto: Uno, el vértice
            mensaje: |
              El vértice está en $(1,1)$, que **no** está sobre el eje $OX$: la
              parábola vale 1 ahí.
          - texto: Ninguno, la parábola no corta al eje
            mensaje: |
              $2x-x^{2}$ es un producto de dos factores lineales: corta al eje
              donde cada uno se anula.

      - tipo: calcular
        titulo: Dónde se cortan las tangentes
        pregunta: |
          Las dos tangentes son $y=2x$ e $y=-2x+4$. ¿En qué $x$ se cortan?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es el segundo punto de tangencia, donde la recta $y=-2x+4$ toca a
              la parábola. Las dos rectas se cortan entre sí antes.
          - valor: '0'
            mensaje: |
              0 es el primer punto de tangencia. En $x=0$ la recta $y=2x$ vale 0
              y la otra vale 4: no coinciden.
          - valor: '4'
            mensaje: |
              4 es el término independiente de la segunda tangente. Hay que
              resolver $2x = -2x+4$.
        pista: |
          Iguala $2x = -2x+4$.
        desarrollo: |
          **Las tangentes.** $y' = 2-2x$.

          En $x=0$: pendiente 2, y la recta pasa por el origen:

          $$
          y = 2x
          $$

          En $x=2$: pendiente $2-4 = -2$, y la recta pasa por $(2,0)$:

          $$
          y = -2(x-2) = -2x+4
          $$

          **Su corte:**

          $$
          2x = -2x+4 \;\Longrightarrow\; 4x = 4 \;\Longrightarrow\; x = 1
          $$

          En $x=1$ las dos valen 2, mientras que la parábola vale 1. La figura es
          un triángulo curvilíneo con vértices en $(0,0)$, $(2,0)$ y $(1,2)$.
        veredicto: |
          El punto de corte cae justo encima del vértice de la parábola, en la
          misma vertical $x=1$. Ahí la separación entre las tangentes y la
          parábola es máxima: $2-1 = 1$.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área de $D$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.6667'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0.3333'
            mensaje: |
              $\frac13$ es solo **uno** de los dos trozos. Los dos valen lo
              mismo y hay que sumarlos.
          - valor: '1.3333'
            mensaje: |
              $\frac43$ es el área **bajo la parábola**,
              $\int_0^{2}\left(2x-x^{2}\right)dx$. El dominio $D$ es el de
              **encima** de la parábola, entre ella y las tangentes.
          - valor: '2'
            mensaje: |
              2 es el área del triángulo de vértices $(0,0)$, $(2,0)$ y
              $(1,2)$, que envuelve al dominio. $D$ es ese triángulo **menos**
              lo que hay bajo la parábola.
        pista: |
          Parte en $x=1$: $A = \int_0^{1}\left[2x-(2x-x^{2})\right]dx
          +\int_1^{2}\left[(-2x+4)-(2x-x^{2})\right]dx$.
        desarrollo: |
          **Trozo izquierdo**, con la tangente $y=2x$ por encima:

          $$
          2x-\left(2x-x^{2}\right) = x^{2}
          $$

          $$
          \int_0^{1}x^{2}dx = \frac13
          $$

          **Trozo derecho**, con $y=-2x+4$ por encima:

          $$
          -2x+4-2x+x^{2} = x^{2}-4x+4 = (x-2)^{2}
          $$

          $$
          \int_1^{2}(x-2)^{2}dx = \left[\frac{(x-2)^{3}}{3}\right]_1^{2}
          = 0+\frac13 = \frac13
          $$

          $$
          A = \frac13+\frac13 = \frac23 \approx 0{,}6667
          $$
        veredicto: |
          Otra vez cuadrados perfectos: la diferencia entre una parábola y su
          tangente es siempre el cuadrado de la distancia al punto de tangencia,
          escalado por el coeficiente principal —aquí $-1$, que da el signo
          correcto porque la parábola queda **por debajo**—.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen al girar sobre $OX$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '5.0265'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '2.5133'
            mensaje: |
              $\frac{4\pi}{5}$ es solo **uno** de los dos trozos. Los dos valen
              lo mismo por simetría respecto de $x=1$.
          - valor: '3.3510'
            mensaje: |
              $\frac{16\pi}{15}$ es el volumen que genera **la parábola sola**
              al girar. Aquí hay que restar ese sólido del que generan las
              tangentes.
          - valor: '8.3776'
            mensaje: |
              $\frac{8\pi}{3}$ es el volumen del **doble cono** que generan las
              dos tangentes. Es el término del que hay que restar, no el
              resultado.
        pista: |
          Arandelas: $V = \pi\int\left(R^{2}-r^{2}\right)$, con $R$ la tangente
          y $r$ la parábola.
        desarrollo: |
          **Trozo izquierdo**, $R = 2x$ y $r = 2x-x^{2}$:

          $$
          R^{2}-r^{2} = 4x^{2}-\left(4x^{2}-4x^{3}+x^{4}\right)
          = 4x^{3}-x^{4}
          $$

          $$
          \pi\int_0^{1}\left(4x^{3}-x^{4}\right)dx
          = \pi\left(1-\frac15\right) = \frac{4\pi}{5}
          $$

          **Trozo derecho.** Por simetría respecto de $x=1$ vale lo mismo:
          $\frac{4\pi}{5}$.

          $$
          V = \frac{4\pi}{5}+\frac{4\pi}{5} = \frac{8\pi}{5}
          \approx 5{,}0265
          $$
        veredicto: |
          La simetría respecto de $x=1$ ahorra la mitad del trabajo, y además
          sirve de comprobación: si los dos trozos salieran distintos, habría un
          error en alguno.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Los cortes con $OX$:** $2x-x^{2} = x(2-x) = 0$ da $x=0$ y $x=2$.
              Son **dos**, aunque el enunciado hable en singular.
          - texto: |
              **Las tangentes:** $y=2x$ en el origen e $y=-2x+4$ en $(2,0)$. Se
              cortan en $(1,2)$, justo encima del vértice de la parábola.
          - texto: |
              **La parábola queda por debajo** de las dos tangentes, porque es
              cóncava ($y''=-2<0$). Las tangentes son el techo y la parábola el
              suelo.
          - texto: |
              **(a)** $\int_0^{1}x^{2}dx+\int_1^{2}(x-2)^{2}dx
              = \frac13+\frac13 = \frac23$.
          - texto: |
              **(b)** Con arandelas,
              $\pi\int\left(R^{2}-r^{2}\right)$, sale
              $\frac{4\pi}{5}$ por trozo, y en total $\frac{8\pi}{5}$.
          - texto: |
              Con una sola tangente basta: el enunciado dice «el punto de corte»
              en singular, y la región queda cerrada por la parábola y esa recta.
            trampa: true
            mensaje: |
              Con una sola tangente la región **no se cierra**: una recta
              tangente toca a la parábola en un único punto y las dos se separan
              indefinidamente. Hacen falta las dos, y entonces se cortan entre sí
              formando un triángulo curvilíneo. El singular del enunciado es una
              imprecisión de redacción; la solución publicada confirma que son
              las dos.
        veredicto: |
          Este ejercicio y el 5.13 son el mismo esquema —parábola más dos
          tangentes— con la parábola volteada. Merece la pena verlos juntos.

    resolucion: |
      **Datos.** $y = 2x-x^{2}$ y sus tangentes en los cortes con $OX$.

      ### 1 · Una imprecisión del enunciado que hay que resolver

      El enunciado dice «su recta tangente en **el** punto de corte», en
      singular. Pero

      $$
      2x-x^{2} = x(2-x) = 0
      \;\Longrightarrow\;
      x = 0,\quad x = 2
      $$

      Hay **dos** cortes. Y con una sola tangente el dominio no queda cerrado: la
      recta toca a la parábola en un punto y a partir de ahí las dos se separan
      sin volver a encontrarse.

      Con **las dos** tangentes sí se cierra: se cortan entre sí y forman un
      triángulo curvilíneo. Es la lectura que hace el ejercicio resoluble, y la
      que confirma la solución publicada del boletín.

      ### 2 · Las dos tangentes

      $$
      y' = 2-2x
      $$

      **En $(0,0)$:** pendiente $y'(0) = 2$, luego $y = 2x$.

      **En $(2,0)$:** pendiente $y'(2) = -2$, luego $y = -2(x-2) = -2x+4$.

      **Se cortan** donde $2x = -2x+4$, es decir en $x=1$, con $y=2$. Ese punto
      está justo encima del **vértice** de la parábola, $(1,1)$.

      La figura tiene vértices en $(0,0)$, $(2,0)$ y $(1,2)$, con el lado
      inferior curvado hacia arriba.

      ### 3 · Quién va encima

      La parábola es **cóncava** ($y'' = -2 < 0$), así que queda siempre **por
      debajo** de sus tangentes. Las rectas son el techo y la parábola el suelo.

      | tramo | techo | suelo |
      |---|---|---|
      | $0\le x\le1$ | $2x$ | $2x-x^{2}$ |
      | $1\le x\le2$ | $-2x+4$ | $2x-x^{2}$ |

      ### 4 · Apartado (a): el área

      **Trozo izquierdo:**

      $$
      2x-\left(2x-x^{2}\right) = x^{2}
      \;\Longrightarrow\;
      \int_0^{1}x^{2}dx = \frac13
      $$

      **Trozo derecho:**

      $$
      (-2x+4)-\left(2x-x^{2}\right) = x^{2}-4x+4 = (x-2)^{2}
      $$

      $$
      \int_1^{2}(x-2)^{2}dx = \left[\frac{(x-2)^{3}}{3}\right]_1^{2}
      = 0-\left(-\frac13\right) = \frac13
      $$

      $$
      \boxed{A = \frac13+\frac13 = \frac23}
      $$

      Otra vez **cuadrados perfectos**: la diferencia entre una parábola y su
      tangente en $x_0$ es $a\left(x-x_0\right)^{2}$, aquí con $a=-1$ y la
      diferencia tomada al revés porque la parábola va por debajo.

      ### 5 · Apartado (b): el volumen

      Al girar alrededor de $OX$, el dominio no toca el eje salvo en los dos
      extremos: hace falta **arandelas**.

      $$
      V = \pi\int\left(R^{2}-r^{2}\right)dx
      $$

      con $R$ la tangente —el radio exterior, porque está arriba— y $r$ la
      parábola.

      **Trozo izquierdo:**

      $$
      R^{2}-r^{2} = (2x)^{2}-\left(2x-x^{2}\right)^{2}
      = 4x^{2}-4x^{2}+4x^{3}-x^{4} = 4x^{3}-x^{4}
      $$

      $$
      \pi\int_0^{1}\left(4x^{3}-x^{4}\right)dx
      = \pi\left[x^{4}-\frac{x^{5}}{5}\right]_0^{1}
      = \pi\left(1-\frac15\right) = \frac{4\pi}{5}
      $$

      **Trozo derecho.** La figura es simétrica respecto de $x=1$ —la parábola lo
      es, y las dos tangentes son reflejo una de otra—, así que vale lo mismo:

      $$
      \frac{4\pi}{5}
      $$

      $$
      \boxed{V = \frac{8\pi}{5} \approx 5{,}027}
      $$

      ### 6 · Comprobación

      **Del área, por diferencia de figuras.** El triángulo de vértices $(0,0)$,
      $(2,0)$ y $(1,2)$ tiene área $\frac12\cdot2\cdot2 = 2$. El área bajo la
      parábola es

      $$
      \int_0^{2}\left(2x-x^{2}\right)dx = 4-\frac83 = \frac43
      $$

      $$
      2-\frac43 = \frac23 \quad\checkmark
      $$

      **Del volumen, por diferencia de sólidos.** Las dos tangentes generan un
      **doble cono** de radio 2 y altura 1 cada mitad:

      $$
      2\cdot\frac13\pi\cdot4\cdot1 = \frac{8\pi}{3}
      $$

      La parábola genera

      $$
      \pi\int_0^{2}\left(2x-x^{2}\right)^{2}dx = \frac{16\pi}{15}
      $$

      $$
      \frac{8\pi}{3}-\frac{16\pi}{15} = \frac{40\pi-16\pi}{15}
      = \frac{24\pi}{15} = \frac{8\pi}{5} \quad\checkmark
      $$

      Dos comprobaciones por vía independiente, las dos exactas.

      ### 7 · Comparación con el ejercicio 5.13

      Los dos son «parábola más dos tangentes», y salen áreas parecidas por la
      misma razón. La diferencia:

      | | 5.13 | 5.22 |
      |---|---|---|
      | parábola | convexa, $a=+1$ | cóncava, $a=-1$ |
      | dónde queda | **encima** de sus tangentes | **debajo** de sus tangentes |
      | quién es el techo | la parábola | las tangentes |
      | integrando | $(x-x_0)^{2}$ | $(x-x_0)^{2}$ |

      El integrando sale igual porque el signo de $a$ y el orden de la resta se
      compensan: en 5.13 se resta la tangente a la parábola, y en 5.22 al revés.
      Verlo evita rehacer el razonamiento entero la segunda vez.

  - id: integrales-inmediatas
    titulo: Diez inmediatas, o cómo reconocer una derivada escondida
    fuente: >-
      Ejercicio 5.23 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU ·
      El boletín no publica solución; el desarrollo es nuestro
    nivel: practica
    enunciado: |
      Integrales inmediatas

      **(a)** $\displaystyle\int e^{\mathrm{sen}^{2}x}\,\mathrm{sen}(2x)\,dx$ ·
      **(b)** $\displaystyle\int x\,\mathrm{sen}\left(x^{2}\right)dx$ ·
      **(c)** $\displaystyle\int\frac{e^{x}}{1+e^{2x}}dx$ ·
      **(d)** $\displaystyle\int\frac{17x}{\sqrt[3]{6x^{2}+8}}dx$ ·
      **(e)** $\displaystyle\int\sec^{2}x\sqrt{\tan x}\,dx$

      **(f)** $\displaystyle\int\frac{\ln x}{x}dx$ ·
      **(g)** $\displaystyle\int\frac{dx}{x\ln x}$ ·
      **(h)** $\displaystyle\int\frac{\cos\sqrt x}{\sqrt x}dx$ ·
      **(i)** $\displaystyle\int\frac{x}{\sqrt{1-x^{4}}}dx$ ·
      **(j)** $\displaystyle\int\mathrm{sen}\,x\cos x\,dx$
    pide: Calcular las diez primitivas.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tienen en común las diez?
        opciones:
          - texto: >-
              En todas aparece **una función y su derivada** multiplicando: son
              de la forma $\int g'(x)\,h\big(g(x)\big)dx$
            correcta: true
            mensaje: |
              Eso es, y por eso se llaman inmediatas: se resuelven con el cambio
              $u = g(x)$, que las convierte en una primitiva de tabla. Todo el
              trabajo está en **ver** cuál es la $g$.
          - texto: Todas se hacen por partes
            mensaje: |
              Ninguna lo necesita. Por partes es el recurso cuando **no** se
              reconoce una función con su derivada.
          - texto: Todas son racionales
            mensaje: |
              Solo (c), (g) e (i) tienen aspecto de cociente, y ninguna se
              resuelve descomponiendo en fracciones simples.
          - texto: Todas dan un logaritmo
            mensaje: |
              Solo (g) lo da. Las demás dan exponenciales, senos, arcotangentes,
              arcosenos y potencias.

      - tipo: calcular
        titulo: El apartado (d), el de los números feos
        pregunta: |
          En $\int\frac{17x}{\sqrt[3]{6x^{2}+8}}dx$, el resultado tiene la forma
          $k\left(6x^{2}+8\right)^{2/3}$. ¿Cuánto vale $k$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '2.1250'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '1.4166667'
            mensaje: |
              $\frac{17}{12}$ es el factor antes de integrar. Falta multiplicar
              por el $\frac32$ que aparece al subir de $u^{-1/3}$ a $u^{2/3}$.
          - valor: '0.9444444'
            mensaje: |
              $\frac{17}{18}$ saldría de **dividir** entre $\frac32$ en vez de
              multiplicar. Al integrar $u^{-1/3}$ el exponente sube a
              $\frac23$, y se divide entre $\frac23$, es decir se multiplica por
              $\frac32$.
          - valor: '8.5'
            mensaje: |
              $\frac{17}{2}$ olvida el 6 de la derivada interna: $du = 12x\,dx$,
              no $2x\,dx$.
        pista: |
          $u = 6x^{2}+8$, $du = 12x\,dx$.
        desarrollo: |
          $$
          u = 6x^{2}+8 \;\Longrightarrow\; du = 12x\,dx
          \;\Longrightarrow\; x\,dx = \frac{du}{12}
          $$

          $$
          \int\frac{17x\,dx}{\sqrt[3]{6x^{2}+8}}
          = \frac{17}{12}\int u^{-1/3}du
          = \frac{17}{12}\cdot\frac{u^{2/3}}{2/3}
          = \frac{17}{12}\cdot\frac32\,u^{2/3}
          $$

          $$
          = \frac{17}{8}\left(6x^{2}+8\right)^{2/3}+C
          $$

          $$
          k = \frac{17}{8} = 2{,}125
          $$
        veredicto: |
          El 17 está puesto a mala idea: obliga a arrastrar una fracción y a no
          confiar en que «los números salgan redondos».

      - tipo: calcular
        titulo: El apartado (i)
        pregunta: |
          $\int\frac{x\,dx}{\sqrt{1-x^{4}}} = k\arcsin\left(x^{2}\right)+C$.
          ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Falta el $\frac12$ que viene de $du = 2x\,dx$: hay una $x$ suelta y
              la derivada de $x^{2}$ es $2x$.
          - valor: '2'
            mensaje: |
              Has multiplicado por 2 en vez de dividir. $x\,dx = \frac{du}{2}$.
          - valor: '0.25'
            mensaje: |
              $\frac14$ saldría de dividir dos veces entre 2. Solo hay un cambio
              de variable.
        pista: |
          $x^{4} = \left(x^{2}\right)^{2}$. Prueba $u = x^{2}$.
        desarrollo: |
          Reescribiendo $x^{4} = \left(x^{2}\right)^{2}$, aparece la forma del
          arcoseno:

          $$
          u = x^{2} \;\Longrightarrow\; du = 2x\,dx
          $$

          $$
          \int\frac{x\,dx}{\sqrt{1-\left(x^{2}\right)^{2}}}
          = \frac12\int\frac{du}{\sqrt{1-u^{2}}}
          = \frac12\arcsin u
          $$

          $$
          = \frac12\arcsin\left(x^{2}\right)+C
          $$
        veredicto: |
          Reescribir $x^{4}$ como $\left(x^{2}\right)^{2}$ es el paso entero. Sin
          ese gesto la integral parece irracional y no lo es.

      - tipo: justificar
        pregunta: |
          Ordena las diez, agrupadas por el cambio que las resuelve. Una de las
          piezas no debe entrar.
        piezas:
          - texto: |
              **El método:** buscar una función $g$ cuya derivada aparezca
              multiplicando, y hacer $u=g(x)$.
          - texto: |
              **(a)** $u=\mathrm{sen}^{2}x$, cuya derivada es
              $\mathrm{sen}\,2x$: da $e^{\mathrm{sen}^{2}x}$.
              **(b)** $u=x^{2}$: da $-\frac{\cos\left(x^{2}\right)}{2}$.
          - texto: |
              **(c)** $u=e^{x}$, y como $e^{2x} = \left(e^{x}\right)^{2}$ queda
              un arcotangente: $\arctan\left(e^{x}\right)$.
              **(d)** $u=6x^{2}+8$: da
              $\frac{17}{8}\left(6x^{2}+8\right)^{2/3}$.
          - texto: |
              **(e)** $u=\tan x$, cuya derivada es $\sec^{2}x$: da
              $\frac23\tan^{3/2}x$.
              **(f)** $u=\ln x$: da $\frac{\ln^{2}x}{2}$.
              **(g)** también $u=\ln x$, pero ahora en el denominador: da
              $\ln\left|\ln x\right|$.
          - texto: |
              **(h)** $u=\sqrt x$: da $2\,\mathrm{sen}\sqrt x$.
              **(i)** $u=x^{2}$: da $\frac12\arcsin\left(x^{2}\right)$.
              **(j)** $u=\mathrm{sen}\,x$: da $\frac{\mathrm{sen}^{2}x}{2}$.
          - texto: |
              En (f) y (g) el cambio es el mismo, así que las dos primitivas se
              diferencian solo en una constante.
            trampa: true
            mensaje: |
              El cambio es el mismo, $u=\ln x$, pero las integrales resultantes
              son **distintas**: $\int u\,du$ en (f) y $\int\frac{du}{u}$ en (g).
              Una da $\frac{u^{2}}{2}$ y la otra $\ln\left|u\right|$: no se
              parecen en nada. Compartir cambio no es compartir resultado.
        veredicto: |
          El par (f)/(g) es el mejor del ejercicio: mismo cambio, resultados
          completamente distintos según dónde esté el $\ln x$.

    resolucion: |
      **Datos.** Diez integrales indefinidas, todas resolubles con un cambio de
      variable inmediato.

      ### 1 · El patrón

      Todas tienen la forma

      $$
      \int g'(x)\cdot h\big(g(x)\big)\,dx
      $$

      es decir, **una función y su derivada** multiplicando. El cambio
      $u = g(x)$, $du = g'(x)dx$ las convierte en $\int h(u)\,du$, que es de
      tabla.

      El trabajo entero está en **ver cuál es la $g$**, y para eso ayuda mirar
      qué hay dentro de la parte complicada —del exponente, de la raíz, del
      logaritmo— y comprobar si su derivada anda suelta por ahí.

      ### 2 · Las diez, una a una

      **(a)** Dentro del exponente hay $\mathrm{sen}^{2}x$, y su derivada es
      $2\,\mathrm{sen}\,x\cos x = \mathrm{sen}\,2x$, que es justo lo que
      multiplica:

      $$
      \int e^{\mathrm{sen}^{2}x}\,\mathrm{sen}(2x)\,dx
      = e^{\mathrm{sen}^{2}x}+C
      $$

      **(b)** $u = x^{2}$, $du = 2x\,dx$:

      $$
      \int x\,\mathrm{sen}\left(x^{2}\right)dx
      = \frac12\int\mathrm{sen}\,u\,du
      = -\frac{\cos\left(x^{2}\right)}{2}+C
      $$

      **(c)** Reescribiendo $e^{2x} = \left(e^{x}\right)^{2}$ aparece la forma
      del arcotangente, con $u=e^{x}$:

      $$
      \int\frac{e^{x}dx}{1+\left(e^{x}\right)^{2}}
      = \arctan\left(e^{x}\right)+C
      $$

      **(d)** $u = 6x^{2}+8$, $du = 12x\,dx$:

      $$
      \frac{17}{12}\int u^{-1/3}du = \frac{17}{12}\cdot\frac32 u^{2/3}
      = \frac{17}{8}\left(6x^{2}+8\right)^{2/3}+C
      $$

      **(e)** $u = \tan x$, y $\sec^{2}x\,dx = du$:

      $$
      \int u^{1/2}du = \frac23\tan^{3/2}x+C
      $$

      **(f)** $u = \ln x$, $du = \frac{dx}{x}$:

      $$
      \int u\,du = \frac{\ln^{2}x}{2}+C
      $$

      **(g)** El **mismo** cambio, pero el $\ln x$ está abajo:

      $$
      \int\frac{du}{u} = \ln\left|\ln x\right|+C
      $$

      **(h)** $u = \sqrt x$, $du = \frac{dx}{2\sqrt x}$, o sea
      $\frac{dx}{\sqrt x} = 2\,du$:

      $$
      2\int\cos u\,du = 2\,\mathrm{sen}\sqrt x+C
      $$

      **(i)** $x^{4} = \left(x^{2}\right)^{2}$, luego $u = x^{2}$:

      $$
      \frac12\int\frac{du}{\sqrt{1-u^{2}}} = \frac12\arcsin\left(x^{2}\right)+C
      $$

      **(j)** $u = \mathrm{sen}\,x$:

      $$
      \int u\,du = \frac{\mathrm{sen}^{2}x}{2}+C
      $$

      ### 3 · Una advertencia sobre (j)

      La misma integral admite otras dos formas:

      $$
      -\frac{\cos^{2}x}{2}+C
      \qquad\text{y}\qquad
      -\frac{\cos 2x}{4}+C
      $$

      Las tres son correctas. **Se diferencian en una constante**, y una
      primitiva está definida salvo constante:

      $$
      \frac{\mathrm{sen}^{2}x}{2}-\left(-\frac{\cos^{2}x}{2}\right)
      = \frac{\mathrm{sen}^{2}x+\cos^{2}x}{2} = \frac12
      $$

      Un resultado que no coincide con el del libro no está necesariamente mal:
      hay que restar y ver si la diferencia es constante.

      ### 4 · El par que más enseña

      **(f)** y **(g)** usan el mismo cambio, $u = \ln x$, y dan cosas
      completamente distintas:

      | | integral en $u$ | resultado |
      |---|---|---|
      | (f) | $\int u\,du$ | $\frac{\ln^{2}x}{2}$ |
      | (g) | $\int\frac{du}{u}$ | $\ln\lvert\ln x\rvert$ |

      Compartir cambio no es compartir resultado. Lo que decide es **dónde**
      está la función: multiplicando o dividiendo.

      ### 5 · Comprobación

      La comprobación de una primitiva es siempre la misma: **derivarla**. Tres
      ejemplos:

      $$
      \frac{d}{dx}\left[e^{\mathrm{sen}^{2}x}\right]
      = e^{\mathrm{sen}^{2}x}\cdot2\,\mathrm{sen}\,x\cos x
      = e^{\mathrm{sen}^{2}x}\,\mathrm{sen}\,2x \quad\checkmark
      $$

      $$
      \frac{d}{dx}\left[\frac{17}{8}\left(6x^{2}+8\right)^{2/3}\right]
      = \frac{17}{8}\cdot\frac23\left(6x^{2}+8\right)^{-1/3}\cdot12x
      = \frac{17x}{\sqrt[3]{6x^{2}+8}} \quad\checkmark
      $$

      $$
      \frac{d}{dx}\left[\ln\left|\ln x\right|\right]
      = \frac{1}{\ln x}\cdot\frac1x = \frac{1}{x\ln x} \quad\checkmark
      $$

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \text{(a)}\ & e^{\mathrm{sen}^{2}x} &
      \text{(f)}\ & \tfrac{\ln^{2}x}{2} \\
      \text{(b)}\ & -\tfrac{\cos(x^{2})}{2} &
      \text{(g)}\ & \ln\left|\ln x\right| \\
      \text{(c)}\ & \arctan(e^{x}) &
      \text{(h)}\ & 2\,\mathrm{sen}\sqrt x \\
      \text{(d)}\ & \tfrac{17}{8}(6x^{2}+8)^{2/3} &
      \text{(i)}\ & \tfrac12\arcsin(x^{2}) \\
      \text{(e)}\ & \tfrac23\tan^{3/2}x &
      \text{(j)}\ & \tfrac{\mathrm{sen}^{2}x}{2}
      \end{aligned}}
      $$

      (todas con $+C$)

  - id: integracion-por-partes
    titulo: Nueve por partes, y la regla ALPES
    fuente: >-
      Ejercicio 5.24 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU ·
      El boletín no publica solución; el desarrollo es nuestro
    nivel: practica
    enunciado: |
      Calcular las siguientes integrales utilizando integración por partes:

      **(a)** $\displaystyle\int x\ln x\,dx$ ·
      **(b)** $\displaystyle\int x\,\mathrm{sen}\,x\,dx$ ·
      **(c)** $\displaystyle\int x^{2}\,\mathrm{sen}\,x\,dx$ ·
      **(d)** $\displaystyle\int\ln x\,dx$ ·
      **(e)** $\displaystyle\int\arctan x\,dx$

      **(f)** $\displaystyle\int\arcsin x\,dx$ ·
      **(g)** $\displaystyle\int\left(x^{2}-2x+5\right)e^{-x}dx$ ·
      **(h)** $\displaystyle\int x\,\mathrm{sen}\,x\cos x\,dx$ ·
      **(i)** $\displaystyle\int e^{x}\,\mathrm{sen}\,x\,dx$
    pide: Calcular las nueve primitivas por partes.

    pasos:
      - tipo: reconocer
        pregunta: |
          En (d), (e) y (f) hay **una sola** función. ¿Cómo se aplica por partes?
        opciones:
          - texto: >-
              Tomando $u$ = la función y $dv = dx$, es decir inventando el
              factor 1
            correcta: true
            mensaje: |
              Exacto. $\int\ln x\,dx = \int 1\cdot\ln x\,dx$, y por partes la
              derivada del logaritmo —que es $\frac1x$— se combina con la
              primitiva de 1 —que es $x$— dando $\int1\,dx$. El truco convierte
              una función sin primitiva evidente en una trivial.
          - texto: 'No se puede: por partes necesita dos factores'
            mensaje: |
              El segundo factor es 1, y siempre está ahí. Es el uso más elegante
              del método.
          - texto: Tomando $u=1$ y $dv$ = la función
            mensaje: |
              Al revés: si $u=1$ entonces $du=0$ y la fórmula no avanza. Además
              $dv$ = la función exige saber su primitiva, que es justo lo que se
              busca.
          - texto: Hay que hacer primero un cambio de variable
            mensaje: |
              No hace falta en ninguna de las tres. Sale directamente con el
              factor 1.

      - tipo: calcular
        titulo: El apartado (a)
        pregunta: |
          $\int x\ln x\,dx = \frac{x^{2}}{2}\ln x-kx^{2}+C$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.5'
            mensaje: |
              $\frac12$ es el coeficiente que sale antes de integrar. La
              integral restante es $\int\frac x2 dx = \frac{x^{2}}{4}$: el 2 del
              denominador se convierte en 4.
          - valor: '0.3333333'
            mensaje: |
              $\frac13$ saldría de integrar $x^{2}$. Aquí lo que se integra es
              $\frac x2$, de grado 1.
          - valor: '1'
            mensaje: |
              1 olvida los dos factores $\frac12$: el de $v = \frac{x^{2}}{2}$ y
              el de integrar $x$.
        pista: |
          ALPES: el **L**ogaritmo va antes que la **P**otencia, así que
          $u = \ln x$.
        desarrollo: |
          $$
          u = \ln x,\qquad dv = x\,dx
          $$

          $$
          du = \frac{dx}{x},\qquad v = \frac{x^{2}}{2}
          $$

          $$
          \int x\ln x\,dx = \frac{x^{2}}{2}\ln x-\int\frac{x^{2}}{2}\cdot
          \frac{dx}{x} = \frac{x^{2}}{2}\ln x-\frac12\int x\,dx
          $$

          $$
          = \frac{x^{2}}{2}\ln x-\frac{x^{2}}{4}+C
          $$

          $$
          k = \frac14 = 0{,}25
          $$
        veredicto: |
          Elegir $u = \ln x$ es lo que hace funcionar el método: al derivarlo
          desaparece el logaritmo. Al revés, con $u=x$, la integral restante
          sería peor que la de partida.

      - tipo: calcular
        titulo: El apartado (i), el que se muerde la cola
        pregunta: |
          $\int e^{x}\,\mathrm{sen}\,x\,dx
          = k\,e^{x}\left(\mathrm{sen}\,x-\cos x\right)+C$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Falta el $\frac12$. Al aplicar partes dos veces reaparece la
              integral original, y al despejarla queda
              $2I = e^{x}(\mathrm{sen}\,x-\cos x)$.
          - valor: '-0.5'
            mensaje: |
              Signo cambiado. Comprueba derivando: la derivada de
              $\frac{e^{x}}{2}(\mathrm{sen}\,x-\cos x)$ tiene que dar
              $e^{x}\,\mathrm{sen}\,x$, positivo.
          - valor: '0.25'
            mensaje: |
              $\frac14$ saldría de dividir dos veces entre 2. Solo se despeja una
              vez.
        pista: |
          Aplica partes **dos** veces y observa que reaparece la integral de
          partida.
        desarrollo: |
          Llamando $I$ a la integral y tomando $u = \mathrm{sen}\,x$,
          $dv = e^{x}dx$:

          $$
          I = e^{x}\,\mathrm{sen}\,x-\int e^{x}\cos x\,dx
          $$

          Y otra vez, con $u = \cos x$:

          $$
          \int e^{x}\cos x\,dx = e^{x}\cos x+\int e^{x}\,\mathrm{sen}\,x\,dx
          = e^{x}\cos x+I
          $$

          Sustituyendo:

          $$
          I = e^{x}\,\mathrm{sen}\,x-e^{x}\cos x-I
          $$

          $$
          2I = e^{x}\left(\mathrm{sen}\,x-\cos x\right)
          \;\Longrightarrow\;
          I = \frac{e^{x}}{2}\left(\mathrm{sen}\,x-\cos x\right)+C
          $$
        veredicto: |
          **Es imprescindible mantener el mismo criterio en las dos
          aplicaciones**: si en la segunda se toma $u = e^{x}$, todo se cancela y
          queda $I=I$, cierto e inútil.

      - tipo: justificar
        pregunta: |
          Ordena el método y sus nueve resultados. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **La fórmula:** $\int u\,dv = uv-\int v\,du$, y el criterio
              **ALPES** para elegir $u$: **A**rcos, **L**ogaritmos,
              **P**otencias, **E**xponenciales, **S**enos. El que aparezca antes
              es $u$.
          - texto: |
              **Con una sola función**, (d) (e) (f), se toma $dv = dx$:
              $\int\ln x = x\ln x-x$;
              $\int\arctan x = x\arctan x-\frac12\ln\left(1+x^{2}\right)$;
              $\int\arcsin x = x\arcsin x+\sqrt{1-x^{2}}$.
          - texto: |
              **Potencia por seno**, (b) y (c): $u$ es la potencia, y cada
              aplicación le baja un grado.
              $\int x\,\mathrm{sen}\,x = -x\cos x+\mathrm{sen}\,x$;
              $\int x^{2}\mathrm{sen}\,x = -x^{2}\cos x+2x\,\mathrm{sen}\,x
              +2\cos x$.
          - texto: |
              **(a)** $\frac{x^{2}}{2}\ln x-\frac{x^{2}}{4}$.
              **(g)** $-e^{-x}\left(x^{2}+5\right)$, aplicando partes dos veces.
          - texto: |
              **(h)** Conviene simplificar antes:
              $\mathrm{sen}\,x\cos x = \frac{\mathrm{sen}\,2x}{2}$, y sale
              $-\frac{x\cos2x}{4}+\frac{\mathrm{sen}\,2x}{8}$.
              **(i)** Sale despejando: $\frac{e^{x}}{2}\left(\mathrm{sen}\,x
              -\cos x\right)$.
          - texto: |
              En (i) conviene tomar $u = \mathrm{sen}\,x$ la primera vez y
              $u = e^{x}$ la segunda, para que la integral se cierre antes.
            trampa: true
            mensaje: |
              Justo lo contrario: cambiar de criterio en la segunda aplicación
              **deshace** la primera y devuelve la identidad $I = I$, cierta e
              inútil. Hay que mantener el mismo papel para el exponencial en las
              dos vueltas.
        veredicto: |
          ALPES no es una regla mágica: funciona porque coloca primero las
          funciones que **se simplifican al derivar** —arcos y logaritmos— y
          últimas las que no cambian.

    resolucion: |
      **Datos.** Nueve integrales por partes.

      ### 1 · La fórmula y el criterio

      $$
      \int u\,dv = uv-\int v\,du
      $$

      La elección de $u$ decide si el método sirve o empeora las cosas. El
      criterio práctico es **ALPES**:

      $$
      \textbf{A}\text{rcos} \;>\;
      \textbf{L}\text{ogaritmos} \;>\;
      \textbf{P}\text{otencias} \;>\;
      \textbf{E}\text{xponenciales} \;>\;
      \textbf{S}\text{enos}
      $$

      El que aparezca **antes** en la lista es $u$.

      No es arbitrario: la lista está ordenada por «cuánto se simplifica al
      derivar». Un arcotangente derivado se convierte en una función racional;
      un logaritmo, en $\frac1x$; una potencia baja un grado; una exponencial no
      cambia; un seno tampoco.

      ### 2 · Las que solo tienen una función

      El truco es escribir $dv = dx$, es decir multiplicar por 1.

      **(d)** $u = \ln x$, $dv = dx$:

      $$
      \int\ln x\,dx = x\ln x-\int x\cdot\frac{dx}{x} = x\ln x-x+C
      $$

      **(e)** $u = \arctan x$, $du = \frac{dx}{1+x^{2}}$:

      $$
      \int\arctan x\,dx = x\arctan x-\int\frac{x\,dx}{1+x^{2}}
      = x\arctan x-\frac12\ln\left(1+x^{2}\right)+C
      $$

      **(f)** $u = \arcsin x$, $du = \frac{dx}{\sqrt{1-x^{2}}}$:

      $$
      \int\arcsin x\,dx = x\arcsin x-\int\frac{x\,dx}{\sqrt{1-x^{2}}}
      = x\arcsin x+\sqrt{1-x^{2}}+C
      $$

      ### 3 · Potencia por función trigonométrica o logaritmo

      **(a)** ALPES pone el logaritmo antes que la potencia, luego $u = \ln x$:

      $$
      \frac{x^{2}}{2}\ln x-\frac12\int x\,dx
      = \frac{x^{2}}{2}\ln x-\frac{x^{2}}{4}+C
      $$

      **(b)** Aquí $u = x$, porque la potencia va antes que el seno:

      $$
      \int x\,\mathrm{sen}\,x\,dx = -x\cos x+\int\cos x\,dx
      = -x\cos x+\mathrm{sen}\,x+C
      $$

      **(c)** El mismo criterio, **dos** veces, porque el grado es 2:

      $$
      \int x^{2}\mathrm{sen}\,x\,dx = -x^{2}\cos x+2\int x\cos x\,dx
      $$

      $$
      = -x^{2}\cos x+2\left(x\,\mathrm{sen}\,x+\cos x\right)+C
      $$

      $$
      = -x^{2}\cos x+2x\,\mathrm{sen}\,x+2\cos x+C
      $$

      **Cada aplicación baja un grado.** Con $x^{n}$ hacen falta $n$ vueltas.

      ### 4 · El polinomio por exponencial

      **(g)** Con $P(x) = x^{2}-2x+5$ y $dv = e^{-x}dx$, dos aplicaciones dan

      $$
      \int P(x)e^{-x}dx = -e^{-x}\left(P+P'+P''\right)+C
      $$

      $$
      P+P'+P'' = \left(x^{2}-2x+5\right)+\left(2x-2\right)+2 = x^{2}+5
      $$

      $$
      \boxed{\int\left(x^{2}-2x+5\right)e^{-x}dx = -e^{-x}\left(x^{2}+5\right)+C}
      $$

      Esa fórmula compacta —sumar el polinomio y todas sus derivadas— vale para
      cualquier $\int P(x)e^{-x}dx$, y ahorra las dos vueltas.

      ### 5 · El que conviene simplificar antes

      **(h)** Aplicar partes directamente funciona, pero es más largo. Usando
      primero la fórmula del ángulo doble:

      $$
      \mathrm{sen}\,x\cos x = \frac{\mathrm{sen}\,2x}{2}
      $$

      $$
      \int x\,\mathrm{sen}\,x\cos x\,dx = \frac12\int x\,\mathrm{sen}\,2x\,dx
      $$

      $$
      = \frac12\left(-\frac{x\cos2x}{2}+\frac{\mathrm{sen}\,2x}{4}\right)
      = -\frac{x\cos2x}{4}+\frac{\mathrm{sen}\,2x}{8}+C
      $$

      **Simplificar el integrando antes de aplicar el método** es siempre la
      primera pregunta que hay que hacerse.

      ### 6 · El que se muerde la cola

      **(i)** Llamando $I$ a la integral, con $u = \mathrm{sen}\,x$ y
      $dv = e^{x}dx$:

      $$
      I = e^{x}\,\mathrm{sen}\,x-\int e^{x}\cos x\,dx
      $$

      Segunda vuelta, **manteniendo el criterio** ($u$ trigonométrica):

      $$
      \int e^{x}\cos x\,dx = e^{x}\cos x+I
      $$

      $$
      I = e^{x}\,\mathrm{sen}\,x-e^{x}\cos x-I
      \;\Longrightarrow\;
      \boxed{I = \frac{e^{x}}{2}\left(\mathrm{sen}\,x-\cos x\right)+C}
      $$

      **El error clásico** es cambiar de criterio en la segunda vuelta: entonces
      se deshace la primera y queda $I=I$, cierto y estéril.

      ### 7 · Comprobación

      Derivando tres de ellas:

      $$
      \frac{d}{dx}\left[x\ln x-x\right] = \ln x+1-1 = \ln x \quad\checkmark
      $$

      $$
      \frac{d}{dx}\left[-e^{-x}\left(x^{2}+5\right)\right]
      = e^{-x}\left(x^{2}+5\right)-e^{-x}\cdot2x
      = e^{-x}\left(x^{2}-2x+5\right) \quad\checkmark
      $$

      $$
      \frac{d}{dx}\left[\frac{e^{x}}{2}\left(\mathrm{sen}\,x-\cos x\right)\right]
      = \frac{e^{x}}{2}\left(\mathrm{sen}\,x-\cos x
      +\cos x+\mathrm{sen}\,x\right) = e^{x}\,\mathrm{sen}\,x \quad\checkmark
      $$

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \text{(a)}\ & \tfrac{x^{2}}{2}\ln x-\tfrac{x^{2}}{4} \\
      \text{(b)}\ & -x\cos x+\mathrm{sen}\,x \\
      \text{(c)}\ & -x^{2}\cos x+2x\,\mathrm{sen}\,x+2\cos x \\
      \text{(d)}\ & x\ln x-x \\
      \text{(e)}\ & x\arctan x-\tfrac12\ln\left(1+x^{2}\right) \\
      \text{(f)}\ & x\arcsin x+\sqrt{1-x^{2}} \\
      \text{(g)}\ & -e^{-x}\left(x^{2}+5\right) \\
      \text{(h)}\ & -\tfrac{x\cos2x}{4}+\tfrac{\mathrm{sen}\,2x}{8} \\
      \text{(i)}\ & \tfrac{e^{x}}{2}\left(\mathrm{sen}\,x-\cos x\right)
      \end{aligned}}
      $$

      (todas con $+C$)

  - id: integrales-racionales
    titulo: Siete racionales, y la comprobación que hay que hacer primero
    fuente: >-
      Ejercicio 5.25 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU ·
      El boletín no publica solución; el desarrollo es nuestro
    nivel: practica
    enunciado: |
      Calcular las integrales de las siguientes funciones racionales:

      **(a)** $\displaystyle\int\frac{dx}{(x-1)(x+2)(x+3)}$ ·
      **(b)** $\displaystyle\int\frac{4x^{2}}{x^{2}+4}dx$ ·
      **(c)** $\displaystyle\int\frac{x^{2}+2}{(x+1)^{3}(x-2)}dx$ ·
      **(d)** $\displaystyle\int\frac{x^{2}+3}{x^{2}-1}dx$

      **(e)** $\displaystyle\int\frac{2x^{2}-3x+2}{x^{3}+x}dx$ ·
      **(f)** $\displaystyle\int\frac{x^{2}}{x^{2}+2x+5}dx$ ·
      **(g)** $\displaystyle\int\frac{x+2}{x^{2}+2x+2}dx$
    pide: Calcular las siete primitivas.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que comprobar **antes** de descomponer en fracciones simples?
        opciones:
          - texto: >-
              Que el grado del numerador sea **menor** que el del denominador;
              si no, hay que **dividir** primero
            correcta: true
            mensaje: |
              Eso es, y es el fallo más común del bloque. En (b), (d) y (f) los
              grados son iguales, así que descomponer directamente da un sistema
              incompatible. Hay que dividir y quedarse con cociente más resto
              partido por el divisor.
          - texto: Que el denominador tenga raíces reales
            mensaje: |
              No hace falta: los factores cuadráticos irreducibles se tratan con
              términos de la forma $\frac{Ax+B}{x^{2}+px+q}$, que dan logaritmos
              y arcotangentes.
          - texto: Que la fracción sea positiva
            mensaje: |
              El signo no interviene en absoluto.
          - texto: Que el denominador esté factorizado
            mensaje: |
              Hay que factorizarlo, sí, pero **después** de comprobar los grados.
              Si el numerador manda, factorizar no sirve de nada todavía.

      - tipo: calcular
        titulo: El apartado (b), donde hay que dividir
        pregunta: |
          $\int\frac{4x^{2}}{x^{2}+4}dx = 4x-k\arctan\frac x2+C$. ¿Cuánto vale
          $k$?
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '16'
            mensaje: |
              16 es el numerador del resto: $\frac{4x^{2}}{x^{2}+4}
              = 4-\frac{16}{x^{2}+4}$. Falta el $\frac12$ de la primitiva del
              arcotangente, porque $a=2$.
          - valor: '4'
            mensaje: |
              4 es el cociente de la división, el término que da $4x$. El
              coeficiente del arcotangente es otro.
          - valor: '2'
            mensaje: |
              2 es el $a$ del denominador $x^{2}+a^{2}$. Aparece en la fórmula,
              pero el coeficiente final es $\frac{16}{2} = 8$.
        pista: |
          Divide primero: $\frac{4x^{2}}{x^{2}+4} = 4-\frac{16}{x^{2}+4}$.
        desarrollo: |
          Los dos grados son 2: **hay que dividir**.

          $$
          \frac{4x^{2}}{x^{2}+4} = \frac{4\left(x^{2}+4\right)-16}{x^{2}+4}
          = 4-\frac{16}{x^{2}+4}
          $$

          $$
          \int\frac{dx}{x^{2}+4} = \frac12\arctan\frac x2
          $$

          $$
          \int\frac{4x^{2}}{x^{2}+4}dx = 4x-16\cdot\frac12\arctan\frac x2
          = 4x-8\arctan\frac x2+C
          $$
        veredicto: |
          Si se descompusiera sin dividir, saldría un sistema sin solución. La
          división no es un adorno: es lo que hace posible la descomposición.

      - tipo: calcular
        titulo: El apartado (c), la raíz triple
        pregunta: |
          En la descomposición
          $\frac{x^{2}+2}{(x+1)^{3}(x-2)}$, el coeficiente del término
          $\frac{D}{x-2}$ vale $D$. ¿Cuánto es? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.2222'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0.6666667'
            mensaje: |
              $\frac23$ olvida el 27 del denominador: al sustituir $x=2$ queda
              $6 = D(2+1)^{3} = 27D$, no $6 = 9D$.
          - valor: '6'
            mensaje: |
              6 es el numerador evaluado en $x=2$: $2^{2}+2 = 6$. Falta dividir
              entre $(2+1)^{3} = 27$.
          - valor: '-1'
            mensaje: |
              $-1$ es el coeficiente $C$ del término
              $\frac{C}{(x+1)^{3}}$, que sale de sustituir $x=-1$.
        pista: |
          Sustituye $x=2$ en la identidad
          $x^{2}+2 = A(x+1)^{2}(x-2)+B(x+1)(x-2)+C(x-2)+D(x+1)^{3}$.
        desarrollo: |
          Una raíz **triple** exige tres términos, uno por cada potencia:

          $$
          \frac{x^{2}+2}{(x+1)^{3}(x-2)}
          = \frac{A}{x+1}+\frac{B}{(x+1)^{2}}+\frac{C}{(x+1)^{3}}
          +\frac{D}{x-2}
          $$

          Multiplicando por el denominador:

          $$
          x^{2}+2 = A(x+1)^{2}(x-2)+B(x+1)(x-2)+C(x-2)+D(x+1)^{3}
          $$

          **En $x=2$** se anulan los tres primeros:

          $$
          6 = D\cdot3^{3} = 27D \;\Longrightarrow\; D = \frac{2}{9}
          \approx 0{,}2222
          $$
        veredicto: |
          Sustituir las raíces del denominador anula casi todos los términos y
          da los coeficientes «de golpe». Los que quedan salen igualando
          coeficientes.

      - tipo: justificar
        pregunta: |
          Ordena el método y sus siete resultados. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **Paso cero:** comparar grados. En (b), (d) y (f) el numerador no
              es de grado menor, así que **hay que dividir** antes de nada.
          - texto: |
              **Raíces simples**, (a) y (d): un término
              $\frac{A}{x-r}$ por raíz, y cada uno da un logaritmo.
              (a) $= \frac{1}{12}\ln\left|x-1\right|-\frac13\ln\left|x+2\right|
              +\frac14\ln\left|x+3\right|$.
              (d) $= x+2\ln\left|\frac{x-1}{x+1}\right|$.
          - texto: |
              **Raíz múltiple**, (c): tantos términos como el orden.
              $= \frac29\ln\left|\frac{x-2}{x+1}\right|-\frac{1}{3(x+1)}
              +\frac{1}{2(x+1)^{2}}$.
          - texto: |
              **Factor cuadrático irreducible**, (b) (e) (f) (g): el término es
              $\frac{Ax+B}{x^{2}+px+q}$, y se parte en un logaritmo más un
              arcotangente completando cuadrados.
          - texto: |
              (b) $= 4x-8\arctan\frac x2$.
              (e) $= 2\ln\left|x\right|-3\arctan x$.
              (f) $= x-\ln\left(x^{2}+2x+5\right)-\frac32\arctan\frac{x+1}{2}$.
              (g) $= \frac12\ln\left(x^{2}+2x+2\right)+\arctan(x+1)$.
          - texto: |
              En (f) y (g) los denominadores no tienen raíces reales, así que
              esas integrales no se pueden resolver con fracciones simples.
            trampa: true
            mensaje: |
              Sí se pueden: un factor cuadrático irreducible **es** un caso
              contemplado por el método. Se le asigna un término
              $\frac{Ax+B}{x^{2}+px+q}$, que se separa en la parte que da un
              logaritmo —la que lleva la derivada del denominador— y la que da
              un arcotangente, completando cuadrados.
        veredicto: |
          Completar cuadrados es la maniobra que convierte cualquier cuadrático
          irreducible en la forma $u^{2}+a^{2}$ del arcotangente.

    resolucion: |
      **Datos.** Siete integrales de funciones racionales.

      ### 1 · El paso cero: comparar grados

      **Antes de descomponer nada**, hay que mirar los grados. Si el numerador
      tiene grado mayor o igual que el denominador, la descomposición en
      fracciones simples **no existe**: hay que dividir primero.

      | | grado num. | grado den. | ¿dividir? |
      |---|---|---|---|
      | (a) | 0 | 3 | no |
      | (b) | 2 | 2 | **sí** |
      | (c) | 2 | 4 | no |
      | (d) | 2 | 2 | **sí** |
      | (e) | 2 | 3 | no |
      | (f) | 2 | 2 | **sí** |
      | (g) | 1 | 2 | no |

      Tres de siete. Saltarse este paso es el fallo más frecuente del bloque.

      ### 2 · Los tres tipos de término

      | factor del denominador | término correspondiente | da |
      |---|---|---|
      | $x-r$ simple | $\frac{A}{x-r}$ | logaritmo |
      | $(x-r)^{n}$ | $\frac{A_1}{x-r}+\cdots+\frac{A_n}{(x-r)^{n}}$ | log + potencias |
      | $x^{2}+px+q$ irreducible | $\frac{Ax+B}{x^{2}+px+q}$ | log + arcotangente |

      ### 3 · (a) Tres raíces simples

      $$
      \frac{1}{(x-1)(x+2)(x+3)}
      = \frac{A}{x-1}+\frac{B}{x+2}+\frac{C}{x+3}
      $$

      Sustituyendo cada raíz:

      $$
      A = \frac{1}{3\cdot4} = \frac{1}{12},
      \quad
      B = \frac{1}{(-3)(1)} = -\frac13,
      \quad
      C = \frac{1}{(-4)(-1)} = \frac14
      $$

      $$
      \int = \frac{1}{12}\ln\left|x-1\right|-\frac13\ln\left|x+2\right|
      +\frac14\ln\left|x+3\right|+C
      $$

      ### 4 · (b) y (d), donde hay que dividir

      **(b)**

      $$
      \frac{4x^{2}}{x^{2}+4} = 4-\frac{16}{x^{2}+4}
      \;\Longrightarrow\;
      \int = 4x-8\arctan\frac{x}{2}+C
      $$

      **(d)**

      $$
      \frac{x^{2}+3}{x^{2}-1} = 1+\frac{4}{x^{2}-1}
      = 1+\frac{2}{x-1}-\frac{2}{x+1}
      $$

      $$
      \int = x+2\ln\left|\frac{x-1}{x+1}\right|+C
      $$

      ### 5 · (c) La raíz triple

      $$
      x^{2}+2 = A(x+1)^{2}(x-2)+B(x+1)(x-2)+C(x-2)+D(x+1)^{3}
      $$

      **$x=-1$:** $3 = -3C \Rightarrow C = -1$

      **$x=2$:** $6 = 27D \Rightarrow D = \frac29$

      **Coeficiente de $x^{3}$:** $0 = A+D \Rightarrow A = -\frac29$

      **Término independiente ($x=0$):**
      $2 = -2A-2B-2C+D = \frac49-2B+2+\frac29$, de donde $B = \frac13$.

      $$
      \int = -\frac29\ln\left|x+1\right|-\frac{1}{3(x+1)}
      +\frac{1}{2(x+1)^{2}}+\frac29\ln\left|x-2\right|+C
      $$

      $$
      = \frac29\ln\left|\frac{x-2}{x+1}\right|-\frac{1}{3(x+1)}
      +\frac{1}{2(x+1)^{2}}+C
      $$

      Nótese que $\int\frac{C\,dx}{(x+1)^{3}}
      = -\frac{C}{2(x+1)^{2}}$, y con $C=-1$ sale el $+\frac{1}{2(x+1)^{2}}$.

      ### 6 · (e) Factor lineal más cuadrático

      $x^{3}+x = x\left(x^{2}+1\right)$, y $x^{2}+1$ es irreducible:

      $$
      \frac{2x^{2}-3x+2}{x\left(x^{2}+1\right)}
      = \frac{A}{x}+\frac{Bx+C}{x^{2}+1}
      $$

      $$
      2x^{2}-3x+2 = A\left(x^{2}+1\right)+(Bx+C)x
      = (A+B)x^{2}+Cx+A
      $$

      $$
      A = 2,\quad C = -3,\quad B = 0
      $$

      $$
      \int = 2\ln\left|x\right|-3\arctan x+C
      $$

      ### 7 · (f) y (g), completando cuadrados

      **(g)** El truco es separar la **derivada del denominador**, que es
      $2x+2$:

      $$
      \frac{x+2}{x^{2}+2x+2} = \frac{x+1}{x^{2}+2x+2}+\frac{1}{x^{2}+2x+2}
      $$

      El primero da un logaritmo; el segundo, completando cuadrados
      $x^{2}+2x+2 = (x+1)^{2}+1$, da un arcotangente:

      $$
      \int = \frac12\ln\left(x^{2}+2x+2\right)+\arctan(x+1)+C
      $$

      **(f)** Primero dividir, y luego lo mismo:

      $$
      \frac{x^{2}}{x^{2}+2x+5} = 1-\frac{2x+5}{x^{2}+2x+5}
      $$

      $$
      \frac{2x+5}{x^{2}+2x+5} = \frac{2x+2}{x^{2}+2x+5}
      +\frac{3}{(x+1)^{2}+4}
      $$

      $$
      \int = x-\ln\left(x^{2}+2x+5\right)-\frac32\arctan\frac{x+1}{2}+C
      $$

      El $\frac32$ sale de $3\cdot\frac12$, con el $\frac12$ de
      $\int\frac{du}{u^{2}+4}$.

      ### 8 · Comprobación

      **De (b), derivando:**

      $$
      \frac{d}{dx}\left[4x-8\arctan\frac x2\right]
      = 4-8\cdot\frac{1/2}{1+\frac{x^{2}}{4}}
      = 4-\frac{16}{x^{2}+4} = \frac{4x^{2}}{x^{2}+4} \quad\checkmark
      $$

      **De (c), evaluando la descomposición** en un punto que no sea raíz,
      $x=1$:

      $$
      \text{izquierda: } \frac{3}{2^{3}\cdot(-1)} = -\frac38
      $$

      $$
      \text{derecha: } -\frac{2}{9\cdot2}+\frac{1}{3\cdot4}
      -\frac{1}{8}-\frac{2}{9} = -\frac38 \quad\checkmark
      $$

      **De (e), derivando:**

      $$
      \frac{2}{x}-\frac{3}{1+x^{2}}
      = \frac{2\left(1+x^{2}\right)-3x}{x\left(1+x^{2}\right)}
      = \frac{2x^{2}-3x+2}{x^{3}+x} \quad\checkmark
      $$

  - id: integrales-irracionales
    titulo: 'Siete irracionales: hacer desaparecer la raíz'
    fuente: >-
      Ejercicio 5.26 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU ·
      El boletín no publica solución; el desarrollo es nuestro
    nivel: practica
    enunciado: |
      Calcular las integrales de las siguientes funciones irracionales:

      **(a)** $\displaystyle\int\frac{\sqrt x}{\sqrt[4]{x^{3}}+1}dx$ ·
      **(b)** $\displaystyle\int x\sqrt{x+1}\,dx$ ·
      **(c)** $\displaystyle\int\frac{\sqrt x-2\sqrt[3]{x^{2}}+1}{\sqrt[4]x}dx$ ·
      **(d)** $\displaystyle\int\frac{\sqrt{x+4}}{x}dx$

      **(e)** $\displaystyle\int\frac{dx}{\sqrt{8-5x^{2}}}$ ·
      **(f)** $\displaystyle\int\sqrt{1+x^{2}}\,dx$ ·
      **(g)** $\displaystyle\int\sqrt{1-x^{2}}\,dx$
    pide: Calcular las siete primitivas.

    pasos:
      - tipo: reconocer
        pregunta: |
          En (a) hay una raíz cuadrada y una cuarta. ¿Qué cambio las quita las
          dos a la vez?
        opciones:
          - texto: >-
              $x = t^{4}$, con el **mínimo común múltiplo** de los índices
            correcta: true
            mensaje: |
              Eso es. Los índices son 2 y 4, y su m.c.m. es 4. Con $x=t^{4}$ la
              raíz cuadrada se vuelve $t^{2}$ y la cuarta $t$: las dos
              desaparecen y queda una función racional.
          - texto: $x = t^{2}$
            mensaje: |
              Quitaría la raíz cuadrada, pero $\sqrt[4]{x^{3}}$ se convertiría en
              $\sqrt{t^{3}}$, que sigue siendo irracional. Hace falta el m.c.m.
          - texto: $x = t^{8}$
            mensaje: |
              Funcionaría, pero deja exponentes innecesariamente altos y una
              racional mucho más fea. Se usa el **mínimo** común múltiplo por
              algo.
          - texto: $x = \mathrm{sen}\,t$
            mensaje: |
              Los cambios trigonométricos sirven para raíces de la forma
              $\sqrt{a^{2}-x^{2}}$, como en (e) y (g). Aquí no hay ninguna suma
              ni diferencia de cuadrados.

      - tipo: calcular
        titulo: El apartado (b)
        pregunta: |
          $\int x\sqrt{x+1}\,dx = k(x+1)^{5/2}-\frac23(x+1)^{3/2}+C$. ¿Cuánto
          vale $k$?
        respuesta:
          tipo: numero
          valor: '0.4'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.2'
            mensaje: |
              $\frac15$ olvida el factor 2 que aparece al deshacer
              $dx = 2t\,dt$.
          - valor: '0.6666667'
            mensaje: |
              $\frac23$ es el coeficiente del **segundo** término, el de
              exponente $\frac32$.
          - valor: '1'
            mensaje: |
              1 olvida el $\frac15$ de integrar $t^{4}$. La cuenta es
              $2\cdot\frac{t^{5}}{5}$.
        pista: |
          $t = \sqrt{x+1}$, luego $x = t^{2}-1$ y $dx = 2t\,dt$.
        desarrollo: |
          $$
          t = \sqrt{x+1}
          \;\Longrightarrow\;
          x = t^{2}-1,\quad dx = 2t\,dt
          $$

          $$
          \int x\sqrt{x+1}\,dx = \int\left(t^{2}-1\right)t\cdot2t\,dt
          = 2\int\left(t^{4}-t^{2}\right)dt
          $$

          $$
          = 2\left(\frac{t^{5}}{5}-\frac{t^{3}}{3}\right)
          = \frac25(x+1)^{5/2}-\frac23(x+1)^{3/2}+C
          $$

          $$
          k = \frac25 = 0{,}4
          $$
        veredicto: |
          El cambio $t=\sqrt{\text{lo de dentro}}$ es el recurso estándar cuando
          hay **una sola** raíz de un binomio lineal. Racionaliza siempre.

      - tipo: calcular
        titulo: El apartado (e)
        pregunta: |
          $\int\frac{dx}{\sqrt{8-5x^{2}}} = k\arcsin\frac{x\sqrt{10}}{4}+C$.
          ¿Cuánto vale $k$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.4472'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '2.2360680'
            mensaje: |
              $\sqrt5$ es el inverso: hay que **dividir** entre $\sqrt5$ al
              sacarlo del radical, no multiplicar. $k = \frac{1}{\sqrt5}$.
          - valor: '1'
            mensaje: |
              1 olvida el coeficiente 5 del $x^{2}$. Si el radicando fuera
              $8-x^{2}$ el resultado sería un arcoseno limpio.
          - valor: '0.3535534'
            mensaje: |
              $\frac{1}{2\sqrt2}$ sale de sacar el 8 en vez del 5. Lo que hay que
              sacar factor común es el coeficiente de $x^{2}$.
        pista: |
          Saca el 5 fuera del radical:
          $\sqrt{8-5x^{2}} = \sqrt5\sqrt{\frac85-x^{2}}$.
        desarrollo: |
          $$
          \sqrt{8-5x^{2}} = \sqrt{5}\sqrt{\frac85-x^{2}}
          $$

          $$
          \int\frac{dx}{\sqrt{8-5x^{2}}}
          = \frac{1}{\sqrt5}\int\frac{dx}{\sqrt{\left(\sqrt{8/5}\right)^{2}
          -x^{2}}}
          = \frac{1}{\sqrt5}\arcsin\frac{x}{\sqrt{8/5}}
          $$

          Y como $\sqrt{\frac85} = \frac{2\sqrt{10}}{5}$:

          $$
          \frac{x}{\sqrt{8/5}} = \frac{5x}{2\sqrt{10}}
          = \frac{x\sqrt{10}}{4}
          $$

          $$
          \int = \frac{1}{\sqrt5}\arcsin\frac{x\sqrt{10}}{4}+C,
          \qquad k = \frac{1}{\sqrt5} \approx 0{,}4472
          $$
        veredicto: |
          Sacar factor común el coeficiente de $x^{2}$ es lo que devuelve la
          forma de tabla $\sqrt{a^{2}-x^{2}}$. Sin eso, la integral no se
          reconoce.

      - tipo: justificar
        pregunta: |
          Ordena los cambios y los siete resultados. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **La idea:** todo cambio busca lo mismo, **hacer desaparecer la
              raíz** y dejar una racional o una trigonométrica.
          - texto: |
              **Varias raíces del mismo $x$**, (a) y (c): $x = t^{m}$ con $m$ el
              **m.c.m.** de los índices. En (c) ni siquiera hace falta: basta
              sumar exponentes.
              (a) $= \frac43\left(x^{3/4}-\ln\left(x^{3/4}+1\right)\right)$.
              (c) $= \frac45x^{5/4}-\frac{24}{17}x^{17/12}+\frac43x^{3/4}$.
          - texto: |
              **Una raíz de un binomio lineal**, (b) y (d):
              $t = \sqrt{\text{radicando}}$.
              (b) $= \frac25(x+1)^{5/2}-\frac23(x+1)^{3/2}$.
              (d) $= 2\sqrt{x+4}+2\ln\left|\frac{\sqrt{x+4}-2}
              {\sqrt{x+4}+2}\right|$.
          - texto: |
              **Diferencia de cuadrados**, (e) y (g): dan arcoseno.
              (e) $= \frac{1}{\sqrt5}\arcsin\frac{x\sqrt{10}}{4}$.
              (g) $= \frac{x\sqrt{1-x^{2}}}{2}+\frac{\arcsin x}{2}$.
          - texto: |
              **Suma de cuadrados**, (f): da el argumento del seno hiperbólico.
              $= \frac{x\sqrt{1+x^{2}}}{2}+\frac{\mathrm{argsh}\,x}{2}$.
          - texto: |
              En (f) y (g) los resultados son iguales salvo el signo del
              radicando, porque las dos integrales son la misma con $x$ imaginaria.
            trampa: true
            mensaje: |
              Las estructuras se parecen, pero las funciones que aparecen son
              **distintas**: un arcoseno en (g) y un argumento del seno
              hiperbólico —es decir, un logaritmo— en (f). Y el paralelismo no
              es una razón: hay que hacer las dos. Invocar números imaginarios
              aquí no demuestra nada.
        veredicto: |
          Los siete cambios responden a tres situaciones: varias raíces del mismo
          $x$, una raíz de un binomio, y una raíz de una suma o diferencia de
          cuadrados. Reconocer cuál es cuál es la mitad del trabajo.

    resolucion: |
      **Datos.** Siete integrales con raíces.

      ### 1 · La estrategia común

      Todos los cambios de este bloque persiguen lo mismo: **quitar la raíz**.
      Lo que cambia es cómo, y hay tres situaciones:

      | qué aparece | cambio | deja |
      |---|---|---|
      | varias raíces de $x$ | $x = t^{m}$, $m$ = m.c.m. de índices | racional |
      | una raíz de $ax+b$ | $t = \sqrt{ax+b}$ | racional |
      | $\sqrt{a^{2}\pm x^{2}}$ | trigonométrico o hiperbólico | trigonométrica |

      ### 2 · (a) Varias raíces: el m.c.m.

      Los índices son 2 y 4, luego $x = t^{4}$, $dx = 4t^{3}dt$:

      $$
      \int\frac{t^{2}}{t^{3}+1}\cdot4t^{3}dt = 4\int\frac{t^{5}}{t^{3}+1}dt
      $$

      Grado 5 sobre grado 3: **hay que dividir**.

      $$
      \frac{t^{5}}{t^{3}+1} = t^{2}-\frac{t^{2}}{t^{3}+1}
      $$

      $$
      4\left[\frac{t^{3}}{3}-\frac13\ln\left|t^{3}+1\right|\right]
      = \frac43\left(t^{3}-\ln\left(t^{3}+1\right)\right)
      $$

      Y deshaciendo, $t^{3} = x^{3/4}$:

      $$
      \boxed{\frac43\left(x^{3/4}-\ln\left(x^{3/4}+1\right)\right)+C}
      $$

      ### 3 · (c) La que no necesita cambio

      Repartiendo el denominador y sumando exponentes:

      $$
      \frac{x^{1/2}-2x^{2/3}+1}{x^{1/4}}
      = x^{1/4}-2x^{5/12}+x^{-1/4}
      $$

      $$
      \int = \frac{x^{5/4}}{5/4}-2\cdot\frac{x^{17/12}}{17/12}
      +\frac{x^{3/4}}{3/4}
      $$

      $$
      \boxed{\frac45x^{5/4}-\frac{24}{17}x^{17/12}+\frac43x^{3/4}+C}
      $$

      **Antes de cambiar de variable, mirar si basta con reescribir.** Aquí sí.

      ### 4 · (b) y (d): raíz de un binomio lineal

      **(b)** $t = \sqrt{x+1}$, $x = t^{2}-1$, $dx = 2t\,dt$:

      $$
      2\int\left(t^{4}-t^{2}\right)dt
      = \boxed{\frac25(x+1)^{5/2}-\frac23(x+1)^{3/2}+C}
      $$

      **(d)** $t = \sqrt{x+4}$, $x = t^{2}-4$, $dx = 2t\,dt$:

      $$
      \int\frac{t}{t^{2}-4}\cdot2t\,dt = 2\int\frac{t^{2}}{t^{2}-4}dt
      $$

      Otra vez grados iguales: dividir.

      $$
      = 2\int\left(1+\frac{4}{t^{2}-4}\right)dt
      = 2t+8\cdot\frac14\ln\left|\frac{t-2}{t+2}\right|
      $$

      $$
      \boxed{2\sqrt{x+4}+2\ln\left|\frac{\sqrt{x+4}-2}{\sqrt{x+4}+2}\right|+C}
      $$

      ### 5 · (e): la forma de tabla del arcoseno

      $$
      \int\frac{dx}{\sqrt{a^{2}-x^{2}}} = \arcsin\frac xa
      $$

      Para llegar a esa forma hay que **sacar factor común el coeficiente de
      $x^{2}$**:

      $$
      \sqrt{8-5x^{2}} = \sqrt5\sqrt{\frac85-x^{2}}
      $$

      $$
      \int = \frac{1}{\sqrt5}\arcsin\frac{x}{\sqrt{8/5}}
      = \boxed{\frac{1}{\sqrt5}\arcsin\frac{x\sqrt{10}}{4}+C}
      $$

      ### 6 · (f) y (g): las dos hermanas

      **(g)** Con $x = \mathrm{sen}\,t$, $dx = \cos t\,dt$:

      $$
      \int\cos^{2}t\,dt = \frac t2+\frac{\mathrm{sen}\,2t}{4}
      = \frac{t}{2}+\frac{\mathrm{sen}\,t\cos t}{2}
      $$

      $$
      \boxed{\int\sqrt{1-x^{2}}\,dx
      = \frac{x\sqrt{1-x^{2}}}{2}+\frac{\arcsin x}{2}+C}
      $$

      **(f)** Con $x = \mathrm{senh}\,t$, porque
      $1+\mathrm{senh}^{2}t = \cosh^{2}t$:

      $$
      \int\cosh^{2}t\,dt = \frac t2+\frac{\mathrm{senh}\,t\cosh t}{2}
      $$

      $$
      \boxed{\int\sqrt{1+x^{2}}\,dx
      = \frac{x\sqrt{1+x^{2}}}{2}+\frac{\mathrm{argsh}\,x}{2}+C}
      $$

      La **estructura** es la misma, pero las funciones no: un arcoseno en un
      caso y un logaritmo disfrazado —$\mathrm{argsh}\,x
      = \ln\left(x+\sqrt{1+x^{2}}\right)$— en el otro.

      Y (f) es exactamente la integral que apareció en el ejercicio 5.19, el de
      la longitud de arco. No es casualidad: la longitud de arco de cualquier
      parábola acaba en $\sqrt{1+u^{2}}$.

      ### 7 · Comprobación

      **De (b):**

      $$
      \frac{d}{dx}\left[\frac25(x+1)^{5/2}-\frac23(x+1)^{3/2}\right]
      = (x+1)^{3/2}-(x+1)^{1/2}
      $$

      $$
      = \sqrt{x+1}\left[(x+1)-1\right] = x\sqrt{x+1} \quad\checkmark
      $$

      **De (g):**

      $$
      \frac{d}{dx}\left[\frac{x\sqrt{1-x^{2}}}{2}+\frac{\arcsin x}{2}\right]
      = \frac{\sqrt{1-x^{2}}}{2}-\frac{x^{2}}{2\sqrt{1-x^{2}}}
      +\frac{1}{2\sqrt{1-x^{2}}}
      $$

      $$
      = \frac{1-x^{2}-x^{2}+1}{2\sqrt{1-x^{2}}}
      = \frac{2-2x^{2}}{2\sqrt{1-x^{2}}} = \sqrt{1-x^{2}} \quad\checkmark
      $$

      **De (g), geométricamente:** entre $-1$ y 1 debe dar el área del
      semicírculo de radio 1, es decir $\frac{\pi}{2}$:

      $$
      \left[\frac{x\sqrt{1-x^{2}}}{2}+\frac{\arcsin x}{2}\right]_{-1}^{1}
      = \frac{\pi}{4}+\frac{\pi}{4} = \frac{\pi}{2} \quad\checkmark
      $$

  - id: integrales-trigonometricas
    titulo: Diez trigonométricas, y dos erratas del enunciado
    fuente: >-
      Ejercicio 5.27 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU ·
      El (i) cayó en 2018/2019 3E y el (j) en 2019/2020 3E · El boletín no
      publica solución; el desarrollo es nuestro
    nivel: practica
    enunciado: |
      Calcular las integrales de las siguientes funciones trigonométricas:

      **(a)** $\displaystyle\int\cos^{2}x\,dx$ ·
      **(b)** $\displaystyle\int\mathrm{sen}^{2}x\,dx$ ·
      **(c)** $\displaystyle\int\cos^{3}x\,dx$ ·
      **(d)** $\displaystyle\int\frac{\mathrm{sen}^{3}x\,dx}{2+\cos x}$ ·
      **(e)** $\displaystyle\int\frac{\mathrm{sen}\,x\,dx}
      {\cos x\left(1+\cos^{2}x\right)}$

      **(f)** $\displaystyle\int\frac{dx}{\tan^{2}x\left(1+3\cos^{2}x\right)}$ ·
      **(g)** $\displaystyle\int\mathrm{sen}^{2}x\cos^{2}x\,dx$ ·
      **(h)** $\displaystyle\int\mathrm{sen}^{2}x\cos^{5}x\,dx$ ·
      **(i)** $\displaystyle\int\frac{\mathrm{sen}^{2}x\,dx}
      {\mathrm{sen}^{2}x-4\,\mathrm{sen}^{2}x}$ (2018/2019 3E) ·
      **(j)** $\displaystyle\int\frac{dx}{\mathrm{sen}^{2}
      -5\,\mathrm{sen}\,x\cos x}$ (2019/2020 3E)
    pide: Calcular las diez primitivas.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué distingue a (c) y (h) de (a), (b) y (g)?
        opciones:
          - texto: >-
              En (c) y (h) hay un **exponente impar**, y eso permite separar un
              factor y hacer un cambio directo
            correcta: true
            mensaje: |
              Exacto. Con exponente impar se aparta un $\cos x\,dx$ —que es
              $d(\mathrm{sen}\,x)$— y el resto se convierte en potencias de
              $\mathrm{sen}\,x$ usando $\cos^{2} = 1-\mathrm{sen}^{2}$. Con
              todos los exponentes pares no hay factor que apartar y hay que
              bajar el grado con el ángulo doble.
          - texto: Que (c) y (h) son productos
            mensaje: |
              (g) también es un producto y tiene los dos exponentes pares. Lo que
              decide es la **paridad**.
          - texto: Que en (c) y (h) el resultado es racional
            mensaje: |
              Ninguno de los cinco da una función racional: todos dan senos y
              cosenos.
          - texto: Que (a), (b) y (g) necesitan el cambio de Weierstrass
            mensaje: |
              Ninguna de las tres lo necesita: basta con las fórmulas del ángulo
              doble, que son mucho más rápidas.

      - tipo: calcular
        titulo: El apartado (g)
        pregunta: |
          $\int\mathrm{sen}^{2}x\cos^{2}x\,dx
          = \frac x8-k\,\mathrm{sen}\,4x+C$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.03125'
          tolerancia: 0.0005
          formato: en forma exacta, o un número con cuatro decimales
        distractores:
          - valor: '0.125'
            mensaje: |
              $\frac18$ es el coeficiente de $x$, no el del seno. Al integrar
              $\mathrm{sen}^{2}2x$ aparece un $\frac{\mathrm{sen}\,4x}{4}$ que
              divide otra vez.
          - valor: '0.25'
            mensaje: |
              $\frac14$ es el factor que sale de
              $\mathrm{sen}\,x\cos x = \frac{\mathrm{sen}\,2x}{2}$ al elevarlo al
              cuadrado. Todavía queda integrar.
          - valor: '0.0625'
            mensaje: |
              $\frac{1}{16}$ es el doble del resultado: has dividido una vez
              menos. La cuenta es
              $\frac14\cdot\frac18 = \frac{1}{32}$.
        pista: |
          $\mathrm{sen}\,x\cos x = \frac{\mathrm{sen}\,2x}{2}$, y luego baja otra
          vez el grado.
        desarrollo: |
          **Primer paso**, ángulo doble:

          $$
          \mathrm{sen}^{2}x\cos^{2}x
          = \left(\mathrm{sen}\,x\cos x\right)^{2}
          = \left(\frac{\mathrm{sen}\,2x}{2}\right)^{2}
          = \frac{\mathrm{sen}^{2}2x}{4}
          $$

          **Segundo paso**, otra vez ángulo doble:

          $$
          \mathrm{sen}^{2}2x = \frac{1-\cos4x}{2}
          $$

          $$
          \int\frac{1-\cos4x}{8}dx
          = \frac x8-\frac{\mathrm{sen}\,4x}{32}
          $$

          $$
          k = \frac{1}{32} = 0{,}03125
          $$
        veredicto: |
          Dos aplicaciones del ángulo doble, y por eso aparece un $4x$: cada
          aplicación duplica la frecuencia.

      - tipo: calcular
        titulo: El apartado (h)
        pregunta: |
          En $\int\mathrm{sen}^{2}x\cos^{5}x\,dx$, el coeficiente de
          $\mathrm{sen}^{7}x$ vale $k$. ¿Cuánto es? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.1429'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '-0.4'
            mensaje: |
              $-\frac25$ es el coeficiente de $\mathrm{sen}^{5}x$, el término
              central. El de grado 7 es positivo.
          - valor: '0.3333333'
            mensaje: |
              $\frac13$ es el coeficiente de $\mathrm{sen}^{3}x$, el primer
              término.
          - valor: '0.2'
            mensaje: |
              $\frac15$ olvida el desarrollo completo de
              $\left(1-u^{2}\right)^{2}$: el último término da $u^{6}$, que al
              integrar produce $\frac{u^{7}}{7}$.
        pista: |
          Aparta un $\cos x\,dx$ y usa $\cos^{4}x
          = \left(1-\mathrm{sen}^{2}x\right)^{2}$.
        desarrollo: |
          El exponente del coseno es **impar**, así que se aparta un factor:

          $$
          \cos^{5}x\,dx = \cos^{4}x\cdot\cos x\,dx
          = \left(1-\mathrm{sen}^{2}x\right)^{2}d\left(\mathrm{sen}\,x\right)
          $$

          Con $u = \mathrm{sen}\,x$:

          $$
          \int u^{2}\left(1-u^{2}\right)^{2}du
          = \int u^{2}\left(1-2u^{2}+u^{4}\right)du
          $$

          $$
          = \int\left(u^{2}-2u^{4}+u^{6}\right)du
          = \frac{u^{3}}{3}-\frac{2u^{5}}{5}+\frac{u^{7}}{7}
          $$

          $$
          k = \frac17 \approx 0{,}1429
          $$
        veredicto: |
          Con exponente impar todo es mecánico. Con los dos pares —como en (g)—
          hay que bajar el grado, que es bastante más laborioso.

      - tipo: justificar
        pregunta: |
          Ordena la estrategia. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Exponente impar** en (c) y (h): apartar un factor y cambiar
              variable.
              (c) $= \mathrm{sen}\,x-\frac{\mathrm{sen}^{3}x}{3}$.
              (h) $= \frac{\mathrm{sen}^{3}x}{3}-\frac{2\,\mathrm{sen}^{5}x}{5}
              +\frac{\mathrm{sen}^{7}x}{7}$.
          - texto: |
              **Todos pares** en (a), (b) y (g): bajar el grado con
              $\cos^{2} = \frac{1+\cos2x}{2}$ y
              $\mathrm{sen}^{2} = \frac{1-\cos2x}{2}$.
              (a) $= \frac x2+\frac{\mathrm{sen}\,2x}{4}$; (b) el mismo con
              signo menos; (g) $= \frac x8-\frac{\mathrm{sen}\,4x}{32}$.
          - texto: |
              **Con seno impar y coseno en el denominador**, (d) y (e): el
              cambio $u=\cos x$ las convierte en racionales.
              (d) $= \frac{\cos^{2}x}{2}-2\cos x+3\ln(2+\cos x)$.
              (e) $= \ln\frac{\sqrt{1+\cos^{2}x}}{\left|\cos x\right|}$.
          - texto: |
              **Cuando solo hay potencias pares o productos $\mathrm{sen}\cos$**,
              (f), (i) y (j): el cambio $t=\tan x$ las racionaliza sin necesidad
              de Weierstrass.
          - texto: |
              (f) $= -\frac{1}{4\tan x}-\frac18\arctan\frac{\tan x}{2}$;
              (j) $= \frac15\ln\left|\frac{\tan x-5}{\tan x}\right|$.
          - texto: |
              En (a) y (b) conviene usar el cambio de Weierstrass
              $t = \tan\frac x2$, que sirve para cualquier trigonométrica.
            trampa: true
            mensaje: |
              Weierstrass **siempre** funciona, y por eso es tentador; pero
              produce racionales mucho más feas que las que salen bajando el
              grado. Es el último recurso, no el primero. Para $\cos^{2}x$ el
              ángulo doble resuelve en una línea.
        veredicto: |
          Weierstrass es la red de seguridad. Usarla de entrada convierte
          ejercicios de dos líneas en ejercicios de página y media.

    resolucion: |
      **Datos.** Diez integrales trigonométricas.

      ### 1 · El árbol de decisión

      | qué hay | qué hacer |
      |---|---|
      | algún exponente **impar** | apartar un factor y cambiar variable |
      | todos **pares** | bajar el grado con el ángulo doble |
      | solo pares o $\mathrm{sen}\,x\cos x$ | $t = \tan x$ |
      | nada de lo anterior | Weierstrass, $t = \tan\frac x2$ |

      Weierstrass es el último recurso: siempre funciona, y siempre produce la
      racional más fea.

      ### 2 · Los pares: bajar el grado

      $$
      \cos^{2}x = \frac{1+\cos2x}{2},
      \qquad
      \mathrm{sen}^{2}x = \frac{1-\cos2x}{2}
      $$

      **(a)** $\int\cos^{2}x\,dx = \frac x2+\frac{\mathrm{sen}\,2x}{4}+C$

      **(b)** $\int\mathrm{sen}^{2}x\,dx = \frac x2-\frac{\mathrm{sen}\,2x}{4}+C$

      **(g)** Dos aplicaciones:

      $$
      \mathrm{sen}^{2}x\cos^{2}x = \frac{\mathrm{sen}^{2}2x}{4}
      = \frac{1-\cos4x}{8}
      $$

      $$
      \int = \frac x8-\frac{\mathrm{sen}\,4x}{32}+C
      $$

      ### 3 · Los impares: apartar un factor

      **(c)** $\cos^{3}x\,dx = \left(1-\mathrm{sen}^{2}x\right)
      d\left(\mathrm{sen}\,x\right)$:

      $$
      \int\left(1-u^{2}\right)du
      = \mathrm{sen}\,x-\frac{\mathrm{sen}^{3}x}{3}+C
      $$

      **(h)** $\cos^{5}x\,dx = \left(1-\mathrm{sen}^{2}x\right)^{2}
      d\left(\mathrm{sen}\,x\right)$:

      $$
      \int u^{2}\left(1-2u^{2}+u^{4}\right)du
      = \frac{\mathrm{sen}^{3}x}{3}-\frac{2\,\mathrm{sen}^{5}x}{5}
      +\frac{\mathrm{sen}^{7}x}{7}+C
      $$

      ### 4 · Los que se vuelven racionales con $u=\cos x$

      **(d)** El seno tiene exponente impar, así que $u = \cos x$,
      $du = -\mathrm{sen}\,x\,dx$:

      $$
      \int\frac{\left(1-u^{2}\right)}{2+u}\left(-du\right)
      $$

      Dividiendo, $\frac{1-u^{2}}{2+u} = -u+2-\frac{3}{u+2}$:

      $$
      -\int\left(-u+2-\frac{3}{u+2}\right)du
      = \frac{u^{2}}{2}-2u+3\ln\left|u+2\right|
      $$

      $$
      \boxed{\frac{\cos^{2}x}{2}-2\cos x+3\ln\left(2+\cos x\right)+C}
      $$

      **(e)** Igual, con $u = \cos x$:

      $$
      -\int\frac{du}{u\left(1+u^{2}\right)}
      = -\int\left(\frac1u-\frac{u}{1+u^{2}}\right)du
      = -\ln\left|u\right|+\frac12\ln\left(1+u^{2}\right)
      $$

      $$
      \boxed{\ln\frac{\sqrt{1+\cos^{2}x}}{\left|\cos x\right|}+C}
      $$

      ### 5 · Los del cambio $t = \tan x$

      Con $t = \tan x$:

      $$
      \mathrm{sen}^{2}x = \frac{t^{2}}{1+t^{2}},
      \qquad
      \cos^{2}x = \frac{1}{1+t^{2}},
      \qquad
      \mathrm{sen}\,x\cos x = \frac{t}{1+t^{2}},
      \qquad
      dx = \frac{dt}{1+t^{2}}
      $$

      **(f)** El denominador se transforma en

      $$
      1+3\cos^{2}x = 1+\frac{3}{1+t^{2}} = \frac{t^{2}+4}{1+t^{2}}
      $$

      $$
      \int\frac{1+t^{2}}{t^{2}\left(t^{2}+4\right)}\cdot\frac{dt}{1+t^{2}}
      = \int\frac{dt}{t^{2}\left(t^{2}+4\right)}
      $$

      Descomponiendo, $\frac{1}{t^{2}(t^{2}+4)}
      = \frac{1}{4t^{2}}-\frac{1}{4\left(t^{2}+4\right)}$:

      $$
      \boxed{-\frac{1}{4\tan x}-\frac18\arctan\frac{\tan x}{2}+C}
      $$

      ### 6 · Los dos con errata

      **(i)** Tal como está escrito, el denominador es

      $$
      \mathrm{sen}^{2}x-4\,\mathrm{sen}^{2}x = -3\,\mathrm{sen}^{2}x
      $$

      y toda la fracción se simplifica a la **constante** $-\frac13$:

      $$
      \int-\frac13\,dx = -\frac{x}{3}+C
      $$

      Es una respuesta correcta para el enunciado literal, pero convierte en
      trivial un ejercicio que cayó en un examen. **Casi con seguridad falta un
      coseno**: el planteamiento habitual es

      $$
      \int\frac{\mathrm{sen}^{2}x\,dx}{\cos^{2}x-4\,\mathrm{sen}^{2}x}
      $$

      y con $t = \tan x$:

      $$
      \int\frac{t^{2}}{\left(1-4t^{2}\right)\left(1+t^{2}\right)}dt
      = \frac15\int\frac{dt}{1-4t^{2}}-\frac15\int\frac{dt}{1+t^{2}}
      $$

      $$
      = \frac{1}{20}\ln\left|\frac{1+2\tan x}{1-2\tan x}\right|
      -\frac{x}{5}+C
      $$

      **(j)** Aquí la errata es evidente: al primer $\mathrm{sen}^{2}$ le falta
      el argumento. Con $\mathrm{sen}^{2}x$:

      $$
      \int\frac{1+t^{2}}{t^{2}-5t}\cdot\frac{dt}{1+t^{2}}
      = \int\frac{dt}{t(t-5)}
      = \frac15\int\left(\frac{1}{t-5}-\frac1t\right)dt
      $$

      $$
      \boxed{\frac15\ln\left|\frac{\tan x-5}{\tan x}\right|+C}
      $$

      > **Nota sobre las dos erratas.** Los enunciados están reproducidos tal
      > cual aparecen en el boletín, como exige el criterio de este sitio. En
      > (i) el denominador escrito hace que la integral se reduzca a una
      > constante; en (j) falta el argumento del primer seno. Las dos versiones
      > —la literal y la razonable— están resueltas arriba, para que el alumno
      > reconozca la intención sin tener que adivinarla.

      ### 7 · Comprobación

      **De (c), derivando:**

      $$
      \frac{d}{dx}\left[\mathrm{sen}\,x-\frac{\mathrm{sen}^{3}x}{3}\right]
      = \cos x-\mathrm{sen}^{2}x\cos x
      = \cos x\left(1-\mathrm{sen}^{2}x\right) = \cos^{3}x \quad\checkmark
      $$

      **De (a) y (b), sumando:** las dos primitivas suman

      $$
      \left(\frac x2+\frac{\mathrm{sen}\,2x}{4}\right)
      +\left(\frac x2-\frac{\mathrm{sen}\,2x}{4}\right) = x
      $$

      y en efecto $\int\left(\cos^{2}x+\mathrm{sen}^{2}x\right)dx
      = \int1\,dx = x$ ✔ Una comprobación que valida las dos a la vez.

      **De (g), por un valor definido.** En $[0,\frac{\pi}{2}]$:

      $$
      \left[\frac x8-\frac{\mathrm{sen}\,4x}{32}\right]_0^{\pi/2}
      = \frac{\pi}{16}
      $$

      y $\mathrm{sen}^{2}x\cos^{2}x$ tiene valor medio $\frac18$ sobre un cuarto
      de periodo, luego $\frac18\cdot\frac{\pi}{2} = \frac{\pi}{16}$ ✔

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \text{(a)}\ & \tfrac x2+\tfrac{\mathrm{sen}\,2x}{4} \\
      \text{(b)}\ & \tfrac x2-\tfrac{\mathrm{sen}\,2x}{4} \\
      \text{(c)}\ & \mathrm{sen}\,x-\tfrac{\mathrm{sen}^{3}x}{3} \\
      \text{(d)}\ & \tfrac{\cos^{2}x}{2}-2\cos x+3\ln(2+\cos x) \\
      \text{(e)}\ & \ln\tfrac{\sqrt{1+\cos^{2}x}}{\left|\cos x\right|} \\
      \text{(f)}\ & -\tfrac{1}{4\tan x}-\tfrac18\arctan\tfrac{\tan x}{2} \\
      \text{(g)}\ & \tfrac x8-\tfrac{\mathrm{sen}\,4x}{32} \\
      \text{(h)}\ & \tfrac{\mathrm{sen}^{3}x}{3}
      -\tfrac{2\,\mathrm{sen}^{5}x}{5}+\tfrac{\mathrm{sen}^{7}x}{7} \\
      \text{(i)}\ & -\tfrac x3 \ \text{(literal)} \\
      \text{(j)}\ & \tfrac15\ln\left|\tfrac{\tan x-5}{\tan x}\right|
      \end{aligned}}
      $$

      (todas con $+C$)
