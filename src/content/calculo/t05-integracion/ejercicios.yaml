ejercicios:
  # ═══════════════════════════════════════════════════════════════════
  # Ejemplos introductorios del tema 5. Nuestros, no de examen ni del boletín.
  #
  # El de leer una gráfica —`ej-integral-contando-areas`— nace el 15 de
  # septiembre de 2026 y responde a un hueco que la ruta declaraba desde el 6:
  # «el boletín no tiene ni un ejercicio de leer una gráfica, y el examen lo
  # pide en seis». Cubre de una vez las dos preguntas que caen: la integral
  # como área con signo, y qué hace la función integral F(x) mientras tanto.
  - id: ej-integral-contando-areas
    titulo: La integral sin integrar, contando áreas
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, para el hueco de «leer una
      gráfica» que la ruta de la ordinaria declara. No es de examen ni del
      boletín; la función es nuestra y está elegida para que todas las cuentas
      salgan a mano.
    nivel: ejemplo
    enunciado: |
      La figura es la gráfica de una función $f$ formada por cuatro segmentos
      rectos. **No hay fórmula, y no hace falta**: todo lo que se pide se lee
      del dibujo.

      <figure>
      <svg viewBox="-10 -15 330 190" role="img" aria-labelledby="t5areaT t5areaD">
        <title id="t5areaT">Una función lineal a trozos, con dos áreas iguales y de signo contrario</title>
        <desc id="t5areaD">La gráfica sube del origen hasta el punto (2,2), baja hasta cortar el eje en x igual a 3, sigue bajando hasta (5,-2) y vuelve a subir hasta cortar el eje en x igual a 6. La región entre la curva y el eje está sombreada: por encima del eje entre 0 y 3, y por debajo entre 3 y 6.</desc>

        <path d="M30 100 L120 50 L165 100 Z" fill="var(--live-soft)"></path>
        <path d="M165 100 L255 150 L300 100 Z" fill="var(--alt-soft)"></path>

        <line x1="20" y1="100" x2="315" y2="100" stroke="var(--rule)" stroke-width="1.2"></line>
        <line x1="30" y1="160" x2="30" y2="35" stroke="var(--rule)" stroke-width="1.2"></line>

        <polyline points="30,100 120,50 165,100 255,150 300,100" fill="none" stroke="var(--live)" stroke-width="2"></polyline>

        <text x="24" y="114" font-size="10" fill="var(--faint)" font-family="var(--mono)">0</text>
        <text x="117" y="114" font-size="10" fill="var(--faint)" font-family="var(--mono)">2</text>
        <text x="162" y="114" font-size="10" fill="var(--faint)" font-family="var(--mono)">3</text>
        <text x="252" y="94" font-size="10" fill="var(--faint)" font-family="var(--mono)">5</text>
        <text x="297" y="114" font-size="10" fill="var(--faint)" font-family="var(--mono)">6</text>
        <text x="14" y="54" font-size="10" fill="var(--faint)" font-family="var(--mono)">2</text>
        <text x="10" y="154" font-size="10" fill="var(--faint)" font-family="var(--mono)">−2</text>
        <text x="307" y="114" font-size="10" fill="var(--faint)" font-family="var(--mono)">x</text>

        <text x="84" y="86" font-size="10" fill="var(--live)" font-family="var(--mono)">+3</text>
        <text x="216" y="122" font-size="10" fill="var(--alt)" font-family="var(--mono)">−3</text>
      </svg>
      <figcaption>Cuatro segmentos y dos regiones triangulares: la de arriba mide 3 y la de abajo mide 3.</figcaption>
      </figure>

      a) ¿Cuánto vale $\displaystyle\int_0^6 f(x)\,dx$?

      b) Y si $F(x)=\displaystyle\int_0^x f(t)\,dt$, ¿dónde alcanza $F$ su
      máximo en $[0,6]$?
    pide: El valor de la integral en todo el intervalo, y dónde es máxima la función integral.
    pasos:
      - tipo: reconocer
        pregunta: |
          Sin calcular nada todavía: ¿qué **es** $\int_0^6 f$ en este dibujo?
        opciones:
          - texto: >-
              La suma de las áreas, contando **positiva** la que queda por
              encima del eje y **negativa** la de debajo
            correcta: true
            mensaje: |
              Eso es, y por eso este ejercicio no necesita ninguna primitiva.
              La integral definida es el área **con signo**, y el signo lo pone
              el lado del eje en que está la región.
          - texto: >-
              El área total encerrada entre la curva y el eje
            mensaje: |
              Esa es el área **geométrica**, que aquí vale 6 y siempre es
              positiva. La integral no: la de abajo resta. Cuando el enunciado
              quiere el área geométrica lo dice con un valor absoluto,
              $\int|f|$, y entonces sí son cosas distintas — aquí una vale 0 y
              la otra 6.
          - texto: >-
              No se puede saber sin conocer la fórmula de $f$
            mensaje: |
              Se puede, y es justo lo que el examen quiere comprobar. Los
              cuatro trozos son rectos, así que las regiones son triángulos y
              su área sale con base por altura entre dos. Una fórmula solo haría
              falta si la curva no fuese reconocible.

      - tipo: calcular
        titulo: El área de arriba
        pregunta: |
          La región entre la curva y el eje en $[0,3]$ son dos triángulos: uno
          de base 2 y altura 2, y otro de base 1 y altura 2. ¿Cuánto suman?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              Has multiplicado base por altura sin dividir entre dos en alguno
              de los dos. Los triángulos son $\frac{b\cdot h}{2}$: el primero
              vale $\frac{2\cdot2}{2}=2$ y el segundo $\frac{1\cdot2}{2}=1$.
          - valor: '6'
            mensaje: |
              Eso es el área de **las cuatro** regiones sumadas en valor
              absoluto. Aquí solo se pide la parte de $[0,3]$, la que queda por
              encima del eje.
        pista: |
          Área de un triángulo, dos veces: $\frac{b\cdot h}{2}$.
        desarrollo: |
          $$
          \int_0^3 f = \frac{2\cdot 2}{2} + \frac{1\cdot 2}{2} = 2 + 1 = 3
          $$

      - tipo: calcular
        titulo: La integral en todo el intervalo
        pregunta: |
          La región de $[3,6]$ es la misma figura del revés, y está **debajo**
          del eje. ¿Cuánto vale entonces $\int_0^6 f$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '6'
            mensaje: |
              Has sumado las dos áreas en valor absoluto. La de abajo entra
              **restando**: la integral vale $3 + (-3) = 0$. El 6 es
              $\int_0^6 |f|$, que es otra pregunta.
          - valor: '3'
            mensaje: |
              Ese es solo el trozo de arriba. Falta restarle la región de
              $[3,6]$, que mide lo mismo y va con signo menos.
        pista: |
          Simetría: la de abajo es la de arriba con el signo cambiado.
        desarrollo: |
          $$
          \int_0^6 f = \underbrace{3}_{[0,3]} + \underbrace{(-3)}_{[3,6]} = 0
          $$

          Y fíjate en lo que **no** significa: que $f$ sea cero, ni que la
          curva no haga nada. Significa que lo que sube y lo que baja se
          compensan exactamente.

      - tipo: calcular
        titulo: Dónde es máxima la función integral
        pregunta: |
          $F(x)=\int_0^x f$ va acumulando área con signo. Crece mientras
          $f>0$ y decrece mientras $f<0$. ¿En qué $x$ alcanza su máximo?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número entre 0 y 6
        distractores:
          - valor: '2'
            mensaje: |
              Ahí es donde $f$ es máxima, que es otra cosa. $F$ sigue creciendo
              mientras $f$ siga siendo positiva, y $f$ no se anula hasta
              $x=3$: entre 2 y 3 la curva baja pero **todavía suma área**.
              Confundir el máximo de $f$ con el de $F$ es el error más
              frecuente de esta familia.
          - valor: '6'
            mensaje: |
              En $x=6$ la función integral vale 0, que es su valor más bajo
              junto con el del principio. Ha subido hasta 3 y ha vuelto a
              bajar.
          - valor: '5'
            mensaje: |
              Ahí $f$ alcanza su mínimo, así que $F$ está bajando lo más
              deprisa que baja. Es el punto de inflexión de $F$, no su máximo.
        pista: |
          $F'=f$: el máximo de $F$ está donde $f$ cambia de signo de $+$ a $-$.
        desarrollo: |
          Por el teorema fundamental, $F'(x)=f(x)$. Así que $F$ crece donde
          $f>0$ —en $(0,3)$— y decrece donde $f<0$ —en $(3,6)$—.

          El máximo está en el punto donde $f$ **cruza el eje bajando**:

          $$
          x = 3, \qquad F(3) = \int_0^3 f = 3
          $$

      - tipo: justificar
        pregunta: Ordena lo que la gráfica dice de $F$. Una pieza es falsa.
        piezas:
          - texto: >-
              $F(0)=0$, porque la integral de 0 a 0 es cero sea cual sea $f$.
          - texto: >-
              En $(0,3)$ la curva está por encima del eje, así que $F$ **crece**
              hasta llegar a $F(3)=3$.
          - texto: >-
              En $(3,6)$ la curva está por debajo, así que $F$ **decrece** y
              vuelve a $F(6)=0$.
          - texto: >-
              Como $F(0)=F(6)=0$, la función $F$ es constante en todo el
              intervalo.
            trampa: true
            mensaje: |
              Empezar y acabar en el mismo sitio no es ser constante: $F$ sube
              hasta 3 y vuelve a bajar. Es exactamente la hipótesis de Rolle
              —$F(0)=F(6)$— y lo que garantiza es que $F'$ se anula en algún
              punto de dentro, que aquí es $x=3$. Confundir «vuelve al mismo
              valor» con «no se mueve» es el error que este dibujo enseña de un
              vistazo.
        veredicto: |
          Ese contraste es lo que hay que llevarse: la gráfica de $f$ y la de
          $F$ cuentan cosas distintas. Donde $f$ tiene su máximo, $F$ solo está
          creciendo deprisa; donde $f$ cruza el cero, $F$ hace cumbre.
    resolucion: |
      **Nada de esto se integra.** Los cuatro trozos son rectos, así que las
      regiones son triángulos y basta con medirlos.

      ### a) La integral en $[0,6]$

      | tramo | figura | área con signo |
      |---|---|---|
      | $[0,2]$ | triángulo de base 2 y altura 2 | $+2$ |
      | $[2,3]$ | triángulo de base 1 y altura 2 | $+1$ |
      | $[3,5]$ | triángulo de base 2 y altura 2, **debajo** | $-2$ |
      | $[5,6]$ | triángulo de base 1 y altura 2, **debajo** | $-1$ |

      $$
      \int_0^6 f = 2+1-2-1 = 0
      $$

      Y conviene separarlo de su vecina, porque el examen pregunta las dos:

      $$
      \int_0^6 |f| = 2+1+2+1 = 6
      $$

      La primera es **área con signo**; la segunda, área a secas. Que la
      integral valga cero no dice que la función sea pequeña: dice que lo de
      arriba y lo de abajo se compensan.

      ### b) El máximo de $F(x)=\int_0^x f$

      El teorema fundamental da $F'=f$, así que el signo de $f$ **es** el
      crecimiento de $F$:

      | dónde | $f$ | $F$ |
      |---|---|---|
      | $(0,3)$ | positiva | crece |
      | $x=3$ | se anula | **máximo** |
      | $(3,6)$ | negativa | decrece |

      $$
      \max_{[0,6]} F = F(3) = 3
      $$

      **Lo que hay que llevarse.** El máximo de $F$ no está donde $f$ es más
      grande —eso es $x=2$—, sino donde $f$ **cruza el cero de positiva a
      negativa**. Es la pregunta que más se falla de esta familia, y se
      contesta mirando dónde corta la curva al eje, sin calcular nada.

  # ═══════════════════════════════════════════════════════════════════

  - id: ej-derivar-funcion-integral
    titulo: Derivar una integral sin calcularla
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Para $F(x) = \displaystyle\int_1^{x} t^{3}\,dt$, calcular $F'(x)$ sin
      resolver la integral.
    pide: La derivada de la función integral.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué parte del teorema fundamental se usa aquí?
        opciones:
          - texto: La primera, que dice que derivar una función integral devuelve el integrando
            correcta: true
            mensaje: |
              Eso es. La primera parte dice que si $F(x)=\int_a^x f$, entonces
              $F'(x)=f(x)$. Integrar y luego derivar deja la función como
              estaba.
          - texto: La segunda, la regla de Barrow
            mensaje: |
              Barrow sirve para **calcular** una integral definida usando una
              primitiva. Aquí no queremos calcularla: queremos derivarla, que es
              la primera parte.
          - texto: Ninguna, hay que integrar primero y luego derivar
            mensaje: |
              Se puede hacer así y sale lo mismo, pero es el camino largo. El
              teorema existe justo para ahorrarlo, y en los casos donde la
              primitiva no se conoce es el único camino.
      - tipo: calcular
        titulo: La derivada
        pregunta: |
          ¿Cuánto vale $F'(2)$?
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3.75'
            mensaje: |
              Eso es $F(2)$, el valor de la integral: $\frac{2^{4}-1}{4}$. La
              pregunta es por la **derivada**, que es mucho más simple.
          - valor: '12'
            mensaje: |
              12 es la derivada del integrando, $3t^{2}$ en $t=2$. El teorema no
              deriva el integrando: lo devuelve tal cual, evaluado en $x$.
          - valor: '1'
            mensaje: |
              1 es el límite inferior. Ese extremo es constante y no interviene
              en la derivada: solo aporta si también dependiera de $x$.
        pista: |
          $F'(x) = f(x)$, donde $f$ es el integrando. Sustituye $x=2$ en
          $t^{3}$.
        desarrollo: |
          Por la primera parte del teorema fundamental,

          $$
          F'(x) = x^{3}
          \;\Longrightarrow\;
          F'(2) = 8
          $$

          **Comprobación por el camino largo.** La primitiva es
          $\frac{t^{4}}{4}$, así que $F(x) = \frac{x^{4}-1}{4}$, y derivando
          sale $x^{3}$. Lo mismo, con más trabajo.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: El integrando $t^{3}$ es continuo, que es la hipótesis del teorema.
          - texto: El límite inferior es constante y el superior es $x$.
          - texto: Por la primera parte del teorema fundamental, $F'(x) = x^{3}$.
          - texto: Luego $F'(2) = 8$.
          - texto: Como el límite inferior es 1, hay que restar $1^{3}$ al resultado.
            trampa: true
            mensaje: |
              El límite inferior **no aparece** en la derivada. Solo aportaría si
              también dependiera de $x$, y entonces se restaría su contribución
              con su propia derivada. Aquí es una constante.
    resolucion: |
      **La hipótesis.** El integrando $t^{3}$ es continuo en todo $\mathbb{R}$,
      que es lo único que el teorema pide.

      **La primera parte del teorema fundamental** dice que si

      $$
      F(x) = \int_a^{x} f(t)\,dt
      $$

      con $f$ continua, entonces $F$ es derivable y $F'(x) = f(x)$. Es decir:
      derivar deshace integrar.

      $$
      F'(x) = x^{3}, \qquad F'(2) = 8
      $$

      **Y el caso general**, que es como se pregunta en examen: si los dos
      límites dependen de $x$, la regla de la cadena cobra su peaje en cada uno,

      $$
      \frac{d}{dx}\int_{u(x)}^{v(x)} f = f\big(v(x)\big)v'(x) - f\big(u(x)\big)u'(x)
      $$

      Aquí $u(x)=1$ es constante, así que su término desaparece.

  - id: ej-area-entre-curvas
    titulo: El área entre dos curvas
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Calcular el área encerrada entre las curvas $y = x$ e $y = x^{2}$.
    pide: Los puntos de corte y el área.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es el primer paso antes de plantear la integral?
        opciones:
          - texto: Encontrar los cortes, que son los límites de integración
            correcta: true
            mensaje: |
              Eso es. Y de paso decidir cuál va por encima en ese tramo, porque
              el integrando es «la de arriba menos la de abajo».
          - texto: Integrar las dos curvas por separado y restar
            mensaje: |
              Sale lo mismo, pero hay que saber entre qué límites, así que los
              cortes hacen falta igual. Y restar integrales solo vale si la
              relación arriba-abajo no cambia en el intervalo.
          - texto: Derivar las dos para ver dónde se cruzan
            mensaje: |
              Derivar dice dónde crecen, no dónde se cortan. Los cortes salen de
              igualar las dos expresiones.
      - tipo: calcular
        titulo: El corte distinto de cero
        pregunta: |
          Igualando $x = x^{2}$, ¿cuál es la solución distinta de cero?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Con $x=2$ sale $2 \neq 4$: no es un corte. De $x^{2}-x=0$ se saca
              factor común $x$ y queda $x(x-1)=0$.
          - valor: '-1'
            mensaje: |
              Con $x=-1$ sale $-1 \neq 1$. El signo importa: la parábola solo
              alcanza a la recta en el primer cuadrante.
        pista: |
          $x^{2}-x = 0$. Saca factor común.
        desarrollo: |
          $$
          x = x^{2}
          \;\Longrightarrow\;
          x^{2}-x = 0
          \;\Longrightarrow\;
          x(x-1) = 0
          $$

          Los cortes son $x=0$ y $x=1$, y esos son los límites de integración.
      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale $\displaystyle\int_0^{1}\left(x - x^{2}\right)dx$?
        respuesta:
          tipo: numero
          valor: '0.1666667'
          tolerancia: 0.0005
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '-0.1666667'
            mensaje: |
              Has puesto la parábola encima de la recta. Entre 0 y 1 es al
              revés: $x > x^{2}$, así que el integrando es $x - x^{2}$ y el área
              sale positiva.
          - valor: '0.8333333'
            mensaje: |
              Parece que has integrado $1 - (x-x^{2})$ o algo similar. El área
              entre las dos curvas es solo la diferencia entre ellas.
          - valor: '0.5'
            mensaje: |
              0,5 es el área bajo la recta sola, el triángulo. Falta descontar
              lo que hay bajo la parábola.
        pista: |
          Las primitivas son $\frac{x^{2}}{2}$ y $\frac{x^{3}}{3}$. Resta y
          evalúa entre 0 y 1.
        desarrollo: |
          $$
          \int_0^{1}\left(x-x^{2}\right)dx
          = \left[\frac{x^{2}}{2}-\frac{x^{3}}{3}\right]_0^{1}
          = \frac12 - \frac13 = \frac16
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: Los cortes son $x=0$ y $x=1$, y son los límites de integración.
          - texto: Entre 0 y 1 la recta va por encima de la parábola.
          - texto: El área es $\int_0^1 (x - x^{2})\,dx$.
          - texto: Vale $\frac12-\frac13 = \frac16$.
          - texto: Como el integrando es una resta, el área puede salir negativa.
            trampa: true
            mensaje: |
              Si sale negativa es que has puesto las curvas al revés, no que el
              área lo sea. El área es una magnitud positiva: la resta se hace
              siempre «la de arriba menos la de abajo», y si cambian de posición
              hay que partir el intervalo.
    resolucion: |
      **Los cortes**, que son los límites de integración:

      $$
      x = x^{2} \;\Longrightarrow\; x(x-1)=0 \;\Longrightarrow\; x=0,\ x=1
      $$

      **Quién va arriba.** Basta probar un punto de dentro: en $x=\frac12$ la
      recta vale $0{,}5$ y la parábola $0{,}25$, así que **la recta va por
      encima**. Esa comprobación cuesta cinco segundos y decide el signo.

      **El área.**

      $$
      A = \int_0^{1}\left(x - x^{2}\right)dx
      = \left[\frac{x^{2}}{2}-\frac{x^{3}}{3}\right]_0^{1}
      = \frac{1}{2}-\frac{1}{3} = \frac{1}{6}
      $$

      **Si las curvas se cruzaran más veces**, habría que partir el intervalo en
      los cortes y cambiar el orden de la resta en cada trozo — o integrar el
      valor absoluto de la diferencia, que es lo mismo dicho de otra manera.

  - id: ej-volumen-por-discos
    titulo: Un volumen de revolución por discos
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Calcular el volumen que genera la región bajo $y = x$ entre $x=0$ y $x=1$
      al girar alrededor del eje $OX$.
    pide: El volumen del sólido de revolución.
    pasos:
      - tipo: reconocer
        pregunta: |
          El eje de giro es horizontal. ¿Qué método corresponde?
        opciones:
          - texto: Discos, con cortes perpendiculares al eje
            correcta: true
            mensaje: |
              Eso es. Los discos exigen que los cortes sean perpendiculares al
              eje de giro, así que integrar en $x$ solo vale para ejes
              horizontales. Aquí lo es.
          - texto: Capas cilíndricas
            mensaje: |
              Las capas se usan cuando el eje es **vertical** y no se puede
              despejar. Aquí el eje es $OX$ y la función ya está en la forma
              buena.
          - texto: Longitud de arco
            mensaje: |
              Eso mide la curva, no el volumen que engendra. Aquí se pide el
              sólido.
      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale $\pi\displaystyle\int_0^{1} x^{2}\,dx$?
        respuesta:
          tipo: numero
          valor: '1.0471976'
          tolerancia: 0.0005
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.3333333'
            mensaje: |
              Te has dejado el $\pi$. La fórmula de los discos lleva $\pi$
              delante, porque el área de cada disco es $\pi r^{2}$.
          - valor: '1.5707963'
            mensaje: |
              Parece que has integrado $x$ en vez de $x^{2}$. El radio se eleva
              al cuadrado antes de integrar.
          - valor: '3.1415927'
            mensaje: |
              Ese es $\pi$ a secas. Falta multiplicarlo por el valor de la
              integral, que es $\frac13$.
        pista: |
          La primitiva de $x^{2}$ es $\frac{x^{3}}{3}$. Evalúa y multiplica por
          $\pi$.
        desarrollo: |
          $$
          V = \pi\int_0^{1} x^{2}\,dx
          = \pi\left[\frac{x^{3}}{3}\right]_0^{1}
          = \frac{\pi}{3} \approx 1{,}0472
          $$

          Y tiene sentido: el sólido es un cono de radio 1 y altura 1, cuyo
          volumen es $\frac{1}{3}\pi r^{2}h = \frac{\pi}{3}$. Cuadra.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: El eje de giro es horizontal, así que valen los discos.
          - texto: Cada corte perpendicular al eje es un disco de radio $f(x) = x$.
          - texto: El volumen es $\pi\int_0^1 x^{2}dx = \frac{\pi}{3}$.
          - texto: El sólido es un cono, y la fórmula clásica da lo mismo.
          - texto: El radio se suma a lo largo del intervalo para dar el volumen.
            trampa: true
            mensaje: |
              No se suma el radio: se suman las **áreas** de los discos, y el
              área de un disco lleva el radio al cuadrado y por $\pi$. Es la
              diferencia entre integrar $f$ e integrar $\pi f^{2}$.
    resolucion: |
      **Elegir el método.** El eje de giro es $OX$, que es horizontal, así que
      los cortes perpendiculares a él son verticales y cada uno engendra un
      **disco**. Se integra en $x$.

      **La fórmula.** Cada disco tiene radio $f(x)$ y área $\pi f(x)^{2}$:

      $$
      V = \pi\int_a^b f(x)^{2}\,dx = \pi\int_0^{1} x^{2}\,dx
      $$

      **El cálculo.**

      $$
      V = \pi\left[\frac{x^{3}}{3}\right]_0^{1} = \frac{\pi}{3}
      $$

      **La comprobación que conviene hacer siempre.** El sólido es un cono de
      radio 1 y altura 1. La fórmula clásica da
      $\frac{1}{3}\pi r^{2} h = \frac{\pi}{3}$. Coincide, y esa coincidencia es
      justamente de dónde sale la fórmula clásica.

  - id: ej-impropia-que-converge
    titulo: Una integral impropia de primer tipo
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Estudiar si converge, y calcularla si converge,
      $$
      \int_1^{\infty}\frac{dx}{x^{2}}
      $$
    pide: Si converge y cuánto vale.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué esta integral es impropia?
        opciones:
          - texto: Porque el intervalo de integración es infinito
            correcta: true
            mensaje: |
              Eso es: impropia de **primer tipo**. La receta es sustituir el
              infinito por un límite y calcular la integral normal hasta un $t$
              que después se hace crecer.
          - texto: Porque el integrando se va a infinito dentro del intervalo
            mensaje: |
              Eso sería de segundo tipo, y aquí no pasa: en $[1,\infty)$ la
              función $1/x^{2}$ es perfectamente finita. El problema está en el
              extremo superior del intervalo, no en el integrando.
          - texto: Porque el integrando no tiene primitiva elemental
            mensaje: |
              Sí la tiene: $-1/x$. Lo que la hace impropia es el intervalo, no
              la dificultad de integrar.
      - tipo: calcular
        titulo: La integral hasta un extremo finito
        pregunta: |
          ¿Cuánto vale $\displaystyle\int_1^{t}\frac{dx}{x^{2}}$, en función de
          $t$? Evalúalo para $t = 10$.
        respuesta:
          tipo: numero
          valor: '0.9'
          tolerancia: 0.001
          formato: en forma exacta, o con dos decimales
        distractores:
          - valor: '1.1'
            mensaje: |
              Signo cambiado al evaluar. La primitiva es $-\frac1x$, así que
              queda $-\frac{1}{10}-(-1) = 1 - \frac{1}{10}$.
          - valor: '0.1'
            mensaje: |
              Ese es el valor de $\frac{1}{t}$, el término que se resta. Falta el
              1 que viene del límite inferior.
        pista: |
          La primitiva de $x^{-2}$ es $-x^{-1}$. Evalúa entre 1 y 10.
        desarrollo: |
          $$
          \int_1^{t}\frac{dx}{x^{2}}
          = \left[-\frac{1}{x}\right]_1^{t}
          = 1 - \frac{1}{t}
          $$

          Con $t=10$ sale $0{,}9$. Y se ve hacia dónde va la cosa cuando $t$
          crece.
      - tipo: calcular
        titulo: El límite
        pregunta: |
          Haciendo $t \to \infty$, ¿cuánto vale la integral impropia?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              Lo que tiende a cero es $\frac{1}{t}$, que es lo que **se resta**.
              Lo que queda es el 1.
          - valor: '0.9'
            mensaje: |
              Ese era el valor para $t=10$. El límite es a dónde va cuando $t$
              crece sin parar, y se acerca a 1 sin llegar.
        pista: |
          $\lim_{t\to\infty}\left(1-\frac1t\right)$.
        desarrollo: |
          $$
          \int_1^{\infty}\frac{dx}{x^{2}}
          = \lim_{t\to\infty}\left(1-\frac{1}{t}\right) = 1
          $$

          Converge, y vale 1. Un recinto de longitud infinita con área finita:
          no es contradictorio, porque la altura se va a cero lo bastante
          deprisa.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: Es impropia de primer tipo, porque el intervalo no está acotado.
          - texto: Se sustituye el infinito por un extremo finito $t$ y se toma el límite.
          - texto: $\int_1^t x^{-2}dx = 1 - \frac1t$.
          - texto: El límite cuando $t\to\infty$ vale 1, luego converge.
          - texto: Se puede aplicar Barrow directamente con el infinito como extremo.
            trampa: true
            mensaje: |
              El infinito no es un número y no se puede sustituir en una
              primitiva. Escribir $\left[-\frac1x\right]_1^{\infty}$ es un abuso
              de notación que en un examen cuesta puntos: la definición pasa por
              el límite.
    resolucion: |
      **Por qué es impropia.** El intervalo $[1,\infty)$ no está acotado: es una
      impropia de **primer tipo**. El integrando, en cambio, se porta bien en
      todo el intervalo.

      **La receta.** Se sustituye el extremo problemático por una letra y se
      toma el límite al final:

      $$
      \int_1^{\infty}\frac{dx}{x^{2}}
      = \lim_{t\to\infty}\int_1^{t}\frac{dx}{x^{2}}
      $$

      **La integral finita.**

      $$
      \int_1^{t}\frac{dx}{x^{2}} = \left[-\frac{1}{x}\right]_1^{t} = 1-\frac{1}{t}
      $$

      **El límite.**

      $$
      \lim_{t\to\infty}\left(1-\frac{1}{t}\right) = 1
      $$

      La integral **converge** y vale 1.

      **El contraste que conviene tener presente.** Con $\frac{1}{x}$ en vez de
      $\frac{1}{x^{2}}$, la misma cuenta da $\ln t$, que se va a infinito: esa
      diverge. El exponente decide, y por poco.

  - id: ej-longitud-de-arco-que-sale-redonda
    titulo: Una longitud de arco donde la raíz desaparece
    fuente: >-
      Ejemplo introductorio · Road to Ingeniería, sobre la longitud de arco del
      tema 5. Está elegido para que la raíz se simplifique, que es lo que hace
      falta antes de enfrentarse a la del boletín, donde no lo hace. No es de
      examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Calcular la longitud del arco de la curva
      $y = \dfrac{2}{3}x^{3/2}$ entre $x=0$ y $x=3$.
    pide: La longitud de ese arco.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué va dentro de la raíz en la fórmula de la longitud de arco?
        opciones:
          - texto: >-
              Uno más la **derivada** al cuadrado, $\sqrt{1+\left(y'\right)^{2}}$
            correcta: true
            mensaje: |
              Eso es, y viene de Pitágoras: un trocito de curva es la
              hipotenusa de un triángulo de catetos $dx$ y $dy$, o sea
              $\sqrt{dx^{2}+dy^{2}} = \sqrt{1+(y')^{2}}\,dx$. Si te acuerdas
              del triángulo, no hace falta memorizar la fórmula.
          - texto: >-
              Uno más la **función** al cuadrado, $\sqrt{1+y^{2}}$
            mensaje: |
              Esa es la del área de una superficie de revolución cuando gira
              alrededor del eje X, y ni siquiera del todo. La longitud no
              depende de a qué altura esté la curva: una recta horizontal a
              altura 1 y otra a altura 100 miden lo mismo.
          - texto: >-
              Solo la derivada al cuadrado, $\sqrt{\left(y'\right)^{2}}$
            mensaje: |
              Eso es $|y'|$, y su integral daría el desnivel total recorrido,
              no la longitud. Sin el uno, un tramo horizontal mediría cero.

      - tipo: calcular
        titulo: El integrando en el extremo
        pregunta: |
          ¿Cuánto vale $\sqrt{1+\left(y'\right)^{2}}$ en $x=3$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3.6056'
            mensaje: |
              Has metido la **función** dentro de la raíz en vez de su
              derivada: $y(3) = 2\sqrt3$, y $\sqrt{1+12} = \sqrt{13}$. Lo que
              entra es $y'$.
          - valor: '1.7321'
            mensaje: |
              Te has dejado el uno. $\left(y'\right)^{2} = x$, así que en
              $x=3$ eso vale 3 y su raíz es $\sqrt3$ — pero dentro de la raíz
              va $1+x$, no $x$.
        pista: |
          Deriva primero: la potencia $3/2$ baja y se queda en $1/2$.
        desarrollo: |
          $$
          y' = \frac{2}{3}\cdot\frac{3}{2}x^{1/2} = \sqrt{x}
          \qquad\Longrightarrow\qquad
          1+\left(y'\right)^{2} = 1+x
          $$

          En $x=3$ eso vale 4 y su raíz es **2**.

          Y fíjate en lo que acaba de pasar: **la raíz ha desaparecido**. Los
          coeficientes $2/3$ y $3/2$ están elegidos para eso, y no es casual:
          casi todos los enunciados de longitud de arco que se pueden resolver
          a mano están construidos para que $1+(y')^{2}$ sea un cuadrado
          perfecto o algo igual de simple.

      - tipo: calcular
        titulo: La longitud
        pregunta: |
          ¿Cuánto mide el arco? Da la forma exacta, o cuatro decimales.
        respuesta:
          tipo: numero
          valor: '14/3'
          tolerancia: 0.001
          formato: un número, en forma exacta o con cuatro decimales
        distractores:
          - valor: '2*sqrt(3)'
            mensaje: |
              Te has dejado el uno de dentro de la raíz: $\int_0^3\sqrt{x}\,dx$
              vale $2\sqrt3$. Y el resultado te avisa de que algo falla,
              porque sale **menor que la distancia en línea recta** entre los
              dos extremos, que es 4,58. Un arco nunca puede medir menos que
              su cuerda.
          - valor: 'sqrt(21)'
            mensaje: |
              Esa es la **cuerda**: la distancia en línea recta de $(0,0)$ a
              $(3, 2\sqrt3)$. Es una buena comprobación —el arco tiene que
              salir un poco mayor— pero no es la respuesta.
        pista: |
          Con $1+(y')^{2} = 1+x$, la integral es inmediata.
        desarrollo: |
          $$
          L = \int_0^{3}\sqrt{1+x}\;dx
          = \frac{2}{3}\Bigl[(1+x)^{3/2}\Bigr]_0^{3}
          = \frac{2}{3}\left(8-1\right) = \frac{14}{3}
          $$

          Es decir $4{,}6667$.

      - tipo: calcular
        titulo: La comprobación que siempre se puede hacer
        pregunta: |
          ¿Cuánto mide la cuerda, es decir la distancia en línea recta entre
          los dos extremos del arco?
        respuesta:
          tipo: numero
          valor: 'sqrt(21)'
          tolerancia: 0.001
          formato: un número, en forma exacta o con cuatro decimales
        distractores:
          - valor: '3'
            mensaje: |
              Esa es solo la diferencia de abscisas. La cuerda es la
              hipotenusa: hay que contar también lo que sube la curva, que es
              $y(3) = 2\sqrt3$.
        pista: |
          Los extremos son $(0,0)$ y $(3,\,y(3))$. Pitágoras.
        desarrollo: |
          $$
          y(3) = \frac{2}{3}\cdot 3\sqrt3 = 2\sqrt3
          \qquad
          d = \sqrt{3^{2}+\left(2\sqrt3\right)^{2}} = \sqrt{9+12} = \sqrt{21}
          $$

          Es decir $4{,}5826$, y el arco medía $4{,}6667$: **un 1,8 % más**.
          Tiene que ser así —el arco nunca es más corto que su cuerda— y esa
          desigualdad es la comprobación más barata que existe en este
          apartado. Si te sale un arco más corto que su cuerda, el fallo está
          en la fórmula, no en la aritmética.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Un trocito de curva es la hipotenusa de catetos $dx$ y $dy$, así
              que mide $\sqrt{1+(y')^{2}}\,dx$.
          - texto: >-
              Aquí $y' = \sqrt{x}$, y por eso $1+(y')^{2} = 1+x$ y la raíz se
              vuelve inmediata.
          - texto: >-
              La integral da $14/3 = 4{,}6667$, que es un 1,8 % más que la
              cuerda, $\sqrt{21} = 4{,}5826$.
          - texto: >-
              Y como el arco casi coincide con la cuerda, la curva es casi una
              recta en todo el intervalo.
            trampa: true
            mensaje: |
              No: la curva sale del origen con pendiente **cero** y llega a
              $x=3$ con pendiente $\sqrt3$, o sea 60°. Se dobla bastante. Lo
              que pasa es que la longitud es muy poco sensible a la curvatura
              —depende de $\sqrt{1+(y')^{2}}$, que crece muy despacio—, y por
              eso la comparación con la cuerda sirve para detectar un error de
              bulto pero no para juzgar si una curva es recta.
    resolucion: |
      **La derivada, primero.**

      $$
      y = \frac{2}{3}x^{3/2}
      \qquad\Longrightarrow\qquad
      y' = \sqrt{x}
      \qquad\Longrightarrow\qquad
      1+\left(y'\right)^{2} = 1+x
      $$

      **La integral.**

      $$
      L = \int_0^{3}\sqrt{1+x}\;dx
      = \frac{2}{3}\Bigl[(1+x)^{3/2}\Bigr]_0^{3}
      = \frac{2}{3}\left(8-1\right) = \frac{14}{3} \approx 4{,}6667
      $$

      **La comprobación.** La cuerda de $(0,0)$ a $(3, 2\sqrt3)$ mide
      $\sqrt{21} = 4{,}5826$, y el arco sale un 1,8 % mayor. Correcto: un arco
      nunca mide menos que su cuerda.

      **Lo que hay que llevarse, y por qué este ejemplo va antes que el del
      boletín.** Aquí $1+(y')^{2}$ se ha quedado en $1+x$ y la integral es
      inmediata. Eso **no es suerte**: los coeficientes $2/3$ y $3/2$ están
      puestos para que ocurra, y lo mismo pasa en casi todos los enunciados de
      longitud de arco que se resuelven a mano.

      El del boletín es la parábola $y = x^{2}+x-2$, y ahí
      $1+(y')^{2} = 1+(2x+1)^{2}$ no se simplifica: hace falta la primitiva de
      $\sqrt{1+u^{2}}$, que es otra historia y que conviene tener localizada
      **antes** de encontrársela en un examen. Ese es exactamente el escalón
      que separa un ejercicio del otro: no la fórmula, sino qué integral queda
      después de aplicarla.

  - id: teorema-de-la-media
    titulo: Seis veces el teorema de la media, y dos que no valen
    fuente: >-
      Ejercicio 5.1 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Estudiar si puede aplicarse el teorema de la media para las siguientes
      funciones en los intervalos especificados. En los casos que sea posible,
      calcular el punto (o puntos) a los que hace referencia el teorema.

      **(a)** $f(x) = 3x^{2}$ en $[-1,4]$ ·
      **(b)** $f(x) = \left|x-2\right|$ en $[0,5]$ ·
      **(c)** $f(x) = \mathrm{sen}\,x$ en $[0,2\pi]$ ·
      **(d)** $f(x) = \mathrm{sen}\,x$ en $[0,\pi]$

      **(e)** $f(x) = \begin{cases} x & x<0 \\ 4-x & x\ge0 \end{cases}$ en
      $[-2,2]$ ·
      **(f)** $f(x) = \begin{cases} x & x<0 \\ 1-x & x\ge0 \end{cases}$ en
      $[-3,3]$
    pide: Estudiar si se aplica y calcular los puntos donde sea posible.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la única hipótesis del teorema de la media integral?
        opciones:
          - texto: >-
              La **continuidad** en el intervalo cerrado
            correcta: true
            mensaje: |
              Eso es, y es lo que decide los apartados (e) y (f): las dos
              funciones tienen un salto en $x=0$, así que el teorema no se
              aplica. La integral sí se puede calcular; lo que no está
              garantizado es que el valor medio se **alcance**.
          - texto: La derivabilidad
            mensaje: |
              No hace falta. El apartado (b) es un valor absoluto, no derivable
              en $x=2$, y el teorema se aplica perfectamente porque es continuo.
          - texto: Que la función sea positiva
            mensaje: |
              El signo no interviene. En (c) el seno toma valores negativos en
              medio intervalo y el teorema se aplica igual.
          - texto: Que la función sea monótona
            mensaje: |
              Tampoco. En (c) y (d) el seno sube y baja, y el teorema vale.

      - tipo: calcular
        titulo: El apartado (a)
        pregunta: |
          Para $f(x) = 3x^{2}$ en $[-1,4]$, ¿cuál es el valor medio?
        respuesta:
          tipo: numero
          valor: '13'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '65'
            mensaje: |
              65 es la **integral**, $\int_{-1}^{4}3x^{2}dx = 64+1$. El valor
              medio es la integral dividida entre la longitud del intervalo,
              que es 5.
          - valor: '2.0816660'
            mensaje: |
              $\sqrt{13/3} \approx 2{,}08$ es el **punto** $c$ donde se alcanza
              el valor medio, no el valor medio en sí.
          - valor: '48'
            mensaje: |
              48 es $3\cdot4^{2}$, el valor de la función en el extremo derecho.
              El valor medio es mucho menor porque la parábola vale poco en casi
              todo el intervalo.
        pista: |
          $\overline{f} = \frac{1}{b-a}\int_a^b f$. La primitiva de $3x^{2}$ es
          $x^{3}$.
        desarrollo: |
          $$
          \int_{-1}^{4}3x^{2}\,dx = \left[x^{3}\right]_{-1}^{4}
          = 64-(-1) = 65
          $$

          $$
          \overline{f} = \frac{1}{4-(-1)}\cdot 65 = \frac{65}{5} = 13
          $$

          Y el punto donde se alcanza:

          $$
          3c^{2} = 13 \;\Longrightarrow\; c = \sqrt{\frac{13}{3}}
          \approx 2{,}0817
          $$

          tomando la raíz positiva, que es la que cae en $(-1,4)$. La negativa,
          $-2{,}08$, queda fuera.
        veredicto: |
          Otra vez el filtro: la ecuación da dos raíces y solo una está en el
          intervalo. Es el mismo cuidado que en Rolle y Lagrange.

      - tipo: calcular
        titulo: El apartado (c), el que sorprende
        pregunta: |
          Para $\mathrm{sen}\,x$ en $[0,2\pi]$, ¿cuál es el valor medio?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.6366198'
            mensaje: |
              $\frac{2}{\pi} \approx 0{,}637$ es el valor medio en
              $[0,\pi]$ —el apartado (d)—, donde el seno es siempre positivo. En
              $[0,2\pi]$ la mitad negativa cancela a la positiva.
          - valor: '1'
            mensaje: |
              1 es el valor **máximo** del seno, no su media. La media de una
              onda completa es 0.
          - valor: '2'
            mensaje: |
              2 es la integral de $\mathrm{sen}\,x$ en $[0,\pi]$. En
              $[0,2\pi]$ la integral vale 0.
        pista: |
          $\int_0^{2\pi}\mathrm{sen}\,x\,dx = \left[-\cos x\right]_0^{2\pi}$.
        desarrollo: |
          $$
          \int_0^{2\pi}\mathrm{sen}\,x\,dx = \left[-\cos x\right]_0^{2\pi}
          = -1-(-1) = 0
          $$

          $$
          \overline{f} = \frac{0}{2\pi} = 0
          $$

          La onda positiva y la negativa se cancelan exactamente.

          Y el teorema se aplica —el seno es continuo—, así que ese valor
          **se alcanza**:

          $$
          \mathrm{sen}\,c = 0 \;\Longrightarrow\; c = 0,\ \pi,\ 2\pi
          $$

          Tres puntos, y el teorema solo prometía uno.
        veredicto: |
          El teorema dice «existe al menos un $c$». Aquí hay tres, contando los
          extremos. No hay contradicción: garantizar uno no prohíbe que haya
          más.

      - tipo: justificar
        pregunta: |
          Ordena el análisis de los seis apartados. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **La hipótesis** es solo la continuidad en el cerrado. La
              derivabilidad no hace falta: (b) es un valor absoluto y vale.
          - texto: |
              **(a)** $\overline{f} = 13$, alcanzado en $c = \sqrt{13/3}$.
              **(b)** $\overline{f} = \frac{1}{5}\int_0^{5}\left|x-2\right| =
              \frac{13}{10}$, alcanzado en $z_1 = \frac{7}{10}$ y
              $z_2 = \frac{33}{10}$.
          - texto: |
              **(c)** $\overline{f} = 0$, alcanzado en $0$, $\pi$ y $2\pi$.
              **(d)** $\overline{f} = \frac{2}{\pi}$, alcanzado en
              $\arcsin\frac{2}{\pi}$ y en $\pi-\arcsin\frac{2}{\pi}$.
          - texto: |
              **(e)** y **(f)** tienen un **salto** en $x=0$: no son continuas,
              así que el teorema **no es aplicable**.
          - texto: |
              En (f), sin embargo, el valor medio **sí** resulta alcanzarse, en
              $z_1=-1$ y $z_2=2$. El teorema no lo garantizaba, pero tampoco lo
              prohibía.
          - texto: |
              Como (e) y (f) no son continuas, su valor medio no se puede
              calcular.
            trampa: true
            mensaje: |
              El valor medio se calcula sin problema: la integral existe aunque
              haya un salto, porque un punto no aporta área. Lo que la
              continuidad garantiza no es que el valor medio **exista**, sino
              que se **alcance**. Son dos cosas distintas, y confundirlas es el
              error del ejercicio.
        veredicto: |
          El contraste entre (e) y (f) es lo mejor del ejercicio: las dos son
          discontinuas y el teorema no se aplica a ninguna, pero en una el valor
          medio se alcanza y en la otra no.

    resolucion: |
      **Datos.** Seis funciones con sus intervalos. Se pide estudiar si se aplica
      el teorema de la media y hallar los puntos.

      ### 1 · El teorema y su única hipótesis

      Si $f$ es **continua en $[a,b]$**, existe $c \in (a,b)$ tal que

      $$
      \int_a^b f(x)\,dx = f(c)\,(b-a)
      \qquad\text{es decir}\qquad
      f(c) = \overline{f} = \frac{1}{b-a}\int_a^b f
      $$

      Una sola hipótesis: **continuidad**. No hace falta derivabilidad —el
      apartado (b) es un valor absoluto—, ni positividad, ni monotonía.

      Y conviene tener clara la distinción que decide el ejercicio: el **valor
      medio siempre se puede calcular** si la integral existe; lo que la
      continuidad garantiza es que ese valor **se alcance** en algún punto.

      ### 2 · (a) $3x^{2}$ en $[-1,4]$

      Continua ✔

      $$
      \int_{-1}^{4}3x^{2}dx = \left[x^{3}\right]_{-1}^{4} = 65,
      \qquad \overline{f} = \frac{65}{5} = 13
      $$

      $$
      3c^{2} = 13 \;\Longrightarrow\; c = \pm\sqrt{\frac{13}{3}}
      $$

      Solo $c = \sqrt{13/3} \approx 2{,}08$ está en $(-1,4)$.

      ### 3 · (b) $\left|x-2\right|$ en $[0,5]$

      Continua ✔ —aunque no derivable en $x=2$, que no importa—.

      Partiendo la integral en el vértice:

      $$
      \int_0^{5}\left|x-2\right|dx
      = \int_0^{2}(2-x)dx+\int_2^{5}(x-2)dx
      = 2+\frac{9}{2} = \frac{13}{2}
      $$

      $$
      \overline{f} = \frac{13/2}{5} = \frac{13}{10}
      $$

      $$
      \left|c-2\right| = \frac{13}{10}
      \;\Longrightarrow\;
      c = 2\pm\frac{13}{10}
      \;\Longrightarrow\;
      c = \frac{7}{10} \;\text{ o }\; c = \frac{33}{10}
      $$

      **Los dos** están en $(0,5)$: el teorema promete uno y aquí hay dos.

      ### 4 · (c) y (d), el mismo seno en dos intervalos

      **(c) en $[0,2\pi]$.**

      $$
      \int_0^{2\pi}\mathrm{sen}\,x\,dx = \left[-\cos x\right]_0^{2\pi} = 0
      \;\Longrightarrow\;
      \overline{f} = 0
      $$

      La onda positiva cancela a la negativa. Y se alcanza en

      $$
      c = 0,\ \pi,\ 2\pi
      $$

      **(d) en $[0,\pi]$.** Aquí el seno no cambia de signo:

      $$
      \int_0^{\pi}\mathrm{sen}\,x\,dx = 2
      \;\Longrightarrow\;
      \overline{f} = \frac{2}{\pi} \approx 0{,}6366
      $$

      $$
      \mathrm{sen}\,c = \frac{2}{\pi}
      \;\Longrightarrow\;
      c = \arcsin\frac{2}{\pi} \;\text{ o }\; c = \pi-\arcsin\frac{2}{\pi}
      $$

      es decir $c \approx 0{,}690$ y $c \approx 2{,}452$.

      **El contraste entre los dos apartados** es lo que enseñan: la misma
      función, distinto intervalo, valores medios completamente distintos. El
      valor medio no es una propiedad de la función sola.

      ### 5 · (e) y (f), las discontinuas

      Las dos tienen un **salto** en $x=0$:

      | | límite por la izquierda | valor en 0 | ¿continua? |
      |---|---|---|---|
      | (e) | $0$ | $4$ | **no** |
      | (f) | $0$ | $1$ | **no** |

      **El teorema no es aplicable** en ninguna de las dos. Esa es la respuesta
      formal del ejercicio.

      Pero el valor medio se puede calcular igual, porque un punto no aporta
      área:

      **(e)** $\int_{-2}^{2} = \int_{-2}^{0}x\,dx+\int_0^{2}(4-x)dx
      = -2+6 = 4$, luego $\overline{f} = 1$. Y $f(c)=1$ exige $c=1$ en la rama
      $4-x$… que da $c=3$, fuera del intervalo; o $c=1$ en la rama $x$, que es
      positivo y esa rama solo vale para $x<0$. **No se alcanza.**

      **(f)** $\int_{-3}^{3} = \int_{-3}^{0}x\,dx+\int_0^{3}(1-x)dx
      = -\frac92-\frac32 = -6$, luego $\overline{f} = -1$. Y aquí **sí** se alcanza:
      en la rama $x$ con $c=-1$ ✔, y en la rama $1-x$ con $1-c = -1$, es decir
      $c = 2$ ✔.

      $$
      z_1 = -1, \qquad z_2 = 2
      $$

      ### 6 · La lección de (e) frente a (f)

      Las dos son discontinuas y a ninguna se le aplica el teorema. Y sin
      embargo:

      - en **(e)** el valor medio **no se alcanza**: la función se salta el 1;
      - en **(f)** sí se alcanza, y hasta dos veces.

      El teorema da una condición **suficiente**, no necesaria. Que no se pueda
      aplicar no significa que la conclusión sea falsa: significa que no está
      garantizada, y hay que mirar caso por caso.

      ### 7 · Comprobación

      La comprobación natural de un valor medio es geométrica: el rectángulo de
      altura $\overline{f}$ tiene que tener la misma área que la función.

      | | $\overline{f}$ | base | área rect. | integral |
      |---|---|---|---|---|
      | (a) | $13$ | $5$ | $65$ | $65$ ✔ |
      | (b) | $1{,}3$ | $5$ | $6{,}5$ | $6{,}5$ ✔ |
      | (d) | $0{,}637$ | $\pi$ | $2$ | $2$ ✔ |
      | (f) | $-1$ | $6$ | $-6$ | $-6$ ✔ |

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \text{(a)}\ & c=\sqrt{13/3} & \text{(d)}\ & c=\arcsin\tfrac2\pi,\;
      \pi-\arcsin\tfrac2\pi \\
      \text{(b)}\ & c=\tfrac{7}{10},\ \tfrac{33}{10} &
      \text{(e)}\ & \text{no aplicable, y no se alcanza} \\
      \text{(c)}\ & c=0,\ \pi,\ 2\pi &
      \text{(f)}\ & \text{no aplicable, pero } z_1=-1,\ z_2=2
      \end{aligned}}
      $$

  - id: parametro-para-la-media
    titulo: Un parámetro que hace continua la función
    fuente: >-
      Ejercicio 5.2 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular el valor de $a$ para que pueda aplicarse el teorema de la media a
      la función $f(x)$. Utilizando ese valor, calcular el punto (o puntos) al
      que hace referencia el teorema en el intervalo $[-3,3]$.

      $$
      f(x) = \begin{cases}
      x+1 & x \le 1 \\[4pt]
      3-ax^{2} & x > 1
      \end{cases}
      $$
    pide: Calcular $a$ y los puntos del teorema.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que imponer para que el teorema sea aplicable?
        opciones:
          - texto: >-
              La **continuidad** en el empalme, $x=1$
            correcta: true
            mensaje: |
              Eso es. La única hipótesis del teorema de la media es la
              continuidad, y dentro de cada tramo la función ya lo es por ser
              polinómica. Todo se juega en $x=1$, e igualar los límites
              laterales determina $a$.
          - texto: Que la función sea derivable en $x=1$
            mensaje: |
              El teorema de la media integral **no** exige derivabilidad. Con
              imponer derivabilidad se pediría más de lo necesario y saldría
              otro valor de $a$ — o ninguno.
          - texto: Que la función sea positiva en $[-3,3]$
            mensaje: |
              No hace falta, y de hecho con el $a$ correcto la función toma
              valores negativos en parte del intervalo.
          - texto: Que $a$ sea positivo
            mensaje: |
              No hay ninguna condición sobre el signo de $a$ en el enunciado.
              Sale $a=1$, positivo, pero eso es consecuencia, no hipótesis.

      - tipo: calcular
        titulo: El parámetro
        pregunta: |
          ¿Cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              3 es el término independiente del segundo tramo. Hay que
              **resolver** $2 = 3-a$, que da $a=1$.
          - valor: '2'
            mensaje: |
              2 es el valor de la función en el empalme, $f(1) = 1+1$. El
              parámetro sale de igualarlo al otro tramo.
          - valor: '-1'
            mensaje: |
              Signo cambiado. De $3-a = 2$ se despeja $a = 3-2 = 1$.
        pista: |
          Iguala los límites laterales en $x=1$.
        desarrollo: |
          $$
          \lim_{x\to1^{-}} f(x) = f(1) = 1+1 = 2
          $$

          $$
          \lim_{x\to1^{+}} f(x) = 3-a\cdot1^{2} = 3-a
          $$

          $$
          2 = 3-a \;\Longrightarrow\; a = 1
          $$

          La función queda

          $$
          f(x) = \begin{cases} x+1 & x\le1 \\ 3-x^{2} & x>1 \end{cases}
          $$
        veredicto: |
          Con $a=1$ la función es continua pero **no derivable** en $x=1$: por
          la izquierda la pendiente es 1 y por la derecha $-2$. Al teorema de la
          media eso le da igual.

      - tipo: calcular
        titulo: El valor medio
        pregunta: |
          ¿Cuál es el valor medio de $f$ en $[-3,3]$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '-0.4444'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '-2.6666667'
            mensaje: |
              $-\frac83$ es la **integral**, no el valor medio. Falta dividir
              entre la longitud del intervalo, que es 6.
          - valor: '0.4444444'
            mensaje: |
              Falta el signo. La integral sale negativa porque el tramo
              $3-x^{2}$ baja mucho entre 1 y 3: llega a valer $-6$.
          - valor: '2'
            mensaje: |
              2 es $f(1)$, el valor en el empalme. El valor medio es bastante
              menor porque la función se hunde en el último tramo.
        pista: |
          Parte la integral en $x=1$ y calcula cada trozo.
        desarrollo: |
          $$
          \int_{-3}^{1}(x+1)\,dx = \left[\frac{x^{2}}{2}+x\right]_{-3}^{1}
          = \frac32-\left(\frac92-3\right) = \frac32-\frac32 = 0
          $$

          $$
          \int_1^{3}\left(3-x^{2}\right)dx
          = \left[3x-\frac{x^{3}}{3}\right]_1^{3}
          = \left(9-9\right)-\left(3-\frac13\right) = -\frac83
          $$

          $$
          \int_{-3}^{3} f = 0-\frac83 = -\frac83
          $$

          $$
          \overline{f} = \frac{-8/3}{6} = -\frac{4}{9} \approx -0{,}4444
          $$
        veredicto: |
          El primer tramo aporta exactamente 0: la parte que sube por encima del
          eje compensa a la que baja. Conviene fijarse, porque ahorra media
          cuenta.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Imponer continuidad en $x=1$:** $2 = 3-a$, luego $a=1$ y la
              función es $x+1$ y $3-x^{2}$.
          - texto: |
              **Calcular el valor medio**, partiendo la integral en el empalme:
              $\int_{-3}^{1}(x+1) = 0$ y $\int_1^{3}(3-x^{2}) = -\frac83$.
          - texto: |
              $\overline{f} = \frac{1}{6}\left(-\frac83\right) = -\frac49$.
          - texto: |
              **Buscar los puntos** resolviendo $f(c) = -\frac49$ **en cada
              rama**, y quedándose solo con los que caen en el tramo donde esa
              rama rige.
          - texto: |
              En la rama $x+1$: $c = -\frac{13}{9}$, que está en
              $[-3,1]$ ✔ En la rama $3-x^{2}$:
              $c = \sqrt{3+\frac49} = \frac{\sqrt{31}}{3} \approx 1{,}86$, que
              está en $(1,3]$ ✔
          - texto: |
              Basta resolver $f(c) = \overline{f}$ en una de las dos ramas, porque el
              teorema garantiza un único punto.
            trampa: true
            mensaje: |
              El teorema garantiza **al menos uno**, no exactamente uno. Aquí hay
              dos, uno en cada rama, y los dos son respuesta. Y hay otro cuidado:
              cada solución hay que comprobarla **en el tramo donde su rama
              rige**; una raíz de $3-c^{2} = -\frac49$ que cayera en $c<1$ no
              valdría.
        veredicto: |
          Resolver en las dos ramas y filtrar por tramo es el mismo esquema que
          en cualquier función a trozos. Lo que cambia es qué se iguala.

    resolucion: |
      **Datos.** $f(x) = x+1$ para $x\le1$ y $3-ax^{2}$ para $x>1$. Se pide $a$
      para que el teorema de la media sea aplicable, y los puntos en $[-3,3]$.

      ### 1 · Qué hay que imponer

      La **única** hipótesis del teorema de la media integral es la
      **continuidad**. Dentro de cada tramo la función ya lo es por ser
      polinómica, así que todo se juega en el empalme $x=1$.

      Conviene decir lo que **no** hay que imponer: derivabilidad. El teorema no
      la pide, y exigirla daría otro valor de $a$ —o ninguno—.

      ### 2 · El parámetro

      $$
      \lim_{x\to1^{-}} f(x) = f(1) = 2
      $$

      $$
      \lim_{x\to1^{+}} f(x) = 3-a
      $$

      $$
      2 = 3-a \;\Longrightarrow\; \boxed{a = 1}
      $$

      La función queda

      $$
      f(x) = \begin{cases} x+1 & x\le1 \\ 3-x^{2} & x>1 \end{cases}
      $$

      continua en todo $\mathbb{R}$, aunque con un **pico** en $x=1$: por la
      izquierda llega con pendiente 1 y por la derecha sale con $-2$. Al teorema
      de la media eso no le afecta.

      ### 3 · El valor medio

      Se parte la integral en el empalme:

      $$
      \int_{-3}^{1}(x+1)\,dx = \left[\frac{x^{2}}{2}+x\right]_{-3}^{1}
      = \frac{3}{2}-\frac{3}{2} = 0
      $$

      Vale exactamente 0: el trozo positivo, de $-1$ a 1, compensa al negativo,
      de $-3$ a $-1$.

      $$
      \int_{1}^{3}\left(3-x^{2}\right)dx = \left[3x-\frac{x^{3}}{3}\right]_1^{3}
      = 0-\frac{8}{3} = -\frac{8}{3}
      $$

      $$
      \int_{-3}^{3} f = -\frac{8}{3}
      \;\Longrightarrow\;
      \overline{f} = \frac{1}{6}\left(-\frac{8}{3}\right) = -\frac{4}{9}
      \approx -0{,}4444
      $$

      ### 4 · Los puntos donde se alcanza

      Hay que resolver $f(c) = -\frac49$ **en cada rama**, y comprobar que la
      solución cae donde esa rama rige.

      **Rama $x+1$, válida en $[-3,1]$:**

      $$
      c+1 = -\frac49 \;\Longrightarrow\; c = -\frac{13}{9} \approx -1{,}444
      $$

      Está en $[-3,1]$ ✔

      **Rama $3-x^{2}$, válida en $(1,3]$:**

      $$
      3-c^{2} = -\frac49
      \;\Longrightarrow\;
      c^{2} = 3+\frac49 = \frac{31}{9}
      \;\Longrightarrow\;
      c = \pm\frac{\sqrt{31}}{3}
      $$

      $$
      \frac{\sqrt{31}}{3} \approx 1{,}856 \in (1,3] \quad\checkmark
      $$

      La negativa, $-1{,}856$, cae en el tramo de la **otra** rama: se descarta.

      $$
      \boxed{\;a = 1, \qquad z_1 = -\frac{13}{9},
      \qquad z_2 = \frac{\sqrt{31}}{3}\;}
      $$

      **Dos** puntos. El teorema garantizaba al menos uno.

      ### 5 · Comprobación

      **Del valor medio, geométricamente.** El rectángulo de base 6 y altura
      $-\frac49$ tiene área $-\frac{8}{3}$, igual que la integral ✔

      **De los puntos:**

      $$
      f\!\left(-\frac{13}{9}\right) = -\frac{13}{9}+1 = -\frac49 \quad\checkmark
      $$

      $$
      f\!\left(\frac{\sqrt{31}}{3}\right) = 3-\frac{31}{9}
      = \frac{27-31}{9} = -\frac49 \quad\checkmark
      $$

      **De coherencia:** el valor medio, $-0{,}44$, tiene que estar entre el
      mínimo y el máximo de la función en el intervalo. El mínimo es
      $f(3) = -6$ y el máximo es $f(1) = 2$, y en efecto
      $-6 < -0{,}44 < 2$ ✔

  - id: continuidad-media-y-derivabilidad
    titulo: Continua sí, derivable no
    fuente: >-
      Ejercicio 5.3 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU ·
      Cayó en 2019/2020 AT
    nivel: practica
    enunciado: |
      Sea la siguiente función:

      $$
      f(x) = \begin{cases}
      \ln x & 1 \le x \le 2 \\[4pt]
      ax^{2}+b & 2 < x \le 3
      \end{cases}
      $$

      donde $a$ y $b$ son constantes reales.

      **(a)** Obtener las condiciones que deben de cumplir $a$ y $b$ para que la
      función $f(x)$ sea continua en $[1,3]$.

      **(b)** En ese caso, calcular los valores de $a$ y $b$ para que el valor
      medio de $f(x)$ en el intervalo $[1,3]$ sea
      $\frac12\left(3\ln2-1\right)$.

      **(c)** Para los valores de $a$ y $b$ obtenidos en el apartado anterior,
      ¿es $f(x)$ derivable?
    pide: Responder a los tres apartados.

    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado (a) pide «las condiciones», en plural pero con dos
          incógnitas. ¿Cuántas ecuaciones da?
        opciones:
          - texto: >-
              **Una sola**: la continuidad en el empalme. Deja una relación
              entre $a$ y $b$, no sus valores
            correcta: true
            mensaje: |
              Eso es, y por eso hay un apartado (b): con una ecuación y dos
              incógnitas queda una familia de funciones continuas, y hace falta
              otra condición —el valor medio— para fijarlas. La estructura del
              enunciado lo está diciendo.
          - texto: Dos, una por cada incógnita
            mensaje: |
              Solo hay **un** punto de empalme, así que solo hay una ecuación.
              La segunda condición llega en el apartado (b).
          - texto: 'Ninguna: la función ya es continua'
            mensaje: |
              En $x=2$ el primer tramo tiende a $\ln2$ y el segundo a $4a+b$.
              No coinciden salvo que se impongan.
          - texto: Tres, contando los extremos del intervalo
            mensaje: |
              En los extremos $x=1$ y $x=3$ no hay nada que empalmar: la función
              simplemente empieza y acaba. La continuidad ahí es automática.

      - tipo: calcular
        titulo: La relación entre los parámetros
        pregunta: |
          En la condición $4a+b = k$, ¿cuánto vale $k$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.6931'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es el punto de empalme, no el valor de la función ahí. En $x=2$
              el primer tramo vale $\ln2 \approx 0{,}693$.
          - valor: '0'
            mensaje: |
              0 es $\ln1$, el valor en el extremo izquierdo del intervalo. El
              empalme está en $x=2$.
          - valor: '1.0986123'
            mensaje: |
              $\ln3 \approx 1{,}0986$ es el valor que tendría el logaritmo en
              $x=3$, pero ahí ya rige el otro tramo. El empalme es en 2.
        pista: |
          Iguala $\ln 2$ con $a\cdot2^{2}+b$.
        desarrollo: |
          $$
          \lim_{x\to2^{-}} f(x) = f(2) = \ln 2
          $$

          $$
          \lim_{x\to2^{+}} f(x) = 4a+b
          $$

          $$
          4a+b = \ln 2 \approx 0{,}6931
          $$

          **Una** ecuación con dos incógnitas: describe una familia de funciones
          continuas, no una sola.
        veredicto: |
          Que quede una relación y no dos valores es lo que da sentido al
          apartado (b): hace falta otra condición.

      - tipo: calcular
        titulo: El parámetro a
        pregunta: |
          Con la condición del valor medio, ¿cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.6931472'
            mensaje: |
              $\ln2$ es el valor de **$b$**, no de $a$. Los dos salen del
              sistema, pero $a$ resulta ser 0.
          - valor: '1'
            mensaje: |
              Con $a=1$ el segundo tramo sería $x^{2}+b$, una parábola. El
              sistema da $a=0$: el segundo tramo es **constante**.
          - valor: '0.1732868'
            mensaje: |
              $\frac{\ln2}{4}$ saldría de despejar $a$ de la primera condición
              suponiendo $b=0$. Pero $b$ no es 0: hay que resolver el sistema
              entero.
        pista: |
          Calcula la integral en función de $a$ y $b$, iguala el valor medio y
          resuelve junto con $4a+b = \ln2$.
        desarrollo: |
          **La integral del primer tramo**, por partes:

          $$
          \int_1^{2}\ln x\,dx = \left[x\ln x-x\right]_1^{2}
          = \left(2\ln2-2\right)-\left(0-1\right) = 2\ln2-1
          $$

          **La del segundo:**

          $$
          \int_2^{3}\left(ax^{2}+b\right)dx
          = \left[\frac{ax^{3}}{3}+bx\right]_2^{3}
          = \frac{27a-8a}{3}+b = \frac{19a}{3}+b
          $$

          **El valor medio**, con $b-a = 3-1 = 2$:

          $$
          \overline{f} = \frac{1}{2}\left(2\ln2-1+\frac{19a}{3}+b\right)
          = \frac{1}{2}\left(3\ln2-1\right)
          $$

          $$
          2\ln2-1+\frac{19a}{3}+b = 3\ln2-1
          \;\Longrightarrow\;
          \frac{19a}{3}+b = \ln2
          $$

          Junto con $4a+b = \ln2$, restando:

          $$
          \frac{19a}{3}-4a = 0
          \;\Longrightarrow\;
          a\left(\frac{19}{3}-4\right) = 0
          \;\Longrightarrow\;
          a\cdot\frac{7}{3} = 0
          \;\Longrightarrow\;
          a = 0
          $$

          y entonces $b = \ln2$.
        veredicto: |
          Con $a=0$ el segundo tramo es la **constante** $\ln2$: la función
          crece hasta $x=2$ y luego se queda plana.

      - tipo: justificar
        pregunta: |
          Ordena los tres apartados. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **(a)** El único empalme es $x=2$, y da **una** condición:
              $4a+b = \ln2$. Con dos incógnitas, describe una familia.
          - texto: |
              **(b)** Se calculan las dos integrales —la primera por partes, que
              da $2\ln2-1$— y se impone el valor medio.
          - texto: |
              Sale la segunda ecuación, $\frac{19a}{3}+b = \ln2$, y el sistema
              con la anterior da $a=0$ y $b=\ln2$.
          - texto: |
              **(c)** Con esos valores el segundo tramo es la constante $\ln2$,
              así que su derivada es 0; y la del logaritmo en $x=2$ es
              $\frac12$.
          - texto: |
              Como $\frac12 \neq 0$, la función **no es derivable** en $x=2$: es
              continua con un pico.
          - texto: |
              Como la función es continua en $[1,3]$ y sus dos tramos son
              derivables, $f$ es derivable en todo el intervalo.
            trampa: true
            mensaje: |
              Que cada tramo sea derivable **por separado** no basta: en el
              empalme hay que comprobar que las derivadas laterales coincidan, y
              aquí no lo hacen. Es el mismo error que en el ejercicio 3.6 del
              tema 3: continua no implica derivable.
        veredicto: |
          El apartado (c) existe precisamente para eso: comprobar que se
          distingue continuidad de derivabilidad después de haber usado la
          primera para todo lo demás.

    resolucion: |
      **Datos.** $f(x) = \ln x$ en $[1,2]$ y $ax^{2}+b$ en $(2,3]$. Tres
      apartados: continuidad, valor medio y derivabilidad.

      ### 1 · Apartado (a): la condición de continuidad

      Dentro de cada tramo la función ya es continua —logaritmo en $x>0$ y
      polinomio—, así que solo hay que mirar el empalme $x=2$.

      $$
      \lim_{x\to2^{-}} f(x) = f(2) = \ln 2
      $$

      $$
      \lim_{x\to2^{+}} f(x) = a\cdot4+b = 4a+b
      $$

      $$
      \boxed{4a+b = \ln 2}
      $$

      **Una sola ecuación con dos incógnitas.** No determina $a$ y $b$: describe
      una **familia** de funciones continuas. Por eso hace falta el apartado (b).

      ### 2 · Apartado (b): la integral del logaritmo

      El primer tramo necesita **integración por partes**, con $u = \ln x$ y
      $dv = dx$:

      $$
      \int \ln x\,dx = x\ln x-\int x\cdot\frac1x\,dx = x\ln x - x
      $$

      $$
      \int_1^{2}\ln x\,dx = \left[x\ln x-x\right]_1^{2}
      = (2\ln2-2)-(0-1) = 2\ln2-1
      $$

      El segundo es inmediato:

      $$
      \int_2^{3}\left(ax^{2}+b\right)dx
      = \left[\frac{a x^{3}}{3}+bx\right]_2^{3}
      = \frac{a(27-8)}{3}+b(3-2) = \frac{19a}{3}+b
      $$

      ### 3 · Apartado (b): imponer el valor medio

      La longitud del intervalo es $3-1 = 2$:

      $$
      \overline{f} = \frac{1}{2}\left[\left(2\ln2-1\right)+\frac{19a}{3}+b\right]
      $$

      e igualando a $\frac12\left(3\ln2-1\right)$:

      $$
      2\ln2-1+\frac{19a}{3}+b = 3\ln2-1
      \;\Longrightarrow\;
      \frac{19a}{3}+b = \ln 2
      $$

      **El sistema:**

      $$
      \begin{cases}
      4a+b = \ln2 \\[4pt]
      \frac{19a}{3}+b = \ln2
      \end{cases}
      $$

      Restando, los $b$ y los $\ln2$ se cancelan:

      $$
      \frac{19a}{3}-4a = 0
      \;\Longrightarrow\;
      \frac{19a-12a}{3} = \frac{7a}{3} = 0
      \;\Longrightarrow\;
      a = 0
      $$

      $$
      b = \ln 2
      $$

      $$
      \boxed{a = 0, \qquad b = \ln 2}
      $$

      ### 4 · Qué función ha salido

      $$
      f(x) = \begin{cases} \ln x & 1\le x\le2 \\ \ln 2 & 2<x\le3 \end{cases}
      $$

      El segundo tramo es **constante**. La función crece desde 0 hasta $\ln2$ y
      luego se queda plana. Que $a$ salga 0 no es un error: es lo que exigía el
      valor medio pedido.

      ### 5 · Apartado (c): la derivabilidad

      Dentro de cada tramo es derivable. En el empalme hay que comparar las
      derivadas laterales:

      $$
      f'(2^{-}) = \left.\frac{1}{x}\right|_{x=2} = \frac{1}{2}
      $$

      $$
      f'(2^{+}) = 0 \qquad\text{(la constante)}
      $$

      $$
      \frac12 \neq 0
      $$

      $$
      \boxed{\;\text{No es derivable en } x=2\;}
      $$

      La función llega subiendo con pendiente $\frac12$ y sigue plana: hay un
      **pico**.

      Y esa es la razón de ser del apartado: se ha usado la continuidad en todo
      el ejercicio, y ahora se comprueba que **continua no implica derivable**.
      Es el mismo contraste que en el ejercicio 3.6 del tema 3.

      ### 6 · Comprobación

      **Del valor medio.** Con $a=0$ y $b=\ln2$:

      $$
      \int_1^{3} f = \left(2\ln2-1\right)+\ln2\cdot(3-2) = 3\ln2-1
      $$

      $$
      \overline{f} = \frac{3\ln2-1}{2} \quad\checkmark
      $$

      exactamente lo que pedía el enunciado.

      **Numéricamente:** $3\ln2-1 \approx 2{,}079-1 = 1{,}079$, luego
      $\overline{f} \approx 0{,}5397$.

      Y tiene que estar entre el mínimo y el máximo de $f$ en $[1,3]$, que son
      $f(1) = 0$ y $\ln2 \approx 0{,}693$:

      $$
      0 < 0{,}5397 < 0{,}693 \quad\checkmark
      $$

      **Del punto del teorema**, que el enunciado no pide pero confirma la
      coherencia: como $f$ es continua, ese valor medio se alcanza. En la rama
      del logaritmo, $\ln c = 0{,}5397$ da $c = e^{0,5397} \approx 1{,}715$,
      que está en $[1,2]$ ✔

  - id: funciones-integrales-a-trozos
    titulo: Tres funciones integrales que salen a trozos
    fuente: >-
      Ejercicio 5.4 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular las siguientes funciones integrales y comprobar que son
      derivables:

      **(a)** $F(x) = \displaystyle\int_0^{x}\left|z-1\right|dz$

      **(b)** $F(x) = \displaystyle\int_0^{x} f(z)\,dz$ donde
      $f(z) = \begin{cases} z & z \le 2 \\ 2 & z>2 \end{cases}$

      **(c)** $F(x) = \displaystyle\int_0^{x}\left|\mathrm{sen}\,z\right|dz$
      donde $0<x<2\pi$
    pide: Calcular las tres funciones integrales y comprobar la derivabilidad.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué las tres funciones integrales salen definidas a trozos?
        opciones:
          - texto: >-
              Porque el integrando **cambia de expresión** en un punto, y al
              pasar $x$ de ese punto hay que sumar la parte ya acumulada
            correcta: true
            mensaje: |
              Exacto. Mientras $x$ no llega al punto de cambio se integra una
              sola fórmula; a partir de ahí la integral es «lo acumulado hasta
              el punto de cambio **más** lo nuevo». Ese sumando constante es lo
              que hace que las dos ramas empalmen.
          - texto: Porque el integrando no es derivable
            mensaje: |
              La derivabilidad del integrando no interviene. Lo que importa es
              que su **expresión** cambia; que además tenga un pico es una
              consecuencia, no la causa.
          - texto: Porque la integral no existe en el punto de cambio
            mensaje: |
              Existe perfectamente: los tres integrandos son continuos, y aunque
              tuvieran un salto la integral seguiría existiendo.
          - texto: Porque el límite superior es variable
            mensaje: |
              Eso pasa en toda función integral, también en las que salen de una
              sola pieza. No es lo que produce los trozos.

      - tipo: calcular
        titulo: El apartado (a), segunda rama
        pregunta: |
          Para $F(x) = \int_0^{x}\left|z-1\right|dz$ con $x>1$, ¿cuánto vale
          $F(3)$?
        respuesta:
          tipo: numero
          valor: '2.5'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es solo $\int_1^{3}(z-1)dz$: has olvidado el $\frac12$ acumulado
              entre 0 y 1, que es el trozo donde $\left|z-1\right| = 1-z$.
          - valor: '1.5'
            mensaje: |
              $\frac32$ sale de aplicar Barrow a $\frac{z^{2}}{2}-z$ entre 0 y 3
              **sin** partir en el vértice. El valor absoluto no se puede
              ignorar: entre 0 y 1 vale $1-z$, no $z-1$.
          - valor: '4.5'
            mensaje: |
              $\frac92$ es $\int_0^{3}(z-1)^{2}$ o algo parecido. El integrando
              no está al cuadrado: es un valor absoluto.
        pista: |
          Parte en $z=1$: el valor absoluto cambia de signo ahí.
        desarrollo: |
          **Rama $0<x\le1$**, donde $\left|z-1\right| = 1-z$:

          $$
          F(x) = \int_0^{x}(1-z)\,dz
          = \left[z-\frac{z^{2}}{2}\right]_0^{x} = x-\frac{x^{2}}{2}
          $$

          **Rama $x>1$**, sumando lo acumulado hasta 1:

          $$
          F(x) = F(1)+\int_1^{x}(z-1)\,dz
          = \frac12+\left[\frac{z^{2}}{2}-z\right]_1^{x}
          = \frac12+\frac{x^{2}}{2}-x+\frac12
          $$

          $$
          F(x) = 1-x+\frac{x^{2}}{2}
          $$

          Y en $x=3$:

          $$
          F(3) = 1-3+\frac92 = \frac52 = 2{,}5
          $$
        veredicto: |
          El $\frac12$ acumulado es el sumando que hace que las dos ramas
          empalmen. Sin él, $F$ tendría un salto y no sería ni continua.

      - tipo: calcular
        titulo: El apartado (c), segunda rama
        pregunta: |
          Para $F(x) = \int_0^{x}\left|\mathrm{sen}\,z\right|dz$ con
          $\pi<x<2\pi$, ¿cuánto vale $F\left(\frac{3\pi}{2}\right)$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es lo que da $1-\cos x$ en $\frac{3\pi}{2}$: has usado la rama
              del **primer** tramo. Pasado $\pi$ el integrando es $-\mathrm{sen}\,z$
              y la rama pasa a ser $3+\cos x$, con el 2 de la primera media onda
              ya acumulado dentro.
          - valor: '-1'
            mensaje: |
              El signo de la primitiva: $\int\mathrm{sen}\,z\,dz = -\cos z$, y si
              escribes $+\cos$ te queda $\cos x - 1$, que en $\frac{3\pi}{2}$
              vale $-1$. Hay una comprobación de un segundo que lo caza: un área
              **nunca** puede ser negativa, y el integrando es un valor
              absoluto.
          - valor: '2'
            mensaje: |
              2 es $F(\pi)$, el área de la primera media onda entera. En
              $\frac{3\pi}{2}$ ya se ha acumulado una media onda más.
        pista: |
          El seno cambia de signo en $\pi$: ahí el valor absoluto cambia de
          fórmula.
        desarrollo: |
          **Rama $0<x\le\pi$**, donde $\mathrm{sen}\,z \ge 0$:

          $$
          F(x) = \int_0^{x}\mathrm{sen}\,z\,dz
          = \left[-\cos z\right]_0^{x} = 1-\cos x
          $$

          **Rama $\pi<x<2\pi$**, donde $\mathrm{sen}\,z \le 0$ y por tanto
          $\left|\mathrm{sen}\,z\right| = -\mathrm{sen}\,z$:

          $$
          F(x) = F(\pi)+\int_{\pi}^{x}\left(-\mathrm{sen}\,z\right)dz
          = 2+\left[\cos z\right]_{\pi}^{x} = 2+\cos x+1
          $$

          $$
          F(x) = 3+\cos x
          $$

          En $x = \frac{3\pi}{2}$, donde $\cos x = 0$:

          $$
          F\!\left(\frac{3\pi}{2}\right) = 3
          $$
        veredicto: |
          Tiene sentido: una media onda completa aporta 2, y la mitad de la
          siguiente aporta 1. Total 3.

      - tipo: justificar
        pregunta: |
          Ordena la comprobación de que $F$ es derivable. Una de las piezas no
          debe entrar.
        piezas:
          - texto: |
              **Dentro de cada rama** $F$ es derivable, porque es un polinomio o
              un coseno.
          - texto: |
              **En el punto de empalme** hay que comparar las derivadas
              laterales. En (a), con $x=1$: por la izquierda $1-x$ da 0, por la
              derecha $-1+x$ da 0.
          - texto: |
              Coinciden, así que $F$ **sí** es derivable en $x=1$, con
              $F'(1) = 0$.
          - texto: |
              Y eso es exactamente lo que anunciaba el teorema fundamental:
              $F'(x) = f(x)$, y aquí $f(1) = \left|1-1\right| = 0$.
          - texto: |
              Lo mismo en (b) y (c): $F'(2) = f(2) = 2$ y
              $F'(\pi) = \left|\mathrm{sen}\,\pi\right| = 0$. Las tres son
              derivables porque **los tres integrandos son continuos**.
          - texto: |
              Como el integrando de (a) no es derivable en $x=1$, $F$ tampoco lo
              es en ese punto.
            trampa: true
            mensaje: |
              Al revés: integrar **gana** una derivada. El integrando
              $\left|z-1\right|$ tiene un pico en 1, pero su función integral es
              suave ahí. El teorema fundamental solo pide que $f$ sea
              **continua**, y lo es.
        veredicto: |
          La pieza trampa es el corazón del ejercicio. Por eso el enunciado pide
          «comprobar que son derivables»: para que se vea que integrar suaviza.

    resolucion: |
      **Datos.** Tres funciones integrales cuyo integrando cambia de expresión
      en un punto. Se pide calcularlas y comprobar que son derivables.

      ### 1 · La herramienta

      **Primera parte del teorema fundamental:** si $f$ es continua,
      $F(x) = \int_a^{x} f$ es derivable y $F'(x) = f(x)$.

      Los tres integrandos son **continuos** —el valor absoluto de una función
      continua lo es, y la de (b) empalma en 2 porque $z\to2$ da 2—, así que las
      tres funciones integrales serán derivables. El ejercicio consiste en verlo
      a mano.

      Y la técnica es siempre la misma: **partir en el punto donde el integrando
      cambia de fórmula** y, en la segunda rama, sumar lo ya acumulado.

      ### 2 · Apartado (a): $\left|z-1\right|$

      El valor absoluto cambia en $z=1$.

      **Para $0<x\le1$**, $\left|z-1\right| = 1-z$:

      $$
      F(x) = \left[z-\frac{z^{2}}{2}\right]_0^{x} = x-\frac{x^{2}}{2}
      $$

      **Para $x>1$**, arrastrando $F(1) = \frac12$:

      $$
      F(x) = \frac12+\int_1^{x}(z-1)dz
      = \frac12+\left(\frac{x^{2}}{2}-x\right)-\left(\frac12-1\right)
      = 1-x+\frac{x^{2}}{2}
      $$

      $$
      \boxed{F(x) = \begin{cases}
      x-\dfrac{x^{2}}{2} & 0<x\le1 \\[10pt]
      1-x+\dfrac{x^{2}}{2} & x>1
      \end{cases}}
      $$

      ### 3 · Apartado (b): la función a trozos

      El integrando cambia en $z=2$.

      **Para $0<x\le2$:** $F(x) = \int_0^{x} z\,dz = \frac{x^{2}}{2}$

      **Para $x>2$**, con $F(2) = 2$:

      $$
      F(x) = 2+\int_2^{x}2\,dz = 2+2(x-2) = 2x-2
      $$

      $$
      \boxed{F(x) = \begin{cases}
      \dfrac{x^{2}}{2} & 0<x\le2 \\[10pt]
      2x-2 & x>2
      \end{cases}}
      $$

      A partir de 2 la función integral crece **linealmente**, porque el
      integrando se ha vuelto constante. La parábola se convierte en recta, y lo
      hace de forma tangente.

      ### 4 · Apartado (c): $\left|\mathrm{sen}\,z\right|$

      El seno cambia de signo en $\pi$.

      **Para $0<x\le\pi$:**

      $$
      F(x) = \int_0^{x}\mathrm{sen}\,z\,dz = 1-\cos x
      $$

      **Para $\pi<x<2\pi$**, con $F(\pi) = 2$:

      $$
      F(x) = 2+\int_{\pi}^{x}\left(-\mathrm{sen}\,z\right)dz
      = 2+\left[\cos z\right]_{\pi}^{x} = 3+\cos x
      $$

      $$
      \boxed{F(x) = \begin{cases}
      1-\cos x & 0<x\le\pi \\[4pt]
      3+\cos x & \pi<x<2\pi
      \end{cases}}
      $$

      Y $F$ es **creciente en todo el intervalo**, como tiene que ser: el
      integrando es un valor absoluto, nunca negativo, así que el área solo
      puede acumularse.

      ### 5 · La derivabilidad

      Dentro de cada rama las tres son derivables sin discusión. El punto
      delicado es el empalme, y la comprobación es idéntica en los tres casos:

      | | punto | $F'$ por la izquierda | $F'$ por la derecha | $f$ ahí |
      |---|---|---|---|---|
      | (a) | $1$ | $1-1 = 0$ | $-1+1 = 0$ | $0$ |
      | (b) | $2$ | $2$ | $2$ | $2$ |
      | (c) | $\pi$ | $\mathrm{sen}\,\pi = 0$ | $-\mathrm{sen}\,\pi = 0$ | $0$ |

      Las derivadas laterales coinciden en los tres, y coinciden precisamente
      con el valor del integrando: $F'(x) = f(x)$, que es lo que anunciaba el
      teorema.

      **Y hay algo más interesante.** En (a) el integrando tiene un **pico** en
      $x=1$; su función integral, no. Integrar **gana** una derivada: convierte
      lo continuo en derivable. Por eso el teorema fundamental solo exige
      continuidad.

      ### 6 · Comprobación

      **Continuidad en los empalmes:**

      $$
      \text{(a)}\quad 1-\frac12 = \frac12
      \quad\text{y}\quad 1-1+\frac12 = \frac12 \quad\checkmark
      $$

      $$
      \text{(b)}\quad \frac{4}{2} = 2 \quad\text{y}\quad 2\cdot2-2 = 2
      \quad\checkmark
      $$

      $$
      \text{(c)}\quad 1-\cos\pi = 2 \quad\text{y}\quad 3+\cos\pi = 2
      \quad\checkmark
      $$

      **Un valor por vía independiente:** en (c), $F(2\pi^{-}) = 3+1 = 4$, y en
      efecto el área de dos medias ondas de seno es $2+2 = 4$ ✔

  - id: funcion-media-frente-a-valor-medio
    titulo: Función media y valor medio no son lo mismo
    fuente: >-
      Ejercicio 5.5 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Sea la función:

      $$
      f(x) = \begin{cases}
      x & x \in [0,1) \\[4pt]
      e^{1-x} & x \in [1,2]
      \end{cases}
      $$

      **(a)** Dibujar $f(x)$.

      **(b)** Calcular la *función media de $f(x)$*, $\overline{f}(x)$, en el
      intervalo $[a,b]$.

      **(c)** Calcular el *valor medio de $f(x)$*, $\overline{f}$, en el intervalo
      $[a,b]$.
    pide: Dibujar, calcular la función media y el valor medio.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la diferencia entre la **función media** $\overline{f}(x)$ y el
          **valor medio** $\overline{f}$?
        opciones:
          - texto: >-
              $\overline{f}(x)$ es una **función**: la media desde $a$ hasta $x$.
              $\overline{f}$ es un **número**: la media en todo $[a,b]$
            correcta: true
            mensaje: |
              Eso es. La función media es
              $\overline{f}(x) = \frac{1}{x-a}\int_a^{x} f$, y depende de $x$. El
              valor medio es su valor en el extremo: $\overline{f} = \overline{f}(b)$. El
              ejercicio pide las dos para que se vea que la segunda es un caso
              particular de la primera.
          - texto: Son lo mismo escrito de dos formas
            mensaje: |
              No: una es una función de $x$ y la otra un número. Que compartan
              nombre y símbolo es precisamente lo que hace peligroso el
              ejercicio.
          - texto: >-
              $\overline{f}(x)$ es la primitiva y $\overline{f}$ es la integral definida
            mensaje: |
              Casi, pero falta la división. La función media es la función
              integral **dividida entre la longitud** $x-a$; sin esa división
              sería la función integral, no la media.
          - texto: >-
              $\overline{f}(x)$ es el punto donde se alcanza el valor medio
            mensaje: |
              Ese punto suele llamarse $c$ y es el del teorema de la media. La
              función media es otra cosa.

      - tipo: calcular
        titulo: La función media en la primera rama
        pregunta: |
          Para $x \in [0,1)$, ¿cuánto vale $\overline{f}(x)$ en $x = 0{,}8$?
        respuesta:
          tipo: numero
          valor: '0.4'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.32'
            mensaje: |
              $0{,}32 = \frac{0,8^{2}}{2}$ es la **integral**, no la media.
              Falta dividir entre $x-a = 0{,}8$.
          - valor: '0.8'
            mensaje: |
              $0{,}8$ es $f(0{,}8)$, el valor de la función. La media de una
              recta que sale del origen es la mitad.
          - valor: '1.6'
            mensaje: |
              Has multiplicado por 2 en vez de dividir. $\overline{f}(x) = \frac x2$.
        pista: |
          $\overline{f}(x) = \frac{1}{x-0}\int_0^{x} f$, y en esa rama $f(z) = z$.
        desarrollo: |
          Con $a = 0$:

          $$
          \overline{f}(x) = \frac{1}{x}\int_0^{x} z\,dz
          = \frac{1}{x}\cdot\frac{x^{2}}{2} = \frac{x}{2}
          $$

          $$
          \overline{f}(0{,}8) = 0{,}4
          $$

          La media de una recta que arranca del origen es siempre la mitad de su
          valor final: es el área del triángulo entre la base.
        veredicto: |
          Fíjate en que $\overline{f}(x) = \frac x2$ está **por debajo** de
          $f(x) = x$. Tiene que ser así: la función crece, y la media arrastra
          los valores pequeños del principio.

      - tipo: calcular
        titulo: El valor medio en todo el intervalo
        pregunta: |
          ¿Cuánto vale $\overline{f}$ en $[0,2]$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.5661'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '1.1321'
            mensaje: |
              $1{,}132$ es la **integral** $\frac32-\frac1e$. Falta dividir
              entre la longitud del intervalo, que es 2.
          - valor: '0.75'
            mensaje: |
              $\frac34$ es solo el primer sumando de $\frac34-\frac{1}{2e}$: te
              has dejado el término exponencial.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es el valor medio de la primera rama sola, en $[0,1]$.
              Falta la contribución de $e^{1-x}$ entre 1 y 2.
        pista: |
          $\overline{f} = \overline{f}(2) = \frac12\int_0^{2} f$, partiendo la integral
          en $x=1$.
        desarrollo: |
          $$
          \int_0^{1} z\,dz = \frac12
          $$

          $$
          \int_1^{2} e^{1-z}dz = \left[-e^{1-z}\right]_1^{2}
          = -e^{-1}+e^{0} = 1-\frac1e
          $$

          $$
          \int_0^{2} f = \frac12+1-\frac1e = \frac32-\frac1e
          $$

          $$
          \overline{f} = \frac12\left(\frac32-\frac1e\right)
          = \frac34-\frac{1}{2e} \approx 0{,}75-0{,}1839 = 0{,}5661
          $$
        veredicto: |
          Cuidado con el signo de la primitiva: $\int e^{1-z}dz = -e^{1-z}$,
          porque la derivada interna es $-1$. Es el fallo más frecuente del
          apartado.

      - tipo: justificar
        pregunta: |
          Ordena el ejercicio. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **(a)** El dibujo: una recta desde el origen hasta $(1,1)$, y
              desde ahí una exponencial decreciente que baja de $1$ a
              $\frac1e$. La función es **continua** en $x=1$, porque
              $e^{1-1} = 1$.
          - texto: |
              **(b)** La función media es
              $\overline{f}(x) = \frac{1}{x-a}\int_a^{x} f$, con $a=0$. Sale a trozos
              porque $f$ lo es.
          - texto: |
              Primera rama: $\overline{f}(x) = \frac{1}{x}\cdot\frac{x^{2}}{2}
              = \frac x2$ para $x\in[0,1)$.
          - texto: |
              Segunda rama: $\overline{f}(x) = \frac1x\left(\frac12+1-e^{1-x}\right)
              = \frac1x\left(\frac32-e^{1-x}\right)$ para $x\in[1,2]$.
          - texto: |
              **(c)** El valor medio es la función media evaluada en el extremo:
              $\overline{f} = \overline{f}(2) = \frac12\left(\frac32-\frac1e\right)
              = \frac34-\frac{1}{2e}$.
          - texto: |
              La función media $\overline{f}(x)$ no está definida en $x=0$, así que la
              función media no existe en $[0,2]$.
            trampa: true
            mensaje: |
              En $x=a$ la expresión $\frac{1}{x-a}$ es $\frac00$, pero el
              **límite** existe y vale $f(a)$: la media de un intervalo que se
              encoge tiende al valor en el punto. Aquí
              $\lim_{x\to0^{+}}\frac x2 = 0 = f(0)$. Es una indeterminación
              salvable, no un agujero.
        veredicto: |
          Que la función media empiece valiendo $f(a)$ y acabe valiendo $\overline{f}$
          es la mejor forma de entender qué es: interpola entre el valor inicial
          y la media global.

      - tipo: dibujar
        consigna: |
          Dibuja $f(x)$ en $\left[0,2\right]$ y, encima, con otro trazo, la
          función media $\overline f(x)$. Marca el valor medio como línea
          horizontal.
        comprueba:
          - punto: |
              $f$: un segmento recto de $\left(0,0\right)$ a $\left(1,1\right)$ y
              después una exponencial que baja de $1$ a $e^{-1}\approx0{,}37$.
            porque: |
              En $x=1$ los dos trozos valen $1$: la función es **continua** ahí.
              Dibujar un salto es el error que se cuela por estar definida a
              trozos.
          - punto: |
              $\overline f$: una recta de pendiente $\tfrac12$ hasta $x=1$ y
              después una curva que baja suavemente.
            porque: |
              En el primer tramo $\overline f(x)=\tfrac x2$, la mitad de $f$. Que
              vaya siempre por debajo es lo que enseña qué significa promediar.
          - punto: |
              Que $\overline f$ es **continua** en $x=1$, con las dos ramas
              valiendo $\tfrac12$.
            porque: |
              Promediar suaviza. Comprobar que los dos trozos encajan es la
              verificación del apartado (b), y cuesta una sustitución.
          - punto: |
              El valor medio $\overline f\approx0{,}566$ como línea horizontal, y
              $\overline f(2)$ cayendo justo sobre ella.
            porque: |
              El valor medio **es** el valor final de la función media. Dibujar
              los dos objetos juntos es lo que impide confundirlos, que es el
              punto entero del ejercicio.
        veredicto: |
          Dos objetos distintos en el mismo dibujo: una función que depende de
          $x$ y un número. Que el número sea el valor de la función en el extremo
          derecho es la relación que hay que ver, y solo se ve dibujándolos
          juntos.

    resolucion: |
      **Datos.** $f(x) = x$ en $[0,1)$ y $e^{1-x}$ en $[1,2]$. El intervalo
      $[a,b]$ del enunciado es el dominio entero, $[0,2]$.

      ### 1 · Apartado (a): el dibujo

      Dos tramos:

      - **$[0,1)$:** la recta $y=x$, del origen a $(1,1)$.
      - **$[1,2]$:** la exponencial $e^{1-x}$, que en $x=1$ vale
        $e^{0} = 1$ y en $x=2$ vale $e^{-1} \approx 0{,}368$, bajando y
        cóncava hacia arriba.

      **La función es continua en $x=1$**, porque los dos tramos llegan a 1. No
      es derivable ahí: llega con pendiente $+1$ y sale con pendiente $-1$.

      Sube hasta un máximo en $x=1$ y luego baja.

      ### 2 · Las dos definiciones que hay que separar

      $$
      \text{función media:}\quad
      \overline{f}(x) = \frac{1}{x-a}\int_a^{x} f(z)\,dz
      $$

      $$
      \text{valor medio:}\quad
      \overline{f} = \frac{1}{b-a}\int_a^{b} f(z)\,dz = \overline{f}(b)
      $$

      La primera es una **función**; la segunda, un **número**, y es la primera
      evaluada en el extremo derecho. Comparten nombre y símbolo, y ahí está la
      trampa del ejercicio.

      ### 3 · Apartado (b): la función media

      Con $a = 0$, o sea $\overline{f}(x) = \frac1x\int_0^{x} f$.

      **Rama $x \in [0,1)$:**

      $$
      \int_0^{x} z\,dz = \frac{x^{2}}{2}
      \;\Longrightarrow\;
      \overline{f}(x) = \frac{1}{x}\cdot\frac{x^{2}}{2} = \frac{x}{2}
      $$

      **Rama $x \in [1,2]$**, arrastrando $\int_0^{1} = \frac12$:

      $$
      \int_1^{x} e^{1-z}dz = \left[-e^{1-z}\right]_1^{x}
      = -e^{1-x}+1
      $$

      $$
      \int_0^{x} f = \frac12+1-e^{1-x} = \frac32-e^{1-x}
      $$

      $$
      \overline{f}(x) = \frac{1}{x}\left(\frac{3}{2}-e^{1-x}\right)
      $$

      $$
      \boxed{\overline{f}(x) = \begin{cases}
      \dfrac{x}{2} & x\in[0,1) \\[10pt]
      \dfrac1x\left(\dfrac32-e^{1-x}\right) & x\in[1,2]
      \end{cases}}
      $$

      **Ojo con la primitiva de $e^{1-z}$:** es $-e^{1-z}$, con signo menos,
      porque la derivada del exponente es $-1$. Olvidarlo cambia el resultado de
      todo el apartado.

      ### 4 · Apartado (c): el valor medio

      Es la función media en $x = b = 2$:

      $$
      \overline{f} = \overline{f}(2) = \frac12\left(\frac32-e^{-1}\right)
      = \frac34-\frac{1}{2e}
      $$

      $$
      \boxed{\overline{f} = \frac34-\frac{1}{2e} \approx 0{,}5661}
      $$

      ### 5 · Comprobación

      **Que la función media empalma.** En $x=1$ las dos ramas deben coincidir:

      $$
      \frac12 \quad\text{y}\quad \frac11\left(\frac32-e^{0}\right)
      = \frac32-1 = \frac12 \quad\checkmark
      $$

      **Que empieza donde debe.** El límite cuando $x\to0^{+}$ es
      $\lim \frac x2 = 0 = f(0)$ ✔ La media de un intervalo que se encoge tiende
      al valor de la función en el punto.

      **Que el valor medio es razonable.** Tiene que estar entre el mínimo y el
      máximo de $f$ en $[0,2]$, que son $f(0)=0$ y $f(1)=1$:

      $$
      0 < 0{,}566 < 1 \quad\checkmark
      $$

      **Y por área aproximada:** el triángulo del primer tramo aporta $0{,}5$ y
      la exponencial del segundo algo más de $0{,}6$; en total $\approx1{,}13$,
      que entre 2 da $\approx0{,}566$ ✔

  - id: ecuacion-con-funcion-integral
    titulo: Una ecuación donde la incógnita es el límite de integración
    fuente: >-
      Ejercicio 5.6 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU ·
      Cayó en 2014/2015 4E AT
    nivel: practica
    enunciado: |
      Sea la ecuación $5x^{3}+40 = \displaystyle\int_a^{x} f(u)\,du$. Calcular
      $f(x)$ y $a$.
    pide: Calcular $f(x)$ y $a$.

    pasos:
      - tipo: reconocer
        pregunta: |
          Hay dos incógnitas, $f$ y $a$. ¿De dónde sale cada una?
        opciones:
          - texto: >-
              $f$ de **derivar** los dos lados; $a$ de imponer que la integral
              se anula cuando $x=a$
            correcta: true
            mensaje: |
              Exacto, y son dos ideas distintas. Derivar mata el $a$ —el límite
              inferior es constante y desaparece—, así que hace falta una
              segunda condición para recuperarlo: $\int_a^{a} = 0$.
          - texto: Las dos de derivar
            mensaje: |
              Al derivar, el límite inferior desaparece: $a$ es constante y su
              rastro se pierde. Hace falta otra ecuación.
          - texto: Las dos de sustituir $x=0$
            mensaje: |
              Sustituir $x=0$ da $40 = \int_a^{0} f$, una condición cierta pero
              inútil mientras no se conozca $f$. El camino es derivar primero.
          - texto: >-
              $f$ de integrar el lado izquierdo
            mensaje: |
              Es al revés. La igualdad dice que $5x^{3}+40$ **es** una primitiva
              de $f$: para recuperar $f$ hay que derivar, no integrar.

      - tipo: calcular
        titulo: El integrando
        pregunta: |
          ¿Cuánto vale $f(2)$?
        respuesta:
          tipo: numero
          valor: '60'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '80'
            mensaje: |
              80 es $5\cdot2^{3}+40$, el valor del lado izquierdo. $f$ es su
              **derivada**, $15x^{2}$, que en 2 vale 60.
          - valor: '30'
            mensaje: |
              30 es $15\cdot2$: has derivado como si el exponente fuera 2. La
              derivada de $5x^{3}$ es $15x^{2}$, no $15x$.
          - valor: '40'
            mensaje: |
              40 es el término independiente, que al derivar desaparece.
        pista: |
          Deriva los dos miembros y usa el teorema fundamental en el derecho.
        desarrollo: |
          Derivando los dos lados respecto de $x$:

          $$
          \frac{d}{dx}\left(5x^{3}+40\right) = 15x^{2}
          $$

          $$
          \frac{d}{dx}\int_a^{x} f(u)\,du = f(x)
          $$

          $$
          f(x) = 15x^{2}
          $$

          Y en $x=2$: $f(2) = 15\cdot4 = 60$.
        veredicto: |
          El 40 se pierde al derivar. Precisamente por eso hace falta la segunda
          condición: es lo único que lo recuerda.

      - tipo: calcular
        titulo: El límite inferior
        pregunta: |
          ¿Cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Signo cambiado. De $5a^{3} = -40$ sale $a^{3} = -8$, y la raíz
              cúbica de un número negativo es negativa.
          - valor: '-8'
            mensaje: |
              $-8$ es $a^{3}$, no $a$. Falta la raíz cúbica.
          - valor: '0'
            mensaje: |
              Con $a=0$ el lado derecho valdría 0 en $x=0$ y el izquierdo 40.
              No cuadra.
        pista: |
          Sustituye $x=a$: el lado derecho se anula.
        desarrollo: |
          Cuando $x=a$, la integral tiene los dos límites iguales:

          $$
          \int_a^{a} f(u)\,du = 0
          $$

          Y entonces la ecuación dice

          $$
          5a^{3}+40 = 0
          \;\Longrightarrow\;
          a^{3} = -8
          \;\Longrightarrow\;
          a = -2
          $$

          La raíz cúbica es única en los reales, así que no hay que filtrar
          nada.
        veredicto: |
          $\int_a^{a} = 0$ parece una trivialidad y es la clave del ejercicio.
          Es lo único que puede devolver la información que la derivada borró.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              La igualdad dice que $5x^{3}+40$ es **una primitiva** de $f$ —la
              que se anula en $a$—.
          - texto: |
              **Derivar los dos lados.** A la izquierda, $15x^{2}$; a la
              derecha, por el teorema fundamental, $f(x)$.
          - texto: |
              Luego $f(x) = 15x^{2}$. El 40 ha desaparecido: la derivada no
              distingue primitivas que difieren en una constante.
          - texto: |
              **Recuperar esa información** sustituyendo $x=a$, donde la
              integral se anula por tener los dos límites iguales.
          - texto: |
              $5a^{3}+40 = 0 \Rightarrow a^{3} = -8 \Rightarrow a = -2$.
          - texto: |
              Como $f(x) = 15x^{2}$ es par, $a$ puede ser $2$ o $-2$
              indistintamente.
            trampa: true
            mensaje: |
              La paridad de $f$ no interviene: la condición se impone sobre
              $5a^{3}+40 = 0$, que es una ecuación cúbica con **una sola** raíz
              real. Con $a = 2$ saldría $40+40 = 80 \neq 0$.
        veredicto: |
          Derivar para obtener $f$ y evaluar en $a$ para obtener $a$: dos
          herramientas distintas, una por incógnita.

    resolucion: |
      **Datos.** $5x^{3}+40 = \int_a^{x} f(u)\,du$, con $f$ y $a$ desconocidos.

      ### 1 · Qué dice realmente la ecuación

      El lado derecho es una **función integral**: la primitiva de $f$ que vale
      0 en $x=a$. Así que la igualdad afirma que $5x^{3}+40$ es esa primitiva.

      De ahí salen las dos incógnitas, cada una por su lado:

      - **$f$** derivando, porque derivar una función integral devuelve el
        integrando;
      - **$a$** evaluando en $x=a$, porque ahí la integral vale 0.

      ### 2 · El integrando

      Derivando los dos miembros:

      $$
      \frac{d}{dx}\left(5x^{3}+40\right) = 15x^{2}
      $$

      $$
      \frac{d}{dx}\int_a^{x} f(u)\,du \;\overset{\text{TFC}}{=}\; f(x)
      $$

      $$
      \boxed{f(x) = 15x^{2}}
      $$

      Nótese que el **40 se ha perdido**. La derivada no distingue entre
      primitivas que difieren en una constante, y esa información es
      exactamente la que determina $a$.

      ### 3 · El límite inferior

      Sustituyendo $x=a$, la integral tiene los dos límites iguales:

      $$
      \int_a^{a} f(u)\,du = 0
      $$

      $$
      5a^{3}+40 = 0
      \;\Longrightarrow\;
      a^{3} = -8
      \;\Longrightarrow\;
      \boxed{a = -2}
      $$

      La cúbica tiene **una sola** raíz real, así que no hay que descartar
      ninguna solución. Si el exponente fuera par habría que elegir, y el
      criterio sería que la igualdad se cumpliera para todo $x$.

      ### 4 · Comprobación

      Con $f(u) = 15u^{2}$ y $a=-2$, se calcula la integral de verdad:

      $$
      \int_{-2}^{x}15u^{2}\,du = \left[5u^{3}\right]_{-2}^{x}
      = 5x^{3}-5(-2)^{3} = 5x^{3}+40
      $$

      que es exactamente el lado izquierdo ✔ **para todo $x$**, no solo para
      uno.

      Esa es la comprobación buena: no basta con que cuadre en un punto, tiene
      que cuadrar como identidad.

  - id: maclaurin-sin-integrar
    titulo: Dos polinomios de Maclaurin sin calcular la integral
    fuente: >-
      Ejercicios 5.7 y 5.8 · Problemas complementarios, tema 5 · Cálculo,
      UPV/EHU · El 5.7 cayó en 2019/2020 6E
    nivel: practica
    enunciado: |
      **(5.7)** Sea $f(x) = 3+\displaystyle\int_0^{x}\frac{1+\mathrm{sen}\,t}
      {2+t^{2}}\,dt$ $\forall x \in \mathbb{R}$. Sin calcular la integral,
      obtener el polinomio de Mclaurin de grado uno de $f$.

      **(5.8)** Calcular el polinomio de McLaurin de tercer orden de la función
      $H(x) = \displaystyle\int_0^{x}e^{t^{2}}\,dt$.
    pide: Obtener los dos polinomios de Maclaurin.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado del 5.7 dice «sin calcular la integral». ¿Por qué se
          puede?
        opciones:
          - texto: >-
              Porque Maclaurin solo necesita **derivadas en 0**, y el teorema
              fundamental las da directamente
            correcta: true
            mensaje: |
              Eso es. $f'(x)$ es el integrando, $f''(x)$ su derivada, y así
              sucesivamente; todas se evalúan en 0. La primitiva no aparece por
              ningún lado, y menos mal: la de $\frac{1+\mathrm{sen}\,t}{2+t^{2}}$
              no es elemental.
          - texto: >-
              Porque el integrando es pequeño cerca de 0
            mensaje: |
              El tamaño del integrando no tiene nada que ver. Lo que permite
              saltarse la integral es que Maclaurin trabaja con derivadas.
          - texto: >-
              Porque la integral vale 0 en $x=0$
            mensaje: |
              Eso da el término independiente, $f(0)=3$, pero no los demás. La
              razón de fondo es que **todos** los coeficientes son derivadas.
          - texto: >-
              Porque el polinomio pedido es solo de grado uno
            mensaje: |
              El 5.8 pide grado tres y también se hace sin integrar —de hecho
              $e^{t^{2}}$ **no tiene** primitiva elemental—. El grado no es la
              razón.

      - tipo: calcular
        titulo: El 5.7
        pregunta: |
          En $p(x) = f(0)+f'(0)\,x$, ¿cuánto vale $f'(0)$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              3 es $f(0)$, el término independiente. $f'(0)$ es el integrando
              evaluado en 0.
          - valor: '1'
            mensaje: |
              1 es el numerador del integrando en $t=0$. Falta dividir entre el
              denominador, que vale 2.
          - valor: '2'
            mensaje: |
              2 es el denominador en $t=0$. La fracción es
              $\frac{1+0}{2+0} = \frac12$.
        pista: |
          Por el teorema fundamental, $f'(x)$ es el integrando.
        desarrollo: |
          $$
          f'(x) = \frac{1+\mathrm{sen}\,x}{2+x^{2}}
          $$

          $$
          f'(0) = \frac{1+\mathrm{sen}\,0}{2+0} = \frac{1}{2}
          $$

          Y como $\int_0^{0} = 0$:

          $$
          f(0) = 3+0 = 3
          $$

          $$
          p(x) = 3+\frac{x}{2}
          $$
        veredicto: |
          El 3 no se toca: es un sumando de fuera de la integral, y sobrevive
          entero al evaluar en 0.

      - tipo: calcular
        titulo: El 5.8, el coeficiente cúbico
        pregunta: |
          En $P_3(x) = \sum \frac{H^{(k)}(0)}{k!}x^{k}$, ¿cuánto vale el
          coeficiente de $x^{3}$?
        respuesta:
          tipo: numero
          valor: '0.3333333'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              2 es $H'''(0)$, la derivada tercera. El coeficiente es esa
              derivada **dividida entre $3! = 6$**.
          - valor: '0.1666667'
            mensaje: |
              $\frac16$ saldría de $H'''(0)=1$. Pero
              $H'''(x) = 2e^{x^{2}}+4x^{2}e^{x^{2}}$, que en 0 vale 2, no 1.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es el coeficiente que tendría $x^{2}$ si $H''(0)$ valiera
              1; pero $H''(0) = 0$ y ese término no existe.
        pista: |
          $H'(x) = e^{x^{2}}$. Deriva dos veces más y evalúa en 0.
        desarrollo: |
          $$
          H(0) = 0
          $$

          $$
          H'(x) = e^{x^{2}} \;\Longrightarrow\; H'(0) = 1
          $$

          $$
          H''(x) = 2x\,e^{x^{2}} \;\Longrightarrow\; H''(0) = 0
          $$

          $$
          H'''(x) = 2e^{x^{2}}+2x\cdot2x\,e^{x^{2}}
          = \left(2+4x^{2}\right)e^{x^{2}}
          \;\Longrightarrow\; H'''(0) = 2
          $$

          $$
          \text{coeficiente de }x^{3} = \frac{H'''(0)}{3!} = \frac26
          = \frac13
          $$

          $$
          P_3(x) = x+\frac{x^{3}}{3}
          $$
        veredicto: |
          El coeficiente de $x^{2}$ es 0 porque $H$ es **impar**: la integral de
          una función par entre 0 y $x$ lo es. Un polinomio de Maclaurin de una
          función impar solo tiene potencias impares.

      - tipo: justificar
        pregunta: |
          Ordena el método. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **El polinomio de Maclaurin** de orden $n$ es
              $P_n(x) = \sum_{k=0}^{n}\frac{g^{(k)}(0)}{k!}x^{k}$: solo necesita
              derivadas en 0.
          - texto: |
              **El teorema fundamental** da la primera gratis: si
              $g(x) = \int_0^{x}h$, entonces $g'(x) = h(x)$.
          - texto: |
              Las siguientes salen derivando el propio integrando, no la
              integral. Y el término independiente sale de que
              $\int_0^{0} = 0$.
          - texto: |
              **5.7:** $f(0)=3$ y $f'(0)=\frac12$, luego $p(x) = 3+\frac x2$.
          - texto: |
              **5.8:** $H(0)=0$, $H'(0)=1$, $H''(0)=0$, $H'''(0)=2$, luego
              $P_3(x) = x+\frac{x^{3}}{3}$.
          - texto: |
              Para el 5.8 conviene calcular primero
              $\int e^{t^{2}}dt$ y luego derivarla tres veces.
            trampa: true
            mensaje: |
              $e^{t^{2}}$ **no tiene primitiva elemental**: es el ejemplo clásico
              —la función error—. Intentar integrarla es entrar en un callejón
              sin salida. Y no hace falta: el teorema fundamental permite
              derivar sin haber integrado nunca.
        veredicto: |
          Los dos apartados enseñan lo mismo desde ángulos distintos: el 5.7 con
          una primitiva difícil, el 5.8 con una que directamente no existe.

    resolucion: |
      **Datos.** Dos funciones definidas por integrales, y sus polinomios de
      Maclaurin de grados uno y tres.

      ### 1 · Por qué no hace falta integrar

      El polinomio de Maclaurin de orden $n$ de $g$ es

      $$
      P_n(x) = \sum_{k=0}^{n}\frac{g^{(k)}(0)}{k!}\,x^{k}
      $$

      Solo pide **derivadas evaluadas en 0**. Y el teorema fundamental regala la
      primera: si $g(x) = \int_0^{x} h(t)\,dt$, entonces $g'(x) = h(x)$. Las
      demás salen derivando $h$, que es una función corriente.

      La primitiva no interviene en ningún paso. Eso es lo que hace viable el
      5.8, donde $e^{t^{2}}$ **no tiene primitiva elemental**.

      ### 2 · Ejercicio 5.7

      $$
      f(x) = 3+\int_0^{x}\frac{1+\mathrm{sen}\,t}{2+t^{2}}\,dt
      $$

      **Término independiente.** En $x=0$ la integral se anula:

      $$
      f(0) = 3+0 = 3
      $$

      **Coeficiente lineal.** Por el teorema fundamental el integrando **es** la
      derivada:

      $$
      f'(x) = \frac{1+\mathrm{sen}\,x}{2+x^{2}}
      \;\Longrightarrow\;
      f'(0) = \frac{1+0}{2+0} = \frac12
      $$

      $$
      \boxed{p(x) = 3+\frac{x}{2}}
      $$

      ### 3 · Ejercicio 5.8

      $$
      H(x) = \int_0^{x} e^{t^{2}}\,dt
      $$

      $$
      H(0) = 0
      $$

      $$
      H'(x) = e^{x^{2}}
      \;\Longrightarrow\; H'(0) = e^{0} = 1
      $$

      $$
      H''(x) = 2x\,e^{x^{2}}
      \;\Longrightarrow\; H''(0) = 0
      $$

      $$
      H'''(x) = 2e^{x^{2}}+2x\left(2x\,e^{x^{2}}\right)
      = \left(2+4x^{2}\right)e^{x^{2}}
      \;\Longrightarrow\; H'''(0) = 2
      $$

      Montando el polinomio:

      $$
      P_3(x) = 0+\frac{1}{1!}x+\frac{0}{2!}x^{2}+\frac{2}{3!}x^{3}
      $$

      $$
      \boxed{P_3(x) = x+\frac{x^{3}}{3}}
      $$

      ### 4 · Comprobación

      **Por la serie del exponencial**, que es una vía completamente
      independiente:

      $$
      e^{t^{2}} = 1+t^{2}+\frac{t^{4}}{2}+\cdots
      $$

      e integrando término a término entre 0 y $x$:

      $$
      H(x) = x+\frac{x^{3}}{3}+\frac{x^{5}}{10}+\cdots
      $$

      Los términos hasta grado 3 son exactamente $x+\frac{x^{3}}{3}$ ✔

      **Por paridad.** $e^{t^{2}}$ es **par**, así que su función integral desde
      0 es **impar**. Un polinomio de Maclaurin de una función impar solo puede
      tener potencias impares — y en efecto los coeficientes de $x^{0}$ y
      $x^{2}$ salieron 0 ✔

      **Numéricamente**, en $x = 0{,}3$: el polinomio da $0{,}309$, y la
      integral real vale $0{,}30913\ldots$ ✔

  - id: derivar-sin-integrar
    titulo: Seis derivadas sin calcular ninguna integral
    fuente: >-
      Ejercicio 5.9 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Sin calcular las integrales, calcular las derivadas de las siguientes
      funciones:

      **(a)** $H(x) = \displaystyle\int_1^{x^{3}} t^{2}\,dt$ ·
      **(b)** $H(x) = \displaystyle\int_0^{x^{2}}\sqrt{1+t^{2}}\,dt$ ·
      **(c)** $H(x) = \displaystyle\int_0^{x^{2}} e^{t^{2}}\,dt$

      **(d)** $H(x) = \displaystyle\int_1^{x^{4}}\sec t\,dt$ ·
      **(e)** $H(x) = \displaystyle\int_1^{\mathrm{sen}\,x} e^{t}\,dt$ ·
      **(f)** $H(x) = \displaystyle\int_{x^{2}}^{x^{3}} t\,dt$
    pide: Calcular las seis derivadas.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué fórmula hay que usar cuando **los dos** límites dependen de $x$?
        opciones:
          - texto: >-
              $\dfrac{d}{dx}\displaystyle\int_{u(x)}^{v(x)} f
              = f\big(v(x)\big)v'(x)-f\big(u(x)\big)u'(x)$
            correcta: true
            mensaje: |
              Esa es. Sale de partir la integral en un punto fijo $c$:
              $\int_u^{v} = \int_c^{v}-\int_c^{u}$, y aplicar la regla de la
              cadena a cada trozo. El signo menos del segundo término viene de
              esa resta.
          - texto: >-
              $\dfrac{d}{dx}\displaystyle\int_{u}^{v} f
              = f\big(v(x)\big)-f\big(u(x)\big)$
            mensaje: |
              Faltan las derivadas de los límites. Esa fórmula solo vale si
              $u$ y $v$ son la propia $x$, con derivada 1.
          - texto: >-
              $\dfrac{d}{dx}\displaystyle\int_{u}^{v} f
              = f\big(v(x)\big)v'(x)+f\big(u(x)\big)u'(x)$
            mensaje: |
              El segundo término va **restando**. Con el signo cambiado, el
              apartado (f) daría $3x^{5}+2x^{3}$ en vez de $3x^{5}-2x^{3}$.
          - texto: >-
              Hay que calcular la integral primero
            mensaje: |
              El enunciado lo prohíbe expresamente, y en (c) sería imposible:
              $e^{t^{2}}$ no tiene primitiva elemental.

      - tipo: calcular
        titulo: El apartado (a)
        pregunta: |
          Para $H(x) = \int_1^{x^{3}} t^{2}dt$, ¿cuánto vale $H'(2)$?
        respuesta:
          tipo: numero
          valor: '768'
          tolerancia: 0.5
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              4 es $x^{2}$ en $x=2$: has sustituido el integrando por $x$ en vez
              de por el **límite superior**, $x^{3}$, y además has olvidado la
              derivada de ese límite.
          - valor: '64'
            mensaje: |
              64 es $\left(x^{3}\right)^{2} = x^{6}$ en $x=2$: correcto hasta
              ahí, pero falta multiplicar por $\frac{d}{dx}x^{3} = 3x^{2}$.
          - valor: '256'
            mensaje: |
              256 es $x^{8}$ sin el 3. La derivada es $3x^{8}$, con el factor 3
              que viene de derivar $x^{3}$.
        pista: |
          $H'(x) = f\big(v(x)\big)\cdot v'(x)$ con $f(t)=t^{2}$ y $v(x)=x^{3}$.
        desarrollo: |
          $$
          H'(x) = \left(x^{3}\right)^{2}\cdot\frac{d}{dx}\left(x^{3}\right)
          = x^{6}\cdot3x^{2} = 3x^{8}
          $$

          $$
          H'(2) = 3\cdot2^{8} = 3\cdot256 = 768
          $$
        veredicto: |
          Se puede comprobar integrando de verdad:
          $H(x) = \left[\frac{t^{3}}{3}\right]_1^{x^{3}} = \frac{x^{9}}{3}
          -\frac13$, cuya derivada es $3x^{8}$ ✔

      - tipo: calcular
        titulo: El apartado (f), con los dos límites variables
        pregunta: |
          Para $H(x) = \int_{x^{2}}^{x^{3}} t\,dt$, ¿cuánto vale $H'(2)$?
        respuesta:
          tipo: numero
          valor: '80'
          tolerancia: 0.5
          formato: un número
        distractores:
          - valor: '112'
            mensaje: |
              112 es $3x^{5}+2x^{3}$ en $x=2$: has **sumado** los dos términos.
              El del límite inferior va restando.
          - valor: '96'
            mensaje: |
              96 es $3x^{5}$ solo. Falta restar la contribución del límite
              inferior, $2x^{3} = 16$.
          - valor: '4'
            mensaje: |
              4 es $x^{3}-x^{2}$ en $x=2$: has aplicado la fórmula sin las
              derivadas de los límites.
        pista: |
          $H'(x) = v(x)\cdot v'(x)-u(x)\cdot u'(x)$, con $f(t)=t$.
        desarrollo: |
          Con $f(t) = t$, $v(x) = x^{3}$ y $u(x) = x^{2}$:

          $$
          H'(x) = x^{3}\cdot3x^{2}-x^{2}\cdot2x = 3x^{5}-2x^{3}
          $$

          $$
          H'(2) = 3\cdot32-2\cdot8 = 96-16 = 80
          $$
        veredicto: |
          Comprobación directa:
          $H(x) = \frac{x^{6}}{2}-\frac{x^{4}}{2}$, y su derivada es
          $3x^{5}-2x^{3}$ ✔ Aquí sí se podía integrar, y por eso es el apartado
          bueno para verificar la fórmula.

      - tipo: justificar
        pregunta: |
          Ordena el método y sus seis resultados. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **La fórmula:**
              $\frac{d}{dx}\int_{u(x)}^{v(x)} f
              = f(v)\,v'-f(u)\,u'$, que sale de partir la integral en un punto
              fijo y aplicar la regla de la cadena.
          - texto: |
              **(a)** $\left(x^{3}\right)^{2}\cdot3x^{2} = 3x^{8}$ ·
              **(b)** $\sqrt{1+\left(x^{2}\right)^{2}}\cdot2x
              = 2x\sqrt{1+x^{4}}$
          - texto: |
              **(c)** $e^{\left(x^{2}\right)^{2}}\cdot2x = 2x\,e^{x^{4}}$ ·
              **(d)** $\sec\!\left(x^{4}\right)\cdot4x^{3}
              = \dfrac{4x^{3}}{\cos x^{4}}$
          - texto: |
              **(e)** $e^{\mathrm{sen}\,x}\cdot\cos x$, donde $\cos x$ es la
              derivada del límite superior.
          - texto: |
              **(f)** El único con los dos límites variables:
              $x^{3}\cdot3x^{2}-x^{2}\cdot2x = 3x^{5}-2x^{3}$.
          - texto: |
              En (b) y (c) el límite superior es el mismo, $x^{2}$, así que las
              dos derivadas se diferencian solo en el factor $2x$.
            trampa: true
            mensaje: |
              El factor $2x$ es **común** a las dos, justamente porque el límite
              superior es el mismo. Lo que las diferencia es el **integrando**
              evaluado en $x^{2}$: $\sqrt{1+x^{4}}$ frente a $e^{x^{4}}$. La
              frase invierte qué parte es la compartida.
        veredicto: |
          Cinco de los seis apartados son la misma cuenta con distinto
          integrando. El (f) es el que enseña algo nuevo, y por eso está el
          último.

    resolucion: |
      **Datos.** Seis funciones integrales con límites que dependen de $x$. Se
      pide derivarlas sin calcular las integrales.

      ### 1 · La herramienta

      La primera parte del teorema fundamental dice
      $\frac{d}{dx}\int_a^{x} f = f(x)$ cuando el límite superior es la propia
      $x$. Si es una función $v(x)$, se compone con la **regla de la cadena**; y
      si además el inferior es otra función $u(x)$, se parte la integral en un
      punto fijo $c$:

      $$
      \int_{u(x)}^{v(x)} f = \int_{c}^{v(x)} f-\int_{c}^{u(x)} f
      $$

      Derivando cada trozo:

      $$
      \boxed{\frac{d}{dx}\int_{u(x)}^{v(x)} f(t)\,dt
      = f\big(v(x)\big)\,v'(x)-f\big(u(x)\big)\,u'(x)}
      $$

      El **signo menos** del segundo término no es un convenio: viene de esa
      resta.

      ### 2 · Los cinco con un solo límite variable

      En todos, el inferior es constante y su término se anula.

      **(a)** $f(t)=t^{2}$, $v=x^{3}$:

      $$
      H'(x) = \left(x^{3}\right)^{2}\cdot3x^{2} = x^{6}\cdot3x^{2} = 3x^{8}
      $$

      **(b)** $f(t)=\sqrt{1+t^{2}}$, $v=x^{2}$:

      $$
      H'(x) = \sqrt{1+\left(x^{2}\right)^{2}}\cdot2x = 2x\sqrt{1+x^{4}}
      $$

      **(c)** $f(t)=e^{t^{2}}$, $v=x^{2}$:

      $$
      H'(x) = e^{\left(x^{2}\right)^{2}}\cdot2x = 2x\,e^{x^{4}}
      $$

      **(d)** $f(t)=\sec t$, $v=x^{4}$:

      $$
      H'(x) = \sec\!\left(x^{4}\right)\cdot4x^{3}
      = \frac{4x^{3}}{\cos\left(x^{4}\right)}
      $$

      **(e)** $f(t)=e^{t}$, $v=\mathrm{sen}\,x$:

      $$
      H'(x) = e^{\mathrm{sen}\,x}\cdot\cos x
      $$

      ### 3 · El sexto, con los dos límites variables

      **(f)** $f(t)=t$, $v=x^{3}$, $u=x^{2}$:

      $$
      H'(x) = x^{3}\cdot3x^{2}-x^{2}\cdot2x = 3x^{5}-2x^{3}
      $$

      ### 4 · El error que persigue este ejercicio

      Es siempre el mismo: escribir $H'(x) = f(x)$ olvidando que el límite no es
      $x$ sino una función de $x$. En (a) eso daría $x^{2}$ en vez de $3x^{8}$.

      Dos cosas hay que hacer, y las dos:

      1. **Sustituir** el límite en el integrando, no la $x$.
      2. **Multiplicar** por la derivada de ese límite.

      ### 5 · Comprobación

      Dos de los seis se pueden integrar de verdad, y sirven para validar la
      fórmula:

      **(a)**

      $$
      H(x) = \left[\frac{t^{3}}{3}\right]_1^{x^{3}}
      = \frac{x^{9}}{3}-\frac13
      \;\Longrightarrow\;
      H'(x) = \frac{9x^{8}}{3} = 3x^{8} \quad\checkmark
      $$

      **(f)**

      $$
      H(x) = \left[\frac{t^{2}}{2}\right]_{x^{2}}^{x^{3}}
      = \frac{x^{6}}{2}-\frac{x^{4}}{2}
      \;\Longrightarrow\;
      H'(x) = 3x^{5}-2x^{3} \quad\checkmark
      $$

      Los otros cuatro no admiten esa comprobación —(c) directamente no tiene
      primitiva elemental—, pero comparten fórmula con estos dos.

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \text{(a)}\ & 3x^{8} & \text{(d)}\ & \frac{4x^{3}}{\cos x^{4}} \\
      \text{(b)}\ & 2x\sqrt{1+x^{4}} & \text{(e)}\ &
      e^{\mathrm{sen}\,x}\cos x \\
      \text{(c)}\ & 2x\,e^{x^{4}} & \text{(f)}\ & 3x^{5}-2x^{3}
      \end{aligned}}
      $$

  - id: impropias-primer-tipo
    titulo: Ocho impropias de primer tipo
    fuente: >-
      Ejercicio 5.10 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular las siguientes integrales impropias de *primer tipo*:

      **(a)** $\displaystyle\int_{-\infty}^{0} e^{x}dx$ ·
      **(b)** $\displaystyle\int_0^{\infty}\frac{1}{\sqrt{e^{x}}}dx$ ·
      **(c)** $\displaystyle\int_0^{\infty}xe^{-x}dx$ ·
      **(d)** $\displaystyle\int_{-\infty}^{\infty}\frac{1}{e^{x}+e^{-x}}dx$

      **(e)** $\displaystyle\int_{-\infty}^{\infty}\frac{1}{x^{2}+4}dx$ ·
      **(f)** $\displaystyle\int_0^{\infty}\frac{1}{\sqrt{x}(1+x)}dx$ ·
      **(g)** $\displaystyle\int_1^{\infty}x^{n}dx$ non $n \in \mathbb{Z}$ ·
      **(h)** $I = \displaystyle\int_{-\infty}^{\infty}e^{-a\left|x\right|}dx$,
      $a \in \mathbb{R}$
    pide: Calcular las ocho integrales impropias.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que hacer siempre antes de dar el resultado de una impropia?
        opciones:
          - texto: >-
              **Sustituir el infinito por un límite**: calcular
              $\int_a^{t}$ con $t$ finito y luego hacer $t\to\infty$
            correcta: true
            mensaje: |
              Eso es. «Evaluar en infinito» no es una operación: infinito no es
              un número. La impropia se **define** como ese límite, y si el
              límite no existe la integral diverge.
          - texto: Comprobar que el integrando tiende a 0
            mensaje: |
              Necesario pero no suficiente. $\frac1x$ tiende a 0 y
              $\int_1^{\infty}\frac{dx}{x}$ diverge igualmente. Es el mismo
              aviso que con las series.
          - texto: Comprobar que el integrando es positivo
            mensaje: |
              El signo no decide nada. Hay impropias convergentes con
              integrandos que cambian de signo.
          - texto: Aplicar Barrow directamente
            mensaje: |
              Barrow pide un intervalo **cerrado y acotado**. Aquí no lo hay, y
              por eso hace falta el límite.

      - tipo: calcular
        titulo: El apartado (b)
        pregunta: |
          ¿Cuánto vale $\int_0^{\infty}\frac{dx}{\sqrt{e^{x}}}$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es $\int_0^{\infty}e^{-x}dx$. Aquí el exponente es
              $-\frac x2$, y la primitiva lleva un factor $-2$, no $-1$.
          - valor: '0.5'
            mensaje: |
              $\frac12$ sale de multiplicar por $\frac12$ en vez de dividir. La
              primitiva de $e^{-x/2}$ es $-2e^{-x/2}$.
          - valor: '-2'
            mensaje: |
              Signo cambiado. $\left[-2e^{-x/2}\right]_0^{\infty}
              = 0-(-2) = 2$, positivo, como debe ser un área bajo una función
              positiva.
        pista: |
          $\frac{1}{\sqrt{e^{x}}} = e^{-x/2}$.
        desarrollo: |
          Primero se reescribe el integrando:

          $$
          \frac{1}{\sqrt{e^{x}}} = \left(e^{x}\right)^{-1/2} = e^{-x/2}
          $$

          Y se sustituye el infinito por un límite:

          $$
          \int_0^{\infty}e^{-x/2}dx
          = \lim_{t\to\infty}\left[-2e^{-x/2}\right]_0^{t}
          = \lim_{t\to\infty}\left(-2e^{-t/2}+2\right) = 2
          $$

          porque $e^{-t/2}\to0$.
        veredicto: |
          El factor $-2$ de la primitiva viene de dividir entre la derivada del
          exponente, que es $-\frac12$. Es el fallo más común del apartado.

      - tipo: calcular
        titulo: El apartado (e)
        pregunta: |
          ¿Cuánto vale $\int_{-\infty}^{\infty}\frac{dx}{x^{2}+4}$?
        respuesta:
          tipo: numero
          valor: '1.5708'
          tolerancia: 0.0005
          formato: en forma exacta, o un número con cuatro decimales
        distractores:
          - valor: '0.7853982'
            mensaje: |
              $\frac{\pi}{4}$ es $\int_0^{\infty}$, solo la mitad derecha. El
              enunciado integra desde $-\infty$, y por simetría sale el doble.
              *(Es también lo que dice la solución del boletín; ver la nota de
              la resolución.)*
          - valor: '3.1415927'
            mensaje: |
              $\pi$ saldría de olvidar el factor $\frac12$ de la primitiva:
              $\int\frac{dx}{x^{2}+a^{2}} = \frac1a\arctan\frac xa$, y aquí
              $a=2$.
          - valor: '0.3926991'
            mensaje: |
              $\frac{\pi}{8}$ es un cuarto del valor. Has dividido dos veces por
              2.
        pista: |
          $\int\frac{dx}{x^{2}+a^{2}} = \frac1a\arctan\frac xa$, con $a=2$.
        desarrollo: |
          $$
          \int\frac{dx}{x^{2}+4} = \frac12\arctan\frac{x}{2}
          $$

          Los **dos** extremos son infinitos, así que se parte en un punto
          cualquiera —el 0— y se toman dos límites:

          $$
          \lim_{s\to-\infty}\left[\frac12\arctan\frac x2\right]_{s}^{0}
          = 0-\frac12\left(-\frac{\pi}{2}\right) = \frac{\pi}{4}
          $$

          $$
          \lim_{t\to\infty}\left[\frac12\arctan\frac x2\right]_0^{t}
          = \frac12\cdot\frac{\pi}{2}-0 = \frac{\pi}{4}
          $$

          $$
          I = \frac{\pi}{4}+\frac{\pi}{4} = \frac{\pi}{2} \approx 1{,}5708
          $$
        veredicto: |
          El integrando es **par**, así que la integral es el doble de la mitad
          derecha. Esa simetría es la comprobación más rápida del apartado.

      - tipo: justificar
        pregunta: |
          Ordena el tratamiento de los ocho apartados. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              **La definición:** $\int_a^{\infty}f = \lim_{t\to\infty}
              \int_a^{t}f$, y si los dos extremos son infinitos se parte y se
              toman **dos** límites independientes.
          - texto: |
              **Los exponenciales, (a) (b) (c):** $1$, $2$ y $1$. El (c) pide
              partes, con $u=x$ y $dv=e^{-x}dx$.
          - texto: |
              **Los arcotangentes, (d) y (e):** el (d) sale con el cambio
              $u=e^{x}$, que lo convierte en $\int_0^{\infty}\frac{du}{1+u^{2}}
              = \frac{\pi}{2}$; el (e) vale $\frac{\pi}{2}$ por simetría.
          - texto: |
              **(f)** Con $u=\sqrt x$ se convierte en
              $2\int_0^{\infty}\frac{du}{1+u^{2}} = \pi$.
          - texto: |
              **(g)** $\int_1^{\infty}x^{n}dx = \frac{-1}{n+1}$ solo si $n<-1$;
              en caso contrario **diverge**. **(h)** Vale $\frac2a$ si $a>0$, y
              diverge si $a \le 0$.
          - texto: |
              En (g) y (h) basta con dar el resultado: el enunciado no pide
              discutir los valores del parámetro.
            trampa: true
            mensaje: |
              Cuando aparece un parámetro, **discutirlo es el ejercicio**. En (g)
              la integral converge solo para $n<-1$ y en (h) solo para $a>0$;
              dar una fórmula sin decir cuándo vale es dar una respuesta falsa
              para la mitad de los casos.
        veredicto: |
          Los apartados con parámetro son los que más puntos de COMP4 reparten:
          lo que se evalúa no es la primitiva, es la discusión.

    resolucion: |
      **Datos.** Ocho integrales con al menos un extremo infinito.

      ### 1 · La definición, que es toda la técnica

      $$
      \int_a^{\infty} f = \lim_{t\to\infty}\int_a^{t} f,
      \qquad
      \int_{-\infty}^{b} f = \lim_{s\to-\infty}\int_s^{b} f
      $$

      Y si los **dos** extremos son infinitos, se parte en un punto cualquiera y
      se toman **dos límites independientes**:

      $$
      \int_{-\infty}^{\infty} f = \lim_{s\to-\infty}\int_s^{0} f
      +\lim_{t\to\infty}\int_0^{t} f
      $$

      Tomarlos a la vez —haciendo $s=-t$— da el **valor principal de Cauchy**,
      que no es lo mismo y puede existir cuando la integral no.

      ### 2 · Los exponenciales

      **(a)**

      $$
      \int_{-\infty}^{0}e^{x}dx = \lim_{s\to-\infty}\left[e^{x}\right]_s^{0}
      = 1-0 = 1
      $$

      **(b)** Reescribiendo $\frac{1}{\sqrt{e^{x}}} = e^{-x/2}$:

      $$
      \lim_{t\to\infty}\left[-2e^{-x/2}\right]_0^{t} = 0+2 = 2
      $$

      **(c)** Por partes, con $u=x$ y $dv=e^{-x}dx$:

      $$
      \int xe^{-x}dx = -xe^{-x}-\int\left(-e^{-x}\right)dx
      = -xe^{-x}-e^{-x}
      $$

      $$
      \lim_{t\to\infty}\left[-(x+1)e^{-x}\right]_0^{t} = 0-(-1) = 1
      $$

      El límite es 0 porque **la exponencial gana al polinomio**: $te^{-t}\to0$.

      ### 3 · Los que esconden un arcotangente

      **(d)** Multiplicando arriba y abajo por $e^{x}$:

      $$
      \frac{1}{e^{x}+e^{-x}} = \frac{e^{x}}{e^{2x}+1}
      $$

      Con el cambio $u = e^{x}$, $du = e^{x}dx$, los límites $-\infty$ e
      $\infty$ pasan a $0$ e $\infty$:

      $$
      \int_0^{\infty}\frac{du}{1+u^{2}} = \left[\arctan u\right]_0^{\infty}
      = \frac{\pi}{2}
      $$

      **(e)** Con $\int\frac{dx}{x^{2}+a^{2}} = \frac1a\arctan\frac xa$ y $a=2$:

      $$
      \int_{-\infty}^{\infty}\frac{dx}{x^{2}+4}
      = \frac12\left[\arctan\frac x2\right]_{-\infty}^{\infty}
      = \frac12\left(\frac{\pi}{2}+\frac{\pi}{2}\right) = \frac{\pi}{2}
      $$

      > **Discrepancia con el boletín.** La solución publicada da $\frac{\pi}4$
      > para este apartado. $\frac{\pi}{4}$ es el valor de
      > $\int_0^{\infty}\frac{dx}{x^{2}+4}$, solo la mitad derecha; como el
      > integrando es **par** y el enunciado integra desde $-\infty$, el
      > resultado es el doble. Se puede confirmar numéricamente:
      > $\frac{\pi}{2} \approx 1{,}5708$, y una estimación de la integral por
      > cualquier método da ese número.

      **(f)** Con $u=\sqrt x$, o sea $x=u^{2}$ y $dx = 2u\,du$:

      $$
      \int_0^{\infty}\frac{2u\,du}{u\left(1+u^{2}\right)}
      = 2\int_0^{\infty}\frac{du}{1+u^{2}} = 2\cdot\frac{\pi}{2} = \pi
      $$

      ### 4 · Los dos con parámetro, que son el ejercicio de verdad

      **(g)** $\int_1^{\infty}x^{n}dx$, con $n \in \mathbb{Z}$.

      Si $n \neq -1$:

      $$
      \int_1^{t}x^{n}dx = \left[\frac{x^{n+1}}{n+1}\right]_1^{t}
      = \frac{t^{n+1}-1}{n+1}
      $$

      El límite depende del signo del exponente:

      | | $t^{n+1}$ cuando $t\to\infty$ | resultado |
      |---|---|---|
      | $n<-1$ | $\to0$ | $\dfrac{-1}{n+1}$, **converge** |
      | $n>-1$ | $\to\infty$ | **diverge** |
      | $n=-1$ | $\ln t \to\infty$ | **diverge** |

      $$
      \boxed{I = \frac{-1}{n+1}\ \text{si } n<-1;\ \text{diverge si } n\ge-1}
      $$

      Nótese que $\frac{-1}{n+1}$ es **positivo** cuando $n<-1$, que es lo que
      tiene que pasar con el área bajo una función positiva.

      **(h)** $\int_{-\infty}^{\infty}e^{-a\left|x\right|}dx$.

      El integrando es **par**, así que basta la mitad derecha por dos:

      $$
      I = 2\int_0^{\infty}e^{-ax}dx
      = 2\lim_{t\to\infty}\left[\frac{e^{-ax}}{-a}\right]_0^{t}
      $$

      - Si $a>0$: $e^{-at}\to0$ y $I = \frac{2}{a}$.
      - Si $a=0$: el integrando vale 1 y la integral **diverge**.
      - Si $a<0$: $e^{-ax}$ **crece**, y diverge también.

      $$
      \boxed{I = \frac{2}{a}\ \text{si } a>0;\ \text{diverge si } a\le0}
      $$

      **Discutir el parámetro no es un extra: es el ejercicio.** Dar la fórmula
      sin decir cuándo vale es dar una respuesta falsa para la mitad de los
      casos.

      ### 5 · Comprobación

      **Por comparación con la $p$-integral.** Se sabe que
      $\int_1^{\infty}\frac{dx}{x^{p}}$ converge si y solo si $p>1$. En (g),
      $x^{n} = \frac{1}{x^{-n}}$ con $p=-n$, y $p>1$ equivale a $n<-1$ ✔

      **Por simetría.** En (e) y (h) el integrando es par, luego la integral es
      el doble de la mitad derecha. Los dos resultados lo cumplen ✔

      **Numéricamente.** En (c),
      $\int_0^{10}xe^{-x}dx = 1-11e^{-10} \approx 0{,}9995$, muy cerca de 1 ✔

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \text{(a)}\ & 1 & \text{(e)}\ & \tfrac{\pi}{2} \\
      \text{(b)}\ & 2 & \text{(f)}\ & \pi \\
      \text{(c)}\ & 1 & \text{(g)}\ & \tfrac{-1}{n+1}\ (n<-1) \\
      \text{(d)}\ & \tfrac{\pi}{2} & \text{(h)}\ & \tfrac{2}{a}\ (a>0)
      \end{aligned}}
      $$

  - id: impropias-segundo-tipo
    titulo: Cuatro que divergen aunque Barrow diga otra cosa
    fuente: >-
      Ejercicio 5.11 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular las siguientes integrales impropias de *segundo tipo*:

      **(a)** $\displaystyle\int_{-1}^{1}\frac{dx}{x}$ ·
      **(b)** $\displaystyle\int_{-1}^{1}\frac{dx}{x^{2}}$ ·
      **(c)** $\displaystyle\int_{-1}^{2}\frac{dx}{x^{3}}$ ·
      **(d)** $\displaystyle\int_0^{5}\frac{dx}{(2-x)^{4}}$
    pide: Calcular las cuatro integrales impropias.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace impropias a estas cuatro, si los intervalos son finitos?
        opciones:
          - texto: >-
              El integrando **se va a infinito** en un punto **interior** al
              intervalo, y ese punto no se ve en los límites
            correcta: true
            mensaje: |
              Exacto, y ahí está el peligro. En (a), (b) y (c) el problema está
              en $x=0$; en (d), en $x=2$. Ninguno aparece escrito en los límites
              de integración, así que hay que **buscarlo** antes de integrar.
          - texto: Que el intervalo contiene números negativos
            mensaje: |
              Los negativos no molestan. $\int_{-1}^{1}x^{3}dx$ es perfectamente
              propia.
          - texto: Que el integrando cambia de signo
            mensaje: |
              En (b) y (d) el integrando es siempre positivo y aun así son
              impropias. Lo que las hace impropias es la asíntota.
          - texto: Que la primitiva no es elemental
            mensaje: |
              Las cuatro primitivas son inmediatas. El problema no es
              encontrarlas, es **usarlas donde no valen**.

      - tipo: calcular
        titulo: El apartado (c), su valor principal
        pregunta: |
          $\int_{-1}^{2}\frac{dx}{x^{3}}$ diverge. ¿Cuánto vale su valor
          principal de Cauchy?
        respuesta:
          tipo: numero
          valor: '0.375'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-0.375'
            mensaje: |
              Signo cambiado. La primitiva es $-\frac{1}{2x^{2}}$, y al
              evaluarla los dos $\frac{1}{2\varepsilon^{2}}$ se cancelan
              dejando $\frac12-\frac18$, positivo.
          - valor: '0.5'
            mensaje: |
              $\frac12$ es solo el trozo de la izquierda. Falta restar
              $\frac18$, que aporta el trozo entre $\varepsilon$ y 2.
          - valor: '0'
            mensaje: |
              0 es el valor principal de (a), donde el integrando es **impar** y
              los dos trozos se cancelan enteros. Aquí $\frac{1}{x^{3}}$ también
              es impar, pero el intervalo **no es simétrico**: llega hasta 2, no
              hasta 1.
        pista: |
          $VP = \lim_{\varepsilon\to0}\left(\int_{-1}^{-\varepsilon}
          +\int_{\varepsilon}^{2}\right)$, con los dos $\varepsilon$ **iguales**.
        desarrollo: |
          La primitiva es $-\frac{1}{2x^{2}}$.

          $$
          \int_{-1}^{-\varepsilon}\frac{dx}{x^{3}}
          = \left[-\frac{1}{2x^{2}}\right]_{-1}^{-\varepsilon}
          = -\frac{1}{2\varepsilon^{2}}+\frac12
          $$

          $$
          \int_{\varepsilon}^{2}\frac{dx}{x^{3}}
          = \left[-\frac{1}{2x^{2}}\right]_{\varepsilon}^{2}
          = -\frac18+\frac{1}{2\varepsilon^{2}}
          $$

          Sumando, los dos $\frac{1}{2\varepsilon^{2}}$ **se cancelan**:

          $$
          VP = \frac12-\frac18 = \frac38 = 0{,}375
          $$

          Pero por separado cada límite es infinito, así que la integral
          **diverge**.
        veredicto: |
          Esa cancelación es exactamente lo que distingue el valor principal de
          la integral: existe solo porque los dos infinitos se han hecho crecer
          **al mismo ritmo**.

      - tipo: calcular
        titulo: El apartado (d), el número falso
        pregunta: |
          Aplicando Barrow a ciegas en $\int_0^{5}\frac{dx}{(2-x)^{4}}$ sale un
          número. ¿Cuál? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '-0.0540'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0.0540123'
            mensaje: |
              Ese es el valor absoluto. Barrow a ciegas da un número
              **negativo**, y eso es justo lo interesante: el integrando
              $\frac{1}{(2-x)^{4}}$ es siempre positivo, así que un resultado
              negativo es imposible.
          - valor: '-0.0416667'
            mensaje: |
              $-\frac{1}{24}$ es solo el término del extremo $x=0$. Falta el de
              $x=5$, que aporta $-\frac{1}{81}$.
          - valor: '-0.0123457'
            mensaje: |
              $-\frac{1}{81}$ es solo el término del extremo $x=5$. Falta el de
              $x=0$.
        pista: |
          La primitiva es $\frac{1}{3(2-x)^{3}}$. Evalúala en 0 y en 5 sin
          mirar el 2.
        desarrollo: |
          $$
          \int\frac{dx}{(2-x)^{4}} = \frac{1}{3(2-x)^{3}}
          $$

          $$
          \left[\frac{1}{3(2-x)^{3}}\right]_0^{5}
          = \frac{1}{3(-3)^{3}}-\frac{1}{3\cdot2^{3}}
          = -\frac{1}{81}-\frac{1}{24}
          $$

          $$
          = -0{,}01235-0{,}04167 = -0{,}0540
          $$

          Y ahí está la alarma: sale **negativo**, cuando el integrando
          $\frac{1}{(2-x)^{4}}$ es siempre **positivo**. Un área bajo una
          función positiva no puede ser negativa.

          Ese solo hecho, sin ninguna otra comprobación, ya delata que Barrow no
          era aplicable. La integral **diverge**.
        veredicto: |
          Un resultado negativo para un área positiva es la alarma más barata
          que existe. Cuesta dos segundos comprobarla y salva el ejercicio.

      - tipo: justificar
        pregunta: |
          Ordena el tratamiento de las cuatro. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Buscar la asíntota primero.** En (a), (b) y (c) está en $x=0$;
              en (d), en $x=2$. Las cuatro están **dentro** del intervalo.
          - texto: |
              **Partir en ese punto** y tomar los dos límites **por separado**.
              Si alguno es infinito, la integral **diverge**.
          - texto: |
              **(a)** Diverge, pero $VP = 0$, porque
              $\frac1x$ es impar y el intervalo simétrico.
              **(b)** Diverge, y ni siquiera hay $VP$ finito: los dos trozos son
              $+\infty$ y no se cancelan.
          - texto: |
              **(c)** Diverge, pero $VP = \frac38$.
              **(d)** Diverge, y con exponente par tampoco hay cancelación.
          - texto: |
              **La lección:** aplicar Barrow a ciegas da números concretos y
              falsos —0 en (a), $-2$ en (b), $-0{,}054$ en (d)— que no delatan
              nada si no se piensa.
          - texto: |
              Como el valor principal existe en (a) y en (c), esas dos
              integrales convergen a ese valor.
            trampa: true
            mensaje: |
              El valor principal **no es** la integral. Es un promedio simétrico
              que existe porque se ha forzado a los dos infinitos a crecer al
              mismo ritmo; si se acercan a distinta velocidad sale cualquier
              cosa. La integral de (a) y (c) **diverge**, y eso es lo que hay
              que escribir.
        veredicto: |
          El boletín pone una nota expresa —«VP = Valor Principal de Cauchy»—
          precisamente porque es la confusión que este ejercicio persigue.

    resolucion: |
      **Datos.** Cuatro integrales sobre intervalos finitos cuyo integrando
      tiene una asíntota **dentro** del intervalo.

      ### 1 · Lo primero: encontrar el punto conflictivo

      Las impropias de segundo tipo son las peligrosas porque **no se ven**. El
      intervalo es finito, el integrando parece manejable, y nada en la notación
      avisa.

      | | integrando | asíntota | ¿dentro? |
      |---|---|---|---|
      | (a) | $\frac1x$ | $x=0$ | sí, $-1<0<1$ |
      | (b) | $\frac{1}{x^{2}}$ | $x=0$ | sí |
      | (c) | $\frac{1}{x^{3}}$ | $x=0$ | sí, $-1<0<2$ |
      | (d) | $\frac{1}{(2-x)^{4}}$ | $x=2$ | sí, $0<2<5$ |

      **Regla práctica:** antes de integrar, igualar el denominador a cero y
      mirar si la raíz cae en el intervalo.

      ### 2 · La definición

      Si la asíntota está en $c \in (a,b)$:

      $$
      \int_a^{b} f = \lim_{t\to c^{-}}\int_a^{t} f
      +\lim_{s\to c^{+}}\int_s^{b} f
      $$

      **Dos límites independientes.** Si cualquiera de los dos es infinito, la
      integral **diverge** — y no hay más que discutir.

      ### 3 · Apartado (a)

      $$
      \int_{-1}^{t}\frac{dx}{x} = \ln\left|t\right|-0 \xrightarrow[t\to0^{-}]{}
      -\infty
      $$

      **Diverge.**

      Su valor principal, en cambio, sí existe:

      $$
      VP = \lim_{\varepsilon\to0}\left(\ln\varepsilon-\ln1
      +\ln1-\ln\varepsilon\right) = 0
      $$

      Los dos infinitos se cancelan porque $\frac1x$ es **impar** y el intervalo
      es **simétrico**.

      ### 4 · Apartado (b)

      $$
      \int_{s}^{1}\frac{dx}{x^{2}} = \left[-\frac1x\right]_s^{1}
      = -1+\frac1s \xrightarrow[s\to0^{+}]{} +\infty
      $$

      **Diverge**, y aquí **ni siquiera hay valor principal finito**: los dos
      trozos tienden a $+\infty$ —el integrando es par y positivo— y sumar dos
      infinitos del mismo signo no cancela nada.

      Barrow a ciegas habría dado

      $$
      \left[-\frac1x\right]_{-1}^{1} = -1-1 = -2
      $$

      un número **negativo** para el área bajo una función **siempre positiva**.
      Absurdo, y la señal más barata de que algo iba mal.

      ### 5 · Apartado (c)

      $$
      \int_{-1}^{t}\frac{dx}{x^{3}}
      = \left[-\frac{1}{2x^{2}}\right]_{-1}^{t}
      = -\frac{1}{2t^{2}}+\frac12 \xrightarrow[t\to0^{-}]{} -\infty
      $$

      **Diverge.** Su valor principal:

      $$
      VP = \lim_{\varepsilon\to0}\left[
      \left(-\frac{1}{2\varepsilon^{2}}+\frac12\right)
      +\left(-\frac18+\frac{1}{2\varepsilon^{2}}\right)\right]
      = \frac12-\frac18 = \frac38
      $$

      Aquí sí cancelan, porque el integrando es impar; pero el intervalo **no**
      es simétrico, así que el resto no es 0 sino $\frac38$.

      ### 6 · Apartado (d)

      $$
      \int_0^{t}\frac{dx}{(2-x)^{4}}
      = \left[\frac{1}{3(2-x)^{3}}\right]_0^{t}
      = \frac{1}{3(2-t)^{3}}-\frac{1}{24}
      \xrightarrow[t\to2^{-}]{} +\infty
      $$

      **Diverge**, y con exponente par no hay cancelación posible: los dos
      trozos son $+\infty$.

      Barrow a ciegas habría dado

      $$
      \frac{1}{3(-3)^{3}}-\frac{1}{3\cdot8}
      = -\frac{1}{81}-\frac{1}{24} \approx -0{,}054
      $$

      otra vez **negativo** para un integrando positivo.

      ### 7 · Por qué el valor principal no es la integral

      $$
      VP = \lim_{\varepsilon\to0}\left(\int_a^{c-\varepsilon}
      +\int_{c+\varepsilon}^{b}\right)
      $$

      Con **el mismo** $\varepsilon$ a los dos lados. Esa simetría forzada es lo
      que produce la cancelación. Si los dos lados se acercan a distinta
      velocidad —por ejemplo $\varepsilon$ y $2\varepsilon$— el resultado
      cambia, y un número que depende de cómo te acercas no es el valor de nada.

      Por eso la respuesta correcta a estos cuatro apartados es **«diverge»**, y
      el $VP$ es información adicional.

      ### 8 · Comprobación

      **Por el criterio de la $p$-integral.** Cerca de una asíntota,
      $\int_0 \frac{dx}{x^{p}}$ converge si y solo si $p<1$. Aquí los exponentes
      son 1, 2, 3 y 4: **todos $\ge1$**, luego las cuatro divergen ✔ Sin hacer
      ninguna cuenta.

      **Por el signo.** En (b) y (d) el integrando es positivo y Barrow a ciegas
      daba negativo ✔ Contradicción, luego Barrow no era aplicable.

      ### Resultado

      $$
      \boxed{
      \begin{aligned}
      \text{(a)}\ & \text{divergente, } VP = 0 \\
      \text{(b)}\ & \text{divergente} \\
      \text{(c)}\ & \text{divergente, } VP = \tfrac38 \\
      \text{(d)}\ & \text{divergente}
      \end{aligned}}
      $$

  - id: area-y-volumen-exponencial
    titulo: El área y el volumen bajo una exponencial
    fuente: >-
      Ejercicio 5.12 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Sea $D$ el dominio delimitado por las condiciones $y = e^{x}$,
      $1 \le x \le 2$.

      **(a)** Calcular el área del dominio $D$.

      **(b)** Calcular el volumen generado al girar el dominio $D$ alrededor del
      eje $OX$.
    pide: Calcular el área y el volumen de revolución.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado no dice cuál es la frontera inferior de $D$. ¿Cuál es?
        opciones:
          - texto: >-
              El **eje $OX$**: cuando solo se da una curva y una banda de $x$,
              el dominio es el que queda entre la curva y el eje
            correcta: true
            mensaje: |
              Es el convenio estándar, y aquí funciona porque $e^{x}>0$ en todo
              el intervalo: la curva va por encima del eje y encierra una región
              acotada por las dos verticales $x=1$ y $x=2$.
          - texto: La recta $y=1$
            mensaje: |
              $y=1$ sería el valor de $e^{x}$ en $x=0$, fuera del intervalo. No
              hay nada en el enunciado que la introduzca.
          - texto: >-
              No hay frontera inferior: el dominio es infinito
            mensaje: |
              Si no hubiera frontera inferior el área sería infinita y el
              ejercicio no tendría respuesta. El eje $OX$ la cierra.
          - texto: La propia curva, tomada dos veces
            mensaje: |
              Una curva sola no encierra nada. Hacen falta cuatro fronteras: la
              curva, el eje y las dos verticales.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área de $D$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '4.6708'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '7.3891'
            mensaje: |
              $e^{2} \approx 7{,}389$ es solo el primer término. Barrow exige
              restar el valor en el extremo inferior, $e^{1}$.
          - valor: '10.1073'
            mensaje: |
              $e^{2}+e \approx 10{,}107$: has **sumado** en vez de restar.
          - valor: '2.7183'
            mensaje: |
              $e \approx 2{,}718$ es el valor de la función en $x=1$, no el
              área.
        pista: |
          $A = \int_1^{2}e^{x}dx$, y la primitiva de $e^{x}$ es ella misma.
        desarrollo: |
          $$
          A = \int_1^{2}e^{x}dx = \left[e^{x}\right]_1^{2} = e^{2}-e
          $$

          $$
          A \approx 7{,}3891-2{,}7183 = 4{,}6708
          $$
        veredicto: |
          Comprobación rápida: la región está entre las alturas $e \approx 2{,}7$
          y $e^{2} \approx 7{,}4$ sobre una base de longitud 1, así que el área
          tiene que caer entre 2,7 y 7,4 ✔

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen generado al girar $D$ alrededor de $OX$?
        respuesta:
          tipo: numero
          valor: '74.1559'
          tolerancia: 0.005
          formato: en forma exacta, o un número con cuatro decimales
        distractores:
          - valor: '148.3132'
            mensaje: |
              Has olvidado el $\frac12$ que aparece al integrar $e^{2x}$: su
              primitiva es $\frac{e^{2x}}{2}$, no $e^{2x}$.
          - valor: '68.4791'
            mensaje: |
              $\pi\left(e^{2}-e\right)^{2}$ no es el volumen. El cuadrado va
              **dentro** de la integral, aplicado al radio en cada $x$; elevar
              el área al cuadrado es otra cosa.
          - valor: '14.6746'
            mensaje: |
              $\pi\left(e^{2}-e\right)$ es multiplicar el área por $\pi$. Falta
              el cuadrado del radio dentro de la integral.
        pista: |
          $V = \pi\int_1^{2}\left(e^{x}\right)^{2}dx$, y
          $\left(e^{x}\right)^{2} = e^{2x}$.
        desarrollo: |
          $$
          V = \pi\int_1^{2}\left(e^{x}\right)^{2}dx = \pi\int_1^{2}e^{2x}dx
          $$

          $$
          = \pi\left[\frac{e^{2x}}{2}\right]_1^{2}
          = \frac{\pi}{2}\left(e^{4}-e^{2}\right)
          $$

          $$
          \approx \frac{\pi}{2}\left(54{,}598-7{,}389\right)
          = \frac{\pi}{2}\cdot47{,}2091 \approx 74{,}1559
          $$
        veredicto: |
          El $\frac12$ sale de la derivada del exponente. Es el mismo cuidado que
          en cualquier exponencial compuesta, y aquí cambia el resultado a la
          mitad.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Identificar el dominio:** la curva $y=e^{x}$ por arriba, el eje
              $OX$ por abajo, y las verticales $x=1$ y $x=2$ a los lados. Es
              legítimo porque $e^{x}>0$ en el intervalo.
          - texto: |
              **(a)** $A = \int_1^{2}e^{x}dx = e^{2}-e \approx 4{,}67$.
          - texto: |
              **(b)** Al girar alrededor de $OX$ se generan **discos** de radio
              $f(x)$, y su volumen es
              $V = \pi\int_a^{b}f(x)^{2}dx$.
          - texto: |
              $V = \pi\int_1^{2}e^{2x}dx
              = \frac{\pi}{2}\left(e^{4}-e^{2}\right) \approx 74{,}16$.
          - texto: |
              **Comprobación:** el sólido está entre dos cilindros, uno de radio
              $e$ y otro de radio $e^{2}$, los dos de altura 1; su volumen tiene
              que caer entre $\pi e^{2} \approx 23$ y
              $\pi e^{4} \approx 172$ ✔
          - texto: |
              Como el área ya está calculada, el volumen se obtiene
              multiplicándola por $2\pi$ veces el radio medio.
            trampa: true
            mensaje: |
              Ese es el teorema de Pappus, y necesita el **centroide**, no un
              «radio medio» inventado. Aquí el radio varía con $x$, y elevarlo al
              cuadrado dentro de la integral no es lo mismo que operar con el
              área ya calculada. La fórmula de discos hay que aplicarla entera.
        veredicto: |
          Área y volumen no son proporcionales, y ese es todo el contenido del
          ejercicio: el cuadrado del radio rompe cualquier atajo.

    resolucion: |
      **Datos.** $y = e^{x}$ con $1 \le x \le 2$.

      ### 1 · Qué región es $D$

      El enunciado da una curva y una banda de valores de $x$. El convenio, y lo
      único que produce una región acotada, es tomar el dominio entre la curva y
      el **eje $OX$**:

      $$
      D = \left\{(x,y): 1\le x\le2,\ 0\le y\le e^{x}\right\}
      $$

      Es legítimo porque $e^{x}>0$ en todo el intervalo: la curva no cruza el
      eje y no hay que partir nada.

      ### 2 · Apartado (a): el área

      $$
      A = \int_1^{2}e^{x}\,dx = \left[e^{x}\right]_1^{2} = e^{2}-e
      $$

      $$
      \boxed{A = e^{2}-e \approx 4{,}6708}
      $$

      ### 3 · Apartado (b): el volumen

      Al girar alrededor de $OX$, cada sección perpendicular al eje es un
      **disco** de radio $f(x)$ y área $\pi f(x)^{2}$. Sumándolos:

      $$
      V = \pi\int_a^{b}f(x)^{2}\,dx
      $$

      Aquí:

      $$
      V = \pi\int_1^{2}\left(e^{x}\right)^{2}dx = \pi\int_1^{2}e^{2x}dx
      = \pi\left[\frac{e^{2x}}{2}\right]_1^{2}
      $$

      $$
      \boxed{V = \frac{\pi}{2}\left(e^{4}-e^{2}\right) \approx 74{,}156}
      $$

      **El $\frac12$** viene de la derivada del exponente: la primitiva de
      $e^{2x}$ es $\frac{e^{2x}}{2}$. Olvidarlo duplica el resultado, y es el
      fallo más frecuente del apartado.

      ### 4 · Lo que enseña el cuadrado

      El radio se eleva al cuadrado **dentro** de la integral. Eso significa que
      no hay ninguna relación sencilla entre el área y el volumen: no se puede
      calcular $A$ y luego «multiplicar por algo».

      Aquí se nota mucho porque la exponencial crece rápido: el radio se
      multiplica por $e \approx 2{,}7$ entre los extremos, pero el radio **al
      cuadrado** se multiplica por $e^{2} \approx 7{,}4$.

      ### 5 · Comprobación

      **Del área, por acotación.** La función va de $e \approx 2{,}72$ a
      $e^{2} \approx 7{,}39$ sobre una base de longitud 1:

      $$
      2{,}72 < 4{,}67 < 7{,}39 \quad\checkmark
      $$

      **Del volumen, por acotación entre cilindros.** El sólido contiene el
      cilindro de radio $e$ y altura 1, y está contenido en el de radio $e^{2}$:

      $$
      \pi e^{2} \approx 23{,}2
      \quad<\quad 74{,}16 \quad<\quad
      \pi e^{4} \approx 171{,}5 \quad\checkmark
      $$

      **Del volumen, por el valor medio.** El radio cuadrático medio es
      $\sqrt{\frac{e^{4}-e^{2}}{2}} \approx 4{,}86$, y
      $\pi\cdot4{,}86^{2}\cdot1 \approx 74{,}2$ ✔

  - id: area-entre-parabola-y-dos-tangentes
    titulo: Una parábola y sus dos tangentes
    fuente: >-
      Ejercicio 5.13 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular el área del dominio $D$ delimitado por la gráfica de la función
      $y = x^{2}+2x+2$, la recta tangente que pasa por el mínimo de la función
      $y$ y la recta tangente a la misma de pendiente 6.
    pide: Calcular el área del dominio $D$.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué hay que partir la integral en dos trozos?
        opciones:
          - texto: >-
              Porque la frontera **inferior** cambia de recta en el punto donde
              se cortan las dos tangentes
            correcta: true
            mensaje: |
              Exacto. La parábola es siempre la frontera de arriba, pero por
              debajo manda primero una tangente y luego la otra. El punto de
              corte de las dos rectas es la costura.
          - texto: Porque la parábola cambia de signo
            mensaje: |
              $x^{2}+2x+2 = (x+1)^{2}+1 \ge 1$: nunca cruza el eje. El signo no
              interviene.
          - texto: Porque las tangentes son de distinta pendiente
            mensaje: |
              Que sean distintas es lo que permite que se corten, pero lo que
              obliga a partir es **dónde** se cortan.
          - texto: Porque hay que integrar respecto de $y$ en un trozo
            mensaje: |
              Todo el ejercicio se integra respecto de $x$: las tres fronteras
              son funciones de $x$.

      - tipo: calcular
        titulo: Las dos tangentes
        pregunta: |
          La tangente de pendiente 6 toca la parábola en un punto. ¿Cuál es su
          abscisa?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '6'
            mensaje: |
              6 es la pendiente, no el punto. Hay que resolver $y'(x) = 6$, o sea
              $2x+2 = 6$.
          - valor: '3'
            mensaje: |
              3 saldría de $2x = 6$: te has dejado el $+2$ de la derivada.
              $y' = 2x+2$.
          - valor: '-1'
            mensaje: |
              $-1$ es la abscisa del **mínimo**, donde la tangente tiene
              pendiente 0. La otra tangente es la de pendiente 6.
        pista: |
          $y' = 2x+2$. Iguala a 6.
        desarrollo: |
          **La tangente en el mínimo.** El mínimo está donde $y' = 0$:

          $$
          2x+2 = 0 \;\Longrightarrow\; x = -1,\quad y = 1-2+2 = 1
          $$

          Como la pendiente es 0, esa tangente es la **horizontal**
          $y = 1$.

          **La tangente de pendiente 6:**

          $$
          2x+2 = 6 \;\Longrightarrow\; x = 2,\quad y = 4+4+2 = 10
          $$

          $$
          y = 10+6(x-2) = 6x-2
          $$
        veredicto: |
          Escribir la parábola como $(x+1)^{2}+1$ da el mínimo de un vistazo, sin
          derivar: vértice en $(-1,1)$.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área de $D$?
        respuesta:
          tipo: numero
          valor: '2.25'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1.125'
            mensaje: |
              $\frac98$ es solo **uno** de los dos trozos. Los dos valen lo
              mismo, así que hay que sumarlos.
          - valor: '4.5'
            mensaje: |
              $\frac92$ es el doble del resultado: has contado cada trozo dos
              veces, o has integrado hasta el punto equivocado.
          - valor: '9'
            mensaje: |
              9 sale de olvidar el $\frac13$ que aparece al integrar un
              cuadrado: $\int(x+1)^{2}dx = \frac{(x+1)^{3}}{3}$.
        pista: |
          Las dos tangentes se cortan en $x = \frac12$. Parte ahí.
        desarrollo: |
          **Dónde se cortan las tangentes:**

          $$
          1 = 6x-2 \;\Longrightarrow\; x = \frac12
          $$

          **Primer trozo**, de $-1$ a $\frac12$, con $y=1$ por debajo:

          $$
          \int_{-1}^{1/2}\left(x^{2}+2x+2-1\right)dx
          = \int_{-1}^{1/2}(x+1)^{2}dx
          = \left[\frac{(x+1)^{3}}{3}\right]_{-1}^{1/2}
          $$

          $$
          = \frac{(3/2)^{3}}{3}-0 = \frac{27/8}{3} = \frac98
          $$

          **Segundo trozo**, de $\frac12$ a 2, con $y=6x-2$ por debajo:

          $$
          x^{2}+2x+2-(6x-2) = x^{2}-4x+4 = (x-2)^{2}
          $$

          $$
          \int_{1/2}^{2}(x-2)^{2}dx = \left[\frac{(x-2)^{3}}{3}\right]_{1/2}^{2}
          = 0-\frac{(-3/2)^{3}}{3} = \frac98
          $$

          $$
          A = \frac98+\frac98 = \frac94 = 2{,}25
          $$
        veredicto: |
          Que los dos integrandos salgan cuadrados perfectos no es casualidad:
          **la diferencia entre una parábola y su tangente es siempre el
          cuadrado de la distancia al punto de tangencia**.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Las dos tangentes.** En el mínimo $(-1,1)$ la pendiente es 0, así
              que la tangente es $y=1$. La de pendiente 6 toca en $(2,10)$ y es
              $y = 6x-2$.
          - texto: |
              **Se cortan** en $1 = 6x-2$, es decir $x = \frac12$: ahí cambia la
              frontera inferior.
          - texto: |
              **La parábola está siempre por encima** de sus tangentes, porque es
              convexa ($y''=2>0$). Así que ella es el techo en los dos trozos.
          - texto: |
              Trozo izquierdo: $\int_{-1}^{1/2}(x+1)^{2}dx = \frac98$. Trozo
              derecho: $\int_{1/2}^{2}(x-2)^{2}dx = \frac98$.
          - texto: |
              $A = \frac98+\frac98 = \frac94$.
          - texto: |
              Los dos trozos valen lo mismo porque la figura es simétrica
              respecto del vértice de la parábola.
            trampa: true
            mensaje: |
              La figura **no** es simétrica respecto del vértice: los puntos de
              tangencia son $-1$ y $2$, y el corte está en $\frac12$, que es su
              punto medio — pero el vértice está en $-1$, en un extremo. Los dos
              trozos valen lo mismo por otra razón: los dos son
              $\int$ de un cuadrado perfecto sobre una base de longitud
              $\frac32$. La simetría es respecto de $x=\frac12$, no del vértice.
        veredicto: |
          La pieza trampa dice algo cierto —los dos trozos valen lo mismo— con
          una razón falsa. En un examen, la razón es la mitad de la nota.

    resolucion: |
      **Datos.** $y = x^{2}+2x+2$, su tangente en el mínimo y su tangente de
      pendiente 6.

      ### 1 · Las tres fronteras

      Completando cuadrados, $y = (x+1)^{2}+1$: parábola con vértice en
      $(-1,1)$, abierta hacia arriba.

      **Tangente en el mínimo.** En el vértice la pendiente es 0:

      $$
      y = 1
      $$

      **Tangente de pendiente 6.** Con $y' = 2x+2$:

      $$
      2x+2 = 6 \;\Longrightarrow\; x = 2,\quad y(2) = 10
      $$

      $$
      y-10 = 6(x-2) \;\Longrightarrow\; y = 6x-2
      $$

      ### 2 · Cómo encaja la figura

      Las dos rectas se cortan donde

      $$
      1 = 6x-2 \;\Longrightarrow\; x = \frac12
      $$

      Y la parábola está **siempre por encima** de cualquiera de sus tangentes,
      porque es convexa: $y'' = 2 > 0$.

      Así que el dominio tiene la parábola de techo y un suelo que cambia:

      | tramo | techo | suelo |
      |---|---|---|
      | $-1 \le x \le \frac12$ | $x^{2}+2x+2$ | $y=1$ |
      | $\frac12 \le x \le 2$ | $x^{2}+2x+2$ | $y=6x-2$ |

      Los extremos $-1$ y $2$ son los **puntos de tangencia**: ahí la parábola
      y su recta se tocan y la altura del recinto es 0.

      ### 3 · El cálculo

      **Trozo izquierdo:**

      $$
      x^{2}+2x+2-1 = x^{2}+2x+1 = (x+1)^{2}
      $$

      $$
      \int_{-1}^{1/2}(x+1)^{2}dx
      = \left[\frac{(x+1)^{3}}{3}\right]_{-1}^{1/2}
      = \frac{1}{3}\left(\frac32\right)^{3} = \frac{27}{24} = \frac98
      $$

      **Trozo derecho:**

      $$
      x^{2}+2x+2-(6x-2) = x^{2}-4x+4 = (x-2)^{2}
      $$

      $$
      \int_{1/2}^{2}(x-2)^{2}dx
      = \left[\frac{(x-2)^{3}}{3}\right]_{1/2}^{2}
      = 0-\frac{1}{3}\left(-\frac32\right)^{3} = \frac98
      $$

      $$
      \boxed{A = \frac98+\frac98 = \frac94 = 2{,}25}
      $$

      ### 4 · Por qué salen cuadrados perfectos

      No es casualidad. Si $t(x)$ es la tangente a una parábola
      $y = ax^{2}+bx+c$ en el punto $x_0$, entonces

      $$
      y(x)-t(x) = a\left(x-x_0\right)^{2}
      $$

      La diferencia entre una parábola y su tangente es **siempre** el cuadrado
      de la distancia al punto de tangencia, escalado por $a$. Con $a=1$ salen
      $(x+1)^{2}$ y $(x-2)^{2}$, exactamente lo que apareció.

      Saber esto ahorra el desarrollo entero: los integrandos se escriben
      directamente.

      ### 5 · Comprobación

      **Que los dos trozos son iguales.** Los dos son $\int$ de un cuadrado
      perfecto sobre una base de longitud

      $$
      \frac12-(-1) = \frac32
      \qquad\text{y}\qquad
      2-\frac12 = \frac32
      $$

      y en los dos el punto de tangencia está en el extremo. Misma integral,
      mismo valor ✔ **La figura es simétrica respecto de $x=\frac12$**, no
      respecto del vértice de la parábola.

      **Por acotación.** El recinto cabe en el rectángulo de base 3 —de $-1$ a
      2— y altura igual a la separación máxima, que se da en $x=\frac12$:

      $$
      \left(\frac12\right)^{2}+2\cdot\frac12+2-1 = \frac94 = 2{,}25
      $$

      Área del rectángulo: $3\cdot2{,}25 = 6{,}75$. Y $2{,}25 < 6{,}75$ ✔ El
      recinto ocupa exactamente un tercio, que es lo típico de las figuras
      parabólicas.

  - id: raiz-frente-a-valor-absoluto
    titulo: Una raíz contra un valor absoluto
    fuente: >-
      Ejercicio 5.14 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Sea $D$ el dominio delimitado por las condiciones $y = \sqrt{x/2}$,
      $y \ge \left|1-x\right|$ y $0 \le x \le 2$:

      **(a)** Calcular el área del dominio $D$.

      **(b)** Calcular el volumen generado al girar el dominio $D$ alrededor del
      eje OX.
    pide: Calcular el área y el volumen de revolución.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántos trozos hacen falta y por qué?
        opciones:
          - texto: >-
              **Dos**, porque el suelo $\left|1-x\right|$ cambia de fórmula en
              $x=1$
            correcta: true
            mensaje: |
              Eso es. El techo, $\sqrt{x/2}$, es una sola expresión en todo el
              recinto; el suelo vale $1-x$ hasta el vértice y $x-1$ después. La
              costura está en $x=1$.
          - texto: Uno, porque la raíz es siempre el techo
            mensaje: |
              El techo sí es único, pero el suelo no. Integrar
              $\left|1-x\right|$ como si fuera $1-x$ en todo el intervalo da un
              resultado equivocado.
          - texto: Tres, uno por cada corte con el eje
            mensaje: |
              El recinto no toca el eje $OX$ salvo en el vértice del valor
              absoluto, y ese es precisamente el punto de costura. Dos trozos
              bastan.
          - texto: Dos, porque la raíz cambia de signo
            mensaje: |
              $\sqrt{x/2} \ge 0$ siempre: una raíz cuadrada no cambia de signo.

      - tipo: calcular
        titulo: Los límites del recinto
        pregunta: |
          ¿En qué valor de $x$ empieza el dominio $D$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0'
            mensaje: |
              En $x=0$ la raíz vale 0 y $\left|1-x\right|$ vale 1: la condición
              $y \ge \left|1-x\right|$ no se cumple. El recinto empieza donde se
              cortan las dos curvas.
          - valor: '1'
            mensaje: |
              1 es el vértice del valor absoluto, el punto donde hay que partir
              la integral. Pero el recinto empieza antes.
          - valor: '2'
            mensaje: |
              2 es donde **acaba** el recinto: el otro corte entre la raíz y el
              valor absoluto.
        pista: |
          Resuelve $\sqrt{x/2} = \left|1-x\right|$ en cada rama.
        desarrollo: |
          **Rama $x<1$**, donde $\left|1-x\right| = 1-x$:

          $$
          \sqrt{\frac x2} = 1-x
          \;\Longrightarrow\;
          \frac x2 = 1-2x+x^{2}
          \;\Longrightarrow\;
          2x^{2}-5x+2 = 0
          $$

          $$
          x = \frac{5\pm\sqrt{25-16}}{4} = \frac{5\pm3}{4}
          \;\Longrightarrow\; x = 2 \ \text{ó}\ x = \frac12
          $$

          De estas, la única con $x<1$ es $x = \frac12$.

          **Rama $x>1$**, donde $\left|1-x\right| = x-1$: al elevar al cuadrado
          sale la misma ecuación, y la raíz válida es $x = 2$.

          $$
          D \text{ va de } x=\tfrac12 \text{ a } x=2
          $$
        veredicto: |
          Al elevar al cuadrado se pierde el signo, así que las dos ramas dan la
          misma ecuación y hay que **repartir** las raíces según dónde caen. Es
          el filtro de siempre.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área de $D$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '0.5417'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '1.1667'
            mensaje: |
              $\frac76$ es solo $\int_{1/2}^{2}\sqrt{x/2}\,dx$, el área bajo el
              techo. Falta restar lo que hay bajo el suelo
              $\left|1-x\right|$.
          - valor: '0.6667'
            mensaje: |
              $\frac23$ saldría de restar solo uno de los dos trozos del valor
              absoluto. Hay que restar los dos: $\frac18$ y $\frac12$.
          - valor: '0.0417'
            mensaje: |
              $\frac{1}{24}$ es $\frac{13}{24}$ dividido entre 13, o el resultado
              de perder el numerador. El área es $\frac{13}{24}$.
        pista: |
          $A = \int_{1/2}^{2}\sqrt{x/2}\,dx-\int_{1/2}^{1}(1-x)dx
          -\int_1^{2}(x-1)dx$.
        desarrollo: |
          **El techo:**

          $$
          \int\sqrt{\frac x2}\,dx = \frac{1}{\sqrt2}\cdot\frac23 x^{3/2}
          = \frac{2}{3\sqrt2}x^{3/2}
          $$

          $$
          \int_{1/2}^{2}\sqrt{\frac x2}\,dx
          = \frac{2}{3\sqrt2}\left(2^{3/2}-\left(\tfrac12\right)^{3/2}\right)
          = \frac43-\frac16 = \frac76
          $$

          **El suelo, en dos trozos:**

          $$
          \int_{1/2}^{1}(1-x)\,dx = \left[x-\frac{x^{2}}{2}\right]_{1/2}^{1}
          = \frac12-\frac38 = \frac18
          $$

          $$
          \int_1^{2}(x-1)\,dx = \frac12
          $$

          $$
          A = \frac76-\frac18-\frac12
          = \frac{28-3-12}{24} = \frac{13}{24} \approx 0{,}5417
          $$
        veredicto: |
          Los dos trozos del suelo son triángulos: uno de base $\frac12$ y altura
          $\frac12$ —área $\frac18$—, y otro de base 1 y altura 1 —área
          $\frac12$—. Se pueden calcular sin integrar.

      - tipo: justificar
        pregunta: |
          Ordena el apartado (b). Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Al girar alrededor de $OX$, el recinto **no toca el eje**: deja un
              hueco. Por eso se usan **arandelas**, no discos.
          - texto: |
              $V = \pi\displaystyle\int_{1/2}^{2}\left(R^{2}-r^{2}\right)dx$, con
              $R = \sqrt{x/2}$ el radio exterior y $r = \left|1-x\right|$ el
              interior.
          - texto: |
              $R^{2} = \frac x2$ y $r^{2} = (1-x)^{2}$, así que los dos
              integrandos son polinómicos y el valor absoluto **desaparece al
              elevarlo al cuadrado**.
          - texto: |
              $\pi\int_{1/2}^{2}\frac x2 dx = \frac{15\pi}{16}$, y el hueco
              aporta $\pi\left(\frac{1}{24}+\frac13\right) = \frac{3\pi}{8}$.
          - texto: |
              $V = \frac{15\pi}{16}-\frac{3\pi}{8} = \frac{9\pi}{16}$.
          - texto: |
              Como el área ya vale $\frac{13}{24}$, el volumen es
              $\pi$ veces esa área menos el hueco.
            trampa: true
            mensaje: |
              El área es $\int(R-r)$ y el volumen es $\pi\int\left(R^{2}
              -r^{2}\right)$. Y $(R-r)^{2} \neq R^{2}-r^{2}$: no hay forma de
              obtener uno del otro. Cada uno lleva su propia integral.
        veredicto: |
          Que el valor absoluto desaparezca al elevarlo al cuadrado es lo que
          hace el apartado (b) **más fácil** que el (a), al revés de lo
          habitual.

    resolucion: |
      **Datos.** $y = \sqrt{x/2}$, $y \ge \left|1-x\right|$, $0\le x\le2$.

      ### 1 · Dónde está el recinto

      La condición $y \ge \left|1-x\right|$ pone el valor absoluto de **suelo** y
      la raíz de **techo**. El recinto existe donde la raíz está por encima:

      $$
      \sqrt{\frac x2} = \left|1-x\right|
      $$

      Elevando al cuadrado —lo mismo en las dos ramas, porque el valor absoluto
      al cuadrado es $(1-x)^{2}$—:

      $$
      \frac x2 = 1-2x+x^{2}
      \;\Longrightarrow\;
      2x^{2}-5x+2 = 0
      \;\Longrightarrow\;
      x = \frac12 \ \text{ó}\ x = 2
      $$

      Las dos están dentro de $[0,2]$, así que

      $$
      D:\quad \frac12 \le x \le 2,
      \qquad \left|1-x\right| \le y \le \sqrt{\frac x2}
      $$

      **La costura está en $x=1$**, el vértice del valor absoluto: hasta ahí el
      suelo es $1-x$, y a partir de ahí $x-1$.

      ### 2 · Apartado (a): el área

      $$
      A = \int_{1/2}^{2}\sqrt{\frac x2}\,dx
      -\int_{1/2}^{1}(1-x)\,dx-\int_1^{2}(x-1)\,dx
      $$

      **El techo:**

      $$
      \int\sqrt{\frac{x}{2}}\,dx = \frac{1}{\sqrt2}\int x^{1/2}dx
      = \frac{2}{3\sqrt2}\,x^{3/2}
      $$

      $$
      \int_{1/2}^{2} = \frac{2}{3\sqrt2}\left(2\sqrt2
      -\frac{1}{2\sqrt2}\right) = \frac43-\frac16 = \frac76
      $$

      **El suelo**, que son dos triángulos:

      $$
      \int_{1/2}^{1}(1-x)dx = \frac{1}{2}\cdot\frac12\cdot\frac12 = \frac18,
      \qquad
      \int_1^{2}(x-1)dx = \frac12\cdot1\cdot1 = \frac12
      $$

      $$
      \boxed{A = \frac76-\frac18-\frac12 = \frac{13}{24} \approx 0{,}5417}
      $$

      ### 3 · Apartado (b): el volumen

      Al girar alrededor de $OX$, el recinto **no llega al eje**: entre $y=0$ y
      el suelo $\left|1-x\right|$ queda un hueco. Eso obliga a usar
      **arandelas**:

      $$
      V = \pi\int_{1/2}^{2}\left(R^{2}-r^{2}\right)dx,
      \qquad R = \sqrt{\frac x2},\quad r = \left|1-x\right|
      $$

      Y aquí ocurre algo cómodo: **al elevar al cuadrado, el valor absoluto
      desaparece**, porque $\left|1-x\right|^{2} = (1-x)^{2}$. El apartado (b)
      resulta más limpio que el (a).

      **El radio exterior:**

      $$
      \pi\int_{1/2}^{2}\frac{x}{2}dx = \pi\left[\frac{x^{2}}{4}\right]_{1/2}^{2}
      = \pi\left(1-\frac{1}{16}\right) = \frac{15\pi}{16}
      $$

      **El hueco**, partiendo en $x=1$ para tener la primitiva cómoda:

      $$
      \int_{1/2}^{1}(1-x)^{2}dx
      = \left[-\frac{(1-x)^{3}}{3}\right]_{1/2}^{1} = \frac{1}{24}
      $$

      $$
      \int_1^{2}(x-1)^{2}dx = \left[\frac{(x-1)^{3}}{3}\right]_1^{2}
      = \frac13
      $$

      $$
      \pi\left(\frac{1}{24}+\frac13\right) = \pi\cdot\frac{9}{24}
      = \frac{3\pi}{8}
      $$

      $$
      \boxed{V = \frac{15\pi}{16}-\frac{3\pi}{8} = \frac{9\pi}{16}
      \approx 1{,}767}
      $$

      ### 4 · El error que hay que evitar

      $$
      \left(R-r\right)^{2} \neq R^{2}-r^{2}
      $$

      Las áreas se restan; los volúmenes de revolución **no**. Hay que restar los
      **cuadrados** de los radios, no elevar al cuadrado la diferencia. Es el
      fallo que convierte una arandela en algo que no existe.

      ### 5 · Comprobación

      **Del área, por acotación.** La separación máxima entre techo y suelo se da
      cerca de $x=1$, donde el techo vale $\sqrt{0{,}5} \approx 0{,}707$ y el
      suelo 0. Sobre una base de $\frac32$:

      $$
      0{,}5417 < 1{,}5\cdot0{,}707 \approx 1{,}06 \quad\checkmark
      $$

      **Del volumen, por el radio medio.** El radio exterior medio al cuadrado es
      $\frac{1}{1,5}\int\frac x2 = \frac{15/16}{1,5} = 0{,}625$, y el interior
      $\frac{9/24}{1,5} = 0{,}25$. La arandela media tiene área
      $\pi(0{,}625-0{,}25) = 1{,}178$, y por la altura $1{,}5$ da
      $1{,}767$ ✔

      **Que $V>0$:** el radio exterior tiene que superar al interior en todo el
      recinto, y así es por construcción, porque el techo está por encima del
      suelo ✔

  - id: parametro-por-area
    titulo: Un parámetro determinado por el área
    fuente: >-
      Ejercicio 5.15 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Sea $9/2$ el área delimitada por las gráficas de las funciones $y = ax$
      con $a \in \mathbb{R}^{+}$ e $y = x^{2}$. Calcular el valor de $a$.
    pide: Calcular el valor de $a$.

    pasos:
      - tipo: reconocer
        pregunta: |
          Los límites de integración no vienen dados. ¿De qué dependen?
        opciones:
          - texto: >-
              **Del propio parámetro**: la recta y la parábola se cortan en
              $x=0$ y $x=a$
            correcta: true
            mensaje: |
              Exacto, y eso es lo que hace interesante el ejercicio: el
              parámetro aparece en el integrando **y** en el límite superior. Por
              eso el área sale proporcional a $a^{3}$ y no a $a$.
          - texto: Son siempre 0 y 1
            mensaje: |
              Eso sería si $a=1$. Los cortes se resuelven: $ax = x^{2}$ da $x=0$
              y $x=a$.
          - texto: Son $-a$ y $a$
            mensaje: |
              La parábola y la recta solo se cortan en $x=0$ y $x=a$. Con $a>0$
              no hay ningún corte negativo.
          - texto: Los da el área, $\frac92$
            mensaje: |
              El área es el **dato final**, no un límite de integración. Primero
              se expresa el área en función de $a$ y luego se iguala.

      - tipo: calcular
        titulo: El parámetro
        pregunta: |
          ¿Cuánto vale $a$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '27'
            mensaje: |
              27 es $a^{3}$, no $a$. Falta la raíz cúbica.
          - valor: '4.5'
            mensaje: |
              $\frac92$ es el área, el dato. Hay que resolver
              $\frac{a^{3}}{6} = \frac92$.
          - valor: '1.7320508'
            mensaje: |
              $\sqrt3$ saldría de $a^{2}=3$. Pero el área es proporcional a
              $a^{3}$, no a $a^{2}$: el parámetro entra dos veces, en el
              integrando y en el límite.
        pista: |
          $A = \int_0^{a}\left(ax-x^{2}\right)dx$. Calcula y despeja.
        desarrollo: |
          **Los cortes:**

          $$
          ax = x^{2} \;\Longrightarrow\; x(x-a) = 0
          \;\Longrightarrow\; x = 0,\ x = a
          $$

          **El área**, con la recta por encima en $(0,a)$:

          $$
          A = \int_0^{a}\left(ax-x^{2}\right)dx
          = \left[\frac{ax^{2}}{2}-\frac{x^{3}}{3}\right]_0^{a}
          = \frac{a^{3}}{2}-\frac{a^{3}}{3} = \frac{a^{3}}{6}
          $$

          **Igualando:**

          $$
          \frac{a^{3}}{6} = \frac92
          \;\Longrightarrow\;
          a^{3} = 27
          \;\Longrightarrow\;
          a = 3
          $$
        veredicto: |
          El $a^{3}$ es la clave: el parámetro escala tanto la altura del
          recinto como su anchura, así que el área crece como el **cubo**.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Los cortes** salen de $ax = x^{2}$: son $x=0$ y $x=a$, y dependen
              del parámetro.
          - texto: |
              **Quién va encima.** En $(0,a)$ la recta está por encima de la
              parábola: en $x = \frac a2$ la recta vale $\frac{a^{2}}{2}$ y la
              parábola $\frac{a^{2}}{4}$.
          - texto: |
              **El área en función de $a$:**
              $A = \int_0^{a}\left(ax-x^{2}\right)dx = \frac{a^{3}}{6}$.
          - texto: |
              **Se iguala al dato** y se despeja:
              $\frac{a^{3}}{6} = \frac92 \Rightarrow a^{3} = 27 \Rightarrow a=3$.
          - texto: |
              La raíz cúbica es única en los reales, y además $a=3$ cumple la
              condición $a \in \mathbb{R}^{+}$ del enunciado.
          - texto: |
              Como el área es $\frac92$ y la base del recinto es $a$, la altura
              media es $\frac{9}{2a}$, de donde $a$ sale directamente.
            trampa: true
            mensaje: |
              Esa ecuación es cierta pero **circular**: la altura media también
              depende de $a$, así que no despeja nada. Es el atajo aparente que
              hace perder el ejercicio; el camino es expresar el área entera en
              función de $a$.
        veredicto: |
          Comprobar quién va encima parece un trámite. No lo es: si se restara al
          revés saldría $a^{3} = -27$ y no habría solución positiva.

    resolucion: |
      **Datos.** El área entre $y = ax$ ($a>0$) e $y = x^{2}$ vale $\frac92$.

      ### 1 · La dificultad del ejercicio

      El parámetro aparece **dos veces**: en el integrando y en el límite de
      integración, porque los cortes dependen de él. Eso hace que el área no sea
      proporcional a $a$, sino a $a^{3}$.

      ### 2 · Los cortes

      $$
      ax = x^{2}
      \;\Longrightarrow\;
      x^{2}-ax = 0
      \;\Longrightarrow\;
      x(x-a) = 0
      \;\Longrightarrow\;
      x = 0,\quad x = a
      $$

      Como $a>0$, el recinto está en $[0,a]$.

      ### 3 · Quién va encima

      En el punto medio $x = \frac a2$:

      $$
      \text{recta: } a\cdot\frac a2 = \frac{a^{2}}{2},
      \qquad
      \text{parábola: } \left(\frac a2\right)^{2} = \frac{a^{2}}{4}
      $$

      La **recta** está por encima. Hay que comprobarlo: restar al revés daría un
      área negativa y una ecuación sin solución positiva.

      ### 4 · El área en función del parámetro

      $$
      A(a) = \int_0^{a}\left(ax-x^{2}\right)dx
      = \left[\frac{ax^{2}}{2}-\frac{x^{3}}{3}\right]_0^{a}
      = \frac{a^{3}}{2}-\frac{a^{3}}{3}
      $$

      $$
      A(a) = \frac{3a^{3}-2a^{3}}{6} = \frac{a^{3}}{6}
      $$

      ### 5 · Despejar

      $$
      \frac{a^{3}}{6} = \frac92
      \;\Longrightarrow\;
      a^{3} = 27
      \;\Longrightarrow\;
      \boxed{a = 3}
      $$

      La raíz cúbica es **única** en los reales, y además cumple $a>0$, que es lo
      que exigía el enunciado.

      ### 6 · Comprobación

      **Directa.** Con $a=3$ los cortes son 0 y 3:

      $$
      \int_0^{3}\left(3x-x^{2}\right)dx
      = \left[\frac{3x^{2}}{2}-\frac{x^{3}}{3}\right]_0^{3}
      = \frac{27}{2}-9 = \frac92 \quad\checkmark
      $$

      **Por acotación.** El recinto cabe en el rectángulo de base 3 y altura
      igual a la separación máxima. Esa separación se da donde
      $\frac{d}{dx}\left(3x-x^{2}\right) = 0$, o sea $x = \frac32$, y vale
      $\frac94 = 2{,}25$:

      $$
      \frac92 = 4{,}5 \quad<\quad 3\cdot2{,}25 = 6{,}75 \quad\checkmark
      $$

      Y otra vez la proporción de $\frac23$ típica de los recintos parabólicos:
      $4{,}5 = \frac23\cdot6{,}75$ ✔

  - id: parabola-tumbada
    titulo: Una parábola tumbada, y por qué conviene integrar en y
    fuente: >-
      Ejercicio 5.16 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Sea $D$ el dominio delimitado por las condiciones $y^{2} = 4+x$ y $x=2$.

      **(a)** Calcular el área del dominio $D$.

      **(b)** Calcular el volumen generado al girar el dominio $D$ alrededor del
      eje OX.
    pide: Calcular el área y el volumen de revolución.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué conviene integrar respecto de $y$ en el apartado (a)?
        opciones:
          - texto: >-
              Porque $y^{2} = 4+x$ **no es una función de $x$**: a cada $x$ le
              corresponden dos valores de $y$
            correcta: true
            mensaje: |
              Eso es. Despejando $y = \pm\sqrt{4+x}$ habría que integrar dos
              ramas y sumarlas. Despejando $x = y^{2}-4$ sale **una sola**
              función, y una sola integral.
          - texto: Porque el recinto es simétrico
            mensaje: |
              Lo es —respecto del eje $OX$—, y eso permite un atajo. Pero la
              razón de fondo es que $x$ sí es función de $y$ y $y$ no lo es de
              $x$.
          - texto: Porque $x=2$ es una recta vertical
            mensaje: |
              Una recta vertical es cómoda precisamente al integrar en $y$: es un
              límite constante. Pero eso es consecuencia, no causa.
          - texto: Porque la parábola no corta al eje $OX$
            mensaje: |
              Sí lo corta, en $x=-4$: ahí $y=0$. Ese es el vértice.

      - tipo: calcular
        titulo: El área
        pregunta: |
          ¿Cuánto vale el área de $D$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '19.5959'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '9.7980'
            mensaje: |
              $4\sqrt6$ es la **mitad**: has integrado solo la rama superior. El
              recinto tiene dos mitades simétricas respecto de $OX$.
          - valor: '29.3939'
            mensaje: |
              $29{,}39$ es el área del **rectángulo** que envuelve el recinto:
              base 6 por altura $2\sqrt6$. El segmento parabólico ocupa dos
              tercios de él, no el rectángulo entero.
          - valor: '14.6969'
            mensaje: |
              $6\sqrt6$ saldría de un factor 6 en vez de 8. La cuenta es
              $2\left(6\sqrt6-\frac{6\sqrt6}{3}\right) = 8\sqrt6$.
        pista: |
          Integra en $y$: $A = \int_{-\sqrt6}^{\sqrt6}\left[2-(y^{2}-4)\right]dy$.
        desarrollo: |
          **Los límites en $y$.** En $x=2$:

          $$
          y^{2} = 4+2 = 6 \;\Longrightarrow\; y = \pm\sqrt6
          $$

          **La anchura horizontal** del recinto a la altura $y$: desde la
          parábola $x = y^{2}-4$ hasta la recta $x=2$.

          $$
          A = \int_{-\sqrt6}^{\sqrt6}\left[2-\left(y^{2}-4\right)\right]dy
          = \int_{-\sqrt6}^{\sqrt6}\left(6-y^{2}\right)dy
          $$

          Por simetría, el doble de la mitad:

          $$
          A = 2\left[6y-\frac{y^{3}}{3}\right]_0^{\sqrt6}
          = 2\left(6\sqrt6-\frac{6\sqrt6}{3}\right)
          = 2\cdot4\sqrt6 = 8\sqrt6
          $$

          $$
          A \approx 8\cdot2{,}4495 = 19{,}5959
          $$
        veredicto: |
          Integrando en $x$ habría que hacer
          $2\int_{-4}^{2}\sqrt{4+x}\,dx$ y llegaría al mismo sitio. En $y$ sale
          un polinomio; en $x$, una raíz. La elección se nota.

      - tipo: calcular
        titulo: El volumen
        pregunta: |
          ¿Cuánto vale el volumen generado al girar $D$ alrededor de $OX$?
        respuesta:
          tipo: numero
          valor: '56.5487'
          tolerancia: 0.005
          formato: en forma exacta, o un número con cuatro decimales
        distractores:
          - valor: '113.0973'
            mensaje: |
              $36\pi$ es el doble, y hay **dos** formas de llegar ahí. Una:
              integrar las dos ramas por separado y sumarlas, cuando al girar
              las dos barren el mismo sólido. Otra: olvidar el $\frac12$ de la
              primitiva $\frac{(4+x)^{2}}{2}$. Comprueba cuál de las dos has
              hecho, porque se arreglan distinto.
          - valor: '30.7812'
            mensaje: |
              Has integrado el radio en vez del radio **al cuadrado**:
              $\pi\int\sqrt{4+x}\,dx$ en lugar de $\pi\int(4+x)\,dx$. El área
              del disco es $\pi r^{2}$, y aquí lo cómodo es justo que $r^{2}$ ya
              viene dado sin raíces.
          - valor: '61.5637'
            mensaje: |
              $\pi\cdot8\sqrt6$ es multiplicar el área por $\pi$. Eso no da el
              volumen: el radio se eleva al cuadrado **dentro** de la integral, y
              no hay ninguna relación directa entre área y volumen.
        pista: |
          Ahora sí conviene integrar en $x$: el radio del disco a la altura $x$
          es $y = \sqrt{4+x}$, y $y^{2} = 4+x$ ya viene dado.
        desarrollo: |
          Al girar alrededor de $OX$, cada sección es un **disco** de radio
          $y = \sqrt{4+x}$. Y aquí el enunciado regala el cuadrado:

          $$
          V = \pi\int_{-4}^{2}y^{2}\,dx = \pi\int_{-4}^{2}(4+x)\,dx
          $$

          $$
          = \pi\left[\frac{(4+x)^{2}}{2}\right]_{-4}^{2}
          = \pi\left(\frac{36}{2}-0\right) = 18\pi
          $$

          $$
          V \approx 56{,}5487
          $$

          **No se multiplica por 2.** Las dos mitades del recinto, la de arriba y
          la de abajo, barren el **mismo** sólido al girar.
        veredicto: |
          Aquí conviene cambiar de variable respecto del apartado (a): el área
          salía mejor en $y$, el volumen sale mejor en $x$. No hay que casarse
          con una elección.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **El recinto:** parábola tumbada con vértice en $(-4,0)$, abierta
              hacia la derecha, cortada por la vertical $x=2$. En esa vertical
              $y = \pm\sqrt6$.
          - texto: |
              **(a)** Conviene integrar en $y$, porque $x = y^{2}-4$ **sí** es
              función y $y = \pm\sqrt{4+x}$ no.
          - texto: |
              $A = \int_{-\sqrt6}^{\sqrt6}\left(6-y^{2}\right)dy = 8\sqrt6$.
          - texto: |
              **(b)** Al girar alrededor de $OX$ conviene volver a $x$: el radio
              del disco es $y$, y el enunciado da $y^{2} = 4+x$ directamente.
          - texto: |
              $V = \pi\int_{-4}^{2}(4+x)dx = 18\pi$, **sin** multiplicar por 2:
              las dos mitades barren el mismo sólido.
          - texto: |
              Como el recinto es simétrico respecto de $OX$, el volumen es el
              doble del que genera la mitad superior.
            trampa: true
            mensaje: |
              Al girar 360° alrededor de $OX$, la mitad de arriba **ya barre el
              sólido entero**; la de abajo lo vuelve a barrer. Multiplicar por 2
              cuenta el mismo volumen dos veces. Con el **área** sí hay que
              duplicar; con el volumen de revolución, no. Es la asimetría que
              persigue el ejercicio.
        veredicto: |
          Duplicar para el área y no duplicar para el volumen: dicho así suena
          arbitrario, y es geometría pura. Merece la pena visualizarlo una vez.

    resolucion: |
      **Datos.** $y^{2} = 4+x$ y $x=2$.

      ### 1 · Qué recinto es

      $y^{2} = 4+x$ es una **parábola tumbada**: vértice en $(-4,0)$, eje el
      propio $OX$, abierta hacia la derecha. La recta $x=2$ la cierra por la
      derecha, cortándola en

      $$
      y^{2} = 6 \;\Longrightarrow\; y = \pm\sqrt6 \approx \pm2{,}449
      $$

      El recinto es simétrico respecto de $OX$.

      ### 2 · Apartado (a): integrar en $y$

      La razón es directa: $y = \pm\sqrt{4+x}$ **no es una función** —dos valores
      por cada $x$—, mientras que $x = y^{2}-4$ sí lo es. Integrando en $y$ hay
      una sola integral, y además polinómica.

      La anchura horizontal a la altura $y$ va de la parábola a la recta:

      $$
      A = \int_{-\sqrt6}^{\sqrt6}\left[2-\left(y^{2}-4\right)\right]dy
      = \int_{-\sqrt6}^{\sqrt6}\left(6-y^{2}\right)dy
      $$

      El integrando es **par**, así que vale el doble de la mitad:

      $$
      A = 2\left[6y-\frac{y^{3}}{3}\right]_0^{\sqrt6}
      = 2\left(6\sqrt6-\frac{6\sqrt6}{3}\right)
      = 2\left(6\sqrt6-2\sqrt6\right) = 8\sqrt6
      $$

      $$
      \boxed{A = 8\sqrt6 \approx 19{,}596}
      $$

      ### 3 · Apartado (b): volver a $x$

      Al girar alrededor de $OX$ conviene cambiar de variable. Cada sección
      perpendicular al eje es un **disco** de radio $y = \sqrt{4+x}$, y el
      enunciado da el cuadrado ya hecho:

      $$
      V = \pi\int_{-4}^{2}y^{2}\,dx = \pi\int_{-4}^{2}(4+x)\,dx
      = \pi\left[\frac{(4+x)^{2}}{2}\right]_{-4}^{2}
      $$

      $$
      \boxed{V = \pi\cdot\frac{36}{2} = 18\pi \approx 56{,}549}
      $$

      ### 4 · La asimetría que hay que entender

      En el área **sí** se duplica; en el volumen **no**.

      - **Área:** la mitad de arriba y la de abajo son dos trozos distintos del
        plano, y las dos cuentan.
      - **Volumen:** al girar 360° alrededor de $OX$, la mitad de arriba **ya
        barre el sólido entero**. La de abajo lo vuelve a barrer. Duplicar
        contaría el mismo volumen dos veces.

      El sólido resultante es un **paraboloide de revolución**: como un cuenco
      apuntando hacia la izquierda, con el vértice en $(-4,0)$ y la boca de radio
      $\sqrt6$ en $x=2$.

      ### 5 · Comprobación

      **Del área, por la proporción parabólica.** Un segmento parabólico ocupa
      exactamente $\frac23$ del rectángulo que lo envuelve. Aquí el rectángulo
      tiene base 6 —de $-4$ a 2— y altura $2\sqrt6$:

      $$
      \frac23\cdot6\cdot2\sqrt6 = 8\sqrt6 \quad\checkmark
      $$

      **Del volumen, por la fórmula del paraboloide.** Un paraboloide de
      revolución tiene **la mitad** del volumen del cilindro que lo contiene. El
      cilindro aquí tiene radio $\sqrt6$ y altura 6:

      $$
      \frac12\pi\left(\sqrt6\right)^{2}\cdot6 = \frac12\pi\cdot36 = 18\pi
      \quad\checkmark
      $$

      Dos comprobaciones geométricas, ninguna repite el cálculo hecho.

  - id: formulas-clasicas-con-integrales
    titulo: De dónde salen las cinco fórmulas que te sabes de memoria
    fuente: >-
      Ejercicio 5.17 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU ·
      El apartado (a) cayó en 2019/2020 6E, el (d) en 2012/2013 3E y el (e) en
      2021/2022 6E
    nivel: practica
    enunciado: |
      Utilizando integrales calcular:

      **(a)** El perímetro de una circunferencia de radio $R$. (2019/2020 6E)

      **(b)** El área de un círculo de radio $R$.

      **(c)** El área de una esfera de radio $R$.

      **(d)** El volumen de una esfera de radio $R$. (2012/2013 3E)

      **(e)** El volumen de un cono de radio $R$ y altura $h$. (2021/2022 6E)
    pide: Deducir las cinco fórmulas con integrales.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué fórmula hace falta para (a) y (c), y no para las otras tres?
        opciones:
          - texto: >-
              La de **longitud de arco**,
              $\int\sqrt{1+f'(x)^{2}}\,dx$, porque las dos miden curvas o
              superficies, no regiones
            correcta: true
            mensaje: |
              Exacto. (a) es una longitud y (c) una superficie de revolución;
              las dos necesitan el factor $\sqrt{1+f'^{2}}$, que es Pitágoras
              aplicado a un trozo infinitesimal de curva. Las otras tres son
              área plana y volumen: no lo llevan.
          - texto: La de discos, $\pi\int f^{2}$
            mensaje: |
              Esa sirve para (d) y (e), que son volúmenes. Para una longitud o
              una superficie hace falta otra cosa.
          - texto: La de arandelas
            mensaje: |
              No aparece en ningún apartado: ninguno de los cinco sólidos tiene
              hueco.
          - texto: La regla de Barrow
            mensaje: |
              Barrow se usa en los cinco. La pregunta es qué distingue a (a) y
              (c) de los demás.

      - tipo: calcular
        titulo: El integrando que lo simplifica todo
        pregunta: |
          Para la semicircunferencia $y = \sqrt{R^{2}-x^{2}}$, ¿cuánto vale
          $\sqrt{1+y'^{2}}$ en $x=0$, con $R=5$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '5'
            mensaje: |
              5 es $R$, el numerador de $\frac{R}{\sqrt{R^{2}-x^{2}}}$. Pero en
              $x=0$ el denominador también vale $R$, así que la fracción es 1.
          - valor: '0'
            mensaje: |
              0 es $y'(0)$, la derivada. El factor es $\sqrt{1+y'^{2}}$, que con
              derivada nula vale 1.
          - valor: '1.4142136'
            mensaje: |
              $\sqrt2$ saldría si la derivada valiera 1, es decir donde la curva
              sube a 45°. En el punto más alto de la circunferencia la tangente
              es horizontal.
        pista: |
          $y' = \frac{-x}{\sqrt{R^{2}-x^{2}}}$. En $x=0$ vale 0.
        desarrollo: |
          $$
          y = \sqrt{R^{2}-x^{2}}
          \;\Longrightarrow\;
          y' = \frac{-x}{\sqrt{R^{2}-x^{2}}}
          $$

          $$
          1+y'^{2} = 1+\frac{x^{2}}{R^{2}-x^{2}}
          = \frac{R^{2}-x^{2}+x^{2}}{R^{2}-x^{2}} = \frac{R^{2}}{R^{2}-x^{2}}
          $$

          $$
          \sqrt{1+y'^{2}} = \frac{R}{\sqrt{R^{2}-x^{2}}} = \frac{R}{y}
          $$

          En $x=0$ eso vale $\frac{R}{R} = 1$, porque la tangente es horizontal
          en el punto más alto.
        veredicto: |
          Esa simplificación, $\sqrt{1+y'^{2}} = \frac{R}{y}$, es la que hace
          posibles (a) y (c): en (c) se cancela con la $y$ que multiplica y deja
          una integral trivial.

      - tipo: calcular
        titulo: El cono
        pregunta: |
          Para un cono de $R=3$ y $h=4$, ¿cuánto vale el volumen?
        respuesta:
          tipo: numero
          valor: '37.6991'
          tolerancia: 0.005
          formato: en forma exacta, o un número con cuatro decimales
        distractores:
          - valor: '113.0973'
            mensaje: |
              $36\pi$ es el volumen del **cilindro** de la misma base y altura.
              El cono es un tercio de él.
          - valor: '18.8496'
            mensaje: |
              $6\pi$ saldría de $\frac{\pi R h}{...}$: el radio va **al
              cuadrado**, no lineal.
          - valor: '50.2655'
            mensaje: |
              $16\pi$ confunde $R$ con $h$: la fórmula es
              $\frac{\pi R^{2}h}{3}$, con el cuadrado en el **radio**.
        pista: |
          Gira la recta $y = \frac{R}{h}x$ entre 0 y $h$ alrededor de $OX$.
        desarrollo: |
          El cono se genera girando la recta que va del origen a $(h,R)$:

          $$
          y = \frac{R}{h}x, \qquad 0 \le x \le h
          $$

          $$
          V = \pi\int_0^{h}\left(\frac{R}{h}x\right)^{2}dx
          = \pi\frac{R^{2}}{h^{2}}\left[\frac{x^{3}}{3}\right]_0^{h}
          = \pi\frac{R^{2}}{h^{2}}\cdot\frac{h^{3}}{3}
          $$

          $$
          V = \frac{\pi R^{2}h}{3}
          $$

          Con $R=3$ y $h=4$:

          $$
          V = \frac{\pi\cdot9\cdot4}{3} = 12\pi \approx 37{,}6991
          $$
        veredicto: |
          El $\frac13$ sale de integrar $x^{2}$, y es la misma razón por la que
          una pirámide es un tercio de su prisma. La geometría lo enuncia; la
          integral lo explica.

      - tipo: justificar
        pregunta: |
          Ordena las cinco deducciones. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **Las herramientas:** área
              $\int f$, longitud $\int\sqrt{1+f'^{2}}$, volumen
              $\pi\int f^{2}$ y superficie de revolución
              $2\pi\int f\sqrt{1+f'^{2}}$.
          - texto: |
              **(a)** Con $y=\sqrt{R^{2}-x^{2}}$ sale
              $\sqrt{1+y'^{2}} = \frac{R}{y}$, y
              $L = 2\int_{-R}^{R}\frac{R\,dx}{\sqrt{R^{2}-x^{2}}}
              = 2R\pi$.
          - texto: |
              **(b)** $A = 2\int_{-R}^{R}\sqrt{R^{2}-x^{2}}\,dx = \pi R^{2}$,
              con el cambio $x = R\,\mathrm{sen}\,t$.
          - texto: |
              **(c)** $S = 2\pi\int_{-R}^{R} y\cdot\frac{R}{y}\,dx
              = 2\pi R\cdot 2R = 4\pi R^{2}$: la $y$ **se cancela** y queda una
              integral de una constante.
          - texto: |
              **(d)** $V = \pi\int_{-R}^{R}\left(R^{2}-x^{2}\right)dx
              = \frac43\pi R^{3}$. **(e)** $V = \pi\int_0^{h}
              \frac{R^{2}}{h^{2}}x^{2}dx = \frac13\pi R^{2}h$.
          - texto: |
              En (a) y (c) hay que multiplicar por 2 porque la circunferencia
              tiene dos mitades, y en (d) también por la misma razón.
            trampa: true
            mensaje: |
              En (d) **no** se duplica. Al girar alrededor de $OX$, la
              semicircunferencia superior ya barre la esfera entera; la inferior
              la vuelve a barrer. En (a) sí se duplica —son dos arcos
              distintos— y en (c) también, porque el enunciado de la superficie
              de revolución se aplica a la mitad superior girada.
        veredicto: |
          Cuándo duplicar y cuándo no es lo que más se falla de este ejercicio.
          La regla: en el **plano** se duplica; al **girar**, no.

    resolucion: |
      **Datos.** Cinco fórmulas clásicas, a deducir con integrales.

      ### 1 · Las cuatro herramientas

      | qué se mide | fórmula |
      |---|---|
      | área plana | $A = \int_a^{b} f$ |
      | longitud de arco | $L = \int_a^{b}\sqrt{1+f'^{2}}\,dx$ |
      | volumen de revolución | $V = \pi\int_a^{b} f^{2}\,dx$ |
      | superficie de revolución | $S = 2\pi\int_a^{b} f\sqrt{1+f'^{2}}\,dx$ |

      Las cuatro primeras salen de lo mismo: cortar en trozos infinitesimales y
      sumar. El $\sqrt{1+f'^{2}}$ es **Pitágoras** aplicado a un trocito de
      curva: $ds = \sqrt{dx^{2}+dy^{2}}$.

      ### 2 · El cálculo que sirve para tres apartados

      Para la semicircunferencia superior $y = \sqrt{R^{2}-x^{2}}$:

      $$
      y' = \frac{-x}{\sqrt{R^{2}-x^{2}}}
      $$

      $$
      1+y'^{2} = \frac{R^{2}-x^{2}+x^{2}}{R^{2}-x^{2}} = \frac{R^{2}}{R^{2}-x^{2}}
      $$

      $$
      \sqrt{1+y'^{2}} = \frac{R}{\sqrt{R^{2}-x^{2}}} = \frac{R}{y}
      $$

      Esta identidad es la que hace fáciles (a) y (c).

      ### 3 · (a) El perímetro

      $$
      L = 2\int_{-R}^{R}\frac{R}{\sqrt{R^{2}-x^{2}}}\,dx
      = 2R\left[\arcsin\frac{x}{R}\right]_{-R}^{R}
      = 2R\left(\frac{\pi}{2}+\frac{\pi}{2}\right)
      $$

      $$
      \boxed{L = 2\pi R}
      $$

      El 2 de delante es porque hay **dos** semicircunferencias. Y la integral es
      **impropia** —el integrando explota en $\pm R$—, pero converge.

      ### 4 · (b) El área del círculo

      $$
      A = 2\int_{-R}^{R}\sqrt{R^{2}-x^{2}}\,dx
      $$

      Con el cambio $x = R\,\mathrm{sen}\,t$, $dx = R\cos t\,dt$:

      $$
      = 2R^{2}\int_{-\pi/2}^{\pi/2}\cos^{2}t\,dt
      = 2R^{2}\left[\frac{t}{2}+\frac{\mathrm{sen}\,2t}{4}\right]_{-\pi/2}^{\pi/2}
      = 2R^{2}\cdot\frac{\pi}{2}
      $$

      $$
      \boxed{A = \pi R^{2}}
      $$

      ### 5 · (c) La superficie de la esfera

      Aquí ocurre la cancelación:

      $$
      S = 2\pi\int_{-R}^{R} y\cdot\sqrt{1+y'^{2}}\,dx
      = 2\pi\int_{-R}^{R} y\cdot\frac{R}{y}\,dx
      = 2\pi R\int_{-R}^{R}dx
      $$

      $$
      \boxed{S = 2\pi R\cdot2R = 4\pi R^{2}}
      $$

      **La $y$ se cancela**, y queda la integral de una constante. Ese es el
      resultado de Arquímedes: la superficie de una esfera coincide con la del
      cilindro que la envuelve, y por eso franjas de igual anchura tienen igual
      superficie, estén en el ecuador o cerca del polo.

      ### 6 · (d) El volumen de la esfera

      $$
      V = \pi\int_{-R}^{R}\left(R^{2}-x^{2}\right)dx
      = \pi\left[R^{2}x-\frac{x^{3}}{3}\right]_{-R}^{R}
      = \pi\left(2R^{3}-\frac{2R^{3}}{3}\right)
      $$

      $$
      \boxed{V = \frac{4}{3}\pi R^{3}}
      $$

      **Sin duplicar.** La semicircunferencia superior ya barre la esfera entera
      al girar.

      ### 7 · (e) El volumen del cono

      Girando la recta que une el origen con $(h,R)$:

      $$
      V = \pi\int_0^{h}\left(\frac{R}{h}x\right)^{2}dx
      = \frac{\pi R^{2}}{h^{2}}\cdot\frac{h^{3}}{3}
      $$

      $$
      \boxed{V = \frac{1}{3}\pi R^{2}h}
      $$

      El $\frac13$ es el de $\int x^{2}$, y es la misma razón por la que una
      pirámide es un tercio de su prisma.

      ### 8 · Cuándo duplicar

      Es lo que más se falla:

      | | ¿se duplica? | por qué |
      |---|---|---|
      | (a) longitud | **sí** | son dos arcos distintos del plano |
      | (b) área | **sí** | son dos mitades distintas del plano |
      | (d) volumen | **no** | al girar, la mitad superior ya barre todo |

      **En el plano se duplica; al girar, no.**

      ### 9 · Comprobación

      **Coherencia dimensional.** $L$ es una longitud y sale $\propto R$; $A$ y
      $S$ son áreas y salen $\propto R^{2}$; $V$ es un volumen y sale
      $\propto R^{3}$ ✔

      **Derivadas cruzadas.** El volumen de la esfera y su superficie cumplen

      $$
      \frac{dV}{dR} = \frac{d}{dR}\left(\frac43\pi R^{3}\right) = 4\pi R^{2} = S
      \quad\checkmark
      $$

      Tiene sentido geométrico: engordar la esfera un $dR$ añade una capa de
      espesor $dR$ sobre toda su superficie. Lo mismo pasa con el círculo:
      $\frac{d}{dR}\left(\pi R^{2}\right) = 2\pi R = L$ ✔

  - id: elipsoides
    titulo: Dos elipsoides de la misma elipse
    fuente: >-
      Ejercicio 5.18 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU ·
      Cayó en 2021/2022 7E
    nivel: practica
    enunciado: |
      Sea la elipse $\dfrac{x^{2}}{25}+y^{2} = 1$: (2021/2022 7E)

      **(a)** Calcular el volumen del elipsoide generado al girar la elipse
      alrededor del eje OX.

      **(b)** Calcular el volumen del elipsoide generado al girar la elipse
      alrededor del eje OY. (2021/2022 7E)
    pide: Calcular los dos volúmenes.

    pasos:
      - tipo: reconocer
        pregunta: |
          La misma elipse gira alrededor de dos ejes distintos. ¿Por qué salen
          volúmenes distintos?
        opciones:
          - texto: >-
              Porque el radio de giro es distinto: al girar sobre $OX$ el radio
              es el **semieje menor**, y sobre $OY$ el **mayor**
            correcta: true
            mensaje: |
              Exacto. Sobre $OX$ el sólido es alargado —como un puro— y sobre
              $OY$ achatado —como un platillo—. El volumen sale
              $\frac43\pi a b^{2}$ en un caso y $\frac43\pi a^{2}b$ en el otro,
              y como $a=5$ y $b=1$, el segundo es cinco veces el primero.
          - texto: Porque la elipse no es simétrica
            mensaje: |
              Sí lo es, respecto de los dos ejes. Lo que la hace asimétrica es
              que sus semiejes miden distinto: 5 y 1.
          - texto: Porque al girar sobre $OY$ hay que usar arandelas
            mensaje: |
              Ninguno de los dos lleva hueco: los dos son discos. La diferencia
              está en qué variable se integra.
          - texto: >-
              No salen distintos: los dos elipsoides tienen el mismo volumen
            mensaje: |
              Salen $\frac{20\pi}{3}$ y $\frac{100\pi}{3}$: uno es cinco veces
              el otro.

      - tipo: calcular
        titulo: Alrededor de OX
        pregunta: |
          ¿Cuánto vale el volumen del elipsoide al girar sobre $OX$?
        respuesta:
          tipo: numero
          valor: '20.9440'
          tolerancia: 0.005
          formato: en forma exacta, o un número con cuatro decimales
        distractores:
          - valor: '104.7198'
            mensaje: |
              $\frac{100\pi}{3}$ es el volumen al girar sobre $OY$, el del
              apartado (b). Sobre $OX$ el radio es el semieje **menor**.
          - valor: '10.4720'
            mensaje: |
              $\frac{10\pi}{3}$ es la mitad: has integrado solo de 0 a 5 y no
              has duplicado. Aquí el intervalo de integración va de $-5$ a 5.
          - valor: '4.1888'
            mensaje: |
              $\frac{4\pi}{3}$ es el volumen de la **esfera de radio 1**. El
              elipsoide es cinco veces más largo.
        pista: |
          $y^{2} = 1-\frac{x^{2}}{25}$, y $V = \pi\int_{-5}^{5}y^{2}dx$.
        desarrollo: |
          Despejando $y^{2}$:

          $$
          y^{2} = 1-\frac{x^{2}}{25}
          $$

          Los cortes con $OX$ están en $x = \pm5$:

          $$
          V = \pi\int_{-5}^{5}\left(1-\frac{x^{2}}{25}\right)dx
          = \pi\left[x-\frac{x^{3}}{75}\right]_{-5}^{5}
          $$

          $$
          = \pi\cdot2\left(5-\frac{125}{75}\right)
          = 2\pi\left(5-\frac53\right) = 2\pi\cdot\frac{10}{3}
          $$

          $$
          V = \frac{20\pi}{3} \approx 20{,}9440
          $$
        veredicto: |
          Nótese que se integra de $-5$ a 5 —el intervalo entero— y **no** se
          duplica. La mitad superior de la elipse ya barre el sólido completo.

      - tipo: calcular
        titulo: Alrededor de OY
        pregunta: |
          ¿Cuánto vale el volumen al girar sobre $OY$? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '104.7198'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '20.9440'
            mensaje: |
              $\frac{20\pi}{3}$ es el del apartado (a), girando sobre $OX$.
              Sobre $OY$ el radio es el semieje **mayor**, cinco veces más
              grande, y el volumen es cinco veces mayor.
          - valor: '523.5988'
            mensaje: |
              $\frac{500\pi}{3}$ saldría de elevar el 5 al cubo. Solo se eleva al
              cuadrado: es el **radio**, y la altura la aporta el otro semieje.
          - valor: '52.3599'
            mensaje: |
              $\frac{50\pi}{3}$ es la mitad: has integrado de 0 a 1 sin cubrir
              el intervalo $[-1,1]$.
        pista: |
          Ahora se integra en $y$: $V = \pi\int_{-1}^{1}x^{2}\,dy$, con
          $x^{2} = 25\left(1-y^{2}\right)$.
        desarrollo: |
          Al girar sobre $OY$, el radio del disco es $x$ y el eje de apilamiento
          es $y$. Se despeja $x^{2}$:

          $$
          x^{2} = 25\left(1-y^{2}\right)
          $$

          Los cortes con $OY$ están en $y = \pm1$:

          $$
          V = \pi\int_{-1}^{1}25\left(1-y^{2}\right)dy
          = 25\pi\left[y-\frac{y^{3}}{3}\right]_{-1}^{1}
          $$

          $$
          = 25\pi\cdot2\left(1-\frac13\right) = 25\pi\cdot\frac43
          = \frac{100\pi}{3}
          $$

          $$
          V \approx 104{,}7198
          $$
        veredicto: |
          Cambiar de eje de giro significa cambiar de **variable de
          integración**. Es el mismo cambio de perspectiva que en el ejercicio
          de la parábola tumbada.

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La elipse** tiene semieje mayor $a=5$ sobre $OX$ y semieje menor
              $b=1$ sobre $OY$.
          - texto: |
              **(a) Girando sobre $OX$:** los discos se apilan a lo largo de $x$
              y su radio es $y$. Se despeja
              $y^{2} = 1-\frac{x^{2}}{25}$ y se integra de $-5$ a 5.
          - texto: |
              $V_{OX} = \pi\int_{-5}^{5}\left(1-\frac{x^{2}}{25}\right)dx
              = \frac{20\pi}{3}$. Sólido **alargado**, como un puro.
          - texto: |
              **(b) Girando sobre $OY$:** los discos se apilan a lo largo de $y$
              y su radio es $x$. Se despeja
              $x^{2} = 25\left(1-y^{2}\right)$ y se integra de $-1$ a 1.
          - texto: |
              $V_{OY} = 25\pi\int_{-1}^{1}\left(1-y^{2}\right)dy
              = \frac{100\pi}{3}$. Sólido **achatado**, como un platillo. Es
              cinco veces el anterior.
          - texto: |
              El sólido de (b) es más grande porque el intervalo de integración
              es mayor.
            trampa: true
            mensaje: |
              Es al revés: en (b) el intervalo es $[-1,1]$, **más corto** que el
              $[-5,5]$ de (a). Lo que hace grande al segundo es el **radio**, que
              entra al cuadrado: $25$ frente a $1$. Un factor 25 en el radio
              cuadrado contra un factor $\frac15$ en la longitud da 5.
        veredicto: |
          La razón entre los dos volúmenes es exactamente $\frac ab = 5$. En
          general $V_{OX} = \frac43\pi ab^{2}$ y $V_{OY} = \frac43\pi a^{2}b$.

    resolucion: |
      **Datos.** La elipse $\frac{x^{2}}{25}+y^{2} = 1$, con semiejes $a=5$
      sobre $OX$ y $b=1$ sobre $OY$.

      ### 1 · Qué cambia al cambiar de eje

      Al girar alrededor de un eje, los discos se **apilan a lo largo de ese
      eje** y su **radio se mide perpendicularmente** a él. Así que el eje de
      giro decide qué variable es la de integración y cuál es el radio:

      | eje | se apila en | radio | se despeja |
      |---|---|---|---|
      | $OX$ | $x$ | $y$ | $y^{2}$ |
      | $OY$ | $y$ | $x$ | $x^{2}$ |

      Ese es todo el ejercicio.

      ### 2 · Apartado (a): alrededor de OX

      $$
      y^{2} = 1-\frac{x^{2}}{25}
      $$

      La elipse corta a $OX$ en $x = \pm5$:

      $$
      V = \pi\int_{-5}^{5}\left(1-\frac{x^{2}}{25}\right)dx
      = \pi\left[x-\frac{x^{3}}{75}\right]_{-5}^{5}
      $$

      $$
      = 2\pi\left(5-\frac{125}{75}\right) = 2\pi\left(5-\frac53\right)
      = 2\pi\cdot\frac{10}{3}
      $$

      $$
      \boxed{V_{OX} = \frac{20\pi}{3} \approx 20{,}944}
      $$

      El sólido es **alargado**: 10 de largo y 2 de diámetro máximo. Como un
      puro.

      ### 3 · Apartado (b): alrededor de OY

      $$
      x^{2} = 25\left(1-y^{2}\right)
      $$

      La elipse corta a $OY$ en $y = \pm1$:

      $$
      V = \pi\int_{-1}^{1}25\left(1-y^{2}\right)dy
      = 25\pi\left[y-\frac{y^{3}}{3}\right]_{-1}^{1}
      = 25\pi\cdot\frac43
      $$

      $$
      \boxed{V_{OY} = \frac{100\pi}{3} \approx 104{,}720}
      $$

      El sólido es **achatado**: 2 de alto y 10 de diámetro. Como un platillo.

      ### 4 · Por qué el segundo es cinco veces el primero

      A primera vista sorprende, porque el intervalo de integración de (b) es
      **más corto**: $[-1,1]$ frente a $[-5,5]$.

      Lo que decide es el **radio al cuadrado**:

      $$
      \frac{V_{OY}}{V_{OX}}
      = \frac{25\cdot2}{1\cdot10} = 5
      $$

      Un factor 25 en el radio cuadrado contra un factor $\frac15$ en la
      longitud. Gana el radio, porque va al cuadrado.

      En general:

      $$
      V_{OX} = \frac43\pi a b^{2},
      \qquad
      V_{OY} = \frac43\pi a^{2}b,
      \qquad
      \frac{V_{OY}}{V_{OX}} = \frac{a}{b}
      $$

      ### 5 · Comprobación

      **Por el caso degenerado.** Si $a = b = R$ la elipse es una
      circunferencia, y las dos fórmulas dan $\frac43\pi R^{3}$, el volumen de la
      esfera ✔

      **Con los números.** $\frac43\pi\cdot5\cdot1^{2} = \frac{20\pi}{3}$ ✔ y
      $\frac43\pi\cdot25\cdot1 = \frac{100\pi}{3}$ ✔

      **Por acotación.** El elipsoide de (a) cabe en un cilindro de radio 1 y
      altura 10, de volumen $10\pi \approx 31{,}4$; y $20{,}94 < 31{,}4$ ✔ Y de
      hecho la razón es exactamente $\frac23$, como en toda figura de este tipo.

  - id: longitud-de-arco-parabola
    titulo: La longitud de un arco de parábola
    fuente: >-
      Ejercicio 5.19 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular la longitud del arco $y = x^{2}+x-2$, $x \in [-2,1]$.
    pide: Calcular la longitud del arco.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué la longitud de arco produce casi siempre integrales
          incómodas?
        opciones:
          - texto: >-
              Porque el integrando lleva una **raíz de una suma de cuadrados**,
              $\sqrt{1+f'^{2}}$, que rara vez tiene primitiva elemental
            correcta: true
            mensaje: |
              Eso es. Incluso para una parábola —la curva más sencilla después de
              la recta— aparece $\sqrt{1+u^{2}}$, cuya primitiva ya necesita el
              argumento del seno hiperbólico. Con una cúbica el problema deja de
              ser elemental.
          - texto: Porque hay que derivar antes de integrar
            mensaje: |
              Derivar es lo fácil. El problema aparece después, al meter esa
              derivada bajo una raíz.
          - texto: Porque la longitud siempre es irracional
            mensaje: |
              Que el resultado sea irracional no complica la integral. Hay arcos
              con longitud racional y su integral es igual de incómoda.
          - texto: Porque hay que integrar en $y$
            mensaje: |
              No hace falta: la fórmula está planteada en $x$ y aquí funciona sin
              cambiar de variable.

      - tipo: calcular
        titulo: El cambio de variable
        pregunta: |
          Con $u = 2x+1$, ¿entre qué valores va $u$? Da el límite superior.
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              1 es el límite superior en $x$, no en $u$. Hay que aplicarle el
              cambio: $u(1) = 2\cdot1+1 = 3$.
          - valor: '2'
            mensaje: |
              2 saldría de $2x$ sin el $+1$. La derivada es $y' = 2x+1$.
          - valor: '-3'
            mensaje: |
              $-3$ es el límite **inferior**, $u(-2) = -4+1 = -3$. Los dos son
              simétricos, y eso es lo que permite el atajo.
        pista: |
          $y' = 2x+1$. Evalúa en los extremos $x=-2$ y $x=1$.
        desarrollo: |
          $$
          y' = 2x+1
          $$

          $$
          u(-2) = -4+1 = -3,
          \qquad
          u(1) = 2+1 = 3
          $$

          El intervalo en $u$ es $[-3,3]$: **simétrico**. Como
          $\sqrt{1+u^{2}}$ es par, la integral vale el doble de la mitad
          derecha, y eso simplifica la cuenta.
        veredicto: |
          Que el intervalo salga simétrico no es casualidad: $[-2,1]$ está
          centrado en $x = -\frac12$, que es el **vértice** de la parábola.

      - tipo: calcular
        titulo: La longitud
        pregunta: |
          ¿Cuánto vale la longitud del arco? En forma exacta, o con cuatro decimales.
        respuesta:
          tipo: numero
          valor: '5.6526'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.9092'
            mensaje: |
              $\frac{\mathrm{argsh}\,3}{2} \approx 0{,}909$ es solo el segundo
              término. Y es **imposible** como respuesta: el arco va de $x=-2$ a
              $x=1$, así que mide al menos 3. *(Es también lo que dice la
              solución del boletín; ver la nota de la resolución.)*
          - valor: '4.7434'
            mensaje: |
              $\frac{3\sqrt{10}}{2} \approx 4{,}743$ es solo el primer término.
              Falta sumarle $\frac{\mathrm{argsh}\,3}{2}$.
          - valor: '11.3053'
            mensaje: |
              $11{,}31$ es el doble: has duplicado una integral que ya cubría el
              intervalo entero.
        pista: |
          $\int\sqrt{1+u^{2}}\,du
          = \frac{u\sqrt{1+u^{2}}}{2}+\frac{\mathrm{argsh}\,u}{2}$.
        desarrollo: |
          $$
          L = \int_{-2}^{1}\sqrt{1+(2x+1)^{2}}\,dx
          $$

          Con $u = 2x+1$, $du = 2\,dx$:

          $$
          L = \frac12\int_{-3}^{3}\sqrt{1+u^{2}}\,du
          = \int_0^{3}\sqrt{1+u^{2}}\,du
          $$

          usando que el integrando es par.

          $$
          \int\sqrt{1+u^{2}}\,du
          = \frac{u\sqrt{1+u^{2}}}{2}+\frac{\mathrm{argsh}\,u}{2}
          $$

          $$
          L = \frac{3\sqrt{10}}{2}+\frac{\mathrm{argsh}\,3}{2}
          $$

          $$
          \approx \frac{9{,}4868}{2}+\frac{1{,}8184}{2}
          = 4{,}7434+0{,}9092 = 5{,}6526
          $$
        veredicto: |
          El arco tiene que medir **más** que la cuerda que une sus extremos.
          Los extremos son $(-2,0)$ y $(1,0)$, la cuerda mide 3, y $5{,}65>3$ ✔

      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              **La fórmula:** $L = \int_a^{b}\sqrt{1+f'(x)^{2}}\,dx$, que es
              Pitágoras sobre un trozo infinitesimal de curva.
          - texto: |
              $f'(x) = 2x+1$, luego
              $L = \int_{-2}^{1}\sqrt{1+(2x+1)^{2}}\,dx$.
          - texto: |
              **El cambio** $u = 2x+1$ lleva el intervalo a $[-3,3]$, y como el
              integrando es par, $L = \int_0^{3}\sqrt{1+u^{2}}\,du$.
          - texto: |
              **La primitiva**, que sale por partes o con el cambio
              $u = \mathrm{senh}\,t$:
              $\frac{u\sqrt{1+u^{2}}}{2}+\frac{\mathrm{argsh}\,u}{2}$.
          - texto: |
              $L = \frac{3\sqrt{10}+\mathrm{argsh}\,3}{2} \approx 5{,}65$, que
              supera a la cuerda de longitud 3, como debe ser.
          - texto: |
              Como el arco parte y acaba en el eje $OX$, su longitud coincide con
              la de la cuerda que une los extremos.
            trampa: true
            mensaje: |
              Una curva **nunca** mide lo mismo que su cuerda salvo que sea un
              segmento recto. La cuerda es el camino más corto: aquí mide 3 y el
              arco mide $5{,}65$. Esa desigualdad es, de hecho, la comprobación
              más útil del ejercicio.
        veredicto: |
          Que el arco supere a la cuerda es una comprobación gratuita, y en este
          ejercicio concreto delata un resultado publicado que no puede ser.

    resolucion: |
      **Datos.** $y = x^{2}+x-2$ en $x \in [-2,1]$.

      ### 1 · La fórmula y por qué es incómoda

      $$
      L = \int_a^{b}\sqrt{1+f'(x)^{2}}\,dx
      $$

      Sale de aplicar Pitágoras a un trozo infinitesimal de curva:
      $ds = \sqrt{dx^{2}+dy^{2}} = \sqrt{1+y'^{2}}\,dx$.

      La raíz de la suma de cuadrados es lo que la complica: incluso para una
      parábola —donde $f'$ es lineal— aparece $\sqrt{1+u^{2}}$, cuya primitiva ya
      necesita el argumento del seno hiperbólico.

      ### 2 · El planteamiento

      $$
      f'(x) = 2x+1
      \;\Longrightarrow\;
      L = \int_{-2}^{1}\sqrt{1+(2x+1)^{2}}\,dx
      $$

      **El cambio** $u = 2x+1$, $du = 2\,dx$:

      | | $x$ | $u$ |
      |---|---|---|
      | inferior | $-2$ | $-3$ |
      | superior | $1$ | $3$ |

      $$
      L = \frac12\int_{-3}^{3}\sqrt{1+u^{2}}\,du
      $$

      El intervalo sale **simétrico** porque $[-2,1]$ está centrado en el
      vértice de la parábola, $x = -\frac12$. Y como $\sqrt{1+u^{2}}$ es **par**:

      $$
      L = \frac12\cdot2\int_0^{3}\sqrt{1+u^{2}}\,du
      = \int_0^{3}\sqrt{1+u^{2}}\,du
      $$

      ### 3 · La primitiva

      Se obtiene por partes —o con el cambio $u = \mathrm{senh}\,t$, que
      convierte $\sqrt{1+u^{2}}$ en $\cosh t$—:

      $$
      \int\sqrt{1+u^{2}}\,du
      = \frac{u\sqrt{1+u^{2}}}{2}+\frac{1}{2}\mathrm{argsh}\,u
      $$

      donde $\mathrm{argsh}\,u = \ln\left(u+\sqrt{1+u^{2}}\right)$.

      ### 4 · El resultado

      $$
      L = \left[\frac{u\sqrt{1+u^{2}}}{2}
      +\frac{\mathrm{argsh}\,u}{2}\right]_0^{3}
      = \frac{3\sqrt{10}}{2}+\frac{\mathrm{argsh}\,3}{2}
      $$

      $$
      \boxed{L = \frac{3\sqrt{10}+\mathrm{argsh}\,3}{2}
      = \frac{3\sqrt{10}+\ln\left(3+\sqrt{10}\right)}{2} \approx 5{,}6526}
      $$

      ### 5 · Comprobación, y una discrepancia con el boletín

      **La cuerda.** El arco va de $(-2,0)$ a $(1,0)$, así que la cuerda mide 3.
      Una curva nunca es más corta que su cuerda:

      $$
      5{,}65 > 3 \quad\checkmark
      $$

      **Cota superior.** El arco cabe dentro del camino que baja del extremo al
      vértice y vuelve a subir. El vértice está en
      $\left(-\frac12,-\frac94\right)$, y esa poligonal mide

      $$
      2\sqrt{\left(\frac32\right)^{2}+\left(\frac94\right)^{2}}
      = 2\sqrt{2{,}25+5{,}0625} \approx 5{,}41
      $$

      que es algo menor que $5{,}65$, como corresponde a una poligonal inscrita
      frente a la curva ✔

      > **Discrepancia con el boletín.** La solución publicada da
      > $L = \frac{\mathrm{argsh}\,3}{2} \approx 0{,}909$. Ese valor es
      > **imposible**: el arco se extiende de $x=-2$ a $x=1$, así que su
      > proyección horizontal ya mide 3, y ninguna curva puede ser más corta que
      > su proyección. Lo que falta es el primer término de la primitiva,
      > $\frac{u\sqrt{1+u^{2}}}{2}$, que aporta $\frac{3\sqrt{10}}{2}
      > \approx 4{,}74$. El resultado completo es $\approx 5{,}65$.

      **Numéricamente**, aproximando el arco por una poligonal de veinte tramos
      se obtiene $5{,}649$, coherente con $5{,}6526$ ✔

  - id: giro-alrededor-de-y-igual-1
    titulo: Girar alrededor de una recta que no es un eje
    fuente: >-
      Ejercicio 5.20 · Problemas complementarios, tema 5 · Cálculo, UPV/EHU ·
      Cayó en 2015/2016 3E
    nivel: practica
    enunciado: |
      Calcular el volumen del cuerpo de revolución generado al girar el dominio
      $D = \left\{f(x) \le 2\,\mathrm{sen}\,x,\ g(x)\ge1,\ 0<x<\pi\right\}$
      alrededor del eje $y=1$. Dibujar el sólido. (2015/2016 3E)

