          </svg>
        consigna: |
          Dibuja las dos fronteras —una recta y una parábola— y sombrea la región
          común. Marca los puntos donde se cortan.
        comprueba:
          - punto: |
              La bisectriz $y=x$, con la región **por encima**.
            porque: |
              $\lvert z-2\rvert>\lvert z-2i\rvert$ dice que $z$ está más cerca de
              $2i$ que de $2$, y eso es arriba a la izquierda. La frontera es la
              mediatriz del segmento que une $2$ y $2i$.
          - punto: |
              La parábola $y=2-\tfrac{x^{2}}{8}$, abierta hacia **abajo**, con
              vértice en $\left(0,2\right)$.
            porque: |
              Sale de $\lvert z\rvert+\operatorname{Im}z<4$ al elevar al
              cuadrado. Es una parábola con foco en el origen y directriz
              $y=4$.
          - punto: |
              Las dos fronteras a **trazos**, porque las dos desigualdades son
              estrictas.
            porque: |
              Ninguna de las dos curvas pertenece a la región, y el dibujo tiene
              que decirlo.
          - punto: |
              Sombreada la región entre las dos: por encima de la recta y por
              debajo de la parábola.
            porque: |
              Es la intersección. Probar el punto $\left(0,1\right)$ —cumple las
              dos— confirma de un vistazo que el sombreado va donde debe.
        veredicto: |
          La recta y la parábola se cortan donde $x=2-\tfrac{x^{2}}{8}$, es decir
          en $x=-4+2\sqrt6\approx0{,}90$ y en un valor negativo grande. La región
          es una franja curva abierta hacia la izquierda.

    resolucion: |
      **Datos.** Se pide la región de los $z$ con

      $$
      |z-2| > |z-2i| \qquad\text{y}\qquad |z| + \operatorname{Im}(z) < 4
      $$

      ### 1 · La herramienta, y por qué basta con ella

      Las dos condiciones están escritas con módulos, y un módulo es una
      distancia. La estrategia es siempre la misma: **traducir cada distancia a
      coordenadas** con $z = x+iy$ y ver qué figura queda como frontera.

      Lo único delicado es que traducir implica **elevar al cuadrado**, y elevar
      al cuadrado solo es una equivalencia cuando los dos miembros son no
      negativos. En la primera condición lo son —son dos módulos, y no hay nada
      que exigir—; en la segunda aparece un $4-y$ que puede ser negativo, y ahí
      sí hay que pararse antes de elevar. Esa diferencia entre las dos es lo que
      de verdad evalúa el ejercicio.

      ### 2 · Primera condición: un semiplano

      $|z-2|$ es la distancia al punto $(2,0)$ y $|z-2i|$ la distancia a
      $(0,2)$. Pedir que la primera sea mayor es pedir estar **más lejos de 2
      que de $2i$**. La frontera —donde son iguales— es la mediatriz del
      segmento que los une, y la desigualdad selecciona uno de los dos
      semiplanos.

      Elevando al cuadrado, que es equivalente por ser los dos miembros no
      negativos:

      $
      (x-2)^{2}+y^{2} > x^{2}+(y-2)^{2}
      $

      $
      x^{2}-4x+4+y^{2} > x^{2}+y^{2}-4y+4
      \;\Longrightarrow\;
      -4x > -4y
      \;\Longrightarrow\;
      y > x
      $

      Los términos cuadráticos se cancelan: por eso la frontera es una recta y
      no una cónica.

      ### 3 · Segunda condición: una parábola

      $
      \sqrt{x^{2}+y^{2}} + y < 4
      \;\Longleftrightarrow\;
      \sqrt{x^{2}+y^{2}} < 4-y
      $

      Antes de elevar al cuadrado hay que exigir que el miembro derecho sea
      positivo: $y < 4$. Con eso:

      $
      x^{2}+y^{2} < 16-8y+y^{2}
      \;\Longrightarrow\;
      x^{2} < 16-8y
      \;\Longrightarrow\;
      y < 2-\frac{x^{2}}{8}
      $

      Y esta condición implica $y \le 2 < 4$, así que la restricción previa se
      cumple sola. Conviene decirlo: no es que no hiciera falta comprobarla, es
      que al comprobarla resulta redundante.

      ### 4 · La región

      Por encima de la recta $y=x$ y por debajo de la parábola
      $y = 2-\frac{x^{2}}{8}$, que tiene el vértice en $(0,2)$ y abre hacia
      abajo.

      Las dos curvas se cortan donde $x = 2-\frac{x^{2}}{8}$, es decir
      $x^{2}+8x-16 = 0$, con soluciones $x = -4 \pm 4\sqrt2$. La región es el
      recinto comprendido entre esos dos cortes, con forma de hoja.

      ### 5 · Comprobación

      Se toma un punto interior, por ejemplo $(-1, 1)$:

      - $y > x$: $1 > -1$ ✔
      - $y < 2-\frac{1}{8} = 1{,}875$: $1 < 1{,}875$ ✔

      Y en las condiciones originales: $|z-2| = |-3+i| = \sqrt{10} \approx 3{,}16$
      y $|z-2i| = |-1-i| = \sqrt2 \approx 1{,}41$, luego $3{,}16 > 1{,}41$ ✔; y
      $|z| + \operatorname{Im}(z) = \sqrt2 + 1 \approx 2{,}41 < 4$ ✔

      ### Resultado

      $$
      \boxed{\;y > x \quad\text{y}\quad y < 2-\frac{x^{2}}{8}\;}
      $$

  # ═══════════════════════════════════════════════════════════════════
  # Boletín básico del tema 1, «Números complejos. Problemas». Los diez
  # problemas. El boletín no publica soluciones: todos los resultados
  # están calculados aquí y comprobados numéricamente.
  # ═══════════════════════════════════════════════════════════════════

  - id: seis-ecuaciones-en-el-plano-complejo
    titulo: Seis ecuaciones que en los reales no tendrían solución
    fuente: Ejercicio 1 · Problemas, tema 1 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Resolver las siguientes ecuaciones:

      (a) $\operatorname{sen}z = -3$ &nbsp;&nbsp;
      (b) $\cos(z-1) = 2$ &nbsp;&nbsp;
      (c) $e^{z} = -2$

      (d) $\operatorname{sen}^{2}z - 5\operatorname{sen}z + 6 = 0$
      &nbsp;&nbsp;
      (e) $e^{iz} = 1+i$ &nbsp;&nbsp;
      (f) $\operatorname{sen}z + \cos z = 1$
    pide: Todas las soluciones complejas de las seis ecuaciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué $\operatorname{sen}z = -3$ sí tiene solución en
          $\mathbb{C}$?
        opciones:
          - texto: >-
              Porque el seno complejo no está acotado: sobre el eje imaginario
              crece como un seno hiperbólico
            correcta: true
            mensaje: |
              Eso es. $\operatorname{sen}(iy) = i\operatorname{senh}y$, que se
              va a infinito. La cota $\lvert\operatorname{sen}x\rvert\le1$ es un
              hecho de la recta real, no del plano.
          - texto: >-
              Porque en $\mathbb{C}$ el seno vale lo mismo pero con signo
              cambiado
            mensaje: |
              El seno complejo extiende al real: coincide con él sobre el eje
              real. Lo que gana es todo lo que pasa fuera de ese eje.
          - texto: >-
              No la tiene: $-3$ está fuera del recorrido
            mensaje: |
              El recorrido del seno **complejo** es todo $\mathbb{C}$. Solo el
              seno real está encerrado entre $-1$ y $1$.

      - tipo: calcular
        titulo: La parte imaginaria del apartado (a)
        pregunta: |
          Las soluciones de $\operatorname{sen}z=-3$ son
          $z=-\tfrac\pi2+2k\pi\pm ci$. ¿Cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '1.762747'
          tolerancia: 0.002
          formato: con seis decimales
        distractores:
          - valor: '1.316958'
            mensaje: |
              $\ln\left(2+\sqrt3\right)$ es la constante del apartado (b),
              donde el segundo miembro es $2$. Aquí es $3$, y sale
              $\ln\left(3+2\sqrt2\right)$.
          - valor: '1.098612'
            mensaje: |
              $\ln 3$ olvida el $2\sqrt2$. La ecuación de segundo grado en
              $e^{iz}$ tiene discriminante $\sqrt{9-1}$, y de ahí sale el
              $2\sqrt2$.
        pista: |
          $c=\ln\left(3+2\sqrt2\right)$, y también es
          $\operatorname{arg\,cosh}3$.
        desarrollo: |
          Con $u=e^{iz}$, de $\dfrac{u-u^{-1}}{2i}=-3$ sale
          $u^{2}+6iu-1=0$, o sea $u=i\left(-3\pm2\sqrt2\right)$. Los dos son
          imaginarios puros negativos, con módulos $3\mp2\sqrt2$, y

          $$
          c = \ln\left(3+2\sqrt2\right) \approx 1{,}762747
          $$

      - tipo: calcular
        titulo: La parte imaginaria del apartado (b)
        pregunta: |
          Las soluciones de $\cos(z-1)=2$ son $z=1+2k\pi\pm ci$. ¿Cuánto vale
          $c$?
        respuesta:
          tipo: numero
          valor: '1.316958'
          tolerancia: 0.002
          formato: con seis decimales
        distractores:
          - valor: '0.693147'
            mensaje: |
              $\ln 2$ olvida el $\sqrt3$, que viene del discriminante
              $\sqrt{4-1}$ de la ecuación de segundo grado en $e^{iw}$.
          - valor: '1.762747'
            mensaje: |
              $\ln\left(3+2\sqrt2\right)$ es la constante del apartado (a),
              donde el segundo miembro es $3$.
        pista: |
          $c=\ln\left(2+\sqrt3\right)$, y también es
          $\operatorname{arg\,cosh}2$.
        desarrollo: |
          Con $w=z-1$ y $u=e^{iw}$: $u^{2}-4u+1=0$, luego $u=2\pm\sqrt3$, real
          positivo. Entonces $iw=\ln\left(2\pm\sqrt3\right)+2k\pi i$ y

          $$
          w = 2k\pi \pm i\ln\left(2+\sqrt3\right)
          \quad\Longrightarrow\quad
          c \approx 1{,}316958
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Todas estas ecuaciones se reducen a una de segundo grado en
              $u=e^{iz}$ —o en $e^{z}$— usando las definiciones exponenciales
              del seno y del coseno.
          - texto: >-
              Resuelta esa ecuación, hay que tomar logaritmo complejo, que es
              multivaluado: de ahí el $2k\pi$.
          - texto: >-
              Las dos raíces $u_1$ y $u_2$ cumplen $u_1u_2=1$ en (a), (b) y
              (d), así que sus logaritmos son opuestos y salen los $\pm$.
          - texto: >-
              Y como el logaritmo complejo es multivaluado, cada ecuación tiene
              infinitas soluciones **con partes imaginarias distintas**.
            trampa: true
            mensaje: |
              La indeterminación del logaritmo afecta a la parte **real** de
              $z$ —el $2k\pi$—, no a la imaginaria. La parte imaginaria toma
              solo dos valores, $\pm c$, uno por cada raíz de la ecuación de
              segundo grado.
        veredicto: |
          El método es siempre el mismo: escribir seno y coseno como
          exponenciales, resolver una ecuación de segundo grado y tomar
          logaritmo complejo. El $2k\pi$ sale del logaritmo y el $\pm$ de las
          dos raíces.
    resolucion: |
      **Las seis.**

      | ap. | soluciones |
      |---|---|
      | (a) | $z=-\tfrac\pi2+2k\pi\pm i\ln\left(3+2\sqrt2\right)$ |
      | (b) | $z=1+2k\pi\pm i\ln\left(2+\sqrt3\right)$ |
      | (c) | $z=\ln 2+i\left(\pi+2k\pi\right)$ |
      | (d) | $z=\tfrac\pi2+2k\pi\pm i\ln\left(2+\sqrt3\right)$ y $z=\tfrac\pi2+2k\pi\pm i\ln\left(3+2\sqrt2\right)$ |
      | (e) | $z=\tfrac\pi4+2k\pi-\tfrac{i}{2}\ln 2$ |
      | (f) | $z=2k\pi$ y $z=\tfrac\pi2+2k\pi$ |

      ### 1 · El método, una sola vez

      $$
      \operatorname{sen}z = \frac{e^{iz}-e^{-iz}}{2i}
      \qquad
      \cos z = \frac{e^{iz}+e^{-iz}}{2}
      $$

      Llamando $u=e^{iz}$, las dos se vuelven racionales en $u$, y al quitar
      denominadores queda una ecuación de segundo grado.

      ### 2 · (a) y (b)

      **(a)** $u^{2}+6iu-1=0 \Rightarrow u=i\left(-3\pm2\sqrt2\right)$. Los dos
      valores son imaginarios puros **negativos**, así que su argumento es
      $-\tfrac\pi2$ y sus módulos $3\mp2\sqrt2$. Como
      $z=-i\operatorname{Log}u$:

      $$
      z = -\frac\pi2+2k\pi - i\ln\left(3\mp2\sqrt2\right)
      = -\frac\pi2+2k\pi \pm i\ln\left(3+2\sqrt2\right)
      $$

      usando que $\ln\left(3-2\sqrt2\right)=-\ln\left(3+2\sqrt2\right)$,
      porque el producto de los dos vale $1$.

      **(b)** $u^{2}-4u+1=0 \Rightarrow u=2\pm\sqrt3$, reales positivos, y

      $$
      z = 1+2k\pi \pm i\ln\left(2+\sqrt3\right)
      $$

      ### 3 · (c) y (e), que son solo logaritmos

      $$
      e^{z}=-2 \;\Longrightarrow\; z=\ln 2+i\left(\pi+2k\pi\right)
      $$

      $$
      e^{iz}=1+i \;\Longrightarrow\; iz=\ln\sqrt2+i\left(\tfrac\pi4+2k\pi\right)
      \;\Longrightarrow\; z=\frac\pi4+2k\pi-\frac{i}{2}\ln 2
      $$

      ### 4 · (d), que son dos ecuaciones

      $$
      \left(\operatorname{sen}z-2\right)\left(\operatorname{sen}z-3\right)=0
      $$

      Las dos se resuelven como (a), con el argumento ahora $+\tfrac\pi2$
      porque las raíces salen imaginarias puras **positivas**.

      ### 5 · (f), que se resuelve sin exponenciales

      $$
      \operatorname{sen}z+\cos z
      = \sqrt2\operatorname{sen}\left(z+\frac\pi4\right) = 1
      \;\Longrightarrow\;
      \operatorname{sen}\left(z+\frac\pi4\right)=\frac{\sqrt2}{2}
      $$

      $$
      z+\frac\pi4 = \frac\pi4+2k\pi
      \quad\text{o}\quad
      z+\frac\pi4 = \frac{3\pi}{4}+2k\pi
      $$

      es decir $z=2k\pi$ o $z=\tfrac\pi2+2k\pi$: **todas reales**. Y tiene
      sentido, porque $1$ está dentro del recorrido real de
      $\operatorname{sen}+\cos$, que llega hasta $\sqrt2$.

      **Lo que hay que llevarse.** En $\mathbb{C}$ ninguna de estas ecuaciones
      es imposible, y el procedimiento no cambia: exponenciales, segundo grado,
      logaritmo. Lo único que hay que vigilar es el argumento del número al que
      se le toma logaritmo — ahí se juega el signo de toda la respuesta.

  - id: el-modulo-y-el-argumento-a-la-vez
    titulo: Un módulo y un argumento a la vez, y una raíz que sobra
    fuente: Ejercicio 2 · Problemas, tema 1 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular los números complejos que cumplen las condiciones
      $\lvert z-3\rvert = 4$ y $\arg(z) = \dfrac{\pi}{4}$.
    pide: Todos los $z$ que cumplen las dos condiciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          Geométricamente, ¿qué se está cortando con qué?
        opciones:
          - texto: >-
              Una circunferencia de centro $3$ y radio $4$ con la **semirrecta**
              que sale del origen en la dirección de $45^\circ$
            correcta: true
            mensaje: |
              Eso es, y la palabra clave es **semirrecta**: $\arg z=\tfrac\pi4$
              no es la recta $y=x$ entera, solo su mitad con $x>0$. Ahí está la
              trampa del ejercicio.
          - texto: >-
              Una circunferencia con la recta $y=x$
            mensaje: |
              La recta $y=x$ incluye también los puntos con $x<0$, cuyo
              argumento es $-\tfrac{3\pi}{4}$, no $\tfrac\pi4$. Cortar con la
              recta entera da dos soluciones, y una es falsa.
          - texto: >-
              Dos circunferencias
            mensaje: |
              $\arg z$ constante no describe una circunferencia: describe una
              semirrecta desde el origen.

      - tipo: calcular
        titulo: La parte real
        pregunta: |
          Escribiendo $z=x+xi$, ¿cuánto vale $x$?
        respuesta:
          tipo: numero
          valor: '3.897916'
          tolerancia: 0.002
          formato: con seis decimales
        distractores:
          - valor: '-0.897916'
            mensaje: |
              Esa es la **otra** raíz de la ecuación de segundo grado, y hay
              que descartarla: con $x<0$ el argumento sale $-\tfrac{3\pi}{4}$,
              no $\tfrac\pi4$.
          - valor: '5.512485'
            mensaje: |
              $5{,}512$ es el **módulo** de $z$, no su parte real. La parte
              real es el módulo dividido entre $\sqrt2$.
        pista: |
          $2x^{2}-6x-7=0$, y $x=\dfrac{3+\sqrt{23}}{2}$.
        desarrollo: |
          Con $z=x+xi$ y $x>0$:

          $$
          \left(x-3\right)^{2}+x^{2} = 16
          \;\Longrightarrow\;
          2x^{2}-6x-7 = 0
          \;\Longrightarrow\;
          x = \frac{3\pm\sqrt{23}}{2}
          $$

          $$
          x = \frac{3+\sqrt{23}}{2} \approx 3{,}897916
          $$

      - tipo: calcular
        titulo: El módulo
        pregunta: |
          ¿Cuánto vale $\lvert z\rvert$?
        respuesta:
          tipo: numero
          valor: '5.512485'
          tolerancia: 0.002
          formato: con seis decimales
        distractores:
          - valor: '3.897916'
            mensaje: |
              $3{,}898$ es la parte real. El módulo es $x\sqrt2$, porque la
              parte imaginaria vale lo mismo que la real.
          - valor: '7'
            mensaje: |
              $7$ sería $3+4$: el punto más lejano de la circunferencia visto
              desde el origen, que está sobre el eje real y no sobre la
              semirrecta de $45^\circ$.
        pista: |
          $\lvert z\rvert = x\sqrt2$ porque las dos componentes son iguales.
        desarrollo: |
          $$
          \lvert z\rvert = x\sqrt2
          = \frac{3+\sqrt{23}}{2}\cdot\sqrt2 \approx 5{,}512485
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $\arg z=\tfrac\pi4$ obliga a $z=x+xi$ con $x>0$: la semirrecta,
              no la recta.
          - texto: >-
              Sustituyendo en $\lvert z-3\rvert=4$ sale
              $2x^{2}-6x-7=0$, con raíces $\tfrac{3\pm\sqrt{23}}{2}$.
          - texto: >-
              La negativa se descarta **por la condición del argumento**, no
              por la del módulo: también está en la circunferencia.
          - texto: >-
              Y por eso el sistema es incompatible si el origen queda dentro de
              la circunferencia.
            trampa: true
            mensaje: |
              Al revés: como el origen está **dentro** de la circunferencia
              —la distancia del centro al origen es $3$ y el radio es $4$—,
              toda semirrecta que salga del origen la corta exactamente una
              vez. Por eso hay solución, y solo una.
        veredicto: |
          El origen está dentro de la circunferencia, así que cualquier
          semirrecta desde él la corta una sola vez. Ese argumento geométrico
          predice de antemano que la solución es única, y explica cuál de las
          dos raíces sobra.
    resolucion: |
      **Resultado.** Hay **una sola** solución:

      $$
      z = \frac{3+\sqrt{23}}{2}\left(1+i\right)
      \approx 3{,}897916 + 3{,}897916\,i
      $$

      con módulo $\lvert z\rvert\approx5{,}512485$.

      ### 1 · Traducir las dos condiciones

      $\lvert z-3\rvert=4$ es la circunferencia de centro $\left(3,0\right)$ y
      radio $4$. $\arg z=\tfrac\pi4$ es la **semirrecta** que sale del origen
      con pendiente $1$ hacia el primer cuadrante — el origen excluido, porque
      $\arg 0$ no está definido.

      ### 2 · La cuenta

      Sobre la semirrecta, $z=x+xi$ con $x>0$:

      $$
      \left(x-3\right)^{2}+x^{2}=16
      \;\Longrightarrow\;
      2x^{2}-6x-7=0
      \;\Longrightarrow\;
      x=\frac{3\pm\sqrt{23}}{2}
      $$

      $$
      x_1 = \frac{3+\sqrt{23}}{2}\approx 3{,}8979
      \qquad
      x_2 = \frac{3-\sqrt{23}}{2}\approx -0{,}8979
      $$

      ### 3 · Por qué sobra una

      $x_2$ es negativa, y el punto $-0{,}898-0{,}898i$ **sí** está en la
      circunferencia:

      $$
      \lvert -0{,}898-0{,}898i-3\rvert
      = \lvert -3{,}898-0{,}898i\rvert = 4 \;\checkmark
      $$

      Lo que no cumple es la condición del argumento: el suyo es
      $-\tfrac{3\pi}{4}$. Aparece porque al escribir $z=x+xi$ **sin exigir
      $x>0$** se ha sustituido la semirrecta por la recta entera.

      ### 4 · Comprobación

      $$
      \lvert z-3\rvert
      = \lvert 0{,}897916+3{,}897916\,i\rvert
      = \sqrt{0{,}80626+15{,}19374} = \sqrt{16} = 4 \;\checkmark
      $$

      **Lo que hay que llevarse.** Un argumento fijo es media recta. Al
      parametrizar, la condición $x>0$ no es un detalle: es la mitad del
      enunciado, y es lo que decide cuál de las dos raíces es la respuesta.

  - id: la-recta-y-la-circunferencia-de-un-cociente
    titulo: Cuándo un cociente es real, y cuándo es imaginario puro
    fuente: Ejercicio 3 · Problemas, tema 1 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Sean $z\in\mathbb{C}$ y $w=\dfrac{z-2}{z-i}$.

      (a) Demostrar que si $w$ está en el eje real, $z$ está en la recta que
      pasa por los puntos $\left(2,0\right)$ y $\left(0,1\right)$.

      (b) Si $w$ está en el eje imaginario, calcular
      $\left\lvert z-1-\dfrac{i}{2}\right\rvert$.
    pide: La recta del apartado (a) y el módulo del apartado (b).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué significa geométricamente que $\dfrac{z-2}{z-i}$ sea real?
        opciones:
          - texto: >-
              Que los vectores $z-2$ y $z-i$ son **paralelos**, porque su
              cociente no gira nada
            correcta: true
            mensaje: |
              Eso es. El argumento de un cociente es la diferencia de
              argumentos; que sea $0$ o $\pi$ significa que los dos vectores
              apuntan en la misma dirección. Y eso ocurre exactamente cuando
              $z$, $2$ e $i$ están alineados.
          - texto: >-
              Que $z$ es real
            mensaje: |
              El cociente puede ser real sin que $z$ lo sea: por ejemplo con
              $z=1+\tfrac{i}{2}$, que está en la recta que une $2$ con $i$.
          - texto: >-
              Que $\lvert z-2\rvert = \lvert z-i\rvert$
            mensaje: |
              Eso diría que el **módulo** del cociente es $1$, que es otra
              condición: la mediatriz del segmento. Ser real es una condición
              sobre el **argumento**.

      - tipo: verificar
        pregunta: |
          Escribe en $x$ e $y$ el lugar de los $z$ para los que $w$ es
          imaginario puro. La figura comprobará si tu región coincide con la
          del enunciado.
        condicion: 'Re((z-2)/(z-i)) = 0'
        ventana:
          x: [-1.5, 3.5]
          y: [-1.5, 2.5]
        formato: una ecuacion en x e y; usa ^2 para los cuadrados
        pista: |
          Si $z-2$ y $z-i$ son perpendiculares, $z$ ve el segmento que une $2$
          con $i$ bajo un ángulo recto. Eso es una circunferencia, y el
          segmento es su diámetro.
        desarrollo: |
          Con $z=x+iy$, multiplicando numerador y denominador por el conjugado
          del denominador, la parte real de $w$ es

          $$
          \operatorname{Re}w
          = \frac{\left(x-2\right)x+\left(y\right)\left(y-1\right)}
          {x^{2}+\left(y-1\right)^{2}}
          $$

          Anularla equivale a $x^{2}-2x+y^{2}-y=0$, o sea

          $$
          \left(x-1\right)^{2}+\left(y-\tfrac12\right)^{2} = \frac54
          $$

          la circunferencia de centro $1+\tfrac{i}{2}$ y radio
          $\tfrac{\sqrt5}{2}$ — con los puntos $2$ e $i$ excluidos, porque ahí
          $w$ vale $0$ o no existe.

      - tipo: calcular
        titulo: El módulo que se pide
        pregunta: |
          ¿Cuánto vale $\left\lvert z-1-\tfrac{i}{2}\right\rvert$?
        respuesta:
          tipo: numero
          valor: '1.118034'
          tolerancia: 0.002
          formato: con seis decimales
        distractores:
          - valor: '2.236068'
            mensaje: |
              $\sqrt5$ es la **distancia entre $2$ e $i$**, o sea el diámetro.
              El radio es la mitad.
          - valor: '0.559017'
            mensaje: |
              $\tfrac{\sqrt5}{4}$ divide dos veces. El diámetro es $\sqrt5$ y
              el radio $\tfrac{\sqrt5}{2}$.
        pista: |
          $1+\tfrac{i}{2}$ es el punto medio entre $2$ e $i$: la pregunta es
          por el radio de la circunferencia.
        desarrollo: |
          $$
          \left\lvert z-1-\frac{i}{2}\right\rvert = \frac{\sqrt5}{2}
          \approx 1{,}118034
          $$

          porque $1+\tfrac{i}{2}$ es el centro y $\tfrac{\sqrt5}{2}$ el radio.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $\arg\dfrac{z-2}{z-i} = \arg\left(z-2\right)
              - \arg\left(z-i\right)$: es el ángulo que gira uno respecto del
              otro.
          - texto: >-
              Si ese ángulo es $0$ o $\pi$, los vectores son paralelos y $z$
              está en la recta que une $2$ con $i$.
          - texto: >-
              Si es $\pm\tfrac\pi2$, son perpendiculares y $z$ ve el segmento
              bajo ángulo recto: circunferencia de diámetro ese segmento.
          - texto: >-
              Y en los dos casos hay que excluir $z=2$, donde el cociente vale
              $0$ y el argumento no está definido.
            trampa: true
            mensaje: |
              Hay que excluir dos puntos, no uno: $z=i$ también, porque ahí el
              **denominador** se anula y $w$ ni siquiera existe. El $z=2$ se
              excluye por el argumento; el $z=i$, porque el cociente no está
              definido. Son dos motivos distintos y los dos cuentan.
        veredicto: |
          Toda la geometría de este ejercicio cabe en una frase: el argumento
          de un cociente es el ángulo bajo el que $z$ ve el segmento que une
          los dos puntos. Ángulo $0$ da la recta; ángulo recto, la
          circunferencia de ese diámetro.
    resolucion: |
      **Resultados.** En (a), la recta $\tfrac{x}{2}+y=1$. En (b),
      $\left\lvert z-1-\tfrac{i}{2}\right\rvert = \dfrac{\sqrt5}{2}
      \approx 1{,}118034$.

      ### 1 · La idea que resuelve los dos apartados

      $$
      \arg\frac{z-2}{z-i} = \arg\left(z-2\right)-\arg\left(z-i\right)
      $$

      es el ángulo, medido en $z$, entre los vectores que van de $z$ a $2$ y de
      $z$ a $i$. Con signo cambiado: es el ángulo bajo el que **$z$ ve el
      segmento** de extremos $2$ e $i$.

      ### 2 · (a), el caso del ángulo llano

      $w$ real $\iff$ ese ángulo es $0$ o $\pi$ $\iff$ los tres puntos están
      alineados $\iff$ $z$ está en la recta que pasa por $\left(2,0\right)$ y
      $\left(0,1\right)$:

      $$
      \frac{x}{2}+y = 1
      $$

      **La demostración con cuentas**, por si se pide:

      $$
      w = \frac{z-2}{z-i}
      = \frac{\left(x-2+iy\right)\left(x-i\left(y-1\right)\right)}
      {x^{2}+\left(y-1\right)^{2}}
      $$

      La parte imaginaria del numerador es

      $$
      xy - \left(x-2\right)\left(y-1\right) = x+2y-2
      $$

      y anularla da $x+2y=2$, que es la recta anunciada. Hay que excluir
      $z=i$, donde $w$ no existe.

      ### 3 · (b), el caso del ángulo recto

      $w$ imaginario puro $\iff$ el ángulo es $\pm\tfrac\pi2$ $\iff$ $z$ ve el
      segmento bajo un ángulo recto. Por el **arco capaz de $90^\circ$**, eso
      es la circunferencia que tiene ese segmento por diámetro:

      $$
      \text{centro} = \frac{2+i}{2} = 1+\frac{i}{2}
      \qquad
      \text{radio} = \frac{\lvert 2-i\rvert}{2} = \frac{\sqrt5}{2}
      $$

      Y la pregunta del enunciado —$\left\lvert z-1-\tfrac{i}{2}\right\rvert$—
      es exactamente la distancia de $z$ a ese centro:

      $$
      \left\lvert z-1-\frac{i}{2}\right\rvert = \frac{\sqrt5}{2}
      \approx 1{,}118034
      $$

      **Está preguntando por el radio sin decirlo.**

      ### 4 · Comprobación con cuentas

      $\operatorname{Re}w=0$ equivale a
      $\left(x-2\right)x+y\left(y-1\right)=0$, o sea
      $x^{2}-2x+y^{2}-y=0$. Completando cuadrados:

      $$
      \left(x-1\right)^{2}+\left(y-\tfrac12\right)^{2} = 1+\tfrac14 = \tfrac54
      $$

      radio $\sqrt{\tfrac54}=\tfrac{\sqrt5}{2}$ ✓

      **Lo que hay que llevarse.** Cuando aparece
      $\arg\tfrac{z-a}{z-b}$, no hay que desarrollar nada: es el ángulo bajo el
      que se ve el segmento $ab$. Constante $0$ o $\pi$, la recta; constante
      $\pm\tfrac\pi2$, la circunferencia de diámetro $ab$; cualquier otro
      valor, un arco capaz.

  - id: ocho-regiones-del-boletin
    titulo: Ocho regiones, y la que esconde una circunferencia de Apolonio
    fuente: Ejercicio 4 · Problemas, tema 1 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular y representar gráficamente los afijos de los números complejos
      $z$ que verifican las condiciones siguientes:

      (a) $\operatorname{Im}(z)=3$ &nbsp;&nbsp;
      (b) $\operatorname{Re}(z)\ge-1$ &nbsp;&nbsp;
      (c) $\lvert z\rvert = 1$ &nbsp;&nbsp;
      (d) $\lvert z+i\rvert \le 1$

      (e) $\lvert z\rvert \ge \lvert z-i\rvert$ &nbsp;&nbsp;
      (f) $\left\lvert\dfrac{z-1}{z-i}\right\rvert > 2$ &nbsp;&nbsp;
      (g) $\lvert z\rvert + \operatorname{Re}(z) = 2$ &nbsp;&nbsp;
      (h) $\lvert z-4i\rvert + \lvert z+4i\rvert = 10$
    pide: Las ocho regiones, descritas y dibujadas.
    pasos:
      - tipo: reconocer
        pregunta: |
          La (e) dice $\lvert z\rvert \ge \lvert z-i\rvert$. ¿Qué es?
        opciones:
          - texto: >-
              El semiplano $y\ge\tfrac12$: los puntos que están más cerca de
              $i$ que del origen
            correcta: true
            mensaje: |
              Eso es. Cuando los dos módulos van con **el mismo peso**, la
              frontera es la mediatriz del segmento — aquí la horizontal
              $y=\tfrac12$— y la desigualdad selecciona uno de los dos
              semiplanos.
          - texto: >-
              Una circunferencia
            mensaje: |
              Con pesos distintos sí saldría una circunferencia, la de
              Apolonio, y es lo que pasa en la (f). Con pesos iguales el
              término cuadrático se cancela y queda una recta.
          - texto: >-
              El semiplano $y\le\tfrac12$
            mensaje: |
              Revisa el sentido: $\lvert z\rvert\ge\lvert z-i\rvert$ dice que
              $z$ está **más lejos del origen** que de $i$, o sea más arriba.

      - tipo: verificar
        pregunta: |
          Escribe en $x$ e $y$ la región del apartado (f). La figura
          comprobará si coincide con la del enunciado.
        condicion: '|(z-1)/(z-i)| > 2'
        ventana:
          x: [-2, 1.5]
          y: [-0.5, 3]
        formato: una desigualdad en x e y; usa ^2 para los cuadrados
        pista: |
          Pasa el denominador multiplicando y eleva al cuadrado:
          $\lvert z-1\rvert^{2} > 4\lvert z-i\rvert^{2}$. Al agrupar quedan
          términos en $x^{2}$ e $y^{2}$ que **no se cancelan**, así que la
          frontera es una circunferencia.
        desarrollo: |
          $$
          \left(x-1\right)^{2}+y^{2}
          > 4\left[x^{2}+\left(y-1\right)^{2}\right]
          $$

          $$
          0 > 3x^{2}+3y^{2}+2x-8y+3
          $$

          Dividiendo entre $3$ y completando cuadrados:

          $$
          \left(x+\frac13\right)^{2}+\left(y-\frac43\right)^{2} < \frac89
          $$

          El **interior** de la circunferencia de centro
          $\left(-\tfrac13,\tfrac43\right)$ y radio
          $\tfrac{2\sqrt2}{3}\approx0{,}9428$.

      - tipo: calcular
        titulo: El radio de la circunferencia de Apolonio
        pregunta: |
          ¿Cuánto vale el radio de la circunferencia frontera del apartado (f)?
        respuesta:
          tipo: numero
          valor: '0.942809'
          tolerancia: 0.002
          formato: con seis decimales
        distractores:
          - valor: '0.888889'
            mensaje: |
              $\tfrac89$ es el radio **al cuadrado**. Falta la raíz:
              $\sqrt{\tfrac89}=\tfrac{2\sqrt2}{3}$.
          - valor: '2.828427'
            mensaje: |
              $2\sqrt2$ olvida dividir entre $3$. El radio es
              $\tfrac{2\sqrt2}{3}$.
        pista: |
          $\sqrt{\tfrac89} = \tfrac{2\sqrt2}{3}$.
        desarrollo: |
          $$
          r = \sqrt{\frac89} = \frac{2\sqrt2}{3} \approx 0{,}942809
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con dos distancias al mismo peso, los términos cuadráticos se
              cancelan y la frontera es una **recta**: la mediatriz. Es la (e).
          - texto: >-
              Con pesos distintos no se cancelan y la frontera es una
              **circunferencia**, la de Apolonio. Es la (f).
          - texto: >-
              Y una **suma** de distancias a dos puntos fijos es una elipse:
              es la (h), de focos $\pm4i$.
          - texto: >-
              Y la (g), que suma un módulo con una coordenada, también es una
              elipse porque hay una suma de por medio.
            trampa: true
            mensaje: |
              La (g) es una **parábola**. Suma una distancia a un punto —el
              origen— con una distancia a una recta —la vertical $x=2$—, y
              esa es la definición de parábola: foco el origen, directriz
              $x=2$.
        veredicto: |
          Cuatro formas y cuatro firmas: dos distancias iguales dan recta; dos
          distancias con pesos distintos, circunferencia; la suma de dos
          distancias, elipse; una distancia a un punto igualada a una distancia
          a una recta, parábola.
      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 690 338" role="img" width="690" height="338"
               aria-labelledby="f-ocho-regiones-t f-ocho-regiones-d">
            <title id="f-ocho-regiones-t">Las ocho regiones del boletín, cada una en sus propios ejes</title>
            <desc id="f-ocho-regiones-d">Ocho dibujos pequeños e independientes, uno por apartado. Una recta horizontal a altura tres; un semiplano a la derecha de x igual a menos uno; la circunferencia unidad; el disco de centro menos i y radio uno; el semiplano por encima de y igual a un medio; el interior de una circunferencia de Apolonio de centro en (−1/3 ; 4/3); una parábola abierta hacia la izquierda con vértice en el uno; y una elipse con el eje mayor vertical y los focos en más y menos cuatro i.</desc>
            <style>
                .f-ocho-regiones-eje { stroke: var(--rule); stroke-width: 1.1; fill: none; }
                .f-ocho-regiones-c { stroke: var(--d1); stroke-width: 2.8; fill: none; }
                .f-ocho-regiones-c2 { stroke: var(--alt); stroke-width: 2.8; fill: none; }
                .f-ocho-regiones-cp { stroke: var(--d1); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
                .f-ocho-regiones-cp2 { stroke: var(--alt); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
                .f-ocho-regiones-g { stroke: var(--faint); stroke-width: 1.1; fill: none; stroke-dasharray: 3 3; }
