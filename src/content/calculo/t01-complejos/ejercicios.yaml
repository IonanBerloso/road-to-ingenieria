ejercicios:
  - id: potencia-novena
    titulo: Potencia novena en forma binómica
    fuente: >-
      Ejercicio 1.1 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU
      (2014/2015 7E)

    enunciado: |
      Sea el número complejo

      $$
      z = -\frac{\sqrt{3}}{2} - \frac{i}{2}
      $$
    pide: Calcular $z^{9}$, dando el resultado en forma binómica.

    pasos:
      # ── COMP1 ────────────────────────────────────────────────────────
      - tipo: reconocer
        pregunta: |
          Antes de tocar nada: ¿qué camino lleva a $z^{9}$ sin que se te vaya
          la tarde?
        opciones:
          - texto: Pasar $z$ a forma polar y aplicar De Moivre
            correcta: true
            mensaje: |
              Eso es. En polar, elevar a la novena es elevar el módulo y
              multiplicar el argumento por nueve. Dos operaciones, cero
              productos de binomios.
          - texto: Desarrollar la potencia con el binomio de Newton
            mensaje: |
              Se puede, y da lo mismo, pero son diez sumandos con potencias de
              $i$ y de $\sqrt{3}$ que hay que reducir una a una. En un examen es
              donde aparecen los errores de signo y donde se agota el tiempo.
          - texto: Multiplicar $z$ por sí mismo nueve veces
            mensaje: |
              Llegas, pero arrastras cada error hasta el final y no tienes forma
              de comprobar el resultado. Un fallo de signo en el segundo
              producto te cuesta el ejercicio entero y no te enteras.
          - texto: Calcular $|z|^{9}$, que es lo que pide la potencia
            mensaje: |
              El módulo es solo la mitad de la información. Sin el argumento no
              tienes un número complejo, tienes una distancia al origen: hay
              infinitos complejos con ese mismo módulo.

      # ── COMP2 · el módulo ────────────────────────────────────────────
      - tipo: calcular
        titulo: Módulo de z
        pregunta: ¿Cuánto vale $|z|$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1.366'
            mensaje: |
              Has sumado las dos componentes en valor absoluto:
              $\frac{\sqrt3}{2}+\frac12 \approx 1{,}366$. El módulo no es la
              suma de los catetos, es la hipotenusa:
              $\sqrt{a^{2}+b^{2}}$.
          - valor: '0.866'
            mensaje: |
              Eso es $\frac{\sqrt3}{2}$, solo la parte real. Te falta la parte
              imaginaria: $\sqrt{\left(\frac{\sqrt3}{2}\right)^{2} +
              \left(\frac12\right)^{2}}$.
          - valor: '-1'
            mensaje: |
              El módulo es una distancia, así que nunca es negativo. Que las dos
              componentes sean negativas no arrastra el signo: se elevan al
              cuadrado antes de sumarlas.
        pista: |
          $|z| = \sqrt{a^{2}+b^{2}}$ con $a = -\frac{\sqrt3}{2}$ y
          $b = -\frac12$. Fíjate en que $\frac34 + \frac14$ es un número
          especialmente cómodo.
        desarrollo: |
          $$
          |z| = \sqrt{\left(-\frac{\sqrt{3}}{2}\right)^{2} + \left(-\frac{1}{2}\right)^{2}}
              = \sqrt{\frac{3}{4} + \frac{1}{4}} = \sqrt{1} = 1
          $$
        veredicto: |
          Módulo 1: el afijo de $z$ está **en la circunferencia unidad**. Eso
          tiene consecuencias — $|z^{9}| = |z|^{9} = 1$, así que cualquier
          resultado final con módulo distinto de 1 está mal sin necesidad de
          revisar nada más.

      # ── COMP4 · el argumento, que es donde se pierde el ejercicio ────
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que justifica el valor de $\arg z$. Una de las
          piezas no debe entrar.
        piezas:
          - texto: |
              $z$ tiene parte real $-\frac{\sqrt3}{2}$ y parte imaginaria
              $-\frac12$: las dos negativas, luego su afijo está en el
              **tercer cuadrante**.
          - texto: |
              $\tan\theta = \dfrac{b}{a} = \dfrac{-1/2}{-\sqrt3/2} =
              \dfrac{1}{\sqrt3}$, y en $[0,2\pi)$ hay **dos** ángulos que lo
              cumplen: $\pi/6$ y $7\pi/6$.
          - texto: |
              Como $\arctan\frac{1}{\sqrt3} = \frac{\pi}{6}$, el argumento es
              $\theta = \frac{\pi}{6}$.
            trampa: true
            mensaje: |
              Esta es la pieza envenenada, y es el error que más veces cuesta
              este ejercicio. $\arctan$ devuelve siempre un ángulo entre
              $-\pi/2$ y $\pi/2$: te deja en el primer o el cuarto cuadrante,
              nunca en el tercero. Con este $z$ obtienes el argumento de
              $\frac{\sqrt3}{2}+\frac{i}{2}$ — el número contrario— y como el
              módulo sale bien, nada te avisa. El resultado final aparece girado
              media vuelta.
          - texto: |
              De los dos, el que cae en el tercer cuadrante es $7\pi/6$. Por
              tanto $\arg z = \frac{7\pi}{6}$.
          - texto: |
              Comprobación: $\cos\frac{7\pi}{6} = -\frac{\sqrt3}{2}$ y
              $\sin\frac{7\pi}{6} = -\frac12$, que son exactamente las dos
              componentes de $z$.
        veredicto: |
          El orden importa menos que el hábito: mirar el cuadrante **antes** de
          tocar la calculadora.

      # ── COMP2 · el resultado ─────────────────────────────────────────
      - tipo: calcular
        titulo: La potencia, en forma binómica
        pregunta: |
          Con $z = e^{i7\pi/6}$, aplica De Moivre y escribe $z^{9}$ en forma
          binómica.
        respuesta:
          tipo: complejo
          valor: 'i'
          tolerancia: 0.02
          formato: forma binómica, tipo a+bi
        distractores:
          - valor: '-i'
            mensaje: |
              Has usado $\theta = \pi/6$ en vez de $7\pi/6$: es el argumento de
              $\frac{\sqrt3}{2}+\frac{i}{2}$, no el de $z$. Como la diferencia
              es exactamente $\pi$ y el exponente es impar, el resultado sale
              girado media vuelta: $-i$ en lugar de $i$. Es el error del
              $\arctan$, llegando hasta el final sin que nada lo delate.
          - valor: '1'
            mensaje: |
              Has invertido la razón: $\tan\theta = b/a$, no $a/b$. Con
              $\arctan\sqrt3 = \pi/3$ acabas en $\theta = 4\pi/3$, y
              $9\cdot\frac{4\pi}{3} = 12\pi$, que son seis vueltas exactas y te
              deja en el 1. Comprueba siempre cuál de los dos números va arriba.
          - valor: '0.32-0.95i'
            mensaje: |
              El razonamiento está bien y la calculadora está en radianes
              mientras tú piensas en grados. Has evaluado
              $\cos(1890) + i\,\sin(1890)$ tomando 1890 como radianes; esos
              $1890$ eran **grados**, y en grados hay que reducirlos restando
              vueltas de $360$.
          - valor: '16.59i'
            mensaje: |
              La dirección es correcta, pero el módulo no: has elevado a la
              novena $\frac{\sqrt3}{2}+\frac12 \approx 1{,}366$ en vez de 1. Es
              el error del paso del módulo arrastrado hasta aquí. Y aquí se caza
              solo: si $|z| = 1$, entonces $|z^{9}| = 1$.
        pista: |
          De Moivre: $z^{9} = |z|^{9}\,e^{i\,9\theta}$. Con $|z| = 1$ el módulo
          no da trabajo; todo está en reducir $9\cdot\frac{7\pi}{6}$ restando
          vueltas enteras de $2\pi$.
        desarrollo: |
          $$
          z^{9} = 1^{9}\,e^{i\,9\cdot\frac{7\pi}{6}}
                = e^{i\frac{63\pi}{6}}
                = e^{i\frac{21\pi}{2}}
          $$

          Se reduce el argumento restando vueltas completas:

          $$
          \frac{21\pi}{2} - 5\cdot 2\pi = \frac{21\pi}{2} - \frac{20\pi}{2} = \frac{\pi}{2}
          $$

          Y se pasa a binómica:

          $$
          z^{9} = \cos\frac{\pi}{2} + i\,\sin\frac{\pi}{2} = 0 + i\cdot 1 = i
          $$
        veredicto: |
          En grados sale igual de claro: $9 \cdot 210^{\circ} = 1890^{\circ}$, y
          $1890 = 5\cdot 360 + 90$. Cinco vueltas y un cuarto de vuelta.

    resolucion: |
      **Datos.** $z = -\dfrac{\sqrt{3}}{2} - \dfrac{i}{2}$. Se pide $z^{9}$ en
      forma binómica.

      ### 1 · Herramienta y por qué se puede aplicar

      Se usa la **fórmula de De Moivre**: si $z = r\,e^{i\theta}$ con
      $r = |z|$ y $\theta = \arg z$, entonces

      $$
      z^{n} = r^{n} e^{i n\theta}, \qquad n \in \mathbb{Z}
      $$

      La fórmula exige tener $z$ escrito en forma polar, y no impone ninguna
      condición adicional sobre $z$ salvo $z \neq 0$ cuando el exponente es
      negativo. Aquí $z \neq 0$ y $n = 9 > 0$, así que es aplicable sin
      restricciones. El trabajo previo es obtener $r$ y $\theta$.

      ### 2 · Módulo

      $$
      r = |z| = \sqrt{a^{2}+b^{2}}
              = \sqrt{\left(-\frac{\sqrt{3}}{2}\right)^{2} + \left(-\frac{1}{2}\right)^{2}}
              = \sqrt{\frac{3}{4} + \frac{1}{4}}
              = \sqrt{1} = 1
      $$

      El afijo de $z$ está en la circunferencia unidad. Esto se usará al final
      como comprobación: si $|z| = 1$, entonces $|z^{9}| = 1^{9} = 1$.

      ### 3 · Argumento

      Las dos componentes de $z$ son negativas, luego su afijo está en el
      **tercer cuadrante**. La condición que define el argumento es

      $$
      \tan\theta = \frac{b}{a} = \frac{-1/2}{-\sqrt{3}/2} = \frac{1}{\sqrt{3}}
      $$

      y en $[0,2\pi)$ la cumplen **dos** ángulos: $\theta = \pi/6$ y
      $\theta = 7\pi/6$. Hay que quedarse con el del tercer cuadrante:

      $$
      \arg z = \frac{7\pi}{6}
      $$

      Escribir $\theta = \arctan\frac{1}{\sqrt3} = \frac{\pi}{6}$ sería un
      error: $\arctan$ toma valores en $(-\pi/2, \pi/2)$ y por tanto nunca
      devuelve un ángulo del tercer cuadrante. Se comprueba que el elegido es
      el correcto:

      $$
      \cos\frac{7\pi}{6} = -\frac{\sqrt{3}}{2}, \qquad
      \sin\frac{7\pi}{6} = -\frac{1}{2}
      $$

      que son exactamente la parte real y la parte imaginaria de $z$. Por tanto

      $$
      z = 1\cdot e^{i\frac{7\pi}{6}} = e^{i\frac{7\pi}{6}}
      $$

      ### 4 · Aplicación de De Moivre

      $$
      z^{9} = 1^{9}\,e^{i\,9\cdot\frac{7\pi}{6}}
            = e^{i\frac{63\pi}{6}}
            = e^{i\frac{21\pi}{2}}
      $$

      El argumento se reduce al intervalo $[0,2\pi)$ restando vueltas completas:

      $$
      \frac{21\pi}{2} - 5\cdot 2\pi = \frac{21\pi}{2} - \frac{20\pi}{2} = \frac{\pi}{2}
      $$

      ### 5 · Paso a forma binómica

      $$
      z^{9} = \cos\frac{\pi}{2} + i\,\sin\frac{\pi}{2} = 0 + i\cdot 1
      $$

      ### 6 · Comprobación

      Dos comprobaciones independientes, que cuestan veinte segundos:

      - **Módulo.** $|z| = 1 \Rightarrow |z^{9}| = 1$, y en efecto $|i| = 1$.
        Cualquier resultado con módulo distinto de 1 habría estado mal.
      - **En grados.** $\arg z = 7\pi/6 = 210^{\circ}$, y
        $9 \cdot 210^{\circ} = 1890^{\circ} = 5\cdot 360^{\circ} + 90^{\circ}$:
        cinco vueltas completas y un cuarto de vuelta, que deja el afijo en el
        semieje imaginario positivo.

      ### Resultado

      $$
      \boxed{\;z^{9} = i\;}
      $$

  - id: suma-conjugados
    titulo: Suma de dos potencias décimas
    fuente: >-
      Ejercicio 1.2 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU
      (2017/2018 6E)

    enunciado: |
      $$
      \left(\frac{1+i}{\sqrt{2}}\right)^{10} + \left(\frac{1-i}{\sqrt{2}}\right)^{10}
      $$
    pide: Calcular la suma y representar gráficamente el resultado.

    pasos:
      # ── COMP1 ────────────────────────────────────────────────────────
      - tipo: reconocer
        pregunta: |
          Mira las dos bases antes de calcular nada. ¿Qué observación te ahorra
          la mitad del trabajo?
        opciones:
          - texto: |
              La segunda base es la conjugada de la primera, así que la suma es
              dos veces la parte real de la primera potencia
            correcta: true
            mensaje: |
              Eso es. Si $w = \overline{z}$, entonces $w^{10} =
              \left(\overline{z}\right)^{10}$, que es la conjugada de $z^{10}$;
              y un número más su conjugado es $2\operatorname{Re}$. Calculas una
              potencia y la otra sale gratis.
          - texto: Elevar las dos a la décima por separado, cada una en forma polar
            mensaje: |
              Llegas, y no está mal, pero haces el doble de trabajo. Fíjate en
              qué relación hay entre $1+i$ y $1-i$: no son dos números
              cualesquiera.
          - texto: Sumar primero las dos bases y elevar el resultado a la décima
            mensaje: |
              Eso no vale nunca: $(a+b)^{n} \neq a^{n} + b^{n}$. Aquí daría
              $\left(\frac{2}{\sqrt2}\right)^{10} = 32$, que no tiene nada que
              ver con la respuesta.
          - texto: Las dos bases son opuestas, así que los dos términos se cancelan
            mensaje: |
              $1-i$ no es $-(1+i)$, que sería $-1-i$. Y aunque lo fuera, el
              exponente es **par**: $(-z)^{10} = z^{10}$, así que los términos
              se sumarían en vez de cancelarse.

      # ── COMP2 · el módulo de la base ─────────────────────────────────
      - tipo: calcular
        titulo: Módulo de la base
        pregunta: ¿Cuánto vale $\left|\dfrac{1+i}{\sqrt{2}}\right|$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1.41421356'
            mensaje: |
              Has calculado $|1+i| = \sqrt2$ y te has dejado el denominador. El
              módulo de un cociente es el cociente de los módulos:
              $\sqrt2/\sqrt2 = 1$.
          - valor: '0.70710678'
            mensaje: |
              Has dividido $\sqrt2$ entre 2 en lugar de entre $\sqrt2$. El
              denominador de la base es $\sqrt2$, no 2.
          - valor: '2'
            mensaje: |
              Eso es $|1+i|^{2} = a^{2}+b^{2}$, sin la raíz, y además sin
              dividir. Repasa las dos cosas.
        pista: |
          $\left|\dfrac{z}{w}\right| = \dfrac{|z|}{|w|}$, y $|1+i| = \sqrt{2}$.
        desarrollo: |
          $$
          \left|\frac{1+i}{\sqrt{2}}\right| = \frac{|1+i|}{\sqrt{2}}
            = \frac{\sqrt{1^{2}+1^{2}}}{\sqrt{2}} = \frac{\sqrt{2}}{\sqrt{2}} = 1
          $$
        veredicto: |
          Módulo 1: las dos bases están en la circunferencia unidad, así que
          elevarlas a la décima **no cambia su tamaño**, solo las gira. El
          resultado tendrá módulo 1 o será 0 si los giros se compensan.

      # ── COMP2 · la primera potencia ──────────────────────────────────
      - tipo: calcular
        titulo: La primera potencia
        pregunta: |
          Con $z = \dfrac{1+i}{\sqrt2} = e^{i\pi/4}$, ¿cuánto vale $z^{10}$ en
          forma binómica?
        respuesta:
          tipo: complejo
          valor: 'i'
          tolerancia: 0.02
          formato: forma binómica, tipo a+bi
        distractores:
          - valor: '-i'
            mensaje: |
              Signo cambiado. $10\cdot\frac{\pi}{4} = \frac{5\pi}{2}$, y al
              restar una vuelta entera queda $\frac{\pi}{2}$, no
              $-\frac{\pi}{2}$. Cuidado con restar $2\pi$ de más: $\frac{5\pi}{2}
              - 2\pi = \frac{\pi}{2}$, y ahí hay que parar.
          - valor: '32i'
            mensaje: |
              Has elevado $1+i$ y te has dejado el denominador:
              $(1+i)^{10} = 32i$, pero hay que dividir entre
              $(\sqrt2)^{10} = 32$. El módulo de la base era 1 justamente para
              que esto no pasara.
          - valor: '-1'
            mensaje: |
              Has reducido de más: $\frac{5\pi}{2}$ menos **dos** vueltas
              da $-\frac{3\pi}{2}$, y de ahí sale $i$, no $-1$. Un argumento de
              $\pi$ significaría que el afijo está en el semieje real negativo,
              y $\frac{5\pi}{2}$ no cae ahí.
          - valor: '1'
            mensaje: |
              Eso es lo que sale si reduces $\frac{5\pi}{2}$ a $0$, es decir, si
              te comes el cuarto de vuelta que sobra. $\frac{5\pi}{2}$ son dos
              vueltas **y cuarto**.
        pista: |
          $z^{10} = e^{i\,10\pi/4} = e^{i\,5\pi/2}$. Resta una vuelta completa
          y mira dónde cae.
        desarrollo: |
          $$
          z^{10} = \left(e^{i\pi/4}\right)^{10} = e^{i\frac{10\pi}{4}} = e^{i\frac{5\pi}{2}}
          $$

          Se reduce restando una vuelta completa:

          $$
          \frac{5\pi}{2} - 2\pi = \frac{5\pi}{2} - \frac{4\pi}{2} = \frac{\pi}{2}
          $$

          $$
          z^{10} = \cos\frac{\pi}{2} + i\,\sin\frac{\pi}{2} = i
          $$
        veredicto: |
          Comprobación por otra vía, que además es rápida: $(1+i)^{2} = 2i$, así
          que $(1+i)^{10} = (2i)^{5} = 32\,i^{5} = 32i$, y dividido entre
          $(\sqrt2)^{10} = 32$ queda $i$.

      # ── COMP4 · por qué la suma se anula ─────────────────────────────
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que justifica el valor de la suma. Una de las
          piezas llega al resultado correcto por el camino equivocado, y no debe
          entrar.
        piezas:
          - texto: |
              Las dos bases son conjugadas: $\dfrac{1-i}{\sqrt2}$ es la
              conjugada de $\dfrac{1+i}{\sqrt2}$, porque solo cambia el signo de
              la parte imaginaria.
          - texto: |
              Conjugar y elevar se pueden hacer en cualquier orden: la conjugada
              de $z^{n}$ es la potencia $n$-ésima de la conjugada de $z$.
          - texto: |
              Como las dos bases son opuestas, los dos términos se cancelan y la
              suma vale 0.
            trampa: true
            mensaje: |
              Llega al resultado correcto por el camino equivocado, que en COMP4
              vale cero puntos. Dos cosas fallan: $1-i$ no es $-(1+i)$ —eso
              sería $-1-i$—, y aunque lo fuera, el exponente es **par**, así que
              $(-z)^{10} = z^{10}$ y los términos se **sumarían**. Que el
              resultado coincida es casualidad, y en un examen se ve.
          - texto: |
              Por tanto la suma es $z^{10}$ más su conjugada, y eso vale
              $2\operatorname{Re}\left(z^{10}\right)$.
          - texto: |
              Como $z^{10} = i$ es imaginario puro, $\operatorname{Re}(z^{10}) = 0$
              y la suma vale 0.
        veredicto: |
          Un número más su conjugado siempre es real: es $2\operatorname{Re}$.
          Que aquí salga **cero** es lo que hay que justificar, y sale de que la
          potencia es imaginaria pura.

      # ── COMP2 · la suma ──────────────────────────────────────────────
      - tipo: calcular
        titulo: La suma
        pregunta: ¿Cuánto vale la suma completa?
        respuesta:
          tipo: complejo
          valor: '0'
          tolerancia: 0.02
          formato: forma binómica, tipo a+bi
        distractores:
          - valor: '2i'
            mensaje: |
              Has supuesto que el segundo término vale lo mismo que el primero.
              La segunda base es la **conjugada**, así que su décima potencia es
              $\overline{i} = -i$, y no $i$.
          - valor: '-2i'
            mensaje: |
              Mismo error que sumar dos veces $i$, pero con el signo contrario:
              has tomado los dos términos como $-i$. Uno es $i$ y el otro $-i$.
          - valor: '32'
            mensaje: |
              Eso sale de sumar primero las bases y elevar después:
              $\left(\frac{2}{\sqrt2}\right)^{10} = (\sqrt2)^{10} = 32$. Pero
              $(a+b)^{n} \neq a^{n}+b^{n}$.
        pista: |
          Ya tienes $z^{10} = i$. El otro término es su conjugado: escríbelo y
          suma.
        desarrollo: |
          $$
          \left(\frac{1+i}{\sqrt2}\right)^{10} + \left(\frac{1-i}{\sqrt2}\right)^{10}
            = i + (-i) = 0
          $$
        veredicto: |
          Gráficamente: los dos afijos son $i$ y $-i$, simétricos respecto del
          eje real. Su suma, por la regla del paralelogramo, cae en **el
          origen**. Eso es lo que hay que dibujar — no los sumandos.

    resolucion: |
      **Datos.** Se pide el valor de

      $$
      S = \left(\frac{1+i}{\sqrt{2}}\right)^{10} + \left(\frac{1-i}{\sqrt{2}}\right)^{10}
      $$

      y la representación gráfica del resultado.

      ### 1 · La observación que ahorra la mitad del trabajo

      Antes de calcular conviene ver que las dos bases son **conjugadas**: en
      $\frac{1-i}{\sqrt2}$ solo ha cambiado el signo de la parte imaginaria
      respecto de $\frac{1+i}{\sqrt2}$.

      Como la conjugación respeta productos, conjugar y elevar se pueden hacer
      en cualquier orden: $\left(\overline{z}\right)^{n}$ es la conjugada de
      $z^{n}$, para todo $n \in \mathbb{N}$. Llamando
      $z = \frac{1+i}{\sqrt2}$, la suma es

      $$
      S = z^{10} + \left(\overline{z}\right)^{10} = 2\operatorname{Re}\left(z^{10}\right)
      $$

      Basta entonces con calcular **una** de las dos potencias. Y de paso queda
      claro que $S$ es un número real, sea cual sea su valor.

      ### 2 · Forma polar de la base

      $$
      |z| = \frac{|1+i|}{\sqrt2} = \frac{\sqrt{1^{2}+1^{2}}}{\sqrt{2}}
          = \frac{\sqrt2}{\sqrt2} = 1
      $$

      El afijo de $1+i$ está en el **primer cuadrante**, y ahí sí coinciden el
      arcotangente y el argumento:

      $$
      \arg z = \arctan\frac{1}{1} = \frac{\pi}{4}
      $$

      Luego $z = e^{i\pi/4}$. Módulo 1: elevar a la décima no cambia el tamaño,
      solo gira.

      ### 3 · Aplicación de De Moivre

      $$
      z^{10} = \left(e^{i\pi/4}\right)^{10} = e^{i\frac{10\pi}{4}} = e^{i\frac{5\pi}{2}}
      $$

      Se reduce el argumento al intervalo $[0,2\pi)$ restando una vuelta
      completa:

      $$
      \frac{5\pi}{2} - 2\pi = \frac{5\pi}{2} - \frac{4\pi}{2} = \frac{\pi}{2}
      $$

      $$
      z^{10} = \cos\frac{\pi}{2} + i\,\sin\frac{\pi}{2} = i
      $$

      ### 4 · La suma

      Por el apartado 1, y como $z^{10} = i$ es imaginario puro:

      $$
      S = 2\operatorname{Re}(i) = 2\cdot 0 = 0
      $$

      O escrito término a término, que es lo mismo:

      $$
      S = i + \overline{i} = i + (-i) = 0
      $$

      ### 5 · Comprobación

      Por una vía completamente distinta, sin pasar por la forma polar. Como
      $(1+i)^{2} = 1 + 2i + i^{2} = 2i$:

      $$
      (1+i)^{10} = \left[(1+i)^{2}\right]^{5} = (2i)^{5} = 32\,i^{5} = 32i
      $$

      y como $\left(\sqrt2\right)^{10} = 2^{5} = 32$, se recupera
      $z^{10} = 32i/32 = i$. Análogamente $(1-i)^{10} = -32i$, y la suma vuelve
      a dar 0.

      ### 6 · Representación gráfica

      Lo que se pide dibujar es **el resultado**, no los sumandos: el afijo de
      $S = 0$ es **el origen**.

      Conviene añadir los dos sumandos para que se vea por qué: sus afijos son
      $i$ y $-i$, simétricos respecto del eje real y sobre la circunferencia
      unidad. Colocados como vectores desde el origen, la regla del
      paralelogramo los lleva de vuelta al punto de partida.

      ### Resultado

      $$
      \boxed{\;S = 0\;}
      $$

  - id: cociente-exponencial
    titulo: Un cociente con exponenciales
    fuente: >-
      Ejercicio 1.3 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU

    enunciado: |
      $$
      \frac{1 - e^{i\pi/2}}{1 + e^{i\pi/2}}
      $$
    pide: Escribir en forma binómica.

    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado impone por las exponenciales. ¿Cuál es el primer paso?
        opciones:
          - texto: Reconocer que $e^{i\pi/2}$ es exactamente $i$
            correcta: true
            mensaje: |
              Eso es. En cuanto lo sustituyes, queda un cociente de binomios
              corriente: $\frac{1-i}{1+i}$. La exponencial era el disfraz.
          - texto: Dejarlo como $\cos\frac{\pi}{2} + i\,\mathrm{sen}\,\frac{\pi}{2}$ y seguir
            mensaje: |
              Vas por el camino bueno pero te paras a mitad. Evalúa:
              $\cos\frac{\pi}{2} = 0$ y $\mathrm{sen}\,\frac{\pi}{2} = 1$, así
              que eso **es** $i$. Arrastrar senos y cosenos sin evaluar es lo
              que hace que el ejercicio parezca largo.
          - texto: Simplificar el 1 del numerador con el 1 del denominador
            mensaje: |
              Eso no vale nunca, ni aquí ni con números reales. En un cociente
              solo se simplifican **factores**, no sumandos: $\frac{1-a}{1+a}$
              no es $\frac{-a}{a}$.
          - texto: Separar la fracción en dos, una por cada sumando del numerador
            mensaje: |
              Es legítimo, pero no simplifica nada: quedan dos cocientes con el
              mismo denominador complejo y hay que racionalizar los dos. Has
              duplicado el trabajo.

      - tipo: calcular
        titulo: El valor de la exponencial
        pregunta: ¿Cuánto vale $e^{i\pi/2}$?
        respuesta:
          tipo: complejo
          valor: 'i'
          tolerancia: 0.02
          formato: forma binómica, tipo a+bi
        distractores:
          - valor: '1'
            mensaje: |
              $e^{i\theta}$ vale 1 cuando $\theta$ es múltiplo de $2\pi$, y
              $\pi/2$ no lo es. Es un cuarto de vuelta, no una vuelta entera:
              el afijo acaba en el semieje imaginario positivo.
          - valor: '-1'
            mensaje: |
              Eso es $e^{i\pi}$, media vuelta. Aquí el argumento es la **mitad**
              de $\pi$: un cuarto de vuelta, que lleva del 1 al $i$.
          - valor: '0.7071+0.7071i'
            mensaje: |
              Ese es $e^{i\pi/4}$, la bisectriz del primer cuadrante. Has
              partido el ángulo una vez de más: $\pi/2$ son $90°$, no $45°$.
        pista: |
          Euler dice $e^{i\theta} = \cos\theta + i\,\mathrm{sen}\,\theta$.
          Sustituye $\theta = \pi/2$ y evalúa las dos funciones.
        desarrollo: |
          $$
          e^{i\pi/2} = \cos\frac{\pi}{2} + i\,\mathrm{sen}\,\frac{\pi}{2} = 0 + i\cdot 1 = i
          $$
        veredicto: |
          Conviene tenerlos memorizados: $e^{i0}=1$, $e^{i\pi/2}=i$,
          $e^{i\pi}=-1$ y $e^{i3\pi/2}=-i$. Son los cuatro cuartos de vuelta.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que justifica **por qué** se multiplica por el
          conjugado. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Sustituyendo queda $\dfrac{1-i}{1+i}$, con el denominador
              complejo: todavía no es forma binómica.
          - texto: |
              Se multiplican numerador y denominador por el conjugado del
              denominador, $1-i$. Eso no cambia el valor: es multiplicar por 1.
          - texto: |
              Se multiplica arriba y abajo por $1+i$, el propio denominador,
              para que abajo quede $(1+i)^2$.
            trampa: true
            mensaje: |
              Esta pieza confunde el conjugado con el propio denominador.
              $(1+i)^2 = 2i$ **sigue siendo imaginario**, así que no has
              avanzado: el denominador tiene que quedar **real**, y eso solo lo
              consigue el conjugado, porque $(a+bi)(a-bi) = a^2+b^2$.
          - texto: |
              El producto $(1+i)(1-i) = 1^2 + 1^2 = 2$ es real, que era el
              objetivo de toda la maniobra.
          - texto: |
              Con el denominador ya real, basta dividir el numerador entre 2
              para leer la parte real y la imaginaria.
        veredicto: |
          Racionalizar no es un truco: es la única forma de escribir un cociente
          en forma binómica, porque «forma binómica» significa exactamente que
          el denominador ha desaparecido.

      - tipo: calcular
        titulo: El cociente
        pregunta: Con $e^{i\pi/2} = i$, ¿cuánto vale la expresión?
        respuesta:
          tipo: complejo
          valor: '-i'
          tolerancia: 0.02
          formato: forma binómica, tipo a+bi
        distractores:
          - valor: 'i'
            mensaje: |
              Has calculado $\frac{1+i}{1-i}$, que es el cociente **al revés**.
              Mira cuál lleva el signo menos: el numerador del enunciado es
              $1 - e^{i\pi/2}$. Los dos cocientes son inversos, y por eso salen
              opuestos.
          - valor: '-1'
            mensaje: |
              Eso sale de tachar los unos y quedarse con $\frac{-i}{i}$. En una
              fracción no se simplifican sumandos, solo factores: es el error
              que ya avisaba una de las opciones del primer paso.
          - valor: '0'
            mensaje: |
              El numerador solo sería cero si $e^{i\pi/2}$ valiera 1, y vale
              $i$. Este resultado arrastra el error del paso anterior.
        pista: |
          Multiplica numerador y denominador por $1-i$ y desarrolla el
          numerador con cuidado: $(1-i)^2$ no es $1 - i^2$.
        desarrollo: |
          $$
          \frac{1-i}{1+i} = \frac{(1-i)(1-i)}{(1+i)(1-i)} = \frac{(1-i)^2}{1^2+1^2}
          $$

          El numerador es el cuadrado de un binomio:

          $$
          (1-i)^2 = 1 - 2i + i^2 = 1 - 2i - 1 = -2i
          $$

          y por tanto

          $$
          \frac{1-i}{1+i} = \frac{-2i}{2} = -i
          $$
        veredicto: |
          Comprobación en polar: $1-i$ tiene argumento $-\pi/4$ y $1+i$ lo tiene
          $+\pi/4$. Al dividir se restan y queda $-\pi/2$, con módulo
          $\sqrt2/\sqrt2 = 1$. Eso es exactamente $-i$.

    resolucion: |
      **Datos.** Se pide escribir en forma binómica

      $$
      w = \frac{1 - e^{i\pi/2}}{1 + e^{i\pi/2}}
      $$

      ### 1 · Qué es la exponencial que aparece

      Por la fórmula de Euler, $e^{i\theta} = \cos\theta + i\,\mathrm{sen}\,\theta$
      para todo $\theta$ real. Con $\theta = \pi/2$:

      $$
      e^{i\pi/2} = \cos\frac{\pi}{2} + i\,\mathrm{sen}\,\frac{\pi}{2} = 0 + i = i
      $$

      El enunciado es, entonces, un cociente de binomios disfrazado:

      $$
      w = \frac{1-i}{1+i}
      $$

      ### 2 · Por qué hay que racionalizar

      «Forma binómica» significa $a+bi$ con $a$ y $b$ reales, y eso exige que no
      quede ningún complejo en el denominador. Se multiplican numerador y
      denominador por el **conjugado** del denominador, $1-i$: multiplicar arriba
      y abajo por lo mismo no cambia el valor, y el producto de un complejo por
      su conjugado es real,

      $$
      (a+bi)(a-bi) = a^2 + b^2
      $$

      que es justo lo que hace falta.

      ### 3 · La operación

      $$
      w = \frac{(1-i)(1-i)}{(1+i)(1-i)} = \frac{(1-i)^2}{1^2+1^2} = \frac{(1-i)^2}{2}
      $$

      Desarrollando el numerador, y usando $i^2=-1$:

      $$
      (1-i)^2 = 1 - 2i + i^2 = 1 - 2i - 1 = -2i
      $$

      $$
      w = \frac{-2i}{2} = -i
      $$

      ### 4 · Comprobación

      Por una vía distinta, en forma polar. El numerador $1-i$ tiene módulo
      $\sqrt2$ y argumento $-\pi/4$ —cuarto cuadrante—; el denominador $1+i$
      tiene módulo $\sqrt2$ y argumento $\pi/4$. Al dividir, los módulos se
      dividen y los argumentos se restan:

      $$
      w = \frac{\sqrt2}{\sqrt2}\,e^{i\left(-\frac{\pi}{4}-\frac{\pi}{4}\right)}
        = e^{-i\pi/2} = -i
      $$

      Las dos vías coinciden.

      ### Resultado

      $$
      \boxed{\;\frac{1 - e^{i\pi/2}}{1 + e^{i\pi/2}} = -i\;}
      $$

  - id: potencia-doceava
    titulo: La potencia doceava de un cociente
    fuente: >-
      Ejercicio 1.4 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU
      (2019/2020 4E AT)

    enunciado: |
      $$
      \left(
        \frac{\left(1+i\sqrt{3}\right)\left(\frac{-1+i}{\sqrt{2}}\right)}
             {2i\left(\frac{1-i}{\sqrt{2}}\right)^{1/3}}
      \right)^{12}
      $$
    pide: Calcular el valor de la expresión.

    pasos:
      - tipo: reconocer
        pregunta: |
          Hay cuatro factores, un cociente, una raíz cúbica y un exponente 12.
          ¿Por dónde se empieza?
        opciones:
          - texto: Pasar cada factor a forma polar y operar módulos y argumentos
            correcta: true
            mensaje: |
              Eso es. En polar, multiplicar es sumar argumentos, dividir es
              restarlos y elevar es multiplicarlos. Todo el ejercicio se
              convierte en aritmética de ángulos.
          - texto: Desarrollar los productos en forma binómica y elevar al final
            mensaje: |
              Elevar a la doceava en forma binómica no es viable en un examen:
              son trece sumandos con potencias de $i$ que reducir una a una, y
              basta un signo para perderlo todo.
          - texto: Aproximar cada factor con la calculadora y operar en decimales
            mensaje: |
              El resultado exacto de este ejercicio es un número entero. Con
              decimales verías algo como $0{,}99999$ y no sabrías si es 1 o si
              te has equivocado. En polar sale exacto y sin dudas.
          - texto: Elevar todo al cubo primero, para quitar de en medio el exponente $1/3$
            mensaje: |
              Eso cambia el problema por otro distinto. El exponente $1/3$ no
              estorba: en polar es dividir un argumento entre tres, que es tan
              fácil como lo demás.

      - tipo: calcular
        titulo: El módulo del cociente
        pregunta: |
          Antes de elevar a 12, ¿cuánto vale el módulo del cociente que va
          dentro del paréntesis?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Has calculado bien el módulo del numerador, $|1+i\sqrt3| = 2$,
              pero no lo has dividido. El denominador también tiene módulo 2,
              porque $|2i| = 2$ y el otro factor tiene módulo 1.
          - valor: '4'
            mensaje: |
              Has multiplicado los módulos del numerador y del denominador en
              vez de dividirlos. En un cociente los módulos se **dividen**.
          - valor: '0.5'
            mensaje: |
              Cociente invertido: has dividido el del denominador entre el del
              numerador. Los dos valen 2, así que el resultado es 1.
        pista: |
          $|1+i\sqrt3| = \sqrt{1+3}$. Los dos factores con $\sqrt2$ en el
          denominador tienen módulo 1, y elevar a $1/3$ no cambia un módulo 1.
        desarrollo: |
          Módulo del numerador:

          $$
          \left|1+i\sqrt3\right|\cdot\left|\frac{-1+i}{\sqrt2}\right|
            = \sqrt{1+3}\cdot\frac{\sqrt2}{\sqrt2} = 2\cdot 1 = 2
          $$

          Módulo del denominador:

          $$
          |2i|\cdot\left|\left(\frac{1-i}{\sqrt2}\right)^{1/3}\right|
            = 2\cdot 1^{1/3} = 2
          $$

          Y el cociente:

          $$
          \left|\frac{\text{num}}{\text{den}}\right| = \frac{2}{2} = 1
          $$
        veredicto: |
          Módulo 1: el resultado final estará en la circunferencia unidad, pase
          lo que pase con el argumento. Eso ya descarta cualquier respuesta
          grande.

      - tipo: calcular
        titulo: El argumento del cociente
        pregunta: |
          ¿Cuánto vale el argumento del cociente, en grados, antes de elevar
          a 12?
        respuesta:
          tipo: numero
          valor: '120'
          tolerancia: 0.5
          formato: en grados
        distractores:
          - valor: '270'
            mensaje: |
              Has sumado el argumento del denominador en vez de restarlo. En un
              cociente los argumentos se **restan**: $195° - 75°$, no
              $195° + 75°$.
          - valor: '105'
            mensaje: |
              Te has dejado la raíz cúbica del denominador. Su argumento es
              $-15°$, así que el denominador no tiene $90°$ sino
              $90° - 15° = 75°$.
          - valor: '135'
            mensaje: |
              Has usado solo el factor $\frac{-1+i}{\sqrt2}$ del numerador, que
              es el que tiene $135°$. Falta sumarle los $60°$ de $1+i\sqrt3$.
        pista: |
          $1+i\sqrt3$ está en el primer cuadrante con $60°$; $\frac{-1+i}{\sqrt2}$
          en el segundo con $135°$; $2i$ tiene $90°$; y la raíz cúbica divide
          entre tres el $-45°$ de $\frac{1-i}{\sqrt2}$.
        desarrollo: |
          Argumento del numerador:

          $$
          60° + 135° = 195°
          $$

          Argumento del denominador, teniendo en cuenta que elevar a $1/3$
          divide el argumento entre tres:

          $$
          90° + \frac{-45°}{3} = 90° - 15° = 75°
          $$

          Al dividir, los argumentos se restan:

          $$
          195° - 75° = 120°
          $$
        veredicto: |
          El cociente es, por tanto, $e^{i120°}$: módulo 1 y un tercio de vuelta.

      - tipo: justificar
        pregunta: |
          La raíz cúbica del denominador tiene **tres** valores, así que el
          enunciado parece ambiguo. Ordena el razonamiento que resuelve la
          ambigüedad. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              $\left(\frac{1-i}{\sqrt2}\right)^{1/3}$ no es un número: son tres,
              con argumentos $-15°$, $105°$ y $225°$.
          - texto: |
              Elegir una u otra cambia el argumento del cociente en múltiplos
              de $120°$.
          - texto: |
              Se toma la raíz principal porque es la única válida; las otras dos
              se descartan.
            trampa: true
            mensaje: |
              Las otras dos **no se descartan**: son raíces cúbicas tan buenas
              como la primera. Quedarse con una «porque sí» es exactamente el
              error que este ejercicio quiere cazar. Lo correcto es demostrar
              que da igual cuál elijas, y eso es lo que hacen las otras piezas.
          - texto: |
              Al elevar a la doceava, ese cambio se multiplica por 12: pasa a
              ser un múltiplo de $1440°$, es decir, cuatro vueltas exactas.
          - texto: |
              Cuatro vueltas no cambian nada, así que el resultado es el mismo
              con cualquiera de las tres raíces: la ambigüedad desaparece.
        veredicto: |
          Esto no es un detalle de purista: es exactamente el tipo de
          justificación que COMP4 evalúa. El número sale igual escribiéndolo o
          sin escribirlo; la nota, no.

      - tipo: calcular
        titulo: El resultado
        pregunta: Eleva a la doceava y da el resultado en forma binómica.
        respuesta:
          tipo: complejo
          valor: '1'
          tolerancia: 0.02
          formato: forma binómica, tipo a+bi
        distractores:
          - valor: '4096'
            mensaje: |
              Has elevado a la doceava un módulo 2 en vez de 1: $2^{12} = 4096$.
              El módulo del **cociente** es 1, porque numerador y denominador
              tienen los dos módulo 2.
          - valor: '-1'
            mensaje: |
              Un resultado de $-1$ significaría argumento $180°$. Aquí
              $12 \cdot 120° = 1440° = 4\cdot 360°$: cuatro vueltas exactas, que
              dejan el afijo en el 1, no en el $-1$.
          - valor: 'i'
            mensaje: |
              Argumento $90°$, que no sale de ningún múltiplo de $120°$. Repasa
              la multiplicación: $12 \cdot 120$, y luego réstale vueltas enteras
              de $360$.
        pista: |
          $z^{12} = |z|^{12}e^{i\,12\theta}$. Con $|z| = 1$ el módulo no da
          trabajo; todo está en reducir $12 \cdot 120°$.
        desarrollo: |
          $$
          \left(1\cdot e^{i120°}\right)^{12} = 1^{12}\,e^{i\,12\cdot 120°} = e^{i\,1440°}
          $$

          Y $1440° = 4 \cdot 360°$, cuatro vueltas completas:

          $$
          e^{i\,1440°} = e^{i\,0°} = 1
          $$
        veredicto: |
          Que salga un entero limpio después de tanto aparato es la señal de que
          el ejercicio estaba diseñado para hacerse en polar.

    resolucion: |
      **Datos.** Se pide el valor de

      $$
      W = \left(
        \frac{\left(1+i\sqrt{3}\right)\left(\frac{-1+i}{\sqrt{2}}\right)}
             {2i\left(\frac{1-i}{\sqrt{2}}\right)^{1/3}}
      \right)^{12}
      $$

      ### 1 · Herramienta y por qué se puede aplicar

      Todo el ejercicio son productos, un cociente y potencias, y en forma polar
      esas tres operaciones son inmediatas: los módulos se multiplican, dividen
      y elevan; los argumentos se suman, restan y multiplican. Se usa la fórmula
      de De Moivre, válida para todo $z \neq 0$, y aquí ningún factor es cero.

      ### 2 · Cada factor en forma polar

      | factor | módulo | argumento |
      |---|---|---|
      | $1+i\sqrt3$ | $\sqrt{1+3} = 2$ | $60°$ (primer cuadrante) |
      | $\frac{-1+i}{\sqrt2}$ | $1$ | $135°$ (segundo cuadrante) |
      | $2i$ | $2$ | $90°$ |
      | $\frac{1-i}{\sqrt2}$ | $1$ | $-45°$ (cuarto cuadrante) |

      La raíz cúbica del último divide su argumento entre tres:
      $-45°/3 = -15°$, y deja el módulo en 1.

      ### 3 · El cociente

      Numerador: módulo $2 \cdot 1 = 2$, argumento $60° + 135° = 195°$.

      Denominador: módulo $2 \cdot 1 = 2$, argumento $90° - 15° = 75°$.

      $$
      \frac{\text{num}}{\text{den}} = \frac{2}{2}\,e^{i(195° - 75°)} = e^{i\,120°}
      $$

      ### 4 · La ambigüedad de la raíz cúbica, y por qué no importa

      $\left(\frac{1-i}{\sqrt2}\right)^{1/3}$ tiene **tres** valores, con
      argumentos $-15°$, $105°$ y $225°$: se diferencian en $120°$. Elegir otro
      cambia el argumento del cociente en un múltiplo de $120°$, y al elevar a
      la doceava ese cambio queda multiplicado por 12,

      $$
      12 \cdot 120° = 1440° = 4\cdot 360°
      $$

      que son cuatro vueltas completas. El resultado es el mismo con cualquiera
      de las tres. Conviene escribirlo: el enunciado parecía ambiguo y no lo es.

      ### 5 · La potencia

      $$
      W = \left(e^{i\,120°}\right)^{12} = e^{i\,1440°} = e^{i\,0°} = 1
      $$

      ### 6 · Comprobación

      El módulo tiene que ser $1^{12} = 1$, y lo es. Y el argumento final,
      $1440°$, es múltiplo exacto de $360°$: el afijo cae en el semieje real
      positivo, que es donde está el 1.

      ### Resultado

      $$
      \boxed{\;W = 1\;}
      $$

  - id: raiz-cubica-cociente
    titulo: La raíz cúbica de un cociente
    fuente: >-
      Ejercicio 1.5 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU
      (2011/2012 2E)

    enunciado: |
      $$
      \sqrt[3]{\frac{-2+2i}{1+i\sqrt{3}}}
      $$
    pide: Expresar en forma binómica.

    pasos:
      - tipo: reconocer
        pregunta: ¿Cuál es el camino corto?
        opciones:
          - texto: Simplificar el cociente a forma polar y aplicar la fórmula de las raíces
            correcta: true
            mensaje: |
              Eso es. Un cociente en polar es una división de módulos y una
              resta de argumentos, y sobre el resultado la fórmula de las raíces
              da las tres de golpe.
          - texto: Sacar la raíz cúbica del numerador y la del denominador por separado
            mensaje: |
              Se puede, pero te complicas: son tres raíces arriba y tres abajo,
              nueve combinaciones, y solo tres de ellas son la respuesta.
              Simplifica el cociente **antes** de sacar la raíz.
          - texto: Racionalizar primero para tener forma binómica y sacar la raíz después
            mensaje: |
              Llegarías, pero el complejo que sale tiene componentes con
              $\sqrt3$ y hay que volver a pasarlo a polar para la raíz. Has dado
              un rodeo: el cociente ya era cómodo en polar.
          - texto: Elevar al cubo para deshacerse de la raíz
            mensaje: |
              Elevar al cubo es lo contrario de lo que pide el enunciado. Eso
              resuelve otro ejercicio.

      - tipo: calcular
        titulo: El módulo del cociente
        pregunta: ¿Cuánto vale el módulo de $\dfrac{-2+2i}{1+i\sqrt3}$?
        respuesta:
          tipo: numero
          valor: '1.41421356'
          tolerancia: 0.01
          formato: un número; puedes escribirlo como √2
        distractores:
          - valor: '2.82842712'
            mensaje: |
              Ese es el módulo del numerador, $|-2+2i| = 2\sqrt2$, sin dividir
              entre el del denominador, que vale 2.
          - valor: '4'
            mensaje: |
              Has olvidado las raíces cuadradas: $|-2+2i| = \sqrt{4+4}$, no
              $4+4$. El módulo es una distancia, y lleva raíz.
          - valor: '1'
            mensaje: |
              Los dos módulos no son iguales: el del numerador es $2\sqrt2$ y el
              del denominador 2. Su cociente es $\sqrt2$, no 1.
        pista: |
          $|-2+2i| = \sqrt{(-2)^2+2^2}$ y $|1+i\sqrt3| = \sqrt{1+3}$. El módulo
          de un cociente es el cociente de los módulos.
        desarrollo: |
          $$
          \left|\frac{-2+2i}{1+i\sqrt3}\right|
            = \frac{\sqrt{4+4}}{\sqrt{1+3}} = \frac{2\sqrt2}{2} = \sqrt2
          $$
        veredicto: |
          Módulo $\sqrt2 \approx 1{,}414$: mayor que 1, así que al sacar la raíz
          cúbica el resultado seguirá siendo mayor que 1, pero poco.

      - tipo: calcular
        titulo: El argumento del cociente
        pregunta: ¿Cuánto vale su argumento, en grados?
        respuesta:
          tipo: numero
          valor: '75'
          tolerancia: 0.5
          formato: en grados
        distractores:
          - valor: '195'
            mensaje: |
              Has sumado los argumentos en vez de restarlos. En un cociente se
              **restan**: $135° - 60°$.
          - valor: '-75'
            mensaje: |
              Resta al revés: has hecho $60° - 135°$. El numerador es el que
              tiene $135°$.
          - valor: '-45'
            mensaje: |
              Has calculado el argumento de $-2+2i$ con el arcotangente a secas.
              Sus dos componentes son $-2$ y $+2$: segundo cuadrante, $135°$, no
              $-45°$.
        pista: |
          $-2+2i$ está en el segundo cuadrante. $1+i\sqrt3$ tiene
          $\tan\theta = \sqrt3$ en el primero.
        desarrollo: |
          El afijo de $-2+2i$ tiene parte real negativa e imaginaria positiva:
          **segundo cuadrante**, con $\tan\theta = \frac{2}{-2} = -1$, luego
          $\theta = 135°$.

          El de $1+i\sqrt3$ está en el primero, con
          $\tan\theta = \frac{\sqrt3}{1} = \sqrt3$, luego $\theta = 60°$.

          Al dividir se restan:

          $$
          135° - 60° = 75°
          $$
        veredicto: |
          El cociente es $\sqrt2\,e^{i75°}$. Ya está listo para la raíz.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que justifica **cuántas** raíces hay y cómo
          están colocadas. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Buscar $\sqrt[3]{w}$ es buscar los $z$ tales que $z^3 = w$: una
              ecuación de tercer grado, que tiene tres soluciones.
          - texto: |
              Todas tienen el mismo módulo, $\sqrt[3]{|w|}$, porque al elevar al
              cubo el módulo se eleva al cubo.
          - texto: |
              Como el índice es 3, se toma $k=0$ y las otras dos salen repetidas.
            trampa: true
            mensaje: |
              No salen repetidas: son **tres números distintos**. Es el error
              que la teoría del tema ya nombra — $\sqrt[3]{8}$ en los reales es
              2 y punto, pero en los complejos son tres. Si el enunciado dice
              «expresar», las tres van en la respuesta.
          - texto: |
              Sus argumentos son $\frac{\theta + 360°k}{3}$ con $k=0,1,2$:
              sumarle una vuelta a $w$ no lo cambia a él, pero sí cambia la raíz.
          - texto: |
              Los tres argumentos se diferencian en $120°$, así que los afijos
              son los vértices de un triángulo equilátero.
        veredicto: |
          La imagen del triángulo equilátero es la comprobación más rápida que
          tienes: si tus tres raíces no están a $120°$, hay un error antes.

      - tipo: calcular
        titulo: El módulo de las raíces
        pregunta: ¿Cuánto vale el módulo común de las tres raíces?
        respuesta:
          tipo: numero
          valor: '1.12246205'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1.41421356'
            mensaje: |
              Ese es el módulo del cociente, sin sacarle la raíz cúbica. El de
              las raíces es $\sqrt[3]{\sqrt2} = 2^{1/6} \approx 1{,}122$.
          - valor: '0.47140452'
            mensaje: |
              Has dividido entre 3 en vez de sacar la raíz cúbica. Dividir es lo
              que se hace con el **argumento**; al módulo se le saca la raíz.
          - valor: '3'
            mensaje: |
              El 3 es el índice de la raíz, no un valor. El módulo sale de
              $\sqrt[3]{\sqrt2}$.
        pista: |
          $\sqrt[3]{\sqrt2} = \left(2^{1/2}\right)^{1/3} = 2^{1/6}$.
        desarrollo: |
          $$
          \sqrt[3]{|w|} = \sqrt[3]{\sqrt2} = \left(2^{1/2}\right)^{1/3}
            = 2^{1/6} \approx 1{,}1225
          $$
        veredicto: |
          Los tres afijos están en una circunferencia de radio $2^{1/6}$, a
          $120°$ unos de otros.

      - tipo: calcular
        titulo: El menor de los tres argumentos
        pregunta: |
          De los tres argumentos de las raíces, ¿cuál es el más pequeño, en
          grados?
        respuesta:
          tipo: numero
          valor: '25'
          tolerancia: 0.5
          formato: en grados
        distractores:
          - valor: '75'
            mensaje: |
              Ese es el argumento del cociente, sin dividir entre 3. La fórmula
              de las raíces divide el argumento entre el índice.
          - valor: '145'
            mensaje: |
              Ese es el **segundo** argumento, el de $k=1$. El más pequeño es el
              de $k=0$, que sale de dividir $75°$ entre 3 sin sumar vueltas.
          - valor: '225'
            mensaje: |
              Has dividido $675°$ entre 3, es decir, has usado $k=2$ y además el
              enunciado pedía el menor. Con $k=0$ salen $25°$.
        pista: |
          $\theta_k = \dfrac{75° + 360°k}{3}$. El menor sale con $k=0$.
        desarrollo: |
          $$
          \theta_k = \frac{75° + 360°k}{3}, \qquad k = 0, 1, 2
          $$

          $$
          \theta_0 = \frac{75°}{3} = 25°, \quad
          \theta_1 = \frac{435°}{3} = 145°, \quad
          \theta_2 = \frac{795°}{3} = 265°
          $$
        veredicto: |
          $25°$, $145°$ y $265°$: separados exactamente $120°$, como tenía que
          ser.

    resolucion: |
      **Datos.** Se pide expresar en forma binómica

      $$
      z = \sqrt[3]{\frac{-2+2i}{1+i\sqrt{3}}}
      $$

      ### 1 · Herramienta y por qué se puede aplicar

      Se usa la fórmula de las raíces $n$-ésimas: si $w = r\,e^{i\theta}$ con
      $w \neq 0$, sus $n$ raíces son

      $$
      z_k = \sqrt[n]{r}\;e^{i\frac{\theta + 360°k}{n}}, \qquad k = 0,1,\dots,n-1
      $$

      Exige tener $w$ en forma polar y $w \neq 0$. Aquí el numerador no es cero,
      así que el cociente tampoco: es aplicable. El trabajo previo es simplificar
      el cociente.

      ### 2 · El cociente, en forma polar

      Módulos:

      $$
      |-2+2i| = \sqrt{4+4} = 2\sqrt2, \qquad \left|1+i\sqrt3\right| = \sqrt{1+3} = 2
      $$

      Argumentos: el afijo de $-2+2i$ está en el **segundo cuadrante** —parte
      real negativa, imaginaria positiva—, así que su argumento es $135°$ y no
      el $-45°$ que da el arcotangente a secas. El de $1+i\sqrt3$ está en el
      primero, con $\tan\theta = \sqrt3$, luego $60°$.

      En un cociente los módulos se dividen y los argumentos se restan:

      $$
      w = \frac{2\sqrt2}{2}\;e^{i(135° - 60°)} = \sqrt2\;e^{i\,75°}
      $$

      ### 3 · Las tres raíces

      $$
      z_k = \sqrt[3]{\sqrt2}\;e^{i\frac{75° + 360°k}{3}} = 2^{1/6}\,e^{i\theta_k},
      \qquad k = 0,1,2
      $$

      con

      $$
      \theta_0 = 25°, \qquad \theta_1 = 145°, \qquad \theta_2 = 265°
      $$

      Es decir:

      $$
      z_0 = 2^{1/6}\left(\cos 25° + i\,\mathrm{sen}\,25°\right), \quad
      z_1 = 2^{1/6}\left(\cos 145° + i\,\mathrm{sen}\,145°\right), \quad
      z_2 = 2^{1/6}\left(\cos 265° + i\,\mathrm{sen}\,265°\right)
      $$

      ### 4 · Sobre la «forma binómica» que pide el enunciado

      Los cosenos y senos de $25°$, $145°$ y $265°$ no son valores exactos
      cómodos: la forma binómica solo se puede escribir con decimales
      aproximados, y por eso la solución oficial del boletín deja las tres
      raíces en forma trigonométrica. Si se quiere el valor numérico:

      $$
      z_0 \approx 1{,}017 + 0{,}474\,i, \quad
      z_1 \approx -0{,}920 + 0{,}644\,i, \quad
      z_2 \approx -0{,}098 - 1{,}118\,i
      $$

      Merece la pena decirlo en el examen en vez de dejar la sensación de que
      falta terminar el ejercicio.

      ### 5 · Comprobación

      Los tres argumentos se diferencian exactamente en $120°$, y los tres
      módulos coinciden: los afijos son los vértices de un triángulo equilátero
      inscrito en la circunferencia de radio $2^{1/6}$. Además,
      $\left(2^{1/6}\right)^3 = 2^{1/2} = \sqrt2$, que es el módulo del cociente
      de partida, y $3 \cdot 25° = 75°$, que es su argumento. Elevando al cubo se
      recupera $w$.

      ### Resultado

      $$
      \boxed{\;z_k = 2^{1/6}\left(\cos\theta_k + i\,\mathrm{sen}\,\theta_k\right),\quad
      \theta_k \in \{25°,\,145°,\,265°\}\;}
      $$

  - id: ecuacion-cubica-cociente
    titulo: Una ecuación cúbica con cociente
    fuente: >-
      Ejercicio 1.8 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU
      (2019/2020 3E AT)

    enunciado: |
      $$
      z^{3} = \frac{-1+i}{\sqrt{3}+i}
      $$
    pide: Calcular y representar gráficamente las soluciones de la ecuación.

    pasos:
      - tipo: reconocer
        pregunta: |
          El segundo miembro es un cociente y la incógnita está al cubo. ¿Qué
          hay que hacer primero?
        opciones:
          - texto: Simplificar el cociente a forma polar y luego sacar las tres raíces
            correcta: true
            mensaje: |
              Eso es. Primero se deja el segundo miembro como un solo número en
              polar, y entonces la ecuación es la de siempre: hallar las raíces
              cúbicas de un complejo conocido.
          - texto: Sacar la raíz cúbica del numerador y del denominador por separado
            mensaje: |
              Te complicas: salen tres raíces arriba y tres abajo, nueve
              combinaciones, y solo tres son solución. Simplifica el cociente
              antes de tocar la raíz.
          - texto: Multiplicar los dos miembros por $\sqrt3+i$ y resolver la ecuación resultante
            mensaje: |
              Quitas el cociente pero te queda $z^{3}(\sqrt3+i) = -1+i$, que
              sigue teniendo la incógnita al cubo y encima multiplicada por un
              complejo. Has cambiado un problema resuelto por uno peor.
          - texto: Como el grado es 3, buscar una solución evidente y dividir por Ruffini
            mensaje: |
              Ruffini sirve para polinomios con raíces enteras, y aquí el
              segundo miembro ni siquiera es un entero. En los complejos, una
              ecuación $z^{n} = w$ se resuelve con la fórmula de las raíces,
              no factorizando.

      - tipo: calcular
        titulo: El segundo miembro, en polar
        pregunta: |
          ¿Cuánto vale el argumento del cociente $\dfrac{-1+i}{\sqrt3+i}$, en
          grados?
        respuesta:
          tipo: numero
          valor: '105'
          tolerancia: 0.5
          formato: en grados
        distractores:
          - valor: '165'
            mensaje: |
              Has sumado los argumentos en vez de restarlos: $135° + 30°$. En un
              cociente se **restan**.
          - valor: '-45'
            mensaje: |
              Ese es el argumento que da el arcotangente a secas para $-1+i$.
              Sus componentes son $-1$ y $+1$: segundo cuadrante, $135°$.
          - valor: '75'
            mensaje: |
              Has intercambiado los papeles: $\sqrt3+i$ tiene $30°$, no $60°$.
              Recuerda que $\tan\theta = b/a = 1/\sqrt3$, no $\sqrt3$.
        pista: |
          $-1+i$ está en el segundo cuadrante. Para $\sqrt3+i$,
          $\tan\theta = \frac{1}{\sqrt3}$, con el afijo en el primero.
        desarrollo: |
          $$
          \arg(-1+i) = 135°, \qquad \arg\left(\sqrt3+i\right) = 30°
          $$

          $$
          \arg\frac{-1+i}{\sqrt3+i} = 135° - 30° = 105°
          $$

          Y el módulo:

          $$
          \frac{\left|-1+i\right|}{\left|\sqrt3+i\right|} = \frac{\sqrt2}{2} = 2^{-1/2}
          $$
        veredicto: |
          El segundo miembro es $2^{-1/2}e^{i105°}$: un número de módulo menor
          que 1, así que sus raíces también lo serán.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que justifica cuántas soluciones tiene la
          ecuación y dónde están. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              La ecuación es $z^{3} = w$ con $w = 2^{-1/2}e^{i105°}$, y $w \neq 0$.
          - texto: |
              Una ecuación polinómica de grado 3 tiene exactamente 3 soluciones
              en $\mathbb{C}$, contando multiplicidades.
          - texto: |
              Todas tienen módulo $\sqrt[3]{|w|} = 2^{-1/6}$, porque al elevar al
              cubo el módulo se eleva al cubo.
          - texto: |
              Sus argumentos son $\frac{105° + 360°k}{3}$ con $k=0,1,2$, es
              decir $35°$, $155°$ y $275°$.
          - texto: |
              Como el módulo de $w$ es menor que 1, hay que descartar las raíces
              que caigan fuera de la circunferencia unidad.
            trampa: true
            mensaje: |
              No hay nada que descartar: las tres raíces tienen **el mismo**
              módulo, $2^{-1/6}$, y las tres son solución. El módulo de $w$ solo
              determina el radio de la circunferencia donde se colocan; no
              elimina ninguna.
        veredicto: |
          Tres soluciones, mismo módulo, separadas $120°$: un triángulo
          equilátero. Esa imagen es la que hay que dibujar.

      - tipo: calcular
        titulo: El módulo de las soluciones
        pregunta: ¿Cuál es el módulo común de las tres soluciones?
        respuesta:
          tipo: numero
          valor: '0.89089872'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0.70710678'
            mensaje: |
              Ese es el módulo de $w$, que es $2^{-1/2} \approx 0{,}707$. A las
              soluciones les corresponde su raíz cúbica: $2^{-1/6}$.
          - valor: '1.12246205'
            mensaje: |
              Ese es $2^{1/6}$, con el exponente cambiado de signo. Como $|w|$
              es **menor** que 1, su raíz cúbica también lo es: está entre
              $|w|$ y 1, no por encima de 1.
          - valor: '0.23570226'
            mensaje: |
              Has dividido el módulo entre 3 en vez de sacarle la raíz cúbica.
              Dividir entre 3 es lo que se hace con el argumento.
        pista: |
          $\sqrt[3]{2^{-1/2}} = 2^{-1/6}$. Es un número algo menor que 1.
        desarrollo: |
          $$
          |z| = \sqrt[3]{|w|} = \sqrt[3]{2^{-1/2}} = 2^{-1/6} = \frac{1}{2^{1/6}}
            \approx 0{,}8909
          $$
        veredicto: |
          Las tres soluciones son
          $z_k = 2^{-1/6}e^{i\theta_k}$ con $\theta_k \in \{35°, 155°, 275°\}$.

    resolucion: |
      **Datos.** Se pide resolver y representar

      $$
      z^{3} = \frac{-1+i}{\sqrt{3}+i}
      $$

      ### 1 · Simplificar el segundo miembro

      Módulos y argumentos por separado:

      $$
      |-1+i| = \sqrt{2}, \qquad \arg(-1+i) = 135°\ \text{(segundo cuadrante)}
      $$

      $$
      \left|\sqrt3+i\right| = \sqrt{3+1} = 2, \qquad
      \arg\left(\sqrt3+i\right) = 30°\ \text{(primer cuadrante, } \tan\theta = 1/\sqrt3)
      $$

      En un cociente los módulos se dividen y los argumentos se restan:

      $$
      w = \frac{-1+i}{\sqrt3+i} = \frac{\sqrt2}{2}\,e^{i(135°-30°)} = 2^{-1/2}\,e^{i\,105°}
      $$

      ### 2 · Herramienta y por qué se puede aplicar

      La ecuación es ahora $z^3 = w$ con $w \neq 0$, así que se aplica la
      fórmula de las raíces $n$-ésimas:

      $$
      z_k = \sqrt[3]{|w|}\;e^{i\frac{\arg w + 360°k}{3}}, \qquad k = 0,1,2
      $$

      Son exactamente tres, ni una más ni una menos: una ecuación polinómica de
      grado 3 tiene tres soluciones en $\mathbb{C}$.

      ### 3 · Las tres soluciones

      $$
      |z| = \sqrt[3]{2^{-1/2}} = 2^{-1/6} \approx 0{,}8909
      $$

      $$
      \theta_k = \frac{105° + 360°k}{3}
        \;\Longrightarrow\;
        \theta_0 = 35°,\quad \theta_1 = 155°,\quad \theta_2 = 275°
      $$

      $$
      z_0 = 2^{-1/6}e^{i\,35°}, \qquad
      z_1 = 2^{-1/6}e^{i\,155°}, \qquad
      z_2 = 2^{-1/6}e^{i\,275°}
      $$

      ### 4 · Representación gráfica

      Los tres afijos están sobre la circunferencia de radio $2^{-1/6}$ —algo
      por dentro de la unidad— y separados exactamente $120°$: son los vértices
      de un triángulo equilátero centrado en el origen, con el primer vértice a
      $35°$.

      ### 5 · Comprobación

      Elevando la primera al cubo: el módulo pasa a
      $\left(2^{-1/6}\right)^3 = 2^{-1/2}$ y el argumento a $3 \cdot 35° = 105°$,
      que es exactamente $w$. Y $3 \cdot 155° = 465° = 105° + 360°$, la misma
      dirección tras una vuelta; igual con $3 \cdot 275° = 825° = 105° + 2\cdot 360°$.

      ### Resultado

      $$
      \boxed{\;z_k = 2^{-1/6}\,e^{i\theta_k},\quad \theta_k \in \{35°,\,155°,\,275°\}\;}
      $$

  - id: ecuacion-cuarta-menos-dieciseis
    titulo: Las raíces cuartas de menos dieciséis
    fuente: >-
      Ejercicio 1.9 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU
      (2018/2019 1E AT)

    enunciado: |
      $$
      z^{4} + 16 = 0
      $$
    pide: >-
      Calcular y representar gráficamente las soluciones, dando el resultado en
      forma binómica.

    pasos:
      - tipo: reconocer
        pregunta: |
          $z^4 = -16$. En los reales esto no tendría solución. ¿Qué cambia en
          los complejos?
        opciones:
          - texto: >-
              Que $-16$ sí tiene raíces cuartas: cuatro, repartidas en una
              circunferencia
            correcta: true
            mensaje: |
              Exacto. En los reales una potencia par nunca da negativo, pero en
              los complejos elevar es girar: basta girar $45°$ cuatro veces para
              llegar a $180°$, que es donde está el $-16$.
          - texto: Que se puede escribir $z^4 = -16$ y por tanto $z = \sqrt[4]{-16} = 2i$
            mensaje: |
              Ese número ni siquiera cumple la ecuación: $(2i)^4 = 16$, no
              $-16$. Y aunque cumpliera, la respuesta serían **cuatro**
              soluciones, no una.
          - texto: Que hay que factorizar $z^4+16$ como suma de cuadrados
            mensaje: |
              Se puede factorizar, sí, pero es un rodeo: te obliga a resolver
              dos ecuaciones de segundo grado con coeficientes complejos. La
              fórmula de las raíces da las cuatro de una vez.
          - texto: Que la ecuación tiene dos soluciones, como toda ecuación par
            mensaje: |
              El número de soluciones lo da el **grado**, no la paridad: una
              ecuación de grado 4 tiene cuatro soluciones en $\mathbb{C}$.

      - tipo: calcular
        titulo: El módulo de las soluciones
        pregunta: ¿Cuánto vale el módulo de cada solución?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              Has sacado la raíz **cuadrada** de 16 en vez de la cuarta. El
              exponente de la ecuación es 4, así que al módulo le corresponde
              $\sqrt[4]{16}$.
          - valor: '16'
            mensaje: |
              Ese es el módulo del segundo miembro, sin sacarle la raíz. Si
              $|z|^4 = 16$, entonces $|z| = 2$.
          - valor: '-2'
            mensaje: |
              Un módulo no es negativo nunca: es una distancia al origen. El
              signo menos del $-16$ está en el **argumento**, no en el módulo.
        pista: |
          $|z^4| = |z|^4$, y $|-16| = 16$. Busca el número que elevado a la
          cuarta da 16.
        desarrollo: |
          $$
          \left|z^{4}\right| = |z|^{4} = |-16| = 16
          \;\Longrightarrow\;
          |z| = \sqrt[4]{16} = 2
          $$
        veredicto: |
          Las cuatro soluciones están en la circunferencia de radio 2.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que justifica dónde están las cuatro
          soluciones. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Se escribe el segundo miembro en polar: $-16 = 16\,e^{i\,180°}$,
              porque su afijo está en el semieje real negativo.
          - texto: |
              Si $z = r e^{i\theta}$, entonces $z^4 = r^4 e^{i\,4\theta}$, así
              que $r^4 = 16$ y $4\theta = 180° + 360°k$.
          - texto: |
              De la primera igualdad, $r = 2$; de la segunda,
              $\theta = 45° + 90°k$.
          - texto: |
              Como $-16$ es real, sus raíces también tienen que ser reales o
              venir en pares conjugados de números reales.
            trampa: true
            mensaje: |
              La segunda parte suena razonable y la primera es falsa: **ninguna**
              de las cuatro raíces es real. Sí es cierto que vienen en pares
              conjugados —porque los coeficientes de la ecuación son reales—,
              pero eso no obliga a que ninguna sea real. Aquí las cuatro son
              complejas con parte real e imaginaria no nulas.
          - texto: |
              Con $k=0,1,2,3$ salen $45°$, $135°$, $225°$ y $315°$: los cuatro
              vértices de un cuadrado.
        veredicto: |
          Cuatro soluciones a $90°$ unas de otras: un cuadrado inscrito en la
          circunferencia de radio 2, girado $45°$ respecto de los ejes.

      - tipo: calcular
        titulo: Las cuatro soluciones
        pregunta: |
          Escribe las **cuatro** soluciones en forma binómica, separadas por
          comas.
        respuesta:
          tipo: conjunto
          valor: '√2+√2i, -√2+√2i, -√2-√2i, √2-√2i'
          tolerancia: 0.02
          formato: las cuatro, separadas por comas
        distractores:
          - valor: '√2+√2i'
            mensaje: |
              Esa es una de las cuatro, y está bien calculada. Pero la ecuación
              es de grado 4: quedarse con la primera raíz es el error que este
              tema persigue desde el principio. Las otras tres salen sumando
              $90°$ al argumento.
          - valor: '2, -2, 2i, -2i'
            mensaje: |
              Esas son las raíces cuartas de $16$, no de $-16$. Te has dejado el
              signo: el segundo miembro tiene argumento $180°$, así que los
              argumentos de las raíces son $45° + 90°k$, no $0° + 90°k$.
          - valor: '√2+√2i, -√2-√2i'
            mensaje: |
              Has dado solo dos, las opuestas entre sí. Faltan las otras dos, que
              son sus conjugadas: al girar $90°$ desde la primera aparecen las
              cuatro, no dos.
        pista: |
          $z_k = 2\,e^{i(45° + 90°k)}$. Y $2\cos 45° = 2\cdot\frac{\sqrt2}{2} = \sqrt2$,
          igual para el seno.
        desarrollo: |
          $$
          z_k = 2\,e^{i(45° + 90°k)}, \qquad k = 0,1,2,3
          $$

          Pasando cada una a forma binómica, y usando
          $\cos 45° = \mathrm{sen}\,45° = \frac{\sqrt2}{2}$:

          $$
          z_0 = 2\left(\tfrac{\sqrt2}{2} + i\tfrac{\sqrt2}{2}\right) = \sqrt2 + i\sqrt2
          $$

          $$
          z_1 = -\sqrt2 + i\sqrt2, \qquad
          z_2 = -\sqrt2 - i\sqrt2, \qquad
          z_3 = \sqrt2 - i\sqrt2
          $$

          o, todas juntas, $z = \sqrt2\,(\pm 1 \pm i)$.
        veredicto: |
          La forma compacta $\sqrt2(\pm1\pm i)$ es la que da el boletín: las
          cuatro combinaciones de signos, que son los cuatro vértices del
          cuadrado.

    resolucion: |
      **Datos.** Se pide resolver $z^4 + 16 = 0$, dar las soluciones en forma
      binómica y representarlas.

      ### 1 · Por qué esto tiene solución aquí y no en los reales

      La ecuación es $z^4 = -16$. En $\mathbb{R}$ no hay solución: una potencia
      par de un real nunca es negativa. En $\mathbb{C}$ sí, porque elevar a una
      potencia **gira**: cuatro giros de $45°$ llevan al semieje real negativo,
      que es donde está el $-16$.

      ### 2 · Herramienta

      Se escribe el segundo miembro en polar,

      $$
      -16 = 16\,e^{i\,180°}
      $$

      y se aplica la fórmula de las raíces $n$-ésimas, válida porque
      $-16 \neq 0$:

      $$
      z_k = \sqrt[4]{16}\;e^{i\frac{180° + 360°k}{4}}, \qquad k = 0,1,2,3
      $$

      Son cuatro porque el grado es 4.

      ### 3 · Módulo y argumentos

      $$
      |z| = \sqrt[4]{16} = 2
      $$

      $$
      \theta_k = \frac{180° + 360°k}{4} = 45° + 90°k
        \;\Longrightarrow\; 45°,\; 135°,\; 225°,\; 315°
      $$

      ### 4 · Paso a forma binómica

      Como $\cos 45° = \mathrm{sen}\,45° = \frac{\sqrt2}{2}$ y el módulo es 2,
      cada componente vale $2\cdot\frac{\sqrt2}{2} = \sqrt2$:

      $$
      z_0 = \sqrt2 + i\sqrt2, \quad
      z_1 = -\sqrt2 + i\sqrt2, \quad
      z_2 = -\sqrt2 - i\sqrt2, \quad
      z_3 = \sqrt2 - i\sqrt2
      $$

      que se escribe de forma compacta como

      $$
      z = \sqrt2\,(\pm 1 \pm i)
      $$

      ### 5 · Representación gráfica

      Los cuatro afijos son los vértices de un **cuadrado** inscrito en la
      circunferencia de radio 2, con los vértices sobre las bisectrices de los
      cuadrantes. Vienen además en pares conjugados —$z_0$ con $z_3$, y $z_1$
      con $z_2$—, como tiene que pasar en toda ecuación de coeficientes reales.

      ### 6 · Comprobación

      Con la primera: $(\sqrt2+i\sqrt2)^2 = 2 + 2\cdot 2i + 2i^2 = 4i$, y
      $(4i)^2 = -16$. Se cumple la ecuación.

      ### Resultado

      $$
      \boxed{\;z = \sqrt2\,(\pm 1 \pm i)\;}
      $$

  - id: ecuacion-cuadrado-conjugado
    titulo: Cuando el cuadrado es el conjugado
    fuente: >-
      Ejercicio 1.10 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU

    enunciado: |
      $$
      z^{2} = \overline{z}
      $$
    pide: Calcular y representar gráficamente las soluciones de la ecuación.

    pasos:
      - tipo: reconocer
        pregunta: |
          Aquí no se puede aplicar la fórmula de las raíces: la incógnita
          aparece a los dos lados y en uno está conjugada. ¿Por dónde se entra?
        opciones:
          - texto: Tomar módulos en los dos miembros, que reduce la ecuación a una en $|z|$
            correcta: true
            mensaje: |
              Ese es el truco de este tipo de ecuaciones. Como
              $\left|z^{2}\right| = |z|^{2}$ y $\left|\overline{z}\right| = |z|$,
              queda $|z|^2 = |z|$: una ecuación de números reales que solo tiene
              dos soluciones posibles.
          - texto: Escribir $z = a+bi$ y resolver el sistema de dos ecuaciones reales
            mensaje: |
              Funciona y es perfectamente válido, pero es el camino largo: sale
              un sistema con $a^2-b^2 = a$ y $2ab = -b$, con casos que hay que
              discutir. Tomar módulos primero deja el problema casi resuelto.
          - texto: Elevar los dos miembros al cuadrado para quitar el conjugado
            mensaje: |
              El conjugado no desaparece al elevar al cuadrado:
              $\left(\overline{z}\right)^2$ sigue teniendo la barra. Y de paso
              subes el grado de la ecuación, con lo que aparecerían soluciones
              falsas.
          - texto: Dividir los dos miembros entre $z$ para simplificar
            mensaje: |
              Dividir entre $z$ solo vale si $z \neq 0$, y aquí **el cero es
              solución**. Al dividir la perderías sin enterarte: es el error más
              caro de este ejercicio.

      - tipo: calcular
        titulo: Los módulos posibles
        pregunta: |
          Tomando módulos queda $|z|^2 = |z|$. ¿Cuáles son los dos valores
          posibles de $|z|$? Escríbelos separados por comas.
        respuesta:
          tipo: conjunto
          valor: '0, 1'
          tolerancia: 0.01
          formato: los dos, separados por comas
        distractores:
          - valor: '1'
            mensaje: |
              Te has dejado el 0, y con él una solución entera de la ecuación.
              Eso pasa por simplificar $|z|^2 = |z|$ dividiendo entre $|z|$: al
              dividir se pierde siempre la raíz nula.
          - valor: '0, 1, -1'
            mensaje: |
              El $-1$ no puede ser: un módulo es una distancia y nunca es
              negativo. La ecuación $|z|^2 = |z|$ se resuelve **entre los reales
              no negativos**.
        pista: |
          $|z|^2 = |z|$ se escribe como $|z|\left(|z| - 1\right) = 0$. Un
          producto es cero cuando lo es alguno de sus factores.
        desarrollo: |
          $$
          \left|z^{2}\right| = \left|\overline{z}\right|
          \;\Longrightarrow\;
          |z|^{2} = |z|
          \;\Longrightarrow\;
          |z|\left(|z| - 1\right) = 0
          $$

          y como $|z| \ge 0$, las únicas posibilidades son

          $$
          |z| = 0 \quad \text{o} \quad |z| = 1
          $$
        veredicto: |
          El caso $|z| = 0$ da directamente $z = 0$, que **sí** cumple la
          ecuación: $0^2 = 0$. Queda estudiar el caso $|z| = 1$.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento del caso $|z| = 1$. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              Si $|z| = 1$, entonces $z\,\overline{z} = |z|^2 = 1$, de donde
              $\overline{z} = \dfrac{1}{z}$.
          - texto: |
              Sustituyendo en la ecuación: $z^{2} = \dfrac{1}{z}$, y
              multiplicando por $z$ queda $z^{3} = 1$.
          - texto: |
              Multiplicar por $z$ es legítimo aquí porque en este caso
              $|z| = 1$, así que $z \neq 0$.
          - texto: |
              Las raíces cúbicas de la unidad son $1$, $e^{i120°}$ y
              $e^{i240°}$, es decir $1$ y $-\frac12 \pm \frac{\sqrt3}{2}i$.
          - texto: |
              Como $z^3 = 1$ y $1$ es real, la única solución posible es
              $z = 1$.
            trampa: true
            mensaje: |
              Que el segundo miembro sea real no obliga a que la solución lo
              sea: $z^3 = 1$ tiene **tres** soluciones, y dos de ellas son
              complejas. Es el mismo error que la teoría del tema ya nombra con
              $\sqrt[3]{8}$. Quedarse con $z=1$ aquí cuesta dos de las cuatro
              soluciones del ejercicio.
        veredicto: |
          Juntando los dos casos: el $0$ del primero y las tres raíces cúbicas
          de la unidad del segundo. Cuatro soluciones en total.

      - tipo: calcular
        titulo: Todas las soluciones
        pregunta: |
          Escribe **todas** las soluciones en forma binómica, separadas por
          comas.
        respuesta:
          tipo: conjunto
          valor: '0, 1, -1/2+√3/2i, -1/2-√3/2i'
          tolerancia: 0.02
          formato: todas, separadas por comas
        distractores:
          - valor: '1, -1/2+√3/2i, -1/2-√3/2i'
            mensaje: |
              Las tres que has escrito están bien, pero falta el $0$. Es la
              solución que se pierde al dividir entre $z$ o al olvidar el caso
              $|z| = 0$, y vale exactamente lo mismo que las otras tres.
          - valor: '0, 1'
            mensaje: |
              Te has quedado con las dos soluciones «reales» y has perdido las
              dos complejas. $z^3 = 1$ tiene tres raíces, no una.
          - valor: '0, 1, -1'
            mensaje: |
              El $-1$ no cumple la ecuación: $(-1)^2 = 1$ y su conjugado es
              $-1$, así que $1 \neq -1$. Las otras dos soluciones no son reales:
              son $-\frac12 \pm \frac{\sqrt3}{2}i$.
        pista: |
          Junta los dos casos: $z=0$ del primero, y las tres raíces cúbicas de
          la unidad del segundo.
        desarrollo: |
          **Caso $|z| = 0$:** $z = 0$, que cumple la ecuación.

          **Caso $|z| = 1$:** de $z\overline{z} = 1$ se despeja
          $\overline{z} = 1/z$, y la ecuación pasa a ser

          $$
          z^{2} = \frac{1}{z} \;\Longrightarrow\; z^{3} = 1
          $$

          cuyas soluciones son las tres raíces cúbicas de la unidad:

          $$
          z = 1, \qquad z = -\frac12 + \frac{\sqrt3}{2}i, \qquad
          z = -\frac12 - \frac{\sqrt3}{2}i
          $$
        veredicto: |
          Cuatro soluciones: el origen y los tres vértices de un triángulo
          equilátero inscrito en la circunferencia unidad.

    resolucion: |
      **Datos.** Se pide resolver y representar $z^{2} = \overline{z}$.

      ### 1 · Por qué no vale la fórmula de las raíces

      La incógnita aparece en los dos miembros, y en uno de ellos conjugada.
      No es una ecuación del tipo $z^n = w$, así que la fórmula de las raíces
      no se puede aplicar directamente. La entrada natural es **tomar módulos**,
      que convierte una ecuación compleja en una ecuación real.

      ### 2 · Los módulos posibles

      Tomando módulos en los dos miembros, y usando
      $\left|z^{2}\right| = |z|^{2}$ y $\left|\overline{z}\right| = |z|$:

      $$
      |z|^{2} = |z| \;\Longrightarrow\; |z|\left(|z|-1\right) = 0
      $$

      Como el módulo no es negativo, solo hay dos posibilidades: $|z| = 0$ o
      $|z| = 1$. **Conviene no dividir entre $|z|$**: eso perdería el caso
      $|z| = 0$, que es una solución de verdad.

      ### 3 · Caso $|z| = 0$

      Es inmediato: $z = 0$. Y comprueba la ecuación, porque
      $0^{2} = 0 = \overline{0}$.

      ### 4 · Caso $|z| = 1$

      De $z\,\overline{z} = |z|^{2} = 1$ se despeja $\overline{z} = 1/z$, que es
      lícito porque en este caso $z \neq 0$. Sustituyendo:

      $$
      z^{2} = \frac{1}{z} \;\Longrightarrow\; z^{3} = 1
      $$

      Las raíces cúbicas de la unidad tienen módulo 1 y argumentos
      $\frac{0° + 360°k}{3} = 0°,\,120°,\,240°$:

      $$
      z = 1, \qquad z = -\frac{1}{2} + \frac{\sqrt3}{2}i, \qquad
      z = -\frac{1}{2} - \frac{\sqrt3}{2}i
      $$

      ### 5 · Representación gráfica

      Cuatro afijos: el **origen**, y los tres vértices de un triángulo
      equilátero inscrito en la circunferencia unidad, con un vértice en el 1 y
      los otros dos simétricos respecto del eje real.

      ### 6 · Comprobación

      Con $z = -\frac12 + \frac{\sqrt3}{2}i$, que tiene módulo 1 y argumento
      $120°$: su cuadrado tiene módulo 1 y argumento $240°$, y su conjugado
      tiene módulo 1 y argumento $-120° = 240°$. Coinciden, así que cumple la
      ecuación.

      ### Resultado

      $$
      \boxed{\;z \in \left\{0,\; 1,\; -\tfrac12 + \tfrac{\sqrt3}{2}i,\;
      -\tfrac12 - \tfrac{\sqrt3}{2}i\right\}\;}
      $$

  - id: ecuacion-cuarta-conjugado
    titulo: Una ecuación con potencia y conjugado
    fuente: >-
      Ejercicio 1.11 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU
      (2018/2019 3E)

    enunciado: |
      $$
      z^{4}\,\overline{z}\,i + 1 = 0
      $$
    pide: Calcular y representar gráficamente las soluciones de la ecuación.

    pasos:
      - tipo: reconocer
        pregunta: |
          Hay una potencia, un conjugado y un factor $i$. ¿Cuál es la forma de
          atacarlo?
        opciones:
          - texto: Escribir $z = re^{i\theta}$ y dejar la ecuación en función de $r$ y $\theta$
            correcta: true
            mensaje: |
              Eso es. En polar, $z^4\overline{z}$ se simplifica solo:
              $r^4e^{4i\theta}\cdot re^{-i\theta} = r^5e^{3i\theta}$. Módulo y
              argumento quedan separados, y cada uno da su ecuación.
          - texto: Sustituir $z = a+bi$ y desarrollar la potencia cuarta
            mensaje: |
              Desarrollar $(a+bi)^4$ y multiplicarlo por $a-bi$ da un polinomio
              de quinto grado en dos variables. Es correcto y es inabordable a
              mano.
          - texto: Como aparece $\overline{z}$, tomar conjugados en toda la ecuación
            mensaje: |
              Obtienes otra ecuación igual de complicada, con $\overline{z}^4 z$.
              No has avanzado: has cambiado la incógnita por su conjugada.
          - texto: Despejar $\overline{z} = -\dfrac{1}{i\,z^{4}}$ y sustituir
            mensaje: |
              Es un paso legítimo, pero te deja con $\overline{z}$ despejado y
              sin saber qué hacer con él: para seguir tendrías que pasar a polar
              igualmente. Empieza por ahí directamente.

      - tipo: calcular
        titulo: El módulo
        pregunta: |
          En polar la ecuación es $r^{5}e^{i(3\theta + 90°)} = 1\cdot e^{i180°}$.
          ¿Cuánto vale $r$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '5'
            mensaje: |
              El 5 es el exponente, no el valor. De $r^{5} = 1$ con $r$ real y
              no negativo sale $r = 1$.
          - valor: '-1'
            mensaje: |
              Un módulo nunca es negativo. Y aunque se permitiera,
              $(-1)^5 = -1 \neq 1$.
          - valor: '0'
            mensaje: |
              Si $r = 0$ el primer miembro sería 0, y la ecuación pide que valga
              1. Aquí, a diferencia de otros ejercicios del boletín, el cero
              **no** es solución.
        pista: |
          Iguala módulos: $\left|z^4\overline{z}i\right| = r^4\cdot r\cdot 1 = r^5$,
          y el segundo miembro tiene módulo 1.
        desarrollo: |
          Con $z = re^{i\theta}$:

          $$
          z^{4}\overline{z} = r^{4}e^{4i\theta}\cdot re^{-i\theta} = r^{5}e^{3i\theta}
          $$

          Multiplicando por $i = e^{i90°}$ e igualando a $-1 = e^{i180°}$:

          $$
          r^{5}e^{i(3\theta+90°)} = 1\cdot e^{i180°}
          $$

          Los módulos han de coincidir: $r^{5} = 1$, y como $r \ge 0$ es real,
          $r = 1$.
        veredicto: |
          Todas las soluciones están en la circunferencia unidad. Solo falta
          saber en qué direcciones.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que obtiene los argumentos. Una de las piezas
          no debe entrar.
        piezas:
          - texto: |
              Igualando los argumentos: $3\theta + 90° = 180° + 360°k$, con
              $k \in \mathbb{Z}$.
          - texto: |
              El $+360°k$ hay que ponerlo: dos argumentos que difieren en
              vueltas enteras representan el mismo número.
          - texto: |
              Despejando, $\theta = 30° + 120°k$.
          - texto: |
              Los valores $k=0,1,2$ dan $30°$, $150°$ y $270°$; a partir de
              $k=3$ se repiten los mismos afijos.
          - texto: |
              Como $k$ recorre todos los enteros, la ecuación tiene infinitas
              soluciones.
            trampa: true
            mensaje: |
              Infinitos **valores de $k$**, sí; infinitas soluciones, no. A
              partir de $k=3$ los ángulos se repiten módulo $360°$ y devuelven
              afijos ya obtenidos: $\theta = 390°$ es el mismo punto que
              $\theta = 30°$. Soluciones distintas hay tres, que es lo que cabe
              esperar de una ecuación que en el fondo es cúbica en el argumento.
        veredicto: |
          Tres soluciones separadas $120°$: otra vez un triángulo equilátero,
          esta vez con un vértice a $30°$.

      - tipo: calcular
        titulo: Las soluciones
        pregunta: Escribe las soluciones en forma binómica, separadas por comas.
        respuesta:
          tipo: conjunto
          valor: '√3/2+1/2i, -√3/2+1/2i, -i'
          tolerancia: 0.02
          formato: todas, separadas por comas
        distractores:
          - valor: '√3/2+1/2i'
            mensaje: |
              Es la primera y está bien, pero hay tres. Las otras dos salen
              sumando $120°$ y $240°$ al argumento.
          - valor: '1/2+√3/2i, -1/2+√3/2i, -i'
            mensaje: |
              Has intercambiado el seno y el coseno: para $30°$ el coseno vale
              $\frac{\sqrt3}{2}$ y el seno $\frac12$, no al revés. Eso es
              $60°$.
          - valor: 'i, -i, 1'
            mensaje: |
              Esos son los afijos a $90°$, $270°$ y $0°$, que no salen de
              $\theta = 30° + 120°k$. Repasa el despeje del argumento.
        pista: |
          $\theta = 30°,\,150°,\,270°$ y módulo 1. Recuerda
          $\cos 30° = \frac{\sqrt3}{2}$ y $\mathrm{sen}\,30° = \frac12$.
        desarrollo: |
          $$
          z_k = e^{i(30° + 120°k)}, \qquad k = 0,1,2
          $$

          $$
          z_0 = \cos 30° + i\,\mathrm{sen}\,30° = \frac{\sqrt3}{2} + \frac{1}{2}i
          $$

          $$
          z_1 = \cos 150° + i\,\mathrm{sen}\,150° = -\frac{\sqrt3}{2} + \frac{1}{2}i
          $$

          $$
          z_2 = \cos 270° + i\,\mathrm{sen}\,270° = -i
          $$
        veredicto: |
          El boletín las da como $z = e^{i\pi/6 + 2\pi k/3}$ con $k=0,1,2$, que
          es lo mismo escrito en radianes.

    resolucion: |
      **Datos.** Se pide resolver y representar

      $$
      z^{4}\,\overline{z}\,i + 1 = 0
      \qquad\Longleftrightarrow\qquad
      z^{4}\,\overline{z}\,i = -1
      $$

      ### 1 · Por qué se pasa a polar

      Aparecen una potencia, un conjugado y un producto. En forma binómica eso
      es un polinomio de quinto grado en dos variables reales; en forma polar,
      en cambio, la potencia multiplica el argumento y el conjugado lo cambia de
      signo, y todo se simplifica de golpe.

      Con $z = re^{i\theta}$:

      $$
      z^{4}\overline{z} = r^{4}e^{4i\theta}\cdot re^{-i\theta} = r^{5}e^{3i\theta}
      $$

      ### 2 · La ecuación, separada en dos

      Como $i = e^{i90°}$ y $-1 = e^{i180°}$:

      $$
      r^{5}\,e^{i(3\theta + 90°)} = 1\cdot e^{i\,180°}
      $$

      Dos complejos son iguales cuando coinciden sus módulos y sus argumentos
      salvo vueltas enteras. Eso da dos ecuaciones:

      $$
      r^{5} = 1, \qquad 3\theta + 90° = 180° + 360°k
      $$

      ### 3 · Resolución

      De la primera, y como $r$ es un módulo —real y no negativo—, $r = 1$.

      De la segunda:

      $$
      3\theta = 90° + 360°k \;\Longrightarrow\; \theta = 30° + 120°k
      $$

      Con $k = 0, 1, 2$ salen $30°$, $150°$ y $270°$. A partir de $k=3$ los
      ángulos se repiten módulo $360°$: no hay más soluciones distintas.

      ### 4 · Las soluciones, en forma binómica

      $$
      z_0 = \frac{\sqrt3}{2} + \frac{1}{2}i, \qquad
      z_1 = -\frac{\sqrt3}{2} + \frac{1}{2}i, \qquad
      z_2 = -i
      $$

      ### 5 · Representación gráfica

      Tres afijos sobre la circunferencia unidad, separados $120°$: un triángulo
      equilátero con un vértice a $30°$ y otro apuntando hacia abajo, al $-i$.

      ### 6 · Comprobación

      Con $z_2 = -i$: $z_2^{4} = (-i)^4 = 1$ y su conjugada es $i$, luego el
      primer miembro vale $1 \cdot i \cdot i = i^{2} = -1$. Cumple la ecuación.

      ### Resultado

      $$
      \boxed{\;z_k = e^{i\left(\frac{\pi}{6} + \frac{2\pi k}{3}\right)},\quad k = 0,1,2\;}
      $$

  - id: ecuacion-bicubica
    titulo: Una ecuación de grado seis que es de segundo
    fuente: >-
      Ejercicio 1.12 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU
      (2018/2019 1E)

    enunciado: |
      $$
      z^{6} + 7z^{3} - 8 = 0
      $$
    pide: Calcular y representar gráficamente las soluciones de la ecuación.

    pasos:
      - tipo: reconocer
        pregunta: |
          Grado seis. ¿Hay que resolver un polinomio de sexto grado?
        opciones:
          - texto: >-
              No: llamando $w = z^{3}$ queda una ecuación de segundo grado en $w$
            correcta: true
            mensaje: |
              Eso es. Solo aparecen $z^6$ y $z^3$, y $z^6 = \left(z^3\right)^2$.
              El cambio la convierte en $w^2+7w-8=0$, que se resuelve con la
              fórmula de siempre; después, cada $w$ da tres $z$.
          - texto: Sí, y hay que buscar las seis raíces con la fórmula de las raíces $n$-ésimas
            mensaje: |
              La fórmula de las raíces solo sirve para ecuaciones del tipo
              $z^n = w$, con un único término en $z$. Aquí hay dos, así que no se
              puede aplicar directamente.
          - texto: Sí, y hay que factorizar por Ruffini probando divisores de 8
            mensaje: |
              Encontrarías $z=1$ y $z=-2$, que son las dos soluciones reales,
              pero te dejarías las cuatro complejas por el camino. El cambio de
              variable las da todas.
          - texto: >-
              No: se puede simplificar dividiendo toda la ecuación entre $z^{3}$
            mensaje: |
              Dividir entre $z^3$ deja $z^3 + 7 - 8/z^3 = 0$, que es peor. Y
              además solo sería lícito si $z \neq 0$, cosa que habría que
              comprobar antes.

      - tipo: calcular
        titulo: El cambio de variable
        pregunta: |
          Con $w = z^{3}$, resuelve $w^{2} + 7w - 8 = 0$. ¿Cuáles son los dos
          valores de $w$? Escríbelos separados por comas.
        respuesta:
          tipo: conjunto
          valor: '1, -8'
          tolerancia: 0.01
          formato: los dos, separados por comas
        distractores:
          - valor: '-1, 8'
            mensaje: |
              Signos cambiados. Comprueba con la suma y el producto: las dos
              raíces suman $-7$ y multiplican $-8$. Con $-1$ y $8$ la suma daría
              $+7$.
          - valor: '1, 8'
            mensaje: |
              El producto de las raíces tiene que ser el término independiente,
              $-8$. Con $1$ y $8$ da $+8$: falta un signo negativo en una de las
              dos.
          - valor: '1'
            mensaje: |
              Una ecuación de segundo grado tiene dos raíces. La otra es $-8$, y
              es justamente la que da las tres soluciones más interesantes.
        pista: |
          $w = \dfrac{-7 \pm \sqrt{49 + 32}}{2}$, y $\sqrt{81} = 9$.
        desarrollo: |
          $$
          w = \frac{-7 \pm \sqrt{7^{2} - 4\cdot 1\cdot(-8)}}{2}
            = \frac{-7 \pm \sqrt{81}}{2} = \frac{-7 \pm 9}{2}
          $$

          $$
          w_1 = 1, \qquad w_2 = -8
          $$
        veredicto: |
          Dos valores de $w$, y cada uno esconde tres valores de $z$: seis en
          total, que es lo que tiene que dar una ecuación de grado seis.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que cuenta las soluciones. Una de las piezas no
          debe entrar.
        piezas:
          - texto: |
              El cambio $w = z^{3}$ transforma la ecuación en
              $w^{2}+7w-8=0$, con soluciones $w = 1$ y $w = -8$.
          - texto: |
              Deshacer el cambio no es sustituir: cada valor de $w$ obliga a
              resolver una ecuación $z^{3} = w$.
          - texto: |
              Cada una de esas dos ecuaciones cúbicas aporta tres soluciones
              distintas.
          - texto: |
              En total $2 \times 3 = 6$, que coincide con el grado de la ecuación
              original, como garantiza el teorema fundamental del álgebra.
          - texto: |
              Como $w=1$ da $z=1$ y $w=-8$ da $z=-2$, la ecuación tiene dos
              soluciones.
            trampa: true
            mensaje: |
              Esas son solo las dos soluciones **reales**. Deshacer un cambio de
              variable en $\mathbb{C}$ no es sacar una raíz: es resolver una
              ecuación, y $z^3 = 1$ tiene tres soluciones igual que
              $z^3 = -8$. Quedarse aquí cuesta cuatro de las seis.
        veredicto: |
          El teorema fundamental del álgebra es la comprobación: si no salen
          seis, falta algo.

      - tipo: calcular
        titulo: Las seis soluciones
        pregunta: |
          Escribe las **seis** soluciones en forma binómica, separadas por
          comas.
        respuesta:
          tipo: conjunto
          valor: '1, -1/2+√3/2i, -1/2-√3/2i, 1+√3i, -2, 1-√3i'
          tolerancia: 0.02
          formato: las seis, separadas por comas
        distractores:
          - valor: '1, -2'
            mensaje: |
              Las dos soluciones reales. Faltan las cuatro complejas: las otras
              dos raíces cúbicas de 1 y las otras dos de $-8$.
          - valor: '1, -1/2+√3/2i, -1/2-√3/2i'
            mensaje: |
              Esas son las tres raíces cúbicas de $w=1$. Falta resolver el otro
              caso, $z^{3} = -8$, que aporta las otras tres.
          - valor: '1, -1/2+√3/2i, -1/2-√3/2i, -2, 1+√3i, 1-√3i, 2'
            mensaje: |
              Sobra una: el $2$ no cumple la ecuación, porque $2^3 = 8$ y hacía
              falta $-8$. Las raíces cúbicas de $-8$ tienen módulo 2, pero
              argumentos $60°$, $180°$ y $300°$: solo una de ellas es real, y es
              el $-2$.
        pista: |
          $z^3 = 1$ da módulo 1 y argumentos $0°, 120°, 240°$. $z^3 = -8$ da
          módulo 2 y argumentos $60°, 180°, 300°$.
        desarrollo: |
          **Caso $w = 1$.** $z^{3} = 1 = e^{i0°}$: módulo $\sqrt[3]{1} = 1$ y
          argumentos $\frac{0°+360°k}{3} = 0°, 120°, 240°$:

          $$
          z = 1, \qquad z = -\frac12 + \frac{\sqrt3}{2}i, \qquad
          z = -\frac12 - \frac{\sqrt3}{2}i
          $$

          **Caso $w = -8$.** $z^{3} = -8 = 8\,e^{i180°}$: módulo
          $\sqrt[3]{8} = 2$ y argumentos $\frac{180°+360°k}{3} = 60°, 180°, 300°$:

          $$
          z = 2e^{i60°} = 1 + \sqrt3\,i, \qquad
          z = 2e^{i180°} = -2, \qquad
          z = 2e^{i300°} = 1 - \sqrt3\,i
          $$
        veredicto: |
          Seis afijos en **dos** circunferencias: tres en la de radio 1 y tres
          en la de radio 2. Cada terna forma su propio triángulo equilátero.

    resolucion: |
      **Datos.** Se pide resolver y representar $z^{6} + 7z^{3} - 8 = 0$.

      ### 1 · La ecuación no es de sexto grado, es bicúbica

      Solo aparecen $z^{6}$ y $z^{3}$, y $z^{6} = \left(z^{3}\right)^{2}$. El
      cambio $w = z^{3}$ la convierte en una ecuación de segundo grado:

      $$
      w^{2} + 7w - 8 = 0
      $$

      ### 2 · Resolución en $w$

      $$
      w = \frac{-7 \pm \sqrt{49 + 32}}{2} = \frac{-7 \pm 9}{2}
      \;\Longrightarrow\; w_1 = 1,\quad w_2 = -8
      $$

      ### 3 · Deshacer el cambio: dos ecuaciones cúbicas

      Aquí está el paso que decide el ejercicio. Deshacer el cambio **no** es
      escribir $z = \sqrt[3]{w}$ y quedarse con un número: es resolver
      $z^{3} = w$, que en $\mathbb{C}$ tiene tres soluciones para cada $w$.

      **$z^{3} = 1 = e^{i0°}$:** módulo 1, argumentos $0°$, $120°$, $240°$.

      $$
      z = 1, \qquad -\frac12 + \frac{\sqrt3}{2}i, \qquad -\frac12 - \frac{\sqrt3}{2}i
      $$

      **$z^{3} = -8 = 8e^{i180°}$:** módulo $\sqrt[3]{8} = 2$, argumentos
      $60°$, $180°$, $300°$.

      $$
      z = 1 + \sqrt3\,i, \qquad -2, \qquad 1 - \sqrt3\,i
      $$

      ### 4 · Recuento

      Seis soluciones, que es exactamente lo que garantiza el teorema
      fundamental del álgebra para una ecuación de grado seis. Si salieran menos,
      faltaría alguna.

      ### 5 · Representación gráfica

      Los seis afijos se reparten en **dos circunferencias concéntricas**: tres
      en la de radio 1, a $0°$, $120°$ y $240°$; y tres en la de radio 2, a
      $60°$, $180°$ y $300°$. Cada terna es un triángulo equilátero, y uno está
      girado $60°$ respecto del otro, de modo que los seis puntos quedan
      alternados como los vértices de un hexágono irregular.

      ### 6 · Comprobación

      Con $z = -2$: $z^{3} = -8$ y $z^{6} = 64$, luego
      $64 + 7(-8) - 8 = 64 - 56 - 8 = 0$. Cumple.

      ### Resultado

      $$
      \boxed{\;z \in \left\{1,\; -\tfrac12 \pm \tfrac{\sqrt3}{2}i,\;
      1 \pm \sqrt3\,i,\; -2\right\}\;}
      $$

  - id: ecuacion-cubo-menos-modulo
    titulo: El cubo igual a menos el módulo
    fuente: >-
      Ejercicio 1.13 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU
      (2017/2018 3E)

    enunciado: |
      $$
      z^{3} = -|z|
      $$
    pide: Calcular y representar gráficamente las soluciones de la ecuación.

    pasos:
      - tipo: reconocer
        pregunta: |
          El segundo miembro no es un número dado: depende de la propia
          incógnita. ¿Qué se hace?
        opciones:
          - texto: Tomar módulos, que da una ecuación real en $|z|$
            correcta: true
            mensaje: |
              Eso es. $\left|z^{3}\right| = |z|^{3}$ y
              $\left|-|z|\right| = |z|$, así que queda $|z|^{3} = |z|$: una
              ecuación real con muy pocas soluciones posibles.
          - texto: Sustituir $|z| = \sqrt{a^{2}+b^{2}}$ y desarrollar $(a+bi)^{3}$
            mensaje: |
              Es correcto pero brutal: te queda un sistema con raíces cuadradas
              y cubos de binomios. Tomar módulos primero reduce el problema a
              dos casos.
          - texto: Como $-|z|$ es real y negativo, $z$ tiene que ser real y negativo
            mensaje: |
              El segundo miembro sí es real, pero eso no obliga a que $z$ lo
              sea: hay complejos no reales cuyo cubo es real. De hecho dos de
              las soluciones son de ese tipo.
          - texto: Elevar los dos miembros al cuadrado para quitar el valor absoluto
            mensaje: |
              Subes el grado y te arriesgas a introducir soluciones falsas que
              luego habría que descartar una a una. El valor absoluto se maneja
              tomando módulos, no elevando.

      - tipo: calcular
        titulo: Los módulos posibles
        pregunta: |
          De $|z|^{3} = |z|$, ¿qué valores puede tomar $|z|$? Escríbelos
          separados por comas.
        respuesta:
          tipo: conjunto
          valor: '0, 1'
          tolerancia: 0.01
          formato: separados por comas
        distractores:
          - valor: '1'
            mensaje: |
              Falta el 0, que sale de no dividir entre $|z|$. Y el 0 no es un
              caso de adorno: $z=0$ es solución de la ecuación original.
          - valor: '0, 1, -1'
            mensaje: |
              El $-1$ no vale: $|z|$ es una distancia y no puede ser negativa.
              La ecuación $|z|^3 = |z|$ se resuelve entre los reales no
              negativos.
        pista: |
          $|z|^{3} - |z| = |z|\left(|z|^{2}-1\right) = 0$, y $|z| \ge 0$.
        desarrollo: |
          $$
          |z|^{3} = |z|
          \;\Longrightarrow\;
          |z|\left(|z|^{2} - 1\right) = 0
          $$

          Las soluciones reales serían $|z| = 0$, $|z| = 1$ y $|z| = -1$, pero la
          última se descarta porque un módulo no es negativo. Quedan

          $$
          |z| = 0 \quad \text{o} \quad |z| = 1
          $$
        veredicto: |
          El caso $|z|=0$ da $z=0$, que cumple la ecuación:
          $0^{3} = 0 = -|0|$.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento del caso $|z| = 1$. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              Si $|z| = 1$, el segundo miembro vale $-|z| = -1$, que ya es un
              número conocido.
          - texto: |
              La ecuación pasa a ser $z^{3} = -1$, del tipo $z^{n} = w$: ahora sí
              se puede aplicar la fórmula de las raíces.
          - texto: |
              $-1 = e^{i180°}$, así que los argumentos son
              $\frac{180° + 360°k}{3} = 60°,\,180°,\,300°$.
          - texto: |
              Las tres tienen módulo $\sqrt[3]{1} = 1$, coherente con el caso
              que se está estudiando.
          - texto: |
              De las tres, solo $z = -1$ es válida, porque las otras dos tienen
              cubo complejo y el segundo miembro es real.
            trampa: true
            mensaje: |
              Las otras dos tienen el cubo **real**, y por eso son solución.
              $e^{i60°}$ elevado al cubo da $e^{i180°} = -1$, que es justo lo que
              pide la ecuación. Que un número sea complejo no impide que su cubo
              sea real: elevar al cubo triplica el argumento, y tres veces $60°$
              son $180°$.
        veredicto: |
          Con el $0$ del primer caso, cuatro soluciones en total.

      - tipo: calcular
        titulo: Todas las soluciones
        pregunta: Escribe todas las soluciones en forma binómica, separadas por comas.
        respuesta:
          tipo: conjunto
          valor: '0, 1/2+√3/2i, -1, 1/2-√3/2i'
          tolerancia: 0.02
          formato: todas, separadas por comas
        distractores:
          - valor: '1/2+√3/2i, -1, 1/2-√3/2i'
            mensaje: |
              Las tres del caso $|z|=1$ están bien. Falta el $0$, que viene del
              otro caso y se pierde cuando se divide entre $|z|$ al principio.
          - valor: '0, -1'
            mensaje: |
              Esas son las dos soluciones reales. $z^{3} = -1$ tiene tres
              raíces, y dos de ellas no son reales.
          - valor: '0, -1/2+√3/2i, -1, -1/2-√3/2i'
            mensaje: |
              Signo cambiado en la parte real de dos soluciones. Los argumentos
              son $60°$ y $300°$, cuyo coseno es $+\frac12$; con $-\frac12$
              estarías en $120°$ y $240°$, que son las raíces cúbicas de $+1$.
        pista: |
          Módulo 1 y argumentos $60°$, $180°$ y $300°$, más el $z=0$ del otro
          caso. Y $\cos 60° = \frac12$, $\mathrm{sen}\,60° = \frac{\sqrt3}{2}$.
        desarrollo: |
          **Caso $|z| = 0$:** $z = 0$.

          **Caso $|z| = 1$:** la ecuación es $z^{3} = -1$, con soluciones de
          módulo 1 y argumentos $60°$, $180°$ y $300°$:

          $$
          z = \frac12 + \frac{\sqrt3}{2}i, \qquad z = -1, \qquad
          z = \frac12 - \frac{\sqrt3}{2}i
          $$
        veredicto: |
          El boletín las escribe como $0$, $e^{i\pi/3}$, $-1$ y $e^{-i\pi/3}$,
          que es lo mismo en forma polar.

    resolucion: |
      **Datos.** Se pide resolver y representar $z^{3} = -|z|$.

      ### 1 · Una ecuación donde el segundo miembro depende de la incógnita

      No es del tipo $z^{n} = w$ con $w$ conocido: el segundo miembro es
      $-|z|$. La forma de entrar es **tomar módulos**, que convierte la ecuación
      compleja en una real.

      $$
      \left|z^{3}\right| = \left|-|z|\right|
      \;\Longrightarrow\;
      |z|^{3} = |z|
      $$

      ### 2 · Los dos casos

      $$
      |z|\left(|z|^{2}-1\right) = 0
      $$

      Como $|z| \ge 0$, solo hay dos posibilidades: $|z| = 0$ o $|z| = 1$. La
      raíz $|z| = -1$ de la ecuación real se descarta por no ser un módulo
      admisible.

      **No conviene dividir entre $|z|$** para simplificar: eso eliminaría el
      caso $|z| = 0$, que aporta una solución de verdad.

      ### 3 · Caso $|z| = 0$

      $z = 0$, y cumple: $0^{3} = 0 = -|0|$.

      ### 4 · Caso $|z| = 1$

      El segundo miembro vale $-1$, así que la ecuación es

      $$
      z^{3} = -1 = e^{i\,180°}
      $$

      Ahora sí es del tipo $z^n = w$. Módulo $\sqrt[3]{1} = 1$ —coherente con el
      caso— y argumentos

      $$
      \theta_k = \frac{180° + 360°k}{3} = 60°,\; 180°,\; 300°
      $$

      $$
      z = \frac12 + \frac{\sqrt3}{2}i, \qquad z = -1, \qquad
      z = \frac12 - \frac{\sqrt3}{2}i
      $$

      Merece la pena subrayar por qué las dos primeras valen aunque no sean
      reales: elevar al cubo **triplica el argumento**, y tres veces $60°$ son
      $180°$, que es la dirección del $-1$.

      ### 5 · Representación gráfica

      Cuatro afijos: el **origen** y tres puntos de la circunferencia unidad a
      $60°$, $180°$ y $300°$, que forman un triángulo equilátero con un vértice
      en el $-1$.

      ### 6 · Comprobación

      Con $z = \frac12 + \frac{\sqrt3}{2}i$, de módulo 1 y argumento $60°$: su
      cubo tiene módulo 1 y argumento $180°$, es decir $-1$. Y $-|z| = -1$.
      Coinciden.

      ### Resultado

      $$
      \boxed{\;z \in \left\{0,\; \tfrac12 + \tfrac{\sqrt3}{2}i,\; -1,\;
      \tfrac12 - \tfrac{\sqrt3}{2}i\right\}\;}
      $$

  - id: logaritmo-complejo
    titulo: Un logaritmo complejo disfrazado
    fuente: >-
      Ejercicio 1.6 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU
      (2015/2016 7E)

    enunciado: |
      $$
      z = \frac{2}{i}\ln\left(\frac{1+i}{1-i}\right)
      $$
    pide: Calcular y representar.

    pasos:
      - tipo: reconocer
        pregunta: |
          Hay un logaritmo de un número complejo. ¿Qué hay que tener presente
          antes de escribir nada?
        opciones:
          - texto: >-
              Que el logaritmo complejo tiene infinitos valores, uno por cada
              vuelta del argumento
            correcta: true
            mensaje: |
              Eso es. $\ln w = \ln|w| + i\left(\arg w + 2\pi k\right)$, con
              $k \in \mathbb{Z}$. Olvidar el $2\pi k$ convierte una respuesta
              infinita en una sola, y el enunciado pide representarla: mal
              asunto si solo dibujas un punto.
          - texto: Que el logaritmo de un complejo no existe si el número no es real positivo
            mensaje: |
              Eso es cierto en $\mathbb{R}$, no en $\mathbb{C}$. Aquí el
              logaritmo está definido para todo $w \neq 0$; lo que ocurre es que
              devuelve infinitos valores en vez de uno.
          - texto: Que hay que separar $\ln\frac{1+i}{1-i} = \ln(1+i) - \ln(1-i)$
            mensaje: |
              Se puede, pero es el camino largo y además delicado: con
              logaritmos multivaluados esa igualdad solo vale módulo $2\pi i$.
              Simplifica el cociente primero, que da un número muy cómodo.
          - texto: Que $2/i$ hay que dejarlo así hasta el final
            mensaje: |
              Al contrario, conviene simplificarlo cuanto antes:
              $\frac{2}{i} = -2i$, y eso hace que al multiplicar por la parte
              imaginaria del logaritmo salga un número real.

      - tipo: calcular
        titulo: El argumento del logaritmo
        pregunta: ¿Cuánto vale $\dfrac{1+i}{1-i}$?
        respuesta:
          tipo: complejo
          valor: 'i'
          tolerancia: 0.02
          formato: forma binómica, tipo a+bi
        distractores:
          - valor: '-i'
            mensaje: |
              Cociente invertido: $\frac{1-i}{1+i}$ sí vale $-i$. Fíjate en cuál
              de los dos lleva el signo menos.
          - valor: '1'
            mensaje: |
              Has simplificado sumandos. En una fracción solo se simplifican
              factores: $\frac{1+i}{1-i}$ no es 1 por mucho que arriba y abajo
              aparezca un 1.
          - valor: '0'
            mensaje: |
              El numerador $1+i$ no es cero, así que el cociente tampoco puede
              serlo.
        pista: |
          Multiplica numerador y denominador por el conjugado del denominador,
          que es $1+i$.
        desarrollo: |
          $$
          \frac{1+i}{1-i} = \frac{(1+i)^{2}}{(1-i)(1+i)} = \frac{1+2i+i^{2}}{1+1}
            = \frac{2i}{2} = i
          $$
        veredicto: |
          El enunciado era $\frac{2}{i}\ln i$ escrito de forma rebuscada.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que calcula $\ln i$ y llega al resultado. Una
          de las piezas no debe entrar.
        piezas:
          - texto: |
              El logaritmo complejo es
              $\ln w = \ln|w| + i\left(\arg w + 2\pi k\right)$ para $w \neq 0$.
          - texto: |
              Con $w = i$: $|i| = 1$, así que $\ln|i| = \ln 1 = 0$, y
              $\arg i = \frac{\pi}{2}$.
          - texto: |
              Por tanto $\ln i = i\left(\frac{\pi}{2} + 2\pi k\right)$, sin
              parte real.
          - texto: |
              Multiplicando por $\frac{2}{i} = -2i$ y usando $-i \cdot i = 1$:
              $z = 2\left(\frac{\pi}{2} + 2\pi k\right) = \pi + 4\pi k$.
          - texto: |
              Como el logaritmo de 1 es 0, la parte real de $z$ es cero y por
              tanto $z$ es imaginario puro.
            trampa: true
            mensaje: |
              Justo al revés. La parte **real** del logaritmo es cero, y al
              multiplicar por $-2i$ esa parte imaginaria se convierte en real:
              $-2i \cdot i\alpha = 2\alpha$. El resultado es un número **real**,
              no imaginario puro — por eso los afijos se dibujan sobre el eje
              real.
        veredicto: |
          El $2\pi k$ del logaritmo se convierte en $4\pi k$ al multiplicar por
          2: los puntos quedan separados $4\pi$, no $2\pi$.

      - tipo: calcular
        titulo: El valor principal
        pregunta: ¿Qué valor toma $z$ para $k = 0$?
        respuesta:
          tipo: numero
          valor: '3.14159265'
          tolerancia: 0.01
          formato: un número; vale escribirlo como 3.1416
        distractores:
          - valor: '1.57079633'
            mensaje: |
              Ese es $\frac{\pi}{2}$, el argumento de $i$. Falta multiplicar por
              el factor $\frac{2}{i}$, que duplica el valor.
          - valor: '6.28318531'
            mensaje: |
              Has multiplicado por 4 en vez de por 2, o has usado $k=0$ en
              $4\pi k$ sumando una vuelta de más. Para $k=0$ queda solo $\pi$.
          - valor: '0'
            mensaje: |
              Cero sería el resultado si $\ln i$ valiese 0, y no vale: su módulo
              es 1 pero su argumento es $\frac{\pi}{2}$, y eso es lo que
              sobrevive.
        pista: |
          $z = \pi + 4\pi k$. Con $k=0$ queda el término independiente.
        desarrollo: |
          $$
          z = \frac{2}{i}\ln i = -2i \cdot i\left(\frac{\pi}{2} + 2\pi k\right)
            = 2\left(\frac{\pi}{2} + 2\pi k\right) = \pi + 4\pi k
          $$

          Con $k = 0$:

          $$
          z = \pi \approx 3{,}1416
          $$
        veredicto: |
          Todos los valores son reales y están separados $4\pi \approx 12{,}57$:
          $\dots,\ -3\pi,\ \pi,\ 5\pi,\ \dots$

    resolucion: |
      **Datos.** Se pide calcular y representar

      $$
      z = \frac{2}{i}\ln\left(\frac{1+i}{1-i}\right)
      $$

      ### 1 · Simplificar el argumento del logaritmo

      $$
      \frac{1+i}{1-i} = \frac{(1+i)^{2}}{(1-i)(1+i)} = \frac{2i}{2} = i
      $$

      El enunciado era, entonces, $z = \frac{2}{i}\ln i$.

      ### 2 · El logaritmo complejo, y por qué es infinito

      Para todo $w \neq 0$,

      $$
      \ln w = \ln|w| + i\left(\arg w + 2\pi k\right), \qquad k \in \mathbb{Z}
      $$

      El $2\pi k$ no es un adorno: el argumento de un complejo está definido
      salvo vueltas enteras, así que el logaritmo devuelve **infinitos** valores.
      Es la diferencia esencial con el logaritmo real.

      Con $w = i$: $|i| = 1$, luego $\ln|i| = 0$; y $\arg i = \frac{\pi}{2}$.

      $$
      \ln i = i\left(\frac{\pi}{2} + 2\pi k\right)
      $$

      ### 3 · El factor de fuera

      $$
      \frac{2}{i} = \frac{2}{i}\cdot\frac{-i}{-i} = -2i
      $$

      y por tanto, usando $-i \cdot i = -i^{2} = 1$:

      $$
      z = -2i \cdot i\left(\frac{\pi}{2}+2\pi k\right)
        = 2\left(\frac{\pi}{2}+2\pi k\right) = \pi + 4\pi k
      $$

      Conviene subrayarlo porque sorprende: **el resultado es real**. La parte
      imaginaria del logaritmo se ha vuelto real al multiplicar por $-2i$.

      ### 4 · Representación gráfica

      Los afijos son puntos del **eje real**, separados $4\pi$ entre sí:

      $$
      \dots,\; -7\pi,\; -3\pi,\; \pi,\; 5\pi,\; 9\pi,\; \dots
      $$

      Es una sucesión infinita de puntos equiespaciados, no un único punto.

      ### 5 · Comprobación

      Con $k=0$, $z = \pi$. Deshaciendo: $\frac{i z}{2} = \frac{i\pi}{2}$, y
      $e^{i\pi/2} = i$, que es efectivamente el número cuyo logaritmo se pedía.

      ### Resultado

      $$
      \boxed{\;z = \pi + 4\pi k,\qquad k \in \mathbb{Z}\;}
      $$

  - id: coseno-complejo-igualdad
    titulo: Una igualdad con coseno complejo
    fuente: >-
      Ejercicio 1.7 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU
      (2013/2014 3E)

    enunciado: |
      $$
      \cos\left(\frac{\pi}{2} + i\ln 2\right) = -\frac{3i}{4}
      $$
    pide: Razonar si la igualdad es cierta.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que usar para calcular el coseno de un número complejo?
        opciones:
          - texto: >-
              La fórmula de adición, que para argumento complejo da
              $\cos(a+bi) = \cos a\cosh b - i\,\mathrm{sen}\,a\,\mathrm{senh}\,b$
            correcta: true
            mensaje: |
              Eso es. La fórmula de adición vale igual en $\mathbb{C}$, y al
              aplicarla aparecen el coseno y el seno **hiperbólicos**, que son
              los que traen el crecimiento.
          - texto: Que el coseno de cualquier número está entre $-1$ y $1$
            mensaje: |
              Eso solo vale para argumentos **reales**. En $\mathbb{C}$ el
              coseno no está acotado: de hecho el ejercicio 1.15 del mismo
              boletín pide resolver $\cos z = 5$.
          - texto: >-
              Que hay que aproximar con la calculadora en modo complejo
            mensaje: |
              El enunciado pide **razonar**, no comprobar numéricamente. Y con
              decimales no distinguirías $-0{,}75i$ de $-0{,}7499i$, que sería un
              resultado distinto.
          - texto: >-
              Que como $\cos\frac{\pi}{2}=0$, todo el coseno vale 0
            mensaje: |
              El argumento no es $\frac{\pi}{2}$, es $\frac{\pi}{2} + i\ln 2$. Hay
              una parte imaginaria, y el coseno no la ignora: la convierte en un
              factor hiperbólico.

      - tipo: calcular
        titulo: El seno hiperbólico que aparece
        pregunta: |
          Al aplicar la fórmula aparece $\mathrm{senh}(\ln 2)$. ¿Cuánto vale?
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1.25'
            mensaje: |
              Eso es $\cosh(\ln 2) = \frac{2 + 1/2}{2}$. El seno hiperbólico
              lleva **resta** en el numerador, no suma.
          - valor: '0.69314718'
            mensaje: |
              Ese es $\ln 2$ a secas, sin pasar por el seno hiperbólico.
          - valor: '1.5'
            mensaje: |
              Te has dejado el 2 del denominador:
              $\mathrm{senh}\,x = \frac{e^{x}-e^{-x}}{2}$, y
              $2 - \frac12 = \frac32$ hay que dividirlo entre 2.
        pista: |
          $\mathrm{senh}\,x = \frac{e^{x}-e^{-x}}{2}$, y $e^{\ln 2} = 2$, así que
          $e^{-\ln 2} = \frac12$.
        desarrollo: |
          $$
          \mathrm{senh}(\ln 2) = \frac{e^{\ln 2} - e^{-\ln 2}}{2}
            = \frac{2 - \frac{1}{2}}{2} = \frac{\frac{3}{2}}{2} = \frac{3}{4}
          $$
        veredicto: |
          Ese $\frac34$ es exactamente el número que aparece en el segundo
          miembro del enunciado. Buena señal.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que decide si la igualdad es cierta. Una de las
          piezas no debe entrar.
        piezas:
          - texto: |
              Se aplica la fórmula de adición:
              $\cos(a+b) = \cos a\cos b - \mathrm{sen}\,a\,\mathrm{sen}\,b$, con
              $a = \frac{\pi}{2}$ y $b = i\ln 2$.
          - texto: |
              Como $\cos\frac{\pi}{2} = 0$ y $\mathrm{sen}\,\frac{\pi}{2} = 1$,
              el primer sumando desaparece y queda
              $-\,\mathrm{sen}(i\ln 2)$.
          - texto: |
              Para argumento imaginario puro,
              $\mathrm{sen}(ix) = i\,\mathrm{senh}\,x$, así que
              $\mathrm{sen}(i\ln 2) = i\,\mathrm{senh}(\ln 2)$.
          - texto: |
              Con $\mathrm{senh}(\ln 2) = \frac34$, el resultado es
              $-\frac{3}{4}i$, que coincide con el enunciado: la igualdad es
              **cierta**.
          - texto: |
              Como el coseno siempre está entre $-1$ y $1$ y $\frac34$ lo está,
              la igualdad es cierta.
            trampa: true
            mensaje: |
              Llega a la conclusión correcta con un argumento falso, que en
              COMP4 vale cero. El coseno complejo **no** está acotado: puede
              valer 5, o un millón. Que aquí el resultado sea pequeño es
              casualidad, no consecuencia de ninguna cota.
        veredicto: |
          La igualdad es cierta, pero lo que se evalúa es el camino. Escribir
          «cierta» sin la fórmula de adición y el paso por el seno hiperbólico
          no puntúa.

      - tipo: calcular
        titulo: El valor del coseno
        pregunta: |
          ¿Cuánto vale $\cos\left(\frac{\pi}{2} + i\ln 2\right)$?
        respuesta:
          tipo: complejo
          valor: '-0.75i'
          tolerancia: 0.01
          formato: forma binómica, tipo a+bi
        distractores:
          - valor: '0.75i'
            mensaje: |
              Signo cambiado. La fórmula de adición lleva un menos delante del
              producto de senos: $\cos a\cos b - \mathrm{sen}\,a\,\mathrm{sen}\,b$.
          - valor: '0.75'
            mensaje: |
              Te has dejado la $i$. $\mathrm{sen}(ix) = i\,\mathrm{senh}\,x$: al
              pasar del seno complejo al hiperbólico aparece una $i$ que no se
              puede tirar.
          - valor: '-1.25i'
            mensaje: |
              Has usado el coseno hiperbólico, $\cosh(\ln 2) = \frac54$, en vez
              del seno. Repasa cuál de los dos sobrevive cuando
              $\cos\frac{\pi}{2} = 0$.
          - valor: '0'
            mensaje: |
              Eso sale de quedarse solo con $\cos\frac{\pi}{2} = 0$ e ignorar la
              parte imaginaria del argumento. El segundo sumando de la fórmula
              de adición no es cero.
        pista: |
          $\cos\left(\frac{\pi}{2}+w\right) = -\,\mathrm{sen}\,w$, y
          $\mathrm{sen}(ix) = i\,\mathrm{senh}\,x$.
        desarrollo: |
          $$
          \cos\left(\frac{\pi}{2} + i\ln 2\right)
            = \cos\frac{\pi}{2}\cos(i\ln 2) - \mathrm{sen}\,\frac{\pi}{2}\,\mathrm{sen}(i\ln 2)
          $$

          Como $\cos\frac{\pi}{2} = 0$ y $\mathrm{sen}\,\frac{\pi}{2} = 1$:

          $$
          = -\,\mathrm{sen}(i\ln 2) = -i\,\mathrm{senh}(\ln 2)
            = -i\cdot\frac{3}{4} = -\frac{3}{4}i
          $$
        veredicto: |
          Coincide con el enunciado, así que la igualdad es **cierta**.

    resolucion: |
      **Datos.** Se pide razonar si es cierta la igualdad

      $$
      \cos\left(\frac{\pi}{2} + i\ln 2\right) = -\frac{3i}{4}
      $$

      ### 1 · Qué es el coseno de un número complejo

      Se define a partir de la exponencial,

      $$
      \cos w = \frac{e^{iw} + e^{-iw}}{2}
      $$

      y de esa definición se sigue que **la fórmula de adición sigue valiendo**
      en $\mathbb{C}$. Conviene decirlo antes de usarla: es la hipótesis del
      razonamiento.

      Conviene también avisar de lo que **no** se conserva: en $\mathbb{C}$ el
      coseno **no está acotado**. La desigualdad $|\cos x| \le 1$ solo vale para
      argumentos reales.

      ### 2 · Aplicar la fórmula de adición

      Con $a = \frac{\pi}{2}$ y $b = i\ln 2$:

      $$
      \cos(a+b) = \cos a\cos b - \mathrm{sen}\,a\,\mathrm{sen}\,b
      $$

      Como $\cos\frac{\pi}{2} = 0$ y $\mathrm{sen}\,\frac{\pi}{2} = 1$, el primer
      sumando se anula:

      $$
      \cos\left(\frac{\pi}{2} + i\ln 2\right) = -\,\mathrm{sen}\left(i\ln 2\right)
      $$

      ### 3 · Del seno complejo al hiperbólico

      Para argumento imaginario puro,

      $$
      \mathrm{sen}(ix) = i\,\mathrm{senh}\,x
      $$

      lo que se comprueba directamente en la definición exponencial. Por tanto

      $$
      \cos\left(\frac{\pi}{2} + i\ln 2\right) = -i\,\mathrm{senh}(\ln 2)
      $$

      ### 4 · El valor del seno hiperbólico

      $$
      \mathrm{senh}(\ln 2) = \frac{e^{\ln 2} - e^{-\ln 2}}{2}
        = \frac{2 - \frac12}{2} = \frac{3}{4}
      $$

      ### 5 · Conclusión

      $$
      \cos\left(\frac{\pi}{2} + i\ln 2\right) = -\frac{3}{4}i
      $$

      que es exactamente el segundo miembro del enunciado. **La igualdad es
      cierta.**

      ### 6 · Comprobación

      Por la definición exponencial, con $w = \frac{\pi}{2}+i\ln 2$:
      $e^{iw} = e^{i\pi/2}e^{-\ln 2} = i\cdot\frac12$ y
      $e^{-iw} = e^{-i\pi/2}e^{\ln 2} = -i\cdot 2$. Su semisuma es

      $$
      \frac{\frac{i}{2} - 2i}{2} = \frac{-\frac{3i}{2}}{2} = -\frac{3}{4}i
      $$

      Las dos vías coinciden.

      ### Resultado

      $$
      \boxed{\;\text{La igualdad es cierta}\;}
      $$

  - id: ecuacion-exponencial
    titulo: Una ecuación exponencial en el plano complejo
    fuente: >-
      Ejercicio 1.14 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU
      (2015/2016 2E)

    enunciado: |
      $$
      e^{iz} = 1+i, \qquad z \in \mathbb{C}
      $$
    pide: Resolver la ecuación y representar gráficamente los afijos de las soluciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          Para despejar $z$ hay que aplicar el logaritmo. ¿Qué precaución exige
          eso aquí?
        opciones:
          - texto: >-
              Que el logaritmo complejo devuelve infinitos valores, así que la
              ecuación tendrá infinitas soluciones
            correcta: true
            mensaje: |
              Eso es. La exponencial compleja es periódica de periodo $2\pi i$,
              así que no es inyectiva: infinitos $z$ distintos dan el mismo
              $e^{iz}$. El $2\pi k$ del logaritmo es lo que recoge ese hecho.
          - texto: Que hay que comprobar que $1+i$ sea positivo para poder tomar logaritmos
            mensaje: |
              Esa condición es del logaritmo **real**. En $\mathbb{C}$ el
              logaritmo está definido para todo $w \neq 0$, y $1+i$ no es cero.
          - texto: Que la ecuación no tiene solución porque una exponencial nunca vale $1+i$
            mensaje: |
              Sí la tiene: la exponencial compleja toma **todos** los valores
              salvo el cero. Que $e^{x}>0$ siempre es un hecho de la exponencial
              real, no de la compleja.
          - texto: Que primero hay que separar $z = a+bi$ y resolver un sistema
            mensaje: |
              Se puede, y de hecho es una comprobación útil al final, pero el
              camino corto es tomar logaritmos: te da las infinitas soluciones
              de una vez.

      - tipo: calcular
        titulo: El logaritmo del segundo miembro
        pregunta: |
          ¿Cuánto vale la parte real de $\ln(1+i)$, es decir $\ln|1+i|$?
        respuesta:
          tipo: numero
          valor: '0.34657359'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.69314718'
            mensaje: |
              Ese es $\ln 2$. El módulo de $1+i$ es $\sqrt2$, no 2, y
              $\ln\sqrt2 = \frac12\ln 2$.
          - valor: '1.41421356'
            mensaje: |
              Ese es el módulo, $\sqrt2$, sin tomarle el logaritmo. La parte
              real del logaritmo es $\ln|w|$, no $|w|$.
          - valor: '0.78539816'
            mensaje: |
              Ese es $\frac{\pi}{4}$, el **argumento** de $1+i$. Va en la parte
              imaginaria del logaritmo, no en la real.
        pista: |
          $|1+i| = \sqrt{2}$, y $\ln\sqrt2 = \frac{1}{2}\ln 2 \approx 0{,}3466$.
        desarrollo: |
          $$
          |1+i| = \sqrt{1^{2}+1^{2}} = \sqrt2
          \;\Longrightarrow\;
          \ln|1+i| = \ln\sqrt2 = \frac{1}{2}\ln 2 \approx 0{,}3466
          $$
        veredicto: |
          Y el argumento es $\frac{\pi}{4}$, porque $1+i$ está en la bisectriz
          del primer cuadrante.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que despeja $z$. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              Tomando logaritmos:
              $iz = \ln(1+i) = \ln\sqrt2 + i\left(\frac{\pi}{4} + 2\pi k\right)$,
              con $k \in \mathbb{Z}$.
          - texto: |
              Se despeja dividiendo entre $i$, o lo que es lo mismo,
              multiplicando por $-i$.
          - texto: |
              $z = -i\ln\sqrt2 + \left(\frac{\pi}{4} + 2\pi k\right)$, donde el
              segundo sumando ha quedado **real**.
          - texto: |
              Es decir, $z = \left(\frac{\pi}{4} + 2\pi k\right) - \frac{i}{2}\ln 2$:
              parte real variable y parte imaginaria fija.
          - texto: |
              Como la exponencial es inyectiva, la solución es única y se toma
              $k=0$.
            trampa: true
            mensaje: |
              La exponencial **compleja no es inyectiva**: es periódica de
              periodo $2\pi i$, y por eso $e^{iz}$ repite valores cada $2\pi$ en
              la parte real de $z$. Justamente esa no inyectividad es la que
              produce las infinitas soluciones. Quedarse con $k=0$ deja el
              ejercicio a medias, y el enunciado pide representar los afijos
              —en plural.
        veredicto: |
          Todas las soluciones tienen la **misma** parte imaginaria y partes
          reales separadas $2\pi$.

      - tipo: calcular
        titulo: La solución principal
        pregunta: ¿Qué solución corresponde a $k = 0$?
        respuesta:
          tipo: complejo
          valor: '0.78539816-0.34657359i'
          tolerancia: 0.01
          formato: forma binómica, tipo a+bi
        distractores:
          - valor: '0.78539816+0.34657359i'
            mensaje: |
              Signo cambiado en la parte imaginaria. Al dividir entre $i$, la
              parte real del logaritmo pasa a la parte imaginaria **con signo
              menos**: $\frac{\ln\sqrt2}{i} = -i\ln\sqrt2$.
          - valor: '0.34657359+0.78539816i'
            mensaje: |
              Has intercambiado las dos partes. La parte real de $z$ sale del
              **argumento** de $1+i$, y la imaginaria de su **módulo**: la
              división entre $i$ las cruza.
          - valor: '0.78539816'
            mensaje: |
              Te has quedado solo con la parte real. El módulo de $1+i$ no es 1,
              así que el logaritmo tiene parte real no nula y $z$ tiene parte
              imaginaria.
        pista: |
          $z = \left(\frac{\pi}{4}+2\pi k\right) - \frac{i}{2}\ln 2$. Con $k=0$,
          $\frac{\pi}{4} \approx 0{,}7854$ y $\frac{\ln 2}{2} \approx 0{,}3466$.
        desarrollo: |
          $$
          iz = \ln\sqrt2 + i\left(\frac{\pi}{4}+2\pi k\right)
          $$

          Multiplicando por $-i$, y usando $-i \cdot i = 1$:

          $$
          z = -i\ln\sqrt2 + \frac{\pi}{4} + 2\pi k
            = \left(\frac{\pi}{4}+2\pi k\right) - \frac{i}{2}\ln 2
          $$

          Con $k=0$:

          $$
          z = \frac{\pi}{4} - \frac{i}{2}\ln 2 \approx 0{,}7854 - 0{,}3466\,i
          $$
        veredicto: |
          Los afijos están todos a la misma altura, $-\frac{\ln 2}{2}$, y
          separados $2\pi$ en horizontal.

    resolucion: |
      **Datos.** Se pide resolver $e^{iz} = 1+i$ con $z \in \mathbb{C}$, y
      representar los afijos de las soluciones.

      ### 1 · Por qué hay infinitas soluciones

      La exponencial compleja es **periódica de periodo $2\pi i$**:
      $e^{w+2\pi i} = e^{w}$. No es inyectiva, así que una ecuación
      $e^{w} = c$ con $c \neq 0$ tiene infinitas soluciones. Eso es lo que
      recoge el $2\pi k$ del logaritmo complejo:

      $$
      \ln w = \ln|w| + i\left(\arg w + 2\pi k\right), \qquad k \in \mathbb{Z}
      $$

      Aquí $c = 1+i \neq 0$, así que la ecuación tiene solución.

      ### 2 · Tomar logaritmos

      $$
      iz = \ln(1+i) = \ln|1+i| + i\left(\arg(1+i) + 2\pi k\right)
      $$

      Con $|1+i| = \sqrt2$ y $\arg(1+i) = \frac{\pi}{4}$ —bisectriz del primer
      cuadrante—:

      $$
      iz = \ln\sqrt2 + i\left(\frac{\pi}{4} + 2\pi k\right)
      $$

      ### 3 · Despejar

      Se multiplica por $-i$, que es lo mismo que dividir entre $i$:

      $$
      z = -i\ln\sqrt2 + \left(\frac{\pi}{4} + 2\pi k\right)
      $$

      y como $\ln\sqrt2 = \frac{1}{2}\ln 2$:

      $$
      z = \left(\frac{\pi}{4} + 2\pi k\right) - \frac{i}{2}\ln 2,
      \qquad k \in \mathbb{Z}
      $$

      Merece la pena fijarse en lo que ha hecho la división entre $i$: ha
      **cruzado** las dos partes. El módulo de $1+i$ ha acabado en la parte
      imaginaria de $z$, y su argumento en la parte real.

      ### 4 · Representación gráfica

      Todos los afijos tienen la **misma parte imaginaria**,
      $-\frac{\ln 2}{2} \approx -0{,}347$, y partes reales
      $\frac{\pi}{4} + 2\pi k$. Son, por tanto, puntos equiespaciados sobre una
      **recta horizontal** ligeramente por debajo del eje real, separados
      $2\pi \approx 6{,}28$ entre sí.

      ### 5 · Comprobación

      Con $k=0$, $z = \frac{\pi}{4} - \frac{i}{2}\ln 2$. Entonces

      $$
      iz = \frac{i\pi}{4} + \frac{\ln 2}{2}
      \;\Longrightarrow\;
      e^{iz} = e^{\ln\sqrt2}\,e^{i\pi/4} = \sqrt2\left(\cos\frac{\pi}{4} + i\,\mathrm{sen}\,\frac{\pi}{4}\right) = 1+i
      $$

      ### Resultado

      $$
      \boxed{\;z = \left(\frac{\pi}{4} + 2\pi k\right) - \frac{i}{2}\ln 2,
      \qquad k \in \mathbb{Z}\;}
      $$

  - id: coseno-igual-a-cinco
    titulo: Cuando el coseno vale cinco
    fuente: >-
      Ejercicio 1.15 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU
      (2016/2017 7E)

    enunciado: |
      $$
      \cos z = 5, \qquad z \in \mathbb{C}
      $$
    pide: Resolver la ecuación.

    pasos:
      - tipo: reconocer
        pregunta: |
          En los reales esta ecuación no tiene solución. ¿Qué se hace en
          $\mathbb{C}$?
        opciones:
          - texto: >-
              Escribir el coseno con exponenciales y hacer el cambio
              $u = e^{iz}$
            correcta: true
            mensaje: |
              Eso es. Con $\cos z = \frac{e^{iz}+e^{-iz}}{2}$, el cambio
              $u = e^{iz}$ convierte la ecuación en una de segundo grado en $u$:
              $u^{2} - 10u + 1 = 0$.
          - texto: Concluir que no tiene solución, porque el coseno está entre $-1$ y $1$
            mensaje: |
              Esa cota vale solo para argumentos **reales**. El coseno complejo
              no está acotado: toma cualquier valor, incluido el 5. Es justo lo
              que este ejercicio quiere que descubras.
          - texto: Aplicar $z = \arccos 5$ y dejarlo indicado
            mensaje: |
              Eso no resuelve nada: solo cambia el nombre del problema. Y además
              el arcocoseno complejo también es multivaluado, así que la
              respuesta seguiría estando incompleta.
          - texto: Separar $z = a+bi$ y resolver el sistema real que sale
            mensaje: |
              Es viable —salen $\cos a\cosh b = 5$ y
              $\mathrm{sen}\,a\,\mathrm{senh}\,b = 0$— pero obliga a discutir
              casos. El cambio a exponenciales llega antes y sin ramificaciones.

      - tipo: calcular
        titulo: La ecuación auxiliar
        pregunta: |
          Con $u = e^{iz}$ la ecuación es $u^{2} - 10u + 1 = 0$. ¿Cuáles son las
          dos raíces? Escríbelas separadas por comas.
        respuesta:
          tipo: conjunto
          valor: '9.89897949, 0.10102051'
          tolerancia: 0.01
          formato: los dos valores, separados por comas
        distractores:
          - valor: '9.89897949'
            mensaje: |
              Es una de las dos, y la otra es igual de válida: da la segunda
              familia de soluciones. Su producto tiene que valer 1, así que la
              que falta es su inversa.
          - valor: '5, -5'
            mensaje: |
              Esas no cumplen la ecuación: $5^{2} - 50 + 1 \neq 0$. Has
              confundido el valor del coseno con las raíces de la auxiliar.
          - valor: '10, 1'
            mensaje: |
              Esos son los coeficientes de la ecuación, no sus raíces. Aplica la
              fórmula: $u = \frac{10 \pm \sqrt{100-4}}{2}$.
        pista: |
          $u = \frac{10 \pm \sqrt{96}}{2} = 5 \pm 2\sqrt6$, y
          $2\sqrt6 \approx 4{,}899$.
        desarrollo: |
          $$
          \cos z = \frac{e^{iz}+e^{-iz}}{2} = 5
          \;\Longrightarrow\;
          u + \frac{1}{u} = 10
          \;\Longrightarrow\;
          u^{2} - 10u + 1 = 0
          $$

          $$
          u = \frac{10 \pm \sqrt{100-4}}{2} = \frac{10 \pm \sqrt{96}}{2}
            = 5 \pm 2\sqrt6
          $$

          Numéricamente, $5+2\sqrt6 \approx 9{,}899$ y
          $5-2\sqrt6 \approx 0{,}101$.
        veredicto: |
          Las dos son **reales y positivas**, y su producto vale 1: una es la
          inversa de la otra. Eso hará que las dos familias de soluciones sean
          simétricas respecto del eje real.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que despeja $z$ a partir de $u$. Una de las
          piezas no debe entrar.
        piezas:
          - texto: |
              Deshacer el cambio es resolver $e^{iz} = u$ para cada uno de los
              dos valores de $u$.
          - texto: |
              Tomando logaritmos:
              $iz = \ln u + 2\pi k\,i$, porque $u$ es real y positivo y su
              argumento es 0.
          - texto: |
              Multiplicando por $-i$: $z = -i\ln u + 2\pi k$.
          - texto: |
              Con $u = 5 \pm 2\sqrt6$ queda
              $z = -i\ln\left(5\pm2\sqrt6\right) + 2\pi k$.
          - texto: |
              Como $5 - 2\sqrt6$ es menor que 1, su logaritmo es negativo y hay
              que descartar esa familia.
            trampa: true
            mensaje: |
              Un logaritmo negativo no invalida nada: solo significa que esa
              familia de soluciones tiene la parte imaginaria con el signo
              contrario. De hecho $\ln(5-2\sqrt6) = -\ln(5+2\sqrt6)$, así que
              las dos familias son simétricas respecto del eje real. Descartar
              una deja fuera la mitad de las soluciones.
        veredicto: |
          Dos familias infinitas, simétricas respecto del eje real y
          equiespaciadas $2\pi$ en horizontal.

      - tipo: calcular
        titulo: La solución principal
        pregunta: |
          Tomando $u = 5+2\sqrt6$ y $k = 0$, ¿cuál es la solución?
        respuesta:
          tipo: complejo
          valor: '-2.29243167i'
          tolerancia: 0.01
          formato: forma binómica, tipo a+bi
        distractores:
          - valor: '2.29243167i'
            mensaje: |
              Signo cambiado. Al multiplicar por $-i$, un logaritmo **positivo**
              da parte imaginaria **negativa**. Ese valor sí es solución, pero
              es el de la otra familia, la de $u = 5-2\sqrt6$.
          - valor: '2.29243167'
            mensaje: |
              Te has dejado la $i$. $z = -i\ln u$: el resultado es imaginario
              puro, no real. Si fuera real, el coseno estaría entre $-1$ y 1 y
              no podría valer 5.
          - valor: '9.89897949'
            mensaje: |
              Ese es el valor de $u$, no de $z$. Falta deshacer el cambio:
              $z = -i\ln u$.
        pista: |
          $z = -i\ln\left(5+2\sqrt6\right)$, y
          $\ln 9{,}899 \approx 2{,}2924$.
        desarrollo: |
          $$
          z = -i\ln\left(5+2\sqrt6\right) + 2\pi k
          $$

          Con $k=0$ y $\ln\left(5+2\sqrt6\right) \approx \ln 9{,}899 \approx 2{,}2924$:

          $$
          z \approx -2{,}2924\,i
          $$
        veredicto: |
          Imaginario puro, como tenía que ser: sobre el eje real el coseno nunca
          pasa de 1, así que la solución tenía que salirse de él.

    resolucion: |
      **Datos.** Se pide resolver $\cos z = 5$ con $z \in \mathbb{C}$.

      ### 1 · Por qué esto tiene sentido

      En $\mathbb{R}$ la ecuación no tiene solución, porque $|\cos x| \le 1$.
      Esa cota, sin embargo, **no vale en $\mathbb{C}$**: el coseno complejo se
      define por

      $$
      \cos z = \frac{e^{iz} + e^{-iz}}{2}
      $$

      y esa expresión no está acotada. Conviene decirlo explícitamente, porque
      es la hipótesis que hace legítimo el ejercicio.

      ### 2 · El cambio de variable

      Con $u = e^{iz}$, que nunca vale cero, la ecuación se escribe

      $$
      \frac{u + u^{-1}}{2} = 5
      \;\Longrightarrow\;
      u + \frac{1}{u} = 10
      \;\Longrightarrow\;
      u^{2} - 10u + 1 = 0
      $$

      Multiplicar por $u$ es lícito precisamente porque $u = e^{iz} \neq 0$.

      ### 3 · Resolución de la auxiliar

      $$
      u = \frac{10 \pm \sqrt{100 - 4}}{2} = \frac{10 \pm 4\sqrt6}{2} = 5 \pm 2\sqrt6
      $$

      Las dos raíces son reales y positivas, y su producto es
      $(5+2\sqrt6)(5-2\sqrt6) = 25-24 = 1$: cada una es la inversa de la otra.

      ### 4 · Deshacer el cambio

      Para cada valor de $u$ hay que resolver $e^{iz} = u$. Como $u$ es real
      positivo, su argumento es 0 y su logaritmo es

      $$
      \ln u + 2\pi k\,i, \qquad k \in \mathbb{Z}
      $$

      Entonces $iz = \ln u + 2\pi k i$, y multiplicando por $-i$:

      $$
      z = -i\ln u + 2\pi k
      $$

      es decir

      $$
      z = -i\ln\left(5 \pm 2\sqrt6\right) + 2\pi k, \qquad k \in \mathbb{Z}
      $$

      ### 5 · Las dos familias son simétricas

      Como $5-2\sqrt6 = \dfrac{1}{5+2\sqrt6}$, se tiene

      $$
      \ln\left(5-2\sqrt6\right) = -\ln\left(5+2\sqrt6\right)
      $$

      así que las dos familias tienen la misma parte real y partes imaginarias
      opuestas: los afijos son puntos equiespaciados $2\pi$ sobre **dos rectas
      horizontales** simétricas respecto del eje real, a altura
      $\pm 2{,}2924$ aproximadamente.

      ### 6 · Comprobación

      Con $z = -i\ln\left(5+2\sqrt6\right)$: entonces
      $e^{iz} = e^{\ln(5+2\sqrt6)} = 5+2\sqrt6$ y
      $e^{-iz} = 5-2\sqrt6$. Su semisuma es

      $$
      \frac{\left(5+2\sqrt6\right)+\left(5-2\sqrt6\right)}{2} = \frac{10}{2} = 5
      $$

      ### Resultado

      $$
      \boxed{\;z = -i\ln\left(5 \pm 2\sqrt6\right) + 2\pi k,\qquad k \in \mathbb{Z}\;}
      $$

  - id: recinto-cuadrado
    titulo: Los dos vértices que faltan de un cuadrado
    fuente: >-
      Ejercicio 1.16 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU
      (2014/2015 6E)

    enunciado: |
      Se quiere cercar un recinto cuadrado en un terreno que contiene el afijo
      del número complejo $2+2i$. Dos vértices contiguos son $z_1 = 2i$ y
      $z_2 = 2+i$.
    pide: >-
      ¿Cuáles son los otros dos vértices? Representar gráficamente el recinto.

    pasos:
      - tipo: reconocer
        pregunta: |
          Tienes un lado del cuadrado y necesitas los otros dos vértices. ¿Qué
          herramienta lo resuelve en una línea?
        opciones:
          - texto: >-
              Multiplicar el vector del lado por $i$, que lo gira exactamente
              $90°$
            correcta: true
            mensaje: |
              Eso es. En un cuadrado los lados contiguos son perpendiculares y
              de la misma longitud, y multiplicar por $i$ hace justo eso: gira
              un cuarto de vuelta sin cambiar el módulo.
          - texto: Plantear un sistema con las distancias entre los cuatro vértices
            mensaje: |
              Funciona, pero son varias ecuaciones cuadráticas y hay que
              descartar soluciones a mano. El giro por $i$ da el resultado
              directamente.
          - texto: Calcular la pendiente del lado y la de la perpendicular
            mensaje: |
              Es el método de geometría analítica de bachillerato. Vale, pero
              obliga a tratar aparte el caso de pendiente infinita y a decidir
              después la longitud. Con complejos el giro y la longitud van
              juntos.
          - texto: Sumar $2+2i$ a los dos vértices conocidos
            mensaje: |
              El $2+2i$ del enunciado es un punto que el recinto debe
              **contener**, no un desplazamiento. Sirve para elegir hacia qué
              lado se gira, y solo para eso.

      - tipo: calcular
        titulo: El vector del lado
        pregunta: ¿Cuánto vale $z_2 - z_1$?
        respuesta:
          tipo: complejo
          valor: '2-i'
          tolerancia: 0.02
          formato: forma binómica, tipo a+bi
        distractores:
          - valor: '-2+i'
            mensaje: |
              Ese es $z_1 - z_2$, el mismo lado recorrido al revés. No es un
              error grave, pero cambia el sentido del giro y con él cuáles son
              los otros vértices.
          - valor: '2+3i'
            mensaje: |
              Has sumado en vez de restar. El vector que va de $z_1$ a $z_2$ es
              la **diferencia**.
          - valor: '2+i'
            mensaje: |
              Ese es $z_2$ a secas. El vector del lado es $z_2 - z_1$, y $z_1$
              tiene parte imaginaria 2.
        pista: |
          $z_2 - z_1 = (2+i) - 2i$. Solo hay que restar componente a componente.
        desarrollo: |
          $$
          z_2 - z_1 = (2+i) - (0+2i) = 2 - i
          $$
        veredicto: |
          El lado mide $|2-i| = \sqrt5$, así que el cuadrado tiene lado
          $\sqrt5$ y área 5.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que obtiene los otros dos vértices. Una de las
          piezas no debe entrar.
        piezas:
          - texto: |
              El vector del lado es $v = z_2 - z_1 = 2-i$.
          - texto: |
              El lado contiguo es perpendicular y de la misma longitud: se
              obtiene girando $v$ un cuarto de vuelta, es decir multiplicando
              por $i$ o por $-i$.
          - texto: |
              $i\,v = i(2-i) = 2i - i^{2} = 1 + 2i$.
          - texto: |
              Los otros dos vértices son $z_1 + iv$ y $z_2 + iv$, es decir
              $1+4i$ y $3+3i$.
          - texto: |
              De los dos giros posibles se elige el de $+i$ porque siempre se
              gira en sentido antihorario.
            trampa: true
            mensaje: |
              No hay ninguna regla que obligue a girar en un sentido: los dos
              cuadrados existen. Lo que decide es **el dato del enunciado**: el
              recinto tiene que contener el afijo de $2+2i$, y solo uno de los
              dos lo contiene. Girando con $-i$ saldrían los vértices $-1$ y
              $1-i$, y ese cuadrado deja el punto fuera.
        veredicto: |
          El dato de que el recinto «contiene el afijo de $2+2i$» no era
          decorativo: es lo que elige entre las dos soluciones geométricas.

      - tipo: calcular
        titulo: Los dos vértices que faltan
        pregunta: |
          Escribe los otros dos vértices, separados por comas.
        respuesta:
          tipo: conjunto
          valor: '1+4i, 3+3i'
          tolerancia: 0.02
          formato: los dos, separados por comas
        distractores:
          - valor: '-1, 1-i'
            mensaje: |
              Ese es el cuadrado que sale girando con $-i$, hacia el otro lado.
              Es un cuadrado válido, pero **no contiene** el afijo de $2+2i$, y
              el enunciado lo exige.
          - valor: '1+4i'
            mensaje: |
              Es uno de los dos y está bien. El otro sale sumando el mismo
              vector girado al **segundo** vértice conocido: $z_2 + iv$.
          - valor: '2i, 2+i, 1+4i, 3+3i'
            mensaje: |
              Ahí están los cuatro vértices del cuadrado, pero la pregunta pide
              solo los **dos que faltan**: $z_1$ y $z_2$ ya los daba el
              enunciado.
        pista: |
          $iv = 1+2i$. Súmalo a cada uno de los dos vértices conocidos.
        desarrollo: |
          $$
          iv = i(2-i) = 2i + 1 = 1 + 2i
          $$

          $$
          z_3 = z_1 + iv = 2i + 1 + 2i = 1 + 4i
          $$

          $$
          z_4 = z_2 + iv = (2+i) + (1+2i) = 3 + 3i
          $$
        veredicto: |
          Comprobación rápida: $z_3 - z_4 = -2+i$, que es $-(z_2-z_1)$. Los
          lados opuestos son paralelos e iguales, como debe ser.

    resolucion: |
      **Datos.** Cuadrado con dos vértices contiguos $z_1 = 2i$ y $z_2 = 2+i$,
      que contiene el afijo de $2+2i$. Se piden los otros dos vértices.

      ### 1 · La herramienta

      En un cuadrado, dos lados contiguos son **perpendiculares y de la misma
      longitud**. En el plano complejo eso es exactamente multiplicar por $i$:

      $$
      i\,z = e^{i\pi/2}\,z
      $$

      gira $z$ un cuarto de vuelta y no toca su módulo. Es la propiedad que la
      teoría del tema resume como «multiplicar es girar y escalar», con el caso
      particular de que $i$ solo gira.

      ### 2 · El vector del lado conocido

      $$
      v = z_2 - z_1 = (2+i) - 2i = 2 - i
      $$

      con $|v| = \sqrt{4+1} = \sqrt5$: ese es el lado del cuadrado.

      ### 3 · El giro

      $$
      i\,v = i(2-i) = 2i - i^{2} = 1 + 2i
      $$

      Los otros dos vértices se obtienen desplazando los conocidos por ese
      vector:

      $$
      z_3 = z_1 + iv = 2i + (1+2i) = 1 + 4i
      $$

      $$
      z_4 = z_2 + iv = (2+i) + (1+2i) = 3 + 3i
      $$

      ### 4 · Por qué este giro y no el otro

      Multiplicar por $-i$ también da un cuadrado, con vértices $-1$ y $1-i$.
      Los dos son geométricamente correctos, y el enunciado desempata con un
      dato que parecía de adorno: el recinto **contiene el afijo de $2+2i$**.

      El cuadrado $\{2i,\,2+i,\,3+3i,\,1+4i\}$ tiene su centro en

      $$
      \frac{z_1+z_4}{2} = \frac{2i + 3+3i}{2} = \frac{3}{2} + \frac{5}{2}i
      $$

      y el punto $(2,2)$ queda dentro. El otro cuadrado está en el tercer y
      cuarto cuadrante, y lo deja fuera.

      ### 5 · Representación gráfica

      Los cuatro afijos, en orden: $(0,2) \to (2,1) \to (3,3) \to (1,4)$ y de
      vuelta al primero. Es un cuadrado de lado $\sqrt5$ girado respecto de los
      ejes, con el punto $(2,2)$ en su interior.

      ### 6 · Comprobación

      Los cuatro lados miden lo mismo:
      $|z_2-z_1| = |2-i| = \sqrt5$ y $|z_3-z_2| = |1+2i| = \sqrt5$. Y son
      perpendiculares, porque uno es el otro multiplicado por $i$.

      ### Resultado

      $$
      \boxed{\;z_3 = 1+4i, \qquad z_4 = 3+3i\;}
      $$

  - id: triangulo-rectangulo-isosceles
    titulo: El vértice de un triángulo rectángulo isósceles
    fuente: >-
      Ejercicio 1.17 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU
      (2016/2017 1E)

    enunciado: |
      Los afijos de $z_1 = \dfrac{\sqrt{3}}{2} - \dfrac{i}{2}$, $z_2 = i$ y
      $z_3$ forman un triángulo rectángulo isósceles, y los vértices de la
      hipotenusa son los afijos de $z_1$ y $z_2$.
    pide: >-
      Hallar $z_3$, el de mayor componente imaginaria.

    pasos:
      - tipo: reconocer
        pregunta: |
          Sabes que $z_1$ y $z_2$ son los extremos de la hipotenusa. ¿Dónde está
          $z_3$?
        opciones:
          - texto: >-
              En la mediatriz de la hipotenusa, a media hipotenusa de distancia
              del punto medio
            correcta: true
            mensaje: |
              Eso es. Al ser isósceles, $z_3$ equidista de $z_1$ y $z_2$: está en
              la mediatriz. Y al ser rectángulo en $z_3$, está en la
              circunferencia de diámetro la hipotenusa, cuyo radio es la mitad.
              Las dos condiciones juntas dan exactamente dos puntos.
          - texto: En el punto medio de la hipotenusa
            mensaje: |
              El punto medio es el **centro** de esa circunferencia, no un
              vértice. Si $z_3$ estuviera ahí, los tres puntos serían colineales
              y no habría triángulo.
          - texto: A la misma distancia de $z_1$ y de $z_2$ que la que hay entre ellos
            mensaje: |
              Eso daría un triángulo **equilátero**, no rectángulo isósceles. En
              el nuestro los dos catetos son iguales entre sí, pero más cortos
              que la hipotenusa: la miden dividida por $\sqrt2$.
          - texto: En cualquier punto, porque el enunciado no lo fija
            mensaje: |
              Sí lo fija: rectángulo **e** isósceles solo deja dos posiciones, y
              el enunciado desempata pidiendo la de mayor componente imaginaria.

      - tipo: calcular
        titulo: El punto medio de la hipotenusa
        pregunta: ¿Cuál es el punto medio del segmento que une $z_1$ y $z_2$?
        respuesta:
          tipo: complejo
          valor: '0.4330127+0.25i'
          tolerancia: 0.02
          formato: forma binómica, tipo a+bi
        distractores:
          - valor: '0.8660254+0.5i'
            mensaje: |
              Esa es la suma $z_1+z_2$ sin dividir entre 2. El punto medio es la
              **semisuma**.
          - valor: '0.8660254-1.5i'
            mensaje: |
              Has restado en vez de sumar. La resta da el vector de la
              hipotenusa, que hace falta después, pero no es el punto medio.
          - valor: '0.4330127-0.25i'
            mensaje: |
              Signo cambiado en la parte imaginaria. $z_1$ aporta $-\frac12$ y
              $z_2$ aporta $+1$: la suma es $+\frac12$, y la mitad, $+\frac14$.
        pista: |
          $m = \dfrac{z_1+z_2}{2}$, con $z_1 = \frac{\sqrt3}{2}-\frac{i}{2}$ y
          $z_2 = i$.
        desarrollo: |
          $$
          z_1 + z_2 = \frac{\sqrt3}{2} - \frac{i}{2} + i = \frac{\sqrt3}{2} + \frac{i}{2}
          $$

          $$
          m = \frac{z_1+z_2}{2} = \frac{\sqrt3}{4} + \frac{i}{4}
            \approx 0{,}433 + 0{,}25\,i
          $$
        veredicto: |
          Ese es el centro de la circunferencia que pasa por los tres vértices,
          porque en un triángulo rectángulo la hipotenusa es un diámetro.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que construye $z_3$. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              Sea $m$ el punto medio de la hipotenusa y $h = z_2 - z_1$ el
              vector que la recorre.
          - texto: |
              Por ser isósceles, $z_3$ está en la mediatriz de la hipotenusa,
              que pasa por $m$ y es perpendicular a $h$.
          - texto: |
              Por ser rectángulo en $z_3$, la distancia de $z_3$ a $m$ es el
              radio de la circunferencia de diámetro la hipotenusa, es decir
              $\frac{|h|}{2}$.
          - texto: |
              Girar $\frac{h}{2}$ un cuarto de vuelta da un vector perpendicular
              y de la longitud justa: $z_3 = m \pm \dfrac{i\,h}{2}$.
          - texto: |
              Como el triángulo es rectángulo, $z_3$ tiene que estar sobre uno
              de los dos ejes coordenados.
            trampa: true
            mensaje: |
              «Rectángulo» se refiere al ángulo entre los **catetos**, no a los
              ejes del plano. El triángulo puede estar girado de cualquier
              manera; de hecho aquí ninguno de sus lados es paralelo a un eje.
        veredicto: |
          El signo $\pm$ da los dos vértices posibles, uno a cada lado de la
          hipotenusa. El enunciado se queda con el de mayor parte imaginaria.

      - tipo: calcular
        titulo: El vértice pedido
        pregunta: |
          Calcula $z_3$, el de mayor componente imaginaria.
        respuesta:
          tipo: complejo
          valor: '1.18301270+0.68301270i'
          tolerancia: 0.02
          formato: forma binómica, tipo a+bi
        distractores:
          - valor: '-0.31698730-0.18301270i'
            mensaje: |
              Ese es el **otro** vértice posible, el que sale con el signo
              contrario. Es una solución geométrica válida, pero el enunciado
              pide el de mayor componente imaginaria.
          - valor: '0.4330127+0.25i'
            mensaje: |
              Ese es el punto medio de la hipotenusa, no el vértice. Falta
              desplazarse desde él en dirección perpendicular.
          - valor: '2.36602540+1.36602540i'
            mensaje: |
              Has usado $ih$ entero en vez de $\frac{ih}{2}$. La distancia del
              vértice al punto medio es la **mitad** de la hipotenusa, que es el
              radio de la circunferencia.
        pista: |
          $z_3 = m - \dfrac{i\,h}{2}$ con $h = z_2 - z_1$. Prueba los dos signos
          y quédate con el de parte imaginaria mayor.
        desarrollo: |
          $$
          h = z_2 - z_1 = i - \frac{\sqrt3}{2} + \frac{i}{2}
            = -\frac{\sqrt3}{2} + \frac{3}{2}i
          $$

          $$
          \frac{i\,h}{2} = \frac{i}{2}\left(-\frac{\sqrt3}{2} + \frac{3}{2}i\right)
            = -\frac{3}{4} - \frac{\sqrt3}{4}i
          $$

          Con el signo menos —el que sube el vértice—:

          $$
          z_3 = m - \frac{ih}{2}
              = \left(\frac{\sqrt3}{4} + \frac{3}{4}\right)
              + i\left(\frac{1}{4} + \frac{\sqrt3}{4}\right)
              = \frac{3+\sqrt3}{4} + i\,\frac{1+\sqrt3}{4}
          $$

          Numéricamente, $z_3 \approx 1{,}183 + 0{,}683\,i$.
        veredicto: |
          Coincide con la solución del boletín,
          $z_3 = \frac{3+\sqrt3}{4} + i\frac{1+\sqrt3}{4}$.

    resolucion: |
      **Datos.** $z_1 = \frac{\sqrt3}{2} - \frac{i}{2}$ y $z_2 = i$ son los
      extremos de la hipotenusa de un triángulo rectángulo isósceles. Se pide el
      tercer vértice, el de mayor componente imaginaria.

      ### 1 · Qué obligan las dos condiciones

      **Isósceles:** los dos catetos miden lo mismo, así que $z_3$ equidista de
      $z_1$ y $z_2$: está en la **mediatriz** de la hipotenusa.

      **Rectángulo en $z_3$:** por el teorema del ángulo inscrito, $z_3$ está en
      la circunferencia que tiene la hipotenusa como **diámetro**. Su centro es
      el punto medio $m$ y su radio, $\frac{|h|}{2}$ con $h = z_2-z_1$.

      Las dos condiciones juntas dejan exactamente **dos** puntos, simétricos
      respecto de la hipotenusa.

      ### 2 · Punto medio y vector de la hipotenusa

      $$
      m = \frac{z_1+z_2}{2} = \frac{\frac{\sqrt3}{2} + \frac{i}{2}}{2}
        = \frac{\sqrt3}{4} + \frac{i}{4}
      $$

      $$
      h = z_2 - z_1 = -\frac{\sqrt3}{2} + \frac{3}{2}i
      $$

      ### 3 · El giro

      Un vector perpendicular a $h$ y de la mitad de su longitud es
      $\frac{ih}{2}$, porque multiplicar por $i$ gira $90°$ sin cambiar el
      módulo:

      $$
      \frac{i\,h}{2} = \frac{i}{2}\left(-\frac{\sqrt3}{2}+\frac{3}{2}i\right)
        = -\frac{3}{4} - \frac{\sqrt3}{4}i
      $$

      Y los dos vértices posibles son

      $$
      z_3 = m \pm \frac{i\,h}{2}
      $$

      ### 4 · Elegir el que pide el enunciado

      Con el signo $+$: $z_3 = \frac{\sqrt3-3}{4} + i\frac{1-\sqrt3}{4}
      \approx -0{,}317 - 0{,}183\,i$.

      Con el signo $-$: $z_3 = \frac{3+\sqrt3}{4} + i\frac{1+\sqrt3}{4}
      \approx 1{,}183 + 0{,}683\,i$.

      El de mayor componente imaginaria es el segundo.

      ### 5 · Comprobación

      Los dos catetos han de medir lo mismo:

      $$
      |z_3 - z_1| = |z_3 - z_2| = \frac{|h|}{\sqrt2}
      $$

      Con $|h| = \sqrt{\frac34 + \frac94} = \sqrt3$, cada cateto mide
      $\sqrt{3/2} \approx 1{,}22$, y la hipotenusa $\sqrt3 \approx 1{,}73$. Se
      cumple el teorema de Pitágoras: $2\cdot\frac32 = 3 = |h|^2$.

      ### Resultado

      $$
      \boxed{\;z_3 = \frac{3+\sqrt3}{4} + i\,\frac{1+\sqrt3}{4}\;}
      $$

  - id: rombo-diagonales
    titulo: Un rombo del que solo se conocen dos vértices
    fuente: >-
      Ejercicio 1.18 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU
      (2012/2013 7E)

    enunciado: |
      Los vértices opuestos de un rombo son los afijos de $z_1 = 2-i$ y
      $z_2 = 6+2i$. La longitud de la otra diagonal es el doble de la que forman
      dichos vértices.
    pide: Hallar los otros vértices y el área del rombo.

    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué propiedad del rombo permite colocar los dos vértices que faltan?
        opciones:
          - texto: >-
              Que sus diagonales se cortan en el punto medio y son
              perpendiculares
            correcta: true
            mensaje: |
              Eso es. Las dos propiedades juntas fijan por completo la segunda
              diagonal: sabes por dónde pasa —el centro— y en qué dirección
              —perpendicular—; el enunciado te da la longitud.
          - texto: Que sus cuatro lados son iguales, lo que da un sistema de ecuaciones
            mensaje: |
              Es cierto y se puede resolver así, pero son ecuaciones cuadráticas
              con dos incógnitas complejas. Las diagonales lo resuelven en dos
              líneas.
          - texto: Que sus ángulos opuestos son iguales
            mensaje: |
              También es cierto, pero no sirve para situar los vértices: no dice
              **dónde** están, solo cómo se reparten los ángulos.
          - texto: Que las diagonales de un rombo son iguales
            mensaje: |
              Eso es el **cuadrado**, no el rombo. Aquí precisamente el enunciado
              dice que una diagonal es el doble que la otra.

      - tipo: calcular
        titulo: El centro del rombo
        pregunta: ¿Dónde se cortan las dos diagonales?
        respuesta:
          tipo: complejo
          valor: '4+0.5i'
          tolerancia: 0.02
          formato: forma binómica, tipo a+bi
        distractores:
          - valor: '8+i'
            mensaje: |
              Esa es la suma $z_1+z_2$, sin dividir entre 2. El punto de corte
              es el punto medio, o sea la semisuma.
          - valor: '4+1.5i'
            mensaje: |
              Error en la parte imaginaria: $-1$ y $+2$ suman $+1$, y la mitad
              es $+0{,}5$.
          - valor: '2+1.5i'
            mensaje: |
              Esa es la semidiferencia, que da el vector desde el centro a un
              vértice. Es útil en el paso siguiente, pero no es el centro.
        pista: |
          Las diagonales de un rombo se cortan en su punto medio:
          $c = \frac{z_1+z_2}{2}$.
        desarrollo: |
          $$
          c = \frac{z_1+z_2}{2} = \frac{(2-i)+(6+2i)}{2} = \frac{8+i}{2}
            = 4 + \frac{1}{2}i
          $$
        veredicto: |
          Ese punto es el centro de simetría del rombo: los cuatro vértices se
          emparejan a través de él.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que sitúa los otros dos vértices. Una de las
          piezas no debe entrar.
        piezas:
          - texto: |
              La primera diagonal es $d = z_2 - z_1 = 4+3i$, de longitud
              $|d| = 5$.
          - texto: |
              El enunciado dice que la otra diagonal mide el doble: $10$. Desde
              el centro, cada mitad mide $5$.
          - texto: |
              La segunda diagonal es perpendicular a la primera, así que su
              dirección se obtiene girando $d$ un cuarto de vuelta: $i\,d$.
          - texto: |
              Como $|d| = 5$, el vector $\frac{i\,d}{|d|}\cdot 5 = i\,d$ tiene
              exactamente la longitud de media diagonal, y los vértices son
              $c \pm i\,d$... con cuidado de normalizar antes.
          - texto: |
              Como la segunda diagonal es el doble, los vértices son
              $c \pm 2d$.
            trampa: true
            mensaje: |
              El factor 2 se aplica a la **longitud** de la diagonal, no al
              vector $d$ tal cual — y sobre todo, $2d$ apunta en la **misma**
              dirección que la primera diagonal, no en la perpendicular. Con esa
              fórmula los cuatro vértices quedarían alineados y no habría rombo.
        veredicto: |
          La clave es girar primero y ajustar la longitud después: dirección y
          módulo son dos decisiones distintas.

      - tipo: calcular
        titulo: Los dos vértices que faltan
        pregunta: Escribe los otros dos vértices, separados por comas.
        respuesta:
          tipo: conjunto
          valor: '1+4.5i, 7-3.5i'
          tolerancia: 0.02
          formato: los dos, separados por comas
        distractores:
          - valor: '2.5+4.5i, 5.5-3.5i'
            mensaje: |
              La parte imaginaria está bien, así que el giro lo has hecho bien;
              falla la parte real. Repasa el producto $i(4+3i) = -3+4i$: la
              componente real del giro es $-3$, no $-1{,}5$.
          - valor: '12+7i, -4-6i'
            mensaje: |
              Has usado $c \pm 2d$, que apunta en la dirección de la **primera**
              diagonal. Los cuatro puntos te quedan alineados y no forman
              rombo: hay que girar $90°$ antes.
          - valor: '1+4.5i'
            mensaje: |
              Es uno de los dos. El otro está al otro lado del centro, con el
              signo contrario: $c$ menos el mismo vector.
        pista: |
          $i\,d = i(4+3i) = -3+4i$, que ya mide 5, justo media diagonal. Los
          vértices son $c \pm id$.
        desarrollo: |
          $$
          d = z_2 - z_1 = 4+3i, \qquad |d| = \sqrt{16+9} = 5
          $$

          La segunda diagonal mide $2\cdot 5 = 10$, así que desde el centro hay
          que avanzar $5$ en dirección perpendicular. Y resulta que

          $$
          i\,d = i(4+3i) = 4i - 3 = -3 + 4i, \qquad |i\,d| = 5
          $$

          ya tiene exactamente esa longitud. Por tanto

          $$
          z_3 = c + i\,d = \left(4+\tfrac12 i\right) + (-3+4i) = 1 + \tfrac{9}{2}i
          $$

          $$
          z_4 = c - i\,d = \left(4+\tfrac12 i\right) - (-3+4i) = 7 - \tfrac{7}{2}i
          $$
        veredicto: |
          Que $|id|$ salga justo 5 no es casualidad del ejercicio: girar no
          cambia el módulo, y media diagonal grande mide lo mismo que la
          diagonal pequeña entera.

      - tipo: calcular
        titulo: El área
        pregunta: ¿Cuánto vale el área del rombo?
        respuesta:
          tipo: numero
          valor: '25'
          tolerancia: 0.1
          formato: un número
        distractores:
          - valor: '50'
            mensaje: |
              Te has dejado el 2 del denominador. El área de un rombo es el
              **semiproducto** de sus diagonales:
              $\frac{D \cdot d}{2}$.
          - valor: '5'
            mensaje: |
              Esa es la longitud de la diagonal menor, no el área.
          - valor: '100'
            mensaje: |
              Has multiplicado las dos diagonales dos veces, o has usado
              $10\times 10$. Las diagonales miden 5 y 10.
        pista: |
          Área del rombo $= \dfrac{D\cdot d}{2}$, con $D = 10$ y $d = 5$.
        desarrollo: |
          $$
          \text{Área} = \frac{D \cdot d}{2} = \frac{10 \cdot 5}{2} = 25
          $$
        veredicto: |
          Se puede comprobar con el lado: cada lado mide
          $\sqrt{2{,}5^{2}+5^{2}} = \sqrt{31{,}25} \approx 5{,}59$, y el área
          también sale 25 por otras vías.

    resolucion: |
      **Datos.** Rombo con vértices opuestos $z_1 = 2-i$ y $z_2 = 6+2i$; la otra
      diagonal mide el doble. Se piden los otros dos vértices y el área.

      ### 1 · Las dos propiedades que lo resuelven

      En un rombo las diagonales **se cortan en su punto medio** y son
      **perpendiculares** entre sí. Con eso, la segunda diagonal queda
      determinada salvo su longitud, y la longitud la da el enunciado.

      ### 2 · Centro y primera diagonal

      $$
      c = \frac{z_1+z_2}{2} = \frac{8+i}{2} = 4 + \frac{1}{2}i
      $$

      $$
      d = z_2 - z_1 = 4+3i, \qquad |d| = \sqrt{16+9} = 5
      $$

      ### 3 · La segunda diagonal

      Mide $2 \cdot 5 = 10$, así que desde el centro hay que avanzar $5$ en
      dirección perpendicular a $d$, hacia los dos lados.

      Girar $d$ un cuarto de vuelta es multiplicar por $i$:

      $$
      i\,d = i(4+3i) = -3+4i
      $$

      y como girar no cambia el módulo, $|id| = 5$: **justo** la mitad de la
      diagonal grande. No hace falta reescalar nada.

      $$
      z_3 = c + i\,d = 1 + \frac{9}{2}i, \qquad
      z_4 = c - i\,d = 7 - \frac{7}{2}i
      $$

      ### 4 · El área

      $$
      \text{Área} = \frac{D\cdot d}{2} = \frac{10\cdot 5}{2} = 25
      $$

      ### 5 · Comprobación

      Los cuatro lados tienen que medir lo mismo:

      $$
      |z_3 - z_1| = \left|(1+\tfrac92 i) - (2-i)\right| = |-1 + \tfrac{11}{2}i|
        = \sqrt{1 + 30{,}25} \approx 5{,}59
      $$

      $$
      |z_3 - z_2| = \left|(1+\tfrac92 i) - (6+2i)\right| = |-5 + \tfrac52 i|
        = \sqrt{25 + 6{,}25} \approx 5{,}59
      $$

      Coinciden, así que la figura es efectivamente un rombo.

      ### Resultado

      $$
      \boxed{\;z_3 = 1 + \tfrac{9}{2}i, \qquad z_4 = 7 - \tfrac{7}{2}i,
      \qquad \text{Área} = 25\;}
      $$
