            <text class="f-raices-focos-l" x="28" y="22" text-anchor="start" fill="var(--live)">2c = 5 &lt; 6</text>
          </svg>
        consigna: |
          Dibuja las dos raíces y, sobre ellas, la elipse que generan. Marca el
          centro, los cuatro vértices y los focos.
        comprueba:
          - punto: |
              Las dos raíces $4i$ y $-i$ sobre el **eje imaginario**.
            porque: |
              Son imaginarias puras, y por eso la elipse tiene el eje mayor
              vertical. Si te salen con parte real, el discriminante está mal:
              $\left(-3i\right)^{2}=-9$, no $9$.
          - punto: |
              El centro en $\tfrac{3i}{2}$, punto medio de las dos raíces.
            porque: |
              La elipse **no** está centrada en el origen. Es el desplazamiento
              que más se olvida cuando los focos no son simétricos.
          - punto: |
              Los vértices del eje mayor en $\left(0;\,4{,}5\right)$ y
              $\left(0;\,-1{,}5\right)$, y los del menor en
              $\left(\pm1{,}66;\,1{,}5\right)$.
            porque: |
              Con $a=3$ y $b=\tfrac{\sqrt{11}}{2}$ la elipse sale muy alargada, y
              los cuatro vértices son lo único que lo hace visible.
          - punto: |
              Que los focos quedan **dentro** de la elipse, sobre el eje mayor.
            porque: |
              Siempre es así. Si en tu dibujo alguno cae fuera, los semiejes
              están intercambiados.
        veredicto: |
          La comprobación de existencia: la distancia entre focos es $5$ y la
          suma pedida $6$. Como $6>5$, la elipse existe — pero por poco, y de ahí
          que salga tan estirada.

    resolucion: |
      **Resultados.** $z_1=4i$, $z_2=-i$, y el lugar es la elipse

      $$
      \frac{x^{2}}{\tfrac{11}{4}}
      + \frac{\left(y-\tfrac32\right)^{2}}{9} = 1
      $$

      ### 1 · Las raíces

      $$
      z = \frac{3i\pm\sqrt{\left(-3i\right)^{2}-4\cdot4}}{2}
      = \frac{3i\pm\sqrt{-9-16}}{2}
      = \frac{3i\pm5i}{2}
      $$

      $$
      z_1 = 4i, \qquad z_2 = -i
      $$

      Cuidado con el discriminante: $\left(-3i\right)^{2}=-9$, **no** $9$. Ese
      signo es el error que más se comete aquí.

      Comprobación: $z_1+z_2=3i$ y $z_1z_2=4$, que son los coeficientes
      cambiados de signo y el término independiente ✓

      ### 2 · La elipse

      Suma de distancias a $4i$ y $-i$ igual a $6$:

      | dato | valor |
      |---|---|
      | centro | $\tfrac{4i+\left(-i\right)}{2}=\tfrac{3i}{2}$ |
      | distancia focal | $\lvert 4i-\left(-i\right)\rvert=5$, luego $c=\tfrac52$ |
      | semieje mayor | $a=3$ |
      | semieje menor | $b=\sqrt{9-\tfrac{25}{4}}=\tfrac{\sqrt{11}}{2}\approx1{,}658$ |

      Eje mayor vertical:

      $$
      \frac{x^{2}}{\tfrac{11}{4}}
      + \frac{\left(y-\tfrac32\right)^{2}}{9} = 1
      $$

      ### 3 · Que exista no era gratis

      La desigualdad triangular obliga a que $2a$ sea al menos la distancia
      entre focos:

      $$
      6 > 5 \;\checkmark
      $$

      Con $2a=5$ la elipse se aplastaría hasta ser el segmento de $-i$ a $4i$,
      y con $2a<5$ no habría ningún punto. Aquí el margen es pequeño, y por eso
      la elipse sale muy alargada: $3$ frente a $1{,}66$.

      ### 4 · Para dibujarla

      | punto | coordenadas |
      |---|---|
      | vértices del eje mayor | $\left(0,\tfrac32\pm3\right)=\left(0,4{,}5\right)$ y $\left(0,-1{,}5\right)$ |
      | vértices del eje menor | $\left(\pm1{,}658,\;1{,}5\right)$ |
      | focos | $\left(0,4\right)$ y $\left(0,-1\right)$ |

      **Lo que hay que llevarse.** Dos ejercicios encadenados: uno de
      ecuaciones y otro de lugares geométricos, unidos porque las raíces del
      primero son los focos del segundo. Y una comprobación que cuesta nada:
      $2a$ tiene que superar la distancia entre focos, o no hay elipse.

  - id: la-elipse-partida-por-la-bisectriz
    titulo: Una elipse partida por la bisectriz
    fuente: Ejercicio 9 · Problemas, tema 1 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular y representar gráficamente los afijos de los números complejos
      $z$ que verifican las condiciones siguientes:

      $$
      \begin{cases}
      \lvert z-i\rvert + \lvert z+i\rvert \le 5\\[4pt]
      \operatorname{Im}(z) \ge \operatorname{Re}(z)
      \end{cases}
      $$
    pide: La región del plano.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es $\operatorname{Im}(z)\ge\operatorname{Re}(z)$?
        opciones:
          - texto: >-
              El semiplano cerrado por encima de la bisectriz $y=x$
            correcta: true
            mensaje: |
              Eso es. Es la recta $y=x$ y todo lo que queda a su izquierda o
              por encima. Pasa por el centro de la elipse, así que la parte
              exactamente por la mitad.
          - texto: >-
              El primer cuadrante
            mensaje: |
              El primer cuadrante exigiría $x\ge0$ **e** $y\ge0$. Aquí solo se
              comparan las dos coordenadas entre sí, y por ejemplo
              $\left(-3,-1\right)$ la cumple.
          - texto: >-
              La recta $y=x$
            mensaje: |
              La recta es el caso de igualdad. La desigualdad añade todo un
              semiplano.

      - tipo: verificar
        pregunta: |
          Escribe en $x$ e $y$ las dos condiciones, unidas por `&`. La figura
          comprobará si tu región coincide con la del enunciado.
        condicion: '|z-i| + |z+i| <= 5 & Im(z) >= Re(z)'
        ventana:
          x: [-3, 3]
          y: [-3, 3]
        formato: dos condiciones en x e y, unidas por &
        pista: |
          De $2a=5$ sale $a=\tfrac52$, y con focos $\pm i$ es $c=1$, así que
          $b^{2}=\tfrac{25}{4}-1=\tfrac{21}{4}$. El eje mayor es vertical.
        desarrollo: |
          $$
          \frac{x^{2}}{\tfrac{21}{4}} + \frac{y^{2}}{\tfrac{25}{4}} \le 1
          \qquad\text{y}\qquad
          y \ge x
          $$

          Medio disco elíptico: la parte del interior de la elipse que queda por
          encima de la bisectriz.

      - tipo: calcular
        titulo: El semieje menor
        pregunta: |
          ¿Cuánto vale el semieje menor de la elipse?
        respuesta:
          tipo: numero
          valor: '2.291288'
          tolerancia: 0.002
          formato: con seis decimales
        distractores:
          - valor: '2.5'
            mensaje: |
              $\tfrac52$ es el semieje **mayor**, que sale directamente de
              $2a=5$. El menor hay que calcularlo con $\sqrt{a^{2}-c^{2}}$.
          - valor: '4.582576'
            mensaje: |
              $\sqrt{21}$ es el doble. $b^{2}=\tfrac{21}{4}$, así que
              $b=\tfrac{\sqrt{21}}{2}$.
        pista: |
          $b=\sqrt{\tfrac{25}{4}-1} = \tfrac{\sqrt{21}}{2}$.
        desarrollo: |
          $$
          b = \sqrt{\frac{25}{4}-1} = \sqrt{\frac{21}{4}}
          = \frac{\sqrt{21}}{2} \approx 2{,}291288
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La primera condición es el **interior** de la elipse de focos
              $\pm i$ y suma $5$, bordes incluidos.
          - texto: >-
              Con $a=\tfrac52$ y $c=1$ sale $b=\tfrac{\sqrt{21}}{2}$, y la
              elipse es $\tfrac{4x^{2}}{21}+\tfrac{4y^{2}}{25}\le1$.
          - texto: >-
              La segunda condición corta con el semiplano $y\ge x$, cuya
              frontera pasa por el centro.
          - texto: >-
              Y como la recta pasa por el centro, la región es exactamente la
              cuarta parte del disco elíptico.
            trampa: true
            mensaje: |
              Es la **mitad**, no la cuarta parte. Cualquier recta que pase por
              el centro de una elipse la divide en dos partes de igual área,
              porque la elipse es simétrica respecto de su centro. Una cuarta
              parte haría falta dos rectas.
        veredicto: |
          Toda recta por el centro parte la elipse en dos mitades exactas: es
          la simetría central. Ese argumento vale para cualquier elipse y
          cualquier dirección, y aquí ahorra tener que integrar nada.
      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 340 265" role="img" width="340" height="265"
               aria-labelledby="f-elipse-bisectriz-t f-elipse-bisectriz-d">
            <title id="f-elipse-bisectriz-t">La mitad de la elipse que queda por encima de la bisectriz</title>
            <desc id="f-elipse-bisectriz-d">Una elipse centrada en el origen con el eje mayor vertical de semieje dos coma cinco y el menor de dos coma veintinueve, con los focos en más y menos i. La recta y igual a x la atraviesa por el centro y corta el borde en más menos uno coma sesenta y nueve. Se sombrea la mitad de arriba, la que cumple que la parte imaginaria no es menor que la real.</desc>
