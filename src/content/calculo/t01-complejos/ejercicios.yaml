  # Ejemplos introductorios.
  #
  # No son de examen ni del boletín: los hemos escrito nosotros, y su `fuente`
  # lo dice en todas partes donde aparezcan. Existen porque el 23 de agosto de
  # 2026 se midió la dificultad del corpus y no había ni un solo ejercicio por
  # el que pudiera entrar alguien que no supiera el tema: el más fácil de los
  # lugares geométricos ya pedía completar cuadrados, y el bloque «El suelo» no
  # tenía ninguno que pidiera solo lo que su criterio de dominio decía.
  #
  # Regla al escribirlos: **una sola idea, números que salen a mano, tres
  # pasos**. En cuanto uno necesita dos herramientas, deja de ser un escalón de
  # entrada y ya lo cubre el boletín.
  # ═══════════════════════════════════════════════════════════════════

  - id: ej-polar-de-uno-mas-i
    titulo: Pasar 1 + i a forma polar
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Escribir el número complejo $z = 1 + i$ en forma polar.
    pide: El módulo, el argumento y el número escrito como r·e^(iθ).
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular nada: ¿en qué cuadrante está $1+i$?
        opciones:
          - texto: En el primero, porque las dos partes son positivas
            correcta: true
            mensaje: |
              Eso es. La parte real vale 1 y la imaginaria también, así que el
              punto está arriba a la derecha. Saberlo ahora es lo que evita
              equivocarse después con el argumento.
          - texto: En el segundo, porque tiene una $i$
            mensaje: |
              La $i$ no coloca el número en ningún sitio: lo que decide el
              cuadrante son los **signos** de las dos partes. Aquí las dos son
              positivas.
          - texto: No se puede saber sin calcular el módulo
            mensaje: |
              El módulo mide la distancia al origen y es siempre positivo, así
              que no dice nada del cuadrante. El cuadrante sale solo de mirar
              los signos de $a$ y $b$.
      - tipo: calcular
        titulo: El módulo
        pregunta: |
          ¿Cuánto vale $\left|z\right| = \sqrt{a^{2}+b^{2}}$ para $z = 1+i$?
        respuesta:
          tipo: numero
          valor: '1.41421356'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '2'
            mensaje: |
              Te has quedado en $a^{2}+b^{2} = 1+1 = 2$ y falta la raíz. El
              módulo es $\sqrt{2}$, no 2.
          - valor: '1'
            mensaje: |
              Has usado solo una de las dos partes. El módulo las mezcla las
              dos: $\sqrt{1^{2}+1^{2}}$.
        pista: |
          $a = 1$ y $b = 1$. Sustituye en $\sqrt{a^{2}+b^{2}}$ y no te dejes la
          raíz al final.
        desarrollo: |
          $$
          \left|z\right| = \sqrt{1^{2}+1^{2}} = \sqrt{2} \approx 1{,}4142
          $$

          Geométricamente es la hipotenusa de un triángulo de catetos 1 y 1, así
          que el resultado tenía que ser $\sqrt2$ antes de calcular nada.
      - tipo: calcular
        titulo: El argumento
        pregunta: |
          ¿Cuánto vale $\arg z$, en radianes?
        respuesta:
          tipo: numero
          valor: '0.78539816'
          tolerancia: 0.001
          formato: en radianes; en forma exacta, o con cuatro decimales
        distractores:
          - valor: '45'
            mensaje: |
              Ese es el ángulo en grados. En esta asignatura el argumento va
              siempre en **radianes**: $45^{\circ}$ son $\pi/4$.
          - valor: '1'
            mensaje: |
              1 es el valor de $\tan\theta = b/a$, no el ángulo. Falta aplicar
              el arcotangente.
        pista: |
          $\tan\theta = b/a = 1$. El ángulo del primer cuadrante cuya tangente
          vale 1 es uno de los que te sabes de memoria.
        desarrollo: |
          $$
          \tan\theta = \frac{b}{a} = \frac{1}{1} = 1
          \;\Longrightarrow\;
          \theta = \frac{\pi}{4}
          $$

          Y aquí $\arctan$ acierta, porque el punto está en el primer
          cuadrante, que es donde $\arctan$ devuelve valores. En el tercero no
          habría acertado.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta final. Una de estas piezas no debe entrar.
        piezas:
          - texto: El punto está en el primer cuadrante, porque $a>0$ y $b>0$.
          - texto: $\left|z\right| = \sqrt{1+1} = \sqrt2$.
          - texto: $\tan\theta = 1$ y, estando en el primer cuadrante, $\theta = \pi/4$.
          - texto: Por tanto $z = \sqrt2\,e^{i\pi/4}$.
          - texto: Como el módulo vale $\sqrt2$, el argumento vale también $\sqrt2$.
            trampa: true
            mensaje: |
              Módulo y argumento son cosas distintas y no tienen por qué
              parecerse: uno es una distancia y el otro un ángulo. Que aquí los
              dos salgan de los mismos números no los hace iguales.
    resolucion: |
      **Cuadrante.** $a = 1 > 0$ y $b = 1 > 0$, así que $z$ está en el primer
      cuadrante. Se mira antes que nada.

      **Módulo.**

      $$
      \left|z\right| = \sqrt{a^{2}+b^{2}} = \sqrt{1^{2}+1^{2}} = \sqrt{2}
      $$

      **Argumento.** $\tan\theta = b/a = 1$, y como estamos en el primer
      cuadrante, $\theta = \pi/4$.

      **Resultado.**

      $$
      z = 1+i = \sqrt{2}\,e^{i\pi/4} = \sqrt2\left(\cos\tfrac{\pi}{4} + i\,\mathrm{sen}\,\tfrac{\pi}{4}\right)
      $$

      **Comprobación.** Deshaciendo el camino:
      $\sqrt2\cos\frac{\pi}{4} = \sqrt2\cdot\frac{\sqrt2}{2} = 1$, y lo mismo
      para la parte imaginaria. Sale $1+i$, que es de donde veníamos.

  - id: ej-binomica-desde-polar
    titulo: Volver a binómica desde la forma polar
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Escribir en forma binómica el número complejo $z = 2\,e^{i\pi/3}$.
    pide: Las partes real e imaginaria, y el número en la forma a + bi.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hay que hacer para pasar de polar a binómica?
        opciones:
          - texto: Multiplicar el módulo por el coseno y por el seno del argumento
            correcta: true
            mensaje: |
              Exacto: $a = r\cos\theta$ y $b = r\,\mathrm{sen}\,\theta$. Es la
              proyección del vector sobre cada eje, ni más ni menos.
          - texto: Dividir el módulo entre el argumento
            mensaje: |
              El módulo y el argumento no se combinan entre sí: son dos datos
              independientes, una distancia y un ángulo. Lo que los une con
              $a$ y $b$ es la trigonometría del triángulo rectángulo.
          - texto: Elevar el módulo al argumento
            mensaje: |
              La exponencial $e^{i\theta}$ no es una potencia que haya que
              calcular: es la forma abreviada de
              $\cos\theta + i\,\mathrm{sen}\,\theta$.
      - tipo: calcular
        titulo: La parte real
        pregunta: |
          ¿Cuánto vale $a = r\cos\theta$ con $r = 2$ y $\theta = \pi/3$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1.7320508'
            mensaje: |
              Has usado el seno en vez del coseno: $2\,\mathrm{sen}\,\frac{\pi}{3} = \sqrt3$.
              Ese es el valor de la parte **imaginaria**.
          - valor: '2'
            mensaje: |
              2 es el módulo entero, que sería la parte real solo si el
              argumento fuera cero. Con $\pi/3$ el vector está inclinado y su
              sombra sobre el eje real es más corta.
        pista: |
          $\cos\frac{\pi}{3} = \frac12$. Multiplica por el módulo.
        desarrollo: |
          $$
          a = r\cos\theta = 2\cos\frac{\pi}{3} = 2\cdot\frac12 = 1
          $$
      - tipo: calcular
        titulo: La parte imaginaria
        pregunta: |
          ¿Y cuánto vale $b = r\,\mathrm{sen}\,\theta$?
        respuesta:
          tipo: numero
          valor: '1.7320508'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              Ese es el valor de la parte real, que sale con el coseno. Para la
              imaginaria hace falta el seno: $\mathrm{sen}\,\frac{\pi}{3} = \frac{\sqrt3}{2}$.
          - valor: '0.8660254'
            mensaje: |
              Te has quedado en $\mathrm{sen}\,\frac{\pi}{3} = \frac{\sqrt3}{2}$
              y falta multiplicar por el módulo, que vale 2.
        pista: |
          $\mathrm{sen}\,\frac{\pi}{3} = \frac{\sqrt3}{2}$, y el módulo es 2.
        desarrollo: |
          $$
          b = r\,\mathrm{sen}\,\theta = 2\,\mathrm{sen}\,\frac{\pi}{3}
          = 2\cdot\frac{\sqrt3}{2} = \sqrt3
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza sobra.
        piezas:
          - texto: De la forma polar se leen el módulo $r = 2$ y el argumento $\theta = \pi/3$.
          - texto: $a = r\cos\theta = 2\cdot\frac12 = 1$.
          - texto: $b = r\,\mathrm{sen}\,\theta = 2\cdot\frac{\sqrt3}{2} = \sqrt3$.
          - texto: Por tanto $z = 1 + \sqrt3\,i$.
          - texto: Como el argumento es positivo, la parte real también tiene que serlo.
            trampa: true
            mensaje: |
              No hay tal relación. Un argumento positivo puede dar parte real
              negativa: con $\theta = 2\pi/3$, que también es positivo, el
              coseno es negativo y el punto se va al segundo cuadrante.
    resolucion: |
      La forma polar $z = r\,e^{i\theta}$ es la abreviatura de
      $r(\cos\theta + i\,\mathrm{sen}\,\theta)$, así que pasar a binómica es
      simplemente desarrollarla.

      Con $r = 2$ y $\theta = \pi/3$:

      $$
      a = 2\cos\frac{\pi}{3} = 2\cdot\frac{1}{2} = 1,
      \qquad
      b = 2\,\mathrm{sen}\,\frac{\pi}{3} = 2\cdot\frac{\sqrt3}{2} = \sqrt3
      $$

      $$
      z = 1 + \sqrt3\,i
      $$

      **Comprobación.** El módulo tiene que seguir valiendo 2:
      $\sqrt{1^{2}+(\sqrt3)^{2}} = \sqrt{1+3} = 2$. Cuadra, y esa comprobación
      cuesta cinco segundos.

  - id: ej-argumento-tercer-cuadrante
    titulo: El argumento de un número del tercer cuadrante
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Calcular el argumento de $z = -1 - i$.
    pide: El argumento en radianes, con el cuadrante justificado.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué cuadrante está $-1-i$?
        opciones:
          - texto: En el tercero, porque las dos partes son negativas
            correcta: true
            mensaje: |
              Eso es. Abajo a la izquierda. Y ahí es donde $\arctan$ deja de
              servir tal cual, que es de lo que va este ejercicio.
          - texto: En el primero, porque $b/a = 1$ es positivo
            mensaje: |
              El cociente $b/a$ sale positivo tanto en el primer cuadrante como
              en el tercero, porque al dividir dos negativos el signo se pierde.
              **Ese es exactamente el problema**: el cociente no distingue los
              dos casos, y por eso hay que mirar los signos por separado.
          - texto: En el cuarto, porque la parte imaginaria es negativa
            mensaje: |
              La parte imaginaria negativa deja el punto abajo, pero falta mirar
              la real: si también es negativa, es el tercero, no el cuarto.
      - tipo: calcular
        titulo: Lo que devolvería el arcotangente
        pregunta: |
          ¿Cuánto vale $\arctan(b/a)$ aquí, en radianes?
        respuesta:
          tipo: numero
          valor: '0.78539816'
          tolerancia: 0.001
          formato: en forma exacta, o con cuatro decimales
        distractores:
          - valor: '-2.35619449'
            mensaje: |
              Ese es el argumento **correcto** de $z$, que es lo que buscamos al
              final. Pero no es lo que devuelve $\arctan(b/a)$: la pregunta es
              justamente cuánto vale el atajo antes de corregirlo.
          - valor: '-0.78539816'
            mensaje: |
              El cociente es $b/a = \frac{-1}{-1} = +1$, no $-1$: los dos signos
              menos se cancelan al dividir. Por eso $\arctan$ da un ángulo
              positivo.
        pista: |
          Calcula primero el cociente $b/a$ con sus signos, y luego el
          arcotangente de ese número.
        desarrollo: |
          $$
          \frac{b}{a} = \frac{-1}{-1} = 1
          \;\Longrightarrow\;
          \arctan(1) = \frac{\pi}{4}
          $$

          Y $\pi/4$ es un ángulo del **primer** cuadrante, cuando nuestro
          número está en el tercero. Ahí está la trampa.
      - tipo: calcular
        titulo: El argumento de verdad
        pregunta: |
          Corregido el cuadrante, ¿cuánto vale $\arg z$?
        respuesta:
          tipo: numero
          valor: '-2.35619449'
          tolerancia: 0.001
          formato: en radianes, entre −π y π; en forma exacta, o con cuatro decimales
        distractores:
          - valor: '0.78539816'
            mensaje: |
              Ese es el valor sin corregir, el que da la calculadora o la
              memoria. Es el argumento de $1+i$, el número contrario al nuestro.
          - valor: '2.35619449'
            mensaje: |
              Estás en el segundo cuadrante, no en el tercero: $3\pi/4$ tiene
              parte real negativa pero imaginaria **positiva**. Nuestro punto
              está abajo, así que el argumento es negativo.
        pista: |
          Al ángulo que da el arcotangente hay que sumarle o restarle $\pi$
          para cruzar al cuadrante opuesto. Elige el signo que deje el
          resultado entre $-\pi$ y $\pi$.
        desarrollo: |
          El arcotangente da $\pi/4$, que apunta al primer cuadrante. Nuestro
          punto está justo en la dirección contraria, media vuelta más allá:

          $$
          \arg z = \frac{\pi}{4} - \pi = -\frac{3\pi}{4} \approx -2{,}3562
          $$

          Se resta y no se suma para que el resultado caiga en el intervalo
          $(-\pi, \pi]$, que es el que se usa por convenio.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: $a = -1 < 0$ y $b = -1 < 0$, luego $z$ está en el tercer cuadrante.
          - texto: $\tan\theta = b/a = 1$, y $\arctan(1) = \pi/4$.
          - texto: $\pi/4$ está en el primer cuadrante, así que hay que corregir media vuelta.
          - texto: $\arg z = \pi/4 - \pi = -3\pi/4$.
          - texto: Como $\arctan$ es una función bien definida, su resultado ya es el argumento.
            trampa: true
            mensaje: |
              Que una función esté bien definida no quiere decir que conteste a
              la pregunta que le haces. $\arctan$ solo devuelve ángulos entre
              $-\pi/2$ y $\pi/2$: la mitad del plano le queda fuera de alcance,
              y no tiene forma de avisarte.
    resolucion: |
      **El cuadrante primero.** $a = -1$ y $b = -1$ son las dos negativas, así
      que el afijo está en el tercer cuadrante, abajo a la izquierda.

      **El atajo, y por qué falla.**

      $$
      \tan\theta = \frac{b}{a} = \frac{-1}{-1} = 1
      \;\Longrightarrow\;
      \arctan(1) = \frac{\pi}{4}
      $$

      Los dos signos menos se cancelan al dividir, y con ellos se pierde la
      información del cuadrante. $\arctan$ solo devuelve valores en
      $\left(-\frac{\pi}{2}, \frac{\pi}{2}\right)$, es decir, en el primer y el
      cuarto cuadrante: el tercero no lo puede alcanzar.

      **La corrección.**

      $$
      \arg z = \frac{\pi}{4} - \pi = -\frac{3\pi}{4}
      $$

      **Comprobación.** El módulo es $\sqrt2$, así que
      $\sqrt2\cos\left(-\frac{3\pi}{4}\right) = \sqrt2\cdot\left(-\frac{\sqrt2}{2}\right) = -1$
      y lo mismo para la parte imaginaria. Recuperamos $-1-i$.

  - id: ej-argumento-imaginario-puro
    titulo: El argumento cuando la parte real es cero
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Calcular el módulo y el argumento de $z = -2i$.
    pide: El módulo y el argumento, y por qué aquí no sirve la fórmula de la tangente.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué pasa al intentar usar $\tan\theta = b/a$ con este número?
        opciones:
          - texto: Que no se puede, porque $a = 0$ y habría que dividir entre cero
            correcta: true
            mensaje: |
              Exacto. La fórmula del arcotangente no vale aquí, y no es un caso
              raro: los imaginarios puros salen constantemente al resolver
              ecuaciones. Se resuelve mirando el dibujo.
          - texto: Que sale $\theta = 0$
            mensaje: |
              $b/a$ con $a=0$ no vale cero: no vale nada, la división no está
              definida. Y desde luego el argumento no es 0, porque el punto no
              está sobre el eje real positivo.
          - texto: Que hay que usar el módulo en su lugar
            mensaje: |
              El módulo es una distancia y no dice en qué dirección está el
              punto. Aquí la dirección se ve directamente: el número está sobre
              el eje imaginario.
      - tipo: calcular
        titulo: El módulo
        pregunta: |
          ¿Cuánto vale $\left|-2i\right|$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-2'
            mensaje: |
              El módulo es una distancia, así que **nunca** es negativo. El
              signo se pierde al elevar al cuadrado: $\sqrt{0^{2}+(-2)^{2}} = 2$.
          - valor: '4'
            mensaje: |
              4 es $b^{2}$. Falta la raíz cuadrada del final.
        pista: |
          $a = 0$ y $b = -2$. Mete los dos en $\sqrt{a^{2}+b^{2}}$.
        desarrollo: |
          $$
          \left|z\right| = \sqrt{0^{2}+(-2)^{2}} = \sqrt{4} = 2
          $$

          Que era de esperar: el punto está a dos unidades del origen, bajando
          por el eje imaginario.
      - tipo: calcular
        titulo: El argumento
        pregunta: |
          ¿Cuánto vale $\arg(-2i)$, en radianes?
        respuesta:
          tipo: numero
          valor: '-1.57079633'
          tolerancia: 0.001
          formato: en radianes, entre −π y π; en forma exacta, o con cuatro decimales
        distractores:
          - valor: '1.57079633'
            mensaje: |
              Ese es el argumento de $+2i$, que apunta hacia arriba. El nuestro
              lleva un signo menos y apunta hacia abajo, así que el ángulo es
              el opuesto.
          - valor: '3.14159265'
            mensaje: |
              $\pi$ apunta hacia la izquierda, sobre el eje real negativo. Ese
              sería el argumento de $-2$, sin la $i$.
        pista: |
          Dibuja el punto: está sobre el eje imaginario, dos unidades **por
          debajo** del origen. ¿Qué ángulo forma con el eje real positivo?
        desarrollo: |
          El afijo de $-2i$ es el punto $(0, -2)$: está sobre el eje imaginario,
          hacia abajo. La dirección «hacia abajo» forma con el eje real positivo
          un ángulo de un cuarto de vuelta en sentido negativo:

          $$
          \arg z = -\frac{\pi}{2}
          $$

          Vale igual $\frac{3\pi}{2}$, que es el mismo sitio dando la vuelta por
          el otro lado, pero por convenio se toma el representante que cae en
          $(-\pi, \pi]$.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Sobra una pieza.
        piezas:
          - texto: Con $a = 0$, la fórmula $\tan\theta = b/a$ no se puede usar.
          - texto: El afijo es el punto $(0,-2)$, sobre el eje imaginario y hacia abajo.
          - texto: Esa dirección forma un ángulo de $-\pi/2$ con el eje real positivo.
          - texto: El módulo es la distancia al origen, que vale 2. Luego $z = 2\,e^{-i\pi/2}$.
          - texto: Al no poder aplicar el arcotangente, el argumento no está definido.
            trampa: true
            mensaje: |
              Que falle una fórmula no quiere decir que la cosa no exista. El
              argumento es el ángulo del vector, y ese vector está ahí,
              perfectamente visible. La fórmula de la tangente es un atajo,
              no la definición.
    resolucion: |
      **Por qué la fórmula falla.** El número es $z = 0 - 2i$, así que $a = 0$ y
      la expresión $\tan\theta = b/a$ pide dividir entre cero. No hay ángulo que
      sacar de ahí, y no porque no exista, sino porque el atajo no llega.

      **El módulo.**

      $$
      \left|z\right| = \sqrt{0^{2}+(-2)^{2}} = 2
      $$

      **El argumento, mirando el dibujo.** El afijo es $(0,-2)$: está sobre el
      eje imaginario, dos unidades por debajo del origen. El ángulo que forma
      con el semieje real positivo, medido en el sentido habitual, es un cuarto
      de vuelta hacia abajo:

      $$
      \arg z = -\frac{\pi}{2}
      $$

      **Resultado.** $z = 2\,e^{-i\pi/2}$.

      **Comprobación.** $2\cos\left(-\frac{\pi}{2}\right) = 0$ y
      $2\,\mathrm{sen}\left(-\frac{\pi}{2}\right) = -2$. Sale $0-2i$, que es $z$.

  - id: ej-dividir-racionalizando
    titulo: Dividir dos complejos racionalizando
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Escribir en forma binómica el cociente
      $$
      z = \frac{2+i}{3-i}
      $$
    pide: El cociente en la forma a + bi.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué hay que multiplicar arriba y abajo para hacer esta división?
        opciones:
          - texto: Por el conjugado del denominador, para que el de abajo quede real
            correcta: true
            mensaje: |
              Eso es. $w\,\overline{w} = \left|w\right|^{2}$ es un número real,
              y dividir entre un real sí se sabe hacer: se reparte entre las dos
              partes.
          - texto: Por el conjugado del numerador, para simplificar arriba
            mensaje: |
              El problema no está arriba: está abajo, porque no sabemos dividir
              entre un complejo. El que hay que volver real es el denominador.
          - texto: Por el propio denominador, para elevarlo al cuadrado
            mensaje: |
              Multiplicar $3-i$ por sí mismo da $(3-i)^{2} = 8-6i$, que sigue
              teniendo parte imaginaria. Lo que hace desaparecer la $i$ es
              multiplicar por el **conjugado**, no por el mismo número.
      - tipo: calcular
        titulo: El denominador
        pregunta: |
          ¿Cuánto vale $(3-i)(3+i)$?
        respuesta:
          tipo: numero
          valor: '10'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '8'
            mensaje: |
              Has restado en vez de sumar: $(3-i)(3+i) = 9 - i^{2}$, y como
              $i^{2} = -1$, eso es $9+1 = 10$. El doble cambio de signo es justo
              lo que hace crecer el resultado.
          - valor: '9'
            mensaje: |
              Te has dejado el término $-i^{2}$. Al desarrollar quedan $9$ y
              $-i^{2} = +1$.
        pista: |
          Es una suma por diferencia: $(a-b)(a+b) = a^{2}-b^{2}$, con $b = i$.
          Y acuérdate de que $i^{2} = -1$.
        desarrollo: |
          $$
          (3-i)(3+i) = 3^{2} - i^{2} = 9 - (-1) = 10
          $$

          Que es $\left|3-i\right|^{2} = 3^{2}+1^{2} = 10$. Siempre sale así:
          un número por su conjugado es el módulo al cuadrado.
      - tipo: calcular
        titulo: El resultado
        pregunta: |
          Termina la división. ¿Cuánto vale $z$?
        respuesta:
          tipo: complejo
          valor: '0.5+0.5i'
          tolerancia: 0.001
          formato: en forma binómica, por ejemplo 0,5+0,5i
        distractores:
          - valor: '0.5-0.5i'
            mensaje: |
              El signo de la parte imaginaria está cambiado. Al desarrollar
              $(2+i)(3+i)$ los términos imaginarios son $2i$ y $3i$, que **suman**
              $5i$: los dos son positivos.
          - valor: '5+5i'
            mensaje: |
              Te has quedado en el numerador, $5+5i$, y falta dividir entre el
              denominador, que es 10.
          - valor: '0.6666667+0.3333333i'
            mensaje: |
              Parece que has dividido parte por parte, $2/3$ y $1/(-1)$. Los
              complejos no se dividen así: hay que racionalizar primero.
        pista: |
          Desarrolla $(2+i)(3+i)$ sin olvidar que $i^{2} = -1$, y reparte el
          resultado entre 10.
        desarrollo: |
          $$
          \frac{2+i}{3-i}
          = \frac{(2+i)(3+i)}{(3-i)(3+i)}
          = \frac{6+2i+3i+i^{2}}{10}
          = \frac{5+5i}{10}
          = \frac12+\frac12 i
          $$
      - tipo: justificar
        pregunta: |
          Ordena el desarrollo. Una pieza es falsa.
        piezas:
          - texto: Se multiplica arriba y abajo por $3+i$, el conjugado del denominador.
          - texto: El denominador queda $(3-i)(3+i) = 9-i^{2} = 10$, que es real.
          - texto: El numerador queda $(2+i)(3+i) = 6+5i+i^{2} = 5+5i$.
          - texto: Dividir entre un real es repartirlo entre las dos partes, y sale $\frac12+\frac12 i$.
          - texto: Multiplicar arriba y abajo cambia el valor, así que hay que ajustarlo al final.
            trampa: true
            mensaje: |
              No lo cambia: multiplicar numerador y denominador por lo mismo es
              multiplicar por 1 disfrazado. Ese es justo el motivo de que la
              técnica sea legítima y no haya nada que ajustar después.
    resolucion: |
      No hay una regla nueva para dividir: se convierte el denominador en un
      número real y entonces la división es la de siempre.

      Se multiplica arriba y abajo por el **conjugado del denominador**:

      $$
      \frac{2+i}{3-i}
      = \frac{(2+i)(3+i)}{(3-i)(3+i)}
      $$

      El denominador se vuelve real, y esa es toda la gracia:

      $$
      (3-i)(3+i) = 9 - i^{2} = 9+1 = 10 = \left|3-i\right|^{2}
      $$

      El numerador se desarrolla como cualquier producto, recordando
      $i^{2} = -1$:

      $$
      (2+i)(3+i) = 6 + 2i + 3i + i^{2} = 6 + 5i - 1 = 5+5i
      $$

      $$
      z = \frac{5+5i}{10} = \frac{1}{2} + \frac{1}{2}i
      $$

      **Comprobación.** Multiplicando el resultado por el denominador original
      hay que recuperar el numerador:
      $\left(\frac12+\frac12 i\right)(3-i) = \frac32 - \frac12 i + \frac32 i - \frac12 i^{2}
      = \frac32 + i + \frac12 = 2+i$. Cuadra.

  - id: ej-modulo-por-conjugado
    titulo: Un número por su conjugado
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Para $z = 3+4i$, calcular $z\,\overline{z}$ y comprobar que coincide con
      $\left|z\right|^{2}$.
    pide: El producto, el módulo, y la relación entre los dos.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es el conjugado de $z = 3+4i$?
        opciones:
          - texto: $3-4i$
            correcta: true
            mensaje: |
              Sí: se cambia el signo de la parte imaginaria y nada más. En el
              dibujo es el mismo punto reflejado en el eje real.
          - texto: $-3-4i$
            mensaje: |
              Ese es el **opuesto**, $-z$, que cambia los dos signos y gira
              media vuelta. El conjugado solo cambia el de la parte imaginaria
              y refleja.
          - texto: $4+3i$
            mensaje: |
              Has intercambiado las dos partes. El conjugado no las mueve de
              sitio: deja la real igual y le cambia el signo a la imaginaria.
      - tipo: calcular
        titulo: El producto
        pregunta: |
          ¿Cuánto vale $z\,\overline{z} = (3+4i)(3-4i)$?
        respuesta:
          tipo: numero
          valor: '25'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '-7'
            mensaje: |
              Has hecho $9 + 16i^{2} = 9-16$. Ojo al signo del producto: es
              $(3+4i)(3-4i) = 9 - (4i)^{2} = 9 - 16i^{2} = 9+16$. La resta de un
              cuadrado de $i$ suma.
          - valor: '9'
            mensaje: |
              Te has quedado solo con $3^{2}$. Falta el término de la parte
              imaginaria, que aporta $+16$.
          - valor: '5'
            mensaje: |
              5 es el **módulo** de $z$, no el producto. El producto es el
              módulo al cuadrado: $5^{2} = 25$.
        pista: |
          Suma por diferencia otra vez: $(a+b)(a-b) = a^{2}-b^{2}$ con
          $b = 4i$. Y $(4i)^{2} = 16i^{2} = -16$.
        desarrollo: |
          $$
          (3+4i)(3-4i) = 3^{2} - (4i)^{2} = 9 - 16i^{2} = 9 + 16 = 25
          $$

          Fíjate en que no queda parte imaginaria: los términos cruzados
          $-12i$ y $+12i$ se cancelan. Siempre pasa.
      - tipo: calcular
        titulo: El módulo
        pregunta: |
          ¿Y cuánto vale $\left|z\right|$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '25'
            mensaje: |
              25 es el módulo **al cuadrado**, que es justo el producto que
              acabas de calcular. Falta la raíz.
          - valor: '7'
            mensaje: |
              Has sumado las dos partes, $3+4$. El módulo no es la suma: es la
              hipotenusa, $\sqrt{3^{2}+4^{2}}$.
        pista: |
          $\sqrt{3^{2}+4^{2}}$. Es el triángulo de lados 3, 4 y 5.
        desarrollo: |
          $$
          \left|z\right| = \sqrt{3^{2}+4^{2}} = \sqrt{25} = 5
          $$

          Y $\left|z\right|^{2} = 25$, que es exactamente el producto de antes.
      - tipo: justificar
        pregunta: |
          Ordena la conclusión. Una pieza no es verdad.
        piezas:
          - texto: El conjugado de $3+4i$ es $3-4i$.
          - texto: Al multiplicarlos, los términos con $i$ se cancelan y queda $9+16 = 25$.
          - texto: El módulo es $\sqrt{3^{2}+4^{2}} = 5$, y su cuadrado es 25.
          - texto: Luego $z\,\overline{z} = \left|z\right|^{2}$, y el resultado es siempre real y no negativo.
          - texto: Como el producto es real, $z$ y su conjugado son el mismo número.
            trampa: true
            mensaje: |
              Son dos puntos distintos del plano, uno reflejo del otro. Solo
              coinciden cuando la parte imaginaria es cero, es decir, cuando el
              número ya era real. Que su producto salga real no los iguala.
    resolucion: |
      **El conjugado** de $z = 3+4i$ es $\overline{z} = 3-4i$: el mismo punto
      reflejado en el eje real.

      **El producto.** Es una suma por diferencia, con la particularidad de que
      el cuadrado de $i$ cambia el signo del segundo término:

      $$
      z\,\overline{z} = (3+4i)(3-4i) = 3^{2} - (4i)^{2} = 9 - 16i^{2} = 9+16 = 25
      $$

      Los términos cruzados, $-12i$ y $+12i$, se cancelan: por eso el resultado
      no tiene parte imaginaria.

      **El módulo.**

      $$
      \left|z\right| = \sqrt{3^{2}+4^{2}} = 5,
      \qquad
      \left|z\right|^{2} = 25
      $$

      **La conclusión, que es lo que hay que llevarse.** Para cualquier $z$,

      $$
      z\,\overline{z} = \left|z\right|^{2}
      $$

      y eso es lo que convierte al conjugado en la herramienta más rentable del
      tema: es lo que hace desaparecer la $i$ de un denominador.

  - id: potencia-novena
    titulo: Potencia novena en forma binómica
    fuente: >-
      Ejercicio 1.1 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU
      (2014/2015 7E)

    nivel: practica
    enunciado: |
      Sea el número complejo

      $$
      z = -\frac{\sqrt{3}}{2} - \frac{i}{2}
      $$
    pide: Calcular $z^{9}$, dando el resultado en forma binómica.

    pasos:
      # ── COMP1 ────────────────────────────────────────────────────────
      - tipo: reconocer
        pregunta: |
          Antes de tocar nada: ¿qué camino lleva a $z^{9}$ sin que se te vaya
          la tarde?
        opciones:
          - texto: Pasar $z$ a forma polar y aplicar De Moivre
            correcta: true
            mensaje: |
              Eso es. En polar, elevar a la novena es elevar el módulo y
              multiplicar el argumento por nueve. Dos operaciones, cero
              productos de binomios.
          - texto: Desarrollar la potencia con el binomio de Newton
            mensaje: |
              Se puede, y da lo mismo, pero son diez sumandos con potencias de
              $i$ y de $\sqrt{3}$ que hay que reducir una a una. En un examen es
              donde aparecen los errores de signo y donde se agota el tiempo.
          - texto: Multiplicar $z$ por sí mismo nueve veces
            mensaje: |
              Llegas, pero arrastras cada error hasta el final y no tienes forma
              de comprobar el resultado. Un fallo de signo en el segundo
              producto te cuesta el ejercicio entero y no te enteras.
          - texto: Calcular $|z|^{9}$, que es lo que pide la potencia
            mensaje: |
              El módulo es solo la mitad de la información. Sin el argumento no
              tienes un número complejo, tienes una distancia al origen: hay
              infinitos complejos con ese mismo módulo.

      # ── COMP2 · el módulo ────────────────────────────────────────────
      - tipo: calcular
        titulo: Módulo de z
        pregunta: ¿Cuánto vale $|z|$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1.366'
            mensaje: |
              Has sumado las dos componentes en valor absoluto:
              $\frac{\sqrt3}{2}+\frac12 \approx 1{,}366$. El módulo no es la
              suma de los catetos, es la hipotenusa:
              $\sqrt{a^{2}+b^{2}}$.
          - valor: '0.866'
            mensaje: |
              Eso es $\frac{\sqrt3}{2}$, solo la parte real. Te falta la parte
              imaginaria: $\sqrt{\left(\frac{\sqrt3}{2}\right)^{2} +
              \left(\frac12\right)^{2}}$.
          - valor: '-1'
            mensaje: |
              El módulo es una distancia, así que nunca es negativo. Que las dos
              componentes sean negativas no arrastra el signo: se elevan al
              cuadrado antes de sumarlas.
        pista: |
          $|z| = \sqrt{a^{2}+b^{2}}$ con $a = -\frac{\sqrt3}{2}$ y
          $b = -\frac12$. Fíjate en que $\frac34 + \frac14$ es un número
          especialmente cómodo.
        desarrollo: |
          $$
          |z| = \sqrt{\left(-\frac{\sqrt{3}}{2}\right)^{2} + \left(-\frac{1}{2}\right)^{2}}
              = \sqrt{\frac{3}{4} + \frac{1}{4}} = \sqrt{1} = 1
          $$
        veredicto: |
          Módulo 1: el afijo de $z$ está **en la circunferencia unidad**. Eso
          tiene consecuencias — $|z^{9}| = |z|^{9} = 1$, así que cualquier
          resultado final con módulo distinto de 1 está mal sin necesidad de
          revisar nada más.

      # ── COMP4 · el argumento, que es donde se pierde el ejercicio ────
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que justifica el valor de $\arg z$. Una de las
          piezas no debe entrar.
        piezas:
          - texto: |
              $z$ tiene parte real $-\frac{\sqrt3}{2}$ y parte imaginaria
              $-\frac12$: las dos negativas, luego su afijo está en el
              **tercer cuadrante**.
          - texto: |
              $\tan\theta = \dfrac{b}{a} = \dfrac{-1/2}{-\sqrt3/2} =
              \dfrac{1}{\sqrt3}$, y en $[0,2\pi)$ hay **dos** ángulos que lo
              cumplen: $\pi/6$ y $7\pi/6$.
          - texto: |
              Como $\arctan\frac{1}{\sqrt3} = \frac{\pi}{6}$, el argumento es
              $\theta = \frac{\pi}{6}$.
            trampa: true
            mensaje: |
              Esta es la pieza envenenada, y es el error que más veces cuesta
              este ejercicio. $\arctan$ devuelve siempre un ángulo entre
              $-\pi/2$ y $\pi/2$: te deja en el primer o el cuarto cuadrante,
              nunca en el tercero. Con este $z$ obtienes el argumento de
              $\frac{\sqrt3}{2}+\frac{i}{2}$ — el número contrario— y como el
              módulo sale bien, nada te avisa. El resultado final aparece girado
              media vuelta.
          - texto: |
              De los dos, el que cae en el tercer cuadrante es $7\pi/6$. Por
              tanto $\arg z = \frac{7\pi}{6}$.
          - texto: |
              Comprobación: $\cos\frac{7\pi}{6} = -\frac{\sqrt3}{2}$ y
              $\sin\frac{7\pi}{6} = -\frac12$, que son exactamente las dos
              componentes de $z$.
        veredicto: |
          El orden importa menos que el hábito: mirar el cuadrante **antes** de
          tocar la calculadora.

      # ── COMP2 · el resultado ─────────────────────────────────────────
      - tipo: calcular
        titulo: La potencia, en forma binómica
        pregunta: |
          Con $z = e^{i7\pi/6}$, aplica De Moivre y escribe $z^{9}$ en forma
          binómica.
        respuesta:
          tipo: complejo
          valor: 'i'
          tolerancia: 0.02
          formato: forma binómica, tipo a+bi
        distractores:
          - valor: '-i'
            mensaje: |
              Has usado $\theta = \pi/6$ en vez de $7\pi/6$: es el argumento de
              $\frac{\sqrt3}{2}+\frac{i}{2}$, no el de $z$. Como la diferencia
              es exactamente $\pi$ y el exponente es impar, el resultado sale
              girado media vuelta: $-i$ en lugar de $i$. Es el error del
              $\arctan$, llegando hasta el final sin que nada lo delate.
          - valor: '1'
            mensaje: |
              Has invertido la razón: $\tan\theta = b/a$, no $a/b$. Con
              $\arctan\sqrt3 = \pi/3$ acabas en $\theta = 4\pi/3$, y
              $9\cdot\frac{4\pi}{3} = 12\pi$, que son seis vueltas exactas y te
              deja en el 1. Comprueba siempre cuál de los dos números va arriba.
          - valor: '0.32-0.95i'
            mensaje: |
              El razonamiento está bien y la calculadora está en radianes
              mientras tú piensas en grados. Has evaluado
              $\cos(1890) + i\,\sin(1890)$ tomando 1890 como radianes; esos
              $1890$ eran **grados**, y en grados hay que reducirlos restando
              vueltas de $360$.
          - valor: '16.59i'
            mensaje: |
              La dirección es correcta, pero el módulo no: has elevado a la
              novena $\frac{\sqrt3}{2}+\frac12 \approx 1{,}366$ en vez de 1. Es
              el error del paso del módulo arrastrado hasta aquí. Y aquí se caza
              solo: si $|z| = 1$, entonces $|z^{9}| = 1$.
        pista: |
          De Moivre: $z^{9} = |z|^{9}\,e^{i\,9\theta}$. Con $|z| = 1$ el módulo
          no da trabajo; todo está en reducir $9\cdot\frac{7\pi}{6}$ restando
          vueltas enteras de $2\pi$.
        desarrollo: |
          $$
          z^{9} = 1^{9}\,e^{i\,9\cdot\frac{7\pi}{6}}
                = e^{i\frac{63\pi}{6}}
                = e^{i\frac{21\pi}{2}}
          $$

          Se reduce el argumento restando vueltas completas:

          $$
          \frac{21\pi}{2} - 5\cdot 2\pi = \frac{21\pi}{2} - \frac{20\pi}{2} = \frac{\pi}{2}
          $$

          Y se pasa a binómica:

          $$
          z^{9} = \cos\frac{\pi}{2} + i\,\sin\frac{\pi}{2} = 0 + i\cdot 1 = i
          $$
        veredicto: |
          En grados sale igual de claro: $9 \cdot 210^{\circ} = 1890^{\circ}$, y
          $1890 = 5\cdot 360 + 90$. Cinco vueltas y un cuarto de vuelta.

    resolucion: |
      **Datos.** $z = -\dfrac{\sqrt{3}}{2} - \dfrac{i}{2}$. Se pide $z^{9}$ en
      forma binómica.

      ### 1 · Herramienta y por qué se puede aplicar

      Se usa la **fórmula de De Moivre**: si $z = r\,e^{i\theta}$ con
      $r = |z|$ y $\theta = \arg z$, entonces

      $$
      z^{n} = r^{n} e^{i n\theta}, \qquad n \in \mathbb{Z}
      $$

      La fórmula exige tener $z$ escrito en forma polar, y no impone ninguna
      condición adicional sobre $z$ salvo $z \neq 0$ cuando el exponente es
      negativo. Aquí $z \neq 0$ y $n = 9 > 0$, así que es aplicable sin
      restricciones. El trabajo previo es obtener $r$ y $\theta$.

      ### 2 · Módulo

      $$
      r = |z| = \sqrt{a^{2}+b^{2}}
              = \sqrt{\left(-\frac{\sqrt{3}}{2}\right)^{2} + \left(-\frac{1}{2}\right)^{2}}
              = \sqrt{\frac{3}{4} + \frac{1}{4}}
              = \sqrt{1} = 1
      $$

      El afijo de $z$ está en la circunferencia unidad. Esto se usará al final
      como comprobación: si $|z| = 1$, entonces $|z^{9}| = 1^{9} = 1$.

      ### 3 · Argumento

      Las dos componentes de $z$ son negativas, luego su afijo está en el
      **tercer cuadrante**. La condición que define el argumento es

      $$
      \tan\theta = \frac{b}{a} = \frac{-1/2}{-\sqrt{3}/2} = \frac{1}{\sqrt{3}}
      $$

      y en $[0,2\pi)$ la cumplen **dos** ángulos: $\theta = \pi/6$ y
      $\theta = 7\pi/6$. Hay que quedarse con el del tercer cuadrante:

      $$
      \arg z = \frac{7\pi}{6}
      $$

      Escribir $\theta = \arctan\frac{1}{\sqrt3} = \frac{\pi}{6}$ sería un
      error: $\arctan$ toma valores en $(-\pi/2, \pi/2)$ y por tanto nunca
      devuelve un ángulo del tercer cuadrante. Se comprueba que el elegido es
      el correcto:

      $$
      \cos\frac{7\pi}{6} = -\frac{\sqrt{3}}{2}, \qquad
      \sin\frac{7\pi}{6} = -\frac{1}{2}
      $$

      que son exactamente la parte real y la parte imaginaria de $z$. Por tanto

      $$
      z = 1\cdot e^{i\frac{7\pi}{6}} = e^{i\frac{7\pi}{6}}
      $$

      ### 4 · Aplicación de De Moivre

      $$
      z^{9} = 1^{9}\,e^{i\,9\cdot\frac{7\pi}{6}}
            = e^{i\frac{63\pi}{6}}
            = e^{i\frac{21\pi}{2}}
      $$

      El argumento se reduce al intervalo $[0,2\pi)$ restando vueltas completas:

      $$
      \frac{21\pi}{2} - 5\cdot 2\pi = \frac{21\pi}{2} - \frac{20\pi}{2} = \frac{\pi}{2}
      $$

      ### 5 · Paso a forma binómica

      $$
      z^{9} = \cos\frac{\pi}{2} + i\,\sin\frac{\pi}{2} = 0 + i\cdot 1
      $$

      ### 6 · Comprobación

      Dos comprobaciones independientes, que cuestan veinte segundos:

      - **Módulo.** $|z| = 1 \Rightarrow |z^{9}| = 1$, y en efecto $|i| = 1$.
        Cualquier resultado con módulo distinto de 1 habría estado mal.
      - **En grados.** $\arg z = 7\pi/6 = 210^{\circ}$, y
        $9 \cdot 210^{\circ} = 1890^{\circ} = 5\cdot 360^{\circ} + 90^{\circ}$:
        cinco vueltas completas y un cuarto de vuelta, que deja el afijo en el
        semieje imaginario positivo.

      ### Resultado

      $$
      \boxed{\;z^{9} = i\;}
      $$

  - id: suma-conjugados
    titulo: Suma de dos potencias décimas
    fuente: >-
      Ejercicio 1.2 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU
      (2017/2018 6E)

    nivel: practica
    enunciado: |
      $$
      \left(\frac{1+i}{\sqrt{2}}\right)^{10} + \left(\frac{1-i}{\sqrt{2}}\right)^{10}
      $$
    pide: Calcular la suma y representar gráficamente el resultado.

    pasos:
      # ── COMP1 ────────────────────────────────────────────────────────
      - tipo: reconocer
        pregunta: |
          Mira las dos bases antes de calcular nada. ¿Qué observación te ahorra
          la mitad del trabajo?
        opciones:
          - texto: |
              La segunda base es la conjugada de la primera, así que la suma es
              dos veces la parte real de la primera potencia
            correcta: true
            mensaje: |
              Eso es. Si $w = \overline{z}$, entonces $w^{10} =
              \left(\overline{z}\right)^{10}$, que es la conjugada de $z^{10}$;
              y un número más su conjugado es $2\operatorname{Re}$. Calculas una
              potencia y la otra sale gratis.
          - texto: Elevar las dos a la décima por separado, cada una en forma polar
            mensaje: |
              Llegas, y no está mal, pero haces el doble de trabajo. Fíjate en
              qué relación hay entre $1+i$ y $1-i$: no son dos números
              cualesquiera.
          - texto: Sumar primero las dos bases y elevar el resultado a la décima
            mensaje: |
              Eso no vale nunca: $(a+b)^{n} \neq a^{n} + b^{n}$. Aquí daría
              $\left(\frac{2}{\sqrt2}\right)^{10} = 32$, que no tiene nada que
              ver con la respuesta.
          - texto: Las dos bases son opuestas, así que los dos términos se cancelan
            mensaje: |
              $1-i$ no es $-(1+i)$, que sería $-1-i$. Y aunque lo fuera, el
              exponente es **par**: $(-z)^{10} = z^{10}$, así que los términos
              se sumarían en vez de cancelarse.

      # ── COMP2 · el módulo de la base ─────────────────────────────────
      - tipo: calcular
        titulo: Módulo de la base
        pregunta: ¿Cuánto vale $\left|\dfrac{1+i}{\sqrt{2}}\right|$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1.41421356'
            mensaje: |
              Has calculado $|1+i| = \sqrt2$ y te has dejado el denominador. El
              módulo de un cociente es el cociente de los módulos:
              $\sqrt2/\sqrt2 = 1$.
          - valor: '0.70710678'
            mensaje: |
              Has dividido $\sqrt2$ entre 2 en lugar de entre $\sqrt2$. El
              denominador de la base es $\sqrt2$, no 2.
          - valor: '2'
            mensaje: |
              Eso es $|1+i|^{2} = a^{2}+b^{2}$, sin la raíz, y además sin
              dividir. Repasa las dos cosas.
        pista: |
          $\left|\dfrac{z}{w}\right| = \dfrac{|z|}{|w|}$, y $|1+i| = \sqrt{2}$.
        desarrollo: |
          $$
          \left|\frac{1+i}{\sqrt{2}}\right| = \frac{|1+i|}{\sqrt{2}}
            = \frac{\sqrt{1^{2}+1^{2}}}{\sqrt{2}} = \frac{\sqrt{2}}{\sqrt{2}} = 1
          $$
        veredicto: |
          Módulo 1: las dos bases están en la circunferencia unidad, así que
          elevarlas a la décima **no cambia su tamaño**, solo las gira. El
          resultado tendrá módulo 1 o será 0 si los giros se compensan.

      # ── COMP2 · la primera potencia ──────────────────────────────────
      - tipo: calcular
        titulo: La primera potencia
        pregunta: |
          Con $z = \dfrac{1+i}{\sqrt2} = e^{i\pi/4}$, ¿cuánto vale $z^{10}$ en
          forma binómica?
        respuesta:
          tipo: complejo
          valor: 'i'
          tolerancia: 0.02
          formato: forma binómica, tipo a+bi
        distractores:
          - valor: '-i'
            mensaje: |
              Signo cambiado. $10\cdot\frac{\pi}{4} = \frac{5\pi}{2}$, y al
              restar una vuelta entera queda $\frac{\pi}{2}$, no
              $-\frac{\pi}{2}$. Cuidado con restar $2\pi$ de más:
              $\frac{5\pi}{2} - 2\pi = \frac{\pi}{2}$, y ahí hay que parar.
          - valor: '32i'
            mensaje: |
              Has elevado $1+i$ y te has dejado el denominador:
              $(1+i)^{10} = 32i$, pero hay que dividir entre
              $(\sqrt2)^{10} = 32$. El módulo de la base era 1 justamente para
              que esto no pasara.
          - valor: '-1'
            mensaje: |
              Has reducido de más: $\frac{5\pi}{2}$ menos **dos** vueltas
              da $-\frac{3\pi}{2}$, y de ahí sale $i$, no $-1$. Un argumento de
              $\pi$ significaría que el afijo está en el semieje real negativo,
              y $\frac{5\pi}{2}$ no cae ahí.
          - valor: '1'
            mensaje: |
              Eso es lo que sale si reduces $\frac{5\pi}{2}$ a $0$, es decir, si
              te comes el cuarto de vuelta que sobra. $\frac{5\pi}{2}$ son dos
              vueltas **y cuarto**.
        pista: |
          $z^{10} = e^{i\,10\pi/4} = e^{i\,5\pi/2}$. Resta una vuelta completa
          y mira dónde cae.
        desarrollo: |
          $$
          z^{10} = \left(e^{i\pi/4}\right)^{10} = e^{i\frac{10\pi}{4}} = e^{i\frac{5\pi}{2}}
          $$

          Se reduce restando una vuelta completa:

          $$
          \frac{5\pi}{2} - 2\pi = \frac{5\pi}{2} - \frac{4\pi}{2} = \frac{\pi}{2}
          $$

          $$
          z^{10} = \cos\frac{\pi}{2} + i\,\sin\frac{\pi}{2} = i
          $$
        veredicto: |
          Comprobación por otra vía, que además es rápida: $(1+i)^{2} = 2i$, así
          que $(1+i)^{10} = (2i)^{5} = 32\,i^{5} = 32i$, y dividido entre
          $(\sqrt2)^{10} = 32$ queda $i$.

      # ── COMP4 · por qué la suma se anula ─────────────────────────────
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que justifica el valor de la suma. Una de las
          piezas llega al resultado correcto por el camino equivocado, y no debe
          entrar.
        piezas:
          - texto: |
              Las dos bases son conjugadas: $\dfrac{1-i}{\sqrt2}$ es la
              conjugada de $\dfrac{1+i}{\sqrt2}$, porque solo cambia el signo de
              la parte imaginaria.
          - texto: |
              Conjugar y elevar se pueden hacer en cualquier orden: la conjugada
              de $z^{n}$ es la potencia $n$-ésima de la conjugada de $z$.
          - texto: |
              Como las dos bases son opuestas, los dos términos se cancelan y la
              suma vale 0.
            trampa: true
            mensaje: |
              Llega al resultado correcto por el camino equivocado, que en COMP4
              vale cero puntos. Dos cosas fallan: $1-i$ no es $-(1+i)$ —eso
              sería $-1-i$—, y aunque lo fuera, el exponente es **par**, así que
              $(-z)^{10} = z^{10}$ y los términos se **sumarían**. Que el
              resultado coincida es casualidad, y en un examen se ve.
          - texto: |
              Por tanto la suma es $z^{10}$ más su conjugada, y eso vale
              $2\operatorname{Re}\left(z^{10}\right)$.
          - texto: |
              Como $z^{10} = i$ es imaginario puro, $\operatorname{Re}(z^{10}) = 0$
              y la suma vale 0.
        veredicto: |
          Un número más su conjugado siempre es real: es $2\operatorname{Re}$.
          Que aquí salga **cero** es lo que hay que justificar, y sale de que la
          potencia es imaginaria pura.

      # ── COMP2 · la suma ──────────────────────────────────────────────
      - tipo: calcular
        titulo: La suma
        pregunta: ¿Cuánto vale la suma completa?
        respuesta:
          tipo: complejo
          valor: '0'
          tolerancia: 0.02
          formato: forma binómica, tipo a+bi
        distractores:
          - valor: '2i'
            mensaje: |
              Has supuesto que el segundo término vale lo mismo que el primero.
              La segunda base es la **conjugada**, así que su décima potencia es
              $\overline{i} = -i$, y no $i$.
          - valor: '-2i'
            mensaje: |
              Mismo error que sumar dos veces $i$, pero con el signo contrario:
              has tomado los dos términos como $-i$. Uno es $i$ y el otro $-i$.
          - valor: '32'
            mensaje: |
              Eso sale de sumar primero las bases y elevar después:
              $\left(\frac{2}{\sqrt2}\right)^{10} = (\sqrt2)^{10} = 32$. Pero
              $(a+b)^{n} \neq a^{n}+b^{n}$.
        pista: |
          Ya tienes $z^{10} = i$. El otro término es su conjugado: escríbelo y
          suma.
        desarrollo: |
          $$
          \left(\frac{1+i}{\sqrt2}\right)^{10} + \left(\frac{1-i}{\sqrt2}\right)^{10}
            = i + (-i) = 0
          $$
        veredicto: |
          Gráficamente: los dos afijos son $i$ y $-i$, simétricos respecto del
          eje real. Su suma, por la regla del paralelogramo, cae en **el
          origen**. Eso es lo que hay que dibujar — no los sumandos.

