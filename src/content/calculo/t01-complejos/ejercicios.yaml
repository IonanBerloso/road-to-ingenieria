        consigna: |
          Dibuja las cuatro regiones, cada una en unos ejes independientes.
          Distingue con trazo discontinuo las fronteras que no pertenecen.
        comprueba:
          - punto: |
              En la (a), el segundo cuadrante **abierto**, con los dos ejes a
              trazos.
            porque: |
              Las desigualdades son estrictas, así que ni el eje imaginario
              positivo ni el real negativo entran. Y el origen tampoco: no tiene
              argumento.
          - punto: |
              En la (b), un sector de $60^\circ$ alrededor del semieje real
              positivo, entre las rectas $y=\pm\tfrac{x}{\sqrt3}$ con $x>0$.
            porque: |
              El valor absoluto abre a los dos lados, así que la apertura total
              es el doble del $\tfrac\pi6$ del enunciado.
          - punto: |
              En la (c), el semiplano superior **menos** el semidisco de diámetro
              $\left[1,2\right]$.
            porque: |
              Los dos bordes del intervalo de ángulos son el eje real —$\arg=0$—
              y la circunferencia de ese diámetro —$\arg=\tfrac\pi2$—. Y cuanto
              más lejos, menor el ángulo: por eso la región es la de fuera.
          - punto: |
              En la (d), la circunferencia **entera** de centro $2$ y radio $1$,
              sin los puntos $1$ y $3$.
            porque: |
              El $\pm$ admite las dos mitades. Dibujar solo media es el error que
              el signo está puesto para provocar.
        veredicto: |
          Las dos primeras son sectores con vértice en el origen; las dos
          últimas, arcos capaces sobre un segmento. Distinguir de qué tipo es
          cada una antes de dibujar es lo que evita el error más caro del
          ejercicio.

    resolucion: |
      **Las cuatro.**

      | ap. | región |
      |---|---|
      | (a) | segundo cuadrante abierto, sin los ejes |
      | (b) | sector abierto de $60^\circ$ alrededor del semieje real positivo |
      | (c) | semiplano $y>0$ menos el semidisco de diámetro $\left[1,2\right]$ |
      | (d) | circunferencia $\left(x-2\right)^{2}+y^{2}=1$, sin los puntos $1$ y $3$ |

      ### 1 · (a) y (b), sectores desde el origen

      $\arg z$ se mide desde el origen, así que una desigualdad sobre él
      recorta un **sector**.

      - **(a)** $\tfrac\pi2<\arg z<\pi$: el segundo cuadrante, con los dos ejes
        excluidos por ser desigualdades estrictas.
      - **(b)** $\lvert\arg z\rvert<\tfrac\pi6$: el sector entre
        $-30^\circ$ y $+30^\circ$, o sea entre las rectas
        $y=\pm\tfrac{x}{\sqrt3}$ con $x>0$. Apertura total $60^\circ$.

      En los dos casos el origen está excluido: $\arg 0$ no existe.

      ### 2 · (c) y (d), arcos capaces

      Aquí el ángulo se mide **en $z$**, y el lugar de los puntos que ven un
      segmento bajo un ángulo fijo es un arco de circunferencia que pasa por
      los dos extremos. Es el **arco capaz**.

      **(c)** El ángulo va de $0$ a $\tfrac\pi2$, así que la región está
      limitada por los dos arcos extremos:

      - $\arg=0$ es el eje real (fuera del segmento);
      - $\arg=\tfrac\pi2$ es la circunferencia de diámetro
        $\left[1,2\right]$, o sea $\left(x-\tfrac32\right)^{2}+y^{2}=\tfrac14$.

      Y el signo positivo selecciona el semiplano superior. Resultado:

      $$
      y>0
      \qquad\text{y}\qquad
      \left(x-\frac32\right)^{2}+y^{2} > \frac14
      $$

      Cuanto más lejos del segmento, menor es el ángulo bajo el que se ve: por
      eso la región es lo de **fuera** del semidisco, no lo de dentro.

      **(d)** Ángulo recto en los dos sentidos:

      $$
      \left(x-2\right)^{2}+y^{2}=1
      $$

      la circunferencia de diámetro $\left[1,3\right]$, **entera**, quitando
      los extremos $z=1$ —donde el denominador se anula— y $z=3$ —donde el
      numerador se anula y el argumento no está definido.

      ### 3 · Cómo comprobarlo en tres segundos

      Toma un punto de la región y calcula. En (c), con $z=3+\tfrac{i}{2}$:

      $$
      \frac{z-2}{z-1} = \frac{1+\tfrac{i}{2}}{2+\tfrac{i}{2}}
      \;\Longrightarrow\;
      \arg \approx 12{,}5^\circ \in \left(0,90^\circ\right) \;\checkmark
      $$

      Y con $z=\tfrac32+\tfrac{2i}{5}$, que está **dentro** del semidisco, sale
      $102{,}7^\circ$: fuera del intervalo, como tenía que ser.

      **Lo que hay que llevarse.** $\arg z$ da sectores con vértice en el
      origen; $\arg\tfrac{z-a}{z-b}$ da arcos capaces sobre el segmento $ab$.
      Y en los dos casos las desigualdades estrictas dejan fuera las fronteras,
      que hay que dibujar a trazos.

  - id: entre-dos-elipses-confocales
    titulo: La corona entre dos elipses que comparten focos
    fuente: Ejercicio 6 · Problemas, tema 1 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular y representar gráficamente los afijos de los números complejos
      $z$ que verifican la condición siguiente:

      $$
      8 < \lvert z_1-z\rvert + \lvert z-z_2\rvert \le 12
      \qquad
      z_1 = 3i,\quad z_2 = -3i
      $$
    pide: La región del plano.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué las dos elipses tienen la misma forma «alargada» hacia
          arriba?
        opciones:
          - texto: >-
              Porque comparten los focos $\pm3i$, que están en el eje
              imaginario: el eje mayor es vertical en las dos
            correcta: true
            mensaje: |
              Eso es. Se llaman **confocales**. La posición de los focos fija la
              orientación; lo que cambia con la suma es cuánto se estira.
          - texto: >-
              Porque las dos tienen el mismo centro
            mensaje: |
              El centro común —el origen— explica que estén concéntricas, pero
              no que el eje mayor sea vertical. Eso lo deciden los focos.
          - texto: >-
              Porque $8$ y $12$ son múltiplos de $4$
            mensaje: |
              Los valores de la suma fijan los semiejes mayores, $4$ y $6$,
              pero la orientación la marcan los focos.

      - tipo: verificar
        pregunta: |
          Escribe en $x$ e $y$ la región. Necesitarás dos condiciones unidas
          por `&`. La figura comprobará si coincide con la del enunciado.
        condicion: '8 < |z-3i| + |z+3i| <= 12'
        ventana:
          x: [-6, 6]
          y: [-7, 7]
        formato: dos condiciones en x e y, unidas por &
        pista: |
          Cada valor de la suma da una elipse con $c=3$: de $2a=8$ sale
          $a=4$ y $b^{2}=16-9=7$; de $2a=12$, $a=6$ y $b^{2}=36-9=27$.
        desarrollo: |
          La suma de distancias a $3i$ y $-3i$ igual a $2a$ es una elipse con
          $c=3$ y $b^{2}=a^{2}-9$:

          | suma | $a$ | $b^{2}$ | ecuación |
          |---|---|---|---|
          | $8$ | $4$ | $7$ | $\tfrac{x^{2}}{7}+\tfrac{y^{2}}{16}=1$ |
          | $12$ | $6$ | $27$ | $\tfrac{x^{2}}{27}+\tfrac{y^{2}}{36}=1$ |

          Y la región es

          $$
          \frac{x^{2}}{7}+\frac{y^{2}}{16} > 1
          \qquad\text{y}\qquad
          \frac{x^{2}}{27}+\frac{y^{2}}{36} \le 1
          $$

      - tipo: calcular
        titulo: El semieje menor de la elipse interior
        pregunta: |
          ¿Cuánto vale el semieje menor de la elipse $\lvert z-3i\rvert +
          \lvert z+3i\rvert = 8$?
        respuesta:
          tipo: numero
          valor: '2.645751'
          tolerancia: 0.002
          formato: con seis decimales
        distractores:
          - valor: '4'
            mensaje: |
              $4$ es el semieje **mayor**, que sale de $2a=8$. El menor es
              $b=\sqrt{a^{2}-c^{2}}$.
          - valor: '5.196152'
            mensaje: |
              $3\sqrt3$ es el semieje menor de la elipse **exterior**, la de
              suma $12$.
        pista: |
          $b=\sqrt{a^{2}-c^{2}}$ con $a=4$ y $c=3$.
        desarrollo: |
          $$
          b = \sqrt{16-9} = \sqrt7 \approx 2{,}645751
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Suma de distancias a dos puntos fijos constante: elipse de focos
              esos dos puntos.
          - texto: >-
              Los focos son $\pm3i$, luego $c=3$ y el eje mayor es vertical.
          - texto: >-
              De $2a=8$ sale la elipse interior y de $2a=12$ la exterior; la
              región es la corona entre ambas.
          - texto: >-
              La desigualdad estricta en $8$ excluye la elipse interior, y la
              desigualdad estricta en $12$ excluye la exterior.
            trampa: true
            mensaje: |
              La segunda desigualdad **no** es estricta: es
              $\le12$, así que la elipse exterior **sí** pertenece a la región.
              Se dibuja con trazo continuo, y la interior a trazos. Ese detalle
              es exactamente lo que un corrector mira en este ejercicio.
        veredicto: |
          El borde interior está excluido y el exterior incluido, y eso hay que
          dibujarlo: trazo discontinuo dentro, continuo fuera. Confundirlos es
          responder a otra pregunta.
      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 340 265" role="img" width="340" height="265"
               aria-labelledby="f-dos-elipses-t f-dos-elipses-d">
            <title id="f-dos-elipses-t">La corona entre las dos elipses de focos más y menos tres i</title>
            <desc id="f-dos-elipses-d">Dos elipses con el mismo par de focos, más y menos tres i, y el eje mayor vertical. La interior, a trazos, corta los ejes en más menos dos coma sesenta y cinco y en más menos cuatro. La exterior, en trazo continuo, en más menos cinco coma veinte y en más menos seis. Entre las dos queda sombreada la corona.</desc>
