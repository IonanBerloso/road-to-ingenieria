        consigna: |
          Dibuja las dos elipses en el mismo plano y sombrea la corona entre
          ellas. Marca los cortes de cada una con los dos ejes.
        comprueba:
          - punto: |
              Las dos elipses con el eje mayor **vertical** y los focos $\pm3i$
              marcados.
            porque: |
              Comparten focos: son confocales. Los focos en el eje imaginario son
              lo que orienta las dos, y dibujarlos demuestra que se ha visto.
          - punto: |
              La interior cortando los ejes en $\pm\sqrt7\approx\pm2{,}65$ y
              $\pm4$; la exterior en $\pm3\sqrt3\approx\pm5{,}20$ y $\pm6$.
            porque: |
              Son los cuatro números que hacen falta para dibujarlas a escala. Y
              comprueban que $b^{2}=a^{2}-9$ en las dos.
          - punto: |
              La elipse interior a **trazos** y la exterior en trazo
              **continuo**.
            porque: |
              La desigualdad es $8<\ldots\le12$: el borde interior no entra y el
              exterior sí. Es el detalle que más se cobra en este ejercicio.
          - punto: |
              Sombreada solo la corona entre las dos.
            porque: |
              Ni el agujero central ni el exterior pertenecen. Probar el origen
              —suma $6$, que no es mayor que $8$— confirma que el centro queda
              fuera.
        veredicto: |
          Un punto de control: $z=5i$ da $2+8=10$, que está en
          $\left(8,12\right]$ ✔. Con un punto dentro y otro fuera, el sombreado
          queda justificado sin más discusión.

    resolucion: |
      **Resultado.** La corona comprendida entre las elipses

      $$
      \frac{x^{2}}{7}+\frac{y^{2}}{16} = 1
      \qquad\text{(excluida)}
      $$

      $$
      \frac{x^{2}}{27}+\frac{y^{2}}{36} = 1
      \qquad\text{(incluida)}
      $$

      ### 1 · Por qué son elipses

      $\lvert z-3i\rvert$ es la distancia de $z$ al punto $3i$, y
      $\lvert z+3i\rvert$ la distancia a $-3i$. Que su suma valga una constante
      $2a$ es **la definición de elipse** con focos $\pm3i$.

      ### 2 · Los dos bordes

      Con $c=3$ y $b^{2}=a^{2}-c^{2}$:

      | suma | $a$ | $b$ | ecuación |
      |---|---|---|---|
      | $8$ | $4$ | $\sqrt7\approx2{,}646$ | $\tfrac{x^{2}}{7}+\tfrac{y^{2}}{16}=1$ |
      | $12$ | $6$ | $3\sqrt3\approx5{,}196$ | $\tfrac{x^{2}}{27}+\tfrac{y^{2}}{36}=1$ |

      Las dos tienen el eje mayor **vertical**, porque sus focos están en el
      eje imaginario.

      ### 3 · El dibujo

      Dos elipses concéntricas y confocales, la región sombreada entre ellas.
      La interior a **trazos** —$>8$ la excluye— y la exterior **continua**
      —$\le12$ la incluye—.

      Los cortes con los ejes ayudan a dibujarlas bien:

      | | interior | exterior |
      |---|---|---|
      | eje $x$ | $\pm\sqrt7\approx\pm2{,}65$ | $\pm3\sqrt3\approx\pm5{,}20$ |
      | eje $y$ | $\pm4$ | $\pm6$ |

      ### 4 · La comprobación de siempre

      Un punto de la región, por ejemplo $z=5i$:

      $$
      \lvert 5i-3i\rvert + \lvert 5i+3i\rvert = 2+8 = 10
      \in \left(8,12\right] \;\checkmark
      $$

      Y uno de fuera, $z=0$: $3+3=6\le8$, no pertenece ✓

      **Lo que hay que llevarse.** Dos elipses confocales acotan una corona, y
      lo que distingue una respuesta buena de una a medias es dibujar bien qué
      borde entra y qué borde no. Aquí entra el de fuera.

  - id: media-elipse-cortada-por-el-eje
    titulo: Media elipse, y dónde exactamente la corta el eje
    fuente: Ejercicio 7 · Problemas, tema 1 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular y representar gráficamente los afijos de los números complejos
      $z$ que verifican las condiciones siguientes:

      $$
      \begin{cases}
      \lvert z-1-i\rvert + \lvert z-1+i\rvert = 6\\[4pt]
      \operatorname{Re}(z) \ge 0
      \end{cases}
      $$
    pide: El arco de elipse y sus cortes con el eje imaginario.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los focos son $1+i$ y $1-i$. ¿Dónde está el centro y hacia dónde va
          el eje mayor?
        opciones:
          - texto: >-
              Centro en $\left(1,0\right)$, el punto medio, y eje mayor
              **vertical**
            correcta: true
            mensaje: |
              Eso es. El centro de una elipse es siempre el punto medio de los
              focos, y el eje mayor va en la dirección que los une — aquí la
              vertical, porque solo se diferencian en la parte imaginaria.
          - texto: >-
              Centro en el origen y eje mayor horizontal
            mensaje: |
              El centro es el punto medio de $1+i$ y $1-i$, que es $1$, no $0$.
              Y los focos se alinean en vertical.
          - texto: >-
              Centro en $\left(1,0\right)$ y eje mayor horizontal
            mensaje: |
              El centro sí, pero la dirección no: los focos difieren en $y$, así
              que el eje mayor es vertical.

      - tipo: verificar
        pregunta: |
          Escribe en $x$ e $y$ las dos condiciones, unidas por `&`. La figura
          comprobará si tu curva coincide con la del enunciado.
        condicion: '|z-1-i| + |z-1+i| = 6 & Re(z) >= 0'
        ventana:
          x: [-2.5, 4.5]
          y: [-3.5, 3.5]
        formato: dos condiciones en x e y, unidas por &
        pista: |
          De $2a=6$ sale $a=3$, y la semidistancia focal es $c=1$, así que
          $b^{2}=9-1=8$. La elipse está centrada en $\left(1,0\right)$ con el
          eje mayor vertical.
        desarrollo: |
          $$
          \frac{\left(x-1\right)^{2}}{8} + \frac{y^{2}}{9} = 1
          \qquad\text{y}\qquad
          x \ge 0
          $$

          La elipse completa va de $x=1-2\sqrt2\approx-1{,}83$ a
          $x=1+2\sqrt2\approx3{,}83$; la condición $x\ge0$ se queda con el
          **arco derecho**, que es la mayor parte de ella.

      - tipo: calcular
        titulo: El corte con el eje imaginario
        pregunta: |
          ¿En qué valor de $y>0$ corta la elipse al eje imaginario?
        respuesta:
          tipo: numero
          valor: '2.806243'
          tolerancia: 0.002
          formato: con seis decimales
        distractores:
          - valor: '3'
            mensaje: |
              $3$ es el semieje mayor, que se alcanza en $x=1$ —el centro—, no
              en $x=0$. En $x=0$ la elipse ya ha bajado un poco.
          - valor: '2.828427'
            mensaje: |
              $2\sqrt2$ es el **semieje menor**, que va en horizontal. El corte
              con $x=0$ es $\sqrt{\tfrac{63}{8}}$.
        pista: |
          Con $x=0$: $\tfrac18+\tfrac{y^{2}}{9}=1$, luego
          $y^{2}=\tfrac{63}{8}$.
        desarrollo: |
          $$
          \frac{1}{8}+\frac{y^{2}}{9} = 1
          \;\Longrightarrow\;
          y^{2} = 9\cdot\frac78 = \frac{63}{8}
          \;\Longrightarrow\;
          y = \sqrt{\frac{63}{8}} \approx 2{,}806243
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              De $2a=6$ sale $a=3$; la distancia entre focos es $2$, luego
              $c=1$ y $b^{2}=a^{2}-c^{2}=8$.
          - texto: >-
              Centrada en $\left(1,0\right)$ y con eje mayor vertical, la
              ecuación es
              $\tfrac{\left(x-1\right)^{2}}{8}+\tfrac{y^{2}}{9}=1$.
          - texto: >-
              La condición $\operatorname{Re}z\ge0$ recorta el trozo de elipse
              con $x\ge0$, que va de $\left(0,-2{,}806\right)$ a
              $\left(0,2{,}806\right)$ pasando por la derecha.
          - texto: >-
              Y como el recorte quita el trozo con $x<0$, la respuesta es media
              elipse.
            trampa: true
            mensaje: |
              No es la mitad: la elipse está **desplazada** a la derecha, con
              centro en $x=1$, así que el eje imaginario la corta lejos del
              centro y el arco que queda es bastante **más** de la mitad.
              Decir «media elipse» es cómodo pero falso.
        veredicto: |
          Tres números y la elipse está: $a$ de la suma, $c$ de la mitad de la
          distancia focal, y $b$ de la relación pitagórica. El recorte se aplica
          después, y conviene calcular los cortes exactos en vez de estimarlos.
      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 340 265" role="img" width="340" height="265"
               aria-labelledby="f-media-elipse-t f-media-elipse-d">
