        consigna: |
          Dibuja la elipse, la bisectriz que la atraviesa y sombrea la mitad que
          cumple la condición. Marca los dos cortes.
        comprueba:
          - punto: |
              La elipse centrada en el origen, con el eje mayor **vertical** y
              los focos $\pm i$ marcados.
            porque: |
              Los focos están en el eje imaginario, así que el semieje mayor es
              el vertical, $\tfrac52$. El menor es
              $\tfrac{\sqrt{21}}{2}\approx2{,}29$: los dos son parecidos, y la
              elipse es casi circular.
          - punto: |
              El borde en trazo **continuo** y el interior incluido.
            porque: |
              La desigualdad es $\le$, así que la elipse entera pertenece a la
              región.
          - punto: |
              La recta $y=x$ pasando **por el centro**, y sombreado lo que queda
              por encima.
            porque: |
              $\operatorname{Im}z\ge\operatorname{Re}z$ es $y\ge x$. Y que la
              recta pase por el centro es lo que garantiza que parte la elipse en
              dos mitades de igual área.
          - punto: |
              Los cortes de la recta con la elipse, en
              $\left(\pm1{,}625;\,\pm1{,}625\right)$.
            porque: |
              Son los dos vértices de la región, y sin ellos no se sabe dónde
              empieza y acaba el trozo de borde curvo.
        veredicto: |
          Cualquier recta que pase por el centro de una elipse la divide en dos
          partes de igual área, por simetría central. Ese argumento de una línea
          contesta sin integrar cuánto mide la región.

    resolucion: |
      **Resultado.** La mitad del disco elíptico

      $$
      \frac{x^{2}}{\tfrac{21}{4}} + \frac{y^{2}}{\tfrac{25}{4}} \le 1
      $$

      que queda por encima de la recta $y=x$, bordes incluidos.

      ### 1 · La elipse

      | dato | valor |
      |---|---|
      | focos | $\pm i$, luego $c=1$ |
      | $2a$ | $5$, luego $a=\tfrac52$ |
      | $b$ | $\sqrt{\tfrac{25}{4}-1}=\tfrac{\sqrt{21}}{2}\approx2{,}291$ |
      | centro | el origen |
      | eje mayor | vertical |

      $$
      \frac{4x^{2}}{21} + \frac{4y^{2}}{25} \le 1
      $$

      Como la desigualdad es $\le$, entra todo el interior **y** el borde.

      ### 2 · El corte

      $y\ge x$ es el semiplano por encima de la bisectriz del primer y tercer
      cuadrantes. Esa recta **pasa por el centro** de la elipse, así que la
      divide en dos mitades de igual área.

      Los puntos donde la recta corta a la elipse:

      $$
      \frac{4x^{2}}{21}+\frac{4x^{2}}{25} = 1
      \;\Longrightarrow\;
      x^{2}\left(\frac{4}{21}+\frac{4}{25}\right) = 1
      \;\Longrightarrow\;
      x = \pm 1{,}625
      $$

      o sea $\left(1{,}625,\,1{,}625\right)$ y
      $\left(-1{,}625,\,-1{,}625\right)$.

      ### 3 · El dibujo

      La elipse vertical de semiejes $2{,}29$ y $2{,}5$, la recta $y=x$
      atravesándola por el centro, y sombreada la parte de arriba-izquierda.
      Todo el borde en trazo continuo, porque las dos condiciones son no
      estrictas.

      ### 4 · Comprobación

      El punto $z=2i$, que está en la región:

      $$
      \lvert 2i-i\rvert + \lvert 2i+i\rvert = 1+3 = 4 \le 5 \;\checkmark
      \qquad
      \operatorname{Im}=2 \ge \operatorname{Re}=0 \;\checkmark
      $$

      **Lo que hay que llevarse.** Una elipse y un semiplano se combinan sin
      dificultad: se dibuja cada uno y se toma la intersección. Y cuando la
      recta pasa por el centro, la simetría central garantiza que se parte por
      la mitad — un argumento de una línea que evita cualquier cuenta de áreas.

  - id: i-elevado-a-uno-mas-i
    titulo: i elevado a 1+i, y una mediatriz que resulta ser el eje real
    fuente: Ejercicio 10 · Problemas, tema 1 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Obtener el valor principal del número complejo $z=i^{\,1+i}$. Calcular y
      representar gráficamente el lugar geométrico de los afijos de los números
      complejos $w$ que verifican la condición siguiente:

      $$
      \left\lvert\frac{w-z}{w-\overline{z}}\right\rvert = 1
      $$
    pide: El valor principal de $z$ y el lugar geométrico de $w$.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué quiere decir «valor principal» en $i^{\,1+i}$?
        opciones:
          - texto: >-
              Que en $e^{\left(1+i\right)\operatorname{Log}i}$ se toma el
              logaritmo con argumento en $\left(-\pi,\pi\right]$, o sea
              $\tfrac{i\pi}{2}$
            correcta: true
            mensaje: |
              Eso es. La potencia compleja es multivaluada porque el logaritmo
              lo es; fijar la rama principal del logaritmo selecciona un solo
              valor de la potencia.
          - texto: >-
              Que se toma el valor real
            mensaje: |
              No tiene por qué haber ninguno real. De hecho aquí el valor
              principal es imaginario puro.
          - texto: >-
              Que se toma el de módulo más pequeño
            mensaje: |
              Los distintos valores se diferencian en factores
              $e^{-2k\pi}$, así que el de módulo mínimo no existe: hay
              infinitos y decrecen sin parar. La rama principal es la del
              argumento en $\left(-\pi,\pi\right]$.

      - tipo: calcular
        titulo: El módulo del valor principal
        pregunta: |
          ¿Cuánto vale $\left\lvert i^{\,1+i}\right\rvert$ en su valor
          principal?
        respuesta:
          tipo: numero
          valor: '0.207880'
          tolerancia: 0.0004
          formato: con seis decimales
        distractores:
          - valor: '4.810477'
            mensaje: |
              $e^{\pi/2}$ es el inverso: el signo del exponente. De
              $\left(1+i\right)\tfrac{i\pi}{2}$ sale $i^{2}\tfrac\pi2
              = -\tfrac\pi2$, negativo.
          - valor: '1'
            mensaje: |
              El módulo sería $1$ si el exponente fuese real, porque
              $\lvert i\rvert=1$. La parte imaginaria del exponente es
              justamente la que cambia el módulo.
        pista: |
          $e^{-\pi/2}$, y $\tfrac\pi2\approx1{,}5708$.
        desarrollo: |
          $$
          i^{\,1+i} = e^{\left(1+i\right)\operatorname{Log}i}
          = e^{\left(1+i\right)\frac{i\pi}{2}}
          = e^{\frac{i\pi}{2}-\frac{\pi}{2}}
          = e^{-\pi/2}\,e^{i\pi/2}
          = e^{-\pi/2}\,i
          $$

          $$
          \left\lvert z\right\rvert = e^{-\pi/2} \approx 0{,}207880
          $$

      - tipo: verificar
        pregunta: |
          Escribe en $x$ e $y$ el lugar geométrico de los $w$. La figura
          comprobará si coincide con el del enunciado.
        condicion: '|z - exp(-pi/2) i| = |z + exp(-pi/2) i|'
        ventana:
          x: [-2, 2]
          y: [-1, 1]
        formato: una ecuacion en x e y
        pista: |
          $\left\lvert\tfrac{w-z}{w-\overline{z}}\right\rvert=1$ es lo mismo que
          $\lvert w-z\rvert = \lvert w-\overline{z}\rvert$: los $w$ que equidistan
          de $z$ y de su conjugado.
        desarrollo: |
          $z$ y $\overline{z}$ son simétricos respecto del eje real, así que la
          mediatriz del segmento que los une **es** el eje real:

          $$
          y = 0
          $$

          Y hay que excluir $w=\overline{z}$, donde el cociente no está definido —
          aunque ese punto no está en el eje real, así que en la práctica no
          quita nada.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              $z^{w}$ se define como $e^{w\operatorname{Log}z}$, y el valor
              principal usa $\operatorname{Log}i=\tfrac{i\pi}{2}$.
          - texto: >-
              Sale $z=e^{-\pi/2}i$, imaginario puro, de módulo
              $0{,}2079$.
          - texto: >-
              Módulo del cociente igual a $1$ significa numerador y denominador
              con el mismo módulo: $\lvert w-z\rvert=\lvert w-\overline{z}\rvert$.
          - texto: >-
              Y como $z$ es imaginario puro, la mediatriz de $z$ y $\overline{z}$ es
              el eje imaginario.
            trampa: true
            mensaje: |
              Es el eje **real**. $z$ y $\overline{z}$ están uno encima y otro debajo
              del eje real, así que la recta que equidista de los dos es
              horizontal. La mediatriz es perpendicular al segmento que une los
              puntos, y ese segmento es vertical.
        veredicto: |
          Un cociente de módulo $1$ es siempre una **mediatriz**, y para
          escribirla no hace falta el valor de $z$: basta saber que $z$ y
          $\overline{z}$ son simétricos respecto del eje real. El cálculo del valor
          principal es independiente del lugar geométrico.
      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 340 190" role="img" width="340" height="190"
               aria-labelledby="f-i-elevado-t f-i-elevado-d">
            <title id="f-i-elevado-t">El valor principal, su conjugado, y el eje real entero como lugar geométrico</title>
            <desc id="f-i-elevado-d">Dos puntos simétricos sobre el eje imaginario, a altura más y menos cero coma dos uno: el valor principal y su conjugado. El lugar de los w es el eje real completo, dibujado en trazo grueso. El conjugado lleva círculo hueco porque queda excluido.</desc>
            <style>
