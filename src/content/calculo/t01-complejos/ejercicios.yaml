ejercicios:
  - id: ej-disco-y-borde
    titulo: Un disco, y decidir si el borde entra
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Representar los afijos de los números complejos $z$ que verifican
      $$
      \left|z - (1+2i)\right| \le 3
      $$
    pide: Qué figura es, dónde está su centro, cuánto mide su radio y si el borde entra.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dice $\left|z - (1+2i)\right|$, leído en castellano?
        opciones:
          - texto: La distancia de $z$ al punto $1+2i$
            correcta: true
            mensaje: |
              Eso es, y es la traducción que resuelve casi todos los ejercicios
              de este tipo. Un módulo de una diferencia **siempre** es una
              distancia entre los dos puntos.
          - texto: El valor de $z$ menos el valor de $1+2i$
            mensaje: |
              Eso sería sin las barras. El módulo convierte esa diferencia —que
              es un complejo— en un número real positivo: su tamaño, que
              geométricamente es la distancia entre los dos afijos.
          - texto: La suma de las partes real e imaginaria de $z$
            mensaje: |
              Eso es $\operatorname{Re}(z)+\operatorname{Im}(z)$, otra cosa. El
              módulo no suma las partes: las combina con Pitágoras.
      - tipo: calcular
        titulo: El radio
        pregunta: |
          Si la condición fuera con un igual, $\left|z-(1+2i)\right| = 3$,
          sería una circunferencia. ¿Cuánto mide su radio?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '9'
            mensaje: |
              9 sería el radio al cuadrado. Aquí no hace falta elevar nada: el
              módulo ya es la distancia, y la distancia es el radio.
          - valor: '1.7320508'
            mensaje: |
              Has sacado la raíz de 3. El 3 del enunciado ya es la distancia
              directamente, no su cuadrado.
        pista: |
          «La distancia al centro vale 3» es la definición misma de
          circunferencia de radio 3. No hay que calcular nada.
        desarrollo: |
          La condición dice que la distancia de $z$ al punto $1+2i$ vale
          exactamente 3. El conjunto de puntos que están a distancia fija de
          otro es, por definición, una circunferencia:

          $$
          \text{centro } (1,2), \qquad \text{radio } 3
          $$
      - tipo: calcular
        titulo: Un punto de prueba
        pregunta: |
          Comprueba tu región con un punto. ¿Cuánto vale
          $\left|z-(1+2i)\right|$ para $z = 1+2i$, o sea el propio centro?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              3 es el radio, la distancia al borde. El centro está a distancia
              cero de sí mismo, y por eso pertenece al disco.
          - valor: '1'
            mensaje: |
              Parece que has cogido solo la parte real. Estamos restando el
              punto de sí mismo: da cero exacto, sin partes.
        pista: |
          Sustituye $z$ por el propio centro y resta. ¿Cuánto mide el módulo de
          cero?
        desarrollo: |
          $$
          \left|(1+2i)-(1+2i)\right| = \left|0\right| = 0 \le 3
          $$

          El centro cumple la condición, así que la región es el **interior**,
          no el exterior. Esa comprobación con un punto cuesta cinco segundos y
          es la que evita dibujar la región contraria.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza no debe entrar.
        piezas:
          - texto: $\left|z-(1+2i)\right|$ es la distancia de $z$ al punto $(1,2)$.
          - texto: La condición pide que esa distancia no pase de 3.
          - texto: Es el disco de centro $(1,2)$ y radio 3.
          - texto: Como la desigualdad es $\le$, el borde entra y se dibuja continuo.
          - texto: Al ser una desigualdad, la figura no puede incluir la circunferencia.
            trampa: true
            mensaje: |
              Depende del signo, y ese es justo el detalle que se puntúa. Con
              $<$ el borde queda fuera y se dibuja discontinuo; con $\le$
              entra y va continuo. Aquí es $\le$.
      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 340 265" role="img" width="340" height="265"
               aria-labelledby="f-disco-borde-t f-disco-borde-d">
            <title id="f-disco-borde-t">El disco de centro 1+2i y radio 3</title>
            <desc id="f-disco-borde-d">Un disco relleno centrado en el punto (1,2), con el borde en trazo continuo porque la desigualdad no es estricta. Llega de x igual a menos dos hasta x igual a cuatro, y de y igual a menos uno hasta y igual a cinco. El origen queda dentro.</desc>
