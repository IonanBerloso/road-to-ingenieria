          </svg>
        consigna: |
          Dibuja la elipse completa a trazos y, encima, en trazo grueso, el arco
          que cumple $\operatorname{Re}z\ge0$. Marca los dos cortes con el eje
          imaginario.
        comprueba:
          - punto: |
              La elipse centrada en $\left(1,0\right)$, con el eje mayor
              **vertical** y los focos $1\pm i$ marcados.
            porque: |
              El centro es el punto medio de los focos, no el origen. Es el error
              que descoloca todo el dibujo.
          - punto: |
              Semiejes $3$ en vertical y $2\sqrt2\approx2{,}83$ en horizontal,
              así que la elipse va de $x=-1{,}83$ a $x=3{,}83$.
            porque: |
              De $2a=6$ y $c=1$ sale $b=\sqrt8$. Esos extremos son los que
              enseñan que la elipse **sí** cruza el eje imaginario.
          - punto: |
              Los cortes con $x=0$ en
              $y=\pm\sqrt{\tfrac{63}{8}}\approx\pm2{,}81$, marcados.
            porque: |
              Son los extremos del arco que se conserva, y el enunciado los pide.
              Estimarlos a ojo es lo que distingue una respuesta de otra.
          - punto: |
              El arco conservado, que es **más** de la mitad de la elipse.
            porque: |
              El centro está desplazado a la derecha, así que el eje imaginario
              la corta lejos del centro. Dibujar exactamente media elipse es
              responder a un enunciado distinto.
        veredicto: |
          El arco que queda abarca unos $222^\circ$ de los $360^\circ$
          paramétricos: algo más del $60\,\%$. Que no sea la mitad es justo lo
          que el dibujo tiene que enseñar.

    resolucion: |
      **Resultado.** El arco de la elipse

      $$
      \frac{\left(x-1\right)^{2}}{8} + \frac{y^{2}}{9} = 1
      $$

      con $x\ge0$, que va desde $\left(0,-\sqrt{\tfrac{63}{8}}\right)$ hasta
      $\left(0,+\sqrt{\tfrac{63}{8}}\right)$ pasando por la derecha.

      ### 1 · Los tres números de la elipse

      | dato | de dónde sale | valor |
      |---|---|---|
      | $a$ | $2a=6$ | $3$ |
      | $c$ | mitad de $\lvert\left(1+i\right)-\left(1-i\right)\rvert=2$ | $1$ |
      | $b$ | $\sqrt{a^{2}-c^{2}}$ | $2\sqrt2\approx2{,}828$ |

      Centro: el punto medio de los focos, $\left(1,0\right)$. Eje mayor:
      vertical, porque los focos difieren en la parte imaginaria.

      $$
      \frac{\left(x-1\right)^{2}}{8} + \frac{y^{2}}{9} = 1
      $$

      ### 2 · El recorte

      La elipse ocupa $x\in\left[1-2\sqrt2,\,1+2\sqrt2\right]
      = \left[-1{,}83,\,3{,}83\right]$. La condición $x\ge0$ elimina el trozo
      más a la izquierda, y el corte se produce en

      $$
      \frac{1}{8}+\frac{y^{2}}{9}=1
      \;\Longrightarrow\;
      y = \pm\sqrt{\frac{63}{8}} \approx \pm2{,}806
      $$

      ### 3 · Cuánto se recorta, exactamente

      No es la mitad. El centro está en $x=1$ y el corte en $x=0$, o sea a
      $\tfrac{1}{2\sqrt2}\approx0{,}354$ semiejes menores del centro. El arco
      eliminado abarca un ángulo paramétrico de unos $138^\circ$ de $360^\circ$,
      así que **queda algo más del 60 % de la elipse**.

      ### 4 · Comprobación

      El punto $\left(0,\,2{,}806243\right)$:

      $$
      \lvert z-1-i\rvert + \lvert z-1+i\rvert
      = \lvert -1+1{,}806i\rvert + \lvert -1+3{,}806i\rvert
      = 2{,}065 + 3{,}935 = 6 \;\checkmark
      $$

      **Lo que hay que llevarse.** Una elipse desplazada sigue siendo una
      elipse, pero «la mitad» deja de significar lo que parece. Cuando hay un
      recorte, hay que calcular los cortes: son la parte del dibujo que se
      puntúa.

  - id: las-raices-que-son-los-focos
    titulo: Dos raíces que después hacen de focos
    fuente: Ejercicio 8 · Problemas, tema 1 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Obtener las raíces $z_1$ y $z_2$ de la ecuación $z^{2}-3iz+4=0$.
      Calcular y representar gráficamente el lugar geométrico de los afijos de
      los números complejos $w$ que verifican la condición siguiente:

      $$
      \lvert w-z_1\rvert + \lvert w-z_2\rvert = 6
      $$
    pide: Las dos raíces y el lugar geométrico.
    pasos:
      - tipo: reconocer
        pregunta: |
          La ecuación $z^{2}-3iz+4=0$ tiene coeficientes complejos. ¿Sigue
          valiendo la fórmula de segundo grado?
        opciones:
          - texto: >-
              Sí, con la única precaución de que $\sqrt{\;}$ significa
              cualquiera de las dos raíces complejas del discriminante
            correcta: true
            mensaje: |
              Eso es. La deducción de la fórmula solo usa que se puede
              completar el cuadrado, y eso vale en cualquier cuerpo. Aquí el
              discriminante sale $-25$, cuyas raíces son $\pm5i$.
          - texto: >-
              No: con coeficientes complejos hay que separar en parte real e
              imaginaria
            mensaje: |
              Se puede hacer así, pero es mucho más largo. La fórmula funciona
              tal cual.
          - texto: >-
              Sí, pero solo si el discriminante sale real
            mensaje: |
              No hace falta: todo número complejo tiene dos raíces cuadradas, y
              la fórmula las admite igual.

      - tipo: calcular
        titulo: La raíz de módulo mayor
        pregunta: |
          Las dos raíces son imaginarias puras. ¿Cuál es la parte imaginaria de
          la mayor?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.02
          formato: un número entero
        distractores:
          - valor: '-1'
            mensaje: |
              $-1$ es la parte imaginaria de la **otra** raíz, $z_2=-i$. La
              pregunta es por la de módulo mayor.
          - valor: '3'
            mensaje: |
              $3$ es la suma de las dos raíces dividida por $i$: en efecto
              $4i+\left(-i\right)=3i$. Pero ninguna de las dos vale $3i$.
        pista: |
          $z=\dfrac{3i\pm\sqrt{-9-16}}{2}$, y $\sqrt{-25}=\pm5i$.
        desarrollo: |
          $$
          z = \frac{3i\pm\sqrt{\left(-3i\right)^{2}-16}}{2}
          = \frac{3i\pm\sqrt{-25}}{2}
          = \frac{3i\pm5i}{2}
          $$

          $$
          z_1 = 4i, \qquad z_2 = -i
          $$

          Comprobación con Cardano-Vieta: la suma vale $3i$ ✓ y el producto
          $4i\cdot\left(-i\right)=4$ ✓.

      - tipo: verificar
        pregunta: |
          Escribe en $x$ e $y$ el lugar geométrico de los $w$. La figura
          comprobará si coincide con el del enunciado.
        condicion: '|z-4i| + |z+i| = 6'
        ventana:
          x: [-3, 3]
          y: [-2.5, 5.5]
        formato: una ecuacion en x e y; usa ^2 para los cuadrados
        pista: |
          Los focos son $4i$ y $-i$, así que el centro es
          $\tfrac{4i-i}{2}=\tfrac{3i}{2}$ y la semidistancia focal
          $c=\tfrac52$. Con $2a=6$, $b^{2}=9-\tfrac{25}{4}$.
        desarrollo: |
          $$
          \frac{x^{2}}{\tfrac{11}{4}}
          + \frac{\left(y-\tfrac32\right)^{2}}{9} = 1
          $$

          Elipse de centro $\left(0,\tfrac32\right)$, semieje mayor $3$
          vertical y semieje menor $\tfrac{\sqrt{11}}{2}\approx1{,}658$.

      - tipo: calcular
        titulo: El semieje menor
        pregunta: |
          ¿Cuánto vale el semieje menor de esa elipse?
        respuesta:
          tipo: numero
          valor: '1.658312'
          tolerancia: 0.002
          formato: con seis decimales
        distractores:
          - valor: '3.316625'
            mensaje: |
              $\sqrt{11}$ es el doble. $b^{2}=9-\tfrac{25}{4}=\tfrac{11}{4}$,
              así que $b=\tfrac{\sqrt{11}}{2}$.
          - valor: '2.5'
            mensaje: |
              $\tfrac52$ es la semidistancia focal $c$, no el semieje menor.
              $b$ sale de $\sqrt{a^{2}-c^{2}}$.
        pista: |
          $b=\sqrt{9-\tfrac{25}{4}} = \tfrac{\sqrt{11}}{2}$.
        desarrollo: |
          $$
          b = \sqrt{9-\frac{25}{4}} = \sqrt{\frac{11}{4}}
          = \frac{\sqrt{11}}{2} \approx 1{,}658312
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La fórmula de segundo grado da $z=\tfrac{3i\pm5i}{2}$, o sea
              $4i$ y $-i$.
          - texto: >-
              La distancia entre los dos focos es $5$, luego $c=\tfrac52$, y de
              $2a=6$ sale $a=3$.
          - texto: >-
              Como $a>c$, la elipse existe, y su semieje menor es
              $b=\sqrt{9-\tfrac{25}{4}}=\tfrac{\sqrt{11}}{2}$.
          - texto: >-
              Y si la constante fuese $5$ en vez de $6$, la elipse sería más
              pequeña pero seguiría siendo una elipse.
            trampa: true
            mensaje: |
              Con $2a=5$ sería $a=c=\tfrac52$: la elipse **degenera** en el
              propio segmento que une los focos. Y con menos de $5$ no habría
              ningún punto, porque la desigualdad triangular lo impide. La
              condición para que haya elipse es $2a>$ distancia focal.
        veredicto: |
          Antes de calcular semiejes conviene comprobar que $2a$ supera la
          distancia entre focos. Aquí $6>5$ por poco, y por eso la elipse sale
          bastante alargada: casi un segmento.
