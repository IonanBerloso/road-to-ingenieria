        consigna: |
          Dibuja las cuatro soluciones en el plano complejo, con la
          circunferencia que las contiene y el cuadrado que forman.
        comprueba:
          - punto: |
              Las cuatro sobre la circunferencia de radio $2$.
            porque: |
              $\sqrt[4]{16}=2$. Es el primer número que hay que sacar, y fija la
              escala del dibujo.
          - punto: |
              Los cuatro argumentos en $45^\circ$, $135^\circ$, $225^\circ$ y
              $315^\circ$: una en cada cuadrante.
            porque: |
              El argumento de $-16$ es $180^\circ$, y dividido entre $4$ da
              $45^\circ$. A partir de ahí, saltos de $90^\circ$.
          - punto: |
              Que **ninguna** solución cae sobre los ejes.
            porque: |
              Es lo que distingue $z^{4}=-16$ de $z^{4}=16$, donde sí caerían dos
              en el eje real y dos en el imaginario. El signo del segundo miembro
              gira el cuadrado $45^\circ$.
          - punto: |
              El cuadrado dibujado, uniendo las cuatro soluciones.
            porque: |
              Las raíces $n$-ésimas son siempre los vértices de un polígono
              regular de $n$ lados. Dibujarlo es la comprobación de que están
              bien repartidas.
        veredicto: |
          En forma binómica son $\pm\sqrt2\pm\sqrt2\,i$, y eso se lee del dibujo:
          cada solución tiene las dos coordenadas iguales en valor absoluto,
          porque están a $45^\circ$ de los ejes.

    resolucion: |
      **Datos.** Se pide resolver $z^4 + 16 = 0$, dar las soluciones en forma
      binómica y representarlas.

      ### 1 · Por qué esto tiene solución aquí y no en los reales

      La ecuación es $z^4 = -16$. En $\mathbb{R}$ no hay solución: una potencia
      par de un real nunca es negativa. En $\mathbb{C}$ sí, porque elevar a una
      potencia **gira**: cuatro giros de $45°$ llevan al semieje real negativo,
      que es donde está el $-16$.

      ### 2 · Herramienta

      Se escribe el segundo miembro en polar,

      $$
      -16 = 16\,e^{i\,180°}
      $$

      y se aplica la fórmula de las raíces $n$-ésimas, válida porque
      $-16 \neq 0$:

      $$
      z_k = \sqrt[4]{16}\;e^{i\frac{180° + 360°k}{4}}, \qquad k = 0,1,2,3
      $$

      Son cuatro porque el grado es 4.

      ### 3 · Módulo y argumentos

      $$
      |z| = \sqrt[4]{16} = 2
      $$

      $$
      \theta_k = \frac{180° + 360°k}{4} = 45° + 90°k
        \;\Longrightarrow\; 45°,\; 135°,\; 225°,\; 315°
      $$

      ### 4 · Paso a forma binómica

      Como $\cos 45° = \mathrm{sen}\,45° = \frac{\sqrt2}{2}$ y el módulo es 2,
      cada componente vale $2\cdot\frac{\sqrt2}{2} = \sqrt2$:

      $$
      z_0 = \sqrt2 + i\sqrt2, \quad
      z_1 = -\sqrt2 + i\sqrt2, \quad
      z_2 = -\sqrt2 - i\sqrt2, \quad
      z_3 = \sqrt2 - i\sqrt2
      $$

      que se escribe de forma compacta como

      $$
      z = \sqrt2\,(\pm 1 \pm i)
      $$

      ### 5 · Representación gráfica

      Los cuatro afijos son los vértices de un **cuadrado** inscrito en la
      circunferencia de radio 2, con los vértices sobre las bisectrices de los
      cuadrantes. Vienen además en pares conjugados —$z_0$ con $z_3$, y $z_1$
      con $z_2$—, como tiene que pasar en toda ecuación de coeficientes reales.

      ### 6 · Comprobación

      Con la primera: $(\sqrt2+i\sqrt2)^2 = 2 + 2\cdot 2i + 2i^2 = 4i$, y
      $(4i)^2 = -16$. Se cumple la ecuación.

      ### Resultado

      $$
      \boxed{\;z = \sqrt2\,(\pm 1 \pm i)\;}
      $$

  - id: ecuacion-cuadrado-conjugado
    titulo: Cuando el cuadrado es el conjugado
    fuente: >-
      Ejercicio 1.10 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU

    nivel: practica
    enunciado: |
      $$
      z^{2} = \overline{z}
      $$
    pide: Calcular y representar gráficamente las soluciones de la ecuación.

    pasos:
      - tipo: reconocer
        pregunta: |
          Aquí no se puede aplicar la fórmula de las raíces: la incógnita
          aparece a los dos lados y en uno está conjugada. ¿Por dónde se entra?
        opciones:
          - texto: Tomar módulos en los dos miembros, que reduce la ecuación a una en $|z|$
            correcta: true
            mensaje: |
              Ese es el truco de este tipo de ecuaciones. Como
              $\left|z^{2}\right| = |z|^{2}$ y $\left|\overline{z}\right| = |z|$,
              queda $|z|^2 = |z|$: una ecuación de números reales que solo tiene
              dos soluciones posibles.
          - texto: Escribir $z = a+bi$ y resolver el sistema de dos ecuaciones reales
            mensaje: |
              Funciona y es perfectamente válido, pero es el camino largo: sale
              un sistema con $a^2-b^2 = a$ y $2ab = -b$, con casos que hay que
              discutir. Tomar módulos primero deja el problema casi resuelto.
          - texto: Elevar los dos miembros al cuadrado para quitar el conjugado
            mensaje: |
              El conjugado no desaparece al elevar al cuadrado:
              $\left(\overline{z}\right)^2$ sigue teniendo la barra. Y de paso
              subes el grado de la ecuación, con lo que aparecerían soluciones
              falsas.
          - texto: Dividir los dos miembros entre $z$ para simplificar
            mensaje: |
              Dividir entre $z$ solo vale si $z \neq 0$, y aquí **el cero es
              solución**. Al dividir la perderías sin enterarte: es el error más
              caro de este ejercicio.

      - tipo: calcular
        titulo: Los módulos posibles
        pregunta: |
          Tomando módulos queda $|z|^2 = |z|$. ¿Cuáles son los dos valores
          posibles de $|z|$? Escríbelos separados por comas.
        respuesta:
          tipo: conjunto
          valor: '0, 1'
          tolerancia: 0.01
          formato: los dos, separados por comas
        distractores:
          - valor: '1'
            mensaje: |
              Te has dejado el 0, y con él una solución entera de la ecuación.
              Eso pasa por simplificar $|z|^2 = |z|$ dividiendo entre $|z|$: al
              dividir se pierde siempre la raíz nula.
          - valor: '0, 1, -1'
            mensaje: |
              El $-1$ no puede ser: un módulo es una distancia y nunca es
              negativo. La ecuación $|z|^2 = |z|$ se resuelve **entre los reales
              no negativos**.
        pista: |
          $|z|^2 = |z|$ se escribe como $|z|\left(|z| - 1\right) = 0$. Un
          producto es cero cuando lo es alguno de sus factores.
        desarrollo: |
          $$
          \left|z^{2}\right| = \left|\overline{z}\right|
          \;\Longrightarrow\;
          |z|^{2} = |z|
          \;\Longrightarrow\;
          |z|\left(|z| - 1\right) = 0
          $$

          y como $|z| \ge 0$, las únicas posibilidades son

          $$
          |z| = 0 \quad \text{o} \quad |z| = 1
          $$
        veredicto: |
          El caso $|z| = 0$ da directamente $z = 0$, que **sí** cumple la
          ecuación: $0^2 = 0$. Queda estudiar el caso $|z| = 1$.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento del caso $|z| = 1$. Una de las piezas no debe
          entrar.
        piezas:
          - texto: |
              Si $|z| = 1$, entonces $z\,\overline{z} = |z|^2 = 1$, de donde
              $\overline{z} = \dfrac{1}{z}$.
          - texto: |
              Sustituyendo en la ecuación: $z^{2} = \dfrac{1}{z}$, y
              multiplicando por $z$ queda $z^{3} = 1$.
          - texto: |
              Multiplicar por $z$ es legítimo aquí porque en este caso
              $|z| = 1$, así que $z \neq 0$.
          - texto: |
              Las raíces cúbicas de la unidad son $1$, $e^{i120°}$ y
              $e^{i240°}$, es decir $1$ y $-\frac12 \pm \frac{\sqrt3}{2}i$.
          - texto: |
              Como $z^3 = 1$ y $1$ es real, la única solución posible es
              $z = 1$.
            trampa: true
            mensaje: |
              Que el segundo miembro sea real no obliga a que la solución lo
              sea: $z^3 = 1$ tiene **tres** soluciones, y dos de ellas son
              complejas. Es el mismo error que la teoría del tema ya nombra con
              $\sqrt[3]{8}$. Quedarse con $z=1$ aquí cuesta dos de las cuatro
              soluciones del ejercicio.
        veredicto: |
          Juntando los dos casos: el $0$ del primero y las tres raíces cúbicas
          de la unidad del segundo. Cuatro soluciones en total.

      - tipo: calcular
        titulo: Todas las soluciones
        pregunta: |
          Escribe **todas** las soluciones en forma binómica, separadas por
          comas.
        respuesta:
          tipo: conjunto
          valor: '0, 1, -1/2+√3/2i, -1/2-√3/2i'
          tolerancia: 0.02
          formato: todas, separadas por comas
        distractores:
          - valor: '1, -1/2+√3/2i, -1/2-√3/2i'
            mensaje: |
              Las tres que has escrito están bien, pero falta el $0$. Es la
              solución que se pierde al dividir entre $z$ o al olvidar el caso
              $|z| = 0$, y vale exactamente lo mismo que las otras tres.
          - valor: '0, 1'
            mensaje: |
              Te has quedado con las dos soluciones «reales» y has perdido las
              dos complejas. $z^3 = 1$ tiene tres raíces, no una.
          - valor: '0, 1, -1'
            mensaje: |
              El $-1$ no cumple la ecuación: $(-1)^2 = 1$ y su conjugado es
              $-1$, así que $1 \neq -1$. Las otras dos soluciones no son reales:
              son $-\frac12 \pm \frac{\sqrt3}{2}i$.
        pista: |
          Junta los dos casos: $z=0$ del primero, y las tres raíces cúbicas de
          la unidad del segundo.
        desarrollo: |
          **Caso $|z| = 0$:** $z = 0$, que cumple la ecuación.

          **Caso $|z| = 1$:** de $z\overline{z} = 1$ se despeja
          $\overline{z} = 1/z$, y la ecuación pasa a ser

          $$
          z^{2} = \frac{1}{z} \;\Longrightarrow\; z^{3} = 1
          $$

          cuyas soluciones son las tres raíces cúbicas de la unidad:

          $$
          z = 1, \qquad z = -\frac12 + \frac{\sqrt3}{2}i, \qquad
          z = -\frac12 - \frac{\sqrt3}{2}i
          $$
        veredicto: |
          Cuatro soluciones: el origen y los tres vértices de un triángulo
          equilátero inscrito en la circunferencia unidad.

      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 340 265" role="img" width="340" height="265"
               aria-labelledby="f-cuad-conj-t f-cuad-conj-d">
