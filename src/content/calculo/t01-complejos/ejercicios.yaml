        consigna: |
          Dibuja la región en el plano complejo, con los ejes marcados y la
          escala en enteros. Señala el centro y el radio.
        comprueba:
          - punto: |
              El centro en $\left(1,2\right)$, marcado con una cruz o un punto
              distinto del resto.
            porque: |
              $\lvert z-(1+2i)\rvert$ es la distancia a ese punto, no al origen.
              Centrar el disco en $0$ es el error de leer el módulo sin mirar lo
              que se resta.
          - punto: |
              El radio $3$, comprobable en el dibujo: el disco llega de $x=-2$ a
              $x=4$ y de $y=-1$ a $y=5$.
            porque: |
              Dar cuatro puntos del borde es lo que permite comprobar el radio
              sin medir. Y enseña que el disco **sí** cruza los dos ejes.
          - punto: |
              El borde en trazo **continuo** y el interior sombreado.
            porque: |
              La desigualdad es $\le$, así que la circunferencia pertenece a la
              región. Es literalmente la pregunta del enunciado.
        veredicto: |
          Con centro $\left(1,2\right)$ y radio $3$, el origen está dentro:
          $\lvert 0-(1+2i)\rvert=\sqrt5\approx2{,}24<3$. Probar el origen es la
          comprobación más barata de que el sombreado va por dentro.

    resolucion: |
      **Traducir.** $\left|z-z_0\right|$ es la distancia de $z$ al punto $z_0$.
      Aquí $z_0 = 1+2i$, cuyo afijo es el punto $(1,2)$.

      **La figura.** «Distancia menor o igual que 3» es el disco de centro
      $(1,2)$ y radio 3.

      **El borde.** La desigualdad es no estricta, así que la circunferencia
      $\left|z-(1+2i)\right| = 3$ pertenece a la región. Se dibuja con trazo
      **continuo**. Con $<$ iría discontinua y no entraría.

      **La comprobación.** Se coge un punto que claramente esté dentro —el
      centro sirve— y se sustituye en la condición original:

      $$
      \left|(1+2i)-(1+2i)\right| = 0 \le 3 \quad\checkmark
      $$

      Cumple, luego la región es el interior. Si hubiera salido que no cumple,
      la región sería el exterior y habríamos dibujado lo contrario.

  - id: ej-mediatriz-simple
    titulo: Los puntos que equidistan de otros dos
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Representar los afijos de los números complejos $z$ que verifican
      $$
      \left|z - 2\right| = \left|z - 4i\right|
      $$
    pide: Qué figura es y su ecuación en x e y.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué figura sale de igualar dos distancias?
        opciones:
          - texto: La mediatriz del segmento que une los dos puntos
            correcta: true
            mensaje: |
              Eso es. Equidistar de dos puntos es la definición de mediatriz, y
              sale sin hacer una sola cuenta.
          - texto: Una circunferencia con los dos puntos dentro
            mensaje: |
              La circunferencia sale de igualar **una** distancia a un número
              fijo. Aquí se igualan dos distancias entre sí, que es otra cosa.
          - texto: El segmento que une los dos puntos
            mensaje: |
              El segmento son los puntos que están entre medias. La mediatriz
              es perpendicular a él y pasa por su punto medio: los corta, pero
              no son lo mismo.
      - tipo: calcular
        titulo: La ecuación
        pregunta: |
          Con $z = x+iy$, elevando al cuadrado los dos lados sale
          $(x-2)^{2}+y^{2} = x^{2}+(y-4)^{2}$. Desarrollando y simplificando
          queda $y = mx + n$. ¿Cuánto vale la pendiente $m$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.001
          formato: en forma exacta, o con dos decimales
        distractores:
          - valor: '2'
            mensaje: |
              Has dejado la $y$ sin despejar del todo: de $4x - 8y + 12 = 0$
              hay que despejar $y$, no $x$.
          - valor: '-0.5'
            mensaje: |
              Signo cambiado. Al pasar los términos de lado, $-8y$ se convierte
              en $+8y$ y la pendiente sale positiva.
        pista: |
          Desarrolla los dos cuadrados. Los $x^{2}$ y los $y^{2}$ se cancelan y
          queda una ecuación de primer grado.
        desarrollo: |
          $$
          (x-2)^{2}+y^{2} = x^{2}+(y-4)^{2}
          $$

          $$
          x^{2}-4x+4+y^{2} = x^{2}+y^{2}-8y+16
          $$

          Los términos cuadrados se cancelan —y por eso sale una recta y no una
          cónica—, quedando

          $$
          -4x+4 = -8y+16
          \;\Longrightarrow\;
          8y = 4x + 12
          \;\Longrightarrow\;
          y = \frac{x}{2} + \frac{3}{2}
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: Igualar dos distancias da la mediatriz del segmento que une los dos puntos.
          - texto: Los puntos son $(2,0)$ y $(0,4)$, y su punto medio es $(1,2)$.
          - texto: Al desarrollar los cuadrados se cancelan los términos de segundo grado.
          - texto: Queda la recta $y = \frac{x}{2}+\frac{3}{2}$, que pasa por $(1,2)$.
          - texto: Como la condición lleva módulos, la figura tiene que ser curva.
            trampa: true
            mensaje: |
              Los módulos no obligan a nada por sí solos. Aquí los cuadrados se
              cancelan entre los dos lados y lo que queda es de primer grado:
              una recta. Con un módulo igualado a un **número** sí saldría una
              circunferencia.
      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 340 265" role="img" width="340" height="265"
               aria-labelledby="f-mediatriz-t f-mediatriz-d">
            <title id="f-mediatriz-t">La mediatriz del segmento que une 2 con 4i</title>
            <desc id="f-mediatriz-d">Los puntos 2 y 4i marcados, el segmento entre ellos a trazos y su punto medio en (1,2). Por ese punto medio pasa una recta perpendicular al segmento, de pendiente un medio: la mediatriz, que es el lugar pedido.</desc>
