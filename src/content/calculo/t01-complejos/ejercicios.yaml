        consigna: |
          Dibuja las ocho regiones, cada una en unos ejes pequeños e
          independientes. Etiqueta cada dibujo con su letra.
        comprueba:
          - punto: |
              Que cada apartado tiene **su propio dibujo**, no todos superpuestos.
            porque: |
              Son ocho condiciones independientes, y el examen pide representar
              los afijos de cada una. Amontonarlas hace ilegible la respuesta.
          - punto: |
              Las cuatro primeras dibujadas sin cuentas: recta horizontal,
              semiplano, circunferencia y disco.
            porque: |
              Se leen directamente del enunciado. Perder tiempo desarrollándolas
              es el error de gestión de tiempo más caro del ejercicio.
          - punto: |
              En la (e), el semiplano $y\ge\tfrac12$ con la frontera continua;
              en la (f), el **interior** del círculo de centro
              $\left(-\tfrac13,\tfrac43\right)$ y radio
              $\tfrac{2\sqrt2}{3}$, con la frontera a trazos.
            porque: |
              Las dos vienen de comparar distancias, y la diferencia entre recta
              y circunferencia la decide el peso. Y el tipo de trazo, la
              desigualdad.
          - punto: |
              En la (g), una parábola abierta hacia la **izquierda** con vértice
              en $\left(1,0\right)$; en la (h), una elipse con el eje mayor
              **vertical**.
            porque: |
              Son las dos cónicas del ejercicio, y las dos se dibujan mal por el
              mismo motivo: no mirar dónde están el foco o los focos.
        veredicto: |
          Ocho dibujos pequeños y limpios valen más que uno grande y amontonado.
          Y conviene ordenarlos por dificultad: las cuatro inmediatas primero,
          para que quede tiempo de sobra para la Apolonio y la parábola.

    resolucion: |
      **Las ocho.**

      | ap. | región |
      |---|---|
      | (a) | recta horizontal $y=3$ |
      | (b) | semiplano cerrado $x\ge-1$ |
      | (c) | circunferencia unidad |
      | (d) | disco cerrado de centro $-i$ y radio $1$ |
      | (e) | semiplano cerrado $y\ge\tfrac12$ |
      | (f) | interior del círculo $\left(x+\tfrac13\right)^{2}+\left(y-\tfrac43\right)^{2}<\tfrac89$ |
      | (g) | parábola $x=1-\tfrac{y^{2}}{4}$ |
      | (h) | elipse $\tfrac{x^{2}}{9}+\tfrac{y^{2}}{25}=1$ |

      ### 1 · Las cuatro inmediatas

      (a), (b), (c) y (d) se leen sin cuentas: parte imaginaria constante es
      una horizontal; parte real acotada, un semiplano; módulo constante, una
      circunferencia; módulo acotado, un disco.

      ### 2 · (e), la mediatriz

      $$
      x^{2}+y^{2} \ge x^{2}+\left(y-1\right)^{2}
      \;\Longrightarrow\;
      0 \ge -2y+1
      \;\Longrightarrow\;
      y \ge \frac12
      $$

      Los $x^{2}$ y los $y^{2}$ **se cancelan**, y por eso queda una recta.

      ### 3 · (f), la circunferencia de Apolonio

      Aquí los pesos son distintos —$1$ y $2$— y los cuadráticos ya no se
      cancelan:

      $$
      \left(x-1\right)^{2}+y^{2} > 4x^{2}+4\left(y-1\right)^{2}
      $$

      $$
      3x^{2}+3y^{2}+2x-8y+3 < 0
      $$

      $$
      \left(x+\frac13\right)^{2}+\left(y-\frac43\right)^{2} < \frac89
      $$

      Centro $\left(-\tfrac13,\tfrac43\right)$, radio
      $\tfrac{2\sqrt2}{3}\approx0{,}943$. Es el **interior**, porque la
      desigualdad original pide estar lejos de $1$ y cerca de $i$, y eso pasa
      alrededor de $i$.

      ### 4 · (g), la parábola escondida

      $$
      \sqrt{x^{2}+y^{2}} = 2-x
      $$

      que exige $x\le2$. Elevando al cuadrado:

      $$
      x^{2}+y^{2} = 4-4x+x^{2}
      \;\Longrightarrow\;
      y^{2} = 4-4x
      \;\Longrightarrow\;
      x = 1-\frac{y^{2}}{4}
      $$

      Parábola de vértice $\left(1,0\right)$, abierta hacia la izquierda. Y la
      lectura geométrica: $\lvert z\rvert$ es la distancia al origen y
      $2-\operatorname{Re}z$ la distancia a la recta $x=2$. Igualarlas es la
      definición de parábola con **foco el origen y directriz $x=2$**.

      ### 5 · (h), la elipse

      Suma de distancias a $4i$ y $-4i$ igual a $10$: elipse de focos $\pm4i$,
      con

      $$
      a=5,\qquad c=4,\qquad b=\sqrt{25-16}=3
      $$

      $$
      \frac{x^{2}}{9}+\frac{y^{2}}{25} = 1
      $$

      El eje mayor es **vertical**, porque los focos lo están.

      **Lo que hay que llevarse.** Antes de desarrollar, mirar qué tipo de
      condición es: distancias con el mismo peso, con pesos distintos, sumadas,
      o una distancia contra una recta. Cada patrón tiene su cónica, y saberlo
      convierte cinco minutos de álgebra en diez segundos de reconocimiento.

  - id: cuatro-regiones-de-argumento
    titulo: Cuatro condiciones sobre argumentos, y dos son arcos capaces
    fuente: Ejercicio 5 · Problemas, tema 1 · Cálculo, UPV/EHU
    nivel: practica
    enunciado: |
      Calcular y representar gráficamente los afijos de los números complejos
      $z$ que verifican las condiciones siguientes:

      (a) $\dfrac{\pi}{2} < \arg(z) < \pi$ &nbsp;&nbsp;
      (b) $\left\lvert\arg(z)\right\rvert < \dfrac{\pi}{6}$

      (c) $0 < \arg\left(\dfrac{z-2}{z-1}\right) < \dfrac{\pi}{2}$
      &nbsp;&nbsp;
      (d) $\arg\left(\dfrac{z-3}{z-1}\right) = \pm\dfrac{\pi}{2}$
    pide: Las cuatro regiones.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué diferencia hay entre una condición sobre $\arg z$ y una sobre
          $\arg\dfrac{z-a}{z-b}$?
        opciones:
          - texto: >-
              La primera mide el ángulo desde el origen y da sectores; la
              segunda mide el ángulo bajo el que $z$ ve el segmento $ab$ y da
              arcos de circunferencia
            correcta: true
            mensaje: |
              Eso es, y es toda la diferencia entre (a)–(b) y (c)–(d). Sectores
              con vértice en el origen frente a arcos capaces sobre un
              segmento.
          - texto: >-
              Ninguna: las dos dan sectores
            mensaje: |
              Un sector tiene un vértice fijo. En
              $\arg\tfrac{z-a}{z-b}$ el ángulo se mide **en $z$**, que se
              mueve, y el lugar de los puntos que ven un segmento bajo un
              ángulo dado es un arco de circunferencia.
          - texto: >-
              La segunda también da sectores, pero con vértice en $a$
            mensaje: |
              El vértice del ángulo es $z$, no $a$ ni $b$. Por eso el lugar es
              curvo.

      - tipo: verificar
        pregunta: |
          Escribe en $x$ e $y$ la región del apartado (c). Necesitarás dos
          condiciones unidas por `&`. La figura comprobará si coincide.
        condicion: '0 < arg((z-2)/(z-1)) < pi/2'
        ventana:
          x: [-2, 5]
          y: [-2, 3]
        formato: dos condiciones en x e y, unidas por &
        pista: |
          El extremo $\arg=0$ es la recta que pasa por $1$ y $2$ —el eje
          real—, y el extremo $\arg=\tfrac\pi2$ es la circunferencia que tiene
          el segmento $\left[1,2\right]$ por diámetro. La región está entre las
          dos.
        desarrollo: |
          El ángulo bajo el que $z$ ve el segmento de $1$ a $2$ vale entre $0$
          y $\tfrac\pi2$. Los dos bordes son:

          - $\arg=0$: el eje real, fuera del segmento;
          - $\arg=\tfrac\pi2$: la circunferencia
            $\left(x-\tfrac32\right)^{2}+y^{2}=\tfrac14$.

          Y el signo positivo del argumento obliga al semiplano superior. La
          región es

          $$
          y>0 \quad\text{y}\quad
          \left(x-\frac32\right)^{2}+y^{2} > \frac14
          $$

          el semiplano superior **menos** el semidisco de diámetro
          $\left[1,2\right]$.

      - tipo: calcular
        titulo: La apertura del sector (b)
        pregunta: |
          ¿Cuántos grados mide la apertura total del sector del apartado (b)?
        respuesta:
          tipo: numero
          valor: '60'
          tolerancia: 0.02
          formato: en grados, un número entero
        distractores:
          - valor: '30'
            mensaje: |
              $30^\circ$ es $\tfrac\pi6$, que es la **mitad** de la apertura:
              el valor absoluto permite tanto $+\tfrac\pi6$ como
              $-\tfrac\pi6$.
          - valor: '120'
            mensaje: |
              $120^\circ$ sería $\tfrac{2\pi}{3}$. Aquí el semiángulo es
              $\tfrac\pi6=30^\circ$, así que el total es $60^\circ$.
        pista: |
          $\lvert\arg z\rvert<\tfrac\pi6$ abre $\tfrac\pi6$ hacia arriba y
          $\tfrac\pi6$ hacia abajo.
        desarrollo: |
          $$
          -\frac\pi6 < \arg z < \frac\pi6
          \;\Longrightarrow\;
          \text{apertura} = \frac\pi3 = 60^\circ
          $$

          Es el sector alrededor del semieje real positivo, entre las rectas
          $y=\pm\tfrac{x}{\sqrt3}$ con $x>0$.

      - tipo: justificar
        pregunta: Ordena el razonamiento del apartado (d). Una pieza es falsa.
        piezas:
          - texto: >-
              $\arg\dfrac{z-3}{z-1}=\pm\dfrac\pi2$ dice que $z-3$ y $z-1$ son
              perpendiculares.
          - texto: >-
              Los puntos que ven el segmento $\left[1,3\right]$ bajo ángulo
              recto forman la circunferencia de diámetro ese segmento.
          - texto: >-
              Centro $2$ y radio $1$: la circunferencia
              $\left(x-2\right)^{2}+y^{2}=1$, con $z=1$ y $z=3$ excluidos.
          - texto: >-
              Y el signo $\pm$ hace que solo valga la mitad superior, porque el
              argumento positivo obliga a $y>0$.
            trampa: true
            mensaje: |
              El $\pm$ hace justo lo contrario: **admite las dos**
              circunferencias, la superior con $+\tfrac\pi2$ y la inferior con
              $-\tfrac\pi2$. Por eso la respuesta es la circunferencia entera y
              no media. Si el enunciado dijera solo $+\tfrac\pi2$, entonces sí
              sería el arco superior.
        veredicto: |
          Un argumento igual a una constante da un **arco**; igual a
          $\pm$ esa constante da los **dos** arcos, o sea la circunferencia
          completa. El signo del argumento es lo que distingue arriba de abajo.
      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 406 368" role="img" width="406" height="368"
               aria-labelledby="f-cuatro-arg-t f-cuatro-arg-d">
