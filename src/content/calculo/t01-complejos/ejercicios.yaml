                .f-recinto-n { fill: var(--faint); font-size: 10px; font-family: var(--mono); paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
                .f-recinto-l { font-size: 10.5px; font-family: var(--mono); font-weight: 700; paint-order: stroke; stroke: var(--paper); stroke-width: 3.4px; stroke-linejoin: round; }
            </style>
            <path class="f-recinto-eje" d="M26 188.3L314 188.3M127.7 239L127.7 26"/>
            <path class="f-recinto-eje" d="M195.4 184.8L195.4 191.8"/>
