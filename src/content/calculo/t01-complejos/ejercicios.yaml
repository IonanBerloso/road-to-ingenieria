        consigna: |
          Dibuja la circunferencia completa a trazos y, encima, en trazo grueso,
          el arco que cumple la condición. Marca los extremos como excluidos.
        comprueba:
          - punto: |
              Los puntos $1$ y $2$ con el segmento entre ellos, señalado como
              diámetro.
            porque: |
              Es el arco capaz de $90^\circ$ sobre ese segmento, y el diámetro es
              lo que explica la circunferencia.
          - punto: |
              Centro $\left(\tfrac32,0\right)$ y radio $\tfrac12$.
            porque: |
              Punto medio y mitad de la distancia. Son los dos números que el
              dibujo tiene que dejar comprobar.
          - punto: |
              Solo la mitad **superior** en trazo grueso.
            porque: |
              El enunciado pide $+\tfrac\pi2$, no $\pm$. La mitad inferior ve el
              segmento bajo el mismo ángulo pero con argumento negativo, y es la
              trampa del ejercicio.
          - punto: |
              $z=1$ y $z=2$ con círculo hueco.
            porque: |
              En uno se anula el denominador y en el otro el numerador. Dos
              motivos distintos, los dos dejan el punto fuera.
        veredicto: |
          Para decidir la mitad basta probar el punto más alto,
          $\tfrac32+\tfrac12 i$: el cociente sale $i$. Un punto de prueba resuelve
          en un segundo lo que discutir signos tarda cinco minutos.

    resolucion: |
      **Datos.** Se pide el lugar de los $z$ con
      $\arg\left(\frac{z-2}{z-1}\right) = \frac{\pi}{2}$.

      ### 1 · Restricciones previas

      El cociente exige $z \neq 1$. Y el argumento de $0$ no está definido, así
      que también $z \neq 2$. Los dos puntos quedan excluidos desde el principio.

      ### 2 · Qué dice la condición

      El argumento de un cociente es la diferencia de argumentos:

      $$
      \arg\left(\frac{z-2}{z-1}\right) = \arg(z-2) - \arg(z-1)
      $$

      $\arg(z-2)$ es la dirección del vector que va del punto $2$ al afijo de
      $z$, y $\arg(z-1)$ la del que va del punto $1$. Que su diferencia valga
      $\frac{\pi}{2}$ significa que **esos dos vectores forman un ángulo recto**,
      es decir, que desde $z$ el segmento que une $1$ y $2$ se ve bajo $90°$.

      ### 3 · El teorema del ángulo inscrito

      Los puntos desde los que un segmento se ve bajo un ángulo recto forman la
      circunferencia que tiene ese segmento como **diámetro**. Aquí el segmento
      va de $(1,0)$ a $(2,0)$:

      $$
      \text{centro } \left(\frac{3}{2},0\right), \qquad r = \frac{1}{2}
      $$

      $$
      \left(x-\frac{3}{2}\right)^{2} + y^{2} = \frac{1}{4}
      $$

      ### 4 · Solo la mitad

      La condición no es «ángulo recto» a secas: es argumento **exactamente**
      $+\frac{\pi}{2}$. En la mitad inferior el ángulo también es recto, pero el
      argumento del cociente sale $-\frac{\pi}{2}$.

      Se decide con un punto. En el más alto de la circunferencia,
      $z = \frac32 + \frac12 i$:

      $$
      \frac{z-2}{z-1} = \frac{-\frac12+\frac12 i}{\frac12+\frac12 i}
        = \frac{(-1+i)}{(1+i)} = i
      $$

      cuyo argumento es $+\frac{\pi}{2}$ ✔. Luego sirve la mitad **superior**.

      ### 5 · El resultado, y por qué no se usa aquí el verificador

      $$
      \left(x-\frac{3}{2}\right)^{2}+y^{2} = \frac{1}{4}
      \qquad\text{con}\qquad y > 0
      $$

      Este lugar geométrico es una **curva**, no una región con área. La
      herramienta de comprobación de regiones de los ejercicios anteriores
      compara manchas de puntos, y dos curvas dibujadas con grosores distintos
      no se solapan aunque sean la misma: por eso este ejercicio se resuelve con
      el centro y el radio en vez de escribiendo la condición.

      ### 6 · Comprobación

      Con $z = \frac32+\frac12 i$: está en la circunferencia, porque
      $0 + \frac14 = \frac14$ ✔, tiene $y>0$ ✔, y el cociente vale $i$ ✔.

      Con el punto simétrico $z = \frac32-\frac12 i$: está en la circunferencia,
      pero el cociente vale $-i$, de argumento $-\frac{\pi}{2}$ ✗. Queda fuera,
      como debe.

      ### Resultado

      $$
      \boxed{\;\left(x-\tfrac{3}{2}\right)^{2}+y^{2} = \tfrac{1}{4}
      \quad\text{con}\quad y>0\;}
      $$

  - id: lugar-mediatriz-parabola
    titulo: Una mediatriz y una parábola
    fuente: >-
      Ejercicio 1.24 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU
      (2019/2020 4E)

    nivel: practica
    enunciado: |
      $$
      \begin{cases}
      |z-2| > |z-2i| \\[2pt]
      |z| + \operatorname{Im}(z) < 4
      \end{cases}
      $$
    pide: >-
      Calcular y representar gráficamente el lugar geométrico de los afijos que
      cumplen las dos condiciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          La primera condición compara dos distancias. ¿Qué región describe?
        opciones:
          - texto: >-
              Un semiplano: el de los puntos más cercanos a $2i$ que a $2$
            correcta: true
            mensaje: |
              Eso es. Los puntos que **equidistan** de dos puntos forman la
              mediatriz; la desigualdad se queda con uno de los dos semiplanos
              que esa recta separa. Como se pide estar más **lejos** de 2, es el
              lado de $2i$.
          - texto: Una circunferencia
            mensaje: |
              Sale circunferencia cuando lo que se fija es el **cociente** de
              distancias, no su comparación directa. Con $|z-a| > |z-b|$ la
              frontera es una recta.
          - texto: Una elipse
            mensaje: |
              La elipse aparece con la **suma** de distancias. Aquí hay una
              comparación entre ellas.
          - texto: El semiplano de los puntos más cercanos a $2$
            mensaje: |
              Al revés: la condición dice que la distancia a $2$ es **mayor**,
              así que $z$ está más lejos de 2, o sea más cerca de $2i$.

      - tipo: verificar
        pregunta: |
          Simplifica las dos condiciones y escríbelas en $x$ e $y$, unidas por
          `&`.
        condicion: '|z-2| > |z-2i| & |z| + Im(z) < 4'
        ventana:
          x: [-6, 4]
          y: [-3, 3]
        formato: dos condiciones en x e y, unidas por &
        pista: |
          La primera sale elevando al cuadrado los dos módulos: los términos
          $x^{2}$ e $y^{2}$ se cancelan. Para la segunda, aísla la raíz antes de
          elevar: $\sqrt{x^{2}+y^{2}} < 4-y$.
        desarrollo: |
          **Primera condición.** Elevando al cuadrado —los dos miembros son no
          negativos—:

          $$
          (x-2)^{2}+y^{2} > x^{2}+(y-2)^{2}
          $$

          $$
          -4x+4 > -4y+4 \;\Longrightarrow\; -4x > -4y \;\Longrightarrow\; y > x
          $$

          **Segunda condición.** Se aísla la raíz:

          $$
          \sqrt{x^{2}+y^{2}} < 4-y
          $$

          Para elevar al cuadrado hace falta que el miembro derecho sea
          positivo, $y<4$. Entonces:

          $$
          x^{2}+y^{2} < 16-8y+y^{2}
          \;\Longrightarrow\;
          x^{2} < 16-8y
          \;\Longrightarrow\;
          y < 2-\frac{x^{2}}{8}
          $$
        veredicto: |
          Una parábola con el vértice en $(0,2)$, abierta hacia abajo, cortada
          por la bisectriz $y=x$. La región es lo que queda por encima de la
          recta y por debajo de la parábola.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento de la segunda condición, que es la delicada.
          Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Se aísla la raíz: $\sqrt{x^{2}+y^{2}} < 4-y$.
          - texto: |
              Elevar al cuadrado solo es equivalente si los dos miembros son no
              negativos, así que hace falta $4-y > 0$, es decir $y<4$.
          - texto: |
              Con esa condición, elevando queda $x^{2}+y^{2} < 16-8y+y^{2}$, y
              los $y^{2}$ se cancelan.
          - texto: |
              Despejando, $y < 2-\frac{x^{2}}{8}$. Y esta condición ya implica
              $y<2<4$, así que la restricción previa no añade nada nuevo.
          - texto: |
              Como los dos miembros están elevados al cuadrado, la desigualdad
              se conserva siempre y no hay que comprobar signos.
            trampa: true
            mensaje: |
              Elevar al cuadrado **no** conserva las desigualdades en general:
              $-3 < 1$ pero $9 > 1$. Solo es equivalente cuando los dos miembros
              son no negativos, y por eso hay que comprobar $4-y>0$ antes. Que
              aquí acabe siendo automático es una conclusión, no una excusa para
              saltarse la comprobación.
        veredicto: |
          El hábito que enseña: cada vez que se eleva al cuadrado, escribir la
          condición de signo. A veces sobra, como aquí; a veces es la mitad de
          la respuesta.

      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 340 265" role="img" width="340" height="265"
               aria-labelledby="f-mediatriz-parabola-t f-mediatriz-parabola-d">
            <title id="f-mediatriz-parabola-t">La franja curva entre la bisectriz y la parábola</title>
            <desc id="f-mediatriz-parabola-d">La bisectriz y igual a x y la parábola y igual a dos menos x cuadrado partido por ocho, las dos a trazos. Se cortan en x igual a cero coma nueve y en x igual a menos ocho coma nueve. Entre las dos, por encima de la recta y por debajo de la parábola, queda sombreada una franja curva abierta hacia la izquierda.</desc>
