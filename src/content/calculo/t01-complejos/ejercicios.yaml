        consigna: |
          Dibuja la región en el plano complejo, con los dos puntos del cociente
          marcados y la circunferencia frontera. Sombrea el lado que cumple la
          desigualdad.
        comprueba:
          - punto: |
              Los dos puntos $2+i$ y $1+i$ marcados.
            porque: |
              Son los focos del cociente de distancias, y sin ellos el dibujo no
              explica de dónde sale la circunferencia de Apolonio.
          - punto: |
              La circunferencia de centro $\left(\tfrac12,1\right)$ y radio
              $\tfrac{\sqrt3}{2}\approx0{,}87$.
            porque: |
              Es la frontera, y es lo que hay que sacar completando cuadrados.
              Comprobar que pasa cerca de $\left(-0{,}37;\,1\right)$ y de
              $\left(1{,}37;\,1\right)$ verifica centro y radio a la vez.
          - punto: |
              Sombreado el **exterior** del círculo, no el interior.
            porque: |
              La desigualdad pide estar lejos de $2+i$ en comparación con
              $1+i$, y eso ocurre fuera. Probar un punto lejano —el origen, por
              ejemplo— lo confirma en diez segundos.
          - punto: |
              El borde a **trazos**, porque la desigualdad es estricta.
            porque: |
              Con $<$ la circunferencia no entra. Es el detalle que distingue una
              respuesta completa.
        veredicto: |
          El punto $1+i$ está **dentro** del círculo excluido y $2+i$ también:
          los dos focos de una circunferencia de Apolonio con razón mayor que $1$
          caen del mismo lado. Comprobarlo en el dibujo caza los errores de
          signo.

    resolucion: |
      **Datos.** Se pide el lugar geométrico de los $z$ con

      $$
      \left|\frac{z-(2+i)}{z-(1+i)}\right| < \sqrt{3}
      $$

      ### 1 · Qué dice la condición

      $|z-w|$ es la distancia del afijo de $z$ al punto $w$. La condición pide
      que la distancia a $2+i$ sea menor que $\sqrt3$ veces la distancia a
      $1+i$: un **cociente de distancias** acotado.

      Hay una restricción previa: el denominador no puede anularse, así que
      $z \neq 1+i$.

      ### 2 · Quitar los módulos

      El módulo de un cociente es el cociente de módulos, y los dos son no
      negativos, así que se puede pasar multiplicando y elevar al cuadrado sin
      perder ni añadir soluciones:

      $$
      |z-(2+i)|^{2} < 3\,|z-(1+i)|^{2}
      $$

      Con $z = x+iy$:

      $$
      (x-2)^{2}+(y-1)^{2} < 3\left[(x-1)^{2}+(y-1)^{2}\right]
      $$

      ### 3 · Simplificar

      $$
      x^{2}-4x+4+(y-1)^{2} < 3x^{2}-6x+3+3(y-1)^{2}
      $$

      $$
      0 < 2x^{2}-2x-1+2(y-1)^{2}
      $$

      $$
      0 < x^{2}-x-\frac{1}{2}+(y-1)^{2}
      $$

      Completando el cuadrado en $x$, con
      $x^{2}-x = \left(x-\frac12\right)^{2}-\frac14$:

      $$
      \left(x-\frac{1}{2}\right)^{2}+(y-1)^{2} > \frac{1}{4}+\frac{1}{2} = \frac{3}{4}
      $$

      ### 4 · Interpretación y dibujo

      Es el **exterior** de la circunferencia de centro $\left(\frac12,1\right)$
      y radio $\frac{\sqrt3}{2} \approx 0{,}87$, sin incluir el borde.

      Conviene subrayar el cambio de sentido: la condición de partida era
      «menor que» y la final es «mayor que». No es una errata: al pasar el
      denominador y agrupar, los términos cambian de lado.

      El punto excluido $z = 1+i$, es decir $(1,1)$, está **dentro** de la
      circunferencia —su distancia al centro es $\sqrt{0{,}25} = 0{,}5 <
      0{,}87$—, así que ya quedaba fuera de la región: la restricción no añade
      nada.

      ### 5 · Comprobación

      Se toma un punto claramente dentro de la región, por ejemplo el origen:
      $\left(0-\frac12\right)^2+(0-1)^2 = 1{,}25 > 0{,}75$ ✔. Y en la condición
      original:

      $$
      \left|\frac{0-(2+i)}{0-(1+i)}\right| = \frac{\sqrt5}{\sqrt2} \approx 1{,}58
        < \sqrt3 \approx 1{,}73 \;\checkmark
      $$

      ### Resultado

      $$
      \boxed{\;\left(x-\tfrac{1}{2}\right)^{2}+(y-1)^{2} > \tfrac{3}{4}\;}
      $$

  - id: lugar-dos-condiciones-modulo
    titulo: Dos condiciones que se cortan
    fuente: >-
      Ejercicio 1.20 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU
      (2018/2019 4E)

    nivel: practica
    enunciado: |
      $$
      \begin{cases}
      |z|^{2} \ge \operatorname{Im}(z) \\[2pt]
      \dfrac{1}{z} \ge \overline{z}
      \end{cases}
      $$
    pide: >-
      Calcular y representar gráficamente el lugar geométrico de los afijos que
      cumplen las dos condiciones.

    pasos:
      - tipo: reconocer
        pregunta: |
          La segunda condición compara dos números complejos con $\ge$. ¿Qué hay
          que entender?
        opciones:
          - texto: >-
              Que hay que leerla como una comparación de módulos: en
              $\mathbb{C}$ no hay orden
            correcta: true
            mensaje: |
              Eso es. Los complejos **no** están ordenados: no tiene sentido
              decir que $2+i$ es mayor que $1+3i$. Una desigualdad entre
              complejos solo se sostiene comparando cantidades reales asociadas,
              y aquí lo natural es el módulo: $\left|\frac1z\right| \ge |z|$.
          - texto: Que se comparan las partes reales
            mensaje: |
              Sería una lectura posible, pero da una región distinta de la que
              recoge la solución del boletín, y además deja fuera la mitad de la
              información del número. La lectura estándar es por módulos.
          - texto: Que la desigualdad es un error del enunciado
            mensaje: |
              No lo es: es una forma abreviada, habitual en los boletines, de
              comparar módulos. Lo que sí hay que hacer es **decir** cómo se
              interpreta antes de operar.
          - texto: Que $z$ tiene que ser real para que la comparación tenga sentido
            mensaje: |
              Si $z$ fuera real la condición sería $\frac1z \ge z$, que solo
              afectaría al eje real. Pero entonces la primera condición sobraría
              y el ejercicio no tendría gracia: se pierde toda la región del
              plano.

      - tipo: verificar
        pregunta: |
          Simplifica las dos condiciones y escríbelas en $x$ e $y$, unidas por
          `&`. La figura comprobará si tu región coincide.
        condicion: '|z|^2 >= Im(z) & 1/|z|^2 >= 1'
        ventana:
          x: [-1.5, 1.5]
          y: [-1.5, 1.5]
        formato: dos condiciones en x e y, unidas por &
        pista: |
          La primera es $x^{2}+y^{2} \ge y$: pasa todo a un lado y completa el
          cuadrado en $y$. La segunda, en módulos, es
          $\frac{1}{|z|} \ge |z|$, es decir $|z|^{2} \le 1$.
        desarrollo: |
          **Primera condición.** $|z|^{2} \ge \operatorname{Im}(z)$ es
          $x^{2}+y^{2} \ge y$, o sea $x^{2}+y^{2}-y \ge 0$. Completando el
          cuadrado en $y$:

          $$
          x^{2} + \left(y-\frac{1}{2}\right)^{2} \ge \frac{1}{4}
          $$

          **Segunda condición.** Comparando módulos,
          $\left|\frac{1}{z}\right| = \frac{1}{|z|} \ge |z|$, y multiplicando por
          $|z| > 0$:

          $$
          |z|^{2} \le 1 \;\Longleftrightarrow\; x^{2}+y^{2} \le 1
          $$
        veredicto: |
          La región es el disco unidad **menos** el interior de una
          circunferencia pequeña, la de centro $\left(0,\frac12\right)$ y radio
          $\frac12$, que es tangente al eje real en el origen.

      - tipo: justificar
        pregunta: |
          Ordena el razonamiento de la segunda condición. Una de las piezas no
          debe entrar.
        piezas:
          - texto: |
              La desigualdad se lee entre módulos:
              $\left|\dfrac{1}{z}\right| \ge \left|\overline{z}\right|$.
          - texto: |
              $\left|\dfrac{1}{z}\right| = \dfrac{1}{|z|}$ y
              $\left|\overline{z}\right| = |z|$, así que queda
              $\dfrac{1}{|z|} \ge |z|$.
          - texto: |
              Hace falta $z \neq 0$ para que $\frac1z$ exista, y entonces
              $|z| > 0$: se puede multiplicar por $|z|$ sin cambiar el sentido.
          - texto: |
              Queda $1 \ge |z|^{2}$, es decir el disco unidad cerrado, quitando
              el origen.
          - texto: |
              Como $\overline{z}$ tiene el mismo módulo que $z$, la segunda
              condición no aporta nada y se puede ignorar.
            trampa: true
            mensaje: |
              Que $\left|\overline{z}\right| = |z|$ es cierto, y precisamente por
              eso la condición **sí** dice algo: se convierte en
              $\frac{1}{|z|} \ge |z|$, que recorta el plano al disco unidad. Una
              condición no es vacía por que uno de sus lados se simplifique.
        veredicto: |
          Multiplicar por $|z|$ es seguro porque es positivo. Si se hubiera
          multiplicado por $z$, que es complejo, la desigualdad habría dejado de
          tener sentido.

      - tipo: dibujar
        figura: |
          <svg viewBox="0 0 340 265" role="img" width="340" height="265"
               aria-labelledby="f-dos-modulos-t f-dos-modulos-d">
            <title id="f-dos-modulos-t">La luna entre la circunferencia unidad y la circunferencia pequeña tangente</title>
            <desc id="f-dos-modulos-d">La circunferencia unidad y, dentro, otra de centro (0 ; 0,5) y radio un medio, tangente al eje real en el origen y que pasa por i. Se sombrea lo que está dentro de la grande y fuera de la pequeña: una luna. El origen se marca con círculo hueco porque queda excluido.</desc>
