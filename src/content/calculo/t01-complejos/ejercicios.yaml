                .f-mediatriz-parabola-c { stroke: var(--d1); stroke-width: 2.8; fill: none; }
                .f-mediatriz-parabola-c2 { stroke: var(--alt); stroke-width: 2.8; fill: none; }
                .f-mediatriz-parabola-cp { stroke: var(--d1); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
                .f-mediatriz-parabola-cp2 { stroke: var(--alt); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
                .f-mediatriz-parabola-g { stroke: var(--faint); stroke-width: 1.1; fill: none; stroke-dasharray: 3 3; }
                .f-mediatriz-parabola-fue { stroke: var(--faint); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
                .f-mediatriz-parabola-f { fill: var(--live); fill-opacity: .12; stroke: none; }
                .f-mediatriz-parabola-f2 { fill: var(--alt); fill-opacity: .12; stroke: none; }
                .f-mediatriz-parabola-pt { fill: var(--live); }
                .f-mediatriz-parabola-punta { fill: var(--live); stroke: none; }
