            <desc id="f-raices-focos-d">Las raíces cuatro i y menos i, marcadas sobre el eje imaginario, hacen de focos. La elipse que generan está centrada en un coma cinco i, tiene los vértices del eje mayor en cuatro coma cinco i y en menos uno coma cinco i, y los del menor a más menos uno coma sesenta y seis de altura uno coma cinco. Sale muy estirada porque la suma pedida, seis, apenas supera la distancia entre focos, cinco.</desc>
