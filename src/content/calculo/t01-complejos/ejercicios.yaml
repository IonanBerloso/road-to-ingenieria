                .f-recinto-c { stroke: var(--d1); stroke-width: 2.8; fill: none; }
                .f-recinto-c2 { stroke: var(--alt); stroke-width: 2.8; fill: none; }
                .f-recinto-cp { stroke: var(--d1); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
                .f-recinto-cp2 { stroke: var(--alt); stroke-width: 2.4; fill: none; stroke-dasharray: 6 4; }
                .f-recinto-g { stroke: var(--faint); stroke-width: 1.1; fill: none; stroke-dasharray: 3 3; }
                .f-recinto-fue { stroke: var(--faint); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
                .f-recinto-f { fill: var(--live); fill-opacity: .12; stroke: none; }
                .f-recinto-f2 { fill: var(--alt); fill-opacity: .12; stroke: none; }
                .f-recinto-pt { fill: var(--live); }
                .f-recinto-punta { fill: var(--live); stroke: none; }
