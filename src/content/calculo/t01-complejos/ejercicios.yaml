            <desc id="f-cuad-conj-d">La circunferencia unidad con tres puntos a cero, ciento veinte y doscientos cuarenta grados, que forman un triángulo equilátero con un vértice en el uno. Y un cuarto punto en el origen, marcado igual que los otros tres porque cuenta como solución.</desc>
