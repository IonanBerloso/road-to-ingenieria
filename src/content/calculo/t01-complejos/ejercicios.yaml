            <circle class="f-mediatriz-o" cx="132.1" cy="71.9" r="4"/>
            <circle class="f-mediatriz-pt" cx="162.4" cy="132.5" r="4.4"/>
            <text class="f-mediatriz-l" x="198.7" y="208.1" text-anchor="start" fill="var(--flag)">z₁ = 2</text>
            <text class="f-mediatriz-l" x="124.1" y="65.9" text-anchor="end" fill="var(--flag)">z₂ = 4i</text>
            <text class="f-mediatriz-l" x="154.4" y="124.5" text-anchor="end" fill="var(--live)">M(1,2)</text>
            <text class="f-mediatriz-l" x="310" y="90" text-anchor="end" fill="var(--d1)">x − 2y + 3 = 0</text>
          </svg>
        consigna: |
          Dibuja los dos puntos, el segmento que los une y la recta solución.
          Marca el punto medio.
        comprueba:
          - punto: |
              Los puntos $2$ y $4i$ marcados, y el segmento entre ellos dibujado.
            porque: |
              La condición habla de distancias a esos dos puntos: sin el segmento
              el dibujo no explica de dónde sale la recta.
          - punto: |
              El punto medio $\left(1,2\right)$, por donde pasa la mediatriz.
            porque: |
              Es el punto más fácil de comprobar: equidista de los dos por
              construcción. Si tu recta no pasa por ahí, está mal.
          - punto: |
              La recta **perpendicular** al segmento.
            porque: |
              El segmento tiene dirección $\left(-2,4\right)$, así que la
              mediatriz va en la dirección $\left(4,2\right)$, o sea pendiente
              $\tfrac12$. Dibujarla paralela al segmento es el error clásico.
        veredicto: |
          La ecuación sale del dibujo: pasa por $\left(1,2\right)$ con pendiente
          $\tfrac12$, o sea $x-2y+3=0$. Y se comprueba en un punto cualquiera de
          ella, por ejemplo $\left(3,3\right)$: dista $\sqrt{10}$ de los dos.

    resolucion: |
      **Traducir.** $\left|z-2\right|$ es la distancia de $z$ al punto $(2,0)$,
      y $\left|z-4i\right|$ la distancia al punto $(0,4)$. La condición pide que
      sean iguales.

      **La figura, sin calcular nada.** Los puntos que equidistan de otros dos
      forman la **mediatriz** del segmento que los une: la recta perpendicular
      a él que pasa por su punto medio.

      **La ecuación.** Con $z = x+iy$ y elevando al cuadrado —lícito, porque
      los dos lados son positivos:

      $$
      (x-2)^{2}+y^{2} = x^{2}+(y-4)^{2}
      $$

      Los $x^{2}$ y los $y^{2}$ se cancelan, que es la señal de que va a salir
      una recta:

      $$
      -4x+4 = -8y+16
      \;\Longrightarrow\;
      y = \frac{x}{2}+\frac{3}{2}
      $$

      **Comprobación.** El punto medio de $(2,0)$ y $(0,4)$ es $(1,2)$, y tiene
      que estar en la recta: $\frac12+\frac32 = 2$. Cuadra.

