            <path class="f-i-elevado-eje" d="M166.5 122.2L173.5 122.2"/>
            <g class="f-i-elevado-n"><text x="163" y="71.4" text-anchor="end">0,208</text><text x="163" y="125.8" text-anchor="end">−0,208</text><text x="314" y="87" text-anchor="end">Re</text><text x="176" y="36">Im</text></g>
            <path class="f-i-elevado-c" d="M32.5 95L307.5 95"/>
            <circle class="f-i-elevado-pt" cx="170" cy="67.8" r="4.4"/>
            <circle class="f-i-elevado-hueco" cx="170" cy="122.2" r="4.4"/>
            <text class="f-i-elevado-l" x="179" y="62.8" text-anchor="start" fill="var(--live)">z = e^(−π/2) i</text>
            <text class="f-i-elevado-l" x="179" y="135.2" text-anchor="start" fill="var(--flag)">z̄ excluido</text>
            <text class="f-i-elevado-l" x="30" y="24" text-anchor="start" fill="var(--live)">el lugar es TODO el eje real</text>
          </svg>
        consigna: |
          Dibuja en el plano complejo el valor principal $z$, su conjugado, y el
          lugar geométrico de los $w$. Marca la escala, que es pequeña.
        comprueba:
          - punto: |
              $z$ sobre el **eje imaginario positivo**, a altura
              $e^{-\pi/2}\approx0{,}208$.
            porque: |
              Es imaginario puro, y está mucho más cerca del origen que $i$. Ese
              módulo menor que $1$ es lo llamativo del ejercicio y tiene que
              verse en el dibujo.
          - punto: |
              $\overline z$ simétrico respecto del eje real, a $-0{,}208$.
            porque: |
              Conjugar es reflejar en el eje real. Dibujar los dos puntos es lo
              que explica el lugar geométrico.
          - punto: |
              El **eje real completo** como lugar de los $w$.
            porque: |
              Los $w$ que equidistan de $z$ y de $\overline z$ forman la
              mediatriz del segmento vertical que los une, que es el eje real.
          - punto: |
              El punto $\overline z$ marcado como excluido.
            porque: |
              Ahí el denominador se anula. No está sobre el eje real, así que no
              recorta nada, pero decirlo es parte de la respuesta completa.
        veredicto: |
          El valor de $z$ no interviene en el lugar geométrico: cualquier
          imaginario puro daría el mismo eje real. Ver los dos puntos simétricos
          en el dibujo es lo que hace evidente esa independencia.

    resolucion: |
      **Resultados.** $z = e^{-\pi/2}\,i \approx 0{,}207880\,i$, y el lugar
      geométrico de $w$ es **el eje real**, $\operatorname{Im}w=0$.

      ### 1 · El valor principal

      Por definición, $a^{b}=e^{b\operatorname{Log}a}$, y la rama principal
      toma $\operatorname{Log}i = \ln 1 + i\tfrac\pi2 = \tfrac{i\pi}{2}$:

      $$
      i^{\,1+i} = e^{\left(1+i\right)\frac{i\pi}{2}}
      = e^{\frac{i\pi}{2}+\frac{i^{2}\pi}{2}}
      = e^{-\frac{\pi}{2}}\,e^{\frac{i\pi}{2}}
      = e^{-\pi/2}\,i
      $$

      $$
      \left\lvert z\right\rvert = e^{-\pi/2}\approx0{,}207880,
      \qquad \arg z = \frac{\pi}{2}
      $$

      Lo llamativo del resultado: **una potencia de $i$ que no está en la
      circunferencia unidad**. La culpa es de la parte imaginaria del
      exponente, que al multiplicar por $i\tfrac\pi2$ produce un término real
      negativo y encoge el módulo.

      *(Los demás valores de la potencia son
      $e^{-\pi/2-2k\pi}i$, con $k$ entero: infinitos, todos imaginarios puros
      positivos, cada uno $e^{2\pi}\approx535$ veces menor que el anterior.)*

      ### 2 · El lugar geométrico

      $$
      \left\lvert\frac{w-z}{w-\overline{z}}\right\rvert = 1
      \iff
      \lvert w-z\rvert = \lvert w-\overline{z}\rvert
      $$

      Los $w$ que **equidistan** de $z$ y de $\overline{z}$: la mediatriz del
      segmento que los une.

      Y aquí está la gracia: $z$ y $\overline{z}$ son simétricos respecto del eje
      real —esa es la definición de conjugado—, así que su mediatriz es el
      propio **eje real**:

      $$
      \operatorname{Im}w = 0
      $$

      ### 3 · Con cuentas, por si se pide

      Con $z=ci$ y $\overline{z}=-ci$, donde $c=e^{-\pi/2}$, y $w=x+iy$:

      $$
      x^{2}+\left(y-c\right)^{2} = x^{2}+\left(y+c\right)^{2}
      $$

      $$
      -2cy = 2cy \;\Longrightarrow\; y=0
      $$

      El valor de $c$ **no interviene**: cualquier $c\ne0$ daría el mismo
      resultado. Por eso el lugar geométrico se puede escribir antes de haber
      calculado la potencia.

      ### 4 · Lo que hay que excluir

      $w=\overline{z} = -e^{-\pi/2}i$ anula el denominador. Como no está en el eje
      real, la respuesta no cambia — pero decirlo es parte de la respuesta
      completa.

      **Lo que hay que llevarse.** Dos ideas independientes en un solo
      ejercicio: la potencia compleja es $e^{b\operatorname{Log}a}$ y su valor
      principal sale de fijar el argumento en $\left(-\pi,\pi\right]$; y un
      cociente de módulo $1$ es siempre una mediatriz. La segunda no necesita
      la primera.
  - id: ej-potencia-por-de-moivre
    titulo: Una potencia alta, sin desarrollar el binomio
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Calcular
      $$
      \left(1+i\right)^{8}
      $$
    pide: El resultado, en forma binómica.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por dónde se empieza una potencia octava de un complejo?
        opciones:
          - texto: Pasando el número a forma polar, y elevando módulo y argumento
            correcta: true
            mensaje: |
              Eso es. En polar la potencia es una multiplicación: el módulo se
              eleva y el argumento se multiplica por el exponente. Eso es De
              Moivre, y convierte ocho productos en dos cuentas.
          - texto: Desarrollando el binomio de Newton con nueve términos
            mensaje: |
              Se puede, y sale. Pero son nueve términos con sus potencias de $i$
              y es justo lo que De Moivre existe para evitar: en un examen con
              reloj, ese camino cuesta diez minutos y este dos.
          - texto: Multiplicando el número por sí mismo ocho veces seguidas
            mensaje: |
              Siete multiplicaciones de complejos, cada una con su parte real y
              su parte imaginaria. Es el camino más largo de los tres y el que
              más ocasiones da de equivocarse en un signo.
      - tipo: calcular
        titulo: El módulo y el argumento
        pregunta: |
          Escribe $1+i$ en forma polar. ¿Cuánto vale su módulo?
        respuesta:
          tipo: numero
          valor: '1.41421356'
          tolerancia: 0.001
          formato: en forma exacta, o con tres decimales
        distractores:
          - valor: '2'
            mensaje: |
              Ese es el módulo **al cuadrado**. El módulo es la raíz de
              $1^{2}+1^{2}$, no la suma.
          - valor: '1'
            mensaje: |
              Ese sería el módulo si el número fuera $1$ o $i$ por separado. Con
              las dos partes iguales a uno, la diagonal del cuadrado mide
              $\sqrt{2}$.
        pista: |
          El módulo de $a+bi$ es $\sqrt{a^{2}+b^{2}}$, que aquí es la diagonal
          de un cuadrado de lado 1.
        desarrollo: |
          $$
          \left|1+i\right| = \sqrt{1^{2}+1^{2}} = \sqrt{2} \approx 1{,}414
          $$

          Y el argumento, por estar en el primer cuadrante con las dos partes
          iguales, es

          $$
          \arg\left(1+i\right) = \arctan\frac{1}{1} = \frac{\pi}{4}
          $$
      - tipo: calcular
        titulo: La potencia
        pregunta: |
          Elevando a la octava en forma polar, el módulo pasa a ser
          $\left(\sqrt{2}\right)^{8}$ y el argumento $8\cdot\frac{\pi}{4}$.
          ¿Cuánto vale el resultado?
        respuesta:
          tipo: numero
          valor: '16'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '-16'
            mensaje: |
              El argumento es $2\pi$, que es una vuelta entera y deja el número
              en el eje real **positivo**. Si te sale negativo, has tomado
              $\pi$ en vez de $2\pi$.
          - valor: '256'
            mensaje: |
              Has elevado a la octava el módulo al cuadrado. El módulo es
              $\sqrt{2}$, así que $\left(\sqrt{2}\right)^{8}=2^{4}=16$.
        pista: |
          $\left(\sqrt{2}\right)^{8} = 2^{4}$, y un argumento de $2\pi$ es una
          vuelta completa: el número cae en el eje real positivo.
        desarrollo: |
          $$
          \left(1+i\right)^{8}
          = \left(\sqrt{2}\right)^{8}\,e^{i\cdot 8\cdot\frac{\pi}{4}}
          = 2^{4}\,e^{i\,2\pi}
          = 16
          $$

          El argumento da la vuelta entera, así que el resultado no tiene parte
          imaginaria: es el número real $16$.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: Se pasa $1+i$ a forma polar, con módulo $\sqrt{2}$ y argumento $\pi/4$.
          - texto: Al elevar a la octava, el módulo se eleva y el argumento se multiplica por 8.
          - texto: Queda módulo $2^{4}=16$ y argumento $2\pi$, que es una vuelta entera.
          - texto: Un argumento de $2\pi$ deja el número en el eje real positivo, así que el resultado es $16$.
          - texto: Al elevar a la octava hay que multiplicar el módulo por 8, no elevarlo.
            trampa: true
            mensaje: |
              Es al revés, y es el error más repetido de De Moivre: el módulo se
              **eleva** al exponente y el argumento se **multiplica** por él. Si
              se multiplicase el módulo saldría $8\sqrt{2}$, que no es el
              resultado.
    resolucion: |
      En forma binómica esta potencia son nueve términos del binomio de Newton;
      en forma polar son dos cuentas. Ese es todo el contenido del ejercicio.

      **Paso a polar.**
      $$
      \left|1+i\right| = \sqrt{2},
      \qquad
      \arg\left(1+i\right)=\frac{\pi}{4}
      \;\Longrightarrow\;
      1+i = \sqrt{2}\,e^{i\pi/4}
      $$

      **De Moivre.** Elevar a $n$ eleva el módulo y multiplica el argumento:
      $$
      \left(1+i\right)^{8}
      = \left(\sqrt{2}\right)^{8} e^{i\,8\pi/4}
      = 2^{4} e^{i\,2\pi}
      = 16
      $$

      El argumento $2\pi$ es una vuelta completa, así que el afijo vuelve al eje
      real positivo y el resultado es un número real. Comprobación rápida sin
      polar: $\left(1+i\right)^{2}=2i$, y entonces
      $\left(1+i\right)^{8}=\left(2i\right)^{4}=16\,i^{4}=16$.
  - id: ej-apolonio-basico
    titulo: Dos distancias que no pesan igual
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Representar los afijos de los números complejos $z$ que verifican
      $$
      \left|z\right| = 2\left|z-3\right|
      $$
    pide: Qué figura es, y su centro y su radio.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos distancias ya no pesan igual: una vale el doble. ¿Qué figura sale?
        opciones:
          - texto: Una circunferencia, la de Apolonio
            correcta: true
            mensaje: |
              Eso es. Con las dos distancias al mismo peso saldría la mediatriz;
              en cuanto una pesa distinto de la otra, los cuadrados ya no se
              cancelan y queda una circunferencia.
          - texto: La mediatriz del segmento que une $0$ y $3$
            mensaje: |
              La mediatriz sale de $\left|z\right|=\left|z-3\right|$, con el
              mismo peso a los dos lados. El $2$ lo cambia todo: es justo lo que
              distingue este caso del anterior.
          - texto: Una elipse con focos en $0$ y en $3$
            mensaje: |
              La elipse sale de **sumar** dos distancias y fijar la suma. Aquí
              no se suman: una se compara con la otra multiplicada por dos.
      - tipo: calcular
        titulo: El radio
        pregunta: |
          Con $z=x+iy$ y elevando al cuadrado, la condición queda
          $x^{2}+y^{2} = 4\left[(x-3)^{2}+y^{2}\right]$. Completando cuadrados
          sale una circunferencia. ¿Cuánto vale su radio?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '4'
            mensaje: |
              Ese es el radio **al cuadrado**. Al completar cuadrados queda
              $(x-4)^{2}+y^{2}=4$, y el radio es la raíz de ese cuatro.
          - valor: '3'
            mensaje: |
              El $3$ es el punto del enunciado, no el radio. El centro tampoco
              está en $3$: sale desplazado a $4$.
        pista: |
          Desarrolla los dos lados, junta todo a un lado y divide entre $3$
          antes de completar cuadrados.
        desarrollo: |
          $$
          x^{2}+y^{2} = 4\left[(x-3)^{2}+y^{2}\right]
          = 4x^{2}-24x+36+4y^{2}
          $$

          $$
          0 = 3x^{2}+3y^{2}-24x+36
          \;\Longrightarrow\;
          x^{2}+y^{2}-8x+12 = 0
          $$

          $$
          (x-4)^{2}+y^{2} = 16-12 = 4
          $$

          Centro en $\left(4,0\right)$ y radio $2$. Obsérvese que el centro **no**
          es ninguno de los dos puntos del enunciado.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: Se escribe $z=x+iy$ y se elevan al cuadrado los dos lados para quitar las raíces.
          - texto: Los términos en $x^{2}$ e $y^{2}$ ya no se cancelan, porque a un lado van multiplicados por cuatro.
          - texto: Queda una ecuación de segundo grado que, completando cuadrados, es una circunferencia.
          - texto: El centro sale en $\left(4,0\right)$ y el radio es $2$.
          - texto: Como las dos distancias se comparan entre sí, los cuadrados se cancelan y queda una recta.
            trampa: true
            mensaje: |
              Eso pasa **solo** cuando las dos distancias van al mismo peso. Con
              el factor $2$, un lado queda multiplicado por $4$ al elevar al
              cuadrado y los términos cuadráticos no se pueden cancelar.
    resolucion: |
      La diferencia con la mediatriz cabe en una palabra: **el peso**. Si las dos
      distancias van al mismo, los términos cuadráticos se cancelan y queda una
      recta; en cuanto una pesa distinto, no se cancelan y queda una
      circunferencia — la de Apolonio.

      $$
      \left|z\right| = 2\left|z-3\right|
      \;\Longrightarrow\;
      x^{2}+y^{2} = 4\left[(x-3)^{2}+y^{2}\right]
      $$

      $$
      3x^{2}+3y^{2}-24x+36=0
      \;\Longrightarrow\;
      (x-4)^{2}+y^{2}=4
      $$

      Es la circunferencia de **centro $\left(4,0\right)$ y radio $2$**. Merece la
      pena quedarse con que el centro no es ninguno de los dos puntos que aparecen
      en el enunciado: está fuera del segmento que los une, del lado del punto que
      pesa más.

  - id: ej-arco-capaz-basico
    titulo: Un argumento fijo, y el arco que dibuja
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Representar los afijos de los números complejos $z$ que verifican
      $$
      \arg\frac{z-1}{z+1} = \frac{\pi}{2}
      $$
    pide: Qué figura es, y el radio de la circunferencia que la contiene.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué significa geométricamente que ese argumento valga $\pi/2$?
        opciones:
          - texto: Que los segmentos que van de $z$ a $1$ y a $-1$ forman un ángulo recto
            correcta: true
            mensaje: |
              Eso es. El argumento de un cociente es la resta de los argumentos,
              o sea el ángulo que forman los dos segmentos. Fijarlo es fijar ese
              ángulo, y de ahí sale el arco capaz.
          - texto: Que $z$ está a la misma distancia de $1$ y de $-1$
            mensaje: |
              Eso sería una condición sobre los **módulos**, y daría la mediatriz.
              Aquí la condición es sobre el argumento, que es un ángulo.
          - texto: Que $z$ está en el eje imaginario
            mensaje: |
              El eje imaginario cumple la condición en un punto —$z=i$—, pero no
              en los demás. La condición no fija dónde está $z$, fija bajo qué
              ángulo se ven los dos puntos desde él.
      - tipo: calcular
        titulo: El radio
        pregunta: |
          Si los dos segmentos forman un ángulo recto, $z$ está en la
          circunferencia que tiene el segmento de $-1$ a $1$ como diámetro.
          ¿Cuánto vale su radio?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              Ese es el **diámetro**: la distancia de $-1$ a $1$. El radio es la
              mitad.
          - valor: '0.5'
            mensaje: |
              Has dividido dos veces. La distancia entre los dos puntos es $2$ y
              el radio es su mitad, $1$.
        pista: |
          El ángulo recto se ve desde la circunferencia que tiene ese segmento
          como diámetro. Mide el segmento de $-1$ a $1$ y parte por la mitad.
        desarrollo: |
          Los puntos $-1$ y $1$ distan $2$, así que la circunferencia que los
          tiene como diámetro está centrada en el origen y tiene radio

          $$
          r = \frac{2}{2} = 1
          $$

          Y el signo del argumento decide **cuál de las dos mitades**: con
          $+\pi/2$ queda la semicircunferencia superior, $\operatorname{Im}z>0$,
          sin incluir los extremos $\pm 1$, donde el cociente no está definido o
          vale cero.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: El argumento de un cociente es la diferencia de los argumentos del numerador y el denominador.
          - texto: Esa diferencia es el ángulo bajo el que se ven $1$ y $-1$ desde $z$.
          - texto: Fijarlo en $\pi/2$ obliga a que ese ángulo sea recto, y el lugar de los puntos que ven un segmento bajo ángulo recto es la circunferencia de diámetro ese segmento.
          - texto: La circunferencia tiene centro en el origen y radio $1$, y el signo del argumento deja solo la mitad superior.
          - texto: Como el argumento es positivo, valen las dos mitades de la circunferencia.
            trampa: true
            mensaje: |
              El signo es justo lo que descarta una mitad. Desde la
              semicircunferencia inferior los dos puntos también se ven bajo
              ángulo recto, pero el argumento del cociente sale $-\pi/2$. Media
              circunferencia cumple la condición y la otra media no.
    resolucion: |
      Toda la dificultad está en leer el enunciado en lenguaje geométrico. El
      argumento de un cociente es la **resta** de argumentos:

      $$
      \arg\frac{z-1}{z+1} = \arg\left(z-1\right)-\arg\left(z+1\right)
      $$

      y esa resta es el ángulo que forman, vistos desde $z$, los segmentos que
      van a $1$ y a $-1$. Fijarla en $\pi/2$ es pedir que ese ángulo sea recto.

      El lugar de los puntos desde los que un segmento se ve bajo ángulo recto es
      **la circunferencia que tiene ese segmento como diámetro** — el arco capaz
      de 90°. Aquí el segmento va de $-1$ a $1$, así que la circunferencia está
      centrada en el origen y tiene radio $1$.

      El signo decide la mitad: con $+\pi/2$ queda la semicircunferencia
      **superior**, sin los extremos. Con $-\pi/2$ quedaría la inferior.

  - id: ej-parabola-basica
    titulo: Una distancia comparada con una coordenada
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Representar los afijos de los números complejos $z$ que verifican
      $$
      \left|z\right| = \operatorname{Re}\left(z\right)+2
      $$
    pide: Qué figura es y dónde está su vértice.
    pasos:
      - tipo: reconocer
        pregunta: |
          A un lado hay una distancia y al otro una coordenada. ¿Qué figura sale?
        opciones:
          - texto: Una parábola
            correcta: true
            mensaje: |
              Eso es. Comparar la distancia a un punto con la distancia a una
              recta es la definición de parábola, y $\operatorname{Re}(z)+2$ es
              la distancia a la recta vertical $x=-2$.
          - texto: Una circunferencia
            mensaje: |
              La circunferencia sale de igualar la distancia a un punto con un
              **número fijo**. Aquí el segundo miembro no es fijo: depende de
              dónde esté $z$.
          - texto: Una recta
            mensaje: |
              Al elevar al cuadrado se cancelan los $x^{2}$, sí, pero queda un
              $y^{2}$ sin pareja. Con un solo término cuadrático la figura es
              una parábola, no una recta.
      - tipo: calcular
        titulo: El vértice
        pregunta: |
          Con $z=x+iy$, elevando al cuadrado queda $x^{2}+y^{2}=(x+2)^{2}$.
          Simplificando sale $y^{2}=4(x+1)$. ¿Cuál es la coordenada $x$ del
          vértice?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número entero, con su signo
        distractores:
          - valor: '1'
            mensaje: |
              Signo cambiado. El vértice está donde $y=0$, o sea donde
              $4(x+1)=0$, y eso da $x=-1$.
          - valor: '-2'
            mensaje: |
              El $-2$ es la **directriz**, la recta vertical desde la que se mide
              la otra distancia. El vértice está a medio camino entre la
              directriz y el foco, que aquí es el origen.
        pista: |
          El vértice es el punto de la parábola con $y=0$. Sustituye y despeja.
        desarrollo: |
          $$
          \sqrt{x^{2}+y^{2}} = x+2
          \;\Longrightarrow\;
          x^{2}+y^{2} = x^{2}+4x+4
          $$

          $$
          y^{2} = 4x+4 = 4\left(x+1\right)
          $$

          Con $y=0$ queda $x=-1$: el vértice es el punto $\left(-1,0\right)$.
          Es una parábola de foco el origen y directriz la recta $x=-2$, abierta
          hacia la derecha.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: $\left|z\right|$ es la distancia de $z$ al origen, y $\operatorname{Re}(z)+2$ es la distancia de $z$ a la recta $x=-2$.
          - texto: Igualar la distancia a un punto con la distancia a una recta es la definición de parábola.
          - texto: Al elevar al cuadrado los $x^{2}$ se cancelan y queda $y^{2}=4(x+1)$.
          - texto: El vértice está en $\left(-1,0\right)$, a medio camino entre el foco y la directriz.
          - texto: Hay que elevar al cuadrado dos veces, una por cada lado de la igualdad.
            trampa: true
            mensaje: |
              Con una basta, y es lo que hace este caso más fácil que los de dos
              raíces: solo hay una raíz, la del módulo. Elevar dos veces mete
              términos que no existen y complica una cuenta de dos líneas.
    resolucion: |
      La clave es leer el segundo miembro como una distancia. Si $z=x+iy$:

      - $\left|z\right| = \sqrt{x^{2}+y^{2}}$ es la distancia de $z$ **al origen**.
      - $\operatorname{Re}(z)+2 = x+2$ es la distancia de $z$ **a la recta
        vertical $x=-2$**, siempre que $x\ge -2$.

      Igualar la distancia a un punto con la distancia a una recta es exactamente
      la definición de parábola, con foco el origen y directriz $x=-2$.

      $$
      x^{2}+y^{2} = \left(x+2\right)^{2} = x^{2}+4x+4
      \;\Longrightarrow\;
      y^{2}=4\left(x+1\right)
      $$

      Vértice en $\left(-1,0\right)$ —a medio camino entre foco y directriz— y
      abierta hacia la derecha. Aquí solo hay **una** raíz, así que se eleva al
      cuadrado una sola vez: esa es la diferencia con los lugares de dos
      distancias, donde hay que aislar y elevar dos veces.

  - id: ej-condicion-sobre-un-cociente
    titulo: Cuando la condición viene sobre un cociente
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Representar los afijos de los números complejos $z\neq 0$ que verifican
      $$
      \operatorname{Re}\left(\frac{1}{z}\right) = \frac{1}{2}
      $$
    pide: Qué figura es, y su centro y su radio.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es el primer paso ante una condición sobre la parte real de un cociente?
        opciones:
          - texto: Racionalizar el cociente para separar su parte real
            correcta: true
            mensaje: |
              Eso es. Mientras la $z$ esté en el denominador no se puede leer
              ninguna parte real. Se multiplica arriba y abajo por el conjugado y
              entonces la condición se puede escribir en $x$ e $y$.
          - texto: Escribir $z$ en forma polar y tomar el coseno
            mensaje: |
              Se puede, pero complica: saldría una condición con $\cos\theta$ y
              $r$ mezclados. Racionalizar deja directamente una ecuación en $x$
              e $y$, que es lo que hace falta para reconocer la figura.
          - texto: Elevar los dos lados al cuadrado
            mensaje: |
              No hay ninguna raíz que quitar: la condición es sobre una parte
              real, no sobre un módulo. Elevar al cuadrado aquí mete soluciones
              que no cumplen la condición original.
      - tipo: calcular
        titulo: El radio
        pregunta: |
          Racionalizando, $\frac{1}{z}=\frac{x-iy}{x^{2}+y^{2}}$, así que la
          condición es $\frac{x}{x^{2}+y^{2}}=\frac{1}{2}$. Completando
          cuadrados sale una circunferencia. ¿Cuánto vale su radio?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              El $2$ es el denominador de la condición, y acaba siendo el
              **diámetro**. Al completar cuadrados queda $(x-1)^{2}+y^{2}=1$.
          - valor: '0.5'
            mensaje: |
              Ese es el valor de la parte real que fija el enunciado, no una
              longitud de la figura. El radio sale de completar cuadrados.
        pista: |
          Pasa el denominador multiplicando: $2x = x^{2}+y^{2}$. Ahora agrupa los
          términos en $x$ y completa el cuadrado.
        desarrollo: |
          $$
          \frac{1}{z} = \frac{\overline{z}}{\left|z\right|^{2}}
          = \frac{x-iy}{x^{2}+y^{2}}
          \;\Longrightarrow\;
          \operatorname{Re}\left(\frac{1}{z}\right)=\frac{x}{x^{2}+y^{2}}
          $$

          $$
          \frac{x}{x^{2}+y^{2}}=\frac{1}{2}
          \;\Longrightarrow\;
          2x = x^{2}+y^{2}
          \;\Longrightarrow\;
          \left(x-1\right)^{2}+y^{2}=1
          $$

          Circunferencia de centro $\left(1,0\right)$ y radio $1$, **sin el
          origen**, que está en ella pero lo excluye el enunciado.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: Se racionaliza multiplicando arriba y abajo por el conjugado de $z$.
          - texto: La parte real del cociente queda $\dfrac{x}{x^{2}+y^{2}}$.
          - texto: Igualada a $1/2$ y quitando denominadores sale $x^{2}+y^{2}=2x$.
          - texto: Completando cuadrados es la circunferencia de centro $\left(1,0\right)$ y radio $1$, quitando el origen.
          - texto: El origen entra en la figura, porque cumple la ecuación final.
            trampa: true
            mensaje: |
              Cumple la ecuación de la circunferencia, pero **no** la condición
              del enunciado: en $z=0$ el cociente $1/z$ no existe. Al quitar
              denominadores se ha ganado un punto que hay que devolver.
    resolucion: |
      Mientras la incógnita esté en el denominador no hay parte real que leer, así
      que el ejercicio empieza siempre igual: **racionalizar**.

      $$
      \frac{1}{z}=\frac{\overline{z}}{\left|z\right|^{2}}=\frac{x-iy}{x^{2}+y^{2}}
      \;\Longrightarrow\;
      \operatorname{Re}\left(\frac{1}{z}\right)=\frac{x}{x^{2}+y^{2}}
      $$

      La condición se convierte entonces en una ecuación corriente:

      $$
      \frac{x}{x^{2}+y^{2}}=\frac{1}{2}
      \;\Longrightarrow\;
      x^{2}+y^{2}-2x=0
      \;\Longrightarrow\;
      \left(x-1\right)^{2}+y^{2}=1
      $$

      Es la circunferencia de **centro $\left(1,0\right)$ y radio $1$**, y hay que
      quitarle el origen: al multiplicar por $x^{2}+y^{2}$ se ha ganado la
      solución $z=0$, que la ecuación final admite y el enunciado no. Ese punto
      perdido es lo que más se olvida de este tipo.
  - id: ej-raices-cubicas-de-ocho
    titulo: Las tres raíces cúbicas de un número real
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Resolver en el campo complejo
      $$
      z^{3} = 8
      $$
    pide: Las tres soluciones, y el polígono que forman.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántas soluciones tiene esta ecuación en el campo complejo?
        opciones:
          - texto: Tres, repartidas a la misma distancia del origen
            correcta: true
            mensaje: |
              Eso es. Una ecuación $z^{n}=w$ tiene exactamente $n$ soluciones, y
              las $n$ tienen el mismo módulo: están en los vértices de un
              polígono regular de $n$ lados centrado en el origen.
          - texto: Una sola, el $2$
            mensaje: |
              El $2$ es la única raíz **real**, y es la que da la calculadora.
              Pero en el campo complejo hay tres, y las otras dos se pierden si
              no se pasa a forma polar.
          - texto: Infinitas, como pasa con el logaritmo
            mensaje: |
              Las infinitas salen cuando la incógnita está en un exponente, como
              en $e^{z}=w$. Aquí la incógnita está en la base y el exponente es
              un entero: son exactamente tres.
      - tipo: calcular
        titulo: El módulo de las raíces
        pregunta: |
          Si $z=r\,e^{i\theta}$, la ecuación pide $r^{3}=8$. ¿Cuánto vale $r$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '8'
            mensaje: |
              Ese es el módulo del número de la derecha, no el de las raíces. El
              módulo de cada raíz es la raíz cúbica de $8$.
          - valor: '2.828'
            mensaje: |
              Esa es la raíz **cuadrada** de ocho. El exponente de la ecuación es
              tres, así que hay que sacar la raíz cúbica.
        pista: |
          Al elevar en forma polar, el módulo se eleva. Deshaz esa operación:
          $r=\sqrt[3]{8}$.
        desarrollo: |
          Escribiendo $z=r\,e^{i\theta}$ y usando De Moivre,

          $$
          z^{3} = r^{3}e^{i3\theta} = 8 = 8\,e^{i\,0}
          $$

          Igualando módulos, $r^{3}=8$ y por tanto $r=2$. Igualando argumentos
          **módulo $2\pi$**,

          $$
          3\theta = 0 + 2k\pi
          \;\Longrightarrow\;
          \theta = \frac{2k\pi}{3},\qquad k=0,1,2
          $$

          que da $\theta = 0,\ \frac{2\pi}{3},\ \frac{4\pi}{3}$: tres argumentos
          separados $120°$, y a partir de $k=3$ se repiten.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: Se escribe la incógnita en forma polar, $z=r\,e^{i\theta}$, y el segundo miembro también.
          - texto: Igualando módulos sale $r^{3}=8$, o sea $r=2$ para las tres.
          - texto: Igualando argumentos y sumando vueltas enteras sale $\theta=2k\pi/3$.
          - texto: 'Con $k=0,1,2$ salen tres argumentos distintos, y a partir de ahí se repiten: los tres afijos forman un triángulo equilátero.'
          - texto: Al igualar los argumentos no hace falta sumar $2k\pi$, porque el argumento es único.
            trampa: true
            mensaje: |
              Ahí se pierden dos de las tres soluciones, y es el error clásico
              del tema. El argumento está definido salvo vueltas enteras, y son
              precisamente esas vueltas las que, al dividir entre tres, dan tres
              ángulos distintos.
    resolucion: |
      En forma binómica esta ecuación no se sabe resolver; en forma polar es
      inmediata. Escribiendo $z=r\,e^{i\theta}$ y $8=8\,e^{i0}$:

      $$
      r^{3}e^{i3\theta} = 8\,e^{i\,0}
      \;\Longrightarrow\;
      \begin{cases}
        r^{3}=8 & \Rightarrow r=2\\[4pt]
        3\theta = 0+2k\pi & \Rightarrow \theta = \dfrac{2k\pi}{3}
      \end{cases}
      $$

      Con $k=0,1,2$ salen los tres argumentos $0$, $\frac{2\pi}{3}$ y
      $\frac{4\pi}{3}$; con $k=3$ se vuelve al primero. Las soluciones son

      $$
      z_{0}=2,\qquad
      z_{1}=2e^{i2\pi/3}=-1+i\sqrt{3},\qquad
      z_{2}=2e^{i4\pi/3}=-1-i\sqrt{3}
      $$

      Los tres afijos están sobre la circunferencia de radio $2$ y separados
      $120°$: forman un **triángulo equilátero** centrado en el origen. Esa es la
      comprobación de un vistazo — si las raíces no salen repartidas a ángulos
      iguales, hay un error.

  - id: ej-ecuacion-con-conjugado
    titulo: Una ecuación con la z y su conjugado a la vez
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Resolver en el campo complejo
      $$
      z^{2} = \overline{z}
      $$
    pide: Todas las soluciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          Aparecen a la vez $z$ y $\overline{z}$. ¿Por dónde se empieza?
        opciones:
          - texto: Tomando módulos en los dos lados, que separa los casos
            correcta: true
            mensaje: |
              Eso es. El módulo convierte la ecuación compleja en una real, y de
              ella salen los posibles módulos. Después, con el módulo ya sabido,
              la ecuación original se simplifica sola.
          - texto: Sustituyendo $z=x+iy$ y resolviendo el sistema
            mensaje: |
              Se puede, y acaba saliendo: quedan dos ecuaciones reales de segundo
              grado. Pero es el camino largo, y en un examen con reloj el de los
              módulos ahorra media página.
          - texto: Pasando todo a un lado y factorizando como un polinomio
            mensaje: |
              No se puede: $\overline{z}$ **no** es un polinomio en $z$. Las
              reglas de factorización no valen mientras el conjugado esté
              presente.
      - tipo: calcular
        titulo: Cuántas soluciones
        pregunta: |
          Tomando módulos sale $\left|z\right|^{2}=\left|z\right|$, o sea
          $\left|z\right|=0$ o $\left|z\right|=1$. Contando las que salen de cada
          caso, ¿cuántas soluciones tiene la ecuación en total?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '3'
            mensaje: |
              Te has dejado el $z=0$, que sale del caso $\left|z\right|=0$ y
              cumple la ecuación. El caso del módulo nulo parece trivial y por
              eso se olvida.
          - valor: '2'
            mensaje: |
              Con $\left|z\right|=1$ la ecuación se convierte en $z^{3}=1$, que
              tiene **tres** soluciones y no dos. Y hay que sumarle el origen.
        pista: |
          Si $\left|z\right|=1$ entonces $\overline{z}=1/z$. Sustituye eso en la
          ecuación y mira en qué se convierte.
        desarrollo: |
          **Módulos.** $\left|z^{2}\right|=\left|\overline{z}\right|$ da
          $\left|z\right|^{2}=\left|z\right|$, luego $\left|z\right|=0$ o
          $\left|z\right|=1$.

          **Caso $\left|z\right|=0$.** Es $z=0$, y cumple la ecuación: una
          solución.

          **Caso $\left|z\right|=1$.** Entonces $z\overline{z}=1$, o sea
          $\overline{z}=1/z$. Sustituyendo,

          $$
          z^{2}=\frac{1}{z}
          \;\Longrightarrow\;
          z^{3}=1
          $$

          que tiene tres soluciones. En total, $1+3=4$.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: Se toman módulos en los dos lados, lo que da $\left|z\right|^{2}=\left|z\right|$.
          - texto: De ahí, o el módulo es cero —y entonces $z=0$— o el módulo es uno.
          - texto: Si el módulo es uno, $\overline{z}=1/z$, y la ecuación se convierte en $z^{3}=1$.
          - texto: Sumando el origen y las tres raíces cúbicas de la unidad, hay cuatro soluciones.
          - texto: Como $\left|z\right|^{2}=\left|z\right|$, se puede dividir entre $\left|z\right|$ y queda $\left|z\right|=1$.
            trampa: true
            mensaje: |
              Dividir entre $\left|z\right|$ da por hecho que no es cero, y ahí
              se pierde la solución $z=0$. Es el mismo descuido que en cualquier
              ecuación real: antes de dividir por algo hay que preguntarse si
              puede valer cero.
    resolucion: |
      La regla del tipo: **cuando aparecen $z$ y $\overline{z}$ juntos, se toman
      módulos primero**. El módulo convierte la ecuación compleja en una ecuación
      real, y el resultado simplifica la original.

      $$
      \left|z^{2}\right|=\left|\overline{z}\right|
      \;\Longrightarrow\;
      \left|z\right|^{2}=\left|z\right|
      \;\Longrightarrow\;
      \left|z\right|\left(\left|z\right|-1\right)=0
      $$

      **Sin dividir**, que ahí se pierde una solución: o $\left|z\right|=0$ o
      $\left|z\right|=1$.

      - Si $\left|z\right|=0$, entonces $z=0$, que cumple la ecuación.
      - Si $\left|z\right|=1$, entonces $z\overline{z}=1$ y por tanto
        $\overline{z}=1/z$. La ecuación pasa a ser $z^{2}=1/z$, es decir
        $z^{3}=1$, cuyas soluciones son $1$, $e^{i2\pi/3}$ y $e^{i4\pi/3}$.

      En total **cuatro soluciones**: el origen y los tres vértices de un
      triángulo equilátero inscrito en la circunferencia unidad.

  - id: ej-girar-para-completar-la-figura
    titulo: Girar un vértice para encontrar los demás
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Un triángulo equilátero tiene su centro en el origen y uno de sus vértices
      en $z_{0}=1$. Hallar los otros dos vértices.
    pide: Los otros dos vértices, en forma polar o binómica.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué operación con complejos lleva un vértice al siguiente?
        opciones:
          - texto: Multiplicar por una exponencial de módulo uno
            correcta: true
            mensaje: |
              Eso es. Multiplicar por $e^{i\alpha}$ gira un ángulo $\alpha$
              alrededor del origen sin cambiar el módulo, que es exactamente lo
              que hace falta si el centro está en el origen.
          - texto: Sumar un número complejo fijo
            mensaje: |
              Sumar traslada, no gira: movería el triángulo entero de sitio en
              vez de recorrer sus vértices. Aquí el centro no se mueve.
          - texto: Conjugar el vértice conocido
            mensaje: |
              Conjugar refleja respecto del eje real. Con $z_{0}=1$ el conjugado
              es él mismo, así que no lleva a ninguna parte.
      - tipo: calcular
        titulo: El ángulo de giro
        pregunta: |
          ¿Cuántos grados hay que girar para pasar de un vértice al siguiente en
          un triángulo equilátero centrado en el origen?
        respuesta:
          tipo: numero
          valor: '120'
          tolerancia: 0.01
          formato: en grados
        distractores:
          - valor: '60'
            mensaje: |
              $60°$ es el ángulo **interior** de un triángulo equilátero, que es
              otra cosa. Los vértices se reparten la vuelta entera: $360/3$.
          - valor: '90'
            mensaje: |
              Ese sería el giro de un cuadrado, con cuatro vértices. Con tres, la
              vuelta se reparte en tres partes.
        pista: |
          Los tres vértices se reparten la circunferencia a partes iguales.
          Divide la vuelta completa entre el número de vértices.
        desarrollo: |
          Los $n$ vértices de un polígono regular centrado en el origen se
          reparten la vuelta a partes iguales, así que el giro de uno al
          siguiente es

          $$
          \alpha = \frac{360°}{n} = \frac{360°}{3} = 120° = \frac{2\pi}{3}
          $$

          Y entonces
          $$
          z_{1}=z_{0}\,e^{i2\pi/3}=e^{i2\pi/3}=-\frac{1}{2}+i\frac{\sqrt{3}}{2}
          $$
          $$
          z_{2}=z_{0}\,e^{i4\pi/3}=e^{i4\pi/3}=-\frac{1}{2}-i\frac{\sqrt{3}}{2}
          $$
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: Con el centro en el origen, los tres vértices tienen el mismo módulo, que aquí vale $1$.
          - texto: Multiplicar por $e^{i\alpha}$ gira el ángulo $\alpha$ sin tocar el módulo.
          - texto: Los tres vértices se reparten la vuelta, así que $\alpha=2\pi/3$.
          - texto: Los otros dos vértices son $e^{i2\pi/3}$ y $e^{i4\pi/3}$.
          - texto: Si el centro no estuviese en el origen, bastaría con girar igual alrededor del origen.
            trampa: true
            mensaje: |
              No: girar alrededor del origen movería el centro de sitio. Con el
              centro en $c$ hay que restar $c$, girar y volver a sumarlo —
              $z_{k}=c+\left(z_{0}-c\right)e^{ik\alpha}$—, y esa es la versión
              que cae en examen.
    resolucion: |
      Todo el ejercicio cabe en una frase: **multiplicar por una exponencial de
      módulo uno es girar alrededor del origen**.

      Como el centro está en el origen, los tres vértices tienen el mismo módulo
      —aquí $\left|z_{0}\right|=1$— y solo se diferencian en el argumento. Los
      tres se reparten la vuelta a partes iguales, así que el giro de uno al
      siguiente es $2\pi/3$, o sea $120°$:

      $$
      z_{k}=z_{0}\,e^{i\,2k\pi/3},\qquad k=0,1,2
      $$

      $$
      z_{1}=-\frac{1}{2}+i\frac{\sqrt{3}}{2},
      \qquad
      z_{2}=-\frac{1}{2}-i\frac{\sqrt{3}}{2}
      $$

      **La versión de examen añade un detalle**: si el centro está en un punto
      $c$ que no es el origen, primero se traslada, luego se gira y luego se
      deshace la traslación —
      $z_{k}=c+\left(z_{0}-c\right)e^{i\,2k\pi/n}$—. Girar directamente alrededor
      del origen movería la figura de sitio.

  - id: ej-exponencial-con-infinitas-soluciones
    titulo: Una exponencial con infinitas soluciones
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Resolver en el campo complejo
      $$
      e^{z} = -1
      $$
    pide: Todas las soluciones.
    pasos:
      - tipo: reconocer
        pregunta: |
          En los reales esta ecuación no tiene solución. ¿Qué pasa en los complejos?
        opciones:
          - texto: Tiene infinitas, separadas entre sí por múltiplos de $2\pi i$
            correcta: true
            mensaje: |
              Eso es. La exponencial compleja es periódica de periodo $2\pi i$,
              así que en cuanto hay una solución hay infinitas, todas en la misma
              recta vertical y separadas $2\pi$.
          - texto: Sigue sin tener solución, porque la exponencial nunca es negativa
            mensaje: |
              Eso vale en los reales. En los complejos $e^{i\pi}=-1$, que es la
              identidad de Euler: la exponencial compleja sí toma valores
              negativos, y de hecho todos menos el cero.
          - texto: Tiene exactamente una
            mensaje: |
              Tendría una si la exponencial fuese inyectiva, y no lo es: es
              periódica. Por eso el logaritmo complejo no es una función sino
              infinitas ramas.
      - tipo: calcular
        titulo: La primera solución
        pregunta: |
          Escribiendo $-1$ en forma polar y tomando logaritmos, las soluciones
          son imaginarias puras. ¿Cuál es la parte imaginaria de la solución
          con parte imaginaria positiva más pequeña?
        respuesta:
          tipo: numero
          valor: '3.14159265'
          tolerancia: 0.001
          formato: en forma exacta, o con tres decimales
        distractores:
          - valor: '6.28318'
            mensaje: |
              Ese es $2\pi$, que es el **periodo**: la distancia de una solución
              a la siguiente. La primera está en $\pi$.
          - valor: '1.5708'
            mensaje: |
              Ese es $\pi/2$, y sería el argumento de $i$, no de $-1$. El número
              $-1$ está en el eje real negativo, a media vuelta del positivo.
        pista: |
          $-1$ tiene módulo $1$ y argumento $\pi$. Con módulo uno, la parte real
          de $z$ es cero y solo queda el argumento.
        desarrollo: |
          En forma polar, $-1 = 1\cdot e^{i\pi}$, y con las vueltas,
          $-1 = e^{i\left(\pi+2k\pi\right)}$ para todo entero $k$.

          Escribiendo $z=x+iy$, la ecuación $e^{x}e^{iy}=e^{i(\pi+2k\pi)}$ se
          separa en dos:

          $$
          e^{x}=1 \;\Longrightarrow\; x=0,
          \qquad
          y = \pi + 2k\pi
          $$

          Las soluciones son $z = i\left(\pi+2k\pi\right)$, y la de parte
          imaginaria positiva más pequeña es $z=i\pi$, con parte imaginaria
          $\pi\approx 3{,}1416$.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: 'Se escribe $-1$ en forma polar: módulo $1$ y argumento $\pi$, más las vueltas enteras.'
          - texto: Se escribe $z=x+iy$, de modo que $e^{z}=e^{x}e^{iy}$.
          - texto: Igualando módulos sale $e^{x}=1$, o sea $x=0$.
          - texto: Igualando argumentos sale $y=\pi+2k\pi$, y las soluciones son $z=i\left(\pi+2k\pi\right)$.
          - texto: Como el módulo de $-1$ es uno, la parte imaginaria de $z$ tiene que ser cero.
            trampa: true
            mensaje: |
              Es al revés: el módulo fija la parte **real**, porque
              $\left|e^{z}\right|=e^{x}$. La parte imaginaria es la que queda
              libre y la que recoge el argumento con todas sus vueltas.
    resolucion: |
      En los reales la exponencial nunca es negativa y esta ecuación no tiene
      solución. En los complejos la tiene, y no una: **infinitas**.

      La razón es que la exponencial compleja es **periódica**, de periodo
      $2\pi i$. Escribiendo $z=x+iy$,

      $$
      e^{z}=e^{x}e^{iy}
      $$

      y el módulo del resultado es $e^{x}$ mientras que su argumento es $y$.
      Como $-1$ tiene módulo $1$ y argumento $\pi$ (más las vueltas):

      $$
      e^{x}=1 \Rightarrow x=0,
      \qquad
      y=\pi+2k\pi
      $$

      $$
      \boxed{\,z = i\left(\pi + 2k\pi\right),\quad k\in\mathbb{Z}\,}
      $$

      Todas las soluciones están en el **eje imaginario**, separadas $2\pi$ entre
      sí. La más pequeña con parte imaginaria positiva es $z=i\pi$, que es la
      identidad de Euler leída al revés. Y de aquí sale que el logaritmo complejo
      no sea una función sino infinitas ramas: cada $k$ es una.

  - id: ej-coseno-de-i
    titulo: El coseno de un número imaginario
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Usando la definición exponencial del coseno,
      $$
      \cos z = \frac{e^{iz}+e^{-iz}}{2}
      $$
      calcular $\cos i$.
    pide: El valor de cos(i), y si puede pasar de uno.
    pasos:
      - tipo: reconocer
        pregunta: |
          En los reales el coseno nunca pasa de $1$. ¿Y en los complejos?
        opciones:
          - texto: Sí puede, y de hecho toma cualquier valor
            correcta: true
            mensaje: |
              Eso es. La cota $\left|\cos x\right|\le 1$ vale solo sobre el eje
              real. Fuera de él la definición exponencial da exponenciales
              reales, que crecen sin límite.
          - texto: No, el coseno está acotado siempre por su definición
            mensaje: |
              La acotación no sale de la definición sino de que $e^{ix}$ tenga
              módulo uno, y eso solo pasa cuando $x$ es real. Con $z=i$ los dos
              sumandos son números reales, $e^{-1}$ y $e$.
          - texto: No, porque el coseno complejo no está definido fuera del eje real
            mensaje: |
              Sí lo está: esa es justamente la ventaja de definirlo con
              exponenciales, que la fórmula vale para cualquier $z$ complejo.
      - tipo: calcular
        titulo: El valor
        pregunta: |
          Sustituyendo $z=i$ en la definición, ¿cuánto vale $\cos i$?
        respuesta:
          tipo: numero
          valor: '1.54308063'
          tolerancia: 0.001
          formato: en forma exacta, o con tres decimales
        distractores:
          - valor: '0.5403'
            mensaje: |
              Ese es $\cos 1$, el coseno del número **real** uno. Aquí el
              argumento es $i$, y la $i$ del exponente se cancela con la del
              argumento.
          - valor: '1.1752'
            mensaje: |
              Ese es $\operatorname{senh}1$, que sale de **restar** las dos
              exponenciales y dividir entre dos. El coseno las suma.
        pista: |
          Con $z=i$, el exponente $iz$ vale $i\cdot i=-1$. Los dos sumandos son
          números reales.
        desarrollo: |
          $$
          \cos i = \frac{e^{i\cdot i}+e^{-i\cdot i}}{2}
          = \frac{e^{-1}+e^{1}}{2}
          $$

          $$
          = \frac{0{,}367879 + 2{,}718282}{2}
          = \frac{3{,}086161}{2}
          = 1{,}543081
          $$

          Que es exactamente $\cosh 1$: al entrar por el eje imaginario, el
          coseno se convierte en el coseno hiperbólico, y ese no está acotado.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: Se sustituye $z=i$ en la definición exponencial del coseno.
          - texto: El exponente $iz$ vale $i\cdot i = -1$, y $-iz$ vale $+1$.
          - texto: Los dos sumandos son exponenciales reales, $e^{-1}$ y $e$.
          - texto: Su semisuma vale $1{,}5431$, que es $\cosh 1$ y pasa de uno.
          - texto: El resultado tiene que salir entre $-1$ y $1$, porque es un coseno.
            trampa: true
            mensaje: |
              Esa cota solo vale sobre el eje real, y es justo lo que este
              ejercicio existe para romper. Sobre el eje imaginario el coseno
              complejo es el coseno hiperbólico, que crece sin límite.
    resolucion: |
      Definir el seno y el coseno con exponenciales no es un capricho de
      notación: es lo que permite calcularlos fuera del eje real. Y en cuanto se
      sale de él, la intuición de bachillerato deja de valer.

      $$
      \cos i = \frac{e^{i\cdot i}+e^{-i\cdot i}}{2}
      = \frac{e^{-1}+e}{2}
      = \cosh 1 \approx 1{,}5431
      $$

      **Pasa de uno.** La cota $\left|\cos x\right|\le 1$ se apoya en que
      $\left|e^{ix}\right|=1$, y eso solo es cierto cuando $x$ es real. Con $x$
      imaginario el exponente se vuelve real y las exponenciales crecen: sobre el
      eje imaginario, el coseno complejo **es** el coseno hiperbólico.

      De aquí sale también que una ecuación como $\cos z = 5$, que en los reales
      no tiene solución, sí la tenga en los complejos — y ese es el ejercicio que
      cae en examen.
