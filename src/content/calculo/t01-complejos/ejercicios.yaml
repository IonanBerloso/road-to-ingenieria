        consigna: |
          Dibuja los dos discos en el mismo plano y sombrea la lente donde se
          solapan. Marca los dos puntos de corte.
        comprueba:
          - punto: |
              El primer disco, de centro $\left(2,0\right)$ y radio $1$.
            porque: |
              Sale de la condición sobre la parte real. El centro **no** es $1$:
              el $z-1$ desplaza, pero el disco acaba centrado en $2$.
          - punto: |
              El segundo disco, de centro $\left(1,-1\right)$ y radio $1$.
            porque: |
              La condición sobre la parte imaginaria lleva un signo menos, y por
              eso el disco baja. Dibujarlo arriba coloca la lente en el
              cuadrante equivocado.
          - punto: |
              Los dos bordes a trazos, por ser desigualdades estrictas.
            porque: |
              La región es abierta, y eso se dibuja. Es la mitad de lo que se
              mira en este tipo de ejercicio.
          - punto: |
              Los cortes en $z=1$ y $z=2-i$, los dos con círculo hueco.
            porque: |
              $z=1$ es además el punto excluido de oficio, porque anula el
              denominador. Que caiga justo en una punta de la lente es la
              comprobación de que los centros están bien.
        veredicto: |
          Los dos puntos de corte están sobre la recta $x+y=1$, que sale de
          restar las ecuaciones de las dos circunferencias sin resolver nada. Es
          la comprobación más rápida del dibujo.

    resolucion: |
      **Datos.** Se pide la región de los $z$ con

      $$
      \operatorname{Re}\left(\frac{1}{z-1}\right) > \frac12
      \qquad\text{y}\qquad
      \operatorname{Im}\left(\frac{1}{z-1}\right) > \frac12
      $$

      ### 1 · Restricción previa

      $\frac{1}{z-1}$ exige $z \neq 1$. Se anota antes de operar.

      ### 2 · Separar parte real e imaginaria

      Multiplicando por el conjugado del denominador, con
      $D = |z-1|^{2} = (x-1)^{2}+y^{2}$:

      $$
      \frac{1}{z-1} = \frac{(x-1) - iy}{(x-1)^{2}+y^{2}} = \frac{(x-1) - iy}{D}
      $$

      $$
      \operatorname{Re}\left(\frac{1}{z-1}\right) = \frac{x-1}{D}, \qquad
      \operatorname{Im}\left(\frac{1}{z-1}\right) = \frac{-y}{D}
      $$

      ### 3 · Primera condición

      $$
      \frac{x-1}{D} > \frac12
      \;\Longleftrightarrow\;
      2(x-1) > (x-1)^{2}+y^{2}
      $$

      —multiplicar por $2D$ no cambia el sentido porque $D>0$— y agrupando:

      $$
      0 > x^{2}-4x+3+y^{2}
      \;\Longleftrightarrow\;
      (x-2)^{2}+y^{2} < 1
      $$

      ### 4 · Segunda condición

      $$
      \frac{-y}{D} > \frac12
      \;\Longleftrightarrow\;
      -2y > (x-1)^{2}+y^{2}
      $$

      $$
      \;\Longleftrightarrow\;
      (x-1)^{2}+y^{2}+2y < 0
      \;\Longleftrightarrow\;
      (x-1)^{2}+(y+1)^{2} < 1
      $$

      ### 5 · La región

      Dos discos abiertos de radio 1, con centros $(2,0)$ y $(1,-1)$. La
      distancia entre los centros es $\sqrt{1+1} = \sqrt2 \approx 1{,}41$, menor
      que la suma de los radios, así que **se cortan**: la región pedida es la
      lente de intersección.

      El punto excluido $z=1$ está a distancia 1 de los dos centros, o sea sobre
      las dos circunferencias, y las desigualdades son estrictas: ya estaba
      fuera.

      ### 6 · Comprobación

      Se toma un punto de la lente, por ejemplo $(1{,}6,\,-0{,}5)$:

      - $(1{,}6-2)^{2}+0{,}25 = 0{,}41 < 1$ ✔
      - $(1{,}6-1)^{2}+(-0{,}5+1)^{2} = 0{,}36+0{,}25 = 0{,}61 < 1$ ✔

      Y en la condición original, con $D = 0{,}36+0{,}25 = 0{,}61$:
      $\operatorname{Re} = \frac{0{,}6}{0{,}61} \approx 0{,}98 > 0{,}5$ ✔ y
      $\operatorname{Im} = \frac{0{,}5}{0{,}61} \approx 0{,}82 > 0{,}5$ ✔

      ### Resultado

      $$
      \boxed{\;(x-2)^{2}+y^{2} < 1 \quad\text{y}\quad (x-1)^{2}+(y+1)^{2} < 1\;}
      $$

  - id: lugar-argumento-cociente
    titulo: Un lugar geométrico que es un arco
    fuente: >-
      Ejercicio 1.23 · Problemas complementarios, tema 1 · Cálculo, UPV/EHU
      (2017/2018 1E)

    nivel: practica
    enunciado: |
      $$
      \arg\left(\frac{z-2}{z-1}\right) = \frac{\pi}{2}
      $$
    pide: >-
      Calcular y representar gráficamente el lugar geométrico de los afijos que
      cumplen la condición.

    pasos:
      - tipo: reconocer
        pregunta: |
          El argumento de un cociente es una diferencia de argumentos. ¿Qué
          significa geométricamente que valga $\frac{\pi}{2}$?
        opciones:
          - texto: >-
              Que los vectores que van de 2 a $z$ y de 1 a $z$ forman un ángulo
              recto
            correcta: true
            mensaje: |
              Eso es. $\arg(z-2)$ es la dirección del vector que va del punto 2
              al afijo de $z$, y lo mismo con 1. Su diferencia es el ángulo
              entre los dos vectores, y aquí vale $90°$.
          - texto: Que $z$ está a $90°$ del origen
            mensaje: |
              Eso sería $\arg(z) = \frac{\pi}{2}$, sin restas: el semieje
              imaginario positivo. Las restas cambian el punto desde el que se
              mide el ángulo.
          - texto: Que el cociente es un número real
            mensaje: |
              Argumento $\frac{\pi}{2}$ significa imaginario **puro**, con parte
              imaginaria positiva. Real sería argumento $0$ o $\pi$.
          - texto: Que $|z-2| = |z-1|$
            mensaje: |
              Eso es una condición sobre los **módulos**, y daría la mediatriz
              del segmento. Aquí la condición es sobre los argumentos.

      - tipo: calcular
        titulo: El radio del arco
        pregunta: |
          El lugar es un arco de circunferencia. ¿Cuál es su radio?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Ese es el **diámetro**: la distancia entre los puntos 1 y 2, que
              son los extremos del segmento. El radio es la mitad.
          - valor: '2'
            mensaje: |
              El 2 es uno de los puntos del enunciado, no una longitud del
              lugar. La distancia entre 1 y 2 es 1, y el radio, $\frac12$.
          - valor: '1.5'
            mensaje: |
              Ese es el centro —la abscisa del punto medio entre 1 y 2—, no el
              radio.
        pista: |
          Por el teorema del ángulo inscrito, ver un segmento bajo $90°$ ocurre
          sobre la circunferencia que tiene ese segmento como **diámetro**. El
          segmento va del 1 al 2.
        desarrollo: |
          Los puntos son $1$ y $2$, a distancia 1. Ese segmento es el diámetro
          de la circunferencia, luego

          $$
          r = \frac{1}{2}, \qquad \text{centro} = \left(\frac{3}{2},\, 0\right)
          $$
        veredicto: |
          La ecuación de la circunferencia completa es
          $\left(x-\frac32\right)^{2}+y^{2} = \frac14$. Falta decidir qué parte
          de ella sirve.

      - tipo: verificar
        pregunta: |
          Escribe en $x$ e $y$ el lugar que sale de imponer que ese cociente
          tenga argumento $\pi/2$. La figura comprobará si tu curva coincide con la
          del enunciado.
        condicion: 'arg((z-2)/(z-1)) = pi/2'
        ventana:
          x: [-1, 4]
          y: [-2, 3]
        formato: en x e y; usa ^2 para los cuadrados, y & para juntar dos condiciones
        pista: |
          Un número tiene argumento $\pi/2$ cuando su parte real es **cero** y su
          parte imaginaria es **positiva**. Son dos condiciones, no una: la primera
          da la curva y la segunda decide con qué trozo te quedas.
        desarrollo: |
          Con $z = x+iy$, racionalizando el cociente:

          $$
          \frac{z-2}{z-1}
          = \frac{\left[(x-2)+iy\right]\left[(x-1)-iy\right]}{|z-1|^{2}}
          = \frac{(x-2)(x-1)+y^{2} + iy}{|z-1|^{2}}
          $$

          La parte imaginaria del numerador es $y$, así que exigir argumento $\pi/2$
          es pedir dos cosas a la vez:

          $$
          (x-2)(x-1)+y^{2} = 0 \quad\text{y}\quad y > 0
          $$

          La primera, completando cuadrados, es
          $\left(x-\frac32\right)^{2}+y^{2} = \frac14$.
        veredicto: |
          La **semicircunferencia superior** de centro $\frac32$ y radio $\frac12$,
          sin los extremos $z=1$ y $z=2$: en el 1 el cociente no existe y en el 2
          vale cero, y el cero no tiene argumento.
      - tipo: justificar
        pregunta: |
          La condición no da la circunferencia entera, sino media. Ordena el
          razonamiento. Una de las piezas no debe entrar.
        piezas:
          - texto: |
              Hay que exigir $z \neq 1$ —el denominador— y $z \neq 2$, porque el
              argumento de 0 no está definido.
          - texto: |
              Por el teorema del ángulo inscrito, los puntos desde los que el
              segmento $[1,2]$ se ve bajo un ángulo recto forman la
              circunferencia de diámetro ese segmento.
          - texto: |
              Pero el enunciado no pide ángulo $\pm\frac{\pi}{2}$, sino
              exactamente $+\frac{\pi}{2}$: hay que quedarse con **un** sentido
              de giro.
          - texto: |
              Comprobando un punto concreto se ve cuál: en
              $z = \frac32 + \frac12 i$, el cociente vale $i$, cuyo argumento es
              $+\frac{\pi}{2}$. Vale la mitad superior.
          - texto: |
              Como la condición es una igualdad, el lugar geométrico es la
              circunferencia entera.
            trampa: true
            mensaje: |
              La igualdad fija el ángulo **con signo**. En la mitad inferior el
              segmento también se ve bajo $90°$, pero el argumento del cociente
              vale $-\frac{\pi}{2}$, que no es lo que pide el enunciado. Dar la
              circunferencia entera es duplicar la respuesta, y en un examen se
              penaliza igual que quedarse corto.
        veredicto: |
          El resultado es el **arco superior**, sin los extremos: la
          semicircunferencia con $y>0$.

