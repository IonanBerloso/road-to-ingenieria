ejercicios:
  - id: potencia-novena
    titulo: Potencia novena en forma binómica
    fuente: >-
      Adaptado del Ejercicio 1.1 · Problemas complementarios, tema 1 ·
      Cálculo, UPV/EHU (examen 2014/2015, 7.ª convocatoria)

    enunciado: |
      Sea el número complejo

      $$
      z = -1 - i
      $$
    pide: Calcular $z^{9}$ y dar el resultado en forma binómica.

    pasos:
      # ── COMP1 ────────────────────────────────────────────────────────
      - tipo: reconocer
        pregunta: |
          Antes de tocar nada: ¿qué camino lleva a $z^{9}$ sin que se te vaya
          la tarde?
        opciones:
          - texto: Pasar $z$ a forma polar y aplicar De Moivre
            correcta: true
            mensaje: |
              Eso es. En polar, elevar a la novena es elevar el módulo y
              multiplicar el argumento por nueve. Dos operaciones, cero
              productos de binomios.
          - texto: Desarrollar $(-1-i)^{9}$ con el binomio de Newton
            mensaje: |
              Se puede, y da lo mismo, pero son diez sumandos con potencias de
              $i$ que hay que reducir una a una. En un examen es donde aparecen
              los errores de signo y donde se agota el tiempo.
          - texto: Multiplicar $z$ por sí mismo nueve veces
            mensaje: |
              Llegas, pero arrastras cada error hasta el final y no tienes forma
              de comprobar el resultado. Es el camino que hace que un fallo de
              signo en el segundo producto te cueste el ejercicio entero.
          - texto: Calcular $|z|^{9}$, que es lo que pide la potencia
            mensaje: |
              El módulo es solo la mitad de la información. Sin el argumento no
              tienes un número complejo, tienes una distancia al origen: hay
              infinitos complejos con ese mismo módulo.

      # ── COMP2 · el módulo ────────────────────────────────────────────
      - tipo: calcular
        titulo: Módulo de z
        pregunta: ¿Cuánto vale $|z|$?
        respuesta:
          tipo: numero
          valor: '1.41421356'
          tolerancia: 0.01
          formato: un número; puedes escribirlo como √2
        distractores:
          - valor: '2'
            mensaje: |
              Te has quedado en $a^{2}+b^{2}=2$ y no has sacado la raíz. El
              módulo es $\sqrt{a^{2}+b^{2}}$, no $a^{2}+b^{2}$. Este error se
              amplifica: en el paso siguiente vas a elevarlo a la novena, y
              $2^{9}$ frente a $(\sqrt2)^{9}$ son 512 contra 22,6.
          - valor: '-1.41421356'
            mensaje: |
              El módulo es una distancia, así que nunca es negativo. Que las dos
              componentes sean negativas no arrastra el signo: se elevan al
              cuadrado antes de sumarlas.
        pista: $|z| = \sqrt{a^{2}+b^{2}}$, con $a=-1$ y $b=-1$.
        desarrollo: |
          $$
          |z| = \sqrt{(-1)^{2}+(-1)^{2}} = \sqrt{1+1} = \sqrt{2}
          $$
        veredicto: Módulo mayor que 1, así que al elevar a la novena el número crecerá mucho.

      # ── COMP4 · el argumento, que es donde se pierde el ejercicio ────
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento que justifica el valor de $\arg z$. Una de las
          piezas no debe entrar.
        piezas:
          - texto: |
              $z = -1 - i$ tiene parte real y parte imaginaria negativas, luego
              su afijo está en el **tercer cuadrante**.
          - texto: |
              $\tan\theta = \dfrac{b}{a} = \dfrac{-1}{-1} = 1$, y en
              $[0,2\pi)$ hay **dos** ángulos que lo cumplen: $\pi/4$ y $5\pi/4$.
          - texto: |
              Como $\arctan(1) = \pi/4$, el argumento es $\theta = \pi/4$.
            trampa: true
            mensaje: |
              Esta es la pieza envenenada, y es el error que más veces cuesta
              este ejercicio. $\arctan$ devuelve siempre un ángulo entre
              $-\pi/2$ y $\pi/2$: te deja en el primer o el cuarto cuadrante,
              nunca en el tercero. Con $z=-1-i$ obtienes el argumento de
              $1+i$ — el número contrario— y el módulo te sale bien, así que
              nada te avisa hasta que el resultado final está girado media
              vuelta.
          - texto: |
              De los dos, el que cae en el tercer cuadrante es $5\pi/4$. Por
              tanto $\arg z = 5\pi/4$.
          - texto: |
              Comprobación: $\cos\frac{5\pi}{4} = -\frac{\sqrt2}{2} < 0$ y
              $\sin\frac{5\pi}{4} = -\frac{\sqrt2}{2} < 0$, coherente con las
              dos componentes negativas de $z$.
        veredicto: |
          El orden importa menos que el hábito: mirar el cuadrante **antes** de
          tocar la calculadora.

      # ── COMP2 · el resultado ─────────────────────────────────────────
      - tipo: calcular
        titulo: La potencia, en forma binómica
        pregunta: |
          Con $z = \sqrt{2}\,e^{i5\pi/4}$, aplica De Moivre y escribe $z^{9}$ en
          forma binómica.
        respuesta:
          tipo: complejo
          valor: '-16-16i'
          tolerancia: 0.02
          formato: forma binómica, $a+bi$
        distractores:
          - valor: '16+16i'
            mensaje: |
              Has usado $\theta = \pi/4$ en vez de $5\pi/4$: es el argumento de
              $1+i$, no el de $-1-i$. Como la diferencia es exactamente $\pi$ y
              el exponente es impar, el resultado te sale girado media vuelta,
              es decir, con los dos signos cambiados. El módulo, en cambio,
              te ha salido bien — por eso este error pasa desapercibido.
          - valor: '-16+16i'
            mensaje: |
              Ese es el resultado con $\theta = 3\pi/4$, el segundo cuadrante.
              Has acertado que hay que corregir el $\arctan$, pero has corregido
              hacia el lado que no era: con parte real **e** imaginaria
              negativas el afijo está abajo a la izquierda, no arriba.
          - valor: '-256√2-256√2i'
            mensaje: |
              El argumento está bien y la estructura también, pero has elevado
              un módulo equivocado: has usado $|z| = 2$ en lugar de $\sqrt{2}$.
              Es el error del paso del módulo, arrastrado hasta aquí y
              multiplicado por nueve.
          - valor: '-0.7071-0.7071i'
            mensaje: |
              Has calculado bien el argumento y has olvidado el módulo: eso es
              $e^{i5\pi/4}$, un número de módulo 1. Falta multiplicar por
              $(\sqrt2)^{9} = 16\sqrt2$.
        pista: |
          De Moivre: $z^{9} = |z|^{9}\,e^{i\,9\theta}$. Calcula $(\sqrt2)^{9}$ y
          reduce $9\cdot\frac{5\pi}{4}$ restando vueltas enteras de $2\pi$.
        desarrollo: |
          $$
          z^{9} = \left(\sqrt{2}\right)^{9} e^{i\,9\cdot\frac{5\pi}{4}}
                = 2^{9/2}\,e^{i\frac{45\pi}{4}}
                = 16\sqrt{2}\;e^{i\frac{45\pi}{4}}
          $$

          Se reduce el argumento restando vueltas completas:

          $$
          \frac{45\pi}{4} - 5\cdot 2\pi = \frac{45\pi}{4} - \frac{40\pi}{4} = \frac{5\pi}{4}
          $$

          Y se pasa a binómica:

          $$
          z^{9} = 16\sqrt{2}\left(\cos\frac{5\pi}{4} + i\sin\frac{5\pi}{4}\right)
                = 16\sqrt{2}\left(-\frac{\sqrt2}{2} - i\frac{\sqrt2}{2}\right)
                = -16 - 16i
          $$
        veredicto: |
          Que $z^{9}$ tenga el mismo argumento que $z$ no es casualidad: el
          argumento crece $8\theta = 10\pi$, que son cinco vueltas exactas.

    resolucion: |
      **Datos.** $z = -1 - i$. Se pide $z^{9}$ en forma binómica.

      ### 1 · Herramienta y por qué se puede aplicar

      Se usa la **fórmula de De Moivre**: si $z = r\,e^{i\theta}$ con
      $r = |z|$ y $\theta = \arg z$, entonces

      $$
      z^{n} = r^{n} e^{i n\theta}, \qquad n \in \mathbb{Z}
      $$

      La fórmula exige tener $z$ escrito en forma polar, y no impone ninguna
      condición sobre $z$ más allá de $z \neq 0$ cuando el exponente es
      negativo. Aquí $z = -1 - i \neq 0$ y $n = 9 > 0$, así que es aplicable sin
      restricciones. El único trabajo previo es obtener $r$ y $\theta$.

      ### 2 · Módulo

      $$
      r = |z| = \sqrt{a^{2}+b^{2}} = \sqrt{(-1)^{2}+(-1)^{2}} = \sqrt{2}
      $$

      ### 3 · Argumento

      El afijo de $z$ es el punto $(-1,-1)$: **tercer cuadrante**, porque las
      dos componentes son negativas. La condición que define el argumento es

      $$
      \tan\theta = \frac{b}{a} = \frac{-1}{-1} = 1
      $$

      y en $[0,2\pi)$ la cumplen **dos** ángulos: $\theta = \pi/4$ y
      $\theta = 5\pi/4$. Hay que quedarse con el del tercer cuadrante:

      $$
      \arg z = \frac{5\pi}{4}
      $$

      Escribir $\theta = \arctan(1) = \pi/4$ sería un error: $\arctan$ toma
      valores en $(-\pi/2, \pi/2)$ y por tanto nunca devuelve un ángulo del
      tercer cuadrante. Se comprueba que el elegido es el correcto:
      $\cos\frac{5\pi}{4} = -\frac{\sqrt2}{2} < 0$ y
      $\sin\frac{5\pi}{4} = -\frac{\sqrt2}{2} < 0$, los dos signos negativos que
      tiene $z$.

      Por tanto

      $$
      z = \sqrt{2}\;e^{i\frac{5\pi}{4}}
      $$

      ### 4 · Aplicación de De Moivre

      $$
      z^{9} = \left(\sqrt{2}\right)^{9} e^{i\,9\cdot\frac{5\pi}{4}}
            = 2^{9/2}\,e^{i\frac{45\pi}{4}}
            = 16\sqrt{2}\;e^{i\frac{45\pi}{4}}
      $$

      donde $\left(\sqrt{2}\right)^{9} = 2^{9/2} = 2^{4}\cdot 2^{1/2} = 16\sqrt{2}$.

      El argumento se reduce al intervalo $[0,2\pi)$ restando vueltas completas:

      $$
      \frac{45\pi}{4} - 5\cdot 2\pi = \frac{45\pi}{4} - \frac{40\pi}{4} = \frac{5\pi}{4}
      $$

      ### 5 · Paso a forma binómica

      $$
      z^{9} = 16\sqrt{2}\left(\cos\frac{5\pi}{4} + i\,\sin\frac{5\pi}{4}\right)
            = 16\sqrt{2}\left(-\frac{\sqrt{2}}{2} - i\,\frac{\sqrt{2}}{2}\right)
      $$

      y como $16\sqrt{2}\cdot\frac{\sqrt{2}}{2} = \frac{16\cdot 2}{2} = 16$:

      $$
      z^{9} = -16 - 16i
      $$

      ### 6 · Comprobación

      Dos comprobaciones independientes, que cuestan veinte segundos:

      - **Módulo.** Debe cumplirse $|z^{9}| = |z|^{9} = (\sqrt2)^{9} = 16\sqrt2 \approx 22{,}63$.
        Y en efecto $|-16-16i| = \sqrt{16^{2}+16^{2}} = \sqrt{512} = 16\sqrt{2}$.
      - **Cuadrante.** $\arg z^{9} = 5\pi/4$, tercer cuadrante; el afijo
        $(-16,-16)$ está efectivamente abajo a la izquierda.

      ### Resultado

      $$
      \boxed{\;z^{9} = -16 - 16i\;}
      $$
