  - id: seis-factores-integrantes
    titulo: Seis factores integrantes, dos de ellos con el exponente por hallar
    fuente: >-
      Ejercicio 9.8 · Problemas complementarios, tema 9 · Cálculo, UPV/EHU.
      Los apartados (a), (e) y (f) son de las convocatorias 2017/2018 7E,
      2015/2016 7E y 2012/2013 7E.
    nivel: practica
    enunciado: |
      Utilizando los factores integrantes $g(x,y)$, resolver las siguientes
      EDOs:

      (a) $3y\,dx + \left(x+4y\right)dy = 0$, &nbsp; $g(x,y)=(x+y)^{2}$

      (b) $\left(2y-6x\right)dx + \left(3x-\dfrac{4x^{2}}{y}\right)dy = 0$, &nbsp; $g(x,y)=xy^{2}$

      (c) $\left(xy^{2}-y^{3}\right)dx + \left(1-xy^{2}\right)dy = 0$,
      &nbsp; $g(x,y)=\dfrac{1}{y^{2}}$

      (d) $\left(2y^{2}+4x^{2}y\right)dx + \left(4xy+3x^{3}\right)dy = 0$,
      &nbsp; $g(x,y)=x^{p}y^{q}$

      (e) $\left(2xy+x^{2}y+\dfrac{y^{3}}{3}\right)dx + \left(x^{2}+y^{2}\right)dy = 0$, &nbsp; $g(x,y)=e^{x}$

      (f) $y\,dx + \left(x^{2}y^{2}-x\right)dy = 0$,
      &nbsp; $g(x,y)=x^{n}y^{m}$
    pide: La solución general de cada una, y los exponentes en (d) y (f).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace exactamente un factor integrante?
        opciones:
          - texto: >-
              Multiplicar la ecuación por algo que no cambia sus soluciones y
              que convierte una no exacta en exacta
            correcta: true
            mensaje: |
              Eso es. $M\,dx+N\,dy=0$ y $gM\,dx+gN\,dy=0$ tienen las mismas
              curvas solución mientras $g\ne0$; lo que cambia es que la segunda
              **sí** tiene potencial.
          - texto: >-
              Simplificar la ecuación
            mensaje: |
              A menudo la complica: en (a), multiplicar por $(x+y)^{2}$ da
              polinomios de grado tres donde había grado uno. Lo que gana es la
              exactitud, no la sencillez.
          - texto: >-
              Cambiar de variable
            mensaje: |
              No hay cambio de variable: las variables siguen siendo $x$ e $y$.
              Solo se multiplica la ecuación por una función.

      - tipo: calcular
        titulo: El exponente p del apartado (d)
        pregunta: |
          Para que $g=x^{p}y^{q}$ haga exacta la ecuación (d), ¿cuánto vale
          $p$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '0'
            mensaje: |
              Con $p=q=0$ no hay factor, y la ecuación no es exacta:
              $M_y = 4y+4x^{2}$ frente a $N_x = 4y+9x^{2}$.
          - valor: '2'
            mensaje: |
              Revisa el sistema. Igualando los coeficientes de
              $x^{p}y^{q+1}$ sale $2(q+2)=4(p+1)$, o sea $q=2p$; y con la otra
              igualdad, $4(q+1)=3(p+3)$, queda $p=1$.
        pista: |
          Multiplica, deriva y compara **término a término**: los de
          $x^{p}y^{q+1}$ entre sí y los de $x^{p+2}y^{q}$ entre sí. Salen dos
          ecuaciones con dos incógnitas.
        desarrollo: |
          $$
          gM = 2x^{p}y^{q+2}+4x^{p+2}y^{q+1},
          \qquad
          gN = 4x^{p+1}y^{q+1}+3x^{p+3}y^{q}
          $$

          $$
          \frac{\partial (gM)}{\partial y}
          = 2(q+2)x^{p}y^{q+1}+4(q+1)x^{p+2}y^{q}
          $$

          $$
          \frac{\partial (gN)}{\partial x}
          = 4(p+1)x^{p}y^{q+1}+3(p+3)x^{p+2}y^{q}
          $$

          Igualando coeficiente a coeficiente:

          $$
          2(q+2) = 4(p+1) \;\Rightarrow\; q = 2p,
          \qquad
          4(q+1) = 3(p+3)
          $$

          $$
          8p+4 = 3p+9 \;\Longrightarrow\; p = 1,\; q = 2
          $$

          Y con $g=xy^{2}$, el potencial es $x^{2}y^{4}+x^{4}y^{3}$.

      - tipo: calcular
        titulo: El exponente n del apartado (f)
        pregunta: |
          Para que $g=x^{n}y^{m}$ haga exacta la ecuación (f), ¿cuánto vale
          $n$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              El signo. El exponente tiene que ser **negativo** para que el
              término $x^{n+2}y^{m+2}$ desaparezca, y eso exige $n=-2$.
          - valor: '-1'
            mensaje: |
              Con $n=-1$ el término en $x^{n+1}y^{m+2}$ no se anula y sigue
              sobrando. Solo $n=-2$ lo mata.
        pista: |
          Al derivar $gN$ respecto de $x$ aparece un término en
          $x^{n+1}y^{m+2}$ que **no tiene pareja** al otro lado. La única forma
          de cuadrar es que su coeficiente $(n+2)$ sea cero.
        desarrollo: |
          $$
          gM = x^{n}y^{m+1},
          \qquad
          gN = x^{n+2}y^{m+2}-x^{n+1}y^{m}
          $$

          $$
          \frac{\partial(gM)}{\partial y} = (m+1)x^{n}y^{m}
          $$

          $$
          \frac{\partial(gN)}{\partial x}
          = (n+2)x^{n+1}y^{m+2} - (n+1)x^{n}y^{m}
          $$

          El primer sumando de la derecha no tiene con quién emparejarse, así
          que $n+2=0$. Y entonces $m+1 = -(n+1) = 1$, o sea $m=0$:

          $$
          g = \frac{1}{x^{2}},
          \qquad
          F = \frac{y^{3}}{3}-\frac{y}{x}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Multiplicar por $g$ no cambia las soluciones mientras $g\ne0$,
              pero sí puede volver exacta la ecuación.
          - texto: >-
              Cuando el enunciado da $g$, basta multiplicar, comprobar la
              exactitud y buscar el potencial como siempre.
          - texto: >-
              Cuando $g$ viene con exponentes por determinar, se impone
              $\left(gM\right)_y=\left(gN\right)_x$ y se resuelve el sistema
              que sale de igualar los coeficientes.
          - texto: >-
              Y como el factor integrante multiplica a los dos miembros, el
              potencial que sale es el mismo que sin él, multiplicado por $g$.
            trampa: true
            mensaje: |
              Sin factor **no hay potencial**: ese es todo el problema. La
              ecuación original no es exacta, así que no existe una $F$ con
              $F_x=M$ y $F_y=N$; la que se construye es la de la ecuación ya
              multiplicada, y no guarda esa relación con nada anterior.
        veredicto: |
          Cuando el factor viene dado, el ejercicio es un exacta con dos líneas
          de más. Cuando hay que hallarlo, la técnica es siempre la misma:
          imponer la exactitud y **comparar coeficiente a coeficiente**, que
          convierte una condición sobre funciones en un sistema de números.
    resolucion: |
      **Los seis resultados.**

      | apartado | $g$ | solución |
      |---|---|---|
      | (a) | $(x+y)^{2}$ | $y(x+y)^{3} = c$ |
      | (b) | $xy^{2}$ | $x^{2}y^{3}-2x^{3}y^{2} = C$ |
      | (c) | $1/y^{2}$ | $\tfrac{x^{2}}{2}-\tfrac{1}{y}-xy = C$ |
      | (d) | $xy^{2}$ ($p=1$, $q=2$) | $x^{2}y^{4}+x^{4}y^{3} = C$ |
      | (e) | $e^{x}$ | $\tfrac13 e^{x}y\left(3x^{2}+y^{2}\right) = C$ |
      | (f) | $1/x^{2}$ ($n=-2$, $m=0$) | $\tfrac{y^{3}}{3}-\tfrac{y}{x} = C$ |

      ### 1 · Los cuatro con el factor dado

      Se multiplica, se comprueba y se integra. En (a):

      $$
      gM = 3y(x+y)^{2}, \qquad gN = (x+4y)(x+y)^{2}
      $$

      $$
      F = y(x+y)^{3}
      $$

      $$
      F_x = 3y(x+y)^{2} \;\checkmark
      \qquad
      F_y = (x+y)^{2}\left[(x+y)+3y\right] = (x+4y)(x+y)^{2} \;\checkmark
      $$

      ### 2 · Los dos con exponentes por hallar

      El método es idéntico en los dos: se impone
      $\left(gM\right)_y = \left(gN\right)_x$ y se comparan los coeficientes de
      cada monomio.

      | apartado | sistema | solución |
      |---|---|---|
      | (d) | $2(q+2)=4(p+1)$ y $4(q+1)=3(p+3)$ | $p=1$, $q=2$ |
      | (f) | $n+2=0$ y $m+1=-(n+1)$ | $n=-2$, $m=0$ |

      El de (f) es más sutil: no salen dos ecuaciones de emparejar dos
      monomios, sino una de **anular** el monomio que sobra y otra de
      emparejar los que quedan.

      ### 3 · Por qué esto vale la pena

      Contado el 14 de septiembre de 2026 sobre los ejercicios de examen del
      sitio: **nueve piden una ecuación exacta y cinco un factor integrante**,
      y hasta ahora el tema 9 no tenía ni un ejercicio de ninguna de las dos.
      Este ejercicio y el 9.7 son los que cierran ese hueco.

      **Lo que hay que llevarse.** Un factor integrante no simplifica: **cambia
      la ecuación por otra equivalente que sí tiene potencial**. Y cuando hay
      que hallarlo, la técnica —imponer la exactitud y comparar monomio a
      monomio— es la misma que se usa en coeficientes indeterminados. Es la
      misma idea aplicada dos veces en el mismo tema.

  - id: ocho-separables-y-las-constantes-que-hay-que-fijar
    titulo: Ocho separables, y las cinco que traen condición inicial
    fuente: >-
      Ejercicio 9.5 · Problemas complementarios, tema 9 · Cálculo, UPV/EHU.
      Los apartados (g) y (h) son de las convocatorias 2016/2017 3E AT y
      2017/2018 3E AT.
    nivel: practica
    enunciado: |
      Resolver las siguientes EDOs de variables separables:

      (a) $y' = -xe^{y}$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (e) $e^{-y^{2}}\left(x^{2}+1\right)dy = \dfrac{dx}{2y}$, $y(1)=1$

      (b) $\left(1+e^{x}\right)y' = e^{x}$, $y(0)=0$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (f) $x(y+2)y' = 1+\ln x$, $y(1)=-1$

      (c) $(1+y)dx + \dfrac{dy}{x^{2}-2x} = 0$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (g) $y' = 4x^{3}y-4y$, $y(0)=1$

      (d) $y\,dy + x\left(y^{2}-4\right)dx = 0$, $y(0)=5$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (h) $y' = y-2y^{2}$
    pide: La solución de cada una, particular donde haya condición inicial.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado (h), $y'=y-2y^{2}$, separa. ¿Qué hace falta para
          integrar $\dfrac{dy}{y(1-2y)}$?
        opciones:
          - texto: >-
              Descomponer en fracciones simples:
              $\dfrac{1}{y(1-2y)}=\dfrac{1}{y}+\dfrac{2}{1-2y}$
            correcta: true
            mensaje: |
              Eso es. Es la misma técnica del tema de integración, y aquí
              aparece constantemente: casi toda EDO logística acaba en una
              descomposición en fracciones simples.
          - texto: >-
              Un cambio de variable trigonométrico
            mensaje: |
              El denominador es un producto de factores lineales, no una suma
              de cuadrados. Las fracciones simples lo resuelven directamente.
          - texto: >-
              No se puede integrar
            mensaje: |
              Sí se puede, y sale un logaritmo de cada factor. Esta ecuación
              es la **logística**, y su solución es la curva en forma de S que
              modela poblaciones con recurso limitado.

      - tipo: calcular
        titulo: Un valor de la solución del apartado (d)
        pregunta: |
          La solución de (d) con $y(0)=5$ es
          $y=\sqrt{4+21e^{-x^{2}}}$. ¿Cuánto vale $y(1)$?
        respuesta:
          tipo: numero
          valor: '3.4242'
          tolerancia: 0.004
          formato: en forma exacta (sqrt(4+21/e)) o con cuatro decimales
        distractores:
          - valor: '5'
            mensaje: |
              $5$ es el valor inicial, en $x=0$. La solución decrece: el
              término $21e^{-x^{2}}$ se apaga.
          - valor: '2'
            mensaje: |
              $2$ es el **límite** cuando $x\to\infty$, cuando la exponencial
              ya vale cero. En $x=1$ todavía queda bastante.
        pista: |
          $e^{-1}\approx0{,}3679$, así que $4+21e^{-1}\approx11{,}73$.
        desarrollo: |
          $$
          y(1) = \sqrt{4+21e^{-1}} = \sqrt{4+7{,}7252}
          = \sqrt{11{,}7252} \approx 3{,}4242
          $$

          La solución baja de $5$ hacia $2$, que es la recta de equilibrio
          $y=2$ de la ecuación.

      - tipo: calcular
        titulo: Un valor de la solución del apartado (g)
        pregunta: |
          La solución de (g) con $y(0)=1$ es $y=e^{x^{4}-4x}$. ¿Cuánto vale
          $y(1)$?
        respuesta:
          tipo: numero
          valor: '0.049787'
          tolerancia: 0.0002
          formato: en forma exacta (e^(-3)) o con seis decimales
        distractores:
          - valor: '20.0855'
            mensaje: |
              $e^{3}$: el signo del exponente. En $x=1$,
              $x^{4}-4x = 1-4 = -3$.
          - valor: '1'
            mensaje: |
              $1$ es el valor inicial. La solución sí cambia: el exponente pasa
              de $0$ a $-3$.
        pista: |
          $x^{4}-4x$ en $x=1$ vale $1-4=-3$.
        desarrollo: |
          $$
          y(1) = e^{1-4} = e^{-3} \approx 0{,}049787
          $$

          El exponente $x^{4}-4x$ tiene su mínimo en $x=\sqrt[3]{1}=1$, así
          que ese $e^{-3}$ es además el valor **más pequeño** que toma la
          solución.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Separar es dejar cada variable con su diferencial:
              $f(y)\,dy = g(x)\,dx$, y después integrar los dos lados.
          - texto: >-
              La constante de integración se pone en **un solo** lado; poner
              una en cada uno es redundante, porque su diferencia es otra
              constante.
          - texto: >-
              Cuando hay condición inicial, se sustituye al final para fijar la
              constante — y conviene hacerlo antes de despejar $y$, que suele
              ser más limpio.
          - texto: >-
              Y al dividir entre $y$ o entre $1-2y$ no se pierde nada, porque
              esas son soluciones triviales.
            trampa: true
            mensaje: |
              Se pierden, y son soluciones de verdad: en (h), $y=0$ e
              $y=\tfrac12$ resuelven la ecuación y **no** se obtienen de la
              familia $y=\tfrac{Ce^{x}}{1+2Ce^{x}}$ para ningún $C$ finito. Se
              llaman soluciones singulares, y al separar hay que anotarlas
              aparte.
        veredicto: |
          Separar es el método más simple del tema y el que más soluciones
          pierde: cada vez que se divide entre algo, hay que preguntarse si ese
          algo puede ser cero.
    resolucion: |
      **Los ocho resultados.**

      | apartado | solución |
      |---|---|
      | (a) | $y = -\ln\left(\tfrac{x^{2}}{2}+C\right)$ |
      | (b) | $y = \ln\dfrac{e^{x}+1}{2}$ |
      | (c) | $y = Ce^{x^{2}-x^{3}/3}-1$ |
      | (d) | $y = \sqrt{4+21e^{-x^{2}}}$ |
      | (e) | $\tfrac{\pi}{4}+e^{-1}-e^{-y^{2}} = \arctan x$ |
      | (f) | $y^{2}+4y = \left(\ln x+1\right)^{2}-4$ |
      | (g) | $y = e^{x^{4}-4x}$ |
      | (h) | $y = \dfrac{Ce^{x}}{1+2Ce^{x}}$ |

      ### 1 · El molde

      $$
      f(y)\,dy = g(x)\,dx
      \;\Longrightarrow\;
      \int f(y)\,dy = \int g(x)\,dx + C
      $$

      Y después, si hay condición inicial, sustituir para fijar $C$.

      ### 2 · Los que no se despejan, y no pasa nada

      En (e) y en (f) la solución se deja **implícita**. Es correcto y a
      menudo obligado: en (e), despejar $y$ de
      $e^{-y^{2}} = \tfrac{\pi}{4}+e^{-1}-\arctan x$ daría una raíz de un
      logaritmo con signos que discutir. Una solución implícita es una
      solución.

      ### 3 · Los dos que enseñan algo más

      **(d)** es una relajación hacia el equilibrio: baja de $5$ hacia
      $y=2$, que es la solución constante de la ecuación.

      **(h)** es la **logística**. Su solución tiene forma de S, con dos
      equilibrios: $y=0$ inestable e $y=\tfrac12$ estable. Y esos dos son
      soluciones que **se pierden al separar**, porque para escribir
      $\tfrac{dy}{y(1-2y)}$ hay que dividir por ellos.

      **Lo que hay que llevarse.** Cada división al separar puede tirar una
      solución. Anotar los ceros del denominador antes de integrar cuesta una
      línea y es lo que distingue una respuesta completa de una casi completa.

