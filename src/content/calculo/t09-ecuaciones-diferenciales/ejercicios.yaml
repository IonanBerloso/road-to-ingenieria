      <figcaption>e^{2x} no es solución de la homogénea —lo son e^{x} y e^{−x}—, así que no hay resonancia y la particular se puede buscar de la misma forma que el segundo miembro: A·e^{2x}. Si hubiera coincidido con una de las dos, habría hecho falta una x delante.</figcaption>
