        <title id="f-ej-clasificar-edos-t">El orden de preguntas para clasificar una ecuación diferencial de primer orden</title>
        <desc id="f-ej-clasificar-edos-d">Un diagrama en cascada con cuatro preguntas encadenadas, una debajo de otra. La primera: ¿se pueden separar las variables? Si la respuesta es sí, a la derecha sale la etiqueta separable. Si no, se baja a la siguiente: ¿todo depende solo del cociente y partido por x? Si sí, homogénea. Si no: ¿tiene la forma y prima más P por y igual a Q? Si sí, lineal. Y por último: ¿coinciden las derivadas cruzadas de M y de N? Si sí, exacta, y si no, hay que buscar un factor integrante.</desc>
