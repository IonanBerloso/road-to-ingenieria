  - id: seis-lineales-de-primer-orden
    titulo: Seis lineales de primer orden, y las cuatro con dato inicial
    fuente: >-
      Ejercicio 9.9 · Problemas complementarios, tema 9 · Cálculo, UPV/EHU.
      Los apartados (c) a (f) son de las convocatorias 2018/2019 3E AT,
      2018/2019 4E AT, 2016/2017 7E y 2018/2019 5E.
    nivel: practica
    enunciado: |
      Resolver las siguientes EDOs lineales:

      (a) $y'-2y = x$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (d) $y' = y-e^{-x}$, $y(0)=\dfrac32$

      (b) $xy' = y+2x^{3}$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (e) $xy'+2y = \operatorname{sen}x$,
      $y\left(\dfrac{\pi}{2}\right)=4\left(\dfrac{2}{\pi}\right)^{2}$

      (c) $y' = x^{2}-y$, $y(0)=1$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (f) $xy'-y = x^{3}$, $y(1)=\dfrac32$
    pide: La solución de cada una, particular donde haya dato inicial.
    pasos:
      - tipo: reconocer
        pregunta: |
          En (b), (e) y (f) hay una $x$ multiplicando a $y'$. ¿Qué hay que
          hacer antes de calcular el factor integrante?
        opciones:
          - texto: >-
              Dividir entre esa $x$ para dejar $y'$ con coeficiente $1$: el
              factor integrante es $e^{\int p}$ con $p$ el coeficiente de $y$
              **después** de dividir
            correcta: true
            mensaje: |
              Eso es, y es el error más repetido del método: si no divides
              primero, $p$ sale mal y el factor integrante también.
          - texto: >-
              Nada: el factor integrante se calcula igual
            mensaje: |
              En (f), sin dividir, uno leería $p=-1$ y $\mu=e^{-x}$. Dividiendo
              entre $x$, $p=-\tfrac1x$ y $\mu=\tfrac1x$. Son cosas distintas.
          - texto: >-
              Multiplicar por $x$ otra vez
            mensaje: |
              Eso empeora el problema. La forma canónica es
              $y'+p(x)y=q(x)$, con el $y'$ solo.

      - tipo: calcular
        titulo: Un valor de la solución del apartado (c)
        pregunta: |
          La solución de (c) con $y(0)=1$ es
          $y = x^{2}-2x+2-e^{-x}$. ¿Cuánto vale $y(1)$?
        respuesta:
          tipo: numero
          valor: '0.6321'
          tolerancia: 0.0008
          formato: en forma exacta (1-1/e) o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es el valor inicial, en $x=0$. La parábola baja: su vértice
              está en $x=1$.
          - valor: '1.3679'
            mensaje: |
              Has sumado la exponencial en vez de restarla. La constante salió
              $-1$, no $+1$.
        pista: |
          $x^{2}-2x+2$ en $x=1$ vale $1$, y $e^{-1}\approx0{,}3679$.
        desarrollo: |
          $$
          y(1) = 1-2+2-e^{-1} = 1-e^{-1} \approx 0{,}6321
          $$

      - tipo: calcular
        titulo: La constante del apartado (e)
        pregunta: |
          Con el factor integrante $x^{2}$, la ecuación (e) queda
          $\left(x^{2}y\right)' = x\operatorname{sen}x$, de donde
          $x^{2}y = \operatorname{sen}x - x\cos x + C$. Con el dato
          $y\left(\tfrac{\pi}{2}\right)=4\left(\tfrac{2}{\pi}\right)^{2}$,
          ¿cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '0'
            mensaje: |
              Con $C=0$ el valor en $\tfrac{\pi}{2}$ sería
              $\tfrac{4}{\pi^{2}}$, y el dato pide cuatro veces eso.
          - valor: '4'
            mensaje: |
              El dato es $\tfrac{16}{\pi^{2}}$, y
              $x^{2}y=\tfrac{\pi^{2}}{4}\cdot\tfrac{16}{\pi^{2}}=4$. De ahí
              hay que restar $\operatorname{sen}\tfrac{\pi}{2}=1$.
        pista: |
          En $x=\tfrac{\pi}{2}$: $\operatorname{sen}=1$, $\cos=0$, y
          $x^{2}y = \tfrac{\pi^{2}}{4}\cdot\tfrac{16}{\pi^{2}} = 4$.
        desarrollo: |
          $$
          4 = 1 - 0 + C \;\Longrightarrow\; C = 3
          $$

          $$
          y = \frac{3}{x^{2}} + \frac{\operatorname{sen}x}{x^{2}}
          - \frac{\cos x}{x}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Forma canónica $y'+p(x)y = q(x)$: lo primero es dejar $y'$ con
              coeficiente $1$.
          - texto: >-
              El factor integrante es $\mu=e^{\int p\,dx}$, y con él el primer
              miembro se vuelve la derivada de $\mu y$.
          - texto: >-
              Se integra $\mu q$ y se despeja $y$; la constante entra dividida
              por $\mu$, y por eso en (b) aparece un $Cx$ y en (e) un
              $\tfrac{C}{x^{2}}$.
          - texto: >-
              Y en $\mu=e^{\int p}$ hay que arrastrar la constante de esa
              integral, porque cambia el resultado.
            trampa: true
            mensaje: |
              No: esa constante daría $\mu\cdot e^{k}$, un factor constante que
              multiplica a los dos miembros y se cancela. Es la única constante
              de todo el método que **no** hay que arrastrar.
        veredicto: |
          El método es un molde de cuatro pasos y no falla nunca. Las dos
          cosas que se olvidan son dividir para dejar el $y'$ solo, y que la
          constante final va dividida por el factor integrante.
    resolucion: |
      **Los seis resultados.**

      | apartado | $p(x)$ | $\mu$ | solución |
      |---|---|---|---|
      | (a) | $-2$ | $e^{-2x}$ | $y = -\tfrac14(1+2x)+Ce^{2x}$ |
      | (b) | $-\tfrac1x$ | $\tfrac1x$ | $y = x^{3}+Cx$ |
      | (c) | $1$ | $e^{x}$ | $y = x^{2}-2x+2-e^{-x}$ |
      | (d) | $-1$ | $e^{-x}$ | $y = e^{x}+\tfrac{e^{-x}}{2}$ |
      | (e) | $\tfrac2x$ | $x^{2}$ | $y = \tfrac{3}{x^{2}}+\tfrac{\operatorname{sen}x}{x^{2}}-\tfrac{\cos x}{x}$ |
      | (f) | $-\tfrac1x$ | $\tfrac1x$ | $y = \tfrac{x^{3}}{2}+x$ |

      ### 1 · El molde

      $$
      y'+p(x)y = q(x)
      \;\Longrightarrow\;
      \mu = e^{\int p\,dx}
      \;\Longrightarrow\;
      \left(\mu y\right)' = \mu q
      \;\Longrightarrow\;
      y = \frac{1}{\mu}\left(\int \mu q\,dx + C\right)
      $$

      ### 2 · Las integrales que hay que saber hacer

      | apartado | $\int\mu q$ |
      |---|---|
      | (a) | $\int xe^{-2x}dx$, por partes |
      | (c) | $\int x^{2}e^{x}dx$, por partes dos veces |
      | (e) | $\int x\operatorname{sen}x\,dx$, por partes |

      Las tres son de integración por partes, que es lo que de verdad se
      practica aquí.

      ### 3 · La comprobación de siempre

      Sustituir la solución en la ecuación. En (f), con
      $y=\tfrac{x^{3}}{2}+x$:

      $$
      xy'-y = x\left(\frac{3x^{2}}{2}+1\right)
      - \left(\frac{x^{3}}{2}+x\right)
      = \frac{3x^{3}}{2}+x-\frac{x^{3}}{2}-x = x^{3} \;\checkmark
      $$

      Y el dato: $y(1)=\tfrac12+1=\tfrac32$ ✓

      **Lo que hay que llevarse.** El factor integrante se calcula con el
      $p(x)$ de la **forma canónica**, no con lo que se ve a primera vista. En
      tres de estos seis hay una $x$ multiplicando a $y'$, y dividir antes de
      nada es la diferencia entre resolver la ecuación y resolver otra.

