  - id: seis-particulares-de-segundo-orden
    titulo: Seis de segundo orden por coeficientes indeterminados
    fuente: >-
      Ejercicio 9.10 · Problemas complementarios, tema 9 · Cálculo, UPV/EHU.
      El apartado (d) ya estaba en el sitio; aquí entran los otros cinco. Los
      apartados (e) y (f) son de las convocatorias 2018/2019 7E y 2017/2018
      6E.
    nivel: practica
    enunciado: |
      Utilizando el método de *Coeficientes Indeterminados*, resolver las
      siguientes EDOs:

      (a) $y''+y = \operatorname{sen}2x$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (b) $y''+y'-6y = 36x$

      (c) $y''+9y = 2x^{2}-5$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (e) $y''-3y'+2y = 2xe^{x}$

      (f) $y''+9y = 9\operatorname{sen}3x+2e^{3x}$
    pide: La solución general de cada una.
    pasos:
      - tipo: reconocer
        pregunta: |
          En (a), $y''+y=\operatorname{sen}2x$, las raíces son $\pm i$. ¿Hay
          resonancia?
        opciones:
          - texto: >-
              No: la frecuencia del segundo miembro es $2$ y la de la
              homogénea es $1$. Basta probar $A\operatorname{sen}2x$
            correcta: true
            mensaje: |
              Eso es. La resonancia exige que **la frecuencia coincida**, no
              solo que haya senos en los dos sitios. Aquí no coincide, así que
              no hace falta ninguna $x$.
          - texto: >-
              Sí, porque la homogénea tiene senos y cosenos
            mensaje: |
              Lo que importa es la frecuencia. $\operatorname{sen}x$ y
              $\operatorname{sen}2x$ son funciones independientes: la segunda
              no resuelve la homogénea.
          - texto: >-
              Sí, porque $2$ es el doble de $1$
            mensaje: |
              Que sea el doble no significa nada aquí. Compara $2i$ con las
              raíces $\pm i$: no está entre ellas.

      - tipo: calcular
        titulo: El coeficiente del apartado (a)
        pregunta: |
          Con $y_p = A\operatorname{sen}2x$, ¿cuánto vale $A$?
        respuesta:
          tipo: numero
          valor: '-0.3333'
          tolerancia: 0.002
          formato: en forma exacta (-1/3) o con cuatro decimales
        distractores:
          - valor: '0.3333'
            mensaje: |
              El signo. $y''_p = -4A\operatorname{sen}2x$, así que
              $y''_p+y_p = -3A\operatorname{sen}2x$: para dar $+1$ hace falta
              $A$ negativo.
          - valor: '1'
            mensaje: |
              $1$ es el coeficiente del segundo miembro. Falta dividir entre
              el $-3$ que sale de sustituir.
        pista: |
          $\left(A\operatorname{sen}2x\right)'' = -4A\operatorname{sen}2x$.
        desarrollo: |
          $$
          y''_p+y_p = -4A\operatorname{sen}2x + A\operatorname{sen}2x
          = -3A\operatorname{sen}2x
          $$

          $$
          -3A = 1 \;\Longrightarrow\; A = -\frac13
          $$

      - tipo: calcular
        titulo: El coeficiente resonante del apartado (f)
        pregunta: |
          En $y''+9y = 9\operatorname{sen}3x+2e^{3x}$ hay resonancia con
          $\operatorname{sen}3x$, y la particular de ese término es
          $Cx\cos3x$. ¿Cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '-1.5'
          tolerancia: 0.008
          formato: en forma exacta (-3/2) o con un decimal
        distractores:
          - valor: '1.5'
            mensaje: |
              El signo. Sustituyendo $x\cos3x$ sale
              $-6\operatorname{sen}3x$, con menos, así que $C$ tiene que ser
              negativo para dar $+9\operatorname{sen}3x$.
          - valor: '0.1111'
            mensaje: |
              $\tfrac19$ pertenece al otro término: la particular de $2e^{3x}$
              es $\tfrac{e^{3x}}{9}$, porque $3^{2}+9=18$ y $\tfrac{2}{18}$.
        pista: |
          Con $y=x\cos3x$: $y'' = -6\operatorname{sen}3x-9x\cos3x$, y el
          término en $x$ se cancela con el $9y$.
        desarrollo: |
          $$
          y = x\cos3x
          \;\Longrightarrow\;
          y'' = -6\operatorname{sen}3x - 9x\cos3x
          $$

          $$
          y''+9y = -6\operatorname{sen}3x
          $$

          $$
          -6C = 9 \;\Longrightarrow\; C = -\frac32
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Hay resonancia cuando la forma que se va a probar **ya resuelve**
              la homogénea, y entonces se multiplica por $x$.
          - texto: >-
              En (e), $2xe^{x}$ resuena con la raíz $r=1$, así que la
              particular es $xe^{x}(A+Bx)$ y no $e^{x}(A+Bx)$.
          - texto: >-
              En (f) hay dos términos y solo uno resuena: el
              $\operatorname{sen}3x$, porque $\pm3i$ son las raíces; el
              $2e^{3x}$ no, porque $3$ no lo es.
          - texto: >-
              Y en (c), como el segundo miembro es un polinomio de grado $2$ y
              no hay raíz nula, la particular es $ax^{2}$ a secas.
            trampa: true
            mensaje: |
              La particular polinómica lleva **todos** los grados hasta el
              suyo: $ax^{2}+bx+c$. Aquí resulta que $b=0$ por casualidad —el
              segundo miembro no tiene término en $x$ y la ecuación no tiene
              $y'$—, pero eso hay que descubrirlo resolviendo, no suponerlo.
        veredicto: |
          Dos comprobaciones automáticas: que la forma probada no resuelva ya
          la homogénea, y que el polinomio de prueba lleve todos los grados. El
          resto es sustituir e igualar coeficientes.
    resolucion: |
      **Los cinco resultados nuevos.**

      | apartado | solución |
      |---|---|
      | (a) | $C_1\operatorname{sen}x+C_2\cos x-\tfrac13\operatorname{sen}2x$ |
      | (b) | $C_1e^{-3x}+C_2e^{2x}-6x-1$ |
      | (c) | $C_1\cos3x+C_2\operatorname{sen}3x+\tfrac29x^{2}-\tfrac{49}{81}$ |
      | (e) | $C_1e^{x}+C_2e^{2x}+xe^{x}\left(-2-x\right)$ |
      | (f) | $C_1\operatorname{sen}3x+C_2\cos3x+\tfrac{e^{3x}}{9}-\tfrac32x\cos3x$ |

      ### 1 · Dónde hay resonancia y dónde no

      | apartado | segundo miembro | raíces | ¿resuena? |
      |---|---|---|---|
      | (a) | $\operatorname{sen}2x$ | $\pm i$ | no: frecuencias distintas |
      | (b) | $36x$ | $-3,\,2$ | no: $0$ no es raíz |
      | (c) | $2x^{2}-5$ | $\pm3i$ | no: $0$ no es raíz |
      | (e) | $2xe^{x}$ | $1,\,2$ | **sí**, con $r=1$ |
      | (f) | $9\operatorname{sen}3x$ | $\pm3i$ | **sí** |
      | (f) | $2e^{3x}$ | $\pm3i$ | no |

      **La comparación que hay que hacer es entre la raíz y el exponente o la
      frecuencia**, no entre los tipos de función.

      ### 2 · El apartado (e), con el atajo

      Escribiendo $y=e^{x}u$, la ecuación $y''-3y'+2y=2xe^{x}$ se convierte en

      $$
      u''-u' = 2x
      $$

      Con $u = Ax+Bx^{2}$: $u''-u' = 2B-A-2Bx$, y comparando,
      $B=-1$, $A=-2$.

      ### 3 · Los coeficientes de (c), que sorprenden

      $$
      y_p = ax^{2}+bx+c
      \;\Longrightarrow\;
      2a + 9ax^{2}+9bx+9c = 2x^{2}-5
      $$

      $$
      a = \frac29, \qquad b = 0, \qquad 9c = -5-\frac49
      \;\Longrightarrow\; c = -\frac{49}{81}
      $$

      El $-\tfrac{49}{81}$ es el clásico: el término independiente arrastra el
      $2a$ que viene de derivar el $x^{2}$.

      **Lo que hay que llevarse.** La resonancia se decide comparando **el
      exponente o la frecuencia del segundo miembro con las raíces
      características**, y no de otra forma. Y en un polinomio de prueba van
      todos los grados hasta el del segundo miembro, aunque alguno acabe
      saliendo cero.

  - id: el-parametro-que-hace-que-sea-solucion
    titulo: Dada la solución, hallar la ecuación
    fuente: Ejercicio 9.11 · Problemas complementarios, tema 9 · Cálculo, UPV/EHU (2012/2013 6E)
    nivel: practica
    enunciado: |
      Sea la EDO $y''+my = 0$, donde $m$ es desconocida. En cada uno de los
      apartados siguientes, calcular el valor de $m$ sabiendo que la función
      dada en dicho apartado es una solución de la EDO.

      (a) $y = 100\operatorname{sen}2\pi t$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (c) $y = e^{20t}$

      (b) $y = 25\cos 6\pi t + 8\cos 6\pi t$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (d) $y = 200-500t$
    pide: El valor de m en cada apartado.
    pasos:
      - tipo: reconocer
        pregunta: |
          El ejercicio va al revés de lo habitual. ¿Qué hay que hacer?
        opciones:
          - texto: >-
              Derivar dos veces la función dada y exigir que
              $y''+my=0$ se cumpla **para todo** $t$
            correcta: true
            mensaje: |
              Eso es. Y en los cuatro casos $y''$ resulta ser un múltiplo de
              $y$, así que la condición fija $m$ de una sola vez.
          - texto: >-
              Resolver la EDO con $m$ genérica y comparar
            mensaje: |
              Se puede, y sale lo mismo, pero es el camino largo: hay que
              distinguir $m>0$, $m=0$ y $m<0$. Derivar la función dada es
              inmediato.
          - texto: >-
              Sustituir un valor concreto de $t$
            mensaje: |
              Con un solo $t$ saldría un $m$ que solo cumple la ecuación en ese
              punto. Ser solución significa cumplirla en todos.

      - tipo: calcular
        titulo: El apartado (a)
        pregunta: |
          Para $y = 100\operatorname{sen}2\pi t$, ¿cuánto vale $m$?
        respuesta:
          tipo: numero
          valor: '39.4784'
          tolerancia: 0.03
          formato: en forma exacta (4pi^2) o con cuatro decimales
        distractores:
          - valor: '6.2832'
            mensaje: |
              $2\pi$ es la frecuencia, no su cuadrado. Al derivar dos veces
              baja un factor $2\pi$ **por cada derivada**.
          - valor: '-39.4784'
            mensaje: |
              El signo. $y''=-4\pi^{2}y$, así que $y''+4\pi^{2}y=0$: $m$ es
              positivo.
        pista: |
          $\left(\operatorname{sen}\omega t\right)'' =
          -\omega^{2}\operatorname{sen}\omega t$.
        desarrollo: |
          $$
          y'' = -\left(2\pi\right)^{2}y
          \;\Longrightarrow\;
          y''+4\pi^{2}y = 0
          \;\Longrightarrow\;
          m = 4\pi^{2} \approx 39{,}4784
          $$

      - tipo: calcular
        titulo: El apartado (c)
        pregunta: |
          Para $y = e^{20t}$, ¿cuánto vale $m$?
        respuesta:
          tipo: numero
          valor: '-400'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '400'
            mensaje: |
              El signo, y es el que separa los dos comportamientos: con
              $m>0$ la solución **oscila** y con $m<0$ crece
              exponencialmente. Una exponencial creciente exige $m$ negativo.
          - valor: '20'
            mensaje: |
              $20$ es la raíz característica. La $m$ es su cuadrado cambiado
              de signo, porque $r^{2}+m=0$.
        pista: |
          $y''=400y$, y la ecuación pide $y''=-my$.
        desarrollo: |
          $$
          y'' = 400e^{20t} = 400y
          \;\Longrightarrow\;
          400y + my = 0
          \;\Longrightarrow\;
          m = -400
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La ecuación $y''+my=0$ tiene raíces $r=\pm\sqrt{-m}$: oscila si
              $m>0$, crece si $m<0$ y es una recta si $m=0$.
          - texto: >-
              En (a) y (b) la función es una oscilación pura, así que $m$ es el
              cuadrado de la frecuencia.
          - texto: >-
              En (c) la exponencial creciente obliga a $m<0$, y en (d) la recta
              obliga a $m=0$.
          - texto: >-
              Y en (b), como hay dos sumandos, salen dos valores de $m$ y hay
              que quedarse con el mayor.
            trampa: true
            mensaje: |
              Los dos sumandos son **la misma función**:
              $25\cos6\pi t + 8\cos6\pi t = 33\cos6\pi t$. Hay un solo valor,
              $m=(6\pi)^{2}$. La amplitud no interviene: en una ecuación lineal
              homogénea, multiplicar una solución por una constante da otra
              solución.
        veredicto: |
          El signo de $m$ decide el mundo entero de la ecuación: positivo,
          oscila; negativo, se dispara; cero, es una recta. Leer la función
          dada y saber en cuál de los tres casos estás es la mitad del
          ejercicio, y se hace de un vistazo.
    resolucion: |
      **Los cuatro resultados.**

      | apartado | función | $m$ | qué tipo de solución es |
      |---|---|---|---|
      | (a) | $100\operatorname{sen}2\pi t$ | $4\pi^{2}\approx39{,}48$ | oscilación |
      | (b) | $33\cos 6\pi t$ | $(6\pi)^{2}\approx355{,}31$ | oscilación |
      | (c) | $e^{20t}$ | $-400$ | crecimiento exponencial |
      | (d) | $200-500t$ | $0$ | recta |

      ### 1 · El método

      $$
      y''+my = 0
      \;\Longrightarrow\;
      m = -\frac{y''}{y}
      $$

      y ese cociente tiene que ser **constante**: si no lo fuera, la función
      dada no sería solución de ninguna ecuación de esa forma.

      ### 2 · Los tres regímenes

      Las raíces de $r^{2}+m=0$ son $r=\pm\sqrt{-m}$:

      | $m$ | raíces | solución general |
      |---|---|---|
      | $>0$ | $\pm i\sqrt{m}$ | $k_1\cos\sqrt{m}\,t+k_2\operatorname{sen}\sqrt{m}\,t$ |
      | $=0$ | $0$ doble | $k_1+k_2t$ |
      | $<0$ | $\pm\sqrt{-m}$ | $k_1e^{\sqrt{-m}t}+k_2e^{-\sqrt{-m}t}$ |

      El apartado (d) es el caso $m=0$, y por eso la solución es una recta:
      raíz doble en cero.

      ### 3 · El detalle del apartado (b)

      $25\cos6\pi t + 8\cos6\pi t$ son **la misma función** sumada consigo
      misma: $33\cos6\pi t$. La amplitud no cambia nada, porque la ecuación es
      lineal y homogénea.

      **Lo que hay que llevarse.** Este ejercicio es la ecuación característica
      leída al revés, y es la forma más rápida de comprobar que has entendido
      los tres regímenes. Si te sabes la tabla de arriba, los cuatro apartados
      son de cabeza.

