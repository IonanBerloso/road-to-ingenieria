        <desc id="f-paracaidista-d">Una curva sale del origen subiendo muy deprisa y va doblándose hasta quedar casi horizontal, pegada a una línea de puntos situada a la altura cincuenta. Esa línea es la velocidad terminal. Junto al origen, una recta de puntos marca la pendiente inicial, que es la de la caída libre sin rozamiento: la curva arranca con esa pendiente y se va separando de ella en cuanto el rozamiento cuenta.</desc>
