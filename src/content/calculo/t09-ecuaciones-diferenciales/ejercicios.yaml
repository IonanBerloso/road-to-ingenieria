  # ═══════════════════════════════════════════════════════════════════
  # Ejemplos introductorios del tema 9. Nuestros, no de examen ni del boletín.
  # ═══════════════════════════════════════════════════════════════════

  - id: ej-separable-basica
    titulo: La primera EDO, separando variables
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Resolver la ecuación diferencial $y' = 2xy$ con la condición inicial
      $y(0)=5$.
    pide: La solución particular que cumple la condición inicial.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tipo de EDO es $y' = 2xy$?
        opciones:
          - texto: Separable, porque se pueden juntar las y a un lado y las x al otro
            correcta: true
            mensaje: |
              Sí. Escribiendo $dy/y = 2x\,dx$ cada lado tiene una sola variable,
              y eso es todo lo que se necesita.
          - texto: Lineal, de la forma «derivada más p(x) por y igual a q(x)»
            mensaje: |
              También lo es, con $p=-2x$ y $q=0$ — pero el árbol se recorre de
              arriba abajo y **separable va antes**, porque es más barata. Las
              dos dan lo mismo; una cuesta la mitad.
          - texto: De segundo orden
            mensaje: |
              Solo aparece $y'$, la primera derivada. El orden de una EDO es el
              de la derivada más alta que contiene.
      - tipo: calcular
        titulo: La constante de la condición inicial
        pregunta: |
          La solución general es $y = Ke^{x^{2}}$. Con $y(0)=5$, ¿cuánto vale $K$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Parece que has despejado como si $y(0)$ valiera 1. La condición
              dice $y(0)=5$, y como $e^{0}=1$, sale $K = 5$.
          - valor: '0'
            mensaje: |
              Con $K=0$ la solución sería la función nula, que no cumple
              $y(0)=5$. Sustituye $x=0$ en $Ke^{x^{2}}$ y verás que queda $K$.
        pista: |
          Sustituye x=0. Como $e^{0}=1$, queda $y(0) = K$.
        desarrollo: |
          $$
          y(0) = Ke^{0} = K = 5
          \qquad\Longrightarrow\qquad
          y = 5e^{x^{2}}
          $$
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Se separan las variables: $\frac{dy}{y} = 2x\,dx$.'
          - texto: 'Integrando los dos lados: $\ln|y| = x^{2} + C$.'
          - texto: 'Despejando, $y = Ke^{x^{2}}$, donde $K = e^{C}$ es una constante nueva.'
          - texto: 'Con $y(0)=5$ sale $K=5$, luego $y = 5e^{x^{2}}$.'
          - texto: 'Despejando de $\ln|y| = x^{2}+C$ sale $y = e^{x^{2}} + C$.'
            trampa: true
            mensaje: |
              La constante estaba **dentro** del logaritmo, así que al aplicar la
              exponencial se convierte en un **factor**, no en un sumando:
              $e^{x^{2}+C} = e^{C}e^{x^{2}}$. Escribirla sumando da una función
              completamente distinta que ni siquiera resuelve la EDO.
    resolucion: |
      **Clasificar primero.** Es separable, que es la casilla más barata del
      árbol.

      **Separar:**

      $$
      \frac{dy}{dx} = 2xy
      \qquad\Longrightarrow\qquad
      \frac{dy}{y} = 2x\,dx
      $$

      **Integrar los dos lados:**

      $$
      \ln|y| = x^{2} + C
      $$

      **Despejar**, y aquí está el paso que se falla. Aplicando la exponencial a
      los dos lados:

      $$
      |y| = e^{x^{2}+C} = e^{C}\,e^{x^{2}}
      \qquad\Longrightarrow\qquad
      y = K e^{x^{2}}
      $$

      La constante **multiplica**, no suma, porque venía de dentro del logaritmo.

      **La condición inicial:** $y(0) = K = 5$, así que

      $$
      \boxed{\;y = 5e^{x^{2}}\;}
      $$

      **La comprobación**, que cuesta diez segundos y conviene hacer siempre:
      derivando, $y' = 5\cdot 2x\,e^{x^{2}} = 2x\,(5e^{x^{2}}) = 2xy$. ✓ Y
      $y(0)=5$. ✓

  - id: ej-clasificar-cuatro-edos
    titulo: Clasificar antes de resolver
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Clasificar estas cuatro ecuaciones diferenciales y decir qué método
      resuelve cada una:

      a) $y' = \dfrac{y}{x} - \dfrac{x}{y}$
      b) $y' - 2y = x$
      c) $2xy\,dx + (x^{2}+3y^{2})\,dy = 0$
      d) $y' = -xe^{y}$
    pide: El tipo de cada EDO y su método.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué se clasifica antes de intentar resolver?
        opciones:
          - texto: Porque cada tipo tiene su método y no hay uno universal
            correcta: true
            mensaje: |
              Exacto. Y equivocarse al clasificar no da un resultado erróneo: da
              un callejón sin salida, que en un examen es peor.
          - texto: Porque el enunciado siempre dice de qué tipo es
            mensaje: |
              A veces lo dice —«resolver las siguientes EDOs exactas»— pero en un
              examen normal no, y menos en un problema aplicado donde la EDO la
              escribes tú.
          - texto: Porque solo las separables tienen solución
            mensaje: |
              Todas las de este tema tienen solución. Lo que cambia es el camino
              para llegar a ella.
      - tipo: calcular
        titulo: La comprobación de exactitud
        pregunta: |
          Para la c), con $P = 2xy$ y $Q = x^{2}+3y^{2}$, ¿cuánto vale
          $\partial P/\partial y$ en el punto $(2,1)$?
        respuesta:
          tipo: numero
          valor: '4'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Parece que has derivado como si $P$ fuera $xy$. Con el 2 delante,
              $P_y = 2x$, que en $x=2$ vale 4.
          - valor: '7'
            mensaje: |
              7 es $Q$ evaluado en $(2,1)$: $4+3$. Lo que se pide es la derivada
              de $P$ respecto de $y$.
        pista: |
          $P = 2xy$, así que $P_y = 2x$. Sustituye x=2.
        desarrollo: |
          $$
          P_y = \frac{\partial}{\partial y}(2xy) = 2x
          \qquad\Longrightarrow\qquad
          P_y(2,1) = 4
          $$

          Y $Q_x = \partial(x^{2}+3y^{2})/\partial x = 2x$, que también vale 4.
          **Coinciden: la EDO es exacta.**
      - tipo: justificar
        pregunta: |
          Ordena la clasificación. Una pieza es falsa.
        piezas:
          - texto: 'a) Todo depende de $y/x$, luego es **homogénea**: cambio $u=y/x$.'
          - texto: 'b) Tiene la forma $y^{\prime}+p(x)y=q(x)$ con $p=-2$, luego es **lineal**.'
          - texto: 'c) $P_y = Q_x = 2x$, luego es **exacta**: se busca el potencial.'
          - texto: 'd) Se separa como $e^{-y}dy = -x\,dx$, luego es **separable**.'
          - texto: 'a) También es separable, porque tiene una $y$ y una $x$ en cada término.'
            trampa: true
            mensaje: |
              Tener las dos letras no basta: separable significa poder dejar
              **todas** las $y$ a un lado y **todas** las $x$ al otro. En
              $y/x - x/y$ eso no se puede: las dos variables están mezcladas en
              los dos términos. Por eso hace falta el cambio $u=y/x$.
    resolucion: |
      **Las cuatro casillas del árbol, una por ecuación.** Es el ejercicio de
      COMP1 del tema.

      | | ecuación | tipo | método |
      |---|---|---|---|
      | a) | $y' = \frac{y}{x}-\frac{x}{y}$ | **homogénea** | cambio $u = y/x$ |
      | b) | $y' - 2y = x$ | **lineal** | factor $\mu = e^{-2x}$ |
      | c) | $2xy\,dx+(x^{2}+3y^{2})dy = 0$ | **exacta** | busca el potencial $F$ |
      | d) | $y' = -xe^{y}$ | **separable** | $e^{-y}dy = -x\,dx$ |

      **Cómo se reconoce cada una en dos segundos:**

      - **a)** Todos los términos dependen del cociente $y/x$. Y **no** es
        separable, aunque lo parezca: las dos variables están enredadas en los
        dos sumandos.
      - **b)** Está literalmente en la forma $y' + p(x)y = q(x)$, con $p=-2$ y
        $q=x$.
      - **c)** Viene escrita como $P\,dx + Q\,dy = 0$, que es la forma en que se
        presentan las exactas. Se comprueba $P_y = Q_x = 2x$. ✓
      - **d)** La $x$ y la $y$ aparecen en factores separados, así que basta
        pasar la exponencial dividiendo.

      > **El orden del árbol importa.** La b) también podría atacarse como
      > separable si $q$ fuera cero, y la c) es a la vez exacta y no separable.
      > La regla es recorrer el árbol de arriba abajo y **parar en el primer sí**,
      > porque los métodos de arriba son más baratos.

  - id: ej-lineal-con-factor-integrante
    titulo: La lineal, y el factor que la hace integrable
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Resolver $y' + 2y = 6$ con $y(0) = 1$.
    pide: La solución que cumple la condición inicial.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué esta ecuación es **lineal** y no separable?
        opciones:
          - texto: >-
              Porque tiene la forma $y' + P(x)\,y = Q(x)$, con $y$ e $y'$ a la
              primera potencia y sin multiplicarse entre sí
            correcta: true
            mensaje: |
              Eso es. Y aquí además se podría separar, porque $P$ y $Q$ son
              constantes; pero el método lineal funciona siempre que tenga esa
              forma, y por eso conviene reconocerla.
          - texto: Porque el segundo miembro es una constante
            mensaje: |
              El segundo miembro puede ser cualquier función de $x$ y la
              ecuación sigue siendo lineal. Lo que la define es cómo aparecen
              $y$ e $y'$, no qué hay al otro lado.
          - texto: Porque no se puede separar de ninguna forma
            mensaje: |
              Esta en concreto **sí** se puede separar. Que dos métodos valgan a
              la vez es normal; la clasificación dice cuáles se pueden usar, no
              cuál es el único.
      - tipo: calcular
        titulo: La constante de integración
        pregunta: |
          La solución general es $y = 3 + C\,e^{-2x}$. Con $y(0)=1$, ¿cuánto
          vale $C$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Signo cambiado. En $x=0$ la exponencial vale 1, así que
              $1 = 3 + C$ y de ahí $C = 1-3 = -2$. Si te sale $+2$ has
              despejado $C = 3-1$.
          - valor: '1'
            mensaje: |
              $1$ es $y(0)$, no $C$. La constante es lo que hay que **añadir**
              al 3 para llegar a 1, no el valor de la función.
          - valor: '3'
            mensaje: |
              $3$ es la solución particular constante, la que sale de
              $y'=0$. La condición inicial se impone sobre la suma de las dos
              piezas, no sobre una sola.
        pista: |
          En $x=0$, $e^{-2x}$ vale 1. Sustituye y despeja.
        desarrollo: |
          $$
          y(0) = 3 + C\,e^{0} = 3 + C = 1
          \qquad\Longrightarrow\qquad
          C = -2
          $$
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Está en la forma $y'' + P y = Q$ con $P = 2$, así que es lineal.'
          - texto: 'El factor integrante es $\mu = e^{\int 2\,dx} = e^{2x}$.'
          - texto: 'Multiplicando por $\mu$, el primer miembro se vuelve $(y\,e^{2x})''$.'
          - texto: 'Integrando: $y\,e^{2x} = 3e^{2x} + C$, luego $y = 3 + C e^{-2x}$.'
          - texto: 'Al factor integrante hay que sumarle su propia constante de integración.'
            trampa: true
            mensaje: |
              No. En $\mu = e^{\int P\,dx}$ la constante se puede tomar cero
              siempre: si tomaras otra, $\mu$ quedaría multiplicado por un
              número, y ese número se cancela al dividir al final. La única
              constante que sobrevive es la de la integración de la derecha.
    resolucion: |
      **Por qué es lineal.** Tiene la forma $y' + P(x)y = Q(x)$ con $P=2$ y
      $Q=6$: $y$ e $y'$ aparecen a la primera y no se multiplican entre sí. Que
      además se pueda separar no cambia nada — el árbol de clasificar se para en
      el primer sí, y aquí los dos caminos llegan al mismo sitio.

      **El factor integrante**, que es toda la idea del método:

      $$
      \mu(x) = e^{\int P\,dx} = e^{\int 2\,dx} = e^{2x}
      $$

      Sirve para esto y solo para esto: al multiplicar la ecuación por $\mu$, el
      primer miembro **se convierte en la derivada de un producto**.

      $$
      e^{2x}y' + 2e^{2x}y = 6e^{2x}
      \qquad\Longrightarrow\qquad
      \left(y\,e^{2x}\right)' = 6e^{2x}
      $$

      Y una derivada se deshace integrando:

      $$
      y\,e^{2x} = 3e^{2x} + C
      \qquad\Longrightarrow\qquad
      y = 3 + C\,e^{-2x}
      $$

      **La condición inicial.** Con $y(0)=1$ sale $C=-2$:

      $$
      \boxed{\;y = 3 - 2e^{-2x}\;}
      $$

      **La comprobación**, que cuesta diez segundos: $y' = 4e^{-2x}$, y

      $$
      y' + 2y = 4e^{-2x} + 6 - 4e^{-2x} = 6 \quad\checkmark
      $$

      > **Lo que se lleva de aquí.** El 3 es hacia donde tiende la solución
      > cuando $x$ crece —la exponencial se apaga— y el $-2$ solo dice desde
      > dónde arranca. Esa lectura vale para todos los modelos del tema: el
      > embalse, el enfriamiento, el paracaidista. La constante marca el punto de
      > partida; el término que sobrevive marca el destino.

  - id: ej-segundo-orden-dos-raices
    titulo: Segundo orden, cuando la característica tiene dos raíces
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Resolver $y'' - 5y' + 6y = 0$.
    pide: La solución general.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es el primer paso ante una ecuación de segundo orden con
          coeficientes constantes?
        opciones:
          - texto: >-
              Escribir la ecuación característica, cambiando $y''$ por $r^{2}$,
              $y'$ por $r$ e $y$ por 1
            correcta: true
            mensaje: |
              Sí. Sale de probar $y = e^{rx}$: al sustituir, la exponencial es
              factor común y lo que queda es un polinomio en $r$.
          - texto: Separar variables
            mensaje: |
              Separar variables es de primer orden. Aquí hay una segunda
              derivada y no hay nada que pasar a cada lado.
          - texto: Buscar un factor integrante
            mensaje: |
              El factor integrante también es de primer orden. En segundo orden
              con coeficientes constantes el camino es la característica.
      - tipo: calcular
        titulo: La raíz mayor
        pregunta: |
          Resolviendo $r^{2}-5r+6=0$, ¿cuál es la raíz **mayor**?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              $2$ es la otra raíz, la menor. Las dos valen para la solución
              —$y = C_1e^{2x}+C_2e^{3x}$—, pero aquí se pide la mayor.
          - valor: '6'
            mensaje: |
              $6$ es el término independiente, que es el **producto** de las dos
              raíces. La suma es 5 y el producto 6: eso da 2 y 3.
          - valor: '5'
            mensaje: |
              $5$ es la suma de las dos raíces, que aparece con el signo
              cambiado como coeficiente de $r$. No es una raíz.
        pista: |
          Dos números que sumen 5 y multiplicados den 6.
        desarrollo: |
          $$
          r^{2}-5r+6 = (r-2)(r-3) = 0
          \qquad\Longrightarrow\qquad
          r = 2,\; 3
          $$
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'Se prueba $y = e^{rx}$ y se sustituye: $r^{2}e^{rx}-5re^{rx}+6e^{rx}=0$.'
          - texto: 'Como $e^{rx}$ nunca vale cero, se puede dividir por él y queda $r^{2}-5r+6=0$.'
          - texto: 'Las raíces son $2$ y $3$, reales y distintas.'
          - texto: 'La solución general es $y = C_1e^{2x} + C_2e^{3x}$.'
          - texto: 'Como hay dos raíces, hacen falta dos condiciones iniciales para que la solución exista.'
            trampa: true
            mensaje: |
              La solución general **existe** sin ninguna condición: es toda la
              familia. Las dos condiciones hacen falta para elegir **una** de
              ellas, que es otra cosa. Un ejercicio que no las da está pidiendo
              la familia entera, y contestar con una sola solución es responder
              de menos.
    resolucion: |
      **De dónde sale la característica.** Se prueba $y = e^{rx}$, que es la
      única función que se reproduce al derivar. Sustituyendo:

      $$
      r^{2}e^{rx} - 5re^{rx} + 6e^{rx} = 0
      $$

      Y como $e^{rx}$ **no se anula nunca**, se puede dividir por él sin perder
      soluciones. Ese detalle es el que convierte una ecuación diferencial en
      un polinomio:

      $$
      r^{2}-5r+6 = 0
      \qquad\Longrightarrow\qquad
      (r-2)(r-3)=0
      \qquad\Longrightarrow\qquad
      r = 2,\;3
      $$

      **Dos raíces reales y distintas** dan dos exponenciales independientes, y
      la solución general es su combinación:

      $$
      \boxed{\;y = C_1e^{2x} + C_2e^{3x}\;}
      $$

      > **Los tres casos, para tenerlos vistos.** Con raíces reales distintas
      > salen dos exponenciales. Con una raíz **doble** $r$ sale
      > $(C_1 + C_2x)e^{rx}$ — hace falta la $x$ porque si no las dos piezas
      > serían la misma. Y con raíces **complejas** $a\pm bi$ sale
      > $e^{ax}(C_1\cos bx + C_2\,\text{sen}\,bx)$, que es la que oscila. El
      > discriminante decide cuál de los tres, y conviene mirarlo antes de
      > resolver: dice si la solución va a crecer, a decaer o a oscilar.

  - id: ej-particular-sin-resonancia
    titulo: La particular, cuando el segundo miembro no resuena
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Hallar una solución particular de $y'' - y = 3e^{2x}$.
    pide: Una solución particular de la ecuación completa.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué se puede proponer $y_p = A e^{2x}$ sin multiplicar por $x$?
        opciones:
          - texto: >-
              Porque $2$ **no** es raíz de la característica $r^{2}-1=0$, cuyas
              raíces son $\pm 1$
            correcta: true
            mensaje: |
              Exacto. Esa comparación es lo primero que hay que hacer, siempre.
              Si el exponente coincidiera con una raíz, la propuesta se anularía
              al sustituir y habría que multiplicarla por $x$.
          - texto: Porque el segundo miembro es una exponencial
            mensaje: |
              Que sea exponencial dice **qué forma** proponer, no si hace falta
              el factor $x$. Eso lo decide comparar el exponente con las raíces.
          - texto: Porque la ecuación es homogénea
            mensaje: |
              No lo es: tiene un segundo miembro distinto de cero. Justo por eso
              hace falta una particular además de la homogénea.
      - tipo: calcular
        titulo: El coeficiente de la particular
        pregunta: |
          Sustituyendo $y_p = A e^{2x}$ en $y''-y = 3e^{2x}$, ¿cuánto vale $A$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              $3$ es el coeficiente del segundo miembro copiado tal cual. Hay
              que sustituir: $y_p'' - y_p = 4Ae^{2x}-Ae^{2x} = 3Ae^{2x}$, y eso
              igualado a $3e^{2x}$ da $A=1$.
          - valor: '0.75'
            mensaje: |
              $\frac34$ saldría de dividir 3 entre 4, o sea de quedarse solo con
              el $y''$ y olvidar el $-y$. El factor correcto es $4-1=3$.
          - valor: '0.3333333'
            mensaje: |
              $\frac13$ es el inverso: has dividido 1 entre 3 en vez de 3 entre
              3. Al sustituir queda $3A = 3$.
        pista: |
          $y_p'' = 4Ae^{2x}$. Resta $y_p$ y iguala a $3e^{2x}$.
        desarrollo: |
          $$
          y_p = Ae^{2x},
          \qquad
          y_p'' = 4Ae^{2x}
          $$

          $$
          y_p'' - y_p = 4Ae^{2x} - Ae^{2x} = 3Ae^{2x} = 3e^{2x}
          \qquad\Longrightarrow\qquad
          A = 1
          $$
      - tipo: justificar
        pregunta: |
          Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: 'La característica es $r^{2}-1=0$, con raíces $r=\pm1$.'
          - texto: 'El exponente del segundo miembro es 2, que no está entre las raíces: no hay resonancia.'
          - texto: 'Se propone $y_p = Ae^{2x}$ y se sustituye, saliendo $3A=3$, o sea $A=1$.'
          - texto: 'La solución completa es $y = C_1e^{x}+C_2e^{-x}+e^{2x}$.'
          - texto: 'Como la particular ya cumple la ecuación, la homogénea sobra.'
            trampa: true
            mensaje: |
              La particular cumple la ecuación completa, sí, pero es **una**
              solución, no todas. La general es homogénea más particular, y sin
              la homogénea no hay constantes con las que imponer condiciones
              iniciales. Quitarla es responder a un ejercicio distinto.
    resolucion: |
      **Lo primero es comparar, no proponer.** La característica es
      $r^{2}-1=0$, con raíces $r=\pm1$. El segundo miembro es $3e^{2x}$, y su
      exponente es $2$: **no coincide con ninguna raíz**, así que no hay
      resonancia y la propuesta va sin el factor $x$.

      $$
      y_p = A e^{2x}
      \qquad\Longrightarrow\qquad
      y_p'' = 4Ae^{2x}
      $$

      $$
      y_p'' - y_p = (4A - A)e^{2x} = 3Ae^{2x} = 3e^{2x}
      \qquad\Longrightarrow\qquad
      A = 1
      $$

      $$
      \boxed{\;y_p = e^{2x}\;}
      $$

      Y la solución **general** es la homogénea más esta:

      $$
      y = C_1e^{x} + C_2e^{-x} + e^{2x}
      $$

      > **Por qué la comparación va primero.** Si el segundo miembro hubiera
      > sido $3e^{x}$, con exponente 1 —que **sí** es raíz—, al sustituir
      > $Ae^{x}$ saldría $A e^{x} - A e^{x} = 0 \neq 3e^{x}$: la propuesta se
      > anula sola y no queda nada que igualar. Ese es el caso que obliga a
      > multiplicar por $x$, y es el que cae en cuatro de los siete ejercicios
      > de EDO de la ordinaria. Mirar las raíces antes de proponer cuesta diez
      > segundos y evita descubrirlo a mitad de la cuenta.

  # ═══════════════════════════════════════════════════════════════════
  # Del boletín de problemas complementarios del tema 9.
  # ═══════════════════════════════════════════════════════════════════

  - id: estudio-cualitativo-sin-resolver
    titulo: Estudiar la solución sin resolver la ecuación
    fuente: Ejercicio 9.1 · Problemas complementarios, tema 9 · Cálculo, UPV/EHU (2016/2017 4E AT)
    nivel: practica
    enunciado: |
      Sea $y(x)$ la solución de la EDO $y' = -xy$.

      a) Sin resolver la EDO, estudiar los intervalos de
      crecimiento/decrecimiento y concavidad/convexidad de la función $y$.
      b) Calcular el polinomio de Taylor de orden 2 de la función $y(x)$ en el
      punto $a=0$, sabiendo que $y(0)=3$.
      c) Resolver la EDO con la condición inicial $y(0)=3$ y verificar los
      resultados obtenidos en el apartado a).
    pide: El estudio cualitativo, el Taylor de orden 2 y la comprobación.
    pasos:
      - tipo: reconocer
        pregunta: |
          «Sin resolver la EDO, estudiar el crecimiento». ¿De dónde sale la
          información?
        opciones:
          - texto: De la propia ecuación, que ya da la derivada en función de x e y
            correcta: true
            mensaje: |
              Justo. La EDO **es** la fórmula de $y'$. Para el crecimiento no
              hace falta nada más que estudiar el signo de $-xy$.
          - texto: Hay que resolverla primero aunque el enunciado diga que no
            mensaje: |
              No hace falta, y el enunciado lo prohíbe expresamente. Además la
              gracia del ejercicio es que muchas EDOs reales no se pueden
              resolver y aun así hay que saber cómo se comportan.
          - texto: De la condición inicial
            mensaje: |
              La condición inicial hace falta para el apartado b), pero el signo
              de $y'$ se estudia sin ella.
      - tipo: calcular
        titulo: La segunda derivada
        pregunta: |
          Derivando $y' = -xy$ respecto de $x$ y sustituyendo, sale
          $y'' = y(x^{2}-1)$. ¿Cuánto vale $y''(0)$ si $y(0)=3$?
        respuesta:
          tipo: numero
          valor: '-3'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '3'
            mensaje: |
              Signo cambiado. En $x=0$, el factor $x^{2}-1$ vale $-1$, así que
              $y''(0) = 3\cdot(-1) = -3$.
          - valor: '0'
            mensaje: |
              0 es el valor de $y'(0)$, no de $y''(0)$. La primera derivada se
              anula en el origen; la segunda no.
        pista: |
          Sustituye x=0 y y=3 en $y(x^2-1)$. El paréntesis vale −1.
        desarrollo: |
          $$
          y'' = \frac{d}{dx}(-xy) = -y - x\,y' = -y - x(-xy) = y(x^{2}-1)
          $$

          $$
          y''(0) = 3\,(0-1) = -3
          $$

          Negativa, así que en el origen la solución es **cóncava** — coincide
          con que $y(0)=3$ es un máximo.
      - tipo: justificar
        pregunta: |
          Ordena el estudio del apartado a), suponiendo $y>0$. Una pieza es falsa.
        piezas:
          - texto: '$y^{\prime} = -xy$, y con $y>0$ el signo lo decide $-x$.'
          - texto: 'Luego $y$ **crece** para $x<0$ y **decrece** para $x>0$.'
          - texto: 'En $x=0$ hay un máximo, porque la derivada cambia de $+$ a $-$.'
          - texto: '$y^{\prime\prime} = y(x^{2}-1)$ es negativa entre $-1$ y $1$, y positiva fuera.'
          - texto: 'Como $y^{\prime} = -xy$ depende de $y$, el crecimiento no se puede estudiar sin resolver.'
            trampa: true
            mensaje: |
              Sí se puede: basta con saber el **signo** de $y$, que la condición
              inicial $y(0)=3>0$ garantiza. No hace falta la fórmula de $y$, solo
              si es positiva o negativa.
    resolucion: |
      **a) El estudio cualitativo.** La condición inicial $y(0)=3>0$ garantiza
      que la solución es positiva —una solución de esta EDO no puede cruzar el
      eje—, así que en $y' = -xy$ el signo lo pone $-x$:

      | intervalo | signo de $y'$ | comportamiento |
      |---|---|---|
      | $x<0$ | $+$ | **crece** |
      | $x>0$ | $-$ | **decrece** |

      Y en $x=0$ hay un **máximo**.

      Para la concavidad se deriva la ecuación:

      $$
      y'' = -y - x\,y' = -y -x(-xy) = y\,(x^{2}-1)
      $$

      Con $y>0$, el signo es el de $x^{2}-1$:

      | intervalo | $y''$ | |
      |---|---|---|
      | $x<-1$ | $+$ | convexa |
      | $-1<x<1$ | $-$ | **cóncava** |
      | $x>1$ | $+$ | convexa |

      Hay **inflexiones en $x=\pm 1$**.

      **b) El Taylor de orden 2 en $a=0$.** Ya tenemos todo:

      $$
      y(0)=3,
      \qquad
      y'(0) = -0\cdot 3 = 0,
      \qquad
      y''(0) = 3(0-1) = -3
      $$

      $$
      P_2(x) = 3 + 0\cdot x - \frac{3}{2}x^{2} = 3 - \frac{3}{2}x^{2}
      $$

      **c) Resolviendo de verdad**, que es separable:

      $$
      \frac{dy}{y} = -x\,dx
      \;\Longrightarrow\;
      \ln|y| = -\frac{x^{2}}{2}+C
      \;\Longrightarrow\;
      y = Ke^{-x^{2}/2}
      $$

      Con $y(0)=3$: $\;y = 3e^{-x^{2}/2}$.

      **Y ahora la verificación**, que es la parte que da la nota de COMP4. Es
      una campana de Gauss centrada en 0: crece a la izquierda, decrece a la
      derecha, máximo en el origen y **puntos de inflexión en $x=\pm 1$**.
      Coincide con todo lo del apartado a), obtenido sin resolver nada.

      > **Por qué este ejercicio cae tanto.** La inmensa mayoría de las
      > ecuaciones diferenciales reales no tienen solución en fórmula, y aun así
      > hay que saber si la solución crece, si se estabiliza o si se dispara.
      > El apartado a) entrena eso; el c) demuestra que funciona.

  - id: embalse-y-largo-plazo
    titulo: El embalse, y qué pasa a largo plazo
    fuente: Ejercicio 9.14 · Problemas complementarios, tema 9 · Cálculo, UPV/EHU (2020/2021 7E)
    nivel: practica
    enunciado: |
      Un embalse recibe una cantidad de agua de lluvia de 1000 litros al mes. Por
      otra parte, el agua se evapora con una tasa del 5 % mensual. Sabiendo que
      la cantidad de agua $C(t)$ del embalse en función del tiempo $t$ (medido en
      meses) satisface la EDO

      $$
      C'(t) = 1000 - 0{,}05\,C(t)
      $$

      a) Calcular la solución general de la EDO anterior.
      b) ¿Qué sucederá a largo plazo?
    pide: La solución general y el comportamiento asintótico.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tipo de EDO es $C' = 1000 - 0{,}05C$?
        opciones:
          - texto: Lineal de primer orden, y también separable
            correcta: true
            mensaje: |
              Las dos cosas, y por eso admite dos caminos. Reescrita como
              $C' + 0{,}05C = 1000$ es lineal de libro; y como
              $dC/(1000-0{,}05C) = dt$ es separable. La separable sale antes.
          - texto: De segundo orden, porque hay una tasa
            mensaje: |
              «Tasa» significa derivada primera. Solo aparece $C'$, así que es de
              primer orden.
          - texto: Homogénea
            mensaje: |
              Homogénea significa que todo depende del cociente de las variables,
              y aquí hay un término constante de 1000 que lo impide.
      - tipo: calcular
        titulo: El nivel de equilibrio
        pregunta: |
          A largo plazo el embalse se estabiliza donde $C' = 0$. ¿Cuántos litros
          son?
        respuesta:
          tipo: numero
          valor: '20000'
          tolerancia: 0.1
          formato: un número, en litros
        distractores:
          - valor: '1000'
            mensaje: |
              1000 es lo que entra cada mes, no el nivel de equilibrio. El
              equilibrio llega cuando lo que se evapora iguala a lo que entra:
              $0{,}05C = 1000$.
          - valor: '50'
            mensaje: |
              Parece que has multiplicado en vez de dividir. De
              $1000 = 0{,}05C$ sale $C = 1000/0{,}05$, no $1000\cdot 0{,}05$.
        pista: |
          Resuelve $1000 - 0,05C = 0$. Divide 1000 entre 0,05.
        desarrollo: |
          $$
          1000 - 0{,}05\,C = 0
          \qquad\Longrightarrow\qquad
          C = \frac{1000}{0{,}05} = 20\,000 \text{ litros}
          $$

          Y fíjate en que esto **no ha necesitado resolver la EDO**: el
          equilibrio se lee directamente en la ecuación.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'Separando: $\frac{dC}{1000-0{,}05C} = dt$.'
          - texto: 'Integrando y despejando sale $C(t) = 20000 + Ke^{-0{,}05t}$.'
          - texto: 'Como el exponente es negativo, el término con $K$ tiende a cero.'
          - texto: 'b) A largo plazo el embalse se estabiliza en 20 000 litros, venga del nivel que venga.'
          - texto: 'b) A largo plazo el embalse crece sin límite, porque sigue entrando agua todos los meses.'
            trampa: true
            mensaje: |
              Entra agua, sí, pero la evaporación **crece con lo que hay**:
              cuanto más lleno, más se evapora. En 20 000 litros la evaporación
              iguala exactamente a la lluvia y el nivel se estanca. Es lo que
              distingue un crecimiento lineal de uno con realimentación.
    resolucion: |
      **a) La solución general.** Es separable, que es el camino corto:

      $$
      \frac{dC}{1000-0{,}05C} = dt
      $$

      Integrando el lado izquierdo (con el $-0{,}05$ que sale del cambio):

      $$
      -\frac{1}{0{,}05}\ln|1000-0{,}05C| = t + C_1
      $$

      Despejando:

      $$
      \boxed{\;C(t) = 20\,000 + K e^{-0{,}05\,t}\;}
      $$

      **La forma de la solución ya cuenta la historia**: un valor fijo más algo
      que se desvanece.

      **b) A largo plazo.** Como el exponente es negativo, $e^{-0{,}05t}\to 0$
      cuando $t\to\infty$, así que

      $$
      \lim_{t\to\infty} C(t) = 20\,000 \text{ litros}
      $$

      **El embalse se estabiliza en 20 000 litros**, y —esto es lo importante—
      **da igual con cuánta agua empiece**. Si empieza con menos, sube hasta ahí;
      si empieza con más, baja hasta ahí. La constante $K$ solo dice desde dónde
      vienes, no adónde vas.

      > **El atajo que conviene tener a mano.** El nivel de equilibrio se saca
      > sin resolver nada: es donde $C'=0$, o sea $1000 = 0{,}05C$. Contestar el
      > apartado b) directamente así es correcto y completo — y si además el
      > apartado a) confirma el mismo número, tienes la comprobación gratis.

  - id: particular-que-resuena
    titulo: Cuando la particular ya está en la homogénea
    fuente: Ejercicio 9.10d · Problemas complementarios, tema 9 · Cálculo, UPV/EHU (2018/2019 5E)
    nivel: practica
    enunciado: |
      Utilizando el método de coeficientes indeterminados, resolver la ecuación
      diferencial

      $$
      y'' + 25y = 4\cos 5x - 7e^{5x}
      $$
    pide: La solución general de la ecuación.
    pasos:
      - tipo: reconocer
        pregunta: |
          La característica es $r^{2}+25=0$, con raíces $\pm 5i$, así que la
          homogénea lleva $\cos 5x$ y $\text{sen}\,5x$. ¿Qué implica eso para la
          particular?
        opciones:
          - texto: Que el término con cos5x resuena y hay que multiplicarlo por x
            correcta: true
            mensaje: |
              Exacto. Probar $A\cos 5x + B\,\text{sen}\,5x$ no puede funcionar:
              esa función ya resuelve la homogénea, así que al sustituirla sale
              $0 = 4\cos 5x$, un absurdo. La cura es multiplicar por $x$.
          - texto: Que no hay solución particular
            mensaje: |
              Sí la hay; lo que no vale es la forma ingenua. La resonancia no
              impide resolver: obliga a subir el grado del ensayo.
          - texto: Que hay que usar variación de parámetros obligatoriamente
            mensaje: |
              Es una alternativa válida y más larga. Con coeficientes
              indeterminados basta multiplicar por $x$, y el enunciado pide
              precisamente ese método.
      - tipo: calcular
        titulo: El coeficiente del término resonante
        pregunta: |
          Probando $y_p = x\,(A\cos 5x + B\,\text{sen}\,5x)$ para el trozo
          $4\cos 5x$, sale $A=0$ y $B$ distinto de cero. ¿Cuánto vale $B$?
        respuesta:
          tipo: numero
          valor: '0.4'
          tolerancia: 0.01
          formato: en forma exacta (2/5) o con un decimal
        distractores:
          - valor: '4'
            mensaje: |
              4 es el coeficiente del segundo miembro, no el de la particular.
              Al sustituir aparece un factor $10B$ que hay que igualar a 4, de
              donde $B=2/5$.
          - valor: '0.1'
            mensaje: |
              Parece que has dividido 4 entre 40. El factor que aparece al
              derivar dos veces $x\,\text{sen}\,5x$ es $10$, no 40.
        pista: |
          Al sustituir queda $10B\cos 5x = 4\cos 5x$. Despeja B.
        desarrollo: |
          Derivando dos veces $y_p = x(A\cos 5x + B\,\text{sen}\,5x)$ y
          sustituyendo, los términos con $x$ se cancelan —eso es la señal de que
          el ensayo es el bueno— y queda

          $$
          -10A\,\text{sen}\,5x + 10B\cos 5x = 4\cos 5x
          $$

          $$
          A = 0,
          \qquad
          B = \frac{4}{10} = \frac{2}{5}
          $$
      - tipo: calcular
        titulo: El coeficiente de la exponencial
        pregunta: |
          Para el trozo $-7e^{5x}$ se prueba $Ce^{5x}$ sin multiplicar por $x$,
          porque $5$ no es raíz de la característica. Sustituyendo sale
          $50C = -7$. ¿Cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '-0.14'
          tolerancia: 0.005
          formato: en forma exacta (-7/50) o con dos decimales
        distractores:
          - valor: '0.14'
            mensaje: |
              Signo cambiado. El segundo miembro lleva $-7e^{5x}$, así que
              $C = -7/50$ es negativo.
          - valor: '-0.28'
            mensaje: |
              Parece que has dividido entre 25 en vez de entre 50. Al sustituir
              $Ce^{5x}$ en $y''+25y$ sale $25C + 25C = 50C$.
        pista: |
          $C = -7/50$. Divide.
        desarrollo: |
          $$
          (Ce^{5x})'' + 25\,Ce^{5x} = 25Ce^{5x} + 25Ce^{5x} = 50Ce^{5x} = -7e^{5x}
          $$

          $$
          C = -\frac{7}{50} = -0{,}14
          $$

          Aquí **no** hay resonancia porque $r=5$ no es raíz de $r^{2}+25=0$:
          las raíces son imaginarias puras.
      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: 'La característica $r^{2}+25=0$ da $r=\pm 5i$, luego $y_h = C_1\cos 5x + C_2\,\text{sen}\,5x$.'
          - texto: 'El trozo $4\cos 5x$ **resuena** con la homogénea, así que se prueba $x(A\cos 5x+B\,\text{sen}\,5x)$.'
          - texto: 'El trozo $-7e^{5x}$ no resuena, así que basta $Ce^{5x}$.'
          - texto: 'Resolviendo, $A=0$, $B=2/5$ y $C=-7/50$.'
          - texto: 'Como el segundo miembro tiene dos trozos, hay que multiplicar los dos por $x$.'
            trampa: true
            mensaje: |
              Solo se multiplica el trozo que resuena. La exponencial $e^{5x}$ no
              está en la homogénea —las raíces son $\pm 5i$, no $5$— así que
              multiplicarla por $x$ complicaría la cuenta sin necesidad y daría
              un sistema incompatible.
    resolucion: |
      **El ejercicio existe para el caso de resonancia**, que es el fallo más
      común del bloque y se detecta antes de calcular nada.

      **La homogénea.** $r^{2}+25=0$ da $r=\pm 5i$:

      $$
      y_h = C_1\cos 5x + C_2\,\text{sen}\,5x
      $$

      **El aviso.** El segundo miembro trae $4\cos 5x$, y $\cos 5x$ **ya está**
      en la homogénea. Probar $A\cos 5x + B\,\text{sen}\,5x$ daría $0 = 4\cos 5x$.

      **La cura: multiplicar por $x$.**

      $$
      y_{p1} = x\bigl(A\cos 5x + B\,\text{sen}\,5x\bigr)
      \qquad\Longrightarrow\qquad
      A=0,\; B=\tfrac{2}{5}
      $$

      **El otro trozo no resuena**, porque $5$ no es raíz de la característica:

      $$
      y_{p2} = Ce^{5x}
      \qquad\Longrightarrow\qquad
      50C = -7,\; C = -\tfrac{7}{50}
      $$

      **La solución general:**

      $$
      \boxed{\;y = C_1\cos 5x + C_2\,\text{sen}\,5x + \tfrac{2}{5}\,x\,\text{sen}\,5x - \tfrac{7}{50}e^{5x}\;}
      $$

      > **El control que evita el callejón.** Antes de escribir el ensayo,
      > compara **cada trozo** del segundo miembro con las raíces de la
      > característica. Aquí uno resuena y el otro no, y tratarlos igual —de
      > cualquiera de las dos maneras— lleva a un sistema sin solución.

  - id: paracaidista-y-velocidad-limite
    titulo: El paracaidista y su velocidad límite
    fuente: Ejercicio 9.19 · Problemas complementarios, tema 9 · Cálculo, UPV/EHU (2016/2017 5E)
    nivel: practica
    enunciado: |
      Un paracaidista se lanza desde un avión y empieza a acelerar hasta
      alcanzar una velocidad constante, conocida como «velocidad terminal». La
      altura $y(t)$ del paracaidista cumple la EDO $m\,y'' + k\,y' = mg$, siendo
      $m$ la masa, $k$ una constante de rozamiento con el aire y $g$ la
      gravedad.

      a) Calcular la solución general con $m = 50$ kg, $k = 10$ kg/s y
      $g = 10$ m/s².
      b) Calcular la velocidad límite que alcanzará en su caída libre.
    pide: La solución general y la velocidad terminal.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con los datos, la ecuación es $50y'' + 10y' = 500$. ¿Qué tiene de
          particular?
        opciones:
          - texto: Que no aparece la y sin derivar, así que se puede bajar el orden
            correcta: true
            mensaje: |
              Sí. Llamando $v = y'$ queda una EDO de primer orden en $v$, que
              además es justo lo que se pide en el apartado b): la velocidad.
          - texto: Que es homogénea
            mensaje: |
              El término independiente 500 lo impide. Homogénea significa
              segundo miembro nulo.
          - texto: Que no se puede resolver con coeficientes indeterminados
            mensaje: |
              Sí se puede, y es un camino válido: raíces $r=0$ y $r=-1/5$, y una
              particular lineal. Lo que pasa es que bajar el orden es más
              directo y contesta antes el apartado b).
      - tipo: calcular
        titulo: La velocidad terminal
        pregunta: |
          La velocidad se estabiliza cuando la aceleración se anula. Poniendo
          $y''=0$ en $50y''+10y'=500$, ¿cuánto vale $y'$ en m/s?
        respuesta:
          tipo: numero
          valor: '50'
          tolerancia: 0.1
          formato: un número, en m/s
        distractores:
          - valor: '10'
            mensaje: |
              10 es el valor de $k$ y también el de $g$. La velocidad terminal
              sale de $10\,v = 500$, o sea $v = 50$.
          - valor: '5'
            mensaje: |
              5 sería $m/k$, el tiempo característico de la exponencial en
              segundos, no una velocidad. Ojo a las unidades.
        pista: |
          Con y''=0 queda $10 y' = 500$. Divide.
        desarrollo: |
          $$
          50\cdot 0 + 10\,y' = 500
          \qquad\Longrightarrow\qquad
          y' = 50 \text{ m/s}
          $$

          Y esto **no ha necesitado resolver la EDO**: la velocidad límite se lee
          en la propia ecuación, igual que el nivel de equilibrio del embalse.
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'Con los datos, la ecuación es $50y^{\prime\prime}+10y^{\prime}=500$, o sea $y^{\prime\prime}+0{,}2\,y^{\prime}=10$.'
          - texto: 'La característica $r^{2}+0{,}2r=0$ da $r=0$ y $r=-1/5$.'
          - texto: 'La solución general es $y = C_1 + C_2 e^{-t/5} + 50\,t$.'
          - texto: 'b) Derivando, la velocidad tiende a 50 m/s cuando la exponencial se desvanece.'
          - texto: 'b) La velocidad crece sin límite, porque la gravedad sigue actuando siempre.'
            trampa: true
            mensaje: |
              La gravedad sí actúa siempre, pero el rozamiento **crece con la
              velocidad**: cuanto más rápido cae, más frena el aire. En 50 m/s
              las dos fuerzas se igualan y la aceleración se anula. Es la misma
              realimentación que en el embalse.
    resolucion: |
      **a) La solución general.** Con $m=50$, $k=10$ y $g=10$:

      $$
      50\,y'' + 10\,y' = 500
      \qquad\Longleftrightarrow\qquad
      y'' + 0{,}2\,y' = 10
      $$

      Característica $r^{2}+0{,}2r = r(r+0{,}2) = 0$, o sea $r=0$ y $r=-1/5$:

      $$
      y_h = C_1 + C_2\,e^{-t/5}
      $$

      Y como el segundo miembro es una constante y **$r=0$ ya está en la
      homogénea**, la particular hay que multiplicarla por $t$: se prueba
      $y_p = At$ y sale $A=50$.

      $$
      \boxed{\;y(t) = C_1 + C_2\,e^{-t/5} + 50\,t\;}
      $$

      **b) La velocidad límite.** Derivando,

      $$
      y'(t) = -\frac{C_2}{5}e^{-t/5} + 50
      \qquad\Longrightarrow\qquad
      \lim_{t\to\infty} y'(t) = 50 \text{ m/s}
      $$

      **Y se puede contestar sin resolver nada.** La velocidad se estabiliza
      cuando deja de acelerar, o sea con $y''=0$:

      $$
      10\,y' = 500 \;\Longrightarrow\; y' = 50 \text{ m/s}
      $$

      > **Es el mismo razonamiento que el embalse**, con otra ropa: hay una
      > entrada constante —la gravedad— y una salida proporcional a lo que hay
      > —el rozamiento, que crece con la velocidad—. El equilibrio llega cuando
      > se igualan, y ese equilibrio se lee en la ecuación, no en su solución.
      > 50 m/s son 180 km/h, que es el orden de magnitud real de una caída libre
      > sin abrir el paracaídas. ✓

  - id: barra-que-se-calienta
    titulo: La ley de Newton del enfriamiento
    fuente: Ejercicio 9.18 · Problemas complementarios, tema 9 · Cálculo, UPV/EHU (2017/2018 5E)
    nivel: practica
    enunciado: |
      Cuando un objeto absorbe calor del medio que lo rodea sigue la Ley de
      Newton, que establece que la tasa de pérdida de calor de un cuerpo es
      proporcional a la diferencia de temperatura entre el cuerpo y la
      temperatura ambiente. Una pequeña barra de metal, cuya temperatura inicial
      es de 20 °C, se deja caer en un recipiente con agua hirviendo. Calcular el
      tiempo que tarda la barra en alcanzar los 90 °C, si se sabe que su
      temperatura aumentó 2 °C en un segundo. ¿Cuánto tardará la barra en
      alcanzar los 98 °C?
    pide: Los dos tiempos, en segundos.
    pasos:
      - tipo: reconocer
        pregunta: |
          «La tasa es proporcional a la diferencia con la temperatura ambiente».
          ¿Qué ecuación es?
        opciones:
          - texto: La derivada de T es k por (100 menos T), con el agua hirviendo a 100 °C
            correcta: true
            mensaje: |
              Eso es. La diferencia es con el **ambiente**, que aquí es el agua
              a 100 °C. Y como la barra está más fría, se calienta: la
              diferencia es positiva y $T$ crece.
          - texto: La derivada de T es k por T
            mensaje: |
              Eso sería «proporcional a la temperatura», que es otra ley — la del
              crecimiento exponencial puro. Newton habla de la **diferencia** con
              el ambiente.
          - texto: La derivada de T es k por (T menos 20)
            mensaje: |
              20 es la temperatura **inicial** de la barra, no la del ambiente.
              La condición inicial y el ambiente son dos datos distintos y se
              confunden con facilidad.
      - tipo: calcular
        titulo: La constante, con el dato del primer segundo
        pregunta: |
          En $t=0$ la barra está a 20 °C y sube 2 °C en un segundo. Aproximando
          $T'(0)\approx 2$, y con $T'=k(100-T)$, ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.025'
          tolerancia: 0.0005
          formato: un número
        distractores:
          - valor: '0.1'
            mensaje: |
              $0{,}1$ saldría de dividir 2 entre 20, usando la temperatura
              inicial. Lo que va en el denominador es la **diferencia** con el
              ambiente: $100-20 = 80$.
          - valor: '40'
            mensaje: |
              Has dividido al revés: $80/2$. La ecuación es $2 = k\cdot 80$, así
              que $k = 2/80$.
        pista: |
          $2 = k(100-20) = 80k$.
        desarrollo: |
          $$
          T'(0) = k\,(100-20) = 80k = 2
          \qquad\Longrightarrow\qquad
          k = \frac{2}{80} = 0{,}025
          $$
      - tipo: calcular
        titulo: El tiempo hasta los 90 °C
        pregunta: |
          Con $T(t) = 100 - 80e^{-0{,}025t}$, el tiempo para llegar a 90 °C sale
          de $80e^{-0{,}025t} = 10$. ¿Cuántos segundos son?
        respuesta:
          tipo: numero
          valor: '83.2'
          tolerancia: 1.5
          formato: en segundos, con un decimal
        distractores:
          - valor: '35'
            mensaje: |
              35 sería el tiempo si la barra subiera 2 °C **cada** segundo a
              ritmo constante. No lo hace: cuanto más se acerca a 100, más
              despacio sube.
          - valor: '27.7'
            mensaje: |
              $27{,}7$ es $\ln(2)/0{,}025$, o sea el tiempo en recorrer la mitad
              de la diferencia. Aquí hay que recorrer siete octavos de ella.
        pista: |
          $e^{-0,025t} = 1/8$, así que $0,025t = \ln 8$. Y $\ln 8 \approx 2,079$.
        desarrollo: |
          $$
          80\,e^{-0{,}025t} = 10
          \;\Longrightarrow\;
          e^{-0{,}025t} = \tfrac18
          \;\Longrightarrow\;
          0{,}025\,t = \ln 8
          $$

          $$
          t = \frac{\ln 8}{0{,}025} = \frac{2{,}0794}{0{,}025} \approx 83{,}2 \text{ s}
          $$
      - tipo: justificar
        pregunta: |
          Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: 'La ley de Newton da $T^{\prime} = k(100-T)$, con condición inicial $T(0)=20$.'
          - texto: 'Es separable, y su solución es $T(t) = 100 - 80e^{-kt}$.'
          - texto: 'El dato del primer segundo fija $k = 0{,}025$.'
          - texto: 'Para 90 °C hacen falta unos 83 s, y para 98 °C bastante más: unos 148 s.'
          - texto: 'Como de 90 a 98 solo van 8 grados y la barra sube 2 por segundo, tardará 4 s más.'
            mensaje: |
              Los 2 °C por segundo son el ritmo **inicial**, cuando la diferencia
              con el ambiente es máxima. Cerca de los 100 °C esa diferencia es
              casi nula y la barra sube muy despacio: de 90 a 98 tarda más de un
              minuto, no cuatro segundos.
            trampa: true
    resolucion: |
      **Traducir la ley.** «Proporcional a la diferencia con el ambiente», y el
      ambiente es el agua hirviendo a 100 °C:

      $$
      T'(t) = k\,\bigl(100 - T(t)\bigr),
      \qquad T(0) = 20
      $$

      **Resolver**, que es separable:

      $$
      \frac{dT}{100-T} = k\,dt
      \;\Longrightarrow\;
      -\ln|100-T| = kt + C
      \;\Longrightarrow\;
      T(t) = 100 - A\,e^{-kt}
      $$

      Con $T(0)=20$ sale $A = 80$.

      **La constante**, con el dato del primer segundo. Usando
      $T'(0) = k\cdot 80 = 2$:

      $$
      k = 0{,}025
      $$

      **Los dos tiempos:**

      | objetivo | ecuación | tiempo |
      |---|---|---|
      | 90 °C | $80e^{-0{,}025t} = 10$ | $\dfrac{\ln 8}{0{,}025} \approx 83$ s |
      | 98 °C | $80e^{-0{,}025t} = 2$ | $\dfrac{\ln 40}{0{,}025} \approx 148$ s |

      > **El detalle que da sentido al resultado.** De 20 a 90 °C —setenta
      > grados— tarda 83 segundos. De 90 a 98 —ocho grados— tarda otros 65. No
      > es un error: **cuanto más se acerca al ambiente, más despacio se
      > calienta**, porque la fuerza que la empuja es justo esa diferencia. Y
      > los 100 °C no los alcanza nunca; solo se les acerca.

  # ═══════════════════════════════════════════════════════════════════
  # Boletín «Ecuaciones diferenciales. Problemas» · los seis ejercicios,
  # con el 6 partido en dos por método.
  # ═══════════════════════════════════════════════════════════════════

  - id: siete-edos-separables-y-exactas
    titulo: Siete EDOs, y la pregunta que hay que hacerse antes de tocar nada
    fuente: >-
      Ejercicio 1 · Boletín «Ecuaciones diferenciales. Problemas» · Cálculo,
      UPV/EHU · Departamento de Matemática Aplicada. El boletín publica los
      siete resultados y el desarrollo está contrastado contra ellos.
    nivel: practica
    enunciado: |
      Resolver las siguientes EDOs:

      (a) $y(1-x)\,dx + x^{2}(1-y)\,dy = 0$

      (b) $e^{x^{3}-y^{2}} + \dfrac{y}{x^{2}}\dfrac{dy}{dx} = 0$

      (c) $\begin{cases}
      x\operatorname{sen}x\,e^{-y}\,dx - y\,dy = 0\\
      y(0)=0
      \end{cases}$

      (d) $\left(e^{2y}-y\cos xy\right)dx + \left(2xe^{2y}-x\cos xy+2y\right)dy = 0$

      (e) $\left(y^{2}e^{xy^{2}}+4x^{3}\right)dx + \left(2xye^{xy^{2}}-3y^{2}\right)dy = 0$

      (f) $\begin{cases}
      \left(\cos x\operatorname{sen}x-xy^{2}\right)dx + y\left(1-x^{2}\right)dy = 0\\
      y(0)=2
      \end{cases}$

      (g) $\begin{cases}
      \left(4y+2x-5\right)dx - \left(1-4x-6y\right)dy = 0\\
      y(-1)=2
      \end{cases}$
    pide: La solución general de cada una, y la particular donde haya condición inicial.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es la primera pregunta que hay que hacerse ante
          $M\,dx + N\,dy = 0$?
        opciones:
          - texto: >-
              Si se puede separar; y si no, si es exacta, o sea si
              $\dfrac{\partial M}{\partial y}=\dfrac{\partial N}{\partial x}$
            correcta: true
            mensaje: |
              Ese es el orden. Separar es más barato, así que se intenta
              primero; el test de exactitud son dos derivadas y decide el
              resto. Los apartados (a), (b) y (c) se separan; (d), (e), (f) y
              (g) son exactas.
          - texto: >-
              Si es lineal
            mensaje: |
              La linealidad es la pregunta del ejercicio 2 del boletín. En
              forma diferencial $M\,dx+N\,dy=0$ lo natural es mirar primero si
              separa y luego si es exacta.
          - texto: >-
              Qué orden tiene
            mensaje: |
              Todas son de primer orden: solo aparecen $dx$ y $dy$. El orden se
              ve de un vistazo y aquí no distingue nada.

      - tipo: calcular
        titulo: La constante del apartado (g)
        pregunta: |
          El apartado (g) es exacta, con potencial
          $F(x,y)=4xy+x^{2}-5x+3y^{2}-y$. Con la condición $y(-1)=2$, ¿cuánto
          vale la constante $C$ tal que $F(x,y)=C$?
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '0'
            mensaje: |
              $0$ es lo que sale si no sustituyes la condición inicial. Sin
              ella la respuesta es una familia de curvas, no una.
          - valor: '-8'
            mensaje: |
              Revisa los signos al sustituir $x=-1$: el término $-5x$ se vuelve
              $+5$, y $4xy$ se vuelve $-8$. La suma es $+8$.
        pista: |
          $F(-1,2) = 4(-1)(2) + (-1)^{2} - 5(-1) + 3(2)^{2} - 2$.
        desarrollo: |
          $$
          F(-1,2) = -8 + 1 + 5 + 12 - 2 = 8
          $$

          La solución particular es entonces

          $$
          4xy+x^{2}-5x+3y^{2}-y-8 = 0
          $$

          que es lo que publica el boletín.

      - tipo: calcular
        titulo: Y qué vale esa solución en x = 1
        pregunta: |
          Siguiendo la misma curva, ¿cuánto vale $y$ cuando $x=1$?
        respuesta:
          tipo: numero
          valor: '1.5616'
          tolerancia: 0.005
          formato: en forma exacta ((-1+sqrt(17))/2) o con cuatro decimales
        distractores:
          - valor: '-2.5616'
            mensaje: |
              Esa es la **otra** raíz de la cuadrática, y pertenece a la otra
              rama de la hipérbola. La rama que pasa por $(-1,2)$ es la de
              arriba: en $x=0$ vale $1{,}81$ y en $x=1$, $1{,}56$. Baja de
              forma continua, sin saltar.
          - valor: '2'
            mensaje: |
              $2$ es el valor en $x=-1$, el de la condición inicial. La
              solución no es constante.
        pista: |
          Sustituye $x=1$ en $4xy+x^{2}-5x+3y^{2}-y-8=0$ y resuelve la
          cuadrática en $y$.
        desarrollo: |
          $$
          4y + 1 - 5 + 3y^{2} - y - 8 = 0
          \;\Longrightarrow\;
          3y^{2}+3y-12 = 0
          \;\Longrightarrow\;
          y^{2}+y-4=0
          $$

          $$
          y = \frac{-1+\sqrt{17}}{2} \approx 1{,}5616
          $$

          Se toma la raíz positiva porque es la que continúa la rama que pasa
          por $(-1,2)$: en $x=0$ esa rama vale $1{,}8081$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Ante $M\,dx+N\,dy=0$ se intenta separar primero, y si no se
              puede, se comprueba
              $\tfrac{\partial M}{\partial y}=\tfrac{\partial N}{\partial x}$.
          - texto: >-
              En (a), (b) y (c) las variables se separan multiplicando o
              dividiendo por lo que haga falta; en (b) el truco es
              $e^{x^{3}-y^{2}}=e^{x^{3}}e^{-y^{2}}$.
          - texto: >-
              En (d), (e), (f) y (g) el test de exactitud sale bien, así que
              existe un potencial $F$ con $F_x=M$ y $F_y=N$, y la solución es
              $F=C$.
          - texto: >-
              Y si el test de exactitud falla, la ecuación no tiene solución.
            trampa: true
            mensaje: |
              Sigue teniendo solución: lo que falla es el método. Multiplicando
              por un **factor integrante** adecuado, una ecuación no exacta se
              vuelve exacta — y eso es exactamente lo que hace el apartado (d)
              del ejercicio 2 de este mismo boletín, con $f(x)=x^{-6}$.
        veredicto: |
          Separar y ser exacta no son dos mundos: **una ecuación separable es
          un caso particular de exacta**, con $M$ dependiendo solo de $x$ y $N$
          solo de $y$. Verlo así reduce siete ejercicios a un método con dos
          atajos.
    resolucion: |
      **Los siete resultados.**

      | apartado | método | solución |
      |---|---|---|
      | (a) | separable | $y = kxe^{y+1/x}$ |
      | (b) | separable | $2e^{x^{3}}+3e^{y^{2}} = k$ |
      | (c) | separable con dato | $1+x\cos x-\operatorname{sen}x = e^{y}(1-y)$ |
      | (d) | exacta | $xe^{2y}-\operatorname{sen}xy+y^{2}+k = 0$ |
      | (e) | exacta | $e^{xy^{2}}+x^{4}-y^{3} = k$ |
      | (f) | exacta con dato | $y^{2}(1-x^{2})-\cos^{2}x = 3$ |
      | (g) | exacta con dato | $4xy+x^{2}-5x+3y^{2}-y-8 = 0$ |

      ### 1 · Las separables

      **(a)** Reordenando,
      $\dfrac{1-x}{x^{2}}dx = -\dfrac{1-y}{y}dy$:

      $$
      -\frac1x-\ln|x| = -\ln|y|+y+C
      \;\Longrightarrow\;
      \ln\frac{y}{x} = y+\frac1x+C
      \;\Longrightarrow\;
      y = kxe^{y+1/x}
      $$

      **(b)** El paso que lo abre es
      $e^{x^{3}-y^{2}}=e^{x^{3}}e^{-y^{2}}$. Multiplicando por
      $x^{2}e^{y^{2}}$:

      $$
      x^{2}e^{x^{3}}dx + ye^{y^{2}}dy = 0
      \;\Longrightarrow\;
      \frac{e^{x^{3}}}{3}+\frac{e^{y^{2}}}{2} = C
      \;\Longrightarrow\;
      2e^{x^{3}}+3e^{y^{2}} = k
      $$

      **(c)** $x\operatorname{sen}x\,dx = ye^{y}dy$, con
      $\int x\operatorname{sen}x\,dx = \operatorname{sen}x - x\cos x$ y
      $\int ye^{y}dy = e^{y}(y-1)$. La condición $y(0)=0$ da $C=1$.

      ### 2 · Las exactas

      El procedimiento es siempre el mismo:

      1. Comprobar $M_y = N_x$.
      2. Integrar $M$ respecto de $x$, dejando una función $g(y)$ suelta.
      3. Derivar respecto de $y$, igualar a $N$ y despejar $g'$.
      4. La solución es $F(x,y)=C$.

      Por ejemplo en **(f)**: $M_y = -2xy = N_x$, y

      $$
      F = \frac{\operatorname{sen}^{2}x}{2}-\frac{x^{2}y^{2}}{2}+\frac{y^{2}}{2}
      $$

      Con $y(0)=2$: $F(0,2)=2$, y multiplicando por $2$ queda
      $\operatorname{sen}^{2}x + y^{2}(1-x^{2}) = 4$, o sea
      $y^{2}(1-x^{2})-\cos^{2}x = 3$.

      ### 3 · La comprobación que siempre se puede hacer

      Una solución implícita $F(x,y)=C$ se verifica **derivando
      implícitamente**: tiene que devolver la ecuación de partida. En (g):

      $$
      d\left(4xy+x^{2}-5x+3y^{2}-y\right)
      = (4y+2x-5)dx + (4x+6y-1)dy = 0
      $$

      que es la ecuación del enunciado con el signo repartido. Cuadra.

      **Lo que hay que llevarse.** Ante una EDO en forma diferencial, dos
      preguntas en este orden: ¿separa? y ¿es exacta? Contestarlas cuesta
      treinta segundos y decide el método. Y una solución implícita **siempre**
      se puede comprobar derivándola: es la verificación más barata del tema.

  - id: siete-edos-de-primer-orden-por-cuatro-metodos
    titulo: Siete de primer orden, y cuatro métodos que hay que distinguir
    fuente: >-
      Ejercicio 2 · Boletín «Ecuaciones diferenciales. Problemas» · Cálculo,
      UPV/EHU · Departamento de Matemática Aplicada. El boletín publica los
      siete resultados y el desarrollo está contrastado contra ellos.
    nivel: practica
    enunciado: |
      Resolver las siguientes EDOs:

      (a) $(2x+y)\,dy = (x-2y)\,dx$

      (b) $x\,dy - y\,dx = \sqrt{x^{2}+y^{2}}\,dx$

      (c) $2x\,dy = \left(2x^{3}-y\right)dx$

      (d) $x^{-1}y^{3}\left(3y\,dx-2x\,dy\right)=0$ (utilizando el factor
      integrante $f(x)=x^{-6}$)

      (e) $x\,dy = \left(x\operatorname{sen}x - y\right)dx$

      (f) $\cos x\,\dfrac{dy}{dx} + y\operatorname{sen}x = 1$

      (g) $y' + y\cos x = e^{-\operatorname{sen}x}$
    pide: La solución general de cada una.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los apartados (c), (e), (f) y (g) tienen algo en común. ¿Qué?
        opciones:
          - texto: >-
              Son **lineales**: se pueden escribir como
              $y'+p(x)y=q(x)$, y se resuelven con el factor integrante
              $e^{\int p}$
            correcta: true
            mensaje: |
              Eso es. En (c) hay que dividir entre $2x$, en (e) entre $x$ y en
              (f) entre $\cos x$; en (g) ya está escrita así. El resto —(a) y
              (b)— son homogéneas, y (d) trae su factor integrante regalado.
          - texto: >-
              Son separables
            mensaje: |
              Ninguna de las cuatro separa: en todas aparece $y$ multiplicada
              por una función de $x$ **y** un término suelto de $x$. Eso es
              justo la forma lineal.
          - texto: >-
              Son exactas tal como están
            mensaje: |
              Una ecuación lineal se vuelve exacta **después** de multiplicar
              por su factor integrante; antes, en general, no lo es.

      - tipo: calcular
        titulo: El factor integrante del apartado (c)
        pregunta: |
          Escrita en forma lineal, (c) es
          $y' + \tfrac{1}{2x}y = x^{2}$. El factor integrante es una potencia
          de $x$: ¿qué exponente?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: en forma exacta (1/2) o con un decimal
        distractores:
          - valor: '-0.5'
            mensaje: |
              El signo. $\int\tfrac{dx}{2x}=\tfrac12\ln x$, y
              $e^{\frac12\ln x}=x^{1/2}$. El $x^{-1/2}$ aparece después, en la
              solución: es el $k/\sqrt{x}$.
          - valor: '2'
            mensaje: |
              $x^{2}$ es el segundo miembro, no el factor integrante. El
              factor sale de $p(x)=\tfrac{1}{2x}$, no de $q$.
        pista: |
          $\mu = e^{\int p(x)dx}$ con $p(x)=\tfrac{1}{2x}$.
        desarrollo: |
          $$
          \mu = e^{\int \frac{dx}{2x}} = e^{\frac12\ln x} = x^{1/2}
          $$

          Y entonces $\left(\sqrt{x}\,y\right)' = x^{5/2}$, de donde

          $$
          \sqrt{x}\,y = \frac{2}{7}x^{7/2}+k
          \;\Longrightarrow\;
          y = \frac{2x^{3}}{7}+\frac{k}{\sqrt{x}}
          $$

      - tipo: calcular
        titulo: Un punto concreto de la curva del apartado (b)
        pregunta: |
          La solución de (b) es $kx^{2} = y+\sqrt{x^{2}+y^{2}}$. Para la curva
          que pasa por $(1,0)$, ¿cuánto vale $y$ en $x=2$?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.01
          formato: en forma exacta (3/2) o con un decimal
        distractores:
          - valor: '0'
            mensaje: |
              $y=0$ solo cumple la ecuación si $kx^{2}=x$, o sea para $x=1$.
              La curva no es horizontal.
          - valor: '2'
            mensaje: |
              Revisa el despeje: de $4 = y+\sqrt{4+y^{2}}$ sale
              $\sqrt{4+y^{2}}=4-y$, y al elevar al cuadrado los $y^{2}$ se
              cancelan y queda $8y=12$.
        pista: |
          Con $(1,0)$ sale $k=1$. Después, $4 = y+\sqrt{4+y^{2}}$: aísla la
          raíz antes de elevar al cuadrado.
        desarrollo: |
          En $(1,0)$: $k\cdot1 = 0 + 1$, así que $k=1$.

          $$
          4 = y+\sqrt{4+y^{2}}
          \;\Longrightarrow\;
          \sqrt{4+y^{2}} = 4-y
          $$

          $$
          4+y^{2} = 16-8y+y^{2}
          \;\Longrightarrow\;
          8y = 12
          \;\Longrightarrow\;
          y = \frac32
          $$

          Y hay que comprobar que $4-y\ge0$, que se cumple: $4-1{,}5>0$. Al
          elevar al cuadrado se pueden colar soluciones falsas.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              (a) y (b) son **homogéneas**: todos los términos tienen el mismo
              grado si se cuenta $x$ e $y$ por igual, y el cambio $y=vx$ las
              separa.
          - texto: >-
              (c), (e), (f) y (g) son **lineales**, y se resuelven con el
              factor integrante $e^{\int p(x)dx}$.
          - texto: >-
              (d) trae el factor integrante en el enunciado, y con él la
              ecuación se vuelve exacta.
          - texto: >-
              Y como (a) es homogénea, el único camino es el cambio $y=vx$.
            trampa: true
            mensaje: |
              (a) además es **exacta**: $M=x-2y$ y $N=-(2x+y)$ cumplen
              $M_y=N_x=-2$, así que sale directamente el potencial
              $\tfrac{x^{2}}{2}-2xy-\tfrac{y^{2}}{2}$ en dos líneas, sin
              cambiar de variable. Una misma EDO puede caer en varias familias,
              y conviene mirar todas antes de elegir el camino largo.
        veredicto: |
          El orden que menos trabajo da: separable, exacta, lineal, homogénea.
          Las dos primeras son inmediatas cuando se dan; las dos últimas
          requieren montar algo. Y ojo, porque una ecuación puede ser de varias
          a la vez.
    resolucion: |
      **Los siete resultados.**

      | apartado | familia | solución |
      |---|---|---|
      | (a) | exacta (y homogénea) | $x^{2}-4xy-y^{2}=k$ |
      | (b) | homogénea | $kx^{2} = y+\sqrt{x^{2}+y^{2}}$ |
      | (c) | lineal | $y = \tfrac{2x^{3}}{7}+\tfrac{k}{\sqrt{x}}$ |
      | (d) | factor integrante dado | $x^{3}=ky^{2}$ |
      | (e) | lineal | $y = -\cos x+\tfrac{\operatorname{sen}x}{x}+\tfrac{k}{x}$ |
      | (f) | lineal | $y = \operatorname{sen}x + k\cos x$ |
      | (g) | lineal | $y = e^{-\operatorname{sen}x}(x+k)$ |

      ### 1 · Las lineales, que son cuatro de las siete

      El molde es siempre el mismo:

      $$
      y'+p(x)y = q(x),
      \qquad
      \mu = e^{\int p},
      \qquad
      \left(\mu y\right)' = \mu q
      $$

      | apartado | $p(x)$ | $\mu$ | $(\mu y)'$ |
      |---|---|---|---|
      | (c) | $\tfrac{1}{2x}$ | $\sqrt{x}$ | $x^{5/2}$ |
      | (e) | $\tfrac1x$ | $x$ | $x\operatorname{sen}x$ |
      | (f) | $\tan x$ | $\tfrac{1}{\cos x}$ | $\tfrac{1}{\cos^{2}x}$ |
      | (g) | $\cos x$ | $e^{\operatorname{sen}x}$ | $1$ |

      El caso (g) es el más limpio de todos: el segundo miembro está elegido
      para que $\mu q = 1$, y la integral es $x$.

      ### 2 · Las homogéneas

      **(b)** Con $y=vx$:

      $$
      x^{2}dv = x\sqrt{1+v^{2}}\,dx
      \;\Longrightarrow\;
      \frac{dv}{\sqrt{1+v^{2}}} = \frac{dx}{x}
      $$

      $$
      v+\sqrt{1+v^{2}} = kx
      \;\Longrightarrow\;
      y+\sqrt{x^{2}+y^{2}} = kx^{2}
      $$

      ### 3 · El factor integrante regalado

      **(d)** Multiplicando por $x^{-6}$:

      $$
      3x^{-7}y^{4}dx - 2x^{-6}y^{3}dy = 0
      $$

      Ahora $M_y = 12x^{-7}y^{3} = N_x$: exacta. El potencial es
      $-\tfrac{y^{4}}{2x^{6}}$, así que $y^{4}=kx^{6}$, o sea $x^{3}=ky^{2}$.

      **Lo que hay que llevarse.** Cuatro de las siete son lineales, y las
      lineales se resuelven **sin pensar** una vez identificadas: la única
      decisión es dividir bien para dejar el $y'$ solo. Reconocer la familia es
      todo el ejercicio; lo demás es un molde.

  - id: seis-caracteristicas-con-raices-reales
    titulo: Seis ecuaciones características con raíces reales
    fuente: >-
      Ejercicio 3 · Boletín «Ecuaciones diferenciales. Problemas» · Cálculo,
      UPV/EHU · Departamento de Matemática Aplicada. El boletín publica los
      seis resultados y el desarrollo está contrastado contra ellos.
    nivel: practica
    enunciado: |
      Resolver las siguientes EDOs lineales homogéneas de coeficientes
      constantes:

      (a) $y''-2y'-3y=0$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (b) $3y'''-y''-2y'=0$

      (c) $2y'''-5y''+2y'=0$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (d) $y''+2y'-8y=0$

      (e) $y^{IV}-4y''+3y=0$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (f) $y'''-by''=a^{2}y'-a^{2}by$ &nbsp; con $a,b\in\mathbb{R}$
    pide: La solución general de cada una.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué se prueba $y=e^{rx}$ en una lineal homogénea de coeficientes
          constantes?
        opciones:
          - texto: >-
              Porque al derivarla se reproduce multiplicada por $r$, y la
              ecuación se convierte en un polinomio en $r$
            correcta: true
            mensaje: |
              Eso es. $y^{(n)}=r^{n}e^{rx}$, así que $e^{rx}$ sale factor común
              y lo que queda es la **ecuación característica**. Resolver la EDO
              se vuelve resolver un polinomio.
          - texto: >-
              Porque toda solución de una EDO es exponencial
            mensaje: |
              No: con coeficientes variables las soluciones son cualquier cosa.
              El truco funciona **porque** los coeficientes son constantes.
          - texto: >-
              Porque las exponenciales son las únicas funciones derivables
              infinitas veces
            mensaje: |
              Los polinomios y los senos también lo son. La propiedad que
              importa es que la derivada de $e^{rx}$ es proporcional a sí
              misma.

      - tipo: calcular
        titulo: La raíz que no es entera, en el apartado (b)
        pregunta: |
          $3y'''-y''-2y'=0$ tiene tres raíces características: $0$, $1$ y una
          tercera. ¿Cuál?
        respuesta:
          tipo: numero
          valor: '-0.6667'
          tolerancia: 0.004
          formato: en forma exacta (-2/3) o con cuatro decimales
        distractores:
          - valor: '0.6667'
            mensaje: |
              El signo. $3r^{2}-r-2=0$ da $r=\tfrac{1\pm5}{6}$, o sea $1$ y
              $-\tfrac23$.
          - valor: '-1'
            mensaje: |
              $-1$ sale de resolver $r^{2}-r-2=0$: te has dejado el $3$ que
              multiplica a $y'''$. Ese coeficiente se queda en el polinomio.
        pista: |
          $3r^{3}-r^{2}-2r = r\left(3r^{2}-r-2\right)$.
        desarrollo: |
          $$
          3r^{3}-r^{2}-2r = r\left(3r^{2}-r-2\right) = 0
          $$

          $$
          r = 0, \qquad r = \frac{1\pm\sqrt{1+24}}{6} = \frac{1\pm5}{6}
          = 1,\; -\frac23
          $$

          $$
          y = k_1 + k_2e^{x} + k_3e^{-2x/3}
          $$

      - tipo: calcular
        titulo: La raíz mayor del apartado (e)
        pregunta: |
          $y^{IV}-4y''+3y=0$ tiene cuatro raíces. ¿Cuál es la mayor?
        respuesta:
          tipo: numero
          valor: '1.7321'
          tolerancia: 0.005
          formato: en forma exacta (sqrt(3)) o con cuatro decimales
        distractores:
          - valor: '3'
            mensaje: |
              $3$ es una raíz de $s^{2}-4s+3=0$ con $s=r^{2}$, no de la
              cuártica. Falta deshacer el cambio: $r^{2}=3$ da $r=\pm\sqrt3$.
          - valor: '1'
            mensaje: |
              $1$ **sí** es raíz, pero no la mayor: $\sqrt3\approx1{,}73$ es
              más grande. La cuártica es bicuadrada y tiene cuatro raíces.
        pista: |
          Es bicuadrada: con $s=r^{2}$, $s^{2}-4s+3=0$.
        desarrollo: |
          $$
          r^{4}-4r^{2}+3 = 0
          \;\xrightarrow{\;s=r^{2}\;}\;
          s^{2}-4s+3 = 0
          \;\Longrightarrow\;
          s = 1,\,3
          $$

          $$
          r = \pm1, \quad r = \pm\sqrt3
          $$

          $$
          y = k_1e^{x}+k_2e^{-x}+k_3e^{x\sqrt3}+k_4e^{-x\sqrt3}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Probando $y=e^{rx}$, la EDO se convierte en un polinomio en $r$
              del mismo grado que el orden de la ecuación.
          - texto: >-
              Cuando falta el término en $y$, el polinomio tiene raíz $r=0$, y
              esa raíz aporta una constante $k_1$ a la solución.
          - texto: >-
              En (f), reagrupando sale
              $\left(r-b\right)\left(r^{2}-a^{2}\right)=0$, de donde $r=b$ y
              $r=\pm a$.
          - texto: >-
              Y por eso la solución de (f) vale para cualesquiera $a$ y $b$,
              incluidos $a=0$ o $a=\pm b$.
            trampa: true
            mensaje: |
              Si $a=0$ o $a=\pm b$ hay **raíces repetidas**, y entonces
              $k_1e^{ax}+k_2e^{-ax}+k_3e^{bx}$ deja de ser la solución general:
              faltarían los términos con $x$ delante. La fórmula publicada
              supone las tres raíces distintas, que es el caso genérico —pero
              conviene decirlo.
        veredicto: |
          La ecuación característica traduce un problema de análisis a uno de
          álgebra. Todo lo que sabes de polinomios —Ruffini, bicuadradas,
          factorizar por agrupación— vale aquí tal cual.
    resolucion: |
      **Los seis resultados.**

      | apartado | ecuación característica | raíces | solución |
      |---|---|---|---|
      | (a) | $r^{2}-2r-3$ | $3,\,-1$ | $k_1e^{3x}+k_2e^{-x}$ |
      | (b) | $r(3r^{2}-r-2)$ | $0,\,1,\,-\tfrac23$ | $k_1+k_2e^{x}+k_3e^{-2x/3}$ |
      | (c) | $r(2r^{2}-5r+2)$ | $0,\,\tfrac12,\,2$ | $k_1+k_2e^{x/2}+k_3e^{2x}$ |
      | (d) | $r^{2}+2r-8$ | $2,\,-4$ | $k_1e^{2x}+k_2e^{-4x}$ |
      | (e) | $r^{4}-4r^{2}+3$ | $\pm1,\,\pm\sqrt3$ | $k_1e^{x}+k_2e^{-x}+k_3e^{x\sqrt3}+k_4e^{-x\sqrt3}$ |
      | (f) | $(r-b)(r^{2}-a^{2})$ | $b,\,\pm a$ | $k_1e^{ax}+k_2e^{-ax}+k_3e^{bx}$ |

      ### 1 · El método, que es siempre el mismo

      1. Sustituir $y=e^{rx}$ y sacar $e^{rx}$ factor común.
      2. Resolver el polinomio que queda.
      3. Una exponencial por cada raíz, con su constante.

      ### 2 · Los tres trucos que aparecen

      **Sacar factor común $r$** cuando falta el término en $y$: pasa en (b) y
      en (c), y baja el grado en uno.

      **Bicuadrada** en (e): con $s=r^{2}$ el grado cuatro se vuelve dos.

      **Agrupar** en (f). Pasando todo al primer miembro:

      $$
      r^{3}-br^{2}-a^{2}r+a^{2}b
      = r^{2}(r-b) - a^{2}(r-b)
      = (r-b)\left(r^{2}-a^{2}\right)
      $$

      ### 3 · La comprobación

      Una solución de una lineal homogénea se comprueba **sustituyéndola**, y
      con exponenciales eso es evaluar el polinomio característico. En (b), con
      $r=-\tfrac23$:

      $$
      3\left(-\tfrac23\right)^{3}-\left(-\tfrac23\right)^{2}
      -2\left(-\tfrac23\right)
      = -\frac{8}{9}-\frac49+\frac43 = 0 \;\checkmark
      $$

      **Lo que hay que llevarse.** Resolver una lineal homogénea de
      coeficientes constantes es resolver un polinomio, y ahí la nota se pierde
      en el álgebra, no en el análisis. Sacar factor común, reconocer una
      bicuadrada y agrupar son las tres cosas que hay que tener automatizadas.

  - id: tres-caracteristicas-con-raices-complejas
    titulo: Cuando las raíces son complejas, y qué se lee en cada parte
    fuente: >-
      Ejercicio 4 · Boletín «Ecuaciones diferenciales. Problemas» · Cálculo,
      UPV/EHU · Departamento de Matemática Aplicada. El boletín publica los
      tres resultados y el desarrollo está contrastado contra ellos.
    nivel: practica
    enunciado: |
      Resolver las siguientes EDOs lineales homogéneas de coeficientes
      constantes:

      (a) $y''-4y'+13y=0$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (b) $y'''+6y''+10y'=0$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (c) $y''+6y'+25y=0$
    pide: La solución general de cada una.
    pasos:
      - tipo: reconocer
        pregunta: |
          Si las raíces son $\alpha\pm\beta i$, ¿qué papel juega cada parte en
          la solución?
        opciones:
          - texto: >-
              La real $\alpha$ va en la exponencial $e^{\alpha x}$, que decide
              si crece o se amortigua; la imaginaria $\beta$ es la frecuencia
              del seno y el coseno
            correcta: true
            mensaje: |
              Eso es, y esa lectura es la que hace útil el resultado: en (a)
              $\alpha=2>0$ y la solución **crece** oscilando; en (c)
              $\alpha=-3<0$ y se amortigua.
          - texto: >-
              Al revés: la imaginaria en la exponencial
            mensaje: |
              La imaginaria en la exponencial daría $e^{i\beta x}$, que es
              precisamente lo que se convierte en seno y coseno por la fórmula
              de Euler. Lo que queda fuera, real, es $e^{\alpha x}$.
          - texto: >-
              Ninguno: se escriben las exponenciales complejas y ya está
            mensaje: |
              Se puede, y es correcto, pero la solución de una EDO con
              coeficientes reales se pide **real**. Euler convierte las dos
              exponenciales complejas en un seno y un coseno.

      - tipo: calcular
        titulo: La frecuencia del apartado (a)
        pregunta: |
          $y''-4y'+13y=0$. ¿Cuál es la parte imaginaria de sus raíces, es
          decir, la frecuencia de la oscilación?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '13'
            mensaje: |
              $13$ es el término independiente del polinomio. En una cuadrática
              mónica con raíces complejas ese número es el **cuadrado del
              módulo**, no la parte imaginaria.
          - valor: '6'
            mensaje: |
              $\sqrt{16-52}=6i$, y hay que dividir entre $2$: la fórmula es
              $\tfrac{-b\pm\sqrt{\Delta}}{2a}$.
        pista: |
          $\Delta = 16-52 = -36$, y $\sqrt{-36}=6i$.
        desarrollo: |
          $$
          r = \frac{4\pm\sqrt{16-52}}{2} = \frac{4\pm 6i}{2} = 2\pm3i
          $$

          $$
          y = e^{2x}\left(k_1\cos 3x + k_2\operatorname{sen}3x\right)
          $$

      - tipo: calcular
        titulo: El módulo, en el apartado (c)
        pregunta: |
          $y''+6y'+25y=0$ tiene raíces $-3\pm4i$. ¿Cuánto vale su módulo?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '25'
            mensaje: |
              $25$ es el módulo **al cuadrado**, y no es casualidad que sea el
              término independiente: en $r^{2}+br+c$ el producto de las raíces
              es $c$, y para un par conjugado ese producto es
              $\left|r\right|^{2}$.
          - valor: '4'
            mensaje: |
              $4$ es solo la parte imaginaria. El módulo junta las dos:
              $\sqrt{3^{2}+4^{2}}$.
        pista: |
          $\left|-3+4i\right| = \sqrt{9+16}$. Y compáralo con el término
          independiente de la ecuación.
        desarrollo: |
          $$
          \left|-3\pm4i\right| = \sqrt{9+16} = 5 = \sqrt{25}
          $$

          Y eso vale siempre: en $r^{2}+br+c=0$ con raíces conjugadas,

          $$
          r_1 r_2 = \left|r\right|^{2} = c
          $$

          Es una comprobación de un vistazo: si el módulo al cuadrado no
          coincide con el término independiente, las raíces están mal.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Con discriminante negativo, las raíces son un par conjugado
              $\alpha\pm\beta i$.
          - texto: >-
              Por Euler, $e^{(\alpha\pm\beta i)x}$ combinado da
              $e^{\alpha x}\left(k_1\cos\beta x+k_2\operatorname{sen}\beta
              x\right)$, que es real.
          - texto: >-
              En (b) hay además la raíz $r=0$, que aporta la constante $k_1$
              suelta.
          - texto: >-
              Y como en (a) la parte real es positiva, la solución oscila con
              amplitud constante.
            trampa: true
            mensaje: |
              Con $\alpha=2>0$ la amplitud **crece** como $e^{2x}$: la solución
              oscila cada vez más fuerte. La amplitud constante es el caso
              $\alpha=0$, o sea raíces imaginarias puras. Y $\alpha<0$ —como en
              (b) y (c)— es amortiguamiento.
        veredicto: |
          Las tres situaciones físicas están en estos tres apartados: (a) es un
          sistema inestable, (b) y (c) están amortiguados. La parte real del par
          conjugado lo dice sin resolver nada.
    resolucion: |
      **Los tres resultados.**

      | apartado | raíces | solución | comportamiento |
      |---|---|---|---|
      | (a) | $2\pm3i$ | $e^{2x}\left(k_1\cos3x+k_2\operatorname{sen}3x\right)$ | oscila creciendo |
      | (b) | $0,\,-3\pm i$ | $k_1+e^{-3x}\left(k_2\cos x+k_3\operatorname{sen}x\right)$ | tiende a $k_1$ |
      | (c) | $-3\pm4i$ | $e^{-3x}\left(k_1\cos4x+k_2\operatorname{sen}4x\right)$ | oscila amortiguándose |

      ### 1 · Cómo se leen las raíces

      $$
      r = \alpha\pm\beta i
      \;\Longrightarrow\;
      y = e^{\alpha x}\left(k_1\cos\beta x+k_2\operatorname{sen}\beta x\right)
      $$

      | parte | qué controla |
      |---|---|
      | $\alpha$ | crecimiento ($\alpha>0$) o amortiguamiento ($\alpha<0$) |
      | $\beta$ | la frecuencia de la oscilación |

      ### 2 · El caso (b), que además tiene un cero

      $$
      r^{3}+6r^{2}+10r = r\left(r^{2}+6r+10\right) = 0
      \;\Longrightarrow\;
      r = 0,\; -3\pm i
      $$

      La raíz $r=0$ aporta la constante. Como las otras dos tienen parte real
      negativa, **la solución tiende a $k_1$ cuando $x\to\infty$**: la
      oscilación se apaga y queda el valor de equilibrio.

      ### 3 · La comprobación de un vistazo

      En $r^{2}+br+c=0$ con raíces conjugadas, $c=\left|r\right|^{2}$ y
      $-b = 2\alpha$:

      | apartado | $c$ | $\left|r\right|^{2}$ | $-b$ | $2\alpha$ |
      |---|---|---|---|---|
      | (a) | $13$ | $4+9=13$ ✓ | $4$ | $4$ ✓ |
      | (c) | $25$ | $9+16=25$ ✓ | $-6$ | $-6$ ✓ |

      **Lo que hay que llevarse.** Las raíces complejas no son un caso raro:
      son **el** caso de todo lo que vibra. Y traen dos comprobaciones
      gratis — suma y producto de raíces contra los coeficientes — que cazan
      cualquier error aritmético en el discriminante.

  - id: seis-caracteristicas-con-raices-multiples
    titulo: Raíces repetidas, y por qué aparece la x delante
    fuente: >-
      Ejercicio 5 · Boletín «Ecuaciones diferenciales. Problemas» · Cálculo,
      UPV/EHU · Departamento de Matemática Aplicada. El boletín publica los
      seis resultados y el desarrollo está contrastado contra ellos.
    nivel: practica
    enunciado: |
      Resolver las siguientes EDOs lineales homogéneas de coeficientes
      constantes:

      (a) $y'''+2y''=0$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (b) $y^{iv}-2y'''+y''=0$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (c) $y^{v}-3y^{iv}+2y'''=0$

      (d) $y'''-2y''+y'=0$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (e) $y^{vi}+8y^{iv}+16y''=0$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (f) $y^{iv}+2y'''-3y''-4y'+4y=0$
    pide: La solución general de cada una.
    pasos:
      - tipo: reconocer
        pregunta: |
          Si $r_0$ es raíz **doble**, ¿por qué la solución lleva $e^{r_0x}$ y
          $xe^{r_0x}$ y no dos veces $e^{r_0x}$?
        opciones:
          - texto: >-
              Porque $e^{r_0x}$ y $e^{r_0x}$ son la misma función: harían falta
              dos soluciones **independientes**, y la segunda es
              $xe^{r_0x}$
            correcta: true
            mensaje: |
              Eso es. Una EDO de orden $n$ necesita $n$ soluciones
              independientes, y con una raíz repetida la exponencial sola no
              basta. La $x$ delante es lo que las separa.
          - texto: >-
              Por convenio
            mensaje: |
              No es convenio: se comprueba sustituyendo. Si $r_0$ es raíz doble
              del polinomio característico, $xe^{r_0x}$ también resuelve la
              ecuación.
          - texto: >-
              Porque la derivada de $e^{r_0x}$ es $xe^{r_0x}$
            mensaje: |
              La derivada de $e^{r_0x}$ es $r_0e^{r_0x}$. La $x$ no sale de
              derivar: sale de necesitar una segunda solución independiente.

      - tipo: calcular
        titulo: La multiplicidad del cero en el apartado (c)
        pregunta: |
          En $y^{v}-3y^{iv}+2y'''=0$, ¿con qué multiplicidad aparece la raíz
          $r=0$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              La derivada más baja que aparece es $y'''$, así que el polinomio
              factoriza como $r^{3}\left(r^{2}-3r+2\right)$: el cero es triple,
              no simple.
          - valor: '5'
            mensaje: |
              $5$ es el **orden** de la ecuación, o sea el grado del polinomio.
              La multiplicidad del cero la marca la derivada más baja que
              aparece.
        pista: |
          La derivada de orden más bajo que aparece es $y'''$: eso saca
          $r^{3}$ factor común.
        desarrollo: |
          $$
          r^{5}-3r^{4}+2r^{3} = r^{3}\left(r^{2}-3r+2\right)
          = r^{3}(r-1)(r-2)
          $$

          Raíces: $0$ (triple), $1$ y $2$.

          $$
          y = k_1+k_2x+k_3x^{2}+k_4e^{x}+k_5e^{2x}
          $$

          El cero triple aporta $1$, $x$ y $x^{2}$ — que es lo mismo que
          $e^{0x}$, $xe^{0x}$ y $x^{2}e^{0x}$.

      - tipo: calcular
        titulo: La multiplicidad de 2i en el apartado (e)
        pregunta: |
          En $y^{vi}+8y^{iv}+16y''=0$, ¿con qué multiplicidad aparece la raíz
          $r=2i$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '1'
            mensaje: |
              El polinomio es
              $r^{2}\left(r^{4}+8r^{2}+16\right)=r^{2}\left(r^{2}+4\right)^{2}$:
              el factor $r^{2}+4$ está **al cuadrado**, así que $\pm2i$ son
              dobles. Por eso la solución lleva $x\cos2x$ y
              $x\operatorname{sen}2x$.
          - valor: '4'
            mensaje: |
              $4$ es el número total de raíces imaginarias contadas con
              multiplicidad: $2i$ dos veces y $-2i$ dos veces. La multiplicidad
              de cada una es $2$.
        pista: |
          $r^{4}+8r^{2}+16$ es un cuadrado perfecto.
        desarrollo: |
          $$
          r^{6}+8r^{4}+16r^{2}
          = r^{2}\left(r^{4}+8r^{2}+16\right)
          = r^{2}\left(r^{2}+4\right)^{2}
          $$

          Raíces: $0$ doble, $2i$ doble y $-2i$ doble.

          $$
          y = k_1+k_2x
          + \left(k_3+k_4x\right)\cos2x
          + \left(k_5+k_6x\right)\operatorname{sen}2x
          $$

          Seis constantes para una ecuación de orden seis. **Contarlas es la
          comprobación más rápida que hay.**

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Una raíz de multiplicidad $m$ aporta $m$ soluciones
              independientes: $e^{rx}$, $xe^{rx}$, …, $x^{m-1}e^{rx}$.
          - texto: >-
              Cuando la derivada más baja que aparece es $y^{(k)}$, el
              polinomio saca $r^{k}$ factor común y el cero tiene multiplicidad
              $k$.
          - texto: >-
              El número total de constantes tiene que coincidir con el orden de
              la ecuación, y eso comprueba que no falta ninguna raíz.
          - texto: >-
              Y en (f), como $r=1$ y $r=-2$ son raíces, la solución es
              $k_1e^{x}+k_2e^{-2x}$.
            trampa: true
            mensaje: |
              Faltan dos constantes: la ecuación es de orden **cuatro** y ahí
              solo hay dos. El polinomio es
              $\left(r-1\right)^{2}\left(r+2\right)^{2}$, con las dos raíces
              **dobles**, así que la solución lleva también $xe^{x}$ y
              $xe^{-2x}$. Contar constantes lo caza en un segundo.
        veredicto: |
          Dos controles que no fallan: el número de constantes tiene que ser el
          orden de la ecuación, y la multiplicidad del cero es el orden de la
          derivada más baja que aparece.
    resolucion: |
      **Los seis resultados.**

      | apartado | polinomio factorizado | solución |
      |---|---|---|
      | (a) | $r^{2}(r+2)$ | $k_1+k_2x+k_3e^{-2x}$ |
      | (b) | $r^{2}(r-1)^{2}$ | $k_1+k_2x+k_3e^{x}+k_4xe^{x}$ |
      | (c) | $r^{3}(r-1)(r-2)$ | $k_1+k_2x+k_3x^{2}+k_4e^{x}+k_5e^{2x}$ |
      | (d) | $r(r-1)^{2}$ | $k_1+k_2e^{x}+k_3xe^{x}$ |
      | (e) | $r^{2}\left(r^{2}+4\right)^{2}$ | $k_1+k_2x+(k_3+k_4x)\cos2x+(k_5+k_6x)\operatorname{sen}2x$ |
      | (f) | $(r-1)^{2}(r+2)^{2}$ | $k_1e^{x}+k_2xe^{x}+k_3e^{-2x}+k_4xe^{-2x}$ |

      ### 1 · La regla

      Una raíz $r$ de multiplicidad $m$ aporta

      $$
      e^{rx},\quad xe^{rx},\quad \dots,\quad x^{m-1}e^{rx}
      $$

      Y si la raíz es compleja, $\alpha\pm\beta i$ con multiplicidad $m$, lo
      mismo con senos y cosenos:
      $x^{j}e^{\alpha x}\cos\beta x$ y $x^{j}e^{\alpha x}\operatorname{sen}\beta x$
      para $j=0,\dots,m-1$.

      ### 2 · Dónde está la dificultad de verdad

      No está en la regla: está en **factorizar**. Los tres casos que aparecen
      aquí son los tres de siempre:

      - **Sacar $r^{k}$ factor común** cuando la derivada más baja es
        $y^{(k)}$: (a), (b), (c), (d) y (e).
      - **Reconocer un cuadrado perfecto**: en (e),
        $r^{4}+8r^{2}+16=\left(r^{2}+4\right)^{2}$.
      - **Ruffini**: en (f), $r=1$ anula el polinomio, y al dividir queda
        $r^{3}+3r^{2}-4$, que vuelve a anularse en $r=1$.

      ### 3 · El control de las constantes

      | apartado | orden | constantes |
      |---|---|---|
      | (a) | 3 | 3 ✓ |
      | (b) | 4 | 4 ✓ |
      | (c) | 5 | 5 ✓ |
      | (d) | 3 | 3 ✓ |
      | (e) | 6 | 6 ✓ |
      | (f) | 4 | 4 ✓ |

      **Lo que hay que llevarse.** El fallo típico con raíces múltiples no es
      olvidar la regla: es **no darse cuenta de que la raíz está repetida**.
      Contar las constantes al terminar y compararlas con el orden lo caza
      siempre, y cuesta cinco segundos.

  - id: siete-particulares-por-coeficientes-indeterminados
    titulo: Siete no homogéneas, y la resonancia que obliga a poner una x
    fuente: >-
      Ejercicio 6, apartados (a) a (g) · Boletín «Ecuaciones diferenciales.
      Problemas» · Cálculo, UPV/EHU. Los apartados (e), (f) y (g) son los
      mismos que el 9.13 de los problemas complementarios. Tres avisos sobre
      el impreso, todos comprobados por sustitución: los enunciados de (a),
      (f) y (g) llevan erratas evidentes en el orden de las derivadas —y aquí
      se escriben corregidos, porque las soluciones publicadas obligan a esa
      lectura—, y la solución publicada de (d) es la mitad de la que cuadra.
      Ver el apartado final de la resolución.
    nivel: practica
    enunciado: |
      Resolver las siguientes EDOs lineales no homogéneas de coeficientes
      constantes:

      (a) $y''-7y'+10y = 6x+8e^{2x}$

      (b) $y''+9y = 12\cos 3x + x^{3}-3x^{2}-1$

      (c) $y''+6y'+8y = e^{-2x}-\operatorname{sen}x$

      (d) $y'''-2y'' = 9\operatorname{sen}3x+3x+6$

      (e) $y'''-2y'' = 2x-\cos x$

      (f) $y^{IV}+3y''-4y = \operatorname{sen}2x+6e^{3x}$

      (g) $y'''+9y' = x-5+7\operatorname{sen}3x$
    pide: La solución general de cada una.
    pasos:
      - tipo: reconocer
        pregunta: |
          En (a) el segundo miembro trae $8e^{2x}$ y las raíces
          características son $2$ y $5$. ¿Qué forma hay que probar para la
          particular de ese término?
        opciones:
          - texto: >-
              $Cxe^{2x}$, porque $2$ **es** raíz característica y $Ce^{2x}$
              daría cero
            correcta: true
            mensaje: |
              Eso es: hay resonancia. Probar $Ce^{2x}$ es probar una solución
              de la homogénea, y el primer miembro se anula. La $x$ delante lo
              arregla.
          - texto: >-
              $Ce^{2x}$, que es lo que hay en el segundo miembro
            mensaje: |
              Sustituyendo $Ce^{2x}$ sale $0$, porque $2$ es raíz de
              $r^{2}-7r+10$. Nunca podría dar $8e^{2x}$.
          - texto: >-
              $Cx^{2}e^{2x}$
            mensaje: |
              El $x^{2}$ haría falta si la raíz fuese **doble**. Aquí $2$ es
              raíz simple, así que basta con una $x$.

      - tipo: calcular
        titulo: El coeficiente resonante del apartado (a)
        pregunta: |
          Con $y_p = Cxe^{2x}$, ¿cuánto vale $C$ para que
          $y''-7y'+10y$ dé $8e^{2x}$?
        respuesta:
          tipo: numero
          valor: '-2.6667'
          tolerancia: 0.01
          formato: en forma exacta (-8/3) o con cuatro decimales
        distractores:
          - valor: '2.6667'
            mensaje: |
              El signo. Sustituyendo $xe^{2x}$ sale $-3e^{2x}$, con menos, así
              que $C$ tiene que ser negativo para dar $+8e^{2x}$.
          - valor: '8'
            mensaje: |
              $8$ es el coeficiente del segundo miembro. Falta dividirlo entre
              lo que da la sustitución, que es $-3$.
        pista: |
          Con $y=xe^{2x}$: $y'=e^{2x}(1+2x)$ e $y''=e^{2x}(4+4x)$. Sustituye y
          mira qué queda.
        desarrollo: |
          $$
          y''-7y'+10y
          = e^{2x}\left[\left(4+4x\right)-7\left(1+2x\right)+10x\right]
          = e^{2x}\left[-3+0\cdot x\right]
          $$

          El término en $x$ se cancela solo — señal de que la forma elegida es
          la correcta. Entonces

          $$
          C\cdot(-3) = 8 \;\Longrightarrow\; C = -\frac83
          $$

      - tipo: calcular
        titulo: El coeficiente resonante del apartado (f)
        pregunta: |
          En $y^{IV}+3y''-4y=\operatorname{sen}2x+6e^{3x}$, las raíces son
          $\pm1$ y $\pm2i$. La particular del $\operatorname{sen}2x$ es
          $Cx\cos 2x$. ¿Cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '0.05'
          tolerancia: 0.0006
          formato: en forma exacta (1/20) o con dos decimales
        distractores:
          - valor: '0.0192'
            mensaje: |
              $\tfrac{1}{52}$ pertenece al **otro** término: la particular de
              $6e^{3x}$ es $\tfrac{3}{52}e^{3x}$, porque
              $3^{4}+3\cdot3^{2}-4=104$.
          - valor: '-0.05'
            mensaje: |
              El signo. Sustituyendo $x\cos2x$ sale $+20\operatorname{sen}2x$,
              así que $C=+\tfrac{1}{20}$.
        pista: |
          Con $y=x\cos2x$, el cálculo da
          $y^{IV}+3y''-4y = 20\operatorname{sen}2x$. Todos los términos con
          $x$ delante se cancelan.
        desarrollo: |
          $$
          y = x\cos2x
          \;\Longrightarrow\;
          y^{IV}+3y''-4y = 20\operatorname{sen}2x
          $$

          Los términos $16x\cos2x$, $-12x\cos2x$ y $-4x\cos2x$ suman cero, que
          es la comprobación de que la forma con una sola $x$ era la buena.

          $$
          C = \frac{1}{20} = 0{,}05
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La solución general es la homogénea más **una** particular, y la
              particular se busca con la misma forma que el segundo miembro.
          - texto: >-
              Si esa forma ya está en la homogénea hay resonancia, y se
              multiplica por $x$ tantas veces como la multiplicidad de la raíz.
          - texto: >-
              Cuando el segundo miembro es una suma, se busca una particular
              para cada sumando y se suman: es el principio de superposición.
          - texto: >-
              Y si el segundo miembro tiene un polinomio de grado $n$, la
              particular es un polinomio del mismo grado $n$.
            trampa: true
            mensaje: |
              Solo si no hay resonancia con $r=0$. En (d) y en (g) falta el
              término en $y$, así que $r=0$ **es** raíz y la particular
              polinómica sube de grado: en (d) el segundo miembro es de grado
              $1$ y la particular es de grado $3$, porque $r=0$ es raíz doble.
        veredicto: |
          Todo el método cabe en dos decisiones: **qué forma** copia al segundo
          miembro y **cuántas $x$** hay que ponerle delante. La segunda la
          decide la multiplicidad de la raíz que provoca la resonancia — y el
          caso que más se olvida es el de la raíz $r=0$ con un polinomio.
    resolucion: |
      **Los siete resultados.**

      | apartado | solución |
      |---|---|
      | (a) | $k_1e^{2x}+k_2e^{5x}+\tfrac{21}{50}+\tfrac35x-\tfrac83xe^{2x}$ |
      | (b) | $k_1\cos3x+k_2\operatorname{sen}3x+\tfrac{x^{3}}{9}-\tfrac{x^{2}}{3}-\tfrac{2}{27}x-\tfrac{1}{27}+2x\operatorname{sen}3x$ |
      | (c) | $k_1e^{-4x}+k_2e^{-2x}+\tfrac{x}{2}e^{-2x}+\tfrac{6}{85}\cos x-\tfrac{7}{85}\operatorname{sen}x$ |
      | (d) | $k_1+k_2x+k_3e^{2x}+\tfrac{3}{13}\cos3x+\tfrac{2}{13}\operatorname{sen}3x-\tfrac{x^{3}}{4}-\tfrac{15}{8}x^{2}$ |
      | (e) | $k_1+k_2x+k_3e^{2x}-\tfrac{x^{3}}{6}-\tfrac{x^{2}}{4}-\tfrac25\cos x+\tfrac15\operatorname{sen}x$ |
      | (f) | $k_1e^{x}+k_2e^{-x}+k_3\cos2x+k_4\operatorname{sen}2x+\tfrac{3}{52}e^{3x}+\tfrac{1}{20}x\cos2x$ |
      | (g) | $k_1+k_2\cos3x+k_3\operatorname{sen}3x+\tfrac{x^{2}}{18}-\tfrac59x-\tfrac{7}{18}x\operatorname{sen}3x$ |

      ### 1 · El método en tres decisiones

      1. **La homogénea**, con su ecuación característica.
      2. **La forma de la particular**, copiando el segundo miembro:
         polinomio → polinomio del mismo grado; $e^{ax}$ → $Ce^{ax}$;
         $\operatorname{sen}\omega x$ o $\cos\omega x$ → una combinación de los
         dos.
      3. **Las $x$ de la resonancia**: si la forma elegida ya resuelve la
         homogénea, se multiplica por $x^{m}$ con $m$ la multiplicidad de esa
         raíz.

      ### 2 · Dónde hay resonancia en cada apartado

      | apartado | término resonante | raíz culpable | qué se multiplica |
      |---|---|---|---|
      | (a) | $8e^{2x}$ | $r=2$, simple | $x$ |
      | (b) | $12\cos3x$ | $r=\pm3i$, simple | $x$ |
      | (c) | $e^{-2x}$ | $r=-2$, simple | $x$ |
      | (d) | el polinomio | $r=0$, doble | $x^{2}$ |
      | (e) | el polinomio | $r=0$, doble | $x^{2}$ |
      | (f) | $\operatorname{sen}2x$ | $r=\pm2i$, simple | $x$ |
      | (g) | polinomio y $7\operatorname{sen}3x$ | $r=0$ y $r=\pm3i$ | $x$ en los dos |

      **El caso que más se falla es la raíz $r=0$**: en (d), el segundo
      miembro $3x+6$ es de grado $1$, y como $r=0$ es raíz doble la particular
      es de grado $3$.

      ### 3 · Los avisos sobre el impreso

      **Tres erratas en los enunciados.** Están escritos
      $y'-7y'+10y$ en (a), $y^{IV}+3y-4y$ en (f) e $y'''+9y$ en (g). Las tres
      son imposibles tal cual —(a) se reduciría a $-6y'+10y$, y (f) a
      $y^{IV}-y$— y las tres se corrigen solas mirando la solución publicada:
      las homogéneas que aparecen exigen $y''-7y'+10y$, $y^{IV}+3y''-4y$ e
      $y'''+9y'$. Aquí se escriben corregidas. Y hay una confirmación
      independiente: **los apartados (e), (f) y (g) vuelven a salir como
      ejercicio 9.13 de los problemas complementarios**, allí bien escritos, y
      con las mismas soluciones. En particular, el 9.13(b) publica
      $\tfrac{1}{20}x\cos 2x$ —con el $2$ que aquí falta.

      **Y una solución que no cuadra.** El boletín publica para (d)

      $$
      \frac{3}{26}\cos 3x + \frac{1}{13}\operatorname{sen}3x
      $$

      Sustituyendo eso en $y'''-2y''$ sale $\tfrac92\operatorname{sen}3x$, la
      mitad de los $9\operatorname{sen}3x$ que pide el enunciado. Con

      $$
      \frac{3}{13}\cos 3x + \frac{2}{13}\operatorname{sen}3x
      $$

      sale exacto. Comprobado por sustitución analítica y por derivación
      numérica en tres puntos. La parte polinómica del impreso,
      $-\tfrac{x^{3}}{4}-\tfrac{15}{8}x^{2}$, sí cuadra.

      **Lo que hay que llevarse.** La particular se comprueba **sustituyéndola
      en la ecuación**, y esa comprobación cuesta un minuto y caza cualquier
      coeficiente mal despejado. Es la misma comprobación que ha detectado la
      errata de arriba.

  - id: cinco-por-variacion-de-parametros
    titulo: Cinco segundos miembros que no admiten coeficientes indeterminados
    fuente: >-
      Ejercicio 6, apartados (h) a (l) · Boletín «Ecuaciones diferenciales.
      Problemas» · Cálculo, UPV/EHU. Los apartados (j), (k) y (l) son los
      mismos que el 9.12 (b), (c) y (d) de los problemas complementarios. La
      solución publicada de (j) en el boletín básico lleva un sumando de más;
      ver el apartado final de la resolución.
    nivel: practica
    enunciado: |
      Resolver las siguientes EDOs lineales no homogéneas de coeficientes
      constantes:

      (h) $y''+2y'+y = \dfrac{e^{-x}}{\sqrt{1-x^{2}}}$

      (i) $y''+y = \dfrac{1}{\cos x}$

      (j) $y''+16y = \dfrac{1}{\cos^{3}4x}$

      (k) $y''-2y'+y = \dfrac{e^{x}}{x^{4}}$

      (l) $y''-2y'+y = \dfrac{e^{x}}{1+x^{2}}$
    pide: La solución general de cada una.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué en estos cinco no sirve el método de coeficientes
          indeterminados?
        opciones:
          - texto: >-
              Porque el segundo miembro no es una combinación de polinomios,
              exponenciales, senos y cosenos: derivarlo produce funciones
              nuevas sin parar
            correcta: true
            mensaje: |
              Eso es. Coeficientes indeterminados funciona porque esas familias
              se **cierran** al derivar. $\tfrac{1}{\cos x}$ o
              $\tfrac{1}{x^{4}}$ no: cada derivada trae algo distinto, y no hay
              plantilla finita que probar.
          - texto: >-
              Porque las ecuaciones tienen raíces repetidas
            mensaje: |
              La (h), la (k) y la (l) sí las tienen, pero la (i) y la (j)
              no — y tampoco admiten coeficientes indeterminados. Lo que
              decide es el segundo miembro.
          - texto: >-
              Porque son de segundo orden
            mensaje: |
              El orden no tiene nada que ver: el ejercicio anterior tiene
              apartados de segundo, tercero y cuarto orden resueltos con
              coeficientes indeterminados.

      - tipo: calcular
        titulo: El coeficiente del apartado (k)
        pregunta: |
          Para $y''-2y'+y=\tfrac{e^{x}}{x^{4}}$, la particular es
          $C\,\tfrac{e^{x}}{x^{2}}$. ¿Cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '0.1667'
          tolerancia: 0.001
          formato: en forma exacta (1/6) o con cuatro decimales
        distractores:
          - valor: '0.5'
            mensaje: |
              $\tfrac12$ es solo el primer sumando de la variación de
              parámetros. Hay dos, y el segundo resta $\tfrac13$.
          - valor: '0.3333'
            mensaje: |
              $\tfrac13$ es solo el segundo sumando, y además con el signo
              cambiado. El resultado es $\tfrac12-\tfrac13$.
        pista: |
          Con $y_1=e^{x}$, $y_2=xe^{x}$ el wronskiano es $e^{2x}$, y las dos
          integrales que salen son $\int x^{-3}dx$ y $\int x^{-4}dx$.
        desarrollo: |
          $$
          y_p = -y_1\int\frac{y_2 f}{W}dx + y_2\int\frac{y_1 f}{W}dx
          $$

          Con $y_1=e^{x}$, $y_2=xe^{x}$, $W=e^{2x}$ y $f=\tfrac{e^{x}}{x^{4}}$:

          $$
          y_p = -e^{x}\int x^{-3}dx + xe^{x}\int x^{-4}dx
          = \frac{e^{x}}{2x^{2}} - \frac{e^{x}}{3x^{2}}
          = \frac{e^{x}}{6x^{2}}
          $$

          $C = \tfrac16 \approx 0{,}1667$.

      - tipo: calcular
        titulo: El coeficiente del apartado (j)
        pregunta: |
          Para $y''+16y=\tfrac{1}{\cos^{3}4x}$, la particular se puede escribir
          como $\tfrac{C}{\cos 4x}$. ¿Cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '0.03125'
          tolerancia: 0.0002
          formato: en forma exacta (1/32) o con cinco decimales
        distractores:
          - valor: '0.125'
            mensaje: |
              $\tfrac18$ sale de olvidar el wronskiano, que aquí vale $4$ y no
              $1$: las soluciones homogéneas son $\cos4x$ y
              $\operatorname{sen}4x$, y su wronskiano lleva el $4$ de la
              frecuencia.
          - valor: '0.0625'
            mensaje: |
              $\tfrac{1}{16}$ es el coeficiente del segundo sumando antes de
              simplificar. Al escribir
              $\tfrac{\operatorname{sen}^{2}4x}{\cos4x}
              = \tfrac{1}{\cos4x}-\cos4x$ y absorber el $\cos4x$ en la
              homogénea, los dos sumandos se juntan en $\tfrac{1}{32}$.
        pista: |
          Salen $-\tfrac{1}{32\cos4x}$ y
          $\tfrac{\operatorname{sen}^{2}4x}{16\cos4x}$, y el segundo se
          simplifica escribiendo $\operatorname{sen}^{2}=1-\cos^{2}$.
        desarrollo: |
          Con $y_1=\cos4x$, $y_2=\operatorname{sen}4x$ y $W=4$:

          $$
          y_p = -\frac{1}{32\cos4x}
          + \frac{\operatorname{sen}^{2}4x}{16\cos4x}
          $$

          Y ahora la simplificación que hay que ver:

          $$
          \frac{\operatorname{sen}^{2}4x}{16\cos4x}
          = \frac{1-\cos^{2}4x}{16\cos4x}
          = \frac{1}{16\cos4x}-\frac{\cos4x}{16}
          $$

          El último término es un múltiplo de $\cos4x$, o sea **solución de la
          homogénea**, y se absorbe en $k_1$. Queda

          $$
          y_p = \left(-\frac{1}{32}+\frac{1}{16}\right)\frac{1}{\cos4x}
          = \frac{1}{32\cos4x}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La variación de parámetros no supone nada sobre el segundo
              miembro: vale siempre, a cambio de dos integrales que pueden ser
              feas.
          - texto: >-
              La fórmula es
              $y_p = -y_1\int\tfrac{y_2 f}{W} + y_2\int\tfrac{y_1 f}{W}$, con
              $W$ el wronskiano de las dos soluciones homogéneas.
          - texto: >-
              Cualquier múltiplo de $y_1$ o de $y_2$ que aparezca en $y_p$ se
              puede absorber en las constantes de la homogénea.
          - texto: >-
              Y por eso las constantes de integración de esas dos integrales
              hay que arrastrarlas hasta el final.
            trampa: true
            mensaje: |
              No hace falta arrastrarlas, justamente por lo que dice la pieza
              anterior: cada constante multiplicaría a $y_1$ o a $y_2$, o sea
              se absorbería en $k_1$ y $k_2$. Se toman las primitivas sin
              constante y se acabó.
        veredicto: |
          La variación de parámetros es el método universal, y su precio son
          dos integrales. La destreza que hay que entrenar no es la fórmula
          —está en el formulario— sino **simplificar el resultado tirando lo
          que sea homogéneo**, que es lo que convierte una expresión larga en
          una corta.
    resolucion: |
      **Los cinco resultados.**

      | apartado | homogénea | particular |
      |---|---|---|
      | (h) | $k_1e^{-x}+k_2xe^{-x}$ | $e^{-x}\left(x\arcsin x+\sqrt{1-x^{2}}\right)$ |
      | (i) | $k_1\cos x+k_2\operatorname{sen}x$ | $\cos x\ln\lvert\cos x\rvert + x\operatorname{sen}x$ |
      | (j) | $k_1\cos4x+k_2\operatorname{sen}4x$ | $\dfrac{1}{32\cos4x}$ |
      | (k) | $k_1e^{x}+k_2xe^{x}$ | $\dfrac{e^{x}}{6x^{2}}$ |
      | (l) | $k_1e^{x}+k_2xe^{x}$ | $e^{x}\left(x \arctan x - \tfrac12\ln\left(1+x^{2}\right)\right)$ |

      ### 1 · Cuándo toca este método

      Coeficientes indeterminados solo sirve si el segundo miembro pertenece a
      una familia que **se cierra al derivar**: polinomios, exponenciales,
      senos y cosenos, y sus productos. Aquí ninguno lo hace:
      $\tfrac{1}{\sqrt{1-x^{2}}}$, $\tfrac{1}{\cos x}$, $\tfrac{1}{x^{4}}$ y
      $\tfrac{1}{1+x^{2}}$ generan funciones nuevas cada vez que se derivan.

      ### 2 · El atajo del apartado (h)

      Cuando la homogénea es $\left(D-r\right)^{2}y=0$ y el segundo miembro
      lleva $e^{rx}$ de factor, el cambio $y=e^{rx}u$ deja la ecuación en
      $u''=g(x)$: dos integraciones directas y nada más. En (h),
      $r=-1$ y $u''=\tfrac{1}{\sqrt{1-x^{2}}}$:

      $$
      u' = \arcsin x, \qquad u = x\arcsin x+\sqrt{1-x^{2}}
      $$

      Lo mismo sirve en (k) y en (l), que también tienen raíz doble.

      ### 3 · El aviso sobre el impreso

      El boletín publica para (j)

      $$
      \frac{1}{32}\frac{1}{\cos4x} + \frac14\frac{\operatorname{sen}^{2}x}{\cos4x}
      $$

      El segundo sumando sobra. La variación de parámetros da
      $-\tfrac{1}{32\cos4x}+\tfrac{\operatorname{sen}^{2}4x}{16\cos4x}$, y al
      simplificar $\operatorname{sen}^{2}4x = 1-\cos^{2}4x$ y absorber el
      $\cos4x$ resultante en la homogénea, queda **solo**
      $\tfrac{1}{32\cos4x}$ — que es el primer sumando del impreso. Sustituido
      en la ecuación, $\tfrac{1}{32\cos4x}$ devuelve exactamente
      $\tfrac{1}{\cos^{3}4x}$:

      $$
      \left(\frac{\sec4x}{32}\right)'' + 16\cdot\frac{\sec4x}{32}
      = \frac12\sec4x\tan^{2}4x + \frac12\sec^{3}4x + \frac12\sec4x
      = \sec^{3}4x
      $$

      Con el sumando extra no cuadra. Se publica $\tfrac{1}{32\cos4x}$.

      **Y hay confirmación independiente.** El mismo problema aparece como
      **9.12(b)** en los problemas complementarios, y allí la solución
      publicada es

      $$
      -\frac{1}{32}\frac{1}{\cos4x} + \frac{1}{16}\operatorname{sen}4x\tan 4x
      $$

      que es exactamente lo que da la variación de parámetros **antes** de
      simplificar: $\tfrac{1}{16}\operatorname{sen}4x\tan4x
      = \tfrac{\operatorname{sen}^{2}4x}{16\cos4x}$. Los dos boletines dicen
      lo mismo; lo que falla es la simplificación del básico, que cambió el
      signo del primer sumando y el $\tfrac{1}{16}$ por un $\tfrac14$.

      **Lo que hay que llevarse.** Dos cosas. La primera, que **la variación de
      parámetros no acaba en la integral**: acaba después de tirar todo lo que
      sea homogéneo, y ese paso es el que separa una respuesta correcta de una
      correcta y presentable. La segunda, el atajo de la raíz doble: con
      $y=e^{rx}u$ el problema se vuelve $u''=g$, y eso evita las dos integrales
      de la fórmula general.

  - id: seis-exactas-y-su-potencial
    titulo: Seis ecuaciones exactas, y el potencial que hay que reconstruir
    fuente: >-
      Ejercicio 9.7 · Problemas complementarios, tema 9 · Cálculo, UPV/EHU. El
      apartado (f) es el mismo que el 1(e) del boletín básico, y es de la
      convocatoria 2020/2021 5E.
    nivel: practica
    enunciado: |
      Resolver las siguientes EDOs exactas:

      (a) $2xy\,dx + \left(x^{2}+3y^{2}\right)dy = 0$

      (b) $\left(6x^{2}-y+3\right)dx + \left(3y^{2}-x-2\right)dy = 0$

      (c) $e^{y}dx + \left(2y+xe^{y}\right)dy = 0$

      (d) $\left(2xy-\operatorname{sen}x\right)dx + \left(x^{2}-\cos y\right)dy = 0$

      (e) $\left(1+2x\sqrt{x^{2}-y^{2}}\right)dx - 2y\sqrt{x^{2}-y^{2}}\,dy = 0$

      (f) $y' = \dfrac{y^{2}e^{xy^{2}}+4x^{3}}{3y^{2}-2xye^{xy^{2}}}$
    pide: La solución general de cada una.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado (f) viene despejado como $y'=\dots$. ¿Qué hay que hacer
          antes de comprobar la exactitud?
        opciones:
          - texto: >-
              Pasarlo a la forma $M\,dx+N\,dy=0$, con cuidado del signo: el
              denominador cambia de signo al pasarlo al otro lado
            correcta: true
            mensaje: |
              Eso es. $y'=\tfrac{P}{Q}$ es $P\,dx - Q\,dy = 0$, y aquí eso
              deja $M=y^{2}e^{xy^{2}}+4x^{3}$ y
              $N=2xye^{xy^{2}}-3y^{2}$. Con el signo mal, el test de
              exactitud falla y parece que hace falta un factor integrante.
          - texto: >-
              Nada: el test se hace igual sobre el numerador y el denominador
            mensaje: |
              El test compara $M_y$ con $N_x$, y para eso hacen falta $M$ y
              $N$, que no son el numerador y el denominador tal cual: hay un
              signo por medio.
          - texto: >-
              Derivar los dos miembros
            mensaje: |
              La ecuación ya es de primer orden; derivarla la sube a segundo y
              complica lo que estaba resuelto.

      - tipo: calcular
        titulo: Un punto de la curva del apartado (b)
        pregunta: |
          El potencial de (b) es $F = 2x^{3}-xy+3x+y^{3}-2y$. Para la curva
          que pasa por $(1,1)$, ¿cuánto vale la constante?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '4'
            mensaje: |
              Te has dejado el término $-xy$, que es justo el que acopla las
              dos variables: sin él la ecuación sería separable y no haría
              falta hablar de exactitud.
          - valor: '9'
            mensaje: |
              $9$ es la suma de los valores absolutos. Los signos de $-xy$ y
              de $-2y$ restan.
        pista: |
          $F(1,1) = 2-1+3+1-2$.
        desarrollo: |
          $$
          F(1,1) = 2\cdot1 - 1\cdot1 + 3\cdot1 + 1 - 2\cdot1 = 3
          $$

          La curva es $2x^{3}-xy+3x+y^{3}-2y = 3$.

      - tipo: calcular
        titulo: Un punto de la curva del apartado (e)
        pregunta: |
          El potencial de (e) es
          $F = x+\tfrac23\left(x^{2}-y^{2}\right)^{3/2}$. ¿Cuánto vale en el
          punto $(2,1)$?
        respuesta:
          tipo: numero
          valor: '5.4641'
          tolerancia: 0.005
          formato: en forma exacta (2+2·3^(3/2)/3) o con cuatro decimales
        distractores:
          - valor: '3.4641'
            mensaje: |
              Ese es solo el segundo sumando,
              $\tfrac23\cdot3^{3/2}=2\sqrt3$. Falta el $x$ suelto, que viene
              del $1$ del enunciado.
          - valor: '2'
            mensaje: |
              Ese es solo el $x$. Falta la potencia $3/2$, que es donde está
              todo el trabajo del ejercicio.
        pista: |
          $x^{2}-y^{2} = 4-1 = 3$, y $3^{3/2} = 3\sqrt3$.
        desarrollo: |
          $$
          F(2,1) = 2 + \frac23\cdot 3^{3/2}
          = 2 + \frac23\cdot 3\sqrt3
          = 2+2\sqrt3 \approx 5{,}4641
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El test es $\tfrac{\partial M}{\partial y}
              = \tfrac{\partial N}{\partial x}$, y si sale bien existe un
              potencial $F$ con $F_x=M$ y $F_y=N$.
          - texto: >-
              Se integra $M$ respecto de $x$ dejando una función $g(y)$ suelta,
              se deriva respecto de $y$ y se iguala a $N$ para despejar $g'$.
          - texto: >-
              La solución es $F(x,y)=C$, y se comprueba derivando
              implícitamente: tiene que devolver la ecuación de partida.
          - texto: >-
              Y como $g$ es una función de $y$ sola, al derivar respecto de
              $y$ desaparece.
            trampa: true
            mensaje: |
              Al revés: es al derivar respecto de **$x$** cuando desaparece,
              y por eso se puede colar en $\int M\,dx$. Al derivar respecto de
              $y$ es cuando aparece su $g'(y)$, que es exactamente lo que
              permite despejarla. Confundir las dos derivadas es el error que
              deja el potencial incompleto.
        veredicto: |
          El método tiene cuatro pasos y ninguno es difícil. Lo que falla es
          casi siempre lo mismo: la constante de integración que en realidad es
          una **función** de la otra variable.
    resolucion: |
      **Los seis resultados.**

      | apartado | potencial $F$ |
      |---|---|
      | (a) | $x^{2}y+y^{3}$ |
      | (b) | $2x^{3}-xy+3x+y^{3}-2y$ |
      | (c) | $xe^{y}+y^{2}$ |
      | (d) | $x^{2}y+\cos x-\operatorname{sen}y$ |
      | (e) | $x+\tfrac23\left(x^{2}-y^{2}\right)^{3/2}$ |
      | (f) | $e^{xy^{2}}+x^{4}-y^{3}$ |

      En los seis, la solución es $F(x,y)=C$.

      ### 1 · El procedimiento, paso a paso en (d)

      $$
      M = 2xy-\operatorname{sen}x, \qquad N = x^{2}-\cos y
      $$

      $$
      M_y = 2x = N_x \;\checkmark
      $$

      $$
      F = \int M\,dx = x^{2}y + \cos x + g(y)
      $$

      $$
      F_y = x^{2}+g'(y) = N = x^{2}-\cos y
      \;\Longrightarrow\;
      g'(y) = -\cos y
      \;\Longrightarrow\;
      g = -\operatorname{sen}y
      $$

      ### 2 · El único que trae trampa

      **(f)** viene despejado como $y'=\tfrac{P}{Q}$. Pasarlo a forma
      diferencial da $P\,dx - Q\,dy = 0$, o sea

      $$
      \left(y^{2}e^{xy^{2}}+4x^{3}\right)dx
      + \left(2xye^{xy^{2}}-3y^{2}\right)dy = 0
      $$

      con el signo del denominador **cambiado**. Con el signo mal el test
      falla y uno se pone a buscar un factor integrante que no hace falta.

      ### 3 · La comprobación

      Derivar $F=C$ implícitamente devuelve la ecuación. En (e):

      $$
      dF = \left(1+2x\sqrt{x^{2}-y^{2}}\right)dx
      - 2y\sqrt{x^{2}-y^{2}}\,dy
      $$

      Idéntico al enunciado.

      **Lo que hay que llevarse.** La «constante» que aparece al integrar $M$
      respecto de $x$ **es una función de $y$**, y despejarla es la mitad del
      método. Y antes de nada, poner la ecuación en forma
      $M\,dx+N\,dy=0$ con los signos bien: un signo mal convierte una exacta en
      una que parece que no lo es.

  - id: seis-factores-integrantes
    titulo: Seis factores integrantes, dos de ellos con el exponente por hallar
    fuente: >-
      Ejercicio 9.8 · Problemas complementarios, tema 9 · Cálculo, UPV/EHU.
      Los apartados (a), (e) y (f) son de las convocatorias 2017/2018 7E,
      2015/2016 7E y 2012/2013 7E.
    nivel: practica
    enunciado: |
      Utilizando los factores integrantes $g(x,y)$, resolver las siguientes
      EDOs:

      (a) $3y\,dx + \left(x+4y\right)dy = 0$, &nbsp; $g(x,y)=(x+y)^{2}$

      (b) $\left(2y-6x\right)dx + \left(3x-\dfrac{4x^{2}}{y}\right)dy = 0$, &nbsp; $g(x,y)=xy^{2}$

      (c) $\left(xy^{2}-y^{3}\right)dx + \left(1-xy^{2}\right)dy = 0$,
      &nbsp; $g(x,y)=\dfrac{1}{y^{2}}$

      (d) $\left(2y^{2}+4x^{2}y\right)dx + \left(4xy+3x^{3}\right)dy = 0$,
      &nbsp; $g(x,y)=x^{p}y^{q}$

      (e) $\left(2xy+x^{2}y+\dfrac{y^{3}}{3}\right)dx + \left(x^{2}+y^{2}\right)dy = 0$, &nbsp; $g(x,y)=e^{x}$

      (f) $y\,dx + \left(x^{2}y^{2}-x\right)dy = 0$,
      &nbsp; $g(x,y)=x^{n}y^{m}$
    pide: La solución general de cada una, y los exponentes en (d) y (f).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace exactamente un factor integrante?
        opciones:
          - texto: >-
              Multiplicar la ecuación por algo que no cambia sus soluciones y
              que convierte una no exacta en exacta
            correcta: true
            mensaje: |
              Eso es. $M\,dx+N\,dy=0$ y $gM\,dx+gN\,dy=0$ tienen las mismas
              curvas solución mientras $g\ne0$; lo que cambia es que la segunda
              **sí** tiene potencial.
          - texto: >-
              Simplificar la ecuación
            mensaje: |
              A menudo la complica: en (a), multiplicar por $(x+y)^{2}$ da
              polinomios de grado tres donde había grado uno. Lo que gana es la
              exactitud, no la sencillez.
          - texto: >-
              Cambiar de variable
            mensaje: |
              No hay cambio de variable: las variables siguen siendo $x$ e $y$.
              Solo se multiplica la ecuación por una función.

      - tipo: calcular
        titulo: El exponente p del apartado (d)
        pregunta: |
          Para que $g=x^{p}y^{q}$ haga exacta la ecuación (d), ¿cuánto vale
          $p$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '0'
            mensaje: |
              Con $p=q=0$ no hay factor, y la ecuación no es exacta:
              $M_y = 4y+4x^{2}$ frente a $N_x = 4y+9x^{2}$.
          - valor: '2'
            mensaje: |
              Revisa el sistema. Igualando los coeficientes de
              $x^{p}y^{q+1}$ sale $2(q+2)=4(p+1)$, o sea $q=2p$; y con la otra
              igualdad, $4(q+1)=3(p+3)$, queda $p=1$.
        pista: |
          Multiplica, deriva y compara **término a término**: los de
          $x^{p}y^{q+1}$ entre sí y los de $x^{p+2}y^{q}$ entre sí. Salen dos
          ecuaciones con dos incógnitas.
        desarrollo: |
          $$
          gM = 2x^{p}y^{q+2}+4x^{p+2}y^{q+1},
          \qquad
          gN = 4x^{p+1}y^{q+1}+3x^{p+3}y^{q}
          $$

          $$
          \frac{\partial (gM)}{\partial y}
          = 2(q+2)x^{p}y^{q+1}+4(q+1)x^{p+2}y^{q}
          $$

          $$
          \frac{\partial (gN)}{\partial x}
          = 4(p+1)x^{p}y^{q+1}+3(p+3)x^{p+2}y^{q}
          $$

          Igualando coeficiente a coeficiente:

          $$
          2(q+2) = 4(p+1) \;\Rightarrow\; q = 2p,
          \qquad
          4(q+1) = 3(p+3)
          $$

          $$
          8p+4 = 3p+9 \;\Longrightarrow\; p = 1,\; q = 2
          $$

          Y con $g=xy^{2}$, el potencial es $x^{2}y^{4}+x^{4}y^{3}$.

      - tipo: calcular
        titulo: El exponente n del apartado (f)
        pregunta: |
          Para que $g=x^{n}y^{m}$ haga exacta la ecuación (f), ¿cuánto vale
          $n$?
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '2'
            mensaje: |
              El signo. El exponente tiene que ser **negativo** para que el
              término $x^{n+2}y^{m+2}$ desaparezca, y eso exige $n=-2$.
          - valor: '-1'
            mensaje: |
              Con $n=-1$ el término en $x^{n+1}y^{m+2}$ no se anula y sigue
              sobrando. Solo $n=-2$ lo mata.
        pista: |
          Al derivar $gN$ respecto de $x$ aparece un término en
          $x^{n+1}y^{m+2}$ que **no tiene pareja** al otro lado. La única forma
          de cuadrar es que su coeficiente $(n+2)$ sea cero.
        desarrollo: |
          $$
          gM = x^{n}y^{m+1},
          \qquad
          gN = x^{n+2}y^{m+2}-x^{n+1}y^{m}
          $$

          $$
          \frac{\partial(gM)}{\partial y} = (m+1)x^{n}y^{m}
          $$

          $$
          \frac{\partial(gN)}{\partial x}
          = (n+2)x^{n+1}y^{m+2} - (n+1)x^{n}y^{m}
          $$

          El primer sumando de la derecha no tiene con quién emparejarse, así
          que $n+2=0$. Y entonces $m+1 = -(n+1) = 1$, o sea $m=0$:

          $$
          g = \frac{1}{x^{2}},
          \qquad
          F = \frac{y^{3}}{3}-\frac{y}{x}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Multiplicar por $g$ no cambia las soluciones mientras $g\ne0$,
              pero sí puede volver exacta la ecuación.
          - texto: >-
              Cuando el enunciado da $g$, basta multiplicar, comprobar la
              exactitud y buscar el potencial como siempre.
          - texto: >-
              Cuando $g$ viene con exponentes por determinar, se impone
              $\left(gM\right)_y=\left(gN\right)_x$ y se resuelve el sistema
              que sale de igualar los coeficientes.
          - texto: >-
              Y como el factor integrante multiplica a los dos miembros, el
              potencial que sale es el mismo que sin él, multiplicado por $g$.
            trampa: true
            mensaje: |
              Sin factor **no hay potencial**: ese es todo el problema. La
              ecuación original no es exacta, así que no existe una $F$ con
              $F_x=M$ y $F_y=N$; la que se construye es la de la ecuación ya
              multiplicada, y no guarda esa relación con nada anterior.
        veredicto: |
          Cuando el factor viene dado, el ejercicio es un exacta con dos líneas
          de más. Cuando hay que hallarlo, la técnica es siempre la misma:
          imponer la exactitud y **comparar coeficiente a coeficiente**, que
          convierte una condición sobre funciones en un sistema de números.
    resolucion: |
      **Los seis resultados.**

      | apartado | $g$ | solución |
      |---|---|---|
      | (a) | $(x+y)^{2}$ | $y(x+y)^{3} = c$ |
      | (b) | $xy^{2}$ | $x^{2}y^{3}-2x^{3}y^{2} = C$ |
      | (c) | $1/y^{2}$ | $\tfrac{x^{2}}{2}-\tfrac{1}{y}-xy = C$ |
      | (d) | $xy^{2}$ ($p=1$, $q=2$) | $x^{2}y^{4}+x^{4}y^{3} = C$ |
      | (e) | $e^{x}$ | $\tfrac13 e^{x}y\left(3x^{2}+y^{2}\right) = C$ |
      | (f) | $1/x^{2}$ ($n=-2$, $m=0$) | $\tfrac{y^{3}}{3}-\tfrac{y}{x} = C$ |

      ### 1 · Los cuatro con el factor dado

      Se multiplica, se comprueba y se integra. En (a):

      $$
      gM = 3y(x+y)^{2}, \qquad gN = (x+4y)(x+y)^{2}
      $$

      $$
      F = y(x+y)^{3}
      $$

      $$
      F_x = 3y(x+y)^{2} \;\checkmark
      \qquad
      F_y = (x+y)^{2}\left[(x+y)+3y\right] = (x+4y)(x+y)^{2} \;\checkmark
      $$

      ### 2 · Los dos con exponentes por hallar

      El método es idéntico en los dos: se impone
      $\left(gM\right)_y = \left(gN\right)_x$ y se comparan los coeficientes de
      cada monomio.

      | apartado | sistema | solución |
      |---|---|---|
      | (d) | $2(q+2)=4(p+1)$ y $4(q+1)=3(p+3)$ | $p=1$, $q=2$ |
      | (f) | $n+2=0$ y $m+1=-(n+1)$ | $n=-2$, $m=0$ |

      El de (f) es más sutil: no salen dos ecuaciones de emparejar dos
      monomios, sino una de **anular** el monomio que sobra y otra de
      emparejar los que quedan.

      ### 3 · Por qué esto vale la pena

      Contado el 14 de septiembre de 2026 sobre los ejercicios de examen del
      sitio: **nueve piden una ecuación exacta y cinco un factor integrante**,
      y hasta ahora el tema 9 no tenía ni un ejercicio de ninguna de las dos.
      Este ejercicio y el 9.7 son los que cierran ese hueco.

      **Lo que hay que llevarse.** Un factor integrante no simplifica: **cambia
      la ecuación por otra equivalente que sí tiene potencial**. Y cuando hay
      que hallarlo, la técnica —imponer la exactitud y comparar monomio a
      monomio— es la misma que se usa en coeficientes indeterminados. Es la
      misma idea aplicada dos veces en el mismo tema.

  - id: ocho-separables-y-las-constantes-que-hay-que-fijar
    titulo: Ocho separables, y las cinco que traen condición inicial
    fuente: >-
      Ejercicio 9.5 · Problemas complementarios, tema 9 · Cálculo, UPV/EHU.
      Los apartados (g) y (h) son de las convocatorias 2016/2017 3E AT y
      2017/2018 3E AT.
    nivel: practica
    enunciado: |
      Resolver las siguientes EDOs de variables separables:

      (a) $y' = -xe^{y}$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (e) $e^{-y^{2}}\left(x^{2}+1\right)dy = \dfrac{dx}{2y}$, $y(1)=1$

      (b) $\left(1+e^{x}\right)y' = e^{x}$, $y(0)=0$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (f) $x(y+2)y' = 1+\ln x$, $y(1)=-1$

      (c) $(1+y)dx + \dfrac{dy}{x^{2}-2x} = 0$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (g) $y' = 4x^{3}y-4y$, $y(0)=1$

      (d) $y\,dy + x\left(y^{2}-4\right)dx = 0$, $y(0)=5$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (h) $y' = y-2y^{2}$
    pide: La solución de cada una, particular donde haya condición inicial.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado (h), $y'=y-2y^{2}$, separa. ¿Qué hace falta para
          integrar $\dfrac{dy}{y(1-2y)}$?
        opciones:
          - texto: >-
              Descomponer en fracciones simples:
              $\dfrac{1}{y(1-2y)}=\dfrac{1}{y}+\dfrac{2}{1-2y}$
            correcta: true
            mensaje: |
              Eso es. Es la misma técnica del tema de integración, y aquí
              aparece constantemente: casi toda EDO logística acaba en una
              descomposición en fracciones simples.
          - texto: >-
              Un cambio de variable trigonométrico
            mensaje: |
              El denominador es un producto de factores lineales, no una suma
              de cuadrados. Las fracciones simples lo resuelven directamente.
          - texto: >-
              No se puede integrar
            mensaje: |
              Sí se puede, y sale un logaritmo de cada factor. Esta ecuación
              es la **logística**, y su solución es la curva en forma de S que
              modela poblaciones con recurso limitado.

      - tipo: calcular
        titulo: Un valor de la solución del apartado (d)
        pregunta: |
          La solución de (d) con $y(0)=5$ es
          $y=\sqrt{4+21e^{-x^{2}}}$. ¿Cuánto vale $y(1)$?
        respuesta:
          tipo: numero
          valor: '3.4242'
          tolerancia: 0.004
          formato: en forma exacta (sqrt(4+21/e)) o con cuatro decimales
        distractores:
          - valor: '5'
            mensaje: |
              $5$ es el valor inicial, en $x=0$. La solución decrece: el
              término $21e^{-x^{2}}$ se apaga.
          - valor: '2'
            mensaje: |
              $2$ es el **límite** cuando $x\to\infty$, cuando la exponencial
              ya vale cero. En $x=1$ todavía queda bastante.
        pista: |
          $e^{-1}\approx0{,}3679$, así que $4+21e^{-1}\approx11{,}73$.
        desarrollo: |
          $$
          y(1) = \sqrt{4+21e^{-1}} = \sqrt{4+7{,}7252}
          = \sqrt{11{,}7252} \approx 3{,}4242
          $$

          La solución baja de $5$ hacia $2$, que es la recta de equilibrio
          $y=2$ de la ecuación.

      - tipo: calcular
        titulo: Un valor de la solución del apartado (g)
        pregunta: |
          La solución de (g) con $y(0)=1$ es $y=e^{x^{4}-4x}$. ¿Cuánto vale
          $y(1)$?
        respuesta:
          tipo: numero
          valor: '0.049787'
          tolerancia: 0.0002
          formato: en forma exacta (e^(-3)) o con seis decimales
        distractores:
          - valor: '20.0855'
            mensaje: |
              $e^{3}$: el signo del exponente. En $x=1$,
              $x^{4}-4x = 1-4 = -3$.
          - valor: '1'
            mensaje: |
              $1$ es el valor inicial. La solución sí cambia: el exponente pasa
              de $0$ a $-3$.
        pista: |
          $x^{4}-4x$ en $x=1$ vale $1-4=-3$.
        desarrollo: |
          $$
          y(1) = e^{1-4} = e^{-3} \approx 0{,}049787
          $$

          El exponente $x^{4}-4x$ tiene su mínimo en $x=\sqrt[3]{1}=1$, así
          que ese $e^{-3}$ es además el valor **más pequeño** que toma la
          solución.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Separar es dejar cada variable con su diferencial:
              $f(y)\,dy = g(x)\,dx$, y después integrar los dos lados.
          - texto: >-
              La constante de integración se pone en **un solo** lado; poner
              una en cada uno es redundante, porque su diferencia es otra
              constante.
          - texto: >-
              Cuando hay condición inicial, se sustituye al final para fijar la
              constante — y conviene hacerlo antes de despejar $y$, que suele
              ser más limpio.
          - texto: >-
              Y al dividir entre $y$ o entre $1-2y$ no se pierde nada, porque
              esas son soluciones triviales.
            trampa: true
            mensaje: |
              Se pierden, y son soluciones de verdad: en (h), $y=0$ e
              $y=\tfrac12$ resuelven la ecuación y **no** se obtienen de la
              familia $y=\tfrac{Ce^{x}}{1+2Ce^{x}}$ para ningún $C$ finito. Se
              llaman soluciones singulares, y al separar hay que anotarlas
              aparte.
        veredicto: |
          Separar es el método más simple del tema y el que más soluciones
          pierde: cada vez que se divide entre algo, hay que preguntarse si ese
          algo puede ser cero.
    resolucion: |
      **Los ocho resultados.**

      | apartado | solución |
      |---|---|
      | (a) | $y = -\ln\left(\tfrac{x^{2}}{2}+C\right)$ |
      | (b) | $y = \ln\dfrac{e^{x}+1}{2}$ |
      | (c) | $y = Ce^{x^{2}-x^{3}/3}-1$ |
      | (d) | $y = \sqrt{4+21e^{-x^{2}}}$ |
      | (e) | $\tfrac{\pi}{4}+e^{-1}-e^{-y^{2}} = \arctan x$ |
      | (f) | $y^{2}+4y = \left(\ln x+1\right)^{2}-4$ |
      | (g) | $y = e^{x^{4}-4x}$ |
      | (h) | $y = \dfrac{Ce^{x}}{1+2Ce^{x}}$ |

      ### 1 · El molde

      $$
      f(y)\,dy = g(x)\,dx
      \;\Longrightarrow\;
      \int f(y)\,dy = \int g(x)\,dx + C
      $$

      Y después, si hay condición inicial, sustituir para fijar $C$.

      ### 2 · Los que no se despejan, y no pasa nada

      En (e) y en (f) la solución se deja **implícita**. Es correcto y a
      menudo obligado: en (e), despejar $y$ de
      $e^{-y^{2}} = \tfrac{\pi}{4}+e^{-1}-\arctan x$ daría una raíz de un
      logaritmo con signos que discutir. Una solución implícita es una
      solución.

      ### 3 · Los dos que enseñan algo más

      **(d)** es una relajación hacia el equilibrio: baja de $5$ hacia
      $y=2$, que es la solución constante de la ecuación.

      **(h)** es la **logística**. Su solución tiene forma de S, con dos
      equilibrios: $y=0$ inestable e $y=\tfrac12$ estable. Y esos dos son
      soluciones que **se pierden al separar**, porque para escribir
      $\tfrac{dy}{y(1-2y)}$ hay que dividir por ellos.

      **Lo que hay que llevarse.** Cada división al separar puede tirar una
      solución. Anotar los ceros del denominador antes de integrar cuesta una
      línea y es lo que distingue una respuesta completa de una casi completa.

  - id: seis-homogeneas-y-el-cambio-que-las-separa
    titulo: Seis homogéneas, y la que se resuelve mejor al revés
    fuente: >-
      Ejercicio 9.6 · Problemas complementarios, tema 9 · Cálculo, UPV/EHU. El
      apartado (f) es de la convocatoria 2019/2020 7E.
    nivel: practica
    enunciado: |
      Resolver las siguientes EDOs homogéneas:

      (a) $(2x+y)dx - x\,dy = 0$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (d) $y' = \dfrac{y}{x}-\dfrac{x}{y}$

      (b) $xy' = y\ln\dfrac{y}{x}$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (e) $\left(x^{3}+xy^{2}\right)y' = y^{3}$

      (c) $\left(xy+y^{2}\right)y' = y^{2}$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (f) $y' = \dfrac{2xy}{3x^{2}-y^{2}}$, $y(1)=2$
    pide: La solución de cada una, particular en (f).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se reconoce una EDO homogénea, y qué cambio la separa?
        opciones:
          - texto: >-
              Que $y'$ se pueda escribir como función de $y/x$ sola; y el
              cambio es $y=vx$, que la vuelve separable
            correcta: true
            mensaje: |
              Eso es. Y hay una comprobación rápida: si al sustituir $x$ por
              $tx$ e $y$ por $ty$ la expresión de $y'$ no cambia, es
              homogénea.
          - texto: >-
              Que el segundo miembro sea cero
            mensaje: |
              Eso es «homogénea» en el sentido de las **lineales**. Aquí la
              palabra significa otra cosa: que todos los términos tienen el
              mismo grado.
          - texto: >-
              Que los coeficientes sean constantes
            mensaje: |
              Los coeficientes constantes son el caso de las lineales de orden
              $n$. Estas tienen $x$ e $y$ por todas partes.

      - tipo: calcular
        titulo: La curva del apartado (a) que pasa por el origen
        pregunta: |
          La solución de (a) es $y = 2x\ln\lvert x\rvert + Cx$. Para la que
          pasa por $(1,0)$, ¿cuánto vale $y$ en $x=e$?
        respuesta:
          tipo: numero
          valor: '5.4366'
          tolerancia: 0.006
          formato: en forma exacta (2e) o con cuatro decimales
        distractores:
          - valor: '2.7183'
            mensaje: |
              Te has dejado el $2$. En $x=e$, $\ln x = 1$, así que
              $y = 2e\cdot1 = 2e$.
          - valor: '0'
            mensaje: |
              $0$ es el valor en $x=1$, donde el logaritmo se anula. La
              solución no es constante.
        pista: |
          $y(1)=0$ da $C=0$, y en $x=e$ el logaritmo vale $1$.
        desarrollo: |
          $$
          y(1) = 2\cdot1\cdot\ln 1 + C = C = 0
          $$

          $$
          y(e) = 2e\ln e = 2e \approx 5{,}4366
          $$

      - tipo: calcular
        titulo: La constante del apartado (f)
        pregunta: |
          Con el cambio $x=vy$ la solución de (f) queda
          $x^{2}-y^{2}=Cy^{3}$. Con $y(1)=2$, ¿cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '-0.375'
          tolerancia: 0.002
          formato: en forma exacta (-3/8) o con tres decimales
        distractores:
          - valor: '0.375'
            mensaje: |
              El signo. En $(1,2)$, $x^{2}-y^{2} = 1-4 = -3$, y $y^{3}=8$: el
              cociente es negativo.
          - valor: '-3'
            mensaje: |
              $-3$ es $x^{2}-y^{2}$, sin dividir entre $y^{3}=8$.
        pista: |
          $C = \dfrac{x^{2}-y^{2}}{y^{3}}$ en el punto $(1,2)$.
        desarrollo: |
          $$
          C = \frac{1-4}{8} = -\frac38 = -0{,}375
          $$

          Y por eso el boletín escribe la solución como
          $\left\lvert x^{2}-y^{2}\right\rvert = \tfrac38\left\lvert
          y^{3}\right\rvert$: en valor absoluto, para no arrastrar el signo.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El cambio $y=vx$ convierte una homogénea en separable, porque
              $y'=v+xv'$ y todo lo demás pasa a depender solo de $v$.
          - texto: >-
              En (c) y en (f) conviene el cambio al revés, $x=vy$: son las que
              se simplifican mirando $x$ como función de $y$.
          - texto: >-
              (a) y (c) además son **lineales** si se mira la variable
              adecuada: (a) en $y$ y (c) en $x$.
          - texto: >-
              Y como el cambio $y=vx$ siempre funciona, no hace falta
              plantearse cuál de las dos variables despejar.
            trampa: true
            mensaje: |
              Funciona, pero puede dar una integral mucho peor. En (c), con
              $y=vx$ sale una integral con logaritmos encadenados; mirándola
              como $x'(y)$ es una **lineal de primer orden** que se resuelve
              con factor integrante en tres líneas. Elegir la variable es
              parte del método.
        veredicto: |
          Antes de lanzarse con $y=vx$, dos preguntas: ¿es lineal en alguna de
          las dos variables? y ¿cuál de los dos cambios deja la integral más
          fácil? Contestarlas ahorra la mitad del trabajo en tres de estos
          seis apartados.
    resolucion: |
      **Los seis resultados.**

      | apartado | solución |
      |---|---|
      | (a) | $y = 2x\ln\lvert x\rvert + Cx$ |
      | (b) | $y = xe^{1+Cx}$ |
      | (c) | $x = y\ln\lvert y\rvert + Cy$ |
      | (d) | $y = \pm x\sqrt{C-2\ln\lvert x\rvert}$ |
      | (e) | $y = Ce^{-y^{2}/(2x^{2})}$ |
      | (f) | $\left\lvert x^{2}-y^{2}\right\rvert = \tfrac38\left\lvert y^{3}\right\rvert$ |

      ### 1 · El cambio, y por qué funciona

      Si $y' = F(y/x)$, con $y=vx$ sale $y'=v+xv'$ y

      $$
      v + xv' = F(v)
      \;\Longrightarrow\;
      \frac{dv}{F(v)-v} = \frac{dx}{x}
      $$

      Separable siempre.

      ### 2 · Los dos atajos

      **(a) es lineal en $y$.** Escrita $y'-\tfrac{y}{x}=2$, el factor
      integrante $\tfrac1x$ la resuelve en dos líneas:
      $\left(\tfrac{y}{x}\right)' = \tfrac2x$.

      **(c) es lineal en $x$.** Dividiendo entre $y^{2}$ y mirando $x$ como
      función de $y$:

      $$
      \frac{dx}{dy} - \frac{x}{y} = 1
      \;\Longrightarrow\;
      \left(\frac{x}{y}\right)' = \frac1y
      \;\Longrightarrow\;
      x = y\ln\lvert y\rvert + Cy
      $$

      Que es simétrico del anterior, con los papeles cambiados.

      ### 3 · La comprobación en (f)

      Con $y(1)=2$: $\lvert 1-4\rvert = 3$ y
      $\tfrac38\lvert 8\rvert = 3$. Cuadra.

      **Lo que hay que llevarse.** Homogénea significa **que solo depende del
      cociente $y/x$**, y eso es lo que hace que un solo cambio la separe
      siempre. Pero antes de aplicarlo, mirar si la ecuación es lineal en $x$
      o en $y$: en tres de estos seis, ese atajo ahorra la mitad del trabajo.

  - id: seis-lineales-de-primer-orden
    titulo: Seis lineales de primer orden, y las cuatro con dato inicial
    fuente: >-
      Ejercicio 9.9 · Problemas complementarios, tema 9 · Cálculo, UPV/EHU.
      Los apartados (c) a (f) son de las convocatorias 2018/2019 3E AT,
      2018/2019 4E AT, 2016/2017 7E y 2018/2019 5E.
    nivel: practica
    enunciado: |
      Resolver las siguientes EDOs lineales:

      (a) $y'-2y = x$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (d) $y' = y-e^{-x}$, $y(0)=\dfrac32$

      (b) $xy' = y+2x^{3}$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (e) $xy'+2y = \operatorname{sen}x$,
      $y\left(\dfrac{\pi}{2}\right)=4\left(\dfrac{2}{\pi}\right)^{2}$

      (c) $y' = x^{2}-y$, $y(0)=1$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (f) $xy'-y = x^{3}$, $y(1)=\dfrac32$
    pide: La solución de cada una, particular donde haya dato inicial.
    pasos:
      - tipo: reconocer
        pregunta: |
          En (b), (e) y (f) hay una $x$ multiplicando a $y'$. ¿Qué hay que
          hacer antes de calcular el factor integrante?
        opciones:
          - texto: >-
              Dividir entre esa $x$ para dejar $y'$ con coeficiente $1$: el
              factor integrante es $e^{\int p}$ con $p$ el coeficiente de $y$
              **después** de dividir
            correcta: true
            mensaje: |
              Eso es, y es el error más repetido del método: si no divides
              primero, $p$ sale mal y el factor integrante también.
          - texto: >-
              Nada: el factor integrante se calcula igual
            mensaje: |
              En (f), sin dividir, uno leería $p=-1$ y $\mu=e^{-x}$. Dividiendo
              entre $x$, $p=-\tfrac1x$ y $\mu=\tfrac1x$. Son cosas distintas.
          - texto: >-
              Multiplicar por $x$ otra vez
            mensaje: |
              Eso empeora el problema. La forma canónica es
              $y'+p(x)y=q(x)$, con el $y'$ solo.

      - tipo: calcular
        titulo: Un valor de la solución del apartado (c)
        pregunta: |
          La solución de (c) con $y(0)=1$ es
          $y = x^{2}-2x+2-e^{-x}$. ¿Cuánto vale $y(1)$?
        respuesta:
          tipo: numero
          valor: '0.6321'
          tolerancia: 0.0008
          formato: en forma exacta (1-1/e) o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $1$ es el valor inicial, en $x=0$. La parábola baja: su vértice
              está en $x=1$.
          - valor: '1.3679'
            mensaje: |
              Has sumado la exponencial en vez de restarla. La constante salió
              $-1$, no $+1$.
        pista: |
          $x^{2}-2x+2$ en $x=1$ vale $1$, y $e^{-1}\approx0{,}3679$.
        desarrollo: |
          $$
          y(1) = 1-2+2-e^{-1} = 1-e^{-1} \approx 0{,}6321
          $$

      - tipo: calcular
        titulo: La constante del apartado (e)
        pregunta: |
          Con el factor integrante $x^{2}$, la ecuación (e) queda
          $\left(x^{2}y\right)' = x\operatorname{sen}x$, de donde
          $x^{2}y = \operatorname{sen}x - x\cos x + C$. Con el dato
          $y\left(\tfrac{\pi}{2}\right)=4\left(\tfrac{2}{\pi}\right)^{2}$,
          ¿cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número entero
        distractores:
          - valor: '0'
            mensaje: |
              Con $C=0$ el valor en $\tfrac{\pi}{2}$ sería
              $\tfrac{4}{\pi^{2}}$, y el dato pide cuatro veces eso.
          - valor: '4'
            mensaje: |
              El dato es $\tfrac{16}{\pi^{2}}$, y
              $x^{2}y=\tfrac{\pi^{2}}{4}\cdot\tfrac{16}{\pi^{2}}=4$. De ahí
              hay que restar $\operatorname{sen}\tfrac{\pi}{2}=1$.
        pista: |
          En $x=\tfrac{\pi}{2}$: $\operatorname{sen}=1$, $\cos=0$, y
          $x^{2}y = \tfrac{\pi^{2}}{4}\cdot\tfrac{16}{\pi^{2}} = 4$.
        desarrollo: |
          $$
          4 = 1 - 0 + C \;\Longrightarrow\; C = 3
          $$

          $$
          y = \frac{3}{x^{2}} + \frac{\operatorname{sen}x}{x^{2}}
          - \frac{\cos x}{x}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Forma canónica $y'+p(x)y = q(x)$: lo primero es dejar $y'$ con
              coeficiente $1$.
          - texto: >-
              El factor integrante es $\mu=e^{\int p\,dx}$, y con él el primer
              miembro se vuelve la derivada de $\mu y$.
          - texto: >-
              Se integra $\mu q$ y se despeja $y$; la constante entra dividida
              por $\mu$, y por eso en (b) aparece un $Cx$ y en (e) un
              $\tfrac{C}{x^{2}}$.
          - texto: >-
              Y en $\mu=e^{\int p}$ hay que arrastrar la constante de esa
              integral, porque cambia el resultado.
            trampa: true
            mensaje: |
              No: esa constante daría $\mu\cdot e^{k}$, un factor constante que
              multiplica a los dos miembros y se cancela. Es la única constante
              de todo el método que **no** hay que arrastrar.
        veredicto: |
          El método es un molde de cuatro pasos y no falla nunca. Las dos
          cosas que se olvidan son dividir para dejar el $y'$ solo, y que la
          constante final va dividida por el factor integrante.
    resolucion: |
      **Los seis resultados.**

      | apartado | $p(x)$ | $\mu$ | solución |
      |---|---|---|---|
      | (a) | $-2$ | $e^{-2x}$ | $y = -\tfrac14(1+2x)+Ce^{2x}$ |
      | (b) | $-\tfrac1x$ | $\tfrac1x$ | $y = x^{3}+Cx$ |
      | (c) | $1$ | $e^{x}$ | $y = x^{2}-2x+2-e^{-x}$ |
      | (d) | $-1$ | $e^{-x}$ | $y = e^{x}+\tfrac{e^{-x}}{2}$ |
      | (e) | $\tfrac2x$ | $x^{2}$ | $y = \tfrac{3}{x^{2}}+\tfrac{\operatorname{sen}x}{x^{2}}-\tfrac{\cos x}{x}$ |
      | (f) | $-\tfrac1x$ | $\tfrac1x$ | $y = \tfrac{x^{3}}{2}+x$ |

      ### 1 · El molde

      $$
      y'+p(x)y = q(x)
      \;\Longrightarrow\;
      \mu = e^{\int p\,dx}
      \;\Longrightarrow\;
      \left(\mu y\right)' = \mu q
      \;\Longrightarrow\;
      y = \frac{1}{\mu}\left(\int \mu q\,dx + C\right)
      $$

      ### 2 · Las integrales que hay que saber hacer

      | apartado | $\int\mu q$ |
      |---|---|
      | (a) | $\int xe^{-2x}dx$, por partes |
      | (c) | $\int x^{2}e^{x}dx$, por partes dos veces |
      | (e) | $\int x\operatorname{sen}x\,dx$, por partes |

      Las tres son de integración por partes, que es lo que de verdad se
      practica aquí.

      ### 3 · La comprobación de siempre

      Sustituir la solución en la ecuación. En (f), con
      $y=\tfrac{x^{3}}{2}+x$:

      $$
      xy'-y = x\left(\frac{3x^{2}}{2}+1\right)
      - \left(\frac{x^{3}}{2}+x\right)
      = \frac{3x^{3}}{2}+x-\frac{x^{3}}{2}-x = x^{3} \;\checkmark
      $$

      Y el dato: $y(1)=\tfrac12+1=\tfrac32$ ✓

      **Lo que hay que llevarse.** El factor integrante se calcula con el
      $p(x)$ de la **forma canónica**, no con lo que se ve a primera vista. En
      tres de estos seis hay una $x$ multiplicando a $y'$, y dividir antes de
      nada es la diferencia entre resolver la ecuación y resolver otra.

  - id: sacarle-informacion-a-una-edo-sin-resolverla
    titulo: Tres EDOs de las que hay que hablar sin resolverlas
    fuente: >-
      Ejercicios 9.2, 9.3 y 9.4 · Problemas complementarios, tema 9 · Cálculo,
      UPV/EHU. El 9.2 es de la convocatoria 2018/2019 3E AT y el 9.3 de la
      2019/2020 4E AT.
    nivel: practica
    enunciado: |
      **9.2** Sea $y(x)$ la solución de la EDO $y' = x^{2}-y$.

      &nbsp;&nbsp;(a) Sin resolver la EDO, estudiar los intervalos de
      crecimiento/decrecimiento y concavidad/convexidad de la función $y$.

      &nbsp;&nbsp;(b) Calcular el polinomio de Taylor de orden 2 de la función
      $y(x)$ en el punto $a=0$, sabiendo que $y(0)=1$.

      **9.3** Sea $y(x)$ una función solución de la EDO $xy'-y = x^{3}$. Sin
      resolver la EDO, estudiar los intervalos de crecimiento y decrecimiento
      de $y$.

      **9.4** Aproximar la solución de la EDO $y'' = yx+x^{2}+1$ donde
      $y(0)=1$, $y'(0)=2$, mediante el polinomio de McLaurin de orden 3.
    pide: El estudio cualitativo y los dos polinomios.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se obtiene $y''$ sin conocer $y$, a partir de
          $y'=x^{2}-y$?
        opciones:
          - texto: >-
              Derivando la propia ecuación: $y'' = 2x-y'$, y sustituyendo
              $y'$ otra vez queda $y''=2x-x^{2}+y$
            correcta: true
            mensaje: |
              Eso es. La ecuación es una máquina de fabricar derivadas: cada
              vez que se deriva, se obtiene la siguiente en función de las
              anteriores. Es todo lo que hace falta para un Taylor.
          - texto: >-
              Hay que resolver la EDO primero
            mensaje: |
              El enunciado dice explícitamente que no. Y no hace falta:
              derivar la ecuación da $y''$ directamente.
          - texto: >-
              $y''$ es la derivada de $x^{2}$, o sea $2x$
            mensaje: |
              Falta derivar el $-y$, que da $-y'$. Ese término es justo el que
              acopla la ecuación consigo misma.

      - tipo: calcular
        titulo: El coeficiente de x² en el Taylor de 9.2
        pregunta: |
          Con $y(0)=1$, ¿cuánto vale el coeficiente de $x^{2}$ en el polinomio
          de Taylor de orden $2$ de $y$ en $a=0$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: en forma exacta (1/2) o con un decimal
        distractores:
          - valor: '1'
            mensaje: |
              $y''(0)=1$, sí, pero el coeficiente de Taylor es
              $\tfrac{y''(0)}{2!}$: hay que dividir entre $2$.
          - valor: '-1'
            mensaje: |
              $-1$ es $y'(0)$, el coeficiente de $x$. El de $x^{2}$ sale de la
              segunda derivada.
        pista: |
          $y'(0) = 0-1 = -1$, y $y''=2x-y'$, así que $y''(0)=0-(-1)=1$. El
          coeficiente es $\tfrac{y''(0)}{2}$.
        desarrollo: |
          $$
          y'(0) = 0^{2}-1 = -1
          $$

          $$
          y'' = 2x-y' \;\Longrightarrow\; y''(0) = 0-(-1) = 1
          $$

          $$
          P_2(x) = 1 - x + \frac{1}{2}x^{2}
          $$

      - tipo: calcular
        titulo: El coeficiente de x³ en el McLaurin de 9.4
        pregunta: |
          Para $y'' = yx+x^{2}+1$ con $y(0)=1$, $y'(0)=2$, ¿cuánto vale el
          coeficiente de $x^{3}$ en el polinomio de McLaurin de orden $3$?
        respuesta:
          tipo: numero
          valor: '0.1667'
          tolerancia: 0.001
          formato: en forma exacta (1/6) o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $y'''(0)=1$, pero el coeficiente lleva $3!=6$ en el
              denominador.
          - valor: '0.5'
            mensaje: |
              $\tfrac12$ es el coeficiente de $x^{2}$, que sale de
              $\tfrac{y''(0)}{2!}$ con $y''(0)=1$.
        pista: |
          $y''' = y'x+y+2x$, y en $x=0$ eso vale $y(0)=1$. El coeficiente es
          $\tfrac{y'''(0)}{3!}$.
        desarrollo: |
          $$
          y''(0) = 1\cdot0+0+1 = 1
          $$

          $$
          y''' = y'x + y + 2x \;\Longrightarrow\; y'''(0) = 0+1+0 = 1
          $$

          $$
          P_3(x) = 1 + 2x + \frac{x^{2}}{2} + \frac{x^{3}}{6}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La EDO da $y'$ en función de $x$ e $y$, así que el signo de $y'$
              se lee comparando $y$ con la curva $y=x^{2}$ en el caso 9.2.
          - texto: >-
              Derivando la EDO se obtiene $y''$ sin resolver nada, y con eso se
              estudia la concavidad y se construye el Taylor.
          - texto: >-
              En 9.3, despejando, $y'=\tfrac{y+x^{3}}{x}$, y el signo depende
              de dónde esté $y$ respecto de $-x^{3}$ y del signo de $x$.
          - texto: >-
              Y como el polinomio de Taylor aproxima la solución, sirve igual
              de bien lejos del punto donde se ha calculado.
            trampa: true
            mensaje: |
              Un Taylor de orden bajo solo aproxima **cerca** del punto. El
              $P_2$ de 9.2 vale para $x$ pequeños; en $x=3$ daría
              $1-3+4{,}5=2{,}5$, y no hay ninguna garantía de que la solución
              esté ahí. Los polinomios de McLaurin son aproximaciones locales,
              y decirlo es parte de la respuesta.
        veredicto: |
          Una EDO es una fórmula para $y'$, y derivándola se obtiene $y''$,
          $y'''$ y todas las que hagan falta. Con eso se puede estudiar la
          gráfica y aproximar la solución **sin resolverla**, que es
          exactamente lo que piden estos tres enunciados.
    resolucion: |
      ### 1 · 9.2 · $y'=x^{2}-y$

      **El estudio cualitativo.** La ecuación dice que $y'>0$ exactamente
      donde $y<x^{2}$: la parábola $y=x^{2}$ separa la región donde la
      solución crece de la región donde decrece. Derivando,

      $$
      y'' = 2x-y' = 2x-x^{2}+y
      $$

      así que la solución es convexa donde $y > x^{2}-2x$.

      **El Taylor.** Con $y(0)=1$: $y'(0)=-1$, $y''(0)=1$,

      $$
      P_2(x) = 1-x+\frac{x^{2}}{2}
      $$

      ### 2 · 9.3 · $xy'-y=x^{3}$

      $$
      y' = \frac{y+x^{3}}{x}
      $$

      El signo depende de dos cosas: dónde está $y$ respecto de $-x^{3}$ y el
      signo de $x$.

      | región | $y+x^{3}$ | $x$ | $y'$ |
      |---|---|---|---|
      | $x>0$, $y>-x^{3}$ | $+$ | $+$ | crece |
      | $x>0$, $y<-x^{3}$ | $-$ | $+$ | decrece |
      | $x<0$, $y>-x^{3}$ | $+$ | $-$ | decrece |
      | $x<0$, $y<-x^{3}$ | $-$ | $-$ | crece |

      La cúbica $y=-x^{3}$ es la frontera, y sobre ella $y'=0$. Es la misma
      ecuación del 9.9(f), donde sí se resuelve: $y=\tfrac{x^{3}}{2}+Cx$.

      ### 3 · 9.4 · $y''=yx+x^{2}+1$

      $$
      y(0)=1, \quad y'(0)=2, \quad y''(0)=1, \quad y'''(0)=1
      $$

      $$
      P_3(x) = 1+2x+\frac{x^{2}}{2}+\frac{x^{3}}{6}
      $$

      **Lo que hay que llevarse.** Estos tres apartados son los que más caen de
      todo el tema en los controles cortos, y ninguno pide resolver nada. La
      técnica es una sola: **derivar la ecuación tantas veces como haga falta**
      y evaluar en el punto. Y el aviso: el polinomio aproxima cerca, no lejos.

  - id: seis-particulares-de-segundo-orden
    titulo: Seis de segundo orden por coeficientes indeterminados
    fuente: >-
      Ejercicio 9.10 · Problemas complementarios, tema 9 · Cálculo, UPV/EHU.
      El apartado (d) ya estaba en el sitio; aquí entran los otros cinco. Los
      apartados (e) y (f) son de las convocatorias 2018/2019 7E y 2017/2018
      6E.
    nivel: practica
    enunciado: |
      Utilizando el método de *Coeficientes Indeterminados*, resolver las
      siguientes EDOs:

      (a) $y''+y = \operatorname{sen}2x$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (b) $y''+y'-6y = 36x$

      (c) $y''+9y = 2x^{2}-5$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (e) $y''-3y'+2y = 2xe^{x}$

      (f) $y''+9y = 9\operatorname{sen}3x+2e^{3x}$
    pide: La solución general de cada una.
    pasos:
      - tipo: reconocer
        pregunta: |
          En (a), $y''+y=\operatorname{sen}2x$, las raíces son $\pm i$. ¿Hay
          resonancia?
        opciones:
          - texto: >-
              No: la frecuencia del segundo miembro es $2$ y la de la
              homogénea es $1$. Basta probar $A\operatorname{sen}2x$
            correcta: true
            mensaje: |
              Eso es. La resonancia exige que **la frecuencia coincida**, no
              solo que haya senos en los dos sitios. Aquí no coincide, así que
              no hace falta ninguna $x$.
          - texto: >-
              Sí, porque la homogénea tiene senos y cosenos
            mensaje: |
              Lo que importa es la frecuencia. $\operatorname{sen}x$ y
              $\operatorname{sen}2x$ son funciones independientes: la segunda
              no resuelve la homogénea.
          - texto: >-
              Sí, porque $2$ es el doble de $1$
            mensaje: |
              Que sea el doble no significa nada aquí. Compara $2i$ con las
              raíces $\pm i$: no está entre ellas.

      - tipo: calcular
        titulo: El coeficiente del apartado (a)
        pregunta: |
          Con $y_p = A\operatorname{sen}2x$, ¿cuánto vale $A$?
        respuesta:
          tipo: numero
          valor: '-0.3333'
          tolerancia: 0.002
          formato: en forma exacta (-1/3) o con cuatro decimales
        distractores:
          - valor: '0.3333'
            mensaje: |
              El signo. $y''_p = -4A\operatorname{sen}2x$, así que
              $y''_p+y_p = -3A\operatorname{sen}2x$: para dar $+1$ hace falta
              $A$ negativo.
          - valor: '1'
            mensaje: |
              $1$ es el coeficiente del segundo miembro. Falta dividir entre
              el $-3$ que sale de sustituir.
        pista: |
          $\left(A\operatorname{sen}2x\right)'' = -4A\operatorname{sen}2x$.
        desarrollo: |
          $$
          y''_p+y_p = -4A\operatorname{sen}2x + A\operatorname{sen}2x
          = -3A\operatorname{sen}2x
          $$

          $$
          -3A = 1 \;\Longrightarrow\; A = -\frac13
          $$

      - tipo: calcular
        titulo: El coeficiente resonante del apartado (f)
        pregunta: |
          En $y''+9y = 9\operatorname{sen}3x+2e^{3x}$ hay resonancia con
          $\operatorname{sen}3x$, y la particular de ese término es
          $Cx\cos3x$. ¿Cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '-1.5'
          tolerancia: 0.008
          formato: en forma exacta (-3/2) o con un decimal
        distractores:
          - valor: '1.5'
            mensaje: |
              El signo. Sustituyendo $x\cos3x$ sale
              $-6\operatorname{sen}3x$, con menos, así que $C$ tiene que ser
              negativo para dar $+9\operatorname{sen}3x$.
          - valor: '0.1111'
            mensaje: |
              $\tfrac19$ pertenece al otro término: la particular de $2e^{3x}$
              es $\tfrac{e^{3x}}{9}$, porque $3^{2}+9=18$ y $\tfrac{2}{18}$.
        pista: |
          Con $y=x\cos3x$: $y'' = -6\operatorname{sen}3x-9x\cos3x$, y el
          término en $x$ se cancela con el $9y$.
        desarrollo: |
          $$
          y = x\cos3x
          \;\Longrightarrow\;
          y'' = -6\operatorname{sen}3x - 9x\cos3x
          $$

          $$
          y''+9y = -6\operatorname{sen}3x
          $$

          $$
          -6C = 9 \;\Longrightarrow\; C = -\frac32
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Hay resonancia cuando la forma que se va a probar **ya resuelve**
              la homogénea, y entonces se multiplica por $x$.
          - texto: >-
              En (e), $2xe^{x}$ resuena con la raíz $r=1$, así que la
              particular es $xe^{x}(A+Bx)$ y no $e^{x}(A+Bx)$.
          - texto: >-
              En (f) hay dos términos y solo uno resuena: el
              $\operatorname{sen}3x$, porque $\pm3i$ son las raíces; el
              $2e^{3x}$ no, porque $3$ no lo es.
          - texto: >-
              Y en (c), como el segundo miembro es un polinomio de grado $2$ y
              no hay raíz nula, la particular es $ax^{2}$ a secas.
            trampa: true
            mensaje: |
              La particular polinómica lleva **todos** los grados hasta el
              suyo: $ax^{2}+bx+c$. Aquí resulta que $b=0$ por casualidad —el
              segundo miembro no tiene término en $x$ y la ecuación no tiene
              $y'$—, pero eso hay que descubrirlo resolviendo, no suponerlo.
        veredicto: |
          Dos comprobaciones automáticas: que la forma probada no resuelva ya
          la homogénea, y que el polinomio de prueba lleve todos los grados. El
          resto es sustituir e igualar coeficientes.
    resolucion: |
      **Los cinco resultados nuevos.**

      | apartado | solución |
      |---|---|
      | (a) | $C_1\operatorname{sen}x+C_2\cos x-\tfrac13\operatorname{sen}2x$ |
      | (b) | $C_1e^{-3x}+C_2e^{2x}-6x-1$ |
      | (c) | $C_1\cos3x+C_2\operatorname{sen}3x+\tfrac29x^{2}-\tfrac{49}{81}$ |
      | (e) | $C_1e^{x}+C_2e^{2x}+xe^{x}\left(-2-x\right)$ |
      | (f) | $C_1\operatorname{sen}3x+C_2\cos3x+\tfrac{e^{3x}}{9}-\tfrac32x\cos3x$ |

      ### 1 · Dónde hay resonancia y dónde no

      | apartado | segundo miembro | raíces | ¿resuena? |
      |---|---|---|---|
      | (a) | $\operatorname{sen}2x$ | $\pm i$ | no: frecuencias distintas |
      | (b) | $36x$ | $-3,\,2$ | no: $0$ no es raíz |
      | (c) | $2x^{2}-5$ | $\pm3i$ | no: $0$ no es raíz |
      | (e) | $2xe^{x}$ | $1,\,2$ | **sí**, con $r=1$ |
      | (f) | $9\operatorname{sen}3x$ | $\pm3i$ | **sí** |
      | (f) | $2e^{3x}$ | $\pm3i$ | no |

      **La comparación que hay que hacer es entre la raíz y el exponente o la
      frecuencia**, no entre los tipos de función.

      ### 2 · El apartado (e), con el atajo

      Escribiendo $y=e^{x}u$, la ecuación $y''-3y'+2y=2xe^{x}$ se convierte en

      $$
      u''-u' = 2x
      $$

      Con $u = Ax+Bx^{2}$: $u''-u' = 2B-A-2Bx$, y comparando,
      $B=-1$, $A=-2$.

      ### 3 · Los coeficientes de (c), que sorprenden

      $$
      y_p = ax^{2}+bx+c
      \;\Longrightarrow\;
      2a + 9ax^{2}+9bx+9c = 2x^{2}-5
      $$

      $$
      a = \frac29, \qquad b = 0, \qquad 9c = -5-\frac49
      \;\Longrightarrow\; c = -\frac{49}{81}
      $$

      El $-\tfrac{49}{81}$ es el clásico: el término independiente arrastra el
      $2a$ que viene de derivar el $x^{2}$.

      **Lo que hay que llevarse.** La resonancia se decide comparando **el
      exponente o la frecuencia del segundo miembro con las raíces
      características**, y no de otra forma. Y en un polinomio de prueba van
      todos los grados hasta el del segundo miembro, aunque alguno acabe
      saliendo cero.

  - id: el-parametro-que-hace-que-sea-solucion
    titulo: Dada la solución, hallar la ecuación
    fuente: Ejercicio 9.11 · Problemas complementarios, tema 9 · Cálculo, UPV/EHU (2012/2013 6E)
    nivel: practica
    enunciado: |
      Sea la EDO $y''+my = 0$, donde $m$ es desconocida. En cada uno de los
      apartados siguientes, calcular el valor de $m$ sabiendo que la función
      dada en dicho apartado es una solución de la EDO.

      (a) $y = 100\operatorname{sen}2\pi t$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (c) $y = e^{20t}$

      (b) $y = 25\cos 6\pi t + 8\cos 6\pi t$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (d) $y = 200-500t$
    pide: El valor de m en cada apartado.
    pasos:
      - tipo: reconocer
        pregunta: |
          El ejercicio va al revés de lo habitual. ¿Qué hay que hacer?
        opciones:
          - texto: >-
              Derivar dos veces la función dada y exigir que
              $y''+my=0$ se cumpla **para todo** $t$
            correcta: true
            mensaje: |
              Eso es. Y en los cuatro casos $y''$ resulta ser un múltiplo de
              $y$, así que la condición fija $m$ de una sola vez.
          - texto: >-
              Resolver la EDO con $m$ genérica y comparar
            mensaje: |
              Se puede, y sale lo mismo, pero es el camino largo: hay que
              distinguir $m>0$, $m=0$ y $m<0$. Derivar la función dada es
              inmediato.
          - texto: >-
              Sustituir un valor concreto de $t$
            mensaje: |
              Con un solo $t$ saldría un $m$ que solo cumple la ecuación en ese
              punto. Ser solución significa cumplirla en todos.

      - tipo: calcular
        titulo: El apartado (a)
        pregunta: |
          Para $y = 100\operatorname{sen}2\pi t$, ¿cuánto vale $m$?
        respuesta:
          tipo: numero
          valor: '39.4784'
          tolerancia: 0.03
          formato: en forma exacta (4pi^2) o con cuatro decimales
        distractores:
          - valor: '6.2832'
            mensaje: |
              $2\pi$ es la frecuencia, no su cuadrado. Al derivar dos veces
              baja un factor $2\pi$ **por cada derivada**.
          - valor: '-39.4784'
            mensaje: |
              El signo. $y''=-4\pi^{2}y$, así que $y''+4\pi^{2}y=0$: $m$ es
              positivo.
        pista: |
          $\left(\operatorname{sen}\omega t\right)'' =
          -\omega^{2}\operatorname{sen}\omega t$.
        desarrollo: |
          $$
          y'' = -\left(2\pi\right)^{2}y
          \;\Longrightarrow\;
          y''+4\pi^{2}y = 0
          \;\Longrightarrow\;
          m = 4\pi^{2} \approx 39{,}4784
          $$

      - tipo: calcular
        titulo: El apartado (c)
        pregunta: |
          Para $y = e^{20t}$, ¿cuánto vale $m$?
        respuesta:
          tipo: numero
          valor: '-400'
          tolerancia: 0.5
          formato: un número entero
        distractores:
          - valor: '400'
            mensaje: |
              El signo, y es el que separa los dos comportamientos: con
              $m>0$ la solución **oscila** y con $m<0$ crece
              exponencialmente. Una exponencial creciente exige $m$ negativo.
          - valor: '20'
            mensaje: |
              $20$ es la raíz característica. La $m$ es su cuadrado cambiado
              de signo, porque $r^{2}+m=0$.
        pista: |
          $y''=400y$, y la ecuación pide $y''=-my$.
        desarrollo: |
          $$
          y'' = 400e^{20t} = 400y
          \;\Longrightarrow\;
          400y + my = 0
          \;\Longrightarrow\;
          m = -400
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La ecuación $y''+my=0$ tiene raíces $r=\pm\sqrt{-m}$: oscila si
              $m>0$, crece si $m<0$ y es una recta si $m=0$.
          - texto: >-
              En (a) y (b) la función es una oscilación pura, así que $m$ es el
              cuadrado de la frecuencia.
          - texto: >-
              En (c) la exponencial creciente obliga a $m<0$, y en (d) la recta
              obliga a $m=0$.
          - texto: >-
              Y en (b), como hay dos sumandos, salen dos valores de $m$ y hay
              que quedarse con el mayor.
            trampa: true
            mensaje: |
              Los dos sumandos son **la misma función**:
              $25\cos6\pi t + 8\cos6\pi t = 33\cos6\pi t$. Hay un solo valor,
              $m=(6\pi)^{2}$. La amplitud no interviene: en una ecuación lineal
              homogénea, multiplicar una solución por una constante da otra
              solución.
        veredicto: |
          El signo de $m$ decide el mundo entero de la ecuación: positivo,
          oscila; negativo, se dispara; cero, es una recta. Leer la función
          dada y saber en cuál de los tres casos estás es la mitad del
          ejercicio, y se hace de un vistazo.
    resolucion: |
      **Los cuatro resultados.**

      | apartado | función | $m$ | qué tipo de solución es |
      |---|---|---|---|
      | (a) | $100\operatorname{sen}2\pi t$ | $4\pi^{2}\approx39{,}48$ | oscilación |
      | (b) | $33\cos 6\pi t$ | $(6\pi)^{2}\approx355{,}31$ | oscilación |
      | (c) | $e^{20t}$ | $-400$ | crecimiento exponencial |
      | (d) | $200-500t$ | $0$ | recta |

      ### 1 · El método

      $$
      y''+my = 0
      \;\Longrightarrow\;
      m = -\frac{y''}{y}
      $$

      y ese cociente tiene que ser **constante**: si no lo fuera, la función
      dada no sería solución de ninguna ecuación de esa forma.

      ### 2 · Los tres regímenes

      Las raíces de $r^{2}+m=0$ son $r=\pm\sqrt{-m}$:

      | $m$ | raíces | solución general |
      |---|---|---|
      | $>0$ | $\pm i\sqrt{m}$ | $k_1\cos\sqrt{m}\,t+k_2\operatorname{sen}\sqrt{m}\,t$ |
      | $=0$ | $0$ doble | $k_1+k_2t$ |
      | $<0$ | $\pm\sqrt{-m}$ | $k_1e^{\sqrt{-m}t}+k_2e^{-\sqrt{-m}t}$ |

      El apartado (d) es el caso $m=0$, y por eso la solución es una recta:
      raíz doble en cero.

      ### 3 · El detalle del apartado (b)

      $25\cos6\pi t + 8\cos6\pi t$ son **la misma función** sumada consigo
      misma: $33\cos6\pi t$. La amplitud no cambia nada, porque la ecuación es
      lineal y homogénea.

      **Lo que hay que llevarse.** Este ejercicio es la ecuación característica
      leída al revés, y es la forma más rápida de comprobar que has entendido
      los tres regímenes. Si te sabes la tabla de arriba, los cuatro apartados
      son de cabeza.

  - id: la-cosecante-y-el-logaritmo
    titulo: La variación de parámetros que acaba en un logaritmo
    fuente: >-
      Ejercicio 9.12(a) · Problemas complementarios, tema 9 · Cálculo,
      UPV/EHU. Los apartados (b), (c) y (d) del mismo ejercicio son los mismos
      que el 6 (j), (k) y (l) del boletín básico y no se repiten aquí.
    nivel: practica
    enunciado: |
      Resolver la siguiente EDO utilizando el método de *Variación de
      Parámetros*:

      $$
      y''+16y = \frac{1}{\operatorname{sen}4x}
      $$
    pide: La solución general.
    pasos:
      - tipo: reconocer
        pregunta: |
          Comparado con $y''+16y=\tfrac{1}{\cos^{3}4x}$ —el apartado (b) del
          mismo ejercicio—, ¿qué cambia aquí?
        opciones:
          - texto: >-
              Que una de las dos integrales sale logarítmica en vez de
              racional, y por eso aparece $\ln\left(\operatorname{sen}4x\right)$
              en la respuesta
            correcta: true
            mensaje: |
              Eso es. La homogénea y el wronskiano son idénticos; lo único que
              cambia es qué primitivas salen. Ahí está toda la diferencia entre
              los dos apartados.
          - texto: >-
              Que hay que usar otro método
            mensaje: |
              El método es el mismo. La variación de parámetros no mira qué
              aspecto tiene el segundo miembro: monta las dos integrales y ya.
          - texto: >-
              Que la homogénea es distinta
            mensaje: |
              Es la misma ecuación homogénea, $y''+16y=0$, con las mismas
              soluciones $\cos4x$ y $\operatorname{sen}4x$ y el mismo
              wronskiano $4$.

      - tipo: calcular
        titulo: El coeficiente del término polinómico
        pregunta: |
          La solución particular tiene la forma
          $C_1\,x\cos4x + C_2\operatorname{sen}4x
          \ln\left(\operatorname{sen}4x\right)$. ¿Cuánto vale $C_1$?
        respuesta:
          tipo: numero
          valor: '-0.25'
          tolerancia: 0.002
          formato: en forma exacta (-1/4) o con dos decimales
        distractores:
          - valor: '0.25'
            mensaje: |
              El signo. En la fórmula, el primer sumando lleva un menos
              delante: $y_p=-y_1\int\tfrac{y_2f}{W}+\dots$
          - valor: '-0.0625'
            mensaje: |
              $-\tfrac{1}{16}$ es el coeficiente del **otro** término, el del
              logaritmo. Este sale de $\int\tfrac{1}{4}dx=\tfrac{x}{4}$.
        pista: |
          $\displaystyle\int\frac{y_2 f}{W}dx
          = \int\frac{\operatorname{sen}4x}{4\operatorname{sen}4x}dx
          = \frac{x}{4}$.
        desarrollo: |
          Con $y_1=\cos4x$, $y_2=\operatorname{sen}4x$, $W=4$ y
          $f=\tfrac{1}{\operatorname{sen}4x}$:

          $$
          -y_1\int\frac{y_2 f}{W}\,dx
          = -\cos4x\int\frac{1}{4}\,dx
          = -\frac{x}{4}\cos4x
          $$

          $C_1 = -\tfrac14$.

      - tipo: calcular
        titulo: Y el coeficiente del logaritmo
        pregunta: |
          ¿Cuánto vale $C_2$?
        respuesta:
          tipo: numero
          valor: '0.0625'
          tolerancia: 0.0006
          formato: en forma exacta (1/16) o con cuatro decimales
        distractores:
          - valor: '0.25'
            mensaje: |
              $\tfrac14$ es lo que saldría sin el wronskiano. La integral
              $\int\tfrac{\cos4x}{4\operatorname{sen}4x}dx$ trae otro
              $\tfrac14$ del cambio $u=\operatorname{sen}4x$.
          - valor: '-0.0625'
            mensaje: |
              El signo. El segundo sumando de la fórmula va con $+$.
        pista: |
          $\displaystyle\int\frac{\cos4x}{4\operatorname{sen}4x}dx
          = \frac{1}{16}\ln\left\lvert\operatorname{sen}4x\right\rvert$.
        desarrollo: |
          $$
          y_2\int\frac{y_1 f}{W}\,dx
          = \operatorname{sen}4x\int\frac{\cos4x}{4\operatorname{sen}4x}\,dx
          = \frac{1}{16}\operatorname{sen}4x
          \ln\left\lvert\operatorname{sen}4x\right\rvert
          $$

          $C_2 = \tfrac{1}{16}$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La homogénea da $y_1=\cos4x$, $y_2=\operatorname{sen}4x$ y
              wronskiano $W=4$.
          - texto: >-
              La primera integral se simplifica entera —el
              $\operatorname{sen}4x$ del numerador cancela con el del segundo
              miembro— y deja $\tfrac{x}{4}$.
          - texto: >-
              La segunda es un logaritmo, porque el numerador es la derivada
              del denominador salvo constantes.
          - texto: >-
              Y como aparece un término con $x$ multiplicando, este ejercicio
              también tiene resonancia.
            trampa: true
            mensaje: |
              No hay resonancia: $\tfrac{1}{\operatorname{sen}4x}$ no es
              solución de la homogénea. La $x$ aparece porque una de las dos
              **integrales** da $x$, que es otra cosa. La resonancia es un
              concepto de coeficientes indeterminados, y aquí no se está usando
              ese método.
        veredicto: |
          Este apartado y el (b) del mismo ejercicio comparten homogénea,
          wronskiano y fórmula, y solo se diferencian en las primitivas. Es la
          demostración de que la variación de parámetros **no piensa**: monta
          las dos integrales y el trabajo queda del lado del cálculo integral.
    resolucion: |
      **Datos.** $y''+16y=\dfrac{1}{\operatorname{sen}4x}$.

      ### 1 · La homogénea

      $r^{2}+16=0$ da $r=\pm4i$:

      $$
      y_h = C_1\operatorname{sen}4x + C_2\cos4x,
      \qquad
      W = \begin{vmatrix}
      \cos4x & \operatorname{sen}4x\\
      -4\operatorname{sen}4x & 4\cos4x
      \end{vmatrix} = 4
      $$

      ### 2 · Las dos integrales

      $$
      -\cos4x\int\frac{\operatorname{sen}4x}{4\operatorname{sen}4x}\,dx
      = -\frac{x}{4}\cos4x
      $$

      $$
      +\operatorname{sen}4x\int\frac{\cos4x}{4\operatorname{sen}4x}\,dx
      = \frac{1}{16}\operatorname{sen}4x
      \ln\left\lvert\operatorname{sen}4x\right\rvert
      $$

      ### 3 · La solución

      $$
      \boxed{\;
      y = C_1\operatorname{sen}4x + C_2\cos4x
      - \frac{x}{4}\cos4x
      + \frac{1}{16}\operatorname{sen}4x
      \ln\left(\operatorname{sen}4x\right)
      \;}
      $$

      ### 4 · El contraste con el apartado (b)

      | | (a), aquí | (b), en el boletín básico |
      |---|---|---|
      | segundo miembro | $\tfrac{1}{\operatorname{sen}4x}$ | $\tfrac{1}{\cos^{3}4x}$ |
      | primera integral | $\tfrac{x}{4}$ | $\tfrac{1}{32\cos^{2}4x}$ |
      | segunda integral | $\tfrac{1}{16}\ln\lvert\operatorname{sen}4x\rvert$ | $\tfrac{\tan4x}{16}$ |

      Mismo método, misma homogénea, mismo wronskiano. **Lo único que cambia
      son las primitivas** — y por eso este método es el universal: no hay nada
      que decidir.

      **Lo que hay que llevarse.** Cuando el segundo miembro es un cociente
      trigonométrico, la variación de parámetros casi siempre deja una
      integral inmediata y otra logarítmica. Reconocer cuál es cuál antes de
      integrar ahorra el rato de buscar una primitiva que no existe.

  - id: tres-problemas-de-modelado-con-edos
    titulo: Un almacén, una epidemia y unos plátanos
    fuente: >-
      Ejercicios 9.15, 9.16 y 9.17 · Problemas complementarios, tema 9 ·
      Cálculo, UPV/EHU. De las convocatorias 2013/2014 5E, 2019/2020 7E y
      2014/2015 5E.
    nivel: practica
    enunciado: |
      **9.15** Un almacén de libros retira constantemente un 2 % de los libros
      almacenados, pero también recibe continuamente 400 libros nuevos.

      &nbsp;&nbsp;(a) Escribir el modelo matemático que calcula para cada
      instante $t$ el número de libros, $N(t)$, que hay en stock.

      &nbsp;&nbsp;(b) Utilizando el modelo, calcular $N(t)$ y estudiar su
      evolución en función del stock inicial.

      **9.16** La tasa de crecimiento del número de personas infectadas por
      cierta enfermedad contagiosa es proporcional al producto de las personas
      contagiadas y de las no contagiadas. En un municipio con una población de
      100 habitantes, inicialmente hay una persona contagiada y al día
      siguiente cuatro. ¿En qué momento se habrá contagiado el 90 % de la
      población?

      **9.17** El estado de maduración de los plátanos en modernas cámaras de
      maduración se describe mediante la EDO $R'(t)=0{,}5(2-R)$, donde $t$ se
      expresa en semanas. El valor $R=0$ corresponde a un plátano completamente
      verde, mientras que $R=1{,}5$ corresponde a uno listo para consumir.
      Supongamos que los plátanos se introducen en la cámara con un estado de
      maduración $R=0{,}5$. ¿Cuánto tiempo deberán dejarse dentro de la cámara
      para que estén listos para consumir?
    pide: El modelo y su evolución, el instante del 90 % y el tiempo de maduración.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los problemas 9.15 y 9.17 tienen la misma forma,
          $y'=a-by$. ¿Qué se puede decir de los dos sin resolver nada?
        opciones:
          - texto: >-
              Que hay un equilibrio en $y=a/b$ y que la solución se acerca a él
              exponencialmente, venga de donde venga
            correcta: true
            mensaje: |
              Eso es. En el almacén el equilibrio son $400/0{,}02 = 20\,000$
              libros; en los plátanos, $R=2$. Y saberlo permite contestar la
              parte cualitativa antes de integrar.
          - texto: >-
              Que las dos crecen indefinidamente
            mensaje: |
              El término $-by$ frena el crecimiento: cuanto mayor es $y$, más
              resta. Por eso hay un techo y no un crecimiento sin fin.
          - texto: >-
              Que hacen falta dos condiciones iniciales
            mensaje: |
              Son de primer orden: con una basta. Dos harían falta en una de
              segundo orden.

      - tipo: calcular
        titulo: El equilibrio del almacén
        pregunta: |
          Con el modelo $N'=400-0{,}02N$, ¿a cuántos libros tiende el stock a
          largo plazo?
        respuesta:
          tipo: numero
          valor: '20000'
          tolerancia: 1
          formato: un número entero
        distractores:
          - valor: '8'
            mensaje: |
              $8$ es el $2\%$ de $400$. El equilibrio es donde lo que entra
              iguala a lo que sale: $400 = 0{,}02N$.
          - valor: '400'
            mensaje: |
              $400$ es lo que entra por unidad de tiempo, no el stock. El
              equilibrio se alcanza cuando la salida —el $2\%$ del stock— vale
              también $400$.
        pista: |
          El equilibrio es donde $N'=0$, o sea $400 = 0{,}02N$.
        desarrollo: |
          $$
          400 = 0{,}02\,N \;\Longrightarrow\; N = 20\,000
          $$

          Y la solución completa es

          $$
          N(t) = 20\,000 + \left(N_0-20\,000\right)e^{-0{,}02t}
          $$

          así que **sube si el stock inicial es menor que $20\,000$ y baja si
          es mayor**, y en los dos casos se acerca al equilibrio. Si empieza
          justo en $20\,000$, se queda.

      - tipo: calcular
        titulo: Cuándo enferma el 90 % del municipio
        pregunta: |
          Con $P(0)=1$, $P(1)=4$ y población $100$, ¿en qué momento se habrá
          contagiado el $90\%$?
        respuesta:
          tipo: numero
          valor: '4.79'
          tolerancia: 0.02
          formato: en días, con dos decimales
        distractores:
          - valor: '3.2'
            mensaje: |
              Si multiplicas por cuatro cada día —$1$, $4$, $16$, $64$…—
              llegarías a $90$ en unos $3{,}2$ días. Pero el crecimiento
              **no** es exponencial: se frena conforme quedan menos sanos, y
              por eso tarda más.
          - valor: '22.5'
            mensaje: |
              Eso saldría de suponer crecimiento lineal, cuatro contagiados al
              día. La tasa depende del producto de contagiados por sanos, y al
              principio se dispara.
        pista: |
          La logística es
          $P(t)=\dfrac{100}{1+Ae^{-100kt}}$. Con $P(0)=1$ sale $A=99$, y con
          $P(1)=4$, $e^{-100k}=\tfrac{24}{99}$.
        desarrollo: |
          $$
          P(t) = \frac{100}{1+99\,e^{-100kt}}
          $$

          De $P(1)=4$: $1+99e^{-100k}=25$, o sea
          $e^{-100k}=\tfrac{24}{99}$ y $100k = 1{,}41707$.

          $$
          P(t)=90
          \;\Longrightarrow\;
          99e^{-1{,}41707\,t} = \frac{100}{90}-1 = \frac19
          $$

          $$
          t = \frac{\ln\left(891\right)}{1{,}41707} \approx 4{,}79 \text{ días}
          $$

      - tipo: calcular
        titulo: Cuánto tardan los plátanos
        pregunta: |
          Con $R'=0{,}5(2-R)$ y $R(0)=0{,}5$, ¿cuántas semanas hasta
          $R=1{,}5$?
        respuesta:
          tipo: numero
          valor: '2.1972'
          tolerancia: 0.01
          formato: en semanas, en forma exacta (2·ln3) o con cuatro decimales
        distractores:
          - valor: '1.0986'
            mensaje: |
              $\ln3$ es la mitad. La constante de la ecuación es $0{,}5$, así
              que el tiempo lleva un $\tfrac{1}{0{,}5}=2$ delante.
          - valor: '2'
            mensaje: |
              $R=2$ es el estado de maduración de equilibrio, al que los
              plátanos **nunca llegan**: solo se acercan. El tiempo hasta
              $1{,}5$ es otra cosa.
        pista: |
          $R = 2-1{,}5e^{-0{,}5t}$, y hay que resolver $R=1{,}5$.
        desarrollo: |
          $$
          R(t) = 2 - Ce^{-0{,}5t},
          \qquad
          R(0)=0{,}5 \Rightarrow C = 1{,}5
          $$

          $$
          1{,}5 = 2-1{,}5e^{-0{,}5t}
          \;\Longrightarrow\;
          e^{-0{,}5t} = \frac13
          \;\Longrightarrow\;
          t = 2\ln 3 \approx 2{,}20 \text{ semanas}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              «Entra una cantidad fija y sale un porcentaje» es
              $y'=a-by$: equilibrio en $a/b$ y acercamiento exponencial.
          - texto: >-
              «La tasa es proporcional al producto de los que lo tienen por los
              que no» es la **logística**, $P'=kP(M-P)$, con techo en $M$.
          - texto: >-
              En los tres problemas el equilibrio se lee en la ecuación, sin
              resolverla: es donde el segundo miembro se anula.
          - texto: >-
              Y en los tres, la solución alcanza ese equilibrio en un tiempo
              finito.
            trampa: true
            mensaje: |
              No lo alcanza nunca: se acerca asintóticamente. Los plátanos
              nunca llegan a $R=2$ y el almacén nunca llega exactamente a
              $20\,000$. Por eso el enunciado de los plátanos pregunta por
              $R=1{,}5$ y no por $R=2$ — y por eso la pregunta tiene respuesta.
        veredicto: |
          Dos modelos cubren estos tres problemas y buena parte de los de
          examen: $y'=a-by$, con techo, y la logística $P'=kP(M-P)$, con
          techo y forma de S. Reconocer cuál es cuál en el enunciado es lo que
          se puntúa.
    resolucion: |
      **Los tres resultados.**

      | problema | modelo | respuesta |
      |---|---|---|
      | 9.15 | $N' = 400-0{,}02N$ | $N=20\,000+(N_0-20\,000)e^{-0{,}02t}$ |
      | 9.16 | $P' = kP(100-P)$ | $t\approx4{,}79$ días |
      | 9.17 | $R' = 0{,}5(2-R)$ | $t = 2\ln3\approx2{,}2$ semanas |

      ### 1 · El modelo de entrada fija y salida proporcional

      Aparece en 9.15 y en 9.17, y también en el embalse del 9.14:

      $$
      y' = a-by
      \;\Longrightarrow\;
      y(t) = \frac{a}{b} + \left(y_0-\frac{a}{b}\right)e^{-bt}
      $$

      El equilibrio $\tfrac{a}{b}$ se lee **anulando el segundo miembro**, sin
      integrar. Y como el paréntesis se multiplica por una exponencial
      decreciente, la solución se acerca a él desde arriba o desde abajo según
      dónde empiece.

      | problema | $a$ | $b$ | equilibrio |
      |---|---|---|---|
      | 9.15 | $400$ | $0{,}02$ | $20\,000$ libros |
      | 9.17 | $1$ | $0{,}5$ | $R=2$ |

      ### 2 · La logística

      $$
      P' = kP(M-P)
      \;\Longrightarrow\;
      P(t) = \frac{M}{1+Ae^{-kMt}}
      $$

      En 9.16, $M=100$, $P(0)=1$ da $A=99$, y $P(1)=4$ fija
      $e^{-100k}=\tfrac{24}{99}$.

      ### 3 · Por qué el $90\%$ tarda casi cinco días

      | día | contagiados |
      |---|---|
      | $0$ | $1$ |
      | $1$ | $4$ |
      | $2$ | $\approx15$ |
      | $3$ | $\approx41$ |
      | $4$ | $\approx75$ |
      | $4{,}79$ | $90$ |

      El primer día multiplica por cuatro y el segundo por casi cuatro; del
      tercero en adelante se frena, porque quedan pocos sanos a los que
      contagiar. **Esa es la forma de S**, y es lo que distingue una epidemia
      de una exponencial.

      **Lo que hay que llevarse.** En los problemas de modelado, la mitad del
      trabajo es traducir la frase al segundo miembro de la ecuación. «Un
      porcentaje de lo que hay» es $-by$; «proporcional al producto de los que
      lo tienen por los que no» es $kP(M-P)$. Con eso escrito, lo demás es una
      separable.
  - id: ej-edo-sin-resolverla
    titulo: Qué hace la solución, sin resolver la ecuación
    fuente: Ejemplo introductorio · Road to Ingeniería. No es de examen ni del boletín.
    nivel: ejemplo
    enunciado: |
      Sea la ecuación logística
      $$
      y' = y\left(1-y\right),
      \qquad y\left(0\right)=0{,}5
      $$
      Decir hacia qué valor tiende la solución cuando $t\to\infty$, **sin
      resolver la ecuación**.
    pide: Los equilibrios y el límite de la solución.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué son los equilibrios de una ecuación autónoma $y'=g(y)$?
        opciones:
          - texto: Los valores de $y$ que anulan $g$, y son soluciones constantes
            correcta: true
            mensaje: |
              Eso es. Si $g\left(y_{0}\right)=0$, la función constante
              $y=y_{0}$ tiene derivada cero y cumple la ecuación: se queda quieta
              para siempre. Son los candidatos a límite.
          - texto: Los puntos donde la solución corta al eje de tiempos
            mensaje: |
              Eso sería donde $y=0$, que aquí es un equilibrio por casualidad. En
              general los equilibrios se buscan anulando el segundo miembro, no
              la incógnita.
          - texto: Los valores iniciales que hacen la ecuación resoluble
            mensaje: |
              La ecuación es resoluble para cualquier valor inicial. Los
              equilibrios no tienen que ver con eso: son las soluciones que no
              cambian con el tiempo.
      - tipo: calcular
        titulo: El límite
        pregunta: |
          Los equilibrios son $y=0$ e $y=1$. Con $y\left(0\right)=0{,}5$, el
          segundo miembro $y\left(1-y\right)$ es positivo, así que la solución
          crece. ¿Hacia qué valor tiende?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.001
          formato: un número entero
        distractores:
          - valor: '0'
            mensaje: |
              Hacia el cero iría si la solución decreciera, y no lo hace: entre
              $0$ y $1$ el producto $y(1-y)$ es positivo, así que $y$ crece y se
              aleja del cero.
          - valor: '0.5'
            mensaje: |
              Ese es el valor inicial. Se quedaría ahí solo si fuese un
              equilibrio, y no lo es: $0{,}5\cdot 0{,}5 = 0{,}25 \neq 0$, así que
              la derivada no es nula y la solución se mueve.
        pista: |
          Entre los dos equilibrios el signo de $y'$ es constante. Mira ese signo
          y verás hacia cuál de los dos va.
        desarrollo: |
          **Equilibrios.** $y\left(1-y\right)=0$ da $y=0$ e $y=1$: dos soluciones
          constantes.

          **El signo entre ellos.** Para $0<y<1$ los dos factores son positivos,
          así que $y'>0$ y la solución **crece**.

          **El límite.** Empezando en $0{,}5$, la solución crece y no puede cruzar
          el equilibrio $y=1$ —si lo tocara, se quedaría ahí para siempre, y por
          unicidad no puede cortar a otra solución—. Creciente y acotada por
          arriba, tiende a $1$.

          Todo esto sin haber separado variables ni una vez.
      - tipo: justificar
        pregunta: |
          Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: Se anula el segundo miembro y salen los equilibrios $y=0$ e $y=1$, que son soluciones constantes.
          - texto: Entre esos dos valores $y(1-y)$ es positivo, así que cualquier solución que empiece ahí crece.
          - texto: Una solución no puede cruzar un equilibrio, porque las soluciones no se cortan entre sí.
          - texto: Creciente y acotada por el equilibrio superior, la solución tiende a $1$.
          - texto: Como la solución crece sin parar, tiende a infinito.
            trampa: true
            mensaje: |
              Crecer no es tender a infinito: puede crecer y estar acotada, que
              es exactamente lo que pasa aquí. El equilibrio $y=1$ es un techo que
              la solución no puede atravesar, así que crece acercándose a él.
    resolucion: |
      A veces el examen no pide resolver, sino **decir qué hace** la solución. Y
      con una ecuación autónoma —el tiempo no aparece a la derecha— se puede
      contestar mirando el signo.

      **Los equilibrios.** $y'=0$ cuando $y\left(1-y\right)=0$, es decir $y=0$ e
      $y=1$. Son soluciones constantes: quien empieza ahí se queda.

      **El signo.** Para $0<y<1$ el producto es positivo, así que toda solución
      que arranque entre los dos equilibrios **crece**.

      **El límite.** La solución que empieza en $0{,}5$ crece, y no puede cruzar
      $y=1$: por el teorema de unicidad dos soluciones no se cortan, y $y=1$ ya es
      una solución. Creciente y acotada por arriba, tiene límite, y ese límite
      solo puede ser el equilibrio: **tiende a $1$**.

      El aviso que este tipo lleva dentro: *crecer* y *tender a infinito* no son
      lo mismo. Una función puede crecer siempre y quedarse por debajo de un
      techo, que es justo lo que hace la logística.
