  - id: la-cosecante-y-el-logaritmo
    titulo: La variación de parámetros que acaba en un logaritmo
    fuente: >-
      Ejercicio 9.12(a) · Problemas complementarios, tema 9 · Cálculo,
      UPV/EHU. Los apartados (b), (c) y (d) del mismo ejercicio son los mismos
      que el 6 (j), (k) y (l) del boletín básico y no se repiten aquí.
    nivel: practica
    enunciado: |
      Resolver la siguiente EDO utilizando el método de *Variación de
      Parámetros*:

      $$
      y''+16y = \frac{1}{\operatorname{sen}4x}
      $$
    pide: La solución general.
    pasos:
      - tipo: reconocer
        pregunta: |
          Comparado con $y''+16y=\tfrac{1}{\cos^{3}4x}$ —el apartado (b) del
          mismo ejercicio—, ¿qué cambia aquí?
        opciones:
          - texto: >-
              Que una de las dos integrales sale logarítmica en vez de
              racional, y por eso aparece $\ln\left(\operatorname{sen}4x\right)$
              en la respuesta
            correcta: true
            mensaje: |
              Eso es. La homogénea y el wronskiano son idénticos; lo único que
              cambia es qué primitivas salen. Ahí está toda la diferencia entre
              los dos apartados.
          - texto: >-
              Que hay que usar otro método
            mensaje: |
              El método es el mismo. La variación de parámetros no mira qué
              aspecto tiene el segundo miembro: monta las dos integrales y ya.
          - texto: >-
              Que la homogénea es distinta
            mensaje: |
              Es la misma ecuación homogénea, $y''+16y=0$, con las mismas
              soluciones $\cos4x$ y $\operatorname{sen}4x$ y el mismo
              wronskiano $4$.

      - tipo: calcular
        titulo: El coeficiente del término polinómico
        pregunta: |
          La solución particular tiene la forma
          $C_1\,x\cos4x + C_2\operatorname{sen}4x
          \ln\left(\operatorname{sen}4x\right)$. ¿Cuánto vale $C_1$?
        respuesta:
          tipo: numero
          valor: '-0.25'
          tolerancia: 0.002
          formato: en forma exacta (-1/4) o con dos decimales
        distractores:
          - valor: '0.25'
            mensaje: |
              El signo. En la fórmula, el primer sumando lleva un menos
              delante: $y_p=-y_1\int\tfrac{y_2f}{W}+\dots$
          - valor: '-0.0625'
            mensaje: |
              $-\tfrac{1}{16}$ es el coeficiente del **otro** término, el del
              logaritmo. Este sale de $\int\tfrac{1}{4}dx=\tfrac{x}{4}$.
        pista: |
          $\displaystyle\int\frac{y_2 f}{W}dx
          = \int\frac{\operatorname{sen}4x}{4\operatorname{sen}4x}dx
          = \frac{x}{4}$.
        desarrollo: |
          Con $y_1=\cos4x$, $y_2=\operatorname{sen}4x$, $W=4$ y
          $f=\tfrac{1}{\operatorname{sen}4x}$:

          $$
          -y_1\int\frac{y_2 f}{W}\,dx
          = -\cos4x\int\frac{1}{4}\,dx
          = -\frac{x}{4}\cos4x
          $$

          $C_1 = -\tfrac14$.

      - tipo: calcular
        titulo: Y el coeficiente del logaritmo
        pregunta: |
          ¿Cuánto vale $C_2$?
        respuesta:
          tipo: numero
          valor: '0.0625'
          tolerancia: 0.0006
          formato: en forma exacta (1/16) o con cuatro decimales
        distractores:
          - valor: '0.25'
            mensaje: |
              $\tfrac14$ es lo que saldría sin el wronskiano. La integral
              $\int\tfrac{\cos4x}{4\operatorname{sen}4x}dx$ trae otro
              $\tfrac14$ del cambio $u=\operatorname{sen}4x$.
          - valor: '-0.0625'
            mensaje: |
              El signo. El segundo sumando de la fórmula va con $+$.
        pista: |
          $\displaystyle\int\frac{\cos4x}{4\operatorname{sen}4x}dx
          = \frac{1}{16}\ln\left\lvert\operatorname{sen}4x\right\rvert$.
        desarrollo: |
          $$
          y_2\int\frac{y_1 f}{W}\,dx
          = \operatorname{sen}4x\int\frac{\cos4x}{4\operatorname{sen}4x}\,dx
          = \frac{1}{16}\operatorname{sen}4x
          \ln\left\lvert\operatorname{sen}4x\right\rvert
          $$

          $C_2 = \tfrac{1}{16}$.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La homogénea da $y_1=\cos4x$, $y_2=\operatorname{sen}4x$ y
              wronskiano $W=4$.
          - texto: >-
              La primera integral se simplifica entera —el
              $\operatorname{sen}4x$ del numerador cancela con el del segundo
              miembro— y deja $\tfrac{x}{4}$.
          - texto: >-
              La segunda es un logaritmo, porque el numerador es la derivada
              del denominador salvo constantes.
          - texto: >-
              Y como aparece un término con $x$ multiplicando, este ejercicio
              también tiene resonancia.
            trampa: true
            mensaje: |
              No hay resonancia: $\tfrac{1}{\operatorname{sen}4x}$ no es
              solución de la homogénea. La $x$ aparece porque una de las dos
              **integrales** da $x$, que es otra cosa. La resonancia es un
              concepto de coeficientes indeterminados, y aquí no se está usando
              ese método.
        veredicto: |
          Este apartado y el (b) del mismo ejercicio comparten homogénea,
          wronskiano y fórmula, y solo se diferencian en las primitivas. Es la
          demostración de que la variación de parámetros **no piensa**: monta
          las dos integrales y el trabajo queda del lado del cálculo integral.
    resolucion: |
      **Datos.** $y''+16y=\dfrac{1}{\operatorname{sen}4x}$.

      ### 1 · La homogénea

      $r^{2}+16=0$ da $r=\pm4i$:

      $$
      y_h = C_1\operatorname{sen}4x + C_2\cos4x,
      \qquad
      W = \begin{vmatrix}
      \cos4x & \operatorname{sen}4x\\
      -4\operatorname{sen}4x & 4\cos4x
      \end{vmatrix} = 4
      $$

      ### 2 · Las dos integrales

      $$
      -\cos4x\int\frac{\operatorname{sen}4x}{4\operatorname{sen}4x}\,dx
      = -\frac{x}{4}\cos4x
      $$

      $$
      +\operatorname{sen}4x\int\frac{\cos4x}{4\operatorname{sen}4x}\,dx
      = \frac{1}{16}\operatorname{sen}4x
      \ln\left\lvert\operatorname{sen}4x\right\rvert
      $$

      ### 3 · La solución

      $$
      \boxed{\;
      y = C_1\operatorname{sen}4x + C_2\cos4x
      - \frac{x}{4}\cos4x
      + \frac{1}{16}\operatorname{sen}4x
      \ln\left(\operatorname{sen}4x\right)
      \;}
      $$

      ### 4 · El contraste con el apartado (b)

      | | (a), aquí | (b), en el boletín básico |
      |---|---|---|
      | segundo miembro | $\tfrac{1}{\operatorname{sen}4x}$ | $\tfrac{1}{\cos^{3}4x}$ |
      | primera integral | $\tfrac{x}{4}$ | $\tfrac{1}{32\cos^{2}4x}$ |
      | segunda integral | $\tfrac{1}{16}\ln\lvert\operatorname{sen}4x\rvert$ | $\tfrac{\tan4x}{16}$ |

      Mismo método, misma homogénea, mismo wronskiano. **Lo único que cambia
      son las primitivas** — y por eso este método es el universal: no hay nada
      que decidir.

      **Lo que hay que llevarse.** Cuando el segundo miembro es un cociente
      trigonométrico, la variación de parámetros casi siempre deja una
      integral inmediata y otra logarítmica. Reconocer cuál es cuál antes de
      integrar ahorra el rato de buscar una primitiva que no existe.

  - id: tres-problemas-de-modelado-con-edos
    titulo: Un almacén, una epidemia y unos plátanos
    fuente: >-
      Ejercicios 9.15, 9.16 y 9.17 · Problemas complementarios, tema 9 ·
      Cálculo, UPV/EHU. De las convocatorias 2013/2014 5E, 2019/2020 7E y
      2014/2015 5E.
    nivel: practica
    enunciado: |
      **9.15** Un almacén de libros retira constantemente un 2 % de los libros
      almacenados, pero también recibe continuamente 400 libros nuevos.

      &nbsp;&nbsp;(a) Escribir el modelo matemático que calcula para cada
      instante $t$ el número de libros, $N(t)$, que hay en stock.

      &nbsp;&nbsp;(b) Utilizando el modelo, calcular $N(t)$ y estudiar su
      evolución en función del stock inicial.

      **9.16** La tasa de crecimiento del número de personas infectadas por
      cierta enfermedad contagiosa es proporcional al producto de las personas
      contagiadas y de las no contagiadas. En un municipio con una población de
      100 habitantes, inicialmente hay una persona contagiada y al día
      siguiente cuatro. ¿En qué momento se habrá contagiado el 90 % de la
      población?

      **9.17** El estado de maduración de los plátanos en modernas cámaras de
      maduración se describe mediante la EDO $R'(t)=0{,}5(2-R)$, donde $t$ se
      expresa en semanas. El valor $R=0$ corresponde a un plátano completamente
      verde, mientras que $R=1{,}5$ corresponde a uno listo para consumir.
      Supongamos que los plátanos se introducen en la cámara con un estado de
      maduración $R=0{,}5$. ¿Cuánto tiempo deberán dejarse dentro de la cámara
      para que estén listos para consumir?
    pide: El modelo y su evolución, el instante del 90 % y el tiempo de maduración.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los problemas 9.15 y 9.17 tienen la misma forma,
          $y'=a-by$. ¿Qué se puede decir de los dos sin resolver nada?
        opciones:
          - texto: >-
              Que hay un equilibrio en $y=a/b$ y que la solución se acerca a él
              exponencialmente, venga de donde venga
            correcta: true
            mensaje: |
              Eso es. En el almacén el equilibrio son $400/0{,}02 = 20\,000$
              libros; en los plátanos, $R=2$. Y saberlo permite contestar la
              parte cualitativa antes de integrar.
          - texto: >-
              Que las dos crecen indefinidamente
            mensaje: |
              El término $-by$ frena el crecimiento: cuanto mayor es $y$, más
              resta. Por eso hay un techo y no un crecimiento sin fin.
          - texto: >-
              Que hacen falta dos condiciones iniciales
            mensaje: |
              Son de primer orden: con una basta. Dos harían falta en una de
              segundo orden.

      - tipo: calcular
        titulo: El equilibrio del almacén
        pregunta: |
          Con el modelo $N'=400-0{,}02N$, ¿a cuántos libros tiende el stock a
          largo plazo?
        respuesta:
          tipo: numero
          valor: '20000'
          tolerancia: 1
          formato: un número entero
        distractores:
          - valor: '8'
            mensaje: |
              $8$ es el $2\%$ de $400$. El equilibrio es donde lo que entra
              iguala a lo que sale: $400 = 0{,}02N$.
          - valor: '400'
            mensaje: |
              $400$ es lo que entra por unidad de tiempo, no el stock. El
              equilibrio se alcanza cuando la salida —el $2\%$ del stock— vale
              también $400$.
        pista: |
          El equilibrio es donde $N'=0$, o sea $400 = 0{,}02N$.
        desarrollo: |
          $$
          400 = 0{,}02\,N \;\Longrightarrow\; N = 20\,000
          $$

          Y la solución completa es

          $$
          N(t) = 20\,000 + \left(N_0-20\,000\right)e^{-0{,}02t}
          $$

          así que **sube si el stock inicial es menor que $20\,000$ y baja si
          es mayor**, y en los dos casos se acerca al equilibrio. Si empieza
          justo en $20\,000$, se queda.

      - tipo: calcular
        titulo: Cuándo enferma el 90 % del municipio
        pregunta: |
          Con $P(0)=1$, $P(1)=4$ y población $100$, ¿en qué momento se habrá
          contagiado el $90\%$?
        respuesta:
          tipo: numero
          valor: '4.79'
          tolerancia: 0.02
          formato: en días, con dos decimales
        distractores:
          - valor: '3.2'
            mensaje: |
              Si multiplicas por cuatro cada día —$1$, $4$, $16$, $64$…—
              llegarías a $90$ en unos $3{,}2$ días. Pero el crecimiento
              **no** es exponencial: se frena conforme quedan menos sanos, y
              por eso tarda más.
          - valor: '22.5'
            mensaje: |
              Eso saldría de suponer crecimiento lineal, cuatro contagiados al
              día. La tasa depende del producto de contagiados por sanos, y al
              principio se dispara.
        pista: |
          La logística es
          $P(t)=\dfrac{100}{1+Ae^{-100kt}}$. Con $P(0)=1$ sale $A=99$, y con
          $P(1)=4$, $e^{-100k}=\tfrac{24}{99}$.
        desarrollo: |
          $$
          P(t) = \frac{100}{1+99\,e^{-100kt}}
          $$

          De $P(1)=4$: $1+99e^{-100k}=25$, o sea
          $e^{-100k}=\tfrac{24}{99}$ y $100k = 1{,}41707$.

          $$
          P(t)=90
          \;\Longrightarrow\;
          99e^{-1{,}41707\,t} = \frac{100}{90}-1 = \frac19
          $$

          $$
          t = \frac{\ln\left(891\right)}{1{,}41707} \approx 4{,}79 \text{ días}
          $$

      - tipo: calcular
        titulo: Cuánto tardan los plátanos
        pregunta: |
          Con $R'=0{,}5(2-R)$ y $R(0)=0{,}5$, ¿cuántas semanas hasta
          $R=1{,}5$?
        respuesta:
          tipo: numero
          valor: '2.1972'
          tolerancia: 0.01
          formato: en semanas, en forma exacta (2·ln3) o con cuatro decimales
        distractores:
          - valor: '1.0986'
            mensaje: |
              $\ln3$ es la mitad. La constante de la ecuación es $0{,}5$, así
              que el tiempo lleva un $\tfrac{1}{0{,}5}=2$ delante.
          - valor: '2'
            mensaje: |
              $R=2$ es el estado de maduración de equilibrio, al que los
              plátanos **nunca llegan**: solo se acercan. El tiempo hasta
              $1{,}5$ es otra cosa.
        pista: |
          $R = 2-1{,}5e^{-0{,}5t}$, y hay que resolver $R=1{,}5$.
        desarrollo: |
          $$
          R(t) = 2 - Ce^{-0{,}5t},
          \qquad
          R(0)=0{,}5 \Rightarrow C = 1{,}5
          $$

          $$
          1{,}5 = 2-1{,}5e^{-0{,}5t}
          \;\Longrightarrow\;
          e^{-0{,}5t} = \frac13
          \;\Longrightarrow\;
          t = 2\ln 3 \approx 2{,}20 \text{ semanas}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              «Entra una cantidad fija y sale un porcentaje» es
              $y'=a-by$: equilibrio en $a/b$ y acercamiento exponencial.
          - texto: >-
              «La tasa es proporcional al producto de los que lo tienen por los
              que no» es la **logística**, $P'=kP(M-P)$, con techo en $M$.
          - texto: >-
              En los tres problemas el equilibrio se lee en la ecuación, sin
              resolverla: es donde el segundo miembro se anula.
          - texto: >-
              Y en los tres, la solución alcanza ese equilibrio en un tiempo
              finito.
            trampa: true
            mensaje: |
              No lo alcanza nunca: se acerca asintóticamente. Los plátanos
              nunca llegan a $R=2$ y el almacén nunca llega exactamente a
              $20\,000$. Por eso el enunciado de los plátanos pregunta por
              $R=1{,}5$ y no por $R=2$ — y por eso la pregunta tiene respuesta.
        veredicto: |
          Dos modelos cubren estos tres problemas y buena parte de los de
          examen: $y'=a-by$, con techo, y la logística $P'=kP(M-P)$, con
          techo y forma de S. Reconocer cuál es cuál en el enunciado es lo que
          se puntúa.
    resolucion: |
      **Los tres resultados.**

      | problema | modelo | respuesta |
      |---|---|---|
      | 9.15 | $N' = 400-0{,}02N$ | $N=20\,000+(N_0-20\,000)e^{-0{,}02t}$ |
      | 9.16 | $P' = kP(100-P)$ | $t\approx4{,}79$ días |
      | 9.17 | $R' = 0{,}5(2-R)$ | $t = 2\ln3\approx2{,}2$ semanas |

      ### 1 · El modelo de entrada fija y salida proporcional

      Aparece en 9.15 y en 9.17, y también en el embalse del 9.14:

      $$
      y' = a-by
      \;\Longrightarrow\;
      y(t) = \frac{a}{b} + \left(y_0-\frac{a}{b}\right)e^{-bt}
      $$

      El equilibrio $\tfrac{a}{b}$ se lee **anulando el segundo miembro**, sin
      integrar. Y como el paréntesis se multiplica por una exponencial
      decreciente, la solución se acerca a él desde arriba o desde abajo según
      dónde empiece.

      | problema | $a$ | $b$ | equilibrio |
      |---|---|---|---|
      | 9.15 | $400$ | $0{,}02$ | $20\,000$ libros |
      | 9.17 | $1$ | $0{,}5$ | $R=2$ |

      ### 2 · La logística

      $$
      P' = kP(M-P)
      \;\Longrightarrow\;
      P(t) = \frac{M}{1+Ae^{-kMt}}
      $$

      En 9.16, $M=100$, $P(0)=1$ da $A=99$, y $P(1)=4$ fija
      $e^{-100k}=\tfrac{24}{99}$.

      ### 3 · Por qué el $90\%$ tarda casi cinco días

      | día | contagiados |
      |---|---|
      | $0$ | $1$ |
      | $1$ | $4$ |
      | $2$ | $\approx15$ |
      | $3$ | $\approx41$ |
      | $4$ | $\approx75$ |
      | $4{,}79$ | $90$ |

      El primer día multiplica por cuatro y el segundo por casi cuatro; del
      tercero en adelante se frena, porque quedan pocos sanos a los que
      contagiar. **Esa es la forma de S**, y es lo que distingue una epidemia
      de una exponencial.

      **Lo que hay que llevarse.** En los problemas de modelado, la mitad del
      trabajo es traducir la frase al segundo miembro de la ecuación. «Un
      porcentaje de lo que hay» es $-by$; «proporcional al producto de los que
      lo tienen por los que no» es $kP(M-P)$. Con eso escrito, lo demás es una
      separable.

