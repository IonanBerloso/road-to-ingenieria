      <figcaption>Para y′ = x² − y, la parábola y = x² es la frontera: por encima de ella la solución decrece y por debajo crece, porque ahí es donde y′ cambia de signo. Las tres curvas son soluciones distintas, y todas acaban pegándose a la misma parábola.</figcaption>
