  - id: particular-que-resuena
    titulo: Cuando la particular ya está en la homogénea
    fuente: Ejercicio 9.10d · Problemas complementarios, tema 9 · Cálculo, UPV/EHU (2018/2019 5E)
    nivel: practica
    enunciado: |
      Utilizando el método de coeficientes indeterminados, resolver la ecuación
      diferencial

      $$
      y'' + 25y = 4\cos 5x - 7e^{5x}
      $$
    pide: La solución general de la ecuación.
    pasos:
      - tipo: reconocer
        pregunta: |
          La característica es $r^{2}+25=0$, con raíces $\pm 5i$, así que la
          homogénea lleva $\cos 5x$ y $\text{sen}\,5x$. ¿Qué implica eso para la
          particular?
        opciones:
          - texto: Que el término con cos5x resuena y hay que multiplicarlo por x
            correcta: true
            mensaje: |
              Exacto. Probar $A\cos 5x + B\,\text{sen}\,5x$ no puede funcionar:
              esa función ya resuelve la homogénea, así que al sustituirla sale
              $0 = 4\cos 5x$, un absurdo. La cura es multiplicar por $x$.
          - texto: Que no hay solución particular
            mensaje: |
              Sí la hay; lo que no vale es la forma ingenua. La resonancia no
              impide resolver: obliga a subir el grado del ensayo.
          - texto: Que hay que usar variación de parámetros obligatoriamente
            mensaje: |
              Es una alternativa válida y más larga. Con coeficientes
              indeterminados basta multiplicar por $x$, y el enunciado pide
              precisamente ese método.
      - tipo: calcular
        titulo: El coeficiente del término resonante
        pregunta: |
          Probando $y_p = x\,(A\cos 5x + B\,\text{sen}\,5x)$ para el trozo
          $4\cos 5x$, sale $A=0$ y $B$ distinto de cero. ¿Cuánto vale $B$?
        respuesta:
          tipo: numero
          valor: '0.4'
          tolerancia: 0.01
          formato: en forma exacta (2/5) o con un decimal
        distractores:
          - valor: '4'
            mensaje: |
              4 es el coeficiente del segundo miembro, no el de la particular.
              Al sustituir aparece un factor $10B$ que hay que igualar a 4, de
              donde $B=2/5$.
          - valor: '0.1'
            mensaje: |
              Parece que has dividido 4 entre 40. El factor que aparece al
              derivar dos veces $x\,\text{sen}\,5x$ es $10$, no 40.
        pista: |
          Al sustituir queda $10B\cos 5x = 4\cos 5x$. Despeja B.
        desarrollo: |
          Derivando dos veces $y_p = x(A\cos 5x + B\,\text{sen}\,5x)$ y
          sustituyendo, los términos con $x$ se cancelan —eso es la señal de que
          el ensayo es el bueno— y queda

          $$
          -10A\,\text{sen}\,5x + 10B\cos 5x = 4\cos 5x
          $$

          $$
          A = 0,
          \qquad
          B = \frac{4}{10} = \frac{2}{5}
          $$
      - tipo: calcular
        titulo: El coeficiente de la exponencial
        pregunta: |
          Para el trozo $-7e^{5x}$ se prueba $Ce^{5x}$ sin multiplicar por $x$,
          porque $5$ no es raíz de la característica. Sustituyendo sale
          $50C = -7$. ¿Cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '-0.14'
          tolerancia: 0.005
          formato: en forma exacta (-7/50) o con dos decimales
        distractores:
          - valor: '0.14'
            mensaje: |
              Signo cambiado. El segundo miembro lleva $-7e^{5x}$, así que
              $C = -7/50$ es negativo.
          - valor: '-0.28'
            mensaje: |
              Parece que has dividido entre 25 en vez de entre 50. Al sustituir
              $Ce^{5x}$ en $y''+25y$ sale $25C + 25C = 50C$.
        pista: |
          $C = -7/50$. Divide.
        desarrollo: |
          $$
          (Ce^{5x})'' + 25\,Ce^{5x} = 25Ce^{5x} + 25Ce^{5x} = 50Ce^{5x} = -7e^{5x}
          $$

          $$
          C = -\frac{7}{50} = -0{,}14
          $$

          Aquí **no** hay resonancia porque $r=5$ no es raíz de $r^{2}+25=0$:
          las raíces son imaginarias puras.
      - tipo: justificar
        pregunta: |
          Ordena la solución. Una pieza es falsa.
        piezas:
          - texto: 'La característica $r^{2}+25=0$ da $r=\pm 5i$, luego $y_h = C_1\cos 5x + C_2\,\text{sen}\,5x$.'
          - texto: 'El trozo $4\cos 5x$ **resuena** con la homogénea, así que se prueba $x(A\cos 5x+B\,\text{sen}\,5x)$.'
          - texto: 'El trozo $-7e^{5x}$ no resuena, así que basta $Ce^{5x}$.'
          - texto: 'Resolviendo, $A=0$, $B=2/5$ y $C=-7/50$.'
          - texto: 'Como el segundo miembro tiene dos trozos, hay que multiplicar los dos por $x$.'
            trampa: true
            mensaje: |
              Solo se multiplica el trozo que resuena. La exponencial $e^{5x}$ no
              está en la homogénea —las raíces son $\pm 5i$, no $5$— así que
              multiplicarla por $x$ complicaría la cuenta sin necesidad y daría
              un sistema incompatible.
    resolucion: |
      **El ejercicio existe para el caso de resonancia**, que es el fallo más
      común del bloque y se detecta antes de calcular nada.

      **La homogénea.** $r^{2}+25=0$ da $r=\pm 5i$:

      $$
      y_h = C_1\cos 5x + C_2\,\text{sen}\,5x
      $$

      **El aviso.** El segundo miembro trae $4\cos 5x$, y $\cos 5x$ **ya está**
      en la homogénea. Probar $A\cos 5x + B\,\text{sen}\,5x$ daría $0 = 4\cos 5x$.

      **La cura: multiplicar por $x$.**

      $$
      y_{p1} = x\bigl(A\cos 5x + B\,\text{sen}\,5x\bigr)
      \qquad\Longrightarrow\qquad
      A=0,\; B=\tfrac{2}{5}
      $$

      **El otro trozo no resuena**, porque $5$ no es raíz de la característica:

      $$
      y_{p2} = Ce^{5x}
      \qquad\Longrightarrow\qquad
      50C = -7,\; C = -\tfrac{7}{50}
      $$

      **La solución general:**

      $$
      \boxed{\;y = C_1\cos 5x + C_2\,\text{sen}\,5x + \tfrac{2}{5}\,x\,\text{sen}\,5x - \tfrac{7}{50}e^{5x}\;}
      $$

      > **El control que evita el callejón.** Antes de escribir el ensayo,
      > compara **cada trozo** del segundo miembro con las raíces de la
      > característica. Aquí uno resuena y el otro no, y tratarlos igual —de
      > cualquiera de las dos maneras— lleva a un sistema sin solución.

      <figure class="figura-examen">
      <svg viewBox="0 0 340 250" role="img" width="340" height="250"
           aria-labelledby="f-resonancia-t f-resonancia-d">
        <title id="f-resonancia-t">La solución resonante, cuya amplitud crece linealmente, frente a una acotada</title>
        <desc id="f-resonancia-d">Dos ondas comparten el dibujo. Una, dibujada con trazo fino, es un coseno normal que oscila siempre entre los mismos dos valores. La otra, con trazo grueso, oscila con la misma frecuencia pero cada vez más alto y más bajo: su amplitud crece. Dos rectas de puntos que salen del origen abriéndose en uve envuelven a esa segunda onda y enseñan que la amplitud crece proporcionalmente a x. Esa es la marca de la resonancia.</desc>
