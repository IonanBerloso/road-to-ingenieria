  - id: seis-homogeneas-y-el-cambio-que-las-separa
    titulo: Seis homogéneas, y la que se resuelve mejor al revés
    fuente: >-
      Ejercicio 9.6 · Problemas complementarios, tema 9 · Cálculo, UPV/EHU. El
      apartado (f) es de la convocatoria 2019/2020 7E.
    nivel: practica
    enunciado: |
      Resolver las siguientes EDOs homogéneas:

      (a) $(2x+y)dx - x\,dy = 0$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (d) $y' = \dfrac{y}{x}-\dfrac{x}{y}$

      (b) $xy' = y\ln\dfrac{y}{x}$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (e) $\left(x^{3}+xy^{2}\right)y' = y^{3}$

      (c) $\left(xy+y^{2}\right)y' = y^{2}$
      &nbsp;&nbsp;&nbsp;&nbsp;
      (f) $y' = \dfrac{2xy}{3x^{2}-y^{2}}$, $y(1)=2$
    pide: La solución de cada una, particular en (f).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se reconoce una EDO homogénea, y qué cambio la separa?
        opciones:
          - texto: >-
              Que $y'$ se pueda escribir como función de $y/x$ sola; y el
              cambio es $y=vx$, que la vuelve separable
            correcta: true
            mensaje: |
              Eso es. Y hay una comprobación rápida: si al sustituir $x$ por
              $tx$ e $y$ por $ty$ la expresión de $y'$ no cambia, es
              homogénea.
          - texto: >-
              Que el segundo miembro sea cero
            mensaje: |
              Eso es «homogénea» en el sentido de las **lineales**. Aquí la
              palabra significa otra cosa: que todos los términos tienen el
              mismo grado.
          - texto: >-
              Que los coeficientes sean constantes
            mensaje: |
              Los coeficientes constantes son el caso de las lineales de orden
              $n$. Estas tienen $x$ e $y$ por todas partes.

      - tipo: calcular
        titulo: La curva del apartado (a) que pasa por el origen
        pregunta: |
          La solución de (a) es $y = 2x\ln\lvert x\rvert + Cx$. Para la que
          pasa por $(1,0)$, ¿cuánto vale $y$ en $x=e$?
        respuesta:
          tipo: numero
          valor: '5.4366'
          tolerancia: 0.006
          formato: en forma exacta (2e) o con cuatro decimales
        distractores:
          - valor: '2.7183'
            mensaje: |
              Te has dejado el $2$. En $x=e$, $\ln x = 1$, así que
              $y = 2e\cdot1 = 2e$.
          - valor: '0'
            mensaje: |
              $0$ es el valor en $x=1$, donde el logaritmo se anula. La
              solución no es constante.
        pista: |
          $y(1)=0$ da $C=0$, y en $x=e$ el logaritmo vale $1$.
        desarrollo: |
          $$
          y(1) = 2\cdot1\cdot\ln 1 + C = C = 0
          $$

          $$
          y(e) = 2e\ln e = 2e \approx 5{,}4366
          $$

      - tipo: calcular
        titulo: La constante del apartado (f)
        pregunta: |
          Con el cambio $x=vy$ la solución de (f) queda
          $x^{2}-y^{2}=Cy^{3}$. Con $y(1)=2$, ¿cuánto vale $C$?
        respuesta:
          tipo: numero
          valor: '-0.375'
          tolerancia: 0.002
          formato: en forma exacta (-3/8) o con tres decimales
        distractores:
          - valor: '0.375'
            mensaje: |
              El signo. En $(1,2)$, $x^{2}-y^{2} = 1-4 = -3$, y $y^{3}=8$: el
              cociente es negativo.
          - valor: '-3'
            mensaje: |
              $-3$ es $x^{2}-y^{2}$, sin dividir entre $y^{3}=8$.
        pista: |
          $C = \dfrac{x^{2}-y^{2}}{y^{3}}$ en el punto $(1,2)$.
        desarrollo: |
          $$
          C = \frac{1-4}{8} = -\frac38 = -0{,}375
          $$

          Y por eso el boletín escribe la solución como
          $\left\lvert x^{2}-y^{2}\right\rvert = \tfrac38\left\lvert
          y^{3}\right\rvert$: en valor absoluto, para no arrastrar el signo.

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El cambio $y=vx$ convierte una homogénea en separable, porque
              $y'=v+xv'$ y todo lo demás pasa a depender solo de $v$.
          - texto: >-
              En (c) y en (f) conviene el cambio al revés, $x=vy$: son las que
              se simplifican mirando $x$ como función de $y$.
          - texto: >-
              (a) y (c) además son **lineales** si se mira la variable
              adecuada: (a) en $y$ y (c) en $x$.
          - texto: >-
              Y como el cambio $y=vx$ siempre funciona, no hace falta
              plantearse cuál de las dos variables despejar.
            trampa: true
            mensaje: |
              Funciona, pero puede dar una integral mucho peor. En (c), con
              $y=vx$ sale una integral con logaritmos encadenados; mirándola
              como $x'(y)$ es una **lineal de primer orden** que se resuelve
              con factor integrante en tres líneas. Elegir la variable es
              parte del método.
        veredicto: |
          Antes de lanzarse con $y=vx$, dos preguntas: ¿es lineal en alguna de
          las dos variables? y ¿cuál de los dos cambios deja la integral más
          fácil? Contestarlas ahorra la mitad del trabajo en tres de estos
          seis apartados.
    resolucion: |
      **Los seis resultados.**

      | apartado | solución |
      |---|---|
      | (a) | $y = 2x\ln\lvert x\rvert + Cx$ |
      | (b) | $y = xe^{1+Cx}$ |
      | (c) | $x = y\ln\lvert y\rvert + Cy$ |
      | (d) | $y = \pm x\sqrt{C-2\ln\lvert x\rvert}$ |
      | (e) | $y = Ce^{-y^{2}/(2x^{2})}$ |
      | (f) | $\left\lvert x^{2}-y^{2}\right\rvert = \tfrac38\left\lvert y^{3}\right\rvert$ |

      ### 1 · El cambio, y por qué funciona

      Si $y' = F(y/x)$, con $y=vx$ sale $y'=v+xv'$ y

      $$
      v + xv' = F(v)
      \;\Longrightarrow\;
      \frac{dv}{F(v)-v} = \frac{dx}{x}
      $$

      Separable siempre.

      ### 2 · Los dos atajos

      **(a) es lineal en $y$.** Escrita $y'-\tfrac{y}{x}=2$, el factor
      integrante $\tfrac1x$ la resuelve en dos líneas:
      $\left(\tfrac{y}{x}\right)' = \tfrac2x$.

      **(c) es lineal en $x$.** Dividiendo entre $y^{2}$ y mirando $x$ como
      función de $y$:

      $$
      \frac{dx}{dy} - \frac{x}{y} = 1
      \;\Longrightarrow\;
      \left(\frac{x}{y}\right)' = \frac1y
      \;\Longrightarrow\;
      x = y\ln\lvert y\rvert + Cy
      $$

      Que es simétrico del anterior, con los papeles cambiados.

      ### 3 · La comprobación en (f)

      Con $y(1)=2$: $\lvert 1-4\rvert = 3$ y
      $\tfrac38\lvert 8\rvert = 3$. Cuadra.

      **Lo que hay que llevarse.** Homogénea significa **que solo depende del
      cociente $y/x$**, y eso es lo que hace que un solo cambio la separe
      siempre. Pero antes de aplicarlo, mirar si la ecuación es lineal en $x$
      o en $y$: en tres de estos seis, ese atajo ahorra la mitad del trabajo.

