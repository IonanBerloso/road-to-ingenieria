        <desc id="f-raices-reales-d">Tres recuadros. En el primero, dos curvas que bajan hacia el eje horizontal y se quedan pegadas a él: son exponenciales de exponente negativo, y la solución se apaga. En el segundo, una curva que baja y otra que se dispara hacia arriba: hay una raíz positiva, y esa manda, de modo que la solución crece sin tope. En el tercero, una curva que se acerca a una recta horizontal distinta de cero: hay una raíz nula, y el sumando constante que produce no desaparece nunca.</desc>
