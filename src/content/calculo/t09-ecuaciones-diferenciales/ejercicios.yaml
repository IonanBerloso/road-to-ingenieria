  - id: sacarle-informacion-a-una-edo-sin-resolverla
    titulo: Tres EDOs de las que hay que hablar sin resolverlas
    fuente: >-
      Ejercicios 9.2, 9.3 y 9.4 · Problemas complementarios, tema 9 · Cálculo,
      UPV/EHU. El 9.2 es de la convocatoria 2018/2019 3E AT y el 9.3 de la
      2019/2020 4E AT.
    nivel: practica
    enunciado: |
      **9.2** Sea $y(x)$ la solución de la EDO $y' = x^{2}-y$.

      &nbsp;&nbsp;(a) Sin resolver la EDO, estudiar los intervalos de
      crecimiento/decrecimiento y concavidad/convexidad de la función $y$.

      &nbsp;&nbsp;(b) Calcular el polinomio de Taylor de orden 2 de la función
      $y(x)$ en el punto $a=0$, sabiendo que $y(0)=1$.

      **9.3** Sea $y(x)$ una función solución de la EDO $xy'-y = x^{3}$. Sin
      resolver la EDO, estudiar los intervalos de crecimiento y decrecimiento
      de $y$.

      **9.4** Aproximar la solución de la EDO $y'' = yx+x^{2}+1$ donde
      $y(0)=1$, $y'(0)=2$, mediante el polinomio de McLaurin de orden 3.
    pide: El estudio cualitativo y los dos polinomios.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se obtiene $y''$ sin conocer $y$, a partir de
          $y'=x^{2}-y$?
        opciones:
          - texto: >-
              Derivando la propia ecuación: $y'' = 2x-y'$, y sustituyendo
              $y'$ otra vez queda $y''=2x-x^{2}+y$
            correcta: true
            mensaje: |
              Eso es. La ecuación es una máquina de fabricar derivadas: cada
              vez que se deriva, se obtiene la siguiente en función de las
              anteriores. Es todo lo que hace falta para un Taylor.
          - texto: >-
              Hay que resolver la EDO primero
            mensaje: |
              El enunciado dice explícitamente que no. Y no hace falta:
              derivar la ecuación da $y''$ directamente.
          - texto: >-
              $y''$ es la derivada de $x^{2}$, o sea $2x$
            mensaje: |
              Falta derivar el $-y$, que da $-y'$. Ese término es justo el que
              acopla la ecuación consigo misma.

      - tipo: calcular
        titulo: El coeficiente de x² en el Taylor de 9.2
        pregunta: |
          Con $y(0)=1$, ¿cuánto vale el coeficiente de $x^{2}$ en el polinomio
          de Taylor de orden $2$ de $y$ en $a=0$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: en forma exacta (1/2) o con un decimal
        distractores:
          - valor: '1'
            mensaje: |
              $y''(0)=1$, sí, pero el coeficiente de Taylor es
              $\tfrac{y''(0)}{2!}$: hay que dividir entre $2$.
          - valor: '-1'
            mensaje: |
              $-1$ es $y'(0)$, el coeficiente de $x$. El de $x^{2}$ sale de la
              segunda derivada.
        pista: |
          $y'(0) = 0-1 = -1$, y $y''=2x-y'$, así que $y''(0)=0-(-1)=1$. El
          coeficiente es $\tfrac{y''(0)}{2}$.
        desarrollo: |
          $$
          y'(0) = 0^{2}-1 = -1
          $$

          $$
          y'' = 2x-y' \;\Longrightarrow\; y''(0) = 0-(-1) = 1
          $$

          $$
          P_2(x) = 1 - x + \frac{1}{2}x^{2}
          $$

      - tipo: calcular
        titulo: El coeficiente de x³ en el McLaurin de 9.4
        pregunta: |
          Para $y'' = yx+x^{2}+1$ con $y(0)=1$, $y'(0)=2$, ¿cuánto vale el
          coeficiente de $x^{3}$ en el polinomio de McLaurin de orden $3$?
        respuesta:
          tipo: numero
          valor: '0.1667'
          tolerancia: 0.001
          formato: en forma exacta (1/6) o con cuatro decimales
        distractores:
          - valor: '1'
            mensaje: |
              $y'''(0)=1$, pero el coeficiente lleva $3!=6$ en el
              denominador.
          - valor: '0.5'
            mensaje: |
              $\tfrac12$ es el coeficiente de $x^{2}$, que sale de
              $\tfrac{y''(0)}{2!}$ con $y''(0)=1$.
        pista: |
          $y''' = y'x+y+2x$, y en $x=0$ eso vale $y(0)=1$. El coeficiente es
          $\tfrac{y'''(0)}{3!}$.
        desarrollo: |
          $$
          y''(0) = 1\cdot0+0+1 = 1
          $$

          $$
          y''' = y'x + y + 2x \;\Longrightarrow\; y'''(0) = 0+1+0 = 1
          $$

          $$
          P_3(x) = 1 + 2x + \frac{x^{2}}{2} + \frac{x^{3}}{6}
          $$

      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              La EDO da $y'$ en función de $x$ e $y$, así que el signo de $y'$
              se lee comparando $y$ con la curva $y=x^{2}$ en el caso 9.2.
          - texto: >-
              Derivando la EDO se obtiene $y''$ sin resolver nada, y con eso se
              estudia la concavidad y se construye el Taylor.
          - texto: >-
              En 9.3, despejando, $y'=\tfrac{y+x^{3}}{x}$, y el signo depende
              de dónde esté $y$ respecto de $-x^{3}$ y del signo de $x$.
          - texto: >-
              Y como el polinomio de Taylor aproxima la solución, sirve igual
              de bien lejos del punto donde se ha calculado.
            trampa: true
            mensaje: |
              Un Taylor de orden bajo solo aproxima **cerca** del punto. El
              $P_2$ de 9.2 vale para $x$ pequeños; en $x=3$ daría
              $1-3+4{,}5=2{,}5$, y no hay ninguna garantía de que la solución
              esté ahí. Los polinomios de McLaurin son aproximaciones locales,
              y decirlo es parte de la respuesta.
        veredicto: |
          Una EDO es una fórmula para $y'$, y derivándola se obtiene $y''$,
          $y'''$ y todas las que hagan falta. Con eso se puede estudiar la
          gráfica y aproximar la solución **sin resolverla**, que es
          exactamente lo que piden estos tres enunciados.
    resolucion: |
      ### 1 · 9.2 · $y'=x^{2}-y$

      **El estudio cualitativo.** La ecuación dice que $y'>0$ exactamente
      donde $y<x^{2}$: la parábola $y=x^{2}$ separa la región donde la
      solución crece de la región donde decrece. Derivando,

      $$
      y'' = 2x-y' = 2x-x^{2}+y
      $$

      así que la solución es convexa donde $y > x^{2}-2x$.

      **El Taylor.** Con $y(0)=1$: $y'(0)=-1$, $y''(0)=1$,

      $$
      P_2(x) = 1-x+\frac{x^{2}}{2}
      $$

      ### 2 · 9.3 · $xy'-y=x^{3}$

      $$
      y' = \frac{y+x^{3}}{x}
      $$

      El signo depende de dos cosas: dónde está $y$ respecto de $-x^{3}$ y el
      signo de $x$.

      | región | $y+x^{3}$ | $x$ | $y'$ |
      |---|---|---|---|
      | $x>0$, $y>-x^{3}$ | $+$ | $+$ | crece |
      | $x>0$, $y<-x^{3}$ | $-$ | $+$ | decrece |
      | $x<0$, $y>-x^{3}$ | $+$ | $-$ | decrece |
      | $x<0$, $y<-x^{3}$ | $-$ | $-$ | crece |

      La cúbica $y=-x^{3}$ es la frontera, y sobre ella $y'=0$. Es la misma
      ecuación del 9.9(f), donde sí se resuelve: $y=\tfrac{x^{3}}{2}+Cx$.

      ### 3 · 9.4 · $y''=yx+x^{2}+1$

      $$
      y(0)=1, \quad y'(0)=2, \quad y''(0)=1, \quad y'''(0)=1
      $$

      $$
      P_3(x) = 1+2x+\frac{x^{2}}{2}+\frac{x^{3}}{6}
      $$

      **Lo que hay que llevarse.** Estos tres apartados son los que más caen de
      todo el tema en los controles cortos, y ninguno pide resolver nada. La
      técnica es una sola: **derivar la ecuación tantas veces como haga falta**
      y evaluar en el punto. Y el aviso: el polinomio aproxima cerca, no lejos.

