# La Colección de ejercicios de Expresión Gráfica como DATOS: los 55, en el
# orden del PDF (auditoría del 1 de octubre de 2026).
#
# Cada página de los ejercicios 1 a 51 se titula «EJERCICIO N - (SDxx)»: el
# número es el de la colección y el código SD es el de la lámina. Los 52 a 55
# son hojas de varios apartados, bilingües, y solo el 54 se titula examen.
#
# `pide` es nuestro: una línea que resume el enunciado impreso, para
# encontrar el ejercicio. El enunciado entero va en su ejercicio, cuando
# existe. Si un ejercicio se corrige en el sitio, y dónde, no se escribe aquí:
# lo calcula la página desde los ejercicios que existen (Regla 0).

titulo: Colección de ejercicios

fuente: «Expresión Gráfica · Geometría descriptiva. Sistema diédrico directo · Colección de ejercicios», Dpto. de Expresión Gráfica y Proyectos de Ingeniería, UPV/EHU. 66 páginas; la de 2025-26, que es la que hay en eGela.

