      <figcaption>

      Redibujada del PDF del examen. La sección, como en el original, no
      está a escala: sus paredes se dibujan más gruesas que t; las cotas son
      las impresas.

      </figcaption>
      </figure>

      **Notas nuestras.** Un par aplicado justo en una rótula no dice sobre
      cuál de los dos tramos actúa. Aquí se toma sobre el extremo de AB; la
      otra lectura, sobre el extremo de BCD, se resuelve también al final y
      vale en los pasos. Los signos son los del tema 7: el cortante es positivo si las fuerzas a la
      izquierda del corte suben, y el flector, si tracciona la fibra de
      abajo. La sección tiene espesor $t$ en todas sus paredes, 12$t$ de
      ancho y 15$t$ de alto por fuera; $\sigma_{on}$ es la tensión normal
      admisible, la misma a tracción y a compresión.
    pide: >-
      a) Los diagramas de cortantes y de flectores, en función de q0 y a.
      b) El espesor t de la sección, en mm, para que la tensión normal máxima
      no pase de σon.
    pasos:
      - tipo: reconocer
        pregunta: |
          La viga tiene cuatro reacciones (A, C y las dos de D) y una rótula en
          B. ¿Por dónde se empieza?
        opciones:
          - texto: >-
              Por el tramo AB solo: la rótula no le pasa momento a BCD, así
              que los momentos en B de todo lo que actúa sobre AB (el par
              incluido, si se toma sobre AB) suman cero, y dan $R_A$ sin que
              entre la fuerza que le pasa la rótula
            correcta: true
            mensaje: |
              Eso es. La rótula da la cuarta ecuación: no transmite momento de
              un tramo al otro. Con el par sobre el extremo de AB,
              $-R_A\,a + q_0a^{2} = 0$, con una sola incógnita (con el par
              sobre BCD no entra aquí, y $R_A = 0$). Con $R_A$, el equilibrio
              del nudo B dice qué fuerza le llega a BCD, y BCD se resuelve como
              una viga con dos apoyos.
          - texto: >-
              Por las tres ecuaciones de equilibrio de la viga entera
            mensaje: |
              Son tres ecuaciones para cuatro incógnitas: $R_A$, $R_C$ y las
              dos de D. Falta la de la rótula, que no transmite momento de un
              tramo al otro, y es la que hace la viga isostática.
          - texto: >-
              Por el tramo BCD, que es el que lleva la carga repartida
            mensaje: |
              BCD tiene tres incógnitas verticales, $R_C$, $R_D$ y la fuerza
              que le pasa la rótula, y solo dos ecuaciones útiles. Hace falta
              saber antes qué le llega de AB.
          - texto: >-
              Por la sección: el espesor sale de la tensión admisible antes que
              los diagramas
            mensaje: |
              La tensión depende del flector máximo, y ese sale de los
              diagramas: el orden es el del enunciado.
      - tipo: calcular
        titulo: La reacción en C
        pregunta: |
          Aquí se resuelve con el par sobre el extremo de AB; con el par sobre
          BCD, la respuesta también vale. ¿Cuánto vale la reacción en C, hacia
          arriba, en unidades de $q_0a$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número, en unidades de q0a
        tambienValen:
          - valor: '3.5'
            mensaje: |
              Es la reacción con el par sobre el extremo de BCD: AB queda
              descargado, $R_A = 0$, la fuerza $q_0a$ y el par pasan a BCD y
              sus momentos en D dan $R_C = 3{,}5\,q_0a$ y $R_D = -1{,}5\,q_0a$.
              Es la otra lectura de la figura, y vale.
        distractores:
          - valor: '2.5'
            mensaje: |
              Es la reacción sin el par: AB no carga nada, la fuerza $q_0a$ de
              B pasa entera a BCD y los momentos en D dan $R_C = 2{,}5\,q_0a$.
              El par $q_0a^{2}$ sí cuenta, en el tramo sobre el que actúa.
          - valor: '4.5'
            mensaje: |
              Has tomado el par en sentido horario. La flecha de la figura sube
              por la derecha de B y acaba arriba a la izquierda: es antihorario.
              Horario sobre AB daría $R_A = -q_0a$, y a BCD le llegarían
              $2q_0a$.
          - valor: '1.5'
            mensaje: |
              Has puesto el par sobre BCD y en sentido horario. La flecha de la
              figura es antihoraria: con el par sobre BCD, $R_C = 3{,}5\,q_0a$.
        pista: |
          AB aislado, momentos en B: $R_A\,a = q_0a^{2}$. Luego, el nudo B:
          ¿qué fuerza le llega a BCD?
        desarrollo: |
          Momentos en B del tramo AB (antihorario positivo), con el par sobre
          su extremo:

          $$
          -R_A\,a + q_0a^{2} = 0 \;\Longrightarrow\; R_A = q_0a
          $$

          AB no tiene más cargas, así que la rótula tira de él hacia abajo con
          $q_0a$; y AB empuja la rótula hacia arriba con $q_0a$, justo lo que
          equilibra la fuerza $q_0a$ aplicada en B. A BCD no le llega nada:
          solo lleva la repartida, $q_0a$ en total, centrada en CD.

          $$
          R_C = R_D = \tfrac12\,q_0a
          $$
      - tipo: calcular
        titulo: El flector máximo
        pregunta: |
          Aquí se resuelve con el par sobre el extremo de AB; con el par sobre
          BCD, la respuesta también vale. ¿Cuánto vale el flector de mayor
          valor absoluto, con su signo (positivo si tracciona la fibra de
          abajo), en unidades de $q_0a^{2}$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.005
          formato: un número con su signo, en unidades de q0a²
        tambienValen:
          - valor: '-2'
            mensaje: |
              Es el máximo con el par sobre el extremo de BCD: el flector vale
              $-q_0a^{2}$ justo a la derecha de B, baja en recta hasta
              $-2q_0a^{2}$ en C (tracciona arriba) y vuelve a cero en D. Es la
              otra lectura, y vale.
              Si has llegado aquí con el par sobre AB en sentido horario, el
              número coincide por casualidad: la flecha es antihoraria (mira
              el paso de la reacción en C).
        distractores:
          - valor: '-1'
            mensaje: |
              Es el máximo sin el par: la fuerza $q_0a$ pasa a BCD, el voladizo
              BC la lleva y en C el flector es $-q_0a\cdot a$. El par cambia el
              resultado.
          - valor: '0.125'
            mensaje: |
              Es el máximo del tramo CD, $q_0a^{2}/8$, en su centro. Pero en AB
              el flector sube en recta, $M = R_A\,x$, hasta $q_0a^{2}$ justo a
              la izquierda de B: ocho veces más.
        pista: |
          En AB, $M(x) = R_A\,x$; mira qué hace el par al cruzar B, y el máximo
          de la parábola de CD.
        desarrollo: |
          $$
          M(x) = R_A\,x = q_0a\,x \qquad (0 < x < a)
          $$

          Justo a la izquierda de B vale $q_0a^{2}$; el par antihorario lo baja
          a cero en la rótula, como debe ser. En BC no hay cortante ni flector.
          En CD, con $R_D = q_0a/2$, el flector es la parábola de una viga
          apoyada, con su máximo, $q_0a^{2}/8$, en el centro. El mayor es
          $M = q_0a^{2}$, positivo: tracciona la fibra de abajo.
      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de cortantes y de flectores**, alineados
          con la viga, con el par sobre el extremo de AB, con sus valores en
          A, B, C y D y el máximo de CD.
        comprueba:
          - punto: |
              **Cortante**: $q_0a$ constante en AB; cero en BC; en C salta a
              $q_0a/2$ y baja en recta hasta $-q_0a/2$ en D, cortando el cero
              en el centro de CD.
            porque: |
              Cada fuerza puntual es un salto del cortante (la de B lo baja
              $q_0a$, la de C lo sube $q_0a/2$), y la repartida, una pendiente
              $-q_0$ (ec. 7.14).
          - punto: |
              **Flector en AB**: recta de cero en A a $q_0a^{2}$ justo a la
              izquierda de B.
            porque: |
              Su pendiente es el cortante, $q_0a$ (ec. 7.15), y A es un apoyo
              de extremo: el flector empieza en cero.
          - punto: |
              **El salto en B**: de $q_0a^{2}$ a cero, lo que vale el par, y
              cero en toda BC.
            porque: |
              Un par concentrado es un salto del flector. La rótula no pasa
              momento a BCD: el flector vale el par en el extremo de AB y cero
              en el arranque de BCD, y sin cortante en BC sigue nulo hasta C.
          - punto: |
              **Flector en CD**: parábola de cero en C a cero en D, con su
              máximo, $q_0a^{2}/8$, en el centro, donde el cortante se anula.
            porque: |
              Es la viga apoyada con carga uniforme: el máximo está donde
              $V = 0$ (ec. 7.15).
        figura: |
          <svg viewBox="0 0 450 344" role="img" width="450" height="344" aria-labelledby="exerm1415-1par-7-la-gerber-con-un-par-en-la-rotula-diagramas-dib-t exerm1415-1par-7-la-gerber-con-un-par-en-la-rotula-diagramas-dib-d">
