      <figcaption>

      Redibujada del PDF del examen. Como en el original, no está a escala:
      el prisma mide a en x y 5a en y. De los cuatro cables se ven dos; los
      otros dos quedan detrás.

      </figcaption>
      </figure>

      **Notas nuestras.** Los cables unen las dos placas, así que miden lo
      mismo que el prisma en $y$, $5a$. Por la simetría, los cuatro llevan la
      misma tensión $\sigma_0$, positiva si tiran.
    pide: >-
      a) La tensión σ0 de los cables, en función de p. b) Las tres tensiones
      principales del prisma, en función de p.
    pasos:
      - tipo: reconocer
        pregunta: |
          La presión es horizontal y los cables son verticales. ¿Por qué
          trabajan los cables?
        opciones:
          - texto: >-
              Por el efecto Poisson: B, comprimido en $x$, quiere alargarse en
              $y$, separa las placas y estira los cables, que tiran de ellas y
              comprimen a B en $y$
            correcta: true
            mensaje: |
              Eso es. Es un problema de compatibilidad: B y los cables se
              alargan lo mismo en $y$, porque las placas son rígidas. Sin
              cables, B se alargaría $\varepsilon_y = \nu p/E = 0{,}1\,p/E$;
              los cables le quitan parte de ese alargamiento.
          - texto: >-
              Están comprimidos: la presión comprime todo el conjunto
            mensaje: |
              Un cable no aguanta compresiones, y aquí no las hay: B se
              **alarga** en $y$, por Poisson, y los cables se estiran con
              él. La presión solo comprime a B, y solo en $x$.
          - texto: >-
              No trabajan: la carga es horizontal y ellos son verticales
            mensaje: |
              Lo serían si B no cambiara de altura. Pero una compresión en $x$
              alarga en $y$ y en $z$ (ec. 4.2), y las placas, rígidas,
              trasladan ese alargamiento a los cables.
          - texto: >-
              Trabajan por el peso de las placas, que cuelgan de ellos
            mensaje: |
              El enunciado dice que se desprecia. Además, la placa de arriba
              apoya en B: si algo la sostiene, es el prisma, no los cables.
      - tipo: calcular
        titulo: La tensión en los cables
        pregunta: |
          ¿Cuánto vale $\sigma_0$, la tensión en cada cable, en unidades de $p$?
        respuesta:
          tipo: numero
          valor: '0.9091'
          tolerancia: 0.001
          formato: un número, en unidades de p
        distractores:
          - valor: '0.0990'
            mensaje: |
              Has dado a los cables el módulo de B, $E$. El enunciado les da
              $10E$: con él, el cable es diez veces más rígido y se lleva
              mucha más tensión.
          - valor: '0.9756'
            mensaje: |
              Has equilibrado B con un solo cable. Son cuatro, dispuestos
              simétricamente: $\sigma_y\,a^{2} = -4\,\sigma_0 A$, y la figura
              solo enseña dos.
          - valor: '-0.9091'
            mensaje: |
              Has tomado la presión como una tracción, $\sigma_x = +p$. Una
              presión empuja las caras hacia dentro: $\sigma_x = -p$, y con
              eso B se alarga en $y$ y los cables tiran.
        pista: |
          Dos ecuaciones: el equilibrio de una placa,
          $\sigma_y\,a^{2} = -4\,\sigma_0 A$, y la compatibilidad,
          $\varepsilon_y$ de B igual a $\sigma_0/(10E)$ del cable.
        desarrollo: |
          Equilibrio de la placa de arriba: B la empuja hacia arriba y los
          cuatro cables tiran hacia abajo,

          $$
          \sigma_y\,a^{2} = -4\,\sigma_0\,\frac{a^{2}}{400}
          \;\Longrightarrow\; \sigma_y = -\frac{\sigma_0}{100}
          $$

          Compatibilidad: B y los cables miden $5a$ y se alargan lo mismo,

          $$
          \frac{\sigma_0}{10E} = \frac{\sigma_y - \nu\,(\sigma_x + \sigma_z)}{E} = \frac{-\sigma_0/100 + 0{,}1\,p}{E}
          $$

          y de ahí $\sigma_0\,(0{,}1 + 0{,}01) = 0{,}1\,p$:

          $$
          \sigma_0 = \frac{10}{11}\,p, \qquad \frac{10}{11} \approx 0{,}9091
          $$
      - tipo: calcular
        titulo: La tensión del prisma en y
        pregunta: |
          ¿Cuánto vale $\sigma_y$ en el prisma, con su signo, en unidades de
          $p$?
        respuesta:
          tipo: numero
          valor: '-0.00909'
          tolerancia: 0.0001
          formato: un número con su signo, en unidades de p
        distractores:
          - valor: '-0.1'
            mensaje: |
              Es la tensión con unos cables que no se estiran nada:
              $\varepsilon_y = 0$ da $\sigma_y = \nu\sigma_x = -0{,}1\,p$. Los
              cables se alargan con B, así que B queda menos comprimido.
          - valor: '0'
            mensaje: |
              Sería así sin cables: B se alargaría libre en $y$. Los cables
              tiran de las placas y las placas aprietan a B: $\sigma_y$ es una
              compresión pequeña, pero no nula.
          - valor: '0.00909'
            mensaje: |
              El signo: las placas **comprimen** a B, porque los cables tiran
              de ellas hacia B. $\sigma_y = -4\,\sigma_0 A/a^{2}$, negativa.
        pista: |
          $\sigma_y = -4\,\sigma_0 A/a^{2} = -\sigma_0/100$.
        desarrollo: |
          $$
          \sigma_y = -\frac{\sigma_0}{100} = -\frac{p}{110}, \qquad -\frac{1}{110} \approx -0{,}00909
          $$

          Es pequeña porque el área de los cuatro cables es la centésima parte
          de la de B: la tensión de los cables es grande, y la fuerza, poca.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La presión comprime B en $x$, $\sigma_x = -p$, y por Poisson B
              tiende a alargarse en $y$: libre, sería
              $\varepsilon_y = 0{,}1\,p/E$.
          - texto: >-
              Las placas son rígidas: B y los cables, de la misma longitud, se
              alargan lo mismo, $\varepsilon_y = \sigma_0/(10E)$.
          - texto: >-
              Equilibrio de una placa: $\sigma_y\,a^{2} = -4\,\sigma_0 A$, así
              que $\sigma_y = -\sigma_0/100$.
          - texto: >-
              Hooke en $y$ da $\sigma_0 = 10p/11$ y
              $\sigma_y = -p/110$; las caras $z$ están libres, $\sigma_z = 0$.
          - texto: >-
              La base es cuadrada, así que por simetría $\sigma_z = \sigma_y$:
              los cables comprimen B igual en $z$ que en $y$.
            trampa: true
            mensaje: |
              «Base cuadrada» solo dice que B mide $a$ en $x$ y en $z$. Las
              placas aprietan a B en $y$, y las caras perpendiculares a $z$
              no tocan nada: $\sigma_z = 0$. B se alarga libre en $z$.
    resolucion: |
      **Por qué trabajan los cables.** La presión comprime B en $x$:
      $\sigma_x = -p$. Por Poisson, B quiere alargarse en $y$ (y en $z$, que
      está libre). Las placas son rígidas y están unidas por los cables: si B
      se alarga en $y$, los cables se estiran lo mismo, tiran de las placas y
      éstas comprimen a B. Hay dos incógnitas, $\sigma_0$ y $\sigma_y$, y dos
      ecuaciones.

      **Equilibrio** de la placa de arriba, con los cuatro cables:

      $$
      \sigma_y\,a^{2} + 4\,\sigma_0\,\frac{a^{2}}{400} = 0
      \;\Longrightarrow\; \sigma_y = -\frac{\sigma_0}{100}
      $$

      **Compatibilidad.** B y los cables miden $5a$ y se alargan lo mismo,
      así que tienen la misma $\varepsilon_y$. Con la ley de Hooke
      generalizada (apuntes del tema 4, ec. 4.2) y $\sigma_z = 0$:

      $$
      \frac{\sigma_0}{10E} = \frac{1}{E}\left[\sigma_y - \nu\,(\sigma_x + \sigma_z)\right] = \frac{1}{E}\left[-\frac{\sigma_0}{100} + 0{,}1\,p\right]
      $$

      **a/ La tensión en los cables:**

      $$
      \sigma_0\left(\frac{1}{10} + \frac{1}{100}\right) = \frac{p}{10}
      \;\Longrightarrow\; \sigma_0 = \frac{10}{11}\,p \approx 0{,}909\,p
      $$

      de tracción, y $\varepsilon_y = \sigma_0/(10E) = p/(11E) \approx 0{,}0909\,p/E$.

      **b/ Las tensiones principales.** Las caras de B no tienen tangenciales
      (las placas y la presión solo empujan en normal), así que $x$, $y$ y $z$
      son direcciones principales:

      $$
      \sigma_x = -p, \qquad \sigma_y = -\frac{p}{110} \approx -0{,}00909\,p, \qquad \sigma_z = 0
      $$

      Ordenadas, $\sigma_1 = \sigma_z = 0$, $\sigma_2 = \sigma_y = -p/110$ y
      $\sigma_3 = \sigma_x = -p$.

      **Comprobación como dos muelles.** B, en $y$, es un muelle de rigidez
      $k_B = E a^{2}/(5a) = Ea/5$; los cuatro cables,
      $k_c = 4\cdot10E\,(a^{2}/400)/(5a) = Ea/50$. Sin cables B se alargaría
      $\delta_0 = 0{,}1\,(p/E)\cdot5a = 0{,}5\,pa/E$; con ellos, los dos
      muelles en serie reparten ese alargamiento y la fuerza entre placas es

      $$
      F = \frac{\delta_0}{1/k_B + 1/k_c} = \frac{0{,}5\,pa/E}{55/(Ea)} = \frac{pa^{2}}{110}
      $$

      que da $\sigma_0 = F/(4A) = 10p/11$ y $\sigma_y = -F/a^{2} = -p/110$,
      lo mismo. El motor del curso (Hooke generalizada y alargamiento de una
      barra) da las mismas dos tensiones.

