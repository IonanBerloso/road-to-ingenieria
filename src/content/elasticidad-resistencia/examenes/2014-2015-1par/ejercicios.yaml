      <line x1="540" y1="122.5" x2="540" y2="265" stroke="var(--ink)" stroke-width="1.4"/><polygon points="540,272 536.5,264 543.5,264" fill="var(--ink)"/>
      <text x="650" y="114.5" font-size="15" fill="var(--ink)" font-style="italic">z</text>
      <text x="549" y="268" font-size="15" fill="var(--ink)" font-style="italic">y</text>
