      - tipo: calcular
        titulo: El centro de gravedad de la sección
        pregunta: |
          En la sección (espesor $t$ en todas las paredes, 12$t$ de ancho y
          15$t$ de alto por fuera), ¿cuánto vale $\overline{y}$, la distancia
          de G al borde de arriba, en unidades de $t$?
        respuesta:
          tipo: numero
          valor: '5.75'
          tolerancia: 0.01
          formato: un número, en unidades de t
        distractores:
          - valor: '7.5'
            mensaje: |
              Es la mitad de la altura, $15t/2$. La sección no es simétrica en
              vertical: el ala de arriba sube G hacia ella.
          - valor: '9.25'
            mensaje: |
              Es la distancia de G al borde de **abajo**, $15t - 5{,}75t$. Te
              la pedían desde arriba.
        pista: |
          Ala de arriba: $12t\times t$, con su centro a $0{,}5t$ del borde de
          arriba. Cada alma: $14t\times t$, con su centro a $1t + 7t = 8t$.
        desarrollo: |
          $$
          \overline{y} = \frac{12t^{2}\cdot0{,}5t + 2\cdot14t^{2}\cdot8t}{12t^{2} + 2\cdot14t^{2}} = \frac{230\,t^{3}}{40\,t^{2}} = 5{,}75\,t
          $$

          En unidades de $t$: $(6 + 224)/40 = 5{,}75$. G está a $5{,}75t$ del
          borde de arriba y a $9{,}25t$ del de abajo.
      - tipo: calcular
        titulo: El momento de inercia de la sección
        pregunta: |
          ¿Cuánto vale $I_z$, el momento de inercia respecto al eje $z$ que
          pasa por G, en unidades de $t^{4}$?
        respuesta:
          tipo: numero
          valor: '930.83'
          tolerancia: 0.5
          formato: un número, en unidades de t⁴
        distractores:
          - valor: '458.33'
            mensaje: |
              Has sumado los momentos de inercia de cada rectángulo respecto a
              su propio centro, sin Steiner: $1 + 2\cdot228{,}67$. Cada uno hay
              que llevarlo al eje por G, con su área por la distancia al
              cuadrado.
          - valor: '1088.33'
            mensaje: |
              Es el rectángulo de fuera menos el hueco,
              $12\cdot15^{3}/12 - 10\cdot14^{3}/12$, cada uno respecto a su
              propio centro. Ninguno de los dos centros es G: hay que llevarlos
              a G con Steiner antes de restar.
          - valor: '2253.33'
            mensaje: |
              Es el momento de inercia respecto al borde de arriba. El de la
              flexión es respecto al eje por G:
              $I_z = 2253{,}33 - 40\cdot5{,}75^{2}$.
        pista: |
          Steiner en cada rectángulo: $I = \tfrac{1}{12}bh^{3} + A\,d^{2}$, con
          $d$ la distancia de su centro a G.
        desarrollo: |
          En unidades de $t$, con las distancias de cada centro a G,
          $5{,}75 - 0{,}5$ para el ala y $8 - 5{,}75$ para las almas:

          $$
          I_z = \frac{12\cdot1^{3}}{12} + 12\,(5{,}75 - 0{,}5)^{2} + 2\cdot\frac{1\cdot14^{3}}{12} + 28\,(8 - 5{,}75)^{2} = 930{,}83
          $$

          es decir, $I_z = 930{,}83\,t^{4}$.
      - tipo: calcular
        titulo: El espesor
        pregunta: |
          Aquí se resuelve con el par sobre el extremo de AB; con el par sobre
          BCD, la respuesta también vale. Con $a$ = 4 m, $q_0$ = 10 N/mm y
          $\sigma_{on}$ = 200 MPa, ¿cuánto vale el espesor $t$ mínimo, en mm?
        respuesta:
          tipo: numero
          valor: '19.96'
          tolerancia: 0.05
          formato: un número, en mm
        tambienValen:
          - valor: '25.15'
            mensaje: |
              Es el espesor con el par sobre el extremo de BCD: el flector
              máximo es $-2q_0a^{2}$, en C, el doble, y $t$ crece con la raíz
              cúbica de 2. La fibra que manda sigue siendo la de abajo, ahora
              comprimida. Es la otra lectura, y vale.
              Si has llegado aquí con el par sobre AB en sentido horario, el
              número coincide por casualidad: la flecha es antihoraria (mira
              el paso de la reacción en C).
        distractores:
          - valor: '9.98'
            mensaje: |
              Has dimensionado con el máximo de CD, $q_0a^{2}/8$. El flector
              mayor está a la izquierda de B, $q_0a^{2}$, ocho veces más: $t$
              sale el doble.
          - valor: '17.03'
            mensaje: |
              Has usado la fibra de arriba, a $5{,}75t$ de G. La que está más
              lejos es la de abajo, a $9{,}25t$, y es la que llega antes a
              $\sigma_{on}$.
          - valor: '0.1996'
            mensaje: |
              Has metido $a$ en metros con $q_0$ en N/mm: $10\cdot4^{2} = 160$
              no son N·mm. Pasa $a$ a 4000 mm antes de calcular el flector.
        pista: |
          $\sigma_{max} = M_{max}/W_z$, con $W_z = I_z/y_{max}$ e $y_{max}$ la
          fibra más alejada de G (ecs. 9.24 y 9.25); todo en N y mm.
        desarrollo: |
          $$
          M_{max} = q_0a^{2} = 10\cdot4000^{2} = 1{,}6\cdot10^{8}\ \text{N}\cdot\text{mm}
          $$

          La fibra más alejada de G es la de abajo, a $9{,}25t$:
          $W_z = I_z/y_{max} = 930{,}83\,t^{4}/(9{,}25\,t)$, y
          $930{,}83/9{,}25 = 100{,}63$, así que $W_z = 100{,}63\,t^{3}$
          (ec. 9.24). Con la ec. 9.25, $W_z = M_{max}/\sigma_{on}$:

          $$
          t^{3} = \frac{1{,}6\cdot10^{8}}{100{,}63\cdot200} = 7950\ \text{mm}^{3}, \qquad t = \sqrt[3]{7950} = 19{,}96\ \text{mm}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Tramo AB, momentos en B, con el par sobre su extremo:
              $R_A = q_0a$.
          - texto: >-
              Nudo B: AB empuja la rótula hacia arriba con $q_0a$ y equilibra la
              fuerza aplicada; a BCD no le llega nada, y
              $R_C = R_D = q_0a/2$.
          - texto: >-
              El flector sube en recta hasta $q_0a^{2}$ a la izquierda de B y
              el par lo baja a cero en la rótula; en CD, parábola con
              $q_0a^{2}/8$.
          - texto: >-
              Sección: $\overline{y} = 5{,}75t$, $I_z = 930{,}83\,t^{4}$; manda
              la fibra de abajo, a $9{,}25t$, y $t = 19{,}96$ mm.
          - texto: >-
              El par en la rótula no entra en ninguna ecuación: la rótula no
              transmite momentos, así que el par se pierde.
            trampa: true
            mensaje: |
              La rótula no transmite momento **entre** los dos tramos, pero el
              par actúa sobre uno de ellos y entra en su ecuación de momentos.
              Sin él, $R_A = 0$, la fuerza pasa a BCD y el máximo sería
              $-q_0a^{2}$ en C: otra viga.
    resolucion: |
      **El planteamiento.** Cuatro reacciones (A y C, verticales; D, fijo,
      dos) y tres ecuaciones de equilibrio: la cuarta es la de la rótula,
      que no transmite momento de un tramo al otro: los momentos en B de lo
      que actúa sobre AB suman cero. Se aplica al tramo AB, que queda con una
      sola incógnita. El par actúa justo en la rótula: se toma sobre el
      extremo de AB, y entonces entra en esa ecuación (al final, la otra
      lectura).

      **Reacciones.** Momentos en B del tramo AB, antihorario positivo:

      $$
      -R_A\,a + q_0a^{2} = 0 \;\Longrightarrow\; R_A = q_0a
      $$

      La rótula tira de AB hacia abajo con $q_0a$, y AB empuja la rótula hacia
      arriba con lo mismo: justo la fuerza $q_0a$ aplicada en B. A BCD no le
      llega nada, y la repartida, $q_0a$ en total y centrada en CD, se reparte
      a medias: $R_C = R_D = q_0a/2$. La suma, $q_0a + q_0a/2 + q_0a/2 = 2q_0a$,
      es la de las cargas.

      **a/ Los diagramas** (tema 7: $dV/dx = -q$ y $dM/dx = V$, ecs. 7.14 y
      7.15):

      | tramo | cortante $V$ | flector $M$ |
      |---|---|---|
      | AB | $q_0a$ | $q_0a\,x$: de 0 a $q_0a^{2}$ |
      | en B | baja $q_0a$, a cero | baja $q_0a^{2}$, a cero (el par) |
      | BC | 0 | 0 |
      | CD ($0 < s < a$ desde C) | $q_0a/2 - q_0 s$ | $\tfrac12 q_0a\,s - \tfrac12 q_0 s^{2}$: máximo $q_0a^{2}/8$ en $s = a/2$ |

