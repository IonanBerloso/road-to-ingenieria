      El flector mayor es $M_{max} = q_0a^{2}$, positivo, justo a la izquierda
      de B: tracciona la fibra de abajo.

      **La sección**, en unidades de $t$ (ala de arriba $12\times1$; dos almas
      de $1\times14$):

      $$
      A = 12 + 2\cdot14 = 40, \qquad
      \overline{y} = \frac{12\cdot0{,}5 + 28\cdot8}{40} = 5{,}75
      $$

      desde el borde de arriba, y $15 - 5{,}75 = 9{,}25$ hasta el de abajo.

      $$
      I_z = \frac{12\cdot1^{3}}{12} + 12\,(5{,}75 - 0{,}5)^{2} + 2\cdot\frac{1\cdot14^{3}}{12} + 28\,(8 - 5{,}75)^{2} = 930{,}83
      $$

      **b/ El espesor.** La tensión normal es máxima en la fibra más alejada de
      G, la de abajo, a $9{,}25t$ (ecs. 9.23 y 9.24):
      $W_z = I_z/y_{max} = 100{,}63\,t^{3}$. Con
      $M_{max} = 10\cdot4000^{2} = 1{,}6\cdot10^{8}\ \text{N}\cdot\text{mm}$ y
      la ec. 9.25:

      $$
      t^{3} = \frac{1{,}6\cdot10^{8}}{100{,}63\cdot200} = 7950\ \text{mm}^{3}, \qquad t = \sqrt[3]{7950} = 19{,}96\ \text{mm}
      $$

      Se toma $t = 20$ mm. Con $t = 19{,}96$ mm, la fibra de arriba, comprimida,
      queda en $-200\cdot\frac{5{,}75}{9{,}25} = -124{,}3$ MPa.

      **La otra lectura: el par sobre el extremo de BCD.** AB queda sin cargas:
      $R_A = 0$, y la rótula le pasa a BCD la fuerza $q_0a$ y el par. Momentos
      en D de BCD, antihorario positivo:

      $$
      -R_C\,a + q_0a\cdot2a + q_0a\cdot\frac{a}{2} + q_0a^{2} = 0
      \;\Longrightarrow\; R_C = 3{,}5\,q_0a, \qquad R_D = 2q_0a - R_C = -1{,}5\,q_0a
      $$

      ($R_D$ tira hacia abajo). En AB, $V = M = 0$. Justo a la derecha de B el
      flector salta a $-q_0a^{2}$, el cortante vale $-q_0a$ en BC y el flector
      baja en recta hasta $-2q_0a^{2}$ en C; en CD el cortante va de
      $2{,}5\,q_0a$ a $1{,}5\,q_0a$, sin anularse, y el flector sube de
      $-2q_0a^{2}$ a cero en D. El máximo es $M = -2q_0a^{2}$, en C, que
      tracciona la fibra de arriba y comprime la de abajo; la de abajo sigue
      siendo la más alejada, y como $\sigma_{on}$ es la misma a tracción y a
      compresión, $t$ crece con la raíz cúbica del flector:
      $t = 19{,}96\cdot\sqrt[3]{2} = 25{,}15$ mm.

      **Comprobación.** El motor del curso resuelve la viga con las dos
      lecturas (con el par en el extremo de AB o en el de BC) y da las mismas
      reacciones, cortantes y flectores; el flector, integrando el cortante
      del motor a lo largo de la viga, también. El motor no tiene secciones
      ni tensiones de flexión: el centro de gravedad, $I_z$ y el espesor
      salen de las fórmulas de los apuntes, comprobados con $I_z$ calculado
      de dos formas (rectángulos con Steiner, y el de fuera menos el hueco
      llevados a G) y con la integral de la tensión en la sección, que da
      axil nulo y el flector de partida.
