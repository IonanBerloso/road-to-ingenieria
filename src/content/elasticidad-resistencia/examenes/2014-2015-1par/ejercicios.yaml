ejercicios:
  # ── Teoría · pregunta 1 · las direcciones principales son ortogonales.
  #    La misma pregunta, palabra por palabra, que la 1 de 2019-2020 (publicada).
  - id: exerm1415-1par-1-las-direcciones-principales-son-ortogonales
    titulo: Por qué las direcciones principales son ortogonales, también cuando dos tensiones principales coinciden
    fuente: >-
      Pregunta 1 de teoría · Primer parcial de 2014-2015 (hoja de teoría del
      10 de noviembre de 2014) · Elasticidad y Resistencia de Materiales,
      Escuela Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 1
      punto. Volvió a caer, con las mismas palabras, en el primer parcial de
      noviembre de 2019, que ya está publicado; aquí se resuelve de nuevo, con
      otro ejemplo. El examen no publica resolución; el desarrollo es nuestro
      y sigue los apuntes del tema 2, apartado 2.4.3 (ecs. 2.44 a 2.47,
      pp. 18-19). Los pasos de cálculo usan un ejemplo nuestro.
    nivel: examen
    enunciado: |
      (1p) Deducir que las direcciones principales del tensor de tensiones son
      ortogonales.
    pide: >-
      La deducción, desde la definición de dirección principal, de que dos
      direcciones principales con tensiones distintas son perpendiculares, y
      qué pasa cuando dos tensiones principales son iguales.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué propiedad del tensor de tensiones es la que hace funcionar la
          deducción?
        opciones:
          - texto: >-
              Que es simétrico, $\tau_{ij} = \tau_{ji}$: la reciprocidad de las
              tensiones tangenciales
            correcta: true
            mensaje: |
              Eso es. Con $[\sigma]$ simétrica, $\{n_2\}^t[\sigma]\{n_1\}$ y
              $\{n_1\}^t[\sigma]\{n_2\}$ son el mismo número, y al restar las
              dos ecuaciones de dirección principal solo queda
              $(\sigma_1 - \sigma_2)\{n_1\}^t\{n_2\} = 0$. Con una matriz
              cualquiera no sale.
          - texto: >-
              Que su determinante, el invariante $I_3$, no es nulo
            mensaje: |
              $I_3$ puede ser cero: en tensión plana una de las principales es
              nula, $I_3 = 0$, y las tres direcciones siguen siendo
              perpendiculares. La deducción no usa el determinante.
          - texto: >-
              Que las tres tensiones principales son positivas
            mensaje: |
              Pueden tener cualquier signo: un estado de compresión tiene sus
              direcciones principales tan perpendiculares como uno de
              tracción. El signo de las $\sigma_i$ no entra en la deducción.
          - texto: >-
              Que su traza, $I_1$, vale lo mismo en cualquier sistema de ejes
            mensaje: |
              Es verdad (es un invariante), pero no dice nada del ángulo entre
              dos direcciones. Lo que se usa es la simetría de $[\sigma]$, para
              igualar los dos productos $\{n_2\}^t[\sigma]\{n_1\}$ y
              $\{n_1\}^t[\sigma]\{n_2\}$.
      - tipo: calcular
        titulo: La tensión principal de una dirección dada
        pregunta: |
          Un ejemplo nuestro: en un punto,

          $$
          [\sigma] = \begin{bmatrix} 40 & 10 & 10\\ 10 & 40 & 10\\ 10 & 10 & 40 \end{bmatrix}\ \text{MPa}.
          $$

          La dirección $\{n_1\} = \tfrac{1}{\sqrt3}\{1,\ 1,\ 1\}$ es principal.
          ¿Cuánto vale su tensión principal, en MPa?
        respuesta:
          tipo: numero
          valor: '60'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '180'
            mensaje: |
              Has usado $\{1,\ 1,\ 1\}$ sin dividir entre $\sqrt3$: su módulo es
              $\sqrt3$ y $\{n\}^t[\sigma]\{n\}$ sale tres veces mayor. La
              normal de un plano tiene que ser unitaria.
          - valor: '40'
            mensaje: |
              Es $\sigma_x$, el término de la diagonal. En esta dirección
              también tiran las tangenciales: cada fila de $[\sigma]$ suma
              $40 + 10 + 10 = 60$.
        pista: |
          Calcula $\{S\} = [\sigma]\{n_1\}$: si sale paralelo a $\{n_1\}$, el
          factor es la tensión principal (ec. 2.44).
        desarrollo: |
          $$
          [\sigma]\{n_1\} = \frac{1}{\sqrt3}\begin{Bmatrix} 40+10+10\\ 10+40+10\\ 10+10+40 \end{Bmatrix} = \frac{60}{\sqrt3}\begin{Bmatrix} 1\\ 1\\ 1 \end{Bmatrix} = 60\,\{n_1\}
          $$

          El vector tensión es paralelo a la normal: $\sigma_1 = 60$ MPa, y la
          tangencial en ese plano es nula.
      - tipo: calcular
        titulo: Las otras dos tensiones principales
        pregunta: |
          En el mismo punto, las otras dos tensiones principales son iguales.
          ¿Cuánto vale cada una, en MPa?
        respuesta:
          tipo: numero
          valor: '30'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '40'
            mensaje: |
              Es la tensión media, $I_1/3 = 120/3$: la de la componente
              esférica, no una principal. Las tres principales suman $I_1$, y
              una ya es 60.
          - valor: '60'
            mensaje: |
              Has repartido toda la traza entre las dos, $120/2$, sin restar
              antes la que ya conoces: $\sigma_2 + \sigma_3 = I_1 - \sigma_1$.
        pista: |
          La traza es un invariante: $\sigma_1 + \sigma_2 + \sigma_3 = I_1 = 40 + 40 + 40$.
        desarrollo: |
          $$
          2\sigma_2 = I_1 - \sigma_1 = 120 - 60 = 60\ \text{MPa}
          \;\Longrightarrow\; \sigma_2 = \sigma_3 = 30\ \text{MPa}
          $$

          Con $I_2$ se comprueba: $\sigma_1\sigma_2 + \sigma_2\sigma_3 + \sigma_3\sigma_1 = 1800 + 900 + 1800 = 4500$,
          y de la matriz, $3\,(40\cdot40 - 10\cdot10) = 4500$.
      - tipo: calcular
        titulo: La normal en un plano perpendicular a la dirección 1
        pregunta: |
          Toma la dirección $\{m\} = \tfrac{1}{\sqrt2}\{1,\ -1,\ 0\}$, que es
          perpendicular a $\{n_1\}$. ¿Cuánto vale la tensión normal
          $\sigma_n$ en el plano de normal $\{m\}$, en MPa?
        respuesta:
          tipo: numero
          valor: '30'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '35'
            mensaje: |
              Te falta el 2 del término cruzado:
              $\sigma_n = \sigma_x m_x^{2} + \sigma_y m_y^{2} + 2\tau_{xy}m_xm_y$,
              y $2\cdot10\cdot\tfrac{1}{\sqrt2}\cdot\left(-\tfrac{1}{\sqrt2}\right) = -10$, no $-5$.
          - valor: '50'
            mensaje: |
              Has perdido el signo de $m_y = -\tfrac{1}{\sqrt2}$: el término
              cruzado resta, $2\tau_{xy}m_xm_y = -10$.
        pista: |
          $\sigma_n = \{m\}^t[\sigma]\{m\}$; o calcula primero
          $[\sigma]\{1,\ -1,\ 0\}$ y mira hacia dónde va.
        desarrollo: |
          $$
          [\sigma]\begin{Bmatrix} 1\\ -1\\ 0 \end{Bmatrix} = \begin{Bmatrix} 40-10\\ 10-40\\ 10-10 \end{Bmatrix} = 30\begin{Bmatrix} 1\\ -1\\ 0 \end{Bmatrix}
          $$

          El vector tensión vuelve a ser paralelo a la normal: $\sigma_n = 30$
          MPa y $\tau_n = 0$. **$\{m\}$ también es principal**, aunque nadie
          la ha buscado. Es el caso $\sigma_2 = \sigma_3$ de la deducción:
          cualquier dirección perpendicular a $\{n_1\}$ es principal.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción como en el examen: desde la definición de
          dirección principal hasta el caso de dos tensiones principales
          iguales.
        rubrica:
          - punto: >-
              La definición escrita para dos direcciones principales:
              [σ]{n1} = σ1{n1} y [σ]{n2} = σ2{n2} (ecs. 2.44 y 2.45, p. 18).
            porque: >-
              Todo sale de estas dos ecuaciones. Una dirección principal es la
              de un plano cuyo vector tensión es normal a él.
            minimo: true
          - punto: >-
              Se multiplica la primera por {n2}ᵗ por la izquierda, y la
              segunda por {n1}ᵗ.
            porque: >-
              Así las dos ecuaciones vectoriales pasan a ser dos números, que
              se pueden restar.
            minimo: true
          - punto: >-
              Se dice por qué {n2}ᵗ[σ]{n1} = {n1}ᵗ[σ]{n2}: es un escalar, igual
              a su traspuesto {n1}ᵗ[σ]ᵗ{n2}, y [σ]ᵗ = [σ] por la reciprocidad
              de las tangenciales.
            porque: >-
              Es el paso que decide, y el que más se salta. Sin la simetría de
              [σ] no se puede restar y la conclusión no sale.
            minimo: true
          - punto: >-
              Restando queda (σ1 − σ2)·{n1}ᵗ{n2} = 0 (ec. 2.46, p. 19).
            porque: >-
              Es el resultado. Los apuntes lo escriben {n1}{n2}ᵗ; es el
              producto escalar de las dos direcciones.
            minimo: true
          - punto: >-
              Los dos casos: si σ1 ≠ σ2, el producto escalar es nulo y las
              direcciones son perpendiculares; si σ1 = σ2, la ecuación se
              cumple sola, toda dirección perpendicular a la 3 es principal y
              se pueden elegir dos perpendiculares entre sí.
            porque: >-
              La pregunta dice «son ortogonales» sin condiciones. El caso de
              dos iguales es el que la completa, y es el que aparece en el
              ejemplo de los pasos.
          - punto: >-
              La conclusión: las tres direcciones principales forman un
              sistema cartesiano, O123, en el que [σ] es diagonal (ec. 2.47).
            porque: >-
              Es para lo que sirve el resultado: trabajar en ejes principales,
              con tres tensiones normales y ninguna tangencial.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Dos direcciones principales cumplen
              $[\sigma]\{n_1\} = \sigma_1\{n_1\}$ y
              $[\sigma]\{n_2\} = \sigma_2\{n_2\}$.
          - texto: >-
              Se multiplica la primera por $\{n_2\}^t$ y la segunda por
              $\{n_1\}^t$, por la izquierda.
          - texto: >-
              $[\sigma]$ es simétrica, así que
              $\{n_2\}^t[\sigma]\{n_1\} = \{n_1\}^t[\sigma]\{n_2\}$, y restando,
              $(\sigma_1 - \sigma_2)\{n_1\}^t\{n_2\} = 0$.
          - texto: >-
              Si $\sigma_1 \neq \sigma_2$, $\{n_1\}^t\{n_2\} = 0$: son
              perpendiculares. Si son iguales, toda dirección perpendicular a
              la 3 es principal, y se toman dos perpendiculares.
          - texto: >-
              Si $\sigma_1 = \sigma_2$, la ecuación obliga a que $\{n_1\}$ y
              $\{n_2\}$ sean paralelas: dos tensiones iguales tienen la misma
              dirección.
            trampa: true
            mensaje: |
              Con $\sigma_1 = \sigma_2$ la ecuación es $0 = 0$ y no dice nada
              de $\{n_1\}^t\{n_2\}$. Lo que pasa es lo contrario: hay
              infinitas direcciones principales, todas las del plano
              perpendicular a la 3. El ejemplo de los pasos lo enseña:
              $\{m\} = \tfrac{1}{\sqrt2}\{1,\ -1,\ 0\}$ es principal con 30 MPa
              sin ser paralela a ninguna otra.
    resolucion: |
      **La idea.** Una dirección principal es un autovector de $[\sigma]$, y
      $[\sigma]$ es simétrica: los autovectores de una matriz simétrica con
      autovalores distintos son perpendiculares. Es lo que se deduce.

      **Las dos ecuaciones** (apuntes del tema 2, ecs. 2.44 y 2.45, p. 18):

      $$
      [\sigma]\{n_1\} = \sigma_1\{n_1\}, \qquad [\sigma]\{n_2\} = \sigma_2\{n_2\}
      $$

      **Multiplicando** la primera por $\{n_2\}^t$ y la segunda por
      $\{n_1\}^t$, por la izquierda:

      $$
      \{n_2\}^t[\sigma]\{n_1\} = \sigma_1\,\{n_2\}^t\{n_1\}, \qquad
      \{n_1\}^t[\sigma]\{n_2\} = \sigma_2\,\{n_1\}^t\{n_2\}
      $$

      **La simetría.** El primer miembro de la izquierda es un número, igual a
      su traspuesto, $\{n_1\}^t[\sigma]^t\{n_2\}$; y $[\sigma]^t = [\sigma]$
      porque $\tau_{ij} = \tau_{ji}$. Los dos primeros miembros son el mismo
      número, y también $\{n_2\}^t\{n_1\} = \{n_1\}^t\{n_2\}$. Restando
      (ec. 2.46, p. 19):

      $$
      (\sigma_1 - \sigma_2)\,\{n_1\}^t\{n_2\} = 0
      $$

      **Los casos.**

      - $\sigma_1 \neq \sigma_2$: $\{n_1\}^t\{n_2\} = 0$, las dos direcciones
        son **perpendiculares**. Lo mismo con las parejas 1-3 y 2-3.
      - $\sigma_1 = \sigma_2 \neq \sigma_3$: la ecuación se cumple sola. Toda
        dirección perpendicular a la 3 es principal, y se eligen dos
        perpendiculares entre sí.
      - $\sigma_1 = \sigma_2 = \sigma_3$ (estado hidrostático): todas las
        direcciones son principales.

      En todos los casos hay un sistema cartesiano O123 de direcciones
      principales, y en él $[\sigma]$ es diagonal (ec. 2.47).

      **Con números** (nuestro ejemplo, el de los pasos):
      $[\sigma]\{1,\ 1,\ 1\} = 60\,\{1,\ 1,\ 1\}$, así que $\sigma_1 = 60$
      MPa según $\tfrac{1}{\sqrt3}\{1,\ 1,\ 1\}$; la traza da
      $\sigma_2 = \sigma_3 = (120 - 60)/2 = 30$ MPa. Como son iguales, toda
      dirección perpendicular a $\{1,\ 1,\ 1\}$ es principal, por ejemplo
      $\tfrac{1}{\sqrt2}\{1,\ -1,\ 0\}$, donde $\sigma_n = 30$ MPa y
      $\tau_n = 0$. El motor del curso da las mismas tres principales y la
      dirección 1, y la comprobación con los invariantes ($I_1 = 120$,
      $I_2 = 4500$ e $I_3 = 54\,000$, de la matriz y de las principales)
      cuadra.

  # ── Teoría · pregunta 2 · los tensores de deformación y de rotación.
  - id: exerm1415-1par-2-los-tensores-de-deformacion-y-rotacion
    titulo: Los tensores de deformación y de rotación, de dónde salen y qué hace cada uno
    fuente: >-
      Pregunta 2 de teoría · Primer parcial de 2014-2015 (hoja de teoría del
      10 de noviembre de 2014) · Elasticidad y Resistencia de Materiales,
      Escuela Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 1
      punto. El examen no publica resolución; el desarrollo es nuestro y sigue
      los apuntes del tema 3, apartados 3.4 y 3.5.1 (ecs. 3.22 a 3.45,
      pp. 10-14). Los pasos de cálculo usan un campo de desplazamientos
      nuestro.
    nivel: examen
    enunciado: |
      (1p) Tensores de deformación y rotación.
    pide: >-
      Cómo salen del gradiente de desplazamientos el tensor de deformación y
      el de rotación, qué significa cada término y por qué el de rotación es
      un giro de sólido rígido.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De dónde salen los dos tensores?
        opciones:
          - texto: >-
              De partir la matriz gradiente de desplazamientos $[g]$, que no es
              simétrica, en su parte simétrica, $[\varepsilon]$, y su parte
              antisimétrica, $[\omega]$
            correcta: true
            mensaje: |
              Eso es (ecs. 3.30 a 3.32). El desplazamiento relativo de dos
              puntos vecinos es $[g]\{dr\}$; la parte simétrica deforma y la
              antisimétrica gira sin deformar.
          - texto: >-
              $[\varepsilon]$ es el propio gradiente $[g]$, y $[\omega]$ es su
              traspuesta
            mensaje: |
              $[g]$ no es simétrica, y un tensor de deformación sí tiene que
              serlo: la distorsión del ángulo entre $x$ e $y$ es una sola. Las
              dos son mitades: $\tfrac12([g] + [g]^t)$ y
              $\tfrac12([g] - [g]^t)$.
          - texto: >-
              Los dos son simétricos: $[\varepsilon]$ lleva las deformaciones
              normales y $[\omega]$ las tangenciales
            mensaje: |
              Las tangenciales, $\tfrac12\gamma$, están fuera de la diagonal
              de $[\varepsilon]$. $[\omega]$ es antisimétrica, con ceros en la
              diagonal, y no deforma: gira.
          - texto: >-
              $[\omega]$ sale de derivar $[\varepsilon]$ una vez más
            mensaje: |
              Los dos salen de las mismas primeras derivadas de $u$, $v$ y
              $w$: los de $[\varepsilon]$ sumándolas a pares y los de
              $[\omega]$ restándolas. Derivar otra vez es lo de las
              ecuaciones de compatibilidad, que es otra cosa.
      - tipo: calcular
        titulo: La distorsión
        pregunta: |
          Un ejemplo nuestro: $u = (4x + 2y)\cdot10^{-3}$,
          $v = (6x - y)\cdot10^{-3}$ y $w = 0$, con todo en mm. ¿Cuánto vale
          la distorsión $\gamma_{xy}$, en unidades de $10^{-3}$?
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.01
          formato: un número, en unidades de 10⁻³
        distractores:
          - valor: '4'
            mensaje: |
              Es $\varepsilon_{xy} = \tfrac12\gamma_{xy}$, el término de fuera
              de la diagonal del tensor (ec. 3.35). La distorsión es la suma
              entera, $u_{,y} + v_{,x}$.
          - valor: '-4'
            mensaje: |
              Has restado las derivadas: $u_{,y} - v_{,x} = 2 - 6$. La resta
              es el doble del giro, con el signo cambiado; la distorsión las
              suma.
        pista: |
          $\gamma_{xy} = u_{,y} + v_{,x}$.
        desarrollo: |
          $$
          \gamma_{xy} = u_{,y} + v_{,x} = (2 + 6)\cdot10^{-3} = 8\cdot10^{-3}
          $$

          y en el tensor va la mitad, $\varepsilon_{xy} = 4\cdot10^{-3}$.
      - tipo: calcular
        titulo: El giro
        pregunta: |
          Con el mismo campo, ¿cuánto vale el giro alrededor de $z$,
          $\omega_{yx}$, en unidades de $10^{-3}$ rad (positivo antihorario)?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número, en unidades de 10⁻³ rad
        distractores:
          - valor: '4'
            mensaje: |
              Te falta el $\tfrac12$: $\omega_{yx} = \tfrac12(v_{,x} - u_{,y})$
              (ec. 3.34). Es la media del giro de la fibra $x$ y del de la
              fibra $y$.
          - valor: '-2'
            mensaje: |
              Es el término de arriba a la derecha de $[\omega]$, que vale
              $-\omega_{yx}$: la matriz es antisimétrica. El giro alrededor de
              $z$ es el de abajo a la izquierda, $\tfrac12(v_{,x} - u_{,y})$.
        pista: |
          $\omega_{yx} = \tfrac12\,(v_{,x} - u_{,y})$, el término de la fila
          2 y la columna 1 de $[\omega]$ (ec. 3.34).
        desarrollo: |
          $$
          \omega_{yx} = \tfrac12\,(v_{,x} - u_{,y}) = \tfrac12\,(6 - 2)\cdot10^{-3} = 2\cdot10^{-3}\ \text{rad}
          $$

          La fibra $x$ gira $v_{,x} = 6\cdot10^{-3}$ rad hacia arriba y la
          fibra $y$, $u_{,y} = 2\cdot10^{-3}$ rad hacia $x$, en sentido
          horario. La media, $(6 - 2)/2$, es el giro de sólido rígido; lo que
          se cierra el ángulo recto, $6 + 2$, es la distorsión.
      - tipo: calcular
        titulo: La deformación de la diagonal
        pregunta: |
          Con el mismo campo, ¿cuánto se alarga por unidad de longitud la
          dirección $\hat u = \tfrac{1}{\sqrt2}(\hat\imath + \hat\jmath)$, en
          unidades de $10^{-3}$?
        respuesta:
          tipo: numero
          valor: '5.5'
          tolerancia: 0.01
          formato: un número, en unidades de 10⁻³
        distractores:
          - valor: '1.5'
            mensaje: |
              Es la media de $\varepsilon_x$ y $\varepsilon_y$, sin la
              distorsión. A 45° el término cruzado,
              $2\cdot\tfrac12\gamma_{xy}\cdot\tfrac12 = 4\cdot10^{-3}$, es el
              que más pesa.
          - valor: '9.5'
            mensaje: |
              Has puesto $\gamma_{xy}$ entero fuera de la diagonal. En el
              tensor va $\tfrac12\gamma_{xy}$ (ec. 3.35); si no, la distorsión
              cuenta dos veces.
        pista: |
          $\varepsilon_u = \{u\}^t[\varepsilon]\{u\}$, con $\varepsilon_x = 4$,
          $\varepsilon_y = -1$ y $\tfrac12\gamma_{xy} = 4$ (en $10^{-3}$).
        desarrollo: |
          $$
          \varepsilon_u = \tfrac12\varepsilon_x + \tfrac12\varepsilon_y + 2\cdot\tfrac12\gamma_{xy}\cdot\tfrac12 = (2 - 0{,}5 + 4)\cdot10^{-3} = 5{,}5\cdot10^{-3}
          $$

          Con el gradiente entero, $\{u\}^t[g]\{u\} = \tfrac12(4 + 2 + 6 - 1)\cdot10^{-3}$,
          sale lo mismo: la parte antisimétrica no cambia la longitud.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la respuesta como en el examen: de dónde salen los dos
          tensores, qué es cada término y por qué el de rotación es un giro de
          sólido rígido.
        rubrica:
          - punto: >-
              Se sigue un segmento dr: tras la deformación,
              dr' = dr + [g]{dr}, con [g] la matriz gradiente de
              desplazamientos, de términos u,x, u,y, …, que no es simétrica
              (ecs. 3.22 a 3.29, pp. 10-11).
            porque: >-
              Es de donde sale todo. Un segmento se alarga, cambia de ángulo y
              gira, y [g] lo lleva todo mezclado.
            minimo: true
          - punto: >-
              Se parte [g] en simétrica y antisimétrica: g_ij = e_ij + ω_ij,
              con e_ij = ½(g_ij + g_ji) y ω_ij = ½(g_ij − g_ji)
              (ecs. 3.30 a 3.32, p. 11).
            porque: >-
              Es la definición de los dos tensores. Cualquier matriz se parte
              así, y de una sola forma.
            minimo: true
          - punto: >-
              El tensor de deformación lleva εx, εy, εz en la diagonal y ½γ
              fuera de ella (ec. 3.35, p. 12).
            porque: >-
              Es lo que conecta el tensor con las deformaciones que se miden.
              El ½ es el error más repetido de este tema.
            minimo: true
          - punto: >-
              El tensor de rotación es antisimétrico, con ceros en la diagonal
              y términos como ωyx = ½(v,x − u,y) (ec. 3.34), y
              dr' = dr + ([ε] + [ω]){dr} (ec. 3.36).
            porque: >-
              Sin la forma de [ω] no se puede decir luego qué hace. Sus tres
              términos independientes son tres giros.
            minimo: true
          - punto: >-
              [ω]{dr} es un producto vectorial, ω × dr, con el vector de
              rotación ω = (ωzy, ωxz, ωyx) (ecs. 3.38 a 3.40, p. 13).
            porque: >-
              Es lo que permite reconocerlo como un giro: ω × dr es
              perpendicular a dr.
          - punto: >-
              La parte de [ω] no cambia la longitud, dr' = dr·√(1 + ω²sen²θ)
              ≈ dr, ni el ángulo entre dos segmentos (ecs. 3.41 a 3.45,
              pp. 13-14): con desplazamientos pequeños es un giro de sólido
              rígido, y la deformación la da solo [ε].
            porque: >-
              Es la conclusión que da sentido a la partición: lo que importa
              para las tensiones es [ε].
            minimo: true
      - tipo: justificar
        pregunta: Ordena la explicación. Una pieza es falsa.
        piezas:
          - texto: >-
              Un segmento $dr$ pasa a ser $dr' = dr + [g]\{dr\}$, con $[g]$ la
              matriz gradiente de los desplazamientos.
          - texto: >-
              $[g]$ se parte en su parte simétrica, $[\varepsilon]$, y su
              parte antisimétrica, $[\omega]$.
          - texto: >-
              $[\varepsilon]$ lleva las deformaciones unitarias en la diagonal
              y $\tfrac12\gamma$ fuera de ella.
          - texto: >-
              $[\omega]\{dr\} = \vec\omega\times\vec{dr}$: con desplazamientos
              pequeños es un giro de sólido rígido, que no cambia longitudes ni
              ángulos.
          - texto: >-
              El giro alarga el segmento en $\omega\,dr\,\operatorname{sen}\theta$,
              que se suma al alargamiento que da $[\varepsilon]$.
            trampa: true
            mensaje: |
              $\vec\omega\times\vec{dr}$ es perpendicular a $\vec{dr}$: no lo
              alarga, lo gira. La longitud nueva es
              $dr\sqrt{1 + \omega^{2}\operatorname{sen}^{2}\theta}$ (ec. 3.42),
              y $\omega^{2}$ es de segundo orden. En el ejemplo de los pasos,
              $[g]$ y $[\varepsilon]$ dan el mismo $\varepsilon_u$.
    resolucion: |
      **El punto de partida** (apuntes del tema 3, apartado 3.4, pp. 10-11).
      Un segmento $\vec{dr}$ entre dos puntos vecinos O y P pasa, tras la
      deformación, a

      $$
      \{dr'\} = \{dr\} + [g]\{dr\}, \qquad
      [g] = \begin{bmatrix} u_{,x} & u_{,y} & u_{,z}\\ v_{,x} & v_{,y} & v_{,z}\\ w_{,x} & w_{,y} & w_{,z} \end{bmatrix}
      $$

      (ecs. 3.27 y 3.28). $[g]$, el gradiente de desplazamientos, **no es
      simétrica**.

      **La partición** (ecs. 3.30 a 3.32). Toda matriz es la suma de una
      simétrica y una antisimétrica, de una sola forma:

      $$
      g_{ij} = e_{ij} + \omega_{ij}, \qquad
      e_{ij} = \tfrac12\,(g_{ij} + g_{ji}), \qquad
      \omega_{ij} = \tfrac12\,(g_{ij} - g_{ji})
      $$

      **El tensor de deformación** (ec. 3.35, p. 12) es la parte simétrica:

      $$
      [\varepsilon] = \begin{bmatrix} \varepsilon_x & \tfrac12\gamma_{xy} & \tfrac12\gamma_{zx}\\ \tfrac12\gamma_{xy} & \varepsilon_y & \tfrac12\gamma_{yz}\\ \tfrac12\gamma_{zx} & \tfrac12\gamma_{yz} & \varepsilon_z \end{bmatrix},
      \qquad \varepsilon_x = u_{,x},\quad \gamma_{xy} = u_{,y} + v_{,x},\ \dots
      $$

      En la diagonal, el alargamiento unitario de las fibras $x$, $y$, $z$;
      fuera, la **mitad** de la distorsión de cada ángulo recto.

      **El tensor de rotación** (ec. 3.34) es la parte antisimétrica:

      $$
      [\omega] = \begin{bmatrix} 0 & -\omega_{yx} & \omega_{xz}\\ \omega_{yx} & 0 & -\omega_{zy}\\ -\omega_{xz} & \omega_{zy} & 0 \end{bmatrix},
      \qquad \omega_{yx} = \tfrac12\,(v_{,x} - u_{,y}),\ \dots
      $$

      y $\{dr'\} = \{dr\} + ([\varepsilon] + [\omega])\{dr\}$ (ec. 3.36).

      **Qué hace $[\omega]$** (apartado 3.5.1, pp. 12-14). $[\omega]\{dr\}$ es
      el producto vectorial $\vec\omega\times\vec{dr}$, con
      $\vec\omega = \omega_{zy}\hat\imath + \omega_{xz}\hat\jmath + \omega_{yx}\hat k$
      (ecs. 3.38 a 3.40). Solo, ese término no cambia la longitud:

      $$
      dr' = dr\,\sqrt{1 + \omega^{2}\operatorname{sen}^{2}\theta} \approx dr
      $$

      (ecs. 3.41 y 3.42), porque $\omega^{2}$ es de segundo orden; y con dos
      segmentos se ve igual que tampoco cambia el ángulo entre ellos (ecs.
      3.43 a 3.45). Es un **giro de sólido rígido**: la deformación de
      verdad, la que da tensiones, está toda en $[\varepsilon]$.

      **Un ejemplo** (nuestro, el de los pasos): $u = (4x + 2y)\cdot10^{-3}$,
      $v = (6x - y)\cdot10^{-3}$, $w = 0$. En $10^{-3}$:

      $$
      [g] = \begin{bmatrix} 4 & 2 & 0\\ 6 & -1 & 0\\ 0 & 0 & 0 \end{bmatrix} = \begin{bmatrix} 4 & 4 & 0\\ 4 & -1 & 0\\ 0 & 0 & 0 \end{bmatrix} + \begin{bmatrix} 0 & -2 & 0\\ 2 & 0 & 0\\ 0 & 0 & 0 \end{bmatrix}
      $$

      Así $\varepsilon_x = 4\cdot10^{-3}$, $\varepsilon_y = -1\cdot10^{-3}$,
      $\gamma_{xy} = 8\cdot10^{-3}$, y el elemento gira
      $\omega_{yx} = 2\cdot10^{-3}$ rad en sentido antihorario. La diagonal
      a 45° se alarga $\varepsilon_u = 5{,}5\cdot10^{-3}$, con $[\varepsilon]$
      y con $[g]$ entero. El motor del curso da el mismo tensor y el mismo
      $\varepsilon_u$, y la longitud final exacta del segmento, calculada con
      los desplazamientos, también.

      **Notas nuestras.** Los apuntes tienen dos erratas aquí: en la primera
      fila de la ec. 3.38 el término $\omega_{yx}$ va con $dy$, no con $dx$; y
      debajo de la 3.39 escriben
      $\vec\omega = \omega_{yz}\hat\imath + \omega_{zx}\hat\jmath + \omega_{xy}\hat k$,
      con los subíndices al revés que en el determinante, que es el que
      vale.

  # ── Teoría · pregunta 3 · los criterios de fallo y el de Mohr.
  - id: exerm1415-1par-3-los-criterios-de-fallo-y-el-de-mohr
    titulo: Los criterios de fallo, y el de Mohr deducido de la recta intrínseca
    fuente: >-
      Pregunta 3 de teoría · Primer parcial de 2014-2015 (hoja de teoría del
      10 de noviembre de 2014) · Elasticidad y Resistencia de Materiales,
      Escuela Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 1
      punto. El examen no publica resolución; el desarrollo es nuestro y sigue
      los apuntes del tema 6 (ecs. 6.1 a 6.19, 6.28 y 6.29, pp. 4-11). Los
      pasos de cálculo usan un ejemplo nuestro.
    nivel: examen
    enunciado: |
      (1p) Criterios de fallo. Criterio de Mohr.
    pide: >-
      Qué es un criterio de fallo (tensión equivalente y factor de
      seguridad), los criterios de Rankine, Saint-Venant, Tresca y von Mises,
      y el de Mohr con su recta intrínseca, k y la tensión equivalente.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace cualquier criterio de fallo?
        opciones:
          - texto: >-
              Reduce el estado de tensiones del punto a una tensión equivalente
              $\sigma_{eqv}$, la de un ensayo de tracción igual de peligroso, y
              la compara con el límite del ensayo
            correcta: true
            mensaje: |
              Eso es. Cada criterio es una forma de calcular $\sigma_{eqv}$, y
              el factor de seguridad es $FS = \sigma_e/\sigma_{eqv}$ (ec. 6.1).
              El ensayo de tracción es lo único que se mide; los estados
              triaxiales se le traducen.
          - texto: >-
              Compara cada tensión principal, por separado, con el límite
              elástico
            mensaje: |
              Ese es uno de los criterios, el de Rankine (ec. 6.3), y no tiene
              en cuenta cómo se combinan las tres. Los demás sí: Tresca mira
              $\sigma_1 - \sigma_3$ y von Mises, las tres diferencias.
          - texto: >-
              Compara la tensión tangencial máxima con el límite elástico de
              tracción
            mensaje: |
              Esa comparación no es la del ensayo: en tracción simple la
              tangencial máxima es la **mitad** de $\sigma$. Tresca compara
              $\tau_{max}$ con $\sigma_e/2$, o lo que es igual,
              $\sigma_1 - \sigma_3$ con $\sigma_e$ (ecs. 6.17 a 6.19).
          - texto: >-
              Da la carga con la que se rompe la pieza entera
            mensaje: |
              Un criterio de fallo es local: dice si un **punto** alcanza el
              límite elástico. La carga de la pieza sale de buscar el punto
              más cargado y aplicarle el criterio.
      - tipo: calcular
        titulo: El vértice de la recta intrínseca
        pregunta: |
          Un ejemplo nuestro: un material frágil con $\sigma_{et} = 120$ MPa
          en tracción y $\sigma_{ec} = 360$ MPa en compresión. Su recta
          intrínseca de Mohr es tangente a los círculos de los dos ensayos.
          ¿En qué valor de $\sigma$ corta al eje $\sigma$, en MPa?
        respuesta:
          tipo: numero
          valor: '180'
          tolerancia: 0.5
          formato: un número, en MPa
        distractores:
          - valor: '163.92'
            mensaje: |
              Has sumado al centro del círculo de tracción $r/\tan\varphi$. Es
              $r/\operatorname{sen}\varphi$: del centro al vértice va la
              hipotenusa del triángulo que forman el centro, el punto de
              tangencia y el vértice, y el radio es el cateto opuesto a
              $\varphi$.
          - valor: '103.92'
            mensaje: |
              Es la ordenada en el origen, $OC = 180\tan30^\circ$: dónde corta
              la recta al eje $\tau$. Lo que se pide es dónde corta al eje
              $\sigma$.
        pista: |
          Primero el ángulo: $\operatorname{sen}\varphi = \dfrac{1 - k}{1 + k}$
          con $k = \sigma_{et}/\sigma_{ec}$ (ecs. 6.11 y 6.12). Después, el
          vértice está a $r/\operatorname{sen}\varphi$ del centro del círculo
          de tracción.
        desarrollo: |
          $$
          k = \frac{120}{360} = \frac13, \qquad
          \operatorname{sen}\varphi = \frac{1 - 1/3}{1 + 1/3} = \frac{180 - 60}{180 + 60} = 0{,}5
          \;\Longrightarrow\; \varphi = 30^\circ
          $$

          (los radios de los dos círculos son 60 y 180 MPa, y sus centros
          están a 240 MPa). El círculo de tracción tiene el centro en 60 y
          radio 60, así que el vértice está en

          $$
          \sigma_V = 60 + \frac{60}{0{,}5} = 180
          $$

          MPa. Con el de compresión, de centro $-180$ y radio 180, sale lo
          mismo: $-180 + 180/0{,}5 = 180$.
      - tipo: calcular
        titulo: El factor de seguridad de Mohr a torsión pura
        pregunta: |
          Un eje de ese material está a torsión pura, con $\tau = 60$ MPa
          ($\sigma_1 = 60$, $\sigma_2 = 0$, $\sigma_3 = -60$ MPa). ¿Cuánto
          vale su factor de seguridad según Mohr?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '1'
            mensaje: |
              Es Tresca: $\sigma_{eqv} = \sigma_1 - \sigma_3 = 120$ MPa, como
              si el material resistiera lo mismo a compresión. Mohr pesa la
              compresión con $k = 1/3$, porque aguanta el triple.
          - valor: '0.5'
            mensaje: |
              Has puesto $k = 3$: $\sigma_{eqv} = 60 + 3\cdot60 = 240$ MPa. Es
              $k = \sigma_{et}/\sigma_{ec} = 1/3$ (ec. 6.12).
          - valor: '2'
            mensaje: |
              Es Rankine: la normal mayor, 60 MPa, contra 120. Rankine no ve
              que la compresión de $-60$ empuja hacia el fallo; Mohr la suma
              con $k$.
        pista: |
          $\sigma_{eqv} = \sigma_1 - k\,\sigma_3$ (ec. 6.15) y
          $FS = \sigma_{et}/\sigma_{eqv}$.
        desarrollo: |
          $$
          \sigma_{eqv} = 60 - \tfrac13\,(-60) = 80\ \text{MPa}, \qquad FS = \frac{120}{80} = 1{,}5
          $$

          El círculo de este estado, centrado en el origen, toca la recta
          intrínseca cuando su radio llega a 90 MPa: $90/60 = 1{,}5$ también.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la respuesta como en el examen: qué es un criterio de fallo,
          los cuatro clásicos en una línea cada uno y el de Mohr deducido.
        rubrica:
          - punto: >-
              Un criterio da una tensión equivalente σeqv, la de tracción
              simple igual de peligrosa, y FS = σe/σeqv (ec. 6.1, p. 4).
            porque: >-
              Es lo que tienen en común todos, y lo que permite comparar un
              estado triaxial con el ensayo de tracción.
            minimo: true
          - punto: >-
              Rankine: σeqv = |σ|máx, con el límite de tracción o el de
              compresión según el signo (ecs. 6.3 a 6.5, p. 4).
              Saint-Venant: σeqv = E|ε|máx, con las ε de Hooke
              (ecs. 6.6 a 6.9, p. 5).
            porque: >-
              Son los dos de los materiales frágiles, y los dos miran una sola
              tensión o una sola deformación.
          - punto: >-
              Tresca: τmáx = ½(σ1 − σ3) igualada a ½σeqv, σeqv = σ1 − σ3
              (ecs. 6.17 a 6.19, p. 9). Von Mises: la energía de distorsión,
              σeqv = (1/√2)·√((σ1 − σ2)² + (σ2 − σ3)² + (σ3 − σ1)²)
              (ecs. 6.28 y 6.29, p. 11).
            porque: >-
              Son los de los materiales dúctiles, y el ½ de Tresca es el error
              más corriente.
          - punto: >-
              Mohr: los círculos de tracción y de compresión pura en el límite
              y la recta tangente a los dos, |τn| = OC − σn·tg φ (fig. 6.2 y
              ec. 6.10, apartado 6.4, pp. 6-7).
            porque: >-
              Es la idea del criterio: la curva intrínseca, que envuelve los
              círculos de fallo, se cambia por esa recta.
            minimo: true
          - punto: >-
              sen φ = (σec − σet)/(σec + σet) = (1 − k)/(1 + k), con
              k = σet/σec (ecs. 6.11 y 6.12, p. 7).
            porque: >-
              Es la geometría de la tangente común: la diferencia de radios
              entre la distancia de los centros.
            minimo: true
          - punto: >-
              La tensión equivalente: el círculo del estado y el de σeqv
              tocan rectas de la misma inclinación φ, y de ahí
              σeqv = σ1 − k·σ3, sin fallo si σeqv < σet (ecs. 6.13 a 6.16,
              p. 8). Con k = 1 es Tresca.
            porque: >-
              Es el resultado que se usa. Decir que con k = 1 da Tresca
              demuestra que se ha entendido qué añade Mohr: pesar la
              compresión con k.
            minimo: true
      - tipo: justificar
        pregunta: Ordena la deducción del criterio de Mohr. Una pieza es falsa.
        piezas:
          - texto: >-
              Se dibujan el círculo de tracción pura (de 0 a $\sigma_{et}$) y
              el de compresión pura (de $-\sigma_{ec}$ a 0) en el límite.
          - texto: >-
              La recta tangente a los dos cumple
              $\operatorname{sen}\varphi = (1 - k)/(1 + k)$, con
              $k = \sigma_{et}/\sigma_{ec}$.
          - texto: >-
              El círculo de un estado cualquiera está en el límite cuando
              toca una recta de esa inclinación, y de ahí
              $\sigma_{eqv} = \sigma_1 - k\,\sigma_3$.
          - texto: >-
              No hay fallo mientras $\sigma_{eqv} < \sigma_{et}$.
          - texto: >-
              Para un estado de compresión pura, $\sigma_3 = -\sigma_{ec}$, la
              tensión equivalente es $\sigma_{ec}$, y se compara con
              $\sigma_{ec}$.
            trampa: true
            mensaje: |
              Con $\sigma_1 = 0$ y $\sigma_3 = -\sigma_{ec}$, la ec. 6.15 da
              $\sigma_{eqv} = -k\,(-\sigma_{ec}) = \sigma_{et}$: se compara con
              $\sigma_{et}$, como cualquier otro estado. Los apuntes lo dicen
              en la p. 8: la ec. 6.16 incluye la compresión pura aunque solo
              aparezca $\sigma_{et}$.
    resolucion: |
      **Qué es un criterio de fallo** (apuntes del tema 6, p. 4). El ensayo
      de tracción da un límite, $\sigma_e$; un punto real tiene tres
      tensiones principales. Un criterio las reduce a una **tensión
      equivalente**, $\sigma_{eqv}$, la de una tracción simple igual de
      peligrosa, y define el factor de seguridad (ec. 6.1):

      $$
      FS = \frac{\sigma_e}{\sigma_{eqv}}
      $$

      **Los cuatro clásicos**, con $\sigma_1 > \sigma_2 > \sigma_3$:

      | criterio | $\sigma_{eqv}$ | apuntes |
      |---|---|---|
      | Rankine (tensión máxima) | $\lvert\sigma\rvert_{max}$, con $\sigma_{et}$ o $\sigma_{ec}$ según el signo | ecs. 6.3 a 6.5, p. 4 |
      | Saint-Venant (deformación máxima) | $E\,\lvert\varepsilon\rvert_{max}$, con $\varepsilon_1 = [\sigma_1 - \nu(\sigma_2 + \sigma_3)]/E$… | ecs. 6.6 a 6.9, p. 5 |
      | Tresca (tangencial máxima) | $\sigma_1 - \sigma_3$ | ecs. 6.17 a 6.19, p. 9 |
      | von Mises (energía de distorsión) | $\tfrac{1}{\sqrt2}\sqrt{(\sigma_1 - \sigma_2)^{2} + (\sigma_2 - \sigma_3)^{2} + (\sigma_3 - \sigma_1)^{2}}$ | ecs. 6.28 y 6.29, p. 11 |

      Rankine y Saint-Venant se usan en materiales frágiles; Tresca y von
      Mises, en dúctiles.

      **El criterio de Mohr** (apartado 6.4, pp. 6-8). Los círculos de Mohr de
      los estados que fallan tienen una envolvente, la curva intrínseca: un
      estado no falla si su círculo mayor queda dentro. La curva se cambia por
      la **recta intrínseca**, tangente a los círculos de tracción pura (de 0 a
      $\sigma_{et}$) y de compresión pura (de $-\sigma_{ec}$ a 0)
      (fig. 6.2, ec. 6.10):

      $$
      |\tau_n| = \overline{OC} - \sigma_n\tan\varphi, \qquad
      \operatorname{sen}\varphi = \frac{\tfrac12(\sigma_{ec} - \sigma_{et})}{\tfrac12(\sigma_{ec} + \sigma_{et})} = \frac{1 - k}{1 + k}, \qquad k = \frac{\sigma_{et}}{\sigma_{ec}}
      $$

      (ecs. 6.11 y 6.12). Para un estado cualquiera se supone que la
      tangente común a su círculo mayor y al de $\sigma_{eqv}$ tiene la misma
      inclinación $\varphi$ (fig. 6.3). En ese triángulo,
      $\operatorname{sen}\varphi = \overline{QR}/\overline{QS}$, con
      $\overline{QR} = \tfrac12[\sigma_{eqv} - (\sigma_1 - \sigma_3)]$ y
      $\overline{QS} = \tfrac12[(\sigma_1 + \sigma_3) - \sigma_{eqv}]$
      (ecs. 6.13 y 6.14), y con la 6.12 sale

      $$
      \sigma_{eqv} = \sigma_1 - k\,\sigma_3, \qquad \text{sin fallo si } \sigma_{eqv} < \sigma_{et}
      $$

      (ecs. 6.15 y 6.16). Con $k = 1$, mismo límite a tracción y a
      compresión, es Tresca. La compresión pura ($\sigma_3 = -\sigma_{ec}$)
      da $\sigma_{eqv} = \sigma_{et}$: también queda dentro de la 6.16. Sirve
      para frágiles y para dúctiles.

      **Con números** (nuestro ejemplo): $\sigma_{et} = 120$ y
      $\sigma_{ec} = 360$ MPa dan $k = 1/3$, $\operatorname{sen}\varphi = 0{,}5$ y
      $\varphi = 30^\circ$. A torsión pura con $\tau = 60$ MPa:
      $\sigma_{eqv} = 60 + 60/3 = 80$ MPa y $FS = 1{,}5$; Tresca daría 1 y
      Rankine, 2. El motor del curso da los mismos $k$, $\varphi$, $\sigma_{eqv}$
      y $FS$, y la geometría de la recta también: corta el eje $\sigma$ en
      180 MPa, a $90$ MPa del origen, que es el radio del círculo de torsión
      en el límite.

  # ── Teoría · pregunta 4 · tres principales de tracción y cuatro criterios.
  #    Es el ejercicio 6.1 de clase; sus a/ y b/ son el 2.13.
  - id: exerm1415-1par-4-tres-principales-de-traccion-y-cuatro-criterios
    titulo: Dos tensiones principales y la tangencial máxima, los círculos de Mohr y cuatro factores de seguridad
    fuente: >-
      Pregunta 4 de teoría · Primer parcial de 2014-2015 (hoja de teoría del
      10 de noviembre de 2014) · Elasticidad y Resistencia de Materiales,
      Escuela Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 1
      punto. Es, con las mismas palabras, el ejercicio 6.1 de clase, y sus
      apartados a/ y b/ son el 2.13; ninguno trae resolución. El examen
      tampoco la publica; el desarrollo es nuestro y sigue los apuntes del
      tema 2 (apartado 2.6.2) y del tema 6 (ecs. 6.1 a 6.29, pp. 4-11).
    nivel: examen
    enunciado: |
      (1p) En un punto de un sólido elástico se sabe que:

      Las tres tensiones principales son de tracción

      Dos de ellas son 5 MPa y 35 MPa

      La tensión tangencial máxima es de 20 MPa

      Determinar:

      a/ Diagrama de los círculos de Mohr

      b/ Tensión normal asociada al plano de máxima tensión cortante

      c/ Factor de seguridad frente al fallo según los criterios de máxima
      tensión, máxima deformación, Tresca y Von Mises.

      Datos: $\sigma_L$ = 80 MPa; $E$ = 2·10⁵ MPa; $\nu$ = 0,3
    pide: >-
      La tercera tensión principal, los tres círculos de Mohr, la tensión
      normal en el plano de la tangencial máxima y los factores de seguridad
      de Rankine, Saint-Venant, Tresca y von Mises.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es la tangencial máxima de 20 MPa en el diagrama de Mohr?
        opciones:
          - texto: >-
              El radio del círculo mayor: la mitad de la diferencia entre la
              mayor y la menor de las tres principales
            correcta: true
            mensaje: |
              Eso es: $\tau_{max} = \tfrac12(\sigma_1 - \sigma_3)$ (ec. 6.17).
              Con eso y las dos que se dan, sale la tercera.
          - texto: >-
              La mitad de la diferencia entre las dos que se dan,
              $(35 - 5)/2$
            mensaje: |
              Eso es 15, no 20: si 5 y 35 fueran la menor y la mayor, la
              tangencial máxima sería 15 MPa. El dato dice que una de las dos
              no es extremo, y la que falta sí.
          - texto: >-
              La diferencia entre la mayor y la menor, sin el medio
            mensaje: |
              $\sigma_1 - \sigma_3$ es el **diámetro** del círculo mayor; la
              tangencial máxima es su radio, la mitad.
          - texto: >-
              El radio de cualquiera de los tres círculos: todos tocan la misma
              $\tau$
            mensaje: |
              Los tres círculos tienen radios distintos, y la tangencial
              máxima del punto es la del mayor. Los otros dos son las
              máximas de los planos que contienen una dirección principal.
      - tipo: calcular
        titulo: La tercera tensión principal
        pregunta: |
          ¿Cuánto vale la tensión principal que falta, en MPa?
        respuesta:
          tipo: numero
          valor: '45'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '25'
            mensaje: |
              Has sumado $\tau_{max}$ a 5 sin el 2: $25 - 5 = 20$ es el
              **diámetro**. El radio es 20, y la mayor tiene que estar a 40 de
              la menor.
          - valor: '75'
            mensaje: |
              Has sumado $2\tau_{max}$ a 35. Pero la menor de las tres es 5, y
              con 75 arriba el círculo grande iría de 5 a 75: $\tau_{max}$
              sería 35.
        pista: |
          $\tau_{max} = \tfrac12(\sigma_1 - \sigma_3)$, y las tres son de
          tracción: positivas.
        desarrollo: |
          Si 5 y 35 fueran los extremos, $\tau_{max}$ sería
          $(35 - 5)/2 = 15$ MPa. Así que la que falta está fuera: o por encima,
          $5 + 2\cdot20 = 45$ MPa, o por debajo, $35 - 2\cdot20 = -5$ MPa, que
          no es de tracción. Quedan

          $$
          \sigma_1 = 45\ \text{MPa}, \qquad \sigma_2 = 35\ \text{MPa}, \qquad \sigma_3 = 5\ \text{MPa}
          $$
      - tipo: dibujar
        consigna: |
          En papel: **los tres círculos de Mohr del punto**, con $\sigma$ en
          abscisas y $\tau$ en ordenadas, a escala, con las tres principales,
          los centros y el punto de la tangencial máxima.
        comprueba:
          - punto: |
              **Tres círculos** con el centro en el eje $\sigma$: de 5 a 45
              (centro 25, radio 20), de 5 a 35 (centro 20, radio 15) y de 35 a
              45 (centro 40, radio 5), en MPa.
            porque: |
              Cada círculo reúne los planos que contienen una dirección
              principal; sus extremos son las otras dos tensiones principales
              (apuntes del tema 2, apartado 2.6.2).
          - punto: |
              **Los dos pequeños dentro del grande**, tocándose en
              $\sigma_2 = 35$ y tocando al grande en 5 y en 45.
            porque: |
              Es la forma de cualquier estado triaxial. Si un pequeño se sale
              del grande, el orden de las principales está mal.
          - punto: |
              **La zona posible**, entre el grande y los dos pequeños: el par
              $(\sigma_n, \tau_n)$ de cualquier plano del punto cae ahí.
            porque: |
              Es lo que dice el diagrama de Mohr en tres dimensiones; los
              puntos de dentro de los pequeños no corresponden a ningún plano.
          - punto: |
              **El punto más alto** del grande, $(25,\ 20)$: la tangencial
              máxima y la normal de su plano.
            porque: |
              Es lo que pide el apartado b/, y se lee en el dibujo antes de
              calcularlo.
        figura: |
          <svg viewBox="0 0 420 352" role="img" width="420" height="352" aria-labelledby="exerm1415-1par-4-tres-principales-de-traccion-y-cuatro-criterios-mohr-dib-t exerm1415-1par-4-tres-principales-de-traccion-y-cuatro-criterios-mohr-dib-d">
          <title id="exerm1415-1par-4-tres-principales-de-traccion-y-cuatro-criterios-mohr-dib-t">Los tres círculos de Mohr del punto con σ1 = 45, σ2 = 35 y σ3 = 5 MPa</title>
          <desc id="exerm1415-1par-4-tres-principales-de-traccion-y-cuatro-criterios-mohr-dib-d">Plano de Mohr con σ en abscisas y τ en ordenadas, en MPa. Sobre el eje σ están las tres tensiones principales: σ3 = 5, σ2 = 35 y σ1 = 45. Tres círculos con el centro en el eje: el grande, de 5 a 45, centrado en 25 y de radio 20; uno de 5 a 35, centrado en 20 y de radio 15; y uno pequeño, de 35 a 45, centrado en 40 y de radio 5. La zona entre el grande y los dos pequeños está sombreada: son los pares (σ, τ) de los planos posibles del punto. El punto más alto del grande, τmáx = 20 MPa, está sobre σ = 25 MPa.</desc>
          <circle cx="204.5" cy="176" r="130" fill="var(--live)" fill-opacity=".12" stroke="var(--live)" stroke-width="1.6"/>
          <circle cx="172" cy="176" r="97.5" fill="var(--paper)" stroke="var(--live)" stroke-width="1.6"/>
          <circle cx="302" cy="176" r="32.5" fill="var(--paper)" stroke="var(--live)" stroke-width="1.6"/>
          <line x1="22.5" y1="176" x2="380.5" y2="176" stroke="var(--ink)" stroke-width="1.1"/><polygon points="386.5,176 379.5,179 379.5,173" fill="var(--ink)"/>
          <line x1="42" y1="325.5" x2="42" y2="22.8" stroke="var(--ink)" stroke-width="1.1"/><polygon points="42,16.8 45,23.8 39,23.8" fill="var(--ink)"/>
          <text x="386.5" y="194" font-size="15" fill="var(--ink)" font-style="italic" text-anchor="end">σ</text>
          <text x="50" y="26.8" font-size="15" fill="var(--ink)" font-style="italic">τ</text>
          <text x="37" y="192" font-size="11" fill="var(--ink)" text-anchor="end">0</text>
          <circle cx="74.5" cy="176" r="2.6" fill="var(--ink)"/>
          <text x="74.5" y="193" font-size="11" fill="var(--ink)" text-anchor="middle" stroke="var(--paper)" stroke-width="3" paint-order="stroke">5</text>
          <circle cx="269.5" cy="176" r="2.6" fill="var(--ink)"/>
          <text x="267.5" y="193" font-size="11" fill="var(--ink)" text-anchor="middle" stroke="var(--paper)" stroke-width="3" paint-order="stroke">35</text>
          <circle cx="334.5" cy="176" r="2.6" fill="var(--ink)"/>
          <text x="338.5" y="193" font-size="11" fill="var(--ink)" text-anchor="middle" stroke="var(--paper)" stroke-width="3" paint-order="stroke">45</text>
          <text x="77.5" y="169" font-size="12" fill="var(--ink)" stroke="var(--paper)" stroke-width="3" paint-order="stroke">σ₃</text>
          <text x="266.5" y="169" font-size="12" fill="var(--ink)" text-anchor="end" stroke="var(--paper)" stroke-width="3" paint-order="stroke">σ₂</text>
          <text x="338.5" y="169" font-size="12" fill="var(--ink)" stroke="var(--paper)" stroke-width="3" paint-order="stroke">σ₁</text>
          <circle cx="204.5" cy="46" r="3" fill="var(--ink)"/>
          <path d="M204.5 46 V176" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
          <text x="212.5" y="40" font-size="12" fill="var(--ink)" stroke="var(--paper)" stroke-width="3" paint-order="stroke">τmáx = 20</text>
          <text x="200.5" y="193" font-size="11" fill="var(--ink)" text-anchor="end" stroke="var(--paper)" stroke-width="3" paint-order="stroke">25</text>
          <text x="14" y="344" font-size="11" fill="var(--ink)">σ y τ en MPa. Lo sombreado son los planos posibles del punto.</text>
          </svg>
      - tipo: calcular
        titulo: La normal en el plano de la tangencial máxima
        pregunta: |
          ¿Cuánto vale la tensión normal en el plano de la tangencial máxima,
          en MPa?
        respuesta:
          tipo: numero
          valor: '25'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '20'
            mensaje: |
              Es la tangencial de ese plano, el radio. La normal es la abscisa
              del punto más alto: el centro del círculo grande.
          - valor: '40'
            mensaje: |
              Es el centro del círculo pequeño, el de 35 y 45. La tangencial
              máxima está en el grande, el de 5 y 45.
        pista: |
          El punto más alto del círculo grande está sobre su centro,
          $\tfrac12(\sigma_1 + \sigma_3)$.
        desarrollo: |
          $$
          \sigma_n = \tfrac12\,(\sigma_1 + \sigma_3) = \tfrac12\,(45 + 5) = 25\ \text{MPa}
          $$

          en el plano a 45° de las direcciones 1 y 3, que contiene a la 2.
      - tipo: calcular
        titulo: El factor de máxima tensión (Rankine)
        pregunta: |
          ¿Cuánto vale el factor de seguridad según el criterio de máxima
          tensión, con $\sigma_L = 80$ MPa?
        respuesta:
          tipo: numero
          valor: '1.7778'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '2.2857'
            mensaje: |
              Has usado 35 MPa, la mayor de las dos que da el enunciado. La
              tercera, 45, es mayor y es la que manda.
          - valor: '4'
            mensaje: |
              Has comparado la tangencial máxima con $\sigma_L$. El criterio de
              máxima tensión mira la **normal** mayor (ec. 6.3).
        pista: |
          $\sigma_{eqv} = |\sigma|_{max}$ (ecs. 6.3 y 6.4) y
          $FS = \sigma_L/\sigma_{eqv}$.
        desarrollo: |
          $$
          FS = \frac{\sigma_L}{\sigma_1} = \frac{80}{45} = 1{,}778
          $$
      - tipo: calcular
        titulo: El factor de máxima deformación (Saint-Venant)
        pregunta: |
          ¿Y según el criterio de máxima deformación?
        respuesta:
          tipo: numero
          valor: '2.4242'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '1.4035'
            mensaje: |
              Has sumado el efecto Poisson: $45 + 0{,}3\,(35 + 5) = 57$. Las
              otras dos tracciones **acortan** la fibra 1:
              $\varepsilon_1 = [45 - 0{,}3\,(35 + 5)]/E$.
          - valor: '1.7778'
            mensaje: |
              Es $80/45$, sin Poisson: eso es Rankine. La deformación de la
              fibra 1 depende también de $\sigma_2$ y $\sigma_3$ (ec. 6.7).
        pista: |
          $\sigma_{eqv} = E\,|\varepsilon|_{max}$, con
          $\varepsilon_1 = [\sigma_1 - \nu(\sigma_2 + \sigma_3)]/E$ (ecs. 6.6 y
          6.7). Mira también $\varepsilon_3$.
        desarrollo: |
          $$
          E\varepsilon_1 = 45 - 0{,}3\,(35 + 5) = 33\ \text{MPa}, \qquad
          E\varepsilon_3 = 5 - 0{,}3\,(45 + 35) = -19\ \text{MPa}
          $$

          La mayor en valor absoluto es la 1, de alargamiento:
          $\sigma_{eqv} = 33$ MPa y $FS = 80/33 = 2{,}424$. $E$ se va: solo
          haría falta para la deformación misma, $\varepsilon_1 = 33/(2\cdot10^{5}) = 1{,}65\cdot10^{-4}$.
      - tipo: calcular
        titulo: El factor de Tresca
        pregunta: |
          ¿Y según Tresca?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '4'
            mensaje: |
              Has comparado $\tau_{max} = 20$ con $\sigma_L$. En tracción
              simple la tangencial máxima es la mitad de $\sigma$: Tresca
              compara $\sigma_1 - \sigma_3 = 40$ con $\sigma_L$ (ec. 6.19).
          - valor: '2.6667'
            mensaje: |
              Has usado las dos que da el enunciado, $35 - 5 = 30$. La
              diferencia que cuenta es entre la mayor y la menor de las tres,
              $45 - 5$.
        pista: |
          $\sigma_{eqv} = \sigma_1 - \sigma_3$ (ec. 6.19).
        desarrollo: |
          $$
          \sigma_{eqv} = 45 - 5 = 40\ \text{MPa}, \qquad FS = \frac{80}{40} = 2
          $$
      - tipo: calcular
        titulo: El factor de von Mises
        pregunta: |
          ¿Y según von Mises?
        respuesta:
          tipo: numero
          valor: '2.2188'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '1.5689'
            mensaje: |
              Te falta el $\tfrac12$ dentro de la raíz (o el $1/\sqrt2$
              fuera): sin él, $\sigma_{eqv} = \sqrt{2600} = 51$ MPa, y la
              tracción simple ya no daría $\sigma_{eqv} = \sigma$.
          - valor: '1.8727'
            mensaje: |
              Has usado la fórmula de tensión plana,
              $\sqrt{\sigma_1^{2} - \sigma_1\sigma_2 + \sigma_2^{2}}$, con 45 y
              5. Aquí ninguna de las tres es nula: hace falta la de las tres
              principales (ec. 6.29).
        pista: |
          $\sigma_{eqv} = \tfrac{1}{\sqrt2}\sqrt{(\sigma_1 - \sigma_2)^{2} + (\sigma_2 - \sigma_3)^{2} + (\sigma_3 - \sigma_1)^{2}}$
          (ec. 6.29).
        desarrollo: |
          $$
          \sigma_{eqv} = \sqrt{\tfrac12\,(10^{2} + 30^{2} + 40^{2})} = \sqrt{1300} = 36{,}06\ \text{MPa},
          \qquad FS = \frac{80}{36{,}06} = 2{,}219
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con 5 y 35 de extremos, $\tau_{max}$ sería 15: la que falta es la
              mayor, $\sigma_1 = 5 + 2\cdot20 = 45$ MPa.
          - texto: >-
              Los tres círculos van de 5 a 45, de 5 a 35 y de 35 a 45, y la
              normal en el plano de $\tau_{max}$ es el centro del grande, 25
              MPa.
          - texto: >-
              Rankine: $80/45 = 1{,}78$. Saint-Venant:
              $E\varepsilon_1 = 33$ MPa, $80/33 = 2{,}42$.
          - texto: >-
              Tresca: $80/(45 - 5) = 2$. Von Mises:
              $\sigma_{eqv} = \sqrt{1300} = 36{,}06$ MPa, $80/36{,}06 = 2{,}22$.
          - texto: >-
              Como las tres son de tracción, Tresca se aplica como en tensión
              plana, con la tercera nula: $\sigma_{eqv} = \sigma_1 = 45$ MPa.
            trampa: true
            mensaje: |
              Ninguna de las tres es nula: la menor es 5 MPa, y Tresca usa
              $\sigma_1 - \sigma_3 = 40$. Tomar $\sigma_3 = 0$ solo vale en
              tensión plana con las dos del plano del mismo signo, y aquí el
              punto es triaxial.
    resolucion: |
      **La tercera principal.** La tangencial máxima es el radio del círculo
      de Mohr mayor, $\tau_{max} = \tfrac12(\sigma_1 - \sigma_3)$ (tema 6,
      ec. 6.17). Si 5 y 35 MPa fueran la menor y la mayor, saldría
      $(35 - 5)/2 = 15$ MPa, no 20. La que falta está fuera de ese intervalo:
      $5 + 2\cdot20 = 45$ MPa por arriba, o $35 - 2\cdot20 = -5$ MPa por
      abajo, que no es de tracción. Así

      $$
      \sigma_1 = 45\ \text{MPa}, \qquad \sigma_2 = 35\ \text{MPa}, \qquad \sigma_3 = 5\ \text{MPa}
      $$

      **a/ Los círculos de Mohr** (tema 2, apartado 2.6.2):

      | planos | de … a … (MPa) | centro (MPa) | radio (MPa) |
      |---|---|---|---|
      | que contienen la 2 | 5 a 45 | 25 | 20 |
      | que contienen la 1 | 5 a 35 | 20 | 15 |
      | que contienen la 3 | 35 a 45 | 40 | 5 |

      <figure class="figura-examen">
      <svg viewBox="0 0 420 352" role="img" width="420" height="352" aria-labelledby="exerm1415-1par-4-tres-principales-de-traccion-y-cuatro-criterios-mohr-t exerm1415-1par-4-tres-principales-de-traccion-y-cuatro-criterios-mohr-d">
      <title id="exerm1415-1par-4-tres-principales-de-traccion-y-cuatro-criterios-mohr-t">Los tres círculos de Mohr del punto con σ1 = 45, σ2 = 35 y σ3 = 5 MPa</title>
      <desc id="exerm1415-1par-4-tres-principales-de-traccion-y-cuatro-criterios-mohr-d">Plano de Mohr con σ en abscisas y τ en ordenadas, en MPa. Sobre el eje σ están las tres tensiones principales: σ3 = 5, σ2 = 35 y σ1 = 45. Tres círculos con el centro en el eje: el grande, de 5 a 45, centrado en 25 y de radio 20; uno de 5 a 35, centrado en 20 y de radio 15; y uno pequeño, de 35 a 45, centrado en 40 y de radio 5. La zona entre el grande y los dos pequeños está sombreada: son los pares (σ, τ) de los planos posibles del punto. El punto más alto del grande, τmáx = 20 MPa, está sobre σ = 25 MPa.</desc>
      <circle cx="204.5" cy="176" r="130" fill="var(--live)" fill-opacity=".12" stroke="var(--live)" stroke-width="1.6"/>
      <circle cx="172" cy="176" r="97.5" fill="var(--paper)" stroke="var(--live)" stroke-width="1.6"/>
      <circle cx="302" cy="176" r="32.5" fill="var(--paper)" stroke="var(--live)" stroke-width="1.6"/>
      <line x1="22.5" y1="176" x2="380.5" y2="176" stroke="var(--ink)" stroke-width="1.1"/><polygon points="386.5,176 379.5,179 379.5,173" fill="var(--ink)"/>
      <line x1="42" y1="325.5" x2="42" y2="22.8" stroke="var(--ink)" stroke-width="1.1"/><polygon points="42,16.8 45,23.8 39,23.8" fill="var(--ink)"/>
      <text x="386.5" y="194" font-size="15" fill="var(--ink)" font-style="italic" text-anchor="end">σ</text>
      <text x="50" y="26.8" font-size="15" fill="var(--ink)" font-style="italic">τ</text>
      <text x="37" y="192" font-size="11" fill="var(--ink)" text-anchor="end">0</text>
      <circle cx="74.5" cy="176" r="2.6" fill="var(--ink)"/>
      <text x="74.5" y="193" font-size="11" fill="var(--ink)" text-anchor="middle" stroke="var(--paper)" stroke-width="3" paint-order="stroke">5</text>
      <circle cx="269.5" cy="176" r="2.6" fill="var(--ink)"/>
      <text x="267.5" y="193" font-size="11" fill="var(--ink)" text-anchor="middle" stroke="var(--paper)" stroke-width="3" paint-order="stroke">35</text>
      <circle cx="334.5" cy="176" r="2.6" fill="var(--ink)"/>
      <text x="338.5" y="193" font-size="11" fill="var(--ink)" text-anchor="middle" stroke="var(--paper)" stroke-width="3" paint-order="stroke">45</text>
      <text x="77.5" y="169" font-size="12" fill="var(--ink)" stroke="var(--paper)" stroke-width="3" paint-order="stroke">σ₃</text>
      <text x="266.5" y="169" font-size="12" fill="var(--ink)" text-anchor="end" stroke="var(--paper)" stroke-width="3" paint-order="stroke">σ₂</text>
      <text x="338.5" y="169" font-size="12" fill="var(--ink)" stroke="var(--paper)" stroke-width="3" paint-order="stroke">σ₁</text>
      <circle cx="204.5" cy="46" r="3" fill="var(--ink)"/>
      <path d="M204.5 46 V176" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
      <text x="212.5" y="40" font-size="12" fill="var(--ink)" stroke="var(--paper)" stroke-width="3" paint-order="stroke">τmáx = 20</text>
      <text x="200.5" y="193" font-size="11" fill="var(--ink)" text-anchor="end" stroke="var(--paper)" stroke-width="3" paint-order="stroke">25</text>
      <text x="14" y="344" font-size="11" fill="var(--ink)">σ y τ en MPa. Lo sombreado son los planos posibles del punto.</text>
      </svg>
      <figcaption>

      Nuestra, a escala. Lo sombreado, entre el círculo grande y los dos
      pequeños, son los pares (σ, τ) de los planos que puede tener el
      punto.

      </figcaption>
      </figure>

      **b/ La normal en el plano de $\tau_{max}$.** Es el punto más alto del
      círculo grande, sobre su centro:

      $$
      \sigma_n = \tfrac12\,(\sigma_1 + \sigma_3) = \tfrac12\,(45 + 5) = 25\ \text{MPa}
      $$

      en el plano que contiene la dirección 2 y forma 45° con la 1 y con la 3.

      **c/ Los factores de seguridad**, con $\sigma_L = 80$ MPa y
      $FS = \sigma_L/\sigma_{eqv}$ (ec. 6.1):

      - **Máxima tensión** (Rankine, ec. 6.3): $\sigma_{eqv} = 45$ MPa,
        $FS = 80/45 = 1{,}778$.
      - **Máxima deformación** (Saint-Venant, ecs. 6.6 y 6.7):
        $E\varepsilon_1 = 45 - 0{,}3\,(35 + 5) = 33$ MPa,
        $E\varepsilon_2 = 35 - 0{,}3\,(45 + 5) = 20$ MPa y
        $E\varepsilon_3 = 5 - 0{,}3\,(45 + 35) = -19$ MPa. La mayor en valor
        absoluto es la 1: $\sigma_{eqv} = 33$ MPa, $FS = 80/33 = 2{,}424$.
        $E$ no hace falta para el factor.
      - **Tresca** (ec. 6.19): $\sigma_{eqv} = 45 - 5 = 40$ MPa,
        $FS = 80/40 = 2$.
      - **Von Mises** (ec. 6.29):
        $\sigma_{eqv} = \sqrt{\tfrac12\,(10^{2} + 30^{2} + 40^{2})} = 36{,}06$ MPa,
        $FS = 80/36{,}06 = 2{,}219$.

      El más exigente es Rankine, porque las tres son de tracción y la mayor
      manda; von Mises queda entre Tresca y Saint-Venant.

      **Comprobación.** El motor del curso da los mismos círculos, la misma
      normal en el plano a 45° de 1 y 3 (y su tangencial, 20 MPa) y los
      mismos cuatro factores, y las fórmulas de los apuntes escritas a mano
      también.

  # ── Problema 1 · el prisma entre dos placas rígidas unidas por cables.
  #    Es el ejercicio 4.6 de clase, y se parece al 1 del parcial de 2012-2013.
  - id: exerm1415-1par-5-el-prisma-entre-placas-y-cables
    titulo: El prisma comprimido en x entre dos placas rígidas unidas por cuatro cables
    fuente: >-
      Ejercicio 1 · Primer parcial de 2014-2015 (hoja de ejercicios del 17 de
      noviembre de 2014) · Elasticidad y Resistencia de Materiales, Escuela
      Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 2 puntos. Es,
      con las mismas palabras y la misma figura, el ejercicio 4.6 de los
      enunciados de clase del tema 4, que no trae resolución; y se parece al
      ejercicio 1 del primer parcial de 2012-2013, que lo cuenta con otra
      redacción y pide además la variación de volumen. El
      examen no publica resolución; el desarrollo es nuestro, con la ley de
      Hooke generalizada de los apuntes del tema 4 (ecs. 4.2 y 4.3, pp. 4-5).
    nivel: examen
    enunciado: |
      (2p) El prisma B de la figura tiene base cuadrada y se sitúa entre dos
      placas rígidas. Las placas se unen mediante 4 cables dispuestos
      simétricamente, dos de los cuales se muestran en la figura. Se aplica la
      presión $p$ al cuerpo B en las caras perpendiculares al eje $x$. Las
      dimensiones de B en los ejes $x$, $y$, $z$ son $a$, $5a$, $a$,
      respectivamente. El módulo de elasticidad de B es $E$ y el coeficiente
      de Poisson $\nu$=0,1. El módulo elástico de cada cable es (10$E$) y el
      área de la sección $A = \frac{1}{400}a^{2}$ . Despreciando el peso del
      prisma y de las placas, determinar en función de $p$ y $E$ :

      a/ La tensión en los cables,$\sigma_0$.

      b/ Las tensiones principales $\sigma_x$,$\sigma_y$,$\sigma_z$ en el
      prisma.

      <figure class="figura-examen">
      <svg viewBox="0 0 475 292" role="img" width="475" height="292" aria-labelledby="exerm1415-1par-5-el-prisma-entre-placas-y-cables-fig-t exerm1415-1par-5-el-prisma-entre-placas-y-cables-fig-d">
      <title id="exerm1415-1par-5-el-prisma-entre-placas-y-cables-fig-t">El prisma B entre dos placas rígidas unidas por cables, con la presión p en las caras perpendiculares a x</title>
      <desc id="exerm1415-1par-5-el-prisma-entre-placas-y-cables-fig-d">Dos placas rígidas horizontales, rayadas, una arriba y otra abajo. Entre ellas, en el centro, el prisma B, gris, apoyado en las dos. Cerca de los bordes izquierdo y derecho, dos cables verticales gruesos unen las dos placas. Siete flechas horizontales a cada lado empujan las caras izquierda y derecha del prisma hacia dentro: la presión p. A la derecha, los ejes: y vertical hacia arriba y x horizontal hacia la derecha. No está a escala: el prisma mide a en x y 5a en y.</desc>
