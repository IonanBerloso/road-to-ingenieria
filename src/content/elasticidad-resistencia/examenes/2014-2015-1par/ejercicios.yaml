      <figcaption>

      Redibujada del PDF del examen, a escala y con sus rótulos: los números
      de las barras en un círculo y los ángulos con el ordinal, «30º», como
      en el original.

      </figcaption>
      </figure>

      **Notas nuestras.** A es un apoyo fijo y B, un apoyo móvil sobre suelo
      horizontal. Con los dos ángulos de 30° en
      A, la barra 1 (AC) va a 30° y la 2 (AD), a 60° de la horizontal; C y D
      están en la vertical del punto medio de AB.
    pide: >-
      Las fuerzas axiles de las cinco barras, en función de P, con su signo
      (tracción positiva).
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado da $E$, $A$ y $L$. ¿Hacen falta para las fuerzas?
        opciones:
          - texto: >-
              No: la estructura es isostática, 5 barras y 3 reacciones son 8
              incógnitas, las mismas que las 2·4 ecuaciones de los nudos, y
              las fuerzas salen solo del equilibrio
            correcta: true
            mensaje: |
              Eso es: en un sistema isostático bastan las ecuaciones de la
              Estática (apuntes del tema 8, apartado 8.1). $E$, $A$ y $L$ harían
              falta para los desplazamientos, por ejemplo el descenso de C,
              que el enunciado no pide.
          - texto: >-
              Sí: la barra 5 sobra para el equilibrio, así que es hiperestática
              y hace falta la compatibilidad
            mensaje: |
              Sin la barra 5, A, C, B y D forman un cuadrilátero sin
              diagonal y, con B sobre rodillos, se deforma: sería un
              mecanismo, con 7 incógnitas para 8 ecuaciones. La 5 es
              necesaria, y con ella la cuenta cuadra: 8 y 8.
          - texto: >-
              Sí: si el enunciado da $E$ y $A$, es que hay que usarlos
            mensaje: |
              Dar los datos del material no hace a una estructura
              hiperestática. Lo decide la cuenta de incógnitas y ecuaciones:
              aquí 5 + 3 = 2·4. Si B fuera un apoyo fijo, sí sería
              hiperestática de grado 1, y $N_1$ saldría $-0{,}519\,P$.
          - texto: >-
              Solo $L$: con los ángulos de la figura y $L$ salen las
              longitudes, y las fuerzas dependen de ellas
            mensaje: |
              En una estructura isostática las fuerzas dependen de los
              **ángulos**, no del tamaño: con el doble de $L$ salen las mismas.
              $L$ solo entra en los alargamientos.
      - tipo: calcular
        titulo: La fuerza en la barra 1
        pregunta: |
          ¿Cuánto vale $N_1$, la fuerza en la barra AC, en unidades de $P$
          (positiva si es de tracción)?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.002
          formato: un número con su signo, en unidades de P
        distractores:
          - valor: '-0.5'
            mensaje: |
              El valor es ese, pero el signo no. En el nudo A la reacción sube
              $P/2$; la barra 2, de compresión, empuja A hacia abajo y a la
              izquierda, y la 1 tiene que tirar de A hacia C para cerrar las
              fuerzas en horizontal: tracción.
          - valor: '1'
            mensaje: |
              Has puesto toda la carga en la reacción de A, $P$. Por simetría,
              A y B se reparten $P$: $R_A = R_B = P/2$. Con $P$ en A, el nudo
              A da justo el doble.
        pista: |
          Reacciones por simetría, $R_A = R_B = P/2$ y $R_{Ax} = 0$. Luego, el
          nudo A, con las barras 1 (a 30°) y 2 (a 60°).
        desarrollo: |
          Nudo A, con las dos barras en tracción supuesta (tiran de A hacia
          fuera del nudo):

          $$
          \begin{aligned}
          \textstyle\sum F_x &= N_1\cos30^\circ + N_2\cos60^\circ = 0\\
          \textstyle\sum F_y &= N_1\operatorname{sen}30^\circ + N_2\operatorname{sen}60^\circ + \tfrac{P}{2} = 0
          \end{aligned}
          $$

          De la primera, $N_1 = -N_2/\sqrt3$; en la segunda,
          $N_2\,(\sqrt3/2 - 1/(2\sqrt3)) = N_2/\sqrt3 = -P/2$. Así

          $$
          N_2 = -\frac{\sqrt3}{2}\,P, \qquad N_1 = \frac{P}{2}
          $$
      - tipo: calcular
        titulo: La fuerza en la barra 2
        pregunta: |
          ¿Cuánto vale $N_2$, la fuerza en la barra AD, en unidades de $P$
          (positiva si es de tracción)?
        respuesta:
          tipo: numero
          valor: '-0.8660'
          tolerancia: 0.002
          formato: un número con su signo, en unidades de P
        distractores:
          - valor: '0.8660'
            mensaje: |
              El valor es ese, pero la barra 2 empuja: es la que sostiene el
              nudo A contra la reacción que sube. En el nudo A,
              $N_2\operatorname{sen}60^\circ = -P/2 - N_1\operatorname{sen}30^\circ$,
              negativa.
          - valor: '-1.7321'
            mensaje: |
              Has puesto toda la carga en la reacción de A, $P$ en vez de
              $P/2$. La estructura y la carga son simétricas: cada apoyo lleva
              la mitad.
        pista: |
          Las mismas dos ecuaciones del nudo A; o la simetría, que da
          $N_3 = N_2$, y el nudo D.
        desarrollo: |
          Del nudo A, $N_2 = -\tfrac{\sqrt3}{2}\,P \approx -0{,}866\,P$, de
          compresión. Por simetría, $N_3 = N_2$ y $N_4 = N_1$.
      - tipo: calcular
        titulo: La fuerza en la barra 5
        pregunta: |
          ¿Cuánto vale $N_5$, la fuerza en la barra vertical CD, en unidades
          de $P$ (positiva si es de tracción)?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.002
          formato: un número con su signo, en unidades de P
        distractores:
          - valor: '1'
            mensaje: |
              Has hecho que la barra 5 cuelgue la carga sola. En C también
              llegan las barras 1 y 4, de tracción, que tiran de C hacia abajo:
              la 5 tiene que sostener $P$ más esas dos componentes.
          - valor: '-1.5'
            mensaje: |
              El valor es ese, pero la barra 5 tira de C hacia arriba: C cuelga
              de ella. Es de tracción.
        pista: |
          Nudo C, en vertical: las barras 1 y 4 tiran de C hacia abajo, a 30°,
          y la 5 hacia arriba.
        desarrollo: |
          Nudo C, en vertical, con $N_1 = N_4 = P/2$:

          $$
          N_5 - N_1\operatorname{sen}30^\circ - N_4\operatorname{sen}30^\circ - P = 0
          \;\Longrightarrow\; N_5 = P + 2\cdot\frac{P}{2}\cdot\frac12 = \frac32\,P
          $$

          El nudo D, que no se ha usado, lo comprueba:
          $-2N_2\operatorname{sen}60^\circ - N_5 = \tfrac32 P - \tfrac32 P = 0$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              5 barras + 3 reacciones = 2·4 ecuaciones: isostática, solo
              equilibrio.
          - texto: >-
              Por simetría, $R_A = R_B = P/2$; el nudo A da
              $N_1 = P/2$ y $N_2 = -\tfrac{\sqrt3}{2}P$.
          - texto: >-
              Por simetría, $N_4 = N_1$ y $N_3 = N_2$.
          - texto: >-
              El nudo C, en vertical, da
              $N_5 = P + 2\,N_1\operatorname{sen}30^\circ = \tfrac32 P$; el
              nudo D lo comprueba.
          - texto: >-
              La barra 5 es la única vertical que llega a C, así que lleva
              exactamente la carga: $N_5 = P$.
            trampa: true
            mensaje: |
              A C llegan también las barras 1 y 4, y están en tracción:
              tiran de C hacia abajo, cada una con $N_1\operatorname{sen}30^\circ = P/4$.
              La 5 sostiene $P$ más esas dos: $\tfrac32 P$.
    resolucion: |
      **Isostática.** Cinco barras y tres reacciones (dos en A, fijo, y una
      vertical en B, móvil) son ocho incógnitas, y cuatro nudos dan ocho
      ecuaciones: es un sistema isostático y las fuerzas salen solo de las
      ecuaciones de la Estática (apuntes del tema 8, apartado 8.1, p. 4). $E$,
      $A$ y $L$ no hacen falta para ellas.

      **Reacciones.** Estructura y carga son simétricas respecto a la vertical
      de C: $R_A = R_B = P/2$, hacia arriba, y la horizontal de A es nula.

      **Nudo A** (tracción positiva; cada barra tira del nudo hacia su otro
      extremo):

      $$
      N_1\cos30^\circ + N_2\cos60^\circ = 0, \qquad
      N_1\operatorname{sen}30^\circ + N_2\operatorname{sen}60^\circ + \frac{P}{2} = 0
      $$

      $$
      N_1 = \frac{P}{2}, \qquad N_2 = -\frac{\sqrt3}{2}\,P \approx -0{,}866\,P
      $$

      **Simetría:** $N_4 = N_1$ y $N_3 = N_2$.

      **Nudo C**, en vertical:

      $$
      N_5 = P + 2\,N_1\operatorname{sen}30^\circ = \frac32\,P
      $$

      **Nudo D** (comprobación):
      $-N_2\operatorname{sen}60^\circ - N_3\operatorname{sen}60^\circ - N_5 = \tfrac34 P + \tfrac34 P - \tfrac32 P = 0$.

      | barra | nudos | longitud | $N$ | |
      |---|---|---|---|---|
      | 1 | A-C | $2L/\sqrt3$ | $P/2$ | tracción |
      | 2 | A-D | $2L$ | $-\tfrac{\sqrt3}{2}P$ | compresión |
      | 3 | B-D | $2L$ | $-\tfrac{\sqrt3}{2}P$ | compresión |
      | 4 | B-C | $2L/\sqrt3$ | $P/2$ | tracción |
      | 5 | C-D | $2L/\sqrt3$ | $\tfrac32 P$ | tracción |

      **Para qué sirven $E$, $A$ y $L$.** Para los movimientos, que el
      enunciado no pide. Por ejemplo, el descenso de C, por el trabajo virtual
      con una carga unidad en C (que da $n_i = N_i/P$):

      $$
      \delta_C = \sum\frac{N_i\,n_i\,L_i}{EA} = \frac{PL}{EA}\left[2\cdot\frac14\cdot\frac{2}{\sqrt3} + 2\cdot\frac34\cdot2 + \frac94\cdot\frac{2}{\sqrt3}\right] = \left(3 + \frac{11}{2\sqrt3}\right)\frac{PL}{EA}
      $$

      y $3 + \frac{11}{2\sqrt3} \approx 6{,}175$: $\delta_C \approx 6{,}175\,PL/EA$.

      **Comprobación.** El motor del curso, con los cuatro nudos, el apoyo fijo
      en A y el móvil en B, da las mismas cinco fuerzas y el mismo descenso de
      C; los nudos a mano, arriba, también, y el nudo D cierra.

