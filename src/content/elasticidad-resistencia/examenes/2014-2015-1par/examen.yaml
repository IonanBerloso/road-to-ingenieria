asignatura: elasticidad-resistencia
curso: '2014-2015'
convocatoria: primer-parcial
fecha: 10 y 17 de noviembre de 2014
# El primer parcial de Elasticidad y Resistencia de Materiales de 2014-2015
# («Parte 1» en la cabecera), hecho en dos días: la hoja de TEORÍA, fechada el
# 10-11-2014, con cuatro preguntas de 1 punto, y la de ejercicios, fechada el
# 17-11-2014, con tres de 2 puntos. Dos páginas, solo en castellano, y diez
# puntos que el cuadernillo imprime todos. La cabecera es de la Escuela
# Universitaria Politécnica de San Sebastián.
#
# Se transcribe tal cual, con sus puntos impresos. Lo que hay que saber de
# ese texto, dicho antes de que nadie lo deduzca:
#
# 1. **EL PDF TRAE LAS FIGURAS ENTERAS.** Se han comparado con el Word
#    original (14-ERM-nov1.doc) y no les falta nada: las tres se redibujan
#    del PDF. Lo único que el texto del PDF pierde es la ecuación del área de
#    los cables del ejercicio 1, que es un objeto de ecuación; el Word la da:
#    A = (1/400)a². Las figuras de los ejercicios 1 y 3 (la sección) no
#    están a escala, y sus pies lo dicen.
#
# 2. **EL PAR EN LA RÓTULA DEL EJERCICIO 3.** El enunciado pone la fuerza
#    q0a y el momento q0a² «en la rótula B». Un par justo en una rótula no
#    dice sobre cuál de los dos tramos actúa (el motor del curso lo rechaza
#    así). Se toma sobre el extremo de AB: R_A = q0a, a BCD no le llega
#    fuerza de la rótula y el flector máximo es q0a², justo a la izquierda de
#    B; t = 19,96 mm. La otra lectura, sobre el extremo de BCD, da
#    R_C = 3,5 q0a, un máximo de −2q0a² en C y t = 25,15 mm: se resuelve
#    también y entra como «también vale» en los tres pasos que dependen de
#    ella. El par es antihorario por su flecha. El enunciado tampoco dice
#    el espesor de cada pared: se toma t en todas, con las cotas impresas,
#    12t y 15t, por fuera; σon es la tensión normal admisible, la misma a
#    tracción y a compresión.
#
# 3. **EL EJERCICIO 2 ES ISOSTÁTICO.** Cinco barras y tres reacciones (B es
#    un apoyo móvil) frente a ocho ecuaciones de nudo: las fuerzas salen solo
#    del equilibrio, y los datos E, A y L no hacen falta para ellas. La
#    resolución los usa para el descenso de C, que no se pide.
#
# 4. **ERRATAS Y RAREZAS DEL TEXTO, CONSERVADAS**: «(2p)En» sin espacio
#    (ejercicio 2); «3.-(2p)» con guion en el ejercicio 3, frente a «1.» y
#    «2.» en los otros (los números impresos no se transcriben); «4m» sin
#    espacio, «a .» y «σon» (ejercicio 3); «E :» y «A = (1/400)a² .» con
#    espacio, «ν=0,1» sin espacios, «cables,σ0» y «σx,σy,σz» sin espacio
#    (ejercicio 1); «Von Mises» con mayúscula (teoría 4); y los ángulos de
#    la figura del ejercicio 2, con el ordinal, «30º». La hoja de teoría
#    imprime los tres datos de la teoría 4 en líneas sueltas, sin viñetas,
#    y así se transcriben.
#
# 5. **DOS NUMERACIONES.** La teoría va de 1 a 4 y los ejercicios vuelven a
#    empezar en 1. Aquí la teoría son n 1 a 4 y los ejercicios n 5, 6 y 7;
#    la `fuente` de cada ejercicio dice el nombre impreso.
#
# 6. **TRES PREGUNTAS YA CONOCIDAS.** La teoría 1 es, con las mismas
#    palabras, la 1 del primer parcial de 2019-2020, ya publicada: se
#    resuelve de nuevo, con otro ejemplo, y su `fuente` lo dice. La teoría 4
#    es, con las mismas palabras, el ejercicio 6.1 de los enunciados de clase
#    del tema 6, y sus apartados a/ y b/ son el 2.13; el ejercicio 1 es el
#    4.6 de los del tema 4 (con «E:» sin espacio) y se parece al 1 del primer
#    parcial de 2012-2013. Ninguno de los de clase trae
#    resolución en el material del curso.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso (src/lib/erm) y de un segundo camino
# (fase-p/p6c, guiones/cifras.mjs). El motor no tiene los tensores de
# deformación y rotación como tales, ni secciones ni tensiones de flexión:
# las cifras de la teoría 2 salen del campo de desplazamientos y se
# comprueban con el tensor de deformaciones del motor y la longitud exacta
# de un segmento; las de la sección del ejercicio 3 (centro de gravedad,
# Iz y espesor), de las fórmulas de los apuntes del tema 9, comprobadas
# con Iz de dos formas y con la integral de la tensión en la sección. Los
# diagramas sí son del motor. Las preguntas 1, 2 y 3 de la teoría no traen
# números: sus pasos de cálculo usan ejemplos nuestros, y lo dicen.
pdf: 2014-2015-1par.pdf
