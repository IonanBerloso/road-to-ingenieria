      - tipo: calcular
        titulo: La tensión en la esquina de arriba del ala superior
        pregunta: |
          En A⁺, ¿cuánto vale la tensión normal en la esquina de arriba a la
          izquierda del ala superior, donde el ala se une al alma, en MPa?
        respuesta:
          tipo: numero
          valor: '-37.72'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '-33.24'
            mensaje: |
              Has usado $\sigma = M_zy/I_z$, como si los ejes fueran
              principales. La sección no es simétrica y $I_{yz} \ne 0$: hay
              que usar los $M'$ del enunciado (ec. 9.12), y aparece un
              término en $z$.
          - valor: '37.72'
            mensaje: |
              El valor es ese, pero en A⁺ el flector es positivo, tracciona
              la fibra de abajo y comprime la de arriba. Con ese signo es la
              tensión del mismo punto en C, donde $M = -q_0a^2$.
          - valor: '-18.86'
            mensaje: |
              La mitad: has usado el flector de E, $q_0a^2/2$. La sección de
              flector máximo es A⁺ (o C), con $q_0a^2$.
        pista: |
          Con $y$, $z$ desde G (en mm), $\sigma = \dfrac{M'_z}{I_z}y + \dfrac{M'_y}{I_y}z$
          (ec. 9.12), con $M_y = 0$ y $M_z = q_0a^2$. El punto está en
          $y = -\overline{y}$, $z = 9{,}5t - \overline{z}$.
        desarrollo: |
          $M'_z = 67{,}446$ kN·m y $M'_y = 9{,}907$ kN·m, y

          $$
          \sigma = 0{,}146707\,y + 0{,}073245\,z\ \text{(MPa, mm)}
          $$

          En $y = -244{,}5$ mm, $z = -25{,}3$ mm:
          $\sigma = -37{,}72$ MPa, la mayor compresión.
      - tipo: calcular
        titulo: La inclinación del eje neutro
        pregunta: |
          ¿Qué ángulo forma el eje neutro con el eje $z$, en grados?
        respuesta:
          tipo: numero
          valor: '26.53'
          tolerancia: 0.05
          formato: un número, en grados
        distractores:
          - valor: '63.47'
            mensaje: |
              Es el complementario: el ángulo con el eje $y$. Con
              $\sigma = C_1y + C_2z = 0$ la pendiente es $y/z = -C_2/C_1$, y el
              ángulo con $z$ es $\arctan(C_2/C_1)$.
          - valor: '11.30'
            mensaje: |
              Ese es el ángulo de los ejes principales de inercia,
              $\tfrac{1}{2}\arctan[2I_{yz}/(I_y - I_z)]$. El eje neutro no
              coincide con ellos: depende también de cuánto más rígida es la
              sección en una dirección que en otra.
          - valor: '0'
            mensaje: |
              Sería así si $I_{yz} = 0$: con solo $M_z$, el eje neutro sería
              el eje $z$. Aquí $I_{yz} \ne 0$, $M'_y \ne 0$ y el eje neutro
              se inclina.
        pista: |
          Eje neutro: $\sigma = 0$, es decir, $y = -\dfrac{C_2}{C_1}z$, con
          $C_1 = M'_z/I_z$ y $C_2 = M'_y/I_y$.
        desarrollo: |
          $$
          \tan\beta = \frac{C_2}{C_1} = \frac{M'_yI_z}{M'_zI_y} = 0{,}4993
          \quad\Rightarrow\quad \beta = 26{,}53^\circ
          $$

          La recta es $y = -0{,}4993\,z$: con $y$ hacia
          abajo, sube hacia la derecha.
      - tipo: justificar
        pregunta: Ordena el razonamiento del apartado b. Una pieza sobra.
        piezas:
          - texto: >-
              La sección de flector máximo es A⁺ (o C), con
              $|M_z| = q_0a^2$ y $M_y = 0$.
          - texto: >-
              La sección no tiene ningún eje de simetría, así que
              $I_{yz} \ne 0$ y hay que usar la ec. 9.12 con los $M'$.
          - texto: >-
              Con $\overline{y}$, $\overline{z}$, $I_z$, $I_y$ e $I_{yz}$ salen $M'_z$ y
              $M'_y$, y la ecuación de tensiones $\sigma = C_1y + C_2z$.
          - texto: >-
              El eje neutro es $\sigma = 0$, y las tensiones extremas están en
              los puntos más alejados de él.
          - texto: >-
              El eje neutro es perpendicular al plano de carga, así que
              coincide con el eje $z$.
            trampa: true
            mensaje: |
              Eso solo pasa si $y$, $z$ son principales. Aquí
              $I_{yz} = -422{,}0t^4$ y la flexión es esviada: el eje
              neutro forma 26,53° con $z$.
    resolucion: |
      **a) Reacciones.** Con $x$ desde A y las reacciones positivas hacia
      arriba. AB, aislado por la rótula B ($M_B = 0$):
      $R_Aa + M_0 = 0$, $R_A = -q_0a$ (hacia abajo). BCD, aislado por la
      rótula D: $R_A\cdot3a + M_0 + R_Ca = 0$, $R_C = 2q_0a$. DE: la rótula
      D le pasa $R_A + R_C = q_0a$ hacia arriba, que equilibra la carga
      $q_0a$: $R_E = 0$ y $M_E = q_0a^2/2$. Con los datos, $q_0a$ = 25 kN y
      $q_0a^2$ = 62,50 kN·m.

      **Diagramas** (convenio del tema 7: $dV/dx = -q$, $dM/dx = V$, $M > 0$
      si tracciona abajo):

      | Tramo | $V$ | $M$ |
      |---|---|---|
      | AC | $-q_0a$ | $q_0a^2 - q_0ax$: $q_0a^2$ en A⁺, 0 en B, $-q_0a^2$ en C |
      | CD | $q_0a$ | $q_0a(x - 3a)$: de $-q_0a^2$ en C a 0 en D |
      | DE | $q_0a - q_0(x - 3a)$ | $q_0a(x - 3a) - \tfrac{1}{2}q_0(x - 3a)^2$: de 0 en D a $q_0a^2/2$ en E |

      $|M|_{max} = q_0a^2 = 62{,}50$ kN·m en A⁺ (positivo) y en C
      (negativo).

      **b) La sección.** En unidades de $t$, con $y$ hacia abajo desde el
      borde de arriba y $z$ desde el borde izquierdo del ala de abajo: ala
      de arriba $[9{,}5;\,18{,}5]\times[0;\,1]$, alma
      $[9{,}5;\,10{,}5]\times[1;\,19]$ y ala de abajo $[0;\,20]\times[19;\,20]$.
      $A = 47t^2$, $\overline{y} = 12{,}2234t$, $\overline{z} = 10{,}7660t$, y
      por Steiner

      $$
      I_z = 2873{,}32t^4,\qquad I_y = 845{,}34t^4,\qquad I_{yz} = -422{,}04t^4
      $$

      Con $t$ = 20 mm y $M_z = q_0a^2$, $M_y = 0$ en A⁺: los momentos de la
      ec. 9.12 que da el enunciado son $M'_z = 67{,}446$ kN·m y
      $M'_y = 9{,}907$ kN·m, y la **ecuación de tensiones** (tema 9,
      ec. 9.12), con $y$, $z$ en mm desde G:

      $$
      \sigma = \frac{M'_z}{I_z}y + \frac{M'_y}{I_y}z = 0{,}146707\,y + 0{,}073245\,z\quad\text{(MPa)}
      $$

      **Eje neutro** ($\sigma = 0$): $y = -0{,}4993\,z$,
      una recta por G que forma **26,53° con el eje $z$**
      y sube hacia la derecha.

      **Tensiones extremas**, en los puntos más alejados del eje neutro: la
      esquina de abajo a la derecha del ala inferior ($y = 155{,}5$,
      $z = 184{,}7$ mm), con $\sigma_{max} = 36{,}34$
      MPa, y la esquina de arriba a la izquierda del ala superior
      ($y = -244{,}5$, $z = -25{,}3$ mm), con
      $\sigma_{min} = -37{,}72$ MPa. En C, con $M_z = -q_0a^2$, la
      misma recta y las mismas tensiones con el signo cambiado.

      Las cifras salen del motor del curso (la viga, la sección y la
      ecuación de Navier) y, por otro camino, de las reacciones a mano, de
      Steiner y de la ec. 9.12 con los $M'$; casan.

  # ── Problema 3 · la barra quebrada con el apoyo en C (tema 13). Cae igual
  #    el mismo día como problema 4 de la final.
  - id: exerm1819-2par-7-la-barra-quebrada-con-el-apoyo-en-c
    titulo: La barra quebrada en el espacio, empotrada en A y apoyada en C, con dos cargas repartidas en BC
    fuente: >-
      Problema 3 · Segunda parte del 16 de enero de 2019 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 2 puntos. Cayó igual el mismo día como problema 4 del examen
      final, donde vale 1,5 puntos; el enunciado se transcribe sin su
      «(2p)», y cada hoja pone sus puntos. El examen no publica resolución;
      el desarrollo es nuestro, con el tema 13 y los temas 9 y 12 para las
      tensiones.
    nivel: examen
    enunciado: |
      La estructura de la figura es de sección circular, siendo $E$ = 2,5
      $G$. Los tramos AB y BC son de longitud $L$. El apoyo C impide el
      desplazamiento vertical. Determinar:

      a/ La reacción en C en función de $q_0$ y $L$, teniendo en cuenta la
      energía de flexión y torsión.

      b/ Las fuerzas y momentos de sección en el empotramiento en kN y
      (kN·m) respectivamente, según los ejes de la figura.

      c/ La tensión tangencial máxima en el empotramiento debida a la fuerza
      cortante y al momento torsor, indicando dónde está. ($z_G$: distancia
      desde la base a G de un semicírculo).

      $q_0$ = 5 kN/m, $L$ = 4 m, $R$ = 25 mm; $z_G = \frac{4R}{3\pi}$

