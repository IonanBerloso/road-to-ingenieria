      <figcaption>

      Redibujada del enunciado, en la misma perspectiva: BC sale de B hacia
      quien mira.

      </figcaption>
      </figure>

      **Notas nuestras.** AB va según $x$; BC es perpendicular al plano del
      papel y sale hacia quien mira, es decir, hacia $-z$ (con $x$ a la
      derecha, $y$ hacia abajo y $z = x \times y$ hacia dentro del papel).
      Sobre BC actúan las dos repartidas $q_0$: una vertical hacia abajo y
      otra horizontal hacia $-x$, hacia el empotramiento. El apoyo de C solo
      da reacción vertical.
    pide: >-
      La reacción de C, los seis esfuerzos en A y la tensión tangencial
      máxima en A por cortante y torsor, con el punto donde se da.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué condición da la reacción de C?
        opciones:
          - texto: >-
              Que la derivada de la coenergía respecto a la reacción de C sea
              nula, porque C no baja
            correcta: true
            mensaje: |
              Eso es: la estructura es hiperestática de grado 1, la reacción
              de C es la incógnita hiperestática y, como el desplazamiento
              que le corresponde es nulo, $\partial C/\partial R_C = 0$
              (ec. 13.52, p. 19).
          - texto: >-
              El equilibrio de momentos respecto a A
            mensaje: |
              El equilibrio de la estructura entera mete las seis reacciones
              del empotramiento además de $R_C$: hay una incógnita de más, y
              la estática sola no la da.
          - texto: >-
              Que la energía de deformación sea máxima respecto a la reacción
              de C
            mensaje: |
              Es al revés y no es máximo: el teorema de Menabrea dice que la
              incógnita hiperestática hace **estacionaria** (mínima) la
              energía, $\partial C/\partial R_C = 0$.
      - tipo: calcular
        titulo: La reacción de C
        pregunta: |
          ¿Cuánto vale la reacción de C, en kN?
        respuesta:
          tipo: numero
          valor: '11.30'
          tolerancia: 0.02
          formato: un número, en kN (hacia arriba)
        distractores:
          - valor: '13.75'
            mensaje: |
              Has dejado fuera la torsión de AB. Las cargas verticales de BC
              tuercen AB, y el enunciado pide contar esa energía:
              $\int M_t^2/(2GI_p)$ con $M_t = R_CL - q_0L^2/2$.
          - valor: '10.79'
            mensaje: |
              Has usado $GI$ en vez de $GI_p$ en la torsión. En la sección
              circular la rigidez a torsión lleva el momento polar,
              $I_p = 2I$: con $E = 2{,}5G$, $GI_p = 0{,}8EI$.
          - valor: '9.47'
            mensaje: |
              Te falta la flexión de AB. AB se dobla en el plano vertical por
              la resultante vertical que le llega de BC,
              $M = (R_C - q_0L)u$, y esa energía también depende de $R_C$.
          - valor: '10.00'
            mensaje: |
              Es la mitad de la carga vertical de BC, $q_0L/2$, lo que daría
              C si BC fuera una viga apoyada en sus dos extremos. B no es un
              apoyo: baja, porque AB se dobla y se tuerce, y C se lleva más
              de la mitad.
        pista: |
          BC: $M = R_Cs - q_0s^2/2$. AB: $M = (R_C - q_0L)u$ y
          $M_t = R_CL - q_0L^2/2$. Suma $\int M\,\partial M/\partial R_C/EI$
          y $\int M_t\,\partial M_t/\partial R_C/GI_p$, e iguala a cero.
        desarrollo: |
          $$
          \frac{L^3}{EI}\left(\frac{R_C}{3} - \frac{q_0L}{8}\right) + \frac{L^3}{EI}\,\frac{R_C - q_0L}{3} + \frac{L^3}{GI_p}\left(R_C - \frac{q_0L}{2}\right) = 0
          $$

          Con $EI/GI_p = 1{,}25$: $R_C\cdot\tfrac{23}{12} = q_0L\cdot\tfrac{26}{24}$,
          $R_C = \tfrac{13}{23}q_0L = 11{,}304$ kN.
      - tipo: calcular
        titulo: El momento torsor en el empotramiento
        pregunta: |
          ¿Cuánto vale el momento torsor en A, en valor absoluto, en kN·m?
        respuesta:
          tipo: numero
          valor: '5.217'
          tolerancia: 0.01
          formato: un número, en kN·m
        distractores:
          - valor: '45.217'
            mensaje: |
              Es solo el momento de $R_C$ respecto al eje de AB,
              $R_CL$. La carga vertical de BC también tuerce AB, con su
              resultante $q_0L$ a $L/2$ del eje, en sentido contrario.
          - valor: '40.000'
            mensaje: |
              Es el torsor sin la reacción de C, $q_0L^2/2$, como si BC fuera
              un voladizo. El apoyo de C devuelve casi todo:
              $M_t = R_CL - q_0L^2/2$.
          - valor: '34.783'
            mensaje: |
              Ese es el flector $M_z$, el de la resultante vertical
              $R_C - q_0L$ con el brazo $L$ de AB. El torsor es el momento
              respecto al eje de AB, con brazos medidos según $z$.
        pista: |
          Momento respecto al eje $x$ (AB) de lo que hay más allá de A: la
          repartida vertical de BC y $R_C$, con brazos según $z$.
        desarrollo: |
          $$
          |M_t| = \left|R_CL - \frac{q_0L^2}{2}\right| = |11{,}304\cdot4 - 40| = 5{,}217\ \text{kN·m}
          $$
      - tipo: calcular
        titulo: La tensión tangencial máxima en A
        pregunta: |
          ¿Cuánto vale la tensión tangencial máxima en A, sumando la del
          cortante y la del torsor, en MPa?
        respuesta:
          tipo: numero
          valor: '218.5'
          tolerancia: 0.3
          formato: un número, en MPa
        distractores:
          - valor: '212.6'
            mensaje: |
              Es solo la del torsor. El enunciado pide también la del
              cortante, que en el diámetro horizontal es vertical, como la
              del torsor, y en uno de sus extremos se suma.
          - valor: '206.7'
            mensaje: |
              Es la del otro extremo del diámetro horizontal, donde la del
              cortante y la del torsor van en sentidos contrarios. La
              máxima está en el extremo donde se suman.
          - valor: '431.1'
            mensaje: |
              Has dividido el torsor entre $I$ en vez de entre $I_p$. En la
              sección circular, $\tau = M_tr/I_p$ con $I_p = 2I = \pi R^4/2$.
        pista: |
          Torsor: $\tau = 2M_t/(\pi R^3)$ en todo el borde. Cortante: en el
          diámetro horizontal, $\tau = T_yQ/(Ib)$ con
          $Q = \tfrac{1}{2}\pi R^2\,z_G = \tfrac{2}{3}R^3$ y $b = 2R$.
        desarrollo: |
          $$
          \tau_{M_t} = \frac{2\cdot5\,217\,391}{\pi\cdot25^3} = 212{,}58\ \text{MPa},\qquad
          \tau_T = \frac{4T_y}{3\pi R^2} = \frac{4\cdot8695{,}7}{3\pi\cdot25^2} = 5{,}905\ \text{MPa}
          $$

          En el extremo del diámetro horizontal donde van en el mismo
          sentido: $\tau_{max} = 218{,}48$ MPa.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La estructura es hiperestática de grado 1; se toma la reacción
              de C como incógnita y se impone que C no baje,
              $\partial C/\partial R_C = 0$.
          - texto: >-
              Dependen de $R_C$ la flexión de BC, la flexión de AB en el
              plano vertical y la torsión de AB; la carga horizontal da
              esfuerzos que no dependen de $R_C$.
          - texto: >-
              Con $R_C$, los esfuerzos en A son la resultante, reducida al
              centro de A, de las cargas de BC y de $R_C$.
          - texto: >-
              En A, el torsor y el cortante dan tensiones tangenciales que en
              el diámetro horizontal son verticales, y en un extremo se suman.
          - texto: >-
              La carga horizontal de BC tuerce AB, así que entra en la
              energía de torsión que depende de $R_C$.
            trampa: true
            mensaje: |
              La carga horizontal va hacia $-x$, paralela a AB: respecto al
              eje de AB no tiene momento, no lo tuerce. Comprime AB y lo
              dobla en el plano horizontal ($M_y = q_0L^2/2$), y nada de eso
              depende de $R_C$.
    resolucion: |
      **Ejes.** $x$ según AB, de A a B; $y$ hacia abajo; $z = x\times y$,
      hacia dentro del papel. B está en $(L, 0, 0)$ y C en $(L, 0, -L)$. Con
      $E = 2{,}5G$ e $I_p = 2I$: $GI_p = 0{,}8EI$.

      **a) La reacción de C** (tema 13, apartado 13.7.2, ec. 13.52, p. 19).
      Se quita el apoyo de C y se pone $R_C$ hacia arriba. Con $s$ desde C
      en BC y $u$ desde B en AB, los esfuerzos que dependen de $R_C$ son:

      - BC, flexión en el plano vertical: $M = R_Cs - \tfrac{1}{2}q_0s^2$.
      - AB, flexión en el plano vertical: $M = (R_C - q_0L)u$.
      - AB, torsión: $M_t = R_CL - \tfrac{1}{2}q_0L^2$, constante.

      La carga horizontal comprime AB y flecta BC y AB en el plano
      horizontal, sin depender de $R_C$. Con las coenergías de la tabla de
      la p. 16:

      $$
      \frac{\partial C}{\partial R_C} = \frac{1}{EI}\int_0^L\!\left(R_Cs - \tfrac{1}{2}q_0s^2\right)s\,ds
      + \frac{1}{EI}\int_0^L\!(R_C - q_0L)u^2\,du
      + \frac{1}{GI_p}\int_0^L\!\left(R_CL - \tfrac{1}{2}q_0L^2\right)L\,du = 0
      $$

      $$
      \frac{L^3}{EI}\left[\frac{R_C}{3} - \frac{q_0L}{8} + \frac{R_C - q_0L}{3}\right] + \frac{L^3}{GI_p}\left[R_C - \frac{q_0L}{2}\right] = 0
      $$

      Con $EI/GI_p = 1{,}25$: $R_C\left(\tfrac{2}{3} + 1{,}25\right) = q_0L\left(\tfrac{1}{8} + \tfrac{1}{3} + 0{,}625\right)$,

      $$
      R_C = \frac{13}{23}\,q_0L = 11{,}304\ \text{kN (hacia arriba)}
      $$

      **b) Los esfuerzos en A.** Resultante, reducida al centro de A, de lo
      que hay más allá: las dos repartidas de BC ($q_0L$ = 20 kN cada una,
      en el centro de BC) y $R_C$. Con el convenio del curso,
      $\vec{M} = M_t\vec{i} + M_y\vec{j} - M_z\vec{k}$:

      | Esfuerzo | Expresión | Valor |
      |---|---|---|
      | $N$ | $-q_0L$ | −20,00 kN (compresión) |
      | $T_y$ | $q_0L - R_C$ | 8,696 kN |
      | $T_z$ | 0 | 0 |
      | $M_t$ | $-(R_CL - \tfrac{1}{2}q_0L^2)$ | −5,217 kN·m |
      | $M_y$ | $\tfrac{1}{2}q_0L^2$ | 40,00 kN·m |
      | $M_z$ | $(R_C - q_0L)L$ | −34,78 kN·m |

      **c) La tensión tangencial máxima.** El torsor da en todo el borde
      $\tau = 2|M_t|/(\pi R^3) = 212{,}58$ MPa (tema 12,
      ec. 12.11), tangente al contorno. El cortante $T_y$ da en el diámetro
      horizontal, el de $z$, la máxima de la sección circular (tema 9),
      vertical:

      $$
      \tau_T = \frac{T_yQ}{I\,b} = \frac{T_y\cdot\tfrac{1}{2}\pi R^2\cdot\tfrac{4R}{3\pi}}{\tfrac{1}{4}\pi R^4\cdot2R} = \frac{4T_y}{3\pi R^2} = 5{,}90\ \text{MPa}
      $$

      En los dos extremos del diámetro horizontal las dos tensiones son
      verticales; en uno se suman y en el otro se restan. Con los signos de
      $M_t$ y $T_y$, se suman en $z = +R$, el extremo de la derecha en la
      sección dibujada (el lado contrario a C):

      $$
      \tau_{max} = 212{,}58 + 5{,}90 = 218{,}48\ \text{MPa}
      $$

      En el otro extremo, $z = -R$, queda $206{,}67$ MPa.

      Las cifras salen del motor del curso (la estructura espacial con
      Menabrea, y los esfuerzos en A) y de Castigliano escrito a mano; casan.
