      <line x1="400" y1="234" x2="400" y2="260" stroke="var(--faint)" stroke-width="0.6"/>
      <line x1="436" y1="234" x2="436" y2="260" stroke="var(--faint)" stroke-width="0.6"/>
      <line x1="400" y1="254" x2="436" y2="254" stroke="var(--ink)" stroke-width="1"/><polygon points="436,254 429,256.6 429,251.4" fill="var(--ink)"/><polygon points="400,254 407,251.4 407,256.6" fill="var(--ink)"/>
      <text x="418" y="249" font-size="15" fill="var(--ink)" font-style="italic" text-anchor="middle">t</text>
      </svg>
      <figcaption>

      Redibujada del enunciado: A y B a 45° a cada lado de la vertical de C,
      y la sección con h en el plano de la barra.

      </figcaption>
      </figure>

      **Notas nuestras.** La altura $h$ va en el plano del arco (radial),
      como la dibuja la sección.
      Las dos $P$ son horizontales, hacia fuera, y se equilibran entre sí.
    pide: >-
      Los esfuerzos en la sección más cargada del arco, la tensión de
      tracción máxima y el espesor t que la deja en 80 MPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué esfuerzos hay en la sección C?
        opciones:
          - texto: >-
              Un axil de tracción $N = P$ y un flector
              $M = PR(1 - \cos45^\circ)$, que tracciona la fibra interior
            correcta: true
            mensaje: |
              Eso es. Cortando por C y quedándose con la mitad izquierda, la
              única fuerza es $P$ en A, horizontal hacia fuera: en C la
              equilibra un axil horizontal de tracción, y su brazo respecto
              a C es la diferencia de alturas,
              $R - R\cos45^\circ$. El flector tiende a abrir el arco, a
              enderezarlo: alarga la fibra de dentro.
          - texto: >-
              Solo un flector $M = PR$, porque la fuerza actúa a una
              distancia $R$ del centro
            mensaje: |
              El brazo hay que tomarlo respecto a la sección, no respecto al
              centro del arco. Y además, cortando por C, $P$ tiene una
              componente según la tangente del arco en C (horizontal): hay
              axil.
          - texto: >-
              Un cortante $P$ y ningún flector, porque las dos fuerzas son
              iguales y opuestas
            mensaje: |
              Que se equilibren entre sí dice que no hay reacciones, no que
              no haya esfuerzos. En C la tangente es horizontal, como $P$:
              es axil, no cortante, y no pasan por C, así que hay flector.
      - tipo: calcular
        titulo: El espesor mínimo
        pregunta: |
          ¿Cuál es el valor mínimo de $t$, en mm?
        respuesta:
          tipo: numero
          valor: '12.38'
          tolerancia: 0.05
          formato: un número, en mm
        distractores:
          - valor: '11.72'
            mensaje: |
              Has dejado fuera el axil. En C, además del flector, hay una
              tracción $N = P$ que suma $P/(th)$ en toda la sección, y
              también en la fibra interior, la más traccionada.
          - valor: '40.67'
            mensaje: |
              Has tomado de brazo el radio entero, $M = PR$. El brazo de $P$
              respecto a C es la distancia vertical entre A y C,
              $R(1 - \cos45^\circ) = 87{,}87$ mm.
          - valor: '28.95'
            mensaje: |
              Has tomado de brazo $R\operatorname{sen}45^\circ$, que es la
              distancia **horizontal** de A a C. $P$ es horizontal, y su
              brazo respecto a C es la distancia vertical,
              $R(1 - \cos45^\circ)$.
          - valor: '19.08'
            mensaje: |
              Has puesto la sección tumbada, con $t$ en el plano del arco.
              La figura dibuja $h$ vertical, en el plano de la barra: el
              módulo resistente es $th^2/6$, con $h$ al cuadrado.
        pista: |
          $\sigma_{max} = \dfrac{N}{th} + \dfrac{6M}{th^2} \le 80$ MPa, con
          $N = P$ y $M = PR(1 - \cos45^\circ)$.
        desarrollo: |
          $M = 1600\cdot300(1 - \cos45^\circ) = 140\,589$ N·mm, y

          $$
          t \ge \frac{P}{\sigma_{adm}}\left(\frac{1}{h} + \frac{6R(1 - \cos45^\circ)}{h^2}\right)
          = 20\left(\frac{1}{30} + \frac{6\cdot87{,}87}{900}\right) = 12{,}38\ \text{mm}
          $$
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza sobra.
        piezas:
          - texto: >-
              El arco está en equilibrio con las dos $P$, sin reacciones, y
              basta con cortar y mirar una mitad.
          - texto: >-
              La sección más cargada es C, donde el brazo de $P$ es máximo,
              $R(1 - \cos45^\circ)$, y allí hay $N = P$ y
              $M = PR(1 - \cos45^\circ)$.
          - texto: >-
              El flector abre el arco y tracciona la fibra interior, que
              además lleva la tracción del axil:
              $\sigma = P/(th) + 6M/(th^2)$.
          - texto: >-
              Igualando esa tensión a 80 MPa se despeja $t$.
          - texto: >-
              La fibra más traccionada es la exterior, porque es la que está
              más lejos del centro del arco.
            trampa: true
            mensaje: |
              Al abrirse el arco, la fibra de fuera se acorta y la de dentro
              se alarga. Con $N$ de tracción, la de fuera queda en
              $P/(th) - 6M/(th^2)$, a compresión, y la de dentro es la
              crítica.
    resolucion: |
      **Los esfuerzos.** Las dos fuerzas $P$ se equilibran entre sí. Se
      corta por una sección a un ángulo $\alpha$ de la vertical, entre A y
      C, y se mira la parte de A: solo actúa $P$, horizontal hacia fuera. El
      brazo de $P$ respecto a la sección es la diferencia de alturas,
      $R(\cos\alpha - \cos45^\circ)$, máxima en C ($\alpha = 0$). En C la
      tangente del arco es horizontal, como $P$, así que todo es axil y
      flector, sin cortante:

      $$
      N_C = P = 1600\ \text{N (tracción)},\qquad M_C = PR(1 - \cos45^\circ) = 1600\cdot87{,}87 = 140\,589\ \text{N·mm}
      $$

      El flector tiende a enderezar el arco: la fibra de dentro se alarga y
      la de fuera se acorta (tema 7, para el equilibrio de la rebanada).

      **Las tensiones** (tema 9, flexión compuesta). Como $R/h = 10$, se trata
      la barra como recta: $\sigma = N/A \pm M/W$, con $A = th$ y
      $W = th^2/6$. En la fibra interior,

      $$
      \sigma_{int} = \frac{P}{th} + \frac{6M}{th^2} \le 80\ \text{MPa}
      \quad\Rightarrow\quad
      t \ge \frac{1600}{80}\left(\frac{1}{30} + \frac{6\cdot87{,}87}{30^2}\right) = 12{,}38\ \text{mm}
      $$

      **El espesor mínimo es $t$ = 12{,}38 mm.** Con ese espesor, la
      fibra exterior queda en $-71{,}4$ MPa, a
      compresión.

      Si se tuviera en cuenta la curvatura (Winkler), la tensión de la
      fibra interior sería algo mayor; el examen da los datos de una pieza
      recta y así se resuelve. El motor del curso, con la sección y los
      dos esfuerzos, da lo mismo.

  # ── Teoría · cuestión 4 · la viga conjugada y la reciprocidad (tema 10,
  #    con el 13). Cae igual el mismo día como cuestión 4 de la final.
  - id: exerm1819-2par-4-la-viga-conjugada-y-la-reciprocidad
    titulo: El giro de un apoyo por la viga conjugada y el desplazamiento del voladizo por reciprocidad
    fuente: >-
      Cuestión 4 de teoría · Segunda parte del 16 de enero de 2019 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Cayó igual el mismo día como
      cuestión 4 del examen final, también de 1 punto. En el PDF de los dos
      exámenes la figura sale sin rótulos, y se han leído en el Word
      original. El examen no publica resolución; el desarrollo es nuestro y
      sigue los apuntes del tema 10, apartado 10.5 (págs. 11 a 13), y del
      tema 13, apartado 13.3 (págs. 6 y 7).
    nivel: examen
    enunciado: |
      (1p) La rigidez a flexión de la viga de la figura es $EI_z$.
      Determinar:

      a/ El ángulo girado en R y su sentido cuando se aplica una carga $P$
      hacia abajo en T, utilizando el método de la viga conjugada.

      b/ El desplazamiento en T y su sentido cuando se aplica un momento
      horario $M$ en R, mediante el teorema de reciprocidad.

      <figure class="figura-examen">
      <svg viewBox="0 0 420 150" role="img" width="420" height="150" aria-labelledby="exerm1819-2par-4-la-viga-conjugada-y-la-reciprocidad-fig-t exerm1819-2par-4-la-viga-conjugada-y-la-reciprocidad-fig-d">
      <title id="exerm1819-2par-4-la-viga-conjugada-y-la-reciprocidad-fig-t">La viga RST, apoyada en R y en S, con el voladizo ST</title>
