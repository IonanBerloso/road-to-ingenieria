      <figcaption>

      Redibujada del enunciado. En el PDF la figura sale sin rótulos: R, S,
      T y las cotas 2a y a son cuadros de texto del Word original, de donde
      se han tomado.

      </figcaption>
      </figure>

      **Notas nuestras.** R es el apoyo fijo de la izquierda, S el móvil, a
      $2a$ de R, y T el extremo libre, a $a$ de S.
    pide: >-
      El giro de R con P en T, por la viga conjugada, y el desplazamiento de
      T con un par horario en R, por el teorema de reciprocidad, los dos con
      su sentido.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo es la viga conjugada de esta?
        opciones:
          - texto: >-
              Apoyada en R, con una rótula en S y empotrada en T
            correcta: true
            mensaje: |
              Eso es (fig. 10.9, p. 13). Un apoyo extremo sigue siendo apoyo
              ($v = 0$, $\theta \ne 0$ da $M^* = 0$, $T^* \ne 0$); el
              extremo libre ($v \ne 0$, $\theta \ne 0$) pasa a empotramiento;
              y el apoyo intermedio ($v = 0$, $\theta$ continuo) pasa a
              rótula.
          - texto: >-
              La misma viga, apoyada en R y en S y con el voladizo libre
            mensaje: |
              Con la misma viga, en T habría $M^* = 0$ y la flecha de T
              saldría nula, que no es verdad. Cada enlace cambia: el extremo
              libre pasa a empotrado y el apoyo intermedio, a rótula.
          - texto: >-
              Empotrada en R, con una rótula en S y libre en T
            mensaje: |
              Al revés: es el extremo libre (T) el que pasa a empotrado,
              porque allí $v \ne 0$ y $\theta \ne 0$. El apoyo de R se queda
              como apoyo.
      - tipo: calcular
        titulo: El giro de R con P en T
        pregunta: |
          Con $P$ hacia abajo en T, el giro de R vale
          $\theta_R = k\,Pa^2/(EI_z)$. ¿Cuánto vale $k$, positivo si el giro
          es horario?
        respuesta:
          tipo: numero
          valor: '-0.3333'
          tolerancia: 0.001
          formato: un número, k (horario positivo)
        distractores:
          - valor: '0.3333'
            mensaje: |
              El valor es ese, pero el sentido no. Con la carga en el
              voladizo, el tramo RS se arquea hacia arriba (flector negativo):
              la viga sale de R subiendo, y R gira en sentido antihorario.
          - valor: '-0.6667'
            mensaje: |
              Ese es el doble, el giro de S (con el signo del de R). En la
              viga conjugada, la carga $M/EI_z$ es un triángulo de 0 en R a
              $-Pa/EI_z$ en S, y su resultante se reparte 1/3 a R y 2/3 a S.
          - valor: '-0.5000'
            mensaje: |
              Has tomado la luz entera, $3a$, en el reparto de la carga
              conjugada. La reacción de R sale de los momentos respecto a la
              rótula S, con el tramo RS de $2a$.
        pista: |
          En la real, $M = -Px/2$ en RS ($x$ desde R) y $M = -P(3a - x)$ en ST.
          En la conjugada, cortante en R = giro en R; toma momentos de RS
          respecto a la rótula S.
        desarrollo: |
          La carga conjugada en RS es un triángulo de 0 a $-Pa/EI_z$ con
          resultante $-Pa^2/EI_z$ a $\tfrac{4a}{3}$ de R, es decir, a
          $\tfrac{2a}{3}$ de S. Como la rótula S no transmite flector,
          tomando momentos del tramo RS respecto a S,
          $T^*_R\cdot2a = (-Pa^2/EI_z)\cdot\tfrac{2a}{3}$, y queda

          $$
          \theta_R = T^*_R = -\frac{Pa^2}{3EI_z}
          $$

          Antihorario.
      - tipo: calcular
        titulo: El desplazamiento de T con el par en R
        pregunta: |
          Con un par horario $M$ en R (y sin $P$), el desplazamiento de T
          vale $\delta_T = k\,Ma^2/(EI_z)$. ¿Cuánto vale $k$, positivo hacia
          abajo?
        respuesta:
          tipo: numero
          valor: '-0.3333'
          tolerancia: 0.001
          formato: un número, k (hacia abajo positivo)
        distractores:
          - valor: '0.3333'
            mensaje: |
              El valor es ese, pero T sube. Por reciprocidad,
              $P\,\delta_T = M\,\theta_R$ con los dos trabajos con su signo:
              $\theta_R$ es antihorario (contra $M$), así que $\delta_T$ va en
              contra de $P$, hacia arriba.
          - valor: '-0.6667'
            mensaje: |
              Has usado el giro de S en vez del de R. El teorema empareja la
              fuerza de un estado con el desplazamiento del otro **en el
              mismo punto**: el par está en R, así que cuenta el giro de R.
          - valor: '-1.0000'
            mensaje: |
              Esa es la flecha de T con $P$ en T, $Pa^3/EI_z$. La
              reciprocidad cruza los estados: el desplazamiento de T con $M$
              en R es igual (por unidad) al giro de R con $P$ en T.
        pista: |
          Teorema de Betti: $P\,\delta_{T,M} = M\,\theta_{R,P}$ (ec. 13.7).
        desarrollo: |
          $$
          \delta_T = \frac{M}{P}\,\theta_R = \frac{M}{P}\left(-\frac{Pa^2}{3EI_z}\right) = -\frac{Ma^2}{3EI_z}
          $$

          T sube $Ma^2/(3EI_z)$.
      - tipo: justificar
        pregunta: Ordena el razonamiento del apartado b. Una pieza es falsa.
        piezas:
          - texto: >-
              Estado 1: $P$ hacia abajo en T, que hace girar R el ángulo
              $\theta_R = -Pa^2/(3EI_z)$ (antihorario).
          - texto: >-
              Estado 2: el par horario $M$ en R, que desplaza T la cantidad
              $\delta_T$ que se busca.
          - texto: >-
              Betti: el trabajo de las fuerzas del estado 1 con los
              desplazamientos del 2 es igual al de las del 2 con los del 1,
              $P\,\delta_T = M\,\theta_R$.
          - texto: >-
              Despejando, $\delta_T = -Ma^2/(3EI_z)$: T sube.
          - texto: >-
              Como $P$ y $M$ no tienen las mismas unidades, el teorema de
              reciprocidad no se puede aplicar entre una fuerza y un par.
            trampa: true
            mensaje: |
              Sí se puede: lo que se iguala son **trabajos**, y una fuerza
              por un desplazamiento y un par por un giro tienen las mismas
              unidades. Con $P = 1$ y $M = 1$, el desplazamiento de T por un
              par unidad en R es el giro de R por una fuerza unidad en T.
    resolucion: |
      **a) La viga conjugada.** Con R en $x = 0$, S en $2a$ y T en $3a$, y
      $P$ hacia abajo en T: $R_R = -P/2$ (hacia abajo) y $R_S = 3P/2$. El
      flector es $M = -Px/2$ en RS (de 0 a $-Pa$ en S) y $M = -P(3a - x)$ en
      ST. La viga conjugada (tema 10, apartado 10.5, fig. 10.9, p. 13): R
      sigue apoyado, S pasa a rótula y T, libre, pasa a empotramiento. Se
      carga con $q^* = M/EI_z$, y su cortante es el giro de la real y su
      flector, la flecha.

      En el tramo RS la carga conjugada es un triángulo de 0 en R a
      $-Pa/EI_z$ en S, de resultante $\tfrac{1}{2}\cdot2a\cdot(-Pa/EI_z) = -Pa^2/EI_z$,
      aplicada a $\tfrac{4a}{3}$ de R. La rótula S no transmite flector: tomando
      momentos del tramo RS respecto a S, la reacción conjugada en R es
      $\tfrac{1}{3}$ de la resultante, y

      $$
      \theta_R = T^*_R = -\frac{Pa^2}{3EI_z}
      $$

      Con $\theta$ positivo horario (convenio del tema 10), **R gira
      $Pa^2/(3EI_z)$ en sentido antihorario**: el tramo RS se arquea hacia
      arriba, porque el voladizo lo levanta. Comprobación con la fórmula
      del voladizo, $\theta_R = -P\,a\,L_{RS}/(6EI_z)$ con $L_{RS} = 2a$. Con
      la misma conjugada, S gira $2Pa^2/(3EI_z)$ en sentido horario y T baja
      $Pa^3/EI_z$.

      **b) La reciprocidad.** Teorema de Betti (tema 13, apartado 13.3,
      ec. 13.7, p. 7): con el estado 1 ($P$ en T) y el estado 2 ($M$ horario
      en R), $P\,\delta_{T,2} = M\,\theta_{R,1}$. Así

      $$
      \delta_T = \frac{M\,\theta_R}{P} = -\frac{Ma^2}{3EI_z}
      $$

      **T sube $Ma^2/(3EI_z)$.** Comprobación directa: con el par en R, el
      giro de S es $-ML_{RS}/(6EI_z) = -Ma/(3EI_z)$ (antihorario), y el
      voladizo, recto porque no tiene flector, sube $a$ veces ese giro, lo
      mismo. El motor del curso (la viga conjugada y la elástica integrada)
      da los dos valores.
  # ── Problema 1 · la viga rígida colgada de cuatro barras (tema 8). Cae
  #    igual el mismo día como problema 2 de la final.
  - id: exerm1819-2par-5-la-viga-rigida-y-las-cuatro-barras
    titulo: La viga rígida colgada del techo por cuatro barras articuladas
    fuente: >-
      Problema 1 · Segunda parte del 16 de enero de 2019 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 2 puntos. Cayó igual el mismo día como problema 2 del examen
      final, donde vale 1,5 puntos; el enunciado se transcribe sin su «(2p)»,
      y cada hoja pone sus puntos. La geometría (D a la altura del techo y la
      barra 1 perpendicular a la 2) se lee de la figura. El examen no publica
      resolución; el desarrollo es nuestro, con el tema 8.
    nivel: examen
    enunciado: |
      La viga rígida de la figura está soportada por 4 barras articuladas de
      sección $A$ y módulo $E$. Determinar:

      a/ Fuerzas en las barras en N.

      b/ Desplazamiento horizontal de B en mm.

      $q_0$ = 10 kN/m; $a$ = 2 m; $A$ = 2 cm²; $E$= 2·10⁵ MPa

