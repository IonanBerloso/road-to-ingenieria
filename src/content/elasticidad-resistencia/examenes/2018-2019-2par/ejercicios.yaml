ejercicios:
  # ── Teoría · cuestión 1 · la torsión de la sección circular (tema 12).
  - id: exerm1819-2par-1-la-torsion-de-la-seccion-circular
    titulo: La torsión en piezas de sección circular, de la hipótesis de partida a la tensión y el giro
    fuente: >-
      Cuestión 1 de teoría · Segunda parte del 16 de enero de 2019 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Casi la misma pregunta, con
      «prismáticas», ya había caído como cuestión 2 de teoría de la
      extraordinaria del 16 de junio de 2017, y está resuelta en el sitio con
      otro ejemplo. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 12, apartado 12.2
      (págs. 4 a 9). Los números de los pasos de cálculo son un ejemplo
      nuestro.
    nivel: examen
    enunciado: |
      (1p) Torsión en piezas de sección circular.
    pide: >-
      La teoría de la torsión de la sección circular, de la hipótesis de
      partida a la tensión tangencial y al ángulo girado, y, en un ejemplo
      nuestro, la tensión máxima y el giro de un eje.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hipótesis hace que la sección circular se pueda resolver
          entera a mano?
        opciones:
          - texto: >-
              La de Coulomb, que las secciones siguen planas y giran como
              sólidos rígidos alrededor del eje, con los radios rectos
            correcta: true
            mensaje: |
              Eso es (p. 4). Con ella cada punto se mueve en perpendicular a
              su radio una distancia $r\varphi$, y de los desplazamientos
              salen las deformaciones, la tensión y el giro sin más
              hipótesis. En la sección rectangular no se cumple: las
              secciones se alabean, y hacen falta tablas.
          - texto: >-
              Que la tensión tangencial es uniforme en toda la sección
            mensaje: |
              No lo es: crece con la distancia al centro, $\tau = M_tr/I_p$
              (ec. 12.10), y es nula en el centro. Uniforme, aproximadamente,
              es solo en un tubo de pared delgada.
          - texto: >-
              Que las secciones se alabean libremente, sin tensiones normales
            mensaje: |
              Eso es lo que pasa en las secciones no circulares. En la
              circular, por la simetría, las secciones no se alabean: siguen
              planas, que es la hipótesis de Coulomb.
      - tipo: calcular
        titulo: La tensión máxima de un eje
        pregunta: |
          Un eje macizo de $D$ = 40 mm transmite un momento torsor
          $M_t$ = 500 N·m. ¿Cuánto vale la tensión tangencial máxima, en MPa?
        respuesta:
          tipo: numero
          valor: '39.79'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '79.58'
            mensaje: |
              El doble: has tomado $r = D$ en $\tau = M_tr/I_p$. La tensión
              máxima está en el borde, a $r = D/2$ del centro.
          - valor: '19.89'
            mensaje: |
              La mitad: has hecho $M_t/(\pi R^3)$. Con
              $I_p = \tfrac{1}{2}\pi R^4$, $\tau_{max} = M_tR/I_p = 2M_t/(\pi R^3)
              = 16M_t/(\pi D^3)$ (ec. 12.11).
        pista: |
          $\tau_{max} = \dfrac{16M_t}{\pi D^3}$ (ec. 12.11), con $M_t$ en N·mm
          y $D$ en mm.
        desarrollo: |
          $$
          \tau_{max} = \frac{16\cdot500\cdot10^3}{\pi\cdot40^3} = 39{,}79\ \text{MPa}
          $$
      - tipo: calcular
        titulo: El ángulo girado
        pregunta: |
          Si el eje mide $L$ = 1 m y $G$ = 80 GPa, ¿cuánto gira una sección
          extrema respecto a la otra, en grados?
        respuesta:
          tipo: numero
          valor: '1.425'
          tolerancia: 0.005
          formato: un número, en grados
        distractores:
          - valor: '0.0249'
            mensaje: |
              Ese es el giro en radianes. $M_tL/(GI_p)$ da radianes; para
              pasarlo a grados hay que multiplicar por $180/\pi$.
          - valor: '0.570'
            mensaje: |
              Has usado $E$ (200 GPa) en vez de $G$. La rigidez a torsión es
              $GI_p$ (ec. 12.9): la torsión es cortadura pura, y la cortadura
              la gobierna el módulo $G$.
          - valor: '2.850'
            mensaje: |
              El doble: has usado el momento de inercia respecto a un
              diámetro, $\pi D^4/64$, en vez del polar,
              $I_p = \pi D^4/32$, que es el doble.
        pista: |
          $\varphi = \dfrac{M_tL}{GI_p}$ (ec. 12.14), con
          $I_p = \pi D^4/32$.
        desarrollo: |
          $I_p = \pi\cdot40^4/32 = 251\,327$ mm⁴ y

          $$
          \varphi = \frac{500\cdot10^3\cdot1000}{80\,000\cdot251\,327} = 0{,}02487\ \text{rad} = 1{,}425^\circ
          $$
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la respuesta como en el examen, de la hipótesis de Coulomb
          a la tensión tangencial, la tensión máxima y el ángulo girado.
        rubrica: torsion-de-la-seccion-circular
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Por la hipótesis de Coulomb, cada punto gira con su sección y se
              desplaza $r\varphi$ en perpendicular a su radio.
          - texto: >-
              Derivando los desplazamientos, las únicas deformaciones son
              $\gamma_{xy}$ y $\gamma_{zx}$, y la tensión resultante vale
              $\tau = Gr\varphi_{,x}$.
          - texto: >-
              El momento de esas tensiones respecto al centro es el torsor,
              $M_t = G\varphi_{,x}\int r^2\,dA = GI_p\varphi_{,x}$.
          - texto: >-
              Despejando $\varphi_{,x}$ queda $\tau = M_tr/I_p$, máxima en el
              borde.
          - texto: >-
              Como las secciones giran, aparecen tensiones normales
              $\sigma_x$ proporcionales al ángulo girado.
            trampa: true
            mensaje: |
              El giro de una sección como sólido rígido no alarga ninguna
              fibra según $x$: $u = 0$ y $\varepsilon_x = u_{,x} = 0$
              (ecs. 12.3 y 12.4). En la sección circular a torsión no hay
              $\sigma_x$; solo tangenciales.
    resolucion: |
      **La hipótesis.** Según la hipótesis de Coulomb, durante la torsión
      las secciones planas siguen planas y giran como sólidos rígidos, así
      que los radios siguen rectos (apuntes del tema 12, apartado 12.2,
      p. 4). Un punto P a distancia $r$ del centro gira el ángulo pequeño
      $\varphi$ y se desplaza $r\varphi$ en perpendicular a su radio:

      $$
      u = 0,\qquad v = -\varphi z,\qquad w = \varphi y\qquad\text{(ec. 12.3)}
      $$

      **Deformaciones y tensiones.** Derivando, todas las deformaciones son
      nulas salvo $\gamma_{xy} = -z\varphi_{,x}$ y $\gamma_{zx} = y\varphi_{,x}$
      (ec. 12.4). Con Hooke, $\tau_{xy} = -Gz\varphi_{,x}$ y
      $\tau_{zx} = Gy\varphi_{,x}$ (ec. 12.5), y su resultante es
      perpendicular al radio y vale

      $$
      \tau = Gr\varphi_{,x}\qquad\text{(ec. 12.6)}
      $$

      **El torsor.** El momento de esas tensiones es el torsor:
      $M_t = \int_A \tau r\,dA = G\varphi_{,x}\int_A r^2\,dA = GI_p\varphi_{,x}$
      (ecs. 12.7 y 12.8). De ahí $\varphi_{,x} = M_t/(GI_p)$ (ec. 12.9),
      con $GI_p$ la rigidez a torsión, y

      $$
      \tau = \frac{M_tr}{I_p}\qquad\text{(ec. 12.10)}
      $$

      La tensión crece lineal con $r$ y es máxima en el borde. Con
      $I_p = \pi D^4/32$, $\tau_{max} = 16M_t/(\pi D^3)$ (ec. 12.11, p. 7);
      en la sección hueca, con $I_p = \pi(D^4 - d^4)/32$, la ec. 12.12.

      **El giro.** Integrando la ec. 12.9 entre dos secciones,
      $\varphi_B - \varphi_A = \int_A^B M_t/(GI_p)\,dx$ (ec. 12.13), que
      con $GI_p$ constante es el área del diagrama de torsores entre $GI_p$
      (ec. 12.14, p. 8).

      **El estado de tensiones.** En el borde, en la dirección del eje y en
      su perpendicular hay cortadura pura: las tensiones principales van a
      45°, y por esos planos rompen los materiales frágiles, en hélice, como
      una tiza retorcida (págs. 8 y 9).

      **Un ejemplo nuestro.** Un eje macizo de $D$ = 40 mm con
      $M_t$ = 500 N·m: $I_p = 251\,327$ mm⁴ y
      $\tau_{max} = 39{,}79$ MPa; a 10 mm del centro, la mitad,
      $19{,}89$ MPa. Si mide 1 m y $G$ = 80 GPa, gira
      $\varphi = 0{,}02487$ rad, es decir, $1{,}425^\circ$.
      El motor del curso da lo mismo.

  # ── Teoría · cuestión 3 · la barra circular ABC (tema 9, con el 7). Cae
  #    igual el mismo día como cuestión 3 de la final.
  - id: exerm1819-2par-3-la-barra-circular-abc
    titulo: La barra circular ABC y el espesor mínimo de su sección
    fuente: >-
      Cuestión 3 de teoría · Segunda parte del 16 de enero de 2019 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Cayó igual el mismo día como
      cuestión 3 del examen final, también de 1 punto. El examen no publica
      resolución; el desarrollo es nuestro, con los temas 7 y 9.
    nivel: examen
    enunciado: |
      (1p) La barra circular ABC tiene un radio de 300 mm y la carga $P$ =
      1,60 kN. La sección de la barra es rectangular de base $t$ y altura
      $h$.

      Si la tensión admisible de tracción es de 80 MPa y la altura $h$ = 30
      mm, determinar el valor mínimo de $t$.

      <figure class="figura-examen">
      <svg viewBox="0 0 500 290" role="img" width="500" height="290" aria-labelledby="exerm1819-2par-3-la-barra-circular-abc-fig-t exerm1819-2par-3-la-barra-circular-abc-fig-d">
      <title id="exerm1819-2par-3-la-barra-circular-abc-fig-t">La barra circular ABC con las dos cargas P</title>
      <desc id="exerm1819-2par-3-la-barra-circular-abc-fig-d">Un arco de circunferencia grueso, de A, a la izquierda, a B, a la derecha, pasando por C, el punto más alto. Desde el centro salen tres radios a trazos: a A, a C (vertical) y a B; dos arcos acotan 45° entre el radio de A y el de C y 45° entre el de C y el de B. En A, una fuerza P horizontal hacia la izquierda; en B, otra P horizontal hacia la derecha. A la derecha, la sección: un rectángulo de base t (cota de abajo) y altura h (cota de la derecha).</desc>
      <path d="M106.9 111.9 A160 160 0 0 1 333.1 111.9" fill="none" stroke="var(--ink)" stroke-width="7"/>
      <line x1="220" y1="225" x2="106.9" y2="111.9" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>
      <line x1="220" y1="225" x2="333.1" y2="111.9" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>
      <line x1="220" y1="225" x2="220" y2="65" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>
      <path d="M176.2 181.2 A62 62 0 0 1 220 163" fill="none" stroke="var(--ink)" stroke-width="1"/><polygon points="176.2,181.2 178.7,175.2 182.1,178.6" fill="var(--ink)"/><polygon points="220,163 214,165.4 214,160.6" fill="var(--ink)"/>
      <path d="M220 163 A62 62 0 0 1 263.8 181.2" fill="none" stroke="var(--ink)" stroke-width="1"/><polygon points="220,163 226,160.6 226,165.4" fill="var(--ink)"/><polygon points="263.8,181.2 257.9,178.6 261.3,175.2" fill="var(--ink)"/>
      <text x="170" y="155" font-size="15" fill="var(--ink)">45º</text>
      <text x="238" y="155" font-size="15" fill="var(--ink)">45º</text>
      <line x1="102.9" y1="111.9" x2="49.9" y2="111.9" stroke="var(--ink)" stroke-width="1.5"/><polygon points="42.9,111.9 50.9,108.4 50.9,115.4" fill="var(--ink)"/>
      <line x1="337.1" y1="111.9" x2="390.1" y2="111.9" stroke="var(--ink)" stroke-width="1.5"/><polygon points="397.1,111.9 389.1,115.4 389.1,108.4" fill="var(--ink)"/>
      <text x="50.9" y="101.9" font-size="15" fill="var(--ink)" font-style="italic">P</text>
      <text x="379.1" y="101.9" font-size="15" fill="var(--ink)" font-style="italic">P</text>
