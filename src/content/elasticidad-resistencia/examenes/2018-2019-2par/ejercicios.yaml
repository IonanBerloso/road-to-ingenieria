      <figcaption>

      Redibujada del enunciado. La viga, a escala; la sección, a otra
      escala, con el alma en el centro del ala de abajo.

      </figcaption>
      </figure>

      **Notas nuestras.** El par $M_0$ de A gira en sentido horario: el
      arco sube por la izquierda y acaba arriba con la punta hacia la
      derecha. El alma va en el centro del ala de abajo, como está dibujada
      (la figura no la acota), y el ala de arriba mide 9t contando el alma.
      «Eje central» es el eje neutro, la línea de tensión normal nula. A
      está dibujado como apoyo fijo y E como empotramiento: con cargas
      verticales no hay axil.
    pide: >-
      Las reacciones, los diagramas de cortantes y flectores, y en la
      sección de flector máximo la ecuación de las tensiones normales, el
      eje neutro y las tensiones extremas.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por dónde conviene empezar a calcular las reacciones?
        opciones:
          - texto: >-
              Por el tramo AB, que solo tiene la reacción de A y el par: con
              flector nulo en la rótula B sale $R_A$ directamente
            correcta: true
            mensaje: |
              Eso es. Cada rótula da una ecuación ($M = 0$), y con las dos de
              la estática en vertical hay cuatro, tantas como reacciones
              verticales: $R_A$, $R_C$, $R_E$ y $M_E$. Las horizontales de A y
              E son nulas: sin cargas horizontales, no hay axil. En AB:
              $R_A a + M_0 = 0$, así que $R_A = -q_0a$, hacia abajo.
          - texto: >-
              Por el empotramiento E, que es el que tiene más reacciones
            mensaje: |
              Es justo el que más incógnitas tiene. Hay que empezar por el
              trozo con menos: AB, aislado por la rótula B, tiene una sola
              reacción vertical y el par conocido.
          - texto: >-
              Por la viga entera, porque es hiperestática y hay que usar la
              elástica
            mensaje: |
              Las rótulas la hacen isostática: cada una añade la condición
              $M = 0$. Con la estática y las dos rótulas salen todas las
              reacciones, sin deformaciones.
      - tipo: calcular
        titulo: El flector máximo
        pregunta: |
          ¿Cuánto vale el flector máximo en valor absoluto, en kN·m?
        respuesta:
          tipo: numero
          valor: '62.50'
          tolerancia: 0.05
          formato: un número, en kN·m
        distractores:
          - valor: '31.25'
            mensaje: |
              Ese es el del empotramiento, $q_0a^2/2$, el máximo del tramo DE.
              Pero en A, justo a la derecha del par, el flector es
              $M_0 = q_0a^2$, y en C vale $-q_0a^2$: los dos son mayores en
              valor absoluto.
          - valor: '125.00'
            mensaje: |
              $2q_0a^2$ sería el momento de $R_C = 2q_0a$ con brazo $a$, pero
              en C se suman el de $R_A$ y el par:
              $M_C = R_A\cdot2a + M_0 = -2q_0a^2 + q_0a^2 = -q_0a^2$.
          - valor: '93.75'
            mensaje: |
              Has tomado $R_A = -\tfrac{1}{2}q_0a$, como si el par se
              repartiera entre A y B. B es una rótula y el tramo AB solo
              tiene la reacción de A: $R_A = -M_0/a = -q_0a$.
        pista: |
          AB: $M_B = R_Aa + M_0 = 0$. BCD: $M_D = R_A\cdot3a + M_0 + R_Ca = 0$.
          Con $R_A$ y $R_C$, el flector en A⁺ y en C.
        desarrollo: |
          $R_A = -q_0a$ y $R_C = 2q_0a$. $M(A^+) = M_0 = q_0a^2$ y
          $M_C = -q_0a\cdot2a + q_0a^2 = -q_0a^2$: en valor absoluto,
          $q_0a^2 = 10\cdot2{,}5^2 = 62{,}50$ kN·m, en A⁺ y en C.
      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de cortantes y de flectores**, alineados
          bajo la viga, con los valores en A, B, C, D y E y el convenio del
          tema 7 ($dV/dx = -q$, $dM/dx = V$; $M > 0$ si tracciona la fibra de
          abajo).
        comprueba:
          - punto: |
              **Cortante**: $-q_0a$ constante de A a C; en C salta $R_C$
              hasta $q_0a$, constante hasta D; de D a E baja en recta hasta
              cero.
            porque: |
              Sin carga, el cortante es constante; en DE baja con pendiente
              $-q_0$. Llega a cero en E porque $R_E = 0$: lo que sube por
              BCD se lo lleva justo la carga de DE.
          - punto: |
              **Flector**: $q_0a^2$ en A⁺ (el par), recta que pasa por cero
              en la rótula B y llega a $-q_0a^2$ en C; recta hasta cero en la
              rótula D; parábola en DE hasta $q_0a^2/2$ en E, con tangente
              horizontal en E.
            porque: |
              $dM/dx = V$: lineal donde el cortante es constante y parabólico
              en DE. En las rótulas es nulo, y en E la tangente es horizontal
              porque allí el cortante se anula.
          - punto: |
              **Los máximos**: $|M|_{max} = q_0a^2$, en A⁺ (positivo) y en C
              (negativo); $|V|_{max} = q_0a$.
            porque: |
              Las dos secciones de $|M|$ máximo dan las mismas tensiones con el
              signo cambiado, y cualquiera de ellas sirve para el apartado b.
        figura: |
