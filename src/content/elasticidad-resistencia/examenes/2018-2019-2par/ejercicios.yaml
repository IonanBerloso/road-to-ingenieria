      <figcaption>

      Redibujada del enunciado, a escala: la barra 2 a 30° de la viga y la
      barra 1 perpendicular a ella, con D, E y F en el techo.

      </figcaption>
      </figure>

      **Notas nuestras.** La figura no acota la altura del techo: sale de
      los ángulos. E está en la vertical de B, a una altura
      $h = a\tan 30^\circ = a/\sqrt{3}$, y D, también en el techo, es el
      otro extremo de la barra 1, perpendicular a la 2 en A. Así,
      $L_1 = 2a/3$, $L_2 = 2a/\sqrt{3}$ y $L_3 = L_4 = a/\sqrt{3}$. Se
      conserva «$E$= 2·10⁵» sin espacio antes del igual.
    pide: >-
      Las fuerzas de las cuatro barras y el desplazamiento horizontal de B.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular: ¿qué clase de problema es?
        opciones:
          - texto: >-
              Hiperestático de grado 1, con cuatro fuerzas de barra y tres
              ecuaciones de equilibrio de la viga; falta una de compatibilidad
            correcta: true
            mensaje: |
              Eso es. Una viga rígida en el plano tiene tres movimientos
              ($u$, $v$ y el giro) y da tres ecuaciones de equilibrio; con
              cuatro barras sobra una. La ecuación que falta sale de que la
              viga no se deforma: los alargamientos de las cuatro barras no
              son independientes (tema 8, p. 4, y ec. 8.12, p. 8).
          - texto: >-
              Isostático, porque las tres barras verticales e inclinadas
              bastan para sostener la viga
            mensaje: |
              Tres barras bien puestas bastarían, pero aquí hay cuatro, y
              cuatro fuerzas desconocidas con tres ecuaciones de la estática
              no se pueden despejar. Si quitas una barra, el resto sí es
              isostático: es justo lo que dice el grado 1.
          - texto: >-
              Un mecanismo, porque las barras 3 y 4 son paralelas y no
              impiden que la viga se mueva en horizontal
            mensaje: |
              Las barras 3 y 4 solas sí dejarían correr la viga en horizontal,
              pero las barras 1 y 2 están inclinadas y lo impiden: la viga
              no puede moverse sin alargar alguna barra.
          - texto: >-
              Hiperestático de grado 2, porque hay dos barras inclinadas que
              llegan al mismo nudo A
            mensaje: |
              Que dos barras compartan nudo no añade incógnitas: cada barra
              aporta su fuerza, cuatro en total, y la viga da tres
              ecuaciones. El grado es la diferencia, 1.
      - tipo: calcular
        titulo: La fuerza de la barra 3
        pregunta: |
          ¿Qué fuerza lleva la barra 3, en N (positiva a tracción)?
        respuesta:
          tipo: numero
          valor: '14867'
          tolerancia: 5
          formato: un número, en N
        distractores:
          - valor: '40000'
            mensaje: |
              Es lo que sale si solo cuentan las barras verticales: con la
              resultante $W = 2q_0a$ en B, la barra 3 se la llevaría entera y
              la 4 nada. Pero las barras 1 y 2 también tiran de la viga hacia
              arriba en A, y la reparten.
          - valor: '13333'
            mensaje: |
              Has tomado las cuatro barras de la misma longitud. Los
              alargamientos son $NL/EA$, y las barras 1 y 2 son más largas
              que la 3 y la 4 ($2a/3$ y $2a/\sqrt{3}$ frente a $a/\sqrt{3}$):
              con la misma fuerza se alargan más, y la compatibilidad cambia.
          - valor: '20000'
            mensaje: |
              Es la mitad de la carga, como si las barras 3 y 4 se la
              repartieran a medias. Ni la carga está entre las dos (su
              resultante cae en B) ni las barras 1 y 2 dejan de trabajar:
              hay que plantear el equilibrio y la compatibilidad.
        pista: |
          Equilibrio: $N_1 = \sqrt{3}N_2$, $2N_2 + N_3 + N_4 = W$ y
          $N_3 + 2N_4 = W$. Compatibilidad: con la viga rígida, $v_B$ es la
          media de $v_A$ y $v_C$.
        desarrollo: |
          Con $\delta_i = N_iL_i/EA$ sale $\delta_1 = \delta_2$, y la
          compatibilidad queda $2N_3 = (\sqrt{3} + 1)N_2 + N_4$. Con el
          equilibrio, $N_2 = N_4/2$ y

          $$
          N_4 = \frac{4W}{11 + \sqrt{3}} = 12\,566{,}7\ \text{N},\qquad
          N_3 = W - 2N_4 = \frac{(3 + \sqrt{3})W}{11 + \sqrt{3}} = 14\,866{,}6\ \text{N}
          $$
      - tipo: calcular
        titulo: El desplazamiento horizontal de B
        pregunta: |
          ¿Cuánto se desplaza B en horizontal, en mm, positivo hacia la
          derecha?
        respuesta:
          tipo: numero
          valor: '-0.1328'
          tolerancia: 0.001
          formato: un número, en mm (positivo hacia la derecha)
        distractores:
          - valor: '0.1328'
            mensaje: |
              El valor es ese, pero el sentido no. Cada alargamiento es lo
              que A se aleja del nudo del techo de su barra: de E, arriba a
              la derecha, para la 2, y de D, arriba a la izquierda, para la
              barra 1. Las dos se alargan lo mismo, y en horizontal pesa más
              la 2, que está más tumbada:
              $u = \tfrac{1}{2}\delta_1 - \tfrac{\sqrt{3}}{2}\delta_2 < 0$,
              hacia la izquierda.
          - valor: '0.3628'
            mensaje: |
              Ese es el alargamiento de las barras 1 y 2, no un
              desplazamiento de la viga. Cada alargamiento es la proyección
              del desplazamiento de A sobre su barra (ec. 8.12), y $u$ sale
              de combinar las dos proyecciones.
          - valor: '-0.4292'
            mensaje: |
              Ese es el desplazamiento vertical de B, el que alarga la barra
              3. La pregunta es el horizontal, que en una viga rígida
              horizontal es el mismo en todos sus puntos y sale de las
              barras 1 y 2.
          - valor: '-13.28'
            mensaje: |
              Cien veces más: has puesto $A = 2$ mm² en vez de
              $2\ \text{cm}^2 = 200\ \text{mm}^2$. Con N, mm y MPa, la
              rigidez es $EA = 2\cdot10^5\cdot200 = 4\cdot10^7$ N.
        pista: |
          Despeja el desplazamiento de A de los alargamientos de las barras
          1 y 2: $\delta_1 = \tfrac{1}{2}u - \tfrac{\sqrt{3}}{2}v_A$ y
          $\delta_2 = -\tfrac{\sqrt{3}}{2}u - \tfrac{1}{2}v_A$, con $u$ hacia
          la derecha y $v_A$ hacia arriba.
        desarrollo: |
          $\delta_1 = \delta_2 = N_2L_2/EA = 6283{,}4\cdot2309{,}4/(4\cdot10^7) = 0{,}3628$ mm, y

          $$
          u = \tfrac{1}{2}\delta_1 - \tfrac{\sqrt{3}}{2}\delta_2
          = \left(\tfrac{1}{2} - \tfrac{\sqrt{3}}{2}\right)\delta = -0{,}1328\ \text{mm}
          $$

          B se mueve $0{,}1328$ mm hacia la izquierda, lo mismo que A
          y que C: la viga rígida y horizontal se traslada en horizontal
          entera.
      - tipo: justificar
        pregunta: Ordena el razonamiento que da las fuerzas. Una pieza sobra.
        piezas:
          - texto: >-
              La viga tiene tres ecuaciones de equilibrio y hay cuatro
              fuerzas de barra, así que hace falta una ecuación de
              compatibilidad.
          - texto: >-
              Cada barra se alarga $\delta_i = N_iL_i/EA$, y su alargamiento
              es la proyección sobre la barra del desplazamiento del punto de
              la viga al que llega.
          - texto: >-
              Como la viga es rígida y horizontal, el desplazamiento vertical
              de B es la media de los de A y C, y eso liga los cuatro
              alargamientos.
          - texto: >-
              Con las longitudes $L_1 = 2a/3$ y $L_2 = 2a/\sqrt{3}$ y
              $N_1 = \sqrt{3}N_2$, las barras 1 y 2 se alargan lo mismo, y
              las cuatro ecuaciones dan $N_4 = 4W/(11 + \sqrt{3})$.
          - texto: >-
              Como las barras 1 y 2 forman 90°, una de ellas no trabaja y se
              puede quitar.
            trampa: true
            mensaje: |
              Que sean perpendiculares no anula ninguna. Las dos llegan a A y
              las dos sostienen la viga: la 1 lleva $\sqrt{3}$ veces la
              fuerza de la 2. Lo que sí da la perpendicularidad son unas
              cuentas limpias, porque sus direcciones son
              $(-\tfrac{1}{2}, \tfrac{\sqrt{3}}{2})$ y
              $(\tfrac{\sqrt{3}}{2}, \tfrac{1}{2})$.
    resolucion: |
      **La geometría.** Con A en el origen, x a la derecha e y hacia arriba:
      B $(a, 0)$, C $(2a, 0)$ y el techo a $h = a\tan30^\circ = a/\sqrt{3}$,
      con E en la vertical de B. La barra 2 (A–E) forma 30° con la viga y
      mide $L_2 = 2a/\sqrt{3}$; la 1 (A–D), perpendicular a ella, sube a
      60° y mide $L_1 = h/\operatorname{sen}60^\circ = 2a/3$; la 3 y la 4
      son verticales, $L_3 = L_4 = a/\sqrt{3}$. Con $a$ = 2000 mm:
      $L_1 = 1333{,}3$, $L_2 = 2309{,}4$ y $L_3 = L_4 = 1154{,}7$ mm.
      La carga total es $W = 2q_0a$ = 40 kN, con la resultante en B, y
      $EA = 2\cdot10^5\cdot200 = 4\cdot10^7$ N.

      **a) Las fuerzas.** Es hiperestático de grado 1 (tema 8, p. 4). Con
      las fuerzas de tracción tirando de la viga hacia cada techo, el
      equilibrio da tres ecuaciones:

      $$
      \begin{aligned}
      \textstyle\sum F_x &= 0: & -\tfrac{1}{2}N_1 + \tfrac{\sqrt{3}}{2}N_2 &= 0 &&\Rightarrow N_1 = \sqrt{3}N_2\\
      \textstyle\sum F_y &= 0: & \tfrac{\sqrt{3}}{2}N_1 + \tfrac{1}{2}N_2 + N_3 + N_4 &= W &&\Rightarrow 2N_2 + N_3 + N_4 = W\\
      \textstyle\sum M_A &= 0: & N_3a + 2N_4a &= Wa &&\Rightarrow N_3 + 2N_4 = W
      \end{aligned}
      $$

      **La compatibilidad.** La viga se traslada $u$ (derecha), $v_A$
      (arriba) y gira; por ser rígida y recta, $v_B = (v_A + v_C)/2$. Cada
      alargamiento es la proyección, cambiada de signo, del desplazamiento
      del extremo de la viga sobre la dirección de la barra hacia el techo
      (ec. 8.12, p. 8):
      $\delta_1 = \tfrac{1}{2}u - \tfrac{\sqrt{3}}{2}v_A$,
      $\delta_2 = -\tfrac{\sqrt{3}}{2}u - \tfrac{1}{2}v_A$,
      $\delta_3 = -v_B$ y $\delta_4 = -v_C$. De las dos primeras,
      $v_A = -\tfrac{\sqrt{3}}{2}\delta_1 - \tfrac{1}{2}\delta_2$, y la
      condición de la viga queda

      $$
      2\delta_3 = \tfrac{\sqrt{3}}{2}\delta_1 + \tfrac{1}{2}\delta_2 + \delta_4
      $$

      Con $\delta_i = N_iL_i/EA$ (ec. 8.9, p. 7) y $N_1 = \sqrt{3}N_2$ sale
      $\delta_1 = \delta_2 = 2aN_2/(\sqrt{3}EA)$, y la compatibilidad,
      multiplicada por $\sqrt{3}EA/a$, es $2N_3 = (\sqrt{3} + 1)N_2 + N_4$.
      La tercera ecuación de equilibrio da $N_3 = W - 2N_4$; la segunda,
      $N_2 = N_4/2$; y la compatibilidad, $N_4(11 + \sqrt{3})/2 = 2W$:

      $$
      N_4 = \frac{4W}{11 + \sqrt{3}} = 12\,567\ \text{N},\quad
      N_3 = 14\,867\ \text{N},\quad
      N_2 = \frac{N_4}{2} = 6283\ \text{N},\quad
      N_1 = \sqrt{3}N_2 = 10\,883\ \text{N}
      $$

      Las cuatro a tracción. Comprobación: $\tfrac{\sqrt{3}}{2}N_1 +
      \tfrac{1}{2}N_2 + N_3 + N_4 = 40\,000$ N.

      **b) El desplazamiento de B.** $\delta_1 = \delta_2 = 0{,}3628$ mm, y
      $u = \tfrac{1}{2}\delta_1 - \tfrac{\sqrt{3}}{2}\delta_2 = -0{,}1328$
      mm: **B se mueve 0,1328 mm hacia la izquierda**, como toda la
      viga. En vertical, A baja $0{,}4956$ mm, B baja
      $\delta_3 = 0{,}4292$ mm y C baja $\delta_4 = 0{,}3628$ mm: B queda
      justo en la media de A y C, que es la condición de partida.

      Las cifras salen del motor del curso (la viga como sólido rígido con
      sus cuatro barras) y de las fórmulas cerradas de arriba, y casan.

  # ── Problema 2 · la viga con dos rótulas y la sección de alas desiguales
  #    (tema 9, con el 7). Cae igual el mismo día como problema 3 de la final.
  - id: exerm1819-2par-6-la-viga-con-dos-rotulas-y-la-seccion-de-alas-desiguales
    titulo: La viga con dos rótulas y un par en el apoyo, y una sección de alas desiguales
    fuente: >-
      Problema 2 · Segunda parte del 16 de enero de 2019 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 2 puntos. Cayó igual el mismo día como problema 3 del examen
      final, donde vale 1,5 puntos; el enunciado se transcribe sin su
      «(2p)», y cada hoja pone sus puntos. El sentido del par y la posición
      del alma se leen en la figura. El examen no publica resolución; el
      desarrollo es nuestro, con los temas 7 y 9.
    nivel: examen
    enunciado: |
      La viga de la figura tiene rótulas en B y D, está apoyada en A y C y
      empotrada en E. La sección indicada es de espesor $t$. Determinar:

      a/ Diagramas de fuerzas cortantes y de momentos flectores en función de
      $q_0$ y $a$.

      b/ Ecuación de tensiones normales y del eje central para la sección de
      momento máximo.

      $q_0$ = 10 kN/m; $a$ = 2,5 m; $t$ = 20 mm

      $$
      M'_y = \frac{M_y - M_z\dfrac{I_{yz}}{I_z}}{1 - \dfrac{I_{yz}^2}{I_yI_z}}
      \qquad
      M'_z = \frac{M_z - M_y\dfrac{I_{yz}}{I_y}}{1 - \dfrac{I_{yz}^2}{I_yI_z}}
      $$

