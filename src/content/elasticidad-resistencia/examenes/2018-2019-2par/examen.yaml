asignatura: elasticidad-resistencia
curso: '2018-2019'
convocatoria: segundo-parcial
fecha: 16 de enero de 2019
# La segunda parte de Elasticidad y Resistencia de Materiales del 16 de
# enero de 2019: tres páginas, la 1 de TEORÍA (cuatro cuestiones de 1
# punto) y la 2 y la 3 de EJERCICIOS (tres de 2 puntos; el ejercicio 3 va
# solo en la página 3). Diez puntos en total, y el cuadernillo los imprime
# todos. El mismo día se hizo el examen final, que repite seis de estas
# siete preguntas (punto 5).
#
# El cuadernillo es bilingüe, castellano a la izquierda y euskera a la
# derecha, y se transcribe **solo la columna en castellano**, tal cual.
#
# 1. **EL PDF PIERDE LOS RÓTULOS DE LA TEORÍA 4, Y EL WORD MANDA.** En el
#    PDF la viga de la cuestión 4 sale sin rótulos: R, S, T y las cotas 2a
#    y a son cuadros de texto del Word original (19-ERM-EME-urt2-ene2.docx),
#    que el PDF no dibuja. Se ponen desde el Word, y el pie de la figura lo
#    dice. El resto del texto y de las figuras sale entero en el PDF.
#
# 2. **LO QUE LA FIGURA DICE Y EL TEXTO NO.**
#    - Ejercicio 1: el techo no está acotado. E está en la vertical de B y
#      la barra 2 forma 30° con la viga, así que el techo está a a/√3; la
#      barra 1 es perpendicular a la 2 (la cota de 90°) y D está en el
#      techo. Se dibuja a escala.
#    - Ejercicio 2: el par M0 de A es horario (el arco sube por la izquierda
#      y acaba arriba con la punta hacia la derecha; lo confirma el «Arco
#      134» del Word). La figura no acota dónde va el alma de la sección: se
#      toma en el centro del ala de abajo, como está dibujada, y el ala de
#      arriba de 9t cuenta el alma. Es la misma lectura que el test de
#      aceptación del motor (tests/fisica/erm/aceptacion-bloque2.test.ts).
#    - Ejercicio 3: BC está en perspectiva, perpendicular al papel y hacia
#      quien mira (−z, con z = x × y hacia dentro); la repartida horizontal
#      va hacia −x.
#    - Cuestión 3: la altura h de la sección es radial (en el plano del
#      arco), como la dibuja la figura. Se resuelve como pieza recta.
#    Cada lectura va también en la nota de su enunciado.
#
# 3. **ERRATAS Y GRAFÍAS DEL TEXTO, CONSERVADAS**: «E= 2·10⁵ MPa» sin
#    espacio antes del igual (ejercicio 1) y «E = 2,5 G» con espacio
#    (ejercicio 3). La cabecera de la página 1 dice «2º Parte» y la de las
#    páginas 2 y 3, «2ª parte». La fórmula de zG del ejercicio 3 y las de
#    los momentos equivalentes del ejercicio 2 son imágenes del Word, y se
#    transcriben.
#
# 4. **DOS NUMERACIONES EN UN CUADERNILLO.** La teoría va de la 1 a la 4 y
#    los ejercicios vuelven a empezar en 1. Aquí la teoría son **n 1 a 4** y
#    los ejercicios **n 5, 6 y 7**; la `fuente` de cada ejercicio dice el
#    nombre impreso. Ninguna pregunta se parte.
#
# 5. **PREGUNTAS REPETIDAS.**
#    - La **cuestión 2**, «2.(1p) Teorema del flujo cortante.», es palabra
#      por palabra la cuestión 3 de la final de enero de 2021, ya en el
#      sitio (`exerm2021-ord-3-el-teorema-del-flujo-cortante`), con los
#      mismos puntos; el enunciado transcrito no lleva el número. Se apunta
#      a ella, como ya hacen la segunda parte y la final de 2019-2020.
#    - Las **cuestiones 3 y 4** y los **tres ejercicios** cayeron igual el
#      mismo día en el examen final: las cuestiones con el mismo número y
#      el mismo punto, y los ejercicios como 2, 3 y 4, con 1,5 puntos. Se
#      resuelven aquí y la final apunta a estos ejercicios. Los tres
#      ejercicios se transcriben sin su «(2p)»: cada hoja pone sus puntos
#      desde `puntosImpresos`, y la `fuente` dice los dos valores.
#
# 6. **EL EUSKERA DE LA HOJA DE EJERCICIOS ES EL DE LA FINAL.** La columna
#    de la derecha de las páginas 2 y 3 numera los ejercicios 2, 3 y 4 y les
#    da «(1,5p)», como en el examen final; el castellano dice 1, 2 y 3 con
#    «(2p)», que suman los diez puntos con la teoría. Manda el castellano.
#    Fuera de eso, el euskera pide lo mismo en las siete preguntas.
#
# 7. **LOS TEMAS.** La cuestión 3 (el arco) va al tema 9: los esfuerzos son
#    del tema 7, pero lo que se pide es la tensión de flexión compuesta. La
#    cuestión 4 va al tema 10 (la viga conjugada), aunque su apartado b use
#    la reciprocidad del tema 13.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso y de un segundo camino (fase-p/p9g,
# guiones/cifras.mjs). Las cuestiones 1 y 2 no traen números: los pasos de
# cálculo de la 1 son un ejemplo nuestro, y lo dicen.
pdf: 2018-2019-2par.pdf
puntosImpresos:
  fuente: Cabecera de cada pregunta, «(1p)» en la teoría y «(2p)» en los ejercicios, págs. 1-3 del cuadernillo.
  reparto:
    - { n: 1, puntos: 1 }
    - { n: 2, puntos: 1 }
    - { n: 3, puntos: 1 }
    - { n: 4, puntos: 1 }
    - { n: 5, puntos: 2 }
    - { n: 6, puntos: 2 }
    - { n: 7, puntos: 2 }

