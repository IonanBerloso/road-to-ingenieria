asignatura: elasticidad-resistencia
curso: '2013-2014'
convocatoria: primer-parcial
fecha: 8 de noviembre de 2013
# El primer parcial de Elasticidad y Resistencia de Materiales de 2013-2014
# («Parte 1» en la cabecera), fechado el 08-11-2013: una hoja de TEORÍA con
# cuatro preguntas de 1 punto y una de EJERCICIOS con tres, de 1,5, 1,5 y 3
# puntos. Dos páginas en castellano y diez puntos que el cuadernillo imprime
# todos. La cabecera es de la Escuela Universitaria Politécnica de San
# Sebastián.
#
# Se transcribe tal cual, con sus puntos impresos. Lo que hay que saber de
# ese texto, dicho antes de que nadie lo deduzca:
#
# 1. **SOLO EL CASTELLANO.** Hay una versión en euskera (13-EME-aza1.pdf) con
#    los mismos datos, las mismas figuras y la misma errata de los «tramos
#    BC y DE» («BC eta DE tarteetan»); solo cambia el subíndice de la tensión
#    admisible (σon). No se transcribe.
#
# 2. **EL PDF ES UNA CONVERSIÓN DEL WORD, Y PIERDE DOS SÍMBOLOS.** El PDF lo
#    ha hecho LibreOffice a partir del Word original (13-ERM-nov1.doc). En la
#    pregunta 2 de teoría pinta tres puntos sobre σ y pierde la flecha de v;
#    el Word, leído por las vistas previas de sus ecuaciones, lleva una
#    flecha doble sobre σ (la notación de tensor de los apuntes) y una flecha
#    sobre v. Se transcriben como en el Word, y la nota del ejercicio lo
#    dice. Las cuatro figuras las dibuja enteras.
#
# 3. **ERRATAS DEL TEXTO, CONSERVADAS**: «tensión nomal» (teoría 3; la nota
#    del ejercicio lo dice) y «en los tramos BC y DE» (ejercicio 3: la figura
#    solo tiene A, B y C, y una carga de A a C; manda la figura, y la nota del
#    ejercicio lo dice). También «a = 4m», sin espacio. Los números
#    impresos «1.-(1,5p)», «2. (1,5p)» y «3.-(3p)» se quedan en «(1,5p)» y
#    «(3p)», como en los demás parciales publicados.
#
# 4. **LA NOTA DE LA CALCULADORA.** La hoja de ejercicios imprime arriba,
#    en cursiva, «Nota: La calculadora sólo se puede utilizar en el tercer
#    ejercicio». Va en las `notas` de los tres ejercicios, tal cual, y no en
#    `instrucciones`, que el sitio presenta como texto de la portada: el
#    examen no tiene portada y la nota es de la hoja de ejercicios. Por eso
#    los resultados de los ejercicios 1 y 2 se dan también en forma exacta.
#
# 5. **LA SECCIÓN DEL EJERCICIO 3** es una L de alas desiguales, como dice
#    p0: el ala vertical a la izquierda y la horizontal arriba, hacia la
#    derecha. Las cotas 10t y 15t son el ancho y el alto totales, hasta las
#    caras exteriores (lo marcan sus líneas de referencia). La figura no
#    está a escala en el espesor, y G está dibujado a ojo. La carga va según
#    y: solo hay Mz, y My = 0. La resolución añade la sección a escala con el
#    eje neutro y los diagramas de cortantes y flectores.
#
# 6. **DOS NUMERACIONES.** La teoría va de 1 a 4 y los ejercicios vuelven a
#    empezar en 1. Aquí la teoría son n 1 a 4 y los ejercicios n 5, 6 y 7;
#    la `fuente` de cada ejercicio dice el nombre impreso. No se parte
#    ninguna pregunta.
#
# 7. **DOS PREGUNTAS YA CONOCIDAS.** El ejercicio 1 es, palabra por palabra
#    y con la misma figura, el ejercicio 2.5 de los enunciados de clase del
#    tema 2, que no trae resolución y no está en el sitio. La teoría 4 es la
#    misma pregunta, con otras palabras, que la cuestión 4 del primer
#    parcial de 2017-2018, ya publicada: se resuelve de nuevo, con otros
#    ejemplos, y su `fuente` lo dice. La figura de la teoría 1 es la 7.7 de
#    los apuntes del tema 7.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso (src/lib/erm) y de un segundo camino
# (fase-p/p6d, guiones/cifras.mjs). El motor no tiene flexión ni piezas
# curvas: la sección y el espesor del ejercicio 3 y las ecuaciones de la
# teoría 1 salen de las fórmulas de los apuntes y se comprueban por
# integración numérica, ejes principales, equilibrio y diferencias finitas.
# Las preguntas de teoría no traen números: sus pasos de cálculo usan
# ejemplos nuestros, y lo dicen.
pdf: 2013-2014-1par.pdf
puntosImpresos:
  fuente: >-
    Impresos junto a cada pregunta: «(1p)» en las cuatro de teoría (pág. 1)
    y «(1,5p)», «(1,5p)» y «(3p)» en los tres ejercicios (pág. 2).
  reparto:
    - { n: 1, puntos: 1 }
    - { n: 2, puntos: 1 }
    - { n: 3, puntos: 1 }
    - { n: 4, puntos: 1 }
    - { n: 5, puntos: 1.5 }
    - { n: 6, puntos: 1.5 }
    - { n: 7, puntos: 3 }

