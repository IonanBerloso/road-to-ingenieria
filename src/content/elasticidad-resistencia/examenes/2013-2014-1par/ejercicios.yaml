      <title id="exerm1314-1par-7-la-viga-con-carga-triangular-y-seccion-en-l-en-t">La sección en L a escala con su centro de gravedad, el eje neutro y las dos esquinas más cargadas</title>
      <desc id="exerm1314-1par-7-la-viga-con-carga-triangular-y-seccion-en-l-en-d">La sección dibujada a escala: el ala vertical de 15t de alto a la izquierda y el ala de arriba de 10t de ancho total, todo de espesor t. G está a 2,375t de la cara exterior del ala vertical y a 4,875t de la cara de arriba. Por G pasan el eje z, horizontal hacia la derecha, y el eje y, hacia abajo. El eje neutro, a trazos, pasa por G y sube hacia la derecha formando 44,2° con z. Por debajo y a la derecha de él la sección está traccionada (signo más) y por encima y a la izquierda, comprimida (signo menos). P, la esquina de abajo del ala vertical en su cara interior, es la más alejada por el lado traccionado; Q, la esquina de arriba a la izquierda, la más alejada por el comprimido.</desc>
