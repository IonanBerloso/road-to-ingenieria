      - tipo: calcular
        titulo: La altura del centro de gravedad
        pregunta: |
          ¿A qué distancia de la cara de arriba de la sección está G, en
          unidades de $t$?
        respuesta:
          tipo: numero
          valor: '4.875'
          tolerancia: 0.005
          formato: un número (la distancia dividida por t)
        distractores:
          - valor: '7.5'
            mensaje: |
              Es la mitad de la altura. G no está a media altura: el ala de
              arriba tira de él hacia arriba.
          - valor: '4.7'
            mensaje: |
              Has contado dos veces el cuadrado de la esquina: el ala vertical
              de $15t \times t$ y la de arriba de $10t \times t$ se solapan en
              un $t \times t$. Una de las dos tiene que ir sin él: el ala de
              arriba, de $9t \times t$.
          - valor: '10.125'
            mensaje: |
              Es la distancia desde la cara de abajo, $15t - 4{,}875t$. El paso
              pregunta desde la de arriba.
        pista: |
          Dos rectángulos sin solaparse: el ala vertical, $t \times 15t$, y el
          resto del ala de arriba, $9t \times t$.
          $\overline{y} = \sum A_i\,y_i/\sum A_i$.
        desarrollo: |
          $A = 15t^{2} + 9t^{2} = 24t^{2}$ y

          $$
          \overline{y} = \frac{15\cdot7{,}5 + 9\cdot0{,}5}{24}\,t = \frac{117}{24}\,t = 4{,}875\,t
          $$
      - tipo: calcular
        titulo: La posición horizontal del centro de gravedad
        pregunta: |
          ¿A qué distancia de la cara exterior del ala vertical está G, en
          unidades de $t$?
        respuesta:
          tipo: numero
          valor: '2.375'
          tolerancia: 0.005
          formato: un número (la distancia dividida por t)
        distractores:
          - valor: '5'
            mensaje: |
              Es la mitad del ancho. El ala vertical, la más grande, está a la
              izquierda y lleva G hacia ella.
          - valor: '2.3'
            mensaje: |
              Has contado dos veces el cuadrado de la esquina, con las dos
              alas enteras ($15t \times t$ y $10t \times t$). El ala de arriba,
              sin la esquina, mide $9t$ y su centro está a $5{,}5t$.
        pista: |
          $\overline{z} = \sum A_i\,z_i/\sum A_i$, con $z$ desde la cara
          exterior del ala vertical.
        desarrollo: |
          $$
          \overline{z} = \frac{15\cdot0{,}5 + 9\cdot5{,}5}{24}\,t = \frac{57}{24}\,t = 2{,}375\,t
          $$
      - tipo: calcular
        titulo: El momento de inercia respecto de z
        pregunta: |
          ¿Cuánto vale $I_z = \int y^{2}\,dA$ respecto del eje $z$ que pasa
          por G, en unidades de $t^{4}$?
        respuesta:
          tipo: numero
          valor: '557.625'
          tolerancia: 0.5
          formato: un número (Iz dividido por t⁴)
        distractores:
          - valor: '282'
            mensaje: |
              Son solo las inercias propias de los dos rectángulos. Falta
              Steiner, $A_i\,d_i^{2}$: el ala de arriba está a $4{,}375t$ de G
              y aporta más que su propia inercia.
          - valor: '1128'
            mensaje: |
              Es la inercia respecto de la cara de arriba, no respecto de G.
              Hay que llevarla al centro de gravedad: $1128 - 24\cdot4{,}875^{2}$.
        pista: |
          Cada rectángulo: $\tfrac{b\,h^{3}}{12} + A\,d^{2}$, con $d$ la
          distancia vertical de su centro a G.
        desarrollo: |
          $$
          I_z = \left(\tfrac{15^{3}}{12} + 15\cdot2{,}625^{2}\right) + \left(\tfrac{9}{12} + 9\cdot4{,}375^{2}\right) = 384{,}609 + 173{,}016 = 557{,}625
          $$

          en $t^{4}$. Igual, $I_y = 202{,}625\,t^{4}$.
      - tipo: calcular
        titulo: El producto de inercia
        pregunta: |
          ¿Cuánto vale $I_{yz} = \int yz\,dA$, con $y$ hacia abajo y $z$ hacia
          la derecha desde G, en unidades de $t^{4}$?
        respuesta:
          tipo: numero
          valor: '-196.875'
          tolerancia: 0.5
          formato: un número (Iyz dividido por t⁴)
        distractores:
          - valor: '196.875'
            mensaje: |
              Es el que sale con $y$ hacia arriba. Con $y$ hacia abajo, el ala
              de arriba está en $y < 0$ y $z > 0$, y la parte baja del ala
              vertical en $y > 0$ y $z < 0$: los dos términos son negativos.
          - valor: '0'
            mensaje: |
              Cada rectángulo tiene producto de inercia propio nulo (sus lados
              son paralelos a los ejes), pero falta Steiner, $A_i\,y_i\,z_i$, y
              aquí no se anula: la L no tiene ningún eje de simetría paralelo
              a $y$ o a $z$.
        pista: |
          Sin término propio: $I_{yz} = \sum A_i\,y_i\,z_i$, con
          $(y_i,\ z_i)$ el centro de cada rectángulo respecto de G.
        desarrollo: |
          $$
          I_{yz} = 15\,(2{,}625)(-1{,}875) + 9\,(-4{,}375)(3{,}125) = -73{,}828 - 123{,}047 = -196{,}875
          $$

          en $t^{4}$.
      - tipo: calcular
        titulo: El eje neutro
        pregunta: |
          El eje neutro pasa por G. ¿Qué ángulo forma con el eje $z$, en
          grados, positivo si sube hacia $+z$?
        respuesta:
          tipo: numero
          valor: '44.18'
          tolerancia: 0.05
          formato: un número, en grados
        distractores:
          - valor: '0'
            mensaje: |
              Sería el eje $z$, el de la carga según $y$ en una sección con
              $y$, $z$ principales. Aquí $I_{yz} \ne 0$: los ejes no son
              principales y el eje neutro se tuerce.
          - valor: '-44.18'
            mensaje: |
              Es el ángulo con el signo de $I_{yz}$ cambiado, el que sale con
              $y$ hacia arriba. Con $y$ hacia abajo, $I_{yz} < 0$, y el eje
              neutro sube hacia la derecha: cruza el ala vertical por debajo
              de G, a la izquierda, y el ala de arriba, a la derecha.
          - valor: '-23.98'
            mensaje: |
              Es el eje principal de inercia máxima, que baja 23,98° hacia
              $+z$. El eje neutro coincide con un eje principal solo si el
              momento va según él; aquí el momento va según $z$, y el eje
              neutro se aleja del principal hacia el de inercia mínima.
        pista: |
          Con $M_y = 0$ las ecs. 9.10 y 9.11 dan
          $\sigma_x = M_z\,\dfrac{I_y\,y - I_{yz}\,z}{I_yI_z - I_{yz}^{2}}$,
          y el eje neutro es $\sigma_x = 0$.
        desarrollo: |
          $\sigma_x = 0$ da $y = (I_{yz}/I_y)\,z = -0{,}9716\,z$: con $y$ hacia
          abajo, el eje sube hacia $+z$ formando

          $$
          \beta = \operatorname{arctg}\frac{196{,}875}{202{,}625} = 44{,}18^{\circ}
          $$
      - tipo: calcular
        titulo: El espesor
        pregunta: |
          ¿Qué espesor $t$ hace que la máxima tensión normal sea exactamente
          $\sigma_{adm}$, en cm?
        respuesta:
          tipo: numero
          valor: '2.406'
          tolerancia: 0.002
          formato: un número, en cm
        distractores:
          - valor: '2.193'
            mensaje: |
              Es el espesor con $I_{yz} = 0$, $\sigma = M\,y/I_z$ en el pie de la
              L. El producto de inercia tuerce el eje neutro y carga más la
              esquina interior del pie.
          - valor: '2.339'
            mensaje: |
              Has dimensionado con el flector en B, $\tfrac23q_0a^{2}$. El
              máximo está a $1{,}367a$ de A y es un 9 % mayor.
          - valor: '0.5184'
            mensaje: |
              Has dejado el momento en kg·m con $\sigma_{adm}$ en kg/cm². En
              las mismas unidades, $M_{max} = 11\,612$ kg·m $= 1\,161\,240$ kg·cm.
        pista: |
          La tensión máxima está en el punto más alejado del eje neutro: la
          esquina de abajo del ala vertical, en su cara interior, con
          $(y,\ z) = (10{,}125t,\ -1{,}375t)$ respecto de G.
        desarrollo: |
          $$
          \sigma_P = \frac{202{,}625\cdot10{,}125 - 196{,}875\cdot1{,}375}{74\,229}\,\frac{M}{t^{3}} = 0{,}023992\,\frac{M}{t^{3}}
          $$

          y con $M_{max} = 0{,}725775\cdot1000\cdot4^{2}$ kg·m $= 1\,161\,240$ kg·cm:

          $$
          t^{3} = \frac{0{,}023992\cdot1\,161\,240}{2000}\ \text{cm}^{3} = 13{,}93\ \text{cm}^{3}
          \quad\Longrightarrow\quad t = 2{,}406\ \text{cm}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Reacciones: $R_A = \tfrac56q_0a$ y $R_C = \tfrac23q_0a$; el
              cortante se anula en $x_0 = 1{,}367a$ y allí
              $M_{max} = 0{,}7258\,q_0a^{2}$.
          - texto: >-
              G está a $4{,}875t$ de la cara de arriba y a $2{,}375t$ de la
              cara exterior del ala vertical.
          - texto: >-
              $I_z = 557{,}625\,t^{4}$, $I_y = 202{,}625\,t^{4}$ e
              $I_{yz} = -196{,}875\,t^{4}$.
          - texto: >-
              Con $M_y = 0$:
              $\sigma_x = (2{,}7298\,y + 2{,}6523\,z)\cdot10^{-3}\,M/t^{3}$; el
              eje neutro sube 44,18° hacia $+z$.
          - texto: >-
              La esquina más alejada es la del pie, cara interior:
              $\sigma = 0{,}023992\,M/t^{3} = \sigma_{adm}$ da $t = 2{,}406$ cm.
          - texto: >-
              Como la carga va según $y$, el eje neutro es el eje $z$ y la
              tensión máxima está en toda la cara de abajo del pie.
            trampa: true
            mensaje: |
              Eso vale si $y$, $z$ son principales. En la L no lo son
              ($I_{yz} \ne 0$): con la carga según $y$ el eje neutro se tuerce
              44,18°, y la esquina interior del pie trabaja más que la
              exterior. Sin $I_{yz}$ el espesor sale un 9 % menor, del lado
              inseguro.
    resolucion: |
      **a/ Las reacciones.** La carga son dos triángulos: en AB, de 0 a
      $q_0$, con resultante $q_0a/2$ a $2a/3$ de A; en BC, de $q_0$ a 0, con
      resultante $q_0a$ a $2a/3$ de B (el centro de un triángulo está a un
      tercio de la base desde el lado alto). La carga total es
      $\tfrac32q_0a$. Momentos respecto de C:

      $$
      R_A\cdot3a = \frac{q_0a}{2}\cdot\frac{7a}{3} + q_0a\cdot\frac{4a}{3}
      \quad\Longrightarrow\quad R_A = \frac{5}{6}\,q_0a,\qquad R_C = \frac{2}{3}\,q_0a
      $$

      **Los esfuerzos.** Con $x$ desde A y el convenio del curso ($y$ y la
      carga hacia abajo, $dT/dx = -q$, $dM/dx = T$, $M > 0$ tracciona abajo):

      | tramo | $q(x)$ | $T(x)$ | $M(x)$ |
      |---|---|---|---|
      | AB, $0 \le x \le a$ | $q_0\,x/a$ | $\tfrac56q_0a - \dfrac{q_0x^{2}}{2a}$ | $\tfrac56q_0a\,x - \dfrac{q_0x^{3}}{6a}$ |
      | BC, desde C, $s = 3a - x \le 2a$ | $q_0\,s/(2a)$ | $-\tfrac23q_0a + \dfrac{q_0s^{2}}{4a}$ | $\tfrac23q_0a\,s - \dfrac{q_0s^{3}}{12a}$ |

      En B, $T = \tfrac13q_0a$ y $M = \tfrac23q_0a^{2}$ (los dos lados dan
      lo mismo). El cortante se anula en el tramo BC, en
      $s = 2a\sqrt{2/3}$ desde C, es decir, en $x_0 = 1{,}367a$, y allí está
      el máximo del flector:

      $$
      M_{max} = \frac{8\sqrt6}{27}\,q_0a^{2} = 0{,}7258\,q_0a^{2}
      $$

