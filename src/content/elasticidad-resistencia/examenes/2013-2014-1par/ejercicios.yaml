  # ── Teoría · pregunta 1 · la rebanada de directriz curva.
  - id: exerm1314-1par-1-la-rebanada-de-directriz-curva
    titulo: Las ecuaciones de equilibrio de la rebanada de una pieza de directriz curva
    fuente: >-
      Pregunta 1 de teoría · Primer parcial de 2013-2014 (hoja de teoría del 8
      de noviembre de 2013) · Elasticidad y Resistencia de Materiales, Escuela
      Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 1 punto. La
      figura es la 7.7 de los apuntes del tema 7. El examen no publica
      resolución; el desarrollo es nuestro y sigue los apuntes del tema 7,
      apartado 7.6 (págs. 13 y 14, ecs. 7.18 a 7.21). Los pasos de cálculo
      son ejemplos nuestros.
    nivel: examen
    enunciado: |
      (1p) En la figura se muestra un elemento diferencial de una pieza
      prismática con radio de curvatura $R$. El radio de curvatura $R$, la
      fuerza normal $N$, la fuerza cortante $T$ y el momento flector $M$ son
      funciones del ángulo $\theta$. El elemento diferencial soporta la
      fuerza radial $q_r$ y la fuerza tangencial $q_\theta$, que son función
      de $\theta$, ambas distribuidas por unidad de longitud del eje de la
      viga. Determinar las ecuaciones diferenciales de equilibrio,
      planteando las ecuaciones de equilibrio de fuerzas en la dirección
      tangencial ($\theta$) y radial ($r$) y tomando momentos respecto al
      punto O.

