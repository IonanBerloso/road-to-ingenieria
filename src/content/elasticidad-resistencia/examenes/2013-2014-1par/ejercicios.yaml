      <figcaption>

      Redibujada del PDF del examen, que es la figura 7.7 de los apuntes del
      tema 7. Las cargas qr y qθ van en gris, como en el original; las caras
      de la rebanada se dibujan exactamente radiales.

      </figcaption>
      </figure>
    pide: >-
      Las tres ecuaciones diferenciales de equilibrio de la rebanada curva,
      dN/dθ, dT/dθ y dM/dθ, con los sentidos de la figura.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al sumar las fuerzas según el radio, ¿qué aportan $N$ y $N + dN$?
        opciones:
          - texto: >-
              $-N\,d\theta$, hacia O: las dos caras están giradas $d\theta/2$
              respecto de la tangente del centro, y cada axil tiene una
              componente de $N\,d\theta/2$ hacia O
            correcta: true
            mensaje: |
              Eso es. Es el término que no existe en la pieza recta, y el que
              acopla las ecuaciones: un anillo comprimido equilibra así una
              carga radial hacia dentro.
          - texto: >-
              Nada: el axil es tangente a la directriz y no tiene componente
              radial
            mensaje: |
              Es tangente en su cara, pero las dos caras no son paralelas:
              forman el ángulo $d\theta$. Respecto del radio del centro de la
              rebanada, cada una está girada $d\theta/2$, y su axil tiene
              componente radial.
          - texto: >-
              $dN$, lo mismo que en la dirección tangencial
            mensaje: |
              $dN$ es lo que dan en la tangencial, donde entran los cosenos,
              que valen 1. En la radial entran los senos,
              $\sin(d\theta/2) \approx d\theta/2$, multiplicados por $N$: queda
              $-N\,d\theta$, y el $dN\,d\theta$ es de segundo orden.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción completa de las tres ecuaciones, como en el
          examen, con los sentidos positivos de la figura.
        rubrica:
          - punto: >-
              Se aísla la rebanada de ángulo dθ con los esfuerzos y las cargas
              en los sentidos de la figura, se dice que θ crece hacia la
              derecha y que las cargas actúan sobre la longitud R dθ de la
              directriz.
            porque: >-
              Los signos de las tres ecuaciones salen de esos sentidos; con θ
              medido al revés cambian, y las cargas van por unidad de longitud
              del eje, como dice el enunciado.
            minimo: true
          - punto: >-
              Fuerzas según la tangente del centro: cada cara está girada dθ/2;
              con cos(dθ/2) ≈ 1 y sen(dθ/2) ≈ dθ/2, los axiles dan dN, las
              cortantes −T dθ y la carga qθ R dθ: dN/dθ = T − qθ R (ec. 7.18).
            porque: >-
              Es la primera ecuación, y su término −T dθ es el que la pieza
              recta no tiene.
            minimo: true
          - punto: >-
              Fuerzas según el radio: los axiles dan −N dθ (hacia O), las
              cortantes −dT y la carga −qr R dθ: dT/dθ = −N − qr R (ec. 7.19).
            porque: >-
              La componente radial del axil es lo que acopla las ecuaciones de
              una pieza curva.
            minimo: true
          - punto: >-
              Momentos respecto de O: T y qr son radiales y pasan por O; N,
              N + dN y qθ R dθ tienen brazo R. Queda dM = R dN + qθ R² dθ
              (ec. 7.20) y, con la primera, dM/dθ = T R (ec. 7.21).
            porque: >-
              Es lo que pide el enunciado, momentos respecto de O, y lleva a la
              ecuación de la pieza recta con dx = R dθ.
            minimo: true
          - punto: >-
              Se desprecian los productos de diferenciales (dN dθ, dT dθ) y se
              dice que las ecuaciones valen aunque R cambie con θ, con O el
              centro de curvatura de la rebanada.
            porque: >-
              Es lo que deja las ecuaciones lineales, y el enunciado dice que
              R es función de θ.
      - tipo: calcular
        titulo: El axil de un anillo con carga radial
        pregunta: |
          Un ejemplo nuestro: un anillo circular cuya directriz tiene radio
          $R$ = 3 m soporta una carga radial uniforme $q_r$ = 4 kN/m hacia el
          centro, sin carga tangencial. Por simetría, $T = 0$ y $N$ es el
          mismo en todas las secciones. ¿Cuánto vale $N$, en kN, con su signo
          (tracción positiva)?
        respuesta:
          tipo: numero
          valor: '-12'
          tolerancia: 0.01
          formato: un número, en kN
        distractores:
          - valor: '12'
            mensaje: |
              El valor es ese y el signo no. Una carga radial hacia el centro
              aprieta el anillo: el axil es de compresión. La ec. 7.19 con
              $T = 0$ da $N = -q_rR$.
          - valor: '-4'
            mensaje: |
              Te has dejado el radio. $q_r$ va por unidad de longitud de la
              directriz: sobre la rebanada actúa $q_rR\,d\theta$, y el axil es
              $q_r$ por $R$.
        pista: |
          Con $T = 0$ en todo el anillo, $dT/d\theta = 0$ en la ec. 7.19.
        desarrollo: |
          $0 = -N - q_rR$, así que $N = -q_rR = -4\cdot3 = -12$ kN, a
          compresión. Es la fórmula del anillo con presión exterior del tema
          8: el equilibrio de medio anillo,
          $2N = -\int_0^{\pi} q_rR\,\sin\theta\,d\theta = -2q_rR$, da lo mismo.
      - tipo: calcular
        titulo: La pendiente de la cortante
        pregunta: |
          Otro ejemplo nuestro: en una sección de una pieza curva donde no hay
          carga repartida ($q_r = q_\theta = 0$), el axil vale $N$ = −10 kN.
          ¿Cuánto vale allí $dT/d\theta$, en kN por radián?
        respuesta:
          tipo: numero
          valor: '10'
          tolerancia: 0.01
          formato: un número, en kN por radián
        distractores:
          - valor: '0'
            mensaje: |
              Es lo que pasaría en una pieza recta sin carga: $dT/dx = 0$. En
              la curva el axil tiene componente radial entre las dos caras, y
              la cortante cambia aunque no haya carga.
          - valor: '-10'
            mensaje: |
              El signo: la ec. 7.19 es $dT/d\theta = -N - q_rR$, con un menos
              delante de $N$. Con $N$ negativo, $dT/d\theta$ es positivo.
        pista: |
          $dT/d\theta = -N - q_rR$ (ec. 7.19).
        desarrollo: |
          $dT/d\theta = -N - q_rR = -(-10) - 0 = 10$ kN por radián.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Se aísla la rebanada de ángulo $d\theta$; las cargas actúan sobre
              $R\,d\theta$ y cada cara está girada $d\theta/2$ respecto del
              centro.
          - texto: >-
              Según la tangente: $dN - T\,d\theta + q_\theta R\,d\theta = 0$,
              es decir, $dN/d\theta = T - q_\theta R$.
          - texto: >-
              Según el radio: $-N\,d\theta - dT - q_rR\,d\theta = 0$, es decir,
              $dT/d\theta = -N - q_rR$.
          - texto: >-
              Momentos respecto de O: $dM - R\,dN - q_\theta R^{2}\,d\theta = 0$,
              y con la primera, $dM/d\theta = T\,R$.
          - texto: >-
              En los momentos respecto de O solo entran $M$ y $q_\theta$: $T$,
              $q_r$ y los axiles pasan por O.
            trampa: true
            mensaje: |
              $T$ y $q_r$ son radiales y sí pasan por O, pero los axiles no:
              son perpendiculares al radio y tienen brazo $R$. Su momento,
              $-R\,dN$, es el que convierte la ecuación de momentos en
              $dM/d\theta = TR$.
    resolucion: |
      **La rebanada** (apuntes del tema 7, apartado 7.6, figura 7.7). Un
      sector de ángulo $d\theta$ de una pieza de directriz curva, con O el
      centro de curvatura y $R$ el radio; $\theta$ crece hacia la derecha. Las
      cargas van por unidad de longitud de la directriz y actúan sobre
      $ds = R\,d\theta$: la radial, $q_rR\,d\theta$, hacia O, y la tangencial,
      $q_\theta R\,d\theta$, hacia donde crece $\theta$. En la cara de
      $\theta$, $N$ sale de la rebanada, $T$ va según la cara alejándose de O y
      $M$ es horario; en la de $\theta + d\theta$, $N + dN$ sale, $T + dT$ va
      hacia O y $M + dM$ es antihorario.

      Se proyecta sobre la tangente y el radio del centro de la rebanada.
      Cada cara está girada $d\theta/2$ respecto de ellos; con
      $\cos(d\theta/2) \approx 1$ y $\sin(d\theta/2) \approx d\theta/2$, y
      despreciando los productos de diferenciales:

      **Según la tangente.**

      $$
      (N + dN) - N - T\,\frac{d\theta}{2} - (T + dT)\,\frac{d\theta}{2} + q_\theta R\,d\theta = 0
      \quad\Longrightarrow\quad
      \frac{dN}{d\theta} = T - q_\theta R \qquad (7.18)
      $$

      **Según el radio** (positivo hacia fuera de O). Los axiles tienen ahora
      componente radial, hacia O:

      $$
      -N\,\frac{d\theta}{2} - (N + dN)\,\frac{d\theta}{2} + T - (T + dT) - q_rR\,d\theta = 0
      \quad\Longrightarrow\quad
      \frac{dT}{d\theta} = -N - q_rR \qquad (7.19)
      $$

      **Momentos respecto de O** (antihorario positivo). $T$, $T + dT$ y
      $q_r$ son radiales y pasan por O. Los axiles y $q_\theta$ son
      perpendiculares al radio y tienen brazo $R$:

      $$
      (M + dM) - M - R\,(N + dN) + R\,N - q_\theta R^{2}\,d\theta = 0
      \quad\Longrightarrow\quad
      \frac{dM}{d\theta} = R\,\frac{dN}{d\theta} + q_\theta R^{2} \qquad (7.20)
      $$

      y sustituyendo la 7.18:

      $$
      \frac{dM}{d\theta} = T\,R \qquad (7.21)
      $$

      **Lo que dicen.** Con $ds = R\,d\theta$ la 7.21 es la de la pieza recta,
      $dM/ds = T$. Lo nuevo son los acoplamientos: $T$ en la primera y $N$ en
      la segunda, que vienen de que las caras no son paralelas. Si $R \to \infty$
      con $R\,d\theta = dx$ fijo, desaparecen y quedan las de la pieza recta.
      Las ecuaciones valen aunque $R$ cambie con $\theta$, porque se plantean
      en cada rebanada con su centro de curvatura. Con $\theta$ medido al
      revés, como en las diapositivas (y con él $q_\theta$, que apunta hacia
      donde crece $\theta$), quedan $dN/d\theta = -(T + q_\theta R)$,
      $dT/d\theta = N + q_r R$ y $dM/d\theta = -TR$: las mismas ecuaciones,
      con $\theta$ medido en el otro sentido. Al deducirlas, hay que decir
      cómo se mide $\theta$, que es lo que fija los signos.

      **Dos ejemplos nuestros.** Un anillo de radio 3 m con $q_r$ = 4 kN/m
      hacia el centro: por simetría $T = 0$, y la 7.19 da
      $N = -q_rR = -12$ kN, a compresión. En una sección sin carga con
      $N$ = −10 kN, $dT/d\theta = 10$ kN por radián.

      **Comprobaciones.** El motor del curso no tiene piezas curvas. Las
      ecuaciones se han comprobado con un arco en ménsula de radio 3 m,
      resuelto por estática con los sentidos de la figura 7.7 y con cargas
      $q_r$ y $q_\theta$ que cambian con $\theta$: derivando por diferencias
      finitas sus $N$, $T$ y $M$, las cuatro ecuaciones, de la 7.18 a la 7.21,
      se cumplen en tres secciones. El axil del anillo sale igual con la
      fórmula del anillo del tema 8 y con el equilibrio de medio anillo
      integrado numéricamente.

  # ── Teoría · pregunta 2 · cómo se transforma el tensor de tensiones.
  - id: exerm1314-1par-2-el-giro-del-tensor-de-tensiones
    titulo: Cómo cambian las componentes del tensor de tensiones al girar los ejes
    fuente: >-
      Pregunta 2 de teoría · Primer parcial de 2013-2014 (hoja de teoría del 8
      de noviembre de 2013) · Elasticidad y Resistencia de Materiales, Escuela
      Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 1 punto. El
      examen no publica resolución; el desarrollo es nuestro y sigue los
      apuntes del tema 2, apartado 2.4.2 (págs. 12 a 15, ecs. 2.22 a 2.28).
      El paso de cálculo es un ejemplo nuestro, con la matriz de giro del
      ejemplo de los apuntes (p. 14).
    nivel: examen
    enunciado: |
      (1p) En la rotación de un sistema de referencia, las componentes del
      vector $\vec{v}$ se transforman según
      $\{v\}_{(Oxyz)'} = [R]\{v\}_{(Oxyz)}$. Deducir cómo se transforman las
      componentes del tensor de tensiones $\overleftrightarrow{\sigma}$.

      **Notas nuestras.** La flecha doble sobre $\sigma$ es la notación de
      tensor de los apuntes. El PDF del examen la pinta como tres puntos y
      pierde la flecha de $\vec{v}$; el Word original tiene las dos.
    pide: >-
      La ley con que cambian las componentes del tensor de tensiones al girar
      los ejes, deducida paso a paso, y su inversa.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De qué hay que partir para deducirlo?
        opciones:
          - texto: >-
              De $\{S\} = [\sigma]\{n\}$, que vale en los dos sistemas, con
              $\{S\}$ y $\{n\}$ transformándose como vectores
            correcta: true
            mensaje: |
              Eso es. El tensor es lo que convierte la normal de un plano en
              su vector tensión, y esa relación no depende de los ejes. Como
              los dos vectores se transforman con $[R]$, el tensor queda
              obligado a transformarse de una forma concreta.
          - texto: >-
              De girar cada columna de $[\sigma]$ como un vector:
              $[\sigma]' = [R][\sigma]$
            mensaje: |
              Eso solo gira uno de los dos índices. Cada componente del tensor
              lleva dos direcciones, la normal del plano y la de la
              componente, y las dos giran: por eso $[R]$ aparece dos veces.
          - texto: >-
              De que las componentes no cambian, porque el estado de tensiones
              es el mismo
            mensaje: |
              El estado es el mismo, pero sus componentes dependen de los ejes,
              como las de un vector. Lo que no cambia son los invariantes
              ($I_1$, $I_2$, $I_3$) y las tensiones principales.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción completa, como en el examen, hasta la ley de
          transformación y su inversa.
        rubrica:
          - punto: >-
              Se escribe la relación de Cauchy en los dos sistemas:
              {S} = [σ]{n} y {S}' = [σ]'{n}' (ecs. 2.25 y 2.26).
            porque: >-
              Es lo que define el tensor: lo que no cambia al girar los ejes es
              la relación entre la normal de un plano y su vector tensión.
            minimo: true
          - punto: >-
              Se aplica el dato a los dos vectores: {S}' = [R]{S} y
              {n}' = [R]{n} (ec. 2.22).
            porque: >-
              Es el enunciado: {S} y {n} son vectores y se transforman como
              {v}.
            minimo: true
          - punto: >-
              Se justifica [R]⁻¹ = [R]ᵗ: las filas de [R] son los vectores
              unitarios de los ejes nuevos, perpendiculares y de módulo uno
              (ecs. 2.23 y 2.24).
            porque: >-
              Es lo que permite despejar {n} = [R]ᵗ{n}' sin invertir una
              matriz.
            minimo: true
          - punto: >-
              Se encadena {S}' = [R][σ]{n} = [R][σ][R]ᵗ{n}' y, como vale para
              cualquier {n}', [σ]' = [R][σ][R]ᵗ (ec. 2.27).
            porque: >-
              El «para cualquier normal» es lo que permite identificar las dos
              matrices; con una sola normal no bastaría.
            minimo: true
          - punto: >-
              Se da la inversa, [σ] = [R]ᵗ[σ]'[R] (ec. 2.28), o el sentido de
              una componente: σx' = î'ᵗ[σ]î' es la tensión normal en el plano
              de normal î'.
            porque: >-
              Enseña que se entiende qué hace cada fila de [R], y la inversa es
              la que se usa para volver.
      - tipo: calcular
        titulo: Una componente normal después del giro
        pregunta: |
          Un ejemplo nuestro, en MPa: $\sigma_x = 50$, $\sigma_y = 80$,
          $\sigma_z = 20$, $\tau_{xy} = 20$, $\tau_{yz} = 30$ y $\tau_{xz} = 0$.
          Los ejes giran $\theta = 30^{\circ}$ alrededor de $x$, con la matriz
          del ejemplo de los apuntes:

          $$
          [R] = \begin{bmatrix} 1 & 0 & 0 \\ 0 & \cos\theta & \sin\theta \\ 0 & -\sin\theta & \cos\theta \end{bmatrix}
          $$

          ¿Cuánto vale $\sigma_{y'}$, en MPa?
        respuesta:
          tipo: numero
          valor: '90.98'
          tolerancia: 0.02
          formato: un número, en MPa
        distractores:
          - valor: '39.02'
            mensaje: |
              Es el giro al revés, $[R]^{t}[\sigma][R]$: la fórmula de volver
              (ec. 2.28), que equivale a girar $-30^{\circ}$. Para pasar a los
              ejes nuevos, $[R]$ va a la izquierda.
          - valor: '84.28'
            mensaje: |
              Has hecho solo $[R][\sigma]$, como si el tensor fuera un vector.
              Falta multiplicar por $[R]^{t}$ a la derecha: el tensor gira por
              sus dos índices.
          - valor: '77.99'
            mensaje: |
              Te falta el 2 del término cruzado:
              $\sigma_{y'} = \sigma_y\cos^{2}\theta + \sigma_z\sin^{2}\theta + 2\tau_{yz}\sin\theta\cos\theta$.
              Sale de que $\tau_{yz}$ y $\tau_{zy}$ son dos términos iguales de
              la matriz.
        pista: |
          La fila 2 de $[R]$ es $\hat{j}' = (0,\ \cos\theta,\ \sin\theta)$, y
          $\sigma_{y'} = \{\hat{j}'\}^{t}[\sigma]\{\hat{j}'\}$: el término 2,2 de
          $[R][\sigma][R]^{t}$.
        desarrollo: |
          En MPa:

          $$
          \sigma_{y'} = \sigma_y\cos^{2}\theta + \sigma_z\sin^{2}\theta + 2\tau_{yz}\sin\theta\cos\theta = 80\cdot0{,}75 + 20\cdot0{,}25 + 60\cdot0{,}4330 = 90{,}98
          $$
      - tipo: calcular
        titulo: La tangencial entre los dos ejes que giran
        pregunta: |
          Con el mismo tensor y el mismo giro, ¿cuánto vale $\tau_{y'z'}$, en
          MPa?
        respuesta:
          tipo: numero
          valor: '-10.98'
          tolerancia: 0.02
          formato: un número, en MPa
        distractores:
          - valor: '40.98'
            mensaje: |
              Es el giro al revés, $[R]^{t}[\sigma][R]$, que equivale a girar
              $-30^{\circ}$: cambia el signo del término en
              $\sin\theta\cos\theta$.
          - valor: '-25.98'
            mensaje: |
              Te falta la $\tau_{yz}$ que ya había:
              $\tau_{y'z'} = (\sigma_z - \sigma_y)\sin\theta\cos\theta + \tau_{yz}(\cos^{2}\theta - \sin^{2}\theta)$.
              El segundo término vale $30\cdot0{,}5 = 15$ MPa.
        pista: |
          $\tau_{y'z'} = \{\hat{k}'\}^{t}[\sigma]\{\hat{j}'\}$, con
          $\hat{k}' = (0,\ -\sin\theta,\ \cos\theta)$.
        desarrollo: |
          En MPa:

          $$
          \tau_{y'z'} = (\sigma_z - \sigma_y)\sin\theta\cos\theta + \tau_{yz}(\cos^{2}\theta - \sin^{2}\theta) = -60\cdot0{,}4330 + 30\cdot0{,}5 = -10{,}98
          $$
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              En los dos sistemas: $\{S\} = [\sigma]\{n\}$ y
              $\{S\}' = [\sigma]'\{n\}'$.
          - texto: >-
              Los dos son vectores: $\{S\}' = [R]\{S\}$ y $\{n\}' = [R]\{n\}$.
          - texto: >-
              $[R]$ es ortogonal: $[R]^{-1} = [R]^{t}$, así que
              $\{n\} = [R]^{t}\{n\}'$.
          - texto: >-
              $\{S\}' = [R][\sigma][R]^{t}\{n\}'$ para cualquier $\{n\}'$:
              $[\sigma]' = [R][\sigma][R]^{t}$, y al revés,
              $[\sigma] = [R]^{t}[\sigma]'[R]$.
          - texto: >-
              Como $[R]$ es ortogonal, $[R]^{t} = [R]$ y
              $[\sigma]' = [R][\sigma][R]$.
            trampa: true
            mensaje: |
              Ortogonal quiere decir que la traspuesta es la **inversa**, no
              que sea igual a la matriz. $[R]^{t} = [R]$ es ser simétrica, y
              una matriz de giro no lo es salvo en casos especiales: en el
              ejemplo, el $\sin\theta$ de arriba y el de abajo tienen signos
              distintos.
    resolucion: |
      **De dónde se parte** (apuntes del tema 2, apartado 2.4.2). El vector
      tensión en un plano de normal $\{n\}$ es $\{S\} = [\sigma]\{n\}$, y esa
      relación vale en cualquier sistema de referencia (ecs. 2.25 y 2.26):

      $$
      \{S\} = [\sigma]\{n\},\qquad \{S\}' = [\sigma]'\{n\}'
      $$

      **Los vectores.** $\{S\}$ y $\{n\}$ son vectores y se transforman como
      dice el enunciado: $\{S\}' = [R]\{S\}$ y $\{n\}' = [R]\{n\}$ (ec. 2.22).
      Las filas de $[R]$ son los vectores unitarios de los ejes nuevos
      escritos en los viejos: perpendiculares entre sí y de módulo uno. Por
      eso $[R][R]^{t} = [I]$, es decir, $[R]^{-1} = [R]^{t}$ (ec. 2.24): la
      matriz es ortogonal, y la vuelta es $\{n\} = [R]^{t}\{n\}'$ (ec. 2.23).

      **La ley.** Premultiplicando por $[R]$ la relación en los ejes viejos y
      llevando $\{n\}$ a los nuevos:

      $$
      \{S\}' = [R]\{S\} = [R][\sigma]\{n\} = [R][\sigma][R]^{t}\,\{n\}'
      $$

      Comparando con $\{S\}' = [\sigma]'\{n\}'$, que vale **para cualquier**
      $\{n\}'$:

      $$
      [\sigma]' = [R]\,[\sigma]\,[R]^{t} \qquad (2.27)
      $$

      y, despejando, la inversa:
      $[\sigma] = [R]^{t}\,[\sigma]'\,[R]$ (ec. 2.28). El tensor gira por sus
      dos índices: $[R]$ aparece dos veces, una por la normal del plano y
      otra por la dirección de la componente. Cada término tiene su sentido:
      $\sigma_{x'} = \{\hat{i}'\}^{t}[\sigma]\{\hat{i}'\}$ es la tensión
      normal en el plano de normal $\hat{i}'$, y
      $\tau_{x'y'} = \{\hat{j}'\}^{t}[\sigma]\{\hat{i}'\}$, la componente según
      $\hat{j}'$ del vector tensión de ese plano.

      **Un ejemplo nuestro.** Con $\sigma_x = 50$, $\sigma_y = 80$,
      $\sigma_z = 20$, $\tau_{xy} = 20$, $\tau_{yz} = 30$ y $\tau_{xz} = 0$ MPa,
      y un giro de 30° alrededor de $x$ con la $[R]$ del ejemplo de los
      apuntes (p. 14), el producto $[R][\sigma][R]^{t}$ da, en MPa:

      $$
      [\sigma]' = \begin{bmatrix} 50 & 17{,}32 & -10 \\ 17{,}32 & 90{,}98 & -10{,}98 \\ -10 & -10{,}98 & 9{,}02 \end{bmatrix}
      $$

      Los invariantes no cambian: la traza es 150 en los dos sistemas, y
      también $I_2 = 5300$ e $I_3 = 27\,000$ (en MPa², MPa³).

      **Comprobaciones.** El motor del curso (`giraTensor`) da la misma
      matriz; el segundo camino, cada componente como proyección directa
      ($\sigma_{y'} = \{\hat{j}'\}^{t}[\sigma]\{\hat{j}'\}$,
      $\tau_{y'z'} = \{\hat{k}'\}^{t}[\sigma]\{\hat{j}'\}$, y las de $x'$), y
      los tres invariantes, coinciden.

  # ── Teoría · pregunta 3 · las direcciones principales son las de σn extrema.
  - id: exerm1314-1par-3-las-principales-son-las-de-normal-extrema
    titulo: Las direcciones en que la tensión normal es máxima o mínima
    fuente: >-
      Pregunta 3 de teoría · Primer parcial de 2013-2014 (hoja de teoría del 8
      de noviembre de 2013) · Elasticidad y Resistencia de Materiales, Escuela
      Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 1 punto. El
      examen no publica resolución; el desarrollo es nuestro y sigue los
      apuntes del tema 2, apartado 2.4.3 (págs. 15 y 16, ecs. 2.29 a 2.33).
      Los pasos de cálculo son un ejemplo nuestro.
    nivel: examen
    enunciado: |
      (1p) Demostrar que las direcciones principales del tensor de tensiones
      y las direcciones de tensión nomal máxima y mínima son las mismas.

      **Notas nuestras.** «nomal» es una errata del original, por «normal».
    pide: >-
      La demostración de que las direcciones en que σn es máxima o mínima son
      las principales, y de que esos extremos valen σ1 y σ3.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué problema hay que plantear?
        opciones:
          - texto: >-
              Hacer máxima o mínima $\sigma_n = \{n\}^{t}[\sigma]\{n\}$ con la
              condición $\{n\}^{t}\{n\} = 1$
            correcta: true
            mensaje: |
              Eso es: un problema de extremos condicionados, que se resuelve
              con un multiplicador de Lagrange (ecs. 2.31 a 2.33). La
              condición es imprescindible: sin ella, $\sigma_n$ crece con el
              tamaño de $\{n\}$.
          - texto: >-
              Derivar $\sigma_n = \{n\}^{t}[\sigma]\{n\}$ respecto de $\{n\}$ e
              igualar a cero
            mensaje: |
              Sin la condición de módulo unidad, la derivada,
              $2[\sigma]\{n\} = \{0\}$, solo da $\{n\} = \{0\}$ cuando $[\sigma]$
              es invertible. $\{n\}$ no es libre: es un vector unitario.
          - texto: >-
              Buscar el plano en que el vector tensión tiene módulo máximo
            mensaje: |
              Eso busca el mayor $|S|$, no la mayor tensión normal, que es la
              proyección de $\{S\}$ sobre $\{n\}$. Son problemas distintos,
              aunque en este caso los dos lleven a las mismas direcciones.
      - tipo: redactar
        que: demostracion
        consigna: >-
          Escribe la demostración completa, como en el examen.
        rubrica:
          - punto: >-
              Se plantea: σn = {n}ᵗ[σ]{n} (ec. 2.16), con la condición
              {n}ᵗ{n} = 1.
            porque: >-
              Sin la condición el problema no tiene extremos: σn crece con el
              módulo de {n}.
            minimo: true
          - punto: >-
              Se forma la función lagrangiana
              F = {n}ᵗ[σ]{n} − λ({n}ᵗ{n} − 1) (ec. 2.31).
            porque: >-
              Es el método de los extremos condicionados.
            minimo: true
          - punto: >-
              Se deriva respecto de {n} e iguala a cero:
              2[σ]{n} − 2λ{n} = {0} (ec. 2.32), usando que [σ] es simétrico.
            porque: >-
              La simetría es la que hace que la derivada de {n}ᵗ[σ]{n} sea
              2[σ]{n}.
            minimo: true
          - punto: >-
              Se reconoce el problema de autovalores ([σ] − λ[I]){n} = {0}
              (ec. 2.33), el mismo de las direcciones principales (ec. 2.30),
              y se ve que λ = σn: premultiplicando por {n}ᵗ, λ = {n}ᵗ[σ]{n}.
            porque: >-
              Es la demostración: las direcciones de σn estacionaria son las
              principales, y en ellas σn vale la tensión principal.
            minimo: true
          - punto: >-
              Se concluye cuál es el máximo y cuál el mínimo: σ1 y σ3. Por
              ejemplo, en ejes principales σn = σ1n1² + σ2n2² + σ3n3², que
              está entre σ3 y σ1 porque n1² + n2² + n3² = 1.
            porque: >-
              Estacionario no es máximo: hay tres direcciones estacionarias, y
              hay que decir cuál da el máximo y cuál el mínimo.
      - tipo: calcular
        titulo: La tensión normal máxima de un punto
        pregunta: |
          Un ejemplo nuestro, en MPa: $\sigma_x = 40$, $\sigma_y = -30$,
          $\tau_{xy} = 12$, $\sigma_z = 10$ y $\tau_{xz} = \tau_{yz} = 0$. De
          todos los planos que pasan por el punto, ¿cuál es la mayor tensión
          normal, en MPa?
        respuesta:
          tipo: numero
          valor: '42'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '40'
            mensaje: |
              Es la mayor de las tres normales de los ejes dados. Las caras
              $x$, $y$ tienen tangenciales, así que no son principales, y
              girando en el plano $xy$ se encuentra una normal mayor.
          - valor: '37'
            mensaje: |
              Es el radio del círculo de Mohr del plano $xy$,
              $\sqrt{35^{2} + 12^{2}}$. La máxima es el centro más el radio,
              $5 + 37$.
        pista: |
          $z$ ya es principal ($\tau_{xz} = \tau_{yz} = 0$), con
          $\sigma_z = 10$. Las otras dos salen del plano $xy$: centro
          $(\sigma_x + \sigma_y)/2$ y radio
          $\sqrt{((\sigma_x - \sigma_y)/2)^{2} + \tau_{xy}^{2}}$.
        desarrollo: |
          En MPa: centro $(40 - 30)/2 = 5$ y radio $\sqrt{35^{2} + 12^{2}} = 37$:
          las principales son $5 + 37 = 42$, $\sigma_z = 10$ y $5 - 37 = -32$.
          La normal máxima es $\sigma_1 = 42$ MPa.
      - tipo: calcular
        titulo: Hacia dónde apunta
        pregunta: |
          ¿Qué ángulo forma con $x$ la dirección de esa tensión normal
          máxima, en grados, positivo de $x$ hacia $y$?
        respuesta:
          tipo: numero
          valor: '9.46'
          tolerancia: 0.02
          formato: un número, en grados
        distractores:
          - valor: '18.92'
            mensaje: |
              Es $2\theta$, el ángulo en el círculo de Mohr. En el plano físico
              el ángulo es la mitad.
          - valor: '-80.54'
            mensaje: |
              Es la otra raíz de $\operatorname{tg}2\theta = 24/70$: la
              dirección de la mínima del plano, perpendicular a la buena.
              Para saber cuál es cuál, mete el ángulo en $\sigma_n$.
        pista: |
          $\operatorname{tg}2\theta = \dfrac{2\tau_{xy}}{\sigma_x - \sigma_y}$, y
          de las dos raíces, la que da $\sigma_n = 42$.
        desarrollo: |
          $\operatorname{tg}2\theta = 24/70$, $2\theta = 18{,}92^{\circ}$ y
          $\theta = 9{,}46^{\circ}$. Comprobación: con
          $\{n\} = (\cos9{,}46^{\circ},\ \sin9{,}46^{\circ},\ 0)$,
          $\sigma_n = 40\cos^{2}\theta - 30\sin^{2}\theta + 24\sin\theta\cos\theta = 42$ MPa.
      - tipo: justificar
        pregunta: Ordena la demostración. Una pieza es falsa.
        piezas:
          - texto: >-
              Se busca el extremo de $\sigma_n = \{n\}^{t}[\sigma]\{n\}$ con
              $\{n\}^{t}\{n\} = 1$.
          - texto: >-
              Lagrangiana: $F = \{n\}^{t}[\sigma]\{n\} - \lambda\left(\{n\}^{t}\{n\} - 1\right)$.
          - texto: >-
              $\partial F/\partial\{n\} = 2[\sigma]\{n\} - 2\lambda\{n\} = \{0\}$,
              con $[\sigma]$ simétrico.
          - texto: >-
              Es el problema de autovalores de las direcciones principales, con
              $\lambda = \sigma_n$: los extremos de $\sigma_n$ son $\sigma_1$ y
              $\sigma_3$.
          - texto: >-
              En la dirección de tensión normal máxima la tangencial también
              es máxima.
            trampa: true
            mensaje: |
              Es al revés: en una dirección principal el vector tensión es
              normal al plano y la tangencial es **nula**
              ($\{S\} = \sigma_n\{n\}$, ec. 2.29). La tangencial máxima está en
              los planos a 45° de las principales.
    resolucion: |
      **El problema** (apuntes del tema 2, apartado 2.4.3). La tensión normal
      en el plano de normal $\{n\}$ es $\sigma_n = \{n\}^{t}[\sigma]\{n\}$
      (ec. 2.16), y $\{n\}$ es unitario: se buscan los extremos de
      $\sigma_n$ con la condición $\{n\}^{t}\{n\} = 1$. Es un problema de
      extremos condicionados; la función lagrangiana es (ec. 2.31)

      $$
      F(\{n\},\lambda) = \{n\}^{t}[\sigma]\{n\} - \lambda\left(\{n\}^{t}\{n\} - 1\right)
      $$

      **Los extremos** (ec. 2.32). Derivando respecto de $\{n\}$, y como
      $[\sigma]$ es simétrico:

      $$
      \frac{\partial F}{\partial\{n\}} = 2[\sigma]\{n\} - 2\lambda\{n\} = \{0\}
      \quad\Longrightarrow\quad
      \left([\sigma] - \lambda[I]\right)\{n\} = \{0\} \qquad (2.33)
      $$

      Premultiplicando $[\sigma]\{n\} = \lambda\{n\}$ por $\{n\}^{t}$ sale
      $\lambda = \{n\}^{t}[\sigma]\{n\} = \sigma_n$.

      **La conclusión.** Es el mismo problema de autovalores que define las
      direcciones principales (ec. 2.30, la de los planos sin tangencial,
      $\{S\} = \sigma_n\{n\}$). Las direcciones en que $\sigma_n$ es
      estacionaria son las principales, y en ellas $\sigma_n$ vale la tensión
      principal. De las tres, la máxima es $\sigma_1$ y la mínima $\sigma_3$:
      en ejes principales,

      $$
      \sigma_n = \sigma_1 n_1^{2} + \sigma_2 n_2^{2} + \sigma_3 n_3^{2},\qquad n_1^{2} + n_2^{2} + n_3^{2} = 1
      $$

      es una media ponderada de las tres, así que
      $\sigma_3 \le \sigma_n \le \sigma_1$, con los extremos en las
      direcciones 3 y 1. (La $\sigma_2$ es un punto de silla.)

      **Un ejemplo nuestro.** Con $\sigma_x = 40$, $\sigma_y = -30$,
      $\tau_{xy} = 12$ y $\sigma_z = 10$ MPa, $z$ es principal y las otras
      dos salen del plano $xy$: $5 \pm 37$, es decir, 42 y −32 MPa. La
      dirección de $\sigma_1$ forma $\theta = \tfrac12\operatorname{arctg}(24/70) = 9{,}46^{\circ}$
      con $x$.

      **Comprobaciones.** El motor del curso (`principalesTension`) da las
      tres principales, 42, 10 y −32 MPa. El segundo camino no usa
      autovalores: recorre la esfera de normales unitarias por fuerza bruta
      y refina el máximo de $\sigma_n$ con un ascenso por el gradiente
      proyectado; el máximo sale 42 MPa a 9,46° de $x$, y el mínimo, −32 MPa,
      que es lo que dice la demostración.

  # ── Teoría · pregunta 4 · el depósito de pared delgada.
  - id: exerm1314-1par-4-el-deposito-de-pequeno-espesor
    titulo: Las tensiones principales en la pared de un depósito de revolución
    fuente: >-
      Pregunta 4 de teoría · Primer parcial de 2013-2014 (hoja de teoría del 8
      de noviembre de 2013) · Elasticidad y Resistencia de Materiales, Escuela
      Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 1 punto. Es
      la misma pregunta, con otras palabras, que la cuestión 4 de teoría del
      primer parcial de 2017-2018, que está resuelta en el sitio; aquí se
      resuelve de nuevo, con otros ejemplos. El examen no publica resolución;
      el desarrollo es nuestro y sigue los apuntes del tema 8, apartado 8.5.1
      (págs. 8 a 10, figs. 8.4 y 8.5, ecs. 8.13 a 8.17).
    nivel: examen
    enunciado: |
      (1p) Deducir la relación entre las tensiones principales y la presión
      interna $p$ en un depósito de revolución de pequeño espesor.
    pide: >-
      La ecuación p/t = σ1/r1 + σ2/r2, deducida del equilibrio de un elemento
      de pared, y lo que da en la esfera y en el cilindro.
    pasos:
      - tipo: reconocer
        pregunta: |
          La pared tiene tres tensiones principales. ¿Por qué se desprecia la
          que va según el espesor?
        opciones:
          - texto: >-
              Porque va de $-p$ en la cara de dentro a 0 en la de fuera, y $p$
              es pequeña frente a las otras dos, que son del orden de $pr/t$
              con $r/t$ grande
            correcta: true
            mensaje: |
              Eso es (apuntes, p. 10). En los ejemplos de abajo, la esfera,
              con $r/t = 150$, lleva $75p$ en la pared, y el cilindro, con
              $r/t = 125$, $125p$ según el paralelo: la tercera no pasa de
              $p$.
          - texto: >-
              Porque la pared es tan delgada que no puede tener tensión según
              su espesor
            mensaje: |
              Sí la tiene: la cara de dentro soporta la presión, y allí vale
              $-p$. No es nula; es pequeña comparada con las otras dos.
          - texto: >-
              Porque la presión de fuera compensa la de dentro
            mensaje: |
              $p$ es la presión manométrica, la diferencia entre dentro y
              fuera. Si fuera la compensara, la pared no tendría ninguna
              tensión.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción completa, como en el examen: el elemento, las
          fuerzas, el equilibrio, el resultado y los dos casos.
        rubrica:
          - punto: >-
              Se dice por qué meridiano y paralelo son direcciones principales
              (la simetría de revolución del depósito y de la carga) y por qué
              se desprecia la tercera.
            porque: >-
              Es lo que deja dos incógnitas, σ1 y σ2, sin tangenciales en las
              caras del elemento.
            minimo: true
          - punto: >-
              Se dibuja el elemento de lados ds1 y ds2 y espesor t, con sus dos
              cortes (fig. 8.5): σ1 actúa en las caras de lado ds2 y σ2 en las
              de lado ds1.
            porque: >-
              El cruce de lados es lo que más se confunde, y cambia la
              ecuación.
            minimo: true
          - punto: >-
              Equilibrio según la normal: p ds1 ds2 = 2σ1 t ds2 sen(dθ1/2) +
              2σ2 t ds1 sen(dθ2/2) (ec. 8.13).
            porque: >-
              La curvatura es lo que da a las tensiones de la pared una
              componente que equilibra la presión.
            minimo: true
          - punto: >-
              Con ángulos pequeños y dsi = ri dθi, se divide por ds1 ds2 t:
              p/t = σ1/r1 + σ2/r2 (ec. 8.14).
            porque: >-
              Es la relación que pide el enunciado.
            minimo: true
          - punto: >-
              Los casos: esfera, σ = pr/2t (ec. 8.15); cilindro, σ1 = pr/t
              (ec. 8.16), y σ2 = pr/2t del equilibrio de un corte
              perpendicular al eje (ec. 8.17).
            porque: >-
              Muestra qué da la ecuación y qué no: en el cilindro deja σ2 sin
              determinar.
      - tipo: calcular
        titulo: La tensión en la pared de una esfera
        pregunta: |
          Un ejemplo nuestro: un depósito esférico de radio medio 1,5 m y
          pared de 10 mm, a $p$ = 0,8 MPa. ¿Cuánto vale la tensión en la
          pared, en MPa?
        respuesta:
          tipo: numero
          valor: '60'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '120'
            mensaje: |
              Es $pr/t$, la circunferencial de un cilindro (o la de la esfera
              con el diámetro en lugar del radio). En la esfera las dos
              curvaturas trabajan: $r_1 = r_2 = r$ y la ec. 8.14 da
              $\sigma = pr/2t$.
          - valor: '0.06'
            mensaje: |
              Has mezclado unidades: el radio en metros y el espesor en
              milímetros. Con los dos en milímetros, $r/t = 150$.
        pista: |
          Con $r_1 = r_2 = r$ y, por simetría, $\sigma_1 = \sigma_2$, la
          ec. 8.14 da $\sigma = pr/2t$.
        desarrollo: |
          Con $r$ y $t$ en mm y $p$ en MPa:
          $\sigma = \dfrac{pr}{2t} = \dfrac{0{,}8\cdot1500}{2\cdot10} = 60$ MPa,
          igual en todas las direcciones de la pared.
      - tipo: calcular
        titulo: El espesor de un cilindro
        pregunta: |
          Un cilindro del mismo radio medio, 1,5 m, y a la misma presión,
          0,8 MPa, con $\sigma_{adm}$ = 100 MPa. ¿Qué espesor mínimo necesita
          su pared, en mm?
        respuesta:
          tipo: numero
          valor: '12'
          tolerancia: 0.05
          formato: un número, en mm
        distractores:
          - valor: '6'
            mensaje: |
              Es el espesor que pide la tensión longitudinal, $pr/2t$. La que
              manda es la circunferencial, $pr/t$, que es el doble.
          - valor: '24'
            mensaje: |
              Has usado el diámetro. La ec. 8.14 va con los radios de
              curvatura: el del paralelo es $r$ = 1500 mm.
        pista: |
          La mayor de las dos es la circunferencial, $\sigma_1 = pr/t$
          (ec. 8.16).
        desarrollo: |
          $t = \dfrac{pr}{\sigma_{adm}} = \dfrac{0{,}8\cdot1500}{100} = 12$ mm.
          La longitudinal queda en 50 MPa. La esfera del paso anterior, con
          la misma presión y el mismo radio, aguantaría 100 MPa con 6 mm:
          la mitad de chapa.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Meridiano y paralelo son principales por la simetría; la
              tensión según el espesor, entre $-p$ y 0, se desprecia.
          - texto: >-
              Equilibrio según la normal del elemento:
              $p\,ds_1ds_2 = 2\sigma_1t\,ds_2\sin\tfrac{d\theta_1}{2} + 2\sigma_2t\,ds_1\sin\tfrac{d\theta_2}{2}$.
          - texto: >-
              Con $\sin\tfrac{d\theta_i}{2} \approx \tfrac{d\theta_i}{2}$ y
              $ds_i = r_i\,d\theta_i$:
              $\dfrac{p}{t} = \dfrac{\sigma_1}{r_1} + \dfrac{\sigma_2}{r_2}$.
          - texto: >-
              Esfera: $\sigma = pr/2t$. Cilindro: $\sigma_1 = pr/t$, y
              $\sigma_2 = pr/2t$ del corte perpendicular al eje.
          - texto: >-
              $\sigma_1$ actúa en las caras de lado $ds_1$, y su fuerza es
              $\sigma_1t\,ds_1$.
            trampa: true
            mensaje: |
              Es el cruce que hay que vigilar: $\sigma_1$ va según $ds_1$ y
              actúa en las caras **perpendiculares** a esa dirección, que son
              las de lado $ds_2$. Su fuerza es $\sigma_1t\,ds_2$ (los apuntes
              lo subrayan después de la ec. 8.13).
    resolucion: |
      **La idea** (apuntes del tema 8, apartado 8.5.1, figuras 8.4 y 8.5).
      El depósito y la presión tienen simetría de revolución: en un elemento
      de pared cortado por dos meridianos y dos paralelos no hay
      tangenciales, así que esas dos direcciones son principales. La tercera
      tensión principal, según el espesor, va de $-p$ dentro a 0 fuera; es
      mucho menor que las otras dos, del orden de $pr/t$, y se toma nula.

      **El elemento.** Lados $ds_1$ (según el paralelo) y $ds_2$ (según el
      meridiano), espesor $t$, radios de curvatura $r_1$ y $r_2$ y ángulos
      $d\theta_1$ y $d\theta_2$, con $ds_i = r_i\,d\theta_i$. La tensión
      $\sigma_1$ va según $ds_1$ y actúa en las caras de lado $ds_2$: su
      fuerza es $\sigma_1t\,ds_2$. La $\sigma_2$, al revés: $\sigma_2t\,ds_1$.

      **El equilibrio** según la normal a la pared (ec. 8.13). Las dos
      fuerzas de cada par de caras opuestas forman el ángulo $d\theta_i$, y
      su resultante, hacia dentro, equilibra la presión:

      $$
      p\,ds_1\,ds_2 = 2\sigma_1\,t\,ds_2\sin\frac{d\theta_1}{2} + 2\sigma_2\,t\,ds_1\sin\frac{d\theta_2}{2}
      $$

      **La relación** (ec. 8.14). Con $\sin(d\theta_i/2) \approx d\theta_i/2$
      y $d\theta_i = ds_i/r_i$, dividiendo por $ds_1\,ds_2\,t$:

      $$
      \frac{p}{t} = \frac{\sigma_1}{r_1} + \frac{\sigma_2}{r_2}
      $$

      **Los dos casos.**

      - Esfera: $r_1 = r_2 = r$ y, por simetría, $\sigma_1 = \sigma_2$:
        $\sigma = pr/2t$ (ec. 8.15).
      - Cilindro: $r_1 = r$ y $r_2 = \infty$ (el meridiano es recto):
        $\sigma_1 = pr/t$ (ec. 8.16). La ecuación no fija $\sigma_2$, que va
        dividida por $\infty$; se corta por un plano perpendicular al eje, y
        $p\pi r^{2} = 2\pi rt\,\sigma_2$ da $\sigma_2 = pr/2t$ (ec. 8.17).

      **Dos ejemplos nuestros.** Una esfera de radio medio 1,5 m y pared de
      10 mm a 0,8 MPa tiene 60 MPa en todas las direcciones de la pared. Un
      cilindro del mismo radio y a la misma presión, con $\sigma_{adm}$ =
      100 MPa, necesita 12 mm: lo manda la circunferencial, y la
      longitudinal se queda en 50 MPa.

      **Comprobaciones.** El motor del curso (`depositoEsferico` y
      `depositoCilindrico`) da las mismas tensiones; el segundo camino, el
      equilibrio de media esfera ($p\pi r^{2} = \sigma\cdot2\pi rt$) y de
      medio cilindro ($p\cdot2rL = 2\sigma tL$), coincide.

  # ── Ejercicio 1 · la unión adhesiva en el plano ABCD.
  - id: exerm1314-1par-5-la-union-adhesiva-en-el-plano-abcd
    titulo: Dos piezas pegadas por un plano diagonal del cubo, y las tensiones que soporta el adhesivo
    fuente: >-
      Ejercicio 1 · Primer parcial de 2013-2014 (hoja de ejercicios del 8 de
      noviembre de 2013) · Elasticidad y Resistencia de Materiales, Escuela
      Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 1,5 puntos.
      Es, palabra por palabra y con la misma figura, el ejercicio 2.5 de los
      enunciados de clase del tema 2, que no trae resolución. El examen
      tampoco la publica; el desarrollo es nuestro y sigue los apuntes del
      tema 2 (ecs. 2.14 a 2.16).
    nivel: examen
    enunciado: |
      (1,5p) Dos piezas del mismo material se unen mediante un adhesivo en el
      plano ABCD. El estado de tensiones es uniforme y sus componentes son:

      $$
      [\sigma] = \begin{bmatrix} \sigma & -\sigma & \tfrac12\sigma \\ -\sigma & 2\sigma & 3\sigma \\ \tfrac12\sigma & 3\sigma & \sigma \end{bmatrix}
      $$

      Determinar las tensiones normal y cortante que soporta el adhesivo.

