      <figcaption>

      Redibujada del PDF del examen, con sus proporciones. Los ejes salen de
      las aristas que nacen en el vértice oculto de atrás, abajo, a la
      izquierda, que es el origen.

      </figcaption>
      </figure>
    notas:
      - >-
        *Nota: La calculadora sólo se puede utilizar en el tercer ejercicio*
    pide: >-
      La tensión normal y la tangencial en el plano ABCD, en función de σ.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es el vector normal unitario del plano ABCD, en los ejes de la
          figura?
        opciones:
          - texto: >-
              $\{n\} = \tfrac{1}{\sqrt2}\,(1,\ 1,\ 0)$: AB y CD son paralelas a
              $z$, así que el plano contiene esa dirección, y corta los ejes
              $x$ e $y$ a la misma distancia del origen, un lado del cubo
            correcta: true
            mensaje: |
              Eso es. Con el origen en el vértice oculto y lado 1,
              A = (0, 1, 1), B = (0, 1, 0), C = (1, 0, 1) y D = (1, 0, 0): los
              cuatro cumplen $x + y = 1$. El 45° de la figura dice lo mismo: la
              traza del plano en la cara de delante forma 45° con $x$.
          - texto: >-
              $\{n\} = \tfrac{1}{\sqrt3}\,(1,\ 1,\ 1)$, porque el plano corta el
              cubo en diagonal
            mensaje: |
              Esa es la normal del plano octaédrico, el que corta los tres
              ejes a la misma distancia. ABCD es paralelo a $z$: B y A solo se
              diferencian en $z$, igual que D y C, así que la normal no tiene
              componente $z$.
          - texto: >-
              $\{n\} = \tfrac{1}{\sqrt2}\,(1,\ -1,\ 0)$, la dirección de la
              diagonal CA
            mensaje: |
              CA está **en** el plano: es una dirección tangente, no la normal.
              La normal es perpendicular a CA y a $z$ a la vez:
              $(1,\ 1,\ 0)/\sqrt2$.
      - tipo: calcular
        titulo: La tensión normal en el adhesivo
        pregunta: |
          ¿Cuánto vale $\sigma_n$ en el plano ABCD, en unidades de $\sigma$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.005
          formato: un número (σn dividida por σ)
        distractores:
          - valor: '1'
            mensaje: |
              Has usado la normal sin normalizar, $(1,\ 1,\ 0)$, de módulo
              $\sqrt2$: la proyección sale multiplicada por $|n|^{2} = 2$. La
              ec. 2.16 pide el vector unitario.
          - valor: '3'
            mensaje: |
              Es la tensión normal en el plano octaédrico, con
              $(1,\ 1,\ 1)/\sqrt3$. El plano ABCD es paralelo a $z$ y su
              normal no tiene componente $z$.
          - valor: '2.5'
            mensaje: |
              Es la normal en el plano perpendicular a la diagonal CA, la que
              tiene la dirección $(1,\ -1,\ 0)/\sqrt2$. Esa dirección está en
              el plano ABCD; su normal es $(1,\ 1,\ 0)/\sqrt2$.
        pista: |
          Primero el vector tensión, $\{S\} = [\sigma]\{n\}$ (ec. 2.14), y
          después su proyección sobre la normal,
          $\sigma_n = \{n\}^{t}\{S\}$ (ec. 2.16).
        desarrollo: |
          $$
          \{S\} = [\sigma]\,\frac{1}{\sqrt2}\begin{Bmatrix}1\\1\\0\end{Bmatrix} = \frac{\sigma}{\sqrt2}\begin{Bmatrix}0\\1\\3{,}5\end{Bmatrix},\qquad
          \sigma_n = \frac{1}{\sqrt2}\cdot\frac{\sigma}{\sqrt2}\,(0 + 1 + 0) = \frac{\sigma}{2}
          $$
      - tipo: calcular
        titulo: La tensión cortante en el adhesivo
        pregunta: |
          ¿Cuánto vale la tensión tangencial $\tau_n$ en el plano ABCD, en
          unidades de $\sigma$?
        respuesta:
          tipo: numero
          valor: '2.525'
          tolerancia: 0.003
          formato: un número (τn dividida por σ)
        distractores:
          - valor: '2.074'
            mensaje: |
              Has restado los módulos, $|S| - \sigma_n$. La normal y la
              tangencial son perpendiculares: se componen como los catetos de
              un triángulo rectángulo, $\tau_n^{2} = |S|^{2} - \sigma_n^{2}$.
          - valor: '1.837'
            mensaje: |
              Es la tangencial en el plano perpendicular a CA, el de normal
              $(1,\ -1,\ 0)/\sqrt2$. La normal de ABCD es $(1,\ 1,\ 0)/\sqrt2$.
          - valor: '3.5'
            mensaje: |
              Has usado la normal sin normalizar, $(1,\ 1,\ 0)$: el vector
              tensión sale $\sqrt2$ veces mayor, con $|S|^{2} = 13{,}25\,\sigma^{2}$,
              y la normal que le restas, el doble de la buena, $\sigma$:
              $\sqrt{13{,}25 - 1} = 3{,}5$.
        pista: |
          $\tau_n^{2} = |S|^{2} - \sigma_n^{2}$ (ec. 2.16), con el $\{S\}$ del
          paso anterior.
        desarrollo: |
          $$
          |S|^{2} = \frac{\sigma^{2}}{2}\left(1 + 3{,}5^{2}\right) = 6{,}625\,\sigma^{2},\qquad
          \tau_n = \sqrt{6{,}625 - 0{,}25}\;\sigma = \frac{\sqrt{102}}{4}\,\sigma = 2{,}525\,\sigma
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con el origen en el vértice oculto, A, B, C y D cumplen
              $x + y = 1$: $\{n\} = (1,\ 1,\ 0)/\sqrt2$.
          - texto: >-
              Vector tensión: $\{S\} = [\sigma]\{n\} = \tfrac{\sigma}{\sqrt2}\,(0,\ 1,\ 3{,}5)$.
          - texto: >-
              Normal: $\sigma_n = \{n\}^{t}\{S\} = \sigma/2$.
          - texto: >-
              Tangencial: $\tau_n = \sqrt{|S|^{2} - \sigma_n^{2}} = \tfrac{\sqrt{102}}{4}\,\sigma \approx 2{,}52\,\sigma$.
          - texto: >-
              Tangencial: $\tau_n = |S| - \sigma_n$, lo que le queda al vector
              tensión después de quitarle la normal.
            trampa: true
            mensaje: |
              Lo que se resta son los cuadrados: la normal y la tangencial son
              perpendiculares, y $|S|^{2} = \sigma_n^{2} + \tau_n^{2}$. Restando
              módulos sale $2{,}074\,\sigma$ en lugar de $2{,}525\,\sigma$.
    resolucion: |
      **El plano.** Los ejes de la figura salen del vértice oculto de atrás,
      abajo, a la izquierda. Con ese origen y el lado del cubo como unidad:

      $$
      A = (0,\ 1,\ 1),\quad B = (0,\ 1,\ 0),\quad C = (1,\ 0,\ 1),\quad D = (1,\ 0,\ 0)
      $$

      Los cuatro cumplen $x + y = 1$: el plano contiene la dirección $z$ (AB
      y DC son paralelas a ella) y forma 45° con $x$ y con $y$, que es lo que
      marca el 45° de la cara de delante. Su normal unitaria es

      $$
      \{n\} = \frac{1}{\sqrt2}\begin{Bmatrix}1\\1\\0\end{Bmatrix}
      $$

      (o la opuesta: los dos sentidos dan la misma $\sigma_n$ y la misma
      $\tau_n$).

      **El vector tensión** (ec. 2.14), fila por columna:

      $$
      \{S\} = [\sigma]\{n\} = \frac{\sigma}{\sqrt2}\begin{Bmatrix}1 - 1 + 0\\ -1 + 2 + 0\\ \tfrac12 + 3 + 0\end{Bmatrix} = \frac{\sigma}{\sqrt2}\begin{Bmatrix}0\\1\\3{,}5\end{Bmatrix}
      $$

      **Las componentes intrínsecas** (ec. 2.16):

      $$
      \sigma_n = \{n\}^{t}\{S\} = \frac{\sigma}{2}\,(0 + 1 + 0) = \frac{\sigma}{2},\qquad
      |S|^{2} = \frac{\sigma^{2}}{2}\left(1 + 12{,}25\right) = \frac{53}{8}\,\sigma^{2}
      $$

      $$
      \tau_n = \sqrt{|S|^{2} - \sigma_n^{2}} = \sqrt{\frac{53}{8} - \frac{1}{4}}\;\sigma = \sqrt{\frac{51}{8}}\;\sigma = \frac{\sqrt{102}}{4}\,\sigma \approx 2{,}52\,\sigma
      $$

      El adhesivo trabaja a **tracción** $\sigma/2$ (si $\sigma > 0$) y,
      sobre todo, a **cortadura**: la tangencial es cinco veces la normal.
      Sin calculadora, como pide la nota, el resultado se deja así:
      $\sigma_n = \sigma/2$ y $\tau_n = \sqrt{102}\,\sigma/4$.

      **Hacia dónde va la tangencial.** Sus componentes en el plano: según
      $z$, $\{S\}\cdot\hat{k} = 3{,}5\,\sigma/\sqrt2 = 2{,}475\,\sigma$; según
      la recta CA, con $\hat{t} = (1,\ -1,\ 0)/\sqrt2$,
      $\{S\}\cdot\hat{t} = -\sigma/2$. La tangencial va casi según $z$, y
      $\sqrt{2{,}475^{2} + 0{,}5^{2}} = 2{,}525$ comprueba su módulo.

      **Comprobaciones.** El motor del curso (`componentesIntrinsecas`, con
      la normal sacada del producto vectorial AB × AC y D comprobado en el
      mismo plano) da los mismos $\{S\}$, $\sigma_n$ y $\tau_n$; el segundo
      camino, la tangencial compuesta con sus dos componentes en el plano,
      coincide.

  # ── Ejercicio 2 · la barra DB calentada y B sobre un apoyo móvil.
  - id: exerm1314-1par-6-la-barra-calentada-y-el-apoyo-movil
    titulo: Tres barras que llegan a B, y una de ellas se calienta
    fuente: >-
      Ejercicio 2 · Primer parcial de 2013-2014 (hoja de ejercicios del 8 de
      noviembre de 2013) · Elasticidad y Resistencia de Materiales, Escuela
      Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 1,5 puntos.
      El examen no publica resolución; el desarrollo es nuestro y sigue los
      apuntes del tema 8 (apartado 8.4, ecs. 8.9 a 8.12), con su convenio
      (N > 0 tracción).
    nivel: examen
    enunciado: |
      (1,5p) En la estructura articulada de la figura las barras DB(1), AB(2)
      y BC(3) son del mismo material y sección. La longitud de las barras (2)
      y (3) es $b$. Determinar las fuerzas en las barras y el desplazamiento
      de B cuando la barra (1) sufre un cambio de temperatura $\Delta T$.
      Datos: $E$, $A$, $\alpha$, $b$, $\Delta T$.

      <figure class="figura-examen">
      <svg viewBox="0 0 450 310" role="img" width="450" height="310" aria-labelledby="exerm1314-1par-6-la-barra-calentada-y-el-apoyo-movil-fig-t exerm1314-1par-6-la-barra-calentada-y-el-apoyo-movil-fig-d">
      <title id="exerm1314-1par-6-la-barra-calentada-y-el-apoyo-movil-fig-t">La estructura de tres barras: DB a 45°, AB y BC horizontales, con B sobre un apoyo móvil</title>
      <desc id="exerm1314-1par-6-la-barra-calentada-y-el-apoyo-movil-fig-d">A la izquierda, una pared vertical rayada con dos articulaciones: D arriba y A abajo. De A sale hacia la derecha la barra AB, horizontal, y de B sigue la barra BC, horizontal, hasta C. De D baja la barra DB hasta B, formando 45º con BA; el ángulo lleva su arco en B. B está sobre un apoyo móvil: un triángulo sobre dos rodillos que ruedan en un suelo horizontal rayado. C está sobre un apoyo fijo: un triángulo sobre el suelo rayado. Las articulaciones son puntos negros.</desc>
