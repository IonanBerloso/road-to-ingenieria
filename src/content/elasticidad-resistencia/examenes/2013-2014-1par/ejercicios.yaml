      <figcaption>

      Redibujada del PDF del examen. Las cotas de la viga y las de la
      sección guardan sus proporciones; el espesor de la L no: se ve más
      grueso de lo que es. G está dibujado a ojo, como en el original.

      </figcaption>
      </figure>

      **Notas nuestras.** El texto dice «en los tramos BC y DE», pero la
      figura solo tiene los puntos A, B y C y una carga que va de A a C: es
      una errata, y manda la figura. Las cotas 10$t$ y 15$t$ son el ancho y
      el alto totales de la L, hasta las caras exteriores, como marcan sus
      líneas de referencia.
    notas:
      - >-
        *Nota: La calculadora sólo se puede utilizar en el tercer ejercicio*
    pide: >-
      a) Los diagramas de cortantes y flectores, con sus valores en A, B y C y
      el máximo del flector. b) La posición de G, Iz, Iy e Iyz en función de
      t, el eje neutro, el punto de tensión máxima y el espesor t (en cm).
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular nada: ¿dónde está el flector máximo de esta viga?
        opciones:
          - texto: >-
              Donde se anula el cortante, que es en el tramo BC, algo a la
              derecha de B
            correcta: true
            mensaje: |
              Eso es. Como $dM/dx = T$, el máximo de $M$ está donde $T$ cambia
              de signo. En B el cortante todavía es positivo: la reacción de A
              es mayor que la carga del tramo AB. Se anula un poco más allá.
          - texto: En B, bajo el pico de la carga
            mensaje: |
              Lo estaría con una carga puntual en B, que hace saltar el
              cortante. Con la carga repartida el cortante es continuo, y en
              B vale todavía $q_0a/3 > 0$: el flector sigue creciendo a la
              derecha de B.
          - texto: En el centro de la viga, a $1{,}5a$ de A
            mensaje: |
              Es el sitio del máximo con una carga simétrica. Esta no lo es:
              su resultante, $3q_0a/2$, está a $4a/3$ de A, a la izquierda del
              centro, y el máximo se va hacia ese lado.
      - tipo: calcular
        titulo: La reacción en A
        pregunta: |
          ¿Cuánto vale la reacción del apoyo A, en unidades de $q_0a$?
        respuesta:
          tipo: numero
          valor: '0.8333'
          tolerancia: 0.0005
          formato: un número (la reacción dividida por q0·a)
        distractores:
          - valor: '0.6111'
            mensaje: |
              Has puesto la resultante del triángulo de BC en su tercio más
              cercano a C, a $a + 4a/3$ de A. El centro de gravedad de un
              triángulo está a un tercio de la base desde el lado alto: el de
              BC, que es alto en B, a $a + 2a/3$.
          - valor: '0.75'
            mensaje: |
              Es la mitad de la carga total, como si las dos reacciones fueran
              iguales. La carga no es simétrica: su pico está a $a$ de A y a
              $2a$ de C, y A se lleva más.
        pista: |
          Dos triángulos: AB, de resultante $q_0a/2$ a $2a/3$ de A; BC, de
          resultante $q_0a$ a $a + 2a/3$ de A. Momentos respecto de C.
        desarrollo: |
          $$
          R_A\cdot3a = \frac{q_0a}{2}\left(3a - \frac{2a}{3}\right) + q_0a\left(3a - \frac{5a}{3}\right) = \frac{7}{6}\,q_0a^{2} + \frac{4}{3}\,q_0a^{2}
          \quad\Longrightarrow\quad R_A = \frac{5}{6}\,q_0a
          $$

          y $R_C = \tfrac32q_0a - \tfrac56q_0a = \tfrac23q_0a$.
      - tipo: calcular
        titulo: Dónde se anula el cortante
        pregunta: |
          ¿A qué distancia de A se anula el cortante, en unidades de $a$?
        respuesta:
          tipo: numero
          valor: '1.367'
          tolerancia: 0.002
          formato: un número (la distancia dividida por a)
        distractores:
          - valor: '1'
            mensaje: |
              En B el cortante vale $\tfrac56q_0a - \tfrac12q_0a = \tfrac13q_0a$,
              todavía positivo. No hay fuerza concentrada en B que lo haga
              saltar a negativo.
          - valor: '1.5'
            mensaje: |
              Es el centro de la viga. El cortante se anula donde la carga
              acumulada desde A iguala a $R_A$, y eso depende de cómo se
              reparte la carga, no de la luz.
          - valor: '1.633'
            mensaje: |
              Es la distancia desde C, $2a\sqrt{2/3}$, no desde A. Medida
              desde A: $3a - 1{,}633a$.
        pista: |
          Desde C es más corto: a una distancia $s$ de C la carga vale
          $q_0s/(2a)$, y el cortante es $-R_C$ más la carga entre C y ese
          punto.
        desarrollo: |
          Desde C: $T = -\tfrac23q_0a + \dfrac{q_0s^{2}}{4a} = 0$ da
          $s^{2} = \tfrac83a^{2}$ y $s = 2a\sqrt{2/3} = 1{,}633a$. Desde A:

          $$
          x_0 = 3a - 2a\sqrt{2/3} = 1{,}367\,a
          $$
      - tipo: calcular
        titulo: El flector máximo
        pregunta: |
          ¿Cuánto vale el flector máximo, en unidades de $q_0a^{2}$?
        respuesta:
          tipo: numero
          valor: '0.7258'
          tolerancia: 0.0005
          formato: un número (M dividido por q0·a²)
        distractores:
          - valor: '0.6667'
            mensaje: |
              Es el flector en B, $\tfrac23q_0a^{2}$. A la derecha de B el
              cortante es todavía positivo, así que el flector sigue
              creciendo hasta $x_0 = 1{,}367a$.
          - valor: '0.4507'
            mensaje: |
              Sale con la reacción del triángulo de BC mal puesto,
              $R_A = 0{,}611\,q_0a$. Con la reacción buena, $\tfrac56q_0a$, el
              máximo es otro y está en otro sitio.
        pista: |
          Desde C, con $s = 2a\sqrt{2/3}$: $M = R_C\,s - \dfrac{q_0s^{3}}{12a}$
          (el triángulo de carga entre C y el punto, de resultante
          $q_0s^{2}/(4a)$, a $s/3$).
        desarrollo: |
          $$
          M_{max} = \frac23q_0a\,s - \frac{q_0s^{3}}{12a} = \frac{8\sqrt6}{27}\,q_0a^{2} = 0{,}7258\,q_0a^{2}
          $$
      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de cortantes y de flectores**, alineados
          bajo la viga, con los valores en A, B y C, el punto en que se anula
          el cortante y el flector máximo.
        comprueba:
          - punto: |
              **Cortante**: $\tfrac56q_0a$ en A; una parábola que baja hasta
              $\tfrac13q_0a$ en B; otra que corta el cero en $x_0 = 1{,}367a$ y
              llega a $-\tfrac23q_0a$ en C.
            porque: |
              $dT/dx = -q$: la pendiente del cortante es menos la carga, nula
              en A y en C y máxima en B. Por eso la curva sale horizontal de A,
              tiene su mayor pendiente en B y llega horizontal a C. Los
              valores en A y en C son las reacciones.
          - punto: |
              **Flector**: cero en A y en C, $\tfrac23q_0a^{2}$ en B y el
              máximo, $0{,}726\,q_0a^{2}$, en $x_0$, donde el cortante se anula.
            porque: |
              $dM/dx = T$: el flector crece mientras el cortante es positivo y
              tiene su máximo donde cambia de signo. En los dos apoyos
              articulados es nulo.
          - punto: |
              **La forma**: el cortante, de segundo grado en cada tramo; el
              flector, de tercer grado, siempre positivo (tracciona abajo),
              sin saltos ni picos en B y con tangente horizontal en el máximo.
            porque: |
              Con carga lineal el cortante es parabólico y el flector cúbico.
              En B solo cambia la pendiente de la carga; no hay fuerza ni par
              concentrados, así que ni $T$ salta ni $M$ hace pico.
        figura: |
