    notas:
      - >-
        *Nota: La calculadora sólo se puede utilizar en el tercer ejercicio*
    pide: >-
      Las fuerzas N1, N2 y N3 en función de EAαΔT, y el desplazamiento de B
      en función de αΔT·b.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué desplazamiento puede tener el nudo B?
        opciones:
          - texto: >-
              Solo horizontal: el apoyo móvil rueda sobre un suelo horizontal
              y le impide el vertical
            correcta: true
            mensaje: |
              Eso es. Una sola incógnita cinemática, $u$, y una sola ecuación
              de equilibrio útil, la horizontal del nudo; la vertical la toma
              la reacción del apoyo. Es una estructura hiperestática: tres
              barras para una ecuación.
          - texto: >-
              Ninguno: tres barras articuladas a puntos fijos lo inmovilizan
            mensaje: |
              Las barras son deformables. Si B no se moviera, la barra 1 no
              podría alargarse y se llevaría toda la dilatación impedida,
              $N_1 = -EA\alpha\Delta T$; pero las barras 2 y 3 ceden, y B se
              mueve.
          - texto: >-
              Horizontal y vertical: es un nudo de barras y el apoyo solo
              sostiene peso
            mensaje: |
              El apoyo móvil impide el movimiento perpendicular al suelo, en
              los dos sentidos: da una reacción vertical, hacia arriba o hacia
              abajo, la que haga falta. Aquí, si la barra se calienta, empuja
              hacia arriba, porque la barra 1 comprimida empuja B hacia abajo.
      - tipo: calcular
        titulo: La fuerza en la barra calentada
        pregunta: |
          ¿Cuánto vale $N_1$, con su signo (tracción positiva), en unidades de
          $EA\alpha\Delta T$?
        respuesta:
          tipo: numero
          valor: '-0.8498'
          tolerancia: 0.0005
          formato: un número (N1 dividida por EAαΔT)
        distractores:
          - valor: '-1'
            mensaje: |
              Es la fuerza con B fijo: toda la dilatación de la barra 1
              impedida. Pero B se desplaza hacia la derecha, porque las barras
              2 y 3 ceden, y la barra 1 se alarga algo.
          - valor: '-0.7388'
            mensaje: |
              Sale de dos errores distintos que dan lo mismo: proyectar al
              revés, $\Delta L_1 = \sqrt2\,u$ en lugar de $u/\sqrt2$, o
              olvidar la barra 3, que también frena a B (se acorta lo que
              alarga la 2).
          - valor: '-0.8'
            mensaje: |
              Has tomado la barra 1 de longitud $b$. Va de D a B en diagonal:
              $L_1 = b\sqrt2$, y su dilatación libre es $\alpha\Delta T\,b\sqrt2$.
        pista: |
          Una incógnita, el desplazamiento $u$ de B. Compatibilidad: cada
          alargamiento es la proyección de $u$ sobre su barra (ec. 8.12).
          Comportamiento: $\Delta L = NL/EA + \alpha\Delta T\,L$. Y el
          equilibrio horizontal de B.
        desarrollo: |
          $\Delta L_1 = u/\sqrt2$, $\Delta L_2 = u$ y $\Delta L_3 = -u$. Con
          $L_1 = b\sqrt2$:
          $N_1 = EA\left(\dfrac{u}{2b} - \alpha\Delta T\right)$ y
          $N_2 = -N_3 = EA\,u/b$. El equilibrio horizontal de B,
          $-N_1/\sqrt2 - N_2 + N_3 = 0$, da

          $$
          u = \frac{2\,\alpha\Delta T\,b}{4\sqrt2 + 1},\qquad
          N_1 = -\frac{4\sqrt2}{4\sqrt2 + 1}\,EA\alpha\Delta T = -0{,}8498\,EA\alpha\Delta T
          $$
      - tipo: calcular
        titulo: La fuerza en la barra AB
        pregunta: |
          ¿Cuánto vale $N_2$, con su signo, en unidades de $EA\alpha\Delta T$?
        respuesta:
          tipo: numero
          valor: '0.3004'
          tolerancia: 0.0005
          formato: un número (N2 dividida por EAαΔT)
        distractores:
          - valor: '0.5224'
            mensaje: |
              Es lo que sale sin la barra 3. B se mueve hacia C y la barra 3 se
              acorta lo mismo que se alarga la 2: las dos frenan a B a partes
              iguales, y cada una se lleva menos.
          - valor: '-0.3004'
            mensaje: |
              El valor es ese y el signo no. B se aleja de A: la barra 2 se
              alarga y está a tracción. La que está a compresión es la 3, con
              $N_3 = -N_2$.
          - valor: '0.2612'
            mensaje: |
              Has proyectado al revés el desplazamiento sobre la barra 1,
              $\Delta L_1 = \sqrt2\,u$. La proyección de un desplazamiento
              horizontal $u$ sobre una barra a 45° es $u\cos45^{\circ} = u/\sqrt2$.
        pista: |
          $N_2 = EA\,\Delta L_2/b$ con $\Delta L_2 = u$.
        desarrollo: |
          $$
          N_2 = \frac{EA\,u}{b} = \frac{2}{4\sqrt2 + 1}\,EA\alpha\Delta T = \frac{8\sqrt2 - 2}{31}\,EA\alpha\Delta T = 0{,}3004\,EA\alpha\Delta T
          $$

          a tracción, y $N_3 = -0{,}3004\,EA\alpha\Delta T$, a compresión.
      - tipo: calcular
        titulo: El desplazamiento de B
        pregunta: |
          ¿Cuánto se desplaza B, en unidades de $\alpha\Delta T\,b$? (Positivo
          hacia C.)
        respuesta:
          tipo: numero
          valor: '0.3004'
          tolerancia: 0.0005
          formato: un número (el desplazamiento dividido por αΔT·b)
        distractores:
          - valor: '2'
            mensaje: |
              Es el desplazamiento si la barra 1 se dilatara libre, sin las
              barras 2 y 3: B tendría que correrse $2\alpha\Delta T\,b$ para
              que la diagonal se alargara $\alpha\Delta T\,b\sqrt2$. Las otras
              dos barras lo frenan casi del todo.
          - valor: '0.2124'
            mensaje: |
              Es el alargamiento de la barra 1, $u/\sqrt2$, no el
              desplazamiento de B. B se mueve en horizontal, y su proyección
              sobre la diagonal es ese alargamiento.
          - valor: '0'
            mensaje: |
              Con B fijo la barra 1 no se alargaría. El apoyo móvil solo
              impide el movimiento vertical: en horizontal B se mueve lo que
              dejan las barras 2 y 3.
        pista: |
          $u = \dfrac{2\,\alpha\Delta T\,b}{4\sqrt2 + 1}$, del equilibrio de B.
        desarrollo: |
          $$
          u = \frac{2}{4\sqrt2 + 1}\,\alpha\Delta T\,b = 0{,}3004\,\alpha\Delta T\,b
          $$

          hacia C (a la derecha), y nada en vertical. El número coincide con
          el de $N_2/(EA\alpha\Delta T)$ porque $N_2 = EA\,u/b$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              B solo puede moverse en horizontal, un $u$; las tres barras y el
              apoyo forman una estructura hiperestática.
          - texto: >-
              Compatibilidad: $\Delta L_1 = u/\sqrt2$, $\Delta L_2 = u$ y
              $\Delta L_3 = -u$.
          - texto: >-
              Comportamiento: $N_1 = EA\left(\tfrac{u}{2b} - \alpha\Delta T\right)$,
              $N_2 = EA\,u/b$ y $N_3 = -EA\,u/b$.
          - texto: >-
              Equilibrio horizontal de B: $-N_1/\sqrt2 - N_2 + N_3 = 0$, de
              donde $u = 2\alpha\Delta T\,b/(4\sqrt2 + 1)$.
          - texto: >-
              $N_1 = -0{,}8498\,EA\alpha\Delta T$, $N_2 = -N_3 = 0{,}3004\,EA\alpha\Delta T$
              y el apoyo empuja B hacia arriba con $0{,}6009\,EA\alpha\Delta T$.
          - texto: >-
              La barra 1 se alarga lo que le pide la temperatura,
              $\alpha\Delta T\,b\sqrt2$, y las otras dos se acomodan.
            trampa: true
            mensaje: |
              Ese es el alargamiento libre, el que tendría sin las barras 2 y
              3. Ellas la frenan: se alarga solo $u/\sqrt2 = 0{,}2124\,\alpha\Delta T\,b$,
              un 15 % del libre, y la diferencia la pone una compresión
              $N_1 = -0{,}8498\,EA\alpha\Delta T$.
    resolucion: |
      **Qué se mueve.** A, C y D son fijos. B está sobre un apoyo móvil de
      suelo horizontal: solo se mueve en horizontal, un $u$ (positivo hacia
      C). Es la única incógnita cinemática, y la única ecuación que hace falta
      es el equilibrio horizontal de B; la vertical da la reacción del apoyo.
      Con $A = (0,\ 0)$ y $B = (b,\ 0)$, D está en $(0,\ b)$: la barra 1 forma
      45° y mide $L_1 = b\sqrt2$.

      **Compatibilidad** (ec. 8.12: el alargamiento es la diferencia de las
      proyecciones de los desplazamientos de los extremos sobre la barra). La
      barra 1, de D a B, tiene la dirección $(1,\ -1)/\sqrt2$; la 2 y la 3 son
      horizontales:

      $$
      \Delta L_1 = \frac{u}{\sqrt2},\qquad \Delta L_2 = u,\qquad \Delta L_3 = -u
      $$

      **Comportamiento.** A la barra 1 se le suma la dilatación térmica:
      $\Delta L_1 = N_1L_1/EA + \alpha\Delta T\,L_1$. Las otras dos solo tienen
      la parte elástica:

      $$
      N_1 = EA\left(\frac{u}{2b} - \alpha\Delta T\right),\qquad N_2 = \frac{EA\,u}{b},\qquad N_3 = -\frac{EA\,u}{b}
      $$

      **Equilibrio de B.** Una barra a tracción tira del nudo hacia su otro
      extremo: la 1 hacia D, la 2 hacia A y la 3 hacia C. En horizontal:

      $$
      -\frac{N_1}{\sqrt2} - N_2 + N_3 = 0
      \quad\Longrightarrow\quad
      -\frac{1}{\sqrt2}\left(\frac{u}{2b} - \alpha\Delta T\right) - \frac{2u}{b} = 0
      $$

      **Resultados.** Multiplicando por $2\sqrt2\,b$:
      $-u + 2\alpha\Delta T\,b - 4\sqrt2\,u = 0$, y

      $$
      u = \frac{2}{4\sqrt2 + 1}\,\alpha\Delta T\,b = 0{,}3004\,\alpha\Delta T\,b \quad\text{(hacia C)}
      $$

      $$
      N_1 = -\frac{4\sqrt2}{4\sqrt2 + 1}\,EA\alpha\Delta T = -\frac{32 - 4\sqrt2}{31}\,EA\alpha\Delta T = -0{,}8498\,EA\alpha\Delta T
      $$

      $$
      N_2 = -N_3 = \frac{2}{4\sqrt2 + 1}\,EA\alpha\Delta T = \frac{8\sqrt2 - 2}{31}\,EA\alpha\Delta T = 0{,}3004\,EA\alpha\Delta T
      $$

      Si la barra se calienta ($\Delta T > 0$), la barra 1 queda comprimida
      (se alarga menos de lo que querría), la 2 a tracción y la 3 a
      compresión; si se enfría, todo cambia de signo. El desplazamiento vertical de B es nulo;
      el apoyo lo garantiza con una reacción $R_B = -N_1/\sqrt2 = 0{,}6009\,EA\alpha\Delta T$
      hacia arriba, que equilibra el empuje de la barra 1 comprimida. Sin
      calculadora, como pide la nota, se dejan las formas exactas.

      **Lo que enseña.** La barra calentada querría alargarse
      $\alpha\Delta T\,b\sqrt2$, lo que exigiría $u = 2\alpha\Delta T\,b$. Las
      barras 2 y 3, que trabajan en paralelo frente a $u$, son mucho más
      rígidas en esa dirección que la 1 (que la ve a 45° y es más larga), y
      la frenan: $u$ se queda en un 15 % del libre y la barra 1 lleva el 85 %
      de la fuerza que tendría empotrada. Si B fuera fijo, $N_1$ sería
      $-EA\alpha\Delta T$.

      **Comprobaciones.** El motor del curso (`resuelveBarras`, con B como
      nudo y una deslizadera que le impide el movimiento vertical) da los
      mismos $u$, $N_1$, $N_2$ y $N_3$, desplazamiento vertical nulo y la
      misma reacción. El segundo camino, la forma cerrada de arriba, coincide,
      y las fuerzas cumplen el equilibrio horizontal de B.

  # ── Ejercicio 3 · la viga con la carga triangular y la sección en L.
  - id: exerm1314-1par-7-la-viga-con-carga-triangular-y-seccion-en-l
    titulo: Una viga apoyada con carga triangular, sus diagramas, y el espesor de una sección en L
    fuente: >-
      Ejercicio 3 · Primer parcial de 2013-2014 (hoja de ejercicios del 8 de
      noviembre de 2013) · Elasticidad y Resistencia de Materiales, Escuela
      Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 3 puntos. El
      examen no publica resolución; el desarrollo es nuestro y sigue los
      apuntes del tema 7 (los diagramas: dT/dx = −q y dM/dx = T) y del tema
      9, apartado 9.2.1 (ecs. 9.7 a 9.13), con su convenio de ejes (fig. 9.3).
    nivel: examen
    enunciado: |
      (3p) La viga simplemente apoyada soporta cargas distribuidas lineales
      en los tramos BC y DE. La dirección de aplicación de la carga es $y$, la
      sección se muestra en la figura y su espesor es $t$.

      a/ Dibujar los diagramas de fuerzas cortantes y de momentos flectores
      en función de $q_0$ y $a$.

      b/ Calcular el espesor $t$ de la sección según la tensión normal
      máxima, para los siguientes datos: $a$ = 4m, $q_0$ = 1000 kg/m,
      $\sigma_{adm}$ = 2000 kg/cm².

