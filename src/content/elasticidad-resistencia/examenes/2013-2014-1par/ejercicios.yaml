      La sección a escala, con G, el eje neutro y las dos esquinas más
      alejadas de él: P, la más traccionada, y Q, la más comprimida.

      </figcaption>
      </figure>

      **El punto de tensión máxima.** Es el más alejado del eje neutro: la
      esquina del pie del ala vertical en su cara **interior**, P, en
      $(y,\ z) = (10{,}125t,\ -1{,}375t)$:

      $$
      \sigma_P = \left(2{,}7298\cdot10{,}125 - 2{,}6523\cdot1{,}375\right)\cdot10^{-3}\,\frac{M}{t^{3}} = 0{,}023992\,\frac{M}{t^{3}}
      $$

      La esquina exterior del pie tiene $0{,}02134\,M/t^{3}$, y la de arriba
      a la izquierda, Q, la más comprimida, $-0{,}01961\,M/t^{3}$: con el mismo
      $\sigma_{adm}$ a tracción y a compresión, manda P.

      **El espesor.** Con $M_{max} = 0{,}725775\cdot1000\cdot4^{2}$ kg·m
      $= 11\,612$ kg·m $= 1\,161\,240$ kg·cm y $\sigma_P = \sigma_{adm} = 2000$ kg/cm²:

      $$
      t^{3} = \frac{0{,}023992\cdot1\,161\,240}{2000}\ \text{cm}^{3} = 13{,}93\ \text{cm}^{3}
      \quad\Longrightarrow\quad t = 2{,}406\ \text{cm} \approx 24\ \text{mm}
      $$

      La L mide entonces 24 cm de ancho y 36 cm de alto, con 2,4 cm de
      espesor. Como todas las cotas son múltiplos de $t$, el resultado es
      exacto: no se ha despreciado nada por pared delgada.

      **Comprobaciones.** El motor del curso resuelve la viga
      (`resuelveViga`, `tramos` y `maximos`): las mismas reacciones, el
      cortante nulo en $1{,}367a$ y el mismo máximo; el segundo camino son
      las resultantes de los triángulos y las fórmulas cerradas desde C. La
      flexión no la tiene el motor, así que la sección sale de un guion
      propio y se comprueba por caminos independientes: (1) las propiedades,
      integradas en una malla fina de la sección, dan el mismo G, $I_z$,
      $I_y$ e $I_{yz}$; (2) en ejes principales, con el momento proyectado en
      ellos, las tensiones de las seis esquinas y el eje neutro salen
      iguales; y (3) el campo de tensiones integrado en la malla da $N = 0$,
      $\int\sigma_x z\,dA = 0$ e $\int\sigma_x y\,dA = M$ (ec. 9.8).
