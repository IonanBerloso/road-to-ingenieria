      **b/ La sección.** Dos rectángulos sin solaparse, con $y$ desde la
      cara de arriba hacia abajo y $z$ desde la cara exterior del ala
      vertical: el ala vertical ($t \times 15t$, centro en
      $(z,\ y) = (0{,}5t,\ 7{,}5t)$) y el resto del ala de arriba
      ($9t \times t$, centro en $(5{,}5t,\ 0{,}5t)$). Área $A = 24t^{2}$, y

      $$
      \overline{z} = \frac{15\cdot0{,}5 + 9\cdot5{,}5}{24}\,t = 2{,}375\,t,\qquad
      \overline{y} = \frac{15\cdot7{,}5 + 9\cdot0{,}5}{24}\,t = 4{,}875\,t
      $$

      **Inercias respecto de G** (Steiner; en $t^{4}$):

      $$
      \begin{aligned}
      I_z &= \tfrac{15^{3}}{12} + 15\cdot2{,}625^{2} + \tfrac{9}{12} + 9\cdot4{,}375^{2} = 557{,}625\\
      I_y &= \tfrac{15}{12} + 15\cdot1{,}875^{2} + \tfrac{9^{3}}{12} + 9\cdot3{,}125^{2} = 202{,}625\\
      I_{yz} &= 15\,(2{,}625)(-1{,}875) + 9\,(-4{,}375)(3{,}125) = -196{,}875
      \end{aligned}
      $$

      con $I_yI_z - I_{yz}^{2} = 74\,229$ (en $t^{8}$). El producto de inercia
      es negativo y grande: los ejes $y$, $z$ no son principales.

      **Las tensiones** (ecs. 9.10 y 9.11). La carga va según $y$: solo hay
      $M_z = M$, positivo (tracciona abajo), y $M_y = 0$. Con $y$, $z$ en
      unidades de $t$:

      $$
      \sigma_x = M\,\frac{I_y\,y - I_{yz}\,z}{I_yI_z - I_{yz}^{2}} = \left(2{,}7298\,y + 2{,}6523\,z\right)\cdot10^{-3}\,\frac{M}{t^{3}}
      $$

      **El eje neutro.** $\sigma_x = 0$ da $y = -0{,}9716\,z$: pasa por G y
      sube hacia $+z$ formando $44{,}18^{\circ}$ con $z$. Por debajo y a la
      derecha la sección está traccionada; por encima y a la izquierda,
      comprimida.

      Los ejes principales (apartado 9.2.2) explican por qué se tuerce
      tanto: el círculo de Mohr de inercias tiene centro 380,125 y radio
      265,08 (en $t^{4}$), así que $I_{max} = 645{,}20$ e
      $I_{min} = 115{,}05$, con el eje de inercia máxima bajando 23,98° hacia
      $+z$. El momento, según $z$, está a 23,98° de él, y el eje neutro se
      aleja del principal hacia el de inercia mínima un ángulo $\psi$ con
      $\operatorname{tg}\psi = (I_{max}/I_{min})\operatorname{tg}23{,}98^{\circ} = 2{,}494$:
      $\psi = 68{,}16^{\circ}$ y $68{,}16^{\circ} - 23{,}98^{\circ} = 44{,}18^{\circ}$,
      lo mismo.

