ejercicios:
  # La cuestión 1 de teoría es exerm2223-ord-1 (rev-p9g, M5): sin ejercicio
  # propio. La teoría de esta final no tiene ninguno.
  # ── Problema 1 · la roseta de tres galgas a 30° (temas 3 y 4, con el 2).
  - id: exerm1819-ord-5-la-roseta-a-30-grados
    titulo: Una roseta de tres galgas separadas 30°, las deformaciones y las tensiones en los planos de las galgas
    fuente: >-
      Problema 1 · Examen final del 16 de enero de 2019 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1,5 puntos. La dirección de cada galga se lee en las líneas de
      puntos de la figura. El examen no publica resolución; el desarrollo es
      nuestro, con los convenios de los temas 2, 3 y 4.
    nivel: examen
    enunciado: |
      (1,5p) En un estado de tensión plana se conocen el valor de las
      deformaciones dadas por las galgas $a$, $b$ y $c$ de la figura. Determinar:

      a/ Las deformaciones $\varepsilon_x$, $\varepsilon_y$ y $\gamma_{xy}$ en
      función de $\varepsilon_a$, $\varepsilon_b$ y $\varepsilon_c$.

      b/ Las tensiones normales y tangenciales en los planos perpendiculares
      a las galgas $a$, $b$ y $c$, indicando sus sentidos.

      $E$ = 70 GPa, $G$ = 26,3 GPa

      $\varepsilon_a$= 1200·10⁻⁶; $\varepsilon_b$ = 400·10⁻⁶; $\varepsilon_c$= -800·10⁻⁶

      <figure class="figura-examen">
      <svg viewBox="0 0 420 300" role="img" width="420" height="300" aria-labelledby="exerm1819-ord-5-la-roseta-a-30-grados-fig-t exerm1819-ord-5-la-roseta-a-30-grados-fig-d">
