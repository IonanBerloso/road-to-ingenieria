      <figcaption>

      Redibujada del enunciado, con cada galga girada con su línea de
      puntos, como en el Word original; el PDF del examen las pinta las
      tres en horizontal.

      </figcaption>
      </figure>

      **Notas nuestras.** En el PDF del examen las tres galgas salen en
      horizontal: la conversión pierde su giro, y cada una mide en la
      dirección de su línea de puntos. Los dos
      ángulos de 30° se miden desde la línea del centro. Se conservan «se
      conocen el valor», en singular, y «$\varepsilon_a$=» y
      «$\varepsilon_c$=» sin espacio antes del igual.
    pide: >-
      εx, εy y γxy en función de las tres lecturas, sus valores, y la tensión
      normal y la tangencial, con su sentido, en los planos perpendiculares
      a cada galga.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál de las tres deformaciones del plano da directamente una
          galga, sin hacer ninguna cuenta?
        opciones:
          - texto: >-
              $\varepsilon_x$, que es la lectura de la galga b, porque b va
              según el eje $x$
            correcta: true
            mensaje: |
              Eso es. Con $\theta = 0$ la ec. de la galga,
              $\varepsilon_\theta = \varepsilon_x\cos^2\theta + \varepsilon_y\operatorname{sen}^2\theta + \gamma_{xy}\operatorname{sen}\theta\cos\theta$
              (ec. 3.55, p. 17), se queda en $\varepsilon_x$. Las otras dos
              galgas dan $\varepsilon_y$ y $\gamma_{xy}$ combinadas.
          - texto: >-
              $\gamma_{xy}$, que es la diferencia entre las lecturas de a y c
            mensaje: |
              La diferencia $\varepsilon_c - \varepsilon_a$ sí lleva solo
              $\gamma_{xy}$ (los términos en $\varepsilon_x$ y $\varepsilon_y$
              se van, porque a y c son simétricas respecto a $x$), pero
              multiplicada por $2\operatorname{sen}30^\circ\cos30^\circ = \sqrt{3}/2$:
              hay que dividir.
          - texto: >-
              $\varepsilon_y$, que es la lectura de la galga c, la más
              inclinada hacia $y$
            mensaje: |
              c forma 30° con $x$, no 90°: mide sobre todo $\varepsilon_x$
              ($\cos^2 30^\circ = 3/4$) y solo una cuarta parte de
              $\varepsilon_y$. Ninguna galga va según $y$.
      - tipo: calcular
        titulo: La distorsión γxy
        pregunta: |
          ¿Cuánto vale $\gamma_{xy}$, en unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '-2309.4'
          tolerancia: 1
          formato: un número, γxy en 10⁻⁶
        distractores:
          - valor: '2309.4'
            mensaje: |
              El valor es ese y el signo, el contrario: has tomado a a +30° y
              c a −30°. En la figura c está por encima de $x$ (+30°) y a por
              debajo, y $\gamma_{xy} = 2(\varepsilon_c - \varepsilon_a)/\sqrt{3}$
              sale negativa porque c lee menos que a.
          - valor: '-2000.0'
            mensaje: |
              Te falta el $\sqrt{3}/2$ que acompaña a $\gamma_{xy}$ en la ec.
              de la galga. $\varepsilon_c - \varepsilon_a =
              2\operatorname{sen}30^\circ\cos30^\circ\,\gamma_{xy} =
              \tfrac{\sqrt{3}}{2}\gamma_{xy}$, así que
              $\gamma_{xy} = 2(\varepsilon_c - \varepsilon_a)/\sqrt{3}$.
          - valor: '-1154.7'
            mensaje: |
              Es la mitad de $\gamma_{xy}$, la componente del tensor de
              deformaciones. La ec. de la galga lleva $\gamma_{xy}$ entera
              multiplicada por $\operatorname{sen}\theta\cos\theta$; con
              $\varepsilon_{xy} = \tfrac{1}{2}\gamma_{xy}$ el factor sería
              $2\operatorname{sen}\theta\cos\theta$.
        pista: |
          Escribe la ec. 3.55 para $\theta = -30^\circ$ y $\theta = +30^\circ$
          y réstalas: se van $\varepsilon_x$ y $\varepsilon_y$.
        desarrollo: |
          $\varepsilon_c - \varepsilon_a = 2\operatorname{sen}30^\circ\cos30^\circ\,\gamma_{xy} = \tfrac{\sqrt{3}}{2}\gamma_{xy}$, así que

          $$
          \gamma_{xy} = \frac{2(\varepsilon_c - \varepsilon_a)}{\sqrt{3}} = \frac{2(-800 - 1200)}{\sqrt{3}}\cdot10^{-6} = -2309{,}4\cdot10^{-6}
          $$
      - tipo: calcular
        titulo: La tensión normal en el plano perpendicular a la galga a
        pregunta: |
          ¿Cuánto vale la tensión normal en el plano perpendicular a la galga
          a, en MPa?
        respuesta:
          tipo: numero
          valor: '63.12'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '84.00'
            mensaje: |
              $E\varepsilon_a$ sería la tensión si solo hubiera tensión en esa
              dirección. En tensión plana la deformación perpendicular
              también cuenta, por el efecto Poisson:
              $\sigma_a = \frac{E}{1 - \nu^2}(\varepsilon_a + \nu\varepsilon_\perp)$.
          - valor: '64.62'
            mensaje: |
              Has tomado $\nu = 0{,}3$. El enunciado no da $\nu$ sino $E$ y
              $G$, y $\nu$ sale de ellos: $\nu = E/(2G) - 1 = 0{,}3308$
              (ec. 4.6).
          - valor: '-42.08'
            mensaje: |
              Es la tensión del plano de la galga c. Te ha salido aquí porque
              $\gamma_{xy}$ tiene el signo cambiado (a y c intercambiadas):
              a está a −30°, por debajo de $x$, y es la que más se alarga.
        pista: |
          $\nu = E/(2G) - 1$. Con $\varepsilon_x$, $\varepsilon_y$ y
          $\gamma_{xy}$ saca $\sigma_x$, $\sigma_y$ y $\tau_{xy}$ (tensión
          plana, ec. 4.25) y gíralas a $\theta = -30^\circ$ con la ec. 2.61.
        desarrollo: |
          $\nu = 70/(2\cdot26{,}3) - 1 = 0{,}3308$ y
          $E/(1 - \nu^2) = 78\,601$ MPa:
          $\sigma_x = 21{,}04$, $\sigma_y = -21{,}04$ y
          $\tau_{xy} = G\gamma_{xy} = -60{,}74$ MPa. Con $\theta = -30^\circ$
          ($\cos2\theta = \tfrac{1}{2}$, $\operatorname{sen}2\theta = -\tfrac{\sqrt{3}}{2}$):

          $$
          \sigma_a = 0 + 21{,}04\cdot\tfrac{1}{2} + (-60{,}74)\left(-\tfrac{\sqrt{3}}{2}\right) = 63{,}12\ \text{MPa}
          $$

          Otro camino: la deformación perpendicular a la galga es
          $\varepsilon_x + \varepsilon_y - \varepsilon_a = -1200\cdot10^{-6}$,
          y $\sigma_a = \frac{E}{1 - \nu^2}(\varepsilon_a + \nu\varepsilon_\perp)$
          da lo mismo.
      - tipo: calcular
        titulo: La tensión tangencial en el plano perpendicular a la galga c
        pregunta: |
          ¿Cuánto vale la tensión tangencial en el plano perpendicular a la
          galga c, en MPa, con el convenio de la ec. 2.61 (positiva según
          $\hat{t} = -\operatorname{sen}\theta\,\vec{i} + \cos\theta\,\vec{j}$)?
        respuesta:
          tipo: numero
          valor: '-48.59'
          tolerancia: 0.05
          formato: un número, en MPa (convenio de la ec. 2.61)
        distractores:
          - valor: '48.59'
            mensaje: |
              Ese es su valor absoluto, pero con el convenio de la ec. 2.61
              la tangencial es negativa: apunta en contra de $\hat{t}$, es
              decir, hacia abajo y a la derecha. También sale $+48{,}59$ si has
              intercambiado a y c del todo, con $\gamma_{xy}$ positiva y c a
              $-30^\circ$: c está a $+30^\circ$, por encima de $x$.
          - valor: '-33.41'
            mensaje: |
              Has puesto $\tau_{xy} = G\gamma_{xy}/2$. La ley de Hooke en
              cortante es $\tau_{xy} = G\gamma_{xy}$ (ec. 4.13), con
              $\gamma_{xy}$ entera; el $\tfrac{1}{2}$ es del tensor de
              deformaciones, no de la tensión.
          - valor: '12.15'
            mensaje: |
              Te sale con $\gamma_{xy}$ positiva: has intercambiado a y c al
              sacar $\gamma_{xy}$, aunque aquí tomes bien c a $+30^\circ$. Con
              $\tau_{xy} = +60{,}74$ MPa,
              $-21{,}04\cdot\tfrac{\sqrt{3}}{2} + 60{,}74\cdot\tfrac{1}{2} = 12{,}15$.
              $\gamma_{xy} = 2(\varepsilon_c - \varepsilon_a)/\sqrt{3}$ es
              negativa, porque c lee menos que a.
        pista: |
          $\tau_n = -\tfrac{1}{2}(\sigma_x - \sigma_y)\operatorname{sen}2\theta + \tau_{xy}\cos2\theta$
          (ec. 2.61), con $\theta = +30^\circ$.
        desarrollo: |
          $$
          \tau_c = -21{,}04\cdot\tfrac{\sqrt{3}}{2} + (-60{,}74)\cdot\tfrac{1}{2} = -48{,}59\ \text{MPa}
          $$

          Negativa: sobre la cara de normal $\hat{n} = (\cos30^\circ, \operatorname{sen}30^\circ)$
          la tangencial va según $-\hat{t} = (\tfrac{1}{2}, -\tfrac{\sqrt{3}}{2})$,
          hacia abajo y a la derecha.
      - tipo: justificar
        pregunta: Ordena el camino de las lecturas a las tensiones. Una pieza sobra.
        piezas:
          - texto: >-
              La galga b va según $x$, así que $\varepsilon_x = \varepsilon_b$.
          - texto: >-
              Restando las ecuaciones de c y a se despeja
              $\gamma_{xy} = 2(\varepsilon_c - \varepsilon_a)/\sqrt{3}$, y
              sumándolas, $\varepsilon_y = 2(\varepsilon_a + \varepsilon_c) - 3\varepsilon_b$.
          - texto: >-
              Con $\nu = E/(2G) - 1$ y la ley de Hooke en tensión plana salen
              $\sigma_x$, $\sigma_y$ y $\tau_{xy} = G\gamma_{xy}$.
          - texto: >-
              En cada plano perpendicular a una galga, la normal es la
              dirección de la galga, y la ec. 2.61 con su ángulo da
              $\sigma_n$ y $\tau_n$.
          - texto: >-
              Como el estado es de tensión plana, $\varepsilon_z = 0$ y la
              tercera ecuación de Hooke sirve para comprobar $\nu$.
            trampa: true
            mensaje: |
              En tensión plana lo nulo es $\sigma_z$, no $\varepsilon_z$:
              la pieza se estrecha en $z$,
              $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E$, que aquí es 0
              solo porque $\sigma_x + \sigma_y = 0$. Que
              $\varepsilon_z = 0$ es la deformación plana, otro estado.
    resolucion: |
      **a) Las deformaciones.** Cada galga lee
      $\varepsilon_\theta = \varepsilon_x\cos^2\theta + \varepsilon_y\operatorname{sen}^2\theta + \gamma_{xy}\operatorname{sen}\theta\cos\theta$
      (tema 3, ec. 3.55, p. 17), con a a $-30^\circ$, b a $0^\circ$ y c a
      $+30^\circ$:

      $$
      \varepsilon_a = \tfrac{3}{4}\varepsilon_x + \tfrac{1}{4}\varepsilon_y - \tfrac{\sqrt{3}}{4}\gamma_{xy},\qquad
      \varepsilon_b = \varepsilon_x,\qquad
      \varepsilon_c = \tfrac{3}{4}\varepsilon_x + \tfrac{1}{4}\varepsilon_y + \tfrac{\sqrt{3}}{4}\gamma_{xy}
      $$

      Despejando:

      $$
      \varepsilon_x = \varepsilon_b,\qquad
      \varepsilon_y = 2(\varepsilon_a + \varepsilon_c) - 3\varepsilon_b,\qquad
      \gamma_{xy} = \frac{2(\varepsilon_c - \varepsilon_a)}{\sqrt{3}}
      $$

      Con los datos: $\varepsilon_x = 400\cdot10^{-6}$,
      $\varepsilon_y = 2(1200 - 800) - 1200 = -400\cdot10^{-6}$ y
      $\gamma_{xy} = -2309{,}4\cdot10^{-6}$. Comprobación: las tres
      lecturas vuelven a salir de la ec. 3.55 con estos valores.

      **Las tensiones en x, y.** $\nu = E/(2G) - 1 = 0{,}3308$ (tema 4,
      ec. 4.6) y, en tensión plana (ec. 4.25):

      $$
      \sigma_x = \frac{E}{1 - \nu^2}(\varepsilon_x + \nu\varepsilon_y) = 21{,}04\ \text{MPa},\quad
      \sigma_y = \frac{E}{1 - \nu^2}(\varepsilon_y + \nu\varepsilon_x) = -21{,}04\ \text{MPa},\quad
      \tau_{xy} = G\gamma_{xy} = -60{,}74\ \text{MPa}
      $$

      **b) Los planos de las galgas.** El plano perpendicular a una galga
      tiene la normal $\hat{n} = (\cos\theta, \operatorname{sen}\theta)$ según
      la galga; con la ec. 2.61 (tema 2, p. 23), y $\tau_n$ positiva según
      $\hat{t} = (-\operatorname{sen}\theta, \cos\theta)$:

      | Plano | $\theta$ | $\sigma_n$ (MPa) | $\tau_n$ (MPa) |
      |---|---|---|---|
      | perpendicular a a | $-30^\circ$ | 63,12 | −12,15 |
      | perpendicular a b | $0^\circ$ | 21,04 | −60,74 |
      | perpendicular a c | $+30^\circ$ | −42,08 | −48,59 |

      **Los sentidos.** Las tres tangenciales son negativas: van en contra
      de $\hat{t}$. En el plano de a ($\hat{n}$ hacia abajo y a la derecha),
      la normal es de **tracción** y la tangencial va según
      $(-\tfrac{1}{2}, -\tfrac{\sqrt{3}}{2})$, hacia abajo y a la izquierda.
      En el de b ($\hat{n} = \vec{i}$), tracción de 21,04 MPa y la
      tangencial hacia $-y$. En el de c ($\hat{n}$ hacia arriba y a la
      derecha), **compresión** de 42,08 MPa y la tangencial
      según $(\tfrac{1}{2}, -\tfrac{\sqrt{3}}{2})$, hacia abajo y a la
      derecha. Sobre la cara opuesta de cada plano, las dos con el sentido
      contrario.

      Comprobación por otro camino: en el plano de cada galga, la
      deformación perpendicular es $\varepsilon_x + \varepsilon_y - \varepsilon_\theta$
      (el invariante), y $\sigma_n = \frac{E}{1 - \nu^2}(\varepsilon_\theta + \nu\varepsilon_\perp)$
      da las mismas $\sigma_n$; las $\tau_n$ salen también de $G$ por la
      distorsión entre la galga y su perpendicular. El motor del curso da
      lo mismo.
