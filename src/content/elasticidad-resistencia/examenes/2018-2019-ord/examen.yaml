asignatura: elasticidad-resistencia
curso: '2018-2019'
convocatoria: ordinaria
fecha: 16 de enero de 2019
# El examen final de Elasticidad y Resistencia de Materiales del 16 de enero
# de 2019: tres páginas, la 1 de TEORÍA (cuatro cuestiones de 1 punto) y la
# 2 y la 3 de EJERCICIOS (cuatro de 1,5 puntos). Diez puntos en total, y el
# cuadernillo los imprime todos. El mismo día se hizo la segunda parte, que
# comparte seis preguntas con este examen (punto 5).
#
# El cuadernillo es bilingüe, castellano a la izquierda y euskera a la
# derecha, y se transcribe **solo la columna en castellano**, tal cual. El
# euskera pide lo mismo en las ocho preguntas.
#
# 1. **EL PDF DESCOLOCA Y PIERDE, Y EL WORD MANDA.** En la cuestión 1 las
#    dos aristas son una imagen del Word: el PDF pone las flechas de los
#    vectores debajo de la u,x y de la k y deja unos recuadros vacíos
#    encima de O'A' y O'B'; se transcriben en su sitio. Las letras griegas
#    del texto (γxy en la cuestión 1; εx, εy, γxy, εa, εb y εc en el
#    ejercicio 1) son de la fuente Symbol y el texto del PDF las pierde,
#    aunque se ven en la página. La viga de la cuestión 4 sale sin rótulos
#    (punto 1 de la cabecera de la segunda parte).
#
# 2. **LO QUE LA FIGURA DICE Y EL TEXTO NO.** En el ejercicio 1, cada galga
#    mide en la dirección de su línea de puntos: a a −30° de x, b según x y
#    c a +30°. En el Word las galgas a y c van giradas con su línea; el PDF
#    las pinta las tres en horizontal, porque la conversión pierde el giro.
#    La figura sigue al Word, y el pie y la nota del enunciado lo dicen. Las lecturas de las preguntas compartidas con la
#    segunda parte se dicen en la cabecera de aquel examen.
#
# 3. **ERRATAS Y GRAFÍAS DEL TEXTO, CONSERVADAS**: «se conocen el valor de
#    las deformaciones», en singular, y «εa=» y «εc=» sin espacio antes del
#    igual (ejercicio 1). La cuestión 2, «Teorema del flujo cortante», no
#    lleva el punto final que sí lleva en la segunda parte (punto 5).
#
# 4. **DOS NUMERACIONES EN UN CUADERNILLO.** La teoría va de la 1 a la 4 y
#    los ejercicios vuelven a empezar en 1. Aquí la teoría son **n 1 a 4** y
#    los ejercicios **n 5 a 8**; la `fuente` de cada ejercicio dice el
#    nombre impreso. Ninguna pregunta se parte.
#
# 5. **PREGUNTAS REPETIDAS.** Siete de las ocho no se resuelven aquí: la
#    entrada apunta al ejercicio donde ya están.
#    - La **cuestión 2** es la cuestión 3 de la final de enero de 2021
#      (`exerm2021-ord-3-el-teorema-del-flujo-cortante`), la misma a la que
#      apunta la segunda parte de este día. Solo le falta el punto final: la
#      hoja enseñará «(1p) Teorema del flujo cortante.» con punto.
#    - Las **cuestiones 3 y 4** y los **ejercicios 2, 3 y 4** son las
#      cuestiones 3 y 4 y los ejercicios 1, 2 y 3 de la segunda parte del
#      mismo día, con el mismo texto. Las cuestiones valen lo mismo, 1
#      punto; los ejercicios, «(1,5p)» aquí y «(2p)» allí. Por eso los tres
#      se transcribieron allí sin su «(2p)»: cada hoja pone sus puntos desde
#      `puntosImpresos`, y la `fuente` dice los dos valores.
#    - La **cuestión 1** es la cuestión 1 de la final de enero de 2023
#      (`exerm2223-ord-1-la-distorsion-desde-las-aristas-deformadas`), con
#      las aristas entre paréntesis y no entre corchetes: la misma pregunta,
#      con el mismo punto. Se apunta a ella (rev-p9g, M5).
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso y de un segundo camino (fase-p/p9g,
# guiones/cifras.mjs).
pdf: 2018-2019-ord.pdf
puntosImpresos:
  fuente: Cabecera de cada pregunta, «(1p)» en la teoría y «(1,5p)» en los ejercicios, págs. 1-3 del cuadernillo.
  reparto:
    - { n: 1, puntos: 1 }
    - { n: 2, puntos: 1 }
    - { n: 3, puntos: 1 }
    - { n: 4, puntos: 1 }
    - { n: 5, puntos: 1.5 }
    - { n: 6, puntos: 1.5 }
    - { n: 7, puntos: 1.5 }
    - { n: 8, puntos: 1.5 }

