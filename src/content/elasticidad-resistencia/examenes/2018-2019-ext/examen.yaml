curso: '2018-2019'
convocatoria: extraordinaria
fecha: 21 de junio de 2019
# La convocatoria extraordinaria de Elasticidad y Resistencia de Materiales
# de 2018-2019, del 21 de junio de 2019 («Examen Final: 21/06/2019»;
# «Azterketa Finala: 2019/06/21» en euskera): tres páginas, en euskera y en
# castellano, de la Escuela de Ingeniería de Gipuzkoa. La página 1 es de
# teoría (TEORIA/ TEORÍA: cuatro cuestiones de 1 punto) y la 2 y la 3, de
# problemas (ARIKETAK / EJERCICIOS: cuatro de 1,5 puntos, dos por página).
# Diez puntos en total, y el cuadernillo los imprime todos.
#
# Se transcribe la columna en castellano, tal cual, con sus puntos
# impresos. Lo que hay que saber de ese texto, dicho antes de que nadie lo
# deduzca:
#
# 1. **EL PDF ES UNA CONVERSIÓN DEL WORD, Y PIERDE UN GIRO.** En el
#    problema 1 el Word pone la galga a girada sobre la diagonal del
#    elemento; el PDF la pinta en horizontal, en el centro del cuadrado. La
#    figura sigue al Word, y su pie lo dice. Las letras griegas del texto
#    (σx, τxy, εa, σy, Δ, ν) son de la fuente Symbol: se ven en la página
#    aunque la capa de texto las pierda. Todo lo demás, texto y figuras, el
#    PDF lo imprime igual que el Word, y las figuras se han redibujado.
#
# 2. **LECTURAS.**
#    - Cuestión 4: las dos cotas de 20 mm llegan a las caras exteriores del
#      tubo, así que la línea media es un cuadrado de 18 mm. σon,adm es la
#      tensión admisible del criterio de la tensión principal máxima, y el
#      ángulo girado es el del extremo libre del voladizo respecto del
#      empotramiento. Las dos fórmulas impresas junto a los datos van en el
#      enunciado.
#    - Problema 1: la galga mide la deformación lineal según su diagonal, a
#      +45° de x (antihorario); las flechas de σx, σy y τxy son las de
#      tensiones positivas. El apartado a se resuelve con la σy que da la
#      galga (82,86 MPa), y el b y el c con los 82,9 MPa que imprime el b.
#    - Problema 2: A es un apoyo fijo y B uno móvil, BC vuela y q0 ocupa de
#      A a C. La sección es una L con el ala vertical (2 × 20 cm) a la
#      izquierda y el ala de abajo (2 cm de espesor, 10 cm de ancho total)
#      hacia la derecha; ejes del curso, y hacia abajo y z hacia la
#      derecha. «Tensión de tracción máxima» es la mayor σx de tracción de
#      toda la viga.
#    - Problema 3: A es un empotramiento y C un apoyo móvil que baja Δ; q0 va
#      de A a B y P baja en el extremo libre D. EIz = 4 MN·m² = 4000 kN·m².
#    - Problema 4: A y D son articulaciones fijas, D a la altura b sobre A;
#      q0 es vertical y hacia abajo en todo BC; los nudos B y C son rígidos,
#      y solo cuenta la energía de flexión, como pide el enunciado.
#
# 3. **ERRATAS Y RAREZAS DEL TEXTO, CONSERVADAS**: la cuarta cuestión lleva
#    impreso «3. (1p)» (el euskera la numera 4); «1.(1p)» y «3.(1p)» sin
#    espacio; «σon,adm=300MPa» sin espacios; «1m» y «1º» con el ordinal en
#    la cuestión 4 y «a = 1m» en el problema 3; «La viga simplemente
#    apoyada» para una viga con voladizo (problema 2); «sólo» con tilde
#    (problema 4).
#
# 4. **DOS NUMERACIONES EN UN CUADERNILLO.** La teoría va de la 1 a la 4 y
#    los ejercicios vuelven a empezar en 1. Aquí la teoría son **n 1 a 4** y
#    los ejercicios **n 5 a 8**; la `fuente` de cada ejercicio dice el
#    nombre impreso. Ninguna pregunta se parte.
#
# 5. **PREGUNTAS REPETIDAS.** Dos de las ocho no se resuelven aquí: la
#    entrada apunta al ejercicio donde ya están, con el mismo texto y el
#    mismo punto.
#    - La **cuestión 1** es la cuestión 2 de la final del 7 de enero de 2020
#      (`exerm1920-ord-2-las-ecuaciones-de-equilibrio-de-la-pieza-recta`).
#    - La **cuestión 2** es la cuestión 3 de la final del 15 de enero de
#      2021 (`exerm2021-ord-3-el-teorema-del-flujo-cortante`), la misma a la
#      que apuntan la segunda parte y la final de enero de este curso.
#    La **cuestión 3**, «Ecuación diferencial de la curva elástica.», se
#    parece a la cuestión 3 de la extraordinaria del 2 de febrero de 2021
#    («Deducir la ecuación diferencial de la curva elástica.», también de 1
#    punto), pero el texto no es el mismo: va un ejercicio propio, resuelto
#    con otro ejemplo, y su `fuente` nombra el otro. La deducción es la
#    misma, y los dos `redactar` comparten la rúbrica
#    `ecuacion-diferencial-de-la-elastica`. Las otras cinco no están en
#    ningún examen del sitio.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso (src/lib/erm) y de un segundo camino
# (fase-p/p9j, guiones/cifras.mjs). La cuestión 3 no trae números: sus
# pasos de cálculo usan un ejemplo nuestro, y lo dicen.
pdf: 2018-2019-ext.pdf
puntosImpresos:
  fuente: >-
    Impresos junto a cada pregunta: «1.(1p)», «2. (1p)», «3.(1p)» y
    «3. (1p)» (la cuarta, con el número cambiado) en la teoría, p. 1;
    «1. (1,5p)», «2. (1,5p)», «3. (1,5p)» y «4. (1,5p)» en los problemas,
    pp. 2-3.
  reparto:
    - { n: 1, puntos: 1 }
    - { n: 2, puntos: 1 }
    - { n: 3, puntos: 1 }
    - { n: 4, puntos: 1 }
    - { n: 5, puntos: 1.5 }
    - { n: 6, puntos: 1.5 }
    - { n: 7, puntos: 1.5 }
    - { n: 8, puntos: 1.5 }

