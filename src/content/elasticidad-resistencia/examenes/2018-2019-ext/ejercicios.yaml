ejercicios:
  # Las cuestiones 1 y 2 de teoría no van aquí: son ejercicios ya
  # publicados (ver la cabecera del examen.yaml).
  # ── Teoría · cuestión 3 · la ecuación diferencial de la curva elástica.
  - id: exerm1819-ext-3-la-ecuacion-diferencial-de-la-curva-elastica
    titulo: La ecuación diferencial de la curva elástica, y un voladizo integrado con ella
    fuente: >-
      Cuestión 3 de teoría · Extraordinaria del 21 de junio de 2019 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Casi la misma pregunta, con
      «Deducir la» delante y el mismo punto, volvió a caer como cuestión 3
      de la extraordinaria del 2 de febrero de 2021, y está resuelta en el
      sitio; aquí va con otro ejemplo. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 10 (pp. 4-8). Los
      números de los pasos de cálculo son un ejemplo nuestro.
    nivel: examen
    enunciado: |
      3.(1p) Ecuación diferencial de la curva elástica.

      **Notas nuestras.** Es una pregunta de teoría: se pide la ecuación,
      con su deducción, en los ejes del curso ($x$ a lo largo de la viga,
      $y$ hacia abajo y el flector positivo si tracciona la fibra de abajo).
    pide: >-
      La ecuación diferencial de la curva elástica, deducida, con su signo
      y las hipótesis con que vale.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para sacar con esta ecuación la flecha de una viga concreta, ¿qué
          hace falta, además de la rigidez $EI_z$?
        opciones:
          - texto: >-
              El flector $M(x)$ en toda la viga, que sale del equilibrio, y
              tantas condiciones de los apoyos como constantes deja la
              integración
            correcta: true
            mensaje: |
              Eso es (ec. 10.14, pp. 7-8). Se integra dos veces, una
              para el giro y otra para la flecha, y cada vez aparece una
              constante: las dos las fijan los apoyos (en un empotramiento,
              flecha y giro nulos; en un apoyo, flecha nula).
          - texto: >-
              Solo la carga $q$ de cada punto: la ecuación se integra
              directamente con ella
            mensaje: |
              La carga entra a través del flector: con el equilibrio de la
              rebanada (tema 7) se pasa de $q$ a $T$ y a $M$, y es $M$ lo que
              va en la ecuación. Escrita con $q$ sería de cuarto orden, con
              cuatro constantes.
          - texto: >-
              El flector máximo y su sección, porque la flecha máxima está
              donde el flector es máximo
            mensaje: |
              El flector máximo da la tensión máxima, no la flecha. La flecha
              es la suma de lo que se curvan todas las rebanadas, y depende
              de cómo sujetan los apoyos la viga: en un voladizo el flector
              máximo está en el empotramiento, donde la flecha es nula.
      - tipo: reconocer
        pregunta: |
          La ecuación exacta (ec. 10.12) y la aproximada (ec. 10.14) se
          diferencian en una hipótesis. ¿Cuál?
        opciones:
          - texto: >-
              Que los giros son pequeños: $\theta \approx \sin\theta = v_{,x}$,
              y el desplazamiento horizontal no cambia a lo largo de la viga
            correcta: true
            mensaje: |
              Eso es (ec. 10.13, p. 7). Con $\theta$ pequeño,
              $\sqrt{1 - v_{,x}^{2}} \approx 1$, y queda una ecuación lineal
              que se integra sin más.
          - texto: >-
              Que la cortante no añade flecha
            mensaje: |
              Esa hipótesis va antes y vale para las dos: ambas salen de la
              flexión pura, y la cortante se desprecia porque la viga es
              esbelta (p. 4). Lo que la exacta tiene y la aproximada no es la
              raíz de $1 - v_{,x}^{2}$.
          - texto: >-
              Que el material sigue la ley de Hooke
            mensaje: |
              Hooke se usa en las dos, para pasar del alargamiento de la
              fibra a su tensión (ec. 10.2). La aproximada es la exacta con
              giros pequeños.
      - tipo: calcular
        titulo: La curvatura en el empotramiento, en un ejemplo
        pregunta: |
          Un ejemplo nuestro: un voladizo de $L = 2$ m empotrado en $x = 0$,
          con una carga uniforme $q = 10$ kN/m en toda su longitud y
          $EI_z = 5000$ kN·m². ¿Cuánto vale $v_{,xx}$ en el empotramiento,
          en m⁻¹?
        respuesta:
          tipo: numero
          valor: '0.004'
          tolerancia: 0.00002
          formato: un número con su signo, en m⁻¹
        distractores:
          - valor: '-0.004'
            mensaje: |
              El valor es ese y el signo no. El flector del empotramiento es
              negativo, $M = -qL^{2}/2$: la viga cuelga y tracciona la fibra
              de arriba. Con $v_{,xx} = -M/(EI_z)$, la curvatura sale
              positiva.
          - valor: '100000'
            mensaje: |
              Has multiplicado $M$ por $EI_z$. La curvatura es el flector
              **dividido** por la rigidez: cuanto más rígida es la viga,
              menos se curva.
          - valor: '0.001'
            mensaje: |
              Has tomado $qL^{2}/8$, el flector máximo de una viga apoyada
              en sus dos extremos. Aquí un extremo está libre: en el
              empotramiento, $|M| = qL\cdot L/2 = qL^{2}/2$.
        pista: |
          El flector en el empotramiento, por la derecha: la carga $qL$ con
          su resultante a $L/2$, y la fibra traccionada es la de arriba.
          Después, $v_{,xx} = -M/(EI_z)$ (ec. 10.14, p. 7).
        desarrollo: |
          $M(0) = -qL^{2}/2 = -10\ \text{kN/m}\cdot(2\ \text{m})^{2}/2 = -20\ \text{kN·m}$, y

          $$
          v_{,xx} = -\frac{M}{EI_z} = -\frac{-20\ \text{kN·m}}{5000\ \text{kN·m}^{2}} = 0{,}004\ \text{m}^{-1}
          $$

          Positiva con $y$ hacia abajo: la flecha crece cada vez más deprisa
          al alejarse del empotramiento.
      - tipo: calcular
        titulo: La flecha del extremo libre, integrando la ecuación
        pregunta: |
          Integra dos veces la ecuación aproximada en el mismo voladizo, con
          las condiciones del empotramiento. ¿Cuánto vale la flecha del
          extremo libre, $v(L)$, en mm?
        respuesta:
          tipo: numero
          valor: '4.0'
          tolerancia: 0.02
          formato: un número, en mm (positivo hacia abajo)
        distractores:
          - valor: '10.67'
            mensaje: |
              Es $PL^{3}/(3EI_z)$ con $P = qL$, la flecha de una carga puntual
              en la punta. Repartida, la carga está más cerca del
              empotramiento y flecta menos: $qL^{4}/(8EI_z)$.
          - valor: '0.417'
            mensaje: |
              Es $5qL^{4}/(384EI_z)$, la flecha central de una viga apoyada
              en sus dos extremos. Aquí las condiciones son otras: las dos en
              el empotramiento.
          - valor: '1.333'
            mensaje: |
              Has puesto $v = 0$ y $v_{,x} = 0$ en el extremo libre, con $x$
              medida desde él: eso da la flecha del empotramiento respecto
              de la punta. Las dos condiciones son del empotramiento, en
              $x = L$; con ellas las constantes ya no son nulas y la flecha
              de la punta sale $qL^{4}/(8EI_z)$, no $qL^{4}/(24EI_z)$.
        pista: |
          Con $x$ desde el empotramiento, $M = -q(L - x)^{2}/2$. Integra
          $EI_z v_{,xx} = q(L - x)^{2}/2$ dos veces y anula $v$ y $v_{,x}$ en
          $x = 0$.
        desarrollo: |
          $$
          EI_z\,v_{,x} = -\frac{q(L - x)^{3}}{6} + C_1,\qquad
          EI_z\,v = \frac{q(L - x)^{4}}{24} + C_1x + C_2
          $$

          $v_{,x}(0) = 0$ da $C_1 = qL^{3}/6$ y $v(0) = 0$ da
          $C_2 = -qL^{4}/24$. En $x = L$:

          $$
          v(L) = \frac{1}{EI_z}\left(\frac{qL^{4}}{6} - \frac{qL^{4}}{24}\right) = \frac{qL^{4}}{8EI_z} = \frac{10\cdot2^{4}}{8\cdot5000}\ \text{m} = 0{,}004\ \text{m}
          $$

          Son 4,0 mm hacia abajo.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la ecuación diferencial de la curva elástica deduciéndola,
          como se pide en el examen, con el dibujo de la rebanada y el
          porqué de su signo.
        rubrica: ecuacion-diferencial-de-la-elastica
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Las secciones siguen planas: $\varepsilon_x = y/\rho$ y, con
              Hooke, $\sigma_x = Ey/\rho$.
          - texto: >-
              Con $\sigma_x = My/I_z$ se llega a $1/\rho = M/(EI_z)$.
          - texto: >-
              La fibra neutra no se alarga, $\rho\,d\theta = dx$, y la
              curvatura es $d\theta/dx$.
          - texto: >-
              Con $y$ hacia abajo y $M > 0$, el giro disminuye al avanzar en
              $x$, y $d\theta/dx = -M/(EI_z)$.
          - texto: >-
              Con giros pequeños, $\theta = v_{,x}$, y queda
              $v_{,xx} = -M/(EI_z)$, que se integra con las condiciones de
              los apoyos.
          - texto: >-
              Con $y$ hacia abajo, un flector positivo hace crecer el giro al
              avanzar en $x$, y $d\theta/dx = +M/(EI_z)$.
            trampa: true
            mensaje: |
              Es al revés. Con $M > 0$ la rebanada se comba con la concavidad
              hacia arriba, hacia $-y$, y el radio $ON'$ forma el ángulo
              $\theta - d\theta$ (figura 10.3, p. 6): el giro disminuye y,
              con estos ejes, la curvatura es negativa.
    resolucion: |
      Los ejes son los del curso: $x$ a lo largo de la viga, $y$ hacia abajo,
      y el flector positivo si tracciona la fibra de abajo (apuntes del tema
      10, pp. 4-8).

      **Lo que impone el flector.** En flexión las secciones siguen planas y
      perpendiculares a la fibra neutra deformada. Una rebanada de longitud
      $dx$ se curva con radio $\rho$, y la fibra a distancia $y$ de la neutra
      se alarga y se tensa (ecs. 10.1 y 10.2):

      $$
      \varepsilon_x = \frac{y}{\rho},\qquad \sigma_x = E\,\frac{y}{\rho}
      $$

      Con la tensión de flexión, $\sigma_x = My/I_z$ (ec. 10.3), queda la
      curvatura que pide el flector (ec. 10.4):

      $$
      \frac{1}{\rho} = \frac{M}{EI_z}
      $$

      **Lo que dice la geometría.** La fibra neutra no cambia de longitud: si
      su tangente gira $d\theta$ en la rebanada, $\rho\,d\theta = dx$, y la
      curvatura es $d\theta/dx$ (ecs. 10.7 a 10.9).

      **El signo.** Con $y$ hacia abajo, un flector positivo comba la
      rebanada con la concavidad hacia arriba, y el ángulo de la tangente
      pasa de $\theta$ a $\theta - d\theta$ al avanzar (figura 10.3, p. 6).
      Por eso (ec. 10.10):

      $$
      \frac{d\theta}{dx} = -\frac{M}{EI_z}
      $$

      **La exacta y la aproximada.** En la rebanada deformada,
      $\sin\theta = v_{,x}$ y $\cos\theta = 1 + u_{,x}$ (ec. 10.11), y la
      ecuación exacta es (ec. 10.12)

      $$
      \frac{v_{,xx}}{\sqrt{1 - v_{,x}^{2}}} = -\frac{M}{EI_z}
      $$

      Con giros pequeños, $\theta = v_{,x}$ y $u_{,x} = 0$ (ec. 10.13), y
      queda la **ecuación diferencial de la elástica** (ec. 10.14, p. 7):

      $$
      v_{,xx} = \frac{d^{2}v}{dx^{2}} = -\frac{M}{EI_z}
      $$

      Vale en flexión en un plano principal, con giros pequeños y en vigas
      esbeltas, en las que la cortante apenas añade flecha. Integrada una
      vez da el giro y dos veces la flecha; las dos constantes se fijan con
      las condiciones de los apoyos (p. 8).

      **Un ejemplo (nuestro).** Un voladizo de 2 m empotrado en $x = 0$, con
      $q = 10$ kN/m en toda su longitud y $EI_z = 5000$ kN·m². El flector,
      $M = -q(L - x)^{2}/2$, vale $-20$ kN·m en el empotramiento, donde la
      curvatura es $v_{,xx} = 0{,}004$ m⁻¹. Integrando dos veces con
      $v(0) = v_{,x}(0) = 0$:

      $$
      v(x) = \frac{q}{24EI_z}\left[(L - x)^{4} + 4L^{3}x - L^{4}\right],\qquad
      v(L) = \frac{qL^{4}}{8EI_z} = 4{,}0\ \text{mm}
      $$

      **Comprobaciones.** El motor del curso (la elástica de un voladizo con
      carga uniforme) da la misma flecha, 4,0 mm, y la misma curvatura en el
      empotramiento derivando su giro; integrando dos veces $-M/(EI_z)$ con
      la regla de Simpson sale también 4,0 mm.

  # ── Teoría · cuestión 4 (impresa «3.») · el torsor máximo del tubo cuadrado.
  - id: exerm1819-ext-4-el-torsor-maximo-del-tubo-cuadrado
    titulo: El torsor máximo de un voladizo de sección cuadrada hueca, por resistencia y por giro
    fuente: >-
      Cuestión 4 de teoría, impresa «3.» en el castellano (el euskera la
      numera 4) · Extraordinaria del 21 de junio de 2019 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 12 (pp. 11-14)
      y del tema 6 (p. 4).
    nivel: examen
    enunciado: |
      3. (1p) Determinar el momento torsor máximo que se puede aplicar en el
      extremo de una viga en voladizo de 1m de longitud con la sección de
      espesor $e$ de la figura, para que cumpla el criterio de tensión
      principal máxima y que el ángulo girado máximo sea de 1º.

      $\sigma_{on,adm}$=300MPa, $G$=80700 MPa

      $$
      \tau = \frac{M_t}{2A_t t}\qquad\qquad I_t = \frac{4A_t^{2}}{\int_L \frac{ds}{t}}
      $$

      <figure class="figura-examen">
      <svg viewBox="0 0 280 222" role="img" width="280" height="222" aria-labelledby="exerm1819-ext-4-el-torsor-maximo-del-tubo-cuadrado-fig-t exerm1819-ext-4-el-torsor-maximo-del-tubo-cuadrado-fig-d">
      <title id="exerm1819-ext-4-el-torsor-maximo-del-tubo-cuadrado-fig-t">La sección del voladizo: un cuadrado hueco de pared delgada</title>
      <desc id="exerm1819-ext-4-el-torsor-maximo-del-tubo-cuadrado-fig-d">Un cuadrado hueco, con la pared sombreada en gris y el hueco blanco, de espesor uniforme. Arriba, una cota de 20 mm cuyas líneas de referencia arrancan de las caras exteriores izquierda y derecha; a la derecha, otra cota de 20 mm, de la cara exterior de arriba a la de abajo. Debajo, el rótulo e =2 mm.</desc>
      <rect x="46" y="50" width="130" height="130" fill="var(--faint)" fill-opacity=".45" stroke="var(--ink)" stroke-width="1.3"/>
      <rect x="59" y="63" width="104" height="104" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
      <line x1="46" y1="24" x2="46" y2="47" stroke="var(--faint)" stroke-width="0.7"/>
      <line x1="176" y1="24" x2="176" y2="47" stroke="var(--faint)" stroke-width="0.7"/>
      <line x1="46" y1="30" x2="176" y2="30" stroke="var(--ink)" stroke-width="1"/><polygon points="176,30 169,32.6 169,27.4" fill="var(--ink)"/><polygon points="46,30 53,27.4 53,32.6" fill="var(--ink)"/>
      <text x="111" y="23" font-size="14" fill="var(--ink)" text-anchor="middle">20 mm</text>
      <line x1="179" y1="50" x2="208" y2="50" stroke="var(--faint)" stroke-width="0.7"/>
      <line x1="179" y1="180" x2="208" y2="180" stroke="var(--faint)" stroke-width="0.7"/>
      <line x1="202" y1="50" x2="202" y2="180" stroke="var(--ink)" stroke-width="1"/><polygon points="202,180 199.4,173 204.6,173" fill="var(--ink)"/><polygon points="202,50 204.6,57 199.4,57" fill="var(--ink)"/>
      <text x="210" y="120" font-size="14" fill="var(--ink)">20 mm</text>
      <text x="111" y="210" font-size="14" fill="var(--ink)" text-anchor="middle"><tspan font-style="italic">e</tspan> =2 mm</text>
      </svg>
      <figcaption>

      Redibujada del PDF del examen, que el Word original reproduce igual.
      El espesor guarda la proporción del original, 2 de 20.

      </figcaption>
      </figure>

      **Notas nuestras.** Las dos cotas de 20 mm van, en la figura, hasta
      las caras exteriores del tubo. $\sigma_{on,adm}$ es la tensión
      admisible del criterio, y el ángulo girado es el del extremo libre
      respecto del empotramiento. Las dos fórmulas van impresas junto a los
      datos, tal cual. El número impreso, «3.», es una errata: es la cuarta
      cuestión, y el euskera la numera 4.
    pide: >-
      El mayor momento torsor que cumple a la vez el criterio de tensión
      principal máxima y el giro de 1°, en N·m.
    pasos:
      - tipo: reconocer
        pregunta: |
          En la fórmula impresa $\tau = M_t/(2A_t t)$, ¿qué área es $A_t$ en
          este tubo?
        opciones:
          - texto: >-
              La encerrada por la línea media de la pared, un cuadrado de
              $20 - 2 = 18$ mm de lado
            correcta: true
            mensaje: |
              Eso es (ec. 12.24, p. 12). El flujo $\tau t$ es uniforme y
              circula por la línea media; $A_t$ es el área que encierra, ni
              la exterior ni la del hueco.
          - texto: >-
              La exterior, $20 \times 20$ mm, que es la que dan las cotas
            mensaje: |
              Las cotas van hasta las caras exteriores, pero el momento del
              flujo se toma con su brazo hasta la línea media de la pared,
              a medio espesor. Con 20 mm el área sale un 23 % mayor, y el
              torsor también.
          - texto: >-
              La del material, $20^{2} - 16^{2}$ mm², que es lo que resiste
            mensaje: |
              Esa es el área de la sección, la que daría el axil. En Bredt
              $A_t$ es el área **encerrada** por la línea media, hueco
              incluido: el torsor es el flujo por el doble de esa área
              (ec. 12.23).
      - tipo: reconocer
        pregunta: |
          El tubo trabaja a torsión pura. ¿Cuánto vale la tensión principal
          máxima en un punto de la pared, en función de la tangencial $\tau$?
        opciones:
          - texto: >-
              $\sigma_1 = \tau$, con $\sigma_3 = -\tau$ a 90°; las principales
              forman 45° con el eje del tubo
            correcta: true
            mensaje: |
              Eso es: es cortadura pura, cuyo círculo de Mohr tiene centro
              en 0 y radio $\tau$ (tema 2, ec. 2.68). El criterio de tensión
              principal máxima (ecs. 6.3 a 6.5, p. 4) pide entonces
              $\tau \le \sigma_{on,adm}$.
          - texto: >-
              $\sigma_1 = 2\tau$, porque la tangencial máxima es la mitad de
              la diferencia de principales
            mensaje: |
              $\tau_{max} = (\sigma_1 - \sigma_3)/2$, y en cortadura pura
              $\sigma_3 = -\sigma_1$: de ahí $\sigma_1 = \tau$, no $2\tau$.
          - texto: >-
              $\sigma_1 = 0$: en torsión no hay tensiones normales
            mensaje: |
              No las hay en los planos de la sección, pero en planos a 45°
              sí: la tracción y la compresión de la cortadura pura son las
              que rompen a 45° una tiza retorcida.
      - tipo: calcular
        titulo: El área encerrada
        pregunta: |
          ¿Cuánto vale $A_t$, en mm²?
        respuesta:
          tipo: numero
          valor: '324'
          tolerancia: 0.5
          formato: un número, en mm²
        distractores:
          - valor: '400'
            mensaje: |
              Es el cuadrado exterior, $20 \times 20$. El flujo va por la
              línea media, a 1 mm de cada cara: su lado es 18 mm.
          - valor: '256'
            mensaje: |
              Es el hueco, $16 \times 16$. La línea media está a medio
              espesor, entre la cara de dentro y la de fuera: 18 mm de lado.
        pista: |
          La línea media está a $e/2 = 1$ mm de cada cara: el cuadrado que
          encierra tiene $20 - e$ de lado.
        desarrollo: |
          $$
          A_t = (20 - 2)^{2}\ \text{mm}^{2} = 324\ \text{mm}^{2}
          $$
      - tipo: calcular
        titulo: El torsor que aguanta la tensión
        pregunta: |
          Solo con el criterio de tensión principal máxima, ¿qué torsor
          máximo admite el tubo, en N·m?
        respuesta:
          tipo: numero
          valor: '388.8'
          tolerancia: 0.5
          formato: un número, en N·m
        distractores:
          - valor: '480'
            mensaje: |
              Has tomado $A_t$ exterior, $400$ mm². El área de Bredt es la de
              la línea media, $324$ mm².
          - valor: '307.2'
            mensaje: |
              Has tomado $A_t$ del hueco, $256$ mm². El área de Bredt es la
              de la línea media, $324$ mm².
          - valor: '194.4'
            mensaje: |
              Has limitado $\tau$ a $\sigma_{on,adm}/2$, que es Tresca. El
              criterio pedido es el de la tensión principal máxima, y en
              cortadura pura $\sigma_1 = \tau$: $\tau \le 300$ MPa.
        pista: |
          $\sigma_1 = \tau = M_t/(2A_t t) \le 300$ MPa, con $t = e = 2$ mm
          igual en toda la pared.
        desarrollo: |
          $$
          M_t = 2A_t\,t\,\sigma_{on,adm} = 2\cdot324\ \text{mm}^{2}\cdot2\ \text{mm}\cdot300\ \text{MPa} = 388\,800\ \text{N·mm}
          $$

          Son 388,8 N·m.
      - tipo: calcular
        titulo: El módulo de torsión
        pregunta: |
          ¿Cuánto vale $I_t$, en mm⁴?
        respuesta:
          tipo: numero
          valor: '11664'
          tolerancia: 2
          formato: un número, en mm⁴
        distractores:
          - valor: '16000'
            mensaje: |
              Has hecho la cuenta con el cuadrado exterior, de 20 mm de lado,
              en $A_t$ y en la longitud de la línea media. Las dos son de la
              línea media: $A_t = 324$ mm² y $\int_L ds = 72$ mm.
          - valor: '2916'
            mensaje: |
              Has multiplicado por el espesor en lugar de dividir. El
              denominador es $\int_L ds/t = 72/2 = 36$, no $72\cdot2 = 144$.
          - valor: '10497.6'
            mensaje: |
              Has mezclado: $A_t$ de la línea media, pero la longitud del
              perímetro exterior, 80 mm. Las dos van por la línea media:
              $\int_L ds = 4\cdot18 = 72$ mm.
        pista: |
          Con espesor uniforme, $\int_L ds/t$ es el perímetro de la línea
          media entre el espesor (ec. 12.29, p. 14).
        desarrollo: |
          $\int_L ds/t = 4\cdot18/2 = 36$ y

          $$
          I_t = \frac{4A_t^{2}}{\int_L ds/t} = \frac{4\cdot324^{2}}{36}\ \text{mm}^{4} = 11\,664\ \text{mm}^{4}
          $$
      - tipo: calcular
        titulo: El torsor máximo
        pregunta: |
          Con las dos condiciones a la vez, ¿cuál es el momento torsor
          máximo, en N·m?
        respuesta:
          tipo: numero
          valor: '16.43'
          tolerancia: 0.02
          formato: un número, en N·m
        distractores:
          - valor: '388.8'
            mensaje: |
              Es el de la tensión, pero con él el extremo giraría casi
              24°. Mandan las dos condiciones a la vez: el torsor admisible
              es el **menor** de los dos, y aquí manda el giro.
          - valor: '941.3'
            mensaje: |
              Has puesto el giro como 1, en grados. En
              $\varphi = M_tL/(GI_t)$ el ángulo va en radianes:
              $1^{\circ} = \pi/180 = 0{,}017453$ rad.
          - valor: '22.54'
            mensaje: |
              Es el giro con el cuadrado exterior, $I_t = 16\,000$ mm⁴. El
              módulo de torsión es el de la línea media, 11 664 mm⁴.
        pista: |
          El giro del extremo es $\varphi = M_tL/(GI_t)$ (ec. 12.29, p. 14),
          con $\varphi$ en radianes y $L = 1000$ mm. Compara el torsor que da
          con el de la tensión y quédate con el que cumple las dos.
        desarrollo: |
          $$
          M_t = \frac{GI_t\,\varphi}{L} = \frac{80\,700\ \text{MPa}\cdot11\,664\ \text{mm}^{4}\cdot0{,}017453}{1000\ \text{mm}} = 16\,429\ \text{N·mm}
          $$

          Son 16,43 N·m, mucho menos que los 388,8 N·m de la tensión: manda
          el giro. Con ese torsor, $\tau = 16\,429/(2\cdot324\cdot2) = 12{,}68$
          MPa.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La línea media es un cuadrado de 18 mm: $A_t = 324$ mm² y
              $\int_L ds/t = 36$.
          - texto: >-
              En cortadura pura $\sigma_1 = \tau$, y el criterio da
              $\tau = M_t/(2A_t t) \le 300$ MPa, o sea $M_t \le 388{,}8$ N·m.
          - texto: >-
              $I_t = 4A_t^{2}/\int_L (ds/t) = 11\,664$ mm⁴.
          - texto: >-
              El giro de 1°, en radianes, da $M_t \le GI_t\varphi/L = 16{,}43$
              N·m.
          - texto: >-
              Se cumplen las dos con el menor: $M_{t,max} = 16{,}43$ N·m.
          - texto: >-
              Como manda el criterio de resistencia, el torsor máximo es el
              mayor de los dos, 388,8 N·m.
            trampa: true
            mensaje: |
              Con 388,8 N·m la tensión llega justo a 300 MPa, pero el
              extremo gira casi 24°, mucho más que 1°. El torsor tiene que
              cumplir las dos condiciones: es el menor de los dos.
    resolucion: |
      **La sección.** Es un tubo cerrado de pared delgada y espesor uniforme
      $t = e = 2$ mm. Las cotas de 20 mm van a las caras exteriores, así que
      la línea media es un cuadrado de 18 mm de lado:

      $$
      A_t = 18^{2}\ \text{mm}^{2} = 324\ \text{mm}^{2},\qquad \int_L \frac{ds}{t} = \frac{4\cdot18}{2} = 36
      $$

      **La condición de resistencia.** El flujo $\tau t$ es uniforme y
      $M_t = 2A_t\,\tau t$ (Bredt, ecs. 12.21 a 12.24, pp. 11-12). La
      pared está en cortadura pura: las principales son $\sigma_1 = \tau$,
      $\sigma_2 = 0$ y $\sigma_3 = -\tau$, a 45° del eje. El criterio de la
      tensión principal máxima (ecs. 6.3 a 6.5, p. 4) pide
      $\tau \le \sigma_{on,adm}$:

      $$
      M_t \le 2A_t\,t\,\sigma_{on,adm} = 2\cdot324\cdot2\cdot300\ \text{N·mm} = 388{,}8\ \text{N·m}
      $$

      **La condición de rigidez.** El módulo de torsión de la sección cerrada
      (ec. 12.29, p. 14) es

      $$
      I_t = \frac{4A_t^{2}}{\int_L ds/t} = \frac{4\cdot324^{2}}{36}\ \text{mm}^{4} = 11\,664\ \text{mm}^{4}
      $$

      En el voladizo el torsor es el mismo en toda la longitud, y el giro
      del extremo es $\varphi = M_tL/(GI_t)$. Con $\varphi = 1^{\circ} = 0{,}017453$
      rad y $L = 1000$ mm:

      $$
      M_t \le \frac{GI_t\,\varphi}{L} = \frac{80\,700\cdot11\,664\cdot0{,}017453}{1000}\ \text{N·mm} = 16{,}43\ \text{N·m}
      $$

      **El torsor máximo** es el que cumple las dos, el menor:

      $$
      M_{t,max} = 16{,}43\ \text{N·m}
      $$

      Manda el giro, y por mucho: con ese torsor la tensión es
      $\tau = 12{,}68$ MPa, un 4 % de la admisible. Es lo normal en un tubo
      tan pequeño y tan largo: el giro admisible se agota mucho antes que el
      material.

      **Comprobaciones.** El motor del curso (Bredt para la sección cerrada
      de una celda, el tensor de cortadura pura con sus principales y el
      criterio de la tensión principal máxima) da lo mismo que las fórmulas
      impresas: $A_t = 324$ mm², $I_t = 11\,664$ mm⁴, 388,8 y 16,43 N·m, y
      con $M_t = 16{,}43$ N·m el giro sale exactamente 1°.

  # ── Problema 1 · tensión plana con la galga a 45°.
  - id: exerm1819-ext-5-tension-plana-con-la-galga-a-45-grados
    titulo: Tensión plana con una galga a 45°, sus tensiones y deformaciones principales y el plano normal a la galga
    fuente: >-
      Problema 1 · Extraordinaria del 21 de junio de 2019 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 1,5 puntos. El examen no publica resolución; el
      desarrollo es nuestro, con los convenios del curso, y cada cifra está
      comprobada por dos caminos.
    nivel: examen
    enunciado: |
      1. (1,5p) En el estado de tensión plana de la figura $\sigma_x$,
      $\tau_{xy}$ y $\varepsilon_a$ son conocidas. Determinar:

      a/ Tensiones y direcciones principales.

      b/ Si $\sigma_y$ = 82,9 MPa, las deformaciones principales.

      c/ Tensión normal y cortante en el plano perpendicular a la dirección
      $a$, indicando los sentidos.

      $E$ = 70 GPa; $\nu$ = 0,3; $\sigma_x$ = 20 MPa; $\tau_{xy}$ = 10 MPa;
      $\varepsilon_a$ = 7·10⁻⁴

