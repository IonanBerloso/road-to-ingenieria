      **Notas nuestras.** A es un apoyo fijo y B uno móvil; de B a C la
      viga vuela, y la carga $q_0$ ocupa toda su longitud, de A a C. Las dos
      cotas de 2 cm son los espesores de las alas, y la de 10 cm, el ancho
      total de la sección. Los ejes de la sección son los del curso: $y$
