      **Notas nuestras.** A es un empotramiento y C un apoyo móvil; la
      carga $q_0$ va de A a B, y $P$ actúa hacia abajo en el extremo libre
      D. $EI_z$ = 4 MN·m² son 4000 kN·m².
    pide: >-
      La reacción en el apoyo C.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántas incógnitas sobran, y qué condición falta para
          calcularlas?
        opciones:
          - texto: >-
              Una: quitando el apoyo C queda un voladizo isostático, y la
              condición es que la flecha de C sea Δ hacia abajo
            correcta: true
            mensaje: |
              Eso es (tema 11, pp. 3-5, y figura 11.2). $R_C$ es la incógnita
              hiperestática, y el enlace que se quita no da flecha nula,
              sino la del asiento.
          - texto: >-
              Una, con la condición $v_C = 0$, porque en C hay un apoyo
            mensaje: |
              Lo sería con el apoyo en su sitio. Aquí el apoyo baja Δ y la
              viga baja con él: $v_C = \Delta$. Con $v_C = 0$ sale la
              reacción sin asiento, que es mayor.
          - texto: >-
              Ninguna: el asiento se reparte entre A y C, y la viga es
              isostática
            mensaje: |
              El empotramiento da tres reacciones y C una más: cuatro
              incógnitas y tres ecuaciones. El asiento no quita incógnitas;
              cambia la condición que se impone.
      - tipo: calcular
        titulo: La flecha de C en el voladizo, con las cargas
        pregunta: |
          Sin el apoyo C, ¿cuánto bajaría C con $q_0$ y $P$, en mm?
        respuesta:
          tipo: numero
          valor: '43.94'
          tolerancia: 0.05
          formato: un número, en mm (hacia abajo)
        distractores:
          - valor: '37.19'
            mensaje: |
              Has tomado, para $q_0$, la flecha de B, $q_0(3a)^{4}/(8EI_z)$.
              De B a C la viga no tiene carga y sigue recta, pero inclinada:
              hay que sumar el giro de B por la distancia BC.
          - valor: '53.19'
            mensaje: |
              Has tomado, para $P$, la flecha de D, $P(5a)^{3}/(3EI_z)$. La
              que hace falta es la de C, a $4a$ del empotramiento.
        pista: |
          Superpón las dos cargas en el voladizo AD. Más allá del final de
          una carga, la viga sigue recta con el giro que tenía allí; para
          $P$ en $L = 5a$, la flecha a una distancia $x$ es
          $Px^{2}(3L - x)/(6EI_z)$.
        desarrollo: |
          La carga $q_0$ en $3a$: en B, $v_B = q_0(3a)^{4}/(8EI_z) = 15{,}19$
          mm y $\theta_B = q_0(3a)^{3}/(6EI_z) = 0{,}00675$ rad; en C,
          $v_B + \theta_B\,a = 15{,}19\ \text{mm} + 6{,}75\ \text{mm} = 21{,}94\ \text{mm}$.
          La carga $P$ en D, con $x = 4a$ y $L = 5a$:

          $$
          v_C = \frac{Px^{2}(3L - x)}{6EI_z} = \frac{3\cdot4^{2}\cdot11}{6\cdot4000}\ \text{m} = 0{,}022\ \text{m}
          $$

          En total, $21{,}94\ \text{mm} + 22{,}00\ \text{mm} = 43{,}94\ \text{mm}$.
      - tipo: calcular
        titulo: La flecha de C por cada kN de reacción
        pregunta: |
          ¿Cuánto sube C, en el voladizo, por cada kN de fuerza hacia arriba
          aplicada en C, en mm/kN?
        respuesta:
          tipo: numero
          valor: '5.333'
          tolerancia: 0.005
          formato: un número, en mm por kN
        distractores:
          - valor: '2.667'
            mensaje: |
              Es $(4a)^{3}/(6EI_z)$. La flecha de la punta de un voladizo con
              una carga en ella es $PL^{3}/(3EI_z)$: un tercio, no un sexto.
          - valor: '10.417'
            mensaje: |
              Has tomado la longitud entera, $5a$. La fuerza está en C, a
              $4a$ del empotramiento, y lo que importa es la flecha de C.
        pista: |
          Para C, la fuerza está en la punta de un voladizo de longitud
          $4a$.
        desarrollo: |
          $$
          \delta_{CC} = \frac{(4a)^{3}}{3EI_z} = \frac{64\ \text{m}^{3}}{3\cdot4000\ \text{kN·m}^{2}} = 0{,}005333\ \text{m/kN}
          $$

          Son 5,333 mm por kN.
      - tipo: calcular
        titulo: La reacción en C
        pregunta: |
          ¿Cuánto vale la reacción en C, en kN (positiva hacia arriba)?
        respuesta:
          tipo: numero
          valor: '7.113'
          tolerancia: 0.005
          formato: un número, en kN
        distractores:
          - valor: '8.238'
            mensaje: |
              Es la reacción con $v_C = 0$, sin el asiento. El apoyo baja 6 mm:
              la reacción tiene que subir C solo hasta 6 mm por debajo,
              $R_C\,\delta_{CC} = 43{,}94 - 6$ mm. También sale 8,24 si has
              tomado $EI_z = 4$ kN·m²: las flechas salen mil veces mayores y
              el asiento deja de contar. Son 4 MN·m² = 4000 kN·m².
          - valor: '9.363'
            mensaje: |
              El asiento con el signo cambiado: has impuesto que C quede 6 mm
              por encima. El apoyo desciende, y la viga baja con él: el
              asiento **reduce** la reacción.
          - valor: '5.848'
            mensaje: |
              En la flecha de las cargas falta el giro de B por la distancia
              BC: la flecha de $q_0$ en C es 21,94 mm, no la de B, 15,19 mm.
          - valor: '8.848'
            mensaje: |
              En la flecha de las cargas has puesto la de $P$ en D, 31,25 mm,
              y no en C, 22 mm.
          - valor: '10.5'
            mensaje: |
              Has tomado momentos respecto de A como si A fuera una
              articulación. El empotramiento da un momento que no se conoce:
              por eso hace falta la condición de la flecha.
        pista: |
          Compatibilidad en C: lo que baja C por las cargas menos lo que
          sube por $R_C$ es el asiento, $43{,}94 - 5{,}333R_C = 6$ (mm).
        desarrollo: |
          $$
          R_C = \frac{43{,}94\ \text{mm} - 6\ \text{mm}}{5{,}333\ \text{mm/kN}} = 7{,}113\ \text{kN}
          $$
      - tipo: calcular
        titulo: El momento del empotramiento
        pregunta: |
          ¿Cuánto vale el flector en A, en kN·m, con el signo del curso
          (positivo si tracciona la fibra de abajo)?
        respuesta:
          tipo: numero
          valor: '-13.55'
          tolerancia: 0.01
          formato: un número con su signo, en kN·m
        distractores:
          - valor: '-42'
            mensaje: |
              Es el flector sin la reacción de C. $R_C = 7{,}113$ kN, a $4a$
              de A, quita $28{,}45$ kN·m.
          - valor: '13.55'
            mensaje: |
              El valor es ese y el signo no: las cargas hacen colgar la viga
              del empotramiento, que tracciona la fibra de arriba. Negativo.
        pista: |
          Corta en A y toma momentos de todo lo que queda a la derecha:
          $q_0$, $P$ y $R_C$.
        desarrollo: |
          $$
          M_A = -(18\cdot1{,}5 + 3\cdot5 - 7{,}113\cdot4)\ \text{kN·m} = -13{,}55\ \text{kN·m}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Grado 1: se quita el apoyo C y $R_C$ es la incógnita; queda un
              voladizo.
          - texto: >-
              Con las cargas, C bajaría $21{,}94 + 22{,}00 = 43{,}94$ mm.
          - texto: >-
              Una fuerza unidad en C lo sube $(4a)^{3}/(3EI_z) = 5{,}333$
              mm/kN.
          - texto: >-
              Compatibilidad: $43{,}94 - 5{,}333R_C = 6$ mm, y
              $R_C = 7{,}113$ kN.
          - texto: >-
              El equilibrio da $R_A = 13{,}89$ kN y $M_A = -13{,}55$ kN·m.
          - texto: >-
              Compatibilidad: la flecha en C es nula, porque en C hay un
              apoyo.
            trampa: true
            mensaje: |
              El apoyo ha bajado Δ = 6 mm, y la viga, que sigue apoyada en
              él, baja lo mismo: $v_C = \Delta$. Con $v_C = 0$ sale
              $R_C = 8{,}24$ kN, la reacción sin asiento.
    resolucion: |
      **La hiperestaticidad.** El empotramiento da tres reacciones y C una:
      una más que ecuaciones. Se quita el apoyo C y su reacción $R_C$ (hacia
      arriba) pasa a ser la incógnita; queda un voladizo de $5a$ empotrado
      en A (tema 11, pp. 3-5). La condición es la del enlace quitado, con su
      asiento: **la flecha de C es $\Delta = 6$ mm hacia abajo**.

      **La flecha de C con las cargas** (positiva hacia abajo, integrando la
      elástica del voladizo, tema 10):

      - $q_0$ de A a B: en B, $v_B = q_0(3a)^{4}/(8EI_z) = 15{,}19$ mm y
        $\theta_B = q_0(3a)^{3}/(6EI_z) = 0{,}00675$ rad. De B a C no hay
        carga y la viga sigue recta: $v_C = 15{,}19 + 0{,}00675\cdot1000 = 21{,}94$ mm.
      - $P$ en D: $v_C = Px^{2}(3L - x)/(6EI_z)$ con $x = 4a$ y $L = 5a$,
        22,00 mm.

      En total, $\delta_{C0} = 43{,}94$ mm.

      **La flecha de C por $R_C$.** Una fuerza unidad hacia arriba en C, a
      $4a$ del empotramiento, la sube
      $\delta_{CC} = (4a)^{3}/(3EI_z) = 5{,}333$ mm/kN.

      **La compatibilidad.**

      $$
      \delta_{C0} - R_C\,\delta_{CC} = \Delta
      \quad\Rightarrow\quad
      R_C = \frac{43{,}94 - 6}{5{,}333}\ \text{kN} = 7{,}113\ \text{kN}
      $$

      hacia arriba. Sin el asiento serían 8,24 kN: al bajar, el apoyo se
      descarga y el empotramiento recoge la diferencia.

      **El resto, por equilibrio.** $R_A = 18 + 3 - 7{,}113 = 13{,}89$ kN
      hacia arriba, y en A, $M_A = -(27 + 15 - 28{,}45) = -13{,}55$ kN·m,
      que tracciona la fibra de arriba. En C el flector es
      $M_C = -Pa = -3$ kN·m.

      **Comprobaciones.** El motor del curso resuelve la viga de dos maneras:
      integrando la elástica con el empotramiento y el apoyo con su asiento,
      y por el método de las redundantes sobre el voladizo. Las dos dan
      $R_C = 7{,}113$ kN, y la flecha de C sale exactamente 6 mm; las
      flechas por separado coinciden con las fórmulas del voladizo.

  # ── Problema 4 · el pórtico ABCD articulado en A y en D.
  - id: exerm1819-ext-8-el-portico-abcd-articulado-en-a-y-en-d
    titulo: El pórtico ABCD con dos apoyos fijos a distinta altura, sus reacciones y el giro de C, por energía
    fuente: >-
      Problema 4 · Extraordinaria del 21 de junio de 2019 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 1,5 puntos. El examen no publica resolución; el
