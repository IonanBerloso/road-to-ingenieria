      **Notas nuestras.** A y D son apoyos fijos (articulaciones); AB mide
      $2b$, BC $2b$ y CD $b$, así que D queda a la altura $b$ sobre A. La
      carga $q_0$ es vertical, hacia abajo, en todo BC, y los nudos B y C
      son rígidos.
    pide: >-
      a/ Las reacciones en A y en D, en función de q0 y b. b/ El ángulo
      girado en C, en función de q0, b y EIz.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se plantea el apartado a?
        opciones:
          - texto: >-
              Es hiperestático de grado 1: se toma como incógnita la
              reacción horizontal de D, se deja la base con A fijo y D sobre
              un apoyo móvil, libre en horizontal (solo reacción vertical), y
              se impone que la derivada de la coenergía de flexión respecto
              de ella sea nula
            correcta: true
            mensaje: |
              Eso es: Menabrea (ec. 13.52, tema 13, p. 19). Dos apoyos fijos
              dan cuatro reacciones para tres ecuaciones, y la derivada de la
              coenergía respecto de la reacción horizontal de D es el
              desplazamiento horizontal de D, que es nulo.
          - texto: >-
              Es isostático: con cargas verticales, las reacciones
              horizontales son nulas y las verticales salen de dos
              ecuaciones
            mensaje: |
              Con cargas verticales, la suma de horizontales da
              $A_x = -D_x$, pero no su valor. El pórtico quiere abrir las
              patas y los apoyos fijos no le dejan: hace falta una condición
              de deformación.
          - texto: >-
              Es hiperestático de grado 1, y la condición es que el giro de
              C sea nulo
            mensaje: |
              C es un nudo rígido, no un empotramiento: gira, y ese giro es
              lo que pide el apartado b. La condición está en el enlace que
              se libera: si es la horizontal de D, su desplazamiento
              horizontal es nulo.
      - tipo: calcular
        titulo: La flexibilidad de la incógnita
        pregunta: |
          Con una fuerza horizontal unidad en D sobre la base isostática,
          ¿cuánto vale $\int m^{2}\,dl$, en unidades de $b^{3}$?
        respuesta:
          tipo: numero
          valor: '7.667'
          tolerancia: 0.005
          formato: un número, el coeficiente de b³
        distractores:
          - valor: '7.333'
            mensaje: |
              Te falta el pilar CD. La fuerza en D lo flecta, con
              $m = t$ desde D, y aporta $b^{3}/3$.
          - valor: '4.667'
            mensaje: |
              Solo has contado el dintel BC. Los dos pilares también se
              flectan con la fuerza de D: AB aporta $8b^{3}/3$ y CD,
              $b^{3}/3$.
        pista: |
          Con la fuerza unidad en D, las reacciones de la base son
          $A_x = -1$ y $A_y = -D_y = -\tfrac12$. El flector vale $s$ en AB
          (desde A), $t$ en CD (desde D) y $b + u/2$ en BC (desde C).
        desarrollo: |
          $$
          \int m^{2}\,dl = \int_0^{2b}s^{2}\,ds + \int_0^{b}t^{2}\,dt + \int_0^{2b}\left(b + \frac{u}{2}\right)^{2}du = \frac{8}{3}b^{3} + \frac{1}{3}b^{3} + \frac{14}{3}b^{3} = \frac{23}{3}b^{3}
          $$
      - tipo: calcular
        titulo: La reacción horizontal de A
        pregunta: |
          ¿Cuánto vale la reacción horizontal de A, en unidades de $q_0b$
          (positiva hacia la derecha)?
        respuesta:
          tipo: numero
          valor: '0.1304'
          tolerancia: 0.0005
          formato: un número con su signo, el coeficiente de q0·b
        distractores:
          - valor: '-0.1304'
            mensaje: |
              El valor es ese y el sentido no. La que sale negativa es la de
              D, con la incógnita hacia la derecha: $D_x = -3q_0b/23$. La de
              A es la opuesta, hacia la derecha: los apoyos empujan las patas
              hacia dentro.
          - valor: '0.1364'
            mensaje: |
              Es $3q_0b/22$: te falta en la flexibilidad el pilar CD, que
              aporta $b^{3}/3$.
          - valor: '0.2143'
            mensaje: |
              Es $3q_0b/14$: solo has contado la energía del dintel. Los
              pilares también se flectan con la reacción horizontal.
        pista: |
          Con $M = M_0 + X\,m$, Menabrea da
          $X = -\int M_0m\,dl\big/\int m^{2}\,dl$. En la base, $M_0$ solo
          existe en BC: $M_0 = q_0bu - q_0u^{2}/2$, desde C.
        desarrollo: |
          $$
          \int M_0\,m\,dl = \int_0^{2b}\left(q_0bu - \frac{q_0u^{2}}{2}\right)\left(b + \frac{u}{2}\right)du = q_0b^{4}
          $$

          $X = D_x = -q_0b^{4}\big/\tfrac{23}{3}b^{3} = -\tfrac{3}{23}q_0b$:
          hacia la izquierda. Por la suma de horizontales,
          $A_x = \tfrac{3}{23}q_0b = 0{,}1304q_0b$, hacia la derecha.
      - tipo: calcular
        titulo: La reacción vertical de A
        pregunta: |
          ¿Cuánto vale la reacción vertical de A, en unidades de $q_0b$
          (positiva hacia arriba)?
        respuesta:
          tipo: numero
          valor: '1.0652'
          tolerancia: 0.0005
          formato: un número, el coeficiente de q0·b
        distractores:
          - valor: '1'
            mensaje: |
              Es la mitad de la carga, como en una viga simétrica. Pero D
              está más alto que A, y las dos reacciones horizontales forman
              un par, con brazo $b$, que carga A y descarga D.
          - valor: '0.9348'
            mensaje: |
              Es la de D. Los momentos respecto de D: el par de las dos
              horizontales, con brazo $b$, suma a la carga en A.
        pista: |
          Momentos respecto de D, con $A_x$ ya conocida: A está $2b$ a la
          izquierda y $b$ por debajo de D.
        desarrollo: |
          Momentos respecto de D:
          $A_y\cdot2b - A_x\cdot b = 2q_0b\cdot b$, así que

          $$
          A_y = q_0b + \frac{3}{46}q_0b = \frac{49}{46}q_0b = 1{,}0652q_0b
          $$

          y $D_y = 2q_0b - A_y = \tfrac{43}{46}q_0b = 0{,}9348q_0b$.
      - tipo: calcular
        titulo: El giro de C
        pregunta: |
          ¿Cuánto gira el nudo C, en unidades de $q_0b^{3}/(EI_z)$
          (antihorario positivo)?
        respuesta:
          tipo: numero
          valor: '0.1594'
          tolerancia: 0.0005
          formato: un número con su signo, el coeficiente de q0·b³/EIz
        distractores:
          - valor: '0.3333'
            mensaje: |
              Es el giro con $X = 0$, el de la base isostática sin la
              reacción horizontal. El flector real incluye $X\,m$: con él,
              los apoyos sujetan las patas y el giro baja a menos de la
              mitad.
          - valor: '-0.1594'
            mensaje: |
              El valor es ese y el sentido no. Con el par unidad antihorario,
              la integral sale positiva: C gira en sentido antihorario, como
              el extremo derecho de una viga cargada que se comba.
        pista: |
          Fuerza unitaria (ecs. 13.47 y 13.48, pp. 17-18): un par unidad en C
          sobre la base isostática. Solo flecta BC, con
          $m = 1 - u/(2b)$ desde C; $\theta_C = \int M\,m\,dl/(EI_z)$
          (ec. 13.30).
        desarrollo: |
          El flector real en BC, desde C, es
          $M = \tfrac{43}{46}q_0bu - \tfrac{3}{23}q_0b^{2} - q_0u^{2}/2$, y

          $$
          \theta_C = \frac{1}{EI_z}\int_0^{2b}M\left(1 - \frac{u}{2b}\right)du = \frac{11}{69}\frac{q_0b^{3}}{EI_z} = 0{,}1594\frac{q_0b^{3}}{EI_z}
          $$

          Antihorario. Basta el par sobre la base isostática: la parte que
          haría variar $X$ multiplica a $\int M\,m_X\,dl$, que es nula por
          Menabrea.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Grado 1: incógnita $X = D_x$; base con A fijo y D libre en
              horizontal.
          - texto: >-
              En la base, $M_0$ solo en BC; con $X = 1$, $m = s$, $t$ y
              $b + u/2$.
          - texto: >-
              Menabrea: $\int M_0m\,dl + X\int m^{2}\,dl = 0$, y
              $X = -3q_0b/23$.
          - texto: >-
              Equilibrio: $A_x = 3q_0b/23$, $A_y = 49q_0b/46$ y
              $D_y = 43q_0b/46$.
          - texto: >-
              Par unidad en C: $\theta_C = 11q_0b^{3}/(69EI_z)$, antihorario.
          - texto: >-
              Para el giro de C hay que aplicar el par unidad en la
              estructura hiperestática y volver a resolver su $X$.
            trampa: true
            mensaje: |
              No hace falta. El flector real ya cumple la compatibilidad, y
              el término que añadiría la variación de $X$ va multiplicado por
              $\int M\,m_X\,dl/(EI_z)$, que Menabrea anula. Basta el par sobre
              la base isostática.
    resolucion: |
      **La hiperestaticidad.** A y D son apoyos fijos: cuatro reacciones y
      tres ecuaciones, grado 1. Se libera la horizontal de D, $X = D_x$
      (positiva hacia la derecha); la base isostática es A fijo y D sobre un
      apoyo móvil, libre en horizontal (solo reacción vertical). Con solo la
      energía de flexión, Menabrea (ec. 13.52, tema
      13, p. 19) pide

      $$
      \frac{\partial C}{\partial X} = \int\frac{M}{EI_z}\frac{\partial M}{\partial X}\,dl = 0
      $$

      con $M = M_0 + X\,m$ (ec. 13.30, p. 12). Coordenadas: $s$ en AB
      desde A, $u$ en BC desde C y $t$ en CD desde D; flector positivo si
      tracciona la cara interior del pórtico.

      **Los flectores de la base.** Con $q_0$: reacciones verticales
      $q_0b$ en A y en D, sin horizontales. Los pilares no se flectan, y en
      BC, $M_0 = q_0bu - q_0u^{2}/2$. Con $X = 1$: $A_x = -1$,
      $D_y = -A_y = \tfrac12$, y $m = s$ en AB, $m = t$ en CD y
      $m = b + u/2$ en BC (vale $2b$ en B y $b$ en C, como en los pilares).

      **Las integrales.**

      $$
      \int m^{2}\,dl = \frac{8}{3}b^{3} + \frac{1}{3}b^{3} + \frac{14}{3}b^{3} = \frac{23}{3}b^{3},\qquad
      \int M_0\,m\,dl = q_0b^{4}
      $$

      $$
      X = -\frac{q_0b^{4}}{\tfrac{23}{3}b^{3}} = -\frac{3}{23}q_0b
      $$

      **a/ Las reacciones.** $D_x = 3q_0b/23 = 0{,}1304q_0b$ hacia la
      izquierda y, por la suma de horizontales, $A_x = 0{,}1304q_0b$ hacia
      la derecha: los apoyos empujan las patas hacia dentro. Momentos
      respecto de D, con A a $2b$ a la izquierda y $b$ por debajo:

      $$
      A_y = \frac{49}{46}q_0b = 1{,}0652q_0b\ \text{hacia arriba},\qquad
      D_y = \frac{43}{46}q_0b = 0{,}9348q_0b\ \text{hacia arriba}
      $$

      A carga más que D: las dos horizontales forman un par de brazo $b$
      que se suma a la carga en A.

      **Los flectores reales.** En AB, $M = -\tfrac{3}{23}q_0b\,s$, y en
      CD, $M = -\tfrac{3}{23}q_0b\,t$: negativos, traccionan la cara
      exterior, con $\tfrac{6}{23}q_0b^{2}$ en B y $\tfrac{3}{23}q_0b^{2}$
      en C. En BC,

      $$
      M = \frac{43}{46}q_0bu - \frac{3}{23}q_0b^{2} - \frac{q_0u^{2}}{2}
      $$

      que va de $-\tfrac{3}{23}q_0b^{2}$ en C a $-\tfrac{6}{23}q_0b^{2}$ en
      B, con un máximo positivo de $0{,}3065q_0b^{2}$ a $u = \tfrac{43}{46}b$
      de C.

      **b/ El giro de C.** Fuerza unitaria (ecs. 13.47 y 13.48, pp. 17-18):
      un par unidad antihorario en C sobre la base isostática. Sus
      reacciones son verticales ($A_y = -D_y = \tfrac{1}{2b}$), los pilares
      no se flectan y en BC, $m = 1 - u/(2b)$. Basta la base: el flector
      real ya cumple la compatibilidad, y lo que añadiría la variación de
      $X$ va multiplicado por $\int M\,m_X\,dl$, que Menabrea anula.

      $$
      \theta_C = \frac{1}{EI_z}\int_0^{2b}M\left(1 - \frac{u}{2b}\right)du = \frac{11}{69}\,\frac{q_0b^{3}}{EI_z} = 0{,}1594\,\frac{q_0b^{3}}{EI_z}
      $$

      Positivo: **C gira en sentido antihorario**, como el extremo derecho
      de una viga apoyada que se comba. Sin la reacción horizontal (la base
      sola) giraría algo más del doble, $q_0b^{3}/(3EI_z)$.

      **Comprobaciones.** El motor del curso (Menabrea sobre la base con A
      fijo y D móvil, y el desplazamiento con un par unidad en C) da
      $X = -3q_0b/23$ y $\theta_C = 11q_0b^{3}/(69EI_z)$; las integrales
      hechas a mano y por Simpson dan lo mismo, y las reacciones cumplen el
      equilibrio.

