      <figcaption>

      Redibujada del Word original. La galga a va sobre la diagonal, a 45°
      de x, como la gira el Word; el PDF, que es una conversión suya, la
      pinta en horizontal en el centro del cuadrado.

      </figcaption>
      </figure>

      **Notas nuestras.** La galga mide la deformación lineal en la
      dirección de la diagonal del cuadrado, a 45° de $x$ en sentido
      antihorario. Las
      flechas de la figura son las de $\sigma_x$, $\sigma_y$ y $\tau_{xy}$
      positivas. Los ángulos se miden desde $x$, antihorarios.
    pide: >-
      a/ Las tensiones y las direcciones principales. b/ Con σy = 82,9 MPa,
      las deformaciones principales. c/ La tensión normal y la tangencial en
      el plano perpendicular a la dirección a, con sus sentidos.
    pasos:
      - tipo: reconocer
        pregunta: |
          El apartado a necesita $\sigma_y$, y el enunciado no la da hasta
          el b. ¿De dónde sale?
        opciones:
          - texto: >-
              De la galga, que mide $\varepsilon_a$ a 45°; con Hooke,
              $\varepsilon_a$ se escribe con $\sigma_x$, $\sigma_y$ y
              $\tau_{xy}$, y queda una ecuación con $\sigma_y$ como única
              incógnita
            correcta: true
            mensaje: |
              Eso es. La deformación en una dirección sale de las de los
              ejes (ec. 3.55, tema 3, p. 17), y estas, de las tensiones con
              Hooke en tensión plana (ec. 4.24, tema 4, p. 9) y
              $\gamma_{xy} = \tau_{xy}/G$ (ec. 4.3, p. 5).
          - texto: >-
              Es el valor del apartado b, que vale también para el a
            mensaje: |
              El b da $\sigma_y$ para que su resultado no dependa de un
              error en el a. El a se tiene que resolver con lo que da el
              enunciado hasta ahí, y para eso está la galga.
          - texto: >-
              Del equilibrio del elemento, que obliga a $\sigma_y = \sigma_x$
            mensaje: |
              El equilibrio del elemento da la reciprocidad de las
              tangenciales, $\tau_{xy} = \tau_{yx}$, pero no liga $\sigma_x$
              con $\sigma_y$: son independientes. Lo que ata $\sigma_y$ a un
              dato es la medida de la galga.
      - tipo: calcular
        titulo: La tensión que mide la galga
        pregunta: |
          ¿Cuánto vale $\sigma_y$, en MPa?
        respuesta:
          tipo: numero
          valor: '82.86'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '101.43'
            mensaje: |
              Has puesto $\gamma_{xy}/2$ donde va $\gamma_{xy}$. En la
              ec. 3.55 el término cruzado es $\gamma_{xy}u_xu_y$, con la
              distorsión entera; la mitad, $\varepsilon_{xy}$, va
              multiplicada por $2u_xu_y$.
          - valor: '52'
            mensaje: |
              Te falta el efecto Poisson: $\varepsilon_x$ no es
              $\sigma_x/E$, sino $(\sigma_x - \nu\sigma_y)/E$ (ec. 4.24), y lo
              mismo $\varepsilon_y$.
          - valor: '105.71'
            mensaje: |
              Has hecho $\gamma_{xy} = \tau_{xy}/E$. La distorsión va con el
              módulo de cortadura, $\gamma_{xy} = \tau_{xy}/G$ (ec. 4.3), con
              $G = E/[2(1 + \nu)]$ (ec. 4.6).
          - valor: '157.14'
            mensaje: |
              Has puesto la galga a −45°, con el término de
              $\gamma_{xy}$ restando. La galga va sobre la diagonal que sube
              hacia la derecha, a +45°: $\sin45°\cos45° = +\tfrac12$.
        pista: |
          $\varepsilon_a = \varepsilon_x\cos^{2}45° + \varepsilon_y\sin^{2}45° + \gamma_{xy}\sin45°\cos45°$
          (ec. 3.55), con $\varepsilon_x$, $\varepsilon_y$ de Hooke en
          tensión plana (ec. 4.24) y $\gamma_{xy} = \tau_{xy}/G$.
        desarrollo: |
          Con $\cos^{2}45° = \sin^{2}45° = \sin45°\cos45° = \tfrac12$ y
          $\gamma_{xy} = 2(1 + \nu)\tau_{xy}/E$:

          $$
          E\varepsilon_a = \frac{(1 - \nu)(\sigma_x + \sigma_y)}{2} + (1 + \nu)\tau_{xy}
          $$

          Despejando, con $2E\varepsilon_a = 98$ MPa y
          $2(1 + \nu)\tau_{xy} = 26$ MPa:

          $$
          \sigma_y = \frac{2E\varepsilon_a - 2(1 + \nu)\tau_{xy}}{1 - \nu} - \sigma_x = \frac{98\ \text{MPa} - 26\ \text{MPa}}{0{,}7} - 20\ \text{MPa} = 82{,}86\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La tensión principal mayor
        pregunta: |
          ¿Cuánto vale $\sigma_1$, en MPa?
        respuesta:
          tipo: numero
          valor: '84.41'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '115.08'
            mensaje: |
              Te falta la mitad dentro del radio:
              $R = \sqrt{[(\sigma_x - \sigma_y)/2]^{2} + \tau_{xy}^{2}}$
              (ec. 2.68), no $\sqrt{(\sigma_x - \sigma_y)^{2} + \tau_{xy}^{2}}$.
          - valor: '102.64'
            mensaje: |
              Es la principal con $\sigma_y = 101{,}43$ MPa, que sale de
              poner $\gamma_{xy}/2$ en la ec. 3.55. Rehaz $\sigma_y$: en el
              término cruzado va la distorsión entera.
        pista: |
          El centro y el radio del círculo de Mohr (ec. 2.68, p. 25), y
          $\sigma_{1,2} = C \pm R$ (ec. 2.69).
        desarrollo: |
          $$
          C = \frac{\sigma_x + \sigma_y}{2} = \frac{20\ \text{MPa} + 82{,}86\ \text{MPa}}{2} = 51{,}43\ \text{MPa}
          $$

          $$
          R = \sqrt{\left(\frac{\sigma_x - \sigma_y}{2}\right)^{2} + \tau_{xy}^{2}} = \sqrt{31{,}43^{2} + 10^{2}}\ \text{MPa} = 32{,}98\ \text{MPa}
          $$

          $\sigma_1 = C + R = 84{,}41$ MPa y $\sigma_2 = C - R = 18{,}45$
          MPa. La tercera, normal al plano, es $\sigma_3 = \sigma_z = 0$.
      - tipo: calcular
        titulo: La dirección de σ₁
        pregunta: |
          ¿Qué ángulo forma con $x$ la dirección de $\sigma_1$, en grados?
        respuesta:
          tipo: numero
          valor: '81.17'
          tolerancia: 0.1
          formato: un ángulo en grados desde x, antihorario positivo, entre −90 y 90
        distractores:
          - valor: '-8.83'
            mensaje: |
              Es la otra dirección principal, la de $\sigma_2$. La ec. 2.62
              da dos ángulos a 90°; para saber cuál es el de $\sigma_1$, se
              lleva uno a la ec. 2.61 y se mira qué $\sigma_n$ da.
          - valor: '8.83'
            mensaje: |
              El signo del denominador: $\sigma_x - \sigma_y$ es negativo, y
              $\tan2\theta_1 = 20/(20 - 82{,}86) = -0{,}318$. Además, con
              $\sigma_y$ mucho mayor que $\sigma_x$, $\sigma_1$ tiene que
              quedar cerca de $y$, no de $x$.
          - valor: '162.35'
            mensaje: |
              Es $2\theta_1$, el ángulo en el círculo de Mohr. En el elemento
              el ángulo es la mitad.
        pista: |
          $\tan2\theta_1 = 2\tau_{xy}/(\sigma_x - \sigma_y)$ (ec. 2.62, p. 23)
          da dos direcciones a 90°. La de $\sigma_1$ es la que, llevada a la
          ec. 2.61, da la $\sigma_n$ mayor.
        desarrollo: |
          $\tan2\theta_1 = 20/(-62{,}86) = -0{,}3182$: $2\theta_1 = -17{,}65°$
          o $162{,}35°$, y $\theta_1 = -8{,}83°$ o $81{,}17°$. Con
          $\theta = 81{,}17°$ en la ec. 2.61:

          $$
          \sigma_n = 51{,}43\ \text{MPa} + 29{,}95\ \text{MPa} + 3{,}03\ \text{MPa} = 84{,}41\ \text{MPa}
          $$

          (los dos últimos son $\tfrac12(\sigma_x - \sigma_y)\cos2\theta$ y
          $\tau_{xy}\sin2\theta$). Es $\sigma_1$: va a $81{,}17°$ de $x$, y
          $\sigma_2$ a $-8{,}83°$. Tiene sentido: $\sigma_y$ es la mayor de
          las dos normales, y $\sigma_1$ queda cerca de $y$.
      - tipo: reconocer
        pregunta: |
          Para el apartado b, ¿cuántas deformaciones principales hay, y en
          qué direcciones?
        opciones:
          - texto: >-
              Tres, en las direcciones principales de tensión; la tercera es
              $\varepsilon_z$, que no es nula aunque $\sigma_z$ lo sea
            correcta: true
            mensaje: |
              Eso es. En un material isótropo las direcciones principales de
              deformación y de tensión coinciden (ecs. 4.4 y 4.5, p. 5), y
              en tensión plana el espesor se contrae por Poisson:
              $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E$ (ec. 4.24).
          - texto: >-
              Dos, en el plano: en tensión plana $\varepsilon_z = 0$
            mensaje: |
              $\varepsilon_z = 0$ es la deformación plana. En tensión plana
              es $\sigma_z$ la nula, y el espesor cambia por el efecto
              Poisson de $\sigma_x$ y $\sigma_y$ (ec. 4.24).
          - texto: >-
              Tres, pero las del plano en direcciones distintas de las de
              tensión, porque $\gamma_{xy}$ y $\tau_{xy}$ se miden distinto
            mensaje: |
              $\gamma_{xy} = \tau_{xy}/G$ es proporcional a $\tau_{xy}$, y
              $\varepsilon_x - \varepsilon_y = (1 + \nu)(\sigma_x - \sigma_y)/E$:
              el $\tan2\theta$ de las deformaciones es el mismo que el de las
              tensiones (ecs. 4.4 y 4.5). En un material isótropo las
              direcciones coinciden.
      - tipo: calcular
        titulo: La deformación principal mayor
        pregunta: |
          Con $\sigma_y = 82{,}9$ MPa, ¿cuánto vale $\varepsilon_1$, en
          millonésimas?
        respuesta:
          tipo: numero
          valor: '1127.4'
          tolerancia: 1.5
          formato: un número, en millonésimas (×10⁻⁶)
        distractores:
          - valor: '1206.5'
            mensaje: |
              Es $\sigma_1/E$, sin Poisson. La tensión $\sigma_2$ estrecha la
              dirección 1: $\varepsilon_1 = (\sigma_1 - \nu\sigma_2)/E$.
          - valor: '1285.5'
            mensaje: |
              El signo de Poisson: $\sigma_2$, de tracción, **acorta** la
              dirección 1. Es $\sigma_1 - \nu\sigma_2$, no
              $\sigma_1 + \nu\sigma_2$.
        pista: |
          Las principales con $\sigma_y = 82{,}9$ MPa, y Hooke en tensión
          plana (ec. 4.24) escrito en las direcciones principales.
        desarrollo: |
          Con $\sigma_y = 82{,}9$ MPa, $C = 51{,}45$ MPa y $R = 33{,}00$ MPa:
          $\sigma_1 = 84{,}45$ MPa y $\sigma_2 = 18{,}45$ MPa. Entonces

          $$
          \varepsilon_1 = \frac{\sigma_1 - \nu\sigma_2}{E} = \frac{84{,}45 - 0{,}3\cdot18{,}45}{70\,000} = 1127{,}4\cdot10^{-6}
          $$

          y $\varepsilon_2 = (\sigma_2 - \nu\sigma_1)/E = -98{,}4\cdot10^{-6}$.
      - tipo: calcular
        titulo: La deformación según el espesor
        pregunta: |
          ¿Y la tercera, $\varepsilon_3 = \varepsilon_z$, en millonésimas?
        respuesta:
          tipo: numero
          valor: '-441'
          tolerancia: 1
          formato: un número con su signo, en millonésimas (×10⁻⁶)
        distractores:
          - valor: '0'
            mensaje: |
              Eso es la deformación plana. En tensión plana la nula es
              $\sigma_z$; $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E$
              (ec. 4.24).
          - valor: '441'
            mensaje: |
              El valor es ese y el signo no: las tracciones del plano
              estrechan el espesor. $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E$.
          - valor: '-308.7'
            mensaje: |
              Has hecho $-\nu(\varepsilon_1 + \varepsilon_2)$, como si Poisson
              actuara sobre deformaciones. Va sobre tensiones,
              $-\nu(\sigma_1 + \sigma_2)/E$; con deformaciones sería
              $-\nu(\varepsilon_1 + \varepsilon_2)/(1 - \nu)$.
        pista: |
          La tercera ecuación de Hooke en tensión plana (ec. 4.24, p. 9), con
          $\sigma_x + \sigma_y = \sigma_1 + \sigma_2$.
        desarrollo: |
          $$
          \varepsilon_z = -\frac{\nu(\sigma_x + \sigma_y)}{E} = -\frac{0{,}3\cdot102{,}9}{70\,000} = -441{,}0\cdot10^{-6}
          $$
      - tipo: calcular
        titulo: La tensión normal en el plano perpendicular a la galga
        pregunta: |
          Con $\sigma_y = 82{,}9$ MPa, ¿cuánto vale $\sigma_n$ en el plano
          perpendicular a la dirección a, en MPa?
        respuesta:
          tipo: numero
          valor: '61.45'
          tolerancia: 0.05
          formato: un número con su signo, en MPa (positivo si es de tracción)
        distractores:
          - valor: '41.45'
            mensaje: |
              Es el plano que **contiene** la dirección a, de normal a 135°.
              El perpendicular a la dirección a tiene a como normal:
              $\theta = 45°$.
          - valor: '51.45'
            mensaje: |
              Es el centro del círculo: te falta el término de
              $\tau_{xy}$, que a 45° vale $\tau_{xy}\sin90° = 10$ MPa
              (ec. 2.61).
        pista: |
          La normal del plano es la dirección a: $\theta = 45°$ en la
          ec. 2.61 (p. 23).
        desarrollo: |
          Con $2\theta = 90°$:

          $$
          \sigma_n = \frac{\sigma_x + \sigma_y}{2} + \tau_{xy} = 51{,}45\ \text{MPa} + 10\ \text{MPa} = 61{,}45\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La tangencial en ese plano
        pregunta: |
          ¿Y $\tau_n$, en MPa, con el convenio de los apuntes?
        respuesta:
          tipo: numero
          valor: '31.45'
          tolerancia: 0.05
          formato: un número con su signo, en MPa, positivo según t = −sen θ i + cos θ j
        distractores:
          - valor: '-31.45'
            mensaje: |
              El signo: en la ec. 2.61 es $\tfrac12(\sigma_y - \sigma_x)\sin2\theta$,
              con $\sigma_y$ delante, y $\sigma_y > \sigma_x$; o has tomado
              $\hat t$ girando la normal en sentido horario: en los apuntes es
              $\hat t = -\sin\theta\,\hat\imath + \cos\theta\,\hat\jmath$
              (ec. 2.57).
          - valor: '62.9'
            mensaje: |
              Te falta el $\tfrac12$: $\tau_n = \tfrac12(\sigma_y - \sigma_x)\sin2\theta + \tau_{xy}\cos2\theta$
              (ec. 2.61).
        pista: |
          La segunda de la ec. 2.61, con $\theta = 45°$. El sentido positivo
          es el de $\hat t$ (ec. 2.57, p. 22).
        desarrollo: |
          $$
          \tau_n = \frac{\sigma_y - \sigma_x}{2}\sin90° + \tau_{xy}\cos90° = \frac{82{,}9\ \text{MPa} - 20\ \text{MPa}}{2} = 31{,}45\ \text{MPa}
          $$

          Positiva: va según $\hat t = -\sin45°\,\hat\imath + \cos45°\,\hat\jmath$.
      - tipo: dibujar
        consigna: |
          En papel: el elemento cortado por el plano perpendicular a la
          dirección a, con el vector tensión de ese plano descompuesto en
          $\sigma_n$ y $\tau_n$, cada una con su flecha y su valor.
        comprueba:
          - punto: |
              **El plano**: la traza perpendicular a la diagonal de la
              galga, que corta el cuadrado de arriba a la izquierda a abajo a
              la derecha, y su normal exterior según a, a 45°.
            porque: |
              El plano «perpendicular a la dirección a» tiene a como normal;
              confundirlo con el que contiene a cambia $\sigma_n$ de 61,45 a
              41,45 MPa.
          - punto: |
              **$\sigma_n = 61{,}45$ MPa**, saliendo del plano según a: es
              de tracción.
            porque: |
              Positiva en la ec. 2.61 quiere decir según la normal
              exterior.
          - punto: |
              **$\tau_n = 31{,}45$ MPa**, sobre el plano, hacia arriba a la
              izquierda, a 135° de $x$.
            porque: |
              Es positiva, y el sentido positivo es el de
              $\hat t = (-\sin45°, \cos45°)$ (ec. 2.57): la normal girada 90°
              en sentido antihorario.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La galga, con Hooke y $\gamma_{xy} = \tau_{xy}/G$, da
              $\sigma_y = 82{,}86$ MPa.
          - texto: >-
              El círculo de Mohr da $\sigma_1 = 84{,}41$ MPa a 81,17° de $x$ y
              $\sigma_2 = 18{,}45$ MPa a −8,83°; $\sigma_3 = 0$, según $z$.
          - texto: >-
              Con $\sigma_y = 82{,}9$ MPa y Hooke en las direcciones
              principales, $\varepsilon_1 = 1127{,}4\cdot10^{-6}$,
              $\varepsilon_2 = -98{,}4\cdot10^{-6}$ y
              $\varepsilon_3 = -441\cdot10^{-6}$.
          - texto: >-
              En el plano de normal a, a 45°, $\sigma_n = 61{,}45$ MPa de
              tracción y $\tau_n = 31{,}45$ MPa hacia arriba a la izquierda.
          - texto: >-
              Como el estado es de tensión plana, la deformación según el
              espesor es nula, y las deformaciones principales son dos.
            trampa: true
            mensaje: |
              Tensión plana es $\sigma_z = 0$, no $\varepsilon_z = 0$: el
              espesor se contrae por Poisson,
              $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E = -441\cdot10^{-6}$.
              La nula sería $\varepsilon_z$ en deformación plana.
    resolucion: |
      **Los datos.** $\sigma_x = 20$ MPa y $\tau_{xy} = 10$ MPa, con las
      flechas de la figura, que son las positivas; $\sigma_z$, $\tau_{xz}$ y
      $\tau_{yz}$ son nulas. La galga mide $\varepsilon_a = 7\cdot10^{-4}$ en
      la dirección a, a 45° de $x$ en sentido antihorario.

      **a/ $\sigma_y$, desde la galga.** La deformación en la dirección
      $\hat u = (\cos45°, \sin45°)$ es (ec. 3.55, tema 3, p. 17)

      $$
      \varepsilon_a = \varepsilon_x\cos^{2}45° + \varepsilon_y\sin^{2}45° + \gamma_{xy}\sin45°\cos45° = \frac{\varepsilon_x + \varepsilon_y + \gamma_{xy}}{2}
      $$

      Con Hooke en tensión plana (ec. 4.24, tema 4, p. 9) y
      $\gamma_{xy} = \tau_{xy}/G = 2(1 + \nu)\tau_{xy}/E$ (ecs. 4.3 y 4.6):

      $$
      E\varepsilon_a = \frac{(1 - \nu)(\sigma_x + \sigma_y)}{2} + (1 + \nu)\tau_{xy}
      \quad\Rightarrow\quad
      \sigma_y = \frac{98\ \text{MPa} - 26\ \text{MPa}}{0{,}7} - 20\ \text{MPa} = 82{,}86\ \text{MPa}
      $$

      **a/ Las principales.** Centro y radio del círculo de Mohr
      (ecs. 2.68 y 2.69, pp. 25-26): $C = 51{,}43$ MPa,
      $R = \sqrt{31{,}43^{2} + 10^{2}}\ \text{MPa} = 32{,}98\ \text{MPa}$, y

      $$
      \sigma_1 = 84{,}41\ \text{MPa},\qquad \sigma_2 = 18{,}45\ \text{MPa},\qquad \sigma_3 = 0
      $$

      Las direcciones (ec. 2.62, p. 23): $\tan2\theta_1 = 20/(-62{,}86) = -0{,}3182$,
      que da $\theta = -8{,}83°$ y $81{,}17°$. Llevando $81{,}17°$ a la
      ec. 2.61 sale $\sigma_n = 84{,}41$ MPa, así que **$\sigma_1$ va a
      81,17° de $x$**, $\sigma_2$ a $-8{,}83°$ y $\sigma_3$ según $z$.

      **b/ Las deformaciones principales**, con $\sigma_y = 82{,}9$ MPa.
      Ahora $C = 51{,}45$ MPa y $R = 33{,}00$ MPa: $\sigma_1 = 84{,}45$ MPa
      y $\sigma_2 = 18{,}45$ MPa, en las mismas direcciones de antes. El
      material es isótropo: las direcciones principales de deformación son
      las de tensión (ecs. 4.4 y 4.5, p. 5), y Hooke se escribe en ellas:

      $$
      \varepsilon_1 = \frac{\sigma_1 - \nu\sigma_2}{E} = 1127{,}4\cdot10^{-6},\qquad
      \varepsilon_2 = \frac{\sigma_2 - \nu\sigma_1}{E} = -98{,}4\cdot10^{-6}
      $$

      $$
      \varepsilon_3 = \varepsilon_z = -\frac{\nu(\sigma_1 + \sigma_2)}{E} = -441{,}0\cdot10^{-6}
      $$

      La tercera no es nula: en tensión plana es $\sigma_z$ la que se anula,
      y el espesor se contrae.

      **c/ El plano perpendicular a la dirección a.** Su normal es a,
      $\theta = 45°$, y con $\sigma_y = 82{,}9$ MPa la ec. 2.61 da

      $$
      \sigma_n = \frac{\sigma_x + \sigma_y}{2} + \tau_{xy} = 61{,}45\ \text{MPa},\qquad
      \tau_n = \frac{\sigma_y - \sigma_x}{2} = 31{,}45\ \text{MPa}
      $$

      **Los sentidos.** $\sigma_n$ es positiva: tracción, saliendo del
      plano según a. $\tau_n$ es positiva: va según
      $\hat t = -\sin45°\,\hat\imath + \cos45°\,\hat\jmath$ (ec. 2.57), es
      decir, sobre el plano y hacia arriba a la izquierda, a 135° de $x$.
      Por Cauchy se ve lo mismo: el vector tensión del plano es
      $\vec S_n = [\sigma]\hat n = (21{,}21;\ 65{,}69)$ MPa, y sus
      proyecciones sobre $\hat n$ y $\hat t$ son 61,45 y 31,45 MPa.

      **Comprobaciones.** El motor del curso (Hooke en tres dimensiones y la
      deformación en la dirección de la galga) da $\sigma_y = 82{,}857$ MPa,
      que reproduce $\varepsilon_a = 7\cdot10^{-4}$; el círculo de Mohr y
      los valores propios del tensor dan las mismas principales, las
      deformaciones principales salen de diagonalizar el tensor de
      deformaciones, y $\sigma_n$, $\tau_n$ por la ec. 2.61 y por Cauchy
      coinciden.

