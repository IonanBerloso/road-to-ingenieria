      - tipo: calcular
        titulo: El centro de gravedad de la L
        pregunta: |
          ¿A qué distancia de la cara de arriba está el centro de gravedad,
          en cm?
        respuesta:
          tipo: numero
          valor: '12.571'
          tolerancia: 0.01
          formato: un número, en cm, desde la cara de arriba
        distractores:
          - valor: '10'
            mensaje: |
              Es la mitad de la altura. La L tiene más material abajo, en el
              ala horizontal, y el centro de gravedad baja.
          - valor: '7.4286'
            mensaje: |
              Es la distancia desde la cara de abajo. La pregunta la mide
              desde la de arriba: $20 - 7{,}43 = 12{,}57$ cm.
          - valor: '13'
            mensaje: |
              Has contado dos veces la esquina: el ala vertical de 20 cm y el
              ala de abajo de 10 cm enteros se solapan en un cuadrado de
              2 × 2 cm. El ala de abajo, fuera del alma, mide 8 cm.
        pista: |
          Dos rectángulos sin solape: el ala vertical, de 2 × 20 cm, y el
          resto del ala de abajo, de 8 × 2 cm.
        desarrollo: |
          $A_1 = 40$ cm² con su centro a 10 cm de arriba y 1 cm de la cara
          izquierda; $A_2 = 16$ cm² a 19 cm y 6 cm. $A = 56$ cm² y

          $$
          \overline{y} = \frac{40\cdot10 + 16\cdot19}{56}\ \text{cm} = 12{,}571\ \text{cm},\qquad
          \overline{z} = \frac{40\cdot1 + 16\cdot6}{56}\ \text{cm} = 2{,}429\ \text{cm}
          $$
      - tipo: calcular
        titulo: El momento de inercia respecto del eje horizontal
        pregunta: |
          ¿Cuánto vale $I_z$, respecto del eje horizontal por G, en cm⁴?
        respuesta:
          tipo: numero
          valor: '2264.4'
          tolerancia: 1
          formato: un número, en cm⁴
        distractores:
          - valor: '1338.7'
            mensaje: |
              Te falta Steiner: cada rectángulo aporta su inercia propia y
              además su área por el cuadrado de la distancia de su centro a
              G.
        pista: |
          Steiner en cada rectángulo, con las distancias verticales de sus
          centros a G.
        desarrollo: |
          $$
          I_z = \left(\frac{2\cdot20^{3}}{12} + 40\cdot2{,}571^{2} + \frac{8\cdot2^{3}}{12} + 16\cdot6{,}429^{2}\right)\text{cm}^{4} = 2264{,}4\ \text{cm}^{4}
          $$

          Del mismo modo, $I_y = 384{,}4$ cm⁴.
      - tipo: calcular
        titulo: El producto de inercia
        pregunta: |
          ¿Cuánto vale $I_{yz}$, con $y$ hacia abajo y $z$ hacia la derecha,
          en cm⁴?
        respuesta:
          tipo: numero
          valor: '514.29'
          tolerancia: 0.5
          formato: un número con su signo, en cm⁴
        distractores:
          - valor: '-514.29'
            mensaje: |
              El signo. El ala vertical está arriba y a la izquierda de G
              ($y < 0$, $z < 0$) y el resto del ala de abajo, abajo y a la
              derecha ($y > 0$, $z > 0$): los dos productos son positivos.
          - valor: '0'
            mensaje: |
              Cada rectángulo tiene producto propio nulo, pero no el de
              Steiner, $A\,d_yd_z$: sus centros no están sobre los ejes por
              G.
        pista: |
          Solo cuenta el término de Steiner de cada rectángulo,
          $A\,d_yd_z$, con el signo de las distancias.
        desarrollo: |
          $$
          I_{yz} = \bigl(40\cdot(-2{,}571)(-1{,}429) + 16\cdot6{,}429\cdot3{,}571\bigr)\ \text{cm}^{4} = 514{,}3\ \text{cm}^{4}
          $$
      - tipo: calcular
        titulo: La tracción máxima con a = 1 m
        pregunta: |
          Con $a = 1$ m, ¿cuánto vale la tensión de tracción máxima de la
          viga, en MPa?
        respuesta:
          tipo: numero
          valor: '114.17'
          tolerancia: 0.2
          formato: un número, en MPa
        distractores:
          - valor: '83.28'
            mensaje: |
              Has usado $\sigma_x = M_zy/I_z$, sin el producto de inercia. En
              la L la tensión también depende de $z$ (ec. 9.11), y la esquina
              más traccionada no es la que dice la fórmula de ejes
              principales.
          - valor: '88.71'
            mensaje: |
              Es la esquina de arriba a la izquierda. Con el eje neutro
              inclinado, la más traccionada en B es la otra esquina de la
              cara de arriba, la de la derecha del ala vertical: la más
              alejada del eje neutro.
          - valor: '57.16'
            mensaje: |
              Es la tracción en la sección del flector máximo positivo, en la
              esquina de abajo a la izquierda. En B el flector es mayor en
              valor absoluto, y su tracción, de arriba, también.
          - valor: '150.55'
            mensaje: |
              Te sale con $I_{yz}$ negativo, y la tracción se va a la esquina
              de arriba a la izquierda. Los dos rectángulos tienen $d_y$ y
              $d_z$ del mismo signo, y $I_{yz} = +514{,}3$ cm⁴.
        pista: |
          Con $M_y = 0$ la ec. 9.11 queda
          $\sigma_x = M_z(I_yy - I_{yz}z)/(I_yI_z - I_{yz}^{2})$, con $y$, $z$
          medidas desde G. En B, $M_z = -q_0a^{2}/2$: busca dónde es más
          negativo $I_yy - I_{yz}z$.
        desarrollo: |
          $I_yI_z - I_{yz}^{2} = 605\,895$ cm⁸. En B,
          $M_z = -15$ kN·m. En la esquina de arriba a la derecha del ala
          vertical, $y = -12{,}571$ cm y $z = 2 - 2{,}429 = -0{,}429$ cm:

          $$
          \sigma_x = \frac{-1500\ \text{kN·cm}\cdot(384{,}4\cdot(-12{,}571) - 514{,}3\cdot(-0{,}429))\ \text{cm}^{5}}{605\,895\ \text{cm}^{8}} = 11{,}42\ \text{kN/cm}^{2}
          $$

          Son 114,17 MPa. En la otra esquina de arriba sale 88,7 MPa, y en
          la sección del máximo positivo la mayor tracción, abajo a la
          izquierda, es 57,2 MPa.
      - tipo: calcular
        titulo: La longitud a
        pregunta: |
          ¿Qué valor de $a$ da una tracción máxima de 200 MPa, en m?
        respuesta:
          tipo: numero
          valor: '1.3235'
          tolerancia: 0.002
          formato: un número, en m
        distractores:
          - valor: '1.5497'
            mensaje: |
              Has dimensionado con $\sigma_x = M_zy/I_z$, sin el producto de
              inercia: esa tracción es menor que la verdadera, y la viga sale
              más larga de lo que aguanta.
          - valor: '1.5015'
            mensaje: |
              Has tomado la esquina de arriba a la izquierda. Con el eje
              neutro inclinado, la más traccionada es la de arriba a la
              derecha del ala vertical.
          - valor: '1.8706'
            mensaje: |
              Has dimensionado con la sección del máximo positivo. Manda B,
              con $|M_B| = q_0a^{2}/2$.
          - valor: '1.1526'
            mensaje: |
              Te sale con $I_{yz}$ negativo: la tracción de B se te va a la
              esquina de arriba a la izquierda y sale mayor de lo que es. Los
              dos rectángulos tienen $d_y$ y $d_z$ del mismo signo, y
              $I_{yz} = +514{,}3$ cm⁴.
        pista: |
          Todos los flectores son proporcionales a $q_0a^{2}$: la tensión
          crece con $a^{2}$.
        desarrollo: |
          $$
          a = 1\ \text{m}\cdot\sqrt{\frac{200\ \text{MPa}}{114{,}17\ \text{MPa}}} = 1{,}3235\ \text{m}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Reacciones: $R_A = \tfrac34q_0a$ y $R_B = \tfrac94q_0a$.
          - texto: >-
              Flectores: $\tfrac{9}{32}q_0a^{2}$ en $x = \tfrac34a$ y
              $-\tfrac12q_0a^{2}$ en B, el mayor en valor absoluto.
          - texto: >-
              Sección: $\overline{y} = 12{,}57$ cm, $I_z = 2264{,}4$ cm⁴,
              $I_y = 384{,}4$ cm⁴ e $I_{yz} = 514{,}3$ cm⁴.
          - texto: >-
              Flexión esviada (ec. 9.11): en B, la tracción máxima está en la
              esquina de arriba a la derecha del ala vertical.
          - texto: >-
              La tensión crece con $a^{2}$; con 200 MPa,
              $a = 1{,}3235$ m.
          - texto: >-
              Como el flector es vertical, el eje neutro es horizontal y
              basta $\sigma_x = M_zy/I_z$ en la fibra de arriba.
            trampa: true
            mensaje: |
              Solo si los ejes son principales. En la L, $I_{yz} \ne 0$ y el
              eje neutro sale inclinado, $y/z = I_{yz}/I_y$: la fórmula de
              ejes principales da 83,3 MPa en lugar de 114,2 y una luz un
              17 % demasiado larga.
    resolucion: |
      **a/ Las reacciones y los diagramas.** La carga total, $3q_0a$, actúa
      a $1{,}5a$ de A. Momentos respecto de B y suma de fuerzas:

      $$
      R_A = 0{,}75q_0a,\qquad R_B = 2{,}25q_0a
      $$

      Con el convenio del tema 7 ($dT/dx = -q$, $dM/dx = T$, ecs. 7.14 y
      7.15, p. 12):

      - **De A a B** ($0 \le x \le 2a$): $T = q_0(0{,}75a - x)$ y
        $M = q_0(0{,}75ax - x^{2}/2)$. El cortante se anula en $x = 0{,}75a$,
        donde el flector es máximo, $M = \tfrac{9}{32}q_0a^{2} = 0{,}28125q_0a^{2}$;
        el flector se anula en $x = 1{,}5a$ y vale $-\tfrac12q_0a^{2}$ en B.
        Justo antes de B, $T = -1{,}25q_0a$.
      - **De B a C** ($2a \le x \le 3a$): $T = q_0(3a - x)$, que empieza en
        $q_0a$ tras el salto de $R_B$, y $M = -q_0(3a - x)^{2}/2$, que acaba
        en cero en C con tangente horizontal.

      **b/ La sección.** Dos rectángulos: el ala vertical, de 2 × 20 cm, y
      el resto del ala de abajo, de 8 × 2 cm. Con $y$ desde la cara de
      arriba y $z$ desde la cara izquierda: $A = 56$ cm²,
      $\overline{y} = 12{,}571$ cm y $\overline{z} = 2{,}429$ cm. Con
      Steiner:

      $$
      I_z = 2264{,}4\ \text{cm}^{4},\qquad I_y = 384{,}4\ \text{cm}^{4},\qquad I_{yz} = 514{,}3\ \text{cm}^{4}
      $$

      La L no tiene eje de simetría, $I_{yz} \ne 0$, y el flector vertical
      da **flexión esviada**. Con $M_y = 0$, la ec. 9.11 (tema 9, p. 7)
      queda, con $y$, $z$ medidas desde G,

      $$
      \sigma_x = M_z\,\frac{I_y\,y - I_{yz}\,z}{I_yI_z - I_{yz}^{2}},\qquad I_yI_z - I_{yz}^{2} = 605\,895\ \text{cm}^{8}
      $$

      y el eje neutro, $\sigma_x = 0$ (ec. 9.13), es la recta por G
      $y = (I_{yz}/I_y)\,z = 1{,}338\,z$: baja hacia la derecha a 53,2° de
      la horizontal.

      **Qué sección y qué punto.** Las dos candidatas son B, con
      $M_z = -\tfrac12q_0a^{2}$, y la del máximo positivo, con
      $\tfrac{9}{32}q_0a^{2}$. Con $a = 1$ m, $q_0a^{2} = 30$ kN·m:

      - En B la tracción es arriba. La más alejada del eje neutro por ese
        lado es la esquina de arriba a la derecha del ala vertical
        ($y = -12{,}571$ cm, $z = -0{,}429$ cm), con
        $\sigma_x = 114{,}17$ MPa. La otra esquina de arriba da 88,7 MPa.
      - En la sección del máximo positivo la tracción es abajo, y la mayor
        está en la esquina de abajo a la izquierda: 57,2 MPa.

      Manda B. Como todos los flectores son proporcionales a $q_0a^{2}$, la
      tracción máxima es $114{,}17\ \text{MPa}\cdot(a/1\ \text{m})^{2}$, y
      con 200 MPa:

      $$
      a = 1\ \text{m}\cdot\sqrt{\frac{200}{114{,}17}} = 1{,}3235\ \text{m}
      $$

      Con la fórmula de ejes principales, $\sigma_x = M_zy/I_z$, saldría
      $a = 1{,}55$ m, un 17 % más: la viga no aguantaría.

      **Comprobaciones.** El motor del curso (la viga con sus apoyos, las
      propiedades de la sección por rectángulos y las tensiones extremas en
      flexión esviada) da lo mismo que las cuentas a mano: las reacciones,
      los flectores, $I_z$, $I_y$, $I_{yz}$, la esquina más traccionada y
      $a = 1{,}3235$ m, con el que la tracción de B sale 200 MPa.

