    nivel: examen
    enunciado: |
      4. (1,5p) La rigidez a flexión de la estructura ABCD de la figura es
      $EI_z$ y está sometida a la carga uniforme $q_0$ en el tramo BC.
      Teniendo en cuenta sólo la energía de flexión, determinar:

      a/ Reacciones en A y D en función de $q_0$ y $b$.

      b/ Ángulo girado en C en función de $q_0$, $b$ y $EI_z$.

