    pide: >-
      a/ Los diagramas de cortantes y de flectores en función de q0 y a.
      b/ La longitud a con la que la tensión de tracción máxima es de
      200 MPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para el apartado b, ¿qué tiene de particular esta sección?
        opciones:
          - texto: >-
              Los ejes horizontal y vertical por su centro de gravedad no
              son principales, porque la L no tiene eje de simetría: el
              flector de las cargas verticales da flexión esviada
            correcta: true
            mensaje: |
              Eso es (tema 9, ecs. 9.11 a 9.13, pp. 7-8). Con $I_{yz} \ne 0$
              la tensión depende de $y$ y también de $z$, y el eje neutro
              sale inclinado: la fibra más traccionada no es, sin más, la más
              alejada en vertical.
          - texto: >-
              Nada: con cargas verticales basta $\sigma_x = M_zy/I_z$
            mensaje: |
              Esa fórmula (ec. 9.23) es para ejes principales. En la L el
              producto de inercia respecto de los ejes por G no es nulo, y
              la tensión lleva un término en $z$ (ec. 9.11).
          - texto: >-
              Que la tracción máxima está siempre en la fibra de abajo, la
              más alejada del centro de gravedad
            mensaje: |
              Depende del signo del flector, y en una L también de $z$. Con
              flector negativo la fibra de abajo está comprimida, y en esta
              viga hay flectores de los dos signos.
      - tipo: calcular
        titulo: La reacción en A
        pregunta: |
          ¿Cuánto vale la reacción vertical de A, en unidades de $q_0a$?
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.001
          formato: un número, el coeficiente de q0·a (positivo hacia arriba)
        distractores:
          - valor: '1.5'
            mensaje: |
              Has repartido la carga total, $3q_0a$, a partes iguales. La
              resultante está a $1{,}5a$ de A, más cerca de B que de A:
              momentos respecto de B, $R_A\cdot2a = 3q_0a\cdot0{,}5a$.
          - valor: '1'
            mensaje: |
              Es la reacción sin el voladizo, $q_0\cdot2a/2$. La carga de BC
              hace de contrapeso sobre B y descarga A.
        pista: |
          Momentos respecto de B: la carga total $3q_0a$ actúa en el centro
          de AC, a $1{,}5a$ de A.
        desarrollo: |
          $R_A\cdot2a = 3q_0a\cdot(2a - 1{,}5a)$, así que $R_A = 0{,}75q_0a$, y
          $R_B = 3q_0a - 0{,}75q_0a = 2{,}25q_0a$.
      - tipo: calcular
        titulo: El flector en B
        pregunta: |
          ¿Cuánto vale el flector en B, en unidades de $q_0a^{2}$, con el
          signo del curso (positivo si tracciona la fibra de abajo)?
        respuesta:
          tipo: numero
          valor: '-0.5'
          tolerancia: 0.002
          formato: un número con su signo, el coeficiente de q0·a²
        distractores:
          - valor: '0.5'
            mensaje: |
              El valor es ese y el signo no: el voladizo cuelga y tracciona
              la fibra de arriba. Con el convenio del curso, negativo.
          - valor: '-1'
            mensaje: |
              Has puesto la resultante del voladizo, $q_0a$, en C, con brazo
              $a$. Actúa en el centro de BC, a $a/2$ de B.
        pista: |
          Corta en B y mira a la derecha: solo queda el voladizo con su
          carga.
        desarrollo: |
          $M_B = -q_0a\cdot a/2 = -0{,}5q_0a^{2}$: tracciona la fibra de
          arriba.
      - tipo: calcular
        titulo: El flector máximo positivo
        pregunta: |
          ¿Cuánto vale el flector máximo positivo, en unidades de
          $q_0a^{2}$?
        respuesta:
          tipo: numero
          valor: '0.28125'
          tolerancia: 0.002
          formato: un número, el coeficiente de q0·a²
        distractores:
          - valor: '0.5'
            mensaje: |
              Es $q_0(2a)^{2}/8$, el de una viga de luz $2a$ sin voladizo. El
              voladizo descarga A, y el máximo baja y se acerca a A.
          - valor: '1.125'
            mensaje: |
              Es $q_0(3a)^{2}/8$, como si la viga se apoyara en A y en C. El
              apoyo B está en $2a$.
        pista: |
          El flector es máximo donde se anula el cortante,
          $T = R_A - q_0x$ (ec. 7.15).
        desarrollo: |
          $T = 0$ en $x = 0{,}75a$, y allí

          $$
          M_{max} = R_Ax - \frac{q_0x^{2}}{2} = \frac{9}{16}q_0a^{2} - \frac{9}{32}q_0a^{2} = \frac{9}{32}q_0a^{2}
          $$

          Son $0{,}28125q_0a^{2}$, menos que $|M_B|$.
      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de cortantes y de flectores**, alineados
          bajo la viga, con los valores en A, B y C, el punto en que se
          anula el cortante, el flector máximo y el punto en que el flector
          cambia de signo. Convenio del tema 7: $dT/dx = -q$, $dM/dx = T$ y
          $M > 0$ si tracciona la fibra de abajo.
        comprueba:
          - punto: |
              **Cortante**: $\tfrac34q_0a$ en A, recta de pendiente $-q_0$
              que se anula en $x = \tfrac34a$ y llega a $-\tfrac54q_0a$ justo
              antes de B; en B salta $R_B = \tfrac94q_0a$, hasta $q_0a$, y
              baja en recta hasta cero en C.
            porque: |
              $dT/dx = -q$ (ec. 7.14): con carga uniforme, recta de pendiente
              $-q_0$. Cada fuerza concentrada, aquí las reacciones, es un
              salto de su valor, y en el extremo libre el cortante es nulo.
          - punto: |
              **Flector**: cero en A; parábola con su máximo,
              $\tfrac{9}{32}q_0a^{2}$, en $x = \tfrac34a$, que se anula en
              $x = \tfrac32a$ y llega a $-\tfrac12q_0a^{2}$ en B; otra
              parábola de B a C, que acaba en cero con tangente horizontal.
            porque: |
              $dM/dx = T$ (ec. 7.15): parabólico con carga uniforme, con
              tangente horizontal donde $T = 0$, y con un pico en B, donde el
              cortante salta.
          - punto: |
              **B manda**: $|M_B| = \tfrac12q_0a^{2}$ es mayor que el máximo
              positivo, y es negativo: tracciona la fibra de arriba.
            porque: |
              Es la sección candidata para el apartado b, aunque en una
              sección asimétrica hay que mirar también la del máximo
              positivo, que tracciona otra esquina.
        figura: |
          <svg viewBox="0 0 420 336" role="img" width="420" height="336" aria-labelledby="exerm1819-ext-6-la-viga-con-voladizo-y-seccion-en-l-dia-t exerm1819-ext-6-la-viga-con-voladizo-y-seccion-en-l-dia-d">
