asignatura: elasticidad-resistencia
curso: '2017-2018'
convocatoria: segundo-parcial
fecha: 19 de enero de 2018
# La segunda parte de Elasticidad y Resistencia de Materiales del 19 de
# enero de 2018: tres páginas, la 1 de TEORÍA (cuatro cuestiones de 1
# punto) y la 2 y la 3 de EJERCICIOS (tres de 2 puntos; el ejercicio 3 va
# solo en la página 3). Diez puntos en total, y el cuadernillo los imprime
# todos. El mismo día se hizo el examen final, que repite cinco de estas
# siete preguntas (punto 5).
#
# El cuadernillo es bilingüe, castellano a la izquierda y euskera a la
# derecha, y se transcribe **solo la columna en castellano**, tal cual. El
# euskera pide lo mismo en las siete preguntas.
#
# 1. **EL PDF Y EL WORD DICEN LO MISMO.** Hay Word del examen
#    (18-ERM-EME-urta2-ene2.docx) y se ha cotejado: el texto es el mismo.
#    Las letras griegas del ejercicio 1 (ΔT y α) son de la fuente Symbol, y
#    el texto del PDF y el del Word las pierden, aunque se ven en la
#    página. Los datos de la cuestión 4 («P = 10kN, E = 150 GPa,
#    sec(αL) = 2») y la fórmula de It del ejercicio 3 son imágenes, y se
#    transcriben. Las líneas sueltas con un solo «.» (debajo del
#    enunciado del ejercicio 2) no se copian.
#
# 2. **LO QUE LA FIGURA DICE Y EL TEXTO NO.**
#    - Cuestión 4: B está sobre el eje z, en el borde de la sección, a 3,5b
#      del centro, y la carga flexa la columna alrededor del eje y.
#    - Ejercicio 1: A es un apoyo articulado fijo; el canto de la viga no
#      está acotado y se toma la viga como una línea por C, A y D; el nudo B
#      del techo está sobre la mitad de CD. Las «c» sueltas del texto de la
#      figura son los círculos de las articulaciones, no letras.
#    - Ejercicio 3: AB es horizontal y CBD la cruza en B, perpendicular a
#      ella y en perspectiva. Las cotas 5t y 10t llegan en la figura a los
#      bordes de fuera; se toman como las medidas de la línea media de una
#      sección de pared delgada t (el t del apartado b). Con medidas
#      exteriores, la línea media sería de 4t × 9t, y las cifras cambiarían.
#    Cada lectura va también en la nota de su enunciado.
#
# 3. **ERRATAS Y GRAFÍAS DEL TEXTO, CONSERVADAS**: «10kN» sin espacio
#    (cuestión 4); «d2= 2d1» sin espacio antes del igual (ejercicio 2);
#    «b/.» con punto y «L =2 m» (ejercicio 3). La cuestión 3 se imprime
#    «3. (1p)», con espacio, y las otras tres de la página sin él.
#
# 4. **DOS NUMERACIONES EN UN CUADERNILLO.** La teoría va de la 1 a la 4 y
#    los ejercicios vuelven a empezar en 1. Aquí la teoría son **n 1 a 4** y
#    los ejercicios **n 5, 6 y 7**; la `fuente` de cada ejercicio dice el
#    nombre impreso. Ninguna pregunta se parte.
#
# 5. **PREGUNTAS REPETIDAS.**
#    - La **cuestión 1**, «1.(1p) Teorema del flujo cortante.», es palabra
#      por palabra la cuestión 3 de la final de enero de 2021, ya en el
#      sitio (`exerm2021-ord-3-el-teorema-del-flujo-cortante`), con el
#      mismo punto. Se apunta a ella, como ya hacen 2018-2019 y 2019-2020.
#    - La **cuestión 3**, «Ecuación diferencial de la curva elástica.», es
#      la cuestión 3 de la extraordinaria de junio de 2019, ya en el sitio
#      (`exerm1819-ext-3-la-ecuacion-diferencial-de-la-curva-elastica`), con
#      el mismo punto; allí va impresa «3.(1p)», sin el espacio.
#    - La **cuestión 4** y los **ejercicios 1 y 3** cayeron igual el mismo
#      día en el examen final: la cuestión con el mismo número y el mismo
#      punto, y los ejercicios como 2 y 4, con 1,5 puntos. Se resuelven aquí
#      y la final apunta a ellos. Los dos ejercicios se transcriben sin su
#      «(2p)»: cada hoja pone sus puntos desde `puntosImpresos`, y la
#      `fuente` dice los dos valores.
#    - El **ejercicio 2** también cayó en la final, como ejercicio 3, pero
#      con una palabra más («…que corresponde a d1 y siendo d2= 2d1.»): la
#      final lo lleva como ejercicio propio, resuelto por otro camino (los
#      teoremas de Mohr; aquí, la viga conjugada).
#
# 6. **LOS TEMAS.** El ejercicio 3 va al tema 13: se pide un desplazamiento
#    con la energía de flexión y de torsión; su apartado b es flexión
#    esviada del tema 9 y la torsión es la del tema 12. El ejercicio 2 va
#    al tema 10.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso y de un segundo camino (fase-p/p9l,
# guiones/cifras.mjs). La cuestión 2 no trae números: los pasos de cálculo
# son un ejemplo nuestro, y lo dicen.
pdf: 2017-2018-2par.pdf
puntosImpresos:
  fuente: Cabecera de cada pregunta, «(1p)» en la teoría y «(2p)» en los ejercicios, págs. 1-3 del cuadernillo.
  reparto:
    - { n: 1, puntos: 1 }
    - { n: 2, puntos: 1 }
    - { n: 3, puntos: 1 }
    - { n: 4, puntos: 1 }
    - { n: 5, puntos: 2 }
    - { n: 6, puntos: 2 }
    - { n: 7, puntos: 2 }

