ejercicios:
  # ── Teoría · cuestión 2 · las secciones cerradas de pequeño espesor (tema 12).
  - id: exerm1718-2par-2-la-torsion-de-las-secciones-cerradas-de-pequeno-espesor
    titulo: La torsión de las secciones cerradas de pequeño espesor, del equilibrio de la pared a la rigidez
    fuente: >-
      Cuestión 2 de teoría · Segunda parte del 19 de enero de 2018 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 12, apartado 12.5
      (págs. 11 a 14). Los números de los pasos de cálculo son un ejemplo
      nuestro, comprobado con el motor del curso y por un segundo camino.
    nivel: examen
    enunciado: |
      (1p) Torsión: secciones cerradas de pequeño espesor.
    pide: >-
      La teoría de la torsión de las secciones cerradas de pequeño espesor,
      con la tensión tangencial y el ángulo girado, y, en un ejemplo nuestro,
      un tubo cerrado frente al mismo tubo rajado a lo largo.
    pasos:
      - tipo: reconocer
        pregunta: |
          En una sección cerrada de pequeño espesor sometida a torsión, ¿qué
          magnitud es la misma en todos los puntos de la línea media?
        opciones:
          - texto: >-
              El flujo cortante $q = \tau t$, el producto de la tensión por el
              espesor de la pared
            correcta: true
            mensaje: |
              Eso es (ec. 12.21, p. 11). Las tensiones son uniformes en el
              espesor, y el equilibrio según $x$ de un trozo de pared entre dos
              cortes longitudinales da $\tau_At_A = \tau_Bt_B$. Donde la pared
              adelgaza, la tensión crece en la misma proporción.
          - texto: >-
              La tensión tangencial $\tau$, porque la sección es cerrada
            mensaje: |
              Solo si el espesor es uniforme. Lo que el equilibrio de la pared
              deja constante es el producto $\tau t$ (ec. 12.21): en un trozo
              de la mitad de espesor, la tensión es el doble.
          - texto: >-
              Ninguna: la tensión es nula en la línea media y crece hacia las
              dos caras, como en la sección abierta
            mensaje: |
              Ese es el reparto de la sección abierta de pequeño espesor
              (analogía de la membrana, p. 10), con la máxima en las caras. En
              la cerrada la tensión es uniforme en el espesor y circula por
              toda la pared, como un flujo (p. 11).
          - texto: >-
              El ángulo que forma la tensión con el radio trazado desde el
              centro de la sección
            mensaje: |
              Eso no lo fija nada: la tensión va tangente a la línea media, y
              el brazo $r$ que entra en el torsor es la distancia del punto de
              referencia a esa tangente (ec. 12.22), que cambia de un punto a
              otro.
      - tipo: calcular
        titulo: La tensión en el tubo cerrado
        pregunta: |
          Un tubo de radio medio $R$ = 50 mm y espesor $t$ = 2 mm transmite
          un momento torsor $M_t$ = 1 kN·m. ¿Qué tensión tangencial tiene, en
          MPa?
        respuesta:
          tipo: numero
          valor: '31.83'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '397.89'
            mensaje: |
              Has tomado como $A_t$ el área de material de la pared,
              $2\pi Rt$. $A_t$ es el área **encerrada** por la línea media,
              $\pi R^2$, con el hueco dentro (p. 12): por eso en estas
              secciones lo que resiste es el hueco.
          - valor: '63.66'
            mensaje: |
              El doble: falta el 2 de $\tau = M_t/(2A_tt)$ (ec. 12.24). Sale
              de que el área que barre el radio al recorrer $ds$ es la mitad
              de $r\,ds$: $dA_t = \tfrac{1}{2}r\,ds$.
          - valor: '2387.32'
            mensaje: |
              Es la tensión del tubo **rajado**, con la fórmula de la sección
              abierta, $\tau_{max} = M_tt/I_t$ e $I_t = \tfrac{1}{3}st^3$ (ecs.
              12.17 y 12.19). El tubo del enunciado está cerrado, y la fórmula
              es la de la ec. 12.24.
        pista: |
          $\tau = \dfrac{M_t}{2A_tt}$ (ec. 12.24), con $A_t$ el área encerrada
          por la línea media y $M_t$ en N·mm.
        desarrollo: |
          $A_t = \pi R^2 = 7854{,}0$ mm² y

          $$
          \tau = \frac{M_t}{2A_tt} = \frac{10^6}{2\cdot7854{,}0\cdot2} = 31{,}83\ \text{MPa}
          $$

          El flujo cortante es $q = \tau t = 63{,}66$ N/mm, el mismo en toda
          la pared.
      - tipo: calcular
        titulo: El tubo cerrado frente al rajado
        pregunta: |
          Se raja el tubo a lo largo de una generatriz, y la sección pasa a ser
          abierta. ¿Cuántas veces es más rígido a torsión el tubo cerrado que
          el rajado (el cociente de sus $I_t$)?
        respuesta:
          tipo: numero
          valor: '1875'
          tolerancia: 5
          formato: un número, sin unidades
        distractores:
          - valor: '75'
            mensaje: |
              Ese es el cociente de las **tensiones**, $3R/t$: con el mismo par,
              el tubo rajado trabaja 75 veces más tensionado. La rigidez va con
              $I_t$, y su cociente es $3(R/t)^2$, otras 25 veces más.
          - valor: '625'
            mensaje: |
              Falta el 3. El $I_t$ de la sección abierta lleva un tercio,
              $I_t = \tfrac{1}{3}st^3$ (ec. 12.19), así que el cociente es
              $2\pi R^3t/(\tfrac{1}{3}\,2\pi Rt^3) = 3(R/t)^2$.
        pista: |
          Cerrado: $I_t = \dfrac{4A_t^2}{\oint ds/t}$ (ec. 12.29). Rajado:
          $I_t = \tfrac{1}{3}\sum t^3s$ (ecs. 12.19 y 12.20), con
          $s = 2\pi R$.
        desarrollo: |
          Cerrado: $I_t = \dfrac{4(\pi R^2)^2}{2\pi R/t} = 2\pi R^3t = 1\,570\,796$ mm⁴.
          Rajado: $I_t = \tfrac{1}{3}\,2\pi R\,t^3 = 837{,}8$ mm⁴. El
          cociente:

          $$
          \frac{2\pi R^3t}{\tfrac{1}{3}\,2\pi Rt^3} = 3\left(\frac{R}{t}\right)^2 = 3\cdot25^2 = 1875
          $$
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la respuesta como en el examen: del equilibrio de un trozo de
          pared al flujo cortante, la relación entre el torsor y la tensión, y
          el ángulo girado por unidad de longitud.
        rubrica:
          - punto: >-
              Se aísla un trozo de pared entre dos cortes longitudinales y, con
              las tensiones uniformes en el espesor, el equilibrio según x da
              τA·tA = τB·tB: el flujo cortante q = τt es el mismo en toda la
              línea media (ec. 12.21).
            porque: >-
              Es la propiedad de la que sale todo lo demás, y la que distingue
              la sección cerrada de la abierta.
            minimo: true
          - punto: >-
              Se escribe el momento de la fuerza τt·ds respecto de un punto,
              dMt = τt·r·ds, y se integra a lo largo de la línea media con
              dAt = ½r·ds: Mt = 2At·τt, es decir, τ = Mt/(2At·t) (ecs. 12.22 a
              12.24).
            porque: >-
              Es la relación entre la tensión y el esfuerzo, la que se usa para
              comprobar una sección.
            minimo: true
          - punto: >-
              Se dice que At es el área encerrada por la línea media, hueco
              incluido, y que la tensión máxima está donde el espesor es
              mínimo.
            porque: >-
              Es la consecuencia práctica: resiste el hueco, no la cantidad de
              material, y por eso estas secciones son las mejores a torsión
              (p. 12).
            minimo: true
          - punto: >-
              Se iguala el trabajo del torsor en una rebanada, ½Mt·dφ, con su
              energía de deformación, Mt²·dx/(8At²G)·∮ds/t (ecs. 12.25 a
              12.28).
            porque: >-
              Es el camino de los apuntes a la rigidez, sin hipótesis sobre
              los desplazamientos.
          - punto: >-
              Se llega a φ,x = Mt/(GIt) con It = 4At²/∮ds/t (ec. 12.29), que se
              vuelve un sumatorio cuando la pared son trozos rectos de espesor
              constante.
            porque: >-
              Da el ángulo girado y la rigidez a torsión GIt de la sección.
            minimo: true
          - punto: >-
              Se compara con la sección abierta del mismo perímetro y espesor:
              en un tubo, la cerrada es 3(R/t)² veces más rígida y trabaja
              3R/t veces menos tensionada.
            porque: >-
              Junta los apartados 12.4 y 12.5 y explica por qué un tubo rajado
              no sirve como eje.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Las tensiones son uniformes en el espesor, y el equilibrio de un
              trozo de pared según $x$ da $\tau_At_A = \tau_Bt_B$: el flujo
              $q = \tau t$ es constante.
          - texto: >-
              El momento de la fuerza $q\,ds$ respecto de un punto es
              $q\,r\,ds = 2q\,dA_t$, e integrando a lo largo de la línea media,
              $M_t = 2A_tq$.
          - texto: >-
              Así $\tau = M_t/(2A_tt)$, máxima donde la pared es más delgada.
          - texto: >-
              Igualando el trabajo del torsor con la energía de la rebanada
              sale $\varphi_{,x} = M_t/(GI_t)$, con
              $I_t = 4A_t^2/\oint ds/t$.
          - texto: >-
              La tensión máxima está en el trozo de pared más grueso, como en
              la sección abierta.
            trampa: true
            mensaje: |
              Es al revés que en la abierta. Allí
              $\tau_{max} = M_tt_{max}/I_t$ (ec. 12.17) y manda el espesor
              máximo; aquí el flujo $q = \tau t$ es constante, así que
              $\tau = q/t$ es máxima donde $t$ es mínimo (ec. 12.24).
    resolucion: |
      **El flujo cortante.** Según la analogía de Prandtl, en una sección
      cerrada de pequeño espesor las tensiones tangenciales son uniformes en el
      espesor y van tangentes a la línea media (apuntes del tema 12, apartado
      12.5, p. 11). Se aísla un trozo de pieza de longitud $dx$ cortado por dos
      planos longitudinales, con espesores $t_A$ y $t_B$ en los cortes. Las
      tensiones de la sección tienen su pareja en los cortes longitudinales, y
      el equilibrio según $x$ da

      $$
      \tau_At_A\,dx = \tau_Bt_B\,dx\quad\Rightarrow\quad q = \tau t = \text{cte.}\qquad\text{(ec. 12.21)}
      $$

      **El torsor y la tensión.** La fuerza sobre un elemento de pared es
      $dF = \tau t\,ds = q\,ds$, y su momento respecto de un punto,
      $dM_t = q\,r\,ds$, con $r$ la distancia de ese punto a la tangente
      (ec. 12.22). Como $\tfrac{1}{2}r\,ds$ es el área del triángulo que barre
      el radio, $dA_t = \tfrac{1}{2}r\,ds$, e integrando a lo largo de la
      línea media $L$ (ec. 12.23):

      $$
      M_t = q\oint_L r\,ds = 2A_tq\quad\Rightarrow\quad \tau = \frac{M_t}{2A_tt}\qquad\text{(ec. 12.24)}
      $$

      $A_t$ es el área encerrada por la línea media, con el hueco. La tensión
      máxima está donde el espesor es mínimo, y lo que más resiste es el hueco,
      no la cantidad de material: por eso las secciones cerradas de pequeño
      espesor son las más adecuadas a torsión (p. 12).

      **La rigidez.** El trabajo del torsor en una rebanada es
      $dW_t = \tfrac{1}{2}M_t\,d\varphi$ (ec. 12.25). Con solo tensiones
      tangenciales, $U_0 = \tau^2/(2G)$ (ec. 12.26), y la energía de la
      rebanada, con $\tau = M_t/(2A_tt)$, es

      $$
      dU_t = \oint_L\frac{\tau^2}{2G}\,t\,ds\,dx = \frac{M_t^2}{8A_t^2G}\oint_L\frac{ds}{t}\,dx\qquad\text{(ecs. 12.27 y 12.28)}
      $$

      Igualando las dos,

      $$
      \varphi_{,x} = \frac{M_t}{GI_t},\qquad I_t = \frac{4A_t^2}{\oint_L ds/t}\qquad\text{(ec. 12.29)}
      $$

      Si la pared son trozos rectos de espesor uniforme, la integral es un
      sumatorio, $\sum s_i/t_i$. Como entra $A_t$, el hueco también aumenta la
      rigidez.

      **Un ejemplo nuestro.** Un tubo de radio medio $R$ = 50 mm y espesor
      $t$ = 2 mm con $M_t$ = 1 kN·m: $A_t = \pi R^2 = 7854{,}0$ mm², y
      $\tau = M_t/(2A_tt) = 31{,}83$ MPa; su
      $I_t = 2\pi R^3t = 1\,570\,796$ mm⁴. Si se raja a lo largo, la sección
      es abierta: $I_t = \tfrac{1}{3}\,2\pi Rt^3 = 837{,}8$ mm⁴ y
      $\tau_{max} = M_tt/I_t = 2387{,}3$ MPa. El cerrado es
      $3(R/t)^2 = 1875$ veces más rígido y trabaja $3R/t = 75$
      veces menos tensionado. El motor del curso da lo mismo.

