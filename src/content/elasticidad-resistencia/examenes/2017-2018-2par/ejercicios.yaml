      **Notas nuestras.** A es un apoyo articulado fijo. El canto de la viga
      no está acotado, y se toma la viga como una línea que pasa por C, A y
      D. B, el nudo del techo, está
      sobre la mitad de CD.
    pide: >-
      Las fuerzas de las dos barras y el desplazamiento del extremo D, en
      función de E, A, α, ΔT y a.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular: ¿qué clase de problema es?
        opciones:
          - texto: >-
              Hiperestático de grado 1: la viga solo puede girar alrededor de
              A, y las fuerzas de las dos barras no salen de la estática
            correcta: true
            mensaje: |
              Eso es. La articulación A le quita a la viga los dos
              desplazamientos y le deja el giro. Hay cuatro incógnitas, $N_1$,
              $N_2$ y las dos reacciones de A, para tres ecuaciones; la de
              momentos respecto de A liga $N_1$ y $N_2$, pero no las separa.
              Falta una de compatibilidad: con la viga rígida, los dos
              alargamientos dependen del mismo giro (tema 8, p. 4).
          - texto: >-
              Isostático: como no hay ninguna carga, las barras no trabajan
            mensaje: |
              Sin cargas trabajan igual. La barra 1 quiere alargarse
              $\alpha\Delta T L_1$, y la viga, sujeta en A y por la barra 2, no
              la deja: en un sistema hiperestático, una dilatación impedida da
              fuerzas aunque no haya cargas.
          - texto: >-
              Un mecanismo, porque la viga puede girar alrededor de A
            mensaje: |
              Giraría si no hubiera barras. Con las dos, cualquier giro alarga
              una y acorta la otra, y las dos se oponen: el giro está impedido,
              y por partida doble.
          - texto: >-
              Hiperestático de grado 2, porque hay dos barras y además la
              articulación de A
            mensaje: |
              Cuenta las incógnitas: $N_1$ y $N_2$, más las dos reacciones de
              A, cuatro; la viga en el plano da tres ecuaciones de equilibrio.
              El grado es la diferencia, 1.
      - tipo: calcular
        titulo: La fuerza de la barra 1
        pregunta: |
          Escribe la fuerza de la barra 1 como $N_1 = k\,EA\alpha\Delta T$,
          positiva a tracción. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '-0.90'
          tolerancia: 0.005
          formato: un número, k (positivo a tracción)
        distractores:
          - valor: '0'
            mensaje: |
              Es lo que pasaría si la barra 1 pudiera dilatarse libre. No
              puede: al alargarse, empuja C hacia abajo, la viga gira
              alrededor de A y D sube, acortando la barra 2, que se resiste.
              Las dos acaban con fuerza.
          - valor: '0.90'
            mensaje: |
              El valor, pero con el signo cambiado. Has escrito el alargamiento
              como $N_1L/EA - \alpha\Delta TL$. La dilatación se suma,
              $\delta_1 = N_1L/EA + \alpha\Delta TL$ (ec. 8.9), y como la barra
              no llega a alargarse todo lo que querría, $N_1$ sale de
              compresión.
          - valor: '-1.125'
            mensaje: |
              Has tomado $\delta_2 = +3\delta_1$. Al girar la viga, C baja y D
              sube: C se aleja de B y D se acerca. La barra 1 se alarga y la 2
              se acorta, $\delta_2 = -3\delta_1$.
          - valor: '-0.50'
            mensaje: |
              Has cambiado los brazos en $\sum M_A$. $N_1$ actúa en C, a $a$ de
              A, y $N_2$ en D, a $3a$, las dos con el mismo ángulo de 30°: la
              barra 1, con el brazo corto, es la que lleva la fuerza mayor,
              $N_1 = 3N_2$.
        pista: |
          Equilibrio: $\sum M_A = 0$, con los brazos $a$ y $3a$ y el mismo
          ángulo de 30°. Compatibilidad: si la viga gira $\theta$ alrededor de
          A, C baja $a\theta$ y D sube $3a\theta$, y cada alargamiento es la
          proyección de ese desplazamiento sobre su barra.
        desarrollo: |
          $\sum M_A = 0$: $N_1\,a\sin30^\circ = N_2\,3a\sin30^\circ$, así que
          $N_1 = 3N_2$. Proyectando sobre las barras,
          $\delta_1 = \tfrac{1}{2}a\theta$ y $\delta_2 = -\tfrac{3}{2}a\theta$:
          $\delta_2 = -3\delta_1$. Con las dos barras de la misma longitud $L$,

          $$
          \frac{N_2L}{EA} = -3\left(\frac{N_1L}{EA} + \alpha\Delta T L\right)
          \quad\Rightarrow\quad N_2 = -9N_2 - 3EA\alpha\Delta T
          $$

          $N_2 = -0{,}3\,EA\alpha\Delta T$ y $N_1 = 3N_2 = -0{,}9\,EA\alpha\Delta T$:
          $k = -0{,}9$, compresión.
      - tipo: calcular
        titulo: El desplazamiento de D
        pregunta: |
          ¿Cuánto se desplaza D en vertical? Escríbelo como
          $v_D = k\,a\alpha\Delta T$, con $k$ positivo hacia arriba.
        respuesta:
          tipo: numero
          valor: '1.3856'
          tolerancia: 0.002
          formato: un número, k (positivo hacia arriba)
        distractores:
          - valor: '13.856'
            mensaje: |
              Es el giro libre, como si la barra 2 no estuviera: la barra 1 se
              alargaría $\alpha\Delta T L$ entero. La barra 2 frena el giro, y
              la 1 solo llega a alargarse una décima parte de eso,
              $(-0{,}9 + 1)\alpha\Delta TL$.
          - valor: '0.6928'
            mensaje: |
              Has tomado el alargamiento de la barra 1 como el desplazamiento
              vertical de C, $\delta_1 = a\theta$, sin proyectar sobre la barra:
              el giro sale la mitad, y D sube la mitad. El mismo número es el
              acortamiento de la barra 2, $|\delta_2|$: la proyección del
              desplazamiento de D sobre la barra, no el desplazamiento.
          - valor: '-1.3856'
            mensaje: |
              El valor es ese, pero D sube. La barra 1 se alarga y empuja C
              hacia abajo, alejándolo de B; la viga gira en sentido antihorario
              alrededor de A, y D, al otro lado de A, sube.
        pista: |
          $\delta_1 = N_1L/EA + \alpha\Delta TL$, con $L = 4a/\sqrt{3}$; el
          giro sale de $\delta_1 = \tfrac{1}{2}a\theta$, y $v_D = 3a\theta$.
        desarrollo: |
          $\delta_1 = (-0{,}9 + 1)\,\alpha\Delta T\cdot\dfrac{4a}{\sqrt{3}} = \dfrac{0{,}4}{\sqrt{3}}\,a\alpha\Delta T$,
          $\theta = \dfrac{2\delta_1}{a} = \dfrac{0{,}8}{\sqrt{3}}\,\alpha\Delta T$ y

          $$
          v_D = 3a\theta = \frac{2{,}4}{\sqrt{3}}\,a\alpha\Delta T = \frac{4\sqrt{3}}{5}\,a\alpha\Delta T
          $$

          hacia arriba: $k = 4\sqrt{3}/5 = 1{,}3856$. En horizontal, nada: la
          viga gira alrededor de A, que está en su eje.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza sobra.
        piezas:
          - texto: >-
              Con A fija, la viga solo puede girar un ángulo $\theta$ alrededor
              de A; $\sum M_A = 0$ liga las dos fuerzas, $N_1 = 3N_2$.
          - texto: >-
              Al girar, C baja $a\theta$ y D sube $3a\theta$; proyectando sobre
              cada barra, $\delta_1 = \tfrac{1}{2}a\theta$ y
              $\delta_2 = -\tfrac{3}{2}a\theta$, es decir,
              $\delta_2 = -3\delta_1$.
          - texto: >-
              Con $\delta_1 = N_1L/EA + \alpha\Delta TL$ y
              $\delta_2 = N_2L/EA$, sale $N_2 = -0{,}3\,EA\alpha\Delta T$ y
              $N_1 = -0{,}9\,EA\alpha\Delta T$.
          - texto: >-
              El alargamiento de la barra 1 da el giro, y el giro, el
              desplazamiento de D: $v_D = 3a\theta$.
          - texto: >-
              La barra 2 no se calienta, así que no tiene fuerza: solo trabaja
              la barra 1.
            trampa: true
            mensaje: |
              La fuerza de la barra 1 sobre la viga tiene momento respecto de
              A, y lo único que puede equilibrarlo es la barra 2:
              $N_1 = 3N_2$. Si $N_2$ fuera nula, $N_1$ también, y la barra 1 se
              dilataría libre; pero entonces la viga giraría y acortaría la 2,
              que se resiste.
    resolucion: |
      **La geometría.** Con A en el origen, $x$ a la derecha e $y$ hacia
      arriba: C $(-a, 0)$, D $(3a, 0)$ y B, en el techo sobre la mitad de CD,
      $(a,\ 2a\tan30^\circ) = (a,\ 2a/\sqrt{3})$. Las dos barras forman 30°
      con la viga y miden lo mismo, $L = 2a/\cos30^\circ = 4a/\sqrt{3}$. La
      viga se toma como una línea por C, A y D (su canto no está acotado).

      **Es hiperestático de grado 1** (tema 8, p. 4): la viga, articulada en
      A, solo puede girar, y las dos barras le dan dos fuerzas que la estática
      no separa.

      **El equilibrio.** Con $N_1$ y $N_2$ positivas a tracción, cada barra
      tira de la viga hacia B. Las componentes horizontales pasan por A; las
      verticales, $N_1\sin30^\circ$ en C y $N_2\sin30^\circ$ en D, dan
      momentos de sentido contrario:

      $$
      \textstyle\sum M_A = 0:\quad N_1\,a\sin30^\circ = N_2\,3a\sin30^\circ\quad\Rightarrow\quad N_1 = 3N_2
      $$

      **La compatibilidad.** La viga gira un ángulo pequeño $\theta$
      (antihorario positivo) alrededor de A: C baja $a\theta$ y D sube
      $3a\theta$. Cada alargamiento es la proyección del desplazamiento del
      extremo sobre la dirección de B hacia la viga (ec. 8.12, p. 8): con
      $(-\cos30^\circ, -\sin30^\circ)$ para la barra 1 y
      $(\cos30^\circ, -\sin30^\circ)$ para la 2,

      $$
      \delta_1 = \tfrac{1}{2}a\theta,\qquad \delta_2 = -\tfrac{3}{2}a\theta\qquad\Rightarrow\qquad \delta_2 = -3\delta_1
      $$

      **La ley de comportamiento** (ec. 8.9, p. 7): la barra 1 lleva la
      dilatación, $\delta_1 = N_1L/EA + \alpha\Delta TL$, y la 2 no,
      $\delta_2 = N_2L/EA$. Sustituyendo,

      $$
      N_2 = -3N_1 - 3EA\alpha\Delta T = -9N_2 - 3EA\alpha\Delta T
      $$

      **a) Las fuerzas.**

      $$
      N_1 = -0{,}9\,EA\alpha\Delta T,\qquad N_2 = -0{,}3\,EA\alpha\Delta T
      $$

      Las dos a compresión (con $\Delta T > 0$). La barra 1 quiere alargarse
      $\alpha\Delta TL$ y solo llega a $\delta_1 = 0{,}1\,\alpha\Delta TL$; la
      2 se acorta $|\delta_2| = 0{,}3\,\alpha\Delta TL$. Las reacciones de A
      equilibran las dos fuerzas: $A_x = 0{,}3\sqrt{3}\,EA\alpha\Delta T$
      (hacia la derecha) y $A_y = 0{,}6\,EA\alpha\Delta T$ (hacia arriba).

      **b) El desplazamiento de D.** Con $L = 4a/\sqrt{3}$,
      $\delta_1 = \dfrac{0{,}4}{\sqrt{3}}\,a\alpha\Delta T$ y
      $\theta = 2\delta_1/a = \dfrac{0{,}8}{\sqrt{3}}\,\alpha\Delta T$, en
      sentido antihorario. D sube

      $$
      v_D = 3a\theta = \frac{4\sqrt{3}}{5}\,a\alpha\Delta T
      $$

      es decir, $1{,}3856\,a\alpha\Delta T$, y no se mueve en horizontal;
      C baja $a\theta = 0{,}4619\,a\alpha\Delta T$.

      Las cifras salen del motor del curso (la viga como sólido rígido
      articulado en A, con la barra 1 calentada) y de las cuentas de arriba, y
      casan.

  # ── Ejercicio 2 · la pieza de dos diámetros con voladizo (tema 10). La final
  #    del mismo día la repite con una palabra más: va como ejercicio propio.
  - id: exerm1718-2par-6-la-pieza-de-dos-diametros-con-voladizo
    titulo: La pieza circular de dos diámetros, apoyada en A y B y con un voladizo cargado
    fuente: >-
      Ejercicio 2 · Segunda parte del 19 de enero de 2018 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 2 puntos. El examen final del mismo día lo repite como ejercicio 3,
      con 1,5 puntos y una palabra más en el enunciado, y allí se resuelve
      por otro camino. El examen no publica resolución; el desarrollo es
      nuestro, con el tema 10, y las cifras salen del motor del curso y de un
      segundo camino.
    nivel: examen
    enunciado: |
      La pieza de sección circular de la figura está simplemente apoyada y
      tiene un voladizo que soporta la carga distribuida de la figura.
      Determinar los ángulos girados en B y C y el desplazamiento en C en
      función de $q_0$, $b$, $E$ e $I_z$, siendo éste el momento de inercia que
      corresponde a $d_1$, siendo $d_2$= $2d_1$.

