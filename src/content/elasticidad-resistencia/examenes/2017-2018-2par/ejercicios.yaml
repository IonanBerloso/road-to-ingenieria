      **Notas nuestras.** De la figura: AB es horizontal; la barra CBD cruza
      AB en B, horizontal y perpendicular a ella (dibujada en perspectiva),
      con C a un lado y D al otro; la carga $4q_0$ es vertical, hacia abajo,
      sobre BC, y la $q_0$ es horizontal, paralela a AB y hacia A, sobre BD.
      Se toman $x$ de A a B, $y$ hacia abajo, como en la figura, y
      $z = x\times y$: C queda en $z = L$ y D en $z = -L$. Las cotas $5t$ y
      $10t$ llegan en la figura a los bordes de fuera; se toman como las
      medidas de la línea media de una sección de pared delgada $t$ (el $t$
      del apartado b). Con medidas exteriores, la línea media sería de
      $4t\times9t$, y las cifras cambiarían. Se conservan «b/.» y
      «$L$ =2 m».
    pide: >-
      El desplazamiento vertical de D en función de q0, L, E e Iz, y, con los
      datos, la tensión normal máxima de tracción y el punto donde se da.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para el desplazamiento vertical de D con la carga unidad, ¿qué
          esfuerzos entran en la cuenta?
        opciones:
          - texto: >-
              Solo los de AB: su flector vertical y su torsor, que dan a la vez
              las cargas reales y la carga unidad en D
            correcta: true
            mensaje: |
              Eso es. Cada término es el producto del esfuerzo real por el de
              la carga unidad (tema 13, tabla de la p. 16, y apartado 13.6). La
              unidad vertical en D flecta BD en vertical, pero BD no tiene
              flector vertical real (su carga es horizontal); en BC la unidad no
              da nada. En AB, las dos dan flector vertical y torsor.
          - texto: >-
              Los de los tres tramos, porque los tres están cargados
            mensaje: |
              Estar cargado no basta: cada término es el producto del esfuerzo
              real por el de la unidad. En BC la unidad no da esfuerzos, y en
              BD el flector real es horizontal y el de la unidad, vertical.
          - texto: >-
              Solo el flector de AB: el torsor no hace bajar ni subir D
            mensaje: |
              El torsor de AB gira la sección B alrededor de AB, y D, a una
              distancia $L$ de ese eje, sube o baja con ese giro. El enunciado
              pide contarlo, y aquí es el término que manda.
          - texto: >-
              Los de BD, porque D está en BD
            mensaje: |
              BD lleva la carga horizontal, que la flecta en el plano
              horizontal; la unidad vertical la flecta en el vertical. Son
              flectores alrededor de ejes distintos, y en la energía cada uno
              solo se multiplica por el del mismo eje: BD no aporta nada.
      - tipo: calcular
        titulo: El desplazamiento vertical de D
        pregunta: |
          Escribe el desplazamiento vertical de D como
          $\delta_D = k\,q_0L^4/(EI_z)$, positivo hacia abajo. ¿Cuánto vale
          $k$?
        respuesta:
          tipo: numero
          valor: '-4.917'
          tolerancia: 0.1
          formato: un número, k (positivo hacia abajo)
        distractores:
          - valor: '1.333'
            mensaje: |
              Es solo la flexión de AB, $4q_0L^4/(3EI_z)$, hacia abajo. Falta la
              torsión, que es mayor y de signo contrario: el torsor de las
              cargas hace girar AB hacia el lado de C, y D, al otro lado, sube.
          - valor: '7.583'
            mensaje: |
              Has sumado la torsión con el mismo signo que la flexión. El torsor
              real ($4q_0L$ con su brazo del lado de C) y el de la unidad (con
              el brazo del lado de D) son de sentido contrario: su producto
              resta.
          - valor: '-1.167'
            mensaje: |
              Has puesto $EI_t$ en la torsión. La rigidez a torsión es $GI_t$,
              con $G = E/2{,}5$: $GI_t = 0{,}32EI_z$, no $0{,}8EI_z$.
          - valor: '-5.776'
            mensaje: |
              Es lo que sale si $5t$ y $10t$ son medidas exteriores: la línea
              media es entonces de $4t\times9t$, con
              $I_z = 283{,}5t^4$ e $I_t = 199{,}4t^4$. Aquí se toman como las
              de la línea media (notas del enunciado), y la sección sale con
              $I_t = 0{,}8I_z$.
          - valor: '4.917'
            mensaje: |
              El valor es ese, pero D sube. El torsor de AB gira la sección B
              hacia el lado de C, levanta D y pesa más que la flexión, que lo
              baja: $k = 4/3 - 25/4 = -59/12$, negativo con el convenio de
              abajo positivo.
        pista: |
          Carga unidad vertical en D. En AB, a distancia $u$ de B, el real da
          $|M| = 4q_0Lu$ y $|M_t| = 4q_0L\cdot L/2$; la unidad,
          $|m| = u$ y $|m_t| = L$, con el brazo del otro lado.
          $\delta_D = \int Mm/EI_z + \int M_tm_t/GI_t$.
        desarrollo: |
          Flexión: $\displaystyle\int_0^L\frac{4q_0Lu\cdot u}{EI_z}du = \frac{4q_0L^4}{3EI_z}$.
          Torsión: $\displaystyle\int_0^L\frac{2q_0L^2\cdot(-L)}{GI_t}du = -\frac{2q_0L^4}{GI_t}$,
          con $GI_t = \dfrac{E}{2{,}5}\cdot0{,}8I_z = 0{,}32EI_z$:

          $$
          k = \frac{4}{3} - \frac{2}{0{,}32} = -\frac{59}{12} = -4{,}917
          $$

          D sube.
      - tipo: calcular
        titulo: La tensión normal máxima de tracción
        pregunta: |
          Con $q_0$ = 5 kN/m, $L$ = 2 m y $t$ = 10 mm, ¿cuál es la tensión
          normal máxima de tracción, en MPa? Tómala con las propiedades de
          pequeño espesor, en la línea media de la pared.
        respuesta:
          tipo: numero
          valor: '1128.1'
          tolerancia: 4
          formato: un número, en MPa
        distractores:
          - valor: '956.7'
            mensaje: |
              Es solo el flector vertical de A (con el axil). En A hay también
              un flector horizontal, $q_0L^2/2$: la carga de BD empuja AB hacia
              A con un brazo de $L/2$ en $z$, y tracciona la cara del lado de
              C.
          - valor: '1016.7'
            mensaje: |
              Has dividido el flector horizontal por $I_z$. Ese flector hace
              girar la sección alrededor de su eje vertical, el débil: va con
              $I_y = 875t^4/6$, y su fibra más alejada está a $2{,}5t$.
          - valor: '480.0'
            mensaje: |
              Es la máxima del arranque de BC, en B. En A el flector vertical
              es el doble ($4q_0L^2$ frente a $2q_0L^2$), y se le suma el
              horizontal.
          - valor: '1258.4'
            mensaje: |
              Has tomado el punto en la esquina de fuera ($y = 5{,}5t$,
              $z = 3t$) con las inercias de la línea media: mezclas dos
              modelos. En el de pequeño espesor la pared es su línea media.
              Con la sección real, por fuera de $6t\times11t$, en esa esquina
              salen unos 1238 MPa, un 10 % más.
          - valor: '1507.9'
            mensaje: |
              Es lo que sale si $5t$ y $10t$ son medidas exteriores: la
              línea media es entonces de $4t\times9t$, con $A = 26t^2$,
              $I_z = 283{,}5t^4$ e $I_y = 82{,}67t^4$. Aquí se toman como las
              de la línea media (notas del enunciado).
        pista: |
          En A: $N = -q_0L$, el flector vertical $4q_0L^2$ (tracciona arriba)
          y el horizontal $q_0L^2/2$ (tracciona el lado de C).
          $\sigma = N/A + M_zy/I_z + M_yz/I_y$ en la esquina de arriba del lado
          de C.
        desarrollo: |
          $A = 30t^2 = 3000$ mm², $I_z = 1250t^4/3$ e $I_y = 875t^4/6$, con
          $t$ = 10 mm. En la esquina ($y = -5t$, $z = 2{,}5t$):

          $$
          \sigma = -\frac{10^4}{3000} + \frac{8\cdot10^7\cdot50}{4{,}1667\cdot10^6} + \frac{10^7\cdot25}{1{,}4583\cdot10^6} = 1128{,}1\ \text{MPa}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con la carga unidad vertical en D, solo AB tiene a la vez
              esfuerzos reales y de la unidad cuyo producto no es nulo: el
              flector vertical y el torsor.
          - texto: >-
              Los torsores real y de la unidad son de sentido contrario, y con
              $GI_t = 0{,}32EI_z$ la torsión resta más de lo que suma la
              flexión: D sube $\tfrac{59}{12}q_0L^4/EI_z$.
          - texto: >-
              En A se juntan el flector vertical máximo, $4q_0L^2$, el
              horizontal, $q_0L^2/2$, y el axil de compresión $q_0L$.
          - texto: >-
              La tensión máxima de tracción está en A, en la esquina de arriba
              del lado de C.
          - texto: >-
              El torsor de AB también da tensión normal, y hay que sumarla en
              A.
            trampa: true
            mensaje: |
              La torsión solo da tensiones tangenciales: en una sección cerrada
              de pequeño espesor, el flujo $q = M_t/(2A_t)$ (tema 12). A la
              tensión normal contribuyen el axil y los dos flectores.
    resolucion: |
      **Ejes y sección.** $x$ de A a B, $y$ hacia abajo y $z = x\times y$: A
      $(0,0,0)$, B $(L,0,0)$, C $(L,0,L)$ y D $(L,0,-L)$. La sección es de
      pequeño espesor, con la línea media de $5t\times10t$ y pared $t$, y su
      eje $y$ es siempre el vertical:

      $$
      A = 30t^2,\quad I_z = 2\,\frac{t(10t)^3}{12} + 2\cdot5t\cdot t\,(5t)^2 = \frac{1250t^4}{3},\quad
      I_y = 2\,\frac{t(5t)^3}{12} + 2\cdot10t\cdot t\,(2{,}5t)^2 = \frac{875t^4}{6}
      $$

      $$
      I_t = \frac{4A_t^2}{\oint ds/t} = \frac{4(50t^2)^2}{30} = \frac{1000t^4}{3} = 0{,}8\,I_z,\qquad
      GI_t = \frac{E}{2{,}5}\,0{,}8\,I_z = 0{,}32\,EI_z
      $$

      **Los esfuerzos.** BC lleva $4q_0L$ vertical, con su resultante en el
      punto medio de BC; BD lleva $q_0L$ horizontal hacia A, con su resultante
      en el punto medio de BD. En AB, a distancia $u$ de B:

      - flector vertical $|M_z| = 4q_0Lu$, que tracciona la fibra de arriba
        (hasta $4q_0L^2$ en A);
      - torsor $|M_t| = 4q_0L\cdot L/2 = 2q_0L^2$, constante;
      - axil $N = -q_0L$ y flector horizontal $|M_y| = q_0L\cdot L/2 = q_0L^2/2$,
        constante, que tracciona la cara del lado de C.

      **a) El desplazamiento de D** (Engesser-Castigliano con la carga unidad,
      tema 13, apartados 13.6 y 13.7, con los términos de la tabla de la
      p. 16). La unidad vertical en D da en AB $|m| = u$, que tracciona
      arriba como el real, y $|m_t| = L$, con el brazo del lado de D: de
      sentido contrario al torsor real. En BD su flector es vertical y el real
      horizontal, y en BC no da nada. Así

      $$
      \delta_D = \int_0^L\frac{4q_0Lu\cdot u}{EI_z}du - \int_0^L\frac{2q_0L^2\cdot L}{GI_t}du
      = \frac{4q_0L^4}{3EI_z} - \frac{2q_0L^4}{0{,}32\,EI_z} = -\frac{59}{12}\,\frac{q_0L^4}{EI_z}
      $$

      **D sube $\tfrac{59}{12}q_0L^4/EI_z \approx 4{,}917\,q_0L^4/EI_z$**:
      la flexión de AB lo baja $\tfrac{4}{3}$ y la torsión lo sube $6{,}25$.

      **b) La tensión normal máxima de tracción.** Con $q_0$ = 5 N/mm,
      $L$ = 2000 mm y $t$ = 10 mm: $A$ = 3000 mm²,
      $I_z = 4{,}1667\cdot10^6$ mm⁴ e $I_y = 1{,}4583\cdot10^6$ mm⁴. La
      sección más cargada es A: $N = -10$ kN, $|M_z| = 4q_0L^2 = 80$ kN·m y
      $|M_y| = q_0L^2/2 = 10$ kN·m. En la esquina de arriba ($y = -5t$) del
      lado de C ($z = 2{,}5t$), los tres términos (tema 9):

      $$
      \sigma = \frac{N}{A} + \frac{|M_z|\cdot5t}{I_z} + \frac{|M_y|\cdot2{,}5t}{I_y}
      = -\frac{10}{3} + 960{,}0 + 171{,}43 = 1128{,}1\ \text{MPa}
      $$

      **La máxima tracción es de unos 1128 MPa, en el empotramiento A,
      en la esquina de arriba del lado de C.** En B, el arranque de BC da
      $480$ MPa y el de BD, $171{,}4$ MPa: menos. La cifra es la
      del modelo de pequeño espesor, como pide el $I_t$ del enunciado.

      Las cifras salen del motor del curso (la barra quebrada en el espacio,
      con flexión en los dos planos y torsión) y de las cuentas a mano, y
      casan.

