      **Notas nuestras.** A y B son los apoyos y C, el extremo libre del
      voladizo. Los giros y la flecha van con el convenio del tema 10: $v$
      hacia abajo y $\theta$ positivo en sentido horario. Se conserva
      «$d_2$= $2d_1$» sin espacio antes del igual.
    pide: >-
      Los giros de las secciones B y C y la flecha de C, en función de q0, b,
      E e Iz.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para resolverla con la viga conjugada, ¿qué enlaces tiene la viga
          conjugada?
        opciones:
          - texto: >-
              En A, un apoyo simple; en B, una rótula sin apoyo; en C, un
              empotramiento
            correcta: true
            mensaje: |
              Eso es (figura 10.9, pp. 12-13). En A, extremo apoyado, $v = 0$
              y $\theta \neq 0$: $M^* = 0$ y $T^* \neq 0$, apoyo simple. En B,
              apoyo intermedio, $v = 0$ y el giro es el mismo a los dos lados:
              $M^* = 0$ con $T^*$ continuo, una rótula. En C, borde libre, $v$ y
              $\theta$ no son nulos: empotramiento.
          - texto: >-
              Los mismos que la viga real: apoyos en A y en B y el extremo C
              libre
            mensaje: |
              Con un extremo libre en C, la conjugada tendría $M^* = 0$ allí,
              es decir, flecha nula en la punta del voladizo, que es justo lo
              que no pasa. Los enlaces se cambian según la figura 10.9.
          - texto: >-
              En A, un apoyo; en B, otro apoyo; en C, un empotramiento
            mensaje: |
              En B la viga real tiene $v = 0$, pero el giro no salta: $T^*$ es
              continuo y $M^* = 0$, y eso es una rótula, no un apoyo. Con un
              apoyo conjugado en B, la conjugada sería hiperestática, y la
              conjugada de una viga isostática no lo es nunca.
          - texto: >-
              En A y en B, empotramientos; en C, un apoyo simple
            mensaje: |
              Un empotramiento conjugado corresponde a un borde libre real, con
              flecha. En A la flecha es nula, $M^* = 0$: apoyo, no
              empotramiento. Y en C, que es el borde libre, va el
              empotramiento.
      - tipo: calcular
        titulo: El giro de B
        pregunta: |
          ¿Cuánto gira la sección B? Escríbelo como
          $\theta_B = k\,q_0b^3/(EI_z)$, con $k$ positivo en sentido horario.
        respuesta:
          tipo: numero
          valor: '0.03125'
          tolerancia: 0.0005
          formato: un número, k (positivo horario)
        distractores:
          - valor: '0.500'
            mensaje: |
              Es lo que sale con la misma inercia en los dos tramos. AB tiene
              $d_2 = 2d_1$, y la inercia del círculo va con la cuarta potencia
              del diámetro, $\pi d^4/64$: $I_{AB} = 16I_z$, y la carga
              conjugada de AB es dieciséis veces menor.
          - valor: '0.250'
            mensaje: |
              Has tomado $I_{AB} = 2I_z$, el doble por tener el doble de
              diámetro. La inercia va con $d^4$: $2^4 = 16$.
          - valor: '-0.03125'
            mensaje: |
              El valor es ese, pero el giro es horario. AB tiene $M < 0$
              (tracciona arriba), se curva hacia arriba entre los apoyos y
              llega a B bajando hacia la derecha, hacia el voladizo.
        pista: |
          Reacciones: $R_A = -\tfrac{3}{2}q_0b$ (hacia abajo) y
          $R_B = \tfrac{5}{2}q_0b$. En AB, $M = -\tfrac{3}{2}q_0bx$, hasta
          $M_B = -\tfrac{3}{2}q_0b^2$. La carga conjugada es
          $q^* = M/EI$, con $16EI_z$ en AB, y $\theta_B$ es el cortante
          conjugado en B.
        desarrollo: |
          La carga conjugada de AB es un triángulo de 0 a
          $M_B/(16EI_z)$, de resultante
          $W^* = \tfrac{1}{2}b\cdot\dfrac{M_B}{16EI_z} = -\dfrac{3}{64}\dfrac{q_0b^3}{EI_z}$,
          a $2b/3$ de A. Momentos en AB respecto de la rótula B:
          $R^*_A\,b = W^*\,b/3$, y

          $$
          \theta_B = T^*_B = R^*_A - W^* = -\tfrac{2}{3}W^* = \frac{1}{32}\,\frac{q_0b^3}{EI_z}
          $$

          $k = 1/32 = 0{,}03125$.
      - tipo: calcular
        titulo: El giro de C
        pregunta: |
          ¿Y el giro de C, como $\theta_C = k\,q_0b^3/(EI_z)$?
        respuesta:
          tipo: numero
          valor: '1.1979'
          tolerancia: 0.002
          formato: un número, k (positivo horario)
        distractores:
          - valor: '1.6667'
            mensaje: |
              Con la misma inercia en AB, $\theta_B$ sale $1/2$ en vez de
              $1/32$, y arrastra a $\theta_C$. La inercia de AB es $16I_z$
              (la de un círculo va con $d^4$).
          - valor: '1.1667'
            mensaje: |
              Es solo lo que gira el voladizo respecto de B, $7/6$, como si
              estuviera empotrado allí. Pero B gira $\theta_B = 1/32$, y el
              voladizo arranca con esa inclinación: se suman.
          - valor: '1.1354'
            mensaje: |
              Has restado $\theta_B$ en vez de sumarlo. El giro de B es horario,
              como el que añade el voladizo, cuyo flector negativo lo curva
              hacia abajo.
        pista: |
          En la conjugada, $\theta_C = T^*_C = T^*_B - \int_B^C q^*\,dx$, con
          $q^* = M/EI_z$ en BC y $M < 0$ en todo el voladizo.
        desarrollo: |
          Con $s$ medida desde C: $M = -q_0s^2/2$ hasta $s = b$ y
          $M = -q_0b(s - b/2)$ de $s = b$ a $s = 2b$. El área:
          $\int_B^C M\,dx = -\left(\tfrac{1}{6} + 1\right)q_0b^3 = -\tfrac{7}{6}q_0b^3$,
          y

          $$
          k = \frac{1}{32} + \frac{7}{6} = \frac{115}{96} = 1{,}1979
          $$
      - tipo: calcular
        titulo: La flecha de C
        pregunta: |
          ¿Cuánto baja C? Escríbelo como $v_C = k\,q_0b^4/(EI_z)$, con $k$
          positivo hacia abajo.
        respuesta:
          tipo: numero
          valor: '1.7708'
          tolerancia: 0.002
          formato: un número, k (positivo hacia abajo)
        distractores:
          - valor: '2.7083'
            mensaje: |
              Con la misma inercia en AB: el giro de B sale dieciséis veces
              mayor, y con él lo que baja C por ese giro. $I_{AB} = 16I_z$.
          - valor: '1.7083'
            mensaje: |
              Es la flecha del voladizo como si estuviera empotrado en B,
              $41/24$. Falta lo que baja C porque B gira: $\theta_B\cdot2b$.
          - valor: '1.6458'
            mensaje: |
              Has restado $\theta_B\cdot2b$ en vez de sumarlo. Con $\theta_B$
              horario, el voladizo sale de B ya bajando, y C baja más.
        pista: |
          $v_C = M^*_C$: el momento en C de lo que hay a la izquierda en la
          conjugada, o, lo mismo, $v_C = \theta_B\cdot2b + \int_B^C (3b - x)\left(-\dfrac{M}{EI_z}\right)dx$.
        desarrollo: |
          El momento estático respecto de C del área de $-M$ en BC:
          $\int_0^b s\,\dfrac{q_0s^2}{2}\,ds + \int_b^{2b} s\,q_0b\left(s - \dfrac{b}{2}\right)ds = \left(\dfrac{1}{8} + \dfrac{19}{12}\right)q_0b^4 = \dfrac{41}{24}q_0b^4$,
          y

          $$
          k = \frac{1}{32}\cdot2 + \frac{41}{24} = \frac{85}{48} = 1{,}7708
          $$
      - tipo: dibujar
        consigna: |
          En papel: **la viga conjugada**, con sus enlaces y la carga
          $q^* = M/EI$, con sus valores en A, en B (a los dos lados), en
          $x = 2b$ y en C.
        comprueba:
          - punto: |
              **Enlaces**: apoyo simple en A, rótula en B y empotramiento en C.
            porque: |
              Es la figura 10.9: el extremo apoyado sigue apoyado, el apoyo
              intermedio pasa a rótula y el borde libre a empotramiento.
          - punto: |
              **En AB**, un triángulo de 0 en A a
              $-\tfrac{3}{32}q_0b^2/EI_z$ en B, hacia arriba porque $M < 0$.
            porque: |
              Es $M_B/(16EI_z)$: el flector es el mismo, pero la rigidez de AB
              es dieciséis veces mayor.
          - punto: |
              **En B salta** a $-\tfrac{3}{2}q_0b^2/EI_z$, y de B a $2b$, en
              recta, se reduce a $-\tfrac{1}{2}q_0b^2/EI_z$; de $2b$ a C,
              parábola hasta 0.
            porque: |
              El flector es continuo en B, pero la sección cambia y $q^*$
              salta. En BC, $M$ es lineal donde no hay carga y parabólico bajo
              la repartida, nulo en el extremo libre.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Las reacciones salen de la estática: $R_A = -\tfrac{3}{2}q_0b$
              y $R_B = \tfrac{5}{2}q_0b$; el flector es negativo en toda la
              pieza.
          - texto: >-
              La conjugada lleva un apoyo en A, una rótula en B y un
              empotramiento en C, y la carga $q^* = M/EI$, con $16EI_z$ en AB.
          - texto: >-
              Momentos en AB respecto de la rótula B dan $R^*_A$, y el cortante
              conjugado en B es $\theta_B = \tfrac{1}{32}q_0b^3/EI_z$.
          - texto: >-
              En BC, el cortante y el momento conjugados en C dan
              $\theta_C = \tfrac{115}{96}$ y $v_C = \tfrac{85}{48}$, en
              $q_0b^3/EI_z$ y $q_0b^4/EI_z$.
          - texto: >-
              Como B es un apoyo, su giro es nulo, y el voladizo se calcula como
              una ménsula empotrada en B.
            trampa: true
            mensaje: |
              Un apoyo impide la flecha, no el giro. B gira
              $\tfrac{1}{32}q_0b^3/EI_z$, y el voladizo sale de B con esa
              inclinación, que añade $\theta_B$ al giro de C y
              $\theta_B\cdot2b$ a su flecha.
    resolucion: |
      **Las inercias.** La inercia de un círculo es $\pi d^4/64$: con
      $d_2 = 2d_1$, el tramo AB tiene $I_{AB} = 2^4I_z = 16I_z$, y BC, $I_z$.

      **El flector.** Con A en $x = 0$, B en $x = b$ y C en $x = 3b$, y la
      carga $q_0b$ con su resultante en $x = 2{,}5b$:
      $\sum M_A = 0$ da $R_B = \tfrac{5}{2}q_0b$, y $R_A = -\tfrac{3}{2}q_0b$
      (hacia abajo). Con $M > 0$ si tracciona la fibra de abajo:

      - en AB, $M = -\tfrac{3}{2}q_0bx$, de 0 a $M_B = -\tfrac{3}{2}q_0b^2$;
      - en BC, con $s = 3b - x$ medida desde C, $M = -q_0b(s - b/2)$ para
        $b \le s \le 2b$ y $M = -q_0s^2/2$ para $s \le b$.

      **La viga conjugada** (tema 10, apartado 10.5, pp. 11-13). Lleva la
      carga $q^* = M/EI$, positiva hacia abajo como $q$; su cortante $T^*$ es
      el giro $\theta$ de la real (horario positivo) y su flector $M^*$, la
      flecha $v$ (hacia abajo). Sus enlaces (figura 10.9): apoyo simple en A,
      rótula en B (apoyo intermedio real) y empotramiento en C (borde libre
      real). Aquí $q^*$ es negativa, hacia arriba, en toda la pieza.

      **El giro de B.** En AB, $q^*$ es un triángulo de 0 a
      $M_B/(16EI_z) = -\tfrac{3}{32}q_0b^2/EI_z$, de resultante
      $W^* = -\tfrac{3}{64}q_0b^3/EI_z$ a $2b/3$ de A. Como en la rótula B el
      momento conjugado es nulo, momentos en AB respecto de B:
      $R^*_A = W^*/3$. Así $\theta_A = R^*_A = -\tfrac{1}{64}q_0b^3/EI_z$
      (antihorario) y

      $$
      \theta_B = R^*_A - W^* = \frac{1}{32}\,\frac{q_0b^3}{EI_z}\quad\text{(horario)}
      $$

      **El giro de C.** De B a C el cortante conjugado cambia en
      $-\int q^*dx = \tfrac{7}{6}q_0b^3/EI_z$ (el área de $M$ en BC es
      $-\tfrac{7}{6}q_0b^3$: $-\tfrac{1}{6}$ del tramo cargado y $-1$ del
      otro):

      $$
      \theta_C = \left(\frac{1}{32} + \frac{7}{6}\right)\frac{q_0b^3}{EI_z} = \frac{115}{96}\,\frac{q_0b^3}{EI_z}
      $$

      es decir, $1{,}1979\,q_0b^3/EI_z$, horario.

      **La flecha de C.** El momento conjugado en C es el de todo lo que
      queda a su izquierda: el giro de B por el brazo $2b$, más el momento
      estático respecto de C del área de $-M/EI_z$ en BC,
      $\left(\tfrac{1}{8} + \tfrac{19}{12}\right)q_0b^4/EI_z = \tfrac{41}{24}q_0b^4/EI_z$:

      $$
      v_C = \left(\frac{2}{32} + \frac{41}{24}\right)\frac{q_0b^4}{EI_z} = \frac{85}{48}\,\frac{q_0b^4}{EI_z}
      $$

      es decir, $1{,}7708\,q_0b^4/EI_z$ hacia abajo.

      El motor del curso da lo mismo por la viga conjugada y por la elástica
      integrada tramo a tramo.

  # ── Ejercicio 3 · la estructura espacial de sección hueca (tema 13, con el
  #    9 y el 12). Cae igual el mismo día como ejercicio 4 de la final.
  - id: exerm1718-2par-7-la-estructura-espacial-de-seccion-rectangular-hueca
    titulo: La estructura espacial ABCD de sección rectangular hueca, empotrada en A
    fuente: >-
      Ejercicio 3 · Segunda parte del 19 de enero de 2018 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 2 puntos. Cayó igual el mismo día como ejercicio 4 del examen
      final, donde vale 1,5 puntos y el primer «b/.» va sin punto; el
      enunciado se transcribe sin su «(2p)», y cada hoja pone sus puntos. La
      disposición en el espacio y la sección
      se leen en la figura. El examen no publica resolución; el desarrollo es
      nuestro, con los temas 9, 12 y 13, y las cifras salen del motor del
      curso y de un segundo camino.
    nivel: examen
    enunciado: |
      La estructura de la figura es de sección rectangular hueca y
      $E = 2{,}5\,G$. Los tramos AB, BC y BD son de longitud $L$. Determinar:

      a/ Desplazamiento vertical del punto D teniendo en cuenta la energía de
      flexión y torsión en función de $q_0$, $L$, $E$ e $I_z$.

      b/. La tensión normal máxima de tracción, indicando dónde está.

      b/ $q_0$ = 5 kN/m, $L$ =2 m, $t$ = 10 mm

      $$
      I_t = \frac{4A_t^2}{\displaystyle\int_L\frac{ds}{t}}
      $$

