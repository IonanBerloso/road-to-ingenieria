      <line x1="140" y1="267" x2="410" y2="267" stroke="var(--ink)" stroke-width="1"/><polygon points="410,267 403,269.6 403,264.4" fill="var(--ink)"/><polygon points="140,267 147,264.4 147,269.6" fill="var(--ink)"/>
