      **Notas nuestras.** B está sobre el eje $z$, en el borde derecho de la
      sección, a $3{,}5b$ del centro. Se conserva «10kN» sin espacio.
    pide: >-
      La dimensión b de la sección para que el factor multiplicador del
      momento valga 2.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el factor $\sec(\alpha L)$, con $\alpha = \sqrt{P/(EI)}$, ¿qué
          longitud va en $\alpha L$?
        opciones:
          - texto: >-
              La de la columna, $L$ = 10 m
            correcta: true
            mensaje: |
              Eso es (ec. 14.20, p. 11). La ecuación diferencial de la
              columna empotrada-libre se integra en su longitud real, y el
              factor sale $\sec\alpha L$ con esa $L$. El $2L$ de la longitud
              de pandeo es de la carga crítica, y ya está dentro de ella, en
              el $\pi/2$ de la ec. 14.21.
          - texto: >-
              La de pandeo de la empotrada-libre, $L_p = 2L$ = 20 m
            mensaje: |
              Esa es la de la carga crítica. El factor de la ec. 14.20 lleva
              la longitud real: con $2L$, la inercia sale cuatro veces mayor
              y $b$, $\sqrt{2}$ veces.
          - texto: >-
              La mitad, $L/2$, porque la empotrada-libre es media columna
              biarticulada
            mensaje: |
              Es al revés: la empotrada-libre es la mitad de una biarticulada
              de longitud $2L$, no de $L/2$. Y en el factor no entra ninguna
              longitud de pandeo: va la real, $L$.
      - tipo: calcular
        titulo: La dimensión b
        pregunta: |
          ¿Cuánto tiene que valer $b$, en mm?
        respuesta:
          tipo: numero
          valor: '13.82'
          tolerancia: 0.05
          formato: un número, en mm
        distractores:
          - valor: '12.80'
            mensaje: |
              Es la que sale con $I_z = 680b^4/3$. Pero B está sobre el eje
              $z$: la excentricidad está en el plano $xz$ y la columna flecta
              alrededor de $y$, con $I_y$. Muy cerca caen otros dos errores en
              $I_y$: no restar los huecos ($I_y = 686b^4/3$, de donde
              $b \approx$ 12,77 mm) y restarlos sin Steiner (12,88 mm). Los
              huecos están a $1{,}5b$ del eje $y$.
          - valor: '19.54'
            mensaje: |
              Has metido la longitud de pandeo, $2L$, en $\alpha L$. El factor
              de la ec. 14.20 lleva la longitud real: el $2L$ de la
              empotrada-libre ya está dentro, en el $\pi/2$ de la ec. 14.21.
              Con $2L$, la inercia sale cuatro veces mayor y $b$, $\sqrt{2}$
              veces. Lo mismo sale tomando la secante como $1/\sin$
              ($\alpha L = \pi/6$).
        pista: |
          $\sec\alpha L = 2$ da $\alpha L = \pi/3$; con $\alpha^2 = P/(EI)$
          despejas $I$, y luego $b$ de la inercia de la sección en el plano de
          la excentricidad.
        desarrollo: |
          $\alpha L = \arccos\tfrac{1}{2} = \pi/3$ y, con $P$ en N, $L$ en mm
          y $E$ en MPa,

          $$
          I_y = \frac{PL^2}{E(\pi/3)^2} = \frac{9\cdot10^4\cdot(10^4)^2}{\pi^2\cdot1{,}5\cdot10^5} = 6\,079\,271\ \text{mm}^4
          $$

          Con $I_y = 500b^4/3$:
          $b = \sqrt[4]{3I_y/500} = 13{,}82$ mm.
      - tipo: calcular
        titulo: La carga crítica
        pregunta: |
          Con esa $b$, ¿cuál es la carga crítica de pandeo de la columna, en
          kN?
        respuesta:
          tipo: numero
          valor: '22.50'
          tolerancia: 0.1
          formato: un número, en kN
        distractores:
          - valor: '90.00'
            mensaje: |
              Con $L_p = L$. La empotrada-libre pandea con $L_p = 2L$:
              $P_{cr} = \pi^2EI/(2L)^2$ (ec. 14.21), cuatro veces menos que con
              $L$.
          - valor: '30.60'
            mensaje: |
              Con $I_z$. La carga crítica es la del momento de inercia mínimo
              (p. 11), y aquí el mínimo es $I_y = 500b^4/3$, menor que
              $I_z = 680b^4/3$: la columna pandea alrededor de $y$, que además
              es el plano de la excentricidad.
        pista: |
          Empotrada-libre: $P_{cr} = \dfrac{\pi^2EI_{min}}{(2L)^2}$ (ec. 14.21).
        desarrollo: |
          $$
          P_{cr} = \frac{\pi^2\cdot1{,}5\cdot10^5\cdot6\,079\,271}{4\cdot(10^4)^2} = 22{,}50\ \text{kN}
          $$

          Es $9/4$ de $P$: con $\alpha L = \pi/3$,
          $P/P_{cr} = (\pi/3)^2/(\pi/2)^2 = 4/9$.
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza sobra.
        piezas:
          - texto: >-
              B está sobre el eje $z$, a $e = 3{,}5b$ del centro: la columna
              flecta alrededor de $y$, y en el factor entra $I_y$.
          - texto: >-
              Con la columna deformada, el momento en el empotramiento es
              $Pe\sec\alpha L$, con $\alpha^2 = P/(EI_y)$ (ec. 14.20).
          - texto: >-
              Que el factor valga 2 es $\alpha L = \pi/3$, de donde
              $I_y = 9PL^2/(\pi^2E)$.
          - texto: >-
              Con $I_y = 500b^4/3$, $b = \sqrt[4]{3I_y/500}$.
          - texto: >-
              Como la columna es empotrada-libre, en $\alpha L$ va la longitud
              de pandeo, $2L$.
            trampa: true
            mensaje: |
              En el factor va la longitud real $L$: la ec. 14.20 sale de
              integrar la columna de $x = 0$ a $x = L$, y el $2L$ aparece solo
              al buscar la carga crítica, cuando $\alpha L = \pi/2$
              (ec. 14.21).
    resolucion: |
      **La sección.** Un rectángulo de $7b\times8b$ con dos huecos de
      $2b\times6b$, simétrica respecto de los dos ejes. Sus inercias
      respecto del centro, con Steiner para los huecos (sus centros están a
      $1{,}5b$ del eje $y$):

      $$
      I_z = \frac{7b(8b)^3}{12} - 2\cdot\frac{2b(6b)^3}{12} = \frac{680b^4}{3},\qquad
      I_y = \frac{8b(7b)^3}{12} - 2\left[\frac{6b(2b)^3}{12} + 12b^2(1{,}5b)^2\right] = \frac{500b^4}{3}
      $$

      **El plano de la flexión.** B está sobre el eje $z$, en el borde, a
      $e_z = 3{,}5b$ del centro. La excentricidad está en el plano $xz$, y la
      columna flecta alrededor de $y$: el factor es
      $\sec\alpha_yL$, con $\alpha_y = \sqrt{P/(EI_y)}$ (tema 14, p. 11, y
      la excentricidad en dos ejes del final del tema).

      **El factor multiplicador.** En la columna empotrada-libre con la carga
      excéntrica, el momento en el empotramiento es
      $|M_{max}| = Pe\sec\alpha L$ (ec. 14.20): el $Pe$ de primer orden,
      multiplicado por $\sec\alpha L$ porque la flecha del extremo,
      $\delta = e(\sec\alpha L - 1)$ (ec. 14.17), alarga el brazo. Que valga
      2 es $\cos\alpha L = \tfrac{1}{2}$, $\alpha L = \pi/3$, y

      $$
      I_y = \frac{PL^2}{E(\pi/3)^2} = \frac{9PL^2}{\pi^2E} = 6\,079\,271\ \text{mm}^4
      $$

      con $P = 10^4$ N, $L = 10^4$ mm y $E = 1{,}5\cdot10^5$ MPa. Igualando a
      $500b^4/3$:

      $$
      b = \sqrt[4]{\frac{3\cdot6\,079\,271}{500}} = 13{,}82\ \text{mm}
      $$

      **Comprobaciones.** Con esa $b$, $e = 3{,}5b = 48{,}4$ mm, la
      flecha del extremo libre es $\delta = e\,[\sec(\alpha L) - 1]$, que con
      $\sec(\alpha L) = 2$ es la propia excentricidad, 48,4 mm, y el
      momento del empotramiento, $2Pe = 0{,}967$ kN·m. La carga
      crítica, con la inercia mínima, que aquí es la misma $I_y$, es
      $P_{cr} = \pi^2EI_y/(2L)^2 = 22{,}50$ kN, $9/4$ de $P$: la
      columna no pandea. El motor del curso da lo mismo.

  # ── Ejercicio 1 · la viga rígida CD y la barra calentada (tema 8). Cae
  #    igual el mismo día como ejercicio 2 de la final.
  - id: exerm1718-2par-5-la-viga-rigida-cd-y-la-barra-calentada
    titulo: La viga rígida CD apoyada en A y unida a dos barras, con una de ellas calentada
    fuente: >-
      Ejercicio 1 · Segunda parte del 19 de enero de 2018 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 2 puntos. Cayó igual el mismo día como ejercicio 2 del examen
      final, donde vale 1,5 puntos; el enunciado se transcribe sin su «(2p)»,
      y cada hoja pone sus puntos. El examen no publica resolución; el
      desarrollo es nuestro, con el tema 8, y las cifras salen del motor del
      curso y de un segundo camino.
    nivel: examen
    enunciado: |
      La viga horizontal CD es rígida, está apoyada en A y unida a las barras
      1 y 2 de módulo $E$ y sección $A$. La barra 1 sufre una variación
      $\Delta T$ de temperatura, siendo $\alpha$ el coeficiente de dilatación
      térmica. Determinar:

      a/ Fuerzas en las barras.

      b/ Desplazamiento del extremo D.

