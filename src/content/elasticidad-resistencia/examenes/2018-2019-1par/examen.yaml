# El primer parcial de Elasticidad y Resistencia de Materiales del 16 de
# noviembre de 2018 («Parte 1» en la cabecera): tres páginas, la 1 de teoría
# (cuatro cuestiones de 1 punto) y la 2 y la 3 de ejercicios (tres de 2
# puntos). Diez puntos en total, y el cuadernillo los imprime todos.
#
# El cuadernillo es bilingüe, castellano a la izquierda y euskera a la
# derecha, y se transcribe **solo la columna en castellano**, tal cual. Lo
# que hay que saber de ese texto, dicho antes de que nadie lo deduzca:
#
# 1. **EL PDF PIERDE TRES RÓTULOS, Y EL WORD LOS TIENE.** En la figura de la
#    cuestión 4 el PDF no dibuja los números de los cables ni la W del peso.
#    El Word original (18-ERM-EME-aza1-nov1.docx) los lleva en cuadros de
#    texto: el 1 junto al tramo vertical de la izquierda, el 2 junto al de la
#    derecha y la W en el peso. Se dibujan, y el pie de la figura lo dice. El
#    texto y las demás figuras salen enteros en el PDF.
#
# 2. **LO QUE LA FIGURA DICE Y EL TEXTO NO.** En el problema 1, el plano
#    del apartado b forma 30° con la vertical (la sección recta) y la σ
#    dibujada es normal a él: se lee σ = 20 MPa como la tensión normal en
#    ese plano. La otra lectura, σ como la tensión de la barra, se da también
#    por buena en el paso de cálculo y en la resolución (8,66 MPa en vez de
#    11,55). La dirección u está en el tramo de 20 cm. En la cuestión 4 se lee
#    que el peso baja sin girar y los dos cables se alargan lo mismo; la
#    resolución dice qué pasaría si no.
#
# 3. **ERRATAS DEL TEXTO, CONSERVADAS**: «alumnio» en la cuestión 4, «en la
#    barras 1, 2 y AB» y «(2 p)» con espacio en el problema 3, y «W= 600 N»
#    en la cuestión 4 sin espacio antes del igual. El problema 1 llama «viga»
#    a una barra a tracción: se deja.
#
# 4. **DOS NUMERACIONES.** La teoría va de 1 a 4 y los ejercicios vuelven a
#    empezar en 1. Aquí las cuestiones son n 1 a 4 y los problemas n 5, 6 y
#    7; la `fuente` de cada ejercicio dice el nombre impreso. En euskera la
#    cuestión 2 va numerada «1.»: no cambia nada.
#
# 5. **NADA SE PARTE.** Cada pregunta es un ejercicio. El problema 1 toca los
#    temas 2, 3 y 4 en sus apartados b y c, pero son pasos de un problema de
#    axil y van con él, en el tema 8.
#
# 6. **EL EUSKERA NO DICE OTRA COSA** en ninguna pregunta: mismos datos,
#    mismos apartados y mismas figuras.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso y de un segundo camino (fase-p/p2d,
# guiones/cifras.mjs). Las cuestiones 1 y 3 piden deducir y no traen
# números: los pasos de cálculo de las dos son ejemplos nuestros, y lo dicen.
# Ninguna de las siete es copia literal de una pregunta ya resuelta en los
# parciales de 2020 y 2022.
pdf: 2018-2019-1par.pdf
