      <figcaption>

      Redibujada del enunciado. La holgura ξ se dibuja exagerada, como en
      el original; las cotas de 80 y 20 cm están a escala.

      </figcaption>
      </figure>

      **Notas nuestras.** La figura no dibuja ejes. El plano del apartado b
      forma 30° con la vertical, es decir, con la sección recta, y $\sigma$ es
      la tensión normal **sobre ese plano**, la que dibuja la flecha. La
      dirección $u$ está en el tramo de 20 cm, a la derecha de $P$, y baja 20°
      desde la horizontal.
    pide: >-
      P en kN; la tensión tangencial en el plano a 30° cuando su tensión
      normal es 20 MPa; con P = 30 kN, las fuerzas de los dos tramos y εu.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de tocar la pared, ¿qué tramo de la barra trabaja?
        opciones:
          - texto: >-
              Solo el de 80 cm, con $N = P$: el de 20 cm, a la derecha de la
              carga, no tiene nada que equilibrar
            correcta: true
            mensaje: |
              Eso es. Cortando en el tramo de la derecha, la parte libre no
              tiene ninguna fuerza: $N = 0$. El extremo se mueve lo que se
              alarga el tramo de 80 cm, y el de 20 cm solo se traslada.
          - texto: Los dos, con $N = P$ en toda la barra
            mensaje: |
              A la derecha de $P$ no queda carga: si cortas ahí y miras la
              parte derecha, está libre. Con $N = P$ también en el tramo de
              20 cm, el extremo se movería $P\cdot100/EA$ y saldría
              $P = 16{,}8$ kN.
          - texto: >-
              Los dos, con $P$ repartida entre ellos según sus longitudes
            mensaje: |
              Eso es lo que pasa **después** de tocar, cuando la pared también
              empuja. Antes, el extremo derecho está libre y el tramo de 20 cm
              no carga nada.
      - tipo: calcular
        titulo: La carga que cierra la holgura
        pregunta: |
          ¿Cuánto vale $P$ para que la barra toque la pared derecha, en kN?
        respuesta:
          tipo: numero
          valor: '21'
          tolerancia: 0.01
          formato: un número, en kN
        distractores:
          - valor: '16.8'
            mensaje: |
              Has usado la longitud entera, 100 cm. El tramo de 20 cm está a
              la derecha de $P$ y no trabaja: solo se alarga el de 80 cm,
              $P\cdot800/EA = 0{,}2$ mm.
          - valor: '0.21'
            mensaje: |
              Has tomado $A = 4$ mm². Son 4 cm² = 400 mm²: $EA = 210\,000\cdot400
              = 8{,}4\cdot10^{7}$ N.
        pista: |
          $\Delta L_1 = \dfrac{P L_1}{EA} = \xi$, con $L_1 = 800$ mm,
          $E = 210\,000$ MPa y $A = 400$ mm² (ec. 8.9).
        desarrollo: |
          $$
          P = \frac{\xi\,EA}{L_1} = \frac{0{,}2\cdot210\,000\cdot400}{800} = 21\,000\ \text{N} = 21\ \text{kN}
          $$
      - tipo: calcular
        titulo: La tangencial en el plano a 30°
        pregunta: |
          Siendo $\sigma = 20$ MPa (la flecha de la figura, normal al plano
          dibujado), ¿cuánto vale la tangencial en ese mismo plano, en MPa,
          con el convenio de los apuntes del tema 2 ($\hat{t}$ a 90°
          antihorario de $\hat{n}$)?
        respuesta:
          tipo: numero
          valor: '11.547'
          tolerancia: 0.01
          formato: un número, en MPa
        tambienValen:
          - valor: '8.6603'
            mensaje: |
              Es la otra lectura del enunciado: $\sigma = 20$ MPa como la
              tensión **de la barra**, $\sigma_x$, y entonces
              $\tau = \sigma_x\operatorname{sen}30°\cos30° = 8{,}66$ MPa. Se da
              por buena porque el texto del examen no dice de qué plano es σ.
              Aquí se toma como la normal del plano dibujado, porque así la
              dibuja la flecha y el enunciado pide la cortante «en el mismo
              plano»: con esa lectura, 8,66 sería confundir $\sigma_n$ con
              $\sigma_x$.
        distractores:
          - valor: '-11.547'
            mensaje: |
              El valor es ese, pero con el signo de un plano girado al revés:
              normal a $+30°$ en vez de a $150°$. En la figura el plano sube
              hacia la derecha y su normal sale hacia arriba a la izquierda;
              con $\theta = 150°$, $\tau_n = -\sigma_x\operatorname{sen}\theta\cos\theta > 0$.
          - valor: '34.641'
            mensaje: |
              Has tomado 30° entre la normal y la vertical, o sea la normal a
              60° del eje: $\sigma_x = 20/\cos^{2}60° = 80$. El 30° está entre
              el **plano** y la vertical (la sección recta), así que la normal
              forma 30° con el eje de la barra.
        pista: |
          $\sigma_n = \sigma_x\cos^{2}\theta$ y $\tau_n = -\sigma_x\operatorname{sen}\theta\cos\theta$
          (ec. 2.59 con $\sigma_y = \tau_{xy} = 0$), con $\theta = 150°$.
        desarrollo: |
          Primero $\sigma_x$, de la normal:

          $$
          \sigma_x = \frac{20}{\cos^{2}30°} = 26{,}67\ \text{MPa}
          $$

          y la tangencial, con $\theta = 150°$:

          $$
          \tau_n = -26{,}67\cdot\operatorname{sen}150°\cdot\cos150° = 20\operatorname{tg}30° = 11{,}55\ \text{MPa}
          $$

          (Esa $\sigma_x$ corresponde a $P = 26{,}67\cdot400 = 10{,}7$ kN,
          menos de los 21 kN que cierran la holgura: la barra no toca.)
      - tipo: calcular
        titulo: La fuerza del tramo de 20 cm con P = 30 kN
        pregunta: |
          Con $P = 30$ kN la barra toca la pared. ¿Cuánto vale la fuerza
          normal del tramo de 20 cm, en kN, positiva a tracción?
        respuesta:
          tipo: numero
          valor: '-7.2'
          tolerancia: 0.01
          formato: un número, en kN
        distractores:
          - valor: '-24'
            mensaje: |
              Has resuelto la barra empotrada en las dos paredes desde el
              principio, sin la holgura. Los primeros 0,2 mm el extremo los
              recorre libre, con 21 kN; el empotramiento de la derecha solo
              existe a partir de ahí.
          - valor: '-9'
            mensaje: |
              Has mandado a la pared todo el exceso, $30 - 21 = 9$ kN. Una vez
              tocada, la barra es empotrada-empotrada y el exceso se reparte
              entre los dos tramos según su rigidez: la pared se lleva
              $9\cdot\tfrac{80}{100} = 7{,}2$ kN.
        pista: |
          Equilibrio: $N_1 - N_2 = P$. Compatibilidad: el extremo llega a la
          pared, $\dfrac{N_1L_1}{EA} + \dfrac{N_2L_2}{EA} = \xi$.
        desarrollo: |
          $$
          N_1 = \frac{\xi\,EA + P L_2}{L_1 + L_2} = \frac{16\,800\,000 + 30\,000\cdot200}{1000}
          = 22\,800\ \text{N},\qquad N_2 = N_1 - P = -7200\ \text{N}
          $$

          El tramo de 20 cm está comprimido: $\sigma_2 = -7200/400 = -18$ MPa.
      - tipo: calcular
        titulo: La deformación normal según u
        pregunta: |
          ¿Cuánto vale la deformación normal en la dirección $u$, en unidades
          de $10^{-5}$?
        respuesta:
          tipo: numero
          valor: '-7.268'
          tolerancia: 0.002
          formato: un número, en unidades de 10⁻⁵
        distractores:
          - valor: '-7.5688'
            mensaje: |
              Te has olvidado de Poisson: con $\sigma_y = \sigma_z = 0$ la
              barra se ensancha, $\varepsilon_y = -\nu\varepsilon_x > 0$, y esa
              deformación también entra en $u$ con $\operatorname{sen}^{2}20°$.
          - valor: '23.015'
            mensaje: |
              Has usado el tramo de 80 cm, a tracción con 22,8 kN. La dirección
              $u$ está dibujada a la derecha de $P$, en el tramo de 20 cm, que
              trabaja a compresión.
          - valor: '-8.5714'
            mensaje: |
              Es $\varepsilon_x = \sigma/E$, la deformación según el eje. La
              dirección $u$ forma 20° con él: hay que proyectar,
              $\varepsilon_u = \varepsilon_x\cos^{2}20° + \varepsilon_y\operatorname{sen}^{2}20°$.
        pista: |
          $\varepsilon_x = \sigma_2/E$, $\varepsilon_y = -\nu\varepsilon_x$,
          $\gamma_{xy} = 0$, y la ec. 3.55 con el ángulo de $u$.
        desarrollo: |
          $$
          \varepsilon_x = \frac{-18}{210\,000} = -8{,}571\cdot10^{-5},\qquad
          \varepsilon_y = -0{,}3\,\varepsilon_x = 2{,}571\cdot10^{-5}
          $$

          $$
          \varepsilon_u = \varepsilon_x\cos^{2}20° + \varepsilon_y\operatorname{sen}^{2}20°
          = (-8{,}571\cdot0{,}8830 + 2{,}571\cdot0{,}1170)\cdot10^{-5} = -7{,}268\cdot10^{-5}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              a/ Antes de tocar solo trabaja el tramo de 80 cm:
              $P\cdot800/EA = 0{,}2$ mm da $P = 21$ kN.
          - texto: >-
              b/ El plano forma 30° con la sección recta:
              $\sigma_x = 20/\cos^{2}30° = 26{,}67$ MPa y
              $\tau = 20\operatorname{tg}30° = 11{,}55$ MPa.
          - texto: >-
              c/ Con 30 kN toca: $N_1 - N_2 = P$ y
              $(N_1\cdot800 + N_2\cdot200)/EA = 0{,}2$ dan $N_1 = 22{,}8$ kN y
              $N_2 = -7{,}2$ kN.
          - texto: >-
              En el tramo de 20 cm, $\sigma = -18$ MPa,
              $\varepsilon_x = -8{,}571\cdot10^{-5}$, $\varepsilon_y = 2{,}571\cdot10^{-5}$
              y $\varepsilon_u = -7{,}268\cdot10^{-5}$.
          - texto: >-
              c/ Con 30 kN, los 21 kN primeros cierran la holgura y los 9 kN
              que sobran los recoge entera la pared derecha.
            trampa: true
            mensaje: |
              Tocada la pared, la barra está sujeta por los dos lados y el
              exceso se reparte según las rigideces de los dos tramos: la
              pared se lleva $9\cdot800/1000 = 7{,}2$ kN y la izquierda los
              otros 1,8, que se suman a los 21.
    resolucion: |
      **Datos.** $EA = 210\,000\cdot400 = 8{,}4\cdot10^{7}$ N; $L_1 = 800$ mm
      (de la pared izquierda a $P$), $L_2 = 200$ mm, $\xi = 0{,}2$ mm. Convenio
      del tema 8: $N > 0$ a tracción, $\Delta L = NL/EA$ (ec. 8.9).

      **a/ La carga que cierra la holgura.** Mientras el extremo no toca, el
      tramo de 20 cm está libre ($N_2 = 0$) y solo se alarga el de 80 cm:

      $$
      \frac{P\,L_1}{EA} = \xi \;\Longrightarrow\; P = \frac{0{,}2\cdot8{,}4\cdot10^{7}}{800} = 21\,000\ \text{N} = 21\ \text{kN}
      $$

      **b/ El plano a 30°.** El plano dibujado forma 30° con la vertical (la
      sección recta), así que su normal forma 30° con el eje: con el
      convenio del tema 2, $\theta = 150°$ ($\hat{n}$ hacia arriba a la
      izquierda, como la flecha de $\sigma$). En tracción simple
      ($\sigma_y = \tau_{xy} = 0$), la ec. 2.59 da

      $$
      \sigma_n = \sigma_x\cos^{2}\theta = 20 \;\Longrightarrow\; \sigma_x = \frac{20}{0{,}75} = 26{,}67\ \text{MPa}
      $$

      $$
      \tau_n = -\sigma_x\operatorname{sen}\theta\cos\theta = 20\operatorname{tg}30° = 11{,}55\ \text{MPa}
      $$

      Es un estado del tramo de 80 cm con $P = 26{,}67\cdot400 = 10{,}7$ kN,
      que no llega a cerrar la holgura.

      *La otra lectura.* Si «$\sigma$ = 20 MPa» se lee como la tensión de la
      barra, $\sigma_x = 20$, la tangencial en el mismo plano es
      $20\operatorname{sen}30°\cos30° = 8{,}66$ MPa. La flecha de la figura es
      normal al plano, y por eso se toma la primera; las dos se dan por
      buenas.

      **c/ Con $P$ = 30 kN.** Como $30 > 21$, la barra toca, y desde ahí es
      empotrada en las dos paredes. Equilibrio del punto de carga y
      compatibilidad (el extremo derecho se ha movido exactamente $\xi$):

      $$
      N_1 - N_2 = P,\qquad \frac{N_1L_1 + N_2L_2}{EA} = \xi
      $$

      $$
      N_1 = \frac{\xi EA + PL_2}{L_1 + L_2} = 22{,}8\ \text{kN},\qquad N_2 = -7{,}2\ \text{kN}
      $$

      En el tramo de 20 cm, $\sigma = -7200/400 = -18$ MPa. Con Hooke
      ($\sigma_y = \sigma_z = 0$, ec. 4.2):

      $$
      \varepsilon_x = \frac{-18}{210\,000} = -8{,}571\cdot10^{-5},\qquad
      \varepsilon_y = \varepsilon_z = -\nu\varepsilon_x = 2{,}571\cdot10^{-5},\qquad \gamma_{xy} = 0
      $$

      y la dirección $u$, a 20° del eje (ec. 3.55; el signo del ángulo no
      importa porque $\gamma_{xy} = 0$):

      $$
      \varepsilon_u = \varepsilon_x\cos^{2}20° + \varepsilon_y\operatorname{sen}^{2}20° = -7{,}268\cdot10^{-5}
      $$

      **Comprobación.** El motor del curso, con la barra en dos tramos y la
      holgura, da que toca justo a partir de 21 kN, $N_1 = 22{,}8$ kN y
      $N_2 = -7{,}2$ kN (la reacción de la pared derecha), y $\varepsilon_u$
      con $\{u\}^{t}[\varepsilon]\{u\}$ coincide con la ec. 3.55 escrita a mano.

  # ── Problema 2 · los diagramas de la viga con la rótula en E.
  - id: exerm1819-1par-6-la-gerber-con-la-rotula-en-e
    titulo: Los diagramas de una viga Gerber con la rótula en E
    fuente: >-
      Problema 2 · Primer parcial del 16 de noviembre de 2018 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 2 puntos. El examen no publica resolución; el
      desarrollo es nuestro, con el convenio del tema 7.
    nivel: examen
    enunciado: |
      (2p) Determinar los diagramas de fuerzas cortantes y de momentos
      flectores en función de $q_0$ y $a$. E es una articulación.

      <figure class="figura-examen">
