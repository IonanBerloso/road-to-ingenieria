      <path d="M360 57 H240 A35 35 0 0 0 205 92 V226" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
      <rect x="182" y="226" width="36" height="66" rx="6" fill="var(--faint)" fill-opacity=".6" stroke="var(--ink)" stroke-width="1"/>
      <text x="200" y="264" text-anchor="middle" font-size="14" font-style="italic" fill="var(--ink)">W</text>
      <text x="187" y="152.3" text-anchor="end" font-size="14" fill="var(--ink)">1</text>
      <text x="213" y="152.3" text-anchor="start" font-size="14" fill="var(--ink)">2</text>
      </svg>
      <figcaption>

      Redibujada del enunciado. Los rótulos 1, 2 y W están en el Word
      original; en el PDF la figura sale sin ellos.

      </figcaption>
      </figure>

      $E_1 = 200$ GPa; $E_2 = 70$ GPa; $W$= 600 N

      **Notas nuestras.** Los dos cables bajan juntos hasta el mismo punto
      del peso, y las poleas están fijas: se lee que el peso baja sin girar y
      que los dos cables se alargan lo mismo. Los 3 m son la longitud entera
      de cada cable, de la pared al peso.
    pide: >-
      La fuerza de cada cable, en N, y su tensión, en MPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          El equilibrio del peso da $N_1 + N_2 = W$: una ecuación para dos
          incógnitas. ¿Qué la completa?
        opciones:
          - texto: >-
              La compatibilidad: el peso baja lo mismo para los dos cables, así
              que los dos se alargan lo mismo, $\Delta L_1 = \Delta L_2$
            correcta: true
            mensaje: |
              Eso es: es un sistema hiperestático de grado uno (apuntes del
              tema 8, p. 4), y la ecuación que falta sale de la deformación.
              Con poleas fijas, lo que baja el peso es lo que se alarga cada
              cable.
          - texto: >-
              La simetría de la figura: cada cable lleva la mitad del peso
            mensaje: |
              La figura es simétrica, pero los cables no: el de acero es casi
              tres veces más rígido. Se reparten el peso según su rigidez, no
              a partes iguales.
          - texto: >-
              El equilibrio de cada polea, que da la fuerza de cada cable por
              separado
            mensaje: |
              Una polea fija sin rozamiento solo cambia la dirección del
              cable: la fuerza es la misma a los dos lados. No aporta ninguna
              ecuación nueva entre $N_1$ y $N_2$.
      - tipo: calcular
        titulo: La fuerza en el cable de acero
        pregunta: |
          ¿Cuánto vale $N_1$, la fuerza en el cable 1, de acero, en N?
        respuesta:
          tipo: numero
          valor: '444.444'
          tolerancia: 0.5
          formato: un número, en N
        distractores:
          - valor: '300'
            mensaje: |
              Es el reparto a partes iguales, que solo usa el equilibrio. Los
              dos cables se alargan lo mismo y tienen la misma $L$ y la misma
              $A$, así que sus fuerzas van como sus módulos:
              $N_1/N_2 = E_1/E_2 = 200/70$. (Solo saldría si el peso pudiera
              girar con los cables atados separados; aquí llegan juntos al
              mismo punto.)
          - valor: '155.556'
            mensaje: |
              Has cambiado los módulos: esa es la fuerza del cable de
              **aluminio**. El cable más rígido es el que más carga se lleva,
              y el acero ($E_1 = 200$ GPa) lo es.
        pista: |
          $\dfrac{N_1L}{E_1A} = \dfrac{N_2L}{E_2A}$ y $N_1 + N_2 = W$.
        desarrollo: |
          $$
          N_1 = W\,\frac{E_1}{E_1 + E_2} = 600\cdot\frac{200}{270} = 444{,}4\ \text{N},\qquad
          N_2 = 600\cdot\frac{70}{270} = 155{,}6\ \text{N}
          $$
      - tipo: calcular
        titulo: La tensión en el cable de acero
        pregunta: |
          ¿Cuánto vale la tensión en el cable 1, en MPa?
        respuesta:
          tipo: numero
          valor: '111.111'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '75'
            mensaje: |
              Es $300/4$: has repartido el peso a partes iguales. Con la
              compatibilidad, $N_1 = 444{,}4$ N.
          - valor: '1.1111'
            mensaje: |
              Has dividido por 400, como si la sección fueran 4 cm². Son
              4 mm², y N/mm² son MPa: $444{,}4/4 = 111{,}1$ MPa.
        pista: |
          $\sigma = N/A$, con $A = 4$ mm² y N/mm² = MPa (ec. 8.5).
        desarrollo: |
          $$
          \sigma_1 = \frac{444{,}4\ \text{N}}{4\ \text{mm}^{2}} = 111{,}1\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La tensión en el cable de aluminio
        pregunta: |
          ¿Cuánto vale la tensión en el cable 2, en MPa?
        respuesta:
          tipo: numero
          valor: '38.889'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '111.111'
            mensaje: |
              Es la tensión del cable de acero. Con los módulos cambiados las
              dos cifras se intercambian; el aluminio, más flexible, es el que
              menos trabaja.
          - valor: '75'
            mensaje: |
              Es $300/4$, el reparto a partes iguales. El aluminio se lleva
              solo $70/270$ del peso.
        pista: |
          $\sigma_2 = N_2/A$, con $N_2 = W - N_1$.
        desarrollo: |
          $$
          \sigma_2 = \frac{155{,}6}{4} = 38{,}9\ \text{MPa}
          $$

          Las dos deformaciones son iguales, como tienen que ser:
          $\sigma_1/E_1 = \sigma_2/E_2 = 5{,}56\cdot10^{-4}$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Equilibrio del peso: $N_1 + N_2 = W = 600$ N. Dos incógnitas:
              es hiperestático de grado uno.
          - texto: >-
              Compatibilidad: las poleas son fijas y el peso baja sin girar,
              así que $\Delta L_1 = \Delta L_2$, es decir
              $N_1L/(E_1A) = N_2L/(E_2A)$.
          - texto: >-
              $N_1 = 600\cdot200/270 = 444{,}4$ N y $N_2 = 155{,}6$ N.
          - texto: >-
              $\sigma_1 = 111{,}1$ MPa y $\sigma_2 = 38{,}9$ MPa: el cable más
              rígido trabaja más.
          - texto: >-
              Como los dos cables tienen la misma longitud y la misma sección,
              las dos tensiones son iguales, $W/(2A) = 75$ MPa.
            trampa: true
            mensaje: |
              Iguales son las **deformaciones**, no las tensiones:
              $\sigma_1/E_1 = \sigma_2/E_2$. Con módulos distintos, la misma
              deformación pide tensiones distintas, en la proporción de los
              módulos.
    resolucion: |
      **El planteamiento.** Los dos cables sostienen el mismo peso y pasan
      por poleas fijas: el peso baja $\delta$ y cada cable se alarga
      $\delta$. Equilibrio y compatibilidad (apuntes del tema 8, ecs. 8.5 y
      8.9):

      $$
      N_1 + N_2 = W,\qquad \frac{N_1L}{E_1A} = \frac{N_2L}{E_2A}
      $$

      **Las fuerzas.** Como $L$ y $A$ son iguales, $N_1/N_2 = E_1/E_2$:

      $$
      N_1 = W\frac{E_1}{E_1 + E_2} = 600\cdot\frac{200}{270} = 444{,}4\ \text{N},\qquad
      N_2 = W\frac{E_2}{E_1 + E_2} = 155{,}6\ \text{N}
      $$

      **Las tensiones**, con $A = 4$ mm²:

      $$
      \sigma_1 = \frac{444{,}4}{4} = 111{,}1\ \text{MPa},\qquad \sigma_2 = \frac{155{,}6}{4} = 38{,}9\ \text{MPa}
      $$

      **Comprobación.** Los dos alargamientos:
      $\Delta L_1 = \dfrac{444{,}4\cdot3000}{200\,000\cdot4} = 1{,}667$ mm y
      $\Delta L_2 = \dfrac{155{,}6\cdot3000}{70\,000\cdot4} = 1{,}667$ mm, el
      descenso del peso. El motor del curso, con el peso como un sólido que
      solo puede bajar colgado de dos barras de 3 m, da lo mismo.

      **La lectura.** Se ha supuesto que el peso no gira: los dos cables
      llegan juntos al centro de su cara superior. Si se dejara girar y los
      cables se ataran separados, a la misma distancia del centro, el
      equilibrio de momentos obligaría a $N_1 = N_2 = 300$ N y el peso se
      inclinaría; pero entonces los módulos no harían falta, y el enunciado
      los da.
  # ── Problema 1 · la barra con la holgura, el plano a 30° y la dirección u.
  - id: exerm1819-1par-5-la-barra-que-toca-la-pared
    titulo: La barra que llega a tocar la pared, un plano inclinado y una dirección u
    fuente: >-
      Problema 1 · Primer parcial del 16 de noviembre de 2018 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 2 puntos. El examen no publica resolución; el
      desarrollo es nuestro, con los convenios de los temas 2, 3, 4 y 8.
    nivel: examen
    enunciado: |
      (2p) La distancia entre la viga de la figura y la pared derecha es
      $\xi$ = 0,2 mm. Determinar:

      a/ El valor de $P$ para que la viga toque la pared derecha.

      b/ Siendo $\sigma$ = 20 MPa, el valor de la tensión cortante en el mismo
      plano.

      c/ Siendo $P$ = 30 kN, la deformación normal en la dirección de $u$.

      $E$ = 210 GPa; $\nu$ = 0,3; $A$ = 4 cm²

