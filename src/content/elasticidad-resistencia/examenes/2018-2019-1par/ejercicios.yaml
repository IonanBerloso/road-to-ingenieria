    pide: Los diagramas de cortantes y de flectores, con sus valores en función de q0 y a.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por dónde se empieza a resolver la viga?
        opciones:
          - texto: >-
              Por el tramo EC: el flector es nulo en la rótula E, y momentos
              respecto de E dan la reacción de C
            correcta: true
            mensaje: |
              Eso es. EC cuelga de la rótula y solo tiene un apoyo, C: con
              $M_E = 0$ queda resuelto, $R_C = q_0a/2$. Lo que la rótula
              transmite pasa al tramo AE como una fuerza más.
          - texto: >-
              Por el equilibrio global: tres reacciones verticales y dos
              ecuaciones útiles bastan si se toman bien los momentos
            mensaje: |
              Tres incógnitas verticales ($R_A$, $R_B$, $R_C$) y solo dos
              ecuaciones útiles del equilibrio global: falta una. Es la de la
              rótula, $M_E = 0$; sin ella la viga parece hiperestática.
          - texto: >-
              La rótula no cambia nada: es una viga continua sobre tres
              apoyos
            mensaje: |
              Una viga continua sobre tres apoyos **sería** hiperestática. La
              rótula libera el giro relativo y obliga a que el flector sea cero
              en E: es la ecuación que la hace isostática.
      - tipo: calcular
        titulo: La reacción en B
        pregunta: |
          ¿Cuánto vale la reacción en B, en unidades de $q_0a$? Positiva hacia
          arriba.
        respuesta:
          tipo: numero
          valor: '1.25'
          tolerancia: 0.001
          formato: un número, en unidades de q0·a
        distractores:
          - valor: '0.5'
            mensaje: |
              Has resuelto AE solo con $P$, sin la fuerza de la rótula. EC
              se apoya en E: le pasa a AE $q_0a/2$ hacia abajo, en E, a $3a$ de
              A. Momentos en A: $R_B\cdot2a = q_0a\cdot a + \tfrac{q_0a}{2}\cdot3a$.
          - valor: '2.25'
            mensaje: |
              Has cargado AE con toda la repartida de EC, $q_0a$ en su centro,
              a $3{,}5a$ de A. La rótula parte la viga: la mitad de esa carga
              la recoge C, y AE solo recibe $q_0a/2$ en E.
        pista: |
          EC: $R_C = q_0a/2$, y la rótula empuja AE hacia abajo con $q_0a/2$
          en E. Luego momentos respecto de A en AE.
        desarrollo: |
          $$
          R_B\cdot2a = q_0a\cdot a + \tfrac{q_0a}{2}\cdot3a \;\Longrightarrow\; R_B = \tfrac54\,q_0a
          $$

          y la vertical de AE: $R_A = q_0a + \tfrac{q_0a}{2} - \tfrac54q_0a = \tfrac14\,q_0a$.
      - tipo: calcular
        titulo: El flector en D
        pregunta: |
          ¿Cuánto vale el flector en D, en unidades de $q_0a^{2}$? Con el
          convenio del curso: positivo si tracciona la fibra inferior.
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.001
          formato: un número, en unidades de q0·a²
        distractores:
          - valor: '0.5'
            mensaje: |
              Es $Pab/L = q_0a\cdot a\cdot a/2a$, el de AB biapoyada con la
              carga en el centro. Pero B no es un extremo: el vuelo BE lleva la
              fuerza de la rótula, que levanta A y baja el flector. Con
              $R_A = q_0a/4$, $M_D = R_A\cdot a$.
          - valor: '-0.25'
            mensaje: |
              El valor está bien y el signo no. A la izquierda de D solo está
              $R_A$, hacia arriba: hace girar la parte izquierda en sentido
              horario y tracciona la fibra inferior. Es positivo.
        pista: |
          $M_D = R_A\cdot a$, tomando la parte izquierda de la sección D.
        desarrollo: |
          $$
          M_D = \tfrac14q_0a\cdot a = \tfrac14\,q_0a^{2}
          $$
      - tipo: calcular
        titulo: El flector en B
        pregunta: |
          ¿Cuánto vale el flector en B, en unidades de $q_0a^{2}$?
        respuesta:
          tipo: numero
          valor: '-0.5'
          tolerancia: 0.001
          formato: un número, en unidades de q0·a²
        distractores:
          - valor: '-1'
            mensaje: |
              Has puesto en E la carga entera de EC, $q_0a$. La rótula solo
              transmite $q_0a/2$: desde la derecha, $M_B = -\tfrac{q_0a}{2}\cdot a$.
          - valor: '0.5'
            mensaje: |
              El valor está bien y el signo no. BE es un vuelo con una fuerza
              hacia abajo en la punta: tracciona la fibra **superior**, y el
              flector es negativo.
        pista: |
          Desde la derecha de B, en AE: solo la fuerza de la rótula,
          $q_0a/2$ hacia abajo, a una distancia $a$.
        desarrollo: |
          $$
          M_B = -\tfrac{q_0a}{2}\cdot a = -\tfrac12\,q_0a^{2}
          $$

          Desde la izquierda sale igual: $R_A\cdot2a - P\cdot a = \tfrac12q_0a^{2} - q_0a^{2}$.
      - tipo: calcular
        titulo: El flector máximo de EC
        pregunta: |
          En EC el flector tiene un máximo relativo. ¿Cuánto vale, en unidades
          de $q_0a^{2}$?
        respuesta:
          tipo: numero
          valor: '0.125'
          tolerancia: 0.001
          formato: un número, en unidades de q0·a²
        distractores:
          - valor: '0.5'
            mensaje: |
              Es $q_0a^{2}/2$, el empotramiento de un voladizo con esa carga.
              EC está apoyada en sus dos extremos (la rótula y C) y se comporta
              como una biapoyada: su máximo es $q_0a^{2}/8$, en el centro.
          - valor: '0.25'
            mensaje: |
              Es $M_D$, el mayor flector positivo de toda la viga. El máximo
              **relativo** de EC está donde se anula el cortante, en el centro
              del tramo, y vale $q_0a^{2}/8$.
        pista: |
          En EC, $V = q_0a/2 - q_0s$, con $s$ medida desde E. Se anula en
          $s = a/2$; el área del cortante hasta ahí es el flector.
        desarrollo: |
          $$
          M\!\left(\tfrac a2\right) = 0 + \tfrac12\cdot\tfrac{q_0a}{2}\cdot\tfrac a2 = \tfrac18\,q_0a^{2}
          $$
      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de cortantes y de flectores**, alineados
          bajo la viga, con los valores en A, D, B, E y C y el máximo de EC.
        comprueba:
          - punto: |
              **Cortante de $q_0a/4$ en AD**, salto de $-q_0a$ en D hasta
              $-3q_0a/4$, y salto de $\tfrac54q_0a$ en B hasta $q_0a/2$.
            porque: |
              Cada fuerza concentrada hace saltar el cortante lo que vale: $P$
              hacia abajo en D, la reacción de B hacia arriba.
          - punto: |
              **$q_0a/2$ constante de B a E, que pasa la rótula sin saltar**, y
              recta en EC hasta $-q_0a/2$ en C, con el cero en el centro.
            porque: |
              La rótula transmite cortante; lo que no transmite es momento. En
              EC la carga repartida baja el cortante con pendiente $-q_0$.
          - punto: |
              **Flector: 0 en A, $q_0a^{2}/4$ en D, $-q_0a^{2}/2$ en B y 0 en E**,
              rectas entre ellos.
            porque: |
              Sin carga repartida, el flector es lineal (dM/dx = V constante),
              y en la rótula vale cero por definición: si no pasa por cero en
              E, hay un error antes.
          - punto: |
              **Parábola en EC**, de 0 en E a 0 en C, con el máximo
              $q_0a^{2}/8$ en el centro.
            porque: |
              Con carga uniforme el flector es parabólico, y su extremo está
              donde el cortante se anula.
        figura: |
          <svg viewBox="0 0 400 266" role="img" width="400" height="266" aria-labelledby="exerm1819-1par-6-la-gerber-con-la-rotula-en-e-dib-t exerm1819-1par-6-la-gerber-con-la-rotula-en-e-dib-d">
          <title id="exerm1819-1par-6-la-gerber-con-la-rotula-en-e-dib-t">Los diagramas de cortantes y de flectores de la viga ADBEC</title>
