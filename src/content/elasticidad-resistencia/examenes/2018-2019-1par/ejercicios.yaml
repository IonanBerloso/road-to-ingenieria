      <line x1="380" y1="150" x2="402" y2="150" stroke="var(--faint)" stroke-width="1"/><polygon points="402,150 395,152.6 395,147.4" fill="var(--faint)"/><polygon points="380,150 387,147.4 387,152.6" fill="var(--faint)"/><text x="391" y="145" text-anchor="middle" font-size="13" font-style="italic" fill="var(--ink)">ξ</text>
