      **Notas nuestras.** Los apoyos de las barras 1 y 2 están en la
      vertical de A, como en la figura. Con los dos 30° y la cota $a$:
      $L_{AB} = \tfrac{\sqrt3}{2}a$, B está a $\tfrac{\sqrt3}{4}a$ de esa
      vertical y a $\tfrac34a$ por encima de A, $L_1 = \tfrac{\sqrt3}{4}a$ y
      $L_2 = \tfrac a2$. Las respuestas van en unidades de $P$ y de
      $P/(E_2A)$, porque el examen no da números.
    pide: >-
      N1, N2 y la fuerza de AB en unidades de P (tracción positiva), y el
      giro de AB en unidades de P/(E2·A), antihorario positivo.
    pasos:
      - tipo: reconocer
        pregunta: |
          AB gira un ángulo pequeño $\theta$ alrededor de A. ¿Cómo se mueve B y
          cuánto se alarga cada barra?
        opciones:
          - texto: >-
              B se mueve perpendicular a AB, $\theta\cdot L_{AB}$; cada barra
              se alarga la proyección de ese desplazamiento sobre ella
            correcta: true
            mensaje: |
              Eso es: «el arco se sustituye por la tangente» (apuntes del tema
              8, ecs. 8.10-8.12). B baja y se va hacia la derecha, y las dos
              barras, que tiran de B hacia la izquierda, se alargan.
          - texto: >-
              B baja verticalmente, y cada barra se alarga lo que baja B por
              el seno de su ángulo
            mensaje: |
              B no puede bajar en vertical: está en una barra rígida
              articulada en A, así que se mueve **perpendicular a AB**, a 30°
              de la horizontal. Con un descenso vertical, la barra 1, que es
              horizontal, no se alargaría nada.
          - texto: >-
              Las dos barras se alargan lo mismo, porque las dos llegan a B
            mensaje: |
              Llegan al mismo punto pero con direcciones distintas: cada una
              ve la proyección del desplazamiento de B sobre **su** dirección.
              Aquí $\Delta L_1 = \tfrac34a\theta$ y $\Delta L_2 = \tfrac{\sqrt3}{2}a\theta$
              (en valor absoluto).
      - tipo: calcular
        titulo: La fuerza en la barra 1
        pregunta: |
          ¿Cuánto vale $N_1$, en unidades de $P$? Positiva a tracción.
        respuesta:
          tipo: numero
          valor: '0.41689'
          tolerancia: 0.0005
          formato: un número, en unidades de P (vale 3/(3√3 + 2))
        distractores:
          - valor: '0.26795'
            mensaje: |
              Has tomado las dos barras con el mismo módulo: así llevarían lo
              mismo, $0{,}268P$ cada una. Con $E_1 = 3E_2$ la barra 1 es tres
              veces más rígida y se lleva tres veces la fuerza de la 2:
              $N_1 = 3N_2$.
          - valor: '0.12933'
            mensaje: |
              Has puesto el módulo al revés, $E_2 = 3E_1$. El enunciado dice
              $E_1 = 3E_2$: la barra más rígida es la 1.
        pista: |
          Compatibilidad: $N_1 = \dfrac{E_1A}{L_1}\Delta L_1$ y
          $N_2 = \dfrac{E_2A}{L_2}\Delta L_2$ dan $N_1 = 3N_2$. Momentos en A:
          $\tfrac34a\,N_1 + \tfrac{\sqrt3}{2}a\,N_2 = \tfrac{\sqrt3}{4}a\,P$.
        desarrollo: |
          Con $\theta$ horario y pequeño, $\Delta L_1 = \tfrac34a\theta$ y
          $\Delta L_2 = \tfrac{\sqrt3}{2}a\theta$:

          $$
          N_1 = \frac{3E_2A}{\sqrt3a/4}\cdot\frac34a\theta = 3\sqrt3\,E_2A\theta,\qquad
          N_2 = \frac{E_2A}{a/2}\cdot\frac{\sqrt3}{2}a\theta = \sqrt3\,E_2A\theta
          $$

          Así $N_1 = 3N_2$, y en la ecuación de momentos:

          $$
          \tfrac94N_2 + \tfrac{\sqrt3}{2}N_2 = \tfrac{\sqrt3}{4}P \;\Longrightarrow\;
          N_2 = \frac{P}{3\sqrt3 + 2} = 0{,}1390P,\qquad N_1 = \frac{3P}{3\sqrt3 + 2} = 0{,}4169P
          $$
      - tipo: calcular
        titulo: La fuerza en la barra 2
        pregunta: |
          ¿Cuánto vale $N_2$, en unidades de $P$? Positiva a tracción.
        respuesta:
          tipo: numero
          valor: '0.13896'
          tolerancia: 0.0005
          formato: un número, en unidades de P (vale 1/(3√3 + 2))
        distractores:
          - valor: '0.26795'
            mensaje: |
              Es lo que sale con $E_1 = E_2$: las dos barras llevarían lo
              mismo. La barra 1 es tres veces más rígida y se queda con tres
              veces más fuerza.
          - valor: '0.38800'
            mensaje: |
              Has puesto el módulo al revés, $E_2 = 3E_1$: entonces la barra 2
              sería la rígida y se llevaría la mayor parte. Es al contrario.
        pista: |
          $N_2 = N_1/3$.
        desarrollo: |
          $$
          N_2 = \frac{N_1}{3} = \frac{P}{3\sqrt3 + 2} = 0{,}1390\,P
          $$
      - tipo: calcular
        titulo: La fuerza en AB
        pregunta: |
          AB solo recibe fuerzas en sus extremos. ¿Cuánto vale su fuerza
          normal, en unidades de $P$? Positiva a tracción.
        respuesta:
          tipo: numero
          valor: '-1.07447'
          tolerancia: 0.0005
          formato: un número, en unidades de P
        distractores:
          - valor: '1.07447'
            mensaje: |
              El valor está bien y el signo no. AB empuja a B hacia arriba y
              hacia la derecha, alejándolo de A: la barra está **comprimida**,
              y con el convenio del curso eso es $N < 0$.
          - valor: '-1.1547'
            mensaje: |
              Es $P/\cos30°$: AB sosteniendo $P$ ella sola. Las barras 1 y 2
              tiran de B hacia la izquierda y hacia arriba, y la fuerza de AB
              es lo que equilibra las tres juntas.
        pista: |
          Equilibrio del nudo B: la fuerza de AB va según AB y equilibra
          $N_1$ (hacia la izquierda), $N_2$ (hacia arriba a la izquierda, a 30°)
          y $P$.
        desarrollo: |
          Lo que AB tiene que hacer sobre B:

          $$
          F_x = N_1 + \tfrac{\sqrt3}{2}N_2 = 0{,}5372P,\qquad
          F_y = P - \tfrac12N_2 = 0{,}9305P
          $$

          Su cociente es $\operatorname{tg}30°$: va según AB, como tiene que
          ir. Su módulo, $\sqrt{F_x^{2} + F_y^{2}} = 1{,}0745P$, empuja a B
          lejos de A: $N_{AB} = -1{,}0745P$, compresión.
      - tipo: calcular
        titulo: El giro de AB
        pregunta: |
          ¿Cuánto gira AB, en unidades de $P/(E_2A)$? Antihorario positivo.
        respuesta:
          tipo: numero
          valor: '-0.08023'
          tolerancia: 0.0001
          formato: un número, en unidades de P/(E2·A), en radianes
        distractores:
          - valor: '0.08023'
            mensaje: |
              El valor está bien y el sentido no. Con la carga hacia abajo en
              B, AB gira hacia la derecha, en sentido **horario**: negativo.
          - valor: '-0.15470'
            mensaje: |
              Es el giro con $E_1 = E_2$. Con la barra 1 tres veces más
              rígida, la estructura cede menos y el giro es menor.
        pista: |
          $N_2 = \sqrt3\,E_2A\,|\theta|$, del paso de $N_1$.
        desarrollo: |
          $$
          |\theta| = \frac{N_2}{\sqrt3\,E_2A} = \frac{P}{\sqrt3(3\sqrt3 + 2)E_2A} = \frac{P}{(9 + 2\sqrt3)E_2A}
          = 0{,}08023\,\frac{P}{E_2A}
          $$

          en sentido horario: $\theta = -0{,}08023\,P/(E_2A)$ rad.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Una sola incógnita de movimiento: el giro $\theta$ de AB
              alrededor de A. B se mueve perpendicular a AB.
          - texto: >-
              Alargamientos por proyección: $\Delta L_1 = \tfrac34a\theta$ y
              $\Delta L_2 = \tfrac{\sqrt3}{2}a\theta$; con $E_1 = 3E_2$,
              $N_1 = 3\sqrt3E_2A\theta$ y $N_2 = \sqrt3E_2A\theta$.
          - texto: >-
              Momentos respecto de A:
              $\tfrac34a\,N_1 + \tfrac{\sqrt3}{2}a\,N_2 = \tfrac{\sqrt3}{4}a\,P$, de
              donde $N_2 = P/(3\sqrt3 + 2)$ y $N_1 = 3N_2$.
          - texto: >-
              Equilibrio del nudo B: $N_{AB} = -1{,}0745P$ (compresión), y
              $\theta = -P/((9 + 2\sqrt3)E_2A)$, horario.
          - texto: >-
              Como AB es rígida, no se deforma y no trabaja: toda la carga la
              llevan las barras 1 y 2.
            trampa: true
            mensaje: |
              Rígida quiere decir que no se deforma, no que no tenga fuerza.
              AB está comprimida con $1{,}07P$: es la que lleva la mayor parte
              de la carga a la articulación A.
    resolucion: |
      **Geometría.** Con los dos 30° y la cota $a$ (de A a la altura del
      apoyo de la barra 2): la barra 2 sube de B hasta $a$, así que
      $a = L_{AB}\cos30° + L_{AB}\operatorname{sen}30°\operatorname{tg}30°$, y

      $$
      L_{AB} = \tfrac{\sqrt3}{2}a,\qquad B = \left(\tfrac{\sqrt3}{4}a,\ \tfrac34a\right),\qquad
      L_1 = \tfrac{\sqrt3}{4}a,\qquad L_2 = \tfrac a2
      $$

      con el origen en A, X hacia la derecha e Y hacia arriba.

      **Compatibilidad** (apuntes del tema 8, ecs. 8.9-8.12). AB gira un
      ángulo pequeño alrededor de A; con $\theta$ antihorario positivo, B se
      mueve $\theta(-\tfrac34a,\ \tfrac{\sqrt3}{4}a)$. Proyectando sobre cada
      barra (del apoyo hacia B):

      $$
      \Delta L_1 = -\tfrac34a\,\theta,\qquad \Delta L_2 = -\tfrac{\sqrt3}{2}a\,\theta
      $$

      $$
      N_1 = \frac{3E_2A}{L_1}\Delta L_1 = -3\sqrt3\,E_2A\,\theta,\qquad
      N_2 = \frac{E_2A}{L_2}\Delta L_2 = -\sqrt3\,E_2A\,\theta
      \;\Longrightarrow\; N_1 = 3N_2
      $$

      **Equilibrio.** AB solo tiene fuerzas en A y en B. Momentos respecto de
      A de las fuerzas en B ($N_1$ hacia la izquierda, $N_2$ hacia el apoyo
      2, $P$ hacia abajo):

      $$
      \tfrac34a\,N_1 + \tfrac{\sqrt3}{2}a\,N_2 - \tfrac{\sqrt3}{4}a\,P = 0
      \;\Longrightarrow\;
      N_2 = \frac{P}{3\sqrt3 + 2} = 0{,}1390\,P,\qquad N_1 = \frac{3P}{3\sqrt3 + 2} = 0{,}4169\,P
      $$

      Las dos a tracción.

      **La fuerza de AB.** El nudo B: AB tiene que hacer sobre él
      $(N_1 + \tfrac{\sqrt3}{2}N_2,\ P - \tfrac12N_2) = (0{,}5372;\ 0{,}9305)P$,
      que va según AB (su cociente es $\operatorname{tg}30°$) y empuja a B
      lejos de A:

      $$
      N_{AB} = -1{,}0745\,P\quad\text{(compresión)}
      $$

      **b/ El giro.**

      $$
      \theta = -\frac{N_2}{\sqrt3\,E_2A} = -\frac{P}{(9 + 2\sqrt3)\,E_2A} = -0{,}08023\,\frac{P}{E_2A}
      $$

      Horario: B se va hacia la derecha y hacia abajo.

      **Comprobación.** El motor del curso, con AB como sólido rígido
      articulado en A y las dos barras con $E_1A = 3E_2A$, da las mismas
      fuerzas, la reacción en A según AB con $1{,}0745P$ y el mismo giro. Y
      el alargamiento de la barra 1 con la $N_1$ del motor,
      $N_1L_1/(3E_2A)$, dividido por $\tfrac34a$, devuelve el mismo $\theta$.
