ejercicios:
  # ── Teoría · cuestión 1 · el tetraedro de Cauchy: {S} = [σ]{n}.
  - id: exerm1819-1par-1-el-tetraedro-de-cauchy
    titulo: El tetraedro de Cauchy, o cómo sale el vector tensión de cualquier plano
    fuente: >-
      Cuestión 1 de teoría · Primer parcial del 16 de noviembre de 2018 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 2, apartado 2.4.1.
    nivel: examen
    enunciado: |
      (1p) Deducir la relación entre el vector tensión correspondiente a un
      plano que pasa por el origen y las tensiones normales y tangenciales de
      los planos coordenados.
    pide: >-
      La deducción de {S} = [σ]{n} con el equilibrio del tetraedro elemental:
      las tres componentes del vector tensión de un plano cualquiera en
      función de σx, σy, σz, τxy, τyz, τzx y de la normal.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el tetraedro OABC, el plano inclinado ABC tiene normal
          $\hat{n} = (n_x, n_y, n_z)$. ¿Cuánto vale el área de la cara OBC, la
          perpendicular al eje $x$?
        opciones:
          - texto: El área de ABC multiplicada por $n_x$
            correcta: true
            mensaje: |
              Eso es (ec. 2.11). OBC es la proyección de ABC sobre el plano
              $yz$, y proyectar multiplica el área por el coseno del ángulo
              entre las dos normales, que es $n_x$. Con las tres caras igual,
              al dividir el equilibrio por el área de ABC solo quedan las
              componentes de $\hat{n}$.
          - texto: La misma que ABC, porque las cuatro caras son diferenciales
            mensaje: |
              Son diferenciales las cuatro, pero no iguales: OBC es la
              proyección de ABC y es más pequeña. Si fueran iguales, el vector
              tensión de ABC no dependería de su orientación, y depende.
          - texto: El área de ABC dividida por $n_x$
            mensaje: |
              Al revés: ABC es la cara grande y OBC su proyección, así que
              $\text{OBC} = n_x\cdot\text{ABC}$ con $n_x \le 1$. Dividiendo
              saldría una cara coordenada mayor que la inclinada.
          - texto: >-
              No se puede saber sin las fuerzas de volumen, que entran en el
              equilibrio
            mensaje: |
              Las fuerzas de volumen entran, pero multiplicadas por el volumen
              del tetraedro, que es un infinitésimo de orden superior a las
              áreas: al dividir por el área de ABC y hacer el tetraedro cada
              vez más pequeño, desaparecen. Las áreas salen de la geometría.
      - tipo: calcular
        titulo: La componente x del vector tensión, en un ejemplo
        pregunta: |
          Un ejemplo nuestro con el tensor del parcial del 3 de noviembre de
          2017:

          $$
          [\sigma] = \begin{bmatrix} 5 & 0 & -12\\ 0 & -6 & 0\\ -12 & 0 & 1 \end{bmatrix}\ \text{MPa},
          \qquad \hat{n} = \tfrac{1}{3}(2,\ 1,\ 2)
          $$

          ¿Cuánto vale $S_{nx}$, en MPa?
        respuesta:
          tipo: numero
          valor: '-4.6667'
          tolerancia: 0.002
          formato: un número, en MPa (vale -14/3)
        distractores:
          - valor: '3.3333'
            mensaje: |
              Te has quedado con $\sigma_x n_x = 5\cdot\tfrac23$. En la cara
              perpendicular a $x$ actúan también las tangenciales: la
              componente $x$ del vector tensión recoge $\tau_{yx}n_y$ y
              $\tau_{zx}n_z$, y aquí $\tau_{zx} = -12$ pesa más que $\sigma_x$.
          - valor: '-14'
            mensaje: |
              Has multiplicado por $(2, 1, 2)$ sin dividir por 3. La normal
              tiene que ser **unitaria**: las áreas de las caras son
              $n_x$, $n_y$ y $n_z$ veces la de ABC solo si $|\hat{n}| = 1$.
        pista: |
          $S_{nx} = \sigma_x n_x + \tau_{yx} n_y + \tau_{zx} n_z$ (ec. 2.13).
        desarrollo: |
          $$
          S_{nx} = 5\cdot\tfrac23 + 0\cdot\tfrac13 + (-12)\cdot\tfrac23 = -\tfrac{14}{3} = -4{,}667\ \text{MPa}
          $$

          Igual, $S_{ny} = -6\cdot\tfrac13 = -2$ y
          $S_{nz} = -12\cdot\tfrac23 + 1\cdot\tfrac23 = -\tfrac{22}{3}$ MPa.
      - tipo: calcular
        titulo: La tensión normal en ese plano
        pregunta: |
          Con el mismo ejemplo, ¿cuánto vale la componente normal
          $\sigma_n = \{n\}^{t}\{S_n\}$, en MPa?
        respuesta:
          tipo: numero
          valor: '-8.6667'
          tolerancia: 0.002
          formato: un número, en MPa (vale -26/3)
        distractores:
          - valor: '8.9194'
            mensaje: |
              Es el módulo de $\vec{S}_n$, $\sqrt{(14/3)^{2} + 2^{2} + (22/3)^{2}}$.
              La componente normal es la **proyección** de $\vec{S}_n$ sobre
              $\hat{n}$ (ec. 2.16), y puede ser negativa: aquí el plano está
              comprimido. El módulo junta la normal y la tangencial.
          - valor: '2'
            mensaje: |
              Has usado solo la diagonal, $\sigma_x n_x^{2} + \sigma_y n_y^{2} +
              \sigma_z n_z^{2} = \tfrac{20 - 6 + 4}{9}$. Esa fórmula vale en
              **ejes principales**; con tangenciales falta
              $2\tau_{zx}n_zn_x = 2(-12)\tfrac49$.
        pista: |
          $\sigma_n = n_xS_{nx} + n_yS_{ny} + n_zS_{nz}$, con las tres
          componentes del paso anterior.
        desarrollo: |
          $$
          \sigma_n = \tfrac23\left(-\tfrac{14}{3}\right) + \tfrac13(-2) + \tfrac23\left(-\tfrac{22}{3}\right)
          = -\tfrac{26}{3} = -8{,}667\ \text{MPa}
          $$

          y la tangencial, $\tau_n = \sqrt{|\vec{S}_n|^{2} - \sigma_n^{2}} = 2{,}108$ MPa (ec. 2.16).
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción completa, como en el examen: el tetraedro, las
          fuerzas sobre sus cuatro caras, las áreas y el resultado.
        rubrica:
          - punto: >-
              Se aísla el tetraedro OABC con tres caras en los planos
              coordenados y la cuarta, ABC, de normal n = (nx, ny, nz), con un
              dibujo.
            porque: >-
              Es la idea de la cuestión: el plano por el origen se «construye»
              cortando un trocito de sólido cuyas otras caras sí tienen
              tensiones conocidas.
            minimo: true
          - punto: >-
              Se escriben los vectores tensión de las caras coordenadas, que
              tienen normal exterior negativa: Sx = −σx i − τxy j − τxz k, y
              los otros dos igual (ec. 2.9).
            porque: >-
              Los signos menos son lo que se suele perder. Las caras del
              tetraedro miran hacia −x, −y y −z, y con el convenio del curso
              una componente positiva va en sentido negativo sobre una cara
              negativa.
            minimo: true
          - punto: >-
              Se plantea el equilibrio de fuerzas: Sn·ABC + Sx·OBC + Sy·OAC +
              Sz·OAB + F·dV = 0 (ec. 2.10).
            porque: >-
              Se multiplica cada tensión por el área de su cara: lo que se
              equilibra son fuerzas, no tensiones.
            minimo: true
          - punto: >-
              Se justifican las áreas, OBC = nx·ABC, OAC = ny·ABC,
              OAB = nz·ABC: cada cara coordenada es la proyección de ABC.
            porque: >-
              Es el paso que convierte áreas en componentes de la normal. Sin
              el porqué la deducción es una afirmación.
            minimo: true
          - punto: >-
              Se divide por el área de ABC y se desprecia el término de las
              fuerzas de volumen, porque dV es de orden superior a las áreas.
            porque: >-
              Si se olvida, el resultado depende del tamaño del tetraedro. Es
              un punto pequeño que el corrector mira.
          - punto: >-
              Se llega a Snx = σx nx + τyx ny + τzx nz y las otras dos
              (ec. 2.13), y se escriben en forma matricial, {Sn} = [σ]{n}
              (ec. 2.14).
            porque: >-
              Es la respuesta. La forma matricial es la que dice que el
              tensor de tensiones transforma la normal en el vector tensión.
            minimo: true
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Se aísla el tetraedro OABC: tres caras en los planos
              coordenados, de normal exterior $-\hat{\imath}$, $-\hat{\jmath}$
              y $-\hat{k}$, y la cara ABC de normal $\hat{n}$.
          - texto: >-
              Los vectores tensión de las caras coordenadas llevan el signo
              cambiado: $\vec{S}_x = -\sigma_x\hat{\imath} - \tau_{xy}\hat{\jmath} - \tau_{xz}\hat{k}$,
              y lo mismo $\vec{S}_y$ y $\vec{S}_z$.
          - texto: >-
              Equilibrio:
              $\vec{S}_n\,\text{ABC} + \vec{S}_x\,\text{OBC} + \vec{S}_y\,\text{OAC} + \vec{S}_z\,\text{OAB} + \vec{F}\,dV = 0$,
              con $\text{OBC} = n_x\,\text{ABC}$, $\text{OAC} = n_y\,\text{ABC}$ y $\text{OAB} = n_z\,\text{ABC}$.
          - texto: >-
              Se divide por ABC; $\vec{F}\,dV/\text{ABC}$ tiende a cero con
              el tetraedro, y queda $S_{nx} = \sigma_xn_x + \tau_{yx}n_y + \tau_{zx}n_z$
              y sus dos compañeras: $\{S_n\} = [\sigma]\{n\}$.
          - texto: >-
              Como las cuatro caras son diferenciales, se toman con la misma
              área y el vector tensión de ABC es la suma de los tres de las
              caras coordenadas.
            trampa: true
            mensaje: |
              Las caras coordenadas son **proyecciones** de ABC, de áreas
              $n_x$, $n_y$ y $n_z$ veces la suya. Con áreas iguales saldría
              $\vec{S}_n = \vec{S}_x' + \vec{S}_y' + \vec{S}_z'$, que no
              depende de $\hat{n}$: todos los planos tendrían la misma tensión.
    resolucion: |
      **La idea.** Se conocen las tensiones de los tres planos coordenados
      que pasan por O y se quiere la de un plano cualquiera por O. Se corta
      un tetraedro diminuto con tres caras en los planos coordenados y la
      cuarta en el plano buscado, y se le exige equilibrio (apuntes del tema
      2, apartado 2.4.1, figuras 2.8 y 2.9).

      **Las caras coordenadas.** Sus normales exteriores son $-\hat{\imath}$,
      $-\hat{\jmath}$ y $-\hat{k}$: son caras negativas, y una componente
      positiva actúa ahí en sentido negativo (ec. 2.9):

      $$
      \vec{S}_x = -\sigma_x\hat{\imath} - \tau_{xy}\hat{\jmath} - \tau_{xz}\hat{k},\quad
      \vec{S}_y = -\tau_{yx}\hat{\imath} - \sigma_y\hat{\jmath} - \tau_{yz}\hat{k},\quad
      \vec{S}_z = -\tau_{zx}\hat{\imath} - \tau_{zy}\hat{\jmath} - \sigma_z\hat{k}
      $$

      **El equilibrio** (ec. 2.10), con $\vec{F}$ la fuerza por unidad de
      volumen:

      $$
      \vec{S}_n\,\text{ABC} + \vec{S}_x\,\text{OBC} + \vec{S}_y\,\text{OAC} + \vec{S}_z\,\text{OAB} + \vec{F}\,dV = 0
      $$

      **Las áreas.** Cada cara coordenada es la proyección de ABC sobre su
      plano, y proyectar multiplica por el coseno del ángulo entre normales
      (ec. 2.11):

      $$
      \text{OBC} = n_x\,\text{ABC},\qquad \text{OAC} = n_y\,\text{ABC},\qquad \text{OAB} = n_z\,\text{ABC}
      $$

      **El resultado.** Se divide por ABC. El término $\vec{F}\,dV/\text{ABC}$
      es del orden del tamaño del tetraedro y desaparece al hacerlo tender a
      cero. Queda (ecs. 2.13 y 2.14):

      $$
      \begin{aligned}
      S_{nx} &= \sigma_x n_x + \tau_{yx} n_y + \tau_{zx} n_z\\
      S_{ny} &= \tau_{xy} n_x + \sigma_y n_y + \tau_{zy} n_z\\
      S_{nz} &= \tau_{xz} n_x + \tau_{yz} n_y + \sigma_z n_z
      \end{aligned}
      \qquad\Longleftrightarrow\qquad \{S_n\} = [\sigma]\{n\}
      $$

      La matriz es simétrica ($\tau_{ij} = \tau_{ji}$, ecs. 2.6-2.8), y es el
      tensor de tensiones: transforma la normal de un plano en su vector
      tensión. Sus componentes intrínsecas son
      $\sigma_n = \{n\}^{t}[\sigma]\{n\}$ y $\tau_n^{2} = |\vec{S}_n|^{2} - \sigma_n^{2}$
      (ec. 2.16).

      **Un ejemplo con números** (nuestro, con el tensor del parcial del
      3/11/2017): con $\hat{n} = \tfrac13(2, 1, 2)$, $\{S_n\} = (-\tfrac{14}{3},\ -2,\ -\tfrac{22}{3})$
      MPa, $\sigma_n = -\tfrac{26}{3} = -8{,}667$ MPa y $\tau_n = 2{,}108$ MPa.

  # ── Teoría · cuestión 2 · dos deformaciones principales iguales. Va en
  #    la hoja de teoría, pero es un cálculo.
  - id: exerm1819-1par-2-dos-deformaciones-principales-iguales
    titulo: Dos deformaciones principales iguales, y la dirección k
    fuente: >-
      Cuestión 2 de teoría · Primer parcial del 16 de noviembre de 2018 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 3, apartados 3.5.2
      y 3.6.
    nivel: examen
    enunciado: |
      (1p) La matriz de deformaciones en un punto O interior de un sólido
      elástico, referida a los ejes principales es:

      $$
      [\varepsilon] = \begin{bmatrix} 5 & 0 & 0\\ 0 & 5 & 0\\ 0 & 0 & -2 \end{bmatrix} 10^{-4}
      $$

      La dirección principal 3 en el sistema de referencia O*xyz* viene dada
      por $\hat{e}_3 = \frac{1}{\sqrt{2}}\left(\hat{\imath} + \hat{\jmath}\right)$.
      Determinar:

      a/ $\hat{e}_1$ y $\hat{e}_2$ de las direcciones principales 1 y 2 en el
      sistema O*xyz*.

      b/ Componentes longitudinal y transversal del vector deformación en la
      dirección $\hat{u} = \hat{k}$.
    pide: >-
      Dos vectores unitarios para las direcciones 1 y 2 en Oxyz, y la
      deformación longitudinal εu y la transversal ½γu de la dirección k.
    pasos:
      - tipo: reconocer
        pregunta: |
          $\varepsilon_1 = \varepsilon_2 = 5\cdot10^{-4}$. ¿Qué dice eso de las
          direcciones principales 1 y 2?
        opciones:
          - texto: >-
              Cualquier dirección perpendicular a $\hat{e}_3$ es principal: hay
              infinitas parejas $\hat{e}_1$, $\hat{e}_2$ válidas
            correcta: true
            mensaje: |
              Eso es. En el plano perpendicular a $\hat{e}_3$ el tensor es
              $5\cdot10^{-4}$ por la identidad: estira todas las direcciones
              lo mismo y no distorsiona ningún ángulo recto. El examen pide
              «$\hat{e}_1$ y $\hat{e}_2$», y la respuesta es **una pareja**
              ortonormal de ese plano, diciendo que hay más.
          - texto: >-
              Hay que diagonalizar el tensor en Oxyz para encontrarlas, y salen
              únicas
            mensaje: |
              Con dos valores propios iguales el subespacio propio es un
              plano entero: la diagonalización no elige dentro de él. Por eso
              el examen solo da $\hat{e}_3$, que sí es única.
          - texto: >-
              Son $\hat{\imath}$ y $\hat{\jmath}$, porque el tensor viene en
              ejes principales y los ejes son $x$, $y$ y $z$
            mensaje: |
              $\hat{\imath}$ y $\hat{\jmath}$ no son perpendiculares a
              $\hat{e}_3 = (\hat{\imath} + \hat{\jmath})/\sqrt2$: forman 45° con
              ella. Los ejes principales **no** son los de O*xyz*; esa es la
              trampa del enunciado.
      - tipo: calcular
        titulo: La componente longitudinal en la dirección k
        pregunta: |
          ¿Cuánto vale la deformación longitudinal $\varepsilon_u$ en la
          dirección $\hat{u} = \hat{k}$, en unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.001
          formato: un número, en unidades de 10⁻⁴
        distractores:
          - valor: '-2'
            mensaje: |
              Has tomado $\hat{k}$ por la dirección 3, como si el tensor
              estuviera en O*xyz*. La 3 es $(\hat{\imath} + \hat{\jmath})/\sqrt2$,
              y $\hat{k}$ es **perpendicular** a ella: está en el plano de las
              principales iguales.
          - valor: '1.5'
            mensaje: |
              $1{,}5\cdot10^{-4}$ es $\varepsilon_x$, la deformación según
              $\hat{\imath}$, que tiene la mitad de su peso en la dirección 3:
              $5\cdot\tfrac12 + (-2)\cdot\tfrac12$. La dirección pedida es
              $\hat{k}$, que no tiene nada de $\hat{e}_3$.
        pista: |
          $\hat{k}\cdot\hat{e}_3 = 0$. En ejes principales,
          $\varepsilon_u = \varepsilon_1u_1^{2} + \varepsilon_2u_2^{2} + \varepsilon_3u_3^{2}$.
        desarrollo: |
          Las componentes de $\hat{k}$ en ejes principales cumplen
          $u_1^{2} + u_2^{2} = 1$ y $u_3 = \hat{k}\cdot\hat{e}_3 = 0$:

          $$
          \varepsilon_u = 5\cdot10^{-4}\left(u_1^{2} + u_2^{2}\right) + (-2)\cdot10^{-4}\cdot0 = 5\cdot10^{-4}
          $$

          sea cual sea la pareja $\hat{e}_1$, $\hat{e}_2$ elegida.
      - tipo: calcular
        titulo: La componente transversal en la dirección k
        pregunta: |
          ¿Cuánto vale la componente transversal $\tfrac12\gamma_u$ del vector
          deformación en la dirección $\hat{k}$, en unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número, en unidades de 10⁻⁴
        distractores:
          - valor: '3.5'
            mensaje: |
              $3{,}5\cdot10^{-4} = (\varepsilon_1 - \varepsilon_3)/2$ es la
              $\tfrac12\gamma$ **máxima**, la de las direcciones a 45° de
              $\hat{e}_1$ y $\hat{e}_3$. $\hat{k}$ es principal: su vector
              deformación va según ella misma y no tiene parte transversal.
          - valor: '7'
            mensaje: |
              $7\cdot10^{-4} = \varepsilon_1 - \varepsilon_3$ es la $\gamma$
              máxima entera, y además de otra dirección. En $\hat{k}$, que es
              principal, $\vec{D}_u = 5\cdot10^{-4}\,\hat{k}$ y
              $\tfrac12\gamma_u = 0$.
        pista: |
          $\tfrac12\gamma_u = \sqrt{|\vec{D}_u|^{2} - \varepsilon_u^{2}}$ (ec. 3.53).
          ¿Cuánto vale $|\vec{D}_u|$ si $\hat{u}$ es principal?
        desarrollo: |
          $\hat{k}$ es principal, así que $\vec{D}_u = [\varepsilon]\hat{k} = 5\cdot10^{-4}\,\hat{k}$:

          $$
          \tfrac12\gamma_u = \sqrt{(5\cdot10^{-4})^{2} - (5\cdot10^{-4})^{2}} = 0
          $$
      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              Como $\varepsilon_1 = \varepsilon_2$, toda dirección perpendicular
              a $\hat{e}_3$ es principal con $5\cdot10^{-4}$: basta elegir una
              pareja ortonormal de ese plano.
          - texto: >-
              Una pareja: $\hat{e}_1 = \hat{k}$ y $\hat{e}_2 = \tfrac{1}{\sqrt2}(\hat{\imath} - \hat{\jmath})$,
              que con $\hat{e}_3$ forman un triedro directo
              ($\hat{e}_1\times\hat{e}_2 = \hat{e}_3$).
          - texto: >-
              $\hat{k}$ es perpendicular a $\hat{e}_3$, luego es principal:
              $\vec{D}_u = [\varepsilon]\hat{k} = 5\cdot10^{-4}\,\hat{k}$.
          - texto: >-
              Componente longitudinal $\varepsilon_u = 5\cdot10^{-4}$;
              transversal $\tfrac12\gamma_u = 0$.
          - texto: >-
              Las direcciones 1 y 2 son únicas: $\hat{e}_1 = \hat{\imath}$ y
              $\hat{e}_2 = \hat{\jmath}$, las que el tensor tiene en la diagonal.
            trampa: true
            mensaje: |
              $\hat{\imath}$ y $\hat{\jmath}$ forman 45° con $\hat{e}_3$: no
              son perpendiculares a ella, así que no pueden ser principales. Y
              con dos valores iguales las direcciones 1 y 2 nunca son únicas.
    resolucion: |
      **La idea.** El tensor viene en **ejes principales**, que no son los de
      O*xyz*: el eje 3 es $\hat{e}_3 = (\hat{\imath} + \hat{\jmath})/\sqrt2$.
      Y dos deformaciones principales son iguales, $\varepsilon_1 = \varepsilon_2 = 5\cdot10^{-4}$.

      **a/ Las direcciones 1 y 2.** En el plano perpendicular a $\hat{e}_3$
      el tensor estira todas las direcciones lo mismo, $5\cdot10^{-4}$, y no
      distorsiona ningún ángulo recto: **toda dirección de ese plano es
      principal**, y hay infinitas parejas $\hat{e}_1$, $\hat{e}_2$. Basta dar
      una ortonormal que forme triedro directo con $\hat{e}_3$; por ejemplo

      $$
      \hat{e}_1 = \hat{k},\qquad \hat{e}_2 = \tfrac{1}{\sqrt2}\left(\hat{\imath} - \hat{\jmath}\right),\qquad
      \hat{e}_1\times\hat{e}_2 = \tfrac{1}{\sqrt2}\left(\hat{\imath} + \hat{\jmath}\right) = \hat{e}_3
      $$

      Cualquier giro de esta pareja alrededor de $\hat{e}_3$ vale igual: por
      ejemplo $\hat{e}_1 = \tfrac12(1, -1, \sqrt2)$ y $\hat{e}_2 = \tfrac12(1, -1, -\sqrt2)$.

      **b/ El vector deformación según $\hat{k}$.** Como
      $\hat{k}\cdot\hat{e}_3 = 0$, $\hat{k}$ está en ese plano y es principal.
      Su vector deformación (ec. 3.49) va según ella misma:

      $$
      \vec{D}_u = [\varepsilon]\{\hat{k}\} = 5\cdot10^{-4}\,\hat{k}
      $$

      Las componentes intrínsecas (ecs. 3.51 a 3.53):

      $$
      \varepsilon_u = \vec{D}_u\cdot\hat{k} = 5\cdot10^{-4},\qquad
      \tfrac12\gamma_u = \sqrt{D_u^{2} - \varepsilon_u^{2}} = 0
      $$

      **Comprobación, en O*xyz*.** El tensor se escribe sin elegir la
      pareja: $[\varepsilon] = 5\cdot10^{-4}[I] - 7\cdot10^{-4}\{e_3\}\{e_3\}^{t}$,
      es decir

      $$
      [\varepsilon]_{Oxyz} = \begin{bmatrix} 1{,}5 & -3{,}5 & 0\\ -3{,}5 & 1{,}5 & 0\\ 0 & 0 & 5 \end{bmatrix}10^{-4}
      $$

      La tercera columna es $(0, 0, 5)\cdot10^{-4}$: $\hat{k}$ es principal
      con $5\cdot10^{-4}$, como se dijo. El motor del curso, girando el
      tensor principal con dos parejas distintas, da este mismo tensor, y
      sus principales vuelven a ser 5, 5 y $-2$ con la 3 según
      $(\hat{\imath} + \hat{\jmath})/\sqrt2$.

  # ── Teoría · cuestión 3 · el criterio de los estados límites de Mohr.
  - id: exerm1819-1par-3-el-criterio-de-los-estados-limites-de-mohr
    titulo: El criterio de los estados límites de Mohr, deducido
    fuente: >-
      Cuestión 3 de teoría · Primer parcial del 16 de noviembre de 2018 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Cayó palabra por palabra como
      cuestión 2 de teoría del examen final del 13 de enero de 2023. El
      examen no publica resolución; el desarrollo es nuestro y sigue los
      apuntes del tema 6, apartado 6.4.
      Los números de los pasos de cálculo son un ejemplo nuestro.
    nivel: examen
    enunciado: |
      (1p) Criterio de los estados límites de Mohr.
    pide: >-
      La curva intrínseca, su sustitución por la recta tangente a los
      círculos de tracción y compresión puras, sen ϕ en función de
      k = σet/σec, y la tensión equivalente σeqv = σ1 − kσ3 con la condición
      de no fallo.
    pasos:
      - tipo: reconocer
        pregunta: |
          La curva intrínseca se sustituye por una recta. ¿Qué dos círculos de
          Mohr la definen?
        opciones:
          - texto: >-
              El de tracción pura (de 0 a $\sigma_{et}$) y el de compresión
              pura (de $-\sigma_{ec}$ a 0): la recta es tangente a los dos
            correcta: true
            mensaje: |
              Eso es (fig. 6.2). Son los dos ensayos que se hacen de verdad, y
              por eso el criterio solo necesita $\sigma_{et}$ y $\sigma_{ec}$.
          - texto: >-
              El de tracción pura y el de cortadura pura, centrado en el
              origen
            mensaje: |
              Si el material sigue el criterio, el círculo de cortadura pura
              en el fallo también toca la recta, y sirve para despejar $k$
              cuando falta un ensayo. Pero los apuntes construyen la recta con
              tracción y compresión puras, los ensayos que dan $\sigma_{et}$
              y $\sigma_{ec}$.
          - texto: El círculo mayor del estado de tensiones y el de tracción pura
            mensaje: |
              El círculo del estado es el que se **compara** con la recta, no
              el que la define. La recta es una propiedad del material, y
              sale de sus ensayos.
      - tipo: calcular
        titulo: El ángulo de la recta intrínseca
        pregunta: |
          Un material con $\sigma_{et} = 100$ MPa y $\sigma_{ec} = 400$ MPa.
          ¿Cuánto vale $\operatorname{sen}\phi$?
        respuesta:
          tipo: numero
          valor: '0.6'
          tolerancia: 0.001
          formato: un número, sin unidades
        distractores:
          - valor: '0.75'
            mensaje: |
              Has dividido $(\sigma_{ec} - \sigma_{et})$ entre $\sigma_{ec}$, o
              has calculado $\operatorname{tg}\phi$. El seno sale del
              triángulo de los dos centros (ec. 6.11): la diferencia de
              radios entre la **distancia** de centros, que es la suma de
              radios: $\tfrac{150}{250}$.
          - valor: '-0.6'
            mensaje: |
              Has tomado $k = \sigma_{ec}/\sigma_{et} = 4$ en $(1 - k)/(1 + k)$.
              El curso define $k = \sigma_{et}/\sigma_{ec} = 0{,}25$ (ec. 6.12),
              menor que 1 en un material que aguanta más a compresión.
        pista: |
          $\operatorname{sen}\phi = \dfrac{\tfrac12(\sigma_{ec} - \sigma_{et})}{\tfrac12(\sigma_{ec} + \sigma_{et})} = \dfrac{1-k}{1+k}$.
        desarrollo: |
          $$
          k = \frac{100}{400} = 0{,}25,\qquad \operatorname{sen}\phi = \frac{1 - 0{,}25}{1 + 0{,}25} = 0{,}6
          \quad(\phi = 36{,}87^{\circ})
          $$
      - tipo: calcular
        titulo: La tensión equivalente de un estado
        pregunta: |
          Con el mismo material, un punto con $\sigma_1 = 50$, $\sigma_2 = 0$ y
          $\sigma_3 = -120$ MPa. ¿Cuánto vale $\sigma_{eqv}$ según Mohr, en MPa?
        respuesta:
          tipo: numero
          valor: '80'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '20'
            mensaje: |
              Has sumado en vez de restar: $\sigma_1 + k\sigma_3$. Es
              $\sigma_{eqv} = \sigma_1 - k\sigma_3$, y con $\sigma_3 < 0$ la
              compresión **suma** a la tracción: $50 + 0{,}25\cdot120$.
          - valor: '530'
            mensaje: |
              Has usado $k = \sigma_{ec}/\sigma_{et} = 4$. Con el cociente al
              revés la compresión pesaría cuatro veces más que la tracción, y
              es al contrario: el material aguanta más a compresión, así que
              $\sigma_3$ entra rebajada, $k = 0{,}25$.
          - valor: '170'
            mensaje: |
              Es $\sigma_1 - \sigma_3$, Tresca, el caso $k = 1$ (ec. 6.19). Mohr
              tiene en cuenta que el material resiste distinto a tracción y a
              compresión.
        pista: |
          $\sigma_{eqv} = \sigma_1 - k\sigma_3$ (ec. 6.15), con $k = 0{,}25$.
        desarrollo: |
          $$
          \sigma_{eqv} = 50 - 0{,}25\cdot(-120) = 80\ \text{MPa} < \sigma_{et} = 100
          $$

          No falla: el factor de seguridad es $FS = 100/80 = 1{,}25$ (ec. 6.1).
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe el criterio completo, como en el examen: la curva
          intrínseca, la recta, sen ϕ en función de k, la tensión equivalente
          y la condición de no fallo, con sus figuras.
        rubrica:
          - punto: >-
              Se explica la curva intrínseca: la envolvente de los círculos de
              Mohr máximos de los estados que hacen fallar al material; no hay
              fallo si el círculo máximo queda dentro (fig. 6.1).
            porque: >-
              Es la idea del criterio. Sin ella, la recta no se sabe de dónde
              sale.
            minimo: true
          - punto: >-
              Se sustituye la curva por la recta tangente a los círculos de
              tracción pura (0, σet) y compresión pura (−σec, 0), con su
              dibujo (fig. 6.2).
            porque: >-
              Son los dos ensayos que se tienen. Un dibujo sin los dos
              círculos y la recta tangente deja la deducción sin soporte.
            minimo: true
          - punto: >-
              Se obtiene sen ϕ = (σec − σet)/(σec + σet) = (1 − k)/(1 + k),
              con k = σet/σec (ecs. 6.11 y 6.12).
            porque: >-
              Es la geometría de los dos centros: diferencia de radios entre
              suma de radios. La definición de k, en ese orden, es la que se
              confunde.
            minimo: true
          - punto: >-
              Se define σeqv como el ensayo de tracción cuyo círculo tiene la
              tangente común con el círculo máximo del estado paralela a la
              recta intrínseca, y se plantea sen ϕ = QR/QS (fig. 6.3, ecs.
              6.13 y 6.14).
            porque: >-
              Es el paso que convierte un estado cualquiera en uno uniaxial
              equivalente, que es lo que hacen todos los criterios.
            minimo: true
          - punto: >-
              Se despeja σeqv = σ1 − kσ3 (ec. 6.15) y la condición de no fallo
              σeqv < σet (ec. 6.16).
            porque: >-
              Es el resultado que se usa. Sin la condición, el criterio no
              decide nada.
            minimo: true
          - punto: >-
              Se comenta que con k = 1 es Tresca, y que la compresión pura da
              σeqv = σet, así que la condición también la cubre; vale para
              materiales frágiles y dúctiles.
            porque: >-
              Son las dos comprobaciones que dicen que la fórmula está bien
              puesta, y las dos que el apunte cita.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              La envolvente de los círculos de Mohr de fallo es la curva
              intrínseca; se sustituye por la recta tangente a los círculos de
              tracción pura y compresión pura.
          - texto: >-
              Con los centros de esos círculos,
              $\operatorname{sen}\phi = \dfrac{\sigma_{ec} - \sigma_{et}}{\sigma_{ec} + \sigma_{et}} = \dfrac{1-k}{1+k}$,
              con $k = \sigma_{et}/\sigma_{ec}$.
          - texto: >-
              La tangente común al círculo máximo del estado y al de
              $\sigma_{eqv}$ forma el mismo ángulo $\phi$:
              $\operatorname{sen}\phi = \dfrac{\sigma_{eqv} - (\sigma_1 - \sigma_3)}{(\sigma_1 + \sigma_3) - \sigma_{eqv}}$.
          - texto: >-
              Despejando, $\sigma_{eqv} = \sigma_1 - k\sigma_3$, y no hay fallo
              si $\sigma_{eqv} < \sigma_{et}$.
          - texto: >-
              Como el material aguanta más a compresión, la condición de no
              fallo es doble: $\sigma_{eqv} < \sigma_{et}$ y además
              $|\sigma_3| < \sigma_{ec}$.
            trampa: true
            mensaje: |
              La condición $\sigma_{eqv} < \sigma_{et}$ ya incluye la
              compresión: en compresión pura, $\sigma_1 = 0$ y
              $\sigma_3 = -\sigma_{ec}$ dan $\sigma_{eqv} = k\sigma_{ec} = \sigma_{et}$
              (p. 8 de los apuntes). No hace falta una segunda condición.
    resolucion: |
      **La curva intrínseca** (apuntes del tema 6, apartado 6.4). Cuando un
      material falla, su estado de tensiones tiene un círculo de Mohr máximo
      crítico. La envolvente de los círculos de todos los estados de fallo es
      la **curva intrínseca**: un estado no falla si su círculo máximo queda
      dentro (fig. 6.1).

      **La recta intrínseca.** Obtener la curva exige muchos ensayos, así que
      se sustituye por la recta tangente a los dos círculos que se conocen:
      el de tracción pura, de 0 a $\sigma_{et}$, y el de compresión pura, de
      $-\sigma_{ec}$ a 0 (fig. 6.2). Del triángulo de sus centros y sus
      radios:

      $$
      \operatorname{sen}\phi = \frac{\tfrac12(\sigma_{ec} - \sigma_{et})}{\tfrac12(\sigma_{ec} + \sigma_{et})}
      = \frac{1 - k}{1 + k},\qquad k = \frac{\sigma_{et}}{\sigma_{ec}}
      $$

      (ecs. 6.11 y 6.12).

      **La tensión equivalente.** Se busca el ensayo de tracción,
      $\sigma_{eqv}$, cuyo círculo y el círculo máximo del estado,
      $(\sigma_3, \sigma_1)$, tengan una tangente común con el mismo ángulo
      $\phi$ que la recta (fig. 6.3). Con los puntos de esa figura (ecs. 6.13
      y 6.14):

      $$
      \operatorname{sen}\phi = \frac{QR}{QS},\qquad
      QR = \tfrac12\left[\sigma_{eqv} - (\sigma_1 - \sigma_3)\right],\qquad
      QS = \tfrac12\left[(\sigma_1 + \sigma_3) - \sigma_{eqv}\right]
      $$

      Sustituyendo $\operatorname{sen}\phi = (1-k)/(1+k)$ y despejando:

      $$
      (1+k)\left[\sigma_{eqv} - \sigma_1 + \sigma_3\right] = (1-k)\left[\sigma_1 + \sigma_3 - \sigma_{eqv}\right]
      \;\Longrightarrow\; \sigma_{eqv} = \sigma_1 - k\,\sigma_3
      $$

      **El criterio** (ecs. 6.15 y 6.16): no hay fallo si

      $$
      \sigma_{eqv} = \sigma_1 - k\,\sigma_3 < \sigma_{et}
      $$

      **Comprobaciones.** Con $k = 1$ ($\sigma_{et} = \sigma_{ec}$) es Tresca,
      $\sigma_1 - \sigma_3$ (ec. 6.19). En compresión pura, $\sigma_1 = 0$ y
      $\sigma_3 = -\sigma_{ec}$ dan $\sigma_{eqv} = k\sigma_{ec} = \sigma_{et}$:
      la misma condición cubre el fallo a compresión. Vale para materiales
      frágiles y dúctiles.

      **Un ejemplo con números** (nuestro): $\sigma_{et} = 100$ y
      $\sigma_{ec} = 400$ MPa dan $k = 0{,}25$ y $\operatorname{sen}\phi = 0{,}6$
      ($\phi = 36{,}87^{\circ}$). El estado $(50,\ 0,\ -120)$ MPa tiene
      $\sigma_{eqv} = 50 + 0{,}25\cdot120 = 80$ MPa: no falla, con $FS = 1{,}25$.
      La misma cifra sale del motor del curso y de despejar a mano la
      ecuación de QR/QS sin pasar por la fórmula final.

  # ── Teoría · cuestión 4 · dos cables de distinto material que cuelgan un
  #    peso. Va en la hoja de teoría, pero es un cálculo (tema 8).
  - id: exerm1819-1par-4-dos-cables-y-un-peso
    titulo: Dos cables de acero y de aluminio que cuelgan el mismo peso
    fuente: >-
      Cuestión 4 de teoría · Primer parcial del 16 de noviembre de 2018 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Los rótulos 1, 2 y W de la figura
      están en el Word original y el PDF no los dibuja. El examen no publica
      resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      (1p) Los cables 1 y 2 son de acero y alumnio, respectivamente. Si la
      longitud inicial de ambos es 3 m y su sección 4 mm², determinar la
      fuerza y la tensión en cada cable.

      <figure class="figura-examen">
      <svg viewBox="0 0 400 300" role="img" width="400" height="300" aria-labelledby="exerm1819-1par-4-dos-cables-y-un-peso-fig-t exerm1819-1par-4-dos-cables-y-un-peso-fig-d">
      <title id="exerm1819-1par-4-dos-cables-y-un-peso-fig-t">Dos cables que pasan por dos poleas y cuelgan un peso W</title>
      <desc id="exerm1819-1par-4-dos-cables-y-un-peso-fig-d">Dos paredes, a la izquierda y a la derecha. De cada pared sale un cable horizontal que llega a lo alto de una polea; las dos poleas están juntas en el centro, cada una sujeta por un brazo a 45° que acaba en una placa. Cada cable da un cuarto de vuelta a su polea y baja vertical por el lado interior. Los dos tramos verticales, muy juntos, llegan a la cara superior de un peso W que cuelga en el centro. El cable de la izquierda es el 1 y el de la derecha el 2.</desc>
