      **Comprobación.** Equilibrio global: $R_A + R_B + R_C = 2q_0a$, que es
      toda la carga ($q_0a + q_0a$). Integrando el cortante tramo a tramo
      desde $M_A = 0$ se llega a $M_E = 0$ en la rótula, que es la prueba de
      que las reacciones están bien. El motor del curso, con la viga escrita
      como «fijo en A, móviles en B y C, rótula en E», da las mismas
      reacciones, los mismos valores y el mismo máximo en el centro de EC.

  # ── Problema 3 · AB rígida, articulada en A, con las barras 1 y 2 en B.
  - id: exerm1819-1par-7-ab-rigida-con-dos-barras
    titulo: La barra rígida AB sostenida por dos barras de distinto módulo
    fuente: >-
      Problema 3 · Primer parcial del 16 de noviembre de 2018 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 2 puntos. El examen no publica resolución; el
      desarrollo es nuestro, con el convenio del tema 8.
    nivel: examen
    enunciado: |
      (2 p) La estructura de la figura soporta la fuerza $P$ en B y la barra
      AB puede considerarse rígida. Las barras 1 y 2 tienen la misma sección
      $A$ y $E_1 = 3E_2$. Determinar:

      a/ Fuerzas en la barras 1, 2 y AB.

      b/ Ángulo girado por AB.

