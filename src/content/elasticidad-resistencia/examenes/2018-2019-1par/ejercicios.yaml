      <g transform="translate(240 92) rotate(45)"><rect x="-4" y="-7" width="47.8" height="14" rx="2" fill="var(--faint)" fill-opacity=".55" stroke="var(--ink)" stroke-width="1.4"/><rect x="43.8" y="-29.7" width="12.6" height="59.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.6"/></g>
