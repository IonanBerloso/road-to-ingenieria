      <circle cx="160" cy="92" r="35" fill="var(--faint)" fill-opacity=".45" stroke="var(--ink)" stroke-width="2"/>
      <circle cx="240" cy="92" r="35" fill="var(--faint)" fill-opacity=".45" stroke="var(--ink)" stroke-width="2"/>
