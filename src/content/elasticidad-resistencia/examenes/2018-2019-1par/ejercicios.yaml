      - tipo: justificar
        pregunta: Ordena la resolución de examen. Una pieza es falsa.
        piezas:
          - texto: >-
              Tramo EC, momentos respecto de la rótula E: $R_C = q_0a/2$, y la
              rótula transmite $q_0a/2$.
          - texto: >-
              Tramo AE, con $q_0a/2$ hacia abajo en E: momentos en A dan
              $R_B = \tfrac54q_0a$, y la vertical, $R_A = \tfrac14q_0a$.
          - texto: >-
              Cortantes: $q_0a/4$ en AD, $-\tfrac34q_0a$ en DB, $q_0a/2$ en BE y
              recta de $q_0a/2$ a $-q_0a/2$ en EC.
          - texto: >-
              Flectores: 0 en A, $\tfrac14q_0a^{2}$ en D, $-\tfrac12q_0a^{2}$ en
              B, 0 en E y máximo $\tfrac18q_0a^{2}$ en el centro de EC.
          - texto: >-
              En la rótula el cortante también es cero, porque una
              articulación no transmite esfuerzos.
            trampa: true
            mensaje: |
              Una rótula no transmite **momento**, pero sí fuerza: aquí pasa
              $q_0a/2$ de EC a AE, y el cortante en E vale $q_0a/2$. Sin esa
              fuerza, $R_B$ no saldría $\tfrac54q_0a$.
    resolucion: |
      **Convenio** (apuntes del tema 7, pp. 8-9 y 12): cortante positivo si la
      resultante a la izquierda de la sección va hacia arriba, flector
      positivo si tracciona la fibra inferior, $dV/dx = -q$ y $dM/dx = V$
      (ecs. 7.14 y 7.15). Origen en A; los puntos A, D, B, E y C están a $a$
      uno de otro.

      **El tramo EC.** El flector en la rótula es cero. Momentos respecto de
      E:

      $$
      R_C\,a = q_0a\cdot\tfrac a2 \;\Longrightarrow\; R_C = \tfrac12\,q_0a
      $$

      y la vertical de EC deja en la rótula $q_0a/2$: hacia arriba sobre EC
      y hacia abajo sobre AE.

      **El tramo AE.** Con $P = q_0a$ en D y $q_0a/2$ hacia abajo en E:

      $$
      R_B\cdot2a = q_0a\cdot a + \tfrac{q_0a}{2}\cdot3a \;\Longrightarrow\; R_B = \tfrac54\,q_0a,\qquad
      R_A = q_0a + \tfrac{q_0a}{2} - \tfrac54q_0a = \tfrac14\,q_0a
      $$

      **Cortantes.**

      $$
      V = \begin{cases}
      \tfrac14\,q_0a & 0 < x < a\\[2pt]
      -\tfrac34\,q_0a & a < x < 2a\\[2pt]
      \tfrac12\,q_0a & 2a < x < 3a\\[2pt]
      \tfrac12\,q_0a - q_0(x-3a) & 3a < x < 4a
      \end{cases}
      $$

      Salta $-q_0a$ en D y $\tfrac54q_0a$ en B, pasa la rótula sin saltar y
      se anula en el centro de EC, $x = 3{,}5a$.

      **Flectores.**

      $$
      M = \begin{cases}
      \tfrac14\,q_0a\,x & 0 \le x \le a\\[2pt]
      \tfrac14\,q_0a^{2} - \tfrac34\,q_0a\,(x-a) & a \le x \le 2a\\[2pt]
      -\tfrac12\,q_0a^{2} + \tfrac12\,q_0a\,(x-2a) & 2a \le x \le 3a\\[2pt]
      \tfrac12\,q_0a\,(x-3a) - \tfrac12\,q_0(x-3a)^{2} & 3a \le x \le 4a
      \end{cases}
      $$

      Valores: $M_A = 0$, $M_D = \tfrac14q_0a^{2}$, $M_B = -\tfrac12q_0a^{2}$,
      $M_E = 0$, **máximo de EC $\tfrac18q_0a^{2}$ en $x = 3{,}5a$** y
      $M_C = 0$. El flector de mayor valor absoluto es el de B,
      $\tfrac12q_0a^{2}$, que tracciona la fibra superior.

