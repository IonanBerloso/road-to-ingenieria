      **Comprobaciones.** El motor del curso resuelve la viga con la
      ec. 11.3 (el voladizo como momento conocido, el empotramiento como
      vano de $I = \infty$ y $\delta_B$ como asiento, ajustado hasta que la
      reacción de B sea la del resorte) y, por otro camino, con la elástica
      por compatibilidad de flechas, sin la ec. 11.3: el resorte k en B más
      una fuerza $k\cdot h$ hacia abajo en B. Los dos dan $M_C$, $M_E$,
      $\delta_B$ y las reacciones iguales hasta la séptima cifra. Si el
      resorte no se uniera, B no lo alcanzaría: sin él, B baja
      $5{,}15\cdot10^{-3}L$, menos que h, y la viga sería un voladizo ABC
      sobre C, con $M_C = -1{,}389\,q_0L^{2}$.

  # ── Problema 3 · la barra OAB empotrada en O y el tirante BC.
  - id: exerm2122-ext-7-la-barra-oab-con-el-tirante-bc
    titulo: La barra OAB empotrada en O con el tirante BC, la P admisible por Von Mises y el descenso de A
    fuente: >-
      Problema 3 · Extraordinaria del 2 de febrero de 2022 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1,5 puntos (impreso «(1.5p)»). En el PDF el tirante BC y el apoyo
      C caen encima del cuadro del problema 4; la figura se ha redibujado del
      Word original. El examen no publica resolución; el desarrollo es
      nuestro, con los convenios de los temas 6, 12 y 13.
    nivel: examen
    enunciado: |
      3. (1.5p) El material de la barra OAB y el tirante BC tiene un módulo
      de elasticidad E=2·10⁶ Kg/cm², coeficiente de poisson v=0.29 y una
      tensión de fluencia de 4200 Kg/cm².

      El tramo OA sección circular de diametro100 mm se encuentra empotrado
      en O y soldado a la viga AB de sección rectangular b=50 mm y h= 75 mm.
      El tirante BC es de sección circular y de diámetro 7.5 mm. Determinar:

      a) La fuerza axial en la barra BC.

      b) El valor de P con un coeficiente de seguridad n=2 utilizando el
      criterio de Von Mises.

      c) Desplazamiento vertical A.

      En un cuadro junto a la figura: $L_{OA}$=$L_{BC}$=2.5$a$  $L_{AB}$=$a$
      $a$=1m

