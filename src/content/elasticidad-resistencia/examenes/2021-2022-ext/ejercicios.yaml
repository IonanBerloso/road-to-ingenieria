      **Notas nuestras.** «EI= 100L²q0» no es homogéneo: EI es una fuerza
      por una longitud al cuadrado, y $L^{2}q_0$ es una fuerza por una
      longitud. Se lee $EI = 100\,q_0L^{3}$, que es lo impreso con L = 1. El
      extremo de arriba del resorte está dibujado h por debajo de la viga, y
      el enunciado dice que el resorte se une a ella en B. «qo» y «q0» son
      la misma carga, $q_0$, y K y k, la misma rigidez. δ es positiva hacia
      abajo y M > 0 tracciona la fibra de abajo, como en el tema 11.
    pide: >-
      1) MB, MC y ME, en q0·L². 2) Los diagramas de V y M. 3) El
      desplazamiento vertical de B, en L.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con la ecuación de los tres momentos, ¿qué incógnitas quedan y de
          dónde sale la ecuación que cierra el sistema?
        opciones:
          - texto: >-
              $M_C$, $M_E$ y $\delta_B$: la ecuación en C y en E (con un vano
              ficticio en el empotramiento) da dos, y la tercera iguala la
              reacción que pide la viga en B con la fuerza del resorte, que
              depende de $\delta_B$
            correcta: true
            mensaje: |
              Eso es. $M_B$ no es incógnita: el voladizo AB lo da directamente
              (figura 11.6, p. 7). B no es un apoyo fijo, así que $\delta_B$
              entra en el término de asientos de la ec. 11.3 y hace falta una
              ecuación más: la del resorte, que unido a B y estirado h hace
              $k(\delta_B - h)$ hacia arriba.
          - texto: >-
              $M_B$, $M_C$ y $M_E$: la ecuación en B, en C y en E, con
              $\delta_B = 0$ porque B es un apoyo
            mensaje: |
              $M_B$ lo da el voladizo AB, sin plantear nada: $-P\cdot L/2$. Y B
              no es un apoyo fijo, es un resorte: baja, y $\delta_B$ es la
              tercera incógnita.
          - texto: >-
              $M_C$ y $M_E$ nada más: el descenso de B es h, el que marca la
              figura, y entra como un asiento conocido
            mensaje: |
              h es lo que hay que estirar el resorte para unirlo a la viga,
              no lo que baja B. Cuánto baja B depende de lo que el resorte
              tire y de lo que la viga ceda: es una incógnita.
      - tipo: calcular
        titulo: El momento en B
        pregunta: |
          ¿Cuánto vale $M_B$, en $q_0L^{2}$?
        respuesta:
          tipo: numero
          valor: '-0.5'
          tolerancia: 0.001
          formato: un número con su signo, en q₀L²
        distractores:
          - valor: '0.5'
            mensaje: |
              El valor es ese y el signo no. Un voladizo con la carga hacia
              abajo tracciona la fibra de arriba, y M > 0 es el que
              tracciona la de abajo.
          - valor: '-1'
            mensaje: |
              Has tomado el brazo L. P está en A, a L/2 de B.
        pista: |
          El voladizo AB es isostático: se sustituye por su efecto, un
          momento conocido en B (figura 11.6, p. 7).
        desarrollo: |
          $M_B = -P\cdot L/2 = -q_0L\cdot L/2 = -0{,}5\,q_0L^{2}$: P baja en
          el extremo libre y tracciona la fibra de arriba.
      - tipo: calcular
        titulo: El momento en C
        pregunta: |
          ¿Cuánto vale $M_C$, en $q_0L^{2}$?
        respuesta:
          tipo: numero
          valor: '-1.791'
          tolerancia: 0.002
          formato: un número con su signo, en q₀L²
        distractores:
          - valor: '-1.355'
            mensaje: |
              Has tomado el resorte sin estirar, $R_B = k\,\delta_B$. Sin h
              el resorte empuja hacia arriba, y aquí tira hacia abajo.
          - valor: '-1.389'
            mensaje: |
              Es el voladizo ABC sin resorte:
              $M_C = -P\cdot7L/6 - q_0(2L/3)^{2}/2$. El resorte está unido a
              B y tira de ella.
          - valor: '0.2484'
            mensaje: |
              Es la viga con B fijo, $\delta_B = 0$, como si el apoyo fuera
              rígido y sin h. El resorte cede y, además, tira.
          - valor: '-1.878'
            mensaje: |
              Has puesto el término de los asientos con el signo cambiado.
              En la fórmula del cuadro va
              $+6E\left[(\delta_i - \delta_{i-1})/L_i + \ldots\right]$, y en C
              $\delta_C - \delta_B = -\delta_B$.
          - valor: '-0.920'
            mensaje: |
              Has tomado la fuerza del resorte como $k(\delta_B + h)$, hacia
              arriba. Unido a B está estirado: tira hacia abajo.
        pista: |
          Tres incógnitas: $M_C$, $M_E$ y $\delta_B$. La ec. 11.3 (p. 7) en C
          (vanos BC y CE) y en E (con el vano ficticio de $I = \infty$ de la
          figura 11.7), con $\delta_C = \delta_E = 0$; y en B, la reacción
          que pide la viga, $P + q_0L_1/2 + (M_C - M_B)/L_1$, igual a la del
          resorte, $k(\delta_B - h)$.
        desarrollo: |
          Isostáticos (p. 6): en BC, $L_1 = 2L/3$ y
          $A_1 = q_0L_1^{3}/12 = 0{,}02469\,q_0L^{3}$ con $a_1 = L_1/2$; en
          CE, $L_2 = L$ y el triángulo de 2P hacia arriba, de pico
          $-2P\cdot(L/3)(2L/3)/L = -0{,}4444\,q_0L^{2}$ en D:
          $A_2 = -0{,}2222\,q_0L^{3}$, con su centro a $a_2 = 4L/9$ de C y
          $b_2 = 5L/9$ de E. Con $EI = 100\,q_0L^{3}$, todo en $q_0$ y $L$:

          $$
          -\tfrac{1}{3} + \tfrac{10}{3}M_C + M_E = \tfrac{2}{3} - 900\,\delta_B,\qquad
          M_C + 2M_E = \tfrac{16}{27},\qquad
          10\,\delta_B - \tfrac{2}{3} = \tfrac{4}{3} + \tfrac{3}{4} + 1{,}5\,M_C
          $$

          La tercera da $\delta_B = 0{,}275 + 0{,}15\,M_C$, y las tres juntas,
          $M_C = -1{,}791\,q_0L^{2}$.
      - tipo: calcular
        titulo: El momento en el empotramiento
        pregunta: |
          ¿Cuánto vale $M_E$, en $q_0L^{2}$?
        respuesta:
          tipo: numero
          valor: '1.192'
          tolerancia: 0.002
          formato: un número con su signo, en q₀L²
        distractores:
          - valor: '0.9739'
            mensaje: |
              Es lo que sale con el resorte sin estirar, $R_B = k\,\delta_B$:
              falta h.
          - valor: '0.1721'
            mensaje: |
              Es la viga con B fijo, $\delta_B = 0$. El resorte cede y tira.
          - valor: '0.6022'
            mensaje: |
              Has puesto 2P hacia abajo. En la figura sube.
          - valor: '0.7563'
            mensaje: |
              Has tomado la fuerza del resorte como $k(\delta_B + h)$, hacia
              arriba. Unido a B tira hacia abajo.
          - valor: '1.235'
            mensaje: |
              Has puesto el término de los asientos con el signo cambiado:
              en C, $\delta_C - \delta_B = -\delta_B$.
        pista: |
          La ec. 11.3 en E, con el vano ficticio de la figura 11.7:
          $M_C + 2M_E = 16/27$, en $q_0L^{2}$.
        desarrollo: |
          $M_E = \tfrac{1}{2}(16/27 + 1{,}791) = 1{,}192\,q_0L^{2}$, positivo: en
          el empotramiento se tracciona la fibra de abajo.
      - tipo: calcular
        titulo: El descenso de B
        pregunta: |
          ¿Cuánto baja B, en milésimas de L?
        respuesta:
          tipo: numero
          valor: '6.419'
          tolerancia: 0.005
          formato: un número con su signo, en milésimas de L (positivo hacia abajo)
        distractores:
          - valor: '5.048'
            mensaje: |
              Es lo que sale con el resorte sin estirar: falta h en su
              fuerza.
          - valor: '3.678'
            mensaje: |
              Has tomado la fuerza del resorte como $k(\delta_B + h)$, hacia
              arriba. Unido a B tira hacia abajo.
          - valor: '-6.694'
            mensaje: |
              Has puesto el término de los asientos con el signo cambiado, y
              B sube. En la fórmula del cuadro va
              $+6E[(\delta_i - \delta_{i-1})/L_i + \ldots]$.
          - valor: '5.451'
            mensaje: |
              Has puesto 2P hacia abajo. En la figura sube.
        pista: |
          La ecuación del resorte:
          $10\,\delta_B - 2/3 = 4/3 + 3/4 + 1{,}5\,M_C$, en $q_0$ y $L$.
        desarrollo: |
          $\delta_B = (2{,}08333 - 1{,}5\cdot1{,}79054 + 0{,}66667)/10 = 0{,}006419$,
          es decir, $\delta_B = 6{,}419\cdot10^{-3}L$ hacia abajo: mucho
          menos que $h = 0{,}0667L$, así que el resorte sigue estirado y
          tira de B.
      - tipo: calcular
        titulo: El flector en D
        pregunta: |
          Para el diagrama de flectores: ¿cuánto vale M en D, en $q_0L^{2}$?
        respuesta:
          tipo: numero
          valor: '-1.241'
          tolerancia: 0.002
          formato: un número con su signo, en q₀L²
        distractores:
          - valor: '-0.7965'
            mensaje: |
              Te has quedado con la recta entre $M_C$ y $M_E$. En CE hay que
              sumarle el isostático del vano, el de 2P, que en D vale
              $-4/9\,q_0L^{2}$.
          - valor: '-0.3521'
            mensaje: |
              Has sumado el isostático de D con el signo cambiado. 2P sube:
              en la viga biapoyada CE tracciona la fibra de arriba, y su
              flector en D es $-4/9\,q_0L^{2}$.
          - valor: '-1.0233'
            mensaje: |
              Es lo que sale con los momentos del resorte sin estirar: falta
              h.
          - valor: '-0.5528'
            mensaje: |
              Has puesto 2P hacia abajo. En la figura sube.
        pista: |
          En CE, M es la recta entre $M_C$ y $M_E$ más el isostático del
          vano (p. 6), que en D vale $-2P\cdot(L/3)(2L/3)/L$.
        desarrollo: |
          $M_D = \tfrac{2}{3}M_C + \tfrac{1}{3}M_E - \tfrac{4}{9} = \tfrac{2}{3}\cdot(-1{,}79054) + \tfrac{1}{3}\cdot1{,}19157 - 0{,}44444 = -1{,}241$,
          en $q_0L^{2}$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El voladizo AB se sustituye por su momento:
              $M_B = -0{,}5\,q_0L^{2}$.
          - texto: >-
              Unido a B, el resorte está estirado h: su fuerza hacia arriba
              es $k(\delta_B - h)$, y $\delta_B$ es una incógnita más.
          - texto: >-
              Tres ecuaciones: la 11.3 en C y en E (con el vano ficticio de
              $I = \infty$) y la del resorte.
          - texto: >-
              $M_C = -1{,}791$, $M_E = 1{,}192$ (en $q_0L^{2}$) y
              $\delta_B = 6{,}419\cdot10^{-3}L$ hacia abajo.
          - texto: >-
              Diagramas: V salta en B (el resorte tira 0,6025 q0L hacia
              abajo), en C y en D; M baja hasta −1,791 en C y sube hasta
              1,192 en E.
          - texto: >-
              Como B baja menos que h, el resorte no llega a tocar la viga y
              no hace nada.
            trampa: true
            mensaje: |
              Eso valdría para un resorte suelto. Este se une a la viga en
              B: desde el principio está estirado h y tira de ella con
              $k(h - \delta_B) = 0{,}6025\,q_0L$.
    resolucion: |
      **El resorte.** Su extremo está dibujado h por debajo de la viga y el
      enunciado lo une a ella en B: para unirlo hay que estirarlo h. Con
      $\delta_B$ hacia abajo, se alarga $h - \delta_B$ y hace sobre la viga
      una fuerza hacia arriba $R_B = k(\delta_B - h)$, que mientras
      $\delta_B < h$ es negativa: tira de B hacia abajo. Con
      $EI = 100\,q_0L^{3}$ (la lectura homogénea de «100L²q0»), la viga es
      muy rígida y B bajará mucho menos que h.

      **1) Los momentos.** El voladizo AB es isostático (figura 11.6,
      p. 7): $M_B = -P\cdot L/2 = -0{,}5\,q_0L^{2}$. El empotramiento de E
      se sustituye por un vano ficticio de $I = \infty$ (figura 11.7), y
      $M_C$, $M_E$ y $\delta_B$ son las incógnitas. Los isostáticos (p. 6):
      en BC ($L_1 = 2L/3$, $q_0$), $A_1 = q_0L_1^{3}/12 = 0{,}02469\,q_0L^{3}$
      con el centro en el medio; en CE ($L_2 = L$, 2P hacia arriba en D), un
      triángulo de pico $-0{,}4444\,q_0L^{2}$, $A_2 = -0{,}2222\,q_0L^{3}$,
      $a_2 = 4L/9$ y $b_2 = 5L/9$. La ec. 11.3 (p. 7) en C y en E, y la
      reacción de B igual a la del resorte, en $q_0$ y $L$:

      $$
      -\tfrac{1}{3} + \tfrac{10}{3}M_C + M_E = \tfrac{2}{3} - 900\,\delta_B,\qquad
      M_C + 2M_E = \tfrac{16}{27},\qquad
      10\,\delta_B - \tfrac{2}{3} = \tfrac{4}{3} + \tfrac{3}{4} + 1{,}5\,M_C
      $$

      (el $-900\,\delta_B$ es $6EI(\delta_C - \delta_B)/L_1$, y la tercera,
      $P + q_0L_1/2 + (M_C - M_B)/L_1 = k(\delta_B - h)$). Resueltas:

      $$
      M_B = -0{,}5\,q_0L^{2},\qquad M_C = -1{,}791\,q_0L^{2},\qquad M_E = 1{,}192\,q_0L^{2}
      $$

      **3) El desplazamiento de B.** $\delta_B = 6{,}419\cdot10^{-3}L$
      hacia abajo, un décimo de h: el resorte sigue estirado y tira de B
      con $k(h - \delta_B) = 0{,}6025\,q_0L$. Las reacciones: en C,
      $3{,}918\,q_0L$ hacia arriba; en E, $3{,}649\,q_0L$ hacia abajo y el
      par $M_E$. La suma de fuerzas verticales es la de las cargas,
      $P + q_0\cdot2L/3 - 2P$, exacta.

      **2) Los diagramas.** Cortantes (en $q_0L$): $-1$ de A a B; en B, el
      resorte, que tira hacia abajo, la baja a $-1{,}602$; en BC baja en
      recta con $q_0$ hasta $-2{,}269$; la reacción de C la sube a
      $1{,}649$, constante hasta D; 2P la sube a $3{,}649$, constante hasta
      E. Flectores (en $q_0L^{2}$): recta de 0 en A a $-0{,}5$ en B;
      parábola de B a C hasta $-1{,}791$, sin máximo dentro (V no se anula
      en BC); recta hasta $-1{,}241$ en D y recta hasta $+1{,}192$ en E, que
      cruza el cero a $0{,}673L$ de C.

