      </figcaption>
      </figure>

      **Notas nuestras.** La figura no dice cómo va la sección de AB: se
      toma h = 75 mm en vertical, en el plano de la carga. Se desprecian el
      axil y la cortante de OA y de AB, como en los apuntes del tema 13. «v»
      es el coeficiente de Poisson. «diametro100» se transcribe como sale.
    pide: >-
      a) El axil del tirante BC en función de P, positivo a tracción. b) La
      P admisible con n = 2 por Von Mises, en kg. c) El descenso de A con
      esa P, en cm.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De dónde sale la fuerza del tirante BC?
        opciones:
          - texto: >-
              De una compatibilidad: lo que baja B, por lo que le deja bajar
              la barra OAB, tiene que ser lo que cambia de longitud el
              tirante
            correcta: true
            mensaje: |
              Eso es. Con el tirante, la estructura tiene una incógnita más
              que ecuaciones de equilibrio. Se corta el tirante, su axil X es
              la incógnita, y Menabrea (ecs. 13.51-13.52, p. 19) dice que el
              movimiento de B tiene que casar con el del extremo del
              tirante.
          - texto: >-
              De ninguna parte: el tirante no trabaja, porque P está en A y
              el tirante cuelga de B
            mensaje: |
              P dobla OA y A baja. AB está soldada en A: baja con ella y
              arrastra B, que no puede bajar sin acortar el tirante.
          - texto: >-
              Del equilibrio de momentos en O: OA y el tirante se reparten P
              según sus brazos
            mensaje: |
              El empotramiento de O da tres fuerzas y tres momentos de
              reacción: con el tirante hay una incógnita de más, y el
              equilibrio no basta. Hace falta cuánto cede cada parte.
      - tipo: calcular
        titulo: El axil del tirante
        pregunta: |
          El axil de BC es un número por P. ¿Qué número, con su signo
          (positivo a tracción)?
        respuesta:
          tipo: numero
          valor: '-0.5402'
          tolerancia: 0.0005
          formato: un número con su signo, sin unidades (el axil es ese número por P)
        distractores:
          - valor: '0.5402'
            mensaje: |
              El valor es ese y el signo no. Sin el tirante, B bajaría; el
              tirante va de B hacia abajo, así que se acorta: trabaja a
              compresión.
          - valor: '-0.5562'
            mensaje: |
              Has tomado el tirante como rígido, sin su acortamiento
              $XL_{BC}/(EA)$.
          - valor: '-0.8117'
            mensaje: |
              Te has dejado la torsión de OA. La fuerza del tirante en B, a
              una distancia a del eje de OA, la retuerce con $X\cdot a$, y
              el giro de A sube o baja B.
          - valor: '-0.4048'
            mensaje: |
              Has usado I en lugar de $I_p$ en la torsión de OA. La rigidez a
              torsión de una sección circular es $GI_p$ (ec. 12.8, p. 6),
              con $I_p = 2I$.
          - valor: '-0.4820'
            mensaje: |
              Has tomado h = 75 mm en horizontal, $I = 7{,}5\cdot5^{3}/12$.
              La carga es vertical, y el canto h va en su plano:
              $I_{AB} = 5\cdot7{,}5^{3}/12$, en cm⁴.
        pista: |
          Corta el tirante y pon su axil X (tracción) en B. El descenso de B
          tiene estos sumandos: P en A, que baja A por la flexión de OA; y X,
          que dobla AB como voladizo desde A, dobla OA con la fuerza que le
          llega a A y retuerce OA con $X\cdot a$. El tirante se acorta lo
          que B baja: $\delta_B = -XL_{BC}/(EA)$ (ec. 8.9, p. 7).
        desarrollo: |
          En kg y cm: $I_{OA} = \pi D^{4}/64 = 490{,}87\ \text{cm}^{4}$,
          $I_p = 2I_{OA} = 981{,}75\ \text{cm}^{4}$,
          $I_{AB} = bh^{3}/12 = 175{,}78\ \text{cm}^{4}$,
          $A_{BC} = 0{,}4418\ \text{cm}^{2}$ y $E/G = 2(1 + \nu) = 2{,}58$.
          Las flexibilidades multiplicadas por E, en $\text{cm}^{-1}$:

          $$
          \frac{a^{3}}{3I_{AB}} = 1896{,}3,\qquad \frac{L^{3}}{3I_{OA}} = 10\,610{,}3,\qquad \frac{E}{G}\frac{a^{2}L}{I_p} = 6569{,}9,\qquad \frac{L_{BC}}{A_{BC}} = 565{,}9
          $$

          con $L = L_{OA} = 250$ cm y $a = 100$ cm. La compatibilidad, con
          P = 1:

          $$
          X = -\frac{10\,610{,}3}{1896{,}3 + 10\,610{,}3 + 6569{,}9 + 565{,}9} = -0{,}5402
          $$
      - tipo: calcular
        titulo: La P admisible
        pregunta: |
          ¿Cuánto vale la P admisible con n = 2, por Von Mises, en kg?
        respuesta:
          tipo: numero
          valor: '1661'
          tolerancia: 2
          formato: un número, en kg
        distractores:
          - valor: '1793'
            mensaje: |
              Te has quedado con la σ de flexión de O y te has dejado la τ de
              torsión. (Si te ha salido 1822, es la sección de AB junto a A,
              que trabaja menos que la de O.)
          - valor: '1623'
            mensaje: |
              Es Tresca, $\sqrt{\sigma^{2} + 4\tau^{2}}$. Von Mises con σ y τ
              lleva $3\tau^{2}$ (ec. 6.28, p. 11).
          - valor: '3322'
            mensaje: |
              Te has dejado el coeficiente de seguridad: la tensión admisible
              es $4200/2 = 2100$ kg/cm² (ec. 6.2, p. 4).
          - valor: '824.7'
            mensaje: |
              Es la P de OA sin tirante, con toda la carga en el voladizo. El
              tirante descarga a OA: le llega $P + X = 0{,}46P$.
          - valor: '1717.5'
            mensaje: |
              Es la P con la que el tirante llega a 2100 kg/cm². La sección
              de O llega antes.
        pista: |
          La sección más cargada es la del empotramiento O: flexión con la
          fuerza que llega a A, $P + X$, por el brazo $L_{OA}$, y torsión con
          $|X|\cdot a$. En su borde, $\sigma = 32M/(\pi D^{3})$ y
          $\tau = 16M_t/(\pi D^{3})$ (ec. 12.11, p. 7), y Von Mises con σ y τ
          es $\sqrt{\sigma^{2} + 3\tau^{2}}$ (ec. 6.28, p. 11), que no puede
          pasar de 4200/2.
        desarrollo: |
          En O, con P en kg, en kg·cm: $M = 0{,}45983P\cdot250 = 114{,}96P$ y
          $M_t = 0{,}5402P\cdot100 = 54{,}02P$. Con $D = 10$ cm,
          $\sigma = 1{,}17094P$ y $\tau = 0{,}27511P$, en kg/cm²:

          $$
          \sigma_{VM} = \sqrt{1{,}17094^{2} + 3\cdot0{,}27511^{2}}\;P = 1{,}2642\,P \le 2100\ \text{kg/cm}^{2}
          \quad\Longrightarrow\quad P = 1661\ \text{kg}
          $$
      - tipo: calcular
        titulo: El descenso de A
        pregunta: |
          Con esa P, ¿cuánto baja A, en cm?
        respuesta:
          tipo: numero
          valor: '4.052'
          tolerancia: 0.005
          formato: un número, en cm
        distractores:
          - valor: '8.813'
            mensaje: |
              Es el descenso de A sin tirante. A OA le llega $P + X$, no P.
          - valor: '13.57'
            mensaje: |
              Has sumado el axil del tirante en lugar de restarlo: a A le
              llega $P + X$ con $X = -0{,}54P$.
          - valor: '0.2539'
            mensaje: |
              Es el descenso de B, que es lo que se acorta el tirante:
              $|X|L_{BC}/(EA)$. A baja mucho más; el giro de A por la
              torsión de OA sube B.
        pista: |
          A es el extremo de OA. Baja por la flexión de OA bajo la fuerza
          que le llega, $P + X$; el momento $X\cdot a$ la hace girar, no
          bajar: $\delta_A = (P + X)L^{3}/(3EI_{OA})$.
        desarrollo: |
          $\delta_A = 0{,}45983P\cdot10\,610{,}3/(2\cdot10^{6}) = 0{,}0024395P$
          en cm, y con P = 1661 kg, $\delta_A = 4{,}05$ cm.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Una incógnita hiperestática: se corta el tirante y su axil X
              entra como carga en B.
          - texto: >-
              Compatibilidad en B (flexión de AB y de OA, torsión de OA y
              acortamiento del tirante): $X = -0{,}5402P$, compresión.
          - texto: >-
              La sección crítica es O: $M = 114{,}96P$ y $M_t = 54{,}02P$, en
              kg·cm.
          - texto: >-
              Von Mises en el borde de O: $1{,}2642P \le 2100$ kg/cm², de
              donde P = 1661 kg.
          - texto: >-
              A baja por la flexión de OA con $P + X$:
              $\delta_A = 0{,}0024395P = 4{,}05$ cm.
          - texto: >-
              OA no trabaja a torsión: P cae sobre su eje.
            trampa: true
            mensaje: |
              P no la retuerce, pero la fuerza del tirante en B, a una
              distancia a del eje de OA, sí: $M_t = |X|\cdot a = 54{,}02P$,
              y esa torsión es la tercera parte de la flexibilidad de B.
    resolucion: |
      **La estructura.** O está empotrado; OA ($L = 250$ cm, circular de
      $D = 10$ cm) sale de la pared hacia delante; AB ($a = 100$ cm,
      rectangular de 5 × 7,5 cm, con h vertical) va hacia la derecha; el
      tirante BC (250 cm, de 0,75 cm de diámetro) baja de B al suelo. P
      baja en A. Con el tirante hay una incógnita hiperestática: su axil X,
      positivo a tracción.

      **a) El axil del tirante.** Se corta el tirante en B (ecs.
      13.51-13.52, p. 19). El descenso de B tiene cuatro partes: P baja A
      por la flexión de OA, y AB, soldada, baja con A; X dobla AB como
      voladizo desde A, dobla OA con la fuerza que le llega a A y retuerce
      OA con $X\cdot a$, y ese giro de A sube o baja B con brazo a. El
      tirante se acorta lo que baja B (ec. 8.9, p. 7):

      $$
      \frac{PL^{3}}{3EI_{OA}} + X\left(\frac{a^{3}}{3EI_{AB}} + \frac{L^{3}}{3EI_{OA}} + \frac{a^{2}L}{GI_p}\right) = -\frac{XL_{BC}}{EA_{BC}}
      $$

      Con $I_{OA} = 490{,}87$, $I_p = 981{,}75$ e $I_{AB} = 175{,}78$, en
      cm⁴, $A_{BC} = 0{,}4418$ cm² y $E/G = 2{,}58$, los cuatro términos
      multiplicados por E valen 1896,3 (AB), 10 610,3 (flexión de OA),
      6569,9 (torsión de OA) y 565,9 (tirante), en $\text{cm}^{-1}$:

      $$
      X = -\frac{10\,610{,}3}{19\,642{,}4}\,P = -0{,}5402\,P
      $$

      El tirante trabaja a compresión.

      **b) La P admisible.** A OA le llega $P + X = 0{,}4598P$ en A y el
      torsor $|X|\cdot a$. En O, la sección más cargada, $M = 114{,}96P$ y
      $M_t = 54{,}02P$ (kg·cm), y en su borde (ec. 12.11, p. 7, y Navier,
      ec. 9.12, p. 8):

      $$
      \sigma = \frac{32M}{\pi D^{3}} = 1{,}1709P,\qquad \tau = \frac{16M_t}{\pi D^{3}} = 0{,}2751P,\qquad
      \sigma_{VM} = \sqrt{\sigma^{2} + 3\tau^{2}} = 1{,}2642P
      $$

      en kg/cm² (ec. 6.28, p. 11). Con $\sigma_{adm} = 4200/2 = 2100$
      kg/cm² (ec. 6.2, p. 4), $P = 2100/1{,}2642 = 1661$ kg. Las otras
      secciones trabajan menos: AB junto a A, con $M = 54{,}02P$ y
      $W = bh^{2}/6 = 46{,}875$ cm³, $1{,}1524P$; el tirante, $1{,}2227P$.

      **c) El descenso de A.** A es el extremo de OA; el torsor la hace
      girar, no bajar:

      $$
      \delta_A = \frac{(P + X)L^{3}}{3EI_{OA}} = 0{,}0024395\,P\ \text{cm} = 4{,}05\ \text{cm}
      $$

      con P = 1661 kg. Al tirante le llegan 897 kg de compresión.

      **Un apunte que el enunciado no pide.** Un tirante de 7,5 mm y 2,5 m
      a compresión pandea con $\pi^{2}EI/L^{2} = 4{,}9$ kg (ec. 14.8, p. 6),
      muy lejos de esos 897 kg: tal como está dibujado, no aguantaría. El
      examen lo trata como una barra que trabaja igual a tracción que a
      compresión, y así se ha resuelto.

      **Comprobaciones.** El motor del curso resuelve la barra quebrada en
      el espacio por Menabrea, con el tirante anclado en C, y da el mismo X,
      los mismos M y $M_t$ en O, el mismo $\delta_A$ y un descenso de B
      igual al acortamiento del tirante. Sin la torsión de OA, X saldría
      $-0{,}81P$; con el tirante rígido, $-0{,}556P$.

  # ── Problema 4 · el eje ABC, la barra rígida DE y los tirantes DF y EG.
  - id: exerm2122-ext-8-el-eje-abc-con-la-barra-de-y-dos-tirantes
    titulo: El eje ABC, de tubo cuadrado y redondo macizo, con M0 en B y el extremo C soldado a una barra rígida sobre dos tirantes
    fuente: >-
      Problema 4 · Extraordinaria del 2 de febrero de 2022 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1,5 puntos (impreso «(1,5p)»). La fórmula de It es una imagen en
      el Word, y el PDF la deja casi ilegible; se ha leído del Word. El PDF
      pierde la «y» de «en función de t y Mo», que el Word tiene. El examen
      no publica resolución; el desarrollo es nuestro, con los convenios de
      los temas 8 y 12.
    nivel: examen
    enunciado: |
      4. (1,5p) La estructura ABC de la figura está formado por dos tramos
      soldados en B. El tramo AB es tubular de sección cuadrada 11t y
      espesor t. El tramo BC es un redondo macizo de diámetro 8t. El
      extremo C está soldado a una barra DE infinitamente rígida que en sus
      extremos se une a los tirantes DF y EG de sección circular de diámetro
      2t.

      Determinar:

      a) El esfuerzo axial en las barras DF y EG en función de *t* y *M*o.

      b) Giro en el extremo C

      Junto a la figura: $L_{AB}$ =60t; $L_{BC}$ = 40t; $L_{DF}$ = $L_{EG}$
      =75t; $L_{Dc}$ = $L_{CE}$ =20t; E=2.5G, y la fórmula

      $$
      I_t=\frac{4A_t^{2}}{\displaystyle\int_L\frac{ds}{t}}
      $$

