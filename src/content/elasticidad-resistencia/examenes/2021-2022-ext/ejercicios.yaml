      **Notas nuestras.** La galga t forma 15° con x por encima (sentido
      antihorario) y la u, 15° por debajo. «Horario respecto x» se mide desde
      +x hacia −y: la dirección principal de los datos está a −30° y la
      dirección a, a −60°. Las tensiones van en MPa. $\sigma_{L0}$ se toma
      como el límite elástico a tracción, $\sigma_{et}$, y K como el cociente
      $k = \sigma_{et}/\sigma_{ec}$ del criterio de Mohr (ec. 6.12, p. 7).
      «esta» sin tilde y la «υ», una ípsilon griega en lugar de la ν, se
      transcriben como salen.
    pide: >-
      1) Las tensiones principales, en MPa, y las deformaciones principales,
      con sus direcciones. 2) σn y |τn| en el plano
      perpendicular a la dirección a, en MPa. 3) El factor de seguridad de
      cada uno de los cinco criterios.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado habla de un «estado de tensiones plano» y además da
          $\varepsilon_z$. Antes de calcular nada: ¿qué se hace con esa
          $\varepsilon_z$?
        opciones:
          - texto: >-
              Se usa tal cual: z es principal, pero la $\varepsilon_z$
              medida no es la de un estado con $\sigma_z = 0$, así que
              $\sigma_z$ no es nula y sale de Lamé con el tensor de
              deformaciones completo
            correcta: true
            mensaje: |
              Eso es. Las galgas y la dirección principal dan
              $\varepsilon_x + \varepsilon_y = 964\cdot10^{-6}$. Con
              $\sigma_z = 0$, Hooke obligaría a
              $\varepsilon_z = -\nu(\varepsilon_x + \varepsilon_y)/(1 - \nu) = -519\cdot10^{-6}$
              (de las ecs. 4.24 y 4.25, p. 9), y el dato es
              $-964\cdot10^{-6}$. Con las
              tres deformaciones y la distorsión, Lamé (ecs. 4.12-4.13,
              pp. 6-7) da el tensor de tensiones entero, $\sigma_z$
              incluida. «Plano» solo puede querer decir que z es principal.
          - texto: >-
              Se deja como comprobación: en tensión plana $\sigma_z = 0$ y
              bastan las dos galgas
            mensaje: |
              Con $\sigma_z = 0$ la $\varepsilon_z$ no es libre: tendría que
              ser $-\nu(\varepsilon_x + \varepsilon_y)/(1 - \nu)$, unos
              $-519\cdot10^{-6}$, y el enunciado mide $-964\cdot10^{-6}$. Las
              dos cosas no pueden ser a la vez; tirar el dato medido es
              resolver otro problema.
          - texto: >-
              Se toma $\varepsilon_z = 0$: si z es dirección principal y el
              estado es plano, no hay deformación según z
            mensaje: |
              Que z sea principal quiere decir que no hay distorsión entre z
              y el plano XY, no que $\varepsilon_z$ sea nula. Y aquí el dato
              la da: $-964\cdot10^{-6}$.
      - tipo: calcular
        titulo: La distorsión
        pregunta: |
          Con las dos galgas, ¿cuánto vale la distorsión $\gamma_{xy}$, en
          millonésimas?
        respuesta:
          tipo: numero
          valor: '-1388'
          tolerancia: 1
          formato: un número con su signo, en millonésimas (10⁻⁶)
        distractores:
          - valor: '-694'
            mensaje: |
              Has tomado $\varepsilon_t - \varepsilon_u$ como la distorsión.
              Al restar las dos galgas queda
              $2\gamma_{xy}\sin15^{\circ}\cos15^{\circ} = \gamma_{xy}\sin30^{\circ}$,
              la mitad de $\gamma_{xy}$.
          - valor: '-2776'
            mensaje: |
              Has puesto $\tfrac{1}{2}\gamma_{xy}$ en la ec. 3.55. La
              ecuación de la galga lleva la distorsión entera,
              $\gamma_{xy}u_xu_y$: con el ½ sale el doble.
          - valor: '1388'
            mensaje: |
              El valor es ese y el signo no. La galga t, la de +15°, lee
              menos que la u: $\varepsilon_t - \varepsilon_u < 0$, y
              $\gamma_{xy}$ tiene ese signo.
        pista: |
          Escribe la ec. 3.55 (p. 17),
          $\varepsilon_u = \varepsilon_xu_x^{2} + \varepsilon_yu_y^{2} + \gamma_{xy}u_xu_y$,
          para la galga de +15° y para la de −15°, y réstalas: $\varepsilon_x$
          y $\varepsilon_y$ se van.
        desarrollo: |
          $$
          \varepsilon_t - \varepsilon_u = 2\gamma_{xy}\sin15^{\circ}\cos15^{\circ} = \gamma_{xy}\sin30^{\circ}
          \quad\Longrightarrow\quad
          \gamma_{xy} = 2\cdot(482 - 1176)\cdot10^{-6} = -1388\cdot10^{-6}
          $$
      - tipo: calcular
        titulo: La deformación principal mayor
        pregunta: |
          ¿Cuánto vale la deformación principal mayor, $\varepsilon_1$, en
          millonésimas?
        respuesta:
          tipo: numero
          valor: '1283.4'
          tolerancia: 0.5
          formato: un número, en millonésimas (10⁻⁶)
        distractores:
          - valor: '1977.4'
            mensaje: |
              Has puesto la dirección principal a +30°. «Horario» es hacia
              −y: $2\theta_p = -60^{\circ}$, y con eso
              $\varepsilon_x - \varepsilon_y$ sale positiva.
          - valor: '1737.7'
            mensaje: |
              Es lo que sale arrastrando la $\gamma_{xy}$ calculada con ½ en
              la ec. 3.55. El círculo está bien; el dato de partida, no.
          - valor: '882.7'
            mensaje: |
              Es $\varepsilon_x$. La dirección x no es principal (hay
              distorsión); la principal está a 30° horario de x, y su
              deformación es el centro del círculo más el radio.
        pista: |
          La dirección principal da una segunda ecuación,
          $\tan2\theta_p = \gamma_{xy}/(\varepsilon_x - \varepsilon_y)$ con
          $2\theta_p = -60^{\circ}$ (la ec. 2.62 con ε por σ y ½γ por τ,
          apartado 3.6, p. 17), y la suma de las galgas, la tercera. Luego,
          el círculo de Mohr de deformaciones: centro y radio.
        desarrollo: |
          $\varepsilon_x - \varepsilon_y = \gamma_{xy}/\tan(-60^{\circ}) = 1388\cdot10^{-6}/\sqrt{3} = 801{,}4\cdot10^{-6}$.
          Sumando las galgas,
          $\varepsilon_t + \varepsilon_u = (\varepsilon_x + \varepsilon_y) + (\varepsilon_x - \varepsilon_y)\cos30^{\circ}$,
          de donde
          $\varepsilon_x + \varepsilon_y = (1658 - 801{,}4\cdot0{,}8660)\cdot10^{-6} = 964{,}0\cdot10^{-6}$.
          Centro $482{,}0\cdot10^{-6}$ y radio
          $\sqrt{400{,}7^{2} + 694^{2}}\cdot10^{-6} = 801{,}4\cdot10^{-6}$:

          $$
          \varepsilon_1 = (482{,}0 + 801{,}4)\cdot10^{-6} = 1283{,}4\cdot10^{-6}
          $$
      - tipo: calcular
        titulo: La tensión principal mayor
        pregunta: |
          ¿Cuánto vale la tensión principal mayor, $\sigma_1$, en MPa?
        respuesta:
          tipo: numero
          valor: '39.93'
          tolerancia: 0.02
          formato: un número, en MPa
        distractores:
          - valor: '56.08'
            mensaje: |
              Es la de tensión plana,
              $\sigma_1 = E(\varepsilon_1 + \nu\varepsilon_2)/(1 - \nu^{2})$.
              Pero con $\sigma_z = 0$ la $\varepsilon_z$ tendría que ser
              $-519\cdot10^{-6}$, y el dato es $-964\cdot10^{-6}$: z es
              principal con $\sigma_z \neq 0$.
          - valor: '111.9'
            mensaje: |
              Es lo que sale con la dirección principal a +30°. «Horario» es
              hacia −y.
          - valor: '53.90'
            mensaje: |
              Es $E\varepsilon_1$: te has dejado el efecto Poisson. En una
              dirección principal, $\sigma_1 = 2G\varepsilon_1 + \lambda e$
              (ec. 4.12), no $E\varepsilon_1$.
          - valor: '28.87'
            mensaje: |
              Es lo que sale arrastrando la $\gamma_{xy}$ calculada con ½ en
              la ec. 3.55.
        pista: |
          Lamé en ejes principales (ec. 4.12, p. 6):
          $\sigma_i = 2G\varepsilon_i + \lambda e$, con
          $e = \varepsilon_1 + \varepsilon_2 + \varepsilon_z$ (ec. 3.59,
          p. 18) y $G = E/(2(1 + \nu))$ (ec. 4.6, p. 5). Mira primero
          cuánto vale $e$.
        desarrollo: |
          $\varepsilon_2 = (482{,}0 - 801{,}4)\cdot10^{-6} = -319{,}4\cdot10^{-6}$
          y $e = (1283{,}4 - 319{,}4 - 964)\cdot10^{-6} = 0$: el término de
          $\lambda$ se va. Con
          $G = 42\,000\ \text{MPa}/2{,}7 = 15\,556\ \text{MPa}$:

          $$
          \sigma_1 = 2\cdot15\,556\ \text{MPa}\cdot1283{,}4\cdot10^{-6} = 39{,}93\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La tensión según z
        pregunta: |
          ¿Y la tensión principal según z, en MPa?
        respuesta:
          tipo: numero
          valor: '-29.99'
          tolerancia: 0.02
          formato: un número con su signo, en MPa
        distractores:
          - valor: '0'
            mensaje: |
              Es la lectura de tensión plana, que el dato descarta: con
              $\sigma_z = 0$ la $\varepsilon_z$ sería $-519\cdot10^{-6}$, no
              $-964\cdot10^{-6}$.
          - valor: '-40.49'
            mensaje: |
              Es $E\varepsilon_z$, sin el efecto Poisson. La misma ecuación
              de Lamé: $\sigma_z = 2G\varepsilon_z + \lambda e$.
        pista: |
          La misma ecuación, en la dirección z:
          $\sigma_z = 2G\varepsilon_z + \lambda e$.
        desarrollo: |
          $$
          \sigma_z = 2\cdot15\,556\ \text{MPa}\cdot(-964\cdot10^{-6}) = -29{,}99\ \text{MPa}
          $$

          Es la menor de las tres, $\sigma_3 = \sigma_z$. La que falta, la del
          plano a 60° de x, es
          $\sigma_2 = 2\cdot15\,556\ \text{MPa}\cdot(-319{,}4\cdot10^{-6}) = -9{,}94\ \text{MPa}$.
      - tipo: calcular
        titulo: La componente normal en el plano perpendicular a a
        pregunta: |
          En el plano perpendicular a la dirección a, ¿cuánto vale
          $\sigma_n$, en MPa?
        respuesta:
          tipo: numero
          valor: '27.46'
          tolerancia: 0.02
          formato: un número con su signo, en MPa
        distractores:
          - valor: '-9.94'
            mensaje: |
              Has puesto a a 60° antihorario: así a coincide con la
              dirección 2 y $\sigma_n = \sigma_2$. «Horario» es hacia −y: a
              está a −60°, a 30° de la dirección 1.
          - valor: '2.53'
            mensaje: |
              Has tomado 60° como el ángulo entre a y la dirección 1. Los 60°
              se miden desde x; la dirección 1 está a −30°, y a forma 30° con
              ella.
          - valor: '43.61'
            mensaje: |
              Es lo que sale con las tensiones de la lectura de tensión
              plana. Con la $\varepsilon_z$ medida, $\sigma_1 = 39{,}93$ y
              $\sigma_2 = -9{,}94$ MPa.
        pista: |
          La normal del plano es a: está en el plano XY, a 30° de la
          dirección 1 y a 90° de z. En ejes principales,
          $\sigma_n = \sum\sigma_in_i^{2}$ (ec. 2.16, p. 12).
        desarrollo: |
          En ejes (1, 2, z), $\hat{n} = (\cos30^{\circ},\ \sin30^{\circ},\ 0)$:

          $$
          \sigma_n = 39{,}93\ \text{MPa}\cdot0{,}75 + (-9{,}94\ \text{MPa})\cdot0{,}25 = 27{,}46\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La componente tangencial en el mismo plano
        pregunta: |
          ¿Y el módulo de $\tau_n$, en MPa?
        respuesta:
          tipo: numero
          valor: '21.59'
          tolerancia: 0.02
          formato: un número, en MPa
        distractores:
          - valor: '24.93'
            mensaje: |
              Es la tangencial máxima del círculo de $\sigma_1$ y $\sigma_2$,
              la de un plano a 45° de la 1. A 30° sale algo menos:
              $\tfrac{1}{2}|\sigma_1 - \sigma_2|\sin60^{\circ}$.
          - valor: '34.96'
            mensaje: |
              Es la tangencial máxima absoluta,
              $\tfrac{1}{2}(\sigma_1 - \sigma_3)$. El plano de a contiene a z:
              su punto está en el círculo de $\sigma_1$ y $\sigma_2$.
        pista: |
          La normal está en el plano XY, así que el plano contiene a z: es
          un punto del círculo de Mohr de $\sigma_1$ y $\sigma_2$, y
          $|\tau_n| = |\sigma_1 - \sigma_2|\sin30^{\circ}\cos30^{\circ}$.
        desarrollo: |
          $|\tau_n| = 49{,}86\ \text{MPa}\cdot0{,}4330 = 21{,}59\ \text{MPa}$.
      - tipo: calcular
        titulo: El factor de seguridad de Mohr
        pregunta: |
          ¿Cuánto vale el factor de seguridad según el criterio de Mohr?
        respuesta:
          tipo: numero
          valor: '0.6725'
          tolerancia: 0.001
          formato: un número sin unidades
        distractores:
          - valor: '0.6143'
            mensaje: |
              Has tomado $k = \sigma_{ec}/\sigma_{et}$, al revés. En los
              apuntes $k = \sigma_{et}/\sigma_{ec}$ (ec. 6.12), menor que 1
              si el material aguanta más a compresión: aquí, 0,9.
          - valor: '0.7472'
            mensaje: |
              Has dividido el límite de compresión, 50 MPa, por
              $\sigma_{eqv}$. La ec. 6.16 compara $\sigma_{eqv}$ con
              $\sigma_{et}$.
          - valor: '0.9208'
            mensaje: |
              Has tomado $\sigma_2$ como la menor. Son tres principales, y la
              menor es $\sigma_z = -29{,}99$ MPa.
          - valor: '0.6436'
            mensaje: |
              Es Tresca: Mohr con k = 1. Aquí k = 0,9.
        pista: |
          $\sigma_{eqv} = \sigma_1 - k\sigma_3$ (ec. 6.15, p. 8), con las
          principales ordenadas de mayor a menor, y
          $SF = \sigma_{et}/\sigma_{eqv}$ (ecs. 6.1 y 6.16, pp. 4 y 8).
        desarrollo: |
          $$
          \sigma_{eqv} = 39{,}93\ \text{MPa} + 0{,}9\cdot29{,}99\ \text{MPa} = 66{,}92\ \text{MPa},\qquad SF = 45/66{,}92 = 0{,}672
          $$
      - tipo: calcular
        titulo: El factor de seguridad de Rankine
        pregunta: |
          ¿Y según Rankine?
        respuesta:
          tipo: numero
          valor: '1.127'
          tolerancia: 0.002
          formato: un número sin unidades
        distractores:
          - valor: '0.8025'
            mensaje: |
              Es lo que da la lectura de tensión plana, con
              $\sigma_1 = 56{,}08$ MPa.
          - valor: '1.667'
            mensaje: |
              Has mirado la compresión: $50/29{,}99$. Rankine toma la
              principal de mayor valor absoluto (ecs. 6.4-6.5), que aquí es
              $\sigma_1$, de tracción.
        pista: |
          La principal de mayor valor absoluto, con el límite que toca a su
          signo (ecs. 6.3-6.5, p. 4).
        desarrollo: |
          $|\sigma_1| = 39{,}93 > |\sigma_3| = 29{,}99$, en MPa, y es de
          tracción: $SF = 45/39{,}93 = 1{,}127$.
      - tipo: calcular
        titulo: El factor de seguridad de la deformación máxima
        pregunta: |
          ¿Y según el criterio de la deformación máxima?
        respuesta:
          tipo: numero
          valor: '0.8349'
          tolerancia: 0.001
          formato: un número sin unidades
        distractores:
          - valor: '1.127'
            mensaje: |
              Has comparado $\sigma_1$ con el límite, como en Rankine. Este
              criterio compara $E\varepsilon_1 = \sigma_1 - \nu(\sigma_2 + \sigma_3)$,
              y con las otras dos de compresión sale mayor que $\sigma_1$.
          - valor: '1.0368'
            mensaje: |
              Has dejado fuera $\sigma_3$ en Hooke:
              $E\varepsilon_1 = \sigma_1 - \nu(\sigma_2 + \sigma_3)$, y
              $\sigma_3 = \sigma_z$ no es nula.
        pista: |
          $\sigma_{eqv} = E|\varepsilon|_{max}$ (ecs. 6.6-6.9, p. 5), con el
          límite del signo de esa deformación. Las deformaciones principales
          ya las tienes.
        desarrollo: |
          $E\varepsilon_1 = 42\,000\ \text{MPa}\cdot1283{,}4\cdot10^{-6} = 53{,}90\ \text{MPa}$
          y $E\varepsilon_3 = 42\,000\ \text{MPa}\cdot(-964\cdot10^{-6}) = -40{,}49\ \text{MPa}$.
          Manda la 1, de tracción: $SF = 45/53{,}90 = 0{,}835$.
      - tipo: calcular
        titulo: El factor de seguridad de Tresca
        pregunta: |
          ¿Y según Tresca?
        respuesta:
          tipo: numero
          valor: '0.6436'
          tolerancia: 0.001
          formato: un número sin unidades
        distractores:
          - valor: '0.9025'
            mensaje: |
              Has usado $\sigma_1 - \sigma_2$, las dos del plano XY. Tresca
              va con la mayor y la menor de las tres, y la menor es
              $\sigma_z$.
          - valor: '0.8025'
            mensaje: |
              Es lo que da la lectura de tensión plana:
              $\sigma_1 - \sigma_3 = 56{,}08 - 0$.
          - valor: '1.2872'
            mensaje: |
              Has comparado $\tau_{max}$ con el límite. La tensión
              equivalente es el doble: $\sigma_{eqv} = \sigma_1 - \sigma_3$
              (ecs. 6.17-6.19).
        pista: |
          $\sigma_{eqv} = \sigma_1 - \sigma_3$ (ec. 6.19, p. 9), con la mayor
          y la menor de las tres.
        desarrollo: |
          $\sigma_{eqv} = 39{,}93\ \text{MPa} + 29{,}99\ \text{MPa} = 69{,}92\ \text{MPa}$
          y $SF = 45/69{,}92 = 0{,}644$.
      - tipo: calcular
        titulo: El factor de seguridad de Von Mises
        pregunta: |
          ¿Y según Von Mises?
        respuesta:
          tipo: numero
          valor: '0.7216'
          tolerancia: 0.001
          formato: un número sin unidades
        distractores:
          - valor: '0.9844'
            mensaje: |
              Has hecho Von Mises con $\sigma_3 = 0$, como en tensión plana
              pero con las tensiones de aquí. La tercera es
              $\sigma_z = -29{,}99$ MPa.
          - valor: '0.8452'
            mensaje: |
              Es lo que da la lectura de tensión plana, con 56,08, 6,21 y 0
              MPa.
        pista: |
          $\sigma_{eqv} = \sqrt{\tfrac{1}{2}\left[(\sigma_1 - \sigma_2)^{2} + (\sigma_2 - \sigma_3)^{2} + (\sigma_3 - \sigma_1)^{2}\right]}$
          (ec. 6.29, p. 11).
        desarrollo: |
          $$
          \sigma_{eqv} = \sqrt{\tfrac{1}{2}\left(49{,}86^{2} + 20{,}06^{2} + 69{,}92^{2}\right)}\ \text{MPa} = 62{,}36\ \text{MPa},\qquad SF = 45/62{,}36 = 0{,}722
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Las galgas restadas dan $\gamma_{xy} = -1388\cdot10^{-6}$; con
              la dirección principal y su suma,
              $\varepsilon_x + \varepsilon_y = 964\cdot10^{-6}$.
          - texto: >-
              El círculo de deformaciones da $\varepsilon_1 = 1283{,}4$ (a
              −30°) y $\varepsilon_2 = -319{,}4$ (a 60°), en $10^{-6}$; la
              tercera es la medida, $\varepsilon_z = -964\cdot10^{-6}$.
          - texto: >-
              $e = 0$, y Lamé se queda en $\sigma_i = 2G\varepsilon_i$:
              $\sigma_1 = 39{,}93$, $\sigma_2 = -9{,}94$ y
              $\sigma_3 = \sigma_z = -29{,}99$ MPa.
          - texto: >-
              El plano perpendicular a a está a 30° de la dirección 1 y
              contiene a z: $\sigma_n = 27{,}46$ y $|\tau_n| = 21{,}59$ MPa.
          - texto: >-
              Con $\sigma_{et} = 45$ MPa y k = 0,9: SF de 0,672 (Mohr), 1,127
              (Rankine), 0,835 (deformación máxima), 0,644 (Tresca) y 0,722
              (Von Mises).
          - texto: >-
              Como el estado es plano, $\sigma_z = 0$, y la $\varepsilon_z$
              del enunciado solo sirve para comprobar.
            trampa: true
            mensaje: |
              Con $\sigma_z = 0$ la $\varepsilon_z$ tendría que ser
              $-519\cdot10^{-6}$, y el dato es $-964\cdot10^{-6}$. Tomar
              tensión plana es tirar un dato medido: z es principal y
              $\sigma_z = -29{,}99$ MPa.
    resolucion: |
      **Lo que dan los datos.** Dos galgas en el plano XY, t a +15° de x y u
      a −15°; una dirección principal a 30° horario de x, es decir, a −30°;
      y la deformación según z, que es principal. Con eso se conoce el
      tensor de deformaciones entero.

      **La lectura de «plano».** Con $\sigma_z = 0$, la $\varepsilon_z$
      sería $-519\cdot10^{-6}$ (de las ecs. 4.24 y 4.25, p. 9), no la del
      dato: z es principal, pero $\sigma_z$ no es nula (el paso de
      reconocer lo cuenta entero).

      **1) Las deformaciones principales.** La ec. 3.55 (p. 17) en las dos
      galgas:

      $$
      \varepsilon_{t,u} = \varepsilon_x\cos^{2}15^{\circ} + \varepsilon_y\sin^{2}15^{\circ} \pm \gamma_{xy}\sin15^{\circ}\cos15^{\circ}
      $$

      La resta da $\gamma_{xy} = 2(\varepsilon_t - \varepsilon_u) = -1388\cdot10^{-6}$.
      La dirección principal a −30° (la ec. 2.62, p. 23, con ε por σ y ½γ
      por τ, apartado 3.6, p. 17) da
      $\varepsilon_x - \varepsilon_y = \gamma_{xy}/\tan(-60^{\circ}) = 801{,}4\cdot10^{-6}$,
      y la suma de las galgas,
      $\varepsilon_t + \varepsilon_u = (\varepsilon_x + \varepsilon_y) + (\varepsilon_x - \varepsilon_y)\cos30^{\circ}$,
      da $\varepsilon_x + \varepsilon_y = 964{,}0\cdot10^{-6}$. Así,
      $\varepsilon_x = 882{,}7\cdot10^{-6}$ y $\varepsilon_y = 81{,}3\cdot10^{-6}$.
      El círculo de Mohr de deformaciones tiene el centro en
      $482{,}0\cdot10^{-6}$ y el radio
      $\sqrt{400{,}7^{2} + 694^{2}}\cdot10^{-6} = 801{,}4\cdot10^{-6}$:

      $$
      \varepsilon_1 = 1283{,}4\cdot10^{-6}\ (\text{a }-30^{\circ}),\qquad
      \varepsilon_2 = -319{,}4\cdot10^{-6}\ (\text{a }60^{\circ}),\qquad
      \varepsilon_3 = \varepsilon_z = -964\cdot10^{-6}\ (\text{según z})
      $$

      **1) Las tensiones principales.** La deformación volumétrica es
      $e = (1283{,}4 - 319{,}4 - 964)\cdot10^{-6} = 0$ (ec. 3.59, p. 18), y
      Lamé (ec. 4.12, p. 6) se queda en $\sigma_i = 2G\varepsilon_i$, con
      $G = E/(2(1 + \nu)) = 15\,556$ MPa (ec. 4.6, p. 5). Las direcciones
      son las mismas (material isótropo):

      $$
      \sigma_1 = 39{,}93\ \text{MPa}\ (\text{a }-30^{\circ}),\qquad
      \sigma_2 = -9{,}94\ \text{MPa}\ (\text{a }60^{\circ}),\qquad
      \sigma_3 = \sigma_z = -29{,}99\ \text{MPa}
      $$

      En ejes XY, $\sigma_x = 27{,}46$, $\sigma_y = 2{,}53$ y
      $\tau_{xy} = -21{,}59$ MPa.

      **2) El plano perpendicular a a.** a está a −60°: a 30° de la
      dirección 1 y a 90° de z. En ejes (1, 2, z),
      $\hat{n} = (\cos30^{\circ},\ \sin30^{\circ},\ 0)$ (el signo de la
      segunda componente, que es lo que cambia «horario», no altera nada):

      $$
      \sigma_n = \sigma_1\cos^{2}30^{\circ} + \sigma_2\sin^{2}30^{\circ} = 27{,}46\ \text{MPa},\qquad
      |\tau_n| = |\sigma_1 - \sigma_2|\sin30^{\circ}\cos30^{\circ} = 21{,}59\ \text{MPa}
      $$

      a y x están a 30° de la dirección 1, una a cada lado: por eso salen
      $\sigma_n = \sigma_x$ y $|\tau_n| = |\tau_{xy}|$.

      **3) Los factores de seguridad.** Con $\sigma_{et} = 45$ MPa y
      $k = 0{,}9$, $\sigma_{ec} = 50$ MPa:

      - Mohr (ecs. 6.12-6.16, pp. 7-8):
        $\sigma_{eqv} = \sigma_1 - k\sigma_3 = 66{,}92$ MPa y
        $SF = 45/66{,}92 = 0{,}672$.
      - Rankine (ecs. 6.3-6.5, p. 4): manda $\sigma_1$, de tracción, y
        $SF = 45/39{,}93 = 1{,}127$ (la compresión daría
        $50/29{,}99 = 1{,}667$).
      - Deformación máxima (ecs. 6.6-6.9, p. 5):
        $E\varepsilon_1 = 53{,}90$ MPa frente a
        $E|\varepsilon_3| = 40{,}49$ MPa, y $SF = 45/53{,}90 = 0{,}835$.
      - Tresca (ec. 6.19, p. 9): $\sigma_1 - \sigma_3 = 69{,}92$ MPa y
        $SF = 45/69{,}92 = 0{,}644$.
      - Von Mises (ec. 6.29, p. 11): $\sigma_{eqv} = 62{,}36$ MPa y
        $SF = 45/62{,}36 = 0{,}722$.

      Solo Rankine da más de 1: con la compresión de z, todos los criterios
      que la cuentan predicen fallo.

      **Comprobaciones.** El motor del curso da lo mismo que las cuentas a
      mano. Con la lectura de tensión plana saldrían $\sigma_1 = 56{,}08$ y
      $\sigma_2 = 6{,}21$ MPa, con una $\varepsilon_z$ que no es la del
      dato.

  # ── Problema 2 · la viga continua con el resorte unido en B.
  - id: exerm2122-ext-6-la-viga-continua-con-un-resorte-en-b
    titulo: Viga continua con un voladizo, un resorte bajo B y un empotramiento, por los tres momentos
    fuente: >-
      Problema 2 · Extraordinaria del 2 de febrero de 2022 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1,5 puntos (impreso «(1.5p)»). La cota de CD sale en el PDF como
      «L/»; el Word original dice «L/3». En el PDF la fórmula del cuadro
      pierde los denominadores; se ha leído del Word. El examen no publica
      resolución; el desarrollo es nuestro, con los convenios del tema 11.
    nivel: examen
    enunciado: |
      2. (1.5p) La viga de la figura tiene un apoyo en C, un apoyo elástico
      de rigidez K en B y un empotramiento en E. *EI* es constante en toda
      la viga. Si el resorte se une a la viga en el punto B, siendo
      $P=q_oL$       $k=10q_o$    $h=L/15$       EI= 100$L^{2}q_0$
      Determinar mediante la ecuación de los 3 momentos:

      1. Momento flector en B, C y E
      2. Diagramas V y M.
      3. El desplazamiento en B.

      En un cuadro, sobre la figura:

      $$
      M_{i-1}\frac{L_i}{I_i}+2M_i\left[\frac{L_i}{I_i}+\frac{L_{i+1}}{I_{i+1}}\right]+M_{i+1}\frac{L_{i+1}}{I_{i+1}}=-6\frac{A_ia_i}{I_iL_i}-6\frac{A_{i+1}b_{i+1}}{I_{i+1}L_{i+1}}+6E\left[\frac{\left[\delta_i-\delta_{i-1}\right]}{L_i}+\frac{\left[\delta_i-\delta_{i+1}\right]}{L_{i+1}}\right]
      $$

