      **Notas nuestras.** El lado 11t del tubo se toma como el exterior: la
      línea media es un cuadrado de lado 10t. $M_0$ va con el sentido de la
      flecha doble de la figura: según el eje del tramo, hacia C. Los
      tirantes están articulados en D, E, F y G. «formado» y «LDc» se
      transcriben como salen.
    pide: >-
      a) El axil de DF y de EG, en M0/t. b) El giro de C, en M0/(G·t³).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hacen la barra DE y los tirantes sobre el extremo C del eje?
        opciones:
          - texto: >-
              Son un resorte a torsión: si C gira, un tirante se alarga y
              el otro se acorta, y sus axiles dan un par que se opone al
              giro
            correcta: true
            mensaje: |
              Eso es. DE es rígida, pero los tirantes no: C gira lo que
              ellos se deforman. Si C gira φ, D y E se mueven $20t\cdot\varphi$,
              cada tirante lleva $N = EA\cdot20t\varphi/L_{DF}$ (ec. 8.9,
              p. 7) y el par que devuelven es $2N\cdot20t$. El eje queda
              hiperestático: A empotrado y C sobre un resorte.
          - texto: >-
              Empotran C: la barra DE es infinitamente rígida
            mensaje: |
              Rígida es DE, que no se dobla; pero se apoya en dos tirantes
              que se alargan y se acortan. C gira lo que ellos dejan.
          - texto: >-
              Nada: un par torsor no carga unos tirantes, que solo trabajan
              a axil
            mensaje: |
              El par que llega a C hace girar DE, y al girar sus extremos
              suben y bajan: los tirantes se estiran y se encogen, y eso es
              axil.
      - tipo: calcular
        titulo: El módulo de torsión del tubo
        pregunta: |
          ¿Cuánto vale $I_t$ del tramo AB, en $t^{4}$?
        respuesta:
          tipo: numero
          valor: '1000'
          tolerancia: 1
          formato: un número, en t⁴
        distractores:
          - valor: '1331'
            mensaje: |
              Has tomado 11t como el lado de la línea media. Es el lado
              exterior: la línea media va por el centro del espesor, a t/2
              de cada cara, y mide 10t.
          - valor: '1464.1'
            mensaje: |
              Has tomado $A_t$ con el lado exterior, $(11t)^{2}$, y el
              perímetro con la línea media. Las dos cosas van por la línea
              media.
          - valor: '909.1'
            mensaje: |
              Has tomado el perímetro exterior, 44t, con el área de la línea
              media. Las dos cosas van por la línea media.
          - valor: '250'
            mensaje: |
              Te falta el 4 de la ec. 12.29: $I_t = 4A_t^{2}/\oint ds/t$.
        pista: |
          Bredt para una celda (ec. 12.29, p. 14), la fórmula del
          enunciado: $A_t$ es el área que encierra la línea media, y la
          integral va a lo largo de ella.
        desarrollo: |
          La línea media es un cuadrado de lado $11t - t = 10t$:
          $A_t = 100t^{2}$ y $\oint ds/t = 4\cdot10t/t = 40$.

          $$
          I_t = \frac{4\cdot(100t^{2})^{2}}{40} = 1000\,t^{4}
          $$
      - tipo: calcular
        titulo: El axil de los tirantes
        pregunta: |
          ¿Cuánto vale el axil de cada tirante, en valor absoluto, en
          milésimas de $M_0/t$?
        respuesta:
          tipo: numero
          valor: '8.751'
          tolerancia: 0.005
          formato: un número, en milésimas de M₀/t
        distractores:
          - valor: '7.202'
            mensaje: |
              Es lo que sale con 11t como lado de la línea media
              ($I_t = 1331t^{4}$). El lado de la línea media es 10t.
          - valor: '9.406'
            mensaje: |
              Has tomado C empotrado, como si los tirantes no se alargaran.
              Si C no girara, los tirantes no trabajarían: el axil sale de
              cuánto gira.
          - valor: '7.923'
            mensaje: |
              Has usado G en los tirantes. Su rigidez es la axial, EA/L, con
              E = 2,5G.
          - valor: '5.538'
            mensaje: |
              Has usado $I = \pi D^{4}/64$ en BC. A torsión va la inercia
              polar, $I_p = \pi D^{4}/32$, el doble.
          - valor: '17.50'
            mensaje: |
              Has dado todo el par a un solo tirante. Son dos, uno a cada
              lado de C, y cada uno pone $N\cdot20t$: $N = x/(40t)$.
        pista: |
          Llama x al par que va de B a C. El giro de B es el mismo visto
          desde A y desde C: $(M_0 - x)f_{AB} = x(f_{BC} + f_C)$, con
          $f = L/(GI)$ en cada tramo (ec. 12.14, p. 8) y $f_C = 1/k_C$ la de
          los tirantes, $k_C = 2\cdot(EA/L_{DF})\cdot(20t)^{2}$. Luego,
          $N = x/(2\cdot20t)$.
        desarrollo: |
          En $1/(Gt^{3})$: $f_{AB} = 60t/(1000Gt^{4}) = 3/50$; con
          $I_p = \pi(8t)^{4}/32 = 128\pi t^{4}$ (p. 7),
          $f_{BC} = 40/(128\pi) = 5/(16\pi)$; con $A = \pi t^{2}$ y
          $E = 2{,}5G$, $k_C = 2\cdot(2{,}5\pi/75)\cdot400 = 80\pi/3$ y
          $f_C = 3/(80\pi)$.

          $$
          x = \frac{f_{AB}}{f_{AB} + f_{BC} + f_C}\,M_0 = \frac{6\pi}{6\pi + 35}\,M_0 = 0{,}3500\,M_0,\qquad
          N = \frac{x}{40t} = 8{,}751\cdot10^{-3}\,\frac{M_0}{t}
          $$
      - tipo: calcular
        titulo: El giro de C
        pregunta: |
          ¿Cuánto gira C, en milésimas de $M_0/(Gt^{3})$?
        respuesta:
          tipo: numero
          valor: '4.178'
          tolerancia: 0.003
          formato: un número, en milésimas de M₀/(G·t³)
        distractores:
          - valor: '3.439'
            mensaje: |
              Es lo que sale con 11t como lado de la línea media. El lado de
              la línea media es 10t.
          - valor: '9.458'
            mensaje: |
              Has usado G en los tirantes: su rigidez es EA/L, con E = 2,5G,
              y con G salen 2,5 veces más blandos.
          - valor: '39.00'
            mensaje: |
              Es el giro de B. De B a C el tramo BC se retuerce en sentido
              contrario: $\varphi_C = \varphi_B - x\,f_{BC}$.
          - valor: '10.45'
            mensaje: |
              Es el mismo giro escrito en $M_0/(Et^{3})$: 2,5 veces más. Se
              pide en $M_0/(Gt^{3})$.
        pista: |
          C gira lo que dejan los tirantes: $\varphi_C = x\,f_C$. O, desde B,
          $\varphi_C = \varphi_B - x\,f_{BC}$.
        desarrollo: |
          $$
          \varphi_C = x\,f_C = \frac{6\pi}{6\pi + 35}\cdot\frac{3}{80\pi}\,\frac{M_0}{Gt^{3}} = \frac{9}{40(6\pi + 35)}\,\frac{M_0}{Gt^{3}} = 4{,}178\cdot10^{-3}\,\frac{M_0}{Gt^{3}}
          $$

          Por el otro lado, $\varphi_B = 0{,}6500\cdot3/50 = 0{,}0390$ y
          $\varphi_C = 0{,}0389975 - 0{,}3500411\cdot5/(16\pi) = 0{,}004178$,
          en $M_0/(Gt^{3})$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              DE, rígida sobre dos tirantes, es un resorte a torsión en C:
              $k_C = 80\pi Gt^{3}/3$.
          - texto: >-
              $I_t$ del tubo, con la línea media de lado 10t:
              $1000t^{4}$; $I_p$ de BC: $128\pi t^{4}$.
          - texto: >-
              El giro de B, igual desde A y desde C:
              $x = 6\pi M_0/(6\pi + 35) = 0{,}3500M_0$ va a C, y
              $0{,}6500M_0$, a A.
          - texto: >-
              Cada tirante: $N = x/(40t) = 8{,}751\cdot10^{-3}M_0/t$; con
              $M_0$ hacia C, EG a tracción y DF a compresión.
          - texto: >-
              $\varphi_C = x\,f_C = 4{,}178\cdot10^{-3}M_0/(Gt^{3})$.
          - texto: >-
              C está empotrado, porque DE es infinitamente rígida: todo el par
              se reparte entre AB y BC según sus rigideces.
            trampa: true
            mensaje: |
              Rígida es DE, no sus apoyos: los tirantes se alargan y C gira.
              Con C empotrado los tirantes no trabajarían, y el enunciado
              pregunta su axil.
    resolucion: |
      **Lo que hacen DE y los tirantes.** DE es rígida y está soldada a C:
      si C gira φ, D y E se mueven $20t\cdot\varphi$, uno hacia arriba y
      otro hacia abajo. Un tirante se alarga y el otro se acorta, con
      $N = EA\cdot20t\varphi/L_{DF}$ cada uno (ec. 8.9, p. 7), y los dos
      devuelven a C un par $2N\cdot20t$. Es un resorte a torsión de
      rigidez, con $A = \pi t^{2}$ y $E = 2{,}5G$:

      $$
      k_C = 2\,\frac{EA}{L_{DF}}\,(20t)^{2} = \frac{80\pi}{3}\,Gt^{3}
      $$

      El eje queda empotrado en A y sobre ese resorte en C: hiperestático.

      **Las rigideces de los tramos.** AB es un tubo cuadrado de pared
      delgada: con la línea media de lado 10t, $A_t = 100t^{2}$ y
      $\oint ds/t = 40$, y Bredt (ec. 12.29, p. 14) da
      $I_t = 4A_t^{2}/40 = 1000t^{4}$. BC es macizo:
      $I_p = \pi(8t)^{4}/32 = 128\pi t^{4}$ (p. 7). Las flexibilidades
      (ec. 12.14, p. 8), en $1/(Gt^{3})$:

      $$
      f_{AB} = \frac{60t}{1000\,Gt^{4}} = \frac{3}{50},\qquad
      f_{BC} = \frac{40t}{128\pi\,Gt^{4}} = \frac{5}{16\pi},\qquad
      f_C = \frac{1}{k_C} = \frac{3}{80\pi}
      $$

      **a) El axil de los tirantes.** De $M_0$, una parte x va hacia C y el
      resto, hacia A. El giro de B es el mismo por los dos lados:
      $(M_0 - x)f_{AB} = x(f_{BC} + f_C)$, de donde

      $$
      x = \frac{6\pi}{6\pi + 35}\,M_0 = 0{,}3500\,M_0,\qquad M_0 - x = 0{,}6500\,M_0
      $$

      Ese par lo dan los dos tirantes, con brazo 20t cada uno:

      $$
      N = \frac{x}{40t} = \frac{3\pi}{20(6\pi + 35)}\,\frac{M_0}{t} = 8{,}751\cdot10^{-3}\,\frac{M_0}{t}
      $$

      Con $M_0$ según el eje hacia C, que está delante, C gira en sentido
      antihorario visto de frente: E sube y D baja. EG trabaja a tracción y
      DF a compresión, con el mismo valor.

      **b) El giro de C.**

      $$
      \varphi_C = x\,f_C = \frac{9}{40(6\pi + 35)}\,\frac{M_0}{Gt^{3}} = 4{,}178\cdot10^{-3}\,\frac{M_0}{Gt^{3}}
      $$

      en el sentido de $M_0$. B gira $0{,}0390\,M_0/(Gt^{3})$: casi todo el
      giro se lo come BC, y C apenas se mueve.

      **Comprobaciones.** El motor del curso calcula $I_t$ por Bredt e $I_p$,
      y resuelve el eje con A empotrado y el resorte de C como un tramo de
      eje ficticio de rigidez $k_C$ empotrado al final (el motor no tiene
      resortes de torsión): da el mismo x, el mismo $\varphi_B$ y el mismo
      $\varphi_C$ que las fracciones. El alargamiento de un tirante,
      $20t\cdot\varphi_C$, por $EA/L_{DF}$, devuelve la misma N. Con C
      empotrado, el par a C sería $0{,}376\,M_0$; con 11t como lado de la
      línea media, $0{,}288\,M_0$.
