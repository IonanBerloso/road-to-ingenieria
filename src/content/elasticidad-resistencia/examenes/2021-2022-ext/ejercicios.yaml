ejercicios:
  # ── Problema 1 · las galgas t y u a ±15°, la εz y cinco criterios de fallo.
  - id: exerm2122-ext-5-las-galgas-a-15-grados-y-la-direccion-principal
    titulo: Dos galgas a 15° de x, la deformación según z y cinco criterios de fallo
    fuente: >-
      Problema 1 · Extraordinaria del 2 de febrero de 2022 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1,5 puntos (impreso «(1,5 p)»). El PDF es una conversión del Word
      original; las ε de los datos están en la fuente Symbol del Word y se
      transcriben como lo que son. El examen no publica resolución; el
      desarrollo es nuestro, con los convenios de los temas 3, 4 y 6.
    nivel: examen
    enunciado: |
      1. (1,5 p) En un estado de tensiones plano donde Z es una dirección
      principal, y otra de las direcciones principales esta a 30º horario
      respecto x.

      Se conocen los siguientes datos:

      $\varepsilon_u$= 1.176 10⁻³

      $\varepsilon_t$= 0.482 10⁻³

      $\varepsilon_z$= −0.964 10⁻³

      1. Calcular las tensiones y deformaciones principales, y sus
         direcciones.
      2. Componentes intrínsecas de la tensión en un plano perpendicular a
         una dirección *a* (contenida en el plano OXY) que forma 60º horario
         respecto a x.
      3. Siendo $\sigma_{L0}$=45MPa y K=0.9, determinar el factor de
         seguridad según criterios de Mohr, Rankine, Deformación Máxima,
         Tresca y Von Mises.

      En un cuadro, a la izquierda de la figura: E=42 GPa;  υ= 0.35

