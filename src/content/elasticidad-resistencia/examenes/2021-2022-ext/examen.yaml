# La convocatoria extraordinaria de Elasticidad y Resistencia de Materiales
# de 2021-2022, fechada el 02/02/2022: tres páginas a dos columnas, en
# castellano y en euskera, de la Escuela de Ingeniería de Gipuzkoa. La
# página 1 es de teoría (TEORÍA /TEORIA: cuatro cuestiones de 1 punto) y la
# 2 y la 3, de problemas (PROBLEMAS/ ARIKETAK: cuatro de 1,5 puntos; el
# problema 4 va solo en la página 3). Diez puntos en total, y el cuadernillo
# los imprime todos.
#
# Se transcribe la columna en castellano, tal cual, con sus puntos
# impresos. Lo que hay que saber de ese texto, dicho antes de que nadie lo
# deduzca:
#
# 1. **ES LA EXTRAORDINARIA, AUNQUE IMPRIMA «EXAMEN FINAL».** Las tres
#    páginas llevan «02/02/2022 EXAMEN FINAL». La fecha es la de las
#    extraordinarias del material (29/01/2020 y 02/02/2021), y las
#    ordinarias de enero son de mediados de mes. Los cuatro problemas no
#    salen en ningún otro examen: no es copia de otra convocatoria.
#
# 2. **EL PDF PIERDE COSAS QUE EL WORD TIENE.** El PDF es una conversión del
#    Word original. Corta en «L/» la cota L/3 de la figura del problema 2 y
#    deja la fórmula de su cuadro sin denominadores; monta el tirante BC y
#    el apoyo C del problema 3 encima del cuadro del problema 4; pierde la
#    «y» de «en función de t y Mo», y deja casi ilegible la fórmula de It
#    del problema 4. Todo se ha leído del Word, y cada ejercicio lo dice.
#    Las figuras se han redibujado del Word.
#
# 3. **DOS NUMERACIONES EN UN CUADERNILLO.** La teoría va de la 1 a la 4 y
#    los problemas vuelven a empezar en 1. Aquí la teoría son **n 1 a 4** y
#    los problemas **n 5 a 8**; la `fuente` de cada ejercicio dice el número
#    impreso.
#
# 4. **LA TEORÍA ENTERA ESTÁ YA EN OTROS EXÁMENES.** Las cuatro cuestiones
#    son idénticas, con su número y sus puntos, a cuestiones ya
#    transcritas, y la entrada apunta a ellas:
#    - la **1** es, palabra por palabra, la cuestión 1 del primer parcial de
#      2018-2019: «1.(1p) Deducir la relación entre el vector tensión…»;
#    - la **2**, la cuestión 2 del primer parcial de 2017-2018:
#      «2.(1p) Determinar las tensiones a partir de las deformaciones.»;
#    - la **3** y la **4**, las cuestiones 3 y 4 de la final del 15 de enero
#      de 2021: «3. (1p) Teorema del flujo cortante.» y «4. (1p) Calcular la
#      carga crítica de pandeo en una columna biarticulada.»
#
# 5. **LECTURAS DE LOS PROBLEMAS.** Cada una va también en la nota de su
#    enunciado.
#    - Problema 1: el «estado de tensiones plano» con z principal se lee
#      con la εz medida, que no es la de σz = 0 (sería −519·10⁻⁶, no
#      −964·10⁻⁶): z es principal y σz no es nula. «Horario respecto x» se
#      mide hacia −y. σL0 es el límite a tracción y K, la k = σet/σec de
#      Mohr.
#    - Problema 2: «EI= 100L²q0» no es homogéneo y se lee EI = 100q0L³. El
#      resorte está dibujado h por debajo de la viga y el texto lo une a B:
#      está estirado h y su fuerza es k(δB − h).
#    - Problema 3: el canto h = 75 mm de AB va en vertical; se desprecian
#      el axil y la cortante de OA y de AB; el tirante trabaja a compresión,
#      y la resolución dice que, así dibujado, pandearía.
#    - Problema 4: 11t es el lado exterior del tubo (línea media de 10t);
#      M0 va según la flecha doble, hacia C; los tirantes trabajan a
#      tracción y a compresión.
#
# 6. **ERRATAS Y GRAFÍAS DEL TEXTO, CONSERVADAS**: «esta a 30º» sin tilde y
#    el coeficiente de Poisson escrito «υ», una ípsilon griega en lugar de
#    la ν (problema 1; las ε de sus datos, en la fuente Symbol del Word, se
#    transcriben como lo que son); «qo» y «q0», «K» y «k» (problema 2);
#    «diametro100», «v=0.29» y «Kg/cm²» (problema 3); «está formado» y
#    «LDc» (problema 4); los puntos, «(1,5 p)», «(1.5p)» y «(1,5p)».
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso (src/lib/erm) y de un segundo camino
# (fase-p/p9d, guiones/cifras.mjs). El motor no tiene resortes con
# precarga ni resortes de torsión: el del problema 2 se resuelve como un
# asiento ajustado y, por la elástica, como un resorte más una fuerza k·h;
# el del problema 4, como un tramo de eje ficticio.
pdf: 2021-2022-ext.pdf
