      **b/ El giro de A.** Por Engesser-Castigliano con un par $M_A$ en A,
      $\theta_A = \partial C/\partial M_A$. Como $\partial C/\partial X = 0$,
      el par unidad puede ir sobre la isostática base: con él, la rótula da
      $V_A' = 1/b$, y $M' = -1$ en AB, $M' = s/b - 1$ en BC y $M' = 0$ en CD.
      Con el flector real $M$ de la estructura resuelta (fuerza unitaria,
