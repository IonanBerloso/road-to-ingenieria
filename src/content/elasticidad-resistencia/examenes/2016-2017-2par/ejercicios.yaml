  # ── Teoría · cuestión 2 · el poste de aluminio con la fuerza inclinada (tema 9).
  - id: exerm1617-2par-2-el-poste-de-aluminio-con-la-fuerza-inclinada
    titulo: El poste de aluminio con una fuerza inclinada en su cara exterior
    fuente: >-
      Cuestión 2 de teoría · Segunda parte del 19 de enero de 2017 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 9, apartado 9.4
      (págs. 23 a 25), y las cifras salen del motor del curso y de un segundo
      camino.
    nivel: examen
    enunciado: |
      (1p) Un poste de alumnio está empotrado en su base y soporta una fuerza
      $T$ que actúa en la superficie exterior del poste, formando un ángulo
      $\alpha$ = 28º con la vertical. La longitud del poste es $L$ = 2,0 m y
      su sección transversal es circular hueca con diámetro exterior $d_2$ =
      250 mm y diámetro interior $d_1$ = 200 mm. Determinar el valor
      admisible de la fuerza $T$ si la tensión de compresión admisible en el
      poste de aluminio es de 80 MPa.

      <figure class="figura-examen">
      <svg viewBox="0 0 380 262" role="img" width="380" height="262" aria-labelledby="exerm1617-2par-2-el-poste-de-aluminio-con-la-fuerza-inclinada-fig-t exerm1617-2par-2-el-poste-de-aluminio-con-la-fuerza-inclinada-fig-d">
      <title id="exerm1617-2par-2-el-poste-de-aluminio-con-la-fuerza-inclinada-fig-t">El poste empotrado con la fuerza T inclinada, y su sección</title>
      <desc id="exerm1617-2par-2-el-poste-de-aluminio-con-la-fuerza-inclinada-fig-d">A la izquierda, un poste vertical empotrado en el suelo por su base, con la cota L de su altura. En la esquina de arriba a la derecha, sobre la superficie exterior del poste, actúa la fuerza T, que apunta hacia abajo y hacia la derecha, hacia fuera del poste, formando el ángulo α con la vertical, marcada con una línea punteada. A la derecha, la sección: una corona circular, con la cota d1 del diámetro interior y la cota d2 del exterior.</desc>
      <rect x="110" y="40" width="30" height="200" fill="var(--faint)" fill-opacity=".45" stroke="var(--ink)" stroke-width="1.2"/>
      <line x1="86" y1="240" x2="164" y2="240" stroke="var(--ink)" stroke-width="1.6"/><path d="M92 240 l-4.9 4.9 M98 240 l-4.9 4.9 M104 240 l-4.9 4.9 M110 240 l-4.9 4.9 M116 240 l-4.9 4.9 M122 240 l-4.9 4.9 M128 240 l-4.9 4.9 M134 240 l-4.9 4.9 M140 240 l-4.9 4.9 M146 240 l-4.9 4.9 M152 240 l-4.9 4.9 M158 240 l-4.9 4.9 M164 240 l-4.9 4.9" stroke="var(--faint)" stroke-width="1"/>
      <line x1="140" y1="40" x2="170.5" y2="97.4" stroke="var(--ink)" stroke-width="1.6"/><polygon points="173.8,103.6 167,98.2 173.1,94.9" fill="var(--ink)"/>
      <text x="179.8" y="107.6" font-size="15" fill="var(--ink)" font-style="italic">T</text>
      <line x1="140" y1="40" x2="140" y2="114" stroke="var(--ink)" stroke-width="0.8" stroke-dasharray="2 2"/>
      <path d="M161.6 80.6 A46 46 0 0 1 140 86" fill="none" stroke="var(--ink)" stroke-width="1"/><polygon points="161.6,80.6 157.4,85.6 155.2,81.3" fill="var(--ink)"/><polygon points="140,86 146,83.6 146,88.4" fill="var(--ink)"/>
      <text x="154.1" y="97.4" font-size="15" fill="var(--ink)" font-style="italic">α</text>
      <line x1="106" y1="40" x2="67" y2="40" stroke="var(--ink)" stroke-width="0.8" stroke-dasharray="2 2"/>
      <line x1="84" y1="240" x2="67" y2="240" stroke="var(--ink)" stroke-width="0.8" stroke-dasharray="2 2"/>
