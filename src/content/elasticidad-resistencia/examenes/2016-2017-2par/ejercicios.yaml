          <text x="220" y="50" font-size="12" fill="var(--ink)" text-anchor="middle" stroke="var(--paper)" stroke-width="3" paint-order="stroke">140 N·m</text>
          <text x="320" y="153" font-size="12" fill="var(--ink)" text-anchor="middle" stroke="var(--paper)" stroke-width="3" paint-order="stroke">−260 N·m</text>
          <polygon points="70,256 70,256 80,254.2 90,252.3 100,250.3 110,248.2 120,246.1 130,243.9 140,241.7 150,239.3 160,236.9 170,234.4 180,231.9 190,229.4 200,226.9 210,224.4 220,221.9 230,219.3 240,216.8 250,214.3 260,211.8 270,209.3 280,214 290,218.6 300,223.3 310,228 320,232.6 330,237.3 340,242 350,246.7 360,251.3 370,256 370,256" fill="var(--faint)" fill-opacity=".4" stroke="none"/>
          <polyline points="70,256 80,254.2 90,252.3 100,250.3 110,248.2 120,246.1 130,243.9 140,241.7 150,239.3 160,236.9 170,234.4 180,231.9 190,229.4 200,226.9 210,224.4 220,221.9 230,219.3 240,216.8 250,214.3 260,211.8 270,209.3 280,214 290,218.6 300,223.3 310,228 320,232.6 330,237.3 340,242 350,246.7 360,251.3 370,256" fill="none" stroke="var(--ink)" stroke-width="1.4"/>
          <line x1="70" y1="256" x2="370" y2="256" stroke="var(--ink)" stroke-width="1.1"/>
          <text x="58" y="261" font-size="13" fill="var(--ink)" font-weight="bold" text-anchor="end">φ</text>
          <text x="170" y="227.4" font-size="12" fill="var(--ink)" text-anchor="middle" stroke="var(--paper)" stroke-width="3" paint-order="stroke">7,19</text>
          <text x="274" y="202.3" font-size="12" fill="var(--ink)" stroke="var(--paper)" stroke-width="3" paint-order="stroke">15,57·10⁻³ rad</text>
          </svg>
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Equilibrio: $R_A + R_D - m_0a + M_0 = 0$, con dos incógnitas.
          - texto: >-
              Compatibilidad: $\int_A^D M_t\,dx = 0$, de donde
              $R_A = -100$ N·m y $M_t$ = 100 → 140, 140 y −260 N·m.
          - texto: >-
              Con $|M_t|_{\max}$ = 260 N·m y la ec. 12.11, $D$ = 32,11 mm.
          - texto: >-
              Integrando $M_t/GI_p$ desde A, $\varphi_B$ = 0,41°,
              $\varphi_C$ = 0,89° y $\varphi_D$ = 0.
          - texto: >-
              El torsor máximo está en C y vale $M_0$ = 400 N·m.
            trampa: true
            mensaje: |
              En C el torsor **salta** $M_0$, de 140 a −260 N·m: ni a un lado
              ni al otro vale 400. El máximo en valor absoluto es 260 N·m, en
              CD.
    resolucion: |
      **El convenio.** $M_t$ positivo cuando su vector, sobre la cara de la
      sección, sale de ella, como un axil de tracción; los giros $\varphi$,
      positivos con la regla de la mano derecha alrededor del eje, de A hacia
      D. Los pares de la figura: $m_0$ = 80 N·m/m con los vectores hacia A
      (negativo), en AB, y $M_0$ = 400 N·m con el vector hacia D (positivo),
      en C. $R_A$ y $R_D$, los pares de los empotramientos, positivos hacia
      D.

      **El hiperestático.** Equilibrio:
      $R_A + R_D - m_0a + M_0 = 0$. Una ecuación para dos incógnitas: falta
      la compatibilidad. A y D no giran, y con $GI_p$ constante la ec. 12.13
      (apuntes del tema 12, p. 8) pide que el área del diagrama de torsores
      de A a D sea nula. Con $R_A$ como incógnita, el torsor es
      $M_t = -R_A + m_0x$ en AB, $-R_A + m_0a$ en BC y
      $-R_A + m_0a - M_0$ en CD:

      $$
      \int_A^D M_t\,dx = -3aR_A + \tfrac{1}{2}m_0a^2 + m_0a^2 + (m_0a - M_0)\,a = 0
      \quad\Rightarrow\quad R_A = -100\ \text{N·m},\quad R_D = -260\ \text{N·m}
      $$

      **a/ El diagrama de torsores.** $M_t = 100 + 80x$ N·m en AB (de 100 a
      140), 140 N·m en BC y $140 - 400 = -260$ N·m en CD. Área:
      $60 + 70 - 130 = 0$, como tiene que ser.

      **El diámetro.** Con $|M_t|_{\max}$ = 260 N·m y la ec. 12.11 (p. 7):

      $$
      D = \sqrt[3]{\frac{16\,|M_t|_{\max}}{\pi\,\tau_{\text{adm}}}}
      = \sqrt[3]{\frac{16\cdot260\cdot10^3}{\pi\cdot40}}\ \text{mm} = 32{,}11\ \text{mm}
      $$

      **b/ Los ángulos de torsión.** Con ese diámetro,
      $GI_p = G\pi D^4/32 = 8348$ N·m², y
      $\varphi(x) = \int_A^x M_t\,dx/GI_p$ (ec. 12.13):

      $$
      \varphi_B = \frac{100\cdot0{,}5 + 40\cdot0{,}5/2}{GI_p} = \frac{60}{GI_p} = 0{,}00719\ \text{rad} = 0{,}4118°
      $$

      $$
      \varphi_C = \varphi_B + \frac{140\cdot0{,}5}{GI_p} = \frac{130}{GI_p} = 0{,}01557\ \text{rad} = 0{,}8922°,\qquad
      \varphi_D = \varphi_C - \frac{260\cdot0{,}5}{GI_p} = 0
      $$

      El diagrama es una parábola de 0 a $\varphi_B$ en AB (el torsor crece
      linealmente), una recta hasta $\varphi_C$ en BC, que es el máximo, y
      una recta de vuelta a 0 en CD. El motor del curso da los mismos
      torsores y los mismos giros; con un diámetro comercial mayor, los giros
      bajan con $D^4$.

  # ── Ejercicio 3 · el pórtico ABCD con rótula en C (tema 13). Cae igual en
  #    la final del mismo día, como ejercicio 4.
  - id: exerm1617-2par-7-el-portico-con-rotula-en-c
    titulo: El pórtico articulado en A, con rótula en C y empotrado en D
    fuente: >-
      Ejercicio 3 · Segunda parte del 19 de enero de 2017 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 2 puntos. Cayó igual el mismo día como ejercicio 4 del examen
      final, donde vale 1,5 puntos; el enunciado se transcribe sin su
      «(2p)», y cada hoja pone sus puntos. El examen no publica resolución;
      el desarrollo es nuestro, con el tema 13, y las cifras salen del motor
      del curso y de un segundo camino.
    nivel: examen
    enunciado: |
      En el sistema hiperestático ABCD de la figura, A es una articulación
      fija, C una articulación intermedia y D un empotramiento perfecto.
      Teniendo en cuenta únicamente la energía de flexión, determinar:

      a/ Reacciones en A y D.

      b/ Ángulo girado por la articulación A, siendo $EI_z$ la rigidez a
      flexión.

