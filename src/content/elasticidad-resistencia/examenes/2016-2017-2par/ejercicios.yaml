      <line x1="302" y1="80" x2="302" y2="250" stroke="var(--ink)" stroke-width="1"/><polygon points="302,250 299.4,243 304.6,243" fill="var(--ink)"/><polygon points="302,80 304.6,87 299.4,87" fill="var(--ink)"/>
