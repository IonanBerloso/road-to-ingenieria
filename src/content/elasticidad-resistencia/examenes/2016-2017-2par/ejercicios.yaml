      **Notas nuestras.** El PDF pierde los vectores de los momentos, que en
      el Word son flechas blancas sobre el eje: los de $m_0$ apuntan hacia
      A, y el de $M_0$, hacia D. Aquí se dibujan como vectores de doble
      punta, con la regla de la mano derecha. A y D son empotramientos.
    pide: >-
      El diagrama de momentos torsores, el diámetro con el que la tensión no
      pasa de 40 MPa y el diagrama de ángulos de torsión.
    pasos:
      - tipo: reconocer
        pregunta: |
          Hay dos reacciones, una en cada empotramiento, y una sola ecuación de
          equilibrio. ¿Qué ecuación falta?
        opciones:
          - texto: >-
              Que el giro de D respecto de A es nulo:
              $\int_A^D M_t\,dx/GI_p = 0$
            correcta: true
            mensaje: |
              Eso es. Los dos extremos están empotrados: no giran, y la
              diferencia de giros de la ec. 12.13 (p. 8) entre A y D es cero.
              Con $GI_p$ constante, el área del diagrama de torsores entre A y
              D tiene que ser nula.
          - texto: >-
              Que las dos reacciones son iguales
            mensaje: |
              Solo lo serían con la carga en el centro y simétrica. Aquí $m_0$
              está en el primer tramo y $M_0$ en C, a dos tercios: cada
              empotramiento recoge una parte distinta.
          - texto: >-
              Que el torsor es nulo en el centro del eje
            mensaje: |
              Nada obliga a eso. La condición es de deformación: los giros de
              los extremos.
          - texto: >-
              Que la tensión máxima es la admisible
            mensaje: |
              Esa condición da el diámetro, después. Las reacciones no
              dependen del diámetro: con $GI_p$ constante se simplifica.
      - tipo: calcular
        titulo: El torsor en A
        pregunta: |
          Con el torsor positivo cuando su vector sale de la cara de la
          sección, como un axil de tracción, ¿cuánto vale $M_t$ justo a la
          derecha de A, en N·m?
        respuesta:
          tipo: numero
          valor: '100.0'
          tolerancia: 0.5
          formato: un número, en N·m
        distractores:
          - valor: '-100'
            mensaje: |
              Es la reacción de A, que con el convenio de la cara sale con el
              signo cambiado. El torsor en la sección es lo que el trozo de la
              derecha hace sobre el de la izquierda: $M_t = -R_A$.
          - valor: '166.67'
            mensaje: |
              Has tomado $m_0$ y $M_0$ en el mismo sentido. En la figura,
              los vectores de $m_0$ apuntan hacia A y el de $M_0$, hacia D:
              son contrarios.
          - valor: '133.33'
            mensaje: |
              Es el reparto de $M_0$ solo, $M_0\cdot a/3a$. Falta $m_0$, que
              también se reparte entre los dos empotramientos.
        pista: |
          Con $R_A$ incógnita: $M_t = -R_A + m_0x$ en AB,
          $-R_A + m_0a$ en BC y $-R_A + m_0a - M_0$ en CD. La integral de
          $M_t$ de A a D es nula.
        desarrollo: |
          $$
          -3aR_A + \tfrac{1}{2}m_0a^2 + m_0a\cdot a + (m_0a - M_0)\,a = 0
          \quad\Rightarrow\quad
          R_A = \frac{10 + 20 + 20 - 200}{1{,}5} = -100\ \text{N·m}
          $$

          $M_t(A) = -R_A = 100$ N·m.
      - tipo: calcular
        titulo: El torsor máximo
        pregunta: |
          ¿Cuánto vale el mayor $|M_t|$ del eje, en N·m?
        respuesta:
          tipo: numero
          valor: '260.0'
          tolerancia: 0.5
          formato: un número, en N·m
        distractores:
          - valor: '273.33'
            mensaje: |
              Has tomado $m_0$ y $M_0$ en el mismo sentido. Los vectores de la
              figura son contrarios.
          - valor: '400'
            mensaje: |
              Es $M_0$ entero: como si solo A estuviera empotrado y C pasara
              todo su par a A. Con dos empotramientos, se reparte.
          - valor: '360'
            mensaje: |
              Es lo que llevaría D si solo D estuviera empotrado,
              $M_0 - m_0a$. Con dos empotramientos, se reparte.
          - valor: '140'
            mensaje: |
              Es el torsor de BC. En C el par $M_0$ lo hace saltar 400 N·m: en
              CD vale −260 N·m.
        pista: |
          Con $R_A$, los tres tramos: $100 + 80x$ en AB, 140 en BC y
          $140 - 400$ en CD.
        desarrollo: |
          $M_t$ va de 100 a 140 N·m en AB, vale 140 en BC y salta en C a
          $140 - 400 = -260$ N·m hasta D. El máximo en valor
          absoluto es $260$ N·m, en CD.
      - tipo: calcular
        titulo: El diámetro
        pregunta: |
          ¿Cuál es el diámetro mínimo con $\tau_{\text{adm}}$ = 40 MPa, en mm?
        respuesta:
          tipo: numero
          valor: '32.11'
          tolerancia: 0.05
          formato: un número, en mm
        distractores:
          - valor: '37.07'
            mensaje: |
              Es el diámetro para 400 N·m, con todo $M_0$ en un empotramiento.
              El torsor máximo es 260 N·m.
          - valor: '35.79'
            mensaje: |
              Es el diámetro para 360 N·m, como si solo D estuviera empotrado.
          - valor: '26.12'
            mensaje: |
              Has dimensionado con el torsor de BC, 140 N·m. Manda el mayor,
              el de CD.
          - valor: '16.05'
            mensaje: |
              Has despejado el radio: con $\tau = M_tr/I_p$ y
              $I_p = \pi r^4/2$ sale $r$. El diámetro es el doble, o
              directamente $\tau_{\max} = 16M_t/(\pi D^3)$ (ec. 12.11).
        pista: |
          $\tau_{\max} = 16M_t/(\pi D^3)$ (ec. 12.11, p. 7), con el $|M_t|$
          máximo.
        desarrollo: |
          $$
          D = \sqrt[3]{\frac{16\cdot260\cdot10^3\ \text{N·mm}}{\pi\cdot40\ \text{MPa}}} = 32{,}11\ \text{mm}
          $$
      - tipo: calcular
        titulo: El giro de C
        pregunta: |
          Apartado b. Con el diámetro estricto, $D$ = 32,11 mm, ¿cuánto gira
          la sección C, en grados, positivo con la regla de la mano derecha
          hacia D?
        respuesta:
          tipo: numero
          valor: '0.8922'
          tolerancia: 0.002
          formato: un número, en grados
        distractores:
          - valor: '-0.8922'
            mensaje: |
              El módulo es ese. De A a C el torsor es positivo, y el giro
              crece desde cero: C gira en el sentido positivo.
          - valor: '0.01557'
            mensaje: |
              Es el giro en radianes. Lo pedido son grados: por $180/\pi$.
          - valor: '0.4118'
            mensaje: |
              Es el giro de B. De B a C hay que sumar el área de BC,
              $140\cdot0{,}5$ N·m·m.
        pista: |
          $\varphi_C - \varphi_A = \int_A^C M_t\,dx/GI_p$ (ec. 12.13), con
          $\varphi_A = 0$.
        desarrollo: |
          $GI_p = 8\cdot10^{10}\cdot\pi\,(0{,}03211)^4/32 = 8348$ N·m², y
          el área del diagrama de torsores de A a C:

          $$
          \int_A^C M_t\,dx = \frac{100 + 140}{2}\cdot0{,}5 + 140\cdot0{,}5 = 130\ \text{N·m}^2,\qquad
          \varphi_C = \frac{130}{8348} = 0{,}01557\ \text{rad} = 0{,}8922°
          $$
      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de momentos torsores y de ángulos de
          torsión**, alineados con el eje, con sus valores en A, B, C y D.
        comprueba:
          - punto: |
              **Torsores**: recta de 100 a 140 N·m en AB, constante 140 N·m en
              BC, salto en C hasta −260 N·m, y constante hasta D.
            porque: |
              $m_0$ cambia $M_t$ a razón de 80 N·m por metro, y el par $M_0$
              lo hace saltar 400 N·m en C.
          - punto: |
              **Ángulos**: 0 en A; curva hasta $7{,}19\cdot10^{-3}$ rad en B;
              recta hasta $15{,}57\cdot10^{-3}$ rad en C; recta de vuelta a 0
              en D.
            porque: |
              $\varphi_{,x} = M_t/GI_p$: con $M_t$ lineal, $\varphi$ es
              parabólico; con $M_t$ constante, lineal. Vuelve a 0 en D porque
              D también está empotrado.
          - punto: |
              **El giro máximo** está en C, donde $M_t$ cambia de signo.
            porque: |
              Donde la derivada de $\varphi$, $M_t/GI_p$, cambia de signo,
              $\varphi$ tiene su extremo.
        figura: |
          <svg viewBox="0 0 450 280" role="img" width="450" height="280" aria-labelledby="exerm1617-2par-6-el-eje-biempotrado-con-un-par-repartido-y-otro-concentrado-dib-t exerm1617-2par-6-el-eje-biempotrado-con-un-par-repartido-y-otro-concentrado-dib-d">
          <title id="exerm1617-2par-6-el-eje-biempotrado-con-un-par-repartido-y-otro-concentrado-dib-t">Los diagramas de momentos torsores y de ángulos de torsión del eje</title>
          <desc id="exerm1617-2par-6-el-eje-biempotrado-con-un-par-repartido-y-otro-concentrado-dib-d">Dos diagramas alineados con el eje, con líneas verticales en A, B, C y D, positivos hacia arriba. Momentos torsores: una recta de 100 N·m en A a 140 N·m en B, constante 140 N·m de B a C, y en C un salto hasta menos 260 N·m, constante hasta D. Ángulos de torsión, en milésimas de radián: cero en A, una curva que sube hasta unos 7,19 en B, una recta que sube hasta unos 15,57 en C, y una recta que baja hasta cero en D.</desc>
