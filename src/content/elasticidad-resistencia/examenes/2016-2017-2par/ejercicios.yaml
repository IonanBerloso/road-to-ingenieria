      - tipo: calcular
        titulo: El giro en C con q0 sola
        pregunta: |
          Apartado b. Integrando la elástica en BC con $q_0$ sola, ¿cuánto vale
          el giro en C, en unidades de $q_0L^3/EI$, positivo en sentido
          horario?
        respuesta:
          tipo: numero
          valor: '0.3333'
          tolerancia: 0.002
          formato: un número, en unidades de q0·L³/EI
        distractores:
          - valor: '0.1667'
            mensaje: |
              Es el giro en B cambiado de signo. En BC,
              $\theta_C - \theta_B = -\int_B^C M/EI\,dx = \tfrac{1}{2}$, y
              $\theta_B = -\tfrac{1}{6}$: $\theta_C = \tfrac{1}{3}$.
          - valor: '-0.3333'
            mensaje: |
              El módulo es ese. C gira en sentido horario: el voladizo CD baja
              hacia D con la fuerza de la rótula.
        pista: |
          En BC, con $\xi$ desde B, $M = -q_0L\xi$ y $v_{,xx} = -M/EI$
          (ec. 10.14), con $v = 0$ en B y en C.
        desarrollo: |
          $$
          v_{,\xi\xi} = \frac{q_0L\xi}{EI},\quad
          v_{,\xi} = \frac{q_0L\xi^2}{2EI} + C_1,\quad
          v = \frac{q_0L\xi^3}{6EI} + C_1\xi
          $$

          $v(L) = 0$ da $C_1 = \theta_B = -\tfrac{1}{6}\,q_0L^3/EI$, y

          $$
          \theta_C = \frac{q_0L^3}{2EI} - \frac{q_0L^3}{6EI} = 0{,}3333\,\frac{q_0L^3}{EI}
          $$
      - tipo: calcular
        titulo: El desplazamiento de D con q0 sola
        pregunta: |
          ¿Cuánto baja D con $q_0$ sola, en unidades de $q_0L^4/EI$?
        respuesta:
          tipo: numero
          valor: '0.6667'
          tolerancia: 0.002
          formato: un número, en unidades de q0·L⁴/EI
        distractores:
          - valor: '0.3333'
            mensaje: |
              Es el voladizo CD solo, como si C estuviera empotrado:
              $q_0L\cdot L^3/(3EI)$. C gira $\theta_C$, y el voladizo entero
              gira con él: falta $\theta_CL$.
          - valor: '0.5000'
            mensaje: |
              Has tomado $\theta_C = \tfrac{1}{6}$, el módulo del giro en B.
              En C es $\tfrac{1}{3}$.
          - valor: '1.3333'
            mensaje: |
              Es el doble: has llevado a D toda la carga de DF.
        pista: |
          El voladizo CD sale de C con la pendiente $\theta_C$ y está cargado
          con $q_0L$ en la punta: superpón las dos cosas.
        desarrollo: |
          $$
          v_D = \theta_C\,L + \frac{q_0L\cdot L^3}{3EI} = \left(\tfrac{1}{3} + \tfrac{1}{3}\right)\frac{q_0L^4}{EI} = 0{,}6667\,\frac{q_0L^4}{EI}
          $$
      - tipo: calcular
        titulo: El desplazamiento de D con P sola
        pregunta: |
          Con $P$ sola, ¿cuánto vale $v_D$, en unidades de $PL^3/EI$, positivo
          hacia abajo?
        respuesta:
          tipo: numero
          valor: '-0.1667'
          tolerancia: 0.002
          formato: un número, en unidades de P·L³/EI
        distractores:
          - valor: '0.1667'
            mensaje: |
              El módulo es ese. Con $P$, $M > 0$ en BC: entre B y C, que no se
              mueven, la viga baja con la concavidad hacia arriba, y en C sale
              subiendo. CD, recta, sube con ella.
          - valor: '-0.3333'
            mensaje: |
              Es el doble: has tomado el módulo del giro en B,
              $\tfrac{1}{3}PL^2/EI$, en lugar del de C, que es la mitad,
              $\theta_C = -\tfrac{1}{6}PL^2/EI$.
          - valor: '0.3333'
            mensaje: |
              Has usado el giro en B, $\theta_B = +\tfrac{1}{3}PL^2/EI$. D
              está al otro lado de C, y CD sale de C con su pendiente,
              $\theta_C = -\tfrac{1}{6}PL^2/EI$: D sube.
        pista: |
          Con $P$ sola, CD no tiene flector: es una recta que sale de C con la
          pendiente $\theta_C$. Integra en BC con $M = P(L - \xi)$.
        desarrollo: |
          En BC, $v_{,\xi\xi} = -P(L - \xi)/EI$; con $v = 0$ en B y en C sale
          $\theta_B = \tfrac{1}{3}PL^2/EI$ y
          $\theta_C = -\tfrac{1}{6}PL^2/EI$. CD es recta:

          $$
          v_D = \theta_C\,L = -0{,}1667\,\frac{PL^3}{EI}
          $$

          Negativo: D sube.
      - tipo: calcular
        titulo: La relación entre P y q0
        pregunta: |
          ¿Cuánto tiene que valer $P/(q_0L)$ para que D no se desplace?
        respuesta:
          tipo: numero
          valor: '4.00'
          tolerancia: 0.02
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Te falta el giro de C con $q_0$: solo has contado el voladizo,
              $\tfrac{1}{3}q_0L^4/EI$.
          - valor: '8'
            mensaje: |
              Has cargado la rótula con toda la carga de DF, $2q_0L$.
          - valor: '3'
            mensaje: |
              Has tomado $\theta_C = \tfrac{1}{6}q_0L^3/EI$ con $q_0$: ese es
              el módulo del giro en B.
        pista: |
          Superpón: $v_D = v_D^P + v_D^{q_0} = 0$.
        desarrollo: |
          $$
          -\tfrac{1}{6}\,\frac{PL^3}{EI} + \tfrac{2}{3}\,\frac{q_0L^4}{EI} = 0
          \quad\Rightarrow\quad P = 4\,q_0L
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              DF, biapoyada, da $R_D = R_F = q_0L$; ABCD recibe $q_0L$ en D.
          - texto: >-
              Con $P$: $R_B = -2P$, $R_C = P$ y $M_B = PL$. Con $q_0$:
              $R_B = -q_0L$, $R_C = 2q_0L$ y $M_C = -q_0L^2$.
          - texto: >-
              Integrando $v_{,xx} = -M/EI$ en BC, con $v = 0$ en B y en C,
              salen los giros en C: $-\tfrac{1}{6}PL^2/EI$ y
              $\tfrac{1}{3}q_0L^3/EI$.
          - texto: >-
              El voladizo CD lleva esos giros a D, y con $q_0$ además se
              flecta: $v_D = -\tfrac{1}{6}PL^3/EI + \tfrac{2}{3}q_0L^4/EI$, nula
              con $P = 4q_0L$.
          - texto: >-
              En la rótula D la cortante es nula.
            trampa: true
            mensaje: |
              En la rótula lo nulo es el **flector**. La cortante pasa: con
              $q_0$, por D pasan $q_0L$ de DF a ABCD.
    resolucion: |
      **Las reacciones.** La rótula da la cuarta ecuación, $M_D = 0$:
      separando la viga por D, DF es una biapoyada y ABCD recibe en D su
      reacción. Positivas hacia arriba, con $q_0$ sola: $R_D = R_F = q_0L$,
      y en ABCD, con $q_0L$ hacia abajo en D, $R_B = -q_0L$ y $R_C = 2q_0L$.
      Con P sola, DF no trabaja: $R_B = -2P$ y $R_C = P$.

      **a/ Los diagramas** (cortante, suma de las fuerzas de la izquierda
      hacia arriba; flector, positivo con las fibras de abajo estiradas;
      apuntes del tema 7, ecs. 7.14 y 7.15):

      - P sola. T vale P en AB, −P en BC y 0 en el resto. M sube en recta de
        0 en A a $PL$ en B, baja a 0 en C y es nulo después.
      - $q_0$ sola. T es nula en AB, vale $-q_0L$ en BC y $q_0L$ en CD, y en
        DF baja en recta de $q_0L$ a $-q_0L$. M es nulo en AB, va en recta a
        $-q_0L^2$ en C y vuelve a 0 en la rótula; en DF es la parábola de una
        biapoyada, con $\tfrac{1}{2}q_0L^2$ en el centro.

      **b/ La flecha de D, integrando la elástica.** Con
      $v_{,xx} = -M/EI$ (apuntes del tema 10, ec. 10.14, p. 7), $v$ hacia
      abajo y el giro $\theta = v_{,x}$, horario positivo. En BC se integra
      dos veces con $v = 0$ en B y en C; CD sale de C con la pendiente
      $\theta_C$, y con $q_0$ se flecta además como una ménsula con $q_0L$ en
      la punta. Con $\xi$ desde B:

      $$
      \begin{aligned}
      q_0:&\quad M_{BC} = -q_0L\xi,\quad \theta_C = \tfrac{1}{3}\frac{q_0L^3}{EI},\quad
      v_D = \theta_CL + \frac{q_0L\cdot L^3}{3EI} = 0{,}6667\,\frac{q_0L^4}{EI}\\
      P:&\quad M_{BC} = P(L - \xi),\quad \theta_C = -\tfrac{1}{6}\frac{PL^2}{EI},\quad
      v_D = \theta_CL = -0{,}1667\,\frac{PL^3}{EI}
      \end{aligned}
      $$

      Con P, D sube; con $q_0$, baja. Los giros en B son $-\tfrac{1}{6}$ y
      $+\tfrac{1}{3}$ en las mismas unidades.

      **La relación.**

      $$
      -\tfrac{1}{6}\,\frac{PL^3}{EI} + \tfrac{2}{3}\,\frac{q_0L^4}{EI} = 0
      \quad\Rightarrow\quad P = 4\,q_0L
      $$

      El motor del curso, con las dos cargas juntas y $P = 4q_0L$, da
      $v_D = 0$; con cada una por separado, las mismas flechas.

  # ── Ejercicio 2 · el eje biempotrado con m0 y M0 (tema 12). Cae igual en
  #    la final del mismo día, como ejercicio 3.
  - id: exerm1617-2par-6-el-eje-biempotrado-con-un-par-repartido-y-otro-concentrado
    titulo: El eje empotrado en los dos extremos con un torsor repartido y otro concentrado
    fuente: >-
      Ejercicio 2 · Segunda parte del 19 de enero de 2017 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 2 puntos. Cayó igual el mismo día como ejercicio 3 del examen
      final, donde vale 1,5 puntos; el enunciado se transcribe sin su
      «(2p)», y cada hoja pone sus puntos. El examen no publica resolución;
      el desarrollo es nuestro, con el tema 12, y las cifras salen del motor
      del curso y de un segundo camino.
    nivel: examen
    enunciado: |
      El eje de sección circular llena de la figura soporta el momento torsor
      distribuido $m_0$ = 80 N·m/m en el tramo AB y el momento torsor
      $M_0$ = 400 N·m en C. Determinar:

      a/ Diagrama de momentos torsores y diámetro de la sección, siendo
      $a$ = 0,5 m y $\tau_{\text{adm}}$ = 40 MPa.

      b/ Diagrama de ángulos de torsión, siendo $G$ = 8·10⁴ MPa.

