      <text x="65" y="145" font-size="15" fill="var(--ink)" font-style="italic" text-anchor="end">L</text>
      <path d="M255 120 a45 45 0 1 0 90 0 a45 45 0 1 0 -90 0 Z M264 120 a36 36 0 1 0 72 0 a36 36 0 1 0 -72 0 Z" fill="var(--faint)" fill-opacity=".45" fill-rule="evenodd" stroke="var(--ink)" stroke-width="1.2"/>
