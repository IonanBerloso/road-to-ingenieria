      <line x1="336" y1="120" x2="336" y2="188" stroke="var(--ink)" stroke-width="0.8" stroke-dasharray="2 2"/>
      <line x1="255" y1="120" x2="255" y2="216" stroke="var(--ink)" stroke-width="0.8" stroke-dasharray="2 2"/>
      <line x1="345" y1="120" x2="345" y2="216" stroke="var(--ink)" stroke-width="0.8" stroke-dasharray="2 2"/>
      <line x1="264" y1="183" x2="336" y2="183" stroke="var(--ink)" stroke-width="1"/><polygon points="336,183 329,185.6 329,180.4" fill="var(--ink)"/><polygon points="264,183 271,180.4 271,185.6" fill="var(--ink)"/>
      <line x1="255" y1="211" x2="345" y2="211" stroke="var(--ink)" stroke-width="1"/><polygon points="345,211 338,213.6 338,208.4" fill="var(--ink)"/><polygon points="255,211 262,208.4 262,213.6" fill="var(--ink)"/>
