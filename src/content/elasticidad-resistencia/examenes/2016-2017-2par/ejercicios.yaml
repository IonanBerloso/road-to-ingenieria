      <text x="300" y="206" font-size="14" fill="var(--ink)" text-anchor="middle" stroke="var(--paper)" stroke-width="3" paint-order="stroke"><tspan font-style="italic">d</tspan><tspan font-size="11" dy="4">2</tspan></text>
      </svg>
      <figcaption>

      Redibujada del enunciado.

      </figcaption>
      </figure>

      **Notas nuestras.** De la figura: $T$ actúa en lo alto del poste, en
      el borde exterior del lado derecho, y apunta hacia abajo y hacia la
      derecha, en el plano del dibujo. Se conserva «alumnio».
    pide: >-
      El mayor valor de T con el que la compresión en el poste no pasa de
      80 MPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el empotramiento, ¿qué esfuerzos produce $T$?
        opciones:
          - texto: >-
              Un axil de compresión $T\cos\alpha$, un cortante $T\sin\alpha$ y
              un flector al que contribuyen las dos componentes: la horizontal
              con el brazo $L$ y la vertical con el brazo $d_2/2$
            correcta: true
            mensaje: |
              Eso es. La componente vertical no pasa por el eje: está a
              $d_2/2$ de él, y da compresión excéntrica (apartado 9.4.2,
              págs. 24 y 25). La horizontal da cortante y un flector que crece
              hasta la base. Los dos flectores van en el mismo sentido.
          - texto: >-
              Un axil $T\cos\alpha$ y un flector $T\sin\alpha\cdot L$; la
              componente vertical va por la pared y no flecta
            mensaje: |
              Que vaya por la pared es justo lo que la aleja del eje: una
              fuerza paralela al eje a $d_2/2$ de él equivale a la misma
              fuerza en el eje más un par $T\cos\alpha\cdot d_2/2$.
          - texto: >-
              Un flector y un torsor, porque la fuerza actúa en la superficie
              exterior
            mensaje: |
              Para que hubiera torsor, $T$ tendría que tener componente
              tangente a la circunferencia de la sección. Está en un plano que
              contiene el eje del poste: no hay torsor.
          - texto: >-
              Solo un axil $T\cos\alpha$, porque el dato es una tensión de
              compresión
            mensaje: |
              La compresión admisible limita la tensión más comprimida, y a
              esa tensión contribuyen el axil y los flectores. El flector, con
              el brazo de 2 m, es de lejos lo que más pesa.
      - tipo: calcular
        titulo: El brazo del flector
        pregunta: |
          El flector en el empotramiento es $T$ por un brazo equivalente.
          ¿Cuánto vale ese brazo, $M/T$, en mm?
        respuesta:
          tipo: numero
          valor: '1049.3'
          tolerancia: 0.5
          formato: un número, en mm
        distractores:
          - valor: '938.9'
            mensaje: |
              Es $L\sin\alpha$, la componente horizontal sola. Falta la
              vertical, que está a $d_2/2$ = 125 mm del eje.
          - valor: '828.6'
            mensaje: |
              Has restado la parte de la componente vertical. La horizontal,
              hacia la derecha, comprime el lado derecho de la base, y la
              vertical, aplicada en el borde derecho, también: se suman.
          - valor: '1824.6'
            mensaje: |
              Has cambiado el seno por el coseno. $\alpha$ se mide desde la
              vertical: la componente horizontal es $T\sin\alpha$ y la
              vertical, $T\cos\alpha$.
        pista: |
          $M = T\sin\alpha\cdot L + T\cos\alpha\cdot d_2/2$.
        desarrollo: |
          $$
          \frac{M}{T} = 2000\sin28° + 125\cos28° = 938{,}9 + 110{,}4 = 1049{,}3\ \text{mm}
          $$
      - tipo: calcular
        titulo: La fuerza admisible
        pregunta: |
          ¿Cuánto vale el valor admisible de $T$, en kN?
        respuesta:
          tipo: numero
          valor: '66.19'
          tolerancia: 0.05
          formato: un número, en kN
        distractores:
          - valor: '73.62'
            mensaje: |
              Has tomado el flector de la componente horizontal sola, sin la
              excentricidad de la vertical: el brazo de 125 mm añade un 12 %
              al flector.
          - valor: '82.91'
            mensaje: |
              Has restado el flector de la componente vertical. En la cara
              donde actúa $T$ las dos componentes comprimen: se suman.
          - valor: '69.05'
            mensaje: |
              Te falta el axil, $T\cos\alpha/A$. Es pequeño frente al flector,
              pero también comprime.
          - valor: '39.19'
            mensaje: |
              Has cambiado el seno por el coseno: $\alpha$ se mide desde la
              vertical, y la componente que da el brazo de 2 m es la
              horizontal, $T\sin\alpha$.
        pista: |
          $\sigma = \dfrac{T\cos\alpha}{A} + \dfrac{M}{W}$, con
          $W = I/(d_2/2)$, igualada a 80 MPa.
        desarrollo: |
          $A = \tfrac{\pi}{4}(250^2 - 200^2) = 17\,671$ mm²,
          $I = \tfrac{\pi}{64}(250^4 - 200^4) = 113\,207\,782$ mm⁴ y
          $W = I/125 = 905\,662$ mm³:

          $$
          80 = T\left(\frac{\cos28°}{17\,671} + \frac{1049{,}3}{905\,662}\right)
          \quad\Rightarrow\quad T = 66{,}19\ \text{kN}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En el empotramiento, $N = -T\cos\alpha$ y
              $M = T(L\sin\alpha + \tfrac{d_2}{2}\cos\alpha)$.
          - texto: >-
              La compresión máxima está en el borde exterior del lado de $T$,
              donde el axil y el flector comprimen a la vez.
          - texto: >-
              $T\cos\alpha/A + M/W = 80$ MPa da
              $T = 66{,}19$ kN.
          - texto: >-
              En el lado opuesto, la tensión es de tracción: el flector pesa
              más que el axil.
          - texto: >-
              La compresión máxima está en el borde opuesto a $T$, porque la
              fuerza tira hacia fuera.
            trampa: true
            mensaje: |
              La componente horizontal de $T$ empuja la punta del poste hacia
              la derecha: en la base, el lado derecho se acorta y el izquierdo
              se alarga, como en una ménsula. Y la vertical, aplicada en el
              borde derecho, comprime más ese lado. La compresión máxima está
              en el lado de $T$.
    resolucion: |
      **Los esfuerzos en el empotramiento.** $T$ se descompone en una
      vertical, $T\cos\alpha$, hacia abajo, y una horizontal, $T\sin\alpha$,
      hacia fuera. La vertical está aplicada en la cara exterior, a
      $d_2/2$ = 125 mm del eje: es una compresión excéntrica (apuntes del
      tema 9, apartado 9.4.2, págs. 24 y 25). En la base:

      $$
      N = -T\cos\alpha,\qquad
      M = T\left(L\sin\alpha + \tfrac{d_2}{2}\cos\alpha\right) = T\cdot1049{,}3\ \text{mm}
      $$

      y un cortante $T\sin\alpha$, que no entra en la tensión normal. Los
      dos flectores comprimen el mismo lado, el de $T$: la horizontal empuja
      la punta hacia ese lado, y la vertical está en ese borde.

      **La sección.**
      $A = \tfrac{\pi}{4}(250^2 - 200^2) = 17\,671$ mm²,
      $I = \tfrac{\pi}{64}(250^4 - 200^4) = 113\,207\,782$ mm⁴ y
      $W = I/(d_2/2) = 905\,662$ mm³.

      **La condición.** Con la ec. 9.42 (p. 24), la tensión más comprimida
      está en el borde exterior del lado de $T$:

      $$
      |\sigma|_{\max} = \frac{T\cos\alpha}{A} + \frac{M}{W}
      = T\left(\frac{\cos28°}{17\,671\ \text{mm}^2} + \frac{1049{,}3\ \text{mm}}{905\,662\ \text{mm}^3}\right) = 80\ \text{MPa}
      $$

      $$
      T = 66{,}19\ \text{kN}
      $$

      De esos 80 MPa, $3{,}31$ son del axil y $76{,}69$ del flector.
      En el borde opuesto la tensión es de tracción,
      $76{,}69 - 3{,}31 = 73{,}39$ MPa: el enunciado solo
      limita la compresión. El motor del curso, recorriendo el borde de la
      sección con la ec. 9.42, da el mismo valor.

  # ── Teoría · cuestión 3 · la torsión de los perfiles cerrados de pequeño espesor (tema 12).
  - id: exerm1617-2par-3-la-torsion-de-los-perfiles-cerrados-de-pequeno-espesor
    titulo: La torsión de los perfiles cerrados de pequeño espesor, con paredes de espesor distinto
    fuente: >-
      Cuestión 3 de teoría · Segunda parte del 19 de enero de 2017 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Volvió a caer con otras palabras
      («Torsión: secciones cerradas de pequeño espesor.») como cuestión 2 de
      la segunda parte del 19 de enero de 2018, que el sitio resuelve en otro
      ejercicio. El examen no publica resolución; el desarrollo es nuestro y
      sigue los apuntes del tema 12, apartado 12.5 (págs. 11 a 14). Los
      números de los pasos de cálculo son un ejemplo nuestro, comprobado con
      el motor del curso y por un segundo camino.
    nivel: examen
    enunciado: |
      (1p) Torsión en perfiles cerrados de pequeño espesor.

      **Notas nuestras.** El enunciado es solo el título del apartado 12.5
      de los apuntes: se pide desarrollarlo.
    pide: >-
      La tensión tangencial y el ángulo de torsión de un perfil cerrado de
      pequeño espesor sometido a un momento torsor, y, en un ejemplo nuestro,
      sus valores.
    pasos:
      - tipo: reconocer
        pregunta: |
          En $\tau = M_t/(2A_tt)$, ¿qué área es $A_t$?
        opciones:
          - texto: >-
              El área encerrada por la línea media de la pared, con el hueco
              incluido
            correcta: true
            mensaje: |
              Eso es (p. 12). Sale de
              $M_t = \tau t\oint r\,ds$ (ec. 12.23): cada $\tfrac{1}{2}r\,ds$
              es el triángulo que el elemento de pared forma con el centro, y
              todos juntos cubren el área encerrada por la línea media. Casi
              toda es hueco.
          - texto: >-
              El área de material de la sección, la de la pared
            mensaje: |
              Esa es la que entra en un axil. En la torsión del perfil
              cerrado, lo que resiste es el brazo de las fuerzas de la pared
              respecto del centro, y eso mide el área que encierra la pared,
              no la que ocupa.
          - texto: >-
              El área encerrada por el contorno exterior
            mensaje: |
              Con pared delgada la diferencia es pequeña, pero la deducción da
              la de la **línea media**: es donde se aplica la fuerza
              $\tau t\,ds$ de cada elemento de pared (fig. 12.9).
          - texto: >-
              El área del hueco, sin la pared
            mensaje: |
              Tampoco: la línea media pasa por el centro de la pared, y el
              área que encierra incluye media pared alrededor del hueco.
      - tipo: calcular
        titulo: La tensión tangencial máxima
        pregunta: |
          Un ejemplo nuestro: un cajón rectangular de 100 × 50 mm medido en la
          línea media, con las paredes de 100 mm de 4 mm de espesor y las de
          50 mm de 2 mm, sometido a $M_t$ = 2 kN·m. ¿Cuánto vale la tensión
          tangencial máxima, en MPa?
        respuesta:
          tipo: numero
          valor: '100.0'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '50'
            mensaje: |
              Es la tensión de las paredes de 4 mm. El flujo $q = \tau t$ es
              el mismo en toda la pared (ec. 12.21): la tensión es mayor donde
              el espesor es menor, en las de 2 mm.
          - valor: '200'
            mensaje: |
              Te falta el 2 de $2A_t$. Viene de que el área del triángulo de
              cada elemento de pared es $\tfrac{1}{2}r\,ds$: $\oint r\,ds = 2A_t$.
          - valor: '500'
            mensaje: |
              Has usado el área de material, 1000 mm², en lugar del área
              encerrada por la línea media, 5000 mm².
          - valor: '1764.7'
            mensaje: |
              Esa es la del mismo cajón **rajado** a lo largo, como perfil
              abierto (apartado 12.4). Cerrado, el hueco trabaja y la tensión
              es diecisiete veces menor.
        pista: |
          $q = M_t/(2A_t)$ es el mismo en toda la pared, y $\tau = q/t$
          (ec. 12.24).
        desarrollo: |
          $A_t = 100\cdot50 = 5000$ mm² y

          $$
          q = \frac{M_t}{2A_t} = \frac{2\cdot10^6\ \text{N·mm}}{2\cdot5000\ \text{mm}^2} = 200\ \text{N/mm},\qquad
          \tau_{\max} = \frac{q}{t_{\min}} = \frac{200\ \text{N/mm}}{2\ \text{mm}} = 100\ \text{MPa}
          $$

          En las paredes de 4 mm, $\tau$ = 50 MPa.
      - tipo: calcular
        titulo: El ángulo de torsión por unidad de longitud
        pregunta: |
          Con $G$ = 80 GPa, ¿cuánto gira el cajón por metro de longitud, en
          grados por metro?
        respuesta:
          tipo: numero
          valor: '1.4324'
          tolerancia: 0.002
          formato: un número, en °/m
        distractores:
          - valor: '5.7296'
            mensaje: |
              Te falta el 4 de $I_t = 4A_t^2/\oint ds/t$ (ec. 12.29): el giro
              sale cuatro veces mayor.
          - valor: '0.025'
            mensaje: |
              Es el giro en radianes por metro. Lo pedido son grados: por
              $180/\pi$.
          - valor: '315.97'
            mensaje: |
              Es el del cajón rajado, como perfil abierto, con
              $I_t = \tfrac{1}{3}\sum s\,t^3$. Cerrado es más de doscientas
              veces más rígido.
        pista: |
          $\varphi_{,x} = M_t/(GI_t)$ con $I_t = 4A_t^2\big/\oint\frac{ds}{t}$
          (ec. 12.29); con paredes rectas de espesor uniforme, la integral es
          un sumatorio.
        desarrollo: |
          $$
          \oint\frac{ds}{t} = 2\cdot\frac{100}{4} + 2\cdot\frac{50}{2} = 100,\qquad
          I_t = \frac{4\cdot5000^2}{100} = 10^6\ \text{mm}^4
          $$

          $$
          \varphi_{,x} = \frac{2\cdot10^6}{80\,000\cdot10^6} = 2{,}5\cdot10^{-5}\ \text{rad/mm} = 0{,}025\ \text{rad/m} = 1{,}4324\ \text{°/m}
          $$
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la respuesta como en el examen: del equilibrio de un trozo de
          pared a la tensión, y de la energía al ángulo de torsión, con lo que
          se sigue para el diseño.
        rubrica:
          - punto: >-
              Se aísla un trozo de pared de longitud dx y, con τ uniforme en el
              espesor, el equilibrio según x da τA tA = τB tB: el flujo
              cortante q = τt es constante en toda la sección (ec. 12.21).
            porque: >-
              Es la base de todo lo demás.
            minimo: true
          - punto: >-
              El momento de la fuerza τt ds de cada elemento respecto de un
              punto es τt r ds, y con q constante,
              Mt = τt ∮ r ds = 2At τ t, con At el área encerrada por la línea
              media (ecs. 12.22 y 12.23).
            porque: >-
              Es donde aparece At.
            minimo: true
          - punto: >-
              Se despeja τ = Mt/(2At t) (ec. 12.24): la tensión máxima está
              donde el espesor es mínimo.
            porque: >-
              Es la fórmula de la tensión y su consecuencia inmediata.
            minimo: true
          - punto: >-
              Igualando el trabajo del torsor, ½Mt dϕ, a la energía de la
              pared, con U0 = τ²/2G (ecs. 12.25 a 12.28), sale
              ϕ,x = Mt/(G It) con It = 4At²/∮ds/t (ec. 12.29), y la integral es
              un sumatorio si la pared está hecha de trozos rectos de espesor
              uniforme.
            porque: >-
              Es la rigidez, la otra mitad del apartado.
            minimo: true
          - punto: >-
              Se comenta que lo que resiste es el hueco, no la cantidad de
              material: por eso las secciones cerradas de pequeño espesor son
              las más adecuadas a torsión (p. 12).
            porque: >-
              Es la conclusión que los apuntes sacan del resultado.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              El equilibrio de un trozo de pared da $\tau_At_A = \tau_Bt_B$: el
              flujo $q = \tau t$ es constante.
          - texto: >-
              $M_t = q\oint r\,ds = 2A_tq$, con $A_t$ el área encerrada por la
              línea media.
          - texto: >-
              $\tau = M_t/(2A_tt)$: máxima donde la pared es más delgada.
          - texto: >-
              De la energía, $\varphi_{,x} = M_t/(GI_t)$ con
              $I_t = 4A_t^2\big/\oint ds/t$.
          - texto: >-
              El flujo $q = \tau t$ es mayor en las paredes más gruesas, que
              son las que más resisten.
            trampa: true
            mensaje: |
              El flujo es el mismo en toda la pared (ec. 12.21): lo que cambia
              con el espesor es la tensión, $\tau = q/t$, que es **menor**
              donde la pared es más gruesa.
    resolucion: |
      **El flujo cortante.** En un perfil cerrado de pared delgada, la
      tensión tangencial es uniforme en el espesor y sigue la línea media.
      Aislando un trozo de pared de longitud $dx$ entre dos puntos A y B, el
      equilibrio según el eje de la pieza da (apuntes del tema 12, apartado
      12.5, p. 11):

      $$
      \tau_At_A = \tau_Bt_B\qquad\text{(ec. 12.21)}
      $$

      El flujo cortante $q = \tau t$ es el mismo en toda la sección.

      **La tensión.** La fuerza del elemento de pared, $\tau t\,ds$, tiene
      momento $\tau t\,r\,ds$ respecto de un punto cualquiera, y como
      $\tfrac{1}{2}r\,ds$ es el triángulo que forma con él (fig. 12.9):

      $$
      M_t = \tau t\oint r\,ds = 2A_t\,\tau t
      \quad\Rightarrow\quad
      \tau = \frac{M_t}{2A_tt}\qquad\text{(ecs. 12.23 y 12.24, p. 12)}
      $$

      $A_t$ es el área encerrada por la línea media. La tensión máxima está
      donde el espesor es mínimo, y lo que más resiste es el hueco, no el
      material: las secciones cerradas de pequeño espesor son las más
      adecuadas a torsión.

      **El ángulo de torsión.** El trabajo del torsor en un elemento de
      longitud $dx$, $\tfrac{1}{2}M_t\,d\varphi$, es igual a la energía de
      deformación acumulada, con $U_0 = \tau^2/2G$ (ecs. 12.25 a 12.28,
      p. 13):

      $$
      \varphi_{,x} = \frac{M_t}{GI_t},\qquad
      I_t = \frac{4A_t^2}{\oint\frac{ds}{t}}\qquad\text{(ec. 12.29, p. 14)}
      $$

      Con paredes rectas de espesor uniforme, la integral es
      $\sum s_i/t_i$.

      **Un ejemplo nuestro.** Un cajón de 100 × 50 mm en la línea media,
      paredes de 100 mm de 4 mm y de 50 mm de 2 mm, $M_t$ = 2 kN·m y
      $G$ = 80 GPa:

      - $A_t = 5000$ mm² y $q = M_t/(2A_t) = 200$ N/mm.
      - $\tau$ = 200/4 = 50 MPa en las paredes gruesas y
        $\tau_{\max}$ = 200/2 = $100$ MPa en las delgadas.
      - $\oint ds/t = 2\cdot25 + 2\cdot25 = 100$, $I_t = 4\cdot5000^2/100 = 10^6$ mm⁴
        y $\varphi_{,x} = 0{,}025$ rad/m $= 1{,}4324$ °/m.

      Rajado a lo largo, el mismo cajón sería un perfil abierto, con
      $I_t = \tfrac{1}{3}\sum s\,t^3 = 4533$ mm⁴: más de
      doscientas veces menos rígido, y con $\tau_{\max}$ de
      $1765$ MPa. El motor del curso da las dos.

  # ── Teoría · cuestión 4 · el desplazamiento del extremo libre en la
  #    compresión excéntrica (tema 14). Cae igual en la final del mismo día.
  - id: exerm1617-2par-4-el-desplazamiento-del-extremo-libre-en-la-compresion-excentrica
    titulo: El desplazamiento del extremo libre de una columna esbelta con compresión excéntrica
    fuente: >-
      Cuestión 4 de teoría · Segunda parte del 19 de enero de 2017 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Cayó igual el mismo día, con el mismo
      número y el mismo punto, en el examen final. Volvió a caer sin
      «: determinar el desplazamiento del extremo libre δy» como cuestión 4
      de las extraordinarias del 14 de junio de 2018 y del 2 de febrero de
      2021, que el sitio resuelve en otro ejercicio. El examen no publica
      resolución; el desarrollo es nuestro y sigue los apuntes del tema 14,
      apartado 14.5 (págs. 9 a 11). Los números de los pasos de cálculo son
      un ejemplo nuestro, comprobado con el motor del curso y por un segundo
      camino.
    nivel: examen
    enunciado: |
      (1p) Compresión excéntrica de columnas esbeltas: determinar el
      desplazamiento del extremo libre $\delta_y$.

      **Notas nuestras.** Es la columna de los apuntes: empotrada en la base,
      libre arriba y comprimida por $P$ con la excentricidad $e_y$.
    pide: >-
      La deducción del desplazamiento del extremo libre de una columna
      esbelta con la carga excéntrica, y, en un ejemplo nuestro, su valor y
      la tensión máxima.
    pasos:
      - tipo: reconocer
        pregunta: |
          La ecuación de la elástica tiene dos constantes, y además $\delta_y$
          es desconocido. ¿Qué tres condiciones las fijan?
        opciones:
          - texto: >-
              $v = 0$ y $v_{,x} = 0$ en la base, y $v = \delta_y$ en el
              extremo libre
            correcta: true
            mensaje: |
              Eso es (ec. 14.16, p. 10). El empotramiento da dos, y la
              tercera dice que el $\delta_y$ que se metió en el flector es el
              desplazamiento que de verdad sale en lo alto: es la que cierra
              el problema.
          - texto: >-
              $v = 0$ y $v_{,x} = 0$ en la base, y flector nulo en el extremo
              libre
            mensaje: |
              El extremo libre de esta columna no tiene flector nulo: la carga
              está a $e_y$ del eje, y en lo alto, con $v = \delta_y$ en la
              ec. 14.13, $M = -Pe_y$. La tercera condición es geométrica: el
              desplazamiento de lo alto es $\delta_y$.
          - texto: >-
              $v = 0$ en la base y en el extremo libre, y $v_{,x} = 0$ en la
              base
            mensaje: |
              El extremo libre se desplaza: eso es $\delta_y$, lo que pide el
              enunciado. Con $v(L) = 0$ no habría nada que calcular.
          - texto: >-
              $v = 0$ en la base y $v_{,x} = 0$ en los dos extremos
            mensaje: |
              En el extremo libre nada impide el giro. Las dos condiciones de
              la base son las del empotramiento, y la tercera es la del
              desplazamiento de lo alto.
      - tipo: calcular
        titulo: El desplazamiento del extremo libre
        pregunta: |
          Un ejemplo nuestro: una columna de acero empotrada en la base y libre
          arriba, de $L$ = 1,5 m y sección circular maciza de 80 mm de
          diámetro, con $E$ = 210 GPa, comprimida por $P$ = 60 kN a
          $e_y$ = 20 mm del eje. ¿Cuánto vale $\delta_y$, en mm?
        respuesta:
          tipo: numero
          valor: '3.687'
          tolerancia: 0.01
          formato: un número, en mm
        distractores:
          - valor: '23.69'
            mensaje: |
              Es $e_y\sec(\alpha_zL)$, que es $e_y + \delta_y$: la distancia de
              la carga a la base deformada, no lo que se mueve el extremo. Hay
              que restarle $e_y$.
          - valor: '3.197'
            mensaje: |
              Es la flecha de primer orden, la de una ménsula con el par
              $Pe_y$ en la punta, $Pe_yL^2/(2EI_z)$. No cuenta que el brazo
              crece con la propia flecha.
          - valor: '26.96'
            mensaje: |
              Has puesto $2L$ en $\alpha_zL$. $2L$ es la longitud de pandeo
              de la columna empotrada-libre, la de la carga crítica; en la
              ec. 14.17 va la longitud de la columna.
        pista: |
          $\alpha_z^2 = P/(EI_z)$ y
          $\delta_y = e_y\,\dfrac{1 - \cos(\alpha_zL)}{\cos(\alpha_zL)}$
          (ec. 14.17).
        desarrollo: |
          $I_z = \tfrac{\pi}{64}\,80^4 = 2\,010\,619$ mm⁴ y

          $$
          \alpha_zL = \sqrt{\frac{60\,000}{210\,000\cdot2\,010\,619}}\cdot1500 = 0{,}5654,\qquad
          \delta_y = 20\cdot\frac{1 - \cos 0{,}5654}{\cos 0{,}5654} = 3{,}687\ \text{mm}
          $$
      - tipo: calcular
        titulo: La tensión máxima
        pregunta: |
          ¿Cuánto vale la tensión de compresión máxima de la columna, en MPa?
        respuesta:
          tipo: numero
          valor: '40.21'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '35.81'
            mensaje: |
              Es la flexión compuesta del tema 9, con el flector $Pe_y$: no
              cuenta la flecha. En la base el brazo es $e_y + \delta_y$, y el
              flector, $Pe_y\sec(\alpha_zL)$ (ec. 14.20).
          - valor: '28.27'
            mensaje: |
              Es solo la del flector. La carga comprime además toda la
              sección: falta $P/A$.
          - valor: '16.34'
            mensaje: |
              Has tomado el brazo $\delta_y$, sin $e_y$. El flector de la base
              es $P(e_y + \delta_y)$.
        pista: |
          La tensión máxima está en la base, con
          $|M_{\max}| = Pe_y\sec(\alpha_zL)$ (ec. 14.20):
          $\sigma = P/A + |M_{\max}|/W$.
        desarrollo: |
          $$
          |M_{\max}| = P(e_y + \delta_y) = 1{,}421\ \text{kN·m},\qquad
          \sigma = \frac{P}{A} + \frac{|M_{\max}|}{W} = 11{,}94 + 28{,}27 = 40{,}21\ \text{MPa}
          $$
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la respuesta como en el examen: el flector en la
          configuración deformada, la ecuación diferencial, las condiciones de
          contorno y δy, con lo que se sigue de ahí.
        rubrica:
          - punto: >-
              Se explica por qué hace falta la configuración deformada: en una
              columna esbelta el extremo libre se desplaza del orden de la
              excentricidad.
            porque: >-
              Es lo que separa este análisis de la flexión compuesta del
              tema 9 (p. 9).
          - punto: >-
              Con el corte a una distancia x, el flector es
              M = Pv − P(ey + δy) (ec. 14.13), y con la ecuación de la
              elástica, v,xx + αz² v = αz²(ey + δy), con αz² = P/EIz
              (ec. 14.14).
            porque: >-
              Es la ecuación que hay que resolver.
            minimo: true
          - punto: >-
              Solución general v = C1 sin αz x + C2 cos αz x + (ey + δy)
              (ec. 14.15) y condiciones v(0) = 0, v,x(0) = 0 y v(L) = δy
              (ec. 14.16).
            porque: >-
              Son tres ecuaciones para C1, C2 y δy.
            minimo: true
          - punto: >-
              Resultado: C1 = 0, C2 = −(ey + δy) y
              δy = ey [1 − cos(αz L)]/cos(αz L) (ec. 14.17).
            porque: >-
              Es lo que pide el enunciado.
            minimo: true
          - punto: >-
              Se comenta lo que se sigue: el flector máximo está en el
              empotramiento, Mmax = −Pey sec(αz L) (ec. 14.20), y δy y M
              tienden a infinito cuando αz L → π/2, que es la carga crítica de
              la columna empotrada-libre, π²EIz/(2L)² (ec. 14.21).
            porque: >-
              Conecta la compresión excéntrica con el pandeo.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              En la configuración deformada, $M = Pv - P(e_y + \delta_y)$.
          - texto: >-
              Con la elástica,
              $v_{,xx} + \alpha_z^2v = \alpha_z^2(e_y + \delta_y)$.
          - texto: >-
              Con $v(0) = 0$, $v_{,x}(0) = 0$ y $v(L) = \delta_y$:
              $\delta_y = e_y[1 - \cos(\alpha_zL)]/\cos(\alpha_zL)$.
          - texto: >-
              $\delta_y$ crece sin límite cuando $\alpha_zL \to \pi/2$, la
              carga crítica de la columna empotrada-libre.
          - texto: >-
              El flector máximo está en el extremo libre, donde actúa la carga.
            trampa: true
            mensaje: |
              En el extremo libre el flector es $-Pe_y$. En la base el brazo
              es $e_y + \delta_y$, y $|M| = Pe_y\sec(\alpha_zL)$ es el máximo
              (ecs. 14.19 y 14.20).
    resolucion: |
      **Por qué la configuración deformada.** En una columna esbelta empotrada
      en la base y libre arriba, comprimida por $P$ con excentricidad $e_y$,
      el extremo libre se desplaza del orden de la excentricidad: el brazo de
      la carga crece con la flecha, y el equilibrio se plantea en la columna
      deformada, como en la carga crítica (apuntes del tema 14, apartado
      14.5, p. 9).

      **La ecuación.** Con $v$ el desplazamiento de la directriz y $\delta_y$
      el del extremo libre, el flector en una sección a distancia $x$ de la
      base es

      $$
      M = Pv - P(e_y + \delta_y)\qquad\text{(ec. 14.13)}
      $$

      y con la ecuación de la elástica, con $\alpha_z^2 = P/(EI_z)$ (p. 10):

      $$
      \frac{d^2v}{dx^2} + \alpha_z^2v = \alpha_z^2(e_y + \delta_y)\qquad\text{(ec. 14.14)}
      $$

      **La solución.**
      $v = C_1\sin(\alpha_zx) + C_2\cos(\alpha_zx) + (e_y + \delta_y)$
      (ec. 14.15), con las condiciones (ec. 14.16):

      $$
      x = 0:\ v = 0,\quad v_{,x} = 0;\qquad x = L:\ v = \delta_y
      $$

      La segunda da $C_1 = 0$; la primera, $C_2 = -(e_y + \delta_y)$; y la
      tercera, $\delta_y = (e_y + \delta_y)[1 - \cos(\alpha_zL)]$, de donde

      $$
      \delta_y = e_y\,\frac{1 - \cos(\alpha_zL)}{\cos(\alpha_zL)}\qquad\text{(ec. 14.17)}
      $$

      **Lo que se sigue.** La elástica es
      $v = e_y[1 - \cos(\alpha_zx)]/\cos(\alpha_zL)$ (ec. 14.18) y el flector,
      $M = -Pe_y\cos(\alpha_zx)/\cos(\alpha_zL)$ (ec. 14.19), máximo en el
      empotramiento: $M_{\max} = -Pe_y\sec(\alpha_zL)$ (ec. 14.20, p. 11).
      La secante multiplica el flector de la flexión compuesta, y cuando
      $\alpha_zL \to \pi/2$ el desplazamiento y el flector tienden a
      infinito: es la carga crítica de la columna empotrada-libre,
      $P = \pi^2EI_z/(2L)^2$ (ec. 14.21).

      **Un ejemplo nuestro.** Acero, $L$ = 1,5 m, sección circular maciza de
      80 mm, $E$ = 210 GPa, $P$ = 60 kN, $e_y$ = 20 mm:
      $I_z = 2\,010\,619$ mm⁴, $\alpha_zL = 0{,}5654$ y

      $$
      \delta_y = 3{,}687\ \text{mm},\qquad
      |M_{\max}| = P(e_y + \delta_y) = 1{,}421\ \text{kN·m},\qquad
      \sigma_{\max} = 11{,}94 + 28{,}27 = 40{,}21\ \text{MPa}
      $$

      $P$ es el 13 % de la carga crítica,
      463 kN, y aun así el flector de la base es un
      18 % mayor que el de la flexión compuesta. El motor del
      curso, con la elástica de la ec. 14.18, da lo mismo.
  # ── Ejercicio 1 · la viga Gerber con P en el voladizo y q0 en DF (tema 10,
  #    con el 7). La final lo repite como ejercicio 2 con una palabra menos.
  - id: exerm1617-2par-5-la-viga-gerber-con-p-en-el-voladizo-y-q0-en-df
    titulo: La viga Gerber con P en el voladizo y q0 en el tramo colgado, integrando la elástica
    fuente: >-
      Ejercicio 1 · Segunda parte del 19 de enero de 2017 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 2 puntos. El examen final del mismo día lo repite como ejercicio
      2, con 1,5 puntos, «de» donde aquí va «de de» y una coma antes de «por
      separado», y allí se resuelve por la viga conjugada; aquí, integrando
      la elástica tramo a tramo. El examen no publica resolución; el
      desarrollo es nuestro, con los temas 7 y 10, y las cifras salen del
      motor del curso y de un segundo camino.
    nivel: examen
    enunciado: |
      La viga de la figura está apoyada en B C y F y las partes ABCD y DF
      están unidas por una rótula en D. Determinar:

      a/ Diagramas de fuerzas cortantes y de momentos flectores que
      corresponden a la fuerza concentrada $P$ y a la fuerza distribuida
      $q_0$ por separado.

      b/ Relación entre $P$ y $q_0$ para que el desplazamiento vertical de de
      la rótula D sea nulo.

