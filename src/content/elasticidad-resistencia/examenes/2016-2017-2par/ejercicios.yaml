      <figcaption>

      Redibujada del enunciado, a escala.

      </figcaption>
      </figure>

      **Notas nuestras.** $P$ es vertical, hacia arriba, en A, y $q_0$
      actúa hacia abajo en todo DF. B es un apoyo fijo, y C y F, apoyos
      móviles. El enunciado no da la rigidez: se toma $EI$ constante en toda
      la viga. Se conserva «de de».
    pide: >-
      Los diagramas de cortantes y de flectores con P sola y con q0 sola, y
      la relación entre P y q0 que deja la rótula D sin desplazamiento
      vertical.
    pasos:
      - tipo: reconocer
        pregunta: |
          Hay cuatro reacciones: dos en B, una en C y una en F. ¿Cómo se
          calculan?
        opciones:
          - texto: >-
              Empezando por DF, que entre la rótula y F es una viga biapoyada;
              su reacción en D pasa a ABCD como una carga
            correcta: true
            mensaje: |
              Eso es. La rótula da la cuarta ecuación, $M_D = 0$, y la forma
              más corta de usarla es separar la viga por D: DF se sostiene
              sola en D y en F, y ABCD recibe en D lo que DF le pasa.
          - texto: >-
              Con las tres ecuaciones de la estática de la viga entera
            mensaje: |
              Tres ecuaciones no dan cuatro reacciones. Falta la de la rótula:
              el flector en D es nulo.
          - texto: >-
              No se puede solo con la estática: hace falta una ecuación de
              compatibilidad
            mensaje: |
              Cuatro reacciones y cuatro ecuaciones (tres de equilibrio y
              $M_D = 0$): la viga es isostática. La compatibilidad solo hace
              falta en el apartado b, para la flecha.
          - texto: >-
              Empezando por ABCD, que tiene dos apoyos
            mensaje: |
              ABCD tiene B y C, pero en D recibe una fuerza que todavía no se
              conoce: la de DF. Hay que empezar por la parte que se sostiene
              sola.
      - tipo: calcular
        titulo: La reacción en B con P sola
        pregunta: |
          Con $P$ sola, ¿cuánto vale la reacción en B, en unidades de $P$,
          positiva hacia arriba?
        respuesta:
          tipo: numero
          valor: '-2.000'
          tolerancia: 0.005
          formato: un número, en unidades de P
        distractores:
          - valor: '2'
            mensaje: |
              El módulo es ese. $P$ hacia arriba en A levanta el voladizo, y la
              viga gira alrededor de C: B tiene que tirar hacia abajo.
          - valor: '-1'
            mensaje: |
              Has tomado momentos con brazos iguales. Respecto de C, $P$ está
              a $2L$ y B a $L$: $R_B = -2P$.
        pista: |
          Con $P$ sola, DF no trabaja. Momentos respecto de C en ABCD.
        desarrollo: |
          $$
          \textstyle\sum M_C = 0:\quad P\cdot2L + R_B\cdot L = 0
          \quad\Rightarrow\quad R_B = -2P,\qquad R_C = 1P
          $$
      - tipo: calcular
        titulo: El flector en B con P sola
        pregunta: |
          ¿Cuánto vale el flector en B con $P$ sola, en unidades de $PL$,
          positivo con las fibras de abajo estiradas?
        respuesta:
          tipo: numero
          valor: '1.000'
          tolerancia: 0.005
          formato: un número, en unidades de P·L
        distractores:
          - valor: '-1'
            mensaje: |
              El módulo es ese. $P$ hacia arriba en el extremo del voladizo lo
              curva hacia arriba: las fibras de abajo se estiran, y el flector
              es positivo.
          - valor: '2'
            mensaje: |
              $2PL$ sería el momento de $P$ respecto de C. En B el brazo es
              $L$.
        pista: |
          El flector en B es el momento de lo que hay a su izquierda: $P$ a
          una distancia $L$.
        desarrollo: |
          $$
          M_B = P\cdot L = 1\,PL
          $$
      - tipo: calcular
        titulo: El flector en C con q0 sola
        pregunta: |
          Con $q_0$ sola, ¿cuánto vale el flector en C, en unidades de $q_0L^2$?
        respuesta:
          tipo: numero
          valor: '-1.000'
          tolerancia: 0.005
          formato: un número, en unidades de q0·L²
        distractores:
          - valor: '-2'
            mensaje: |
              Has llevado a D toda la carga de DF, $2q_0L$. DF es biapoyada:
              a D le pasa la mitad.
          - valor: '1'
            mensaje: |
              El módulo es ese, pero la fuerza $q_0L$ hacia abajo en el
              extremo del voladizo CD estira las fibras de arriba: es negativo.
        pista: |
          $R_D = q_0L$ baja por la rótula. El flector en C es el momento de
          esa fuerza con el brazo CD.
        desarrollo: |
          $$
          M_C = -q_0L\cdot L = -1\,q_0L^2
          $$

          Y las reacciones de ABCD: $R_B = -1\,q_0L$ y
          $R_C = 2\,q_0L$.
      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de cortantes y de flectores**, con $P$ sola
          y con $q_0$ sola, con sus valores en A, B, C, D, F y en el centro de
          DF.
        comprueba:
          - punto: |
              **$P$ sola**: $T = P$ en AB, $-P$ en BC y nula en CD y DF; $M$
              en recta de 0 en A a $PL$ en B, de vuelta a 0 en C, y nulo
              después.
            porque: |
              Con $R_B = -2P$ y $R_C = P$, a la derecha de C no queda nada
              cargado.
          - punto: |
              **$q_0$ sola, cortantes**: nula en AB, $-q_0L$ en BC, $q_0L$ en
              CD, y en DF una recta de $q_0L$ a $-q_0L$ que se anula en el
              centro.
            porque: |
              $R_B = -q_0L$ y $R_C = 2q_0L$; la cortante pasa por la rótula
              sin salto, porque en D no hay fuerza exterior.
          - punto: |
              **$q_0$ sola, flectores**: nulo en AB, recta de 0 en B a
              $-q_0L^2$ en C, recta de vuelta a 0 en la rótula D, y en DF una
              parábola con $\tfrac{1}{2}q_0L^2$ en el centro.
            porque: |
              En la rótula el flector es nulo, y DF es una biapoyada con carga
              uniforme: $q_0(2L)^2/8$.
        figura: |
          <svg viewBox="0 0 450 372" role="img" width="450" height="372" aria-labelledby="exerm1617-2par-5-la-viga-gerber-con-p-en-el-voladizo-y-q0-en-df-dib-t exerm1617-2par-5-la-viga-gerber-con-p-en-el-voladizo-y-q0-en-df-dib-d">
