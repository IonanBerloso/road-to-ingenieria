      $$
      EI_z\theta_A = \int_0^b(-Xy)(-1)\,dy + \int_0^b M_{BC}\left(\frac{s}{b} - 1\right)ds
      = \frac{Xb^2}{2} + \left(\frac{Xb^2}{3} - \frac{q_0b^3}{24}\right)
      = \frac{q_0b^3}{48} - \frac{q_0b^3}{36}
      $$

      $$
      \theta_A = -\frac{q_0b^3}{144\,EI_z} = -0{,}00694\,\frac{q_0b^3}{EI_z}\quad\text{(horario)}
      $$

      El motor del curso resuelve el hiperestático con la ec. 13.52 y el giro
