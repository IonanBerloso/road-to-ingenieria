      <figcaption>

      Redibujada del enunciado, a escala.

      </figcaption>
      </figure>

      **Notas nuestras.** El PDF pierde las flechas de $q_0$ y
      el apoyo de A, que se leen en el Word: $q_0$ actúa hacia abajo en toda
      la viga BC, y A es una articulación sobre el suelo. Las tres barras
      miden $b$ y tienen la misma $EI_z$.
    pide: >-
      Las reacciones en A y en D y el giro de la articulación A.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuál es el grado de hiperestatismo del pórtico?
        opciones:
          - texto: >-
              1: cinco reacciones, dos en A y tres en D, y cuatro ecuaciones,
              las tres de equilibrio y el flector nulo en la rótula C
            correcta: true
            mensaje: |
              Eso es. Sobra una reacción: se toma como incógnita
              hiperestática $X$ —aquí, la horizontal de A— y la condición es
              $\partial C/\partial X = 0$ (ec. 13.52, p. 19), porque A no se
              mueve en horizontal.
          - texto: >-
              2: cinco reacciones y tres ecuaciones de equilibrio
            mensaje: |
              Falta la ecuación de la rótula: en C el flector es nulo, y eso
              es una ecuación más. La rótula quita un grado.
          - texto: >-
              0: la rótula C lo hace isostático
            mensaje: |
              La rótula quita uno, pero había dos de más: con la rótula queda
              uno. El propio enunciado lo llama hiperestático.
          - texto: >-
              3: es un marco cerrado por el suelo
            mensaje: |
              El marco no está cerrado: A es una articulación, no un
              empotramiento, y C es una rótula. Cinco reacciones menos cuatro
              ecuaciones: 1.
      - tipo: calcular
        titulo: La reacción horizontal en A
        pregunta: |
          Con la horizontal de A como incógnita $X$, ¿cuánto vale, en unidades
          de $q_0b$, positiva hacia la derecha?
        respuesta:
          tipo: numero
          valor: '0.0417'
          tolerancia: 0.0005
          formato: un número, en unidades de q0·b
        distractores:
          - valor: '0.0625'
            mensaje: |
              Te falta la energía de uno de los dos pilares. $X$ flecta los
              tres tramos: AB, BC y CD, cada uno con
              $\int(\partial M/\partial X)^2 = b^3/3$.
          - valor: '0.1250'
            mensaje: |
              Solo has contado BC. $X$ también flecta los dos pilares.
          - valor: '0'
            mensaje: |
              Es la isostática base, sin la incógnita. La condición
              $\partial C/\partial X = 0$ obliga a que A no se mueva en
              horizontal, y eso pide un $X$ no nulo.
        pista: |
          Flectores con $X$, positivos con la fibra de dentro estirada: $-Xy$
          en AB, $-Xb + (X + \tfrac{1}{2}q_0b)s - \tfrac{1}{2}q_0s^2$ en BC y
          $Xt$ en CD, con $y$, $s$ y $t$ desde A, B y C.
        desarrollo: |
          $$
          EI_z\frac{\partial C}{\partial X} = \frac{Xb^3}{3} + \left(\frac{Xb^3}{3} - \frac{q_0b^4}{24}\right) + \frac{Xb^3}{3} = 0
          \quad\Rightarrow\quad X = \frac{q_0b}{24} = 0{,}0417\,q_0b
          $$
      - tipo: calcular
        titulo: La reacción vertical en A
        pregunta: |
          ¿Cuánto vale la reacción vertical de A, en unidades de $q_0b$,
          positiva hacia arriba?
        respuesta:
          tipo: numero
          valor: '0.5417'
          tolerancia: 0.0005
          formato: un número, en unidades de q0·b
        distractores:
          - valor: '0.5'
            mensaje: |
              Es la de la isostática base: la mitad de la carga. La horizontal
              $X$ también tiene momento respecto de la rótula C.
          - valor: '0.4583'
            mensaje: |
              Esa es la de D. Con el flector nulo en C, en ABC:
              $V_Ab - Xb - \tfrac{1}{2}q_0b^2 = 0$, y $V_A = X + \tfrac{1}{2}q_0b$.
        pista: |
          Flector nulo en la rótula, tomando momentos en C de lo que hay a su
          izquierda.
        desarrollo: |
          $$
          V_A = X + \tfrac{1}{2}q_0b = \left(\tfrac{1}{24} + \tfrac{1}{2}\right)q_0b = \tfrac{13}{24}\,q_0b = 0{,}5417\,q_0b
          $$
      - tipo: calcular
        titulo: El momento de empotramiento en D
        pregunta: |
          ¿Cuánto vale, en valor absoluto, el momento de empotramiento en D,
          en unidades de $q_0b^2$?
        respuesta:
          tipo: numero
          valor: '0.0417'
          tolerancia: 0.0005
          formato: un número, en unidades de q0·b²
        distractores:
          - valor: '0.125'
            mensaje: |
              Es $q_0b^2/8$, el flector máximo de una biapoyada de luz $b$. En
              D el flector lo da la horizontal: el pilar CD tiene flector nulo
              en la rótula y solo $H_D$ lo flecta, $H_Db$.
          - valor: '0.0625'
            mensaje: |
              Es $H_Db$ con la $X$ que sale al olvidar un pilar. Con los tres
              tramos, $X = q_0b/24$.
        pista: |
          En CD, el flector es nulo en C y solo lo flecta $H_D = -X$.
        desarrollo: |
          $$
          |M_D| = |H_D|\,b = \frac{q_0b^2}{24} = 0{,}0417\,q_0b^2
          $$

          En sentido antihorario, con la fibra interior de CD estirada en D.
      - tipo: calcular
        titulo: El giro de A
        pregunta: |
          Apartado b. ¿Cuánto gira A, en unidades de $q_0b^3/EI_z$, positivo
          en sentido antihorario?
        respuesta:
          tipo: numero
          valor: '-0.00694'
          tolerancia: 0.00005
          formato: un número, en unidades de q0·b³/EIz
        distractores:
          - valor: '0.00694'
            mensaje: |
              El módulo es ese. Sale negativo: A gira en sentido horario,
              como cae la viga BC hacia dentro.
          - valor: '-0.02778'
            mensaje: |
              Te falta el pilar AB. El par unidad en A flecta AB entero,
              $M' = -1$, y ahí el flector real, $-Xy$, da $+Xb^2/2$.
          - valor: '-0.04167'
            mensaje: |
              Has usado el flector de la isostática base, sin $X$. El par
              unidad puede ir sobre la base, pero el flector real tiene que
              ser el de la estructura resuelta, con $X = q_0b/24$.
        pista: |
          Un par unidad en A sobre la isostática base (A apoyo móvil vertical)
          da $M' = -1$ en AB, $M' = s/b - 1$ en BC y 0 en CD. Después,
          $\theta_A = \int MM'\,dl/EI_z$.
        desarrollo: |
          $$
          EI_z\theta_A = \int_0^b(-Xy)(-1)\,dy + \int_0^b M_{BC}\left(\frac{s}{b} - 1\right)ds
          = \frac{q_0b^3}{48} - \frac{q_0b^3}{36} = -\frac{q_0b^3}{144}
          $$

          $\theta_A = -0{,}00694\,q_0b^3/EI_z$, horario.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Grado 1: se toma $X = H_A$ y la base con A como apoyo móvil
              vertical.
          - texto: >-
              $\partial C/\partial X = 0$ con la energía de flexión de AB, BC y
              CD da $X = q_0b/24$.
          - texto: >-
              Con $X$, el equilibrio y la rótula dan
              $V_A = \tfrac{13}{24}q_0b$, $V_D = \tfrac{11}{24}q_0b$,
              $H_D = -q_0b/24$ y $|M_D| = q_0b^2/24$.
          - texto: >-
              Un par unidad en A sobre la base da $M'$, y
              $\theta_A = \int MM'/EI_z = -q_0b^3/(144EI_z)$.
          - texto: >-
              Para el giro de A hay que resolver de nuevo el hiperestático con
              el par unidad.
            trampa: true
            mensaje: |
              No hace falta. El giro es $\partial C/\partial M_A$, y como
              $\partial C/\partial X = 0$, da lo mismo tratar $X$ como
              constante: el par unidad va sobre la isostática base. Lo que
              tiene que ser el de la estructura resuelta es el flector real
              $M$.
    resolucion: |
      **El grado de hiperestatismo.** Cinco reacciones (dos en A, tres en D)
      y cuatro ecuaciones (tres de equilibrio y $M_C = 0$): grado 1. Se toma
      como incógnita hiperestática la horizontal de A, $X$, positiva hacia la
      derecha, y la isostática base es el pórtico con A como apoyo móvil
      vertical. Como A no se mueve en horizontal,
      $\partial C/\partial X = 0$ (apuntes del tema 13, ec. 13.52, p. 19).

      **Las reacciones en función de $X$.** Con la rótula, momentos en C de
      ABC: $V_A = X + \tfrac{1}{2}q_0b$. El resto, del equilibrio:
      $H_D = -X$, $V_D = \tfrac{1}{2}q_0b - X$, y en CD, momentos en C:
      $M_D = Xb$, antihorario.

      **Los flectores** (positivos con la fibra interior del pórtico
      estirada; $y$, $s$ y $t$ medidos desde A, B y C):

      $$
      M_{AB} = -Xy,\qquad
      M_{BC} = -Xb + \left(X + \tfrac{1}{2}q_0b\right)s - \tfrac{1}{2}q_0s^2,\qquad
      M_{CD} = Xt
      $$

      con $\partial M/\partial X$ = $-y$, $s - b$ y $t$.

      **a/ La incógnita y las reacciones.** Solo con la energía de flexión
      (ec. 13.52):

      $$
      EI_z\frac{\partial C}{\partial X} = \int_0^b Xy^2\,dy + \int_0^b M_{BC}(s - b)\,ds + \int_0^b Xt^2\,dt
      = Xb^3 - \frac{q_0b^4}{24} = 0
      \quad\Rightarrow\quad X = \frac{q_0b}{24}
      $$

      $$
      H_A = \tfrac{1}{24}q_0b\ (\rightarrow),\quad V_A = \tfrac{13}{24}q_0b\ (\uparrow),\quad
      H_D = \tfrac{1}{24}q_0b\ (\leftarrow),\quad V_D = \tfrac{11}{24}q_0b\ (\uparrow),\quad
