# La segunda parte de Elasticidad y Resistencia de Materiales del 19 de
# enero de 2017: dos páginas, la 1 de TEORÍA (cuatro cuestiones de 1 punto)
# y la 2 de EJERCICIOS (tres de 2 puntos). Diez puntos en total, y el
# cuadernillo los imprime todos. El mismo día se hizo el examen final, que
# repite cuatro de estas siete preguntas (punto 5). El cuadernillo está solo
# en castellano.
#
# 1. **EL PDF ES LA CONVERSIÓN DEL WORD, Y PIERDE DIBUJO.** Hay Word del
#    examen (17-ERM-ene2.docx) y el texto es el mismo. El PDF pierde lo que
#    el Word dibuja en VML y no es texto: los vectores de m0 y M0 del
#    ejercicio 2 (flechas blancas sobre el eje gris) y las flechas de q0
#    y el apoyo de A del ejercicio 3. Se leen en el VML del Word, con sus
#    coordenadas y sus giros. Las letras griegas (α, δy, τadm) son de la
#    fuente Symbol: el texto del PDF las pierde, aunque se ven en la página.
#
# 2. **LO QUE LA FIGURA DICE Y EL TEXTO NO.**
#    - Cuestión 2: T actúa en lo alto del poste, en el borde exterior del
#      lado derecho, hacia abajo y hacia fuera, en un plano que contiene el
#      eje.
#    - Ejercicio 1: P es vertical, hacia arriba, en A, y q0 actúa hacia
#      abajo en todo DF; B es un apoyo fijo, C y F, móviles. La rigidez no se
#      da: EI constante.
#    - Ejercicio 2: los vectores de m0 apuntan hacia A y el de M0,
#      hacia D, sentidos contrarios; A y D, empotrados.
#    - Ejercicio 3: q0 hacia abajo en toda BC; A, articulación sobre el
#      suelo; las tres barras de longitud b.
#    Cada lectura va también en la nota de su enunciado.
#
# 3. **ERRATAS Y GRAFÍAS DEL TEXTO, CONSERVADAS**: «alumnio» (cuestión 2),
#    «de de» (ejercicio 1), «apoyada en B C y F» sin coma (ejercicio 1),
#    «28º» con el ordinal, y la cabecera de la página 2, «EJERCICICIOS»,
#    que no se copia.
#
# 4. **DOS NUMERACIONES EN UN CUADERNILLO.** La teoría va de la 1 a la 4 y
#    los ejercicios vuelven a empezar en 1. Aquí la teoría son **n 1 a 4** y
#    los ejercicios **n 5, 6 y 7**; la `fuente` de cada ejercicio dice el
#    nombre impreso. Ninguna pregunta se parte.
#
# 5. **PREGUNTAS REPETIDAS.**
#    - La **cuestión 1**, «1. (1p) Teorema del flujo cortante.», es palabra
#      por palabra la cuestión 3 de la final de enero de 2021, ya en el
#      sitio (`exerm2021-ord-3-el-teorema-del-flujo-cortante`), con el
#      mismo punto. Se apunta a ella, como ya hacen 2017-2018 y siguientes.
#    - La **cuestión 3**, «Torsión en perfiles cerrados de pequeño
#      espesor.», volvió a caer con otras palabras («Torsión: secciones
#      cerradas de pequeño espesor.») en la segunda parte de 2018: va propia,
#      resuelta con otro ejemplo (paredes de espesor distinto).
#    - La **cuestión 4** volvió a caer sin «: determinar el desplazamiento
#      del extremo libre δy» en las extraordinarias de junio de 2018 y de
#      febrero de 2021 (`exerm2021-ext-4-…`): va propia, centrada en δy.
#    - La **cuestión 4** y los **ejercicios 2 y 3** cayeron igual el mismo
#      día en el examen final: la cuestión con el mismo número y el mismo
#      punto, y los ejercicios como 3 y 4, con 1,5 puntos. Se resuelven aquí
#      y la final apunta a ellos. Los dos ejercicios se transcriben sin su
#      «(2p)»: cada hoja pone sus puntos desde `puntosImpresos`, y la
#      `fuente` dice los dos valores.
#    - El **ejercicio 1** también cayó en la final, como ejercicio 2, pero
#      con «de» en lugar de «de de» y una coma antes de «por separado»: la
#      final lo lleva como ejercicio propio, resuelto por otro camino (la
#      viga conjugada; aquí, la elástica integrada tramo a tramo).
#    Son cuatro las preguntas compartidas con la final, no cinco.
#
# 6. **LOS TEMAS.** La cuestión 2 es flexión compuesta (tema 9). El
#    ejercicio 1 va al tema 10, con los diagramas del 7; el 3, al 13.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso y de un segundo camino (fase-p/p9n,
# guiones/cifras.mjs). Las cuestiones 3 y 4 no traen números: los pasos de
# cálculo son un ejemplo nuestro, y lo dicen.
