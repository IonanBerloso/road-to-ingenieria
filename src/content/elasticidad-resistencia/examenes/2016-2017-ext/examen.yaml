curso: '2016-2017'
convocatoria: extraordinaria
fecha: 16 de junio de 2017
# La convocatoria extraordinaria de Elasticidad y Resistencia de Materiales
# de 2016-2017, del 16 de junio de 2017 («Examen Final 16/06/2017»;
# «Azterketa finala 2017/06/16» en euskera): tres páginas, castellano a la
# izquierda y euskera a la derecha, de la Escuela de Ingeniería de
# Gipuzkoa. Cuatro cuestiones de teoría de 1 punto y cuatro problemas de
# 1,5 puntos: diez puntos, y el cuadernillo los imprime todos. Las tres
# páginas llevan la cabecera «TEORÍA/ TEORIA», también las de los
# problemas, que no tienen título propio.
#
# Se transcribe la columna en castellano, tal cual, con sus puntos
# impresos. Lo que hay que saber de ese texto, dicho antes de que nadie lo
# deduzca:
#
# 1. **HAY OTRA VERSIÓN DEL EXAMEN DEL MISMO DÍA.** Se publica la bilingüe
#    (17-ERM-EME-junfin_ekafin.pdf). La otra, solo en castellano
#    (17-ERM-junfin.pdf, con las cabeceras «TEORÍA» y «EJERCICICIOS»), no se
#    publica ni se transcribe. Trae las mismas ocho preguntas, con estos
#    cambios:
#    - Cuestión 3: «el valor de F», sin «de la fuerza».
#    - Cuestión 4: pide además deducir la expresión de la carga crítica de la
#      columna biarticulada, y no imprime la fórmula.
#    - Problema 1: no da las fuerzas. Da las deformaciones de dos galgas,
#      el material y $\sigma_{lim}$ = 250 MPa, y pide las fuerzas, la
#      deformación de la tercera galga y el factor de seguridad según Von
#      Mises. Su figura no lleva las cotas de 100, 500 y 200 mm.
#    - Problema 3: añade un apartado, dibujar el proceso de deformación de la
#      estructura, antes del desplazamiento de F.
#    - Problema 4: «compresión..», con el punto repetido.
#    La bilingüe no da el material del problema 1: se toma el de la otra
#    ($E$ = 70 GPa, $\nu$ = 0,3), y lo dicen las notas del ejercicio.
#
# 2. **EL PDF FRENTE AL WORD.** El PDF es la conversión del Word
#    (17-ERM-EME-junfin_ekafin.docx), y pierde parte de lo dibujado en las
#    figuras de los problemas 2, 3 y 4: en el 2, las flechas de $q_0$ (queda
#    el rótulo) y las líneas de las cotas (quedan las tres L); en el 3, las
#    flechas de las cargas (quedan P, P y 2P), los números de las barras (la
#    capa de texto los guarda, pero no se ven), los triángulos de los apoyos
#    y la línea de la cota horizontal (queda la b); en el 4, las flechas de
#    $q_0$, los triángulos de los apoyos y la línea de la cota horizontal.
#    Las figuras de las cuestiones 3 y 4 y la del problema 1 salen enteras.
#    Todas se han redibujado del Word, y los pies lo dicen. Además:
#    - Problema 1: en el Word, el rótulo de $F_y$ sale «Fyy» en las dos
#      vistas (el subíndice, repetido); en el PDF, la segunda y cae suelta
#      debajo. Se lee $F_y$.
#    - Problema 3: el Word y la capa de texto del PDF dicen «3.3.-(1,5p)»; en
#      la página solo se ve «3.-(1,5p)», con el 3 cortado por el margen. Se
#      transcribe «3.-(1,5p)».
#
# 3. **LECTURAS.**
#    - Cuestión 3: ejes nuestros, $x$ de A hacia D, $y$ hacia arriba y $z$
#      hacia quien mira. ABD es horizontal; BC, que la perspectiva dibuja
#      hacia abajo a la izquierda, es horizontal y va según $z$. $F$ es
#      vertical, hacia arriba, y $M_0$, la flecha de doble punta, un momento
#      según $x$. «El desplazamiento del punto C» es el vertical. Todas las
#      barras tienen la misma sección circular, con $I_p = 2I$; solo cuentan
#      la flexión y la torsión.
#    - Cuestión 4: la sección es la C de la figura, un rectángulo de 5 × 9 cm
#      con un hueco de 3 × 5 cm; la fórmula impresa se usa con $L_p = L$.
#    - Problema 1: $x$ según el eje de la pieza, desde el empotramiento; $y$
#      hacia abajo en la vista de la derecha y $z$ hacia la derecha en la de
#      la izquierda ($y$ entra en el papel). El brazo, de 200 mm, va según
#      $-z$. A está en la generatriz que se ve en la vista de la izquierda
#      ($y = -D/2$), a 100 mm del empotramiento. La galga a va según $x$, la
#      c según $z$ y la b, entre ellas, a 45°. «Sin tener en cuenta el efecto
#      de la fuerza cortante» es del apartado b/; en A, la cortante no da
#      tensión de todos modos.
#    - Problema 2: los convenios del curso para $T$, $M$, $v$ y $\theta$;
#      «Ángulos girados en la rótula C» son los giros de C a cada lado de la
#      rótula.
#    - Problema 3: barras 1 = BC, 2 = CD, 3 = DF, 4 = CF y 5 = BD (los
#      números del Word); las diagonales se cruzan sin unirse. B es un apoyo
#      fijo y F uno móvil, de reacción vertical. Cargas: $P$ hacia abajo en C
#      y en D, y $2P$ hacia la derecha en C.
#    - Problema 4: B y F son articulaciones; la barra BF, articulada en sus
#      extremos, solo trabaja a axil. $q_0$ va hacia abajo en todo CD. Los
#      pasos usan un ejemplo nuestro, $EA\,b^{2} = 12EI_z$, y lo dicen.
#
# 4. **ERRATAS Y RAREZAS DEL TEXTO, CONSERVADAS**: «E =2,5 G», con el
#    espacio solo delante del igual; «E=150 GPa», «D=50mm», «Fx=100N» y
#    «Fy=10N», sin espacios; «εa εb y εc», sin coma; «cual», sin tilde;
#    «45º», con el ordinal; y la cabecera de teoría en las páginas de los
#    problemas.
#
# 5. **DOS NUMERACIONES EN UN CUADERNILLO.** La teoría va de la 1 a la 4 y
#    los problemas vuelven a empezar en 1. Aquí la teoría son **n 1 a 4** y
#    los problemas **n 5 a 8**; la `fuente` de cada ejercicio dice el nombre
#    impreso. Ninguna pregunta se parte.
#
# 6. **PREGUNTAS REPETIDAS.** Ninguna de las ocho es idéntica a otra del
#    sitio. Dos se parecen sin ser iguales, y van propias, con otro ejemplo;
#    su `fuente` nombra la otra y sus `redactar` comparten rúbrica:
#    - La **cuestión 1** es «(1p) Criterio de los estados límites de Mohr.»,
#      la cuestión 3 de teoría del primer parcial del 16 de noviembre de 2018
#      (`exerm1819-1par-3-…`, que también es la cuestión 2 de la final del 13
#      de enero de 2023), con «Deducir el» delante. Rúbrica compartida
#      `criterio-de-los-estados-limites-de-mohr`.
#    - La **cuestión 2** es «(1p) Torsión en piezas de sección circular.», la
#      cuestión 1 de teoría de la segunda parte del 16 de enero de 2019
#      (`exerm1819-2par-1-…`), con «prismáticas». Rúbrica compartida
#      `torsion-de-la-seccion-circular`.
#    La cuestión 1 también se parece a la 3 del primer parcial de 2014-2015
#    (`exerm1415-1par-3-…`), que pide además los otros criterios: no
#    comparte rúbrica, y su ejemplo tiene la misma $k$ = 1/3.
#    Las otras seis no están en ningún examen del sitio.
#
# 7. **LAS PÁGINAS.** La 1 trae las cuatro cuestiones y el comienzo del
#    problema 1; la 2, el resto del problema 1 con su figura, el problema 2
#    con la suya y el texto del problema 3; la 3, la figura del problema 3 y
#    el problema 4.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso (src/lib/erm) y de un segundo camino
# (fase-p/p9o, guiones/cifras.mjs). Las cuestiones 1 y 2 no traen números:
# sus pasos de cálculo usan ejemplos nuestros, y lo dicen; el problema 4
# también, para la relación entre las dos rigideces.
pdf: 2016-2017-ext.pdf
puntosImpresos:
  fuente: >-
    Impresos junto a cada pregunta: «1. (1p)», «2. (1p)», «3. (1p)» y
    «4. (1p)» en la teoría, p. 1; «1.-(1,5p)» en la p. 1, «2.-(1,5p)» y
    «3.-(1,5p)» en la p. 2 y «4.-(1,5p)» en la p. 3, en los problemas.
  reparto:
    - { n: 1, puntos: 1 }
    - { n: 2, puntos: 1 }
    - { n: 3, puntos: 1 }
    - { n: 4, puntos: 1 }
    - { n: 5, puntos: 1.5 }
    - { n: 6, puntos: 1.5 }
    - { n: 7, puntos: 1.5 }
    - { n: 8, puntos: 1.5 }

