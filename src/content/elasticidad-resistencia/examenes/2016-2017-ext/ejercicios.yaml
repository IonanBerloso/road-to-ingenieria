      **Notas nuestras.** Esta versión del examen no da el material: se
      toman $E$ = 70 GPa y $\nu$ = 0,3, los del mismo problema en la otra
      versión del examen, del mismo día. Ejes: $x$ según el eje de la pieza,
      desde el empotramiento; $y$ hacia abajo en la vista de la derecha, y
      $z$ hacia la derecha en la de la izquierda. El brazo, de 200 mm, va
      según $-z$. A está en la generatriz que se ve en la vista de la
      izquierda, la de $y = -D/2$, a 100 mm del empotramiento. La galga a va
      según $x$, la c según $z$, y la b, a 45° de las dos, entre ellas.
      Alargamientos y tensiones de tracción, positivos.
    pide: >-
      a/ Las deformaciones que miden las tres galgas de la roseta en A. b/ El
      punto crítico de la pieza y sus tensiones principales, sin la cortante.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué esfuerzos produce $F_x$ en las secciones de la pieza?
        opciones:
          - texto: >-
              Un axil de tracción, $F_x$, y un flector constante, $F_x$ por
              los 200 mm del brazo, que flecta la pieza en el plano del brazo
            correcta: true
            mensaje: |
              Eso es. Llevada al eje de la pieza, $F_x$ es un axil más un par
              de $100\ \text{N}\cdot200\ \text{mm} = 20\,000\ \text{N·mm}$, con el eje
              según $y$, perpendicular a la pieza y al brazo: es $M_y$, el
              mismo en todas las secciones.
          - texto: >-
              Solo un axil de tracción, porque es paralela al eje de la pieza
            mensaje: |
              Paralela, pero a 200 mm del eje: al llevarla al eje queda un par
              de $F_x\cdot200$ mm. Y ese flector pesa mucho más que el axil:
              en el empotramiento da unas treinta veces más tensión.
          - texto: >-
              Un torsor de $F_x$ por 200 mm, porque actúa en el extremo de un
              brazo
            mensaje: |
              El torsor es el momento respecto del eje de la pieza, y $F_x$,
              paralela a él, no tiene momento respecto de ese eje. El torsor
              lo da $F_y$, perpendicular al brazo: $F_y\cdot200$ mm.
      - tipo: calcular
        titulo: La tensión normal en A
        pregunta: |
          ¿Cuánto vale la tensión normal $\sigma_x$ en A, en MPa?
        respuesta:
          tipo: numero
          valor: '0.4584'
          tolerancia: 0.002
          formato: un número con su signo, en MPa (positivo si es de tracción)
        distractores:
          - valor: '0.4074'
            mensaje: |
              Te falta el axil: $F_x/A$ = 0,051 MPa de tracción en toda la
              sección.
          - valor: '0.5399'
            mensaje: |
              Has tomado el flector de $F_y$ con los 600 mm de la pieza: ese
              es el del empotramiento. De A al extremo hay 500 mm, y
              $M_z$ = −5000 N·mm.
          - valor: '-0.3565'
            mensaje: |
              Has cambiado el signo del flector de $F_y$. $F_y$, hacia abajo
              en el extremo, flecta la pieza como un voladizo cargado en la
              punta: tracciona la fibra de arriba, y A está arriba.
        pista: |
          $\sigma_x = N/A + M_zy/I_z + M_yz/I_y$ (ec. 9.42, p. 24), con A en
          $y = -D/2$, $z = 0$, y los esfuerzos de la sección de A, a 500 mm
          del extremo.
        desarrollo: |
          $$
          A = \frac{\pi\cdot(50\ \text{mm})^{2}}{4} = 1963{,}5\ \text{mm}^{2},\qquad
          I_y = I_z = \frac{\pi\cdot(50\ \text{mm})^{4}}{64} = 306\,796\ \text{mm}^{4}
          $$

          En la sección de A, con el momento de las fuerzas respecto de su
          centro y $M_G = M_t\hat{\imath} + M_y\hat{\jmath} - M_z\hat{k}$:
          $N$ = 100 N, $M_t$ = 2000 N·mm, $M_y$ = −20 000 N·mm y
          $M_z$ = −5000 N·mm. $M_y$ no da tensión en A, que está en $z = 0$:

          $$
          \sigma_x = \frac{100\ \text{N}}{1963{,}5\ \text{mm}^{2}} + \frac{(-5000\ \text{N·mm})(-25\ \text{mm})}{306\,796\ \text{mm}^{4}} = 0{,}0509\ \text{MPa} + 0{,}4074\ \text{MPa} = 0{,}4584\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La tensión tangencial en A
        pregunta: |
          ¿Cuánto vale, en módulo, la tensión tangencial en A, en MPa?
        respuesta:
          tipo: numero
          valor: '0.08149'
          tolerancia: 0.0004
          formato: un número, en MPa (en módulo)
        distractores:
          - valor: '0.8149'
            mensaje: |
              Has tomado como torsor el par de $F_x$, $F_x\cdot200$ mm. $F_x$ es
              paralela al eje; el torsor es el de $F_y$,
              $10\ \text{N}\cdot200\ \text{mm} = 2000\ \text{N·mm}$.
          - valor: '0.1630'
            mensaje: |
              Has dividido entre $I_z$, el momento de inercia respecto de un
              diámetro. En la torsión va el polar, $I_p = 2I_z$ (ec. 12.10).
          - valor: '0.08828'
            mensaje: |
              Has sumado la tensión de la cortante $F_y$ en el centro,
              $4F_y/(3A)$. A está en el borde de arriba, donde la de la
              cortante es nula: es máxima en el diámetro horizontal.
        pista: |
          $\tau = M_tr/I_p$ (ec. 12.10), con $M_t = F_y\cdot200$ mm y
          $r = D/2$.
        desarrollo: |
          $$
          I_p = \frac{\pi\cdot(50\ \text{mm})^{4}}{32} = 613\,592\ \text{mm}^{4},\qquad
          \tau_A = \frac{2000\ \text{N·mm}\cdot25\ \text{mm}}{613\,592\ \text{mm}^{4}} = 0{,}08149\ \text{MPa}
          $$

          El torsor, positivo según $x$, gira la sección de $y$ hacia $z$; en
          A, que está en $y$ negativo, la tensión va según $-z$:
          $\tau_{xz} = -0{,}08149$ MPa. La cortante no da tensión en A.
      - tipo: calcular
        titulo: La galga a
        pregunta: |
          ¿Cuánto vale $\varepsilon_a$, en millonésimas?
        respuesta:
          tipo: numero
          valor: '6.548'
          tolerancia: 0.01
          formato: un número con su signo, en millonésimas (10⁻⁶)
        distractores:
          - valor: '5.821'
            mensaje: |
              Te falta el axil en $\sigma_x$: $F_x/A$ = 0,051 MPa.
          - valor: '7.712'
            mensaje: |
              Has tomado el flector del empotramiento, con 600 mm de brazo. A
              está a 500 mm del extremo.
        pista: |
          En la superficie, $\sigma_y = \sigma_z = 0$: la galga a, según $x$,
          mide $\varepsilon_x = \sigma_x/E$ (ec. 4.2).
        desarrollo: |
          $$
          \varepsilon_a = \frac{0{,}4584\ \text{MPa}}{70\,000\ \text{MPa}} = 6{,}548\cdot10^{-6}
          $$
      - tipo: calcular
        titulo: La galga c
        pregunta: |
          ¿Cuánto vale $\varepsilon_c$, en millonésimas?
        respuesta:
          tipo: numero
          valor: '-1.964'
          tolerancia: 0.005
          formato: un número con su signo, en millonésimas (10⁻⁶)
        distractores:
          - valor: '0'
            mensaje: |
              En la dirección de c no hay tensión normal, pero sí deformación:
              el efecto Poisson, $\varepsilon_z = -\nu\sigma_x/E$ (ec. 4.2).
          - valor: '1.964'
            mensaje: |
              Una tracción acorta el material en las direcciones
              perpendiculares: el signo es negativo.
        pista: |
          $\varepsilon_c = \varepsilon_z = [\sigma_z - \nu(\sigma_x + \sigma_y)]/E$
          (ec. 4.2), con $\sigma_y = \sigma_z = 0$.
        desarrollo: |
          $$
          \varepsilon_c = -\frac{\nu\sigma_x}{E} = -0{,}3\cdot6{,}548\cdot10^{-6} = -1{,}964\cdot10^{-6}
          $$
      - tipo: calcular
        titulo: La galga b
        pregunta: |
          ¿Cuánto vale $\varepsilon_b$, en millonésimas?
        respuesta:
          tipo: numero
          valor: '0.7785'
          tolerancia: 0.003
          formato: un número con su signo, en millonésimas (10⁻⁶)
        distractores:
          - valor: '3.805'
            mensaje: |
              Has tomado la otra diagonal, la de $x$ y $-z$: así $\gamma_{xz}$
              entra con el signo cambiado. La galga b va entre a y c, según
              $(\hat{\imath} + \hat{k})/\sqrt{2}$.
          - valor: '2.292'
            mensaje: |
              Es la media de $\varepsilon_a$ y $\varepsilon_c$: te falta la
              distorsión de la torsión, que a 45° pesa $\gamma_{xz}/2$
              (ec. 3.55).
          - valor: '-0.7348'
            mensaje: |
              Has sumado $\gamma_{xz}$ entera. En la ec. 3.55 el término es
              $\gamma_{xz}u_xu_z$, con $u_xu_z = 1/2$.
        pista: |
          $\varepsilon_b = \varepsilon_xu_x^{2} + \varepsilon_zu_z^{2} + \gamma_{xz}u_xu_z$
          (ec. 3.55, p. 17), con $u_x = u_z = 1/\sqrt{2}$,
          $\gamma_{xz} = \tau_{xz}/G$ (ec. 4.3) y $G = E/[2(1+\nu)]$
          (ec. 4.6).
        desarrollo: |
          $$
          G = \frac{70\,000\ \text{MPa}}{2\cdot1{,}3} = 26\,923\ \text{MPa},\qquad
          \gamma_{xz} = \frac{-0{,}08149\ \text{MPa}}{26\,923\ \text{MPa}} = -3{,}027\cdot10^{-6}
          $$

          $$
          \varepsilon_b = \frac{6{,}548 - 1{,}964}{2}\cdot10^{-6} + \frac{-3{,}027}{2}\cdot10^{-6} = 0{,}778\cdot10^{-6}
          $$
      - tipo: calcular
        titulo: La tensión normal del punto crítico
        pregunta: |
          ¿Cuánto vale la mayor tensión normal de la pieza, en MPa?
        respuesta:
          tipo: numero
          valor: '1.752'
          tolerancia: 0.005
          formato: un número, en MPa
        distractores:
          - valor: '0.5399'
            mensaje: |
              Te falta el flector de $F_x$, $M_y$ = −20 000 N·mm: es el mayor
              de los dos.
          - valor: '2.170'
            mensaje: |
              Has sumado los dos flectores en valor absoluto, como si sus
              máximos cayeran en el mismo punto. Caen en puntos distintos del
              borde: se componen como vectores, $\sqrt{M_y^{2} + M_z^{2}}$.
          - valor: '1.681'
            mensaje: |
              Te falta el flector de $F_y$, que en el empotramiento vale
              6000 N·mm.
        pista: |
          $N$, $M_t$ y $M_y$ son iguales en toda la pieza, y $M_z$ es máximo
          en el empotramiento. En la sección circular todos los ejes son
          principales: el flector resultante es $\sqrt{M_y^{2} + M_z^{2}}$ y
          la tensión mayor, $N/A + M_f(D/2)/I$.
        desarrollo: |
          $$
          M_f = \sqrt{(20\,000\ \text{N·mm})^{2} + (6000\ \text{N·mm})^{2}} = 20\,881\ \text{N·mm}
          $$

          $$
          \sigma_{max} = \frac{100\ \text{N}}{1963{,}5\ \text{mm}^{2}} + \frac{20\,881\ \text{N·mm}\cdot25\ \text{mm}}{306\,796\ \text{mm}^{4}} = 0{,}051\ \text{MPa} + 1{,}701\ \text{MPa} = 1{,}752\ \text{MPa}
          $$

          En el punto del borde del empotramiento de coordenadas
          $(y, z) = (-7{,}18;\ -23{,}95)$ mm: del lado del brazo, un poco por
          encima del diámetro horizontal.
      - tipo: calcular
        titulo: La tensión principal mayor
        pregunta: |
          En ese punto, ¿cuánto vale $\sigma_1$, en MPa?
        respuesta:
          tipo: numero
          valor: '1.756'
          tolerancia: 0.002
          formato: un número, en MPa
        distractores:
          - valor: '0.4724'
            mensaje: |
              Es la de A. El punto crítico no es A, sino el del empotramiento,
              donde los flectores son mayores.
          - valor: '0.9577'
            mensaje: |
              Has sumado $\sigma/2 + \tau$. El radio del círculo de Mohr es
              $\sqrt{(\sigma/2)^{2} + \tau^{2}}$ (ec. 2.68).
          - valor: '2.631'
            mensaje: |
              En la raíz va la mitad de $\sigma$:
              $\sqrt{(\sigma/2)^{2} + \tau^{2}}$, no $\sqrt{\sigma^{2} + \tau^{2}}$.
        pista: |
          La $\tau$ de la torsión es la misma en todo el borde. Con $\sigma$ y
          $\tau$, el círculo de Mohr tiene centro $\sigma/2$ y radio
          $\sqrt{(\sigma/2)^{2} + \tau^{2}}$ (ec. 2.68, p. 25).
        desarrollo: |
          $$
          \sigma_{1,3} = \frac{1{,}7524\ \text{MPa}}{2} \pm \sqrt{(0{,}8762\ \text{MPa})^{2} + (0{,}08149\ \text{MPa})^{2}} = 0{,}8762\ \text{MPa} \pm 0{,}8800\ \text{MPa}
          $$

          $\sigma_1 = 1{,}756$ MPa, $\sigma_2 = 0$ (la superficie libre) y
          $\sigma_3 = -0{,}00378$ MPa.
      - tipo: calcular
        titulo: La tensión principal menor
        pregunta: |
          ¿Y $\sigma_3$, en kPa?
        respuesta:
          tipo: numero
          valor: '-3.781'
          tolerancia: 0.01
          formato: un número con su signo, en kPa
        distractores:
          - valor: '0'
            mensaje: |
              Con $\tau \neq 0$ el círculo de Mohr cruza el origen: $\sigma_3$
              es negativa, aunque pequeña.
          - valor: '-81.49'
            mensaje: |
              Es $-\tau$, la de la cortadura pura. Aquí hay además una
              $\sigma$ grande, que lleva el círculo a la derecha.
          - valor: '-15.03'
            mensaje: |
              Has calculado $\tau$ con $I_z$ en vez de con $I_p$: el doble de
              tensión tangencial.
        pista: |
          $\sigma_3 = \sigma/2 - \sqrt{(\sigma/2)^{2} + \tau^{2}}$, en kPa.
        desarrollo: |
          $$
          \sigma_3 = 0{,}8762\ \text{MPa} - 0{,}8800\ \text{MPa} = -0{,}00378\ \text{MPa} = -3{,}78\ \text{kPa}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Los esfuerzos: $N = F_x$, $M_t = F_y\cdot200$ mm y
              $M_y = -F_x\cdot200$ mm, iguales en toda la pieza; $M_z$, de
              $F_y$, crece hacia el empotramiento.
          - texto: >-
              En A, a 500 mm del extremo, $\sigma_x$ sale del axil y de $M_z$,
              y $\tau_{xz}$, del torsor; la cortante no da tensión en el borde
              de arriba.
          - texto: >-
              Con Hooke, $\varepsilon_a = \sigma_x/E$,
              $\varepsilon_c = -\nu\sigma_x/E$, y $\varepsilon_b$ suma
              $\gamma_{xz}/2$ a la media de las dos.
          - texto: >-
              El punto crítico está en el borde del empotramiento, donde el
              flector resultante tracciona más; allí, $\sigma_1$ y $\sigma_3$
              salen del círculo de Mohr de $\sigma$ y $\tau$.
          - texto: >-
              Sin la cortante, en el punto crítico solo hay $\sigma_x$, y las
              tensiones principales son $\sigma_x$, 0 y 0.
            trampa: true
            mensaje: |
              La cortante no cuenta, pero el torsor sí: $F_y$ da
              $M_t$ = 2000 N·mm en toda la pieza, y en el borde,
              $\tau$ = 0,0815 MPa. Por eso $\sigma_1$ es algo mayor que
              $\sigma_x$ y $\sigma_3$ no es nula.
    resolucion: |
      **Los esfuerzos.** Con los ejes de las notas, la fuerza
      $(F_x, F_y, 0) = (100, 10, 0)$ N actúa en la punta del brazo, en
      $(600, 0, -200)$ mm. En la sección de abscisa $x$, el vector del centro
      a la punta es $(600 - x, 0, -200)$ mm, y su momento,
      $M_G = M_t\hat{\imath} + M_y\hat{\jmath} - M_z\hat{k}$:

      - $N = F_x$ = 100 N, de tracción, constante.
      - $M_t = 200F_y$ = 2000 N·mm, constante: lo da $F_y$, perpendicular al
        brazo.
      - $M_y = -200F_x$ = −20 000 N·mm, constante: lo da $F_x$, paralela a
        la pieza pero a 200 mm de su eje.
      - $M_z = -(600 - x)F_y$: −5000 N·mm en A y −6000 N·mm en el
        empotramiento.

      La cortante $F_y$ no se usa: en A no da tensión, y en b/ el enunciado
      la deja fuera.

      **La sección.** $A = 1963{,}5$ mm², $I_y = I_z = 306\,796$ mm⁴ e
      $I_p = 613\,592$ mm⁴.

      **a/ Las deformaciones en A.** A está en $y = -25$ mm, $z = 0$. Con la
      ec. 9.42 (p. 24):

      $$
      \sigma_x = \frac{100}{1963{,}5}\ \text{MPa} + \frac{(-5000)(-25)}{306\,796}\ \text{MPa} = 0{,}4584\ \text{MPa}
      $$

      ($M_y$ no da tensión en $z = 0$). La torsión da
      $|\tau| = 2000\ \text{N·mm}\cdot25\ \text{mm}/(613\,592\ \text{mm}^{4}) = 0{,}08149\ \text{MPa}$,
      y con el sentido del torsor, $\tau_{xz} = -0{,}08149$ MPa. En la
      superficie no hay más
      tensiones: con Hooke (ecs. 4.2, 4.3 y 4.6), $G$ = 26 923 MPa y

      $$
      \varepsilon_x = 6{,}548\cdot10^{-6},\qquad \varepsilon_z = -\nu\varepsilon_x = -1{,}964\cdot10^{-6},\qquad \gamma_{xz} = -3{,}027\cdot10^{-6}
      $$

      Las galgas (ec. 3.55): $\varepsilon_a = \varepsilon_x = 6{,}548\cdot10^{-6}$,
      $\varepsilon_c = \varepsilon_z = -1{,}964\cdot10^{-6}$ y, a 45° entre
      ellas,

      $$
      \varepsilon_b = \frac{\varepsilon_x + \varepsilon_z}{2} + \frac{\gamma_{xz}}{2} = 0{,}778\cdot10^{-6}
      $$

      Con otro material: $\varepsilon_a = \sigma_x/E$,
      $\varepsilon_c = -\nu\sigma_x/E$ y
      $\varepsilon_b = (1-\nu)\sigma_x/(2E) + (1+\nu)\tau_{xz}/E$, con
      $\sigma_x$ = 0,4584 MPa y $\tau_{xz}$ = −0,08149 MPa. El apartado b/
      no depende del material.

      **b/ El punto crítico.** $N$, $M_t$ y $M_y$ son iguales en toda la
      pieza y $|M_z|$ crece hacia el empotramiento: la sección crítica es la
      del empotramiento. En la sección circular el flector resultante,
      $M_f = \sqrt{20\,000^{2} + 6000^{2}}\ \text{N·mm} = 20\,881\ \text{N·mm}$, da la tensión
      mayor en el punto del borde donde tracciona, y el axil de tracción la
      aumenta:

      $$
      \sigma_{max} = \frac{100}{1963{,}5}\ \text{MPa} + \frac{20\,881\cdot25}{306\,796}\ \text{MPa} = 1{,}752\ \text{MPa}
      $$

      en $(y, z) = (-7{,}18;\ -23{,}95)$ mm, del lado del brazo. En el borde
      opuesto, la compresión es menor, $-1{,}651$ MPa, porque el axil la
      resta. La tensión tangencial de la torsión es la misma en todo el
      borde, $\tau$ = 0,08149 MPa.

      **Las tensiones principales.** Con $\sigma$ y $\tau$ en la superficie
      (ec. 2.68):

      $$
      \sigma_{1,3} = 0{,}8762\ \text{MPa} \pm \sqrt{0{,}8762^{2} + 0{,}08149^{2}}\ \text{MPa}
      $$

      $\sigma_1 = 1{,}756$ MPa, $\sigma_2 = 0$ y $\sigma_3 = -3{,}78$ kPa.

      **Comprobaciones.** El motor del curso da los esfuerzos de la pieza en
      el espacio, que casan con el momento calculado a mano; las tensiones y
      el punto crítico, con su cálculo de flexión compuesta; las
      deformaciones de las galgas, con la ley de Hooke y la deformación en
      una dirección; y las principales, con los autovalores del tensor.

  # ── Problema 2 · la viga empotrada con rótula en C.
  - id: exerm1617-ext-6-la-viga-empotrada-con-rotula-en-c
    titulo: La viga empotrada en A, apoyada en B y D, con una rótula en C, sus diagramas y los giros de la rótula
    fuente: >-
      Problema 2 · Extraordinaria del 16 de junio de 2017 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 1,5 puntos. El examen no publica resolución; el
      desarrollo es nuestro, con los convenios del curso, y cada cifra está
      comprobada por dos caminos.
    nivel: examen
    enunciado: |
      2.-(1,5p) La viga de la figura está empotrada en A y apoyada en B y D.
      Las partes ABC y CD están unidas por una rótula en C. La rigidez a
      flexión de toda la viga es $EI_z$. Determinar:

      a/ Diagramas de fuerzas cortantes y de momentos flectores en función
      de $q_0$ y $L$.

      b/ Ángulos girados en la rótula C.

      c/ Desplazamiento vertical de C.

