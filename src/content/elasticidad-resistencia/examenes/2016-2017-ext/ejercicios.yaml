      <title id="exerm1617-ext-4-la-carga-critica-de-la-columna-en-c-fig-t">La sección en C de la columna, con sus cotas en centímetros</title>
      <desc id="exerm1617-ext-4-la-carga-critica-de-la-columna-en-c-fig-d">Una sección en forma de C, sombreada, con la abertura hacia la derecha. Arriba, dos cotas: 5 cm, el ancho total, y 2 cm, el espesor del alma vertical de la izquierda. A la derecha, tres cotas seguidas, de arriba abajo: 2 cm, el espesor del ala de arriba; 5 cm, la altura del hueco; y 2 cm, el espesor del ala de abajo. La sección mide 9 cm de alto.</desc>
