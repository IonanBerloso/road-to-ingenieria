ejercicios:
  # ── Teoría · cuestión 1 · el criterio de los estados límites de Mohr.
  - id: exerm1617-ext-1-el-criterio-de-mohr-deducido
    titulo: El criterio de los estados límites de Mohr, deducido, y un estado con las tres principales
    fuente: >-
      Cuestión 1 de teoría · Extraordinaria del 16 de junio de 2017 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Casi la misma pregunta, sin «Deducir
      el» delante, volvió a caer como cuestión 3 de teoría del primer parcial
      del 16 de noviembre de 2018 y como cuestión 2 de teoría del examen
      final del 13 de enero de 2023, y está resuelta en el sitio; aquí va con otro
      ejemplo. El examen no publica resolución; el desarrollo es nuestro y
      sigue los apuntes del tema 6, apartado 6.4 (pp. 6-8). Los números de
      los pasos de cálculo son un ejemplo nuestro.
    nivel: examen
    enunciado: |
      1. (1p) Deducir el criterio de los estados límites de Mohr.
    pide: >-
      La deducción del criterio de los estados límites de Mohr, de la curva
      intrínseca a la tensión equivalente y la condición de no fallo, y, en
      un ejemplo nuestro, el ángulo de la recta intrínseca, la tensión
      equivalente de un estado y su factor de seguridad.
    pasos:
      - tipo: reconocer
        pregunta: |
          En la tensión equivalente de Mohr, $\sigma_{eqv} = \sigma_1 - k\sigma_3$,
          no aparece $\sigma_2$. ¿Por qué?
        opciones:
          - texto: >-
              Porque el fallo lo decide el círculo de Mohr mayor, el de
              $\sigma_1$ y $\sigma_3$, que contiene a los otros dos: es el
              único que puede tocar la recta intrínseca
            correcta: true
            mensaje: |
              Eso es (fig. 6.1 de los apuntes). Los círculos de $\sigma_1$ y
              $\sigma_2$ y de $\sigma_2$ y $\sigma_3$ quedan dentro del mayor:
              si el mayor no toca la recta, ellos tampoco. Mover $\sigma_2$
              entre $\sigma_3$ y $\sigma_1$ no cambia nada.
          - texto: >-
              Porque el criterio solo vale en tensión plana, donde
              $\sigma_2$ es nula
            mensaje: |
              Vale con tres principales cualesquiera, ordenadas de mayor a
              menor. $\sigma_2$ no entra porque está entre las otras dos: su
              círculo queda dentro del de $\sigma_1$ y $\sigma_3$.
          - texto: >-
              Porque $\sigma_2$ es siempre menor que $\sigma_{et}$, y no puede
              hacer fallar al material
            mensaje: |
              $\sigma_2$ puede valer tanto como $\sigma_1$. Lo que decide es
              el círculo mayor, y $\sigma_2$, que está entre $\sigma_1$ y
              $\sigma_3$, no lo cambia.
      - tipo: calcular
        titulo: El ángulo de la recta intrínseca
        pregunta: |
          Un ejemplo nuestro: un material con $\sigma_{et}$ = 150 MPa y
          $\sigma_{ec}$ = 450 MPa. ¿Qué ángulo $\phi$ forma su recta
          intrínseca con el eje $\sigma$, en grados?
        respuesta:
          tipo: numero
          valor: '30'
          tolerancia: 0.05
          formato: un número, en grados
        distractores:
          - valor: '-30'
            mensaje: |
              Has tomado $k = \sigma_{ec}/\sigma_{et} = 3$. El curso define
              $k = \sigma_{et}/\sigma_{ec}$ (ec. 6.12), menor que 1 en un
              material que aguanta más a compresión: $k = 1/3$.
          - valor: '26.57'
            mensaje: |
              Es el ángulo cuya tangente vale 0,5. Lo que vale
              $(1-k)/(1+k) = 0{,}5$ es el seno (ec. 6.12): en el triángulo de
              los dos centros, la diferencia de radios es el cateto opuesto y
              la distancia entre centros, la hipotenusa.
          - valor: '41.81'
            mensaje: |
              Has dividido la diferencia de los límites entre $\sigma_{ec}$.
              La hipotenusa del triángulo es la distancia entre los dos
              centros, la suma de los radios:
              $(\sigma_{ec} - \sigma_{et})/(\sigma_{ec} + \sigma_{et})$
              (ec. 6.11).
        pista: |
          $\operatorname{sen}\phi = \dfrac{1 - k}{1 + k}$, con
          $k = \sigma_{et}/\sigma_{ec}$ (ecs. 6.11 y 6.12).
        desarrollo: |
          $$
          k = \frac{150\ \text{MPa}}{450\ \text{MPa}} = \frac{1}{3},\qquad
          \operatorname{sen}\phi = \frac{1 - 1/3}{1 + 1/3} = 0{,}5
          \quad\Rightarrow\quad \phi = 30^{\circ}
          $$
      - tipo: calcular
        titulo: La tensión equivalente de un estado
        pregunta: |
          Un punto de ese material tiene $\sigma_1$ = 80 MPa,
          $\sigma_2$ = 20 MPa y $\sigma_3$ = −90 MPa. ¿Cuánto vale su
          tensión equivalente según Mohr, en MPa?
        respuesta:
          tipo: numero
          valor: '110'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '50'
            mensaje: |
              Has sumado $k\sigma_3$ en vez de restarlo. Es
              $\sigma_{eqv} = \sigma_1 - k\sigma_3$ (ec. 6.15), y con
              $\sigma_3 < 0$ la compresión **suma**: $80 + 90/3$.
          - valor: '350'
            mensaje: |
              Has usado $k = \sigma_{ec}/\sigma_{et} = 3$. El material aguanta
              más a compresión, así que $\sigma_3$ entra rebajada, con
              $k = \sigma_{et}/\sigma_{ec} = 1/3$.
          - valor: '170'
            mensaje: |
              Es $\sigma_1 - \sigma_3$, la de Tresca: el caso $k = 1$
              (ec. 6.19). Mohr tiene en cuenta que este material aguanta tres
              veces más a compresión que a tracción.
          - valor: '73.33'
            mensaje: |
              Has puesto $\sigma_2$ donde va $\sigma_3$. La tensión
              equivalente sale del círculo mayor, el de la mayor y la menor de
              las principales: $\sigma_1 = 80$ y $\sigma_3 = -90$ MPa.
        pista: |
          $\sigma_{eqv} = \sigma_1 - k\sigma_3$ (ec. 6.15), con $k = 1/3$.
        desarrollo: |
          $$
          \sigma_{eqv} = 80\ \text{MPa} - \tfrac{1}{3}\,(-90\ \text{MPa}) = 110\ \text{MPa}
          $$

          $\sigma_2$ no entra.
      - tipo: calcular
        titulo: El factor de seguridad
        pregunta: |
          ¿Cuál es el factor de seguridad de ese punto según Mohr?
        respuesta:
          tipo: numero
          valor: '1.364'
          tolerancia: 0.002
          formato: un número, sin unidades
        distractores:
          - valor: '4.091'
            mensaje: |
              Has dividido $\sigma_{ec}$ entre la tensión equivalente. La
              condición de no fallo de Mohr la compara con el límite a
              tracción, $\sigma_{eqv} < \sigma_{et}$ (ec. 6.16): la compresión
              ya está dentro de $\sigma_{eqv}$, a través de $k$.
          - valor: '0.8824'
            mensaje: |
              Es el factor de Tresca, $150/170$. Con Tresca este punto
              fallaría; con Mohr, que cuenta con la resistencia mayor a
              compresión, no falla.
          - valor: '1.875'
            mensaje: |
              Has comparado solo $\sigma_1$ con $\sigma_{et}$. La compresión
              de $-90$ MPa también acerca al fallo: entra en $\sigma_{eqv}$
              como $-k\sigma_3$, 30 MPa más.
        pista: |
          $FS = \sigma_{et}/\sigma_{eqv}$ (ec. 6.1, con la condición 6.16).
        desarrollo: |
          $$
          FS = \frac{\sigma_{et}}{\sigma_{eqv}} = \frac{150\ \text{MPa}}{110\ \text{MPa}} = 1{,}364
          $$

          Mayor que 1: no falla.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción completa, como en el examen: la curva
          intrínseca, la recta tangente a los círculos de tracción y
          compresión puras, sen ϕ en función de k, la tensión equivalente y la
          condición de no fallo, con sus figuras.
        rubrica: criterio-de-los-estados-limites-de-mohr
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              La envolvente de los círculos de Mohr de los estados de fallo es
              la curva intrínseca; un estado no falla si su círculo mayor
              queda dentro.
          - texto: >-
              La curva se sustituye por la recta tangente a los círculos de
              tracción pura, de 0 a $\sigma_{et}$, y de compresión pura, de
              $-\sigma_{ec}$ a 0.
          - texto: >-
              Del triángulo de sus centros,
              $\operatorname{sen}\phi = \dfrac{\sigma_{ec} - \sigma_{et}}{\sigma_{ec} + \sigma_{et}} = \dfrac{1-k}{1+k}$,
              con $k = \sigma_{et}/\sigma_{ec}$.
          - texto: >-
              El ensayo de tracción equivalente es el que tiene con el círculo
              mayor del estado una tangente común paralela a la recta; de ahí,
              $\sigma_{eqv} = \sigma_1 - k\sigma_3$, y no hay fallo si
              $\sigma_{eqv} < \sigma_{et}$.
          - texto: >-
              Si $\sigma_{et} = \sigma_{ec}$, $k = 1$ y el criterio de Mohr se
              convierte en el de Von Mises.
            trampa: true
            mensaje: |
              Con $k = 1$ queda $\sigma_{eqv} = \sigma_1 - \sigma_3$, que es
              Tresca (ec. 6.19): la recta intrínseca pasa a ser horizontal.
              Von Mises sale de la energía de distorsión y no es un caso
              particular del criterio de Mohr.
    resolucion: |
      **La curva intrínseca** (apuntes del tema 6, apartado 6.4, p. 6).
      Cuando un material falla, su estado de tensiones tiene un círculo de
      Mohr mayor, el de $\sigma_1$ y $\sigma_3$, que contiene a los otros dos.
      La envolvente de los círculos mayores de todos los estados que hacen
      fallar al material es la **curva intrínseca**: un estado no falla si su
      círculo mayor queda dentro de ella (fig. 6.1). $\sigma_2$ no interviene.

      **La recta intrínseca** (p. 7). Trazar la curva exige muchos ensayos,
      así que se sustituye por la recta tangente a los dos círculos que se
      conocen: el de tracción pura, de 0 a $\sigma_{et}$, y el de compresión
      pura, de $-\sigma_{ec}$ a 0 (fig. 6.2). En el triángulo de sus centros,
      la diferencia de los radios es el cateto opuesto a $\phi$ y la suma, la
      hipotenusa:

      $$
      \operatorname{sen}\phi = \frac{\tfrac12(\sigma_{ec} - \sigma_{et})}{\tfrac12(\sigma_{ec} + \sigma_{et})}
      = \frac{1 - k}{1 + k},\qquad k = \frac{\sigma_{et}}{\sigma_{ec}}
      $$

      (ecs. 6.11 y 6.12).

      **La tensión equivalente** (p. 8). Es la del ensayo de tracción cuyo
      círculo, de 0 a $\sigma_{eqv}$, tiene con el círculo mayor del estado
      una tangente común paralela a la recta intrínseca (fig. 6.3). Con los
      puntos de esa figura, $\operatorname{sen}\phi = QR/QS$ (ec. 6.13), con

      $$
      QR = \tfrac12\left[\sigma_{eqv} - (\sigma_1 - \sigma_3)\right],\qquad
      QS = \tfrac12\left[(\sigma_1 + \sigma_3) - \sigma_{eqv}\right]
      $$

      (ec. 6.14). Con $\operatorname{sen}\phi = (1-k)/(1+k)$:

      $$
      (1+k)\left[\sigma_{eqv} - \sigma_1 + \sigma_3\right] = (1-k)\left[\sigma_1 + \sigma_3 - \sigma_{eqv}\right]
      \;\Longrightarrow\; \sigma_{eqv} = \sigma_1 - k\,\sigma_3
      $$

      (ec. 6.15). **El criterio**: no hay fallo si
      $\sigma_{eqv} < \sigma_{et}$ (ec. 6.16), y el factor de seguridad es
      $FS = \sigma_{et}/\sigma_{eqv}$ (ec. 6.1).

      **Comprobaciones.** En compresión pura, $\sigma_1 = 0$ y
      $\sigma_3 = -\sigma_{ec}$ dan $\sigma_{eqv} = k\sigma_{ec} = \sigma_{et}$:
      la misma condición cubre el fallo a compresión. Con
      $\sigma_{et} = \sigma_{ec}$, $k = 1$ y queda Tresca,
      $\sigma_1 - \sigma_3$ (ec. 6.19). Sirve para materiales frágiles y
      dúctiles.

      **Un ejemplo nuestro.** $\sigma_{et}$ = 150 MPa y $\sigma_{ec}$ = 450 MPa
      dan $k = 1/3$, $\operatorname{sen}\phi = 0{,}5$ y $\phi = 30^{\circ}$. El
      estado de principales 80, 20 y −90 MPa tiene
      $\sigma_{eqv} = 80\ \text{MPa} + 90\ \text{MPa}/3 = 110\ \text{MPa}$ y
      $FS = 150\ \text{MPa}/110\ \text{MPa} = 1{,}364$: no
      falla. Con Tresca, $\sigma_{eqv}$ = 170 MPa, sí fallaría.

      **Comprobaciones de las cifras.** El motor del curso da la misma
      tensión equivalente y el mismo ángulo; por otro camino, $\phi$ sale de
      los radios de los dos círculos y $\sigma_{eqv}$, de resolver
      numéricamente $\operatorname{sen}\phi = QR/QS$ sin pasar por la
      fórmula final.

  # ── Teoría · cuestión 2 · la torsión de las piezas de sección circular.
  - id: exerm1617-ext-2-la-torsion-de-piezas-prismaticas-circulares
    titulo: La torsión en piezas prismáticas de sección circular, y un tubo a torsión
    fuente: >-
      Cuestión 2 de teoría · Extraordinaria del 16 de junio de 2017 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Casi la misma pregunta, sin
      «prismáticas», volvió a caer como cuestión 1 de teoría de la segunda
      parte del 16 de enero de 2019, y está resuelta en el sitio; aquí va con
      otro ejemplo. El examen no publica resolución; el desarrollo es nuestro
      y sigue los apuntes del tema 12, apartado 12.2 (pp. 4-9). Los números
      de los pasos de cálculo son un ejemplo nuestro.
    nivel: examen
    enunciado: |
      2. (1p) Torsión en piezas prismáticas de sección circular.
    pide: >-
      La teoría de la torsión de la sección circular, de la hipótesis de
      partida a la tensión tangencial y al ángulo girado, y, en un ejemplo
      nuestro, la tensión máxima y el giro de un tubo.
    pasos:
      - tipo: reconocer
        pregunta: |
          Si la pieza es un tubo, de diámetros $D$ y $d$, ¿qué cambia en la
          teoría?
        opciones:
          - texto: >-
              Solo el momento de inercia polar,
              $I_p = \pi(D^{4} - d^{4})/32$: la hipótesis de Coulomb y
              $\tau = M_tr/I_p$ siguen valiendo, con $r$ entre $d/2$ y $D/2$
            correcta: true
            mensaje: |
              Eso es (p. 7, ec. 12.12). El tubo también es de revolución:
              sus secciones siguen planas y giran sin alabearse. La tensión
              sigue creciendo con $r$, pero no empieza en cero: en el borde
              interior vale $M_td/(2I_p)$.
          - texto: >-
              La tensión pasa a ser uniforme en el espesor
            mensaje: |
              Eso es lo que se supone en las secciones cerradas de pequeño
              espesor (apartado 12.5). En un tubo cualquiera la tensión sigue
              siendo proporcional a $r$; solo si la pared es delgada frente al
              radio se puede tomar uniforme.
          - texto: >-
              Deja de valer la hipótesis de Coulomb: con el hueco, las
              secciones se alabean, como en la rectangular
            mensaje: |
              El hueco no rompe la simetría de revolución, que es la que impide
              el alabeo. La rectangular se alabea porque no la tiene
              (apartado 12.3).
      - tipo: calcular
        titulo: La tensión máxima de un tubo
        pregunta: |
          Un ejemplo nuestro: un tubo de $D$ = 60 mm y $d$ = 40 mm transmite
          un momento torsor $M_t$ = 1,2 kN·m. ¿Cuánto vale la tensión
          tangencial máxima, en MPa?
        respuesta:
          tipo: numero
          valor: '35.26'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '28.29'
            mensaje: |
              Es la del eje macizo de 60 mm, $16M_t/(\pi D^{3})$. El hueco
              quita material, y el que quita es el que menos trabaja: $I_p$
              baja de $\pi D^{4}/32$ a $\pi(D^{4} - d^{4})/32$ y la tensión
              sube.
          - valor: '70.52'
            mensaje: |
              El doble: has usado el momento de inercia respecto de un
              diámetro, $\pi(D^{4} - d^{4})/64$. En la torsión va el polar, que
              es el doble.
          - valor: '23.51'
            mensaje: |
              Es la del borde interior, a $r = d/2$. La máxima está en el
              exterior, a $r = D/2$: la tensión crece con la distancia al
              centro.
        pista: |
          $\tau_{max} = M_t\,(D/2)/I_p$, con $I_p = \pi(D^{4} - d^{4})/32$
          (ecs. 12.10 y 12.12). $M_t$ en N·mm.
        desarrollo: |
          $$
          I_p = \frac{\pi\,(60^{4} - 40^{4})\ \text{mm}^{4}}{32} = 1\,021\,018\ \text{mm}^{4}
          $$

          $$
          \tau_{max} = \frac{1{,}2\cdot10^{6}\ \text{N·mm}\cdot30\ \text{mm}}{1\,021\,018\ \text{mm}^{4}} = 35{,}26\ \text{MPa}
          $$

          En el borde interior, a 20 mm, $23{,}51$ MPa.
      - tipo: calcular
        titulo: El ángulo girado
        pregunta: |
          Si el tubo mide $L$ = 1,5 m y $G$ = 80 GPa, ¿cuánto gira una
          sección extrema respecto de la otra, en grados?
        respuesta:
          tipo: numero
          valor: '1.263'
          tolerancia: 0.003
          formato: un número, en grados
        distractores:
          - valor: '0.02204'
            mensaje: |
              Ese es el giro en radianes. $M_tL/(GI_p)$ da radianes: para
              pasarlo a grados se multiplica por $180/\pi$.
          - valor: '1.013'
            mensaje: |
              Es el del eje macizo de 60 mm. Con el hueco, $I_p$ es menor y el
              tubo gira más.
          - valor: '2.525'
            mensaje: |
              El doble: has usado el momento de inercia respecto de un
              diámetro, que es la mitad del polar. La rigidez a torsión es
              $GI_p$ (ec. 12.9).
        pista: |
          $\varphi = \dfrac{M_tL}{GI_p}$ (ec. 12.14), con $M_t$ y $GI_p$
          constantes.
        desarrollo: |
          $$
          \varphi = \frac{1{,}2\cdot10^{6}\ \text{N·mm}\cdot1500\ \text{mm}}{80\,000\ \text{N/mm}^{2}\cdot1\,021\,018\ \text{mm}^{4}} = 0{,}02204\ \text{rad} = 1{,}263^{\circ}
          $$
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la respuesta como en el examen, de la hipótesis de Coulomb a
          la tensión tangencial, la tensión máxima y el ángulo girado.
        rubrica: torsion-de-la-seccion-circular
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Hipótesis de Coulomb: cada sección sigue plana y gira como un
              sólido rígido; un punto a $r$ del eje se mueve $r\varphi$, en
              perpendicular a su radio.
          - texto: >-
              Solo hay distorsiones en los planos que contienen el eje, y la
              tensión resultante, perpendicular al radio, vale
              $\tau = Gr\varphi_{,x}$.
          - texto: >-
              El momento de esas tensiones es el torsor,
              $M_t = GI_p\varphi_{,x}$, y de ahí $\tau = M_tr/I_p$, máxima en
              el borde.
          - texto: >-
              Integrando $\varphi_{,x} = M_t/(GI_p)$ entre dos secciones, con
              $M_t$ y $GI_p$ constantes, $\varphi = M_tL/(GI_p)$.
          - texto: >-
              La misma fórmula, $\tau = M_tr/I_p$, vale en una sección
              rectangular, con $r$ la distancia del centro a la esquina.
            trampa: true
            mensaje: |
              En la sección rectangular la hipótesis de Coulomb no se cumple:
              las secciones se alabean. La tensión máxima está en la mitad del
              lado mayor, no en la esquina, y sale de la ec. 12.15 con la
              tabla de la p. 10 (apartado 12.3).
    resolucion: |
      **La hipótesis** (apuntes del tema 12, apartado 12.2, p. 4). Según la
      hipótesis de Coulomb, en la torsión de una pieza de sección circular
      las secciones planas siguen planas y giran como sólidos rígidos
      alrededor del eje: los radios siguen rectos. Un punto a distancia $r$
      del centro gira con su sección el ángulo pequeño $\varphi$ y se
      desplaza $r\varphi$ en perpendicular a su radio:

      $$
      u = 0,\qquad v = -\varphi z,\qquad w = \varphi y\qquad\text{(ec. 12.3)}
      $$

      **Deformaciones y tensiones** (p. 5). Derivando, todas las
      deformaciones son nulas salvo $\gamma_{xy} = -z\varphi_{,x}$ y
      $\gamma_{zx} = y\varphi_{,x}$ (ec. 12.4); con Hooke,
      $\tau_{xy} = -Gz\varphi_{,x}$ y $\tau_{zx} = Gy\varphi_{,x}$ (ec. 12.5),
      cuya resultante es perpendicular al radio:

      $$
      \tau = Gr\varphi_{,x}\qquad\text{(ec. 12.6)}
      $$

      **El torsor** (p. 6). El momento de esas tensiones respecto del centro
      es el torsor:
      $M_t = \int_A \tau r\,dA = G\varphi_{,x}\int_A r^{2}\,dA = GI_p\varphi_{,x}$
      (ecs. 12.7 y 12.8). De ahí $\varphi_{,x} = M_t/(GI_p)$ (ec. 12.9),
      con $GI_p$ la rigidez a torsión, y

      $$
      \tau = \frac{M_tr}{I_p}\qquad\text{(ec. 12.10)}
      $$

      **La tensión máxima** (p. 7). Crece lineal con $r$ y es máxima en el
      borde. Con $I_p = \pi D^{4}/32$, $\tau_{max} = 16M_t/(\pi D^{3})$
      (ec. 12.11); en un tubo, con $I_p = \pi(D^{4} - d^{4})/32$,
      $\tau_{max} = 16M_tD/[\pi(D^{4} - d^{4})]$ (ec. 12.12), y en el borde
      interior la tensión no es nula.

      **El giro** (p. 8). Integrando la ec. 12.9 entre dos secciones,
      $\varphi_B - \varphi_A = \int_A^B M_t/(GI_p)\,dx$ (ec. 12.13); con
      $GI_p$ constante es el área del diagrama de torsores entre $GI_p$
      (ec. 12.14), y con $M_t$ constante, $\varphi = M_tL/(GI_p)$.

      **El estado de tensiones** (pp. 8 y 9). En el borde hay cortadura pura
      en los planos que contienen el eje: las principales van a 45°, y por
      ellos rompen en hélice los materiales frágiles, como una tiza
      retorcida.

      **Un ejemplo nuestro.** Un tubo de $D$ = 60 mm y $d$ = 40 mm con
      $M_t$ = 1,2 kN·m: $I_p = 1\,021\,018$ mm⁴, $\tau_{max} = 35{,}26$ MPa
      en el borde exterior y $23{,}51$ MPa en el interior. Si mide 1,5 m y
      $G$ = 80 GPa, gira $0{,}02204$ rad, es decir, $1{,}263^{\circ}$. El
      motor del curso da lo mismo, y $I_p$ integrado numéricamente, también.

  # ── Teoría · cuestión 3 · la fuerza F que deja quieto el punto C (tema 13,
  #    con la torsión del 12).
  - id: exerm1617-ext-3-la-fuerza-que-deja-quieto-el-punto-c
    titulo: La fuerza F que deja quieto el extremo C de una barra quebrada empotrada, con un momento en el otro extremo
    fuente: >-
      Cuestión 3 de teoría · Extraordinaria del 16 de junio de 2017 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro, con los convenios del curso, y cada cifra está
      comprobada por dos caminos.
    nivel: examen
    enunciado: |
      3. (1p) El sistema de la figura es de sección circular, siendo $E$ =2,5
      $G$. Determinar el valor de la fuerza $F$ para que el desplazamiento
      del punto C sea nulo.

      $\overline{\text{AB}} = 2b$; $\overline{\text{BC}} = \overline{\text{BD}} = b$

      <figure class="figura-examen">
      <svg viewBox="0 0 420 236" role="img" width="420" height="236" aria-labelledby="exerm1617-ext-3-la-fuerza-que-deja-quieto-el-punto-c-fig-t exerm1617-ext-3-la-fuerza-que-deja-quieto-el-punto-c-fig-d">
      <title id="exerm1617-ext-3-la-fuerza-que-deja-quieto-el-punto-c-fig-t">La barra ABD empotrada en A, con el brazo BC, la fuerza F en C y M0 en D</title>
      <desc id="exerm1617-ext-3-la-fuerza-que-deja-quieto-el-punto-c-fig-d">Un dibujo en perspectiva. A la izquierda, una placa gruesa, vertical, vista de lado, en la que se empotra el extremo A de una barra horizontal ABD. B está a dos tercios de A a D. De B sale un brazo BC, más corto, que en la perspectiva de la placa va hacia quien mira: en el dibujo, hacia abajo y a la izquierda. En C, una flecha vertical hacia arriba, F. A la derecha de D, en la prolongación de la barra, una flecha horizontal de doble punta hacia la derecha, M0.</desc>
      <polygon points="120.8,18.8 71.2,68.5 62.2,68.5 111.8,18.8" fill="var(--faint)" fill-opacity=".6" stroke="var(--ink)" stroke-width="1.1"/>
      <polygon points="71.2,68.5 71.2,165.2 62.2,165.2 62.2,68.5" fill="var(--faint)" fill-opacity=".75" stroke="var(--ink)" stroke-width="1.1"/>
      <polygon points="120.8,18.8 71.2,68.5 71.2,165.2 120.8,115.5" fill="var(--faint)" fill-opacity=".35" stroke="var(--ink)" stroke-width="1.1"/>
      <line x1="96" y1="92" x2="330" y2="92" stroke="var(--ink)" stroke-width="5"/>
      <line x1="252" y1="92" x2="218.9" y2="125.1" stroke="var(--ink)" stroke-width="5"/>
      <line x1="218.9" y1="171.1" x2="218.9" y2="136.1" stroke="var(--ink)" stroke-width="1.5"/><polygon points="218.9,128.1 222.7,137.1 215.1,137.1" fill="var(--ink)"/>
      <line x1="333" y1="92" x2="390" y2="92" stroke="var(--ink)" stroke-width="1.4"/>
      <polygon points="387,92 378,96 378,88" fill="var(--ink)"/>
      <polygon points="396,92 387,96 387,88" fill="var(--ink)"/>
      <text x="106" y="81" font-size="15" fill="var(--ink)">A</text>
      <text x="248" y="81" font-size="15" fill="var(--ink)" text-anchor="middle">B</text>
      <text x="326" y="81" font-size="15" fill="var(--ink)" text-anchor="middle">D</text>
      <text x="208.9" y="127.1" font-size="15" fill="var(--ink)" text-anchor="end">C</text>
      <text x="226.9" y="167.1" font-size="15" fill="var(--ink)"><tspan font-style="italic">F</tspan></text>
      <text x="388" y="80" font-size="15" fill="var(--ink)"><tspan font-style="italic">M</tspan><tspan font-size="11" dy="4">0</tspan></text>
      </svg>
      <figcaption>

      Redibujada del original.

      </figcaption>
      </figure>

      **Notas nuestras.** Ejes nuestros: $x$ de A hacia D, $y$ hacia arriba
      y $z$ hacia quien mira. La placa de la izquierda es el empotramiento de
      A; la barra ABD es horizontal, y el brazo BC, que la perspectiva dibuja
      hacia abajo a la izquierda, también es horizontal y va según $z$,
      perpendicular a ABD. $F$ es vertical, hacia arriba. $M_0$, la flecha de
      doble punta, es un momento según $x$, en el sentido de A hacia D por la
      regla de la mano derecha. «El desplazamiento del punto C» es el
      vertical. Todas las barras tienen la misma sección circular, de
      momento de inercia $I$ e $I_p = 2I$; solo cuentan la flexión y la
      torsión.
    pide: >-
      El valor de la fuerza $F$ que hace nulo el desplazamiento de C.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo mueve $M_0$ el punto C?
        opciones:
          - texto: >-
              Tuerce el tramo AB, que lo lleva hasta el empotramiento: la
              sección B gira alrededor del eje de AB, y C, que está a $b$ de
              ese eje, se mueve en vertical ese giro por $b$
            correcta: true
            mensaje: |
              Eso es. $M_0$ va según el eje de la barra: para BD y para AB es
              un torsor. El de BD no mueve C, que cuelga de B; el de AB gira la
              sección B, y con ella el brazo BC entero, como una manivela.
          - texto: >-
              No lo mueve: $M_0$ actúa en D, más allá de B, y solo tuerce BD,
              que no está entre C y el empotramiento
            mensaje: |
              BD no está entre C y A, pero $M_0$ tiene que llegar al
              empotramiento, y pasa por AB: AB también trabaja a torsión con
              $M_0$. Si $M_0$ no moviera C, la respuesta sería $F = 0$.
          - texto: >-
              Flecta AB en el plano vertical, y C baja con B
            mensaje: |
              Un momento según el eje de una barra no la flecta: la tuerce
              (tema 12). AB la flecta en el plano vertical $F$; $M_0$ gira la
              sección B alrededor del eje de AB.
      - tipo: calcular
        titulo: Lo que baja C por M0
        pregunta: |
          Con $M_0$ sola, ¿cuánto baja C, en unidades de $M_0b^{2}/EI$?
        respuesta:
          tipo: numero
          valor: '2.5'
          tolerancia: 0.005
          formato: un número, el coeficiente de M0·b²/EI (hacia abajo)
        distractores:
          - valor: '5'
            mensaje: |
              Has tomado la rigidez a torsión con $I$. La de la sección
              circular va con el polar, $I_p = 2I$:
              $GI_p = (E/2{,}5)\cdot2I = 0{,}8EI$.
          - valor: '1.25'
            mensaje: |
              Has tomado AB de longitud $b$. Mide $2b$, y el giro de B es
              $M_0\cdot2b/(GI_p)$.
          - valor: '0.4'
            mensaje: |
              Has leído $G = 2{,}5E$. El enunciado dice $E = 2{,}5G$: $G$ es
              menor que $E$, y $GI_p = 0{,}8EI$.
        pista: |
          La torsión de AB gira B $M_0\cdot2b/(GI_p)$ (ec. 12.14), y C, a $b$
          del eje de AB, se mueve ese giro por $b$.
        desarrollo: |
          Con $GI_p = (E/2{,}5)\cdot2I = 0{,}8EI$:

          $$
          \delta_{C,M_0} = \frac{M_0\cdot2b}{0{,}8EI}\,b = 2{,}5\,\frac{M_0b^{2}}{EI}
          $$

          hacia abajo con el sentido de $M_0$ de la figura.
      - tipo: calcular
        titulo: Lo que sube C por F
        pregunta: |
          Con $F$ sola, ¿cuánto sube C, en unidades de $Fb^{3}/EI$?
        respuesta:
          tipo: numero
          valor: '5.5'
          tolerancia: 0.005
          formato: un número, el coeficiente de F·b³/EI (hacia arriba)
        distractores:
          - valor: '8'
            mensaje: |
              Has tomado la rigidez a torsión con $I$: la torsión de AB pesaría
              $2/0{,}4 = 5$ en vez de $2/0{,}8 = 2{,}5$. Con la sección
              circular, $I_p = 2I$.
          - valor: '5.167'
            mensaje: |
              Te falta la flexión del propio brazo BC, un voladizo de
              longitud $b$: $Fb^{3}/(3EI)$.
          - valor: '3'
            mensaje: |
              Te falta la torsión de AB. $F$ actúa a $b$ de su eje y lo tuerce
              con $Fb$: B gira, y C sube ese giro por $b$, $2{,}5Fb^{3}/EI$.
          - valor: '1.917'
            mensaje: |
              Has tomado AB de longitud $b$, en la flexión y en la torsión.
              Mide $2b$: su flexión da $F(2b)^{3}/(3EI)$ y su torsión,
              $Fb\cdot2b\cdot b/(GI_p)$.
        pista: |
          Tres partes: la flexión de BC, la de AB, de longitud $2b$, y la
          torsión de AB por el par $Fb$. O Engesser (ec. 13.14) con una fuerza
          unidad en C.
        desarrollo: |
          $$
          \delta_{C,F} = \frac{Fb^{3}}{3EI} + \frac{F(2b)^{3}}{3EI} + \frac{Fb\cdot2b}{0{,}8EI}\,b
          = \left(\frac{1}{3} + \frac{8}{3} + 2{,}5\right)\frac{Fb^{3}}{EI} = 5{,}5\,\frac{Fb^{3}}{EI}
          $$
      - tipo: calcular
        titulo: La fuerza F
        pregunta: |
          ¿Cuánto vale $F$, en unidades de $M_0/b$?
        respuesta:
          tipo: numero
          valor: '0.4545'
          tolerancia: 0.002
          formato: un número, el coeficiente de M0/b (positivo hacia arriba)
        distractores:
          - valor: '0.625'
            mensaje: |
              Has tomado la rigidez a torsión con $I$ en vez de con
              $I_p = 2I$. Con la sección circular, $GI_p = 0{,}8EI$.
          - valor: '0.4839'
            mensaje: |
              Te falta la flexión del brazo BC. $F$ actúa en su extremo: C sube
              también lo que se flecta BC, $Fb^{3}/(3EI)$.
          - valor: '0.8333'
            mensaje: |
              Has dejado la torsión solo para $M_0$. $F$, a $b$ del eje de AB,
              también lo tuerce, con $Fb$ y en sentido contrario: esa torsión
              sube C $2{,}5Fb^{3}/EI$.
          - valor: '0.1176'
            mensaje: |
              Has leído $G = 2{,}5E$. Es al revés, $E = 2{,}5G$, y la torsión
              pesa bastante más que con un $G$ grande.
        pista: |
          C no se mueve si lo que sube por $F$ iguala lo que baja por $M_0$.
        desarrollo: |
          $$
          5{,}5\,\frac{Fb^{3}}{EI} = 2{,}5\,\frac{M_0b^{2}}{EI}
          \quad\Rightarrow\quad F = \frac{5M_0}{11b} = 0{,}4545\,\frac{M_0}{b}
          $$

          hacia arriba, como la dibuja la figura.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $E = 2{,}5G$ e $I_p = 2I$, la rigidez a torsión es
              $GI_p = 0{,}8EI$.
          - texto: >-
              $M_0$ tuerce AB, que gira la sección B $2M_0b/(GI_p)$: C, a $b$
              del eje de AB, baja $2{,}5M_0b^{2}/EI$.
          - texto: >-
              $F$ flecta BC y AB y tuerce AB con el par $Fb$: C sube
              $5{,}5Fb^{3}/EI$.
          - texto: >-
              C no se mueve si $5{,}5Fb^{3} = 2{,}5M_0b^{2}$: $F = 5M_0/(11b)$,
              hacia arriba.
          - texto: >-
              BC también trabaja a torsión, con el par $Fb$, y su giro sube C
              un poco más.
            trampa: true
            mensaje: |
              $F$ está aplicada en C, sobre el propio eje de BC: respecto de
              él no tiene brazo, y a BC solo lo flecta. El par $Fb$ lo es
              respecto del eje de AB, y el que se tuerce es AB.
    resolucion: |
      **El planteamiento.** Se busca la $F$ que anula el desplazamiento
      vertical de C. Con Engesser (tema 13, ec. 13.14, p. 8), el
      desplazamiento de C en el sentido de $F$ es
      $\delta_C = \partial C/\partial F$, con la coenergía de flexión y de
      torsión; o, lo mismo, la suma de lo que mueve a C cada tramo. Con
      $E = 2{,}5G$ e $I_p = 2I$, $GI_p = (E/2{,}5)\cdot2I = 0{,}8EI$.

      **Los esfuerzos.** Con $s$ medida desde el extremo libre de cada tramo:

      - BC: flector $M = Fs$, de 0 a $b$.
      - BD: solo el torsor $M_0$; no mueve C, que cuelga de B.
      - AB: flector $M = Fs$, de 0 a $2b$, y torsor $M_t = M_0 - Fb$ (por la
        regla de la mano derecha según $x$: $F$, hacia arriba y a $b$ del eje
        hacia quien mira, da $-Fb$).

      **Engesser.** Las derivadas respecto de $F$ son $s$ en las dos
      flexiones y $-b$ en el torsor de AB:

      $$
      \delta_C = \int_0^{b}\frac{Fs\cdot s}{EI}\,ds + \int_0^{2b}\frac{Fs\cdot s}{EI}\,ds + \frac{(M_0 - Fb)(-b)\cdot2b}{GI_p}
      = \frac{Fb^{3}}{3EI} + \frac{8Fb^{3}}{3EI} + \frac{2Fb^{3} - 2M_0b^{2}}{0{,}8EI}
      $$

      es decir,

      $$
      \delta_C = 5{,}5\,\frac{Fb^{3}}{EI} - 2{,}5\,\frac{M_0b^{2}}{EI}
      $$

      positivo hacia arriba. $M_0$ baja C a través de la torsión de AB: la
      sección B gira $2M_0b/(GI_p)$ y C, a $b$ del eje, baja ese giro por
      $b$. $F$ lo sube por tres caminos: la flexión de BC, la de AB y la
      torsión que ella misma da a AB.

      **La fuerza.** $\delta_C = 0$ da

      $$
      F = \frac{2{,}5}{5{,}5}\,\frac{M_0}{b} = \frac{5M_0}{11b} = 0{,}4545\,\frac{M_0}{b}
      $$

      hacia arriba, como la dibuja la figura. Si $M_0$ fuera en el otro
      sentido, $F$ cambiaría de signo.

      **Comprobaciones.** El motor del curso resuelve la barra quebrada en el
      espacio con Engesser y da los dos coeficientes, 2,5 y 5,5, y con la
      $F$ que sale, el desplazamiento de C es nulo; a mano, sumando las tres
      contribuciones, las mismas fracciones.

  # ── Teoría · cuestión 4 · la carga crítica de la columna de sección en C.
  - id: exerm1617-ext-4-la-carga-critica-de-la-columna-en-c
    titulo: La carga crítica de una columna biarticulada de sección en C
    fuente: >-
      Cuestión 4 de teoría · Extraordinaria del 16 de junio de 2017 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 14, apartados 14.2
      y 14.3, y cada cifra está comprobada por dos caminos.
    nivel: examen
    enunciado: |
      4. (1p) Determinar la carga crítica en una columna de 2 metros de
      longitud articulada en ambos extremos que tiene la sección de la
      figura, siendo $E$=150 GPa.

      $$
      P_c = \frac{\pi^{2}E\,I_{min}}{L_p^{2}}
      $$

