      <figcaption>

      Redibujada del Word original. El PDF pierde las flechas de la carga, de
      la que queda el rótulo, y las líneas de las cotas, de las que quedan
      las tres L.

      </figcaption>
      </figure>

      **Notas nuestras.** Con los convenios del curso: el cortante $T$ es la
      suma de las fuerzas verticales hacia arriba a la izquierda de la
      sección; $M > 0$ tracciona la fibra de abajo; $v$ es positivo hacia
      abajo y $\theta = dv/dx$, en sentido horario (ec. 10.13). «Ángulos
      girados en la rótula» se lee como los giros de C del lado de ABC y del
      lado de CD.
    pide: >-
      a/ Los diagramas de cortantes y de flectores. b/ Los giros de C a cada
      lado de la rótula. c/ El desplazamiento vertical de C.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué grado de hiperestaticidad tiene la viga, y por dónde conviene
          empezar?
        opciones:
          - texto: >-
              Grado 1. CD, apoyada en la rótula y en D, es isostática: se
              resuelve primero y pasa a ABC una fuerza en C; la incógnita
              hiperestática queda en ABC
            correcta: true
            mensaje: |
              Eso es. Incógnitas: $R_A$, $M_A$, $R_B$ y $R_D$ (la horizontal de
              A es nula). Ecuaciones: las dos de la estática para cargas
              verticales y la de la rótula, $M_C = 0$. Sobra una, y está en
              ABC, empotrada y apoyada en B.
          - texto: >-
              Es isostática: la rótula da la ecuación que falta para las
              cuatro reacciones
            mensaje: |
              La rótula da una ecuación, $M_C = 0$; con las dos de la estática
              son tres, para cuatro incógnitas: $R_A$, $M_A$, $R_B$ y $R_D$.
              Sobra una.
          - texto: >-
              Grado 2, y hay que plantear la viga entera con dos incógnitas a
              la vez
            mensaje: |
              Sin la rótula, empotrada y con dos apoyos, sería de grado 2; la
              rótula quita uno. Y como CD es isostática, la incógnita que queda
              está en ABC.
      - tipo: calcular
        titulo: El momento del empotramiento
        pregunta: |
          ¿Cuánto vale $M_A$, en unidades de $q_0L^{2}$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.002
          formato: un número con su signo, el coeficiente de q0·L² (positivo si tracciona la fibra de abajo)
        distractores:
          - valor: '-0.25'
            mensaje: |
              Tiene el signo contrario al de $M_B$: en B, el voladizo
              tracciona la fibra de arriba, y en A el empotramiento responde
              traccionando la de abajo.
          - valor: '0.5'
            mensaje: |
              Has pasado a A el momento de B entero. En una viga empotrada y
              apoyada, un momento en el apoyo llega al empotramiento a la
              mitad.
          - valor: '0'
            mensaje: |
              Eso sería con A articulado. El empotramiento impide el giro:
              $\theta_A = 0$ es la condición que da $M_A$.
        pista: |
          CD apoya $q_0L/2$ en C, y el voladizo BC da
          $M_B = -(q_0L/2)L$. En AB, con $M_A$ como incógnita, la condición es
          $\theta_A = 0$ (tema 11, fig. 11.2): con los giros de la viga
          apoyada con momentos en sus extremos,
          $M_AL/(3EI_z) + M_BL/(6EI_z) = 0$.
        desarrollo: |
          $$
          M_B = -\frac{q_0L}{2}\,L = -0{,}5\,q_0L^{2},\qquad
          \frac{M_AL}{3EI_z} + \frac{M_BL}{6EI_z} = 0\ \Rightarrow\ M_A = -\frac{M_B}{2} = 0{,}25\,q_0L^{2}
          $$
      - tipo: calcular
        titulo: La reacción de B
        pregunta: |
          ¿Cuánto vale la reacción de B, en unidades de $q_0L$?
        respuesta:
          tipo: numero
          valor: '1.25'
          tolerancia: 0.002
          formato: un número con su signo, el coeficiente de q0·L (positivo hacia arriba)
        distractores:
          - valor: '1'
            mensaje: |
              Es la de ABC con A articulado: el voladizo BC, con $q_0L/2$ en
              C, colgaría solo de B. El momento del empotramiento cambia las
              reacciones de A y de B.
          - valor: '0.75'
            mensaje: |
              Has sumado $M_A$ y $M_B$. En AB el cortante es la pendiente del
              flector, $T = (M_B - M_A)/L$ (ec. 7.15), y vale $R_A$.
          - valor: '2.5'
            mensaje: |
              Has cargado en C toda la carga de CD, $q_0L$. D se lleva la
              mitad: a ABC le llega $q_0L/2$.
        pista: |
          En AB no hay carga: $R_A = T = (M_B - M_A)/L$ (ec. 7.15), y
          $R_B = q_0L/2 - R_A$.
        desarrollo: |
          $$
          R_A = \frac{(-0{,}5 - 0{,}25)\,q_0L^{2}}{L} = -0{,}75\,q_0L,\qquad
          R_B = 0{,}5\,q_0L + 0{,}75\,q_0L = 1{,}25\,q_0L
          $$

          $R_A$ es hacia abajo, y $R_D = 0{,}5\,q_0L$.
      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de cortantes y de flectores** de la viga,
          alineados bajo ella, con los valores en A, B, C y D, el punto en
          que se anula el flector de AB y el máximo de CD.
        comprueba:
          - punto: |
              **Cortantes**: $-0{,}75q_0L$ constante de A a B; en B salta a
              $0{,}5q_0L$, constante hasta C; de C a D, recta de $0{,}5q_0L$ a
              $-0{,}5q_0L$, nula en el centro de CD.
            porque: |
              $dT/dx = -q$ (ec. 7.14): constante donde no hay carga y recta en
              CD. La reacción de B, $1{,}25q_0L$, hace saltar el cortante.
          - punto: |
              **Flectores de ABC**: $0{,}25q_0L^{2}$ en A; recta que se anula a
              $L/3$ de A y llega a $-0{,}5q_0L^{2}$ en B; recta hasta cero en
              C.
            porque: |
              $dM/dx = T$ (ec. 7.15): rectas, porque el cortante es constante
              en AB y en BC. En A el empotramiento tracciona la fibra de abajo,
              y en B el voladizo, la de arriba; en la rótula, el flector es
              nulo.
          - punto: |
              **Flectores de CD**: parábola, cero en C y en D, con su máximo,
              $0{,}125q_0L^{2}$, en el centro.
            porque: |
              CD es una viga apoyada con carga uniforme: el máximo,
              $q_0L^{2}/8$, está donde se anula el cortante (ec. 7.15).
        figura: |
          <svg viewBox="0 0 420 338" role="img" width="420" height="338" aria-labelledby="exerm1617-ext-6-la-viga-empotrada-con-rotula-en-c-dia-t exerm1617-ext-6-la-viga-empotrada-con-rotula-en-c-dia-d">
