      <line x1="222" y1="202" x2="222" y2="242" stroke="var(--ink)" stroke-width="1"/><polygon points="222,242 219.4,235 224.6,235" fill="var(--ink)"/><polygon points="222,202 224.6,209 219.4,209" fill="var(--ink)"/>
