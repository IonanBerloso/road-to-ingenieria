    pide: >-
      La carga crítica de la columna.
    pasos:
      - tipo: reconocer
        pregunta: |
          La fórmula del enunciado pide $I_{min}$. ¿Respecto de qué eje es
          mínimo el momento de inercia de esta sección?
        opciones:
          - texto: >-
              Del eje vertical que pasa por el centro de gravedad, paralelo al
              alma: en horizontal la sección mide 5 cm, y en vertical, 9
            correcta: true
            mensaje: |
              Eso es. La sección es simétrica respecto del eje horizontal por
              G, así que ese eje y el vertical por G son los principales. Del
              vertical, ningún punto está a más de 3 cm; del horizontal, las
              alas, dos tercios del área, quedan entre 2,5 y 4,5 cm, con su
              centro a 3,5. El mínimo es el del vertical.
          - texto: >-
              Del eje horizontal, el de simetría: la columna pandea alrededor
              del eje que la simetría señala
            mensaje: |
              La simetría dice cuáles son los ejes principales, no cuál de
              los dos da el mínimo. Respecto del horizontal la sección mide 9
              cm y tiene las alas lejos: es el momento máximo.
          - texto: >-
              Del que pasa por la cara exterior del alma, porque ahí está casi
              todo el material
            mensaje: |
              Un eje que no pasa por G da siempre más que su paralelo por G:
              Steiner suma $A\,d^{2}$. Los momentos de inercia mínimo y máximo
              son los de los ejes principales, que pasan por G.
      - tipo: calcular
        titulo: El centro de gravedad
        pregunta: |
          ¿A qué distancia de la cara exterior del alma está el centro de
          gravedad de la sección, en cm?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número, en cm
        distractores:
          - valor: '2.5'
            mensaje: |
              Es el centro del rectángulo de 5 × 9 cm, sin descontar el hueco.
              El hueco, de 3 × 5 cm, está del lado de la abertura, y al
              quitarlo G se acerca al alma.
          - valor: '1.333'
            mensaje: |
              Has dividido entre el área del rectángulo entero, 45 cm². El
              momento estático de la sección, 60 cm³, se divide entre su área,
              $45\ \text{cm}^{2} - 15\ \text{cm}^{2} = 30\ \text{cm}^{2}$.
          - valor: '3'
            mensaje: |
              Has puesto el centro del hueco a 1,5 cm de la cara del alma. El
              hueco empieza en la cara interior del alma, a 2 cm, y su centro
              está a $2\ \text{cm} + 1{,}5\ \text{cm} = 3{,}5\ \text{cm}$.
        pista: |
          Rectángulo de 5 × 9 cm menos el hueco de 3 × 5 cm, con los momentos
          estáticos respecto de la cara exterior del alma.
        desarrollo: |
          $$
          z_G = \frac{45\ \text{cm}^{2}\cdot2{,}5\ \text{cm} - 15\ \text{cm}^{2}\cdot3{,}5\ \text{cm}}{45\ \text{cm}^{2} - 15\ \text{cm}^{2}}
          = \frac{60\ \text{cm}^{3}}{30\ \text{cm}^{2}} = 2\ \text{cm}
          $$

          justo en la cara interior del alma.
      - tipo: calcular
        titulo: El momento de inercia mínimo
        pregunta: |
          ¿Cuánto vale $I_{min}$, en cm⁴?
        respuesta:
          tipo: numero
          valor: '60'
          tolerancia: 0.1
          formato: un número, en cm⁴
        distractores:
          - valor: '180'
            mensaje: |
              Es el momento respecto de la cara exterior del alma. La columna
              pandea alrededor de un eje por G: Steiner resta
              $A\,z_G^{2} = 30\ \text{cm}^{2}\cdot(2\ \text{cm})^{2} = 120\ \text{cm}^{4}$.
          - valor: '272.5'
            mensaje: |
              Es el del eje horizontal, el de simetría: el máximo. Las alas,
              lejos de ese eje, lo hacen grande.
          - valor: '300'
            mensaje: |
              Has sumado Steiner al pasar de la cara del alma a G. Es al
              revés: el momento respecto de G es el menor de todos los ejes
              paralelos, $I_G = I_{cara} - A\,z_G^{2}$.
          - valor: '45'
            mensaje: |
              Te faltan los momentos propios de las piezas, los de cada
              rectángulo respecto de su propio centro: 6 cm⁴ el alma y
              4,5 cm⁴ cada ala.
        pista: |
          Respecto de la cara exterior del alma, $b^{3}h/3$ del rectángulo
          entero menos el del hueco; luego Steiner hasta G. O por piezas: el
          alma de 2 × 9 cm y las dos alas de 3 × 2 cm.
        desarrollo: |
          Respecto de la cara exterior del alma:

          $$
          I_{cara} = \frac{9\cdot5^{3}}{3}\ \text{cm}^{4} - \frac{5\cdot(5^{3} - 2^{3})}{3}\ \text{cm}^{4} = 375\ \text{cm}^{4} - 195\ \text{cm}^{4} = 180\ \text{cm}^{4}
          $$

          y por Steiner hasta G:

          $$
          I_{min} = 180\ \text{cm}^{4} - 30\ \text{cm}^{2}\cdot(2\ \text{cm})^{2} = 60\ \text{cm}^{4}
          $$

          Por piezas, en cm⁴: el alma, $6 + 18\cdot1^{2} = 24$, y cada ala,
          $4{,}5 + 6\cdot1{,}5^{2} = 18$; en total, 60 cm⁴. El del eje
          horizontal es
          $5\cdot9^{3}/12\ \text{cm}^{4} - 3\cdot5^{3}/12\ \text{cm}^{4} = 272{,}5\ \text{cm}^{4}$.
      - tipo: calcular
        titulo: La carga crítica
        pregunta: |
          ¿Cuánto vale la carga crítica, en kN?
        respuesta:
          tipo: numero
          valor: '222.07'
          tolerancia: 0.3
          formato: un número, en kN
        distractores:
          - valor: '1008.55'
            mensaje: |
              Has usado el momento de inercia máximo, el del eje horizontal.
              La columna pandea por donde menos resiste: con $I_{min}$.
          - valor: '666.20'
            mensaje: |
              Has usado el momento respecto de la cara exterior del alma,
              180 cm⁴, sin llevarlo a G.
          - valor: '55.52'
            mensaje: |
              Has tomado $L_p = 2L$, la del voladizo. Articulada en los dos
              extremos, $L_p = L$ = 2 m (p. 7).
          - valor: '22.21'
            mensaje: |
              Un cero de menos al pasar a mm⁴: 1 cm⁴ son $10^{4}$ mm⁴, así
              que $I_{min}$ = 600 000 mm⁴.
        pista: |
          $P_c = \pi^{2}EI_{min}/L_p^{2}$ (ec. 14.9), con $L_p = L$ en la
          biarticulada, $E$ en N/mm², $I$ en mm⁴ y $L$ en mm.
        desarrollo: |
          $$
          P_c = \frac{\pi^{2}\cdot150\,000\ \text{N/mm}^{2}\cdot600\,000\ \text{mm}^{4}}{(2000\ \text{mm})^{2}} = 222\,066\ \text{N} = 222{,}07\ \text{kN}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Articulada en los dos extremos, la longitud de pandeo es la de
              la columna, $L_p = L$ = 2 m.
          - texto: >-
              La sección tiene $A$ = 30 cm², y su centro de gravedad está a 2
              cm de la cara exterior del alma.
          - texto: >-
              Respecto del eje vertical por G, 180 cm⁴ menos Steiner,
              $30\ \text{cm}^{2}\cdot(2\ \text{cm})^{2}$: 60 cm⁴, el mínimo;
              respecto del horizontal, 272,5 cm⁴.
          - texto: >-
              $P_c = \pi^{2}\cdot150\,000\cdot600\,000/2000^{2}$ N, unos
              222 kN.
          - texto: >-
              Como la sección no es simétrica respecto del eje vertical, hay
              que calcular el producto de inercia y girar los ejes para
              encontrar $I_{min}$.
            trampa: true
            mensaje: |
              Basta un eje de simetría: el producto de inercia respecto de él
              y de su perpendicular por G es nulo, y los dos son principales.
              Aquí el horizontal lo es, y $I_{min}$ es el del vertical.
    resolucion: |
      **La longitud de pandeo** (apuntes del tema 14, apartado 14.3, p. 7).
      La columna está articulada en los dos extremos: $L_p = L$ = 2 m, y la
      carga crítica es la de Euler, $P_c = \pi^{2}EI_{min}/L_p^{2}$
      (ec. 14.9), la que imprime el enunciado. Pandea alrededor del eje de
      menor momento de inercia.

      **La sección.** Un rectángulo de 5 cm de ancho por 9 cm de alto menos
      un hueco de 3 × 5 cm del lado de la abertura:
      $A = 45\ \text{cm}^{2} - 15\ \text{cm}^{2} = 30\ \text{cm}^{2}$.
      Es simétrica respecto del eje horizontal por su centro, así que ese eje
      y el vertical por G son los principales. Con los momentos estáticos
      respecto de la cara exterior del alma:

      $$
      z_G = \frac{45\ \text{cm}^{2}\cdot2{,}5\ \text{cm} - 15\ \text{cm}^{2}\cdot3{,}5\ \text{cm}}{30\ \text{cm}^{2}} = 2\ \text{cm}
      $$

      **Los momentos de inercia.** Respecto de la cara exterior del alma,
      $9\cdot5^{3}/3\ \text{cm}^{4} - 5\cdot(5^{3} - 2^{3})/3\ \text{cm}^{4} = 180\ \text{cm}^{4}$,
      y por Steiner, respecto del eje vertical por G,

      $$
      I_{min} = 180\ \text{cm}^{4} - 30\ \text{cm}^{2}\cdot(2\ \text{cm})^{2} = 60\ \text{cm}^{4}
      $$

      Respecto del horizontal,
      $5\cdot9^{3}/12\ \text{cm}^{4} - 3\cdot5^{3}/12\ \text{cm}^{4} = 272{,}5\ \text{cm}^{4}$:
      el máximo.

      **La carga crítica.** Con $I_{min}$ = 600 000 mm⁴:

      $$
      P_c = \frac{\pi^{2}\cdot150\,000\ \text{N/mm}^{2}\cdot600\,000\ \text{mm}^{4}}{(2000\ \text{mm})^{2}} = 222\,066\ \text{N} = 222{,}07\ \text{kN}
      $$

      **Comprobaciones.** El motor del curso calcula la sección como el
      rectángulo menos el hueco y la carga crítica en los dos planos, y se
      queda con la del vertical; a mano, por piezas (el alma y las dos alas
      con Steiner), salen los mismos 60 cm⁴ y la misma carga.
  # ── Problema 1 · la pieza circular con el brazo soldado y la roseta en A.
  - id: exerm1617-ext-5-la-roseta-en-la-pieza-del-brazo-soldado
    titulo: La roseta de galgas en una pieza circular con un brazo soldado, y las tensiones principales de su punto crítico
    fuente: >-
      Problema 1 · Extraordinaria del 16 de junio de 2017 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 1,5 puntos. El examen no publica resolución; el
      desarrollo es nuestro, con los convenios del curso, y cada cifra está
      comprobada por dos caminos.
    nivel: examen
    enunciado: |
      1.-(1,5p) La pieza de la figura es de sección circular de diámetro
      $D$=50mm. En su extremo tiene soldada una barra a la que se aplican las
      fuerzas $F_x$=100N y $F_y$=10N, como se indica en la figura. En el
      punto A se adhiere una roseta de galgas extensométricas, en la que la
      galga b está orientada a 45º respecto de las galgas a y c. Determinar:

      a/ Los valores de las deformaciones $\varepsilon_a$ $\varepsilon_b$ y
      $\varepsilon_c$.

      b/ Tras razonar cual es el punto crítico desde el punto de vista
      tensional, determinar las tensiones principales, sin tener en cuenta
      el efecto de la fuerza cortante.

