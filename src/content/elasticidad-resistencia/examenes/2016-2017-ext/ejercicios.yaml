      - tipo: calcular
        titulo: El giro de C del lado de ABC
        pregunta: |
          ¿Cuánto gira C del lado de ABC, en unidades de $q_0L^{3}/EI_z$?
        respuesta:
          tipo: numero
          valor: '0.375'
          tolerancia: 0.002
          formato: un número con su signo, el coeficiente de q0·L³/EIz (positivo en sentido horario)
        distractores:
          - valor: '0.25'
            mensaje: |
              Es solo lo que gira C por la flexión del voladizo BC, como si B
              no girara. B gira $q_0L^{3}/(8EI_z)$, y arrastra a BC.
          - valor: '0.125'
            mensaje: |
              Es el giro de B. De B a C, la flexión del voladizo con
              $q_0L/2$ en la punta añade $(q_0L/2)L^{2}/(2EI_z)$.
          - valor: '0.4167'
            mensaje: |
              Has girado B como si A estuviera articulado,
              $-M_BL/(3EI_z)$. El empotramiento frena el giro:
              $\theta_B = q_0L^{3}/(8EI_z)$.
        pista: |
          Con $\theta_A = 0$ y $v'' = -M/EI_z$ (ec. 10.14),
          $\theta_B = -\int_0^{L} M\,dx/EI_z$. Desde B, el voladizo BC con
          $q_0L/2$ en C añade $(q_0L/2)L^{2}/(2EI_z)$.
        desarrollo: |
          $$
          \theta_B = -\frac{1}{EI_z}\int_0^{L}M\,dx = -\frac{(0{,}25 - 0{,}5)\,q_0L^{2}\cdot L}{2EI_z} = 0{,}125\,\frac{q_0L^{3}}{EI_z}
          $$

          $$
          \theta_C^{\text{izq}} = \theta_B + \frac{(q_0L/2)L^{2}}{2EI_z} = (0{,}125 + 0{,}25)\,\frac{q_0L^{3}}{EI_z} = 0{,}375\,\frac{q_0L^{3}}{EI_z}
          $$

          en sentido horario.
      - tipo: calcular
        titulo: La flecha de C
        pregunta: |
          ¿Cuánto baja C, en unidades de $q_0L^{4}/EI_z$?
        respuesta:
          tipo: numero
          valor: '0.2917'
          tolerancia: 0.002
          formato: un número con su signo, el coeficiente de q0·L⁴/EIz (positivo hacia abajo)
        distractores:
          - valor: '0.1667'
            mensaje: |
              Es solo la flecha del voladizo BC, $(q_0L/2)L^{3}/(3EI_z)$. Falta
              lo que baja C porque B gira: $\theta_BL$.
          - valor: '0.125'
            mensaje: |
              Es solo $\theta_BL$: falta la flexión del propio BC.
          - valor: '0.3333'
            mensaje: |
              Has girado B como si A estuviera articulado. Con el
              empotramiento, $\theta_B = q_0L^{3}/(8EI_z)$.
        pista: |
          El giro de B lleva C como un sólido rígido, $\theta_BL$, y BC se
          flecta como un voladizo con $q_0L/2$ en la punta.
        desarrollo: |
          $$
          v_C = \theta_BL + \frac{(q_0L/2)L^{3}}{3EI_z} = \left(\frac{1}{8} + \frac{1}{6}\right)\frac{q_0L^{4}}{EI_z} = \frac{7}{24}\,\frac{q_0L^{4}}{EI_z} = 0{,}2917\,\frac{q_0L^{4}}{EI_z}
          $$

          hacia abajo.
      - tipo: calcular
        titulo: El giro de C del lado de CD
        pregunta: |
          ¿Cuánto gira C del lado de CD, en unidades de $q_0L^{3}/EI_z$?
        respuesta:
          tipo: numero
          valor: '-0.25'
          tolerancia: 0.002
          formato: un número con su signo, el coeficiente de q0·L³/EIz (positivo en sentido horario)
        distractores:
          - valor: '0.04167'
            mensaje: |
              Es solo el giro de CD por su carga, como una viga apoyada. Falta
              el de sólido rígido: C bajó $v_C$ y D no, así que CD sube hacia
              D, $-v_C/L$.
          - valor: '-0.2917'
            mensaje: |
              Es solo el giro de sólido rígido, $-v_C/L$. La carga de CD
              además la flecta, y en C eso añade $q_0L^{3}/(24EI_z)$, en
              sentido horario.
          - valor: '-0.3333'
            mensaje: |
              Has restado el giro de la carga. En una viga apoyada cargada
              hacia abajo, el extremo izquierdo gira en sentido horario: suma.
        pista: |
          CD es una viga apoyada en C, que bajó $v_C$, y en D. Su giro en C es
          el de sólido rígido, $-v_C/L$, más el de la carga,
          $q_0L^{3}/(24EI_z)$.
        desarrollo: |
          $$
          \theta_C^{\text{der}} = -\frac{7}{24}\,\frac{q_0L^{3}}{EI_z} + \frac{1}{24}\,\frac{q_0L^{3}}{EI_z} = -0{,}25\,\frac{q_0L^{3}}{EI_z}
          $$

          en sentido antihorario. El giro relativo en la rótula es
          $-0{,}25 - 0{,}375 = -0{,}625$, en unidades de $q_0L^{3}/EI_z$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              CD es isostática: apoya $q_0L/2$ en C y otro tanto en D.
          - texto: >-
              En ABC, el voladizo BC da $M_B = -q_0L^{2}/2$, y $\theta_A = 0$
              da $M_A = -M_B/2 = q_0L^{2}/4$.
          - texto: >-
              Con los flectores, $\theta_B = q_0L^{3}/(8EI_z)$; del lado de ABC,
              C gira $3q_0L^{3}/(8EI_z)$ y baja $7q_0L^{4}/(24EI_z)$.
          - texto: >-
              Del lado de CD, C gira $-v_C/L$ más el giro propio de la viga
              apoyada: $-q_0L^{3}/(4EI_z)$.
          - texto: >-
              En la rótula C el cortante es nulo, como el flector.
            trampa: true
            mensaje: |
              La rótula anula el flector, no el cortante: por ella pasa la
              fuerza $q_0L/2$ que CD apoya en ABC, y el cortante vale
              $0{,}5q_0L$ a los dos lados de C.
    resolucion: |
      **El grado.** Las incógnitas son $R_A$, $M_A$, $R_B$ y $R_D$; las
      ecuaciones, las dos de la estática para cargas verticales y la de la
      rótula, $M_C = 0$. Es hiperestática de grado 1, y la incógnita está en
      ABC: CD, apoyada en la rótula y en D, es isostática.

      **CD.** Apoyada en sus extremos con $q_0$ en toda su longitud: apoya
      $q_0L/2$ en C y en D. $R_D = 0{,}5\,q_0L$, y sobre ABC actúa en C una
      fuerza de $q_0L/2$ hacia abajo.

      **ABC** (tema 11, apartado 11.2). El voladizo BC da
      $M_B = -(q_0L/2)L = -0{,}5\,q_0L^{2}$. AB, empotrada en A y apoyada en
      B, con $M_A$ como incógnita y la condición $\theta_A = 0$ (fig. 11.2):

      $$
      \frac{M_AL}{3EI_z} + \frac{M_BL}{6EI_z} = 0\ \Rightarrow\ M_A = -\frac{M_B}{2} = 0{,}25\,q_0L^{2}
      $$

      En AB, sin carga, $R_A = T = (M_B - M_A)/L = -0{,}75\,q_0L$ (hacia
      abajo), y $R_B = 0{,}5\,q_0L - R_A = 1{,}25\,q_0L$. Comprobación:
      $R_A + R_B + R_D = q_0L$.

      **a/ Los diagramas.** Cortantes: $-0{,}75q_0L$ de A a B; $0{,}5q_0L$ de
      B a C; de C a D, $0{,}5q_0L - q_0(x - 2L)$, que se anula en
      $x = 2{,}5L$ y vale $-0{,}5q_0L$ en D. Flectores:
      $M = 0{,}25q_0L^{2} - 0{,}75q_0Lx$ de A a B, nulo en $x = L/3$ y
      $-0{,}5q_0L^{2}$ en B; recta hasta cero en C; en CD, la parábola de la
      viga apoyada, $q_0(x - 2L)(3L - x)/2$, con máximo $q_0L^{2}/8$ en el
      centro.

      **b/ Los giros de la rótula.** Con $\theta_A = 0$ y la ec. 10.14:

      $$
      \theta_B = -\frac{1}{EI_z}\int_0^{L}M\,dx = 0{,}125\,\frac{q_0L^{3}}{EI_z},\qquad
      \theta_C^{\text{izq}} = \theta_B + \frac{(q_0L/2)L^{2}}{2EI_z} = 0{,}375\,\frac{q_0L^{3}}{EI_z}
      $$

      en sentido horario. Del lado de CD, que gira como sólido rígido
      $-v_C/L$ y además se flecta con su carga:

      $$
      \theta_C^{\text{der}} = -\frac{v_C}{L} + \frac{q_0L^{3}}{24EI_z} = -0{,}25\,\frac{q_0L^{3}}{EI_z}
      $$

      en sentido antihorario. El giro relativo de los dos lados es
      $0{,}625\,q_0L^{3}/EI_z$.

      **c/ La flecha de C.**

      $$
      v_C = \theta_BL + \frac{(q_0L/2)L^{3}}{3EI_z} = \frac{7}{24}\,\frac{q_0L^{4}}{EI_z} = 0{,}2917\,\frac{q_0L^{4}}{EI_z}
      $$

      hacia abajo.

      **Comprobaciones.** El motor del curso integra la elástica de la viga
      entera con la rótula y da las mismas reacciones, los mismos flectores y
      los mismos giros a cada lado de C; la flecha de C sale también
      integrando numéricamente el giro de B a C.

  # ── Problema 3 · la celosía de cinco barras.
  - id: exerm1617-ext-7-la-celosia-de-cinco-barras
    titulo: Una celosía cuadrada de cinco barras, sus axiles y el desplazamiento del apoyo móvil
    fuente: >-
      Problema 3 · Extraordinaria del 16 de junio de 2017 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 1,5 puntos. El examen no publica resolución; el
