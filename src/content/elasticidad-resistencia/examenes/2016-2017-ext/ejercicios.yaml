      **Notas nuestras.** Los pasos de cálculo usan un ejemplo nuestro,
      $EA\,b^{2} = 12EI_z$, elegido para que pesen las dos energías; la
      resolución da el resultado general.
    pide: >-
      a/ El axil de la barra BF y si es de tracción o de compresión. b/ El
      desplazamiento horizontal de F.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué se toma como incógnita hiperestática, y qué condición la da?
        opciones:
          - texto: >-
              El axil $X$ de la barra, como fuerza interna: la coenergía del
              pórtico y de la barra es estacionaria respecto de $X$, y eso
              dice que lo que se separan B y F en el pórtico es lo que se
              alarga la barra
            correcta: true
            mensaje: |
              Eso es (tema 13, ec. 13.54, p. 19). Cortada la barra, el pórtico
              es isostático; $X$ actúa en B y en F, y su energía axial,
              $X^{2}b/(2EA)$, entra en la coenergía junto con la de flexión.
          - texto: >-
              La reacción horizontal de F, con la condición de que F no se
              mueva
            mensaje: |
              F está sobre un apoyo móvil: no tiene reacción horizontal, y se
              mueve lo que se alarga la barra. La incógnita es el axil de la
              barra.
          - texto: >-
              Ninguna: con cargas verticales la barra no trabaja, y el pórtico
              es isostático
            mensaje: |
              Sin la barra, la carga flecta el dintel, los nudos C y D giran y
              los pilares se abren: B y F se separan. La barra lo impide en
              parte, y trabaja.
      - tipo: calcular
        titulo: Lo que se separan B y F sin la barra
        pregunta: |
          Sin la barra, ¿cuánto se separan B y F, en unidades de
          $q_0b^{4}/EI_z$?
        respuesta:
          tipo: numero
          valor: '0.08333'
          tolerancia: 0.0004
          formato: un número, el coeficiente de q0·b⁴/EIz
        distractores:
          - valor: '0.1667'
            mensaje: |
              Has tomado en el dintel el flector de un voladizo,
              $q_0x^{2}/2$. Sin la barra, las reacciones son verticales, los
              pilares no se flectan y el dintel trabaja como una viga apoyada:
              $M = q_0x(b - x)/2$.
          - valor: '0.125'
            mensaje: |
              Has tomado el flector máximo, $q_0b^{2}/8$, en todo el dintel. El
              flector es una parábola, y su área es $q_0b^{3}/12$.
          - valor: '0.01302'
            mensaje: |
              Es la flecha del centro del dintel, $5q_0b^{4}/(384EI_z)$: lo que
              baja, no lo que se separan B y F.
        pista: |
          Engesser (ec. 13.14) con una pareja de fuerzas unidad en B y F que
          los separa: su flector es $m = y$ en los pilares, con $y$ la altura,
          y $m = b$ en el dintel; el de la carga, solo en el dintel.
        desarrollo: |
          Con positivo el flector que tracciona el lado de dentro del pórtico:

          $$
          \delta_0 = \frac{1}{EI_z}\int_0^{b}\frac{q_0x(b - x)}{2}\,b\,dx = \frac{q_0b^{4}}{12EI_z} = 0{,}0833\,\frac{q_0b^{4}}{EI_z}
          $$
      - tipo: calcular
        titulo: La flexibilidad del pórtico
        pregunta: |
          Con la pareja unidad sola, ¿cuánto se separan B y F, en unidades de
          $b^{3}/EI_z$?
        respuesta:
          tipo: numero
          valor: '1.667'
          tolerancia: 0.003
          formato: un número, el coeficiente de b³/EIz
        distractores:
          - valor: '1'
            mensaje: |
              Te faltan los pilares: la pareja los flecta con $m = y$, y suman
              $2b^{3}/3$.
          - valor: '0.6667'
            mensaje: |
              Te falta el dintel, con $m = b$ en toda su longitud:
              $b^{2}\cdot b$.
          - valor: '3'
            mensaje: |
              Has puesto $m = b$ en toda la altura de los pilares. El brazo de
              la fuerza de B es la altura de la sección: $m = y$, de 0 en B a
              $b$ en C.
        pista: |
          $\delta_{11} = \int m^{2}\,ds/EI_z$, con $m = y$ en los pilares y
          $m = b$ en el dintel.
        desarrollo: |
          $$
          \delta_{11} = \frac{1}{EI_z}\left(2\int_0^{b}y^{2}\,dy + b^{2}\cdot b\right) = \frac{1}{EI_z}\left(\frac{2b^{3}}{3} + b^{3}\right) = \frac{5b^{3}}{3EI_z}
          $$
      - tipo: calcular
        titulo: La fuerza en la barra
        pregunta: |
          Con $EA\,b^{2} = 12EI_z$, ¿cuánto vale el axil de la barra, en
          unidades de $q_0b$?
        respuesta:
          tipo: numero
          valor: '0.04762'
          tolerancia: 0.0002
          formato: un número con su signo, el coeficiente de q0·b (positivo de tracción)
        distractores:
          - valor: '0.05'
            mensaje: |
              Es el de una barra rígida, que no dejara separarse B y F. La
              barra se alarga $Xb/EA$, y eso le quita fuerza.
          - valor: '-0.04762'
            mensaje: |
              Es de tracción: el pórtico tiende a separar B y F, y la barra
              los retiene.
          - valor: '0.07692'
            mensaje: |
              Has dejado los pilares fuera de la flexibilidad. Con
              $\delta_{11} = b^{3}/EI_z$ la barra se lleva más fuerza de la
              que le toca.
        pista: |
          Lo que se separan B y F con la carga y $X$ es lo que se alarga la
          barra: $\delta_0 - X\delta_{11} = Xb/EA$ (es $\partial C/\partial X = 0$,
          ec. 13.54).
        desarrollo: |
          $$
          X = \frac{q_0b^{4}/(12EI_z)}{5b^{3}/(3EI_z) + b/(EA)} = \frac{q_0b}{20 + 12EI_z/(EA\,b^{2})}
          $$

          Con $EA\,b^{2} = 12EI_z$, $X = q_0b/21 = 0{,}0476\,q_0b$, de
          tracción.
      - tipo: calcular
        titulo: El desplazamiento de F
        pregunta: |
          ¿Cuánto se mueve F en horizontal, en unidades de $q_0b^{4}/EI_z$?
        respuesta:
          tipo: numero
          valor: '0.003968'
          tolerancia: 0.00004
          formato: un número con su signo, el coeficiente de q0·b⁴/EIz (positivo hacia la derecha)
        distractores:
          - valor: '0.08333'
            mensaje: |
              Es lo que se separan B y F sin la barra. La barra retiene F: se
              mueve solo lo que ella se alarga.
          - valor: '0.1627'
            mensaje: |
              Has sumado el efecto de la barra en vez de restarlo. La barra
              acerca F a B: $\delta_0 - X\delta_{11}$.
          - valor: '0'
            mensaje: |
              F está sobre un apoyo móvil: se aleja de B lo que se alarga la
              barra.
        pista: |
          B es fijo: F se mueve lo que se alarga la barra, $Xb/EA$; o, lo
          mismo, $\delta_0 - X\delta_{11}$.
        desarrollo: |
          $$
          \delta_F = \frac{Xb}{EA} = \frac{q_0b}{21}\cdot\frac{b^{3}}{12EI_z} = \frac{q_0b^{4}}{252EI_z} = 0{,}00397\,\frac{q_0b^{4}}{EI_z}
          $$

          hacia la derecha. Por el otro lado:
          $\delta_0 - X\delta_{11} = (21 - 20)\,q_0b^{4}/(252EI_z)$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Cortada la barra, el pórtico es isostático: reacciones verticales
              de $q_0b/2$ y flector solo en el dintel.
          - texto: >-
              Sin la barra, B y F se separan $q_0b^{4}/(12EI_z)$; una pareja
              unidad los separa $5b^{3}/(3EI_z)$.
          - texto: >-
              Con la energía de la barra, $\partial C/\partial X = 0$ da
              $\delta_0 - X\delta_{11} = Xb/EA$: $X$ es de tracción.
          - texto: >-
              F se mueve hacia la derecha lo que se alarga la barra, $Xb/EA$.
          - texto: >-
              La barra solo añade axiles al pórtico: los flectores son los de
              la carga.
            trampa: true
            mensaje: |
              $X$ actúa en la base de los pilares, con brazo: los flecta con
              $-Xy$ y resta $Xb$ al flector del dintel. Por eso entra en la
              energía de flexión, y por eso la barra alivia el dintel.
    resolucion: |
      **El sistema.** Cortada la barra, el pórtico apoyado en B (fijo) y en F
      (móvil) es isostático: con la carga vertical, las reacciones son
      verticales, $q_0b/2$ en cada apoyo, los pilares no se flectan y el
      dintel trabaja como una viga apoyada, $M = q_0x(b - x)/2$, con $x$
      desde C. La barra es una fuerza interna $X$, positiva de tracción,
      que actúa sobre el pórtico en B y en F, hacia dentro.

      **La condición** (tema 13, ec. 13.54, p. 19). La coenergía de flexión
      del pórtico más la axial de la barra, $X^{2}b/(2EA)$, es estacionaria
      respecto de $X$:

      $$
      \frac{\partial C}{\partial X} = 0\ \Longleftrightarrow\ \delta_0 - X\,\delta_{11} = \frac{Xb}{EA}
      $$

      lo que se separan B y F en el pórtico es lo que se alarga la barra.
      Con positivo el flector que tracciona el lado de dentro y una pareja
      unidad que separa B y F ($m = y$ en los pilares, $m = b$ en el dintel):

      $$
      \delta_0 = \frac{1}{EI_z}\int_0^{b}\frac{q_0x(b - x)}{2}\,b\,dx = \frac{q_0b^{4}}{12EI_z},\qquad
      \delta_{11} = \frac{1}{EI_z}\left(2\int_0^{b}y^{2}\,dy + b^{3}\right) = \frac{5b^{3}}{3EI_z}
      $$

      **a/ La fuerza en la barra.**

      $$
      X = \frac{q_0b^{4}/(12EI_z)}{5b^{3}/(3EI_z) + b/(EA)} = \frac{q_0b}{20 + 12EI_z/(EA\,b^{2})}
      $$

      positiva: **de tracción**. Con una barra muy rígida tiende a
      $q_0b/20$; con una muy flexible, a cero. Con el ejemplo de los pasos,
      $EA\,b^{2} = 12EI_z$, $X = q_0b/21$. Los flectores finales son $-Xy$
      en los pilares y $q_0x(b - x)/2 - Xb$ en el dintel.

      **b/ El desplazamiento de F.** B es fijo y F se mueve en horizontal lo
      que se alarga la barra:

      $$
      \delta_F = \frac{Xb}{EA} = \frac{q_0b^{4}}{20EA\,b^{2} + 12EI_z}
      $$

      hacia la derecha; con el ejemplo, $q_0b^{4}/(252EI_z)$.

      **Comprobaciones.** El motor del curso resuelve el pórtico con la
      barra como tirante por Menabrea y da la misma $X$, también con otras
      dos barras, $EA\,b^{2} = 0{,}1EI_z$ y $3EI_z$, que casan con la fórmula
      general; con una fuerza unidad en F da el mismo desplazamiento. A
      mano, las integrales salen también numéricamente.
