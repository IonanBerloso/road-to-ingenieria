      <figcaption>

      Redibujada del Word original. El PDF pierde las flechas de las cargas,
      los números de las barras, los triángulos de los apoyos y la línea de
      la cota horizontal.

      </figcaption>
      </figure>

      **Notas nuestras.** Axiles positivos de tracción. Las dos diagonales
      se cruzan sin unirse.
    pide: >-
      a/ Los axiles de las cinco barras. b/ El desplazamiento horizontal de
      F.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular nada: ¿qué axil lleva la barra 4, la diagonal CF?
        opciones:
          - texto: >-
              Ninguno: en el nudo F solo la barra 4 tiene componente
              horizontal, y el apoyo móvil no da reacción horizontal
            correcta: true
            mensaje: |
              Eso es. En F concurren la barra 3, vertical, y la 4, y no hay
              cargas. El equilibrio horizontal de F deja sola a la 4:
              $N_4 = 0$.
          - texto: >-
              No se sabe sin las deformaciones: con las dos diagonales, la
              celosía es hiperestática
            mensaje: |
              Cinco barras y tres reacciones son ocho incógnitas, y cuatro
              nudos dan ocho ecuaciones: es isostática. Una celosía cuadrada
              con dos diagonales sería hiperestática con dos apoyos fijos; con
              uno móvil, no.
          - texto: >-
              Una compresión que lleva la 2P de C hasta el apoyo F
            mensaje: |
              La 2P la recoge la barra 2 hasta D, y la diagonal 5 la baja
              hasta B, que es el apoyo que da reacción horizontal. Por F no
              puede salir: el apoyo móvil no la toma.
      - tipo: calcular
        titulo: El axil de la barra 3
        pregunta: |
          ¿Cuánto vale el axil de la barra 3, la vertical DF, en unidades de
          $P$?
        respuesta:
          tipo: numero
          valor: '-3'
          tolerancia: 0.005
          formato: un número con su signo, el coeficiente de P (positivo de tracción)
        distractores:
          - valor: '3'
            mensaje: |
              El signo: en F, la reacción de $3P$ sube, y la barra 3 la
              equilibra empujando el nudo hacia abajo. Es de compresión.
          - valor: '-1'
            mensaje: |
              Te falta la $2P$ de C en el equilibrio de momentos: está a la
              altura $b$ y da respecto de B un momento $2Pb$, que también
              carga el apoyo F.
        pista: |
          Con $N_4 = 0$, en F la barra 3 equilibra sola la reacción vertical
          de F, que sale de los momentos respecto de B.
        desarrollo: |
          Momentos respecto de B:

          $$
          R_F\,b - P\,b - 2P\,b = 0\ \Rightarrow\ R_F = 3P
          $$

          hacia arriba. En F, $N_3 + R_F = 0$: $N_3 = -3P$, de compresión.
      - tipo: calcular
        titulo: El axil de la diagonal 5
        pregunta: |
          ¿Y el de la diagonal 5, BD, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '2.828'
          tolerancia: 0.005
          formato: un número con su signo, el coeficiente de P (positivo de tracción)
        distractores:
          - valor: '-2.828'
            mensaje: |
              El signo: la diagonal 5 tira de D hacia B para equilibrar la
              compresión de la barra 2, que empuja D hacia la derecha. Es de
              tracción.
          - valor: '1.414'
            mensaje: |
              Has multiplicado por $\cos 45^{\circ}$ en vez de dividir. La
              componente horizontal de la 5, $N_5/\sqrt{2}$, es la que vale
              $2P$.
          - valor: '2'
            mensaje: |
              Has igualado $N_5$ al axil de la barra 2, sin proyectar: solo su
              componente horizontal, $N_5/\sqrt{2}$, equilibra a la 2.
        pista: |
          En C, con $N_4 = 0$, la barra 2 equilibra sola la $2P$. En D, la
          componente horizontal de la 5 equilibra a la 2.
        desarrollo: |
          En C: $2P + N_2 = 0$ y $-P - N_1 = 0$, de donde $N_2 = -2P$ y
          $N_1 = -P$. En D, en horizontal:

          $$
          -N_2 - \frac{N_5}{\sqrt{2}} = 0\ \Rightarrow\ N_5 = 2\sqrt{2}\,P = 2{,}828\,P
          $$

          de tracción. En vertical, de comprobación:
          $-P - N_3 - N_5/\sqrt{2} = -P + 3P - 2P = 0$.
      - tipo: calcular
        titulo: El desplazamiento de F
        pregunta: |
          ¿Cuánto se mueve F en horizontal, en unidades de $Pb/EA$?
        respuesta:
          tipo: numero
          valor: '11.657'
          tolerancia: 0.01
          formato: un número con su signo, el coeficiente de P·b/EA (positivo hacia la derecha)
        distractores:
          - valor: '10.657'
            mensaje: |
              Es el desplazamiento horizontal de C. Al pasar de C a F por la
              barra 4, que no se alarga, falta lo que baja C: con $v_F = 0$,
              $u_F = u_C - v_C$, y $v_C = -Pb/EA$.
          - valor: '10'
            mensaje: |
              Has tomado la diagonal 5 de longitud $b$. Mide $\sqrt{2}\,b$, y
              se alarga $N_5\sqrt{2}\,b/EA = 4Pb/EA$.
          - valor: '0.3431'
            mensaje: |
              Has tomado la diagonal 5 comprimida. Es de tracción, y su
              alargamiento empuja D, y con él F, hacia la derecha.
          - valor: '-0.3431'
            mensaje: |
              Con la fuerza unidad horizontal en F, las barras 1, 2 y 3 quedan
              comprimidas, como con las cargas: $n = -1$, y sus productos
              $Nn$ suman, no restan.
        pista: |
          El proceso de deformación del tema 8 (apartado 8.4): los
          alargamientos $\Delta_i = N_iL_i/EA$ (ec. 8.9) y, nudo a nudo, la
          proyección del desplazamiento relativo sobre cada barra (ec. 8.10),
          con B fijo y $v_F = 0$. O Engesser con una fuerza unidad horizontal
          en F (tema 13).
        desarrollo: |
          Los alargamientos, en unidades de $Pb/EA$: $\Delta_1 = -1$,
          $\Delta_2 = -2$, $\Delta_3 = -3$, $\Delta_4 = 0$ y
          $\Delta_5 = 2\sqrt{2}\cdot\sqrt{2} = 4$. Con $x$ hacia la derecha e
          $y$ hacia arriba, nudo a nudo:

          - Barra 1, de B a C: $v_C = \Delta_1 = -1$.
          - Barra 3, de F a D: $v_D = \Delta_3 = -3$.
          - Barra 5, de B a D: $(u_D + v_D)/\sqrt{2} = \Delta_5$, así que
            $u_D = 4\sqrt{2} + 3 = 8{,}657$.
          - Barra 2, de C a D: $u_D - u_C = \Delta_2$, $u_C = 10{,}657$.
          - Barra 4, de C a F:
            $[(u_F - u_C) - (v_F - v_C)]/\sqrt{2} = \Delta_4 = 0$, así que
            $u_F = u_C - v_C$.

          $$
          u_F = (10{,}657 + 1)\,\frac{Pb}{EA} = (6 + 4\sqrt{2})\,\frac{Pb}{EA} = 11{,}657\,\frac{Pb}{EA}
          $$

          hacia la derecha.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En F solo la barra 4 tiene componente horizontal: $N_4 = 0$.
          - texto: >-
              Momentos respecto de B: $R_F = 3P$, y en F, $N_3 = -3P$.
          - texto: >-
              En C, $N_1 = -P$ y $N_2 = -2P$; en D, $N_5 = 2\sqrt{2}\,P$, de
              tracción.
          - texto: >-
              Con los alargamientos $N_iL_i/EA$ y la proyección nudo a nudo,
              desde B y F hacia C y D, F se mueve $(6 + 4\sqrt{2})Pb/EA$ hacia
              la derecha.
          - texto: >-
              Como $N_4 = 0$, la barra 4 sobra: se puede quitar sin que cambie
              el desplazamiento de F.
            trampa: true
            mensaje: |
              Sin la barra 4 la estructura es un mecanismo: F, sobre un apoyo
              móvil y unido solo a la barra 3, correría en horizontal sin que
              nada lo frenara. La barra 4 no trabaja, pero fija dónde queda F:
              $\Delta_4 = 0$ es la ecuación que da $u_F$.
    resolucion: |
      **La estructura.** Cuatro nudos dan ocho ecuaciones, y hay cinco barras
      y tres reacciones (dos en B, fijo, y una vertical en F, móvil): es
      isostática. Ejes: $x$ hacia la derecha, $y$ hacia arriba; B en el
      origen.

      **a/ Los axiles.** En el nudo F concurren solo las barras 3 y 4, y el
      apoyo no da reacción horizontal: el equilibrio horizontal de F da
      $N_4 = 0$. Momentos respecto de B:
      $R_F\,b - P\,b - 2P\,b = 0$, $R_F = 3P$; en vertical,
      $R_{By} = 2P - 3P = -P$ (hacia abajo), y en horizontal,
      $R_{Bx} = -2P$. Nudo a nudo:

      - F: $N_3 = -R_F = -3P$.
      - C: $2P + N_2 = 0$, $N_2 = -2P$; $-P - N_1 = 0$, $N_1 = -P$.
      - D: $-N_2 - N_5/\sqrt{2} = 0$, $N_5 = 2\sqrt{2}\,P$; en vertical,
        $-P - N_3 - N_5/\sqrt{2} = 0$, que se cumple.
      - B, de comprobación: $R_{Bx} + N_5/\sqrt{2} = 0$ y
        $R_{By} + N_1 + N_5/\sqrt{2} = -P - P + 2P = 0$.

      | Barra | 1 | 2 | 3 | 4 | 5 |
      |---|---|---|---|---|---|
      | $N$ | $-P$ | $-2P$ | $-3P$ | 0 | $2\sqrt{2}\,P$ |

      Las barras 1, 2 y 3 están comprimidas, y la 5, traccionada.

      **b/ El desplazamiento de F** (tema 8, apartado 8.4). Cada barra se
      alarga $\Delta_i = N_iL_i/EA$ (ec. 8.9), con $L_5 = \sqrt{2}\,b$; en
      unidades de $Pb/EA$: $-1$, $-2$, $-3$, 0 y 4. El alargamiento de una
      barra es la proyección sobre ella del desplazamiento relativo de sus
      nudos (ec. 8.10). Con B fijo y $v_F = 0$:

      $$
      v_C = \Delta_1 = -1,\quad v_D = \Delta_3 = -3,\quad u_D = \sqrt{2}\,\Delta_5 - v_D = 8{,}657,\quad u_C = u_D - \Delta_2 = 10{,}657
      $$

      y la barra 4, que no se alarga:

      $$
      u_F = u_C - v_C + \sqrt{2}\,\Delta_4 = (10{,}657 + 1)\,\frac{Pb}{EA} = (6 + 4\sqrt{2})\,\frac{Pb}{EA} = 11{,}657\,\frac{Pb}{EA}
      $$

      hacia la derecha.

      **Comprobación con Engesser** (tema 13, ec. 13.14). Con una fuerza
      unidad horizontal en F, hacia la derecha, los axiles son
      $n_1 = n_2 = n_3 = -1$ y $n_4 = n_5 = \sqrt{2}$, y

      $$
      u_F = \sum\frac{N_in_iL_i}{EA} = \frac{Pb}{EA}\left(1 + 2 + 3 + 0 + 2\sqrt{2}\cdot\sqrt{2}\cdot\sqrt{2}\right) = (6 + 4\sqrt{2})\,\frac{Pb}{EA}
      $$

      **Comprobaciones.** El motor del curso resuelve la celosía y da los
      mismos axiles y, con la fuerza unidad, el mismo desplazamiento; el
      método de rigidez de la celosía, montado a mano, da los
      desplazamientos de todos los nudos, que casan con los de la
      proyección nudo a nudo.

  # ── Problema 4 · el pórtico BCDF atado por la barra BF.
  - id: exerm1617-ext-8-el-portico-atado-por-la-barra-bf
    titulo: Un pórtico biapoyado atado por una barra entre sus apoyos, la fuerza de la barra y el desplazamiento del apoyo móvil
    fuente: >-
      Problema 4 · Extraordinaria del 16 de junio de 2017 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 1,5 puntos. El examen no publica resolución; el
      desarrollo es nuestro, con los convenios del curso, y cada cifra está
      comprobada por dos caminos.
    nivel: examen
    enunciado: |
      4.-(1,5p) En el pórtico BCDF de la figura, B es un apoyo fijo y F un
      apoyo móvil. La rigidez a flexión del pórtico es $EI_z$. B y F están
      unidos por una barra de área $A$ y módulo $E$. Teniendo en cuenta la
      energía de flexión del pórtico y la energía axial de la barra,
      determinar:

      a/ Fuerza en la barra BF, indicando si es de tracción o compresión.

      b/ Desplazamiento horizontal del punto F.

