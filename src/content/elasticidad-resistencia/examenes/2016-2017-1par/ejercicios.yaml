      </figcaption>
      </figure>

      **Notas nuestras.** Es la segunda mitad de la pregunta 3; la a/ va en
      el ejercicio anterior. Los sentidos de las flechas son los del Word: en
      la cara izquierda $N$ hacia $-x$, $T$ hacia arriba y $M$ horario; en la
      derecha, los tres al revés. Son los positivos del curso con $y$ hacia
      abajo.
    pide: >-
      Las tres ecuaciones de equilibrio de la rebanada: dN/dx, dT/dx y dM/dx.
    pasos:
      - tipo: reconocer
        pregunta: |
          Si $q_x$ estuviera aplicada en el eje de la pieza, las ecuaciones
          serían $dN/dx = -q_x$, $dT/dx = 0$ y $dM/dx = T$. ¿Qué cambia al
          aplicarla en la cara superior?
        opciones:
          - texto: >-
              Solo la de momentos: $q_x\,dx$ va a una distancia $h$ del eje y
              da un momento $h\,q_x\,dx$, así que $dM/dx = T + h\,q_x$
            correcta: true
            mensaje: |
              Eso es. Trasladar $q_x\,dx$ de la cara superior al eje cuesta un
              par $h\,q_x\,dx$. La fuerza sigue siendo axial, así que $N$ y $T$
              no se enteran de dónde está aplicada.
          - texto: Nada, porque $q_x$ es una fuerza axial y no da momento
            mensaje: |
              Daría momento cero si pasara por el eje, que es el caso de la
              ec. 7.8. En la cara superior va a una distancia $h$ del eje y su
              momento respecto del centro de la sección no es nulo.
          - texto: >-
              La de cortantes: $dT/dx = -q_x$, porque la carga está en la cara
              superior
            mensaje: |
              $T$ es la resultante según $y$, y $q_x$ va según $x$: no entra
              en $\sum F_y$. Estar arriba no la hace transversal; lo que le da
              es brazo para el momento.
      - tipo: calcular
        titulo: El flector en un voladizo cargado así, en un ejemplo
        pregunta: |
          Un ejemplo nuestro. Un voladizo de 5 m, libre en $x = 0$ y empotrado
          en $x = 5$ m, de canto $2h = 0{,}2$ m, lleva $q_x = 2$ kN/m hacia
          $+x$ en toda su cara superior. ¿Cuánto vale el flector $M$ en
          $x = 3$ m, en kN·m, con el convenio del curso?
        respuesta:
          tipo: numero
          valor: '0.6'
          tolerancia: 0.005
          formato: un número, en kN·m
        distractores:
          - valor: '0'
            mensaje: |
              Es lo que saldría con $q_x$ en el eje, donde no hay ninguna
              carga transversal. Aquí $dM/dx = T + h\,q_x$ y $T = 0$, así que
              $M$ crece con pendiente $h\,q_x = 0{,}2$ kN·m/m desde el extremo
              libre.
          - valor: '-0.6'
            mensaje: |
              El valor es ese, el signo no. Con la carga hacia $+x$ por encima
              del eje, el trozo izquierdo tiende a girar en sentido horario y
              la sección de la derecha responde con un $M$ antihorario, que es
              el positivo del curso (fibras de abajo a tracción): $M = +q_x\,x\,h$.
          - valor: '1.2'
            mensaje: |
              Has usado el canto entero, $2h = 0{,}2$ m, como brazo. La carga
              está en la cara superior y el momento se toma respecto del
              centro de la sección, que está a $h = 0{,}1$ m.
        pista: |
          Con el trozo de $0$ a $x$: la carga total es $q_x\,x$, va a $h$ por
          encima del eje y no hay más cargas.
        desarrollo: |
          En el trozo de $0$ a $x$: $\sum F_x = 0$ da $N = -q_x\,x = -6$ kN;
          $\sum F_y = 0$ da $T = 0$, y el momento respecto del centro de la
          sección,

          $$
          M = q_x\,x\,h = 2\cdot3\cdot0{,}1 = 0{,}6\ \text{kN·m}
          $$

          que cumple $dM/dx = T + h\,q_x = 0{,}2$ kN·m/m.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Deduce las tres ecuaciones como en el examen: la rebanada con sus
          esfuerzos y la carga, y el equilibrio de fuerzas y de momentos.
        rubrica:
          - punto: >-
              Se dibuja la rebanada de longitud dx y canto 2h con N, T y M en
              la cara izquierda y N + dN, T + dT y M + dM en la derecha, con
              los sentidos positivos del curso, y qx·dx en la cara superior.
            porque: >-
              Sin el dibujo con los sentidos no se pueden leer los signos de
              las ecuaciones, y el corrector lo mira primero.
            minimo: true
          - punto: >-
              ΣFx = 0: −N + (N + dN) + qx·dx = 0, de donde dN/dx = −qx.
            porque: >-
              Es la ec. 7.8 de los apuntes, que no cambia: la fuerza es la
              misma esté donde esté aplicada.
            minimo: true
          - punto: >-
              ΣFy = 0: no hay carga transversal y queda dT/dx = 0.
            porque: >-
              Sirve para no inventar un término: qx no tiene componente según
              y.
            minimo: true
          - punto: >-
              ΣM = 0 respecto del centro de la cara derecha, con el momento de
              qx·dx, que está a h por encima del eje: dM − T·dx − h·qx·dx = 0,
              y dM/dx = T + h·qx.
            porque: >-
              Es lo que la pregunta quiere ver: el término h·qx, que no está
              en la ec. 7.11 porque allí la carga va por el eje.
            minimo: true
          - punto: >-
              Se desprecian los términos de segundo orden (los que llevan dx²)
              y se dice por qué.
            porque: >-
              Si qx varía dentro de dx, la fuerza del tramo es qx·dx más un
              término en dx², que al dividir por dx se anula. Dónde cae su
              resultante a lo largo de dx no importa: es horizontal, y su
              brazo respecto del centro de la cara derecha es siempre h.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Se aísla la rebanada $dx$: $N$, $T$, $M$ en la cara izquierda,
              $N + dN$, $T + dT$, $M + dM$ en la derecha, y $q_x\,dx$ hacia
              $+x$ en la cara superior, a $h$ del eje.
          - texto: >-
              $\sum F_x = 0$: $dN + q_x\,dx = 0$, así que $dN/dx = -q_x$; y
              $\sum F_y = 0$ da $dT/dx = 0$.
          - texto: >-
              Momentos respecto del centro de la cara derecha:
              $dM - T\,dx - h\,q_x\,dx = 0$, así que $dM/dx = T + h\,q_x$.
          - texto: >-
              La carga es axial y pasa por la rebanada, así que no da momento
              y queda $dM/dx = T$, como en la ec. 7.11.
            trampa: true
            mensaje: |
              Pasa por la rebanada, pero no por el eje: está en la cara
              superior, a $h$ del centro de la sección. Su momento,
              $h\,q_x\,dx$, es del mismo orden que $T\,dx$ y no se puede
              tirar.
    resolucion: |
      **La rebanada.** Se aísla un trozo de pieza de longitud $dx$ y canto
      $2h$ (la figura). En la cara izquierda actúan $N$ (hacia $-x$, es decir,
      saliendo de la cara: tracción), $T$ hacia arriba y $M$ horario; en la
      derecha, $N + dN$ hacia $+x$, $T + dT$ hacia abajo y $M + dM$
      antihorario. Son los sentidos positivos del tema 7 con $y$ hacia abajo
      (figura 7.6). En la cara superior, a una distancia $h$ del eje, actúa
      $q_x\,dx$ hacia $+x$.

      **Fuerzas según $x$.**

      $$
      -N + (N + dN) + q_x\,dx = 0 \quad\Longrightarrow\quad \frac{dN}{dx} = -q_x
      $$

      **Fuerzas según $y$.** No hay carga transversal:

      $$
      T - (T + dT) = 0 \quad\Longrightarrow\quad \frac{dT}{dx} = 0
      $$

      **Momentos** respecto del centro de la cara derecha, antihorario
      positivo. $M + dM$ suma, $M$ resta, $T$ (hacia arriba, a $dx$ a la
      izquierda) da $-T\,dx$, $N$ pasa por el eje y no da nada, y $q_x\,dx$,
      hacia la derecha y a $h$ por encima del eje, da $-h\,q_x\,dx$:

      $$
      dM - T\,dx - h\,q_x\,dx = 0 \quad\Longrightarrow\quad \frac{dM}{dx} = T + h\,q_x
      $$

      Si $q_x$ varía con $x$, la fuerza del tramo es $q_x\,dx$ más un término
      de orden $dx^{2}$, que se desprecia. Dónde cae su resultante a lo largo
      de $dx$ no cambia su momento: es horizontal, y su brazo es siempre $h$.

      **Qué cambia respecto de los apuntes.** Con $q_x$ en el eje (ec. 7.8) la
      de momentos sería $dM/dx = T$. Llevar la carga a la cara superior es
      lo mismo que aplicarla en el eje más un par repartido $m = -h\,q_x$
      (horario): el axil no cambia y el flector gana la pendiente $h\,q_x$.

      **Comprobación con un ejemplo (nuestro).** Un voladizo libre en
      $x = 0$ y empotrado en $x = 5$ m, con $q_x = 2$ kN/m y $h = 0{,}1$ m. En
      $x = 3$ m: $N = -6$ kN, $T = 0$ y $M = q_x\,x\,h = 0{,}6$ kN·m. El motor
      del curso (`estructura.ts`, con la carga partida en 500 fuerzas en el
      eje y su par de traslado) da lo mismo, y la pendiente de su diagrama de
      $M$ entre 3 y 4 m es $0{,}2 = h\,q_x$.

  # ── Teoría · pregunta 4 · la compatibilidad en el plano.
  - id: exerm1617-1par-4-la-compatibilidad-en-el-plano
    titulo: Las condiciones de compatibilidad de deformaciones en el plano
    fuente: >-
      Pregunta 4 de teoría · Primer parcial de 2016-2017 (hoja de teoría del 7
      de noviembre de 2016) · Elasticidad y Resistencia de Materiales, Escuela
      de Ingeniería de Gipuzkoa (UPV/EHU). Vale 1 punto. La misma pregunta, con
      las mismas palabras, cayó en el primer parcial de 2015-2016. El examen no
      publica resolución; el desarrollo es nuestro y sigue los apuntes del
      tema 3, apartado 3.8 (ecs. 3.61 a 3.63). El paso de cálculo es un
      ejemplo nuestro.
    nivel: examen
    enunciado: |
      (1p) Deducir las condiciones de compatibilidad de deformaciones en el
      caso bidimensional.
    pide: >-
      La ecuación εx,yy + εy,xx = γxy,xy, deducida de que los desplazamientos
      y el giro son funciones del punto (diferenciales exactas).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué hace falta una condición de compatibilidad en el plano?
        opciones:
          - texto: >-
              Porque tres deformaciones, $\varepsilon_x$, $\varepsilon_y$ y
              $\gamma_{xy}$, salen de solo dos desplazamientos, $u$ y $v$: no
              pueden ser tres funciones cualesquiera
            correcta: true
            mensaje: |
              Eso es. Si se dan tres funciones al azar, en general no existe
              ningún $u$, $v$ que las produzca: al integrar, el sólido se
              abriría o se solaparía. La compatibilidad es la condición para
              que exista ese campo (apartado 3.8).
          - texto: >-
              Porque las tensiones tienen que estar en equilibrio
            mensaje: |
              Eso lo piden las ecuaciones de equilibrio (tema 2, ec. 2.4), que
              hablan de tensiones y fuerzas. La compatibilidad es puramente
              geométrica: no sabe nada de cargas ni del material.
          - texto: >-
              Porque el tensor de deformaciones tiene que ser simétrico
            mensaje: |
              Lo es por definición: $\varepsilon_{xy} = \tfrac12\gamma_{xy}$
              sale de sumar $u_{,y}$ y $v_{,x}$. La compatibilidad pide algo
              más, una relación entre las **derivadas** de las tres
              componentes.
      - tipo: calcular
        titulo: La γxy que hace compatible un campo, en un ejemplo
        pregunta: |
          Un ejemplo nuestro, con las coordenadas en m:

          $$
          \varepsilon_x = 2\cdot10^{-4}\,y^{2},\qquad \varepsilon_y = 3\cdot10^{-4}\,x^{2},\qquad \gamma_{xy} = c\cdot10^{-4}\,xy
          $$

          ¿Qué valor de $c$ hace el campo compatible?
        respuesta:
          tipo: numero
          valor: '10'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '5'
            mensaje: |
              Has metido la $\gamma_{xy}$ dada donde va la componente del
              tensor: con $\varepsilon_{xy}$ la ecuación es
              $\varepsilon_{x,yy} + \varepsilon_{y,xx} = 2\varepsilon_{xy,xy}$,
              y con la $\gamma$ ingenieril, sin el 2 (ec. 3.63).
          - valor: '-10'
            mensaje: |
              El signo: la 3.63 es $\varepsilon_{x,yy} + \varepsilon_{y,xx} =
              \gamma_{xy,xy}$, sin ningún menos. Sale de igualar las derivadas
              cruzadas del giro, y los dos lados suman.
        pista: |
          $\varepsilon_{x,yy} + \varepsilon_{y,xx} = \gamma_{xy,xy}$ (ec. 3.63).
        desarrollo: |
          $\varepsilon_{x,yy} = 4\cdot10^{-4}$, $\varepsilon_{y,xx} = 6\cdot10^{-4}$
          y $\gamma_{xy,xy} = c\cdot10^{-4}$, así que $c = 10$. Ese campo lo
          producen $u = 2\cdot10^{-4}xy^{2}$ y $v = 3\cdot10^{-4}x^{2}y$: con
          ellos $\gamma_{xy} = u_{,y} + v_{,x} = 10\cdot10^{-4}xy$. Con
          cualquier otra $c$ no hay desplazamientos que lo den.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Deduce la condición de compatibilidad en el plano como en el examen,
          desde las diferenciales de los desplazamientos.
        rubrica:
          - punto: >-
              Se plantea el problema: tres deformaciones (εx, εy, γxy) que
              dependen de solo dos desplazamientos (u, v), y por eso no son
              independientes.
            porque: >-
              Es el porqué de la pregunta. Sin él, la ecuación final parece un
              resultado suelto.
            minimo: true
          - punto: >-
              Se escriben du y dv en función de las deformaciones y del giro:
              du = εx dx + (½γxy + ωxy) dy y dv = (½γxy − ωxy) dx + εy dy
              (ec. 3.61).
            porque: >-
              Es el punto de partida de los apuntes: el desplazamiento relativo
              es deformación pura más giro.
            minimo: true
          - punto: >-
              Se exige que du y dv sean diferenciales exactas (derivadas
              cruzadas iguales) y salen las derivadas del giro:
              ωxy,x = εx,y − ½γxy,x y ωxy,y = ½γxy,y − εy,x (ec. 3.62).
            porque: >-
              Diferencial exacta quiere decir que u y v son funciones del
              punto, no del camino de integración: que el sólido no se abre.
            minimo: true
          - punto: >-
              Se exige lo mismo al giro, ωxy,xy = ωxy,yx, y se elimina ω: queda
              εx,yy + εy,xx = γxy,xy (ec. 3.63).
            porque: >-
              Es la respuesta. El giro también tiene que ser función del
              punto.
            minimo: true
          - punto: >-
              Se dice qué hace falta para cruzar las derivadas: segundas
              derivadas de las deformaciones continuas (teorema de Schwarz), o
              terceras de los desplazamientos.
            porque: >-
              Es la hipótesis de la deducción, y los apuntes la nombran.
          - punto: >-
              Se puede llegar también derivando: εx = u,x dos veces respecto de
              y, εy = v,y dos veces respecto de x y γxy = u,y + v,x respecto de
              x y de y; los dos lados dan u,xyy + v,xxy.
            porque: >-
              Es el camino corto, y vale: enseña que la condición es necesaria.
              El de los apuntes enseña además que basta.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              $du = \varepsilon_x\,dx + \left(\tfrac12\gamma_{xy} + \omega_{xy}\right)dy$
              y $dv = \left(\tfrac12\gamma_{xy} - \omega_{xy}\right)dx + \varepsilon_y\,dy$
              (ec. 3.61).
          - texto: >-
              Para que sean diferenciales exactas, las derivadas cruzadas son
              iguales: $\omega_{xy,x} = \varepsilon_{x,y} - \tfrac12\gamma_{xy,x}$
              y $\omega_{xy,y} = \tfrac12\gamma_{xy,y} - \varepsilon_{y,x}$.
          - texto: >-
              El giro también es función del punto: $\omega_{xy,xy} = \omega_{xy,yx}$.
          - texto: >-
              Sustituyendo, $\varepsilon_{x,yy} - \tfrac12\gamma_{xy,xy} = \tfrac12\gamma_{xy,xy} - \varepsilon_{y,xx}$,
              es decir, $\varepsilon_{x,yy} + \varepsilon_{y,xx} = \gamma_{xy,xy}$.
          - texto: >-
              Como el giro es un movimiento de sólido rígido, no deforma, y se
              puede tomar $\omega_{xy} = 0$ desde el principio.
            trampa: true
            mensaje: |
              El giro no deforma, pero no es constante: cambia de un punto a
              otro, y sus derivadas son justo las que enlazan las tres
              deformaciones. Con $\omega_{xy} = 0$ saldrían condiciones de
              más, que un campo compatible cualquiera no cumple.
    resolucion: |
      **El problema.** En el plano hay tres deformaciones, $\varepsilon_x$,
      $\varepsilon_y$ y $\gamma_{xy}$, y solo dos desplazamientos, $u$ y $v$.
      Para poder obtener los desplazamientos integrando las deformaciones,
      estas tienen que cumplir una condición de integrabilidad: la ecuación
      de compatibilidad (apuntes del tema 3, apartado 3.8).

      **Las diferenciales.** El desplazamiento relativo de dos puntos
      próximos es deformación pura más giro (ec. 3.61):

      $$
      \begin{aligned}
      du &= \varepsilon_x\,dx + \left(\tfrac12\gamma_{xy} + \omega_{xy}\right)dy\\
      dv &= \left(\tfrac12\gamma_{xy} - \omega_{xy}\right)dx + \varepsilon_y\,dy
      \end{aligned}
      $$

      **Primera condición: $u$ y $v$ son funciones del punto.** Para que
      $du$ y $dv$ sean diferenciales exactas, sus derivadas cruzadas tienen
      que ser iguales. De ahí salen las derivadas del giro (ec. 3.62):

      $$
      \omega_{xy,x} = \varepsilon_{x,y} - \tfrac12\gamma_{xy,x},\qquad
      \omega_{xy,y} = \tfrac12\gamma_{xy,y} - \varepsilon_{y,x}
      $$

      **Segunda condición: el giro también.** $\omega_{xy}$ tiene que ser una
      diferencial exacta, $\omega_{xy,xy} = \omega_{xy,yx}$. Derivando la
      primera respecto de $y$ y la segunda respecto de $x$:

      $$
      \varepsilon_{x,yy} - \tfrac12\gamma_{xy,xy} = \tfrac12\gamma_{xy,xy} - \varepsilon_{y,xx}
      \quad\Longrightarrow\quad
      \varepsilon_{x,yy} + \varepsilon_{y,xx} = \gamma_{xy,xy}
      $$

      que es la ec. 3.63, la condición de compatibilidad en el plano.

      **La hipótesis.** Se ha usado $\gamma_{xy,xy} = \gamma_{xy,yx}$ y
      $\varepsilon_{x,yy}$, $\varepsilon_{y,xx}$ continuas: por el teorema de
      Schwarz, hace falta que las segundas derivadas de las deformaciones
      sean continuas, o, lo que es lo mismo, las terceras de los
      desplazamientos. En el espacio salen seis ecuaciones análogas
      (ec. 3.64).

      **El camino corto.** Con $\varepsilon_x = u_{,x}$, $\varepsilon_y = v_{,y}$
      y $\gamma_{xy} = u_{,y} + v_{,x}$:
      $\varepsilon_{x,yy} + \varepsilon_{y,xx} = u_{,xyy} + v_{,yxx} = \gamma_{xy,xy}$.
      Enseña que la condición es necesaria; el de los apuntes, que también
      basta para que existan $u$ y $v$.

      **Un ejemplo (nuestro).** Con $\varepsilon_x = 2\cdot10^{-4}y^{2}$ y
      $\varepsilon_y = 3\cdot10^{-4}x^{2}$, la única $\gamma_{xy} = c\cdot10^{-4}xy$
      compatible es la de $c = 10$. El motor del curso lo confirma con el
      campo $u = 2\cdot10^{-4}xy^{2}$, $v = 3\cdot10^{-4}x^{2}y$: deformando
      dos aristas $dx$ y $dy$ en el punto (1, 1) y midiendo cuánto se cierra
      el ángulo recto (`gammaDeAristas`), sale $\gamma_{xy} = 10\cdot10^{-4}$.


  # ── Problema 1 · el tensor con x principal: principales y el plano a 45° y 60°.
  - id: exerm1617-1par-5-el-tensor-con-x-principal
    titulo: Un tensor con el eje x ya principal, y el plano que forma 45° con x y 60° con y
    fuente: >-
      Ejercicio 1 · Primer parcial de 2016-2017 (hoja de ejercicios del 14 de
      noviembre de 2016) · Elasticidad y Resistencia de Materiales, Escuela de
      Ingeniería de Gipuzkoa (UPV/EHU). Vale 2 puntos, 50 % cada apartado. El
      examen no publica resolución; el desarrollo es nuestro y sigue los
      apuntes del tema 2.
    nivel: examen
    enunciado: |
      (2p) La matriz de tensiones en un punto interior de un sólido elástico,
      referida a un sistema cartesiano ortogonal O$xyz$, es

      $$
      [\sigma] = \begin{bmatrix} 5 & 0 & 0\\ 0 & -6 & -12\\ 0 & -12 & 1 \end{bmatrix}\ \text{MPa}
      $$

      a/ (50%) Determinar las tensiones y direcciones principales.

      b/ (50%) Calcular las componentes intrínsecas del vector tensión
      correspondiente al plano cuyo vector unitario normal forma 45º con el eje
      $x$ y 60º con el eje $y$.

      **Notas nuestras.** Dos ángulos no fijan del todo la normal: con 45° y
      60°, $n_z^{2} = 1 - \tfrac12 - \tfrac14 = \tfrac14$, y el ángulo con $z$
      puede ser de 60° ($n_z = \tfrac12$) o de 120° ($n_z = -\tfrac12$). El
      enunciado no elige; se resuelven los dos planos y los pasos aceptan
      cualquiera.
    pide: >-
      a) σ1, σ2, σ3 y sus direcciones. b) σn y τn del plano de normal
      (cos 45°, cos 60°, ±½), en MPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular nada: ¿qué dice la primera fila de la matriz?
        opciones:
          - texto: >-
              Que $x$ es dirección principal y 5 MPa una tensión principal:
              en la cara $x$ no hay tangenciales, y lo que queda es un bloque
              de 2×2 en $yz$
            correcta: true
            mensaje: |
              Eso es. $[\sigma]\{1, 0, 0\} = \{5, 0, 0\}$: el vector tensión
              de la cara $x$ es normal a ella. La cúbica se parte en
              $(5 - \sigma)$ por una de segundo grado.
          - texto: >-
              Que $\sigma_x = 5$ MPa es la tensión principal mayor, porque es
              la única positiva de la diagonal que no lleva tangenciales
            mensaje: |
              Es principal, pero nada dice que sea la mayor. El bloque $yz$
              tiene sus propias principales, y aquí una de ellas, 10 MPa, es
              mayor: 5 MPa resulta ser $\sigma_2$.
          - texto: >-
              Que las tensiones principales son la diagonal: 5, −6 y 1 MPa
            mensaje: |
              Eso solo pasa si **todas** las tangenciales son nulas. Aquí
              $\tau_{yz} = -12$ y la diagonal del bloque $yz$ no es principal.
              La traza sí se conserva: $5 - 6 + 1 = 0$, y la suma de las
              principales también tiene que dar 0.
      - tipo: calcular
        titulo: La tensión principal mayor
        pregunta: |
          ¿Cuánto vale $\sigma_1$, en MPa?
        respuesta:
          tipo: numero
          valor: '10'
          tolerancia: 0.01
          formato: un número, en MPa
        distractores:
          - valor: '11.39'
            mensaje: |
              Has tomado de radio $\sqrt{(\sigma_y - \sigma_z)^{2} + \tau_{yz}^{2}} = \sqrt{49 + 144}$.
              En el radio va la **mitad** de la diferencia:
              $\sqrt{3{,}5^{2} + 12^{2}} = 12{,}5$, y $\sigma_1 = -2{,}5 + 12{,}5$.
          - valor: '12.5'
            mensaje: |
              Es el radio del círculo de Mohr del bloque $yz$. La principal es
              el centro más el radio: $\sigma_1 = \tfrac{-6 + 1}{2} + 12{,}5 = 10$.
        pista: |
          Bloque $yz$: centro $\tfrac{\sigma_y + \sigma_z}{2}$ y radio
          $\sqrt{\left(\tfrac{\sigma_y - \sigma_z}{2}\right)^{2} + \tau_{yz}^{2}}$.
        desarrollo: |
          $(-6 - \sigma)(1 - \sigma) - 144 = 0$, es decir,
          $\sigma^{2} + 5\sigma - 150 = 0$, con raíces 10 y $-15$. Con el 5 de
          $x$: $\sigma_1 = 10$, $\sigma_2 = 5$ y $\sigma_3 = -15$ MPa. La traza
          es 0 y $10 + 5 - 15 = 0$.
      - tipo: calcular
        titulo: La dirección principal 1
        pregunta: |
          La dirección de $\sigma_1$ es $(0,\ n_y,\ n_z)$. Tomando $n_y > 0$,
          ¿cuánto vale $n_z$?
        respuesta:
          tipo: numero
          valor: '-0.8'
          tolerancia: 0.005
          formato: un número (componente de un vector unitario)
        distractores:
          - valor: '0.8'
            mensaje: |
              Te ha cambiado el signo de $\tau_{yz}$. La primera ecuación es
              $(\sigma_y - \sigma_1)n_y + \tau_{yz}n_z = 0$, es decir,
              $-16n_y - 12n_z = 0$: $n_z = -\tfrac43 n_y$, con signo contrario
              a $n_y$.
          - valor: '0.6'
            mensaje: |
              Es la $n_z$ de la dirección de $\sigma_3 = -15$, $(0;\ 0{,}8;\ 0{,}6)$.
              Con $\sigma_1 = 10$ la ecuación es $(-6 - 10)n_y - 12n_z = 0$.
        pista: |
          $(\sigma_y - \sigma_1)\,n_y + \tau_{yz}\,n_z = 0$ y $n_y^{2} + n_z^{2} = 1$.
        desarrollo: |
          $-16n_y - 12n_z = 0 \Rightarrow n_z = -\tfrac43 n_y$, y normalizando,
          $n_1 = (0;\ 0{,}6;\ -0{,}8)$. Igual, $n_3 = (0;\ 0{,}8;\ 0{,}6)$, y
          $n_2 = (1;\ 0;\ 0)$. Las tres son perpendiculares.
      - tipo: calcular
        titulo: La tensión normal en el plano del apartado b/
        pregunta: |
          Para el plano de b/, ¿cuánto vale la tensión normal $\sigma_n$, en
          MPa? Hay dos planos posibles, $n_z = \pm\tfrac12$: aquí se resuelve
          el de $n_z = +\tfrac12$, y el otro también vale.
        respuesta:
          tipo: numero
          valor: '-4.75'
          tolerancia: 0.01
          formato: un número, en MPa
        tambienValen:
          - valor: '7.25'
            mensaje: |
              Es la del otro plano, el de $n_z = -\tfrac12$ (120° con $z$).
              El enunciado no elige entre los dos, así que vale; con
              $n_z = +\tfrac12$ sale $-4{,}75$ MPa.
        distractores:
          - valor: '1.25'
            mensaje: |
              Has usado solo la diagonal, $5\cdot\tfrac12 - 6\cdot\tfrac14 + 1\cdot\tfrac14$.
              Fuera de ejes principales falta el término de las tangenciales,
              $2\tau_{yz}n_yn_z$, que vale $-6$ con $n_z = +\tfrac12$ y $+6$
              con $n_z = -\tfrac12$.
          - valor: '11.12'
            mensaje: |
              Es el módulo del vector tensión, $|\vec{S}| = \sqrt{123{,}75}$.
              La componente normal es su **proyección** sobre la normal,
              $\sigma_n = \vec{S}\cdot\hat{n}$, y aquí es negativa.
        pista: |
          $\{S\} = [\sigma]\{n\}$ con $\hat{n} = (\tfrac{\sqrt2}{2},\ \tfrac12,\ \tfrac12)$,
          y $\sigma_n = \{n\}^{t}\{S\}$.
        desarrollo: |
          $\vec{S} = \left(\tfrac{5\sqrt2}{2};\ -3 - 6;\ -6 + \tfrac12\right) = (3{,}536;\ -9;\ -5{,}5)$ MPa,
          y

          $$
          \sigma_n = 3{,}536\cdot0{,}7071 - 9\cdot0{,}5 - 5{,}5\cdot0{,}5 = 2{,}5 - 4{,}5 - 2{,}75 = -4{,}75\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La tensión tangencial en ese plano
        pregunta: |
          En el mismo plano que hayas tomado para $\sigma_n$, ¿cuánto vale el
          módulo de la tensión tangencial $\tau_n$, en MPa?
        respuesta:
          tipo: numero
          valor: '10.06'
          tolerancia: 0.01
          formato: un número, en MPa
        tambienValen:
          - valor: '3.345'
            mensaje: |
              Es la del plano de $n_z = -\tfrac12$, donde
              $\vec{S} = (3{,}536;\ 3;\ -6{,}5)$ y $\sigma_n = 7{,}25$ MPa. El
              enunciado no elige plano, así que vale.
        distractores:
          - valor: '11.12'
            mensaje: |
              Es $|\vec{S}|$ entero. La tangencial es lo que queda al quitarle
              la normal: $\tau_n = \sqrt{|\vec{S}|^{2} - \sigma_n^{2}}$.
          - valor: '12.10'
            mensaje: |
              Has **sumado** los cuadrados, $\sqrt{|\vec{S}|^{2} + \sigma_n^{2}}$.
              $\vec{S}$ es la hipotenusa: $|\vec{S}|^{2} = \sigma_n^{2} + \tau_n^{2}$,
              así que se restan.
        pista: |
          $\tau_n = \sqrt{|\vec{S}|^{2} - \sigma_n^{2}}$ (ec. 2.16).
        desarrollo: |
          $|\vec{S}|^{2} = 12{,}5 + 81 + 30{,}25 = 123{,}75$, y
          $\tau_n = \sqrt{123{,}75 - 4{,}75^{2}} = \sqrt{101{,}19} = 10{,}06$ MPa.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La fila y la columna de $x$ no tienen tangenciales: $x$ es
              dirección principal con $\sigma = 5$ MPa.
          - texto: >-
              El bloque $yz$ da $\sigma^{2} + 5\sigma - 150 = 0$: 10 y $-15$.
              Ordenadas, $\sigma_1 = 10$, $\sigma_2 = 5$, $\sigma_3 = -15$ MPa,
              y la traza, 0, se conserva.
          - texto: >-
              Con $(\sigma_y - \sigma)n_y + \tau_{yz}n_z = 0$:
              $n_1 = (0;\ 0{,}6;\ -0{,}8)$ y $n_3 = (0;\ 0{,}8;\ 0{,}6)$;
              $n_2 = (1;\ 0;\ 0)$.
          - texto: >-
              Para b/, $\hat{n} = (\cos45^{\circ},\ \cos60^{\circ},\ \pm\tfrac12)$; con
              $\{S\} = [\sigma]\{n\}$, $\sigma_n = \{n\}^{t}\{S\}$ y
              $\tau_n = \sqrt{|S|^{2} - \sigma_n^{2}}$.
          - texto: >-
              Las direcciones principales del bloque $yz$ forman 45° con $y$ y
              con $z$, como en todo estado plano con tangencial.
            trampa: true
            mensaje: |
              Solo cuando $\sigma_y = \sigma_z$. En general,
              $\operatorname{tg}2\theta = 2\tau_{yz}/(\sigma_y - \sigma_z) = -24/(-7)$,
              y aquí la dirección 1 forma unos 53° con $y$, no 45°.
    resolucion: |
      **a/ Tensiones principales.** La primera fila y la primera columna
      solo tienen el término de la diagonal: el vector tensión de la cara $x$
      es $\{5, 0, 0\}$, normal a ella. Así que $x$ es dirección principal y
      $\sigma = 5$ MPa es una tensión principal. Las otras dos salen del
      bloque $yz$:

      $$
      \begin{vmatrix} -6 - \sigma & -12\\ -12 & 1 - \sigma \end{vmatrix} = 0
      \quad\Longrightarrow\quad \sigma^{2} + 5\sigma - 150 = 0
      \quad\Longrightarrow\quad \sigma = 10,\ \ \sigma = -15
      $$

      Ordenadas:

      $$
      \sigma_1 = 10\ \text{MPa},\qquad \sigma_2 = 5\ \text{MPa},\qquad \sigma_3 = -15\ \text{MPa}
      $$

      Comprobación con los invariantes: $I_1 = 5 - 6 + 1 = 0 = 10 + 5 - 15$;
      $I_2 = -30 - 6 + 5 - 144 = -175 = 50 - 75 - 150$; e
      $I_3 = 5\,(-6 - 144) = -750 = 10\cdot5\cdot(-15)$.

      **Direcciones principales.** Para $\sigma_1 = 10$:
      $(-6 - 10)n_y - 12n_z = 0$, así que $n_z = -\tfrac43n_y$ y

      $$
      n_1 = \pm(0;\ 0{,}6;\ -0{,}8),\qquad n_2 = \pm(1;\ 0;\ 0),\qquad n_3 = \pm(0;\ 0{,}8;\ 0{,}6)
      $$

      ($n_3$ sale igual con $\sigma = -15$: $9n_y - 12n_z = 0$). Las tres son
      perpendiculares entre sí. Para un triedro directo basta elegir los
      signos: por ejemplo, $n_1 = (0;\ 0{,}6;\ -0{,}8)$, $n_2 = (1;\ 0;\ 0)$ y
      $n_3 = n_1\times n_2 = (0;\ -0{,}8;\ -0{,}6)$.

      **b/ La normal.** Forma 45° con $x$ y 60° con $y$:
      $n_x = \cos45^{\circ} = 0{,}7071$, $n_y = \cos60^{\circ} = 0{,}5$, y
      $n_z = \pm\sqrt{1 - 0{,}5 - 0{,}25} = \pm0{,}5$. El enunciado no elige
      el signo; se dan los dos planos.

      **Con $n_z = +\tfrac12$:**

      $$
      \{S\} = [\sigma]\{n\} = \begin{Bmatrix} 3{,}536\\ -9\\ -5{,}5 \end{Bmatrix}\ \text{MPa},\qquad
      \sigma_n = \{n\}^{t}\{S\} = -4{,}75\ \text{MPa},\qquad
      \tau_n = \sqrt{123{,}75 - 4{,}75^{2}} = 10{,}06\ \text{MPa}
      $$

      **Con $n_z = -\tfrac12$:**

      $$
      \{S\} = \begin{Bmatrix} 3{,}536\\ 3\\ -6{,}5 \end{Bmatrix}\ \text{MPa},\qquad
      \sigma_n = 7{,}25\ \text{MPa},\qquad
      \tau_n = \sqrt{63{,}75 - 7{,}25^{2}} = 3{,}345\ \text{MPa}
      $$

      **Comprobación por las principales.** $\sigma_n = \sum\sigma_i\,(\hat{n}\cdot n_i)^{2}$:
      con $n_z = +\tfrac12$, los cosenos con $n_1$, $n_2$ y $n_3$ son
      $-0{,}1$, $0{,}7071$ y $0{,}7$, y
      $10\cdot0{,}01 + 5\cdot0{,}5 - 15\cdot0{,}49 = -4{,}75$. El motor del
      curso (`principalesTension`, `normalPorAngulos` y
      `componentesIntrinsecas`) da las mismas cifras para los dos planos.

  # ── Problema 2 · la roseta de 0°, 60° y 150°: principales, Mohr y fallo.
  - id: exerm1617-1par-6-la-roseta-de-0-60-y-150
    titulo: Una roseta de 0°, 60° y 150° en tensión plana, sus círculos de Mohr y el fallo
    fuente: >-
      Ejercicio 2 · Primer parcial de 2016-2017 (hoja de ejercicios del 14 de
      noviembre de 2016) · Elasticidad y Resistencia de Materiales, Escuela de
      Ingeniería de Gipuzkoa (UPV/EHU). Vale 2 puntos: 60 % el apartado a/ y
      20 % el b/ y el c/. El examen no publica resolución; el desarrollo es
      nuestro, con los convenios de los temas 3, 4 y 6.
    nivel: examen
    enunciado: |
      (2p) En un estado de tensión plana, las galgas extensométricas de la
      figura proporcionan las siguientes medidas:

      $\varepsilon_a$= 800·10⁻⁶; $\varepsilon_b$ = 800·10⁻⁶; $\varepsilon_c$ = 200·10⁻⁶

      Determinar:

      a/ (60%) Deformaciones y tensiones principales en el espacio y círculos
      de Mohr correspondientes.

      b/ (20%) Tensión tangencial y deformación tangencial máximas.

      c/ (20%) Factores de seguridad según los criterios de Tresca y de Von
      Mises.

      Datos: $E$ = 70 GPa ; $\nu$ = 0,35, $\sigma_L$ = 200 MPa

