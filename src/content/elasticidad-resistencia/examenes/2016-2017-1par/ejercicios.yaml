      **Notas nuestras.** Junto a cada barra va su número y, debajo, $A$: la
      sección. Los tres pasadores del techo están a la misma altura, así que
      las barras 1 y 2 miden $b/\cos\eta$ y la 3, montada, $b$. El ángulo
      $\eta$ no tiene valor en el enunciado: la respuesta va en función de
      $\eta$, y los pasos de cálculo la evalúan en $\eta = 30^{\circ}$.
    pide: >-
      N1, N2 y N3 en función de E, A, ξ, b y η (con su signo), y el giro de la
      viga.
    pasos:
      - tipo: reconocer
        pregunta: |
          No hay ninguna carga exterior. ¿Cómo se plantea el problema?
        opciones:
          - texto: >-
              Es hiperestático: la viga solo puede girar un $\theta$ alrededor
              de A, y con ese giro se escriben los alargamientos de las tres
              barras (compatibilidad); el equilibrio de momentos en A cierra
              el sistema
            correcta: true
            mensaje: |
              Eso es. Cinco incógnitas de fuerza ($N_1$, $N_2$, $N_3$ y las dos
              de A) y tres ecuaciones de equilibrio: hacen falta las de
              compatibilidad, y todas salen de un solo giro $\theta$.
          - texto: Sin cargas no hay fuerzas en las barras
            mensaje: |
              En un isostático sería así. Aquí la barra 3 no llega a C y hay
              que forzarla para montarla: quedan fuerzas que se equilibran
              entre sí, sin carga exterior. Son las tensiones de montaje del
              tema 8.
          - texto: >-
              La barra 3 se estira todo lo que le falta: $N_3 = EA\xi/b$, y
              las barras 1 y 2 no trabajan
            mensaje: |
              Eso supone que C no se mueve. La barra 3 tira de C hacia arriba,
              la viga gira alrededor de A y empuja hacia arriba las barras 1 y
              2, que se acortan y empujan hacia abajo. El hueco $\xi$ se
              reparte entre el estiramiento de la 3 y la subida de C.
      - tipo: calcular
        titulo: El giro de la viga, con η = 30°
        pregunta: |
          Con $\eta = 30^{\circ}$, el giro de la viga sube C una distancia $2a\theta$.
          ¿Cuánto vale $a\theta/\xi$?
        respuesta:
          tipo: numero
          valor: '0.3774'
          tolerancia: 0.0005
          formato: un número (aθ dividido por ξ)
        distractores:
          - valor: '0.5'
            mensaje: |
              Es lo que saldría si las barras 1 y 2 no estuvieran: la viga
              giraría hasta que C tocara la barra 3, $2a\theta = \xi$. Las
              barras 1 y 2 frenan ese giro, y C se queda más abajo.
          - valor: '0'
            mensaje: |
              Supone que la viga no se mueve y que la barra 3 se estira todo
              lo que le falta. Pero la barra 3 tira de C, y lo único que
              sujeta a la viga además de A son las barras 1 y 2, que ceden.
        pista: |
          Compatibilidad: $\delta_1 = \delta_2 = -a\theta\cos\eta$,
          $\delta_3 = \xi - 2a\theta$. Equilibrio en A:
          $2aN_1\cos\eta + 2aN_3 = 0$.
        desarrollo: |
          Con $N_1 = EA\,\delta_1\cos\eta/b$ y $N_3 = EA\,\delta_3/b$, el
          equilibrio da $\xi - 2a\theta = a\theta\cos^{3}\eta$, así que

          $$
          \frac{a\theta}{\xi} = \frac{1}{2 + \cos^{3}\eta} = \frac{1}{2 + 0{,}6495} = 0{,}3774
          $$
      - tipo: calcular
        titulo: La fuerza en la barra 3, con η = 30°
        pregunta: |
          Con $\eta = 30^{\circ}$, ¿cuánto vale $N_3\,b/(EA\xi)$, con su signo
          (tracción positiva)?
        respuesta:
          tipo: numero
          valor: '0.2451'
          tolerancia: 0.0005
          formato: un número (N3 en unidades de EAξ/b)
        distractores:
          - valor: '-0.2451'
            mensaje: |
              El valor es ese y el signo no. La barra 3 es **corta**: para
              montarla hay que estirarla, y queda a tracción. A compresión
              quedaría una barra fabricada larga.
          - valor: '1'
            mensaje: |
              Supone que C no sube y que la barra 3 se estira el $\xi$ entero.
              La viga gira y C sube $2a\theta = 0{,}755\,\xi$: la barra solo
              se estira lo que queda, $0{,}245\,\xi$.
          - valor: '0.2727'
            mensaje: |
              Te sale $\cos^{2}\eta$ donde va $\cos^{3}\eta$. Al alargamiento
              de las barras inclinadas le llega la subida de B **proyectada**
              sobre la barra, $a\theta\cos\eta$, y su longitud es
              $b/\cos\eta$, no $b$: son dos cosenos en la rigidez y otro en el
              momento.
        pista: |
          $N_3 = \dfrac{EA}{b}\,(\xi - 2a\theta)$, con el $a\theta$ del paso
          anterior.
        desarrollo: |
          $$
          N_3 = \frac{EA}{b}\,\xi\left(1 - \frac{2}{2 + \cos^{3}\eta}\right) = \frac{EA\xi}{b}\,\frac{\cos^{3}\eta}{2 + \cos^{3}\eta} = 0{,}2451\,\frac{EA\xi}{b}
          $$
      - tipo: calcular
        titulo: La fuerza en las barras 1 y 2, con η = 30°
        pregunta: |
          Con $\eta = 30^{\circ}$, ¿cuánto vale $N_1\,b/(EA\xi)$ (igual que
          $N_2$), con su signo?
        respuesta:
          tipo: numero
          valor: '-0.2831'
          tolerancia: 0.0005
          formato: un número (N1 en unidades de EAξ/b)
        distractores:
          - valor: '0.2831'
            mensaje: |
              El signo: la viga sube en B y acerca B a los pasadores del
              techo; las barras 1 y 2 se **acortan** y quedan a compresión.
          - valor: '-0.2727'
            mensaje: |
              En el momento en A has puesto $N_1$ con brazo $a$ sin
              proyectarla: solo su componente vertical, $N_1\cos\eta$, da
              momento respecto de A, porque B está a la altura de A.
        pista: |
          $N_1 = -N_3/\cos\eta$, del equilibrio de momentos en A.
        desarrollo: |
          $$
          N_1 = N_2 = -\frac{EA\xi}{b}\,\frac{\cos^{2}\eta}{2 + \cos^{3}\eta} = -0{,}2831\,\frac{EA\xi}{b}
          $$

          y se comprueba $2aN_1\cos\eta + 2aN_3 = 0$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La viga solo puede girar un $\theta$ (antihorario) alrededor de
              A: B sube $a\theta$ y C sube $2a\theta$.
          - texto: >-
              Compatibilidad: las barras 1 y 2 se acortan
              $a\theta\cos\eta$; la 3 se alarga $\xi - 2a\theta$ desde su
              longitud de fabricación.
          - texto: >-
              Comportamiento: $N_1 = N_2 = -\tfrac{EA}{b}a\theta\cos^{2}\eta$
              (miden $b/\cos\eta$) y $N_3 = \tfrac{EA}{b}(\xi - 2a\theta)$.
          - texto: >-
              Momentos en A: $2aN_1\cos\eta + 2aN_3 = 0$; de ahí
              $a\theta = \xi/(2 + \cos^{3}\eta)$ y las tres fuerzas.
          - texto: >-
              Sin cargas exteriores, el equilibrio de la viga da
              $N_1 = N_2 = N_3 = 0$.
            trampa: true
            mensaje: |
              El equilibrio sin cargas solo dice que las fuerzas se compensan
              entre sí, $N_3 = -N_1\cos\eta$, no que sean nulas. Quien fija su
              valor es la compatibilidad: la barra 3 no cabe sin estirarse.
    resolucion: |
      **Qué pasa.** La barra 3 es $\xi$ más corta que la distancia entre su
      pasador del techo y C. Para montarla hay que tirar de C hacia arriba:
      la viga gira alrededor de A, empuja hacia arriba a las barras 1 y 2, y
      el sistema queda con fuerzas sin ninguna carga exterior. Hay cinco
      fuerzas incógnita ($N_1$, $N_2$, $N_3$, $A_x$, $A_y$) y tres ecuaciones
      de equilibrio: es hiperestático.

      **Compatibilidad.** La viga es rígida y está articulada en A: su único
      movimiento es un giro pequeño $\theta$, antihorario. Con $x$ hacia la
      derecha e $y$ hacia arriba, B sube $a\theta$ y C sube $2a\theta$, sin
      moverse en horizontal.

      La barra 1 va de B a su pasador, en la dirección
      $\hat{e}_1 = (-\sin\eta,\ \cos\eta)$, y se alarga lo que B se aleja de
      ese pasador: $\delta_1 = -a\theta\cos\eta$. Igual la 2,
      $\delta_2 = -a\theta\cos\eta$. La barra 3 pasa de su longitud de
      fabricación, $b - \xi$, a la distancia final $b - 2a\theta$:
      $\delta_3 = \xi - 2a\theta$.

      **Comportamiento** (tema 8, $\Delta L = NL/EA$). Con
      $L_1 = L_2 = b/\cos\eta$ y $L_3 \approx b$:

      $$
      N_1 = N_2 = -\frac{EA}{b}\,a\theta\cos^{2}\eta,\qquad
      N_3 = \frac{EA}{b}\,(\xi - 2a\theta)
      $$

      **Equilibrio.** Momentos en A, antihorario positivo. Cada barra tira de
      la viga hacia su pasador; de las 1 y 2 solo da momento la componente
      vertical, $N\cos\eta$, porque B está a la altura de A:

      $$
      a\,N_1\cos\eta + a\,N_2\cos\eta + 2a\,N_3 = 0
      \quad\Longrightarrow\quad N_3 = -N_1\cos\eta
      $$

      **El giro y las fuerzas.** Sustituyendo,
      $\xi - 2a\theta = a\theta\cos^{3}\eta$:

      $$
      a\theta = \frac{\xi}{2 + \cos^{3}\eta},\qquad
      N_3 = \frac{EA\xi}{b}\,\frac{\cos^{3}\eta}{2 + \cos^{3}\eta}\ \ \text{(tracción)},\qquad
      N_1 = N_2 = -\frac{EA\xi}{b}\,\frac{\cos^{2}\eta}{2 + \cos^{3}\eta}\ \ \text{(compresión)}
      $$

      Las reacciones: $A_x = (N_1 - N_2)\sin\eta = 0$ y $A_y = N_3$, hacia
      arriba. La viga queda como una barra con $2N_3$ hacia abajo en el
      centro y $N_3$ hacia arriba en cada extremo.

      **Con $\eta = 30^{\circ}$** ($\cos^{3}\eta = 0{,}6495$):
      $a\theta = 0{,}3774\,\xi$, $N_3 = 0{,}2451\,EA\xi/b$ y
      $N_1 = N_2 = -0{,}2831\,EA\xi/b$.

      **Comprobaciones.** Con $\eta \to 0$ las tres barras son verticales e
      iguales y sale $N_3 = -N_1 = EA\xi/(3b)$: el hueco se reparte en
      tercios, $2a\theta = \tfrac23\xi$ para la viga y $\tfrac13\xi$ para la
      barra 3. El motor del curso (`resuelveBarras`, con la viga como sólido
      rígido articulado en A y la barra 3 con $h = -\xi$) da las mismas
      fuerzas con $\eta = 30^{\circ}$, $0^{\circ}$ y $50^{\circ}$, y sus $N$ cumplen el equilibrio
      de momentos en A.
