      **b/** La tangencial máxima es el radio del círculo mayor:

      $$
      \tau_{max} = \tfrac12(\sigma_1 - \sigma_3) = 42{,}48\ \text{MPa},\qquad
      \gamma_{max} = \varepsilon_1 - \varepsilon_3 = 1638{,}5\cdot10^{-6}
      $$

      en los planos a 45° entre la dirección 1 y $z$. Cuadran:
      $G\gamma_{max} = 25\,926\cdot1638{,}5\cdot10^{-6} = 42{,}48$ MPa.

      **c/ Factores de seguridad.**

      $$
      FS_{Tresca} = \frac{\sigma_L}{\sigma_1 - \sigma_3} = \frac{200}{84{,}96} = 2{,}354,\qquad
      FS_{VM} = \frac{200}{\sqrt{84{,}96^{2} - 84{,}96\cdot22{,}74 + 22{,}74^{2}}} = \frac{200}{76{,}18} = 2{,}625
      $$

      **Comprobación.** El motor del curso (`roseta`, `mohrDeformacion`,
      `tensionPlana`, `tresca` y `vonMises`) da todas estas cifras, y el
      segundo camino —las ecuaciones resueltas a mano, Hooke escrito en
      principales y $G\gamma_{max} = \tau_{max}$— las repite.

  # ── Problema 3 · la barra 3, corta en ξ, y la viga rígida ABC.
  - id: exerm1617-1par-7-la-barra-corta-y-la-viga-rigida
    titulo: La barra 3, fabricada corta, y la viga rígida que la obliga a estirarse
    fuente: >-
      Ejercicio 3 · Primer parcial de 2016-2017 (hoja de ejercicios del 14 de
      noviembre de 2016) · Elasticidad y Resistencia de Materiales, Escuela de
      Ingeniería de Gipuzkoa (UPV/EHU). Vale 2 puntos. El examen no publica
      resolución; el desarrollo es nuestro, con el convenio del tema 8
      (N > 0 tracción, ε0 = h/L). Los pasos con números usan η = 30°, que es
      nuestro.
    nivel: examen
    enunciado: |
      (2 p) En la estructura de la figura la viga ABC es rígida, está
      articulada en el apoyo fijo A y se sustenta por las barras articuladas
      1, 2 y 3. La sección y el módulo de elasticidad de todas las barras es
      $A$ y $E$ , respectivamente.

      La longitud antes del montaje de la barra 3 es ($b$-$\xi$), debido a un
      error de fabriación. Determinar las fuerzas en las barras debidas a
      dicho error de fabricación.

