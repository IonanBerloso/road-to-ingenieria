      <figcaption>

      Redibujada del Word original. El PDF pierde las flechas de los ejes
      (deja sus letras sueltas, a la derecha) y los dos arcos, dibuja la
      galga c cruzando su lado y escribe una «x» suelta bajo cada ángulo, que
      en el Word es un resto de los cuadros de texto; aquí no se copia.

      </figcaption>
      </figure>

      **Notas nuestras.** La galga a va según $x$; la b, sobre el lado que
      sube a 60° de $x$; la c, sobre el lado que forma 30° con la base. En el PDF la c
      sale torcida respecto de su lado; en el Word original está sobre él,
      igual que en la misma figura del parcial de 2017-2018.
    pide: >-
      a) ε1, ε2, ε3 y σ1, σ2, σ3 con sus direcciones, y los círculos de Mohr.
      b) τmax y γmax. c) Los coeficientes de seguridad de Tresca y de von
      Mises.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué ángulo hay que meter en la ec. 3.55 para la galga c?
        opciones:
          - texto: >-
              150° desde $x$ en sentido antihorario, o $-30^{\circ}$: una galga es
              una recta, y las dos dan lo mismo
            correcta: true
            mensaje: |
              Eso es. Su lado forma 30° con la base, pero hacia la izquierda:
              sube desde el vértice de la derecha. Con 150° o con $-30^{\circ}$,
              $\cos^{2}$, $\sin^{2}$ y $\sin\cos$ salen iguales.
          - texto: 30°, el ángulo que rotula la figura
            mensaje: |
              El 30° está medido desde la base **hacia la izquierda**, en el
              vértice de la derecha. Con $\theta = 30^{\circ}$ el término
              $\gamma_{xy}\sin\theta\cos\theta$ cambia de signo y sale
              $\varepsilon_y = 2000\cdot10^{-6}$ y $\gamma_{xy} = -2078\cdot10^{-6}$:
              otro estado. (En el PDF la c sale torcida y parece ir a +30°: es
              un defecto de la conversión del Word; en el original está sobre su
              lado.)
          - texto: 120°, porque el triángulo tiene un ángulo recto arriba
            mensaje: |
              El ángulo recto de arriba dice justo eso: la c es perpendicular a
              la b, y va a $60^{\circ} + 90^{\circ} = 150^{\circ}$. 120° es
              $180^{\circ} - 60^{\circ}$, el suplementario del ángulo de b, y esa
              recta no es la de ningún lado: el de c baja hacia la derecha con 30°
              de pendiente.
      - tipo: calcular
        titulo: La distorsión γxy de la roseta
        pregunta: |
          Con las tres galgas, ¿cuánto vale $\gamma_{xy}$, en unidades de
          $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '1039.2'
          tolerancia: 1
          formato: un número, en 10⁻⁶
        distractores:
          - valor: '-2078.5'
            mensaje: |
              Has puesto la galga c a 30° en vez de a 150°. Con eso el sistema
              da $\varepsilon_y = 2000$ y $\gamma_{xy} = -2078{,}5$ (·10⁻⁶),
              otro estado. El lado de c sube hacia la izquierda: 150°. (En el
              PDF la c sale torcida y parece ir a +30°: es un defecto de la
              conversión del Word; en el original está sobre su lado.)
          - valor: '519.6'
            mensaje: |
              Es $\tfrac12\gamma_{xy}$, la componente del tensor. La ec. 3.55
              con $\gamma_{xy}\sin\theta\cos\theta$ da directamente la
              distorsión ingenieril: $\gamma_{xy} = 600\sqrt3$.
        pista: |
          $\varepsilon_\theta = \varepsilon_x\cos^{2}\theta + \varepsilon_y\sin^{2}\theta + \gamma_{xy}\sin\theta\cos\theta$
          con $\theta = 0^{\circ}$, 60° y 150°.
        desarrollo: |
          La a da $\varepsilon_x = 800$. La b y la c:

          $$
          \begin{aligned}
          800 &= \tfrac14\,800 + \tfrac34\,\varepsilon_y + \tfrac{\sqrt3}{4}\,\gamma_{xy}\\
          200 &= \tfrac34\,800 + \tfrac14\,\varepsilon_y - \tfrac{\sqrt3}{4}\,\gamma_{xy}
          \end{aligned}
          $$

          Sumando, $\varepsilon_y = 200$; y $\gamma_{xy} = 600\sqrt3 = 1039{,}2$
          (todo en $10^{-6}$).
      - tipo: calcular
        titulo: La deformación principal mayor
        pregunta: |
          ¿Cuánto vale $\varepsilon_1$, en unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '1100'
          tolerancia: 1
          formato: un número, en 10⁻⁶
        distractores:
          - valor: '1581.7'
            mensaje: |
              Has metido $\gamma_{xy}$ entera en el radio. En el Mohr de
              deformaciones la ordenada es $\tfrac12\gamma$:
              $R = \sqrt{300^{2} + 519{,}6^{2}} = 600$, no $\sqrt{300^{2} + 1039{,}2^{2}}$.
          - valor: '600'
            mensaje: |
              Es el radio del círculo. La principal es el centro más el radio:
              $\varepsilon_1 = 500 + 600$.
        pista: |
          Centro $\tfrac{\varepsilon_x + \varepsilon_y}{2}$, radio
          $\sqrt{\left(\tfrac{\varepsilon_x - \varepsilon_y}{2}\right)^{2} + \left(\tfrac{\gamma_{xy}}{2}\right)^{2}}$.
        desarrollo: |
          Centro 500, radio $\sqrt{300^{2} + 519{,}6^{2}} = 600$:
          $\varepsilon_1 = 1100$ y $\varepsilon_2 = -100$ (·10⁻⁶). La
          dirección de $\varepsilon_1$: $\operatorname{tg}2\theta = 1039{,}2/600 = \sqrt3$,
          $\theta = 30^{\circ}$ desde $x$.
      - tipo: calcular
        titulo: La deformación según z
        pregunta: |
          La tercera deformación principal es la de $z$. ¿Cuánto vale
          $\varepsilon_z$, en unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '-538.5'
          tolerancia: 1
          formato: un número, en 10⁻⁶
        distractores:
          - valor: '0'
            mensaje: |
              Eso sería deformación plana. Aquí el estado es de **tensión**
              plana: $\sigma_z = 0$, y por Poisson el espesor sí cambia:
              $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E$.
          - valor: '-350'
            mensaje: |
              Has hecho $-\nu(\varepsilon_x + \varepsilon_y)$. Con
              $\sigma_z = 0$ la cuenta lleva $1 - \nu$ debajo:
              $\varepsilon_z = -\tfrac{\nu}{1 - \nu}(\varepsilon_x + \varepsilon_y)$,
              porque $\sigma_x + \sigma_y = \tfrac{E}{1 - \nu}(\varepsilon_x + \varepsilon_y)$.
        pista: |
          $\varepsilon_z = -\dfrac{\nu}{1 - \nu}\,(\varepsilon_x + \varepsilon_y)$.
        desarrollo: |
          $\varepsilon_z = -\tfrac{0{,}35}{0{,}65}\cdot1000\cdot10^{-6} = -538{,}5\cdot10^{-6}$.
          Las tres principales en el espacio: $1100$, $-100$ y $-538{,}5$
          (·10⁻⁶).
      - tipo: calcular
        titulo: La tensión principal mayor
        pregunta: |
          ¿Cuánto vale $\sigma_1$, en MPa?
        respuesta:
          tipo: numero
          valor: '84.96'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '77'
            mensaje: |
              Has hecho $E\varepsilon_1$, como en una barra. En tensión plana
              la otra deformación también cuenta:
              $\sigma_1 = \tfrac{E}{1 - \nu^{2}}(\varepsilon_1 + \nu\varepsilon_2)$.
          - valor: '117.53'
            mensaje: |
              Has usado Hooke con $\varepsilon_z = 0$, que es deformación
              plana: aparece una $\sigma_z$ que aquí no existe. Con
              $\sigma_z = 0$ la fórmula es la de tensión plana (ec. 4.25).
        pista: |
          $\sigma_1 = \dfrac{E}{1 - \nu^{2}}(\varepsilon_1 + \nu\varepsilon_2)$,
          con $E = 70\,000$ MPa.
        desarrollo: |
          $\tfrac{E}{1 - \nu^{2}} = \tfrac{70\,000}{0{,}8775} = 79\,772$ MPa, y

          $$
          \sigma_1 = 79\,772\,(1100 - 35)\cdot10^{-6} = 84{,}96\ \text{MPa},\qquad
          \sigma_2 = 79\,772\,(385 - 100)\cdot10^{-6} = 22{,}74\ \text{MPa}
          $$

          con $\sigma_3 = \sigma_z = 0$.
      - tipo: calcular
        titulo: La tensión tangencial máxima
        pregunta: |
          ¿Cuánto vale la tensión tangencial máxima del punto, en MPa?
        respuesta:
          tipo: numero
          valor: '42.48'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '31.11'
            mensaje: |
              Es el radio del círculo del plano $xy$, $(\sigma_1 - \sigma_2)/2$.
              La máxima del punto es la del círculo **mayor**, el de
              $\sigma_1$ y $\sigma_3 = 0$: en tensión plana con las dos
              principales del plano del mismo signo, el mayor pasa por el
              origen.
          - valor: '26.94'
            mensaje: |
              Es $\tau_{xy} = G\gamma_{xy}$, la tangencial en los ejes de la
              roseta. La máxima es el radio del círculo mayor de Mohr, y no
              está en esos planos.
        pista: |
          $\tau_{max} = \tfrac12(\sigma_1 - \sigma_3)$, con las tres
          principales en el espacio.
        desarrollo: |
          $\tau_{max} = \tfrac12(84{,}96 - 0) = 42{,}48$ MPa, en los planos a
          45° entre la dirección 1 y $z$.
      - tipo: calcular
        titulo: La deformación tangencial máxima
        pregunta: |
          ¿Cuánto vale la deformación tangencial máxima $\gamma_{max}$, en
          unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '1638.5'
          tolerancia: 1
          formato: un número, en 10⁻⁶
        distractores:
          - valor: '1200'
            mensaje: |
              Es $\varepsilon_1 - \varepsilon_2$, la del plano $xy$. La máxima
              del punto sale con $\varepsilon_3 = \varepsilon_z = -538{,}5$:
              $\gamma_{max} = \varepsilon_1 - \varepsilon_3$.
          - valor: '819.2'
            mensaje: |
              Es $\tfrac12\gamma_{max}$, el radio del círculo mayor de Mohr de
              deformaciones, que tiene $\tfrac12\gamma$ en ordenadas. La
              deformación tangencial es la $\gamma$: el doble.
        pista: |
          $\gamma_{max} = \varepsilon_1 - \varepsilon_3$, y debe cumplir
          $\tau_{max} = G\gamma_{max}$.
        desarrollo: |
          $\gamma_{max} = (1100 - (-538{,}5))\cdot10^{-6} = 1638{,}5\cdot10^{-6}$. Con
          $G = E/(2(1 + \nu)) = 25\,926$ MPa,
          $G\gamma_{max} = 42{,}48$ MPa $= \tau_{max}$.
      - tipo: calcular
        titulo: El coeficiente de seguridad de Tresca
        pregunta: |
          ¿Cuánto vale el coeficiente de seguridad según Tresca?
        respuesta:
          tipo: numero
          valor: '2.354'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '3.214'
            mensaje: |
              Has usado $\sigma_1 - \sigma_2$. Tresca compara la diferencia
              entre la **mayor y la menor** de las tres, y la menor es
              $\sigma_3 = 0$: $\sigma_{eq} = 84{,}96$ MPa.
          - valor: '4.708'
            mensaje: |
              Has comparado $\tau_{max}$ con $\sigma_L$. En Tresca el límite
              a cortadura es $\sigma_L/2$: o se compara $\tau_{max}$ con
              100 MPa, o $\sigma_1 - \sigma_3$ con 200.
        pista: |
          $\sigma_{eq} = \sigma_1 - \sigma_3$ y $FS = \sigma_L/\sigma_{eq}$.
        desarrollo: |
          $FS = 200/84{,}96 = 2{,}354$.
      - tipo: calcular
        titulo: El coeficiente de seguridad de von Mises
        pregunta: |
          ¿Cuánto vale el coeficiente de seguridad según von Mises?
        respuesta:
          tipo: numero
          valor: '2.625'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '2.034'
            mensaje: |
              El signo del producto: con $\sigma_3 = 0$,
              $\sigma_{eq} = \sqrt{\sigma_1^{2} - \sigma_1\sigma_2 + \sigma_2^{2}}$,
              con un **menos**. Con más sale 98,3 MPa.
          - valor: '1.856'
            mensaje: |
              Te ha faltado el $\tfrac12$:
              $\sigma_{eq} = \sqrt{\tfrac12\left[(\sigma_1 - \sigma_2)^{2} + (\sigma_2 - \sigma_3)^{2} + (\sigma_3 - \sigma_1)^{2}\right]}$.
              Sin él, una tracción simple no daría $\sigma_{eq} = \sigma$.
        pista: |
          $\sigma_{eq} = \sqrt{\tfrac12\left[(\sigma_1 - \sigma_2)^{2} + (\sigma_2 - \sigma_3)^{2} + (\sigma_3 - \sigma_1)^{2}\right]}$.
        desarrollo: |
          $\sigma_{eq} = \sqrt{84{,}96^{2} - 84{,}96\cdot22{,}74 + 22{,}74^{2}} = 76{,}18$ MPa,
          y $FS = 200/76{,}18 = 2{,}625$, algo mayor que el de Tresca: von
          Mises nunca da menos.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Las tres galgas, a 0°, 60° y 150° de $x$, dan
              $\varepsilon_x = 800$, $\varepsilon_y = 200$ y
              $\gamma_{xy} = 1039{,}2$ (·10⁻⁶).
          - texto: >-
              Mohr en el plano: $\varepsilon_{1,2} = 500 \pm 600$; y por ser
              tensión plana,
              $\varepsilon_z = -\tfrac{\nu}{1 - \nu}(\varepsilon_x + \varepsilon_y) = -538{,}5$.
          - texto: >-
              Hooke en tensión plana: $\sigma_1 = 84{,}96$, $\sigma_2 = 22{,}74$ y
              $\sigma_3 = 0$ MPa, en las mismas direcciones que las
              deformaciones principales.
          - texto: >-
              Con las tres: $\tau_{max} = \tfrac12(\sigma_1 - \sigma_3) = 42{,}48$ MPa,
              $\gamma_{max} = \varepsilon_1 - \varepsilon_3 = 1638{,}5\cdot10^{-6}$,
              $FS_{Tresca} = 2{,}354$ y $FS_{VM} = 2{,}625$.
          - texto: >-
              Como es tensión plana, $\varepsilon_z = 0$ y la tercera
              deformación principal es nula.
            trampa: true
            mensaje: |
              Tensión plana es $\sigma_z = 0$, no $\varepsilon_z = 0$. La
              chapa adelgaza por Poisson: $\varepsilon_z = -538{,}5\cdot10^{-6}$,
              y es justo la que da la $\gamma_{max}$ del punto.
    resolucion: |
      **Las galgas.** Con la ec. 3.55,
      $\varepsilon_\theta = \varepsilon_x\cos^{2}\theta + \varepsilon_y\sin^{2}\theta + \gamma_{xy}\sin\theta\cos\theta$,
      y las galgas a $\theta_a = 0^{\circ}$, $\theta_b = 60^{\circ}$ y $\theta_c = 150^{\circ}$
      (todo en $10^{-6}$):

      $$
      \begin{aligned}
      800 &= \varepsilon_x\\
      800 &= \tfrac14\varepsilon_x + \tfrac34\varepsilon_y + \tfrac{\sqrt3}{4}\gamma_{xy}\\
      200 &= \tfrac34\varepsilon_x + \tfrac14\varepsilon_y - \tfrac{\sqrt3}{4}\gamma_{xy}
      \end{aligned}
      \quad\Longrightarrow\quad
      \varepsilon_x = 800,\quad \varepsilon_y = 200,\quad \gamma_{xy} = 600\sqrt3 = 1039{,}2
      $$

      **a/ Deformaciones principales.** En el plano, centro
      $\tfrac{800 + 200}{2} = 500$ y radio
      $\sqrt{300^{2} + 519{,}6^{2}} = 600$: $\varepsilon_1 = 1100$ y
      $\varepsilon_2 = -100$. La dirección 1 forma $\theta$ con $x$, con
      $\operatorname{tg}2\theta = \gamma_{xy}/(\varepsilon_x - \varepsilon_y) = \sqrt3$:
      $\theta = 30^{\circ}$; la 2, a 120°. En tensión plana $\sigma_z = 0$, y $z$ es
      la tercera dirección principal, con

      $$
      \varepsilon_z = -\frac{\nu}{1 - \nu}\,(\varepsilon_x + \varepsilon_y) = -\frac{0{,}35}{0{,}65}\cdot1000 = -538{,}5
      $$

      En el espacio: $\varepsilon_1 = 1100$, $\varepsilon_2 = -100$ y
      $\varepsilon_3 = \varepsilon_z = -538{,}5$ (·10⁻⁶).

      **Tensiones principales.** Hooke en tensión plana con las principales
      (ec. 4.25, con $E/(1 - \nu^{2}) = 79\,772$ MPa):

      $$
      \sigma_1 = 79\,772\,(1100 + 0{,}35\cdot(-100))\cdot10^{-6} = 84{,}96\ \text{MPa},\qquad
      \sigma_2 = 79\,772\,(0{,}35\cdot1100 - 100)\cdot10^{-6} = 22{,}74\ \text{MPa}
      $$

      y $\sigma_3 = \sigma_z = 0$, en las mismas direcciones que las
      deformaciones (el material es isótropo). Por el otro camino,
      $\sigma_x = 69{,}40$, $\sigma_y = 38{,}29$ y $\tau_{xy} = G\gamma_{xy} = 26{,}94$ MPa
      dan el mismo círculo: centro 53,85 y radio 31,11.

      **Los círculos de Mohr.** Tres por diagrama, cada uno entre dos
      principales:

      | | Deformaciones (·10⁻⁶), ordenada ½γ | Tensiones (MPa), ordenada τ |
      |---|---|---|
      | 1-2 | centro 500, radio 600 | centro 53,85, radio 31,11 |
      | 1-3 | centro 280,8, radio 819,2 | centro 42,48, radio 42,48 |
      | 2-3 | centro −319,2, radio 219,2 | centro 11,37, radio 11,37 |

