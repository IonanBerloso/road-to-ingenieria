ejercicios:
  # ── Teoría · pregunta 1 · el elemento diferencial: ΣFy y τxy = τyx.
  - id: exerm1617-1par-1-el-equilibrio-del-elemento-diferencial
    titulo: El equilibrio del elemento diferencial, la ecuación en y y la simetría de las tangenciales
    fuente: >-
      Pregunta 1 de teoría · Primer parcial de 2016-2017 (hoja de teoría del 7
      de noviembre de 2016) · Elasticidad y Resistencia de Materiales, Escuela
      de Ingeniería de Gipuzkoa (UPV/EHU). Vale 1 punto, 0,5 cada apartado.
      Cayó igual, con el mismo «1.(1p)» y los mismos apartados, como cuestión
      1 de teoría del examen final del 7 de enero de 2020. El examen no
      publica resolución; el desarrollo es nuestro y sigue los apuntes del
      tema 2, apartado 2.3 (ecs. 2.3 a 2.8). Los pasos de cálculo son ejemplos
      nuestros.
    nivel: examen
    enunciado: |
      (1p) Equilibrio de un elemento diferencial: tras dibujar el elemento
      diferencial y **sólo** las componentes de tensión que influyen en cada
      caso:

      a/ (0,5p) Determinar la ecuación de equilibrio de fuerzas en dirección
      $y$.

      b/ (0,5p) Demostrar que $\tau_{xy} = \tau_{yx}$.
    pide: >-
      a) La ecuación τxy,x + σy,y + τzy,z + Fy = 0, deducida del equilibrio de
      fuerzas en y del paralelepípedo dx·dy·dz. b) τxy = τyx, deducida del
      equilibrio de momentos respecto del eje z' que pasa por el centro de
      gravedad. En los dos, con el dibujo y solo las componentes que cuentan.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para el apartado a/ hay que dibujar «sólo las componentes que
          influyen». ¿Cuáles entran en el equilibrio de fuerzas según $y$?
        opciones:
          - texto: >-
              $\tau_{xy}$ en las dos caras perpendiculares a $x$, $\sigma_y$
              en las dos perpendiculares a $y$ y $\tau_{zy}$ en las dos
              perpendiculares a $z$, más la fuerza de volumen $F_y$
            correcta: true
            mensaje: |
              Eso es. En cada pareja de caras se toma la componente que va
              según $y$; con el convenio del curso, el segundo subíndice es la
              dirección. Seis fuerzas de superficie y una de volumen (ec. 2.3).
          - texto: >-
              $\tau_{yx}$, $\sigma_y$ y $\tau_{yz}$: la fila $y$ del tensor
            mensaje: |
              Esas son las tres componentes de la cara perpendicular a $y$, y
              dos de ellas, $\tau_{yx}$ y $\tau_{yz}$, van según $x$ y según
              $z$: no suman nada en $y$. Además, en a/ todavía no se ha
              demostrado la simetría, que es justo el apartado b/.
          - texto: >-
              Solo $\sigma_y$ y $F_y$: las tangenciales de dos caras opuestas
              son iguales y contrarias y se anulan
            mensaje: |
              Se anularían si fueran iguales, y no lo son: de la cara en $x$ a
              la cara en $x + dx$ la tensión cambia en
              $\tau_{xy,x}\,dx$. Ese incremento es lo que queda en la
              ecuación, igual que el de $\sigma_y$.
          - texto: Las tres normales, $\sigma_x$, $\sigma_y$ y $\sigma_z$
            mensaje: |
              $\sigma_x$ y $\sigma_z$ son perpendiculares a $y$: empujan según
              $x$ y según $z$ y no entran en $\sum F_y$. De las normales solo
              cuenta $\sigma_y$.
      - tipo: calcular
        titulo: La fuerza de volumen que equilibra un campo, en un ejemplo
        pregunta: |
          Un ejemplo nuestro. En un sólido, las únicas componentes de tensión
          que dependen de la posición y que actúan según $y$ son (MPa, con
          las coordenadas en m):

          $$
          \tau_{xy} = 6x^{2}y,\qquad \sigma_y = 4y^{3},\qquad \tau_{zy} = 2yz
          $$

          ¿Cuánto tiene que valer la fuerza de volumen $F_y$ en el punto
          $(1, 1, 0)$ para que haya equilibrio, en MN/m³?
        respuesta:
          tipo: numero
          valor: '-26'
          tolerancia: 0.01
          formato: un número, en MN/m³
        distractores:
          - valor: '-20'
            mensaje: |
              Has derivado $\tau_{xy}$ respecto de $y$ (sale $6x^{2} = 6$). En
              la ecuación cada componente se deriva respecto de la coordenada
              de **su cara**: $\tau_{xy}$ actúa en las caras perpendiculares a
              $x$, y lo que cambia de una a otra es $\tau_{xy,x}\,dx$.
          - valor: '26'
            mensaje: |
              Es la suma de las tres derivadas, $12 + 12 + 2$, pero la fuerza
              de volumen tiene que **equilibrarla**: la ec. 2.4 es
              $\tau_{xy,x} + \sigma_{y,y} + \tau_{zy,z} + F_y = 0$, así que
              $F_y$ lleva el signo contrario.
        pista: |
          $F_y = -\left(\tau_{xy,x} + \sigma_{y,y} + \tau_{zy,z}\right)$ (ec.
          2.4). Cada componente se deriva respecto de la coordenada de su cara.
        desarrollo: |
          $$
          \tau_{xy,x} = 12xy = 12,\qquad \sigma_{y,y} = 12y^{2} = 12,\qquad \tau_{zy,z} = 2y = 2
          $$

          y con la ec. 2.4, $F_y = -(12 + 12 + 2) = -26$ MN/m³.
      - tipo: calcular
        titulo: El momento que dejaría un tensor no simétrico
        pregunta: |
          Otro ejemplo nuestro, para ver por qué b/ no puede fallar. Imagina
          un elemento en el que $\tau_{xy} = 3$ MPa y $\tau_{yx} = 1$ MPa,
          uniformes. ¿Cuánto vale el momento de las fuerzas de superficie
          respecto del eje $z'$ por G, **por unidad de volumen**, en MPa,
          tomando positivo el antihorario visto desde $+z$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número, en MPa (momento por unidad de volumen)
        distractores:
          - valor: '4'
            mensaje: |
              Has sumado las dos parejas. Las $\tau_{xy}$ de las caras $x$
              forman un par en un sentido y las $\tau_{yx}$ de las caras $y$,
              en el contrario: en la figura 2.7, una pareja hace girar el
              cuadrado hacia un lado y la otra hacia el otro. Se restan.
          - valor: '1'
            mensaje: |
              Has contado una sola cara de cada pareja, con brazo $dx/2$. Las
              dos caras opuestas dan momento en el mismo sentido —fuerzas
              contrarias a lados opuestos de G—, así que cada pareja aporta
              $\tau\,dy\,dz\cdot dx$, no la mitad.
        pista: |
          Cada pareja de caras es un par: fuerza $\tau\cdot$área por brazo
          total $dx$ (o $dy$). Divide por $dx\,dy\,dz$.
        desarrollo: |
          Las dos caras $x$: $\tau_{xy}\,dy\,dz\cdot\tfrac{dx}{2}$ cada una y
          en el mismo sentido, $+\tau_{xy}\,dx\,dy\,dz$. Las dos caras $y$:
          $-\tau_{yx}\,dx\,dy\,dz$. Por unidad de volumen,
          $\tau_{xy} - \tau_{yx} = 3 - 1 = 2$ MPa. Nada más puede equilibrar
          ese momento —las fuerzas de volumen pasan por G—, y por eso tiene
          que ser $\tau_{xy} = \tau_{yx}$.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe los dos apartados como en el examen: el dibujo del elemento
          con solo las componentes que cuentan, la ecuación de fuerzas en y y
          la de momentos que da τxy = τyx.
        rubrica:
          - punto: >-
              a/ Se dibuja el paralelepípedo dx·dy·dz con solo las componentes
              según y: τxy en las caras x, σy en las caras y, τzy en las caras
              z, cada una con su incremento en la cara positiva (τxy + τxy,x dx…),
              y la fuerza de volumen Fy.
            porque: >-
              El enunciado lo exige en negrita: «sólo» las que influyen. Un
              cubo con las dieciocho flechas no demuestra que se sepa cuáles
              entran.
            minimo: true
          - punto: >-
              Se multiplica cada tensión por el área de su cara y Fy por el
              volumen, y se escribe ΣFy = 0 con las seis caras (ec. 2.3).
            porque: >-
              Se equilibran fuerzas, no tensiones. Es el paso donde se pierden
              los signos de las caras negativas.
            minimo: true
          - punto: >-
              Se divide por dx·dy·dz y se llega a τxy,x + σy,y + τzy,z + Fy = 0
              (ec. 2.4).
            porque: >-
              Es la respuesta de a/. Cada derivada es respecto de la
              coordenada de la cara donde actúa la componente.
            minimo: true
          - punto: >-
              b/ Se toman momentos respecto de un eje z' paralelo a z por el
              centro de gravedad G, y se dibujan solo τxy en las caras x y τyx
              en las caras y, que son las que dan momento.
            porque: >-
              Con el eje por G las fuerzas de volumen no dan momento, y las
              demás componentes son paralelas a z' o lo cortan. El dibujo es
              la figura 2.7 de los apuntes.
            minimo: true
          - punto: >-
              Se escribe ΣMz' = 0 con los brazos dx/2 y dy/2, se desprecian los
              términos con derivadas (son de orden superior) y, dividiendo por
              dx·dy·dz, sale τxy = τyx (ec. 2.8).
            porque: >-
              Sin decir por qué se tiran los términos con derivadas la
              igualdad parece aproximada, y es exacta en el límite.
            minimo: true
      - tipo: justificar
        pregunta: Ordena la deducción de los dos apartados. Una pieza es falsa.
        piezas:
          - texto: >-
              Se aísla el paralelepípedo $dx\,dy\,dz$ y en cada pareja de
              caras se dibuja solo la componente según $y$: $\tau_{xy}$,
              $\sigma_y$ y $\tau_{zy}$, con su incremento en la cara positiva.
          - texto: >-
              $\sum F_y = 0$: $\tau_{xy,x}\,dx\,dy\,dz + \sigma_{y,y}\,dy\,dx\,dz + \tau_{zy,z}\,dz\,dx\,dy + F_y\,dx\,dy\,dz = 0$,
              y al dividir por el volumen,
              $\tau_{xy,x} + \sigma_{y,y} + \tau_{zy,z} + F_y = 0$.
          - texto: >-
              Para b/, momentos respecto de $z'$ por G: solo dan momento
              $\tau_{xy}$ en las caras $x$ y $\tau_{yx}$ en las caras $y$, con
              brazos $dx/2$ y $dy/2$.
          - texto: >-
              Los términos con derivadas son de orden superior y se
              desprecian; dividiendo por $dx\,dy\,dz$ queda
              $\tau_{xy} = \tau_{yx}$.
          - texto: >-
              Las tensiones de dos caras opuestas son iguales y contrarias, así
              que se anulan pareja a pareja y la ecuación de fuerzas se reduce
              a $F_y = 0$.
            trampa: true
            mensaje: |
              Eso solo pasa si la tensión es uniforme. En general cambia de
              una cara a la opuesta en $\partial\sigma/\partial i\cdot di$, y
              ese incremento es precisamente lo que queda en la ecuación de
              equilibrio.
    resolucion: |
      **a/ El equilibrio de fuerzas en $y$.** Se aísla un paralelepípedo
      recto de aristas $dx$, $dy$ y $dz$ alrededor del punto O (apuntes del
      tema 2, apartado 2.3, figura 2.4). Las tensiones son funciones continuas
      de la posición: si en una cara vale $f$, en la cara paralela, a una
      distancia $di$, vale $f + f_{,i}\,di$. Según $y$ solo actúan:

      - en las caras perpendiculares a $x$, $\tau_{xy}$ y $\tau_{xy} + \tau_{xy,x}\,dx$, sobre el área $dy\,dz$;
      - en las caras perpendiculares a $y$, $\sigma_y$ y $\sigma_y + \sigma_{y,y}\,dy$, sobre $dx\,dz$;
      - en las caras perpendiculares a $z$, $\tau_{zy}$ y $\tau_{zy} + \tau_{zy,z}\,dz$, sobre $dx\,dy$;
      - en el centro de gravedad, la fuerza de volumen $F_y\,dx\,dy\,dz$.

      En la cara negativa cada componente positiva va hacia $-y$. El
      equilibrio es la segunda de las ecs. 2.3:

      $$
      \left(\tau_{xy} + \tau_{xy,x}dx\right)dy\,dz - \tau_{xy}dy\,dz + \left(\sigma_y + \sigma_{y,y}dy\right)dx\,dz - \sigma_y dx\,dz + \left(\tau_{zy} + \tau_{zy,z}dz\right)dx\,dy - \tau_{zy}dx\,dy + F_y\,dx\,dy\,dz = 0
      $$

      Se cancelan los términos sin derivada y se divide por $dx\,dy\,dz$
      (ec. 2.4):

      $$
      \tau_{xy,x} + \sigma_{y,y} + \tau_{zy,z} + F_y = 0
      $$

      **b/ La simetría.** Para el equilibrio de momentos se toma un sistema
      G$x'y'z'$ con origen en el centro de gravedad y ejes paralelos a los
      de O$xyz$. Respecto de $z'$ no dan momento las componentes paralelas a
      $z'$ ni las que lo cortan: las normales pasan por G, y las fuerzas de
      volumen están aplicadas en G. Solo quedan $\tau_{xy}$ en las caras $x$
      y $\tau_{yx}$ en las caras $y$ (figura 2.7). Con antihorario positivo
      visto desde $+z$:

      $$
      \tau_{xy}dy\,dz\tfrac{dx}{2} + \left(\tau_{xy} + \tau_{xy,x}dx\right)dy\,dz\tfrac{dx}{2} - \tau_{yx}dx\,dz\tfrac{dy}{2} - \left(\tau_{yx} + \tau_{yx,y}dy\right)dx\,dz\tfrac{dy}{2} = 0
      $$

      Las derivadas de las tangenciales son finitas, así que los términos que
      las llevan son de orden superior y se desprecian. Dividiendo por
      $dx\,dy\,dz$:

      $$
      \tau_{xy} = \tau_{yx}
      $$

      que es la ec. 2.8. Con los ejes $x'$ e $y'$ salen igual
      $\tau_{yz} = \tau_{zy}$ y $\tau_{zx} = \tau_{xz}$ (ecs. 2.6 y 2.7): el
      tensor de tensiones es simétrico.

      **Comprobación con números (nuestra).** Con $\tau_{xy} = 6x^{2}y$,
      $\sigma_y = 4y^{3}$ y $\tau_{zy} = 2yz$, en $(1, 1, 0)$ la ec. 2.4 pide
      $F_y = -26$ MN/m³. El motor del curso sumó las fuerzas de las seis caras
      de un cubo de 1 mm de lado centrado en el punto (`vectorTension` con la
      normal exterior de cada cara) y dio lo mismo: el cubo pequeño es la
      ecuación. Y un tensor con $\tau_{xy} = 3$ y $\tau_{yx} = 1$ deja un
      momento de 2 MPa por unidad de volumen que nada equilibra.

  # ── Teoría · pregunta 2 · el alambre pretensado y la temperatura.
  - id: exerm1617-1par-2-el-alambre-pretensado-que-se-enfria
    titulo: El alambre pretensado entre soportes rígidos, al enfriarse y al calentarse
    fuente: >-
      Pregunta 2 de teoría · Primer parcial de 2016-2017 (hoja de teoría del 7
      de noviembre de 2016) · Elasticidad y Resistencia de Materiales, Escuela
      de Ingeniería de Gipuzkoa (UPV/EHU). Vale 1 punto, sin reparto por
      apartados. El examen no publica resolución; el desarrollo es nuestro,
      con el convenio del tema 8 (ε0 = αΔT).
    nivel: examen
    enunciado: |
      (1p) Un alambre rígido de acero se tensa entre soportes rígidos. La
      pretensión inicial en el alambre es 40 MPa, cuando la temperatura es
      20 ºC.

      a/ ¿Cuál es la tensión en el alambre cuando la temperatura baja a 0 ºC?

      b/ ¿ A qué temperatura la tensión en el alambre es cero?

      Datos: $\alpha$ = 14·10⁻⁶ ºC⁻¹; $E$ = 210 GPa

      <figure class="figura-examen">
      <svg viewBox="0 0 440 92" role="img" width="440" height="92" aria-labelledby="exerm1617-1par-2-el-alambre-pretensado-que-se-enfria-fig-t exerm1617-1par-2-el-alambre-pretensado-que-se-enfria-fig-d">
      <title id="exerm1617-1par-2-el-alambre-pretensado-que-se-enfria-fig-t">El alambre tenso entre dos apoyos fijos</title>
      <desc id="exerm1617-1par-2-el-alambre-pretensado-que-se-enfria-fig-d">Un alambre horizontal, dibujado como una barra gruesa, une dos apoyos articulados fijos, uno en cada extremo, cada uno sobre su suelo. No hay cotas ni cargas.</desc>
      <line x1="60" y1="34" x2="380" y2="34" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
      <polygon points="60,34 45,60 75,60" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
      <polygon points="380,34 365,60 395,60" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
      <line x1="37.5" y1="60" x2="82.5" y2="60" stroke="var(--ink)" stroke-width="1.6"/><path d="M45 60 l-4.9 4.9 M52.5 60 l-4.9 4.9 M60 60 l-4.9 4.9 M67.5 60 l-4.9 4.9 M75 60 l-4.9 4.9 M82.5 60 l-4.9 4.9" stroke="var(--faint)" stroke-width="1"/>
      <line x1="357.5" y1="60" x2="402.5" y2="60" stroke="var(--ink)" stroke-width="1.6"/><path d="M365 60 l-4.9 4.9 M372.5 60 l-4.9 4.9 M380 60 l-4.9 4.9 M387.5 60 l-4.9 4.9 M395 60 l-4.9 4.9 M402.5 60 l-4.9 4.9" stroke="var(--faint)" stroke-width="1"/>
      </svg>
      <figcaption>

      Redibujada del enunciado.

      </figcaption>
      </figure>

      **Notas nuestras.** El enunciado llama «rígido» al alambre; si lo
      fuera, ni se podría tensar ni cambiaría su tensión con la temperatura.
      Se resuelve como un alambre elástico, de módulo $E$, entre soportes que
      no se mueven: lo rígido son los soportes.
    pide: >-
      a) La tensión del alambre a 0 °C, en MPa. b) La temperatura a la que la
      tensión se anula, en °C.
    pasos:
      - tipo: reconocer
        pregunta: |
          El alambre está tenso entre dos soportes que no se mueven y se
          enfría. ¿Qué le pasa a su tensión?
        opciones:
          - texto: >-
              Aumenta en $E\alpha|\Delta T|$: el alambre querría acortarse
              $\alpha|\Delta T|L$ y los soportes no le dejan, así que se
              estira más respecto de su longitud natural
            correcta: true
            mensaje: |
              Eso es. La longitud entre soportes no cambia, $\Delta L = 0$, y
              en $\Delta L = NL/EA + \varepsilon_0L$ (ec. 8.9) la
              $\varepsilon_0 = \alpha\Delta T$ negativa tiene que compensarse
              con más tracción. No depende ni de $L$ ni de $A$.
          - texto: >-
              Baja: al enfriarse el alambre se contrae y deja de tirar de los
              soportes
            mensaje: |
              Se contraería si estuviera suelto. Entre soportes fijos esa
              contracción impedida es justo lo que lo estira: al enfriar, un
              alambre entre apoyos fijos se tensa más, y al calentar se afloja.
          - texto: >-
              No se puede saber sin la longitud del alambre y su sección
            mensaje: |
              Con los dos extremos fijos, $L$ se va de la ecuación:
              $0 = \Delta\sigma\,L/E + \alpha\Delta T\,L$ da
              $\Delta\sigma = -E\alpha\Delta T$. La sección tampoco hace
              falta, porque se pide una tensión y no una fuerza.
      - tipo: calcular
        titulo: La tensión a 0 °C
        pregunta: |
          ¿Cuánto vale la tensión en el alambre cuando la temperatura baja a
          0 °C, en MPa?
        respuesta:
          tipo: numero
          valor: '98.8'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '-18.8'
            mensaje: |
              Has restado el efecto térmico: $40 - 58{,}8$. Con
              $\Delta T = -20$ °C el alambre querría acortarse y no puede, así
              que la tracción **sube**:
              $\sigma = \sigma_0 - E\alpha\Delta T = 40 + 58{,}8$. Además, un
              alambre no aguanta compresión: una tensión negativa ya debería
              haberte avisado.
          - valor: '58.8'
            mensaje: |
              Es solo la tensión que añade el enfriamiento,
              $E\alpha\cdot20 = 210\,000\cdot14\cdot10^{-6}\cdot20$. El
              alambre ya estaba a 40 MPa a 20 °C, y las dos se suman.
        pista: |
          $\sigma = \sigma_0 - E\alpha\Delta T$, con $\Delta T = 0 - 20$ °C y
          $E = 210\,000$ MPa.
        desarrollo: |
          $E\alpha = 210\,000\cdot14\cdot10^{-6} = 2{,}94$ MPa/°C, y

          $$
          \sigma = 40 - 2{,}94\cdot(0 - 20) = 40 + 58{,}8 = 98{,}8\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La temperatura a la que el alambre se afloja
        pregunta: |
          ¿A qué temperatura la tensión en el alambre es cero, en °C?
        respuesta:
          tipo: numero
          valor: '33.61'
          tolerancia: 0.05
          formato: un número, en °C
        distractores:
          - valor: '6.39'
            mensaje: |
              Has bajado la temperatura en vez de subirla. Para quitar los
              40 MPa de tracción el alambre tiene que **dilatarse**, y eso es
              calentarlo: $T = 20 + 40/2{,}94$.
          - valor: '13.61'
            mensaje: |
              Es el incremento, $\Delta T = 40/(E\alpha) = 13{,}61$ °C, no la
              temperatura. Se parte de 20 °C: $T = 20 + 13{,}61$.
        pista: |
          $0 = \sigma_0 - E\alpha\,(T - 20)$.
        desarrollo: |
          $$
          T = 20 + \frac{\sigma_0}{E\alpha} = 20 + \frac{40}{2{,}94} = 20 + 13{,}61 = 33{,}61\ \text{°C}
          $$
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Los soportes son rígidos: la distancia entre ellos no cambia y
              el alargamiento total del alambre es $\Delta L = 0$ a cualquier
              temperatura.
          - texto: >-
              Ese alargamiento es el elástico más el térmico,
              $\Delta L = (\sigma - \sigma_0)\,L/E + \alpha\Delta T\,L$
              (ec. 8.9), medido desde el estado a 20 °C, donde ya hay
              $\sigma_0 = 40$ MPa.
          - texto: >-
              De ahí $\sigma = \sigma_0 - E\alpha\Delta T$: a 0 °C,
              $98{,}8$ MPa; la tensión se anula con
              $\Delta T = \sigma_0/(E\alpha) = 13{,}61$ °C, a $33{,}61$ °C.
          - texto: >-
              Al enfriarse, el alambre se contrae libremente y su tensión baja
              en $E\alpha|\Delta T|$.
            trampa: true
            mensaje: |
              No puede contraerse libremente: los soportes no se mueven. La
              contracción impedida lo estira respecto de su longitud natural,
              y la tensión **sube**. Bajaría al calentarlo.
    resolucion: |
      **La idea.** Entre soportes rígidos la longitud del alambre no puede
      cambiar. A 20 °C ya tiene 40 MPa de tracción; al cambiar la
      temperatura, el alambre querría alargarse o acortarse
      $\alpha\Delta T\,L$, y como no puede, esa deformación impedida se
      convierte en tensión (tema 8, ec. 8.9, con $\varepsilon_0 = \alpha\Delta T$).

      **La ecuación.** Desde el estado de 20 °C, el alargamiento total es
      nulo:

      $$
      \Delta L = \frac{(\sigma - \sigma_0)\,L}{E} + \alpha\,\Delta T\,L = 0
      \quad\Longrightarrow\quad \sigma = \sigma_0 - E\alpha\,\Delta T
      $$

      con $E\alpha = 210\,000\cdot14\cdot10^{-6} = 2{,}94$ MPa/°C. La
      longitud y la sección no hacen falta.

      **a/** A 0 °C, $\Delta T = -20$ °C:

      $$
      \sigma = 40 + 2{,}94\cdot20 = 98{,}8\ \text{MPa}\quad\text{(tracción)}
      $$

      **b/** La tensión se anula cuando

      $$
      0 = 40 - 2{,}94\,(T - 20)\quad\Longrightarrow\quad T = 20 + \frac{40}{2{,}94} = 33{,}61\ \text{°C}
      $$

      Por encima de esa temperatura el cálculo daría compresión, que un
      alambre no aguanta: se quedaría flojo.

      **Comprobación.** El motor del curso (`resuelveBarraAxial`, barra fija
      en los dos extremos con $\varepsilon_0 = -\sigma_0/E + \alpha\Delta T$,
      es decir, un alambre que suelto mediría $\sigma_0L/E$ menos que la
      distancia entre soportes) da 40 MPa a 20 °C, 98,8 MPa a 0 °C, y la
      bisección sobre él encuentra la tensión nula a 33,605 °C.

  # ── Teoría · pregunta 3, mitad a/ · σx = Ay³ y el flector M0.
  - id: exerm1617-1par-3-la-constante-de-una-tension-cubica
    titulo: La constante de una distribución cúbica de tensiones normales con flector M0
    fuente: >-
      Pregunta 3, apartado a/ de teoría · Primer parcial de 2016-2017 (hoja de
      teoría del 7 de noviembre de 2016) · Elasticidad y Resistencia de
      Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU). Vale 0,5
      puntos; la pregunta 3 son dos mitades de 0,5 y la b/ es el ejercicio
      siguiente. El examen no publica resolución; el desarrollo es nuestro,
      con el convenio del tema 7 (ec. 7.7, y hacia abajo).
    nivel: examen
    enunciado: |
      Responder a las siguientes preguntas:

      a/ (0,5p) En una sección rectangular de ancho $b$ y altura 2$h$, la
      distribución de tensiones normales es uniforme en el ancho y viene dada
      por $\sigma_x = Ay^3$. Determinar $A$ si el momento flector de la sección
      es $M_0$.

      <figure class="figura-examen">
      <svg viewBox="0 0 300 236" role="img" width="300" height="236" aria-labelledby="exerm1617-1par-3-la-constante-de-una-tension-cubica-fig-t exerm1617-1par-3-la-constante-de-una-tension-cubica-fig-d">
      <title id="exerm1617-1par-3-la-constante-de-una-tension-cubica-fig-t">La sección rectangular con los ejes z e y desde su centro</title>
      <desc id="exerm1617-1par-3-la-constante-de-una-tension-cubica-fig-d">Un rectángulo más alto que ancho, la sección de la pieza. Desde su centro salen dos ejes: z, horizontal hacia la derecha, e y, vertical hacia abajo. No lleva cotas: el enunciado da el ancho b y la altura 2h.</desc>
      <rect x="40" y="24" width="112" height="148" fill="var(--faint)" fill-opacity=".25" stroke="var(--ink)" stroke-width="1.4"/>
      <line x1="96" y1="98" x2="209" y2="98" stroke="var(--ink)" stroke-width="1.3"/><polygon points="216,98 208,101.5 208,94.5" fill="var(--ink)"/>
      <line x1="96" y1="98" x2="96" y2="211" stroke="var(--ink)" stroke-width="1.3"/><polygon points="96,218 92.5,210 99.5,210" fill="var(--ink)"/>
      <text x="212" y="90" font-size="15" fill="var(--ink)" font-style="italic" text-anchor="middle">z</text>
      <text x="108" y="216" font-size="15" fill="var(--ink)" font-style="italic" text-anchor="middle">y</text>
      </svg>
      <figcaption>

      La figura a/ del enunciado, redibujada.

      </figcaption>
      </figure>

      **Notas nuestras.** La pregunta 3 del examen son dos mitades de medio
      punto con una figura cada una. Esta es la a/; la b/, la rebanada con
      $q_x$ en la cara superior, va en el ejercicio siguiente.
    pide: A en función de M0, b y h.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué integral de la sección da el momento flector a partir de
          $\sigma_x$?
        opciones:
          - texto: $M_z = \int_A \sigma_x\,y\,dA$, con $y$ hacia abajo
            correcta: true
            mensaje: |
              Eso es (ec. 7.7). Con el convenio del curso, un flector positivo
              tracciona las fibras de $y > 0$, las de abajo, y la $\sigma_x$
              de cada fibra da momento con brazo $y$.
          - texto: $\int_A \sigma_x\,dA$
            mensaje: |
              Esa integral es el esfuerzo normal $N$. Aquí, además, vale cero:
              $y^{3}$ es impar y la sección es simétrica respecto de $z$. La
              distribución es de flexión pura.
          - texto: $\int_A \sigma_x\,z\,dA$
            mensaje: |
              Esa es la que daría un momento respecto de $y$. Como $\sigma_x$
              no depende de $z$ y la sección es simétrica respecto de $y$,
              también vale cero: el flector de la pregunta es el de eje $z$.
      - tipo: calcular
        titulo: La constante A
        pregunta: |
          Escribe $A$ como un número por $M_0/(b\,h^{5})$. ¿Cuánto vale ese
          número?
        respuesta:
          tipo: numero
          valor: '2.5'
          tolerancia: 0.01
          formato: un número (el coeficiente de M0/(b·h⁵))
        distractores:
          - valor: '-2.5'
            mensaje: |
              El signo es de otro convenio: con $y$ hacia arriba muchos libros
              escriben $M = -\int\sigma y\,dA$. En el del curso $y$ va hacia
              abajo y $M_z = +\int\sigma_x y\,dA$ (ec. 7.7), y con $M_0 > 0$
              las fibras de abajo, $y > 0$, tienen que estar a tracción:
              $A > 0$.
          - valor: '5'
            mensaje: |
              Has integrado de $0$ a $h$, media sección. La sección va de
              $y = -h$ a $y = h$, y como $y^{4}$ es par la mitad de abajo
              aporta lo mismo que la de arriba: la integral es el doble,
              $2bh^{5}/5$.
          - valor: '0.156'
            mensaje: |
              Has medido $y$ desde el borde, de $0$ a $2h$. El eje $z$ de la
              figura pasa por el **centro** de la sección: $y$ va de $-h$ a
              $h$. Con $y$ desde el borde, además, $\sigma_x = Ay^{3}$ daría
              un axil que no es nulo.
        pista: |
          $M_0 = \int_{-h}^{h} A y^{3}\cdot y\,b\,dy$.
        desarrollo: |
          $$
          M_0 = A\,b\int_{-h}^{h} y^{4}\,dy = A\,b\,\frac{2h^{5}}{5}
          \quad\Longrightarrow\quad A = \frac{5M_0}{2\,b\,h^{5}} = 2{,}5\,\frac{M_0}{b\,h^{5}}
          $$
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              El flector es la resultante en momento de las tensiones normales
              de la sección: $M_z = \int_A \sigma_x\,y\,dA$ (ec. 7.7), con $y$
              desde el centro de la sección y hacia abajo.
          - texto: >-
              La tensión es uniforme en el ancho: el elemento de área es una
              franja $dA = b\,dy$, y $y$ va de $-h$ a $h$.
          - texto: >-
              $M_0 = A\,b\int_{-h}^{h} y^{4}\,dy = \tfrac{2}{5}A\,b\,h^{5}$, así
              que $A = 5M_0/(2bh^{5})$.
          - texto: >-
              Como $y^{3}$ es impar, la integral sobre la sección es cero y el
              momento no depende de $A$.
            trampa: true
            mensaje: |
              Es impar $y^{3}$, la tensión, y por eso el **axil** es nulo. El
              momento lleva un factor $y$ más: se integra $y^{4}$, que es par
              y no se anula.
    resolucion: |
      **La idea.** El momento flector es la resultante en momento de las
      tensiones normales (tema 7, ec. 7.7):

      $$
      M_z = \int_A \sigma_x\,y\,dA
      $$

      con $y$ medida desde el centro de la sección y hacia abajo, como en la
      figura. Como $\sigma_x$ es uniforme en el ancho, se toma una franja
      horizontal $dA = b\,dy$, y la sección va de $y = -h$ a $y = h$.

      **La cuenta.**

      $$
      M_0 = \int_{-h}^{h} A y^{3}\cdot y\cdot b\,dy = A\,b\left[\frac{y^{5}}{5}\right]_{-h}^{h} = \frac{2}{5}\,A\,b\,h^{5}
      \quad\Longrightarrow\quad
      A = \frac{5\,M_0}{2\,b\,h^{5}}
      $$

      **Comprobaciones.** El axil de esa distribución es
      $N = \int_{-h}^{h} A y^{3}\,b\,dy = 0$, porque $y^{3}$ es impar: la
      sección está en flexión pura, como dice el enunciado al dar solo un
      flector. Y el signo: con $M_0 > 0$ sale $A > 0$, así que las fibras
      inferiores ($y > 0$) están a tracción, que es lo que hace un flector
      positivo en el convenio del curso. El motor (`integra`, Gauss-Legendre)
      da $\int_{-1}^{1} y^{4}\,dy = 0{,}4$ y por tanto el coeficiente 2,5.

