asignatura: elasticidad-resistencia
curso: '2016-2017'
convocatoria: primer-parcial
fecha: 7 y 14 de noviembre de 2016
# El primer parcial de Elasticidad y Resistencia de Materiales de 2016-2017
# («Parte 1» en la cabecera), hecho en dos días: la hoja de TEORÍA, fechada el
# 07/11/2016, con cuatro preguntas de 1 punto, y la de EJERCICIOS, fechada el
# 14/11/2016, con tres de 2 puntos. Dos páginas, solo en castellano, y diez
# puntos que el cuadernillo imprime todos. La cabecera de la segunda hoja
# dice «EJERCICICIOS»; es cabecera y no se transcribe.
#
# Se transcribe tal cual, con sus puntos impresos. Lo que hay que saber de
# ese texto, dicho antes de que nadie lo deduzca:
#
# 1. **EL PDF PIERDE MEDIA FIGURA EN TRES PREGUNTAS, Y EL WORD LAS TIENE.**
#    Las figuras son dibujos VML del Word original (16-ERM-nov1.docx), y al
#    pasarlas a PDF se perdieron trozos: en la teoría 3b, todas las flechas
#    de la rebanada (N, T, M, sus incrementos y la carga qx); en el
#    ejercicio 2, las flechas de los ejes x e y (quedan sus letras) y los
#    dos arcos de los ángulos; en el ejercicio 3, los triángulos de los
#    apoyos de A y de los tres pasadores del techo (quedan sus barras
#    grises) y los dos arcos de η. Se han
#    leído las coordenadas del XML (guiones/vml-svg.py en la unidad p2e) y
#    se redibujan enteras; cada pie de figura dice qué faltaba.
#
# 2. **LA GALGA c ESTÁ A 150° DE x.** En el PDF del ejercicio 2 la galga c
#    sale torcida, cruzando su lado; en el Word está sobre el lado que forma
#    30° con la base y sube hacia la izquierda, igual que en la misma figura
#    del parcial de 2017-2018. Se lee a 150° de x (o −30°, la misma recta).
#    Con 30° saldría otro estado, εy = 2000·10⁻⁶ y γxy = −2078·10⁻⁶: es uno
#    de los distractores del paso de cálculo. Los rótulos «60º» y «30º»
#    llevan en el Word una «x» cursiva que se sale de su cuadro de texto y el
#    PDF imprime suelta debajo; no se dibuja. La línea de las medidas lleva
#    además en el Word una ε repetida, en una fuente sin ese glifo, que el
#    PDF no imprime; tampoco se transcribe.
#
# 3. **LO QUE LA FIGURA DEL EJERCICIO 3 DICE Y EL TEXTO NO.** Los tres
#    pasadores del techo están a la misma altura: las barras 1 y 2 miden
#    b/cos η y la 3, montada, b. Junto a cada barra va su número y, debajo,
#    «A», la sección. η no tiene valor: el resultado va en función de η, y
#    los pasos con números usan η = 30°, que es nuestro y se dice.
#
# 4. **ERRATAS Y RAREZAS DEL TEXTO, CONSERVADAS**: «Un alambre rígido» (la
#    teoría 2 llama rígido a un alambre que se estira; rígidos son los
#    soportes, y la nota del ejercicio lo dice), «¿ A qué» con espacio y «ºC»
#    con el ordinal (teoría 2), «εa=» sin espacio y «E = 70 GPa ;» (ejercicio
#    2), «(2 p)» con espacio, «A y E ,» y «fabriación» (ejercicio 3).
#
# 5. **DOS NUMERACIONES.** La teoría va de 1 a 4 y los ejercicios vuelven a
#    empezar en 1. Aquí la teoría son n 1 a 4 y los ejercicios n 5, 6 y 7;
#    la `fuente` de cada ejercicio dice el nombre impreso.
#
# 6. **LA PREGUNTA 3 SE PARTE EN DOS.** Imprime «3. Responder a las
#    siguientes preguntas:» y dos mitades, a/ y b/, de «(0,5p)» cada una,
#    con una figura cada una y de cosas distintas: la a/ integra σx = Ay³
#    para sacar A del flector M0, y la b/ deduce las ecuaciones de
#    equilibrio de una rebanada con qx en la cara superior. Son dos
#    ejercicios, los dos con n 3 y del tema 7; cada uno lleva la frase común,
#    su mitad y su figura, y una nota que remite a la otra mitad. El 3 no
#    imprime total: el punto de puntosImpresos es la suma de sus dos medios.
#
# 7. **EL PLANO DEL EJERCICIO 1 b/ NO ESTÁ FIJADO DEL TODO.** 45° con x y 60°
#    con y dejan nz = ±½. Se resuelven los dos (σn = −4,75 y τn = 10,06 MPa
#    con nz = +½; 7,25 y 3,345 con nz = −½), y los pasos dan por buenas las
#    dos respuestas.
#
# 8. **LA TEORÍA 4 ES LA MISMA PREGUNTA, PALABRA POR PALABRA, QUE LA 4 DEL
#    PRIMER PARCIAL DE 2015-2016**, que no está en el sitio: se resuelve aquí.
#    Ninguna de las siete es copia literal de una pregunta de los cuatro
#    parciales ya publicados (2018, 2019, 2020 y 2022).
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso (src/lib/erm) y de un segundo camino
# (fase-p/p2e, guiones/cifras.mjs). Las preguntas 1, 3b y 4 de la teoría
# piden deducir y no traen números: sus pasos de cálculo son ejemplos
# nuestros, y lo dicen.
pdf: 2016-2017-1par.pdf
puntosImpresos:
  fuente: >-
    Impresos junto a cada pregunta: «(1p)» en las preguntas 1, 2 y 4 de la
    teoría, «(0,5p)» en cada mitad de la 3, que no imprime total, y «(2p)» o
    «(2 p)» en los tres ejercicios; págs. 1 y 2 del cuadernillo.
  reparto:
    - { n: 1, puntos: 1 }
    - { n: 2, puntos: 1 }
    - { n: 3, puntos: 1 }
    - { n: 4, puntos: 1 }
    - { n: 5, puntos: 2 }
    - { n: 6, puntos: 2 }
    - { n: 7, puntos: 2 }

