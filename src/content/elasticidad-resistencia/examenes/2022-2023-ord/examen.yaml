asignatura: elasticidad-resistencia
curso: '2022-2023'
convocatoria: ordinaria
fecha: 13 de enero de 2023
# El examen final de Elasticidad y Resistencia de Materiales del 13 de enero
# de 2023: cuatro páginas, la 1 de TEORÍA (cuatro cuestiones de 1 punto) y la
# 2 a la 4 de PROBLEMAS (cuatro de 1,5 puntos; el problema 4 acaba en la
# página 4, con sus apartados, sus datos y la figura). Diez puntos en total,
# y el cuadernillo los imprime todos. El mismo día se hizo la segunda parte,
# que comparte cuatro preguntas con este examen (punto 5).
#
# El cuadernillo es bilingüe, castellano a la izquierda y euskera a la
# derecha, y se transcribe **solo la columna en castellano**, tal cual. El
# euskera pide lo mismo en las ocho preguntas.
#
# 1. **EL PDF CORTA TEXTO, Y EL WORD MANDA.** Las dos aristas de la teoría 1
#    se salen de su cuadro por la derecha y pierden el término en k; la línea
#    de datos del problema 1 se corta detrás de εD (faltan εE, εF, σLim, E y
#    ν); la figura de las vigas cruzadas sale sin rótulos; en el problema 3
#    la cota de AB se queda en «2» (las constantes de los resortes sí se
#    ven enteras), y en el problema 4 la línea de datos pierde el «= 2» de
#    Iz/AL². Todo se ha leído en el Word original, cuyas figuras son las
#    mismas.
#
# 2. **LO QUE EL TEXTO NO DICE.** En el problema 1, «plano paralelo al plano
#    X» se lee como paralelo al eje X (con la normal en el plano YZ: un plano
#    paralelo al plano x = 0 tendría σx ≠ 0 y no habría respuesta),
#    «componente intrínseca normal» como la tensión normal, y E en kg/cm²,
#    como σLim, que el texto da y ningún apartado usa. Las lecturas de las
#    preguntas compartidas con la segunda parte se dicen en la cabecera de
#    aquel examen. Cada lectura va también en la nota de su enunciado.
#
# 3. **ERRATAS Y GRAFÍAS DEL TEXTO, CONSERVADAS**: «se un tanque» por «de un
#    tanque» (teoría 3); «16mm» sin espacio; «Kg/cm²» con mayúscula y
#    «2x10⁶» sin unidad (problema 1); los puntos impresos con punto,
#    «(1.5p)», salvo el problema 2, «(1,5p)». La fecha de las páginas 2 a 4
#    dice «13/01/20232»; la de la página 1 y la del euskera, 13/01/2023.
#
# 4. **DOS NUMERACIONES EN UN CUADERNILLO.** La teoría va de la 1 a la 4 y los
#    problemas vuelven a empezar en 1. Aquí la teoría son **n 1 a 4** y los
#    problemas **n 5 a 8**; la `fuente` de cada ejercicio dice el nombre
#    impreso. Ninguna pregunta se parte.
#
# 5. **PREGUNTAS REPETIDAS.** Cinco de las ocho no se resuelven aquí: la
#    entrada apunta al ejercicio donde ya están.
#    - La **teoría 2** es, palabra por palabra, la cuestión 3 del parcial 1 de
#      2018-2019: «2. (1p) Criterio de los estados límites de Mohr.»
#    - La **teoría 4** y los **problemas 2, 3 y 4** son la teoría 2 y los
#      problemas 1, 2 y 3 de la segunda parte del mismo día, con el mismo
#      texto. Solo cambian el número y los puntos de los problemas: aquí
#      «2.(1,5p)», «3. (1.5p)» y «4.(1.5p)», allí 2 puntos cada uno. Por eso
#      los tres se transcriben sin su «(2p)»: cada hoja pone sus puntos desde
#      `puntosImpresos`, y la `fuente` dice los dos valores. La teoría 4
#      conserva su «(1p)», que vale en los dos exámenes.
#    - El problema 2, el eje con el tirante, va al tema 11 y no al 13: no usa
#      ningún teorema energético, sino la compatibilidad de un hiperestático
#      (punto 6 de la cabecera de la segunda parte).
#
# El examen no publica resolución: los desarrollos son nuestros, y cada cifra
# sale del motor del curso y de un segundo camino (fase-p/p9a,
# guiones/cifras.mjs y guiones/valores.mjs).
pdf: 2022-2023-ord.pdf
puntosImpresos:
  fuente: Cabecera de cada pregunta, «(1p)» en la teoría y «(1.5p)» o «(1,5p)» en los problemas, págs. 1-4 del cuadernillo.
  reparto:
    - { n: 1, puntos: 1 }
    - { n: 2, puntos: 1 }
    - { n: 3, puntos: 1 }
    - { n: 4, puntos: 1 }
    - { n: 5, puntos: 1.5 }
    - { n: 6, puntos: 1.5 }
    - { n: 7, puntos: 1.5 }
    - { n: 8, puntos: 1.5 }

