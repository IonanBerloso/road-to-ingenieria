      <figcaption>

      Redibujada del enunciado. En el original cada galga lleva dibujada su
      rejilla.

      </figcaption>
      </figure>

      **Notas nuestras.** El texto no da unidades para $E$: se toma en
      kg/cm², como $\sigma_{Lim}$. «Plano paralelo al plano X» se lee como un
      plano paralelo al eje X, es decir, con la normal en el plano YZ; un
      plano paralelo al plano coordenado $x = 0$ tendría la normal según X, y
      ahí la tensión normal es $\sigma_x$, que no es cero. «Componente
      intrínseca normal» se lee como la tensión normal, la de las
      componentes intrínsecas del tema 2.
    pide: >-
      El tensor de deformaciones, las deformaciones principales con sus
      direcciones, las tensiones principales, la tangencial máxima y la normal
      de los planos paralelos a X con tensión normal nula.
    pasos:
      - tipo: reconocer
        pregunta: |
          A, C y E están sobre los ejes. ¿Qué dan las galgas B, D y F, que
          están a 45° entre dos ejes?
        opciones:
          - texto: >-
              Cada una, junto con las dos de sus ejes, la distorsión de ese par
              de ejes, porque a 45° la lectura es la media de las dos normales
              más la mitad de la distorsión
            correcta: true
            mensaje: |
              Eso es. Para una dirección $\hat{u}$, $\varepsilon_u =
              \{u\}^{t}[\varepsilon]\{u\}$ (ec. 3.52, p. 17), y a 45° entre y
              y z queda $\varepsilon_D = \tfrac{1}{2}(\varepsilon_y +
              \varepsilon_z) + \tfrac{1}{2}\gamma_{yz}$. Con $\varepsilon_y$ y
              $\varepsilon_z$ conocidas por C y E, sale $\gamma_{yz}$.
          - texto: >-
              Directamente las distorsiones, $\gamma_{xy} = \varepsilon_B$,
              $\gamma_{yz} = \varepsilon_D$ y $\gamma_{zx} = \varepsilon_F$
            mensaje: |
              Una galga mide siempre un alargamiento en su dirección, nunca un
              cambio de ángulo. A 45° ese alargamiento mezcla las dos normales
              y la distorsión: $\varepsilon_D = \tfrac{1}{2}(\varepsilon_y +
              \varepsilon_z) + \tfrac{1}{2}\gamma_{yz}$.
          - texto: >-
              Las componentes del tensor fuera de la diagonal,
              $\varepsilon_{yz} = \varepsilon_D$, sin más cuenta
            mensaje: |
              Solo sería así si $\varepsilon_y + \varepsilon_z$ fuera cero, y
              aun así habría que comprobarlo. La lectura a 45° lleva siempre
              la media de las dos normales de su plano.
          - texto: >-
              Nada nuevo, porque las tres de los ejes ya dan el tensor
              entero
            mensaje: |
              A, C y E dan solo la diagonal, $\varepsilon_x$, $\varepsilon_y$
              y $\varepsilon_z$. Las tres distorsiones necesitan otras tres
              lecturas fuera de los ejes; por eso hay seis galgas.
      - tipo: calcular
        titulo: El término yz del tensor
        pregunta: |
          ¿Cuánto vale la componente $\tfrac{1}{2}\gamma_{yz}$ del tensor de
          deformaciones, en unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.01
          formato: un número, en 10⁻⁴
        distractores:
          - valor: '12'
            mensaje: |
              Es $\gamma_{yz}$ entera. En el tensor de deformaciones, fuera de
              la diagonal va la **mitad** de la distorsión: con
              $\tfrac{1}{2}\gamma$ es con lo que $\{u\}^{t}[\varepsilon]\{u\}$
              da la lectura de una galga.
          - valor: '3'
            mensaje: |
              Has tomado la lectura de D como si fuera $\gamma_{yz}$ y luego la
              has dividido entre dos. La galga da $\varepsilon_D =
              \tfrac{1}{2}(\varepsilon_y + \varepsilon_z) + \tfrac{1}{2}\gamma_{yz}$,
              y con $\varepsilon_y = \varepsilon_z = 0$ la lectura **es** ya
              $\tfrac{1}{2}\gamma_{yz}$.
        pista: |
          $\varepsilon_D = \tfrac{1}{2}(\varepsilon_C + \varepsilon_E) + \tfrac{1}{2}\gamma_{yz}$.
          Haz lo mismo con B y con F.
        desarrollo: |
          Con $\varepsilon_x = \varepsilon_A$, $\varepsilon_y = \varepsilon_C$ y
          $\varepsilon_z = \varepsilon_E$:

          $$
          \gamma_{xy} = 2\varepsilon_B - \varepsilon_A - \varepsilon_C = (4 - 4 - 0)\cdot10^{-4} = 0
          $$

          $$
          \gamma_{yz} = 2\varepsilon_D - \varepsilon_C - \varepsilon_E = (12 - 0 - 0)\cdot10^{-4} = 12\cdot10^{-4}
          $$

          $$
          \gamma_{zx} = 2\varepsilon_F - \varepsilon_E - \varepsilon_A = (4 - 0 - 4)\cdot10^{-4} = 0
          $$

          $$
          [\varepsilon] = \begin{pmatrix} 4 & 0 & 0\\ 0 & 0 & 6\\ 0 & 6 & 0 \end{pmatrix}\cdot10^{-4}
          $$
      - tipo: calcular
        titulo: La mayor deformación principal
        pregunta: |
          ¿Cuánto vale $\varepsilon_1$, en unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.01
          formato: un número, en 10⁻⁴
        distractores:
          - valor: '4'
            mensaje: |
              Es $\varepsilon_x$, que es principal pero no la mayor. Sale como
              la mayor si en el bloque yz has puesto 3 en lugar de 6 (la
              lectura de D tomada como $\gamma_{yz}$): entonces el bloque da
              $\pm3$ y gana la x. Con el 6 bueno, el bloque yz da $\pm6$.
          - valor: '12'
            mensaje: |
              Es lo que sale con $\gamma_{yz}$ entera fuera de la diagonal. El
              tensor lleva $\tfrac{1}{2}\gamma_{yz} = 6\cdot10^{-4}$, y el
              bloque yz tiene autovalores $\pm6\cdot10^{-4}$.
        pista: |
          x es principal (su fila solo tiene la diagonal). Queda el bloque yz,
          $\begin{pmatrix}0 & 6\\ 6 & 0\end{pmatrix}\cdot10^{-4}$.
        desarrollo: |
          La fila x no tiene términos cruzados, así que x es principal, con
          $4\cdot10^{-4}$. El bloque yz tiene la diagonal nula, y sus
          autovalores son $\pm6\cdot10^{-4}$:

          $$
          \varepsilon_1 = 6\cdot10^{-4}\ \text{según}\ \tfrac{1}{\sqrt{2}}(0, 1, 1),\quad
          \varepsilon_2 = 4\cdot10^{-4}\ \text{según}\ x,\quad
          \varepsilon_3 = -6\cdot10^{-4}\ \text{según}\ \tfrac{1}{\sqrt{2}}(0, 1, -1)
          $$

          La traza se conserva: $(6 + 4 - 6)\cdot10^{-4} = (4 + 0 + 0)\cdot10^{-4}$.
          Y la dirección 1 es justo la de la galga D, que lee
          $\varepsilon_1$ sin más cuenta.
      - tipo: calcular
        titulo: La mayor tensión principal
        pregunta: |
          ¿Cuánto vale $\sigma_1$, en kg/cm²?
        respuesta:
          tipo: numero
          valor: '1384.62'
          tolerancia: 0.5
          formato: un número, en kg/cm²
        distractores:
          - valor: '923.08'
            mensaje: |
              Te ha faltado el término volumétrico. Hooke en función de las
              deformaciones es $\sigma = 2G\varepsilon + \lambda e$, y aquí
              $e = 4\cdot10^{-4}$ no es cero: $\lambda e = 461{,}54$ kg/cm² se
              suma a las tres principales.
          - valor: '1200'
            mensaje: |
              Has hecho $E\varepsilon_1$, como en una barra a tracción. En un
              estado triaxial cada tensión depende de las tres deformaciones:
              $\sigma_1 = 2G\varepsilon_1 + \lambda e$.
        pista: |
          $G = E/2(1+\nu)$, $\lambda = \nu E/[(1+\nu)(1-2\nu)]$ y
          $e = \varepsilon_1 + \varepsilon_2 + \varepsilon_3$. Las direcciones
          principales de tensión son las de deformación.
        desarrollo: |
          $$
          G = \frac{2\cdot10^{6}}{2{,}6} = 769\,230{,}8,\qquad
          \lambda = \frac{0{,}3\cdot2\cdot10^{6}}{1{,}3\cdot0{,}4} = 1\,153\,846{,}2,\qquad
          e = 4\cdot10^{-4}
          $$

          $$
          \sigma_1 = 2G\varepsilon_1 + \lambda e = 923{,}08 + 461{,}54 = 1384{,}62\ \text{kg/cm}^{2}
          $$

          $$
          \sigma_2 = 2G\cdot4\cdot10^{-4} + 461{,}54 = 1076{,}92,\qquad
          \sigma_3 = -923{,}08 + 461{,}54 = -461{,}54\ \text{kg/cm}^{2}
          $$
      - tipo: calcular
        titulo: La tangencial máxima
        pregunta: |
          ¿Cuánto vale $\tau_{max}$, en kg/cm²?
        respuesta:
          tipo: numero
          valor: '923.08'
          tolerancia: 0.5
          formato: un número, en kg/cm²
        distractores:
          - valor: '1846.15'
            mensaje: |
              Es $\sigma_1 - \sigma_3$, el diámetro del círculo de Mohr grande.
              La tangencial máxima es su radio, la mitad.
          - valor: '153.85'
            mensaje: |
              Es $(\sigma_1 - \sigma_2)/2$, el radio de uno de los círculos
              pequeños. La máxima va entre la mayor y la menor principal,
              $\sigma_1$ y $\sigma_3$.
        pista: |
          $\tau_{max} = (\sigma_1 - \sigma_3)/2$.
        desarrollo: |
          $$
          \tau_{max} = \frac{1384{,}62 + 461{,}54}{2} = 923{,}08\ \text{kg/cm}^{2}
          $$

          Coincide con $\tau_{yz} = G\gamma_{yz}$: el plano de la tangencial
          máxima es el plano y, porque las principales 1 y 3 están a 45° de
          y y de z.
      - tipo: calcular
        titulo: El plano paralelo a X sin tensión normal
        pregunta: |
          Toma la normal $\hat{n} = (0, \cos\theta, \operatorname{sen}\theta)$,
          con θ medido desde el eje Y hacia el Z. Hay dos planos; para el de
          normal más cercana al eje Y, ¿cuánto vale θ, en grados?
        respuesta:
          tipo: numero
          valor: '-15'
          tolerancia: 0.1
          formato: un número, en grados, entre −90 y 90
        distractores:
          - valor: '15'
            mensaje: |
              Te ha salido el signo cambiado. Con $\tau_{yz} > 0$, la tensión
              normal crece cuando la normal tiene $y$ y $z$ del mismo signo, y
              para anularla hay que ir donde tienen signos contrarios:
              $\operatorname{sen}2\theta = -0{,}5$.
          - valor: '-30'
            mensaje: |
              Es $2\theta$. La ecuación da $\operatorname{sen}2\theta = -0{,}5$,
              y la normal está a la mitad de ese ángulo.
          - valor: '0'
            mensaje: |
              Has anulado la **deformación** normal: con $\varepsilon_y =
              \varepsilon_z = 0$, $\varepsilon_n = \gamma_{yz}\operatorname{sen}\theta\cos\theta$
              se anula en los ejes. La pregunta es por la componente intrínseca
              normal, la tensión, que lleva el $\lambda e$ y no se anula en Y.
        pista: |
          $\sigma_n = \sigma_y\cos^{2}\theta + \sigma_z\operatorname{sen}^{2}\theta + \tau_{yz}\operatorname{sen}2\theta$,
          con $\sigma_y = \sigma_z = 461{,}54$ y $\tau_{yz} = 923{,}08$ kg/cm².
        desarrollo: |
          Las tensiones del plano YZ son $\sigma_y = \sigma_z = \lambda e = 461{,}54$
          y $\tau_{yz} = G\gamma_{yz} = 923{,}08$ kg/cm². Como $\sigma_y = \sigma_z$:

          $$
          \sigma_n = 461{,}54 + 923{,}08\operatorname{sen}2\theta = 0
          \;\Longrightarrow\;
          \operatorname{sen}2\theta = -0{,}5
          $$

          $$
          \theta = -15^\circ:\ \hat{n} = (0;\ 0{,}9659;\ -0{,}2588),
          \qquad
          \theta = 105^\circ:\ \hat{n} = (0;\ -0{,}2588;\ 0{,}9659)
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              A, C y E dan la diagonal, y cada galga a 45° da la distorsión de
              su plano, $\gamma = 2\varepsilon_{45} - \varepsilon_i - \varepsilon_j$;
              solo $\gamma_{yz} = 12\cdot10^{-4}$ no es nula.
          - texto: >-
              x es principal con $4\cdot10^{-4}$, y el bloque yz da
              $\pm6\cdot10^{-4}$ en las bisectrices de Y y Z.
          - texto: >-
              Con $e = 4\cdot10^{-4}$, $\sigma = 2G\varepsilon + \lambda e$ da
              1384,62, 1076,92 y −461,54 kg/cm², y $\tau_{max} = 923{,}08$.
          - texto: >-
              En YZ, $\sigma_n = 461{,}54 + 923{,}08\operatorname{sen}2\theta$,
              que se anula en θ = −15° y en θ = 105°.
          - texto: >-
              Como $\varepsilon_y = \varepsilon_z = 0$, también $\sigma_y = \sigma_z = 0$,
              y la tensión normal se anula en los propios ejes Y y Z.
            trampa: true
            mensaje: |
              En un estado triaxial una deformación nula no da tensión nula:
              $\sigma_y = 2G\varepsilon_y + \lambda e = \lambda e = 461{,}54$
              kg/cm², porque $\varepsilon_x$ hace crecer el volumen. Es el
              efecto Poisson visto al revés: para que y no se acorte, hace falta
              tracción en y.
    resolucion: |
      **La idea.** Cada galga mide el alargamiento unitario en su dirección,
      $\varepsilon_u = \{u\}^{t}[\varepsilon]\{u\}$ (apuntes del tema 3,
      ec. 3.52, p. 17). Las de los ejes dan la diagonal; las de las
      bisectrices, con la diagonal ya conocida, dan las distorsiones.

      **a) El tensor.** Con $\varepsilon_x = \varepsilon_A$, $\varepsilon_y =
      \varepsilon_C$, $\varepsilon_z = \varepsilon_E$ y, a 45° entre dos ejes
      $i$ y $j$, $\varepsilon_{45} = \tfrac{1}{2}(\varepsilon_i + \varepsilon_j) +
      \tfrac{1}{2}\gamma_{ij}$:

      $$
      \gamma_{xy} = (4 - 4 - 0)\cdot10^{-4} = 0,\qquad
      \gamma_{yz} = (12 - 0 - 0)\cdot10^{-4} = 12\cdot10^{-4},\qquad
      \gamma_{zx} = (4 - 0 - 4)\cdot10^{-4} = 0
      $$

      $$
      [\varepsilon] = \begin{pmatrix} 4 & 0 & 0\\ 0 & 0 & 6\\ 0 & 6 & 0 \end{pmatrix}\cdot10^{-4}
      $$

      **b) Las principales.** La fila x no tiene términos cruzados: x es
      principal, con $4\cdot10^{-4}$. El bloque yz, de diagonal nula y
      término cruzado $6\cdot10^{-4}$, tiene autovalores $\pm6\cdot10^{-4}$ en
      sus bisectrices:

      $$
      \varepsilon_1 = 6\cdot10^{-4}\ \text{según}\ \tfrac{1}{\sqrt{2}}(0, 1, 1),\qquad
      \varepsilon_2 = 4\cdot10^{-4}\ \text{según}\ (1, 0, 0),\qquad
      \varepsilon_3 = -6\cdot10^{-4}\ \text{según}\ \tfrac{1}{\sqrt{2}}(0, 1, -1)
      $$

      La galga D está sobre la dirección 1 y la lee tal cual. La traza se
      conserva, $e = 4\cdot10^{-4}$.

      **c) Las tensiones principales.** El material es isótropo, así que las
      direcciones principales de tensión son las de deformación, y en ellas
      $\sigma = 2G\varepsilon + \lambda e$ (tema 4), con $E = 2\cdot10^{6}$
      kg/cm² y $\nu = 0{,}3$:

      $$
      G = 769\,230{,}8,\qquad \lambda = 1\,153\,846{,}2,\qquad \lambda e = 461{,}54\ \text{kg/cm}^{2}
      $$

      $$
      \sigma_1 = 1384{,}62,\qquad \sigma_2 = 1076{,}92,\qquad \sigma_3 = -461{,}54\ \text{kg/cm}^{2}
      $$

      En los ejes, $\sigma_x = 1076{,}92$, $\sigma_y = \sigma_z = 461{,}54$ y
      $\tau_{yz} = G\gamma_{yz} = 923{,}08$ kg/cm². La traza casa:
      $1384{,}62 + 1076{,}92 - 461{,}54 = 1076{,}92 + 461{,}54 + 461{,}54$.

      **d) La tangencial máxima.**

      $$
      \tau_{max} = \frac{\sigma_1 - \sigma_3}{2} = \frac{1384{,}62 + 461{,}54}{2} = 923{,}08\ \text{kg/cm}^{2}
      $$

      Actúa en los planos y y z, que forman 45° con las direcciones 1 y 3.

      **e) El plano paralelo a X con tensión normal nula.** Su normal está en
      el plano YZ, $\hat{n} = (0, \cos\theta, \operatorname{sen}\theta)$:

      $$
      \sigma_n = \sigma_y\cos^{2}\theta + \sigma_z\operatorname{sen}^{2}\theta + \tau_{yz}\operatorname{sen}2\theta
      = 461{,}54 + 923{,}08\operatorname{sen}2\theta = 0
      $$

      $\operatorname{sen}2\theta = -0{,}5$, y hay dos planos:

      $$
      \theta = -15^\circ:\ \hat{n} = (0;\ 0{,}9659;\ -0{,}2588),
      \qquad
      \theta = 105^\circ:\ \hat{n} = (0;\ -0{,}2588;\ 0{,}9659)
      $$

      En los dos queda solo tangencial, $\tau_n = \tau_{yz}\cos2\theta =
      799{,}41$ kg/cm². El $\sigma_{Lim}$ del enunciado no lo pide ningún
      apartado. Si «componente intrínseca normal» se leyera como la
      deformación normal, $\varepsilon_n = \gamma_{yz}\operatorname{sen}\theta\cos\theta$
      se anularía en los propios ejes Y y Z.
