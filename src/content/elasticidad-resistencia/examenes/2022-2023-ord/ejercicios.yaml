    pide: >-
      La presión interior máxima con cada una de las dos disposiciones de las
      placas, en MPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el tanque de la izquierda hay juntas de dos clases: los anillos
          horizontales y las juntas verticales cortas entre placas de un mismo
          anillo. ¿Cuáles limitan la presión?
        opciones:
          - texto: >-
              Las verticales, porque la tensión perpendicular a ellas es la
              circunferencial, que es el doble de la longitudinal
            correcta: true
            mensaje: |
              Eso es. En la pared de un cilindro las direcciones principales
              son la circunferencial y la del eje (apartado 8.5.1, p. 8). Una
              junta vertical la cruza la circunferencial,
              $\sigma_1 = pr/t$ (ec. 8.16); un anillo horizontal, la
              longitudinal, $\sigma_2 = pr/2t$ (ec. 8.17), la mitad.
          - texto: >-
              Los anillos horizontales, porque hay muchos más metros de
              soldadura en ellos
            mensaje: |
              La longitud de soldadura no cambia la tensión, que es fuerza por
              unidad de área. Lo que importa es qué tensión cruza cada junta:
              un anillo horizontal lo cruza la tensión longitudinal,
              $pr/2t$, y una junta vertical la circunferencial, $pr/t$.
          - texto: >-
              Las dos igual, porque la presión empuja igual en todas las
              direcciones
            mensaje: |
              La presión del aire es la misma en todas direcciones, pero las
              tensiones en la pared no: el cilindro tiene un radio de
              curvatura $r$ alrededor y uno infinito a lo largo (ec. 8.14). Las
              tensiones iguales son las de la **esfera**, $pr/2t$ en las dos
              direcciones (ec. 8.15).
          - texto: >-
              Ninguna en especial, porque las juntas verticales están
              desfasadas de un anillo al siguiente
            mensaje: |
              Desfasarlas evita una línea de soldadura continua de arriba
              abajo, pero cada junta vertical sigue soportando entera la
              tensión circunferencial que la cruza.
      - tipo: calcular
        titulo: La presión con las placas en anillos
        pregunta: |
          Con las placas en anillos, ¿cuál es la presión máxima, en MPa?
        respuesta:
          tipo: numero
          valor: '0.416'
          tolerancia: 0.001
          formato: un número, en MPa
        distractores:
          - valor: '0.832'
            mensaje: |
              Has limitado con la tensión longitudinal, la de los anillos
              horizontales. Las juntas verticales soportan la circunferencial,
              $pr/t$, el doble, y son las que mandan.
          - valor: '0.208'
            mensaje: |
              Has tomado el diámetro, 5 m, como radio. En $pr/t$ va el radio:
              $r = 2500$ mm.
        pista: |
          $\sigma_1 = pr/t$ con $r = 2500$ mm y $t = 16$ mm, y $\sigma_1 \le 65$ MPa.
        desarrollo: |
          $$
          \sigma_1 = \frac{p\,r}{t} = \frac{2500}{16}\,p = 156{,}25\,p,
          \qquad
          \sigma_2 = \frac{p\,r}{2t} = 78{,}125\,p
          $$

          $$
          156{,}25\,p \le 65\ \text{MPa}
          \;\Longrightarrow\;
          p = \frac{65\ \text{MPa}}{156{,}25} = 0{,}416\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La presión con las placas a 45°
        pregunta: |
          Con las placas giradas, las juntas forman 45° con la horizontal.
          ¿Cuál es la presión máxima, en MPa?
        respuesta:
          tipo: numero
          valor: '0.554667'
          tolerancia: 0.001
          formato: un número, en MPa
        distractores:
          - valor: '0.416'
            mensaje: |
              Es la presión de los anillos: has limitado con la
              circunferencial entera. Una junta a 45° no la cruza de frente;
              su normal forma 45° con las dos direcciones principales, y la
              tensión normal a la junta es la media de las dos.
          - valor: '1.664'
            mensaje: |
              Has usado $(\sigma_1 - \sigma_2)/2 = 39{,}06\,p$, que es la
              tensión **tangencial** en la junta a 45°, la que la hace
              deslizar. El límite del enunciado es para la normal,
              $(\sigma_1 + \sigma_2)/2$.
          - valor: '0.277333'
            mensaje: |
              El planteamiento es bueno, pero con el diámetro en lugar del
              radio: con $r = 2500$ mm las tensiones son el doble de pequeñas.
        pista: |
          La normal a la junta forma 45° con la circunferencial:
          $\sigma_n = \sigma_1\cos^{2}45^\circ + \sigma_2\operatorname{sen}^{2}45^\circ$.
        desarrollo: |
          $$
          \sigma_n = \frac{\sigma_1 + \sigma_2}{2} = \frac{156{,}25 + 78{,}125}{2}\,p = 117{,}1875\,p
          $$

          $$
          p = \frac{65\ \text{MPa}}{117{,}1875} = 0{,}5547\ \text{MPa}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En la pared, $\sigma_1 = pr/t = 156{,}25\,p$ alrededor y
              $\sigma_2 = pr/2t = 78{,}125\,p$ a lo largo, con $r = 2500$ mm y
              $t = 16$ mm.
          - texto: >-
              En los anillos, las juntas verticales soportan $\sigma_1$ de
              frente, y $156{,}25\,p \le 65$ MPa da $p = 0{,}416$ MPa.
          - texto: >-
              En la hélice, la normal a la junta forma 45° con las dos
              principales, y la tensión normal es $(\sigma_1+\sigma_2)/2 =
              117{,}19\,p$.
          - texto: >-
              Con ese valor, $p = 0{,}5547$ MPa, un tercio más que con las
              placas en anillos.
          - texto: >-
              A 45° la tensión que cruza la junta es la tangencial máxima,
              $(\sigma_1-\sigma_2)/2$, y por eso la hélice aguanta cuatro
              veces más.
            trampa: true
            mensaje: |
              A 45° de las principales la tangencial es máxima, sí, pero el
              límite del enunciado es para la tensión **normal** a la
              soldadura. Esa normal es la media de las dos principales,
              $(\sigma_1+\sigma_2)/2$, no su semidiferencia.
    resolucion: |
      **La idea.** En la pared de un depósito de pequeño espesor no hay
      tangenciales en las direcciones circunferencial y longitudinal: son
      principales (apuntes del tema 8, apartado 8.5.1, págs. 8 y 9). La tensión
      que cruza una soldadura depende de cómo esté orientada respecto de
      ellas.

      **Las tensiones en la pared.** Con $r = 2500$ mm y $t = 16$ mm
      (ecs. 8.16 y 8.17, p. 10):

      $$
      \sigma_1 = \frac{p\,r}{t} = 156{,}25\,p,
      \qquad
      \sigma_2 = \frac{p\,r}{2t} = 78{,}125\,p
      $$

      **Las placas en anillos.** Hay juntas horizontales, cruzadas por
      $\sigma_2$, y juntas verticales, cruzadas por $\sigma_1$. Manda la
      mayor:

      $$
      156{,}25\,p \le 65\ \text{MPa}
      \;\Longrightarrow\;
      p = \frac{65\ \text{MPa}}{156{,}25} = 0{,}416\ \text{MPa}
      $$

      **Las placas a 45°.** Las dos familias de juntas forman 45° con la
      horizontal, y la normal a cada una forma 45° con las dos direcciones
      principales. La tensión normal sobre ese plano es la media de las dos
      (el centro del círculo de Mohr de la pared):

      $$
      \sigma_n = \sigma_1\cos^{2}45^\circ + \sigma_2\operatorname{sen}^{2}45^\circ
      = \frac{\sigma_1+\sigma_2}{2} = 117{,}1875\,p
      $$

      $$
      p = \frac{65\ \text{MPa}}{117{,}1875} = 0{,}5547\ \text{MPa}
      $$

      Las dos familias dan lo mismo, porque $\cos^{2}$ y $\operatorname{sen}^{2}$
      de 45° son iguales. Sobre la junta actúa además una tangencial de
      $(\sigma_1-\sigma_2)/2 = 39{,}06\,p$, que el enunciado no limita.

      **La comparación.** Girando las mismas placas 45°, el tanque aguanta
      $0{,}5547/0{,}416 = 1{,}333$ veces más presión: ninguna soldadura queda
      perpendicular a la tensión circunferencial, que es la grande.

  # ── Problema 1 · seis galgas: el tensor entero, las principales y un
  #    plano paralelo a X. Impreso «1.(1.5p)». La línea de datos se corta en
  #    el PDF detrás de εD; el resto (εE, εF, σLim, E y ν) es del Word.
  - id: exerm2223-ord-5-seis-galgas
    titulo: Seis galgas en tres ejes y tres bisectrices, y el plano paralelo a X sin tensión normal
    fuente: >-
      Problema 1 · Examen final del 13 de enero de 2023 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1,5 puntos. En el PDF la línea de datos se corta después de la
      galga D; el resto se ha leído en el Word original. El examen no publica
      resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      (1.5p) Dados los valores de las seis galgas para el estado de
      deformaciones de un punto:

      $$
      \varepsilon_A = 4\times10^{-4};\ \varepsilon_B = 2\times10^{-4};\ \varepsilon_C = 0;\
      \varepsilon_D = 6\times10^{-4};\ \varepsilon_E = 0;\ \varepsilon_F = 2\times10^{-4};
      $$

      $$
      \sigma_{Lim} = 2800\ \frac{\text{Kg}}{\text{cm}^{2}};\ E = 2\times10^{6};\ \nu = 0.3
      $$

      Determinar:

      a) Tensor de deformaciones

      b) Deformaciones principales y sus direcciones

      c) Tensiones principales

      d) Tensión tangencial máxima

      e) La normal del plano paralelo al plano X donde la componente
      intrínseca normal sea cero.

