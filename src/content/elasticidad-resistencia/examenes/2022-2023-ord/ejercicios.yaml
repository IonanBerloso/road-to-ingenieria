ejercicios:
  # ── Teoría · cuestión 1 · la distorsión γxy a partir de las dos aristas
  #    deformadas. La fórmula de las aristas se sale de su cuadro en el PDF
  #    (se pierde el término en k) y se ha leído en el Word original.
  - id: exerm2223-ord-1-la-distorsion-desde-las-aristas-deformadas
    titulo: La deformación tangencial γxy, a partir de las aristas deformadas
    fuente: >-
      Cuestión 1 de teoría · Examen final del 13 de enero de 2023 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Había caído igual, con 1 punto, como
      cuestión 1 de teoría del examen final del 16 de enero de 2019, allí con
      las aristas entre paréntesis. Con otras palabras había caído como
      cuestión 2 de teoría del examen final del 19 de enero de 2017, que el
      sitio resuelve en otro ejercicio. En el PDF las dos aristas se cortan
      por la derecha y se han leído en el Word original. El examen no publica
      resolución; el desarrollo es nuestro y sigue los apuntes del tema 3,
      apartado 3.3.2 (págs. 8 y 9). Los números del paso de cálculo son un
      ejemplo nuestro.
    nivel: examen
    enunciado: |
      (1p) Dadas las aristas deformadas de los ejes x, y, de un elemento
      diferencial, definir la deformación tangencial y determinar
      $\gamma_{xy}$.

      $$
      \overrightarrow{O'A'} = \left[1 + u_{,x}\right]dx\,\vec{i} + v_{,x}\,dx\,\vec{j} + w_{,x}\,dx\,\vec{k}
      $$

      $$
      \overrightarrow{O'B'} = u_{,y}\,dy\,\vec{i} + \left[1 + v_{,y}\right]dy\,\vec{j} + w_{,y}\,dy\,\vec{k}
      $$
    pide: >-
      Qué es la deformación tangencial y cuánto vale γxy en función de las
      derivadas de los desplazamientos, primero sin aproximar y después en un
      problema de pequeños desplazamientos.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular: ¿qué ángulo mide $\gamma_{xy}$?
        opciones:
          - texto: >-
              Lo que se cierra el ángulo recto que formaban las aristas x e y,
              $\gamma_{xy} = \tfrac{1}{2}\pi - \varphi_{xy}$, con $\varphi_{xy}$
              el ángulo entre $\overrightarrow{O'A'}$ y $\overrightarrow{O'B'}$
            correcta: true
            mensaje: |
              Eso es: es la definición de los apuntes, la **disminución del
              ángulo recto** entre dos direcciones inicialmente
              perpendiculares (ec. 3.15, p. 8). Por eso es positiva cuando el
              ángulo se cierra, y por eso todo el cálculo pasa por el ángulo
              entre las dos aristas deformadas: su coseno sale de un producto
              escalar.
          - texto: >-
              El ángulo $\varphi_{xy}$ que forman las dos aristas después de
              deformarse
            mensaje: |
              Ese ángulo es casi recto (con los números del paso siguiente,
              89,8°) y no mide la deformación: lo que la mide es cuánto le
              falta para 90°. $\gamma_{xy} = \tfrac{1}{2}\pi - \varphi_{xy}$, y por eso en
              las cuentas aparece $\cos\varphi_{xy} = \operatorname{sen}\gamma_{xy}$.
          - texto: >-
              Lo que gira la arista $\overrightarrow{O'A'}$ respecto al eje x,
              hacia el eje y
            mensaje: |
              Eso es solo la mitad de la historia: ese giro vale, en pequeños
              desplazamientos, $v_{,x}$. La arista $\overrightarrow{O'B'}$ también
              gira hacia x, $u_{,y}$, y el ángulo recto se cierra por los dos
              lados. Si las dos giran lo mismo en el mismo sentido, el elemento
              gira como un sólido y $\gamma_{xy} = 0$.
          - texto: >-
              La mitad de lo que se cierra el ángulo recto, la componente que
              va fuera de la diagonal del tensor
            mensaje: |
              La mitad es la componente del tensor de deformaciones,
              $\tfrac{1}{2}\gamma_{xy}$. La deformación tangencial de la
              definición es el cierre entero del ángulo; el $\tfrac{1}{2}$
              aparece después, al escribir el tensor.
      - tipo: calcular
        titulo: La distorsión de un elemento concreto
        pregunta: |
          Con $u_{,x} = 0{,}002$, $v_{,x} = 0{,}003$, $w_{,x} = -0{,}001$,
          $u_{,y} = 0{,}0005$, $v_{,y} = -0{,}001$ y $w_{,y} = 0{,}002$, ¿cuánto
          vale $\gamma_{xy}$ en un problema de pequeños desplazamientos, en
          unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '35'
          tolerancia: 0.05
          formato: un número, γxy en 10⁻⁴ rad
        distractores:
          - valor: '25'
            mensaje: |
              Has restado los dos giros, $v_{,x} - u_{,y}$. Esa resta mide lo
              que **gira** el elemento como un sólido, no lo que se distorsiona.
              Las dos aristas se acercan la una a la otra: $\overrightarrow{O'A'}$
              sube hacia y con $v_{,x}$ y $\overrightarrow{O'B'}$ se tumba hacia
              x con $u_{,y}$, y los dos cierres se **suman**.
          - valor: '17.5'
            mensaje: |
              Es la mitad, $\tfrac{1}{2}(u_{,y} + v_{,x})$, que es lo que va
              fuera de la diagonal del tensor de deformaciones. La pregunta es
              por $\gamma_{xy}$ entera, el cierre del ángulo recto.
          - valor: '10'
            mensaje: |
              Has sumado $u_{,x} + v_{,y}$, las derivadas de la diagonal. Esas
              miden lo que se alargan las aristas (ec. 3.14), no lo que se
              cierra el ángulo entre ellas. Las que cuentan son las cruzadas:
              lo que se mueve en y la arista x, y lo que se mueve en x la
              arista y.
        pista: |
          En pequeños desplazamientos, $\gamma_{xy} = u_{,y} + v_{,x}$ (ec. 3.21).
        desarrollo: |
          $$
          \gamma_{xy} = u_{,y} + v_{,x} = (5 + 30)\cdot10^{-4} = 35\cdot10^{-4}
          $$

          Sin aproximar nada, con la ec. 3.17 y las dos aristas tal cual
          ($dx = dy = 1$):

          $$
          \operatorname{sen}\gamma_{xy}
          = \frac{\overrightarrow{O'A'}\cdot\overrightarrow{O'B'}}{\left|\overrightarrow{O'A'}\right|\left|\overrightarrow{O'B'}\right|}
          = \frac{0{,}003496}{1{,}002005\cdot0{,}999002} = 0{,}0034925
          $$

          La fórmula lineal se equivoca en un 0,2 %: los términos que
          desprecia son productos de dos derivadas, del orden de $10^{-6}$.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la respuesta completa, como en el examen, la definición de la
          deformación tangencial y la deducción de γxy desde las dos aristas,
          hasta la expresión de pequeños desplazamientos.
        rubrica:
          - punto: >-
              Se define la deformación tangencial como la disminución del
              ángulo recto entre dos direcciones inicialmente perpendiculares,
              y se escribe γxy = π/2 − φxy (ec. 3.15).
            porque: >-
              Es la mitad de la pregunta («definir»), y es lo que fija el
              signo, positiva cuando el ángulo se cierra.
            minimo: true
          - punto: >-
              Se pasa del ángulo al producto escalar, cos φxy = sen γxy es el
              producto escalar de las dos aristas dividido entre el producto de
              sus módulos (ecs. 3.16 y 3.17).
            porque: >-
              Los únicos datos son las aristas, y el ángulo entre dos vectores
              sale de su producto escalar y de sus módulos.
            minimo: true
          - punto: >-
              Se escriben el numerador, [(1 + u,x) u,y + v,x (1 + v,y) +
              w,x w,y] dx dy, y los módulos, aproximando √(1 + α) ≈ 1 + α/2
              (ec. 3.18).
            porque: >-
              Es la expresión que no desprecia nada todavía, y la que enseña
              qué términos son de segundo orden.
          - punto: >-
              En pequeños desplazamientos se desprecian los términos de orden 2
              y superiores (ecs. 3.19 y 3.20) y se usa sen γxy ≈ γxy, hasta
              γxy = u,y + v,x (ec. 3.21).
            porque: >-
              Es el resultado que se usa en todo el curso, y hay que decir qué
              se ha despreciado para llegar a él.
            minimo: true
          - punto: >-
              Se interpreta el resultado, v,x es lo que gira la arista x hacia
              y, y u,y lo que gira la arista y hacia x.
            porque: >-
              Explica por qué los dos giros se suman, y por qué un giro de
              sólido rígido (v,x = −u,y) no deforma.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              La deformación tangencial es lo que disminuye el ángulo recto,
              $\gamma_{xy} = \tfrac{1}{2}\pi - \varphi_{xy}$, así que
              $\operatorname{sen}\gamma_{xy} = \cos\varphi_{xy}$.
          - texto: >-
              El coseno sale del producto escalar,
              $\operatorname{sen}\gamma_{xy} = \overrightarrow{O'A'}\cdot\overrightarrow{O'B'}
              / \left(\left|\overrightarrow{O'A'}\right|\left|\overrightarrow{O'B'}\right|\right)$.
          - texto: >-
              Con las componentes de las aristas, el numerador es
              $\left[(1+u_{,x})u_{,y} + v_{,x}(1+v_{,y}) + w_{,x}w_{,y}\right]dx\,dy$,
              y cada módulo es su $dx$ o su $dy$ por uno más términos pequeños.
          - texto: >-
              Despreciando los términos de orden 2 y con
              $\operatorname{sen}\gamma_{xy} \approx \gamma_{xy}$, queda
              $\gamma_{xy} = u_{,y} + v_{,x}$.
          - texto: >-
              Como las derivadas son pequeñas, las aristas siguen siendo
              perpendiculares y $\gamma_{xy}$ es nula a primer orden.
            trampa: true
            mensaje: |
              Lo que se desprecia son los **productos** de derivadas, de
              orden 2. Las derivadas solas se quedan, y $u_{,y} + v_{,x}$ es
              de primer orden: el ángulo se cierra poco, pero se cierra, y eso
              es la deformación tangencial.
    resolucion: |
      **La definición.** La deformación tangencial (o cortante) unitaria es
      la disminución del ángulo recto entre dos direcciones inicialmente
      perpendiculares (apuntes del tema 3, apartado 3.3.2, p. 8). Para las
      direcciones x e y, con $\varphi_{xy}$ el ángulo que forman las aristas
      después de deformarse:

      $$
      \gamma_{xy} = \tfrac{1}{2}\pi - \varphi_{xy}
      $$

      Es positiva cuando el ángulo se cierra.

      **El ángulo, desde las aristas.** El ángulo entre dos vectores sale de
      su producto escalar (ec. 3.16), y como $\cos\varphi_{xy} =
      \operatorname{sen}\gamma_{xy}$ (ec. 3.17):

      $$
      \operatorname{sen}\gamma_{xy} = \frac{\overrightarrow{O'A'}\cdot\overrightarrow{O'B'}}{\left|\overrightarrow{O'A'}\right|\left|\overrightarrow{O'B'}\right|}
      $$

      Con las dos aristas del enunciado, el numerador es
      $\left[(1+u_{,x})\,u_{,y} + v_{,x}\,(1+v_{,y}) + w_{,x}\,w_{,y}\right]dx\,dy$,
      y en cada módulo se usa $\sqrt{1+\alpha} \approx 1 + \tfrac{1}{2}\alpha$
      (ec. 3.18, p. 9):

      $$
      \operatorname{sen}\gamma_{xy} = \frac{(1+u_{,x})\,u_{,y} + v_{,x}\,(1+v_{,y}) + w_{,x}\,w_{,y}}
      {\left[1 + u_{,x} + \tfrac{1}{2}\left(u_{,x}^{2}+v_{,x}^{2}+w_{,x}^{2}\right)\right]
      \left[1 + v_{,y} + \tfrac{1}{2}\left(u_{,y}^{2}+v_{,y}^{2}+w_{,y}^{2}\right)\right]}
      $$

      **En pequeños desplazamientos.** Las derivadas son pequeñas y se
      desprecian los términos de orden 2 y superiores (ec. 3.19):

      $$
      \operatorname{sen}\gamma_{xy} = \frac{u_{,y} + v_{,x}}{1 + u_{,x} + v_{,y}}
      $$

      El denominador es uno más algo pequeño, $1/(1+\alpha) \approx 1 - \alpha$,
      y volviendo a despreciar el orden 2 queda
      $\operatorname{sen}\gamma_{xy} = u_{,y} + v_{,x}$ (ec. 3.20). Como el
      ángulo es pequeño, $\operatorname{sen}\gamma_{xy} = \gamma_{xy}$ (ec. 3.21):

      $$
      \gamma_{xy} = u_{,y} + v_{,x}
      $$

      **Qué dice.** $v_{,x}$ es lo que la arista x se inclina hacia y, y
      $u_{,y}$ lo que la arista y se inclina hacia x: el ángulo recto se
      cierra por los dos lados y los dos giros se suman. Si $v_{,x} = -u_{,y}$,
      las dos aristas giran lo mismo y en el mismo sentido: es un giro de
      sólido rígido, y $\gamma_{xy} = 0$. De la misma forma salen
      $\gamma_{yz} = v_{,z} + w_{,y}$ y $\gamma_{zx} = w_{,x} + u_{,z}$.

      **Un ejemplo con números.** Con $u_{,x} = 0{,}002$, $v_{,x} = 0{,}003$,
      $w_{,x} = -0{,}001$, $u_{,y} = 0{,}0005$, $v_{,y} = -0{,}001$ y
      $w_{,y} = 0{,}002$, la fórmula lineal da $35\cdot10^{-4}$ y la exacta
      (ec. 3.17 con las aristas tal cual) $34{,}925\cdot10^{-4}$: un 0,2 %
      de diferencia, que es el tamaño de lo que se ha despreciado.

  # ── Teoría · cuestión 3 · el tanque de placas soldadas en anillos o en
  #    hélice a 45°. Impreso «3.(1p)»; la errata «se un tanque» se conserva.
  - id: exerm2223-ord-3-el-tanque-soldado
    titulo: Las placas de un tanque, soldadas en anillos o a 45°, y la presión que aguanta cada forma
    fuente: >-
      Cuestión 3 de teoría · Examen final del 13 de enero de 2023 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 8, apartado 8.5.1
      (págs. 8 a 11).
    nivel: examen
    enunciado: |
      (1p) Varias placas cuadradas, cada una de 16mm de espesor, pueden
      soldarse de las dos formas para construir la parte cilíndrica se un
      tanque de aire comprimido. Si se sabe que la tensión normal máxima
      admisible perpendicular a soldadura es 65 MPa, determinar la máxima
      presión permitida en cada caso.

