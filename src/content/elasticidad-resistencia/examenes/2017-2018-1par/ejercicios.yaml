      <g transform="translate(174 176) rotate(0)"><rect x="-22" y="-7" width="44" height="14" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/><path d="M-20 0 H-15 V-4.2 H15 V-1.4 H-13 V1.4 H15 V4.2 H-15" fill="none" stroke="var(--ink)" stroke-width=".8"/></g>
      <text x="174" y="163" text-anchor="middle" font-size="15" font-style="italic" fill="var(--ink)">a</text>
      <g transform="translate(77.3 104.6) rotate(-60)"><rect x="-22" y="-7" width="44" height="14" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/><path d="M-20 0 H-15 V-4.2 H15 V-1.4 H-13 V1.4 H15 V4.2 H-15" fill="none" stroke="var(--ink)" stroke-width=".8"/></g>
      <text x="93.3" y="114.6" text-anchor="middle" font-size="15" font-style="italic" fill="var(--ink)">b</text>
