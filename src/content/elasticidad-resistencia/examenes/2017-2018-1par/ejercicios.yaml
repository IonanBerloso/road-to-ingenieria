      </svg>
      <figcaption>

      Nuestra, a escala. La recta intrínseca sale del punto del estado
      hidrostático y toca los círculos de cortadura, de tracción y de
      compresión puras.

      </figcaption>
      </figure>

      El material falla a tracción a $1{,}8\,\sigma_0$, menos que los
      $2\sigma_0$ que daría Tresca con la misma cortadura: la recta inclinada
      hace que la tracción pese más que la compresión.

  # ── Teoría · cuestión 4 · el depósito de revolución: p/t = σ1/r1 + σ2/r2.
  - id: exerm1718-1par-4-el-deposito-de-revolucion
    titulo: La ecuación de un depósito de revolución de pared delgada
    fuente: >-
      Cuestión 4 de teoría · Primer parcial del 3 de noviembre de 2017 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 8, apartado 8.5.1.
      La misma pregunta, con otras palabras, es la 4 de teoría del primer
      parcial de 2013-2014.
    nivel: examen
    enunciado: |
      (1p) Deducir la relación entre la presión interna $p$ y las tensiones
      normales en las paredes de un depósito de revolución de espesor $t$.
    pide: >-
      La deducción de p/t = σ1/r1 + σ2/r2 con el equilibrio de un elemento
      de pared, y lo que da en la esfera y en el cilindro.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué en la pared del depósito solo hay tensiones normales según
          el meridiano y según el paralelo?
        opciones:
          - texto: >-
              Por la simetría de revolución y porque la pared es delgada:
              meridiano y paralelo son direcciones principales, y la tensión
              según el espesor es despreciable
            correcta: true
            mensaje: |
              Eso es. La simetría impide que haya tangenciales entre las caras
              del elemento, así que esas dos direcciones son principales. La
              tercera, según el espesor, va de $-p$ dentro a 0 fuera y es mucho
              menor que las otras: se toma nula.
          - texto: Porque la presión es perpendicular a la pared
            mensaje: |
              La presión es normal a la pared, pero eso no basta para que no
              haya tangenciales dentro de ella. Lo que las anula es la
              simetría de revolución del depósito y de la carga.
          - texto: >-
              Porque el material es dúctil y no resiste tangenciales
            mensaje: |
              El material no tiene nada que ver: es un argumento de equilibrio
              y simetría. Un material dúctil resiste tangenciales sin
              problema.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción completa, como en el examen: el elemento de
          pared, las fuerzas sobre él, el equilibrio y el resultado.
        rubrica:
          - punto: >-
              Se aísla un elemento de pared de lados ds1 y ds2 (según el
              paralelo y el meridiano, como en la figura 8.4 de los apuntes) y
              espesor t, con un dibujo, y se dice
              que esas direcciones son principales por la simetría.
            porque: >-
              Es el punto de partida: sin tangenciales en las caras, solo hay
              que equilibrar normales.
            minimo: true
          - punto: >-
              Se ponen las fuerzas: la presión p·ds1·ds2 hacia fuera, σ1 sobre
              las caras de lado ds2 (fuerza σ1·t·ds2) y σ2 sobre las de lado
              ds1 (fuerza σ2·t·ds1).
            porque: >-
              El cruce es lo que se suele confundir: σ1 actúa sobre la cara
              cuyo lado es ds2, y al revés.
            minimo: true
          - punto: >-
              Se proyecta en la normal: por la curvatura, cada par de fuerzas
              de las caras opuestas da una resultante hacia dentro
              2σ1·t·ds2·sen(dθ1/2) y 2σ2·t·ds1·sen(dθ2/2) (ec. 8.13).
            porque: >-
              La curvatura es lo que hace que las tensiones de membrana
              equilibren la presión: en una placa plana no habría componente
              normal.
            minimo: true
          - punto: >-
              Con ángulos pequeños, sen(dθi/2) ≈ dθi/2 y dsi = ri·dθi; se
              divide por ds1·ds2·t y queda p/t = σ1/r1 + σ2/r2 (ec. 8.14).
            porque: >-
              Es la respuesta que pide la cuestión: una sola ecuación con las
              dos tensiones y los dos radios de curvatura.
            minimo: true
          - punto: >-
              Se aplica: esfera, r1 = r2 = r, σ = pr/2t (ec. 8.15); cilindro,
              r2 = ∞, σ1 = pr/t (ec. 8.16), y σ2 = pr/2t sale de cortar por
              un plano perpendicular al eje (ec. 8.17).
            porque: >-
              Muestra que se entiende lo que da la ecuación y lo que no: en el
              cilindro solo da una de las dos tensiones.
      - tipo: calcular
        titulo: La tensión circunferencial de un cilindro
        pregunta: |
          Un ejemplo nuestro: un depósito cilíndrico de radio medio 500 mm y
          pared de 10 mm, a $p = 2$ MPa. ¿Cuánto vale la tensión según el
          paralelo (la circunferencial), en MPa?
        respuesta:
          tipo: numero
          valor: '100'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '50'
            mensaje: |
              Es la longitudinal, $pr/2t$. La circunferencial es la que va
              con la curvatura del paralelo, $r_1 = r$; la generatriz es recta,
              $r_2 = \infty$, y la ec. 8.14 queda $p/t = \sigma_1/r$:
              $\sigma_1 = pr/t$.
          - valor: '200'
            mensaje: |
              Has usado el diámetro, 1000 mm. La ec. 8.14 va con los radios de
              curvatura: aquí $r = 500$ mm.
        pista: |
          En el cilindro $r_1 = r$ y $r_2 = \infty$: $\sigma_1 = pr/t$.
        desarrollo: |
          $$
          \sigma_1 = \frac{pr}{t} = \frac{2\cdot500}{10} = 100\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La tensión longitudinal del mismo cilindro
        pregunta: |
          ¿Y la tensión según el eje del cilindro (la longitudinal), en MPa?
        respuesta:
          tipo: numero
          valor: '50'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '100'
            mensaje: |
              Es la circunferencial. La longitudinal sale de cortar por un
              plano perpendicular al eje: $p\pi r^{2} = 2\pi rt\,\sigma_2$
              (ec. 8.17), la mitad.
          - valor: '0'
            mensaje: |
              Has leído en la ec. 8.14 que, con $r_2 = \infty$, $\sigma_2$ no
              cuenta y vale cero. Lo que pasa es que la ecuación no la
              determina: $\sigma_2/\infty = 0$ para cualquier $\sigma_2$. Hay que
              sacarla del equilibrio de las tapas.
        pista: |
          Corta el depósito por una sección recta: la presión sobre el círculo
          la equilibra la pared.
        desarrollo: |
          $$
          p\,\pi r^{2} = 2\pi r\,t\,\sigma_2 \;\Longrightarrow\; \sigma_2 = \frac{pr}{2t} = 50\ \text{MPa}
          $$
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Meridiano y paralelo son principales por la simetría; la tensión
              según el espesor se desprecia.
          - texto: >-
              Equilibrio en la normal del elemento:
              $p\,ds_1ds_2 = 2\sigma_1\,ds_2\,t\operatorname{sen}\tfrac{d\theta_1}{2} + 2\sigma_2\,ds_1\,t\operatorname{sen}\tfrac{d\theta_2}{2}$.
          - texto: >-
              Con $\operatorname{sen}\tfrac{d\theta_i}{2} \approx \tfrac{d\theta_i}{2}$ y
              $ds_i = r_i\,d\theta_i$: $\dfrac{p}{t} = \dfrac{\sigma_1}{r_1} + \dfrac{\sigma_2}{r_2}$.
          - texto: >-
              Esfera: $\sigma = pr/2t$. Cilindro: $\sigma_1 = pr/t$, y
              $\sigma_2 = pr/2t$ del equilibrio de una sección recta.
          - texto: >-
              En el cilindro, con $r_2 = \infty$, la ecuación da $\sigma_2 = 0$:
              no hay tensión longitudinal.
            trampa: true
            mensaje: |
              Con $r_2 = \infty$ el término $\sigma_2/r_2$ se anula **para
              cualquier** $\sigma_2$: la ecuación no la determina, no dice que
              sea cero. Sale de cortar por una sección recta, y vale $pr/2t$.
    resolucion: |
      **La idea.** La pared es delgada y el depósito es de revolución: en un
      elemento de pared solo hay tensiones normales según el meridiano y el
      paralelo, que son principales. La curvatura hace que esas tensiones
      tengan componente normal a la pared, y eso equilibra la presión
      (apuntes del tema 8, apartado 8.5.1, figuras 8.4 y 8.5).

      **El elemento.** Lados $ds_1$ y $ds_2$, espesor $t$, radios de
      curvatura $r_1$ y $r_2$, ángulos $d\theta_1$ y $d\theta_2$. La tensión
      $\sigma_1$ actúa en las caras de lado $ds_2$, con fuerza
      $\sigma_1\,t\,ds_2$; la $\sigma_2$, en las de lado $ds_1$. La tercera
      principal va de $-p$ a 0 a través del espesor y se desprecia.

      **El equilibrio** según la normal (ec. 8.13). Cada par de caras
      opuestas forma un ángulo $d\theta_i$, y sus dos fuerzas dan una
      resultante hacia dentro:

      $$
      p\,ds_1\,ds_2 = 2\sigma_1\,ds_2\,t\,\operatorname{sen}\frac{d\theta_1}{2} + 2\sigma_2\,ds_1\,t\,\operatorname{sen}\frac{d\theta_2}{2}
      $$

      **El resultado** (ec. 8.14). Con ángulos pequeños,
      $\operatorname{sen}(d\theta_i/2) \approx d\theta_i/2$, y con
      $ds_i = r_i\,d\theta_i$, se divide por $ds_1\,ds_2\,t$:

      $$
      \frac{p}{t} = \frac{\sigma_1}{r_1} + \frac{\sigma_2}{r_2}
      $$

      **Dos casos.**

      - Esfera, $r_1 = r_2 = r$ y, por simetría, $\sigma_1 = \sigma_2$:
        $\sigma = pr/2t$ (ec. 8.15).
      - Cilindro, $r_1 = r$ y $r_2 = \infty$: $\sigma_1 = pr/t$ (ec. 8.16).
        La ecuación no da $\sigma_2$, porque se multiplica por $1/\infty$; se
        corta por una sección recta y $p\pi r^{2} = 2\pi rt\,\sigma_2$ da
        $\sigma_2 = pr/2t$ (ec. 8.17).

      **Un ejemplo con números** (nuestro): un cilindro de radio medio 500 mm
      y pared de 10 mm a 2 MPa tiene 100 MPa según el paralelo y 50 MPa según
      el eje. Una esfera igual, 50 MPa en todas las direcciones.
  # ── Problema 1 · el tensor con y principal y el plano a 45° de 1 y 60° de 3.
  - id: exerm1718-1par-5-el-tensor-y-el-plano-a-45-y-60
    titulo: Un tensor con una dirección principal a la vista, y un plano dado en ejes principales
    fuente: >-
      Problema 1 · Primer parcial del 3 de noviembre de 2017 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 2 puntos. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 2 (ecs. 2.14-2.16 y
      apartado 2.4.3).
    nivel: examen
    enunciado: |
      (2p) La matriz de tensiones en un punto O interior de un sólido
      elástico, referida a un sistema cartesiano ortogonal O*xyz*, es

      $$
      [\sigma] = \begin{bmatrix} 5 & 0 & -12\\ 0 & -6 & 0\\ -12 & 0 & 1 \end{bmatrix}\ \text{MPa}
      $$

      a/ Determinar las tensiones y direcciones principales.

      b/ Calcular las componentes intrínsecas del vector tensión
      correspondiente al plano cuyo vector unitario normal forma 45º con el
      eje principal 1 y 60º con el eje principal 3. ($\sigma_1>\sigma_2>\sigma_3$)

      **Notas nuestras.** El enunciado da dos ángulos y no el tercero: el
      coseno con el eje principal 2 sale de que la normal sea unitaria, y
      puede ser $+\tfrac12$ o $-\tfrac12$. Son dos planos, pero en ejes
      principales las componentes intrínsecas solo dependen de los cuadrados
      de los cosenos, así que los dos dan lo mismo.
    pide: >-
      Las tres tensiones principales y sus direcciones; en el plano que forma
      45° con el eje 1 y 60° con el 3, la tensión normal y la tangencial.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de plantear el determinante de $[\sigma] - \sigma[I]$, ¿hay
          alguna dirección principal que se vea sin calcular?
        opciones:
          - texto: >-
              Sí, el eje $y$: su fila y su columna no tienen tangenciales, así
              que $-6$ MPa es principal con $\hat{n} = \hat{\jmath}$
            correcta: true
            mensaje: |
              Eso es (ecs. 2.38-2.41). $[\sigma]\hat{\jmath} = (0, -6, 0) =
              -6\,\hat{\jmath}$: el vector tensión es paralelo a la normal. Las
              otras dos salen del bloque $xz$, un problema de $2\times2$.
          - texto: >-
              Sí, el eje $x$, porque $\sigma_x = 5$ es la mayor de la diagonal
            mensaje: |
              Ser la mayor de la diagonal no hace principal a nadie. El eje $x$
              tiene $\tau_{xz} = -12$: el vector tensión de la cara $x$ es
              $(5, 0, -12)$, que no es paralelo a $\hat{\imath}$.
          - texto: >-
              No: con tangenciales fuera de la diagonal hay que resolver
              siempre la cúbica completa
            mensaje: |
              Se puede, pero no hace falta. La fila $y$ es $(0, -6, 0)$ y la
              cúbica se factoriza: $(-6-\sigma)\,[(5-\sigma)(1-\sigma) - 144] = 0$.
              Reconocerlo ahorra la mitad del problema.
      - tipo: calcular
        titulo: La mayor tensión principal
        pregunta: |
          ¿Cuánto vale $\sigma_1$, en MPa?
        respuesta:
          tipo: numero
          valor: '15.1655'
          tolerancia: 0.01
          formato: un número, en MPa (vale 3 + √148)
        distractores:
          - valor: '15.6491'
            mensaje: |
              Has puesto de radio $\sqrt{(\sigma_x-\sigma_z)^{2} + \tau_{xz}^{2}} =
              \sqrt{160}$. La diferencia va **a la mitad**:
              $\sqrt{((5-1)/2)^{2} + 12^{2}} = \sqrt{148}$.
          - valor: '5'
            mensaje: |
              Es $\sigma_x$, el mayor número de la diagonal. Con
              $\tau_{xz} = -12$ el eje $x$ no es principal, y la mayor tensión
              normal del punto es mayor que cualquiera de la diagonal.
        pista: |
          El bloque $xz$, $\begin{bmatrix} 5 & -12\\ -12 & 1\end{bmatrix}$, tiene
          centro $(5+1)/2 = 3$ y radio $\sqrt{2^{2} + 12^{2}}$.
        desarrollo: |
          $$
          \sigma = 3 \pm \sqrt{\left(\tfrac{5-1}{2}\right)^{2} + 12^{2}} = 3 \pm \sqrt{148} = 3 \pm 12{,}166
          $$

          Con la de $y$, las tres son $15{,}166$, $-6$ y $-9{,}166$ MPa.
          Comprobación con los invariantes: $I_1 = 0$, $I_2 = -175$ e
          $I_3 = 834$, iguales en Oxyz y en ejes principales.
      - tipo: calcular
        titulo: La menor tensión principal
        pregunta: |
          Con el orden del enunciado, $\sigma_1>\sigma_2>\sigma_3$, ¿cuánto
          vale $\sigma_3$, en MPa?
        respuesta:
          tipo: numero
          valor: '-9.1655'
          tolerancia: 0.01
          formato: un número, en MPa (vale 3 − √148)
        distractores:
          - valor: '-6'
            mensaje: |
              $-6$ es la de $y$, y es principal, pero no es la menor:
              $3 - \sqrt{148} = -9{,}166 < -6$. Con el orden del enunciado, la
              de $y$ es $\sigma_2$.
          - valor: '-9.6491'
            mensaje: |
              Es $3 - \sqrt{160}$: la diferencia $\sigma_x - \sigma_z$ sin
              dividir por 2 dentro de la raíz. El radio es $\sqrt{2^{2} + 12^{2}}$.
        pista: |
          La otra raíz del bloque $xz$, y compárala con $-6$.
        desarrollo: |
          $$
          \sigma_1 = 15{,}166,\qquad \sigma_2 = -6,\qquad \sigma_3 = -9{,}166\ \text{MPa}
          $$

          La traza se conserva: $15{,}166 - 6 - 9{,}166 = 0 = 5 - 6 + 1$.
      - tipo: calcular
        titulo: La dirección principal 1
        pregunta: |
          La dirección 1 está en el plano $xz$. Tomándola con $n_x > 0$,
          ¿cuánto vale su componente $n_z$?
        respuesta:
          tipo: numero
          valor: '-0.6464'
          tolerancia: 0.002
          formato: un número, la componente z del vector unitario
        distractores:
          - valor: '0.6464'
            mensaje: |
              El signo. De la primera ecuación, $(5 - 15{,}166)\,n_x - 12\,n_z = 0$:
              $n_z = -0{,}847\,n_x$. Con $\tau_{xz}$ negativa, la dirección de la
              mayor tracción baja hacia $-z$ cuando $x$ crece.
          - valor: '-0.7630'
            mensaje: |
              Has cambiado las componentes al normalizar. Como
              $|n_z/n_x| = 0{,}847 < 1$, la mayor es $n_x = 0{,}763$ y
              $n_z = -0{,}646$. La $(0{,}646;\ 0;\ 0{,}763)$ es la dirección 3.
        pista: |
          $(\sigma_x - \sigma_1)\,n_x + \tau_{xz}\,n_z = 0$ y $n_x^{2} + n_z^{2} = 1$.
        desarrollo: |
          $$
          \frac{n_z}{n_x} = \frac{5 - 15{,}166}{12} = -0{,}847
          \;\Longrightarrow\;
          \{n_1\} = (0{,}763;\ 0;\ -0{,}646)
          $$

          a $40{,}27°$ de $x$, hacia $-z$. Las otras dos:
          $\{n_2\} = (0;\ 1;\ 0)$ y $\{n_3\} = (0{,}646;\ 0;\ 0{,}763)$, que es
          $\{n_1\}\times\{n_2\}$.
      - tipo: calcular
        titulo: La tensión normal en el plano del apartado b
        pregunta: |
          La normal del plano forma 45° con el eje 1 y 60° con el 3. ¿Cuánto
          vale $\sigma_n$, en MPa?
        respuesta:
          tipo: numero
          valor: '3.7914'
          tolerancia: 0.005
          formato: un número, en MPa
        distractores:
          - valor: '3.1409'
            mensaje: |
              Has sumado $\sigma_i n_i$, sin elevar los cosenos al cuadrado. En
              ejes principales $\sigma_n = \{n\}^{t}[\sigma]\{n\} =
              \sigma_1n_1^{2} + \sigma_2n_2^{2} + \sigma_3n_3^{2}$: cada coseno
              aparece dos veces, una al calcular $\vec{S}$ y otra al proyectarlo.
          - valor: '-7.2353'
            mensaje: |
              Has tomado los ángulos con $x$, $y$ y $z$: $\hat{n} =
              (\tfrac{\sqrt2}{2}, \tfrac12, \tfrac12)$ en Oxyz. Los ángulos son con
              los **ejes principales** 1 y 3, y en esa base $[\sigma]$ es
              diagonal.
        pista: |
          En ejes principales, $\hat{n} = (\cos45°,\ \pm\tfrac12,\ \cos60°)$
          y $\sigma_n = \sum \sigma_i n_i^{2}$.
        desarrollo: |
          $n_2^{2} = 1 - \tfrac12 - \tfrac14 = \tfrac14$, y

          $$
          \sigma_n = 15{,}166\cdot\tfrac12 - 6\cdot\tfrac14 - 9{,}166\cdot\tfrac14 = 3{,}791\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La tensión tangencial en ese plano
        pregunta: |
          ¿Cuánto vale $\tau_n$ en el mismo plano, en MPa?
        respuesta:
          tipo: numero
          valor: '11.4291'
          tolerancia: 0.005
          formato: un número, en MPa (el módulo)
        distractores:
          - valor: '12.0415'
            mensaje: |
              Es el módulo del vector tensión, $|\vec{S}| = \sqrt{145{,}0}$. La
              tangencial es lo que queda al quitarle la normal:
              $\tau_n = \sqrt{|\vec{S}|^{2} - \sigma_n^{2}}$ (ec. 2.16).
          - valor: '5.1467'
            mensaje: |
              Es la tangencial del plano cuya normal forma 45° con $x$ y 60°
              con $z$. Los ángulos del enunciado son con los **ejes
              principales**: en Oxyz la normal es otra y el plano también.
        pista: |
          $\vec{S} = (\sigma_1n_1,\ \sigma_2n_2,\ \sigma_3n_3)$ en ejes
          principales, $|\vec{S}|^{2} = \sum \sigma_i^{2} n_i^{2}$.
        desarrollo: |
          $$
          \vec{S} = (10{,}724;\ \mp3;\ -4{,}583)\ \text{MPa},\qquad
          |\vec{S}|^{2} = 115{,}00 + 9 + 21{,}00 = 145{,}00
          $$

          $$
          \tau_n = \sqrt{145{,}00 - 3{,}791^{2}} = 11{,}429\ \text{MPa}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La fila y la columna de $y$ no tienen tangenciales: $-6$ MPa es
              principal, con $\hat{n} = \hat{\jmath}$.
          - texto: >-
              El bloque $xz$ tiene centro 3 y radio $\sqrt{148}$: $\sigma_1 =
              15{,}166$, $\sigma_2 = -6$ y $\sigma_3 = -9{,}166$ MPa, con
              $\{n_1\} = (0{,}763;\ 0;\ -0{,}646)$ y $\{n_3\} = (0{,}646;\ 0;\ 0{,}763)$.
          - texto: >-
              En ejes principales la normal es $(\cos45°,\ \pm\tfrac12,\ \cos60°)$,
              con el $\pm\tfrac12$ sacado de que sea unitaria.
          - texto: >-
              $\sigma_n = \sum\sigma_in_i^{2} = 3{,}791$ MPa, $|\vec{S}|^{2} =
              \sum\sigma_i^{2}n_i^{2} = 145{,}0$ y $\tau_n = 11{,}429$ MPa.
          - texto: >-
              Como el enunciado solo da los ángulos con 1 y con 3, la normal no
              tiene componente según el eje 2.
            trampa: true
            mensaje: |
              La normal es unitaria: $n_1^{2} + n_2^{2} + n_3^{2} = 1$. Con
              $\tfrac12 + \tfrac14$ falta $\tfrac14$, y $n_2 = \pm\tfrac12$. Sin
              ella el vector no tendría módulo 1 y las fórmulas de $\sigma_n$ no
              valdrían.
    resolucion: |
      **La idea.** El eje $y$ ya es principal, porque su fila no tiene
      tangenciales; las otras dos direcciones están en el plano $xz$. El
      apartado b da la normal en ejes principales, donde el tensor es
      diagonal y todo se hace con los cuadrados de los cosenos.

      **a) Tensiones principales** (apuntes del tema 2, ecs. 2.38-2.41). Para
      $y$, $\sigma = -6$ MPa. Para el bloque $xz$:

      $$
      \sigma = \frac{5+1}{2} \pm \sqrt{\left(\frac{5-1}{2}\right)^{2} + 12^{2}} = 3 \pm \sqrt{148}
      $$

      $$
      \sigma_1 = 15{,}166,\qquad \sigma_2 = -6,\qquad \sigma_3 = -9{,}166\ \text{MPa}
      $$

      Los invariantes lo confirman: $I_1 = 0$, $I_2 = -175$ e $I_3 = 834$ en
      los dos sistemas.

      **Direcciones principales** (ec. 2.34). Para $\sigma_1$, la primera
      ecuación da $(5 - 15{,}166)\,n_x - 12\,n_z = 0$, $n_z = -0{,}847\,n_x$:

      $$
      \{n_1\} = (0{,}763;\ 0;\ -0{,}646),\qquad \{n_2\} = (0;\ 1;\ 0),\qquad \{n_3\} = (0{,}646;\ 0;\ 0{,}763)
      $$

      La dirección 1 forma $40{,}27°$ con $x$, hacia $-z$; la 3 es
      perpendicular a ella en el mismo plano, y $\{n_3\} = \{n_1\}\times\{n_2\}$.
      Cada una puede ir con el signo cambiado.

      **b) El plano.** En ejes principales, los cosenos con 1 y 3 son
      $\cos45° = \tfrac{\sqrt2}{2}$ y $\cos60° = \tfrac12$, y el de 2 sale de la
      unidad: $n_2^{2} = 1 - \tfrac12 - \tfrac14 = \tfrac14$, $n_2 = \pm\tfrac12$.
      El vector tensión es $\vec{S} = (\sigma_1n_1, \sigma_2n_2, \sigma_3n_3)$
      (ec. 2.14 con $[\sigma]$ diagonal):

      $$
      \vec{S} = (10{,}724;\ \mp3;\ -4{,}583)\ \text{MPa},\qquad |\vec{S}| = \sqrt{145{,}0} = 12{,}042\ \text{MPa}
      $$

      $$
      \sigma_n = \sum\sigma_in_i^{2} = 15{,}166\cdot\tfrac12 - 6\cdot\tfrac14 - 9{,}166\cdot\tfrac14 = 3{,}791\ \text{MPa}
      $$

      $$
      \tau_n = \sqrt{|\vec{S}|^{2} - \sigma_n^{2}} = \sqrt{145{,}0 - 14{,}37} = 11{,}429\ \text{MPa}
      $$

      (ec. 2.16). Con $n_2 = +\tfrac12$ o $-\tfrac12$ sale lo mismo: son dos
      planos simétricos respecto del plano 1-3, con las mismas componentes
      intrínsecas.

  # ── Problema 2 · la roseta a 0°, 60° y 150°, en tensión plana.
  - id: exerm1718-1par-6-la-roseta-a-0-60-y-150
    titulo: Tres galgas sobre un triángulo de 60° y 30°, y dos criterios de fallo
    fuente: >-
      Problema 2 · Primer parcial del 3 de noviembre de 2017 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 2 puntos. El examen no publica resolución; el
      desarrollo es nuestro, con los convenios de los temas 3, 4 y 6.
    nivel: examen
    enunciado: |
      (2p) En un estado de tensión plana, las galgas extensiométricas de la
      figura proporcionan las siguientes medidas:

      $\varepsilon_a$= $1200\cdot10^{-6}$;  $\varepsilon_b$ = $1200\cdot10^{-6}$;
      $\varepsilon_c$ = $400\cdot10^{-6}$

      Determinar:

      a/ Deformaciones $\varepsilon_x$, $\varepsilon_y$ y $\gamma_{xy}$ en
      función de $\varepsilon_a$, $\varepsilon_b$ y $\varepsilon_c$.

      b/ Deformaciones principales y tensiones principales.

      c/ Factores de seguridad según los criterios de Tresca y de Von Mises.

      Datos: $E$ = 210 GPa ; $\nu$ = 0,3, $\sigma_e$ = 800 MPa

