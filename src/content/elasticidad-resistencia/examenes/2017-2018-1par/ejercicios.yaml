      <line x1="372" y1="120" x2="372" y2="77" stroke="var(--ink)" stroke-width="1.4"/><polygon points="372,70 375.5,78 368.5,78" fill="var(--ink)"/>
      <text x="422" y="136" text-anchor="middle" font-size="14" font-style="italic" fill="var(--ink)">x</text>
      <text x="360" y="76" text-anchor="middle" font-size="14" font-style="italic" fill="var(--ink)">y</text>
      </svg>
      <figcaption>

      Redibujada del enunciado: el triángulo a trazos con sus ángulos de 60°
      y 30°, las tres galgas sobre sus lados y los ejes del original. El
      original dibuja los lados a unos 57° y 34°; aquí van a los 60° y 30°
      rotulados.

      </figcaption>
      </figure>

      **Notas nuestras.** La figura no da el ángulo de cada galga con $x$: se
      lee del triángulo.
    pide: >-
      εx, εy y γxy en función de las tres lecturas; ε1, ε2, σ1 y σ2; los
      factores de seguridad de Tresca y de von Mises con σe = 800 MPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿A qué ángulos de $x$, medidos en sentido antihorario, están las
          tres galgas?
        opciones:
          - texto: a a 0°, b a 60° y c a 150°
            correcta: true
            mensaje: |
              Eso es. La c está sobre el lado que baja hacia la derecha: su
              recta forma 30° con la base, pero medida desde $+x$ en sentido
              antihorario es $180° - 30° = 150°$. Las tres no forman una
              roseta de 120°.
          - texto: a a 0°, b a 60° y c a 30°
            mensaje: |
              El 30° es el ángulo de la figura en el vértice de la derecha,
              entre la base y el lado. Ese lado sube hacia la **izquierda**: con
              $x$ forma 150°. A 30° saldría $\varepsilon_y = 2800\cdot10^{-6}$ y
              $\gamma_{xy}$ negativa.
          - texto: a a 0°, b a 120° y c a 240°, la roseta de 120° de los apuntes
            mensaje: |
              Las fórmulas de la roseta de 120° (ecs. 3.65-3.66) valen para un
              triángulo equilátero. Este tiene ángulos de 60°, 30° y 90°: b
              está a 60° y c a 150°.
      - tipo: calcular
        titulo: La deformación εy
        pregunta: |
          ¿Cuánto vale $\varepsilon_y$, en unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '400'
          tolerancia: 0.5
          formato: un número, en 10⁻⁶
        distractores:
          - valor: '2800'
            mensaje: |
              Es lo que sale con la galga c a 30°. Su lado sube hacia la
              izquierda: está a 150°, y con $\cos^{2}150° = \tfrac34$ y
              $\operatorname{sen}150°\cos150° = -\tfrac{\sqrt3}{4}$ la
              $\gamma_{xy}$ entra restando.
          - valor: '666.67'
            mensaje: |
              Es $\varepsilon_y$ con las fórmulas de la roseta de 120°
              (ec. 3.66), que suponen b y c a 120° y 240°. Aquí están a 60° y
              150°: hay que escribir la ec. 3.55 para cada una.
        pista: |
          Escribe $\varepsilon_b$ (60°) y $\varepsilon_c$ (150°) con la
          ec. 3.55 y súmalas: los términos en $\gamma_{xy}$ se van.
        desarrollo: |
          $$
          \varepsilon_b = \tfrac14\varepsilon_x + \tfrac34\varepsilon_y + \tfrac{\sqrt3}{4}\gamma_{xy},\qquad
          \varepsilon_c = \tfrac34\varepsilon_x + \tfrac14\varepsilon_y - \tfrac{\sqrt3}{4}\gamma_{xy}
          $$

          Sumando, $\varepsilon_b + \varepsilon_c = \varepsilon_x + \varepsilon_y$, y con
          $\varepsilon_x = \varepsilon_a$:

          $$
          \varepsilon_y = \varepsilon_b + \varepsilon_c - \varepsilon_a = (1200 + 400 - 1200)\cdot10^{-6} = 400\cdot10^{-6}
          $$
      - tipo: calcular
        titulo: La distorsión γxy
        pregunta: |
          ¿Cuánto vale $\gamma_{xy}$, en unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '1385.64'
          tolerancia: 0.5
          formato: un número, en 10⁻⁶ (vale 800√3)
        distractores:
          - valor: '-2771.28'
            mensaje: |
              Sale con la galga c a 30°. A 150°,
              $\operatorname{sen}\theta\cos\theta = -\tfrac{\sqrt3}{4}$ y el término de $\gamma_{xy}$ en
              $\varepsilon_c$ resta; a 30° sumaría, y la distorsión cambia de
              signo y de valor.
          - valor: '692.82'
            mensaje: |
              Es $\tfrac12\gamma_{xy}$, la componente del tensor. La ec. 3.55
              lleva $\gamma_{xy}u_xu_y$ con la $\gamma$ entera, y es la que se
              pide.
        pista: |
          Resta $\varepsilon_b - \varepsilon_c$: queda
          $-\tfrac12\varepsilon_x + \tfrac12\varepsilon_y + \tfrac{\sqrt3}{2}\gamma_{xy}$.
        desarrollo: |
          $$
          \gamma_{xy} = \frac{2\varepsilon_a + \varepsilon_b - 3\varepsilon_c}{\sqrt3}
          = \frac{2400 + 1200 - 1200}{\sqrt3}\cdot10^{-6} = 1385{,}64\cdot10^{-6}
          $$

          Comprobación con la galga b: $\tfrac14\cdot1200 + \tfrac34\cdot400 +
          \tfrac{\sqrt3}{4}\cdot1385{,}64 = 300 + 300 + 600 = 1200$.
      - tipo: calcular
        titulo: La mayor deformación principal
        pregunta: |
          ¿Cuánto vale $\varepsilon_1$, en unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '1600'
          tolerancia: 0.5
          formato: un número, en 10⁻⁶
        distractores:
          - valor: '2242.22'
            mensaje: |
              Has puesto $\gamma_{xy}$ entera en el radio. En el círculo de Mohr
              de deformaciones el eje vertical es $\tfrac12\gamma$: el radio es
              $\sqrt{400^{2} + 692{,}82^{2}} = 800$.
          - valor: '800'
            mensaje: |
              Es el radio del círculo (y también su centro, por casualidad de
              este examen). La principal es centro más radio:
              $800 + 800 = 1600$.
        pista: |
          Centro $(\varepsilon_x+\varepsilon_y)/2$ y radio
          $\sqrt{((\varepsilon_x-\varepsilon_y)/2)^{2} + (\gamma_{xy}/2)^{2}}$.
        desarrollo: |
          $$
          C = 800,\quad R = \sqrt{400^{2} + 692{,}82^{2}} = 800
          \;\Longrightarrow\;
          \varepsilon_1 = 1600\cdot10^{-6},\quad \varepsilon_2 = 0
          $$

          con $\tan2\theta_1 = \gamma_{xy}/(\varepsilon_x-\varepsilon_y) = \sqrt3$:
          la dirección 1 está a 30° de $x$. Y como es tensión plana,
          $\varepsilon_z = -\tfrac{\nu}{1-\nu}(\varepsilon_1+\varepsilon_2) = -685{,}7\cdot10^{-6}$.
      - tipo: calcular
        titulo: La tensión principal σ1
        pregunta: |
          ¿Cuánto vale $\sigma_1$, en MPa?
        respuesta:
          tipo: numero
          valor: '369.23'
          tolerancia: 0.3
          formato: un número, en MPa (vale 4800/13)
        distractores:
          - valor: '336'
            mensaje: |
              Es $E\varepsilon_1$, como en una barra a tracción. Aquí hay dos
              tensiones en el plano y cada una acorta en la otra dirección:
              $\sigma_1 = \tfrac{E}{1-\nu^{2}}(\varepsilon_1 + \nu\varepsilon_2)$.
          - valor: '452.31'
            mensaje: |
              Es $(\lambda+2G)\varepsilon_1 + \lambda\varepsilon_2$, la fórmula
              de deformación plana ($\varepsilon_z = 0$). En tensión plana es
              $\sigma_z = 0$ y $\varepsilon_z \ne 0$: van las ecs. 4.25.
        pista: |
          Tensión plana, en direcciones principales:
          $\sigma_1 = \dfrac{E}{1-\nu^{2}}(\varepsilon_1 + \nu\varepsilon_2)$.
        desarrollo: |
          $$
          \sigma_1 = \frac{210\,000}{0{,}91}\,(1600 + 0{,}3\cdot0)\cdot10^{-6} = 369{,}23\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La tensión principal σ2
        pregunta: |
          ¿Cuánto vale $\sigma_2$, en MPa?
        respuesta:
          tipo: numero
          valor: '110.77'
          tolerancia: 0.3
          formato: un número, en MPa (vale 1440/13)
        distractores:
          - valor: '0'
            mensaje: |
              Es $E\varepsilon_2$. Que $\varepsilon_2$ sea cero no hace cero a
              $\sigma_2$: para que esa dirección no se acorte por Poisson hace
              falta una tensión, $\sigma_2 = \nu\sigma_1$.
          - valor: '193.85'
            mensaje: |
              Es $\lambda\varepsilon_1 + (\lambda+2G)\varepsilon_2$, de
              deformación plana. Aquí es tensión plana.
        pista: |
          $\sigma_2 = \dfrac{E}{1-\nu^{2}}(\nu\varepsilon_1 + \varepsilon_2)$.
        desarrollo: |
          $$
          \sigma_2 = \frac{210\,000}{0{,}91}\,(0{,}3\cdot1600 + 0)\cdot10^{-6} = 110{,}77\ \text{MPa},\qquad \sigma_3 = 0
          $$

          Por las componentes sale lo mismo: $\sigma_x = 304{,}62$,
          $\sigma_y = 175{,}38$ y $\tau_{xy} = 111{,}92$ MPa, con centro 240 y
          radio 129,23.
      - tipo: calcular
        titulo: El factor de seguridad de Tresca
        pregunta: |
          Con $\sigma_e = 800$ MPa, ¿cuánto vale el factor de seguridad según
          Tresca?
        respuesta:
          tipo: numero
          valor: '2.1667'
          tolerancia: 0.005
          formato: un número (vale 13/6)
        distractores:
          - valor: '3.0952'
            mensaje: |
              Has usado $\sigma_1 - \sigma_2$. Tresca va con la mayor menos la
              menor de las **tres**, y en tensión plana la tercera es
              $\sigma_3 = 0$: $\sigma_{eqv} = 369{,}23 - 0$.
          - valor: '4.3333'
            mensaje: |
              Has dividido $\sigma_e$ entre $\tau_{max} = 184{,}6$. Lo que se
              compara con $\sigma_e$ es $\sigma_{eqv} = 2\tau_{max}$
              (ec. 6.19).
        pista: |
          $\sigma_{eqv} = \sigma_1 - \sigma_3$ con las tres principales:
          $369{,}23$, $110{,}77$ y $0$.
        desarrollo: |
          $$
          \sigma_{eqv} = 369{,}23 - 0 = 369{,}23\ \text{MPa},\qquad FS = \frac{800}{369{,}23} = 2{,}167
          $$
      - tipo: calcular
        titulo: El factor de seguridad de von Mises
        pregunta: |
          ¿Y según von Mises?
        respuesta:
          tipo: numero
          valor: '2.4377'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '3.021'
            mensaje: |
              Has usado las componentes sin el término de la tangencial:
              $\sqrt{\sigma_x^{2} - \sigma_x\sigma_y + \sigma_y^{2}}$. Falta
              $+3\tau_{xy}^{2}$ (ec. 6.30), o usa las principales.
          - valor: '1.8377'
            mensaje: |
              El signo del producto: es $\sigma_1^{2} - \sigma_1\sigma_2 +
              \sigma_2^{2}$ (ec. 6.31), con menos. Con más, dos tracciones
              iguales darían más equivalente que una sola.
        pista: |
          $\sigma_{eqv} = \sqrt{\sigma_1^{2} - \sigma_1\sigma_2 + \sigma_2^{2}}$.
        desarrollo: |
          $$
          \sigma_{eqv} = \sqrt{369{,}23^{2} - 369{,}23\cdot110{,}77 + 110{,}77^{2}} = 328{,}18\ \text{MPa},\qquad
          FS = \frac{800}{328{,}18} = 2{,}438
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Las galgas están a 0°, 60° y 150°: $\varepsilon_x = \varepsilon_a$,
              $\varepsilon_y = \varepsilon_b + \varepsilon_c - \varepsilon_a = 400$ y
              $\gamma_{xy} = (2\varepsilon_a + \varepsilon_b - 3\varepsilon_c)/\sqrt3 = 1385{,}6$
              (en $10^{-6}$).
          - texto: >-
              El círculo de deformaciones tiene centro 800 y radio 800:
              $\varepsilon_1 = 1600\cdot10^{-6}$ y $\varepsilon_2 = 0$, con la
              dirección 1 a 30° de $x$.
          - texto: >-
              En tensión plana, $\sigma_1 = 369{,}23$, $\sigma_2 = 110{,}77$ y
              $\sigma_3 = 0$ MPa.
          - texto: >-
              Tresca: $FS = 800/369{,}23 = 2{,}167$. Von Mises:
              $FS = 800/328{,}18 = 2{,}438$.
          - texto: >-
              Como $\varepsilon_2 = 0$, la tensión principal 2 también es nula
              y el estado es uniaxial.
            trampa: true
            mensaje: |
              Deformación nula no es tensión nula. En tensión plana,
              $\sigma_2 = \tfrac{E}{1-\nu^{2}}(\nu\varepsilon_1 + \varepsilon_2) =
              110{,}77$ MPa: hace falta esa tracción para que la dirección 2 no
              se acorte por el efecto Poisson de $\sigma_1$.
    resolucion: |
      **La idea.** Tres galgas en el plano dan $\varepsilon_x$,
      $\varepsilon_y$ y $\gamma_{xy}$ con la ec. 3.55 (apuntes del tema 3),
      escrita una vez por galga. Después, el círculo de deformaciones da las
      principales, la ley de Hooke de la tensión plana las tensiones, y los
      criterios del tema 6 los factores de seguridad.

      **a) Las deformaciones.** Con la ec. 3.55, escrita para cada galga,

      $$
      \varepsilon_\theta = \varepsilon_x\cos^{2}\theta + \varepsilon_y\operatorname{sen}^{2}\theta + \gamma_{xy}\operatorname{sen}\theta\cos\theta
      $$

      y las galgas a 0°, 60° y 150°:

      $$
      \varepsilon_a = \varepsilon_x,\qquad
      \varepsilon_b = \tfrac14\varepsilon_x + \tfrac34\varepsilon_y + \tfrac{\sqrt3}{4}\gamma_{xy},\qquad
      \varepsilon_c = \tfrac34\varepsilon_x + \tfrac14\varepsilon_y - \tfrac{\sqrt3}{4}\gamma_{xy}
      $$

      Sumando y restando las dos últimas:

      $$
      \varepsilon_x = \varepsilon_a,\qquad
      \varepsilon_y = \varepsilon_b + \varepsilon_c - \varepsilon_a,\qquad
      \gamma_{xy} = \frac{2\varepsilon_a + \varepsilon_b - 3\varepsilon_c}{\sqrt3}
      $$

      Con las lecturas, $\varepsilon_x = 1200$, $\varepsilon_y = 400$ y
      $\gamma_{xy} = 800\sqrt3 = 1385{,}64$, en $10^{-6}$.

      **b) Deformaciones principales.** Centro $800$ y radio
      $\sqrt{400^{2} + 692{,}82^{2}} = 800$:

      $$
      \varepsilon_1 = 1600\cdot10^{-6},\qquad \varepsilon_2 = 0,\qquad
      \tan2\theta_1 = \frac{1385{,}64}{800} = \sqrt3 \;\Rightarrow\; \theta_1 = 30°
      $$

      La tercera, fuera del plano, es
      $\varepsilon_z = -\tfrac{\nu}{1-\nu}(\varepsilon_1+\varepsilon_2) = -685{,}7\cdot10^{-6}$.

      **Tensiones principales** (tensión plana, apuntes del tema 4, ecs. 4.25):

      $$
      \sigma_1 = \frac{E}{1-\nu^{2}}(\varepsilon_1 + \nu\varepsilon_2) = 369{,}23\ \text{MPa},\qquad
      \sigma_2 = \frac{E}{1-\nu^{2}}(\nu\varepsilon_1 + \varepsilon_2) = 110{,}77\ \text{MPa},\qquad
      \sigma_3 = 0
      $$

      Por las componentes, $\sigma_x = 304{,}62$, $\sigma_y = 175{,}38$ y
      $\tau_{xy} = G\gamma_{xy} = 111{,}92$ MPa dan las mismas principales,
      en la misma dirección de 30°.

      **c) Factores de seguridad**, con $\sigma_1 = 369{,}23$,
      $\sigma_2 = 110{,}77$ y $\sigma_3 = 0$:

      - Tresca (ec. 6.19): $\sigma_{eqv} = \sigma_1 - \sigma_3 = 369{,}23$ MPa
        y $FS = 800/369{,}23 = 2{,}167$.
      - Von Mises (ec. 6.31):
        $\sigma_{eqv} = \sqrt{\sigma_1^{2} - \sigma_1\sigma_2 + \sigma_2^{2}} = 328{,}18$ MPa
        y $FS = 800/328{,}18 = 2{,}438$.

      Von Mises da más margen, como siempre: Tresca es el más conservador de
      los dos.

  # ── Problema 3 · AB rígida articulada en A y el tirante BC. Impreso
  #    «3. (2 p)», con espacio.
  - id: exerm1718-1par-7-la-barra-rigida-y-el-tirante
    titulo: La barra rígida sujeta por un tirante, y cuánto se mueve su extremo
    fuente: >-
      Problema 3 · Primer parcial del 3 de noviembre de 2017 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 2 puntos. El examen no publica resolución; el
      desarrollo es nuestro, con el convenio del tema 8 (apartado 8.4).
    nivel: examen
    enunciado: |
      (2 p) En la estructura de la figura la barra AB de 4m de longitud puede
      considerarse rígida y el tirante BC es de acero con módulo de
      elasticidad $E$ = 210 GPa. Su sección es circular de 10 mm de radio.
      Determinar las componentes horizontal y vertical del desplazamiento de B
      cuando $P$ = 20 kN.

      <figure class="figura-examen">
      <svg viewBox="50 50 270 235" role="img" width="270" height="235" aria-labelledby="exerm1718-1par-7-la-barra-rigida-y-el-tirante-fig-t exerm1718-1par-7-la-barra-rigida-y-el-tirante-fig-d">
      <title id="exerm1718-1par-7-la-barra-rigida-y-el-tirante-fig-t">La barra rígida AB, articulada en A, sostenida por el tirante BC</title>
      <desc id="exerm1718-1par-7-la-barra-rigida-y-el-tirante-fig-d">Una barra gruesa AB sube desde un apoyo fijo en A hacia la izquierda, formando 75° con la horizontal. De su extremo superior B sale un tirante delgado que baja hacia la derecha hasta otro apoyo fijo, C, situado a la altura de A y a su derecha; el tirante forma 45° con la horizontal en C. Una línea a trazos horizontal une A y C. En B actúa una fuerza P vertical hacia abajo.</desc>
      <defs><pattern id="exerm1718-1par-7-la-barra-rigida-y-el-tirante-fig-r" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--paper)"/><rect width="0.9" height="5" fill="var(--faint)"/></pattern></defs>
      <line x1="74" y1="252" x2="280.1" y2="252" stroke="var(--faint)" stroke-width="1" stroke-dasharray="5 3"/>
      <polygon points="150,256 140,272 160,272" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/><rect x="136" y="272" width="28" height="6" fill="url(#exerm1718-1par-7-la-barra-rigida-y-el-tirante-fig-r)"/><line x1="136" y1="272" x2="164" y2="272" stroke="var(--ink)" stroke-width="1.3"/>
      <polygon points="280.1,256 270.1,272 290.1,272" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/><rect x="266.1" y="272" width="28" height="6" fill="url(#exerm1718-1par-7-la-barra-rigida-y-el-tirante-fig-r)"/><line x1="266.1" y1="272" x2="294.1" y2="272" stroke="var(--ink)" stroke-width="1.3"/>
      <line x1="102.4" y1="74.3" x2="280.1" y2="252" stroke="var(--ink)" stroke-width="1.4"/>
      <line x1="150" y1="252" x2="102.4" y2="74.3" stroke="var(--ink)" stroke-width="8" stroke-linecap="round"/><line x1="150" y1="252" x2="102.4" y2="74.3" stroke="var(--faint)" stroke-width="4.6" stroke-linecap="round"/>
      <circle cx="150" cy="252" r="3.6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.6"/>
      <circle cx="102.4" cy="74.3" r="3.6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.6"/>
      <circle cx="280.1" cy="252" r="3.6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.6"/>
      <line x1="102.4" y1="79.3" x2="102.4" y2="139.3" stroke="var(--d2)" stroke-width="2.2"/><polygon points="102.4,148.3 97.9,138.3 106.9,138.3" fill="var(--d2)"/>
      <text x="86.4" y="130.3" text-anchor="middle" font-size="15" font-style="italic" fill="var(--d2-tinta)">P</text>
      <path d="M108 252 A42 42 0 0 1 139.1 211.4" fill="none" stroke="var(--ink)" stroke-width="1"/><polygon points="139.1,211.4 134,215.3 132.7,210.7" fill="var(--ink)"/><polygon points="108,252 105.6,246 110.4,246" fill="var(--ink)"/>
      <text x="88" y="226" text-anchor="middle" font-size="13" fill="var(--ink)">75°</text>
      <path d="M240.1 252 A40 40 0 0 1 251.8 223.7" fill="none" stroke="var(--ink)" stroke-width="1"/><polygon points="251.8,223.7 249.3,229.7 245.9,226.3" fill="var(--ink)"/><polygon points="240.1,252 237.7,246 242.5,246" fill="var(--ink)"/>
      <text x="222.1" y="236" text-anchor="middle" font-size="13" fill="var(--ink)">45°</text>
      <text x="114.4" y="72.3" font-size="14" fill="var(--ink)">B</text>
      <text x="159" y="244" font-size="14" fill="var(--ink)">A</text>
      <text x="289.1" y="246" font-size="14" fill="var(--ink)">C</text>
      </svg>
      <figcaption>

      Redibujada del enunciado, a escala: AB de 4 m a 75° de la horizontal y
      el tirante a 45°.

      </figcaption>
      </figure>

      **Notas nuestras.** La figura no lleva cotas y el texto solo da la
      longitud de AB: lo demás sale de los ángulos. B queda $4\cos75° = 1{,}035$ m a la izquierda de A y
      $4\operatorname{sen}75° = 3{,}864$ m por encima; como el tirante forma
      45°, C está 3,864 m a la derecha de B, a 2,828 m de A, y el tirante mide
      5,464 m. Los desplazamientos se dan con signo, positivos hacia la
      derecha y hacia arriba.
    pide: >-
      La fuerza del tirante, su alargamiento y las dos componentes del
      desplazamiento de B, en mm.
    pasos:
      - tipo: reconocer
        pregunta: |
          AB es rígida y está articulada en A. ¿Cómo se mueve B?
        opciones:
          - texto: >-
              Perpendicular a AB, y la proyección de su desplazamiento sobre
              el tirante es lo que este se alarga
            correcta: true
            mensaje: |
              Eso es. Un sólido rígido que gira en torno a A mueve B en arco, y
              con giros pequeños, por la tangente: perpendicular a AB. El
              tirante dice cuánto: su alargamiento es la proyección del
              desplazamiento de B sobre su dirección (ecs. 8.10-8.12).
          - texto: >-
              A lo largo del tirante, lo que este se alarga
            mensaje: |
              Así B se saldría de la circunferencia de centro A: AB tendría que
              alargarse, y es rígida. El alargamiento del tirante es solo la
              **proyección** del desplazamiento sobre BC.
          - texto: >-
              Vertical, en la dirección de P
            mensaje: |
              La carga no impone la dirección: la imponen los enlaces. Un punto
              que gira en torno a A solo puede moverse perpendicular a AB, que
              aquí es casi horizontal.
      - tipo: calcular
        titulo: La fuerza del tirante
        pregunta: |
          ¿Cuánto vale la fuerza del tirante BC, en kN?
        respuesta:
          tipo: numero
          valor: '10.353'
          tolerancia: 0.01
          formato: un número, en kN (tracción)
        distractores:
          - valor: '38.637'
            mensaje: |
              Has tomado de brazo de $P$ la altura de B, $4\operatorname{sen}75°$.
              $P$ es vertical: su brazo respecto de A es la distancia
              **horizontal**, $4\cos75° = 1{,}035$ m.
          - valor: '7.3205'
            mensaje: |
              Has tomado de brazo de T la distancia AC, 2,828 m. El brazo es
              la distancia de A a la **recta** BC: $2{,}828\operatorname{sen}45° = 2$ m.
        pista: |
          Momentos respecto de A: $P\cdot4\cos75° = T\cdot d$, con $d$ la
          distancia de A a la recta BC.
        desarrollo: |
          $$
          T\cdot2 = 20\cdot1{,}035 \;\Longrightarrow\; T = 40\cos75° = 10{,}353\ \text{kN}
          $$

          La tensión del tirante es $\sigma = 10\,353/314{,}16 = 32{,}95$ MPa.
      - tipo: calcular
        titulo: El alargamiento del tirante
        pregunta: |
          ¿Cuánto se alarga el tirante, en mm?
        respuesta:
          tipo: numero
          valor: '0.8574'
          tolerancia: 0.001
          formato: un número, en mm
        distractores:
          - valor: '3.4298'
            mensaje: |
              Has tomado los 10 mm como diámetro. Son de radio:
              $A = \pi\cdot10^{2} = 314{,}16$ mm², cuatro veces más.
          - valor: '0.6277'
            mensaje: |
              Has usado los 4 m de AB. El que se alarga es el tirante, que mide
              $2(1+\sqrt3) = 5{,}464$ m.
        pista: |
          $\Delta L = \dfrac{TL}{EA}$, con $L = 5464$ mm y $A = 314{,}16$ mm².
        desarrollo: |
          $$
          \Delta L = \frac{10\,353\cdot5464{,}1}{210\,000\cdot314{,}16} = 0{,}8574\ \text{mm}
          $$
      - tipo: calcular
        titulo: La componente horizontal del desplazamiento de B
        pregunta: |
          ¿Cuánto vale $u_x$ en B, en mm, positiva hacia la derecha?
        respuesta:
          tipo: numero
          valor: '-1.6565'
          tolerancia: 0.002
          formato: un número, en mm, con signo
        distractores:
          - valor: '-0.6063'
            mensaje: |
              Has movido B a lo largo del tirante, $\Delta L\cos45°$. B no puede
              ir por ahí: AB es rígida y lo obliga a moverse perpendicular a
              ella. El alargamiento es solo la proyección sobre BC.
          - valor: '1.6565'
            mensaje: |
              El valor es ese, pero B se mueve hacia la izquierda: $P$ hace girar
              AB en sentido antihorario en torno a A, y B, que está arriba,
              va hacia $-x$.
        pista: |
          $\vec{\delta} = \delta\,(-\operatorname{sen}75°,\ -\cos75°)$, y su
          proyección sobre la dirección de C a B es $\Delta L$.
        desarrollo: |
          La proyección de $\vec{\delta}$ sobre $\hat{e}_{CB} = (-\tfrac{\sqrt2}{2}, \tfrac{\sqrt2}{2})$:

          $$
          \delta\,\frac{\operatorname{sen}75° - \cos75°}{\sqrt2} = \frac{\delta}{2} = \Delta L
          \;\Longrightarrow\; \delta = 1{,}7149\ \text{mm}
          $$

          $$
          u_x = -\delta\operatorname{sen}75° = -1{,}6565\ \text{mm}
          $$
      - tipo: calcular
        titulo: La componente vertical del desplazamiento de B
        pregunta: |
          ¿Cuánto vale $u_y$ en B, en mm, positiva hacia arriba?
        respuesta:
          tipo: numero
          valor: '-0.4438'
          tolerancia: 0.002
          formato: un número, en mm, con signo
        distractores:
          - valor: '0.6063'
            mensaje: |
              Has movido B a lo largo del tirante, alejándose de C. AB rígida
              no lo permite: B baja un poco, porque se mueve perpendicular a una
              barra casi vertical.
          - valor: '-1.6565'
            mensaje: |
              Es $u_x$. La componente grande es la horizontal: AB está a 75°,
              casi vertical, y la perpendicular a ella es casi horizontal.
        pista: |
          $u_y = -\delta\cos75°$.
        desarrollo: |
          $$
          u_y = -1{,}7149\cos75° = -0{,}4438\ \text{mm}
          $$

          AB gira $\theta = \delta/L = 4{,}29\cdot10^{-4}$ rad en sentido
          antihorario.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Momentos respecto de A: $20\cdot4\cos75° = T\cdot2$, con 2 m la
              distancia de A a la recta BC; $T = 10{,}353$ kN.
          - texto: >-
              El tirante mide $5{,}464$ m y su sección es $\pi\cdot10^{2}$ mm²:
              $\Delta L = TL/EA = 0{,}8574$ mm.
          - texto: >-
              B se mueve perpendicular a AB, $\vec{\delta} = \delta(-\operatorname{sen}75°, -\cos75°)$,
              y la proyección de $\vec{\delta}$ sobre CB es $\Delta L$:
              $\delta = 2\Delta L = 1{,}715$ mm.
          - texto: >-
              $u_x = -1{,}6565$ mm (hacia la izquierda) y $u_y = -0{,}4438$ mm
              (hacia abajo).
          - texto: >-
              Como el tirante es lo único que se deforma, B se mueve según BC
              lo que este se alarga.
            trampa: true
            mensaje: |
              El tirante es lo único que se deforma, pero B está también en AB,
              que gira sin alargarse: B se mueve perpendicular a AB. Lo que
              marca el tirante es la **proyección** del movimiento sobre BC, no
              el movimiento entero.
    resolucion: |
      **La idea.** Es isostático: AB articulada en A y un tirante. Los
      momentos respecto de A dan la fuerza del tirante, la ley de Hooke su
      alargamiento, y la geometría del movimiento de B (perpendicular a AB,
      con su proyección sobre BC igual al alargamiento) da las dos
      componentes. Ejes: $x$ hacia la derecha, $y$ hacia arriba, origen en A.

      **La geometría.** $B = (-4\cos75°,\ 4\operatorname{sen}75°) = (-1{,}035;\ 3{,}864)$ m.
      El tirante baja a 45° hasta la altura de A, así que
      $C = (2{,}828;\ 0)$ m y $L_{BC} = 3{,}864\sqrt2 = 5{,}464$ m. La distancia
      de A a la recta BC es $2{,}828\operatorname{sen}45° = 2$ m.

      **La fuerza del tirante.** Momentos respecto de A, con el tirante
      tirando de B hacia C:

      $$
      P\cdot4\cos75° = T\cdot2 \;\Longrightarrow\; T = 40\cos75° = 10{,}353\ \text{kN}\ \text{(tracción)}
      $$

      Su tensión es $\sigma = 10\,353/314{,}16 = 32{,}95$ MPa. La barra AB solo
      tiene fuerzas en sus extremos y trabaja según su eje: el equilibrio de
      B da $N_{AB} = -20\sqrt2 = -28{,}28$ kN, a compresión.

      **El alargamiento** (apuntes del tema 8, ec. 8.9):

      $$
      \Delta L = \frac{TL}{EA} = \frac{10\,353\cdot5464{,}1}{210\,000\cdot\pi\cdot10^{2}} = 0{,}8574\ \text{mm}
      $$

      **El desplazamiento de B.** AB gira en torno a A como sólido rígido: B
      se mueve perpendicular a AB. $P$ la hace girar en sentido antihorario,
      así que $\vec{\delta} = \delta\,(-\operatorname{sen}75°,\ -\cos75°)$. El
      alargamiento del tirante es la proyección de $\vec{\delta}$ sobre la
      dirección de C a B (ecs. 8.10-8.12), $\hat{e}_{CB} = (-\tfrac{\sqrt2}{2}, \tfrac{\sqrt2}{2})$:

      $$
      \Delta L = \delta\,\frac{\operatorname{sen}75° - \cos75°}{\sqrt2} = \frac{\delta}{2}
      \;\Longrightarrow\; \delta = 2\Delta L = 1{,}7149\ \text{mm}
      $$

      $$
      u_x = -\delta\operatorname{sen}75° = -1{,}6565\ \text{mm},\qquad
      u_y = -\delta\cos75° = -0{,}4438\ \text{mm}
      $$

      B se va 1,66 mm a la izquierda y 0,44 mm hacia abajo, y AB gira
      $4{,}29\cdot10^{-4}$ rad. El diagrama, a escala de desplazamientos:

