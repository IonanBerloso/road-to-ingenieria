ejercicios:
  # ── Teoría · cuestión 1 · la compatibilidad de un campo plano: C1 y C2.
  - id: exerm1718-1par-1-la-compatibilidad-del-campo-plano
    titulo: Las dos constantes que hacen compatible un campo de deformaciones plano
    fuente: >-
      Cuestión 1 de teoría · Primer parcial del 3 de noviembre de 2017 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 3, apartado 3.8.
    nivel: examen
    enunciado: |
      (1p) En un problema plano, el campo de deformaciones viene dado por:

      $$
      \varepsilon_x = 2Axy^{2}\qquad \varepsilon_y = 2Bx^{2}y\qquad \gamma_{xy} = C_1x^{2}y + C_2xy^{2}
      $$

      Siendo $A$ y $B$ dos constantes conocidas. Determinar $C_1$ y $C_2$ en
      función de $A$ y $B$ para que el campo de desplazamientos sea
      físicamente posible, sabiendo que:

      $$
      \varepsilon_{x,yy} + \varepsilon_{y,xx} = \gamma_{xy,xy}
      $$
    pide: >-
      C1 y C2 en función de A y B, imponiendo la ecuación de compatibilidad
      del plano en todos los puntos.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué garantiza la ecuación de compatibilidad que da el enunciado?
        opciones:
          - texto: >-
              Que existen unos desplazamientos $u$ y $v$, continuos y sin
              depender del camino, de los que salen esas tres deformaciones
            correcta: true
            mensaje: |
              Eso es (ecs. 3.61-3.63). Tres deformaciones salen de solo dos
              desplazamientos, así que no pueden ser tres funciones
              cualesquiera: para que $du$ y $dv$ sean diferenciales exactas, y
              también la rotación, las derivadas segundas tienen que cumplir la
              ec. 3.63.
          - texto: Que el sólido está en equilibrio
            mensaje: |
              El equilibrio va con las tensiones y las fuerzas de volumen (tema
              2). La compatibilidad es solo geometría: no aparece ni una
              fuerza ni una constante del material.
          - texto: Que el material es elástico y lineal
            mensaje: |
              La ec. 3.63 no lleva ni $E$ ni $\nu$: vale para cualquier
              material. Dice si las deformaciones pueden venir de un campo de
              desplazamientos, se deba a lo que se deba.
      - tipo: calcular
        titulo: La constante C1
        pregunta: |
          ¿Cuánto vale el cociente $C_1/A$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número (C1 entre A)
        distractores:
          - valor: '4'
            mensaje: |
              Has puesto la mitad de la distorsión a la derecha, como si la
              ecuación fuera con $\varepsilon_{xy} = \tfrac12\gamma_{xy}$. La
              ec. 3.63 lleva la $\gamma_{xy}$ entera: $4Ax = 2C_1x$.
          - valor: '0'
            mensaje: |
              Has derivado cada deformación dos veces respecto de su propia
              variable: $\varepsilon_{x,xx} = 0$ y $\varepsilon_{y,yy} = 0$. Las
              derivadas son **cruzadas**: $\varepsilon_x$ dos veces respecto de
              $y$ y $\varepsilon_y$ dos veces respecto de $x$.
        pista: |
          $\varepsilon_{x,yy} = 4Ax$ y $\gamma_{xy,xy} = 2C_1x + 2C_2y$. Iguala
          los términos en $x$.
        desarrollo: |
          $$
          \varepsilon_{x,yy} + \varepsilon_{y,xx} = 4Ax + 4By,\qquad
          \gamma_{xy,xy} = \frac{\partial^{2}}{\partial x\,\partial y}\left(C_1x^{2}y + C_2xy^{2}\right) = 2C_1x + 2C_2y
          $$

          Tiene que valer en todos los puntos: los coeficientes de $x$ son
          iguales, $4A = 2C_1$, y $C_1 = 2A$.
      - tipo: calcular
        titulo: La constante C2
        pregunta: |
          ¿Cuánto vale el cociente $C_2/B$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número (C2 entre B)
        distractores:
          - valor: '1'
            mensaje: |
              Has derivado $x^{2}$ como $x$: $\varepsilon_{y,xx}$ es la derivada
              segunda de $2Bx^{2}y$ respecto de $x$, que es $4By$, no $2By$.
          - valor: '4'
            mensaje: |
              Es el mismo error que con $C_1$: la ecuación con
              $\tfrac12\gamma_{xy}$ a la derecha. Con la $\gamma_{xy}$ entera,
              $4B = 2C_2$.
        pista: |
          Los términos en $y$: $\varepsilon_{y,xx} = 4By$ frente a $2C_2y$.
        desarrollo: |
          $$
          4By = 2C_2y \;\Longrightarrow\; C_2 = 2B
          $$

          Y el campo queda $\gamma_{xy} = 2Ax^{2}y + 2Bxy^{2}$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\varepsilon_{x,yy} = 4Ax$ y $\varepsilon_{y,xx} = 4By$.
          - texto: >-
              $\gamma_{xy,xy} = 2C_1x + 2C_2y$.
          - texto: >-
              La igualdad $4Ax + 4By = 2C_1x + 2C_2y$ tiene que cumplirse en
              todos los puntos: se igualan los coeficientes de $x$ y de $y$,
              $C_1 = 2A$ y $C_2 = 2B$.
          - texto: >-
              Comprobación: $u = Ax^{2}y^{2}$ y $v = Bx^{2}y^{2}$ dan
              $u_{,x} = 2Axy^{2}$, $v_{,y} = 2Bx^{2}y$ y
              $u_{,y} + v_{,x} = 2Ax^{2}y + 2Bxy^{2}$.
          - texto: >-
              Hay una sola ecuación y dos incógnitas, así que una de las dos
              constantes queda libre.
            trampa: true
            mensaje: |
              La ecuación no es una sola igualdad entre números: es una
              identidad que tiene que valer en **todo** el plano. Un polinomio
              en $x$ e $y$ es idénticamente nulo solo si lo son todos sus
              coeficientes, y eso da dos ecuaciones, una por $x$ y otra por
              $y$.
    resolucion: |
      **La idea.** Tres deformaciones vienen de dos desplazamientos, así que
      no son independientes. La condición de compatibilidad del plano
      (apuntes del tema 3, ec. 3.63) es la que dice si existen unos $u$ y $v$
      de los que salgan. Se impone en todos los puntos y da dos ecuaciones.

      **Las derivadas.**

      $$
      \varepsilon_{x,yy} = \frac{\partial^{2}}{\partial y^{2}}\left(2Axy^{2}\right) = 4Ax,\qquad
      \varepsilon_{y,xx} = \frac{\partial^{2}}{\partial x^{2}}\left(2Bx^{2}y\right) = 4By
      $$

      $$
      \gamma_{xy,xy} = \frac{\partial^{2}}{\partial x\,\partial y}\left(C_1x^{2}y + C_2xy^{2}\right) = 2C_1x + 2C_2y
      $$

      **La condición.** $4Ax + 4By = 2C_1x + 2C_2y$ para todo $x$ e $y$:

      $$
      C_1 = 2A,\qquad C_2 = 2B
      $$

      **Comprobación.** El campo $u = Ax^{2}y^{2}$, $v = Bx^{2}y^{2}$ (más un
      movimiento de sólido rígido cualquiera) da
      $\varepsilon_x = u_{,x} = 2Axy^{2}$, $\varepsilon_y = v_{,y} = 2Bx^{2}y$ y
      $\gamma_{xy} = u_{,y} + v_{,x} = 2Ax^{2}y + 2Bxy^{2}$, con la $\gamma$
      como disminución del ángulo recto. Con otras $C_1$ y $C_2$ no hay
      desplazamientos que den ese campo: al integrar, $u$ y $v$ dependerían
      del camino.

  # ── Teoría · cuestión 2 · las tensiones a partir de las deformaciones.
  - id: exerm1718-1par-2-las-tensiones-a-partir-de-las-deformaciones
    titulo: Las tensiones a partir de las deformaciones, con λ y G
    fuente: >-
      Cuestión 2 de teoría · Primer parcial del 3 de noviembre de 2017 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 4, apartado 4.3.
    nivel: examen
    enunciado: |
      (1p) Determinar las tensiones a partir de las deformaciones.
    pide: >-
      La deducción de σx = 2Gεx + λe y sus compañeras, con e = εx + εy + εz,
      y de τ = Gγ, partiendo de la ley de Hooke generalizada.
    pasos:
      - tipo: reconocer
        pregunta: |
          En $\sigma_x = 2G\varepsilon_x + \lambda e$, ¿qué es $e$?
        opciones:
          - texto: >-
              La deformación volumétrica unitaria, $e = \varepsilon_x +
              \varepsilon_y + \varepsilon_z$
            correcta: true
            mensaje: |
              Eso es (ec. 4.9). Las tres deformaciones normales, también la de
              $z$ aunque el problema parezca plano. Es el término que reparte
              en cada dirección el efecto de las otras dos.
          - texto: >-
              La suma de las deformaciones del plano, $\varepsilon_x +
              \varepsilon_y$
            mensaje: |
              Falta $\varepsilon_z$. Solo se puede quitar si es nula, que es la
              deformación plana; en tensión plana $\varepsilon_z \ne 0$ y hay
              que contarla.
          - texto: La tensión esférica dividida por $E$
            mensaje: |
              La tensión esférica y $e$ están relacionadas, pero con el módulo
              volumétrico: $\sigma_e = k\,e$ con $k = E/3(1-2\nu)$ (ecs. 4.14 y
              4.16), no con $E$.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción completa, como en el examen: de la ley de Hooke
          generalizada a las tensiones en función de las deformaciones.
        rubrica:
          - punto: >-
              Se parte de la ley de Hooke generalizada,
              εx = [σx − ν(σy + σz)]/E y sus dos compañeras, y
              γ = τ/G (ecs. 4.2 y 4.3).
            porque: >-
              Es lo que se invierte. Sin escribirla, el resto no tiene de
              dónde salir.
            minimo: true
          - punto: >-
              Se suman las tres normales: e = (1 − 2ν)(σx + σy + σz)/E, y se
              despeja la suma de tensiones (ecs. 4.8 y 4.9).
            porque: >-
              Es el truco de la deducción: la suma de tensiones es lo que
              acopla las tres ecuaciones, y se conoce en función de e.
            minimo: true
          - punto: >-
              En la primera ecuación se suma y resta νσx:
              Eεx = (1 + ν)σx − ν(σx + σy + σz), y se sustituye la suma
              (ec. 4.10).
            porque: >-
              Así σx queda sola, sin σy ni σz sueltas.
            minimo: true
          - punto: >-
              Se despeja σx = E/(1 + ν)·εx + νE/[(1 + ν)(1 − 2ν)]·e y se
              reconocen 2G = E/(1 + ν) y λ = νE/[(1 + ν)(1 − 2ν)], el
              coeficiente de Lamé (ecs. 4.11 y 4.12).
            porque: >-
              Es la respuesta, y el nombre de las constantes es lo que el
              corrector busca.
            minimo: true
          - punto: >-
              Las tangenciales salen directas: τxy = Gγxy, τyz = Gγyz,
              τzx = Gγzx (ec. 4.13).
            porque: >-
              Completa las seis componentes; sin ellas el tensor queda a
              medias.
            minimo: true
          - punto: >-
              Se escribe en forma compacta, [σ] = λe[I] + 2G[ε], con la mitad
              de γ fuera de la diagonal de [ε].
            porque: >-
              No es imprescindible, pero muestra que la ley tiene la misma
              forma en cualquier sistema de ejes.
      - tipo: calcular
        titulo: El coeficiente de Lamé
        pregunta: |
          Un ejemplo nuestro, con los datos del problema 2 de este examen: con $E = 210$ GPa y $\nu = 0{,}3$, ¿cuánto vale $\lambda$, en MPa?
        respuesta:
          tipo: numero
          valor: '121154'
          tolerancia: 2
          formato: un número, en MPa
        distractores:
          - valor: '175000'
            mensaje: |
              Es el módulo volumétrico, $k = E/3(1-2\nu)$ (ec. 4.16). El de
              Lamé es $\lambda = \nu E/[(1+\nu)(1-2\nu)] = 63\,000/0{,}52$.
          - valor: '80769'
            mensaje: |
              Es $G = E/2(1+\nu)$, la otra constante de la fórmula. $\lambda$
              acompaña a $e$; $2G$ acompaña a $\varepsilon_x$.
        pista: |
          $\lambda = \dfrac{\nu E}{(1+\nu)(1-2\nu)}$.
        desarrollo: |
          $$
          \lambda = \frac{0{,}3\cdot210\,000}{1{,}3\cdot0{,}4} = 121\,154\ \text{MPa},\qquad
          G = \frac{210\,000}{2{,}6} = 80\,769\ \text{MPa}
          $$
      - tipo: calcular
        titulo: σx en un ejemplo
        pregunta: |
          Un ejemplo nuestro, con las deformaciones del problema 2 de este
          examen (en $10^{-6}$): $\varepsilon_x = 1200$, $\varepsilon_y = 400$,
          $\varepsilon_z = -685{,}71$ y $\gamma_{xy} = 1385{,}64$, con
          $E = 210$ GPa y $\nu = 0{,}3$. ¿Cuánto vale $\sigma_x$, en MPa?
        respuesta:
          tipo: numero
          valor: '304.62'
          tolerancia: 0.3
          formato: un número, en MPa
        distractores:
          - valor: '387.69'
            mensaje: |
              Has dejado $\varepsilon_z$ fuera de $e$. La deformación
              volumétrica lleva las tres: $e = 1200 + 400 - 685{,}71 = 914{,}29$,
              no 1600.
          - valor: '193.85'
            mensaje: |
              Es solo $2G\varepsilon_x$. Falta $\lambda e$, lo que aportan las
              otras dos direcciones: $121\,154\cdot914{,}29\cdot10^{-6} = 110{,}77$
              MPa.
          - valor: '252'
            mensaje: |
              Es $E\varepsilon_x$, como en una barra. Eso vale si $\sigma_y$ y
              $\sigma_z$ son nulas; aquí hay deformación en las tres
              direcciones y la fórmula es $2G\varepsilon_x + \lambda e$.
        pista: |
          $e = \varepsilon_x + \varepsilon_y + \varepsilon_z = 914{,}29\cdot10^{-6}$.
        desarrollo: |
          $$
          \sigma_x = 2\cdot80\,769\cdot1200\cdot10^{-6} + 121\,154\cdot914{,}29\cdot10^{-6}
          = 193{,}85 + 110{,}77 = 304{,}62\ \text{MPa}
          $$
      - tipo: calcular
        titulo: σz en el mismo ejemplo
        pregunta: |
          ¿Cuánto vale $\sigma_z$, en MPa?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '-110.77'
            mensaje: |
              Es $2G\varepsilon_z$ sin $\lambda e$. Con el término de Lamé,
              $-110{,}77 + 110{,}77 = 0$: la $\varepsilon_z$ del ejemplo es la
              de una tensión plana, la contracción que producen $\sigma_x$ y
              $\sigma_y$ por Poisson.
          - valor: '-144'
            mensaje: |
              Es $E\varepsilon_z$. Una deformación según $z$ no significa una
              tensión según $z$: aquí $\varepsilon_z$ la producen las tensiones
              del plano.
        pista: |
          $\sigma_z = 2G\varepsilon_z + \lambda e$.
        desarrollo: |
          $$
          \sigma_z = 2\cdot80\,769\cdot(-685{,}71)\cdot10^{-6} + 110{,}77 = 0
          $$

          Es lo esperable: $\varepsilon_z = -\tfrac{\nu}{1-\nu}(\varepsilon_x+\varepsilon_y)$
          es justo la de la tensión plana.
      - tipo: calcular
        titulo: τxy en el mismo ejemplo
        pregunta: |
          ¿Cuánto vale $\tau_{xy}$, en MPa?
        respuesta:
          tipo: numero
          valor: '111.92'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '55.96'
            mensaje: |
              Has usado $\tfrac12\gamma_{xy}$, la componente del tensor de
              deformaciones. La ec. 4.13 va con la $\gamma$ entera: $\tau = G\gamma$.
          - valor: '223.83'
            mensaje: |
              Es $2G\gamma_{xy}$: el 2 de las normales no va en las
              tangenciales. Con el tensor sería $2G\cdot\tfrac12\gamma = G\gamma$.
        pista: |
          $\tau_{xy} = G\gamma_{xy}$.
        desarrollo: |
          $$
          \tau_{xy} = 80\,769\cdot1385{,}64\cdot10^{-6} = 111{,}92\ \text{MPa}
          $$
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Hooke generalizada: $E\varepsilon_x = \sigma_x - \nu(\sigma_y + \sigma_z)$
              y sus compañeras, y $\gamma = \tau/G$.
          - texto: >-
              Sumando las tres, $e = \tfrac{1-2\nu}{E}(\sigma_x + \sigma_y + \sigma_z)$.
          - texto: >-
              Sumando y restando $\nu\sigma_x$, $E\varepsilon_x = (1+\nu)\sigma_x -
              \nu(\sigma_x+\sigma_y+\sigma_z) = (1+\nu)\sigma_x - \tfrac{\nu E}{1-2\nu}e$.
          - texto: >-
              $\sigma_x = 2G\varepsilon_x + \lambda e$, con
              $\lambda = \tfrac{\nu E}{(1+\nu)(1-2\nu)}$, y $\tau = G\gamma$.
          - texto: >-
              Como $\sigma_y$ y $\sigma_z$ son datos, se despeja $\sigma_x$
              directamente de la primera ecuación de Hooke.
            trampa: true
            mensaje: |
              No son datos: se buscan las seis tensiones a partir de las seis
              deformaciones. Las tres ecuaciones normales están acopladas, y
              para desacoplarlas hace falta la suma, que es lo que da $e$.
    resolucion: |
      **La idea.** La ley de Hooke generalizada da las deformaciones en
      función de las tensiones. Se invierte: las tres ecuaciones normales
      están acopladas por la suma de tensiones, y esa suma se conoce si se
      suman las tres (apuntes del tema 4, apartado 4.3).

      **De partida** (ecs. 4.2 y 4.3):

      $$
      \varepsilon_x = \frac{1}{E}\left[\sigma_x - \nu(\sigma_y+\sigma_z)\right],\quad
      \varepsilon_y = \frac{1}{E}\left[\sigma_y - \nu(\sigma_z+\sigma_x)\right],\quad
      \varepsilon_z = \frac{1}{E}\left[\sigma_z - \nu(\sigma_x+\sigma_y)\right],\qquad
      \gamma_{ij} = \frac{\tau_{ij}}{G}
      $$

      **La suma** (ecs. 4.8 y 4.9). Con $e = \varepsilon_x + \varepsilon_y + \varepsilon_z$,
      la deformación volumétrica unitaria:

      $$
      e = \frac{1-2\nu}{E}\,(\sigma_x+\sigma_y+\sigma_z)
      \;\Longrightarrow\;
      \sigma_x+\sigma_y+\sigma_z = \frac{E}{1-2\nu}\,e
      $$

      **Despejar σx** (ecs. 4.10 y 4.11). Sumando y restando $\nu\sigma_x$ en
      la primera:

      $$
      E\varepsilon_x = (1+\nu)\,\sigma_x - \nu\,(\sigma_x+\sigma_y+\sigma_z) = (1+\nu)\,\sigma_x - \frac{\nu E}{1-2\nu}\,e
      $$

      $$
      \sigma_x = \frac{E}{1+\nu}\,\varepsilon_x + \frac{\nu E}{(1+\nu)(1-2\nu)}\,e
      $$

      **El resultado** (ecs. 4.12 y 4.13), con $G = E/2(1+\nu)$ y el
      coeficiente de Lamé $\lambda = \nu E/[(1+\nu)(1-2\nu)]$:

      $$
      \sigma_x = 2G\varepsilon_x + \lambda e,\qquad
      \sigma_y = 2G\varepsilon_y + \lambda e,\qquad
      \sigma_z = 2G\varepsilon_z + \lambda e
      $$

      $$
      \tau_{xy} = G\gamma_{xy},\qquad \tau_{yz} = G\gamma_{yz},\qquad \tau_{zx} = G\gamma_{zx}
      $$

      O, de una vez, $[\sigma] = \lambda e\,[I] + 2G\,[\varepsilon]$, con
      $\tfrac12\gamma$ fuera de la diagonal de $[\varepsilon]$.

      **Un ejemplo con números** (nuestro, con las deformaciones del problema
      2 de este examen): con $E = 210$ GPa y $\nu = 0{,}3$, $\lambda = 121\,154$
      y $G = 80\,769$ MPa. Para $\varepsilon_x = 1200$, $\varepsilon_y = 400$,
      $\varepsilon_z = -685{,}71$ y $\gamma_{xy} = 1385{,}64$ (en $10^{-6}$),
      $e = 914{,}29\cdot10^{-6}$ y salen $\sigma_x = 304{,}62$,
      $\sigma_y = 175{,}38$, $\sigma_z = 0$ y $\tau_{xy} = 111{,}92$ MPa: la
      tensión plana del problema 2.

  # ── Teoría · cuestión 3 · Mohr con el fallo hidrostático y el de cortadura.
  - id: exerm1718-1par-3-mohr-con-un-estado-hidrostatico
    titulo: El criterio de Mohr con un fallo hidrostático y uno de cortadura
    fuente: >-
      Cuestión 3 de teoría · Primer parcial del 3 de noviembre de 2017 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 6, apartado 6.4.
    nivel: examen
    enunciado: |
      (1p) Sabiendo que el fallo de un material en un estado hidrostático de
      tensión se produce a (9$\sigma_0$) y que en un ensayo de cortadura pura
      se produce a $\tau$ = $\sigma_0$, determinar la tensión a la que falla
      el material en un ensayo de tracción de acuerdo al criterio de los
      estados límites de Mohr.
    pide: >-
      La tensión de fallo a tracción, σet, en función de σ0, y de paso k y
      la de compresión.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo es el círculo de Mohr del estado hidrostático de fallo?
        opciones:
          - texto: >-
              Un punto sobre el eje, en $\sigma = 9\sigma_0$: las tres
              principales son iguales
            correcta: true
            mensaje: |
              Eso es. Sin tangenciales en ningún plano, el círculo se reduce a
              un punto. Como es un estado de fallo, la recta intrínseca pasa
              por él: es su vértice.
          - texto: >-
              Un círculo de diámetro 0 a $9\sigma_0$, como una tracción simple
              de $9\sigma_0$
            mensaje: |
              Eso sería $\sigma_1 = 9\sigma_0$ con $\sigma_3 = 0$. En el
              hidrostático las tres valen $9\sigma_0$, y
              $\sigma_1 - \sigma_3 = 0$: no hay círculo, hay un punto.
          - texto: Un círculo de radio $9\sigma_0$ centrado en el origen
            mensaje: |
              Ese es el de una cortadura pura de $9\sigma_0$. El centro de un
              círculo de Mohr es $(\sigma_1+\sigma_3)/2$, aquí $9\sigma_0$, y el
              radio $(\sigma_1-\sigma_3)/2 = 0$.
      - tipo: calcular
        titulo: El cociente k
        pregunta: |
          Con $\sigma_{eqv} = \sigma_1 - k\sigma_3$ y $k = \sigma_{et}/\sigma_{ec}$,
          ¿cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.8'
          tolerancia: 0.005
          formato: un número
        distractores:
          - valor: '0.1111'
            mensaje: |
              Es $\operatorname{sen}\phi = 1/9$, la inclinación de la recta
              intrínseca. La relación con $k$ es $\operatorname{sen}\phi =
              (1-k)/(1+k)$ (ec. 6.12), y de ahí $k = 0{,}8$.
          - valor: '1.25'
            mensaje: |
              Es $\sigma_{ec}/\sigma_{et}$, el cociente al revés. En los apuntes
              $k = \sigma_{et}/\sigma_{ec}$, y como un material resiste más a
              compresión, $k < 1$.
        pista: |
          Los dos estados están en el límite:
          $\sigma_{eqv}(\text{hidrostático}) = \sigma_{eqv}(\text{cortadura})$.
        desarrollo: |
          Hidrostático: $\sigma_1 = \sigma_3 = 9\sigma_0$,
          $\sigma_{eqv} = 9\sigma_0(1-k)$. Cortadura: $\sigma_1 = \sigma_0$,
          $\sigma_3 = -\sigma_0$, $\sigma_{eqv} = \sigma_0(1+k)$.

          $$
          9(1-k) = 1+k \;\Longrightarrow\; k = 0{,}8
          $$
      - tipo: calcular
        titulo: La tensión de fallo a tracción
        pregunta: |
          ¿Cuánto vale $\sigma_{et}$, en unidades de $\sigma_0$?
        respuesta:
          tipo: numero
          valor: '1.8'
          tolerancia: 0.01
          formato: un número, en σ0
        distractores:
          - valor: '2'
            mensaje: |
              Es Tresca: $\sigma_1 - \sigma_3 = 2\sigma_0$ en la cortadura. Con
              Tresca ($k = 1$) un estado hidrostático no fallaría nunca, y aquí
              falla a $9\sigma_0$: el criterio de Mohr tiene $k < 1$.
          - valor: '9'
            mensaje: |
              Has tomado el $9\sigma_0$ como una tracción simple. En el
              hidrostático las tres principales valen $9\sigma_0$ y
              $\sigma_{eqv} = 9\sigma_0(1-k)$, mucho menos.
          - valor: '1'
            mensaje: |
              Te has dejado $\sigma_3 = -\sigma_0$ en la cortadura:
              $\sigma_{eqv} = \sigma_1 - k\sigma_3 = \sigma_0 + k\sigma_0$, no
              $\sigma_0$.
        pista: |
          $\sigma_{et}$ es la $\sigma_{eqv}$ de cualquiera de los dos estados de
          fallo: $\sigma_0(1+k)$.
        desarrollo: |
          $$
          \sigma_{et} = \sigma_0\,(1 + 0{,}8) = 1{,}8\,\sigma_0
          $$

          Y lo mismo por el otro: $9\sigma_0(1 - 0{,}8) = 1{,}8\,\sigma_0$.
      - tipo: calcular
        titulo: La tensión de fallo a compresión
        pregunta: |
          ¿Y $\sigma_{ec}$, en unidades de $\sigma_0$?
        respuesta:
          tipo: numero
          valor: '2.25'
          tolerancia: 0.01
          formato: un número, en σ0 (el valor absoluto)
        distractores:
          - valor: '1.44'
            mensaje: |
              Has multiplicado: $1{,}8\cdot0{,}8$. Como $k = \sigma_{et}/\sigma_{ec}$,
              $\sigma_{ec} = \sigma_{et}/k = 1{,}8/0{,}8$.
          - valor: '1.8'
            mensaje: |
              Has supuesto que el material falla igual a tracción y a
              compresión. Eso es $k = 1$, Tresca, y entonces no fallaría en el
              hidrostático.
        pista: |
          $\sigma_{ec} = \sigma_{et}/k$.
        desarrollo: |
          $$
          \sigma_{ec} = \frac{1{,}8\,\sigma_0}{0{,}8} = 2{,}25\,\sigma_0
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Criterio de Mohr: $\sigma_{eqv} = \sigma_1 - k\sigma_3$, con
              $k = \sigma_{et}/\sigma_{ec}$, y el fallo cuando
              $\sigma_{eqv} = \sigma_{et}$.
          - texto: >-
              Hidrostático: $\sigma_{eqv} = 9\sigma_0(1-k)$. Cortadura pura:
              $\sigma_{eqv} = \sigma_0(1+k)$.
          - texto: >-
              Los dos fallan: $9(1-k) = 1+k$, $k = 0{,}8$ y
              $\sigma_{et} = 1{,}8\sigma_0$.
          - texto: >-
              Comprobación geométrica: la recta pasa por $9\sigma_0$ y es
              tangente al círculo de radio $\sigma_0$, con
              $\operatorname{sen}\phi = 1/9 = (1-k)/(1+k)$.
          - texto: >-
              Un estado hidrostático no tiene tangenciales, así que según Mohr
              no puede fallar.
            trampa: true
            mensaje: |
              Eso vale para Tresca y von Mises, que miran las tangenciales o la
              distorsión. Mohr, con $k < 1$, da $\sigma_{eqv} = \sigma(1-k) > 0$
              en un hidrostático de tracción: su recta intrínseca corta el eje
              en $\sigma_{et}/(1-k)$, y ahí hay fallo. El enunciado dice que
              está en $9\sigma_0$.
    resolucion: |
      **La idea.** El criterio de los estados límites de Mohr tiene dos
      parámetros, $\sigma_{et}$ y $\sigma_{ec}$, o $\sigma_{et}$ y $k$. Los dos
      estados de fallo del enunciado dan dos ecuaciones (apuntes del tema 6,
      apartado 6.4).

      **El criterio** (ecs. 6.15 y 6.16): $\sigma_{eqv} = \sigma_1 - k\sigma_3$,
      con $k = \sigma_{et}/\sigma_{ec}$, y el material falla cuando
      $\sigma_{eqv} = \sigma_{et}$.

      **Los dos estados de fallo**, en unidades de $\sigma_0$:

      - Hidrostático, de tracción (con la recta de Mohr, uno de compresión no
        falla nunca): $\sigma_1 = \sigma_2 = \sigma_3 = 9$, y
        $\sigma_{eqv} = 9 - 9k$.
      - Cortadura pura: $\sigma_1 = 1$, $\sigma_2 = 0$, $\sigma_3 = -1$, y
        $\sigma_{eqv} = 1 + k$.

      Los dos están en el límite, así que valen lo mismo, $\sigma_{et}$:

      $$
      9 - 9k = 1 + k \;\Longrightarrow\; k = 0{,}8,\qquad
      \sigma_{et} = 1{,}8\,\sigma_0,\qquad
      \sigma_{ec} = \frac{\sigma_{et}}{k} = 2{,}25\,\sigma_0
      $$

      **La misma cuenta en el plano de Mohr.** El hidrostático es un punto en
      $9\sigma_0$ y la recta intrínseca pasa por él. Es tangente al círculo de
      cortadura, de centro 0 y radio $\sigma_0$: $\operatorname{sen}\phi =
      \sigma_0/9\sigma_0 = 1/9$, y con la ec. 6.12,
      $(1-k)/(1+k) = 1/9$ da otra vez $k = 0{,}8$. El círculo de tracción,
      tangente a la misma recta, llega a $1{,}8\,\sigma_0$:

      <figure class="figura-examen">
      <svg viewBox="0 40 400 120" role="img" width="400" height="120" aria-labelledby="exerm1718-1par-3-mohr-con-un-estado-hidrostatico-fig-t exerm1718-1par-3-mohr-con-un-estado-hidrostatico-fig-d">
      <title id="exerm1718-1par-3-mohr-con-un-estado-hidrostatico-fig-t">La recta intrínseca que pasa por el estado hidrostático y toca el círculo de cortadura pura</title>
      <desc id="exerm1718-1par-3-mohr-con-un-estado-hidrostatico-fig-d">Plano de Mohr, con σ en horizontal y τ en vertical, en unidades de σ0. Sobre el eje, un punto en 9σ0: el estado hidrostático de fallo, cuyo círculo es un punto. Centrado en el origen, el círculo de cortadura pura, de radio σ0. Dos rectas simétricas salen del punto 9σ0 hacia la izquierda, abriéndose muy poco (sen ϕ = 1/9), y son tangentes al círculo de cortadura. Tangentes a las mismas rectas, el círculo de tracción pura, de 0 a 1,8σ0, y el de compresión pura, a trazos, de −2,25σ0 a 0.</desc>
      <line x1="3.5" y1="106" x2="383" y2="106" stroke="var(--ink)" stroke-width="1"/><polygon points="389,106 382,108.8 382,103.2" fill="var(--ink)"/>
      <line x1="86" y1="149.5" x2="86" y2="59.5" stroke="var(--ink)" stroke-width="1"/><polygon points="86,53.5 88.8,60.5 83.2,60.5" fill="var(--ink)"/>
      <text x="389" y="122" text-anchor="end" font-size="13" font-style="italic" fill="var(--ink)">σ</text>
      <text x="94" y="57.4" font-size="13" font-style="italic" fill="var(--ink)">τ</text>
      <line x1="356" y1="106" x2="3.5" y2="66.6" stroke="var(--live)" stroke-width="1.4"/>
      <line x1="356" y1="106" x2="3.5" y2="145.4" stroke="var(--live)" stroke-width="1.4"/>
      <circle cx="86" cy="106" r="30" fill="none" stroke="var(--d2)" stroke-width="1.6"/>
      <circle cx="113" cy="106" r="27" fill="none" stroke="var(--ink)" stroke-width="1.2"/>
      <circle cx="52.2" cy="106" r="33.8" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="4 3"/>
      <circle cx="356" cy="106" r="3.4" fill="var(--d2)"/>
      <circle cx="89.3" cy="76.2" r="2" fill="var(--live)"/>
      <circle cx="116" cy="79.2" r="2" fill="var(--live)"/>
      <circle cx="56" cy="72.5" r="2" fill="var(--live)"/>
      <text x="356" y="124" text-anchor="middle" font-size="12" fill="var(--ink)">9σ₀</text>
      <text x="144" y="101" text-anchor="start" font-size="11" fill="var(--ink)">σet = 1,8σ₀</text>
      <text x="6" y="154" text-anchor="start" font-size="11" fill="var(--ink)">−σec = −2,25σ₀</text>
      <text x="82" y="68" text-anchor="end" font-size="11" fill="var(--d2-tinta)">τ = σ₀</text>
      <line x1="140" y1="103" x2="140" y2="109" stroke="var(--ink)" stroke-width="1"/>
