      <text x="238.3" y="100.9" text-anchor="middle" font-size="15" font-style="italic" fill="var(--ink)">c</text>
      <path d="M90 176 A54 54 0 0 0 63 129.2" fill="none" stroke="var(--ink)" stroke-width="1"/><polygon points="63,129.2 69.4,130.2 67,134.3" fill="var(--ink)"/><polygon points="90,176 87.6,170 92.4,170" fill="var(--ink)"/>
