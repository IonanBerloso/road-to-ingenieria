asignatura: elasticidad-resistencia
curso: '2017-2018'
convocatoria: primer-parcial
fecha: 3 de noviembre de 2017
# El primer parcial de Elasticidad y Resistencia de Materiales del 3 de
# noviembre de 2017 («Parte 1» en la cabecera): tres páginas, la 1 de teoría
# (cuatro cuestiones de 1 punto) y la 2 y la 3 de ejercicios (tres de 2
# puntos). Diez puntos en total, y el cuadernillo los imprime todos.
#
# El cuadernillo es bilingüe, castellano a la izquierda y euskera a la
# derecha, y se transcribe **solo la columna en castellano**, tal cual. Lo
# que hay que saber de ese texto, dicho antes de que nadie lo deduzca:
#
# 1. **LA FECHA DE LA HOJA DE TEORÍA ESTÁ MAL.** La cabecera de la página 1
#    dice «Examen Final: 19/01/2018» en castellano y «Azterketa Finala:
#    2018/01/18» en euskera: es la plantilla de otro examen, y las dos ni
#    siquiera coinciden. Las páginas 2 y 3 dicen «Parte 1: 03/11/2017», y la
#    teoría es de la materia del parcial: la fecha es el 3 de noviembre.
#
# 2. **EL PDF NO PIERDE NADA FRENTE AL WORD.** El Word original
#    (17-ERM-EME-aza1-nov1.docx) escribe cada ε de la línea de las galgas
#    dos veces, y la capa de texto del PDF lleva las dos, pero el PDF dibuja
#    una: se transcribe una. Los cuadros de texto de las figuras llevan
#    restos («30ºx», «60ºx», «Ac») que el PDF recorta y no se ven; se dibuja
#    lo que se ve: 30°, 60° y A (con el signo de grado, no el ordinal del
#    original).
#
# 3. **LO QUE LA FIGURA DICE Y EL TEXTO NO.** En el problema 2 los ángulos
#    de las galgas se leen del triángulo: a a 0°, b a 60° y c a 150° (su
#    lado forma 30° con la base, pero sube hacia la izquierda). No es la
#    roseta de 120° de los apuntes. En el problema 3 la figura no lleva
#    cotas y el texto solo da AB = 4 m:
#    C está a la altura de A y el tirante forma 45° con la horizontal, de
#    donde salen AC = 2,828 m y BC = 5,464 m. Las dos lecturas van en una
#    «Nota nuestra» al pie del enunciado.
#
# 4. **ERRATAS Y GRAFÍAS DEL TEXTO, CONSERVADAS**: «εa=» sin espacio antes
#    del igual, «4m» junto y «(2 p)» con espacio en el problema 3, «45º» y
#    «60º» con el ordinal, «Von Mises» con mayúscula, y el «;» y la «,» que
#    alternan en la línea de datos del problema 2.
#
# 5. **DOS NUMERACIONES.** La teoría va de 1 a 4 y los ejercicios vuelven a
#    empezar en 1. Aquí las cuestiones son n 1 a 4 y los problemas n 5, 6 y
#    7; la `fuente` de cada ejercicio dice el nombre impreso.
#
# 6. **NADA SE PARTE.** Cada pregunta es un ejercicio. El problema 2 toca
#    los temas 3, 4 y 6, pero empieza en las galgas y va entero en el 3.
#
# 7. **EL EUSKERA NO DICE OTRA COSA** en ninguna pregunta: mismos datos,
#    mismos apartados y mismas figuras. Solo difiere la fecha equivocada de
#    la cabecera de teoría (punto 1).
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso y de un segundo camino (fase-p/p2f,
# guiones/cifras.mjs). Las cuestiones 2 y 4 piden deducir y no traen
# números: los pasos de cálculo de las dos son ejemplos nuestros, y lo
# dicen. Ninguna de las siete es copia literal de una pregunta ya resuelta
# en los parciales publicados; el tensor del problema 1 es el que el parcial
# de 2018-2019 usa de ejemplo en su cuestión 1.
pdf: 2017-2018-1par.pdf
puntosImpresos:
  fuente: Cabecera de cada pregunta, «(1p)» en la teoría y «(2p)» o «(2 p)» en los ejercicios, págs. 1-3 del cuadernillo.
  reparto:
    - { n: 1, puntos: 1 }
    - { n: 2, puntos: 1 }
    - { n: 3, puntos: 1 }
    - { n: 4, puntos: 1 }
    - { n: 5, puntos: 2 }
    - { n: 6, puntos: 2 }
    - { n: 7, puntos: 2 }

