      <figcaption>

      Redibujada del PDF del examen. Como en el original, no está a escala:
      el prisma mide a en x y 5a en y. De los cuatro cables se ven dos; los
      otros dos quedan detrás.

      </figcaption>
      </figure>

      **Notas nuestras.** Los cables unen las dos placas, así que miden lo
      mismo que el prisma en $y$, $5a$. Por la simetría, los cuatro llevan la
      misma tensión $\sigma_0$, positiva si tiran. El enunciado pide todo en
      función de $p$ y $E$; la variación de volumen necesita además la
      dimensión $a$.
    pide: >-
      a) La tensión σ0 de los cables. b) Las tensiones principales del
      prisma, σx, σy y σz. c) La variación de volumen del prisma. Todo en
      función de p, E y a.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de plantear nada: ¿qué tensión normal hay en las caras de B
          perpendiculares a $z$?
        opciones:
          - texto: >-
              Ninguna, $\sigma_z = 0$: esas caras no tocan las placas ni
              reciben la presión
            correcta: true
            mensaje: |
              Eso es. Las placas aprietan a B en $y$ y la presión actúa solo
              en $x$; en $z$ B está libre. Que no haya tensión no quiere decir
              que no se deforme: en $z$ se alarga, por Poisson.
          - texto: >-
              La misma que en $y$: la base es cuadrada, y por simetría
              $\sigma_z = \sigma_y$
            mensaje: |
              «Base cuadrada» solo dice que B mide $a$ en $x$ y en $z$. La
              simetría que haría $\sigma_z = \sigma_y$ es la de las cargas, y
              aquí no la hay: las placas empujan en $y$ y nada empuja en $z$.
          - texto: >-
              $\sigma_z = \nu\,\sigma_x = -0{,}1\,p$, la que hace falta para
              que B no se deforme en $z$
            mensaje: |
              Esa es la tensión de una cara con el movimiento impedido
              ($\varepsilon_z = 0$). Aquí nada lo impide: la cara está libre,
              y lo que es nulo es $\sigma_z$, no $\varepsilon_z$.
          - texto: >-
              $\sigma_z = -p$: la presión actúa en todas las caras laterales
            mensaje: |
              El enunciado la aplica solo en las caras perpendiculares a $x$,
              y la figura la dibuja solo en esas dos.
      - tipo: calcular
        titulo: La tensión de los cables
        pregunta: |
          ¿Cuánto vale $\sigma_0$, la tensión en cada cable, en unidades de $p$?
        respuesta:
          tipo: numero
          valor: '0.9091'
          tolerancia: 0.001
          formato: un número, en unidades de p
        distractores:
          - valor: '0.9524'
            mensaje: |
              Has equilibrado la placa con los dos cables de la figura. Son
              cuatro, situados simétricamente, y la figura solo enseña dos:
              $\sigma_y\,a^{2} = -4\,\sigma_0 A$.
          - valor: '0.9804'
            mensaje: |
              Has tomado como área de la cara que toca la placa $a\cdot5a$. La
              cara perpendicular a $y$ mide $a$ en $x$ y $a$ en $z$: su área es
              $a^{2}$. Si has equilibrado la placa con un solo cable, sale
              0,9756, aquí al lado: son cuatro,
              $\sigma_y\,a^{2} = -4\,\sigma_0A$.
          - valor: '0.0990'
            mensaje: |
              Has dado a los cables el módulo de B, $E$. El enunciado les da
              $10E$: con él, cada cable es diez veces más rígido y se lleva
              mucha más tensión.
        pista: |
          Dos ecuaciones con dos incógnitas, $\sigma_0$ y $\sigma_y$: el
          equilibrio de una placa y la compatibilidad, porque las placas son
          rígidas y B y los cables se alargan lo mismo en $y$.
        desarrollo: |
          Equilibrio de la placa de arriba: B la empuja hacia arriba y los
          cuatro cables tiran hacia abajo,
          $\sigma_y\,a^{2} = -4\,\sigma_0\,a^{2}/400$, así que
          $\sigma_y = -\sigma_0/100$. Compatibilidad, con $\sigma_x = -p$ y
          $\sigma_z = 0$:

          $$
          \frac{\sigma_0}{10E} = \frac{\sigma_y - \nu\,(\sigma_x + \sigma_z)}{E} = \frac{-\sigma_0/100 + 0{,}1\,p}{E}
          $$

          de donde $\sigma_0\,(0{,}1 + 0{,}01) = 0{,}1\,p$:

          $$
          \sigma_0 = \frac{10}{11}\,p, \qquad \frac{10}{11} \approx 0{,}9091
          $$
      - tipo: calcular
        titulo: La tensión del prisma en y
        pregunta: |
          ¿Cuánto vale $\sigma_y$ en el prisma, con su signo, en unidades de
          $p$?
        respuesta:
          tipo: numero
          valor: '-0.00909'
          tolerancia: 0.0001
          formato: un número con su signo, en unidades de p
        distractores:
          - valor: '-0.1'
            mensaje: |
              Es la tensión con unos cables que no se estiran nada:
              $\varepsilon_y = 0$ da $\sigma_y = \nu\,\sigma_x = -0{,}1\,p$. Los
              cables se alargan con B, así que B queda mucho menos comprimido.
          - valor: '-0.00196'
            mensaje: |
              Has repartido la fuerza de los cables en una cara de $a\cdot5a$.
              La que toca la placa es la perpendicular a $y$, de área $a^{2}$:
              $\sigma_y = -4\,\sigma_0 A/a^{2}$.
        pista: |
          Del equilibrio de la placa, $\sigma_y = -4\,\sigma_0 A/a^{2}$.
        desarrollo: |
          $$
          \sigma_y = -\frac{\sigma_0}{100} = -\frac{p}{110}, \qquad -\frac{1}{110} \approx -0{,}00909
          $$

          Es pequeña porque el área de los cuatro cables es la centésima parte
          de la cara de B: la tensión de los cables es grande y la fuerza,
          poca.
      - tipo: calcular
        titulo: La variación de volumen
        pregunta: |
          ¿Cuánto vale la variación de volumen del prisma, $\Delta V$, con su
          signo, en unidades de $pa^{3}/E$?
        respuesta:
          tipo: numero
          valor: '-4.036'
          tolerancia: 0.005
          formato: un número con su signo, en unidades de p·a³/E
        distractores:
          - valor: '-0.8073'
            mensaje: |
              Es la variación unitaria, $e = \Delta V/V$, o el volumen tomado
              como $a^{3}$. B mide $a \times 5a \times a$: $V = 5a^{3}$, y
              $\Delta V = 5a^{3}\,e$.
          - valor: '-4.541'
            mensaje: |
              Has tomado $\varepsilon_z = 0$ porque $\sigma_z = 0$. Una cara
              libre no tiene tensión, pero se deforma: por Poisson,
              $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E = 0{,}1009\,p/E$, y
              B se hincha en $z$.
          - valor: '-5.045'
            mensaje: |
              Te falta el factor $1 - 2\nu$: $e = (1 - 2\nu)\,(\sigma_x + \sigma_y + \sigma_z)/E$
              (ec. 4.8), no la suma de tensiones dividida por $E$. Lo que una
              tensión acorta en su dirección lo devuelve en parte el efecto
              Poisson en las otras dos.
        pista: |
          $e = \varepsilon_x + \varepsilon_y + \varepsilon_z = \dfrac{1 - 2\nu}{E}\,(\sigma_x + \sigma_y + \sigma_z)$
          (ec. 4.8), y $\Delta V = e\,V$.
        desarrollo: |
          $$
          e = \frac{1 - 2\cdot0{,}1}{E}\left(-p - \frac{p}{110} + 0\right) = -0{,}8\cdot\frac{111}{110}\,\frac{p}{E} \approx -0{,}8073\,\frac{p}{E}
          $$

          y con $V = a\cdot5a\cdot a = 5a^{3}$:

          $$
          \Delta V = 5a^{3}\,e = -\frac{222}{55}\,\frac{pa^{3}}{E}, \qquad -\frac{222}{55} \approx -4{,}036
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La presión comprime B en $x$, $\sigma_x = -p$; en $z$ está libre,
              $\sigma_z = 0$; en $y$ lo aprietan las placas.
          - texto: >-
              Equilibrio de una placa: $\sigma_y\,a^{2} = -4\,\sigma_0 A$, así
              que $\sigma_y = -\sigma_0/100$.
          - texto: >-
              Compatibilidad: B y los cables miden $5a$ y se alargan lo mismo,
              $\varepsilon_y = \sigma_0/(10E)$; con Hooke en $y$,
              $\sigma_0 = 10p/11$ y $\sigma_y = -p/110$.
          - texto: >-
              Las tres tensiones son principales, porque las caras de B no
              tienen tangenciales: $\sigma_x = -p$, $\sigma_y = -p/110$,
              $\sigma_z = 0$.
          - texto: >-
              $e = (1 - 2\nu)(\sigma_x + \sigma_y + \sigma_z)/E = -0{,}8073\,p/E$,
              y con $V = 5a^{3}$, $\Delta V = -4{,}036\,pa^{3}/E$.
          - texto: >-
              Como $\sigma_z = 0$, B no se deforma en $z$, y el volumen solo
              cambia por $\varepsilon_x$ y $\varepsilon_y$.
            trampa: true
            mensaje: |
              Sin tensión no quiere decir sin deformación. Por Poisson, la
              compresión en $x$ y en $y$ alarga B en $z$:
              $\varepsilon_z = 0{,}1009\,p/E$. Olvidarla da
              $\Delta V = -4{,}541\,pa^{3}/E$.
    resolucion: |
      **Por qué trabajan los cables.** La presión comprime B en $x$:
      $\sigma_x = -p$. Por Poisson, B quiere alargarse en $y$ y en $z$. En
      $z$ nada se lo impide (esas caras están libres, $\sigma_z = 0$); en
      $y$, las placas son rígidas y están unidas por los cables: si B se
      alarga, los cables se estiran lo mismo, tiran de las placas y éstas
      comprimen a B. Hay dos incógnitas, $\sigma_0$ y $\sigma_y$, y dos
      ecuaciones.

      **Equilibrio** de la placa de arriba, con los cuatro cables:

      $$
      \sigma_y\,a^{2} + 4\,\sigma_0\,\frac{a^{2}}{400} = 0
      \;\Longrightarrow\; \sigma_y = -\frac{\sigma_0}{100}
      $$

      **Compatibilidad.** B y los cables miden $5a$ y se alargan lo mismo,
      así que tienen la misma $\varepsilon_y$. Con la ley de Hooke
      generalizada (apuntes del tema 4, ec. 4.2) y $\sigma_z = 0$:

      $$
      \frac{\sigma_0}{10E} = \frac{1}{E}\left[\sigma_y - \nu\,(\sigma_x + \sigma_z)\right] = \frac{1}{E}\left[-\frac{\sigma_0}{100} + 0{,}1\,p\right]
      $$

      **a/ La tensión en los cables:**

      $$
      \sigma_0\left(\frac{1}{10} + \frac{1}{100}\right) = \frac{p}{10}
      \;\Longrightarrow\; \sigma_0 = \frac{10}{11}\,p \approx 0{,}909\,p
      $$

      de tracción.

      **b/ Las tensiones principales.** Las caras de B no tienen tensiones
      tangenciales (la presión y las placas solo empujan en normal), así que
      $x$, $y$ y $z$ son direcciones principales:

      $$
      \sigma_x = -p, \qquad \sigma_y = -\frac{p}{110} \approx -0{,}00909\,p, \qquad \sigma_z = 0
      $$

      Ordenadas, $\sigma_1 = \sigma_z = 0$, $\sigma_2 = \sigma_y = -p/110$ y
      $\sigma_3 = \sigma_x = -p$.

      **c/ La variación de volumen.** Las tres deformaciones, por la ec. 4.2:

      $$
      \varepsilon_x = \frac{-p + 0{,}1\,p/110}{E} \approx -0{,}9991\,\frac{p}{E},\qquad
      \varepsilon_y = \frac{\sigma_0}{10E} = \frac{p}{11E} \approx 0{,}0909\,\frac{p}{E},\qquad
      \varepsilon_z = \frac{0{,}1\,(p + p/110)}{E} \approx 0{,}1009\,\frac{p}{E}
      $$

      Su suma es la variación unitaria de volumen, la misma que da la ec.
      4.8 de una vez:

      $$
      e = \frac{1 - 2\nu}{E}\,(\sigma_x + \sigma_y + \sigma_z) = -0{,}8\cdot\frac{111}{110}\,\frac{p}{E} \approx -0{,}8073\,\frac{p}{E}
      $$

      y con $V = a\cdot5a\cdot a = 5a^{3}$:

      $$
      \Delta V = e\,V = -\frac{222}{55}\,\frac{pa^{3}}{E} \approx -4{,}036\,\frac{pa^{3}}{E}
      $$

      El prisma pierde volumen: lo que la presión le quita en $x$ no lo
      recupera con lo que se hincha en $y$ y en $z$.

      **Comprobaciones.** El motor del curso (Hooke generalizada,
      alargamiento de una barra y variación de volumen) da las mismas
      cifras. Por otro camino: B, en $y$, es un muelle de rigidez
      $k_B = E a^{2}/(5a)$ y los cuatro cables, uno de
      $k_c = 4\cdot10E\,(a^{2}/400)/(5a)$, en serie; sin cables B se
      alargaría $\delta_0 = 0{,}1\,(p/E)\cdot5a$, y la fuerza entre placas,
      $\delta_0/(1/k_B + 1/k_c) = pa^{2}/110$, da $\sigma_0 = 10p/11$ y
      $\sigma_y = -p/110$. El volumen sale igual con el módulo volumétrico
      (ecs. 4.14 a 4.16) y multiplicando las tres dimensiones deformadas.

  # ── Problema 2 · las cuatro barras iguales con P vertical en C.
  - id: exerm1213-1par-5-las-cuatro-barras-iguales-con-p-en-c
    titulo: Cuatro barras iguales articuladas en A y D, y el desplazamiento del nudo cargado
    fuente: >-
      Ejercicio 2 · Primer parcial de 2012-2013 (hoja de ejercicios del 26 de
      octubre de 2012) · Elasticidad y Resistencia de Materiales, Escuela
      Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 1,5 puntos.
      La misma estructura, con la fuerza en horizontal, es el ejercicio 1 del
      examen final de plan viejo de 2012-2013. El examen no publica
      resolución; el desarrollo es nuestro y sigue los apuntes del tema 8
      (ecs. 8.9 a 8.12, págs. 7 y 8).
    nivel: examen
    enunciado: |
      2.-(1,5p) Las barras AB(1), BC(2), BD(3) y CD(4) son del mismo
      material, longitud y sección. La longitud es $L$, el área de la sección
      $A$ y el módulo elástico $E$. Se aplica una fuerza vertical $P$ en el
      nudo C. Determinar:

      a/ Fuerzas en las barras en función de $P$.

      b/ Componentes horizontal y vertical del desplazamiento de C, en
      función de $P$, $L$, $E$, $A$.

