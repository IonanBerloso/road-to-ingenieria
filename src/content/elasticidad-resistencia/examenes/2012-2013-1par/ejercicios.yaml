      <text x="304" y="128" font-size="12" fill="var(--ink)" text-anchor="middle">alargamientos (ε)</text>
      <text x="304" y="144" font-size="11" fill="var(--faint)" text-anchor="middle">cambia el volumen</text>
      <text x="424" y="128" font-size="12" fill="var(--ink)" text-anchor="middle">distorsión (γ)</text>
