      **Notas nuestras.** A y D están articulados al suelo; B y C son nudos
      articulados. Como las cuatro barras miden $L$ y AB forma 60° con el
      suelo, ABD y BCD son triángulos equiláteros. Tracción positiva.
    pide: >-
      a) Los esfuerzos de las cuatro barras, en función de P. b) Las
      componentes horizontal y vertical del desplazamiento de C, en función
      de P, L, E y A.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por dónde conviene empezar a calcular los esfuerzos?
        opciones:
          - texto: >-
              Por el nudo C: solo llegan dos barras, la 2 y la 4, y sus dos
              ecuaciones de equilibrio las dan
            correcta: true
            mensaje: |
              Eso es. Un nudo con dos incógnitas se resuelve solo. Con $N_2$
              conocido, el nudo B queda con dos incógnitas, $N_1$ y $N_3$, y
              la estructura está resuelta sin tocar las reacciones.
          - texto: >-
              Por el nudo B, que es el que une más barras
            mensaje: |
              En B hay tres incógnitas, $N_1$, $N_2$ y $N_3$, y solo dos
              ecuaciones. Hay que llegar a él con una de ellas ya conocida, y
              la que se conoce primero es $N_2$, del nudo C.
          - texto: >-
              Por las reacciones, con el equilibrio de toda la estructura
            mensaje: |
              A y D son articulaciones fijas: cuatro componentes de reacción y
              tres ecuaciones globales. No salen todas, y además no hacen
              falta: el nudo C da directamente dos esfuerzos.
          - texto: >-
              Por la compatibilidad: con dos apoyos fijos es hiperestática
            mensaje: |
              Cuenta incógnitas y ecuaciones: cuatro esfuerzos y cuatro
              componentes de reacción son ocho incógnitas, y los cuatro nudos
              dan ocho ecuaciones. Es isostática: el equilibrio basta.
      - tipo: calcular
        titulo: El esfuerzo de la barra CD
        pregunta: |
          ¿Cuánto vale $N_4$, el esfuerzo de la barra CD, con su signo
          (tracción positiva), en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '-1.1547'
          tolerancia: 0.001
          formato: un número con su signo, en unidades de P
        distractores:
          - valor: '1.1547'
            mensaje: |
              El valor es ese y el signo no. P tira de C hacia abajo y la única
              barra que puede sostenerlo en vertical es la 4, que va de C hacia
              abajo, a D: lo empuja hacia arriba, así que está comprimida.
          - valor: '-2'
            mensaje: |
              Has proyectado con el coseno de 60°. La barra 4 forma 60° con la
              horizontal: su componente vertical es $N_4\sin60^{\circ}$, y es
              la que equilibra a P.
          - valor: '-1'
            mensaje: |
              Es lo que haría una barra vertical bajo C. La 4 está inclinada
              60°: para dar una componente vertical $P$ necesita un esfuerzo
              mayor, $P/\sin60^{\circ}$.
        pista: |
          Equilibrio vertical del nudo C: la barra 2 es horizontal y no
          aporta; solo la 4.
        desarrollo: |
          La barra 4 va de C a D, hacia abajo y a la izquierda, a 60° de la
          horizontal. En vertical:

          $$
          -N_4\sin60^{\circ} - P = 0 \;\Longrightarrow\; N_4 = -\frac{2P}{\sqrt3}, \qquad -\frac{2}{\sqrt3} \approx -1{,}1547
          $$

          y en horizontal, $-N_2 - N_4\cos60^{\circ} = 0$, así que
          $N_2 = P/\sqrt3$, de tracción.
      - tipo: calcular
        titulo: El esfuerzo de la barra AB
        pregunta: |
          ¿Cuánto vale $N_1$, el esfuerzo de la barra AB, con su signo, en
          unidades de $P$?
        respuesta:
          tipo: numero
          valor: '0.5774'
          tolerancia: 0.001
          formato: un número con su signo, en unidades de P
        distractores:
          - valor: '-0.5774'
            mensaje: |
              Has puesto la barra 2 empujando a B en vez de tirando de él. Está
              a tracción, $N_2 = P/\sqrt3$: tira de B hacia C, a la derecha, y
              las barras 1 y 3 tienen que equilibrarlo hacia la izquierda.
          - valor: '0'
            mensaje: |
              Sin la barra 2, el nudo B no tendría carga y las barras 1 y 3
              valdrían cero. Pero la 2 está a tracción y tira de B: hay que
              meterla en su equilibrio.
        pista: |
          Nudo B, con $N_2 = P/\sqrt3$ conocido: en vertical solo entran la 1 y
          la 3, simétricas respecto de la vertical de B.
        desarrollo: |
          En vertical, $-N_1\sin60^{\circ} - N_3\sin60^{\circ} = 0$: $N_3 = -N_1$.
          En horizontal, $-N_1\cos60^{\circ} + N_2 + N_3\cos60^{\circ} = 0$,
          es decir, $N_2 = N_1$:

          $$
          N_1 = \frac{P}{\sqrt3}, \qquad N_3 = -\frac{P}{\sqrt3}, \qquad \frac{1}{\sqrt3} \approx 0{,}5774
          $$
      - tipo: calcular
        titulo: El desplazamiento horizontal de C
        pregunta: |
          ¿Cuánto vale el desplazamiento horizontal de C, positivo hacia la
          derecha, en unidades de $PL/(EA)$?
        respuesta:
          tipo: numero
          valor: '1.7321'
          tolerancia: 0.002
          formato: un número con su signo, en unidades de PL/(EA)
        distractores:
          - valor: '-1.7321'
            mensaje: |
              El valor es ese y el sentido no. B se va a la derecha (la barra 1
              se alarga y la 3 se acorta) y la barra 2, a tracción, se alarga:
              C se va más a la derecha todavía.
          - valor: '0.5774'
            mensaje: |
              Es solo el alargamiento de la barra 2, como si B no se moviera.
              B se desplaza $2\,PL/(\sqrt3EA)$ a la derecha, y C lo arrastra.
          - valor: '1.1547'
            mensaje: |
              Es el desplazamiento de B, $2\,PL/(\sqrt3EA)$. Falta lo que se
              alarga la barra 2 entre B y C.
        pista: |
          Primero B, con A y D fijos: las barras 1 y 3 dan dos ecuaciones,
          $\Delta L_1 = \tfrac12u_B + \tfrac{\sqrt3}{2}v_B$ y
          $\Delta L_3 = -\tfrac12u_B + \tfrac{\sqrt3}{2}v_B$. Después, la
          barra 2 es horizontal: $u_C = u_B + \Delta L_2$.
        desarrollo: |
          Con $\delta = PL/(\sqrt3EA)$, los alargamientos son
          $\Delta L_1 = \Delta L_2 = \delta$, $\Delta L_3 = -\delta$ y
          $\Delta L_4 = -2\delta$. Las dos ecuaciones de B dan $v_B = 0$ y
          $u_B = 2\delta$, y

          $$
          u_C = u_B + \Delta L_2 = 3\delta = \sqrt3\,\frac{PL}{EA}, \qquad \sqrt3 \approx 1{,}7321
          $$
      - tipo: calcular
        titulo: Cuánto baja C
        pregunta: |
          ¿Cuánto baja el nudo C, en unidades de $PL/(EA)$?
        respuesta:
          tipo: numero
          valor: '2.3333'
          tolerancia: 0.002
          formato: un número (positivo si baja), en unidades de PL/(EA)
        distractores:
          - valor: '-2.3333'
            mensaje: |
              El valor es ese y el sentido no: la barra 4 se acorta y C, que se
              apoya en ella, baja.
          - valor: '1.3333'
            mensaje: |
              Has proyectado sobre la barra 4 solo el desplazamiento vertical,
              como si C no se moviera en horizontal. La proyección de $u_C$
              sobre la barra entra también:
              $\tfrac12u_C + \tfrac{\sqrt3}{2}v_C = \Delta L_4$.
          - valor: '0.3333'
            mensaje: |
              Has metido $u_C$ hacia la izquierda en la proyección sobre la
              barra 4. C se va a la derecha, $\sqrt3\,PL/(EA)$, y eso, en la
              dirección de D a C, ya es un alargamiento que hay que compensar
              bajando más.
        pista: |
          La barra 4 va de D a C con dirección $(\tfrac12,\ \tfrac{\sqrt3}{2})$
          y D no se mueve: $\tfrac12u_C + \tfrac{\sqrt3}{2}v_C = \Delta L_4$
          (ec. 8.12), con $v$ positivo hacia arriba.
        desarrollo: |
          $$
          \frac{\sqrt3}{2}\,v_C = -2\delta - \frac12\cdot3\delta = -\frac72\,\delta
          \;\Longrightarrow\; v_C = -\frac{7}{\sqrt3}\,\delta = -\frac73\,\frac{PL}{EA}
          $$

          C baja $\tfrac73\,PL/(EA)$, y $\tfrac73 \approx 2{,}3333$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Nudo C, con dos barras: $N_4 = -2P/\sqrt3$ (compresión) y
              $N_2 = P/\sqrt3$ (tracción).
          - texto: >-
              Nudo B, con $N_2$ conocido: $N_1 = P/\sqrt3$ y $N_3 = -P/\sqrt3$.
          - texto: >-
              Alargamientos $\Delta L_i = N_iL/(EA)$: $\delta$, $\delta$,
              $-\delta$ y $-2\delta$, con $\delta = PL/(\sqrt3EA)$.
          - texto: >-
              B, con A y D fijos: $v_B = 0$ y $u_B = 2\delta$.
          - texto: >-
              C: $u_C = u_B + \Delta L_2 = \sqrt3\,PL/(EA)$, y la barra 4 da
              $v_C = -\tfrac73\,PL/(EA)$.
          - texto: >-
              Como P es vertical, C solo se mueve en vertical: $u_C = 0$.
            trampa: true
            mensaje: |
              La dirección de la carga no fija la del desplazamiento. B se va
              a la derecha porque la barra 1 se alarga y la 3 se acorta, y la
              2 se alarga: C se va $\sqrt3\,PL/(EA)$ a la derecha.
    resolucion: |
      **La geometría.** Con A en el origen, $x$ a la derecha e $y$ hacia
      arriba: D = $(L,\ 0)$, B = $(L/2,\ \sqrt3L/2)$ y
      C = $(3L/2,\ \sqrt3L/2)$. Las barras 1, 3 y 4 forman 60° con la
      horizontal y la 2 es horizontal. Cuatro barras y cuatro componentes
      de reacción frente a ocho ecuaciones de cuatro nudos: es isostática.

      **a/ Los esfuerzos**, nudo a nudo, empezando por el que solo tiene dos
      barras. Nudo C:

      $$
      \text{vertical: } -N_4\sin60^{\circ} - P = 0 \;\Rightarrow\; N_4 = -\frac{2P}{\sqrt3} \approx -1{,}155\,P
      $$

      $$
      \text{horizontal: } -N_2 - N_4\cos60^{\circ} = 0 \;\Rightarrow\; N_2 = \frac{P}{\sqrt3} \approx 0{,}577\,P
      $$

      Nudo B: en vertical, $N_3 = -N_1$; en horizontal,
      $-N_1\cos60^{\circ} + N_2 + N_3\cos60^{\circ} = 0$, así que
      $N_1 = N_2$:

      $$
      N_1 = \frac{P}{\sqrt3}, \qquad N_2 = \frac{P}{\sqrt3}, \qquad N_3 = -\frac{P}{\sqrt3}, \qquad N_4 = -\frac{2P}{\sqrt3}
      $$

      Las barras 1 y 2 trabajan a tracción y la 3 y la 4 a compresión. Las
      reacciones salen de los nudos A y D: en A, $P/2$ hacia abajo; en D,
      $3P/2$ hacia arriba (y dos horizontales iguales y opuestas,
      $P/(2\sqrt3)$): suman $P$ y su momento respecto de D equilibra el de P.

      **b/ El desplazamiento de C.** Cada barra se alarga
      $\Delta L_i = N_iL/(EA)$ (ec. 8.9). Con $\delta = PL/(\sqrt3EA)$:

      $$
      \Delta L_1 = \delta, \qquad \Delta L_2 = \delta, \qquad \Delta L_3 = -\delta, \qquad \Delta L_4 = -2\delta
      $$

      Los desplazamientos son pequeños, así que el alargamiento de una barra
      es la proyección, sobre su dirección, del desplazamiento de un extremo
      respecto del otro (ecs. 8.10 a 8.12). Con $u$ a la derecha y $v$ hacia
      arriba, y A y D fijos:

      $$
      \Delta L_1 = \tfrac12u_B + \tfrac{\sqrt3}{2}v_B = \delta, \qquad \Delta L_3 = -\tfrac12u_B + \tfrac{\sqrt3}{2}v_B = -\delta
      $$

      que dan $v_B = 0$ y $u_B = 2\delta$: B se mueve solo en horizontal,
      hacia la derecha. La barra 2 es horizontal, así que

      $$
      u_C = u_B + \Delta L_2 = 3\delta = \sqrt3\,\frac{PL}{EA} \approx 1{,}732\,\frac{PL}{EA}
      $$

      y la barra 4, de D a C con dirección $(\tfrac12,\ \tfrac{\sqrt3}{2})$:

      $$
      \tfrac12u_C + \tfrac{\sqrt3}{2}v_C = -2\delta \;\Longrightarrow\; v_C = -\frac{7}{\sqrt3}\,\delta = -\frac73\,\frac{PL}{EA} \approx -2{,}333\,\frac{PL}{EA}
      $$

      C se desplaza $\sqrt3\,PL/(EA)$ hacia la derecha y baja
      $\tfrac73\,PL/(EA)$.

      **Comprobaciones.** El motor del curso (estructura de barras
      articuladas, con B y C como nudos y A y D fijos) da los mismos cuatro
      esfuerzos y el mismo desplazamiento de C. Por otro camino, el
      equilibrio de los dos nudos resuelto como un sistema lineal da los
      esfuerzos, y el trabajo virtual, con una carga unidad en C en
      horizontal y otra en vertical, $\sum N_i\,n_i\,L/(EA)$, da
      $u_C = \sqrt3\,PL/(EA)$ y un descenso de $\tfrac73\,PL/(EA)$.

  # ── Problema 3 · la viga apoyada con voladizo y la sección en L de alas iguales.
  - id: exerm1213-1par-6-la-viga-con-voladizo-y-seccion-en-l
    titulo: Una viga apoyada con voladizo, sus diagramas, y el espesor de una sección en L de alas iguales
    fuente: >-
      Ejercicio 3 · Primer parcial de 2012-2013 (hoja de ejercicios del 26 de
      octubre de 2012) · Elasticidad y Resistencia de Materiales, Escuela
      Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 3 puntos. El
      examen no publica resolución; el desarrollo es nuestro y sigue los
      apuntes del tema 7 (los diagramas, ecs. 7.14 a 7.17, págs. 12 y 13) y
      del tema 9 (flexión pura, ecs. 9.1 a 9.13, págs. 4 a 8, y los ejes
      principales, ecs. 9.19 a 9.25, págs. 10 a 12).
    nivel: examen
    enunciado: |
      3.-(3p) La viga simplemente apoyada soporta cargas distribuidas en los
      tramos BC y DE. La dirección de aplicación de carga es $y$. La sección
      se muestra en la figura, siendo $t$ su espesor.

      a/ Dibujar los diagramas de fuerzas cortantes y de momentos flectores
      en función de $q_0$ y $a$.

