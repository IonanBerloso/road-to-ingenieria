      **Notas nuestras.** A es un apoyo móvil (los dos rodillos) y D, uno
      fijo; de D a E la viga vuela. Las dos cotas 10$t$ son el ancho y el
      alto totales de la L, hasta las caras exteriores, como marcan sus
      líneas de referencia, y las dos alas tienen espesor $t$. El examen
      llama $\sigma_{on}$ a la tensión admisible y da un solo valor, que vale
      a tracción y a compresión. Los kg son kilogramos fuerza.
    pide: >-
      a) Los diagramas de cortantes y de flectores, con sus valores en A, B,
      C, D y E y el flector máximo positivo. b) El espesor t de la sección,
      en cm.
    pasos:
      - tipo: reconocer
        pregunta: |
          La carga va según $y$, así que la sección trabaja con un solo
          flector, $M_z$. ¿Se puede calcular la tensión con
          $\sigma_x = M_z\,y/I_z$?
        opciones:
          - texto: >-
              No: $y$ y $z$ no son ejes principales de esta L, porque
              $I_{yz} \ne 0$; el eje neutro no es $z$ y hay que usar la
              fórmula general o pasar a los ejes principales
            correcta: true
            mensaje: |
              Eso es. $\sigma_x = M_z\,y/I_z$ (ec. 9.23) vale cuando $y$, $z$
              son principales. La L de alas iguales es simétrica respecto de
              la bisectriz de su esquina: los principales son esa bisectriz y
              su perpendicular, a 45° de $y$ y de $z$.
          - texto: >-
              Sí: $y$ y $z$ pasan por G, y eso es lo único que hace falta
            mensaje: |
              El eje neutro pasa por G porque el axil es nulo, no por cómo se
              elijan los ejes; y pasar por G no lo orienta. Para que sea $z$
              con solo $M_z$ hace falta además $I_{yz} = 0$, y en la L no lo
              es: las dos alas quedan en cuadrantes de $yz$ del mismo
              signo.
          - texto: >-
              Sí: las alas son iguales, así que $I_y = I_z$ y da lo mismo un
              eje que otro
            mensaje: |
              $I_y = I_z$ no basta. Con $I_y = I_z$ todos los ejes por G
              serían principales solo si además $I_{yz} = 0$ (el círculo de
              Mohr de inercias sería un punto). Aquí el círculo tiene radio
              $|I_{yz}|$ y los principales son los de 45°.
          - texto: >-
              Sí, pero con $y$ medida desde la esquina exterior de la L
            mensaje: |
              El eje neutro de la flexión pura pasa por G (ec. 9.4), y $y$ se
              mide desde G. El problema no es el origen, sino la orientación:
              $y$, $z$ no son principales.
      - tipo: calcular
        titulo: La reacción en A
        pregunta: |
          ¿Cuánto vale la reacción del apoyo A, en unidades de $q_0a$?
        respuesta:
          tipo: numero
          valor: '0.3333'
          tolerancia: 0.0005
          formato: un número (la reacción dividida por q0·a)
        distractores:
          - valor: '0.5'
            mensaje: |
              Es la reacción con solo la carga de BC, que está en el centro
              del vano AD y se reparte por mitades. Pero la viga no acaba en
              D: la carga del voladizo DE la hace bascular sobre D y descarga
              A.
          - valor: '0.6667'
            mensaje: |
              Has sumado el momento de la carga del voladizo al de la de BC.
              Respecto de D están a lados opuestos: la de BC hace girar la
              viga hacia A y la de DE hacia el otro lado. Se restan.
          - valor: '1'
            mensaje: |
              Es la mitad de la carga total, $2q_0a$, como si las dos
              reacciones fueran iguales. Ni la carga es simétrica ni los
              apoyos están en los extremos.
        pista: |
          Momentos respecto de D. La carga de BC, $q_0a$, está a $1{,}5a$ de
          D, a su izquierda; la de DE, $q_0a$, a $0{,}5a$, a su derecha.
        desarrollo: |
          $$
          R_A\cdot3a = q_0a\cdot1{,}5a - q_0a\cdot0{,}5a = q_0a^{2}
          \quad\Longrightarrow\quad R_A = \frac{q_0a}{3}
          $$

          y $R_D = 2q_0a - \tfrac13q_0a = \tfrac53q_0a$.
      - tipo: calcular
        titulo: El flector máximo del vano AD
        pregunta: |
          ¿Cuánto vale el mayor flector positivo de la viga, en unidades de
          $q_0a^{2}$?
        respuesta:
          tipo: numero
          valor: '0.3889'
          tolerancia: 0.0005
          formato: un número (M dividido por q0·a²)
        distractores:
          - valor: '0.375'
            mensaje: |
              Es el flector en el centro de BC, a $1{,}5a$ de A. El máximo está
              donde el cortante se anula, y el cortante, que vale
              $\tfrac13q_0a$ en B, se anula a $a/3$ de B, en $x = 4a/3$.
          - valor: '0.3333'
            mensaje: |
              Es el flector en B, $R_A\cdot a$. A la derecha de B el cortante
              todavía es positivo, así que el flector sigue creciendo hasta
              $x = 4a/3$.
          - valor: '0.625'
            mensaje: |
              Sale con $R_A = q_0a/2$, la reacción sin el voladizo. Con la
              reacción buena, $q_0a/3$, el cortante se anula antes y el
              máximo es menor.
        pista: |
          En BC, $T = \tfrac13q_0a - q_0\,(x - a)$, que se anula en
          $x = \tfrac43a$; $M = \tfrac13q_0a\,x - \tfrac12q_0\,(x - a)^{2}$.
        desarrollo: |
          $$
          M_{max} = \frac13\,q_0a\cdot\frac43\,a - \frac12\,q_0\left(\frac a3\right)^{2} = \frac{7}{18}\,q_0a^{2}, \qquad \frac{7}{18} \approx 0{,}3889
          $$
      - tipo: calcular
        titulo: El flector en el apoyo D
        pregunta: |
          ¿Cuánto vale el flector en D, con su signo, en unidades de
          $q_0a^{2}$?
        respuesta:
          tipo: numero
          valor: '-0.5'
          tolerancia: 0.0005
          formato: un número con su signo (M dividido por q0·a²)
        distractores:
          - valor: '0.5'
            mensaje: |
              El valor es ese y el signo no. El voladizo cuelga de D y se dobla
              hacia abajo: tracciona la fibra de arriba, y con el convenio del
              curso el flector es negativo.
          - valor: '-1'
            mensaje: |
              Has puesto la carga del voladizo, $q_0a$, a una distancia $a$ de
              D. Su resultante está en el centro de DE, a $a/2$.
        pista: |
          Desde E, que está libre: en D solo actúa a la derecha la carga del
          voladizo.
        desarrollo: |
          $$
          M_D = -q_0a\cdot\frac a2 = -\frac12\,q_0a^{2}
          $$

          Por la izquierda sale lo mismo:
          $R_A\cdot3a - q_0a\cdot1{,}5a = q_0a^{2} - 1{,}5\,q_0a^{2} = -0{,}5\,q_0a^{2}$.
      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de cortantes y de flectores**, alineados
          bajo la viga, con los valores en A, B, C, D y E, el punto en que se
          anula el cortante, el flector máximo y el punto en que el flector
          cambia de signo.
        comprueba:
          - punto: |
              **Cortante**: $\tfrac13q_0a$ constante de A a B; una recta de
              pendiente $-q_0$ en BC que corta el cero en $x = \tfrac43a$ y
              llega a $-\tfrac23q_0a$ en C; constante hasta D; en D salta
              $\tfrac53q_0a$, hasta $q_0a$, y baja en recta hasta cero en E.
            porque: |
              $dT/dx = -q$ (ec. 7.14): horizontal donde no hay carga y de
              pendiente $-q_0$ donde la hay. Cada fuerza concentrada, aquí las
              reacciones, es un salto de su valor. En E, extremo libre, el
              cortante es nulo.
          - punto: |
              **Flector**: cero en A; recta hasta $\tfrac13q_0a^{2}$ en B;
              parábola con su máximo, $\tfrac{7}{18}q_0a^{2}$, en
              $x = \tfrac43a$, y $\tfrac16q_0a^{2}$ en C; recta de C a D que
              corta el cero en $x = \tfrac94a$ y llega a $-\tfrac12q_0a^{2}$
              en D; parábola de D a E, que acaba en cero.
            porque: |
              $dM/dx = T$ (ec. 7.15): lineal donde el cortante es constante y
              parabólico donde la carga es uniforme, con tangente horizontal
              donde $T = 0$.
          - punto: |
              **D manda**: $|M_D| = \tfrac12q_0a^{2}$ es mayor que el máximo
              positivo; en D el flector hace un pico (el cortante salta) y en
              E llega a cero con tangente horizontal.
            porque: |
              El voladizo da el mayor flector en valor absoluto, y es el que
              se usa para dimensionar.
        figura: |
          <svg viewBox="0 0 420 310" role="img" width="420" height="310" aria-labelledby="exerm1213-1par-6-la-viga-con-voladizo-y-seccion-en-l-dib-t exerm1213-1par-6-la-viga-con-voladizo-y-seccion-en-l-dib-d">
          <title id="exerm1213-1par-6-la-viga-con-voladizo-y-seccion-en-l-dib-t">Los diagramas de cortantes y de flectores de la viga con voladizo</title>
          <desc id="exerm1213-1par-6-la-viga-con-voladizo-y-seccion-en-l-dib-d">Dos diagramas alineados con la viga, a escala, con líneas verticales en A, B, C, D y E. Cortantes: q0a/3 constante de A a B; de B a C baja en línea recta, corta el cero en x = 4a/3 y llega a −2q0a/3; constante de C a D; en D salta hacia arriba la reacción, 5q0a/3, hasta q0a, y baja en línea recta hasta cero en E. Flectores, positivos hacia arriba: cero en A, recta hasta q0a²/3 en B, parábola con su máximo, 7q0a²/18, en x = 4a/3 y q0a²/6 en C; recta de C a D que corta el cero en x = 9a/4 y llega a −q0a²/2 en D; parábola de D a E, donde vuelve a cero con tangente horizontal.</desc>
