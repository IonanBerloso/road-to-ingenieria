      - tipo: calcular
        titulo: El centro de gravedad
        pregunta: |
          ¿A qué distancia de la cara exterior del ala de arriba está G, en
          unidades de $t$?
        respuesta:
          tipo: numero
          valor: '2.868'
          tolerancia: 0.005
          formato: un número (la distancia dividida por t)
        distractores:
          - valor: '5'
            mensaje: |
              Es la mitad de la altura. G no está a media altura: el ala de
              arriba, entera a menos de $t$ de la cara, tira de él hacia
              arriba.
          - valor: '2.75'
            mensaje: |
              Has contado dos veces el cuadrado de la esquina, con las dos alas
              enteras de $10t \times t$. Una de las dos tiene que ir sin él:
              por ejemplo, el ala vertical de $t \times 9t$, con su centro a
              $5{,}5t$ de la cara de arriba.
          - valor: '7.132'
            mensaje: |
              Es la distancia desde la cara de abajo del ala vertical,
              $10t - 2{,}868t$. El paso la pide desde la cara exterior del ala
              de arriba.
        pista: |
          Dos rectángulos sin solaparse: el ala de arriba, $10t \times t$, y
          el resto del ala vertical, $t \times 9t$.
          $\overline{y} = \sum A_i\,y_i/\sum A_i$.
        desarrollo: |
          $A = 10t^{2} + 9t^{2} = 19t^{2}$ y

          $$
          \overline{y} = \frac{10\cdot0{,}5 + 9\cdot5{,}5}{19}\,t = \frac{54{,}5}{19}\,t \approx 2{,}868\,t
          $$

          Por la simetría de la L respecto de la bisectriz de su esquina, G
          está también a $2{,}868t$ de la cara exterior del ala vertical.
      - tipo: calcular
        titulo: La inercia mínima
        pregunta: |
          ¿Cuánto vale el menor momento de inercia de la sección respecto de
          un eje que pase por G, en unidades de $t^{4}$?
        respuesta:
          tipo: numero
          valor: '73.43'
          tolerancia: 0.05
          formato: un número (I dividido por t⁴)
        distractores:
          - valor: '180.0'
            mensaje: |
              Es $I_z$ (o $I_y$, que vale lo mismo). Sería la mínima si $y$,
              $z$ fueran principales, pero $I_{yz} = -106{,}6\,t^{4} \ne 0$: hay
              ejes por G con menos inercia que $z$.
          - valor: '286.6'
            mensaje: |
              Es la máxima, la del eje de simetría (la bisectriz de la
              esquina), respecto del que las puntas de las dos alas están más
              lejos. La mínima es la del eje perpendicular.
          - valor: '106.6'
            mensaje: |
              Es el radio del círculo de Mohr de inercias, $|I_{yz}|$. La
              mínima es el centro menos el radio: $180{,}0 - 106{,}6$.
        pista: |
          Con $I_y = I_z$, el círculo de Mohr de inercias tiene su centro en
          $I_z$ y su radio es $|I_{yz}|$. Calcula $I_z$ e $I_{yz}$ con los dos
          rectángulos y Steiner.
        desarrollo: |
          Con $y$ hacia abajo y $z$ a la derecha desde G (en $t^{4}$):

          $$
          I_z = \tfrac{10}{12} + 10\cdot2{,}368^{2} + \tfrac{9^{3}}{12} + 9\cdot2{,}632^{2} \approx 180{,}0
          $$

          $$
          I_{yz} = 10\,(-2{,}368)(2{,}132) + 9\,(2{,}632)(-2{,}368) \approx -106{,}6
          $$

          e $I_y = I_z$. Los principales están a 45° y

          $$
          I_{min} = I_z - |I_{yz}| \approx 73{,}43\,t^{4}, \qquad I_{max} = I_z + |I_{yz}| \approx 286{,}6\,t^{4}
          $$
      - tipo: calcular
        titulo: El eje neutro, desde el eje principal
        pregunta: |
          El eje neutro pasa por G. ¿Qué ángulo forma con el eje principal de
          inercia máxima, la bisectriz de la esquina de la L, en grados?
        respuesta:
          tipo: numero
          valor: '75.63'
          tolerancia: 0.05
          formato: un número, en grados
        distractores:
          - valor: '45'
            mensaje: |
              Es el ángulo del momento, que va según $z$, con la bisectriz. El
              eje neutro solo sigue al momento si las dos inercias principales
              son iguales; aquí $I_{max}$ es casi cuatro veces $I_{min}$, y el
              eje neutro se tuerce hacia el eje de inercia mínima.
          - valor: '30.63'
            mensaje: |
              Es el ángulo con $z$, no con el eje principal: $z$ está a 45° de
              la bisectriz, y $30{,}63^{\circ} + 45^{\circ} = 75{,}63^{\circ}$.
          - valor: '14.37'
            mensaje: |
              Es $\operatorname{arctg}(I_{min}/I_{max})$, con las inercias al
              revés, y es también el ángulo con el otro eje principal, el de
              inercia mínima. Desde la bisectriz son
              $90^{\circ} - 14{,}37^{\circ}$.
        pista: |
          En ejes principales, el eje neutro forma con el de inercia máxima un
          ángulo $\psi$ de $\operatorname{tg}\psi = (I_{max}/I_{min})\operatorname{tg}\alpha$,
          donde $\alpha$ es el ángulo del vector momento con ese mismo eje.
        desarrollo: |
          El momento va según $z$, a $\alpha = 45^{\circ}$ de la bisectriz, y

          $$
          \operatorname{tg}\psi = \frac{I_{max}}{I_{min}}\operatorname{tg}45^{\circ} = \frac{286{,}58}{73{,}42} \approx 3{,}903
          \quad\Longrightarrow\quad \psi \approx 75{,}63^{\circ}
          $$

          Desde $z$ son $75{,}63^{\circ} - 45^{\circ} = 30{,}63^{\circ}$: con
          $y$ hacia abajo, el eje sube hacia $+z$, entre $z$ y el eje de
          inercia mínima. Con los ejes $y$, $z$ sale lo mismo: $\sigma_x = 0$
          da $y = (I_{yz}/I_y)\,z \approx -0{,}5921\,z$, y
          $\operatorname{arctg}(106{,}58/180{,}00) \approx 30{,}63^{\circ}$.
      - tipo: calcular
        titulo: El espesor
        pregunta: |
          ¿Qué espesor $t$ hace que la tensión normal máxima de la viga sea
          exactamente $\sigma_{on}$, en cm?
        respuesta:
          tipo: numero
          valor: '2.742'
          tolerancia: 0.002
          formato: un número, en cm
        distractores:
          - valor: '2.512'
            mensaje: |
              Dos errores dan casi lo mismo. Con $\sigma = M\,y/I_z$ en el pie
              de la L, como si $I_{yz}$ fuera cero, sale 2,512: el eje neutro
              torcido carga más la esquina interior del pie, y sin $I_{yz}$ el
              espesor sale un 8 % menor, del lado inseguro. Con la sección
              bien pero el flector máximo positivo, $\tfrac{7}{18}q_0a^{2}$,
              sale 2,522: manda D, con $|M_D| = \tfrac12q_0a^{2}$, porque
              $\sigma_{on}$ vale igual a tracción y a compresión.
          - valor: '2.649'
            mensaje: |
              Has tomado la esquina exterior del pie. Con el eje neutro
              inclinado, la más alejada de él es la esquina interior:
              $0{,}05154$ frente a $0{,}04648$, en $|M|/t^{3}$.
          - valor: '0.5908'
            mensaje: |
              Has dejado el flector en kg·m con $\sigma_{on}$ en kg/cm². En las
              mismas unidades, $|M_D| = 8000$ kg·m $= 800\,000$ kg·cm.
        pista: |
          Manda D, con $|M| = \tfrac12q_0a^{2}$. La tensión máxima está en el
          punto más alejado del eje neutro: la esquina de abajo del ala
          vertical, en su cara interior, con $(y,\ z) = (7{,}132t,\ -1{,}868t)$
          respecto de G.
        desarrollo: |
          $$
          |\sigma_P| = \frac{180{,}00\cdot7{,}132 + 106{,}58\cdot(-1{,}868)}{21\,042{,}5}\,\frac{|M|}{t^{3}} \approx 0{,}05154\,\frac{|M|}{t^{3}}
          $$

          y con $|M_D| = 0{,}5\cdot1000\cdot4^{2}$ kg·m $= 8000$ kg·m $= 800\,000$ kg·cm:

          $$
          t^{3} = \frac{0{,}051542\cdot800\,000}{2000}\ \text{cm}^{3} \approx 20{,}62\ \text{cm}^{3}
          \quad\Longrightarrow\quad t \approx 2{,}742\ \text{cm}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Reacciones: $R_A = \tfrac13q_0a$ y $R_D = \tfrac53q_0a$. El
              flector vale $\tfrac{7}{18}q_0a^{2}$ en $x = \tfrac43a$ y
              $-\tfrac12q_0a^{2}$ en D: manda D.
          - texto: >-
              G está a $2{,}868t$ de las dos caras exteriores;
              $I_z = I_y = 180{,}0\,t^{4}$ e $I_{yz} = -106{,}6\,t^{4}$.
          - texto: >-
              La L de alas iguales es simétrica respecto de la bisectriz de su
              esquina: los principales están a 45°, con
              $I_{max} = 286{,}6\,t^{4}$ e $I_{min} = 73{,}43\,t^{4}$.
          - texto: >-
              El eje neutro pasa por G y sube $30{,}63^{\circ}$ hacia $+z$,
              entre $z$ y el eje de inercia mínima.
          - texto: >-
              La esquina más alejada del eje neutro es la interior del pie:
              $0{,}05154\,|M|/t^{3} = \sigma_{on}$ da $t = 2{,}742$ cm.
          - texto: >-
              La tensión máxima está en el punto más alejado de G: la punta del
              ala de arriba o la del ala vertical, que están a la misma
              distancia.
            trampa: true
            mensaje: |
              La tensión es proporcional a la distancia al **eje neutro**, no a
              G (ec. 9.2). La punta del ala de arriba queda cerca del eje
              neutro y trabaja poco, $0{,}0116$ y $0{,}0201\,|M|/t^{3}$ en sus
              dos esquinas; la del ala vertical sí está lejos, y de sus dos
              esquinas, la interior más.
    resolucion: |
      **a/ Las reacciones.** Cada tramo cargado tiene resultante $q_0a$ en su
      centro: la de BC a $1{,}5a$ de A y la de DE a $3{,}5a$. Momentos
      respecto de D:

      $$
      R_A\cdot3a = q_0a\cdot1{,}5a - q_0a\cdot0{,}5a
      \quad\Longrightarrow\quad R_A = \frac13\,q_0a,\qquad R_D = 2q_0a - \frac13\,q_0a = \frac53\,q_0a
      $$

      **Los esfuerzos.** Con $x$ desde A y el convenio del curso ($y$ y la
      carga hacia abajo, $dT/dx = -q$, $dM/dx = T$, $M > 0$ tracciona abajo):

      | tramo | $T(x)$ | $M(x)$ |
      |---|---|---|
      | AB, $0 \le x \le a$ | $\tfrac13q_0a$ | $\tfrac13q_0a\,x$ |
      | BC, $a \le x \le 2a$ | $\tfrac13q_0a - q_0(x - a)$ | $\tfrac13q_0a\,x - \tfrac12q_0(x - a)^{2}$ |
      | CD, $2a \le x < 3a$ | $-\tfrac23q_0a$ | $\tfrac13q_0a\,x - q_0a\,(x - 1{,}5a)$ |
      | DE, $3a < x \le 4a$ | $q_0\,(4a - x)$ | $-\tfrac12q_0\,(4a - x)^{2}$ |

      El cortante se anula en BC, en $x = \tfrac43a$, y allí el flector tiene
      su máximo positivo, $\tfrac{7}{18}q_0a^{2} \approx 0{,}389\,q_0a^{2}$.
      En C vale $\tfrac16q_0a^{2}$, cambia de signo en $x = \tfrac94a$ y en D
      llega a $-\tfrac12q_0a^{2}$: es el mayor en valor absoluto.

