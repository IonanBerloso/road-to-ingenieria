      <text x="64" y="128" font-size="12" fill="var(--ink)" text-anchor="middle">traslación</text>
      <text x="64" y="144" font-size="11" fill="var(--faint)" text-anchor="middle">no deforma</text>
      <text x="184" y="128" font-size="12" fill="var(--ink)" text-anchor="middle">giro (ω)</text>
