      <figcaption>

      La rebanada del caso plano con los esfuerzos positivos del curso:
      con y hacia abajo, los dos flectores traccionan la fibra de abajo.

      </figcaption>
      </figure>

      **Lo que dicen.** Integradas con $q = q_1x + q_0$, dan $T$ y $M$
      (ecs. 7.16 y 7.17): con carga uniforme, $T$ es lineal y $M$
      parabólico. Donde $T = 0$, $M$ tiene tangente horizontal; una fuerza
      concentrada es un salto en $T$, y un par concentrado, un salto en $M$.

      **Un ejemplo nuestro.** En un tramo con $q$ = 3 kN/m y, en
      $x = 0$, $T$ = 9 kN y $M$ = 4 kN·m: $T = 9 - 3x$, que en $x$ = 2 m
      vale 3 kN y se anula en $x$ = 3 m; allí el flector es máximo,
      $M = 4 + 9\cdot3 - 1{,}5\cdot9 = 17{,}5$ kN·m.

      **Comprobaciones.** El ejemplo se ha resuelto con el motor del curso
      como un voladizo de 5 m empotrado en su extremo derecho, con 9 kN
      hacia arriba y un par de 4 kN·m en el extremo libre y la carga de
      3 kN/m: da $T$ = 3 kN en $x$ = 2 m y el máximo, 17,5 kN·m, en
      $x$ = 3 m. El segundo camino son las ecs. 7.16 y 7.17 integradas a
      mano y, aparte, por trapecios.

  # ── Teoría · pregunta 3 · flexión pura: la distribución de tensiones normales.
  - id: exerm1213-1par-3-las-tensiones-normales-en-flexion-pura
    titulo: La distribución de tensiones normales en flexión pura, en función de los dos flectores
    fuente: >-
      Pregunta 3 de teoría · Primer parcial de 2012-2013 (hoja de teoría del
      26 de octubre de 2012) · Elasticidad y Resistencia de Materiales,
      Escuela Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 1,5
      puntos. El examen no publica resolución; el desarrollo es nuestro y
      sigue los apuntes del tema 9, apartado 9.2 (págs. 4 a 12, ecs. 9.1 a
      9.13 y 9.21 a 9.25). Los pasos de cálculo son ejemplos nuestros.
    nivel: examen
    enunciado: |
      3. (1,5p) Flexión pura. Deducir la distribución de tensiones normales en
      función de los momentos flectores.
    pide: >-
      La distribución de las tensiones normales σx en una sección sometida a
      flexión pura, deducida y escrita en función de los flectores My y Mz,
      y el eje neutro.
    pasos:
      - tipo: reconocer
        pregunta: |
          En la deducción, ¿por qué el eje neutro pasa por el centro de
          gravedad G de la sección?
        opciones:
          - texto: >-
              Porque en flexión pura el axil es nulo: $\int\sigma_x\,dA = 0$
              con $\sigma_x$ proporcional a la distancia al eje neutro obliga
              a que el momento estático respecto de él sea cero
            correcta: true
            mensaje: |
              Eso es (ecs. 9.3 y 9.4). Es una consecuencia del equilibrio, no
              una hipótesis: sale de $N = 0$ y vale para cualquier sección.
          - texto: >-
              Porque la sección es simétrica
            mensaje: |
              No hace falta ninguna simetría: el razonamiento vale para
              cualquier sección. Lo que lo fuerza es $N = 0$.
          - texto: >-
              Por la hipótesis de Navier-Bernoulli: las secciones giran
              alrededor de G
            mensaje: |
              Navier-Bernoulli dice que las secciones siguen planas y
              perpendiculares al eje, y giran alrededor de un eje, el neutro.
              Dónde está ese eje lo decide el equilibrio: $N = 0$.
          - texto: >-
              Porque los flectores se calculan respecto de ejes que pasan por G
            mensaje: |
              Eso define $M_y$ y $M_z$, pero no coloca el eje neutro. Si hubiera
              axil, el eje neutro se apartaría de G aunque los flectores se
              siguieran tomando respecto de G.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción completa, como en el examen: las hipótesis, la
          ley de las deformaciones, la de las tensiones y su relación con los
          dos flectores.
        rubrica:
          - punto: >-
              Hipótesis de Navier-Bernoulli: las secciones siguen planas y
              perpendiculares al eje y giran alrededor del eje neutro; la
              superficie neutra no se deforma y una fibra a distancia ξ de
              ella se alarga εx = ξ/ρ (ec. 9.1).
            porque: >-
              Es la hipótesis cinemática de la que sale todo, y la que hace
              lineal la distribución.
            minimo: true
          - punto: >-
              Con libertad de deformación en y y en z (σy = σz = 0) y el mismo
              módulo a tracción y a compresión, Hooke da σx = E ξ/ρ (ec. 9.2).
            porque: >-
              Pasa de deformaciones a tensiones: σx es lineal en la distancia
              al eje neutro.
            minimo: true
          - punto: >-
              N = 0 da ∫ξ dA = 0: el eje neutro pasa por G (ecs. 9.3 y 9.4).
            porque: >-
              Es la primera condición de equilibrio, y fija dónde está el eje
              neutro.
            minimo: true
          - punto: >-
              Con ξ = y cos φ + z sen φ, σx = C1 y + C2 z (ecs. 9.6 y 9.7); las
              definiciones My = ∫σx z dA y Mz = ∫σx y dA dan
              My = C1 Iyz + C2 Iy y Mz = C1 Iz + C2 Iyz (ecs. 9.8 y 9.9), de
              donde salen C1 y C2 (ec. 9.10) y σx en función de My y Mz (ec.
              9.11).
            porque: >-
              Es la distribución que pide el enunciado, para cualquier par de
              ejes por G.
            minimo: true
          - punto: >-
              El eje neutro es σx = 0 (ec. 9.13); los puntos de tensión máxima
              son los más alejados de él. En ejes principales (Iyz = 0),
              σx = Mz y/Iz + My z/Iy (ec. 9.21) y el eje neutro es
              y/z = −My Iz/(Mz Iy) (ec. 9.22).
            porque: >-
              Es como se usa: la forma simple en ejes principales y el punto
              más cargado.
      - tipo: calcular
        titulo: La tensión máxima de una sección rectangular, en un ejemplo
        pregunta: |
          Un ejemplo nuestro: una sección rectangular de 60 mm según $z$ y
          120 mm según $y$ (hacia abajo) soporta $M_z$ = 10 kN·m y
          $M_y$ = 3 kN·m, positivos con el convenio de los apuntes
          ($M_z = \int\sigma_x\,y\,dA$, $M_y = \int\sigma_x\,z\,dA$). ¿Cuánto
          vale la mayor tensión normal de tracción, en MPa?
        respuesta:
          tipo: numero
          valor: '111.1'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '69.44'
            mensaje: |
              Es solo la parte de $M_z$, $M_z\,y/I_z$ en el borde de abajo. En
              la esquina de abajo a la derecha se suma la de $M_y$, que también
              tracciona allí.
          - valor: '27.78'
            mensaje: |
              Es la esquina de abajo a la izquierda, donde la parte de $M_y$
              resta. La más traccionada es la de abajo a la derecha, con
              $y$ y $z$ positivos.
          - valor: '288.2'
            mensaje: |
              Has cambiado las inercias: $I_z = bh^{3}/12$ va con la altura
              según $y$, $120^{3}$, y es la grande. Con $M_z$ dividido por
              $I_y$ la tensión sale más del doble.
        pista: |
          Los ejes de simetría del rectángulo son principales: ec. 9.21, en la
          esquina con $y = 60$ mm y $z = 30$ mm.
        desarrollo: |
          $I_z = 60\cdot120^{3}/12 = 8{,}64\cdot10^{6}$ mm⁴ e
          $I_y = 120\cdot60^{3}/12 = 2{,}16\cdot10^{6}$ mm⁴. Con los
          momentos en N·mm, la tensión sale en MPa:

          $$
          \sigma_{max} = \frac{10\cdot10^{6}\cdot60}{8{,}64\cdot10^{6}} + \frac{3\cdot10^{6}\cdot30}{2{,}16\cdot10^{6}} \approx 69{,}44 + 41{,}67 \approx 111{,}1
          $$
      - tipo: calcular
        titulo: El eje neutro de la misma sección
        pregunta: |
          En la misma sección, ¿qué ángulo forma el eje neutro con el eje
          $z$, en grados, positivo si sube hacia $+z$?
        respuesta:
          tipo: numero
          valor: '50.19'
          tolerancia: 0.05
          formato: un número, en grados
        distractores:
          - valor: '16.70'
            mensaje: |
              Es el que tendría con $I_y = I_z$ (una sección cuadrada o
              circular), $\operatorname{tg}\beta = M_y/M_z$. Aquí $I_z$ es
              cuatro veces $I_y$, y el eje neutro se tuerce más, hacia el eje
              de inercia mínima.
          - valor: '4.29'
            mensaje: |
              Has puesto las inercias al revés en la ec. 9.22:
              $\operatorname{tg}\beta = (M_y/M_z)(I_z/I_y)$, con $I_z$ arriba.
          - valor: '-50.19'
            mensaje: |
              El valor es ese y el sentido no. $y/z = -M_yI_z/(M_zI_y)$ es
              negativo: con $y$ hacia abajo, el eje neutro sube hacia $+z$.
        pista: |
          Ec. 9.22: $\dfrac{y}{z} = -\dfrac{M_y\,I_z}{M_z\,I_y}$ sobre el eje
          neutro.
        desarrollo: |
          $$
          \frac{y}{z} = -\frac{3\cdot8{,}64}{10\cdot2{,}16} = -1{,}2
          $$

          con $y$ hacia abajo, el eje sube hacia $+z$ con
          $\operatorname{tg}\beta = 1{,}2$: $\beta \approx 50{,}19^{\circ}$.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Navier-Bernoulli: las secciones siguen planas y giran alrededor
              del eje neutro; $\varepsilon_x = \xi/\rho$.
          - texto: >-
              Con $\sigma_y = \sigma_z = 0$ y Hooke,
              $\sigma_x = E\,\xi/\rho$, lineal en la distancia al eje neutro.
          - texto: >-
              $N = 0$ da $\int\xi\,dA = 0$: el eje neutro pasa por G.
          - texto: >-
              $\sigma_x = C_1y + C_2z$; con $M_y$ y $M_z$ salen $C_1$ y $C_2$, y
              con ellos $\sigma_x$ en función de los dos flectores.
          - texto: >-
              En ejes principales, $\sigma_x = M_zy/I_z + M_yz/I_y$, y el eje
              neutro es $\sigma_x = 0$.
          - texto: >-
              $\sigma_x = M_zy/I_z + M_yz/I_y$ vale con cualquier par de ejes
              $y$, $z$ que pasen por G.
            trampa: true
            mensaje: |
              Solo si $I_{yz} = 0$, es decir, en ejes principales. Con otros
              ejes hay que usar la ec. 9.11, donde entra $I_{yz}$; si no, el
              eje neutro sale mal orientado y la tensión máxima, en otro
              sitio.
    resolucion: |
      **Las hipótesis** (apuntes del tema 9, apartado 9.2.1). En flexión pura
      la sección solo tiene flectores, $M_y$ y $M_z$. Según Navier-Bernoulli,
      las secciones siguen planas y perpendiculares al eje de la pieza, y
      giran alrededor de un eje de la sección, el **eje neutro**; las fibras
      de la superficie neutra no se deforman. Una fibra a una distancia
      $\xi$ de la superficie neutra, de radio de curvatura $\rho$, se
      alarga

      $$
      \varepsilon_x = \frac{(\rho + \xi)\,d\theta - \rho\,d\theta}{\rho\,d\theta} = \frac{\xi}{\rho} \qquad (9.1)
      $$

      Con libertad de deformación en $y$ y $z$ ($\sigma_y = \sigma_z = 0$) y
      el mismo módulo a tracción y a compresión, la ley de Hooke da

      $$
      \sigma_x = E\,\varepsilon_x = \frac{E}{\rho}\,\xi \qquad (9.2)
      $$

      **El eje neutro pasa por G.** El axil es nulo:

      $$
      N = \int_A \sigma_x\,dA = \frac{E}{\rho}\int_A \xi\,dA = 0 \;\Longrightarrow\; \xi_G = 0 \qquad (9.3,\ 9.4)
      $$

      **La distribución.** Si el eje neutro forma un ángulo $\varphi$ con $z$,
      positivo si sube hacia $+z$ (con $y$ hacia abajo, como en la figura 9.3),
      la distancia de un punto $(y,\ z)$ a él es
      $\xi = y\cos\varphi + z\sin\varphi$ (ec. 9.6), y

      $$
      \sigma_x = \frac{E}{\rho}\,(y\cos\varphi + z\sin\varphi) = C_1\,y + C_2\,z \qquad (9.7)
      $$

      Los flectores son las resultantes de momento de esas tensiones:

      $$
      M_y = \int_A \sigma_x\,z\,dA = C_1\,I_{yz} + C_2\,I_y, \qquad M_z = \int_A \sigma_x\,y\,dA = C_1\,I_z + C_2\,I_{yz} \qquad (9.8,\ 9.9)
      $$

      y resolviendo el sistema:

      $$
      C_1 = \frac{M_y\,I_{yz} - M_z\,I_y}{I_{yz}^{2} - I_y\,I_z}, \qquad C_2 = \frac{M_z\,I_{yz} - M_y\,I_z}{I_{yz}^{2} - I_y\,I_z} \qquad (9.10)
      $$

      $$
      \sigma_x = \frac{M_y\,I_{yz} - M_z\,I_y}{I_{yz}^{2} - I_y\,I_z}\,y + \frac{M_z\,I_{yz} - M_y\,I_z}{I_{yz}^{2} - I_y\,I_z}\,z \qquad (9.11)
      $$

      **El eje neutro y los puntos más cargados.** El eje neutro es
      $\sigma_x = 0$ (ec. 9.13), una recta por G; la tensión crece con la
      distancia a él, así que los puntos de tensión máxima son los más
      alejados, a un lado y a otro.

      **En ejes principales**, $I_{yz} = 0$ y todo se simplifica:

      $$
      \sigma_x = \frac{M_z}{I_z}\,y + \frac{M_y}{I_y}\,z \quad (9.21), \qquad \frac{y}{z} = -\frac{M_y\,I_z}{M_z\,I_y} \text{ en el eje neutro} \quad (9.22)
      $$

      Con un solo flector, $\sigma_x = M_z\,y/I_z$ (ec. 9.23), y la tensión
      máxima es $M_z/W_z$, con $W_z = I_z/y_{max}$ (ec. 9.24).

      **Un ejemplo nuestro.** Un rectángulo de 60 mm según $z$ por 120 mm
      según $y$, con $M_z$ = 10 kN·m y $M_y$ = 3 kN·m:
      $I_z = 8{,}64\cdot10^{6}$ mm⁴ e $I_y = 2{,}16\cdot10^{6}$ mm⁴; en la
      esquina con $y = 60$ mm y $z = 30$ mm,
      $\sigma_{max} = 69{,}44 + 41{,}67 \approx 111{,}1$ MPa, y el eje neutro
      sube hacia $+z$ con $\operatorname{tg}\beta = 1{,}2$, a
      $50{,}19^{\circ}$ de $z$: más torcido que el momento, hacia el eje de
      inercia mínima.

      **Comprobaciones.** El motor del curso no tiene flexión. El ejemplo
      se ha comprobado integrando en una malla del rectángulo: las inercias
      de la malla, con el sistema de la ec. 9.9 resuelto aparte, dan los
      mismos $C_1$ y $C_2$, la misma tensión en la esquina y el mismo eje
      neutro.
  # ── Problema 1 · el prisma entre dos placas rígidas unidas por cables.
  #    El mismo problema, con otras palabras y sin el apartado c/, es el 1 del
  #    parcial de 2014-2015 y el 4.6 de clase.
  - id: exerm1213-1par-4-el-prisma-entre-placas-y-cuatro-cables
    titulo: El prisma comprimido en x entre dos placas rígidas unidas por cuatro cables, y su cambio de volumen
    fuente: >-
      Ejercicio 1 · Primer parcial de 2012-2013 (hoja de ejercicios del 26 de
      octubre de 2012) · Elasticidad y Resistencia de Materiales, Escuela
      Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 1,5 puntos.
      El mismo problema, con otra redacción y sin el apartado c/, volvió a caer
      como ejercicio 1 del primer parcial de 2014-2015, y es el 4.6 de los
      enunciados de clase del tema 4, que no trae resolución. El examen no
      publica resolución; el desarrollo es nuestro, con la ley de Hooke
      generalizada y la variación de volumen de los apuntes del tema 4 (ecs.
      4.2 y 4.8, págs. 4 a 7) y el alargamiento de una barra del tema 8 (ec.
      8.9, pág. 7).
    nivel: examen
    enunciado: |
      1.-(1,5p) El prisma B de la figura es de base cuadrada y se sitúa entre
      dos placas rígidas. Las placas se unen mediante 4 cables situados
      simétricamente, de los cuales 2 se muestran en la figura. Se aplica
      presión uniforme $p$ al cuerpo B en las caras perpendiculares a $x$.
      Las dimensiones del prisma B en las direcciones $x$, $y$, $z$ son $a$,
      $5a$, $a$, respectivamente. El módulo elástico del cuerpo B es $E$ y su
      coeficiente de Poisson es $\nu = 0{,}1$. El módulo elástico de cada
      cable es (10$E$) y el área de su sección es $A = \frac{1}{400}a^{2}$.
      Despreciando los pesos de las placas y del prisma, determinar en
      función de $p$ y $E$:

      a/ Tensión en los cables, $\sigma_0$.

      b/ Tensiones principales en el prisma B, $\sigma_x$, $\sigma_y$,
      $\sigma_z$.

      c/ Variación de volumen del prisma.

