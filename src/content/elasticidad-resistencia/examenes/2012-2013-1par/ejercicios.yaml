ejercicios:
  # ── Teoría · pregunta 1 · las variaciones del paralelepípedo elemental.
  - id: exerm1213-1par-1-las-variaciones-del-paralelepipedo-elemental
    titulo: Lo que le pasa a un paralelepípedo elemental al deformarse el cuerpo
    fuente: >-
      Pregunta 1 de teoría · Primer parcial de 2012-2013 (hoja de teoría del
      26 de octubre de 2012) · Elasticidad y Resistencia de Materiales,
      Escuela Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 1
      punto. El examen no publica resolución; el desarrollo es nuestro y
      sigue los apuntes del tema 3, apartados 3.2 a 3.7 (págs. 3 a 19), que
      acaban con la lista de las cuatro variaciones. Los pasos de cálculo son
      ejemplos nuestros.
    nivel: examen
    enunciado: |
      1. (1p) Explicar las variaciones que sufre un paralelepípedo elemental
      en el proceso de deformación.
    pide: >-
      Las variaciones que sufre un paralelepípedo elemental al deformarse el
      cuerpo, cada una con la magnitud que la mide y lo que cambia del
      elemento.
    pasos:
      - tipo: reconocer
        pregunta: |
          Un paralelepípedo elemental se traslada y gira un poco, y al final
          sus aristas miden lo mismo y sus ángulos siguen rectos. ¿Se ha
          deformado?
        opciones:
          - texto: >-
              No: se ha movido como un sólido rígido; deformarse es cambiar de
              longitudes o de ángulos
            correcta: true
            mensaje: |
              Eso es. Traslación y giro de sólido rígido son dos de las cuatro
              variaciones, y son las que no deforman. Las otras dos, las
              deformaciones normales y las tangenciales, son la deformación
              pura.
          - texto: >-
              Sí: sus aristas han girado, y eso es una distorsión $\gamma$
            mensaje: |
              $\gamma$ mide cuánto cambia el ángulo **entre** dos aristas. Si
              giran las dos lo mismo, el ángulo no cambia: es un giro de
              sólido rígido, $\omega$, y $\gamma = 0$.
          - texto: >-
              Sí: todos sus puntos se han desplazado, así que hay deformaciones
              $\varepsilon$
            mensaje: |
              $\varepsilon$ mide el cambio relativo de **longitud** de una
              arista, no cuánto se mueven sus puntos. Una traslación mueve
              todos los puntos lo mismo y no cambia ninguna longitud.
      - tipo: redactar
        que: definicion
        consigna: >-
          Explica, como en el examen, las variaciones que sufre el
          paralelepípedo elemental en el proceso de deformación: qué es cada
          una, qué la mide y qué cambia del elemento.
        rubrica:
          - punto: >-
              Se parte del paralelepípedo de aristas dx, dy, dz con vértice en
              O y de cómo quedan sus aristas tras la deformación,
              O'A' = (1 + u,x; v,x; w,x) dx y las otras dos igual: todo lo
              que le pasa está en la matriz [g] de las derivadas de los
              desplazamientos (ecs. 3.1 a 3.8 y 3.27).
            porque: >-
              Es el punto de partida del apartado 3.2: el elemento se describe
              por cómo cambian sus aristas, no por cuánto se mueve.
            minimo: true
          - punto: >-
              Traslación pura: el elemento entero se desplaza el vector δ de
              su vértice O, sin cambiar longitudes ni ángulos.
            porque: >-
              Es la primera de las cuatro variaciones del apartado 3.7, y no
              deforma.
            minimo: true
          - punto: >-
              Rotación de sólido rígido: la parte antisimétrica de [g], el
              vector ω (por ejemplo su componente según z, ωyx = ½(v,x − u,y),
              ecs. 3.32 y 3.38), gira el elemento sin deformarlo.
            porque: >-
              Es lo que queda de [g] al quitarle la parte simétrica, y se
              demuestra que no cambia longitudes ni ángulos (ecs. 3.41 a 3.45).
            minimo: true
          - punto: >-
              Deformaciones normales εx = u,x, εy = v,y, εz = w,z (ec. 3.14):
              el cambio relativo de longitud de cada arista. Cambian el
              volumen: e = εx + εy + εz (ec. 3.59).
            porque: >-
              Son la diagonal de la parte simétrica, [ε], y la única parte de
              la deformación que cambia el volumen a primer orden.
            minimo: true
          - punto: >-
              Deformaciones tangenciales γxy = u,y + v,x, y las otras dos (ec.
              3.21): lo que disminuye el ángulo recto entre dos aristas.
              Cambian la forma (distorsión) sin cambiar el volumen.
            porque: >-
              Son los términos de fuera de la diagonal de [ε], multiplicados
              por dos, y con las normales forman la deformación pura.
            minimo: true
          - punto: >-
              Todo vale con derivadas de los desplazamientos pequeñas (menores
              que 0,02), que permiten despreciar los términos de segundo orden
              y escribir [g] = [ε] + [ω].
            porque: >-
              Sin esa hipótesis no se pueden separar los cuatro efectos ni
              sumarlos.
      - tipo: calcular
        titulo: El cambio de volumen de un elemento, en un ejemplo
        pregunta: |
          Un ejemplo nuestro: tras la deformación, las aristas de un
          paralelepípedo elemental de lados $dx$, $dy$, $dz$ son
          $O'A' = (1{,}003;\ 0{,}005;\ 0)\,dx$,
          $O'B' = (-0{,}002;\ 0{,}999;\ 0)\,dy$ y
          $O'C' = (0;\ 0;\ 1{,}0005)\,dz$. ¿Cuánto vale la variación unitaria
          de volumen $e$, en unidades de $10^{-3}$?
        respuesta:
          tipo: numero
          valor: '2.5'
          tolerancia: 0.01
          formato: un número, en unidades de 10⁻³
        distractores:
          - valor: '5.5'
            mensaje: |
              Has sumado también la distorsión, $\gamma_{xy} = 3\cdot10^{-3}$.
              Las tangenciales cambian la forma, no el volumen: $e$ es solo la
              suma de las tres normales.
          - valor: '4.5'
            mensaje: |
              Has sumado los valores absolutos. $\varepsilon_y = v_{,y} = -1\cdot10^{-3}$
              es un acortamiento y resta volumen.
        pista: |
          Las normales son la diagonal de [g]: $u_{,x}$ es lo que se alarga
          la arista $dx$ en su dirección, la primera componente de $O'A'$
          menos 1.
        desarrollo: |
          $\varepsilon_x = 3\cdot10^{-3}$, $\varepsilon_y = -1\cdot10^{-3}$ y
          $\varepsilon_z = 0{,}5\cdot10^{-3}$:

          $$
          e = \varepsilon_x + \varepsilon_y + \varepsilon_z = (3 - 1 + 0{,}5)\cdot10^{-3} = 2{,}5\cdot10^{-3}
          $$

          El volumen exacto, el producto mixto de las tres aristas (ec.
          3.56), da $2{,}508\cdot10^{-3}$: la diferencia es de segundo orden.
      - tipo: calcular
        titulo: Lo que se cierra el ángulo recto, en el mismo ejemplo
        pregunta: |
          Con las mismas aristas, ¿cuánto se cierra el ángulo recto entre las
          aristas $dx$ y $dy$, en grados?
        respuesta:
          tipo: numero
          valor: '0.1719'
          tolerancia: 0.0015
          formato: un número, en grados
        distractores:
          - valor: '0.4011'
            mensaje: |
              Has sumado los giros de las dos aristas como si las dos cerraran
              el ángulo. La de $x$ gira $5\cdot10^{-3}$ rad hacia $y$, pero la
              de $y$ gira $2\cdot10^{-3}$ en el mismo sentido, alejándose de
              ella: el ángulo se cierra $(5 - 2)\cdot10^{-3}$ rad.
          - valor: '-0.1719'
            mensaje: |
              El valor es ese y el sentido no. Con
              $\gamma_{xy} = u_{,y} + v_{,x} > 0$ el ángulo recto disminuye:
              pasa de 90° a unos 89,83°, no a 90,17°.
          - valor: '0.0859'
            mensaje: |
              Es la mitad, la componente $\varepsilon_{xy} = \gamma_{xy}/2$ del
              tensor de deformaciones. Lo que se cierra el ángulo es
              $\gamma_{xy}$ entera.
        pista: |
          $\gamma_{xy} = u_{,y} + v_{,x}$ (ec. 3.21), con $v_{,x}$ la segunda
          componente de $O'A'$ y $u_{,y}$ la primera de $O'B'$; pásalo a
          grados.
        desarrollo: |
          $$
          \gamma_{xy} = u_{,y} + v_{,x} = (-2 + 5)\cdot10^{-3} = 3\cdot10^{-3}
          $$

          en radianes, y $3\cdot10^{-3}\cdot180/\pi \approx 0{,}1719$ grados.
          El ángulo exacto entre $O'A'$ y $O'B'$ es 89,829°: se cierra
          0,171°, la misma cifra salvo un término de segundo orden.
      - tipo: justificar
        pregunta: Ordena la explicación. Una pieza es falsa.
        piezas:
          - texto: >-
              Las aristas deformadas del elemento dan la matriz [g] de las
              derivadas de los desplazamientos.
          - texto: >-
              Con derivadas pequeñas, [g] se separa en una parte
              antisimétrica, [ω], y una simétrica, [ε].
          - texto: >-
              La traslación δ y el giro ω mueven el elemento como un sólido
              rígido, sin deformarlo.
          - texto: >-
              Las normales $\varepsilon_i$ cambian la longitud de las aristas
              y, con ella, el volumen: $e = \varepsilon_x + \varepsilon_y + \varepsilon_z$.
          - texto: >-
              Las tangenciales $\gamma_{ij}$ cambian los ángulos rectos: la
              forma, no el volumen.
          - texto: >-
              Las tangenciales también cambian el volumen, porque inclinan
              las caras y el elemento deja de ser un ortoedro.
            trampa: true
            mensaje: |
              Un paralelepípedo inclinado con las mismas aristas pierde volumen
              en el factor $\cos\gamma \approx 1 - \gamma^{2}/2$, que difiere
              de 1 en un término de segundo orden. A primer orden, las $\gamma$ no cambian el
              volumen: por eso sumarlas a $e$ es un error.
    resolucion: |
      **El punto de partida** (apuntes del tema 3, apartado 3.2). Se toma un
      paralelepípedo elemental con vértice en O y aristas $dx$, $dy$, $dz$
      según los ejes. Tras la deformación, sus vértices son O', A', B' y C',
      y sus aristas pasan a ser

      $$
      \overrightarrow{O'A'} = (1 + u_{,x},\ v_{,x},\ w_{,x})\,dx,\quad
      \overrightarrow{O'B'} = (u_{,y},\ 1 + v_{,y},\ w_{,y})\,dy,\quad
      \overrightarrow{O'C'} = (u_{,z},\ v_{,z},\ 1 + w_{,z})\,dz
      $$

      Todo lo que le pasa al elemento, además de moverse con O, está en la
      matriz de las derivadas de los desplazamientos, [g] (ec. 3.27). Con
      derivadas pequeñas (menores que 0,02, pág. 7) los términos de segundo
      orden se desprecian y [g] se separa en dos partes (ecs. 3.30 a 3.35):
      una simétrica, el tensor de deformaciones [ε], y otra antisimétrica,
      el tensor de rotación [ω].

      **Las cuatro variaciones** (apartado 3.7, pág. 19):

      1. **Traslación pura**, según el vector desplazamiento δ de O. Todo el
         elemento se mueve lo mismo; no cambia nada de él.
      2. **Rotación de sólido rígido**, según el vector ω, la parte
         antisimétrica de [g]: por ejemplo, su componente según $z$ es
         $\omega_{yx} = \tfrac12\,(v_{,x} - u_{,y})$ (ecs. 3.32 y 3.38 a
         3.40). Gira el
         elemento sin cambiar longitudes ni ángulos (ecs. 3.41 a 3.45).
      3. **Deformaciones normales**, $\varepsilon_x = u_{,x}$,
         $\varepsilon_y = v_{,y}$, $\varepsilon_z = w_{,z}$ (ec. 3.14): el
         cambio relativo de longitud de cada arista. Provocan la variación
         de volumen,
         $e = \Delta V/V = \varepsilon_x + \varepsilon_y + \varepsilon_z$
         (ecs. 3.56 a 3.59).
      4. **Deformaciones tangenciales**, $\gamma_{xy} = u_{,y} + v_{,x}$ y
         las otras dos (ecs. 3.15 y 3.21): lo que disminuye el ángulo recto
         entre dos aristas. Provocan la distorsión, el cambio de forma, sin
         variación de volumen.

      Las dos primeras son movimiento de sólido rígido; las dos últimas, la
      **deformación pura**, son las que dan tensiones.

      <figure class="figura-examen">
      <svg viewBox="0 0 480 154" role="img" width="480" height="154" aria-labelledby="exerm1213-1par-1-las-variaciones-del-paralelepipedo-elemental-fig-t exerm1213-1par-1-las-variaciones-del-paralelepipedo-elemental-fig-d">
      <title id="exerm1213-1par-1-las-variaciones-del-paralelepipedo-elemental-fig-t">Los cuatro cambios que puede sufrir el elemento: traslación, giro, alargamientos y distorsión</title>
      <desc id="exerm1213-1par-1-las-variaciones-del-paralelepipedo-elemental-fig-d">Cuatro dibujos de la cara xy de un paralelepípedo elemental, cada uno con la cara antes, a trazos, y después, llena. En el primero, la cara se traslada sin cambiar: una flecha va del vértice de antes al de después. En el segundo, la cara gira alrededor de un vértice como un sólido rígido, sin cambiar lados ni ángulos. En el tercero, la cara se alarga según x y se acorta según y, y sus ángulos siguen rectos: cambia el volumen. En el cuarto, los dos lados giran hacia dentro sin cambiar de largo y el ángulo recto se cierra: cambia la forma. Las deformaciones están exageradas.</desc>
      <polygon points="24,104 84,104 84,44 24,44" fill="none" stroke="var(--faint)" stroke-width="1.2" stroke-dasharray="4 3"/>
      <polygon points="46,88 106,88 106,28 46,28" fill="var(--live)" fill-opacity=".14" stroke="var(--live)" stroke-width="1.8"/>
      <line x1="24" y1="104" x2="42" y2="90.9" stroke="var(--ink)" stroke-width="1.2"/><polygon points="46,88 42.7,93.6 39.6,89.4" fill="var(--ink)"/>
      <polygon points="152,104 212,104 212,44 152,44" fill="none" stroke="var(--faint)" stroke-width="1.2" stroke-dasharray="4 3"/>
