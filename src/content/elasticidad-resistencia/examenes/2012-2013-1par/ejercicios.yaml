      **b/ La sección.** Dos rectángulos sin solaparse, con $y$ desde la
      cara de arriba hacia abajo y $z$ desde la cara exterior del ala
      vertical: el ala de arriba ($10t \times t$, centro en
      $(z,\ y) = (5t,\ 0{,}5t)$) y el resto del ala vertical ($t \times 9t$,
      centro en $(0{,}5t,\ 5{,}5t)$). Área $A = 19t^{2}$ y, por la simetría
      de la L,

      $$
      \overline{z} = \overline{y} = \frac{10\cdot0{,}5 + 9\cdot5{,}5}{19}\,t = \frac{54{,}5}{19}\,t \approx 2{,}868\,t
      $$

      **Inercias respecto de G** (Steiner; en $t^{4}$):

      $$
      \begin{aligned}
      I_z &= \tfrac{10}{12} + 10\cdot2{,}368^{2} + \tfrac{9^{3}}{12} + 9\cdot2{,}632^{2} \approx 180{,}00 = I_y\\
      I_{yz} &= 10\,(-2{,}368)(2{,}132) + 9\,(2{,}632)(-2{,}368) \approx -106{,}58
      \end{aligned}
      $$

      con $I_yI_z - I_{yz}^{2} \approx 21\,042{,}5$ (en $t^{8}$). El producto
      de inercia no es nulo: $y$, $z$ no son principales. El círculo de Mohr
      de inercias (ecs. 9.19 y 9.20) tiene centro 180,00 y radio 106,58; los
      principales son la bisectriz de la esquina, eje de simetría de la L,
      con $I_{max} \approx 286{,}58\,t^{4}$, y su perpendicular, con
      $I_{min} \approx 73{,}43\,t^{4}$.

      **Las tensiones** (ecs. 9.10 y 9.11). La carga va según $y$: solo hay
      $M_z = M$ y $M_y = 0$. Con $y$, $z$ en unidades de $t$:

      $$
      \sigma_x = M\,\frac{I_y\,y - I_{yz}\,z}{I_yI_z - I_{yz}^{2}} = \left(8{,}554\,y + 5{,}065\,z\right)\cdot10^{-3}\,\frac{M}{t^{3}}
      $$

      **El eje neutro.** $\sigma_x = 0$ da $y \approx -0{,}5921\,z$: pasa por
      G y sube hacia $+z$ formando $30{,}63^{\circ}$ con $z$. En ejes
      principales sale lo mismo: el momento, según $z$, forma 45° con el eje
      de inercia máxima, y el eje neutro se aleja de éste un ángulo $\psi$
      con $\operatorname{tg}\psi = (I_{max}/I_{min})\operatorname{tg}45^{\circ} \approx 3{,}903$,
      $\psi \approx 75{,}63^{\circ}$, que desde $z$ son
      $75{,}63^{\circ} - 45^{\circ} = 30{,}63^{\circ}$. Queda entre $z$ y el
      eje de inercia mínima.

