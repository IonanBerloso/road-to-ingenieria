      **El punto de tensión máxima.** Es el más alejado del eje neutro: la
      esquina de abajo del ala vertical por su cara **interior**, P, en
      $(y,\ z) = (7{,}132t,\ -1{,}868t)$, con $0{,}05154\,|M|/t^{3}$. La
      esquina exterior del pie tiene $0{,}04648$ y la esquina exterior de la
      L, Q, al otro lado del eje neutro, $0{,}03907$, en las mismas unidades.
      En D el flector es negativo: P queda comprimida y Q traccionada. Como
      $\sigma_{on}$ vale para las dos, manda P con el mayor $|M|$, el de D.

      **El espesor.** Con $|M_D| = 0{,}5\cdot1000\cdot4^{2}$ kg·m $= 8000$ kg·m
      $= 800\,000$ kg·cm y $|\sigma_P| = \sigma_{on} = 2000$ kg/cm²:

      $$
      t^{3} = \frac{0{,}051542\cdot800\,000}{2000}\ \text{cm}^{3} \approx 20{,}62\ \text{cm}^{3}
      \quad\Longrightarrow\quad t \approx 2{,}742\ \text{cm}
      $$

      La L mide entonces 27,4 cm por 27,4 cm, con 2,74 cm de espesor. Como
      todas las cotas son múltiplos de $t$, no se ha despreciado nada por
      pared delgada. Con el máximo positivo del vano,
      $\tfrac{7}{18}q_0a^{2}$, saldría $t = 2{,}522$ cm: el voladizo manda.

      **Comprobaciones.** El motor del curso resuelve la viga
      (`resuelveViga`, `tramos` y `maximos`): las mismas reacciones, el
      cortante nulo en $\tfrac43a$ y los mismos flectores; el segundo camino
      son los momentos respecto de D y las leyes por tramos escritas a mano.
      La flexión no la tiene el motor, así que la sección sale de un guion
      propio y se comprueba por caminos independientes: (1) las
      propiedades, integradas en una malla fina de la sección, dan el mismo
      G, $I_z$, $I_y$ e $I_{yz}$; (2) en ejes principales, con el momento
      proyectado en ellos, las tensiones de las seis esquinas y el eje
      neutro salen iguales; y (3) el campo de tensiones integrado en la
      malla da $N = 0$, $\int\sigma_x z\,dA = 0$ e $\int\sigma_x y\,dA = M$
      (ec. 9.8).
