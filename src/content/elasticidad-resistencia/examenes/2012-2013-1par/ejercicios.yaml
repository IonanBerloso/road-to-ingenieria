      <figcaption>

      La cara xy del elemento antes (a trazos) y después (llena) en cada una
      de las cuatro variaciones, exageradas.

      </figcaption>
      </figure>

      **Un ejemplo nuestro.** Con las aristas
      $O'A' = (1{,}003;\ 0{,}005;\ 0)\,dx$,
      $O'B' = (-0{,}002;\ 0{,}999;\ 0)\,dy$ y
      $O'C' = (0;\ 0;\ 1{,}0005)\,dz$, las normales son
      $\varepsilon_x = 3\cdot10^{-3}$, $\varepsilon_y = -1\cdot10^{-3}$ y
      $\varepsilon_z = 0{,}5\cdot10^{-3}$, y $e = 2{,}5\cdot10^{-3}$. La
      distorsión es $\gamma_{xy} = (-2 + 5)\cdot10^{-3} = 3\cdot10^{-3}$ rad,
      unos 0,172°, y el giro,
      $\omega_{yx} = \tfrac12\,(5 + 2)\cdot10^{-3} = 3{,}5\cdot10^{-3}$ rad: la
      arista $dx$ gira $5\cdot10^{-3}$ y la $dy$, $2\cdot10^{-3}$, en el
      mismo sentido; el giro es la media de los dos y la distorsión, su
      diferencia.

      **Comprobaciones.** El motor del curso (el tensor de deformaciones y
      su traza) da $e = 2{,}5\cdot10^{-3}$, y el ángulo exacto entre las dos
      aristas, sin linealizar, 89,829°. El segundo camino es el volumen y el
      ángulo de las aristas escaladas por un factor muy pequeño, que dan la
      parte de primer orden: $e$ y $\gamma_{xy}$ coinciden, y la media de
      los giros de las dos aristas es $\omega_{yx}$.

  # ── Teoría · pregunta 2 · el equilibrio del elemento diferencial de viga.
  - id: exerm1213-1par-2-el-equilibrio-del-elemento-de-viga
    titulo: Las ecuaciones de equilibrio de la rebanada de una pieza prismática recta
    fuente: >-
      Pregunta 2 de teoría · Primer parcial de 2012-2013 (hoja de teoría del
      26 de octubre de 2012) · Elasticidad y Resistencia de Materiales,
      Escuela Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 1,5
      puntos. El examen no publica resolución; el desarrollo es nuestro y
      sigue los apuntes del tema 7, apartado 7.4 (págs. 10 a 12, ecs. 7.8 a
      7.15, figura 7.6). Los pasos de cálculo son ejemplos nuestros.
    nivel: examen
    enunciado: |
      2. (1,5p) Deducir las ecuaciones de equilibrio de un elemento
      diferencial de viga.
    pide: >-
      Las ecuaciones diferenciales de equilibrio de una rebanada de longitud
      dx de una pieza prismática recta, deducidas: las del caso general y
      las del caso plano.
    pasos:
      - tipo: reconocer
        pregunta: |
          Al tomar momentos respecto del centro de la cara derecha de la
          rebanada, G₂, la carga repartida $q\,dx$ da un término
          $q\,dx\cdot dx/2$. ¿Qué se hace con él?
        opciones:
          - texto: >-
              Se desprecia: es de segundo orden, y al dividir por $dx$ tiende
              a cero
            correcta: true
            mensaje: |
              Eso es. Frente a $dM$ y $T\,dx$, que son de primer orden,
              $q\,dx^{2}/2$ no cuenta. Por eso la carga no aparece en la
              ecuación de momentos: $dM/dx = T$.
          - texto: >-
              Se queda, y la ecuación es $dM/dx = T - q\,dx/2$
            mensaje: |
              $dM/dx$ es el límite cuando $dx \to 0$, y en ese límite
              $q\,dx/2$ se anula. La ecuación diferencial no puede depender de
              $dx$.
          - texto: >-
              No aparece: $q$ es perpendicular al eje y no da momento
              respecto de G₂
            mensaje: |
              Es perpendicular al eje, pero no pasa por G₂: su resultante,
              $q\,dx$, está en el centro de la rebanada, a $dx/2$ de G₂, y
              tiene momento. Es pequeño, que es otra cosa.
          - texto: >-
              Se cancela con el momento de $T + dT$
            mensaje: |
              $T + dT$ actúa en la cara derecha y pasa por G₂: su momento
              respecto de G₂ es nulo. No hay nada con que cancelarlo; se
              desprecia por ser de segundo orden.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción completa, como en el examen: la rebanada con
          sus cargas y esfuerzos, las ecuaciones del caso general y las del
          caso plano.
        rubrica:
          - punto: >-
              Se aísla una rebanada de longitud dx de una pieza recta, con las
              cargas por unidad de longitud qx, qy, qz y el torsor mt,
              uniformes en dx, y los esfuerzos positivos en las dos caras: N,
              Ty, Tz, Mt, My, Mz en la de x y los mismos más su incremento en
              la de x + dx, en sentido contrario.
            porque: >-
              Es la figura 7.6: los signos de las ecuaciones salen de esos
              sentidos y del convenio de esfuerzos positivos.
            minimo: true
          - punto: >-
              Según x: dN/dx = −qx (ec. 7.8); momentos según x:
              dMt/dx = −mt (ec. 7.9).
            porque: >-
              Son las dos ecuaciones del axil y del torsor, que no se mezclan
              con las de flexión.
            minimo: true
          - punto: >-
              En el plano xy: fuerzas según y, dTy/dx = −qy (ec. 7.10), y
              momentos respecto del eje z por G2, dMz/dx = Ty (ec. 7.11),
              despreciando el término qy dx·dx/2, de segundo orden.
            porque: >-
              Es la pareja de la flexión en el plano xy, y el término
              despreciado es el que hace que la carga no entre en la de
              momentos.
            minimo: true
          - punto: >-
              En el plano xz: dTz/dx = −qz (ec. 7.12) y dMy/dx = Tz (ec.
              7.13), igual.
            porque: >-
              Completa las seis ecuaciones de equilibrio de la rebanada.
            minimo: true
          - punto: >-
              Caso plano, con cargas solo según y: dT/dx = −q y dM/dx = T
              (ecs. 7.14 y 7.15), de las que salen los diagramas: integradas,
              T y M (ecs. 7.16 y 7.17); M extremo donde T = 0; saltos en T
              donde hay fuerzas concentradas.
            porque: >-
              Es la forma en que se usan para dibujar los diagramas, el
              resto del tema 7.
      - tipo: calcular
        titulo: El cortante en un tramo cargado, en un ejemplo
        pregunta: |
          Un ejemplo nuestro: en un tramo de viga con una carga uniforme
          $q$ = 3 kN/m hacia abajo, en la sección $x = 0$ el cortante vale
          $T$ = 9 kN y el flector $M$ = 4 kN·m, con el convenio del curso.
          ¿Cuánto vale el cortante en $x$ = 2 m, en kN?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.01
          formato: un número, en kN
        distractores:
          - valor: '15'
            mensaje: |
              Has sumado la carga: $dT/dx = +q$. Con el convenio del curso,
              $T$ en la cara izquierda va hacia arriba y $T + dT$ en la
              derecha hacia abajo, como la carga: $dT/dx = -q$ (ec. 7.14).
          - valor: '-3'
            mensaje: |
              Es el resultado con el convenio contrario para $T$ (positivo
              hacia arriba en la cara derecha), con el que $dT/dx = +q$ y el
              dato sería $-9$ kN. Con el del curso, $T = 9 - 3\cdot2$.
        pista: |
          Con $q$ uniforme, la ec. 7.16 es $T = -q\,x + T_0$, con $T_0$ el
          cortante en $x = 0$.
        desarrollo: |
          $$
          T(2) = 9 - 3\cdot2 = 3
          $$

          en kN.
      - tipo: calcular
        titulo: El flector máximo del mismo tramo
        pregunta: |
          En el mismo tramo, largo y con la misma carga, ¿cuánto vale el
          flector máximo, en kN·m?
        respuesta:
          tipo: numero
          valor: '17.5'
          tolerancia: 0.01
          formato: un número, en kN·m
        distractores:
          - valor: '13.5'
            mensaje: |
              Te has dejado la constante de integración $M_0$ = 4 kN·m: el
              flector no empieza en cero en $x = 0$.
          - valor: '31'
            mensaje: |
              Te has dejado el término de la carga, $-q\,x^{2}/2$. Sin él, el
              flector crecería sin fin; con él, tiene su máximo donde
              $T = 0$.
          - valor: '4'
            mensaje: |
              Has escrito el término de la carga sin el ½, $-q\,x^{2}$: en
              $x$ = 3 m da $4 + 27 - 27 = 4$. Integrar $T = 9 - 3x$ da
              $9x - \tfrac32x^{2}$.
        pista: |
          $dM/dx = T$: el máximo está donde $T = 0$, en $x = T_0/q$. La ec.
          7.17 con $q$ uniforme es $M = -\tfrac12q\,x^{2} + T_0\,x + M_0$.
        desarrollo: |
          $T = 9 - 3x = 0$ en $x$ = 3 m, y allí

          $$
          M_{max} = 4 + 9\cdot3 - \tfrac12\cdot3\cdot3^{2} = 17{,}5
          $$

          en kN·m.
      - tipo: justificar
        pregunta: Ordena la deducción del caso plano. Una pieza es falsa.
        piezas:
          - texto: >-
              Se aísla la rebanada $dx$ con $T$ hacia arriba y $M$ horario en
              la cara izquierda, $T + dT$ hacia abajo y $M + dM$ antihorario
              en la derecha, y la carga $q\,dx$ en su centro.
          - texto: >-
              Fuerzas según $y$ (hacia abajo): $-T + (T + dT) + q\,dx = 0$,
              así que $dT/dx = -q$.
          - texto: >-
              Momentos respecto de G₂:
              $-M + (M + dM) - T\,dx + q\,dx^{2}/2 = 0$.
          - texto: >-
              El último término es de segundo orden: $dM/dx = T$.
          - texto: >-
              Como $q$ va hacia abajo, igual que $T + dT$ en la cara derecha,
              las dos se suman y $dT/dx = +q$.
            trampa: true
            mensaje: |
              Que vayan en el mismo sentido es justo lo que da el signo menos:
              en el equilibrio, $(T + dT) - T$ tiene que compensar a $q\,dx$,
              y $dT = -q\,dx$. Con el convenio del curso, $dT/dx = -q$ (ec.
              7.14).
    resolucion: |
      **La rebanada** (apuntes del tema 7, apartado 7.4, figura 7.6). Se
      aísla un trozo de longitud $dx$ de una pieza prismática de directriz
      recta. Sobre él actúan:

      - las cargas repartidas por unidad de longitud $q_x$ (aplicada en el
        eje), $q_y$ y $q_z$ (que cortan el eje), y el momento torsor por
        unidad de longitud $m_t$, uniformes en $dx$;
      - en la cara de $x$, los esfuerzos $N$, $T_y$, $T_z$, $M_t$, $M_y$,
        $M_z$, y en la de $x + dx$ los mismos más su incremento, en sentido
        contrario (los dos positivos según el convenio).

      Los momentos se toman respecto de G₂, el centro de la cara de
      $x + dx$.

      **Según $x$** (axil y torsor):

      $$
      \frac{dN}{dx} = -q_x \quad (7.8), \qquad \frac{dM_t}{dx} = -m_t \quad (7.9)
      $$

      **En el plano $xy$.** Fuerzas según $y$ y momentos respecto del eje $z$
      que pasa por G₂:

      $$
      T_y + dT_y + q_y\,dx - T_y = 0 \;\Longrightarrow\; \frac{dT_y}{dx} = -q_y \quad (7.10)
      $$

      $$
      (M_z + dM_z) - M_z - T_y\,dx + q_y\,dx\,\frac{dx}{2} = 0 \;\Longrightarrow\; \frac{dM_z}{dx} = T_y \quad (7.11)
      $$

      El término de $q_y$ es de segundo orden y se desprecia: la carga
      repartida no entra en la ecuación de momentos.

      **En el plano $xz$**, igual:

      $$
      \frac{dT_z}{dx} = -q_z \quad (7.12), \qquad \frac{dM_y}{dx} = T_z \quad (7.13)
      $$

      **El caso plano.** Si las cargas van solo según $y$
      ($q_z = 0$, $T_z = 0$, $M_y = 0$) y se escribe $q_y = q$, $T_y = T$,
      $M_z = M$:

      $$
      \frac{dT}{dx} = -q \quad (7.14), \qquad \frac{dM}{dx} = T \quad (7.15)
      $$

      <figure class="figura-examen">
      <svg viewBox="0 0 420 240" role="img" width="420" height="240" aria-labelledby="exerm1213-1par-2-el-equilibrio-del-elemento-de-viga-fig-t exerm1213-1par-2-el-equilibrio-del-elemento-de-viga-fig-d">
