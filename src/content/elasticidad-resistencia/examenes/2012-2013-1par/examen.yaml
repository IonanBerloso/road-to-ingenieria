asignatura: elasticidad-resistencia
curso: '2012-2013'
convocatoria: primer-parcial
fecha: 26 de octubre de 2012
# El primer parcial de Elasticidad y Resistencia de Materiales del 26 de
# octubre de 2012 («Parte 1» en la cabecera): dos páginas, la 1 de TEORÍA
# (tres preguntas, de 1, 1,5 y 1,5 puntos) y la 2 de ejercicios (tres, de
# 1,5, 1,5 y 3 puntos). Diez puntos en total, y el cuadernillo los imprime
# todos. La cabecera es de la Escuela Universitaria Politécnica de San
# Sebastián, y las dos hojas llevan la fecha 26-10-2012. Este parcial llega
# hasta la flexión (tema 9), como los de los tres cursos siguientes; desde
# 2016-2017 el parcial 1 ya no trae flexión.
#
# Se transcribe tal cual, con sus puntos impresos. Lo que hay que saber de
# ese texto, dicho antes de que nadie lo deduzca:
#
# 1. **SE TRANSCRIBE EL CASTELLANO.** El examen tiene otra versión en
#    euskera (12-EME-urri1.pdf) que no se transcribe. Trae los mismos puntos
#    y los mismos datos (cotejados: las seis puntuaciones, 5a, 10E, el ángulo
#    de 60, a = 4m, 1000 kg/m y 2000 kg/cm²).
#
# 2. **EL PDF NO PIERDE NADA FRENTE AL WORD.** El PDF es una conversión del
#    Word original (12-ERM-oct1.doc). El texto es el mismo en los dos, y las
#    fórmulas del ejercicio 1 (ν = 0,1, A = a²/400, σ0, σx, σy, σz), que en el
#    Word son objetos de ecuación, el PDF las dibuja enteras. Las tres
#    figuras se han redibujado del PDF renderizado a 400 ppp.
#
# 3. **LO QUE LAS FIGURAS DICEN Y EL TEXTO NO.** En el ejercicio 2, A y D son
#    nudos articulados al suelo (dos puntos negros sobre la franja rayada) y
#    el arco de 60 va entre AB y el suelo; con las cuatro barras de longitud
#    L, ABD y BCD son equiláteros. En el ejercicio 3, A es un apoyo móvil
#    (dos rodillos) y D, uno fijo; de D a E la viga vuela. Las dos cotas 10t
#    de la sección son el ancho y el alto totales de la L, hasta las caras
#    exteriores, como marcan sus líneas de referencia: es una L de alas
#    iguales, de espesor t. El PDF dibuja el espesor más grueso (unos 1,6t)
#    y el origen de los ejes, G, a ojo; el G de verdad está a 2,868t de las
#    dos caras exteriores. En el ejercicio 1 la figura no está a escala: el
#    prisma, de a por 5a, se dibuja casi cuadrado. Todo esto va en «Notas
#    nuestras» al pie de cada enunciado y en el pie de cada figura.
#
# 4. **ERRATAS Y GRAFÍAS DEL TEXTO, CONSERVADAS**: «1.-(1,5p)» pegado,
#    «(10E)» entre paréntesis, «4m» junto, «σon» para la tensión admisible
#    (que el examen da con un solo valor, para tracción y compresión), «La
#    viga simplemente apoyada» aunque tiene un voladizo, y «60º» con el
#    ordinal en la figura (se redibuja así). «kg/cm2» lleva el 2 en
#    superíndice en el PDF: kg/cm².
#
# 5. **DOS NUMERACIONES.** La teoría va de 1 a 3 y los ejercicios vuelven a
#    empezar en 1. Aquí la teoría son n 1 a 3 y los ejercicios n 4, 5 y 6;
#    la `fuente` de cada ejercicio dice el nombre impreso.
#
# 6. **NADA SE PARTE.** Cada pregunta es un ejercicio. El ejercicio 1 toca
#    los temas 4 y 8 y va en el 4; el 3, los temas 7 (los diagramas) y 9 (el
#    espesor), y va en el 9, como la pregunta 3 de teoría.
#
# 7. **LO QUE YA SE CONOCE.** El ejercicio 1 es, con otra redacción y sin
#    el apartado c/, el 1 del primer parcial de 2014-2015 y el 4.6 de los
#    enunciados de clase del tema 4: σ0 y σy son los pasos de 2014-2015, con
#    un distractor nuevo en cada uno; lo nuevo es el `reconocer` (σz), el
#    volumen y la trampa. Su `fuente` lo dice. El ejercicio 2, con la fuerza en horizontal, es el
#    1 del examen final de plan viejo de 2012-2013. El ejercicio 3 mide el
#    eje neutro desde el eje principal de inercia máxima, y no desde z como
#    el de 2013-2014; su espesor sí se pregunta igual. Ninguna de las seis
#    preguntas es copia de una ya publicada; la teoría 2 se parece a la
#    mitad b) de la pregunta 3 de 2016-2017 (allí la carga va en la cara de
#    arriba y es axial), con otros pasos.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso (src/lib/erm) y de un segundo camino
# (fase-p/p6e, guiones/cifras.mjs). El motor no tiene flexión: el espesor
# del ejercicio 3 y el ejemplo de la teoría 3 salen de las fórmulas de los
# apuntes del tema 9 y se comprueban por integración en una malla, ejes
# principales y el equilibrio del campo de tensiones. Las tres preguntas de
# teoría no traen números: sus pasos de cálculo usan ejemplos nuestros, y
# lo dicen.
pdf: 2012-2013-1par.pdf
puntosImpresos:
  fuente: >-
    Impresos junto a cada pregunta: «(1p)» en la 1 de teoría y «(1,5p)» en
    la 2 y la 3; «(1,5p)» en los ejercicios 1 y 2 y «(3p)» en el 3; págs. 1 y
    2 del cuadernillo.
  reparto:
    - { n: 1, puntos: 1 }
    - { n: 2, puntos: 1.5 }
    - { n: 3, puntos: 1.5 }
    - { n: 4, puntos: 1.5 }
    - { n: 5, puntos: 1.5 }
    - { n: 6, puntos: 3 }

