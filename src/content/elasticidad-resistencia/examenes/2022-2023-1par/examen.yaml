# El primer parcial de Elasticidad y Resistencia de Materiales del 18 de
# noviembre de 2022: cuatro páginas, la 1 de teoría (cuatro cuestiones de 1
# punto) y la 2 a la 4 de problemas (tres de 2 puntos). Diez puntos en total,
# y el cuadernillo los imprime todos.
#
# El cuadernillo es bilingüe, castellano a la izquierda y euskera a la
# derecha, y se transcribe **solo la columna en castellano**, tal cual. Lo
# que hay que saber de ese texto, dicho antes de que nadie lo deduzca:
#
# 1. **EL PDF CORTA LAS FÓRMULAS, Y EL WORD MANDA.** Las ecuaciones van en
#    cuadros de texto demasiado bajos: en el problema 1 se pierden la tercera
#    fila del tensor (0, 0, −8) y la mitad de n2; en el problema 2, todo lo
#    que sigue a εa; en el problema 3, los denominadores de K y α. Se han
#    leído en el Word original (22-ERM-nov.docx), cuyas figuras son las
#    mismas.
#
# 2. **UNA LECTURA DE GALGA DE MÁS.** En el Word, detrás de εb = 1200·10⁻⁶,
#    hay un segundo «εb = 2·10⁻⁶» que el cuadernillo no deja ver y que es la
#    galga b del parcial del 20/11/2020. Se toma 1200·10⁻⁶, el que sigue a εa
#    en la línea de datos, y lo dice la nota del ejercicio.
#
# 3. **LO QUE EL TEXTO NO DICE Y LA FIGURA SÍ.** La cuestión 2 no nombra la
#    carga ni dice qué alargamiento es ξ: la P de la figura se lee como una
#    presión sobre las caras de A, y ξ como el alargamiento vertical de B,
#    donde está su cota (en el original la cota lleva un «?» y la ξ quedó
#    suelta debajo de la figura). El problema 1 no dibuja los ejes: se toma X
#    a lo largo de la viga. Las dos lecturas van en la nota de cada
#    enunciado, y la resolución dice qué cambiaría con la otra.
#
# 4. **ERRATAS DEL TEXTO, CONSERVADAS**: «νν» y «ξξ» en la cuestión 2 (el
#    símbolo duplicado del original), «Calcular :», «entre que valores» sin
#    tilde, «A demás» y «Kg/cm2» en la cuestión 4, «las tensiones … las
#    tensiones» en el problema 1, «barras 1» y «Diagramas de de fuerzas» en el
#    problema 3. El ν de la cuestión 3 sale en el PDF con el glifo de la
#    fuente Symbol, que parece una υ; se transcribe ν.
#
# 5. **DOS NUMERACIONES Y UN NÚMERO REPETIDO.** La teoría va de 1 a 4 y los
#    problemas vuelven a empezar: se imprimen «1.», «2.» y otra vez «1.» (en
#    euskera el primero va como «2.»). Aquí las cuestiones son n 1 a 4 y los
#    problemas n 5, 6 y 7; la `fuente` de cada ejercicio dice el nombre
#    impreso.
#
# 6. **NADA SE PARTE.** Cada pregunta es un ejercicio: los temas secundarios
#    del problema 2 (Hooke, principales, fallo) y del 3 (diagramas) son pasos
#    del mismo cálculo, no unidades que se enseñen por separado.
#
# 7. **EL EUSKERA NO DICE OTRA COSA** en ninguna pregunta: mismos datos,
#    mismos apartados y mismas figuras.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso y de un segundo camino (fase-p/p2a,
# guiones/cifras.mjs). Las cuestiones 1 y 3 son literales del parcial del
# 20/11/2020, y su resolución sirve allí sin cambios.
pdf: 2022-2023-1par.pdf
puntosImpresos:
  fuente: Cabecera de cada pregunta, «(1p)» en la teoría y «(2p)» en los problemas, págs. 1-4 del cuadernillo.
  reparto:
    - { n: 1, puntos: 1 }
    - { n: 2, puntos: 1 }
    - { n: 3, puntos: 1 }
    - { n: 4, puntos: 1 }
    - { n: 5, puntos: 2 }
    - { n: 6, puntos: 2 }
    - { n: 7, puntos: 2 }

