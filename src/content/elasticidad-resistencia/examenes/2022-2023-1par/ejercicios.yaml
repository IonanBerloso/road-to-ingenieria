      <path d="M66 140 A84 84 0 0 1 90.6 80.6" fill="none" stroke="var(--faint)" stroke-width="1"/><polygon points="90.6,80.6 88.1,86.5 84.7,83.1" fill="var(--faint)"/><polygon points="66,140 63.6,134 68.4,134" fill="var(--faint)"/><text x="52" y="104" font-size="11" fill="var(--faint)">45°</text>
      </svg>
      <figcaption>

      Redibujada del enunciado: la galga a forma 30° con X y la b, 45° con
      el semieje negativo de X.

      </figcaption>
      </figure>

      **Notas nuestras.** En el PDF la línea de datos se corta después de
      $\varepsilon_a$. El Word original sigue con $\varepsilon_b = 1200\cdot10^{-6}$
      y, detrás, un segundo «$\varepsilon_b = 2\cdot10^{-6}$» que no se ve en el
      cuadernillo y que coincide con la galga b del parcial de 2020; se toma
      el primero, que es el que sigue a $\varepsilon_a$ en la línea de datos.
      El segundo se lee como un resto del examen de 2020.
    pide: >-
      Los dos tensores, las tensiones principales, la τ máxima, los factores
      de seguridad de deformación máxima, Mohr y Tresca, y las direcciones en
      XY donde σ = 2τmax/3.
    pasos:
      - tipo: reconocer
        pregunta: |
          Hay dos galgas y cuatro componentes conocidas. ¿Qué se saca de las
          galgas?
        opciones:
          - texto: >-
              $\sigma_x$ y $\sigma_y$: cada galga da una ecuación en ellas, con
              $\gamma_{xy} = \tau_{xy}/G$ conocida y $\sigma_z$ dentro de Hooke
            correcta: true
            mensaje: |
              Eso es. Dos incógnitas y dos lecturas. Y como $\sigma_z \ne 0$ no
              es tensión plana: $\varepsilon_x = [\sigma_x - \nu(\sigma_y+\sigma_z)]/E$
              lleva el $-100$ dentro.
          - texto: >-
              $\varepsilon_x$, $\varepsilon_y$ y $\gamma_{xy}$, como en una
              roseta de tres galgas
            mensaje: |
              Con dos galgas no salen tres incógnitas. Aquí sobra una:
              $\gamma_{xy}$ ya se conoce por $\tau_{xy}/G$. Lo que falta son
              $\varepsilon_x$ y $\varepsilon_y$, o, lo que es lo mismo,
              $\sigma_x$ y $\sigma_y$.
          - texto: >-
              Es tensión plana: se usan las ecs. de $1-\nu^{2}$ y $\sigma_z$ no
              interviene
            mensaje: |
              Tensión plana es $\sigma_z = 0$, y aquí vale $-100$ MPa. Las
              fórmulas con $1-\nu^{2}$ no valen; hay que ir a Hooke en 3D.
          - texto: Las galgas dan directamente $\varepsilon_x$ y $\varepsilon_y$
            mensaje: |
              Ninguna galga está según X ni según Y: están a 30° y a 135°. Cada
              una mezcla $\varepsilon_x$, $\varepsilon_y$ y $\gamma_{xy}$ (ec. 3.55).
      - tipo: calcular
        titulo: La distorsión γxy
        pregunta: |
          ¿Cuánto vale $\gamma_{xy}$, en unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '371.43'
          tolerancia: 0.2
          formato: un número, en 10⁻⁶
        distractores:
          - valor: '142.86'
            mensaje: |
              Has dividido entre $E$. La distorsión es $\tau/G$, con
              $G = E/2(1+\nu) = 80\,769$ MPa.
          - valor: '185.71'
            mensaje: |
              Es $\tfrac{1}{2}\gamma_{xy}$, lo que va fuera de la diagonal del
              tensor (ec. 3.35). La pregunta es por $\gamma_{xy}$ entera.
        pista: |
          $G = 210\,000/2{,}6$ MPa.
        desarrollo: |
          $$
          G = \frac{210\,000}{2(1+0{,}3)} = 80\,769\ \text{MPa},\qquad
          \gamma_{xy} = \frac{30}{80\,769} = 371{,}43\cdot10^{-6}
          $$
      - tipo: calcular
        titulo: La tensión σx
        pregunta: |
          Plantea las dos galgas con $\varepsilon_\theta = \varepsilon_x\cos^{2}\theta + \varepsilon_y\operatorname{sen}^{2}\theta + \gamma_{xy}\operatorname{sen}\theta\cos\theta$
          y Hooke en 3D. ¿Cuánto vale $\sigma_x$, en MPa?
        respuesta:
          tipo: numero
          valor: '163.97'
          tolerancia: 0.5
          formato: un número, en MPa
        distractores:
          - valor: '206.83'
            mensaje: |
              Has dejado fuera $\sigma_z$, como en tensión plana. Con
              $\sigma_z = -100$, cada deformación normal en XY gana
              $+\nu\cdot100/E$, y eso cambia las tensiones.
          - valor: '172.54'
            mensaje: |
              Has puesto la galga b a 45°. Está a 45° del semieje **negativo**
              de X, o sea a 135°: $\operatorname{sen}\theta\cos\theta = -1/2$, y
              $\gamma_{xy}$ entra restando.
          - valor: '198.59'
            mensaje: |
              Es el $\sigma_x$ que sale con $\gamma_{xy} = \tau_{xy}/E$. Vuelve al
              paso anterior: la distorsión va con $G$.
        pista: |
          Galga b (135°): $\varepsilon_b = \tfrac{1}{2}(\varepsilon_x+\varepsilon_y) - \tfrac{1}{2}\gamma_{xy}$.
          Galga a (30°): $\varepsilon_a = \tfrac{3}{4}\varepsilon_x + \tfrac{1}{4}\varepsilon_y + \tfrac{\sqrt{3}}{4}\gamma_{xy}$.
        desarrollo: |
          De la galga b, $\varepsilon_x + \varepsilon_y = 2400 + 371{,}43 = 2771{,}43$
          (en $10^{-6}$). De la a, $\tfrac{1}{2}\varepsilon_x = 900 - 160{,}83 -
          692{,}86$, así que $\varepsilon_x = 92{,}62$ y $\varepsilon_y = 2678{,}81$.

          $$
          \sigma_x - \nu\sigma_y = E\varepsilon_x + \nu\sigma_z = -10{,}55,\qquad
          \sigma_y - \nu\sigma_x = E\varepsilon_y + \nu\sigma_z = 532{,}55
          $$

          $$
          \sigma_x = \frac{-10{,}55 + 0{,}3\cdot532{,}55}{0{,}91} = 163{,}97\ \text{MPa},\qquad
          \sigma_y = 532{,}55 + 0{,}3\cdot163{,}97 = 581{,}74\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La mayor tensión principal
        pregunta: |
          ¿Cuánto vale $\sigma_1$, en MPa?
        respuesta:
          tipo: numero
          valor: '583.89'
          tolerancia: 0.5
          formato: un número, en MPa
        distractores:
          - valor: '161.83'
            mensaje: |
              Es $\sigma_2$: has restado el radio en vez de sumarlo. El círculo
              de XY tiene centro 372,86 y radio 211,03; la mayor es
              $C + R$.
          - valor: '372.86'
            mensaje: |
              Es el centro del círculo de Mohr de XY. Falta sumarle el radio,
              $\sqrt{208{,}88^{2} + 30^{2}} = 211{,}03$.
        pista: |
          Z es principal ($\tau_{xz} = \tau_{yz} = 0$). En XY, centro
          $(\sigma_x+\sigma_y)/2$ y radio $\sqrt{((\sigma_x-\sigma_y)/2)^{2} + \tau_{xy}^{2}}$.
        desarrollo: |
          $$
          C = 372{,}86,\quad R = 211{,}03\ \text{MPa}
          \;\Longrightarrow\;
          \sigma_1 = 583{,}89,\quad \sigma_2 = 161{,}83,\quad \sigma_3 = \sigma_z = -100\ \text{MPa}
          $$

          La traza se conserva: $583{,}89 + 161{,}83 - 100 = 645{,}71 =
          163{,}97 + 581{,}74 - 100$.
      - tipo: calcular
        titulo: La tensión tangencial máxima
        pregunta: |
          ¿Cuánto vale $\tau_{max}$, en MPa?
        respuesta:
          tipo: numero
          valor: '341.94'
          tolerancia: 0.5
          formato: un número, en MPa
        distractores:
          - valor: '211.03'
            mensaje: |
              Es el radio del círculo de XY, $(\sigma_1-\sigma_2)/2$. La máxima
              del punto es la del círculo grande, entre $\sigma_1$ y
              $\sigma_3 = -100$, que aquí es Z.
          - valor: '130.91'
            mensaje: |
              Es $(\sigma_2-\sigma_3)/2$, el círculo pequeño. La máxima va entre
              la mayor y la menor principal.
        pista: |
          $\tau_{max} = (\sigma_1-\sigma_3)/2$ con $\sigma_3 = -100$.
        desarrollo: |
          $$
          \tau_{max} = \frac{583{,}89 + 100}{2} = 341{,}94\ \text{MPa}
          $$
      - tipo: calcular
        titulo: El factor de seguridad de deformación máxima
        pregunta: |
          Con el criterio de deformación máxima (Saint-Venant), ¿cuánto vale el
          factor de seguridad?
        respuesta:
          tipo: numero
          valor: '1.4151'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '1.3701'
            mensaje: |
              Has comparado $\sigma_1$ con el límite, $800/583{,}89$, que es
              Rankine. Saint-Venant usa $E\,\varepsilon_{max}$, y la
              deformación principal mayor lleva el efecto Poisson de las otras
              dos: $E\varepsilon_1 = 583{,}89 - 0{,}3(161{,}83 - 100) = 565{,}34$.
          - valor: '1.3279'
            mensaje: |
              Has sumado el término de Poisson: $\sigma_1 + \nu(\sigma_2+\sigma_3)
              = 602{,}44$. En Hooke va restando, $\varepsilon_1 = [\sigma_1 -
              \nu(\sigma_2+\sigma_3)]/E$; aquí $\sigma_2 + \sigma_3 = 61{,}83$ es
              positivo y le quita deformación a la dirección 1.
        pista: |
          $\varepsilon_1 = [\sigma_1 - \nu(\sigma_2+\sigma_3)]/E$, y es la de
          mayor valor absoluto; se compara con el límite de tracción.
        desarrollo: |
          $$
          E\varepsilon_1 = 583{,}89 - 0{,}3\,(161{,}83 - 100) = 565{,}34\ \text{MPa},\qquad
          E\varepsilon_3 = -100 - 0{,}3\,(745{,}71) = -323{,}71\ \text{MPa}
          $$

          $$
          FS = \frac{800}{565{,}34} = 1{,}415
          $$
      - tipo: calcular
        titulo: El factor de seguridad de Mohr
        pregunta: |
          ¿Y según el criterio de los estados límites de Mohr?
        respuesta:
          tipo: numero
          valor: '1.2050'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '1.1698'
            mensaje: |
              Es Tresca: has usado $k = 1$. Con límites distintos,
              $k = 800/1000 = 0{,}8$ y $\sigma_{eqv} = \sigma_1 - 0{,}8\sigma_3$.
          - valor: '1.5877'
            mensaje: |
              Has sumado $k\sigma_3$: $583{,}89 - 80$. Es $\sigma_1 - k\sigma_3$
              con $\sigma_3 = -100$, así que el término **suma** 80:
              $\sigma_{eqv} = 663{,}89$.
        pista: |
          $k = \sigma_{et}/\sigma_{ec} = 0{,}8$; $\sigma_{eqv} = \sigma_1 - k\sigma_3$.
        desarrollo: |
          $$
          \sigma_{eqv} = 583{,}89 - 0{,}8\,(-100) = 663{,}89\ \text{MPa},\qquad
          FS = \frac{800}{663{,}89} = 1{,}205
          $$
      - tipo: calcular
        titulo: El factor de seguridad de Tresca
        pregunta: |
          ¿Y según Tresca, con el límite de tracción?
        respuesta:
          tipo: numero
          valor: '1.1698'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '1.8955'
            mensaje: |
              Has usado $\sigma_1 - \sigma_2$, como si el problema fuera plano.
              La menor principal es $\sigma_3 = -100$ (Z), y Tresca va con
              $\sigma_1 - \sigma_3$.
          - valor: '1.3701'
            mensaje: |
              Es $800/\sigma_1$, Rankine. Tresca compara la diferencia
              $\sigma_1 - \sigma_3$, el diámetro del círculo grande.
        pista: |
          $\sigma_{eqv} = \sigma_1 - \sigma_3 = 2\tau_{max}$.
        desarrollo: |
          $$
          \sigma_{eqv} = 583{,}89 + 100 = 683{,}89\ \text{MPa},\qquad
          FS = \frac{800}{683{,}89} = 1{,}170
          $$

          Es el más exigente de los tres, como corresponde a un criterio que
          usa el círculo entero con el límite menor.
      - tipo: calcular
        titulo: La dirección con σθ = 2τmax/3
        pregunta: |
          Un plano paralelo a Z tiene la normal en XY, a un ángulo $\theta$ de X.
          ¿Para qué $\theta$ vale $\sigma_\theta = \tfrac{2}{3}\tau_{max}$?
          Entre 0° y 180° hay dos; da una.
        respuesta:
          tipo: numero
          valor: '19.232'
          tolerancia: 0.05
          formato: un número, en grados, medido desde X en sentido antihorario
        tambienValen:
          - valor: '152.595'
            mensaje: |
              También vale: es la otra solución, simétrica respecto de la
              dirección principal 1 (85,91°). Hay dos planos paralelos a Z con
              esa tensión normal.
        distractores:
          - valor: '38.464'
            mensaje: |
              Es $2\theta$, el ángulo en el círculo de Mohr. En el sólido el
              ángulo es la mitad.
          - valor: '85.914'
            mensaje: |
              Es la dirección principal 1, donde $\sigma = \sigma_1 = 583{,}89$.
              El objetivo es $227{,}96$ MPa, más bajo que el centro: la
              dirección queda a $66{,}7°$ de la principal.
        pista: |
          $\sigma_\theta = C + R\cos(2\theta - 2\theta_1) = 227{,}96$, con
          $\tan 2\theta_1 = 2\tau_{xy}/(\sigma_x-\sigma_y)$ y $2\theta_1 = 171{,}83°$.
        desarrollo: |
          $$
          \cos(2\theta - 2\theta_1) = \frac{227{,}96 - 372{,}86}{211{,}03} = -0{,}6866
          \;\Longrightarrow\; 2\theta - 2\theta_1 = \pm133{,}36°
          $$

          $$
          \theta = 85{,}91° \pm 66{,}68° \;\Longrightarrow\;
          \theta = 19{,}23°\quad\text{o}\quad \theta = 152{,}60°
          $$

          Comprobación: $163{,}97\cos^{2}19{,}23° + 581{,}74\operatorname{sen}^{2}19{,}23° + 30\operatorname{sen}38{,}46° = 227{,}96$ MPa.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\gamma_{xy} = \tau_{xy}/G = 371{,}43\cdot10^{-6}$; las galgas a 30° y a
              135° dan $\varepsilon_x = 92{,}6\cdot10^{-6}$ y $\varepsilon_y = 2678{,}8\cdot10^{-6}$.
          - texto: >-
              Hooke en 3D con $\sigma_z = -100$ da $\sigma_x = 163{,}97$ y
              $\sigma_y = 581{,}74$ MPa, y $\varepsilon_z = -1541{,}5\cdot10^{-6}$.
          - texto: >-
              Z es principal: $\sigma_1 = 583{,}89$, $\sigma_2 = 161{,}83$,
              $\sigma_3 = -100$ MPa, y $\tau_{max} = 341{,}94$ MPa.
          - texto: >-
              FS = 1,415 (deformación máxima), 1,205 (Mohr, k = 0,8) y 1,170
              (Tresca); $\sigma_\theta = 227{,}96$ MPa en $\theta = 19{,}23°$ y 152,60°.
          - texto: >-
              Como el estado es plano en XY, $\tau_{max}$ es el radio del círculo
              de XY, 211,03 MPa.
            trampa: true
            mensaje: |
              No es plano: $\sigma_z = -100$ MPa. Y aunque lo fuera, la
              tercera principal (0 o $\sigma_z$) entra en la cuenta de
              $\tau_{max}$. Aquí el círculo grande va de $-100$ a $583{,}89$.
    resolucion: |
      **La idea.** Se conocen $\tau_{xy}$, $\sigma_z$ y las tangenciales con
      Z; faltan $\sigma_x$ y $\sigma_y$, y hay dos galgas. Cada galga es una
      ecuación lineal. No es tensión plana: $\sigma_z$ entra en Hooke.

      **a) Los tensores.** $G = E/2(1+\nu) = 80\,769$ MPa y $\gamma_{xy} =
      \tau_{xy}/G = 371{,}43\cdot10^{-6}$. Las galgas (ec. 3.55 de los apuntes
      del tema 3), con a a 30° y b a 135°:

      $$
      \varepsilon_b = \tfrac{1}{2}(\varepsilon_x+\varepsilon_y) - \tfrac{1}{2}\gamma_{xy} = 1200,\qquad
      \varepsilon_a = \tfrac{3}{4}\varepsilon_x + \tfrac{1}{4}\varepsilon_y + \tfrac{\sqrt{3}}{4}\gamma_{xy} = 900
      $$

      (en $10^{-6}$), de donde $\varepsilon_x = 92{,}62$ y $\varepsilon_y = 2678{,}81$.
      Con Hooke en 3D (apuntes del tema 4, ec. 4.2), $\sigma_x - \nu\sigma_y =
      E\varepsilon_x + \nu\sigma_z$ y $\sigma_y - \nu\sigma_x = E\varepsilon_y + \nu\sigma_z$:

      $$
      [\sigma] = \begin{bmatrix} 163{,}97 & 30 & 0 \\ 30 & 581{,}74 & 0 \\ 0 & 0 & -100 \end{bmatrix}\ \text{MPa},\qquad
      [\varepsilon] = \begin{bmatrix} 92{,}62 & 185{,}71 & 0 \\ 185{,}71 & 2678{,}81 & 0 \\ 0 & 0 & -1541{,}50 \end{bmatrix}\cdot10^{-6}
      $$

      con $\varepsilon_z = [\sigma_z - \nu(\sigma_x+\sigma_y)]/E$.

      **b) Principales.** Z ya es principal. En XY, $C = 372{,}86$ y
      $R = 211{,}03$ MPa:

      $$
      \sigma_1 = 583{,}89,\qquad \sigma_2 = 161{,}83,\qquad \sigma_3 = -100\ \text{MPa}
      $$

      La dirección 1 forma $\theta_1 = 85{,}91°$ con X. La traza se conserva:
      645,71 MPa en los dos sistemas.

      **c)** $\tau_{max} = (\sigma_1-\sigma_3)/2 = 341{,}94$ MPa.

      **d) Factores de seguridad** (apuntes del tema 6):

      - Deformación máxima: $E\varepsilon_1 = \sigma_1 - \nu(\sigma_2+\sigma_3) = 565{,}34$
        MPa, mayor en módulo que $E\varepsilon_3 = -323{,}71$; $FS = 800/565{,}34 = 1{,}415$.
      - Mohr, $k = 800/1000 = 0{,}8$: $\sigma_{eqv} = 583{,}89 + 80 = 663{,}89$; $FS = 1{,}205$.
      - Tresca: $\sigma_{eqv} = \sigma_1 - \sigma_3 = 683{,}89$; $FS = 1{,}170$.

      **e) El plano paralelo a Z.** Su normal está en XY. Se busca
      $\sigma_\theta = \tfrac{2}{3}\cdot341{,}94 = 227{,}96$ MPa:

      $$
      \cos(2\theta - 2\theta_1) = \frac{227{,}96 - 372{,}86}{211{,}03} = -0{,}6866
      \;\Longrightarrow\; \theta = 19{,}23°\ \text{o}\ 152{,}60°
      $$

      medidos desde X en sentido antihorario: los dos planos simétricos
      respecto de la dirección principal 1.

  # ── Problema 3 · la barra rígida BE con la barra 1, el resorte y la
  #    temperatura. Impreso «1. (2p)» otra vez: es el tercer problema.
  - id: exerm2223-1par-7-la-barra-rigida-con-resorte-y-temperatura
    titulo: La barra rígida con una barra calentada y un resorte
    fuente: >-
      Problema 3 (impreso «1.» otra vez) · Primer parcial del 18 de noviembre
      de 2022 · Elasticidad y Resistencia de Materiales, Escuela de Ingeniería
      de Gipuzkoa (UPV/EHU). Vale 2 puntos. El examen no publica resolución;
      el desarrollo es nuestro, con el convenio del tema 8.
    nivel: examen
    enunciado: |
      (2p) En la estructura de la figura la barra BE es infinitamente rígida.
      Las propiedades de las barras 1 y el resorte son las siguientes:

      $$
      E,\ A,\ K = \frac{EA}{500\,a},\quad \alpha = \frac{200}{EA},
      $$

      Determinar:

      a) La fuerza interna de la barra y el resorte, si se aplica una carga P
      en E, teniendo en cuenta que la barra sufre un cambio de temperatura ∆T.

      b) Desplazamiento vertical del punto E

      c) Diagramas de de fuerzas y momentos de sección siendo P=1000Kg y la
      variación de Temperatura 100ºC.

      <figure class="figura-examen">
