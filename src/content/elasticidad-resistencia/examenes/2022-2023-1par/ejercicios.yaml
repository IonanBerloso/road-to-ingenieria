      <figcaption>

      Redibujada del enunciado. El «1» de la barra AC es nuestro: el
      original no la rotula.

      </figcaption>
      </figure>

      **Notas nuestras.** Las fórmulas de K y α salen cortadas en el PDF y se
      han leído en el Word original. La barra 1 es AC, y A está en la pared,
      por encima de B, donde la barra forma 60° con BE: mide $2a$.
    pide: >-
      N1 y la fuerza del resorte en función de P y ΔT, el descenso de E, y los
      diagramas con P = 1000 kg y ΔT = 100 °C.
    pasos:
      - tipo: reconocer
        pregunta: |
          BE gira un ángulo pequeño $\theta$ alrededor de B. ¿Cuánto se alarga
          la barra 1?
        opciones:
          - texto: >-
              La proyección del descenso de C sobre la barra:
              $\Delta L_1 = \theta a\operatorname{sen}60° = \tfrac{\sqrt{3}}{2}\theta a$
            correcta: true
            mensaje: |
              Eso es: «el arco se sustituye por la tangente» y el alargamiento
              es la proyección del desplazamiento del extremo sobre la barra
              (apuntes del tema 8, ecs. 8.10 a 8.12). C baja $\theta a$, y la
              barra forma 60° con la horizontal.
          - texto: Todo el descenso de C, $\theta a$
            mensaje: |
              Solo cuenta la componente del desplazamiento según la barra. La
              perpendicular hace girar la barra 1 sin alargarla.
          - texto: $\theta a\cos60° = \theta a/2$
            mensaje: |
              El desplazamiento de C es vertical y la barra forma 60° con la
              horizontal, es decir 30° con la vertical: la proyección lleva
              $\cos30° = \operatorname{sen}60°$.
          - texto: >-
              Solo lo que le da la temperatura, $\alpha\Delta T\cdot 2a$, porque
              la barra es la que sostiene a BE
            mensaje: |
              La temperatura es una parte; la otra es la elástica, $N_1L_1/EA$.
              Lo que la compatibilidad impone es que **la suma** valga lo que
              la geometría deja: $\tfrac{\sqrt{3}}{2}\theta a$.
      - tipo: calcular
        titulo: La fuerza en la barra 1
        pregunta: |
          Con P = 1000 kg y ΔT = 100 °C, ¿cuánto vale $N_1$, en kg (positivo a
          tracción)?
        respuesta:
          tipo: numero
          valor: '2973.99'
          tolerancia: 1
          formato: un número, en kg
        distractores:
          - valor: '3391.74'
            mensaje: |
              Es el axil sin temperatura, $\tfrac{750\sqrt{3}}{383}P$. Calentar la
              barra la alarga, BE baja un poco más, el resorte coge más carga
              y la barra 1 descarga: $-\tfrac{1600}{383}\Delta T$.
          - valor: '3809.50'
            mensaje: |
              La temperatura ha entrado con el signo cambiado. $\Delta L_1 =
              N_1L_1/EA + \alpha\Delta T L_1$: el término térmico **suma** al
              alargamiento, y para el mismo giro deja menos alargamiento
              elástico.
          - valor: '2637.80'
            mensaje: |
              Has tomado el alargamiento de la barra igual al descenso de C, y
              su fuerza entera como vertical. Las dos cosas llevan
              $\operatorname{sen}60°$: el alargamiento es $\tfrac{\sqrt{3}}{2}\theta a$
              y la componente vertical, $\tfrac{\sqrt{3}}{2}N_1$.
          - valor: '3216.46'
            mensaje: |
              Has tomado la longitud de la barra 1 igual a $a$. Es $a/\cos60° = 2a$.
        pista: |
          Momentos en B: $3Pa = \tfrac{\sqrt{3}}{2}N_1 a + 2a\,F_K$.
          Compatibilidad: $\tfrac{\sqrt{3}}{2}\theta a = \tfrac{N_1\,2a}{EA} + \alpha\Delta T\,2a$,
          y $F_K = K\cdot2a\theta$.
        desarrollo: |
          De la compatibilidad, $\theta = \tfrac{4}{\sqrt{3}}\left(\tfrac{N_1}{EA} + \alpha\Delta T\right)$,
          y con $K = EA/500a$ y $\alpha = 200/EA$:

          $$
          F_K = \frac{EA}{250}\,\theta = \frac{2\sqrt{3}}{375}\left(N_1 + 200\,\Delta T\right)
          $$

          Al equilibrio:

          $$
          N_1 = \frac{750\sqrt{3}}{383}\,P - \frac{1600}{383}\,\Delta T
          = 3{,}3917\,P - 4{,}1775\,\Delta T = 2973{,}99\ \text{kg}
          $$
      - tipo: calcular
        titulo: La fuerza en el resorte
        pregunta: |
          ¿Cuánto vale la fuerza del resorte, en kg (positiva a compresión)?
        respuesta:
          tipo: numero
          valor: '212.22'
          tolerancia: 0.2
          formato: un número, en kg
        distractores:
          - valor: '31.33'
            mensaje: |
              Es la fuerza sin temperatura, $\tfrac{12}{383}P$. La dilatación de
              la barra 1 hace bajar BE y comprime más el resorte:
              $+\tfrac{400\sqrt{3}}{383}\Delta T = 180{,}9$ kg.
          - valor: '-149.56'
            mensaje: |
              Has metido la temperatura con el signo cambiado. Calentar la
              barra 1 la alarga, y como cuelga de la pared por encima, empuja C
              hacia abajo: el resorte se comprime más, no menos.
        pista: |
          $F_K = \tfrac{2\sqrt{3}}{375}(N_1 + 200\Delta T)$, o del equilibrio:
          $F_K = (3P - \tfrac{\sqrt{3}}{2}N_1)/2$.
        desarrollo: |
          $$
          F_K = \frac{12}{383}\,P + \frac{400\sqrt{3}}{383}\,\Delta T
          = 31{,}33 + 180{,}89 = 212{,}22\ \text{kg (compresión)}
          $$

          Comprobación por momentos en B: $\tfrac{\sqrt{3}}{2}\cdot2973{,}99 +
          2\cdot212{,}22 = 2575{,}55 + 424{,}45 = 3000 = 3P$.
      - tipo: calcular
        titulo: El descenso de E
        pregunta: |
          ¿Cuánto vale el descenso de E? Da $v_E\cdot EA/a$, en kg.
        respuesta:
          tipo: numero
          valor: '159168'
          tolerancia: 50
          formato: un número, el descenso en unidades de a/EA
        distractores:
          - valor: '23498.7'
            mensaje: |
              Es el descenso sin temperatura. El término térmico es el que
              manda aquí: $\alpha\Delta T = 2\cdot10^{4}/EA$ es casi siete veces
              lo que alarga $N_1$.
          - valor: '53056'
            mensaje: |
              Es el descenso de C, $\theta a$. E está a $3a$ de B: $v_E = 3a\theta$.
          - valor: '106112'
            mensaje: |
              Es el descenso de D, $2a\theta$. E está a $3a$ de B.
        pista: |
          $v_E = 3a\theta$ con $\theta = \tfrac{4}{\sqrt{3}}\,\tfrac{N_1 + 200\Delta T}{EA}$.
        desarrollo: |
          $$
          v_E = 3a\theta = 4\sqrt{3}\,\frac{a}{EA}\,(N_1 + 200\,\Delta T)
          = \frac{a}{EA}\left(\frac{9000}{383}P + \frac{300\,000\sqrt{3}}{383}\Delta T\right)
          $$

          $$
          v_E = 4\sqrt{3}\cdot22\,973{,}99\,\frac{a}{EA} = 159\,168\,\frac{a}{EA}
          $$

          hacia abajo (con $a$ en cm y $EA$ en kg, en cm).
      - tipo: calcular
        titulo: El flector en C
        pregunta: |
          En la barra BE, ¿cuánto vale el momento flector en C? Da $M_C/a$, en
          kg, con el signo del curso (positivo si tracciona la fibra inferior).
        respuesta:
          tipo: numero
          valor: '-1787.78'
          tolerancia: 1
          formato: un número, M en unidades de a
        distractores:
          - valor: '1787.78'
            mensaje: |
              El valor está bien y el signo no. A la derecha de C, P tira hacia
              abajo en el voladizo y el resorte no llega a compensarlo: la
              barra se curva con la fibra superior traccionada, y eso es
              flector negativo en el convenio del curso.
          - valor: '-2000'
            mensaje: |
              Te has dejado el resorte. Desde la derecha, $M_C = -P\cdot2a +
              F_K\cdot a$, y $F_K$ empuja hacia arriba.
        pista: |
          Corta en C y mira a la derecha: P a $2a$ hacia abajo y $F_K$ a $a$
          hacia arriba.
        desarrollo: |
          $$
          M_C = -P\cdot2a + F_K\,a = (-2000 + 212{,}22)\,a = -1787{,}78\,a\ \text{kg}
          $$

          Desde la izquierda sale igual: $M_C = B_y\cdot a$ con $B_y = -1787{,}78$
          kg (la articulación tira de B hacia abajo).
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              BE gira $\theta$ en B: C baja $\theta a$, D baja $2a\theta$ y E,
              $3a\theta$.
          - texto: >-
              La barra 1 mide $2a$ y se alarga $\tfrac{\sqrt{3}}{2}\theta a =
              \tfrac{2aN_1}{EA} + 2a\,\alpha\Delta T$; el resorte, $F_K = K\cdot2a\theta$.
          - texto: >-
              Momentos en B: $3Pa = \tfrac{\sqrt{3}}{2}N_1a + 2aF_K$, de donde
              $N_1 = 2974$ kg y $F_K = 212$ kg.
          - texto: >-
              $v_E = 159\,168\,a/EA$, y en BE: $N = -1487$ kg en BC, $M_C = -1788a$
              y $M_D = -1000a$.
          - texto: >-
              Calentar la barra 1 la alarga y levanta BE, así que el resorte se
              descarga.
            trampa: true
            mensaje: |
              La barra 1 cuelga de A, por encima de C. Si se alarga, C queda más
              lejos de A, es decir, más abajo: BE baja y el resorte se comprime
              más.
    resolucion: |
      **La idea.** BE es rígida y articulada en B: un solo grado de libertad,
      el giro $\theta$. Dos elementos elásticos la sostienen —la barra 1 y el
      resorte—, así que es hiperestático de grado 1: equilibrio y una
      ecuación de compatibilidad (apuntes del tema 8).

      **Geometría.** A está en la pared, a $\sqrt{3}\,a$ por encima de B; la
      barra 1 va de A a C, mide $2a$ y forma 60° con BE.

      **Compatibilidad.** C baja $\theta a$; su proyección sobre la barra es
      el alargamiento (ecs. 8.9 a 8.12):

      $$
      \frac{\sqrt{3}}{2}\,\theta a = \frac{N_1\cdot2a}{EA} + \alpha\Delta T\cdot2a,\qquad
      F_K = K\cdot2a\,\theta = \frac{EA}{250}\,\theta
      $$

      **Equilibrio** (momentos en B, P hacia abajo en E):

      $$
      3Pa = \frac{\sqrt{3}}{2}N_1\,a + 2a\,F_K
      $$

      **a) Las fuerzas.** Con $\alpha = 200/EA$:

      $$
      N_1 = \frac{750\sqrt{3}}{383}P - \frac{1600}{383}\Delta T,\qquad
      F_K = \frac{12}{383}P + \frac{400\sqrt{3}}{383}\Delta T
      $$

      Con P = 1000 kg y ΔT = 100 °C: $N_1 = 2973{,}99$ kg (tracción) y
      $F_K = 212{,}22$ kg (compresión).

      **b) El descenso de E.**

      $$
      v_E = 3a\theta = \frac{a}{EA}\left(\frac{9000}{383}P + \frac{300\,000\sqrt{3}}{383}\Delta T\right)
      = 159\,168\,\frac{a}{EA}\ \text{(hacia abajo)}
      $$

      **c) Los diagramas.** La barra 1 lleva $N_1 = 2973{,}99$ kg de tracción,
      constante. En BE, con las reacciones de B ($B_x = N_1/2 = 1486{,}99$ kg
      hacia la derecha y $B_y = P - \tfrac{\sqrt{3}}{2}N_1 - F_K = -1787{,}78$ kg,
      es decir, hacia abajo):

      | tramo | N (kg) | V (kg) | M |
      |---|---|---|---|
      | BC | −1486,99 | −1787,78 | de 0 a −1787,78·a |
      | CD | 0 | 787,78 | de −1787,78·a a −1000·a |
      | DE | 0 | 1000 | de −1000·a a 0 |

      Convenio del curso (tema 7): N > 0 a tracción, V positivo según la $y$
      local hacia abajo en la cara derecha de la parte izquierda, M > 0 si
      tracciona la fibra inferior; $dM/dx = V$ en cada tramo. El flector es
      negativo en toda la barra: la fibra superior va traccionada, con el
      máximo en C.

      <figure class="figura-examen">
      <svg viewBox="0 0 380 280" role="img" width="380" height="280" aria-labelledby="exerm2223-1par-7-la-barra-rigida-con-resorte-y-temperatura-dia-t exerm2223-1par-7-la-barra-rigida-con-resorte-y-temperatura-dia-d">
      <title id="exerm2223-1par-7-la-barra-rigida-con-resorte-y-temperatura-dia-t">Los diagramas de N, V y M de la barra BE</title>
      <desc id="exerm2223-1par-7-la-barra-rigida-con-resorte-y-temperatura-dia-d">Tres diagramas sobre la barra BE, con B, C, D y E marcados. Axil: −1487 kg (compresión) entre B y C, y cero entre C y E. Cortante: −1788 kg entre B y C, 788 kg entre C y D y 1000 kg entre D y E. Flector: cero en B, −1788a en C, −1000a en D y cero en E, lineal en cada tramo y siempre negativo: tracciona la fibra superior.</desc>
      <line x1="70" y1="44" x2="340" y2="44" stroke="var(--ink)" stroke-width="1.2"/><text x="14" y="48" font-size="12" font-weight="bold" fill="var(--ink)">N</text>
      <path d="M70 44 V70.4 H160 V44 Z" fill="var(--d4)" fill-opacity=".25" stroke="var(--d4)" stroke-width="1.2"/>
