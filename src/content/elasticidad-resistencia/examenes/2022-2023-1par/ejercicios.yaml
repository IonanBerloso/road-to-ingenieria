      <line x1="150" y1="256" x2="240" y2="256" stroke="var(--faint)" stroke-width="1"/><polygon points="240,256 233,258.6 233,253.4" fill="var(--faint)"/><polygon points="150,256 157,253.4 157,258.6" fill="var(--faint)"/><text x="195" y="251" text-anchor="middle" font-size="12" font-style="italic" fill="var(--faint)">a</text>
      <line x1="240" y1="256" x2="330" y2="256" stroke="var(--faint)" stroke-width="1"/><polygon points="330,256 323,258.6 323,253.4" fill="var(--faint)"/><polygon points="240,256 247,253.4 247,258.6" fill="var(--faint)"/><text x="285" y="251" text-anchor="middle" font-size="12" font-style="italic" fill="var(--faint)">a</text>
