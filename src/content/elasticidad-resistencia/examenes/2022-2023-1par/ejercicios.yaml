ejercicios:
  # ── Teoría · cuestión 1 · la parte antisimétrica no cambia la longitud.
  #    Literal en el parcial del 20/11/2020 (cuestión 1): la unidad p2b la
  #    reutiliza tal cual, cambiando solo `fuente` e `id`.
  - id: exerm2223-1par-1-la-rotacion-no-cambia-la-longitud
    titulo: La parte antisimétrica de la transformación, y por qué no cambia la longitud
    fuente: >-
      Cuestión 1 de teoría · Primer parcial del 18 de noviembre de 2022 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Cayó palabra por palabra en los
      primeros parciales del 15 de noviembre de 2019 y del 20 de noviembre de
      2020. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 3, apartado 3.5.1.
    nivel: examen
    enunciado: |
      (1p) Proceso de deformación. En la parte antisimétrica de la
      transformación, un elemento de longitud se transforma según:

      $$
      \overrightarrow{dr'} = \overrightarrow{dr} + \vec{\Omega} \times \overrightarrow{dr}
      $$

      Deducir cuál es la nueva longitud del elemento y explicar qué ocurre
      cuando las componentes del vector rotación $\vec{\Omega}$ son números
      pequeños.
    pide: >-
      El módulo de dr' en función de dr, de Ω y del ángulo entre los dos, y qué
      queda de él en un problema de pequeños desplazamientos.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular: ¿qué relación hay entre el vector
          $\vec{\Omega}\times\overrightarrow{dr}$ y el propio $\overrightarrow{dr}$?
        opciones:
          - texto: >-
              Es perpendicular a $\overrightarrow{dr}$, así que su producto
              escalar con $\overrightarrow{dr}$ es nulo
            correcta: true
            mensaje: |
              Eso es. Un producto vectorial es perpendicular a sus dos
              factores. Al desarrollar $|\overrightarrow{dr'}|^{2}$ el término
              cruzado $2\,\overrightarrow{dr}\cdot(\vec{\Omega}\times\overrightarrow{dr})$
              desaparece, y solo queda el cuadrado de cada sumando.
          - texto: Es paralelo a $\overrightarrow{dr}$, y por eso lo alarga
            mensaje: |
              Al revés. Si fuera paralelo cambiaría la longitud a primer
              orden, y entonces la parte antisimétrica sería deformación. Lo
              que hace $\vec{\Omega}\times$ es empujar el extremo del elemento
              de lado, que es lo que hace un giro.
          - texto: Es nulo, porque la matriz antisimétrica tiene la diagonal nula
            mensaje: |
              La diagonal nula dice que la matriz no estira según los ejes, no
              que el producto se anule: $\vec{\Omega}\times\overrightarrow{dr}$
              vale $|\vec{\Omega}|\,|\overrightarrow{dr}|\operatorname{sen}\varphi$,
              y solo es cero si $\vec{\Omega}$ y $\overrightarrow{dr}$ son paralelos.
          - texto: >-
              Es el vector deformación del elemento, el que mide cuánto se
              alarga
            mensaje: |
              El vector deformación sale de la parte **simétrica**, la matriz
              $[\varepsilon]$ (ec. 3.46). La antisimétrica es la matriz de
              rotación, y el vector $\vec{\Omega}$ se forma con sus tres
              componentes (ec. 3.39).
      - tipo: calcular
        titulo: Lo que se alarga un elemento con una rotación pequeña
        pregunta: |
          Con $\vec{\Omega} = (0{,}01;\ 0{,}02;\ -0{,}02)$ y un elemento unitario
          según $x$, $\overrightarrow{dr} = (1, 0, 0)$, ¿cuánto vale el alargamiento
          relativo $\left(|\overrightarrow{dr'}| - |\overrightarrow{dr}|\right)/|\overrightarrow{dr}|$,
          multiplicado por $10^{4}$?
        respuesta:
          tipo: numero
          valor: '3.9992'
          tolerancia: 0.002
          formato: un número, el alargamiento relativo por 10⁴
        distractores:
          - valor: '0'
            mensaje: |
              Has aplicado el resultado final antes de tiempo. La longitud
              **no** se conserva exactamente: crece con
              $\sqrt{1+\Omega^{2}\operatorname{sen}^{2}\varphi}$. Lo que se
              desprecia en pequeños desplazamientos es este número, que aquí
              ves que es del orden de $\Omega^{2}$, cuatro diezmilésimas.
          - valor: '8'
            mensaje: |
              Te has quedado con $\Omega^{2}\operatorname{sen}^{2}\varphi =
              8\cdot10^{-4}$, que es lo que crece el **cuadrado** de la
              longitud. Falta la raíz: $\sqrt{1{,}0008} - 1 \approx 4\cdot10^{-4}$,
              la mitad.
          - valor: '4.499'
            mensaje: |
              Has usado $|\vec{\Omega}|^{2} = 9\cdot10^{-4}$ sin el
              $\operatorname{sen}^{2}\varphi$. La componente de $\vec{\Omega}$
              paralela al elemento ($\Omega_x = 0{,}01$) lo hace girar sobre sí
              mismo y no mueve su extremo: solo cuenta $|\vec{\Omega}\times\overrightarrow{dr}|^{2}
              = 0{,}02^{2} + 0{,}02^{2}$.
        pista: |
          $\vec{\Omega}\times\hat{\imath} = (0,\ \Omega_z,\ -\Omega_y)$, y
          $|\overrightarrow{dr'}| = \sqrt{1 + |\vec{\Omega}\times\hat{\imath}|^{2}}$.
        desarrollo: |
          $$
          \vec{\Omega}\times\hat{\imath} = (0,\ -0{,}02,\ -0{,}02),\qquad
          |\vec{\Omega}\times\hat{\imath}|^{2} = 8\cdot10^{-4}
          $$

          $$
          |\overrightarrow{dr'}| = \sqrt{1{,}0008} = 1{,}00039992
          \;\Longrightarrow\;
          \frac{\Delta|dr|}{|dr|} = 3{,}9992\cdot10^{-4}
          $$

          Es del orden de $\Omega^{2}/2$: si las componentes de $\vec{\Omega}$
          son centésimas, el cambio de longitud son diezmilésimas, y eso es lo
          que el curso desprecia.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción completa, como en el examen: la nueva longitud
          del elemento y qué pasa cuando las componentes de Ω son pequeñas.
        rubrica:
          - punto: >-
              Se calcula el cuadrado del módulo, dr'·dr', con la
              transformación del enunciado.
            porque: >-
              Es el único camino que no obliga a escribir componentes: el
              módulo se obtiene del producto escalar del vector por sí mismo.
            minimo: true
          - punto: >-
              Se anula el término cruzado 2 dr·(Ω×dr), diciendo por qué: el
              producto vectorial es perpendicular a dr.
            porque: >-
              Sin ese porqué la deducción es una afirmación. Es exactamente lo
              que la cuestión pregunta al decir «deducir».
            minimo: true
          - punto: >-
              Se escribe |Ω×dr| = Ω·dr·sen φ, con φ el ángulo entre Ω y dr, y
              se llega a |dr'| = |dr|·√(1 + Ω² sen² φ) (ec. 3.42).
            porque: >-
              Es la respuesta a la primera parte. Sin el sen φ se da a entender
              que la componente de Ω paralela a dr también estira, y no lo hace.
            minimo: true
          - punto: >-
              Con componentes de Ω pequeñas, Ω² es despreciable frente a 1 y
              |dr'| = |dr|: la longitud no cambia.
            porque: >-
              Es la segunda parte. Se desprecia Ω², no Ω: el giro sigue
              existiendo, lo que desaparece es el cambio de longitud.
            minimo: true
          - punto: >-
              Se concluye que la parte antisimétrica es una rotación de sólido
              rígido (y, si se quiere completar, que tampoco cambia el ángulo
              entre dos elementos, ec. 3.45).
            porque: >-
              Es lo que da sentido al nombre «vector rotación», y lo que separa
              el giro de la deformación en la descomposición de la ec. 3.30.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              $|\overrightarrow{dr'}|^{2} = \overrightarrow{dr'}\cdot\overrightarrow{dr'}
              = |\overrightarrow{dr}|^{2} + 2\,\overrightarrow{dr}\cdot(\vec{\Omega}\times\overrightarrow{dr})
              + |\vec{\Omega}\times\overrightarrow{dr}|^{2}$.
          - texto: >-
              El término cruzado es nulo, porque $\vec{\Omega}\times\overrightarrow{dr}$
              es perpendicular a $\overrightarrow{dr}$.
          - texto: >-
              Como $|\vec{\Omega}\times\overrightarrow{dr}| = \Omega\,dr\operatorname{sen}\varphi$,
              queda $|\overrightarrow{dr'}| = |\overrightarrow{dr}|\sqrt{1+\Omega^{2}\operatorname{sen}^{2}\varphi}$.
          - texto: >-
              Con componentes de $\vec{\Omega}$ pequeñas, $\Omega^{2}$ es
              despreciable y $|\overrightarrow{dr'}| = |\overrightarrow{dr}|$: es una
              rotación de sólido rígido.
          - texto: >-
              Con componentes pequeñas se desprecia $\Omega$ frente a 1, así que
              $\overrightarrow{dr'} = \overrightarrow{dr}$ y el elemento no se mueve.
            trampa: true
            mensaje: |
              Lo que se desprecia es $\Omega^{2}$, no $\Omega$. El elemento
              **gira** —$\vec{\Omega}\times\overrightarrow{dr}$ es del orden de
              $\Omega$ y sigue ahí—; lo que no cambia es su longitud.
    resolucion: |
      **La idea.** La parte antisimétrica del tensor gradiente de
      desplazamientos es la matriz de rotación (apuntes del tema 3, ecs. 3.32 y
      3.34), y su efecto sobre un elemento es un producto vectorial con el
      vector rotación $\vec{\Omega} = \omega_{yz}\hat{\imath} + \omega_{zx}\hat{\jmath} + \omega_{xy}\hat{k}$ (ec. 3.39). Un producto vectorial empuja el extremo
      del elemento **de lado**: por eso, a primer orden, gira sin estirar.

      **La nueva longitud.** Se calcula el cuadrado del módulo:

      $$
      |\overrightarrow{dr'}|^{2} = \left(\overrightarrow{dr} + \vec{\Omega}\times\overrightarrow{dr}\right)\cdot
      \left(\overrightarrow{dr} + \vec{\Omega}\times\overrightarrow{dr}\right)
      = |\overrightarrow{dr}|^{2} + 2\,\overrightarrow{dr}\cdot\left(\vec{\Omega}\times\overrightarrow{dr}\right)
      + |\vec{\Omega}\times\overrightarrow{dr}|^{2}
      $$

      El término cruzado es nulo, porque $\vec{\Omega}\times\overrightarrow{dr}$ es
      perpendicular a $\overrightarrow{dr}$. Con $\varphi$ el ángulo entre
      $\vec{\Omega}$ y $\overrightarrow{dr}$, $|\vec{\Omega}\times\overrightarrow{dr}|
      = \Omega\,dr\operatorname{sen}\varphi$, y queda (ecs. 3.41 y 3.42):

      $$
      |\overrightarrow{dr'}| = |\overrightarrow{dr}|\,\sqrt{1 + \Omega^{2}\operatorname{sen}^{2}\varphi}
      $$

      **Con componentes pequeñas.** En un problema de pequeños desplazamientos
      las componentes de $\vec{\Omega}$ son números pequeños, y $\Omega^{2}$ es
      despreciable frente a 1:

      $$
      |\overrightarrow{dr'}| \approx |\overrightarrow{dr}|
      $$

      La longitud no cambia. Con el mismo razonamiento sobre dos elementos se
      ve que tampoco cambia el ángulo entre ellos, porque la corrección del
      coseno es de orden $\Omega^{2}$ (ecs. 3.43 a 3.45). Las dos cosas juntas
      dicen que **la parte antisimétrica es una rotación de sólido rígido**: la
      deformación vive entera en la parte simétrica.

      Un ejemplo con números da la escala: con $\vec{\Omega} = (0{,}01;\ 0{,}02;\
      -0{,}02)$ y un elemento según $x$, el alargamiento relativo es
      $3{,}9992\cdot10^{-4}$, del orden de $\Omega^{2}/2$. La componente
      $\Omega_x$, paralela al elemento, no aporta nada: es el $\operatorname{sen}\varphi$.

  # ── Teoría · cuestión 2 · los bloques A y B en el marco rígido. Va en la
  #    hoja de teoría, pero es un cálculo (ley de Hooke generalizada).
  - id: exerm2223-1par-2-los-bloques-en-el-marco-rigido
    titulo: Dos bloques en un marco rígido, y lo que baja la cara libre de B
    fuente: >-
      Cuestión 2 de teoría · Primer parcial del 18 de noviembre de 2022 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El texto no nombra la carga ni dice
      qué es ξ: lo dice la figura, y la lectura que se hace aquí está en la
      nota del enunciado. El examen no publica resolución; el desarrollo es
      nuestro.
    nivel: examen
    enunciado: |
      (1p) Los bloques de **sección cuadrada** A y B de la figura están
      contenidos en un marco rígido. En el bloque A, los lados de la sección,
      el módulo de elasticidad y el coeficiente de Poisson son L, E y νν
      respectivamente. En el bloque B, el área de la sección y el módulo de
      elasticidad son el doble que en A. La pared que separa los dos bloques
      se mueve libremente en el eje X.

      Calcular :

      a) El alargamiento ξξ.

