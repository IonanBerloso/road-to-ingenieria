      Redibujada del enunciado, en perspectiva caballera. Los ejes son
      nuestros: el original no los dibuja.

      </figcaption>
      </figure>

      **Notas nuestras.** La tercera fila del tensor y $\vec{n}_2$ salen
      cortadas en el PDF y se han leído en el Word original. La figura no
      dibuja los ejes: se toma **X a lo largo de la viga** (la normal de la
      placa), Y vertical y Z hacia el observador. Con esa lectura $\vec{n}_1$
      y $\vec{n}_2$ están en el plano XY y la dirección principal 3 es Z, que
      es lo que pide el apartado d). La placa mide 50 × 20 cm.
    pide: >-
      σn y τn en la placa, las fuerzas N y V que transmite, la τ máxima del
      punto y la tensión normal en el plano que contiene a la dirección 2 y
      forma 15° con Z.
    pasos:
      - tipo: reconocer
        pregunta: |
          El tensor está en ejes principales y la normal de la placa, X, está
          en ejes XYZ. ¿Qué componentes tiene $\hat{\imath}$ en la base
          principal $(\vec{n}_1, \vec{n}_2, \vec{n}_3)$?
        opciones:
          - texto: >-
              $(\hat{\imath}\cdot\vec{n}_1,\ \hat{\imath}\cdot\vec{n}_2,\ \hat{\imath}\cdot\vec{n}_3)
              = (1/2,\ \sqrt{3}/2,\ 0)$
            correcta: true
            mensaje: |
              Eso es. Cada componente en la base principal es el coseno del
              ángulo con ese eje, y ese coseno es la primera coordenada de
              cada $\vec{n}_i$. Con $\vec{n}_3 = \vec{n}_1\times\vec{n}_2 =
              (0, 0, -1)$, la tercera es 0.
          - texto: $(1, 0, 0)$, porque X es el primer eje
            mensaje: |
              $(1, 0, 0)$ en la base principal sería $\vec{n}_1$, que no es X:
              forma 60° con él. El tensor diagonal solo se puede usar con la
              normal escrita en **su** base.
          - texto: $(1/2,\ -1/2,\ 0)$, los primeros números de $\vec{n}_1$ y $\vec{n}_2$ sin la raíz
            mensaje: |
              El coseno entre X y $\vec{n}_2$ es la primera coordenada de
              $\vec{n}_2$, que es $\sqrt{3}/2$. Mira que el vector que
              escribas sea unitario: $1/4 + 3/4 = 1$.
          - texto: >-
              No hace falta: en ejes principales el vector tensión de
              cualquier plano no tiene componente tangencial
            mensaje: |
              Eso solo pasa en los planos **principales**. La placa forma 60°
              con $\vec{n}_1$, así que su vector tensión tiene parte normal y
              parte tangencial.
      - tipo: calcular
        titulo: La tensión normal en la placa
        pregunta: |
          ¿Cuánto vale $\sigma_n$ en el plano de la placa, en MPa?
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.01
          formato: un número, en MPa
        distractores:
          - valor: '8.5'
            mensaje: |
              No es un error de cálculo: es la otra lectura de los ejes. La
              figura no los dibuja, y si se toma Y a lo largo de la viga (la
              placa sigue siendo vertical), la normal de la placa es Y,
              $(\sqrt{3}/2, -1/2, 0)$ en la base principal, y sale 8,5. Aquí
              se ha tomado X a lo largo de la viga, como en el convenio del
              tema 7: la normal es $(1/2, \sqrt{3}/2, 0)$ y sale 1,5.
          - valor: '4.268'
            mensaje: |
              Has sumado $\sigma_i n_i$ con los cosenos sin elevar al cuadrado.
              Es $\sigma_n = \sum\sigma_i n_i^{2}$: un coseno proyecta la
              tensión sobre la normal y el otro lleva la cara (ec. 2.14).
          - valor: '12'
            mensaje: |
              Es $\sigma_1$, la tensión del plano principal 1. La placa no es
              ese plano: su normal forma 60° con $\vec{n}_1$.
        pista: |
          $\sigma_n = 12\cdot\left(\tfrac{1}{2}\right)^{2} + (-2)\left(\tfrac{\sqrt{3}}{2}\right)^{2} + (-8)\cdot0$.
        desarrollo: |
          $$
          \sigma_n = 12\cdot\frac{1}{4} - 2\cdot\frac{3}{4} = 3 - 1{,}5 = 1{,}5\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La tensión tangencial en la placa
        pregunta: |
          ¿Cuánto vale $\tau_n$ en el plano de la placa, en MPa?
        respuesta:
          tipo: numero
          valor: '6.0622'
          tolerancia: 0.005
          formato: un número, en MPa (forma exacta 7·sqrt(3)/2)
        distractores:
          - valor: '6.245'
            mensaje: |
              Es el módulo del vector tensión, $|\vec{S}| = \sqrt{39}$. Falta
              quitarle la parte normal: $\tau_n^{2} = |\vec{S}|^{2} - \sigma_n^{2}$.
          - valor: '4.745'
            mensaje: |
              Has restado los módulos, $|\vec{S}| - \sigma_n$. Las componentes
              intrínsecas son los catetos de un triángulo rectángulo cuya
              hipotenusa es $|\vec{S}|$: se restan los **cuadrados**.
        pista: |
          $\vec{S} = (12\cdot\tfrac{1}{2},\ -2\cdot\tfrac{\sqrt{3}}{2},\ 0) = (6,\ -\sqrt{3},\ 0)$
          en la base principal; $\tau_n = \sqrt{|\vec{S}|^{2} - \sigma_n^{2}}$.
        desarrollo: |
          $$
          |\vec{S}|^{2} = 36 + 3 = 39,\qquad
          \tau_n = \sqrt{39 - 1{,}5^{2}} = \sqrt{36{,}75} = \frac{7\sqrt{3}}{2} = 6{,}062\ \text{MPa}
          $$

          Con la normal en el plano 1-2 sale también como
          $\tfrac{\sigma_1-\sigma_2}{2}\operatorname{sen}2\theta = 7\operatorname{sen}120°$.
      - tipo: calcular
        titulo: La fuerza normal en la placa
        pregunta: |
          Con las tensiones uniformes en los 50 × 20 cm de la placa, ¿cuánto
          vale N, en kN?
        respuesta:
          tipo: numero
          valor: '150'
          tolerancia: 0.5
          formato: un número, en kN
        distractores:
          - valor: '1.5'
            mensaje: |
              Has multiplicado 1,5 MPa por 1000 como si el área fueran
              1000 mm². Son 1000 cm², es decir $10^{5}$ mm²: 1,5 N/mm² ·
              $10^{5}$ mm² = 150 000 N.
          - valor: '606.2'
            mensaje: |
              Es V, la resultante de la tangencial. N es la de $\sigma_n$.
        pista: |
          $A = 500\cdot200 = 10^{5}$ mm², y 1 MPa = 1 N/mm².
        desarrollo: |
          $$
          N = \sigma_n A = 1{,}5\ \text{N/mm}^{2}\cdot10^{5}\ \text{mm}^{2} = 1{,}5\cdot10^{5}\ \text{N} = 150\ \text{kN}
          $$

          Es de tracción: la placa tira del hormigón.
      - tipo: calcular
        titulo: La fuerza cortante en la placa
        pregunta: |
          ¿Y V, en kN?
        respuesta:
          tipo: numero
          valor: '606.22'
          tolerancia: 0.5
          formato: un número, en kN
        distractores:
          - valor: '624.5'
            mensaje: |
              Es $|\vec{S}|\,A$, la resultante total. V es solo la parte
              tangencial, $\tau_n A$.
          - valor: '6.062'
            mensaje: |
              El área está en cm² puesta como si fuera mm². Son $10^{5}$ mm².
        pista: |
          $V = \tau_n A$, con el mismo $A$.
        desarrollo: |
          $$
          V = \tau_n A = 6{,}062\cdot10^{5}\ \text{N} = 606{,}2\ \text{kN}
          $$
      - tipo: calcular
        titulo: La tensión tangencial máxima
        pregunta: |
          ¿Cuánto vale la tensión tangencial máxima en el punto, en MPa?
        respuesta:
          tipo: numero
          valor: '10'
          tolerancia: 0.01
          formato: un número, en MPa
        distractores:
          - valor: '7'
            mensaje: |
              Es $(\sigma_1-\sigma_2)/2$, el radio del círculo de los planos que
              contienen a la dirección 3. La máxima del punto es la del círculo
              grande, entre la mayor y la menor principal: $\sigma_1$ y $\sigma_3$.
          - valor: '6.062'
            mensaje: |
              Es la tangencial **en la placa**. La máxima es la del punto, en
              cualquier plano: $(\sigma_1-\sigma_3)/2$.
        pista: |
          $\tau_{max} = (\sigma_1 - \sigma_3)/2$, con $\sigma_3 = -8$.
        desarrollo: |
          $$
          \tau_{max} = \frac{12-(-8)}{2} = 10\ \text{MPa}
          $$

          Actúa en los planos que contienen a la dirección 2 y forman 45° con
          la 1 y la 3.
      - tipo: calcular
        titulo: El plano paralelo a 2, a 15° de Z
        pregunta: |
          La normal $\vec{u}$ es perpendicular a $\vec{n}_2$ (el plano contiene a
          la dirección 2) y forma 15° con Z. ¿Cuánto vale $\sigma_u$, en MPa?
        respuesta:
          tipo: numero
          valor: '-6.6603'
          tolerancia: 0.005
          formato: un número, en MPa (forma exacta 2 - 10·cos(30°))
        distractores:
          - valor: '10.6603'
            mensaje: |
              Has puesto los 15° respecto de $\vec{n}_1$ y no de Z:
              $12\cos^{2}15° - 8\operatorname{sen}^{2}15°$. La normal forma 15°
              con Z, que es la dirección 3, así que $\cos^{2}15°$ va con $\sigma_3$.
          - valor: '-7.5981'
            mensaje: |
              Has tomado la normal en el plano de 2 y 3, perpendicular a 1. «Paralelo
              a 2» quiere decir que el plano **contiene** a la dirección 2, así
              que la normal es perpendicular a ella y vive en el plano 1-3.
        pista: |
          $\vec{u} = \operatorname{sen}15°\,\vec{n}_1 \pm \cos15°\,\vec{n}_3$, y
          $\sigma_u = \sigma_1\operatorname{sen}^{2}15° + \sigma_3\cos^{2}15°$.
        desarrollo: |
          $$
          \sigma_u = 12\operatorname{sen}^{2}15° - 8\cos^{2}15°
          = 6(1-\cos30°) - 4(1+\cos30°) = 2 - 10\cos30° = -6{,}660\ \text{MPa}
          $$

          El signo con que se tome $\vec{n}_3$ no importa: entra al cuadrado.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\vec{n}_3 = \vec{n}_1\times\vec{n}_2 = (0, 0, -1)$: la dirección 3 es Z.
          - texto: >-
              La normal de la placa es X, que en la base principal es
              $(1/2,\ \sqrt{3}/2,\ 0)$.
          - texto: >-
              $\sigma_n = 1{,}5$ MPa y $\tau_n = \sqrt{39 - 2{,}25} = 6{,}06$ MPa;
              con $A = 10^{5}$ mm², N = 150 kN y V = 606 kN.
          - texto: >-
              $\tau_{max} = (\sigma_1-\sigma_3)/2 = 10$ MPa, y en el plano que
              contiene a 2 y forma 15° con Z, $\sigma_u = 2 - 10\cos30° = -6{,}66$ MPa.
          - texto: >-
              Como el tensor está en ejes principales, la placa no tiene
              tensión tangencial y V = 0.
            trampa: true
            mensaje: |
              Solo los planos principales están libres de tangenciales. La
              placa es perpendicular a X, que no es ninguna de las tres
              direcciones principales.
    resolucion: |
      **La idea.** El tensor viene en su base principal, donde es diagonal y
      todo se calcula con cuadrados de cosenos. Basta escribir cada normal en
      esa base. El tercer eje sale del producto vectorial:

      $$
      \vec{n}_3 = \vec{n}_1\times\vec{n}_2 = \left(0,\ 0,\ -\tfrac{1}{4}-\tfrac{3}{4}\right) = (0,\ 0,\ -1)
      $$

      La dirección principal 3 es Z, con $\sigma_3 = -8$ MPa.

      **a) El plano de la placa.** Su normal es X (nota del enunciado), cuyas
      componentes en la base principal son los cosenos con cada eje:
      $(1/2,\ \sqrt{3}/2,\ 0)$. Con las ecs. 2.14 y 2.16 de los apuntes del
      tema 2:

      $$
      \vec{S} = \left(12\cdot\tfrac{1}{2},\ -2\cdot\tfrac{\sqrt{3}}{2},\ 0\right) = (6,\ -\sqrt{3},\ 0),
      \qquad \sigma_n = 3 - 1{,}5 = 1{,}5\ \text{MPa}
      $$

      $$
      \tau_n = \sqrt{|\vec{S}|^{2} - \sigma_n^{2}} = \sqrt{39 - 2{,}25} = \frac{7\sqrt{3}}{2} = 6{,}06\ \text{MPa}
      $$

      **b) N y V.** Las tensiones son uniformes en $50\times20$ cm $= 10^{5}$ mm²:

      $$
      N = 1{,}5\cdot10^{5}\ \text{N} = 150\ \text{kN (tracción)},\qquad
      V = 6{,}06\cdot10^{5}\ \text{N} = 606\ \text{kN}
      $$

      **c) La tangencial máxima.** Es el radio del círculo de Mohr mayor:

      $$
      \tau_{max} = \frac{\sigma_1 - \sigma_3}{2} = \frac{12+8}{2} = 10\ \text{MPa}
      $$

      **d) El plano que contiene a 2 y forma 15° con Z.** Su normal es
      perpendicular a $\vec{n}_2$, así que está en el plano 1-3, y forma 15°
      con $\vec{n}_3$: $\vec{u} = (\operatorname{sen}15°,\ 0,\ \pm\cos15°)$ en la
      base principal.

      $$
      \sigma_u = 12\operatorname{sen}^{2}15° - 8\cos^{2}15° = 2 - 10\cos30° = -6{,}66\ \text{MPa}
      $$

      **La lectura.** Sin ejes en la figura, se ha tomado X a lo largo de la
      viga, como en el convenio del tema 7: la normal de la placa es X. La
      otra lectura defendible es Y a lo largo de la viga, con la placa igual
      de vertical: entonces la normal es Y y sale $\sigma_n = 8{,}5$ MPa y
      $N = 850$ kN, con la misma $\tau_n = 6{,}06$ MPa y la misma
      $V = 606$ kN, porque las dos normales están en el plano 1-2 a 60° y 30°
      de $\vec{n}_1$. Los apartados c) y d) no dependen de la lectura.

  # ── Problema 2 · dos galgas y σz conocida: un estado general. Impreso
  #    «2. (2p)».
  - id: exerm2223-1par-6-dos-galgas-y-sigma-z
    titulo: Dos galgas en un estado de tensiones general, y los factores de seguridad
    fuente: >-
      Problema 2 · Primer parcial del 18 de noviembre de 2022 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 2 puntos. La lectura de la galga b se sale de su cuadro en el PDF y
      se ha leído en el Word original. El examen no publica resolución; el
      desarrollo es nuestro.
    nivel: examen
    enunciado: |
      (2p) En un estado de tensiones general son conocidas las tensiones
      $\tau_{xy}, \sigma_z, \tau_{xz}$ y $\tau_{yz}$ además de los datos de las
      galgas a y b:

      $$
      \tau_{xy} = 30\ MPa,\ \sigma_z = -100\ MPa,\ \tau_{xz} = \tau_{yz} = 0
      \qquad \varepsilon_a = 900\cdot10^{-6},\ \varepsilon_b = 1200\cdot10^{-6}
      $$

      Determinar:

      a) Tensor de deformaciones y tensor de tensiones

      b) Tensiones principales

      c) Tensión tangencial máxima

      d) Factor de seguridad para los criterios de deformación máxima, Mohr y
      Tresca

      e) Dirección del plano paralelo a “Z” con tensión normal igual a
      $\sigma_\theta = \dfrac{2}{3}\tau_{max}$

      $\sigma_{Lim\ tracc} = 800\ MPa$, $\sigma_{Lim\ comp} = 1000\ MPa$,
      $\nu = 0.3$, $E = 210\cdot GPa$

      <figure class="figura-examen">
      <svg viewBox="0 0 300 212" role="img" width="300" height="212" aria-labelledby="exerm2223-1par-6-dos-galgas-y-sigma-z-fig-t exerm2223-1par-6-dos-galgas-y-sigma-z-fig-d">
