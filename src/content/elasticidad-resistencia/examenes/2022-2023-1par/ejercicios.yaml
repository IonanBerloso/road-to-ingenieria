      <line x1="150" y1="140" x2="150" y2="25" stroke="var(--ink)" stroke-width="1.2"/><polygon points="150,18 153.5,26 146.5,26" fill="var(--ink)"/>
      <text x="270" y="158" font-size="13" fill="var(--ink)">X</text><text x="132" y="24" font-size="13" fill="var(--ink)">Y</text>
      <line x1="150" y1="140" x2="234.9" y2="91" stroke="var(--faint)" stroke-width="1" stroke-dasharray="5 3"/><g transform="translate(195 114) rotate(-30)"><rect x="-14" y="-4.5" width="28" height="9" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.1"/><path d="M-11 0 L-9 -2.2 L-5.4 2.2 L-1.7999999999999998 -2.2 L1.8000000000000007 2.2 L5.4 -2.2 L9 2.2 L11 0" fill="none" stroke="var(--d4)" stroke-width="1"/></g><text x="191" y="100" font-size="13" font-style="italic" font-weight="bold" fill="var(--ink)">a</text>
      <line x1="150" y1="140" x2="80.7" y2="70.7" stroke="var(--faint)" stroke-width="1" stroke-dasharray="5 3"/><g transform="translate(113.2 103.2) rotate(-135)"><rect x="-14" y="-4.5" width="28" height="9" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.1"/><path d="M-11 0 L-9 -2.2 L-5.4 2.2 L-1.7999999999999998 -2.2 L1.8000000000000007 2.2 L5.4 -2.2 L9 2.2 L11 0" fill="none" stroke="var(--d4)" stroke-width="1"/></g><text x="119.2" y="91.2" font-size="13" font-style="italic" font-weight="bold" fill="var(--ink)">b</text>
