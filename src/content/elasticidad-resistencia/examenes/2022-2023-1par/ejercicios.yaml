      <figcaption>

      Redibujada del enunciado. En el original la cota vertical de la
      izquierda lleva un «?» en lugar de la ξ, que se quedó suelta debajo de
      la figura; la línea a trazos con la cara deformada de B y los ejes
      son nuestros.

      </figcaption>
      </figure>

      **Notas nuestras.** El texto no dice qué es la P de la figura ni qué
      alargamiento es ξ. Se lee lo que dibuja la figura: P es una **presión**
      repartida sobre las caras superior e inferior de A (la figura la dibuja
      como una franja de trazos, cada uno con una punta pequeña sobre la
      cara, a lo largo de las dos caras), y ξ es la cota vertical que la figura
      pone en la cara inferior de B, es decir, **el alargamiento vertical de
      B**, cuyo lado es $\sqrt{2}\,L$ porque su área es $2L^{2}$. B conserva el
      coeficiente de Poisson de A, que el texto no cambia. La duplicación «νν»
      y «ξξ» es del original.
    pide: >-
      El alargamiento vertical ξ del bloque B en función de P, L, E y ν.
    pasos:
      - tipo: reconocer
        pregunta: |
          Nadie carga el bloque B. ¿Por qué trabaja?
        opciones:
          - texto: >-
              Porque A, comprimido en vertical, se ensancha en X por el efecto
              Poisson; el marco no le deja, y la pared móvil le pasa esa fuerza
              a B
            correcta: true
            mensaje: |
              Eso es. Todo el ejercicio cuelga del término $-\nu\sigma_y$ de la
              ley de Hooke en A. La pared se mueve «libremente» en X —sin
              rozamiento—, pero transmite la fuerza normal: es la que comprime
              a B, que a su vez se ensancha en vertical. Ese ensanchamiento es ξ.
          - texto: >-
              No trabaja: como la pared se mueve libremente, no transmite
              ninguna fuerza
            mensaje: |
              «Libremente» quiere decir sin rozamiento en su apoyo del techo,
              no que no empuje. Si B no ofreciera resistencia, A se alargaría
              en X sin límite; lo que lo para es B contra la pared izquierda.
          - texto: >-
              Porque A se acorta en X al comprimirlo, y deja a B un hueco que
              lo descomprime
            mensaje: |
              Al comprimir A en Y, A se **alarga** en X: $\varepsilon_x = -\nu\sigma_y/E > 0$ con $\sigma_y = -P$. Es el efecto Poisson con
              el signo bien puesto: lo que se aplasta por un lado sale por el
              otro.
          - texto: Porque P actúa también sobre las caras de B
            mensaje: |
              La figura reparte la carga solo sobre las caras de A. B está
              entre la pared izquierda del marco y la pared móvil, y su única
              carga es la que le llega a través de la pared.
      - tipo: calcular
        titulo: La fuerza que pasa por la pared
        pregunta: |
          Llama $F$ a la compresión que transmite la pared. Con la
          compatibilidad $\Delta x_A + \Delta x_B = 0$ (el marco es rígido),
          ¿cuánto vale $F/(\nu P L^{2})$?
        respuesta:
          tipo: numero
          valor: '0.888889'
          tolerancia: 0.002
          formato: un número, F en unidades de νPL²
        distractores:
          - valor: '1'
            mensaje: |
              Has hecho $\Delta x_A = 0$, como si B fuera rígido. B también se
              acorta, $\Delta x_B = -F L/(2E\cdot 2L^{2})$, y ese acortamiento
              deja crecer un poco a A: la fuerza sale algo menor que $\nu P L^{2}$.
          - valor: '0.8'
            mensaje: |
              Te ha faltado uno de los dos «doble» de B. Ese 0,8 sale si se
              toma $E_B = E$, o si se pone la misma tensión en los dos bloques en
              vez de la misma fuerza. Por la pared pasa una **fuerza** $F$; en B
              se reparte en $2L^{2}$ y se deforma con $2E$:
              $\Delta x_B = -FL/(4EL^{2})$.
        pista: |
          $\Delta x_A = 2L\,\dfrac{-F/L^{2} + \nu P}{E}$ y
          $\Delta x_B = L\,\dfrac{-F/(2L^{2})}{2E}$. Suma y despeja $F$.
        desarrollo: |
          En A, $\sigma_x = -F/L^{2}$, $\sigma_y = -P$, $\sigma_z = 0$; en B,
          solo $\sigma_x = -F/(2L^{2})$, con módulo $2E$:

          $$
          \frac{2L}{E}\left(-\frac{F}{L^{2}} + \nu P\right) - \frac{F}{4EL} = 0
          \;\Longrightarrow\;
          F\left(2 + \tfrac{1}{4}\right) = 2\nu P L^{2}
          \;\Longrightarrow\;
          F = \frac{8}{9}\,\nu P L^{2}
          $$
      - tipo: calcular
        titulo: El alargamiento ξ
        pregunta: |
          B se ensancha en vertical por Poisson, y su cara inferior está libre.
          Si $\xi = c\,\nu^{2} P L/E$, ¿cuánto vale $c$?
        respuesta:
          tipo: numero
          valor: '0.314270'
          tolerancia: 0.001
          formato: un número, el coeficiente c (forma exacta 2·sqrt(2)/9)
        distractores:
          - valor: '0.222222'
            mensaje: |
              Has tomado el lado de B igual a $L$. Su **área** es la doble,
              $2L^{2}$, y la sección es cuadrada: el lado mide $\sqrt{2}\,L$, y
              ξ es el alargamiento de ese lado.
          - valor: '0.565685'
            mensaje: |
              Es el ξ que sale de la fuerza $0{,}8\,\nu PL^{2}$, la de olvidar
              que B tiene el doble de módulo o de área. Vuelve al paso
              anterior: la fuerza buena es $\tfrac{8}{9}\nu PL^{2}$.
          - valor: '0.628539'
            mensaje: |
              En la deformación lateral de B has dividido una vez de menos: o
              la tensión con $L^{2}$ en vez de $2L^{2}$, o la deformación con
              $E$ en vez de $2E$. En B, $\sigma_x = -F/(2L^{2})$ y
              $\varepsilon_y = -\nu\sigma_x/(2E)$.
        pista: |
          $\varepsilon_{yB} = -\nu\,\sigma_{xB}/E_B$ con $\sigma_{xB} = -F/(2L^{2})$
          y $E_B = 2E$; luego $\xi = \sqrt{2}\,L\,\varepsilon_{yB}$.
        desarrollo: |
          $$
          \varepsilon_{yB} = -\frac{\nu}{2E}\left(-\frac{F}{2L^{2}}\right)
          = \frac{\nu F}{4EL^{2}} = \frac{2\nu^{2}P}{9E}
          $$

          $$
          \xi = \sqrt{2}\,L\,\varepsilon_{yB} = \frac{2\sqrt{2}}{9}\,\frac{\nu^{2}PL}{E}
          \approx 0{,}3143\,\frac{\nu^{2}PL}{E}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En A, $\sigma_y = -P$ y $\sigma_x = -F/L^{2}$; en B, solo
              $\sigma_x = -F/(2L^{2})$, con módulo $2E$.
          - texto: >-
              El marco es rígido: $\Delta x_A + \Delta x_B = 0$, de donde
              $F = \tfrac{8}{9}\nu PL^{2}$.
          - texto: >-
              B se ensancha en Y: $\varepsilon_{yB} = -\nu\sigma_{xB}/(2E) =
              2\nu^{2}P/(9E)$.
          - texto: >-
              Su lado es $\sqrt{2}L$, y $\xi = \tfrac{2\sqrt{2}}{9}\,\nu^{2}PL/E$.
          - texto: >-
              Como la pared se mueve libremente, A se alarga en X sin
              encontrar resistencia, y B no se deforma.
            trampa: true
            mensaje: |
              La pared se mueve sin rozamiento, pero tiene a B detrás. Lo que A
              quiere alargarse en X se lo come, en parte, la compresión de B, y
              de ahí sale $F$.
    resolucion: |
      **La idea.** P comprime A en vertical, y A, por el efecto Poisson,
      quiere alargarse en X. El marco no lo deja: la pared móvil transmite una
      fuerza $F$ que comprime A y B a la vez. B, comprimido en X, se ensancha
      en vertical, y como su cara superior toca el techo, todo ese
      ensanchamiento sale por abajo: es ξ.

      **Las tensiones.** En A, de sección $L\times L$ y longitud $2L$:
      $\sigma_x = -F/L^{2}$, $\sigma_y = -P$, $\sigma_z = 0$. En B, de sección
      $2L^{2}$ (lado $\sqrt{2}L$), longitud $L$ y módulo $2E$: $\sigma_x =
      -F/(2L^{2})$ y nada más. La misma fuerza $F$ en los dos, porque la pared
      está en equilibrio.

      **La compatibilidad.** La longitud total, $3L$ más la pared, no cambia
      (apuntes del tema 4, ec. 4.2):

      $$
      \Delta x_A + \Delta x_B = \frac{2L}{E}\left(-\frac{F}{L^{2}} + \nu P\right)
      + \frac{L}{2E}\left(-\frac{F}{2L^{2}}\right) = 0
      \;\Longrightarrow\;
      F = \frac{8}{9}\,\nu P L^{2}
      $$

      **El alargamiento de B.**

      $$
      \varepsilon_{yB} = \frac{\sigma_y - \nu(\sigma_x + \sigma_z)}{E_B}
      = \frac{\nu F}{2L^{2}\cdot 2E} = \frac{2\nu^{2}P}{9E},
      \qquad
      \xi = \sqrt{2}\,L\,\varepsilon_{yB} = \frac{2\sqrt{2}}{9}\,\frac{\nu^{2}PL}{E}
      $$

      Sale con $\nu^{2}$: un Poisson para que A empuje y otro para que B se
      ensanche. Con $\nu = 0{,}3$, $\xi = 0{,}0283\,PL/E$.

      **La lectura.** El texto no dice qué es la P ni qué es ξ. Se ha tomado P
      como presión sobre las caras de A, porque así la dibuja la figura, y ξ
      como el alargamiento vertical de B, porque ahí está su cota. Si se
      quisiera el desplazamiento de la pared, es el acortamiento de B,
      $FL/(2E\cdot2L^{2}) = \tfrac{2}{9}\,\nu PL/E$, y sale con una sola $\nu$.
      Si P fuera la fuerza total sobre cada cara de A, que mide $2L\times L$,
      la presión sería $P/(2L^{2})$ y todo se divide por $2L^{2}$:
      $\xi = \tfrac{\sqrt{2}}{9}\,\nu^{2}P/(EL)$.

  # ── Teoría · cuestión 3 · las cotas del coeficiente de Poisson. Literal
  #    en el parcial del 20/11/2020 (cuestión 3): p2b la reutiliza.
  - id: exerm2223-1par-3-las-cotas-del-coeficiente-de-poisson
    titulo: Entre qué valores está el coeficiente de Poisson, y por qué
    fuente: >-
      Cuestión 3 de teoría · Primer parcial del 18 de noviembre de 2022 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Cayó palabra por palabra en el primer
      parcial del 20 de noviembre de 2020, y es la cuestión 5 de la hoja de
      autoevaluación del tema 4. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 4.
    nivel: examen
    enunciado: |
      (1p) Justificar entre que valores está acotado el coeficiente de Poisson
      $\nu$.
    pide: Las dos cotas de ν y de dónde sale cada una.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos cotas salen de pedir que dos módulos sean positivos. ¿Cuáles,
          y cuál da cada cota?
        opciones:
          - texto: >-
              $G = E/2(1+\nu) > 0$ da $\nu > -1$, y $k = E/3(1-2\nu) > 0$ da
              $\nu < 0{,}5$
            correcta: true
            mensaje: |
              Eso es. Una tensión tangencial produce una distorsión del mismo
              signo ($G > 0$), y una presión hidrostática positiva aumenta el
              volumen ($k > 0$). Cada condición física da una cota.
          - texto: >-
              Ninguno: $0 < \nu < 0{,}5$, porque un material siempre se
              estrecha al estirarlo
            mensaje: |
              La cota inferior del curso es $-1$, no 0. Que los materiales
              habituales tengan $\nu > 0$ es experiencia, no una exigencia de la
              teoría: con $\nu$ negativo ni $G$ ni $k$ dejan de ser positivos
              mientras $\nu > -1$.
          - texto: $G > 0$ da $\nu < 0{,}5$, y $k > 0$ da $\nu > -1$
            mensaje: |
              Están cruzadas. $G = E/2(1+\nu)$ cambia de signo en $\nu = -1$, y
              $k = E/3(1-2\nu)$ en $\nu = 0{,}5$. Mira dónde se anula cada
              denominador.
          - texto: >-
              $E > 0$ da $-1 < \nu < 1$, por simetría de la ley de Hooke
            mensaje: |
              $E$ no depende de $\nu$: es un dato del material. Las cotas salen
              de los otros dos módulos, que sí dependen de $\nu$.
      - tipo: calcular
        titulo: El módulo volumétrico cerca del límite
        pregunta: |
          Con $\nu = 0{,}49$, ¿cuánto vale $k/E$?
        respuesta:
          tipo: numero
          valor: '16.6667'
          tolerancia: 0.01
          formato: un número, k en unidades de E
        distractores:
          - valor: '50'
            mensaje: |
              Te ha faltado el 3: $k = E/3(1-2\nu)$, no $E/(1-2\nu)$. El 3 viene
              de que la tensión esférica es la media de las tres normales.
          - valor: '0.653595'
            mensaje: |
              Has escrito $3(1-\nu)$ en el denominador. Es $3(1-2\nu)$: sale de
              sumar las tres deformaciones normales, cada una con $\nu$ dos veces.
          - valor: '0.335570'
            mensaje: |
              Ese es $G/E = 1/2(1+\nu)$, el módulo de cortadura. La pregunta es
              por el volumétrico, el que se dispara cuando $\nu \to 0{,}5$.
        pista: |
          $k = \dfrac{E}{3(1-2\nu)}$, con $1 - 2\cdot0{,}49 = 0{,}02$.
        desarrollo: |
          $$
          \frac{k}{E} = \frac{1}{3(1-0{,}98)} = \frac{1}{0{,}06} = 16{,}67
          $$

          Con $\nu = 0{,}3$ sería $0{,}83$. Al acercarse a $0{,}5$ el material
          se hace incompresible: hace falta una presión enorme para cambiarle
          el volumen. Por eso $0{,}5$ es la cota, y no se alcanza.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Justifica las dos cotas como en el examen: de dónde sale cada
          condición y qué cota da.
        rubrica:
          - punto: >-
              Se escribe G = E/2(1 + ν) (ec. 4.6) y se exige G > 0, porque una
              tensión tangencial produce una distorsión de su mismo signo.
            porque: >-
              Es la mitad de la respuesta. Exigir G > 0 sin decir por qué deja
              la condición sin justificar, y la cuestión pide justificar.
            minimo: true
          - punto: Con E > 0, de G > 0 sale ν > −1 (ec. 4.7).
            porque: >-
              Es la cota inferior. Escribir 0 en su lugar es el error más
              repetido: confunde lo habitual con lo posible.
            minimo: true
          - punto: >-
              Se llega a k = E/3(1 − 2ν) sumando las tres deformaciones
              normales: e = 3(1 − 2ν)σm/E (ecs. 4.14 a 4.16).
            porque: >-
              Hay que enseñar de dónde sale el módulo volumétrico; darlo de
              memoria vale menos que deducirlo en dos líneas.
          - punto: >-
              Se exige k > 0, porque una presión hidrostática positiva (de
              tracción) aumenta el volumen, y de ahí ν < 0,5 (ec. 4.17).
            porque: >-
              Es la cota superior, y su porqué físico. Sin él es una
              desigualdad suelta.
            minimo: true
          - punto: Se unen las dos, −1 < ν < 0,5 (ec. 4.18).
            porque: Es la respuesta que pide el enunciado, escrita entera.
            minimo: true
      - tipo: justificar
        pregunta: Ordena la justificación. Una pieza es falsa.
        piezas:
          - texto: >-
              $G = E/2(1+\nu)$, y una tensión tangencial da una distorsión del
              mismo signo: $G > 0$, luego $\nu > -1$.
          - texto: >-
              Sumando las tres deformaciones normales, $e = 3(1-2\nu)\sigma_m/E$,
              y $k = E/3(1-2\nu)$.
          - texto: >-
              Una presión hidrostática de tracción aumenta el volumen: $k > 0$,
              luego $\nu < 0{,}5$.
          - texto: Juntando las dos, $-1 < \nu < 0{,}5$.
          - texto: >-
              Además $\nu > 0$, porque si fuera negativo $G$ saldría negativo.
            trampa: true
            mensaje: |
              Con $\nu = -0{,}5$, $G = E/2(0{,}5) = E > 0$. $G$ solo cambia de
              signo en $\nu = -1$. Que los materiales corrientes tengan
              $\nu > 0$ es un hecho experimental, no una cota de la teoría.
    resolucion: |
      **La idea.** $\nu$ no es libre: los otros dos módulos elásticos, $G$ y
      $k$, dependen de él, y los dos tienen que ser positivos por motivos
      físicos. Cada uno da una cota.

      **La cota inferior.** La relación entre $E$, $G$ y $\nu$ (apuntes del
      tema 4, ec. 4.6) es

      $$
      G = \frac{E}{2(1+\nu)}
      $$

      Una tensión tangencial produce una deformación tangencial del mismo
      signo, así que $G > 0$; con $E > 0$, eso exige $1 + \nu > 0$:
      $\nu > -1$ (ec. 4.7).

      **La cota superior.** Sumando las tres ecuaciones de Hooke (ec. 4.8),

      $$
      e = \varepsilon_x + \varepsilon_y + \varepsilon_z = \frac{1-2\nu}{E}\,(\sigma_x+\sigma_y+\sigma_z)
      = \frac{3(1-2\nu)}{E}\,\sigma_m
      \;\Longrightarrow\;
      k = \frac{E}{3(1-2\nu)}
      $$

      (ecs. 4.14 a 4.16). Una presión hidrostática positiva —de tracción—
      aumenta el volumen, y una negativa lo disminuye: $k > 0$, y por tanto
      $1 - 2\nu > 0$, $\nu < 0{,}5$ (ec. 4.17).

      **Las dos juntas** (ec. 4.18):

      $$
      -1 < \nu < 0{,}5
      $$

      En el límite superior el material es incompresible: con $\nu = 0{,}49$,
      $k = 16{,}7\,E$. Los valores negativos son posibles en teoría
      (materiales auxéticos), aunque los metales y el hormigón tengan $\nu$
      entre 0,1 y 0,35.

  # ── Teoría · cuestión 4 · dos estados límite de Mohr. Va en la hoja de
  #    teoría, pero es un cálculo.
  - id: exerm2223-1par-4-dos-estados-limite-de-mohr
    titulo: Dos estados límite que se encadenan, y la tensión equivalente de Mohr
    fuente: >-
      Cuestión 4 de teoría · Primer parcial del 18 de noviembre de 2022 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro, con el criterio de los estados límites de los
      apuntes del tema 6.
    nivel: examen
    enunciado: |
      (1p) En un estado límite de un material, donde las tensiones principales
      son de tracción, $\sigma_1$ es 3000Kg/cm². Existe un segundo estado límite
      donde $\sigma_3$ es la mitad del $\sigma_1$ del primero. A demás, el
      $\sigma_3$ del primero coincide con el $\sigma_1$ del segundo.

      Calcula la tensión equivalente según el criterio de Mohr si la tensión
      límite a compresión es 1500 Kg/cm2.
    pide: >-
      La tensión equivalente de Mohr en esos estados límite, y por el camino k.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué cumple un estado límite según el criterio de Mohr del curso?
        opciones:
          - texto: >-
              $\sigma_1 - k\sigma_3 = \sigma_{et}$, con $k = \sigma_{et}/\sigma_{ec}$:
              su tensión equivalente es justo el límite a tracción
            correcta: true
            mensaje: |
              Eso es (ecs. 6.15 y 6.16). En un estado límite el factor de
              seguridad vale 1, así que la tensión equivalente **es**
              $\sigma_{et}$. Lo que el enunciado pide calcular es, en el fondo,
              el límite a tracción, que no da.
          - texto: $\sigma_1 = \sigma_{et}$, la mayor principal llega al límite
            mensaje: |
              Ese es el criterio de Rankine (ecs. 6.3 a 6.5). En Mohr la menor
              principal también cuenta, con el peso $k$: por eso un estado con
              $\sigma_1 = 3000$ puede estar en el límite aunque $\sigma_{et}$ sea
              mucho menor.
          - texto: $\sigma_1 - \sigma_3 = \sigma_{et}$
            mensaje: |
              Ese es Tresca, que es Mohr con $k = 1$ (ec. 6.19). Aquí los
              límites a tracción y a compresión no tienen por qué coincidir, y
              $k$ es justo la incógnita.
          - texto: >-
              $\sigma_1 - k\sigma_3 = \sigma_{et}$, con $k = \sigma_{ec}/\sigma_{et}$
            mensaje: |
              El cociente va al revés. $k = \sigma_{et}/\sigma_{ec}$ (ec. 6.12),
              menor que 1 en un material que resiste más a compresión.
      - tipo: calcular
        titulo: El cociente k
        pregunta: |
          Llama $s$ al valor común ($\sigma_3$ del primero, $\sigma_1$ del
          segundo). Plantea los dos estados límite con
          $\sigma_{et} = 1500\,k$. ¿Cuánto vale $k$?
        respuesta:
          tipo: numero
          valor: '0.780776'
          tolerancia: 0.001
          formato: un número (forma exacta (sqrt(17)-1)/4)
        distractores:
          - valor: '0.5'
            mensaje: |
              Has dividido 1500 entre 3000. Pero 3000 no es el límite a
              tracción: es la mayor principal de un estado que **está** en el
              límite con su $\sigma_3$ dentro. $k$ sale de los dos estados a la
              vez.
          - valor: '1.280776'
            mensaje: |
              Es $1/k = \sigma_{ec}/\sigma_{et}$: has resuelto bien y has dado
              el cociente al revés. El curso define $k = \sigma_{et}/\sigma_{ec}$
              (ec. 6.12), menor que 1 en este material. Si metieras
              $\sigma_{ec}/\sigma_{et}$ en las dos ecuaciones, no saldría: el
              sistema quedaría $k^{3} - k + 1 = 0$, sin raíz positiva.
        pista: |
          Estado I: $3000 - k\,s = 1500k$. Estado II: $s - k\cdot1500 = 1500k$,
          de donde $s = 3000k$. Sustituye en el primero.
        desarrollo: |
          $$
          s = 3000k,\qquad 3000 - 3000k^{2} = 1500k
          \;\Longrightarrow\;
          2k^{2} + k - 2 = 0
          $$

          $$
          k = \frac{-1 + \sqrt{17}}{4} = 0{,}7808
          $$

          La otra raíz es negativa y no vale: $k$ es un cociente de dos
          límites positivos.
      - tipo: calcular
        titulo: La tensión equivalente
        pregunta: |
          ¿Cuánto vale la tensión equivalente de Mohr en esos estados límite,
          en kg/cm²?
        respuesta:
          tipo: numero
          valor: '1171.16'
          tolerancia: 0.5
          formato: un número, en kg/cm² (forma exacta 375·(sqrt(17)-1))
        distractores:
          - valor: '750'
            mensaje: |
              Es $1500\cdot0{,}5$: sale del $k = 0{,}5$ de dividir 1500 entre
              3000. Ese $k$ no cumple el segundo estado límite; vuelve al paso
              anterior.
          - valor: '3000'
            mensaje: |
              Has tomado la mayor principal como tensión equivalente, que es
              Rankine. En Mohr resta $k\sigma_3$, y aquí $\sigma_3$ es de
              tracción y grande: $3000 - 0{,}78\cdot2342 = 1171$.
          - valor: '1500'
            mensaje: |
              Es el límite a **compresión**. La tensión equivalente de Mohr se
              compara con el de tracción, $\sigma_{eqv} = \sigma_1 - k\sigma_3
              \le \sigma_{et}$, y en un estado límite vale exactamente
              $\sigma_{et}$.
        pista: |
          En un estado límite, $\sigma_{eqv} = \sigma_{et} = 1500\,k$.
        desarrollo: |
          $$
          \sigma_{eqv} = \sigma_{et} = 1500k = 375\left(\sqrt{17}-1\right)
          = 1171{,}2\ \text{kg/cm}^{2}
          $$

          Comprobación con los dos estados, con $s = 3000k = 2342{,}3$:
          $3000 - 0{,}7808\cdot2342{,}3 = 1171{,}2$ y
          $2342{,}3 - 0{,}7808\cdot1500 = 1171{,}2$. Y la compresión pura
          también queda en el límite: $0 - k(-1500) = 1171{,}2$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Según Mohr, en un estado límite $\sigma_1 - k\sigma_3 = \sigma_{et}$,
              con $k = \sigma_{et}/\sigma_{ec}$, así que $\sigma_{et} = 1500k$.
          - texto: >-
              Estado II: $s - 1500k = 1500k$, luego $s = 3000k$.
          - texto: >-
              Estado I: $3000 - 3000k^{2} = 1500k$, y
              $k = (\sqrt{17}-1)/4 = 0{,}781$.
          - texto: >-
              La tensión equivalente en el límite es $\sigma_{et} = 1500k =
              1171$ kg/cm².
          - texto: >-
              Como las dos principales del estado I son de tracción, el
              criterio de Mohr da $\sigma_{eqv} = \sigma_1 = 3000$ kg/cm².
            trampa: true
            mensaje: |
              $\sigma_{eqv} = \sigma_1 - k\sigma_3$ vale para cualquier signo
              de $\sigma_3$. Con $\sigma_3$ de tracción, el término $-k\sigma_3$
              **resta**, y por eso el estado I está en el límite aunque su
              $\sigma_1$ sea más del doble de $\sigma_{et}$.
    resolucion: |
      **La idea.** Un estado límite es uno con factor de seguridad 1: su
      tensión equivalente es exactamente el límite a tracción. Así que lo que
      se pide es $\sigma_{et}$, y para sacarlo hay dos estados límite y el
      límite a compresión.

      **El criterio** (apuntes del tema 6, ecs. 6.12, 6.15 y 6.16):

      $$
      \sigma_{eqv} = \sigma_1 - k\,\sigma_3,\qquad k = \frac{\sigma_{et}}{\sigma_{ec}},
      \qquad \text{límite: } \sigma_{eqv} = \sigma_{et}
      $$

      Con $\sigma_{ec} = 1500$, $\sigma_{et} = 1500k$.

      **Los dos estados.** Sea $s$ el valor común. Estado I: $\sigma_1 = 3000$,
      $\sigma_3 = s$. Estado II: $\sigma_1 = s$, $\sigma_3 = 3000/2 = 1500$.

      $$
      \text{II: } s - 1500k = 1500k \;\Rightarrow\; s = 3000k
      \qquad
      \text{I: } 3000 - k\cdot3000k = 1500k \;\Rightarrow\; 2k^{2} + k - 2 = 0
      $$

      $$
      k = \frac{\sqrt{17}-1}{4} = 0{,}7808,\qquad s = 2342{,}3\ \text{kg/cm}^{2}
      $$

      **La tensión equivalente.**

      $$
      \sigma_{eqv} = \sigma_{et} = 1500k = 375\left(\sqrt{17}-1\right) = 1171{,}2\ \text{kg/cm}^{2}
      $$

      Se comprueba en los dos estados ($3000 - 0{,}7808\cdot2342{,}3 = 1171{,}2$
      y $2342{,}3 - 0{,}7808\cdot1500 = 1171{,}2$) y en compresión pura, que
      también da $1171{,}2$. Los dos estados son coherentes con su nombre:
      en el I, $\sigma_1 = 3000 \ge s = 2342$, y en el II, $s \ge 1500$.

      **La lectura.** Se toma el criterio tal como lo escriben los apuntes,
      con la recta intrínseca que pasa por los círculos de tracción y de
      compresión puras; con esa recta, los dos estados límite del enunciado
      bastan para fijar $k$. Que un estado de tracción doble pueda fallar con
      $\sigma_1$ por encima de $\sigma_{et}$ es una consecuencia de la recta,
      no un dato físico que el enunciado afirme.

  # ── Problema 1 · el tensor en ejes principales y la placa A. Impreso
  #    «1. (2p)» en la hoja de problemas (en euskera, «2.»).
  - id: exerm2223-1par-5-el-tensor-en-la-placa
    titulo: El tensor en ejes principales, la placa A y el plano a 15° de Z
    fuente: >-
      Problema 1 · Primer parcial del 18 de noviembre de 2022 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 2 puntos. La figura no dibuja los ejes X, Y, Z: la lectura que se
      hace aquí está en la nota del enunciado. El examen no publica
      resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      (2p) Se sabe que las tensiones en la superficie de contacto entre
      hormigón y la placa A, las tensiones están uniformemente distribuidas. Se
      conoce el tensor de tensiones de un punto de esta superficie en el
      sistema de referencias principal $[\sigma]^{A}_{0123}$.

      $$
      [\sigma]^{A}_{0123} = \begin{bmatrix} 12 & 0 & 0 \\ 0 & -2 & 0 \\ 0 & 0 & -8 \end{bmatrix} MPa;\quad
      \vec{n}_1\left(\frac{1}{2}, \frac{\sqrt{3}}{2}, 0\right),\quad
      \vec{n}_2\left(\frac{\sqrt{3}}{2}, -\frac{1}{2}, 0\right)
      $$

      Determinar:

      a) Las componentes intrínsecas del vector tensión en el plano de la placa.

      b) V y N en la placa.

      c) Tensión tangencial máxima

      d) $\sigma_u$ del plano paralelo a “2” cuyo vector normal forma 15º
      respecto a “Z”.

