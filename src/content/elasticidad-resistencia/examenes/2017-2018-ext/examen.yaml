# La convocatoria extraordinaria de Elasticidad y Resistencia de Materiales
# de 2017-2018, del 14 de junio de 2018 («Examen Final: 14/06/2018»;
# «Azterketa Finala: 2018/06/14» en euskera): cuatro páginas, en euskera y
# en castellano, de la Escuela de Ingeniería de Gipuzkoa. La página 1 es de
# teoría (TEORIA/ TEORÍA: cuatro cuestiones de 1 punto) y las otras tres, de
# problemas (ARIKETAK / EJERCICIOS: cuatro de 1,5 puntos). Diez puntos en
# total, y el cuadernillo los imprime todos.
#
# Se transcribe la columna en castellano, tal cual, con sus puntos
# impresos. Lo que hay que saber de ese texto, dicho antes de que nadie lo
# deduzca:
#
# 1. **EL PDF ES UNA CONVERSIÓN DEL WORD, Y PIERDE UN ENUNCIADO ENTERO.** El
#    texto del problema 4 solo está en el Word: el PDF imprime su figura en
#    la página 1, montada sobre la cabecera de la teoría y con las letras
#    descolocadas, y ninguna página trae el enunciado. Se transcribe del
#    Word, y la `fuente` y el pie de la figura lo dicen. El PDF descoloca o
#    pierde también casi todas las letras de las figuras de los problemas 1
#    y 3 (σ0, σ2, x, a1, a2; A, B, C, d, M0, b), e imprime la del problema 2
#    sola, en la página 3. Las letras griegas del texto son de la fuente
#    Symbol: se ven en la página aunque la capa de texto las pierda. Las
#    figuras se han redibujado del Word.
#
# 2. **LECTURAS.**
#    - Cuestión 3: $P$ es vertical, según $y$. $h_0$ va entre las líneas
#      medias de las alas; $b_0$, de la línea media del alma a la punta de
#      las alas; $t_0$ es el espesor de las alas. El alma se dibuja algo más
#      gruesa, pero no se acota: el ejemplo de los pasos usa el mismo
#      espesor en toda la sección, y lo dice.
#    - Problema 1: el cuerpo 2 es rígido (no se da su material) y transmite
#      la carga de $\sigma_2$, que actúa sobre $a_2c$, a la cara de arriba
#      del 1, de área $a_1c$: $\sigma_y = -\sigma_2a_2/a_1$. $\sigma_0$
#      comprime las dos caras del 1 perpendiculares a $x$, y el cuerpo es
#      libre en $z$ ($\sigma_z = 0$) y en $x$ (sin rozamiento con el suelo).
#      «Ascienda la distancia $h$» es que la cara de arriba del 1 suba $h$.
#    - Problema 2: la barra 1 está articulada en A y en B, y B, en la
#      vertical del punto de la viga a $2a$ de A (la barra forma 30° con la
#      viga y mide $2a/\cos30°$). C es una articulación fija, $q_0$ va de A a
#      C y $P$ va hacia arriba en D. La sección es una T invertida: alma de
#      2 cm arriba, ala de 20 × 2 cm abajo, 20 cm de canto. «Tensión de
#      tracción máxima» es la mayor $\sigma_x$ de tracción de toda la viga, y
#      «el desplazamiento de A» es el vertical: la viga, rígida, gira
#      alrededor de C.
#    - Problema 3: en la vista de arriba, la de la flexión, A está empotrado
#      y C apoyado, y $P$ baja en B; en la de abajo, la de la torsión, el eje
#      está sujeto en A y en C, y $M_0$, el momento de $P$ respecto del eje,
#      actúa en B. $d$ es $D_{BC}$. «El ángulo de torsión máximo» es el mayor
#      giro de una sección respecto de los extremos, que no giran: el de B.
#    - Problema 4: ejes nuestros, $x$ de F hacia D, $y$ de B hacia C y $z$
#      hacia arriba. AB es vertical, de $2L$, empotrado en A; CD es
#      horizontal y perpendicular a FD, con B en su centro; FD es horizontal
#      y articulada en sus dos extremos. $q_0$ va hacia abajo en BD y en el
#      sentido de D hacia F en BC. $I_p = 2I_z$ en la sección circular de la
#      estructura, y $A$ es el área de la barra. Solo cuentan las energías
#      que nombra el enunciado: flexión y torsión de la estructura y axil de
#      la barra.
#
# 3. **ERRATAS Y RAREZAS DEL TEXTO, CONSERVADAS**: «1.(1p)» y «4.(1p)» sin
#    espacio, frente a «2. (1p)» y «3. (1p)»; «2. (1p) Ecuación de los 3
#    momentos» sin punto final; «a2 = 1,2 m ;» con un espacio antes del punto
#    y coma; «b = 1m» sin espacio y «2º» con el ordinal (problema 3), como
#    el «30º» de la figura del problema 2; «c/ G = 25 GPa» dentro de la línea
#    de datos del problema 3.
#
# 4. **DOS NUMERACIONES EN UN CUADERNILLO.** La teoría va de la 1 a la 4 y
#    los ejercicios vuelven a empezar en 1. Aquí la teoría son **n 1 a 4** y
#    los ejercicios **n 5 a 8**; la `fuente` de cada ejercicio dice el
#    nombre impreso. Ninguna pregunta se parte.
#
# 5. **PREGUNTAS REPETIDAS.** Una de las ocho no se resuelve aquí:
#    - La **cuestión 4**, «4.(1p) Compresión excéntrica de columnas
#      esbeltas.», es la cuestión 4 de la extraordinaria del 2 de febrero de
#      2021 (`exerm2021-ext-4-compresion-excentrica-de-columnas-esbeltas`),
#      con el mismo texto, el mismo número y el mismo punto: la entrada
#      apunta a ella.
#    Dos se parecen a otras sin ser iguales, y van propias, con otro
#    ejemplo; su `fuente` nombra la otra y sus `redactar` comparten rúbrica:
#    - La **cuestión 1** pide la misma deducción que la pregunta 1 de teoría
#      del primer parcial de 2013-2014 (`exerm1314-1par-1-…`), que es otro
#      texto, más largo y con la figura de la rebanada. Rúbrica compartida
#      `ecuaciones-de-equilibrio-de-la-pieza-curva`.
#    - La **cuestión 2** es la cuestión 4 de la segunda parte del 7 de enero
#      de 2020 (`exerm1920-2par-4-…`) sin «Deducir la» delante. Rúbrica
#      compartida `ecuacion-de-los-tres-momentos`.
#    Las otras cinco no están en ningún examen del sitio; el problema 4
#    tiene casi el texto de `exerm2021-ext-8`, con otra estructura.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso (src/lib/erm) y de un segundo camino
# (fase-p/p9m, guiones/cifras.mjs). Las cuestiones 1, 2 y 3 no traen
# números: sus pasos de cálculo usan ejemplos nuestros, y lo dicen.
pdf: 2017-2018-ext.pdf
puntosImpresos:
  fuente: >-
    Impresos junto a cada pregunta: «1.(1p)», «2. (1p)», «3. (1p)» y
    «4.(1p)» en la teoría, p. 1; «1. (1,5p)» y «2. (1,5p)» en la p. 2 y
    «3. (1,5p)» en la p. 4, en los problemas; «4. (1,5p)» solo en el Word,
    porque el PDF no imprime el enunciado del problema 4.
  reparto:
    - { n: 1, puntos: 1 }
    - { n: 2, puntos: 1 }
    - { n: 3, puntos: 1 }
    - { n: 4, puntos: 1 }
    - { n: 5, puntos: 1.5 }
    - { n: 6, puntos: 1.5 }
    - { n: 7, puntos: 1.5 }
    - { n: 8, puntos: 1.5 }

