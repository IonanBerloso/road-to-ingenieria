ejercicios:
  # La cuestión 4 de teoría no va aquí: es un ejercicio ya publicado (ver la
  # cabecera del examen.yaml).
  # ── Teoría · cuestión 1 · las ecuaciones de equilibrio de la pieza curva.
  - id: exerm1718-ext-1-las-ecuaciones-de-la-pieza-curva
    titulo: Las ecuaciones diferenciales de equilibrio de la pieza curva, y dos ejemplos con ellas
    fuente: >-
      Cuestión 1 de teoría · Extraordinaria del 14 de junio de 2018 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. La misma deducción, con otro texto
      y con la figura de la rebanada, ya había caído como pregunta 1 de
      teoría del primer parcial de 2013-2014, y está resuelta en el sitio;
      aquí va con otros ejemplos. El examen no publica resolución; el desarrollo es
      nuestro y sigue los apuntes del tema 7, apartado 7.6 (pp. 13-14). Los
      números de los pasos de cálculo son ejemplos nuestros.
    nivel: examen
    enunciado: |
      1.(1p) Deducir las ecuaciones diferenciales de equilibrio en una pieza
      prismática curva, sometida a las fuerzas por unidad de longitud $q_r$ y
      $q_\theta$.

      **Notas nuestras.** El examen no trae figura. Los sentidos positivos
      son los de la figura 7.7 de los apuntes: O, el centro de curvatura,
      queda debajo de la rebanada y $\theta$ crece hacia la derecha; $q_r$
      apunta hacia O y $q_\theta$ hacia donde crece $\theta$; en la cara de
      $\theta + d\theta$, $N$ sale de la rebanada, $T$ va hacia O y $M$ gira
      en sentido antihorario.
    pide: >-
      Las ecuaciones diferenciales de equilibrio de la rebanada de una pieza
      prismática curva, deducidas.
    pasos:
      - tipo: reconocer
        pregunta: |
          Frente a la rebanada de una pieza recta, ¿qué cambia en la de una
          pieza curva, y qué consecuencia tiene en sus ecuaciones?
        opciones:
          - texto: >-
              Sus dos caras no son paralelas, forman el ángulo $d\theta$: el
              axil tiene componente radial y la cortante, componente
              tangencial, y las ecuaciones de $N$ y de $T$ quedan acopladas
            correcta: true
            mensaje: |
              Eso es (apartado 7.6, p. 13). Con $\sin(d\theta/2) \approx d\theta/2$,
              los axiles de las dos caras dan $-N\,d\theta$ en la dirección
              radial, y las cortantes, $-T\,d\theta$ en la tangencial: $T$
              entra en la ecuación de $N$ (ec. 7.18) y $N$ en la de $T$
              (ec. 7.19). En la pieza recta, con las caras paralelas, cada
              ecuación va por su lado.
          - texto: >-
              Nada de fondo: son las de la pieza recta, cambiando $dx$ por
              $R\,d\theta$
            mensaje: |
              Eso solo vale para la de momentos: $dM/d\theta = TR$ (ec. 7.21)
              es $dM/ds = T$ con $ds = R\,d\theta$. Las otras dos llevan un
              término que la recta no tiene, $T$ en la tangencial y $N$ en la
              radial, porque las caras no son paralelas.
          - texto: >-
              Que el flector deja de entrar en el equilibrio, porque las
              cargas radiales pasan por el centro de curvatura
            mensaje: |
              $q_r$ y las cortantes sí pasan por O, pero el equilibrio de
              momentos respecto de O lleva $dM$, los axiles, con brazo $R$, y
              la carga tangencial, con brazo $R$ (ec. 7.20). El flector sigue
              ahí.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción completa de las tres ecuaciones, como en el
          examen: dibuja la rebanada con sus sentidos positivos, proyecta las
          fuerzas según la tangente y según el radio y toma momentos respecto
          del centro de curvatura.
        rubrica: ecuaciones-de-equilibrio-de-la-pieza-curva
      - tipo: calcular
        titulo: La pendiente del axil
        pregunta: |
          Un ejemplo nuestro: en una sección de una pieza curva de radio
          $R$ = 2 m, la cortante vale $T$ = 3 kN y la carga tangencial,
          $q_\theta$ = 5 kN/m, va hacia donde crece $\theta$. ¿Cuánto vale
          allí $dN/d\theta$, en kN por radián?
        respuesta:
          tipo: numero
          valor: '-7'
          tolerancia: 0.01
          formato: un número con su signo, en kN por radián
        distractores:
          - valor: '3'
            mensaje: |
              Te has dejado la carga. La ec. 7.18 es
              $dN/d\theta = T - q_\theta R$, y aquí $q_\theta$ no es nula: sobre
              la rebanada actúa $q_\theta R\,d\theta$.
          - valor: '13'
            mensaje: |
              El signo de la carga. En la tangente,
              $dN - T\,d\theta + q_\theta R\,d\theta = 0$: la carga va con
              $dN$, y al despejar pasa restando (ec. 7.18).
          - valor: '-2'
            mensaje: |
              Te has dejado $R$. $q_\theta$ va por unidad de longitud de la
              directriz, y la rebanada mide $R\,d\theta$: en la ec. 7.18 entra
              $q_\theta R$ = 10 kN, no 5.
        pista: |
          $dN/d\theta = T - q_\theta R$ (ec. 7.18).
        desarrollo: |
          $$
          \frac{dN}{d\theta} = T - q_\theta R = 3\ \text{kN} - 5\ \text{kN/m}\cdot2\ \text{m} = -7\ \text{kN}
          $$

          por radián: el axil disminuye al avanzar $\theta$.
      - tipo: calcular
        titulo: La pendiente del flector
        pregunta: |
          Otro ejemplo nuestro: en una sección de una pieza curva de radio
          $R$ = 2,5 m, con $q_\theta$ = 2 kN/m, el axil cambia a razón de
          $dN/d\theta$ = −1 kN por radián. ¿Cuánto vale allí $dM/d\theta$, en
          kN·m por radián?
        respuesta:
          tipo: numero
          valor: '10'
          tolerancia: 0.01
          formato: un número con su signo, en kN·m por radián
        distractores:
          - valor: '-2.5'
            mensaje: |
              Te falta la carga tangencial. Respecto de O, $q_\theta R\,d\theta$
              tiene brazo $R$: la ec. 7.20 es
              $dM/d\theta = R\,dN/d\theta + q_\theta R^{2}$.
          - valor: '15'
            mensaje: |
              El signo del término de los axiles: en la ec. 7.20,
              $R\,dN/d\theta$ suma. Con $dN/d\theta$ negativo resta
              2,5 kN·m.
          - valor: '2.5'
            mensaje: |
              Has puesto $q_\theta R$ donde va $q_\theta R^{2}$: la carga de la
              rebanada es $q_\theta R\,d\theta$, y su brazo respecto de O es
              otra vez $R$.
        pista: |
          La ec. 7.20, $dM/d\theta = R\,dN/d\theta + q_\theta R^{2}$; o la
          7.18 para sacar $T$ y luego la 7.21.
        desarrollo: |
          Con la 7.20:

          $$
          \frac{dM}{d\theta} = R\frac{dN}{d\theta} + q_\theta R^{2} = 2{,}5\ \text{m}\cdot(-1\ \text{kN}) + 2\ \text{kN/m}\cdot(2{,}5\ \text{m})^{2} = 10\ \text{kN·m}
          $$

          por radián. Por el otro camino: la 7.18 da
          $T = dN/d\theta + q_\theta R = 4$ kN, y la 7.21,
          $dM/d\theta = TR = 4\ \text{kN}\cdot2{,}5\ \text{m} = 10\ \text{kN·m}$.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Se dibuja la rebanada de ángulo $d\theta$ con sus sentidos
              positivos; las cargas actúan sobre $R\,d\theta$ y cada cara está
              girada $d\theta/2$ respecto del radio del centro.
          - texto: >-
              Según la tangente, $dN - T\,d\theta + q_\theta R\,d\theta = 0$,
              es decir, $dN/d\theta = T - q_\theta R$.
          - texto: >-
              Según el radio, $-N\,d\theta - dT - q_rR\,d\theta = 0$, es
              decir, $dT/d\theta = -N - q_rR$.
          - texto: >-
              Respecto de O, $dM - R\,dN - q_\theta R^{2}\,d\theta = 0$, y con
              la primera, $dM/d\theta = TR$.
          - texto: >-
              Las cargas se cuentan por unidad de ángulo: según el radio dan
              $q_r\,d\theta$ y según la tangente, $q_\theta\,d\theta$.
            trampa: true
            mensaje: |
              $q_r$ y $q_\theta$ van por unidad de longitud del eje, y el
              arco de la rebanada mide $ds = R\,d\theta$: dan
              $q_rR\,d\theta$ y $q_\theta R\,d\theta$. Sin la $R$ no salen
              las ecs. 7.18 y 7.19 (apartado 7.6, p. 13).
    resolucion: |
      **La rebanada** (apuntes del tema 7, apartado 7.6, figura 7.7). Se
      aísla un trozo de la pieza entre dos secciones radiales que forman el
      ángulo $d\theta$, con O, el centro de curvatura, debajo y $\theta$
      creciendo hacia la derecha. Las cargas van por unidad de longitud del
      eje y actúan sobre $ds = R\,d\theta$: la radial, $q_rR\,d\theta$, hacia
      O; la tangencial, $q_\theta R\,d\theta$, hacia donde crece $\theta$. En
      la cara de $\theta$, $N$ sale de la rebanada, $T$ va alejándose de O y
      $M$ es horario; en la de $\theta + d\theta$, $N + dN$ sale, $T + dT$ va
      hacia O y $M + dM$ es antihorario.

      Cada cara está girada $d\theta/2$ respecto de la tangente y del radio
      del centro de la rebanada. Con $\cos(d\theta/2) \approx 1$ y
      $\sin(d\theta/2) \approx d\theta/2$, y despreciando los productos de
      diferenciales:

      **Según la tangente.** Los axiles dan $dN$; las cortantes, inclinadas,
      $-T\,d\theta$; la carga, $q_\theta R\,d\theta$:

      $$
      dN - T\,d\theta + q_\theta R\,d\theta = 0
      \quad\Longrightarrow\quad
      \frac{dN}{d\theta} = T - q_\theta R \qquad (7.18)
      $$

      **Según el radio** (positivo hacia fuera). Ahora son los axiles los
      inclinados, y su componente va hacia O; las cortantes dan $-dT$ y la
      carga, $-q_rR\,d\theta$:

      $$
      -N\,d\theta - dT - q_rR\,d\theta = 0
      \quad\Longrightarrow\quad
      \frac{dT}{d\theta} = -N - q_rR \qquad (7.19)
      $$

      **Momentos respecto de O** (antihorario positivo). Las cortantes y
      $q_r$ son radiales y pasan por O; los axiles y $q_\theta$ son
      perpendiculares al radio y tienen brazo $R$:

      $$
      dM - R\,dN - q_\theta R^{2}\,d\theta = 0
      \quad\Longrightarrow\quad
      \frac{dM}{d\theta} = R\,\frac{dN}{d\theta} + q_\theta R^{2} \qquad (7.20)
      $$

      y con la 7.18,

      $$
      \frac{dM}{d\theta} = T\,R \qquad (7.21)
      $$

      **Lo que dicen.** La 7.21, con $ds = R\,d\theta$, es la de la pieza
      recta: $dM/ds = T$. Lo nuevo son los acoplamientos, $T$ en la primera y
      $N$ en la segunda, que salen de que las caras no son paralelas; si
      $R \to \infty$ con $R\,d\theta = dx$, desaparecen. Las ecuaciones valen
      aunque $R$ cambie con $\theta$, porque cada rebanada se plantea con su
      centro de curvatura. Los signos dependen de cómo se mide $\theta$: al
      deducirlas, hay que decirlo.

      **Dos ejemplos nuestros.** Con $R$ = 2 m, $T$ = 3 kN y
      $q_\theta$ = 5 kN/m, la 7.18 da $dN/d\theta = 3 - 10 = -7$ kN por
      radián. Con $R$ = 2,5 m, $q_\theta$ = 2 kN/m y
      $dN/d\theta$ = −1 kN por radián, la 7.20 da $dM/d\theta$ = 10 kN·m por
      radián, lo mismo que $TR$ con el $T$ = 4 kN de la 7.18.

      **Comprobaciones.** El motor del curso no tiene piezas curvas. Las
      cuatro ecuaciones se han comprobado con un arco en ménsula de radio
      2,5 m y cargas que cambian con $\theta$ ($q_r = 3 + \theta$ y
      $q_\theta = 2 - \theta/2$, en kN/m), resuelto por estática con los
      sentidos de la figura 7.7: derivando $N$, $T$ y $M$ por diferencias
      finitas, de la 7.18 a la 7.21 se cumplen en tres secciones.

  # ── Teoría · cuestión 2 · la ecuación de los tres momentos.
  - id: exerm1718-ext-2-la-ecuacion-de-los-tres-momentos
    titulo: La ecuación de los tres momentos, y una viga continua empotrada en un extremo
    fuente: >-
      Cuestión 2 de teoría · Extraordinaria del 14 de junio de 2018 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Casi la misma pregunta, con
      «Deducir la» delante y el mismo punto, volvió a caer como cuestión 4
      de teoría de la segunda parte del 7 de enero de 2020, y está resuelta
      en el sitio; aquí va con otro ejemplo. El examen no publica
      resolución; el desarrollo es nuestro y sigue los apuntes del tema 11,
      apartado 11.3 (pp. 5-7). Los números de los pasos de cálculo son un
      ejemplo nuestro.
    nivel: examen
    enunciado: |
      2. (1p) Ecuación de los 3 momentos

      **Notas nuestras.** Es una pregunta de teoría: se pide la ecuación de
      una viga continua, deducida, con el convenio del curso (el flector,
      positivo si tracciona la fibra de abajo).
    pide: >-
      La ecuación de los tres momentos de una viga continua, deducida.
    pasos:
      - tipo: reconocer
        pregunta: |
          Si un extremo de la viga continua está empotrado, ¿cómo entra el
          empotramiento en la ecuación de los tres momentos?
        opciones:
          - texto: >-
              Como un vano ficticio de inercia infinita al otro lado: el
              flector del empotramiento es una incógnita más, y en su apoyo
              se escribe una ecuación más, la de giro nulo
            correcta: true
            mensaje: |
              Eso es (figura 11.7, p. 7 del tema 11). El vano ficticio es
              el 1, con $I_1 = \infty$: sus términos se anulan, y la
              ecuación del apoyo empotrado, el 1, queda solo con el vano 2:
              $2M_1L_2/I_2 + M_2L_2/I_2 = -6A_2b_2/(L_2I_2)$, que dice que
              el giro allí es nulo.
          - texto: >-
              Como un apoyo simple, con flector nulo en el extremo
            mensaje: |
              Un apoyo simple deja girar y el empotramiento no: con el
              flector nulo en el extremo se resuelve otra viga. El flector
              del empotramiento es una incógnita, y la condición que lo fija
              es que el giro allí sea nulo.
          - texto: >-
              No entra: el flector del empotramiento sale después, con el
              equilibrio del primer vano
            mensaje: |
              Con el equilibrio no basta: el empotramiento añade un grado de
              hiperestaticidad, y su flector es una incógnita más. La
              ecuación que falta es la del giro nulo, que da el vano ficticio.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción completa, como en el examen: de la viga
          continua al sistema isostático, la continuidad de giros con la viga
          conjugada y la ecuación, con los casos del voladizo y del
          empotramiento.
        rubrica: ecuacion-de-los-tres-momentos
      - tipo: calcular
        titulo: El flector en el apoyo intermedio
        pregunta: |
          Un ejemplo nuestro: una viga continua de dos vanos iguales de
          4 m, con la misma inercia, empotrada en A, apoyada en B y
          simplemente apoyada en C, lleva una carga uniforme de 12 kN/m en
          toda su longitud. ¿Cuánto vale el flector en B, en kN·m?
        respuesta:
          tipo: numero
          valor: '-20.571'
          tolerancia: 0.01
          formato: un número, en kN·m, positivo si tracciona la fibra de abajo
        distractores:
          - valor: '-24'
            mensaje: |
              Es el flector en B con A simplemente apoyado, $qL^{2}/8$: has
              tratado el empotramiento como un apoyo simple. A no gira, y eso
              descarga B: hace falta la ecuación del vano ficticio en A.
          - valor: '20.571'
            mensaje: |
              El valor es el bueno y el signo no. Encima de un apoyo
              intermedio la viga continua tracciona la fibra de arriba: el
              flector es negativo.
          - valor: '-16'
            mensaje: |
              Es $qL^{2}/12$, el flector de un vano biempotrado: como si B no
              girase. B gira, y su flector sale de las dos ecuaciones a la
              vez.
        pista: |
          Dos incógnitas, $M_A$ y $M_B$ ($M_C = 0$), y dos ecuaciones: la de
          A, con el vano ficticio, y la de B. Para una carga uniforme,
          $6A\,a/L = 6A\,b/L = qL^{3}/4$.
        desarrollo: |
          Con la misma inercia (ec. 11.4), en A, con el vano ficticio, y en
          B:

          $$
          2M_A\cdot4 + M_B\cdot4 = -\frac{12\cdot4^{3}}{4},\qquad
          M_A\cdot4 + 2M_B(4 + 4) = -2\cdot\frac{12\cdot4^{3}}{4}
          $$

          Es decir, $2M_A + M_B = -48$ y $M_A + 4M_B = -96$, en kN·m. De la
          primera, $M_A = -24 - M_B/2$, y en la segunda, $3{,}5M_B = -72$:

          $$
          M_B = -\frac{3qL^{2}}{28} = -20{,}571\ \text{kN·m}
          $$
      - tipo: calcular
        titulo: El flector en el empotramiento
        pregunta: |
          ¿Y el flector en el empotramiento A, en kN·m?
        respuesta:
          tipo: numero
          valor: '-13.714'
          tolerancia: 0.01
          formato: un número, en kN·m, positivo si tracciona la fibra de abajo
        distractores:
          - valor: '-16'
            mensaje: |
              Es $qL^{2}/12$, el del vano AB biempotrado. B no es un
              empotramiento: gira, y el flector de A baja.
          - valor: '-24'
            mensaje: |
              Es $qL^{2}/8$, el empotramiento de un vano empotrado y apoyado,
              como si B no tuviera nada a la derecha. El vano BC carga B y le
              impide girar libremente.
          - valor: '13.714'
            mensaje: |
              El signo: un empotramiento con carga hacia abajo tracciona la
              fibra de arriba, y el flector es negativo.
        pista: |
          Lleva $M_B$ a la ecuación de A: $2M_A + M_B = -qL^{2}/4$.
        desarrollo: |
          $$
          M_A = \frac{-48\ \text{kN·m} - M_B}{2} = \frac{-48\ \text{kN·m} + 20{,}571\ \text{kN·m}}{2} = -13{,}714\ \text{kN·m}
          $$

          que es $-qL^{2}/14$.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Se libera el giro en los apoyos intermedios y sus flectores
              pasan a ser incógnitas: quedan vanos biapoyados.
          - texto: >-
              En cada vano, el flector es la suma de las dos rectas de los
              flectores de sus extremos y del diagrama isostático de sus
              cargas.
          - texto: >-
              Con la viga conjugada se escriben los giros a los dos lados de
              cada apoyo intermedio.
          - texto: >-
              Igualándolos y multiplicando por $6E$ sale una ecuación por
              apoyo intermedio, con los flectores de tres apoyos seguidos.
          - texto: >-
              Los descensos de los apoyos no entran en la ecuación: solo
              lleva flectores y cargas.
            trampa: true
            mensaje: |
              Sí entran. Si los apoyos bajan, cada vano gira además
              $(\delta_i - \delta_{i-1})/L_i$, y la ec. 11.3 lleva un término
              con $E$ y esos descensos. Solo se anula cuando los apoyos no se
              mueven.
    resolucion: |
      **El sistema isostático.** Una viga continua de $N$ vanos y $N + 1$
      apoyos es hiperestática de grado $N - 1$, el número de apoyos
      intermedios (apartado 11.3, p. 5 del tema 11). Se libera el giro
      encima de cada apoyo intermedio y se ponen sus flectores $M_i$ como
      incógnitas: quedan $N$ vigas biapoyadas (figuras 11.3 y 11.4). La
      condición que falta es la que se ha liberado: el giro, a la izquierda y
      a la derecha de cada apoyo, es el mismo.

      **Los giros de cada lado.** En el vano $[i]$, entre los apoyos $i - 1$
      e $i$, de luz $L_i$ e inercia $I_i$, el flector es la suma de la recta
      de $M_{i-1}$, la de $M_i$ y el diagrama isostático de sus cargas, de
      área $A_i$, con su centro de gravedad a $a_i$ del apoyo izquierdo y a
      $b_i$ del derecho. Con la viga conjugada, el giro del apoyo $i$ por la
      izquierda es el cortante conjugado del vano $[i]$ (ec. 11.1, p. 6), y
      por la derecha, el del vano $[i + 1]$ (ec. 11.2), con los descensos de
      los apoyos si los hay.

      **La ecuación.** Igualando los dos giros y multiplicando por $6E$
      (ec. 11.3, p. 7):

      $$
      M_{i-1}\frac{L_i}{I_i} + 2M_i\Big(\frac{L_i}{I_i} + \frac{L_{i+1}}{I_{i+1}}\Big) + M_{i+1}\frac{L_{i+1}}{I_{i+1}} = -\frac{6A_ia_i}{L_iI_i} - \frac{6A_{i+1}b_{i+1}}{L_{i+1}I_{i+1}}
      $$

      más el término de los descensos de los apoyos, que se anula si no se
      mueven. Hay una por apoyo intermedio: $N - 1$ ecuaciones para $N - 1$
      incógnitas. Con la misma inercia en todos los vanos queda la ec. 11.4.

      **Los extremos.** Un voladizo se sustituye por su flector en el apoyo,
      que es conocido (figura 11.6). Un empotramiento se sustituye por un
      vano ficticio de inercia infinita (figura 11.7): sus términos se
      anulan, el flector del empotramiento es una incógnita más y su
      ecuación dice que allí el giro es nulo.

      **El ejemplo.** Dos vanos de 4 m con 12 kN/m, empotrada en A y apoyada
      en B y en C. Para una carga uniforme, $6A\,a/L = 6A\,b/L = qL^{3}/4$ =
      192 kN·m², y con $M_C = 0$:

      $$
      \begin{aligned}
      \text{en A:}&\quad 8M_A + 4M_B = -192\ \text{kN·m}^{2}\\
      \text{en B:}&\quad 4M_A + 16M_B = -384\ \text{kN·m}^{2}
      \end{aligned}
      $$

      que dan $M_B = -3qL^{2}/28 = -20{,}571$ kN·m y
      $M_A = -qL^{2}/14 = -13{,}714$ kN·m. Los dos traccionan la fibra de
      arriba.

      **Comprobaciones.** El motor del curso da los dos flectores con la
      ecuación de los tres momentos y el extremo empotrado, y otra vez
      integrando la elástica de la viga entera con sus tres apoyos; con A
      simplemente apoyado, la misma viga da $M_B = -qL^{2}/8 = -24$ kN·m.

  # ── Teoría · cuestión 3 · dónde aplicar la carga para que no haya torsión.
  - id: exerm1718-ext-3-donde-cargar-la-viga-de-seccion-en-c
    titulo: Dónde cargar una viga de sección en C para que no se tuerza
    fuente: >-
      Cuestión 3 de teoría · Extraordinaria del 14 de junio de 2018 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 12, apartado 12.6
      (pp. 14-15). Los números de los pasos de cálculo son un ejemplo
      nuestro.
    nivel: examen
    enunciado: |
      3. (1p) Una viga empotrada soporta la carga $P$ en el extremo libre.
      ¿En qué punto de la sección hay que aplicar la carga para que la viga
      no esté sometida a torsión?

