      - tipo: calcular
        titulo: El centro de gravedad de la T
        pregunta: |
          ¿A qué distancia de la cara de abajo del ala está el centro de
          gravedad de la sección, en cm?
        respuesta:
          tipo: numero
          valor: '5.737'
          tolerancia: 0.01
          formato: un número, en cm, desde la cara de abajo
        distractores:
          - valor: '10'
            mensaje: |
              Es la mitad del canto. La T no es simétrica respecto de un eje
              horizontal: el ala, ancha, baja el centro de gravedad.
          - valor: '14.263'
            mensaje: |
              Es la distancia desde la cara de arriba del alma. La pregunta
              la mide desde la cara de abajo del ala: $20 - 14{,}263$.
        pista: |
          Ala: 40 cm² con su centro a 1 cm de la cara de abajo; alma: 36 cm²
          con su centro a 2 + 9 = 11 cm.
        desarrollo: |
          $$
          \overline{y} = \frac{40\ \text{cm}^{2}\cdot1\ \text{cm} + 36\ \text{cm}^{2}\cdot11\ \text{cm}}{76\ \text{cm}^{2}} = 5{,}737\ \text{cm}
          $$

          desde la cara de abajo; desde la de arriba, 14,263 cm.
      - tipo: calcular
        titulo: El momento de inercia de la T
        pregunta: |
          ¿Cuánto vale $I_z$, el momento de inercia respecto del eje
          horizontal que pasa por el centro de gravedad, en cm⁴?
        respuesta:
          tipo: numero
          valor: '2880.07'
          tolerancia: 0.5
          formato: un número, en cm⁴
        distractores:
          - valor: '985.33'
            mensaje: |
              Te falta Steiner. Cada rectángulo aporta su inercia propia más
              su área por el cuadrado de la distancia de su centro al de la
              sección: $40\cdot4{,}737^{2}$ y $36\cdot5{,}263^{2}$ cm⁴.
          - valor: '8405.1'
            mensaje: |
              Has medido las distancias de Steiner con el centro de gravedad
              a 14,263 cm de la cara de abajo. Esa es su distancia a la cara
              de arriba: desde abajo está a 5,737 cm.
        pista: |
          Steiner con cada rectángulo: el ala, $20\cdot2^{3}/12$ más
          $40\cdot(5{,}737 - 1)^{2}$; el alma, $2\cdot18^{3}/12$ más
          $36\cdot(11 - 5{,}737)^{2}$.
        desarrollo: |
          $$
          I_z = \frac{20\cdot2^{3}}{12}\ \text{cm}^{4} + 40\ \text{cm}^{2}\cdot(4{,}7368\ \text{cm})^{2} + \frac{2\cdot18^{3}}{12}\ \text{cm}^{4} + 36\ \text{cm}^{2}\cdot(5{,}2632\ \text{cm})^{2} = 2880{,}07\ \text{cm}^{4}
          $$
      - tipo: calcular
        titulo: La longitud a
        pregunta: |
          ¿Qué valor de $a$, en cm, hace que la tensión de tracción máxima
          de la viga sea 2000 kg/cm²?
        respuesta:
          tipo: numero
          valor: '182.94'
          tolerancia: 0.5
          formato: un número, en cm
        distractores:
          - valor: '179.25'
            mensaje: |
              Has tomado la sección del flector máximo, $x = 2{,}5a$, sin su
              axil. Allí $N = -4{,}33q_0a$ comprime y rebaja la tracción; y
              aunque lo cuentes (sale 183,9 cm), la sección que manda es otra:
              justo a la derecha de C, con $3q_0a^{2}$ y sin axil.
          - valor: '187.77'
            mensaje: |
              Has puesto en C el axil de AC. Justo a la derecha de C, en el
              voladizo, el axil es nulo: la reacción horizontal de C lo
              corta. Esa sección, con $3q_0a^{2}$ y sin compresión, es la que
              manda.
          - valor: '116.02'
            mensaje: |
              Has usado la fibra de arriba, a 14,26 cm del centro de
              gravedad. Con el flector positivo en toda la viga, la de arriba
              está comprimida: la tracción está en la de abajo, a 5,74 cm.
        pista: |
          $\sigma_x = N/A + M\,y/I_z$ (ec. 9.42) en la fibra de abajo,
          $y = 5{,}737$ cm. Compara la sección de $x = 2{,}5a$, con
          $M = 3{,}125q_0a^{2}$ y $N = -4{,}33q_0a$, con la de justo a la
          derecha de C, con $M = 3q_0a^{2}$ y $N = 0$.
        desarrollo: |
          Con $q_0$ = 1000 kg/m = 10 kg/cm. Justo a la derecha de C, sin
          axil:

          $$
          a = \sqrt{\frac{2000\ \text{kg/cm}^{2}\cdot2880{,}07\ \text{cm}^{4}}{3\cdot10\ \text{kg/cm}\cdot5{,}7368\ \text{cm}}} = 182{,}94\ \text{cm}
          $$

          Con esa $a$, en $x = 2{,}5a$ la fibra de abajo está a

          $$
          \frac{3{,}125\cdot10\ \text{kg/cm}\cdot(182{,}94\ \text{cm})^{2}\cdot5{,}7368\ \text{cm}}{2880{,}07\ \text{cm}^{4}} - \frac{4{,}3301\cdot10\ \text{kg/cm}\cdot182{,}94\ \text{cm}}{76\ \text{cm}^{2}} = 1979{,}1\ \text{kg/cm}^{2}
          $$

          por debajo de 2000: manda C.
      - tipo: calcular
        titulo: El radio de la barra
        pregunta: |
          Con $a$ = 182,94 cm, ¿qué radio tiene que tener la barra 1, en cm,
          para que A se desplace 2 cm?
        respuesta:
          tipo: numero
          valor: '0.7843'
          tolerancia: 0.002
          formato: un número, en cm
        distractores:
          - valor: '0.5546'
            mensaje: |
              Has igualado el alargamiento de la barra al desplazamiento de
              A. A baja 2 cm en vertical, y la barra solo nota la proyección
              sobre su eje: $2\sin30°$ = 1 cm (ec. 8.12).
          - valor: '0.5959'
            mensaje: |
              Has proyectado con el coseno. A se mueve en vertical, y la
              barra forma 30° con la horizontal: el ángulo entre las dos
              direcciones es de 60°, y la proyección, $2\sin30°$.
          - valor: '0.7298'
            mensaje: |
              Has tomado $L = 2a$, la proyección horizontal de la barra. La
              barra mide $2a/\cos30°$ = 422,5 cm.
          - valor: '1.5685'
            mensaje: |
              Es el diámetro. El área es $\pi r^{2}$: el radio es la mitad.
        pista: |
          La viga es rígida y gira alrededor de C: A baja 2 cm. La barra se
          alarga la proyección de ese desplazamiento sobre su eje (ec. 8.12),
          y $\Delta L = NL/(EA)$ (ec. 8.9).
        desarrollo: |
          $N = 5q_0a = 9147{,}2$ kg, $L = 2a/\cos30° = 422{,}49$ cm y
          $\Delta L = 2\ \text{cm}\cdot\sin30° = 1$ cm:

          $$
          A = \frac{NL}{E\,\Delta L} = \frac{9147{,}2\ \text{kg}\cdot422{,}49\ \text{cm}}{2\cdot10^{6}\ \text{kg/cm}^{2}\cdot1\ \text{cm}} = 1{,}9323\ \text{cm}^{2}
          $$

          $$
          r = \sqrt{\frac{A}{\pi}} = \sqrt{\frac{1{,}9323\ \text{cm}^{2}}{\pi}} = 0{,}7843\ \text{cm}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Momentos respecto de C: la barra lleva $N = 5q_0a$ de tracción.
          - texto: >-
              Su componente horizontal comprime AC con $4{,}33q_0a$; CD no
              tiene axil.
          - texto: >-
              El flector es positivo en toda la viga: $3{,}125q_0a^{2}$ en
              $x = 2{,}5a$ y $3q_0a^{2}$ en C.
          - texto: >-
              La tracción máxima está en la fibra de abajo justo a la derecha
              de C, sin axil, y da $a$ = 182,94 cm.
          - texto: >-
              La viga gira alrededor de C: A baja 2 cm, la barra se alarga
              1 cm y su radio es de 0,784 cm.
          - texto: >-
              La tracción máxima está siempre en la sección del flector
              máximo, $x = 2{,}5a$.
            trampa: true
            mensaje: |
              No si hay axil. En AC la compresión rebaja la fibra de abajo,
              y justo a la derecha de C el flector es solo un 4 % menor y no
              hay compresión. Con $a$ = 182,94 cm, C llega a 2000 kg/cm² y
              $x = 2{,}5a$ se queda en 1979.
    resolucion: |
      **Las reacciones.** La barra 1, biarticulada y sin cargas, solo lleva
      axil $N$, según su eje, a 30° de la viga. Momentos respecto de C:

      $$
      N\sin30°\cdot3a = 3q_0a\cdot1{,}5a + 3q_0a\cdot a
      \quad\Rightarrow\quad N = 5q_0a
      $$

      de tracción. En C, la reacción horizontal es
      $-N\cos30° = -4{,}33q_0a$ y la vertical,
      $3q_0a - 3q_0a - 2{,}5q_0a = -2{,}5q_0a$: hacia abajo.

      **a/ Los diagramas.** Axil: $-4{,}33q_0a$ de A a C, cero de C a D. De
      A a C, $T = 2{,}5q_0a - q_0x$ y $M = 2{,}5q_0a\,x - q_0x^{2}/2$: el
      cortante se anula en $x = 2{,}5a$, donde el flector es máximo,
      $3{,}125q_0a^{2}$; en C, $T = -0{,}5q_0a$ y $M = 3q_0a^{2}$. En C el
      cortante salta a $-3q_0a$, constante hasta D, y el flector baja en
      recta hasta cero en D (ecs. 7.14 y 7.15).

      **La sección.** La T invertida tiene $A$ = 76 cm², el centro de
      gravedad a 5,737 cm de la cara de abajo e $I_z$ = 2880,07 cm⁴.

      **b/ La longitud $a$.** El flector es positivo en toda la viga: la
      tracción está en la fibra de abajo, $y$ = 5,737 cm, con
      $\sigma_x = N/A + M\,y/I_z$ (ec. 9.42, tema 9, p. 24). Hay dos
      candidatas: $x = 2{,}5a$, con el flector máximo y la compresión de
      AC, y la sección justo a la derecha de C, con $3q_0a^{2}$ y sin axil.
      Con $q_0$ = 10 kg/cm, la segunda da

      $$
      \frac{3\cdot10\ \text{kg/cm}\cdot a^{2}\cdot5{,}7368\ \text{cm}}{2880{,}07\ \text{cm}^{4}} = 2000\ \text{kg/cm}^{2}
      \quad\Rightarrow\quad a = 182{,}94\ \text{cm}
      $$

      y con esa $a$ la primera se queda en 1979,1 kg/cm². Manda C:
      $a$ = 182,94 cm. La fibra de arriba está comprimida en toda la viga.

      **c/ El radio de la barra.** La viga es rígida y gira alrededor de C,
      así que A se mueve en vertical: baja 2 cm. La barra se alarga la
      proyección de ese desplazamiento sobre su eje (ec. 8.12, tema 8,
      p. 8), $2\sin30°$ = 1 cm. Con $N = 5q_0a$ = 9147,2 kg y
      $L = 2a/\cos30°$ = 422,49 cm, $\Delta L = NL/(EA)$ (ec. 8.9, p. 7)
      da $A$ = 1,9323 cm² y

      $$
      r = \sqrt{\frac{1{,}9323\ \text{cm}^{2}}{\pi}} = 0{,}7843\ \text{cm}
      $$

      **Comprobaciones.** El motor del curso resuelve la viga con la barra
      como un apoyo que reacciona según su eje y da $N$, las reacciones y
      los diagramas; a mano, el equilibrio da lo mismo. La sección sale del
      motor y de Steiner a mano. Para $a$, el motor busca la raíz de la
      tensión en las dos secciones, y la fórmula cerrada coincide. El radio
      sale también por trabajo virtual: una fuerza unidad vertical en A
      carga la barra con 2, y $\delta_A = 2NL/(EA)$ da la misma área.

  # ── Problema 3 · el eje escalonado con flexión y torsión.
  - id: exerm1718-ext-7-el-eje-escalonado-con-flexion-y-torsion
    titulo: Un eje escalonado con una carga excéntrica en el cambio de diámetro, sus diagramas y la carga que lo gira 2°
    fuente: >-
      Problema 3 · Extraordinaria del 14 de junio de 2018 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 1,5 puntos. El examen no publica resolución; el
      desarrollo es nuestro, con los convenios del curso, y cada cifra está
      comprobada por dos caminos.
    nivel: examen
    enunciado: |
      3. (1,5p) El eje de sección circular de la figura soporta una carga
      excéntrica que origina flexión y torsión. Determinar:

      a/ Diagramas de fuerzas cortantes y de momentos flectores en función
      de $P$ y $b$.

      b/ Diagrama de momentos torsores en función de $M_0$.

      c/ El valor de $P$ para que el ángulo de torsión máximo sea de 2º,
      siendo $M_0 = \tfrac18Pb$.

      $D_{AB} = 2D_{BC}$; c/ $G$ = 25 GPa; $b$ = 1m; $D_{BC}$ = 4 cm

