          <text x="78" y="17" font-size="12" fill="var(--ink)" font-weight="bold" text-anchor="middle">A</text>
          <line x1="276" y1="22" x2="276" y2="330" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
