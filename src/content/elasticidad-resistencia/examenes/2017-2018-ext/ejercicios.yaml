      **Notas nuestras.** El enunciado no da el material del cuerpo 2: se
      toma rígido, y solo transmite al cuerpo 1 la carga $\sigma_2$, que
      actúa en todo su ancho $a_2$. $\sigma_0$ actúa en las dos caras del
      cuerpo 1 perpendiculares a $x$, y el suelo no le impide deformarse en
      $x$ ni en $z$. Que el cuerpo 2 ascienda $h$ es que la cara de arriba
      del cuerpo 1, sobre la que se apoya, suba $h$. Tensiones positivas de
      tracción.
    pide: >-
      a/ La tensión σ0 que hace subir el cuerpo 2 la distancia h. b/ Las
      variaciones de longitud del cuerpo 1 en x, y y z. c/ Su variación de
      volumen.
    pasos:
      - tipo: reconocer
        pregunta: |
          El cuerpo 1 está comprimido en $x$ por $\sigma_0$ y en $y$ por el
          cuerpo 2. ¿Cómo puede subir la cara de arriba?
        opciones:
          - texto: >-
              Por el efecto Poisson: la compresión en $x$ lo alarga en $y$, y
              si $\nu\sigma_0$ gana a la compresión en $y$, la cara de arriba
              sube
            correcta: true
            mensaje: |
              Eso es. Con Hooke (ec. 4.2, tema 4, p. 4),
              $\varepsilon_y = [\sigma_y - \nu(\sigma_x + \sigma_z)]/E$: con
              $\sigma_x = -\sigma_0$, el término $+\nu\sigma_0/E$ alarga el
              cuerpo en $y$. Basta con un $\sigma_0$ grande para que gane al
              acortamiento de $\sigma_y$ y suba lo que se pide.
          - texto: >-
              No puede: comprimido en las dos direcciones, el cuerpo 1 solo
              puede acortarse en $y$
            mensaje: |
              Eso sería cierto sin efecto Poisson. Una compresión en $x$
              alarga el cuerpo en las otras dos direcciones, $\nu\sigma_0/E$
              en cada una, y en $y$ ese alargamiento compite con el
              acortamiento de $\sigma_y$.
          - texto: >-
              Porque $\sigma_0$ empuja el cuerpo 2 hacia arriba a través del
              rozamiento de las caras laterales
            mensaje: |
              $\sigma_0$ actúa en las caras del cuerpo 1, no en el 2, y es
              normal a ellas: no da fuerza vertical. Lo que sube la cara de
              arriba es la deformación del cuerpo 1, que se ensancha en $y$
              al comprimirlo en $x$.
      - tipo: calcular
        titulo: La tensión vertical en el cuerpo 1
        pregunta: |
          ¿Cuánto vale $\sigma_y$ en el cuerpo 1, en MPa?
        respuesta:
          tipo: numero
          valor: '-12'
          tolerancia: 0.05
          formato: un número con su signo, en MPa (positivo si es de tracción)
        distractores:
          - valor: '-10'
            mensaje: |
              Has pasado la tensión tal cual de un cuerpo al otro. Lo que pasa
              es la fuerza: $\sigma_2$ actúa sobre $a_2c$ y se reparte sobre
              la cara de arriba del 1, que es más estrecha, $a_1c$.
          - valor: '-8.333'
            mensaje: |
              Has dividido al revés. La fuerza es $\sigma_2a_2c$, y la cara
              del cuerpo 1 que la recibe, $a_1c$: como $a_1 < a_2$, la tensión
              crece.
        pista: |
          La fuerza del cuerpo 2 es $\sigma_2a_2c$, y se apoya en la cara de
          arriba del 1, de área $a_1c$.
        desarrollo: |
          $$
          \sigma_y = -\frac{\sigma_2a_2c}{a_1c} = -\frac{10\ \text{MPa}\cdot1{,}2\ \text{m}}{1{,}0\ \text{m}} = -12\ \text{MPa}
          $$

          de compresión. Además, $\sigma_x = -\sigma_0$ y, libre en $z$,
          $\sigma_z = 0$.
      - tipo: calcular
        titulo: La tensión que hace subir el cuerpo 2
        pregunta: |
          ¿Cuánto tiene que valer $\sigma_0$, en MPa, para que el cuerpo 2
          suba $h$ = 4 mm?
        respuesta:
          tipo: numero
          valor: '80'
          tolerancia: 0.1
          formato: un número, en MPa (de compresión)
        distractores:
          - valor: '73.33'
            mensaje: |
              Has tomado $\sigma_y = -\sigma_2 = -10$ MPa. El cuerpo 1 recibe
              la fuerza del 2 en una cara más estrecha: $\sigma_y$ vale
              $-\sigma_2a_2/a_1 = -12$ MPa.
          - valor: '58.77'
            mensaje: |
              Has impedido la deformación en $z$, como en deformación plana:
              eso crea $\sigma_z = \nu(\sigma_x + \sigma_y)$. El enunciado dice
              lo contrario, que el cuerpo es libre en $z$: $\sigma_z = 0$.
          - valor: '40'
            mensaje: |
              Te has olvidado del cuerpo 2: con $\sigma_y = 0$, $\sigma_0$
              solo tendría que alargar el cuerpo 4 mm. Pero el 2 lo aprieta
              con $-12$ MPa, y $\sigma_0$ tiene que vencer también ese
              acortamiento.
        pista: |
          $\varepsilon_y = h/b_1$, y con Hooke (ec. 4.2)
          $\varepsilon_y = [\sigma_y - \nu(\sigma_x + \sigma_z)]/E$, con
          $\sigma_x = -\sigma_0$ y $\sigma_z = 0$.
        desarrollo: |
          La cara de arriba sube $h$:
          $\varepsilon_y = 4\ \text{mm}/1000\ \text{mm} = 0{,}004$. Con Hooke,

          $$
          \varepsilon_y = \frac{\sigma_y + \nu\sigma_0}{E}
          \quad\Rightarrow\quad
          \sigma_0 = \frac{E\varepsilon_y - \sigma_y}{\nu} = \frac{3000\ \text{MPa}\cdot0{,}004 + 12\ \text{MPa}}{0{,}3} = 80\ \text{MPa}
          $$
      - tipo: calcular
        titulo: El acortamiento en x
        pregunta: |
          ¿Cuánto cambia la dimensión $a_1$ del cuerpo 1, en mm?
        respuesta:
          tipo: numero
          valor: '-25.467'
          tolerancia: 0.05
          formato: un número con su signo, en mm (positivo si se alarga)
        distractores:
          - valor: '-26.667'
            mensaje: |
              Te falta el efecto Poisson de $\sigma_y$. En $x$,
              $\varepsilon_x = [\sigma_x - \nu(\sigma_y + \sigma_z)]/E$: la
              compresión vertical alarga el cuerpo en $x$ y le quita 1,2 mm
              al acortamiento.
          - valor: '-27.867'
            mensaje: |
              El signo del término de Poisson. Es $-\nu(\sigma_y + \sigma_z)$,
              y con $\sigma_y = -12$ MPa queda $+3{,}6$ MPa: alarga, no acorta.
          - valor: '-30.56'
            mensaje: |
              Has multiplicado por $a_2$. La deformación es la del cuerpo 1,
              y su dimensión en $x$ es $a_1$ = 1,0 m.
        pista: |
          $\Delta a_1 = \varepsilon_xa_1$, con
          $\varepsilon_x = [\sigma_x - \nu(\sigma_y + \sigma_z)]/E$.
        desarrollo: |
          $$
          \Delta a_1 = \frac{\sigma_x - \nu(\sigma_y + \sigma_z)}{E}\,a_1 = \frac{-80\ \text{MPa} + 0{,}3\cdot12\ \text{MPa}}{3000\ \text{MPa}}\cdot1000\ \text{mm} = -25{,}47\ \text{mm}
          $$

          En $y$, por construcción, $\Delta b_1 = h = 4$ mm.
      - tipo: calcular
        titulo: El alargamiento en z
        pregunta: |
          ¿Cuánto cambia la dimensión $c$ del cuerpo 1, en mm?
        respuesta:
          tipo: numero
          valor: '9.2'
          tolerancia: 0.02
          formato: un número con su signo, en mm (positivo si se alarga)
        distractores:
          - valor: '-9.2'
            mensaje: |
              El signo. Las dos tensiones son de compresión, y en $z$ solo
              actúan por Poisson: $-\nu(\sigma_x + \sigma_y)$ es positivo, y el
              cuerpo se alarga.
          - valor: '8'
            mensaje: |
              Solo has contado $\sigma_0$. La compresión vertical, $\sigma_y$,
              también ensancha el cuerpo en $z$: 1,2 mm más.
          - valor: '1.2'
            mensaje: |
              Solo has contado $\sigma_y$. $\sigma_0$ también actúa en $z$
              por Poisson, y es la que más aporta.
        pista: |
          $\Delta c = \varepsilon_zc$, con
          $\varepsilon_z = [\sigma_z - \nu(\sigma_x + \sigma_y)]/E$ y
          $\sigma_z = 0$.
        desarrollo: |
          $$
          \Delta c = \frac{\sigma_z - \nu(\sigma_x + \sigma_y)}{E}\,c = \frac{0{,}3\cdot(80\ \text{MPa} + 12\ \text{MPa})}{3000\ \text{MPa}}\cdot1000\ \text{mm} = 9{,}2\ \text{mm}
          $$
      - tipo: calcular
        titulo: El cambio de volumen
        pregunta: |
          ¿Cuánto cambia el volumen del cuerpo 1, en dm³?
        respuesta:
          tipo: numero
          valor: '-12.267'
          tolerancia: 0.02
          formato: un número con su signo, en dm³ (positivo si crece)
        distractores:
          - valor: '-30.667'
            mensaje: |
              Te falta el factor $(1 - 2\nu)$. La deformación de volumen es
              la suma de las tres lineales, y cada tensión acorta en su
              dirección y alarga en las otras dos:
              $\Delta V/V = (1 - 2\nu)(\sigma_x + \sigma_y + \sigma_z)/E$
              (ec. 4.8, p. 6).
          - valor: '-21.467'
            mensaje: |
              Has puesto $(1 - \nu)$ donde va $(1 - 2\nu)$: cada tensión
              actúa por Poisson en dos direcciones, no en una.
          - valor: '-0.01227'
            mensaje: |
              Es el cambio en m³. El enunciado lo pide en dm³: el cuerpo
              mide 1 m³ = 1000 dm³.
          - valor: '-12.567'
            mensaje: |
              Es el cambio exacto, con el producto de las tres longitudes
              deformadas. El curso trabaja con deformaciones pequeñas y suma
              las tres lineales (ec. 4.8, p. 6): sale −12,267. Los 0,3 dm³ de
              diferencia son los productos de deformaciones que la teoría
              lineal desprecia.
        pista: |
          $\Delta V/V = \varepsilon_x + \varepsilon_y + \varepsilon_z$, o
          $(1 - 2\nu)(\sigma_x + \sigma_y + \sigma_z)/E$ (ec. 4.8).
        desarrollo: |
          $$
          \frac{\Delta V}{V} = \frac{1 - 2\nu}{E}(\sigma_x + \sigma_y + \sigma_z) = \frac{0{,}4\cdot(-92\ \text{MPa})}{3000\ \text{MPa}} = -0{,}012267
          $$

          y con $V = 1\ \text{m}^{3} = 1000\ \text{dm}^{3}$,
          $\Delta V = -12{,}27\ \text{dm}^{3}$. Con las tres variaciones de
          longitud sale lo mismo:
          $(-25{,}47 + 4 + 9{,}2)/1000 = -0{,}01227$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El cuerpo 2 reparte su fuerza sobre la cara de arriba del 1:
              $\sigma_y = -\sigma_2a_2/a_1 = -12$ MPa; además
              $\sigma_x = -\sigma_0$ y, libre en $z$, $\sigma_z = 0$.
          - texto: >-
              Que el cuerpo 2 suba $h$ es $\varepsilon_y = h/b_1 = 0{,}004$, y
              Hooke da $\sigma_0 = 80$ MPa.
          - texto: >-
              Hooke en $x$ y en $z$ da $\Delta a_1 = -25{,}47$ mm y
              $\Delta c = 9{,}2$ mm, con $\Delta b_1 = 4$ mm.
          - texto: >-
              La suma de las tres deformaciones da
              $\Delta V = -12{,}27$ dm³: el cuerpo pierde volumen.
          - texto: >-
              Como la dimensión $c$ es la misma en los dos cuerpos, la
              deformación en $z$ es nula, $\varepsilon_z = 0$.
            trampa: true
            mensaje: |
              «Libertad de deformación» en $z$ quiere decir que nada lo
              impide: lo que se anula es $\sigma_z$. Con $\varepsilon_z = 0$
              aparecería $\sigma_z = \nu(\sigma_x + \sigma_y)$, y $\sigma_0$
              bajaría a 58,77 MPa.
    resolucion: |
      **Las tensiones del cuerpo 1.** El cuerpo 2 se toma rígido: solo
      transmite la carga $\sigma_2$, que actúa sobre $a_2c$ y se apoya en la
      cara de arriba del cuerpo 1, de área $a_1c$:

      $$
      \sigma_y = -\frac{\sigma_2a_2}{a_1} = -12\ \text{MPa}
      $$

      En las caras perpendiculares a $x$, $\sigma_x = -\sigma_0$; en $z$ el
      cuerpo es libre, así que $\sigma_z = 0$. Sin tangenciales, son las
      tensiones principales, y Hooke (ec. 4.2, tema 4, p. 4) se escribe
      directamente en $x$, $y$ y $z$.

      **a/ $\sigma_0$.** El cuerpo 2 sube lo que sube la cara de arriba del
      1: $\varepsilon_y = h/b_1 = 0{,}004$. Con Hooke,

      $$
      \varepsilon_y = \frac{\sigma_y - \nu(\sigma_x + \sigma_z)}{E} = \frac{-12\ \text{MPa} + 0{,}3\,\sigma_0}{3000\ \text{MPa}} = 0{,}004
      \quad\Rightarrow\quad \sigma_0 = 80\ \text{MPa}
      $$

      La compresión en $x$ ensancha el cuerpo en $y$ por Poisson, y con
      80 MPa ese ensanche gana al acortamiento de los 12 MPa del cuerpo 2.

      **b/ Las variaciones de longitud.**

      $$
      \Delta a_1 = \frac{-80\ \text{MPa} + 0{,}3\cdot12\ \text{MPa}}{3000\ \text{MPa}}\cdot1000\ \text{mm} = -25{,}47\ \text{mm}
      $$

      $$
      \Delta b_1 = h = 4\ \text{mm},\qquad
      \Delta c = \frac{0{,}3\cdot92\ \text{MPa}}{3000\ \text{MPa}}\cdot1000\ \text{mm} = 9{,}2\ \text{mm}
      $$

      El cuerpo se acorta en $x$ y se alarga en $y$ y en $z$.

      **c/ El volumen** (ec. 4.8, p. 6):

      $$
      \frac{\Delta V}{V} = \frac{1 - 2\nu}{E}(\sigma_x + \sigma_y + \sigma_z) = \frac{0{,}4\cdot(-92\ \text{MPa})}{3000\ \text{MPa}} = -0{,}012267
      $$

      y con $V$ = 1 m³ = 1000 dm³, $\Delta V = -12{,}27$ dm³. La suma de las
      tres variaciones de longitud, divididas por 1000 mm, da lo mismo.

      **Comprobaciones.** El motor del curso (Hooke en tres dimensiones y el
      cambio de volumen) da $\sigma_0 = 80$ MPa, las tres deformaciones y
      $\Delta V$ con estas tensiones; a mano, Hooke componente a componente
      da las mismas cifras, y $\varepsilon_yb_1$ reproduce los 4 mm.

  # ── Problema 2 · la viga rígida en T sujeta por la barra 1.
  - id: exerm1718-ext-6-la-viga-rigida-en-t-sujeta-por-la-barra-1
    titulo: La viga rígida de sección en T apoyada en C y sujeta por una barra inclinada, la longitud a y el radio de la barra
    fuente: >-
      Problema 2 · Extraordinaria del 14 de junio de 2018 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 1,5 puntos. El examen no publica resolución; el
      desarrollo es nuestro, con los convenios del curso, y cada cifra está
      comprobada por dos caminos.
    nivel: examen
    enunciado: |
      2. (1,5p) La viga horizontal AD de sección en T es rígida, está
      apoyada en C y unida a la barra 1 de módulo $E$ y sección circular.
      Siendo $P = 3q_0a$, determinar:

      a/ Diagramas de fuerzas normales, fuerzas cortantes y momentos
      flectores de la viga ACD en función de $q_0$ y $a$.

      b/ Valor de la longitud $a$, para que la tensión de tracción máxima
      sea de 2000 kg/cm².

      c/ Radio de la barra 1 para que el desplazamiento de A sea de 2 cm,
      para el valor de $a$ obtenido en b/.

      $q_0$ = 1000 kg/m; $E$ = 2·10⁶ kg/cm²

