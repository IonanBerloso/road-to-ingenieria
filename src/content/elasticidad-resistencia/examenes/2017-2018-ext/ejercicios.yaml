      - tipo: calcular
        titulo: La carga que gira el eje 2°
        pregunta: |
          Con $M_0 = Pb/8$, ¿qué valor de $P$, en kN, hace que el ángulo de
          torsión máximo sea de 2°?
        respuesta:
          tipo: numero
          valor: '29.83'
          tolerancia: 0.05
          formato: un número, en kN
        distractores:
          - valor: '14.91'
            mensaje: |
              Has usado el momento de inercia $I = \pi D^{4}/64$ en lugar del
              polar, $I_p = \pi D^{4}/32$, que es el doble.
          - valor: '1.755'
            mensaje: |
              Has hecho girar BC con todo $M_0$. BC solo lleva $M_0/17$: el
              tramo AB, mucho más rígido, frena el giro de B.
          - valor: '477.25'
            mensaje: |
              Has tomado los 4 cm como radio. $D_{BC}$ es el diámetro, y $I_p$
              va con su cuarta potencia.
          - valor: '3.729'
            mensaje: |
              Es $M_0$ en kN·m. Falta pasar a $P$: $M_0 = Pb/8$, así que
              $P = 8M_0/b$.
        pista: |
          El giro máximo es el de B, $\varphi_B = M_0b/(17\,GI_{p,BC})$, con
          $I_{p,BC} = \pi D_{BC}^{4}/32$ y 2° en radianes.
        desarrollo: |
          $GI_{p,BC} = 25\cdot10^{9}\ \text{Pa}\cdot\pi\,(0{,}04\ \text{m})^{4}/32 = 6283{,}2\ \text{N·m}^{2}$
          y 2° = 0,034907 rad. Los extremos no giran, así que el ángulo
          máximo es el de B:

          $$
          M_0 = \frac{17\,GI_{p,BC}\,\varphi_B}{b} = \frac{17\cdot6283{,}2\ \text{N·m}^{2}\cdot0{,}034907}{1\ \text{m}} = 3728{,}5\ \text{N·m}
          $$

          $$
          P = \frac{8M_0}{b} = \frac{8\cdot3728{,}5\ \text{N·m}}{1\ \text{m}} = 29{,}83\ \text{kN}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La carga excéntrica es $P$ en el eje más el par $M_0$: flexión y
              torsión van por separado, cada una con una incógnita
              hiperestática.
          - texto: >-
              Flexión: sin el apoyo, C bajaría $5Pb^{3}/(96EI)$; con la flecha
              nula, $R_C = 5P/46$, y $M_A = -18Pb/23$.
          - texto: >-
              Torsión: los dos tramos giran lo mismo en B, y $M_0$ se reparte
              como sus rigideces, $16M_0/17$ por AB y $M_0/17$ por BC.
          - texto: >-
              El giro máximo es el de B, $M_0b/(17\,GI_{p,BC})$; con 2° y
              $M_0 = Pb/8$, $P$ = 29,83 kN.
          - texto: >-
              Como $D_{AB} = 2D_{BC}$, el tramo AB es el doble de rígido que
              el BC.
            trampa: true
            mensaje: |
              La rigidez va con la inercia, y la de un círculo, con $D^{4}$:
              AB es $2^{4} = 16$ veces más rígido, a flexión y a torsión. Con
              el doble saldrían $R_C = 0{,}278P$ y $2M_0/3$ por AB.
    resolucion: |
      **El planteamiento.** La carga excéntrica es $P$ en el eje más el par
      $M_0$. En flexión, A empotrado y C apoyado: hiperestático de grado 1.
      En torsión, A y C sujetos: hiperestático de grado 1. Con
      $D_{AB} = 2D_{BC}$, AB es $2^{4} = 16$ veces más rígido que BC a flexión y a
      torsión. Sea $EI$ la rigidez a flexión de BC.

      **a/ La flexión.** Se quita el apoyo C y se impone que su flecha sea
      nula (apartado 11.2, tema 11, p. 4). Con el segundo teorema de Mohr
      (ec. 10.20, tema 10, p. 10), $P$ baja C $5Pb^{3}/(96EI)$ y una fuerza
      unidad en C lo sube $23b^{3}/(48EI)$:

      $$
      R_C = \frac{5}{46}P = 0{,}1087P,\qquad R_A = \frac{41}{46}P,\qquad M_A = -\frac{18}{23}Pb = -0{,}7826Pb
      $$

      Cortantes: $41P/46$ de A a B y $-5P/46$ de B a C. Flectores: rectas,
      de $-18Pb/23$ en A a $5Pb/46$ en B, con el cero en
      $x = 36b/41 = 0{,}878b$, y de ahí a cero en C.

      **b/ La torsión.** Los dos tramos giran lo mismo en B (ec. 12.13,
      tema 12, p. 8), así que cada uno lleva un par proporcional a su
      rigidez $GI_p/b$:

      $$
      M_{t,AB} = \frac{16}{17}M_0 = 0{,}9412M_0,\qquad M_{t,BC} = -\frac{1}{17}M_0
      $$

      constantes en cada tramo, con el salto $M_0$ en B.

      **c/ La carga.** Los extremos no giran y el torsor es constante en
      cada tramo: el giro crece en recta de A a B y baja en recta de B a C,
      y el máximo es el de B,

      $$
      \varphi_B = \frac{M_{t,AB}\,b}{16\,GI_{p,BC}} = \frac{M_0b}{17\,GI_{p,BC}}
      $$

      Con $GI_{p,BC}$ = 6283,2 N·m² y $\varphi_B$ = 2° = 0,034907 rad,
      $M_0$ = 3728,5 N·m, y con $M_0 = Pb/8$, $P$ = 29,83 kN.

      **Comprobaciones.** El motor del curso integra la elástica con la
      rigidez por tramos y da $R_C$, $M_A$, $M_B$ y los cortantes; a mano,
      la flecha de C y la compatibilidad dan las mismas fracciones. El
      motor de ejes da el reparto de $M_0$ y el giro de B, y el giro de
      todas las secciones confirma que el máximo, 2°, es el de B; a mano,
      las dos rigideces en paralelo dan lo mismo.

  # ── Problema 4 · la estructura espacial con la barra FD.
  - id: exerm1718-ext-8-la-estructura-espacial-con-la-barra-fd
    titulo: Una estructura espacial empotrada con una barra que la sujeta, la fuerza de la barra y el descenso de D
    fuente: >-
      Problema 4 · Extraordinaria del 14 de junio de 2018 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 1,5 puntos. Con casi el mismo texto y los mismos
      datos de material, pero con otra estructura (la ABCDE, con la barra FD
      vertical), volvió a caer como problema 4 de la extraordinaria del 2 de
      febrero de 2021, y está resuelta en el sitio. El enunciado se
      transcribe del Word original: el PDF, que es una conversión suya, no
      lo imprime. El
      examen no publica resolución; el desarrollo es nuestro, con los
      convenios del curso, y cada cifra está comprobada por dos caminos.
    nivel: examen
    enunciado: |
      4. (1,5p) La sección de la estructura ABCD es circular y tiene unida
      una barra FD de sección $A$. Determinar:

      a/ Fuerza que soporta la barra FD.

      b/ Desplazamiento vertical de D.

      Considerar las energías de flexión y torsión de la estructura y la de
      la barra.

      $\overline{AB} = 2L$; $\overline{BC} = \overline{BD} = \overline{FD} = L$;
      $E$ = 2,5 $G$; $I_z/(AL^{2}) = 2$

