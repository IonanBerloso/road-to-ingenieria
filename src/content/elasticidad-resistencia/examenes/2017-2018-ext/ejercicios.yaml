      <figcaption>

      Redibujada del Word original, que el PDF reproduce igual.

      </figcaption>
      </figure>

      **Notas nuestras.** La carga $P$ es vertical, según $y$. $h_0$ es la
      distancia entre las líneas medias de las alas; $b_0$, la de la línea
      media del alma a la punta de las alas, y $t_0$, el espesor de las
      alas. La figura dibuja el alma algo más gruesa que las alas, pero no la
      acota.
    pide: >-
      El punto de la sección por el que tiene que pasar la carga para que la
      viga no trabaje a torsión, y dónde está.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué punto tiene que pasar la carga?
        opciones:
          - texto: >-
              Por el centro de torsión O, que está en el eje $z$, al otro lado
              del alma que G, fuera de la sección
            correcta: true
            mensaje: |
              Eso es (apartado 12.6, pp. 14-15). Las tensiones cortantes de la
              flexión, repartidas por el teorema del flujo cortante, tienen
              una resultante que no pasa por G: las fuerzas de las alas, $F_1$,
              forman un par, y la resultante queda desplazada al otro lado del
              alma. Una carga que no pase por ese punto añade un torsor.
          - texto: >-
              Por el centro de gravedad G, como en una sección rectangular
            mensaje: |
              En el rectángulo, con dos ejes de simetría, el centro de
              torsión y G coinciden. En la C solo hay un eje de simetría, $z$:
              el centro de torsión está en él, pero no en G. Una carga por G
              tuerce la viga.
          - texto: >-
              Por la línea media del alma, que es la que resiste el cortante
            mensaje: |
              El alma lleva casi todo el cortante, pero las alas llevan dos
              fuerzas horizontales iguales y opuestas, $F_1$, que forman un
              par: para equilibrarlo, la carga tiene que pasar a una distancia
              del alma, fuera de la sección.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Explica por qué ese punto y deduce dónde está, como en el examen,
          con las fuerzas del flujo cortante en las alas y en el alma.
        rubrica:
          - punto: >-
              El punto es el centro de torsión O, el de aplicación de la
              resultante de las tensiones cortantes de la flexión; por
              simetría está en el eje z.
            porque: >-
              Es lo que se pregunta, y la simetría reduce la incógnita a una
              distancia.
            minimo: true
          - punto: >-
              En las alas el flujo crece linealmente desde la punta hasta
              q1max = T b0 t1 h0/(2Iz) (ec. 12.32), y su resultante es
              F1 = b0 q1max/2 (ec. 12.31); en el alma, la resultante F2 es el
              cortante T.
            porque: >-
              Son las fuerzas que da el teorema del flujo cortante, y las de
              las alas, iguales y opuestas, forman un par.
            minimo: true
          - punto: >-
              Momentos respecto de C, el punto del alma en el eje z (teorema
              de Varignon): T·OC = F1·h0 (ec. 12.30).
            porque: >-
              Es la condición de que la carga produzca el mismo momento que
              las tensiones: si no pasa por O, sobra un torsor.
            minimo: true
          - punto: >-
              Resulta OC = t1 b0² h0²/(4Iz) (ec. 12.33), con t1 el espesor de
              las alas, aquí t0, y O al otro lado del alma que G, fuera de la
              sección.
            porque: >-
              Es la respuesta, con el lado: el par de las alas pide que la
              carga se aparte del alma hacia fuera.
            minimo: true
          - punto: >-
              Se dice que si la carga pasa por otro punto, por ejemplo por G,
              la viga soporta además un torsor, la carga por la distancia
              hasta O.
            porque: >-
              Es lo que la pregunta quiere evitar, y en una sección abierta
              de pared delgada ese torsor es lo que más deforma.
      - tipo: calcular
        titulo: La distancia del centro de torsión al alma
        pregunta: |
          Un ejemplo nuestro: $b_0$ = 100 mm, $h_0$ = 200 mm y el mismo
          espesor, 10 mm, en las alas y en el alma, con el modelo de línea
          media. ¿A qué distancia de la línea media del alma está el punto
          buscado, en mm?
        respuesta:
          tipo: numero
          valor: '37.5'
          tolerancia: 0.05
          formato: un número, en mm, desde la línea media del alma
        distractores:
          - valor: '50'
            mensaje: |
              Has calculado $I_z$ solo con las alas,
              $I_z = 2b_0t_0(h_0/2)^{2}$: el alma también cuenta, y con ella
              $I_z$ crece y la distancia baja.
          - valor: '25'
            mensaje: |
              Es la distancia del centro de gravedad G al alma, que está del
              otro lado, hacia las alas. El punto buscado está fuera de la
              sección.
          - valor: '75'
            mensaje: |
              Te sobra un 2: la fuerza de cada ala es el área del triángulo
              del flujo, $F_1 = b_0q_{1max}/2$ (ec. 12.31), y
              $q_{1max} = Tb_0t_1h_0/(2I_z)$ (ec. 12.32).
          - valor: '62.5'
            mensaje: |
              Es la distancia de G al centro de torsión, 25 + 37,5 mm. La
              pregunta la mide desde la línea media del alma.
        pista: |
          $OC = t_1b_0^{2}h_0^{2}/(4I_z)$ (ec. 12.33), con $I_z$ de la línea
          media: el alma y las dos alas.
        desarrollo: |
          $$
          I_z = \frac{t_0h_0^{3}}{12} + 2b_0t_0\Big(\frac{h_0}{2}\Big)^{2} = 6{,}6667\cdot10^{6}\ \text{mm}^{4} + 2\cdot10^{7}\ \text{mm}^{4} = 2{,}6667\cdot10^{7}\ \text{mm}^{4}
          $$

          $$
          OC = \frac{t_0b_0^{2}h_0^{2}}{4I_z} = \frac{10\cdot100^{2}\cdot200^{2}}{4\cdot2{,}6667\cdot10^{7}}\ \text{mm} = 37{,}5\ \text{mm}
          $$

          Con el mismo espesor en toda la sección se simplifica a
          $OC = 3b_0^{2}/(h_0 + 6b_0)$.
      - tipo: calcular
        titulo: El torsor si la carga pasa por G
        pregunta: |
          Con la misma sección, $P$ = 10 kN y el centro de gravedad G a
          25 mm de la línea media del alma, hacia las alas: si la carga se
          aplicara en G, ¿qué torsor soportaría la viga, en kN·m?
        respuesta:
          tipo: numero
          valor: '0.625'
          tolerancia: 0.002
          formato: un número, en kN·m (valor absoluto)
        distractores:
          - valor: '0.375'
            mensaje: |
              Es $P$ por la distancia del centro de torsión al alma. G no
              está en el alma: está 25 mm más allá, del otro lado, y el brazo
              es la suma.
          - valor: '0.25'
            mensaje: |
              Es $P$ por la distancia de G al alma, como si el centro de
              torsión estuviera en el alma. Está 37,5 mm fuera.
          - valor: '0.125'
            mensaje: |
              Has restado las dos distancias, como si G y O estuvieran del
              mismo lado del alma. Están a lados opuestos, y el brazo es
              37,5 + 25 = 62,5 mm.
        pista: |
          El torsor es $P$ por la distancia de su recta de acción al centro
          de torsión.
        desarrollo: |
          G y O están en el eje $z$, a lados opuestos del alma:
          $\overline{\text{GO}} = 25\ \text{mm} + 37{,}5\ \text{mm} = 62{,}5\ \text{mm}$, y

          $$
          M_t = P\cdot\overline{\text{GO}} = 10\ \text{kN}\cdot0{,}0625\ \text{m} = 0{,}625\ \text{kN·m}
          $$
      - tipo: justificar
        pregunta: Ordena el razonamiento. Una pieza es falsa.
        piezas:
          - texto: >-
              Las tensiones cortantes de la flexión, repartidas con el teorema
              del flujo cortante, dan una fuerza $F_1$ en cada ala y el
              cortante en el alma.
          - texto: >-
              Las dos $F_1$ son iguales y opuestas: forman un par de brazo
              $h_0$.
          - texto: >-
              Para que la carga equivalga a esas tensiones, su momento
              respecto del alma tiene que ser $F_1h_0$: pasa a la distancia
              $OC = t_1b_0^{2}h_0^{2}/(4I_z)$ del alma.
          - texto: >-
              Por simetría el punto está en el eje $z$, al otro lado del alma
              que G.
          - texto: >-
              Basta con aplicar la carga en G, porque G está en el eje de
              simetría de la sección.
            trampa: true
            mensaje: |
              Estar en el eje de simetría es necesario, pero no basta: el
              centro de torsión está en ese eje, y no coincide con G porque
              la C solo tiene un eje de simetría. Por G, la carga tuerce la
              viga.
    resolucion: |
      **El punto.** Para que la viga no trabaje a torsión, la carga tiene
      que pasar por el centro de torsión O, el punto de aplicación de la
      resultante de las tensiones cortantes de la flexión (apartado 12.6,
      p. 14 del tema 12). Si la sección tuviera dos ejes de simetría, O sería
      G; la C tiene uno, el $z$: O está en él, pero no en G.

      **Dónde está.** Con el teorema del flujo cortante, el flujo en las
      alas crece linealmente desde la punta hasta

      $$
      q_{1max} = \frac{T\,b_0t_1h_0}{2I_z} \qquad (12.32)
      $$

      y la fuerza de cada ala es el área de ese triángulo,
      $F_1 = b_0q_{1max}/2$ (ec. 12.31). Las dos son iguales y opuestas, y
      forman un par de brazo $h_0$; el alma lleva la fuerza $F_2$, que
      equilibra el cortante $T$. Tomando momentos respecto de C, el punto
      del alma en el eje $z$ (teorema de Varignon, ec. 12.30),
      $T\cdot OC = F_1h_0$, y

      $$
      OC = \frac{t_1b_0^{2}h_0^{2}}{4I_z} \qquad (12.33)
      $$

      con $t_1 = t_0$, el espesor de las alas. Para equilibrar el par de las
      alas, O queda al otro lado del alma que G, fuera de la sección
      (figura 12.11). La carga $P$ tiene que aplicarse en ese punto, sobre el
      eje $z$; aplicada en G, añade el torsor $P\cdot\overline{\text{GO}}$.

      **El ejemplo.** Con $b_0$ = 100 mm, $h_0$ = 200 mm y 10 mm de espesor
      en toda la sección, $I_z = 2{,}6667\cdot10^{7}$ mm⁴ y $OC$ = 37,5 mm.
      G está a 25 mm del alma, hacia las alas, así que
      $\overline{\text{GO}}$ = 62,5 mm, y con $P$ = 10 kN aplicada en G la
      viga soportaría un torsor de 0,625 kN·m.

      **Comprobaciones.** El motor del curso da $OC$ con la ec. 12.33. Como
      segundo camino, el flujo cortante se ha integrado a lo largo de la
      línea media del ala, y la fuerza del ala, 1875 N, por $h_0$ y dividida
      por $P$, da la misma distancia; $I_z$ y G salen también integrando
      sobre la línea media.
  # ── Problema 1 · el cuerpo 1, comprimido de lado, que levanta el cuerpo 2.
  - id: exerm1718-ext-5-el-bloque-comprimido-que-levanta-el-cuerpo-2
    titulo: Un bloque comprimido de lado que levanta el cuerpo que lleva encima, sus alargamientos y su cambio de volumen
    fuente: >-
      Problema 1 · Extraordinaria del 14 de junio de 2018 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 1,5 puntos. El examen no publica resolución; el
      desarrollo es nuestro, con los convenios del curso, y cada cifra está
      comprobada por dos caminos.
    nivel: examen
    enunciado: |
      1. (1,5p) Los cuerpos 1 y 2 de la figura de dimensión $c$ en dirección
      $z$ tienen libertad de deformación en dicha dirección. Determinar:

      a/ El valor de la tensión $\sigma_0$ en MPa para que el cuerpo 2
      ascienda la distancia $h$.

      b/ Variaciones de longitud del cuerpo 1 en las direcciones $x$, $y$ y
      $z$, en mm.

      c/ Variación de volumen del cuerpo 1 en dm³.

      $E_1$ = 3 GPa; $\nu_1$ = 0,3; $a_2$ = 1,2 m ; $a_1$ = 1,0 m;
      $b_1$ = 1,0 m; $c$ = 1,0 m; $h$ = 4 mm; $\sigma_2$ = 10 MPa

