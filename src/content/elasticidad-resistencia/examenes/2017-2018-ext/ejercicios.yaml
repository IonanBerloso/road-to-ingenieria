      **Notas nuestras.** Ejes nuestros: $x$ horizontal, de F hacia D;
      $y$ horizontal, de B hacia C; $z$ vertical, hacia arriba. AB es el
      pilar, vertical, empotrado en A; CD es horizontal y perpendicular a
      FD, con B en su punto medio; la barra FD es horizontal y está
      articulada en sus dos extremos. Las dos cargas son de $q_0$ por unidad
      de longitud: en BD, vertical y hacia abajo; en BC, horizontal y en el
      sentido de D hacia F. $I_z$ es el momento de inercia de la sección
      circular de la estructura, y su momento polar, $I_p = 2I_z$; $A$ es el
      área de la barra. Fuerza de la barra positiva si es de tracción.
    pide: >-
      a/ La fuerza de la barra FD. b/ El desplazamiento vertical de D.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué carga hace trabajar a la barra FD, y por qué?
        opciones:
          - texto: >-
              Solo la de BC: empuja la estructura según FD, mientras que la
              de BD, vertical, mueve D hacia abajo y según $y$, nunca según
              FD
            correcta: true
            mensaje: |
              Eso es. La carga de BD flecta BD y el pilar en planos que
              contienen al eje $y$: mueve D en $y$ y en $z$. La de BC empuja
              el pilar según $x$ y lo tuerce, y las dos cosas mueven D según
              FD. La barra solo se carga con lo que mueve D en su dirección.
          - texto: >-
              Las dos: la estructura es una sola pieza, y cualquier carga
              mueve D
            mensaje: |
              Mueve D, pero no en cualquier dirección. La barra solo nota el
              movimiento de D según su eje, $x$, y la carga vertical de BD no
              mueve D en $x$: ni flecta el pilar en el plano $xz$ ni lo
              tuerce.
          - texto: >-
              Solo la de BD, porque es la que carga el brazo al que está
              unida la barra
            mensaje: |
              Estar en el mismo brazo no basta: la carga de BD es vertical y
              la barra es horizontal. La que mueve D según la barra es la de
              BC, a través del pilar.
      - tipo: calcular
        titulo: El movimiento de D sin la barra
        pregunta: |
          Quitada la barra, ¿cuánto se acerca D a F con las dos cargas, en
          unidades de $q_0L^{4}/EI_z$?
        respuesta:
          tipo: numero
          valor: '1.4167'
          tolerancia: 0.005
          formato: un número con su signo, el coeficiente de q0·L⁴/EIz (positivo hacia F)
        distractores:
          - valor: '2.6667'
            mensaje: |
              Te falta la torsión del pilar. La carga de BC, a $L/2$ del eje
              del pilar, lo tuerce con $q_0L^{2}/2$, y ese giro aleja D de F
              $5q_0L^{4}/(4EI_z)$.
          - valor: '0.1667'
            mensaje: |
              Has tomado la rigidez a torsión con $I_z$. La de una sección
              circular va con el momento polar, $I_p = 2I_z$:
              $GI_p = 2I_zE/2{,}5 = 0{,}8EI_z$.
          - valor: '3.9167'
            mensaje: |
              El sentido del giro. La carga de BC empuja C hacia F y hace
              girar el pilar de modo que D, al otro lado de B, se aleja de F:
              la torsión resta.
        pista: |
          El pilar, de $2L$, recibe en B la fuerza $q_0L$ según FD y el
          torsor $q_0L^{2}/2$. La flexión acerca D a F
          $q_0L(2L)^{3}/(3EI_z)$; la torsión gira B
          $(q_0L^{2}/2)\,2L/(GI_p)$, y D, a $L$ de B, se mueve ese giro por
          $L$.
        desarrollo: |
          Con $GI_p = 0{,}8EI_z$, el giro del pilar es
          $(q_0L^{2}/2)\cdot2L/(0{,}8EI_z) = 1{,}25q_0L^{3}/EI_z$, y aleja
          D de F. Así,

          $$
          \delta_{D0} = \frac{q_0L\,(2L)^{3}}{3EI_z} - 1{,}25\frac{q_0L^{3}}{EI_z}\,L = \frac{8}{3}\frac{q_0L^{4}}{EI_z} - \frac{5}{4}\frac{q_0L^{4}}{EI_z} = \frac{17}{12}\frac{q_0L^{4}}{EI_z}
          $$

          es decir, $1{,}4167\,q_0L^{4}/EI_z$ hacia F.
      - tipo: calcular
        titulo: La fuerza de la barra
        pregunta: |
          ¿Cuánto vale la fuerza de la barra FD, en unidades de $q_0L$
          (positiva si es de tracción)?
        respuesta:
          tipo: numero
          valor: '-0.1889'
          tolerancia: 0.002
          formato: un número con su signo, el coeficiente de q0·L
        distractores:
          - valor: '-0.2576'
            mensaje: |
              Has tomado la barra rígida. El enunciado pide su energía: se
              acorta $XL/(EA) = 2XL^{3}/EI_z$, y eso rebaja la fuerza.
          - valor: '-0.5333'
            mensaje: |
              Te falta la torsión del pilar, en las cargas y en la fuerza
              unidad. El enunciado pide contarla: aleja D de F con las
              cargas y lo acerca con la fuerza de la barra.
          - valor: '0.1889'
            mensaje: |
              El signo. Las cargas acercan D a F: la barra se acorta, y su
              fuerza es de compresión.
          - valor: '-0.1977'
            mensaje: |
              Te falta la flexión del brazo BD. La fuerza de la barra actúa
              en D, a $L$ de B, y flecta BD en horizontal: $L^{3}/(3EI_z)$.
        pista: |
          Menabrea con fuerza interna, $\partial C/\partial X = 0$
          (ec. 13.54). Con $X = 1$ en D hacia F: el pilar a flexión da
          $(2L)^{3}/(3EI_z)$; su torsión, $L\cdot2L\cdot L/(GI_p)$; el brazo
          BD, $L^{3}/(3EI_z)$; y la barra, $L/(EA) = 2L^{3}/EI_z$.
        desarrollo: |
          Con $X = 1$, $\frac{8}{3} + 2{,}5 + \frac{1}{3} = 5{,}5$
          en unidades de $L^{3}/EI_z$, y la barra suma 2:

          $$
          \frac{\partial C}{\partial X} = \frac{17}{12}\frac{q_0L^{4}}{EI_z} + X\left(5{,}5 + 2\right)\frac{L^{3}}{EI_z} = 0
          \quad\Rightarrow\quad X = -\frac{17}{90}q_0L = -0{,}1889\,q_0L
          $$

          de compresión.
      - tipo: calcular
        titulo: El descenso de D
        pregunta: |
          ¿Cuánto baja D, en unidades de $q_0L^{4}/EI_z$?
        respuesta:
          tipo: numero
          valor: '1.125'
          tolerancia: 0.005
          formato: un número, el coeficiente de q0·L⁴/EIz (hacia abajo)
        distractores:
          - valor: '0.125'
            mensaje: |
              Es solo la flecha del brazo BD como voladizo,
              $q_0L^{4}/(8EI_z)$. El pilar también flecta con el momento de
              esa carga, B gira, y D, a $L$ de B, baja $q_0L^{4}/EI_z$ más.
          - valor: '1'
            mensaje: |
              Es solo lo que baja D por el giro de B. Falta la flecha del
              propio brazo BD, $q_0L^{4}/(8EI_z)$.
          - valor: '2.125'
            mensaje: |
              Has puesto la resultante de la carga de BD en D. Está en el
              centro del brazo: el momento que recibe el pilar es
              $q_0L\cdot L/2$.
          - valor: '0.625'
            mensaje: |
              Has tomado el pilar de longitud $L$. Mide $2L$, y su giro en B
              es el doble.
        pista: |
          Engesser (ec. 13.14) con una fuerza vertical $F$ en D. El brazo BD
          da su flecha de voladizo, y el pilar, flectado por
          $q_0L^{2}/2$ en toda su longitud, gira B y baja D.
        desarrollo: |
          Con $F$ = 1 en D: en BD, $m = t$; en el pilar, $m = L$. Con las
          cargas, en BD, $M = q_0t^{2}/2$, y en el pilar, $q_0L^{2}/2$:

          $$
          \delta_D = \int_0^{L}\frac{q_0t^{2}}{2}\,t\,\frac{dt}{EI_z} + \frac{q_0L^{2}}{2}\cdot L\cdot\frac{2L}{EI_z} = \frac{1}{8}\frac{q_0L^{4}}{EI_z} + \frac{q_0L^{4}}{EI_z} = \frac{9}{8}\frac{q_0L^{4}}{EI_z}
          $$

          La barra y la carga de BC no intervienen: actúan en otros planos.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Se quita la barra y su fuerza $X$, de tracción, pasa a ser la
              incógnita hiperestática.
          - texto: >-
              Solo la carga de BC mueve D según FD: la flexión del pilar lo
              acerca a F y su torsión lo aleja, $17q_0L^{4}/(12EI_z)$ en
              total.
          - texto: >-
              Con $X$ = 1, el pilar a flexión y a torsión y el brazo BD dan
              $5{,}5L^{3}/EI_z$, y la barra, $2L^{3}/EI_z$.
          - texto: >-
              $\partial C/\partial X = 0$ da $X = -17q_0L/90$: la barra
              trabaja a compresión.
          - texto: >-
              Para el descenso de D, Engesser con una fuerza vertical en D:
              el brazo BD y el pilar dan $9q_0L^{4}/(8EI_z)$.
          - texto: >-
              El descenso de D depende de la barra: con una barra más rígida,
              D bajaría menos.
            trampa: true
            mensaje: |
              La barra es horizontal: una fuerza vertical en D no la carga, y
              sus leyes (el pilar flectado en el plano $xz$, su torsión y BD
              flectado en horizontal) no se cruzan con las de esa fuerza. D
              baja $9q_0L^{4}/(8EI_z)$ con barra o sin ella.
    resolucion: |
      **El planteamiento.** La estructura empotrada en A sería isostática;
      la barra FD, articulada en F y en D, añade una incógnita: su fuerza
      $X$, de tracción. Se quita la barra y se escribe la coenergía de la
      estructura, de flexión y de torsión, más la de la barra,
      $X^{2}L/(2EA)$; Menabrea con fuerza interna,
      $\partial C/\partial X = 0$ (ec. 13.54, tema 13, p. 19), da $X$. Con
      $E = 2{,}5G$ e $I_p = 2I_z$, $GI_p = 0{,}8EI_z$; con
      $I_z/(AL^{2}) = 2$, $L/(EA) = 2L^{3}/EI_z$.

      **Las cargas.** La de BD, vertical, flecta BD y, con el momento
      $q_0L^{2}/2$ que lleva a B, el pilar en el plano $yz$: no mueve D según
      FD. La de BC lleva a B la fuerza $q_0L$ según FD, que flecta el pilar
      en el plano $xz$, y el torsor $q_0L^{2}/2$. Las dos cosas mueven D
      según FD: la flexión lo acerca a F $8q_0L^{4}/(3EI_z)$ y la torsión lo
      aleja $5q_0L^{4}/(4EI_z)$. En total, $17q_0L^{4}/(12EI_z)$ hacia F.

      **a/ La fuerza de la barra.** Con $X = 1$ en D, hacia F, el pilar a
      flexión da $8L^{3}/(3EI_z)$, su torsión $2{,}5L^{3}/EI_z$ y el brazo
      BD, en horizontal, $L^{3}/(3EI_z)$: $5{,}5L^{3}/EI_z$. Con la barra,

      $$
      \frac{17}{12}\frac{q_0L^{4}}{EI_z} + X\,(5{,}5 + 2)\frac{L^{3}}{EI_z} = 0
      \quad\Rightarrow\quad X = -\frac{17}{90}q_0L = -0{,}1889\,q_0L
      $$

      La barra trabaja a compresión: las cargas acercan D a F y la barra lo
      frena. El pilar queda con un torsor de $0{,}6889q_0L^{2}$.

      **b/ El desplazamiento vertical de D.** Con Engesser (ec. 13.14,
      p. 8), una fuerza vertical $F$ en D, y $\partial X/\partial F = 0$
      por Menabrea. Sus leyes, $t$ en BD y $L$ en el pilar, en el plano
      $yz$, solo se cruzan con las de la carga de BD:

      $$
      \delta_D = \frac{q_0L^{4}}{8EI_z} + \frac{q_0L^{2}}{2}\cdot L\cdot\frac{2L}{EI_z} = \frac{9}{8}\frac{q_0L^{4}}{EI_z}
      $$

      hacia abajo, con barra o sin ella.

      **Comprobaciones.** El motor del curso resuelve la estructura en el
      espacio con Menabrea y la barra como tirante, y da $X$, el movimiento
      de D con las cargas y su flexibilidad; a mano, sumando la flexión del
      pilar, su torsión y la flexión del brazo BD, salen las mismas
      fracciones. El motor da también el descenso de D, el mismo con la
      barra que sin ella.
