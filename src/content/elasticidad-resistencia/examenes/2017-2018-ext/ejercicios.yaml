      **Notas nuestras.** Las dos vistas son del mismo eje. La de arriba es
      la de la flexión: A empotrado, C sobre un apoyo y la carga $P$ en B,
      hacia abajo. La de abajo es la de la torsión: el eje, sujeto en A y en
      C, con el par $M_0$ en B; $M_0$ es el momento de $P$, aplicada fuera
      del eje, respecto del eje. $d$ es el diámetro de BC, $D_{BC}$; AB y BC
      miden $b$ cada uno. Convenio del tema 7 para la flexión: $x$ de A a C
      y $M > 0$ si tracciona la fibra de abajo.
    pide: >-
      a/ Los diagramas de cortantes y flectores, en función de P y b. b/ El
      diagrama de torsores, en función de M0. c/ La carga P con la que el
      ángulo de torsión máximo es de 2°, con M0 = Pb/8.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se plantea el eje?
        opciones:
          - texto: >-
              Como dos problemas hiperestáticos de grado 1 que no se mezclan:
              en flexión, la reacción de C con la flecha nula en C; en
              torsión, el reparto de $M_0$ con el mismo giro en B para los
              dos tramos
            correcta: true
            mensaje: |
              Eso es. En flexión, el empotramiento y el apoyo dan cuatro
              reacciones para tres ecuaciones; en torsión, los dos extremos
              sujetos dan dos pares para una ecuación. Las cargas de flexión
              no tuercen el eje y el par no lo flecta: cada problema tiene su
              condición de deformación (apartado 11.2, tema 11, p. 4, y
              tema 12, p. 8).
          - texto: >-
              Como un solo problema: la flexión y la torsión se acoplan a
              través de la carga excéntrica, y se resuelven a la vez
            mensaje: |
              La carga excéntrica se sustituye por $P$ en el eje más el par
              $M_0$: desde ahí, flexión y torsión van por separado. En una
              sección circular, un flector no produce giro de torsión ni un
              torsor flecha.
          - texto: >-
              Es isostático: los dos extremos reparten la carga por igual
            mensaje: |
              Con A empotrado y C apoyado hay una reacción de más en flexión,
              y con los dos extremos sujetos, un par de más en torsión. El
              reparto no es por igual: depende de las rigideces, y AB, con el
              doble de diámetro, es mucho más rígido.
      - tipo: calcular
        titulo: La reacción del apoyo C
        pregunta: |
          ¿Cuánto vale la reacción de C, en unidades de $P$ (positiva hacia
          arriba)?
        respuesta:
          tipo: numero
          valor: '0.1087'
          tolerancia: 0.001
          formato: un número, el coeficiente de P
        distractores:
          - valor: '0.3125'
            mensaje: |
              Es $5P/16$, la de un eje de diámetro uniforme. AB tiene el
              doble de diámetro y la inercia va con $D^{4}$: es 16 veces más
              rígido, flecta mucho menos y deja menos carga para C.
          - valor: '0.2273'
            mensaje: |
              Has tomado la rigidez de AB 4 veces la de BC, como las áreas.
              La inercia de un círculo va con $D^{4}$: 16 veces.
          - valor: '0.2778'
            mensaje: |
              Has tomado la rigidez de AB el doble que la de BC, como los
              diámetros. La inercia va con $D^{4}$: 16 veces.
        pista: |
          Quita el apoyo C: la flecha de C con $P$ más la de $R_C$ tiene que
          ser nula. Con $EI$ la rigidez de BC, la de AB es $16EI$.
        desarrollo: |
          Sin el apoyo, con el segundo teorema de Mohr (ec. 10.20, tema 10,
          p. 10), C baja

          $$
          v_{C0} = \frac{Pb^{3}}{3\cdot16EI} + \frac{Pb^{2}}{2\cdot16EI}\,b = \frac{5Pb^{3}}{96EI}
          $$

          y una fuerza unidad en C lo sube
          $7b^{3}/(48EI) + b^{3}/(3EI) = 23b^{3}/(48EI)$. Con la flecha de C
          nula,

          $$
          R_C = \frac{5/96}{23/48}\,P = \frac{5}{46}P = 0{,}1087P
          $$
      - tipo: calcular
        titulo: El flector en el empotramiento
        pregunta: |
          ¿Cuánto vale el flector en A, en unidades de $Pb$?
        respuesta:
          tipo: numero
          valor: '-0.7826'
          tolerancia: 0.001
          formato: un número con su signo, el coeficiente de P·b
        distractores:
          - valor: '-0.375'
            mensaje: |
              Es el de un eje de diámetro uniforme, $-3Pb/8$. Con AB 16 veces
              más rígido, C se lleva menos carga y A, más flector.
          - valor: '0.7826'
            mensaje: |
              El signo: en el empotramiento la fibra de arriba trabaja a
              tracción, como en un voladizo, y el flector es negativo.
          - valor: '-1'
            mensaje: |
              Es el del voladizo sin el apoyo C, $-Pb$. La reacción de C,
              con brazo $2b$, le quita $10Pb/46$.
        pista: |
          Desde la derecha: $M_A = R_C\cdot2b - P\cdot b$.
        desarrollo: |
          $$
          M_A = \frac{5}{46}P\cdot2b - Pb = -\frac{18}{23}Pb = -0{,}7826Pb
          $$

          En B, $M_B = R_Cb = 5Pb/46$. Los cortantes son $41P/46$ de A a B y
          $-5P/46$ de B a C, y el flector se anula en
          $x = 36b/41 = 0{,}878b$.
      - tipo: calcular
        titulo: El torsor del tramo grueso
        pregunta: |
          ¿Qué parte de $M_0$ lleva el tramo AB?
        respuesta:
          tipo: numero
          valor: '0.9412'
          tolerancia: 0.001
          formato: un número, el coeficiente de M0
        distractores:
          - valor: '0.5'
            mensaje: |
              El reparto por igual vale para dos tramos iguales. Los dos giran
              lo mismo en B, así que cada uno lleva un par proporcional a su
              rigidez $GI_p/b$, y AB es 16 veces más rígido.
          - valor: '0.0588'
            mensaje: |
              Es la parte de BC. El tramo más rígido es el que lleva más par:
              AB, con el doble de diámetro, se lleva 16/17.
          - valor: '0.6667'
            mensaje: |
              Has tomado la rigidez proporcional al diámetro. $I_p = \pi D^{4}/32$:
              con el doble de diámetro, 16 veces.
          - valor: '0.8'
            mensaje: |
              Has tomado la rigidez proporcional al área. $I_p$ va con
              $D^{4}$: 16 veces, no 4.
        pista: |
          Los dos tramos giran lo mismo en B:
          $M_{t,AB}\,b/(GI_{p,AB}) = M_{t,BC}\,b/(GI_{p,BC})$, con
          $I_{p,AB} = 16I_{p,BC}$ y $M_{t,AB} + M_{t,BC} = M_0$.
        desarrollo: |
          Con el mismo giro en B (ec. 12.13, tema 12, p. 8), cada tramo lleva
          un par proporcional a su rigidez, 16 y 1:

          $$
          M_{t,AB} = \frac{16}{17}M_0 = 0{,}9412M_0,\qquad M_{t,BC} = -\frac{1}{17}M_0
          $$

          con el signo cambiado en BC, que trabaja al otro lado de B.
      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de cortantes, flectores y torsores**,
          alineados bajo el eje, con los valores en A, B y C y el punto en
          que se anula el flector.
        comprueba:
          - punto: |
              **Cortantes**: $41P/46$ constante de A a B y $-5P/46$
              constante de B a C; en B, un salto de $P$.
            porque: |
              Sin carga repartida el cortante es constante en cada tramo
              (ec. 7.14), y la carga concentrada lo hace saltar su valor.
          - punto: |
              **Flectores**: $-18Pb/23$ en A, recta que se anula en
              $x = 36b/41$ y llega a $5Pb/46$ en B; recta hasta cero en C.
            porque: |
              $dM/dx = T$ (ec. 7.15): rectas, con el cortante de pendiente. En
              A, empotrado, tracciona la fibra de arriba; en C, apoyado, el
              flector es nulo.
          - punto: |
              **Torsores**: $16M_0/17$ constante de A a B y $-M_0/17$
              constante de B a C; en B, un salto de $M_0$.
            porque: |
              Sin pares repartidos el torsor es constante en cada tramo, y el
              par de B se reparte según las rigideces de los tramos, 16 a 1.
        figura: |
          <svg viewBox="0 0 400 380" role="img" width="400" height="380" aria-labelledby="exerm1718-ext-7-el-eje-escalonado-con-flexion-y-torsion-dia-t exerm1718-ext-7-el-eje-escalonado-con-flexion-y-torsion-dia-d">
