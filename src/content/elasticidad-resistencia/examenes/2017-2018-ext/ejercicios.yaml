      **Notas nuestras.** La barra 1 está articulada en A y en B, y B está
      en la vertical del punto de la viga a $2a$ de A. C es una articulación
      fija. La carga $q_0$ ocupa la viga de A a C, y $P$ va hacia arriba en
      D. La sección es una T invertida: el alma, de 2 cm de espesor, arriba,
      y el ala, de 20 × 2 cm, abajo, con 20 cm de canto en total. Convenio
      del tema 7: $x$ de A a D, $dT/dx = -q$, $dM/dx = T$ y $M > 0$ si
      tracciona la fibra de abajo; axiles positivos de tracción.
    pide: >-
      a/ Los diagramas de axiles, cortantes y flectores de la viga ACD. b/ La
      longitud a con la que la tracción máxima llega a 2000 kg/cm². c/ El
      radio de la barra 1 con el que A se desplaza 2 cm.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace la barra 1 sobre la viga?
        opciones:
          - texto: >-
              Una fuerza según su eje, a 30° de la viga: su componente
              vertical sostiene A y la horizontal da axil en la viga
            correcta: true
            mensaje: |
              Eso es. Articulada en los dos extremos y sin cargas, la barra
              solo trabaja a axil, y su fuerza va según su eje. Su componente
              vertical, $N\sin30°$, entra en el equilibrio de momentos
              respecto de C; la horizontal, $N\cos30°$, se la lleva el apoyo
              C a través del tramo AC.
          - texto: >-
              Una fuerza vertical en A, como un apoyo móvil
            mensaje: |
              La barra está inclinada: su fuerza también. Si fuera vertical
              la viga no tendría axil, y el enunciado pide el diagrama de
              axiles.
          - texto: >-
              Una fuerza y un momento, porque está unida a la viga
            mensaje: |
              Está articulada en A y en B: no transmite momentos. Una barra
              biarticulada sin cargas entre sus extremos solo lleva axil.
      - tipo: calcular
        titulo: La fuerza de la barra
        pregunta: |
          ¿Cuánto vale la fuerza de la barra 1, en unidades de $q_0a$
          (positiva si es de tracción)?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.01
          formato: un número con su signo, el coeficiente de q0·a
        distractores:
          - valor: '2.5'
            mensaje: |
              Es la componente vertical, $N\sin30°$. El equilibrio de
              momentos respecto de C da esa componente; la fuerza de la barra
              es el doble.
          - valor: '2.887'
            mensaje: |
              Has tomado el coseno. La componente que da momento respecto de
              C es la vertical, $N\sin30°$: la horizontal pasa por C.
          - valor: '3'
            mensaje: |
              Te falta $P$. En D, $P = 3q_0a$ hacia arriba, a una distancia
              $a$ de C, también gira la viga, y en el mismo sentido que la
              carga de AC.
          - valor: '1'
            mensaje: |
              Has puesto $P$ hacia abajo. Va hacia arriba, y al otro lado de
              C: su momento se suma al de $q_0$.
        pista: |
          Momentos respecto de C: la barra da $N\sin30°\cdot3a$; la carga de
          AC, $3q_0a\cdot1{,}5a$; y $P$, $3q_0a\cdot a$.
        desarrollo: |
          Momentos respecto de C, con la carga de AC y $P$ girando la viga en
          el mismo sentido y la barra en el contrario:

          $$
          N\sin30°\cdot3a = 3q_0a\cdot1{,}5a + 3q_0a\cdot a = 7{,}5q_0a^{2}
          \quad\Rightarrow\quad N = 5q_0a
          $$

          de tracción.
      - tipo: calcular
        titulo: El axil del tramo AC
        pregunta: |
          ¿Cuánto vale el axil de la viga entre A y C, en unidades de $q_0a$
          (positivo si es de tracción)?
        respuesta:
          tipo: numero
          valor: '-4.330'
          tolerancia: 0.01
          formato: un número con su signo, el coeficiente de q0·a
        distractores:
          - valor: '4.330'
            mensaje: |
              El signo. La barra tira de A hacia arriba y hacia la derecha,
              hacia C: empuja el tramo AC contra el apoyo C, y lo comprime.
          - valor: '-2.5'
            mensaje: |
              Has tomado la componente vertical. El axil de la viga es
              horizontal: $N\cos30°$.
          - valor: '-5'
            mensaje: |
              Es la fuerza de la barra entera. La viga solo recibe su
              componente horizontal, $N\cos30°$.
        pista: |
          La componente horizontal de la barra, $N\cos30°$, llega a A y la
          equilibra la reacción horizontal de C.
        desarrollo: |
          $$
          N_{AC} = -N\cos30° = -5q_0a\cdot0{,}866 = -4{,}330\,q_0a
          $$

          de compresión, constante de A a C. De C a D no hay fuerzas
          horizontales: $N_{CD} = 0$.
      - tipo: calcular
        titulo: El flector máximo
        pregunta: |
          ¿Cuánto vale el mayor flector de la viga, en unidades de
          $q_0a^{2}$?
        respuesta:
          tipo: numero
          valor: '3.125'
          tolerancia: 0.005
          formato: un número, el coeficiente de q0·a²
        distractores:
          - valor: '3'
            mensaje: |
              Es el flector en C. Entre A y C el cortante se anula en
              $x = 2{,}5a$, y allí el flector tiene un máximo un poco mayor.
          - valor: '1.125'
            mensaje: |
              Es $q_0(3a)^{2}/8$, el de AC como viga biapoyada sin más
              cargas. En C la viga sigue hasta D, y $P$ y la barra cambian las
              reacciones.
        pista: |
          De A a C, $T(x) = 2{,}5q_0a - q_0x$: se anula en $x = 2{,}5a$, y
          allí está el máximo (ec. 7.15).
        desarrollo: |
          La reacción vertical de la barra en A es $N\sin30° = 2{,}5q_0a$.
          De A a C,

          $$
          T(x) = 2{,}5q_0a - q_0x,\qquad M(x) = 2{,}5q_0a\,x - \frac{q_0x^{2}}{2}
          $$

          $T = 0$ en $x = 2{,}5a$, y
          $M_{max} = 6{,}25q_0a^{2} - 3{,}125q_0a^{2} = 3{,}125q_0a^{2}$.
      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de axiles, cortantes y flectores** de la
          viga ACD, alineados bajo ella, con los valores en A, C y D, el
          punto en que se anula el cortante y el flector máximo.
        comprueba:
          - punto: |
              **Axiles**: $-4{,}33q_0a$, de compresión, constante de A a C, y
              cero de C a D.
            porque: |
              La componente horizontal de la barra entra en A y sale por el
              apoyo C; el voladizo CD no tiene cargas horizontales.
          - punto: |
              **Cortantes**: $2{,}5q_0a$ en A, recta de pendiente $-q_0$ que
              se anula en $x = 2{,}5a$ y llega a $-0{,}5q_0a$ justo antes de
              C; en C salta a $-3q_0a$, constante hasta D, donde $P$ lo
              devuelve a cero.
            porque: |
              $dT/dx = -q$ (ec. 7.14). La reacción vertical de C es de
              $2{,}5q_0a$ hacia abajo: el salto en C es hacia abajo.
          - punto: |
              **Flectores**: cero en A; parábola con su máximo,
              $3{,}125q_0a^{2}$, en $x = 2{,}5a$, que baja a $3q_0a^{2}$ en C;
              de C a D, recta hasta cero. Positivo en toda la viga.
            porque: |
              $dM/dx = T$ (ec. 7.15): máximo donde se anula el cortante, y
              recta donde el cortante es constante. Todo positivo: la fibra
              de abajo trabaja a tracción en toda la viga.
        figura: |
          <svg viewBox="0 0 400 368" role="img" width="400" height="368" aria-labelledby="exerm1718-ext-6-la-viga-rigida-en-t-sujeta-por-la-barra-1-dia-t exerm1718-ext-6-la-viga-rigida-en-t-sujeta-por-la-barra-1-dia-d">
          <title id="exerm1718-ext-6-la-viga-rigida-en-t-sujeta-por-la-barra-1-dia-t">Los diagramas de axiles, cortantes y flectores de la viga ACD</title>
          <desc id="exerm1718-ext-6-la-viga-rigida-en-t-sujeta-por-la-barra-1-dia-d">Tres diagramas alineados con la viga, a escala, con líneas verticales en A, C y D. Axiles: −4,33q0a, compresión, constante de A a C, y cero de C a D. Cortantes: 2,5q0a en A, bajan en línea recta, se anulan en x = 2,5a y llegan a −0,5q0a justo antes de C; en C saltan a −3q0a, constante hasta D. Flectores, positivos hacia arriba: cero en A, parábola con su máximo, 3,125q0a², en x = 2,5a, que baja a 3q0a² en C; de C a D, recta hasta cero en D.</desc>
