asignatura: elasticidad-resistencia
curso: '2019-2020'
convocatoria: segundo-parcial
fecha: 7 de enero de 2020
# La segunda parte de Elasticidad y Resistencia de Materiales del 7 de
# enero de 2020: tres páginas, la 1 con cuatro preguntas de teoría de 1
# punto, la 2 con los problemas 1 y 2 y el principio del 3, y la 3 con el
# final del problema 3, su línea de datos y su figura. Tres problemas de 2
# puntos: diez puntos en total, y el cuadernillo los imprime todos. El
# mismo día se hizo el examen final, que repite cinco de estas siete
# preguntas (punto 4).
#
# El cuadernillo es bilingüe, euskera a la izquierda y castellano a la
# derecha, y se transcribe **solo la columna en castellano**, tal cual. El
# euskera pide lo mismo en las siete; se ha mirado para leer lo que el
# castellano deja dudoso (punto 2).
#
# 1. **EL PDF PIERDE FIGURAS, Y EL WORD MANDA.** En el PDF la figura de la
#    estructura espacial (problema 3) se queda en los rótulos, el
#    empotramiento y el apoyo, y las barras 1 y 2 del problema 2 salen como
#    cuñas. Las dos se han leído en las formas del Word original, que
#    llevan las coordenadas de cada línea. Las figuras se redibujan.
#
# 2. **LO QUE EL TEXTO NO DICE Y LA FIGURA O EL EUSKERA SÍ.** Cada lectura
#    va también en la nota de su enunciado.
#    - Problema 1: la condición del apartado b se imprime
#      «EIz/kL³ = 1/3», y el problema no tiene ninguna L; la columna en
#      euskera escribe «EIz/ka³ = 1/3», y así se lee (k = 3EIz/a³). La
#      cota de 20 cm de la sección es el canto total, de la cara de arriba
#      del ala superior a la de abajo del ala inferior (sus líneas de
#      referencia, en el Word, están en esas caras). Bajo las letras A, B,
#      C y D la figura pone una «c» suelta, que no se dibuja.
#    - Problema 2: la barra 1 forma 30° con la horizontal y la 2, 30° con
#      la vertical; el techo de la barra 2 está a la altura de A (OA = a).
#      El coeficiente de dilatación no se da: se llama α.
#    - Problema 3: las barras están en un plano horizontal y se cortan en
#      ángulo recto; M0 es un vector según CD, de C hacia D (la doble
#      flecha de la figura). No se da Ip: con sección circular, Ip = 2I, y
#      con E = 2,5G, EI = 1,25 GIp. La línea de datos va en euskera,
#      «Datuak», en las dos columnas.
#
# 3. **ERRATAS DEL TEXTO, CONSERVADAS**: «Enggeser» (teoría 2), «Determine
#    en el espesor» (teoría 3), «Las barras 1, 2 y 3» cuando hay dos
#    (problema 2) y «sección circula» (problema 3). Los apartados del
#    problema 1 van como «a)», «b)» y «c/», como en el original.
#
# 4. **PREGUNTAS REPETIDAS** (lección 16: se reutiliza el id solo si la
#    pregunta es idéntica, puntos incluidos).
#    - La **teoría 1**, «Teorema del flujo cortante.», con 1 punto, es
#      palabra por palabra la cuestión 3 de la final de enero de 2021
#      (`exerm2021-ord-3-el-teorema-del-flujo-cortante`, de la entrega
#      p9c, aún sin publicar), y se apunta a ella; vuelve también en la
#      final de este mismo día. Esta hoja necesita que p9c entre antes o a
#      la vez.
#    - La **teoría 3** (el tubo) y los **tres problemas** cayeron igual en
#      la final del mismo día: como teoría 4 y problemas 2, 3 y 4, la
#      teoría con 1 punto y los problemas con 1,5, 2 y 1,5. Se resuelven
#      aquí, y la final apunta a estos ejercicios; los enunciados de los
#      problemas van sin su «(2p)», y cada hoja pinta sus puntos.
#    - Las otras dos (teorías 2 y 4) no están en el sitio, ni en las
#      entregas p9c, p9d y p9e.
#
# 5. **DOS NUMERACIONES EN UN CUADERNILLO.** La teoría va de la 1 a la 4 y
#    los problemas vuelven a empezar en 1. Aquí la teoría son **n 1 a 4** y
#    los problemas **n 5, 6 y 7**; la `fuente` de cada ejercicio dice el
#    número impreso.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso (src/lib/erm) y de un segundo camino
# (fase-p/p9f, guiones/cifras.mjs). Las preguntas de teoría que piden una
# deducción llevan un ejemplo numérico nuestro, y lo dicen.
pdf: 2019-2020-2par.pdf
puntosImpresos:
  fuente: >-
    Impresos junto a cada pregunta: «1. (1p)», «2.(1p)», «3. (1p)» y
    «4. (1p)» en la teoría, pág. 1; «1. (2p)» y «2. (2 p)», pág. 2, y
    «3. (2p)», págs. 2 y 3, en los problemas.
  reparto:
    - { n: 1, puntos: 1 }
    - { n: 2, puntos: 1 }
    - { n: 3, puntos: 1 }
    - { n: 4, puntos: 1 }
    - { n: 5, puntos: 2 }
    - { n: 6, puntos: 2 }
    - { n: 7, puntos: 2 }

