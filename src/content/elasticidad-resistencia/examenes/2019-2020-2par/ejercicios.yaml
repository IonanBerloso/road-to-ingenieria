      <title id="exerm1920-2par-6-la-barra-rigida-aob-con-dos-barras-fig-t">La barra rígida AOB en L, articulada en O y sujeta por las barras 1 y 2, con la carga q0 sobre OB</title>
      <desc id="exerm1920-2par-6-la-barra-rigida-aob-con-dos-barras-fig-d">Una barra gruesa en forma de L: el tramo OA vertical, con A arriba, y el tramo OB horizontal hacia la derecha. O, en la esquina, es una articulación sobre el suelo. Sobre OB baja una carga repartida uniforme q0. De A sale la barra 1, hacia arriba y hacia la izquierda, hasta una articulación en una pared; un arco marca 30° entre ella y la horizontal. De B sale la barra 2, hacia arriba y hacia la derecha, hasta una articulación en el techo; un arco marca 30° entre ella y la vertical. El techo de la barra 2 está a la altura de A. Cotas: a, en horizontal, de la articulación de la barra 1 a la vertical de O; 2a de O a B; a, en vertical, a la derecha, del techo de la barra 2 al nivel de B.</desc>
