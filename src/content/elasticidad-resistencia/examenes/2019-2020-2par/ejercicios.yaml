      **Notas nuestras.** El problema no tiene ninguna longitud $L$: la
      columna en euskera escribe $EI_z/(ka^{3}) = 1/3$, y así se lee, con
      $k = 3EI_z/a^{3}$. La cota de 20 cm de la sección va de la cara de
      arriba del ala superior a la de abajo del ala inferior (en el Word sus
      líneas de referencia están en esas dos caras): el canto total es de
      20 cm y el alma mide 16 cm entre las alas.
    pide: >-
      El descenso de C en función de P, a, EIz y k; los diagramas de
      cortantes y de flectores con EIz/ka³ = 1/3; y la longitud a con la que
      la tensión máxima de tracción vale 200 MPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántas incógnitas hiperestáticas tiene la viga, y qué condición
          las fija?
        opciones:
          - texto: >-
              Una, la fuerza del muelle; la condición es que el descenso de C
              de la viga sea el acortamiento del muelle, la fuerza dividida
              por $k$
            correcta: true
            mensaje: |
              Eso es. El empotramiento da tres reacciones, que bastan para una
              viga plana; el muelle es una más. Con su fuerza $R_C$ como
              incógnita, la viga es un voladizo, y la compatibilidad es
              $v_C = R_C/k$.
          - texto: >-
              Una, la reacción de C; la condición es que C no baje, como en un
              apoyo
            mensaje: |
              Eso sería un apoyo rígido. Un muelle se deja acortar: baja lo
              que la fuerza que lleva dividida por $k$. Con $v_C = 0$ el
              problema pierde la rigidez del muelle, que el enunciado da.
          - texto: >-
              Ninguna: el muelle no es un apoyo, y la viga es un voladizo
              isostático
            mensaje: |
              El muelle sí es un enlace: su fuerza depende de lo que baje C, y
              no se sabe sin la deformación de la viga. Es una incógnita más
              que las ecuaciones de equilibrio.
          - texto: >-
              Dos, la fuerza del muelle y el flector del empotramiento, con
              las condiciones de flecha en C y de giro en A
            mensaje: |
              El empotramiento y el giro nulo en A ya van en el voladizo
              que queda al quitar el muelle. Solo sobra una reacción.
      - tipo: calcular
        titulo: La fuerza del muelle
        pregunta: |
          Con $EI_z/(ka^{3}) = 1/3$, ¿cuánto vale la fuerza que lleva el
          muelle, hacia arriba sobre la viga, en $P$?
        respuesta:
          tipo: numero
          valor: '1.5893'
          tolerancia: 0.002
          formato: un número, en P
        distractores:
          - valor: '0.4890'
            mensaje: |
              Has leído $kL^{3}$ con $L = 4a$, la longitud de la viga. El
              problema no define ninguna $L$, y la columna en euskera escribe
              $ka^{3}$: $k = 3EI_z/a^{3}$.
          - valor: '1.6481'
            mensaje: |
              Es la fuerza de un apoyo rígido, con $v_C = 0$. El muelle se
              acorta $R_C/k$: la condición es
              $v_{C0} - 9R_Ca^{3}/EI_z = R_C/k$.
          - valor: '2.4286'
            mensaje: |
              Has tomado como descenso de C por la $P$ de D la flecha del
              extremo, $P(4a)^{3}/(3EI)$. En C, a $3a$ del empotramiento, es
              $P(3a)^{2}(3\cdot4a - 3a)/(6EI)$.
        pista: |
          Quita el muelle y pon su fuerza $R_C$ hacia arriba. En el voladizo,
          la flecha en $x$ de una fuerza en $x_P$ es
          $Px^{2}(3x_P - x)/(6EI)$ si $x \le x_P$, y
          $Px_P^{2}(3x - x_P)/(6EI)$ si $x \ge x_P$. Iguala el descenso de C
          a $R_C/k$.
        desarrollo: |
          El descenso de C con las dos $P$ y sin muelle:

          $$
          v_{C0} = \frac{Pa^{2}(9a - a)}{6EI} + \frac{P(3a)^{2}(12a - 3a)}{6EI} = \frac{8Pa^{3}}{6EI} + \frac{81Pa^{3}}{6EI} = \frac{89Pa^{3}}{6EI}
          $$

          La fuerza $R_C$ lo sube $R_C(3a)^{3}/(3EI) = 9R_Ca^{3}/EI$, y el
          muelle se acorta $R_C/k$:

          $$
          \frac{89Pa^{3}}{6EI} - \frac{9R_Ca^{3}}{EI} = \frac{R_C}{k}
          $$

          Con $k = 3EI/a^{3}$: $R_C(1/3 + 9) = 89P/6$, y
          $R_C = 89P/56 = 1{,}5893P$.
      - tipo: calcular
        titulo: El descenso de C (apartado a)
        pregunta: |
          ¿Cuánto baja C, en $Pa^{3}/EI_z$?
        respuesta:
          tipo: numero
          valor: '0.52976'
          tolerancia: 0.001
          formato: un número, en Pa³/EIz
        distractores:
          - valor: '0'
            mensaje: |
              Es el descenso de un apoyo rígido. El muelle se acorta lo que su
              fuerza dividida por $k$.
          - valor: '14.833'
            mensaje: |
              Es el descenso de C sin el muelle, $89Pa^{3}/(6EI)$. El muelle lo
              frena: hay que restar lo que sube su fuerza.
          - valor: '10.432'
            mensaje: |
              Has leído $kL^{3}$ con $L = 4a$: un muelle 64 veces más blando.
              El problema no tiene $L$, y la columna en euskera escribe
              $ka^{3}$.
        pista: |
          $v_C = R_C/k$. En general, antes de dar números,
          $R_C(1/k + 9a^{3}/EI) = 89Pa^{3}/(6EI)$.
        desarrollo: |
          En general,

          $$
          v_C = \frac{R_C}{k} = \frac{89Pa^{3}}{6(EI_z + 9ka^{3})}
          $$

          que es lo que pide el apartado a. Con $ka^{3} = 3EI_z$:

          $$
          v_C = \frac{89Pa^{3}}{6\cdot28EI_z} = \frac{89Pa^{3}}{168EI_z} = 0{,}52976\,\frac{Pa^{3}}{EI_z}
          $$
      - tipo: calcular
        titulo: El flector en el empotramiento
        pregunta: |
          ¿Cuánto vale el flector en A, en $Pa$ (positivo si tracciona la
          fibra de abajo)?
        respuesta:
          tipo: numero
          valor: '-0.2321'
          tolerancia: 0.001
          formato: un número, en Pa
        distractores:
          - valor: '-5'
            mensaje: |
              Es el flector en A sin el muelle: $-P\,a - P\cdot4a$. La fuerza
              del muelle, $89P/56$ a $3a$, lo reduce mucho.
          - valor: '0.2321'
            mensaje: |
              El valor es el bueno y el signo no. Las cargas del lado derecho
              de A dan más momento que el muelle: la viga cuelga del
              empotramiento y tracciona la fibra de arriba.
        pista: |
          Momentos en A de todo lo que hay a la derecha: las dos $P$ hacia
          abajo y $R_C$ hacia arriba.
        desarrollo: |
          $$
          M_A = -\big(P\,a + P\cdot4a - R_C\cdot3a\big) = -\Big(5 - \frac{267}{56}\Big)Pa = -\frac{13}{56}Pa = -0{,}2321Pa
          $$
      - tipo: dibujar
        consigna: |
          En papel (apartado b): **los diagramas de cortantes y de
          flectores**, alineados bajo la viga, con los valores en A, B, C y D
          y el convenio del curso ($V$, la suma de las fuerzas hacia arriba a
          la izquierda; $M > 0$ si tracciona la fibra de abajo).
        comprueba:
          - punto: |
              **Cortante**: $R_A = 23P/56$ constante de A a B; en B baja $P$,
              hasta $-33P/56$, constante hasta C; en C sube $89P/56$, hasta
              $P$, constante hasta D, donde baja otra vez $P$ a cero.
            porque: |
              $dT/dx = -q$ (ec. 7.14, p. 12 del tema 7) y no hay carga
              repartida: el cortante es constante a trozos y salta en cada
              fuerza puntual lo que vale esa fuerza.
          - punto: |
              **Flector**: rectas, $-13Pa/56$ en A, $5Pa/28$ en B, $-Pa$ en C
              y cero en D.
            porque: |
              $dM/dx = T$ (ec. 7.15): con el cortante constante, el flector es
              lineal. Cambia de pendiente en cada fuerza.
          - punto: |
              **Los ceros y los máximos**: el flector se anula entre A y B y
              entre B y C; el mayor en valor absoluto es $Pa$, en C, y
              tracciona la fibra de arriba.
            porque: |
              Es el que decide el apartado c: la tracción máxima está en la
              sección del flector más grande, en la fibra que tracciona.
        figura: |
          <svg viewBox="0 0 460 362" role="img" width="460" height="362" aria-labelledby="exerm1920-2par-5-la-viga-empotrada-sobre-un-resorte-dib-t exerm1920-2par-5-la-viga-empotrada-sobre-un-resorte-dib-d">
          <title id="exerm1920-2par-5-la-viga-empotrada-sobre-un-resorte-dib-t">Los diagramas de cortantes y de flectores de la viga ABCD sobre el muelle</title>
          <desc id="exerm1920-2par-5-la-viga-empotrada-sobre-un-resorte-dib-d">Dos diagramas alineados con la viga, a escala, con líneas verticales en A, B, C y D. Cortantes V: 23P/56 constante de A a B; −33P/56 constante de B a C; P constante de C a D. Flectores M, positivos hacia arriba, rectos en cada tramo: −13Pa/56 en A, 5Pa/28 en B, −Pa en C y cero en D; corta el cero una vez entre A y B y otra entre B y C.</desc>
          <line x1="70" y1="24" x2="70" y2="340" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
          <text x="70" y="19" font-size="12" fill="var(--ink)" font-weight="bold" text-anchor="middle">A</text>
          <line x1="160" y1="24" x2="160" y2="340" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
          <text x="160" y="19" font-size="12" fill="var(--ink)" font-weight="bold" text-anchor="middle">B</text>
          <line x1="340" y1="24" x2="340" y2="340" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
          <text x="340" y="19" font-size="12" fill="var(--ink)" font-weight="bold" text-anchor="middle">C</text>
          <line x1="430" y1="24" x2="430" y2="340" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
          <text x="430" y="19" font-size="12" fill="var(--ink)" font-weight="bold" text-anchor="middle">D</text>
          <line x1="70" y1="92" x2="430" y2="92" stroke="var(--ink)" stroke-width="1.1"/>
          <text x="16" y="97" font-size="13" fill="var(--ink)" font-weight="bold">V</text>
          <path d="M70 92 L70 73.1 L160 73.1 L160 119.1 L340 119.1 L340 46 L430 46 L430 92 Z" fill="var(--faint)" fill-opacity=".35" stroke="var(--live)" stroke-width="1.6"/>
          <text x="115" y="67.1" font-size="11.5" fill="var(--ink)" text-anchor="middle">23P/56</text>
          <text x="250" y="135.1" font-size="11.5" fill="var(--ink)" text-anchor="middle">−33P/56</text>
          <text x="385" y="40" font-size="11.5" fill="var(--ink)" text-anchor="middle">P</text>
          <line x1="70" y1="262" x2="430" y2="262" stroke="var(--ink)" stroke-width="1.1"/>
          <text x="16" y="267" font-size="13" fill="var(--ink)" font-weight="bold">M</text>
          <path d="M70 262 L70 276.4 L160 250.9 L340 324 L430 262 Z" fill="var(--faint)" fill-opacity=".35" stroke="var(--live)" stroke-width="1.6"/>
          <text x="74" y="292.4" font-size="11.5" fill="var(--ink)">−13Pa/56</text>
          <text x="160" y="243.9" font-size="11.5" fill="var(--ink)" text-anchor="middle">5Pa/28</text>
          <text x="345" y="340" font-size="11.5" fill="var(--ink)">−Pa</text>
          <text x="426" y="255" font-size="11.5" fill="var(--ink)" text-anchor="end">0</text>
          <text x="12" y="352" font-size="10.5" fill="var(--faint)">A escala; positivos hacia arriba. M &gt; 0 tracciona la fibra de abajo.</text>
          </svg>
      - tipo: calcular
        titulo: El centro de gravedad de la sección
        pregunta: |
          ¿A qué distancia de la cara de arriba del ala superior está el
          centro de gravedad de la sección, en cm?
        respuesta:
          tipo: numero
          valor: '11.957'
          tolerancia: 0.01
          formato: un número, en cm
        distractores:
          - valor: '10'
            mensaje: |
              Es la mitad del canto. La sección no es simétrica: el ala de
              abajo es el doble de ancha y baja el centro de gravedad.
          - valor: '8.0435'
            mensaje: |
              Es la distancia desde la cara de abajo. La pregunta la mide
              desde arriba: $20 - 8{,}0435 = 11{,}957$ cm.
        pista: |
          Tres rectángulos: ala de arriba de 10 × 2, alma de 2 × 16 y ala de
          abajo de 20 × 2 cm. $\overline{y} = \sum A_iy_i/\sum A_i$, con
          $y_i$ el centro de cada uno medido desde arriba.
        desarrollo: |
          $$
          \overline{y} = \frac{20\cdot1 + 32\cdot10 + 40\cdot19}{20 + 32 + 40} = \frac{1100}{92} = 11{,}957\ \text{cm}
          $$
      - tipo: calcular
        titulo: El momento de inercia
        pregunta: |
          ¿Cuánto vale el momento de inercia $I_z$ respecto del eje que pasa
          por el centro de gravedad, en cm⁴?
        respuesta:
          tipo: numero
          valor: '5210.5'
          tolerancia: 1
          formato: un número, en cm⁴
        distractores:
          - valor: '4507.8'
            mensaje: |
              Te faltan los momentos de inercia propios de los rectángulos,
              $bh^{3}/12$. El del alma, $2\cdot16^{3}/12 = 682{,}7$ cm⁴, no es
              pequeño.
          - valor: '5562.7'
            mensaje: |
              Has llevado los rectángulos a la mitad del canto, $y$ = 10 cm,
              y no al centro de gravedad. Steiner se aplica con la distancia
              al eje que pasa por el centro de gravedad.
        pista: |
          Steiner con cada rectángulo:
          $I_z = \sum\big(b_ih_i^{3}/12 + A_id_i^{2}\big)$, con $d_i$ la
          distancia de su centro a $\overline{y}$ = 11,957 cm.
        desarrollo: |
          $$
          I_z = \Big(\frac{10\cdot2^{3}}{12} + 20\cdot10{,}957^{2}\Big) + \Big(\frac{2\cdot16^{3}}{12} + 32\cdot1{,}957^{2}\Big) + \Big(\frac{20\cdot2^{3}}{12} + 40\cdot7{,}043^{2}\Big)
          $$

          $$
          I_z = 2407{,}7 + 805{,}2 + 1997{,}6 = 5210{,}5\ \text{cm}^4
          $$
      - tipo: calcular
        titulo: La longitud a (apartado c)
        pregunta: |
          ¿Con qué longitud $a$ la tensión máxima de tracción de la viga vale
          200 MPa, en m?
        respuesta:
          tipo: numero
          valor: '2.9052'
          tolerancia: 0.003
          formato: un número, en m
        distractores:
          - valor: '4.3186'
            mensaje: |
              Has tomado la fibra de abajo en C, a 8,04 cm del centro de
              gravedad. En C el flector es negativo y tracciona la de arriba,
              que está a 11,96 cm.
          - valor: '24.184'
            mensaje: |
              Has tomado la sección B, la del flector positivo. Allí la
              tracción es la de abajo, pero el flector, $5Pa/28$, es mucho
              menor que el de C.
          - valor: '2.5135'
            mensaje: |
              Has usado el momento de inercia sin los propios de los
              rectángulos, 4507,8 cm⁴.
          - valor: '0.58105'
            mensaje: |
              Has tomado el flector del empotramiento sin el muelle, $5Pa$. El
              muelle lo baja a $13Pa/56$, y el que manda es el de C, $Pa$.
        pista: |
          La tracción máxima es la mayor de $|M|\,y/I_z$ en las secciones de
          flector extremo, con $y$ la distancia a la fibra que tracciona.
          Compara C (arriba, $Pa$), A (arriba, $13Pa/56$) y B (abajo,
          $5Pa/28$).
        desarrollo: |
          Manda C: el flector más grande y la fibra más lejana, la de arriba,
          a 11,957 cm. Con la ley de Navier (ec. 9.23, p. 12 del tema 9), en
          kN y cm (200 MPa = 20 kN/cm²):

          $$
          \frac{30\,a\cdot11{,}957}{5210{,}5} = 20
          \;\Rightarrow\; a = \frac{20\cdot5210{,}5}{30\cdot11{,}957} = 290{,}52\ \text{cm} = 2{,}9052\ \text{m}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Se quita el muelle y se pone su fuerza $R_C$: un voladizo con
              las dos $P$ y $R_C$.
          - texto: >-
              El descenso de C del voladizo es igual al acortamiento del
              muelle, $R_C/k$: $R_C = 89P/56$ y $v_C = 89Pa^{3}/(168EI_z)$.
          - texto: >-
              Por equilibrio, $R_A = 23P/56$ y $M_A = -13Pa/56$; los
              flectores son $5Pa/28$ en B y $-Pa$ en C.
          - texto: >-
              Manda C, con la fibra de arriba a 11,96 cm del centro de
              gravedad: $a$ = 2,905 m.
          - texto: >-
              Manda el empotramiento, porque es donde está la reacción más
              grande.
            trampa: true
            mensaje: |
              La tracción la decide el flector, no la reacción. En A el
              flector es $13Pa/56 = 0{,}23Pa$; en C, $Pa$, más de cuatro
              veces mayor: la tracción máxima está en la fibra de arriba
              de C.
    resolucion: |
      **La incógnita.** El empotramiento da tres reacciones, y el muelle, una
      más: la viga es hiperestática de grado uno. Se quita el muelle y se
      pone su fuerza $R_C$, hacia arriba; queda un voladizo de longitud $4a$
      empotrado en A. La condición es que el descenso de C sea el
      acortamiento del muelle, $R_C/k$.

      **a) El descenso de C.** Con las flechas del voladizo (tema 10, con $v$
      hacia abajo):

      $$
      v_{C0} = \frac{8Pa^{3}}{6EI_z} + \frac{81Pa^{3}}{6EI_z} = \frac{89Pa^{3}}{6EI_z},\qquad
      v_C = v_{C0} - \frac{9R_Ca^{3}}{EI_z} = \frac{R_C}{k}
      $$

      de donde

      $$
      R_C = \frac{89Pa^{3}k}{6(EI_z + 9ka^{3})},\qquad v_C = \frac{89Pa^{3}}{6(EI_z + 9ka^{3})}
      $$

      Con $EI_z/(ka^{3}) = 1/3$ ($k = 3EI_z/a^{3}$; el enunciado en
      castellano escribe $kL^{3}$, y en euskera, $ka^{3}$):
      $R_C = 89P/56 = 1{,}5893P$ y $v_C = 89Pa^{3}/(168EI_z) = 0{,}52976\,Pa^{3}/EI_z$.

      **b) Los diagramas.** Por equilibrio, $R_A = 2P - 89P/56 = 23P/56$ y

      $$
      M_A = -\Big(Pa + 4Pa - \frac{89}{56}P\cdot3a\Big) = -\frac{13}{56}Pa
      $$

      El cortante es constante a trozos: $23P/56$ de A a B, $-33P/56$ de B a
      C y $P$ de C a D. El flector es lineal a trozos: $-13Pa/56$ en A,
      $5Pa/28$ en B, $-Pa$ en C y 0 en D; se anula en $x = 13a/23$ y en
      $x = 43a/33$. Son los diagramas del paso de dibujar.

      **c) La longitud.** La sección, con $y$ desde arriba: $A$ = 92 cm²,
      $\overline{y} = 1100/92 = 11{,}957$ cm (a 8,043 cm de la cara de abajo) e
      $I_z$ = 5210,5 cm⁴. La tracción máxima es la mayor de tres
      candidatas: C, con $Pa$ y la fibra de arriba a 11,957 cm; A, con
      $13Pa/56$ y la misma fibra; B, con $5Pa/28$ y la de abajo, a 8,043 cm.
      Manda C, y con Navier (ec. 9.23, p. 12 del tema 9), en kN y cm:

      $$
      \sigma_{max} = \frac{P\,a\cdot11{,}957}{5210{,}5} = 20\ \text{kN/cm}^2
      \;\Rightarrow\; a = 290{,}52\ \text{cm} = 2{,}9052\ \text{m}
      $$

      Con ese $a$, la compresión máxima, en la fibra de abajo de C, es
      $20\cdot8{,}043/11{,}957 = 13{,}5$ kN/cm², 135 MPa.

      **Comprobaciones.** El motor del curso (la elástica con un
      empotramiento y un muelle; propiedades de la sección y tensiones
      extremas) da todas las cifras, y la superposición de voladizos y
      Steiner a mano, las mismas.

  # ── Problema 2 · la barra rígida AOB con las barras 1 y 2.
  - id: exerm1920-2par-6-la-barra-rigida-aob-con-dos-barras
    titulo: La barra rígida AOB sujeta por dos barras inclinadas, con una carga repartida y la barra 2 calentada
    fuente: >-
      Problema 2 · Segunda parte del 7 de enero de 2020 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 2 puntos. Cayó igual el mismo día como problema 3 del
      examen final, donde también vale 2 puntos; el enunciado se transcribe
      sin su «(2 p)», y cada hoja pone sus puntos. En el PDF las barras salen
      como cuñas; la geometría se ha leído en el Word original. El examen no
      publica resolución; el desarrollo es nuestro, con los apuntes del tema
      8, y cada cifra sale del motor del curso y de un segundo camino.
    nivel: examen
    enunciado: |
      La estructura de la figura soporta una carga distribuida $q_0$ en el
      tramo OB. Las barras 1, 2 y 3 tienen el mismo módulo $E$ y sección $A$.
      Considerando la barra AOB infinitamente rígida y sabiendo que la barra 2
      sufre una variación de temperatura $\Delta T$, determinar:

      a/ Las fuerzas en las barras 1 y 2.

      b/ El desplazamiento en A y en B.

      <figure class="figura-examen">
