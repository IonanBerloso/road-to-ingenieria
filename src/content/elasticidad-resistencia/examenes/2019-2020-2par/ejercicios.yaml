      **Notas nuestras.** «circula» es una errata del original, que se
      conserva: es «circular». La línea de datos va en euskera («Datuak») en
      las dos columnas. Las barras AB, CE, CD y EF están en un mismo plano
      horizontal, se cortan en ángulo recto y tienen la misma sección. El par
      $M_0$ es un vector según la dirección de CD, en el sentido de C a D,
      que es como lo dibuja la doble flecha. El enunciado no da $I$ ni $I_p$:
      con sección circular, $I_p = 2I$.
    pide: >-
      La reacción del apoyo de F, y el desplazamiento vertical de D en
      función de GIp, con la energía de flexión y de torsión.
    pasos:
      - tipo: reconocer
        pregunta: |
          Solo con el par $M_0$ (sin la reacción de F), ¿cómo trabaja cada
          tramo?
        opciones:
          - texto: >-
              CD a torsión; CB a flexión; AB a torsión; BE y EF, nada. Un par
              es un vector libre: en cada barra trabaja a torsión si es
              paralelo a ella y a flexión si es perpendicular
            correcta: true
            mensaje: |
              Eso es. $M_0$ va según CD, que es paralela a AB, y es
              perpendicular a CB. Las barras que no están en el camino de D a
              A, BE y EF, no llevan nada. La reacción de F añade flexión en
              EF, flexión y torsión en BE, y flexión y torsión en AB.
          - texto: >-
              Todas a flexión: el par $M_0$ dobla la estructura
            mensaje: |
              Un par paralelo a una barra la retuerce, no la dobla. $M_0$ va
              según CD, y CD y AB son paralelas.
          - texto: >-
              CD a flexión y el resto a torsión, porque $M_0$ está aplicado en
              el extremo de CD
            mensaje: |
              El par está en el extremo de CD, pero va según CD: la retuerce.
              Mira la dirección del vector, no dónde está aplicado.
          - texto: >-
              CD, CB y AB a torsión, y también BE y EF
            mensaje: |
              CB es perpendicular a $M_0$: la flexa. Y BE y EF no están en el
              camino del par hacia el empotramiento: sin la reacción de F, no
              llevan nada.
      - tipo: calcular
        titulo: La reacción de F (apartado a)
        pregunta: |
          ¿Cuánto vale la reacción de F, positiva hacia arriba, en $M_0/a$?
        respuesta:
          tipo: numero
          valor: '-0.052724'
          tolerancia: 0.0002
          formato: un número, en M₀/a, positiva hacia arriba
        distractores:
          - valor: '0.052724'
            mensaje: |
              El valor es el bueno y el signo no. El par, a través de la
              torsión de AB, hace girar BE y levanta F; el apoyo tiene que
              tirar de F hacia abajo.
          - valor: '-0.044280'
            mensaje: |
              Has tomado $EI = GI_p$. Con $E = 2{,}5G$ e $I_p = 2I$,
              $EI = 1{,}25\,GI_p$.
          - valor: '-0.085227'
            mensaje: |
              Has tomado $EI = 2{,}5\,GI_p$, con $I_p = I$. En una sección
              circular $I_p = 2I$: $EI = 1{,}25\,GI_p$.
          - valor: '-0.066815'
            mensaje: |
              Te falta la torsión de BE. La reacción de F, a $2a$ de E según
              $x$, retuerce BE con $2aR$.
        pista: |
          Menabrea (ec. 13.52, p. 19 del tema 13): $\partial C/\partial R = 0$,
          con la coenergía de flexión $\int M^{2}/(2EI)\,dl$ y de torsión
          $\int M_t^{2}/(2GI_p)\,dl$. Escribe en cada barra el flector y el
          torsor de $M_0$ y de $R$.
        desarrollo: |
          Con $R$ hacia arriba en F y $\kappa = EI/(GI_p) = 1{,}25$, los
          esfuerzos que dependen de $R$:

          - EF, flexión $Rs$, de 0 a $2a$: $\int(Rs)^{2}ds = \tfrac{8}{3}R^{2}a^{3}$.
          - BE, torsión $2aR$ en $a/2$ y flexión $Rs$ de 0 a $a/2$.
          - AB, torsión $M_0 + aR/2$ en $a$ y flexión $R(3a - x)$:
            $\int_0^{a}(3a - x)^{2}dx = \tfrac{19}{3}a^{3}$.

          $$
          \frac{\partial C}{\partial R} = \frac{Ra^{3}}{EI}\Big(\frac{8}{3} + \frac{1}{24} + \frac{19}{3}\Big) + \frac{1}{GI_p}\Big(2a^{3}R + \frac{a^{2}}{2}\Big(M_0 + \frac{aR}{2}\Big)\Big) = 0
          $$

          $$
          Ra\Big(\frac{217}{24\kappa} + \frac{9}{4}\Big) = -\frac{M_0}{2}
          \;\Rightarrow\; R = -\frac{30M_0}{569a} = -0{,}052724\,\frac{M_0}{a}
          $$
      - tipo: calcular
        titulo: El desplazamiento vertical de D (apartado b)
        pregunta: |
          ¿Cuánto vale el desplazamiento vertical de D, positivo hacia abajo,
          en $M_0a^{2}/(GI_p)$?
        respuesta:
          tipo: numero
          valor: '0.74851'
          tolerancia: 0.002
          formato: un número, en M₀a²/GIp, positivo hacia abajo
        distractores:
          - valor: '0.6'
            mensaje: |
              Es el descenso sin el apoyo de F. La reacción de F también mueve
              D, a través de la torsión y la flexión de AB.
          - valor: '-0.74851'
            mensaje: |
              El valor es el bueno y el signo no: D baja. Con una fuerza
              unidad hacia arriba en D el resultado sale negativo, y eso quiere
              decir que D va al revés de la fuerza unidad.
          - valor: '0.78367'
            mensaje: |
              Has tomado $EI = GI_p$. Con $E = 2{,}5G$ e $I_p = 2I$,
              $EI = 1{,}25\,GI_p$.
          - valor: '0.65938'
            mensaje: |
              Has tomado $EI = 2{,}5\,GI_p$, con $I_p = I$. En una sección
              circular $I_p = 2I$.
        pista: |
          Fuerza unidad vertical en D, en el isostático (sin el apoyo de F):
          $\delta_D = \int M\,m/EI + \int M_t\,m_t/GI_p$, con $M$ y $M_t$ los
          esfuerzos de verdad, con $R$ ya conocida.
        desarrollo: |
          Con una fuerza unidad hacia arriba en D: CD, flexión $s$; CB,
          flexión de $-a/2$ a 0 y torsión $-a$; AB, torsión $-a/2$ y flexión
          $-(2a - x)$. Multiplicando por los esfuerzos de verdad:

          - CB: $M_0$ por la flexión, $-M_0a^{2}/(8EI)$.
          - AB, torsión: $-(M_0 + aR/2)\,a^{2}/(2GI_p)$.
          - AB, flexión: $+\tfrac{23}{6}Ra^{3}/EI$.

          $$
          \delta_D^{\uparrow} = \frac{M_0a^{2}}{GI_p}\Big(-\frac{1}{8\kappa} - \frac{1}{2}\Big) + \frac{Ra^{3}}{GI_p}\Big(-\frac{1}{4} + \frac{23}{6\kappa}\Big) = -\frac{4259}{5690}\,\frac{M_0a^{2}}{GI_p}
          $$

          D baja $0{,}74851\,M_0a^{2}/(GI_p)$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Una incógnita, la reacción $R$ de F; $EI = 2{,}5G\cdot I_p/2 = 1{,}25\,GI_p$.
          - texto: >-
              Esfuerzos por barra: CD a torsión $M_0$; CB a flexión $M_0$; EF y
              BE con $R$; AB con la torsión $M_0 + aR/2$ y la flexión de $R$.
          - texto: >-
              $\partial C/\partial R = 0$ da $R = -30M_0/(569a)$, hacia abajo.
          - texto: >-
              Con una fuerza unidad en D, $\delta_D = 4259M_0a^{2}/(5690\,GI_p)$,
              hacia abajo.
          - texto: >-
              Como el par está en D, la reacción de F no cambia el descenso de
              D: basta con el isostático.
            trampa: true
            mensaje: |
              La reacción de F retuerce y flexa AB, y AB también la recorre el
              camino de D al empotramiento: cambia el descenso de D, de
              $0{,}6$ a $0{,}7485\,M_0a^{2}/(GI_p)$.
    resolucion: |
      **Los ejes y los datos.** $x$ según AB (de A a B), $y$ según EC (de C a
      E), $z$ hacia arriba; A en el origen, B $(a, 0, 0)$, C $(a, -a/2, 0)$,
      D $(2a, -a/2, 0)$, E $(a, a/2, 0)$ y F $(3a, a/2, 0)$. $M_0$ es el vector
      $(M_0, 0, 0)$ en D. Con sección circular, $I_p = 2I$, y con $E = 2{,}5G$,
      $EI = 1{,}25\,GI_p$; se escribe $\kappa = EI/(GI_p) = 1{,}25$. Solo
      flexión y torsión, como dice el enunciado.

      **a) La reacción de F.** Hiperestática de grado uno: se quita el apoyo
      de F y se pone su reacción $R$, hacia arriba. Los esfuerzos de cada
      barra (el momento de las cargas que quedan del lado libre):

      - CD: torsión $M_0$.
      - CB: flexión $M_0$ (el vector es perpendicular a CB).
      - EF: flexión $Rs$, con $s$ desde F.
      - BE: torsión $2aR$ y flexión $Rs$, con $s$ desde E.
      - AB: torsión $M_0 + aR/2$ y flexión $R(3a - x)$.

      Con la coenergía de flexión y torsión (ecs. 13.29 y 13.43) y Menabrea
      (ec. 13.52, p. 19 del tema 13):

      $$
      \frac{\partial C}{\partial R} = \frac{Ra^{3}}{EI}\cdot\frac{217}{24} + \frac{1}{GI_p}\Big(2Ra^{3} + \frac{a^{2}}{2}\Big(M_0 + \frac{aR}{2}\Big)\Big) = 0
      $$

      donde $\tfrac{217}{24} = \tfrac{8}{3} + \tfrac{1}{24} + \tfrac{19}{3}$ son
      EF, BE y AB. Con $\kappa = 1{,}25$:

      $$
      R = -\frac{M_0/(2a)}{217/30 + 9/4} = -\frac{30}{569}\,\frac{M_0}{a} = -0{,}052724\,\frac{M_0}{a}
      $$

      El signo menos: el apoyo tira de F hacia abajo. Sin él, el par
      retorcería AB y levantaría F $0{,}5\,M_0a^{2}/(GI_p)$.

      **b) El descenso de D.** Fuerza unidad vertical en D en el isostático
      (método de la fuerza unitaria, ecs. 13.47 y 13.48, pp. 17 y 18). Sus
      esfuerzos: CD, flexión; CB, flexión $-(a/2 + y)$ y torsión $-a$; AB,
      torsión $-a/2$ y flexión $-(2a - x)$. Los productos con los esfuerzos de
      verdad que no se anulan:

      $$
      \delta_D^{\uparrow} = -\frac{M_0a^{2}}{8EI} - \frac{(M_0 + aR/2)\,a^{2}}{2GI_p} + \frac{23Ra^{3}}{6EI}
      $$

      $$
      \delta_D^{\uparrow} = \frac{M_0a^{2}}{GI_p}\Big(-0{,}1 - 0{,}5\Big) + \frac{Ra^{3}}{GI_p}\Big(-0{,}25 + 3{,}0667\Big) = -0{,}74851\,\frac{M_0a^{2}}{GI_p}
      $$

      D baja $\dfrac{4259}{5690}\,\dfrac{M_0a^{2}}{GI_p} = 0{,}74851\,\dfrac{M_0a^{2}}{GI_p}$.
      Sin el apoyo de F bajaría $0{,}6\,M_0a^{2}/(GI_p)$.

      **Comprobaciones.** El motor del curso (estructuras espaciales de
      barras a flexión y torsión, con Menabrea y la fuerza unidad) da $R$ y
      $\delta_D$, y la integración a mano de arriba, las mismas.
