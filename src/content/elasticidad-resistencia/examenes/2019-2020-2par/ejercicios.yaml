ejercicios:
  # ── Cuestión 2 · Engesser-Castigliano y la carga unitaria.
  - id: exerm1920-2par-2-engesser-castigliano-y-la-carga-unitaria
    titulo: El teorema de Engesser-Castigliano y el método de la carga unitaria
    fuente: >-
      Cuestión 2 de teoría · Segunda parte del 7 de enero de 2020 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 13, apartados 13.4,
      13.6 y 13.7 (págs. 7 a 19). Los números de los pasos de cálculo son un
      ejemplo nuestro.
    nivel: examen
    enunciado: |
      (1p) Teorema de Enggeser-Castigliano y el método de la carga unitaria.

      **Notas nuestras.** «Enggeser» es una errata del original, que se
      conserva: es Engesser.
    pide: >-
      El enunciado y la demostración del teorema de Engesser-Castigliano, y
      en qué consiste el método de la carga unitaria.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dice el teorema de Engesser-Castigliano?
        opciones:
          - texto: >-
              Que la derivada de la coenergía de deformación respecto de una
              de las fuerzas aplicadas es el desplazamiento de su punto de
              aplicación en su dirección
            correcta: true
            mensaje: |
              Eso es: $\partial C/\partial F_i = \delta_i$ (ec. 13.14, p. 8 del
              tema 13). En un sistema lineal la coenergía es igual a la
              energía, y se usa con las fuerzas de sección: es la forma de
              calcular desplazamientos en todo el bloque II.
          - texto: >-
              Que la derivada de la energía de deformación respecto de un
              desplazamiento es la fuerza aplicada en ese punto
            mensaje: |
              Ese es el primer teorema de Castigliano,
              $\partial U/\partial\delta_i = F_i$ (ec. 13.11, p. 8). El de
              Engesser es el dual: deriva la coenergía respecto de las
              fuerzas y da los desplazamientos, que es lo que se busca casi
              siempre.
          - texto: >-
              Que el trabajo de un sistema de fuerzas sobre los
              desplazamientos de otro es igual al del segundo sobre los del
              primero
            mensaje: |
              Es el teorema de reciprocidad de Maxwell-Betti (ecs. 13.7 y
              13.8, p. 7). Es otro de los teoremas energéticos del tema, pero
              no deriva ninguna energía.
          - texto: >-
              Que en un sistema hiperestático la derivada de la coenergía
              respecto de cada incógnita hiperestática es nula
            mensaje: |
              Eso es una aplicación del teorema, la de Menabrea
              (ecs. 13.51 y 13.52, p. 19), cuando el desplazamiento que
              corresponde a la incógnita es nulo. El teorema es más general.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la respuesta completa, como en el examen, el teorema con su
          demostración y el método de la carga unitaria, con su porqué.
        rubrica:
          - punto: >-
              Se define la coenergía complementaria, C, de un sistema con
              fuerzas independientes F1, …, Fn, y su variación cuando cambian
              las fuerzas, dC = Σ δi dFi (ecs. 13.12 y 13.13).
            porque: >-
              Es la mitad de la demostración: la coenergía depende de las
              fuerzas, y su diferencial lleva los desplazamientos.
            minimo: true
          - punto: >-
              Como C es función de las Fi, dC = Σ (∂C/∂Fi) dFi, y al ser las
              fuerzas independientes se identifican los coeficientes,
              ∂C/∂Fi = δi (ec. 13.14), con δi el desplazamiento del punto de
              Fi en su dirección (o el giro, si es un par).
            porque: >-
              Es el enunciado del teorema, y la independencia de las fuerzas
              es lo que permite identificar término a término.
            minimo: true
          - punto: >-
              La coenergía de una pieza se escribe con sus fuerzas de sección
              (tabla de la p. 16), y su derivada es, por ejemplo,
              ∫ M (∂M/∂Fi)/EI dl en flexión y ∫ Mt (∂Mt/∂Fi)/GIt dl en
              torsión.
            porque: >-
              Es como se usa: el desplazamiento sale de integrar los esfuerzos
              por sus derivadas respecto de la fuerza.
            minimo: true
          - punto: >-
              Método de la carga unitaria. Las derivadas de las fuerzas de
              sección respecto de Fi son las fuerzas de sección del mismo
              sistema cargado solo con una fuerza unidad en el lugar y la
              dirección de Fi (ecs. 13.47 y 13.48, pp. 17 y 18).
            porque: >-
              Convierte una derivada en un cálculo de estática, el de un
              sistema con una sola carga, la unidad.
            minimo: true
          - punto: >-
              Si en el punto no hay ninguna fuerza, se aplica una fuerza
              unidad ficticia en la dirección del desplazamiento buscado, se
              deriva y después se hace nula (p. 18); y en un hiperestático,
              la derivada respecto de cada incógnita es el desplazamiento
              conocido, casi siempre cero (ecs. 13.51 y 13.52).
            porque: >-
              Es lo que hace útil el teorema: desplazamientos en cualquier
              punto, e incógnitas hiperestáticas.
      - tipo: calcular
        titulo: Un giro con un par unidad
        pregunta: |
          Un ejemplo nuestro: una viga biapoyada de luz $L$, con $EI$
          constante y una carga uniforme $q$ en toda la luz, solo a flexión.
          Con un par unidad en el apoyo izquierdo, ¿cuánto vale el giro de
          ese apoyo, en $qL^{3}/EI$?
        respuesta:
          tipo: numero
          valor: '0.041667'
          tolerancia: 0.0002
          formato: un número, en qL³/EI
        distractores:
          - valor: '0.083333'
            mensaje: |
              Has tomado el flector del par unidad igual a 1 en toda la viga.
              Un par en un extremo de una biapoyada da un flector que baja en
              recta de 1 en ese apoyo a 0 en el otro: $m = 1 - x/L$.
          - valor: '0.013021'
            mensaje: |
              Es la flecha del centro, en $qL^{4}/EI$: has puesto una fuerza
              unidad en el centro. Para un giro, la carga unitaria es un par
              unidad en el punto cuyo giro se busca. O has integrado solo del
              centro al apoyo de la derecha: esa mitad da justo $5/384$.
          - valor: '0.028646'
            mensaje: |
              Has integrado solo de A al centro. El par unidad da flector en
              toda la luz, $m = 1 - x/L$, y como no es simétrico, la otra mitad
              no da lo mismo.
        pista: |
          $\theta_A = \int_0^{L}\dfrac{M\,m}{EI}\,dx$, con
          $M = \tfrac{1}{2}qx(L - x)$ el flector de la carga y $m$ el del par
          unidad en A, que va de 1 en A a 0 en el otro apoyo.
        desarrollo: |
          $$
          \theta_A = \frac{1}{EI}\int_0^{L}\frac{qx(L - x)}{2}\Big(1 - \frac{x}{L}\Big)dx = \frac{qL^{3}}{24EI}
          $$

          $1/24 = 0{,}041667$: es el giro de la tabla de vigas biapoyadas.
      - tipo: calcular
        titulo: Una flecha con una fuerza unidad
        pregunta: |
          En la misma viga, con una fuerza unidad en el centro, ¿cuánto vale
          la flecha del centro, en $qL^{4}/EI$?
        respuesta:
          tipo: numero
          valor: '0.013021'
          tolerancia: 0.0001
          formato: un número, en qL⁴/EI
        distractores:
          - valor: '0.0065104'
            mensaje: |
              Has integrado una sola mitad. Con la fuerza unidad en el centro,
              $m = x/2$ en la mitad izquierda y lo simétrico en la derecha: las
              dos mitades cuentan.
          - valor: '0.020833'
            mensaje: |
              Has tomado $m = x/2$ en toda la luz. Pasado el centro, el flector
              de la fuerza unidad baja otra vez: $m = (L - x)/2$.
          - valor: '0.125'
            mensaje: |
              Es la flecha del extremo de un voladizo con carga uniforme,
              $qL^{4}/8EI$. Aquí la viga está apoyada en sus dos extremos.
        pista: |
          $v_{c} = \int_0^{L}\dfrac{M\,m}{EI}\,dx$, con $m = x/2$ hasta el
          centro y simétrico después.
        desarrollo: |
          $$
          v_c = \frac{2}{EI}\int_0^{L/2}\frac{qx(L - x)}{2}\,\frac{x}{2}\,dx = \frac{5qL^{4}}{384EI}
          $$

          $5/384 = 0{,}013021$.
      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              La coenergía es función de las fuerzas independientes, y su
              diferencial es $dC = \sum\delta_i\,dF_i$.
          - texto: >-
              Igualando con $dC = \sum(\partial C/\partial F_i)\,dF_i$,
              $\partial C/\partial F_i = \delta_i$.
          - texto: >-
              Con las fuerzas de sección, $\delta_i = \int M\,(\partial M/\partial F_i)/EI\,dl$
              más los términos de axil, cortante y torsor que cuenten.
          - texto: >-
              $\partial M/\partial F_i$ es el flector del sistema cargado solo
              con una fuerza unidad en el lugar y la dirección de $F_i$; si
              $F_i$ no existe, se pone ficticia y luego se anula.
          - texto: >-
              La fuerza unidad se pone en cualquier punto de la pieza: el
              desplazamiento que se obtiene es siempre el mismo.
            trampa: true
            mensaje: |
              El desplazamiento que da el método es el del punto donde está la
              fuerza unidad, en su dirección. Para el giro de un apoyo se pone
              un par unidad en él; para la flecha del centro, una fuerza
              unidad en el centro (p. 18 del tema 13).
    resolucion: |
      **El teorema.** Sea un sistema elástico con fuerzas independientes
      $F_1, \ldots, F_n$ y desplazamientos $\delta_i$ de sus puntos en sus
      direcciones (apartado 13.4, pp. 7 y 8 del tema 13). Si las fuerzas
      cambian $dF_i$, la coenergía complementaria cambia (ecs. 13.12 y 13.13):

      $$
      dC = \sum_{i = 1}^{n}\delta_i\,dF_i = \sum_{i = 1}^{n}\frac{\partial C}{\partial F_i}\,dF_i
      $$

      y como las fuerzas son independientes, coeficiente a coeficiente
      (ec. 13.14):

      $$
      \frac{\partial C}{\partial F_i} = \delta_i
      $$

      Es el teorema de Engesser-Castigliano: la derivada de la coenergía
      respecto de una fuerza es el desplazamiento de su punto en su
      dirección (o el giro, si es un par). En un sistema lineal, $C = U$, y
      coincide con el segundo teorema de Castigliano.

      **Con las fuerzas de sección.** La coenergía de una pieza prismática
      se escribe con sus esfuerzos (tabla de la p. 16), y su derivada, en
      flexión y torsión, es

      $$
      \delta_i = \int_L\frac{M\,\partial M/\partial F_i}{EI}\,dl + \int_L\frac{M_t\,\partial M_t/\partial F_i}{GI_t}\,dl
      $$

      con los términos de axil y de cortante si cuentan (ecs. 13.30 y 13.44).

      **El método de la carga unitaria** (apartado 13.6, pp. 17 y 18). Por
      superposición, si $F_i$ crece $dF_i$, cada fuerza de sección crece
      $(\partial I/\partial F_i)\,dF_i$, que es la fuerza de sección del
      sistema cargado solo con $dF_i$ (ecs. 13.47 y 13.48). Con $dF_i = 1$:
      **las derivadas de los esfuerzos son los esfuerzos del sistema con una
      fuerza unidad en el lugar y la dirección de $F_i$**. Si en el punto no
      hay fuerza, se pone una unidad ficticia en la dirección del
      desplazamiento buscado, se calcula y se anula. En un hiperestático, la
      derivada respecto de cada incógnita es el desplazamiento conocido, casi
      siempre nulo (ecs. 13.51 y 13.52, p. 19).

      **El ejemplo.** Viga biapoyada de luz $L$ con $q$ uniforme:
      $M = \tfrac{1}{2}qx(L - x)$. Con un par unidad en A, $m = 1 - x/L$, y
      $\theta_A = qL^{3}/(24EI)$; con una fuerza unidad en el centro,
      $m = x/2$ hasta el centro, y $v_c = 5qL^{4}/(384EI)$. Son los de la
      tabla de vigas, y el motor del curso (la elástica de esa viga) da los
      mismos.

  # ── Cuestión 3 · el tubo rectangular que sustituye a la barra maciza.
  - id: exerm1920-2par-3-el-tubo-rectangular-en-lugar-de-la-barra-maciza
    titulo: El espesor del tubo rectangular d × 2d que sustituye a una barra maciza a torsión
    fuente: >-
      Cuestión 3 de teoría · Segunda parte del 7 de enero de 2020 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Cayó igual el mismo día como
      cuestión 4 del examen final, donde también vale 1 punto. El examen no
      publica resolución; el desarrollo es nuestro, con los apuntes del tema
      12, y las cifras salen del motor del curso y de un segundo camino.
    nivel: examen
    enunciado: |
      (1p) Se va a sustituir una barra circular sólida con diámetro $d$ por
      un tubo rectangular con dimensiones $d$ x $2d$ en su línea media.
      Determine en el espesor $t_{min}$ requerido en el tubo de manera que la
      tensión máxima en él no exceda la tensión máxima de la barra sólida.

      <figure class="figura-examen">
      <svg viewBox="0 0 490 190" role="img" width="490" height="190" aria-labelledby="exerm1920-2par-3-el-tubo-rectangular-en-lugar-de-la-barra-maciza-fig-t exerm1920-2par-3-el-tubo-rectangular-en-lugar-de-la-barra-maciza-fig-d">
      <title id="exerm1920-2par-3-el-tubo-rectangular-en-lugar-de-la-barra-maciza-fig-t">La barra circular maciza de diámetro d y el tubo rectangular que la sustituye</title>
      <desc id="exerm1920-2par-3-el-tubo-rectangular-en-lugar-de-la-barra-maciza-fig-d">A la izquierda, un círculo gris lleno, con una cota vertical d a su izquierda: la barra maciza. A la derecha, un rectángulo gris hueco, más ancho que alto, con una línea a trazos por el centro de la pared. La cota de arriba, 2d, y la de la derecha, d, van de esquina a esquina de la línea a trazos.</desc>
      <circle cx="95" cy="110" r="45" fill="var(--faint)" fill-opacity=".45" stroke="var(--ink)" stroke-width="1.2"/>
      <line x1="87" y1="65" x2="24" y2="65" stroke="var(--faint)" stroke-width="0.6"/>
      <line x1="87" y1="155" x2="24" y2="155" stroke="var(--faint)" stroke-width="0.6"/>
      <line x1="30" y1="65" x2="30" y2="155" stroke="var(--ink)" stroke-width="1"/><polygon points="30,155 27.4,148 32.6,148" fill="var(--ink)"/><polygon points="30,65 32.6,72 27.4,72" fill="var(--ink)"/>
      <text x="38" y="115" font-size="15" fill="var(--ink)" font-style="italic">d</text>
      <path d="M223 58 h194 v104 h-194 Z M237 72 v76 h166 v-76 Z" fill="var(--faint)" fill-opacity=".45" fill-rule="evenodd" stroke="var(--ink)" stroke-width="1.2"/>
      <rect x="230" y="65" width="180" height="90" fill="none" stroke="var(--ink)" stroke-width=".8" stroke-dasharray="5 4"/>
      <line x1="230" y1="55" x2="230" y2="28" stroke="var(--faint)" stroke-width="0.6"/>
      <line x1="410" y1="55" x2="410" y2="28" stroke="var(--faint)" stroke-width="0.6"/>
      <line x1="230" y1="34" x2="410" y2="34" stroke="var(--ink)" stroke-width="1"/><polygon points="410,34 403,36.6 403,31.4" fill="var(--ink)"/><polygon points="230,34 237,31.4 237,36.6" fill="var(--ink)"/>
