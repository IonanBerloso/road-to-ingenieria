      <figcaption>

      Redibujada del original.

      </figcaption>
      </figure>

      **Notas nuestras.** «Las barras 1, 2 y 3» es una errata del original,
      que se conserva: solo hay dos barras. La barra 1 forma 30° con la
      horizontal y la barra 2, 30° con la vertical; la articulación del
      techo de la barra 2 está a la altura de A, de modo que OA mide $a$. El
      enunciado no da el coeficiente de dilatación: se llama $\alpha$, y
      $\Delta T$ positivo es un calentamiento.
    pide: >-
      La fuerza de cada barra y los desplazamientos de A y de B, por la carga
      y por la temperatura, en función de q0, a, E, A, α y ΔT.
    pasos:
      - tipo: reconocer
        pregunta: |
          La barra AOB es rígida y está articulada en O. ¿Cómo se relacionan
          los alargamientos de las barras 1 y 2?
        opciones:
          - texto: >-
              AOB gira un ángulo pequeño $\theta$ alrededor de O: A se mueve
              en horizontal $a\theta$ y B en vertical $2a\theta$, y el
              alargamiento de cada barra es la proyección de ese movimiento
              sobre su dirección
            correcta: true
            mensaje: |
              Eso es. Un solo grado de libertad, $\theta$, y dos barras: la
              estructura es hiperestática de grado uno. Con los 30°,
              $\delta_1 = a\theta\cos30°$ y $\delta_2 = 2a\theta\cos30°$: el
              de la barra 2 es el doble.
          - texto: >-
              Los dos alargamientos son iguales, porque las dos barras están
              unidas a la misma barra rígida
            mensaje: |
              La barra es rígida, pero gira: cada punto se mueve en
              proporción a su distancia a O. B está al doble de distancia
              que A, y las dos barras están igual de inclinadas respecto de
              ese movimiento.
          - texto: >-
              El alargamiento de cada barra es el desplazamiento de su
              extremo, $a\theta$ en la 1 y $2a\theta$ en la 2
            mensaje: |
              Solo cuenta la componente del desplazamiento según la barra.
              Las barras forman 30° con el movimiento de A (horizontal) y de
              B (vertical): hay que proyectar, con $\cos30°$.
      - tipo: calcular
        titulo: La fuerza de la barra 1 por la carga
        pregunta: |
          Solo con la carga ($\Delta T = 0$), ¿cuánto vale la fuerza de la
          barra 1, en $q_0a$ (positiva si tracciona)?
        respuesta:
          tipo: numero
          valor: '0.46188'
          tolerancia: 0.001
          formato: un número, en q₀a
        distractores:
          - valor: '0.4'
            mensaje: |
              Has hecho las cuentas como si las barras fueran en la dirección
              del movimiento de A y de B, sin los 30°. Los ángulos entran dos
              veces: en los brazos del equilibrio y en la proyección de los
              alargamientos.
          - valor: '0.76980'
            mensaje: |
              Has tomado los dos alargamientos iguales. B está al doble de
              distancia de O que A: $\delta_2 = 2\delta_1$, y con las dos
              barras igual de largas, $N_2 = 2N_1$.
        pista: |
          Equilibrio de momentos en O: la carga da $2q_0a\cdot a$; cada barra,
          su fuerza por su brazo. Compatibilidad: $N_i = EA\,\delta_i/L_i$,
          con $L_1 = L_2 = a/\cos30°$ y $\delta_2 = 2\delta_1$.
        desarrollo: |
          Brazos respecto de O: $a\cos30°$ la barra 1 y $2a\cos30°$ la barra 2:

          $$
          N_1\,a\cos30° + N_2\,2a\cos30° = 2q_0a\cdot a
          $$

          Las dos miden $a/\cos30°$ y $\delta_2 = 2\delta_1$, así que
          $N_2 = 2N_1$. Entonces $5N_1\cos30° = 2q_0a$ y

          $$
          N_1 = \frac{2q_0a}{5\cos30°} = \frac{4q_0a}{5\sqrt{3}} = 0{,}46188\,q_0a
          $$
      - tipo: calcular
        titulo: La fuerza de la barra 2 por la carga
        pregunta: |
          ¿Y la de la barra 2, en $q_0a$?
        respuesta:
          tipo: numero
          valor: '0.92376'
          tolerancia: 0.001
          formato: un número, en q₀a
        distractores:
          - valor: '0.8'
            mensaje: |
              Sin los 30°. Con las barras inclinadas, los brazos son
              $a\cos30°$ y $2a\cos30°$.
          - valor: '0.76980'
            mensaje: |
              Con los dos alargamientos iguales, las dos fuerzas saldrían
              iguales. El de la barra 2 es el doble.
        pista: |
          $N_2 = 2N_1$, de la compatibilidad.
        desarrollo: |
          $$
          N_2 = 2N_1 = \frac{8q_0a}{5\sqrt{3}} = 0{,}92376\,q_0a
          $$
      - tipo: calcular
        titulo: La fuerza de la barra 1 por la temperatura
        pregunta: |
          Solo con la temperatura ($q_0 = 0$), ¿cuánto vale la fuerza de la
          barra 1, en $EA\alpha\Delta T$?
        respuesta:
          tipo: numero
          valor: '0.4'
          tolerancia: 0.001
          formato: un número, en EAαΔT
        distractores:
          - valor: '-0.4'
            mensaje: |
              El valor es el bueno y el signo no. La barra 2, al calentarse,
              empuja B hacia abajo, porque cuelga del techo; AOB gira y A va
              hacia la derecha, alejándose de la pared: la barra 1 se estira.
        pista: |
          Sin carga, el equilibrio en O da $N_1 + 2N_2 = 0$. En la barra 2 el
          alargamiento es el elástico más el térmico:
          $\delta_2 = N_2L_2/(EA) + \alpha\Delta T\,L_2$.
        desarrollo: |
          Con $\theta$ el giro de AOB, $N_1 = EA\,a\theta\cos30°/L_1 = \tfrac{3}{4}EA\theta$
          y $N_2 = EA\big(2a\theta\cos30°/L_2 - \alpha\Delta T\big) = EA\big(\tfrac{3}{2}\theta - \alpha\Delta T\big)$.
          Con $N_1 + 2N_2 = 0$: $\tfrac{15}{4}\theta = 2\alpha\Delta T$,
          $\theta = \tfrac{8}{15}\alpha\Delta T$, y

          $$
          N_1 = \frac{3}{4}\cdot\frac{8}{15}\,EA\alpha\Delta T = \frac{2}{5}\,EA\alpha\Delta T = 0{,}4\,EA\alpha\Delta T
          $$
      - tipo: calcular
        titulo: La fuerza de la barra 2 por la temperatura
        pregunta: |
          ¿Y la de la barra 2, en $EA\alpha\Delta T$?
        respuesta:
          tipo: numero
          valor: '-0.2'
          tolerancia: 0.001
          formato: un número, en EAαΔT
        distractores:
          - valor: '0'
            mensaje: |
              Sería así si la barra 2 pudiera dilatarse libre. La barra 1 la
              frena: la barra 2 queda comprimida.
          - valor: '0.2'
            mensaje: |
              El valor es el bueno y el signo no. La barra 2 querría
              alargarse más de lo que la deja la barra 1: está comprimida.
        pista: |
          $N_1 + 2N_2 = 0$, del equilibrio sin carga.
        desarrollo: |
          $$
          N_2 = -\frac{N_1}{2} = -\frac{1}{5}\,EA\alpha\Delta T = -0{,}2\,EA\alpha\Delta T
          $$

          O de su ley: $EA\big(\tfrac{3}{2}\cdot\tfrac{8}{15} - 1\big)\alpha\Delta T = -\tfrac{1}{5}EA\alpha\Delta T$.
      - tipo: calcular
        titulo: El desplazamiento de A por la carga
        pregunta: |
          Solo con la carga, ¿cuánto se mueve A (en horizontal, hacia la
          derecha), en $q_0a^{2}/(EA)$?
        respuesta:
          tipo: numero
          valor: '0.61584'
          tolerancia: 0.001
          formato: un número, en q₀a²/EA
        distractores:
          - valor: '0.53333'
            mensaje: |
              Es el alargamiento de la barra 1, $N_1L_1/(EA)$ (o lo que sale
              si se toma $L_1 = a$). El alargamiento es la proyección del
              movimiento de A sobre la barra: $u_A = \delta_1/\cos30°$.
          - valor: '0.46188'
            mensaje: |
              Has tomado $u_A = N_1a/(EA)$: la longitud de la barra como $a$
              y el desplazamiento igual al alargamiento. Faltan los dos
              $\cos30°$: $L_1 = a/\cos30°$ y $u_A = \delta_1/\cos30°$.
        pista: |
          $u_A = a\theta$, con $\theta$ de $N_1 = EA\,a\theta\cos30°/L_1$.
        desarrollo: |
          $$
          \theta = \frac{4N_1}{3EA} = \frac{16q_0a}{15\sqrt{3}\,EA},\qquad
          u_A = a\theta = \frac{16}{15\sqrt{3}}\,\frac{q_0a^{2}}{EA} = 0{,}61584\,\frac{q_0a^{2}}{EA}
          $$

          A se mueve en horizontal: AOB gira alrededor de O y A está en la
          vertical de O.
      - tipo: calcular
        titulo: El desplazamiento de B por la carga
        pregunta: |
          ¿Y cuánto baja B por la carga, en $q_0a^{2}/(EA)$?
        respuesta:
          tipo: numero
          valor: '1.2317'
          tolerancia: 0.002
          formato: un número, en q₀a²/EA
        distractores:
          - valor: '0.61584'
            mensaje: |
              Es lo que se mueve A. B está al doble de distancia de O: baja
              el doble.
        pista: |
          $v_B = 2a\theta$.
        desarrollo: |
          $$
          v_B = 2a\theta = \frac{32}{15\sqrt{3}}\,\frac{q_0a^{2}}{EA} = 1{,}2317\,\frac{q_0a^{2}}{EA}
          $$
      - tipo: calcular
        titulo: El desplazamiento de A por la temperatura
        pregunta: |
          Solo con la temperatura, ¿cuánto se mueve A en horizontal, positivo
          hacia la derecha, en $a\alpha\Delta T$?
        respuesta:
          tipo: numero
          valor: '0.53333'
          tolerancia: 0.001
          formato: un número, en aαΔT
        distractores:
          - valor: '0.66667'
            mensaje: |
              Es lo que se movería si la barra 2 se dilatara libre, sin la
              barra 1. La barra 1 la frena, y el giro es menor.
          - valor: '-0.53333'
            mensaje: |
              El valor es el bueno y el signo no. Al calentarse, la barra 2,
              que cuelga del techo, empuja B hacia abajo: AOB gira en sentido
              horario y A va hacia la derecha.
        pista: |
          $u_A = a\theta$, con el $\theta$ del estado de temperatura.
        desarrollo: |
          $$
          u_A = a\theta = \frac{8}{15}\,a\alpha\Delta T = 0{,}53333\,a\alpha\Delta T
          $$
      - tipo: calcular
        titulo: El desplazamiento de B por la temperatura
        pregunta: |
          ¿Y el desplazamiento vertical de B por la temperatura, positivo
          hacia abajo, en $a\alpha\Delta T$?
        respuesta:
          tipo: numero
          valor: '1.0667'
          tolerancia: 0.002
          formato: un número, en aαΔT
        distractores:
          - valor: '1.3333'
            mensaje: |
              Es lo que bajaría con la barra 2 dilatada libre:
              $\alpha\Delta T\,L_2/\cos30°$. La barra 1 la frena.
          - valor: '-1.0667'
            mensaje: |
              El valor es el bueno y el signo no: al calentarse, la barra 2
              empuja B hacia abajo.
        pista: |
          $v_B = 2a\theta$.
        desarrollo: |
          $$
          v_B = 2a\theta = \frac{16}{15}\,a\alpha\Delta T = 1{,}0667\,a\alpha\Delta T
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              AOB gira $\theta$ alrededor de O: $\delta_1 = a\theta\cos30°$ y
              $\delta_2 = 2a\theta\cos30°$.
          - texto: >-
              Equilibrio de momentos en O:
              $N_1\,a\cos30° + N_2\,2a\cos30° = 2q_0a^{2}$.
          - texto: >-
              Ley de cada barra, con la dilatación en la 2:
              $N_1 = \tfrac{3}{4}EA\theta$ y
              $N_2 = EA(\tfrac{3}{2}\theta - \alpha\Delta T)$.
          - texto: >-
              De ahí $\theta$, las dos fuerzas, $u_A = a\theta$ y $v_B = 2a\theta$.
          - texto: >-
              La barra 2, al calentarse, se alarga y empuja AOB: queda
              traccionada.
            trampa: true
            mensaje: |
              Al calentarse quiere alargarse $\alpha\Delta T\,L_2$, pero la
              barra 1 no la deja del todo: se alarga menos de lo que querría,
              y la diferencia es una compresión, $N_2 = -0{,}2\,EA\alpha\Delta T$.
    resolucion: |
      **La geometría y la compatibilidad.** La barra AOB es rígida y está
      articulada en O: su único movimiento es un giro pequeño $\theta$, en
      sentido horario. A, en la vertical de O a una distancia $a$, se mueve
      $a\theta$ hacia la derecha; B, en la horizontal a $2a$, baja $2a\theta$.
      Las dos barras miden $L = a/\cos30°$: la 1 va de A hacia arriba y a la
      izquierda a 30° de la horizontal, y la 2, de B hacia arriba y a la
      derecha a 30° de la vertical. Sus alargamientos son las proyecciones:
      $\delta_1 = a\theta\cos30°$ y $\delta_2 = 2a\theta\cos30°$. Dos barras y
      un grado de libertad: hiperestática de grado uno.

      **Las leyes de las barras** (tema 8): $N_1 = EA\,\delta_1/L = \tfrac{3}{4}EA\theta$,
      $N_2 = EA\big(\delta_2/L - \alpha\Delta T\big) = EA\big(\tfrac{3}{2}\theta - \alpha\Delta T\big)$.

      **El equilibrio de momentos en O.** La carga, $2q_0a$ a $a$ de O; las
      barras, con brazos $a\cos30°$ y $2a\cos30°$:

      $$
      \frac{\sqrt{3}}{2}\,(N_1 + 2N_2) = 2q_0a
      $$

      **a) Las fuerzas.** Sustituyendo:
      $\tfrac{\sqrt{3}}{2}EA\big(\tfrac{15}{4}\theta - 2\alpha\Delta T\big) = 2q_0a$,

      $$
      \theta = \frac{16}{15\sqrt{3}}\,\frac{q_0a}{EA} + \frac{8}{15}\,\alpha\Delta T
      $$

      $$
      N_1 = \frac{4}{5\sqrt{3}}\,q_0a + \frac{2}{5}\,EA\alpha\Delta T = 0{,}4619\,q_0a + 0{,}4\,EA\alpha\Delta T
      $$

      $$
      N_2 = \frac{8}{5\sqrt{3}}\,q_0a - \frac{1}{5}\,EA\alpha\Delta T = 0{,}9238\,q_0a - 0{,}2\,EA\alpha\Delta T
      $$

      La carga tracciona las dos; el calentamiento de la 2 tracciona la 1 y
      comprime la 2.

      **b) Los desplazamientos.** A se mueve en horizontal, hacia la derecha,
      y B baja:

      $$
      u_A = a\theta = 0{,}6158\,\frac{q_0a^{2}}{EA} + 0{,}5333\,a\alpha\Delta T,\qquad
      v_B = 2a\theta = 1{,}2317\,\frac{q_0a^{2}}{EA} + 1{,}0667\,a\alpha\Delta T
      $$

      **Comprobaciones.** El motor del curso (barras sobre un sólido rígido
      articulado, con la dilatación térmica) da las dos fuerzas y los dos
      desplazamientos en los dos estados, y el equilibrio y la
      compatibilidad a mano, lo mismo.

  # ── Problema 3 · la estructura espacial con un par en D.
