      <line x1="420" y1="155" x2="456" y2="155" stroke="var(--faint)" stroke-width="0.6"/>
      <line x1="450" y1="65" x2="450" y2="155" stroke="var(--ink)" stroke-width="1"/><polygon points="450,155 447.4,148 452.6,148" fill="var(--ink)"/><polygon points="450,65 452.6,72 447.4,72" fill="var(--ink)"/>
      <text x="458" y="115" font-size="15" fill="var(--ink)" font-style="italic">d</text>
      </svg>
      <figcaption>

      Redibujada del original. La línea a trazos es la línea media de la
      pared del tubo.

      </figcaption>
      </figure>

      $$
      \tau = \frac{M_t}{2A_tt},\qquad I_t = \frac{4A_t^{2}}{\int_L\frac{ds}{t}}
      $$

      **Notas nuestras.** Las dos fórmulas van impresas en el original, bajo
      la figura. «Determine en el espesor» es una errata del original, que
      se conserva. Las dos piezas llevan el mismo momento torsor $M_t$, y el
      tubo tiene un espesor uniforme.
    pide: >-
      El espesor mínimo del tubo, en función de d. Y, aunque el examen no lo
      pide, cuánto más rígido a torsión es el tubo que la barra.
    pasos:
      - tipo: reconocer
        pregunta: |
          En $\tau = M_t/(2A_tt)$, ¿qué área es $A_t$ en este tubo?
        opciones:
          - texto: >-
              El área que encierra la línea media de la pared, el rectángulo
              de $d \times 2d$: $A_t = 2d^{2}$
            correcta: true
            mensaje: |
              Eso es. Sale de que el par del flujo, $q\oint r\,ds$, es $q$
              por el doble del área que encierra la línea media (ecs. 12.22
              a 12.24, pp. 11 y 12 del tema 12). Por eso el enunciado da las
              cotas en la línea media.
          - texto: >-
              El área de la pared, la de material: el perímetro medio por el
              espesor, $6dt$
            mensaje: |
              El área de material no aparece en la fórmula de Bredt. Lo que
              cuenta es el área encerrada: es la que da el brazo del flujo.
              Dos tubos con la misma pared y distinto hueco aguantan
              distinto.
          - texto: >-
              El área del hueco, la de dentro de la cara interior de la pared
            mensaje: |
              Con pared delgada la diferencia es pequeña, pero la fórmula se
              deduce con la línea media, y las cotas del enunciado son las de
              la línea media: $A_t = d\cdot2d$.
      - tipo: calcular
        titulo: El espesor mínimo
        pregunta: |
          ¿Qué espesor $t_{min}$ hace que el tubo tenga la misma tensión máxima
          que la barra maciza, en unidades de $d$?
        respuesta:
          tipo: numero
          valor: '0.049087'
          tolerancia: 0.0002
          formato: un número, en d
        distractores:
          - valor: '0.098175'
            mensaje: |
              Es el doble: te falta el 2 de $\tau = M_t/(2A_tt)$, o has tomado
              $A_t = d^{2}$. Con $A_t = 2d^{2}$ y el 2, el tubo da
              $M_t/(4d^{2}t)$.
          - valor: '0.024544'
            mensaje: |
              Es la mitad: has tomado $A_t = 4d^{2}$, como si la línea media
              fuera de $2d \times 2d$, o has contado el 2 dos veces.
        pista: |
          En la maciza, $\tau_{max} = 16M_t/(\pi d^{3})$ (ec. 12.11, p. 7 del
          tema 12). En el tubo, $\tau = M_t/(2A_tt)$, máxima donde el espesor
          es mínimo; aquí es uniforme. Iguala las dos.
        desarrollo: |
          $$
          \frac{M_t}{2\cdot2d^{2}\,t} = \frac{16M_t}{\pi d^{3}}
          \;\Rightarrow\;
          t_{min} = \frac{\pi d}{64} = 0{,}049087\,d
          $$

          Con $d$ = 100 mm, una pared de 4,9 mm.
      - tipo: calcular
        titulo: La rigidez del tubo frente a la de la barra
        pregunta: |
          Esto no lo pide el examen. Con ese espesor, ¿cuántas veces es la
          rigidez a torsión del tubo, $GI_t$, la de la barra maciza, $GI_p$?
        respuesta:
          tipo: numero
          valor: '1.3333'
          tolerancia: 0.002
          formato: un número, el cociente It/Ip
        distractores:
          - valor: '0.75'
            mensaje: |
              Es el cociente al revés, $I_p/I_t$. El tubo es el más rígido.
          - valor: '2.6667'
            mensaje: |
              Has tomado $\int_L ds/t$ con la mitad del perímetro, $3d/t$. La
              integral recorre la línea media entera: $6d/t$.
          - valor: '0.3333'
            mensaje: |
              Te falta el 4 de $I_t = 4A_t^{2}/\int_L ds/t$ (ec. 12.29, p. 14).
        pista: |
          $I_t = 4A_t^{2}\big/\int_L ds/t$ (ec. 12.29), con $A_t = 2d^{2}$,
          el perímetro medio $6d$ y $t = \pi d/64$. La maciza tiene
          $I_p = \pi d^{4}/32$.
        desarrollo: |
          $$
          I_t = \frac{4(2d^{2})^{2}}{6d/t} = \frac{8}{3}\,d^{3}t = \frac{8}{3}\,d^{3}\,\frac{\pi d}{64} = \frac{\pi d^{4}}{24}
          $$

          $$
          \frac{I_t}{I_p} = \frac{\pi d^{4}/24}{\pi d^{4}/32} = \frac{4}{3} = 1{,}3333
          $$

          Con la misma tensión máxima, el tubo gira un 25 % menos.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Barra maciza, $\tau_{max} = 16M_t/(\pi d^{3})$, en el borde.
          - texto: >-
              Tubo, $A_t = d\cdot2d = 2d^{2}$, el área que encierra la línea
              media.
          - texto: >-
              $\tau = M_t/(2A_tt) = M_t/(4d^{2}t)$, la misma en toda la pared.
          - texto: >-
              Igualando, $t_{min} = \pi d/64 = 0{,}049\,d$.
          - texto: >-
              La tensión del tubo es máxima en las esquinas, donde la
              distancia al centro es mayor.
            trampa: true
            mensaje: |
              En una sección cerrada de pared delgada el flujo $\tau t$ es el
              mismo en toda la pared (ec. 12.21, p. 11): la tensión es máxima
              donde el espesor es mínimo, no donde la distancia al centro es
              mayor. Eso es de la sección circular, $\tau = M_tr/I_p$.
    resolucion: |
      **La barra maciza.** $\tau = M_tr/I_p$ (ec. 12.10, p. 7 del tema 12),
      máxima en el borde (ec. 12.11):

      $$
      \tau_{max} = \frac{16M_t}{\pi d^{3}}
      $$

      **El tubo.** Sección cerrada de pared delgada: el flujo $q = \tau t$ es
      uniforme (ec. 12.21, p. 11) y su par es $2A_tq$, con $A_t$ el área que
      encierra la línea media (ecs. 12.22 a 12.24, pp. 11 y 12). Es la
      primera fórmula del enunciado. Aquí $A_t = d\cdot2d = 2d^{2}$, y con el
      espesor uniforme

      $$
      \tau = \frac{M_t}{2\cdot2d^{2}\,t} = \frac{M_t}{4d^{2}t}
      $$

      **El espesor mínimo.** Igualando las dos tensiones máximas:

      $$
      \frac{M_t}{4d^{2}t} = \frac{16M_t}{\pi d^{3}}
      \;\Rightarrow\;
      t_{min} = \frac{\pi d}{64} = 0{,}049087\,d
      $$

      Con un espesor menor, el tubo superaría la tensión máxima de la barra.

      **La rigidez, que no se pide.** Con la segunda fórmula (ec. 12.29,
      p. 14), el perímetro medio $6d$ y $t = \pi d/64$:

      $$
      I_t = \frac{4A_t^{2}}{6d/t} = \frac{\pi d^{4}}{24},\qquad \frac{I_t}{I_p} = \frac{4}{3}
      $$

      El tubo aguanta la misma tensión, es un 33 % más rígido a torsión y
      tiene $6d\,t = 0{,}295\,d^{2}$ de área de material, frente a los
      $0{,}785\,d^{2}$ de la maciza: menos de la mitad del peso.

      **Comprobaciones.** El motor del curso (torsión de la sección circular
      y de la cerrada de pared delgada, con los cuatro lados) da $t_{min}$,
      la tensión del tubo con ese espesor igual a la de la maciza y el
      cociente $I_t/I_p$.

  # ── Cuestión 4 · la ecuación de los tres momentos.
  - id: exerm1920-2par-4-la-ecuacion-de-los-tres-momentos
    titulo: La deducción de la ecuación de los tres momentos
    fuente: >-
      Cuestión 4 de teoría · Segunda parte del 7 de enero de 2020 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 11, apartado 11.3
      (págs. 5 a 7). Los números de los pasos de cálculo son un ejemplo
      nuestro.
    nivel: examen
    enunciado: |
      (1p) Deducir la ecuación de los 3 momentos.
    pide: >-
      La ecuación de los tres momentos de una viga continua, deducida.
    pasos:
      - tipo: reconocer
        pregunta: |
          En una viga continua de $N$ vanos, ¿qué incógnitas toma la ecuación
          de los tres momentos, y qué condición las fija?
        opciones:
          - texto: >-
              Los flectores en los apoyos intermedios; se libera el giro
              encima de cada apoyo, cada vano queda biapoyado, y la condición
              es que el giro a la izquierda y a la derecha de cada apoyo sea
              el mismo
            correcta: true
            mensaje: |
              Eso es (p. 5 del tema 11, figuras 11.3 y 11.4). La viga tiene
              $N - 1$ apoyos intermedios y es $N - 1$ veces hiperestática.
              Cada ecuación junta los flectores de tres apoyos seguidos: de
              ahí el nombre.
          - texto: >-
              Las reacciones de los apoyos intermedios; se quitan los apoyos y
              se impone que la flecha en cada uno sea nula
            mensaje: |
              Eso también resuelve la viga, pero es otro método, el de las
              flechas. La ecuación de los tres momentos toma como incógnitas
              los flectores de los apoyos, y su condición es de giros.
          - texto: >-
              Los flectores en los apoyos; la condición es que el flector sea
              continuo encima de cada apoyo
            mensaje: |
              Al cortar el giro encima del apoyo y poner el mismo flector
              $M_i$ a los dos lados, la continuidad del flector ya está. Lo
              que hay que imponer es lo que se ha liberado: que el giro sea el
              mismo a los dos lados.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción completa, como en el examen, de la viga
          hiperestática al sistema isostático y de la continuidad de giros a
          la ecuación.
        rubrica:
          - punto: >-
              Viga continua de N vanos y N + 1 apoyos, hiperestática de grado
              N − 1. Se libera el giro encima de cada apoyo intermedio y se
              ponen sus flectores Mi como incógnitas; quedan N vigas
              biapoyadas (figuras 11.3 y 11.4).
            porque: >-
              Es el sistema isostático equivalente, y la condición que falta
              es la que se ha liberado.
            minimo: true
          - punto: >-
              En cada vano [i], con inercia Ii, el flector es la suma de dos
              rectas, la de Mi−1 y la de Mi, y del diagrama isostático de las
              cargas, de área Ai y centro de gravedad a ai del apoyo izquierdo
              y a bi del derecho.
            porque: >-
              Son los tres diagramas cuyas áreas y centros entran en la viga
              conjugada.
            minimo: true
          - punto: >-
              Con la viga conjugada, los giros de los dos lados del apoyo i
              son los cortantes conjugados de los vanos [i] e [i + 1]
              (ecs. 11.1 y 11.2, p. 6), con los descensos de los apoyos si
              los hay.
            porque: >-
              Es el paso que convierte la condición de giros en una ecuación
              con los flectores.
            minimo: true
          - punto: >-
              Igualando los dos giros y multiplicando por 6E sale la ecuación
              (11.3, p. 7), Mi−1 Li/Ii + 2Mi (Li/Ii + Li+1/Ii+1) +
              Mi+1 Li+1/Ii+1 = −6Ai ai/(Li Ii) − 6Ai+1 bi+1/(Li+1 Ii+1), más el
              término de los descensos de los apoyos.
            porque: >-
              Es la ecuación que pide la pregunta.
            minimo: true
          - punto: >-
              Casos: con la misma inercia y apoyos fijos queda la ec. 11.4;
              un voladizo se cambia por su flector en el apoyo (figura 11.6),
              y un empotramiento, por un vano ficticio de inercia infinita
              (figura 11.7).
            porque: >-
              Es como se usa en los problemas, y el empotramiento es el caso
              que más se olvida.
      - tipo: calcular
        titulo: El flector en el apoyo central
        pregunta: |
          Un ejemplo nuestro: una viga continua de dos vanos, de 4 m y de 6 m,
          con la misma inercia y los extremos simplemente apoyados, lleva una
          carga uniforme de 10 kN/m en toda su longitud. ¿Cuánto vale el
          flector en el apoyo central, en kN·m?
        respuesta:
          tipo: numero
          valor: '-35'
          tolerancia: 0.05
          formato: un número, en kN·m, positivo si tracciona la fibra de abajo
        distractores:
          - valor: '-31.25'
            mensaje: |
              Es el flector de empotramiento de un vano de 5 m, la media de
              los dos: $qL^{2}/8$ con $L$ = 5 m. Con vanos distintos hay que
              escribir la ecuación con los dos.
          - valor: '-70'
            mensaje: |
              Te falta el 2 del término central: $2M_B(L_1 + L_2)$.
          - valor: '35'
            mensaje: |
              El valor es el bueno y el signo no. Encima de un apoyo
              intermedio la viga continua tracciona la fibra de arriba: el
              flector es negativo.
        pista: |
          Con los extremos apoyados, $M_A = M_C = 0$. Con la misma inercia, la
          ec. 11.4 (p. 7 del tema 11); para una carga uniforme,
          $6A\,a/L = qL^{3}/4$ en cada vano.
        desarrollo: |
          $$
          2M_B(4 + 6) = -\frac{10\cdot4^{3}}{4} - \frac{10\cdot6^{3}}{4} = -700
          \;\Rightarrow\; M_B = -35\ \text{kN·m}
          $$
      - tipo: calcular
        titulo: La reacción del apoyo central
        pregunta: |
          ¿Y la reacción del apoyo central, en kN?
        respuesta:
          tipo: numero
          valor: '64.583'
          tolerancia: 0.01
          formato: un número, en kN
        distractores:
          - valor: '50'
            mensaje: |
              Es la reacción de los dos vanos biapoyados sueltos, la mitad de
              la carga de cada uno. El flector $M_B$ añade su parte:
              $|M_B|/L_1 + |M_B|/L_2$.
          - valor: '35.417'
            mensaje: |
              Has restado la parte del flector en lugar de sumarla. Un
              flector negativo en B carga el apoyo central: la reacción crece.
        pista: |
          Cada vano, biapoyado, con su carga y el par $M_B$ en el extremo de B:
          equilibrio de momentos en el otro apoyo.
        desarrollo: |
          $$
          R_B = \frac{10\cdot4}{2} + \frac{35}{4} + \frac{10\cdot6}{2} + \frac{35}{6} = 64{,}583\ \text{kN}
          $$

          Y $R_A = 20 - 8{,}75 = 11{,}25$ kN.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Se libera el giro en los apoyos intermedios y sus flectores
              pasan a ser incógnitas: $N$ vigas biapoyadas.
          - texto: >-
              En cada vano, el flector es la suma de las dos rectas de los
              extremos y del diagrama isostático de área $A_i$.
          - texto: >-
              Con la viga conjugada, los giros a los dos lados del apoyo $i$
              son los cortantes conjugados de los vanos $[i]$ e $[i + 1]$.
          - texto: >-
              Igualándolos y multiplicando por $6E$ sale la ecuación de los
              tres momentos.
          - texto: >-
              Un empotramiento en un extremo se cambia por un apoyo simple, con
              flector nulo.
            trampa: true
            mensaje: |
              Un apoyo simple deja girar, y el empotramiento no. Se cambia por
              un vano ficticio de inercia infinita (figura 11.7, p. 7): sus
              términos se anulan en la ecuación, y el flector del
              empotramiento queda como una incógnita más.
    resolucion: |
      **El sistema isostático.** Una viga continua de $N$ vanos y $N + 1$
      apoyos es hiperestática de grado $N - 1$ (apartado 11.3, p. 5 del tema
      11). Se libera el giro encima de cada apoyo intermedio y se ponen como
      incógnitas sus flectores $M_i$: quedan $N$ vigas biapoyadas (figuras
      11.3 y 11.4). La condición que falta es la continuidad del giro encima
      de cada apoyo.

      **Los giros de cada lado.** En el vano $[i]$, entre los apoyos $i - 1$
      e $i$, de luz $L_i$ e inercia $I_i$, el flector es la suma de la recta
      de $M_{i-1}$, la de $M_i$ y el diagrama isostático de las cargas, de
      área $A_i$, con su centro de gravedad a $a_i$ del apoyo izquierdo y a
      $b_i$ del derecho. Con la viga conjugada, el giro del apoyo $i$ por la
      izquierda es el cortante conjugado del vano $[i]$ (ec. 11.1, p. 6), y
      por la derecha, el del vano $[i + 1]$ (ec. 11.2), con los descensos de
      los apoyos si los hay.

      **La ecuación.** Igualando los dos y multiplicando por $6E$ (ec. 11.3,
      p. 7):

      $$
      M_{i-1}\frac{L_i}{I_i} + 2M_i\Big(\frac{L_i}{I_i} + \frac{L_{i+1}}{I_{i+1}}\Big) + M_{i+1}\frac{L_{i+1}}{I_{i+1}} = -\frac{6A_ia_i}{L_iI_i} - \frac{6A_{i+1}b_{i+1}}{L_{i+1}I_{i+1}}
      $$

      más el término de los descensos de los apoyos, que se anula cuando no
      se mueven. Hay una por apoyo intermedio: $N - 1$ ecuaciones para $N - 1$
      incógnitas.

      **Casos.** Con la misma inercia y apoyos fijos queda la ec. 11.4. Un
      voladizo en un extremo se sustituye por su flector en el apoyo
      (figura 11.6); un empotramiento, por un vano ficticio de inercia
      infinita (figura 11.7), cuyos términos se anulan.

      **El ejemplo.** Dos vanos de 4 y 6 m con 10 kN/m: para una carga
      uniforme, $6A\,a/L = qL^{3}/4$, y con $M_A = M_C = 0$,

      $$
      2M_B(4 + 6) = -160 - 540 \;\Rightarrow\; M_B = -35\ \text{kN·m}
      $$

      La reacción central, de los dos vanos con su par:
      $R_B = 20 + 8{,}75 + 30 + 5{,}833 = 64{,}583$ kN. El motor del curso
      (tres momentos) da las dos.

  # ── Problema 1 · la viga empotrada sobre un muelle.
  - id: exerm1920-2par-5-la-viga-empotrada-sobre-un-resorte
    titulo: La viga empotrada en A y apoyada en un muelle en C, con su sección en I
    fuente: >-
      Problema 1 · Segunda parte del 7 de enero de 2020 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 2 puntos. Cayó igual el mismo día como problema 2 del
      examen final, donde vale 1,5 puntos; el enunciado se transcribe sin su
      «(2p)», y cada hoja pone sus puntos. El examen no publica resolución;
      el desarrollo es nuestro, con los apuntes de los temas 10, 11 y 9, y
      cada cifra sale del motor del curso y de un segundo camino.
