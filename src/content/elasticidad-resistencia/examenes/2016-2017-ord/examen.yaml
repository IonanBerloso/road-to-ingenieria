asignatura: elasticidad-resistencia
curso: '2016-2017'
convocatoria: ordinaria
fecha: 19 de enero de 2017
# El examen final de Elasticidad y Resistencia de Materiales del 19 de enero
# de 2017: tres páginas, la 1 de TEORÍA (cuatro cuestiones de 1 punto) y la
# 2 y la 3 de EJERCICIOS (cuatro de 1,5 puntos, dos por página). Diez puntos
# en total, y el cuadernillo los imprime todos. El mismo día se hizo la
# segunda parte, que comparte cuatro preguntas con este examen (punto 5). El
# cuadernillo está solo en castellano.
#
# 1. **EL PDF ES LA CONVERSIÓN DEL WORD, Y PIERDE DIBUJO.** Hay Word del
#    examen (17-ERM-enefin.docx) y el texto es el mismo. El PDF pierde lo
#    que el Word dibuja en VML y no es texto: la flecha de P y la barra 3
#    del ejercicio 1, las flechas de P y de q0 del ejercicio 2, los
#    vectores de m0 y M0 del ejercicio 3 y las flechas de q0 y el
#    apoyo de A del ejercicio 4. Se leen en el VML del Word. Las letras
#    griegas (σ, τ, θ, γ, δy, ΔT) son de la fuente Symbol o pequeñas
#    ecuaciones: el texto del PDF las pierde, aunque se ven en la página. Las
#    dos aristas de la cuestión 2 son una ecuación, y sus flechas de vector
#    salen en el PDF como cuadros: se transcriben como vectores.
#
# 2. **LO QUE LA FIGURA DICE Y EL TEXTO NO.**
#    - Cuestión 1: la tangencial de 27 MPa de la cara de normal x′ apunta
#      según −y′, que es el signo del enunciado; θ va de x a x′, antihorario,
#      y el ángulo dibujado es solo su rótulo.
#    - Cuestión 3: los dos dibujos pequeños son el convenio de signos de la
#      cortante; la viga mide 6 m.
#    - Ejercicio 1: P es vertical, hacia abajo, en A; la barra 3 baja
#      vertical de F a I; G, H e I son articulaciones fijas. El coeficiente
#      de dilatación no se da: el resultado lleva αΔT.
#    - Ejercicio 2: como el 1 de la segunda parte (allí se dice).
#    Las lecturas de los ejercicios 3 y 4, compartidos con la segunda parte,
#    se dicen en la cabecera de aquel examen. Cada lectura va también en la
#    nota de su enunciado.
#
# 3. **ERRATAS Y GRAFÍAS DEL TEXTO, CONSERVADAS**: «recomieda» y «Engesser
#    – Castigliano» (ejercicio 1), «apoyada en B C y F» sin coma (ejercicio
#    2), «30º» con el ordinal (cuestión 1) y «Determinar» sin dos puntos
#    (cuestión 1). Se normalizan dos cosas: «-27 MPa» se escribe con el
#    signo menos, y «ABDF .» pierde el espacio antes del punto. La cabecera
#    de las páginas 2 y 3, «EJERCICICIOS», no se copia.
#
# 4. **DOS NUMERACIONES EN UN CUADERNILLO.** La teoría va de la 1 a la 4 y
#    los ejercicios vuelven a empezar en 1. Aquí la teoría son **n 1 a 4** y
#    los ejercicios **n 5 a 8**; la `fuente` de cada ejercicio dice el
#    nombre impreso. Ninguna pregunta se parte.
#
# 5. **PREGUNTAS REPETIDAS.** Tres de las ocho no se resuelven aquí: la
#    **cuestión 4** y los **ejercicios 3 y 4** son, palabra por palabra, la
#    cuestión 4 y los ejercicios 2 y 3 de la segunda parte del mismo día, y
#    apuntan a ellos (allí valen 2 puntos los ejercicios; aquí, 1,5, desde
#    `puntosImpresos`). El **ejercicio 2** es el 1 de la segunda parte con
#    «de» en lugar de «de de» y una coma más: va propio, resuelto por la
#    viga conjugada. La **cuestión 2** volvió a caer con otras palabras en
#    los finales de enero de 2019 y de enero de 2023
#    (`exerm2223-ord-1-…`): va propia.
#
# 6. **LOS TEMAS.** La cuestión 3 va al tema 7 (diagramas). El ejercicio 1
#    va al tema 8: barras articuladas y temperatura; su apartado b usa
#    Engesser-Castigliano, del tema 13. El ejercicio 2, al tema 10.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso y de un segundo camino (fase-p/p9n,
# guiones/cifras.mjs). La cuestión 2 no trae números: el paso de cálculo es
# un ejemplo nuestro, y lo dice.
pdf: 2016-2017-ord.pdf
puntosImpresos:
  fuente: Cabecera de cada pregunta, «(1p)» en la teoría y «(1,5p)» en los ejercicios, págs. 1-3 del cuadernillo.
  reparto:
    - { n: 1, puntos: 1 }
    - { n: 2, puntos: 1 }
    - { n: 3, puntos: 1 }
    - { n: 4, puntos: 1 }
    - { n: 5, puntos: 1.5 }
    - { n: 6, puntos: 1.5 }
    - { n: 7, puntos: 1.5 }
    - { n: 8, puntos: 1.5 }

