      - tipo: calcular
        titulo: El desplazamiento de A debido a P
        pregunta: |
          Apartado b, por partes. Sin $\Delta T$, ¿cuánto vale el desplazamiento
          horizontal de A, en unidades de $Ph/EA$, positivo hacia la derecha?
        respuesta:
          tipo: numero
          valor: '-1.7321'
          tolerancia: 0.002
          formato: un número, en unidades de Ph/EA
        distractores:
          - valor: '1.7321'
            mensaje: |
              El módulo es ese, pero el signo no. Con la fuerza unidad
              hacia la derecha en A, $\sum N_i' N_iL_i/EA$ sale negativo: A se
              mueve hacia la izquierda, hacia el lado de G.
          - valor: '-0.9623'
            mensaje: |
              Has tomado las tres barras de longitud $h$. Las inclinadas
              miden $h/\sin30° = 2h$.
        pista: |
          Pon una fuerza $H$ horizontal en A y calcula, con la estática,
          $N_i' = \partial N_i/\partial H$. Después,
          $\delta_A = \sum N_i'\,N_iL_i/EA$ (ec. 13.25).
        desarrollo: |
          Con $H$ hacia la derecha en A, la estática da
          $N_1' = \tfrac{2}{3\sqrt{3}}$, $N_2' = -\tfrac{4}{3\sqrt{3}}$ y
          $N_3' = -\tfrac{1}{3\sqrt{3}}$. Con $L_1 = L_2 = 2h$ y $L_3 = h$:

          $$
          \frac{Ph}{EA}\left[\tfrac{2}{3\sqrt{3}}\cdot2\cdot2 - \tfrac{4}{3\sqrt{3}}\cdot2\cdot2 - \tfrac{1}{3\sqrt{3}}\cdot1\cdot1\right]
          = -\frac{9}{3\sqrt{3}}\frac{Ph}{EA} = -\sqrt{3}\,\frac{Ph}{EA} = -1{,}7321\,\frac{Ph}{EA}
          $$
      - tipo: calcular
        titulo: El desplazamiento de A debido a ΔT
        pregunta: |
          ¿Y la parte debida al calentamiento de la barra 2, en unidades de
          $h\alpha\Delta T$, positiva hacia la derecha?
        respuesta:
          tipo: numero
          valor: '-1.5396'
          tolerancia: 0.002
          formato: un número, en unidades de hαΔT
        distractores:
          - valor: '1.5396'
            mensaje: |
              Es el módulo con el signo cambiado. $N_2'$ es negativa: al
              alargarse, la barra 2 empuja la barra rígida hacia la izquierda.
          - valor: '-0.7698'
            mensaje: |
              Has tomado $L_2 = h$. La barra 2 está a 30°: mide $2h$.
          - valor: '0.7698'
            mensaje: |
              Has usado $N_1'$, la de la barra 1. La que se calienta es la 2:
              el término es $N_2'\,\varepsilon_0L_2$.
        pista: |
          La barra 2 se alarga $\varepsilon_0L_2 = \alpha\Delta T\cdot2h$
          (ec. 8.9), y entra en la ec. 13.25 multiplicada por $N_2'$.
        desarrollo: |
          $$
          \delta_A^{\Delta T} = N_2'\,\alpha\Delta T\,L_2 = -\frac{4}{3\sqrt{3}}\cdot2h\,\alpha\Delta T = -1{,}5396\,h\alpha\Delta T
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Equilibrio de ABDF: $N_1 = N_2 = 2P$ y $N_3 = P$, las tres a
              tracción.
          - texto: >-
              Diagramas: $N = \sqrt{3}P$ entre B y D; $T$ = −P, 0 y +P; $M$ de
              0 a $-Pa$ en B, constante hasta D y de vuelta a 0 en F.
          - texto: >-
              Una fuerza $H$ ficticia en A da las $N_i' = \partial N_i/\partial H$
              de las tres barras.
          - texto: >-
              $\delta_A = \sum N_i'(N_iL_i/EA + \alpha\Delta T\,L_i)$, solo con
              las barras: ABDF, rígida, no acumula energía.
          - texto: >-
              El calentamiento de la barra 2 cambia las fuerzas en las tres
              barras.
            trampa: true
            mensaje: |
              La estructura es isostática: las fuerzas salen solo del
              equilibrio, y la temperatura no entra en él. La barra 2 se
              alarga libremente y la barra rígida se mueve, sin esfuerzos
              nuevos (tema 8, p. 4); por eso $\Delta T$ solo aparece en el
              desplazamiento.
    resolucion: |
      **Las fuerzas en las barras.** Con las fuerzas a tracción, la barra 1
      tira de B hacia G (arriba y a la izquierda, a 30°), la 2 tira de D hacia
      H (arriba y a la derecha) y la 3 tira de F hacia I (abajo). Equilibrio
      de ABDF, con A en el origen y B, D y F a $a$, $2a$ y $3a$:

      $$
      \begin{aligned}
      \textstyle\sum F_x &= -N_1\cos30° + N_2\cos30° = 0 &&\Rightarrow N_1 = N_2\\
      \textstyle\sum F_y &= \tfrac{1}{2}N_1 + \tfrac{1}{2}N_2 - N_3 - P = 0\\
      \textstyle\sum M_B &= Pa + \tfrac{1}{2}N_2\,a - 2a\,N_3 = 0
      \end{aligned}
      $$

      $$
      N_1 = N_2 = 2P,\qquad N_3 = 1P\qquad\text{(tracción)}
      $$

      Al ser isostática, $\Delta T$ no cambia estas fuerzas (tema 8, p. 4).

      **Los diagramas de ABDF.** Cargas sobre la barra: $P$ hacia abajo en A;
      en B, $\sqrt{3}P$ hacia la izquierda y $P$ hacia arriba; en D,
      $\sqrt{3}P$ hacia la derecha y $P$ hacia arriba; en F, $P$ hacia abajo.

      - $N$: 0 en AB, $\sqrt{3}P = 1{,}732P$ de tracción en BD y 0 en DF.
      - $T$ (suma de las fuerzas de la izquierda hacia arriba): $-P$ en AB,
        0 en BD y $+P$ en DF.
      - $M$: $-Px$ en AB, hasta $-Pa$ en B; constante, $-Pa$, en BD; y de
        $-Pa$ en D a 0 en F. Las fibras de arriba, estiradas.

      **El desplazamiento de A.** Se añade una fuerza $H$ horizontal, hacia
      la derecha, en A. Como no tiene momento respecto de ningún punto del
      eje de ABDF, solo cambia el equilibrio de fuerzas horizontales:
      $H - N_1\cos30° + N_2\cos30° = 0$, con las otras dos ecuaciones igual.
      Derivando respecto de $H$:

      $$
      N_1' = \frac{2}{3\sqrt{3}} = 0{,}3849,\qquad
      N_2' = -\frac{4}{3\sqrt{3}} = -0{,}7698,\qquad
      N_3' = -\frac{1}{3\sqrt{3}} = -0{,}1925
      $$

      Por Engesser-Castigliano, con la energía complementaria de las barras
      y el alargamiento térmico de la 2 (apuntes del tema 13, ecs. 13.14,
      13.24 y 13.25, págs. 8, 11 y 12), y $H = 0$ al final:

      $$
      \delta_A = \sum_i N_i'\left(\frac{N_iL_i}{EA} + \varepsilon_{0i}L_i\right),
      \qquad L_1 = L_2 = 2h,\ L_3 = h,\ \varepsilon_{02} = \alpha\Delta T
      $$

      $$
      \delta_A = \frac{Ph}{EA}\cdot\frac{8 - 16 - 1}{3\sqrt{3}} - \frac{8}{3\sqrt{3}}\,h\alpha\Delta T
      = -\sqrt{3}\,\frac{Ph}{EA} - \frac{8\sqrt{3}}{9}\,h\alpha\Delta T
      $$

      $$
      \delta_A = -1{,}7321\,\frac{Ph}{EA} -1{,}5396\,h\alpha\Delta T
      $$

      Negativo: A se mueve hacia la izquierda. No depende de $a$: la fuerza
      $H$ no da momento, y las barras no ven la longitud de ABDF. El motor
      del curso, que resuelve el sólido rígido colgado de las tres barras,
      da el mismo desplazamiento, también con otro valor de $a$.

  # ── Ejercicio 2 · la viga Gerber, por la viga conjugada (tema 10). Es el
  #    ejercicio 1 de la 2.ª parte del mismo día con una palabra menos.
  - id: exerm1617-ord-6-la-viga-gerber-por-la-viga-conjugada
    titulo: La viga Gerber con P en el voladizo y q0 en el tramo colgado, por la viga conjugada
    fuente: >-
      Ejercicio 2 · Examen final del 19 de enero de 2017 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1,5 puntos. La segunda parte del mismo día lo puso como ejercicio
      1, con «de de» donde aquí va «de» y sin la coma antes de «por
      separado»: allí se resuelve integrando la elástica tramo a tramo, y
      aquí, por la viga conjugada. El examen no publica resolución; el
      desarrollo es nuestro, con los temas 7 y 10, y las cifras salen del
      motor del curso y de un segundo camino.
    nivel: examen
    enunciado: |
      (1,5p) La viga de la figura está apoyada en B C y F y las partes ABCD y
      DF están unidas por una rótula en D. Determinar:

      a/ Diagramas de fuerzas cortantes y de momentos flectores que
      corresponden a la fuerza concentrada $P$ y a la fuerza distribuida
      $q_0$, por separado.

      b/ Relación entre $P$ y $q_0$ para que el desplazamiento vertical de la
      rótula D sea nulo.

