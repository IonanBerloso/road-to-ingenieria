      **Notas nuestras.** El PDF pierde la flecha de $P$ y la barra 3, que
      se leen en el Word del examen: $P$ es vertical, hacia abajo, en A, y la
      barra 3 baja vertical de F a I. G, H e I son articulaciones fijas, y
      las barras están articuladas a ABDF en B, D y F. Las dos cotas $h$ son
      la altura de G y H sobre la barra y la de la barra sobre I. El
      enunciado no da el coeficiente de dilatación $\alpha$: el resultado se
      deja con $\alpha\Delta T$. Se conserva «recomieda».
    pide: >-
      Las fuerzas en las barras 1, 2 y 3, los diagramas de N, T y M de la
      barra ABDF y el desplazamiento horizontal de A.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para el apartado b, ¿qué elementos aportan energía de deformación
          a Engesser-Castigliano?
        opciones:
          - texto: >-
              Solo las barras 1, 2 y 3, a axil; ABDF tiene esfuerzos, pero no
              se deforma
            correcta: true
            mensaje: |
              Eso es. «Rígida» quiere decir $EA$ y $EI$ tan grandes que la
              deformación es nula: sus N, T y M son los de la estática, pero
              su energía, $\int N^2/2EA + \int M^2/2EI$, es cero. El
              desplazamiento sale de las tres barras (ecs. 13.24 y 13.25).
          - texto: >-
              Las tres barras y la flexión de ABDF, que tiene flectores de
              valor $Pa$
            mensaje: |
              Los flectores de ABDF existen, pero la energía de flexión es
              $\int M^2/(2EI)\,dx$, y en una barra rígida $EI \to \infty$: es
              nula. Sumarla supondría darle a ABDF una rigidez que el
              enunciado no da.
          - texto: >-
              Solo la barra 2, que es la que se calienta
            mensaje: |
              La temperatura añade un término a la barra 2, pero $P$ carga
              las tres barras, y las tres se alargan: las tres entran, con su
              $N_i' = \partial N_i/\partial H$.
          - texto: >-
              Las tres barras y el axil del tramo BD de ABDF
            mensaje: |
              El axil de BD existe, pero ABDF no se alarga: $EA \to \infty$ y
              su energía de axil es nula.
      - tipo: calcular
        titulo: La fuerza en la barra 1
        pregunta: |
          ¿Cuánto vale $N_1$, en unidades de $P$, positiva a tracción?
        respuesta:
          tipo: numero
          valor: '2.000'
          tolerancia: 0.005
          formato: un número, en unidades de P
        distractores:
          - valor: '1'
            mensaje: |
              Has igualado la fuerza de la barra a su componente vertical. Las
              barras 1 y 2 están a 30° de la horizontal: suben
              $N\sin30° = N/2$.
          - valor: '1.1547'
            mensaje: |
              Has tomado la componente vertical con el coseno. El ángulo de
              30° es con la horizontal: la vertical es $N\sin30°$.
        pista: |
          Horizontales: $N_1 = N_2$. Verticales:
          $N_1\sin30° + N_2\sin30° = P + N_3$. Y momentos respecto de B.
        desarrollo: |
          Las componentes horizontales de las barras 1 y 2 son opuestas:
          $N_1 = N_2 = N$. Momentos respecto de B (A está a $a$ a la
          izquierda, D a $a$ y F a $2a$ a la derecha):

          $$
          Pa + \tfrac{1}{2}N\,a - 2a\,N_3 = 0
          $$

          Y verticales: $N - N_3 = P$. De las dos, $N_3 = P$ y
          $N_1 = N_2 = 2P$.
      - tipo: calcular
        titulo: La fuerza en la barra 3
        pregunta: |
          ¿Y $N_3$, en unidades de $P$, positiva a tracción?
        respuesta:
          tipo: numero
          valor: '1.000'
          tolerancia: 0.005
          formato: un número, en unidades de P
        distractores:
          - valor: '-1'
            mensaje: |
              El módulo es ese, pero F está por encima de I: la barra 3 tira
              de F hacia abajo, y eso es tracción. Con las fuerzas tomadas a
              tracción, el equilibrio da $N_3 = +P$.
          - valor: '2'
            mensaje: |
              Esa es la de las barras inclinadas. La barra 3 recoge lo que
              suben las dos inclinadas, $2\cdot\tfrac{1}{2}\cdot2P = 2P$, menos
              la $P$ de A: $P$.
        pista: |
          Con $N_1 = N_2 = N$: $N - N_3 = P$ y $\tfrac{1}{2}N = 2N_3 - P$.
        desarrollo: |
          $$
          N_3 = 1P\quad\text{(tracción)}
          $$

          Comprobación con momentos respecto de D:
          $P\cdot2a - \tfrac{1}{2}N_1\,a - N_3\,a = 2Pa - Pa - Pa = 0$.
      - tipo: calcular
        titulo: El axil del tramo BD
        pregunta: |
          ¿Cuánto vale el axil de ABDF entre B y D, en unidades de $P$, positivo
          a tracción?
        respuesta:
          tipo: numero
          valor: '1.7321'
          tolerancia: 0.002
          formato: un número, en unidades de P
        distractores:
          - valor: '2'
            mensaje: |
              Es $N_1$ entera. En el eje de ABDF solo entra su componente
              horizontal, $N_1\cos30° = \sqrt{3}P$.
          - valor: '1'
            mensaje: |
              Es la componente vertical de la barra 1, $N_1\sin30°$, que da
              cortante. El axil de ABDF es la horizontal.
          - valor: '0'
            mensaje: |
              Las barras 1 y 2 tiran de B hacia la izquierda y de D hacia la
              derecha, con $\sqrt{3}P$ cada una: el tramo entre B y D está
              estirado. Que ABDF sea rígida no lo descarga.
        pista: |
          Corta entre B y D y mira lo que queda a la izquierda: $P$ en A y la
          barra 1 en B.
        desarrollo: |
          A la izquierda del corte, la única fuerza horizontal es la de la
          barra 1, que tira de B hacia G, a la izquierda:
          $N_1\cos30° = 2P\cdot\tfrac{\sqrt{3}}{2}$. El axil es

          $$
          N_{BD} = \sqrt{3}\,P = 1{,}7321P\quad\text{(tracción)}
          $$

          En AB y en DF no hay fuerzas horizontales: $N = 0$.
      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de N, T y M** de la barra ABDF, uno debajo
          de otro, con sus valores en A, B, D y F.
        comprueba:
          - punto: |
              **N**: cero en AB y en DF, y $\sqrt{3}P$ de tracción entre B y D.
            porque: |
              Solo las barras 1 y 2 tienen componente según el eje de ABDF, y
              se aplican en B y en D.
          - punto: |
              **T**: $-P$ de A a B, cero de B a D y $+P$ de D a F, con la
              cortante como suma de las fuerzas de la izquierda hacia arriba.
            porque: |
              Cada carga vertical es un salto: $P$ hacia abajo en A, $P$ hacia
              arriba en B y en D (las verticales de las barras 1 y 2) y $P$
              hacia abajo en F (la barra 3).
          - punto: |
              **M**: recta de 0 en A a $-Pa$ en B, constante $-Pa$ entre B y
              D, y recta de vuelta a 0 en F.
            porque: |
              $dM/dx = T$ (ec. 7.15): pendiente $-P$, cero y $+P$. Es negativo:
              ABDF trabaja como una ménsula cargada en el extremo, con las
              fibras de arriba estiradas.
        figura: |
          <svg viewBox="0 0 420 290" role="img" width="420" height="290" aria-labelledby="exerm1617-ord-5-la-barra-rigida-abdf-colgada-de-tres-barras-dib-t exerm1617-ord-5-la-barra-rigida-abdf-colgada-de-tres-barras-dib-d">
          <title id="exerm1617-ord-5-la-barra-rigida-abdf-colgada-de-tres-barras-dib-t">Los diagramas de N, T y M de la barra ABDF</title>
