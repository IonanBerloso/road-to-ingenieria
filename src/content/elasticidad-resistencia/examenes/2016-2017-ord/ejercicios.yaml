      **Notas nuestras.** Los dos dibujos pequeños de la figura, una rebanada
      con sus dos flechas y el signo, son el convenio de signos de la
      cortante: positiva con la flecha de la cara izquierda hacia arriba y la
      de la derecha hacia abajo. La viga mide 6 m, la suma de las tres cotas.
    pide: >-
      Las cargas y las reacciones de la viga, deducidas del diagrama de
      cortantes, y su diagrama de flectores.
    pasos:
      - tipo: reconocer
        pregunta: |
          Entre 3 y 4,5 m la cortante es nula. ¿Qué dice eso del flector en ese
          tramo?
        opciones:
          - texto: >-
              Que es constante, y como la cortante pasa de positiva a negativa
              a sus lados, es el flector máximo de la viga
            correcta: true
            mensaje: |
              Eso es. $dM/dx = T$ (ec. 7.15, p. 12): con $T = 0$ el flector no
              cambia, y donde $T$ se anula $M$ tiene tangente horizontal
              (p. 13). A la izquierda $T > 0$ y $M$ crece; a la derecha
              $T < 0$ y $M$ decrece: la meseta es el máximo.
          - texto: >-
              Que también es nulo, como la cortante
            mensaje: |
              El flector es la integral de la cortante, no la cortante: en ese
              tramo vale lo acumulado hasta x = 3 m, el área del triángulo de
              $T$, que no es cero.
          - texto: >-
              Que en ese tramo actúa un par
            mensaje: |
              Un par concentrado produce un salto en el diagrama de flectores,
              no en el de cortantes (p. 13), y además el enunciado dice que no
              hay pares. Que $T$ sea nula solo dice que no hay carga y que las
              fuerzas de la izquierda se equilibran.
          - texto: >-
              Que crece linealmente
            mensaje: |
              $M$ crece linealmente donde $T$ es constante **y no nula**. Con
              $T = 0$ la pendiente de $M$ es cero.
      - tipo: calcular
        titulo: La carga repartida
        pregunta: |
          ¿Cuánto vale la carga repartida de los tres primeros metros, en kN/m,
          positiva hacia abajo?
        respuesta:
          tipo: numero
          valor: '6.0'
          tolerancia: 0.05
          formato: un número, en kN/m
        distractores:
          - valor: '18'
            mensaje: |
              18 kN es la ordenada de $T$ en el apoyo, la reacción. La carga
              repartida es la **pendiente** del diagrama, $dT/dx = -q$
              (ec. 7.14): 18 kN en 3 m.
          - valor: '3'
            mensaje: |
              Has repartido los 18 kN en los 6 m de la viga. La pendiente de
              $T$ solo existe en los tres primeros metros; luego $T$ es
              constante a trozos.
          - valor: '12'
            mensaje: |
              Has tomado una carga triangular, con $T$ como su área. Una carga
              triangular daría un diagrama de $T$ parabólico; el de la figura
              es recto, y $q = -dT/dx$ es constante.
        pista: |
          $dT/dx = -q$ (ec. 7.14): la carga es menos la pendiente del diagrama.
        desarrollo: |
          $$
          q = -\frac{dT}{dx} = -\frac{0 - 18\ \text{kN}}{3\ \text{m}} = 6\ \text{kN/m}
          $$

          Positiva: hacia abajo, en los tres primeros metros.
      - tipo: calcular
        titulo: La fuerza concentrada
        pregunta: |
          ¿Cuánto vale la fuerza concentrada que actúa a 4,5 m, en kN, positiva
          hacia abajo?
        respuesta:
          tipo: numero
          valor: '18.0'
          tolerancia: 0.05
          formato: un número, en kN
        distractores:
          - valor: '36'
            mensaje: |
              Has tomado la diferencia entre las dos ordenadas extremas, 18 y
              −18. En x = 4,5 m la cortante salta de 0 a −18 kN: la fuerza es
              el salto, 18 kN.
          - valor: '-18'
            mensaje: |
              El módulo es ese, pero con el convenio de la figura la cortante
              es la suma de las fuerzas de la izquierda hacia arriba: si baja
              18 kN al pasar por x = 4,5 m, la fuerza va hacia abajo.
        pista: |
          Una fuerza concentrada es un salto en el diagrama de cortantes (p. 13).
        desarrollo: |
          En x = 4,5 m, $T$ pasa de 0 a −18 kN: una fuerza de
          $18$ kN hacia abajo. Del mismo modo, los saltos de los
          extremos son las reacciones: 18 kN hacia arriba en x = 0 (de 0 a 18)
          y 18 kN hacia arriba en x = 6 m (de −18 a 0). Cargas,
          $6\cdot3 + 18 = 36$ kN; reacciones, $18 + 18 = 36$ kN.
      - tipo: calcular
        titulo: El flector máximo
        pregunta: |
          ¿Cuánto vale el flector máximo, en kN·m?
        respuesta:
          tipo: numero
          valor: '27.0'
          tolerancia: 0.05
          formato: un número, en kN·m
        distractores:
          - valor: '54'
            mensaje: |
              Has tomado el área bajo $T$ de 0 a 3 m como un rectángulo de
              18 × 3. Es un triángulo: la mitad.
          - valor: '81'
            mensaje: |
              Es $18\cdot4{,}5$: el momento de la reacción en x = 4,5 m sin la
              carga repartida. La repartida, 18 kN con su resultante a 1,5 m,
              resta 54 kN·m.
        pista: |
          $dM/dx = T$ (ec. 7.15): el flector en un punto es el área bajo $T$
          hasta él, con $M = 0$ en el apoyo.
        desarrollo: |
          $$
          M(3) = \tfrac{1}{2}\cdot18\ \text{kN}\cdot3\ \text{m} = 27\ \text{kN·m}
          $$

          y se mantiene hasta x = 4,5 m, donde $T = 0$. Después baja con
          pendiente −18 kN: $27 - 18\cdot1{,}5 = 0$ en el apoyo derecho, como
          tiene que ser.
      - tipo: dibujar
        consigna: |
          En papel: **la viga con sus cargas** y, debajo, **el diagrama de
          flectores**, con sus valores en 0; 1,5; 3; 4,5 y 6 m.
        comprueba:
          - punto: |
              **Las cargas**: reacciones de 18 kN hacia arriba en los dos
              apoyos, 6 kN/m hacia abajo en los tres primeros metros y 18 kN
              hacia abajo a 4,5 m.
            porque: |
              Son los saltos y la pendiente del diagrama de cortantes
              (ec. 7.14 y la tabla de la p. 13).
          - punto: |
              **De 0 a 3 m**, una parábola de 0 a 27 kN·m, que llega a 3 m con
              tangente horizontal; a 1,5 m vale 20,25 kN·m.
            porque: |
              Bajo carga uniforme $T$ es lineal y $M$ parabólico; donde $T = 0$
              la tangente de $M$ es horizontal.
          - punto: |
              **De 3 a 4,5 m**, constante, 27 kN·m; **de 4,5 a 6 m**, una recta
              de 27 a 0.
            porque: |
              Con $T = 0$, $M$ no cambia; con $T = -18$ kN, baja 18 kN·m por
              metro hasta el apoyo, donde es nulo.
        figura: |
          <svg viewBox="0 0 420 250" role="img" width="420" height="250" aria-labelledby="exerm1617-ord-3-la-viga-que-se-deduce-del-diagrama-de-cortantes-dib-t exerm1617-ord-3-la-viga-que-se-deduce-del-diagrama-de-cortantes-dib-d">
          <title id="exerm1617-ord-3-la-viga-que-se-deduce-del-diagrama-de-cortantes-dib-t">La viga con sus cargas y el diagrama de flectores</title>
          <desc id="exerm1617-ord-3-la-viga-que-se-deduce-del-diagrama-de-cortantes-dib-d">Arriba, la viga de 6 m, con un apoyo fijo a la izquierda y un apoyo móvil a la derecha, rotulados con una reacción de 18 kN cada uno. Sobre los tres primeros metros, una carga repartida uniforme de 6 kN/m hacia abajo; a 4,5 m, una fuerza de 18 kN hacia abajo. Debajo, alineado con la viga, el diagrama de flectores M, positivo hacia arriba: una parábola que sale de cero y llega a 27 kN·m a los 3 m con tangente horizontal; una meseta de 27 kN·m hasta los 4,5 m; y una recta que baja hasta cero a los 6 m.</desc>
          <rect x="70" y="72" width="300" height="8" fill="var(--faint)" fill-opacity=".45" stroke="var(--ink)" stroke-width="1.2"/>
