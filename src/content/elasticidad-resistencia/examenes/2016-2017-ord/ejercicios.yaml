ejercicios:
  # ── Teoría · cuestión 1 · la tracción simple vista en un plano inclinado (tema 2).
  - id: exerm1617-ord-1-la-traccion-simple-vista-en-un-plano-inclinado
    titulo: La tracción simple vista en un plano inclinado, y de vuelta a la tensión axial
    fuente: >-
      Cuestión 1 de teoría · Examen final del 19 de enero de 2017 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 2, apartado 2.5
      (págs. 21 a 23), y las cifras salen del motor del curso y de un segundo
      camino.
    nivel: examen
    enunciado: |
      (1p) Una pieza prismática está sometida a una fuerza axial en la
      dirección $x$ que produce una tensión de tracción $\sigma_{x'}$ = 81 MPa
      y una tensión tangencial $\tau_{x'y'}$ = −27 MPa sobre un plano inclinado
      definido por el ángulo $\theta$. Determinar

      a/ La tensión axial aplicada, $\sigma_x$.

      b/ El ángulo $\theta$ que corresponde al estado de tensiones dado.

      c/ Las tensiones $\sigma_{x'}$, $\sigma_{y'}$ y $\tau_{x'y'}$ que
      corresponden al elemento de tensión cuando $\theta$ = 30º.

      <figure class="figura-examen">
      <svg viewBox="0 0 470 240" role="img" width="470" height="240" aria-labelledby="exerm1617-ord-1-la-traccion-simple-vista-en-un-plano-inclinado-fig-t exerm1617-ord-1-la-traccion-simple-vista-en-un-plano-inclinado-fig-d">
      <title id="exerm1617-ord-1-la-traccion-simple-vista-en-un-plano-inclinado-fig-t">El elemento girado con las tensiones del plano inclinado, y los ejes</title>
      <desc id="exerm1617-ord-1-la-traccion-simple-vista-en-un-plano-inclinado-fig-d">A la izquierda, un elemento cuadrado girado, con sus caras perpendiculares a los ejes x′ e y′. De cada cara sale hacia fuera una flecha normal; la de la cara de normal x′, la de arriba a la derecha, está rotulada 81 MPa. A lo largo de cada cara hay además una flecha tangencial: la de la cara de normal x′ apunta hacia abajo y a la derecha, en el sentido de menos y′, y está rotulada 27 MPa; la de la cara opuesta apunta al revés, y las de las otras dos caras forman el par recíproco, la de la cara de normal y′ en el sentido de menos x′. A la derecha, los ejes x, horizontal, e y, vertical, punteados, y los ejes x′ e y′, girados respecto de ellos un ángulo θ en sentido antihorario, con el arco θ de x a x′.</desc>
