      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Los saltos de $T$ en los extremos son las reacciones: 18 kN hacia
              arriba en cada apoyo.
          - texto: >-
              La pendiente de $T$ entre 0 y 3 m es la carga:
              $q = -dT/dx$ = 6 kN/m hacia abajo.
          - texto: >-
              El salto de 0 a −18 kN en x = 4,5 m es una fuerza de 18 kN hacia
              abajo.
          - texto: >-
              El flector es el área acumulada bajo $T$: 27 kN·m de 3 a 4,5 m,
              y cero en los dos apoyos.
          - texto: >-
              El salto de $T$ en x = 4,5 m podría ser también un par aplicado.
            trampa: true
            mensaje: |
              Un par concentrado no cambia la cortante: produce un salto en el
              diagrama de flectores (p. 13). Un salto de $T$ es siempre una
              fuerza concentrada, y además el enunciado excluye los pares.
    resolucion: |
      **Las relaciones.** Sin pares repartidos, la cortante y el flector
      cumplen $dT/dx = -q$ y $dM/dx = T$ (apuntes del tema 7, ecs. 7.14 y
      7.15, p. 12), y en el diagrama de cortantes una fuerza concentrada es un
      salto (p. 13). Con el convenio de la figura, $T$ es la suma de las
      fuerzas de la izquierda hacia arriba.

      **Las fuerzas.**
      - En x = 0, $T$ salta de 0 a 18 kN: la reacción del apoyo izquierdo,
        18 kN hacia arriba.
      - De 0 a 3 m, $T$ baja en recta de 18 a 0: una carga uniforme
        $q = 18/3 = 6$ kN/m hacia abajo.
      - En x = 4,5 m, $T$ salta de 0 a −18 kN: una fuerza de $18$ kN
        hacia abajo.
      - En x = 6 m, $T$ salta de −18 a 0: la reacción del apoyo derecho,
        18 kN hacia arriba.

      Equilibrio: cargas $6\cdot3 + 18 = 36$ kN, reacciones
      $18 + 18 = 36$ kN; momentos respecto del apoyo izquierdo,
      $18\cdot1{,}5 + 18\cdot4{,}5 = 108 = 18\cdot6$ kN·m.

      **Los flectores.** Integrando $T$ desde el apoyo izquierdo, donde
      $M = 0$:

      $$
      M(x) =
      \begin{cases}
      18x - 3x^2 & 0 \le x \le 3\ \text{m}\\
      27 & 3 \le x \le 4{,}5\ \text{m}\\
      27 - 18(x - 4{,}5) & 4{,}5 \le x \le 6\ \text{m}
      \end{cases}
      \qquad\text{(kN·m)}
      $$

      Parábola de 0 a 27 kN·m, con tangente horizontal en x = 3 m y
      $M(1{,}5) = 20{,}25$ kN·m; meseta de 27 kN·m, que es el máximo; y
      recta de vuelta a 0 en el apoyo derecho. El motor del curso, con esa
      viga y esas cargas, devuelve el mismo diagrama de cortantes y estos
      flectores.
  # ── Ejercicio 1 · la barra rígida ABDF colgada de tres barras (tema 8, con el 13).
  - id: exerm1617-ord-5-la-barra-rigida-abdf-colgada-de-tres-barras
    titulo: La barra rígida ABDF colgada de tres barras, con una de ellas calentada
    fuente: >-
      Ejercicio 1 · Examen final del 19 de enero de 2017 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1,5 puntos. El examen no publica resolución; el desarrollo es
      nuestro, con los temas 8 y 13, y las cifras salen del motor del curso y
      de un segundo camino.
    nivel: examen
    enunciado: |
      (1,5p) En la estructura isostática de la figura, la barra ABDF es
      rígida. Las barras 1, 2 y 3 son del mismo módulo y sección transversal
      $E$ y $A$, respectivamente. La barra 2 sufre una variación de
      temperatura $\Delta T$. Determinar:

      a/ Las fuerzas en las barras 1, 2 y 3 y el diagrama de fuerzas
      normales, de fuerzas cortantes y de momentos flectores de la barra
      ABDF.

      b/ Desplazamiento horizontal de la sección A. Se recomieda utilizar el
      teorema de Engesser – Castigliano.

