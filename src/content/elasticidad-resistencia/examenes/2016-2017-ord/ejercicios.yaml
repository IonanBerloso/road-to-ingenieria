      **Notas nuestras.** El PDF de este examen pierde las flechas de $P$ y
      de $q_0$, que se leen en el Word y en la figura de la segunda parte:
      $P$, hacia arriba en A; $q_0$, hacia abajo en todo DF. B es un apoyo
      fijo, y C y F, apoyos móviles. El enunciado no da la rigidez: se toma
      $EI$ constante en toda la viga.
    pide: >-
      Los diagramas de cortantes y de flectores con P sola y con q0 sola, y
      la relación entre P y q0 que deja la rótula D sin desplazamiento
      vertical.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para el apartado b se usa la viga conjugada. ¿En qué se convierte la
          rótula D?
        opciones:
          - texto: >-
              En un apoyo intermedio
            correcta: true
            mensaje: |
              Eso es (fig. 10.9, p. 13). En la rótula real la flecha no es
              nula y el giro salta: en la conjugada, $M^* \neq 0$ y $T^*$
              salta, que es lo que pasa en un apoyo intermedio. Al revés, los
              apoyos intermedios B y C pasan a rótulas.
          - texto: >-
              En una rótula, como en la viga real
            mensaje: |
              En una rótula de la conjugada $M^* = 0$, y $M^*$ es la flecha
              real: obligaría a que D no bajara, que es justo lo que hay que
              buscar. La rótula real tiene flecha y salto de giro: en la
              conjugada, apoyo intermedio.
          - texto: >-
              En un empotramiento
            mensaje: |
              El empotramiento de la conjugada es el borde libre de la real:
              A. En D la viga sigue apoyada a los dos lados (por C y por F), y
              lo que la conjugada necesita es una reacción, no un par.
          - texto: >-
              En nada: la conjugada es continua en D
            mensaje: |
              El giro real salta en la rótula, y en la conjugada eso es un
              salto de $T^*$: hace falta una fuerza concentrada, la reacción de
              un apoyo.
      - tipo: calcular
        titulo: El flector en C con q0 sola
        pregunta: |
          Apartado a, con $q_0$ sola. ¿Cuánto vale el flector en C, en unidades
          de $q_0L^2$?
        respuesta:
          tipo: numero
          valor: '-1.000'
          tolerancia: 0.005
          formato: un número, en unidades de q0·L²
        distractores:
          - valor: '-2'
            mensaje: |
              Has llevado a D toda la carga de DF, $2q_0L$. DF es una viga
              biapoyada entre la rótula y F: a D le pasa la mitad, $q_0L$.
          - valor: '1'
            mensaje: |
              El módulo es ese. La fuerza $q_0L$ hacia abajo en el extremo D
              del voladizo CD estira las fibras de arriba: el flector es
              negativo.
        pista: |
          Empieza por DF: biapoyada, con $R_D = R_F = q_0L$. La fuerza $q_0L$
          baja por la rótula al voladizo CD.
        desarrollo: |
          $$
          M_C = -q_0L\cdot L = -1\,q_0L^2
          $$
      - tipo: calcular
        titulo: El giro en C con q0 sola
        pregunta: |
          En la conjugada, el tramo BC queda entre dos rótulas y transmite a C
          una fuerza que es el giro real $\theta_C$. Con $q_0$ sola, ¿cuánto
          vale $\theta_C$, en unidades de $q_0L^3/EI$, positivo en sentido
          horario?
        respuesta:
          tipo: numero
          valor: '0.3333'
          tolerancia: 0.002
          formato: un número, en unidades de q0·L³/EI
        distractores:
          - valor: '0.1667'
            mensaje: |
              Es la parte que el tramo BC pasa a B. El triángulo de $q^*$ en
              BC vale 0 en B y $-q_0L^2/EI$ en C: su resultante está a
              $\tfrac{2}{3}L$ de B, y a C le toca $\tfrac{2}{3}$ de ella, no
              $\tfrac{1}{3}$.
          - valor: '-0.3333'
            mensaje: |
              El módulo es ese. El voladizo CD baja con la fuerza de la
              rótula, y la viga sale de C bajando hacia D: el giro es horario,
              positivo con $v$ hacia abajo.
        pista: |
          $q^* = M/EI$ en BC es un triángulo de área $-\tfrac{1}{2}q_0L^3/EI$,
          con la resultante a $\tfrac{2}{3}L$ de B.
        desarrollo: |
          El tramo BC de la conjugada, entre las rótulas B y C, se reparte su
          carga como una viga biapoyada. A C le pasa

          $$
          \tfrac{1}{2}\,\frac{q_0L^3}{EI}\cdot\tfrac{2}{3} = 0{,}3333\,\frac{q_0L^3}{EI}
          $$

          que es $\theta_C$, horario.
      - tipo: calcular
        titulo: El desplazamiento de D con q0 sola
        pregunta: |
          ¿Cuánto baja D con $q_0$ sola, en unidades de $q_0L^4/EI$?
        respuesta:
          tipo: numero
          valor: '0.6667'
          tolerancia: 0.002
          formato: un número, en unidades de q0·L⁴/EI
        distractores:
          - valor: '0.3333'
            mensaje: |
              Es solo el voladizo CD con la fuerza $q_0L$ en la punta,
              $q_0L\cdot L^3/(3EI)$, como si estuviera empotrado en C. C gira
              $\theta_C$, y eso añade $\theta_C L$.
          - valor: '0.5000'
            mensaje: |
              Has tomado $\theta_C = \tfrac{1}{6}$, la parte del triángulo que
              va a B. A C le toca la de $\tfrac{2}{3}$: $\theta_C = \tfrac{1}{3}$.
          - valor: '1.3333'
            mensaje: |
              Es el doble: has llevado a D toda la carga de DF, $2q_0L$. DF,
              biapoyada, pasa a la rótula la mitad.
        pista: |
          $v_D$ es el $M^*$ de la conjugada en D: el momento de lo que hay a
          la izquierda de D en el tramo CD, la fuerza $\theta_C$ en C y el
          triángulo de $q^*$ entre C y D.
        desarrollo: |
          El triángulo de $q^*$ en CD, de $-q_0L^2/EI$ en C a 0 en D, tiene
          área $\tfrac{1}{2}q_0L^3/EI$ y su resultante a $\tfrac{2}{3}L$ de D:

          $$
          v_D = \theta_C\,L + \tfrac{1}{2}\cdot\tfrac{2}{3}\,\frac{q_0L^4}{EI}
          = \left(\tfrac{1}{3} + \tfrac{1}{3}\right)\frac{q_0L^4}{EI} = 0{,}6667\,\frac{q_0L^4}{EI}
          $$

          hacia abajo.
      - tipo: calcular
        titulo: El desplazamiento de D con P sola
        pregunta: |
          Con $P$ sola, ¿cuánto vale $v_D$, en unidades de $PL^3/EI$, positivo
          hacia abajo?
        respuesta:
          tipo: numero
          valor: '-0.1667'
          tolerancia: 0.002
          formato: un número, en unidades de P·L³/EI
        distractores:
          - valor: '0.1667'
            mensaje: |
              El módulo es ese. $P$ hacia arriba en A levanta el voladizo AB, y
              la viga gira alrededor de B: BC se curva hacia abajo y C sale
              girando hacia arriba. D sube.
          - valor: '-0.3333'
            mensaje: |
              Has pasado a C dos tercios de la resultante del triángulo de BC.
              Con $P$, el triángulo es máximo en B y su resultante está a
              $\tfrac{1}{3}L$ de B: a C le llega un tercio, $\tfrac{1}{6}$.
        pista: |
          Con $P$ sola, $M$ es nulo en CD: D sube lo que gira C por $L$.
          $q^*$ en BC es un triángulo de $PL/EI$ en B a 0 en C.
        desarrollo: |
          El triángulo de $q^*$ en BC tiene área $\tfrac{1}{2}PL^2/EI$ y su
          resultante a $\tfrac{1}{3}L$ de B: a C le pasa
          $\tfrac{1}{2}\cdot\tfrac{1}{3} = \tfrac{1}{6}$, hacia abajo, porque
          $q^*$ es positiva. El cortante conjugado a la derecha de C es menos
          eso, y es el giro (tabla de la p. 12):

          $$
          \theta_C = -\tfrac{1}{6}\,\frac{PL^2}{EI},\qquad
          v_D = \theta_C\,L = -0{,}1667\,\frac{PL^3}{EI}
          $$
      - tipo: calcular
        titulo: La relación entre P y q0
        pregunta: |
          Apartado b. ¿Cuánto tiene que valer $P/(q_0L)$ para que D no se
          desplace?
        respuesta:
          tipo: numero
          valor: '4.00'
          tolerancia: 0.02
          formato: un número
        distractores:
          - valor: '2'
            mensaje: |
              Has quitado el giro de C en el caso de $q_0$: solo el voladizo,
              $\tfrac{1}{3}q_0L^4/EI$. C gira con la carga de D, y eso
              duplica la flecha.
          - valor: '8'
            mensaje: |
              Has cargado D con $2q_0L$. La rótula solo recibe la reacción de
              DF, $q_0L$.
          - valor: '3'
            mensaje: |
              Has tomado $\theta_C = \tfrac{1}{6}q_0L^3/EI$ en el caso de
              $q_0$, la parte del triángulo de BC que va a B.
        pista: |
          Suma las dos flechas de D e iguala a cero.
        desarrollo: |
          $$
          -\tfrac{1}{6}\,\frac{PL^3}{EI} + \tfrac{2}{3}\,\frac{q_0L^4}{EI} = 0
          \quad\Rightarrow\quad P = 4\,q_0L
          $$
      - tipo: dibujar
        consigna: |
          En papel: **la viga conjugada** con sus enlaces y la carga
          $q^* = M/EI$ con $q_0$ sola, con sus valores en B, C, D y en el
          centro de DF.
        comprueba:
          - punto: |
              **Enlaces**: empotramiento en A, rótulas en B y en C, apoyo
              intermedio en D y apoyo simple en F.
            porque: |
              Fig. 10.9: el borde libre pasa a empotramiento, los apoyos
              intermedios a rótulas, la rótula a apoyo intermedio y el apoyo
              extremo sigue igual.
          - punto: |
              **$q^*$**: nula en AB; un triángulo de 0 en B a
              $-q_0L^2/EI$ en C y otro de vuelta a 0 en D, los dos hacia
              arriba; en DF, una parábola hacia abajo con
              $\tfrac{1}{2}q_0L^2/EI$ en el centro.
            porque: |
              Es el diagrama de flectores dividido por $EI$, con $q^*$ hacia
              abajo donde $M > 0$.
          - punto: |
              **Isostática**: CDF se apoya en D y F; BC cuelga entre las
              rótulas; AB es una ménsula desde A.
            porque: |
              Por eso se resuelve de fuera adentro: BC pasa sus reacciones a C
              y a B, y en D el momento $M^*$ de lo que queda a la izquierda es
              la flecha.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              DF es biapoyada: $R_D = R_F = q_0L$, y $q_0L$ baja por la rótula
              al voladizo CD.
          - texto: >-
              Con $P$ sola, $M$ va de 0 en A a $PL$ en B y a 0 en C; con $q_0$
              sola, de 0 en B a $-q_0L^2$ en C y a 0 en D, con la parábola de
              DF.
          - texto: >-
              En la conjugada, el tramo BC pasa a C la fuerza $\theta_C$, y
              en D el momento $M^*$ es la flecha.
          - texto: >-
              $v_D = -\tfrac{1}{6}PL^3/EI + \tfrac{2}{3}q_0L^4/EI = 0$ da
              $P = 4q_0L$.
          - texto: >-
              En la conjugada, el extremo libre A pasa a apoyo simple.
            trampa: true
            mensaje: |
              En el extremo libre real hay flecha y giro, $v \neq 0$ y
              $\theta \neq 0$: en la conjugada, $M^* \neq 0$ y $T^* \neq 0$,
              que es un empotramiento (fig. 10.9).
    resolucion: |
      **Las reacciones.** La rótula D separa la viga en DF, biapoyada, y
      ABCD, que recibe en D la reacción de DF. Con $P$ hacia arriba en A y
      $q_0$ hacia abajo en DF, y las reacciones positivas hacia arriba:

      - $q_0$ sola: $R_D = R_F = q_0L$; en ABCD, la fuerza $q_0L$ hacia abajo
        en D, y $R_B = -q_0L$, $R_C = 2q_0L$.
      - $P$ sola: DF no trabaja; $R_B = -2P$ y $R_C = P$.

      **a/ Los diagramas** (cortante, suma de las fuerzas de la izquierda
      hacia arriba; flector, positivo con las fibras de abajo estiradas;
      apuntes del tema 7, ecs. 7.14 y 7.15):

      - $P$ sola: $T = P$ en AB, $-P$ en BC y 0 en CD y DF. $M$ sube en recta
        de 0 en A a $PL$ en B, baja a 0 en C y es nulo en CD y DF.
      - $q_0$ sola: $T = 0$ en AB, $-q_0L$ en BC, $q_0L$ en CD, y en DF una
        recta de $q_0L$ a $-q_0L$ que se anula en el centro. $M = 0$ en AB,
        recta de 0 a $-q_0L^2$ en C, recta de vuelta a 0 en D, y en DF la
        parábola $M = \tfrac{1}{2}q_0s(2L - s)$, con $s$ desde D y máximo
        $\tfrac{1}{2}q_0L^2$ en el centro.

      Son los diagramas del ejercicio 1 de la segunda parte del mismo día.

      **b/ La viga conjugada.** Con $q^* = M/EI$ (apuntes del tema 10,
      apartado 10.5, págs. 11 a 13), los cortantes conjugados son los giros
      y los momentos conjugados son las flechas. Los enlaces cambian según la
      fig. 10.9: A, borde libre, pasa a empotramiento; B y C, apoyos
      intermedios, a rótulas; D, rótula, a apoyo intermedio; F sigue apoyado.
      La conjugada es isostática: CDF descansa en D y F, BC cuelga entre las
      rótulas B y C, y AB es una ménsula desde A.

      En D, la flecha es el $M^*$ del voladizo CD de la conjugada: la fuerza
      que BC le pasa en C, que es $\theta_C$, por $L$, más el momento de la
      carga $q^*$ de CD.

      - **$q_0$ sola.** En BC, $q^*$ es un triángulo de 0 en B a
        $-q_0L^2/EI$ en C, con su resultante a $\tfrac{2}{3}L$ de B: a C le
        pasa $\tfrac{1}{2}\cdot\tfrac{2}{3} = \tfrac{1}{3}$, y
        $\theta_C = 0{,}3333\,q_0L^3/EI$, horario. En CD, el triángulo
        de $-q_0L^2/EI$ a 0 tiene su resultante a $\tfrac{2}{3}L$ de D:
        $\tfrac{1}{2}\cdot\tfrac{2}{3} = \tfrac{1}{3}$. Juntos:

        $$
        v_D^{q_0} = \left(\tfrac{1}{3} + \tfrac{1}{3}\right)\frac{q_0L^4}{EI} = 0{,}6667\,\frac{q_0L^4}{EI}\quad\text{(hacia abajo)}
        $$

      - **$P$ sola.** En BC, $q^*$ es un triángulo de $PL/EI$ en B a 0 en C,
        con su resultante a $\tfrac{1}{3}L$ de B: a C le pasa
        $\tfrac{1}{2}\cdot\tfrac{1}{3} = \tfrac{1}{6}$, y
        $\theta_C = -0{,}1667\,PL^2/EI$. En CD no hay carga conjugada:

        $$
        v_D^{P} = \theta_C\,L = -0{,}1667\,\frac{PL^3}{EI}\quad\text{(hacia arriba)}
        $$

      **La relación.** $v_D = 0$:

      $$
      -\tfrac{1}{6}\,\frac{PL^3}{EI} + \tfrac{2}{3}\,\frac{q_0L^4}{EI} = 0
      \quad\Rightarrow\quad P = 4\,q_0L
      $$

      El primer teorema de Mohr en BC da el mismo $\theta_C$, y el motor del
      curso, integrando la elástica con la rótula, las mismas flechas.
