      <text x="430" y="197" font-size="15" fill="var(--ink)" font-style="italic">x</text>
      <text x="337" y="104" font-size="15" fill="var(--ink)" font-style="italic">y</text>
      <text x="415.9" y="136.6" font-size="15" fill="var(--ink)" font-style="italic">x′</text>
      <text x="268.6" y="112.1" font-size="15" fill="var(--ink)" font-style="italic" text-anchor="end">y′</text>
      <path d="M382 192 A52 52 0 0 0 372.6 162.2" fill="none" stroke="var(--ink)" stroke-width="1"/><polygon points="372.6,162.2 378,165.7 374.1,168.5" fill="var(--ink)"/>
      <text x="393" y="178.8" font-size="15" fill="var(--ink)" font-style="italic">θ</text>
      </svg>
      <figcaption>

      Redibujada del enunciado.

      </figcaption>
      </figure>

      **Notas nuestras.** En la figura, el elemento tiene las caras normales a
      $x'$ y a $y'$, y la tangencial de 27 MPa de la cara de normal $x'$
      apunta en el sentido de $-y'$: es el signo menos del enunciado. El
      ángulo que se ve dibujado entre $x$ y $x'$ es solo el rótulo de
      $\theta$, no su valor. El enunciado escribe «-27» con guion; aquí, con
      el signo menos.
    pide: >-
      La tensión axial σx que produce esas tensiones en el plano inclinado,
      el ángulo θ de ese plano y las tensiones del elemento girado 30°.
    pasos:
      - tipo: reconocer
        pregunta: |
          La pieza está a tracción simple según $x$: $\sigma_y = \tau_{xy} = 0$.
          En la cara de normal $x'$, girada $\theta$ desde $x$ en sentido
          antihorario, ¿qué dejan de las fórmulas del plano inclinado?
        opciones:
          - texto: >-
              $\sigma_{x'} = \sigma_x\cos^2\theta$ y
              $\tau_{x'y'} = -\sigma_x\sin\theta\cos\theta$
            correcta: true
            mensaje: |
              Eso es. Con $\sigma_y = \tau_{xy} = 0$, la ec. 2.59 (p. 22) se
              queda con los términos de $\sigma_x$:
              $\sigma_n = \sigma_x\cos^2\theta$ y
              $\tau_n = -\sigma_x\sin\theta\cos\theta$. El signo menos sale de
              proyectar sobre $\hat t = (-\sin\theta, \cos\theta)$
              (ec. 2.57): para $\theta$ entre 0 y 90° la tangencial es
              negativa, como la del enunciado.
          - texto: >-
              $\sigma_{x'} = \sigma_x\cos\theta$ y
              $\tau_{x'y'} = -\sigma_x\sin\theta$
            mensaje: |
              Eso es descomponer la **fuerza**, no la tensión. La cara
              inclinada tiene más área que la sección recta, $A/\cos\theta$, y
              al dividir aparece el segundo $\cos\theta$: las tensiones van con
              $\cos^2\theta$ y con $\sin\theta\cos\theta$ (ec. 2.59).
          - texto: >-
              $\sigma_{x'} = \sigma_x\cos^2\theta$ y
              $\tau_{x'y'} = +\sigma_x\sin\theta\cos\theta$
            mensaje: |
              La normal está bien; la tangencial lleva el signo cambiado. Con
              el $\hat t$ de la ec. 2.57, girado 90° antihorario desde
              $\hat n$, $\tau_n = -S_{nx}\sin\theta + S_{ny}\cos\theta$, y aquí
              $S_{nx} = \sigma_x\cos\theta$ y $S_{ny} = 0$.
          - texto: >-
              $\sigma_{x'} = \sigma_x\sin^2\theta$ y
              $\tau_{x'y'} = -\sigma_x\sin\theta\cos\theta$
            mensaje: |
              $\sigma_x\sin^2\theta$ es la normal de la otra cara, la de normal
              $y'$, que está a $\theta + 90°$. En la de normal $x'$, con
              $\theta = 0$ tiene que salir $\sigma_x$: es $\cos^2\theta$.
      - tipo: calcular
        titulo: El ángulo del plano
        pregunta: |
          Apartado b. ¿Cuánto vale $\theta$, en grados?
        respuesta:
          tipo: numero
          valor: '18.43'
          tolerancia: 0.05
          formato: un número, en grados
        distractores:
          - valor: '71.57'
            mensaje: |
              Has hecho $\tan\theta = \sigma_{x'}/|\tau_{x'y'}|$, la inversa.
              Dividiendo las dos fórmulas,
              $\tau_{x'y'}/\sigma_{x'} = -\sin\theta/\cos\theta = -\tan\theta$,
              y $\tan\theta = 27/81$.
          - valor: '-18.43'
            mensaje: |
              Con $\theta$ negativo, $-\sin\theta\cos\theta$ sería positivo, y
              la tangencial saldría +27 MPa. La del enunciado es negativa:
              $\tan\theta = -\tau_{x'y'}/\sigma_{x'} = +1/3$.
          - valor: '36.87'
            mensaje: |
              Ese es $2\theta$: el ángulo que se ve en el círculo de Mohr es el
              doble del de la pieza. En las fórmulas del ángulo simple,
              $\tan\theta = 1/3$.
        pista: |
          Divide una fórmula entre la otra:
          $\dfrac{\tau_{x'y'}}{\sigma_{x'}} = \dfrac{-\sigma_x\sin\theta\cos\theta}{\sigma_x\cos^2\theta} = -\tan\theta$.
        desarrollo: |
          $$
          \tan\theta = -\frac{\tau_{x'y'}}{\sigma_{x'}} = \frac{27}{81} = \frac{1}{3}
          \quad\Rightarrow\quad \theta = 18{,}43°
          $$
      - tipo: calcular
        titulo: La tensión axial
        pregunta: |
          Apartado a. ¿Cuánto vale $\sigma_x$, en MPa?
        respuesta:
          tipo: numero
          valor: '90.0'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '85.38'
            mensaje: |
              Es el módulo del vector tensión del plano,
              $\sqrt{81^2 + 27^2}$: la fuerza por unidad de área **de la cara
              inclinada**. $\sigma_x$ es la fuerza por unidad de área de la
              sección recta, que es menor: $|\mathbf S_n| = \sigma_x\cos\theta$.
          - valor: '81'
            mensaje: |
              81 MPa es la normal en el plano inclinado, no la tensión axial.
              Solo coincidirían con $\theta = 0$; aquí
              $\sigma_x = \sigma_{x'}/\cos^2\theta$.
        pista: |
          Con $\tan\theta = 1/3$, $\cos^2\theta = 1/(1 + \tan^2\theta)$.
        desarrollo: |
          $$
          \cos^2\theta = \frac{1}{1 + 1/9} = 0{,}9,\qquad
          \sigma_x = \frac{\sigma_{x'}}{\cos^2\theta} = \frac{81\ \text{MPa}}{0{,}9} = 90\ \text{MPa}
          $$

          Otra forma: $\sigma_x = \sigma_{x'} + \tau_{x'y'}^2/\sigma_{x'} = 81 + 9 = 90$ MPa.
      - tipo: calcular
        titulo: La normal del elemento girado 30°
        pregunta: |
          Apartado c. Con $\theta$ = 30°, ¿cuánto vale $\sigma_{x'}$, en MPa?
        respuesta:
          tipo: numero
          valor: '67.50'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '77.94'
            mensaje: |
              Has puesto $\cos\theta$ en lugar de $\cos^2\theta$: la fuerza
              descompuesta, sin contar que la cara girada tiene más área.
          - valor: '22.50'
            mensaje: |
              Ese es $\sigma_x\sin^2 30°$, la normal de la otra cara, la de
              normal $y'$: es $\sigma_{y'}$.
        pista: |
          $\sigma_{x'} = \sigma_x\cos^2\theta$, con el $\sigma_x$ del apartado a.
        desarrollo: |
          $$
          \sigma_{x'} = 90\cos^2 30° = 90\cdot\tfrac{3}{4} = 67{,}5\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La tangencial del elemento girado 30°
        pregunta: |
          ¿Y $\tau_{x'y'}$, con su signo, en MPa?
        respuesta:
          tipo: numero
          valor: '-38.97'
          tolerancia: 0.05
          formato: un número, en MPa (con su signo)
        distractores:
          - valor: '38.97'
            mensaje: |
              El módulo es ese, pero la tracción simple da, para $\theta$ entre
              0 y 90°, tangenciales negativas en la cara de normal $x'$: es el
              mismo signo que el de los −27 MPa del enunciado.
          - valor: '-77.94'
            mensaje: |
              Has tomado $\sigma_x\sin2\theta$. Con el ángulo doble,
              $\sin\theta\cos\theta = \tfrac{1}{2}\sin2\theta$ (ec. 2.60): falta
              dividir por 2.
        pista: |
          $\tau_{x'y'} = -\sigma_x\sin\theta\cos\theta = -\tfrac{1}{2}\sigma_x\sin2\theta$.
        desarrollo: |
          $$
          \tau_{x'y'} = -90\sin30°\cos30° = -\frac{45\sqrt{3}}{2} = -38{,}97\ \text{MPa}
          $$

          Y la tercera, la normal de la cara de normal $y'$:
          $\sigma_{y'} = 90\sin^2 30° = 22{,}5$ MPa. Las dos normales
          suman $\sigma_x$ = 90 MPa, como tiene que ser.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $\sigma_y = \tau_{xy} = 0$, en la cara de normal $x'$:
              $\sigma_{x'} = \sigma_x\cos^2\theta$ y
              $\tau_{x'y'} = -\sigma_x\sin\theta\cos\theta$.
          - texto: >-
              Dividiendo, $\tan\theta = 27/81 = 1/3$, y $\theta = 18{,}43°$.
          - texto: >-
              Con $\cos^2\theta = 0{,}9$,
              $\sigma_x = 81/0{,}9 = 90$ MPa.
          - texto: >-
              Con $\theta = 30°$: $\sigma_{x'} = 67{,}5$,
              $\sigma_{y'} = 22{,}5$ y $\tau_{x'y'} = -38{,}97$ MPa.
          - texto: >-
              $\sigma_{x'}$ es la componente normal de la fuerza axial,
              $N\cos\theta$, dividida por el área $A$ de la sección recta.
            trampa: true
            mensaje: |
              La componente normal de la fuerza se reparte sobre la cara
              inclinada, que mide $A/\cos\theta$, no $A$. Por eso
              $\sigma_{x'} = N\cos\theta/(A/\cos\theta) = \sigma_x\cos^2\theta$:
              con el área de la sección recta faltaría un $\cos\theta$.
    resolucion: |
      **Las fórmulas.** A tracción simple según $x$, $\sigma_y = \tau_{xy} = 0$.
      En la cara de normal $\hat n = (\cos\theta, \sin\theta)$, con $\theta$
      medido de $x$ a $x'$ en sentido antihorario, el vector tensión es
      $\mathbf S_n = (\sigma_x\cos\theta,\ 0)$, y sus proyecciones sobre
      $\hat n$ y sobre $\hat t = (-\sin\theta, \cos\theta)$ (apuntes del
      tema 2, ecs. 2.57 a 2.59, p. 22) son:

      $$
      \sigma_{x'} = \sigma_x\cos^2\theta,\qquad
      \tau_{x'y'} = -\sigma_x\sin\theta\cos\theta
      $$

      En la cara de normal $y'$, a $\theta + 90°$:
      $\sigma_{y'} = \sigma_x\sin^2\theta$.

      **b/ El ángulo.** Dividiendo la segunda entre la primera,
      $\tau_{x'y'}/\sigma_{x'} = -\tan\theta$:

      $$
      \tan\theta = -\frac{-27}{81} = \frac{1}{3}\quad\Rightarrow\quad\theta = 18{,}43°
      $$

      La tangencial negativa pide $\sin\theta\cos\theta > 0$: $\theta$ está
      entre 0 y 90°.

      **a/ La tensión axial.** $\cos^2\theta = 1/(1 + \tan^2\theta) = 0{,}9$:

      $$
      \sigma_x = \frac{\sigma_{x'}}{\cos^2\theta} = \frac{81\ \text{MPa}}{0{,}9} = 90\ \text{MPa}
      $$

      Se comprueba con la otra:
      $-90\sin\theta\cos\theta = -90\cdot\tfrac{3}{10} = -27$ MPa. El orden de
      los apartados no importa: b sale sin conocer $\sigma_x$, y a, después.

      **c/ El elemento girado 30°.**

      $$
      \begin{aligned}
      \sigma_{x'} &= 90\cos^2 30° = 67{,}5\ \text{MPa}\\
      \sigma_{y'} &= 90\sin^2 30° = 22{,}5\ \text{MPa}\\
      \tau_{x'y'} &= -90\sin30°\cos30° = -38{,}97\ \text{MPa}
      \end{aligned}
      $$

      $\sigma_{x'} + \sigma_{y'} = 90$ MPa $= \sigma_x + \sigma_y$, el
      invariante. Las mismas cifras salen de las fórmulas en $2\theta$ de la
      ec. 2.61 (p. 23), con $2\theta$ = 60°, y del círculo de Mohr de la
      tracción simple, de centro 45 MPa y radio 45 MPa; el motor del curso da
      lo mismo.

  # ── Teoría · cuestión 2 · γxy desde las aristas deformadas (tema 3).
  - id: exerm1617-ord-2-la-deformacion-tangencial-de-dos-aristas-en-el-espacio
    titulo: La deformación tangencial de dos aristas que se deforman en el espacio
    fuente: >-
      Cuestión 2 de teoría · Examen final del 19 de enero de 2017 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Volvió a caer con otras palabras como
      cuestión 1 de teoría de los exámenes finales del 16 de enero de 2019 y
      del 13 de enero de 2023, que el sitio resuelve en otro ejercicio. El
      examen no publica resolución; el desarrollo es nuestro y sigue los
      apuntes del tema 3, apartado 3.3.2 (págs. 8 y 9). Los números del paso
      de cálculo son un ejemplo nuestro, comprobado con el motor del curso y
      por un segundo camino.
    nivel: examen
    enunciado: |
      (1p) Las aristas que corresponden a las direcciones x e y de un elemento
      diferencial tras la deformación vienen dadas por:

      $$
      \overrightarrow{O'A'} = \left(1 + u_{,x}\right)dx\,\vec{i} + v_{,x}\,dx\,\vec{j} + w_{,x}\,dx\,\vec{k}
      $$

      $$
      \overrightarrow{O'B'} = u_{,y}\,dy\,\vec{i} + \left(1 + v_{,y}\right)dy\,\vec{j} + w_{,y}\,dy\,\vec{k}
      $$

      Definir la deformación tangencial unitaria y deducir $\gamma_{xy}$.

      **Notas nuestras.** En el PDF, las flechas de los vectores salen como
      cuadros sobre O′A′ y O′B′ y corridas bajo i, j y k; se transcriben como
      vectores, que es lo que son.
    pide: >-
      Qué es la deformación tangencial unitaria y cuánto vale γxy a partir de
      las dos aristas deformadas, y, en un ejemplo nuestro, su valor.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las aristas tienen componente según $\vec k$: $w_{,x}\,dx$ y
          $w_{,y}\,dy$. ¿Qué papel tienen $w_{,x}$ y $w_{,y}$ en $\gamma_{xy}$?
        opciones:
          - texto: >-
              Solo aparecen en términos de segundo orden, el producto
              $w_{,x}w_{,y}$ del producto escalar y sus cuadrados en los
              módulos, y en pequeños desplazamientos no cuentan
            correcta: true
            mensaje: |
              Eso es. En el numerador de la ec. 3.18 (p. 9),
              $(1 + u_{,x})u_{,y} + v_{,x}(1 + v_{,y}) + w_{,x}w_{,y}$, las
              componentes según $\vec k$ solo se multiplican entre sí; en los
              módulos entran al cuadrado. Al despreciar los términos de orden 2
              (ecs. 3.19 y 3.20) desaparecen, y queda
              $\gamma_{xy} = u_{,y} + v_{,x}$ (ec. 3.21).
          - texto: >-
              Se suman a las otras: $\gamma_{xy} = u_{,y} + v_{,x} + w_{,x} + w_{,y}$
            mensaje: |
              En el producto escalar
              $\overrightarrow{O'A'}\cdot\overrightarrow{O'B'}$ cada componente
              se multiplica por la misma componente de la otra arista: la de
              $\vec k$ da $w_{,x}w_{,y}\,dx\,dy$, un producto de dos derivadas
              pequeñas, no una suma.
          - texto: >-
              Cambian el denominador, que pasa a ser $1 + w_{,x} + w_{,y}$
            mensaje: |
              El denominador son los módulos de las aristas. En ellos $w_{,x}$
              y $w_{,y}$ entran al cuadrado (ec. 3.18), y al quedarse con el
              primer orden el denominador es $1 + u_{,x} + v_{,y}$ (ec. 3.19).
          - texto: >-
              Ninguno, porque $\overrightarrow{O'A'}$ no tiene componente según
              $\vec k$
            mensaje: |
              Sí la tiene, $w_{,x}\,dx\,\vec k$: la arista x se sale del plano
              $xy$ al deformarse. Lo que pasa es que su efecto en el ángulo es
              de segundo orden.
      - tipo: calcular
        titulo: La deformación tangencial en un ejemplo
        pregunta: |
          Un ejemplo nuestro, todo en unidades de $10^{-4}$: $u_{,x}$ = 5,
          $u_{,y}$ = 9, $v_{,x}$ = −3, $v_{,y}$ = 2, $w_{,x}$ = 4 y $w_{,y}$ = −6.
          ¿Cuánto vale $\gamma_{xy}$, en unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '6.0'
          tolerancia: 0.05
          formato: un número, en unidades de 10⁻⁴
        distractores:
          - valor: '12'
            mensaje: |
              Has restado, $u_{,y} - v_{,x}$. Las dos derivadas cierran el
              ángulo recto: $v_{,x}$ inclina la arista x hacia y, y $u_{,y}$
              inclina la arista y hacia x. Se suman (ec. 3.21).
          - valor: '3'
            mensaje: |
              Es la mitad, $\varepsilon_{xy} = \tfrac{1}{2}\gamma_{xy}$, el
              término del tensor de deformaciones. La deformación tangencial es
              la disminución entera del ángulo recto.
          - valor: '7'
            mensaje: |
              $u_{,x} + v_{,y}$ son los alargamientos unitarios de las aristas,
              $\varepsilon_x + \varepsilon_y$: cambian las longitudes, no el
              ángulo entre ellas.
          - valor: '4'
            mensaje: |
              Has sumado $w_{,x}$ y $w_{,y}$. Esas dos solo entran como
              producto, $w_{,x}w_{,y}$, que es de segundo orden.
        pista: |
          En pequeños desplazamientos, $\gamma_{xy} = u_{,y} + v_{,x}$ (ec. 3.21).
        desarrollo: |
          $$
          \gamma_{xy} = u_{,y} + v_{,x} = (9 - 3)\cdot10^{-4} = 6\cdot10^{-4}
          $$

          Sin aproximar, con la ec. 3.17, el seno del ángulo cerrado sale
          $5{,}997\cdot10^{-4}$: los términos de segundo orden cambian la
          cuarta cifra.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la respuesta como en el examen: la definición, la relación
          con el producto escalar de las aristas y la simplificación hasta
          γxy, diciendo qué se desprecia en cada paso.
        rubrica:
          - punto: >-
              Se define γxy como la disminución del ángulo recto entre las
              direcciones x e y, inicialmente perpendiculares:
              γxy = ½π − ϕxy, con ϕxy el ángulo que forman tras la
              deformación (ec. 3.15).
            porque: >-
              Es la mitad de la pregunta, «definir», y fija el signo: γxy es
              positiva cuando el ángulo se cierra.
            minimo: true
          - punto: >-
              Se escribe el producto escalar de las aristas,
              O′A′·O′B′ = |O′A′||O′B′| cos ϕxy, y, como cos ϕxy = sin γxy, se
              despeja sin γxy como el producto escalar dividido por los
              módulos (ecs. 3.16 y 3.17).
            porque: >-
              Es lo que conecta la geometría con las aristas que da el
              enunciado.
            minimo: true
          - punto: >-
              Se sustituyen las aristas: el numerador es
              (1 + u,x)u,y + v,x(1 + v,y) + w,x w,y, y los módulos, con la
              raíz aproximada, 1 + u,x + ½(u,x² + v,x² + w,x²) y la análoga
              (ec. 3.18).
            porque: >-
              Es la cuenta, todavía sin pequeños desplazamientos.
          - punto: >-
              Se desprecian los términos de orden 2 y superiores:
              sin γxy = (u,y + v,x)/(1 + u,x + v,y), y, con 1/(1 + α) ≈ 1 − α,
              sin γxy = u,y + v,x (ecs. 3.19 y 3.20).
            porque: >-
              Es donde se van las w y los productos de derivadas.
            minimo: true
          - punto: >-
              Con γxy pequeño, sin γxy = γxy, y queda γxy = u,y + v,x
              (ec. 3.21), con las análogas γyz = v,z + w,y y γzx = w,x + u,z.
            porque: >-
              Es el resultado que pide el enunciado.
            minimo: true
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              $\gamma_{xy} = \tfrac{1}{2}\pi - \varphi_{xy}$: lo que se cierra el
              ángulo recto entre las aristas x e y.
          - texto: >-
              $\sin\gamma_{xy} = \cos\varphi_{xy}$, que es el producto escalar
              de $\overrightarrow{O'A'}$ y $\overrightarrow{O'B'}$ dividido por
              sus módulos.
          - texto: >-
              Despreciando los términos de orden 2,
              $\sin\gamma_{xy} = (u_{,y} + v_{,x})/(1 + u_{,x} + v_{,y})$, y
              después $\sin\gamma_{xy} = u_{,y} + v_{,x}$.
          - texto: >-
              Con el ángulo pequeño, $\gamma_{xy} = u_{,y} + v_{,x}$.
          - texto: >-
              $\gamma_{xy}$ es el giro de la arista x hacia y, $v_{,x}$.
            trampa: true
            mensaje: |
              $v_{,x}$ es solo lo que gira la arista x hacia y. La arista y
              también gira, $u_{,y}$, hacia x, y el ángulo recto se cierra con
              los dos giros: $\gamma_{xy} = u_{,y} + v_{,x}$.
    resolucion: |
      **La definición.** La deformación tangencial unitaria de las
      direcciones x e y es la **disminución del ángulo recto** que formaban
      antes de deformarse (apuntes del tema 3, apartado 3.3.2, p. 8):

      $$
      \gamma_{xy} = \tfrac{1}{2}\pi - \varphi_{xy}\qquad\text{(ec. 3.15)}
      $$

      con $\varphi_{xy}$ el ángulo entre las aristas deformadas
      $\overrightarrow{O'A'}$ y $\overrightarrow{O'B'}$. Es positiva si el
      ángulo se cierra.

      **El producto escalar.** Como
      $\overrightarrow{O'A'}\cdot\overrightarrow{O'B'} = |O'A'|\,|O'B'|\cos\varphi_{xy}$
      y $\cos\varphi_{xy} = \sin\gamma_{xy}$ (ecs. 3.16 y 3.17, p. 9):

      $$
      \sin\gamma_{xy} = \frac{\overrightarrow{O'A'}\cdot\overrightarrow{O'B'}}{|O'A'|\,|O'B'|}
      $$

      Con las aristas del enunciado, y los módulos con
      $\sqrt{1 + \alpha} \simeq 1 + \tfrac{1}{2}\alpha$ (ec. 3.18):

      $$
      \sin\gamma_{xy} = \frac{(1 + u_{,x})u_{,y} + v_{,x}(1 + v_{,y}) + w_{,x}w_{,y}}
      {\left[1 + u_{,x} + \tfrac{1}{2}(u_{,x}^2 + v_{,x}^2 + w_{,x}^2)\right]\left[1 + v_{,y} + \tfrac{1}{2}(u_{,y}^2 + v_{,y}^2 + w_{,y}^2)\right]}
      $$

      Los $dx\,dy$ del numerador y del denominador se van.

      **Pequeños desplazamientos.** Despreciando los términos de orden 2 y
      superiores —los productos de derivadas y los cuadrados, con ellos todo
      lo que lleva $w$—, y después $1/(1 + \alpha) \simeq 1 - \alpha$
      (ecs. 3.19 y 3.20):

      $$
      \sin\gamma_{xy} = \frac{u_{,y} + v_{,x}}{1 + u_{,x} + v_{,y}} \simeq u_{,y} + v_{,x}
      $$

      Y como el ángulo es pequeño, $\sin\gamma_{xy} = \gamma_{xy}$:

      $$
      \gamma_{xy} = u_{,y} + v_{,x}\qquad\text{(ec. 3.21)}
      $$

      $v_{,x}$ es lo que gira la arista x hacia y, y $u_{,y}$, lo que gira la
      arista y hacia x. Del mismo modo, $\gamma_{yz} = v_{,z} + w_{,y}$ y
      $\gamma_{zx} = w_{,x} + u_{,z}$.

      **Un ejemplo nuestro.** Con $u_{,x}$ = 5, $u_{,y}$ = 9, $v_{,x}$ = −3,
      $v_{,y}$ = 2, $w_{,x}$ = 4 y $w_{,y}$ = −6, en $10^{-4}$:
      $\gamma_{xy} = (9 - 3)\cdot10^{-4} = 6\cdot10^{-4}$. Sin aproximar, el
      producto escalar lleva además
      $u_{,x}u_{,y} + v_{,x}v_{,y} + w_{,x}w_{,y} = (45 - 6 - 24)\cdot10^{-8}$,
      y la fórmula exacta da $5{,}997\cdot10^{-4}$: la diferencia es de
      segundo orden. El motor del curso da las dos.

  # ── Teoría · cuestión 3 · la viga que se deduce del diagrama de cortantes (tema 7).
  - id: exerm1617-ord-3-la-viga-que-se-deduce-del-diagrama-de-cortantes
    titulo: La viga que se deduce de su diagrama de cortantes, y su diagrama de flectores
    fuente: >-
      Cuestión 3 de teoría · Examen final del 19 de enero de 2017 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 7, apartado 7.5
      (págs. 12 y 13), y las cifras salen del motor del curso y de un segundo
      camino.
    nivel: examen
    enunciado: |
      (1p) La figura representa el diagrama de fuerzas cortantes de una viga
      isostática apoyada en los extremos. Determinar las fuerzas que soporta
      la viga y el diagrama de momentos flectores, suponiendo que no actúan
      pares de fuerzas sobre la viga.

