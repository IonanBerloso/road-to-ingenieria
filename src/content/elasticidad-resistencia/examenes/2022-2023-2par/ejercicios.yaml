      - tipo: calcular
        titulo: El desplazamiento de C
        pregunta: |
          ¿Cuánto baja C? Da el número $c$ de $c\,qL^{4}/EI$.
        respuesta:
          tipo: numero
          valor: '3.28125'
          tolerancia: 0.002
          formato: un número; forma exacta (105/32)
        distractores:
          - valor: '0.875'
            mensaje: |
              Es solo la flexión del voladizo BC, como si A y B fueran apoyos
              fijos. Los resortes ceden: B baja $21qL^{4}/16EI$ y A sube
              $7qL^{4}/8EI$, y la viga gira entera alrededor de un punto entre
              los dos.
          - valor: '2.40625'
            mensaje: |
              Te falta un trozo. Sale 2,40625 de dos formas: con la viga rígida
              sobre los resortes, sin la flexión del voladizo; o sumándolo
              todo pero con A **bajando** en lugar de subir. A sube
              $7qL^{4}/8EI$, porque su resorte tira hacia abajo.
          - valor: '1.40625'
            mensaje: |
              Es el desplazamiento con solo la P en C. La fuerza que baja por
              la rótula desde CD, $qL/2$, también carga ABC: en C actúan
              $7qL/8$, no $3qL/8$.
        pista: |
          $v_A = R_A/k_A$ y $v_B = R_B/k_B$; la recta que pasa por los dos da lo
          que baja C con la viga rígida, y a eso se le suma la flexión del
          voladizo, $F_C L^{2}(2L + L)/3EI$.
        desarrollo: |
          $$
          v_A = \frac{R_A}{k_A} = -\frac{7}{8}\,\frac{qL^{4}}{EI},
          \qquad
          v_B = \frac{R_B}{k_B} = \frac{21}{16}\,\frac{qL^{4}}{EI}
          $$

          Con la viga rígida, C, a $L$ de B, baja $v_B + (v_B - v_A)/2 =
          \tfrac{77}{32}\,qL^{4}/EI$. La flexión: el flector $F_C L$ en B gira
          el vano AB $F_C L\cdot2L/3EI$, que en el voladizo son
          $\tfrac{2}{3}F_CL^{3}/EI$, más la flecha propia del voladizo,
          $\tfrac{1}{3}F_CL^{3}/EI$:

          $$
          v_C = \frac{77}{32} + \frac{7}{8} = \frac{105}{32}
          $$

          $$
          \frac{105}{32} = 3{,}281
          $$

          en unidades de $qL^{4}/EI$, hacia abajo.
      - tipo: calcular
        titulo: La tensión normal en M
        pregunta: |
          Con $L = 1$ m, $t = 10$ mm y $q = 40$ N/mm, ¿cuánto vale $\sigma$ en M,
          en la sección más desfavorable, en MPa?
        respuesta:
          tipo: numero
          valor: '186.83'
          tolerancia: 0.2
          formato: un número, en MPa
        distractores:
          - valor: '210.19'
            mensaje: |
              Es la tensión en la fibra más alejada, a $9t$ del centro de
              gravedad. M está en la unión del alma con el ala, a $8t$.
          - valor: '26.69'
            mensaje: |
              Has usado el flector máximo de CD, $qL^{2}/8$. El mayor flector de
              la viga, en valor absoluto, está en B: $7qL^{2}/8$, siete veces
              más.
        pista: |
          $I_z = \tfrac{4496}{3}t^{4}$, $M_B = -\tfrac{7}{8}qL^{2} = -35\cdot10^{6}$
          N·mm, y M está a $8t$ por encima del centro de gravedad.
        desarrollo: |
          La sección es simétrica: el centro de gravedad está a $9t$ de cada
          cara exterior.

          $$
          I_z = 2\left[\frac{8t\cdot t^{3}}{12} + 8t^{2}\,(8{,}5t)^{2}\right] + \frac{t\,(16t)^{3}}{12}
          = \frac{4496}{3}\,t^{4} = 14\,986\,667\ \text{mm}^{4}
          $$

          Con $y$ hacia abajo, M está en $y = -80$ mm, y en B el flector es
          $-35\cdot10^{6}$ N·mm:

          $$
          \sigma_M = \frac{M_z\,y}{I_z} = \frac{(-35\cdot10^{6})(-80)}{14986667} = 186{,}83\ \text{MPa}
          $$

          de tracción: el flector negativo tracciona la fibra superior.
      - tipo: calcular
        titulo: La tensión tangencial en M
        pregunta: |
          ¿Cuánto vale $\tau$ en M, del lado del alma, en esa misma sección, en
          MPa?
        respuesta:
          tipo: numero
          valor: '15.881'
          tolerancia: 0.02
          formato: un número, en MPa
        distractores:
          - valor: '7.94'
            mensaje: |
              Has usado el cortante a la **izquierda** de B, $7qL/16$. La
              sección más desfavorable es la de la derecha de B: el mismo
              flector y el doble de cortante, $7qL/8$.
          - valor: '1.985'
            mensaje: |
              Has dividido el flujo entre el ancho del ala, $8t$. Del lado del
              alma el ancho es el espesor del alma, $t$, y la tensión es ocho
              veces mayor.
          - valor: '21.875'
            mensaje: |
              Es el cortante repartido en el área del alma, $V/(16t\cdot t)$, la
              tensión media. En M la tensión sale de $VQ/(I_z b)$, con el
              momento estático del ala.
          - valor: '23.354'
            mensaje: |
              Es la tensión en el centro de gravedad, la máxima del alma, donde
              el momento estático incluye media alma. En M solo cuenta el ala.
        pista: |
          $\tau = V\,Q_z/(I_z\,b)$, con $V = 7qL/8$, $Q_z$ el momento estático
          del ala de arriba y $b = t$.
        desarrollo: |
          $$
          Q_z = 8t\cdot t\cdot8{,}5t = 68\,t^{3} = 68\,000\ \text{mm}^{3},
          \qquad
          V = \frac{7}{8}qL = 35\,000\ \text{N}
          $$

          $$
          \tau_M = \frac{V\,Q_z}{I_z\,t} = \frac{35000\cdot68000}{14986667\cdot10} = 15{,}88\ \text{MPa}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              CD, entre la rótula y el tirante, da $R_D = qL/2$, y por la rótula
              baja otro $qL/2$ que se suma a la P.
          - texto: >-
              En ABC, con $7qL/8$ en C, $R_B = 21qL/16$ y $R_A = -7qL/16$, y el
              flector en B es $-7qL^{2}/8$.
          - texto: >-
              A sube $7/8$ y B baja $21/16$, en $qL^{4}/EI$; la viga rígida lleva
              C a $77/32$, y la flexión del voladizo añade $7/8$, hasta $105/32$.
          - texto: >-
              A la derecha de B, $\sigma_M = 186{,}8$ MPa de tracción y
              $\tau_M = 15{,}9$ MPa en el alma.
          - texto: >-
              Como A y B están sobre resortes, la viga es hiperestática y hay
              que plantear la compatibilidad de los dos para hallar las
              reacciones.
            trampa: true
            mensaje: |
              Un resorte es un apoyo que cede, pero da una sola reacción, como
              uno rígido. Con tres reacciones, dos ecuaciones de equilibrio y
              la rótula, la viga es isostática; los resortes entran después,
              en los desplazamientos.
    resolucion: |
      **Las reacciones.** CD está entre la rótula y el tirante. Momentos en C
      y vertical:

      $$
      R_D\,L = qL\cdot\frac{L}{2} \;\Longrightarrow\; R_D = \frac{qL}{2},
      \qquad
      \text{por la rótula baja } \frac{qL}{2}
      $$

      Sobre ABC actúan en C $P + qL/2 = 7qL/8$. Momentos en A y vertical:

      $$
      R_B = \frac{21}{16}\,qL,\qquad R_A = -\frac{7}{16}\,qL
      $$

      $R_A$ es negativa: la carga está fuera del vano AB, la viga hace palanca
      en B y el resorte A tira de ella hacia abajo.

      **a) Diagramas.** Cortante positivo si la resultante a la izquierda
      sube; flector positivo si tracciona la fibra inferior
      ($dM/dx = V$).

      | tramo | V | M |
      |---|---|---|
      | AB | $-7qL/16$ | de 0 a $-7qL^{2}/8$ en B |
      | BC | $7qL/8$ | de $-7qL^{2}/8$ a 0 en la rótula |
      | CD | de $qL/2$ a $-qL/2$ | parábola, 0 en C y en D, máximo $qL^{2}/8$ en el centro |

      **b) El desplazamiento de C.** Los resortes ceden:

      $$
      v_A = \frac{R_A}{k_A} = -\frac{7}{8}\,\frac{qL^{4}}{EI}\ (\text{sube}),
      \qquad
      v_B = \frac{R_B}{k_B} = \frac{21}{16}\,\frac{qL^{4}}{EI}\ (\text{baja})
      $$

      Con la viga rígida, C está a $L$ de B por fuera del vano y baja
      $v_B + (v_B - v_A)/2 = 77/32$. La flexión se suma: el flector
      $F_C L$ en B gira el vano AB, de luz $2L$, $\theta_B = F_C L\cdot2L/3EI$
      (tema 10), y el voladizo baja por ese giro y por su propia flexión:

      $$
      F_C\,\frac{2L^{3}}{3EI} + F_C\,\frac{L^{3}}{3EI} = F_C\,\frac{L^{3}}{EI} = \frac{7}{8}\,\frac{qL^{4}}{EI}
      $$

      $$
      v_C = \left(\frac{77}{32} + \frac{7}{8}\right)\frac{qL^{4}}{EI} = \frac{105}{32}\,\frac{qL^{4}}{EI}
      \approx 3{,}28\,\frac{qL^{4}}{EI}
      $$

      hacia abajo. Los resortes ponen casi las tres cuartas partes.

      **c) σ y τ en M.** La sección más desfavorable está en B: allí está el
      mayor flector, $|M| = 7qL^{2}/8$, y a su derecha el mayor cortante,
      $7qL/8$. Con $L = 1000$ mm y $q = 40$ N/mm, $M_B = -35\cdot10^{6}$
      N·mm y $V = 35\,000$ N.

      La sección es una I simétrica de canto $18t$, con el centro de gravedad
      en el centro, $I_z = \tfrac{4496}{3}t^{4} = 14\,986\,667$ mm⁴. M está a
      $8t = 80$ mm por encima, y la normal es la de la ec. 9.23 (apuntes del
      tema 9, p. 12):

      $$
      \sigma_M = \frac{M_z\,y}{I_z} = \frac{(-35\cdot10^{6})(-80)}{14986667} = 186{,}83\ \text{MPa}
      $$

      de tracción. Para la tangencial, el flujo cortante en el corte por M
      es $q_c = T_y\,Q_{zc}/I_z$ (ec. 9.35, p. 16), con $T_y = V = 35\,000$
      N y $Q_{zc}$ el momento estático del ala de arriba,
      $Q_{zc} = 8t\cdot t\cdot8{,}5t = 68\,000$ mm³. Del lado del alma el
      corte mide $t$, y $\tau_M = q_c/t$:

      $$
      \tau_M = \frac{q_c}{t} = \frac{T_y\,Q_{zc}}{I_z\,t} = \frac{35000\cdot68000}{14986667\cdot10} = 15{,}88\ \text{MPa}
      $$

      Del lado del ala, con ancho $8t$, serían 1,99 MPa; la unión misma los
      apuntes no la analizan, porque la tensión cambia de dirección (p. 20).

      **La otra lectura de la sección.** Si 16t fuera el canto total, con las
      alas dentro, $I_z = 1130\,t^{4}$, M estaría a $7t$ y saldrían
      $\sigma_M = 216{,}8$ MPa y $\tau_M = 18{,}6$ MPa.

