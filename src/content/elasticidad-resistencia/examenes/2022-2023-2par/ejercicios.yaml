      **Notas nuestras.** «El desplazamiento del muelle» se lee como lo que
      se alarga o se acorta el muelle, que es lo que se mueve C en vertical.
      Las barras se toman inextensibles y sin energía de cortante, como hace
      el curso con piezas esbeltas; la resolución dice qué cambia si se
      cuenta el axil.
    pide: >-
      La fuerza del muelle, lo que se alarga o se acorta y el desplazamiento
      vertical de B, en función de P, L, E e I.
    pasos:
      - tipo: reconocer
        pregunta: |
          A está empotrado y C apoyado en un muelle. ¿Qué ecuación da la fuerza
          $F$ del muelle?
        opciones:
          - texto: >-
              $\partial C/\partial F = 0$, con la coenergía del muelle,
              $F^{2}/2K$, sumada a la de las barras
            correcta: true
            mensaje: |
              Eso es. $F$ es la incógnita hiperestática, una reacción externa
              (ec. 13.52, p. 19), y el muelle entra con su coenergía
              (ec. 13.45, p. 16). Su derivada, $F/K$, es lo que se deforma el
              muelle, y la ecuación dice que eso es lo que se mueve C.
          - texto: >-
              $\partial C/\partial F = 0$ con la coenergía de las barras
              solamente
            mensaje: |
              Eso es tratar C como un apoyo fijo, un muelle infinitamente
              rígido. El muelle cede, y su coenergía tiene que entrar en la
              suma; si no, $F$ sale más de tres veces mayor.
          - texto: >-
              El equilibrio de la estructura entera, tomando momentos en A
            mensaje: |
              El empotramiento da seis reacciones y el muelle una más: la
              estructura es hiperestática de grado uno, y el equilibrio no
              basta.
          - texto: >-
              $F = K\delta$, con $\delta$ lo que baja C en la estructura sin
              muelle
            mensaje: |
              En cuanto el muelle actúa, C se mueve menos (o en otro sentido)
              que sin él: $\delta$ depende de $F$. La fuerza y el
              desplazamiento salen a la vez, de la misma ecuación.
      - tipo: calcular
        titulo: La fuerza del muelle
        pregunta: |
          Toma $F$ positiva si el muelle empuja C hacia arriba. ¿Cuánto vale
          $F/P$?
        respuesta:
          tipo: numero
          valor: '-0.160341'
          tolerancia: 0.0005
          formato: un número, F en unidades de P
        distractores:
          - valor: '0.160341'
            mensaje: |
              El valor es ese, pero el signo no. P tuerce AB y el par hace
              girar los dos brazos: D baja y C **sube**. El muelle, debajo de C,
              lo sujeta tirando hacia abajo: trabaja a tracción.
          - valor: '-0.512563'
            mensaje: |
              Es lo que sale con C fijo, sin el término $F/K$ del muelle. El
              muelle cede, y con $K = EI/20L^{3}$ cede mucho: su término es el
              mayor de la ecuación.
          - valor: '0.0138286'
            mensaje: |
              Te has dejado la torsión de AB. P, a $2L$ del eje de AB, la
              tuerce con un par $2PL$, y ese giro es lo que levanta C. Sin
              torsión solo queda la flexión, que hace bajar C, y el signo sale
              al revés.
          - valor: '-0.283442'
            mensaje: |
              Has tomado $I_t = I$. En una sección circular maciza la rigidez
              a torsión va con el momento polar, $I_t = I_p = 2I$, y con
              $E = 2{,}5G$ queda $GI_t = 0{,}8\,EI$.
        pista: |
          Con $GI_t = 0{,}8\,EI$ y $K = EI/(20L^{3})$, los cuatro términos de
          $\partial C/\partial F$ en $L^{3}/EI$: flexión del brazo BC, torsión de
          AB con $M_t = 2L(P + F)$, flexión de AB con $M = (P - F)x$, y el
          muelle.
        desarrollo: |
          El brazo BC mide $2\sqrt{2}\,L$ y su flector es $F s/\sqrt{2}$; AB se
          tuerce con $M_t = 2L(P + F)$ y se flecta con $(P - F)x$:

          $$
          \frac{8\sqrt{2}}{3}\,F + 5\,(P + F) - \frac{P - F}{3} + 20\,F = 0
          $$

          $$
          F\left(\frac{8\sqrt{2}}{3} + \frac{76}{3}\right) = -\frac{14}{3}\,P
          \;\Longrightarrow\;
          F = -\frac{14}{8\sqrt{2} + 76}\,P
          $$

          $$
          \frac{14}{8\sqrt{2} + 76} = 0{,}16034
          $$
      - tipo: calcular
        titulo: Lo que se deforma el muelle
        pregunta: |
          ¿Cuánto se alarga el muelle? Da el número $c$ de $c\,PL^{3}/EI$.
        respuesta:
          tipo: numero
          valor: '3.20683'
          tolerancia: 0.002
          formato: un número, en PL³/EI
        distractores:
          - valor: '10.2513'
            mensaje: |
              Has dividido entre $K$ la fuerza que sale con C fijo. Esa fuerza
              no es la buena: en cuanto el muelle cede, tira menos. Vuelve al
              paso anterior con el término $F/K$ dentro de la ecuación.
          - valor: '0.276573'
            mensaje: |
              Es $F/K$ con la $F$ que sale sin la torsión de AB. La torsión es
              lo que levanta C; sin ella, el muelle apenas trabaja.
        pista: |
          $\delta = |F|/K$, con $K = EI/(20L^{3})$.
        desarrollo: |
          $$
          \delta = \frac{|F|}{K} = 0{,}16034\,P\cdot\frac{20L^{3}}{EI}
          $$

          $$
          0{,}16034\cdot20 = 3{,}2068
          $$

          C **sube** $3{,}21\,PL^{3}/EI$ y el muelle se alarga eso.
      - tipo: calcular
        titulo: El desplazamiento vertical de B
        pregunta: |
          ¿Cuánto baja B? Da el número $c$ de $c\,PL^{3}/EI$.
        respuesta:
          tipo: numero
          valor: '0.38678'
          tolerancia: 0.0005
          formato: un número, en PL³/EI
        distractores:
          - valor: '0.333333'
            mensaje: |
              Es $PL^{3}/3EI$, la flecha de AB sin el muelle. El muelle tira
              de C hacia abajo, y esa fuerza también la lleva AB hasta A: en B
              actúan $P - F = 1{,}16\,P$ hacia abajo.
          - valor: '0.279886'
            mensaje: |
              Has restado la fuerza del muelle en lugar de sumarla, como si
              empujara hacia arriba. $F$ es negativa: el muelle tira de C hacia
              abajo, y B baja más que con P sola.
        pista: |
          Pon una fuerza ficticia en B; solo flecta AB, con brazo $x$. El
          resultado es $(P - F)L^{3}/3EI$.
        desarrollo: |
          $$
          v_B = \frac{(P - F)\,L^{3}}{3EI} = \frac{1{,}16034}{3}\,\frac{PL^{3}}{EI}
          $$

          $$
          \frac{1 + 0{,}16034}{3} = 0{,}38678
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La fuerza del muelle es la incógnita hiperestática, y
              $\partial C/\partial F = 0$ con la coenergía del muelle dentro.
          - texto: >-
              Los brazos trabajan a flexión; AB, a flexión con $P - F$ y a
              torsión con $2L(P + F)$, y $GI_t = 0{,}8\,EI$.
          - texto: >-
              Sale $F = -0{,}160\,P$: el muelle trabaja a tracción, y se alarga
              $3{,}21\,PL^{3}/EI$.
          - texto: >-
              B baja $(P - F)L^{3}/3EI = 0{,}387\,PL^{3}/EI$.
          - texto: >-
              Como P baja D, toda la estructura baja, y el muelle trabaja a
              compresión.
            trampa: true
            mensaje: |
              P tuerce AB, y ese giro mueve los dos brazos en sentidos
              contrarios: D baja y C sube. El efecto de la torsión es mayor que
              el de la flexión de AB, y el muelle tiene que sujetar C hacia
              abajo.
    resolucion: |
      **La geometría.** Con el origen en B: $A(-L, 0, 0)$, $C(0, -2L, -2L)$ y
      $D(0, 2L, -2L)$. AB va según X y mide $L$; los brazos BC y BD están en el
      plano YZ, a 45°, y miden $2\sqrt{2}\,L$ cada uno.

      **Los datos.** La sección es circular maciza: $I_t = I_p = 2I$, y con
      $E = 2{,}5G$, $GI_t = 0{,}8\,EI$. De $I_z/(AL^{2}) = 2$, $EA = EI/(2L^{2})$
      y $K = EA/(10L) = EI/(20L^{3})$.

      **La incógnita.** $F$, la fuerza del muelle sobre C, positiva hacia
      arriba. La condición es $\partial C/\partial F = 0$ con la coenergía del
      muelle, $F^{2}/2K$ (apuntes del tema 13, ecs. 13.45 y 13.52, págs. 16 y
      19).

      **Los esfuerzos.**
      - Brazo BD: flexión por P, $M = Ps/\sqrt{2}$, que no depende de $F$.
      - Brazo BC: flexión por $F$, $M = Fs/\sqrt{2}$, con $s$ desde C.
      - AB: en B llegan una fuerza vertical $P - F$ hacia abajo y un par
        según X de $2L(P + F)$, porque P, en $y = 2L$, y $F$, en $y = -2L$
        y hacia arriba, giran en el mismo sentido. AB se flecta con
        $M = (P - F)x$ y se tuerce con $M_t = 2L(P + F)$.

      **La ecuación.** En unidades de $L^{3}/EI$, la flexión de BC da
      $8\sqrt{2}F/3$, la torsión de AB $4(P + F)/0{,}8 = 5(P + F)$, la flexión de
      AB $-(P - F)/3$ y el muelle $20F$:

      $$
      \frac{8\sqrt{2}}{3}\,F + 5\,(P + F) - \frac{P - F}{3} + 20\,F = 0
      \;\Longrightarrow\;
      F = -\frac{14}{76 + 8\sqrt{2}}\,P \approx -0{,}1603\,P
      $$

      **a) La fuerza del muelle.** $0{,}1603\,P$ de **tracción**: el muelle
      tira de C hacia abajo. P tuerce AB, el par hace girar los dos brazos
      alrededor de X, D baja y C sube, y la torsión puede más que la flexión
      de AB, que haría bajar C.

      **b) Lo que se deforma el muelle.**

      $$
      \delta = \frac{|F|}{K} = 0{,}16034\cdot20\,\frac{PL^{3}}{EI} \approx 3{,}21\,\frac{PL^{3}}{EI}
      $$

      Se alarga: C sube $3{,}21\,PL^{3}/EI$.

      **c) El desplazamiento vertical de B.** Con una fuerza ficticia en B, solo
      AB se flecta:

      $$
      v_B = \frac{(P - F)L^{3}}{3EI} = \frac{1{,}16034}{3}\,\frac{PL^{3}}{EI} \approx 0{,}387\,\frac{PL^{3}}{EI}
      $$

      hacia abajo. Con el motor del curso, que resuelve la estructura espacial
      con flexión y torsión, salen las mismas cifras.

      **Si se cuenta el axil.** Con $EA = EI/(2L^{2})$, la energía de axil de
      los brazos no es despreciable, y sumándola salen $F = -0{,}1461\,P$,
      $\delta = 2{,}92\,PL^{3}/EI$ y $v_B = 0{,}382\,PL^{3}/EI$. El curso no la
      cuenta en estas estructuras, y el dato $I_z/(AL^{2})$ está para dar $K$.
