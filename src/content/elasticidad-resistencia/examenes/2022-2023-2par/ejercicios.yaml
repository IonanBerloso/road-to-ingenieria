ejercicios:
  # ── Teoría · cuestión 1 · flexión pura: la distribución de las tensiones
  #    normales. Impresa «1. (1p) Flexión Pura.». Es casi la pregunta 3 del
  #    parcial 1 de 2012-2013 («3. (1,5p) Flexión pura … de tensiones»), que
  #    está en el sitio; como cambian los puntos, el número y dos palabras,
  #    va un ejercicio propio, con otro ejemplo (lección 16).
  - id: exerm2223-2par-1-la-ley-de-tensiones-en-flexion-pura
    titulo: Flexión pura, la ley de las tensiones normales y su eje neutro
    fuente: >-
      Cuestión 1 de teoría · Segunda parte del 13 de enero de 2023 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Casi la misma pregunta («la
      distribución de tensiones», sin el artículo) cayó como pregunta 3 de
      teoría del primer parcial de 2012-2013, con 1,5 puntos, y está resuelta
      en el sitio; aquí se resuelve de nuevo, con otro ejemplo. El examen no
      publica resolución; el desarrollo es nuestro y sigue los apuntes del
      tema 9, apartado 9.2 (págs. 4 a 12, ecs. 9.1 a 9.13, 9.21 y 9.23). Los
      pasos de cálculo son un ejemplo nuestro.
    nivel: examen
    enunciado: |
      (1p) Flexión Pura. Deducir la distribución de las tensiones normales en
      función de los momentos flectores.
    pide: >-
      La distribución de las tensiones normales σx de una sección a flexión
      pura, deducida y escrita en función de los flectores My y Mz, y la
      ecuación del eje neutro.
    pasos:
      - tipo: reconocer
        pregunta: |
          En la deducción, ¿de dónde sale que $\sigma_x$ cambie linealmente de
          un punto a otro de la sección?
        opciones:
          - texto: >-
              De que las secciones sigan planas: el alargamiento de cada fibra
              es proporcional a su distancia al eje neutro, y la ley de Hooke
              lo pasa tal cual a las tensiones
            correcta: true
            mensaje: |
              Eso es. Es la hipótesis de Navier-Bernoulli, la parte cinemática:
              $\varepsilon_x = \xi/\rho$ (ec. 9.1), y con
              $\sigma_y = \sigma_z = 0$, $\sigma_x = E\,\xi/\rho$ (ec. 9.2). El
              equilibrio viene después: coloca el eje neutro y da las
              constantes.
          - texto: >-
              Del equilibrio de la sección: el axil nulo y los dos flectores
              obligan a una ley lineal
            mensaje: |
              Tres ecuaciones no fijan una distribución entera: hay infinitas
              leyes con el mismo axil y los mismos flectores. El equilibrio
              fija las constantes de una ley que ya se sabe lineal; la forma
              lineal viene de que las secciones sigan planas.
          - texto: >-
              De la ley de Hooke: la tensión es proporcional a la deformación
            mensaje: |
              Hooke relaciona la tensión y la deformación de un mismo punto,
              pero no dice cómo cambia la deformación de un punto a otro. Que
              $\varepsilon_x$ sea lineal en la sección lo dice la hipótesis de
              que las secciones siguen planas.
          - texto: >-
              Del principio de Saint-Venant: lejos de las cargas, las tensiones
              se reparten de forma lineal
            mensaje: |
              Saint-Venant dice que, lejos de donde se aplican las cargas, solo
              importan sus resultantes. No dice qué forma tiene la
              distribución: eso sale de que las secciones sigan planas.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción como en el examen, desde la hipótesis de partida
          hasta σx en función de My y Mz, y el eje neutro.
        rubrica:
          - punto: >-
              Navier-Bernoulli: las secciones siguen planas y perpendiculares al
              eje y giran alrededor del eje neutro; la superficie neutra no
              cambia de longitud, y una fibra a distancia ξ de ella se alarga
              εx = ξ/ρ (ec. 9.1).
            porque: >-
              Es la hipótesis de la que sale que la ley sea lineal.
            minimo: true
          - punto: >-
              Sin tensiones en y ni en z, y con el mismo módulo a tracción que a
              compresión, σx = Eξ/ρ (ec. 9.2).
            porque: >-
              Lleva la ley lineal de las deformaciones a las tensiones.
            minimo: true
          - punto: >-
              El axil es nulo: ∫σx dA = 0 obliga a ∫ξ dA = 0, y el eje neutro
              pasa por G (ecs. 9.3 y 9.4).
            porque: >-
              Es la condición que sitúa el eje neutro.
            minimo: true
          - punto: >-
              Con ξ = y cos φ + z sen φ (ec. 9.6), σx = C1 y + C2 z (ec. 9.7).
              Los flectores, My = ∫σx z dA y Mz = ∫σx y dA, dan el sistema de
              la ec. 9.9, y su solución lleva a σx en función de My, Mz, Iy, Iz
              e Iyz (ecs. 9.10 y 9.11).
            porque: >-
              Es lo que pide el enunciado: la ley en función de los flectores,
              con unos ejes y, z cualesquiera por G.
            minimo: true
          - punto: >-
              El eje neutro es σx = 0, una recta por G (ec. 9.13), y la tensión
              máxima está en los puntos más alejados de él. En ejes principales,
              σx = Mz y/Iz + My z/Iy (ec. 9.21), y con un solo flector,
              σx = Mz y/Iz (ec. 9.23).
            porque: >-
              Son las formas que se usan, y dicen dónde está la tensión máxima.
      - tipo: calcular
        titulo: El eje neutro con un solo flector, en un ejemplo
        pregunta: |
          Un ejemplo nuestro: en una sección sin ejes de simetría, una Z de
          pared delgada con 120 mm de canto y alas de 60 mm, los ejes $y$
          (hacia abajo) y $z$ por G no son principales:
          $I_z = 4\cdot10^{6}$ mm⁴, $I_y = 1\cdot10^{6}$ mm⁴ e
          $I_{yz} = 1{,}5\cdot10^{6}$ mm⁴. La sección soporta solo
          $M_z = 2$ kN·m, positivo con el convenio de los apuntes
          ($M_z = \int\sigma_x\,y\,dA$). ¿Qué ángulo $\varphi$ forma el eje
          neutro con el eje $z$, en grados, positivo si sube hacia $+z$?
        respuesta:
          tipo: numero
          valor: '-56.31'
          tolerancia: 0.05
          formato: un número, en grados
        distractores:
          - valor: '0'
            mensaje: |
              Sería así en ejes principales: con $I_{yz} = 0$ y solo $M_z$, el
              eje neutro es el eje $z$ (ec. 9.23). Aquí $I_{yz}$ no es nulo, y
              con la ec. 9.10 $C_2$ tampoco lo es aunque $M_y = 0$: el eje
              neutro se tuerce.
          - valor: '56.31'
            mensaje: |
              El valor es ese y el sentido no. Sobre el eje neutro
              $y/z = -C_2/C_1 = 1{,}5$: con $y$ hacia abajo, al avanzar hacia
              $+z$ el eje neutro baja, y el ángulo es negativo.
          - valor: '-33.69'
            mensaje: |
              Has tomado la pendiente al revés, $z/y$. Sobre el eje neutro
              $C_1y + C_2z = 0$ da $y/z = -C_2/C_1 = I_{yz}/I_y = 1{,}5$, y
              $\operatorname{tg}\varphi = -y/z$.
          - valor: '-20.56'
            mensaje: |
              Has dividido por $I_z$. Con $M_y = 0$, la ec. 9.10 da $C_1$
              proporcional a $I_y$ y $C_2$ a $I_{yz}$: la pendiente es
              $I_{yz}/I_y = 1{,}5$, no $I_{yz}/I_z$.
        pista: |
          Con $M_y = 0$, la ec. 9.10 da $C_1$ y $C_2$. El eje neutro es
          $C_1y + C_2z = 0$, y sobre él $y/z = -\operatorname{tg}\varphi$.
        desarrollo: |
          Con $M_y = 0$, la ec. 9.10 queda

          $$
          C_1 = \frac{M_z\,I_y}{I_yI_z - I_{yz}^{2}},
          \qquad
          C_2 = -\frac{M_z\,I_{yz}}{I_yI_z - I_{yz}^{2}}
          $$

          y sobre el eje neutro, $C_1y + C_2z = 0$:

          $$
          \frac{y}{z} = -\frac{C_2}{C_1} = \frac{I_{yz}}{I_y} = \frac{1{,}5}{1} = 1{,}5
          $$

          Como $y/z = -\operatorname{tg}\varphi$, $\operatorname{tg}\varphi = -1{,}5$
          y $\varphi \approx -56{,}31^{\circ}$: con $y$ hacia abajo, el eje
          neutro baja hacia $+z$.
      - tipo: calcular
        titulo: La tensión en un punto de la misma sección
        pregunta: |
          En la misma sección y con el mismo $M_z = 2$ kN·m, ¿cuánto vale
          $\sigma_x$ en la punta del ala de abajo, el punto de coordenadas
          $y = 60$ mm, $z = 60$ mm, en MPa (positiva si es de tracción)?
        respuesta:
          tipo: numero
          valor: '-34.29'
          tolerancia: 0.2
          formato: un número, en MPa
        distractores:
          - valor: '30'
            mensaje: |
              Es $M_z\,y/I_z$, la ec. 9.23, que solo vale en ejes principales.
              Con $I_{yz}$ distinto de cero la ley lleva también un término en
              $z$ (ec. 9.11), y en la punta del ala pesa más que el de $y$: la
              tensión cambia de signo.
          - valor: '171.43'
            mensaje: |
              Has sumado el término en $z$ en lugar de restarlo: con
              $C_2 = -1{,}714$ MPa/mm y $z = +60$ mm, $C_2z = -102{,}86$ MPa.
              Sale lo mismo si se toma $C_2$ positivo, con el signo de
              $I_{yz}$ cambiado en la ec. 9.10.
          - valor: '-15'
            mensaje: |
              Has usado la ec. 9.12 sin dividir por
              $1 - I_{yz}^{2}/(I_yI_z) = 0{,}4375$: $30 - 45 = -15$. Ese
              denominador es el que hace los momentos de la ec. 9.12 más del
              doble de grandes.
          - valor: '34.29'
            mensaje: |
              El valor es ese y el signo no. $C_1y = 68{,}57$ MPa y
              $C_2z = -102{,}86$ MPa: la suma es negativa, y la punta del ala
              está comprimida.
        pista: |
          $\sigma_x = C_1y + C_2z$, con los $C_1$ y $C_2$ del paso anterior y
          $M_z = 2\cdot10^{6}$ N·mm.
        desarrollo: |
          Con los momentos en N·mm y las inercias en mm⁴, en MPa/mm:

          $$
          C_1 = \frac{2\cdot10^{6}\cdot1\cdot10^{6}}{1{,}75\cdot10^{12}} = 1{,}14286,
          \qquad
          C_2 = -\frac{2\cdot10^{6}\cdot1{,}5\cdot10^{6}}{1{,}75\cdot10^{12}} = -1{,}71429
          $$

          y en la punta del ala, en MPa:

          $$
          \sigma_x = 1{,}14286\cdot60 + (-1{,}71429)\cdot60 = 68{,}57 - 102{,}86 = -34{,}29
          $$

          De compresión, donde $M_z\,y/I_z$ daría 30 MPa de tracción.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Las secciones siguen planas y giran alrededor del eje neutro: una
              fibra a distancia $\xi$ de él se alarga $\xi/\rho$.
          - texto: >-
              Sin tensiones en $y$ ni en $z$, Hooke da $\sigma_x = E\,\xi/\rho$.
          - texto: >-
              Como el axil es nulo, el momento estático respecto del eje neutro
              también lo es, y el eje neutro pasa por G.
          - texto: >-
              Con $\xi = y\cos\varphi + z\sin\varphi$, $\sigma_x = C_1y + C_2z$, y
              las definiciones de $M_y$ y $M_z$ dan $C_1$ y $C_2$.
          - texto: >-
              El eje neutro es $\sigma_x = 0$, y la tensión máxima está en el
              punto más alejado de él.
          - texto: >-
              Con un solo flector, $M_z$, el eje neutro es siempre el eje $z$, y
              $\sigma_x = M_z\,y/I_z$.
            trampa: true
            mensaje: |
              Solo si $y$ y $z$ son principales, con $I_{yz} = 0$. Si no,
              $C_2$ no es nulo aunque $M_y$ lo sea, y el eje neutro se tuerce:
              en el ejemplo, 56° por debajo de $z$, y la punta del ala de
              abajo queda comprimida, a −34,29 MPa, donde $M_z\,y/I_z$ daría
              30 MPa de tracción.
    resolucion: |
      **La hipótesis** (apuntes del tema 9, apartado 9.2.1, p. 4). En flexión
      pura las únicas fuerzas de sección son los flectores $M_y$ y $M_z$,
      constantes a lo largo de la pieza. Con Navier-Bernoulli, cada sección
      sigue plana y perpendicular al eje deformado y gira alrededor de una
      recta suya, el **eje neutro**; la superficie que forman los ejes
      neutros, la superficie neutra, no cambia de longitud.

      **Las deformaciones.** Si la superficie neutra se curva con radio
      $\rho$ y dos secciones separadas $dx = \rho\,d\theta$ giran $d\theta$
      la una respecto de la otra, una fibra a distancia $\xi$ de la
      superficie neutra pasa a medir $(\rho + \xi)\,d\theta$:

      $$
      \varepsilon_x = \frac{(\rho + \xi)\,d\theta - \rho\,d\theta}{\rho\,d\theta} = \frac{\xi}{\rho} \qquad (9.1)
      $$

      Las fibras de un lado se alargan y las del otro se acortan; el eje
      neutro es la frontera.

      **Las tensiones.** Con libertad de deformación en $y$ y en $z$
      ($\sigma_y = \sigma_z = 0$) y el mismo módulo a tracción que a
      compresión:

      $$
      \sigma_x = E\,\varepsilon_x = \frac{E}{\rho}\,\xi \qquad (9.2)
      $$

      La tensión crece linealmente con la distancia al eje neutro. Falta
      saber dónde está ese eje y cuánto vale $E/\rho$, y eso lo dice el
      equilibrio.

      **Dónde está el eje neutro.** No hay axil:

      $$
      N = \int_A \sigma_x\,dA = \frac{E}{\rho}\int_A \xi\,dA = 0 \qquad (9.3,\ 9.4)
      $$

      El momento estático de la sección respecto del eje neutro es nulo: el
      eje neutro pasa por el centro de gravedad G.

      **La ley en unos ejes $y$, $z$ por G.** Con $y$ hacia abajo y $\varphi$
      el ángulo del eje neutro con $z$, positivo si sube hacia $+z$, la
      distancia de un punto al eje neutro es $\xi = y\cos\varphi + z\sin\varphi$
      (ec. 9.6), y

      $$
      \sigma_x = \frac{E}{\rho}\,(y\cos\varphi + z\sin\varphi) = C_1\,y + C_2\,z \qquad (9.7)
      $$

      **Las constantes, con los flectores.** $M_y$ y $M_z$ son los momentos
      de esas tensiones respecto de los ejes:

      $$
      M_y = \int_A \sigma_x\,z\,dA = C_1\,I_{yz} + C_2\,I_y,
      \qquad
      M_z = \int_A \sigma_x\,y\,dA = C_1\,I_z + C_2\,I_{yz} \qquad (9.8,\ 9.9)
      $$

      De ese sistema salen

      $$
      C_1 = \frac{M_y\,I_{yz} - M_z\,I_y}{I_{yz}^{2} - I_y\,I_z},
      \qquad
      C_2 = \frac{M_z\,I_{yz} - M_y\,I_z}{I_{yz}^{2} - I_y\,I_z} \qquad (9.10)
      $$

      y la distribución pedida es $\sigma_x = C_1\,y + C_2\,z$ con esos
      valores (ec. 9.11). Los apuntes la escriben también así (ec. 9.12,
      p. 8):

      $$
      \sigma_x = \frac{M'_z}{I_z}\,y + \frac{M'_y}{I_y}\,z,
      \qquad
      M'_z = \frac{M_z - M_y\,I_{yz}/I_y}{1 - I_{yz}^{2}/(I_y I_z)},
      \qquad
      M'_y = \frac{M_y - M_z\,I_{yz}/I_z}{1 - I_{yz}^{2}/(I_y I_z)}
      $$

      **El eje neutro.** Donde $\sigma_x = 0$:

      $$
      \frac{y}{z} = -\frac{M'_y\,I_z}{M'_z\,I_y} \qquad (9.13)
      $$

      una recta por G. Los puntos de tensión máxima, de tracción y de
      compresión, son los más alejados de ella, a un lado y a otro.

      **En ejes principales**, $I_{yz} = 0$, $M'_z = M_z$ y $M'_y = M_y$:

      $$
      \sigma_x = \frac{M_z}{I_z}\,y + \frac{M_y}{I_y}\,z \qquad (9.21)
      $$

      y con un solo flector, $\sigma_x = M_z\,y/I_z$ (ec. 9.23): solo
      entonces el eje neutro es el eje $z$.

      **Un ejemplo nuestro, en ejes que no son principales.** Una Z de pared
      delgada, con 120 mm de canto y alas de 60 mm, con
      $I_z = 4\cdot10^{6}$ mm⁴, $I_y = 1\cdot10^{6}$ mm⁴ e
      $I_{yz} = 1{,}5\cdot10^{6}$ mm⁴, y solo $M_z = 2$ kN·m. Como $I_{yz}$
      es positivo, con $y$ hacia abajo el ala de abajo va hacia $+z$ y la de
      arriba hacia $-z$. El denominador de la ec. 9.12 vale

      $$
      1 - \frac{I_{yz}^{2}}{I_yI_z} = 1 - \frac{2{,}25}{4} = 0{,}4375
      $$

      y, en kN·m,

      $$
      M'_z = \frac{2}{0{,}4375} = 4{,}5714,
      \qquad
      M'_y = -\frac{2\cdot1{,}5/4}{0{,}4375} = -1{,}7143
      $$

      Aunque $M_y = 0$, $M'_y$ no lo es. El eje neutro, por la ec. 9.13:

      $$
      \frac{y}{z} = -\frac{M'_y\,I_z}{M'_z\,I_y} = \frac{1{,}7143\cdot4}{4{,}5714\cdot1} = 1{,}5
      $$

      Como sobre el eje neutro $y/z = -\operatorname{tg}\varphi$,
      $\operatorname{tg}\varphi = -1{,}5$ y $\varphi \approx -56{,}31^{\circ}$:
      el eje neutro baja hacia $+z$, a 56° del eje del momento. En la punta
      del ala de abajo, $y = 60$ mm, $z = 60$ mm, con los momentos en N·mm,
      en MPa:

      $$
      \sigma_x = \frac{4{,}5714\cdot10^{6}\cdot60}{4\cdot10^{6}} + \frac{(-1{,}7143\cdot10^{6})\cdot60}{1\cdot10^{6}} = 68{,}57 - 102{,}86 = -34{,}29
      $$

      de compresión, cuando la ec. 9.23, usada fuera de los ejes
      principales, daría $M_z\,y/I_z = 30$ MPa de tracción. El eje neutro
      torcido deja la punta del ala del lado comprimido; en la unión del ala
      con el alma ($z = 0$), a la misma altura, la tensión es de
      $68{,}57$ MPa de tracción.

      **Comprobaciones.** Las cifras del ejemplo salen del motor del curso
      (los coeficientes de la ec. 9.10, el eje neutro y la tensión en el
      punto) y, por un segundo camino, de la ec. 9.12 con $M'_z$ y $M'_y$,
      como arriba.

  # ── Teoría · cuestión 2 · dos vigas cruzadas con la carga en el cruce.
  #    Impresa «2.(1p)» y repetida el mismo día como cuestión 4 del examen
  #    final («4.(1p)»): la final apunta a este ejercicio. En el PDF de los
  #    dos la figura sale sin rótulos; A, B, C, D, E y P son del Word.
  - id: exerm2223-2par-2-las-vigas-cruzadas
    titulo: Dos vigas cruzadas, la de arriba cargada en el cruce
    fuente: >-
      Cuestión 2 de teoría · Segunda parte del 13 de enero de 2023 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Cayó igual el mismo día como
      cuestión 4 del examen final, donde también vale 1 punto. En el PDF de
      los dos exámenes la figura sale sin rótulos, y se han leído en el Word
      original. El examen no publica resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      (1p)Las vigas AB y DE que se muestran en la figura tienen la misma
      rigidez a flexión $EI$. Para la carga mostrada P, determinar:

      a) El desplazamiento del punto C

      b) Diagrama de momentos flectores y fuerzas cortantes.

      $L_{AB} = 4/5\ L_{DE}$ y $L_{DE} = L$

