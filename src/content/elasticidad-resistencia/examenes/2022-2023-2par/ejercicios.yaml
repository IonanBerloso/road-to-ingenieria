          - punto: |
              Recta de $qL/2$ a $-qL/2$ en CD, con el cero en el centro del
              tramo.
            porque: |
              La carga repartida baja el cortante $qL$ a lo largo del tramo, y
              el tirante lo devuelve a cero en D.
          - punto: |
              Flector nulo en A, $-7qL^{2}/8$ en B, nulo en C y parábola en CD
              con el máximo, $qL^{2}/8$, en el centro.
            porque: |
              En la rótula el flector es cero por definición. El de B es
              negativo, con la fibra superior traccionada, y es el mayor de la
