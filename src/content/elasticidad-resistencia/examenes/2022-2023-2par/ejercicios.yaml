      <text x="240" y="36" font-size="14" font-weight="bold" fill="var(--ink)">P</text>
      <text x="101" y="68" text-anchor="end" font-size="14" fill="var(--ink)">A</text>
      <text x="361" y="186" font-size="14" fill="var(--ink)">B</text>
      <text x="69" y="197" text-anchor="end" font-size="14" fill="var(--ink)">D</text>
      <text x="389" y="55" font-size="14" fill="var(--ink)">E</text>
      <text x="212" y="154" font-size="14" fill="var(--ink)">C</text>
      </svg>
      <figcaption>

      Redibujada del enunciado. En el PDF la figura sale sin rótulos: las
      letras A, B, C, D, E y la P son las del Word original.

      </figcaption>
      </figure>

      **Notas nuestras.** El texto no dice dónde se cruzan las vigas ni cómo
      son los apoyos. Se toma lo que dibuja la figura: el cruce C, en el
      centro de las dos vigas, y cada extremo sobre un apoyo puntual que no
      impide el giro.
    pide: >-
      El desplazamiento vertical de C y los diagramas de cortantes y de
      flectores de las dos vigas.
    pasos:
      - tipo: reconocer
        pregunta: |
          AB descansa sobre DE en C. ¿Qué condición da la fuerza que se pasan
          las dos vigas?
        opciones:
          - texto: >-
              Que en C las dos bajan lo mismo, porque una se apoya en la otra
              y no se separan
            correcta: true
            mensaje: |
              Eso es. Con cuatro apoyos y dos vigas el problema es
              hiperestático de grado uno: la fuerza $X$ que AB pasa a DE es la
              incógnita, y la condición que falta es la de compatibilidad, la
              flecha de AB en C igual a la de DE en C (apuntes del tema 11,
              apartado 11.2, p. 4).
          - texto: >-
              Que cada viga se lleve la mitad de P, porque las dos tienen la
              misma EI
            mensaje: |
              La misma EI no las hace igual de rígidas: la flecha de una viga
              biapoyada con la carga en el centro es $FL^{3}/48EI$, y va con el
              **cubo** de la luz. AB, con 4/5 de la luz de DE, es
              $1/0{,}8^{3} = 1{,}95$ veces más rígida, y se lleva más.
          - texto: >-
              Que se repartan P en proporción inversa a sus longitudes
            mensaje: |
              Va por buen camino, pero la rigidez de una viga a flexión no va
              con la luz: va con su cubo, $48EI/L^{3}$. Con la luz sola el
              reparto sale 5/9 y 4/9, y no es el bueno.
          - texto: >-
              El equilibrio vertical de las dos vigas, que reparte P entre los
              cuatro apoyos
            mensaje: |
              El equilibrio da la suma, $P$, pero no cómo se reparte entre las
              dos vigas: hay una incógnita más que ecuaciones de la estática.
              La que falta es una ecuación de deformación.
      - tipo: calcular
        titulo: La fuerza entre las dos vigas
        pregunta: |
          Llama $X$ a la fuerza que AB hace sobre DE en C. ¿Cuánto vale $X/P$?
        respuesta:
          tipo: numero
          valor: '0.338624'
          tolerancia: 0.0005
          formato: un número, X en unidades de P; forma exacta (64/189)
        distractores:
          - valor: '0.661376'
            mensaje: |
              Es $P - X$, lo que se queda AB. Has cambiado los papeles de las
              dos vigas: la corta, AB, es la más rígida y se lleva la parte
              grande; a DE, la de abajo, le llega la pequeña.
          - valor: '0.444444'
            mensaje: |
              Has repartido con la luz en lugar de con su cubo. La flecha de
              cada viga va con $L^{3}$: la condición es
              $(P - X)\,0{,}8^{3} = X$, no $(P - X)\,0{,}8 = X$.
          - valor: '0.5'
            mensaje: |
              Es el reparto a medias, como si las dos vigas fueran igual de
              rígidas. Tienen la misma EI pero no la misma luz, y la rigidez
              va con $1/L^{3}$.
        pista: |
          Flecha de AB en C: $(P - X)(0{,}8L)^{3}/48EI$. Flecha de DE en C:
          $XL^{3}/48EI$. Iguálalas.
        desarrollo: |
          $$
          \frac{(P - X)(0{,}8L)^{3}}{48EI} = \frac{XL^{3}}{48EI}
          \;\Longrightarrow\;
          X\,(1 + 0{,}512) = 0{,}512\,P
          $$

          $$
          \frac{0{,}512}{1{,}512} = 0{,}33862
          \qquad\Longrightarrow\qquad
          X = \frac{64}{189}\,P,\quad P - X = \frac{125}{189}\,P
          $$
      - tipo: calcular
        titulo: El desplazamiento de C
        pregunta: |
          ¿Cuánto baja C? Da $v_C$ en unidades de $10^{-3}\,PL^{3}/EI$.
        respuesta:
          tipo: numero
          valor: '7.05467'
          tolerancia: 0.005
          formato: un número, en 10⁻³ PL³/EI; forma exacta (4000/567)
        distractores:
          - valor: '10.6667'
            mensaje: |
              Es la flecha de AB si cargara ella sola con toda la P,
              $(0{,}8L)^{3}/48$. DE la ayuda: con la $X$ que le pasa, AB solo
              soporta $125P/189$ y baja menos.
          - valor: '5.33333'
            mensaje: |
              Es la flecha de AB con media P. El reparto a medias no es el
              bueno: AB es más rígida y se lleva $125P/189$, no $P/2$.
          - valor: '31.5'
            mensaje: |
              Has sumado las flechas de las dos vigas con toda la P, como si
              una colgara de la otra. Están en paralelo: se reparten la carga
              y bajan **lo mismo** en C.
        pista: |
          $v_C$ es la flecha de cualquiera de las dos; la de DE es la más
          sencilla, $XL^{3}/48EI$.
        desarrollo: |
          $$
          v_C = \frac{XL^{3}}{48EI} = \frac{64}{189\cdot48}\,\frac{PL^{3}}{EI} = \frac{4}{567}\,\frac{PL^{3}}{EI}
          $$

          $$
          \frac{4}{567} = 0{,}0070547
          $$

          La de AB da lo mismo: $\tfrac{125}{189}\cdot\tfrac{0{,}512}{48} = \tfrac{4}{567}$.
      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de cortantes y de flectores de las dos
          vigas**, cada una con su luz, con los valores en los apoyos y en C.
        comprueba:
          - punto: |
              **AB**: cortante de $125P/378$ de A a C y de $-125P/378$ de C a B,
              con un salto de $125P/189$ en C.
            porque: |
              AB se queda $P - X = 125P/189$ en su centro, y cada apoyo se
              lleva la mitad. El salto en C es la carga neta que recibe AB.
          - punto: |
              **AB**: flector en triángulo, nulo en A y en B, con el máximo en
              C, $25PL/189 \approx 0{,}132\,PL$.
            porque: |
              Es $(P - X)\,L_{AB}/4$ con $L_{AB} = 0{,}8L$. Con $L$ en lugar de
              $0{,}8L$ el máximo sale un 25 % más grande.
          - punto: |
              **DE**: cortante de $\pm 32P/189$ y flector en triángulo con el
              máximo en C, $16PL/189 \approx 0{,}085\,PL$.
            porque: |
              DE solo recibe la $X = 64P/189$ que le pasa AB, y su máximo es
              $XL/4$.
          - punto: |
              Los dos flectores **positivos**, con la fibra inferior
              traccionada.
            porque: |
              Las dos vigas están cargadas hacia abajo en el centro y apoyadas
              en los extremos. Un flector negativo en DE diría que la $X$ se ha
              puesto hacia arriba sobre ella.
        figura: |
          <svg viewBox="0 0 470 300" role="img" width="470" height="300" aria-labelledby="exerm2223-2par-2-diagramas-dib-t exerm2223-2par-2-diagramas-dib-d">
          <title id="exerm2223-2par-2-diagramas-dib-t">Diagramas de cortantes y de flectores de las vigas AB y DE</title>
          <desc id="exerm2223-2par-2-diagramas-dib-d">Cuatro diagramas, a escala. A la izquierda, la viga AB: cortante constante de 125/378 de P en la mitad izquierda y de menos 125/378 de P en la derecha, con el salto en C; flector en triángulo, cero en los apoyos y máximo de 25/189 de PL en C. A la derecha, la viga DE, más larga: cortante de 32/189 de P y menos 32/189 de P, y flector en triángulo con máximo de 16/189 de PL en C. Flectores positivos hacia arriba.</desc>
          <text x="126" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--ink)">AB (4L/5)</text>
          <text x="355" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--ink)">DE (L)</text>
          <line x1="50" y1="90" x2="202" y2="90" stroke="var(--ink)" stroke-width="1"/>
          <path d="M50 90 L50 50.3 L126 50.3 L126 129.7 L202 129.7 L202 90 Z" fill="var(--d1)" fill-opacity=".15" stroke="var(--d1)" stroke-width="1.6"/>
          <text x="28" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--ink)">V</text>
          <text x="88" y="44.3" text-anchor="middle" font-size="11" fill="var(--d1)">125P/378</text>
          <text x="164" y="145.7" text-anchor="middle" font-size="11" fill="var(--d1)">−125P/378</text>
          <line x1="50" y1="250" x2="202" y2="250" stroke="var(--ink)" stroke-width="1"/>
          <path d="M50 250 L126 197.1 L202 250 Z" fill="var(--d3)" fill-opacity=".15" stroke="var(--d3)" stroke-width="1.6"/>
          <text x="28" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--ink)">M</text>
          <text x="126" y="191.1" text-anchor="middle" font-size="11" fill="var(--d3)">25PL/189</text>
          <line x1="260" y1="90" x2="450" y2="90" stroke="var(--ink)" stroke-width="1"/>
          <path d="M260 90 L260 69.7 L355 69.7 L355 110.3 L450 110.3 L450 90 Z" fill="var(--d1)" fill-opacity=".15" stroke="var(--d1)" stroke-width="1.6"/>
          <text x="238" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--ink)">V</text>
          <text x="307.5" y="63.7" text-anchor="middle" font-size="11" fill="var(--d1)">32P/189</text>
          <text x="402.5" y="126.3" text-anchor="middle" font-size="11" fill="var(--d1)">−32P/189</text>
          <line x1="260" y1="250" x2="450" y2="250" stroke="var(--ink)" stroke-width="1"/>
          <path d="M260 250 L355 216.1 L450 250 Z" fill="var(--d3)" fill-opacity=".15" stroke="var(--d3)" stroke-width="1.6"/>
          <text x="238" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--ink)">M</text>
          <text x="355" y="210.1" text-anchor="middle" font-size="11" fill="var(--d3)">16PL/189</text>
          <text x="126" y="290" text-anchor="middle" font-size="11" fill="var(--ink)">C, en el centro</text>
          <text x="355" y="290" text-anchor="middle" font-size="11" fill="var(--ink)">C, en el centro</text>
          </svg>
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La fuerza $X$ entre las dos vigas es la incógnita hiperestática,
              y AB recibe $P - X$ en su centro.
          - texto: >-
              Compatibilidad en C, $(P - X)(0{,}8L)^{3}/48EI = XL^{3}/48EI$, de
              donde $X = 64P/189$.
          - texto: >-
              $v_C = XL^{3}/48EI = 4PL^{3}/567EI$, unos
              $7{,}05\cdot10^{-3}\,PL^{3}/EI$.
          - texto: >-
              Cada viga es biapoyada con una carga en el centro, AB con
              $125P/189$ y DE con $64P/189$, y de ahí sus diagramas.
          - texto: >-
              Como las dos vigas tienen la misma rigidez EI, cada una se lleva
              la mitad de P.
            trampa: true
            mensaje: |
              EI es la rigidez de la **sección**. La de la viga, lo que cuesta
              hacerla bajar en el centro, es $48EI/L^{3}$, y con 4/5 de la luz
              AB es casi el doble de rígida que DE.
    resolucion: |
      **La idea.** AB está encima y recibe la carga; DE la sostiene en C. Las
      dos vigas son isostáticas por separado, pero el conjunto tiene una
      incógnita de más: la fuerza $X$ que AB pasa a DE. La ecuación que falta
      es de compatibilidad: las dos bajan lo mismo en C (apuntes del tema 11,
      apartado 11.2, p. 4).

      **La compatibilidad.** Cada viga es biapoyada con una carga en el centro,
      cuya flecha es $FL^{3}/48EI$. AB, de luz $0{,}8L$, recibe $P - X$; DE, de
      luz $L$, recibe $X$:

      $$
      \frac{(P - X)(0{,}8L)^{3}}{48EI} = \frac{XL^{3}}{48EI}
      \;\Longrightarrow\;
      X = \frac{0{,}512}{1{,}512}\,P = \frac{64}{189}\,P \approx 0{,}339\,P
      $$

      AB se queda $125P/189 \approx 0{,}661\,P$: la viga corta, más rígida, se
      lleva casi dos tercios.

      **a) El desplazamiento de C.**

      $$
      v_C = \frac{XL^{3}}{48EI} = \frac{4}{567}\,\frac{PL^{3}}{EI} \approx 7{,}05\cdot10^{-3}\,\frac{PL^{3}}{EI}
      $$

      hacia abajo. Con AB sola saldría $10{,}67\cdot10^{-3}\,PL^{3}/EI$: DE le
      quita un tercio de la flecha.

      **b) Los diagramas.** Las dos son biapoyadas con una carga en el centro:
      cortante constante a cada lado, con el salto en C, y flector en
      triángulo con el máximo en C.

      | | AB ($L_{AB} = 0{,}8L$) | DE ($L_{DE} = L$) |
      |---|---|---|
      | carga en C | $125P/189$ | $64P/189$ |
      | cortante | $\pm 125P/378 \approx \pm 0{,}331\,P$ | $\pm 32P/189 \approx \pm 0{,}169\,P$ |
      | flector máximo, en C | $25PL/189 \approx 0{,}132\,PL$ | $16PL/189 \approx 0{,}085\,PL$ |

      Los dos flectores son positivos: fibra inferior traccionada.

  # ── Teoría · cuestión 3 · el teorema de reciprocidad. Impresa «3.(1p)»,
  #    con el título y nada más.
  - id: exerm2223-2par-3-el-teorema-de-reciprocidad
    titulo: Los teoremas de reciprocidad de los trabajos y de los desplazamientos
    fuente: >-
      Cuestión 3 de teoría · Segunda parte del 13 de enero de 2023 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 13, apartado 13.3
      (págs. 6 y 7). Los números del paso de cálculo son un ejemplo nuestro.
    nivel: examen
    enunciado: |
      (1p) Teorema de reciprocidad.
    pide: >-
      El enunciado de los teoremas de reciprocidad, el de los trabajos y el de
      los desplazamientos, con su deducción.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de escribir: ¿de qué se parte para deducirlo?
        opciones:
          - texto: >-
              De cargar el mismo sistema con dos fuerzas en los dos órdenes
              posibles, que acaban en el mismo estado y con el mismo trabajo
            correcta: true
            mensaje: |
              Eso es. En el proceso I se aplica $F_1$ y después $F_2$; en el II,
              al revés (apuntes del tema 13, apartado 13.3, p. 6). En pequeños
              desplazamientos el trabajo no depende del orden, y al igualar los
              dos solo sobreviven los términos cruzados.
          - texto: >-
              De aplicar las dos fuerzas a la vez y separar el trabajo de cada
              una
            mensaje: |
              Aplicadas a la vez, cada fuerza crece desde cero junto con su
              desplazamiento total, y su trabajo es $\tfrac{1}{2}F\delta$ con
              el desplazamiento entero: el término cruzado no queda aislado. Lo
              que lo aísla es aplicar una fuerza cuando la otra ya tiene su
              valor final.
          - texto: >-
              Del teorema de Castigliano aplicado a cada una de las fuerzas
            mensaje: |
              Castigliano viene después (apartado 13.4, p. 7) y necesita la
              energía como función de estado. La reciprocidad es más sencilla:
              solo usa el trabajo de las fuerzas en dos procesos de carga.
          - texto: >-
              De la simetría del tensor de tensiones, $\tau_{xy} = \tau_{yx}$
            mensaje: |
              Esa es la reciprocidad de las tensiones tangenciales del tema 2,
              que sale del equilibrio de momentos de un elemento. Comparte el
              nombre, pero este teorema es otro: habla de fuerzas y de
              desplazamientos de un cuerpo entero.
      - tipo: calcular
        titulo: Lo que baja el centro de una ménsula con la carga en la punta
        pregunta: |
          Una ménsula de longitud $L$ y rigidez $EI$ lleva una carga $P$ en el
          extremo. ¿Cuánto baja su punto medio? Da el número $c$ de
          $c\,PL^{3}/EI$.
        respuesta:
          tipo: numero
          valor: '0.104167'
          tolerancia: 0.0002
          formato: un número; forma exacta (5/48)
        distractores:
          - valor: '0.333333'
            mensaje: |
              Es lo que baja el **extremo**, $PL^{3}/3EI$. La pregunta es por
              el punto medio, que baja menos.
          - valor: '0.0416667'
            mensaje: |
              Es lo que baja el punto medio con la carga **en el punto medio**,
              $P(L/2)^{3}/3EI$. Con la carga en el extremo, el tramo medio
              soporta un flector mayor y baja más.
        pista: |
          Por Maxwell es lo mismo que baja el extremo con $P$ en el punto
          medio, que es más fácil: la flecha del punto medio más su giro por
          la mitad de la luz que queda.
        desarrollo: |
          Con $P$ en el punto medio, ese punto baja $P(L/2)^{3}/3EI = PL^{3}/24EI$
          y gira $P(L/2)^{2}/2EI = PL^{2}/8EI$; el tramo libre lo lleva hasta
          el extremo como un sólido rígido:

          $$
          \delta = \frac{PL^{3}}{24EI} + \frac{PL^{2}}{8EI}\cdot\frac{L}{2}
          = \frac{5}{48}\,\frac{PL^{3}}{EI}
          $$

          $$
          \frac{1}{24} + \frac{1}{16} = 0{,}10417
          $$

          Por el teorema de Maxwell, eso es lo que baja el punto medio con $P$
          en el extremo. Directamente, con $v(x) = Px^{2}(3L - x)/6EI$ en
          $x = L/2$, sale lo mismo.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la respuesta completa, como en el examen, los dos procesos de
          carga, el trabajo de cada uno y los dos teoremas que salen.
        rubrica:
          - punto: >-
              Se dice de qué sistema se habla, isostático, elástico lineal y sin
              desplazamientos iniciales, y se definen δij, el desplazamiento en
              el punto i debido a la fuerza Fj.
            porque: >-
              Sin la definición de los subíndices el teorema no se puede leer, y
              es justo donde se equivoca quien lo aplica al revés.
            minimo: true
          - punto: >-
              Se describen los dos procesos, I (F1 y después F2) y II (F2 y
              después F1).
            porque: >-
              Toda la deducción cuelga de cambiar el orden de carga.
            minimo: true
          - punto: >-
              Se escriben los dos trabajos, WI = ½F1δ11 + ½F2δ22 + F1δ12 y
              WII = ½F1δ11 + ½F2δ22 + F2δ21 (ecs. 13.5 y 13.6), explicando por
              qué el término cruzado no lleva el ½.
            porque: >-
              Es el paso que hay que entender. Cuando llega la segunda fuerza,
              la primera ya tiene su valor final y trabaja entera sobre el
              desplazamiento que provoca la otra.
            minimo: true
          - punto: >-
              Se igualan los dos trabajos, porque en pequeños desplazamientos no
              dependen del orden, y sale F1δ12 = F2δ21, el teorema de Betti
              (ec. 13.7).
            porque: >-
              Es el primero de los dos teoremas que pide la pregunta.
            minimo: true
          - punto: >-
              Con F1 = F2 queda δ12 = δ21, el teorema de Maxwell (ec. 13.8).
            porque: >-
              Es la forma que se usa en los problemas, y conviene decir que
              vale también entre una fuerza y un momento, con giros en vez de
              flechas.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Proceso I, primero $F_1$ en 1 y después $F_2$ en 2. Proceso II,
              al revés.
          - texto: >-
              En el I, $W_I = \tfrac{1}{2}F_1\delta_{11} + \tfrac{1}{2}F_2\delta_{22}
              + F_1\delta_{12}$, porque $F_1$ ya está entera cuando $F_2$ mueve
              el punto 1.
          - texto: >-
              En el II, $W_{II} = \tfrac{1}{2}F_1\delta_{11} + \tfrac{1}{2}F_2\delta_{22}
              + F_2\delta_{21}$.
          - texto: >-
              El estado final es el mismo, así que $W_I = W_{II}$ y
              $F_1\delta_{12} = F_2\delta_{21}$; con $F_1 = F_2$,
              $\delta_{12} = \delta_{21}$.
          - texto: >-
              El término cruzado lleva también el $\tfrac{1}{2}$, porque las dos
              fuerzas crecen desde cero.
            trampa: true
            mensaje: |
              Cada fuerza crece desde cero mientras se aplica, pero $F_1$ ya ha
              terminado de crecer cuando llega $F_2$. Durante la segunda carga
              $F_1$ vale lo que vale y recorre $\delta_{12}$: su trabajo es
              $F_1\delta_{12}$, sin el medio.
    resolucion: |
      **El sistema.** Un sistema isostático, elástico lineal y sin
      desplazamientos iniciales, con dos fuerzas $F_1$ y $F_2$ en los puntos 1
      y 2. $\delta_{ij}$ es el desplazamiento del punto $i$, en la dirección
      de $F_i$, debido a $F_j$ (apuntes del tema 13, apartado 13.3, p. 6).

      **Los dos procesos de carga.** En el I se aplica $F_1$ y después $F_2$;
      en el II, primero $F_2$ y después $F_1$.

      En el I, mientras crece $F_1$ trabaja $\tfrac{1}{2}F_1\delta_{11}$;
      después crece $F_2$, que trabaja $\tfrac{1}{2}F_2\delta_{22}$, y mueve
      el punto 1 una cantidad $\delta_{12}$ con $F_1$ ya entera, que trabaja
      $F_1\delta_{12}$ sin el medio (ec. 13.5):

      $$
      W_I = \tfrac{1}{2}F_1\delta_{11} + \tfrac{1}{2}F_2\delta_{22} + F_1\delta_{12}
      $$

      En el II, de la misma forma (ec. 13.6):

      $$
      W_{II} = \tfrac{1}{2}F_1\delta_{11} + \tfrac{1}{2}F_2\delta_{22} + F_2\delta_{21}
      $$

      **Betti.** En pequeños desplazamientos el estado final no depende del
      orden de carga, y el trabajo tampoco: $W_I = W_{II}$. Los dos primeros
      términos se van y queda el **teorema de reciprocidad de los trabajos**
      (ec. 13.7, p. 7):

      $$
      F_1\,\delta_{12} = F_2\,\delta_{21}
      $$

      El trabajo de la primera fuerza sobre el desplazamiento que causa la
      segunda es igual al de la segunda sobre el que causa la primera.

      **Maxwell.** Si las dos fuerzas son iguales, queda el **teorema de
      reciprocidad de los desplazamientos** (ec. 13.8):

      $$
      \delta_{12} = \delta_{21}
      $$

      Vale igual entre una fuerza y un momento, con un giro en lugar de una
      flecha.

      **Un ejemplo.** En una ménsula de longitud $L$, lo que baja el punto
      medio con $P$ en el extremo es lo que baja el extremo con $P$ en el
      punto medio: $5PL^{3}/48EI$ los dos. El segundo se calcula sin
      integrar, con la flecha y el giro del punto medio.

  # ── Teoría · cuestión 4 · la tensión tangencial en una sección cerrada de
  #    pared delgada. Impresa «4.(1p)».
  - id: exerm2223-2par-4-la-tension-tangencial-en-una-seccion-cerrada
    titulo: La tensión tangencial de torsión en una sección cerrada de pared delgada
    fuente: >-
      Cuestión 4 de teoría · Segunda parte del 13 de enero de 2023 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 12, apartado 12.5
      (págs. 11 y 12). Los números del paso de cálculo son un ejemplo nuestro.
    nivel: examen
    enunciado: |
      (1p) Torsión en secciones cerradas de pared delgada. Deducir la
      tensión tangencial.
    pide: >-
      La expresión de la tensión tangencial en la pared de una sección cerrada
      de pequeño espesor sometida a un momento torsor, deducida.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de deducir nada: ¿qué se conserva a lo largo de toda la pared?
        opciones:
          - texto: >-
              El producto de la tensión por el espesor, el flujo cortante, así
              que donde la pared es más delgada la tensión es mayor
            correcta: true
            mensaje: |
              Eso es. Aislando un trozo de pared de longitud $dx$ entre dos
              puntos A y B, el equilibrio según el eje da
              $\tau_A t_A = \tau_B t_B$ (ec. 12.21, p. 11): el flujo cortante
              $q_t = \tau t$ es el mismo en toda la sección.
          - texto: >-
              La tensión tangencial, que es la misma en toda la pared
            mensaje: |
              Solo si el espesor es constante. Lo que se conserva es
              $\tau t$; si la pared adelgaza, la tensión sube en la misma
              proporción.
          - texto: >-
              Nada: la tensión crece con la distancia al centro de gravedad,
              como en una sección circular maciza
            mensaje: |
              Eso es la sección circular maciza, $\tau = M_t r/I_p$. En una pared
              delgada la tensión es uniforme en el espesor (analogía de
              Prandtl) y lo que manda es el espesor, no la distancia al centro.
          - texto: >-
              El producto del espesor por la distancia al centro de gravedad
            mensaje: |
              La distancia $r$ aparece al calcular el momento de la fuerza de
              cada trozo de pared, $dM_t = \tau t\,ds\,r$ (ec. 12.22), pero no se
              conserva. Lo que se conserva es $\tau t$, y por eso sale de la
              integral.
      - tipo: calcular
        titulo: Un cajón rectangular a torsión
        pregunta: |
          Un cajón rectangular mide $200 \times 100$ mm en la línea media, con
          las paredes de 200 mm de 8 mm de espesor y las de 100 mm de 5 mm. Con
          $M_t = 20$ kN·m, ¿cuánto vale la tensión tangencial máxima, en MPa?
        respuesta:
          tipo: numero
          valor: '100'
          tolerancia: 0.2
          formato: un número, en MPa
        distractores:
          - valor: '200'
            mensaje: |
              Te ha faltado el 2 de $2A_t$. El momento del flujo es
              $q_t\oint r\,ds$, y $\oint r\,ds$ es **el doble** del área
              encerrada, porque cada $r\,ds$ es el doble del triangulito
              $dA_t$.
          - valor: '62.5'
            mensaje: |
              Es la tensión en las paredes de 8 mm. El flujo es el mismo en las
              cuatro, y la máxima está donde el espesor es mínimo, en las de
              5 mm.
          - valor: '90.33'
            mensaje: |
              Has tomado el área por el contorno **exterior**, $205 \times 108$.
              $A_t$ es el área encerrada por la línea media, $200 \times 100$.
          - valor: '111.48'
            mensaje: |
              Has tomado el área del **hueco**, $195 \times 92$. $A_t$ es el
              área encerrada por la línea media, $200 \times 100$.
        pista: |
          $A_t = 200\cdot100$ mm², $q_t = M_t/2A_t$ y $\tau = q_t/t$ con el
          espesor menor.
        desarrollo: |
          $$
          q_t = \frac{M_t}{2A_t} = \frac{20\cdot10^{6}}{2\cdot20000} = 500\ \text{N/mm}
          $$

          $$
          \tau_{100} = \frac{500}{5} = 100\ \text{MPa},
          \qquad
          \tau_{200} = \frac{500}{8} = 62{,}5\ \text{MPa}
          $$
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción completa, como en el examen, desde el equilibrio
          de un trozo de pared hasta la tensión tangencial.
        rubrica:
          - punto: >-
              Se dice la hipótesis, en una pared delgada la tensión es uniforme
              en el espesor y tangente a la línea media (analogía de Prandtl).
            porque: >-
              Sin ella no se puede hablar de una sola τ en cada punto de la
              línea media.
          - punto: >-
              Se aísla un trozo de pared de longitud dx entre dos puntos A y B
              y, por el equilibrio según x, τA tA = τB tB (ec. 12.21).
            porque: >-
              Es el paso clave, el flujo cortante qt = τt es uniforme en la
              sección.
            minimo: true
          - punto: >-
              Se escribe el momento de la fuerza de un elemento de pared,
              dMt = τ t ds r (ec. 12.22), y se integra a lo largo de la línea
              media, Mt = τt ∮ r ds (ec. 12.23).
            porque: >-
              Es el equilibrio entre la tensión y el momento torsor, y τt sale
              de la integral porque es constante.
            minimo: true
          - punto: >-
              Se reconoce ½ r ds como el área del triangulito dAt, de modo que
              ∮ r ds = 2At, con At el área encerrada por la línea media.
            porque: >-
              Es de donde sale el 2 de la fórmula, el término que más se olvida.
            minimo: true
          - punto: >-
              Se llega a τ = Mt / (2 At t) (ec. 12.24) y se dice que la máxima
              está donde el espesor es mínimo.
            porque: >-
              Es el resultado que pide la pregunta, con la consecuencia que se
              usa para dimensionar.
            minimo: true
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              En pared delgada la tensión es uniforme en el espesor; el
              equilibrio de un trozo de pared da $\tau_A t_A = \tau_B t_B$, y
              $q_t = \tau t$ es constante.
          - texto: >-
              El torsor es la suma de los momentos de cada elemento,
              $M_t = \tau t\oint r\,ds$.
          - texto: >-
              Como $\tfrac{1}{2}r\,ds = dA_t$, la integral vale $2A_t$, con
              $A_t$ el área encerrada por la línea media.
          - texto: >-
              $\tau = M_t/(2A_t t)$, máxima donde la pared es más delgada.
          - texto: >-
              $A_t$ es el área de material de la sección, la suma de espesor
              por longitud de cada pared.
            trampa: true
            mensaje: |
              $A_t$ es el área **encerrada** por la línea media, hueco
              incluido. Por eso una sección cerrada es tan buena a torsión: lo
              que trabaja es el hueco, no la cantidad de material.
    resolucion: |
      **La hipótesis.** En una pared delgada la tensión tangencial es
      uniforme en el espesor y tangente a la línea media (analogía de
      Prandtl; apuntes del tema 12, apartado 12.5, p. 11).

      **El flujo cortante es constante.** Se aísla un trozo de pared de
      longitud $dx$ entre dos cortes longitudinales en A y B, de espesores
      $t_A$ y $t_B$. Por la reciprocidad de las tangenciales, en los cortes
      actúan $\tau_A$ y $\tau_B$ según el eje, y el equilibrio en $x$ da
      (ec. 12.21):

      $$
      \tau_A\,t_A = \tau_B\,t_B
      $$

      El flujo cortante $q_t = \tau t$ es el mismo en toda la sección.

      **El equilibrio con el torsor.** La fuerza sobre un elemento de pared
      $dA = t\,ds$ es $\tau t\,ds$, y su momento respecto a un punto
      cualquiera, con brazo $r$, es $dM_t = \tau t\,ds\,r$ (ec. 12.22).
      Integrando a lo largo de la línea media y sacando $\tau t$, que es
      constante (ec. 12.23):

      $$
      M_t = \tau t\oint r\,ds
      $$

      **El área encerrada.** $\tfrac{1}{2}r\,ds$ es el área del triangulito
      con vértice en el punto y base $ds$, así que $\oint r\,ds = 2A_t$, con
      $A_t$ el área encerrada por la línea media (p. 12). Queda (ec. 12.24):

      $$
      \tau = \frac{M_t}{2A_t\,t}
      $$

      **Qué dice.** La tensión máxima está donde el espesor es mínimo, y lo
      que más importa es el área encerrada, que es casi toda hueco: las
      secciones cerradas de pequeño espesor son las más adecuadas a torsión.

      **Un ejemplo.** Un cajón de $200 \times 100$ mm en la línea media, con
      paredes de 8 y 5 mm, y $M_t = 20$ kN·m: $q_t = 20\cdot10^{6}/(2\cdot20000) =
      500$ N/mm, y la tensión es de 100 MPa en las paredes de 5 mm y de
      62,5 MPa en las de 8 mm.

  # ── Problema 1 · el eje empotrado y el tirante en C. Impreso «1.(2p)», y
  #    el mismo día, igual, como problema 2 de la final («2.(1,5p)»).
  - id: exerm2223-2par-5-el-eje-y-el-tirante
    titulo: Un eje corto empotrado, colgado de un tirante por el borde de su extremo
    fuente: >-
      Problema 1 · Segunda parte del 13 de enero de 2023 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 2 puntos. Cayó igual el mismo día como problema 2 del examen final,
      donde vale 1,5 puntos; el enunciado se transcribe sin su «(2p)», y cada
      hoja pone sus puntos. El examen no publica resolución; el desarrollo es
      nuestro.
    nivel: examen
    enunciado: |
      El eje empotrado de sección circular de longitud L/3 y diámetro
      L/20 se sustenta mediante un tirante de longitud L y diámetro L/100 en
      el punto C.

      Sabiendo que el eje soporta una carga **P** aplicada en su centro de
      gravedad, determinar:

      a) La fuerza T del tirante, siendo E=2G.

