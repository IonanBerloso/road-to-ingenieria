      **Notas nuestras.** En la figura, $k_A = EI/2L^{3}$ y $k_B = EI/L^{3}$.
      La cota 16t va de la cara interior de un ala a la de la otra (así está
      en el Word), y el canto total es 18t. Del tirante DF no se da ningún
      dato: se toma inextensible. M es el punto donde el alma se une al ala
      de arriba, y la τ se da del lado del alma. «modulo» y «rotula», sin
