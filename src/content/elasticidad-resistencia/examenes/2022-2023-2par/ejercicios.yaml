    fuente: >-
      Problema 2 · Segunda parte del 13 de enero de 2023 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 2 puntos. Cayó igual el mismo día como problema 3 del examen final,
      donde vale 1,5 puntos; el enunciado se transcribe sin su «(2p)», y cada
      hoja pone sus puntos. En el PDF de los dos exámenes la cota de AB se
      queda en «2»; «2L» se ha leído en el Word original. El examen no
      publica resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      La estructura de la figura está formada por una viga ABCD,
      apoyada en dos resortes elásticos de constantes $k_A$ y $k_B$, y
      sustentada en D por el tirante articulado DF. En C hay una rótula
      intermedia.

      La sección de la viga se muestra en la figura. El material es acero
      de modulo elástico $E$. El conjunto soporta una carga concentrada
      $P = (3/8)qL$ en la rotula C y una carga uniformemente distribuida $q$
      en el tramo CD. El espesor de toda la sección es $t$. Determinar:

      a/ Diagramas V y M.

      b/ Desplazamiento en C, en función de q, L, E, e I,

      c/ Siendo L=1 m, t=10mm y q=40N/mm determinar σ y τ en el punto M de
      la sección más desfavorable.

