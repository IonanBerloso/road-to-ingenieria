      <desc id="exerm2223-2par-7-la-barra-quebrada-con-un-muelle-fig-d">Dos vistas de la misma estructura de sección circular. A la izquierda, en perspectiva con Z hacia arriba, X a la derecha e Y en diagonal: la barra AB sale de una pared en A y avanza según X una longitud L, acotada encima; desde B salen dos brazos hacia abajo, uno corto hacia D, donde baja la carga P, y otro largo hacia C, que se apoya en un muelle K sobre el suelo. A la derecha, la vista en el plano YZ, con Z hacia arriba e Y a la derecha: los dos brazos forman una V invertida con el vértice en B; el de la izquierda baja hasta C, sobre el muelle K, y el de la derecha hasta D, donde actúa P; cada brazo forma 45° con la horizontal que pasa por B, y una cota vertical 2L va de la altura de B a la de D.</desc>
