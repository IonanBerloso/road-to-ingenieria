      **Notas nuestras.** Se lee lo que dibuja la figura: P está en el
      centro de la sección del extremo (el texto dice «en su centro de
      gravedad»), y C es el punto del borde de esa sección que está a la
      altura de su centro, donde se engancha el tirante. El desplazamiento
      de C se entiende vertical.
    pide: >-
      La fuerza del tirante, con E = 2G, y el desplazamiento vertical de C en
      función de P, E y L.
    pasos:
      - tipo: reconocer
        pregunta: |
          El tirante tira de C, en el borde de la sección del extremo, y no de
          su centro. ¿Qué cambia eso?
        opciones:
          - texto: >-
              Que el eje, además de flectar, se tuerce, y ese giro de la
              sección también mueve C en vertical
            correcta: true
            mensaje: |
              Eso es. $T$ tiene un brazo $r = d/2$ respecto al eje, y le hace
              un torsor $Tr$. La sección del extremo gira, y C, que está a la
              altura del centro, sube $\varphi r$. La compatibilidad tiene tres
              términos: la flexión del eje, su torsión y lo que se alarga el
              tirante.
          - texto: >-
              Nada, porque el tirante y la carga están en la misma sección y
              solo hay flexión
            mensaje: |
              Están en la misma sección, pero no en el mismo punto: P actúa en
              el centro y T a $d/2$ de él. Una fuerza fuera del eje lleva un
              torsor consigo.
          - texto: >-
              El eje se tuerce, pero el giro no mueve C en vertical porque C
              está a la altura del centro
            mensaje: |
              Al revés: un punto a la altura del centro es justo el que se
              mueve en **vertical** cuando la sección gira, porque su
              desplazamiento es perpendicular al radio, que es horizontal.
          - texto: >-
              La carga se reparte a partes iguales entre el empotramiento y el
              tirante
            mensaje: |
              El sistema es hiperestático: el reparto sale de la compatibilidad,
              y depende de lo rígidos que sean el eje y el tirante. Aquí el
              tirante, aunque es fino, es unas tres veces más rígido que el
              eje a flexión.
      - tipo: calcular
        titulo: La flexibilidad de la torsión
        pregunta: |
          Escribe cada flexibilidad en unidades de $1/(\pi EL)$, con
          $a = L/3$, $d = L/20$ y $r = d/2$. ¿Cuánto vale la de torsión,
          $r^{2}a/(GI_p)$, que es lo que sube C por cada unidad de $T$?
        respuesta:
          tipo: numero
          valor: '2133.33'
          tolerancia: 0.5
          formato: un número, en unidades de 1/πEL; forma exacta (6400/3)
        distractores:
          - valor: '4266.67'
            mensaje: |
              Has usado el momento de inercia $I = \pi d^{4}/64$ en lugar del
              polar, $I_p = \pi d^{4}/32 = 2I$, que es el de la torsión de una
              sección circular.
          - valor: '1066.67'
            mensaje: |
              Has puesto $G = E$. El enunciado da $E = 2G$: $G = E/2$, y la
              flexibilidad de torsión se dobla.
          - valor: '8533.33'
            mensaje: |
              Has tomado el brazo igual al diámetro. C está en el borde de la
              sección, a $r = d/2 = L/40$ del centro, y el término lleva
              $r^{2}$.
        pista: |
          $I_p = \pi d^{4}/32$ y $G = E/2$. El giro es $\varphi = Tra/(GI_p)$, y
          C sube $\varphi r$.
        desarrollo: |
          $$
          I_p = \frac{\pi d^{4}}{32} = \frac{\pi L^{4}}{5120000},
          \qquad
          G I_p = \frac{\pi E L^{4}}{10240000}
          $$

          $$
          f_{tors} = \frac{r^{2}a}{GI_p} = \frac{L^{2}}{1600}\cdot\frac{L}{3}\cdot\frac{10240000}{\pi EL^{4}}
          = \frac{6400}{3}\,\frac{1}{\pi EL}
          $$
      - tipo: calcular
        titulo: La fuerza del tirante
        pregunta: |
          ¿Cuánto vale $T/P$?
        respuesta:
          tipo: numero
          valor: '0.750029'
          tolerancia: 0.0005
          formato: un número, T en unidades de P; forma exacta (6400/8533)
        distractores:
          - valor: '0.983405'
            mensaje: |
              Es lo que sale con el tirante **inextensible**. El tirante es fino,
              $L/100$ de diámetro, y se alarga $TL/(EA)$: en esta compatibilidad
              pesa la tercera parte que la flexión del eje. Si te ha salido
              $T = P$, es el mismo error y además sin la torsión.
          - valor: '0.912428'
            mensaje: |
              Has calculado el área del tirante con el diámetro como radio,
              $\pi(L/100)^{2}$. Su área es $\pi d^{2}/4 = \pi L^{2}/40000$, cuatro
              veces menor, y el tirante cede cuatro veces más.
        pista: |
          C baja lo que se alarga el tirante:
          $(P - T)\,f_{flex} - T\,f_{tors} = T\,f_{tir}$, con
          $f_{flex} = a^{3}/3EI$ y $f_{tir} = L/(EA_t)$.
        desarrollo: |
          Con $I = \pi d^{4}/64 = \pi L^{4}/10240000$ y $A_t = \pi L^{2}/40000$,
          en unidades de $1/(\pi EL)$:

          $$
          f_{flex} = \frac{a^{3}}{3EI} = \frac{10240000}{81} = 126419{,}75,
          \qquad
          f_{tors} = 2133{,}33,
          \qquad
          f_{tir} = \frac{L}{EA_t} = 40000
          $$

          $$
          \frac{T}{P} = \frac{f_{flex}}{f_{flex} + f_{tors} + f_{tir}}
          $$

          $$
          \frac{126419{,}75}{126419{,}75 + 2133{,}33 + 40000} = 0{,}75003
          $$

          Sin la torsión saldría $0{,}7596$: el brazo $r$ es pequeño y la
          torsión mueve poco el resultado, pero sin ella la compatibilidad de
          C está mal escrita.
      - tipo: calcular
        titulo: El desplazamiento de C
        pregunta: |
          ¿Cuánto baja C? Da el número $c$ de $c\,P/(EL)$.
        respuesta:
          tipo: numero
          valor: '9549.67'
          tolerancia: 1
          formato: un número, el coeficiente de P/EL
        distractores:
          - valor: '40240.66'
            mensaje: |
              Es la flecha del extremo del eje con toda la P y sin tirante,
              $Pa^{3}/3EI$. El tirante sostiene tres cuartos de la carga y C
              baja mucho menos.
          - valor: '12732.4'
            mensaje: |
              Es el alargamiento del tirante con $T = P$. Lo que baja C es lo
              que se alarga el tirante con la $T$ del paso anterior,
              $0{,}75\,P$.
        pista: |
          C cuelga del tirante: baja lo que el tirante se alarga,
          $TL/(EA_t)$.
        desarrollo: |
          $$
          v_C = \frac{T\,L}{EA_t} = 0{,}75003\cdot\frac{40000}{\pi}\cdot\frac{P}{EL}
          $$

          $$
          \frac{0{,}75003\cdot40000}{\pi} = 9549{,}7
          $$

          Por el lado del eje sale lo mismo:
          $(P - T)\,f_{flex} - T\,f_{tors} = (31601{,}2 - 1600{,}1)/(\pi EL)\cdot P$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El tirante tira de C con $T$, a $d/2$ del eje, y el eje queda a
              flexión con $P - T$ y a torsión con $Td/2$.
          - texto: >-
              C baja lo que baja el extremo por flexión, menos lo que sube por
              el giro de torsión, y eso es lo que se alarga el tirante.
          - texto: >-
              Con $E = 2G$ e $I_p = 2I$, las flexibilidades valen 126419,75,
              2133,33 y 40000 en $1/(\pi EL)$, y $T = 0{,}75\,P$.
          - texto: >-
              C baja $TL/(EA_t) \approx 9550\,P/(EL)$.
          - texto: >-
              El tirante es mucho más fino que el eje, así que se puede tomar
              inextensible, y C no baja.
            trampa: true
            mensaje: |
              Al revés: precisamente porque es fino, el tirante se alarga, y
              su flexibilidad, 40000, es casi un tercio de la del eje a
              flexión. Inextensible, $T$ saldría 0,98 P.
    resolucion: |
      **La idea.** El sistema es hiperestático de grado uno, y se resuelve
      como dicen los apuntes del tema 11 (apartado 11.1, p. 3): se quita el
      enlace que sobra, el tirante, y se pone en su lugar su fuerza $T$, la
      incógnita hiperestática; la condición que falta es la del enlace
      quitado, que C, que cuelga del tirante, baje lo que el tirante se
      alarga. Como el tirante está en el borde de la sección y no en el eje,
      $T$ hace también un torsor: el eje se flecta y se tuerce.

      **Los datos.** $a = L/3$, $d = L/20$, $r = d/2 = L/40$; tirante de
      longitud $L$ y diámetro $L/100$; $G = E/2$.

      $$
      I = \frac{\pi d^{4}}{64} = \frac{\pi L^{4}}{10240000},\qquad
      I_p = 2I,\qquad
      A_t = \frac{\pi (L/100)^{2}}{4} = \frac{\pi L^{2}}{40000}
      $$

      **La compatibilidad en C.** El extremo baja $(P - T)a^{3}/3EI$ por
      flexión (tema 10); la sección gira $\varphi = Tra/(GI_p)$ (tema 12,
      ec. 12.14, p. 8, con el torsor $Tr$ constante en toda la longitud
      $a$) y C, a la altura del centro, sube $\varphi r$; el tirante se
      alarga $TL/(EA_t)$ (tema 8):

      $$
      (P - T)\,\frac{a^{3}}{3EI} - T\,\frac{r^{2}a}{GI_p} = T\,\frac{L}{EA_t}
      $$

      En unidades de $1/(\pi EL)$, las tres flexibilidades valen:

      $$
      \frac{a^{3}}{3EI} = 126419{,}75,\qquad
      \frac{r^{2}a}{GI_p} = 2133{,}33,\qquad
      \frac{L}{EA_t} = 40000
      $$

      **a) La fuerza del tirante.**

      $$
      \frac{T}{P} = \frac{126419{,}75}{126419{,}75 + 2133{,}33 + 40000} = 0{,}75003
      $$

      En forma exacta, $T = \tfrac{6400}{8533}\,P$. El empotramiento se queda
      con la cuarta parte de la carga. La torsión pesa poco ($T$ sería
      $0{,}7596\,P$ sin ella), pero el tirante no: inextensible, $T$ saldría
      $0{,}983\,P$.

      **b) El desplazamiento de C.** Es lo que se alarga el tirante, hacia
      abajo:

      $$
      v_C = \frac{TL}{EA_t} = \frac{0{,}75003\cdot40000}{\pi}\,\frac{P}{EL} \approx 9549{,}7\,\frac{P}{EL}
      $$

      Por el lado del eje sale lo mismo, $(P - T)\,f_{flex} - T\,f_{tors}$. Con
      el motor del curso, modelando el eje y un brazo rígido hasta C, salen
      las mismas cifras.

      **La otra lectura.** Si «su centro de gravedad» fuera el del eje, a
      media longitud, el extremo bajaría por P solo $5Pa^{3}/48EI$, los
      $5/16$ de antes, y saldría $T = 0{,}2344\,P$.

  # ── Problema 2 · la viga ABCD sobre dos resortes, con rótula en C y
  #    tirante en D. Impreso «2. (2p)», y el mismo día, igual, como problema
  #    3 de la final («3. (1.5p)»). La sección se da en la figura.
  - id: exerm2223-2par-6-la-viga-sobre-resortes
