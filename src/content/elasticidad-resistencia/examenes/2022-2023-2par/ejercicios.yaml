    pide: >-
      Los diagramas de cortantes y de flectores, el desplazamiento vertical de
      C en función de q, L, E e I, y σ y τ en el punto M de la sección más
      desfavorable.
    pasos:
      - tipo: reconocer
        pregunta: |
          La viga tiene dos resortes, una rótula y un tirante. ¿Por dónde se
          empieza?
        opciones:
          - texto: >-
              Por el tramo CD, porque la rótula no transmite momento y,
              tomando momentos en C, sale la fuerza del tirante
            correcta: true
            mensaje: |
              Eso es. CD está entre la rótula y el tirante: con momentos en C
              sale la fuerza del tirante, y con la vertical, lo que CD le pasa
              a ABC en la rótula. Después ABC es una viga sobre dos resortes
              con una carga conocida en su extremo.
          - texto: >-
              Por la compatibilidad de los dos resortes, porque la viga es
              hiperestática
            mensaje: |
              Cuenta: tres reacciones verticales (los dos resortes y el
              tirante), dos ecuaciones de equilibrio y la de la rótula. Es
              isostática. Los resortes solo cuentan para los desplazamientos,
              no para las fuerzas.
          - texto: >-
              Por el tramo ABC, tomando momentos en B
            mensaje: |
              En ABC hay tres incógnitas a la vez: los dos resortes y la fuerza
              que le llega por la rótula. Mientras CD no diga cuánto vale esa
              fuerza, ABC no se cierra.
          - texto: >-
              Por lo que bajan A y B, porque sin eso no se conocen las fuerzas
              de los resortes
            mensaje: |
              Es al revés: en una estructura isostática las fuerzas salen del
              equilibrio, y después cada resorte baja $F/k$. El orden es
              fuerzas primero y desplazamientos después.
      - tipo: calcular
        titulo: La reacción del resorte A
        pregunta: |
          ¿Cuánto vale la reacción del resorte A sobre la viga, positiva hacia
          arriba, en unidades de $qL$?
        respuesta:
          tipo: numero
          valor: '-0.4375'
          tolerancia: 0.001
          formato: un número, en qL; forma exacta (-7/16)
        distractores:
          - valor: '0.4375'
            mensaje: |
              El valor es ese, pero el sentido no. La carga está en C, fuera
              del vano AB: la viga hace palanca en B y el extremo A tiende a
              **subir**. El resorte A tira de él hacia abajo.
          - valor: '-0.1875'
            mensaje: |
              Has cargado ABC solo con la P de la rótula. CD también le pasa
              su parte de la carga repartida: el tirante se lleva $qL/2$ y la
              otra mitad baja por la rótula. En C actúan $3qL/8 + qL/2 = 7qL/8$.
          - valor: '-0.6875'
            mensaje: |
              Has pasado a ABC toda la carga de CD, $qL$. El tirante en D se
              lleva la mitad: con momentos en C, $R_D L = qL\cdot L/2$.
        pista: |
          En CD, momentos en C: $R_D = qL/2$. En ABC actúan en C
          $3qL/8 + qL/2$; momentos en A para $R_B$, y vertical para $R_A$.
        desarrollo: |
          $$
          R_D = \frac{qL}{2},\qquad
          F_C = \frac{3}{8}qL + \frac{1}{2}qL = \frac{7}{8}qL
          $$

          $$
          R_B\cdot2L = \frac{7}{8}qL\cdot3L \;\Longrightarrow\; R_B = \frac{21}{16}qL,
          \qquad
          R_A = \frac{7}{8}qL - \frac{21}{16}qL = -\frac{7}{16}qL
          $$
      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de cortantes y de flectores** de la viga,
          alineados bajo ella, con los valores en A, B, C y D y el máximo de
          CD.
        comprueba:
          - punto: |
              Cortante de $-7qL/16$, constante, de A a B.
            porque: |
              El resorte A tira hacia abajo, y el cortante a su derecha es su
              reacción, negativa.
          - punto: |
              Salto de $21qL/16$ en B, hasta $7qL/8$, constante hasta C; en C
              baja $3qL/8$, hasta $qL/2$.
            porque: |
              Los saltos son las fuerzas concentradas: la reacción de B hacia
