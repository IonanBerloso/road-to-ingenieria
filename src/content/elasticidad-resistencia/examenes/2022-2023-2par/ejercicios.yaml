  - id: exerm2223-2par-7-la-barra-quebrada-con-un-muelle
    titulo: Una estructura espacial empotrada en A, con un muelle en C y la carga en D
    fuente: >-
      Problema 3 · Segunda parte del 13 de enero de 2023 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 2 puntos. Cayó igual el mismo día como problema 4 del examen final,
      donde vale 1,5 puntos; el enunciado se transcribe sin su «(2p)», y cada
      hoja pone sus puntos. En el PDF de la 2.ª parte no sale la línea de
      datos de K, E y la sección; la final la imprime sin el «= 2» del final,
      y se ha leído entera en el Word. El examen no publica resolución; el
      desarrollo es nuestro.
    nivel: examen
    enunciado: |
      La estructura de sección circular de la figura está empotrada en
      el punto A, tiene un resorte en el punto C y sufre una carga P en el
      punto D.

      Determinar:

      a) La fuerza que sufre el muelle

      b) El desplazamiento del muelle

      c) Desplazamiento vertical del punto B

      $$
      K = \frac{EA}{10L};\quad E = 2.5\,G;\quad \frac{I_z}{AL^{2}} = 2
      $$

