asignatura: elasticidad-resistencia
curso: '2022-2023'
convocatoria: segundo-parcial
fecha: 13 de enero de 2023
# La segunda parte de Elasticidad y Resistencia de Materiales del 13 de
# enero de 2023: tres páginas, la 1 con cuatro preguntas de teoría de 1 punto
# y la 2 y la 3 con tres problemas de 2 puntos (el problema 3 acaba en la
# página 3, con sus apartados y la figura). Diez puntos en total, y el
# cuadernillo los imprime todos. El mismo día se hizo el examen final, que
# repite cuatro de estas siete preguntas (punto 5).
#
# El cuadernillo es bilingüe, castellano a la izquierda y euskera a la
# derecha, y se transcribe **solo la columna en castellano**, tal cual. El
# euskera pide lo mismo en las siete preguntas; en la teoría 2 la columna de
# la derecha repite el texto en castellano.
#
# 1. **EL PDF PIERDE TEXTO, Y EL WORD MANDA.** En el PDF la figura de las
#    vigas cruzadas sale sin rótulos (A, B, C, D, E y P son cuadros de texto
#    del Word), la cota de AB del problema 2 se queda en «2» (las constantes
#    de los resortes sí se ven enteras), y la línea de datos del problema 3
#    (K = EA/10L; E = 2.5G; Iz/AL² = 2) no sale. Todo se ha leído en el Word
#    original, cuyas figuras son las mismas. El examen final imprime la
#    línea del problema 3, pero sin el «= 2» del final.
#
# 2. **LO QUE EL TEXTO NO DICE Y LA FIGURA SÍ.** Las vigas cruzadas se cruzan
#    en el centro de las dos y se apoyan sin empotrar. En el problema 1, P va
#    en el centro de la sección del extremo («en su centro de gravedad») y C
#    es el punto del borde de esa sección a la altura de su centro. En el
#    problema 2, la cota 16t va entre las caras interiores de las alas (canto
#    total 18t), el tirante DF se toma inextensible porque no tiene datos, y
#    M es la unión del alma con el ala de arriba. En el problema 3 las barras
#    trabajan a flexión y torsión, sin axil. Cada lectura va en la nota de su
#    enunciado, y la resolución dice qué cambiaría con la otra.
#
# 3. **ERRATAS Y GRAFÍAS DEL TEXTO, CONSERVADAS**: «Flexión Pura» con
#    mayúscula (teoría 1), «(1p)Las vigas» sin espacio (teoría 2), «modulo» y
#    «rotula» sin tilde y «b/ … e I,» con la coma (problema 2). La cabecera de
#    la página 1 dice «PROBLEMAS/ ARIKETAK» encima de la teoría. Las figuras
#    rotulan «c», «p» y «q0» lo que el texto llama C, P y q; las figuras
#    redibujadas conservan sus rótulos y la nota lo dice.
#
# 4. **DOS NUMERACIONES EN UN CUADERNILLO.** La teoría va de la 1 a la 4 y los
#    problemas vuelven a empezar en 1. Aquí la teoría son **n 1 a 4** y los
#    problemas **n 5, 6 y 7**; la `fuente` de cada ejercicio dice el nombre
#    impreso. Ninguna pregunta se parte: cada una es un ejercicio.
#
# 5. **PREGUNTAS REPETIDAS.**
#    - La **teoría 1** es casi la pregunta 3 del parcial 1 de 2012-2013, que
#      ya está resuelta en el sitio: «3. (1,5p) Flexión pura. Deducir la
#      distribución de tensiones normales…». Cambian el número, los puntos
#      (1,5 allí, 1 aquí), la mayúscula de «Pura» y el artículo («de las
#      tensiones»). Apuntar a aquel ejercicio haría que esta hoja enseñara su
#      «3. (1,5p)», así que va un ejercicio propio
#      (`exerm2223-2par-1-la-ley-de-tensiones-en-flexion-pura`), con el
#      enunciado de 2023 tal cual y otro ejemplo, en ejes que no son
#      principales; su `fuente` nombra el examen de 2012-2013.
#    - La **teoría 2** y los **tres problemas** cayeron igual, el mismo día, en
#      el examen final: como teoría 4 y problemas 2, 3 y 4, con 1 punto la
#      teoría y 1,5 cada problema. Se resuelven aquí, y la final apunta a
#      estos ejercicios; su `fuente` dice las dos convocatorias con sus
#      puntos. Los tres problemas se transcriben sin su «(2p)», porque aquí
#      valen 2 puntos y en la final 1,5: cada hoja pone los suyos desde
#      `puntosImpresos`. La teoría 2 conserva su «(1p)», que vale en las dos.
#
# 6. **EL TEMA DEL PROBLEMA 1.** El eje con el tirante no usa ningún teorema
#    energético: es hiperestático de grado uno y se resuelve quitando el
#    tirante y poniendo su fuerza, con la compatibilidad en C, como dice el
#    tema 11 (apartado 11.1); la flexión, la torsión y el axil entran con sus
#    fórmulas de los temas 10, 12 y 8. Va al tema 11, el del método.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada cifra
# sale del motor del curso y de un segundo camino (fase-p/p9a,
# guiones/cifras.mjs y guiones/valores.mjs).
pdf: 2022-2023-2par.pdf
puntosImpresos:
  fuente: Cabecera de cada pregunta, «(1p)» en la teoría y «(2p)» en los problemas, págs. 1-3 del cuadernillo.
  reparto:
    - { n: 1, puntos: 1 }
    - { n: 2, puntos: 1 }
    - { n: 3, puntos: 1 }
    - { n: 4, puntos: 1 }
    - { n: 5, puntos: 2 }
    - { n: 6, puntos: 2 }
    - { n: 7, puntos: 2 }

