# La convocatoria extraordinaria de Elasticidad y Resistencia de Materiales
# de 2020-2021, fechada el 02/02/2021 («Examen Final: 02/02/2021»;
# «Azterketa Finala: 2021/02/02» en euskera): cuatro páginas, en euskera y
# en castellano, de la Escuela de Ingeniería de Gipuzkoa. La página 1 es de
# teoría (TEORIA/ TEORÍA: cuatro preguntas de 1 punto) y la 2 a la 4, de
# problemas (ARIKETAK / EJERCICIOS: cuatro de 1,5 puntos; la 4 solo lleva la
# figura del problema 4). Diez puntos en total, y el cuadernillo los
# imprime todos.
#
# Se transcribe la columna en castellano, tal cual, con sus puntos
# impresos. Lo que hay que saber de ese texto, dicho antes de que nadie lo
# deduzca:
#
# 1. **EL PDF PIERDE PARTE DE DOS FIGURAS.** El PDF es una conversión del
#    Word original. En la pregunta 2 de teoría no imprime la barra ni las
#    dos flechas: solo las cotas, los dos apoyos y los rótulos P y 4P. En
#    el problema 2 no imprime las flechas dobles del torsor repartido. Las
#    dos se han leído del Word, y todas las figuras se han redibujado de
#    él. El resto de las figuras, y todo el texto, el PDF lo imprime igual
#    que el Word.
#
# 2. **LA TEORÍA 2 ES DEL TEMA 8.** Con la barra a la vista es una barra
#    con axiles entre dos apoyos fijos (hiperestática), no una viga: tema 8.
#
# 3. **LECTURAS.** Teoría 1: la roseta a 0°, 45° y 90°; los tensores en
#    función de ε, E y ν. Teoría 2: los dos apoyos, dibujados iguales, se
#    toman fijos; P llega al extremo libre y 4P sale de la barra a 3a de
#    él, las dos hacia la derecha. Problema 1: «v» es ν. Problema 2: el
#    texto escribe mo y Mo, la figura m0 y M0; m0 va hacia la derecha y M0
#    hacia la izquierda (las flechas dobles del Word); «50KN/m» es
#    kN·m/m; la sección E es la del lado DE. Problema 3: «P=80K» son 80 kg
#    hacia arriba; los gruesos de la sección, sin acotar, se toman t (a
#    escala); el ala superior es la de 10t y la inferior la pestaña de 2t;
#    el extremo del muelle está h sobre C; el apoyo B sujeta en los dos
#    sentidos. Problema 4: FD mide L y es del mismo material; q0 en DE va
#    hacia abajo y en CD es horizontal, paralela a BC y hacia B (las
#    flechas del Word); hacia qué lado del papel va CD no cambia nada. La
#    línea de datos «E = 2,5 G» con «Iz/(AL²) = 2» es la de la plantilla
#    que reaparece en el problema 3 de la 2.ª parte de enero de 2023.
#
# 4. **DIFERENCIAS CON EL EUSKERA.** En el problema 1, «p2=p1/2 izanik» va
#    dentro del apartado b) y el c) pide la tensión tangencial máxima, sin
#    E ni ν; el castellano pide la deformación tangencial máxima y da E y ν
#    (la resolución da las dos). En el problema 2 el euskera repite «Mo Mo=»
#    y escribe «(1,5p)» donde el castellano «(1.5p)».
#
# 5. **ERRATAS Y RAREZAS DEL TEXTO, CONSERVADAS**: «de somete» (teoría 1),
#    «3.(1p)» y «4.(1p)» sin espacio, «2.(1.5p)El» pegado, «E=3.10⁵MPa»,
#    «v=0.3», «50KN/m», «0,2º» con el ordinal, «de donde la relación», «muelle
#    ,» con el espacio antes de la coma, «80K», «Kg», «a/» y «b/» en el
#    problema 4 y «Obtener la variación de la longitud CD» sin punto final.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso (src/lib/erm) y de un segundo camino
# (fase-p/p9e, guiones/cifras.mjs). Las preguntas 1, 3 y 4 de teoría no
# traen números: sus pasos de cálculo usan ejemplos nuestros, y lo dicen.
# Ninguna de las ocho preguntas está ya en el sitio.
pdf: 2020-2021-ext.pdf
