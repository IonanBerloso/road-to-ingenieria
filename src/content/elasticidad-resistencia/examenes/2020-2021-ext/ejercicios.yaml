      Los diagramas a escala. Los torsores, en <i>m</i><sub>0</sub><i>a</i>;
      los giros, en <i>m</i><sub>0</sub><i>a</i>²/(<i>G</i>·<i>I</i><sub>p</sub>).

      </figcaption>
      </figure>

      **b) El diámetro.** Con $a = 1$ m, $m_0 = 50$ kN·m/m, $G = 80$ GPa y
      $\varphi_{\max} = 0{,}2^{\circ} = 3{,}491\cdot10^{-3}$ rad:

      $$
      I_p = \frac{2{,}03125\,m_0a^{2}}{G\,\varphi_{\max}} = \frac{2{,}03125\cdot50\ \text{kN·m}^{2}}{80\cdot10^{6}\ \text{kN/m}^{2}\cdot3{,}491\cdot10^{-3}} = 3{,}637\cdot10^{-4}\ \text{m}^{4}
      $$

      y con $I_p = \pi d^{4}/32$, $d = 246{,}71$ mm.

      **c) La tensión en E.** En E el torsor es el de DE,
      $M_t = -0{,}25\,m_0a = -12{,}5$ kN·m. A $r = 5$ cm (ec. 12.10, p. 7):

      $$
      \tau = \frac{|M_t|\,r}{I_p} = \frac{12{,}5\ \text{kN·m}\cdot0{,}05\ \text{m}}{3{,}637\cdot10^{-4}\ \text{m}^{4}} = 1{,}7185\ \text{MPa}
      $$

      **d) El eje anular.** La tensión máxima del macizo está en el borde
      del tramo AB, con $M_{t,\max} = 1{,}25\,m_0a = 62{,}5$ kN·m y su
      diámetro de 246,71 mm (ec. 12.11, p. 7):

      $$
      \tau_{\max} = \frac{16M_{t,\max}}{\pi D^{3}} = \frac{16\cdot62{,}5\ \text{kN·m}}{\pi\cdot0{,}24671^{3}\ \text{m}^{3}} = 21{,}198\ \text{MPa}
      $$

      En el anular, con $R/e = 3{,}5$, el radio interior es
      $r = R - R/3{,}5 = 5R/7$: sus diámetros, $D = 2R$ y $d = 2r$, están en
      la razón $d/D = 5/7$. Con la ec. 12.12 (p. 7) y la misma tensión
      máxima:

      $$
      \frac{16M_{t,\max}}{\pi D^{3}\left(1 - d^{4}/D^{4}\right)} = 21{,}198\ \text{MPa}
      \quad\Longrightarrow\quad
      D = \frac{246{,}71\ \text{mm}}{\left(1 - 625/2401\right)^{1/3}} = 272{,}79\ \text{mm}
      $$

      $R = D/2 = 136{,}40$ mm, $e = R/3{,}5 = 38{,}97$ mm, y el radio
      interior, $97{,}43$ mm. El área es el 59,9 % de la del macizo: pesa un
      40 % menos.

      **Comprobaciones.** El motor del curso (el eje con varios
      empotramientos del tema 12) da los mismos torsores y giros, el giro de
      E nulo y el máximo, buscado punto a punto, en $2{,}25a$. Con el
      diámetro de b, el giro máximo sale 0,2°. Por otro camino, la
      compatibilidad escrita a mano, tramo a tramo: la misma $c$.

  # ── Problema 3 · la viga empotrada con apoyo y voladizo, forzada a unirse a un muelle.
  - id: exerm2021-ext-7-la-viga-unida-a-un-muelle
    titulo: La viga empotrada y apoyada con un voladizo que se fuerza para unirlo a un muelle
    fuente: >-
      Problema 3 · Extraordinaria del 2 de febrero de 2021 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1,5 puntos. El examen no publica resolución; el desarrollo es
      nuestro, con los convenios de los temas 9, 10 y 11.
    nivel: examen
    enunciado: |
      3. (1,5p) En la viga de la figura se fuerza el extremo C para unirlo
      al muelle , determinar:

      a) La ecuación paramétrica de la carga que actúa en el muelle.

      b) Diagramas de cortante y momentos.

      (P=80K; a=4m; h=0.03m; E=2100000Kg/cm² ; t=25mm; K=500Kg/m)

      c) El valor que debería tener la constante K del muelle para que la
      compresión máxima en ala superior sea la misma que la compresión
      máxima en el ala inferior.

      <figure class="figura-examen">
      <svg viewBox="0 0 420 186" role="img" width="420" height="186" aria-labelledby="exerm2021-ext-7-la-viga-unida-a-un-muelle-fig-t exerm2021-ext-7-la-viga-unida-a-un-muelle-fig-d">
      <title id="exerm2021-ext-7-la-viga-unida-a-un-muelle-fig-t">La viga ABC empotrada en A, con el apoyo B, la carga P en D y el muelle K sobre C</title>
      <desc id="exerm2021-ext-7-la-viga-unida-a-un-muelle-fig-d">Una viga horizontal empotrada en una pared rayada a la izquierda, en A. A a/2 de A está D, donde una flecha P empuja la viga hacia arriba desde abajo. A otros a/2, en B, un apoyo, un triángulo sobre una base rayada. La viga sigue una longitud a hasta su extremo libre C. Encima de C, un muelle K cuelga del techo rayado; su extremo inferior queda separado de la viga una altura h, acotada a la derecha. Sin escala vertical.</desc>
