      <figure class="figura-examen">
      <svg viewBox="0 0 240 240" role="img" width="240" height="240" aria-labelledby="exerm2021-ext-7-la-viga-unida-a-un-muelle-sec-t exerm2021-ext-7-la-viga-unida-a-un-muelle-sec-d">
      <title id="exerm2021-ext-7-la-viga-unida-a-un-muelle-sec-t">La sección de la viga: una T con una pestaña al pie del alma</title>
      <desc id="exerm2021-ext-7-la-viga-unida-a-un-muelle-sec-d">Una sección en forma de T: arriba un ala horizontal de 10t de ancho, acotada encima; de su centro baja un alma delgada, acotada 10t a la izquierda entre la cara de abajo del ala y la de arriba de una pestaña; al pie del alma, la pestaña, más ancha que el alma, de 2t, acotada debajo. Los gruesos no están acotados.</desc>
      <polygon points="57,50 167,50 167,61 117.5,61 117.5,171 123,171 123,182 101,182 101,171 106.5,171 106.5,61 57,61" fill="var(--faint)" fill-opacity=".3" stroke="var(--ink)" stroke-width="1.5"/>
      <line x1="57" y1="32" x2="167" y2="32" stroke="var(--ink)" stroke-width="1"/><polygon points="167,32 160,34.6 160,29.4" fill="var(--ink)"/><polygon points="57,32 64,29.4 64,34.6" fill="var(--ink)"/>
      <line x1="57" y1="27" x2="57" y2="47" stroke="var(--faint)" stroke-width="0.6"/>
      <line x1="167" y1="27" x2="167" y2="47" stroke="var(--faint)" stroke-width="0.6"/>
      <text x="112" y="26" font-size="14" fill="var(--ink)" text-anchor="middle">10t</text>
      <line x1="45" y1="61" x2="45" y2="171" stroke="var(--ink)" stroke-width="1"/><polygon points="45,171 42.4,164 47.6,164" fill="var(--ink)"/><polygon points="45,61 47.6,68 42.4,68" fill="var(--ink)"/>
      <line x1="40" y1="61" x2="56" y2="61" stroke="var(--faint)" stroke-width="0.6"/>
      <line x1="40" y1="171" x2="103.5" y2="171" stroke="var(--faint)" stroke-width="0.6"/>
      <text x="39" y="121" font-size="14" fill="var(--ink)" text-anchor="end">10t</text>
      <line x1="101" y1="185" x2="101" y2="205" stroke="var(--faint)" stroke-width="0.6"/>
      <line x1="123" y1="185" x2="123" y2="205" stroke="var(--faint)" stroke-width="0.6"/>
      <line x1="79" y1="200" x2="96" y2="200" stroke="var(--ink)" stroke-width="1"/><polygon points="101,200 95,202.4 95,197.6" fill="var(--ink)"/>
      <line x1="145" y1="200" x2="128" y2="200" stroke="var(--ink)" stroke-width="1"/><polygon points="123,200 129,197.6 129,202.4" fill="var(--ink)"/>
