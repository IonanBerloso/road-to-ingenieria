      <figcaption>

      Redibujada del Word original, que el PDF reproduce igual: el rombo
      ABCD con el ángulo de 60° en A, <i>p</i><sub>1</sub> en los lados
      horizontales y <i>p</i><sub>2</sub> en los inclinados.

      </figcaption>
      </figure>

      **Notas nuestras.** «v» es el coeficiente de Poisson $\nu$, y «3.10⁵»,
      $3\cdot10^{5}$. $p_1$ y $p_2$ son fuerzas por unidad de área del lado
      sobre el que actúan, con la dirección de sus flechas.
      $p_1$ va paralela a AB, a 60° de X; $p_2$, horizontal. En euskera el
      apartado c pide la tensión tangencial máxima y no da $E$ ni $\nu$: la
      resolución da las dos.
    pide: >-
      a) El tensor de tensiones en función de p1 y p2. Con p2 = p1/2: b) las
      tensiones y las direcciones principales; c) la deformación tangencial
      máxima; d) la variación de longitud del lado CD.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para el apartado a hay tres incógnitas, $\sigma_x$, $\sigma_y$ y
          $\tau_{xy}$. ¿De dónde salen?
        opciones:
          - texto: >-
              De la fórmula de Cauchy, $\{S_n\} = [\sigma]\{n\}$, en dos lados
              no paralelos: el vector tensión de cada lado tiene que ser el
              dibujado
            correcta: true
            mensaje: |
              Eso es (ec. 2.14, apuntes del tema 2, p. 11). En BC, de normal
              $y$, el vector tensión es $(\tau_{xy}, \sigma_y)$ y da dos
              componentes; en AB, con $\tau_{xy}$ ya conocida, sale
              $\sigma_x$. Los otros dos lados dan lo mismo: el estado es
              uniforme.
          - texto: >-
              $p_1$ y $p_2$ son las tensiones principales, y el tensor se
              escribe en sus direcciones
            mensaje: |
              Una tensión principal es normal a su plano. $p_1$ y $p_2$ son
              oblicuas, con componente tangencial: no son principales, y
              sus lados tampoco son planos principales.
          - texto: >-
              Cada una es la normal de su lado: $\sigma_y = p_1$ y
              $\sigma_x = p_2$, con $\tau_{xy} = 0$
            mensaje: |
              $p_1$ forma 60° con BC, y $p_2$ es horizontal sobre un lado
              inclinado: ninguna es normal a su lado. Hay que proyectar con
              Cauchy.
      - tipo: calcular
        titulo: El tensor con p2 = p1/2
        pregunta: |
          Con $p_2 = p_1/2$, ¿cuánto vale $\sigma_x$, en unidades de $p_1$?
        respuesta:
          tipo: numero
          valor: '0.8660'
          tolerancia: 0.001
          formato: un número (σx dividido por p1)
        distractores:
          - valor: '0.5774'
            mensaje: |
              Te has dejado $\tau_{xy}$ en el lado AB. La componente x de su
              vector tensión es $-\sigma_x\sin60^{\circ} + \tau_{xy}\cos60^{\circ}$,
              y $\tau_{xy} = p_1/2$ ya la ha dado el lado BC.
          - valor: '0.5'
            mensaje: |
              Es $p_2$, como si fuera la normal del lado AB. AB está inclinado
              y $p_2$ es horizontal: no es normal a él. Hay que pasar por
              Cauchy.
          - valor: '1.8660'
            mensaje: |
              Has tomado la normal de AB a 30° de la horizontal,
              $(-\cos60^{\circ}, \sin60^{\circ})$. AB forma 60° con X, y su
              normal exterior es $(-\sin60^{\circ}, \cos60^{\circ})$.
        pista: |
          Lado BC, normal $(0, 1)$: $(\tau_{xy}, \sigma_y) = p_1(\cos60^{\circ}, \sin60^{\circ})$.
          Lado AB, normal $(-\sin60^{\circ}, \cos60^{\circ})$: la componente x
          del vector tensión es $-p_2$.
        desarrollo: |
          Del lado BC, $\tau_{xy} = p_1/2$ y $\sigma_y = \sqrt{3}\,p_1/2$. Del
          lado AB:

          $$
          -\sigma_x\,\frac{\sqrt{3}}{2} + \frac{p_1}{2}\cdot\frac{1}{2} = -p_2
          \quad\Longrightarrow\quad
          \sigma_x = \frac{p_1 + 4p_2}{2\sqrt{3}}
          $$

          Con $p_2 = p_1/2$: $\sigma_x = 3p_1/(2\sqrt{3}) = 0{,}8660\,p_1$, igual
          que $\sigma_y$.
      - tipo: calcular
        titulo: La tensión principal mayor
        pregunta: |
          ¿Cuánto vale $\sigma_1$, en unidades de $p_1$?
        respuesta:
          tipo: numero
          valor: '1.3660'
          tolerancia: 0.001
          formato: un número (σ1 dividido por p1)
        distractores:
          - valor: '1.2421'
            mensaje: |
              Es la $\sigma_1$ que sale con la $\sigma_x$ sin $\tau_{xy}$,
              $0{,}5774\,p_1$. Con $\tau_{xy}$ en el lado AB,
              $\sigma_x = \sigma_y = 0{,}8660\,p_1$.
          - valor: '1.2155'
            mensaje: |
              Es la $\sigma_1$ que sale con $\sigma_x = p_2$. $p_2$ no es la
              normal del lado AB: $\sigma_x = 0{,}8660\,p_1$.
          - valor: '0.5'
            mensaje: |
              Es el radio del círculo de Mohr. La tensión principal es el
              centro más el radio: $\sigma_1 = (\sigma_x + \sigma_y)/2 + R$.
        pista: |
          Con $\sigma_x = \sigma_y$, el centro del círculo de Mohr es
          $\sigma_x$ y el radio, $\tau_{xy}$ (ec. 2.68, p. 25).
        desarrollo: |
          $$
          \sigma_{1,2} = \frac{\sigma_x + \sigma_y}{2} \pm \sqrt{\left(\frac{\sigma_x - \sigma_y}{2}\right)^{2} + \tau_{xy}^{2}} = 0{,}8660\,p_1 \pm 0{,}5\,p_1
          $$

          $\sigma_1 = 1{,}3660\,p_1$, $\sigma_2 = 0{,}3660\,p_1$, y la de z,
          $\sigma_3 = 0$.
      - tipo: calcular
        titulo: La dirección principal 1
        pregunta: |
          ¿Qué ángulo forma la dirección principal 1 con el eje X, en grados,
          medido en sentido antihorario?
        respuesta:
          tipo: numero
          valor: '45'
          tolerancia: 0.1
          formato: un número, en grados, desde X en sentido antihorario
        distractores:
          - valor: '90'
            mensaje: |
              Es $2\theta_1$, el ángulo en el círculo de Mohr. En la chapa,
              la mitad.
          - valor: '-45'
            mensaje: |
              Es la dirección 2. Con $\tau_{xy} > 0$ la tensión mayor está a
              +45°: en esa dirección $\sigma_n = \sigma_x + \tau_{xy}$.
        pista: |
          $\tan2\theta = 2\tau_{xy}/(\sigma_x - \sigma_y)$ (ec. 2.62, p. 23), con
          $\sigma_x = \sigma_y$.
        desarrollo: |
          Con $\sigma_x = \sigma_y$, $\tan2\theta$ es infinita: $2\theta = 90^{\circ}$
          y $\theta = 45^{\circ}$. A 45°, $\sigma_n = \sigma_x + \tau_{xy} = 1{,}3660\,p_1$:
          es la 1. La 2 está a 135° (o $-45^{\circ}$), y la 3 es z.
      - tipo: calcular
        titulo: La deformación tangencial máxima
        pregunta: |
          Con $E = 3\cdot10^{5}$ MPa y $\nu = 0{,}3$, ¿cuánto vale
          $\gamma_{\max}$ por cada MPa de $p_1$, en millonésimas?
        respuesta:
          tipo: numero
          valor: '5.919'
          tolerancia: 0.005
          formato: un número, en millonésimas (10⁻⁶) por cada MPa de p1
        distractores:
          - valor: '4.333'
            mensaje: |
              Es la máxima en el plano XY, $(\sigma_1 - \sigma_2)/(2G)$. La
              tercera tensión, la de z, es nula y menor que las dos del plano:
              el círculo mayor es el de 1 y 3.
          - valor: '2.960'
            mensaje: |
              Es la mitad: la componente del tensor de deformaciones,
              $\gamma/2$. La deformación tangencial es $\tau_{\max}/G$.
          - valor: '2.277'
            mensaje: |
              Has dividido $\tau_{\max}$ por $E$. La ley de Hooke para la
              distorsión va con $G = E/(2(1+\nu))$ (ec. 4.13).
          - valor: '4.553'
            mensaje: |
              Has hecho $(\sigma_1 - \sigma_3)/E$, sin el Poisson. Las
              deformaciones principales son
              $\varepsilon_1 - \varepsilon_3 = (1+\nu)(\sigma_1 - \sigma_3)/E$.
          - valor: '11.839'
            mensaje: |
              Has dividido $\sigma_1 - \sigma_3$ por $G$. La tensión tangencial
              máxima es la mitad, $(\sigma_1 - \sigma_3)/2$, y
              $\gamma_{\max} = \tau_{\max}/G$.
        pista: |
          $\tau_{\max} = (\sigma_1 - \sigma_3)/2$ con $\sigma_3 = 0$ (figura
          2.15, pp. 28-29), y $\gamma = \tau/G$ (ec. 4.13, p. 7).
        desarrollo: |
          $\tau_{\max} = \sigma_1/2 = 0{,}6830\,p_1$ y
          $G = E/(2(1+\nu)) = 3\cdot10^{5}\ \text{MPa}/2{,}6 = 1{,}1538\cdot10^{5}\ \text{MPa}$:

          $$
          \gamma_{\max} = \frac{\tau_{\max}}{G} = \frac{0{,}6830\,p_1}{1{,}1538\cdot10^{5}\ \text{MPa}} = 5{,}919\cdot10^{-6}\,\frac{p_1}{\text{MPa}}
          $$
      - tipo: calcular
        titulo: El alargamiento de CD
        pregunta: |
          ¿Cuánto vale $\Delta_{CD}/L$ por cada MPa de $p_1$, en millonésimas?
        respuesta:
          tipo: numero
          valor: '3.897'
          tolerancia: 0.005
          formato: un número, en millonésimas (10⁻⁶) por cada MPa de p1
        distractores:
          - valor: '2.959'
            mensaje: |
              Has metido $\gamma_{xy}/2$ en la ec. 3.55. La galga, o el lado,
              lee $\varepsilon_xu_x^{2} + \varepsilon_yu_y^{2} + \gamma_{xy}u_xu_y$,
              con $\gamma_{xy}$ entera.
          - valor: '0.1443'
            mensaje: |
              El término de $\gamma_{xy}$ te ha salido restando. CD va de D a
              C, a +60° de X: $u_x$ y $u_y$ son positivos los dos, y
              $\gamma_{xy} = \tau_{xy}/G$ también.
          - valor: '2.021'
            mensaje: |
              Es $\varepsilon_x$ (que es igual a $\varepsilon_y$). CD no va
              según un eje: falta la distorsión, $\gamma_{xy}u_xu_y$.
          - valor: '4.763'
            mensaje: |
              Has tomado $\varepsilon_x = \sigma_x/E$. En tensión plana cada
              tensión contrae la otra dirección:
              $\varepsilon_x = (\sigma_x - \nu\sigma_y)/E$ (ec. 4.24).
        pista: |
          $\varepsilon_{CD} = \varepsilon_x\cos^{2}60^{\circ} + \varepsilon_y\sin^{2}60^{\circ} + \gamma_{xy}\sin60^{\circ}\cos60^{\circ}$
          (ec. 3.55), con Hooke en tensión plana (ec. 4.24) y
          $\gamma_{xy} = \tau_{xy}/G$.
        desarrollo: |
          $\varepsilon_x = \varepsilon_y = (1-\nu)\,0{,}8660\,p_1/E = 2{,}0207\cdot10^{-6}\,p_1/\text{MPa}$
          y $\gamma_{xy} = 0{,}5\,p_1/G = 4{,}3333\cdot10^{-6}\,p_1/\text{MPa}$:

          $$
          \varepsilon_{CD} = 2{,}0207\cdot10^{-6} + 4{,}3333\cdot10^{-6}\cdot0{,}4330 = 3{,}897\cdot10^{-6}\quad\text{(por MPa de } p_1\text{)}
          $$

          $\Delta_{CD} = \varepsilon_{CD}\,L = 3{,}897\cdot10^{-6}\,L$ por MPa de
          $p_1$: CD se alarga.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Cauchy en BC da $\tau_{xy} = p_1/2$ y $\sigma_y = \sqrt{3}\,p_1/2$;
              en AB, $\sigma_x = (p_1 + 4p_2)/(2\sqrt{3})$.
          - texto: >-
              Con $p_2 = p_1/2$, $\sigma_x = \sigma_y$: las direcciones
              principales están a 45°, con $\sigma_{1,2} = (0{,}866 \pm 0{,}5)\,p_1$.
          - texto: >-
              $\sigma_3 = 0$ es la menor: $\gamma_{\max} = \sigma_1/(2G)$.
          - texto: >-
              CD, a 60° de X, se alarga
              $\varepsilon_{CD} = \varepsilon_x + \gamma_{xy}\sin60^{\circ}\cos60^{\circ}$,
              y $\Delta_{CD} = \varepsilon_{CD}L$.
          - texto: >-
              Como el estado es uniforme, $p_1$ y $p_2$ son las tensiones
              principales de la chapa.
            trampa: true
            mensaje: |
              Uniforme quiere decir que el tensor es el mismo en todos los
              puntos, no que sea diagonal en los lados. $p_1$ y $p_2$ son
              oblicuas: tienen componente tangencial.
    resolucion: |
      **La geometría.** A está en el origen, AD sobre X y AB a 60° de X.
      Los lados horizontales, AD y BC, tienen normal $\pm y$; los inclinados,
      AB y DC, normal exterior $\pm(-\sin60^{\circ}, \cos60^{\circ})$. En BC
      actúa $p_1$ paralela a AB, $p_1(\cos60^{\circ}, \sin60^{\circ})$; en AB,
      $p_2$ según $-x$. En los lados opuestos, las mismas cambiadas de
      signo: el estado es uniforme.

      **a) El tensor.** Con la fórmula de Cauchy, $\{S_n\} = [\sigma]\{n\}$
      (ec. 2.14, apuntes del tema 2, p. 11). En BC, $n = (0, 1)$:

      $$
      \tau_{xy} = p_1\cos60^{\circ} = \frac{p_1}{2},\qquad \sigma_y = p_1\sin60^{\circ} = \frac{\sqrt{3}}{2}\,p_1
      $$

      En AB, $n = (-\sqrt{3}/2, 1/2)$, y el vector tensión es $(-p_2, 0)$:

      $$
      -\frac{\sqrt{3}}{2}\,\sigma_x + \frac{1}{2}\,\tau_{xy} = -p_2
      \quad\Longrightarrow\quad
      \sigma_x = \frac{p_1 + 4p_2}{2\sqrt{3}} = 0{,}2887\,p_1 + 1{,}1547\,p_2
      $$

      La componente y, $-\tfrac{\sqrt{3}}{2}\tau_{xy} + \tfrac{1}{2}\sigma_y = 0$,
      se cumple sola: es la comprobación de que las cargas dibujadas son
      compatibles. La chapa es delgada y está cargada en su plano: tensión
      plana.

      $$
      [\sigma] = \begin{pmatrix} \dfrac{p_1 + 4p_2}{2\sqrt{3}} & \dfrac{p_1}{2} & 0 \\ \dfrac{p_1}{2} & \dfrac{\sqrt{3}}{2}\,p_1 & 0 \\ 0 & 0 & 0 \end{pmatrix}
      $$

      **b) Las principales, con $p_2 = p_1/2$.** $\sigma_x = 3p_1/(2\sqrt{3}) = 0{,}8660\,p_1 = \sigma_y$
      y $\tau_{xy} = 0{,}5\,p_1$. El círculo de Mohr tiene el centro en
      $0{,}8660\,p_1$ y el radio $0{,}5\,p_1$ (ec. 2.68, p. 25):

      $$
      \sigma_1 = 1{,}3660\,p_1,\qquad \sigma_2 = 0{,}3660\,p_1,\qquad \sigma_3 = 0
      $$

      Con $\sigma_x = \sigma_y$, $\tan2\theta = 2\tau_{xy}/(\sigma_x - \sigma_y)$
      (ec. 2.62, p. 23) es infinita: la dirección 1 está a 45° de X y la 2 a
      135°; la 3 es z. A 45°, $\sigma_n = \sigma_x + \tau_{xy}$: es la mayor.

      **c) La deformación tangencial máxima.** Las dos tensiones del plano
      son de tracción y la de z es nula: la tangencial máxima es el radio
      del círculo de 1 y 3 (figura 2.15 b, pp. 28-29),

      $$
      \tau_{\max} = \frac{\sigma_1 - \sigma_3}{2} = 0{,}6830\,p_1
      $$

      que es lo que pide la versión en euskera. En un material isótropo las
      direcciones principales de deformación son las de tensión, y con
      $\gamma = \tau/G$ (ec. 4.13, p. 7) y $G = E/(2(1+\nu)) = 1{,}1538\cdot10^{5}$ MPa:

      $$
      \gamma_{\max} = \frac{\tau_{\max}}{G} = \frac{(1+\nu)\,\sigma_1}{E} = 1{,}7758\,\frac{p_1}{E} = 5{,}919\cdot10^{-6}\,\frac{p_1}{\text{MPa}}
      $$

      En el plano XY la máxima es menor, $(\sigma_1 - \sigma_2)/(2G) = 4{,}333\cdot10^{-6}\,p_1/\text{MPa}$.

      **d) La variación de CD.** CD va de D a C, paralelo a AB:
      $u = (\cos60^{\circ}, \sin60^{\circ})$. Con Hooke en tensión plana
      (ec. 4.24, p. 9):

      $$
      \varepsilon_x = \varepsilon_y = \frac{\sigma_x - \nu\sigma_y}{E} = 0{,}6062\,\frac{p_1}{E},\qquad
      \gamma_{xy} = \frac{\tau_{xy}}{G} = 1{,}3\,\frac{p_1}{E}
      $$

      y con la ec. 3.55 (apuntes del tema 3, p. 17):

      $$
      \varepsilon_{CD} = \varepsilon_x\cos^{2}60^{\circ} + \varepsilon_y\sin^{2}60^{\circ} + \gamma_{xy}\sin60^{\circ}\cos60^{\circ} = 1{,}1691\,\frac{p_1}{E}
      $$

      $$
      \Delta_{CD} = \varepsilon_{CD}\,L = 1{,}1691\,\frac{p_1L}{E} = 3{,}897\cdot10^{-6}\,L\ \text{por MPa de}\ p_1
      $$

      CD se alarga.

      **Comprobaciones.** El motor del curso (Cauchy en los cuatro lados,
      el círculo de Mohr y Hooke en 3D) da lo mismo, y el tensor reproduce
      las cargas dibujadas también con otros valores de $p_1$ y $p_2$. Por
      otro camino, CD forma 15° con la dirección 1:
      $\varepsilon_{CD} = \varepsilon_1\cos^{2}15^{\circ} + \varepsilon_2\sin^{2}15^{\circ}$,
      con $\varepsilon_1 = (\sigma_1 - \nu\sigma_2)/E$ y
      $\varepsilon_2 = (\sigma_2 - \nu\sigma_1)/E$: la misma cifra. Y
      $\gamma_{\max}$ es $\varepsilon_1 - \varepsilon_3$, con
      $\varepsilon_3 = -\nu(\sigma_1 + \sigma_2)/E$.

  # ── Problema 2 · el eje biempotrado con un torsor repartido y un par.
  - id: exerm2021-ext-6-el-eje-biempotrado-con-un-torsor-repartido
    titulo: El eje empotrado en sus dos extremos, con un torsor repartido y un par, sus diagramas y su dimensionado
    fuente: >-
      Problema 2 · Extraordinaria del 2 de febrero de 2021 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1,5 puntos (impreso «(1.5p)»). Las flechas dobles del torsor
      repartido solo están en el Word original. El examen no publica
      resolución; el desarrollo es nuestro, con los convenios del tema 12.
    nivel: examen
    enunciado: |
      2.(1.5p)El eje de la figura está sometido a un torsor uniformemente
      distribuido $m_o$ en el tramo BC y un momento torsor puntual
      $M_o=\dfrac{m_oa}{2}$ en D.

      a) Determinar el diagrama de momentos torsores y giros de torsión en
      función de $m_o$ y a.

      Siendo a=1m; $m_o$=50KN/m, y G=80GPa

      b) Dimensionar el eje para que el giro máximo sea 0,2º.

      c) Para la sección E, determinar la tensión cortante en una fibra que
      se encuentra a 5cm del centro de gravedad.

      d) Para aligerar peso, se plantea sustituir el eje de sección circular
      por uno de sección anular de donde la relación *radio
      exterior*/*espesor* es 3,5 (R/e=3,5). Determinar el radio exterior y
      espesor de la sección para que la tensión máxima sea la misma.

