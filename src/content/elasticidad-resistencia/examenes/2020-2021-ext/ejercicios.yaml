  # ── Teoría · pregunta 1 · el depósito esférico con la roseta de lecturas iguales.
  - id: exerm2021-ext-1-el-deposito-esferico-y-la-roseta
    titulo: Un depósito esférico con una roseta de tres lecturas iguales, sus tensores y el cambio de espesor
    fuente: >-
      Cuestión 1 de teoría · Extraordinaria del 2 de febrero de 2021 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes de los temas 3, 4 y 8. El
      enunciado está en letras: los pasos de cálculo usan un ejemplo nuestro.
    nivel: examen
    enunciado: |
      1. (1p) Un depósito esférico de pared delgada se construye con un
      material homogéneo e isótropo. Se analiza el comportamiento del
      material en la superficie externa del depósito (tensión plana),
      adhiriendo la roseta de galgas de la figura. El depósito de somete a
      una presión interna y se miden las tres lecturas en las galgas que
      resultan ser idénticas de valor $\varepsilon$.

      Determinar el tensor de deformaciones y tensiones.

      Determinar el cambio de espesor.

