      **Notas nuestras.** El texto escribe $m_o$ y $M_o$; la figura, $m_0$
      y $M_0$: son lo mismo, y la resolución usa los de la figura. Los
      vectores de los momentos van según las flechas dobles del Word: $m_0$
      hacia la derecha y $M_0$ hacia la izquierda. «50KN/m» es un torsor por
      unidad de longitud, 50 kN·m/m. El giro de 0,2° es el giro máximo de una
      sección respecto de los empotramientos. La sección E se toma del lado
      del tramo DE.
    pide: >-
      a) Los diagramas de momentos torsores y de giros, en función de m0 y
      a. b) El diámetro para que el giro máximo sea 0,2°. c) La tensión
      cortante a 5 cm del centro en la sección E. d) El radio exterior y el
      espesor de un eje anular con R/e = 3,5 y la misma tensión máxima.
    pasos:
      - tipo: reconocer
        pregunta: |
          Los dos extremos están empotrados: dos reacciones y una sola
          ecuación de equilibrio. ¿Qué ecuación falta?
        opciones:
          - texto: >-
              Que el giro de E respecto de A es nulo: la integral de
              $M_t/(GI_p)$ a lo largo de todo el eje vale cero
            correcta: true
            mensaje: |
              Eso es (ec. 12.13, apuntes del tema 12, p. 8). Los dos extremos
              no giran, así que lo que gira un tramo lo deshace otro. Con el
              torsor de AB como incógnita, todos los demás salen de él.
          - texto: >-
              Que cada empotramiento se lleva la mitad del torsor aplicado
            mensaje: |
              Eso solo pasaría con las cargas centradas. Aquí $m_0$ está
              cerca de A y $M_0$ cerca de E: el reparto lo decide la
              compatibilidad de giros.
          - texto: >-
              Que el torsor es nulo en el centro del eje, por simetría
            mensaje: |
              No hay simetría: ni las cargas ni los tramos son simétricos. El
              torsor se anula donde lo diga el diagrama, que sale de la
              compatibilidad de giros.
      - tipo: calcular
        titulo: El torsor del tramo AB
        pregunta: |
          ¿Cuánto vale el momento torsor del tramo AB, en unidades de $m_0a$?
        respuesta:
          tipo: numero
          valor: '1.25'
          tolerancia: 0.001
          formato: un número con su signo (el torsor dividido por m0·a)
        distractores:
          - valor: '1.4167'
            mensaje: |
              Has tomado $M_0$ en el mismo sentido que $m_0$. Su flecha
              doble va hacia la izquierda: resta.
          - valor: '1'
            mensaje: |
              Es lo que sale sin $M_0$. El par de D también se reparte entre
              los dos empotramientos.
          - valor: '1.5'
            mensaje: |
              Es todo el torsor aplicado, $2m_0a - m_0a/2$, como si E no
              sujetara. Los dos extremos están empotrados: falta la
              compatibilidad de giros.
          - valor: '-1.25'
            mensaje: |
              El valor es ese y el signo no. Con el convenio de los apuntes,
              $M_t$ es menos la suma de los pares a la izquierda: en AB,
              $M_t = -T_A$, y la reacción de A va hacia la izquierda.
        pista: |
          Con $c$ el torsor de AB: en BC, $M_t = c - m_0(x - a)$; en CD,
          $c - 2m_0a$; en DE, $c - 2m_0a + M_0$. La integral de $M_t$ de A a
          E es nula.
        desarrollo: |
          $$
          ca + \left(2ca - 2m_0a^{2}\right) + (c - 2m_0a)\,2a + (c - 1{,}5\,m_0a)\,a = 6ca - 7{,}5\,m_0a^{2} = 0
          $$

          $c = 1{,}25\,m_0a$. En C, $-0{,}75\,m_0a$; en DE, $-0{,}25\,m_0a$.
      - tipo: calcular
        titulo: El giro máximo
        pregunta: |
          ¿Cuánto vale el giro máximo, en unidades de $m_0a^{2}/(GI_p)$?
        respuesta:
          tipo: numero
          valor: '2.03125'
          tolerancia: 0.001
          formato: un número (el giro dividido por m0·a²/(G·Ip))
        distractores:
          - valor: '1.75'
            mensaje: |
              Es el giro de C. El máximo está donde el torsor se anula,
              $\varphi_{,x} = M_t/(GI_p) = 0$: dentro de BC, a $2{,}25a$.
          - valor: '1.25'
            mensaje: |
              Es el giro de B. De B en adelante el torsor sigue siendo
              positivo hasta $2{,}25a$, y el giro sigue creciendo.
        pista: |
          $\varphi_{,x} = M_t/(GI_p)$ (ec. 12.9, p. 6): el giro es máximo donde
          $M_t = 0$, en $x = a + 1{,}25a$.
        desarrollo: |
          $$
          \varphi_{\max} = \frac{1}{GI_p}\left(1{,}25\,m_0a\cdot a + \frac{1{,}25\,m_0a\cdot1{,}25a}{2}\right) = 2{,}03125\,\frac{m_0a^{2}}{GI_p}
          $$
      - tipo: calcular
        titulo: El diámetro
        pregunta: |
          Con $a = 1$ m, $m_0 = 50$ kN·m/m y $G = 80$ GPa, ¿qué diámetro
          hace falta para que el giro máximo sea 0,2°, en mm?
        respuesta:
          tipo: numero
          valor: '246.71'
          tolerancia: 0.05
          formato: un número, en mm
        distractores:
          - valor: '89.67'
            mensaje: |
              Has puesto 0,2 en radianes. El giro es de 0,2°:
              $0{,}2\cdot\pi/180 = 3{,}491\cdot10^{-3}$ rad.
          - valor: '237.69'
            mensaje: |
              Has dimensionado con el giro de C, $1{,}75\,m_0a^{2}/(GI_p)$. El
              máximo está a $2{,}25a$ y vale $2{,}03125\,m_0a^{2}/(GI_p)$.
          - valor: '218.51'
            mensaje: |
              Has dimensionado con el giro de B. El máximo está más allá, a
              $2{,}25a$, donde se anula el torsor.
          - valor: '293.39'
            mensaje: |
              Has usado $I = \pi d^{4}/64$. En torsión va el momento polar,
              $I_p = \pi d^{4}/32$, el doble.
        pista: |
          $GI_p\,\varphi_{adm} = 2{,}03125\,m_0a^{2}$, con $\varphi_{adm}$ en
          radianes, e $I_p = \pi d^{4}/32$.
        desarrollo: |
          $$
          I_p = \frac{2{,}03125\cdot50\ \text{kN·m}^{2}}{80\cdot10^{6}\ \text{kN/m}^{2}\cdot3{,}491\cdot10^{-3}} = 3{,}637\cdot10^{-4}\ \text{m}^{4}
          $$

          $$
          d = \left(\frac{32\,I_p}{\pi}\right)^{1/4} = \left(\frac{32\cdot3{,}637\cdot10^{-4}\ \text{m}^{4}}{\pi}\right)^{1/4} = 0{,}24671\ \text{m} = 246{,}71\ \text{mm}
          $$
      - tipo: calcular
        titulo: La tensión en la sección E
        pregunta: |
          Con ese diámetro, ¿cuánto vale la tensión cortante a 5 cm del
          centro en la sección E, en MPa?
        respuesta:
          tipo: numero
          valor: '1.7185'
          tolerancia: 0.001
          formato: un número, en MPa (el valor absoluto)
        distractores:
          - valor: '8.592'
            mensaje: |
              Has usado el torsor máximo, el de AB. En E el torsor es el del
              tramo DE: $-0{,}25\,m_0a = -12{,}5$ kN·m.
          - valor: '4.240'
            mensaje: |
              Es la tensión en el borde, a $d/2 = 12{,}34$ cm. La fibra está a
              5 cm: la tensión crece en proporción a la distancia al centro.
          - valor: '3.437'
            mensaje: |
              Has usado $I = I_p/2$. La tensión de torsión es
              $\tau = M_tr/I_p$ (ec. 12.10), con el momento polar.
          - valor: '5.155'
            mensaje: |
              Has usado el torsor de CD, $-0{,}75\,m_0a$. D, con $M_0$, queda
              entre CD y E: en DE el torsor es $-0{,}25\,m_0a$.
        pista: |
          $\tau = M_tr/I_p$ (ec. 12.10, p. 7), con el torsor del tramo DE.
        desarrollo: |
          $$
          \tau = \frac{|M_t|\,r}{I_p} = \frac{12{,}5\ \text{kN·m}\cdot0{,}05\ \text{m}}{3{,}637\cdot10^{-4}\ \text{m}^{4}} = 1718{,}5\ \text{kN/m}^{2} = 1{,}7185\ \text{MPa}
          $$
      - tipo: calcular
        titulo: El radio exterior del eje anular
        pregunta: |
          ¿Qué radio exterior debe tener el eje anular con $R/e = 3{,}5$ para
          que la tensión máxima sea la del eje macizo, en mm?
        respuesta:
          tipo: numero
          valor: '136.40'
          tolerancia: 0.05
          formato: un número, en mm
        distractores:
          - valor: '124.77'
            mensaje: |
              Has tomado 3,5 como diámetro exterior entre espesor. Es el
              **radio**: $r = R - e = R - R/3{,}5 = 5R/7$.
          - valor: '315.15'
            mensaje: |
              Has igualado a la tensión de la fibra del apartado c. La
              tensión máxima del eje macizo está en el borde del tramo AB:
              $21{,}20$ MPa.
        pista: |
          $\tau_{\max} = 16M_t/(\pi D^{3})$ en el macizo (ec. 12.11) y
          $\tau_{\max} = 16M_t/\left(\pi D^{3}(1 - d^{4}/D^{4})\right)$ en el
          hueco (ec. 12.12), con $D = 2R$ y $d/D = r/R = 5/7$.
        desarrollo: |
          Las dos con el mismo $M_{t,\max}$ y la misma $\tau_{\max}$: el
          diámetro exterior del anular cumple
          $D^{3}\left(1 - (5/7)^{4}\right) = (246{,}71\ \text{mm})^{3}$, el cubo
          del diámetro del macizo.

          $$
          D = \frac{246{,}71\ \text{mm}}{\left(1 - (5/7)^{4}\right)^{1/3}} = \frac{246{,}71\ \text{mm}}{0{,}9044} = 272{,}79\ \text{mm},\qquad R = \frac{D}{2} = 136{,}40\ \text{mm}
          $$
      - tipo: calcular
        titulo: El espesor
        pregunta: |
          ¿Y el espesor, en mm?
        respuesta:
          tipo: numero
          valor: '38.97'
          tolerancia: 0.02
          formato: un número, en mm
        distractores:
          - valor: '71.30'
            mensaje: |
              Es el espesor de quien toma 3,5 como **diámetro** exterior entre
              espesor: $e = D/3{,}5 = 249{,}55\ \text{mm}/3{,}5$. La relación
              es con el radio, $R/e = 3{,}5$, y $R = 136{,}40$ mm.
          - valor: '90.04'
            mensaje: |
              Sale de igualar a la tensión de la fibra del apartado c. La
              condición es la tensión máxima del eje macizo.
        pista: |
          $e = R/3{,}5$.
        desarrollo: |
          $e = R/3{,}5 = 136{,}40\ \text{mm}/3{,}5 = 38{,}97\ \text{mm}$, y el radio
          interior, $97{,}43$ mm.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Una incógnita de más: con el torsor de AB, $c$, la condición es
              $\int_A^E M_t\,dx = 0$, que da $c = 1{,}25\,m_0a$.
          - texto: >-
              El giro crece mientras $M_t > 0$: su máximo, $2{,}031\,m_0a^{2}/(GI_p)$,
              está a $2{,}25a$.
          - texto: >-
              Con 0,2° en radianes e $I_p = \pi d^{4}/32$: $d = 246{,}7$ mm.
          - texto: >-
              En E, $\tau = M_t r/I_p$ con el torsor de DE y $r = 5$ cm.
          - texto: >-
              El anular, con $r = 5R/7$ y la misma $\tau_{\max}$:
              $R = 136{,}4$ mm y $e = 39{,}0$ mm.
          - texto: >-
              El giro máximo está en C, donde acaba el torsor repartido.
            trampa: true
            mensaje: |
              El giro es máximo donde su derivada, $M_t/(GI_p)$, se anula: a
              $2{,}25a$, dentro de BC. En C ya está bajando.
    resolucion: |
      **La geometría y el convenio.** A en $x = 0$, B en $a$, C en $3a$, D
      en $5a$ y E en $6a$. Los momentos son vectores según el eje: $m_0$
      hacia $+x$ en BC y $M_0 = m_0a/2$ hacia $-x$ en D, como las flechas
      dobles del Word. El torsor de una sección es menos la suma de los
      pares que actúan a su izquierda, y el giro, la integral de
      $M_t/(GI_p)$ (ec. 12.9, apuntes del tema 12, p. 6).

      **a) El torsor.** Dos reacciones y una ecuación de equilibrio:
      hiperestático de grado 1. Con $c$, el torsor de AB:

      - AB: $M_t = c$.
      - BC: $M_t = c - m_0(x - a)$, en recta.
      - CD: $M_t = c - 2m_0a$.
      - DE: $M_t = c - 2m_0a + m_0a/2 = c - 1{,}5\,m_0a$.

      Los dos extremos no giran: $\varphi_E - \varphi_A = 0$ (ec. 12.13, p. 8),

      $$
      \int_0^{6a} M_t\,dx = ca + \left(2ca - 2m_0a^{2}\right) + (c - 2m_0a)\,2a + (c - 1{,}5\,m_0a)\,a = 6ca - 7{,}5\,m_0a^{2} = 0
      $$

      $c = 1{,}25\,m_0a$. Las reacciones van las dos hacia la izquierda:
      $1{,}25\,m_0a$ en A y $0{,}25\,m_0a$ en E, y con los $2m_0a$ de BC y
      el $-0{,}5\,m_0a$ de D suman cero.

      | tramo | $M_t$ (en $m_0a$) |
      |---|---|
      | AB | $1{,}25$ |
      | BC | de $1{,}25$ a $-0{,}75$, cero a $2{,}25a$ |
      | CD | $-0{,}75$ |
      | DE | $-0{,}25$ |

      **a) Los giros.** Integrando desde A, en $m_0a^{2}/(GI_p)$: en B,
      $1{,}25$; en BC, parábola con su máximo donde $M_t = 0$, a $2{,}25a$:

      $$
      \varphi_{\max} = \frac{1}{GI_p}\left(1{,}25\,m_0a^{2} + \frac{(1{,}25\,m_0a)^{2}}{2m_0}\right) = 2{,}03125\,\frac{m_0a^{2}}{GI_p}
      $$

      En C, $1{,}75$; en D, $1{,}75 - 0{,}75\cdot2 = 0{,}25$; en E, $0$, como
      tiene que ser.

