      **c) La constante K.** Con $\sigma = My/I_z$ (ec. 9.23, apuntes del
      tema 9, p. 12): el ala superior ($y = -4t$) se comprime donde
      $M > 0$, y lo más en B; la inferior ($y = 8t$), donde $M < 0$, en D.
      Con los datos, $-4{,}255$ kg/cm² arriba y $-4{,}997$ kg/cm² abajo.
      Igualarlas:

      $$
      Fa\cdot4t = \left(\frac{5Pa}{32} - \frac{Fa}{4}\right)8t
      \quad\Longrightarrow\quad
      F = \frac{5P}{24} = 16{,}667\ \text{kg}
      $$

      y de la ecuación de a, despejando K:

      $$
      K = \frac{F}{h + \dfrac{Pa^{3}}{32EI_z} - F\,\dfrac{7a^{3}}{12EI_z}} = 558{,}47\ \text{kg/m}
      $$

      Con esa K, $M_A = 26{,}67$ kg·m, menor que $M_B$: la compresión del ala
      superior sigue siendo máxima en B.

      **Comprobaciones.** El motor del curso (propiedades de la sección y
      el método de las redundantes del tema 11, con la condición del
      muelle) da la misma inercia, la misma F y los mismos flectores, y C
      queda exactamente a $-h + F/K$. Por otro camino, la fórmula de a con
      las flechas de la apuntalada calculadas aparte: la misma F. Con la K
      de c, las dos compresiones salen iguales.

  # ── Problema 4 · la estructura espacial ABCDE con la barra FD.
  - id: exerm2021-ext-8-la-estructura-abcde-con-la-barra-fd
