      <figcaption>

      Redibujada del Word original. En el PDF solo salen las cotas, los dos
      apoyos y los rótulos P y 4P: la barra y las dos flechas no se
      imprimen. El punto marca dónde se aplica 4P.

      </figcaption>
      </figure>

      **Notas nuestras.** Los dos apoyos están dibujados igual y se toman
      fijos en la dirección de la barra. Las dos cargas van según el eje de
      la barra, hacia la derecha, como las flechas del Word: P llega al
      extremo libre y 4P sale de la barra a $3a$ de ese extremo. La barra es
      de un solo material y una sola sección.
    pide: >-
      El diámetro d, en función de P y de σadm.
    pasos:
      - tipo: reconocer
        pregunta: |
          Entre los dos apoyos hay dos reacciones y la estática da una sola
          ecuación. ¿Qué ecuación cierra el problema?
        opciones:
          - texto: >-
              Que la barra entre los apoyos no cambia de longitud: la suma de
              $NL/(EA)$ de sus dos tramos es cero
            correcta: true
            mensaje: |
              Eso es (apuntes del tema 8, p. 4 y ec. 8.9, p. 7). Los dos
              apoyos no se mueven, así que lo que se alarga un tramo lo
              acorta el otro. Es la ecuación de compatibilidad que falta.
          - texto: >-
              Que cada apoyo se lleva la mitad de 4P
            mensaje: |
              El reparto sería ese si 4P estuviera en el centro. Está a $2a$
              de un apoyo y a $a$ del otro: el tramo corto es más rígido y se
              lleva más. Lo decide la compatibilidad.
          - texto: >-
              Que el apoyo de la izquierda se lleva la P del voladizo, y
              con eso la estática ya basta
            mensaje: |
              La P del voladizo va, en efecto, al apoyo de su lado. Pero quedan
              dos reacciones para repartir 4P y una sola ecuación de
              equilibrio: sigue faltando una.
      - tipo: calcular
        titulo: El axil del tramo largo
        pregunta: |
          ¿Cuánto vale el axil del tramo de $2a$, entre el apoyo de la
          izquierda y 4P, en unidades de P?
        respuesta:
          tipo: numero
          valor: '1.3333'
          tolerancia: 0.001
          formato: un número con su signo (el axil dividido por P), positivo si tracciona
        distractores:
          - valor: '2.6667'
            mensaje: |
              Has repartido 4P al revés. El tramo corto, de longitud $a$, es
              el más rígido y se lleva la parte mayor, $8P/3$; el largo, la
              menor: $N_1 = 4P\cdot a/(3a)$.
          - valor: '2'
            mensaje: |
              Es la mitad de 4P, como si los dos tramos fueran iguales. No lo
              son: $2a$ y $a$.
          - valor: '4'
            mensaje: |
              Es lo que sale si el apoyo de la derecha no sujetara. Está
              dibujado igual que el otro y se toma fijo: los dos se reparten
              4P.
          - valor: '-1.3333'
            mensaje: |
              El valor es ese y el signo no. 4P tira hacia la derecha y aleja
              el punto de aplicación del apoyo de la izquierda: el tramo
              largo se estira.
        pista: |
          Con $N_1$ en el tramo de $2a$ y $N_2$ en el de $a$: el equilibrio
          del punto de 4P da $N_1 - N_2 = 4P$, y la compatibilidad,
          $N_1\cdot2a + N_2\cdot a = 0$.
        desarrollo: |
          De la compatibilidad, $N_2 = -2N_1$; con el equilibrio,
          $3N_1 = 4P$:

          $$
          N_1 = \frac{4P}{3} = 1{,}3333\,P\ \text{(tracción)},\qquad N_2 = -\frac{8P}{3} = -2{,}6667\,P\ \text{(compresión)}
          $$
      - tipo: calcular
        titulo: El diámetro
        pregunta: |
          ¿Cuánto vale el diámetro necesario, en unidades de
          $\sqrt{P/\sigma_{adm}}$?
        respuesta:
          tipo: numero
          valor: '1.8426'
          tolerancia: 0.001
          formato: un número (d dividido por la raíz de P/σadm)
        distractores:
          - valor: '1.3029'
            mensaje: |
              Has dimensionado con el axil del tramo largo, $4P/3$. El que
              manda es el mayor en valor absoluto, $8P/3$, de compresión, en
              el tramo corto.
          - valor: '2.2568'
            mensaje: |
              Es el diámetro para $4P$, como si un solo tramo se llevara toda
              la carga. Los dos apoyos se la reparten.
          - valor: '1.5958'
            mensaje: |
              Es el diámetro para $2P$, con la carga a medias. El tramo corto
              se lleva $8P/3$.
          - valor: '1.1284'
            mensaje: |
              Es el diámetro para $P$, el axil del voladizo. Entre los apoyos
              hay más.
          - valor: '0.9213'
            mensaje: |
              Es el radio. El área es $\pi d^{2}/4$; si la escribes
              $\pi r^{2}$, despeja $r$ y multiplica por 2.
        pista: |
          $\sigma = N/A$ (ec. 8.5, p. 6) con el mayor $|N|$:
          $\pi d^{2}/4 \ge |N|_{\max}/\sigma_{adm}$.
        desarrollo: |
          $$
          \frac{\pi d^{2}}{4} = \frac{8P}{3\sigma_{adm}}
          \quad\Longrightarrow\quad
          d = \sqrt{\frac{32}{3\pi}}\,\sqrt{\frac{P}{\sigma_{adm}}} = 1{,}8426\,\sqrt{\frac{P}{\sigma_{adm}}}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El voladizo es isostático: su axil es $-P$, y P va al apoyo de
              la izquierda.
          - texto: >-
              Entre los apoyos, dos reacciones y una ecuación: falta la
              compatibilidad, $N_1\cdot2a + N_2\cdot a = 0$.
          - texto: >-
              Con $N_1 - N_2 = 4P$: $N_1 = 4P/3$ a tracción y $N_2 = -8P/3$
              a compresión.
          - texto: >-
              Manda $|N|_{\max} = 8P/3$: $\pi d^{2}/4 = 8P/(3\sigma_{adm})$ y
              $d = 1{,}843\sqrt{P/\sigma_{adm}}$.
          - texto: >-
              Por simetría cada apoyo se lleva $2P$, y $d = \sqrt{8P/(\pi\sigma_{adm})}$.
            trampa: true
            mensaje: |
              4P no está en el centro: a $2a$ de un apoyo y a $a$ del otro. El
              tramo corto, más rígido, se lleva $8P/3$, no $2P$.
    resolucion: |
      **El voladizo.** De 0 a $a$ la barra solo tiene la P de su extremo,
      que la empuja hacia el apoyo: es isostático, con $N = -P$, y esa P va
      al apoyo de la izquierda.

      **Entre los apoyos.** Con 4P a $2a$ del apoyo de la izquierda y a $a$
      del de la derecha, hay dos reacciones y una ecuación de equilibrio:
      hiperestático de grado 1 (apuntes del tema 8, p. 4). Con $N_1$ en el
      tramo de $2a$ y $N_2$ en el de $a$, el equilibrio del punto de
      aplicación de 4P es $N_1 - N_2 = 4P$. Los dos apoyos están fijos, así
      que la barra entre ellos no cambia de longitud (ec. 8.9, p. 7):

      $$
      \frac{N_1\cdot2a}{EA} + \frac{N_2\cdot a}{EA} = 0
      \quad\Longrightarrow\quad
      N_1 = \frac{4P}{3}\ \text{(tracción)},\qquad N_2 = -\frac{8P}{3}\ \text{(compresión)}
      $$

      El tramo corto, más rígido, se lleva más. Las reacciones, hacia la
      izquierda las dos: $7P/3$ en el apoyo de la izquierda (la P del
      voladizo más $4P/3$) y $8P/3$ en el de la derecha; con la P y la 4P,
      suman cero.

      **El diámetro.** La tensión es uniforme en cada tramo, $\sigma = N/A$
      (ec. 8.5, p. 6), y la mayor en valor absoluto está en el tramo corto,
      de compresión:

      $$
      \frac{8P/3}{\pi d^{2}/4} = \sigma_{adm}
      \quad\Longrightarrow\quad
      d = \sqrt{\frac{32P}{3\pi\sigma_{adm}}} = 1{,}843\,\sqrt{\frac{P}{\sigma_{adm}}}
      $$

      La pregunta solo pide no superar $\sigma_{adm}$; un tramo comprimido
      podría además pandear, que es del tema 14.

      **Comprobaciones.** El motor del curso (la barra con axiles del tema 8,
      con el voladizo y el tramo entre apoyos por separado) da $N = -P$,
      $4P/3$ y $-8P/3$, y el alargamiento total entre los apoyos, cero.

  # ── Teoría · pregunta 3 · la ecuación diferencial de la elástica.
  - id: exerm2021-ext-3-la-ecuacion-diferencial-de-la-elastica
    titulo: La ecuación diferencial de la curva elástica
    fuente: >-
      Cuestión 3 de teoría · Extraordinaria del 2 de febrero de 2021 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 10 (pp. 4-7). Los
      pasos de cálculo usan un ejemplo nuestro.
    nivel: examen
    enunciado: |
      3.(1p) Deducir la ecuación diferencial de la curva elástica.

      **Notas nuestras.** Es una pregunta de teoría: se pide la deducción,
      con los convenios del curso ($x$ a lo largo de la viga, $y$ hacia
      abajo y el flector positivo si tracciona la fibra de abajo).
    pide: >-
      La deducción de la ecuación diferencial de la elástica, con su signo.
    pasos:
      - tipo: reconocer
        pregunta: |
          La deducción iguala dos expresiones de la curvatura de la fibra
          neutra. ¿Cuáles?
        opciones:
          - texto: >-
              La que pide el flector, $1/\rho = M/(EI_z)$, que sale de Hooke y
              de la tensión de flexión, y la de la geometría de la elástica,
              $d\theta/dx$
            correcta: true
            mensaje: |
              Eso es (ecs. 10.4 y 10.8, pp. 5-6). Una dice cuánto se curva una
              rebanada por el flector; la otra, cómo se escribe esa curvatura
              con el giro de la elástica, que no cambia de longitud.
          - texto: >-
              Las del equilibrio de la rebanada, $dM/dx = T$ y $dT/dx = -q$
            mensaje: |
              Esas dan el flector a partir de las cargas, sin deformación
              ninguna. La elástica relaciona el flector con la forma que toma
              la viga.
          - texto: >-
              La flecha que da Castigliano, derivando la energía respecto de
              una carga
            mensaje: |
              Castigliano es del tema 13 y da el desplazamiento de un punto,
              no una ecuación diferencial para toda la viga.
      - tipo: reconocer
        pregunta: |
          ¿De dónde sale el menos de $v_{,xx} = -M/(EI_z)$?
        opciones:
          - texto: >-
              Con $y$ hacia abajo, un flector positivo curva la viga con la
              concavidad hacia arriba, y el ángulo disminuye al avanzar en $x$
            correcta: true
            mensaje: |
              Eso es (figura 10.3 y ec. 10.10, pp. 6-7). La rebanada con $M$
              positivo pasa de $\theta$ a $\theta - d\theta$: con estos ejes la
              curvatura es negativa.
          - texto: >-
              De que la fibra de arriba está comprimida
            mensaje: |
              Con $M$ positivo lo está, pero eso es el signo de la tensión, no
              el de la curvatura. El menos sale de cómo varía el ángulo de la
              tangente con los ejes del curso.
          - texto: >-
              Es un convenio que se pone para que la flecha salga positiva
            mensaje: |
              No se elige: lo imponen los ejes. Con $y$ hacia abajo, la
              geometría de la rebanada da el menos; muchos libros toman $y$
              hacia arriba y escriben $EI\,v'' = +M$.
      - tipo: calcular
        titulo: La curvatura de una sección, en un ejemplo
        pregunta: |
          Un ejemplo nuestro: en una sección de una viga con
          $EI_z = 4000$ kN·m², el flector vale $M = 60$ kN·m. ¿Cuánto vale
          $v_{,xx}$ con la ecuación aproximada, en m⁻¹?
        respuesta:
          tipo: numero
          valor: '-0.015'
          tolerancia: 0.00005
          formato: un número con su signo, en m⁻¹
        distractores:
          - valor: '0.015'
            mensaje: |
              El valor es ese y el signo no. Con $y$ hacia abajo y el flector
              positivo, $v_{,xx} = -M/(EI_z)$: la viga se curva hacia arriba.
          - valor: '-240000'
            mensaje: |
              Has multiplicado $M$ por $EI_z$. La curvatura es el flector
              **dividido** por la rigidez: cuanto más rígida, menos se curva.
        pista: |
          $v_{,xx} = -M/(EI_z)$ (ec. 10.14, p. 7).
        desarrollo: |
          $$
          v_{,xx} = -\frac{M}{EI_z} = -\frac{60\ \text{kN·m}}{4000\ \text{kN·m}^{2}} = -0{,}015\ \text{m}^{-1}
          $$

          El radio de curvatura es $\rho = EI_z/M = 66{,}67$ m.
      - tipo: calcular
        titulo: La ecuación exacta
        pregunta: |
          En la misma sección la tangente tiene $v_{,x} = 0{,}3$. ¿Cuánto
          vale $v_{,xx}$ con la ecuación exacta, en m⁻¹?
        respuesta:
          tipo: numero
          valor: '-0.014309'
          tolerancia: 0.00002
          formato: un número con su signo, en m⁻¹
        distractores:
          - valor: '-0.015'
            mensaje: |
              Es la aproximada, que supone $\theta$ pequeño. La exacta divide
              $v_{,xx}$ por $\sqrt{1 - v_{,x}^{2}}$ (ec. 10.12): con
              $v_{,x} = 0{,}3$ hay un 4,6 % de diferencia.
          - valor: '-0.017070'
            mensaje: |
              Es la exacta de los libros, $v''/(1+v'^{2})^{3/2}$, en la que
              $x$ es la abscisa del punto ya desplazado. En los apuntes $x$ se
              mide a lo largo de la fibra neutra, que no se alarga, y sale
              $\sin\theta = v_{,x}$: $v_{,xx}/\sqrt{1 - v_{,x}^{2}} = -M/(EI_z)$.
          - valor: '-0.01365'
            mensaje: |
              Te falta la raíz: el factor es $\sqrt{1 - v_{,x}^{2}} = 0{,}9539$,
              no $1 - v_{,x}^{2}$.
        pista: |
          La exacta (ec. 10.12):
          $\dfrac{v_{,xx}}{\sqrt{1 - v_{,x}^{2}}} = -\dfrac{M}{EI_z}$.
        desarrollo: |
          $$
          v_{,xx} = -\frac{M}{EI_z}\,\sqrt{1 - v_{,x}^{2}} = -0{,}015\ \text{m}^{-1}\cdot\sqrt{1 - 0{,}09} = -0{,}014309\ \text{m}^{-1}
          $$
      - tipo: redactar
        que: deduccion
        consigna: >-
          Deduce la ecuación diferencial de la curva elástica, como en el
          examen, con el dibujo de la rebanada y el porqué del signo.
        rubrica:
          - punto: >-
              Se parte de la flexión: las secciones siguen planas, la fibra a
              distancia y de la neutra se alarga εx = y/ρ (ec. 10.1) y, con
              Hooke, σx = Ey/ρ (ec. 10.2).
            porque: >-
              Es la curvatura que impone la deformación de la sección; sin
              ella no hay de dónde sacar ρ.
            minimo: true
          - punto: >-
              Se iguala con la tensión de flexión, σx = My/Iz (ec. 10.3), y
              sale 1/ρ = M/(EIz) (ec. 10.4).
            porque: >-
              Es la curvatura que pide el flector, la mitad física de la
              ecuación.
            minimo: true
          - punto: >-
              La fibra neutra no cambia de longitud: ρ dθ = dx, así que
              1/ρ = dθ/dx (ecs. 10.7 y 10.8), y dθ/dx = M/(EIz) (ec. 10.9).
            porque: >-
              Es la mitad geométrica: la curvatura escrita con el giro de la
              elástica.
            minimo: true
          - punto: >-
              El signo, con el dibujo: con y hacia abajo y M positivo, el
              ángulo disminuye al avanzar en x, y dθ/dx = −M/(EIz)
              (figura 10.3 y ec. 10.10).
            porque: >-
              Es lo que distingue una deducción de una fórmula recordada.
            minimo: true
          - punto: >-
              Con sen θ = v,x y cos θ = 1 + u,x (ec. 10.11) se llega a la
              exacta, v,xx/√(1 − v,x²) = −M/(EIz) (ec. 10.12); con giros
              pequeños, θ = v,x y u,x = 0 (ec. 10.13), y queda
              v,xx = −M/(EIz) (ec. 10.14).
            porque: >-
              La que se usa es la aproximada, y hay que decir de dónde sale la
              aproximación.
            minimo: true
          - punto: >-
              Se dice cuándo vale: flexión en un plano principal, giros
              pequeños y vigas esbeltas, en las que la cortante apenas añade
              flecha.
            porque: >-
              Son las hipótesis que la deducción ha ido usando.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              La fibra a distancia $y$ de la neutra se alarga
              $\varepsilon_x = y/\rho$, y con Hooke $\sigma_x = Ey/\rho$.
          - texto: >-
              Con $\sigma_x = My/I_z$: $1/\rho = M/(EI_z)$.
          - texto: >-
              La elástica no cambia de longitud: $\rho\,d\theta = dx$ y
              $1/\rho = d\theta/dx$.
          - texto: >-
              Con $y$ hacia abajo y $M > 0$ el ángulo disminuye:
              $d\theta/dx = -M/(EI_z)$.
          - texto: >-
              Con giros pequeños, $\theta = v_{,x}$, y queda
              $v_{,xx} = -M/(EI_z)$.
          - texto: >-
              La curvatura se obtiene de $dM/dx = T$, integrando dos veces la
              cortante.
            trampa: true
            mensaje: |
              $dM/dx = T$ es el equilibrio de la rebanada: da el flector, no
              la deformación. La curvatura sale de Hooke y de la tensión de
              flexión.
    resolucion: |
      Los ejes son los del curso: $x$ a lo largo de la viga, $y$ hacia abajo,
      y el flector positivo si tracciona la fibra de abajo (apuntes del tema
      10, pp. 4-7).

      **La curvatura que pide el flector.** Las secciones siguen planas y
      perpendiculares al eje deformado. Una rebanada de longitud $dx$ se
      curva con radio $\rho$, y la fibra a distancia $y$ de la neutra se
      alarga (ec. 10.1) y, con Hooke, se tensa (ec. 10.2):

      $$
      \varepsilon_x = \frac{y}{\rho},\qquad \sigma_x = \frac{Ey}{\rho}
      $$

      La tensión de flexión es $\sigma_x = My/I_z$ (ec. 10.3). Igualando
      (ec. 10.4):

      $$
      \frac{1}{\rho} = \frac{M}{EI_z}
      $$

      **La curvatura de la elástica.** La fibra neutra no cambia de
      longitud: si la tangente gira $d\theta$ a lo largo del arco,
      $\rho\,d\theta = dx$ (ec. 10.7) y $1/\rho = d\theta/dx$ (ec. 10.8).
      Con la anterior, $d\theta/dx = M/(EI_z)$ (ec. 10.9).

      **El signo.** Con $M$ positivo la rebanada se curva con la concavidad
      hacia arriba, y al avanzar en $x$ el ángulo de la tangente pasa de
      $\theta$ a $\theta - d\theta$ (figura 10.3, p. 6): con estos ejes la
      curvatura es negativa, y (ec. 10.10, p. 7)

      $$
      \frac{d\theta}{dx} = -\frac{M}{EI_z}
      $$

      **La exacta y la aproximada.** En la rebanada deformada,
      $\sin\theta = v_{,x}$ y $\cos\theta = 1 + u_{,x}$ (ec. 10.11). Con
      $\theta = \arcsin v_{,x}$ sale la ecuación exacta (ec. 10.12):

      $$
      \frac{v_{,xx}}{\sqrt{1 - v_{,x}^{2}}} = -\frac{M}{EI_z}
      $$

      Si el giro es pequeño, $\theta = v_{,x}$ y $u_{,x} = 0$ (ec. 10.13), y
      queda la ecuación diferencial aproximada de la elástica (ec. 10.14):

      $$
      v_{,xx} = \frac{d^{2}v}{dx^{2}} = -\frac{M}{EI_z}
      $$

      Vale en flexión en un plano principal, con giros pequeños y en vigas
      esbeltas, en las que la cortante apenas añade flecha. Integrada dos
      veces con las condiciones de los apoyos, da $\theta$ y $v$ en toda la
      viga.

      **Un ejemplo (nuestro).** Con $EI_z = 4000$ kN·m² y $M = 60$ kN·m:
      $v_{,xx} = -0{,}015$ m⁻¹, un radio de 66,67 m. Si en esa sección
      $v_{,x} = 0{,}3$, la exacta da $-0{,}014309$ m⁻¹, un 4,6 % menos. El
      motor del curso (la elástica de un voladizo con un par en el extremo,
      que tiene el flector constante) da la misma curvatura derivando dos
      veces la flecha.

  # ── Teoría · pregunta 4 · la compresión excéntrica de columnas esbeltas.
  - id: exerm2021-ext-4-compresion-excentrica-de-columnas-esbeltas
    titulo: La compresión excéntrica de columnas esbeltas
    fuente: >-
      Cuestión 4 de teoría · Extraordinaria del 2 de febrero de 2021 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 14 (pp. 9-11). Los
      pasos de cálculo usan un ejemplo nuestro.
    nivel: examen
    enunciado: |
      4.(1p) Compresión excéntrica de columnas esbeltas.

      **Notas nuestras.** El enunciado es solo el título del apartado de
      los apuntes: se pide desarrollarlo, para la columna empotrada en la
      base y libre arriba de los apuntes.
    pide: >-
      La deducción del desplazamiento del extremo libre y del flector máximo
      de una columna esbelta con la carga excéntrica, y lo que se sigue de
      ellos.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué no basta la flexión compuesta del tema 9 para una columna
          esbelta?
        opciones:
          - texto: >-
              Porque el extremo libre se desplaza del orden de la
              excentricidad, y el flector hay que escribirlo sobre la columna
              deformada
            correcta: true
            mensaje: |
              Eso es (p. 9). La flexión compuesta toma el brazo $e_y$ fijo; en
              una columna esbelta la carga se aleja al curvarse la columna, y
              el flector crece con la propia flecha.
          - texto: >-
              Porque la carga supera la crítica de pandeo
            mensaje: |
              Con la carga en la crítica la columna no aguanta. La
              compresión excéntrica estudia cargas menores, en las que la
              flecha ya es apreciable.
          - texto: >-
              Porque la columna es corta y no vale la curva de Euler
            mensaje: |
              Es al revés: el análisis es para columnas esbeltas, en las que
              la flecha es del orden de la excentricidad. En una corta basta
              la flexión compuesta.
      - tipo: calcular
        titulo: El desplazamiento del extremo libre, en un ejemplo
        pregunta: |
          Un ejemplo nuestro: una columna de acero, empotrada en la base y
          libre arriba, de $L = 3$ m y sección circular maciza de 100 mm de
          diámetro, con $E = 200$ GPa, comprimida por $P = 100$ kN a
          $e_y = 15$ mm del eje. ¿Cuánto se desplaza el extremo libre, en mm?
        respuesta:
          tipo: numero
          valor: '11.06'
          tolerancia: 0.01
          formato: un número, en mm
        distractores:
          - valor: '6.875'
            mensaje: |
              Es la flecha de primer orden del tema 10, la de un voladizo con
              el par $Pe_y$ en el extremo, $Pe_yL^{2}/(2EI_z)$. No cuenta que
              el brazo crece con la flecha.
          - valor: '6.366'
            mensaje: |
              Es $e_y(1 - \cos\alpha_zL)$: has escrito el flector sin
              $\delta_y$, $M = Pv - Pe_y$. El brazo se mide desde el extremo
              desplazado, $e_y + \delta_y - v$, y falta dividir por
              $\cos\alpha_zL$.
          - valor: '0.002095'
            mensaje: |
              Tienes la calculadora en grados. $\alpha_zL = 0{,}9575$ va en
              radianes: $\cos0{,}9575 = 0{,}5756$.
        pista: |
          $\alpha_z = \sqrt{P/(EI_z)}$ y
          $\delta_y = e_y\,\dfrac{1 - \cos\alpha_zL}{\cos\alpha_zL}$
          (ec. 14.17, p. 10), con $I_z = \pi D^{4}/64$.
        desarrollo: |
          $I_z = \pi\cdot0{,}1^{4}/64\ \text{m}^{4} = 4{,}909\cdot10^{-6}\ \text{m}^{4}$,
          $EI_z = 981{,}7$ kN·m² y
          $\alpha_zL = \sqrt{100/981{,}7}\cdot3 = 0{,}9575$ rad, con
          $\cos\alpha_zL = 0{,}5756$:

          $$
          \delta_y = 15\ \text{mm}\cdot\frac{1 - 0{,}5756}{0{,}5756} = 11{,}06\ \text{mm}
          $$
      - tipo: calcular
        titulo: El flector en el empotramiento
        pregunta: |
          En el mismo ejemplo, ¿cuánto vale el flector máximo, en valor
          absoluto, en kN·m?
        respuesta:
          tipo: numero
          valor: '2.606'
          tolerancia: 0.005
          formato: un número, en kN·m (el valor absoluto)
        distractores:
          - valor: '1.5'
            mensaje: |
              Es $Pe_y$, el de la flexión compuesta del tema 9, sin
              amplificar. En la columna deformada el brazo es
              $e_y + \delta_y$: $M_{\max} = Pe_y\sec\alpha_zL$.
          - valor: '2.137'
            mensaje: |
              Es lo que sale con la flecha sin $\delta_y$ en el flector,
              $e_y(1 - \cos\alpha_zL)$. El factor bueno es la secante:
              $\sec\alpha_zL = 1{,}737$.
        pista: |
          $M_{\max} = M_A = -Pe_y\sec\alpha_zL$ (ec. 14.20, p. 11): el flector
          de la flexión compuesta por la secante.
        desarrollo: |
          $$
          |M_{\max}| = Pe_y\sec\alpha_zL = 100\ \text{kN}\cdot0{,}015\ \text{m}\cdot1{,}7373 = 2{,}606\ \text{kN·m}
          $$

          Es lo mismo que $P(e_y + \delta_y) = 100\ \text{kN}\cdot0{,}02606\ \text{m}$.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Desarrolla la compresión excéntrica de una columna esbelta, como en
          el examen, con el dibujo de la columna deformada.
        rubrica:
          - punto: >-
              Se plantea la columna empotrada en la base y libre arriba, con P
              a una distancia ey del eje, y se dibuja deformada, con el
              desplazamiento δy del extremo libre (figura 14.5).
            porque: >-
              Sin la configuración deformada no hay brazo que crezca, y la
              pregunta es justo eso.
            minimo: true
          - punto: >-
              Se escribe el flector sobre la columna deformada, con el brazo
              ey + δy − v: M = Pv − P(ey + δy) (ec. 14.13).
            porque: >-
              Es el paso que distingue el problema de la flexión compuesta.
            minimo: true
          - punto: >-
              Con la ecuación aproximada de la elástica, v,xx = −M/(EIz), sale
              v,xx + αz²v = αz²(ey + δy), con αz² = P/(EIz), y su solución
              general (ecs. 14.14 y 14.15).
            porque: >-
              Es la ecuación del tema 10 con el flector de la columna
              deformada.
            minimo: true
          - punto: >-
              Las tres condiciones, v(0) = 0, v,x(0) = 0 y v(L) = δy
              (ec. 14.16), dan C1 = 0, C2 = −(ey + δy) y
              δy = ey(1 − cos αzL)/cos αzL (ec. 14.17).
            porque: >-
              Hay tres incógnitas, C1, C2 y δy: la tercera condición es la que
              cierra el problema.
            minimo: true
          - punto: >-
              El flector máximo, en el empotramiento: Mmax = −Pey sec αzL
              (ecs. 14.19 y 14.20); la secante, mayor que 1, amplifica el de la
              flexión compuesta.
            porque: >-
              Es el resultado que se usa: la fórmula de la secante.
            minimo: true
          - punto: >-
              El límite: con αzL = π/2 el flector y la flecha se hacen
              infinitos, y P = π²EIz/(2L)², la crítica de la empotrada-libre
              (ec. 14.21). La flecha no es proporcional a P: no se puede
              superponer.
            porque: >-
              Enlaza la compresión excéntrica con el pandeo de Euler.
      - tipo: justificar
        pregunta: Ordena el desarrollo. Una pieza es falsa.
        piezas:
          - texto: >-
              La carga queda a $e_y + \delta_y$ del eje sin deformar, y el
              flector es $M = Pv - P(e_y + \delta_y)$.
          - texto: >-
              Con $v_{,xx} = -M/(EI_z)$:
              $v_{,xx} + \alpha_z^{2}v = \alpha_z^{2}(e_y + \delta_y)$.
          - texto: >-
              Con $v(0) = 0$, $v_{,x}(0) = 0$ y $v(L) = \delta_y$:
              $\delta_y = e_y(1 - \cos\alpha_zL)/\cos\alpha_zL$.
          - texto: >-
              En el empotramiento, $M_{\max} = -Pe_y\sec\alpha_zL$; con
              $\alpha_zL = \pi/2$ se llega a la crítica, $\pi^{2}EI_z/(2L)^{2}$.
          - texto: >-
              Como el problema es lineal, la flecha de dos cargas iguales es
              el doble de la de una.
            trampa: true
            mensaje: |
              $P$ está también dentro del coseno: la flecha no es proporcional
              a la carga y no se puede superponer. Las cargas se suman y la
              fórmula se aplica a la suma.
    resolucion: |
      **El planteamiento** (apuntes del tema 14, pp. 9-11). Una columna
      esbelta empotrada en A y libre arriba recibe una compresión $P$
      paralela a su eje, a una distancia $e_y$ sobre el eje $y$ de la
      sección. Si la columna fuera rígida, sería flexión compuesta, con el
      flector $-Pe_y$. Pero se curva, su extremo libre se desplaza
      $\delta_y$, del orden de $e_y$, y la carga se aleja: el equilibrio se
      escribe sobre la columna deformada, como en Euler.

      **El flector** (ec. 14.13). Con $x$ hacia arriba desde A e $y$ hacia
      la carga, la carga está a $e_y + \delta_y$ del eje sin deformar, y una
      sección a la altura $x$ se ha desplazado $v$:

      $$
      M = Pv - P\,(e_y + \delta_y)
      $$

      **La ecuación** (ecs. 14.14 y 14.15). Con $v_{,xx} = -M/(EI_z)$ y
      $\alpha_z^{2} = P/(EI_z)$:

      $$
      v_{,xx} + \alpha_z^{2}\,v = \alpha_z^{2}\,(e_y + \delta_y),\qquad
      v = C_1\sin\alpha_zx + C_2\cos\alpha_zx + (e_y + \delta_y)
      $$

      **Las condiciones** (ecs. 14.16 y 14.17): $v(0) = 0$, $v_{,x}(0) = 0$ y
      $v(L) = \delta_y$. Dan $C_1 = 0$, $C_2 = -(e_y + \delta_y)$ y

      $$
      \delta_y = e_y\,\frac{1 - \cos\alpha_zL}{\cos\alpha_zL} = e_y\,(\sec\alpha_zL - 1)
      $$

      **La elástica y el flector** (ecs. 14.18 a 14.20):

      $$
      v = e_y\,\frac{1 - \cos\alpha_zx}{\cos\alpha_zL},\qquad
      M = -Pe_y\,\frac{\cos\alpha_zx}{\cos\alpha_zL},\qquad
      M_{\max} = M_A = -Pe_y\sec\alpha_zL
      $$

      $\sec\alpha_zL$, siempre mayor que 1, es el factor que multiplica el
      flector de la flexión compuesta: en una columna poco esbelta vale casi
      1, y crece con la esbeltez.

      **El límite** (ec. 14.21). Con $\alpha_zL = \pi/2$ el flector y la
      flecha se hacen infinitos: es

      $$
      P = \frac{\pi^{2}EI_z}{(2L)^{2}}
      $$

      la carga crítica de la empotrada-libre en el plano de la
      excentricidad. La flecha no es proporcional a $P$, que está dentro del
      coseno: no se puede superponer el efecto de varias cargas.

      **Un ejemplo (nuestro).** Columna de acero de 3 m, maciza de 100 mm de
      diámetro, $E = 200$ GPa, $P = 100$ kN a $e_y = 15$ mm:
      $EI_z = 981{,}7$ kN·m², $\alpha_zL = 0{,}9575$ rad,
      $\sec\alpha_zL = 1{,}737$, $\delta_y = 11{,}06$ mm y
      $|M_{\max}| = 2{,}606$ kN·m, frente a los 1,5 kN·m de la flexión
      compuesta. La carga crítica es 269,2 kN: $P$ es el 37 % de ella. El
      motor del curso da lo mismo, y la ecuación de la columna deformada
      integrada paso a paso, también.

  # ── Problema 1 · la chapa romboidal con tensiones oblicuas en el contorno.
  - id: exerm2021-ext-5-la-chapa-romboidal-con-tensiones-oblicuas
    titulo: La chapa romboidal con tensiones oblicuas en el contorno, sus tensiones principales y el alargamiento de un lado
    fuente: >-
      Problema 1 · Extraordinaria del 2 de febrero de 2021 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1,5 puntos. El examen no publica resolución; el desarrollo es
      nuestro, con los convenios de los temas 2, 3 y 4.
