      <figcaption>

      La sección, como en el original: solo acota el ancho del ala, la
      altura del alma y el ancho de la pestaña.

      </figcaption>
      </figure>

      **Notas nuestras.** «P=80K» se lee 80 kg (kilogramos fuerza), como los
      kg de K y de E. P empuja la viga hacia arriba, en D, a $a/2$ de A. El
      extremo del muelle está a una altura h sobre C antes de unirlos. Los
      gruesos del ala, del alma y de la pestaña no están acotados: se toman
      iguales a t, que es lo que da el dibujo a escala. 10t es la altura
      del alma entre el ala y la pestaña. El ala superior es la de 10t de
      ancho; la inferior, la pestaña de 2t. El apoyo B sujeta en los dos
      sentidos.
    pide: >-
      a) La fuerza del muelle en función de los datos. b) Los diagramas de
      cortantes y de flectores. c) La constante K con la que las dos alas
      tienen la misma compresión máxima.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántas incógnitas hiperestáticas tiene la viga, una vez unida al
          muelle, y qué condiciones las dan?
        opciones:
          - texto: >-
              Dos, la reacción de B y la fuerza F del muelle: B no se mueve, y
              C sube lo que el muelle no se estira, $v_C = -h + F/K$
            correcta: true
            mensaje: |
              Eso es (apuntes del tema 11, p. 3). Sobre la base isostática,
              el voladizo empotrado en A, se quitan B y el muelle, y se
              imponen sus dos condiciones. El hueco h lo cierran entre los
              dos: C sube y el muelle se estira $F/K$.
          - texto: >-
              Una, la reacción de B: la fuerza del muelle es $Kh$, porque se
              estira h
            mensaje: |
              El muelle se estiraría h si C no se moviera. Pero C sube al
              tirar de ella, y el muelle se estira menos: $F$ es una
              incógnita y depende de la rigidez de la viga.
          - texto: >-
              Ninguna: el muelle es una carga más y la viga, empotrada y
              apoyada, es isostática
            mensaje: |
              Una viga empotrada en A y apoyada en B ya es hiperestática de
              grado 1. El muelle, cuya fuerza depende de lo que se mueva C,
              añade otra incógnita.
      - tipo: calcular
        titulo: El momento de inercia de la sección
        pregunta: |
          Con $t = 25$ mm, ¿cuánto vale $I_z$, respecto del eje que pasa por
          G, en cm⁴?
        respuesta:
          tipo: numero
          valor: '14036.5'
          tolerancia: 0.5
          formato: un número, en cm⁴
        distractores:
          - valor: '3294.3'
            mensaje: |
              Has sumado las inercias propias de los tres rectángulos sin
              Steiner. Cada uno tiene su centro lejos de G: hay que sumar
              $A\,d^{2}$.
          - valor: '27786.5'
            mensaje: |
              Es la inercia respecto de la cara de arriba. La flexión va
              respecto del eje que pasa por G, a 4t de esa cara.
          - valor: '9196.0'
            mensaje: |
              Te has dejado la pestaña de abajo. Es pequeña, pero está lejos
              de G, a 7,5t: aporta casi un tercio de la inercia.
        pista: |
          Con y desde la cara de arriba: ala $10t\times t$ en $0{,}5t$, alma
          $t\times10t$ en $6t$ y pestaña $2t\times t$ en $11{,}5t$. G está en
          $y_G = 88t^{3}/22t^{2} = 4t$.
        desarrollo: |
          $$
          I_z = \left(\tfrac{10}{12} + 10\cdot3{,}5^{2}\right)t^{4} + \left(\tfrac{1000}{12} + 10\cdot2^{2}\right)t^{4} + \left(\tfrac{2}{12} + 2\cdot7{,}5^{2}\right)t^{4} = 359{,}33\,t^{4}
          $$

          Con $t^{4} = 2{,}5^{4}\ \text{cm}^{4} = 39{,}0625\ \text{cm}^{4}$:
          $I_z = 14036{,}5\ \text{cm}^{4}$.
      - tipo: calcular
        titulo: La fuerza del muelle
        pregunta: |
          ¿Cuánto vale la fuerza del muelle, en kg?
        respuesta:
          tipo: numero
          valor: '14.933'
          tolerancia: 0.01
          formato: un número, en kg
        distractores:
          - valor: '4.452'
            mensaje: |
              Has mezclado unidades: $E$ en kg/cm² con $I_z$ en m⁴. Con todo
              en metros, $E = 2{,}1\cdot10^{10}$ kg/m².
          - valor: '2372.9'
            mensaje: |
              Es la fuerza para llevar C hasta el extremo del muelle como si
              este fuera rígido. El muelle también se estira, $F/K$: entra
              $1/K$ en el denominador.
        pista: |
          En la viga empotrada en A y apoyada en B, C baja $Pa^{3}/(32EI_z)$
          por P y sube $7a^{3}/(12EI_z)$ por cada kg de F. El hueco h lo
          cierran C y el muelle: $F/K + F\,\tfrac{7a^{3}}{12EI_z} - \tfrac{Pa^{3}}{32EI_z} = h$.
        desarrollo: |
          $EI_z = 2{,}1\cdot10^{10}\ \text{kg/m}^{2}\cdot1{,}4036\cdot10^{-4}\ \text{m}^{4} = 2{,}948\cdot10^{6}\ \text{kg·m}^{2}$:

          $$
          F = \frac{h + \dfrac{Pa^{3}}{32EI_z}}{\dfrac{1}{K} + \dfrac{7a^{3}}{12EI_z}} = \frac{0{,}03\ \text{m} + 5{,}428\cdot10^{-5}\ \text{m}}{2\cdot10^{-3}\ \text{m/kg} + 1{,}267\cdot10^{-5}\ \text{m/kg}} = 14{,}933\ \text{kg}
          $$
      - tipo: calcular
        titulo: El flector en el empotramiento
        pregunta: |
          ¿Cuánto vale el flector en A, en kg·m?
        respuesta:
          tipo: numero
          valor: '30.13'
          tolerancia: 0.02
          formato: un número con su signo, en kg·m (positivo si tracciona la fibra de abajo)
        distractores:
          - valor: '60'
            mensaje: |
              Es el flector de la viga sin el muelle, $3Pa/16$. La fuerza F
              del voladizo también llega a A: le resta $Fa/2$.
          - valor: '89.87'
            mensaje: |
              Has sumado $Fa/2$. El flector $Fa$ que F hace en B pasa a A con
              la mitad y cambiado de signo: $M_A = 3Pa/16 - Fa/2$.
        pista: |
          Por superposición en la viga apuntalada: P en el centro de AB da
          $M_A = 3Pa/16$; el flector $Fa$ en B da $M_A = -Fa/2$.
        desarrollo: |
          $$
          M_A = \frac{3Pa}{16} - \frac{Fa}{2} = 60\ \text{kg·m} - \frac{14{,}933\ \text{kg}\cdot4\ \text{m}}{2} = 30{,}13\ \text{kg·m}
          $$
      - tipo: calcular
        titulo: El flector bajo la carga
        pregunta: |
          ¿Cuánto vale el flector en D, en kg·m?
        respuesta:
          tipo: numero
          valor: '-35.07'
          tolerancia: 0.02
          formato: un número con su signo, en kg·m (positivo si tracciona la fibra de abajo)
        distractores:
          - valor: '-50'
            mensaje: |
              Es el flector de la viga sin el muelle, $-5Pa/32$. El flector
              $Fa$ de B le suma, en D, $Fa/4$.
        pista: |
          En el centro de AB: $M_D = -5Pa/32 + Fa/4$ (el medio de $M_A$ y
          $M_B$, más el de P).
        desarrollo: |
          $$
          M_D = -\frac{5Pa}{32} + \frac{Fa}{4} = -50\ \text{kg·m} + \frac{14{,}933\ \text{kg}\cdot4\ \text{m}}{4} = -35{,}07\ \text{kg·m}
          $$

          En B, $M_B = Fa = 59{,}73$ kg·m, y en C, cero.
      - tipo: calcular
        titulo: La fuerza del muelle para el apartado c
        pregunta: |
          ¿Qué fuerza F tiene que hacer el muelle para que la compresión
          máxima del ala superior sea igual a la del ala inferior, en kg?
        respuesta:
          tipo: numero
          valor: '16.667'
          tolerancia: 0.005
          formato: un número, en kg
        distractores:
          - valor: '5.556'
            mensaje: |
              Has cambiado las distancias de las alas a G. El ala superior
              está a 4t de G y la inferior a 8t: la de abajo, con el mismo
              flector, se comprime el doble.
          - valor: '10'
            mensaje: |
              Has igualado los flectores, $M_B = |M_D|$. Lo que se iguala son
              las tensiones: $M_B\cdot4t = |M_D|\cdot8t$.
        pista: |
          El ala superior se comprime donde $M > 0$, y lo más en B; la
          inferior, donde $M < 0$, y lo más en D:
          $M_B\cdot4t/I_z = |M_D|\cdot8t/I_z$.
        desarrollo: |
          $$
          Fa\cdot4t = \left(\frac{5Pa}{32} - \frac{Fa}{4}\right)8t
          \quad\Longrightarrow\quad
          F = \frac{5P}{24} = \frac{5\cdot80\ \text{kg}}{24} = 16{,}667\ \text{kg}
          $$
      - tipo: calcular
        titulo: La constante del muelle
        pregunta: |
          ¿Qué constante K da esa fuerza, en kg/m?
        respuesta:
          tipo: numero
          valor: '558.47'
          tolerancia: 0.05
          formato: un número, en kg/m
        distractores:
          - valor: '185.28'
            mensaje: |
              Sale de la F con las distancias de las alas cambiadas. El ala
              superior está a 4t de G y la inferior a 8t.
          - valor: '334.14'
            mensaje: |
              Sale de la F que iguala los flectores. Lo que se iguala son las
              tensiones, y las alas están a distancias distintas de G.
        pista: |
          De la ecuación del apartado a, despejando K:
          $K = F/\left(h + Pa^{3}/(32EI_z) - F\cdot7a^{3}/(12EI_z)\right)$.
        desarrollo: |
          $$
          K = \frac{16{,}667\ \text{kg}}{0{,}03\ \text{m} + 5{,}428\cdot10^{-5}\ \text{m} - 16{,}667\ \text{kg}\cdot1{,}267\cdot10^{-5}\ \text{m/kg}} = 558{,}47\ \text{kg/m}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La sección: $y_G = 4t$ desde arriba e $I_z = 359{,}33\,t^{4}$.
          - texto: >-
              Grado 2: la reacción de B y F, con $v_B = 0$ y
              $v_C = -h + F/K$.
          - texto: >-
              $F = \left(h + \frac{Pa^{3}}{32EI_z}\right)\big/\left(\frac{1}{K} + \frac{7a^{3}}{12EI_z}\right)$.
          - texto: >-
              Flectores: $M_A = 3Pa/16 - Fa/2$, $M_D = -5Pa/32 + Fa/4$ y
              $M_B = Fa$, en rectas entre ellos.
          - texto: >-
              Para c, $M_B\cdot4t = |M_D|\cdot8t$: $F = 5P/24$, y K de la
              ecuación de a.
          - texto: >-
              Como el muelle es blando, $F = Kh$ y la viga se resuelve como
              apuntalada con esa carga.
            trampa: true
            mensaje: |
              $F = Kh$ supone que C no se mueve. C sube al unirla, y la
              ecuación de compatibilidad tiene en cuenta los dos: la viga y
              el muelle.
    resolucion: |
      **Los datos.** Todo en kg y m: $P = 80$ kg hacia arriba, $a = 4$ m,
      $h = 0{,}03$ m, $E = 2{,}1\cdot10^{6}\ \text{kg/cm}^{2} = 2{,}1\cdot10^{10}\ \text{kg/m}^{2}$,
      $t = 0{,}025$ m y $K = 500$ kg/m. Convenio del curso: $y$ hacia abajo,
      $v$ positiva hacia abajo y $M > 0$ si tracciona la fibra de abajo.

      **La sección.** Con $y$ desde la cara de arriba y los gruesos iguales
      a t: ala $10t\times t$ con su centro en $0{,}5t$, alma $t\times10t$ en
      $6t$ y pestaña $2t\times t$ en $11{,}5t$. $A = 22t^{2}$ e
      $y_G = (5 + 60 + 23)\,t^{3}/(22t^{2}) = 4t = 10$ cm. Con Steiner:

      $$
      I_z = (0{,}833 + 122{,}5)\,t^{4} + (83{,}33 + 40)\,t^{4} + (0{,}167 + 112{,}5)\,t^{4} = 359{,}33\,t^{4} = 14036{,}5\ \text{cm}^{4}
      $$

      El ala superior está a $4t = 10$ cm de G y la inferior a $8t = 20$ cm.
      $EI_z = 2{,}948\cdot10^{6}$ kg·m².

      **El grado.** Empotramiento en A, apoyo en B y muelle en C, con cargas
      verticales: cuatro incógnitas y dos ecuaciones, grado 2 (apuntes del
      tema 11, p. 3). Base isostática: el voladizo empotrado en A.
      Redundantes: la reacción de B y la fuerza F del muelle, que tira de C
      hacia arriba. Condiciones: $v_B = 0$ y $v_C = -h + F/K$; el hueco h lo
      cierran entre la subida de C y el alargamiento del muelle.

      **a) La fuerza del muelle.** Con la reacción de B resuelta, la viga es
      la apuntalada AB con el voladizo BC. Integrando la elástica
      (ec. 10.14, apuntes del tema 10, p. 7), C baja $Pa^{3}/(32EI_z)$ por P y
      sube $7a^{3}/(12EI_z)$ por cada unidad de F: $a^{3}/3$ del voladizo y
      $a^{3}/4$ del giro de B bajo el flector $Fa$. La compatibilidad del
      muelle:

      $$
      \frac{F}{K} + F\,\frac{7a^{3}}{12EI_z} - \frac{Pa^{3}}{32EI_z} = h
      \quad\Longrightarrow\quad
      F = \frac{h + \dfrac{Pa^{3}}{32EI_z}}{\dfrac{1}{K} + \dfrac{7a^{3}}{12EI_z}}
      $$

      Con los datos, $F = 14{,}933$ kg: el muelle es mucho más blando que la
      viga ($1/K = 2\cdot10^{-3}$ m/kg frente a $1{,}27\cdot10^{-5}$ m/kg), y
      C sube solo 0,135 mm.

      **b) Los diagramas.** Por superposición en la apuntalada:

      $$
      M_A = \frac{3Pa}{16} - \frac{Fa}{2} = 30{,}13\ \text{kg·m},\qquad
      M_D = -\frac{5Pa}{32} + \frac{Fa}{4} = -35{,}07\ \text{kg·m},\qquad
      M_B = Fa = 59{,}73\ \text{kg·m},\qquad M_C = 0
      $$

      con rectas entre ellos. La cortante, $T = dM/dx$: $-32{,}60$ kg de A a
      D, $47{,}40$ kg de D a B y $-14{,}93$ kg de B a C. Las reacciones, las
      dos hacia abajo: $32{,}60$ kg en A, con el par $M_A$, y $62{,}33$ kg en
      B. Con los 80 kg de P y los 14,93 del muelle, hacia arriba, suman cero.

