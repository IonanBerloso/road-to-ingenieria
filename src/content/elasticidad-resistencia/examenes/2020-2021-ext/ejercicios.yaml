      **Notas nuestras.** La barra FD mide L, como en el dibujo, y es del
      mismo material que la estructura. Con $I_z/(AL^{2}) = 2$, su rigidez es
      $EA = EI_z/(2L^{2})$. $q_0$ es por unidad de longitud de barra: en DE,
      vertical hacia abajo; en CD, horizontal, paralela a BC y hacia el lado
      de B, como las flechas del Word. CD está en profundidad; hacia dónde
      no cambia nada, por simetría.
    pide: >-
      a) El axil de la barra FD, en función de q0 y L. b) El desplazamiento
      vertical de D, en función de q0, L y EIz.
    pasos:
      - tipo: reconocer
        pregunta: |
          La estructura empotrada en A ya está en equilibrio; la barra FD es
          un enlace de más. ¿Con qué ecuación se saca su axil N?
        opciones:
          - texto: >-
              Derivando respecto de N la coenergía de todo el sistema, con la
              de la barra dentro, e igualando a cero
            correcta: true
            mensaje: |
              Eso es: N es una fuerza interna, y su derivada es nula
              (ec. 13.54, apuntes del tema 13, p. 19). La energía de la barra,
              $N^{2}L/(2EA)$, tiene que estar: es la que dice cuánto cede.
          - texto: >-
              Imponiendo que D no se mueva en vertical, porque la barra lo
              sujeta
            mensaje: |
              Eso sería con la barra rígida. La barra se alarga
              $NL/(EA)$, y D baja eso mismo. El enunciado pide la energía
              axial de la barra justo por esto.
          - texto: >-
              Con el equilibrio de D: la barra se lleva toda la carga de DE
            mensaje: |
              D está unido rígidamente a CD y a DE: la estructura también se
              lleva parte. Es hiperestático, y el reparto depende de las
              rigideces.
      - tipo: calcular
        titulo: El axil de la barra
        pregunta: |
          ¿Cuánto vale el axil de FD, en unidades de $q_0L$?
        respuesta:
          tipo: numero
          valor: '0.3368'
          tolerancia: 0.0005
          formato: un número con su signo (el axil dividido por q0·L), positivo si tracciona
        distractores:
          - valor: '0.2125'
            mensaje: |
              Te has dejado la torsión. BC y AB trabajan a torsión, y con
              $GI_p = 0{,}8EI_z$ es la parte más flexible: el enunciado pide
              contarla.
          - valor: '0.4273'
            mensaje: |
              Has usado $GI_z$ en la torsión. En una sección circular la
              rigidez a torsión va con el momento polar, $I_p = 2I_z$:
              $GI_p = 0{,}8EI_z$.
          - valor: '0.4507'
            mensaje: |
              Es el axil con la barra rígida, sin su energía. La barra se
              alarga $NL/(EA)$, con $EA = EI_z/(2L^{2})$: es el término más
              flexible de todos.
          - valor: '1.1053'
            mensaje: |
              Has puesto la $q_0$ de CD vertical. Sus flechas, en el Word,
              son horizontales, paralelas a BC.
          - valor: '0.5895'
            mensaje: |
              Solo has contado la carga de DE. La de CD, horizontal, también
              flexiona AB y tuerce la estructura.
        pista: |
          $\partial C/\partial N = \sum\int\frac{M}{EI_z}\frac{\partial M}{\partial N} + \sum\int\frac{M_t}{GI_p}\frac{\partial M_t}{\partial N} + \frac{NL}{EA} = 0$,
          tramo a tramo, con $GI_p = 0{,}8EI_z$ y $EA = EI_z/(2L^{2})$.
        desarrollo: |
          Sumando los tramos, en $L^{3}/(EI_z)$:

          $$
          N\left(\frac{1}{3} + \frac{1}{3} + \frac{1}{0{,}8} + 2 + 2 + 2\right) = q_0L\left(\frac{1}{3} + \frac{1}{12} + \frac{1}{0{,}8} + 2 - 1\right)
          $$

          $$
          N = \frac{8/3}{95/12}\,q_0L = \frac{32}{95}\,q_0L = 0{,}3368\,q_0L\ \text{(tracción)}
          $$
      - tipo: calcular
        titulo: El desplazamiento vertical de D
        pregunta: |
          ¿Cuánto baja D, en unidades de $q_0L^{4}/(EI_z)$?
        respuesta:
          tipo: numero
          valor: '0.6737'
          tolerancia: 0.0005
          formato: un número (el desplazamiento dividido por q0·L⁴/(E·Iz)), positivo hacia abajo
        distractores:
          - valor: '0.3368'
            mensaje: |
              Has tomado $EA = EI_z/L^{2}$. Con $I_z/(AL^{2}) = 2$, $A = I_z/(2L^{2})$
              y $EA = EI_z/(2L^{2})$: el alargamiento es el doble. Es
              también la N del paso anterior: el desplazamiento no es el axil,
              es el alargamiento de la barra, $NL/(EA) = 2NL^{3}/(EI_z)$.
          - valor: '2.6667'
            mensaje: |
              Es lo que bajaría D sin la barra. La barra se lleva
              $0{,}3368\,q_0L$ y lo reduce a la cuarta parte.
          - valor: '0'
            mensaje: |
              Es lo que bajaría con la barra rígida. La barra se alarga
              $NL/(EA)$, y D, unido a ella, baja eso.
        pista: |
          F está fijo: D baja lo que se alarga la barra, $NL/(EA)$.
        desarrollo: |
          $$
          \delta_D = \frac{NL}{EA} = \frac{32}{95}\,q_0L\cdot\frac{2L^{3}}{EI_z} = \frac{64}{95}\,\frac{q_0L^{4}}{EI_z} = 0{,}6737\,\frac{q_0L^{4}}{EI_z}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Grado 1: el axil N de FD es la incógnita, con
              $\partial C/\partial N = 0$ y la energía de la barra dentro.
          - texto: >-
              Tramo a tramo, los flectores y torsores en función de $q_0$ y
              de N; solo cuentan los que dependen de N.
          - texto: >-
              Con $GI_p = 0{,}8EI_z$ y $EA = EI_z/(2L^{2})$:
              $N = 32q_0L/95$, a tracción.
          - texto: >-
              D baja lo que se alarga la barra: $\delta_D = NL/(EA) = 64q_0L^{4}/(95EI_z)$.
          - texto: >-
              Como la sección es circular, la torsión no da energía y basta
              con la flexión.
            trampa: true
            mensaje: |
              La sección circular es la que mejor resiste la torsión, pero
              la energía de torsión, $M_t^{2}/(2GI_p)$ por unidad de longitud,
              está ahí. Sin ella, $N = 0{,}2125\,q_0L$.
    resolucion: |
      **Los ejes y las rigideces.** x hacia la derecha (de C a B), y hacia
      arriba (de A a B) y z de C a D. A está en el origen, B en $(0, 2L, 0)$,
      C en $(-L, 2L, 0)$, D en $(-L, 2L, L)$ y E en $(0, 2L, L)$; F, a L sobre
      D. Sección circular: $I_p = 2I_z$, y con $E = 2{,}5G$,
      $GI_p = (E/2{,}5)\cdot2I_z = 0{,}8EI_z$. La barra: $EA = EI_z/(2L^{2})$.

      **El grado.** El empotramiento basta; la barra es un enlace de más:
      grado 1. Se corta la barra y su axil N (tracción, que tira de D hacia
      arriba) es la incógnita, una fuerza interna:
      $\partial C/\partial N = 0$ (ec. 13.54, apuntes del tema 13, p. 19), con
      la coenergía de flexión, la de torsión (ec. 13.43, p. 15) y la de la
      barra dentro.

      **Los esfuerzos que dependen de N.** Con $s$ medida desde el extremo
      libre de cada tramo (desde D en CD, desde C en BC, desde B en AB):

      | tramo | esfuerzo | valor | $\partial/\partial N$ |
      |---|---|---|---|
      | DE | flector | $q_0s^{2}/2$ | 0 |
      | CD | flector (plano vertical) | $(q_0L - N)\,s$ | $-s$ |
      | CD | flector (plano horizontal) | $q_0s^{2}/2$ | 0 |
      | CD | torsor | $q_0L^{2}/2$ | 0 |
      | BC | flector (plano vertical) | $Ns + q_0L(L/2 - s)$ | $s$ |
      | BC | flector (plano horizontal) | $q_0L^{2}/2$ | 0 |
      | BC | torsor | $(q_0L - N)\,L$ | $-L$ |
      | AB | flector (plano yz) | $(q_0L - N)\,L$ | $-L$ |
      | AB | flector (plano xy) | $q_0L^{2}/2 - NL - q_0Ls$ | $-L$ |
      | AB | torsor | $q_0L^{2}/2$ | 0 |
      | FD | axil | $N$ | 1 |

      **a) El axil.** Las integrales de los que dependen de N:

      $$
      \frac{\partial C}{\partial N} = -\frac{(q_0L - N)L^{3}}{3EI_z} + \frac{NL^{3}/3 - q_0L^{4}/12}{EI_z} - \frac{(q_0L - N)L^{3}}{GI_p} - \frac{2(q_0L - N)L^{3}}{EI_z} + \frac{q_0L^{4} + 2NL^{3}}{EI_z} + \frac{NL}{EA} = 0
      $$

      Con $GI_p = 0{,}8EI_z$ y $NL/(EA) = 2NL^{3}/(EI_z)$, multiplicando por
      $EI_z/L^{3}$:

      $$
      N\left(\frac{1}{3} + \frac{1}{3} + 1{,}25 + 2 + 2 + 2\right) = q_0L\left(\frac{1}{3} + \frac{1}{12} + 1{,}25 + 2 - 1\right)
      \quad\Longrightarrow\quad
      \frac{95}{12}\,N = \frac{8}{3}\,q_0L
      $$

      $$
      N = \frac{32}{95}\,q_0L = 0{,}3368\,q_0L\ \text{(tracción)}
      $$

      La barra aporta el término 2 del paréntesis, tanto como cada una de
      las dos flexiones de AB, y se lleva un tercio de la carga de DE.

      **b) El desplazamiento de D.** F está fijo, así que D baja lo que se
      alarga la barra:

      $$
      \delta_D = \frac{NL}{EA} = \frac{32}{95}\,q_0L\cdot\frac{2L^{3}}{EI_z} = \frac{64}{95}\,\frac{q_0L^{4}}{EI_z} = 0{,}6737\,\frac{q_0L^{4}}{EI_z}
      $$

      hacia abajo. Sin la barra, D bajaría $\tfrac{8}{3}\,q_0L^{4}/(EI_z)$, el
      término de $q_0$ de la ecuación de a: la barra lo reduce a la cuarta
      parte.

      **Comprobaciones.** El motor del curso (Menabrea para estructuras
      espaciales, con la barra anclada en F) da $N = 0{,}3368\,q_0L$, y el
      desplazamiento de D por Castigliano, con una fuerza ficticia en D,
      coincide con el alargamiento de la barra. Con CD hacia el otro lado
      del papel sale el mismo N. Por otro camino, la ecuación de a escrita a
      mano tramo a tramo: $N = 32q_0L/95$.
