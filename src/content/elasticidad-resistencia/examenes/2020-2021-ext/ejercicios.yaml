      **Notas nuestras.** Las galgas de la roseta están a 0°, 45° y 90° de
      un eje del plano tangente a la esfera, como en el detalle. El
      enunciado no da ni el radio ni la presión: los tensores se piden en
      función de $\varepsilon$, $E$ y $\nu$, y el cambio de espesor, de $e$.
      «de somete» se transcribe como sale.
    pide: >-
      Los tensores de deformaciones y de tensiones de la superficie
      exterior, en función de ε, E y ν, y el cambio de espesor, en función de
      e.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las tres galgas leen lo mismo, $\varepsilon$. ¿Qué dice eso del
          estado de deformación del punto?
        opciones:
          - texto: >-
              Que $\varepsilon_x = \varepsilon_y = \varepsilon$ y
              $\gamma_{xy} = 0$: todas las direcciones del plano tangente se
              alargan lo mismo
            correcta: true
            mensaje: |
              Eso es. La galga de 0° da $\varepsilon_x$, la de 90°
              $\varepsilon_y$, y la de 45° (ec. 3.55, p. 17)
              $\varepsilon_{45} = \tfrac{1}{2}(\varepsilon_x + \varepsilon_y + \gamma_{xy})$,
              de donde $\gamma_{xy} = 2\varepsilon_{45} - \varepsilon_x - \varepsilon_y = 0$.
              El círculo de Mohr del plano es un punto: es la esfera, que por
              simetría tiene la misma tensión en todas las direcciones
              tangentes (ec. 8.15, p. 10).
          - texto: >-
              Que la deformación según el espesor, $\varepsilon_z$, es nula
            mensaje: |
              Tensión plana quiere decir $\sigma_z = 0$, no $\varepsilon_z = 0$.
              Las galgas no miden nada en z: lo que dicen es que las del plano
              son iguales. El espesor cambia por el efecto Poisson, y eso es
              lo que pide el segundo apartado.
          - texto: >-
              Que la galga de 45° mide la distorsión $\gamma_{xy}$, que vale
              $\varepsilon$
            mensaje: |
              Una galga mide la deformación longitudinal de su dirección, sea
              cual sea. La distorsión sale de combinar las tres:
              $\gamma_{xy} = 2\varepsilon_{45} - \varepsilon_x - \varepsilon_y$,
              que con tres lecturas iguales es cero.
      - tipo: calcular
        titulo: La tensión en la pared, en un ejemplo
        pregunta: |
          Un ejemplo nuestro: acero con $E = 200$ GPa y $\nu = 0{,}3$, y
          $\varepsilon = 500\cdot10^{-6}$. ¿Cuánto vale la tensión
          $\sigma_x = \sigma_y$ de la superficie exterior, en MPa?
        respuesta:
          tipo: numero
          valor: '142.86'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '100'
            mensaje: |
              Es $E\varepsilon$, como en tracción simple. Aquí hay tensión en
              dos direcciones, y cada una contrae a la otra: Hooke en tensión
              plana (ec. 4.25, p. 9) da
              $\sigma_x = \dfrac{E}{1-\nu^{2}}(\varepsilon_x + \nu\varepsilon_y)$.
          - valor: '76.92'
            mensaje: |
              Has dividido por $1 + \nu$. Con $\varepsilon_x = \varepsilon_y$,
              $\dfrac{E(1+\nu)\varepsilon}{1-\nu^{2}} = \dfrac{E\varepsilon}{1-\nu}$:
              se divide por $1 - \nu$.
          - valor: '109.89'
            mensaje: |
              Te has dejado el $\nu\varepsilon_y$ del paréntesis:
              $\sigma_x = \dfrac{E}{1-\nu^{2}}(\varepsilon_x + \nu\varepsilon_y)$,
              y $\varepsilon_y$ también vale $\varepsilon$.
        pista: |
          Hooke en tensión plana (ec. 4.25):
          $\sigma_x = \dfrac{E}{1-\nu^{2}}(\varepsilon_x + \nu\varepsilon_y)$,
          con $\varepsilon_x = \varepsilon_y = \varepsilon$.
        desarrollo: |
          $$
          \sigma = \frac{E\,(1+\nu)\,\varepsilon}{1-\nu^{2}} = \frac{E\varepsilon}{1-\nu} = \frac{200\,000\ \text{MPa}\cdot500\cdot10^{-6}}{0{,}7} = 142{,}86\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La deformación según el espesor
        pregunta: |
          En el mismo ejemplo, ¿cuánto vale $\varepsilon_z$, en millonésimas?
        respuesta:
          tipo: numero
          valor: '-428.57'
          tolerancia: 0.1
          formato: un número con su signo, en millonésimas (10⁻⁶)
        distractores:
          - valor: '0'
            mensaje: |
              Tensión plana es $\sigma_z = 0$, no $\varepsilon_z = 0$. La pared
              se adelgaza por el efecto Poisson:
              $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E$ (ec. 4.24, p. 9).
          - valor: '-300'
            mensaje: |
              Has hecho $-\nu(\varepsilon_x + \varepsilon_y)$. El coeficiente de
              Poisson relaciona la deformación de z con las **tensiones**:
              $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E$, y de ahí
              $-2\nu\varepsilon/(1-\nu)$.
          - valor: '428.57'
            mensaje: |
              El valor es ese y el signo no. Con presión interior las dos
              tensiones de la pared son de tracción y estiran el plano; el
              espesor, en cambio, se contrae.
        pista: |
          $\varepsilon_z = -\dfrac{\nu}{E}(\sigma_x + \sigma_y)$ (ec. 4.24), con
          las tensiones del paso anterior.
        desarrollo: |
          $$
          \varepsilon_z = -\frac{\nu}{E}\,(\sigma_x + \sigma_y) = -\frac{2\nu\varepsilon}{1-\nu} = -\frac{2\cdot0{,}3\cdot500\cdot10^{-6}}{0{,}7} = -428{,}57\cdot10^{-6}
          $$
      - tipo: calcular
        titulo: El cambio de espesor
        pregunta: |
          Si la pared mide $e = 8$ mm, ¿cuánto cambia su espesor, en
          micras?
        respuesta:
          tipo: numero
          valor: '-3.429'
          tolerancia: 0.005
          formato: un número con su signo, en micras (µm)
        distractores:
          - valor: '-2.4'
            mensaje: |
              Es lo que sale con $\varepsilon_z = -\nu(\varepsilon_x + \varepsilon_y)$.
              El Poisson va con las tensiones:
              $\varepsilon_z = -2\nu\varepsilon/(1-\nu)$.
          - valor: '4'
            mensaje: |
              Has multiplicado el espesor por $\varepsilon$, la deformación del
              plano. El espesor está en z, y su deformación es la
              $\varepsilon_z$, negativa.
        pista: |
          La dirección z es la normal a la pared:
          $\Delta e = \varepsilon_z\,e$.
        desarrollo: |
          $\Delta e = \varepsilon_z\,e = -428{,}57\cdot10^{-6}\cdot8\ \text{mm} = -3{,}429\cdot10^{-3}\ \text{mm}$:
          la pared adelgaza 3,4 micras.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Las tres lecturas iguales dan $\varepsilon_x = \varepsilon_y = \varepsilon$
              y $\gamma_{xy} = 2\varepsilon_{45} - \varepsilon_x - \varepsilon_y = 0$.
          - texto: >-
              Hooke en tensión plana: $\sigma_x = \sigma_y = E\varepsilon/(1-\nu)$,
              $\tau_{xy} = 0$ y $\sigma_z = 0$.
          - texto: >-
              La tercera deformación no es nula:
              $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E = -2\nu\varepsilon/(1-\nu)$.
          - texto: >-
              z es la normal a la pared: el espesor cambia
              $\Delta e = \varepsilon_z\,e$, y disminuye.
          - texto: >-
              Como la superficie está en tensión plana, $\varepsilon_z = 0$ y
              el espesor no cambia.
            trampa: true
            mensaje: |
              Tensión plana es $\sigma_z = 0$. Por el efecto Poisson la pared
              adelgaza: en el ejemplo, $\varepsilon_z = -428{,}57\cdot10^{-6}$.
    resolucion: |
      **Las deformaciones.** Las galgas de la roseta están a 0°, 45° y 90° de
      un eje x del plano tangente. Con la ec. 3.55 (apuntes del tema 3,
      p. 17), $\varepsilon_u = \varepsilon_xu_x^{2} + \varepsilon_yu_y^{2} + \gamma_{xy}u_xu_y$:

      $$
      \varepsilon_0 = \varepsilon_x = \varepsilon,\qquad
      \varepsilon_{90} = \varepsilon_y = \varepsilon,\qquad
      \varepsilon_{45} = \tfrac{1}{2}\left(\varepsilon_x + \varepsilon_y + \gamma_{xy}\right) = \varepsilon
      \;\Longrightarrow\; \gamma_{xy} = 0
      $$

      Cualquier dirección del plano se alarga lo mismo: todas son
      principales. Es lo que corresponde a la esfera, cuyas dos tensiones
      tangentes son iguales, $\sigma = pr/(2e)$ (ec. 8.15 de los apuntes del
      tema 8, p. 10, que llaman $t$ al espesor).

      **Las tensiones.** En la superficie exterior la tensión radial es nula
      (p. 10): tensión plana, con z la normal a la pared. Hooke (ec. 4.25,
      p. 9) y $\tau_{xy} = G\gamma_{xy}$ (ec. 4.13):

      $$
      \sigma_x = \sigma_y = \frac{E}{1-\nu^{2}}\,(\varepsilon + \nu\varepsilon) = \frac{E\varepsilon}{1-\nu},\qquad
      \tau_{xy} = 0
      $$

      **La deformación del espesor** (ec. 4.24):

      $$
      \varepsilon_z = -\frac{\nu}{E}\,(\sigma_x + \sigma_y) = -\frac{2\nu}{1-\nu}\,\varepsilon
      $$

      **Los dos tensores**, en los ejes x, y del plano y z normal a la
      pared:

      $$
      [\varepsilon] = \begin{pmatrix} \varepsilon & 0 & 0 \\ 0 & \varepsilon & 0 \\ 0 & 0 & -\dfrac{2\nu\varepsilon}{1-\nu} \end{pmatrix},\qquad
      [\sigma] = \begin{pmatrix} \dfrac{E\varepsilon}{1-\nu} & 0 & 0 \\ 0 & \dfrac{E\varepsilon}{1-\nu} & 0 \\ 0 & 0 & 0 \end{pmatrix}
      $$

      **El cambio de espesor.** El espesor está en z:

      $$
      \Delta e = \varepsilon_z\,e = -\frac{2\nu\varepsilon}{1-\nu}\,e
      $$

      Con presión interior, $\varepsilon > 0$: la pared adelgaza.

      **Un ejemplo (nuestro).** Con $E = 200$ GPa, $\nu = 0{,}3$,
      $\varepsilon = 500\cdot10^{-6}$ y $e = 8$ mm:
      $\sigma = 142{,}86$ MPa, $\varepsilon_z = -428{,}57\cdot10^{-6}$ y
      $\Delta e = -3{,}429\cdot10^{-3}$ mm. El motor del curso (la roseta a
      45° y Hooke en tensión plana) da lo mismo, y la galga a cualquier otro
      ángulo, por ejemplo 30°, vuelve a leer $\varepsilon$.

  # ── Teoría · pregunta 2 · la barra entre dos apoyos, con P y 4P.
  - id: exerm2021-ext-2-la-barra-circular-entre-dos-apoyos
    titulo: La barra de sección circular entre dos apoyos, con P en el voladizo y 4P entre los apoyos
    fuente: >-
      Cuestión 2 de teoría · Extraordinaria del 2 de febrero de 2021 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. La barra y las dos flechas de la
      figura solo están en el Word original: el PDF imprime las cotas, los
      apoyos y los rótulos. El examen no publica resolución; el desarrollo es
      nuestro y sigue los apuntes del tema 8.
    nivel: examen
    enunciado: |
      2. (1p) En la barra de sección circular de la figura hallar el
      diámetro necesario para no superar una tensión admisible de valor
      $\sigma_{adm}$.

