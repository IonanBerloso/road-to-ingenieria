      **Notas nuestras.** Las cargas, de 20√2 MPa, actúan en los cuatro
      lados en las direcciones de las flechas. El subíndice de
      $\sigma_{cl}$ va así en las dos columnas de la hoja.
    pide: >-
      1. Las tensiones y direcciones principales de la chapa. 2. El estado
      hidrostático en el que fallaría según Mohr, con una resistencia a
      compresión de 85,35 MPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que la chapa está en una situación de fallo. ¿Qué
          dato da eso para el apartado 2?
        opciones:
          - texto: >-
              La resistencia a tracción: en el fallo, la tensión equivalente
              de Mohr del estado dibujado es justo $\sigma_{et}$
            correcta: true
            mensaje: |
              Eso es: $FS = 1$, así que $\sigma_{eqv} = \sigma_{et}$
              (ecs. 6.15 y 6.16, apuntes del tema 6, p. 8). Con la de
              compresión, que da el enunciado, quedan fijados los dos círculos
              y la recta intrínseca, y con ella el estado hidrostático.
          - texto: >-
              Que la tensión principal mayor es la resistencia a compresión
            mensaje: |
              La resistencia a compresión es un dato aparte, 85,35 MPa. El
              estado dibujado da la otra, la de tracción, a través de la
              tensión equivalente.
          - texto: >-
              Nada para el apartado 2: solo confirma que el factor de
              seguridad es 1
            mensaje: |
              Es lo mismo dicho al revés, y sí sirve: $FS = 1$ quiere decir
              $\sigma_{eqv} = \sigma_{et}$, y sin $\sigma_{et}$ no hay recta
              intrínseca ni estado hidrostático.
      - tipo: calcular
        titulo: La tensión normal según x
        pregunta: |
          Con x hacia la derecha e y hacia arriba, ¿cuánto vale $\sigma_x$,
          en MPa?
        respuesta:
          tipo: numero
          valor: '60'
          tolerancia: 0.02
          formato: un número, en MPa
        distractores:
          - valor: '28.28'
            mensaje: |
              Es la carga del lado inclinado, $20\sqrt2$, tomada como
              $\sigma_x$. Ese lado no es perpendicular a x: su normal es
              $(1, -1)/\sqrt2$, y en el vector tensión entran $\sigma_x$ y
              $\tau_{xy}$.
          - valor: '40'
            mensaje: |
              Te has dejado $\tau_{xy}$ en el lado inclinado. Con la normal
              $(1, -1)/\sqrt2$, la componente x del vector tensión es
              $(\sigma_x - \tau_{xy})/\sqrt2$.
          - valor: '20'
            mensaje: |
              Has tomado como normal $(1, 1)/\sqrt2$, que es la dirección del
              lado. La normal exterior del lado derecho apunta hacia abajo a
              la derecha: $(1, -1)/\sqrt2$.
        pista: |
          Cauchy, $\{S\} = [\sigma]\{n\}$, en el lado de arriba,
          $\{n\} = (0, 1)$, y en el inclinado de la derecha,
          $\{n\} = (1, -1)/\sqrt2$, con la carga que dibuja cada uno.
        desarrollo: |
          Arriba, la carga va a 45°: $\{S\} = (20, 20)$ MPa, que es
          $(\tau_{xy}, \sigma_y)$. A la derecha es horizontal:
          $\{S\} = (20\sqrt2, 0)$ MPa, y

          $$
          \frac{\sigma_x - \tau_{xy}}{\sqrt2} = 20\sqrt2
          \;\Longrightarrow\;
          \sigma_x = (40 + 20)\ \text{MPa} = 60\ \text{MPa}
          $$

          La componente y, $(\tau_{xy} - \sigma_y)/\sqrt2 = 0$, lo confirma.
      - tipo: calcular
        titulo: La tensión principal mayor
        pregunta: |
          ¿Cuánto vale la tensión principal mayor del plano, en MPa?
        respuesta:
          tipo: numero
          valor: '68.28'
          tolerancia: 0.02
          formato: un número, en MPa
        distractores:
          - valor: '60'
            mensaje: |
              Es $\sigma_x$. Con $\tau_{xy} \ne 0$ los ejes x e y no son
              principales: la principal es el centro del círculo de Mohr más
              su radio.
          - valor: '84.72'
            mensaje: |
              Has usado $\sigma_x - \sigma_y$ sin dividir por 2 en el radio:
              $R = \sqrt{\left(\tfrac{\sigma_x - \sigma_y}{2}\right)^{2} + \tau_{xy}^{2}}$.
          - valor: '52.36'
            mensaje: |
              Arrastras $\sigma_x = 40$, la de olvidar $\tau_{xy}$ en el lado
              inclinado. Con $\sigma_x = 60$, el centro es 40 MPa.
        pista: |
          Centro $\tfrac12(\sigma_x + \sigma_y)$, radio
          $\sqrt{\left(\tfrac{\sigma_x - \sigma_y}{2}\right)^{2} + \tau_{xy}^{2}}$.
        desarrollo: |
          $$
          \sigma_{1,2} = \left(40 \pm \sqrt{20^{2} + 20^{2}}\right)\ \text{MPa} = (40 \pm 28{,}28)\ \text{MPa}
          $$

          $\sigma_1 = 68{,}28$ y $\sigma_2 = 11{,}72$ MPa, y la tercera,
          perpendicular a la chapa, es nula.
      - tipo: calcular
        titulo: La dirección principal mayor
        pregunta: |
          ¿Qué ángulo forma con x la dirección de la principal mayor, en
          grados, entre −90 y 90 y antihorario desde x?
        respuesta:
          tipo: numero
          valor: '22.5'
          tolerancia: 0.05
          formato: un número con su signo, en grados
        distractores:
          - valor: '45'
            mensaje: |
              Ese es $2\theta_1$, el ángulo en el círculo de Mohr. En la
              chapa el ángulo es la mitad.
          - valor: '-22.5'
            mensaje: |
              El signo: $\tau_{xy} = +20$ y $\sigma_x - \sigma_y > 0$ dan
              $\tan 2\theta_1 > 0$ con $2\theta_1$ en el primer cuadrante:
              antihorario desde x.
          - valor: '-67.5'
            mensaje: |
              Es la dirección de $\sigma_2$, a 90° de la buena. La ec. 2.62
              da las dos; la del máximo es la que sale con los signos del
              numerador y del denominador.
        pista: |
          $\tan 2\theta_1 = \dfrac{2\tau_{xy}}{\sigma_x - \sigma_y}$ (ec. 2.62).
        desarrollo: |
          $\tan 2\theta_1 = 40/40 = 1$, con numerador y denominador positivos:
          $2\theta_1 = 45^{\circ}$ y $\theta_1 = 22{,}5^{\circ}$. La de
          $\sigma_2$ va a $-67{,}5^{\circ}$, y la tercera es z.
      - tipo: calcular
        titulo: El cociente de resistencias
        pregunta: |
          ¿Cuánto vale $k = \sigma_{et}/\sigma_{ec}$?
        respuesta:
          tipo: numero
          valor: '0.8'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '1.25'
            mensaje: |
              Es $\sigma_{ec}/\sigma_{et}$, al revés. En los apuntes
              $k = \sigma_{et}/\sigma_{ec}$ (ec. 6.12): menor que 1 en un
              material que resiste más a compresión.
          - valor: '0.663'
            mensaje: |
              Has tomado $\sigma_{et} = \sigma_1 - \sigma_2$, con el círculo
              del plano de la chapa. Las principales son tres: la menor es la
              nula, la perpendicular a la chapa, y el círculo mayor va de 0 a
              $\sigma_1$.
          - valor: '0.7035'
            mensaje: |
              Has tomado como $\sigma_3$ la menor del plano, 11,72 MPa, en
              $\sigma_1 - k\sigma_3 = \sigma_{et}$. La menor de las tres es la
              nula, la perpendicular a la chapa: con ella
              $\sigma_{eqv} = \sigma_1$ y $\sigma_{et} = 68{,}28$ MPa.
        pista: |
          En el fallo, $\sigma_{eqv} = \sigma_1 - k\sigma_3 = \sigma_{et}$
          (ec. 6.15), con las tres principales ordenadas.
        desarrollo: |
          Las principales ordenadas son $68{,}28$, $11{,}72$ y $0$ MPa: con
          $\sigma_3 = 0$, $\sigma_{eqv} = \sigma_1$, así que
          $\sigma_{et} = 68{,}28$ MPa y

          $$
          k = \frac{68{,}28\ \text{MPa}}{85{,}35\ \text{MPa}} = 0{,}8
          $$
      - tipo: calcular
        titulo: El estado hidrostático de fallo
        pregunta: |
          ¿Con qué tensión hidrostática $\sigma$ (la misma en las tres
          direcciones) se produciría el fallo según Mohr, en MPa?
        respuesta:
          tipo: numero
          valor: '341.5'
          tolerancia: 0.15
          formato: un número con su signo, en MPa
        distractores:
          - valor: '-341.5'
            mensaje: |
              Una compresión hidrostática no rompe nunca según Mohr: su
              círculo es un punto, y en compresión la recta intrínseca se
              aleja del eje. El único estado hidrostático que la toca es el
              vértice de la recta, en tracción.
          - valor: '-273.2'
            mensaje: |
              Has usado $k = 1{,}25$, al revés. Con $k > 1$ el denominador
              $1 - k$ se hace negativo y sale una compresión, que no puede
              fallar.
          - valor: '202.5'
            mensaje: |
              Has trazado la recta tangente al círculo de $\sigma_1$ y
              $\sigma_2$, el del plano de la chapa. El círculo que toca la
              recta es el mayor, el de $\sigma_1$ y el cero.
        pista: |
          En un estado hidrostático $\sigma_1 = \sigma_3 = \sigma$, y
          $\sigma_{eqv} = \sigma(1 - k)$.
        desarrollo: |
          $$
          \sigma(1 - k) = \sigma_{et}
          \;\Longrightarrow\;
          \sigma = \frac{68{,}28\ \text{MPa}}{1 - 0{,}8} = 341{,}5\ \text{MPa}
          $$

          Es una tracción hidrostática: el punto donde la recta intrínseca
          corta el eje $\sigma$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Cauchy en el lado de arriba y en el de la derecha:
              $\sigma_x = 60$, $\sigma_y = 20$ y $\tau_{xy} = 20$ MPa.
          - texto: >-
              Principales: 68,28 MPa a 22,5° de x, 11,72 MPa a
              $-67{,}5$° y 0 en z.
          - texto: >-
              En el fallo, con $\sigma_3 = 0$:
              $\sigma_{et} = \sigma_1 = 68{,}28$ MPa y $k = 0{,}8$.
          - texto: >-
              Hidrostático: $\sigma(1 - k) = \sigma_{et}$, y
              $\sigma = 341{,}5$ MPa de tracción.
          - texto: >-
              La resistencia a compresión es mayor, así que el estado
              hidrostático de fallo es una compresión de 85,35 MPa.
            trampa: true
            mensaje: |
              Según Mohr, una compresión hidrostática no falla nunca: su
              círculo es un punto que la recta intrínseca no alcanza. El
              estado hidrostático de fallo es el vértice de la recta, en
              tracción.
    resolucion: |
      **El tensor.** Con x hacia la derecha, y hacia arriba y la fórmula de
      Cauchy $\{S\} = [\sigma]\{n\}$ (ec. 2.14, apuntes del tema 2, p. 11):

      - Lado de arriba, $\{n\} = (0, 1)$: la carga va a 45°,
        $\{S\} = (20, 20)$ MPa $= (\tau_{xy}, \sigma_y)$.
      - Lado inclinado de la derecha, $\{n\} = (1, -1)/\sqrt2$: la carga es
        horizontal, $\{S\} = (20\sqrt2, 0)$ MPa. La componente x da
        $(\sigma_x - \tau_{xy})/\sqrt2 = 20\sqrt2$, y $\sigma_x = 60$ MPa; la
        y, $(\tau_{xy} - \sigma_y)/\sqrt2 = 0$, cuadra.

      Los lados de abajo y de la izquierda llevan las cargas opuestas: el
      estado es uniforme. Es tensión plana:

      $$
      [\sigma] = \begin{bmatrix} 60 & 20 & 0\\ 20 & 20 & 0\\ 0 & 0 & 0 \end{bmatrix}\ \text{MPa}
      $$

      **1. Las principales.** Centro 40 MPa, radio
      $\sqrt{20^{2} + 20^{2}} = 28{,}28$ MPa:
      $\sigma_1 = 40 + 20\sqrt2 = 68{,}28$ MPa y
      $\sigma_2 = 40 - 20\sqrt2 = 11{,}72$ MPa. Con
      $\tan 2\theta_1 = 2\tau_{xy}/(\sigma_x - \sigma_y) = 1$ (ec. 2.62, p. 23),
      la de 68,28 MPa forma **22,5°** con x y la de 11,72 MPa, $-67{,}5$°.
      La tercera principal es z, con 0.

      **2. El estado hidrostático.** El criterio de Mohr (ecs. 6.10 a 6.16,
      pp. 7-8) usa las principales ordenadas, $68{,}28 \ge 11{,}72 \ge 0$:
      $\sigma_{eqv} = \sigma_1 - k\sigma_3 = \sigma_1$. La chapa está en
      fallo, así que $\sigma_{eqv} = \sigma_{et}$:

      $$
      \sigma_{et} = 68{,}28\ \text{MPa},\qquad
      k = \frac{\sigma_{et}}{\sigma_{ec}} = \frac{68{,}28}{85{,}35} = 0{,}8,\qquad
      \sin\varphi = \frac{1 - k}{1 + k} = 0{,}111
      $$

      En un estado hidrostático las tres principales son iguales, el
      círculo es un punto y $\sigma_{eqv} = \sigma(1 - k)$:

      $$
      \sigma = \frac{\sigma_{et}}{1 - k} = \frac{\sigma_{et}\,\sigma_{ec}}{\sigma_{ec} - \sigma_{et}} = 341{,}5\ \text{MPa}
      $$

      El fallo se produciría con una **tracción hidrostática de unos 341,5
      MPa**: el vértice de la recta intrínseca, sobre el eje $\sigma$. Una
      compresión hidrostática, por grande que sea, no falla según Mohr. El
      dato de la hoja, 85,35, es $50 + 25\sqrt2 = 85{,}355$ redondeado: con
      él exacto, $k = 0{,}8$ justo y $\sigma = 5\sigma_{et} = 341{,}42$ MPa.

      Cada cifra sale del motor del curso (el vector tensión de cada lado,
      Mohr en el plano, el criterio de Mohr) y de un segundo camino: la
      fórmula cerrada del círculo, la intersección de la recta intrínseca
      con el eje, trazada por los círculos de tracción y de compresión
      simples, y el factor de seguridad del estado, que da 1.


  # ── Teoría · pregunta 2 · las direcciones principales son ortogonales y las tensiones, reales.
  - id: exerm2526-1par-2-direcciones-ortogonales-y-tensiones-reales
    titulo: Las direcciones principales son ortogonales y las tensiones principales, reales
    fuente: >-
      Pregunta 2 de teoría · Primer parcial del 31 de octubre de 2025 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Transcrita de una foto de la hoja
      impresa. La cuestión 1 de los primeros parciales de 2014-2015 y de
      2019-2020 pide solo la primera mitad, la de las direcciones. El examen
      no publica resolución; el desarrollo es nuestro y sigue los apuntes del
      tema 2 (pp. 17-19). Los pasos de cálculo usan un ejemplo nuestro.
    nivel: examen
    enunciado: |
      (1p) Demuestra que las direcciones y tensiones principales son
      ortogonales y reales respectivamente.
    pide: >-
      Dos demostraciones: que las direcciones principales son ortogonales y
      que las tensiones principales son reales.
    pasos:
      - tipo: reconocer
        pregunta: |
          La ecuación característica es cúbica. ¿Por qué basta estudiar una
          ecuación de segundo grado para ver que sus tres raíces son reales?
        opciones:
          - texto: >-
              Porque una cúbica con coeficientes reales tiene al menos una
              raíz real; se toma x en su dirección y las otras dos salen de un
              determinante de 2 × 2
            correcta: true
            mensaje: |
              Eso es (ecs. 2.38 y 2.39, apuntes del tema 2, pp. 17-18). Con x
              principal, el tensor no acopla x con y ni con z, y las otras
              dos raíces son las de una cuadrática con discriminante
              $(\sigma_y - \sigma_z)^{2} + 4\tau_{yz}^{2}$.
          - texto: >-
              Porque una de las tensiones principales es siempre nula
            mensaje: |
              No lo es en general: solo cuando el determinante del tensor es
              cero. El paso a 2 × 2 sale de que alguna raíz es real, no de
              que sea nula.
          - texto: >-
              Porque se supone tensión plana, y en el plano solo hay dos
              principales
            mensaje: |
              La demostración vale para un estado cualquiera. No hace falta
              suponer nada del estado: se elige x en la dirección de la raíz
              real que toda cúbica tiene.
      - tipo: calcular
        titulo: El discriminante, en un ejemplo
        pregunta: |
          Un ejemplo nuestro, con x ya principal: $\sigma_x = 1$,
          $\sigma_y = 4$, $\sigma_z = -2$ y $\tau_{yz} = 4$ MPa (las demás
          tangenciales, nulas). ¿Cuánto vale el discriminante de la
          cuadrática de las otras dos principales, en MPa²?
        respuesta:
          tipo: numero
          valor: '100'
          tolerancia: 0.05
          formato: un número, en MPa²
        distractores:
          - valor: '-28'
            mensaje: |
              El signo de $\tau_{yz}^{2}$: el determinante es
              $(\sigma_y - \sigma)(\sigma_z - \sigma) - \tau_{yz}^{2}$, y el
              término independiente de la cuadrática es
              $\sigma_y\sigma_z - \tau_{yz}^{2}$. Un discriminante negativo
              daría raíces complejas: justo lo que la demostración descarta.
          - valor: '36'
            mensaje: |
              Te has dejado la tangencial: es $(\sigma_y - \sigma_z)^{2}$, el
              discriminante si y y z fuesen ya principales. Falta
              $+4\tau_{yz}^{2}$ (ec. 2.43).
        pista: |
          $\Delta = (\sigma_y + \sigma_z)^{2} - 4(\sigma_y\sigma_z - \tau_{yz}^{2})$
          (ec. 2.42).
        desarrollo: |
          $$
          \Delta = (4 - 2)^{2} - 4(-8 - 16) = 100 = (4 + 2)^{2} + (2\cdot4)^{2}
          $$

          que es la suma de dos cuadrados de la ec. 2.43: no puede ser
          negativa.
      - tipo: calcular
        titulo: La principal mayor del ejemplo
        pregunta: |
          ¿Cuánto vale la mayor de las tres principales, en MPa?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.01
          formato: un número, en MPa
        distractores:
          - valor: '11'
            mensaje: |
              Falta el ½ delante de la raíz:
              $\sigma = \tfrac12\left[(\sigma_y + \sigma_z) \pm \sqrt{\Delta}\right]$
              (ec. 2.41).
          - valor: '4'
            mensaje: |
              Es $\sigma_y$. Con $\tau_{yz} \ne 0$, y no es principal: la
              tangencial separa las dos raíces más que $\sigma_y$ y
              $\sigma_z$.
        pista: |
          $\sigma = \tfrac12\left[(\sigma_y + \sigma_z) \pm \sqrt{\Delta}\right]$,
          y compara con $\sigma_x$.
        desarrollo: |
          $\sigma = \tfrac12(2 \pm 10)$: 6 y $-4$ MPa. Con $\sigma_x = 1$,
          las tres ordenadas son 6, 1 y $-4$ MPa.
      - tipo: calcular
        titulo: La dirección de la principal mayor del ejemplo
        pregunta: |
          La dirección de la principal mayor está en el plano yz. ¿Qué ángulo
          forma con y, en grados, entre −90 y 90, positivo de y hacia z?
        respuesta:
          tipo: numero
          valor: '26.57'
          tolerancia: 0.05
          formato: un número con su signo, en grados
        distractores:
          - valor: '53.13'
            mensaje: |
              Ese es $2\theta$. La tangente de la ec. 2.62 es la del ángulo
              doble: $\tan 2\theta = 2\tau_{yz}/(\sigma_y - \sigma_z) = 4/3$.
          - valor: '-63.43'
            mensaje: |
              Es la dirección de la principal menor, $-4$ MPa, a 90° de la
              buena. Compruébalo: las dos son perpendiculares, como dice la
              demostración.
          - valor: '18.43'
            mensaje: |
              Has puesto la tangente al revés,
              $(\sigma_y - \sigma_z)/(2\tau_{yz})$.
        pista: |
          $([\sigma] - 6[I])\{n\} = 0$; la fila de y da
          $(4 - 6)\,n_y + 4\,n_z = 0$.
        desarrollo: |
          $n_z = n_y/2$: $\{n_1\} = (0, 2, 1)/\sqrt5$, a
          $\arctan\tfrac12 = 26{,}57^{\circ}$ de y. La de $-4$ MPa es
          $(0, 1, -2)/\sqrt5$, y su producto escalar con la anterior es
          $(2 - 2)/5 = 0$: perpendiculares.
      - tipo: redactar
        que: demostracion
        consigna: >-
          Escribe las dos demostraciones como en el examen: que las
          direcciones principales son ortogonales y que las tensiones
          principales son reales.
        rubrica:
          - punto: >-
              Se parte de la definición: una dirección es principal si el
              vector tensión es paralelo a la normal, [σ]{n} = σ{n}, y las
              tensiones principales son las raíces de det([σ] − σ[I]) = 0.
            porque: >-
              Es lo que se va a demostrar de esas raíces y de esos vectores.
            minimo: true
          - punto: >-
              Ortogonales: se escriben σ1{n1} = [σ]{n1} y σ2{n2} = [σ]{n2}
              (ecs. 2.44 y 2.45), se multiplica la primera por {n2}ᵗ y la
              segunda por {n1}ᵗ y se restan.
            porque: >-
              Es el truco de la demostración: los dos productos con [σ] son
              iguales porque el tensor es simétrico.
            minimo: true
          - punto: >-
              Se llega a (σ1 − σ2){n1}ᵗ{n2} = 0 (ec. 2.46) y se discute: si
              σ1 ≠ σ2, n1 y n2 son perpendiculares; si son iguales, cualquier
              dirección del plano perpendicular a n3 es principal.
            porque: >-
              Sin la discusión del caso de raíces iguales la demostración está
              incompleta.
            minimo: true
          - punto: >-
              Reales: una cúbica real tiene al menos una raíz real; se toma x
              en su dirección, y las otras dos salen del determinante de 2 × 2
              de y y z (ecs. 2.38 y 2.39).
            porque: >-
              Es lo que reduce el problema a una cuadrática.
            minimo: true
          - punto: >-
              Se escribe el discriminante y se ve que es una suma de
              cuadrados, (σy − σz)² + (2τyz)² ≥ 0 (ecs. 2.42 y 2.43): las dos
              raíces son reales.
            porque: >-
              Es la conclusión, y es la línea que pide el corrector.
            minimo: true
          - punto: >-
              Se dice dónde se usa la simetría del tensor (τij = τji): en el
              paso de la resta y en que el determinante de 2 × 2 tenga τyz dos
              veces.
            porque: >-
              Las dos propiedades son consecuencia de la simetría; con una
              matriz cualquiera fallarían.
      - tipo: justificar
        pregunta: Ordena las dos demostraciones. Una pieza es falsa.
        piezas:
          - texto: >-
              $\sigma_1\{n_1\} = [\sigma]\{n_1\}$ y
              $\sigma_2\{n_2\} = [\sigma]\{n_2\}$.
          - texto: >-
              Multiplicando por $\{n_2\}^{t}$ y $\{n_1\}^{t}$ y restando, con
              $[\sigma]$ simétrica:
              $(\sigma_1 - \sigma_2)\{n_1\}^{t}\{n_2\} = 0$.
          - texto: >-
              Si $\sigma_1 \ne \sigma_2$, las dos direcciones son
              perpendiculares.
          - texto: >-
              Toda cúbica real tiene una raíz real: con x en su dirección,
              las otras dos salen de una cuadrática.
          - texto: >-
              Su discriminante es
              $(\sigma_y - \sigma_z)^{2} + 4\tau_{yz}^{2} \ge 0$: las raíces
              son reales.
          - texto: >-
              Las tensiones principales son reales porque son los módulos de
              vectores tensión, y un módulo es siempre real.
            trampa: true
            mensaje: |
              Una tensión principal no es un módulo: puede ser negativa (una
              compresión). Es una raíz de la ecuación característica, y que
              sea real es justo lo que hay que demostrar.
    resolucion: |
      **Las direcciones principales son ortogonales.** Sean $\sigma_1$ y
      $\sigma_2$ dos tensiones principales con sus direcciones (ecs. 2.44 y
      2.45, apuntes del tema 2, p. 18):

      $$
      \sigma_1\{n_1\} = [\sigma]\{n_1\},\qquad \sigma_2\{n_2\} = [\sigma]\{n_2\}
      $$

      Se multiplica la primera por $\{n_2\}^{t}$ y la segunda por
      $\{n_1\}^{t}$. Como $[\sigma]$ es simétrica y un escalar es su propio
      traspuesto, $\{n_2\}^{t}[\sigma]\{n_1\} = \{n_1\}^{t}[\sigma]\{n_2\}$,
      y al restar (ec. 2.46, p. 19):

      $$
      (\sigma_1 - \sigma_2)\,\{n_1\}^{t}\{n_2\} = 0
      $$

      Si $\sigma_1 \ne \sigma_2$, $\{n_1\}^{t}\{n_2\} = 0$: las direcciones
      son perpendiculares. Si $\sigma_1 = \sigma_2$, la igualdad se cumple
      sola y cualquier dirección perpendicular a la tercera es principal; si
      las tres son iguales, todas lo son. Con las tres distintas, las tres
      direcciones forman un triedro, el de los ejes principales (ec. 2.47).

      **Las tensiones principales son reales.** La ecuación característica
      es cúbica y de coeficientes reales: tiene al menos una raíz real. Se
      toma x en su dirección; entonces $\tau_{xy} = \tau_{xz} = 0$ y el
      determinante se parte (ecs. 2.38 y 2.39, pp. 17-18):

      $$
      \begin{vmatrix} \sigma_y - \sigma & \tau_{yz}\\ \tau_{yz} & \sigma_z - \sigma \end{vmatrix} = 0
      \;\Longrightarrow\;
      \sigma^{2} - (\sigma_y + \sigma_z)\sigma + \sigma_y\sigma_z - \tau_{yz}^{2} = 0
      $$

      Su discriminante (ecs. 2.42 y 2.43) es

      $$
      (\sigma_y + \sigma_z)^{2} - 4(\sigma_y\sigma_z - \tau_{yz}^{2}) = (\sigma_y - \sigma_z)^{2} + (2\tau_{yz})^{2} \ge 0
      $$

      una suma de cuadrados: las otras dos raíces también son reales. Las
      dos demostraciones usan la simetría del tensor.

      **Un ejemplo (nuestro).** Con $\sigma_x = 1$, $\sigma_y = 4$,
      $\sigma_z = -2$ y $\tau_{yz} = 4$ MPa, el discriminante es
      $36 + 64 = 100$, las principales son 6, 1 y $-4$ MPa, y las
      direcciones de 6 y $-4$ MPa, $(0, 2, 1)/\sqrt5$ y $(0, 1, -2)/\sqrt5$,
      son perpendiculares. El motor del curso da las mismas principales y
      direcciones resolviendo el tensor entero.


  # ── Teoría · pregunta 3 · la tensión equivalente de Von Mises.
  - id: exerm2526-1par-3-la-tension-equivalente-de-von-mises
    titulo: La tensión equivalente según Von Mises, obtenida de forma razonada
    fuente: >-
      Pregunta 3 de teoría · Primer parcial del 31 de octubre de 2025 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Transcrita de una foto de la hoja
      impresa. La cuestión 3 del primer parcial de 2019-2020 pide la misma
      deducción, con un dato más en el enunciado. El examen no publica
      resolución; el desarrollo es nuestro y sigue los apuntes del tema 6
      (pp. 10-12). El paso de cálculo usa un ejemplo nuestro.
    nivel: examen
    enunciado: |
      (1p) Obtener la tensión equivalente según Von Mises.
    pide: >-
      La expresión de la tensión equivalente de Von Mises, obtenida de forma
      razonada.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué magnitud iguala el criterio de Von Mises entre el estado real
          y el estado equivalente?
        opciones:
          - texto: >-
              La energía de distorsión por unidad de volumen: la parte de la
              energía de deformación que no cambia el volumen
            correcta: true
            mensaje: |
              Eso es (apartado 6.6, apuntes del tema 6, p. 10). Se quita a la
              energía total la que va al cambio de volumen, que la da la
              componente esférica del tensor, y lo que queda se iguala con el
              de una tracción simple $\sigma_{eqv}$.
          - texto: >-
              La energía de deformación total por unidad de volumen
            mensaje: |
              Con la total, una presión hidrostática muy alta acabaría
              rompiendo cualquier material dúctil, y los ensayos dicen que no:
              lo que plastifica es el cambio de forma, no el de volumen.
          - texto: >-
              La tensión tangencial máxima
            mensaje: |
              Ese es el criterio de Tresca (apartado 6.5). Von Mises usa una
              energía, y por eso en él entran las tres principales.
      - tipo: calcular
        titulo: La tensión equivalente, en un ejemplo
        pregunta: |
          Un ejemplo nuestro, en tensión plana: $\sigma_x = 50$,
          $\sigma_y = -30$ y $\tau_{xy} = 20$ MPa. ¿Cuánto vale la tensión
          equivalente de Von Mises, en MPa?
        respuesta:
          tipo: numero
          valor: '78.10'
          tolerancia: 0.02
          formato: un número, en MPa
        distractores:
          - valor: '89.44'
            mensaje: |
              Es la de Tresca, $\sigma_1 - \sigma_3$, con las principales
              $54{,}72$, 0 y $-34{,}72$ MPa. Von Mises da algo menos.
          - valor: '70'
            mensaje: |
              Te has dejado la tangencial: en tensión plana
              $\sigma_{eqv} = \sqrt{\sigma_x^{2} - \sigma_x\sigma_y + \sigma_y^{2} + 3\tau_{xy}^{2}}$
              (ec. 6.30).
          - valor: '55.68'
            mensaje: |
              El signo del producto: es $-\sigma_x\sigma_y$. Con
              $\sigma_y < 0$, ese término suma.
          - valor: '72.80'
            mensaje: |
              La tangencial va con un 3 delante, $3\tau_{xy}^{2}$: sale del 6
              de la ec. 6.28 al sacar el ½ de la raíz.
        pista: |
          $\sigma_{eqv} = \sqrt{\sigma_x^{2} - \sigma_x\sigma_y + \sigma_y^{2} + 3\tau_{xy}^{2}}$
          (ec. 6.30).
        desarrollo: |
          $$
          \sigma_{eqv} = \sqrt{2500 + 1500 + 900 + 1200}\ \text{MPa} = \sqrt{6100}\ \text{MPa} = 78{,}10\ \text{MPa}
          $$

          Con las principales, $54{,}72$ y $-34{,}72$ MPa, la ec. 6.31 da lo
          mismo.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Obtén la tensión equivalente de Von Mises como en el examen, desde
          la energía de deformación.
        rubrica:
          - punto: >-
              Se enuncia el criterio: el fallo llega cuando la energía de
              distorsión por unidad de volumen alcanza la de la tracción
              simple que falla; la energía se parte en
              U0 = U0v + U0d (ecs. 6.20 y 6.21).
            porque: >-
              Es el criterio que se aplica, y el porqué de quitar la parte de
              volumen.
            minimo: true
          - punto: >-
              Se escribe la energía total en tensiones,
              2U0 = (σx² + σy² + σz²)/E − 2ν(σxσy + σyσz + σzσx)/E +
              (τxy² + τyz² + τzx²)/G (ec. 6.23).
            porque: >-
              Es el punto de partida, la 6.22 con la ley de Hooke.
            minimo: true
          - punto: >-
              Se calcula la parte de volumen con la componente esférica,
              σe = (σx + σy + σz)/3 (ec. 6.24):
              2U0v = (1 − 2ν)(σx + σy + σz)²/(3E) (ec. 6.25).
            porque: >-
              Es la energía que va al cambio de volumen y que el criterio no
              cuenta.
            minimo: true
          - punto: >-
              Se resta y se llega a la energía de distorsión,
              2U0d = (1 + ν)[(σx − σy)² + (σy − σz)² + (σz − σx)²]/(3E) +
              (τxy² + τyz² + τzx²)/G (ec. 6.26).
            porque: >-
              Es el paso algebraico central.
            minimo: true
          - punto: >-
              Se aplica al estado equivalente, una tracción σeqv sola:
              2U0d = 2(1 + ν)σeqv²/(3E) (ec. 6.27), y se igualan, con
              G = E/2(1 + ν).
            porque: >-
              Es lo que define la tensión equivalente.
            minimo: true
          - punto: >-
              Se escribe el resultado, σeqv = √{½[(σx − σy)² + (σy − σz)² +
              (σz − σx)² + 6(τxy² + τyz² + τzx²)]} (ec. 6.28), y sus formas
              en principales (ec. 6.29) y en tensión plana (ecs. 6.30 y 6.31).
            porque: >-
              Es la respuesta, y las formas particulares son las que se usan
              en los problemas.
            minimo: true
          - punto: >-
              Se comenta que un estado hidrostático da σeqv = 0: según Von
              Mises no falla.
            porque: >-
              Es la consecuencia física de quitar la energía de volumen, y la
              que lo separa del criterio de la energía total.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              $U_0 = U_{0v} + U_{0d}$: la energía de deformación se parte en
              volumen y distorsión.
          - texto: >-
              La parte de volumen sale de la componente esférica,
              $\sigma_e = \tfrac13(\sigma_x + \sigma_y + \sigma_z)$.
          - texto: >-
              Restando, $2U_{0d}$ queda con las diferencias de normales al
              cuadrado y las tangenciales.
          - texto: >-
              Igualando con la de una tracción simple, $2U_{0d} = 2(1 + \nu)\sigma_{eqv}^{2}/(3E)$,
              sale $\sigma_{eqv}$.
          - texto: >-
              Se iguala la energía de deformación **total** del estado con la
              de la tracción simple.
            trampa: true
            mensaje: |
              Esa sería el criterio de la energía total, que haría fallar un
              estado hidrostático. Von Mises iguala solo la energía de
              distorsión.
    resolucion: |
      **El criterio.** Según Von Mises, el fallo llega cuando la energía de
      distorsión por unidad de volumen alcanza un valor crítico, el de la
      tracción simple que falla (apuntes del tema 6, apartado 6.6, p. 10).
      La energía de deformación se parte en la que cambia el volumen y la que
      cambia la forma (ecs. 6.20 y 6.21):

      $$
      U_0 = U_{0v} + U_{0d},\qquad U_{0d} = U_0 - U_{0v}
      $$

      **La energía total.** Con $2U_0 = \sigma_x\varepsilon_x + \dots + \tau_{yz}\gamma_{yz}$
      (ec. 6.22) y la ley de Hooke (ec. 6.23):

      $$
      2U_0 = \frac{1}{E}\left[\sigma_x^{2} + \sigma_y^{2} + \sigma_z^{2} - 2\nu(\sigma_x\sigma_y + \sigma_y\sigma_z + \sigma_z\sigma_x)\right] + \frac{1}{G}\left(\tau_{xy}^{2} + \tau_{yz}^{2} + \tau_{zx}^{2}\right)
      $$

      **La parte de volumen.** Es la de la componente esférica del tensor,
      $\sigma_e = \tfrac13(\sigma_x + \sigma_y + \sigma_z)$ en la diagonal
      (ec. 6.24, p. 10). Llevada a la 6.23 (ec. 6.25, p. 11):

      $$
      2U_{0v} = \frac{1 - 2\nu}{3E}\,(\sigma_x + \sigma_y + \sigma_z)^{2}
      $$

      **La distorsión.** Restando (ec. 6.26):

      $$
      2U_{0d} = \frac{1 + \nu}{3E}\left[(\sigma_x - \sigma_y)^{2} + (\sigma_y - \sigma_z)^{2} + (\sigma_z - \sigma_x)^{2}\right] + \frac{1}{G}\left(\tau_{xy}^{2} + \tau_{yz}^{2} + \tau_{zx}^{2}\right)
      $$

      **El estado equivalente.** Una tracción $\sigma_{eqv}$ sola da
      (ec. 6.27) $2U_{0d} = \dfrac{2(1 + \nu)}{3E}\,\sigma_{eqv}^{2}$.
      Igualando, con $\dfrac{1}{G} = \dfrac{2(1 + \nu)}{E}$ (ec. 6.28):

      $$
      \sigma_{eqv} = \sqrt{\tfrac12\left[(\sigma_x - \sigma_y)^{2} + (\sigma_y - \sigma_z)^{2} + (\sigma_z - \sigma_x)^{2} + 6\left(\tau_{xy}^{2} + \tau_{yz}^{2} + \tau_{zx}^{2}\right)\right]}
      $$

      En principales (ec. 6.29) y en tensión plana (ecs. 6.30 y 6.31, pp.
      11-12):

      $$
      \sigma_{eqv} = \sqrt{\tfrac12\left[(\sigma_1 - \sigma_2)^{2} + (\sigma_2 - \sigma_3)^{2} + (\sigma_3 - \sigma_1)^{2}\right]},\qquad
      \sigma_{eqv} = \sqrt{\sigma_x^{2} - \sigma_x\sigma_y + \sigma_y^{2} + 3\tau_{xy}^{2}}
      $$

      Un estado hidrostático da $\sigma_{eqv} = 0$: según Von Mises, no
      falla. La condición de no fallo es $\sigma_{eqv} < \sigma_e$, y el
      factor de seguridad, $\sigma_e/\sigma_{eqv}$ (ec. 6.1).

      **Un ejemplo (nuestro).** Con $\sigma_x = 50$, $\sigma_y = -30$ y
      $\tau_{xy} = 20$ MPa, $\sigma_{eqv} = \sqrt{6100} = 78{,}10$ MPa. El
      motor del curso da lo mismo con el tensor y con las principales, y la
      energía de distorsión de ese estado, calculada con la ec. 6.26, es la
      de una tracción de 78,10 MPa.

