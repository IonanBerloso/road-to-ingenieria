      <figcaption>

      Redibujada de la foto de la hoja, con los ejes en la misma
      perspectiva. Las marcas hechas a mano en la foto no son del enunciado
      y no van.

      </figcaption>
      </figure>

      Datos: $E = 2\cdot10^{5}$ MPa; $\nu = 0.25$; $C_1$, $C_2$, $C_3$ y
      $C_4$ son constantes; X, Y y Z (m); u…

      **Notas nuestras.** La foto corta la línea de datos justo después de
      «u», y también el borde derecho de la hoja, que se lleva el final de
      cada línea de la columna en euskera. Lo que se lee de ella dice lo
      mismo. La hoja escribe «angulo», «cual», «intrinsecas» y «Tesión», y
      aquí se dejan así. El enunciado nombra las dimensiones a, b y c, pero
      la figura no las rotula: da las tres cotas en metros.
    pide: >-
      a) Las cuatro constantes a partir de E′ y C′; b) el tensor de
      deformaciones con las constantes que da el enunciado; c) las
      deformaciones principales y sus direcciones; d) el cambio de volumen;
      e) el cambio del área de AEFO; f) el tensor en unos ejes girados 60°;
      g) las componentes intrínsecas de la tensión en el plano ACFD; h) la
      tensión tangencial máxima.
    pasos:
      - tipo: reconocer
        pregunta: |
          C está en $(0;\ 1{,}5;\ 0)$ y pasa a $C'$. ¿Qué constantes da ese
          punto?
        opciones:
          - texto: >-
              Solo $C_3$: en C, $X = Z = 0$, así que $u$ y $w$ valen cero y
              $v = 1{,}5\,C_3$
            correcta: true
            mensaje: |
              Eso es. $v_C = 1{,}503 - 1{,}5 = 0{,}003 = 1{,}5\,C_3$. Con
              $C_3$ ya sabido, E da las otras tres, y en su $v$ solo queda
              $C_2$ por despejar.
          - texto: >-
              Las cuatro: cada componente de $C'$ es una ecuación
            mensaje: |
              En C, $X = 0$ y $Z = 0$: $u = C_1\cdot0$ y $w = C_4\cdot0$ valen
              cero sea cual sea la constante. Esas dos ecuaciones se cumplen
              solas ($C'$ tiene la x y la z nulas) y no dicen nada. Solo $v$
              trae una incógnita.
          - texto: >-
              $C_3 = 1{,}503$, la y de $C'$
            mensaje: |
              $C'$ es la posición final, no el desplazamiento: hay que restar
              la inicial, $1{,}503 - 1{,}5 = 0{,}003$. Y eso es $v$, que vale
              $C_3Y$ con $Y = 1{,}5$.
      - tipo: calcular
        titulo: La constante que mezcla las dos coordenadas
        pregunta: |
          Con los datos de a), ¿cuánto vale $C_2$, en milésimas?
        respuesta:
          tipo: numero
          valor: '0.75'
          tolerancia: 0.005
          formato: un número, en milésimas (10⁻³)
        distractores:
          - valor: '1.5'
            mensaje: |
              Ese es $2C_2$. El campo lleva $v = 2C_2X + C_3Y$, y en E,
              $2C_2\cdot1 + 0{,}002\cdot1{,}5 = 0{,}0045$ da
              $2C_2 = 0{,}0015$. Falta dividir por 2.
          - valor: '2.25'
            mensaje: |
              Has despejado sin restar lo que aporta $C_3Y$: en E,
              $Y = 1{,}5$, y $v_E = 2C_2 + 1{,}5\,C_3$.
          - valor: '4.5'
            mensaje: |
              Ese es $v_E$, el desplazamiento según y de E. $C_2$ sale de
              despejarlo en $v_E = 2C_2\cdot1 + C_3\cdot1{,}5$.
        pista: |
          E está en $(1;\ 1{,}5;\ 1)$: $v_E = 1{,}5045 - 1{,}5 = 2C_2\cdot1 + C_3\cdot1{,}5$.
        desarrollo: |
          Con $C_3 = 0{,}002$, que da C: $0{,}0045 = 2C_2 + 0{,}003$, y
          $C_2 = 0{,}00075$. Las otras dos salen de E solas:
          $u_E = 1{,}002 - 1 = C_1\cdot1$ da $C_1 = 0{,}002$, y
          $w_E = 1 - 1 = C_4\cdot1$ da $C_4 = 0$.

          El apartado b) da $C_2 = 1{,}5\cdot10^{-3}$, que no es esta sino el
          doble: el coeficiente $2C_2$ entero. Desde b) el enunciado da sus
          valores, y con ellos se sigue.
      - tipo: calcular
        titulo: La deformación principal mayor
        pregunta: |
          Con las constantes de b), ¿cuánto vale la deformación principal
          mayor, en milésimas?
        respuesta:
          tipo: numero
          valor: '3.5'
          tolerancia: 0.005
          formato: un número, en milésimas
        distractores:
          - valor: '2'
            mensaje: |
              Es $\varepsilon_x$, que vale lo mismo que $\varepsilon_y$. Pero
              el tensor tiene $\varepsilon_{xy} \neq 0$: x no es dirección
              principal.
          - valor: '5'
            mensaje: |
              Has puesto $\gamma_{xy} = 0{,}003$ donde va
              $\varepsilon_{xy} = \gamma_{xy}/2 = 0{,}0015$: el radio del
              círculo sale el doble.
          - valor: '2.75'
            mensaje: |
              Es con la $C_2$ de a), $0{,}00075$. Desde b) mandan los datos
              de b): $C_2 = 1{,}5\cdot10^{-3}$, y $\varepsilon_{xy} = C_2$.
        pista: |
          $\varepsilon_{xy} = \tfrac12\left(\dfrac{\partial u}{\partial Y} + \dfrac{\partial v}{\partial X}\right)$,
          y z ya es principal, porque $\varepsilon_{xz} = \varepsilon_{yz} = 0$.
        desarrollo: |
          $\varepsilon_x = C_1 = 0{,}002$, $\varepsilon_y = C_3 = 0{,}002$,
          $\varepsilon_z = C_4 = 0$ y $\varepsilon_{xy} = \tfrac12(0 + 2C_2) = 0{,}0015$:

          $$
          [\varepsilon] = \begin{bmatrix} 0{,}002 & 0{,}0015 & 0\\ 0{,}0015 & 0{,}002 & 0\\ 0 & 0 & 0 \end{bmatrix}
          $$

          En xy, centro $0{,}002$ y radio $0{,}0015$: $\varepsilon_1 = 0{,}0035$
          y $\varepsilon_2 = 0{,}0005$, y $\varepsilon_3 = 0$ en z. Como
          $\varepsilon_x = \varepsilon_y$, $2\theta = 90^{\circ}$: las
          direcciones están a 45° de x, $(1, 1, 0)/\sqrt2$ para
          $\varepsilon_1$ y $(1, -1, 0)/\sqrt2$ para $\varepsilon_2$.
      - tipo: calcular
        titulo: El cambio de volumen
        pregunta: |
          ¿Cuánto cambia el volumen del paralelepípedo, en dm³?
        respuesta:
          tipo: numero
          valor: '6'
          tolerancia: 0.01
          formato: un número con su signo, en dm³
        distractores:
          - valor: '4'
            mensaje: |
              Es $e$ en milésimas, el cambio **por unidad de volumen**. El
              paralelepípedo mide $1\cdot1{,}5\cdot1 = 1{,}5$ m³.
        pista: |
          $\Delta V = eV$, con $e = \varepsilon_x + \varepsilon_y + \varepsilon_z$
          (ec. 3.59).
        desarrollo: |
          $e = 0{,}002 + 0{,}002 + 0 = 0{,}004$ y $V = 1{,}5$ m³:
          $\Delta V = 0{,}006$ m³, 6 dm³ más.
      - tipo: calcular
        titulo: El cambio del área de AEFO
        pregunta: |
          ¿Cuánto cambia el área de la superficie AEFO, en cm²?
        respuesta:
          tipo: numero
          valor: '61.0'
          tolerancia: 0.2
          formato: un número con su signo, en cm²
        distractores:
          - valor: '72.1'
            mensaje: |
              Has usado $e$, que es del volumen. Una superficie solo crece lo
              que se alargan sus dos direcciones; la tercera, la normal al
              plano, no la estira.
          - valor: '36.1'
            mensaje: |
              Es solo el lado OA, el del eje x. El otro lado, OF, también se
              alarga.
          - valor: '33.8'
            mensaje: |
              Es el cambio por metro cuadrado. El área de AEFO es
              $\sqrt{3{,}25} = 1{,}803$ m².
        pista: |
          AEFO es un rectángulo de lados OA, de 1 m según x, y OF, de
          $\sqrt{1{,}5^{2} + 1^{2}}$ m en la dirección $(0;\ 1{,}5;\ 1)$. Su
          área cambia, por unidad de área, la suma de lo que se alargan sus
          dos lados.
        desarrollo: |
          $A_0 = 1\cdot\sqrt{3{,}25} = 1{,}8028$ m². $\varepsilon_{OA} = \varepsilon_x = 0{,}002$,
          y con la ec. 3.54 en $\vec n = (0;\ 1{,}5;\ 1)/\sqrt{3{,}25}$:
          $\varepsilon_{OF} = 1{,}5^{2}\cdot0{,}002/3{,}25 = 0{,}0013846$. El
          ángulo recto entre los dos lados también cambia, pero eso mueve el
          área solo a segundo orden.

          $$
          \Delta A = 1{,}8028\cdot(0{,}002 + 0{,}0013846) = 0{,}0061\ \text{m}^{2} = 61{,}0\ \text{cm}^{2}
          $$
      - tipo: calcular
        titulo: El tensor en los ejes girados
        pregunta: |
          Con los ejes girados $\theta = 60^{\circ}$ alrededor de Z, en el
          sentido de la flecha de la figura, ¿cuánto vale $\varepsilon_{x'}$,
          en milésimas?
        respuesta:
          tipo: numero
          valor: '3.299'
          tolerancia: 0.002
          formato: un número, en milésimas
        distractores:
          - valor: '0.701'
            mensaje: |
              Es $\varepsilon_{y'}$, o la $\varepsilon_{x'}$ de girar al
              revés, $-60^{\circ}$. La flecha va de X hacia Y: $\theta$ es
              positivo.
          - valor: '4.598'
            mensaje: |
              Has puesto $\gamma_{xy}$ donde va $\varepsilon_{xy}$: en la
              fórmula del giro, el término es $\varepsilon_{xy}\sin2\theta$,
              con $\varepsilon_{xy} = 0{,}0015$.
        pista: |
          La flecha de la figura pasa por delante del eje Z yendo de X hacia
          Y. Como en tensiones:
          $\varepsilon_{x'} = \dfrac{\varepsilon_x + \varepsilon_y}{2} + \dfrac{\varepsilon_x - \varepsilon_y}{2}\cos2\theta + \varepsilon_{xy}\sin2\theta$,
          con $\varepsilon_{xy}$, la mitad de $\gamma_{xy}$.
        desarrollo: |
          $\varepsilon_{x'} = 0{,}002 + 0 + 0{,}0015\cdot\sin120^{\circ} = 0{,}003299$,
          $\varepsilon_{y'} = 0{,}002 - 0{,}001299 = 0{,}000701$ y
          $\varepsilon_{x'y'} = -\tfrac12(\varepsilon_x - \varepsilon_y)\sin2\theta + \varepsilon_{xy}\cos2\theta = 0{,}0015\cdot\cos120^{\circ} = -0{,}00075$.
          z no cambia:

          $$
          [\varepsilon'] = \begin{bmatrix} 0{,}003299 & -0{,}00075 & 0\\ -0{,}00075 & 0{,}000701 & 0\\ 0 & 0 & 0 \end{bmatrix}
          $$

          Con la matriz de giro, $[\varepsilon'] = [R][\varepsilon][R]^{T}$,
          sale lo mismo, y la traza sigue siendo 0,004.
      - tipo: calcular
        titulo: La tensión normal en ACFD
        pregunta: |
          ¿Cuánto vale la tensión normal en el plano ACFD, en MPa?
        respuesta:
          tipo: numero
          valor: '861.5'
          tolerancia: 0.5
          formato: un número con su signo, en MPa
        distractores:
          - valor: '621.5'
            mensaje: |
              Has hecho $\sigma = E\varepsilon$ en cada dirección. Con
              Poisson, $\sigma_x = 2G\varepsilon_x + \lambda e$: lo que se
              deforman las otras dos direcciones también tensa x.
          - valor: '750.8'
            mensaje: |
              Has tomado $\tau_{xy} = G\varepsilon_{xy}$, o has seguido con
              la $C_2$ de a), $0{,}00075$: las dos dan $\tau_{xy} = 120$ MPa.
              Es $G\gamma_{xy} = 2G\varepsilon_{xy} = 240$ MPa, con la $C_2$
              de b).
          - valor: '418.5'
            mensaje: |
              Has usado como normal la dirección de AC, que está **en** el
              plano. La normal es perpendicular a AC y a CF:
              $(1{,}5;\ 1;\ 0)/\sqrt{3{,}25}$.
        pista: |
          Primero el tensor de tensiones con Lamé: $G = E/[2(1 + \nu)]$,
          $\lambda = \nu E/[(1 + \nu)(1 - 2\nu)]$ y
          $\sigma_x = 2G\varepsilon_x + \lambda e$. Luego
          $\vec S = [\sigma]\vec n$ y $\sigma_n = \vec S\cdot\vec n$.
        desarrollo: |
          $G = \lambda = 80\,000$ MPa y $\lambda e = 320$ MPa:

          $$
          [\sigma] = \begin{bmatrix} 640 & 240 & 0\\ 240 & 640 & 0\\ 0 & 0 & 320 \end{bmatrix}\ \text{MPa}
          $$

          El plano ACFD contiene AC, en la dirección $(-1;\ 1{,}5;\ 0)$, y la
          vertical CF, así que su normal es
          $\vec n = (1{,}5;\ 1;\ 0)/\sqrt{3{,}25} = (0{,}8321;\ 0{,}5547;\ 0)$.
          $\vec S = [\sigma]\vec n = (665{,}6;\ 554{,}7;\ 0)$ MPa y
          $\sigma_n = \vec S\cdot\vec n = 2800/3{,}25 = 861{,}5$ MPa.
      - tipo: calcular
        titulo: La tangencial en ACFD
        pregunta: |
          ¿Y la tensión tangencial en ese plano, en MPa?
        respuesta:
          tipo: numero
          valor: '92.31'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '866.5'
            mensaje: |
              Es el módulo del vector tensión entero. La tangencial es lo que
              queda al quitarle la normal:
              $\tau_n = \sqrt{|\vec S|^{2} - \sigma_n^{2}}$.
        pista: |
          $\tau_n = \sqrt{|\vec S|^{2} - \sigma_n^{2}}$, con el $\vec S$ del
          paso anterior.
        desarrollo: |
          $|\vec S|^{2} = (1200^{2} + 1000^{2})/3{,}25 = 750\,769$ y
          $\tau_n = \sqrt{750\,769 - 861{,}538^{2}} = 92{,}31$ MPa. Comprobación:
          la tangencial va según AC, porque $\vec S$ no tiene componente z, y
          su proyección sobre $(-1;\ 1{,}5;\ 0)/\sqrt{3{,}25}$ da
          $300/3{,}25 = 92{,}31$ MPa.
      - tipo: calcular
        titulo: La tangencial máxima
        pregunta: |
          ¿Cuánto vale la tensión tangencial máxima, en MPa?
        respuesta:
          tipo: numero
          valor: '280'
          tolerancia: 0.5
          formato: un número, en MPa
        distractores:
          - valor: '240'
            mensaje: |
              Es el radio del círculo de Mohr del plano xy. La máxima es
              $(\sigma_1 - \sigma_3)/2$ con las tres principales, y
              $\sigma_z = 320$ MPa es la menor.
          - valor: '440'
            mensaje: |
              Has tomado $\sigma_z = 0$, como en tensión plana. Aquí lo nulo
              es $\varepsilon_z$, y $\sigma_z = \lambda e = 320$ MPa.
          - valor: '560'
            mensaje: |
              Es $\sigma_1 - \sigma_3$. Falta dividir por 2.
        pista: |
          z es principal. Saca las dos principales del plano xy y compáralas
          con $\sigma_z$.
        desarrollo: |
          En xy, centro 640 y radio 240: $\sigma_1 = 880$ y $\sigma_2 = 400$
          MPa; $\sigma_3 = \sigma_z = 320$ MPa.
          $\tau_{max} = (880 - 320)/2 = 280$ MPa, en los planos a 45° entre la
          dirección de $\sigma_1$, $(1, 1, 0)/\sqrt2$, y el eje z.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              C solo da $C_3$, y E, con ella, las otras tres.
          - texto: >-
              Desde b) se usan las constantes de b): $[\varepsilon]$ con
              $\varepsilon_{xy} = C_2$.
          - texto: >-
              z es principal; en xy, las principales salen a 45° de x porque
              $\varepsilon_x = \varepsilon_y$.
          - texto: >-
              $\Delta V = eV$, y el área de AEFO cambia lo que se alargan sus
              dos lados.
          - texto: >-
              Lamé da $[\sigma]$; $\vec S = [\sigma]\vec n$ en ACFD, y de ahí
              $\sigma_n$ y $\tau_n$.
          - texto: >-
              Como $\varepsilon_z = 0$, también $\sigma_z = 0$.
            trampa: true
            mensaje: |
              Eso es tensión plana, y aquí lo nulo es la deformación:
              $\sigma_z = 2G\cdot0 + \lambda e = 320$ MPa. Sin ella, la
              tangencial máxima sale mal.
    resolucion: |
      **a) Las constantes.** C está en $(0;\ 1{,}5;\ 0)$: allí $u = w = 0$ y
      $v_C = 1{,}503 - 1{,}5 = 1{,}5\,C_3$, así que $C_3 = 0{,}002$. E está
      en $(1;\ 1{,}5;\ 1)$: $u_E = 0{,}002 = C_1$, $w_E = 0 = C_4$ y
      $v_E = 0{,}0045 = 2C_2 + 1{,}5\,C_3$, de donde $C_2 = 0{,}00075$. El
      apartado b) da $C_2 = 1{,}5\cdot10^{-3}$, el doble: desde ahí se usan
      sus valores.

      **b) El tensor de deformaciones.** Con las constantes de b),
      $[g] = \begin{bmatrix} 0{,}002 & 0 & 0\\ 0{,}003 & 0{,}002 & 0\\ 0 & 0 & 0 \end{bmatrix}$
      y su parte simétrica (ec. 3.31):

      $$
      [\varepsilon] = \begin{bmatrix} 0{,}002 & 0{,}0015 & 0\\ 0{,}0015 & 0{,}002 & 0\\ 0 & 0 & 0 \end{bmatrix}
      $$

      **c) Las principales.** z es principal, con 0. En xy, centro 0,002 y
      radio 0,0015: $\varepsilon_1 = 0{,}0035$ en $(1, 1, 0)/\sqrt2$,
      $\varepsilon_2 = 0{,}0005$ en $(1, -1, 0)/\sqrt2$ y $\varepsilon_3 = 0$
      en z.

      **d) El volumen.** $e = 0{,}004$ (ec. 3.59) y
      $\Delta V = 0{,}004\cdot1{,}5 = 0{,}006$ m³.

      **e) La superficie AEFO.** Es un rectángulo de lados OA (1 m, según x)
      y OF ($\sqrt{3{,}25}$ m, en la dirección $(0;\ 1{,}5;\ 1)$). Con la
      ec. 3.54, $\varepsilon_{OA} = 0{,}002$ y $\varepsilon_{OF} = 0{,}0013846$:
      $\Delta A = \sqrt{3{,}25}\cdot0{,}0033846 = 0{,}0061$ m².

      **f) Los ejes girados 60°** alrededor de Z, de X hacia Y, como la
      flecha de la figura:

      $$
      [\varepsilon'] = \begin{bmatrix} 0{,}003299 & -0{,}00075 & 0\\ -0{,}00075 & 0{,}000701 & 0\\ 0 & 0 & 0 \end{bmatrix}
      $$

      **g) El plano ACFD.** Con Lamé, $G = \lambda = 80\,000$ MPa y
      $e = 0{,}004$: $\sigma_x = \sigma_y = 640$, $\sigma_z = 320$ y
      $\tau_{xy} = 240$ MPa. La normal del plano es
      $(1{,}5;\ 1;\ 0)/\sqrt{3{,}25}$, $\vec S = (665{,}6;\ 554{,}7;\ 0)$
      MPa, $\sigma_n = 861{,}5$ MPa y $\tau_n = 92{,}3$ MPa, según AC.

      **h) La tangencial máxima.** Principales 880, 400 y 320 MPa:
      $\tau_{max} = (880 - 320)/2 = 280$ MPa.

      Cada cifra sale del motor del curso (las principales, la deformación de
      una dirección, el vector tensión) y se ha rehecho a mano: el campo
      evaluado en C y en E, el determinante de $[I] + [g]$ (que da
      $\Delta V = 0{,}006006$ m³, lo mismo a primer orden), el área con la
      fórmula $\Delta A/A = e - \varepsilon_n$, el giro con la matriz de
      rotación y la tangencial proyectando $\vec S$ sobre AC.
