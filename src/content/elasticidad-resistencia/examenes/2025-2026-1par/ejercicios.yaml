ejercicios:
  # ── Teoría · pregunta 1 · la chapa en rombo en estado de fallo, y el estado hidrostático de Mohr.
  - id: exerm2526-1par-1-la-chapa-en-rombo-en-estado-de-fallo
    titulo: La chapa en rombo que está en fallo, sus tensiones principales y el estado hidrostático que fallaría según Mohr
    fuente: >-
      Pregunta 1 de teoría · Primer parcial del 31 de octubre de 2025 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Transcrita de una foto de la hoja
      impresa. La chapa es de la familia del problema 1 de la extraordinaria
      del 2 de febrero de 2021, que la carga con letras. El examen no publica
      resolución; el desarrollo es nuestro, con los convenios de los temas 2
      y 6.
    nivel: examen
    enunciado: |
      (1p) Una chapa de acero de 1 mm de espesor experimenta un estado
      tensional plano y constante en todos sus puntos, provocado por ciertas
      fuerzas de superficie aplicadas en cada uno de sus lados. Sabiendo que
      el estado de tensiones mostrado en la imagen corresponde a una
      situación de fallo:

      1. Determina las tensiones y las direcciones principales.
      2. Dado que la resistencia a compresión del material es
         $\sigma_{cl}$ =85,35 MPa, determina en qué estado hidrostático se
         produciría el fallo según el criterio de Mohr.

