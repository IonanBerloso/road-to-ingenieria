# El primer parcial de Elasticidad y Resistencia de Materiales del 31 de
# octubre de 2025, **su hoja de teoría y un problema de la de problemas**:
# tres preguntas de 1 punto y el problema 3, de 2 puntos. El resto de la hoja
# de problemas no ha llegado.
#
# 1. **LA FUENTE SON FOTOS DE MÓVIL.** Llegó una foto de la hoja de teoría,
#    bilingüe, castellano a la izquierda y euskera a la
#    derecha, y el 23 de octubre de 2026 una captura de pantalla de una foto
#    del problema 3, con la columna en euskera cortada por la derecha. Las
#    fotos de exámenes no se publican nunca: no hay PDF, y `sinPdf` lo dice.
#    Las figuras de la pregunta 1 y del problema 3 están redibujadas.
#
#    En la cabecera de la hoja de problemas, la fecha impresa está tachada y
#    debajo va escrita a mano la del 31/10/2025. El castellano de estas
#    cabeceras arrastra a veces la fecha de otro año: el problema suelto del
#    transductor, de otro primer parcial, dice 17/11/2023 en castellano y
#    2024/11/22 en euskera. La `fuente` del problema lo cuenta.
#
# 2. **FALTA EL RESTO DE LA HOJA DE PROBLEMAS, Y LO DICE `faltaHoja`.**
#    `fuera` va por ejercicio, con su número, y del resto de la hoja no se
#    sabe lo bastante: el que llegó es el 3, así que hubo un 1 y un 2, pero
#    no se sabe si hubo un 4 ni cuánto vale cada uno (los parciales de 2016-2017 a
#    2022-2023 traen tres problemas de 2 puntos, pero eso es una regla, no un
#    dato de esta hoja). `faltaHoja` declara lo que falta sin inventar
#    números: la página lo dice en su propia caja («Falta el resto de la hoja
#    de problemas del cuadernillo») y la convocatoria no cuenta como entera
#    en ningún sitio. No lleva `fuera`. El problema 3 lleva el `n` 6, porque
#    los problemas se numeran detrás de las preguntas de teoría, como en los
#    demás parciales.
#
# 3. **SIN `puntosImpresos`.** La hoja imprime «(1p)» en las tres preguntas
#    y «(2p)» en el problema, y el enunciado de cada uno lo conserva.
#    Declararlo aquí haría que la página sumara un total de 5 puntos para un
#    parcial que vale 10.
#
# 4. **LO QUE NO ES DEL ENUNCIADO.** La foto de la teoría lleva anotaciones a
#    lápiz de quien hizo el examen (una línea con las tensiones nulas fuera
#    del plano en la pregunta 1 y cuentas en la parte de abajo de la hoja), y
#    la del problema 3, un rayado en rojo, una línea azul con «δ» y unas
#    letras junto a los ejes. No se transcriben; ninguna tapa texto impreso, y
#    la figura del problema se lee entera por debajo.
#
# 5. **GRAFÍAS DEL TEXTO, CONSERVADAS.** «σcl =85,35 MPa», con el subíndice
#    «cl» y el espacio antes del igual, en la pregunta 1; las dos columnas
#    llevan el mismo subíndice. La numeración «1.» y «2.» de los apartados de
#    la pregunta 1 va como en la hoja. En el problema 3, «angulo», «cual»,
#    «intrinsecas» y «Tesión», y los puntos decimales de la hoja (1.002,
#    0.25).
#
# 6. **EL EUSKERA NO DICE OTRA COSA**: mismos datos, mismos apartados y la
#    misma figura en las tres preguntas. Del problema 3 la foto deja ver algo
#    más de la mitad de cada línea en euskera, y lo que se lee dice lo mismo.
#
# 7. **NINGUNA ESTÁ YA EN EL SITIO.** La pregunta 2 pide las dos
#    demostraciones que la cuestión 1 de 2014-2015 y la de 2019-2020 piden
#    por separado (solo la ortogonalidad) y la cuestión 10 del tema 2 (solo
#    que son reales); la 3 pide lo que la cuestión 3 de 2019-2020, pero sin
#    darle la energía de deformación. Van como ejercicios propios, y su
#    `fuente` lo dice. El campo del problema 3 no sale en ningún otro examen
#    del sitio.
#
# 8. **EL DATO REDONDEADO.** 85,35 MPa es 50 + 25√2 = 85,355 redondeado: con
#    él, k = 0,8 justo y el estado hidrostático de fallo es 341,42 MPa; con
#    el 85,35 impreso, 341,5. El paso acepta los dos.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso y de un segundo camino (fase-p/p9h,
# guiones/cifras.mjs; el problema 3, fase-p/p12, guiones/cifras.mjs).
sinPdf: >-
  El enunciado solo ha llegado en fotos de las hojas impresas, y las fotos de
  exámenes no se publican: la transcripción de cada pregunta es la única
  versión, y las figuras están redibujadas.
faltaHoja:
  hoja: el resto de la hoja de problemas
  motivo: >-
    El parcial llegó en una foto de su hoja de teoría, la de las tres
    preguntas de 1 punto que hay aquí, y de la hoja de problemas solo ha
    llegado el problema 3, de 2 puntos. Los problemas 1 y 2 no nos han
    llegado, y no sabemos si había alguno más ni cuánto valía cada uno: por
    eso no se cuentan ni se numeran.

