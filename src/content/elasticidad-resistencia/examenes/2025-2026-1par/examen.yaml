# El primer parcial de Elasticidad y Resistencia de Materiales del 31 de
# octubre de 2025, **solo su hoja de teoría**: tres preguntas de 1 punto. La
# hoja de problemas no ha llegado.
#
# 1. **LA FUENTE SON FOTOS DE MÓVIL.** Llegó una foto de la hoja de teoría,
#    bilingüe, castellano a la izquierda y euskera a la
#    derecha. Las fotos de exámenes no se publican nunca: no hay PDF, y
#    `sinPdf` lo dice. La figura de la pregunta 1 está redibujada.
#
# 2. **FALTA LA HOJA DE PROBLEMAS, Y LO DICE `faltaHoja`.** `fuera` va por
#    ejercicio, con su número, y de la hoja que falta no se sabe nada: ni
#    cuántos problemas trae ni cuánto vale cada uno (los parciales de
#    2016-2017 a 2022-2023 traen tres de 2 puntos, pero eso es una regla, no
#    un dato de esta hoja). `faltaHoja` declara la hoja entera sin inventar
#    números: la página lo dice en su propia caja («Falta la hoja de
#    problemas del cuadernillo») y la convocatoria no cuenta como entera en
#    ningún sitio. No lleva `fuera`.
#
# 3. **SIN `puntosImpresos`.** La hoja imprime «(1p)» en las tres preguntas,
#    y el enunciado de cada una lo conserva. Declararlo aquí haría que la
#    página sumara un total de 3 puntos para un parcial que vale 10.
#
# 4. **LO QUE NO ES DEL ENUNCIADO.** La foto lleva anotaciones a lápiz de
#    quien hizo el examen (una línea con las tensiones nulas fuera del plano
#    en la pregunta 1 y cuentas en la parte de abajo de la hoja). No se
#    transcriben; ninguna tapa texto impreso.
#
# 5. **GRAFÍAS DEL TEXTO, CONSERVADAS.** «σcl =85,35 MPa», con el subíndice
#    «cl» y el espacio antes del igual, en la pregunta 1; las dos columnas
#    llevan el mismo subíndice. La numeración «1.» y «2.» de los apartados de
#    la pregunta 1 va como en la hoja.
#
# 6. **EL EUSKERA NO DICE OTRA COSA**: mismos datos, mismos apartados y la
#    misma figura en las tres preguntas.
#
# 7. **NINGUNA ESTÁ YA EN EL SITIO.** La pregunta 2 pide las dos
#    demostraciones que la cuestión 1 de 2014-2015 y la de 2019-2020 piden
#    por separado (solo la ortogonalidad) y la cuestión 10 del tema 2 (solo
#    que son reales); la 3 pide lo que la cuestión 3 de 2019-2020, pero sin
#    darle la energía de deformación. Van como ejercicios propios, y su
#    `fuente` lo dice.
#
# 8. **EL DATO REDONDEADO.** 85,35 MPa es 50 + 25√2 = 85,355 redondeado: con
#    él, k = 0,8 justo y el estado hidrostático de fallo es 341,42 MPa; con
#    el 85,35 impreso, 341,5. El paso acepta los dos.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso y de un segundo camino (fase-p/p9h,
# guiones/cifras.mjs).
sinPdf: >-
  El enunciado solo ha llegado en una foto de la hoja impresa, y las fotos de
  exámenes no se publican: la transcripción de cada pregunta es la única
  versión, y la figura está redibujada.
faltaHoja:
  hoja: la hoja de problemas
  motivo: >-
    El parcial llegó en una foto de su hoja de teoría, la de las tres
    preguntas de 1 punto que hay aquí. La hoja de problemas no nos ha
    llegado: no sabemos cuántos problemas traía ni cuánto valía cada uno, y
    por eso no se cuentan ni se numeran.

