asignatura: elasticidad-resistencia
curso: '2020-2021'
convocatoria: primer-parcial
fecha: 20 de noviembre de 2020
# El primer parcial de Elasticidad y Resistencia de Materiales del 20 de
# noviembre de 2020: una hoja de TEORÍA con cuatro preguntas de 1 punto y dos
# hojas de PROBLEMAS con tres de 2 puntos. El mismo documento está en el
# material dos veces, como «2020-2021» y como «2021-2022»: el Word es el mismo
# fichero byte a byte y la fecha impresa es 20/11/2020 en los dos.
#
# El cuadernillo es bilingüe, castellano a la izquierda y euskera a la
# derecha, y se transcribe **solo la columna en castellano**, tal cual, con
# sus puntos impresos. Las dos columnas piden lo mismo en las siete preguntas.
# Lo que hay que saber antes de leer las resoluciones:
#
# 1. **ERRATAS DEL TEXTO, CONSERVADAS**: «solido» sin tilde (teoría 2); «entre
#    que valores» sin tilde y el coeficiente de Poisson escrito «υ», una
#    ípsilon griega en lugar de la ν (teoría 3); «320Mpa» y «200 Mpa»
#    (teoría 4); «(2 p)» con espacio y «A= 4 cm² ,E=» con la coma pegada a la E
#    (problema 3). El Word lleva además un
#    carácter suelto de la fuente Symbol al final de la teoría 2 («de igual
#    módulo υ.») que el PDF no dibuja: no se transcribe.
#
# 2. **UN DATO QUE FALTA.** El problema 1 no da ni E ni ν, y los apartados a)
#    (por εz) y d) los necesitan. No se inventan: εz y el tensor de tensiones
#    se dan en función de E y ν, y los números que el sitio pide para
#    comprobar usan E = 2·10⁵ MPa (el del problema 3) y ν = 0,3, dichos en el
#    enunciado como «Notas nuestras» y como supuestos, no como datos.
#
# 3. **LA ROSETA ESTÁ EN UN ESPEJO.** La del problema 1 es la roseta a 120° de
#    los apuntes (tema 3, figura 3.8) reflejada: la galga b está a 60° de x y
#    la c a −60°, no a 120° y 240°. Con las fórmulas 3.66 tal cual, γxy sale
#    con el signo cambiado. Se resuelve escribiendo la galga en cada ángulo.
#
# 4. **LA FIGURA DEL PROBLEMA 3 SE HA LEÍDO DEL WORD.** En el PDF sale a medio
#    dibujar (solo la L de ABCD, los pasadores, los
#    rótulos y los textos de las cotas); el Word tampoco la dibuja
#    entera al convertirlo, porque son formas VML. Se leyeron sus coordenadas
#    del XML (vml-p3.py en la unidad p2b): las barras 1 y 3 están rotuladas
#    30° y dibujadas a unos 26° y 18°; se redibuja a los 30° rotulados.
#
# 5. **DOS NUMERACIONES EN UN CUADERNILLO.** La teoría va de la 1 a la 4 y los
#    problemas vuelven a empezar en 1. Aquí la teoría son **n 1 a 4** y los
#    problemas **n 5 (Problema 1), 6 (Problema 2) y 7 (Problema 3)**; la
#    `fuente` de cada ejercicio dice el nombre impreso.
#
# 6. **EL PROBLEMA 1 SE PARTE** en dos piezas, porque cruza temas: a), b) y
#    c) son del tema 3 (deformaciones) y d) y e), del 4 (Hooke). Las dos
#    llevan el enunciado entero y la misma n.
#
# 7. **LAS PREGUNTAS 1 Y 3 DE LA TEORÍA SON COPIA LITERAL** de la 1 y la 3 del
#    parcial 1 de 2022-2023 (18/11/2022), salvo el corte de las líneas. No se
#    resuelven dos veces: estas dos entradas apuntan a los ejercicios de ese
#    examen, cuya `fuente` cita el de 2022. Sus enunciados de 2020, tal cual:
#
#    1. (1p) Proceso de deformación. En la parte antisimétrica de la
#       transformación, un elemento de longitud se transforma según:
#       d r' = dr + Ω × dr (con flecha de vector sobre los tres). Deducir
#       cuál es la nueva longitud del elemento y explicar qué ocurre cuando
#       las componentes del vector rotación Ω son números pequeños.
#
#    3. (1p) Justificar entre que valores está acotado el coeficiente de
#       Poisson υ .
#
# El examen no publica resolución ni resultados: todos los desarrollos son
# nuestros, cada cifra calculada con el motor del curso (src/lib/erm) y
# comprobada por un segundo camino.
pdf: 2020-2021-1par.pdf

ejercicios:
  # Teoría · pregunta 1 · la rotación de la parte antisimétrica. Copia literal
  # de la pregunta 1 del parcial 1 de 2022-2023: se reutiliza su ejercicio.
  - id: exerm2223-1par-1-la-rotacion-no-cambia-la-longitud
    tema: t03-deformaciones
    n: 1
  # Teoría · pregunta 2 · el plano con σn = τn y la Sn máxima.
  - id: exerm2021-1par-2-el-plano-de-sigma-y-tau-iguales
    tema: t02-tensiones
    n: 2
  # Teoría · pregunta 3 · las cotas del coeficiente de Poisson. Copia literal
  # de la pregunta 3 del parcial 1 de 2022-2023: se reutiliza su ejercicio.
  - id: exerm2223-1par-3-las-cotas-del-coeficiente-de-poisson
    tema: t04-cuerpo-elastico
    n: 3
  # Teoría · pregunta 4 · Mohr con tracción y cortadura pura.
  - id: exerm2021-1par-4-el-limite-a-compresion-por-mohr
    tema: t06-teorias-de-fallo
    n: 4

  # Problema 1 · la roseta: a), b) y c) del tema 3; d) y e) del tema 4.
  - id: exerm2021-1par-5-la-roseta-vista-en-un-espejo
    tema: t03-deformaciones
    n: 5
  - id: exerm2021-1par-5-las-tensiones-que-causan-la-roseta
    tema: t04-cuerpo-elastico
    n: 5

  # Problema 2 · la viga Gerber.
  - id: exerm2021-1par-6-la-gerber-empotrada-con-la-rotula-en-c
    tema: t07-piezas-prismaticas
    n: 6

  # Problema 3 · ABCD y EFG rígidas con tres barras.
  - id: exerm2021-1par-7-dos-piezas-rigidas-y-tres-barras
    tema: t08-esfuerzo-axial
    n: 7

