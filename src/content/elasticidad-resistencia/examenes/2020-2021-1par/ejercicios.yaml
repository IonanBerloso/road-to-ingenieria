    pide: Los diagramas de cortantes y de flectores, con sus valores en función de q0 y a.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por dónde se empieza a resolver la viga?
        opciones:
          - texto: >-
              Por el tramo CDE: el flector es nulo en la rótula C, y momentos
              respecto de C dan la reacción de D sin tocar el empotramiento
            correcta: true
            mensaje: |
              Eso es. La rótula añade la ecuación $M_C = 0$, y aplicada a la
              parte que cuelga de ella, que solo tiene una reacción, la deja
              resuelta. Lo que quede en la rótula pasa al tramo AC como una
              fuerza más.
          - texto: >-
              Por el empotramiento: $M_A$, $R_A$ y $R_D$ salen del equilibrio
              global de la viga entera
            mensaje: |
              El equilibrio global da dos ecuaciones útiles (vertical y
              momentos) para tres incógnitas. La tercera es la de la rótula:
              sin $M_C = 0$ la viga parece hiperestática.
          - texto: >-
              La rótula no cambia nada: la viga se resuelve como si fuera
              continua
            mensaje: |
              Una viga empotrada y apoyada sin rótula **sería** hiperestática.
              La rótula libera el giro relativo y obliga a que el flector sea
              cero en C: es la ecuación que la hace isostática.
      - tipo: calcular
        titulo: La reacción en D
        pregunta: |
          ¿Cuánto vale la reacción en D, en unidades de $q_0a$? Positiva hacia
          arriba.
        respuesta:
          tipo: numero
          valor: '1.5'
          tolerancia: 0.001
          formato: un número, en unidades de q0·a
        distractores:
          - valor: '1'
            mensaje: |
              Has puesto que D sostiene solo su carga, $q_0a$. Pero la
              resultante de DE está a $1{,}5a$ de C, más allá de D: con
              momentos respecto de C, $R_D\,a = q_0a\cdot1{,}5a$. El tramo CD
              hace de palanca, y la rótula tira hacia abajo.
          - valor: '2.5'
            mensaje: |
              Has metido en CDE la carga $2q_0$ de BC y has sumado su momento
              al de DE: $R_D\,a = q_0a\cdot1{,}5a + 2q_0a\cdot0{,}5a$. Esa carga
              no es de CDE: la rótula parte la viga en C y queda entera en el
              tramo AC. (Y aunque lo fuera, está a la izquierda de C y giraría
              al revés.)
        pista: |
          Momentos respecto de C en el tramo CDE: $R_D\cdot a - q_0a\cdot\tfrac{3a}{2} = 0$.
        desarrollo: |
          $$
          R_D = \frac{q_0a\cdot1{,}5a}{a} = 1{,}5\,q_0a
          $$

          y la vertical de CDE da la fuerza en la rótula:
          $V_C = q_0a - 1{,}5q_0a = -0{,}5\,q_0a$. Es decir, el tramo AC empuja
          hacia abajo a CDE con $0{,}5q_0a$, y CDE empuja hacia arriba a AC con
          lo mismo.
      - tipo: calcular
        titulo: El flector en el empotramiento
        pregunta: |
          ¿Cuánto vale el flector en A, en unidades de $q_0a^{2}$? Con el
          convenio del curso: positivo si tracciona la fibra inferior.
        respuesta:
          tipo: numero
          valor: '-2'
          tolerancia: 0.001
          formato: un número, en unidades de q0·a²
        distractores:
          - valor: '-3'
            mensaje: |
              Has olvidado la fuerza de la rótula sobre AC: $0{,}5q_0a$ hacia
              arriba en C, a $2a$ de A. Resta $q_0a^{2}$ al momento de la carga
              de BC, que es $2q_0a\cdot1{,}5a = 3q_0a^{2}$.
          - valor: '2'
            mensaje: |
              El valor está bien y el signo no. El empotramiento de un
              voladizo cargado hacia abajo tracciona la fibra **superior**: el
              flector es negativo con el convenio del curso.
        pista: |
          En AC: carga $2q_0a$ a $1{,}5a$ de A y fuerza de la rótula
          $0{,}5q_0a$ hacia arriba a $2a$ de A.
        desarrollo: |
          Tomando la parte de la derecha de la sección A, que es todo AC:

          $$
          M_A = 0{,}5q_0a\cdot2a - 2q_0a\cdot1{,}5a = q_0a^{2} - 3q_0a^{2} = -2\,q_0a^{2}
          $$

          Y la reacción vertical, $R_A = 2q_0a - 0{,}5q_0a = 1{,}5\,q_0a$.
      - tipo: calcular
        titulo: El flector positivo de BC
        pregunta: |
          Entre B y C el flector tiene un máximo relativo. ¿Cuánto vale, en
          unidades de $q_0a^{2}$?
        respuesta:
          tipo: numero
          valor: '0.0625'
          tolerancia: 0.001
          formato: un número, en unidades de q0·a²
        distractores:
          - valor: '0'
            mensaje: |
              Has buscado el máximo en el centro de BC, $x = 1{,}5a$, donde
              $M = 0$. El extremo está donde el **cortante** se anula:
              $V = 1{,}5q_0a - 2q_0(x - a) = 0$ en $x = 1{,}75a$.
          - valor: '-0.5'
            mensaje: |
              Es el flector en B. Entre B y C el diagrama es una parábola que
              sube de $-0{,}5$ a 0 y se pasa: tiene su máximo dentro del tramo,
              donde $V = 0$.
        pista: |
          $V(x) = 1{,}5q_0a - 2q_0(x - a)$ en BC. Anúlalo, y suma el área del
          cortante desde B.
        desarrollo: |
          $V = 0$ en $x = 1{,}75a$. Desde B, el área del triángulo de cortantes:

          $$
          M(1{,}75a) = M_B + \tfrac12\cdot1{,}5q_0a\cdot0{,}75a = -0{,}5q_0a^{2} + 0{,}5625q_0a^{2}
          = \frac{q_0a^{2}}{16}
          $$
      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de cortantes y de flectores**, alineados
          bajo la viga, con los valores en A, B, C, D y E y el máximo relativo
          de BC.
        comprueba:
          - punto: |
              **Cortante de $1{,}5q_0a$ constante en AB**, recta hasta
              $-0{,}5q_0a$ en C con el cero en $x = 1{,}75a$, y $-0{,}5q_0a$
              constante en CD.
            porque: |
              En AB no hay carga; la $2q_0$ de BC baja el cortante $2q_0a$; y
              de C a D no hay carga, y la rótula transmite cortante: no salta.
          - punto: |
              **Salto de $1{,}5q_0a$ en D**, hasta $q_0a$, y recta hasta 0 en E.
            porque: |
              Una reacción concentrada hace saltar el cortante lo que vale, y
              en el extremo libre no queda nada que equilibrar.
          - punto: |
              **Flector de $-2q_0a^{2}$ en A**, recta hasta $-0{,}5q_0a^{2}$ en B,
              parábola con máximo $q_0a^{2}/16$ en $1{,}75a$ y **cero en C**.
            porque: |
              El flector de la rótula es cero por definición; si el diagrama no
              pasa por cero en C, hay un error antes.
          - punto: |
              **Recta de 0 a $-0{,}5q_0a^{2}$ en D** y parábola hasta 0 en E, que
              llega con tangente horizontal.
            porque: |
              En D hay un pico (el cortante salta), y en E la tangente es
              horizontal porque el cortante ahí es cero.
        figura: |
          <svg viewBox="30 10 410 250" role="img" width="410" height="250"
               aria-labelledby="exerm2021-1par-6-diagramas-dib-t exerm2021-1par-6-diagramas-dib-d">
