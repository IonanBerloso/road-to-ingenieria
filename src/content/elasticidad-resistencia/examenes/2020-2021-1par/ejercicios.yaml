            <text x="250" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--ink)">C</text>
            <text x="340" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--ink)">D</text>
            <text x="430" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--ink)">E</text>
          </svg>
      - tipo: justificar
        pregunta: Ordena la resolución de examen. Una pieza es falsa.
        piezas:
          - texto: >-
              Tramo CDE, momentos respecto de la rótula C: $R_D = 1{,}5q_0a$, y
              la rótula transmite $0{,}5q_0a$.
          - texto: >-
              Tramo AC, con la fuerza de la rótula hacia arriba:
              $R_A = 1{,}5q_0a$ y $M_A = -2q_0a^{2}$ (tracciona arriba).
          - texto: >-
              Cortantes: $1{,}5q_0a$ en AB, recta hasta $-0{,}5q_0a$ en C, igual
              hasta D, salto a $q_0a$ y recta hasta 0 en E.
          - texto: >-
              Flectores: $-2q_0a^{2}$ en A, $-0{,}5q_0a^{2}$ en B, máximo
              $q_0a^{2}/16$ en $1{,}75a$, 0 en C, $-0{,}5q_0a^{2}$ en D y 0 en E.
          - texto: >-
              En la rótula el cortante también es cero, porque una
              articulación no transmite esfuerzos.
            trampa: true
            mensaje: |
              Una rótula no transmite **momento**, pero sí fuerza: aquí pasa
              $0{,}5q_0a$ de un tramo al otro, y el cortante en C vale
              $-0{,}5q_0a$. Sin esa fuerza, $R_D$ no podría ser $1{,}5q_0a$.
    resolucion: |
      **Convenio** (apuntes del tema 7, pp. 8-9 y 12): cortante positivo si
      la suma de fuerzas a la izquierda de la sección va hacia arriba,
      flector positivo si tracciona la fibra inferior, y $dV/dx = -q$,
      $dM/dx = V$. Origen en A.

      **El tramo CDE.** El flector en la rótula es cero. Momentos respecto de
      C:

      $$
      R_D\,a = q_0a\cdot\tfrac{3}{2}a \;\Longrightarrow\; R_D = 1{,}5\,q_0a
      $$

      La vertical de CDE deja en la rótula una fuerza de $0{,}5q_0a$: hacia
      abajo sobre CDE y hacia arriba sobre AC.

      **El tramo AC.** Con la carga $2q_0a$ (resultante a $1{,}5a$ de A) y los
      $0{,}5q_0a$ de la rótula hacia arriba en C:

      $$
      R_A = 2q_0a - 0{,}5q_0a = 1{,}5\,q_0a,\qquad
      M_A = 0{,}5q_0a\cdot2a - 2q_0a\cdot1{,}5a = -2\,q_0a^{2}
      $$

      (el empotramiento hace un par antihorario de $2q_0a^{2}$ sobre la viga, y
      la fibra traccionada en A es la superior).

      **Cortantes.**

      $$
      V = \begin{cases}
      1{,}5\,q_0a & 0 < x < a\\
      1{,}5\,q_0a - 2q_0(x-a) & a < x < 2a\\
      -0{,}5\,q_0a & 2a < x < 3a\\
      q_0a - q_0(x-3a) & 3a < x < 4a
      \end{cases}
      $$

      Se anula en $x = 1{,}75a$ y salta $1{,}5q_0a$ en D.

      **Flectores.**

      $$
      M = \begin{cases}
      -2q_0a^{2} + 1{,}5\,q_0a\,x & 0 \le x \le a\\
      -0{,}5q_0a^{2} + 1{,}5\,q_0a\,(x-a) - q_0(x-a)^{2} & a \le x \le 2a\\
      -0{,}5\,q_0a\,(x-2a) & 2a \le x \le 3a\\
      -0{,}5q_0a^{2} + q_0a\,(x-3a) - \tfrac12 q_0(x-3a)^{2} & 3a \le x \le 4a
      \end{cases}
      $$

      Valores: $M_A = -2q_0a^{2}$, $M_B = -0{,}5q_0a^{2}$, **máximo relativo
      $q_0a^{2}/16$ en $x = 1{,}75a$**, $M_C = 0$, $M_D = -0{,}5q_0a^{2}$ y
      $M_E = 0$. El flector de mayor valor absoluto es el del empotramiento,
      $2q_0a^{2}$.

