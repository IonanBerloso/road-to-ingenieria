      <figcaption>

      Redibujada del **Word** original: en el PDF la figura sale a medio dibujar (faltan las tres barras, la pieza EFG, la fuerza P y las líneas de cota). El original dibuja los dos ángulos más cerrados de lo que dicen sus rótulos (unos 26° y 18°); aquí van a los **30°** rotulados: las cotas no fijan esos ángulos, y manda el rótulo.

      </figcaption>
      </figure>
    pide: >-
      a) N1, N2 y N3 en función de P; b) la P máxima con σadm = 180 MPa; c) las
      tensiones en las tres barras si solo se calienta la 3, 20 °C.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántas incógnitas tiene el problema y por dónde se empieza?
        opciones:
          - texto: >-
              Siete (tres axiles, dos reacciones en C y dos en E) para seis
              ecuaciones: hiperestático de grado 1. Pero EFG sola es
              isostática, y da $N_2$ directamente
            correcta: true
            mensaje: |
              Eso es. EFG tiene la articulación de E y la barra 2: momentos
              respecto de E dan $N_2$. ABCD tiene la articulación de C y tres
              barras: le sobra una, y ahí entra la compatibilidad de
              deformaciones del tema 8.
          - texto: >-
              Es isostático: tres barras, tres axiles, tres ecuaciones de
              equilibrio
            mensaje: |
              Faltan las reacciones de las articulaciones C y E, dos en cada
              una, y sobran ecuaciones: hay dos sólidos, seis ecuaciones. Siete
              incógnitas para seis: grado 1.
          - texto: >-
              Es un mecanismo: ABCD puede girar alrededor de C
            mensaje: |
              Giraría si no tuviera barras; con la 1 y la 3 a tierra no puede
              girar sin alargarlas. Y EFG tampoco, sujeta por la 2.
      - tipo: calcular
        titulo: El axil de la barra 2
        pregunta: |
          ¿Cuánto vale $N_2$, en unidades de $P$? Positivo si es de tracción.
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número, en unidades de P
        distractores:
          - valor: '0.5'
            mensaje: |
              Has cambiado los brazos: P está en G, a $2a$ de E, y la barra 2
              en F, a $a$. $N_2\,a = P\cdot2a$: la barra lleva el **doble** de
              P, no la mitad.
          - valor: '-2'
            mensaje: |
              El valor está bien y el signo no. P empuja G hacia la derecha y
              EFG gira alrededor de E: F se aleja de D y la barra 2 tiene que
              tirar de F hacia la izquierda. Está traccionada.
        pista: |
          Momentos respecto de E en EFG: P a altura $2a$ y la barra 2 a altura $a$.
        desarrollo: |
          $$
          N_2\cdot a = P\cdot 2a \;\Longrightarrow\; N_2 = 2P\ \text{(tracción)}
          $$
      - tipo: calcular
        titulo: El axil de la barra 1
        pregunta: |
          Con la compatibilidad de ABCD, ¿cuánto vale $N_1$, en unidades de
          $P$? Positivo si es de tracción.
        respuesta:
          tipo: numero
          valor: '0.46188'
          tolerancia: 0.001
          formato: un número, en unidades de P
        distractores:
          - valor: '0.4'
            mensaje: |
              Has tomado brazos $a$ y $2a$ para las barras 1 y 3, como si
              fueran perpendiculares a los brazos de ABCD. Están a 30°: el
              brazo de la 1 respecto de C es $a\cos30°$, y el de la 3,
              $2a\cos30°$.
          - valor: '0.76980'
            mensaje: |
              Has supuesto $N_1 = N_3$. Con la compatibilidad, B se mueve el
              doble que A en la dirección de su barra, las dos miden lo mismo,
              y $N_3 = 2N_1$.
        pista: |
          ABCD gira $\theta$ alrededor de C. Proyecta el desplazamiento de A y
          de B sobre sus barras: $\Delta_1 = a\theta\cos30°$, $\Delta_3 =
          2a\theta\cos30°$, y $L_1 = L_3$.
        desarrollo: |
          Compatibilidad: $\Delta_3 = 2\Delta_1$ y $L_1 = L_3 = 2a/\sqrt3$, así
          que $N_3 = 2N_1$. Momentos respecto de C en ABCD:

          $$
          N_1\,a\cos30° + N_3\,2a\cos30° = N_2\,a = 2Pa
          \;\Longrightarrow\;
          \frac{\sqrt3}{2}N_1 + 2\sqrt3\,N_1 = 2P
          \;\Longrightarrow\;
          N_1 = \frac{4P}{5\sqrt3} \approx 0{,}462P
          $$
      - tipo: calcular
        titulo: La P máxima
        pregunta: |
          Con $\sigma_{adm} = 180$ MPa y $A = 4$ cm², ¿cuál es la mayor $P$, en kN?
        respuesta:
          tipo: numero
          valor: '36'
          tolerancia: 0.05
          formato: un número, en kN
        distractores:
          - valor: '77.94'
            mensaje: |
              Has limitado con la barra 3, $N_3 \approx 0{,}924P$, que es la más
              cargada de ABCD. Pero la que más lleva es la 2, con $2P$:
              manda ella.
          - valor: '72'
            mensaje: |
              Has tomado $N_2 = P$. La barra 2 lleva el doble de P por la
              palanca de EFG.
        pista: |
          La barra más cargada es la 2: $2P/A \le 180$ MPa, con
          $A = 400$ mm².
        desarrollo: |
          $$
          \frac{2P}{A} \le \sigma_{adm}
          \;\Longrightarrow\;
          P \le \frac{180\cdot400}{2} = 36\,000\ \mathrm{N} = 36\ \mathrm{kN}
          $$
      - tipo: calcular
        titulo: La tensión térmica en la barra 3
        pregunta: |
          Sin P, la barra 3 se calienta 20 °C. ¿Qué tensión aparece en ella,
          en MPa? Positiva si es de tracción.
        respuesta:
          tipo: numero
          valor: '-9.6'
          tolerancia: 0.01
          formato: un número, en MPa; positivo si es de tracción
        distractores:
          - valor: '-48'
            mensaje: |
              Es $-E\alpha\Delta T$, la de una barra con los dos extremos
              fijos. Aquí B no está fijo: ABCD gira y deja dilatar a la barra 3
              a costa de estirar la 1.
          - valor: '9.6'
            mensaje: |
              El valor está bien y el signo no. La barra 3 quiere alargarse y
              ABCD se lo impide en parte: queda **comprimida**, y la 1,
              traccionada.
          - valor: '-19.2'
            mensaje: |
              Has cambiado los papeles: $19{,}2$ MPa es la tensión de la
              barra 1. Por el equilibrio de ABCD, $N_3 = -N_1/2$: la 3 lleva la
              mitad.
        pista: |
          Compatibilidad: $\Delta_3 = 2\Delta_1$, con
          $\Delta_3 = \frac{N_3L}{EA} + \alpha\Delta T L$. Equilibrio: $\tfrac{\sqrt3}{2}N_1 + \sqrt3\,N_3 = 0$,
          porque sin P la barra 2 no lleva nada.
        desarrollo: |
          Del equilibrio, $N_1 = -2N_3$. De la compatibilidad,
          $\frac{N_3L}{EA} + \alpha\Delta T L = 2\frac{N_1L}{EA} = -4\frac{N_3L}{EA}$:

          $$
          5\,\frac{N_3}{A} = -E\alpha\Delta T
          \;\Longrightarrow\;
          \sigma_3 = -\frac{E\alpha\Delta T}{5} = -\frac{2\cdot10^{5}\cdot12\cdot10^{-6}\cdot20}{5}
          = -9{,}6\ \mathrm{MPa}
          $$

          y $\sigma_1 = -2\sigma_3 = 19{,}2$ MPa, $\sigma_2 = 0$.
      - tipo: justificar
        pregunta: Ordena la resolución de examen. Una pieza es falsa.
        piezas:
          - texto: >-
              EFG, momentos respecto de E: $N_2 = 2P$, de tracción.
          - texto: >-
              ABCD gira $\theta$ alrededor de C; proyectando, $\Delta_3 = 2\Delta_1$,
              y como $L_1 = L_3$, $N_3 = 2N_1$.
          - texto: >-
              ABCD, momentos respecto de C: $\tfrac{\sqrt3}{2}N_1 + \sqrt3N_3 = 2P$,
              luego $N_1 = 4P/5\sqrt3 \approx 0{,}462P$ y $N_3 \approx 0{,}924P$.
          - texto: >-
              Manda la barra 2: $P_{\max} = 180\cdot400/2 = 36$ kN.
          - texto: >-
              Con la barra 3 a +20 °C y sin P: $\sigma_1 = 19{,}2$, $\sigma_2 = 0$
              y $\sigma_3 = -9{,}6$ MPa.
          - texto: >-
              Al calentar la barra 3 se cargan las tres, porque las dos piezas
              están unidas por la barra 2.
            trampa: true
            mensaje: |
              Sin P, EFG solo tiene la articulación de E y la barra 2: el
              equilibrio de EFG da $N_2 = 0$. EFG gira lo que haga falta para
              acompañar a D, y la barra 2 no se estira.
    resolucion: |
      **Geometría** (redibujada del Word: el PDF no dibuja las barras). Con C
      en el origen, $x$ a la derecha e $y$ hacia arriba: A $(-a, 0)$,
      D $(0, a)$, B $(0, 2a)$; E $(a, 0)$, F $(a, a)$, G $(a, 2a)$. La barra 1
      baja de A a un apoyo a un nivel $a$ por debajo, a 30° de la vertical;
      la 3 sube de B a un apoyo en la vertical de A, a 30° de la horizontal;
      la 2 es horizontal, de D a F. Las dos inclinadas miden
      $L_1 = L_3 = a/\cos30° = 2a/\sqrt3$, y $L_2 = a$. P es horizontal, hacia
      la derecha, en G. Convenio del tema 8: $N > 0$ de tracción y
      $\Delta L = NL/EA + \alpha\Delta T\,L$ (ecs. 8.3-8.9).

      **a) Las fuerzas.** EFG, momentos respecto de E:

      $$
      N_2\,a = P\cdot2a \;\Longrightarrow\; N_2 = 2P
      $$

      ABCD está articulada en C y sujeta por tres barras: hiperestática de
      grado 1. Momentos respecto de C (la barra 2 tira de D hacia F; la 1 y
      la 3, de A y de B hacia sus apoyos, con brazos $a\cos30°$ y
      $2a\cos30°$):

      $$
      \frac{\sqrt3}{2}a\,N_1 + \sqrt3\,a\,N_3 = a\,N_2 = 2Pa
      $$

      Compatibilidad: ABCD gira un ángulo pequeño $\theta$ (horario) alrededor
      de C. A sube $a\theta$ y B va hacia la derecha $2a\theta$; proyectando
      sobre cada barra (ecs. 8.10-8.12):

      $$
      \Delta_1 = a\theta\cos30°,\qquad \Delta_3 = 2a\theta\cos30°
      \;\Longrightarrow\; \Delta_3 = 2\Delta_1
      \;\Longrightarrow\; N_3 = 2N_1\quad(L_1 = L_3)
      $$

      $$
      N_1 = \frac{4P}{5\sqrt3} \approx 0{,}462P,\qquad
      N_2 = 2P,\qquad
      N_3 = \frac{8P}{5\sqrt3} \approx 0{,}924P
      $$

      Las tres de tracción.

      **b) La P máxima.** La más cargada es la barra 2:

      $$
      \frac{2P}{A} \le 180\ \mathrm{MPa}
      \;\Longrightarrow\;
      P_{\max} = \frac{180\cdot400}{2} = 36\,000\ \mathrm{N} = 36\ \mathrm{kN}
      $$

      **c) La barra 3 a +20 °C, sin P.** EFG solo tiene la barra 2 y la
      articulación de E: $N_2 = 0$. En ABCD,

      $$
      \frac{\sqrt3}{2}N_1 + \sqrt3\,N_3 = 0 \;\Longrightarrow\; N_1 = -2N_3
      $$

      $$
      \Delta_3 = 2\Delta_1:\quad \frac{N_3L}{EA} + \alpha\Delta T\,L = 2\,\frac{N_1L}{EA}
      \;\Longrightarrow\; 5N_3 = -EA\,\alpha\Delta T
      $$

      Con $E\alpha\Delta T = 2\cdot10^{5}\cdot12\cdot10^{-6}\cdot20 = 48$ MPa:

      $$
      \sigma_1 = \frac{2}{5}E\alpha\Delta T = 19{,}2\ \mathrm{MPa},\qquad
      \sigma_2 = 0,\qquad
      \sigma_3 = -\frac{1}{5}E\alpha\Delta T = -9{,}6\ \mathrm{MPa}
      $$

      La barra 3 queda comprimida (quería alargarse más de lo que ABCD le
      deja) y la 1, traccionada. Ninguna depende de $a$ ni de $A$.

      **Comprobación.** El motor del curso, con los dos sólidos rígidos, las
      dos articulaciones y las tres barras escritas por sus coordenadas, da
      las mismas $N_1$, $N_2$ y $N_3$; con sus fuerzas, los momentos de ABCD
      respecto de C suman cero, y sus alargamientos cumplen $\Delta_3 =
      2\Delta_1$. En c) da las mismas tres tensiones.
