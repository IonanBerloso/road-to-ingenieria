      </svg>
      <figcaption>

      Redibujada del enunciado. Como la galga mide en una recta y no en un sentido, la **a** está a 0° del eje x, la **b** a 60° y la **c** a −60°: es la roseta de la figura 3.8 de los apuntes **vista en un espejo**, con la b y la c cambiadas de sitio.

      </figcaption>
      </figure>

      **Notas nuestras.** Los apartados d) y e) se resuelven en el ejercicio
      siguiente. El enunciado no da ni $E$ ni $\nu$: $\varepsilon_z$ se deja en
      función de $\nu$, y donde hace falta un número se dice qué $\nu$ se ha
      tomado.
    pide: >-
      a) εx, εy, γxy y εz; b) las deformaciones y direcciones principales y los
      tres círculos de Mohr; c) εu y ½γu en la dirección del plano xy a 45° de x.
    pasos:
      - tipo: reconocer
        pregunta: |
          La roseta de los apuntes (figura 3.8) tiene la $a$ según $x$, la $b$
          a 120° y la $c$ a 240°. ¿Qué ángulos tienen las galgas de **esta**
          figura?
        opciones:
          - texto: >-
              $a$ a 0°, $b$ a 60° y $c$ a $-60°$: es la figura de los apuntes
              en un espejo, con $b$ y $c$ cambiadas
            correcta: true
            mensaje: |
              Eso es. Una galga mide en una recta, así que la $a$ dibujada
              hacia la izquierda está a 180° ≡ 0°. La $b$, arriba a la derecha,
              está a 60° (≡ 240°, la $c$ de los apuntes), y la $c$ de aquí está
              a $-60°$ ≡ 120° (la $b$ de los apuntes). Las fórmulas 3.66 se
              usan con las letras cambiadas, o se escribe 3.55 en cada galga.
          - texto: >-
              Las mismas que en los apuntes: $a$ a 0°, $b$ a 120° y $c$ a 240°
            mensaje: |
              En los apuntes la $b$ está arriba a la **izquierda**; aquí está
              arriba a la derecha. Con los ángulos de los apuntes, $\gamma_{xy}$
              sale con el signo cambiado y nada lo avisa.
          - texto: >-
              $a$ a 180°, $b$ a 60° y $c$ a 300°, y por eso $\varepsilon_a$ va con
              el signo cambiado
            mensaje: |
              Los ángulos son esos, pero la galga a 180° mide lo mismo que a 0°:
              $\cos^{2}$ y $\sin^{2}$ no cambian al sumar 180°. $\varepsilon_x =
              \varepsilon_a$ sin cambiar el signo.
      - tipo: calcular
        titulo: La distorsión γxy
        pregunta: |
          Escribe en las tres galgas
          $\varepsilon_\theta = \varepsilon_x\cos^{2}\theta + \varepsilon_y\sin^{2}\theta + \gamma_{xy}\sin\theta\cos\theta$,
          con $\theta$ medido desde $x$ en sentido antihorario. ¿Cuánto vale
          $\gamma_{xy}$, en unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '2.309401'
          tolerancia: 0.001
          formato: un número, en unidades de 10⁻⁶ (2.5 quiere decir 2,5·10⁻⁶)
        distractores:
          - valor: '-2.309401'
            mensaje: |
              Has usado la 3.66 de los apuntes, $\gamma_{xy} = 2(\varepsilon_c -
              \varepsilon_b)/\sqrt3$, con las letras de este examen. Aquí la
              $b$ está a 60°, no a 120°: la figura es la de los apuntes en un
              espejo, y $\gamma_{xy} = 2(\varepsilon_b - \varepsilon_c)/\sqrt3$.
          - valor: '1.154701'
            mensaje: |
              Eso es $\tfrac12\gamma_{xy}$, lo que va en el tensor. La pregunta
              pide la distorsión entera: el doble.
        pista: |
          Resta las ecuaciones de $b$ (60°) y $c$ ($-60°$):
          $\varepsilon_b - \varepsilon_c = \tfrac{\sqrt3}{2}\,\gamma_{xy}$.
        desarrollo: |
          $$
          \varepsilon_b = \tfrac14\varepsilon_x + \tfrac34\varepsilon_y + \tfrac{\sqrt3}{4}\gamma_{xy},
          \qquad
          \varepsilon_c = \tfrac14\varepsilon_x + \tfrac34\varepsilon_y - \tfrac{\sqrt3}{4}\gamma_{xy}
          $$

          Restando, $\gamma_{xy} = \dfrac{2(\varepsilon_b - \varepsilon_c)}{\sqrt3}
          = \dfrac{4}{\sqrt3}\cdot 10^{-6} \approx 2{,}309\cdot 10^{-6}$. Sumando,
          $\varepsilon_b + \varepsilon_c = \tfrac12\varepsilon_x + \tfrac32\varepsilon_y$,
          y con $\varepsilon_x = \varepsilon_a = 10^{-6}$ sale
          $\varepsilon_y = 10^{-6}$.
      - tipo: calcular
        titulo: La deformación principal mayor
        pregunta: |
          ¿Cuánto vale $\varepsilon_1$, la mayor deformación principal del
          plano xy, en unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '2.154701'
          tolerancia: 0.001
          formato: un número, en unidades de 10⁻⁶
        distractores:
          - valor: '3.309401'
            mensaje: |
              Has sumado al centro $\gamma_{xy}$ entero. El radio del círculo
              de Mohr de deformaciones lleva la **mitad**:
              $R = \sqrt{((\varepsilon_x-\varepsilon_y)/2)^{2} + (\gamma_{xy}/2)^{2}}$.
          - valor: '1.154701'
            mensaje: |
              Es el radio del círculo. La principal es el centro más el radio,
              $1 + 1{,}1547$.
        pista: |
          Centro $(\varepsilon_x + \varepsilon_y)/2 = 1$ y radio
          $\sqrt{0^{2} + (\gamma_{xy}/2)^{2}}$, en unidades de $10^{-6}$.
        desarrollo: |
          $$
          \varepsilon_{1,2} = 1 \pm \frac{2}{\sqrt3}
          \;\Longrightarrow\;
          \varepsilon_1 \approx 2{,}155\cdot 10^{-6},\qquad
          \varepsilon_2 \approx -0{,}155\cdot 10^{-6}
          $$
      - tipo: calcular
        titulo: La dirección principal 1
        pregunta: |
          ¿Qué ángulo, en grados, medido desde $x$ en sentido antihorario y
          entre −90° y 90°, forma la dirección de $\varepsilon_1$?
        respuesta:
          tipo: numero
          valor: '45'
          tolerancia: 0.1
          formato: un número, en grados
        distractores:
          - valor: '-45'
            mensaje: |
              Sale de $\gamma_{xy}$ con el signo cambiado, el de la roseta de
              los apuntes leída con estas letras. Con $\gamma_{xy} > 0$ la
              dirección de alargamiento máximo es la bisectriz del primer
              cuadrante: el ángulo recto $xy$ se cierra por ahí.
          - valor: '90'
            mensaje: |
              Eso es $2\theta_1$. La fórmula es $\tan 2\theta_1 =
              \gamma_{xy}/(\varepsilon_x - \varepsilon_y)$: el ángulo del círculo
              es el doble que el del sólido.
        pista: |
          $\tan 2\theta_1 = \gamma_{xy}/(\varepsilon_x - \varepsilon_y)$, y aquí
          el denominador es cero.
        desarrollo: |
          Con $\varepsilon_x = \varepsilon_y$ y $\gamma_{xy} > 0$, $2\theta_1 = 90°$
          y $\theta_1 = 45°$. La de $\varepsilon_2$ está a 135° (o $-45°$), y la
          tercera dirección principal es $z$, porque en tensión plana
          $\gamma_{xz} = \gamma_{yz} = 0$.
      - tipo: calcular
        titulo: La componente tangencial a 45°
        pregunta: |
          En la dirección $\vec u = (\cos 45°, \sin 45°, 0)$, ¿cuánto vale
          $\tfrac12\gamma_u$, en unidades de $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.001
          formato: un número, en unidades de 10⁻⁶
        distractores:
          - valor: '1.154701'
            mensaje: |
              Es $\tfrac12\gamma_{xy}$, como si a 45° se tuviera siempre la
              distorsión máxima. Eso pasa en los ejes **principales** girados
              45°; aquí los principales están a 45° de $x$, y la dirección
              pedida es justo una principal: no hay distorsión.
          - valor: '2.154701'
            mensaje: |
              Es el módulo del vector deformación $[\varepsilon]\vec u$, que
              aquí coincide con $\varepsilon_u$. Las componentes intrínsecas
              son dos: la proyección sobre $\vec u$, $\varepsilon_u$, y la
              perpendicular, $\tfrac12\gamma_u = \sqrt{|D|^{2} - \varepsilon_u^{2}}$,
              que sale cero.
        pista: |
          Calcula el vector deformación $[\varepsilon]\vec u$ y compáralo con
          $\vec u$. ¿Son paralelos?
        desarrollo: |
          $$
          [\varepsilon]\vec u = \frac{10^{-6}}{\sqrt2}
          \begin{pmatrix} 1 + \tfrac{2}{\sqrt3}\\[2pt] \tfrac{2}{\sqrt3} + 1 \\[2pt] 0\end{pmatrix}
          = \left(1 + \tfrac{2}{\sqrt3}\right)10^{-6}\,\vec u
          $$

          Es paralelo a $\vec u$: $\varepsilon_u = \varepsilon_1 \approx
          2{,}155\cdot10^{-6}$ y $\tfrac12\gamma_u = 0$. La dirección a 45° es la
          principal 1.
      - tipo: dibujar
        consigna: |
          En papel: **los tres círculos de Mohr de deformaciones**, con
          $\varepsilon$ en horizontal y $\tfrac12\gamma$ en vertical, las tres
          principales marcadas y los puntos de los ejes $x$ e $y$.
        comprueba:
          - punto: |
              **Tres círculos apoyados en el eje**, entre $\varepsilon_1$,
              $\varepsilon_2$ y $\varepsilon_3 = \varepsilon_z$.
            porque: |
              En el espacio hay tres principales y tres círculos; el de
              $\varepsilon_1$ y $\varepsilon_3$ envuelve a los otros dos. Con
              uno solo, el del plano, faltan $\varepsilon_z$ y la distorsión
              máxima de verdad.
          - punto: |
              **$\varepsilon_z$ negativa y a la izquierda de
              $\varepsilon_2$** si $\nu > 0{,}072$.
            porque: |
              $\varepsilon_z = -\dfrac{\nu}{1-\nu}(\varepsilon_x + \varepsilon_y)
              = -\dfrac{2\nu}{1-\nu}\cdot10^{-6}$, que con $\nu = 0{,}3$ vale
              $-0{,}857\cdot10^{-6}$. El enunciado no da $\nu$, y conviene
              decirlo en el folio.
          - punto: |
              **El círculo del plano xy centrado en $10^{-6}$ con radio
              $2/\sqrt3\cdot10^{-6}$**, y $x$, $y$ en su vertical del centro.
            porque: |
              Como $\varepsilon_x = \varepsilon_y$, los dos puntos están en la
              vertical del centro, a $\pm\tfrac12\gamma_{xy}$. Con
              $\gamma_{xy} > 0$, $x$ va abajo e $y$ arriba (convenio del tema
              2, pp. 24-26, con $\tau \to \tfrac12\gamma$).
        figura: |
          <svg viewBox="40 0 310 260" role="img" width="310" height="260"
               aria-labelledby="exerm2021-1par-5-mohr-dib-t exerm2021-1par-5-mohr-dib-d">
            <title id="exerm2021-1par-5-mohr-dib-t">Los tres círculos de Mohr de deformaciones, a escala con ν = 0,3</title>
            <desc id="exerm2021-1par-5-mohr-dib-d">Ejes ε horizontal y medio gamma vertical. Tres círculos apoyados en el eje: el mayor entre épsilon tres, que es épsilon z y vale unas menos ochenta y seis centésimas de micro, y épsilon uno, unas dos con quince; dentro, el de épsilon uno y épsilon dos, centrado en uno y de radio dos entre raíz de tres, y el pequeño entre épsilon tres y épsilon dos. Los puntos de los ejes x e y están en la vertical del centro uno, x abajo e y arriba.</desc>
            <line x1="66" y1="125" x2="325" y2="125" stroke="var(--ink)" stroke-width="1"/>
            <polygon points="332,125 325,128.2 325,121.9" fill="var(--ink)"/>
            <line x1="150" y1="240.5" x2="150" y2="9.5" stroke="var(--ink)" stroke-width="1"/>
            <polygon points="150,2.5 153.2,9.5 146.9,9.5" fill="var(--ink)"/>
            <text x="328" y="141" text-anchor="middle" font-size="13" font-style="italic" fill="var(--ink)">ε</text>
            <text x="158" y="13" text-anchor="start" font-size="13" font-style="italic" fill="var(--ink)">½γ</text>
            <circle cx="195.4" cy="125" r="105.4" fill="none" stroke="var(--d1)" stroke-width="1.6"/>
            <circle cx="220" cy="125" r="80.8" fill="none" stroke="var(--d3)" stroke-width="1.4"/>
            <circle cx="114.6" cy="125" r="24.6" fill="none" stroke="var(--d3)" stroke-width="1.4"/>
            <circle cx="300.8" cy="125" r="2.6" fill="var(--ink)"/><text x="300.8" y="141" text-anchor="middle" font-size="11" fill="var(--ink)">ε₁</text>
            <circle cx="139.2" cy="125" r="2.6" fill="var(--ink)"/><text x="147.2" y="141" text-anchor="middle" font-size="11" fill="var(--ink)">ε₂</text>
            <circle cx="90" cy="125" r="2.6" fill="var(--ink)"/><text x="64" y="141" text-anchor="middle" font-size="11" fill="var(--ink)">ε₃ = ε<tspan font-size="9" dy="2">z</tspan></text>
            <circle cx="220" cy="205.8" r="3" fill="var(--live)"/><text x="228" y="209.8" text-anchor="start" font-size="12" font-style="italic" fill="var(--live)">x</text>
            <circle cx="220" cy="44.2" r="3" fill="var(--live)"/><text x="228" y="48.2" text-anchor="start" font-size="12" font-style="italic" fill="var(--live)">y</text>
            <line x1="220" y1="205.8" x2="220" y2="44.2" stroke="var(--live)" stroke-width="1" stroke-dasharray="4 3"/>
          </svg>
      - tipo: justificar
        pregunta: Ordena la resolución de a), b) y c). Una pieza es falsa.
        piezas:
          - texto: >-
              Las galgas están a 0°, 60° y $-60°$; de ahí $\varepsilon_x =
              \varepsilon_y = 10^{-6}$ y $\gamma_{xy} = 4/\sqrt3\cdot10^{-6}$.
          - texto: >-
              En tensión plana $\sigma_z = 0$, así que $\varepsilon_z =
              -\nu(\varepsilon_x + \varepsilon_y)/(1-\nu)$, que no es cero.
          - texto: >-
              Las principales del plano son $(1 \pm 2/\sqrt3)\cdot10^{-6}$ a 45° y
              135° de $x$, y la tercera es $\varepsilon_z$, según $z$.
          - texto: >-
              La dirección a 45° de $x$ en el plano xy es la principal 1:
              $\varepsilon_u = \varepsilon_1$ y $\tfrac12\gamma_u = 0$.
          - texto: >-
              En tensión plana también $\varepsilon_z = 0$, así que el tensor
              de deformaciones tiene la tercera fila y la tercera columna
              nulas.
            trampa: true
            mensaje: |
              Lo que es nulo en tensión plana es $\sigma_z$, no $\varepsilon_z$.
              Por Poisson el sólido se adelgaza en $z$:
              $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E$. Con
              $\varepsilon_z = 0$ sería deformación plana, y el tensor de
              tensiones cambiaría.
    resolucion: |
      **La roseta.** La galga $a$ está sobre el eje $x$ (dibujada hacia la
      izquierda, 180° ≡ 0°), la $b$ a 60° y la $c$ a $-60°$. Es la roseta a
      120° de los apuntes (tema 3, figura 3.8 y ecs. 3.65-3.66, p. 21) **vista
      en un espejo**: allí la $b$ está a 120° y la $c$ a 240°. Escribiendo la
      ec. 3.55 en cada galga:

      $$
      \varepsilon_a = \varepsilon_x,\qquad
      \varepsilon_{b,c} = \tfrac14\varepsilon_x + \tfrac34\varepsilon_y \pm \tfrac{\sqrt3}{4}\gamma_{xy}
      $$

      $$
      \varepsilon_x = 10^{-6},\qquad
      \varepsilon_y = \frac{2(\varepsilon_b + \varepsilon_c) - \varepsilon_a}{3} = 10^{-6},\qquad
      \gamma_{xy} = \frac{2(\varepsilon_b - \varepsilon_c)}{\sqrt3} = \frac{4}{\sqrt3}\cdot10^{-6}
      $$

      **a) El tensor.** En tensión plana $\sigma_z = 0$ y
      $\gamma_{xz} = \gamma_{yz} = 0$, pero $\varepsilon_z$ no es cero:
      $\varepsilon_z = -\dfrac{\nu}{1-\nu}(\varepsilon_x + \varepsilon_y)$
      (tema 4, p. 9). El enunciado no da $\nu$, y se deja indicado:

      $$
      [\varepsilon]_{OXYZ} = 10^{-6}
      \begin{pmatrix}
      1 & \tfrac{2}{\sqrt3} & 0\\[2pt]
      \tfrac{2}{\sqrt3} & 1 & 0\\[2pt]
      0 & 0 & -\tfrac{2\nu}{1-\nu}
      \end{pmatrix}
      \;\approx\; 10^{-6}
      \begin{pmatrix}
      1 & 1{,}155 & 0\\
      1{,}155 & 1 & 0\\
      0 & 0 & -0{,}857
      \end{pmatrix}\ \text{con } \nu = 0{,}3
      $$

      **b) Principales.** El círculo de Mohr del plano tiene centro
      $(\varepsilon_x + \varepsilon_y)/2 = 10^{-6}$ y radio
      $\tfrac12\gamma_{xy} = 2/\sqrt3\cdot10^{-6}$:

      $$
      \varepsilon_1 = \left(1 + \tfrac{2}{\sqrt3}\right)10^{-6} \approx 2{,}155\cdot10^{-6},
      \qquad
      \varepsilon_2 = \left(1 - \tfrac{2}{\sqrt3}\right)10^{-6} \approx -0{,}155\cdot10^{-6},
      \qquad
      \varepsilon_3 = \varepsilon_z
      $$

      Con $\nu = 0{,}3$, $\varepsilon_z \approx -0{,}857\cdot10^{-6}$, y el orden
      $\varepsilon_1 > \varepsilon_2 > \varepsilon_z$ vale para cualquier
      $\nu > 0{,}072$. Las direcciones: $\tan 2\theta_1 = \gamma_{xy}/(\varepsilon_x -
      \varepsilon_y) \to \infty$, así que $\varepsilon_1$ va a **45°** de $x$,
      $\varepsilon_2$ a **135°**, y $\varepsilon_3$ según **z**:

      $$
      \vec u_1 = \left(\tfrac{1}{\sqrt2}, \tfrac{1}{\sqrt2}, 0\right),\qquad
      \vec u_2 = \left(-\tfrac{1}{\sqrt2}, \tfrac{1}{\sqrt2}, 0\right),\qquad
      \vec u_3 = (0, 0, 1)
      $$

      <figure class="figura-examen">
      <svg viewBox="40 0 310 260" role="img" width="310" height="260"
           aria-labelledby="exerm2021-1par-5-mohr-t exerm2021-1par-5-mohr-d">
        <title id="exerm2021-1par-5-mohr-t">Los tres círculos de Mohr de deformaciones, a escala con ν = 0,3</title>
        <desc id="exerm2021-1par-5-mohr-d">Ejes ε horizontal y medio gamma vertical. Tres círculos apoyados en el eje: el mayor entre épsilon tres, que es épsilon z y vale unas menos ochenta y seis centésimas de micro, y épsilon uno, unas dos con quince; dentro, el de épsilon uno y épsilon dos, centrado en uno y de radio dos entre raíz de tres, y el pequeño entre épsilon tres y épsilon dos. Los puntos de los ejes x e y están en la vertical del centro uno, x abajo e y arriba.</desc>
        <line x1="66" y1="125" x2="325" y2="125" stroke="var(--ink)" stroke-width="1"/>
        <polygon points="332,125 325,128.2 325,121.9" fill="var(--ink)"/>
        <line x1="150" y1="240.5" x2="150" y2="9.5" stroke="var(--ink)" stroke-width="1"/>
        <polygon points="150,2.5 153.2,9.5 146.9,9.5" fill="var(--ink)"/>
        <text x="328" y="141" text-anchor="middle" font-size="13" font-style="italic" fill="var(--ink)">ε</text>
        <text x="158" y="13" text-anchor="start" font-size="13" font-style="italic" fill="var(--ink)">½γ</text>
        <circle cx="195.4" cy="125" r="105.4" fill="none" stroke="var(--d1)" stroke-width="1.6"/>
        <circle cx="220" cy="125" r="80.8" fill="none" stroke="var(--d3)" stroke-width="1.4"/>
        <circle cx="114.6" cy="125" r="24.6" fill="none" stroke="var(--d3)" stroke-width="1.4"/>
        <circle cx="300.8" cy="125" r="2.6" fill="var(--ink)"/><text x="300.8" y="141" text-anchor="middle" font-size="11" fill="var(--ink)">ε₁</text>
        <circle cx="139.2" cy="125" r="2.6" fill="var(--ink)"/><text x="147.2" y="141" text-anchor="middle" font-size="11" fill="var(--ink)">ε₂</text>
        <circle cx="90" cy="125" r="2.6" fill="var(--ink)"/><text x="64" y="141" text-anchor="middle" font-size="11" fill="var(--ink)">ε₃ = ε<tspan font-size="9" dy="2">z</tspan></text>
        <circle cx="220" cy="205.8" r="3" fill="var(--live)"/><text x="228" y="209.8" text-anchor="start" font-size="12" font-style="italic" fill="var(--live)">x</text>
        <circle cx="220" cy="44.2" r="3" fill="var(--live)"/><text x="228" y="48.2" text-anchor="start" font-size="12" font-style="italic" fill="var(--live)">y</text>
        <line x1="220" y1="205.8" x2="220" y2="44.2" stroke="var(--live)" stroke-width="1" stroke-dasharray="4 3"/>
      </svg>
      <figcaption>

      A escala en unidades de 10⁻⁶. La posición de **ε₃ = ε<sub>z</sub>** depende de ν, que el enunciado no da: aquí se ha tomado **ν = 0,3** (supuesto nuestro). Con cualquier ν mayor que 0,072 el orden es el mismo. El punto **x** va abajo y el **y** arriba porque γxy > 0 (convenio de los apuntes del tema 3, p. 18: la y gira en sentido horario).

      </figcaption>
      </figure>

      **c) La dirección a 45°.** $\vec u = (\cos45°, \sin45°, 0)$ es justo la
      principal 1:

      $$
      [\varepsilon]\vec u = \varepsilon_1\,\vec u
      \;\Longrightarrow\;
      \varepsilon_u = \varepsilon_1 \approx 2{,}155\cdot10^{-6},\qquad
      \tfrac12\gamma_u = 0
      $$

      Si se lee «45° con el eje x» hacia el otro lado ($-45°$), la dirección es
      la principal 2: $\varepsilon_u = \varepsilon_2 \approx -0{,}155\cdot10^{-6}$
      y $\tfrac12\gamma_u = 0$ también. Ninguna de las dos depende de $\nu$,
      porque $\vec u$ es perpendicular a $z$.

      **Comprobación.** Con el motor del curso, la roseta resuelta por Cramer
      con las galgas a 0°, 60° y $-60°$ da lo mismo que las fórmulas cerradas,
      y las galgas recalculadas desde el tensor devuelven $10^{-6}$,
      $2\cdot10^{-6}$ y 0; la traza $\varepsilon_1 + \varepsilon_2 = 2\cdot10^{-6}
      = \varepsilon_x + \varepsilon_y$.

  # ── Problema 1, apartados d) y e) · Hooke en tensión plana y la τ máxima
  #    de verdad, la del círculo mayor.
  - id: exerm2021-1par-5-las-tensiones-que-causan-la-roseta
    titulo: Las tensiones que causan las deformaciones de la roseta, y la cortadura máxima
    fuente: >-
      Problema 1, apartados d) y e) · Primer parcial del 20 de noviembre de
      2020 · Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). El problema vale 2 puntos, sin reparto por
      apartados. El enunciado no da E ni ν: las cifras numéricas usan un E y un
      ν supuestos, dichos en el enunciado. El examen no publica resolución; el
      desarrollo es nuestro.
    nivel: examen
    enunciado: |
      (2p) En un estado tensional plano, las deformaciones experimentales en
      un punto del sólido elástico se miden con tres galgas extensométricas
      colocadas como se muestra en la figura.

      $$
      \varepsilon_a = 10^{-6}\ ;\ \varepsilon_b = 2\cdot 10^{-6};\ \varepsilon_c = 0
      $$

      Determinar:

      **a)** El tensor de deformaciones $[\varepsilon]_{OXYZ}$

      **b)** Deformaciones principales y direcciones principales en el espacio.
      Representar los círculos de Mohr.

      **c)** Calcular las componentes intrínsecas del vector deformación en una
      dirección perpendicular al eje z y que forma 45 º con el eje x.

      **d)** El tensor de tensiones $[\sigma]_{OXYZ}$ que representa el estado de
      tensiones causante de las deformaciones dadas.

      **e)** Determinar la tensión de cortadura máxima.

      **Notas nuestras.** La figura y los apartados a), b) y c) están en el
      ejercicio anterior: $\varepsilon_x = \varepsilon_y = 10^{-6}$ y
      $\gamma_{xy} = 4/\sqrt3\cdot10^{-6}$. El enunciado no da ni $E$ ni $\nu$,
      y d) los necesita. Se resuelve en función de $E$ y $\nu$ y, para poder
      dar números, con $E = 2\cdot10^{5}$ MPa —el del problema 3 de este mismo
      examen— y $\nu = 0{,}3$. **Los dos valores son supuestos nuestros**, no
      del examen.
    pide: >-
      d) σx, σy y τxy (σz y las otras tangenciales son nulas); e) la tensión
      tangencial máxima del punto.
    pasos:
      - tipo: reconocer
        pregunta: |
          De las galgas sale $\varepsilon_x$, $\varepsilon_y$ y $\gamma_{xy}$.
          ¿Qué ley da las tensiones?
        opciones:
          - texto: >-
              La de Hooke en tensión plana: $\sigma_x = \frac{E}{1-\nu^{2}}(\varepsilon_x
              + \nu\varepsilon_y)$, lo mismo para $\sigma_y$, y
              $\tau_{xy} = G\gamma_{xy}$
            correcta: true
            mensaje: |
              Eso es (apuntes del tema 4, ecs. 4.24-4.25). Es Hooke despejado
              con la condición $\sigma_z = 0$, que elimina $\varepsilon_z$.
          - texto: >-
              $\sigma_x = E\varepsilon_x$ y $\sigma_y = E\varepsilon_y$, una por
              una
            mensaje: |
              Eso es Hooke en tracción simple. Con dos tensiones a la vez cada
              una acorta en la otra dirección por Poisson, y despejar el
              sistema da el factor $1/(1-\nu^{2})$ y el término cruzado.
          - texto: >-
              $\sigma = 2G\varepsilon + \lambda e$ con $\varepsilon_z = 0$
            mensaje: |
              Con $\varepsilon_z = 0$ sería deformación plana y saldría una
              $\sigma_z$ que el enunciado prohíbe: dice «estado tensional
              plano». Con Lamé hay que meter la $\varepsilon_z$ de verdad,
              $-\nu(\varepsilon_x+\varepsilon_y)/(1-\nu)$.
      - tipo: calcular
        titulo: La tensión normal σx
        pregunta: |
          Con $E = 2\cdot10^{5}$ MPa y $\nu = 0{,}3$ (los supuestos de la nota),
          ¿cuánto vale $\sigma_x$, en MPa?
        respuesta:
          tipo: numero
          valor: '0.285714'
          tolerancia: 0.001
          formato: un número, en MPa
        distractores:
          - valor: '0.2'
            mensaje: |
              Es $E\varepsilon_x$, Hooke uniaxial. La tensión en $y$ también
              estira en $x$ a través de Poisson: falta el término
              $\nu\varepsilon_y$ y el factor $1/(1-\nu^{2})$.
          - valor: '0.21978'
            mensaje: |
              Has puesto el factor $E/(1-\nu^{2})$ pero solo con
              $\varepsilon_x$: falta $+\nu\varepsilon_y$ dentro del paréntesis.
        pista: |
          $\sigma_x = \frac{E}{1-\nu^{2}}(\varepsilon_x + \nu\varepsilon_y)$, y con
          $\varepsilon_x = \varepsilon_y$ queda $\frac{E}{1-\nu}\varepsilon_x$.
        desarrollo: |
          $$
          \sigma_x = \sigma_y = \frac{E}{1-\nu^{2}}(1+\nu)\cdot10^{-6}
          = \frac{E}{1-\nu}\cdot10^{-6} = \frac{2\cdot10^{5}}{0{,}7}\cdot10^{-6}
          \approx 0{,}286\ \mathrm{MPa}
          $$
      - tipo: calcular
        titulo: La tangencial τxy
        pregunta: |
          Con los mismos $E$ y $\nu$, ¿cuánto vale $\tau_{xy}$, en MPa?
        respuesta:
          tipo: numero
          valor: '0.177646'
          tolerancia: 0.001
          formato: un número, en MPa
        distractores:
          - valor: '0.088823'
            mensaje: |
              Has multiplicado $G$ por $\tfrac12\gamma_{xy}$, el término del
              tensor. La ley es $\tau_{xy} = G\gamma_{xy}$ con la distorsión
              entera (o $2G$ por el término del tensor).
          - valor: '0.46188'
            mensaje: |
              Has usado $E$ en lugar de $G$. La tangencial va con el módulo de
              cortadura, $G = E/2(1+\nu) \approx 76\,923$ MPa.
        pista: |
          $G = \dfrac{E}{2(1+\nu)}$ y $\gamma_{xy} = \dfrac{4}{\sqrt3}\cdot10^{-6}$.
        desarrollo: |
          $$
          \tau_{xy} = G\gamma_{xy} = \frac{E}{2(1+\nu)}\cdot\frac{4}{\sqrt3}\cdot10^{-6}
          = \frac{2E}{\sqrt3\,(1+\nu)}\cdot10^{-6} \approx 0{,}178\ \mathrm{MPa}
          $$
      - tipo: calcular
        titulo: La cortadura máxima
        pregunta: |
          ¿Cuánto vale la tensión tangencial máxima del punto, en MPa?
        respuesta:
          tipo: numero
          valor: '0.23168'
          tolerancia: 0.001
          formato: un número, en MPa
        distractores:
          - valor: '0.177646'
            mensaje: |
              Es el radio del círculo de Mohr del plano xy, la tangencial
              máxima **en ese plano**. Pero las dos principales del plano son
              positivas y la tercera es $\sigma_z = 0$: el círculo mayor es el
              de $\sigma_1$ y 0, y $\tau_{\max} = \sigma_1/2$.
          - valor: '0.463361'
            mensaje: |
              Es $\sigma_1$, el diámetro del círculo mayor. La tangencial
              máxima es su radio, $(\sigma_1 - \sigma_3)/2$.
        pista: |
          Centro $(\sigma_x+\sigma_y)/2 = \sigma_x$ y radio $\tau_{xy}$:
          $\sigma_{1,2} = \sigma_x \pm \tau_{xy}$. Ordena las tres principales,
          con el 0 de $z$.
        desarrollo: |
          $$
          \sigma_1 = 0{,}286 + 0{,}178 = 0{,}463,\qquad
          \sigma_2 = 0{,}286 - 0{,}178 = 0{,}108,\qquad
          \sigma_3 = \sigma_z = 0
          $$

          $$
          \tau_{\max} = \frac{\sigma_1 - \sigma_3}{2} = \frac{0{,}463}{2}
          \approx 0{,}232\ \mathrm{MPa}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución de d) y e). Una pieza es falsa.
        piezas:
          - texto: >-
              En tensión plana, $\sigma_x = \frac{E}{1-\nu^{2}}(\varepsilon_x +
              \nu\varepsilon_y)$, $\sigma_y$ igual cambiando los papeles, y
              $\tau_{xy} = G\gamma_{xy}$; $\sigma_z = \tau_{xz} = \tau_{yz} = 0$.
          - texto: >-
              Con $\varepsilon_x = \varepsilon_y$, $\sigma_x = \sigma_y =
              E\cdot10^{-6}/(1-\nu)$, y el círculo del plano tiene radio
              $\tau_{xy}$.
          - texto: >-
              Las principales del plano, $\sigma_x \pm \tau_{xy}$, son las dos
              positivas (porque $\nu > 0{,}072$), y la tercera es $\sigma_z = 0$.
          - texto: >-
              La cortadura máxima es el radio del círculo mayor,
              $\sigma_1/2$, en planos a 45° de la dirección 1 y de $z$.
          - texto: >-
              La cortadura máxima es el radio del círculo del plano xy, porque
              el estado es plano y no hay nada fuera de ese plano.
            trampa: true
            mensaje: |
              El estado es plano en tensiones, pero el punto sigue teniendo
              tres principales, una de ellas el 0 de $z$. Con las dos del
              plano positivas, el círculo mayor es el de $\sigma_1$ y 0, y la
              cortadura máxima vive en planos que no contienen a $z$.
    resolucion: |
      **d) El tensor de tensiones.** Hooke en tensión plana (apuntes del tema
      4, ecs. 4.24-4.25), con $\varepsilon_x = \varepsilon_y = 10^{-6}$ y
      $\gamma_{xy} = 4/\sqrt3\cdot10^{-6}$:

      $$
      \sigma_x = \sigma_y = \frac{E}{1-\nu^{2}}(1+\nu)\cdot10^{-6} = \frac{E}{1-\nu}\cdot10^{-6},
      \qquad
      \tau_{xy} = \frac{E}{2(1+\nu)}\cdot\frac{4}{\sqrt3}\cdot10^{-6} = \frac{2E}{\sqrt3\,(1+\nu)}\cdot10^{-6}
      $$

      $$
      [\sigma]_{OXYZ} = E\cdot10^{-6}
      \begin{pmatrix}
      \tfrac{1}{1-\nu} & \tfrac{2}{\sqrt3(1+\nu)} & 0\\[2pt]
      \tfrac{2}{\sqrt3(1+\nu)} & \tfrac{1}{1-\nu} & 0\\[2pt]
      0 & 0 & 0
      \end{pmatrix}
      $$

      Con los supuestos de la nota, $E = 2\cdot10^{5}$ MPa y $\nu = 0{,}3$:

      $$
      [\sigma]_{OXYZ} \approx
      \begin{pmatrix}
      0{,}286 & 0{,}178 & 0\\
      0{,}178 & 0{,}286 & 0\\
      0 & 0 & 0
      \end{pmatrix}\ \mathrm{MPa}
      $$

      Son tensiones diminutas porque las deformaciones lo son: $10^{-6}$ es
      una micra por metro.

      **e) La cortadura máxima.** En el plano, centro $\sigma_x$ y radio
      $\tau_{xy}$:

      $$
      \sigma_1 = \sigma_x + \tau_{xy} \approx 0{,}463,\qquad
      \sigma_2 = \sigma_x - \tau_{xy} \approx 0{,}108,\qquad
      \sigma_3 = \sigma_z = 0\ \ \mathrm{MPa}
      $$

      Las dos del plano son positivas, así que el círculo mayor es el de
      $\sigma_1$ y $\sigma_3 = 0$ (apuntes del tema 2, pp. 27-29). En función
      de $E$ y $\nu$, esto vale para $\nu > 0{,}072$: para $\nu$ menor,
      $\sigma_2 < 0$ y $\tau_{\max}$ sería el radio del plano:

      $$
      \tau_{\max} = \frac{\sigma_1 - \sigma_3}{2}
      = \frac{E\cdot10^{-6}}{2}\left(\frac{1}{1-\nu} + \frac{2}{\sqrt3\,(1+\nu)}\right)
      \approx 0{,}232\ \mathrm{MPa}
      $$

      en los planos que forman 45° con la dirección 1 y con $z$. El radio del
      círculo del plano, $\tau_{xy} \approx 0{,}178$ MPa, es menor: es la
      trampa del apartado.

      **Comprobación.** Por el otro camino, Hooke sobre las deformaciones
      principales, $\sigma_1 = \frac{E}{1-\nu^{2}}(\varepsilon_1 + \nu\varepsilon_2)$
      da el mismo 0,463 MPa; y con el motor del curso, el tensor completo con
      $\varepsilon_z = -2\nu/(1-\nu)\cdot10^{-6}$ devuelve $\sigma_z = 0$, que es
      lo que tiene que pasar en tensión plana. Con otro $\nu$ cambian las
      cifras, no el método: con $\nu = 0{,}25$, $\tau_{\max} \approx 0{,}226$ MPa.

