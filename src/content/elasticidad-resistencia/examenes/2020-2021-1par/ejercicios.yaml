ejercicios:
  # ── Teoría · pregunta 2 · el plano con σn = τn = 1 MPa en ejes principales y
  #    la Sn máxima con las dos componentes iguales. Todo sale del Mohr 3D.
  #    Las preguntas 1 y 3 de la teoría son copia literal de las del parcial 1
  #    de 2022-2023 y no se resuelven aquí: ver examen.yaml.
  - id: exerm2021-1par-2-el-plano-de-sigma-y-tau-iguales
    titulo: El plano con σn = τn = 1 MPa, y la mayor Sn con las dos componentes iguales
    fuente: >-
      Pregunta 2 de la hoja de teoría · Primer parcial del 20 de noviembre de
      2020 · Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Se conserva «solido» sin tilde. El
      examen no publica resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      (1p) Conocidos los valores de las tensiones principales en un punto del
      solido elástico $\sigma_1=3\,\mathrm{MPa}$, $\sigma_2=2\,\mathrm{MPa}$ y
      $\sigma_3=0\,\mathrm{MPa}$, determinar en el sistema de referencia de las
      direcciones principales, el plano en el cual las componentes intrínsecas
      de la tensión sean $\sigma_n=1\,\mathrm{MPa}$ y $\tau_n=1\,\mathrm{MPa}$.

      Determinar el valor de la tensión $S_n$ máxima de entre todos los planos
      que tienen componentes intrínsecas de igual módulo.
    pide: >-
      La normal del plano con σn = τn = 1 MPa, en ejes principales, y la mayor
      Sn entre los planos con |σn| = |τn|.
    pasos:
      - tipo: reconocer
        pregunta: |
          En ejes principales la normal es $(n_1, n_2, n_3)$. ¿Qué ecuaciones
          dan el plano con $\sigma_n = \tau_n = 1\,\mathrm{MPa}$?
        opciones:
          - texto: >-
              $\sigma_n = \sum \sigma_i n_i^{2}$, $|S|^{2} = \sum \sigma_i^{2} n_i^{2}
              = \sigma_n^{2} + \tau_n^{2}$ y $\sum n_i^{2} = 1$: tres ecuaciones
              lineales en $n_1^{2}, n_2^{2}, n_3^{2}$
            correcta: true
            mensaje: |
              Eso es. En ejes principales el vector tensión es
              $(\sigma_1 n_1, \sigma_2 n_2, \sigma_3 n_3)$, y las tres incógnitas
              buenas son los **cuadrados** de los cosenos: el sistema es lineal
              en ellos (apuntes del tema 2, ecs. 2.14 y 2.16).
          - texto: >-
              $\sigma_n = \sum \sigma_i n_i$ y $\tau_n = \sigma_1 - \sigma_3$, sin más
            mensaje: |
              La normal sale al **cuadrado**: $\sigma_n = n^{t}[\sigma]n$. Y
              $(\sigma_1 - \sigma_3)/2$ es la tangencial **máxima** del punto,
              no la de un plano cualquiera.
          - texto: >-
              Basta con el círculo de Mohr de $\sigma_1$ y $\sigma_3$, el mayor:
              el plano es el del punto $(1, 1)$ sobre ese círculo
            mensaje: |
              El punto $(1, 1)$ no está sobre el círculo mayor (centro 1,5,
              radio 1,5): dista de su centro $\sqrt{1{,}25}$. Los planos con
              $n_2 = 0$ son los del círculo 1-3; este plano es de otro.
      - tipo: calcular
        titulo: El plano de la primera parte
        pregunta: |
          Resuelve el sistema. ¿Qué ángulo agudo, en grados, forma la normal
          del plano con la dirección principal 2?
        respuesta:
          tipo: numero
          valor: '45'
          tolerancia: 0.1
          formato: un número, en grados
        distractores:
          - valor: '60'
            mensaje: |
              Has sacado bien $n_2^{2} = 1/2$ y luego has tomado $n_2 = 1/2$,
              sin la raíz. El coseno es $1/\sqrt{2}$, y el ángulo, 45°.
          - valor: '90'
            mensaje: |
              Ese es el ángulo con la dirección **1**: $n_1 = 0$. Con la 2 y con
              la 3 forma 45°, porque $n_2^{2} = n_3^{2} = 1/2$.
        pista: |
          $3n_1^{2} + 2n_2^{2} = 1$ y $9n_1^{2} + 4n_2^{2} = 1^{2} + 1^{2} = 2$.
          Multiplica la primera por 2 y réstala.
        desarrollo: |
          $$
          \begin{aligned}
          3n_1^{2} + 2n_2^{2} &= 1\\
          9n_1^{2} + 4n_2^{2} &= 2
          \end{aligned}
          \;\Longrightarrow\; 3n_1^{2} = 0,\quad n_2^{2} = \tfrac12,\quad
          n_3^{2} = 1 - n_1^{2} - n_2^{2} = \tfrac12
          $$

          La normal es $\left(0,\ \pm\tfrac{1}{\sqrt2},\ \pm\tfrac{1}{\sqrt2}\right)$:
          perpendicular a la dirección 1 y a 45° de la 2 y de la 3. Son cuatro
          normales, dos planos (cada uno con sus dos caras).
      - tipo: calcular
        titulo: La Sn máxima con σn = τn
        pregunta: |
          Entre los planos con $|\sigma_n| = |\tau_n|$, ¿cuánto vale la mayor
          $S_n$, en MPa?
        respuesta:
          tipo: numero
          valor: '2.12132'
          tolerancia: 0.002
          formato: un número, en MPa
        distractores:
          - valor: '1.41421'
            mensaje: |
              Es la $S_n$ del plano de la primera parte, $\sqrt{1^{2}+1^{2}}$.
              Ese plano tiene las componentes iguales, pero no es el de mayor
              $S_n$: sobre la recta $\tau = \sigma$ del plano de Mohr se puede
              subir hasta el círculo mayor.
          - valor: '1.5'
            mensaje: |
              Has dado $\sigma_n$ (o $\tau_n$) del punto bueno, el más alto del
              círculo mayor. La pregunta pide el módulo del vector tensión,
              $S_n = \sqrt{\sigma_n^{2} + \tau_n^{2}} = 1{,}5\sqrt2$.
          - valor: '3'
            mensaje: |
              $S_n = \sigma_1 = 3$ es la mayor de **todas**, pero en ese plano
              $\tau_n = 0$: no tiene las dos componentes iguales.
        pista: |
          En el plano de Mohr los puntos posibles están dentro del círculo
          mayor y fuera de los otros dos. ¿Dónde corta la recta $\tau = \sigma$
          al círculo de centro 1,5 y radio 1,5?
        desarrollo: |
          Con $\sigma_n = \tau_n = s$, $S_n = s\sqrt2$, así que hay que subir $s$
          todo lo posible por la recta $\tau = \sigma$. El límite es el círculo
          mayor:

          $$
          (s - 1{,}5)^{2} + s^{2} = 1{,}5^{2} \;\Longrightarrow\; 2s^{2} - 3s = 0
          \;\Longrightarrow\; s = 1{,}5
          $$

          El punto $(1{,}5;\ 1{,}5)$ es el más alto del círculo mayor, y está
          fuera de los otros dos. Ahí

          $$
          S_n = 1{,}5\sqrt2 = \frac{3}{\sqrt2} \approx 2{,}121\ \mathrm{MPa}
          $$

          y su normal es $\left(\pm\tfrac{1}{\sqrt2},\ 0,\ \pm\tfrac{1}{\sqrt2}\right)$,
          la bisectriz de las direcciones 1 y 3.
      - tipo: justificar
        pregunta: Ordena la respuesta de examen. Una pieza es falsa.
        piezas:
          - texto: >-
              En ejes principales, $\sigma_n = \sum \sigma_i n_i^{2}$ y
              $|S|^{2} = \sum \sigma_i^{2} n_i^{2} = \sigma_n^{2} + \tau_n^{2}$.
          - texto: >-
              Con $\sigma_n = \tau_n = 1$ sale $n_1 = 0$ y
              $n_2^{2} = n_3^{2} = 1/2$: el punto $(1, 1)$ está sobre el
              círculo 2-3, de centro 1 y radio 1.
          - texto: >-
              Con $\sigma_n = \tau_n$, $S_n = \sigma_n\sqrt2$, y el mayor
              $\sigma_n$ sobre la recta $\tau = \sigma$ dentro de la zona
              posible es el punto más alto del círculo mayor, $(1{,}5;\ 1{,}5)$.
          - texto: >-
              Luego $S_n = 1{,}5\sqrt2 \approx 2{,}12$ MPa, en el plano bisector
              de las direcciones 1 y 3.
          - texto: >-
              La mayor $S_n$ con las componentes iguales es la del primer plano,
              $\sqrt2$, porque es el único con $\sigma_n = \tau_n$.
            trampa: true
            mensaje: |
              Hay infinitos planos con $\sigma_n = \tau_n$: todos los de la
              recta $\tau = \sigma$ que caen dentro de la zona de Mohr, desde
              $(1, 1)$ hasta $(1{,}5;\ 1{,}5)$. El primero es solo uno de ellos.
    resolucion: |
      **Las ecuaciones.** En el sistema de las direcciones principales el
      vector tensión es $S = (\sigma_1 n_1,\ \sigma_2 n_2,\ \sigma_3 n_3)$, y
      (apuntes del tema 2, ecs. 2.14 y 2.16):

      $$
      \sigma_n = \sum \sigma_i n_i^{2},\qquad
      \sigma_n^{2} + \tau_n^{2} = |S|^{2} = \sum \sigma_i^{2} n_i^{2},\qquad
      \sum n_i^{2} = 1
      $$

      **El plano con $\sigma_n = \tau_n = 1$ MPa.** Con $\sigma_3 = 0$:

      $$
      3n_1^{2} + 2n_2^{2} = 1,\qquad 9n_1^{2} + 4n_2^{2} = 2
      \;\Longrightarrow\; n_1 = 0,\quad n_2^{2} = n_3^{2} = \tfrac12
      $$

      $$
      \vec n = \left(0,\ \pm\tfrac{1}{\sqrt2},\ \pm\tfrac{1}{\sqrt2}\right)
      $$

      Es un plano que contiene a la dirección principal 1 y forma 45° con la
      2 y la 3. En Mohr se ve igual: el punto $(1, 1)$ cae justo **sobre** el
      círculo de $\sigma_2$ y $\sigma_3$ (centro 1, radio 1), que es el de los
      planos con $n_1 = 0$.

      **La mayor $S_n$ con las componentes de igual módulo.** Como todas las
      principales son $\geq 0$, $\sigma_n \geq 0$ en cualquier plano, y la
      condición es $\tau_n = \sigma_n = s$, con $S_n = s\sqrt2$. Hay que llevar
      $s$ lo más lejos posible por la recta $\tau = \sigma$ sin salir de la
      zona de Mohr, y el borde es el círculo mayor (centro 1,5, radio 1,5):

      $$
      (s - 1{,}5)^{2} + s^{2} = 2{,}25 \;\Longrightarrow\; s = 1{,}5
      $$

      $$
      S_{n,\max} = 1{,}5\sqrt2 = \frac{3}{\sqrt2} \approx 2{,}12\ \mathrm{MPa},
      \qquad \vec n = \left(\pm\tfrac{1}{\sqrt2},\ 0,\ \pm\tfrac{1}{\sqrt2}\right)
      $$

      **Comprobación.** Con esa normal, $\sigma_n = 3\cdot\tfrac12 = 1{,}5$ y
      $|S|^{2} = 9\cdot\tfrac12 = 4{,}5$, así que
      $\tau_n = \sqrt{4{,}5 - 2{,}25} = 1{,}5$: las dos componentes iguales. Y
      un barrido de todas las normales con el motor del curso da el mismo
      máximo.

  # ── Teoría · pregunta 4 · Mohr con un ensayo de tracción y uno de cortadura.
  - id: exerm2021-1par-4-el-limite-a-compresion-por-mohr
    titulo: El límite a compresión que dan un ensayo de tracción y uno de cortadura pura
    fuente: >-
      Pregunta 4 de la hoja de teoría · Primer parcial del 20 de noviembre de
      2020 · Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Se conserva «Mpa». El examen no
      publica resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      (1p) Un material frágil tiene un límite elástico a tracción de 320Mpa.
      Además se sabe que en un ensayo de cortadura pura sobre ese material, se
      produce la rotura a partir de una tensión tangencial de 200 Mpa. Se pide
      hallar el límite elástico a compresión del material usando el criterio
      de Mohr.
    pide: El límite elástico a compresión, según el criterio de los estados límites de Mohr.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué estado tensional es el del ensayo de cortadura pura, y qué hace
          con él el criterio de Mohr?
        opciones:
          - texto: >-
              $\sigma_1 = \tau$, $\sigma_2 = 0$, $\sigma_3 = -\tau$: su círculo,
              centrado en el origen, tiene que ser tangente a la misma recta
              que los de tracción y compresión
            correcta: true
            mensaje: |
              Eso es. La envolvente de Mohr del curso es la recta tangente a
              los círculos límite de tracción y de compresión; el ensayo de
              cortadura da un tercer círculo límite, y con él se despeja el
              límite que falta.
          - texto: >-
              $\sigma_1 = \sigma_3 = \tau$, una tracción doble
            mensaje: |
              En cortadura pura las principales son $+\tau$ y $-\tau$, a 45°
              de las caras del ensayo: una tracción y una compresión del mismo
              valor, no dos tracciones.
          - texto: >-
              Con cortadura pura no se puede usar Mohr: hace falta un ensayo
              de compresión
            mensaje: |
              El criterio con su recta tiene dos parámetros, $\sigma_{et}$ y
              $\sigma_{ec}$. Un ensayo de compresión daría el segundo
              directamente; uno de cortadura lo da también, a través de la
              tangencia.
      - tipo: calcular
        titulo: El cociente k
        pregunta: |
          Con $\sigma_{eq} = \sigma_1 - k\,\sigma_3$ y $k = \sigma_{et}/\sigma_{ec}$,
          ¿qué $k$ hace que el ensayo de cortadura esté justo en el límite?
        respuesta:
          tipo: numero
          valor: '0.6'
          tolerancia: 0.001
          formato: un número
        distractores:
          - valor: '0.625'
            mensaje: |
              Has tomado $k = \tau/\sigma_{et} = 200/320$. El cociente del
              criterio es entre los dos límites **normales**; la cortadura
              entra a través de la ecuación $\tau(1 + k) = \sigma_{et}$.
          - valor: '1'
            mensaje: |
              $k = 1$ es Tresca, con el mismo límite a tracción y a
              compresión. Pero entonces la cortadura pura fallaría a
              $\tau = 160$, no a 200: el material resiste más a compresión.
        pista: |
          En el ensayo, $\sigma_1 = 200$ y $\sigma_3 = -200$. Iguala
          $\sigma_1 - k\sigma_3$ a $\sigma_{et} = 320$.
        desarrollo: |
          $$
          200 - k\,(-200) = 320 \;\Longrightarrow\; 200\,(1 + k) = 320
          \;\Longrightarrow\; k = 0{,}6
          $$
      - tipo: calcular
        titulo: El límite a compresión
        pregunta: |
          ¿Cuánto vale el límite elástico a compresión, en MPa?
        respuesta:
          tipo: numero
          valor: '533.333'
          tolerancia: 0.5
          formato: un número, en MPa (en positivo)
        distractores:
          - valor: '192'
            mensaje: |
              Has multiplicado, $\sigma_{ec} = k\,\sigma_{et}$. La definición es
              $k = \sigma_{et}/\sigma_{ec}$: hay que dividir, y el material
              frágil tiene que salir **más** resistente a compresión.
          - valor: '320'
            mensaje: |
              Es el de tracción. Con un límite igual a compresión, la
              cortadura pura fallaría a $\tau = 160$ MPa, y el ensayo dice
              200: el dato no casa.
          - valor: '400'
            mensaje: |
              Es $2\tau$, el límite que daría Tresca a partir del ensayo de
              cortadura. Mohr no reparte igual tracción y compresión: hay que
              pasar por $k$.
        pista: |
          $\sigma_{ec} = \sigma_{et}/k$.
        desarrollo: |
          $$
          \sigma_{ec} = \frac{\sigma_{et}}{k} = \frac{320}{0{,}6}
          = \frac{1600}{3} \approx 533\ \mathrm{MPa}
          $$
      - tipo: justificar
        pregunta: Ordena la respuesta de examen. Una pieza es falsa.
        piezas:
          - texto: >-
              El criterio de los estados límites de Mohr, con la envolvente
              recta: $\sigma_{eq} = \sigma_1 - k\,\sigma_3$, con
              $k = \sigma_{et}/\sigma_{ec}$.
          - texto: >-
              En cortadura pura $\sigma_1 = \tau$ y $\sigma_3 = -\tau$, y en el
              límite $\tau\,(1 + k) = \sigma_{et}$.
          - texto: >-
              Con $\tau = 200$ y $\sigma_{et} = 320$, $k = 0{,}6$ y
              $\sigma_{ec} = 320/0{,}6 \approx 533$ MPa.
          - texto: >-
              Sale mayor que el de tracción, como corresponde a un material
              frágil.
          - texto: >-
              En cortadura pura no hay tensiones normales, así que el ensayo
              solo da información sobre $\tau$ y no entra en el criterio.
            trampa: true
            mensaje: |
              No hay normales en las caras del ensayo, pero sí en las
              principales, a 45°: $+\tau$ y $-\tau$. Es un estado con tracción
              y compresión a la vez, y por eso sirve para fijar la recta.
    resolucion: |
      **El criterio.** Estados límites de Mohr con la envolvente recta
      (apuntes del tema 6, ecs. 6.12-6.16):

      $$
      \sigma_{eq} = \sigma_1 - k\,\sigma_3,\qquad k = \frac{\sigma_{et}}{\sigma_{ec}}
      $$

      y el material falla cuando $\sigma_{eq} = \sigma_{et}$.

      **El ensayo de cortadura pura.** Sus principales son
      $\sigma_1 = \tau = 200$, $\sigma_2 = 0$ y $\sigma_3 = -\tau = -200$ MPa, y
      está en el límite:

      $$
      200 + 200\,k = 320 \;\Longrightarrow\; k = 0{,}6
      $$

      **El límite a compresión.**

      $$
      \sigma_{ec} = \frac{\sigma_{et}}{k} = \frac{320}{0{,}6} = \frac{1600}{3}
      \approx 533\ \mathrm{MPa}
      $$

      **Comprobación por la geometría de Mohr.** Los círculos límite tienen el
      centro en el eje y son tangentes a una misma recta, así que el radio
      varía linealmente con el centro: $r = 200 + m\,c$. El de tracción
      (centro 160, radio 160) da $m = -1/4$; el de compresión (centro
      $-\sigma_{ec}/2$, radio $\sigma_{ec}/2$) da
      $\sigma_{ec}/2 = 200 + \sigma_{ec}/8$, es decir,
      $\sigma_{ec} = 1600/3$, lo mismo.

      Un detalle del enunciado: llama «límite elástico» al de tracción y
      «rotura» al de cortadura. En un material frágil los dos coinciden en la
      práctica, y el criterio se aplica con los dos como límites.

  # ── Problema 1, apartados a), b) y c) · la roseta, que es la de los apuntes
  #    vista en un espejo.
  - id: exerm2021-1par-5-la-roseta-vista-en-un-espejo
    titulo: Una roseta a 120° vista en un espejo, sus principales y la dirección a 45°
    fuente: >-
      Problema 1, apartados a), b) y c) · Primer parcial del 20 de noviembre
      de 2020 · Elasticidad y Resistencia de Materiales, Escuela de Ingeniería
      de Gipuzkoa (UPV/EHU). El problema vale 2 puntos, sin reparto por
      apartados. El enunciado no da E ni ν, que hacen falta para εz. El
      examen no publica resolución; el desarrollo es nuestro.
    nivel: examen
    enunciado: |
      (2p) En un estado tensional plano, las deformaciones experimentales en
      un punto del sólido elástico se miden con tres galgas extensométricas
      colocadas como se muestra en la figura.

      $$
      \varepsilon_a = 10^{-6}\ ;\ \varepsilon_b = 2\cdot 10^{-6};\ \varepsilon_c = 0
      $$

      Determinar:

      **a)** El tensor de deformaciones $[\varepsilon]_{OXYZ}$

      **b)** Deformaciones principales y direcciones principales en el espacio.
      Representar los círculos de Mohr.

      **c)** Calcular las componentes intrínsecas del vector deformación en una
      dirección perpendicular al eje z y que forma 45 º con el eje x.

      **d)** El tensor de tensiones $[\sigma]_{OXYZ}$ que representa el estado de
      tensiones causante de las deformaciones dadas.

      **e)** Determinar la tensión de cortadura máxima.

