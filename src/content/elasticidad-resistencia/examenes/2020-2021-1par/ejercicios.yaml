        <text x="166" y="189" text-anchor="start" font-size="11" fill="var(--d3)">−q<tspan font-size="8" dy="2">0</tspan><tspan dy="-2">a²/2</tspan></text>
        <text x="340" y="181" text-anchor="middle" font-size="11" fill="var(--d3)">−q<tspan font-size="8" dy="2">0</tspan><tspan dy="-2">a²/2</tspan></text>
        <text x="227.5" y="140" text-anchor="middle" font-size="11" fill="var(--d3)">q<tspan font-size="8" dy="2">0</tspan><tspan dy="-2">a²/16</tspan></text>
        <text x="70" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--ink)">A</text>
        <text x="160" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--ink)">B</text>
        <text x="250" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--ink)">C</text>
        <text x="340" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--ink)">D</text>
        <text x="430" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="var(--ink)">E</text>
      </svg>
      <figcaption>

      Los dos diagramas a escala, con el flector **positivo hacia arriba** (tracciona la fibra inferior). El único flector positivo de toda la viga es la joroba de **q₀a²/16** entre B y C: casi no se ve, y es fácil olvidarla.

      </figcaption>
      </figure>

      **Comprobación.** Equilibrio global: $R_A + R_D = 3q_0a$, que es toda la
      carga ($2q_0a + q_0a$), y momentos respecto de A,
      $2q_0a^{2} + 1{,}5q_0a\cdot3a - 2q_0a\cdot1{,}5a - q_0a\cdot3{,}5a = 0$. El
      motor del curso, con la viga escrita como «empotrada en A, rótula en C,
      apoyo móvil en D», da las mismas reacciones, los mismos valores en cada
      punto y el mismo máximo en $1{,}75a$.

  # ── Problema 3 · dos piezas rígidas y tres barras. EFG es isostática y da
  #    N2 sola; ABCD lleva la compatibilidad.
  - id: exerm2021-1par-7-dos-piezas-rigidas-y-tres-barras
    titulo: Dos piezas rígidas unidas por tres barras, la P máxima y la barra 3 calentada
    fuente: >-
      Problema 3 · Primer parcial del 20 de noviembre de 2020 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 2 puntos. La figura sale a medio dibujar en el PDF: se ha
      redibujado del Word original. El examen no publica resolución; el
      desarrollo es nuestro.
    nivel: examen
    enunciado: |
      (2 p) La estructura de la figura soporta una fuerza P en G. Las barras
      1, 2 y 3 tienen el mismo módulo $E$ y sección A. Considerando las barras
      ABCD y EFG infinitamente rígidas, determinar:

      **a)** Las fuerzas en las barras 1, 2 y 3.

      Siendo A= 4 cm² ,E=2·10⁵ MPa y $\alpha = 12\cdot10^{-6}$ ºC⁻¹

      **b)** Calcular el máximo valor de $P$ si $\sigma_{adm} = 180$ MPa.

      **c)** Determinar las tensiones térmicas en las barras 1,2 y 3, si la
      barra 3 sufre un aumento de temperatura de 20ºC.

      <figure class="figura-examen">
