      **Notas nuestras.** Según la figura (y el Word): en la solución A las
      juntas dan la vuelta al cilindro, en
      horizontal, y en la B van en hélice, a 30° de la horizontal; la galga
      A va en horizontal, en la dirección circunferencial, y la B, en
      vertical, en la del eje. Junto a la figura, el Word lleva además dos
      recuadros que el PDF pierde: uno con $\sigma_A = pr/e$ y
      $\sigma_B = pr/2e$, y otro rotulado VON MISES con
      $\sigma_{bal} = \sqrt{\sigma_1^{2} + \sigma_2^{2} - \sigma_1\sigma_2}$.
      Se toma $r$ = 1 m, la mitad del diámetro. En c) y d) se entiende que
      las galgas miden el estado completo de la solución A, el de la presión
      de prueba más el de la soldadura, que el enunciado manda tratar como
      un estado añadido; la resolución dice qué saldría con la presión
      sola.
    pide: >-
      La presión interna máxima; la tensión equivalente de Von Mises de las
      dos soluciones con la presión de prueba, y cuál es mejor; E y ν a
      partir de las dos galgas; y cuánto cambian el radio y la longitud en
      la solución A.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las 800 Kp/cm² de la soldadura son una tracción en la dirección de
          la junta. ¿Cómo entran en el estado de tensiones de la pared, en
          los ejes circunferencial ($\theta$) y axial ($z$)?
        opciones:
          - texto: >-
              Como una tracción simple en la dirección de la junta, que se
              pasa a los ejes $\theta$ y $z$ y se suma a las tensiones de la
              presión; si la junta no va según uno de esos ejes, da también
              una tensión tangencial
            correcta: true
            mensaje: |
              Eso es. Un estado de tracción simple de 800 según una dirección
              que forma un ángulo $\alpha$ con la circunferencial da, en los
              ejes $\theta$ y $z$, $800\cos^{2}\alpha$, $800\,\text{sen}^{2}\alpha$
              y $800\,\text{sen}\,\alpha\cos\alpha$ (el cambio de ejes de la
              ec. 2.28, p. 15 del tema 2). Se suma a las tensiones de la
              presión, porque el enunciado lo toma como un estado añadido.
          - texto: >-
              Se suman 800 a las dos tensiones de la presión, la
              circunferencial y la axial
            mensaje: |
              Eso sería una tracción de 800 en todas las direcciones del
              plano. La de la soldadura actúa en una sola, la de la junta:
              en las direcciones normales a ella no da nada.
          - texto: >-
              Se suman 800 a la tensión equivalente de Von Mises de la
              presión sola
            mensaje: |
              La tensión equivalente no se suma: es una función no lineal de
              las componentes. Primero se suman los dos estados, componente a
              componente, y del estado total se saca la equivalente.
          - texto: >-
              Van siempre según el eje del cilindro, porque las chapas se
              sueldan unas encima de otras
            mensaje: |
              La tracción va en la dirección de la junta, y la junta no tiene
              por qué ir según el eje: en la figura, una solución tiene las
              juntas dando la vuelta y la otra, en hélice.
      - tipo: calcular
        titulo: La presión máxima (apartado a)
        pregunta: |
          ¿Cuál es la presión interna máxima, con coeficiente de seguridad 2
          y el criterio de Von Mises, en kp/cm²?
        respuesta:
          tipo: numero
          valor: '2.2517'
          tolerancia: 0.002
          formato: un número, en kp/cm²
        distractores:
          - valor: '1.95'
            mensaje: |
              Es la presión con el criterio de Tresca, la tensión
              circunferencial igualada a 1300 kp/cm². Von Mises da algo más,
              porque con la tensión axial a la mitad la equivalente es
              $\tfrac{\sqrt{3}}{2}\,pr/e$, menor que $pr/e$.
          - valor: '4.5033'
            mensaje: |
              Te falta el coeficiente de seguridad: la tensión admisible es
              2600/2 = 1300 kp/cm².
          - valor: '1.1258'
            mensaje: |
              Has tomado $r$ = 2 m. En $\sigma_\theta = pr/e$ el radio es la
              mitad del diámetro, 100 cm.
        pista: |
          En la pared, $\sigma_\theta = pr/e$ y $\sigma_z = pr/2e$ (ecs. 8.16
          y 8.17, p. 10 del tema 8), y la radial es despreciable. La
          equivalente de Von Mises en tensión plana, con las principales, es
          la ec. 6.31 (p. 12 del tema 6).
        desarrollo: |
          Con $\sigma_1 = pr/e$ y $\sigma_2 = pr/2e$:

          $$
          \sigma_{eq} = \frac{pr}{e}\sqrt{1 + \tfrac{1}{4} - \tfrac{1}{2}} = \frac{\sqrt{3}}{2}\,\frac{pr}{e}
          $$

          Igualada a $\sigma_{adm} = 2600/2 = 1300$ kp/cm², con $r$ = 100 cm y
          $e$ = 0,15 cm:

          $$
          p_{\max} = \frac{2\cdot1300\cdot0{,}15}{\sqrt{3}\cdot100} = 2{,}2517\ \text{kp/cm}^2
          $$
      - tipo: calcular
        titulo: La equivalente de la solución A (apartado b)
        pregunta: |
          Con la presión de prueba de 1,52 kp/cm², ¿cuánto vale la tensión
          equivalente de Von Mises en la solución A, en kp/cm²?
        respuesta:
          tipo: numero
          valor: '1620.5'
          tolerancia: 1
          formato: un número, en kp/cm²
        distractores:
          - valor: '1187.5'
            mensaje: |
              Has sumado las 800 a la tensión axial. En la solución A las
              juntas dan la vuelta al cilindro: la tracción de la soldadura
              va en la dirección circunferencial.
          - valor: '877.6'
            mensaje: |
              Es la equivalente de la presión sola, sin la soldadura. El
              enunciado pide sumar el estado de la soldadura.
          - valor: '1677.6'
            mensaje: |
              Has sumado 800 a la equivalente de la presión sola. Las
              equivalentes no se suman: se suman los estados, componente a
              componente, y del total se saca la equivalente.
        pista: |
          Con $p$ = 1,52 kp/cm², $\sigma_\theta = pr/e$ y $\sigma_z = pr/2e$;
          súmale a la componente de la dirección de la junta las 800 de la
          soldadura y aplica Von Mises (ec. 6.31).
        desarrollo: |
          $\sigma_\theta = 1{,}52\cdot100/0{,}15 = 1013{,}3$ kp/cm² y
          $\sigma_z = 506{,}7$ kp/cm². En la solución A la soldadura suma 800
          a la circunferencial: $\sigma_\theta = 1813{,}3$ kp/cm²,
          $\sigma_z = 506{,}7$ kp/cm², sin tangenciales. Son principales, y

          $$
          \sigma_{eq,A} = \sqrt{1813{,}3^{2} + 506{,}7^{2} - 1813{,}3\cdot506{,}7} = 1620{,}5\ \text{kp/cm}^2
          $$
      - tipo: calcular
        titulo: La equivalente de la solución B (apartado b)
        pregunta: |
          ¿Y en la solución B, en kp/cm²?
        respuesta:
          tipo: numero
          valor: '1523.9'
          tolerancia: 1
          formato: un número, en kp/cm²
        distractores:
          - valor: '1309.2'
            mensaje: |
              Has medido los 30° desde el eje del cilindro. En la figura los
              30° van de la horizontal a la junta: la junta forma 30° con la
              dirección circunferencial.
          - valor: '1400.8'
            mensaje: |
              Te falta la tangencial. Una tracción en una dirección inclinada
              respecto de $\theta$ y $z$ da también
              $\tau_{\theta z} = 800\,\text{sen}\,30°\cos30°$, que entra en
              Von Mises con un 3 delante.
          - valor: '1478.5'
            mensaje: |
              Has repartido las 800 con $\cos30°$ y $\text{sen}\,30°$, como
              si fuera una fuerza. Una tensión se pasa a otros ejes con los
              cuadrados: $800\cos^{2}30° = 600$ y
              $800\,\text{sen}^{2}30° = 200$ kp/cm².
        pista: |
          Pasa la tracción de 800 a los ejes $\theta$ y $z$ con el ángulo de
          30° entre la junta y la dirección circunferencial, súmala a la de
          la presión y usa Von Mises en tensión plana con tangencial (ec.
          6.30, p. 11 del tema 6).
        desarrollo: |
          La soldadura da $800\cos^{2}30° = 600$, $800\,\text{sen}^{2}30° = 200$
          y $800\,\text{sen}\,30°\cos30° = 346{,}4$ kp/cm². Con la presión:
          $\sigma_\theta = 1613{,}3$, $\sigma_z = 706{,}7$ y
          $\tau_{\theta z} = 346{,}4$ kp/cm², y

          $$
          \sigma_{eq,B} = \sqrt{1613{,}3^{2} + 706{,}7^{2} - 1613{,}3\cdot706{,}7 + 3\cdot346{,}4^{2}} = 1523{,}9\ \text{kp/cm}^2
          $$

          Menos que en la A: la solución B es la más efectiva. La hélice
          reparte la tracción de la soldadura entre las dos direcciones, y
          la circunferencial, que es la que ya va más cargada, recibe menos.
      - tipo: calcular
        titulo: El coeficiente de Poisson (apartado c)
        pregunta: |
          Con las dos lecturas de la solución A, ¿cuánto vale ν?
        respuesta:
          tipo: numero
          valor: '0.2462'
          tolerancia: 0.001
          formato: un número, sin unidades
        distractores:
          - valor: '0.4728'
            mensaje: |
              Has usado las tensiones de la presión sola. Las galgas miden la
              deformación del estado completo de la solución A, con las 800
              de la soldadura en la dirección circunferencial.
          - valor: '4.061'
            mensaje: |
              Has cruzado las galgas: la A va en horizontal, en la dirección
              circunferencial, y la B, en vertical. Un ν mayor que 0,5 no es
              posible: ya avisa de que algo está cambiado.
        pista: |
          Ley de Hooke en la pared (ec. 4.2, p. 4 del tema 4), con
          $\sigma_r \approx 0$: $\varepsilon_\theta = (\sigma_\theta - \nu\sigma_z)/E$
          y $\varepsilon_z = (\sigma_z - \nu\sigma_\theta)/E$. El cociente de las
          dos no depende de E.
        desarrollo: |
          Con $\sigma_\theta = 1813{,}3$ y $\sigma_z = 506{,}7$ kp/cm² (la
          presión de prueba más la soldadura A), $\varepsilon_A = \varepsilon_\theta$
          y $\varepsilon_B = \varepsilon_z$:

          $$
          \frac{1813{,}3 - 506{,}7\,\nu}{506{,}7 - 1813{,}3\,\nu} = \frac{1825}{65}
          \;\Rightarrow\;
          \nu = \frac{506{,}7\cdot1825 - 1813{,}3\cdot65}{1813{,}3\cdot1825 - 506{,}7\cdot65} = 0{,}2462
          $$
      - tipo: calcular
        titulo: El módulo de elasticidad (apartado c)
        pregunta: |
          ¿Y E, en kp/cm²?
        respuesta:
          tipo: numero
          valor: '925243'
          tolerancia: 1000
          formato: un número, en kp/cm²
        distractores:
          - valor: '423989'
            mensaje: |
              Es el que sale con las tensiones de la presión sola, sin la
              soldadura. Las galgas miden el estado completo de la solución A.
          - valor: '993607'
            mensaje: |
              Has hecho $E = \sigma_\theta/\varepsilon_A$, sin el efecto de
              Poisson. La tensión axial acorta la dirección circunferencial:
              $E = (\sigma_\theta - \nu\sigma_z)/\varepsilon_\theta$.
        pista: |
          Con ν ya calculado, despeja E de cualquiera de las dos: la de la
          galga A es la más precisa, porque su lectura es la grande.
        desarrollo: |
          $$
          E = \frac{\sigma_\theta - \nu\sigma_z}{\varepsilon_A} = \frac{1813{,}3 - 0{,}2462\cdot506{,}7}{1825\cdot10^{-6}} = 925\,243\ \text{kp/cm}^2
          $$

          La de la galga B da lo mismo:
          $(506{,}7 - 0{,}2462\cdot1813{,}3)/(65\cdot10^{-6}) = 925\,243$ kp/cm².
      - tipo: calcular
        titulo: La variación del radio (apartado d)
        pregunta: |
          En la solución A, con la presión de prueba, ¿cuánto crece el
          radio, en mm?
        respuesta:
          tipo: numero
          valor: '1.825'
          tolerancia: 0.002
          formato: un número, en mm
        distractores:
          - valor: '3.65'
            mensaje: |
              Es la variación del diámetro. La del radio es la mitad:
              $\Delta r = r\,\varepsilon_\theta$, con $r$ = 1000 mm.
          - valor: '0.9604'
            mensaje: |
              Has calculado la deformación con las tensiones de la presión
              sola. En la solución A las 800 de la soldadura también estiran
              la circunferencia, y la galga A ya lo mide todo.
        pista: |
          La deformación circunferencial es la que mide la galga A, y la
          longitud de la circunferencia es $2\pi r$: $\Delta r/r = \varepsilon_\theta$.
        desarrollo: |
          $$
          \Delta r = r\,\varepsilon_\theta = 1000\cdot1825\cdot10^{-6} = 1{,}825\ \text{mm}
          $$
      - tipo: calcular
        titulo: La variación de la longitud (apartado d)
        pregunta: |
          ¿Y cuánto crece la longitud del recipiente, en mm?
        respuesta:
          tipo: numero
          valor: '0.39'
          tolerancia: 0.001
          formato: un número, en mm
        distractores:
          - valor: '1.6675'
            mensaje: |
              Has calculado la deformación axial con las tensiones de la
              presión sola. La tracción circunferencial de la soldadura acorta
              el eje por Poisson, y por eso la galga B lee tan poco.
          - valor: '0.195'
            mensaje: |
              Has tomado la mitad de la altura. La longitud del recipiente es
              6 m = 6000 mm.
        pista: |
          La deformación axial es la que mide la galga B, y la longitud es
          6 m.
        desarrollo: |
          $$
          \Delta L = L\,\varepsilon_z = 6000\cdot65\cdot10^{-6} = 0{,}39\ \text{mm}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Pared delgada, $\sigma_\theta = pr/e$ y $\sigma_z = pr/2e$; Von
              Mises igualada a 1300 da $p_{\max}$ = 2,25 kp/cm².
          - texto: >-
              Con 1,52 kp/cm², 1013,3 y 506,7 kp/cm²; la soldadura A suma 800
              a la circunferencial y la B reparte 600, 200 y 346,4 entre
              $\sigma_\theta$, $\sigma_z$ y $\tau_{\theta z}$.
          - texto: >-
              Las equivalentes son 1620,5 en la A y 1523,9 en la B: la B es
              la más efectiva.
          - texto: >-
              Hooke con el estado de la A y las dos lecturas da ν = 0,246 y
              E = 925 243 kp/cm².
          - texto: >-
              $\Delta r = r\varepsilon_A$ = 1,825 mm y $\Delta L = L\varepsilon_B$
              = 0,39 mm.
          - texto: >-
              Las galgas se interpretan con las tensiones de la presión sola,
              porque las de la soldadura son residuales y no deforman.
            trampa: true
            mensaje: |
              El enunciado trata las 800 como un estado añadido al de la
              presión, y las galgas van en la solución A: miden el estado
              completo. Sin la soldadura, ν saldría 0,473, casi el límite de
              0,5, y E, 423 989 kp/cm²: un material raro, que avisa de que el
              estado no es ese.
    resolucion: |
      **Las tensiones de la pared.** En un cilindro de pared delgada, con $r$
      = 100 cm y $e$ = 0,15 cm, $\sigma_\theta = pr/e$ y $\sigma_z = pr/2e$
      (ecs. 8.16 y 8.17, p. 10 del tema 8), y la radial es despreciable. Son
      principales.

      **a) La presión máxima.** Von Mises en tensión plana con las
      principales (ec. 6.31, p. 12 del tema 6):

      $$
      \sigma_{eq} = \sqrt{\sigma_\theta^{2} + \sigma_z^{2} - \sigma_\theta\sigma_z} = \frac{\sqrt{3}}{2}\,\frac{pr}{e}
      $$

      Con $\sigma_{adm} = 2600/2 = 1300$ kp/cm²:

      $$
      p_{\max} = \frac{2\cdot1300\cdot0{,}15}{\sqrt{3}\cdot100} = 2{,}2517\ \text{kp/cm}^2
      $$

      Con Tresca saldría 1,95 kp/cm²: Von Mises es menos conservador.

      **b) Las dos soldaduras.** Con la presión de prueba, $\sigma_\theta$ =
      1013,3 kp/cm² y $\sigma_z$ = 506,7 kp/cm². La soldadura es una tracción
      simple de 800 kp/cm² en la dirección de la junta, que se pasa a los ejes
      $\theta$, $z$ (el cambio de ejes de la ec. 2.28, p. 15 del tema 2) y se
      suma.

      - Solución A, juntas en anillo: la junta va según $\theta$, y
        $\sigma_\theta = 1813{,}3$, $\sigma_z = 506{,}7$ kp/cm², sin
        tangenciales.

        $$
        \sigma_{eq,A} = \sqrt{1813{,}3^{2} + 506{,}7^{2} - 1813{,}3\cdot506{,}7} = 1620{,}5\ \text{kp/cm}^2
        $$

      - Solución B, juntas en hélice a 30° de la circunferencial: la tracción
        da $800\cos^{2}30° = 600$, $800\,\text{sen}^{2}30° = 200$ y
        $800\,\text{sen}\,30°\cos30° = 346{,}4$ kp/cm². Con la presión,
        $\sigma_\theta = 1613{,}3$, $\sigma_z = 706{,}7$ y
        $\tau_{\theta z} = 346{,}4$ kp/cm², y con la ec. 6.30 (p. 11):

        $$
        \sigma_{eq,B} = \sqrt{1613{,}3^{2} + 706{,}7^{2} - 1613{,}3\cdot706{,}7 + 3\cdot346{,}4^{2}} = 1523{,}9\ \text{kp/cm}^2
        $$

      La solución B es la más efectiva: su equivalente es un 6 % menor. La
      hélice manda parte de la tracción de la soldadura a la dirección axial,
      que es la que menos carga lleva. Sin la soldadura la equivalente sería
      877,6 kp/cm²; con ella, las dos pasan de la admisible del apartado a,
      1300 kp/cm², aunque siguen por debajo del límite elástico, 2600
      kp/cm².

      **c) E y ν.** Las galgas de la solución A miden la deformación del
      estado completo, $\sigma_\theta = 1813{,}3$ y $\sigma_z = 506{,}7$
      kp/cm²; la A, en horizontal, la circunferencial, y la B, en vertical,
      la axial. Con la ley de Hooke (ec. 4.2, p. 4 del tema 4) y
      $\sigma_r \approx 0$:

      $$
      \varepsilon_A = \frac{\sigma_\theta - \nu\sigma_z}{E},\qquad \varepsilon_B = \frac{\sigma_z - \nu\sigma_\theta}{E}
      $$

      Dividiendo una por otra desaparece E:

      $$
      \nu = \frac{506{,}7\cdot1825 - 1813{,}3\cdot65}{1813{,}3\cdot1825 - 506{,}7\cdot65} = 0{,}2462
      $$

      $$
      E = \frac{1813{,}3 - 0{,}2462\cdot506{,}7}{1825\cdot10^{-6}} = 925\,243\ \text{kp/cm}^2
      $$

      Un acero tendría unos 2,1·10⁶ kp/cm²: los datos son de un ejercicio,
      no de un material concreto. Si se usaran las tensiones de la presión
      sola, saldría ν = 0,473 y E = 423 989 kp/cm².

      **d) El radio y la longitud.** Las deformaciones del estado de la
      solución A son las que miden las galgas:

      $$
      \Delta r = r\,\varepsilon_A = 1000\cdot1825\cdot10^{-6} = 1{,}825\ \text{mm},\qquad
      \Delta L = L\,\varepsilon_B = 6000\cdot65\cdot10^{-6} = 0{,}39\ \text{mm}
      $$

      **Comprobaciones.** El motor del curso (depósito cilíndrico, Von Mises
      con el tensor y con las principales, deformaciones a partir de las
      tensiones) da todas las cifras, y las fórmulas cerradas de arriba, las
      mismas.
