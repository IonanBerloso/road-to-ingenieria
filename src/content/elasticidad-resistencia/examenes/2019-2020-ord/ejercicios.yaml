ejercicios:
  # ── Cuestión 2 · las ecuaciones de equilibrio de la pieza recta.
  - id: exerm1920-ord-2-las-ecuaciones-de-equilibrio-de-la-pieza-recta
    titulo: Las ecuaciones diferenciales de equilibrio de una pieza prismática recta
    fuente: >-
      Cuestión 2 de teoría · Examen final del 7 de enero de 2020 · Elasticidad
      y Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 1 punto. Casi la misma pregunta cayó como pregunta 2 de
      teoría del primer parcial de 2012-2013 («Deducir las ecuaciones de
      equilibrio de un elemento diferencial de viga», con 1,5 puntos), y está
      resuelta en el sitio; aquí se resuelve de nuevo, con otro ejemplo. El
      examen no publica resolución; el desarrollo es nuestro y sigue los
      apuntes del tema 7, apartado 7.4 (págs. 10 a 12). Los números de los
      pasos de cálculo son un ejemplo nuestro.
    nivel: examen
    enunciado: |
      (1p) Deducir las ecuaciones diferenciales de equilibrio en una pieza
      prismática recta.
    pide: >-
      Las ecuaciones diferenciales de equilibrio de una rebanada de una pieza
      prismática recta, deducidas.
    pasos:
      - tipo: reconocer
        pregunta: |
          En la rebanada de longitud $dx$, en la cara de $x$ el cortante $T$
          se dibuja hacia arriba. ¿Y en la cara de $x + dx$, cómo se dibuja
          $T + dT$?
        opciones:
          - texto: >-
              Hacia abajo. Las dos caras miran a lados opuestos, y un
              esfuerzo positivo actúa en sentido contrario en una cara y en la
              otra; el incremento $dT$ no cambia el sentido
            correcta: true
            mensaje: |
              Eso es. Es lo que dibuja la figura 7.6 (p. 11 del tema 7): en
              la cara de $x$, cuya normal mira hacia $-x$, el cortante
              positivo va hacia arriba; en la de $x + dx$, cuya normal mira
              hacia $+x$, $T + dT$ va hacia abajo. Lo mismo con $N$, $M$ y
              el torsor. De ahí salen los signos de las seis ecuaciones.
          - texto: >-
              Hacia arriba, igual que en la otra cara: es el mismo cortante
              más un incremento pequeño
            mensaje: |
              Con las dos hacia arriba, la rebanada no podría estar en
              equilibrio con $dT$ pequeño: sumarían $2T$. Cada cara es la del
              trozo de pieza que queda al otro lado, y lo que una recibe la
              otra lo devuelve en sentido contrario.
          - texto: >-
              Depende del signo de $dT$; si el cortante crece, hacia arriba,
              y si decrece, hacia abajo
            mensaje: |
              El sentido del dibujo lo fija el convenio, no el resultado. Se
              dibujan los esfuerzos positivos en su sentido positivo, y el
              signo de $dT$ sale después de las ecuaciones: aquí, $dT = -q\,dx$.
          - texto: >-
              Hacia abajo, porque la carga $q$ empuja la cara de la derecha
              hacia abajo
            mensaje: |
              El sentido es el bueno, pero no por eso: la carga actúa en toda
              la rebanada, no en una cara. $T + dT$ va hacia abajo aunque no
              haya ninguna carga, porque es el esfuerzo positivo en una cara
              cuya normal mira hacia $+x$.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción completa, como en el examen: la rebanada con
          sus cargas y sus esfuerzos, las seis ecuaciones y las dos del caso
          plano.
        rubrica:
          - punto: >-
              Se aísla una rebanada de longitud dx de una pieza de directriz
              recta, con las cargas por unidad de longitud qx, qy, qz y el
              torsor mt, uniformes en dx, y los esfuerzos positivos en las dos
              caras, N, Ty, Tz, Mt, My, Mz en la de x y los mismos más su
              incremento, en sentido contrario, en la de x + dx; los momentos
              se toman en el centro G2 de la cara de x + dx.
            porque: >-
              Es la figura 7.6 (p. 11): los signos de todas las ecuaciones
              salen de esos sentidos.
            minimo: true
          - punto: >-
              Fuerzas según x, dN/dx = −qx (ec. 7.8), y momentos según x,
              dMt/dx = −mt (ec. 7.9).
            porque: >-
              Son las del axil y del torsor, que no se mezclan con las de
              flexión.
            minimo: true
          - punto: >-
              En el plano xy, fuerzas según y, dTy/dx = −qy (ec. 7.10), y
              momentos según z en G2, dMz/dx = Ty (ec. 7.11), despreciando el
              término qy dx·dx/2, de segundo orden.
            porque: >-
              Es la pareja de la flexión en el plano xy, y el término que se
              desprecia es el que hace que la carga no entre en la de
              momentos.
            minimo: true
          - punto: >-
              En el plano xz, igual, dTz/dx = −qz (ec. 7.12) y dMy/dx = Tz
              (ec. 7.13).
            porque: >-
              Completa las seis ecuaciones de equilibrio de la rebanada.
            minimo: true
          - punto: >-
              Con cargas solo según y, dT/dx = −q y dM/dx = T (ecs. 7.14 y
              7.15), y de ellas, integradas, T y M en un tramo (ecs. 7.16 y
              7.17), con M extremo donde T se anula.
            porque: >-
              Es la forma en que se usan en el resto del tema para dibujar
              los diagramas.
      - tipo: calcular
        titulo: El cortante con una carga que crece
        pregunta: |
          Un ejemplo nuestro, con el convenio del curso ($y$ hacia abajo): un
          tramo de viga de 3 m lleva una carga repartida hacia abajo que
          crece con $x$, $q = 2x$ kN/m ($x$ en m). En $x = 0$ el cortante vale
          $T$ = 6 kN y el flector, $M$ = 0. ¿Cuánto vale el cortante en
          $x$ = 2 m, en kN?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.01
          formato: un número, en kN
        distractores:
          - valor: '10'
            mensaje: |
              Has sumado la carga, $dT/dx = +q$. Con $T$ hacia arriba en la
              cara de $x$ y $T + dT$ hacia abajo en la de $x + dx$, como la
              carga, el equilibrio vertical da $dT/dx = -q$ (ec. 7.14).
          - valor: '-2'
            mensaje: |
              Has tomado la carga como uniforme, con el valor que tiene en
              $x$ = 2 m ($q$ = 4 kN/m) en todo el tramo. Crece desde cero:
              lo que se resta es su área, $\int_0^{2}2x\,dx$ = 4 kN, no
              $4\cdot2$ = 8 kN.
        pista: |
          Integra $dT/dx = -q$ desde $x = 0$, con $T(0) = 6$ kN.
        desarrollo: |
          $$
          T(x) = T(0) - \int_0^{x}2s\,ds = 6 - x^{2}\ \text{(kN, con } x \text{ en m)}
          $$

          En $x$ = 2 m, $T = 6 - 4 = 2$ kN. Es la ec. 7.16 (p. 12) con
          $q_1$ = 2 kN/m² y $q_0 = 0$.
      - tipo: calcular
        titulo: El flector máximo del tramo
        pregunta: |
          En el mismo tramo, ¿cuánto vale el flector máximo, en kN·m?
        respuesta:
          tipo: numero
          valor: '9.798'
          tolerancia: 0.01
          formato: un número, en kN·m
        distractores:
          - valor: '18'
            mensaje: |
              Has tomado $M = T(0)\,x$, como si el cortante no cambiara:
              entonces el flector crece hasta el final, $6\cdot3$ = 18 kN·m.
              El cortante baja con la carga, $T = 6 - x^{2}$, y el máximo está
              donde se anula, dentro del tramo.
          - valor: '9'
            mensaje: |
              Es el flector del extremo del tramo, $M(3)$. El máximo está
              donde $dM/dx = T$ se anula, dentro del tramo, y allí el flector
              es mayor.
          - valor: '-9.798'
            mensaje: |
              El valor es el bueno y el signo no. Con $dM/dx = T$ (ec. 7.15)
              y $T > 0$ desde $x = 0$, el flector crece desde cero: es
              positivo.
        pista: |
          $dM/dx = T$: el flector es extremo donde el cortante se anula.
        desarrollo: |
          $$
          M(x) = \int_0^{x}(6 - s^{2})\,ds = 6x - \frac{x^{3}}{3}
          $$

          $T = 0$ en $x_0 = \sqrt{6} = 2{,}449$ m, dentro del tramo, y

          $$
          M_{\max} = 6\sqrt{6} - \frac{6\sqrt{6}}{3} = 4\sqrt{6} = 9{,}798\ \text{kN·m}
          $$

          En el extremo, $M(3) = 18 - 9 = 9$ kN·m, menos. Es la ec. 7.17
          (p. 12): con carga lineal el cortante es una parábola y el
          flector, una cúbica.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Se aísla una rebanada de longitud $dx$, con las cargas
              repartidas y los esfuerzos positivos en sus dos caras, en
              sentidos contrarios.
          - texto: >-
              Fuerzas según $x$ y momentos según $x$, $dN/dx = -q_x$ y
              $dM_t/dx = -m_t$.
          - texto: >-
              Fuerzas según $y$, $dT_y/dx = -q_y$; y según $z$,
              $dT_z/dx = -q_z$.
          - texto: >-
              Momentos en G₂, despreciando los términos de segundo orden,
              $dM_z/dx = T_y$ y $dM_y/dx = T_z$.
          - texto: >-
              En la cara de $x + dx$ los esfuerzos se dibujan en el mismo
              sentido que en la de $x$, con su incremento.
            trampa: true
            mensaje: |
              Con los dos cortantes hacia arriba, la rebanada no podría estar
              en equilibrio con $dT$ pequeño: sumarían $2T$. Cada cara es la
              del trozo de pieza que queda al otro lado, y lo que una recibe
              la otra lo devuelve en sentido contrario (figura 7.6, p. 11).
    resolucion: |
      **La rebanada.** Se aísla un trozo de pieza de directriz recta de
      longitud $dx$ (apartado 7.4, p. 10 del tema 7, figura 7.6). Sobre él
      actúan las cargas por unidad de longitud $q_x$, $q_y$, $q_z$ y el torsor
      por unidad de longitud $m_t$, que en $dx$ se toman uniformes, y en sus
      dos caras los esfuerzos: $N$, $T_y$, $T_z$, $M_t$, $M_y$, $M_z$ en la
      de $x$ y los mismos más su incremento en la de $x + dx$, con el sentido
      contrario, porque las dos caras miran a lados opuestos. Los momentos se
      toman en G₂, el centro de la cara de $x + dx$.

      **Según el eje de la pieza.**

      $$
      \frac{dN}{dx} = -q_x \quad (7.8),\qquad \frac{dM_t}{dx} = -m_t \quad (7.9)
      $$

      **En el plano $xy$.** Fuerzas según $y$ y momentos según $z$ en G₂:

      $$
      -T_y + (T_y + dT_y) + q_y\,dx = 0 \;\Rightarrow\; \frac{dT_y}{dx} = -q_y \quad (7.10)
      $$

      $$
      dM_z - T_y\,dx + q_y\,dx\,\frac{dx}{2} = 0 \;\Rightarrow\; \frac{dM_z}{dx} = T_y \quad (7.11)
      $$

      El término $q_y\,dx^{2}/2$ es de segundo orden y se desprecia: la
      carga no entra en la ecuación de momentos.

      **En el plano $xz$**, igual:

      $$
      \frac{dT_z}{dx} = -q_z \quad (7.12),\qquad \frac{dM_y}{dx} = T_z \quad (7.13)
      $$

      **El caso plano.** Con las cargas solo según $y$, $q_y = q$, $T_y = T$
      y $M_z = M$, quedan las dos que se usan para los diagramas (p. 12):

      $$
      \frac{dT}{dx} = -q \quad (7.14),\qquad \frac{dM}{dx} = T \quad (7.15)
      $$

      Integradas con una carga lineal, $q = q_1x + q_0$, dan un cortante
      parabólico y un flector cúbico (ecs. 7.16 y 7.17), y el flector es
      extremo donde el cortante se anula.

      **El ejemplo.** Con $q = 2x$ kN/m, $T(0)$ = 6 kN y $M(0) = 0$:
      $T = 6 - x^{2}$, que en $x$ = 2 m vale 2 kN, y $M = 6x - x^{3}/3$, con
      el máximo donde $T = 0$, en $x_0 = \sqrt{6} = 2{,}449$ m:
      $M_{\max} = 4\sqrt{6} = 9{,}798$ kN·m. El motor del curso (viga
      con esa carga) da las dos cifras.

  # ── Problema 1 · el recipiente soldado.
  - id: exerm1920-ord-5-el-recipiente-soldado
    titulo: El recipiente cilíndrico de chapas soldadas, las dos soldaduras y las dos galgas
    fuente: >-
      Problema 1 · Examen final del 7 de enero de 2020 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 1,5 puntos. En el PDF la figura pierde las flechas de
      los ejes y las del ángulo de 30°, y dos recuadros con fórmulas; se han
      leído en el Word original. El examen no publica resolución; el desarrollo es
      nuestro, con los apuntes de los temas 8, 6, 4 y 2, y cada cifra sale
      del motor del curso y de un segundo camino.
    nivel: examen
    enunciado: |
      (1,5p) Se desea construir un recipiente cilíndrico para almacenamiento
      de gases a alta presión. El espesor de la chapa es de 1.5 mm, el
      diámetro 2 m, la altura del recipiente 6 m y el límite elástico del
      material 2600 kp/cm² .

      a) Calcular la máxima presión interna que es capaz de soportar el
      recipiente tomando un coeficiente de seguridad de 2 sobre el material
      y empleando el criterio de Von Mises.

      b) El recipiente se construye a base de chapas soldadas entre sí. Al
      soldar se crean unas tensiones de tracción sobre la chapa en dirección
      de la soldadura de 800 Kp/cm². Estas tensiones se consideran como un
      estado añadido al existente debido a la presión interna. Se estudian
      las dos configuraciones de soldadura de la figura. Si se somete el
      recipiente a una presión de prueba de 1.52 Kp/cm². Calcular la tensión
      equivalente de Von Mises en las dos configuraciones. ¿Cuál es más
      efectiva de las dos?

      c) En la solución A, y con la presión de prueba de 1.52 Kp/cm², se
      colocan unas bandas extensométricas tal y como indica la figura,
      midiendo $\varepsilon_A$ = 1825·10⁻⁶ y $\varepsilon_B$ = 65·10⁻⁶
      respectivamente. Obtener los parámetros de material E y ν.

      d) Obtener la variación de radio y longitud que se producen en la
      solución A para la presión de prueba de 1.52 Kp/cm².

