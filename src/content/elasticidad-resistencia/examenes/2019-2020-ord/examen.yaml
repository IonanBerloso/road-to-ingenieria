asignatura: elasticidad-resistencia
curso: '2019-2020'
convocatoria: ordinaria
fecha: 7 de enero de 2020
# El examen final de enero de Elasticidad y Resistencia de Materiales de
# 2019-2020, fechado el 07/01/2020, el mismo día que la segunda parte:
# cuatro páginas a dos columnas, euskera a la izquierda y castellano a la
# derecha. Cuatro preguntas de teoría de 1 punto (pág. 1) y cuatro
# problemas: el 1 (pág. 2), el 2 (págs. 2 y 3), el 3 (pág. 3) y el 4 (págs.
# 3 y 4, con la figura en la 4).
#
# 1. **10,5 PUNTOS.** Los problemas valen 1,5, 1,5, 2 y 1,5: con la teoría,
#    10,5 puntos, y el cuadernillo los imprime así. Se transcriben como
#    están; el reparto de abajo suma 10,5.
#
# 2. **EL PDF PIERDE PARTE DE UNA FIGURA, Y EL WORD MANDA.** En el problema
#    1 la figura del PDF pierde las flechas de los ejes (z, r y θ), las del
#    ángulo de 30° y dos recuadros con fórmulas (σA = pr/e, σB = pr/2e y la
#    tensión equivalente de Von Mises); se han leído en el Word original.
#    Las galgas, las juntas y la εA y εB sí se ven en la página (lo que no
#    saca la ε es la capa de texto). Las figuras de los problemas 3 y 4 se
#    leen igual que en la segunda parte.
#
# 3. **LECTURAS DEL PROBLEMA 1.** La galga A va en horizontal (dirección
#    circunferencial) y la B en vertical (la del eje), como dicen los
#    recuadros del Word. En la solución A las juntas son anillos; en la B,
#    una hélice a 30° de la horizontal. En c) y d) las galgas miden el
#    estado completo de la solución A, presión más soldadura, que el
#    enunciado manda tratar como un estado añadido; la resolución dice qué
#    saldría con la presión sola. Los rótulos «A SOLUZIOA» y «B SOLUZIOA»
#    van en euskera en las dos columnas y se conservan. Lo de los problemas
#    2, 3 y 4, en la cabecera de la segunda parte.
#
# 4. **ERRATAS Y GRAFÍAS DEL TEXTO, CONSERVADAS**: «1.5 mm», «kp/cm² .» y
#    «Kp/cm²» con las dos mayúsculas, «Von Mises», la frase «Si se somete el
#    recipiente a una presión de prueba de 1.52 Kp/cm².» cortada por el
#    punto (problema 1); «Determine en el espesor» (teoría 4); «Las barras
#    1, 2 y 3» (problema 3); «sección circula» (problema 4).
#
# 5. **PREGUNTAS REPETIDAS** (lección 16: se reutiliza el id solo si la
#    pregunta es idéntica, puntos incluidos).
#    - La **teoría 1** es palabra por palabra, con su «1.(1p)» y sus
#      apartados de 0,5, la pregunta 1 de teoría del parcial 1 de
#      2016-2017, ya publicada: se apunta a ella.
#    - La **teoría 2** («Deducir las ecuaciones diferenciales de equilibrio
#      en una pieza prismática recta.») es casi la pregunta 2 de teoría del
#      parcial 1 de 2012-2013 («Deducir las ecuaciones de equilibrio de un
#      elemento diferencial de viga», 1,5 puntos). Cambian las palabras y
#      los puntos: va un ejercicio propio, con otro ejemplo, y su `fuente`
#      nombra el de 2012-2013.
#    - La **teoría 3**, «Teorema del flujo cortante.», es la cuestión 3 de
#      la final de enero de 2021 (p9c, aún sin publicar): se apunta a ella,
#      como en la segunda parte.
#    - La **teoría 4** y los **problemas 2, 3 y 4** son la teoría 3 y los
#      problemas 1, 2 y 3 de la segunda parte del mismo día: se apunta a
#      ellos. Los problemas 2 y 4 valen aquí 1,5 y allí 2; el 3, 2 en las
#      dos. Los enunciados van sin su número de puntos y cada hoja pinta
#      los suyos.
#    - El **problema 1** no está en el sitio. Se parece en la idea (dos
#      formas de soldar las chapas de un cilindro) a la cuestión 3 de la
#      final de 2022-2023, pero aquella pide la presión con una tensión
#      admisible perpendicular a la soldadura, y esta suma la tensión de la
#      soldadura y usa Von Mises.
#
# 6. **DOS NUMERACIONES EN UN CUADERNILLO.** Las preguntas de teoría son
#    **n 1 a 4** y los problemas, **n 5 a 8**; la `fuente` de cada
#    ejercicio dice el número impreso.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso (src/lib/erm) y de un segundo camino
# (fase-p/p9f, guiones/cifras.mjs).
pdf: 2019-2020-ord.pdf
puntosImpresos:
  fuente: >-
    Impresos junto a cada pregunta: «1.(1p)», con «(0,5p)» en cada uno de
    sus dos apartados, «2.(1p)», «3. (1p)» y «4. (1p)» en la teoría,
    pág. 1; «1. (1,5p)», pág. 2, «2. (1,5p)», págs. 2 y 3, «3. (2 p)»,
    pág. 3, y «4. (1,5p)», págs. 3 y 4, en los problemas. Suman 10,5.
  reparto:
    - { n: 1, puntos: 1 }
    - { n: 2, puntos: 1 }
    - { n: 3, puntos: 1 }
    - { n: 4, puntos: 1 }
    - { n: 5, puntos: 1.5 }
    - { n: 6, puntos: 1.5 }
    - { n: 7, puntos: 2 }
    - { n: 8, puntos: 1.5 }

