asignatura: elasticidad-resistencia
curso: '2017-2018'
convocatoria: ordinaria
fecha: 19 de enero de 2018
# El examen final de Elasticidad y Resistencia de Materiales del 19 de enero
# de 2018: tres páginas, la 1 de TEORÍA (cuatro cuestiones de 1 punto) y la
# 2 y la 3 de EJERCICIOS (cuatro de 1,5 puntos, dos por página). Diez puntos
# en total, y el cuadernillo los imprime todos. El mismo día se hizo la
# segunda parte, que comparte cinco preguntas con este examen (punto 5).
#
# El cuadernillo es bilingüe, castellano a la izquierda y euskera a la
# derecha, y se transcribe **solo la columna en castellano**, tal cual.
#
# 1. **EL PDF Y EL WORD DICEN LO MISMO.** Hay Word del examen
#    (18-ERM-EME-urtfin-enefin.docx) y se ha cotejado: el texto es el mismo.
#    Los símbolos del texto (n y 2θ en la cuestión 1; σx, εa y εb en el
#    ejercicio 1; ΔT y α en el ejercicio 2) son de la fuente Symbol o
#    pequeñas ecuaciones, y el texto del PDF y el del Word los pierden,
#    aunque se ven en la página. La ecuación de
#    la cuestión 1 y la energía de la cuestión 2 son imágenes, y se
#    transcriben. La línea suelta con un solo «.» debajo del enunciado del
#    ejercicio 3 no se copia.
#
# 2. **LO QUE LA FIGURA DICE Y EL TEXTO NO.** En el ejercicio 1, la galga a
#    mide sobre la recta a 45° de x y la b, sobre la de 135°: las dos a 45°
#    de la horizontal, una a cada lado. La nota del enunciado lo dice. Las
#    lecturas de las preguntas compartidas con la segunda parte se dicen en
#    la cabecera de aquel examen.
#
# 3. **ERRATAS Y GRAFÍAS DEL TEXTO, CONSERVADAS**: «se conocen el valor de
#    σx», en singular, y «εa=» sin espacio antes del igual (ejercicio 1);
#    «d2= 2d1» (ejercicio 3). La cuestión 1 escribe «sin θ» y no «sen θ», y
#    la cuestión 3 se imprime «3. (1p)», con espacio.
#
# 4. **DOS NUMERACIONES EN UN CUADERNILLO.** La teoría va de la 1 a la 4 y
#    los ejercicios vuelven a empezar en 1. Aquí la teoría son **n 1 a 4** y
#    los ejercicios **n 5 a 8**; la `fuente` de cada ejercicio dice el
#    nombre impreso. Ninguna pregunta se parte.
#
# 5. **PREGUNTAS REPETIDAS.** Cuatro de las ocho no se resuelven aquí: la
#    entrada apunta al ejercicio donde ya están.
#    - La **cuestión 3** es la cuestión 3 de la segunda parte del mismo día,
#      y las dos son la cuestión 3 de la extraordinaria de junio de 2019,
#      ya en el sitio y con el mismo punto
#      (`exerm1819-ext-3-la-ecuacion-diferencial-de-la-curva-elastica`).
#    - La **cuestión 4** y los **ejercicios 2 y 4** son la cuestión 4 y los
#      ejercicios 1 y 3 de la segunda parte del mismo día, con el mismo
#      texto. La cuestión vale lo mismo, 1 punto; los ejercicios, «(1,5p)»
#      aquí y «(2p)» allí. Por eso se transcribieron allí sin su «(2p)»:
#      cada hoja pone sus puntos desde `puntosImpresos`, y la `fuente` dice
#      los dos valores. En el ejercicio 4, la segunda parte escribe «b/.»
#      con punto y aquí «b/» sin él: la misma pregunta (rev-p9g, M5); la
#      hoja enseñará el punto.
#    - El **ejercicio 3** es el ejercicio 2 de la segunda parte con una
#      palabra más: allí «…que corresponde a d1, siendo d2= 2d1.» y aquí
#      «…que corresponde a d1 y siendo d2= 2d1.». No es el mismo texto, y va
#      como ejercicio propio, resuelto por otro camino: aquí con los
#      teoremas de Mohr, allí con la viga conjugada. El euskera también
#      cambia («azkena» en lugar de «hau»), y pide lo mismo.
#    - La **cuestión 1** es la cuestión 11 de autoevaluación del tema 2, y
#      la **cuestión 2** pide lo mismo que una del primer parcial de
#      2019-2020 con otro enunciado: no son la misma pregunta de examen, y
#      van como propias, con otro ejemplo.
#
# 6. **LOS TEMAS.** El ejercicio 1 va al tema 3: las galgas son su
#    contenido, aunque use la ley de Hooke del tema 4 y el círculo de Mohr
#    del tema 2. La cuestión 2 va al tema 6.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso y de un segundo camino (fase-p/p9l,
# guiones/cifras.mjs). Las cuestiones 1 y 2 no traen números: los pasos de
# cálculo son un ejemplo nuestro, y lo dicen.
pdf: 2017-2018-ord.pdf
puntosImpresos:
  fuente: Cabecera de cada pregunta, «(1p)» en la teoría y «(1,5p)» en los ejercicios, págs. 1-3 del cuadernillo.
  reparto:
    - { n: 1, puntos: 1 }
    - { n: 2, puntos: 1 }
    - { n: 3, puntos: 1 }
    - { n: 4, puntos: 1 }
    - { n: 5, puntos: 1.5 }
    - { n: 6, puntos: 1.5 }
    - { n: 7, puntos: 1.5 }
    - { n: 8, puntos: 1.5 }

