ejercicios:
  # ── Teoría · cuestión 1 · las componentes intrínsecas en función de 2θ (tema 2).
  - id: exerm1718-ord-1-las-componentes-intrinsecas-en-funcion-de-2-theta
    titulo: Las componentes intrínsecas del vector tensión en tensión plana, en función del ángulo doble
    fuente: >-
      Cuestión 1 de teoría · Examen final del 19 de enero de 2018 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. La misma deducción es la cuestión 11
      de autoevaluación del tema 2, que el sitio resuelve con otro ejemplo. El
      examen no publica resolución; el desarrollo es nuestro y sigue los
      apuntes del tema 2, págs. 21 a 23. Los números de los pasos de cálculo
      son un ejemplo nuestro, comprobado con el motor del curso y por un
      segundo camino.
    nivel: examen
    enunciado: |
      (1p) En un estado de tensión plana, se sabe que para un plano de vector
      unitario normal $n$ :

      $$
      \begin{Bmatrix} S_{nx}\\ S_{ny} \end{Bmatrix} =
      \begin{bmatrix} \sigma_x & \tau_{xy}\\ \tau_{xy} & \sigma_y \end{bmatrix}
      \begin{Bmatrix} l\\ m \end{Bmatrix}
      \qquad l = \cos\theta\qquad m = \sin\theta
      $$

      Determinar las componentes intrínsecas del vector tensión en función del
      ángulo $2\theta$.
    pide: >-
      σn y τn del plano de normal (cos θ, sin θ), escritas en función de 2θ,
      y, en un ejemplo nuestro, su valor en un plano.
    pasos:
      - tipo: reconocer
        pregunta: |
          Con las fórmulas en función de $2\theta$, ¿qué dan $\sigma_n$ y
          $\tau_n$ en el plano de $\theta$ = 90°?
        opciones:
          - texto: >-
              $\sigma_n = \sigma_y$ y $\tau_n = -\tau_{xy}$
            correcta: true
            mensaje: |
              Eso es (ec. 2.61). Con $2\theta$ = 180°, $\cos2\theta = -1$ y
              $\sin2\theta = 0$: $\sigma_n = \sigma_y$, porque es la cara de
              normal $y$, y $\tau_n = -\tau_{xy}$. El signo sale de $\hat t$:
              girado 90° antihorario desde $\hat n = (0, 1)$ es $(-1, 0)$, y
              la tangencial de esa cara, $\tau_{xy}$, va según $+x$
              (ec. 2.57).
          - texto: >-
              $\sigma_n = \sigma_y$ y $\tau_n = \tau_{xy}$
            mensaje: |
              La normal sí; el signo de la tangencial, no. Con
              $\cos2\theta = -1$, $\tau_n = \tau_{xy}\cos2\theta = -\tau_{xy}$.
              En esa cara, el $\hat t$ del curso es $(-1, 0)$, y $\tau_{xy}$
              va según $+x$: la proyección sale negativa.
          - texto: >-
              $\sigma_n = \sigma_x$ y $\tau_n = -\tau_{xy}$
            mensaje: |
              $\theta$ = 90° es el plano cuya normal es el eje $y$, no el $x$:
              con $\cos2\theta = -1$, el término $(\sigma_x - \sigma_y)/2$
              resta y queda $\sigma_n = \sigma_y$.
      - tipo: calcular
        titulo: La componente normal en un plano
        pregunta: |
          Con $\sigma_x$ = 80 MPa, $\sigma_y$ = 20 MPa y $\tau_{xy}$ = 40 MPa,
          ¿cuánto vale $\sigma_n$ en el plano de $\theta$ = 60°, en MPa?
        respuesta:
          tipo: numero
          valor: '69.64'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '99.64'
            mensaje: |
              Has puesto $\theta$ = 60° donde va $2\theta$ = 120°. Las
              fórmulas de la ec. 2.61 llevan el ángulo doble: es lo que pide el
              enunciado.
          - valor: '54.64'
            mensaje: |
              Has tomado $(\sigma_x - \sigma_y)$ entero, sin dividir por 2. Al
              pasar $\cos^2\theta$ y $\sin^2\theta$ al ángulo doble (ec. 2.60)
              salen $(\sigma_x + \sigma_y)/2$ y $(\sigma_x - \sigma_y)/2$.
          - valor: '0.36'
            mensaje: |
              El término de $\tau_{xy}$ va con su signo: viene de
              $2\tau_{xy}\sin\theta\cos\theta$ (ec. 2.59), que es
              $+\tau_{xy}\sin2\theta$. Con 120° el seno es positivo y suma.
        pista: |
          $\sigma_n = \dfrac{\sigma_x + \sigma_y}{2} + \dfrac{\sigma_x - \sigma_y}{2}\cos2\theta + \tau_{xy}\sin2\theta$
          (ec. 2.61).
        desarrollo: |
          Con $2\theta$ = 120°, $\cos2\theta = -\tfrac{1}{2}$ y
          $\sin2\theta = \tfrac{\sqrt{3}}{2}$:

          $$
          \sigma_n = 50 + 30\cdot\left(-\tfrac{1}{2}\right) + 40\cdot\tfrac{\sqrt{3}}{2} = 69{,}64\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La componente tangencial en el mismo plano
        pregunta: |
          ¿Y $\tau_n$, con su signo, en MPa?
        respuesta:
          tipo: numero
          valor: '-45.98'
          tolerancia: 0.05
          formato: un número, en MPa (con su signo)
        distractores:
          - valor: '45.98'
            mensaje: |
              El módulo es ese, pero el signo no. Has proyectado sobre el
              tangente opuesto, o has escrito
              $(\sigma_x - \sigma_y)/2\cdot\sin2\theta$. Con
              $\hat t = (-\sin\theta, \cos\theta)$ el primer término es
              $(\sigma_y - \sigma_x)/2\cdot\sin2\theta$ (ec. 2.61).
          - valor: '-5.98'
            mensaje: |
              Has puesto $\theta$ donde va $2\theta$: con 60° en lugar de 120°
              el coseno cambia de signo y el término de $\tau_{xy}$ resta en
              vez de sumar.
          - valor: '-71.96'
            mensaje: |
              Falta el 2 de $(\sigma_y - \sigma_x)/2$: viene de
              $\sin\theta\cos\theta = \tfrac{1}{2}\sin2\theta$ (ec. 2.60).
        pista: |
          $\tau_n = \dfrac{\sigma_y - \sigma_x}{2}\sin2\theta + \tau_{xy}\cos2\theta$
          (ec. 2.61).
        desarrollo: |
          $$
          \tau_n = -30\cdot\tfrac{\sqrt{3}}{2} + 40\cdot\left(-\tfrac{1}{2}\right) = -45{,}98\ \text{MPa}
          $$

          Negativa: la tangencial va en el sentido de $-\hat t$.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la respuesta como en el examen: de la relación del enunciado a
          las dos componentes en función de 2θ, con lo que son θ y el signo de
          τn.
        rubrica:
          - punto: >-
              Se escriben n = (cos θ, sin θ) y t = (−sin θ, cos θ) y se
              proyecta el vector tensión: σn = Snx cos θ + Sny sin θ y
              τn = −Snx sin θ + Sny cos θ (ecs. 2.57 y 2.58).
            porque: >-
              Fija qué es cada componente y el signo de τn.
            minimo: true
          - punto: >-
              Se sustituyen Snx y Sny de la relación del enunciado y se llega a
              σn = σx cos²θ + σy sin²θ + 2τxy sin θ cos θ y
              τn = (σy − σx) sin θ cos θ + τxy (cos²θ − sin²θ) (ec. 2.59).
            porque: >-
              Es la cuenta, en el ángulo simple.
            minimo: true
          - punto: >-
              Con cos²θ = (1 + cos 2θ)/2, sin²θ = (1 − cos 2θ)/2 y
              2 sin θ cos θ = sin 2θ (ec. 2.60) se llega a
              σn = (σx + σy)/2 + (σx − σy)/2·cos 2θ + τxy sin 2θ y
              τn = (σy − σx)/2·sin 2θ + τxy cos 2θ (ec. 2.61).
            porque: >-
              Es lo que pide el enunciado.
            minimo: true
          - punto: >-
              Se dice qué es θ (el ángulo de x a la normal, antihorario) y que
              τn es positiva en el sentido de t.
            porque: >-
              Sin el convenio, el signo de τn no significa nada.
          - punto: >-
              Se comenta lo que sale de ahí: las direcciones principales,
              tan 2θ1 = 2τxy/(σx − σy), donde τn = 0 (ec. 2.62), y las de τn
              máxima, a 45° de ellas (ec. 2.64).
            porque: >-
              Es para lo que sirven las fórmulas, y lleva al círculo de Mohr.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Con $\hat n = (\cos\theta, \sin\theta)$ y
              $\hat t = (-\sin\theta, \cos\theta)$,
              $\sigma_n = \mathbf S_n\cdot\hat n$ y
              $\tau_n = \mathbf S_n\cdot\hat t$.
          - texto: >-
              Sustituyendo las componentes de $\mathbf S_n$ del enunciado,
              $\sigma_n = \sigma_x\cos^2\theta + \sigma_y\sin^2\theta + 2\tau_{xy}\sin\theta\cos\theta$.
          - texto: >-
              Con $\cos^2\theta = (1 + \cos2\theta)/2$ y
              $\sin^2\theta = (1 - \cos2\theta)/2$, las dos componentes quedan
              en función de $2\theta$.
          - texto: >-
              El resultado es
              $\sigma_n = \tfrac{\sigma_x + \sigma_y}{2} + \tfrac{\sigma_x - \sigma_y}{2}\cos2\theta + \tau_{xy}\sin2\theta$
              y
              $\tau_n = \tfrac{\sigma_y - \sigma_x}{2}\sin2\theta + \tau_{xy}\cos2\theta$.
          - texto: >-
              Para pasar al ángulo doble se usa
              $\cos^2\theta = (1 - \cos2\theta)/2$.
            trampa: true
            mensaje: |
              Esa es la de $\sin^2\theta$. La buena es
              $\cos^2\theta = (1 + \cos2\theta)/2$ (ec. 2.60): con la
              cambiada, el término de $(\sigma_x - \sigma_y)$ sale con el signo
              al revés, y en $\theta = 0$ no daría $\sigma_n = \sigma_x$.
    resolucion: |
      **Las direcciones.** El plano tiene la normal
      $\hat n = \cos\theta\,\hat i + \sin\theta\,\hat j$, con $\theta$ el
      ángulo de $x$ a $\hat n$, antihorario, y la dirección tangencial es la
      de $\hat n$ girada 90° antihorario,
      $\hat t = -\sin\theta\,\hat i + \cos\theta\,\hat j$ (apuntes del tema 2,
      ec. 2.57, p. 22). La relación del enunciado es la de Cauchy en tensión
      plana (ec. 2.56):
      $S_{nx} = \sigma_x\cos\theta + \tau_{xy}\sin\theta$ y
      $S_{ny} = \tau_{xy}\cos\theta + \sigma_y\sin\theta$.

      **Las proyecciones** (ec. 2.58):
      $\sigma_n = \mathbf S_n\cdot\hat n = S_{nx}\cos\theta + S_{ny}\sin\theta$
      y $\tau_n = \mathbf S_n\cdot\hat t = -S_{nx}\sin\theta + S_{ny}\cos\theta$.
      Sustituyendo (ec. 2.59):

      $$
      \begin{aligned}
      \sigma_n &= \sigma_x\cos^2\theta + \sigma_y\sin^2\theta + 2\tau_{xy}\sin\theta\cos\theta\\
      \tau_n &= (\sigma_y - \sigma_x)\sin\theta\cos\theta + \tau_{xy}(\cos^2\theta - \sin^2\theta)
      \end{aligned}
      $$

      **El ángulo doble.** Con $\cos^2\theta = \tfrac{1}{2}(1 + \cos2\theta)$,
      $\sin^2\theta = \tfrac{1}{2}(1 - \cos2\theta)$,
      $2\sin\theta\cos\theta = \sin2\theta$ y
      $\cos^2\theta - \sin^2\theta = \cos2\theta$ (ec. 2.60):

      $$
      \sigma_n = \frac{\sigma_x + \sigma_y}{2} + \frac{\sigma_x - \sigma_y}{2}\cos2\theta + \tau_{xy}\sin2\theta,\qquad
      \tau_n = \frac{\sigma_y - \sigma_x}{2}\sin2\theta + \tau_{xy}\cos2\theta\qquad\text{(ec. 2.61, p. 23)}
      $$

      $\tau_n$ es positiva en el sentido de $\hat t$. En $\theta = 0$ se
      recuperan $\sigma_n = \sigma_x$ y $\tau_n = \tau_{xy}$.

      **Lo que sale de ahí.** $\sigma_n$ es estacionaria donde
      $\tan2\theta_1 = 2\tau_{xy}/(\sigma_x - \sigma_y)$ (ec. 2.62), y allí
      $\tau_n = 0$: son las direcciones principales, perpendiculares entre sí.
      $\tau_n$ es máxima en las direcciones a 45° de ellas (ec. 2.64). Y la
      suma de las $\sigma_n$ de dos planos perpendiculares es siempre
      $\sigma_x + \sigma_y$.

      **Un ejemplo nuestro.** Con $\sigma_x$ = 80, $\sigma_y$ = 20 y
      $\tau_{xy}$ = 40 MPa, en el plano de $\theta$ = 60° ($2\theta$ = 120°):
      $\sigma_n = 50 - 15 + 20\sqrt{3} = 69{,}64$ MPa y
      $\tau_n = -15\sqrt{3} - 20 = -45{,}98$ MPa. Por Cauchy,
      $\mathbf S_n = (74{,}64,\ 37{,}32)$ MPa, y sus proyecciones sobre
      $\hat n$ y $\hat t$ dan lo mismo; el motor del curso, también.

  # ── Teoría · cuestión 2 · el criterio de Von Mises (tema 6).
  - id: exerm1718-ord-2-el-criterio-de-von-mises-desde-la-energia
    titulo: El criterio de Von Mises, deducido desde la energía de deformación
    fuente: >-
      Cuestión 2 de teoría · Examen final del 19 de enero de 2018 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El primer parcial de 2019-2020 pide
      lo mismo con otro enunciado («Deducir la tensión equivalente del
      criterio de Von Mises…», con la energía escrita de otra forma), y el
      sitio lo resuelve con otro ejemplo. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 6, apartado 6.6
      (págs. 10 a 12). Los números de los pasos de cálculo son un ejemplo
      nuestro, comprobado con el motor del curso y por un segundo camino.
    nivel: examen
    enunciado: |
      (1p) Deducir el criterio de Von Mises. La energía de deformación por
      unidad de volumen es:

      $$
      2U_0 = \sigma_x\varepsilon_x + \sigma_y\varepsilon_y + \sigma_z\varepsilon_z
      + \tau_{xy}\gamma_{xy} + \tau_{yz}\gamma_{yz} + \tau_{zx}\gamma_{zx}
      $$
    pide: >-
      La deducción del criterio de Von Mises a partir de la energía de
      deformación, y, en un ejemplo nuestro, la tensión equivalente y la
      energía que cuenta el criterio.
    pasos:
      - tipo: reconocer
        pregunta: |
          La deducción iguala la energía de distorsión del punto con la de un
          estado de referencia. ¿Cuál?
        opciones:
          - texto: >-
              La tracción simple, con $\sigma_x = \sigma_{eqv}$ y lo demás
              nulo
            correcta: true
            mensaje: |
              Eso es (ec. 6.27). La tensión equivalente es la de una tracción
              simple con la misma energía de distorsión que el punto: así se
              compara con el límite elástico, que sale de un ensayo de
              tracción.
          - texto: >-
              La cortadura pura, con $\tau_{xy} = \sigma_{eqv}$
            mensaje: |
              La cortadura pura sale después, como caso particular: con la
              ec. 6.30, $\sigma_{eqv} = \sqrt{3}\,\tau$, y de ahí el límite en
              cortadura, $\sigma_e/\sqrt{3}$. Con lo que se iguala es con el
              ensayo que da $\sigma_e$: la tracción simple.
          - texto: >-
              Un estado hidrostático con la misma tensión media
            mensaje: |
              Un estado hidrostático no tiene energía de distorsión, solo de
              cambio de volumen: no habría nada con que comparar. Es justo la
              parte que el criterio quita.
      - tipo: calcular
        titulo: La tensión equivalente
        pregunta: |
          En un punto de una pieza de acero, $\sigma_1$ = 120, $\sigma_2$ = 40
          y $\sigma_3$ = −60 MPa. ¿Cuánto vale la tensión equivalente de Von
          Mises, en MPa?
        respuesta:
          tipo: numero
          valor: '156.20'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '180.00'
            mensaje: |
              Es la de Tresca, $\sigma_1 - \sigma_3$ (ec. 6.19). Von Mises
              cuenta las tres diferencias entre principales, no solo la mayor,
              y da menos: el hexágono de Tresca queda dentro de la elipse de
              Von Mises (figura 6.5).
          - valor: '220.91'
            mensaje: |
              Falta el ½ dentro de la raíz:
              $\sigma_{eqv} = \sqrt{\tfrac{1}{2}\left[(\sigma_1 - \sigma_2)^2 + (\sigma_2 - \sigma_3)^2 + (\sigma_3 - \sigma_1)^2\right]}$
              (ec. 6.29). Sale de igualar con la tracción simple, donde dos de
              las tres diferencias valen $\sigma_{eqv}$.
          - valor: '149.93'
            mensaje: |
              Es lo que sale igualando la energía **total** con la de la
              tracción simple, con $\nu$ = 0,3:
              $\sqrt{\sigma_1^2 + \sigma_2^2 + \sigma_3^2 - 2\nu(\sigma_1\sigma_2 + \sigma_2\sigma_3 + \sigma_3\sigma_1)}$.
              Von Mises quita antes la energía de cambio de volumen.
        pista: |
          $\sigma_{eqv} = \sqrt{\tfrac{1}{2}\left[(\sigma_1 - \sigma_2)^2 + (\sigma_2 - \sigma_3)^2 + (\sigma_3 - \sigma_1)^2\right]}$
          (ec. 6.29).
        desarrollo: |
          $$
          \sigma_{eqv} = \sqrt{\tfrac{1}{2}\left(80^2 + 100^2 + 180^2\right)} = \sqrt{24\,400} = 156{,}20\ \text{MPa}
          $$

          Con un límite elástico de 250 MPa, el coeficiente de seguridad es
          $250/156{,}20 = 1{,}60$.
      - tipo: calcular
        titulo: La energía de distorsión
        pregunta: |
          Con $E$ = 200 GPa y $\nu$ = 0,3, ¿cuánta energía de distorsión por
          unidad de volumen hay en ese punto, en kJ/m³?
        respuesta:
          tipo: numero
          valor: '52.87'
          tolerancia: 0.05
          formato: un número, en kJ/m³
        distractores:
          - valor: '56.20'
            mensaje: |
              Esa es la energía **total**, $U_0$ (ec. 6.23). La de distorsión
              es lo que queda al quitarle la de cambio de volumen,
              $U_0^v = \tfrac{1 - 2\nu}{6E}(\sigma_1 + \sigma_2 + \sigma_3)^2$
              (ec. 6.25).
          - valor: '3.33'
            mensaje: |
              Esa es la de cambio de volumen, $U_0^v$ (ec. 6.25), la que el
              criterio deja fuera. La de distorsión es el resto.
          - valor: '105.73'
            mensaje: |
              El doble: has usado $(1 + \nu)/(3E)$, el coeficiente del estado
              equivalente (ec. 6.27, con una sola tensión), sobre la suma de las
              tres diferencias al cuadrado. Con las tres, el coeficiente es
              $(1 + \nu)/(6E)$ (ec. 6.26 dividida por 2).
        pista: |
          $U_0^d = \dfrac{1 + \nu}{6E}\left[(\sigma_1 - \sigma_2)^2 + (\sigma_2 - \sigma_3)^2 + (\sigma_3 - \sigma_1)^2\right]$,
          con $E$ en MPa: sale en MPa, que son MJ/m³.
        desarrollo: |
          $$
          U_0^d = \frac{1{,}3}{6\cdot2\cdot10^5}\cdot48\,800 = 0{,}05287\ \text{MPa} = 52{,}87\ \text{kJ/m}^3
          $$

          La de cambio de volumen,
          $\tfrac{0{,}4}{6\cdot2\cdot10^5}\cdot100^2$, es solo
          $3{,}33$ kJ/m³, y las dos suman $U_0 = 56{,}20$ kJ/m³.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción como en el examen, de la energía de deformación a
          la tensión equivalente de Von Mises.
        rubrica:
          - punto: >-
              Se enuncia el criterio: el fallo ocurre cuando la energía de
              distorsión llega a un valor crítico; la energía se separa en la de
              cambio de volumen y la de distorsión, U0 = U0v + U0d (ecs. 6.20 y
              6.21).
            porque: >-
              Es la hipótesis, y explica por qué se quita una parte.
            minimo: true
          - punto: >-
              Con la ley de Hooke en la expresión del enunciado,
              2U0 = (σx² + σy² + σz²)/E − 2ν(σxσy + σyσz + σzσx)/E +
              (τxy² + τyz² + τzx²)/G (ec. 6.23).
            porque: >-
              Pone la energía en función de las tensiones, que es lo que se
              compara.
            minimo: true
          - punto: >-
              Con la parte esférica, σe = (σx + σy + σz)/3 (ec. 6.24), la
              energía de cambio de volumen es 2U0v = (1 − 2ν)(σx + σy + σz)²/(3E)
              (ec. 6.25), y restando sale 2U0d (ec. 6.26).
            porque: >-
              Es el paso que distingue a Von Mises de un criterio de energía
              total.
            minimo: true
          - punto: >-
              Se aplica al estado equivalente, tracción simple σeqv:
              2U0d = 2(1 + ν)σeqv²/(3E) (ec. 6.27), y se igualan las dos.
            porque: >-
              Es lo que convierte una energía en una tensión comparable con el
              ensayo.
            minimo: true
          - punto: >-
              Se escribe el resultado: σeqv² = ½[(σx − σy)² + (σy − σz)² +
              (σz − σx)²] + 3(τxy² + τyz² + τzx²) (ec. 6.28), en principales
              (ec. 6.29) y en tensión plana (ecs. 6.30 y 6.31), con la
              condición σeqv ≤ σe.
            porque: >-
              Es la fórmula que se usa.
          - punto: >-
              Se comenta que vale para materiales dúctiles y que, en tensión
              plana, es una elipse que contiene al hexágono de Tresca, así que
              Tresca va del lado de la seguridad (figura 6.5).
            porque: >-
              Sitúa el criterio frente al otro de los dúctiles.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              El fallo ocurre cuando la energía de distorsión llega a un valor
              crítico: $U_0^d = U_0 - U_0^v$.
          - texto: >-
              Con Hooke, $2U_0$ queda en función de las tensiones, y la parte
              esférica da $2U_0^v = \tfrac{1 - 2\nu}{3E}(\sigma_x + \sigma_y + \sigma_z)^2$.
          - texto: >-
              Restando sale $2U_0^d$, que solo depende de las diferencias entre
              tensiones normales y de las tangenciales.
          - texto: >-
              Igualando con la de la tracción simple,
              $2U_0^d = \tfrac{2(1 + \nu)}{3E}\sigma_{eqv}^2$, sale
              $\sigma_{eqv}$.
          - texto: >-
              La energía de cambio de volumen se deja dentro, porque también
              deforma el material y lo acerca al fallo.
            trampa: true
            mensaje: |
              Es justo la que se quita. Un estado hidrostático solo tiene
              energía de cambio de volumen y no hace plastificar un metal: con
              ella dentro, el criterio predeciría fallos que los ensayos no
              ven.
    resolucion: |
      **La hipótesis.** Según Von Mises, el fallo ocurre cuando la energía de
      distorsión alcanza un valor crítico (apuntes del tema 6, apartado 6.6,
      p. 10). La energía de deformación por unidad de volumen se separa en la
      de cambio de volumen, ligada a la parte esférica del tensor, y la de
      distorsión (ecs. 6.20 y 6.21):

      $$
      U_0 = U_0^v + U_0^d\qquad\Rightarrow\qquad U_0^d = U_0 - U_0^v
      $$

      **La energía total.** En la expresión del enunciado (ec. 6.22) se ponen
      las deformaciones en función de las tensiones con la ley de Hooke
      (ec. 6.23):

      $$
      2U_0 = \frac{1}{E}\left[\sigma_x^2 + \sigma_y^2 + \sigma_z^2 - 2\nu(\sigma_x\sigma_y + \sigma_y\sigma_z + \sigma_z\sigma_x)\right] + \frac{1}{G}\left(\tau_{xy}^2 + \tau_{yz}^2 + \tau_{zx}^2\right)
      $$

      **La de cambio de volumen.** La parte esférica es una tensión
      $\sigma_e = (\sigma_x + \sigma_y + \sigma_z)/3$ igual en las tres
      direcciones y sin tangenciales (ec. 6.24); llevada a la expresión
      anterior (ec. 6.25):

      $$
      2U_0^v = \frac{3(1 - 2\nu)}{E}\sigma_e^2 = \frac{1 - 2\nu}{3E}(\sigma_x + \sigma_y + \sigma_z)^2
      $$

      **La de distorsión.** Restando, con $G = E/[2(1 + \nu)]$ (ec. 6.26):

      $$
      2U_0^d = \frac{1 + \nu}{3E}\left[(\sigma_x - \sigma_y)^2 + (\sigma_y - \sigma_z)^2 + (\sigma_z - \sigma_x)^2\right] + \frac{1}{G}\left(\tau_{xy}^2 + \tau_{yz}^2 + \tau_{zx}^2\right)
      $$

      **El estado equivalente.** En tracción simple, $\sigma_x = \sigma_{eqv}$
      y lo demás nulo, $2U_0^d = \tfrac{2(1 + \nu)}{3E}\sigma_{eqv}^2$
      (ec. 6.27). Igualando las dos energías de distorsión (ec. 6.28):

      $$
      \sigma_{eqv} = \sqrt{\tfrac{1}{2}\left[(\sigma_x - \sigma_y)^2 + (\sigma_y - \sigma_z)^2 + (\sigma_z - \sigma_x)^2\right] + 3\left(\tau_{xy}^2 + \tau_{yz}^2 + \tau_{zx}^2\right)}
      $$

      En principales,
      $\sigma_{eqv} = \sqrt{\tfrac{1}{2}\left[(\sigma_1 - \sigma_2)^2 + (\sigma_2 - \sigma_3)^2 + (\sigma_3 - \sigma_1)^2\right]}$
      (ec. 6.29); en tensión plana,
      $\sigma_{eqv} = \sqrt{\sigma_x^2 - \sigma_x\sigma_y + \sigma_y^2 + 3\tau_{xy}^2}$
      (ec. 6.30), y con las principales del plano,
      $\sqrt{\sigma_1^2 - \sigma_1\sigma_2 + \sigma_2^2}$ (ec. 6.31). **El
      criterio: no hay fallo si $\sigma_{eqv} \le \sigma_e$**, ahora el límite
      elástico, no la tensión esférica de arriba (los apuntes usan la misma
      letra para las dos). Vale para materiales dúctiles; en tensión plana es una elipse que contiene al
      hexágono de Tresca, que por eso va del lado de la seguridad (figura 6.5,
      p. 12).

      **Un ejemplo nuestro.** Con $\sigma_1$ = 120, $\sigma_2$ = 40 y
      $\sigma_3$ = −60 MPa: $\sigma_{eqv} = \sqrt{24\,400} = 156{,}20$ MPa,
      y con $\sigma_e$ = 250 MPa, un coeficiente de seguridad de
      $1{,}60$ (Tresca daría 180 MPa). Con $E$ = 200 GPa y $\nu$ = 0,3,
      la energía total es $U_0 = 56{,}20$ kJ/m³, de la que
      $U_0^v = 3{,}33$ kJ/m³ es de cambio de volumen y
      $U_0^d = 52{,}87$ kJ/m³, de distorsión. El motor del curso da lo
      mismo.

  # ── Ejercicio 1 · dos galgas a 45° y σx (tema 3, con el 4 y el 2).
  - id: exerm1718-ord-5-dos-galgas-a-45-grados-y-sigma-x
    titulo: Dos galgas a 45° de los ejes y una tensión conocida, en tensión plana
    fuente: >-
      Ejercicio 1 · Examen final del 19 de enero de 2018 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1,5 puntos. El examen no publica resolución; el
      desarrollo es nuestro, con los temas 2, 3 y 4, y las cifras salen del
      motor del curso y de un segundo camino.
    nivel: examen
    enunciado: |
      (1,5p) En un estado de tensión plana se conocen el valor de $\sigma_x$ y
      las deformaciones dadas por las galgas a, b de la figura. Determinar las
      tensiones y direcciones principales que corresponden al plano O$xy$ y la
      tensión tangencial máxima en el espacio.

      $E$ = 70 GPa, $G$ = 26,3 GPa

      $\varepsilon_a$= 400·10⁻⁶; $\varepsilon_b$ = 1200·10⁻⁶; $\sigma_x$ = 400 MPa

