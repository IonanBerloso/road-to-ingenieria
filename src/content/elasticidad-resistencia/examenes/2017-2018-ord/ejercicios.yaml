      <polygon points="179.1,146.3 146.6,113.8 155.8,104.6 188.3,137.1" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.1"/><polyline points="178.4,142.8 180.1,131.7 169,133.4 170.7,122.3 159.6,123.9 161.2,112.9 150.1,114.5" fill="none" stroke="var(--ink)" stroke-width=".8"/>
