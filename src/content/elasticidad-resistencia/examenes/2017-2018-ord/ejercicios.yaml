      **Notas nuestras.** La galga a está sobre la recta a 45° de $x$ y la b,
      sobre la de 135°: las dos a 45° de la horizontal, una a cada lado. Se
      conservan «se conocen el valor» y «$\varepsilon_a$= 400·10⁻⁶» sin
      espacio antes del igual.
    pide: >-
      Las tensiones principales y sus direcciones en el plano Oxy, y la
      tensión tangencial máxima en el espacio.
    pasos:
      - tipo: reconocer
        pregunta: |
          El estado plano tiene tres incógnitas, y las galgas dan dos lecturas.
          ¿Qué da la tercera ecuación?
        opciones:
          - texto: >-
              El dato $\sigma_x$, con la ley de Hooke de la tensión plana
            correcta: true
            mensaje: |
              Eso es. Las galgas dan, por la ec. 3.55,
              $\varepsilon_a + \varepsilon_b = \varepsilon_x + \varepsilon_y$ y
              $\varepsilon_a - \varepsilon_b = \gamma_{xy}$. La tercera es
              Hooke con $\sigma_z = 0$: sumando las dos primeras de la
              ec. 4.24,
              $\varepsilon_x + \varepsilon_y = (1 - \nu)(\sigma_x + \sigma_y)/E$,
              y con $\sigma_x$ conocida sale $\sigma_y$.
          - texto: >-
              La $\varepsilon_z = 0$ de la tensión plana
            mensaje: |
              En tensión plana la nula es $\sigma_z$, no $\varepsilon_z$:
              $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E \neq 0$ (ec. 4.24).
              $\varepsilon_z = 0$ es la deformación plana.
          - texto: >-
              El módulo $G$, que da $\gamma_{xy}$
            mensaje: |
              $G$ convierte $\gamma_{xy}$ en $\tau_{xy}$ y, con $E$, da $\nu$;
              pero $\gamma_{xy}$ ya sale de las galgas. Sin $\sigma_x$ quedaría
              suelta la diferencia $\varepsilon_x - \varepsilon_y$.
          - texto: >-
              Nada más: con las galgas a 45° de los ejes ya se tienen
              $\varepsilon_x$ y $\varepsilon_y$
            mensaje: |
              Las galgas a ±45° solo dan la suma
              $\varepsilon_x + \varepsilon_y$ y $\gamma_{xy}$. Ninguna mide
              según $x$ o según $y$, así que la diferencia
              $\varepsilon_x - \varepsilon_y$ queda sin determinar.
      - tipo: calcular
        titulo: La tensión normal según y
        pregunta: |
          ¿Cuánto vale $\sigma_y$, en MPa?
        respuesta:
          tipo: numero
          valor: '-232.64'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '-240.00'
            mensaje: |
              Has tomado $\nu$ = 0,3. El enunciado da $E$ y $G$ para que lo
              saques: $\nu = E/(2G) - 1 = 0{,}3308$ (ec. 4.6).
          - valor: '-288.00'
            mensaje: |
              Has hecho $\varepsilon_x + \varepsilon_y = (\sigma_x + \sigma_y)/E$,
              sin el efecto Poisson. Sumando las dos primeras de la ec. 4.24
              queda $(1 - \nu)(\sigma_x + \sigma_y)/E$.
          - valor: '-315.84'
            mensaje: |
              Has puesto $1 + \nu$ en lugar de $1 - \nu$. En la suma
              $\varepsilon_x + \varepsilon_y$ cada tensión acorta la otra
              dirección: $(\sigma_x - \nu\sigma_y) + (\sigma_y - \nu\sigma_x) = (1 - \nu)(\sigma_x + \sigma_y)$.
        pista: |
          $\nu = E/(2G) - 1$ (ec. 4.6) y
          $\varepsilon_a + \varepsilon_b = \varepsilon_x + \varepsilon_y = \dfrac{1 - \nu}{E}(\sigma_x + \sigma_y)$.
        desarrollo: |
          $\nu = \dfrac{70}{2\cdot26{,}3} - 1 = 0{,}3308$ y
          $\varepsilon_x + \varepsilon_y = 1600\cdot10^{-6}$:

          $$
          \sigma_x + \sigma_y = \frac{E(\varepsilon_a + \varepsilon_b)}{1 - \nu} = \frac{70\,000\cdot1600\cdot10^{-6}}{1 - 0{,}3308} = 167{,}36\ \text{MPa}
          $$

          y $\sigma_y = 167{,}36 - 400 = -232{,}64$ MPa.
      - tipo: calcular
        titulo: La dirección principal de σ1
        pregunta: |
          ¿Qué ángulo forma con el eje $x$ la dirección de la tensión
          principal mayor, en grados (entre −90° y 90°, antihorario
          positivo)?
        respuesta:
          tipo: numero
          valor: '-1.90'
          tolerancia: 0.05
          formato: un número, en grados
        distractores:
          - valor: '1.90'
            mensaje: |
              El signo: $\tau_{xy} = G\gamma_{xy}$ es negativa, porque la galga
              a, a 45°, lee menos que la b, a 135°:
              $\gamma_{xy} = \varepsilon_a - \varepsilon_b < 0$. Con
              $\sigma_x > \sigma_y$, $\tan2\theta_1 < 0$ y la dirección queda
              un poco por debajo de $x$.
          - valor: '-3.81'
            mensaje: |
              Ese es $2\theta_1$. La ec. 2.62 da la tangente del ángulo doble:
              hay que dividir por 2.
          - valor: '88.10'
            mensaje: |
              Esa es la otra dirección principal, la de $\sigma_2$,
              perpendicular. La de $\sigma_1$ es la más cercana a la tensión
              normal mayor, aquí $\sigma_x$.
        pista: |
          $\tau_{xy} = G\gamma_{xy}$ con $\gamma_{xy} = \varepsilon_a - \varepsilon_b$,
          y $\tan2\theta_1 = \dfrac{2\tau_{xy}}{\sigma_x - \sigma_y}$ (ec. 2.62).
        desarrollo: |
          $\gamma_{xy} = (400 - 1200)\cdot10^{-6} = -800\cdot10^{-6}$ y
          $\tau_{xy} = 26\,300\cdot(-800\cdot10^{-6}) = -21{,}04$ MPa:

          $$
          \tan2\theta_1 = \frac{2\cdot(-21{,}04)}{400 - (-232{,}64)},\qquad \theta_1 = -1{,}90^\circ
          $$

          La de $\sigma_2$ es la perpendicular, a $88{,}10^\circ$.
      - tipo: calcular
        titulo: La tangencial máxima en el espacio
        pregunta: |
          ¿Cuánto vale la tensión tangencial máxima en el espacio, en MPa?
        respuesta:
          tipo: numero
          valor: '317.02'
          tolerancia: 0.1
          formato: un número, en MPa
        distractores:
          - valor: '200.35'
            mensaje: |
              Es $\sigma_1/2$, el radio del círculo entre $\sigma_1$ y la
              $\sigma_z = 0$. Pero aquí $\sigma_2$ es negativa, así que la
              menor de las tres es $\sigma_2$, no la nula: el círculo mayor es
              el de $\sigma_1$ y $\sigma_2$ (figura 2.15).
          - valor: '634.03'
            mensaje: |
              Es $\sigma_1 - \sigma_2$, el diámetro del círculo. La tangencial
              máxima es el radio: la mitad.
        pista: |
          Ordena las tres principales, con $\sigma_z = 0$ entre ellas, y
          $\tau_{max} = (\sigma_{mayor} - \sigma_{menor})/2$ (figura 2.15).
        desarrollo: |
          Centro $(\sigma_x + \sigma_y)/2 = 83{,}68$ MPa y radio
          $R = \sqrt{\left(\tfrac{\sigma_x - \sigma_y}{2}\right)^2 + \tau_{xy}^2} = 317{,}02$ MPa:
          $\sigma_1 = 400{,}70$ y $\sigma_2 = -233{,}34$ MPa. La nula queda
          entre las dos, y

          $$
          \tau_{max} = \frac{\sigma_1 - \sigma_2}{2} = R = 317{,}02\ \text{MPa}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Las galgas a 45° y 135° dan
              $\varepsilon_x + \varepsilon_y = \varepsilon_a + \varepsilon_b$ y
              $\gamma_{xy} = \varepsilon_a - \varepsilon_b$.
          - texto: >-
              Con $\nu = E/(2G) - 1$ y Hooke en tensión plana, la suma de
              deformaciones da $\sigma_x + \sigma_y$, y con $\sigma_x$, la
              $\sigma_y$; $\tau_{xy} = G\gamma_{xy}$.
          - texto: >-
              El círculo de Mohr del plano da $\sigma_1$, $\sigma_2$ y la
              dirección $\tan2\theta_1 = 2\tau_{xy}/(\sigma_x - \sigma_y)$.
          - texto: >-
              Como $\sigma_2 < 0 < \sigma_1$, la tangencial máxima del espacio
              es la del propio plano, $(\sigma_1 - \sigma_2)/2$.
          - texto: >-
              Como el estado es de tensión plana, $\varepsilon_z$ también es
              nula, y entra como tercera ecuación.
            trampa: true
            mensaje: |
              En tensión plana es nula $\sigma_z$, y $\varepsilon_z$ no:
              $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E$ (ec. 4.24), que
              aquí vale $-791\cdot10^{-6}$. La tercera ecuación la
              da el dato $\sigma_x$.
    resolucion: |
      **Las galgas.** La deformación en una dirección $\mathbf u$ del plano
      $xy$ es
      $\varepsilon_u = \varepsilon_xu_x^2 + \varepsilon_yu_y^2 + \gamma_{xy}u_xu_y$
      (apuntes del tema 3, ec. 3.55, p. 17). Con a a 45° de $x$ y b a 135°:

      $$
      \varepsilon_a = \frac{\varepsilon_x + \varepsilon_y}{2} + \frac{\gamma_{xy}}{2},\qquad
      \varepsilon_b = \frac{\varepsilon_x + \varepsilon_y}{2} - \frac{\gamma_{xy}}{2}
      $$

      de donde $\varepsilon_x + \varepsilon_y = \varepsilon_a + \varepsilon_b = 1600\cdot10^{-6}$
      y $\gamma_{xy} = \varepsilon_a - \varepsilon_b = -800\cdot10^{-6}$.

      **El material.** $G = E/[2(1 + \nu)]$ (tema 4, ec. 4.6, p. 5) da
      $\nu = E/(2G) - 1 = 0{,}3308$.

      **Las tensiones.** En tensión plana ($\sigma_z = 0$), sumando las dos
      primeras de la ec. 4.24 (p. 9),
      $\varepsilon_x + \varepsilon_y = (1 - \nu)(\sigma_x + \sigma_y)/E$:

      $$
      \sigma_x + \sigma_y = \frac{70\,000\cdot1600\cdot10^{-6}}{1 - 0{,}3308} = 167{,}36\ \text{MPa}
      \quad\Rightarrow\quad \sigma_y = -232{,}64\ \text{MPa}
      $$

      y $\tau_{xy} = G\gamma_{xy} = -21{,}04$ MPa (ec. 4.13, p. 7).

      **Las principales del plano** (tema 2): centro
      $(\sigma_x + \sigma_y)/2 = 83{,}68$ MPa y radio
      $R = \sqrt{\left(\tfrac{\sigma_x - \sigma_y}{2}\right)^2 + \tau_{xy}^2} = 317{,}02$ MPa:

      $$
      \sigma_1 = 400{,}70\ \text{MPa},\qquad \sigma_2 = -233{,}34\ \text{MPa}
      $$

      **Las direcciones** (ec. 2.62):
      $\tan2\theta_1 = 2\tau_{xy}/(\sigma_x - \sigma_y)$, negativa: la de
      $\sigma_1$ forma $\theta_1 = -1{,}90^\circ$ con $x$ (un poco por
      debajo, en sentido horario), y la de $\sigma_2$, perpendicular, $88{,}10^\circ$.
      Cerca de los ejes, porque $\tau_{xy}$ es pequeña frente a
      $\sigma_x - \sigma_y$.

      **La tangencial máxima en el espacio.** La tercera principal es
      $\sigma_z = 0$, que queda entre $\sigma_2 < 0$ y $\sigma_1 > 0$: el
      círculo mayor es el del plano (figura 2.15, p. 28), y

      $$
      \tau_{max} = \frac{\sigma_1 - \sigma_2}{2} = 317{,}02\ \text{MPa}
      $$

      en los planos a 45° de las direcciones 1 y 2, que contienen al eje $z$.
      Las cifras salen del motor del curso (la ley de Hooke de la tensión
      plana y las galgas, como caja negra) y de las cuentas de arriba, y
      casan.

  # ── Ejercicio 3 · la pieza de dos diámetros (tema 10). Es el ejercicio 2 de
  #    la 2.ª parte con una palabra más y otros puntos: ejercicio propio,
  #    resuelto por otro camino (los teoremas de Mohr).
  - id: exerm1718-ord-7-la-pieza-de-dos-diametros-con-voladizo
    titulo: La pieza circular de dos diámetros con un voladizo cargado, por los teoremas de Mohr
    fuente: >-
      Ejercicio 3 · Examen final del 19 de enero de 2018 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1,5 puntos. Es el ejercicio 2 de la segunda parte del mismo día,
      que vale 2 puntos, con «y siendo» donde aquel dice «, siendo»; aquí se
      resuelve por otro camino. El examen no publica resolución; el
      desarrollo es nuestro, con el tema 10, y las cifras salen del motor del
      curso y de un segundo camino.
    nivel: examen
    enunciado: |
      (1,5p) La pieza de sección circular de la figura está simplemente
      apoyada y tiene un voladizo que soporta la carga distribuida de la
      figura. Determinar los ángulos girados en B y C y el desplazamiento en C
      en función de $q_0$, $b$, $E$ e $I_z$, siendo éste el momento de inercia
      que corresponde a $d_1$ y siendo $d_2$= $2d_1$.

