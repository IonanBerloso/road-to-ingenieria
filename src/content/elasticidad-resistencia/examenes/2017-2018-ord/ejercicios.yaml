      **Notas nuestras.** A y B son los apoyos y C, el extremo libre del
      voladizo. Los giros y la flecha van con el convenio del tema 10: $v$
      hacia abajo y $\theta$ positivo en sentido horario. Se conserva
      «$d_2$= $2d_1$» sin espacio antes del igual.
    pide: >-
      Los giros de las secciones B y C y la flecha de C, en función de q0, b,
      E e Iz.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para aplicar los teoremas de Mohr hay que arrancar de una tangente
          conocida. ¿Cuál?
        opciones:
          - texto: >-
              Ninguna se conoce de antemano: el segundo teorema entre A y B,
              con $v_A = v_B = 0$, da el giro de A, y de ahí se sigue
            correcta: true
            mensaje: |
              Eso es. La distancia de B′ a la tangente en A′ es
              $\delta_{B,A} = v_A + \theta_Ab - v_B = \theta_Ab$, y el segundo
              teorema la da con el momento estático del diagrama $M/EI$ de AB
              respecto de B (ec. 10.20). Con $\theta_A$, el primer teorema da
              $\theta_B$ (ec. 10.16), y otra vez los dos entre B y C, el giro y
              la flecha de C.
          - texto: >-
              La de B, horizontal porque B es un apoyo
            mensaje: |
              Un apoyo impide la flecha, no el giro: $v_B = 0$, pero
              $\theta_B \neq 0$. La pieza pasa por B inclinada, y esa
              inclinación es la que se lleva el voladizo.
          - texto: >-
              La de C, horizontal porque C es el extremo libre
            mensaje: |
              Un extremo libre tiene flecha y giro: nada lo sujeta. La tangente
              horizontal conocida está en los empotramientos, y aquí no hay
              ninguno.
          - texto: >-
              La de A, horizontal porque es el apoyo del extremo
            mensaje: |
              Igual que en B: el apoyo solo fija $v_A = 0$. A gira, y hacia el
              lado contrario que B, porque AB se curva hacia arriba entre los
              apoyos.
      - tipo: calcular
        titulo: El giro de B
        pregunta: |
          ¿Cuánto gira la sección B? Escríbelo como
          $\theta_B = k\,q_0b^3/(EI_z)$, con $k$ positivo en sentido horario.
        respuesta:
          tipo: numero
          valor: '0.03125'
          tolerancia: 0.0005
          formato: un número, k (positivo horario)
        distractores:
          - valor: '0.500'
            mensaje: |
              Es lo que sale con la misma rigidez en los dos tramos. El
              diagrama que entra en los teoremas es $M/EI$, y en AB la inercia
              es $\pi d_2^4/64 = 16I_z$: el área y el momento estático de AB
              son dieciséis veces menores.
          - valor: '0.250'
            mensaje: |
              Has tomado $I_{AB} = 2I_z$ por tener el doble de diámetro. La
              inercia del círculo va con $d^4$: $2^4 = 16$.
          - valor: '-0.03125'
            mensaje: |
              Tienes el signo al revés. AB tiene $M < 0$ en todo el tramo y se
              curva hacia arriba:
              en A baja hacia la izquierda (antihorario) y en B baja hacia la
              derecha (horario).
        pista: |
          Segundo teorema entre A y B: $\theta_Ab$ es el momento estático
          respecto de B del área de $M/(16EI_z)$ en AB. Primer teorema:
          $\theta_A - \theta_B = \int_A^B M/EI\,dx$.
        desarrollo: |
          En AB, $M = -\tfrac{3}{2}q_0bx$: el diagrama $M/(16EI_z)$ es un
          triángulo de área $-\tfrac{3}{64}q_0b^3/EI_z$ con su centro a $b/3$
          de B. Segundo teorema:
          $\theta_A\,b = -\tfrac{3}{64}\cdot\tfrac{b}{3}\,q_0b^3/EI_z$, así que
          $\theta_A = -\tfrac{1}{64}q_0b^3/EI_z$. Primer teorema:

          $$
          \theta_B = \theta_A - \int_A^B\frac{M}{16EI_z}dx = \left(-\frac{1}{64} + \frac{3}{64}\right)\frac{q_0b^3}{EI_z} = \frac{1}{32}\,\frac{q_0b^3}{EI_z}
          $$

          $k = 1/32 = 0{,}03125$.
      - tipo: calcular
        titulo: El giro de C
        pregunta: |
          ¿Y el giro de C, como $\theta_C = k\,q_0b^3/(EI_z)$?
        respuesta:
          tipo: numero
          valor: '1.1979'
          tolerancia: 0.002
          formato: un número, k (positivo horario)
        distractores:
          - valor: '1.6667'
            mensaje: |
              Con la misma inercia en AB, $\theta_B$ sale $1/2$ y no $1/32$, y
              arrastra a $\theta_C$. El diagrama de AB va dividido por
              $16EI_z$.
          - valor: '1.1667'
            mensaje: |
              Es solo el área de $M/EI_z$ en BC, $7/6$: lo que gira C respecto
              de B. El primer teorema da la **diferencia** de giros; a ella hay
              que sumarle $\theta_B$.
          - valor: '1.1354'
            mensaje: |
              Has restado $\theta_B$. Los dos son horarios: el voladizo sale de
              B bajando y su flector negativo lo curva más hacia abajo.
        pista: |
          Primer teorema entre B y C: $\theta_C = \theta_B - \int_B^C \dfrac{M}{EI_z}dx$,
          con $M < 0$ en BC.
        desarrollo: |
          El área de $M$ en BC es $-\tfrac{7}{6}q_0b^3$ ($-\tfrac{1}{6}$ bajo
          la carga y $-1$ en el tramo sin carga), y

          $$
          k = \frac{1}{32} + \frac{7}{6} = \frac{115}{96} = 1{,}1979
          $$
      - tipo: calcular
        titulo: La flecha de C
        pregunta: |
          ¿Cuánto baja C? Escríbelo como $v_C = k\,q_0b^4/(EI_z)$, con $k$
          positivo hacia abajo.
        respuesta:
          tipo: numero
          valor: '1.7708'
          tolerancia: 0.002
          formato: un número, k (positivo hacia abajo)
        distractores:
          - valor: '2.7083'
            mensaje: |
              Con la misma inercia en AB: el giro de B sale dieciséis veces
              mayor, y con él lo que C baja por esa inclinación. En AB va
              $16EI_z$.
          - valor: '1.7083'
            mensaje: |
              Es la distancia de C′ a la tangente en B′, $41/24$: el segundo
              teorema solo da eso. La flecha de C es esa distancia más lo que
              baja la tangente en B a lo largo de $2b$, $\theta_B\cdot2b$.
          - valor: '1.6458'
            mensaje: |
              Has restado $\theta_B\cdot2b$. Con $\theta_B$ horario, la tangente
              en B ya baja hacia C, y C queda por debajo de ella.
        pista: |
          $v_C = v_B + \theta_B\cdot2b + \delta$, con $\delta$ la distancia de
          C′ a la tangente en B′: el momento estático respecto de C del área
          de $-M/EI_z$ en BC (ec. 10.20).
        desarrollo: |
          Momento estático respecto de C del área de $-M$ en BC:
          $\left(\tfrac{1}{8} + \tfrac{19}{12}\right)q_0b^4 = \tfrac{41}{24}q_0b^4$.
          Con $v_B = 0$:

          $$
          k = 2\cdot\frac{1}{32} + \frac{41}{24} = \frac{85}{48} = 1{,}7708
          $$
      - tipo: dibujar
        consigna: |
          En papel: **el diagrama $M/EI$** de toda la pieza, con sus valores
          en A, en B a los dos lados, en $x = 2b$ y en C, y la curva elástica
          aproximada encima.
        comprueba:
          - punto: |
              **En AB**, una recta de 0 en A a $-\tfrac{3}{32}q_0b^2/EI_z$ en
              B; **en B salta** a $-\tfrac{3}{2}q_0b^2/EI_z$.
            porque: |
              $M$ es continuo en B ($-\tfrac{3}{2}q_0b^2$), pero la rigidez de
              AB es $16EI_z$ y la de BC, $EI_z$.
          - punto: |
              **En BC**, recta hasta $-\tfrac{1}{2}q_0b^2/EI_z$ en $x = 2b$ y
              parábola hasta 0 en C, con tangente horizontal en C.
            porque: |
              Sin carga el flector es lineal; bajo la repartida, parabólico, y
              en el extremo libre son nulos el flector y el cortante.
          - punto: |
              **La elástica**: entre A y B, por encima de la línea de los
              apoyos; desde B, bajando cada vez más inclinada hasta C.
            porque: |
              Con $M < 0$ la pieza se curva hacia arriba en toda su longitud:
              sube entre los apoyos, que la sujetan, y en el voladizo cae.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La estática da $R_A = -\tfrac{3}{2}q_0b$ y
              $R_B = \tfrac{5}{2}q_0b$, y el flector es negativo en toda la
              pieza; en AB se divide por $16EI_z$.
          - texto: >-
              El segundo teorema entre A y B, con $v_A = v_B = 0$, da
              $\theta_A = -\tfrac{1}{64}q_0b^3/EI_z$.
          - texto: >-
              El primero entre A y B da
              $\theta_B = \tfrac{1}{32}q_0b^3/EI_z$, y entre B y C,
              $\theta_C = \tfrac{115}{96}q_0b^3/EI_z$.
          - texto: >-
              El segundo entre B y C da la distancia de C′ a la tangente en B′,
              y sumándole $\theta_B\cdot2b$, $v_C = \tfrac{85}{48}q_0b^4/EI_z$.
          - texto: >-
              El primer teorema no se puede aplicar entre A y B porque en B hay
              un apoyo.
            trampa: true
            mensaje: |
              Un apoyo no rompe la elástica: la pieza es continua en B, con la
              misma flecha y el mismo giro a los dos lados. Lo que impide
              aplicar los teoremas a través de un punto es una rótula, donde el
              giro salta.
    resolucion: |
      **Las inercias y el flector.** Con $d_2 = 2d_1$, $I_{AB} = 2^4I_z = 16I_z$
      (la inercia del círculo es $\pi d^4/64$). Con A en $x = 0$, B en $x = b$
      y C en $x = 3b$: $R_B = \tfrac{5}{2}q_0b$ y $R_A = -\tfrac{3}{2}q_0b$
      (hacia abajo). En AB, $M = -\tfrac{3}{2}q_0bx$, hasta
      $M_B = -\tfrac{3}{2}q_0b^2$; en BC, con $s = 3b - x$ medida desde C,
      $M = -q_0b(s - b/2)$ para $b \le s \le 2b$ y $M = -q_0s^2/2$ para
      $s \le b$. El flector es negativo en toda la pieza.

      **Los teoremas de Mohr** (tema 10, apartado 10.4, pp. 10-11), con $v$
      hacia abajo y $\theta$ horario positivo: el primero,
      $\theta_A - \theta_B = \int_A^B \dfrac{M}{EI}dx$ (ec. 10.16); el
      segundo, la distancia vertical de B′ a la tangente en A′,
      $\delta_{B,A} = \int_A^B \dfrac{M}{EI}x_B\,dx$ con $x_B$ medida desde B
      (ec. 10.20), positiva si B′ queda por encima de la tangente, y
      $\delta_{B,A} = v_A + \theta_A(x_B - x_A) - v_B$.

      **No hay ninguna tangente conocida**: A y B son apoyos y giran, y C es
      libre. Se arranca del segundo teorema entre A y B, donde las dos
      flechas son nulas.

      **El giro de A.** El diagrama $M/(16EI_z)$ de AB es un triángulo de
      área $-\tfrac{3}{64}q_0b^3/EI_z$ con su centro a $b/3$ de B:
      $\delta_{B,A} = \theta_Ab = -\tfrac{1}{64}q_0b^4/EI_z$, y
      $\theta_A = -\tfrac{1}{64}q_0b^3/EI_z$ (antihorario).

      **El giro de B.** Primer teorema entre A y B:

      $$
      \theta_B = \theta_A - \left(-\frac{3}{64}\right)\frac{q_0b^3}{EI_z} = \frac{1}{32}\,\frac{q_0b^3}{EI_z}\quad\text{(horario)}
      $$

      **El giro de C.** Primer teorema entre B y C, con el área de $M$ en BC,
      $-\tfrac{1}{6}q_0b^3$ bajo la carga y $-q_0b^3$ en el tramo sin carga:

      $$
      \theta_C = \theta_B + \frac{7}{6}\,\frac{q_0b^3}{EI_z} = \frac{115}{96}\,\frac{q_0b^3}{EI_z}
      $$

      es decir, $1{,}1979\,q_0b^3/EI_z$, horario.

      **La flecha de C.** Segundo teorema entre B y C: C′ queda por debajo de
      la tangente en B′ el momento estático respecto de C del área de
      $-M/EI_z$ en BC, $\left(\tfrac{1}{8} + \tfrac{19}{12}\right)q_0b^4/EI_z = \tfrac{41}{24}q_0b^4/EI_z$.
      La tangente en B baja $\theta_B\cdot2b$ a lo largo del voladizo, y con
      $v_B = 0$:

      $$
      v_C = \left(\frac{2}{32} + \frac{41}{24}\right)\frac{q_0b^4}{EI_z} = \frac{85}{48}\,\frac{q_0b^4}{EI_z}
      $$

      es decir, $1{,}7708\,q_0b^4/EI_z$ hacia abajo. Son las mismas cifras
      que da la viga conjugada en el ejercicio de la segunda parte: los dos
      métodos son la misma integración (p. 13). El motor del curso da lo
      mismo integrando la elástica tramo a tramo.

