      Sabiendo que la transformación no cambia el volumen del prisma y que se
      tiene un estado de deformación plana (plano Oxy). Determinar las
      constantes a, b, c y d.

      **Notas nuestras.** La frase que empieza por «Sabiendo que» se
      transcribe como está, sin verbo principal. Las cotas del prisma no
      hacen falta para lo que se pide.
    pide: >-
      Las constantes a, b, c y d del campo de desplazamientos.
    pasos:
      - tipo: reconocer
        pregunta: |
          El enunciado dice que el prisma está en «deformación plana (plano
          Oxy)». ¿Qué condiciones impone eso al campo?
        opciones:
          - texto: >-
              Que se anulen la deformación según z y las dos distorsiones con
              z: $\varepsilon_z = 0$, $\gamma_{zx} = 0$ y $\gamma_{yz} = 0$
            correcta: true
            mensaje: |
              Eso es (ec. 4.26, apuntes del tema 4, p. 10). Con el campo, cada
              una es una derivada: $\varepsilon_z = w_{,z}$ (ec. 3.14, p. 8),
              $\gamma_{zx} = w_{,x} + u_{,z}$ y $\gamma_{yz} = v_{,z} + w_{,y}$
              (ec. 3.21, p. 9). Son tres ecuaciones para cuatro constantes; la
              cuarta la da el volumen.
          - texto: >-
              Que se anulen $\sigma_z$, $\tau_{zx}$ y $\tau_{yz}$
            mensaje: |
              Esa es la tensión plana (apartado 4.5.1, p. 9). Además, el
              enunciado no da ni el material: con un campo de desplazamientos
              lo que se puede imponer son condiciones sobre las deformaciones,
              y la deformación plana anula las de z (ec. 4.26, p. 10).
          - texto: >-
              Que el desplazamiento según z sea nulo en todo el prisma, $w = 0$
            mensaje: |
              Es más de lo que pide la deformación plana. Lo que tiene que ser
              nulo son las deformaciones de z (ec. 4.26): un giro de sólido
              rígido alrededor de y, por ejemplo, mueve los puntos según z sin
              deformar nada. Con $w = 0$ el sistema no tendría solución.
      - tipo: calcular
        titulo: La constante d
        pregunta: |
          ¿Cuánto vale $d$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.001
          formato: un número, sin unidades
        distractores:
          - valor: '-2'
            mensaje: |
              Te has comido el menos del término de $x$ en $w$:
              $w_{,x} = -200\cdot10^{-6}d$. Con
              $\gamma_{zx} = w_{,x} + u_{,z} = -200\cdot10^{-6}d + 400\cdot10^{-6} = 0$,
              sale $d = 2$.
          - valor: '0'
            mensaje: |
              Has tomado una sola de las dos derivadas de la distorsión. La
              ec. 3.21 suma las dos: $\gamma_{zx} = w_{,x} + u_{,z}$, y $u$
              tiene un término en $z$, $400\cdot10^{-6}z$.
        pista: |
          La distorsión del plano zx (ec. 3.21):
          $\gamma_{zx} = w_{,x} + u_{,z}$, que en deformación plana es nula.
        desarrollo: |
          $$
          \gamma_{zx} = w_{,x} + u_{,z} = -200\cdot10^{-6}\,d + 400\cdot10^{-6} = 0
          \quad\Longrightarrow\quad d = 2
          $$

          Las otras dos condiciones son inmediatas:
          $\varepsilon_z = w_{,z} = c = 0$ y
          $\gamma_{yz} = v_{,z} + w_{,y} = 0 + b = 0$.
      - tipo: calcular
        titulo: La constante a
        pregunta: |
          ¿Cuánto vale $a$, en millonésimas ($10^{-6}$)?
        respuesta:
          tipo: numero
          valor: '900'
          tolerancia: 0.5
          formato: un número con su signo, en millonésimas (10⁻⁶)
        distractores:
          - valor: '-900'
            mensaje: |
              El valor es ese y el signo no. $v = -900\cdot10^{-6}y$ da
              $\varepsilon_y = v_{,y} = -900\cdot10^{-6}$: el prisma se acorta
              según y, y para que el volumen no cambie tiene que alargarse
              según x lo mismo.
        pista: |
          Que no cambie el volumen es que la deformación volumétrica sea nula
          (ec. 3.59): $e = \varepsilon_x + \varepsilon_y + \varepsilon_z = 0$.
        desarrollo: |
          Con $\varepsilon_x = u_{,x} = a$, $\varepsilon_y = v_{,y} = -900\cdot10^{-6}$
          y $\varepsilon_z = c = 0$:

          $$
          e = a - 900\cdot10^{-6} + 0 = 0 \quad\Longrightarrow\quad a = 900\cdot10^{-6}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Las deformaciones normales salen de derivar el campo:
              $\varepsilon_x = a$, $\varepsilon_y = -900\cdot10^{-6}$ y
              $\varepsilon_z = c$.
          - texto: >-
              Las distorsiones: $\gamma_{xy} = 0$, $\gamma_{yz} = b$ y
              $\gamma_{zx} = 400\cdot10^{-6} - 200\cdot10^{-6}d$.
          - texto: >-
              Deformación plana en Oxy: $\varepsilon_z = \gamma_{zx} = \gamma_{yz} = 0$,
              luego $c = 0$, $b = 0$ y $d = 2$.
          - texto: >-
              Volumen constante: $\varepsilon_x + \varepsilon_y + \varepsilon_z = 0$,
              luego $a = 900\cdot10^{-6}$.
          - texto: >-
              Como el plano es Oxy, $\varepsilon_z$ puede valer lo que quiera, y
              $c$ se elige para que el volumen no cambie.
            trampa: true
            mensaje: |
              Al revés: la deformación plana en Oxy es justo la que anula
              $\varepsilon_z$ (ec. 4.26). $c = 0$, y el volumen lo ajusta $a$.
    resolucion: |
      **Las deformaciones del campo.** En pequeños desplazamientos, las
      deformaciones normales son las derivadas de cada desplazamiento según su
      eje (ec. 3.14, apuntes del tema 3, p. 8) y las distorsiones, la suma de
      las dos derivadas cruzadas (ec. 3.21, p. 9):

      $$
      \varepsilon_x = u_{,x} = a,\qquad
      \varepsilon_y = v_{,y} = -900\cdot10^{-6},\qquad
      \varepsilon_z = w_{,z} = c
      $$

      $$
      \gamma_{xy} = u_{,y} + v_{,x} = 0,\qquad
      \gamma_{yz} = v_{,z} + w_{,y} = b,\qquad
      \gamma_{zx} = w_{,x} + u_{,z} = 400\cdot10^{-6} - 200\cdot10^{-6}\,d
      $$

      **La deformación plana.** En el plano Oxy se anulan la deformación
      según z y las dos distorsiones que la tocan (ec. 4.26, apuntes del tema
      4, p. 10):

      $$
      \varepsilon_z = c = 0,\qquad \gamma_{yz} = b = 0,\qquad
      \gamma_{zx} = 400\cdot10^{-6} - 200\cdot10^{-6}\,d = 0 \;\Longrightarrow\; d = 2
      $$

      **El volumen.** Que la transformación no cambie el volumen es que la
      deformación volumétrica sea nula (ec. 3.59, p. 18):

      $$
      e = \varepsilon_x + \varepsilon_y + \varepsilon_z = a - 900\cdot10^{-6} + 0 = 0
      \quad\Longrightarrow\quad a = 900\cdot10^{-6}
      $$

      **Resultado:** $a = 900\cdot10^{-6}$, $b = 0$, $c = 0$ y $d = 2$. El
      prisma se alarga según x lo que se acorta según y, y no se distorsiona.

      **Lo que queda del campo.** Con esos valores,
      $u = 900\cdot10^{-6}x + 400\cdot10^{-6}z$ y $w = -400\cdot10^{-6}x$. Los
      dos términos cruzados, $400\cdot10^{-6}z$ en $u$ y $-400\cdot10^{-6}x$ en
      $w$, no deforman: son un giro de sólido rígido alrededor de y, de
      $\tfrac12(u_{,z} - w_{,x}) = 400\cdot10^{-6}$ rad. Por eso $w$ no es nula
      y la deformación plana se cumple igual. Las cotas de 30, 10 y 10 mm no
      intervienen: las condiciones son sobre derivadas y valen en todos los
      puntos.

      **Comprobación.** El motor del curso resuelve las cuatro condiciones
      como un sistema lineal en $(a, b, c, d)$ y da lo mismo, y el tensor de
      deformaciones que monta con esos valores tiene la traza nula y la fila
      de z vacía.

  # ── Teoría · pregunta 2 · las tres barras y el error de montaje.
  - id: exerm1920-ext-2-las-tres-barras-y-el-error-de-montaje
    titulo: Tres barras unidas en un nudo, y un hueco Δ que se cierra al montarlas
    fuente: >-
      Cuestión 2 de teoría · Extraordinaria del 29 de enero de 2020 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Las tres barras y sus articulaciones
      solo están en el Word original: el PDF imprime la pared, el techo, el
      punto E, los rótulos y las dos cotas de L. El examen no publica
      resolución; el desarrollo es nuestro y sigue los apuntes del tema 8.
    nivel: examen
    enunciado: |
      2. (1p) La estructura de la figura está formada por 3 barras donde el
      módulo de elasticidad de las barras es E y la sección A. Los extremos D
      y E se encuentran inicialmente separados una distancia Δ. Tras hacer
      coincidir D y E en la operación de ensamblaje, determinar las fuerzas
      axiales en cada barra.

