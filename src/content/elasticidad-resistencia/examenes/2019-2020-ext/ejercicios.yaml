      **Notas nuestras.** El original numera este problema «3.», como el
      anterior: es el cuarto. Leemos que F es un empotramiento (en el Word,
      bajo la base rayada de F hay un triángulo de apoyo tapado por un
      rectángulo blanco) y que A es un apoyo fijo. La articulación de C une
      el pilar a ABCD, que sigue entera por encima.
    pide: >-
      a) La reacción horizontal en A; b) el desplazamiento vertical de D, con
      la energía de flexión.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántas incógnitas hiperestáticas tiene la estructura?
        opciones:
          - texto: >-
              Una: hay cinco reacciones (dos en A y tres en F) y cuatro
              ecuaciones (tres de equilibrio y la del flector nulo en la
              articulación de C)
            correcta: true
            mensaje: |
              Eso es. Se puede tomar como incógnita la reacción horizontal de
              A, que es lo que pide el apartado a: las demás salen del
              equilibrio de ABCD y del pilar.
          - texto: >-
              Ninguna: la articulación de C la hace isostática
            mensaje: |
              La articulación libera un momento, que es una ecuación más, pero
              hay cinco reacciones: con un apoyo fijo en A y un empotramiento
              en F sobra una.
          - texto: >-
              Dos: la horizontal de A y la horizontal de C
            mensaje: |
              Las dos están ligadas por el equilibrio horizontal de ABCD: la
              suma de ambas tiene que equilibrar los $2q_0a$ de B. Solo una es
              independiente.
      - tipo: reconocer
        pregunta: |
          ¿Qué energía de flexión aporta el pilar FC?
        opciones:
          - texto: >-
              La de un voladizo empotrado en F con una fuerza horizontal en C:
              la que le transmite la articulación
            correcta: true
            mensaje: |
              Eso es. La articulación no transmite momento, pero sí fuerza: la
              componente horizontal flecta el pilar, de 0 en C a su máximo en
              F. La vertical lo comprime, y su energía no se cuenta.
          - texto: >-
              Ninguna: como la articulación no transmite momento, el pilar no
              flecta
            mensaje: |
              No transmitir momento no es no transmitir fuerza. La horizontal
              que pasa por C flecta el pilar como un voladizo: su flector es
              nulo en C y máximo en F.
          - texto: >-
              La de la compresión que le transmite C
            mensaje: |
              El enunciado pide solo la energía de flexión. La compresión del
              pilar existe, pero se desprecia, como la de las barras de ABCD.
      - tipo: calcular
        titulo: La reacción horizontal en A
        pregunta: |
          ¿Cuánto vale la reacción horizontal en A, positiva hacia la derecha,
          en unidades de $q_0a$?
        respuesta:
          tipo: numero
          valor: '-0.7083'
          tolerancia: 0.0005
          formato: un número con su signo, en unidades de q0·a
        distractores:
          - valor: '0.7083'
            mensaje: |
              El valor es ese y el signo no. La fuerza de B empuja hacia la
              derecha: A y el pilar la frenan, y la reacción de A va hacia la
              izquierda.
          - valor: '-0.0625'
            mensaje: |
              Es lo que sale sin la energía del pilar, como si C fuera un apoyo
              fijo. El pilar cede: la horizontal que no toma C la toma A.
          - valor: '-2'
            mensaje: |
              Es toda la fuerza de B en A, como si el pilar no frenara nada (con
              F articulado sería una biela vertical). Empotrado en F, el pilar
              toma parte de la horizontal.
          - valor: '-1.0625'
            mensaje: |
              Te falta la energía del tramo AB. La reacción de A lo flecta,
              con el flector creciendo de A a B.
        pista: |
          Con $X = H_A$: $M_{AB} = -Xy$, $M_{BC} = -X(2a - x) - q_0ax/4$,
          $M_{CD} = -q_0s^{2}/2$ y en el pilar $M = (2q_0a + X)\eta$; Menabrea,
          $\partial C/\partial X = 0$.
        desarrollo: |
          Derivando la coenergía respecto de $X$ (los términos de CD no
          dependen de $X$), con $\int_0^{2a}y^{2}dy = \tfrac83a^{3}$ y
          $\int_0^{2a}x(2a - x)\,dx = \tfrac43a^{3}$:

          $$
          \frac{8a^{3}}{3}X + \frac{8a^{3}}{3}X + \frac{q_0a^{4}}{3} + \frac{8a^{3}}{3}(2q_0a + X) = 0
          \quad\Longrightarrow\quad
          X = -\frac{17}{24}\,q_0a = -0{,}7083\,q_0a
          $$

          El pilar toma $2q_0a - \tfrac{17}{24}q_0a = \tfrac{31}{24}q_0a$.
      - tipo: calcular
        titulo: El desplazamiento vertical de D
        pregunta: |
          ¿Cuánto vale el desplazamiento vertical de D, positivo hacia abajo,
          en unidades de $q_0a^{4}/EI_z$?
        respuesta:
          tipo: numero
          valor: '-0.013889'
          tolerancia: 0.00005
          formato: un número con su signo, en unidades de q0·a⁴/(E·Iz)
        distractores:
          - valor: '0.013889'
            mensaje: |
              El valor es ese y el signo no. Con la fuerza unidad hacia abajo,
              el resultado sale negativo: D sube. La fuerza de B gira el nudo B
              y levanta el voladizo más de lo que la carga lo baja.
          - valor: '0.4583'
            mensaje: |
              Es lo que sale con $H_A = 0$. La reacción de A cambia los
              flectores de BC, y con ella el resultado cambia hasta de signo.
          - valor: '0.125'
            mensaje: |
              Es la flecha del voladizo CD solo, $q_0a^{4}/8EI_z$, con C sin
              girar. C gira con la barra BC, y ese giro mueve D.
          - valor: '0.4167'
            mensaje: |
              Es lo que sale con la $H_A$ del pilar rígido, $-q_0a/16$. El
              pilar cede: $H_A = -\tfrac{17}{24}q_0a$.
        pista: |
          Fuerza unidad hacia abajo en D sobre la estructura con A articulado y
          C apoyado (sin el pilar): $m_{BC} = x/2$ y $m_{CD} = s$, y
          $\delta_D = \int Mm/EI_z$ con los flectores reales.
        desarrollo: |
          Con los flectores de signo positivo si traccionan arriba,
          $M_{BC} = -\tfrac{17}{24}q_0a(2a - x) + \tfrac14q_0ax$ y
          $M_{CD} = \tfrac12q_0s^{2}$:

          $$
          EI_z\,\delta_D = \int_0^{2a}M_{BC}\,\frac{x}{2}\,dx + \int_0^{a}\frac{q_0s^{2}}{2}\,s\,ds = -\frac{5}{36}\,q_0a^{4} + \frac{1}{8}\,q_0a^{4} = -\frac{1}{72}\,q_0a^{4}
          $$

          $\delta_D = -0{,}013889\,q_0a^{4}/EI_z$: D sube.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Hiperestática de grado uno: se toma $X = H_A$.
          - texto: >-
              El pilar es un voladizo con la horizontal $2q_0a + X$ en C.
          - texto: >-
              Menabrea con AB, BC y el pilar: $X = -\tfrac{17}{24}q_0a$.
          - texto: >-
              Fuerza unidad en D sobre ABCD apoyada en A y C:
              $\delta_D = -q_0a^{4}/72EI_z$, D sube.
          - texto: >-
              La articulación de C no transmite momento, así que el pilar no
              flecta y A se lleva toda la horizontal.
            trampa: true
            mensaje: |
              La articulación transmite fuerza: la horizontal de C flecta el
              pilar, que toma $\tfrac{31}{24}q_0a$. A se lleva el resto,
              $\tfrac{17}{24}q_0a$.
    resolucion: |
      **Los datos y los ejes.** A en $(0, 0)$, B en $(0, 2a)$, C en
      $(2a, 2a)$ y D en $(3a, 2a)$; F en $(2a, 0)$. La fuerza de B vale
      $2q_0a$ hacia la derecha y la de CD, $q_0$ hacia abajo. Solo se cuenta
      la energía de flexión, con la misma $EI_z$ en todo.

      **El grado.** A da dos reacciones y F tres; el equilibrio da tres
      ecuaciones y la articulación de C, una más: hiperestática de grado uno.
      Se toma como incógnita la reacción horizontal de A, $X$, positiva hacia
      la derecha. El equilibrio horizontal de ABCD deja en C una fuerza del
      pilar $-(2q_0a + X)$, y el de momentos, la vertical de A:
      $V_A = X - q_0a/4$.

      **Los flectores**, positivos si traccionan la cara interior del pórtico
      (la derecha de AB y la de abajo de BC y CD), en función de $X$:

      - AB, con $y$ desde A: $M = -Xy$;
      - BC, con $x$ desde B: $M = -X(2a - x) - \tfrac14q_0ax$;
      - CD, con $s$ desde D: $M = -\tfrac12q_0s^{2}$;
      - el pilar, con $\eta$ desde C hacia F: un voladizo con la horizontal
        $2q_0a + X$ en C, $M = (2q_0a + X)\eta$.

      **a) La reacción en A.** Con la coenergía de flexión
      $C = \int M^{2}/2EI_z\,dl$ (ec. 13.29, apuntes del tema 13, p. 12) y la
      condición de Menabrea para una reacción de desplazamiento nulo,
      $\partial C/\partial X = 0$ (ec. 13.52, p. 19):

      $$
      \int_0^{2a}Xy^{2}\,dy + \int_0^{2a}\left(X(2a - x) + \tfrac14q_0ax\right)(2a - x)\,dx + \int_0^{2a}(2q_0a + X)\eta^{2}\,d\eta = 0
      $$

      $$
      \frac{8a^{3}}{3}X + \frac{8a^{3}}{3}X + \frac{q_0a^{4}}{3} + \frac{8a^{3}}{3}(2q_0a + X) = 0
      \quad\Longrightarrow\quad
      H_A = X = -\frac{17}{24}\,q_0a = -0{,}7083\,q_0a
      $$

      A empuja hacia la izquierda con $\tfrac{17}{24}q_0a$ y el pilar, con
      $\tfrac{31}{24}q_0a$. Los flectores: $\tfrac{17}{12}q_0a^{2}$ en B, por
      dentro; en BC cambian de signo en $x = 34a/23$ y llegan a C con
      $\tfrac12q_0a^{2}$ por fuera, el mismo del voladizo CD; en el pilar,
      $\tfrac{31}{12}q_0a^{2}$ en F. Y $V_A = -\tfrac{23}{24}q_0a$: A tira
      hacia abajo.

      **b) El desplazamiento de D.** Con el método de la fuerza unitaria
      (apartado 13.6, pp. 17-18) y el teorema de Engesser-Castigliano
      (ec. 13.14, p. 8), la fuerza unidad puede ponerse sobre cualquier
      sistema isostático que cumpla los enlaces: ABCD con A articulado y C
      apoyado en vertical, sin el pilar. Para una fuerza unidad hacia abajo
      en D, la reacción de A es de $\tfrac12$ hacia abajo, y con los
      flectores positivos si traccionan arriba, $m_{BC} = x/2$ y
      $m_{CD} = s$. Con los flectores reales en el mismo convenio,
      $M_{BC} = -\tfrac{17}{24}q_0a(2a - x) + \tfrac14q_0ax$ y
      $M_{CD} = \tfrac12q_0s^{2}$:

      $$
      EI_z\,\delta_D = \int_0^{2a}M_{BC}\,\frac{x}{2}\,dx + \int_0^{a}\frac{q_0s^{3}}{2}\,ds
      = -\frac{5}{36}\,q_0a^{4} + \frac{1}{8}\,q_0a^{4} = -\frac{1}{72}\,q_0a^{4}
      $$

      $$
      \delta_D = -\frac{q_0a^{4}}{72EI_z} = -0{,}013889\,\frac{q_0a^{4}}{EI_z}
      $$

      Negativo con la fuerza unidad hacia abajo: **D sube**
      $q_0a^{4}/72EI_z$. El voladizo CD solo bajaría $q_0a^{4}/8EI_z$, pero la
      fuerza de B hace girar el nudo C hacia arriba y levanta D un poco más.

      **Comprobaciones.** El motor del curso resuelve la estructura con el
      pilar sustituido por su flexibilidad horizontal, $(2a)^{3}/3EI_z$, que
      calcula aparte con la fuerza unidad sobre el pilar solo, y Menabrea con
      la horizontal de C como redundante: da la misma $H_A$ y el mismo
      $\delta_D$. Por otro camino, $\delta_D$ sale igual integrando con Simpson
      los flectores escritos a mano, y el equilibrio de ABCD cierra con
      $H_A + H_C + 2q_0a = 0$.
