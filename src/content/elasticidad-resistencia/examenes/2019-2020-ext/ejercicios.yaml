      **Notas nuestras.** «eta» es la «y» del euskera, colada en la columna
      en castellano. La línea de los datos va, como en el original, entre los
      apartados a y b. Los ángulos se miden desde x, positivos hacia y, con
      los ejes de la figura.
    pide: >-
      a) εx, εy y γxy en función de las tres lecturas; b) las tensiones y las
      direcciones principales; c) la tensión normal y la tangencial en el
      plano perpendicular a la galga c.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para escribir la lectura de cada galga con la ec. 3.55,
          $\varepsilon_u = \varepsilon_x\cos^{2}\theta + \varepsilon_y\sin^{2}\theta + \gamma_{xy}\sin\theta\cos\theta$,
          ¿qué ángulo $\theta$ lleva cada una?
        opciones:
          - texto: >-
              a, 0°; c, 30°; b, 150° (o −30°, que es la misma recta)
            correcta: true
            mensaje: |
              Eso es. La c sube hacia la derecha por el lado izquierdo del
              triángulo, a 30° de la base; la b baja hacia la derecha por el
              derecho: 150°, o $-30^{\circ}$, que da la misma lectura porque
              $\cos^{2}$, $\sin^{2}$ y $\sin\cos$ no cambian al sumar 180°.
          - texto: >-
              a, 0°; b, 30°; c, 150°
            mensaje: |
              Has cambiado b y c. La c está en el lado izquierdo, que sube
              hacia la derecha: forma $+30^{\circ}$ con x. La b, en el derecho,
              baja: $-30^{\circ}$, o 150°.
          - texto: >-
              a, 0°; c, 60°; b, 120°, medidos desde la base hasta el lado
              contrario
            mensaje: |
              Los 30° de la figura son los que forma cada lado con la base, que
              es el eje x. La galga c está a 30° de x, no a 60°: 60° sería el
              ángulo con el eje y.
      - tipo: calcular
        titulo: La deformación según y
        pregunta: |
          ¿Cuánto vale $\varepsilon_y$, en unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '0'
          tolerancia: 0.01
          formato: un número con su signo, en unidades de 10⁻⁴
        distractores:
          - valor: '2'
            mensaje: |
              Es la fórmula de la roseta a 120° de los apuntes (ec. 3.66, p. 21),
              $\varepsilon_y = \tfrac13(2\varepsilon_b + 2\varepsilon_c - \varepsilon_a)$,
              que es para galgas a 0°, 120° y 240°. Esta roseta es otra: con b
              y c a $\mp30^{\circ}$, los cuadrados de los cosenos valen 3/4, y
              sale $\varepsilon_y = 2(\varepsilon_b + \varepsilon_c) - 3\varepsilon_a$.
        pista: |
          Suma las lecturas de b y c: los términos de $\gamma_{xy}$ se van, y
          con $\varepsilon_x = \varepsilon_a$ despejas $\varepsilon_y$.
        desarrollo: |
          Con la ec. 3.55 a 0°, 150° y 30°:

          $$
          \varepsilon_a = \varepsilon_x,\qquad
          \varepsilon_b = \tfrac34\varepsilon_x + \tfrac14\varepsilon_y - \tfrac{\sqrt3}{4}\gamma_{xy},\qquad
          \varepsilon_c = \tfrac34\varepsilon_x + \tfrac14\varepsilon_y + \tfrac{\sqrt3}{4}\gamma_{xy}
          $$

          Sumando las dos últimas, $\varepsilon_b + \varepsilon_c = \tfrac32\varepsilon_x + \tfrac12\varepsilon_y$:

          $$
          \varepsilon_y = 2(\varepsilon_b + \varepsilon_c) - 3\varepsilon_a = 2\cdot(12 - 7{,}5)\cdot10^{-4} - 3\cdot3\cdot10^{-4} = 0
          $$
      - tipo: calcular
        titulo: La distorsión
        pregunta: |
          ¿Cuánto vale $\gamma_{xy}$, en unidades de $10^{-4}$?
        respuesta:
          tipo: numero
          valor: '-22.517'
          tolerancia: 0.005
          formato: un número con su signo, en unidades de 10⁻⁴
        distractores:
          - valor: '22.517'
            mensaje: |
              El valor es ese y el signo no: has cambiado b y c. La c, la de
              30°, lee $-7{,}5\cdot10^{-4}$, y
              $\gamma_{xy} = 2(\varepsilon_c - \varepsilon_b)/\sqrt3$ sale
              negativa.
          - valor: '-11.258'
            mensaje: |
              Es la mitad: has escrito la ec. 3.55 con $2\gamma_{xy}\sin\theta\cos\theta$,
              como si $\gamma_{xy}$ fuera la componente del tensor. En la
              ec. 3.55 va $\gamma_{xy}$, una sola vez; la del tensor es
              $\tfrac12\gamma_{xy}$.
        pista: |
          Resta las lecturas de c y b: se van $\varepsilon_x$ y
          $\varepsilon_y$.
        desarrollo: |
          $\varepsilon_c - \varepsilon_b = \tfrac{\sqrt3}{2}\gamma_{xy}$:

          $$
          \gamma_{xy} = \frac{2(\varepsilon_c - \varepsilon_b)}{\sqrt3} = \frac{2\cdot(-7{,}5 - 12)\cdot10^{-4}}{\sqrt3} = -22{,}517\cdot10^{-4}
          $$

          Y $\varepsilon_x = \varepsilon_a = 3\cdot10^{-4}$.
      - tipo: calcular
        titulo: La tensión según x
        pregunta: |
          ¿Cuánto vale $\sigma_x$, en MPa?
        respuesta:
          tipo: numero
          valor: '23.077'
          tolerancia: 0.005
          formato: un número con su signo, en MPa
        distractores:
          - valor: '21'
            mensaje: |
              Es $E\varepsilon_x$, la ley de Hooke de una barra. En tensión
              plana cada tensión depende de las dos deformaciones del plano
              (ec. 4.25, p. 9):
              $\sigma_x = \dfrac{E}{1-\nu^{2}}(\varepsilon_x + \nu\varepsilon_y)$.
        pista: |
          Hooke en tensión plana (ec. 4.25):
          $\sigma_x = \dfrac{E}{1-\nu^{2}}(\varepsilon_x + \nu\varepsilon_y)$.
        desarrollo: |
          $$
          \sigma_x = \frac{E}{1-\nu^{2}}\,(\varepsilon_x + \nu\varepsilon_y) = \frac{70\,000\ \text{MPa}}{0{,}91}\cdot(3\cdot10^{-4} + 0{,}3\cdot0) = 23{,}077\ \text{MPa}
          $$

          Del mismo modo, $\sigma_y = \dfrac{E}{1-\nu^{2}}(\varepsilon_y + \nu\varepsilon_x) = 6{,}923$ MPa,
          y con $G = E/2(1+\nu) = 26\,923$ MPa,
          $\tau_{xy} = G\gamma_{xy} = -60{,}622$ MPa (ec. 4.13).
      - tipo: calcular
        titulo: La tensión principal mayor
        pregunta: |
          ¿Cuánto vale $\sigma_1$, en MPa?
        respuesta:
          tipo: numero
          valor: '76.157'
          tolerancia: 0.01
          formato: un número con su signo, en MPa
        distractores:
          - valor: '46.369'
            mensaje: |
              Has tomado $\tau_{xy} = G\gamma_{xy}/2$. La mitad de
              $\gamma_{xy}$ es la componente del tensor de deformaciones; la
              tensión es $\tau_{xy} = G\gamma_{xy}$ (ec. 4.13), con la
              distorsión entera.
          - valor: '172.82'
            mensaje: |
              Has tomado $\tau_{xy} = E\gamma_{xy}$. La distorsión se pasa a
              tensión con $G = E/2(1+\nu)$, no con $E$ (ec. 4.13).
          - valor: '81.350'
            mensaje: |
              Es lo que sale con las ecuaciones de la deformación plana, con
              $\lambda$ y $2G$. El enunciado dice tensión plana: $\sigma_z = 0$
              y Hooke de la ec. 4.25.
        pista: |
          El círculo de Mohr: centro $C = (\sigma_x + \sigma_y)/2$ y radio
          $R = \sqrt{((\sigma_x - \sigma_y)/2)^{2} + \tau_{xy}^{2}}$
          (ec. 2.68), y $\sigma_1 = C + R$ (ec. 2.69).
        desarrollo: |
          $$
          C = \frac{23{,}077\ \text{MPa} + 6{,}923\ \text{MPa}}{2} = 15\ \text{MPa},\qquad
          R = \sqrt{(8{,}077\ \text{MPa})^{2} + (60{,}622\ \text{MPa})^{2}} = 61{,}157\ \text{MPa}
          $$

          $\sigma_1 = C + R = 76{,}157$ MPa y $\sigma_2 = C - R = -46{,}157$ MPa;
          la tercera, la de z, es nula.
      - tipo: calcular
        titulo: La dirección de σ1
        pregunta: |
          ¿Qué ángulo forma con x la dirección principal de $\sigma_1$, en
          grados, positivo de x hacia y?
        respuesta:
          tipo: numero
          valor: '-41.21'
          tolerancia: 0.01
          formato: un número con su signo, en grados, entre −90 y 90
        distractores:
          - valor: '41.21'
            mensaje: |
              El valor es ese y el signo no. $\tau_{xy}$ es negativa y
              $\sigma_x > \sigma_y$: $\tan2\theta_1$ es negativa y la dirección
              de $\sigma_1$ queda por debajo de x.
          - valor: '-82.41'
            mensaje: |
              Ese es $2\theta_1$. La ec. 2.62 da la tangente del ángulo doble:
              hay que dividir por 2.
          - valor: '48.79'
            mensaje: |
              Esa es la otra dirección principal, a 90°: la de $\sigma_2$. En
              ella la normal vale $-46{,}16$ MPa. La de $\sigma_1$ es la que
              cumple $\tan2\theta = 2\tau_{xy}/(\sigma_x - \sigma_y)$ con
              $2\theta$ del lado del signo de $\sigma_x - \sigma_y$.
        pista: |
          $\tan2\theta_1 = 2\tau_{xy}/(\sigma_x - \sigma_y)$ (ec. 2.62), y se
          comprueba con la ec. 2.61 cuál de las dos soluciones da $\sigma_1$.
        desarrollo: |
          $$
          \tan2\theta_1 = \frac{2\cdot(-60{,}622\ \text{MPa})}{23{,}077\ \text{MPa} - 6{,}923\ \text{MPa}} = -7{,}506
          $$

          Con $\sigma_x - \sigma_y > 0$, $2\theta_1 = -82{,}41^{\circ}$ y
          $\theta_1 = -41{,}21^{\circ}$: en esa dirección la ec. 2.61 da
          $\sigma_n = 76{,}16$ MPa y $\tau_n = 0$. La de $\sigma_2$ está a
          $48{,}79^{\circ}$.
      - tipo: reconocer
        pregunta: |
          Para el apartado c, ¿cuál es la normal del plano perpendicular a la
          galga c?
        opciones:
          - texto: >-
              La dirección de la propia galga, a 30° de x
            correcta: true
            mensaje: |
              Eso es. Un plano perpendicular a una dirección es el que la tiene
              por normal. Es el plano que corta la galga: la tensión normal de
              ese plano es la que la estira.
          - texto: >-
              La perpendicular a la galga, a 120° de x
            mensaje: |
              Ese es el plano que contiene la galga: su normal es perpendicular
              a ella. El plano perpendicular a la galga tiene la galga por
              normal, a 30°.
          - texto: >-
              El eje z: el plano xy, donde está pegada la galga
            mensaje: |
              El plano xy contiene la galga, no es perpendicular a ella. Además,
              en tensión plana su vector tensión es nulo.
      - tipo: calcular
        titulo: La tensión normal en el plano de la galga c
        pregunta: |
          ¿Cuánto vale la tensión normal $\sigma_n$ en ese plano, en MPa?
        respuesta:
          tipo: numero
          valor: '-33.462'
          tolerancia: 0.005
          formato: un número con su signo, en MPa
        distractores:
          - valor: '63.462'
            mensaje: |
              Es la del plano de normal a 120°, el que contiene la galga. El
              plano perpendicular a la galga tiene su normal según ella, a 30°.
          - valor: '71.538'
            mensaje: |
              Es lo que sale con b y c cambiadas: la distorsión cambia de
              signo y todo lo que sigue también. La c es la del lado izquierdo,
              a $+30^{\circ}$.
          - valor: '-52.5'
            mensaje: |
              Es $E\varepsilon_c$: Hooke de una barra con la lectura de la galga.
              En tensión plana, la tensión según la galga depende también de la
              deformación perpendicular:
              $\sigma_n = \dfrac{E}{1-\nu^{2}}(\varepsilon_c + \nu\varepsilon_{120^{\circ}})$.
        pista: |
          La ec. 2.59 con $\theta = 30^{\circ}$:
          $\sigma_n = \sigma_x\cos^{2}\theta + \sigma_y\sin^{2}\theta + 2\tau_{xy}\sin\theta\cos\theta$.
        desarrollo: |
          $$
          \sigma_n = 23{,}077\ \text{MPa}\cdot0{,}75 + 6{,}923\ \text{MPa}\cdot0{,}25 + 2\cdot(-60{,}622\ \text{MPa})\cdot0{,}4330 = -33{,}462\ \text{MPa}
          $$

          Por otro camino: con la lectura de c y la deformación a 120°,
          $\varepsilon_{120^{\circ}} = 10{,}5\cdot10^{-4}$, Hooke da lo mismo.
      - tipo: calcular
        titulo: La tensión tangencial en el plano de la galga c
        pregunta: |
          ¿Cuánto vale la tensión tangencial $\tau_n$ en ese plano, en MPa,
          con el convenio de los apuntes, $\hat t = (-\sin\theta, \cos\theta)$
          (ec. 2.57)?
        respuesta:
          tipo: numero
          valor: '-37.306'
          tolerancia: 0.005
          formato: un número con su signo, en MPa
        distractores:
          - valor: '37.306'
            mensaje: |
              El valor es ese y el signo no. Con $\hat t = (-\sin\theta, \cos\theta)$
              y $\theta = 30^{\circ}$, la ec. 2.59 da $-37{,}31$ MPa. Es también la
              tangencial del plano de normal a 120°, el que contiene la galga:
              por reciprocidad, igual y de signo contrario.
          - valor: '23.316'
            mensaje: |
              Es lo que sale con b y c cambiadas: la distorsión cambia de
              signo. La c es la del lado izquierdo, a $+30^{\circ}$.
        pista: |
          La ec. 2.59:
          $\tau_n = (\sigma_y - \sigma_x)\sin\theta\cos\theta + \tau_{xy}(\cos^{2}\theta - \sin^{2}\theta)$.
        desarrollo: |
          $$
          \tau_n = (6{,}923\ \text{MPa} - 23{,}077\ \text{MPa})\cdot0{,}4330 + (-60{,}622\ \text{MPa})\cdot0{,}5 = -37{,}306\ \text{MPa}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Galgas a 0°, 150° y 30°: $\varepsilon_x = \varepsilon_a$,
              $\varepsilon_y = 2(\varepsilon_b + \varepsilon_c) - 3\varepsilon_a$
              y $\gamma_{xy} = 2(\varepsilon_c - \varepsilon_b)/\sqrt3$.
          - texto: >-
              Hooke en tensión plana: $\sigma_x = 23{,}08$, $\sigma_y = 6{,}92$ y
              $\tau_{xy} = -60{,}62$ MPa.
          - texto: >-
              Mohr: $\sigma_1 = 76{,}16$ MPa a $-41{,}21^{\circ}$ de x y
              $\sigma_2 = -46{,}16$ MPa a $48{,}79^{\circ}$; $\sigma_3 = 0$.
          - texto: >-
              Plano perpendicular a c, de normal a 30°: $\sigma_n = -33{,}46$ MPa
              y $\tau_n = -37{,}31$ MPa.
          - texto: >-
              Con una roseta, $\varepsilon_y$ sale de la fórmula de las galgas a
              120°, que vale para cualquier roseta de tres galgas.
            trampa: true
            mensaje: |
              La ec. 3.66 es para galgas a 0°, 120° y 240°. Con otros ángulos
              hay que escribir la ec. 3.55 para cada galga y despejar.
    resolucion: |
      **Los ángulos.** Con x a la derecha e y hacia arriba, la galga a está a
      0°, la c a 30° (el lado izquierdo del triángulo, que sube) y la b a 150°
      (el derecho, que baja; da lo mismo que $-30^{\circ}$).

      **a) Las deformaciones.** La lectura de una galga en el plano es
      $\varepsilon_u = \varepsilon_x\cos^{2}\theta + \varepsilon_y\sin^{2}\theta + \gamma_{xy}\sin\theta\cos\theta$
      (ec. 3.55, apuntes del tema 3, p. 17). Para cada galga:

      $$
      \varepsilon_a = \varepsilon_x,\qquad
      \varepsilon_b = \tfrac34\varepsilon_x + \tfrac14\varepsilon_y - \tfrac{\sqrt3}{4}\gamma_{xy},\qquad
      \varepsilon_c = \tfrac34\varepsilon_x + \tfrac14\varepsilon_y + \tfrac{\sqrt3}{4}\gamma_{xy}
      $$

      Sumando y restando las dos últimas:

      $$
      \varepsilon_x = \varepsilon_a,\qquad
      \varepsilon_y = 2(\varepsilon_b + \varepsilon_c) - 3\varepsilon_a,\qquad
      \gamma_{xy} = \frac{2(\varepsilon_c - \varepsilon_b)}{\sqrt3}
      $$

      Con los datos: $\varepsilon_x = 3\cdot10^{-4}$, $\varepsilon_y = 0$ y
      $\gamma_{xy} = -22{,}517\cdot10^{-4}$. No es la roseta a 120° de los
      apuntes (ec. 3.66): con galgas a 0°, 120° y 240° la fórmula de
      $\varepsilon_y$ es otra.

      **b) Las tensiones.** Tensión plana, con Hooke (ec. 4.25, apuntes del
      tema 4, p. 9) y $\tau_{xy} = G\gamma_{xy}$ (ec. 4.13, p. 7), con
      $E/(1-\nu^{2}) = 76\,923$ MPa y $G = E/2(1+\nu) = 26\,923$ MPa:

      $$
      \sigma_x = \frac{E}{1-\nu^{2}}(\varepsilon_x + \nu\varepsilon_y) = 23{,}077\ \text{MPa},\qquad
      \sigma_y = \frac{E}{1-\nu^{2}}(\varepsilon_y + \nu\varepsilon_x) = 6{,}923\ \text{MPa},\qquad
      \tau_{xy} = -60{,}622\ \text{MPa}
      $$

      El círculo de Mohr tiene el centro en $C = 15$ MPa y el radio
      $R = 61{,}157$ MPa (ec. 2.68, apuntes del tema 2, p. 25):

      $$
      \sigma_1 = C + R = 76{,}157\ \text{MPa},\qquad \sigma_2 = C - R = -46{,}157\ \text{MPa},\qquad \sigma_3 = 0
      $$

      Las direcciones (ec. 2.62, p. 23): $\tan2\theta_1 = 2\tau_{xy}/(\sigma_x - \sigma_y) = -7{,}506$,
      y como $\sigma_x > \sigma_y$, $2\theta_1 = -82{,}41^{\circ}$. La de
      $\sigma_1$ está a $\theta_1 = -41{,}21^{\circ}$ de x (por debajo, hacia
      la derecha), la de $\sigma_2$ a $48{,}79^{\circ}$, y la tercera es z.

      **c) El plano perpendicular a la galga c.** Su normal es la galga, a
      $\theta = 30^{\circ}$. Con la ec. 2.59 (p. 22) y
      $\hat t = (-\sin\theta, \cos\theta)$ (ec. 2.57):

      $$
      \sigma_n = \sigma_x\cos^{2}\theta + \sigma_y\sin^{2}\theta + 2\tau_{xy}\sin\theta\cos\theta = -33{,}462\ \text{MPa}
      $$

      $$
      \tau_n = (\sigma_y - \sigma_x)\sin\theta\cos\theta + \tau_{xy}(\cos^{2}\theta - \sin^{2}\theta) = -37{,}306\ \text{MPa}
      $$

      La galga c lee un acortamiento, y su plano está comprimido.

      **Comprobaciones.** El motor del curso (la roseta, Hooke en tensión
      plana, el círculo de Mohr y la tensión en un plano) da lo mismo. Por
      otro camino: en la dirección $\theta_1$ la ec. 2.61 da $\sigma_n = \sigma_1$
      y $\tau_n = 0$; las deformaciones principales salen iguales del tensor
      de deformaciones y de Hooke con $\sigma_1$ y $\sigma_2$; y la normal
      del apartado c sale también con Hooke a partir de la lectura de c y de
      la deformación a 120°, $10{,}5\cdot10^{-4}$.

