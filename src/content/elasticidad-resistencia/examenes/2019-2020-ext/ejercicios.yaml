      <text x="338.2" y="80.8" font-size="15" fill="var(--ink)" text-anchor="end">D</text>
      <text x="394.2" y="76.8" font-size="15" fill="var(--ink)">E</text>
      <text x="145" y="196" font-size="13" fill="var(--ink)" text-anchor="middle">1</text>
      <text x="221" y="120.9" font-size="13" fill="var(--ink)" text-anchor="end">2</text>
      <text x="280.2" y="139" font-size="13" fill="var(--ink)" text-anchor="middle">3</text>
      </svg>
      <figcaption>

      Redibujada del Word original. El PDF no imprime las tres barras, las
      articulaciones ni la cota de Δ: solo la pared, el techo, el punto E, los
      rótulos y las dos cotas de L. Δ se dibuja exagerada, como en el
      original.

      </figcaption>
      </figure>

      **Notas nuestras.** Leemos que las uniones A, B, C y D son
      articulaciones, como en una estructura de barras, y que $\Delta$ es
      pequeña frente a $L$. Las fuerzas se dan en función de $EA\Delta/L$.
    pide: >-
      Las fuerzas axiales de las tres barras después de unir D con E, en
      función de E, A, L y Δ.
    pasos:
      - tipo: reconocer
        pregunta: |
          No hay ninguna carga exterior. ¿Qué ecuaciones hacen falta para
          hallar las tres fuerzas?
        opciones:
          - texto: >-
              Las dos de equilibrio del nudo B y una de compatibilidad: el
              alargamiento de la barra 3 más lo que B se acerca a E según la
              barra 3 tiene que sumar Δ
            correcta: true
            mensaje: |
              Eso es. El nudo B da dos ecuaciones para tres fuerzas: el sistema
              es hiperestático de grado uno, y la ecuación que falta sale de
              cómo se deforma (apuntes del tema 8, p. 4). Al montar, la barra 3
              no se estira Δ entera: B también se mueve hacia E.
          - texto: >-
              Ninguna: sin cargas exteriores, las tres fuerzas son nulas
            mensaje: |
              Eso es cierto en un sistema isostático, que se acomoda a un error
              de fabricación sin esfuerzos. Aquí hay tres barras para un nudo
              en el plano: una sobra, y forzar D hasta E las pone a trabajar.
          - texto: >-
              El equilibrio de B y que la barra 3 se alarga exactamente Δ
            mensaje: |
              Eso supone que B no se mueve, y B está unido a dos barras que
              también se deforman. Lo que suma Δ es el alargamiento de la 3 más
              lo que B se desplaza hacia E.
      - tipo: calcular
        titulo: La longitud de la barra 2
        pregunta: |
          La figura acota las barras 1 y 3, pero no la 2. ¿Cuánto mide la
          barra 2, en unidades de $L$?
        respuesta:
          tipo: numero
          valor: '0.7071'
          tolerancia: 0.0005
          formato: un número, en unidades de L
        distractores:
          - valor: '1'
            mensaje: |
              Ninguna cota dice que la barra 2 mida $L$. El techo está a la
              altura de E, que está en la recta de la barra 3: B queda a
              $(L + \Delta)\sin45^{\circ}$ por debajo, y con $\Delta$ pequeña,
              a $L/\sqrt{2}$.
          - valor: '1.4142'
            mensaje: |
              Has dividido $L$ por $\sin45^{\circ}$ en vez de multiplicar. La
              barra 3, de longitud $L$ y a 45°, sube $L\sin45^{\circ}$: menos
              que su longitud.
        pista: |
          C y E están en el techo, y E está en la recta de la barra 3, a
          $L + \Delta$ de B y a 45° de la vertical.
        desarrollo: |
          $$
          L_2 = (L + \Delta)\sin45^{\circ} \approx \frac{L}{\sqrt{2}} = 0{,}7071\,L
          $$

          $\Delta$ se desprecia frente a $L$, como en todo cálculo de pequeños
          desplazamientos.
      - tipo: calcular
        titulo: La fuerza en la barra 3
        pregunta: |
          ¿Cuánto vale $N_3$, positiva a tracción, en unidades de
          $EA\Delta/L$?
        respuesta:
          tipo: numero
          valor: '0.5395'
          tolerancia: 0.0005
          formato: un número con su signo, en unidades de EAΔ/L
        distractores:
          - valor: '0.5'
            mensaje: |
              Es lo que sale con la barra 2 de longitud $L$. Mide $L/\sqrt{2}$:
              es más rígida, B sube menos y la barra 3 tiene que estirarse más.
          - valor: '1'
            mensaje: |
              Es la barra 3 estirada $\Delta$ entera, con B fijo. B se mueve hacia
              E: las barras 1 y 2 ceden, y el alargamiento de la 3 es menor.
          - valor: '0.6667'
            mensaje: |
              Has dejado B sin moverse en vertical, como si la barra 2 fuera
              rígida. La barra 2 se acorta $N_3L_2/(\sqrt{2}EA)$, y ese
              desplazamiento también acerca B a E.
          - valor: '-0.5395'
            mensaje: |
              El valor es ese y el signo no. D está a $\Delta$ de E y hay que
              llevarlo hasta allí: la barra 3 se estira y trabaja a tracción.
        pista: |
          Equilibrio de B: $N_1 = -N_2 = N_3/\sqrt{2}$. Compatibilidad:
          $N_3L/EA = \Delta - (u_B + v_B)/\sqrt{2}$, con $u_B$ el alargamiento
          de la 1 y $v_B$ el acortamiento de la 2.
        desarrollo: |
          Con $u_B = N_1L/EA = N_3L/(\sqrt{2}EA)$ y
          $v_B = -N_2L_2/EA = N_3L/(2EA)$:

          $$
          \frac{N_3L}{EA} = \Delta - \frac{1}{\sqrt{2}}\left(\frac{N_3L}{\sqrt{2}EA} + \frac{N_3L}{2EA}\right)
          \quad\Longrightarrow\quad
          N_3 = \frac{2\sqrt{2}}{3\sqrt{2} + 1}\,\frac{EA\Delta}{L} = \frac{12 - 2\sqrt{2}}{17}\,\frac{EA\Delta}{L} = 0{,}5395\,\frac{EA\Delta}{L}
          $$
      - tipo: reconocer
        pregunta: |
          Con la barra 3 a tracción, ¿cómo trabajan las otras dos?
        opciones:
          - texto: >-
              La 1 a tracción y la 2 a compresión
            correcta: true
            mensaje: |
              Eso es. La barra 3 tira de B hacia arriba y a la derecha: B se
              aleja de A, que estira la 1, y se acerca a C, que comprime la 2.
              En el equilibrio de B, $N_1 = N_3\cos45^{\circ}$ y
              $N_2 = -N_3\sin45^{\circ}$.
          - texto: >-
              Las tres a tracción: el montaje estira la estructura
            mensaje: |
              Sin cargas exteriores, las fuerzas de las barras tienen que
              equilibrarse en B. La 3 tira hacia arriba; la única que puede
              empujar B hacia abajo es la 2, y eso la comprime.
          - texto: >-
              La 1 y la 2 a compresión, porque frenan el movimiento de B
            mensaje: |
              B se aleja de A: la barra 1 se alarga, y eso es tracción. La que
              se acorta es la 2, porque B sube hacia el techo.
      - tipo: calcular
        titulo: La fuerza en la barra 1
        pregunta: |
          ¿Cuánto vale $N_1$, positiva a tracción, en unidades de
          $EA\Delta/L$?
        respuesta:
          tipo: numero
          valor: '0.3815'
          tolerancia: 0.0005
          formato: un número con su signo, en unidades de EAΔ/L
        distractores:
          - valor: '0.2698'
            mensaje: |
              Has proyectado dos veces, $N_1 = N_3/2$. En el equilibrio
              horizontal de B solo entra la componente horizontal de la 3,
              $N_3\cos45^{\circ} = N_3/\sqrt{2}$.
          - valor: '0.3536'
            mensaje: |
              Es $N_3/\sqrt{2}$ con la $N_3$ de la barra 2 de longitud $L$. La
              barra 2 mide $L/\sqrt{2}$: vuelve al paso de su longitud.
          - valor: '0.7071'
            mensaje: |
              Es $N_3/\sqrt{2}$ con B fijo, $N_3 = EA\Delta/L$. B se mueve hacia
              E, y la barra 3 se estira menos que $\Delta$.
          - valor: '0.4714'
            mensaje: |
              Es $N_3/\sqrt{2}$ con la barra 2 rígida. La 2 también se
              deforma, y B sube.
        pista: |
          El equilibrio horizontal de B: $N_1 = N_3\cos45^{\circ}$.
        desarrollo: |
          $$
          N_1 = \frac{N_3}{\sqrt{2}} = \frac{0{,}5395}{\sqrt{2}}\,\frac{EA\Delta}{L} = 0{,}3815\,\frac{EA\Delta}{L},\qquad
          N_2 = -N_1 = -0{,}3815\,\frac{EA\Delta}{L}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Una barra de más para el nudo B: hiperestático de grado uno.
          - texto: >-
              Equilibrio de B: $N_1 = N_3/\sqrt{2}$ y $N_2 = -N_3/\sqrt{2}$.
          - texto: >-
              B se desplaza $u_B = N_1L/EA$ a la derecha y
              $v_B = -N_2L_2/EA$ hacia arriba, con $L_2 = L/\sqrt{2}$.
          - texto: >-
              Compatibilidad: $N_3L/EA + (u_B + v_B)/\sqrt{2} = \Delta$, y de ahí
              $N_3 = 0{,}5395\,EA\Delta/L$.
          - texto: >-
              $N_1 = 0{,}3815\,EA\Delta/L$ a tracción y
              $N_2 = -0{,}3815\,EA\Delta/L$, a compresión.
          - texto: >-
              La barra 3 se estira $\Delta$ entera, porque es la única que se
              monta mal: $N_3 = EA\Delta/L$.
            trampa: true
            mensaje: |
              Eso supondría B fijo. Al tirar de D hasta E, B también se mueve
              hacia E, y la 3 se estira menos: $N_3 = 0{,}5395\,EA\Delta/L$.
    resolucion: |
      **La geometría.** La barra 1 va horizontal de A, en la pared, a B, y
      mide $L$. La 3 sale de B a 45° y mide $L$; E está en su recta, a
      $L + \Delta$ de B, y en el techo. C también está en el techo, en la
      vertical de B: la barra 2 mide
      $L_2 = (L + \Delta)\sin45^{\circ} \approx L/\sqrt{2}$, con $\Delta$
      pequeña frente a $L$.

      **Hiperestático de grado uno.** Al montar, se tira de D hasta E y se
      articula allí. El nudo B tiene dos ecuaciones de equilibrio y hay tres
      barras: falta una ecuación, y sale de la deformación (apuntes del tema
      8, p. 4).

      **El equilibrio de B.** Con las fuerzas positivas a tracción, la barra
      3 tira de B según $(\cos45^{\circ}, \sin45^{\circ})$, la 1 hacia A y la
      2 hacia C:

      $$
      -N_1 + \frac{N_3}{\sqrt{2}} = 0,\qquad N_2 + \frac{N_3}{\sqrt{2}} = 0
      \quad\Longrightarrow\quad N_1 = -N_2 = \frac{N_3}{\sqrt{2}}
      $$

      **Los desplazamientos de B.** Con $\Delta L = NL/EA$ (ec. 8.9, p. 7),
      B se desplaza a la derecha lo que se alarga la 1 y hacia arriba lo que
      se acorta la 2:

      $$
      u_B = \frac{N_1L}{EA} = \frac{N_3L}{\sqrt{2}\,EA},\qquad
      v_B = -\frac{N_2L_2}{EA} = \frac{N_3L}{2EA}
      $$

      **La compatibilidad.** El alargamiento de una barra es la proyección
      sobre ella del desplazamiento relativo de sus extremos (apartado 8.4,
      p. 7). D acaba en E, que no se mueve; B se ha movido
      $(u_B + v_B)/\sqrt{2}$ hacia E según la barra 3. Su alargamiento
      elástico es lo que falta hasta $\Delta$:

      $$
      \frac{N_3L}{EA} = \Delta - \frac{u_B + v_B}{\sqrt{2}}
      = \Delta - \frac{N_3L}{EA}\left(\frac12 + \frac{1}{2\sqrt{2}}\right)
      $$

      $$
      N_3 = \frac{2\sqrt{2}}{3\sqrt{2} + 1}\,\frac{EA\Delta}{L}
      = \frac{12 - 2\sqrt{2}}{17}\,\frac{EA\Delta}{L} = 0{,}5395\,\frac{EA\Delta}{L}
      $$

      **Resultado:**

      $$
      N_1 = 0{,}3815\,\frac{EA\Delta}{L}\ \text{(tracción)},\qquad
      N_2 = -0{,}3815\,\frac{EA\Delta}{L}\ \text{(compresión)},\qquad
      N_3 = 0{,}5395\,\frac{EA\Delta}{L}\ \text{(tracción)}
      $$

      B acaba $0{,}3815\,\Delta$ a la derecha y $0{,}2698\,\Delta$ más arriba,
      y la barra 3 se estira $0{,}5395\,\Delta$: algo más de la mitad del
      hueco lo cierra ella, y el resto lo pone B al moverse.

      **Comprobación.** El motor del curso (barras articuladas con un error
      de montaje en la 3: mide $\Delta$ menos que la distancia de B a E) da
      las tres fuerzas y los desplazamientos de B iguales, y el alargamiento
      que da para la 3 es $\Delta - (u_B + v_B)/\sqrt{2}$.

  # ── Teoría · pregunta 3 · torsión de la sección cerrada de pared delgada.
  - id: exerm1920-ext-3-la-torsion-de-la-seccion-cerrada
    titulo: La tensión tangencial y el ángulo de torsión de una sección cerrada de pared delgada
    fuente: >-
      Cuestión 3 de teoría · Extraordinaria del 29 de enero de 2020 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. La segunda parte del 13 de enero de
      2023 pide la misma deducción sin el ángulo («Torsión en secciones
      cerradas de pared delgada. Deducir la tensión tangencial.», también con
      1 punto), y está resuelta en el sitio; aquí se resuelve de nuevo, con
      otro ejemplo. El examen no publica
      resolución; el desarrollo es nuestro y sigue los apuntes del tema 12,
      apartado 12.5 (págs. 11 a 14). Los números de los pasos de cálculo son
      un ejemplo nuestro.
    nivel: examen
    enunciado: |
      3.(1p) Torsión en secciones cerradas de pared delgada. Deducir la
      tensión tangencial y el ángulo de torsión por unidad de longitud.
    pide: >-
      La tensión tangencial y el ángulo de torsión por unidad de longitud de
      una sección cerrada de pared delgada, deducidos.
    pasos:
      - tipo: reconocer
        pregunta: |
          La tensión sale del equilibrio. ¿Y el ángulo por unidad de
          longitud: qué se iguala para obtenerlo?
        opciones:
          - texto: >-
              El trabajo del torsor en una rebanada de longitud $dx$ y la
              energía de deformación que acumulan en ella las tensiones
              tangenciales
            correcta: true
            mensaje: |
              Eso es (ecs. 12.25 a 12.29, apuntes del tema 12, pp. 13-14). El
              trabajo es $\tfrac12M_t\,d\varphi$ y la energía,
              $\oint \tfrac{\tau^{2}}{2G}\,t\,ds\,dx$; con la tensión ya
              conocida, despejar $d\varphi/dx$ es inmediato.
          - texto: >-
              El equilibrio de un trozo de pared entre dos cortes,
              $\tau_At_A = \tau_Bt_B$
            mensaje: |
              Ese equilibrio da que el flujo $\tau t$ es uniforme (ec. 12.21):
              es el primer paso de la tensión, no del giro. El giro necesita
              algo que relacione el torsor con la deformación.
          - texto: >-
              El torsor y la tensión máxima con $\tau_{\max} = M_tt/I_t$, como
              en una sección abierta
            mensaje: |
              Esa es la de las secciones abiertas (ec. 12.17, p. 10), con la
              tensión lineal en el espesor. En la cerrada la tensión es
              uniforme en el espesor y el $I_t$ es otro: hay que deducirlo.
      - tipo: calcular
        titulo: La tensión máxima, en un ejemplo
        pregunta: |
          Un ejemplo nuestro: un cajón de $150 \times 100$ mm en la línea
          media, con las paredes de 150 mm de 6 mm de espesor y las de 100 mm
          de 4 mm, sometido a $M_t = 9$ kN·m. ¿Cuánto vale la tensión
          tangencial máxima, en MPa?
        respuesta:
          tipo: numero
          valor: '75'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '150'
            mensaje: |
              Te falta el 2: $M_t = 2A_tq$, porque $\oint r\,ds$ es el doble
              del área encerrada (ec. 12.24, p. 12).
          - valor: '50'
            mensaje: |
              Es la tensión de las paredes de 6 mm. El flujo es el mismo en
              todo el contorno, $\tau t = M_t/2A_t$: la máxima está en las
              paredes más delgadas, las de 4 mm.
          - valor: '69.34'
            mensaje: |
              Has tomado el área del contorno exterior, $156 \times 104$ mm.
              $A_t$ es el área que encierra la línea media.
          - valor: '81.38'
            mensaje: |
              Has tomado el área del hueco, $144 \times 96$ mm. $A_t$ es el
              área que encierra la línea media, a mitad del espesor.
        pista: |
          $\tau = M_t/(2A_tt)$ (ec. 12.24), con $A_t$ el área que encierra la
          línea media y $t$ el espesor del punto.
        desarrollo: |
          $A_t = 150\ \text{mm}\cdot100\ \text{mm} = 15\,000\ \text{mm}^{2}$, y la
          máxima está en las paredes de 4 mm:

          $$
          \tau_{\max} = \frac{M_t}{2A_tt_{\min}} = \frac{9\cdot10^{6}\ \text{N·mm}}{2\cdot15\,000\ \text{mm}^{2}\cdot4\ \text{mm}} = 75\ \text{MPa}
          $$

          En las de 6 mm, 50 MPa: el flujo es el mismo, 300 N/mm.
      - tipo: calcular
        titulo: El ángulo por unidad de longitud
        pregunta: |
          En el mismo cajón, con $G = 80$ GPa, ¿cuántos grados gira la sección
          por metro de longitud?
        respuesta:
          tipo: numero
          valor: '0.7162'
          tolerancia: 0.0005
          formato: un número, en grados por metro
        distractores:
          - valor: '2.8648'
            mensaje: |
              Te falta el 4: $I_t = 4A_t^{2}/\oint ds/t$ (ec. 12.29). Sale de
              elevar al cuadrado $\tau = M_t/2A_tt$ en la energía.
          - valor: '0.8952'
            mensaje: |
              Has tomado 4 mm en todo el contorno. La integral
              $\oint ds/t$ suma cada pared con su espesor:
              $2\cdot150/6 + 2\cdot100/4 = 100$.
          - valor: '0.5968'
            mensaje: |
              Has tomado 6 mm en todo el contorno. La integral
              $\oint ds/t$ suma cada pared con su espesor:
              $2\cdot150/6 + 2\cdot100/4 = 100$.
          - valor: '0.0125'
            mensaje: |
              Ese es el giro en radianes por metro. En grados:
              $0{,}0125 \cdot 180/\pi = 0{,}7162$.
        pista: |
          $\varphi_{,x} = M_t/(GI_t)$, con $I_t = 4A_t^{2}/\oint ds/t$
          (ec. 12.29); con paredes rectas, la integral es $\sum s_i/t_i$.
        desarrollo: |
          $$
          \oint\frac{ds}{t} = 2\cdot\frac{150\ \text{mm}}{6\ \text{mm}} + 2\cdot\frac{100\ \text{mm}}{4\ \text{mm}} = 100,\qquad
          I_t = \frac{4A_t^{2}}{\oint ds/t} = \frac{4\cdot(15\,000\ \text{mm}^{2})^{2}}{100} = 9\cdot10^{6}\ \text{mm}^{4}
          $$

          $$
          \varphi_{,x} = \frac{M_t}{GI_t} = \frac{9\cdot10^{6}\ \text{N·mm}}{80\,000\ \text{MPa}\cdot9\cdot10^{6}\ \text{mm}^{4}} = 1{,}25\cdot10^{-5}\ \text{rad/mm}
          $$

          Es $0{,}0125$ rad/m, que en grados son $0{,}7162$ °/m.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Deduce, como en el examen, la tensión tangencial y el ángulo de
          torsión por unidad de longitud de una sección cerrada de pared
          delgada, con los dibujos del trozo de pared y del triángulo de área.
        rubrica:
          - punto: >-
              Se dice de qué se parte: espesor pequeño y, por la analogía de
              Prandtl, tensión uniforme en el espesor y tangente a la línea
              media.
            porque: >-
              Es lo que permite trabajar con τ y t de cada punto del contorno,
              y lo que distingue la cerrada de la abierta.
            minimo: true
          - punto: >-
              Equilibrio según x de un trozo de pared de longitud dx entre dos
              cortes por A y por B: τA·tA = τB·tB, y el flujo q = τt es el
              mismo en todo el contorno (ec. 12.21).
            porque: >-
              Sin el flujo constante no se puede sacar τ de la integral del
              torsor.
            minimo: true
          - punto: >-
              El torsor: dMt = τ·t·ds·r (ec. 12.22), y como r·ds es el doble
              del área del triángulo con vértice en el punto, ∮r·ds = 2At:
              Mt = 2At·τ·t, de donde τ = Mt/(2At·t) (ecs. 12.23 y 12.24).
            porque: >-
              Es la primera mitad de lo que se pide, con At el área encerrada
              por la línea media.
            minimo: true
          - punto: >-
              Se dice que la máxima está en el espesor mínimo, y que lo que
              aguanta es el hueco: casi todo At es aire.
            porque: >-
              Es la consecuencia que se usa para dimensionar.
          - punto: >-
              El trabajo del torsor en la rebanada, dW = ½·Mt·dφ (ec. 12.25),
              y la energía, con U0 = τ²/(2G) (ec. 12.26):
              dU = ∮ τ²/(2G)·t·ds·dx (ec. 12.27).
            porque: >-
              Son las dos cosas que se igualan para el giro.
            minimo: true
          - punto: >-
              Con τ = Mt/(2At·t): dU = Mt²/(8At²G)·∮ds/t·dx (ec. 12.28), e
              igualando, φ,x = Mt/(G·It) con It = 4At²/∮ds/t (ec. 12.29), que
              en paredes rectas es una suma de si/ti.
            porque: >-
              Es la segunda mitad de lo que se pide, con el It de la cerrada.
            minimo: true
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Con pared delgada, la tensión es uniforme en el espesor y tangente
              a la línea media.
          - texto: >-
              Equilibrio de un trozo de pared según x: $\tau_At_A = \tau_Bt_B$, y
              el flujo $q = \tau t$ es constante.
          - texto: >-
              $M_t = q\oint r\,ds = 2A_tq$, y $\tau = M_t/(2A_tt)$.
          - texto: >-
              Trabajo y energía de una rebanada:
              $\tfrac12M_t\,d\varphi = \dfrac{M_t^{2}}{8A_t^{2}G}\oint\dfrac{ds}{t}\,dx$.
          - texto: >-
              $\varphi_{,x} = M_t/(GI_t)$, con $I_t = 4A_t^{2}/\oint ds/t$.
          - texto: >-
              La tensión es máxima donde la pared es más gruesa, porque allí
              pasa más material.
            trampa: true
            mensaje: |
              Al revés: el flujo $\tau t$ es el mismo en todo el contorno, así
              que donde $t$ es menor la tensión es mayor. En el ejemplo, 75 MPa
              en las paredes de 4 mm y 50 en las de 6.
    resolucion: |
      Se sigue el apartado 12.5 de los apuntes del tema 12 (pp. 11-14). La
      pared es delgada: por la analogía de Prandtl, la tensión tangencial es
      uniforme en el espesor y tangente a la línea media.

      **El flujo cortante es constante.** Se aísla un trozo de pared de
      longitud $dx$ entre dos cortes longitudinales, por A y por B, de
      espesores $t_A$ y $t_B$ (figura 12.8). En esos cortes actúan, por
      reciprocidad, las mismas tensiones que en la sección, y el equilibrio
      según $x$ (ec. 12.21, p. 11) da

      $$
      \tau_At_A\,dx = \tau_Bt_B\,dx \quad\Longrightarrow\quad q = \tau t = \text{cte.}
      $$

      **La tensión.** Sobre un trozo $ds$ de pared actúa
      $dF = \tau t\,ds = q\,ds$, tangente a la línea media, y su momento
      respecto de un punto G es $dM_t = q\,r\,ds$ (ec. 12.22, p. 12), con $r$
      la distancia de G a la tangente. $\tfrac12r\,ds$ es el área del
      triángulo de base $ds$ y vértice G (figura 12.9), así que
      $\oint r\,ds = 2A_t$, con $A_t$ el área encerrada por la línea media
      (ecs. 12.23 y 12.24):

      $$
      M_t = q\oint_L r\,ds = 2A_t\,q
      \qquad\Longrightarrow\qquad
      \tau = \frac{M_t}{2A_t\,t}
      $$

      La tensión es máxima donde el espesor es mínimo. Y lo que aguanta el
      torsor es el área encerrada, no el material: casi todo $A_t$ es hueco.

      **El ángulo por unidad de longitud.** El torsor hace en una rebanada
      de longitud $dx$ el trabajo $dW_t = \tfrac12M_t\,d\varphi$ (ec. 12.25,
      p. 13). Con solo tensiones tangenciales, la energía por unidad de
      volumen es $U_0 = \tau^{2}/2G$ (ec. 12.26), y en la rebanada
      (ecs. 12.27 y 12.28):

      $$
      dU_t = \oint_L\frac{\tau^{2}}{2G}\,t\,ds\,dx = \frac{M_t^{2}}{8A_t^{2}G}\oint_L\frac{ds}{t}\,dx
      $$

      Igualando trabajo y energía (ec. 12.29, p. 14):

      $$
      \varphi_{,x} = \frac{d\varphi}{dx} = \frac{M_t}{GI_t},\qquad
      I_t = \frac{4A_t^{2}}{\oint_L ds/t}
      $$

      Con paredes rectas de espesor uniforme, la integral es $\sum s_i/t_i$.

      **Un ejemplo (nuestro).** Un cajón de $150 \times 100$ mm en la línea
      media, con las paredes largas de 6 mm y las cortas de 4 mm, y
      $M_t = 9$ kN·m: $A_t = 15\,000$ mm², $q = 300$ N/mm, $\tau = 75$ MPa en
      las paredes de 4 mm y 50 MPa en las de 6. Con $G = 80$ GPa,
      $\oint ds/t = 100$, $I_t = 9\cdot10^{6}$ mm⁴ y
      $\varphi_{,x} = 1{,}25\cdot10^{-5}$ rad/mm, es decir, 0,7162 grados por
      metro. El motor del curso (torsión de una sección cerrada de pared
      delgada por tramos) da las mismas cifras.

  # ── Teoría · pregunta 4 · las ecuaciones de Cauchy.
  - id: exerm1920-ext-4-las-ecuaciones-de-cauchy
    titulo: Las ecuaciones de Cauchy, el vector tensión de un plano cualquiera
    fuente: >-
      Cuestión 4 de teoría · Extraordinaria del 29 de enero de 2020 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Casi la misma pregunta es la cuestión
      1 de teoría del primer parcial del 16 de noviembre de 2018 («Deducir la
      relación entre el vector tensión correspondiente a un plano que pasa
      por el origen y las tensiones normales y tangenciales de los planos
      coordenados.», también con 1 punto), y está resuelta en el sitio; aquí
      se resuelve de nuevo, con otro ejemplo. El examen no publica resolución; el desarrollo es
      nuestro y sigue los apuntes del tema 2, apartado 2.4.1 (págs. 9 a 11).
      Los números de los pasos de cálculo son un ejemplo nuestro.
    nivel: examen
    enunciado: |
      4.(1p) Tensor de Tensiones. Deducir las ecuaciones de Cauchy, es decir,
      los componentes del vector tensión en un sistema de referencia.
    pide: >-
      Las componentes cartesianas del vector tensión de un plano cualquiera
      en función de las tensiones de los planos coordenados, deducidas.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el equilibrio del tetraedro aparecen también las fuerzas de
          volumen, $\vec F\,dV$. ¿Por qué no quedan en las ecuaciones de
          Cauchy?
        opciones:
          - texto: >-
              Porque, al dividir por el área de la cara inclinada, quedan
              multiplicadas por $dV/A_{ABC}$, que tiende a cero al encoger el
              tetraedro hasta el punto
            correcta: true
            mensaje: |
              Eso es (p. 11). El volumen es un infinitésimo de orden superior
              al área: $dV/A_{ABC}$ es del orden de la altura del tetraedro. Las
              fuerzas de superficie se quedan y las de volumen desaparecen.
          - texto: >-
              Porque se supone que no hay fuerzas de volumen: se desprecia el
              peso propio
            mensaje: |
              No hace falta suponerlo: la ec. 2.10 las incluye. Lo que pasa es
              que van multiplicadas por $dV$, un orden más pequeño que las
              áreas, y se anulan en el límite (p. 11).
          - texto: >-
              Porque las fuerzas de volumen están equilibradas por sí mismas
              dentro del tetraedro
            mensaje: |
              Una fuerza de volumen, el peso por ejemplo, tiene resultante
              $\vec F\,dV$: no se equilibra sola. Desaparece porque es de orden
              superior frente a las fuerzas de las caras.
      - tipo: calcular
        titulo: Una componente del vector tensión, en un ejemplo
        pregunta: |
          Un ejemplo nuestro: en un punto, $\sigma_x = 40$, $\sigma_y = -10$,
          $\sigma_z = 20$, $\tau_{xy} = 20$, $\tau_{yz} = 30$ y
          $\tau_{zx} = 0$, todo en MPa. Para el plano de normal
          $n = (2, 3, 6)/7$, ¿cuánto vale la componente $S_{ny}$ del vector
          tensión, en MPa?
        respuesta:
          tipo: numero
          valor: '27.143'
          tolerancia: 0.005
          formato: un número con su signo, en MPa
        distractores:
          - valor: '-4.286'
            mensaje: |
              Has tomado solo la normal, $\sigma_yn_y$. La componente y del
              vector tensión recoge también las tangenciales de los otros dos
              planos coordenados: $S_{ny} = \tau_{xy}n_x + \sigma_yn_y + \tau_{zy}n_z$
              (ec. 2.13).
          - valor: '190'
            mensaje: |
              Has usado $(2, 3, 6)$ sin dividir por 7. Las ecuaciones de Cauchy
              piden los cosenos directores, con módulo uno.
          - valor: '-27.143'
            mensaje: |
              El valor es ese y el signo no. Con la normal exterior
              $\hat n$ y las tensiones positivas en las caras positivas, la
              ec. 2.13 se suma tal cual, sin cambiar signos.
        pista: |
          La segunda fila de la ec. 2.13:
          $S_{ny} = \tau_{xy}n_x + \sigma_yn_y + \tau_{zy}n_z$.
        desarrollo: |
          $$
          S_{ny} = 20\ \text{MPa}\cdot\tfrac27 - 10\ \text{MPa}\cdot\tfrac37 + 30\ \text{MPa}\cdot\tfrac67 = \tfrac{190}{7}\ \text{MPa} = 27{,}143\ \text{MPa}
          $$

          Las otras dos: $S_{nx} = 20$ MPa y $S_{nz} = 30$ MPa.
      - tipo: calcular
        titulo: La componente normal
        pregunta: |
          En el mismo plano, ¿cuánto vale la componente normal
          $\sigma_n = \{n\}^{t}\{S_n\}$, en MPa?
        respuesta:
          tipo: numero
          valor: '43.061'
          tolerancia: 0.005
          formato: un número con su signo, en MPa
        distractores:
          - valor: '45.130'
            mensaje: |
              Es el módulo del vector tensión, $|\vec S_n|$. La normal es su
              proyección sobre $\hat n$; la diferencia es la tangencial,
              $\tau_n^{2} = |\vec S_n|^{2} - \sigma_n^{2}$.
          - valor: '16.122'
            mensaje: |
              Te faltan los términos de las tangenciales:
              $\sigma_n = \{n\}^{t}[\sigma]\{n\}$ lleva también
              $2\tau_{xy}n_xn_y + 2\tau_{yz}n_yn_z + 2\tau_{zx}n_zn_x$.
        pista: |
          $\sigma_n = S_{nx}n_x + S_{ny}n_y + S_{nz}n_z$ (ec. 2.16).
        desarrollo: |
          $$
          \sigma_n = 20\ \text{MPa}\cdot\tfrac27 + \tfrac{190}{7}\ \text{MPa}\cdot\tfrac37 + 30\ \text{MPa}\cdot\tfrac67 = \tfrac{2110}{49}\ \text{MPa} = 43{,}061\ \text{MPa}
          $$

          Con $|\vec S_n| = 45{,}130$ MPa, la tangencial es
          $\tau_n = \sqrt{45{,}130^{2} - 43{,}061^{2}}\ \text{MPa} = 13{,}508\ \text{MPa}$.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Deduce las ecuaciones de Cauchy como en el examen, con el dibujo del
          tetraedro y la relación entre sus áreas, y escríbelas en forma
          matricial.
        rubrica:
          - punto: >-
              Se aísla el tetraedro elemental OABC: tres caras en los planos
              coordenados y la cuarta, ABC, de normal exterior n = (nx, ny, nz),
              con el dibujo.
            porque: >-
              Es el elemento que relaciona un plano cualquiera con los tres
              coordenados.
            minimo: true
          - punto: >-
              Los vectores tensión de las caras coordenadas, cuya normal
              exterior es −x, −y, −z, con sus componentes cambiadas de signo:
              Sx = −σx·i − τxy·j − τxz·k y las otras dos (ec. 2.9).
            porque: >-
              Es donde se pierden los signos: la cara de OBC mira hacia −x.
            minimo: true
          - punto: >-
              El equilibrio de fuerzas, con la de volumen:
              Sn·A_ABC + Sx·A_OBC + Sy·A_OAC + Sz·A_OAB + F·dV = 0 (ec. 2.10).
            porque: >-
              Es la ecuación de partida; las tensiones van por su área.
            minimo: true
          - punto: >-
              Las áreas de las caras coordenadas son las proyecciones de ABC:
              A_OBC = nx·A_ABC, A_OAC = ny·A_ABC, A_OAB = nz·A_ABC
              (ecs. 2.11 y 2.12), justificado con el dibujo.
            porque: >-
              Es lo que hace aparecer los cosenos directores.
            minimo: true
          - punto: >-
              Se divide por A_ABC y se lleva el tetraedro al punto: dV/A_ABC
              tiende a cero y la fuerza de volumen desaparece.
            porque: >-
              Sin decirlo, la ecuación final tendría un término de más.
            minimo: true
          - punto: >-
              Las tres ecuaciones, Snx = σx·nx + τyx·ny + τzx·nz y las otras
              dos (ec. 2.13), y la forma matricial {Sn} = [σ]{n} (ec. 2.14),
              con [σ] simétrica.
            porque: >-
              Es el resultado que se pide, en las dos formas.
            minimo: true
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Se aísla el tetraedro OABC, con la cara ABC de normal
              $\hat n = (n_x, n_y, n_z)$.
          - texto: >-
              Las caras coordenadas miran hacia $-x$, $-y$, $-z$: sus vectores
              tensión llevan las componentes cambiadas de signo.
          - texto: >-
              Equilibrio:
              $\vec S_nA_{ABC} + \vec S_xA_{OBC} + \vec S_yA_{OAC} + \vec S_zA_{OAB} + \vec F\,dV = \vec 0$.
          - texto: >-
              $A_{OBC} = n_xA_{ABC}$, $A_{OAC} = n_yA_{ABC}$ y
              $A_{OAB} = n_zA_{ABC}$.
          - texto: >-
              Se divide por $A_{ABC}$; en el límite la fuerza de volumen se va,
              y queda $\{S_n\} = [\sigma]\{n\}$.
          - texto: >-
              Del equilibrio de momentos del tetraedro salen las tres
              ecuaciones de Cauchy.
            trampa: true
            mensaje: |
              Salen del de fuerzas: una ecuación por eje (ec. 2.13, apuntes
              del tema 2, p. 11). Los momentos dan otra cosa, la simetría de
              las tangenciales, y se toman en el paralelepípedo elemental
              (ecs. 2.6 a 2.8, pp. 8-9).
    resolucion: |
      Se sigue el apartado 2.4.1 de los apuntes del tema 2 (pp. 9-11).

      **El tetraedro.** Para conocer el vector tensión de un plano cualquiera
      que pasa por O, se aísla el tetraedro elemental OABC (figura 2.8): tres
      caras en los planos coordenados y la cuarta, ABC, de normal exterior
      $\hat n = (n_x, n_y, n_z)$. Las caras coordenadas tienen normal exterior
      $-\hat\imath$, $-\hat\jmath$ y $-\hat k$, y por eso sus vectores tensión
      llevan las componentes cambiadas de signo (ec. 2.9, p. 9):

      $$
      \vec S_x = -\sigma_x\hat\imath - \tau_{xy}\hat\jmath - \tau_{xz}\hat k,\qquad
      \vec S_y = -\tau_{yx}\hat\imath - \sigma_y\hat\jmath - \tau_{yz}\hat k,\qquad
      \vec S_z = -\tau_{zx}\hat\imath - \tau_{zy}\hat\jmath - \sigma_z\hat k
      $$

      **El equilibrio.** Con la fuerza por unidad de volumen $\vec F$
      (ec. 2.10, p. 10):

      $$
      \vec S_nA_{ABC} + \vec S_xA_{OBC} + \vec S_yA_{OAC} + \vec S_zA_{OAB} + \vec F\,dV = \vec 0
      $$

      **Las áreas.** Cada cara coordenada es la proyección de ABC sobre su
      plano: $A_{OBC} = n_xA_{ABC}$, $A_{OAC} = n_yA_{ABC}$ y
      $A_{OAB} = n_zA_{ABC}$ (ec. 2.11). Para la de $n_y$ (figura 2.9): con
      OP y BP perpendiculares a AC y $n_y = \cos\beta$,
      $A_{ABC} = \tfrac12\,AC\cdot PB$ y $A_{OAC} = \tfrac12\,AC\cdot OP$
      (ec. 2.12), y $OP = PB\cos\beta$.

      **El límite.** Se sustituyen las áreas, se divide por $A_{ABC}$ y se
      encoge el tetraedro hasta el punto. La fuerza de volumen queda
      multiplicada por $dV/A_{ABC}$, del orden de la altura del tetraedro, y
      desaparece (p. 11). Descomponiendo según los ejes, las ecuaciones de
      Cauchy (ec. 2.13):

      $$
      \begin{aligned}
      S_{nx} &= \sigma_xn_x + \tau_{yx}n_y + \tau_{zx}n_z\\
      S_{ny} &= \tau_{xy}n_x + \sigma_yn_y + \tau_{zy}n_z\\
      S_{nz} &= \tau_{xz}n_x + \tau_{yz}n_y + \sigma_zn_z
      \end{aligned}
      \qquad\Longleftrightarrow\qquad
      \{S_n\} = [\sigma]\{n\}
      $$

      con $[\sigma]$ el tensor de tensiones (ec. 2.14), simétrico porque
      $\tau_{xy} = \tau_{yx}$, $\tau_{yz} = \tau_{zy}$ y
      $\tau_{zx} = \tau_{xz}$ (ecs. 2.6 a 2.8). Conocidas las tensiones de los
      tres planos coordenados, se conoce el vector tensión de cualquier
      plano por el punto; su componente normal es
      $\sigma_n = \{n\}^{t}[\sigma]\{n\}$ (ec. 2.16) y la tangencial,
      $\tau_n^{2} = |\vec S_n|^{2} - \sigma_n^{2}$.

      **Un ejemplo (nuestro).** Con $\sigma_x = 40$, $\sigma_y = -10$,
      $\sigma_z = 20$, $\tau_{xy} = 20$, $\tau_{yz} = 30$ y $\tau_{zx} = 0$
      MPa, y $\hat n = (2, 3, 6)/7$: $\vec S_n = (20;\ 27{,}143;\ 30)$ MPa,
      $\sigma_n = 43{,}061$ MPa y $\tau_n = 13{,}508$ MPa. El motor del curso
      (el vector tensión y sus componentes intrínsecas) da lo mismo.

  # ── Problema 1 · la roseta a 0°, 30° y 150°.
  - id: exerm1920-ext-5-la-roseta-de-galgas-a-0-30-y-150
    titulo: Una roseta de tres galgas sobre un triángulo, sus tensiones principales y el plano perpendicular a una galga
    fuente: >-
      Problema 1 · Extraordinaria del 29 de enero de 2020 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1,5 puntos. El examen no publica resolución; el desarrollo es
      nuestro, con los convenios de los temas 2, 3 y 4.
    nivel: examen
    enunciado: |
      1. (1,5p) En un estado de tensión plana, se conocen las deformaciones
      dadas por las galgas a, b y c de la figura.

      Determinar:

      a) Las deformaciones $\varepsilon_x$, $\varepsilon_y$, $\gamma_{xy}$ en
      función de $\varepsilon_a$, $\varepsilon_b$, y $\varepsilon_c$

      $\varepsilon_a = 3\cdot10^{-4}$; $\varepsilon_b = 12\cdot10^{-4}$;
      $\varepsilon_c = -7.5\cdot10^{-4}$; $E = 70$ GPa; $\nu = 0{,}3$

