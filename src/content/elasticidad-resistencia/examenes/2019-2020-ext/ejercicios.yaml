      - tipo: reconocer
        pregunta: |
          ¿En qué punto de la viga está la tensión principal máxima?
        opciones:
          - texto: >-
              En el empotramiento, en la esquina de arriba a la derecha:
              $y = -5t$, $z = 4t$
            correcta: true
            mensaje: |
              Eso es. Allí los dos flectores traccionan, $M_z$ negativo arriba y
              $M_y$ positivo a la derecha, y son los mayores de la viga. El axil
              resta poco, y el torsor del tramo añade una tangencial pequeña.
          - texto: >-
              En el empotramiento, en la esquina de abajo a la izquierda, que es
              la más cargada en valor absoluto
            mensaje: |
              Esa esquina está comprimida: allí está la principal mínima, de
              unos −767 MPa. La máxima es la de tracción, en la esquina opuesta.
          - texto: >-
              Justo después de B, donde el torsor es mayor
            mensaje: |
              El torsor entre B y el extremo da 50 MPa de tangencial, pero allí los flectores
              son mucho menores: la principal sale de unos 172 MPa. En la pared
              la normal pasa de 750 MPa.
      - tipo: calcular
        titulo: La tensión normal en esa esquina
        pregunta: |
          ¿Cuánto vale $\sigma_x$ en la esquina de arriba a la derecha del
          empotramiento, en MPa?
        respuesta:
          tipo: numero
          valor: '758.09'
          tolerancia: 0.01
          formato: un número con su signo, en MPa
        distractores:
          - valor: '732.69'
            mensaje: |
              Te falta la excentricidad de la fuerza de C en los dos
              flectores: con ella, $M_z = -20{,}5$ y $M_y = 10{,}4$ kN·m, no
              $-20$ y $10$.
          - valor: '292.97'
            mensaje: |
              Te falta el $M_y$ de la horizontal de B, 10 kN·m: es el término
              que más pesa, porque $I_y$ es pequeño.
          - valor: '1300.74'
            mensaje: |
              Has cambiado $I_y$ e $I_z$. $I_z$ es el de flexión en el plano
              vertical, el grande: $3{,}68\cdot10^{6}$ mm⁴; $I_y = 8{,}6\cdot10^{5}$ mm⁴.
        pista: |
          La ec. 9.42: $\sigma_x = N/A + M_zy/I_z + M_yz/I_y$, con
          $A = 2400$ mm², $I_z = 3{,}68\cdot10^{6}$ mm⁴ e
          $I_y = 8{,}6\cdot10^{5}$ mm⁴.
        desarrollo: |
          $$
          \sigma_x = \frac{-10\,000\ \text{N}}{2400\ \text{mm}^{2}} + \frac{(-20{,}5\cdot10^{6}\ \text{N·mm})\cdot(-50\ \text{mm})}{3{,}68\cdot10^{6}\ \text{mm}^{4}} + \frac{10{,}4\cdot10^{6}\ \text{N·mm}\cdot40\ \text{mm}}{8{,}6\cdot10^{5}\ \text{mm}^{4}} = 758{,}09\ \text{MPa}
          $$

          Son $-4{,}17 + 278{,}53 + 483{,}72$ MPa.
      - tipo: calcular
        titulo: La tensión tangencial de torsión en la pared
        pregunta: |
          Con el $I_t$ del enunciado, tomando las alas y el alma como tres
          rectángulos de $80 \times 10$ mm, ¿cuánto vale la tensión tangencial
          máxima de torsión en el empotramiento, en MPa?
        respuesta:
          tipo: numero
          valor: '12.5'
          tolerancia: 0.01
          formato: un número, en MPa
        distractores:
          - valor: '4.167'
            mensaje: |
              Te falta el ⅓ de $I_t$: sin él, $I_t$ sale el triple y la tensión,
              la tercera parte. Los apuntes imprimen las ecs. 12.19 y 12.20 sin
              el ⅓, que está en el texto (p. 10); el enunciado lo da con él.
          - valor: '112.5'
            mensaje: |
              Has sumado los dos torsores sin signo, 0,9 kN·m. Entre la pared y
              B el torsor es $0{,}5 - 0{,}4 = 0{,}1$ kN·m.
          - valor: '50'
            mensaje: |
              Es la tensión entre B y el extremo, con 0,4 kN·m. En el empotramiento el
              torsor es 0,1 kN·m.
        pista: |
          $I_t = \tfrac13\sum t_i^{3}s_i$ con tres trozos de 80 mm y 10 mm de
          espesor, y $\tau_{\max} = M_tt/I_t$.
        desarrollo: |
          $$
          I_t = \tfrac13\cdot3\cdot(10\ \text{mm})^{3}\cdot80\ \text{mm} = 80\,000\ \text{mm}^{4},\qquad
          \tau_{\max} = \frac{0{,}1\cdot10^{6}\ \text{N·mm}\cdot10\ \text{mm}}{80\,000\ \text{mm}^{4}} = 12{,}5\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La tensión principal máxima
        pregunta: |
          ¿Cuánto vale la tensión principal máxima, en MPa?
        respuesta:
          tipo: numero
          valor: '758.29'
          tolerancia: 0.25
          formato: un número con su signo, en MPa
        distractores:
          - valor: '171.66'
            mensaje: |
              Es la principal justo después de B, con el torsor mayor, 50 MPa,
              pero con los flectores pequeños. En la pared la normal es mucho
              mayor, y manda.
          - valor: '-766.62'
            mensaje: |
              Es la principal mínima, la de la esquina de abajo a la izquierda,
              comprimida. Se pide la máxima: la de tracción.
        pista: |
          Con $\sigma_x$ y $\tau$ en el mismo punto,
          $\sigma_1 = \tfrac12\sigma_x + \sqrt{(\tfrac12\sigma_x)^{2} + \tau^{2}}$
          (ecs. 2.68 y 2.69 con $\sigma_y = 0$).
        desarrollo: |
          $$
          \sigma_1 = \frac{758{,}09\ \text{MPa}}{2} + \sqrt{\left(\frac{758{,}09\ \text{MPa}}{2}\right)^{2} + (12{,}5\ \text{MPa})^{2}} = 758{,}29\ \text{MPa}
          $$

          La torsión apenas añade 0,2 MPa: casi toda la principal es la normal
          de flexión.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Cada fuerza se lleva al eje con su par $\vec r\times\vec F$.
          - texto: >-
              En la pared: $N = -10$ kN, $M_t = 0{,}1$, $M_y = 10{,}4$ y
              $M_z = -20{,}5$ kN·m.
          - texto: >-
              La esquina de arriba a la derecha suma las tracciones de los dos
              flectores: $\sigma_x = 758{,}09$ MPa.
          - texto: >-
              $I_t = 80\,000$ mm⁴ y $\tau = 12{,}5$ MPa; $\sigma_1 = 758{,}29$ MPa.
          - texto: >-
              La fuerza de C es paralela a la viga y solo da axil.
            trampa: true
            mensaje: |
              Paralela pero fuera de G: al llevarla al eje deja un $M_z$ de
              0,5 kN·m y un $M_y$ de 0,4 kN·m en toda la viga.
    resolucion: |
      **Los ejes y la sección.** x a lo largo de la viga, desde la pared (A,
      $x = 0$) hasta el extremo ($x = 2$ m); y hacia abajo y z a la derecha,
      con el origen en G, el centro de la sección. Con $t = 10$ mm, las alas
      miden $80 \times 10$ mm y están a $\pm45$ mm de G, y el alma,
      $10 \times 80$ mm entre ellas:

      $$
      A = 2400\ \text{mm}^{2},\qquad
      I_z = \frac{80\cdot100^{3} - 70\cdot80^{3}}{12}\ \text{mm}^{4} = 3{,}68\cdot10^{6}\ \text{mm}^{4},\qquad
      I_y = 8{,}6\cdot10^{5}\ \text{mm}^{4}
      $$

      **Las fuerzas, llevadas al eje.** Cada una deja en el eje la fuerza y su
      par $\vec r\times\vec F$, con $\vec r$ desde G hasta su punto (en m y
      kN):

      - en B ($x = 1$ m), $\vec F = (0;\ 0;\ -10)$ en $(0;\ -0{,}05;\ 0{,}04)$:
        par $(0{,}5;\ 0;\ 0)$ kN·m respecto de su sección;
      - en el extremo, $\vec F = (0;\ 10;\ 0)$ en $(0;\ -0{,}05;\ 0{,}04)$:
        par $(-0{,}4;\ 0;\ 0)$;
      - en C, $\vec F = (-10;\ 0;\ 0)$ en $(0;\ 0{,}05;\ -0{,}04)$: par
        $(0;\ 0{,}4;\ 0{,}5)$, que con el convenio de $M_z$ (positivo si
        tracciona abajo) es $M_y = 0{,}4$ y $M_z = -0{,}5$ kN·m.

      **a) Los diagramas.** Los esfuerzos de cada sección son la resultante
      de lo que queda hacia el extremo (apuntes del tema 7):

      - $N = -10$ kN en toda la viga (compresión);
      - $T_y = 10$ kN en toda la viga; $T_z = -10$ kN de la pared a B y 0 de
        B al extremo;
      - $M_t = 0{,}1$ kN·m de la pared a B y $-0{,}4$ kN·m de B al extremo;
      - $M_z$, lineal: $-20{,}5$ kN·m en la pared, $-10{,}5$ en B y $-0{,}5$
        en el extremo;
      - $M_y$: 10,4 kN·m en la pared, lineal hasta 0,4 en B, y 0,4 hasta el
        extremo.

      Los diagramas están en el paso de dibujo.

      **b) La tensión principal máxima.** Sin las tensiones de las cortantes,
      cada punto tiene la normal de la ec. 9.42 (apuntes del tema 9, p. 24) y
      la tangencial de torsión. Los flectores son máximos en la pared, y allí
      la esquina de arriba a la derecha ($y = -50$ mm, $z = 40$ mm) tiene las
      dos tracciones de flexión:

      $$
      \sigma_x = \frac{N}{A} + \frac{M_zy}{I_z} + \frac{M_yz}{I_y} = (-4{,}17 + 278{,}53 + 483{,}72)\ \text{MPa} = 758{,}09\ \text{MPa}
      $$

      La tangencial de torsión es la de una sección abierta de pared
      delgada, con el $I_t$ del enunciado (ecs. 12.17 y 12.20, apuntes del
      tema 12, pp. 10-11), tomando la sección como tres rectángulos de
      $80 \times 10$ mm:

      $$
      I_t = \tfrac13\cdot3\cdot80\cdot10^{3}\ \text{mm}^{4} = 80\,000\ \text{mm}^{4},\qquad
      \tau = \frac{M_tt}{I_t} = 12{,}5\ \text{MPa}
      $$

      Con $\sigma_y = 0$ y el círculo de Mohr (ecs. 2.68 y 2.69):

      $$
      \sigma_1 = \frac{\sigma_x}{2} + \sqrt{\left(\frac{\sigma_x}{2}\right)^{2} + \tau^{2}} = 758{,}29\ \text{MPa}
      $$

      Si se toma el alma con la longitud de su línea media, 90 mm, como miden
      los apuntes la integral de la ec. 12.19 (p. 11),
      $I_t = 83\,333$ mm⁴ y $\tau = 12{,}0$ MPa: la principal no cambia en
      las cifras que importan. Después de B el torsor sube a 0,4 kN·m
      ($\tau = 50$ MPa), pero la normal baja a 157,1 MPa, y la principal se
      queda en 171,7 MPa. La mínima está en la esquina opuesta de la pared:
      $-766{,}6$ MPa. Son tensiones muy por encima del límite elástico de un acero de construcción:
      el ejercicio es de cálculo, no de diseño.

      **Comprobaciones.** El motor del curso (los esfuerzos de una barra
      espacial empotrada, con las cargas como fuerza y par en el eje, y sus
      cálculos de sección, de flexión y de torsión abierta) da los mismos
      esfuerzos y tensiones. Por otro camino, los momentos se han escrito a
      mano como $\vec r\times\vec F$ de las fuerzas de cada tramo, y casan.

  # ── Problema 4 · el pórtico ABCD unido en C al pilar FC. Impreso «3.».
  - id: exerm1920-ext-8-el-portico-abcd-y-el-pilar-fc
    titulo: El pórtico ABCD articulado en C a un pilar empotrado, por energía de flexión
    fuente: >-
      Problema 4 (impreso «3.») · Extraordinaria del 29 de enero de 2020 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1,5 puntos. El examen no publica resolución;
      el desarrollo es nuestro, con los convenios del tema 13.
    nivel: examen
    enunciado: |
      3. (1,5p) El sistema ABCD de la figura está conectado al pilar FC
      mediante una articulación en C. La estructura, soporta una fuerza
      horizontal en B y una carga uniformemente repartida en el tramo CD.
      Siendo el momento de inercia de ABCD y FC $I_z$ y el módulo de
      elasticidad $E$, teniendo en cuenta la energía correspondiente a
      flexión determinar:

      a) La reacción horizontal en A.

      b) El desplazamiento vertical en D.

