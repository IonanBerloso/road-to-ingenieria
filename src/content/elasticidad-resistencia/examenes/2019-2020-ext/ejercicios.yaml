      - tipo: calcular
        titulo: El centro de gravedad de la sección
        pregunta: |
          ¿A qué distancia de la cara de arriba de la sección está G, en
          unidades de $t$?
        respuesta:
          tipo: numero
          valor: '5.75'
          tolerancia: 0.005
          formato: un número, en unidades de t
        distractores:
          - valor: '9.25'
            mensaje: |
              Esa es la distancia de G a la cara de abajo, los extremos de las
              patas. Desde arriba, $15t - 9{,}25t = 5{,}75t$.
          - valor: '7.5'
            mensaje: |
              Es la mitad de la altura. La sección no es simétrica respecto de
              un eje horizontal: el ala de arriba sube G.
        pista: |
          Tres rectángulos: el ala de $12t \times t$ con su centro a $t/2$ de
          arriba y dos patas de $t \times 14t$ con su centro a $8t$.
        desarrollo: |
          $$
          \overline{y} = \frac{12t^{2}\cdot0{,}5t + 2\cdot14t^{2}\cdot8t}{12t^{2} + 2\cdot14t^{2}} = \frac{230t^{3}}{40t^{2}} = 5{,}75\,t
          $$
      - tipo: calcular
        titulo: El momento de inercia
        pregunta: |
          ¿Cuánto vale $I_z$, respecto del eje horizontal que pasa por G, en
          unidades de $t^{4}$?
        respuesta:
          tipo: numero
          valor: '930.83'
          tolerancia: 0.01
          formato: un número, en unidades de t⁴
        distractores:
          - valor: '458.33'
            mensaje: |
              Son solo los momentos propios de los tres rectángulos. Cada uno
              tiene su centro lejos de G: falta el término de Steiner,
              $A_id_i^{2}$.
        pista: |
          Steiner para cada rectángulo:
          $I_z = \sum\left(\tfrac{b_ih_i^{3}}{12} + A_id_i^{2}\right)$, con
          $d_i$ la distancia de su centro a G.
        desarrollo: |
          $$
          I_z = \frac{12t\cdot t^{3}}{12} + 12t^{2}(5{,}25t)^{2} + 2\left(\frac{t\,(14t)^{3}}{12} + 14t^{2}(2{,}25t)^{2}\right) = 930{,}83\,t^{4}
          $$
      - tipo: reconocer
        pregunta: |
          ¿Qué sección y qué fibra dan la tracción máxima?
        opciones:
          - texto: >-
              La del flector máximo positivo, en la fibra de abajo, a
              $9{,}25t$ de G
            correcta: true
            mensaje: |
              Eso es. El flector positivo tracciona abajo, y la fibra de abajo
              está a $9{,}25t$ de G. En C el flector es mayor, pero tracciona
              arriba, a solo $5{,}75t$: hay que comparar las dos, y gana la del
              vano.
          - texto: >-
              La de C, en la fibra de arriba: allí está el mayor flector en
              valor absoluto
            mensaje: |
              Es el mayor flector, pero tracciona la fibra de arriba, que está
              a $5{,}75t$ de G. En el vano, con un flector menor, la fibra
              traccionada está a $9{,}25t$: hay que comparar
              $|M|\,y_{\text{trac}}$ en las dos.
          - texto: >-
              La de C, en la fibra de abajo, que es la más alejada de G
            mensaje: |
              En C el flector es negativo: la fibra de abajo está comprimida.
              Allí la tracción está arriba.
      - tipo: calcular
        titulo: El espesor
        pregunta: |
          Con $a = 4$ m y $q_0 = 10$ N/mm, ¿cuánto vale el espesor $t$, en mm?
        respuesta:
          tipo: numero
          valor: '13.55'
          tolerancia: 0.01
          formato: un número, en mm
        distractores:
          - valor: '12.72'
            mensaje: |
              Es el espesor que pide la sección C, con la tracción arriba. La
              del vano es más exigente: menos flector, pero la fibra traccionada
              está más lejos de G.
          - valor: '14.91'
            mensaje: |
              Has juntado el flector de C con la distancia de la fibra de
              abajo, $9{,}25t$; o has medido G desde abajo. En C la tracción
              está arriba, a $5{,}75t$ de G. O has dimensionado con la mayor
              tensión en valor absoluto, que es esa compresión: el enunciado
              limita solo la tracción.
          - valor: '11.56'
            mensaje: |
              Has usado el flector máximo positivo con la fibra de arriba. El
              positivo tracciona abajo, a $9{,}25t$ de G.
          - valor: '13.24'
            mensaje: |
              Has usado el flector en B, $\tfrac{7}{24}q_0a^{2}$. El máximo
              está algo más allá, en $x = 55a/48$.
          - valor: '17.16'
            mensaje: |
              Es el espesor con $I_z$ sin Steiner. El momento de inercia
              respecto de G lleva el término $A_id_i^{2}$ de cada rectángulo.
        pista: |
          $\sigma = M\,y/I_z$ (ec. 9.23), con $y = 9{,}25t$ e
          $I_z = 930{,}83\,t^{4}$: queda una ecuación en $t^{3}$.
        desarrollo: |
          $M_{\max} = 0{,}3129\cdot10\ \text{N/mm}\cdot(4000\ \text{mm})^{2} = 5{,}0069\cdot10^{7}\ \text{N·mm}$.
          Con $\sigma = M\cdot9{,}25t/(930{,}83t^{4}) = 200$ MPa:

          $$
          t^{3} = \frac{5{,}0069\cdot10^{7}\ \text{N·mm}\cdot9{,}25}{930{,}83\cdot200\ \text{MPa}} = 2487{,}8\ \text{mm}^{3}
          \quad\Longrightarrow\quad t = 13{,}55\ \text{mm}
          $$

          En C, con la tracción arriba, bastaría con $t = 12{,}72$ mm.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $M(x) = R_Ax - q_0\langle x-a\rangle^{2} + R_C\langle x-2a\rangle + \tfrac12q_0\langle x-2a\rangle^{2}$,
              con la $2q_0$ sumada y restada.
          - texto: >-
              Integrando dos veces y con $v(0) = v(2a) = v(3a) = 0$ y el
              equilibrio: $R_A = \tfrac{7}{24}q_0a$, $R_C = \tfrac{63}{24}q_0a$ y
              $R_D = \tfrac{1}{12}q_0a$.
          - texto: >-
              Flectores: $\tfrac{721}{2304}q_0a^{2}$ en $x = 55a/48$ y
              $-\tfrac{5}{12}q_0a^{2}$ en C.
          - texto: >-
              Sección: G a $5{,}75t$ de arriba e $I_z = 930{,}83t^{4}$.
          - texto: >-
              La tracción máxima está en el vano, abajo, a $9{,}25t$ de G:
              $t = 13{,}55$ mm.
          - texto: >-
              Se dimensiona con el mayor flector en valor absoluto, el de C, y la
              fibra más alejada de G.
            trampa: true
            mensaje: |
              El flector de C tracciona arriba, a $5{,}75t$ de G, y su fibra de
              abajo está comprimida. Se compara $M\,y$ de la fibra traccionada
              en cada sección, y gana el vano.
    resolucion: |
      **El planteamiento.** Con A en $x = 0$, B en $a$, C en $2a$ y D en $3a$,
      se sustituyen los tres apoyos por sus reacciones, hacia arriba. La
      $2q_0$ de BC se escribe hasta el final y se resta desde C (figura 10.6,
      apuntes del tema 10, p. 9), y la $q_0$ de CD empieza en C:

      $$
      M(x) = R_Ax - q_0\langle x-a\rangle^{2} + q_0\langle x-2a\rangle^{2} + R_C\langle x-2a\rangle - \tfrac12q_0\langle x-2a\rangle^{2}
      = R_Ax - q_0\langle x-a\rangle^{2} + R_C\langle x-2a\rangle + \tfrac12q_0\langle x-2a\rangle^{2}
      $$

      **La elástica.** Con la EDE, $v_{,xx} = -M/EI_z$ (ec. 10.14, p. 7), integrando
      dos veces:

      $$
      EI_zv = -\frac{R_Ax^{3}}{6} + \frac{q_0\langle x-a\rangle^{4}}{12} - \frac{R_C\langle x-2a\rangle^{3}}{6} - \frac{q_0\langle x-2a\rangle^{4}}{24} + C_1x + C_2
      $$

      $v(0) = 0$ da $C_2 = 0$; $v(2a) = 0$ da $C_1 = \tfrac23R_Aa^{2} - \tfrac{1}{24}q_0a^{3}$;
      y $v(3a) = 0$, con esa $C_1$, da $15R_A + R_C = 7q_0a$. El equilibrio
      de momentos respecto de D da $3R_A + R_C = \tfrac72q_0a$, y el de
      fuerzas, $R_A + R_C + R_D = 3q_0a$:

      $$
      R_A = \frac{7}{24}\,q_0a,\qquad R_C = \frac{63}{24}\,q_0a,\qquad R_D = \frac{1}{12}\,q_0a
      $$

      **a) Los diagramas.** Cortantes: $\tfrac{7}{24}q_0a$ de A a B; en BC,
      recta $V = \tfrac{7}{24}q_0a - 2q_0(x-a)$, hasta $-\tfrac{41}{24}q_0a$;
      en C sube $R_C$ hasta $\tfrac{11}{12}q_0a$, y en CD baja con pendiente
      $-q_0$ hasta $-\tfrac{1}{12}q_0a$, que cierra con $R_D$.

      Flectores: recta de 0 en A a $\tfrac{7}{24}q_0a^{2} = 0{,}2917\,q_0a^{2}$
      en B; en BC, parábola con el máximo donde $V = 0$, en
      $x = 55a/48$:
      $M_{\max} = \tfrac{721}{2304}q_0a^{2} = 0{,}3129\,q_0a^{2}$; corta el
      cero en $x = 1{,}705a$ y llega a C con

      $$
      M_C = R_A\cdot2a - q_0a^{2} = -\frac{5}{12}\,q_0a^{2} = -0{,}4167\,q_0a^{2}
      $$

      En CD, $M = -\tfrac{5}{12}q_0a^{2} + \tfrac{11}{12}q_0a\,s - \tfrac12q_0s^{2}$,
      con $s = x - 2a$: corta el cero en $s = 5a/6$, sube a
      $\tfrac{1}{288}q_0a^{2}$ y vuelve a 0 en D. Los diagramas están en el
      paso de dibujo.

      **b) La sección.** Una U invertida de $12t \times 15t$ con las tres
      paredes de espesor $t$: el ala de $12t \times t$ arriba y dos patas de
      $t \times 14t$. $A = 40t^{2}$ y G está a $\overline{y} = 230t^{3}/40t^{2} = 5{,}75t$
      de la cara de arriba, a $9{,}25t$ de la de abajo. Con Steiner:

      $$
      I_z = t^{4} + 12t^{2}(5{,}25t)^{2} + 2\left(\frac{14^{3}}{12}\,t^{4} + 14t^{2}(2{,}25t)^{2}\right) = 930{,}83\,t^{4}
      $$

      **La tracción máxima.** Con $\sigma = M_zy/I_z$ (ec. 9.23, apuntes del
      tema 9, p. 12) hay dos candidatas: el máximo positivo, que tracciona
      abajo, a $9{,}25t$, y C, que tracciona arriba, a $5{,}75t$. En
      unidades de $q_0a^{2}/t^{3}$: $0{,}3129\cdot9{,}25/930{,}83 = 3{,}11\cdot10^{-3}$
      frente a $0{,}4167\cdot5{,}75/930{,}83 = 2{,}57\cdot10^{-3}$. Manda el
      vano. Con $q_0a^{2} = 10\ \text{N/mm}\cdot(4000\ \text{mm})^{2} = 1{,}6\cdot10^{8}$ N·mm:

      $$
      \frac{0{,}3129\cdot1{,}6\cdot10^{8}\ \text{N·mm}\cdot9{,}25t}{930{,}83\,t^{4}} = 200\ \text{MPa}
      \quad\Longrightarrow\quad t = 13{,}55\ \text{mm}
      $$

      Con ese espesor la tracción en C, arriba, es de 165,5 MPa. La fibra de
      abajo de C está comprimida a 266,3 MPa: el enunciado solo limita la
      tracción.

      **Comprobaciones.** El motor del curso da las mismas reacciones y
      flectores por dos caminos (el teorema de los tres momentos y la elástica
      integrada), y la elástica por funciones de singularidad, con esas
      reacciones, pasa por cero en C. La sección y el espesor salen iguales
      con su cálculo de secciones y de flexión, que con $t = 13{,}55$ mm da
      200 MPa en la fibra de abajo.

  # ── Problema 3 · el voladizo de sección en I con tres fuerzas.
  - id: exerm1920-ext-7-el-voladizo-en-i-con-tres-fuerzas
    titulo: El voladizo de sección en I con tres fuerzas de 10 kN fuera del eje, sus diagramas y su tensión principal máxima
    fuente: >-
      Problema 3 · Extraordinaria del 29 de enero de 2020 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1,5 puntos. El examen no publica resolución; el desarrollo es
      nuestro, con los convenios de los temas 7, 9 y 12.
    nivel: examen
    enunciado: |
      3. (1,5p) La viga de la figura de 10 mm de espesor y está sometida a las
      cargas que se indican.

      a/ Dibujar los diagramas de fuerzas normales, de fuerzas cortantes, de
      momentos flectores y de momentos torsores.

      b/ Calcular la tensión principal máxima sin tener en cuenta las
      tensiones correspondientes a las fuerzas cortantes.

