ejercicios:
  # ── Teoría · pregunta 1 · el campo de desplazamientos del prisma.
  - id: exerm1920-ext-1-el-campo-de-desplazamientos-del-prisma
    titulo: El campo de desplazamientos de un prisma que no cambia de volumen, en deformación plana
    fuente: >-
      Cuestión 1 de teoría · Extraordinaria del 29 de enero de 2020 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes de los temas 3 y 4.
    nivel: examen
    enunciado: |
      1. (1p) La pieza prismática de la figura experimenta una transformación
      geométrica representada por el siguiente campo de desplazamientos

      $$
      \begin{aligned}
      u(x,y,z) &= a\,x + 400\cdot10^{-6}\,z\\
      v(x,y,z) &= -900\cdot10^{-6}\,y\\
      w(x,y,z) &= c\,z + b\,y - d\cdot200\cdot10^{-6}\,x
      \end{aligned}
      $$

      <figure class="figura-examen">
      <svg viewBox="0 0 460 212" role="img" width="460" height="212" aria-labelledby="exerm1920-ext-1-el-campo-de-desplazamientos-del-prisma-fig-t exerm1920-ext-1-el-campo-de-desplazamientos-del-prisma-fig-d">
