      **Notas nuestras.** Leemos que las tres paredes de la sección tienen
      espesor $t$, el que pide el apartado b: el dibujo no acota otro. En B
      no hay apoyo; la línea de trazos marca dónde empieza la carga $2q_0$.
      «q0» es $q_0$.
    pide: >-
      a) Los diagramas de cortantes y de flectores en función de q0 y a; b) el
      espesor t de la sección para que la tracción máxima sea de 200 MPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          La viga tiene tres apoyos, A, C y D. ¿Cómo se resuelve la
          hiperestaticidad con funciones de singularidad?
        opciones:
          - texto: >-
              La reacción de C entra como una carga más en la ley de flectores
              de toda la viga; se integra dos veces la elástica y los tres
              apoyos, $v(0) = v(2a) = v(3a) = 0$, junto con el equilibrio,
              dan las reacciones
            correcta: true
            mensaje: |
              Eso es. Con funciones de singularidad la ley de flectores de toda
              la viga es una sola expresión (apartado 10.3, apuntes del tema 10,
              pp. 7-9) y la EDE, $v_{,xx} = -M/EI_z$ (ec. 10.14), se integra con
              solo dos constantes. Cinco incógnitas, las tres reacciones y las
              dos constantes, y cinco ecuaciones: dos de equilibrio y tres
              flechas nulas.
          - texto: >-
              Se quita el apoyo C y se resuelve la viga AD como isostática: las
              funciones de singularidad son para vigas isostáticas
            mensaje: |
              Sin C la viga es otra y sus flectores también. La reacción
              hiperestática se escribe como una carga desconocida y la
              condición del apoyo que se quita, $v(2a) = 0$, la determina
              (apuntes del tema 11, p. 3).
          - texto: >-
              Se impone que el flector en C es nulo, como en todo apoyo
            mensaje: |
              El flector es nulo en un apoyo extremo sin empotrar. Sobre un
              apoyo intermedio de una viga continua no lo es: la viga pasa por
              encima sin rótula. Lo que se anula en C es la flecha.
      - tipo: calcular
        titulo: La reacción en A
        pregunta: |
          ¿Cuánto vale la reacción en A, hacia arriba, en unidades de $q_0a$?
        respuesta:
          tipo: numero
          valor: '0.2917'
          tolerancia: 0.0005
          formato: un número con su signo, en unidades de q0·a
        distractores:
          - valor: '1.1667'
            mensaje: |
              Es la reacción de la viga AD sin el apoyo C. C se lleva la mayor
              parte de la carga, y A, mucho menos.
          - valor: '0.3333'
            mensaje: |
              Has dejado la $2q_0$ hasta el final de la viga sin restarla en C,
              y la $q_0$ de CD ha ido encima: en $M(x)$, CD lleva $3q_0$. El
              equilibrio está bien, con la carga de la figura. Una repartida
              que no llega al extremo se escribe sumando y restando
              (figura 10.6, p. 9):
              $-q_0\langle x-a\rangle^{2} + q_0\langle x-2a\rangle^{2}$.
          - valor: '0.25'
            mensaje: |
              Has dejado la $2q_0$ hasta el final de la viga sin restarla en C,
              con la $q_0$ de CD encima, y has llevado esa carga también al
              equilibrio: CD con $3q_0$ en todo el cálculo. La $2q_0$ va solo
              de B a C. Una repartida que no llega al extremo se escribe
              sumando y restando (figura 10.6, p. 9):
              $-q_0\langle x-a\rangle^{2} + q_0\langle x-2a\rangle^{2}$.
        pista: |
          $M(x) = R_Ax - q_0\langle x-a\rangle^{2} + R_C\langle x-2a\rangle + \tfrac12q_0\langle x-2a\rangle^{2}$.
          Integra dos veces la EDE, $v_{,xx} = -M/EI_z$, impón $v(0) = v(2a) = v(3a) = 0$
          y usa el equilibrio de momentos respecto de D.
        desarrollo: |
          De $v(0) = 0$ y $v(2a) = 0$ sale la constante; con ella, $v(3a) = 0$
          da $15R_A + R_C = 7q_0a$. El equilibrio de momentos respecto de D,
          $3aR_A + aR_C = 2q_0a\cdot\tfrac32a + q_0a\cdot\tfrac12a$, da
          $3R_A + R_C = 3{,}5\,q_0a$. Restando:

          $$
          12R_A = 3{,}5\,q_0a \quad\Longrightarrow\quad R_A = \frac{7}{24}\,q_0a = 0{,}2917\,q_0a
          $$

          Y $R_C = \tfrac{63}{24}q_0a = 2{,}625\,q_0a$,
          $R_D = 3q_0a - R_A - R_C = \tfrac{1}{12}q_0a$.
      - tipo: calcular
        titulo: El flector en C
        pregunta: |
          ¿Cuánto vale el flector en C, en unidades de $q_0a^{2}$, positivo si
          tracciona la fibra de abajo?
        respuesta:
          tipo: numero
          valor: '-0.4167'
          tolerancia: 0.0005
          formato: un número con su signo, en unidades de q0·a²
        distractores:
          - valor: '0.4167'
            mensaje: |
              El valor es ese y el signo no. Sobre el apoyo intermedio la viga
              continua tracciona la fibra de arriba: el flector es negativo.
          - valor: '1.3333'
            mensaje: |
              Es el flector en $x = 2a$ de la viga AD sin el apoyo C. Con C, la
              viga se apoya allí y el flector cambia de signo.
          - valor: '-0.7083'
            mensaje: |
              Es lo que sale con la $2q_0$ en todo el vano AC. Va solo de B a C:
              de A a B no hay carga.
        pista: |
          $M(2a) = R_A\cdot2a - q_0a^{2}$, con la $R_A$ del paso anterior.
        desarrollo: |
          $$
          M_C = R_A\cdot2a - q_0a^{2} = \frac{7}{12}\,q_0a^{2} - q_0a^{2} = -\frac{5}{12}\,q_0a^{2} = -0{,}4167\,q_0a^{2}
          $$

          Por el teorema de los tres momentos sale lo mismo.
      - tipo: calcular
        titulo: El flector máximo positivo
        pregunta: |
          ¿Cuánto vale el mayor flector positivo, en unidades de $q_0a^{2}$?
        respuesta:
          tipo: numero
          valor: '0.3129'
          tolerancia: 0.0005
          formato: un número, en unidades de q0·a²
        distractores:
          - valor: '0.2917'
            mensaje: |
              Es el flector en B. Pasado B el cortante sigue siendo positivo, y
              el flector sigue subiendo hasta donde el cortante se anula, un
              poco más allá.
        pista: |
          En BC, $V = R_A - 2q_0(x - a)$; el máximo está donde $V = 0$.
        desarrollo: |
          $V = 0$ en $x - a = R_A/2q_0 = 7a/48$, es decir, en $x = 55a/48$:

          $$
          M_{\max} = R_A\,\frac{55a}{48} - q_0\left(\frac{7a}{48}\right)^{2} = \frac{721}{2304}\,q_0a^{2} = 0{,}3129\,q_0a^{2}
          $$
      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de cortantes y de flectores**, alineados
          bajo la viga, en función de $q_0$ y $a$, con los valores en A, B, C y
          D y el máximo del flector.
        comprueba:
          - punto: |
              **Cortante constante de $\tfrac{7}{24}q_0a$ de A a B**, recta en BC
              hasta $-\tfrac{41}{24}q_0a$, salto de $R_C = \tfrac{63}{24}q_0a$
              en C hasta $\tfrac{11}{12}q_0a$, y recta en CD hasta
              $-\tfrac{1}{12}q_0a$.
            porque: |
              Sin carga en AB el cortante no cambia; en BC baja con pendiente
              $-2q_0$ y en CD con $-q_0$. El salto de C es su reacción, y en D
              el cortante vale menos la reacción de D: si no cierra, hay un
              error antes.
          - punto: |
              **Flector: 0 en A, recta hasta $\tfrac{7}{24}q_0a^{2}$ en B** y
              parábola en BC con el máximo, $\tfrac{721}{2304}q_0a^{2}$, en
              $x = 55a/48$.
            porque: |
              El máximo está donde el cortante se anula, no en B, que es donde
              empieza la carga.
          - punto: |
              **$-\tfrac{5}{12}q_0a^{2}$ en C** y parábola en CD que vuelve a 0
              en D.
            porque: |
              Sobre el apoyo intermedio la viga continua flecta hacia arriba; en
              el apoyo extremo D, sin empotrar, el flector es nulo.
        figura: |
