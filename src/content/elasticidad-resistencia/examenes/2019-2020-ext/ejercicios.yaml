      $$
      \tau_{\max} = \frac{M_t\,t}{I_t}\qquad\qquad I_t = \frac13\sum_{i=1}^{n}t_i^{3}s_i
      $$

      **Notas nuestras.** «de 10 mm de espesor y está sometida» se transcribe
      como está. Viene del problema 2 de la segunda parte del 22 de enero de
      2016, que decía «es de sección cuadrada hueca de 10 mm de espesor y está
      sometida»: al cambiar la sección, la frase se quedó sin verbo. Leemos
      que $t = 10$ mm es el espesor de las alas y del alma:
      el canto mide $10t = 100$ mm y las alas, $8t = 80$ mm. Leemos también
      que cada fuerza actúa donde llega su flecha: la de 1 m, en la arista de
      arriba a la derecha (la línea de trazos solo sitúa B); la del extremo,
      en la punta derecha del ala de arriba; y la de C, en la punta izquierda
      del ala de abajo.
    pide: >-
      a) Los diagramas de axiles, cortantes, flectores y torsores; b) la
      tensión principal máxima, sin las tensiones de las cortantes.
    pasos:
      - tipo: reconocer
        pregunta: |
          La fuerza de C, de 10 kN, va a lo largo de la viga y está aplicada en
          la punta del ala de abajo. ¿Qué esfuerzos produce?
        opciones:
          - texto: >-
              Un axil de compresión de 10 kN y, por estar fuera de G, dos
              flectores: 10 kN por su distancia en y y 10 kN por su distancia
              en z
            correcta: true
            mensaje: |
              Eso es. Trasladada al eje, la fuerza deja su momento,
              $\vec r\times\vec F$: con $\vec r = (0;\ 5t;\ -4t)$ y
              $\vec F = (-10;\ 0;\ 0)$ kN, un $M_z$ y un $M_y$ de 0,5 y
              0,4 kN·m, iguales en toda la viga. Es la compresión excéntrica
              (apartado 9.4.2, apuntes del tema 9, p. 24).
          - texto: >-
              Solo un axil de compresión de 10 kN: es paralela a la viga
            mensaje: |
              Paralela sí, pero no pasa por G. Al llevarla al eje deja un par,
              $\vec r\times\vec F$, con dos componentes de flexión.
          - texto: >-
              Un axil y un torsor, porque está fuera del eje
            mensaje: |
              Una fuerza paralela al eje no da momento respecto de él: el
              torsor es la componente x de $\vec r\times\vec F$, y con
              $\vec F$ según x es nula. Da dos flectores.
      - tipo: calcular
        titulo: El torsor entre la pared y B
        pregunta: |
          ¿Cuánto vale el torsor entre la pared y B, en kN·m, con su signo
          (positivo si el vector momento va según +x en la cara que mira al
          extremo)?
        respuesta:
          tipo: numero
          valor: '0.1'
          tolerancia: 0.0005
          formato: un número con su signo, en kN·m
        distractores:
          - valor: '0.9'
            mensaje: |
              Has sumado los dos torsores sin signo. La fuerza de 1 m, hacia
              −z a 5t por encima de G, da $+0{,}5$ kN·m; la del extremo, hacia
              +y a 4t a la derecha, da $-0{,}4$ kN·m. Se restan.
          - valor: '-0.1'
            mensaje: |
              El valor es ese y el signo no. Con $M_x = yF_z - zF_y$: la de
              1 m da $(-0{,}05\ \text{m})(-10\ \text{kN}) = +0{,}5$ kN·m y la del
              extremo, $-(0{,}04\ \text{m})(10\ \text{kN}) = -0{,}4$ kN·m.
        pista: |
          El torsor es la componente x del momento de las fuerzas que quedan
          hacia el extremo, $M_x = yF_z - zF_y$, con $y$ y $z$ medidos desde G.
        desarrollo: |
          $$
          M_t = (-0{,}05\ \text{m})\cdot(-10\ \text{kN}) - (0{,}04\ \text{m})\cdot(10\ \text{kN}) = 0{,}1\ \text{kN·m}
          $$

          De B al extremo solo queda la vertical: $M_t = -0{,}4$ kN·m.
      - tipo: calcular
        titulo: El flector Mz en el empotramiento
        pregunta: |
          ¿Cuánto vale $M_z$ en el empotramiento, en kN·m, positivo si
          tracciona las fibras de $y$ positiva (las de abajo)?
        respuesta:
          tipo: numero
          valor: '-20.5'
          tolerancia: 0.005
          formato: un número con su signo, en kN·m
        distractores:
          - valor: '-20'
            mensaje: |
              Es solo la vertical del extremo por sus 2 m. Falta la fuerza de
              C: comprime a $5t$ por debajo de G y añade
              $10\ \text{kN}\cdot0{,}05\ \text{m} = 0{,}5$ kN·m del mismo signo.
          - valor: '20.5'
            mensaje: |
              El valor es ese y el signo no. La fuerza del extremo baja: el
              voladizo se curva hacia abajo y tracciona arriba, las fibras de
              $y$ negativa.
        pista: |
          La vertical de 10 kN a 2 m y la excentricidad en y de la fuerza de C.
        desarrollo: |
          $$
          M_z = -10\ \text{kN}\cdot2\ \text{m} - 10\ \text{kN}\cdot0{,}05\ \text{m} = -20{,}5\ \text{kN·m}
          $$

          En B, $-10{,}5$ kN·m, y en el extremo, $-0{,}5$: solo la
          excentricidad.
      - tipo: calcular
        titulo: El flector My en el empotramiento
        pregunta: |
          ¿Cuánto vale $M_y$ en el empotramiento, en kN·m, positivo si
          tracciona las fibras de $z$ positiva (las de la derecha)?
        respuesta:
          tipo: numero
          valor: '10.4'
          tolerancia: 0.005
          formato: un número con su signo, en kN·m
        distractores:
          - valor: '10'
            mensaje: |
              Es solo la horizontal de 1 m por su brazo. Falta la fuerza de C,
              a $4t$ a la izquierda de G: comprime la izquierda y añade
              $10\ \text{kN}\cdot0{,}04\ \text{m} = 0{,}4$ kN·m.
          - valor: '20.4'
            mensaje: |
              Has tomado la horizontal en el extremo, a 2 m. Está a 1 m de la
              pared, en B.
        pista: |
          La horizontal de 10 kN a 1 m de la pared y la excentricidad en z de
          la fuerza de C.
        desarrollo: |
          $$
          M_y = 10\ \text{kN}\cdot1\ \text{m} + 10\ \text{kN}\cdot0{,}04\ \text{m} = 10{,}4\ \text{kN·m}
          $$

          Desde B hasta el extremo queda solo la excentricidad, 0,4 kN·m.
      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de N, $T_y$, $T_z$, $M_t$, $M_y$ y $M_z$**,
          alineados bajo la viga, de la pared al extremo, con los valores en
          la pared, en B y en el extremo.
        comprueba:
          - punto: |
              **N = −10 kN y $T_y$ = 10 kN en toda la viga**; $T_z = -10$ kN de
              la pared a B y nulo de B al extremo.
            porque: |
              Los esfuerzos de una sección son la resultante de lo que queda
              hacia el extremo. La horizontal de B solo cuenta antes de B.
          - punto: |
              **$M_t$ = 0,1 kN·m de la pared a B y −0,4 kN·m de B al
              extremo**, con un salto de 0,5 kN·m en B.
            porque: |
              El torsor solo cambia donde actúa un par según x; la fuerza de B,
              al llevarla al eje, deja uno de 0,5 kN·m.
          - punto: |
              **$M_z$ lineal de −20,5 kN·m en la pared a −0,5 kN·m en el
              extremo**, pasando por −10,5 en B sin salto.
            porque: |
              La pendiente es la cortante $T_y$, constante; lo que queda en el
              extremo es la excentricidad de la fuerza de C.
          - punto: |
              **$M_y$ lineal de 10,4 kN·m en la pared a 0,4 en B**, y 0,4
              constante hasta el extremo.
            porque: |
              Pasado B no hay cortante $T_z$: el flector no cambia, y vale la
              excentricidad de la fuerza de C.
        figura: |
          <svg viewBox="0 0 460 508" role="img" width="460" height="508" aria-labelledby="exerm1920-ext-7-el-voladizo-en-i-con-tres-fuerzas-dia-t exerm1920-ext-7-el-voladizo-en-i-con-tres-fuerzas-dia-d">
