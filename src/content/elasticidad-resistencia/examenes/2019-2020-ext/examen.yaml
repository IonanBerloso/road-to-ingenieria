# La convocatoria extraordinaria de Elasticidad y Resistencia de Materiales
# de 2019-2020, fechada el 29/01/2020 («Examen Final: 29/01/2020»;
# «Azterketa Finala: 2020/01/29» en euskera): tres páginas, en euskera y en
# castellano, de la Escuela de Ingeniería de Gipuzkoa. La página 1 es de
# teoría (TEORIA/ TEORÍA: cuatro preguntas de 1 punto) y la 2 y la 3, de
# problemas (ARIKETAK / EJERCICIOS: cuatro de 1,5 puntos). Diez puntos en
# total, y el cuadernillo los imprime todos.
#
# Se transcribe la columna en castellano, tal cual, con sus puntos
# impresos. Lo que hay que saber de ese texto, dicho antes de que nadie lo
# deduzca:
#
# 1. **LAS HOJAS DE PROBLEMAS LLEVAN OTRA FECHA.** Las páginas 2 y 3
#    imprimen «Examen Final: 21/06/2019» («Azterketa Finala: 2019/06/21»):
#    es la cabecera de la plantilla de la final de junio de 2019, que no se
#    cambió. Los problemas no son los de aquella final, que tiene otros. La
#    fecha del examen es la de la página 1.
#
# 2. **EL PDF PIERDE PARTE DE TRES FIGURAS.** El PDF es una conversión
#    del Word original. En la pregunta 2 de teoría no imprime las tres
#    barras, sus uniones ni la cota de Δ: solo la pared, el techo, el punto
#    E, los rótulos y las dos cotas de L. Las barras se han leído del Word
#    (la 1 horizontal de A a B, la 2 vertical de B al techo, en C, y la 3 a
#    45° de B a D, en la recta de E), y todas las figuras se han redibujado
#    de él. El texto, el PDF lo imprime igual que el Word; las figuras,
#    casi: en el problema 1 la galga b sale paralela a la c, a 30°, cuando
#    en el Word va a 150°, sobre el lado derecho del triángulo; y en el
#    problema 4 el apoyo A pierde su triángulo.
#
# 3. **LECTURAS.** Teoría 2: las uniones son articulaciones y Δ es pequeña
#    frente a L; la barra 2 mide L/√2, porque E está en la recta de la
#    barra 3 y el techo a su altura. Problema 1: la galga a está a 0°, la c
#    a 30° y la b a 150° (los lados del triángulo, con x hacia la derecha e
#    y hacia arriba). Problema 2: las tres paredes de la sección en U tienen
#    espesor t (el dibujo las pinta más gruesas, sin acotar); B no es un
#    apoyo. Problema 3: t = 10 mm es el espesor de alas y alma; la fuerza de
#    1 m actúa en la arista de arriba a la derecha (la línea de trazos solo
#    sitúa B), la vertical del extremo en la punta derecha del ala de
#    arriba y la de C en la punta izquierda del ala de abajo; para el I_t
#    del enunciado, la sección son tres rectángulos de 8t × t. Problema 4: A
#    es un apoyo fijo y F un empotramiento (en el Word, bajo la base de F
#    hay un triángulo de apoyo tapado por un rectángulo blanco).
#
# 4. **NUMERACIÓN.** El cuarto problema se imprime «3.», como el tercero,
#    en las dos lenguas. Aquí es el ejercicio 8, con sus puntos.
#
# 5. **DIFERENCIAS CON EL EUSKERA.** En el problema 3 el euskera dice que
#    la viga «tiene» 10 mm de espesor («Irudiko habeak 10 mm lodiera du»),
#    donde el castellano escribe «de 10 mm de espesor y está sometida», sin
#    verbo. En lo demás, las dos columnas piden lo mismo.
#
# 6. **ERRATAS Y RAREZAS DEL TEXTO, CONSERVADAS**: la frase de la teoría 1
#    que empieza por «Sabiendo que» sin verbo principal; «3.(1p)» y
#    «4.(1p)» sin espacio; «en función de εa, εb, y εc» sin punto final;
#    «-7.5·10⁻⁴» con punto decimal junto a «0,3» con coma; «Tensiones eta
#    direcciones principales», con la «y» del euskera; «a = 4m, q0 = 10
#    N/mm,» con la coma final; «La estructura, soporta» con la coma; y «a/»
#    y «b/» en el problema 3. Los espacios dobles de «utilizando  el»,
#    «sea  200 MPa» y «La estructura,  soporta» se dejan en uno. El PDF
#    lleva resaltados en amarillo algunos números de pregunta; no se
#    reproducen.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso (src/lib/erm) y de un segundo camino
# (fase-p/p9i, guiones/cifras.mjs). Las preguntas 3 y 4 de teoría no traen
# números: sus pasos de cálculo usan ejemplos nuestros, y lo dicen.
# Ninguna de las ocho preguntas está ya en el sitio. La 3 de teoría se
# parece a la cuestión 4 de la segunda parte del 13 de enero de 2023, que
# no pide el ángulo; la 4, a la cuestión 1 del primer parcial del 16 de
# noviembre de 2018, con otras palabras. Los cuatro problemas son
# versiones de exámenes anteriores que el sitio aún no tiene. Tres son de
# 2012-2013: la roseta, de la final de enero, con otras lecturas; la viga
# continua, de la extraordinaria de junio, allí de 3 puntos y con otro
# criterio (el espesor sale de la máxima tensión normal, la compresión de
# abajo en C, 14,91 mm, y aquí de la máxima de tracción, 13,55 mm); y el
# pórtico, de esa misma extraordinaria, allí con ABCD rígido. El 3 es el
# problema 2 de la segunda parte del 22 de enero de 2016, allí con sección
# cuadrada hueca: su enunciado decía «es de sección cuadrada hueca de 10
# mm de espesor y está sometida», y de ahí la frase sin verbo de este.
# Ninguno es idéntico.
