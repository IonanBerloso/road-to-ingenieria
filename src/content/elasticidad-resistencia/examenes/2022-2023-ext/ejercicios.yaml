      **Notas nuestras.** La galga b es transversal al tirante y la a forma
      45° con su eje, como en el detalle. Las palancas de A y de C son
      rígidas. El tirante FG no tiene datos. CH y HI no están acotados; se
      toman iguales a CJ y JK, de longitud L. Los tirantes trabajan a
      tracción y a compresión. «εε» al empezar la primera fórmula y los ε
      sueltos tras las dos fórmulas se transcriben como salen.
    pide: >-
      a) El alargamiento de DE, en unidades de M0·L²/(E·IpBC). b) Los momentos
      torsores de AB y de BC. c) Los giros de A, B y C, en unidades de
      M0·L/(G·IpBC).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué información dan las galgas del tirante DE?
        opciones:
          - texto: >-
              La deformación axial del tirante, y con ella su alargamiento;
              como DE sujeta la palanca de A, ese alargamiento da el giro de la
              sección A
            correcta: true
            mensaje: |
              Eso es. El tirante solo lleva axil: la galga transversal lee
              $-\nu\varepsilon$ y la de 45°, $(1 - \nu)\,\varepsilon/2$, y las
              dos dan $\varepsilon$. El alargamiento, dividido por el brazo de
              D, es el giro de A, y con él el eje se resuelve sin saber nada
              de FG.
          - texto: >-
              El momento torsor del eje: unas galgas a 45° miden la torsión
            mensaje: |
              Eso es con las galgas pegadas en el eje, donde hay cortadura
              pura. Estas están en el tirante, que solo trabaja a axil.
          - texto: >-
              Nada que haga falta: A está empotrado y basta la compatibilidad
              de giros entre A y C
            mensaje: |
              A no está empotrado: lo sujetan dos tirantes a través de una
              palanca, y gira lo que se alarga DE dividido por el brazo.
              Tomarlo empotrado cambia el reparto del par.
      - tipo: calcular
        titulo: El alargamiento del tirante DE
        pregunta: |
          ¿Cuánto se alarga DE, en unidades de $M_0L^{2}/(EI_{pBC})$?
        respuesta:
          tipo: numero
          valor: '2'
          tolerancia: 0.002
          formato: un número (el alargamiento dividido por M0·L²/(E·IpBC))
        distractores:
          - valor: '0.6667'
            mensaje: |
              Has multiplicado la lectura de la galga a por L. La galga a está
              a 45°: no lee la deformación del eje del tirante, sino
              $(1 - \nu)\,\varepsilon/2 = \varepsilon/3$.
          - valor: '1.3333'
            mensaje: |
              Has tomado $\varepsilon = \varepsilon_a - \varepsilon_b$. Eso es
              la distorsión en una pieza a cortadura, no la deformación de un
              tirante: aquí $\varepsilon = 2\varepsilon_a/(1 - \nu) = 3\varepsilon_a$.
        pista: |
          Con tensión axial: $\varepsilon_b = -\nu\varepsilon$ y, a 45°,
          $\varepsilon_a = \tfrac{1}{2}(\varepsilon - \nu\varepsilon)$
          (ec. 3.55). Con $\nu = 1/3$, $\varepsilon = 3\varepsilon_a$.
        desarrollo: |
          $$
          \varepsilon = \frac{2\varepsilon_a}{1 - \nu} = 3\varepsilon_a = \frac{2M_0L}{I_{pBC}E},\qquad \Delta L_{DE} = \varepsilon L = 2\,\frac{M_0L^{2}}{EI_{pBC}}
          $$
      - tipo: calcular
        titulo: El giro de la sección A
        pregunta: |
          ¿Cuánto gira la sección A, en unidades de $M_0L/(GI_{pBC})$?
        respuesta:
          tipo: numero
          valor: '0.375'
          tolerancia: 0.001
          formato: un número (el giro dividido por M0·L/(G·IpBC))
        distractores:
          - valor: '0.75'
            mensaje: |
              Has dividido por L. D está a 2L del eje: el giro es
              $\Delta L/(2L)$.
          - valor: '1'
            mensaje: |
              Has dejado el giro en $M_0L/(EI_{pBC})$. Para pasarlo a $G$,
              $E = 2(1 + \nu)G = 8G/3$ (ec. 4.6).
        pista: |
          $\varphi_A = \Delta L_{DE}/(2L)$, y $E = 2(1 + \nu)G = 8G/3$.
        desarrollo: |
          $$
          \varphi_A = \frac{2M_0L^{2}}{EI_{pBC}}\cdot\frac{1}{2L} = \frac{M_0L}{EI_{pBC}} = \frac{3}{8}\,\frac{M_0L}{GI_{pBC}} = 0{,}375\,\frac{M_0L}{GI_{pBC}}
          $$
      - tipo: calcular
        titulo: El torsor del tramo AB
        pregunta: |
          ¿Cuánto vale el momento torsor del tramo AB, en unidades de $M_0$?
        respuesta:
          tipo: numero
          valor: '0.4167'
          tolerancia: 0.0005
          formato: un número (el torsor dividido por M0)
        distractores:
          - valor: '0.6667'
            mensaje: |
              Es el reparto con A y C empotrados, en proporción a las
              rigideces. Pero A gira lo que dicen las galgas, y esa parte del
              giro de B no la pone el tramo AB.
          - valor: '0.3125'
            mensaje: |
              Has tomado la misma inercia polar en los dos tramos. La de AB es
              el doble: AB gira la mitad por unidad de torsor.
        pista: |
          Con la ec. 12.14: $\varphi_B - \varphi_A = M_{tAB}L/(G\cdot2I_{pBC})$
          y $\varphi_C - \varphi_B = (M_{tAB} - M_0)\,L/(GI_{pBC})$. Los
          tirantes de C son tan rígidos frente al eje que $\varphi_C$ es casi
          nulo.
        desarrollo: |
          Con $\varphi_C = 0$ y en las unidades de arriba,
          $0{,}375 + \tfrac{1}{2}t + (t - 1) = 0$, con $t = M_{tAB}/M_0$, así
          que $t = 0{,}625/1{,}5 = 0{,}4167$. Con la rigidez real de C sale
          $0{,}41668$: lo mismo.
      - tipo: calcular
        titulo: El giro de la sección B
        pregunta: |
          ¿Cuánto gira la sección B, en unidades de $M_0L/(GI_{pBC})$?
        respuesta:
          tipo: numero
          valor: '0.5833'
          tolerancia: 0.0005
          formato: un número (el giro dividido por M0·L/(G·IpBC))
        distractores:
          - valor: '0.3333'
            mensaje: |
              Es el giro de B con A y C empotrados. A ya gira 0,375 de partida.
          - valor: '0.6875'
            mensaje: |
              Es con la misma inercia polar en los dos tramos. AB tiene el
              doble, y gira menos.
          - valor: '0.2083'
            mensaje: |
              Es solo lo que gira B respecto de A, $M_{tAB}L/(2GI_{pBC})$. Falta
              sumarle el giro de A.
        pista: |
          $\varphi_B = \varphi_A + M_{tAB}L/(G\cdot2I_{pBC})$.
        desarrollo: |
          $\varphi_B = (0{,}375 + 0{,}4167/2)\,M_0L/(GI_{pBC}) = 0{,}5833\,M_0L/(GI_{pBC})$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Las galgas dan la deformación axial de DE,
              $\varepsilon = 3\varepsilon_a$, y
              $\Delta L_{DE} = 2M_0L^{2}/(EI_{pBC})$.
          - texto: >-
              La palanca de A, con brazo 2L, convierte ese alargamiento en
              giro: $\varphi_A = 0{,}375\,M_0L/(GI_{pBC})$.
          - texto: >-
              Los tirantes de C le dan una rigidez $2EAL$, unas 21 730 veces la
              del tramo BC: C apenas gira.
          - texto: >-
              La compatibilidad de giros da $M_{tAB} = 5M_0/12$ y
              $M_{tBC} = -7M_0/12$.
          - texto: >-
              Los giros: 0,375 en A, 0,5833 en B y casi cero en C, en
              $M_0L/(GI_{pBC})$.
          - texto: >-
              Como A y C están sujetos, el par se reparte en proporción a las
              rigideces de los tramos: $M_{tAB} = 2M_0/3$.
            trampa: true
            mensaje: |
              Eso sería con A y C empotrados. A gira
              $0{,}375\,M_0L/(GI_{pBC})$, lo que dicen las galgas, y el torsor
              de AB baja a $5M_0/12$.
    resolucion: |
      **Las galgas del tirante DE.** El tirante solo lleva axil:
      $\sigma$ según su eje, y nada más. La galga b, transversal, lee
      $\varepsilon_b = -\nu\varepsilon$; la a, a 45° (ec. 3.55 con
      $u_x = u_y = 1/\sqrt2$), $\varepsilon_a = \tfrac{1}{2}(1 - \nu)\,\varepsilon$.
      Con $\nu = 1/3$, $\varepsilon_a = \varepsilon/3 = -\varepsilon_b$, como
      dice el enunciado, y

      $$
      \varepsilon = 3\varepsilon_a = \frac{2M_0L}{I_{pBC}E}
      $$

      **a) El alargamiento de DE**, de longitud L:

      $$
      \Delta L_{DE} = \varepsilon L = 2\,\frac{M_0L^{2}}{EI_{pBC}}
      $$

      Con $I_{pBC} = \pi d^{4}/32$ y $d = L/20$, es
      $\Delta L_{DE} = 3{,}26\cdot10^{6}\,M_0/(EL^{2})$.

      **El giro de A.** DE sujeta la palanca rígida de A con un brazo de 2L:

      $$
      \varphi_A = \frac{\Delta L_{DE}}{2L} = \frac{M_0L}{EI_{pBC}} = \frac{3}{8}\,\frac{M_0L}{GI_{pBC}}
      $$

      con $E = 2(1 + \nu)G = 8G/3$ (ec. 4.6). Se toma en el sentido de $M_0$,
      el que estira DE, como dicen las galgas. Así no hace falta FG, del que
      no hay datos.

      **La rigidez de C.** Los tirantes HI y JK, de longitud L y sección
      $L^{2}/400$, están a L del eje. Si C gira $\varphi_C$, uno se alarga y el
      otro se acorta $\varphi_C L$, y el par que hacen es

      $$
      M_C = 2\,\frac{EA}{L}\,(\varphi_CL)\,L = 2EAL\,\varphi_C = \frac{EL^{3}}{200}\,\varphi_C
      $$

      Frente a la rigidez del tramo BC, $GI_{pBC}/L$, es
      $\kappa = \dfrac{EL^{3}/200}{GI_{pBC}/L} = 21\,730$ veces mayor: C
      está prácticamente empotrado.

      **b) Los momentos torsores.** Con $M_{tAB}$ el torsor de AB, el de BC
      es $M_{tAB} - M_0$. Los giros de los tramos (ec. 12.14, p. 8), con
      $I_{pAB} = 2I_{pBC}$:

      $$
      \varphi_B = \varphi_A + \frac{M_{tAB}L}{2GI_{pBC}},\qquad \varphi_C = \varphi_B + \frac{(M_{tAB} - M_0)\,L}{GI_{pBC}} = -\frac{M_{tAB} - M_0}{\kappa}\,\frac{L}{GI_{pBC}}
      $$

      En unidades de $M_0$ y de $M_0L/(GI_{pBC})$, con $t = M_{tAB}/M_0$:
      $0{,}375 + 1{,}5\,t - 1 = (1 - t)/\kappa$, de donde

      $$
      t = \frac{0{,}625 + 1/\kappa}{1{,}5 + 1/\kappa} = 0{,}41668 \approx \frac{5}{12}
      $$

      $M_{tAB} = 5M_0/12$ y $M_{tBC} = -7M_0/12$: el par se reparte entre las
      palancas de A ($5M_0/12$) y los tirantes de C ($7M_0/12$).

      **c) Los giros**, en $u = M_0L/(GI_{pBC})$: $\varphi_A = 0{,}375\,u$;
      $\varphi_B = (0{,}375 + 0{,}4167/2)\,u = 0{,}5833\,u$; y
      $\varphi_C = (1 - 0{,}41668)/21\,730\cdot u = 2{,}68\cdot10^{-5}\,u$,
      prácticamente cero. Entre ellos, rectas: la de AB con la mitad de
      pendiente por unidad de torsor que la de BC.

