      <figcaption>

      Redibujada del Word original: en el PDF la figura sale tan pequeña que
      apenas se leen las cotas.

      </figcaption>
      </figure>

      **Notas nuestras.** Los tres apoyos están dibujados igual; se toma A
      como apoyo fijo y C y E como móviles (con cargas verticales da lo
      mismo). El par $q_0a^{2}$ de D es horario, como lo dibuja la flecha. Las
      cotas de la sección (20t, 20t y 7t) van a las caras exteriores, y las
      tres paredes tienen espesor t. Las tensiones se piden en función de
      $q_0$, $a$ y $t$.
    pide: >-
      a) Los diagramas de cortantes y de flectores. b) y c) Las tensiones
      normales máximas de tracción y de compresión, en milésimas de q0·a²/t³.
      d) La tensión tangencial máxima, en milésimas de q0·a/t².
    pasos:
      - tipo: reconocer
        pregunta: |
          Para las tensiones normales de esta sección, ¿qué hay que tener en
          cuenta?
        opciones:
          - texto: >-
              Los ejes $y$, $z$ por G no son principales ($I_{yz} \neq 0$):
              aunque solo haya $M_z$, la flexión es desviada y se usan
              $M'_z$ y $M'_y$
            correcta: true
            mensaje: |
              Eso es (ec. 9.12). La sección no tiene ningún eje de simetría y
              su producto de inercia no se anula: el eje neutro no es
              paralelo a z, y las tensiones extremas no están donde diría la
              distancia vertical a G.
          - texto: >-
              Basta con $\sigma = M_z\,y/I_z$: el momento va según z
            mensaje: |
              Eso vale si $I_{yz} = 0$. Aquí no lo es, y el error no es
              pequeño: la tracción máxima saldría casi un 20 % menor.
          - texto: >-
              Como no hay $M_y$, el eje neutro es el eje z, por G
            mensaje: |
              Con $I_{yz} \neq 0$, un momento según z también hace girar la
              sección alrededor de y: el eje neutro pasa por G, pero forma un
              ángulo con z (ec. 9.13).
      - tipo: calcular
        titulo: El flector mayor
        pregunta: |
          ¿Cuánto vale el flector justo a la izquierda de D, en unidades de
          $q_0a^{2}$?
        respuesta:
          tipo: numero
          valor: '-0.75'
          tolerancia: 0.001
          formato: un número con su signo (el flector dividido por q0·a²)
        distractores:
          - valor: '0.25'
            mensaje: |
              Has tomado el par antihorario. La flecha del par baja por la
              derecha: es horario, y con él $R_E = q_0a/2$ y $R_C = 0$.
          - valor: '-0.5'
            mensaje: |
              Es el flector en C. De C a D la cortante sigue valiendo
              $-q_0a/2$ (la reacción de C es nula), y el flector baja otros
              $q_0a^{2}/4$ hasta D.
        pista: |
          La rótula separa AB, biapoyada en A y en B, que pasa $q_0a/2$ a BCE.
          Con esa fuerza y el par, momentos en C dan la reacción de E.
        desarrollo: |
          AB: $R_A = q_0a/2$, y la rótula le da $q_0a/2$ hacia arriba; sobre
          BCE baja $q_0a/2$ en B. Momentos en C, antihorario positivo:
          $\tfrac{1}{2}q_0a\cdot a - q_0a^{2} + R_E\,a = 0$, así que
          $R_E = q_0a/2$ y $R_C = 0$. Desde la izquierda, en $D^-$:

          $$
          M = -\tfrac{1}{2}q_0a\cdot\tfrac{3}{2}a = -0{,}75\,q_0a^{2}
          $$
      - tipo: calcular
        titulo: El centro de gravedad
        pregunta: |
          ¿A qué distancia del extremo izquierdo del ala de abajo está G, en
          unidades de t?
        respuesta:
          tipo: numero
          valor: '12.411'
          tolerancia: 0.005
          formato: un número (la distancia dividida por t)
        distractores:
          - valor: '11.658'
            mensaje: |
              Te has dejado el ala de arriba, que está a la derecha del alma y
              lleva G hacia ese lado.
          - valor: '7.589'
            mensaje: |
              Es la distancia desde el extremo derecho. La pregunta la mide
              desde el izquierdo.
        pista: |
          Tres rectángulos: el ala de arriba, $7t \times t$; el alma,
          $t \times 18t$; el ala de abajo, $20t \times t$.
        desarrollo: |
          $$
          z_G = \frac{7\cdot16{,}5 + 18\cdot13{,}5 + 20\cdot10}{45}\,t = \frac{558{,}5}{45}\,t = 12{,}411\,t
          $$

          y del mismo modo $y_G = 573{,}5/45\,t = 12{,}744\,t$ desde la cara de
          arriba.
      - tipo: calcular
        titulo: El producto de inercia
        pregunta: |
          ¿Cuánto vale el producto de inercia $I_{yz}$ respecto de los ejes
          por G ($y$ hacia abajo, $z$ a la derecha), en unidades de $t^{4}$?
        respuesta:
          tipo: numero
          valor: '-730.02'
          tolerancia: 0.1
          formato: un número con su signo (el producto dividido por t⁴)
        distractores:
          - valor: '730.02'
            mensaje: |
              El valor es ese y el signo no. Con $y$ hacia abajo, las dos alas
              quedan en cuadrantes de signos opuestos: la de arriba,
              $y - y_G < 0$ y $z - z_G > 0$; la de abajo, al revés. Los tres
              términos son negativos.
        pista: |
          Por el teorema de los ejes paralelos,
          $I_{yz} = \sum A_i\,(y_i - y_G)(z_i - z_G)$: un rectángulo no tiene
          producto propio respecto de sus ejes de simetría.
        desarrollo: |
          Ala de arriba: $7\cdot(-12{,}244)\cdot4{,}089 = -350{,}5$; alma:
          $18\cdot(-2{,}744)\cdot1{,}089 = -53{,}8$; ala de abajo:
          $20\cdot6{,}756\cdot(-2{,}411) = -325{,}8$. Suma:
          $I_{yz} = -730{,}0\,t^{4}$.
      - tipo: calcular
        titulo: La tensión máxima de tracción
        pregunta: |
          ¿Cuánto vale la tensión normal máxima de tracción, en milésimas de
          $q_0a^{2}/t^{3}$?
        respuesta:
          tipo: numero
          valor: '4.551'
          tolerancia: 0.005
          formato: un número (la tensión dividida por q0·a²/t³, por mil)
        distractores:
          - valor: '3.696'
            mensaje: |
              Es $M_z\,y/I_z$ en la fibra de arriba, como si $I_{yz} = 0$.
              Con $I_{yz} \neq 0$ aparece $M'_y$, que suma tracción en la
              esquina izquierda del ala de arriba.
          - valor: '1.614'
            mensaje: |
              Es la tracción máxima en $D^+$, con el flector positivo
              $q_0a^{2}/4$. El flector mayor en valor absoluto es el de
              $D^-$, y con él tracciona la parte de arriba.
          - valor: '3.034'
            mensaje: |
              Es la de la sección C, con $M = -q_0a^{2}/2$. El flector sigue
              creciendo en valor absoluto hasta $D^-$.
        pista: |
          La sección es $D^-$, con $M_z = -0{,}75\,q_0a^{2}$. Con la ec. 9.12,
          $\sigma$ es lineal en $y$ y en $z$: el máximo está en una esquina.
        desarrollo: |
          $I_z = 2586{,}06\,t^{4}$, $I_y = 951{,}39\,t^{4}$ y
          $k = 1 - \dfrac{730{,}02^{2}}{951{,}39\cdot2586{,}06} = 0{,}7834$. Con
          $M_y = 0$: $M'_z = M_z/k = -0{,}9574\,q_0a^{2}$ y
          $M'_y = -M_zI_{yz}/(I_zk) = -0{,}2703\,q_0a^{2}$. En la esquina de
          arriba a la izquierda del ala de arriba, $y - y_G = -12{,}744\,t$ y
          $z - z_G = 0{,}589\,t$:

          $$
          \sigma = \frac{0{,}9574\cdot12{,}744}{2586{,}06} - \frac{0{,}2703\cdot0{,}589}{951{,}39} = 0{,}004718 - 0{,}000167 = 0{,}004551
          $$

          en $q_0a^{2}/t^{3}$.
      - tipo: calcular
        titulo: La tensión máxima de compresión
        pregunta: |
          ¿Y la de compresión, con su signo, en milésimas de
          $q_0a^{2}/t^{3}$?
        respuesta:
          tipo: numero
          valor: '-4.842'
          tolerancia: 0.005
          formato: un número con su signo (la tensión dividida por q0·a²/t³, por mil)
        distractores:
          - valor: '-2.104'
            mensaje: |
              Es $M_z\,y/I_z$ en la fibra de abajo, como si $I_{yz} = 0$. El
              término de $M'_y$ más que duplica la compresión en la esquina
              derecha del ala de abajo.
          - valor: '-3.228'
            mensaje: |
              Es la de la sección C, con $M = -q_0a^{2}/2$. La más cargada es
              $D^-$.
        pista: |
          La misma sección, $D^-$; mira las esquinas del ala de abajo.
        desarrollo: |
          En la esquina de abajo a la derecha del ala de abajo,
          $y - y_G = 7{,}256\,t$ y $z - z_G = 7{,}589\,t$:

          $$
          \sigma = -\frac{0{,}9574\cdot7{,}256}{2586{,}06} - \frac{0{,}2703\cdot7{,}589}{951{,}39} = -0{,}002686 - 0{,}002156 = -0{,}004842
          $$

          en $q_0a^{2}/t^{3}$.
      - tipo: calcular
        titulo: Dónde está el máximo
        pregunta: |
          ¿A qué distancia de la cara de arriba está el máximo de la tensión
          tangencial en el alma, en unidades de $t$?
        respuesta:
          tipo: numero
          valor: '11.909'
          tolerancia: 0.01
          formato: un número (la distancia dividida por t)
        distractores:
          - valor: '12.744'
            mensaje: |
              Es la altura de G. Con $I_{yz} = 0$ el flujo de $T_y$ es máximo
              en G, pero aquí $I_{yz} \neq 0$: también cuenta $T'_z$, y el
              máximo sube a donde $dq_c/dy = 0$.
        pista: |
          $q_c = T'_yQ_{zc}/I_z + T'_zQ_{yc}/I_y$ (ecs. 9.31 y 9.34); deriva
          respecto de la altura del corte en el alma e iguala a cero.
        desarrollo: |
          $T'_y = T_y/k = 0{,}6383\,q_0a$ y
          $T'_z = -T_yI_{yz}/(I_zk) = 0{,}1802\,q_0a$. Cortando el alma a una
          distancia $y$ de la cara de arriba, lo de encima es el ala de arriba
          y el trozo de alma entre $t$ e $y$; al bajar el corte, $Q_{zc}$ crece
          en $t\,(y - y_G)\,dy$ y $Q_{yc}$ en $t\,(13{,}5t - z_G)\,dy$, así que
          $dq_c/dy = 0$ pide

          $$
          \frac{T'_y\,(y - y_G)}{I_z} + \frac{T'_z\,(13{,}5t - z_G)}{I_y} = 0\ \Longrightarrow\ y = 11{,}909\,t
          $$

          desde la cara de arriba: algo por encima de G, que está a
          $12{,}744\,t$.
      - tipo: calcular
        titulo: La tensión tangencial máxima
        pregunta: |
          ¿Cuánto vale la tensión tangencial máxima, en milésimas de
          $q_0a/t^{2}$?
        respuesta:
          tipo: numero
          valor: '30.42'
          tolerancia: 0.03
          formato: un número (la tensión dividida por q0·a/t², por mil)
        distractores:
          - valor: '11.11'
            mensaje: |
              Es la cortante entre el área, $T/A$: una media que no tiene en
              cuenta cómo se reparte. En una sección de pared delgada la
              tangencial va por las paredes, y es máxima en el alma.
          - valor: '27.78'
            mensaje: |
              Es la cortante repartida por igual en el alma, $T/(18t^{2})$.
              El flujo no es uniforme: crece hacia el centro del alma.
          - valor: '41.67'
            mensaje: |
              Es $3T/(2\cdot18t^{2})$, la parábola de un rectángulo aplicada
              al alma sola. Las alas también llevan parte del momento estático,
              y el alma no es una sección rectangular aislada.
        pista: |
          $|T| = q_0a/2$ de B a E, y también en A. En el corte del alma a
          $11{,}909\,t$ de arriba, con lo que queda encima,
          $q_c = T'_yQ_{zc}/I_z + T'_zQ_{yc}/I_y$ (ec. 9.34).
        desarrollo: |
          En $y = 11{,}909\,t$, con lo que queda encima (el ala de arriba y el
          alma hasta el corte), $Q_{zc} = -154{,}33\,t^{3}$ y
          $Q_{yc} = 40{,}50\,t^{3}$:

          $$
          q_c = -\frac{0{,}6383\cdot154{,}33}{2586{,}06} + \frac{0{,}1802\cdot40{,}50}{951{,}39} = -0{,}03809 + 0{,}00767 = -0{,}03042
          $$

          en $q_0a/t$; y $\tau = |q_c|/t = 0{,}03042\,q_0a/t^{2}$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La rótula hace la viga isostática: AB pasa $q_0a/2$ a BCE, y
              $R_A = R_E = q_0a/2$, $R_C = 0$.
          - texto: >-
              El flector mayor en valor absoluto es $-0{,}75\,q_0a^{2}$, en
              $D^-$; la cortante vale $-q_0a/2$ de B a E.
          - texto: >-
              G está a $12{,}744t$ de la cara de arriba y a $12{,}411t$ del
              extremo izquierdo, e $I_{yz} = -730{,}02\,t^{4}$: flexión
              desviada.
          - texto: >-
              Con $M'_z$ y $M'_y$, en $D^-$: tracción máxima
              $4{,}551\cdot10^{-3}$ y compresión máxima
              $-4{,}842\cdot10^{-3}$, en $q_0a^{2}/t^{3}$.
          - texto: >-
              Con $T'_y$ y $T'_z$, la tangencial máxima está en el alma:
              $30{,}42\cdot10^{-3}\,q_0a/t^{2}$.
          - texto: >-
              La tracción máxima está en AB, en el centro de la carga
              repartida, donde el flector es positivo.
            trampa: true
            mensaje: |
              El flector de AB llega solo a $q_0a^{2}/8$; en $D^-$ vale
              $-0{,}75\,q_0a^{2}$, seis veces más, y es allí donde están las dos
              tensiones extremas.
    resolucion: |
      **Las reacciones.** La rótula B separa la viga en AB y BCE. AB es una
      biapoyada en A y en la rótula con la carga $q_0a$:
      $R_A = q_0a/2$, y la rótula le da $q_0a/2$ hacia arriba. Sobre BCE
      baja, pues, $q_0a/2$ en B. Momentos en C (antihorario positivo; el par
      de D es horario):

      $$
      \tfrac{1}{2}q_0a\cdot a - q_0a^{2} + R_E\,a = 0\ \Longrightarrow\ R_E = \tfrac{1}{2}q_0a,\qquad R_C = \tfrac{1}{2}q_0a - R_E = 0
      $$

      **a) Los diagramas** (convenio del curso: $M > 0$ tracciona la fibra
      de abajo).

      - Cortante: $T = q_0a/2$ en A, baja en recta hasta $-q_0a/2$ en B y
        sigue constante, $-q_0a/2$, hasta E: en C la reacción es nula y el
        par no cambia la cortante.
      - Flector: en AB, parábola con máximo $q_0a^{2}/8$ en el centro y cero
        en la rótula; de B a D, recta: $-q_0a^{2}/2$ en C y
        $-\tfrac{3}{4}q_0a^{2}$ en $D^-$. El par horario sube el flector
        $q_0a^{2}$: $+\tfrac{1}{4}q_0a^{2}$ en $D^+$, y recta hasta cero en E.

