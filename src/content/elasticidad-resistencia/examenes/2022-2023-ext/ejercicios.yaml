      **Notas nuestras.** La barra tiene sección circular de diámetro $d$, y
      el valor de la cota, $a = 1{,}3d$, es el del cuadro del Word.
    pide: >-
      a) La tensión de tracción máxima y la de compresión máxima en la parte
      recta del eslabón, en función de P y d. b) La posición del eje neutro.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué esfuerzos hay en una sección del tramo recto de la derecha?
        opciones:
          - texto: >-
              Un axil de tracción $P$ y un flector $P\,a$: la fuerza no pasa
              por el centro de la sección, así que es flexión compuesta
            correcta: true
            mensaje: |
              Eso es. El tramo de la izquierda está abierto y no lleva nada:
              toda la fuerza pasa por el de la derecha, a una distancia $a$ de
              su eje. Es una tracción excéntrica (ecs. 9.41 y 9.43).
          - texto: >-
              Solo un axil $P/2$: cada tramo recto lleva la mitad de la carga
            mensaje: |
              Eso sería en un eslabón cerrado y simétrico, y aun así habría
              flector. Aquí el tramo de la izquierda está cortado: no lleva
              nada, y el de la derecha lleva toda la $P$.
          - texto: >-
              Solo un axil $P$: la parte recta es una barra a tracción
            mensaje: |
              Falta el flector. La recta de la carga está a $a = 1{,}3d$ del
              eje del tramo: al llevar $P$ al centro de la sección aparece un
              momento $P\,a$, que da mucha más tensión que el axil.
      - tipo: calcular
        titulo: La tracción máxima
        pregunta: |
          ¿Cuánto vale la tensión de tracción máxima en el tramo recto, en
          unidades de $P/d^{2}$?
        respuesta:
          tipo: numero
          valor: '14.515'
          tolerancia: 0.01
          formato: un número (la tensión dividida por P/d²)
        distractores:
          - valor: '13.242'
            mensaje: |
              Es solo la flexión, $M\,(d/2)/I$. Falta el axil, $P/A = 4P/(\pi d^{2})$,
              que se suma en el lado traccionado.
          - valor: '7.894'
            mensaje: |
              Has usado la inercia polar, $\pi d^{4}/32$, en lugar de la
              axial, $I = \pi d^{4}/64$. La flexión trabaja con el momento de
              inercia respecto del eje neutro, que es la mitad de la polar.
          - valor: '11.968'
            mensaje: |
              Es el valor absoluto de la compresión. La tracción máxima es la
              del lado interior, el de la carga, donde axil y flexión se
              suman.
        pista: |
          $\sigma = \dfrac{N}{A} + \dfrac{M\,(d/2)}{I}$ con $N = P$,
          $M = 1{,}3Pd$, $A = \pi d^{2}/4$ e $I = \pi d^{4}/64$.
        desarrollo: |
          $$
          \sigma_{t} = \frac{4P}{\pi d^{2}} + \frac{1{,}3Pd\cdot32}{\pi d^{3}} = \frac{(4 + 41{,}6)\,P}{\pi d^{2}} = \frac{45{,}6\,P}{\pi d^{2}} = 14{,}515\,\frac{P}{d^{2}}
          $$
      - tipo: calcular
        titulo: La compresión máxima
        pregunta: |
          ¿Y la de compresión máxima, con su signo, en unidades de $P/d^{2}$?
        respuesta:
          tipo: numero
          valor: '-11.968'
          tolerancia: 0.01
          formato: un número con su signo (la tensión dividida por P/d²)
        distractores:
          - valor: '-13.242'
            mensaje: |
              Es solo la flexión. En el lado comprimido el axil de tracción
              resta: $-41{,}6 + 4$, no $-41{,}6$.
          - valor: '-5.348'
            mensaje: |
              Has usado la inercia polar, el doble de la axial: la flexión
              sale la mitad.
          - valor: '-14.515'
            mensaje: |
              Has sumado el axil en el lado comprimido. El axil es de tracción
              en toda la sección: alivia la compresión de la flexión.
        pista: |
          En la fibra exterior, la más alejada de la carga, la flexión
          comprime y el axil tracciona.
        desarrollo: |
          $$
          \sigma_{c} = \frac{(4 - 41{,}6)\,P}{\pi d^{2}} = -\frac{37{,}6\,P}{\pi d^{2}} = -11{,}968\,\frac{P}{d^{2}}
          $$
      - tipo: calcular
        titulo: El eje neutro
        pregunta: |
          El eje neutro es paralelo al de flexión. ¿A qué distancia del centro
          de la sección está, en unidades de $d$?
        respuesta:
          tipo: numero
          valor: '0.04808'
          tolerancia: 0.0002
          formato: un número (la distancia dividida por d)
        distractores:
          - valor: '0.09615'
            mensaje: |
              Has tomado el radio de giro polar, $i^{2} = I_p/A = d^{2}/8$. El
              de la flexión es el axial, $i^{2} = I/A = d^{2}/16$.
          - valor: '0.1923'
            mensaje: |
              Has puesto $(d/2)^{2}$ en lugar de $i^{2}$. La distancia es
              $i^{2}/e$, con el radio de giro, no con la distancia a la fibra
              extrema (ec. 9.46).
        pista: |
          $\sigma = 0$ en $y_N = -i^{2}/e$ (ec. 9.46), con
          $i^{2} = I/A = d^{2}/16$ y $e = a = 1{,}3d$.
        desarrollo: |
          $$
          y_N = \frac{d^{2}/16}{1{,}3\,d} = \frac{d}{20{,}8} = 0{,}04808\,d
          $$

          del lado opuesto a la carga, es decir, hacia la fibra exterior.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El tramo de la izquierda está abierto: toda la $P$ pasa por el de
              la derecha, a $a = 1{,}3d$ de su eje.
          - texto: >-
              En su sección, $N = P$ y $M = 1{,}3Pd$: flexión compuesta.
          - texto: >-
              Con $A = \pi d^{2}/4$ e $I = \pi d^{4}/64$, en las dos fibras
              extremas $\sigma = (4 \pm 41{,}6)\,P/(\pi d^{2})$.
          - texto: >-
              Tracción máxima $45{,}6P/(\pi d^{2})$ en la fibra interior;
              compresión máxima $-37{,}6P/(\pi d^{2})$ en la exterior.
          - texto: >-
              El eje neutro está a $i^{2}/e = d/20{,}8$ del centro, hacia la
              fibra exterior.
          - texto: >-
              El eje neutro pasa por el centro de la sección, como en flexión
              pura.
            trampa: true
            mensaje: |
              Con axil, el eje neutro se desplaza: el axil de tracción hace
              falta compensarlo con algo de compresión de la flexión. Se mueve
              $d/20{,}8$ hacia el lado comprimido.
    resolucion: |
      **Los esfuerzos.** El eslabón está abierto: el tramo recto de la
      izquierda está cortado y no transmite nada. Toda la fuerza $P$ pasa por
      el tramo de la derecha, cuyo eje está a $a = 1{,}3d$ de la recta de la
      carga. En una sección de ese tramo, llevando $P$ a su centro:

      $$
      N = P\ \text{(tracción)},\qquad M = P\,a = 1{,}3\,P\,d
      $$

      Es flexión compuesta (apuntes del tema 9, ec. 9.41, p. 23), o, dicho de
      otro modo, una tracción excéntrica con excentricidad $e = 1{,}3d$ (ec.
      9.43, p. 25). El flector tracciona la fibra interior, la del lado de la
      carga, y comprime la exterior.

      **La sección**, circular de diámetro $d$:
      $A = \pi d^{2}/4$, $I = \pi d^{4}/64$ y la fibra extrema a $d/2$.

      **a) Las tensiones máximas.**

      $$
      \sigma = \frac{N}{A} \pm \frac{M\,(d/2)}{I} = \frac{4P}{\pi d^{2}} \pm \frac{32\cdot1{,}3\,P}{\pi d^{2}} = \frac{(4 \pm 41{,}6)\,P}{\pi d^{2}}
      $$

      - tracción máxima, en la fibra interior:
        $\sigma_t = 45{,}6\,P/(\pi d^{2}) = 14{,}515\,P/d^{2}$;
      - compresión máxima, en la exterior:
        $\sigma_c = -37{,}6\,P/(\pi d^{2}) = -11{,}968\,P/d^{2}$.

      El flector manda: da diez veces más tensión que el axil. Por eso los
      eslabones abiertos son tan débiles frente a los cerrados.

      **b) El eje neutro.** Paralelo al eje de flexión, donde $\sigma = 0$.
      Con el radio de giro $i^{2} = I/A = d^{2}/16$ (ecs. 9.45 y 9.46):

      $$
      |y_N| = \frac{i^{2}}{e} = \frac{d^{2}/16}{1{,}3\,d} = 0{,}04808\,d
      $$

      del centro de la sección hacia la fibra exterior (del lado contrario a
      la carga). Casi pasa por el centro: con una excentricidad tan grande, el
      axil apenas lo mueve.

      **Comprobaciones.** El motor del curso (sección circular, fuerza
      excéntrica, tensiones extremas y eje neutro) da lo mismo que las
      fórmulas a mano: $14{,}515$ y $-11{,}968\,P/d^{2}$, y el eje neutro a
      $0{,}04808\,d$, con la fibra traccionada del lado de la carga.

