      **d) La tensión tangencial** (ecs. 9.31 y 9.34, pp. 14-15). Con
      $T_y = q_0a/2$ y $T_z = 0$:
      $T'_y = T_y/k = 0{,}6383\,q_0a$ y
      $T'_z = -T_yI_{yz}/(I_zk) = 0{,}1802\,q_0a$, y el flujo en un corte que
      separa el área $A_c$ es $q_c = T'_yQ_{zc}/I_z + T'_zQ_{yc}/I_y$. En el
      alma, cortando a una distancia $y$ de arriba, el máximo cumple
      $dq_c/dy = 0$:

      $$
      \frac{T'_y\,(y - y_G)}{I_z} + \frac{T'_z\,(13{,}5t - z_G)}{I_y} = 0\ \Longrightarrow\ y = 11{,}909\,t
      $$

      algo por encima de G. Con lo que queda encima,
      $Q_{zc} = -154{,}33\,t^{3}$ y $Q_{yc} = 40{,}50\,t^{3}$, y
      $|q_c| = 0{,}03042\,q_0a/t$:

      $$
      \tau_{max} = \frac{|q_c|}{t} = 30{,}42\cdot10^{-3}\,\frac{q_0a}{t^{2}}
      $$

      En las alas el flujo es menor: llega a $15{,}2\cdot10^{-3}$, en el ala de
      abajo junto al alma. Si se ignora $I_{yz}$ y se calcula el flujo del
      alma a la altura de G solo con $T_y$, sale $29{,}91\cdot10^{-3}$: casi
      lo mismo, por casualidad, pero en otro punto y con otra cuenta.

      **Comprobaciones.** El motor del curso (la viga con su rótula; las
      propiedades de la sección; las tensiones extremas, el eje neutro y el
      flujo cortante) da las reacciones, los flectores, G, las inercias, las
      dos tensiones extremas y el flujo máximo del alma iguales que las
      cuentas a mano, hechas por otro camino: el teorema de los ejes
      paralelos, la ec. 9.12 en las once esquinas y los momentos estáticos
      de cada trozo. Un barrido fino del alma confirma el máximo.

