      La sección más cargada a flexión es $D^-$, con
      $M_z = -0{,}75\,q_0a^{2}$; la cortante, $|T| = q_0a/2$, es la misma de
      B a E (y en A).

      **La sección.** Con $y$ hacia abajo desde la cara de arriba y $z$ a la
      derecha desde el extremo izquierdo del ala de abajo: ala de arriba,
      $y \in [0, 1]t$, $z \in [13, 20]t$; alma, $y \in [1, 19]t$,
      $z \in [13, 14]t$; ala de abajo, $y \in [19, 20]t$, $z \in [0, 20]t$.
      $A = 45t^{2}$, $y_G = 12{,}744t$, $z_G = 12{,}411t$, y respecto de G:

      $$
      I_z = 2586{,}06\,t^{4},\qquad I_y = 951{,}39\,t^{4},\qquad I_{yz} = -730{,}02\,t^{4}
      $$

      La sección no tiene ningún eje de simetría e $I_{yz} \neq 0$: es
      flexión desviada aunque solo haya $M_z$ (los ejes principales están
      girados $-20{,}89^{\circ}$).

      **b) y c) Las tensiones normales** (ec. 9.12, p. 8). Con $M_y = 0$ y
      $k = 1 - I_{yz}^{2}/(I_yI_z) = 0{,}7834$:

      $$
      \sigma_x = \frac{M'_z}{I_z}\,(y - y_G) + \frac{M'_y}{I_y}\,(z - z_G),\qquad
      M'_z = \frac{M_z}{k} = -0{,}9574\,q_0a^{2},\qquad M'_y = -\frac{M_zI_{yz}}{I_z\,k} = -0{,}2703\,q_0a^{2}
      $$

      El eje neutro (ec. 9.13), $y/z = -M'_yI_z/(M'_zI_y) = -0{,}767$, pasa
      por G y sube hacia la derecha formando $37{,}5^{\circ}$ con z. Los
      puntos más alejados de él son dos esquinas:

      - T, arriba a la izquierda del ala de arriba ($y = 0$, $z = 13t$):
        $\sigma_{t} = 4{,}551\cdot10^{-3}\,q_0a^{2}/t^{3}$, la tracción máxima;
      - K, abajo a la derecha del ala de abajo ($y = 20t$, $z = 20t$):
        $\sigma_{c} = -4{,}842\cdot10^{-3}\,q_0a^{2}/t^{3}$, la compresión
        máxima.

      En $D^+$, con $+\tfrac{1}{4}q_0a^{2}$, las tensiones son tres veces
      menores ($1{,}614$ y $-1{,}517$ milésimas), y en AB, con
      $q_0a^{2}/8$, menores aún. Sin $I_{yz}$ ($\sigma = M_zy/I_z$) saldrían
      $3{,}696$ y $-2{,}104$ milésimas: el producto de inercia no se puede
      despreciar.

