ejercicios:
  # ── Teoría · pregunta 1, parte a) · las componentes intrínsecas.
  - id: exerm2223-ext-1-componentes-intrinsecas-del-vector-tension
    titulo: Las componentes intrínsecas del vector tensión
    fuente: >-
      Cuestión 1 a de teoría · Extraordinaria del 1 de febrero de 2023 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). La pregunta 1 vale 2 puntos entre sus cinco partes,
      sin reparto impreso. Es la cuestión 1 de la hoja de autoevaluación del
      tema 2, palabra por palabra. El examen no publica resolución; el desarrollo es
      nuestro y sigue los apuntes del tema 2 (pp. 4-5 y 11-12). Los pasos de
      cálculo usan un ejemplo nuestro.
    nivel: examen
    enunciado: |
      1.(2p)

      a) Componentes intrínsecas del vector tensión.

      **Notas nuestras.** La pregunta 1 tiene cinco partes, de la a) a la
      e), de temas distintos, y 2 puntos entre todas; esta es la a). Se pide
      definirlas y decir cómo se calculan en un plano de normal conocida.
    pide: >-
      Qué son las componentes intrínsecas del vector tensión de un plano y
      cómo se obtienen a partir del tensor de tensiones y de la normal.
    pasos:
      - tipo: reconocer
        pregunta: |
          En un plano de normal $\hat{n}$, ¿qué son las dos componentes
          intrínsecas del vector tensión $\vec{S}_n$?
        opciones:
          - texto: >-
              Su proyección sobre la normal, $\sigma_n$, y su proyección sobre
              el propio plano, $\tau_n$; no dependen de los ejes que se usen
            correcta: true
            mensaje: |
              Eso es (pp. 4-5 de los apuntes). Se llaman intrínsecas porque
              solo dependen del plano: $\sigma_n$ es la componente normal y
              $\tau_n$ la tangencial, la que queda en el plano.
          - texto: >-
              Sus componentes según los ejes $x$, $y$, $z$: $S_x$, $S_y$ y $S_z$
            mensaje: |
              Esas son las componentes cartesianas de $\vec{S}_n$, y cambian al
              girar los ejes. Las intrínsecas se miden respecto del plano: una
              según su normal y otra contenida en él.
          - texto: >-
              Las tensiones principales $\sigma_1$ y $\sigma_3$ del punto
            mensaje: |
              Las principales son las de los planos en los que $\tau_n = 0$. En
              un plano cualquiera el vector tensión tiene las dos
              componentes, y las intrínsecas son esas dos, no las del punto.
      - tipo: calcular
        titulo: La componente normal, en un ejemplo
        pregunta: |
          Un ejemplo nuestro: en un punto, $\sigma_x = 50$, $\sigma_y = -10$,
          $\sigma_z = 30$ y $\tau_{xy} = 20$ MPa, y las demás tangenciales son
          nulas. En el plano de normal $\hat{n} = (1,\ 1,\ 0)/\sqrt{2}$,
          ¿cuánto vale $\sigma_n$, en MPa?
        respuesta:
          tipo: numero
          valor: '40'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '50'
            mensaje: |
              Es el módulo de $\vec{S}_n$. La componente normal es su
              proyección sobre la normal, $\vec{S}_n\cdot\hat{n}$, que es menor
              porque $\vec{S}_n$ no va según $\hat{n}$.
          - valor: '20'
            mensaje: |
              Te has dejado $\tau_{xy}$ al formar $\vec{S}_n = [\sigma]\,\hat{n}$:
              la fila de $x$ es $(50,\ 20,\ 0)$, no $(50,\ 0,\ 0)$.
        pista: |
          Primero $\vec{S}_n = [\sigma]\{n\}$ (ec. 2.14) y luego
          $\sigma_n = \vec{S}_n\cdot\hat{n}$.
        desarrollo: |
          $$
          \vec{S}_n = \frac{1}{\sqrt{2}}\,(50 + 20,\ 20 - 10,\ 0) = \frac{1}{\sqrt{2}}\,(70,\ 10,\ 0)\ \text{MPa}
          $$

          y $\sigma_n = \tfrac{1}{2}(70 + 10)\ \text{MPa} = 40\ \text{MPa}$.
      - tipo: calcular
        titulo: La componente tangencial, en el mismo ejemplo
        pregunta: |
          En el mismo plano, ¿cuánto vale el módulo de $\tau_n$, en MPa?
        respuesta:
          tipo: numero
          valor: '30'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '10'
            mensaje: |
              Has restado los módulos, $|\vec{S}_n| - \sigma_n$. Las dos
              componentes son perpendiculares: se restan sus cuadrados,
              $\tau_n^{2} = |\vec{S}_n|^{2} - \sigma_n^{2}$ (ec. 2.16).
          - valor: '64.03'
            mensaje: |
              Has sumado los cuadrados en vez de restarlos. $\vec{S}_n$ es la
              hipotenusa: $|\vec{S}_n|^{2} = \sigma_n^{2} + \tau_n^{2}$, y
              $\tau_n$ no puede ser mayor que $|\vec{S}_n|$.
        pista: |
          $|\vec{S}_n|^{2} = \sigma_n^{2} + \tau_n^{2}$ (ec. 2.16).
        desarrollo: |
          $|\vec{S}_n|^{2} = \tfrac{1}{2}(70^{2} + 10^{2}) = 2500$ (en MPa²), y

          $$
          \tau_n = \sqrt{2500 - 40^{2}}\ \text{MPa} = 30\ \text{MPa}
          $$
      - tipo: redactar
        que: definicion
        consigna: >-
          Define las componentes intrínsecas del vector tensión y di cómo se
          calculan, como en el examen.
        rubrica:
          - punto: >-
              Se define el vector tensión del plano: la fuerza por unidad de
              área que la parte de un lado ejerce sobre la otra a través de un
              plano de normal n (pp. 4-5).
            porque: >-
              Las componentes intrínsecas son las de ese vector; sin él no hay
              nada que descomponer.
            minimo: true
          - punto: >-
              Se definen las dos: σn, la proyección sobre la normal (positiva
              si tracciona), y τn, la componente contenida en el plano.
            porque: >-
              Es la pregunta. Se llaman intrínsecas porque solo dependen del
              plano, no de los ejes.
            minimo: true
          - punto: >-
              Se calcula el vector tensión con el tensor, Sn = [σ]{n}
              (ec. 2.14), y de él σn = Sn·n.
            porque: >-
              Es como se obtienen en la práctica a partir del estado de
              tensiones del punto.
            minimo: true
          - punto: >-
              Se da τn por el teorema de Pitágoras: τn² = |Sn|² − σn²
              (ec. 2.16).
            porque: >-
              La tangencial no se proyecta sobre un eje fijo del plano: se
              saca de lo que queda.
            minimo: true
          - punto: >-
              Se dibujan σn y τn en el plano, con su convenio de signos, y se
              dice que los puntos (σn, τn) de todos los planos caen en la zona
              de los círculos de Mohr.
            porque: >-
              Enlaza la definición con el uso que se le da en el resto del
              tema y en los criterios de fallo.
      - tipo: justificar
        pregunta: Ordena la respuesta. Una pieza es falsa.
        piezas:
          - texto: >-
              En un plano de normal $\hat{n}$ el vector tensión es
              $\vec{S}_n = [\sigma]\{n\}$.
          - texto: >-
              Su proyección sobre la normal es la componente normal,
              $\sigma_n = \vec{S}_n\cdot\hat{n}$.
          - texto: >-
              Lo que queda, contenido en el plano, es la tangencial:
              $\tau_n^{2} = |\vec{S}_n|^{2} - \sigma_n^{2}$.
          - texto: >-
              Las dos solo dependen del plano, no de los ejes: por eso se
              llaman intrínsecas.
          - texto: >-
              La componente tangencial es la suma de las tangenciales
              $\tau_{xy}$, $\tau_{yz}$ y $\tau_{zx}$ del tensor.
            trampa: true
            mensaje: |
              $\tau_n$ depende del plano, y de las normales del tensor también:
              en el ejemplo, con $\tau_{xy} = 20$ MPa, sale 30 MPa. Se obtiene
              de $|\vec{S}_n|$ y $\sigma_n$, no sumando términos del tensor.
    resolucion: |
      **El vector tensión** (apuntes del tema 2, pp. 4-5, ecs. 2.1 y 2.2, fig.
      2.2). En un punto de un sólido cargado, a través de un plano de normal
      $\hat{n}$ la parte de un lado ejerce sobre la otra una fuerza por unidad
      de área: el vector tensión $\vec{S}_n$. Depende del punto y del plano.

      **Las componentes intrínsecas.** Se descompone $\vec{S}_n$ respecto del
      propio plano:

      - la **componente normal** $\sigma_n$, su proyección sobre $\hat{n}$,
        positiva si tracciona el plano;
      - la **componente tangencial** $\tau_n$, la que queda contenida en el
        plano.

      Se llaman intrínsecas porque solo dependen del plano, no del sistema de
      ejes en que se escriba $\vec{S}_n$.

      **Cómo se calculan.** Con el tensor de tensiones del punto (ec. 2.14,
      p. 11) y la normal:

      $$
      \{S_n\} = [\sigma]\{n\},\qquad \sigma_n = \vec{S}_n\cdot\hat{n},\qquad \tau_n^{2} = |\vec{S}_n|^{2} - \sigma_n^{2}
      $$

      (ec. 2.16, p. 12). La tangencial no se proyecta sobre un eje del plano:
      sale de lo que queda de $\vec{S}_n$ al quitarle la normal.

      **Un ejemplo (nuestro).** Con $\sigma_x = 50$, $\sigma_y = -10$,
      $\sigma_z = 30$ y $\tau_{xy} = 20$ MPa, en el plano de normal
      $(1,\ 1,\ 0)/\sqrt{2}$:
      $\vec{S}_n = (70,\ 10,\ 0)/\sqrt{2}$ MPa, $\sigma_n = 40$ MPa y
      $\tau_n = \sqrt{2500 - 1600}\ \text{MPa} = 30\ \text{MPa}$. El motor
      del curso da lo mismo, y por otro camino, el giro de 45° en el plano
      $xy$ con las ecuaciones de la tensión plana, también: 40 y 30 MPa.

  # ── Teoría · pregunta 1, parte b) · las direcciones principales coinciden.
  - id: exerm2223-ext-1-por-que-coinciden-las-direcciones-principales
    titulo: Por qué las direcciones principales de tensiones y deformaciones son las mismas
    fuente: >-
      Cuestión 1 b de teoría · Extraordinaria del 1 de febrero de 2023 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). La pregunta 1 vale 2 puntos entre sus cinco partes,
      sin reparto impreso. Es la cuestión 4 de la hoja de autoevaluación del
      tema 4, con otras palabras. El examen no publica resolución; el desarrollo es
      nuestro y sigue los apuntes del tema 4. Los pasos de cálculo usan un
      ejemplo nuestro.
    nivel: examen
    enunciado: |
      1.(2p)

      b) ¿Porque son iguales las direcciones principales de las tensiones y
      las deformaciones?

      **Notas nuestras.** Esta es la parte b) de la pregunta 1, que reparte
      2 puntos entre cinco partes. Se transcribe tal cual, con «¿Porque»
      junto y sin tilde.
    pide: >-
      La razón por la que las direcciones principales de tensiones y de
      deformaciones son las mismas.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De qué propiedad del material sale que las dos direcciones
          principales coincidan?
        opciones:
          - texto: >-
              De la isotropía: en la ley de Hooke del tema 4 las tensiones
              normales solo producen deformaciones longitudinales y cada
              tangencial solo su distorsión, $\gamma = \tau/G$
            correcta: true
            mensaje: |
              Eso es (ecs. 4.2 y 4.3). Si en unos ejes $\tau = 0$, en esos
              ejes también $\gamma = 0$: los ejes principales de tensión lo
              son de deformación. La cuenta con $\operatorname{tg}2\theta$ lo
              confirma y da además $G = E/(2(1 + \nu))$ (ec. 4.6).
          - texto: >-
              De que el material es elástico: toda deformación desaparece al
              descargar
            mensaje: |
              La elasticidad sola no basta. Un material elástico pero
              anisótropo (la madera, un compuesto de fibras) puede deformarse
              en cortante con solo tensiones normales, y entonces sus
              direcciones principales no coinciden.
          - texto: >-
              De que las deformaciones son pequeñas
            mensaje: |
              Las deformaciones pequeñas hacen lineal la relación entre
              desplazamientos y deformaciones (tema 3), pero no dicen nada de
              cómo responde el material. Lo que hace coincidir las
              direcciones es la isotropía de la ley de Hooke.
      - tipo: calcular
        titulo: La dirección principal de las tensiones, en un ejemplo
        pregunta: |
          Un ejemplo nuestro, en tensión plana: $\sigma_x = 80$,
          $\sigma_y = 20$ y $\tau_{xy} = 40$ MPa. ¿Qué ángulo forma con $x$
          la dirección principal 1 de las tensiones, en grados?
        respuesta:
          tipo: numero
          valor: '26.565'
          tolerancia: 0.01
          formato: un número, en grados, antihorario desde x
        distractores:
          - valor: '53.130'
            mensaje: |
              Es $2\theta_1$. La ecuación da el ángulo doble,
              $\operatorname{tg}2\theta_1 = 2\tau_{xy}/(\sigma_x - \sigma_y)$
              (ec. 2.62): falta dividir por dos.
        pista: |
          $\operatorname{tg}2\theta_1 = \dfrac{2\tau_{xy}}{\sigma_x - \sigma_y}$
          (ec. 2.62, y ec. 4.4).
        desarrollo: |
          $\operatorname{tg}2\theta_1 = 80/60 = 1{,}3333$, $2\theta_1 = 53{,}130^{\circ}$
          y $\theta_1 = 26{,}565^{\circ}$.
      - tipo: calcular
        titulo: La dirección principal de las deformaciones, en el mismo ejemplo
        pregunta: |
          Con $E = 200$ GPa y $\nu = 0{,}3$, calcula $\varepsilon_x$,
          $\varepsilon_y$ y $\gamma_{xy}$ con la ley de Hooke y, con ellas, el
          ángulo de la dirección principal 1 de las deformaciones, en grados.
        respuesta:
          tipo: numero
          valor: '26.565'
          tolerancia: 0.01
          formato: un número, en grados, antihorario desde x
        distractores:
          - valor: '16.845'
            mensaje: |
              Has puesto $\tfrac{1}{2}\gamma_{xy}$ en el numerador. En las
              deformaciones el papel de $2\tau_{xy}$ lo hace $\gamma_{xy}$
              entera: $\operatorname{tg}2\theta = \gamma_{xy}/(\varepsilon_x - \varepsilon_y)$
              (ec. 4.5).
          - valor: '22.863'
            mensaje: |
              Has tomado $G = E/2$, sin el $1 + \nu$. Con $G = E/(2(1 + \nu))$
              (ec. 4.6) las dos tangentes son iguales; con otra $G$ no lo
              serían, y es justo de esa igualdad de donde sale la relación
              entre $E$, $G$ y $\nu$.
        pista: |
          $\varepsilon_x - \varepsilon_y = (1 + \nu)(\sigma_x - \sigma_y)/E$
          y $\gamma_{xy} = \tau_{xy}/G$, con $G = E/(2(1 + \nu))$.
        desarrollo: |
          $\varepsilon_x - \varepsilon_y = 1{,}3\cdot60/200\,000 = 390\cdot10^{-6}$
          y $G = 76\,923$ MPa, $\gamma_{xy} = 40/76\,923 = 520\cdot10^{-6}$:

          $$
          \operatorname{tg}2\theta = \frac{520}{390} = 1{,}3333\ \Longrightarrow\ \theta = 26{,}565^{\circ}
          $$

          El mismo ángulo que el de las tensiones.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Explica por qué coinciden las direcciones principales de tensiones y
          deformaciones, como en el examen.
        rubrica:
          - punto: >-
              Se escribe la ley de Hooke del tema 4: εx = [σx − ν(σy + σz)]/E
              y sus semejantes, y γxy = τxy/G, γyz = τyz/G, γzx = τzx/G
              (ecs. 4.2 y 4.3).
            porque: >-
              Es el punto de partida: la respuesta sale de la forma de estas
              ecuaciones.
            minimo: true
          - punto: >-
              Se dice que, por la isotropía, las tensiones normales solo
              producen deformaciones longitudinales y cada tangencial solo su
              distorsión.
            porque: >-
              Es la razón física: no hay acoplamiento entre normales y
              tangenciales.
            minimo: true
          - punto: >-
              Se concluye: en los ejes principales de tensión las τ son nulas,
              luego las γ también, y esos ejes son principales de deformación.
            porque: >-
              Es la respuesta a la pregunta.
            minimo: true
          - punto: >-
              Se comprueba con los ángulos: tg 2θ de tensiones (ec. 4.4) y de
              deformaciones (ec. 4.5) son iguales si G = E/(2(1 + ν)) (ec. 4.6).
            porque: >-
              Es la deducción de los apuntes, y de ella sale la relación entre
              las tres constantes.
          - punto: >-
              Se dice que en un material anisótropo no tiene por qué pasar.
            porque: >-
              Marca el alcance de la propiedad.
      - tipo: justificar
        pregunta: Ordena la explicación. Una pieza es falsa.
        piezas:
          - texto: >-
              En la ley de Hooke del tema 4, cada $\gamma$ solo depende de su
              $\tau$: $\gamma_{xy} = \tau_{xy}/G$, y las normales no producen
              distorsión.
          - texto: >-
              En los ejes principales de tensión las tres $\tau$ son nulas,
              así que las tres $\gamma$ también lo son.
          - texto: >-
              Unos ejes sin distorsión son ejes principales de deformación: las
              dos direcciones coinciden.
          - texto: >-
              Igualando $\operatorname{tg}2\theta$ de tensiones y de
              deformaciones sale además $G = E/(2(1 + \nu))$.
          - texto: >-
              Coinciden en cualquier material elástico, sea isótropo o no.
            trampa: true
            mensaje: |
              Hace falta la isotropía. En un material anisótropo una tensión
              normal puede producir distorsión, y entonces los ejes sin
              $\tau$ no son ejes sin $\gamma$.
    resolucion: |
      **La razón: la ley de Hooke del material isótropo** (apuntes del tema
      4, pp. 4-5, ecs. 4.2 y 4.3):

      $$
      \varepsilon_x = \frac{1}{E}\left[\sigma_x - \nu(\sigma_y + \sigma_z)\right],\ \ldots\qquad
      \gamma_{xy} = \frac{\tau_{xy}}{G},\quad \gamma_{yz} = \frac{\tau_{yz}}{G},\quad \gamma_{zx} = \frac{\tau_{zx}}{G}
      $$

      Las tensiones normales solo producen deformaciones longitudinales, y
      cada tensión tangencial solo su propia distorsión. Si unos ejes son
      principales de tensión, en ellos $\tau_{xy} = \tau_{yz} = \tau_{zx} = 0$,
      así que también $\gamma_{xy} = \gamma_{yz} = \gamma_{zx} = 0$: son
      principales de deformación. Las dos direcciones principales coinciden.

      **La cuenta de los apuntes** (p. 5). En tensión plana, la dirección
      principal de las tensiones cumple
      $\operatorname{tg}2\theta_1 = 2\tau_{xy}/(\sigma_x - \sigma_y)$ (ec. 4.4,
      que en los apuntes sale con la errata «σx − σx» en el denominador) y la
      de las deformaciones,
      $\operatorname{tg}2\theta_1 = \gamma_{xy}/(\varepsilon_x - \varepsilon_y)$
      (ec. 4.5). Con Hooke,
      $\varepsilon_x - \varepsilon_y = (1 + \nu)(\sigma_x - \sigma_y)/E$ y
      $\gamma_{xy} = \tau_{xy}/G$; igualando las dos tangentes:

      $$
      \frac{\tau_{xy}/G}{(1 + \nu)(\sigma_x - \sigma_y)/E} = \frac{2\tau_{xy}}{\sigma_x - \sigma_y}
      \quad\Longrightarrow\quad G = \frac{E}{2(1 + \nu)}
      $$

      (ec. 4.6). Es decir: la coincidencia es consecuencia de la isotropía, y
      la relación entre $E$, $G$ y $\nu$ es lo que la hace posible. En un
      material anisótropo no tiene por qué pasar.

      **Un ejemplo (nuestro).** Con $\sigma_x = 80$, $\sigma_y = 20$,
      $\tau_{xy} = 40$ MPa, $E = 200$ GPa y $\nu = 0{,}3$: la dirección
      principal de las tensiones está a $26{,}565^{\circ}$ de $x$. Las
      deformaciones son $\varepsilon_x - \varepsilon_y = 390\cdot10^{-6}$ y
      $\gamma_{xy} = 520\cdot10^{-6}$, y su dirección principal está también
      a $26{,}565^{\circ}$. El motor del curso da los dos ángulos por su
      lado (el círculo de Mohr de tensiones y el de deformaciones) y salen
      iguales; con $\tfrac{1}{2}\gamma_{xy}$ en lugar de $\gamma_{xy}$ saldrían
      $16{,}85^{\circ}$, y con $G = E/2$, $22{,}86^{\circ}$.

  # ── Teoría · pregunta 1, parte c) · la tensión equivalente.
  - id: exerm2223-ext-1-el-concepto-de-tension-equivalente
    titulo: El concepto de tensión equivalente
    fuente: >-
      Cuestión 1 c de teoría · Extraordinaria del 1 de febrero de 2023 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). La pregunta 1 vale 2 puntos entre sus cinco partes,
      sin reparto impreso. Es la cuestión 1 de la hoja de autoevaluación del
      tema 6, palabra por palabra. El examen no publica resolución; el desarrollo es
      nuestro y sigue los apuntes del tema 6 (pp. 3-4, 9 y 11-12). Los pasos
      de cálculo usan un ejemplo nuestro.
    nivel: examen
    enunciado: |
      1.(2p)

      c) Concepto de tensión equivalente.

      **Notas nuestras.** Esta es la parte c) de la pregunta 1, que reparte
      2 puntos entre cinco partes.
    pide: >-
      Qué es la tensión equivalente y para qué sirve.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué es la tensión equivalente de un estado de tensiones?
        opciones:
          - texto: >-
              La tensión de un ensayo de tracción simple que, según el
              criterio de fallo que se use, es igual de peligrosa que el
              estado real
            correcta: true
            mensaje: |
              Eso es (tema 6, p. 3). Un estado triaxial no se puede comparar
              directamente con el límite del ensayo, que es uniaxial; el
              criterio lo convierte en un número, $\sigma_{eqv}$, que sí se
              compara con $\sigma_e$.
          - texto: >-
              La mayor de las tensiones principales del punto
            mensaje: |
              Eso es la tensión equivalente de un criterio concreto, el de
              Rankine. En general depende del criterio: con Tresca es
              $\sigma_1 - \sigma_3$ y con von Mises combina las tres.
          - texto: >-
              La media de las tres tensiones principales
            mensaje: |
              Esa es la tensión media o hidrostática, la parte esférica del
              tensor. No sirve para comparar con el límite: un estado
              hidrostático puro no hace fallar a un metal dúctil.
      - tipo: calcular
        titulo: La tensión equivalente de Tresca, en un ejemplo
        pregunta: |
          Un ejemplo nuestro: $\sigma_1 = 100$, $\sigma_2 = 40$ y
          $\sigma_3 = -50$ MPa. ¿Cuánto vale la tensión equivalente de
          Tresca, en MPa?
        respuesta:
          tipo: numero
          valor: '150'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '60'
            mensaje: |
              Es $\sigma_1 - \sigma_2$, la diferencia de las dos primeras.
              Tresca usa el círculo de Mohr mayor, el de $\sigma_1$ y
              $\sigma_3$: $\sigma_{eqv} = \sigma_1 - \sigma_3$ (ec. 6.19).
          - valor: '100'
            mensaje: |
              Es $\sigma_1$, la tensión equivalente de Rankine. Con Tresca
              cuenta la tangencial máxima, y la compresión $\sigma_3$ la
              aumenta.
        pista: |
          $\sigma_{eqv} = \sigma_1 - \sigma_3$ (ec. 6.19).
        desarrollo: |
          $\sigma_{eqv} = (100 - (-50))\ \text{MPa} = 150\ \text{MPa}$.
      - tipo: calcular
        titulo: La de von Mises, en el mismo ejemplo
        pregunta: |
          ¿Y la de von Mises, en MPa?
        respuesta:
          tipo: numero
          valor: '130.77'
          tolerancia: 0.02
          formato: un número, en MPa
        distractores:
          - valor: '184.93'
            mensaje: |
              Falta el $\tfrac{1}{2}$ dentro de la raíz. Con él, en tracción
              simple ($\sigma_2 = \sigma_3 = 0$) la tensión equivalente es
              $\sigma_1$, como tiene que ser.
          - valor: '150'
            mensaje: |
              Es la de Tresca. Von Mises combina las tres diferencias de
              principales, no solo la mayor, y da un número algo menor: es
              menos conservador que Tresca.
        pista: |
          $\sigma_{eqv} = \sqrt{\tfrac{1}{2}\left[(\sigma_1 - \sigma_2)^{2} + (\sigma_2 - \sigma_3)^{2} + (\sigma_3 - \sigma_1)^{2}\right]}$
          (ec. 6.31).
        desarrollo: |
          $$
          \sigma_{eqv} = \sqrt{\tfrac{1}{2}\left(60^{2} + 90^{2} + 150^{2}\right)}\ \text{MPa} = \sqrt{17\,100}\ \text{MPa} = 130{,}77\ \text{MPa}
          $$
      - tipo: calcular
        titulo: El factor de seguridad, en el mismo ejemplo
        pregunta: |
          Si el límite elástico del material es $\sigma_e = 250$ MPa, ¿qué
          factor de seguridad da von Mises?
        respuesta:
          tipo: numero
          valor: '1.912'
          tolerancia: 0.002
          formato: un número, sin unidades
        distractores:
          - valor: '1.667'
            mensaje: |
              Es el de Tresca, 250/150. Con von Mises la tensión equivalente es
              130,77 MPa y el factor sale mayor.
          - valor: '2.5'
            mensaje: |
              Has dividido por $\sigma_1$, como en Rankine. El factor de
              seguridad compara el límite con la tensión equivalente del
              criterio elegido (ec. 6.1).
        pista: |
          $FS = \sigma_e/\sigma_{eqv}$ (ec. 6.1).
        desarrollo: |
          $FS = 250/130{,}77 = 1{,}912$.
      - tipo: redactar
        que: definicion
        consigna: >-
          Explica el concepto de tensión equivalente, como en el examen.
        rubrica:
          - punto: >-
              Se plantea el problema: los límites del material (σe) salen de
              un ensayo uniaxial, y en una pieza el estado es en general
              triaxial; no se pueden comparar directamente.
            porque: >-
              Es por lo que hace falta el concepto.
            minimo: true
          - punto: >-
              Se define: la tensión equivalente es la de un ensayo de tracción
              simple igual de peligrosa que el estado real según el criterio
              de fallo (p. 3).
            porque: >-
              Es la definición que pide el examen.
            minimo: true
          - punto: >-
              Se dice que depende del criterio, con ejemplos: σ1 en Rankine,
              σ1 − σ3 en Tresca (ec. 6.19), la raíz de la semisuma de los
              cuadrados de las diferencias en von Mises (ec. 6.31).
            porque: >-
              Un mismo estado tiene una tensión equivalente distinta en cada
              criterio.
            minimo: true
          - punto: >-
              Se dice cómo se usa: no hay fallo si σeqv < σe, y el factor de
              seguridad es FS = σe/σeqv (ec. 6.1).
            porque: >-
              Es para lo que sirve en un problema.
            minimo: true
      - tipo: justificar
        pregunta: Ordena la explicación. Una pieza es falsa.
        piezas:
          - texto: >-
              El límite del material sale de un ensayo de tracción simple, y
              en una pieza el estado de tensiones es en general triaxial.
          - texto: >-
              Un criterio de fallo dice cuándo un estado triaxial es tan
              peligroso como un estado uniaxial dado.
          - texto: >-
              La tensión equivalente es la de ese estado uniaxial: Tresca da
              $\sigma_1 - \sigma_3$ y von Mises combina las tres principales.
          - texto: >-
              No hay fallo si $\sigma_{eqv} < \sigma_e$, y $FS = \sigma_e/\sigma_{eqv}$.
          - texto: >-
              La tensión equivalente es la misma con todos los criterios,
              porque es una propiedad del estado de tensiones.
            trampa: true
            mensaje: |
              Depende del criterio. En el ejemplo, el mismo estado da 100 MPa
              con Rankine, 150 con Tresca y 130,77 con von Mises.
    resolucion: |
      **El problema** (apuntes del tema 6, p. 3). Lo que se sabe del
      material sale de un ensayo de tracción simple: su límite elástico
      $\sigma_e$ (o el de rotura). En una pieza, el estado de tensiones de un
      punto es en general triaxial, con tres tensiones principales, y no se
      puede comparar directamente con un número que sale de un estado
      uniaxial.

      **La tensión equivalente.** Un criterio de fallo dice qué magnitud del
      estado de tensiones es la que lo hace fallar (la mayor tensión normal,
      la tangencial máxima, la energía de distorsión). La tensión equivalente
      $\sigma_{eqv}$ es la tensión de un ensayo de tracción simple que tiene
      **el mismo valor de esa magnitud** que el estado real: un estado
      uniaxial igual de peligroso. Así el estado triaxial se reduce a un
      número que sí se compara con $\sigma_e$:

      $$
      \sigma_{eqv} < \sigma_e\ \text{(no hay fallo)},\qquad FS = \frac{\sigma_e}{\sigma_{eqv}}
      $$

      (ec. 6.1, p. 4).

      **Depende del criterio**: Rankine, $\sigma_{eqv} = \sigma_1$; Tresca,
      $\sigma_{eqv} = \sigma_1 - \sigma_3$ (ec. 6.19, p. 9); von Mises,

      $$
      \sigma_{eqv} = \sqrt{\tfrac{1}{2}\left[(\sigma_1 - \sigma_2)^{2} + (\sigma_2 - \sigma_3)^{2} + (\sigma_3 - \sigma_1)^{2}\right]}
      $$

      (ecs. 6.28 a 6.31, pp. 11-12). En tracción simple todas dan
      $\sigma_{eqv} = \sigma_1$, que es lo que exige la definición.

      **Un ejemplo (nuestro).** Con $\sigma_1 = 100$, $\sigma_2 = 40$,
      $\sigma_3 = -50$ MPa y $\sigma_e = 250$ MPa: Tresca da 150 MPa y
      $FS = 1{,}667$; von Mises, 130,77 MPa y $FS = 1{,}912$; Rankine,
      100 MPa. El motor del curso da las dos primeras y las fórmulas a mano,
      lo mismo.

  # ── Teoría · pregunta 1, parte d) · la carga por metro de horizontal en una pieza curva.
  - id: exerm2223-ext-1-la-carga-por-metro-de-horizontal-en-una-pieza-curva
    titulo: La carga por unidad de longitud horizontal sobre una pieza curva, en qθ y qr
    fuente: >-
      Cuestión 1 d de teoría · Extraordinaria del 1 de febrero de 2023 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). La pregunta 1 vale 2 puntos entre sus cinco partes,
      sin reparto impreso. Es la pregunta 3 a de teoría del primer parcial de
      2015-2016, ya publicada, con otras palabras y otra numeración: se
      resuelve de nuevo con otro ejemplo. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 7, apartado 7.6
      (ecs. 7.22 a 7.26 y fig. 7.8).
    nivel: examen
    enunciado: |
      1.(2p)

      d) En una pieza curva, siendo la carga repartida por unidad de
      longitud horizontal q(x), determinar $q_\theta$ y $q_r$.

      **Notas nuestras.** Esta es la parte d) de la pregunta 1, que reparte
      2 puntos entre cinco partes. Como en la figura 7.8 de los apuntes, la
      pieza es un arco de centro O; el elemento $ds$ está en el punto cuyo
      radio forma $\theta$ con la horizontal, $q_r$ es positiva hacia O y
      $q_\theta$, en el sentido en que crece $\theta$. La carga $q$ es
      vertical, hacia abajo.
    pide: >-
      qr y qθ en función de q y θ.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué no basta con proyectar $q$ sobre el radio y la tangente?
        opciones:
          - texto: >-
              Porque $q$ es fuerza por metro de **horizontal** y $q_r$,
              $q_\theta$ son por metro de **pieza**: hay que pasar por la
              fuerza del elemento, $df = q\,dx$
            correcta: true
            mensaje: |
              Eso es. Se proyecta la fuerza $df$, no la densidad $q$, y se
              divide por $ds$. Como $dx = \sin\theta\,ds$, sale un seno más
              que en la proyección directa.
          - texto: >-
              Porque $q$ no es perpendicular a la pieza
            mensaje: |
              Eso solo obliga a proyectar, y proyectar sí hay que hacerlo. El
              problema es otro: $q$ y $q_r$, $q_\theta$ están repartidas sobre
              longitudes distintas, $dx$ y $ds$.
          - texto: >-
              Sí basta: $q_r = q\sin\theta$ y $q_\theta = -q\cos\theta$
            mensaje: |
              Esas serían las componentes de una carga repartida por metro de
              pieza. Una por metro de horizontal reparte menos fuerza en cada
              $ds$, porque $dx = \sin\theta\,ds$.
      - tipo: calcular
        titulo: La componente radial, en un ejemplo
        pregunta: |
          Un ejemplo nuestro: $q = 12$ kN/m (por metro de horizontal) en el
          punto de $\theta = 60^{\circ}$. ¿Cuánto vale $q_r$, en kN por metro
          de pieza?
        respuesta:
          tipo: numero
          valor: '9'
          tolerancia: 0.01
          formato: un número, en kN/m
        distractores:
          - valor: '10.392'
            mensaje: |
              Es $q\sin\theta$, la proyección directa. Falta pasar de metro de
              horizontal a metro de pieza: $dx = \sin\theta\,ds$, otro seno.
          - valor: '3'
            mensaje: |
              Es $q\cos^{2}\theta$: has medido $\theta$ desde la vertical. En
              la figura 7.8 de los apuntes $\theta$ va desde la horizontal.
        pista: |
          $q_r = q\sin^{2}\theta$ (ec. 7.26).
        desarrollo: |
          $q_r = 12\ \text{kN/m}\cdot\sin^{2}60^{\circ} = 12\ \text{kN/m}\cdot0{,}75 = 9\ \text{kN/m}$.
      - tipo: calcular
        titulo: La componente tangencial, en el mismo ejemplo
        pregunta: |
          En el mismo punto, ¿cuánto vale $q_\theta$, en kN por metro de
          pieza, con su signo?
        respuesta:
          tipo: numero
          valor: '-5.196'
          tolerancia: 0.005
          formato: un número, en kN/m
        distractores:
          - valor: '-6'
            mensaje: |
              Es $-q\cos\theta$, la proyección directa. Falta el $\sin\theta$
              de $dx = \sin\theta\,ds$.
          - valor: '5.196'
            mensaje: |
              El valor es ese y el signo no. La carga es hacia abajo y
              $q_\theta$ positiva va hacia donde crece $\theta$, hacia arriba
              por el arco: la componente tangencial de $df$ va en contra
              (ec. 7.22, $df_\theta = -q_\theta\,ds$).
        pista: |
          $q_\theta = -q\sin\theta\cos\theta$ (ec. 7.26).
        desarrollo: |
          $q_\theta = -12\ \text{kN/m}\cdot0{,}866\cdot0{,}5 = -5{,}196\ \text{kN/m}$.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              La fuerza sobre el elemento es $df = q\,dx$; se reparte en la
              pieza como $df_r = q_r\,ds$ y $df_\theta = -q_\theta\,ds$.
          - texto: >-
              La horizontal y la pieza se relacionan por $dx = \sin\theta\,ds$.
          - texto: >-
              Proyectando, $df_r = df\sin\theta$ y $df_\theta = df\cos\theta$.
          - texto: >-
              Así $q_r = q\sin^{2}\theta$ y $q_\theta = -q\sin\theta\cos\theta$.
          - texto: >-
              Como $q$ es vertical, basta proyectarla:
              $q_r = q\sin\theta$ y $q_\theta = -q\cos\theta$.
            trampa: true
            mensaje: |
              Proyectar la densidad olvida que $q$ y $q_r$ están repartidas
              sobre longitudes distintas. Se proyecta la fuerza $df = q\,dx$ y
              se divide por $ds$: sale un $\sin\theta$ más.
    resolucion: |
      Es la misma pregunta que la 3 a de teoría del primer parcial de
      2015-2016, publicada en esta colección, con otras palabras; aquí se
      resume y se resuelve con otro ejemplo.

      **El problema** (apuntes del tema 7, apartado 7.6, fig. 7.8). $q$ es
      una fuerza vertical por metro de **horizontal**; $q_r$ y $q_\theta$ son
      fuerzas por metro de **pieza**. No se pueden descomponer directamente:
      hay que pasar por la fuerza que recibe un elemento $ds$.

      **La fuerza y las longitudes** (ecs. 7.22 y 7.23, p. 15):

      $$
      df = q\,dx,\qquad df_r = q_r\,ds,\qquad df_\theta = -q_\theta\,ds,\qquad dx = \sin\theta\,ds
      $$

      **La proyección** (ec. 7.24, p. 16): $df_r = df\sin\theta$ y
      $df_\theta = df\cos\theta$. Con $df = q\,dx = q\sin\theta\,ds$ queda
      $df_r = q\sin^{2}\theta\,ds$ y $df_\theta = q\sin\theta\cos\theta\,ds$
      (ec. 7.25), y comparando con la ec. 7.22:

      $$
      q_r(\theta) = q\sin^{2}\theta,\qquad q_\theta(\theta) = -q\sin\theta\cos\theta
      $$

      (ec. 7.26). En la clave del arco, $\theta = 90^{\circ}$, $q_r = q$ y
      $q_\theta = 0$; en el arranque, $\theta = 0$, las dos son nulas.

      **Un ejemplo (nuestro).** Con $q = 12$ kN/m en $\theta = 60^{\circ}$:
      $q_r = 9$ kN/m y $q_\theta = -5{,}196$ kN/m. El motor del curso no tiene
      piezas curvas; el guion lo comprueba integrando la carga sobre la
      proyección horizontal de un arco pequeño alrededor de $\theta$,
      proyectando la fuerza total y dividiéndola por la longitud del arco: sale
      lo mismo.

  # ── Teoría · pregunta 1, parte e) · el proceso de deformación de una barra.
  - id: exerm2223-ext-1-el-proceso-de-deformacion-de-una-barra
    titulo: El proceso de deformación de una barra de una estructura articulada
    fuente: >-
      Cuestión 1 e de teoría · Extraordinaria del 1 de febrero de 2023 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). La pregunta 1 vale 2 puntos entre sus cinco partes,
      sin reparto impreso. Es la pregunta 3 b de teoría del primer parcial de
      2015-2016, ya publicada, casi con las mismas palabras: se resuelve de
      nuevo con otro ejemplo. El examen no publica resolución; el desarrollo
      es nuestro y sigue los apuntes del tema 8, apartado 8.4 (pp. 7-8, figs. 8.2
      y 8.3, ecs. 8.10 a 8.12).
    nivel: examen
    enunciado: |
      1.(2p)

      e) Proceso de deformación de una barra de una estructura articulada

      **Notas nuestras.** Esta es la parte e) de la pregunta 1, que reparte
      2 puntos entre cinco partes. Se transcribe tal cual, sin el punto
      final. Se pide describir los movimientos que llevan una barra BC de su
      posición inicial a la final y, de ahí, su alargamiento.
    pide: >-
      Los pasos del proceso que lleva la barra de su posición inicial a la
      final, y su alargamiento en función de los desplazamientos de sus
      extremos.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el proceso de los apuntes, el arco que describe C al girar la
          barra se sustituye por su tangente. ¿Por qué se puede?
        opciones:
          - texto: >-
              Porque el giro $\beta$ es pequeño: la diferencia entre el arco y
              la tangente es de orden $\beta^{2}$, y $\cos\beta \approx 1$
            correcta: true
            mensaje: |
              Eso es (ec. 8.11). Con giros pequeños, girar la barra solo mueve
              C en perpendicular a ella, sin cambiar su proyección sobre la
              dirección inicial: el giro no altera la longitud.
          - texto: >-
              Porque la barra no gira: solo se traslada y se alarga
            mensaje: |
              Sí gira: es el tercer paso del proceso. Lo que pasa es que, con
              un giro pequeño, ese giro no cambia la longitud medida sobre la
              dirección inicial.
          - texto: >-
              Porque el alargamiento es pequeño frente a la longitud de la
              barra
            mensaje: |
              También lo es, pero no es eso lo que permite cambiar el arco por
              la tangente. Lo que importa es que el ángulo girado sea pequeño.
      - tipo: calcular
        titulo: El alargamiento, en un ejemplo
        pregunta: |
          Un ejemplo nuestro: una barra BC de 1,5 m que sube a 60° de B a C.
          B se mueve (0,4; 0,1) mm y C (−0,2; 0,9) mm, en ejes $x$ a la
          derecha e $y$ hacia arriba. ¿Cuánto se alarga, en mm?
        respuesta:
          tipo: numero
          valor: '0.3928'
          tolerancia: 0.0005
          formato: un número, en mm
        distractores:
          - valor: '1'
            mensaje: |
              Es el módulo del desplazamiento relativo,
              $|\vec{u}_C - \vec{u}_B|$. La parte perpendicular a la barra es
              giro, no alargamiento: solo cuenta la proyección sobre la barra.
          - valor: '0.6794'
            mensaje: |
              Es solo la proyección del desplazamiento de C. Una traslación no
              alarga: hay que restar lo que B se mueve en la misma dirección,
              $\Delta L = CC_0' - BB_0'$.
          - valor: '-0.3928'
            mensaje: |
              El valor es ese y el signo no: has restado al revés. Si C se
              aleja de B en la dirección de la barra, la barra se alarga:
              $\Delta L = (\vec{u}_C - \vec{u}_B)\cdot\hat{e}_{BC}$, de B a C.
        pista: |
          $\Delta L = (\vec{u}_C - \vec{u}_B)\cdot\hat{e}_{BC}$, con
          $\hat{e}_{BC} = (\cos60^{\circ},\ \sin60^{\circ})$ (ec. 8.12).
        desarrollo: |
          $\vec{u}_C - \vec{u}_B = (-0{,}6;\ 0{,}8)$ mm, y

          $$
          \Delta L = (-0{,}6\cdot0{,}5 + 0{,}8\cdot0{,}8660)\ \text{mm} = (-0{,}3 + 0{,}6928)\ \text{mm} = 0{,}3928\ \text{mm}
          $$
      - tipo: calcular
        titulo: El giro de la barra, en el mismo ejemplo
        pregunta: |
          En el mismo ejemplo, ¿cuánto gira la barra, en $10^{-4}$ rad
          (antihorario positivo)?
        respuesta:
          tipo: numero
          valor: '6.131'
          tolerancia: 0.005
          formato: un número, en diezmilésimas de radián
        distractores:
          - valor: '6.667'
            mensaje: |
              Has dividido el módulo de $\vec{u}_C - \vec{u}_B$ por la longitud.
              El giro solo lo da la componente **perpendicular** a la barra;
              la paralela es el alargamiento.
          - valor: '4.155'
            mensaje: |
              Es solo la componente perpendicular del desplazamiento de C. B
              también se mueve en perpendicular, y lo que gira la barra es la
              diferencia.
        pista: |
          $\beta = (\vec{u}_C - \vec{u}_B)\cdot\hat{n}_{BC}/L$, con
          $\hat{n}_{BC} = (-\sin60^{\circ},\ \cos60^{\circ})$.
        desarrollo: |
          $$
          \beta = \frac{-0{,}6\cdot(-0{,}8660) + 0{,}8\cdot0{,}5}{1500} = \frac{0{,}9196}{1500} = 6{,}131\cdot10^{-4}
          $$

          en radianes, antihorario.
      - tipo: justificar
        pregunta: Ordena el proceso. Una pieza es falsa.
        piezas:
          - texto: >-
              La barra se traslada de BC a $B'C_1$, sin cambiar de longitud ni de
              dirección.
          - texto: >-
              Se alarga $\Delta L$ en su dirección: de $B'C_1$ a $B'C_2$.
          - texto: >-
              Gira como sólido rígido un $\beta$ pequeño alrededor de $B'$: de
              $B'C_2$ a $B'C_3$.
          - texto: >-
              El arco $C_2C_3$ se sustituye por la perpendicular a la barra, y
              proyectando, $\Delta L = CC_0' - BB_0'$.
          - texto: >-
              El alargamiento es el módulo del desplazamiento relativo de los
              extremos, $|\vec{u}_C - \vec{u}_B|$.
            trampa: true
            mensaje: |
              El desplazamiento relativo tiene una parte paralela a la barra,
              que es el alargamiento, y otra perpendicular, que es el giro
              $\beta L$. Solo la paralela cambia la longitud.
    resolucion: |
      Es la misma pregunta que la 3 b de teoría del primer parcial de
      2015-2016, publicada en esta colección; aquí se resume y se resuelve con
      otro ejemplo.

      **El proceso** (apuntes del tema 8, apartado 8.4, p. 7, fig. 8.2). Para
      pasar de la posición inicial BC a la final $B'C'$, la barra:

      1. **se traslada** de BC a $B'C_1$, con todos sus puntos moviéndose lo que
         B: no cambia ni la longitud ni la dirección;
      2. **se alarga** $\Delta L$ en su propia dirección, de $B'C_1$ a $B'C_2$: es el
         único paso que cambia la longitud, y donde entra la ley de
         comportamiento, $\Delta L = NL/EA$;
      3. **gira** como sólido rígido un ángulo $\beta$ alrededor de $B'$, de
         $B'C_2$ a $B'C_3$;
      4. y, como $\beta$ es pequeño, el arco $C_2C_3$ **se sustituye por la
         tangente**, perpendicular a la barra, que lleva a $C'$.

      **El alargamiento** (p. 8, fig. 8.3, ecs. 8.10 a 8.12). Proyectando la
      posición final sobre la dirección inicial, con $\cos\beta \approx 1$:

      $$
      \Delta L = B_0'C_0' - BC = CC_0' - BB_0' = (\vec{u}_C - \vec{u}_B)\cdot\hat{e}_{BC}
      $$

      La diferencia de las proyecciones de los desplazamientos de los
      extremos sobre la barra. La parte perpendicular de
      $\vec{u}_C - \vec{u}_B$ es el giro:
      $\beta = (\vec{u}_C - \vec{u}_B)\cdot\hat{n}_{BC}/L$.

      **Un ejemplo (nuestro).** Una barra de 1,5 m a 60°, con
      $\vec{u}_B = (0{,}4;\ 0{,}1)$ mm y $\vec{u}_C = (-0{,}2;\ 0{,}9)$ mm:
      $\Delta L = 0{,}3928$ mm y $\beta = 6{,}131\cdot10^{-4}$ rad. El guion lo
      comprueba con la longitud final exacta,
      $|\overrightarrow{BC} + \vec{u}_C - \vec{u}_B| - L$, con desplazamientos
      cada vez más pequeños: tiende a la proyección.

      **Para qué sirve.** Es la ecuación de compatibilidad de las
      estructuras articuladas: cada alargamiento, en función de los
      desplazamientos de los nudos, y al revés, la posición de un nudo a
      partir de los alargamientos de dos barras, trazando perpendiculares.

  # ── Teoría · pregunta 2 · el eslabón abierto de una cadena.
  - id: exerm2223-ext-2-el-eslabon-abierto-de-una-cadena
    titulo: El eslabón abierto de una cadena
    fuente: >-
      Cuestión 2 de teoría · Extraordinaria del 1 de febrero de 2023 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El cuadro de la figura con el valor
      de a sale vacío en el PDF y se ha leído en el Word original. El examen
      no publica resolución; el desarrollo es nuestro y sigue los apuntes del
      tema 9.
    nivel: examen
    enunciado: |
