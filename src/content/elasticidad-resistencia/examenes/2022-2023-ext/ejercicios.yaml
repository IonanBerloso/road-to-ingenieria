      <line x1="480" y1="140" x2="524" y2="140" stroke="var(--ink)" stroke-width="1"/><polygon points="530,140 523,142.8 523,137.2" fill="var(--ink)"/>
      <text x="462" y="104" font-size="15" fill="var(--ink)">Y</text>
