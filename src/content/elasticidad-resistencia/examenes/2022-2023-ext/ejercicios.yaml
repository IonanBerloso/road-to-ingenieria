      Los valores de P y de Q, en kN.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tensiones hay en el punto donde están las galgas?
        opciones:
          - texto: >-
              $\sigma_x = P/A$ y la $\tau_{xy}$ máxima de la cortante Q: el
              punto está en la fibra media de la flexión que da Q, donde su
              tensión normal es nula
            correcta: true
            mensaje: |
              Eso es. Q flecta el pilar respecto del eje paralelo a los $2a$,
              y las galgas están en el centro de la cara de $6a$, sobre ese eje
              neutro: allí la flexión no da $\sigma_x$ y la cortante da su
              máximo, $3Q/(2A)$ (la parábola de la ec. 9.37 en
              su centro).
          - texto: >-
              $\sigma_x = P/A + M\,y/I$ con $M = Q\cdot20a$, y ninguna
              tangencial
            mensaje: |
              El flector $Q\cdot20a$ existe, pero en el punto de las galgas su
              tensión es nula: están en el centro de la cara, sobre el eje
              neutro de esa flexión. Y la cortante Q sí da $\tau_{xy}$, máxima
              justo ahí.
          - texto: >-
              Solo $\sigma_x = P/A$: Q es horizontal y no hace nada en esa
              sección
            mensaje: |
              Q da dos cosas en la sección de las galgas: un flector, cuya
              tensión es nula en ese punto, y una cortante, cuya tensión
              tangencial es máxima en ese punto. Es la que lee la galga b.
      - tipo: calcular
        titulo: La fuerza axial
        pregunta: |
          ¿Cuánto vale P, en kN?
        respuesta:
          tipo: numero
          valor: '309.68'
          tolerancia: 0.05
          formato: un número, en kN
        distractores:
          - valor: '371.61'
            mensaje: |
              Has usado la galga b. La que va según el eje del pilar es la c:
              $\sigma_x = E\varepsilon_C$, porque $\sigma_y = 0$ en la cara.
          - valor: '154.84'
            mensaje: |
              Has tomado la sección de $2a \times 3a$. Las dos cotas de $3a$
              son las dos mitades de la cara: la sección es $2a \times 6a$.
        pista: |
          En la cara, $\sigma_y = 0$, así que $\sigma_x = E\varepsilon_x$ con
          $\varepsilon_x = \varepsilon_C$; y $P = \sigma_x A$, con $A = 12a^{2}$.
        desarrollo: |
          $\sigma_x = 2\cdot10^{5}\ \text{MPa}\cdot200\cdot10^{-6} = 40\ \text{MPa}$,
          $A = 12\cdot25{,}4^{2}\ \text{mm}^{2} = 7741{,}92\ \text{mm}^{2}$ y

          $$
          P = 40\ \text{MPa}\cdot7741{,}92\ \text{mm}^{2} = 309\,677\ \text{N} = 309{,}68\ \text{kN}
          $$
      - tipo: calcular
        titulo: La tensión tangencial
        pregunta: |
          Con la galga b, ¿cuánto vale $\tau_{xy}$ en el punto de las galgas,
          en MPa?
        respuesta:
          tipo: numero
          valor: '26.154'
          tolerancia: 0.01
          formato: un número, en MPa
        distractores:
          - valor: '13.077'
            mensaje: |
              Has usado $\tfrac{1}{2}\gamma_{xy}$ como si fuera la distorsión.
              En la ec. 3.55 entra $\gamma_{xy}$ entera:
              $\varepsilon_b = \tfrac{1}{2}(\varepsilon_x + \varepsilon_y) + \tfrac{1}{2}\gamma_{xy}$
              a 45°, y $\tau = G\gamma_{xy}$.
          - valor: '21.538'
            mensaje: |
              Te has dejado $\varepsilon_y$. Aunque $\sigma_y = 0$, la cara se
              contrae transversalmente: $\varepsilon_y = -\nu\varepsilon_x = -60\cdot10^{-6}$.
          - valor: '68'
            mensaje: |
              Has multiplicado $\gamma_{xy}$ por $E$. La tangencial va con el
              módulo de cortadura, $\tau = G\gamma$, con $G = E/(2(1 + \nu))$.
        pista: |
          A 45°: $\varepsilon_b = \tfrac{1}{2}(\varepsilon_x + \varepsilon_y) + \tfrac{1}{2}\gamma_{xy}$
          (ec. 3.55), con $\varepsilon_y = -\nu\varepsilon_x$; y
          $\tau_{xy} = G\gamma_{xy}$.
        desarrollo: |
          $\varepsilon_y = -0{,}3\cdot200\cdot10^{-6} = -60\cdot10^{-6}$, y

          $$
          \gamma_{xy} = 2\varepsilon_b - \varepsilon_x - \varepsilon_y = (480 - 200 + 60)\cdot10^{-6} = 340\cdot10^{-6}
          $$

          Con $G = 2\cdot10^{5}/2{,}6\ \text{MPa} = 76\,923\ \text{MPa}$:
          $\tau_{xy} = 76\,923\ \text{MPa}\cdot340\cdot10^{-6} = 26{,}154\ \text{MPa}$.
      - tipo: calcular
        titulo: La fuerza horizontal
        pregunta: |
          ¿Cuánto vale Q, en kN?
        respuesta:
          tipo: numero
          valor: '134.99'
          tolerancia: 0.05
          formato: un número, en kN
        distractores:
          - valor: '202.48'
            mensaje: |
              Has tomado la tensión media, $\tau = Q/A$. En el centro de un
              rectángulo la tangencial es la máxima de la parábola, un 50 %
              mayor que la media: $\tau = 3Q/(2A)$ (la ec. 9.37 en el centro).
          - valor: '190.57'
            mensaje: |
              Has tomado $\gamma_{xy} = 2\varepsilon_b$, como si la galga b
              solo leyera la distorsión. Lee también la parte normal,
              $\tfrac{1}{2}(\varepsilon_x + \varepsilon_y)$, que hay que
              restar.
          - valor: '111.17'
            mensaje: |
              Te has dejado $\varepsilon_y = -\nu\varepsilon_x$ en la lectura
              de la galga b: la $\tau$ sale 21,54 MPa en lugar de 26,15.
          - valor: '67.49'
            mensaje: |
              Has usado $\tfrac{1}{2}\gamma_{xy}$ como distorsión: la $\tau$
              sale la mitad, y Q también.
        pista: |
          $\tau_{max} = \dfrac{3Q}{2A}$ en el centro de la cara (la ec. 9.37 en $y = 0$),
          así que $Q = \tfrac{2}{3}\tau A$.
        desarrollo: |
          $$
          Q = \tfrac{2}{3}\cdot26{,}154\ \text{MPa}\cdot7741{,}92\ \text{mm}^{2} = 134\,987\ \text{N} = 134{,}99\ \text{kN}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Las galgas están sobre el eje neutro de la flexión de Q: allí
              $\sigma_x$ solo es la de P, y la cortante da su $\tau$ máxima.
          - texto: >-
              En la cara, $\sigma_y = 0$: la galga c da
              $\sigma_x = E\varepsilon_C = 40$ MPa, y $P = \sigma_x\cdot12a^{2} = 309{,}68$ kN.
          - texto: >-
              Con $\varepsilon_y = -\nu\varepsilon_x$, la galga b da
              $\gamma_{xy} = 340\cdot10^{-6}$ y $\tau_{xy} = G\gamma_{xy} = 26{,}15$ MPa.
          - texto: >-
              $\tau_{max} = 3Q/(2A)$ da $Q = 134{,}99$ kN.
          - texto: >-
              La galga b, a 45°, lee la tangencial máxima directamente:
              $\tau = E\varepsilon_B$.
            trampa: true
            mensaje: |
              Una galga mide una deformación longitudinal, no una tensión ni
              una distorsión. A 45° lee la mitad de $\gamma_{xy}$ más la media
              de $\varepsilon_x$ y $\varepsilon_y$ (ec. 3.55), y la tangencial
              va con $G$, no con $E$.
    resolucion: |
      **Qué hay en el punto de las galgas.** El pilar, de sección
      $2a \times 6a$, lleva en la cara de arriba la fuerza axial P (según $x$)
      y la horizontal Q (según $y$, a lo largo de los $6a$). En la sección de
      las galgas, a $20a$ de arriba, los esfuerzos son $N = P$, una cortante
      $Q$ y un flector $Q\cdot20a$ que hace girar la sección alrededor del
      eje paralelo a los $2a$. Las galgas están en el centro de la cara de
      $6a$: **sobre el eje neutro de esa flexión**, donde su tensión normal es
      nula y la tangencial de la cortante es la máxima. La cara está libre,
      así que es un estado de tensión plana con

      $$
      \sigma_x = \frac{P}{A},\qquad \sigma_y = 0,\qquad \tau_{xy} = \frac{3Q}{2A}
      $$

      (la distribución parabólica de la ec. 9.37, p. 17, en su centro), con
      $A = 2a\cdot6a = 12a^{2} = 7741{,}92\ \text{mm}^{2}$.

      **P, con la galga c** (según $x$). Con $\sigma_y = 0$, la ley de Hooke
      (ec. 4.2) da $\sigma_x = E\varepsilon_x$:

      $$
      \sigma_x = 2\cdot10^{5}\ \text{MPa}\cdot200\cdot10^{-6} = 40\ \text{MPa},\qquad
      P = 40\ \text{MPa}\cdot7741{,}92\ \text{mm}^{2} = 309\,677\ \text{N} = 309{,}68\ \text{kN}
      $$

      de tracción, como la dibuja la figura.

      **Q, con la galga b** (a 45°). La deformación transversal es
      $\varepsilon_y = -\nu\varepsilon_x = -60\cdot10^{-6}$, y la galga a 45°
      lee (ec. 3.55)

      $$
      \varepsilon_b = \tfrac{1}{2}(\varepsilon_x + \varepsilon_y) + \tfrac{1}{2}\gamma_{xy}
      \quad\Longrightarrow\quad
      \gamma_{xy} = (480 - 200 + 60)\cdot10^{-6} = 340\cdot10^{-6}
      $$

      Con $G = E/(2(1 + \nu)) = 76\,923$ MPa (ec. 4.6),
      $\tau_{xy} = 26{,}154$ MPa, y de $\tau = 3Q/(2A)$:

      $$
      Q = \tfrac{2}{3}\,\tau_{xy}A = \tfrac{2}{3}\cdot26{,}154\ \text{MPa}\cdot7741{,}92\ \text{mm}^{2} = 134\,987\ \text{N} = 134{,}99\ \text{kN}
      $$

      El signo de $\gamma_{xy}$ (positivo con la galga b entre $-x$ y $-y$,
      como en la figura) corresponde a Q en el sentido dibujado.

      **Comprobaciones.** El motor del curso (Hooke, la ecuación de la galga
      y la tangencial del rectángulo) da lo mismo que las cuentas a mano:
      $\sigma_x = 40$ MPa, $\gamma_{xy} = 340\cdot10^{-6}$, P = 309,68 kN y
      Q = 134,99 kN.
  # ── Problema 1 · la galga a 60° en tensión plana: principales y un plano oblicuo.
  - id: exerm2223-ext-4-la-galga-a-60-grados-en-tension-plana
    titulo: Tensión plana con una galga a 60°, las deformaciones principales y un plano paralelo a la dirección 1
    fuente: >-
      Problema 1 · Extraordinaria del 1 de febrero de 2023 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1,5 puntos (impreso «(1,5)», sin la p). El cuadro de los datos solo
      está en el Word original: el PDF no lo imprime. El examen no publica
      resolución; el desarrollo es nuestro, con los convenios de los temas 2,
      3 y 4.
    nivel: examen
    enunciado: |
      1. (1,5) En el estado de tensión plana de la figura $\sigma_x$,
      $\tau_{xy}$ y $\varepsilon\varepsilon_a$ son conocidas. Determinar:

      a) Tensiones y direcciones principales.

      b) Las deformaciones principales.

      c) Componentes intrínsecas de la tensión en un plano paralelo a la
      dirección principal 1 y que su normal tenga 60º horario respecto a “z”

      En un cuadro junto a la figura: $\varepsilon_a$=4x10⁻⁴;
      $\tau_{xy}$=50MPa; $\sigma_x$=-30; E=70GPA; ν=0.3

      <figure class="figura-examen">
      <svg viewBox="0 0 280 300" role="img" width="280" height="300" aria-labelledby="exerm2223-ext-4-la-galga-a-60-grados-en-tension-plana-fig-t exerm2223-ext-4-la-galga-a-60-grados-en-tension-plana-fig-d">
      <title id="exerm2223-ext-4-la-galga-a-60-grados-en-tension-plana-fig-t">El elemento en tensión plana con la galga a</title>
      <desc id="exerm2223-ext-4-la-galga-a-60-grados-en-tension-plana-fig-d">Un rectángulo con los ejes X, hacia la derecha, e Y, hacia arriba, que se cruzan en su centro. En el cruce está pegada la galga a, una tira con su rejilla en zigzag, en la dirección que forma 60° con el eje X en sentido antihorario; un arco con flechas en los dos extremos acota ese ángulo de 60°.</desc>
      <rect x="45" y="100" width="150" height="190" fill="var(--faint)" fill-opacity=".25" stroke="var(--ink)" stroke-width="1.3"/>
      <line x1="120" y1="195" x2="120" y2="27" stroke="var(--ink)" stroke-width="1.1"/><polygon points="120,18 124.5,28 115.5,28" fill="var(--ink)"/>
      <line x1="120" y1="195" x2="253" y2="195" stroke="var(--ink)" stroke-width="1.1"/><polygon points="262,195 252,199.5 252,190.5" fill="var(--ink)"/>
      <text x="98" y="32" font-size="15" fill="var(--ink)">Y</text>
      <text x="252" y="222" font-size="15" fill="var(--ink)">X</text>
      <line x1="130" y1="177.7" x2="169" y2="110.1" stroke="var(--ink)" stroke-width="1"/>
      <polygon points="107.6,207.5 122.6,181.5 130.4,186 115.4,212" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.1"/><polyline points="110.8,205.9 117.2,204.9 114.8,198.9 121.2,198 118.8,192 125.2,191.1 122.8,185.1" fill="none" stroke="var(--ink)" stroke-width=".8"/>
      <text x="92" y="182" font-size="15" fill="var(--ink)" font-style="italic">a</text>
      <path d="M202 195 A82 82 0 0 0 161 124" fill="none" stroke="var(--ink)" stroke-width="1"/><polygon points="202,195 199.6,189 204.4,189" fill="var(--ink)"/><polygon points="161,124 167.4,124.9 165,129.1" fill="var(--ink)"/>
      <text x="196" y="140" font-size="15" fill="var(--ink)">60°</text>
      </svg>
      <figcaption>

      Redibujada del Word original. El cuadro de los datos, que en el Word va
      junto a la figura, no sale en el PDF; aquí va en el texto, tal cual, con
      «-30» sin unidad y «GPA».

      </figcaption>
      </figure>

      **Notas nuestras.** Las tensiones van en MPa. La galga a está a 60° de
      X, en sentido antihorario. En el apartado c, un plano paralelo a la dirección 1 la
      contiene, y su normal, perpendicular a ella, se toma a 60° de z;
      «horario» solo dice hacia qué lado gira, y no cambia ni $\sigma_n$ ni el
      módulo de $\tau_n$. «εε» se transcribe como sale.
    pide: >-
      a) Las tres tensiones principales, en MPa, y el ángulo de la dirección 1
      con X. b) Las tres deformaciones principales. c) σn y τn en el plano del
      apartado c, en MPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de nada: ¿qué falta para conocer el tensor de tensiones, y de
          dónde sale?
        opciones:
          - texto: >-
              Falta $\sigma_y$; la galga da una ecuación, porque su lectura,
              con la ley de Hooke, es lineal en $\sigma_y$
            correcta: true
            mensaje: |
              Eso es. De $\sigma_x$, $\sigma_y$ y $\tau_{xy}$ solo falta
              $\sigma_y$. Hooke (ec. 4.24) da $\varepsilon_x$ y
              $\varepsilon_y$ en función de ella, $\gamma_{xy} = \tau_{xy}/G$,
              y la galga a 60° combina las tres (ec. 3.55): una ecuación con
              una incógnita.
          - texto: >-
              Nada: en tensión plana $\sigma_y = 0$
            mensaje: |
              Tensión plana quiere decir que el plano perpendicular a z está
              libre: $\sigma_z = \tau_{xz} = \tau_{yz} = 0$. $\sigma_y$ es una
              incógnita; si fuera nula, la galga no haría falta.
          - texto: >-
              La galga mide una deformación principal, así que la dirección 1
              está a 60° de X
            mensaje: |
              Una galga mide la deformación longitudinal en la dirección en que
              está pegada, sea o no principal, y nada dice que esta lo sea. Su
              lectura sirve para sacar la tensión que falta.
      - tipo: calcular
        titulo: La tensión que falta
        pregunta: |
          ¿Cuánto vale $\sigma_y$, en MPa?
        respuesta:
          tipo: numero
          valor: '-40.80'
          tolerancia: 0.02
          formato: un número con su signo, en MPa
        distractores:
          - valor: '0.895'
            mensaje: |
              Has puesto $\tfrac{1}{2}\gamma_{xy}$ en la ecuación de la galga.
              La ec. 3.55 lleva $\gamma_{xy}u_xu_y$, con la distorsión entera:
              $\varepsilon_a = \varepsilon_x\cos^{2}60^{\circ} + \varepsilon_y\sin^{2}60^{\circ} + \gamma_{xy}\sin60^{\circ}\cos60^{\circ}$.
          - valor: '-27.72'
            mensaje: |
              Te has dejado el efecto Poisson: $\varepsilon_x = (\sigma_x - \nu\sigma_y)/E$
              y $\varepsilon_y = (\sigma_y - \nu\sigma_x)/E$ (ec. 4.24), no
              $\sigma_x/E$ y $\sigma_y/E$.
          - valor: '10.52'
            mensaje: |
              Has dividido $\tau_{xy}$ por $E$. La distorsión va con el módulo
              de cortadura: $\gamma_{xy} = \tau_{xy}/G$, con
              $G = E/(2(1 + \nu)) = 26\,923$ MPa, casi tres veces menor que $E$.
          - valor: '-321.7'
            mensaje: |
              Has tomado los 60° desde el eje Y. La galga forma 60° con X: en
              la ec. 3.55, $u_x = \cos60^{\circ}$ y $u_y = \sin60^{\circ}$.
        pista: |
          Con $\varepsilon_x = (\sigma_x - \nu\sigma_y)/E$,
          $\varepsilon_y = (\sigma_y - \nu\sigma_x)/E$ (ec. 4.24) y
          $\gamma_{xy} = \tau_{xy}/G$, la galga lee
          $\varepsilon_a = \varepsilon_x\cos^{2}60^{\circ} + \varepsilon_y\sin^{2}60^{\circ} + \gamma_{xy}\sin60^{\circ}\cos60^{\circ}$
          (ec. 3.55). Multiplica por $E$, con $E/G = 2(1 + \nu) = 2{,}6$.
        desarrollo: |
          $E\varepsilon_a = 70\,000\ \text{MPa}\cdot4\cdot10^{-4} = 28\ \text{MPa}$, y

          $$
          28 = 0{,}25\,(-30 - 0{,}3\,\sigma_y) + 0{,}75\,(\sigma_y + 9) + 2{,}6\cdot50\cdot0{,}4330 = 55{,}54 + 0{,}675\,\sigma_y
          $$

          en MPa, de donde
          $\sigma_y = \dfrac{28 - 55{,}54}{0{,}675}\ \text{MPa} = -40{,}80\ \text{MPa}$.
      - tipo: calcular
        titulo: La tensión principal mayor
        pregunta: |
          ¿Cuánto vale la tensión principal mayor, $\sigma_1$, en MPa?
        respuesta:
          tipo: numero
          valor: '14.89'
          tolerancia: 0.02
          formato: un número, en MPa
        distractores:
          - valor: '37.78'
            mensaje: |
              Es lo que sale arrastrando el $\sigma_y$ de la galga con
              $\tfrac{1}{2}\gamma_{xy}$. El círculo está bien; el dato de
              partida, no.
          - valor: '21.15'
            mensaje: |
              Es lo que sale arrastrando el $\sigma_y$ sin efecto Poisson. El
              círculo está bien; el dato de partida, no.
          - valor: '15.75'
            mensaje: |
              Te falta el $\tfrac{1}{2}$ en el radio:
              $R = \sqrt{\left(\tfrac{1}{2}(\sigma_x - \sigma_y)\right)^{2} + \tau_{xy}^{2}}$
              (ec. 2.68), no $\sqrt{(\sigma_x - \sigma_y)^{2} + \tau_{xy}^{2}}$.
        pista: |
          Centro y radio del círculo de Mohr (ec. 2.68):
          $\sigma_C = \tfrac{1}{2}(\sigma_x + \sigma_y)$ y
          $R = \sqrt{\left(\tfrac{1}{2}(\sigma_x - \sigma_y)\right)^{2} + \tau_{xy}^{2}}$.
        desarrollo: |
          $\sigma_C = \tfrac{1}{2}(-30 - 40{,}80)\ \text{MPa} = -35{,}40\ \text{MPa}$ y
          $R = \sqrt{5{,}401^{2} + 50^{2}}\ \text{MPa} = 50{,}29\ \text{MPa}$:

          $$
          \sigma_1 = (-35{,}40 + 50{,}29)\ \text{MPa} = 14{,}89\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La dirección principal 1
        pregunta: |
          ¿Qué ángulo forma con X la dirección de $\sigma_1$, en grados
          (antihorario positivo)?
        respuesta:
          tipo: numero
          valor: '41.92'
          tolerancia: 0.02
          formato: un número, en grados
        distractores:
          - valor: '83.83'
            mensaje: |
              Es $2\theta_1$. La ec. 2.62 da la tangente del ángulo doble:
              falta dividir por dos.
          - valor: '-48.08'
            mensaje: |
              Es la otra dirección principal del plano, la de
              $-85{,}69$ MPa. La ec. 2.62 da las dos, a 90° una de otra; para
              saber cuál es la 1, sustituye el ángulo y mira qué tensión sale.
        pista: |
          $\tan 2\theta_1 = \dfrac{2\tau_{xy}}{\sigma_x - \sigma_y}$ (ec. 2.62),
          y comprueba a cuál de las dos direcciones corresponde $\sigma_1$.
        desarrollo: |
          $\tan 2\theta_1 = 100/10{,}80 = 9{,}259$, $2\theta_1 = 83{,}83^{\circ}$ y
          $\theta_1 = 41{,}92^{\circ}$. En esa dirección,
          $\sigma = -35{,}40 + 5{,}401\cos83{,}83^{\circ} + 50\sin83{,}83^{\circ} = 14{,}89$
          (en MPa): es la 1.
      - tipo: calcular
        titulo: La deformación principal menor
        pregunta: |
          ¿Cuánto vale la deformación principal menor, $\varepsilon_3$, en
          millonésimas?
        respuesta:
          tipo: numero
          valor: '-1288.0'
          tolerancia: 0.5
          formato: un número con su signo, en millonésimas (10⁻⁶)
        distractores:
          - valor: '-1224.2'
            mensaje: |
              Es $\sigma_3/E$, sin el efecto Poisson. La tracción $\sigma_1$
              contrae la dirección 3: $\varepsilon_3 = (\sigma_3 - \nu\sigma_1)/E$.
        pista: |
          Las direcciones principales de deformación son las de tensión. En
          ellas, Hooke: $\varepsilon_3 = \dfrac{\sigma_3 - \nu(\sigma_1 + \sigma_z)}{E}$, con $\sigma_z = 0$.
        desarrollo: |
          $$
          \varepsilon_3 = \frac{-85{,}69 - 0{,}3\cdot14{,}89}{70\,000} = -1288{,}0\cdot10^{-6}
          $$
      - tipo: calcular
        titulo: La deformación según z
        pregunta: |
          ¿Y la deformación principal según z, en millonésimas?
        respuesta:
          tipo: numero
          valor: '303.44'
          tolerancia: 0.5
          formato: un número con su signo, en millonésimas (10⁻⁶)
        distractores:
          - valor: '0'
            mensaje: |
              Tensión plana es $\sigma_z = 0$, no $\varepsilon_z = 0$. Por el
              efecto Poisson, el espesor cambia:
              $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E$ (ec. 4.24).
          - valor: '-303.44'
            mensaje: |
              El valor es ese y el signo no. $\sigma_x + \sigma_y$ es negativa
              (el estado es sobre todo de compresión), así que el espesor
              crece: $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E > 0$.
          - valor: '212.41'
            mensaje: |
              Has hecho $-\nu(\varepsilon_1 + \varepsilon_3)$. El coeficiente de
              Poisson relaciona deformaciones con tensiones:
              $\varepsilon_z = -\nu(\sigma_1 + \sigma_3)/E$.
        pista: |
          $\varepsilon_z = -\nu(\sigma_x + \sigma_y)/E$ (ec. 4.24), y
          $\sigma_x + \sigma_y = \sigma_1 + \sigma_3$.
        desarrollo: |
          $$
          \varepsilon_z = \frac{-0{,}3\cdot(-70{,}80)}{70\,000} = 303{,}4\cdot10^{-6}
          $$

          Es la intermedia: $\varepsilon_1 = (14{,}89 + 0{,}3\cdot85{,}69)/70\,000 = 580{,}0\cdot10^{-6}$.
      - tipo: calcular
        titulo: La componente normal en el plano del apartado c
        pregunta: |
          En el plano del apartado c, ¿cuánto vale $\sigma_n$, en MPa?
        respuesta:
          tipo: numero
          valor: '-64.27'
          tolerancia: 0.02
          formato: un número con su signo, en MPa
        distractores:
          - valor: '-21.42'
            mensaje: |
              Has medido los 60° desde la dirección 3 y no desde z: la normal
              forma 60° con z, así que su componente según 3 es
              $\sin60^{\circ}$, no $\cos60^{\circ}$.
          - valor: '11.17'
            mensaje: |
              Has puesto la normal en el plano de z y la dirección 1. Un plano
              paralelo a la dirección 1 la contiene: su normal es
              perpendicular a la 1, y está en el plano de z y la 3.
        pista: |
          En ejes principales (1, 3, z) la normal es
          $\hat{n} = (0,\ \sin60^{\circ},\ \cos60^{\circ})$, y
          $\sigma_n = \sum\sigma_i n_i^{2}$.
        desarrollo: |
          $\sigma_n = \sigma_3\sin^{2}60^{\circ} + \sigma_z\cos^{2}60^{\circ} = -85{,}69\ \text{MPa}\cdot0{,}75 = -64{,}27\ \text{MPa}$.
      - tipo: calcular
        titulo: La componente tangencial en el mismo plano
        pregunta: |
          ¿Y el módulo de $\tau_n$, en MPa?
        respuesta:
          tipo: numero
          valor: '37.11'
          tolerancia: 0.02
          formato: un número, en MPa
        distractores:
          - valor: '6.447'
            mensaje: |
              Has puesto la normal en el plano de z y la dirección 1. La normal
              es perpendicular a la 1: el círculo que cuenta es el de
              $\sigma_3$ y $\sigma_z$.
          - valor: '42.85'
            mensaje: |
              Es la tangencial máxima de ese círculo, la de un plano a 45°. A
              60° de z sale algo menos:
              $\tfrac{1}{2}|\sigma_z - \sigma_3|\sin120^{\circ}$.
        pista: |
          El plano contiene la dirección 1: es un punto del círculo de Mohr de
          $\sigma_3$ y $\sigma_z$, y
          $\tau_n = |\sigma_z - \sigma_3|\sin60^{\circ}\cos60^{\circ}$.
        desarrollo: |
          $\tau_n = 85{,}69\ \text{MPa}\cdot0{,}8660\cdot0{,}5 = 37{,}11\ \text{MPa}$.
          Con «horario» la tangencial va hacia un lado o hacia el otro; su
          módulo no cambia.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La galga, con Hooke, da una ecuación en $\sigma_y$:
              $\sigma_y = -40{,}80$ MPa.
          - texto: >-
              Centro $-35{,}40$ y radio $50{,}29$ MPa: $\sigma_1 = 14{,}89$,
              $\sigma_2 = 0$ (la de z) y $\sigma_3 = -85{,}69$ MPa; la 1 a
              $41{,}92^{\circ}$ de X.
          - texto: >-
              Hooke en ejes principales: $\varepsilon_1 = 580{,}0$,
              $\varepsilon_2 = \varepsilon_z = 303{,}4$ y
              $\varepsilon_3 = -1288{,}0$, en $10^{-6}$.
          - texto: >-
              El plano contiene la dirección 1: su normal está en el plano de
              z y la 3, a 60° de z.
          - texto: >-
              $\sigma_n = -64{,}27$ MPa y $|\tau_n| = 37{,}11$ MPa.
          - texto: >-
              Como es tensión plana, $\varepsilon_z = 0$ y las deformaciones
              principales son las dos del plano XY.
            trampa: true
            mensaje: |
              Tensión plana es $\sigma_z = 0$, no $\varepsilon_z = 0$: el
              espesor cambia por el efecto Poisson. $\varepsilon_z = 303{,}4\cdot10^{-6}$,
              y es la deformación principal intermedia.
    resolucion: |
      **La tensión que falta.** En tensión plana en XY son datos
      $\sigma_x = -30$ MPa y $\tau_{xy} = 50$ MPa; falta $\sigma_y$, y la da la
      galga. Hooke en tensión plana (ec. 4.24) y la galga a 60° (ec. 3.55):

      $$
      \varepsilon_a = \varepsilon_x\cos^{2}60^{\circ} + \varepsilon_y\sin^{2}60^{\circ} + \gamma_{xy}\sin60^{\circ}\cos60^{\circ},\qquad
      \varepsilon_x = \frac{\sigma_x - \nu\sigma_y}{E},\quad \varepsilon_y = \frac{\sigma_y - \nu\sigma_x}{E},\quad \gamma_{xy} = \frac{\tau_{xy}}{G}
      $$

      Multiplicando por $E$, con $E/G = 2(1 + \nu) = 2{,}6$ y
      $E\varepsilon_a = 70\,000\ \text{MPa}\cdot4\cdot10^{-4} = 28\ \text{MPa}$
      (todo en MPa):

      $$
      28 = 0{,}25\,(-30 - 0{,}3\,\sigma_y) + 0{,}75\,(\sigma_y + 9) + 56{,}29
      \quad\Longrightarrow\quad
      \sigma_y = -40{,}80\ \text{MPa}
      $$

      **a) Tensiones y direcciones principales.** El círculo de Mohr del
      plano XY (ec. 2.68): centro
      $\sigma_C = \tfrac{1}{2}(-30 - 40{,}80)\ \text{MPa} = -35{,}40\ \text{MPa}$
      y radio $R = \sqrt{5{,}401^{2} + 50^{2}}\ \text{MPa} = 50{,}29\ \text{MPa}$.
      Las del plano son $-35{,}40 \pm 50{,}29$ MPa, y la tercera,
      $\sigma_z = 0$. Ordenadas:

      $$
      \sigma_1 = 14{,}89\ \text{MPa},\qquad \sigma_2 = 0\ \text{(según z)},\qquad \sigma_3 = -85{,}69\ \text{MPa}
      $$

      Las direcciones (ec. 2.62):
      $\tan 2\theta_1 = 2\cdot50/(-30 + 40{,}80) = 9{,}259$, de donde
      $\theta_1 = 41{,}92^{\circ}$ desde X, antihorario, para $\sigma_1$
      (sustituyendo ese ángulo sale $+14{,}89$); la 3 está a
      $41{,}92^{\circ} + 90^{\circ} = 131{,}92^{\circ}$, y la 2 es z.

      **b) Las deformaciones principales.** Las direcciones son las mismas
      (material isótropo). Hooke en ejes principales:

      $$
      \varepsilon_1 = \frac{14{,}89 + 0{,}3\cdot85{,}69}{70\,000} = 580{,}0\cdot10^{-6},\qquad
      \varepsilon_z = \frac{-0{,}3\cdot(14{,}89 - 85{,}69)}{70\,000} = 303{,}4\cdot10^{-6},\qquad
      \varepsilon_3 = \frac{-85{,}69 - 0{,}3\cdot14{,}89}{70\,000} = -1288{,}0\cdot10^{-6}
      $$

      La de z no es nula: tensión plana no es deformación plana. Es la
      intermedia, $\varepsilon_2 = \varepsilon_z$.

      **c) El plano oblicuo.** Un plano paralelo a la dirección 1 la
      contiene; su normal es perpendicular a ella, así que está en el plano
      de z y de la dirección 3, y forma 60° con z. En ejes principales
      (1, 3, z), $\hat{n} = (0,\ \sin60^{\circ},\ \cos60^{\circ})$ (el signo
      del segundo, que es lo que cambia «horario», no altera nada):

      $$
      \sigma_n = \sigma_3\sin^{2}60^{\circ} + \sigma_z\cos^{2}60^{\circ} = -85{,}69\ \text{MPa}\cdot0{,}75 = -64{,}27\ \text{MPa}
      $$

      $$
      |\tau_n| = |\sigma_z - \sigma_3|\sin60^{\circ}\cos60^{\circ} = 85{,}69\ \text{MPa}\cdot0{,}4330 = 37{,}11\ \text{MPa}
      $$

      Es un punto del círculo de Mohr de $\sigma_3$ y $\sigma_z$; por la ec.
      2.16 sale lo mismo: $|\vec{S}_n|^{2} = 85{,}692^{2}\cdot0{,}75 = 5507{,}3$,
      en MPa², y $\tau_n^{2} = 5507{,}3 - 64{,}269^{2} = 1376{,}8$, en MPa².

      **Comprobaciones.** El motor del curso (Hooke, la ecuación de la galga,
      el círculo de Mohr, las principales de tensión y de deformación y las
      componentes intrínsecas con el tensor completo) da lo mismo que las
      cuentas a mano: $\sigma_y = -40{,}80$ MPa, $\sigma_1 = 14{,}89$ y
      $\sigma_3 = -85{,}69$ MPa a $41{,}92^{\circ}$, las tres deformaciones, y
      $\sigma_n = -64{,}27$, $|\tau_n| = 37{,}11$ MPa con la normal girada hacia
      un lado o hacia el otro. La $\varepsilon_z$ sale igual también por
      $-\nu(\varepsilon_x + \varepsilon_y)/(1 - \nu)$.

  # ── Problema 2 · la barra quebrada ABC y el tirante CD.
