      **Comprobaciones.** El motor del curso resuelve el eje con el giro de A
      impuesto y el resorte de C como un tramo ficticio de rigidez
      $\kappa\,GI_{pBC}/L$ empotrado al final (el motor no tiene resortes de
      torsión): da $M_{tAB} = 0{,}41668\,M_0$, $\varphi_B = 0{,}58334\,u$ y
      $\varphi_C = 2{,}68\cdot10^{-5}\,u$, lo mismo que la fórmula a mano. Con
      C empotrado del todo da $5M_0/12$ exacto. Si A también estuviera
      empotrado, AB se llevaría $2M_0/3$; con la misma inercia en los dos
      tramos, $0{,}3125\,M_0$.
