      </svg>
      <figcaption>

      Redibujada del Word original: a la izquierda, en perspectiva; a la
      derecha, vista según X. En el PDF no se ve el «= 2» de la última
      fórmula de los datos; está en el Word.

      </figcaption>
      </figure>

      **Notas nuestras.** La figura no tiene ningún resorte: el dato $K$ no se
      usa. La línea de datos es la del problema 3 de la 2.ª parte de enero de
      2023 ($K = EA/(10L)$; $E = 2{,}5G$; $I_z/(AL^{2}) = 2$), que sí tiene un
      muelle y es de sección circular: la hoja de febrero la hereda, con
      otros valores. Los datos hablan de $L$ y la figura de $a$; se toman
      iguales. El enunciado no dice la forma de la sección de ABC; se toma
      circular, así
      que $I_p = 2I_z$ y, con $E = 2G$, $GI_p = EI_z$. $q_0$ es carga por
      unidad de longitud de BC. Se desprecian el axil y la cortante de ABC.
    pide: >-
      a) El axil N del tirante, en unidades de q0·a. b) El desplazamiento
      vertical de B, en unidades de q0·a⁴/(E·Iz).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cómo se plantea el problema?
        opciones:
          - texto: >-
              Es hiperestático de grado 1: se corta el tirante, su axil N es la
              incógnita y se impone $\partial C/\partial N = 0$ con la energía
              del tirante incluida
            correcta: true
            mensaje: |
              Eso es (apartado 13.7.2, ec. 13.54). El empotramiento basta para
              sostener la estructura; el tirante es un enlace de más. Con N
              como fuerza interna, la condición dice que lo que baja C es lo
              que se alarga el tirante.
          - texto: >-
              Es isostático: el tirante sostiene C y se lleva toda la carga de
              BC
            mensaje: |
              El empotramiento A ya sostiene la estructura sin el tirante. Cuánto
              se lleva el tirante depende de lo rígido que sea frente a la
              barra: hace falta una ecuación de compatibilidad.
          - texto: >-
              Es hiperestático, y como C cuelga del tirante, C no baja
            mensaje: |
              Eso sería con un tirante rígido. El tirante se alarga
              $Na/(EA)$, y C baja eso: la condición es de compatibilidad, no
              de desplazamiento nulo.
      - tipo: calcular
        titulo: La resultante de la carga
        pregunta: |
          ¿Cuánto vale la resultante de $q_0$ sobre BC, en unidades de
          $q_0a$?
        respuesta:
          tipo: numero
          valor: '1.1547'
          tolerancia: 0.001
          formato: un número (la fuerza dividida por q0·a)
        distractores:
          - valor: '1'
            mensaje: |
              Has tomado la proyección horizontal, $a$. $q_0$ va por unidad de
              longitud de BC, que es más larga: $a/\cos30^{\circ}$.
          - valor: '0.8660'
            mensaje: |
              Has multiplicado por $\cos30^{\circ}$ en lugar de dividir. La
              barra es la hipotenusa: mide $a/\cos30^{\circ}$, más que su
              proyección.
        pista: |
          BC mide $a/\cos30^{\circ}$.
        desarrollo: |
          $W = q_0\,a/\cos30^{\circ} = 1{,}1547\,q_0a$, aplicada en el centro de
          BC, a $a/2$ de B en horizontal.
      - tipo: calcular
        titulo: El axil del tirante
        pregunta: |
          ¿Cuánto vale el axil del tirante, en unidades de $q_0a$?
        respuesta:
          tipo: numero
          valor: '0.3036'
          tolerancia: 0.0005
          formato: un número (el axil dividido por q0·a), positivo si tracciona
        distractores:
          - valor: '0.6570'
            mensaje: |
              Te has dejado la energía del tirante: es el resultado con un
              tirante rígido, C sin bajar. El tirante se alarga
              $Na/(EA) = 2Na^{3}/(EI_z)$, y ese término pesa más que todos los
              de la barra.
          - valor: '0.2029'
            mensaje: |
              Te has dejado la torsión de AB. La carga de BC está a un lado del
              eje de AB: lo retuerce con $(W/2 - N)\,a$, y ese giro hace bajar
              C.
          - valor: '0.2629'
            mensaje: |
              Has tomado $q_0$ por unidad de longitud horizontal: la carga
              total sale $q_0a$ y no $1{,}1547\,q_0a$.
        pista: |
          Con N hacia arriba en C: en BC, a una distancia s de C,
          $M = \cos30^{\circ}\,(Ns - q_0s^{2}/2)$; en AB, a x de B, un flector
          $(W - N)\,x$ y un torsor $(W/2 - N)\,a$; en el tirante, N. Deriva la
          energía respecto de N.
        desarrollo: |
          Con $GI_p = EI_z$ y $EA = EI_z/(2a^{2})$, $\partial C/\partial N = 0$
          queda, dividida por $a^{3}/(EI_z)$ y en unidades de $q_0a$:

          $$
          \frac{N}{3\cos30^{\circ}} - \frac{1}{8\cos^{2}30^{\circ}} - \frac{W - N}{3} - \left(\frac{W}{2} - N\right) + 2N = 0
          $$

          $$
          N = \frac{0{,}1667 + 0{,}3849 + 0{,}5774}{0{,}3849 + 3{,}3333}\,q_0a = 0{,}3036\,q_0a
          $$
      - tipo: calcular
        titulo: El desplazamiento vertical de B
        pregunta: |
          ¿Cuánto baja B, en unidades de $q_0a^{4}/(EI_z)$?
        respuesta:
          tipo: numero
          valor: '0.2837'
          tolerancia: 0.0005
          formato: un número (el descenso dividido por q0·a⁴/(E·Iz)), positivo si baja
        distractores:
          - valor: '0.3849'
            mensaje: |
              Es el descenso sin el tirante, $Wa^{3}/(3EI_z)$. El tirante tira
              de C hacia arriba con N, y AB lleva solo $W - N$.
          - valor: '0.1659'
            mensaje: |
              Es con el axil de un tirante rígido, que se lleva más carga. El
              tirante se alarga, y N sale menor.
          - valor: '0.2457'
            mensaje: |
              Has tomado $q_0$ por unidad de longitud horizontal. La resultante
              es $q_0\,a/\cos30^{\circ}$.
        pista: |
          B está en el eje de AB: el torsor no lo mueve en vertical. Una fuerza
          ficticia en B solo aparece en el flector de AB, un voladizo con
          $W - N$ en el extremo.
        desarrollo: |
          $$
          \delta_B = \frac{(W - N)\,a^{3}}{3EI_z} = \frac{1{,}1547 - 0{,}3036}{3}\,\frac{q_0a^{4}}{EI_z} = 0{,}2837\,\frac{q_0a^{4}}{EI_z}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El empotramiento basta para el equilibrio; el tirante sobra:
              grado 1, con su axil N como incógnita.
          - texto: >-
              En BC solo hay flexión; en AB, flexión $(W - N)\,x$ y torsión
              $(W/2 - N)\,a$; en el tirante, axil N.
          - texto: >-
              $\partial C/\partial N = 0$, con la energía del tirante, da
              $N = 0{,}3036\,q_0a$.
          - texto: >-
              B está sobre el eje de AB: baja lo que da la flexión de AB,
              $(W - N)\,a^{3}/(3EI_z) = 0{,}2837\,q_0a^{4}/(EI_z)$.
          - texto: >-
              C cuelga del tirante y no baja: $\delta_C = 0$ da N.
            trampa: true
            mensaje: |
              El tirante es elástico: C baja lo que se alarga,
              $Na/(EA) = 2Na^{3}/(EI_z)$. Con $\delta_C = 0$ saldría
              $N = 0{,}657\,q_0a$, más del doble.
    resolucion: |
      **Los datos.** La figura acota $a$ y los datos hablan de $L$: se toman
      iguales. $K$ no tiene dónde ir: no hay ningún resorte en la figura.
      $I_z/(Aa^{2}) = 2$ da la rigidez del tirante,
      $EA = EI_z/(2a^{2})$. Con la sección de ABC circular,
      $I_p = 2I_z$ y $GI_p = (E/2)\cdot2I_z = EI_z$: la barra tiene la
      misma rigidez a flexión que a torsión.

      **La geometría y la carga.** AB va según X, de A a B, y mide $a$. BC
      está en el plano YZ y sube 30° sobre la horizontal: su proyección
      horizontal (según Z) mide $a$ y su longitud, $a/\cos30^{\circ}$. La
      carga, vertical, es $W = q_0a/\cos30^{\circ} = 1{,}1547\,q_0a$, aplicada
      en el centro de BC. El tirante CD es vertical, de longitud $a$, y
      sostiene C desde arriba.

      **El grado de hiperestatismo.** El empotramiento basta para el
      equilibrio; el tirante es un enlace de más: grado 1. Se corta el
      tirante y su axil N (tracción, que tira de C hacia arriba) es la
      incógnita, una fuerza interna: $\partial C/\partial N = 0$ (apuntes del
      tema 13, apartado 13.7.2, ec. 13.54, p. 19), con la energía del
      tirante dentro de $C$.

      **Los esfuerzos.** Las fuerzas son todas verticales.

      - En BC, a una distancia $s$ de C (medida a lo largo de la barra), el
        brazo horizontal es $s\cos30^{\circ}$:
        $M = \cos30^{\circ}\,(Ns - q_0s^{2}/2)$. No hay torsión: las fuerzas y
        la barra están en el mismo plano vertical.
      - En AB, a una distancia $x$ de B: las fuerzas están todas a la
        distancia $x$ en la dirección X, así que dan un flector
        $(W - N)\,x$; y como están desplazadas según Z respecto del eje de
        AB, un torsor constante: la carga, con brazo $a/2$, y N, con brazo
        $a$: $M_t = (W/2 - N)\,a$.
      - En el tirante, el axil N.

      **a) El axil del tirante.** Con las energías de flexión, de torsión
      (ec. 13.43) y de axil:

      $$
      \frac{\partial C}{\partial N} = \int_{BC}\frac{M}{EI_z}\frac{\partial M}{\partial N}\,ds + \int_{AB}\frac{M}{EI_z}\frac{\partial M}{\partial N}\,dx + \int_{AB}\frac{M_t}{GI_p}\frac{\partial M_t}{\partial N}\,dx + \frac{Na}{EA} = 0
      $$

      Las integrales, con $\ell = a/\cos30^{\circ}$ la longitud de BC:

      $$
      \frac{\cos^{2}30^{\circ}}{EI_z}\left(\frac{N\ell^{3}}{3} - \frac{q_0\ell^{4}}{8}\right) - \frac{(W - N)\,a^{3}}{3EI_z} - \frac{(W/2 - N)\,a^{3}}{GI_p} + \frac{2Na^{3}}{EI_z} = 0
      $$

      Con $GI_p = EI_z$ y dividiendo por $a^{3}/(EI_z)$:

      $$
      N\left(\frac{1}{3\cos30^{\circ}} + \frac{1}{3} + 1 + 2\right) = \frac{q_0a}{8\cos^{2}30^{\circ}} + \frac{W}{3} + \frac{W}{2}
      $$

      $$
      N = \frac{0{,}1667 + 0{,}3849 + 0{,}5774}{3{,}7182}\,q_0a = 0{,}3036\,q_0a\ \text{(tracción)}
      $$

      El tirante, el término 2 del paréntesis, es el más flexible de todos:
      por eso se lleva solo una cuarta parte de la carga. El torsor de AB
      queda en $(W/2 - N)\,a = 0{,}2737\,q_0a^{2}$.

      **b) El desplazamiento vertical de B.** Con una fuerza ficticia $F$
      hacia abajo en B, solo cambia el flector de AB, que pasa a
      $(W - N + F)\,x$: B está sobre el eje de AB y el torsor no lo mueve. Con
      $F = 0$:

      $$
      \delta_B = \int_0^{a}\frac{(W - N)\,x\cdot x}{EI_z}\,dx = \frac{(W - N)\,a^{3}}{3EI_z} = 0{,}2837\,\frac{q_0a^{4}}{EI_z}
      $$

      hacia abajo.

      **Comprobaciones.** El motor del curso (Menabrea para estructuras
      espaciales, con el tirante anclado en D) da $N = 0{,}3036\,q_0a$ y
      $\delta_B = 0{,}2837\,q_0a^{4}/(EI_z)$, y C baja
      $0{,}6072\,q_0a^{4}/(EI_z)$, que es justo el alargamiento del tirante,
      $2Na^{3}/(EI_z)$. Por otro camino, la compatibilidad a mano: lo que baja
      C por la flexión de AB, $(W - N)a^{3}/(3EI_z)$, por el giro de torsión de
      AB, $(W/2 - N)a\cdot a/(GI_p)$ por el brazo $a$, y por la flexión de BC
      como voladizo, igualado al alargamiento del tirante: la misma ecuación.
      Si $q_0$ fuera por unidad de longitud horizontal, saldría
      $N = 0{,}2629\,q_0a$.

