asignatura: elasticidad-resistencia
curso: '2022-2023'
convocatoria: extraordinaria
fecha: 1 de febrero de 2023
# La convocatoria extraordinaria de Elasticidad y Resistencia de Materiales
# de 2022-2023, fechada el 01/02/2023: tres páginas a dos columnas, en
# castellano y en euskera, de la Escuela de Ingeniería de Gipuzkoa. La
# página 1 es de teoría (TEORÍA /TEORIA: una pregunta de 2 puntos con cinco
# partes y dos de 1 punto) y la 2 y la 3, de problemas (PROBLEMAS/ARIKETAK:
# cuatro de 1,5 puntos). Diez puntos en total, y el cuadernillo los imprime
# todos.
#
# Se transcribe la columna en castellano, tal cual, con sus puntos
# impresos. Lo que hay que saber de ese texto, dicho antes de que nadie lo
# deduzca:
#
# 1. **LA HOJA DE TEORÍA LLEVA LA CABECERA DEL PARCIAL.** La página 1 está
#    fechada el 18/11/2022, el día del primer parcial de ese curso (ya
#    publicado, 2022-2023-1par): es la plantilla sin cambiar. Las de
#    problemas llevan el 01/02/2023, que es la fecha del examen. Las
#    preguntas de teoría no son las del parcial.
#
# 2. **EL PDF PIERDE DATOS QUE EL WORD TIENE.** El PDF es una conversión del
#    Word original. No imprime el cuadro de los datos del problema 1
#    (εa, τxy, σx, E y ν), deja vacío el cuadro de la pregunta 2 de teoría
#    (a = 1,3d) y no deja ver el «= 2» de la última fórmula de los datos del
#    problema 2. Los tres se han leído del Word, y cada ejercicio lo dice.
#    La figura del problema 3 sale en el PDF tan pequeña que apenas se leen
#    las cotas; todas las figuras se han redibujado del Word.
#
# 3. **DOS NUMERACIONES, Y UN «2.» REPETIDO.** La teoría imprime «1.(2p)»,
#    «2.(1p)» y otra vez «2.(1p)»; los problemas vuelven a empezar en 1.
#    Aquí la teoría son n 1 a 3 (la segunda «2.» es la 3) y los problemas,
#    n 4 a 7; la `fuente` de cada ejercicio dice el número impreso.
#
# 4. **LA PREGUNTA 1 SE PARTE EN CINCO.** Imprime «1.(2p)» y cinco partes,
#    de la a) a la e), de cinco temas distintos y sin reparto de los dos
#    puntos. Son cinco ejercicios, todos con n 1; el punto de
#    puntosImpresos es el total de la pregunta, sin repartir.
#
# 5. **CINCO PARTES QUE YA ESTÁN EN EL SITIO.** La 1 d) (qr y qθ de una
#    carga por metro de horizontal en una pieza curva) y la 1 e) (el
#    proceso de deformación de una barra de una estructura articulada) son
#    las preguntas 3 a) y 3 b) del primer parcial de 2015-2016, con otras
#    palabras la primera y casi las mismas la segunda, otra numeración y
#    otros puntos. La 1 a), la 1 b) y la 1 c) son las cuestiones 1 del
#    tema 2, 4 del tema 4 y 1 del tema 6 de las hojas de autoevaluación,
#    que el sitio resuelve en sus temas: la a) y la c) palabra por
#    palabra, la b) con otras palabras. Ninguna es idéntica con su número
#    y sus puntos, así que las cinco van como ejercicios propios,
#    resueltos con otro ejemplo (lección 16), y la `fuente` de cada una
#    dice dónde más está.
#
# 6. **LECTURAS DE LAS FIGURAS.** En el problema 2, la figura no tiene
#    ningún resorte: el dato K = EA/(100L) no se usa, es un resto de la
#    plantilla del problema 3 de la 2.ª parte de enero (que sí tiene muelle
#    y es de sección circular; allí K = EA/(10L) y E = 2,5G); L se lee como
#    la a de la figura; la sección de ABC se toma circular (GIp = EIz con
#    E = 2G), y q0 va por unidad de longitud de BC. En el problema 3, los
#    tres apoyos están dibujados igual: A se toma fijo y C y E móviles; el
#    par de D es horario; las cotas de la sección van a las caras
#    exteriores. En el problema 4, el tirante FG no tiene datos y no hace
#    falta (las galgas de DE dan el giro de A); CH y HI se toman iguales a
#    CJ y JK, de longitud L, y los tirantes trabajan a tracción y a
#    compresión. El «45º» suelto al pie de la página 3 es el de la galga a
#    del detalle.
#
# 7. **ERRATAS Y RAREZAS DEL TEXTO, CONSERVADAS**: «¿Porque» (teoría 1 b),
#    «articulada» sin punto (1 e), «εε» (problema 1, y al empezar la primera
#    fórmula del 4), «σx=-30» sin unidad y «E=70GPA» (cuadro del problema
#    1), «(1,5)» sin la p (problema 1), «2(1.5p)» y «4(1.5p)» sin punto, los
#    ε sueltos tras las dos fórmulas del problema 4, «v=1/3», «todas la
#    barras» y el coeficiente de Poisson escrito «υ», una ípsilon griega en
#    lugar de la ν (cuadro de la teoría 3; en el Word es la «u» de la fuente
#    Symbol). Las demás letras griegas de esa fuente (εB, εC) se transcriben
#    como lo que son.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso (src/lib/erm) y de un segundo camino
# (fase-p/p9b, guiones/cifras.mjs). El motor no tiene piezas curvas, ni el
# proceso de deformación de una barra suelta, ni resortes de torsión: esas
# cifras salen de las fórmulas de los apuntes y se comprueban por
# integración, con la geometría exacta y con el resorte como un tramo de eje
# ficticio. La pregunta 1 no trae números: sus pasos de cálculo usan
# ejemplos nuestros, y lo dicen.
pdf: 2022-2023-ext.pdf
puntosImpresos:
  fuente: >-
    Impresos junto a cada pregunta: «1.(2p)», «2.(1p)» y «2.(1p)» en la
    teoría, pág. 1; «1. (1,5)», «2(1.5p)», «3. (1.5p)» y «4(1.5p)» en los
    problemas, págs. 1 a 3. La pregunta 1 no reparte sus dos puntos entre
    sus cinco partes.
  reparto:
    - { n: 1, puntos: 2 }
    - { n: 2, puntos: 1 }
    - { n: 3, puntos: 1 }
    - { n: 4, puntos: 1.5 }
    - { n: 5, puntos: 1.5 }
    - { n: 6, puntos: 1.5 }
    - { n: 7, puntos: 1.5 }

