      (2 p) La estructura de la figura soporta una fuerza $P$ en E y una
      carga distribuida $q$ en el tramo CD. Las barras 1 y 2 tienen el mismo
      módulo $E$ pero la sección $A_2$ = 2$A_1$. Considerando la barra ABCD
      infinitamente rígida, determinar:

      a/ Las fuerzas en las barras 1 y 2.

      b/ El desplazamiento horizontal y vertical en C.

