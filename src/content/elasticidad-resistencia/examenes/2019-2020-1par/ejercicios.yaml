      **Notas nuestras.** Los signos son los de los apuntes del tema 7
      (pp. 8-9): el cortante es positivo si en la parte de la izquierda va
      hacia arriba, y el flector, si tracciona la fibra inferior. Las
      reacciones se dan positivas hacia arriba.
    pide: >-
      Las reacciones en A, D y E y los diagramas de cortantes y de
      flectores, con sus valores en los puntos clave y el máximo.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por dónde se empieza?
        opciones:
          - texto: >-
              Por el tramo AC: tomando momentos en la rótula C sobre él, solo
              entra la reacción de A
            correcta: true
            mensaje: |
              Eso es. La rótula no transmite momento, así que el flector en C
              es nulo y AC da una ecuación con una sola incógnita, $R_A$. Con
              ella, las tres ecuaciones de toda la viga dan $R_D$, $R_E$ y la
              horizontal de E, que es nula.
          - texto: Por el tramo CE, que tiene dos apoyos
            mensaje: |
              CE tiene $R_D$, las dos de E **y** la fuerza que le pasa la
              rótula: más incógnitas que ecuaciones. En AC, en cambio, los
              momentos en C eliminan la fuerza de la rótula y solo queda
              $R_A$.
          - texto: >-
              Por las tres ecuaciones de equilibrio de toda la viga
            mensaje: |
              Las incógnitas son cuatro ($R_A$, $R_D$ y las dos de E) y las
              ecuaciones de toda la viga, tres. La cuarta es la de la rótula:
              $M_C = 0$ sobre un lado.
          - texto: >-
              No se puede: con tres apoyos la viga es hiperestática
            mensaje: |
              La rótula añade una ecuación ($M_C = 0$) y compensa el apoyo de
              más: cuatro reacciones, cuatro ecuaciones. Es isostática.
      - tipo: calcular
        titulo: La reacción en A
        pregunta: |
          ¿Cuánto vale $R_A$, en unidades de $q_0a$ (positiva hacia arriba)?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.01
          formato: un número, en unidades de q0·a
        distractores:
          - valor: '1.5'
            mensaje: |
              Has tomado el brazo de la carga desde A ($1{,}5a$) en lugar de
              desde C. Los momentos se toman en la rótula: la resultante,
              $2q_0a$, está a $0{,}5a$ de C, y $R_A$ a $2a$.
          - valor: '1'
            mensaje: |
              Has repartido la carga a medias entre A y C, como si estuviera
              centrada en AC. Está en BC, más cerca de C: a A le toca la
              cuarta parte.
        pista: |
          Momentos en C sobre AC: $R_A\cdot 2a = 2q_0a\cdot 0{,}5a$.
        desarrollo: |
          $$
          R_A\cdot 2a - 2q_0a\cdot\frac a2 = 0 \;\Longrightarrow\; R_A = \frac{q_0a}{2}
          $$
      - tipo: calcular
        titulo: La reacción en D
        pregunta: |
          ¿Cuánto vale $R_D$, en unidades de $q_0a$?
        respuesta:
          tipo: numero
          valor: '3.5'
          tolerancia: 0.01
          formato: un número, en unidades de q0·a
        distractores:
          - valor: '0.5'
            mensaje: |
              Has resuelto CE solo con su carga, sin la fuerza que le pasa la
              rótula: $1{,}5q_0a$ hacia abajo (lo que no sostiene A de los
              $2q_0a$). Con ella, momentos en E sobre CE dan $3{,}5q_0a$.
          - valor: '2.5'
            mensaje: |
              Has cambiado el signo del momento de la carga de DE. Con
              momentos en E sobre CE, la rótula ($1{,}5q_0a$ hacia abajo, brazo
              $2a$) y la carga de DE ($q_0a$, brazo $a/2$) giran **en el mismo
              sentido**: $R_D\cdot a = 3q_0a^2 + 0{,}5q_0a^2$.
        pista: |
          Momentos en E de toda la viga: $R_A\cdot4a + R_D\cdot a = 2q_0a\cdot2{,}5a + q_0a\cdot0{,}5a$.
        desarrollo: |
          $$
          \tfrac12\cdot4 + R_D\cdot1 = 2\cdot2{,}5 + 1\cdot0{,}5 \;\Longrightarrow\; R_D = 3{,}5\,q_0a
          $$
      - tipo: calcular
        titulo: La reacción en E
        pregunta: |
          ¿Cuánto vale la vertical de $E$, $R_E$, en unidades de $q_0a$
          (positiva hacia arriba)?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.01
          formato: un número, en unidades de q0·a
        distractores:
          - valor: '1'
            mensaje: |
              El valor es el bueno y el sentido no. La suma de verticales da
              $R_E = 3q_0a - 0{,}5q_0a - 3{,}5q_0a = -q_0a$: E **tira hacia
              abajo**. D sostiene un voladizo y la rótula, y E hace de
              contrapeso.
          - valor: '0.5'
            mensaje: |
              Has tomado la carga de DE a medias entre D y E, como en una viga
              biapoyada sola. Pero sobre CE también carga la rótula, y eso
              hace que E tire hacia abajo.
        pista: |
          Suma de verticales: $R_A + R_D + R_E = 2q_0a + q_0a$.
        desarrollo: |
          $$
          R_E = 3q_0a - \tfrac12q_0a - \tfrac72q_0a = -q_0a
          $$

          y la horizontal de E es nula: no hay cargas horizontales.
      - tipo: calcular
        titulo: El flector en D
        pregunta: |
          ¿Cuánto vale el momento flector en D, en unidades de $q_0a^2$?
        respuesta:
          tipo: numero
          valor: '-1.5'
          tolerancia: 0.01
          formato: un número, en unidades de q0·a²
        distractores:
          - valor: '1.5'
            mensaje: |
              El valor es el bueno y el signo no. CD es un voladizo que
              sostiene la rótula: tracciona la fibra **superior**, y el
              flector es negativo (tema 7, p. 9).
          - valor: '-3'
            mensaje: |
              Has tomado la fuerza de la rótula con brazo $2a$. De C a D hay
              $a$: $M_D = -1{,}5q_0a\cdot a$.
        pista: |
          Por la izquierda de D: $M_D = R_A\cdot3a - 2q_0a\cdot1{,}5a$, o
          desde la rótula, $-1{,}5q_0a\cdot a$.
        desarrollo: |
          $$
          M_D = \tfrac12\cdot3 - 2\cdot1{,}5 = -1{,}5\,q_0a^2
          $$
      - tipo: calcular
        titulo: El flector máximo
        pregunta: |
          ¿Cuánto vale el flector máximo positivo, en unidades de $q_0a^2$?
        respuesta:
          tipo: numero
          valor: '0.5625'
          tolerancia: 0.002
          formato: un número, en unidades de q0·a² (es 9/16)
        distractores:
          - valor: '0.5'
            mensaje: |
              Es el flector en B. En BC el cortante pasa por cero a
              $x = 1{,}25a$ (de $+0{,}5$ a $-1{,}5$), y ahí el flector es
              algo mayor: $\tfrac12 + \tfrac12\cdot\tfrac14\cdot\tfrac12 = \tfrac9{16}$.
          - valor: '0.25'
            mensaje: |
              Es $qL^2/8$ de BC como si fuera una viga biapoyada. BC no está
              apoyado en B: el flector allí no es nulo, y el máximo está donde
              el cortante se anula.
        pista: |
          El máximo está donde $V = 0$ (dM/dx = V): en BC,
          $V = \tfrac12 - 2(x - a)/a$ se anula en $x = 1{,}25a$.
        desarrollo: |
          $$
          M(1{,}25a) = R_A\cdot1{,}25a - 2q_0\cdot\frac{(0{,}25a)^2}{2} = 0{,}625 - 0{,}0625 = \tfrac{9}{16}\,q_0a^2
          $$
      - tipo: dibujar
        consigna: |
          En papel: **los diagramas de cortantes y de flectores**, alineados
          bajo la viga, con los valores en A, B, C, D y E y el máximo relativo.
        comprueba:
          - punto: |
              **Cortantes**: $+\tfrac12$ de A a B, recta hasta $-\tfrac32$ en
              C, $-\tfrac32$ hasta D, salto a $+2$, recta hasta $+1$ en E y
              vuelta a cero con la reacción (en $q_0a$).
            porque: |
              El cortante salta lo que vale cada reacción y baja con la carga
              repartida (dV/dx = −q, p. 12). El salto en E es hacia abajo
              porque la reacción es negativa.
          - punto: |
              **Flectores**: cero en A, $\tfrac12$ en B, máximo $\tfrac9{16}$ a
              $1{,}25a$, cero en C, $-\tfrac32$ en D y cero en E (en $q_0a^2$).
            porque: |
              El flector es nulo en la rótula y en los extremos apoyados, y
              tiene su máximo donde el cortante cambia de signo (dM/dx = V).
          - punto: |
              **Rectas y parábolas**: rectas en AB y CD (sin carga), parábolas
              en BC y DE.
            porque: |
              Sin carga el cortante es constante y el flector, lineal; con
              carga uniforme, cortante lineal y flector parabólico.
        figura: |
          <svg viewBox="30 8 440 280" role="img" width="440" height="280"
               aria-labelledby="exerm1920-1par-6-diagramas-dib-t exerm1920-1par-6-diagramas-dib-d">
            <title id="exerm1920-1par-6-diagramas-dib-t">Diagramas de cortantes y de flectores de la viga ABCDE</title>
            <desc id="exerm1920-1par-6-diagramas-dib-d">Dos diagramas alineados bajo la viga, a escala. Cortantes: un medio de q0 a constante de A a B; recta hasta menos tres medios de q0 a en C, que corta el cero a cinco cuartos de a; menos tres medios constante de C a D; salto en D hasta dos q0 a; recta hasta q0 a en E, donde la reacción, hacia abajo, lo devuelve a cero. Flectores, positivos hacia arriba: cero en A; recta hasta un medio de q0 a cuadrado en B; parábola con un máximo de nueve dieciseisavos de q0 a cuadrado a cinco cuartos de a y cero en la rótula C; recta hasta menos tres medios en D; parábola que vuelve a cero en E.</desc>
