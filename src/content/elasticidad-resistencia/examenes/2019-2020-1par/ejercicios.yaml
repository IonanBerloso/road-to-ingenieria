            <title id="exerm1920-1par-5-mohr-dib-t">Los tres círculos de Mohr de la chapa, a escala</title>
            <desc id="exerm1920-1par-5-mohr-dib-d">Ejes sigma n horizontal y módulo de tau n vertical. El círculo mayor, entre sigma tres, unos menos veintisiete megapascales, y sigma uno, unos trescientos setenta y tres, con centro en cien por raíz de tres y radio doscientos. Dentro, el círculo entre cero y sigma uno, casi tan grande, y el pequeño entre sigma tres y cero. Sobre el círculo mayor, tres puntos marcados: la cara de noventa grados abajo en sigma cero y tau cien; la de treinta grados en lo más alto, sobre el centro, con tau doscientos; y la de menos treinta grados abajo, en sigma doscientos por raíz de tres y tau cien.</desc>
