      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Momentos en la rótula C sobre AC: $R_A\cdot2a = 2q_0a\cdot0{,}5a$,
              luego $R_A = 0{,}5q_0a$.
          - texto: >-
              Momentos en E de toda la viga: $R_D = 3{,}5q_0a$; verticales:
              $R_E = -q_0a$, hacia abajo.
          - texto: >-
              Cortantes: $0{,}5$; de $0{,}5$ a $-1{,}5$ en BC; $-1{,}5$; salto a
              $2$ en D y de $2$ a $1$ en DE.
          - texto: >-
              Flectores: $0{,}5$ en B, $9/16$ a $1{,}25a$, cero en C, $-1{,}5$
              en D y cero en E.
          - texto: >-
              En la rótula C el cortante también es nulo, porque la rótula no
              transmite esfuerzos.
            trampa: true
            mensaje: |
              La rótula no transmite **momento**, pero sí fuerza: el cortante
              en C vale $-1{,}5q_0a$, la fuerza que pasa de AC a CE.
    resolucion: |
      **Las reacciones.** Cuatro incógnitas ($R_A$, $R_D$ y las dos de E) y
      cuatro ecuaciones: las tres de toda la viga y $M_C = 0$ en la rótula.

      Momentos en C sobre AC (la carga $2q_0a$ de BC, a $a/2$ de C):

      $$
      R_A\cdot2a = 2q_0a\cdot\frac a2 \;\Longrightarrow\; R_A = \frac{q_0a}{2}
      $$

      Momentos en E de toda la viga, y suma de verticales:

      $$
      R_A\cdot4a + R_D\cdot a = 2q_0a\cdot\frac52a + q_0a\cdot\frac a2 \;\Longrightarrow\; R_D = \frac72q_0a,
      \qquad R_E = 3q_0a - R_A - R_D = -q_0a
      $$

      E tira hacia abajo, y la horizontal de E es nula.

      **Cortantes** (tema 7, p. 8; $V$ en $q_0a$, con $x$ desde A):

      | tramo | $V$ |
      |---|---|
      | AB | $+\tfrac12$ |
      | BC | $\tfrac12 - 2\,\dfrac{x-a}{a}$, de $+\tfrac12$ a $-\tfrac32$; nulo en $x = 1{,}25a$ |
      | CD | $-\tfrac32$ |
      | DE | $2 - \dfrac{x-3a}{a}$, de $2$ a $1$ |

      **Flectores** ($M$ en $q_0a^2$): $M_A = 0$, $M_B = \tfrac12$, máximo
      $\tfrac9{16}$ en $x = 1{,}25a$, $M_C = 0$ (la rótula), $M_D = -\tfrac32$
      y $M_E = 0$. Rectas en AB y CD; parábolas en BC y DE.

