      </figure>

      **Comprobación.** El motor del curso, con $\sigma_x = 200\sqrt3$,
      $\sigma_y = 0$ y $\tau_{xy} = -100$, da $\sigma_n = 0$ y $\tau_n = 100$
      en la cara de 90°, y un barrido de todos los ángulos pone la $|\tau_n|$
      máxima en 30°, con 200 MPa. La traza se conserva:
      $\sigma_1 + \sigma_3 = \sigma_x + \sigma_y = 346{,}4$.

      **La otra lectura.** El enunciado no dice el sentido de los 100 MPa. Si
      se toma $\tau_{xy} = +100$ ($\tau_n = -100$ en la cara de arriba), el
      centro sale en $-100\sqrt3$ y **todas las tensiones normales cambian de
      signo**: $\sigma_1 = 26{,}8$ a 75°, $\sigma_3 = -373{,}2$ a −15°, y
      $\sigma_n = -173{,}2$ en la cara de τ máxima. Los radios, las
      direcciones y los módulos de las tangenciales no cambian.

