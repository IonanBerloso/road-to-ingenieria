      Los dos diagramas a escala, con el flector **positivo hacia arriba** (tracciona la fibra inferior). El cortante salta en D lo que vale la reacción, 3,5q₀a, y en E baja q₀a porque la reacción de E **tira hacia abajo**.

      </figcaption>
      </figure>

      **Comprobación.** El motor del curso resuelve la viga con los mismos
      apoyos, la rótula y las dos cargas, y da las mismas reacciones, el
      cortante nulo en $1{,}25a$ y los flectores de la tabla. Por la derecha
      de D sale lo mismo: $M_D = R_E\cdot a - q_0a\cdot\tfrac a2 = -1 - \tfrac12 = -\tfrac32$.
      Y el flector en C es nulo por la izquierda:
      $R_A\cdot2a - 2q_0a\cdot\tfrac a2 = 1 - 1 = 0$.

  # ── Problema 3 · la pieza en escalón colgada de dos barras (hiperestático).
  - id: exerm1920-1par-7-la-pieza-en-escalon-colgada-de-dos-barras
    titulo: Una pieza rígida articulada en A y colgada de dos barras de distinta sección
    fuente: >-
      Problema 3 · Primer parcial del 15 de noviembre de 2019 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 2 puntos. El examen no publica resolución; el desarrollo es nuestro
      y sigue los apuntes del tema 8, pp. 4-8.
