      - tipo: calcular
        titulo: La tensión principal mayor
        pregunta: |
          ¿Cuánto vale $\sigma_1$, en MPa?
        respuesta:
          tipo: numero
          valor: '373.205'
          tolerancia: 0.5
          formato: un número, en MPa (vale 100·(2 + sqrt(3)))
        distractores:
          - valor: '200'
            mensaje: |
              Ese es el radio. La principal es centro **más** radio:
              $\sigma_1 = \sigma_C + R$ (ec. 2.69).
          - valor: '346.41'
            mensaje: |
              Es la normal de la cara de −30° (y $\sigma_x$ en nuestros ejes),
              pero esa cara tiene tangencial: no es principal. La principal es
              el punto del círculo con $\tau_n = 0$, $\sigma_C + R$.
        pista: |
          $\sigma_{1,2} = \sigma_C \pm R$ (ec. 2.69).
        desarrollo: |
          $$
          \sigma_1 = 100\sqrt3 + 200 = 373{,}2\ \text{MPa}, \qquad
          \sigma_3 = 100\sqrt3 - 200 = -26{,}8\ \text{MPa}
          $$

          y $\sigma_2 = 0$ (la de z): ordenadas, $373{,}2 > 0 > -26{,}8$.
      - tipo: calcular
        titulo: La principal menor
        pregunta: |
          ¿Cuánto vale $\sigma_3$, la menor de las tres, en MPa?
        respuesta:
          tipo: numero
          valor: '-26.795'
          tolerancia: 0.5
          formato: un número, en MPa (vale 100·(sqrt(3) − 2))
        distractores:
          - valor: '0'
            mensaje: |
              El cero es la de z, y aquí no es la menor: la otra del plano,
              $\sigma_C - R$, es negativa. Ordenadas, $\sigma_1 > 0 > \sigma_3$,
              y la de z es $\sigma_2$.
          - valor: '-200'
            mensaje: |
              Has puesto el círculo centrado en el origen: $\sigma_3 = -R$. El
              centro está en $100\sqrt3$: $\sigma_3 = \sigma_C - R = -26{,}8$
              MPa.
        pista: |
          $\sigma_C - R$.
        desarrollo: |
          $$
          \sigma_3 = 100\sqrt3 - 200 = -26{,}8\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La dirección de σ1
        pregunta: |
          ¿Qué ángulo forma con x la dirección de $\sigma_1$, en grados, entre
          −90 y 90 (antihorario positivo)?
        respuesta:
          tipo: numero
          valor: '-15'
          tolerancia: 0.2
          formato: un número, en grados
        distractores:
          - valor: '15'
            mensaje: |
              El valor es el bueno y el sentido no. Con $\tau_{xy} = -100$ y
              $\sigma_x - \sigma_y > 0$, $\tan 2\theta_1 < 0$: el ángulo es
              horario, $-15^\circ$ (ec. 2.62).
          - valor: '75'
            mensaje: |
              Es la dirección de la otra principal del plano, la de
              $\sigma_3 = -26{,}8$ MPa. La de $\sigma_1$ está 90° antes. (Con
              el otro sentido de los 100 MPa, que la nota del enunciado deja
              aparte, 75° sí sería la de $\sigma_1$.)
          - valor: '-60'
            mensaje: |
              Has girado 90° desde la normal de la cara de τ máxima (30°). Las
              principales están a **45°** de ella (ec. 2.64): 90° es lo que
              se gira en el círculo, no en la chapa.
        pista: |
          $\tan 2\theta_1 = \dfrac{2\tau_{xy}}{\sigma_x-\sigma_y} = \dfrac{-200}{200\sqrt3}$,
          y compruébalo: $30^\circ - 45^\circ$.
        desarrollo: |
          $$
          \tan 2\theta_1 = -\frac{1}{\sqrt3} \;\Longrightarrow\; 2\theta_1 = -30^\circ,\quad \theta_1 = -15^\circ
          $$

          Sustituyendo $\theta = -15^\circ$ en la ec. 2.61 sale
          $\sigma_n = 373{,}2$: es la de $\sigma_1$. La de $\sigma_3$ va a
          $75^\circ$, y la de $\sigma_2 = 0$ es z, normal a la chapa.
      - tipo: dibujar
        consigna: |
          En papel: **las direcciones principales sobre el hexágono**, con el
          elemento girado y el sentido de cada tensión.
        comprueba:
          - punto: |
              **Un elemento girado 15° en sentido horario**, con $\sigma_1$
              saliendo de las dos caras cuya normal está a $-15^\circ$.
            porque: |
              Es lo que pide «identificando los planos»: $\sigma_1$ actúa en el
              plano cuya normal es su dirección, no en uno paralelo a ella.
          - punto: |
              **$\sigma_3$ hacia dentro**, en las caras de normal a 75°, más
              corta que $\sigma_1$.
            porque: |
              Es de compresión, $-26{,}8$ MPa: las flechas apuntan al
              elemento.
          - punto: |
              **La cara de τ máxima a 45°** de las dos direcciones, y
              $\sigma_2 = 0$ dicho aparte, normal a la chapa.
            porque: |
              Es la comprobación de que el dibujo casa con el dato: la normal
              de esa cara (30°) biseca el ángulo entre $-15^\circ$ y $75^\circ$.
        figura: |
          <svg viewBox="60 40 290 210" role="img" width="290" height="210"
               aria-labelledby="exerm1920-1par-5-principales-dib-t exerm1920-1par-5-principales-dib-d">
            <title id="exerm1920-1par-5-principales-dib-t">Las direcciones principales dibujadas sobre la chapa</title>
            <desc id="exerm1920-1par-5-principales-dib-d">El hexágono, con un pequeño cuadrado en el centro girado quince grados en sentido horario. Desde sus dos caras casi verticales salen hacia fuera dos flechas largas, inclinadas quince grados por debajo de la horizontal hacia la derecha y por encima hacia la izquierda: sigma uno, unos trescientos setenta y tres megapascales, de tracción. Sobre las otras dos caras, dos flechas cortas que apuntan hacia el cuadrado, a setenta y cinco grados de la horizontal: sigma tres, unos menos veintisiete, de compresión. Un arco marca los quince grados entre la horizontal y la dirección de sigma uno. Debajo, la nota: sigma dos igual a cero, normal a la chapa.</desc>
