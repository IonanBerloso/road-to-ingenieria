      Redibujada del **Word** original: en el PDF la figura sale a medio dibujar (solo la pieza gris, los pasadores con sus apoyos y los rótulos, también los de P, q y las cotas; faltan las dos barras, las flechas de P y de q y las líneas de cota). Todo lo demás es del original: la articulación de A en una pared, las dos barras verticales colgadas del techo y la q dibujada **por debajo** de CD, con las flechas hacia abajo.

      </figcaption>
      </figure>

      **Notas nuestras.** La figura es la del Word original (en el PDF sale a
      medio dibujar); de ella salen $P = 2qa$ y las cotas. La letra E nombra
      a la vez el punto donde actúa $P$ y el módulo de elasticidad. Los
      desplazamientos se piden en unidades de $qa^2/(EA_1)$, y los giros se
      suponen pequeños.
    pide: >-
      Las fuerzas en las barras 1 y 2 y los desplazamientos horizontal y
      vertical de C.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Basta la estática para sacar las fuerzas de las barras?
        opciones:
          - texto: >-
              No: hay cuatro incógnitas ($N_1$, $N_2$ y las dos de A) y tres
              ecuaciones; falta una de compatibilidad, que sale del giro de la
              pieza rígida alrededor de A
            correcta: true
            mensaje: |
              Eso es: hiperestático de grado 1 (tema 8, p. 4). La
              pieza gira un ángulo $\theta$ alrededor de A; B baja $2a\theta$ y
              D, $4a\theta$, y cada barra se alarga lo que baja su extremo.
          - texto: >-
              Sí: momentos en A dan las dos fuerzas
            mensaje: |
              Los momentos en A dan **una** ecuación con dos incógnitas,
              $N_1\cdot2a + N_2\cdot4a = 8qa^2$. Hace falta otra, y la estática
              no tiene más: es la compatibilidad de los alargamientos.
          - texto: >-
              Sí, porque al ser rígida la pieza, las dos barras se alargan lo
              mismo
            mensaje: |
              La pieza es rígida, pero **gira** alrededor de A: el punto D, el
              doble de lejos de A que B, baja el doble. Los alargamientos son
              proporcionales a la distancia a A, no iguales.
      - tipo: calcular
        titulo: La fuerza en la barra 1
        pregunta: |
          ¿Cuánto vale $N_1$, en unidades de $qa$ (positiva a tracción)?
        respuesta:
          tipo: numero
          valor: '0.8'
          tolerancia: 0.01
          formato: un número, en unidades de q·a
        distractores:
          - valor: '1.3333'
            mensaje: |
              Sale de tomar las dos barras con la misma sección. Con
              $A_2 = 2A_1$ y $L_2 = 2L_1$, $\Delta L_2 = 2\Delta L_1$ da
              $N_2\cdot4a/(2EA_1) = 2N_1\cdot2a/(EA_1)$, es decir, $N_2 = 2N_1$.
          - valor: '0.6'
            mensaje: |
              Has puesto la resultante de $q$ en C, con brazo $2a$. Está en el
              centro de CD, a $3a$ de A en horizontal: $2qa\cdot3a$.
          - valor: '0.4444'
            mensaje: |
              Has tomado la barra 2 tan larga como la 1. Va del techo a D, que
              está $2a$ por debajo de AB: mide $4a$.
        pista: |
          Momentos en A: $N_1\cdot2a + N_2\cdot4a = 2qa\cdot a + 2qa\cdot3a$.
          Compatibilidad: $\Delta L_2 = 2\Delta L_1$.
        desarrollo: |
          $$
          \Delta L_1 = \frac{N_1\cdot2a}{EA_1},\quad \Delta L_2 = \frac{N_2\cdot4a}{2EA_1},\quad
          \Delta L_2 = 2\Delta L_1 \;\Longrightarrow\; N_2 = 2N_1
          $$

          $$
          2N_1 + 8N_1 = 8qa \;\Longrightarrow\; N_1 = \frac{4}{5}qa = 0{,}8\,qa
          $$
      - tipo: calcular
        titulo: La fuerza en la barra 2
        pregunta: |
          ¿Cuánto vale $N_2$, en unidades de $qa$?
        respuesta:
          tipo: numero
          valor: '1.6'
          tolerancia: 0.01
          formato: un número, en unidades de q·a
        distractores:
          - valor: '1.3333'
            mensaje: |
              Es el reparto con las dos secciones iguales, $N_1 = N_2$. Con
              $A_2 = 2A_1$ la barra 2 es el doble de rígida por unidad de
              longitud y se lleva el doble: $N_2 = 2N_1$.
          - valor: '1.2'
            mensaje: |
              Has puesto la resultante de $q$ en C. Va en el centro de CD, a
              $3a$ de A.
          - valor: '1.7778'
            mensaje: |
              Has tomado $L_2 = 2a$. La barra 2 cuelga del techo hasta D, $4a$.
        pista: |
          $N_2 = 2N_1$.
        desarrollo: |
          $$
          N_2 = 2N_1 = \frac85qa = 1{,}6\,qa
          $$

          Las dos a tracción. En A, la vertical vale
          $4qa - 0{,}8qa - 1{,}6qa = 1{,}6qa$ hacia arriba, y la horizontal es
          nula.
      - tipo: calcular
        titulo: El desplazamiento horizontal de C
        pregunta: |
          ¿Cuánto se mueve C en horizontal, en unidades de $qa^2/(EA_1)$,
          positivo hacia la derecha?
        respuesta:
          tipo: numero
          valor: '-1.6'
          tolerancia: 0.01
          formato: un número, en unidades de q·a²/(E·A₁)
        distractores:
          - valor: '0'
            mensaje: |
              C no está en la recta horizontal de A: está $2a$ por debajo. Al
              girar la pieza alrededor de A, se mueve en perpendicular a AC,
              que está a 45°: tanto en horizontal como en vertical.
          - valor: '1.6'
            mensaje: |
              El valor es el bueno y el sentido no. La pieza gira en sentido
              horario (D baja); C, por debajo de A, se va hacia la
              **izquierda**: $u_C = -\theta\,y_C$ con $\theta < 0$ e
              $y_C = -2a$.
        pista: |
          Giro pequeño: $\vec u = \theta\,\vec k\times\vec r_{AC}$, con
          $\vec r_{AC} = (2a, -2a)$ y $\theta = -\Delta L_1/(2a)$.
        desarrollo: |
          $$
          \theta = -\frac{\Delta L_1}{2a} = -\frac{0{,}8qa\cdot2a}{EA_1\cdot2a} = -0{,}8\,\frac{qa}{EA_1}
          $$

          $$
          u_C = -\theta\,y_C = -0{,}8\cdot2a\,\frac{qa}{EA_1} = -1{,}6\,\frac{qa^2}{EA_1}
          $$

          (hacia la izquierda).
      - tipo: calcular
        titulo: El desplazamiento vertical de C
        pregunta: |
          ¿Cuánto **baja** C, en unidades de $qa^2/(EA_1)$?
        respuesta:
          tipo: numero
          valor: '1.6'
          tolerancia: 0.01
          formato: un número, en unidades de q·a²/(E·A₁)
        distractores:
          - valor: '3.2'
            mensaje: |
              Es lo que baja D, a $4a$ de A en horizontal. C está en la misma
              vertical que B: baja lo que B, $\Delta L_1$.
          - valor: '2.263'
            mensaje: |
              Es el desplazamiento total de C,
              $\sqrt{1{,}6^2 + 1{,}6^2}$. Se pide la componente vertical.
        pista: |
          C y B están en la misma vertical, a $2a$ de A: bajan lo mismo, y B
          baja lo que se alarga la barra 1.
        desarrollo: |
          $$
          v_C = \theta\,x_C = -0{,}8\cdot2a\,\frac{qa}{EA_1} = -1{,}6\,\frac{qa^2}{EA_1} = -\Delta L_1
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Momentos en A: $N_1\cdot2a + N_2\cdot4a = 2qa\cdot a + 2qa\cdot3a = 8qa^2$.
          - texto: >-
              La pieza gira $\theta$ alrededor de A: $\Delta L_1 = 2a|\theta|$ y
              $\Delta L_2 = 4a|\theta|$, luego $\Delta L_2 = 2\Delta L_1$ y
              $N_2 = 2N_1$.
          - texto: >-
              $N_1 = 0{,}8qa$ y $N_2 = 1{,}6qa$, las dos a tracción.
          - texto: >-
              C se mueve en perpendicular a AC: $1{,}6\,qa^2/(EA_1)$ hacia la
              izquierda y otro tanto hacia abajo.
          - texto: >-
              C solo se mueve en vertical, porque las dos barras son
              verticales.
            trampa: true
            mensaje: |
              Las barras verticales fijan cómo se mueven B y D, pero la pieza
              **gira** alrededor de A, y C, que está $2a$ por debajo de A, se
              desplaza también en horizontal.
    resolucion: |
      **Estática.** Incógnitas: $N_1$, $N_2$ y las dos reacciones de A;
      ecuaciones, tres: hiperestático de grado 1 (tema 8, p. 4). Las
      cargas son $P = 2qa$ en E, a $a$ de A, y la resultante de $q$, $2qa$ en
      el centro de CD, a $3a$ de A en horizontal. Momentos en A:

      $$
      N_1\cdot2a + N_2\cdot4a = 2qa\cdot a + 2qa\cdot3a = 8qa^2
      $$

      **Compatibilidad.** La pieza rígida gira un ángulo pequeño $\theta$
      alrededor de A. B, a $2a$, baja $2a|\theta|$, y D, a $4a$, baja
      $4a|\theta|$; cada barra se alarga lo que baja su extremo (ecs. 8.9 a
      8.12, pp. 7-8, sin término térmico):

      $$
      \frac{N_2\cdot4a}{E\cdot2A_1} = 2\,\frac{N_1\cdot2a}{EA_1} \;\Longrightarrow\; N_2 = 2N_1
      $$

      **a) Las fuerzas:**

      $$
      2N_1 + 8N_1 = 8qa \;\Longrightarrow\; \boxed{N_1 = 0{,}8\,qa}, \qquad \boxed{N_2 = 1{,}6\,qa}
      $$

      las dos a tracción. La reacción en A: $1{,}6qa$ hacia arriba, sin
      horizontal.

      **b) El desplazamiento de C.** El giro sale de la barra 1:
      $\theta = -\Delta L_1/2a = -0{,}8\,qa/(EA_1)$ (horario). Con
      $\vec r_{AC} = (2a, -2a)$ y $\vec u = \theta\,\vec k\times\vec r$:

      $$
      u_C = -\theta\,y_C = -1{,}6\,\frac{qa^2}{EA_1}, \qquad
      v_C = \theta\,x_C = -1{,}6\,\frac{qa^2}{EA_1}
      $$

      C se mueve $1{,}6\,qa^2/(EA_1)$ hacia la **izquierda** y lo mismo hacia
      **abajo**, en perpendicular a AC; en total,
      $1{,}6\sqrt2 \approx 2{,}26\,qa^2/(EA_1)$.

      **Comprobación.** El motor del curso, con la pieza rígida articulada en
      A, las dos barras y las dos cargas, da $N_1 = 0{,}8qa$, $N_2 = 1{,}6qa$,
      $\Delta L_2 = 2\Delta L_1$ y el mismo desplazamiento de C. A mano: C y
      B están en la misma vertical, así que C baja lo que se alarga la barra
      1, $\Delta L_1 = 0{,}8qa\cdot2a/(EA_1) = 1{,}6\,qa^2/(EA_1)$.
