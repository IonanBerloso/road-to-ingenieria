# Parcial 1 de Elasticidad y Resistencia de Materiales del 15/11/2019
# (2019-2020-1par). Fuente de ejercicios.yaml: monta.mjs sustituye cada
# `@@FIG nombre@@` por figuras/<nombre>.svg. No se edita el YAML montado.
ejercicios:
  # ── Teoría · pregunta 1 · las direcciones principales son perpendiculares.
  #    Copia literal de la pregunta 1 del parcial de 2014-2015 (p0).
  - id: exerm1920-1par-1-las-direcciones-principales-son-perpendiculares
    titulo: Por qué las direcciones principales del tensor de tensiones son perpendiculares
    fuente: >-
      Pregunta 1 de teoría · Primer parcial del 15 de noviembre de 2019 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Ya había caído palabra por palabra en
      el primer parcial de noviembre de 2014. El examen no publica resolución;
      el desarrollo es nuestro y sigue los apuntes del tema 2, pp. 18-19.
    nivel: examen
    enunciado: |
      (1p) Deducir que las direcciones principales del tensor de tensiones son
      ortogonales.
    pide: >-
      La deducción de que dos direcciones principales con tensiones distintas
      son perpendiculares, y qué pasa si dos tensiones principales son
      iguales.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De qué se parte para deducirlo?
        opciones:
          - texto: >-
              De la definición de dirección principal escrita para dos de
              ellas, $[\sigma]\{n_1\} = \sigma_1\{n_1\}$ y
              $[\sigma]\{n_2\} = \sigma_2\{n_2\}$, y de que $[\sigma]$ es
              simétrica
            correcta: true
            mensaje: |
              Eso es. Son dos problemas de autovalores con la misma matriz, y
              la simetría (la reciprocidad de las tangenciales,
              $\tau_{ij} = \tau_{ji}$) es lo que permite restarlos y que
              quede solo el producto escalar.
          - texto: >-
              De la ecuación característica: como sus tres raíces son reales,
              las direcciones son perpendiculares
            mensaje: |
              Que las raíces sean reales es **otro** resultado de los apuntes
              (ecs. 2.38 a 2.43), y no dice nada del ángulo entre las
              direcciones. La perpendicularidad sale de las propias
              ecuaciones $[\sigma]\{n_i\} = \sigma_i\{n_i\}$.
          - texto: >-
              De que la tangencial máxima forma 45° con las direcciones
              principales
            mensaje: |
              Eso es una consecuencia (ec. 2.64, en tensión plana), no el
              punto de partida. Además, para llegar a esos 45° ya se ha usado
              que las principales están a 90°.
          - texto: >-
              De que en el sistema principal la matriz es diagonal, y una
              matriz diagonal tiene los ejes perpendiculares
            mensaje: |
              Es dar por hecho lo que se pide. Que exista un sistema
              **cartesiano** en el que $[\sigma]$ es diagonal (ec. 2.47) es
              justo la consecuencia de que las direcciones sean
              perpendiculares.
      - tipo: calcular
        titulo: Las dos direcciones de un estado plano
        pregunta: |
          Un ejemplo nuestro para verlo con números: en tensión plana con
          $\sigma_x = 5$, $\sigma_y = 2$ y $\tau_{xy} = 2$ MPa, ¿qué ángulo
          $\theta_1$ (en grados, entre −90 y 90, antihorario desde x) forma
          con x la dirección principal de $\sigma_1$?
        respuesta:
          tipo: numero
          valor: '26.5651'
          tolerancia: 0.05
          formato: un número, en grados
        distractores:
          - valor: '53.1301'
            mensaje: |
              Ese es $2\theta_1$. La ec. 2.62 da la tangente del ángulo
              **doble**, $\tan 2\theta_1 = 4/3$: falta dividir entre dos.
          - valor: '18.4349'
            mensaje: |
              Has invertido el cociente, $\tan 2\theta_1 = 3/4$. Es
              $2\tau_{xy}$ partido por $\sigma_x - \sigma_y$, no al revés.
        pista: |
          $\tan 2\theta_1 = \dfrac{2\tau_{xy}}{\sigma_x - \sigma_y}$ (ec. 2.62).
        desarrollo: |
          $$
          \tan 2\theta_1 = \frac{2\cdot2}{5-2} = \frac43
          \;\Longrightarrow\; \theta_1 = 26{,}57^\circ
          $$

          Con $\sigma_{1,2} = 3{,}5 \pm 2{,}5$: $\sigma_1 = 6$ y $\sigma_2 = 1$ MPa.
          La otra solución de la tangente, $\theta_1 + 90^\circ = 116{,}57^\circ$,
          es la dirección de $\sigma_2$: las dos están a 90°, como dice la
          deducción.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción como en el examen, desde la definición de
          dirección principal hasta el caso de dos tensiones principales
          iguales.
        rubrica:
          - punto: >-
              Se escribe la definición para dos direcciones principales:
              [σ]{n1} = σ1{n1} y [σ]{n2} = σ2{n2} (ecs. 2.44 y 2.45).
            porque: >-
              Es el punto de partida. Sin las dos ecuaciones escritas, lo que
              sigue no tiene de dónde salir.
            minimo: true
          - punto: >-
              Se premultiplica la primera por {n2}ᵗ y la segunda por {n1}ᵗ.
            porque: >-
              Es la operación que convierte las dos ecuaciones vectoriales en
              dos escalares que se pueden restar.
            minimo: true
          - punto: >-
              Se dice que {n2}ᵗ[σ]{n1} = {n1}ᵗ[σ]{n2} porque [σ] es simétrica
              (reciprocidad de las tensiones tangenciales) y la traspuesta de
              un escalar es el mismo número.
            porque: >-
              Es el paso que hace funcionar la deducción, y el que más se
              olvida. Con una matriz que no fuera simétrica no se podría
              restar.
            minimo: true
          - punto: >-
              Restando queda (σ1 − σ2)·{n1}ᵗ{n2} = 0 (ec. 2.46).
            porque: >-
              Es el resultado. Los apuntes lo escriben {n1}{n2}ᵗ, pero es el
              producto escalar {n1}ᵗ{n2}, un número y no una matriz.
            minimo: true
          - punto: >-
              Si σ1 ≠ σ2, el producto escalar es nulo: n1 y n2 son
              perpendiculares. Si σ1 = σ2, la ecuación se cumple sola y toda
              dirección perpendicular a la 3 es principal, así que se pueden
              elegir perpendiculares.
            porque: >-
              Los dos casos los pide la deducción completa; quedarse en el
              primero deja sin contestar el de tensiones repetidas.
          - punto: >-
              Se extiende a las parejas 1-3 y 2-3: con las tres distintas, las
              tres direcciones son perpendiculares entre sí.
            porque: >-
              El enunciado habla de «las direcciones», en plural: la deducción
              se hace con dos y se dice que vale para cada pareja.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Dos direcciones principales cumplen
              $[\sigma]\{n_1\} = \sigma_1\{n_1\}$ y
              $[\sigma]\{n_2\} = \sigma_2\{n_2\}$.
          - texto: >-
              Premultiplicando por $\{n_2\}^t$ y por $\{n_1\}^t$:
              $\{n_2\}^t[\sigma]\{n_1\} = \sigma_1\{n_2\}^t\{n_1\}$ y
              $\{n_1\}^t[\sigma]\{n_2\} = \sigma_2\{n_1\}^t\{n_2\}$.
          - texto: >-
              Como $[\sigma]$ es simétrica, los dos primeros miembros son el
              mismo número; restando, $(\sigma_1 - \sigma_2)\{n_1\}^t\{n_2\} = 0$.
          - texto: >-
              Si $\sigma_1 \neq \sigma_2$, $\{n_1\}^t\{n_2\} = 0$: son
              perpendiculares. Si son iguales, cualquier dirección del plano
              perpendicular a la 3 es principal.
          - texto: >-
              La igualdad $\{n_2\}^t[\sigma]\{n_1\} = \{n_1\}^t[\sigma]\{n_2\}$
              vale para cualquier matriz, porque los dos lados son escalares.
            trampa: true
            mensaje: |
              Que los dos lados sean escalares dice que cada uno es igual a su
              traspuesto: $\{n_2\}^t[\sigma]\{n_1\} = \{n_1\}^t[\sigma]^t\{n_2\}$.
              Para quitar la $t$ de $[\sigma]$ hace falta que sea simétrica. Con
              una matriz no simétrica los autovectores no tienen por qué ser
              perpendiculares.
    resolucion: |
      **La idea.** Una dirección principal es un autovector de $[\sigma]$, y
      $[\sigma]$ es simétrica. Los autovectores de una matriz simétrica con
      autovalores distintos son perpendiculares: eso es lo que se deduce.

      **Las dos ecuaciones** (apuntes del tema 2, ecs. 2.44 y 2.45, p. 18).
      Para dos direcciones principales:

      $$
      [\sigma]\{n_1\} = \sigma_1\{n_1\}, \qquad [\sigma]\{n_2\} = \sigma_2\{n_2\}
      $$

      **Premultiplicando** la primera por $\{n_2\}^t$ y la segunda por
      $\{n_1\}^t$:

      $$
      \{n_2\}^t[\sigma]\{n_1\} = \sigma_1\,\{n_2\}^t\{n_1\}, \qquad
      \{n_1\}^t[\sigma]\{n_2\} = \sigma_2\,\{n_1\}^t\{n_2\}
      $$

      Cada lado es un número, igual a su traspuesto:
      $\{n_2\}^t[\sigma]\{n_1\} = \{n_1\}^t[\sigma]^t\{n_2\}$, y como
      $[\sigma]$ **es simétrica** ($\tau_{ij} = \tau_{ji}$), es
      $\{n_1\}^t[\sigma]\{n_2\}$. Los dos primeros miembros son iguales, y
      restando (ec. 2.46, p. 19):

      $$
      (\sigma_1 - \sigma_2)\,\{n_1\}^t\{n_2\} = 0
      $$

      (los apuntes lo escriben $\{n_1\}\{n_2\}^t$; es el producto escalar).

      **Los dos casos.**

      - $\sigma_1 \neq \sigma_2$: $\{n_1\}^t\{n_2\} = 0$, las direcciones 1 y 2
        son **perpendiculares**.
      - $\sigma_1 = \sigma_2$: la ecuación se cumple sola, y toda dirección
        perpendicular a la 3 es principal; se pueden tomar dos perpendiculares.

      Lo mismo para las parejas 1-3 y 2-3: con las tres tensiones distintas,
      las tres direcciones son perpendiculares entre sí, y existe el sistema
      O123 en que $[\sigma]$ es diagonal (ec. 2.47). Si las tres son iguales,
      todas las direcciones son principales.

      **Con números** (el ejemplo del paso de cálculo): $\sigma_x = 5$,
      $\sigma_y = 2$, $\tau_{xy} = 2$ dan $\theta_1 = 26{,}57^\circ$ para
      $\sigma_1 = 6$ y $116{,}57^\circ$ para $\sigma_2 = 1$; el motor del curso
      comprueba que en las dos el vector tensión es normal al plano.

  # ── Teoría · pregunta 3 · von Mises desde la energía de distorsión.
  - id: exerm1920-1par-3-von-mises-desde-la-energia-de-distorsion
    titulo: La tensión equivalente de von Mises, deducida de la energía de distorsión
    fuente: >-
      Pregunta 3 de teoría · Primer parcial del 15 de noviembre de 2019 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. Es la cuestión 6 de la hoja de
      autoevaluación del tema 6. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 6, pp. 10-12.
    nivel: examen
    enunciado: |
      (1p) Deducir la tensión equivalente del criterio de Von Mises, siendo la
      energía de deformación por unidad de volumen la siguiente:

      $$
      U_0 = \frac12\left(\sigma_x\varepsilon_x + \sigma_y\varepsilon_y + \sigma_z\varepsilon_z
      + \tau_{xy}\gamma_{xy} + \tau_{yz}\gamma_{yz} + \tau_{zx}\gamma_{zx}\right)
      $$
    pide: >-
      σeqv en función de las componentes del tensor (y de las principales),
      separando U0 en la parte de cambio de volumen y la de distorsión.
    pasos:
      - tipo: reconocer
        pregunta: |
          El criterio de von Mises iguala una energía del estado real con la
          del estado equivalente. ¿Cuál?
        opciones:
          - texto: >-
              La energía de distorsión, $U_0^d = U_0 - U_0^v$: la total menos
              la que va al cambio de volumen
            correcta: true
            mensaje: |
              Eso es (ec. 6.21). La parte de volumen la produce la componente
              esférica del tensor, y una presión hidrostática no hace fallar a
              un material dúctil: por eso se quita.
          - texto: La energía total $U_0$, tal como la da el enunciado
            mensaje: |
              Con la total, una presión hidrostática grande tendría tensión
              equivalente y haría fallar al material, y no lo hace. El
              criterio se queda solo con la distorsión.
          - texto: La energía de cambio de volumen $U_0^v$
            mensaje: |
              Es justo la que se descarta. Depende solo de
              $\sigma_x + \sigma_y + \sigma_z$, que no distingue un estado de
              cortadura de uno sin tensiones.
          - texto: >-
              Ninguna: von Mises compara la tangencial máxima con la de un
              ensayo de tracción
            mensaje: |
              Ese es el criterio de Tresca (ec. 6.19). Von Mises es el de la
              **energía** de distorsión, y por eso su σeqv lleva las tres
              diferencias de principales, no solo la mayor.
      - tipo: calcular
        titulo: El coeficiente de la energía de volumen
        pregunta: |
          La ec. 6.25 escribe $2U_0^v = k\,(\sigma_x+\sigma_y+\sigma_z)^2$. Con
          $\nu = 0{,}3$, ¿cuánto vale $k\cdot E$?
        respuesta:
          tipo: numero
          valor: '0.133333'
          tolerancia: 0.001
          formato: un número (k multiplicado por E)
        distractores:
          - valor: '1.2'
            mensaje: |
              Ese es el coeficiente de $\sigma_e^2$, $3(1-2\nu)/E$. Al pasar a
              $(\sigma_x+\sigma_y+\sigma_z)^2 = 9\sigma_e^2$ hay que dividir
              entre 9: queda $(1-2\nu)/3E$.
          - valor: '0.4'
            mensaje: |
              Te falta el 3 del denominador. La componente esférica es la
              **media** de las tres normales, $\sigma_e = \tfrac13(\sigma_x+\sigma_y+\sigma_z)$,
              y al elevarla al cuadrado sale un 9 que deja $(1-2\nu)/3$.
        pista: |
          Con las tres normales iguales a $\sigma_e$ y sin tangenciales, la
          ec. 6.23 da $2U_0^v = 3(1-2\nu)\sigma_e^2/E$.
        desarrollo: |
          $$
          2U_0^v = \frac{1}{E}\left[3\sigma_e^2 - 2\nu\cdot3\sigma_e^2\right]
          = \frac{3(1-2\nu)}{E}\,\sigma_e^2
          = \frac{1-2\nu}{3E}\,(\sigma_x+\sigma_y+\sigma_z)^2
          $$

          y con $\nu = 0{,}3$, $k\cdot E = 0{,}4/3 = 0{,}1333$.
      - tipo: calcular
        titulo: La cortadura pura
        pregunta: |
          Con la expresión que se deduce, ¿cuánto vale $\sigma_{eqv}$ en
          cortadura pura ($\tau_{xy} = \tau$ y todo lo demás nulo), en
          unidades de $\tau$?
        respuesta:
          tipo: numero
          valor: '1.732051'
          tolerancia: 0.001
          formato: un número, en unidades de τ (vale sqrt(3))
        distractores:
          - valor: '2'
            mensaje: |
              Ese es el de Tresca, $\sigma_1 - \sigma_3 = 2\tau$. Von Mises da
              algo menos: $\sqrt{3}\,\tau$, y por eso Tresca queda del lado de
              la seguridad (figura 6.5).
          - valor: '2.449490'
            mensaje: |
              Te ha faltado el $\tfrac12$ de la ec. 6.28: con él,
              $\sigma_{eqv}^2 = \tfrac12\cdot6\tau^2 = 3\tau^2$. Sin él sale
              $\sqrt6\,\tau$. Ese $\tfrac12$ viene de igualar con el estado
              uniaxial, que da $2\sigma_{eqv}^2$ entre las tres diferencias.
        pista: |
          Principales $\tau$, 0 y $-\tau$, o directamente la ec. 6.30 con
          $\sigma_x = \sigma_y = 0$.
        desarrollo: |
          $$
          \sigma_{eqv} = \sqrt{\sigma_x^2 - \sigma_x\sigma_y + \sigma_y^2 + 3\tau_{xy}^2} = \sqrt3\,\tau
          $$

          Es la relación que se usa para el límite a cortadura de un material
          dúctil: $\tau_e = \sigma_e/\sqrt3 \approx 0{,}577\,\sigma_e$.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción como en el examen: de U0 a la energía de
          distorsión, y de ahí a σeqv.
        rubrica:
          - punto: >-
              Se separa U0 = U0v + U0d, y se dice que el criterio iguala la
              energía de distorsión U0d (ecs. 6.20 y 6.21).
            porque: >-
              Es la idea del criterio. Sin ella, la deducción iguala energías
              totales y el resultado está mal.
            minimo: true
          - punto: >-
              Se escribe 2U0 en función de las tensiones, sustituyendo Hooke
              en la expresión del enunciado (ec. 6.23).
            porque: >-
              El enunciado da U0 con tensiones y deformaciones mezcladas; hay
              que dejarla solo en tensiones para poder comparar.
            minimo: true
          - punto: >-
              Se calcula U0v con la componente esférica σe = (σx + σy + σz)/3
              (ecs. 6.24 y 6.25).
            porque: >-
              Es la parte que se quita. Tomar las tres normales iguales a σe y
              las tangenciales nulas es lo que la define.
            minimo: true
          - punto: >-
              Se resta: 2U0d = (1 + ν)/3E·[(σx − σy)² + (σy − σz)² + (σz − σx)²]
              + (τxy² + τyz² + τzx²)/G (ec. 6.26).
            porque: >-
              Es la cuenta larga del ejercicio; conviene llegar a las
              diferencias al cuadrado, que es la forma que se iguala después.
          - punto: >-
              Se aplica al estado equivalente, solo σx = σeqv:
              2U0d = 2(1 + ν)σeqv²/3E (ec. 6.27).
            porque: >-
              Es la definición de tensión equivalente: el estado uniaxial con
              la misma energía de distorsión.
            minimo: true
          - punto: >-
              Igualando se llega a σeqv = √{½[(σx − σy)² + (σy − σz)² +
              (σz − σx)²] + 3(τxy² + τyz² + τzx²)} (ec. 6.28), y en
              principales a la ec. 6.29.
            porque: >-
              Es la respuesta. El 3 de las tangenciales sale de G = E/2(1 + ν):
              1/G = 2(1 + ν)/E, y al multiplicar por 3E/2(1 + ν) queda 3.
            minimo: true
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              $U_0 = U_0^v + U_0^d$; el criterio iguala la energía de
              distorsión del estado real y del equivalente.
          - texto: >-
              Con Hooke, $2U_0 = \frac1E[\sigma_x^2+\sigma_y^2+\sigma_z^2
              - 2\nu(\sigma_x\sigma_y+\sigma_y\sigma_z+\sigma_z\sigma_x)]
              + \frac1G(\tau_{xy}^2+\tau_{yz}^2+\tau_{zx}^2)$.
          - texto: >-
              La parte de volumen, con $\sigma_e$ en las tres normales:
              $2U_0^v = \frac{1-2\nu}{3E}(\sigma_x+\sigma_y+\sigma_z)^2$.
          - texto: >-
              Restando y aplicando al estado con solo $\sigma_x = \sigma_{eqv}$,
              que da $2U_0^d = \frac{2(1+\nu)}{3E}\sigma_{eqv}^2$, se llega a la
              ec. 6.28.
          - texto: >-
              La energía de volumen también se iguala, porque una presión
              hidrostática alta hace fallar a un material dúctil.
            trampa: true
            mensaje: |
              Es al revés: se quita **porque** una presión hidrostática no lo
              hace fallar. Si se igualara la energía total, un estado esférico
              tendría tensión equivalente, y en la ec. 6.28 no la tiene: con
              las tres normales iguales y sin tangenciales, $\sigma_{eqv} = 0$.
    resolucion: |
      **La idea.** El criterio de von Mises dice que se falla cuando la
      energía de **distorsión** alcanza la del ensayo de tracción en el
      límite. La energía total se parte en dos (apuntes del tema 6, ecs. 6.20
      y 6.21, p. 10):

      $$
      U_0 = U_0^v + U_0^d \qquad\Longrightarrow\qquad U_0^d = U_0 - U_0^v
      $$

      La de cambio de volumen, $U_0^v$, la produce la componente esférica, y
      no hace fallar a un material dúctil: se quita.

      **$U_0$ en tensiones.** Sustituyendo Hooke ($\varepsilon_x = [\sigma_x -
      \nu(\sigma_y+\sigma_z)]/E$, $\gamma = \tau/G$) en la expresión del
      enunciado (ec. 6.23):

      $$
      2U_0 = \frac1E\left[\sigma_x^2+\sigma_y^2+\sigma_z^2
      - 2\nu(\sigma_x\sigma_y+\sigma_y\sigma_z+\sigma_z\sigma_x)\right]
      + \frac1G\left(\tau_{xy}^2+\tau_{yz}^2+\tau_{zx}^2\right)
      $$

      **La parte de volumen.** Con las tres normales iguales a
      $\sigma_e = \tfrac13(\sigma_x+\sigma_y+\sigma_z)$ y sin tangenciales
      (ecs. 6.24 y 6.25):

      $$
      2U_0^v = \frac{3(1-2\nu)}{E}\sigma_e^2 = \frac{1-2\nu}{3E}(\sigma_x+\sigma_y+\sigma_z)^2
      $$

      **La distorsión**, restando (ec. 6.26):

      $$
      2U_0^d = \frac{1+\nu}{3E}\left[(\sigma_x-\sigma_y)^2+(\sigma_y-\sigma_z)^2+(\sigma_z-\sigma_x)^2\right]
      + \frac1G\left(\tau_{xy}^2+\tau_{yz}^2+\tau_{zx}^2\right)
      $$

      **El estado equivalente**, solo $\sigma_x = \sigma_{eqv}$ (ec. 6.27):
      $2U_0^d = \dfrac{2(1+\nu)}{3E}\,\sigma_{eqv}^2$. Igualando, y con
      $1/G = 2(1+\nu)/E$ (ec. 6.28, p. 11):

      $$
      \sigma_{eqv} = \sqrt{\tfrac12\left[(\sigma_x-\sigma_y)^2+(\sigma_y-\sigma_z)^2+(\sigma_z-\sigma_x)^2\right]
      + 3\left(\tau_{xy}^2+\tau_{yz}^2+\tau_{zx}^2\right)}
      $$

      En direcciones principales (ec. 6.29),
      $\sigma_{eqv} = \sqrt{\tfrac12[(\sigma_1-\sigma_2)^2+(\sigma_2-\sigma_3)^2+(\sigma_3-\sigma_1)^2]}$,
      y en tensión plana (ec. 6.30),
      $\sigma_{eqv} = \sqrt{\sigma_x^2-\sigma_x\sigma_y+\sigma_y^2+3\tau_{xy}^2}$.

      **Comprobación.** Con un tensor cualquiera, la $U_0$ del motor del curso
      menos la $U_0^v$ de la ec. 6.25 da exactamente
      $(1+\nu)\sigma_{eqv}^2/3E$ con la $\sigma_{eqv}$ de la ec. 6.28. En
      cortadura pura sale $\sigma_{eqv} = \sqrt3\,\tau$, menos que los
      $2\tau$ de Tresca.

  # ── Teoría · pregunta 4 · el depósito con dos galgas. Va en la hoja de
  #    teoría, pero es un cálculo (p0 la cuenta como problema).
  - id: exerm1920-1par-4-el-deposito-con-dos-galgas
    titulo: La presión de un depósito y su coeficiente de Poisson, con dos galgas
    fuente: >-
      Pregunta 4 de teoría · Primer parcial del 15 de noviembre de 2019 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1 punto. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes de los temas 3, 4 y 8.
    nivel: examen
    enunciado: |
      (1p) El depósito de la figura almacena aire comprimido. En la superficie
      exterior se colocan dos galgas extensométricas, siendo las deformaciones
      registradas: $\varepsilon_a$=80·10⁻⁶ $\varepsilon_b$ = 275·10⁻⁶

      Si el tanque tiene una razón de radio/espesor r/e=25 y E=200GPa,
      determinar la presión del aire $p$ y el coeficiente de Poisson υ.

      <figure class="figura-examen">
      <svg viewBox="20 18 320 168" role="img" width="320" height="168"
           aria-labelledby="exerm1920-1par-4-deposito-t exerm1920-1par-4-deposito-d">
        <title id="exerm1920-1par-4-deposito-t">El depósito cilíndrico con las galgas a y b</title>
        <desc id="exerm1920-1par-4-deposito-d">Un depósito cilíndrico de eje horizontal, visto de lado, con la tapa de la derecha. Sobre su superficie, dos galgas que salen de un mismo punto: la a, según el eje del cilindro, hacia la derecha; la b, inclinada hacia arriba a la derecha, forma 60 grados con la recta de la a.</desc>
        <path d="M40 30 H300 M40 162 H300" stroke="var(--ink)" stroke-width="2" fill="none"/>
        <rect x="40" y="30" width="260" height="132" fill="var(--faint)" fill-opacity=".18" stroke="none"/>
        <path d="M40 30 A18 66 0 0 0 40 162" stroke="var(--ink)" stroke-width="1.2" fill="none"/>
        <ellipse cx="300" cy="96" rx="18" ry="66" fill="var(--paper)" fill-opacity=".6" stroke="var(--ink)" stroke-width="1.2"/>
        <line x1="150" y1="122" x2="255" y2="122" stroke="var(--ink)" stroke-width="1"/>
        <line x1="150" y1="122" x2="198" y2="38.9" stroke="var(--ink)" stroke-width="1"/>
        <rect x="182" y="116" width="40" height="12" rx="1.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4" transform="rotate(0 202 122)"/><path d="M188 120 H216 M188 124 H216" stroke="var(--ink)" stroke-width=".8" fill="none" transform="rotate(0 202 122)"/>
        <rect x="158" y="67.5" width="40" height="12" rx="1.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4" transform="rotate(-60 178 73.5)"/><path d="M164 71.5 H192 M164 75.5 H192" stroke="var(--ink)" stroke-width=".8" fill="none" transform="rotate(-60 178 73.5)"/>
        <text x="202" y="146" text-anchor="middle" font-size="15" fill="var(--ink)">a</text>
        <text x="156" y="67.5" text-anchor="middle" font-size="15" fill="var(--ink)">b</text>
        <path d="M184 122 A34 34 0 0 0 167 92.6" fill="none" stroke="var(--live)" stroke-width="1.2"/>
        <text x="209.7" y="98.8" text-anchor="middle" font-size="13" fill="var(--live)">60°</text>
      </svg>
      <figcaption>

      Redibujada del enunciado. El original marca los **60°** entre la recta de la galga **a** (el eje del depósito) y la de la **b**, sin arco; el arco es nuestro. El original dibuja la b a unos 42°: manda el rótulo.

      </figcaption>
      </figure>

      **Notas nuestras.** La galga a va según el eje del depósito y la b
      forma 60° con ella, que es donde la figura pone el rótulo. Se trata como
      depósito de pared delgada, y en la superficie exterior la tensión
      radial es nula (apuntes del tema 8, p. 10).
    pide: >-
      La deformación circunferencial, ν y la presión p, en MPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué tensiones hay en el punto de las galgas?
        opciones:
          - texto: >-
              $\sigma_\theta = pr/e$ en la dirección circunferencial y
              $\sigma_x = pr/2e$ en la del eje, sin tangenciales: esas dos
              direcciones son principales
            correcta: true
            mensaje: |
              Eso es (ecs. 8.16 y 8.17). Por la simetría del depósito, los
              ejes axial y circunferencial son principales, y en la superficie
              exterior la tercera, la radial, es nula: tensión plana con
              $\gamma_{x\theta} = 0$.
          - texto: >-
              $\sigma_x = pr/e$ en la dirección del eje y
              $\sigma_\theta = pr/2e$ en la circunferencial
            mensaje: |
              Están cambiadas. La circunferencial es la grande: el corte
              longitudinal tiene que sostener la presión sobre todo un
              diámetro con solo dos espesores (ec. 8.16). El corte transversal
              reparte $p\pi r^2$ en todo el perímetro $2\pi r e$ y sale la
              mitad (ec. 8.17).
          - texto: >-
              $\sigma = pr/2e$ en todas las direcciones del plano
            mensaje: |
              Esa es la esfera (ec. 8.15), con los dos radios de curvatura
              iguales. En el cilindro uno de los radios es infinito y las
              tensiones no son iguales.
          - texto: >-
              Hay una tangencial, porque la galga b está inclinada
            mensaje: |
              La galga mide en una dirección; no crea tensiones. Las
              tangenciales en los planos axial y circunferencial son nulas por
              simetría, y la b mide una mezcla de las dos deformaciones
              principales.
      - tipo: calcular
        titulo: La deformación circunferencial
        pregunta: |
          A partir de las dos galgas, ¿cuánto vale la deformación
          circunferencial $\varepsilon_\theta$, en unidades de 10⁻⁶?
        respuesta:
          tipo: numero
          valor: '340'
          tolerancia: 0.5
          formato: un número, en unidades de 10⁻⁶
        distractores:
          - valor: '275'
            mensaje: |
              Has tomado la galga b como si midiera la circunferencial. Está a
              60° del eje, no a 90°: mide una mezcla de $\varepsilon_x$ y
              $\varepsilon_\theta$.
        pista: |
          Ec. 3.55 con los ejes del depósito, que son principales:
          $\varepsilon_b = \varepsilon_a\cos^2 60^\circ + \varepsilon_\theta\sin^2 60^\circ$.
        desarrollo: |
          $$
          275 = 80\cdot\tfrac14 + \varepsilon_\theta\cdot\tfrac34
          \;\Longrightarrow\; \varepsilon_\theta = \frac{275 - 20}{0{,}75}\cdot10^{-6} = 340\cdot10^{-6}
          $$
      - tipo: calcular
        titulo: El coeficiente de Poisson
        pregunta: |
          ¿Cuánto vale $\nu$?
        respuesta:
          tipo: numero
          valor: '0.3'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '0.2447'
            mensaje: |
              Sale de usar $\varepsilon_\theta = \varepsilon_b = 275\cdot10^{-6}$,
              es decir, de tomar la galga b como circunferencial. Primero hay
              que sacar $\varepsilon_\theta = 340\cdot10^{-6}$ con la ec. 3.55.
          - valor: '3.3333'
            mensaje: |
              Un $\nu$ mayor que 0,5 es imposible (ec. 4.18), y avisa de un
              error: has cambiado las dos tensiones, $\sigma_x = pr/e$ y
              $\sigma_\theta = pr/2e$. Es al revés.
        pista: |
          El cociente $\varepsilon_\theta/\varepsilon_x$ no depende de $p$:
          $\dfrac{1-\nu/2}{1/2-\nu} = \dfrac{340}{80}$.
        desarrollo: |
          Con $\sigma_\theta = 2\sigma_x = pr/e$ y Hooke (ec. 4.2):

          $$
          \varepsilon_x = \frac{pr}{eE}\left(\tfrac12 - \nu\right), \qquad
          \varepsilon_\theta = \frac{pr}{eE}\left(1 - \tfrac{\nu}{2}\right)
          $$

          $$
          \frac{1-\nu/2}{1/2-\nu} = 4{,}25 \;\Longrightarrow\;
          1 - 0{,}5\nu = 2{,}125 - 4{,}25\nu \;\Longrightarrow\; \nu = \frac{1{,}125}{3{,}75} = 0{,}3
          $$
      - tipo: calcular
        titulo: La presión
        pregunta: |
          ¿Cuánto vale la presión $p$, en MPa?
        respuesta:
          tipo: numero
          valor: '3.2'
          tolerancia: 0.01
          formato: un número, en MPa
        distractores:
          - valor: '2.72'
            mensaje: |
              Has usado Hooke de una dimensión, $\varepsilon_\theta = \sigma_\theta/E$,
              y te has dejado la contracción que provoca $\sigma_x$. En tensión
              plana $\varepsilon_\theta = (\sigma_\theta - \nu\sigma_x)/E$.
          - valor: '0.0032'
            mensaje: |
              Es la presión en GPa, porque has puesto $E = 200$. En MPa,
              $E = 2\cdot10^5$ MPa y $p = 3{,}2$ MPa.
        pista: |
          De la galga a: $\varepsilon_x = \dfrac{pr}{eE}(0{,}5 - \nu)$, con
          $r/e = 25$ y $E = 2\cdot10^5$ MPa.
        desarrollo: |
          $$
          80\cdot10^{-6} = \frac{25\,p}{2\cdot10^5}\,(0{,}5 - 0{,}3)
          \;\Longrightarrow\; p = \frac{80\cdot10^{-6}\cdot2\cdot10^5}{25\cdot0{,}2} = 3{,}2\ \text{MPa}
          $$

          Con ella, $\sigma_\theta = 80$ MPa y $\sigma_x = 40$ MPa.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En la superficie, $\sigma_\theta = pr/e$ y $\sigma_x = pr/2e$,
              principales, y $\sigma_r = 0$.
          - texto: >-
              La galga b, con la ec. 3.55:
              $\varepsilon_b = \varepsilon_x\cos^2 60^\circ + \varepsilon_\theta\sin^2 60^\circ$,
              y de ahí $\varepsilon_\theta = 340\cdot10^{-6}$.
          - texto: >-
              Con Hooke, $\varepsilon_\theta/\varepsilon_x = (1-\nu/2)/(1/2-\nu) = 4{,}25$,
              luego $\nu = 0{,}3$.
          - texto: >-
              De la galga a, $p = \dfrac{\varepsilon_a E}{(r/e)(0{,}5-\nu)} = 3{,}2$ MPa.
          - texto: >-
              Como la galga b está inclinada, hay que incluir un
              $\gamma_{x\theta}$ desconocido, y con dos galgas el problema no
              se puede resolver.
            trampa: true
            mensaje: |
              Los ejes axial y circunferencial son principales por simetría:
              $\gamma_{x\theta} = 0$. Por eso bastan dos galgas, y por eso la
              b sirve para sacar $\varepsilon_\theta$.
    resolucion: |
      **Las tensiones** (apuntes del tema 8, ecs. 8.16 y 8.17, p. 10). En un
      cilindro de pared delgada, con $x$ según el eje y $\theta$ en la
      circunferencia:

      $$
      \sigma_\theta = \frac{pr}{e}, \qquad \sigma_x = \frac{pr}{2e}, \qquad \sigma_r = 0
      $$

      ($\sigma_r = 0$ en la superficie exterior). Las direcciones $x$ y
      $\theta$ son principales: $\gamma_{x\theta} = 0$.

      **La galga b** (tema 3, ec. 3.55, p. 17), a 60° del eje:

      $$
      \varepsilon_b = \varepsilon_x\cos^2 60^\circ + \varepsilon_\theta\sin^2 60^\circ
      \;\Longrightarrow\;
      \varepsilon_\theta = \frac{275 - 80/4}{3/4}\cdot10^{-6} = 340\cdot10^{-6}
      $$

      **Hooke** en tensión plana (tema 4, ec. 4.2), con $\sigma_\theta = 2\sigma_x$:

      $$
      \varepsilon_x = \frac{pr}{eE}\left(\tfrac12 - \nu\right) = 80\cdot10^{-6}, \qquad
      \varepsilon_\theta = \frac{pr}{eE}\left(1 - \tfrac{\nu}{2}\right) = 340\cdot10^{-6}
      $$

      **El coeficiente de Poisson**, del cociente, que no depende de $p$:

      $$
      \frac{1-\nu/2}{1/2-\nu} = \frac{340}{80} = 4{,}25 \;\Longrightarrow\; \boxed{\nu = 0{,}3}
      $$

      **La presión**, de la galga a:

      $$
      p = \frac{\varepsilon_a\,E}{(r/e)(0{,}5-\nu)} = \frac{80\cdot10^{-6}\cdot2\cdot10^{5}}{25\cdot0{,}2}
      \;\Longrightarrow\; \boxed{p = 3{,}2\ \text{MPa}}
      $$

      con $\sigma_\theta = 80$ MPa y $\sigma_x = 40$ MPa.

      **Comprobación.** Con $p = 3{,}2$ MPa y $\nu = 0{,}3$, el motor del curso
      (el depósito de la ec. 8.16, Hooke y la galga a 60°) devuelve
      exactamente $80\cdot10^{-6}$ y $275\cdot10^{-6}$.

      **La otra lectura del ángulo.** Si los 60° se midieran desde la
      circunferencia (la b a 30° del eje), saldría
      $\varepsilon_\theta = 860\cdot10^{-6}$, $\nu = 0{,}427$ y $p = 8{,}75$
      MPa. La figura pone el rótulo entre la recta de a y la de b, y es la
      lectura que da números redondos, $\nu = 0{,}3$ y $p = 3{,}2$ MPa: por eso
      se toma la del eje.

  # ── Problema 1 · la chapa hexagonal: Mohr con una cara de τ máxima.
  - id: exerm1920-1par-5-la-chapa-hexagonal
    titulo: Una chapa hexagonal en tensión plana, sus tres círculos de Mohr y sus principales
    fuente: >-
      Problema 1 · Primer parcial del 15 de noviembre de 2019 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 2 puntos. El examen no publica resolución; el desarrollo es nuestro
      y sigue los apuntes del tema 2, pp. 21-27.
    nivel: examen
    enunciado: |
      (2p) Una chapa de acero de 1 mm de espesor y forma hexagonal
      experimenta un estado tensional plano y uniforme en todos sus puntos,
      provocado por ciertas fuerzas de superficie aplicadas a cada uno de sus
      lados. Sabiendo que:

      - sobre un lado, la componente normal es nula y la tangencial 100 MPa
      - sobre otro de ellos, actúa la componente tangencial máxima

      Se pide:

      1) Representar los tres círculos de Mohr de tensión y determinar las
      componentes intrínsecas de los vectores tensión que actúan en las seis
      caras del hexágono.

      2) Calcular las tensiones y direcciones principales, y dibujarlas sobre
      la pieza identificando los planos sobre los que actúan.

      <figure class="figura-examen">
      <svg viewBox="20 30 330 220" role="img" width="330" height="220"
           aria-labelledby="exerm1920-1par-5-hexagono-t exerm1920-1par-5-hexagono-d">
        <title id="exerm1920-1par-5-hexagono-t">La chapa hexagonal, con lo que se sabe de cada lado</title>
        <desc id="exerm1920-1par-5-hexagono-d">Un hexágono regular con los lados de arriba y de abajo horizontales. Sobre el lado de arriba, el rótulo 100 MPa. Junto al lado de arriba a la derecha, el rótulo tau max, sigma interrogación. Junto a los otros cuatro lados, un signo de interrogación. Aparte, abajo a la izquierda, los ejes x hacia la derecha e y hacia arriba.</desc>
        <path d="M249 128 L212 63.9 L138 63.9 L101 128 L138 192.1 L212 192.1 Z" fill="var(--faint)" fill-opacity=".12" stroke="var(--ink)" stroke-width="2"/>
        <text x="175" y="47.9" text-anchor="middle" font-size="14" fill="var(--ink)">100 MPa</text>
        <text x="242.1" y="87" text-anchor="start" font-size="14" fill="var(--ink)">τ<tspan font-size="10" dy="3">max</tspan><tspan dy="-3">; σ?</tspan></text>
        <text x="105.6" y="93" text-anchor="middle" font-size="15" fill="var(--ink)">?</text>
        <text x="105.6" y="173" text-anchor="middle" font-size="15" fill="var(--ink)">?</text>
        <text x="175" y="213.1" text-anchor="middle" font-size="15" fill="var(--ink)">?</text>
        <text x="244.4" y="173" text-anchor="middle" font-size="15" fill="var(--ink)">?</text>
        <line x1="30" y1="236" x2="67" y2="236" stroke="var(--ink)" stroke-width="1.2"/>
        <polygon points="74,236 67,239.2 67,232.9" fill="var(--ink)"/><line x1="30" y1="236" x2="30" y2="199" stroke="var(--ink)" stroke-width="1.2"/>
        <polygon points="30,192 33.2,199 26.9,199" fill="var(--ink)"/>
        <text x="78" y="240" text-anchor="start" font-size="13" font-style="italic" fill="var(--ink)">x</text><text x="34" y="192" text-anchor="start" font-size="13" font-style="italic" fill="var(--ink)">y</text>
      </svg>
      <figcaption>

      Redibujada del enunciado. Los ejes **x** e **y** son nuestros (el original no los dibuja): con ellos, la cara de arriba tiene la normal en **y** y la de τ máxima, a **30°** de x.

      </figcaption>
      </figure>

      **Notas nuestras.** El hexágono se toma regular, como lo dibuja la
      figura. Los ejes son nuestros: x horizontal e y vertical, así que la
      cara de los 100 MPa tiene la normal en y y la de τ máxima, a 30° de x.
      La tangencial de la cara de los 100 MPa se toma positiva con el
      convenio de los apuntes ($\tau_n = \vec S_n\cdot\hat t$, ec. 2.58):
      $\tau_n = +100$ MPa, es decir, $\tau_{xy} = -100$ MPa. Con el signo
      contrario todas las tensiones cambian de signo; lo dice la resolución.
      El espesor y el material no intervienen.
    pide: >-
      Los tres círculos de Mohr, σn y τn en las seis caras, las tres
      tensiones principales y sus direcciones dibujadas sobre la chapa.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dice de una cara que sobre ella actúe la tangencial máxima?
        opciones:
          - texto: >-
              Que su normal forma 45° con las direcciones principales: en el
              círculo es el punto más alto (o más bajo), y su $\sigma_n$ es la
              del centro
            correcta: true
            mensaje: |
              Eso es (ec. 2.64 y figura 2.12). Con eso la cara de τ máxima da
              el centro del círculo, y la de los 100 MPa, que está a 60° de
              ella en la chapa, da el radio.
          - texto: Que su tensión normal es nula
            mensaje: |
              En el plano de τ máxima la normal vale
              $\sigma_C = (\sigma_x+\sigma_y)/2$, que solo es cero si el
              centro del círculo está en el origen. Aquí la cara con
              $\sigma_n = 0$ es la otra, la de los 100 MPa.
          - texto: Que es un plano principal
            mensaje: |
              Al revés: en un plano principal la tangencial es **nula**
              (ec. 2.62). El de τ máxima está a 45° de los principales.
          - texto: Que la tangencial máxima vale 100 MPa
            mensaje: |
              Los 100 MPa son de **otra** cara. La tangencial máxima es el
              radio del círculo, que hay que calcular: la cara de los 100 MPa
              no está en lo alto del círculo.
      - tipo: calcular
        titulo: El radio del círculo
        pregunta: |
          La cara de los 100 MPa y la de τ máxima están a 60° en la chapa.
          ¿Cuánto vale el radio $R$ del círculo de Mohr del plano, en MPa?
        respuesta:
          tipo: numero
          valor: '200'
          tolerancia: 0.5
          formato: un número, en MPa
        distractores:
          - valor: '100'
            mensaje: |
              Has tomado los 100 MPa como la tangencial máxima. Son de una
              cara que está a 60° de la de τ máxima: en el círculo, a 120° del
              punto más alto, donde $|\tau_n| = R\,|\cos120^\circ| = R/2$.
        pista: |
          60° en la chapa son 120° en el círculo. Desde el punto más alto
          $(\sigma_C, R)$, el punto a 120° tiene $|\tau_n| = R/2$.
        desarrollo: |
          $$
          |\tau_n| = R\,|\cos 120^\circ| = \frac{R}{2} = 100 \;\Longrightarrow\; R = 200\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La normal en la cara de τ máxima
        pregunta: |
          ¿Cuánto vale $\sigma_n$ en la cara de τ máxima, en MPa?
        respuesta:
          tipo: numero
          valor: '173.205'
          tolerancia: 0.5
          formato: un número, en MPa (vale 100·sqrt(3))
        distractores:
          - valor: '0'
            mensaje: |
              En el plano de τ máxima la normal no es nula: vale lo que el
              centro del círculo. La cara con $\sigma_n = 0$ es la de los
              100 MPa.
          - valor: '200'
            mensaje: |
              Ese es el radio. La $\sigma_n$ de la cara de τ máxima es la
              abscisa del **centro**, y la cara de los 100 MPa, con
              $\sigma_n = 0$, está a $R\sin120^\circ$ de él en horizontal:
              $\sigma_C = R\sin120^\circ$, no $R$.
        pista: |
          La cara de los 100 MPa está en $\sigma_n = 0$, a una distancia
          horizontal $R\sin120^\circ$ del centro.
        desarrollo: |
          $$
          0 = \sigma_C - R\sin 120^\circ \;\Longrightarrow\; \sigma_C = 200\cdot\frac{\sqrt3}{2} = 100\sqrt3 = 173{,}2\ \text{MPa}
          $$

          En los ejes de la nota: $\sigma_y = 0$, $\tau_{xy} = -100$ y
          $\sigma_x = 2\sigma_C = 200\sqrt3 = 346{,}4$ MPa.
      - tipo: calcular
        titulo: La tercera pareja de caras
        pregunta: |
          ¿Cuánto vale $\sigma_n$ en las dos caras que quedan (la de abajo a la
          derecha y la de arriba a la izquierda, normal a −30°), en MPa?
        respuesta:
          tipo: numero
          valor: '346.41'
          tolerancia: 0.5
          formato: un número, en MPa (vale 200·sqrt(3))
        distractores:
          - valor: '173.205'
            mensaje: |
              Esa es la de τ máxima. La cara de −30° está a 60° de ella en la
              chapa y a 120° en el círculo: en
              $\sigma_C + R\sin120^\circ$, el lado derecho del círculo.
          - valor: '0'
            mensaje: |
              Esa es la cara de los 100 MPa. La de −30° está al otro lado del
              centro, a la misma altura: $\sigma_n = 2\sigma_C$.
        pista: |
          Ec. 2.61 con $\theta = -30^\circ$, o en el círculo: el simétrico del
          punto de la cara de 90° respecto de la vertical del centro.
        desarrollo: |
          $$
          \sigma_n = \sigma_C + \frac{\sigma_x-\sigma_y}{2}\cos(-60^\circ) + \tau_{xy}\sin(-60^\circ)
          = 173{,}2 + 86{,}6 + 86{,}6 = 346{,}4\ \text{MPa}
          $$

          $$
          \tau_n = \frac{\sigma_y-\sigma_x}{2}\sin(-60^\circ) + \tau_{xy}\cos(-60^\circ) = 150 - 50 = 100\ \text{MPa}
          $$
      - tipo: dibujar
        consigna: |
          En papel: **los tres círculos de Mohr**, con las tres caras distintas
          del hexágono marcadas sobre el mayor.
        comprueba:
          - punto: |
              **Las tres principales en el eje**: $\sigma_1 \approx 373$,
              $\sigma_2 = 0$ (la de z) y $\sigma_3 \approx -27$ MPa.
            porque: |
              Los círculos se apoyan en las principales; en tensión plana una
              es cero, y aquí queda **en medio**, porque las del plano tienen
              signos distintos.
          - punto: |
              **El círculo mayor es el del plano**, entre $\sigma_3$ y
              $\sigma_1$, centro $100\sqrt3$ y radio 200; dentro, el de 0 a
              $\sigma_1$ y el pequeño de $\sigma_3$ a 0.
            porque: |
              Como el cero está entre las dos del plano, la tangencial máxima
              absoluta es la del plano, 200 MPa. Si las dos fueran del mismo
              signo, el mayor sería otro.
          - punto: |
              **Las caras sobre el mayor**, a 120° unas de otras: la de 90°
              abajo, en $\sigma_n = 0$ a 100 del eje; la de 30° en lo más
              alto, sobre el centro, a 200; y la de −30° abajo, en
              $\sigma_n = 346{,}4$ a 100 del eje.
            porque: |
              Las caras del hexágono están a 60°, y en el círculo los ángulos
              son dobles; las opuestas caen en el mismo punto. Arriba o abajo
              según el convenio del tema 2, p. 26: arriba, la tangencial de
              par horario (la de 30°, con $\tau_n = -200$).
        figura: |
