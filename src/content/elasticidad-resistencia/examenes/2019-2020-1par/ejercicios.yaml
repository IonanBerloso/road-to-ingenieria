      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La cara de τ máxima está en lo alto del círculo, con
              $\sigma_n = \sigma_C$; la de los 100 MPa, a 60° en la chapa y
              120° en el círculo.
          - texto: >-
              De $|\tau_n| = R/2 = 100$, $R = 200$ MPa; de $\sigma_n = 0$,
              $\sigma_C = R\sin120^\circ = 100\sqrt3$.
          - texto: >-
              Caras: $(0;\ 100)$ las horizontales, $(173{,}2;\ 200)$ las de τ
              máxima y $(346{,}4;\ 100)$ las otras dos.
          - texto: >-
              Principales: $\sigma_1 = 373{,}2$ a $-15^\circ$, $\sigma_2 = 0$
              (z) y $\sigma_3 = -26{,}8$ a $75^\circ$.
          - texto: >-
              Las caras opuestas del hexágono tienen componentes intrínsecas de
              signo contrario, porque su normal es la opuesta.
            trampa: true
            mensaje: |
              Al cambiar la normal cambia también el vector tensión, y con él
              la tangente $\hat t$: $\sigma_n$ y $\tau_n$ salen iguales. Por
              eso las seis caras dan solo tres puntos en el círculo.
    resolucion: |
      **Lectura.** Hexágono regular, x horizontal e y vertical (nota del
      enunciado). Las normales de las caras están a 90° (arriba y abajo),
      30° (arriba a la derecha y abajo a la izquierda) y −30° (abajo a la
      derecha y arriba a la izquierda). Las caras opuestas tienen las mismas
      componentes intrínsecas, así que hay tres puntos distintos en el
      círculo.

      **El círculo del plano** (apuntes del tema 2, ecs. 2.61 a 2.69,
      pp. 23-26). La cara de 30° es la de τ máxima: está en lo alto del
      círculo, $(\sigma_C, R)$, a 45° de las principales (ec. 2.64). La de
      90° está a 60° de ella en la chapa, **120° en el círculo**:

      $$
      |\tau_n| = R\,|\cos120^\circ| = \frac R2 = 100 \;\Rightarrow\; R = 200, \qquad
      \sigma_n = \sigma_C - R\sin120^\circ = 0 \;\Rightarrow\; \sigma_C = 100\sqrt3
      $$

      En los ejes de la nota, $\sigma_y = 0$, $\tau_{xy} = -100$ y
      $\sigma_x = 200\sqrt3 \approx 346{,}4$ MPa: con la ec. 2.63,
      $\tan 2\theta_2 = -(\sigma_x-\sigma_y)/2\tau_{xy} = \sqrt3$ pone la τ
      máxima justo en $\theta_2 = 30^\circ$.

      **Las seis caras** (ec. 2.61, en MPa):

      | normal | caras | $\sigma_n$ | $\tau_n$ |
      |---|---|---|---|
      | 90° | arriba y abajo | 0 | +100 |
      | 30° | arriba a la derecha, abajo a la izquierda | $100\sqrt3 \approx 173{,}2$ | −200 (la máxima) |
      | −30° | abajo a la derecha, arriba a la izquierda | $200\sqrt3 \approx 346{,}4$ | +100 |

      **Las principales:**

      $$
      \sigma_1 = \sigma_C + R = 100(2+\sqrt3) \approx 373{,}2\ \text{MPa}, \quad
      \sigma_2 = 0\ (z), \quad
      \sigma_3 = \sigma_C - R = 100(\sqrt3-2) \approx -26{,}8\ \text{MPa}
      $$

      $\sigma_1$ va a $\theta_1 = -15^\circ$ de x ($\tan2\theta_1 = -1/\sqrt3$)
      y $\sigma_3$ a $75^\circ$; las dos a 45° de la cara de τ máxima. La
      tangencial máxima absoluta es $(\sigma_1-\sigma_3)/2 = 200$ MPa, la del
      plano, porque el cero queda en medio.

      **Los tres círculos** (figura 2.14, pp. 27-28): el 1-3, centro $100\sqrt3$ y
      radio 200 (el del plano); el 1-2, centro y radio
      $50(2+\sqrt3) \approx 186{,}6$; el 2-3, centro $-13{,}4$ y radio $13{,}4$.

