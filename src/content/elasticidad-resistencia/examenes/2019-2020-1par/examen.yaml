asignatura: elasticidad-resistencia
curso: '2019-2020'
convocatoria: primer-parcial
fecha: 15 de noviembre de 2019
# El primer parcial de Elasticidad y Resistencia de Materiales del 15 de
# noviembre de 2019: una hoja de TEORÍA con cuatro preguntas de 1 punto y dos
# de PROBLEMAS con tres de 2 puntos (el problema 3 acaba en la segunda, con
# sus apartados y la figura).
#
# El cuadernillo es bilingüe, castellano a la izquierda y euskera a la
# derecha, y se transcribe **solo la columna en castellano**, tal cual, con
# sus puntos impresos. Las dos columnas piden lo mismo en las siete preguntas.
# Lo que hay que saber antes de leer las resoluciones:
#
# 1. **ERRATAS Y GRAFÍAS DEL TEXTO, CONSERVADAS**: «Von Mises» con mayúscula
#    (teoría 3); las dos lecturas de las galgas sin separador entre ellas
#    («εa=80·10⁻⁶ εb = 275·10⁻⁶»), «r/e=25», «E=200GPa» y el coeficiente de
#    Poisson escrito «υ», una ípsilon griega en lugar de la ν (teoría 4; en
#    el Word es un carácter de la fuente Symbol que el PDF no extrae como
#    texto, pero sí dibuja); «(2p)» sin espacio (problema 1) y «(2 p)» con
#    espacio (problema 3).
#
# 2. **LAS FIGURAS SE HAN LEÍDO ASÍ.** En la teoría 4, el rótulo de 60° está
#    entre la recta de la galga a (el eje del depósito) y la de la b: la b va
#    a 60° del eje, aunque el dibujo la trace a unos 42°. Es la lectura que da
#    ν = 0,3 y p = 3,2 MPa; la otra (60° desde la circunferencia) daría
#    ν ≈ 0,43 y p ≈ 8,75 MPa, y se cuenta en la resolución. En el problema 1
#    el hexágono es regular y el sentido de los 100 MPa no se dice: se toma
#    τn = +100 MPa con el convenio de los apuntes, y la resolución dice qué
#    cambia con el otro (todas las normales cambian de signo).
#
# 3. **LA FIGURA DEL PROBLEMA 3 SE HA LEÍDO DEL WORD.** En el PDF sale a medio
#    dibujar: solo la pieza gris ABCD, los pasadores y los rótulos, sin las
#    barras, sin las flechas de P y de q y sin las líneas de cota. En el Word son formas VML; se leyeron
#    sus coordenadas del XML (vml-p3.py en la unidad p2c) y se redibuja con
#    ellas: A articulada a una pared, las dos barras verticales colgadas de un
#    techo 2a por encima de AB, P = 2qa en E y q bajo CD.
#
# 4. **DOS NUMERACIONES EN UN CUADERNILLO.** La teoría va de la 1 a la 4 y los
#    problemas vuelven a empezar en 1. Aquí la teoría son **n 1 a 4** y los
#    problemas **n 5 (Problema 1), 6 (Problema 2) y 7 (Problema 3)**; la
#    `fuente` de cada ejercicio dice el nombre impreso. Ninguna pregunta se
#    parte: cada una es de un solo tema.
#
# 5. **LA PREGUNTA 2 DE LA TEORÍA ES COPIA LITERAL** de la 1 del parcial 1 de
#    2022-2023 (18/11/2022), salvo el corte de las líneas. No se resuelve dos
#    veces: la entrada apunta al ejercicio de ese examen, cuya `fuente` cita
#    el de 2022. Su enunciado de 2019, tal cual:
#
#    2. (1p) Proceso de deformación. En la parte antisimétrica de la
#       transformación, un elemento de longitud se transforma según:
#       d r' = dr + Ω × dr (con flecha de vector sobre los tres). Deducir
#       cuál es la nueva longitud del elemento y explicar qué ocurre cuando
#       las componentes del vector rotación Ω son números pequeños.
#
#    La pregunta 1 de la teoría también había caído palabra por palabra, en
#    el parcial 1 de 2014-2015; ese examen aún no está resuelto en el sitio y
#    aquí se resuelve entera. El enunciado del problema 2 es el mismo que el
#    del parcial de 2020 (20/11/2020), pero la viga es otra (aquí con dos
#    apoyos móviles y uno fijo, allí empotrada): es un ejercicio propio.
#
# El examen no publica resolución ni resultados: todos los desarrollos son
# nuestros, cada cifra calculada con el motor del curso (src/lib/erm) y
# comprobada por un segundo camino.
pdf: 2019-2020-1par.pdf

ejercicios:
  # Teoría · pregunta 1 · las direcciones principales son perpendiculares.
  - id: exerm1920-1par-1-las-direcciones-principales-son-perpendiculares
    tema: t02-tensiones
    n: 1
  # Teoría · pregunta 2 · la rotación de la parte antisimétrica. Copia literal
  # de la pregunta 1 del parcial 1 de 2022-2023: se reutiliza su ejercicio.
  - id: exerm2223-1par-1-la-rotacion-no-cambia-la-longitud
    tema: t03-deformaciones
    n: 2
  # Teoría · pregunta 3 · von Mises desde la energía de distorsión.
  - id: exerm1920-1par-3-von-mises-desde-la-energia-de-distorsion
    tema: t06-teorias-de-fallo
    n: 3
  # Teoría · pregunta 4 · el depósito con dos galgas.
  - id: exerm1920-1par-4-el-deposito-con-dos-galgas
    tema: t08-esfuerzo-axial
    n: 4

  # Problema 1 · la chapa hexagonal.
  - id: exerm1920-1par-5-la-chapa-hexagonal
    tema: t02-tensiones
    n: 5

  # Problema 2 · la viga Gerber con el apoyo fijo en E.
  - id: exerm1920-1par-6-la-gerber-con-el-apoyo-fijo-en-e
    tema: t07-piezas-prismaticas
    n: 6

  # Problema 3 · la pieza en escalón colgada de dos barras.
  - id: exerm1920-1par-7-la-pieza-en-escalon-colgada-de-dos-barras
    tema: t08-esfuerzo-axial
    n: 7

puntosImpresos:
  fuente: Impresos junto a cada pregunta, «(1p)», «(2p)» y «(2 p)», págs. 1 y 2 del enunciado
  reparto:
    - { n: 1, puntos: 1 }
    - { n: 2, puntos: 1 }
    - { n: 3, puntos: 1 }
    - { n: 4, puntos: 1 }
    - { n: 5, puntos: 2 }
    - { n: 6, puntos: 2 }
    - { n: 7, puntos: 2 }
