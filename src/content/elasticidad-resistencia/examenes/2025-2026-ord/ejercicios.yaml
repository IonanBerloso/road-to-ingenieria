      <figcaption>

      Redibujadas de la foto de la hoja: arriba, el prisma visto de lado y
      desde z; abajo, la microfisura. No están a escala. En la hoja el arco
      de 60° sale del propio eje y; aquí sale de una paralela a y por el
      punto donde la traza del plano corta al eje z.

      </figcaption>
      </figure>

      **Notas nuestras.** El prisma mide 200 × 200 mm de sección y 1 m de
      largo, en la dirección z de los cables. La hoja no rotula ninguna
      figura «1b»: la presión es la de las flechas de las caras
      perpendiculares a y en las dos vistas de arriba. El plano de la
      microfisura contiene al eje x (es perpendicular al papel en la vista de
      abajo). Entre «Tensión» y «en» del apartado a hay una marca pequeña,
      que se toma por una marca de lápiz; entre «0.3» y «)» hay otra, que
      tampoco se transcribe. En euskera los apartados b y c van
      juntos en el b, y el d es el c; piden lo mismo.
    pide: >-
      a) La tensión en los cables; b) las tensiones y direcciones principales
      del prisma; c) su variación de volumen; d) el coeficiente de seguridad
      de los cables por Von Mises; y si la tensión tangencial en el plano de
      la microfisura pasa de 15 MPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          La presión comprime el prisma en y. ¿Por qué trabajan los cables, si
          nadie tira de las placas?
        opciones:
          - texto: >-
              Porque, comprimido en y, el prisma se alarga en z por el efecto
              Poisson, separa las placas y estira los cables; ellos, a su vez,
              lo comprimen en z
            correcta: true
            mensaje: |
              Eso es. Es un problema hiperestático: el equilibrio de una placa
              da una ecuación con dos incógnitas (la tensión de los cables y
              la $\sigma_z$ del prisma), y la otra la da la compatibilidad:
              lo que se alarga el prisma en z es lo que se alargan los cables,
              porque miden lo mismo y las placas son rígidas.
          - texto: >-
              Porque la presión sobre el prisma pasa a las placas y de ellas a
              los cables, que la soportan
            mensaje: |
              La presión actúa en las caras perpendiculares a y, y las placas
              están en las caras perpendiculares a z: son lisas, así que no
              reciben nada en y. Si el prisma no se alargara en z, los cables
              no se enterarían.
          - texto: >-
              No trabajan: con las placas lisas el prisma se deforma libre y
              $\sigma_z = 0$
            mensaje: |
              Lisas quiere decir sin rozamiento, sin tensión tangencial en el
              contacto. Pero las placas sí empujan normalmente: los cables
              impiden que se separen libremente, y por eso $\sigma_z \neq 0$.
      - tipo: calcular
        titulo: La tensión en el prisma según z
        pregunta: |
          Con $\sigma_x = 0$ (caras libres) y $\sigma_y = -75$ MPa, ¿cuánto vale
          $\sigma_z$ en el prisma, en MPa?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.005
          formato: un número con su signo, en MPa
        distractores:
          - valor: '-7.5'
            mensaje: |
              Es la que sale con cables rígidos, $\varepsilon_z = 0$, que da
              $\sigma_z = \nu\sigma_y$. Los cables se alargan
              ($NL/EA$): el prisma puede alargarse en z justo lo que
              ellos ceden, y la compresión es mucho menor.
          - valor: '0'
            mensaje: |
              Sin cables, sí. Pero las placas están atadas: el prisma no se
              alarga libre, y la fuerza de los cables lo comprime en z.
          - valor: '-2'
            mensaje: |
              Has puesto la presión también en las caras x: «toda su
              superficie lateral» se refiere a las caras sobre las que actúa,
              las perpendiculares a y, como dibujan las flechas. Las caras x
              están libres, $\sigma_x = 0$.
        pista: |
          Equilibrio de una placa: $8N + \sigma_z a^{2} = 0$. Compatibilidad:
          $\varepsilon_z L = \dfrac{N L}{E_s A_s}$, con
          $\varepsilon_z = \dfrac{\sigma_z - \nu(\sigma_x + \sigma_y)}{E_h}$.
        desarrollo: |
          Con $N = -\sigma_z a^{2}/8$ en la compatibilidad:

          $$
          \frac{\sigma_z + 0{,}1\cdot75}{26\,000} = -\frac{\sigma_z\cdot40\,000}{8\cdot200\,000\cdot100}
          \;\Longrightarrow\;
          \sigma_z\left(\frac{1}{26\,000} + \frac{1}{4\,000}\right) = -\frac{7{,}5}{26\,000}
          $$

          $$
          \sigma_z = -\frac{7{,}5}{1 + 6{,}5}\ \text{MPa} = -1\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La tensión en los cables
        pregunta: |
          ¿Cuánto vale la tensión en cada cable, en MPa?
        respuesta:
          tipo: numero
          valor: '50'
          tolerancia: 0.05
          formato: un número, en MPa
        distractores:
          - valor: '375'
            mensaje: |
              Es la de los cables rígidos: con $\sigma_z = -7{,}5$ MPa, cada
              cable llevaría $7{,}5\cdot40\,000/8 = 37\,500$ N. Los cables
              ceden, y la compatibilidad los descarga casi ocho veces.
          - valor: '100'
            mensaje: |
              Sale de poner la presión también en las caras x, que doblan el
              alargamiento por Poisson. Las caras x están libres: solo las
              perpendiculares a y llevan flechas.
          - valor: '56.6'
            mensaje: |
              Has metido en la compatibilidad un solo cable de 100 mm² que
              lleva toda la fuerza. Son ocho: la fuerza se reparte y la
              rigidez se suma, $8E_sA_s$.
        pista: |
          $N = -\sigma_z a^{2}/8$ y $\sigma_{cable} = N/A_s$.
        desarrollo: |
          $$
          N = \frac{1\ \text{MPa}\cdot40\,000\ \text{mm}^{2}}{8} = 5\,000\ \text{N},\qquad
          \sigma_{cable} = \frac{5\,000\ \text{N}}{100\ \text{mm}^{2}} = 50\ \text{MPa}
          $$

          Comprobación: el cable se alarga
          $\dfrac{50\cdot1\,000}{200\,000} = 0{,}25$ mm, y el prisma,
          $\varepsilon_z L = \dfrac{-1 + 7{,}5}{26\,000}\cdot1\,000 = 0{,}25$ mm.
      - tipo: calcular
        titulo: La variación de volumen del prisma
        pregunta: |
          ¿Cuánto cambia el volumen del prisma, en cm³?
        respuesta:
          tipo: numero
          valor: '-93.54'
          tolerancia: 0.05
          formato: un número con su signo, en cm³
        distractores:
          - valor: '-105.23'
            mensaje: |
              Has usado $(1-\nu)$ donde va $(1-2\nu)$. La deformación
              volumétrica es
              $e = \dfrac{1-2\nu}{E}(\sigma_x + \sigma_y + \sigma_z)$
              (ec. 4.8).
          - valor: '-18.71'
            mensaje: |
              Es $e$ por el volumen de un cubo de 200 mm de lado. El prisma
              mide 1 m de largo: $V = 0{,}2\cdot0{,}2\cdot1\ \text{m}^{3} = 40\,000\ \text{cm}^{3}$.
        pista: |
          $\Delta V = eV$, con $e = \dfrac{1-2\nu}{E}(\sigma_x + \sigma_y + \sigma_z)$.
        desarrollo: |
          $$
          e = \frac{1 - 2\cdot0{,}1}{26\,000}\,(0 - 75 - 1) = -2{,}3385\cdot10^{-3}
          $$

          $$
          \Delta V = eV = -2{,}3385\cdot10^{-3}\cdot40\,000\ \text{cm}^{3} = -93{,}54\ \text{cm}^{3}
          $$

          Si se olvida $\sigma_z$ sale $-92{,}31$ cm³: casi lo mismo, porque
          $\sigma_z$ es pequeña frente a $\sigma_y$.
      - tipo: calcular
        titulo: El coeficiente de seguridad de los cables
        pregunta: |
          Por Von Mises, ¿cuál es el coeficiente de seguridad de los cables?
        respuesta:
          tipo: numero
          valor: '5'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '0.667'
            mensaje: |
              Es el de los cables rígidos, con 375 MPa: pasarían del límite
              elástico. Con la compatibilidad bien planteada la tensión es
              50 MPa.
          - valor: '2.5'
            mensaje: |
              Arrastras los 100 MPa de poner la presión también en las caras
              x. Solo las caras perpendiculares a y están cargadas.
        pista: |
          Un cable está a tracción simple: $\sigma_{eqv} = \sigma_{cable}$, y
          $FS = \sigma_e/\sigma_{eqv}$ (ec. 6.1).
        desarrollo: |
          En tracción simple las tres principales son $(\sigma, 0, 0)$ y la
          ec. 6.29 da $\sigma_{eqv} = \sigma = 50$ MPa:
          $FS = \dfrac{250}{50} = 5$.
      - tipo: calcular
        titulo: La tangencial en el plano de la microfisura
        pregunta: |
          En el plano de la microfisura, ¿cuánto vale la tensión tangencial,
          en MPa (en valor absoluto)?
        respuesta:
          tipo: numero
          valor: '32.04'
          tolerancia: 0.02
          formato: un número positivo, en MPa
        distractores:
          - valor: '37'
            mensaje: |
              Es la tangencial **máxima** del plano yz,
              $(\sigma_z - \sigma_y)/2$, que va a 45°. El plano de la
              microfisura no está a 45°: su normal forma 30° (o 150°) con y.
          - valor: '18.5'
            mensaje: |
              Has usado $\cos 2\theta$ en vez de $\sin 2\theta$:
              $\tau_n = \tfrac12(\sigma_z - \sigma_y)\sin 2\theta$, la
              ec. 2.61 llevada al plano yz con $\theta$ desde y.
          - valor: '64.09'
            mensaje: |
              Te has dejado el 2 de $(\sigma_y - \sigma_z)/2$: el radio del
              círculo de Mohr es la mitad de la diferencia.
        pista: |
          El plano contiene a x, que es principal: todo pasa en el plano yz,
          con $\sigma_y = -75$, $\sigma_z = -1$ y $\tau_{yz} = 0$. La traza
          forma 60° con y, así que la normal forma 150° con y.
        desarrollo: |
          Con la normal a $\theta = 150^{\circ}$ de y, en el plano yz:

          $$
          |\tau_n| = \left|\tfrac12(\sigma_z - \sigma_y)\,\sin 2\theta\right| = 37\cdot\sin 60^{\circ}\ \text{MPa} = 32{,}04\ \text{MPa} > 15\ \text{MPa}
          $$

          Si se lee el ángulo al revés (la normal a 60° de y), $\sin 120^{\circ}$
          da lo mismo. La normal sí cambia: con la normal a 150° de y,
          $\sigma_n = -38 + (-37)\cos 300^{\circ} = -56{,}5$ MPa, y con la
          otra lectura, $-38 + (-37)\cos 120^{\circ} = -19{,}5$ MPa. Lo que se
          pide es la tangencial.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Equilibrio de una placa: $8N = -\sigma_z a^{2}$; compatibilidad:
              el prisma se alarga en z lo mismo que los cables.
          - texto: >-
              Con Hooke, $\sigma_z = -1$ MPa y cada cable lleva 5 kN, 50 MPa.
          - texto: >-
              Las principales del prisma son las de los ejes:
              $\sigma_1 = 0$ (x), $\sigma_2 = -1$ (z) y $\sigma_3 = -75$ MPa
              (y).
          - texto: >-
              $\Delta V = -93{,}54$ cm³, y por Von Mises los cables tienen
              $FS = 5$.
          - texto: >-
              En el plano de la microfisura $|\tau| = 32{,}04$ MPa: pasa de 15
              MPa.
          - texto: >-
              Como las placas son lisas, los cables no trabajan y el prisma
              tiene $\sigma_z = 0$.
            trampa: true
            mensaje: |
              Lisas quiere decir sin tangencial en el contacto. La normal sí
              existe: el prisma se alarga en z por Poisson y los cables lo
              frenan. Sale $\sigma_z = -1$ MPa.
    resolucion: |
      **Los ejes.** El prisma va de placa a placa según z, la dirección de
      los cables; la presión actúa en las caras perpendiculares a y, y las
      perpendiculares a x están libres: $\sigma_x = 0$ y $\sigma_y = -75$
      MPa. Las placas son lisas: no hay tangenciales en el prisma.

      **a) Los cables.** El problema es hiperestático de grado uno. El
      equilibrio de una placa da $8N + \sigma_z a^{2} = 0$. La compatibilidad:
      prisma y cables miden 1 m y van de placa a placa, así que se alargan lo
      mismo. Con la ley de Hooke generalizada (ec. 4.2, apuntes del tema 4,
      p. 4) y el alargamiento de una barra, $NL/EA$:

      $$
      \frac{\sigma_z - \nu_h(\sigma_x + \sigma_y)}{E_h}\,L = \frac{N L}{E_s A_s}
      $$

      Con $N = -\sigma_z a^{2}/8 = -5\,000\,\sigma_z$ (N, con $\sigma_z$ en
      MPa) y $8E_sA_s/a^{2} = 4\,000$ MPa:

      $$
      \sigma_z = -\frac{\nu_h p}{1 + E_h a^{2}/(8E_sA_s)} = -\frac{7{,}5}{1 + 6{,}5}\ \text{MPa} = -1\ \text{MPa}
      $$

      Cada cable lleva $N = 5\,000$ N y trabaja a $\sigma_{cable} = 50$ MPa
      de tracción. Comprobación: los cables se alargan
      $50\cdot1\,000/200\,000 = 0{,}25$ mm, y el prisma,
      $(−1 + 7{,}5)\cdot1\,000/26\,000 = 0{,}25$ mm.

      **b) Las principales del prisma.** No hay tangenciales: los ejes son
      principales.

      $$
      \sigma_1 = 0\ (x),\qquad \sigma_2 = -1\ \text{MPa}\ (z),\qquad \sigma_3 = -75\ \text{MPa}\ (y)
      $$

      **c) El volumen.** Con la ec. 4.8 (p. 6):

      $$
      e = \frac{1 - 2\nu}{E}(\sigma_x + \sigma_y + \sigma_z) = \frac{0{,}8}{26\,000}\cdot(-76) = -2{,}3385\cdot10^{-3}
      $$

      y con $V = 200\cdot200\cdot1\,000 = 4\cdot10^{7}$ mm³,
      $\Delta V = -93\,538$ mm³ $= -93{,}54$ cm³: el prisma pierde volumen.

      **d) Los cables por Von Mises.** A tracción simple,
      $\sigma_{eqv} = 50$ MPa y $FS = 250/50 = 5$.

      **La microfisura.** Su plano contiene al eje x y su traza, en el plano
      yz, forma 60° con y. Como x es principal, basta el estado plano yz
      ($\sigma_y = -75$, $\sigma_z = -1$, $\tau_{yz} = 0$), con su círculo
      de Mohr de centro $-38$ y radio 37 MPa. La normal del plano forma
      $\theta = 150^{\circ}$ con y:

      $$
      |\tau_n| = 37\,|\sin 300^{\circ}|\ \text{MPa} = 32{,}04\ \text{MPa}
      $$

      **Sí se supera** la tensión admisible de cortadura: 32,04 MPa frente a
      15 MPa. La lectura del ángulo no cambia el resultado: con la normal a
      60° de y, $|\sin 120^{\circ}|$ es el mismo número. Ni el radio entero,
      37 MPa, ni la normal en el plano ($\sigma_n = -56{,}5$ MPa con la
      normal a 150° de y, $-19{,}5$ MPa con la otra lectura) cambian la
      conclusión.

      Cada cifra sale del motor del curso (Hooke, el alargamiento de la barra,
      el vector tensión del plano) y de un segundo camino: la fórmula cerrada
      de $\sigma_z$, el equilibrio de la placa, el alargamiento de los dos
      lados y el círculo de Mohr del plano yz.


  # ── Parte 1 · problema 2 · la esfera de radio unidad.
  - id: exerm2526-ord-6-la-esfera-de-radio-unidad
    titulo: La esfera de radio unidad con una transformación lineal, del campo de desplazamientos a los diámetros extremos
    fuente: >-
      Problema 2 de la parte 1 · Examen final del 16 de enero de 2026 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 2 puntos. Transcrito de una foto de la hoja
      impresa. El examen no publica resolución; el desarrollo es nuestro,
      con las matrices del tema 3 (apartados 3.4 y 3.5).
    nivel: examen
    enunciado: |
      (2p) En la esfera de radio unitario representado en la figura
      experimenta una transformación geométrica lineal. El centro de la
      esfera,O (0,0,0), no se desplaza. Las intersecciones de su superficie
      exterior con los ejes de referencia (A, B y C) pasan a ocupar las
      posiciones $A'$, $B'$ y $C'$.

      $$
      \vec{A}' = \begin{Bmatrix} 1{,}001\\ 0{,}002\\ 0{,}001 \end{Bmatrix}\qquad
      \vec{B}' = \begin{Bmatrix} 0{,}002\\ 0{,}998\\ 0 \end{Bmatrix}\qquad
      \vec{C}' = \begin{Bmatrix} -0{,}001\\ 0\\ 1{,}003 \end{Bmatrix}
      $$

      Admitiendo la hipótesis de pequeños desplazamientos, se pide:

      1) Determinar la expresión del campo de desplazamientos
      $\vec{\delta} = u\hat{\imath} + v\hat{\jmath} + w\hat{k}$ sabiendo que
      el punto O no se desplaza y que $u$, $v$ y $w$ son funciones lineales.

      $$
      \begin{aligned}
      u &= c_1x + c_2y + c_3z\\
      v &= c_4x + c_5y + c_6z\\
      w &= c_7x + c_8y + c_9z
      \end{aligned}
      $$

      2) Determinar el tensor  gradiente de desplazamientos.

      3) Calcular la variación de volumen de la esfera.

      4) Determinar el vector de rotación, especificando el giro de sólido
      rígido que experimenta la esfera en radianes y la dirección del eje de
      giro.

      5) Determinar las deformaciones y direcciones principales.

      6) Determinar los diámetros de la esfera que, una vez deformada ésta,
      alcanzan la máxima longitud y la mínima.

