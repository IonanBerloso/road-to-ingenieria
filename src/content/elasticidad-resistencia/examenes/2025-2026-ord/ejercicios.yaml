      <rect x="46" y="250" width="14" height="150" fill="var(--faint)" fill-opacity=".35" stroke="var(--ink)" stroke-width="1.3"/>
      <rect x="330" y="256" width="14" height="140" fill="var(--faint)" fill-opacity=".35" stroke="var(--ink)" stroke-width="1.3"/>
      <rect x="60" y="302" width="270" height="46" fill="var(--faint)" fill-opacity=".55" stroke="var(--ink)" stroke-width="1.2"/>
      <circle cx="53" cy="325" r="5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/><circle cx="53" cy="325" r="1.6" fill="var(--ink)"/>
