      <figcaption>

      Redibujada de la foto de la hoja: las flechas, con los mismos
      sentidos; las que no llevan letra, sin ella.

      </figcaption>
      </figure>

      **Notas nuestras.** Se toma x horizontal hacia la derecha e y vertical
      hacia arriba; z es la perpendicular al papel. La letra c sirve para dos
      cosas: la tensión de la hipotenusa (15√2 MPa) y la cohesión del
      criterio (5 MPa). Las flechas sin letra son las tensiones que no se
      dan. El grado de «30°» sale en la hoja como un círculo pequeño en la
      línea.
    pide: >-
      a) Las componentes cartesianas del tensor de tensiones; b) las
      tensiones y direcciones principales; c) el tensor de deformaciones, la
      deformación tangencial máxima y la volumétrica; d) si se alcanza el
      fallo por Mohr-Coulomb con c = 5 MPa y φ = 30°.
    pasos:
      - tipo: reconocer
        pregunta: |
          La flecha b sube por la cara vertical, cuya normal exterior es
          $-x$. ¿Qué signo tiene $\tau_{xy}$?
        opciones:
          - texto: >-
              Negativo: en una cara negativa, una tangencial positiva va hacia
              $-y$, y esta va hacia $+y$; $\tau_{xy} = -10$ MPa
            correcta: true
            mensaje: |
              Eso es (convenio de signos del tema 2, p. 6). Con Cauchy,
              $\{S\} = [\sigma]\{n\}$ y $\{n\} = (-1, 0)$: $S_y = -\tau_{xy} = b$,
              así que $\tau_{xy} = -10$ MPa. Lo mismo da la flecha horizontal
              de la cara de abajo: hacia $+x$ en una cara de normal $-y$.
          - texto: >-
              Positivo: la flecha va hacia $+y$, el sentido positivo
            mensaje: |
              El sentido de la flecha no basta: cuenta también la cara. En
              una cara de normal negativa, el sentido positivo de la
              componente es el negativo del eje.
          - texto: >-
              No se puede saber hasta calcular la hipotenusa
            mensaje: |
              La cara vertical da dos componentes enteras, $\sigma_x$ y
              $\tau_{xy}$, con su signo. La hipotenusa hace falta para la
              tercera, $\sigma_y$.
      - tipo: calcular
        titulo: La tensión normal según y
        pregunta: |
          ¿Cuánto vale $\sigma_y$, en MPa?
        respuesta:
          tipo: numero
          valor: '-7.426'
          tolerancia: 0.005
          formato: un número con su signo, en MPa
        distractores:
          - valor: '-47.43'
            mensaje: |
              Has tomado $\tau_{xy} = +10$: la flecha b sube por una cara de
              normal $-x$, y ahí la componente positiva iría hacia abajo.
              $\tau_{xy} = -10$ MPa.
          - valor: '77.43'
            mensaje: |
              Has tomado c como tracción. La flecha de c entra en el
              triángulo: es una compresión, $\sigma_n = -15\sqrt2$ MPa.
          - valor: '-27.43'
            mensaje: |
              Te has dejado el término de $\tau_{xy}$ en la normal de la
              hipotenusa:
              $\sigma_n = \tfrac12(\sigma_x + \sigma_y) + \tau_{xy}$ con
              $\vec n = (1, 1)/\sqrt2$.
        pista: |
          En la hipotenusa, $\vec n = (1, 1)/\sqrt2$ y
          $\sigma_n = n^{t}[\sigma]n = \tfrac12(\sigma_x + \sigma_y + 2\tau_{xy}) = -c$.
        desarrollo: |
          $$
          \tfrac12(-15 + \sigma_y - 20) = -15\sqrt2
          \;\Longrightarrow\;
          \sigma_y = 35 - 30\sqrt2 = -7{,}426\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La tensión principal más negativa
        pregunta: |
          De las principales del plano, ¿cuánto vale la menor, en MPa?
        respuesta:
          tipo: numero
          valor: '-21.906'
          tolerancia: 0.005
          formato: un número con su signo, en MPa
        distractores:
          - valor: '-23.757'
            mensaje: |
              El radio del círculo de Mohr es
              $\sqrt{\left(\tfrac{\sigma_x - \sigma_y}{2}\right)^{2} + \tau_{xy}^{2}}$:
              has usado $\sigma_x - \sigma_y$ sin dividir por 2.
          - valor: '-50.26'
            mensaje: |
              Arrastras $\sigma_y = -47{,}43$, la de tomar $\tau_{xy}$ con
              el signo cambiado en la hipotenusa. Revisa el signo de la
              flecha b en una cara negativa.
        pista: |
          Centro $\tfrac12(\sigma_x + \sigma_y)$, radio
          $\sqrt{\left(\tfrac{\sigma_x - \sigma_y}{2}\right)^{2} + \tau_{xy}^{2}}$.
        desarrollo: |
          Centro $-11{,}213$ MPa, radio $\sqrt{3{,}787^{2} + 10^{2}} = 10{,}693$ MPa:
          $\sigma = -11{,}213 \pm 10{,}693$, es decir $-0{,}520$ y
          $-21{,}906$ MPa.
      - tipo: calcular
        titulo: La dirección de la principal mayor del plano
        pregunta: |
          ¿Qué ángulo forma con x la dirección de la principal $-0{,}520$ MPa,
          en grados, entre −90 y 90 y antihorario desde x?
        respuesta:
          tipo: numero
          valor: '-55.37'
          tolerancia: 0.05
          formato: un número con su signo, en grados
        distractores:
          - valor: '34.63'
            mensaje: |
              Es la otra dirección, la de $-21{,}906$ MPa. La ec. 2.62 da dos
              ángulos a 90°; la del máximo es la que sale de
              $\theta_1 = \tfrac12\,\mathrm{atan2}(2\tau_{xy}, \sigma_x - \sigma_y)$.
          - valor: '55.37'
            mensaje: |
              El signo: $\tau_{xy} = -10$ hace negativo el ángulo. Con +10
              sería el de 55,37°.
          - valor: '-110.74'
            mensaje: |
              Ese es $2\theta_1$, el ángulo en el círculo de Mohr. En el
              sólido el ángulo es la mitad.
        pista: |
          $\tan 2\theta_1 = \dfrac{2\tau_{xy}}{\sigma_x - \sigma_y} = \dfrac{-20}{-7{,}574}$,
          con los dos signos: $2\theta_1$ está en el tercer cuadrante.
        desarrollo: |
          $2\theta_1 = \mathrm{atan2}(-20, -7{,}574) = -110{,}74^{\circ}$, así
          que $\theta_1 = -55{,}37^{\circ}$. La de $-21{,}906$ MPa va a
          $34{,}63^{\circ}$, y z, la tercera, es principal.
      - tipo: calcular
        titulo: La tensión según z
        pregunta: |
          En deformación plana, ¿cuánto vale $\sigma_z$, en MPa?
        respuesta:
          tipo: numero
          valor: '-7.475'
          tolerancia: 0.005
          formato: un número con su signo, en MPa
        distractores:
          - valor: '0'
            mensaje: |
              Eso es tensión plana. Aquí lo nulo es $\varepsilon_z$, y para
              impedir la deformación en z hace falta una $\sigma_z$
              (apartado 4.5.2 de los apuntes del tema 4).
          - valor: '-22.43'
            mensaje: |
              Es $\sigma_x + \sigma_y$. De $\varepsilon_z = 0$ en la
              ec. 4.2 sale $\sigma_z = \nu(\sigma_x + \sigma_y)$: falta el
              $\nu = 1/3$.
        pista: |
          $\varepsilon_z = \dfrac{\sigma_z - \nu(\sigma_x + \sigma_y)}{E} = 0$.
        desarrollo: |
          $\sigma_z = \tfrac13(-15 - 7{,}426) = -7{,}475$ MPa. Es principal,
          y queda entre las dos del plano: el orden es
          $\sigma_1 = -0{,}520$, $\sigma_2 = -7{,}475$ (z) y
          $\sigma_3 = -21{,}906$ MPa.
      - tipo: calcular
        titulo: La deformación tangencial máxima
        pregunta: |
          ¿Cuánto vale la deformación tangencial máxima, en millonésimas?
        respuesta:
          tipo: numero
          valor: '950.5'
          tolerancia: 0.5
          formato: un número, en millonésimas (10⁻⁶)
        distractores:
          - valor: '475.2'
            mensaje: |
              Es la mitad: el radio del círculo de Mohr de deformaciones es
              $\tfrac12\gamma_{max}$ (la tabla de similitud del tema 3,
              $\tau \to \tfrac12\gamma$). $\gamma_{max} = \varepsilon_1 - \varepsilon_3$.
          - valor: '973.6'
            mensaje: |
              Es la que sale en tensión plana, con $\sigma_z = 0$. En
              deformación plana $\sigma_z \neq 0$ y cambia las tres
              deformaciones principales.
        pista: |
          $\gamma_{max} = \varepsilon_1 - \varepsilon_3$, o
          $\tau_{max}/G$ con $G = E/2(1+\nu)$.
        desarrollo: |
          $$
          \gamma_{max} = \frac{\tau_{max}}{G} = \frac{10{,}693\ \text{MPa}}{11\,250\ \text{MPa}} = 950{,}5\cdot10^{-6}
          $$

          con $G = 30\,000/(2\cdot\tfrac43) = 11\,250$ MPa: el círculo mayor
          es el del plano xy, porque $\varepsilon_z = 0$ queda entre las otras
          dos.
      - tipo: calcular
        titulo: La deformación volumétrica
        pregunta: |
          ¿Cuánto vale la deformación volumétrica, en millonésimas?
        respuesta:
          tipo: numero
          valor: '-332.2'
          tolerancia: 0.3
          formato: un número con su signo, en millonésimas (10⁻⁶)
        distractores:
          - valor: '-249.2'
            mensaje: |
              Has olvidado $\sigma_z$, como en tensión plana. En deformación
              plana $e = \varepsilon_x + \varepsilon_y$, y las dos llevan la
              $\sigma_z$ dentro.
          - valor: '-996.7'
            mensaje: |
              Falta el $(1 - 2\nu)$: $e = \dfrac{1-2\nu}{E}(\sigma_x + \sigma_y + \sigma_z)$
              (ec. 4.8).
        pista: |
          $e = \dfrac{1-2\nu}{E}(\sigma_x + \sigma_y + \sigma_z)$, o
          $\varepsilon_x + \varepsilon_y$.
        desarrollo: |
          $$
          e = \frac{1/3}{30\,000}\,(-15 - 7{,}426 - 7{,}475) = -332{,}2\cdot10^{-6}
          $$

          y lo mismo con $\varepsilon_x + \varepsilon_y = (-334{,}4 + 2{,}2)\cdot10^{-6}$.
      - tipo: calcular
        titulo: El factor de seguridad por Mohr-Coulomb
        pregunta: |
          ¿Cuánto vale el factor de seguridad según Mohr-Coulomb?
        respuesta:
          tipo: numero
          valor: '0.851'
          tolerancia: 0.002
          formato: un número
        distractores:
          - valor: '2.93'
            mensaje: |
              Has tomado $\sigma_z = -7{,}475$ como $\sigma_3$. El criterio usa
              la mayor y la **menor** de las tres: $\sigma_3 = -21{,}906$ MPa.
          - valor: '0.0886'
            mensaje: |
              Has puesto $k = 3$, al revés: $k = \sigma_{et}/\sigma_{ec} = 1/3$
              con $\varphi = 30^{\circ}$ (ec. 6.12).
          - valor: '0.791'
            mensaje: |
              Es el de tensión plana, con un 0 como tensión mayor. En
              deformación plana las tres son negativas:
              $\sigma_1 = -0{,}520$ MPa.
        pista: |
          De $c$ y $\varphi$:
          $\sigma_{et} = \dfrac{2c\cos\varphi}{1 + \sin\varphi}$ y
          $k = \dfrac{1 - \sin\varphi}{1 + \sin\varphi}$ (ec. 6.12). Después,
          $\sigma_{eqv} = \sigma_1 - k\sigma_3$ (ec. 6.15).
        desarrollo: |
          $$
          \sigma_{et} = \frac{2\cdot5\cos30^{\circ}}{1{,}5}\ \text{MPa} = 5{,}774\ \text{MPa},\qquad
          k = \frac{0{,}5}{1{,}5} = \frac13
          $$

          $$
          \sigma_{eqv} = -0{,}520 + \tfrac13\cdot21{,}906 = 6{,}782\ \text{MPa},\qquad
          FS = \frac{5{,}774}{6{,}782} = 0{,}851
          $$

          Menor que 1: **el material falla**.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Cara vertical: $\sigma_x = -15$ y $\tau_{xy} = -10$ MPa;
              hipotenusa: $\sigma_y = 35 - 30\sqrt2 = -7{,}426$ MPa.
          - texto: >-
              Principales del plano: $-0{,}520$ MPa a $-55{,}37$° de x y
              $-21{,}906$ MPa a 34,63°.
          - texto: >-
              Deformación plana: $\sigma_z = \nu(\sigma_x + \sigma_y) = -7{,}475$
              MPa, la intermedia.
          - texto: >-
              $\gamma_{max} = 950{,}5\cdot10^{-6}$ y
              $e = -332{,}2\cdot10^{-6}$.
          - texto: >-
              Con $c = 5$ MPa y $\varphi = 30^{\circ}$: $k = 1/3$,
              $\sigma_{et} = 5{,}774$ MPa y $FS = 0{,}851$; el material falla.
          - texto: >-
              Como las tres principales son de compresión, por Mohr-Coulomb no
              puede haber fallo.
            trampa: true
            mensaje: |
              Eso solo vale para un estado **hidrostático**. Aquí el círculo
              mayor, de radio 10,69 MPa, corta la recta intrínseca aunque esté
              entero en compresión.
    resolucion: |
      **a) El tensor.** Con x hacia la derecha e y hacia arriba, y la fórmula
      de Cauchy $\{S\} = [\sigma]\{n\}$ (ec. 2.14, apuntes del tema 2, p. 11):

      - Cara vertical, $\{n\} = (-1, 0)$: $\{S\} = (-\sigma_x, -\tau_{xy})$.
        La flecha a empuja hacia $+x$ y la b sube: $\sigma_x = -15$ y
        $\tau_{xy} = -10$ MPa.
      - Hipotenusa, $\{n\} = (1, 1)/\sqrt2$: la flecha c entra, así que
        $\sigma_n = \tfrac12(\sigma_x + \sigma_y + 2\tau_{xy}) = -15\sqrt2$, y
        $\sigma_y = 35 - 30\sqrt2 = -7{,}426$ MPa.

      La cara de abajo lo confirma: su flecha horizontal va hacia $+x$
      ($-\tau_{xy} = 10 > 0$) y la vertical sube ($-\sigma_y > 0$). La
      tangencial de la hipotenusa sale
      $\tfrac12(\sigma_x - \sigma_y) = -3{,}787$ MPa según la flecha
      dibujada: va hacia arriba a la izquierda, al revés que ella. Con
      $\sigma_z$ del apartado c:

      $$
      [\sigma] = \begin{bmatrix} -15 & -10 & 0\\ -10 & -7{,}426 & 0\\ 0 & 0 & -7{,}475 \end{bmatrix}\ \text{MPa}
      $$

      **b) Las principales.** En el plano, centro $-11{,}213$ y radio
      $10{,}693$ MPa: $-0{,}520$ MPa a $\theta_1 = -55{,}37^{\circ}$ y
      $-21{,}906$ MPa a $34{,}63^{\circ}$ de x (ec. 2.62, p. 23). z es la
      tercera dirección principal. Ordenadas:
      $\sigma_1 = -0{,}520$, $\sigma_2 = -7{,}475$ (z),
      $\sigma_3 = -21{,}906$ MPa.

      **c) Las deformaciones.** Deformación plana: $\varepsilon_z = 0$ da
      $\sigma_z = \nu(\sigma_x + \sigma_y) = -7{,}475$ MPa (apartado 4.5.2,
      p. 10). Con la ley de Hooke (ecs. 4.2 y 4.3) y
      $G = E/2(1+\nu) = 11\,250$ MPa:

      $$
      [\varepsilon] = \begin{bmatrix} -334{,}4 & -444{,}4 & 0\\ -444{,}4 & 2{,}2 & 0\\ 0 & 0 & 0 \end{bmatrix}\cdot10^{-6},\qquad
      \gamma_{xy} = -888{,}9\cdot10^{-6}
      $$

      La deformación tangencial máxima es
      $\gamma_{max} = \tau_{max}/G = 950{,}5\cdot10^{-6}$ (en el plano xy,
      porque $\varepsilon_z = 0$ queda entre las dos del plano), y la
      volumétrica, $e = \varepsilon_x + \varepsilon_y = -332{,}2\cdot10^{-6}$.

      **d) Mohr-Coulomb.** La recta intrínseca del curso,
      $|\tau_n| = \overline{OC} - \sigma_n\tan\varphi$ (ec. 6.10, p. 7), en la
      que $\overline{OC}$ es la cohesión c (así la llaman las diapositivas del
      tema), corta los círculos de tracción y de compresión
      simples en

      $$
      \sigma_{et} = \frac{2c\cos\varphi}{1 + \sin\varphi} = 5{,}774\ \text{MPa},\qquad
      \sigma_{ec} = \frac{2c\cos\varphi}{1 - \sin\varphi} = 17{,}32\ \text{MPa}
      $$

      así que $k = 1/3$ y, con la ec. 6.15,
      $\sigma_{eqv} = \sigma_1 - k\sigma_3 = 6{,}782$ MPa $> \sigma_{et}$:
      $FS = 0{,}851$. **El material falla.** Lo mismo dice el círculo mayor:
      su radio, 10,693 MPa, pasa de la distancia de su centro, en
      $\sigma = -11{,}213$ MPa, a la recta:
      $(5\cos30^{\circ} + 11{,}213\sin30^{\circ})\ \text{MPa} = 9{,}937\ \text{MPa}$.

      Cada cifra sale del motor del curso (el vector tensión de cada cara,
      Mohr en el plano, Hooke, el criterio de Mohr) y de un segundo camino: la
      normal de la hipotenusa escrita a mano, la fórmula cerrada del círculo,
      $\sigma_z$ por la deformación plana del motor, $\gamma_{max} = \tau_{max}/G$
      y el factor que lleva el círculo a tocar la recta.
