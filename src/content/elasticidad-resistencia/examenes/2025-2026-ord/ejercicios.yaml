      <line x1="150" y1="232" x2="253" y2="232" stroke="var(--ink)" stroke-width="1.4"/><polygon points="260,232 252,235.5 252,228.5" fill="var(--ink)"/>
      <line x1="205" y1="302" x2="205" y2="247" stroke="var(--ink)" stroke-width="1.4"/><polygon points="205,240 208.5,248 201.5,248" fill="var(--ink)"/>
      <path d="M258 220 A42 42 0 0 1 270.3 190.3" fill="none" stroke="var(--ink)" stroke-width="1"/><polygon points="258,220 255.6,214 260.4,214" fill="var(--ink)"/><polygon points="270.3,190.3 267.8,196.2 264.4,192.8" fill="var(--ink)"/>
