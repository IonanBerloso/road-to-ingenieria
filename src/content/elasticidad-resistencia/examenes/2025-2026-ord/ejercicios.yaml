      <svg viewBox="0 0 640 470" role="img" width="640" height="470" aria-labelledby="exerm2526-ord-5-el-prisma-de-hormigon-y-los-ocho-cables-fig-t exerm2526-ord-5-el-prisma-de-hormigon-y-los-ocho-cables-fig-d">
      <title id="exerm2526-ord-5-el-prisma-de-hormigon-y-los-ocho-cables-fig-t">El prisma de hormigón entre dos placas unidas por ocho cables, visto de lado y desde z, y el plano de la microfisura</title>
