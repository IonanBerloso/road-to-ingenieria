  # La teoría 1 de la parte 1 es literal de la cuestión 1 del parcial 1 de
  # 2018-2019, puntos incluidos: examen.yaml reutiliza
  # exerm1819-1par-1-el-tetraedro-de-cauchy y aquí no va nada.

  # ── Parte 1 · teoría 2 · el cubo en la cavidad rígida con un salto de temperatura.
  - id: exerm2526-ord-2-el-cubo-en-la-cavidad-rigida
    titulo: El cubo en una cavidad rígida que solo le deja deformarse en x, con un cambio de temperatura
    fuente: >-
      Cuestión 2 de teoría de la parte 1 · Examen final del 16 de enero de
      2026 · Elasticidad y Resistencia de Materiales, Escuela de Ingeniería
      de Gipuzkoa (UPV/EHU). Vale 1 punto. Transcrita de una foto de la hoja
      impresa. El examen no publica resolución; el desarrollo es nuestro y
      sigue los apuntes del tema 4 (apartado 4.4). Los pasos de cálculo usan
      un ejemplo nuestro.
    nivel: examen
    enunciado: |
      (1p) Sea un cubo de lado $a$ dentro de una cavidad rígida de forma que
      tan sólo puede deformarse en x. EL cubo se somete a una ΔT. Hallar el
      tensor de deformaciones y tensiones en el sólido en función de E, ν y
      ΔT.

      **Notas nuestras.** «EL» va así en la hoja. El enunciado no nombra el
      coeficiente de dilatación α, pero una ΔT solo deforma a través de él:
      el resultado lleva α junto a ΔT. Se toman las paredes de la cavidad
      lisas, sin rozamiento, y en contacto con el cubo antes de calentarlo.
    pide: >-
      Los tensores de deformaciones y de tensiones del cubo en función de E, ν
      y ΔT (y de α).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué componentes se conocen de entrada, antes de hacer ninguna
          cuenta?
        opciones:
          - texto: >-
              $\varepsilon_y = \varepsilon_z = 0$, porque la cavidad no deja
              que el cubo cambie de medida en y ni en z, y $\sigma_x = 0$,
              porque en x nada lo sujeta
            correcta: true
            mensaje: |
              Eso es: tres datos, uno de cada clase de cara. Con las paredes
              lisas no hay tangenciales, y las tres ecuaciones de la ley de
              Hooke con temperatura (ec. 4.19, apuntes del tema 4, p. 8) dan
              las tres incógnitas que quedan: $\sigma_y$, $\sigma_z$ y
              $\varepsilon_x$.
          - texto: >-
              $\varepsilon_y = \varepsilon_z = 0$ y también
              $\sigma_y = \sigma_z = 0$, porque el cubo solo trabaja en x
            mensaje: |
              Al revés: en x el cubo es libre y por eso $\sigma_x = 0$. En y y
              en z las paredes le impiden dilatarse, y para impedirlo tienen
              que empujarlo: ahí es donde aparecen las tensiones.
          - texto: >-
              Las tres deformaciones son $\alpha\Delta T$, como en un cubo
              libre, y las tensiones son nulas
            mensaje: |
              Eso es el cubo libre, sin cavidad. La cavidad impide dos de las
              tres dilataciones: $\varepsilon_y = \varepsilon_z = 0$.
      - tipo: calcular
        titulo: La tensión que hacen las paredes, en un ejemplo
        pregunta: |
          Un ejemplo nuestro: un cubo de acero con $E = 200$ GPa,
          $\nu = 0{,}3$ y $\alpha = 12\cdot10^{-6}$ °C⁻¹, que se calienta
          $\Delta T = 50$ °C. ¿Cuánto vale $\sigma_y$, en MPa?
        respuesta:
          tipo: numero
          valor: '-171.43'
          tolerancia: 0.05
          formato: un número con su signo, en MPa
        distractores:
          - valor: '-120'
            mensaje: |
              Es $-E\alpha\Delta T$, la de una barra a la que solo se le
              impide **una** dilatación. Aquí se impiden dos, y cada pared
              empuja también, por Poisson, en la dirección de la otra: en
              $\varepsilon_y = 0$ entra $-\nu\sigma_z$.
          - valor: '-300'
            mensaje: |
              Es $-E\alpha\Delta T/(1 - 2\nu)$, la del cubo con las **tres**
              dilataciones impedidas. En x el cubo es libre, $\sigma_x = 0$.
          - valor: '-92.31'
            mensaje: |
              Has dividido por $(1 + \nu)$. Con $\sigma_y = \sigma_z = \sigma$,
              la ecuación de $\varepsilon_y = 0$ es
              $\sigma - \nu\sigma = -E\alpha\Delta T$: el factor es
              $(1 - \nu)$.
        pista: |
          $\varepsilon_y = \dfrac{\sigma_y - \nu(\sigma_x + \sigma_z)}{E} + \alpha\Delta T = 0$,
          lo mismo en z, y por simetría $\sigma_y = \sigma_z$.
        desarrollo: |
          Con $\sigma_x = 0$ y $\sigma_y = \sigma_z = \sigma$:

          $$
          \frac{\sigma(1 - \nu)}{E} + \alpha\Delta T = 0
          \;\Longrightarrow\;
          \sigma = -\frac{E\alpha\Delta T}{1 - \nu} = -\frac{200\,000\cdot12\cdot10^{-6}\cdot50}{0{,}7}\ \text{MPa} = -171{,}43\ \text{MPa}
          $$
      - tipo: calcular
        titulo: La deformación en x, en el mismo ejemplo
        pregunta: |
          ¿Cuánto vale $\varepsilon_x$, en millonésimas?
        respuesta:
          tipo: numero
          valor: '1114.29'
          tolerancia: 0.5
          formato: un número con su signo, en millonésimas (10⁻⁶)
        distractores:
          - valor: '600'
            mensaje: |
              Es solo la dilatación térmica, $\alpha\Delta T$. Las paredes
              comprimen el cubo en y y en z, y por Poisson eso lo alarga
              además en x: $-\nu(\sigma_y + \sigma_z)/E > 0$.
          - valor: '960'
            mensaje: |
              Has usado $\sigma_y = \sigma_z = -E\alpha\Delta T$, la tensión
              de una sola dirección impedida. Con dos, cada una vale
              $-E\alpha\Delta T/(1 - \nu)$, y el alargamiento por Poisson es
              mayor.
          - valor: '85.71'
            mensaje: |
              El signo del término de Poisson: las tensiones de y y z son de
              compresión, y $-\nu(\sigma_y + \sigma_z)/E$ es positivo. Suma
              a la dilatación, no la resta.
        pista: |
          $\varepsilon_x = \dfrac{\sigma_x - \nu(\sigma_y + \sigma_z)}{E} + \alpha\Delta T$,
          con $\sigma_x = 0$.
        desarrollo: |
          $$
          \varepsilon_x = -\frac{2\nu\sigma}{E} + \alpha\Delta T = \alpha\Delta T\,\frac{1 + \nu}{1 - \nu} = 600\cdot10^{-6}\cdot\frac{1{,}3}{0{,}7} = 1114{,}29\cdot10^{-6}
          $$
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe los dos tensores del cubo en función de E, ν, α y ΔT, como en
          el examen, diciendo de dónde sale cada componente.
        rubrica:
          - punto: >-
              Se dicen las condiciones de contorno: εy = εz = 0 (la cavidad),
              σx = 0 (la cara libre) y ninguna tangencial (paredes lisas), así
              que los ejes son principales.
            porque: >-
              Son los datos del problema escritos en ecuaciones; sin ellos hay
              seis incógnitas y ninguna ecuación.
            minimo: true
          - punto: >-
              Se escribe la ley de Hooke con temperatura,
              εi = [σi − ν(σj + σk)]/E + αΔT (ec. 4.19), para las tres
              direcciones.
            porque: >-
              Es la ley que relaciona lo que se sabe con lo que se busca, y la
              temperatura entra sumando αΔT a cada deformación normal.
            minimo: true
          - punto: >-
              De εy = εz = 0 y la simetría, σy = σz = −EαΔT/(1 − ν).
            porque: >-
              Es el resultado que pide el enunciado para las tensiones, y el
              signo dice que las paredes comprimen el cubo al calentarlo.
            minimo: true
          - punto: >-
              Con εx = −2νσ/E + αΔT, εx = αΔT(1 + ν)/(1 − ν).
            porque: >-
              Es la otra mitad del resultado: el cubo se alarga en x más que
              libre, por Poisson.
            minimo: true
          - punto: >-
              Se escriben los dos tensores, diagonales: [ε] con εx y dos ceros,
              [σ] con un cero y dos σ iguales.
            porque: >-
              El enunciado pide los tensores, no tres números sueltos.
          - punto: >-
              Se comenta el signo con ΔT: si se enfría (ΔT < 0) las paredes
              tendrían que tirar del cubo, y solo pueden empujar; el cubo se
              despegaría.
            porque: >-
              Es la comprobación física que distingue una cuenta entendida de
              una cuenta copiada.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Condiciones: $\varepsilon_y = \varepsilon_z = 0$,
              $\sigma_x = 0$ y ninguna tangencial.
          - texto: >-
              Hooke con temperatura en y y en z, con
              $\sigma_y = \sigma_z = \sigma$:
              $\sigma(1 - \nu)/E + \alpha\Delta T = 0$.
          - texto: >-
              $\sigma = -E\alpha\Delta T/(1 - \nu)$: las paredes comprimen el
              cubo.
          - texto: >-
              Hooke en x:
              $\varepsilon_x = \alpha\Delta T(1 + \nu)/(1 - \nu)$.
          - texto: >-
              Como la cavidad es rígida, el cubo no se puede deformar y todas
              las tensiones valen $-E\alpha\Delta T$.
            trampa: true
            mensaje: |
              La cavidad solo impide y y z: en x el cubo es libre, se alarga y
              no tiene tensión. $-E\alpha\Delta T$ es la tensión de una barra
              con una sola dilatación impedida.
    resolucion: |
      **Las condiciones.** La cavidad rígida impide que el cubo cambie de
      medida en y y en z: $\varepsilon_y = \varepsilon_z = 0$. En x nada lo
      sujeta: $\sigma_x = 0$. Con las paredes lisas no hay tangenciales, y
      los ejes x, y, z son principales.

      **La ley de Hooke con temperatura** (ec. 4.19, apuntes del tema 4,
      p. 8):

      $$
      \varepsilon_x = \frac{\sigma_x - \nu(\sigma_y + \sigma_z)}{E} + \alpha\Delta T,\quad
      \varepsilon_y = \frac{\sigma_y - \nu(\sigma_x + \sigma_z)}{E} + \alpha\Delta T,\quad
      \varepsilon_z = \frac{\sigma_z - \nu(\sigma_x + \sigma_y)}{E} + \alpha\Delta T
      $$

      **Las tensiones.** Restando las dos últimas igualadas a cero,
      $(1 + \nu)(\sigma_y - \sigma_z) = 0$: $\sigma_y = \sigma_z = \sigma$, y

      $$
      \frac{\sigma(1 - \nu)}{E} + \alpha\Delta T = 0
      \;\Longrightarrow\;
      \sigma_y = \sigma_z = -\frac{E\alpha\Delta T}{1 - \nu}
      $$

      **La deformación en x.**

      $$
      \varepsilon_x = -\frac{2\nu\sigma}{E} + \alpha\Delta T = \alpha\Delta T\,\frac{1 + \nu}{1 - \nu}
      $$

      **Los tensores.**

      $$
      [\varepsilon] = \begin{bmatrix} \alpha\Delta T\,\dfrac{1 + \nu}{1 - \nu} & 0 & 0\\ 0 & 0 & 0\\ 0 & 0 & 0 \end{bmatrix},\qquad
      [\sigma] = \begin{bmatrix} 0 & 0 & 0\\ 0 & -\dfrac{E\alpha\Delta T}{1 - \nu} & 0\\ 0 & 0 & -\dfrac{E\alpha\Delta T}{1 - \nu} \end{bmatrix}
      $$

      Si el cubo se calienta, las paredes lo comprimen y se alarga en x más
      que libre ($\tfrac{1 + \nu}{1 - \nu} > 1$). Si se enfriara, las
      paredes tendrían que tirar de él: un cubo solo apoyado se despegaría,
      y las fórmulas valdrían solo si estuviera pegado.

      **Un ejemplo (nuestro).** Acero, $E = 200$ GPa, $\nu = 0{,}3$,
      $\alpha = 12\cdot10^{-6}$ °C⁻¹ y $\Delta T = 50$ °C:
      $\sigma_y = \sigma_z = -171{,}43$ MPa y
      $\varepsilon_x = 1114{,}29\cdot10^{-6}$. El motor del curso da las
      mismas cifras por el camino inverso: con esas deformaciones, la ley de
      las tensiones (ecs. 4.21 y 4.22) devuelve $\sigma_x = 0$ y
      $\sigma_y = -171{,}43$ MPa, y la variación de volumen por unidad de
      volumen es la propia $\varepsilon_x$.


  # ── Parte 1 · teoría 3 · la tensión equivalente de Tresca con un tensor de dos tangenciales.
  - id: exerm2526-ord-3-la-tension-equivalente-de-tresca
    titulo: La tensión equivalente de Tresca para un tensor con σx y dos tangenciales
    fuente: >-
      Cuestión 3 de teoría de la parte 1 · Examen final del 16 de enero de
      2026 · Elasticidad y Resistencia de Materiales, Escuela de Ingeniería
      de Gipuzkoa (UPV/EHU). Vale 1 punto. Transcrita de una foto de la hoja
      impresa. El examen no publica resolución; el desarrollo es nuestro y
      sigue los apuntes de los temas 2 y 6. Los pasos de cálculo usan un
      ejemplo nuestro.
    nivel: examen
    enunciado: |
      (1p) Demostrar que, según el criterio de fallo de Tresca, la tensión
      equivalente es:

      $$
      \sigma_{bal} = \sqrt{\sigma_x^{2} + 4\left(\tau_{xy}^{2} + \tau_{xz}^{2}\right)}
      $$

      cuando el tensor de tensiones es:

      $$
      [\sigma] = \begin{bmatrix} \sigma_x & \tau_{xy} & \tau_{xz}\\ \tau_{xy} & 0 & 0\\ \tau_{xz} & 0 & 0 \end{bmatrix}
      $$

      **Notas nuestras.** «bal» es de *baliokidea*, «equivalente» en
      euskera: la hoja usa el mismo subíndice en las dos columnas.
    pide: >-
      La demostración de que la tensión equivalente de Tresca de ese tensor es
      la raíz del enunciado.
    pasos:
      - tipo: reconocer
        pregunta: |
          Tresca usa la mayor y la menor de las tres principales. ¿Qué tienen
          de particular las de este tensor?
        opciones:
          - texto: >-
              Una es nula, y las otras dos tienen signos opuestos: la nula es
              la intermedia
            correcta: true
            mensaje: |
              Eso es. El determinante del tensor es nulo (dos filas
              proporcionales), así que $\sigma = 0$ es raíz; el producto de
              las otras dos es $-(\tau_{xy}^{2} + \tau_{xz}^{2}) \le 0$. Por
              eso $\sigma_1 - \sigma_3$ es la distancia entre las dos no
              nulas, sin el cero de por medio.
          - texto: >-
              Las tres son distintas de cero, porque hay tres componentes no
              nulas
            mensaje: |
              Las filas 2 y 3 son proporcionales, $(\tau_{xy}, 0, 0)$ y
              $(\tau_{xz}, 0, 0)$: el determinante es cero y una principal
              también.
          - texto: >-
              Son $\sigma_x$, $\tau_{xy}$ y $\tau_{xz}$, porque el tensor ya
              está casi en ejes principales
            mensaje: |
              Las tangenciales no son tensiones principales: en ejes
              principales las tangenciales son nulas. Hay que resolver la
              ecuación característica.
      - tipo: calcular
        titulo: La principal mayor, en un ejemplo
        pregunta: |
          Un ejemplo nuestro: $\sigma_x = 80$, $\tau_{xy} = 30$ y
          $\tau_{xz} = 40$ MPa. ¿Cuánto vale $\sigma_1$, en MPa?
        respuesta:
          tipo: numero
          valor: '104.03'
          tolerancia: 0.02
          formato: un número, en MPa
        distractores:
          - valor: '90'
            mensaje: |
              Te has dejado el cuadrado de $\sigma_x/2$ dentro de la raíz:
              $\sigma_1 = \tfrac{\sigma_x}{2} + \sqrt{\left(\tfrac{\sigma_x}{2}\right)^{2} + \tau_{xy}^{2} + \tau_{xz}^{2}}$.
          - valor: '144.03'
            mensaje: |
              Has sumado el radio a $\sigma_x$ en vez de al centro,
              $\sigma_x/2$. Las dos raíces no nulas son simétricas respecto
              de $\sigma_x/2$.
        pista: |
          Las dos no nulas salen de $\sigma^{2} - \sigma_x\sigma - (\tau_{xy}^{2} + \tau_{xz}^{2}) = 0$.
        desarrollo: |
          $$
          \sigma_1 = \left(40 + \sqrt{40^{2} + 30^{2} + 40^{2}}\right)\ \text{MPa} = (40 + 64{,}03)\ \text{MPa} = 104{,}03\ \text{MPa}
          $$

          y $\sigma_3 = (40 - 64{,}03)$ MPa $= -24{,}03$ MPa, con
          $\sigma_2 = 0$.
      - tipo: calcular
        titulo: La tensión equivalente de Tresca, en el mismo ejemplo
        pregunta: |
          ¿Cuánto vale la tensión equivalente de Tresca, en MPa?
        respuesta:
          tipo: numero
          valor: '128.06'
          tolerancia: 0.02
          formato: un número, en MPa
        distractores:
          - valor: '117.90'
            mensaje: |
              Es la de Von Mises,
              $\sqrt{\sigma_x^{2} + 3(\tau_{xy}^{2} + \tau_{xz}^{2})}$. Tresca
              es la diferencia de las principales extremas (ec. 6.19), y da
              más.
          - valor: '104.03'
            mensaje: |
              Es $\sigma_1$ sola: sería Tresca si la menor fuese el cero.
              Aquí la menor es $\sigma_3 = -24{,}03$ MPa, y
              $\sigma_{eqv} = \sigma_1 - \sigma_3$.
          - valor: '94.34'
            mensaje: |
              Falta el 4: $\sigma_1 - \sigma_3$ es el doble del radio, y
              $2\sqrt{\left(\tfrac{\sigma_x}{2}\right)^{2} + \tau^{2}} = \sqrt{\sigma_x^{2} + 4\tau^{2}}$.
        pista: |
          $\sigma_{eqv} = \sigma_1 - \sigma_3$ (ec. 6.19).
        desarrollo: |
          $$
          \sigma_{eqv} = \sigma_1 - \sigma_3 = (104{,}03 + 24{,}03)\ \text{MPa} = 128{,}06\ \text{MPa}
          $$

          y con la fórmula del enunciado,
          $\sqrt{80^{2} + 4(30^{2} + 40^{2})}\ \text{MPa} = \sqrt{16\,400}\ \text{MPa} = 128{,}06\ \text{MPa}$.
      - tipo: redactar
        que: demostracion
        consigna: >-
          Demuestra la fórmula del enunciado como en el examen, desde la
          ecuación característica del tensor.
        rubrica:
          - punto: >-
              Se enuncia el criterio de Tresca: el fallo llega cuando la
              tangencial máxima, (σ1 − σ3)/2, iguala la del estado equivalente,
              σeqv/2; así σeqv = σ1 − σ3 (ecs. 6.17 a 6.19).
            porque: >-
              Es el criterio que se aplica; sin él no hay qué demostrar.
            minimo: true
          - punto: >-
              Se plantea la ecuación característica, det([σ] − σ[I]) = 0, y se
              desarrolla: σ[σ² − σxσ − (τxy² + τxz²)] = 0.
            porque: >-
              Es el paso que da las principales de este tensor concreto.
            minimo: true
          - punto: >-
              Se sacan las raíces: σ = 0 y σ = σx/2 ± √(σx²/4 + τxy² + τxz²).
            porque: >-
              Son las tres principales.
            minimo: true
          - punto: >-
              Se ordenan con un argumento: la raíz es mayor que |σx/2|, así que
              una es positiva y la otra negativa (su producto es
              −(τxy² + τxz²)); el cero es la intermedia.
            porque: >-
              Sin ordenar no se sabe cuáles son σ1 y σ3, y es justo lo que
              hace que la fórmula no dependa del signo de σx.
            minimo: true
          - punto: >-
              Se resta: σ1 − σ3 = 2√(σx²/4 + τxy² + τxz²) = √(σx² + 4(τxy² + τxz²)).
            porque: >-
              Es la fórmula del enunciado.
            minimo: true
          - punto: >-
              Se comenta el caso de una sola tangencial (τxz = 0): queda la
              fórmula conocida de la flexión con torsión, √(σ² + 4τ²).
            porque: >-
              Enseña dónde se usa la fórmula: una sección con normal y
              tangencial.
      - tipo: justificar
        pregunta: Ordena la demostración. Una pieza es falsa.
        piezas:
          - texto: >-
              Tresca: $\sigma_{eqv} = \sigma_1 - \sigma_3$ (ec. 6.19).
          - texto: >-
              La ecuación característica es
              $\sigma\left[\sigma^{2} - \sigma_x\sigma - (\tau_{xy}^{2} + \tau_{xz}^{2})\right] = 0$.
          - texto: >-
              Raíces: 0 y
              $\tfrac{\sigma_x}{2} \pm \sqrt{\tfrac{\sigma_x^{2}}{4} + \tau_{xy}^{2} + \tau_{xz}^{2}}$,
              una positiva y otra negativa.
          - texto: >-
              El cero es la intermedia, así que $\sigma_1 - \sigma_3$ es el
              doble de la raíz cuadrada.
          - texto: >-
              Como $\sigma_2 = 0$, se toma $\sigma_3 = 0$ y queda
              $\sigma_{eqv} = \sigma_1$.
            trampa: true
            mensaje: |
              El cero es la intermedia: las otras dos raíces tienen producto
              $-(\tau_{xy}^{2} + \tau_{xz}^{2})$, negativo, y una de ellas es
              la menor. Tomar el cero como $\sigma_3$ olvida la mitad del
              círculo mayor.
    resolucion: |
      **El criterio.** Según Tresca, el fallo llega cuando la tensión
      cortante máxima alcanza la del estado equivalente. Con las principales
      ordenadas, $\sigma_1 \ge \sigma_2 \ge \sigma_3$ (apuntes del tema 6,
      p. 9):

      $$
      \tau_{max} = \frac{\sigma_1 - \sigma_3}{2}\ \text{(ec. 6.17)},\qquad
      \tau_{max} = \frac{\sigma_{eqv}}{2}\ \text{(ec. 6.18)}
      \;\Longrightarrow\;
      \sigma_{eqv} = \sigma_1 - \sigma_3\ \text{(ec. 6.19)}
      $$

      **Las principales del tensor.** La ecuación característica (tema 2,
      ec. 2.35) es $\det([\sigma] - \sigma[I]) = 0$:

      $$
      \begin{vmatrix} \sigma_x - \sigma & \tau_{xy} & \tau_{xz}\\ \tau_{xy} & -\sigma & 0\\ \tau_{xz} & 0 & -\sigma \end{vmatrix}
      = (\sigma_x - \sigma)\sigma^{2} + \tau_{xy}^{2}\sigma + \tau_{xz}^{2}\sigma = 0
      $$

      es decir,
      $\sigma\left[\sigma^{2} - \sigma_x\sigma - (\tau_{xy}^{2} + \tau_{xz}^{2})\right] = 0$,
      con raíces

      $$
      \sigma = 0,\qquad
      \sigma = \frac{\sigma_x}{2} \pm \sqrt{\frac{\sigma_x^{2}}{4} + \tau_{xy}^{2} + \tau_{xz}^{2}}
      $$

      **El orden.** La raíz cuadrada es mayor que $|\sigma_x|/2$ (si hay
      alguna tangencial), así que la raíz con $+$ es positiva y la de $-$,
      negativa: su producto es $-(\tau_{xy}^{2} + \tau_{xz}^{2}) < 0$. El cero
      es la intermedia, $\sigma_2 = 0$, y las otras dos son $\sigma_1$ y
      $\sigma_3$, sea cual sea el signo de $\sigma_x$.

      **La resta.**

      $$
      \sigma_{eqv} = \sigma_1 - \sigma_3 = 2\sqrt{\frac{\sigma_x^{2}}{4} + \tau_{xy}^{2} + \tau_{xz}^{2}} = \sqrt{\sigma_x^{2} + 4\left(\tau_{xy}^{2} + \tau_{xz}^{2}\right)}
      $$

      que es la fórmula del enunciado. Con una sola tangencial queda
      $\sqrt{\sigma^{2} + 4\tau^{2}}$, la de un punto de una sección con
      normal y cortante.

      **Un ejemplo (nuestro).** Con $\sigma_x = 80$, $\tau_{xy} = 30$ y
      $\tau_{xz} = 40$ MPa, las principales son 104,03, 0 y $-24{,}03$ MPa, y
      $\sigma_{eqv} = 128{,}06$ MPa. El motor del curso da las mismas
      principales resolviendo el tensor entero, y su criterio de Tresca, la
      misma equivalente; la de Von Mises del mismo estado es 117,90 MPa.


  # ── Parte 1 · teoría 4 · la compatibilidad en el plano.
  - id: exerm2526-ord-4-la-compatibilidad-en-el-plano
    titulo: Las condiciones de compatibilidad de deformaciones en el caso bidimensional
    fuente: >-
      Cuestión 4 de teoría de la parte 1 · Examen final del 16 de enero de
      2026 · Elasticidad y Resistencia de Materiales, Escuela de Ingeniería
      de Gipuzkoa (UPV/EHU). Vale 1 punto. Transcrita de una foto de la hoja
      impresa. La cuestión 4 de los primeros parciales de 2015-2016 y de
      2016-2017 pide lo mismo con otra palabra («Deducir»). El examen no
      publica resolución; el desarrollo es nuestro y sigue los apuntes del
      tema 3 (apartado 3.8). El paso de cálculo usa un ejemplo nuestro.
    nivel: examen
    enunciado: |
      (1p) Deduce las condiciones de compatibilidad de deformaciones en el
      caso bidimensional
    pide: >-
      La deducción de la condición de compatibilidad de deformaciones en el
      plano.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué garantiza la condición de compatibilidad?
        opciones:
          - texto: >-
              Que exista un campo de desplazamientos $u$, $v$ del que salgan
              las tres deformaciones $\varepsilon_x$, $\varepsilon_y$ y
              $\gamma_{xy}$: con dos funciones no se fabrican tres cualesquiera
            correcta: true
            mensaje: |
              Eso es. Si las deformaciones no la cumplen, al integrarlas el
              sólido se abriría o se solaparía: los desplazamientos
              dependerían del camino. Es una condición puramente geométrica
              (apuntes del tema 3, apartado 3.8, p. 19).
          - texto: >-
              Que las tensiones que salen de esas deformaciones estén en
              equilibrio
            mensaje: |
              El equilibrio es otra condición, sobre las tensiones y las
              fuerzas (tema 2). La compatibilidad no sabe nada del material
              ni de las cargas.
          - texto: >-
              Que el giro de sólido rígido sea nulo en todo el sólido
            mensaje: |
              El giro puede variar de un punto a otro; lo que se pide es que
              sea una función del punto, con derivadas cruzadas iguales. Es
              justo el paso que da la ecuación.
      - tipo: calcular
        titulo: La γxy compatible, en un ejemplo
        pregunta: |
          Un ejemplo nuestro, con las coordenadas en m:

          $$
          \varepsilon_x = 5\cdot10^{-4}\,y^{2},\qquad \varepsilon_y = -1\cdot10^{-4}\,x^{2},\qquad \gamma_{xy} = c\cdot10^{-4}\,xy
          $$

          ¿Para qué valor de $c$ es compatible el campo?
        respuesta:
          tipo: numero
          valor: '8'
          tolerancia: 0.01
          formato: un número con su signo
        distractores:
          - valor: '4'
            mensaje: |
              Has puesto la componente del tensor,
              $\varepsilon_{xy} = \tfrac12\gamma_{xy}$, donde va $\gamma_{xy}$:
              con la $\gamma$ ingenieril la ec. 3.63 no lleva ningún 2.
          - valor: '-8'
            mensaje: |
              El signo: la ec. 3.63 es
              $\varepsilon_{x,yy} + \varepsilon_{y,xx} = \gamma_{xy,xy}$, y
              las dos derivadas de la izquierda suman, con el signo de cada
              una.
          - valor: '12'
            mensaje: |
              Has perdido el signo de $\varepsilon_y$: $\varepsilon_{y,xx}$ es
              $-2\cdot10^{-4}$, no $+2\cdot10^{-4}$.
        pista: |
          $\varepsilon_{x,yy} + \varepsilon_{y,xx} = \gamma_{xy,xy}$ (ec. 3.63).
        desarrollo: |
          $\varepsilon_{x,yy} = 10\cdot10^{-4}$, $\varepsilon_{y,xx} = -2\cdot10^{-4}$
          y $\gamma_{xy,xy} = c\cdot10^{-4}$:

          $$
          (10 - 2)\cdot10^{-4} = c\cdot10^{-4} \;\Longrightarrow\; c = 8
          $$

          El campo que lo produce es $u = 5\cdot10^{-4}xy^{2}$,
          $v = -1\cdot10^{-4}x^{2}y$: con él,
          $\gamma_{xy} = u_{,y} + v_{,x} = (10 - 2)\cdot10^{-4}xy$.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Deduce la condición de compatibilidad en el plano como en el examen,
          a partir de las diferenciales de los desplazamientos.
        rubrica:
          - punto: >-
              Se dice el problema: tres deformaciones (εx, εy, γxy) que salen
              de dos desplazamientos (u, v); para obtener u y v integrando,
              las deformaciones tienen que cumplir una condición.
            porque: >-
              Es el porqué de la pregunta, y lo primero que dicen los apuntes.
            minimo: true
          - punto: >-
              Se escriben las diferenciales con deformación y giro:
              du = εx dx + (½γxy + ωxy) dy, dv = (½γxy − ωxy) dx + εy dy
              (ec. 3.61).
            porque: >-
              Es el punto de partida: el desplazamiento relativo de dos puntos
              próximos es deformación pura más giro.
            minimo: true
          - punto: >-
              Se exige que du y dv sean diferenciales exactas (derivadas
              cruzadas iguales) y salen las derivadas del giro, ωxy,x y ωxy,y
              (ec. 3.62).
            porque: >-
              Diferencial exacta quiere decir que u y v dependen del punto y
              no del camino.
            minimo: true
          - punto: >-
              Se exige lo mismo al giro, ωxy,xy = ωxy,yx, y al eliminarlo queda
              εx,yy + εy,xx = γxy,xy (ec. 3.63).
            porque: >-
              Es el resultado: el giro también es una función del punto.
            minimo: true
          - punto: >-
              Se nombra la hipótesis: segundas derivadas de las deformaciones
              continuas (teorema de Schwarz), es decir, terceras de los
              desplazamientos.
            porque: >-
              Es lo que permite cruzar las derivadas, y los apuntes lo dicen.
          - punto: >-
              Se comprueba con εx = u,x, εy = v,y y γxy = u,y + v,x: los dos
              lados valen u,xyy + v,xxy.
            porque: >-
              Es un control rápido de que la ecuación está bien escrita.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              $du = \varepsilon_x\,dx + \left(\tfrac12\gamma_{xy} + \omega_{xy}\right)dy$
              y $dv = \left(\tfrac12\gamma_{xy} - \omega_{xy}\right)dx + \varepsilon_y\,dy$.
          - texto: >-
              Derivadas cruzadas iguales en $du$ y en $dv$: salen
              $\omega_{xy,x}$ y $\omega_{xy,y}$ en función de las
              deformaciones.
          - texto: >-
              El giro también es función del punto:
              $\omega_{xy,xy} = \omega_{xy,yx}$.
          - texto: >-
              Al eliminar el giro queda
              $\varepsilon_{x,yy} + \varepsilon_{y,xx} = \gamma_{xy,xy}$.
          - texto: >-
              La condición sale del equilibrio de un elemento diferencial,
              $\sigma_{x,x} + \tau_{xy,y} = 0$.
            trampa: true
            mensaje: |
              Esa es una ecuación de equilibrio, de tensiones. La
              compatibilidad no usa ni el material ni las fuerzas: es
              geometría, que los desplazamientos sean funciones del punto.
    resolucion: |
      **El problema.** En el plano hay tres deformaciones, $\varepsilon_x$,
      $\varepsilon_y$ y $\gamma_{xy}$, que salen de solo dos desplazamientos,
      $u$ y $v$. No pueden ser tres funciones cualesquiera: para obtener los
      desplazamientos integrando, tienen que cumplir una condición de
      integrabilidad (apuntes del tema 3, apartado 3.8, p. 19).

      **Las diferenciales** (ec. 3.61):

      $$
      \begin{aligned}
      du &= \varepsilon_x\,dx + \left(\tfrac12\gamma_{xy} + \omega_{xy}\right)dy\\
      dv &= \left(\tfrac12\gamma_{xy} - \omega_{xy}\right)dx + \varepsilon_y\,dy
      \end{aligned}
      $$

      **$u$ y $v$, funciones del punto.** Para que $du$ y $dv$ sean
      diferenciales exactas, las derivadas cruzadas son iguales, y de ahí
      salen las derivadas del giro (ec. 3.62, p. 20):

      $$
      \omega_{xy,x} = \varepsilon_{x,y} - \tfrac12\gamma_{xy,x},\qquad
      \omega_{xy,y} = \tfrac12\gamma_{xy,y} - \varepsilon_{y,x}
      $$

      **El giro, también.** $\omega_{xy,xy} = \omega_{xy,yx}$: derivando la
      primera respecto de $y$ y la segunda respecto de $x$,

      $$
      \varepsilon_{x,yy} - \tfrac12\gamma_{xy,xy} = \tfrac12\gamma_{xy,xy} - \varepsilon_{y,xx}
      \;\Longrightarrow\;
      \varepsilon_{x,yy} + \varepsilon_{y,xx} = \gamma_{xy,xy}
      $$

      que es la ec. 3.63. Para cruzar las derivadas hace falta que las
      segundas derivadas de las deformaciones sean continuas (teorema de
      Schwarz), o las terceras de los desplazamientos. En el espacio salen
      seis ecuaciones como esta (ec. 3.64).

      **Control.** Con $\varepsilon_x = u_{,x}$, $\varepsilon_y = v_{,y}$ y
      $\gamma_{xy} = u_{,y} + v_{,x}$, los dos lados valen
      $u_{,xyy} + v_{,xxy}$.

      **Un ejemplo (nuestro).** Con $\varepsilon_x = 5\cdot10^{-4}y^{2}$ y
      $\varepsilon_y = -1\cdot10^{-4}x^{2}$, la única
      $\gamma_{xy} = c\cdot10^{-4}xy$ compatible es la de $c = 8$, y la
      producen $u = 5\cdot10^{-4}xy^{2}$ y $v = -1\cdot10^{-4}x^{2}y$. Se ha
      comprobado derivando ese campo numéricamente en un punto y con la
      deformación de una dirección del motor del curso.

  # ── Parte 1 · problema 1 · el prisma de hormigón entre placas y ocho cables.
  - id: exerm2526-ord-5-el-prisma-de-hormigon-y-los-ocho-cables
    titulo: El prisma de hormigón comprimido entre dos placas unidas por ocho cables, y la microfisura
    fuente: >-
      Problema 1 de la parte 1 · Examen final del 16 de enero de 2026 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 2 puntos. Transcrito de una foto de la hoja
      impresa. Es de la familia del ejercicio 1 del primer parcial de
      2012-2013 y del 1 del de 2014-2015 (un prisma entre placas rígidas
      unidas por cuatro cables), con otros datos, otros cables y la
      microfisura. El examen no publica resolución; el desarrollo es nuestro,
      con la ley de Hooke generalizada de los apuntes del tema 4.
    nivel: examen
    enunciado: |
      (2p) Se considera un prisma de sección cuadrada de lado $a$ = 200 mm,
      hecho de hormigón (E = 26 GPa y coeficiente de Poisson 0.1).

      El prisma se coloca entre dos placas rígidas, perfectamente lisas y de
      peso despreciable.

      Las placas están unidas entre sí por medio de 8 cables de acero (200
      GPa y coeficiente de Poisson 0.3 ).

      La sección de los cables es de 100 mm² y su longitud, igual a la altura
      del prisma, es de 1 m. Los cables están dispuestos simétricamente.

      El límite elástico del acero de los cables es de 250 MPa. El prisma
      está sometido a una compresión uniforme, en dirección Y, sobre toda su
      superficie lateral de valor p= 75 MPa (Figura 1b)

      Se pide calcular:

      a) Tensión en los cables . .

      b) Tensiones y direcciones principales en el prisma

      c) Variación de volumen experimentada por el prisma

      d) Coeficiente de seguridad de los cables, utilizando el criterio de
      Von Mises.

      Una inspección en obra revela que el bloque de hormigón presenta un
      defecto de fabricación. De tal forma que el prisma tiene una
      microfisura en el plano indicado en la Figura inferior.

      Determinar si se superará la tensión máxima admisible de cortadura en
      el hormigón (fijada en 15 MPa) para el plano indicado

