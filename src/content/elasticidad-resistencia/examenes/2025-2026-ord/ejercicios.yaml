      <circle cx="126.6" cy="189.7" r="3" fill="var(--ink)"/>
      <circle cx="200" cy="170" r="2.6" fill="var(--ink)"/>
      <text x="295.5" y="195.8" font-size="15" fill="var(--ink)" font-style="italic" stroke="var(--paper)" stroke-width="3" paint-order="stroke">A</text>
      <text x="208" y="93" font-size="15" fill="var(--ink)" font-style="italic" stroke="var(--paper)" stroke-width="3" paint-order="stroke">B</text>
      <text x="130.6" y="209.7" font-size="15" fill="var(--ink)" font-style="italic" stroke="var(--paper)" stroke-width="3" paint-order="stroke">C</text>
      <text x="206" y="162" font-size="15" fill="var(--ink)" font-style="italic" stroke="var(--paper)" stroke-width="3" paint-order="stroke">O</text>
      <text x="358.7" y="249.2" font-size="15" fill="var(--ink)" font-style="italic">x</text>
      <text x="210" y="41" font-size="15" fill="var(--ink)" font-style="italic">y</text>
      <text x="38.8" y="234.3" font-size="15" fill="var(--ink)" font-style="italic">z</text>
      </svg>
      <figcaption>

      Redibujada de la foto de la hoja, con los ejes en la misma
      perspectiva.

      </figcaption>
      </figure>

      **Notas nuestras.** Las coordenadas van en la unidad del radio. En
      euskera el apartado 6 pide los diámetros de longitud máxima y mínima
      después de la deformación y añade «Kalkulatu» (calcúlalos).
    pide: >-
      1) El campo de desplazamientos lineal; 2) el tensor gradiente de
      desplazamientos; 3) la variación de volumen de la esfera; 4) el vector
      de rotación, con el giro y su eje; 5) las deformaciones y direcciones
      principales; 6) los diámetros que más se alargan y más se acortan.
    pasos:
      - tipo: reconocer
        pregunta: |
          A está en $(1, 0, 0)$ y pasa a $A'$. ¿Qué coeficientes del campo da
          ese dato?
        opciones:
          - texto: >-
              $c_1$, $c_4$ y $c_7$: el desplazamiento de A es
              $(c_1, c_4, c_7)$, porque en A solo $x$ vale 1
            correcta: true
            mensaje: |
              Eso es. $\vec\delta_A = \vec A' - \vec A = (0{,}001;\ 0{,}002;\ 0{,}001)$
              es la primera **columna** de la matriz gradiente (ec. 3.28,
              apuntes del tema 3, p. 11): $u_{,x}$, $v_{,x}$ y $w_{,x}$. B da
              la segunda columna y C la tercera.
          - texto: >-
              $c_1$, $c_2$ y $c_3$: las tres componentes de $\vec A'$ son la
              primera ecuación, la de $u$
            mensaje: |
              Esa es la primera **fila**, $u$ en función de $x$, $y$ y $z$.
              Un punto da las tres componentes de **su** desplazamiento:
              en A ($x = 1$, $y = z = 0$) son $c_1$, $c_4$ y $c_7$. Cambiar
              filas por columnas transpone el gradiente y cambia el giro de
              signo.
          - texto: >-
              Las componentes de $\vec A'$ tal cual: $c_1 = 1{,}001$,
              $c_4 = 0{,}002$ y $c_7 = 0{,}001$
            mensaje: |
              $\vec A'$ es la posición final, no el desplazamiento. Hay que
              restar la inicial: $c_1 = 1{,}001 - 1 = 0{,}001$. Con 1,001 la
              esfera se duplicaría.
      - tipo: calcular
        titulo: Un coeficiente del campo
        pregunta: |
          ¿Cuánto vale $c_3 = \partial u/\partial z$, en milésimas?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número con su signo, en milésimas (10⁻³)
        distractores:
          - valor: '1'
            mensaje: |
              Es $c_7 = \partial w/\partial x$, la z de A. Has cambiado filas
              por columnas: $c_3$ es la x del desplazamiento de C,
              $-0{,}001 - 0$.
          - valor: '3'
            mensaje: |
              Es $c_9 = \partial w/\partial z$, la z del desplazamiento de C,
              $1{,}003 - 1$. $c_3$ es su x.
        pista: |
          En C, $(0, 0, 1)$: $u = c_3$, $v = c_6$, $w = c_9$. Y
          $\vec\delta_C = \vec C' - \vec C$.
        desarrollo: |
          $\vec\delta_C = (-0{,}001;\ 0;\ 1{,}003 - 1) = (c_3, c_6, c_9)$, así
          que $c_3 = -0{,}001$. Con los tres puntos:

          $$
          \begin{aligned}
          u &= 0{,}001x + 0{,}002y - 0{,}001z\\
          v &= 0{,}002x - 0{,}002y\\
          w &= 0{,}001x + 0{,}003z
          \end{aligned}
          $$
      - tipo: calcular
        titulo: La variación de volumen
        pregunta: |
          ¿Cuánto cambia el volumen de la esfera, en milésimas de la unidad
          de volumen (radio 1)?
        respuesta:
          tipo: numero
          valor: '8.378'
          tolerancia: 0.005
          formato: un número con su signo, en milésimas
        distractores:
          - valor: '2'
            mensaje: |
              Esa es la deformación volumétrica $e$, el cambio **por unidad de
              volumen**. Falta multiplicar por el volumen de la esfera,
              $\tfrac43\pi$.
          - valor: '25.13'
            mensaje: |
              Sale de sumar las deformaciones en valor absoluto
              ($0{,}001 + 0{,}002 + 0{,}003$) o de multiplicar $e$ por
              $4\pi$, el área de la esfera. La traza lleva su signo,
              $e = 0{,}001 - 0{,}002 + 0{,}003$, y va por el volumen.
        pista: |
          $e = \varepsilon_x + \varepsilon_y + \varepsilon_z$ (ec. 3.59) y
          $\Delta V = eV$, con $V = \tfrac43\pi R^{3}$.
        desarrollo: |
          $$
          e = 0{,}001 - 0{,}002 + 0{,}003 = 0{,}002,\qquad
          \Delta V = e\cdot\tfrac43\pi = 8{,}378\cdot10^{-3}
          $$
      - tipo: calcular
        titulo: La componente y del vector de rotación
        pregunta: |
          Con $\vec\omega = \omega_{zy}\hat{\imath} + \omega_{xz}\hat{\jmath} + \omega_{yx}\hat{k}$
          (ec. 3.39), ¿cuánto vale la componente según y, en milésimas de
          radián?
        respuesta:
          tipo: numero
          valor: '-1'
          tolerancia: 0.001
          formato: un número con su signo, en milésimas de radián
        distractores:
          - valor: '1'
            mensaje: |
              El signo: $\omega_{xz} = \tfrac12(u_{,z} - w_{,x})$, con $u_{,z}$
              delante (ec. 3.34). Al revés sale el giro contrario.
          - valor: '-2'
            mensaje: |
              Falta el ½: la parte antisimétrica es
              $\omega_{ij} = \tfrac12(g_{ij} - g_{ji})$ (ec. 3.32).
          - valor: '0'
            mensaje: |
              $\tfrac12(u_{,z} + w_{,x}) = 0$ es $\varepsilon_{xz}$, la parte
              **simétrica**. El giro sale de la diferencia.
        pista: |
          $\omega_{xz} = \tfrac12\left(\dfrac{\partial u}{\partial z} - \dfrac{\partial w}{\partial x}\right)$.
        desarrollo: |
          $$
          \omega_{xz} = \tfrac12(-0{,}001 - 0{,}001) = -0{,}001,\qquad
          \omega_{zy} = \tfrac12(w_{,y} - v_{,z}) = 0,\qquad
          \omega_{yx} = \tfrac12(v_{,x} - u_{,y}) = 0
          $$

          $\vec\omega = -0{,}001\,\hat\jmath$: la esfera gira 0,001 rad
          alrededor del eje y, en sentido negativo.
      - tipo: calcular
        titulo: La deformación principal mayor
        pregunta: |
          ¿Cuánto vale la deformación principal mayor, $\varepsilon_1$, en
          milésimas?
        respuesta:
          tipo: numero
          valor: '3'
          tolerancia: 0.001
          formato: un número, en milésimas
        distractores:
          - valor: '2'
            mensaje: |
              Es la mayor del plano xy. Pero z también es principal
              ($\varepsilon_{xz} = \varepsilon_{yz} = 0$), y
              $\varepsilon_z = 0{,}003$ es mayor.
          - valor: '2.5'
            mensaje: |
              Es el radio del círculo de Mohr del plano xy. La principal es
              centro más radio, $-0{,}0005 + 0{,}0025$, y además hay que
              compararla con $\varepsilon_z$.
        pista: |
          El tensor no acopla z con x ni con y: z es principal, y en el plano
          xy queda un problema de 2 × 2.
        desarrollo: |
          $$
          [\varepsilon] = \begin{bmatrix} 0{,}001 & 0{,}002 & 0\\ 0{,}002 & -0{,}002 & 0\\ 0 & 0 & 0{,}003 \end{bmatrix}
          $$

          En xy: centro $-0{,}0005$ y radio $\sqrt{0{,}0015^{2} + 0{,}002^{2}} = 0{,}0025$,
          principales $0{,}002$ y $-0{,}003$. Con $\varepsilon_z = 0{,}003$:
          $\varepsilon_1 = 0{,}003$ (z), $\varepsilon_2 = 0{,}002$ y
          $\varepsilon_3 = -0{,}003$.
      - tipo: calcular
        titulo: La dirección de la principal menor
        pregunta: |
          La dirección de $\varepsilon_3$ está en el plano xy. ¿Qué ángulo
          forma con x, en grados, entre −90 y 90 y antihorario desde x?
        respuesta:
          tipo: numero
          valor: '-63.43'
          tolerancia: 0.05
          formato: un número con su signo, en grados
        distractores:
          - valor: '26.57'
            mensaje: |
              Es la dirección de $\varepsilon_2$, la otra del plano:
              $\tan 2\theta = 2\varepsilon_{xy}/(\varepsilon_x - \varepsilon_y) = 4/3$
              da las dos, a 90° una de otra. La de $\varepsilon_3$ es la de
              $-63{,}43^{\circ}$.
          - valor: '63.43'
            mensaje: |
              El signo. Comprueba con la ec. 3.55: en la dirección
              $(1, 2)/\sqrt5$ sale
              $\varepsilon_u = (0{,}001 - 0{,}008 + 0{,}008)/5 = 0{,}0002$, que
              no es ninguna de las principales. La del ángulo negativo sí lo es.
        pista: |
          $([\varepsilon] - \varepsilon_3[I])\{n\} = 0$ con
          $\varepsilon_3 = -0{,}003$: la primera fila da
          $0{,}004\,n_x + 0{,}002\,n_y = 0$.
        desarrollo: |
          $0{,}004\,n_x + 0{,}002\,n_y = 0$ da $n_y = -2n_x$:
          $\vec n_3 = (1, -2, 0)/\sqrt5$, a
          $\arctan(-2) = -63{,}43^{\circ}$ de x. La de $\varepsilon_2$ es
          $(2, 1, 0)/\sqrt5$, a $26{,}57^{\circ}$, y la de $\varepsilon_1$, el
          eje z.
      - tipo: calcular
        titulo: El diámetro que más se acorta
        pregunta: |
          ¿Cuánto cambia la longitud del diámetro que más se acorta, en
          milésimas de la unidad?
        respuesta:
          tipo: numero
          valor: '-6'
          tolerancia: 0.005
          formato: un número con su signo, en milésimas
        distractores:
          - valor: '-3'
            mensaje: |
              Es el cambio del radio, $\varepsilon_3 R$. El diámetro mide
              $2R$: cambia $2\varepsilon_3 R$.
          - valor: '-4'
            mensaje: |
              Es el diámetro del eje y, $2\varepsilon_y$. No es el que más se
              acorta: el mínimo está en la dirección principal de
              $\varepsilon_3$, que no es la de y.
          - valor: '6'
            mensaje: |
              Ese es el que más se **alarga**, el del eje z
              ($2\varepsilon_1$). El que más se acorta es el de $\varepsilon_3$.
        pista: |
          Un diámetro de dirección $\vec n$ cambia $2R\,\varepsilon_n$, y
          $\varepsilon_n$ es extremo en las direcciones principales.
        desarrollo: |
          $\Delta D_{min} = 2\varepsilon_3 R = 2\cdot(-0{,}003) = -0{,}006$:
          el diámetro de dirección $(1, -2, 0)/\sqrt5$ pasa a medir 1,994. El
          de máxima longitud es el del eje z, el $CC'$, que pasa a medir 2,006.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Los desplazamientos de A, B y C son las columnas del gradiente
              $[g]$ (ec. 3.28).
          - texto: >-
              La parte simétrica es $[\varepsilon]$ y su traza,
              $e = 0{,}002$, da $\Delta V = e\cdot\tfrac43\pi$.
          - texto: >-
              La antisimétrica da $\vec\omega = -0{,}001\,\hat\jmath$: un giro
              de 0,001 rad alrededor de y.
          - texto: >-
              Principales: 0,003 en z, 0,002 y $-0{,}003$ en el plano xy, a
              26,57° y $-63{,}43$° de x.
          - texto: >-
              El diámetro más largo es el de z (2,006) y el más corto, el de
              $(1, -2, 0)/\sqrt5$ (1,994).
          - texto: >-
              Como $\vec\omega \neq 0$, la esfera no se deforma: solo gira.
            trampa: true
            mensaje: |
              El gradiente tiene parte simétrica y antisimétrica a la vez
              (ec. 3.30): la esfera gira **y** se deforma. Su volumen crece
              un 0,2 %.
    resolucion: |
      **1) El campo.** Como O no se mueve y el campo es lineal, cada punto
      de un eje da una columna de la matriz gradiente (ec. 3.28, apuntes del
      tema 3, p. 11): $\vec\delta_A = \vec A' - \vec A = (0{,}001;\ 0{,}002;\ 0{,}001)$
      es $(c_1, c_4, c_7)$; $\vec\delta_B = (0{,}002;\ -0{,}002;\ 0)$ es
      $(c_2, c_5, c_8)$; $\vec\delta_C = (-0{,}001;\ 0;\ 0{,}003)$ es
      $(c_3, c_6, c_9)$:

      $$
      \begin{aligned}
      u &= 0{,}001x + 0{,}002y - 0{,}001z\\
      v &= 0{,}002x - 0{,}002y\\
      w &= 0{,}001x + 0{,}003z
      \end{aligned}
      $$

      **2) El tensor gradiente** y su reparto en simétrica y antisimétrica
      (ecs. 3.30 a 3.34, pp. 11-12):

      $$
      [g] = \begin{bmatrix} 0{,}001 & 0{,}002 & -0{,}001\\ 0{,}002 & -0{,}002 & 0\\ 0{,}001 & 0 & 0{,}003 \end{bmatrix},\qquad
      [\varepsilon] = \begin{bmatrix} 0{,}001 & 0{,}002 & 0\\ 0{,}002 & -0{,}002 & 0\\ 0 & 0 & 0{,}003 \end{bmatrix},\qquad
      [\omega] = \begin{bmatrix} 0 & 0 & -0{,}001\\ 0 & 0 & 0\\ 0{,}001 & 0 & 0 \end{bmatrix}
      $$

      **3) El volumen.** $e = \varepsilon_x + \varepsilon_y + \varepsilon_z = 0{,}002$
      (ec. 3.59, p. 18), y con $V = \tfrac43\pi$:
      $\Delta V = 0{,}002\cdot4{,}18879 = 8{,}378\cdot10^{-3}$. La esfera
      gana un 0,2 % de volumen.

      **4) La rotación.** Con la ec. 3.39 (p. 13),
      $\vec\omega = \omega_{zy}\hat\imath + \omega_{xz}\hat\jmath + \omega_{yx}\hat k$,
      y $\omega_{xz} = \tfrac12(u_{,z} - w_{,x}) = -0{,}001$, las otras dos
      nulas: $\vec\omega = -0{,}001\,\hat\jmath$. La esfera gira **0,001 rad
      alrededor del eje y**, en sentido negativo (horario visto desde +y).
      Es el $\tfrac12\,\mathrm{rot}\,\vec\delta$; el giro mueve C en
      $\vec\omega\times\vec r_C = (-0{,}001;\ 0;\ 0)$, que es justo la x de
      su desplazamiento: la parte simétrica no la mueve en x.

      **5) Las principales.** z ya es principal, con 0,003. En el plano xy,
      centro $-0{,}0005$ y radio $\sqrt{0{,}0015^{2} + 0{,}002^{2}} = 0{,}0025$:

      $$
      \varepsilon_1 = 0{,}003\ (z),\qquad
      \varepsilon_2 = 0{,}002\ \left(\tfrac{(2, 1, 0)}{\sqrt5}\right),\qquad
      \varepsilon_3 = -0{,}003\ \left(\tfrac{(1, -2, 0)}{\sqrt5}\right)
      $$

      con $\tan 2\theta = 4/3$: 26,57° y $-63{,}43$° desde x.

      **6) Los diámetros.** Un diámetro de dirección $\vec n$ pasa a medir
      $2(1 + \varepsilon_n)$, y $\varepsilon_n$ es máxima y mínima en las
      direcciones principales, que se buscan como las de tensión (apartado
      3.6, p. 17). El más largo es el del eje z, $CC'$: **2,006**. El más
      corto, el de dirección $(1, -2, 0)/\sqrt5$: **1,994**.

      Cada cifra sale del motor del curso (las principales del tensor, la
      deformación de una dirección) y de un segundo camino: el campo escrito a
      mano evaluado en A, B y C, el determinante de $[I] + [g]$ (que da
      $e = 0{,}001992$, lo mismo a primer orden), el rotacional y el círculo de
      Mohr del plano xy.


  # ── Parte 1 · problema 3 · el triángulo, deformación plana y Mohr-Coulomb.
  - id: exerm2526-ord-7-el-triangulo-en-deformacion-plana
    titulo: El triángulo con tres tensiones conocidas en deformación plana, y el criterio de Mohr-Coulomb
    fuente: >-
      Problema 3 de la parte 1 · Examen final del 16 de enero de 2026 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 2 puntos. Transcrito de una foto de la hoja
      impresa. El examen no publica resolución; el desarrollo es nuestro,
      con los convenios de los temas 2, 4 y 6.
    nivel: examen
    enunciado: |
      (2p) El estado de tensiones de un sólido elástico queda definido por
      las tensiones unitarias normales y tangenciales en las direcciones
      indicadas en la figura adjunta, conociéndose los valores:

      a = 15 MPa, b = 10 MPa, c = 15√2 MPa.

      Por otra parte se trata de un estado de deformación plana (deformación
      nula en dirección perpendicular al plano de la figura).

      Las constantes elásticas son E = 30 · 10³ Mpa y ν = 1/3.

      Se pide:

      a) Las componentes del tensor de tensiones en coordenadas
      cartesianas.

      b) Las tensiones y direcciones principales

      c) Las componentes del tensor de deformaciones, así como la máxima
      deformación tangencial y la deformación volumétrica.

      d) Calcular si el material alcanza o no la condición de fallo según el
      criterio de  Mohr-Coulomb, con c = 5 MPa y φ = 30°.

