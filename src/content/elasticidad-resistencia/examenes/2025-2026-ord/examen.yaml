curso: '2025-2026'
convocatoria: ordinaria
fecha: 16 de enero de 2026
# El examen final de Elasticidad y Resistencia de Materiales del 16 de enero
# de 2026. Son dos partes de 10 puntos cada una, en hojas separadas:
#
# - la **parte 1** (temas 2 a 6): una hoja de teoría con cuatro cuestiones de
#   1 punto y tres hojas de problemas, uno de 2 puntos en cada una;
# - la **parte 2** (temas 8 a 13): una hoja de teoría con tres cuestiones
#   (1,25, 1,25 y 1,5 puntos) y una de problemas con dos (3,5 y 2,5 puntos).
#
# Aquí están las dos partes: la 1, resuelta aquí; la 2, la de la segunda
# parte del mismo día (punto 3).
#
# 1. **LA FUENTE SON FOTOS DE MÓVIL.** Llegaron fotos de las seis hojas. Las
#    fotos de exámenes no se publican nunca: no hay PDF, y `sinPdf` lo dice.
#    Todas las figuras están redibujadas. Cada hoja es bilingüe, castellano a
#    la izquierda y euskera a la derecha, y se transcribe **solo la columna en
#    castellano**, tal cual.
#
# 2. **LA NUMERACIÓN.** Cada parte numera su teoría y sus problemas desde 1.
#    Aquí van seguidos: la teoría de la parte 1 es n 1 a 4, sus problemas n 5
#    a 7, la teoría de la parte 2 n 8 a 10 y sus problemas n 11 y 12. La
#    `fuente` de cada ejercicio dice el nombre impreso. El número impreso no
#    se copia en el enunciado, que empieza por sus puntos, «(1p)» o «(2p)»,
#    como en los parciales de 2022-2023. Ninguna pregunta se parte.
#
# 3. **LA PARTE 2 ES LA SEGUNDA PARTE.** La parte 2 sola es también la
#    segunda parte (`2025-2026-2par`): se entiende que quien aprobó el primer
#    parcial hizo solo esa parte, el mismo día y en las mismas hojas. En
#    enero de 2023 la segunda parte (`2022-2023-2par`) y el final fueron
#    hojas distintas que compartían preguntas; aquí las hojas son las mismas.
#    Las n 8 a 12 son sus cinco ejercicios, con los mismos puntos (lección
#    16): se resuelven allí y esta convocatoria apunta a ellos.
#
# 4. **LO QUE EL TEXTO NO DICE Y LA FIGURA SÍ.** Problema 1: el prisma mide 1
#    m en la dirección de los cables (z), y la presión actúa en las caras
#    perpendiculares a y, como dibujan las flechas; ninguna figura lleva el
#    rótulo «1b» que cita el texto. En la vista de la microfisura el arco de
#    60° sale del eje y; la figura redibujada lo saca de una paralela a y, y
#    la tangencial pedida es la misma con las dos lecturas. Problema 3: x
#    horizontal e y vertical; las flechas sin letra son las tensiones que no
#    se dan. Teoría 2: no nombra el coeficiente de dilatación, y el
#    resultado lo lleva; las paredes de la cavidad se toman lisas. Cada
#    lectura va en la nota de su enunciado.
#
# 5. **GRAFÍAS DEL TEXTO, CONSERVADAS**: «EL cubo» (teoría 2), «4 (1p)» sin
#    punto y el enunciado sin punto final (teoría 4), «0.3 )» con el espacio
#    y «Tensión en los cables . .» (problema 1), «En la esfera de radio
#    unitario representado … experimenta» y «esfera,O» (problema 2),
#    «E = 30 · 10³ Mpa» (problema 3). Los dobles espacios de «el tensor
#    gradiente» (problema 2) y «criterio de Mohr-Coulomb» (problema 3) se
#    publican como uno. En la parte 1, la columna en euskera imprime
#    «1. ZATIA» y la de castellano no imprime nada: «PARTE 1» está escrito a
#    mano en la teoría y en los problemas 1 y 3. Las hojas de la parte 2 sí
#    imprimen «PARTE 2». Un rastro de lápiz entre «Tensión» y «en», en el
#    apartado a del problema 1, y otra marca pequeña entre «0.3» y «)» no se
#    transcriben.
#
# 6. **EL EUSKERA.** Pide lo mismo en las siete preguntas de la parte 1,
#    salvo en la forma: en el problema 1 junta los apartados b y c en uno
#    (las principales y la variación de volumen) y el d pasa a ser el c, y da
#    los 200 GPa del acero como «E = 200 GPa»; en el problema 2, el
#    apartado 1 lleva un «1» suelto y el 6 acaba en «Kalkulatu.».
#
# 7. **PREGUNTAS REPETIDAS.**
#    - La **teoría 1** es, palabra por palabra y con su «(1p)», la cuestión 1
#      del parcial 1 de 2018-2019: se reutiliza su ejercicio,
#      `exerm1819-1par-1-el-tetraedro-de-cauchy`.
#    - La **teoría 4** es la cuestión 4 de los parciales 1 de 2015-2016 y de
#      2016-2017 con otra palabra («Deduce» por «Deducir»): va un ejercicio
#      propio, con otro ejemplo, y su `fuente` lo dice.
#    - El **problema 1** es de la familia de los prismas entre placas rígidas
#      unidas por cables de 2012-2013 y 2014-2015 (cuatro cables y otros
#      datos, sin la microfisura): ejercicio propio.
#    - Las demás no están en el sitio. El problema 3 es el primero del sitio
#      con el criterio de Mohr-Coulomb (cohesión y ángulo de rozamiento), que
#      los apuntes no desarrollan: la resolución lo lleva al criterio de
#      Mohr del tema 6 con la recta intrínseca.
#
# 8. **LOS TEMAS.** El problema 1 va al tema 4 (Hooke, con la compatibilidad
#    de los cables); el 2, al 3; el 3, al 2 (su núcleo es el tensor desde las
#    tensiones de tres caras), aunque acaba en el 4 y en el 6.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso y de un segundo camino (fase-p/p9h,
# guiones/cifras.mjs).
sinPdf: >-
  El enunciado solo ha llegado en fotos de las hojas impresas, y las fotos de
  exámenes no se publican: la transcripción de cada pregunta es la única
  versión, y las figuras están redibujadas. El examen tiene dos partes de 10
  puntos en hojas separadas, la 1 (temas 2 a 6) y la 2 (temas 8 a 13).
puntosImpresos:
  fuente: Cabecera de cada pregunta, «(1p)» y «(2p)» en la parte 1 y «(1,25p)», «(1.25p)», «(1.5p)», «(3.5p)» y «(2.5p)» en la parte 2, cada una sobre 10.
  reparto:
    - { n: 1, puntos: 1 }
    - { n: 2, puntos: 1 }
    - { n: 3, puntos: 1 }
    - { n: 4, puntos: 1 }
    - { n: 5, puntos: 2 }
    - { n: 6, puntos: 2 }
    - { n: 7, puntos: 2 }
    - { n: 8, puntos: 1.25 }
    - { n: 9, puntos: 1.25 }
    - { n: 10, puntos: 1.5 }
    - { n: 11, puntos: 3.5 }
    - { n: 12, puntos: 2.5 }

