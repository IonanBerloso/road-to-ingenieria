      <title id="exerm1516-1par-7-la-seccion-de-alas-desiguales-a-flexion-esviada-en-t">La sección a escala con su centro de gravedad, el eje neutro y las dos esquinas más cargadas</title>
      <desc id="exerm1516-1par-7-la-seccion-de-alas-desiguales-a-flexion-esviada-en-d">La sección dibujada a escala: alma de 22t de alto a la izquierda, ala de 10t arriba y de 20t abajo, todo de espesor t. G, el centro de gravedad, está a 5,2t de la cara exterior del alma y a 13,1t de la cara de arriba. Por G pasan el eje z, horizontal hacia la derecha, y el eje y, hacia abajo. El eje neutro, a trazos, pasa por G y sube hacia la derecha formando 14,8° con z. Por debajo de él la sección está comprimida (signo menos) y por encima, traccionada (signo más). La esquina de abajo a la derecha del ala de abajo, P, es la más alejada por el lado comprimido; la de arriba a la izquierda, Q, la más alejada por el lado traccionado.</desc>
