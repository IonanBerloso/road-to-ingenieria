      </svg>
      <figcaption>

      Redibujada del Word original, a escala. El PDF pierde el rayado de los
      cuatro apoyos (deja sus rectángulos vacíos); lo demás, cotas, barras,
      resorte y carga, coincide.

      </figcaption>
      </figure>

      **Notas nuestras.** El apoyo de E es un triángulo con dos rodillos
      contra una pared vertical. La figura dibuja el pasador de B
      encima de la viga y el de C debajo; se toman los dos en el eje de la
      viga, como A. Las cotas ponen E sobre A, a una altura $a$, así que la
      barra 1 va de E a B a 45° y mide $a\sqrt2$; la 2 es vertical y mide $a$.
    pide: >-
      a) El giro θ de la viga, en función de P/(EA). b) El desplazamiento
      vertical de E, en función de Pa/(EA). Además, las fuerzas en las dos
      barras y en el resorte.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de plantear nada: ¿qué movimiento tiene permitido el nudo E?
        opciones:
          - texto: >-
              Solo vertical: los rodillos contra la pared le impiden moverse en
              horizontal, y en vertical lo sujeta el resorte, que se estira lo
              que baje E
            correcta: true
            mensaje: |
              Eso es. E es un nudo con una incógnita de desplazamiento,
              $\delta_E$, y una ecuación de equilibrio vertical: el resorte
              equilibra la componente vertical de la barra 1. Junto con el
              giro $\theta$ de la viga, son dos incógnitas cinemáticas.
          - texto: >-
              Ninguno: E es un apoyo fijo, como D, y la barra 1 se alarga lo
              que baja B proyectado sobre ella
            mensaje: |
              Los rodillos solo impiden el movimiento perpendicular a la pared.
              Con E fijo saldría $\theta = 0{,}2297\,P/(EA)$: es otra
              estructura, más rígida, en la que la barra 1 se lleva parte de
              la carga.
          - texto: >-
              Puede moverse en vertical sin ninguna oposición: la barra 1 no
              lleva fuerza y la viga cuelga solo de la barra 2
            mensaje: |
              El resorte sí se opone, aunque poco: $k = EA/(100a)$ es la
              rigidez de una barra igual a las otras pero cien veces más
              larga. Sin él, $\theta = P/(4EA)$ exactamente; con él, un poco
              menos, y la barra 1 lleva una fuerza pequeña pero no nula.
      - tipo: calcular
        titulo: El giro de la viga
        pregunta: |
          La viga gira en sentido horario (B y C bajan). ¿Cuánto vale ese giro
          $\theta$, en unidades de $P/(EA)$?
        respuesta:
          tipo: numero
          valor: '0.2494'
          tolerancia: 0.0003
          formato: un número (θ multiplicado por EA/P), con cuatro decimales
        distractores:
          - valor: '0.25'
            mensaje: |
              Es el giro sin resorte, $P/(4EA)$. El resorte es blando pero no
              nulo: la barra 1 lleva una fuerza pequeña y el giro baja un poco
              de $0{,}25\,P/(EA)$.
          - valor: '0.2297'
            mensaje: |
              Es el giro con E fijo: la barra 1 trabajaría entera y frenaría
              la viga. Pero E baja casi lo mismo que B, porque el resorte que
              lo sujeta es muy blando; la barra 1 apenas se alarga.
          - valor: '0.4976'
            mensaje: |
              Has tomado para C el descenso de B, $a\theta$, en lugar de
              $2a\theta$. C está al doble de distancia de A: la barra 2 se
              acorta $2a\theta$, y su fuerza, $2EA\theta$, actúa con brazo
              $2a$. Por eso la barra 2 pesa cuatro veces en la ecuación.
        pista: |
          Dos incógnitas: el giro $\theta$ y el descenso $\delta_E$ de E. El
          equilibrio vertical de E da $\delta_E$ en función de $\theta$; el de
          momentos de la viga en A cierra el problema.
        desarrollo: |
          Con $\delta_E$ hacia abajo y $\theta$ horario, la barra 1 se alarga
          $(a\theta - \delta_E)/\sqrt2$ y la 2 se acorta $2a\theta$. El
          equilibrio de E, $k\,\delta_E = N_1/\sqrt2$, da
          $\delta_E = 100\,a\theta/D$ con $D = 100 + 2\sqrt2 = 102{,}83$. Los
          momentos en A:

          $$
          P = 4EA\,\theta + \frac{EA\,\theta}{D}
          \quad\Longrightarrow\quad
          \theta = \frac{D}{4D + 1}\,\frac{P}{EA} = 0{,}2494\,\frac{P}{EA}
          $$
      - tipo: calcular
        titulo: El desplazamiento vertical de E
        pregunta: |
          ¿Cuánto baja E, en unidades de $Pa/(EA)$? (Positivo si baja.)
        respuesta:
          tipo: numero
          valor: '0.2425'
          tolerancia: 0.0003
          formato: un número (el descenso de E por EA/(Pa)), con cuatro decimales
        distractores:
          - valor: '0.2494'
            mensaje: |
              Es $a\theta$, lo que baja B: E bajaría eso si la barra 1 no se
              alargara. Se alarga un poco, porque tiene que tirar del resorte,
              y E se queda algo más arriba: $\delta_E = 100\,a\theta/(100 + 2\sqrt2)$.
          - valor: '0.1763'
            mensaje: |
              Has proyectado el descenso de B sobre la barra 1,
              $a\theta/\sqrt2$. Esa proyección es parte del alargamiento de la
              barra, no el movimiento de E. E solo se mueve en vertical, y su
              descenso sale del equilibrio con el resorte.
          - valor: '-0.2425'
            mensaje: |
              El valor es ese y el sentido no: E **baja**. La barra 1 tira de
              E hacia B, hacia abajo, y el resorte se estira para equilibrarla.
        pista: |
          $\delta_E = \dfrac{100\,a\theta}{100 + 2\sqrt2}$, con el $\theta$
          del paso anterior.
        desarrollo: |
          $$
          \delta_E = \frac{100}{102{,}83}\,a\theta = 0{,}9725\cdot0{,}2494\,\frac{Pa}{EA} = 0{,}2425\,\frac{Pa}{EA}
          $$

          hacia abajo. E baja un 97 % de lo que baja B.
      - tipo: calcular
        titulo: La fuerza en la barra 2
        pregunta: |
          ¿Cuánto vale $N_2/P$, con su signo (tracción positiva)?
        respuesta:
          tipo: numero
          valor: '-0.4988'
          tolerancia: 0.0005
          formato: un número (N2 dividido por P)
        distractores:
          - valor: '0.4988'
            mensaje: |
              El valor es ese y el signo no. C baja y se acerca a D: la barra 2
              se **acorta** y queda a compresión, empujando la viga hacia
              arriba.
          - valor: '-0.4594'
            mensaje: |
              Es $N_2$ con E fijo. Con el resorte la barra 1 casi no trabaja,
              y la barra 2 se lleva casi toda la carga: $N_2 \approx -P/2$.
        pista: |
          $N_2 = EA\,\Delta L_2/a$ con $\Delta L_2 = -2a\theta$.
        desarrollo: |
          $N_2 = -2EA\,\theta = -2\cdot0{,}2494\,P = -0{,}4988\,P$
          (compresión). La barra 1: $N_1 = \sqrt2\,EA\,\theta/D = 0{,}0034\,P$,
          a tracción; el resorte, $k\,\delta_E = 0{,}0024\,P$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              La viga solo puede girar un $\theta$ alrededor de A: B baja
              $a\theta$ y C baja $2a\theta$. E solo puede bajar, un $\delta_E$.
          - texto: >-
              Compatibilidad: la barra 1 se alarga $(a\theta - \delta_E)/\sqrt2$
              y la barra 2 se acorta $2a\theta$.
          - texto: >-
              Comportamiento: $N_1 = EA(a\theta - \delta_E)/(2a)$,
              $N_2 = -2EA\theta$ y el resorte tira de E hacia arriba con
              $k\,\delta_E$.
          - texto: >-
              Equilibrio de E: $k\,\delta_E = N_1/\sqrt2$, de donde
              $\delta_E = 100\,a\theta/(100 + 2\sqrt2)$.
          - texto: >-
              Momentos en A: $Pa - aN_1/\sqrt2 + 2aN_2 = 0$, y
              $\theta = 0{,}2494\,P/(EA)$.
          - texto: >-
              Los rodillos de E impiden que se mueva, así que E está fijo y el
              resorte no trabaja.
            trampa: true
            mensaje: |
              Los rodillos solo impiden el movimiento perpendicular a la
              pared, el horizontal. En vertical E se mueve, y el resorte se
              estira justo lo que baja: es lo que lo sujeta.
    resolucion: |
      **Qué es cada cosa.** La viga ABC es rígida y está articulada en A: su
      único movimiento es un giro $\theta$, horario, con el que B baja
      $a\theta$ y C baja $2a\theta$. El nudo E está contra una pared con
      rodillos: no se mueve en horizontal, y en vertical baja un $\delta_E$
      que fija el resorte. Hay dos incógnitas cinemáticas, $\theta$ y
      $\delta_E$, y dos ecuaciones de equilibrio útiles: momentos de la viga
      en A y fuerzas verticales en E.

      **Compatibilidad** (apartado 8.4 de los apuntes, ec. 8.12: el
      alargamiento es la diferencia de las proyecciones de los
      desplazamientos de los extremos sobre la barra). La barra 1 va de
      $E = (0,\ a)$ a $B = (a,\ 0)$, con $\hat{e}_1 = (1,\ -1)/\sqrt2$:

      $$
      \Delta L_1 = \left[(0,\ -a\theta) - (0,\ -\delta_E)\right]\cdot\hat{e}_1 = \frac{a\theta - \delta_E}{\sqrt2}
      $$

      La barra 2 es vertical: C baja $2a\theta$ hacia D y
      $\Delta L_2 = -2a\theta$. El resorte se estira $\delta_E$.

      **Comportamiento** ($\Delta L = NL/EA$, ec. 8.9). Con $L_1 = a\sqrt2$ y
      $L_2 = a$:

      $$
      N_1 = \frac{EA\,(a\theta - \delta_E)}{2a},\qquad N_2 = -2EA\,\theta,\qquad F_k = k\,\delta_E = \frac{EA\,\delta_E}{100a}
      $$

      **Equilibrio de E.** La barra 1, a tracción, tira de E hacia B, con
      componente vertical $N_1/\sqrt2$ hacia abajo; el resorte tira hacia
      arriba. La pared se lleva la horizontal:

      $$
      \frac{EA\,\delta_E}{100a} = \frac{EA\,(a\theta - \delta_E)}{2\sqrt2\,a}
      \quad\Longrightarrow\quad
      \delta_E = \frac{100}{100 + 2\sqrt2}\,a\theta = \frac{100}{D}\,a\theta
      $$

      con $D = 100 + 2\sqrt2 = 102{,}83$. Llevado a $N_1$:
      $N_1 = \sqrt2\,EA\,\theta/D$.

      **Equilibrio de la viga.** Momentos en A, horario positivo: $P$ baja
      en B con brazo $a$; la barra 1 tira de B hacia arriba con
      $N_1/\sqrt2$; la barra 2, comprimida, empuja C hacia arriba con
      $-N_2$ y brazo $2a$:

      $$
      Pa - a\,\frac{N_1}{\sqrt2} + 2a\,N_2 = 0
      \quad\Longrightarrow\quad
      P = \frac{EA\,\theta}{D} + 4EA\,\theta
      $$

      **a/ El giro.**

      $$
      \theta = \frac{D}{4D + 1}\,\frac{P}{EA} = \frac{102{,}83}{412{,}31}\,\frac{P}{EA} = 0{,}2494\,\frac{P}{EA}
      $$

      en sentido horario.

      **b/ El desplazamiento de E.**

      $$
      \delta_E = \frac{100}{D}\,a\theta = \frac{100}{4D + 1}\,\frac{Pa}{EA} = 0{,}2425\,\frac{Pa}{EA}
      $$

      hacia abajo. Las fuerzas: $N_2 = -0{,}4988\,P$ (compresión),
      $N_1 = 0{,}0034\,P$ (tracción) y el resorte, $0{,}0024\,P$.

      **Lo que enseña el resultado.** El resorte es cien veces más blando
      que una barra de longitud $a$: E baja casi lo mismo que B (un 97 %), la
      barra 1 apenas se alarga y casi toda la carga va a la barra 2. Si el
      resorte no estuviera, $\theta = P/(4EA) = 0{,}25\,P/(EA)$ y
      $N_2 = -P/2$: el resultado exacto se separa de ese límite menos de
      un 0,3 %. Con E fijo, en cambio, la barra 1 trabajaría y
      $\theta = 0{,}2297\,P/(EA)$.

      **Comprobaciones.** El motor del curso (`resuelveBarras`, con ABC como
      sólido rígido articulado en A, E como nudo con una deslizadera que le
      impide el movimiento horizontal y el resorte como una barra de
      rigidez $k$) da los mismos $\theta$, $\delta_E$, $N_1$ y $N_2$, y sus
      fuerzas cumplen los momentos en A y el equilibrio vertical de E. Con
      $k \to 0$ da $\theta = P/(4EA)$.

  # ── Problema 2 · la roseta a 0°, 90° y 150°: principales y el plano normal a c.
  - id: exerm1516-1par-6-la-roseta-y-el-plano-normal-a-c
    titulo: Tres galgas sobre un triángulo rectángulo, y el vector tensión en el plano normal a una de ellas
    fuente: >-
      Ejercicio 2 · Primer parcial de 2015-2016 (hoja de ejercicios del 16 de
      noviembre de 2015) · Elasticidad y Resistencia de Materiales, Escuela
      Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 2 puntos. El
      examen no publica resolución; el desarrollo es nuestro, con los
      convenios de los temas 2, 3 y 4 (ec. 3.55 para las galgas y tensión
      plana, ecs. 4.24 y 4.25).
    nivel: examen
    enunciado: |
      (2p) Las galgas extensométricas de la figura proporcionan las
      siguientes medidas:

      $\varepsilon_a$= 1100·10⁻⁶; $\varepsilon_b$ = 200·10⁻⁶; $\varepsilon_c$ = 200·10⁻⁶

      Determinar:

      a) Deformaciones y direcciones principales.

      b) Las componentes intrínsecas del vector tensión en el plano
      perpendicular a la dirección $c$.

      Datos: $E$ = 42 MPa ; $\nu$ = 0,35.

