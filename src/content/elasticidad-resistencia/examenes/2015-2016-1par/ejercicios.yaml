      <figcaption>

      Redibujada del Word original, con sus proporciones: no está a escala,
      y el espesor se ve más grueso de lo que es. El original lleva además,
      a la derecha del ala de abajo, una línea suelta sin rótulo que sigue
      su cara de arriba y sube al final; no es parte de la sección y aquí
      no se dibuja.

      </figcaption>
      </figure>

      **Notas nuestras.** Las cotas se leen como las dibuja la figura: 10$t$
      es el ancho total del ala de arriba y 20$t$ el del ala de abajo, los
      dos desde la cara exterior del alma, y el 20$t$ vertical va entre las
      caras interiores de las dos alas. Todo tiene espesor $t$, así que la
      sección mide 22$t$ de alto. Los ejes $y$, $z$ son los que pasan por el
      centro de gravedad G (la figura los dibuja a ojo). $M_0$ es un vector
      momento a 20° por encima de $+z$.
    pide: >-
      La posición de G, Iz, Iy e Iyz en función de t, el eje neutro, el punto
      de máxima compresión y el espesor t (en cm).
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué hace falta para la tensión en esta sección?
        opciones:
          - texto: >-
              La fórmula general de la flexión esviada (ec. 9.11): la sección
              no tiene ningún eje de simetría, $I_{yz} \ne 0$, y el momento
              tiene componente según $y$ y según $z$
            correcta: true
            mensaje: |
              Eso es. Los ejes $y$, $z$ por G no son principales: hay que usar
              la 9.11 con $I_{yz}$, o pasar a ejes principales con el círculo
              de Mohr de inercias y descomponer allí el momento. Las dos dan
              lo mismo.
          - texto: >-
              $\sigma = M_0\,y/I_z$, porque el momento es casi horizontal
            mensaje: |
              Con $I_{yz} = 0$ y $M_0$ según $z$ valdría, pero aquí ninguna de
              las dos cosas se cumple: la componente $M_y$ es un 36 % de
              $M_z$, y el producto de inercia es grande, porque el ala larga
              está abajo y a la derecha.
          - texto: >-
              Como el momento forma 20° con $z$, el eje neutro también forma
              20° con $z$
            mensaje: |
              El eje neutro tiene la dirección del momento solo cuando el
              momento va según un eje principal de inercia. Si no, se tuerce
              hacia el eje principal de inercia mínima. Aquí el momento cae a
              2,2° del eje principal de inercia máxima, y el eje neutro sale
              a 14,8°.
      - tipo: calcular
        titulo: La altura del centro de gravedad
        pregunta: |
          ¿A qué distancia de la cara de arriba de la sección está G, en
          unidades de $t$?
        respuesta:
          tipo: numero
          valor: '13.1'
          tolerancia: 0.01
          formato: un número (la distancia dividida por t)
        distractores:
          - valor: '11'
            mensaje: |
              Es la mitad de la altura, 22$t$/2. G no está a media altura
              porque el ala de abajo tiene el doble de área que la de arriba
              y tira de él hacia abajo.
          - valor: '12'
            mensaje: |
              Has puesto las alas en sus líneas medias a 20$t$ una de otra y
              el alma de 20$t$, como si las cotas fueran a la línea media, y
              has medido desde la línea media del ala de arriba. Las
              cotas de la figura van a las caras: las alas están a 0,5$t$ y
              21,5$t$ de la cara de arriba.
        pista: |
          Tres rectángulos: ala de arriba 10$t$ × $t$, alma $t$ × 20$t$ y ala
          de abajo 20$t$ × $t$. $\overline{y} = \sum A_i\,y_i / \sum A_i$.
        desarrollo: |
          $A = 10 + 20 + 20 = 50\,t^{2}$ y

          $$
          \overline{y} = \frac{10\cdot0{,}5 + 20\cdot11 + 20\cdot21{,}5}{50}\,t = \frac{655}{50}\,t = 13{,}1\,t
          $$
      - tipo: calcular
        titulo: La posición horizontal del centro de gravedad
        pregunta: |
          ¿A qué distancia de la cara exterior del alma está G, en unidades
          de $t$?
        respuesta:
          tipo: numero
          valor: '5.2'
          tolerancia: 0.01
          formato: un número (la distancia dividida por t)
        distractores:
          - valor: '5'
            mensaje: |
              Es lo que sale con el alma en su línea media, en $z = 0$, y las
              alas desde ahí. El alma está entre $z = 0$ y $z = t$: su centro,
              a 0,5$t$.
          - valor: '8.333'
            mensaje: |
              Te has dejado el alma. Sus 20$t^{2}$ de área están pegados a la
              izquierda y llevan G hacia ella.
        pista: |
          $\overline{z} = \sum A_i\,z_i / \sum A_i$, con $z$ desde la cara exterior
          del alma.
        desarrollo: |
          $$
          \overline{z} = \frac{10\cdot5 + 20\cdot0{,}5 + 20\cdot10}{50}\,t = \frac{260}{50}\,t = 5{,}2\,t
          $$
      - tipo: calcular
        titulo: El momento de inercia respecto de z
        pregunta: |
          ¿Cuánto vale $I_z = \int y^{2}\,dA$ respecto del eje $z$ que pasa
          por G, en unidades de $t^{4}$?
        respuesta:
          tipo: numero
          valor: '3756.17'
          tolerancia: 0.5
          formato: un número (Iz dividido por t⁴)
        distractores:
          - valor: '3089.5'
            mensaje: |
              Falta la inercia propia del alma, $t\,(20t)^{3}/12 = 666{,}7\,t^{4}$.
              En las alas la propia es despreciable ($bt^{3}/12$), pero el
              alma es alta.
          - valor: '669.17'
            mensaje: |
              Son solo las inercias propias de los tres rectángulos. Falta
              Steiner, $A_i\,d_i^{2}$, que aquí es casi todo: las alas están
              a 12,6$t$ y 8,4$t$ de G.
        pista: |
          Cada rectángulo: $\tfrac{b\,h^{3}}{12} + A\,d^{2}$, con $d$ la
          distancia vertical de su centro a G.
        desarrollo: |
          $$
          I_z = \left(\tfrac{10}{12} + 10\cdot12{,}6^{2}\right) + \left(\tfrac{20^{3}}{12} + 20\cdot2{,}1^{2}\right) + \left(\tfrac{20}{12} + 20\cdot8{,}4^{2}\right) = 3756{,}17
          $$

          en $t^{4}$. Igual, $I_y = 1654{,}67\,t^{4}$.
      - tipo: calcular
        titulo: El producto de inercia
        pregunta: |
          ¿Cuánto vale $I_{yz} = \int yz\,dA$, con $y$ hacia abajo y $z$ hacia
          la derecha desde G, en unidades de $t^{4}$?
        respuesta:
          tipo: numero
          valor: '1029'
          tolerancia: 0.5
          formato: un número (Iyz dividido por t⁴)
        distractores:
          - valor: '-1029'
            mensaje: |
              Es el que sale con $y$ hacia arriba. Con los ejes de la figura,
              $y$ hacia abajo, el ala larga está abajo ($y > 0$) y a la
              derecha ($z > 0$): su término, el mayor, es positivo.
        pista: |
          Sin término propio (los tres rectángulos tienen los lados
          paralelos a los ejes): $I_{yz} = \sum A_i\,y_i\,z_i$, con
          $(y_i,\ z_i)$ el centro de cada uno respecto de G.
        desarrollo: |
          $$
          I_{yz} = 10\,(-12{,}6)(-0{,}2) + 20\,(-2{,}1)(-4{,}7) + 20\,(8{,}4)(4{,}8) = 25{,}2 + 197{,}4 + 806{,}4 = 1029
          $$

          en $t^{4}$.
      - tipo: calcular
        titulo: El eje neutro
        pregunta: |
          El eje neutro pasa por G y sube hacia $+z$. ¿Qué ángulo forma con
          el eje $z$, en grados?
        respuesta:
          tipo: numero
          valor: '14.80'
          tolerancia: 0.05
          formato: un número, en grados
        distractores:
          - valor: '20'
            mensaje: |
              Es el ángulo del momento. El eje neutro solo tiene la dirección
              del momento cuando este va según un eje principal; aquí los
              principales están a 22,2° por encima de $z$ y a 67,8° por
              debajo, y el eje neutro se tuerce hacia el de inercia mínima.
          - valor: '39.56'
            mensaje: |
              Has hecho $I_{yz} = 0$: con $y$, $z$ principales saldría
              $\operatorname{tg}\beta = (M_y I_z)/(M_z I_y)$. Aquí el producto
              de inercia es grande y el eje neutro queda mucho más tendido.
        pista: |
          $\sigma_x = C_1\,y + C_2\,z$ (ecs. 9.10 y 9.11) y el eje neutro es
          $\sigma_x = 0$: $y/z = -C_2/C_1$.
        desarrollo: |
          Con $M_z = -0{,}9397\,M_0$, $M_y = -0{,}3420\,M_0$ y
          $I_{yz}^{2} - I_yI_z = -5{,}156\cdot10^{6}\,t^{8}$:

          $$
          C_1 = \frac{M_yI_{yz} - M_zI_y}{I_{yz}^{2} - I_yI_z} = -2{,}333\cdot10^{-4}\,\frac{M_0}{t^{3}},\qquad
          C_2 = \frac{M_zI_{yz} - M_yI_z}{I_{yz}^{2} - I_yI_z} = -0{,}6162\cdot10^{-4}\,\frac{M_0}{t^{3}}
          $$

          (con $y$, $z$ en unidades de $t$). Así $y = -0{,}2641\,z$: el eje
          sube hacia $+z$ con $\operatorname{arctg}0{,}2641 = 14{,}80^{\circ}$.
      - tipo: calcular
        titulo: El espesor
        pregunta: |
          ¿Qué espesor $t$ hace que la máxima tensión de compresión sea
          exactamente $\sigma_{adm}$, en cm?
        respuesta:
          tipo: numero
          valor: '0.9271'
          tolerancia: 0.0005
          formato: un número, en cm
        distractores:
          - valor: '1.121'
            mensaje: |
              Es el espesor que sale con $I_{yz} = 0$, como si $y$, $z$ fueran
              principales. No lo son: el producto de inercia cambia el eje
              neutro y la tensión de cada punto.
          - valor: '1.228'
            mensaje: |
              Has tomado $M_z = +M_0\cos20^{\circ}$, la componente de la flecha
              según $z$. En el convenio de los apuntes (figs. 9.3 y 9.5) un
              $M_z$ positivo se dibuja hacia $-z$, así que la flecha de la
              figura es un $M_z$ negativo: comprime abajo y tracciona arriba.
          - valor: '0.9656'
            mensaje: |
              Es el espesor que pide la máxima **tracción**, la de la esquina
              de arriba a la izquierda, 3,377·10⁻³ $M_0/t^{3}$. El enunciado
              dimensiona con la compresión.
          - valor: '0.1997'
            mensaje: |
              Has dejado $M_0$ en m·kg con $\sigma_{adm}$ en kg/cm². Pasado a
              las mismas unidades, $M_0 = 4000$ m·kg $= 400\,000$ cm·kg.
        pista: |
          La compresión máxima está en el punto más alejado del eje neutro
          por el lado comprimido: la esquina de abajo a la derecha del ala de
          abajo, $(y,\ z) = (8{,}9t,\ 14{,}8t)$.
        desarrollo: |
          $$
          \sigma_{min} = -\left(2{,}333\cdot8{,}9 + 0{,}6162\cdot14{,}8\right)\cdot10^{-4}\,\frac{M_0}{t^{3}} = -2{,}988\cdot10^{-3}\,\frac{M_0}{t^{3}}
          $$

          e igualando su valor absoluto a 1500 kg/cm² con $M_0 = 400\,000$ cm·kg:

          $$
          t^{3} = \frac{2{,}988\cdot10^{-3}\cdot400\,000}{1500}\ \text{cm}^{3} = 0{,}797\ \text{cm}^{3}
          \quad\Longrightarrow\quad t = 0{,}9271\ \text{cm}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              G está a 13,1$t$ de la cara de arriba y a 5,2$t$ de la cara
              exterior del alma.
          - texto: >-
              Respecto de G: $I_z = 3756{,}17\,t^{4}$,
              $I_y = 1654{,}67\,t^{4}$ e $I_{yz} = 1029\,t^{4}$.
          - texto: >-
              Con $M_z = -M_0\cos20^{\circ}$ y $M_y = -M_0\sin20^{\circ}$, la
              ec. 9.11 da
              $\sigma_x = -(2{,}333\,y + 0{,}6162\,z)\cdot10^{-4}\,M_0/t^{3}$.
          - texto: >-
              El eje neutro, $y = -0{,}2641\,z$, sube 14,8° hacia $+z$; la
              esquina más comprimida es la de abajo a la derecha, con
              $-2{,}988\cdot10^{-3}\,M_0/t^{3}$.
          - texto: >-
              Igualando a $\sigma_{adm}$ con $M_0$ en cm·kg:
              $t^{3} = 0{,}797$ cm³ y $t = 0{,}9271$ cm.
          - texto: >-
              Como la sección es de pared delgada, el producto de inercia es
              despreciable frente a $I_y$ e $I_z$.
            trampa: true
            mensaje: |
              Pared delgada quiere decir que se pueden despreciar las inercias
              propias de las alas, no el producto de inercia. Aquí
              $I_{yz} = 1029\,t^{4}$ es del orden de $I_y$, y sin él el
              espesor sale un 21 % mayor.
    resolucion: |
      **La sección.** Tres rectángulos de espesor $t$, con $z$ desde la cara
      exterior del alma e $y$ desde la cara de arriba, hacia abajo: el ala
      de arriba ($10t \times t$, centro en $(z,\ y) = (5t,\ 0{,}5t)$), el alma
      ($t \times 20t$, centro en $(0{,}5t,\ 11t)$) y el ala de abajo
      ($20t \times t$, centro en $(10t,\ 21{,}5t)$). Área $A = 50\,t^{2}$, y

      $$
      \overline{z} = \frac{10\cdot5 + 20\cdot0{,}5 + 20\cdot10}{50}\,t = 5{,}2\,t,\qquad
      \overline{y} = \frac{10\cdot0{,}5 + 20\cdot11 + 20\cdot21{,}5}{50}\,t = 13{,}1\,t
      $$

      **Inercias respecto de G** (Steiner; en $t^{4}$):

      $$
      \begin{aligned}
      I_z &= \tfrac{10}{12} + 10\cdot12{,}6^{2} + \tfrac{20^{3}}{12} + 20\cdot2{,}1^{2} + \tfrac{20}{12} + 20\cdot8{,}4^{2} = 3756{,}17\\
      I_y &= \tfrac{10^{3}}{12} + 10\cdot0{,}2^{2} + \tfrac{20}{12} + 20\cdot4{,}7^{2} + \tfrac{20^{3}}{12} + 20\cdot4{,}8^{2} = 1654{,}67\\
      I_{yz} &= 10\,(-12{,}6)(-0{,}2) + 20\,(-2{,}1)(-4{,}7) + 20\,(8{,}4)(4{,}8) = 1029
      \end{aligned}
      $$

      El producto de inercia es positivo y grande: el ala larga está abajo y
      a la derecha de G. Los ejes $y$, $z$ no son principales.

      **El momento.** Con el convenio de los apuntes (figs. 9.3 y 9.5:
      $y$ hacia abajo, $z$ a la derecha, $M_z$ positivo dibujado hacia $-z$
      y $M_y$ positivo hacia $+y$), la flecha de $M_0$, a 20° por encima de
      $+z$, da

      $$
      M_z = -M_0\cos20^{\circ} = -0{,}9397\,M_0,\qquad M_y = -M_0\sin20^{\circ} = -0{,}3420\,M_0
      $$

      Físicamente: el vector apunta hacia la derecha y algo hacia arriba,
      así que comprime la parte de abajo y la de la derecha de la sección.

      **Tensiones** (ecs. 9.10 y 9.11), con
      $I_{yz}^{2} - I_yI_z = 1029^{2} - 1654{,}67\cdot3756{,}17 = -5{,}156\cdot10^{6}$
      (en $t^{8}$) e $y$, $z$ en unidades de $t$:

      $$
      \sigma_x = \frac{M_yI_{yz} - M_zI_y}{I_{yz}^{2} - I_yI_z}\,y + \frac{M_zI_{yz} - M_yI_z}{I_{yz}^{2} - I_yI_z}\,z
      = -\left(2{,}333\,y + 0{,}6162\,z\right)\cdot10^{-4}\,\frac{M_0}{t^{3}}
      $$

      **El eje neutro.** $\sigma_x = 0$ da $y = -0{,}2641\,z$: pasa por G y
      sube hacia $+z$ formando $14{,}80^{\circ}$ con $z$. Lo mismo sale de la
      ec. 9.13 con los momentos de la 9.12, $M'_z = -0{,}8763\,M_0$ y
      $M'_y = -0{,}1020\,M_0$. Por debajo del eje la sección está
      comprimida.

      Los ejes principales (apartado 9.2.2) explican por qué sale tan
      cerca del momento: el círculo de Mohr de inercias tiene centro
      2705,42 y radio 1470,69 (en $t^{4}$), así que $I_{max} = 4176{,}10$ e
      $I_{min} = 1234{,}73$, con el eje de inercia máxima a 22,2° por encima
      de $z$ y el de mínima a 67,8° por debajo. El momento, a 20°, está a
      2,2° del eje de inercia máxima, y el eje neutro se tuerce hacia el de
      mínima un ángulo $\psi$ con
      $\operatorname{tg}\psi = (I_{max}/I_{min})\operatorname{tg}2{,}2^{\circ} = 0{,}1300$:
      $\psi = 7{,}4^{\circ}$ y $22{,}2^{\circ} - 7{,}4^{\circ} = 14{,}8^{\circ}$.

