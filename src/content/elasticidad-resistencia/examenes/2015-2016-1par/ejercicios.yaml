      **Notas nuestras.** La figura es un cilindro comprimido en su eje por
      $\sigma_P$ y con una presión lateral uniforme $p$ en toda su
      superficie (la planta, abajo, la dibuja radial). La fórmula da el
      valor absoluto de la compresión axial que lleva el cilindro al
      límite: con presión lateral aguanta más que en compresión pura.
    pide: >-
      a) Los dos círculos de Mohr mayores en el límite. b) El ángulo ϕ de la
      recta intrínseca. c) Su ecuación, τn = OC − σn tg ϕ, con OC en función
      de σLc.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuáles son las tensiones principales del cilindro con presión
          lateral, en el estado límite?
        opciones:
          - texto: >-
              $\sigma_1 = \sigma_2 = -p$ y $\sigma_3 = -(\sigma_{Lc} + 4{,}1p)$:
              la presión lateral es una compresión en todas las direcciones
              del plano de la sección
            correcta: true
            mensaje: |
              Eso es. Las tres son de compresión; la mayor (la menos negativa)
              es $-p$, doble. El círculo de Mohr mayor va de
              $-(\sigma_{Lc} + 4{,}1p)$ a $-p$.
          - texto: >-
              $\sigma_1 = \sigma_2 = 0$ y $\sigma_3 = -(\sigma_{Lc} + 4{,}1p)$:
              la presión lateral no es una tensión del cilindro
            mensaje: |
              La presión $p$ actúa sobre la superficie lateral, y en ella la
              tensión normal es $-p$ en cualquier dirección del plano de la
              sección. Sin ella, el círculo saldría mayor que el real y no
              sería tangente a la misma recta que el de compresión pura.
          - texto: >-
              $\sigma_1 = \sigma_{Lc} + 4{,}1p$ y $\sigma_2 = \sigma_3 = -p$
            mensaje: |
              Las tres son compresiones: el signo de la axial es negativo. Y
              ordenadas, $\sigma_1$ es la mayor, la menos negativa: $-p$.
      - tipo: calcular
        titulo: El círculo con presión lateral, en un ejemplo
        pregunta: |
          Un ejemplo nuestro: $\sigma_{Lc} = 30$ MPa y $p = 5$ MPa. ¿Cuánto
          mide el radio del círculo de Mohr mayor del estado con presión
          lateral, en MPa?
        respuesta:
          tipo: numero
          valor: '22.75'
          tolerancia: 0.01
          formato: un número, en MPa
        distractores:
          - valor: '25.25'
            mensaje: |
              Has tomado $\sigma_1 = 0$. La presión lateral comprime también
              en las direcciones de la sección: $\sigma_1 = -5$ MPa, y el
              círculo va de $-50{,}5$ a $-5$.
          - valor: '45.5'
            mensaje: |
              Es el diámetro, $\sigma_1 - \sigma_3$. El radio es la mitad.
        pista: |
          $R = \tfrac12(\sigma_1 - \sigma_3)$ con $\sigma_1 = -p$ y
          $\sigma_3 = -(\sigma_{Lc} + 4{,}1p)$.
        desarrollo: |
          $\sigma_3 = -(30 + 4{,}1\cdot5)\ \text{MPa} = -50{,}5\ \text{MPa}$ y
          $\sigma_1 = -5$ MPa: centro $-27{,}75$ MPa y radio
          $(50{,}5 - 5)/2\ \text{MPa} = 22{,}75\ \text{MPa}$. El de
          compresión pura, centro $-15$ y radio 15 MPa.
      - tipo: calcular
        titulo: El ángulo de la recta intrínseca
        pregunta: |
          ¿Cuánto vale $\varphi$, en grados?
        respuesta:
          tipo: numero
          valor: '37.43'
          tolerancia: 0.02
          formato: un número, en grados
        distractores:
          - valor: '31.29'
            mensaje: |
              Es $\operatorname{arctg}(3{,}1/5{,}1)$. El cociente de la
              diferencia de radios entre la distancia de centros es el
              **seno** de $\varphi$: los dos radios van a los puntos de
              tangencia, perpendiculares a la recta.
          - valor: '90'
            mensaje: |
              Sale con $\sigma_1 = 0$ en el círculo con presión lateral:
              entonces los dos círculos pasan por el origen, la diferencia de
              radios es igual a la distancia de centros y la «recta» sería
              vertical. La presión lateral desplaza el círculo hacia la
              izquierda: $\sigma_1 = -p$.
        pista: |
          Dos círculos tangentes a la misma recta:
          $\sin\varphi = \dfrac{R_2 - R_1}{C_1 - C_2}$, con $C$ los centros y
          $R$ los radios.
        desarrollo: |
          $R_2 - R_1 = \tfrac12(\sigma_{Lc} + 3{,}1p) - \tfrac12\sigma_{Lc} = 1{,}55\,p$
          y $C_1 - C_2 = -\tfrac12\sigma_{Lc} + \tfrac12(\sigma_{Lc} + 5{,}1p) = 2{,}55\,p$:

          $$
          \sin\varphi = \frac{3{,}1}{5{,}1} = 0{,}6078 \quad\Longrightarrow\quad \varphi = 37{,}43^{\circ}
          $$

          No depende ni de $p$ ni de $\sigma_{Lc}$.
      - tipo: calcular
        titulo: La ordenada en el origen de la recta
        pregunta: |
          La recta es $\tau_n = OC - \sigma_n\operatorname{tg}\varphi$
          (ec. 6.10). ¿Cuánto vale $OC/\sigma_{Lc}$?
        respuesta:
          tipo: numero
          valor: '0.2469'
          tolerancia: 0.0005
          formato: un número (OC dividido por σLc)
        distractores:
          - valor: '0.5'
            mensaje: |
              Es el radio del círculo de compresión pura, $\sigma_{Lc}/2$, la
              altura de su punto más alto. La recta no pasa por ahí: toca el
              círculo más a la derecha, donde es perpendicular al radio, y
              sigue bajando hasta cortar el eje $\tau$ en $0{,}2469\,\sigma_{Lc}$.
          - valor: '0.3226'
            mensaje: |
              Es donde la recta corta el eje $\sigma$, $\sigma_{Lc}/3{,}1$.
              $OC$ es la ordenada en el origen, el corte con el eje $\tau$:
              $OC = \sigma\operatorname{tg}\varphi$ en ese vértice.
        pista: |
          La distancia del centro del círculo de compresión pura,
          $(-\sigma_{Lc}/2,\ 0)$, a la recta es su radio, $\sigma_{Lc}/2$.
        desarrollo: |
          $(OC + \tfrac12\sigma_{Lc}\operatorname{tg}\varphi)\cos\varphi = \tfrac12\sigma_{Lc}$,
          así que

          $$
          OC = \frac{\sigma_{Lc}}{2}\,\frac{1 - \sin\varphi}{\cos\varphi} = \frac{\sigma_{Lc}}{2\sqrt{4{,}1}} = 0{,}2469\,\sigma_{Lc}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Compresión pura en el límite: 0, 0 y $-\sigma_{Lc}$; círculo de
              centro $-\sigma_{Lc}/2$ y radio $\sigma_{Lc}/2$.
          - texto: >-
              Con presión lateral en el límite: $-p$, $-p$ y
              $-(\sigma_{Lc} + 4{,}1p)$; círculo de centro
              $-(\sigma_{Lc} + 5{,}1p)/2$ y radio $(\sigma_{Lc} + 3{,}1p)/2$.
          - texto: >-
              Los dos son tangentes a la recta intrínseca:
              $\sin\varphi = 3{,}1/5{,}1$ y $\varphi = 37{,}43^{\circ}$.
          - texto: >-
              La tangencia con el de compresión pura da
              $OC = \sigma_{Lc}/(2\sqrt{4{,}1})$, y la recta es
              $|\tau_n| = 0{,}2469\,\sigma_{Lc} - 0{,}7655\,\sigma_n$.
          - texto: >-
              El ángulo $\varphi$ depende de la presión $p$ que se aplique en
              el ensayo.
            trampa: true
            mensaje: |
              $p$ se va de la cuenta: la diferencia de radios, $1{,}55p$, y la
              distancia de centros, $2{,}55p$, son las dos proporcionales a
              $p$. Por eso la fórmula del enunciado, lineal en $p$, describe
              una recta intrínseca y no una curva.
    resolucion: |
      **a/ Los dos estados límite.** Compresión pura: $\sigma_1 = \sigma_2 = 0$
      y $\sigma_3 = -\sigma_{Lc}$. Con presión lateral, la superficie del
      cilindro está comprimida por $p$ en todas las direcciones de la
      sección, y la axial vale lo que dice el enunciado:

      $$
      \sigma_1 = \sigma_2 = -p,\qquad \sigma_3 = -(\sigma_{Lc} + 4{,}1\,p)
      $$

      En cada estado dos principales son iguales: el círculo 1-2 se reduce a
      un punto y los otros dos coinciden. Queda un círculo por estado:

      | estado | de | a | centro | radio |
      |---|---|---|---|---|
      | compresión pura | $-\sigma_{Lc}$ | 0 | $-\tfrac12\sigma_{Lc}$ | $\tfrac12\sigma_{Lc}$ |
      | con presión lateral | $-(\sigma_{Lc} + 4{,}1p)$ | $-p$ | $-\tfrac12(\sigma_{Lc} + 5{,}1p)$ | $\tfrac12(\sigma_{Lc} + 3{,}1p)$ |

