ejercicios:
  # ── Teoría · pregunta 1 · los cilindros de hormigón y la recta intrínseca.
  - id: exerm1516-1par-1-los-cilindros-de-hormigon-confinados
    titulo: Los cilindros de hormigón con presión lateral y la recta intrínseca de Mohr
    fuente: >-
      Pregunta 1 de teoría · Primer parcial de 2015-2016 (hoja de teoría del 9
      de noviembre de 2015) · Elasticidad y Resistencia de Materiales, Escuela
      Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 1 punto. Es
      el ejercicio 6.2 de los enunciados de clase del tema 6, con la misma
      figura y las mismas palabras salvo «el valor», que añade el examen; no
      trae resolución. El examen
      tampoco la publica; el desarrollo es nuestro y sigue los apuntes del
      tema 6, apartado 6.4 (ecs. 6.10 a 6.16). El paso del radio usa un
      ejemplo nuestro.
    nivel: examen
    enunciado: |
      (1p) Cuando se somete a cilindros de hormigón al estado de tensiones que
      se muestra en la figura, la compresión axial que genera el estado
      límite viene dada por el valor:

      $$
      |\sigma_P| = \sigma_{Lc} + 4{,}1\,p
      $$

      Siendo $\sigma_{Lc}$ el valor conocido que corresponde a la tensión
      límite en compresión pura. Determinar:

      a/ Círculos de Mohr que corresponden al estado de tensiones de la
      figura y la compresión pura, ambas en el estado límite.

      b/ Ángulo $\varphi$ de la recta intrínseca.

      c/ Ecuación de la recta intrínseca.

