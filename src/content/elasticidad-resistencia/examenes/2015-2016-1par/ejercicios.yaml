      <figcaption>

      La sección a escala, con G, el eje neutro y las dos esquinas más
      alejadas de él: P, la más comprimida, y Q, la más traccionada.

      </figcaption>
      </figure>

      **El punto de compresión máxima.** Es el más alejado del eje neutro
      por el lado comprimido: la esquina de abajo a la derecha del ala de
      abajo, P, en $(y,\ z) = (8{,}9t,\ 14{,}8t)$ respecto de G:

      $$
      \sigma_P = -\left(2{,}333\cdot8{,}9 + 0{,}6162\cdot14{,}8\right)\cdot10^{-4}\,\frac{M_0}{t^{3}} = -2{,}988\cdot10^{-3}\,\frac{M_0}{t^{3}}
      $$

      **El espesor.** Con $M_0 = 4000$ m·kg $= 400\,000$ cm·kg y
      $|\sigma_P| = \sigma_{adm} = 1500$ kg/cm²:

      $$
      t^{3} = \frac{2{,}988\cdot10^{-3}\cdot400\,000}{1500}\ \text{cm}^{3} = 0{,}797\ \text{cm}^{3}
      \quad\Longrightarrow\quad t = 0{,}9271\ \text{cm} \approx 9{,}3\ \text{mm}
      $$

      Como todas las cotas son múltiplos de $t$, el resultado es exacto: no
      hace falta despreciar nada por pared delgada. Si se tomaran las cotas
      a la línea media, con el modelo de pared delgada (cada tramo reducido a
      su línea media y sin la inercia propia de las alas respecto de $z$),
      saldría $t = 0{,}906$ cm, un 2 % menos.

      **La tracción.** La esquina de arriba a la izquierda, Q, en
      $(-13{,}1t,\ -5{,}2t)$, está más lejos del eje neutro y tiene
      $3{,}377\cdot10^{-3}\,M_0/t^{3}$: con el $t$ de la compresión llega a
      1695 kg/cm². El enunciado solo limita la compresión; si el mismo
      límite valiera a tracción, mandaría Q y $t = 0{,}9656$ cm.

      **Comprobaciones.** El motor del curso no tiene flexión, así que las
      cifras salen de un guion propio y se comprueban por tres caminos
      independientes: (1) las propiedades, integradas numéricamente en una
      malla fina de la sección, dan el mismo G, $I_z$, $I_y$ e $I_{yz}$;
      (2) en ejes principales, con el momento proyectado en ellos, la
      tensión de P y la de Q salen iguales, y el eje neutro, el mismo; y (3) el
      campo de tensiones integrado en la malla da $N = 0$,
      $\int\sigma_x z\,dA = M_y$ e $\int\sigma_x y\,dA = M_z$ (ec. 9.8).
