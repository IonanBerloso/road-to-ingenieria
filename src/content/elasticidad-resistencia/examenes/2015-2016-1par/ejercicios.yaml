      **b/ El ángulo.** Los dos círculos están en el límite: los dos son
      tangentes a la recta intrínseca (apartado 6.4 de los apuntes). Con
      $C$ y $R$ los centros y los radios, el radio a cada punto de tangencia
      es perpendicular a la recta, y

      $$
      \sin\varphi = \frac{R_2 - R_1}{C_1 - C_2} = \frac{\tfrac12\cdot3{,}1\,p}{\tfrac12\cdot5{,}1\,p} = \frac{3{,}1}{5{,}1} = 0{,}6078
      \quad\Longrightarrow\quad \varphi = 37{,}43^{\circ}
      $$

      Por el criterio de Mohr se llega a lo mismo: en el límite
      $\sigma_1 - k\sigma_3 = \sigma_{et}$ (ec. 6.15) para los dos estados;
      la compresión pura da $\sigma_{et} = k\,\sigma_{Lc}$, y el otro,
      $-p + k(\sigma_{Lc} + 4{,}1p) = k\,\sigma_{Lc}$, es decir,
      $k = 1/4{,}1 = 0{,}2439$. Con la ec. 6.12,
      $\sin\varphi = (1 - k)/(1 + k) = 3{,}1/5{,}1$.

      **c/ La ecuación.** La recta (ec. 6.10) es
      $\tau_n = OC - \sigma_n\operatorname{tg}\varphi$, con
      $\operatorname{tg}\varphi = 3{,}1/\sqrt{16{,}4} = 0{,}7655$. Es tangente
      al círculo de compresión pura: la distancia de su centro a la recta es
      su radio,

      $$
      \left(OC + \tfrac12\sigma_{Lc}\operatorname{tg}\varphi\right)\cos\varphi = \tfrac12\sigma_{Lc}
      \quad\Longrightarrow\quad
      OC = \frac{\sigma_{Lc}}{2\sqrt{4{,}1}} = 0{,}2469\,\sigma_{Lc}
      $$

      y la recta intrínseca, con sus dos ramas simétricas,

      $$
      |\tau_n| = \frac{\sigma_{Lc} - 3{,}1\,\sigma_n}{2\sqrt{4{,}1}} = 0{,}2469\,\sigma_{Lc} - 0{,}7655\,\sigma_n
      $$

      Corta el eje $\sigma$ en $\sigma_n = \sigma_{Lc}/3{,}1$, a la derecha
      del origen.

      **Comprobaciones.** La misma recta es tangente al círculo con presión
      lateral para cualquier $p$: la distancia de su centro a la recta es
      $\tfrac12(\sigma_{Lc} + 3{,}1p)$, su radio. El motor del curso
      (`mohr`, ecs. 6.12 a 6.16) da $\varphi = 37{,}43^{\circ}$ con la $k$ que
      pone el estado con presión lateral justo en el límite, y esa $k$ es
      $1/4{,}1$.

  # ── Teoría · pregunta 2 · la columna en el hueco rígido.
  - id: exerm1516-1par-2-la-columna-en-el-hueco-rigido
    titulo: La columna comprimida con su extremo metido en un hueco rígido
    fuente: >-
      Pregunta 2 de teoría · Primer parcial de 2015-2016 (hoja de teoría del 9
      de noviembre de 2015) · Elasticidad y Resistencia de Materiales, Escuela
      Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 1 punto. El
      examen no publica resolución; el desarrollo es nuestro y sigue los
      apuntes del tema 4 (la ley de Hooke generalizada).
    nivel: examen
    enunciado: |
      (1p) El extremo inferior de una columna de sección cuadrada 10x10 mm²
      se introduce en el interior de un hueco rígido. La sección del hueco es
      10x11 mm² ($x$,$y$) y su altura 20mm ($z$). Si se somete a la columna a
      una compresión uniforme de 2000 N, determinar las tensiones y
      deformaciones principales de los puntos de la columna que están en el
      interior del hueco.

      Datos: $E$ = 2.10⁵ MPa; $\nu$ = 0,25.

      **Notas nuestras.** «2.10⁵» es $2\cdot10^{5}$. Se supone que las
      paredes no rozan y que la tensión $\sigma_z$ es uniforme en la
      sección.
    pide: >-
      σx, σy, σz y εx, εy, εz de la parte de la columna que está dentro del
      hueco, ordenadas como principales.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué condiciones pone el hueco a la columna?
        opciones:
          - texto: >-
              En $x$ el hueco mide lo mismo que la columna: $\varepsilon_x = 0$.
              En $y$ sobra 1 mm: la columna se ensancha libremente y
              $\sigma_y = 0$
            correcta: true
            mensaje: |
              Eso es. Una dirección con la deformación impedida y otra libre:
              $\sigma_x$ es la incógnita, y sale de $\varepsilon_x = 0$. Al
              final hay que comprobar que el ensanchamiento en $y$ no cierra
              el milímetro de holgura.
          - texto: >-
              El hueco es rígido: $\varepsilon_x = \varepsilon_y = 0$
            mensaje: |
              En $y$ el hueco mide 11 mm y la columna 10: le sobra un
              milímetro, mucho más de lo que la columna se ensancha (unas
              décimas de micra). La cara $y$ no toca y está libre.
          - texto: >-
              Las paredes no cargan la columna: $\sigma_x = \sigma_y = 0$, y
              es una compresión simple
            mensaje: |
              Eso sería si el hueco fuera holgado en las dos direcciones. En
              $x$ la columna, al ensancharse por el efecto Poisson, empuja las
              paredes, y estas responden con una $\sigma_x$ de compresión.
      - tipo: calcular
        titulo: La tensión que hacen las paredes
        pregunta: |
          ¿Cuánto vale $\sigma_x$, en MPa?
        respuesta:
          tipo: numero
          valor: '-5'
          tolerancia: 0.01
          formato: un número, en MPa
        distractores:
          - valor: '0'
            mensaje: |
              Es la compresión simple, sin paredes. En $x$ el hueco no deja
              ensancharse a la columna, y para impedirlo hace falta una
              $\sigma_x$ de compresión.
          - valor: '-6.667'
            mensaje: |
              Es lo que sale con las dos direcciones impedidas,
              $\sigma_x = \sigma_y = \nu\sigma_z/(1 - \nu)$. En $y$ hay holgura
              y $\sigma_y = 0$.
          - valor: '5'
            mensaje: |
              El valor es ese y el signo no. Las paredes empujan la columna
              hacia dentro: es una compresión, $\sigma_x = \nu\sigma_z$ con
              $\sigma_z < 0$.
        pista: |
          $\sigma_z = -2000/100$ MPa y
          $\varepsilon_x = \tfrac1E\left[\sigma_x - \nu(\sigma_y + \sigma_z)\right] = 0$
          con $\sigma_y = 0$.
        desarrollo: |
          $\sigma_z = -2000\ \text{N}/100\ \text{mm}^{2} = -20\ \text{MPa}$, y
          $\sigma_x = \nu\sigma_z = 0{,}25\cdot(-20\ \text{MPa}) = -5\ \text{MPa}$.
      - tipo: calcular
        titulo: La deformación en la dirección libre
        pregunta: |
          ¿Cuánto vale $\varepsilon_y$, en $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '31.25'
          tolerancia: 0.01
          formato: un número, en millonésimas
        distractores:
          - valor: '25'
            mensaje: |
              Es la de la compresión simple, $-\nu\sigma_z/E$. Te has dejado
              la $\sigma_x$ de las paredes, que también ensancha la columna en
              $y$: $-\nu(\sigma_x + \sigma_z)/E$.
          - valor: '-31.25'
            mensaje: |
              El valor es ese y el signo no. Las dos compresiones, $\sigma_x$
              y $\sigma_z$, ensanchan la columna en $y$ por el efecto Poisson:
              $\varepsilon_y > 0$.
        pista: |
          $\varepsilon_y = \tfrac1E\left[\sigma_y - \nu(\sigma_x + \sigma_z)\right]$.
        desarrollo: |
          $$
          \varepsilon_y = \frac{0 - 0{,}25\cdot(-5 - 20)}{2\cdot10^{5}} = 31{,}25\cdot10^{-6}
          $$

          En los 10 mm del lado son 0,0003 mm: la holgura de 1 mm no se
          cierra.
      - tipo: calcular
        titulo: La deformación axial
        pregunta: |
          ¿Cuánto vale $\varepsilon_z$, en $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '-93.75'
          tolerancia: 0.01
          formato: un número, en millonésimas
        distractores:
          - valor: '-100'
            mensaje: |
              Es $\sigma_z/E$, sin Poisson. La $\sigma_x$ de las paredes, de
              compresión, alarga la columna en $z$ y le quita acortamiento:
              $\varepsilon_z = (\sigma_z - \nu\sigma_x)/E$.
          - valor: '-83.33'
            mensaje: |
              Es lo que sale con las dos caras impedidas, con
              $\sigma_x = \sigma_y = -6{,}667$ MPa. En $y$ hay holgura y
              $\sigma_y = 0$.
        pista: |
          $\varepsilon_z = \tfrac1E\left[\sigma_z - \nu(\sigma_x + \sigma_y)\right]$.
        desarrollo: |
          $$
          \varepsilon_z = \frac{-20 - 0{,}25\cdot(-5)}{2\cdot10^{5}} = \frac{-18{,}75}{2\cdot10^{5}} = -93{,}75\cdot10^{-6}
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Compresión uniforme: $\sigma_z = -2000\ \text{N}/100\ \text{mm}^{2} = -20\ \text{MPa}$.
          - texto: >-
              En $x$ el hueco no deja ensancharse a la columna,
              $\varepsilon_x = 0$; en $y$ hay 1 mm de holgura, $\sigma_y = 0$.
          - texto: >-
              De $\varepsilon_x = 0$: $\sigma_x = \nu\sigma_z = -5$ MPa.
          - texto: >-
              Hooke: $\varepsilon_y = 31{,}25\cdot10^{-6}$ y
              $\varepsilon_z = -93{,}75\cdot10^{-6}$; el ensanchamiento en $y$,
              0,0003 mm, no cierra la holgura.
          - texto: >-
              Sin tangenciales, $x$, $y$, $z$ son principales: tensiones 0, −5
              y −20 MPa; deformaciones 31,25, 0 y −93,75 por $10^{-6}$.
          - texto: >-
              Como las paredes del hueco son rígidas, la columna no se
              deforma dentro de él.
            trampa: true
            mensaje: |
              Las paredes rígidas solo impiden la deformación en la dirección
              en que tocan, la $x$. En $z$ la columna se acorta y en $y$ se
              ensancha, porque allí nada se lo impide.
    resolucion: |
      **Las condiciones.** La columna mide 10 mm en $x$ y en $y$; el hueco,
      10 mm en $x$ y 11 en $y$. En $x$ las paredes no le dejan ensancharse:
      $\varepsilon_x = 0$. En $y$ le sobra un milímetro y sus caras quedan
      libres: $\sigma_y = 0$. La compresión, uniforme:

      $$
      \sigma_z = -\frac{2000\ \text{N}}{10\cdot10\ \text{mm}^{2}} = -20\ \text{MPa}
      $$

      **Hooke generalizado** (tema 4). De $\varepsilon_x = 0$:

      $$
      \varepsilon_x = \frac{\sigma_x - \nu(\sigma_y + \sigma_z)}{E} = 0
      \quad\Longrightarrow\quad \sigma_x = \nu\,\sigma_z = -5\ \text{MPa}
      $$

      y las otras dos deformaciones:

      $$
      \varepsilon_y = \frac{-\nu(\sigma_x + \sigma_z)}{E} = \frac{0{,}25\cdot25}{2\cdot10^{5}} = 31{,}25\cdot10^{-6},\qquad
      \varepsilon_z = \frac{\sigma_z - \nu\sigma_x}{E} = \frac{-18{,}75}{2\cdot10^{5}} = -93{,}75\cdot10^{-6}
      $$

      **La holgura.** El lado de 10 mm crece $10\ \text{mm}\cdot31{,}25\cdot10^{-6} = 0{,}0003\ \text{mm}$
      en $y$: el milímetro de holgura sigue abierto y $\sigma_y = 0$ es
      correcta.

      **Las principales.** No hay tangenciales (las paredes no rozan), así
      que $x$, $y$, $z$ son direcciones principales. Ordenadas:

      | | $y$ | $x$ | $z$ |
      |---|---|---|---|
      | tensiones (MPa) | $\sigma_1 = 0$ | $\sigma_2 = -5$ | $\sigma_3 = -20$ |
      | deformaciones ($10^{-6}$) | $\varepsilon_1 = 31{,}25$ | $\varepsilon_2 = 0$ | $\varepsilon_3 = -93{,}75$ |

      Las dos ordenaciones coinciden, como debe ser en un material
      isótropo.

      **Comprobaciones.** El motor del curso (`deformacionesDeTensiones`) da
      $\varepsilon_x = 0$ con $\sigma_x = -5$ MPa y las mismas $\varepsilon_y$
      y $\varepsilon_z$; y de vuelta, `tensionesDeDeformaciones` con esas
      tres deformaciones devuelve $\sigma_x = -5$, $\sigma_y = 0$ y
      $\sigma_z = -20$ MPa.

  # ── Teoría · pregunta 3, mitad a/ · qr y qθ de una carga por metro de horizontal.
  - id: exerm1516-1par-3-la-carga-por-metro-de-horizontal-en-una-pieza-curva
    titulo: La carga vertical por metro de horizontal sobre una pieza curva, en componentes radial y tangencial
    fuente: >-
      Pregunta 3 a de teoría · Primer parcial de 2015-2016 (hoja de teoría del
      9 de noviembre de 2015) · Elasticidad y Resistencia de Materiales,
      Escuela Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 0,5
      puntos. El examen no publica resolución; el desarrollo es nuestro y
      sigue los apuntes del tema 7, apartado 7.6 (ecs. 7.22 a 7.26 y fig. 7.8).
      Los pasos de cálculo usan un ejemplo nuestro.
    nivel: examen
    enunciado: |
      Responder a las siguientes preguntas:

      a) (0,5p) Si la fuerza distribuida por unidad de longitud horizontal es
      $q$(x), determinar $q_r(\theta)$, $q_\theta(\theta)$.

      **Notas nuestras.** La pregunta 3 del examen tiene dos mitades de
      cosas distintas; esta es la a), y la b) es el ejercicio siguiente.
      Como en la figura 7.8 de los apuntes, la pieza es un arco de centro O,
      el elemento $ds$ está en la dirección que forma $\theta$ con la
      horizontal, $q_r$ es positiva hacia O y $q_\theta$, en el sentido en
      que crece $\theta$. La carga $q$ es vertical, hacia abajo.
    pide: >-
      qr y qθ en función de q y θ (ec. 7.26), y por qué no se puede
      descomponer q directamente.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Por qué no basta con proyectar $q$ sobre el radio y la tangente?
        opciones:
          - texto: >-
              Porque $q$ es fuerza por metro de **horizontal** y $q_r$, $q_\theta$
              son por metro de **pieza**: primero hay que pasar a fuerza,
              $df = q\,dx$, y luego repartirla en $ds$
            correcta: true
            mensaje: |
              Eso es. Se proyecta la fuerza $df$, no la densidad $q$, y se
              divide por $ds$. Como $dx = \sin\theta\,ds$, aparece un seno
              más que en la proyección directa.
          - texto: >-
              Porque $q$ no es perpendicular a la pieza
            mensaje: |
              Eso solo obliga a proyectar, y proyectar sí hay que hacerlo. El
              problema es otro: $q$ y $q_r$, $q_\theta$ están repartidas sobre
              longitudes distintas, $dx$ y $ds$.
          - texto: >-
              Sí basta: $q_r = q\sin\theta$ y $q_\theta = -q\cos\theta$
            mensaje: |
              Es justo lo que los apuntes dicen que no se puede hacer (texto
              de la ec. 7.22). Esas son las componentes de una carga que
              estuviera repartida por metro de pieza. La de metro de
              horizontal reparte menos fuerza en cada $ds$, porque
              $dx = \sin\theta\,ds$.
      - tipo: calcular
        titulo: La componente radial, en un ejemplo
        pregunta: |
          Un ejemplo nuestro: $q = 10$ kN/m (por metro de horizontal) en el
          punto de $\theta = 30^{\circ}$. ¿Cuánto vale $q_r$, en kN por metro
          de pieza?
        respuesta:
          tipo: numero
          valor: '2.5'
          tolerancia: 0.01
          formato: un número, en kN/m
        distractores:
          - valor: '5'
            mensaje: |
              Es $q\sin\theta$, la proyección directa. Falta pasar de metro de
              horizontal a metro de pieza: $dx = \sin\theta\,ds$, otro seno.
          - valor: '7.5'
            mensaje: |
              Es $q\cos^{2}\theta$: has medido $\theta$ desde la vertical. En la
              figura 7.8 de los apuntes $\theta$ va desde la horizontal.
        pista: |
          $q_r = q\sin^{2}\theta$ (ec. 7.26).
        desarrollo: |
          $q_r = 10\ \text{kN/m}\cdot\sin^{2}30^{\circ} = 10\ \text{kN/m}\cdot0{,}25 = 2{,}5\ \text{kN/m}$.
      - tipo: calcular
        titulo: La componente tangencial, en el mismo ejemplo
        pregunta: |
          En el mismo punto, ¿cuánto vale $q_\theta$, en kN por metro de
          pieza, con su signo?
        respuesta:
          tipo: numero
          valor: '-4.330'
          tolerancia: 0.005
          formato: un número, en kN/m
        distractores:
          - valor: '-8.660'
            mensaje: |
              Es $-q\cos\theta$, la proyección directa. Falta el
              $\sin\theta$ de $dx = \sin\theta\,ds$.
          - valor: '4.330'
            mensaje: |
              El valor es ese y el signo no. La carga es hacia abajo y
              $q_\theta$ positiva va hacia donde crece $\theta$, hacia arriba
              por el arco: la componente tangencial de $df$ va en contra
              (ec. 7.22, $df_\theta = -q_\theta\,ds$).
        pista: |
          $q_\theta = -q\sin\theta\cos\theta$ (ec. 7.26).
        desarrollo: |
          $q_\theta = -10\ \text{kN/m}\cdot0{,}5\cdot0{,}866 = -4{,}330\ \text{kN/m}$.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Deduce qr(θ) y qθ(θ) a partir de q(x) como en el examen.
        rubrica:
          - punto: >-
              Se dice por qué no se puede proyectar q directamente: q está
              repartida en la horizontal y qr, qθ en la pieza.
            porque: >-
              Es lo que pregunta el examen; sin eso, la respuesta es la
              proyección directa, que está mal.
            minimo: true
          - punto: >-
              Se escribe la fuerza sobre el elemento: df = q dx, con
              dfr = qr ds y dfθ = −qθ ds (ec. 7.22).
            porque: >-
              Se trabaja con fuerzas, que sí se pueden proyectar; el signo
              de dfθ dice que va en contra de qθ positiva.
            minimo: true
          - punto: >-
              Se relacionan las longitudes: dx = sen θ ds (ec. 7.23).
            porque: >-
              Es la pieza que falta en la proyección directa.
            minimo: true
          - punto: >-
              Se proyecta df: dfr = df sen θ y dfθ = df cos θ (ec. 7.24), y
              se llega a qr = q sen²θ y qθ = −q sen θ cos θ (ec. 7.26).
            porque: >-
              Es lo que pide el examen: las dos componentes en función de q
              y θ.
            minimo: true
          - punto: >-
              Se comprueban los extremos: en θ = 90° (la clave del arco) qr = q
              y qθ = 0; en θ = 0 (arranque vertical) las dos se anulan.
            porque: >-
              Arriba la pieza es horizontal y la carga le llega entera y
              normal; en el arranque la pieza es vertical y no tiene
              longitud horizontal sobre la que cargar.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              La fuerza sobre el elemento es $df = q\,dx$; se reparte en la
              pieza como $df_r = q_r\,ds$ y $df_\theta = -q_\theta\,ds$.
          - texto: >-
              La horizontal y la pieza se relacionan por $dx = \sin\theta\,ds$.
          - texto: >-
              Proyectando, $df_r = df\sin\theta$ y $df_\theta = df\cos\theta$.
          - texto: >-
              Así $q_r = q\sin^{2}\theta$ y $q_\theta = -q\sin\theta\cos\theta$.
          - texto: >-
              Como $q$ es vertical, basta proyectarla:
              $q_r = q\sin\theta$ y $q_\theta = -q\cos\theta$.
            trampa: true
            mensaje: |
              Proyectar la densidad olvida que $q$ y $q_r$ están repartidas
              sobre longitudes distintas. Se proyecta la fuerza $df = q\,dx$
              y se divide por $ds$: sale un $\sin\theta$ más.
    resolucion: |
      **El problema.** La carga $q$ es una fuerza vertical por metro de
      **horizontal**; $q_r$ y $q_\theta$ son fuerzas por metro de **pieza**.
      Repartidas sobre longitudes distintas, no se pueden descomponer
      directamente (apuntes del tema 7, apartado 7.6, fig. 7.8): hay que
      pasar por la fuerza que recibe un elemento $ds$.

      **La fuerza sobre el elemento** (ec. 7.22). Al elemento $ds$ le
      corresponde un trozo $dx$ de horizontal, y recibe

      $$
      df = q\,dx,\qquad df_r = q_r\,ds,\qquad df_\theta = -q_\theta\,ds
      $$

      El signo de $df_\theta$: la componente tangencial de una carga hacia
      abajo va hacia donde **decrece** $\theta$, en contra de $q_\theta$
      positiva.

      **Las longitudes** (ec. 7.23). Con $\theta$ medido desde la
      horizontal, la tangente a la pieza forma $\theta$ con la vertical, y

      $$
      dx = \sin\theta\,ds
      $$

      **La proyección** (ecs. 7.24 y 7.25). La fuerza vertical $df$ forma
      con el radio el ángulo $90^{\circ} - \theta$:

      $$
      df_r = df\sin\theta = q\sin^{2}\theta\,ds,\qquad df_\theta = df\cos\theta = q\sin\theta\cos\theta\,ds
      $$

      **El resultado** (ec. 7.26):

      $$
      q_r(\theta) = q\sin^{2}\theta,\qquad q_\theta(\theta) = -q\sin\theta\cos\theta
      $$

      **Comprobaciones.** En la clave del arco, $\theta = 90^{\circ}$, la
      pieza es horizontal: $q_r = q$ y $q_\theta = 0$, la carga entera y
      normal. En el arranque, $\theta = 0$, la pieza es vertical y no tiene
      horizontal sobre la que cargar: las dos son nulas. Con nuestro ejemplo,
      $q = 10$ kN/m en $\theta = 30^{\circ}$: $q_r = 2{,}5$ kN/m y
      $q_\theta = -4{,}330$ kN/m. El motor del curso no tiene piezas curvas;
      el guion lo comprueba por otro camino: integra la carga sobre la
      proyección horizontal de un arco pequeño alrededor de $\theta$, proyecta
      la fuerza total sobre el radio y la tangente y la divide por la
      longitud del arco, y sale lo mismo.

  # ── Teoría · pregunta 3, mitad b/ · el proceso de deformación de una barra.
  - id: exerm1516-1par-3-el-proceso-de-deformacion-de-una-barra
    titulo: Cómo se deforma una barra de una estructura articulada, y su alargamiento
    fuente: >-
      Pregunta 3 b de teoría · Primer parcial de 2015-2016 (hoja de teoría del
      9 de noviembre de 2015) · Elasticidad y Resistencia de Materiales,
      Escuela Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 0,5
      puntos. El examen no publica resolución; el desarrollo es nuestro y
      sigue los apuntes del tema 8, apartado 8.4 (pág. 7, figs. 8.2 y 8.3,
      ecs. 8.10 a 8.12). Los pasos de cálculo usan un ejemplo nuestro.
    nivel: examen
    enunciado: |
      Responder a las siguientes preguntas:

      b) (0,5p) Proceso de deformación de una barra en una estructura
      articulada.

      **Notas nuestras.** Esta es la mitad b) de la pregunta 3; la a) es el
      ejercicio anterior. Se pide describir los movimientos que llevan una
      barra BC de su posición inicial a la final, y de ahí, su alargamiento.
    pide: >-
      Los cuatro pasos del proceso (traslación, alargamiento, giro, tangente
      en lugar del arco) y la fórmula ΔL = CC0′ − BB0′.
    pasos:
      - tipo: reconocer
        pregunta: |
          En el proceso de los apuntes, el arco que describe C al girar la
          barra se sustituye por su tangente. ¿Por qué se puede?
        opciones:
          - texto: >-
              Porque el giro $\beta$ es pequeño: la diferencia entre el arco y
              la tangente es de orden $\beta^{2}$, y $\cos\beta \approx 1$
            correcta: true
            mensaje: |
              Eso es (ec. 8.11). Con giros pequeños, girar la barra solo
              mueve C en perpendicular a ella, sin cambiar su proyección
              sobre la dirección inicial: el giro no altera la longitud.
          - texto: >-
              Porque la barra no gira: solo se traslada y se alarga
            mensaje: |
              Sí gira: es el tercer paso del proceso. Lo que pasa es que,
              con un giro pequeño, ese giro no cambia la longitud medida
              sobre la dirección inicial.
          - texto: >-
              Porque el alargamiento es pequeño frente a la longitud de la
              barra
            mensaje: |
              También lo es, pero no es eso lo que permite cambiar el arco
              por la tangente. Lo que importa es que el ángulo girado sea
              pequeño.
      - tipo: calcular
        titulo: El alargamiento, en un ejemplo
        pregunta: |
          Un ejemplo nuestro: una barra BC de 2 m que sube a 30° de B a C. B
          se mueve (0,5; −0,2) mm y C (0,2; 1,0) mm, en ejes $x$ a la derecha
          e $y$ hacia arriba. ¿Cuánto se alarga, en mm?
        respuesta:
          tipo: numero
          valor: '0.3402'
          tolerancia: 0.0005
          formato: un número, en mm
        distractores:
          - valor: '1.237'
            mensaje: |
              Es el módulo del desplazamiento relativo,
              $|\vec{u}_C - \vec{u}_B|$. La parte perpendicular a la barra es
              giro, no alargamiento: solo cuenta la proyección sobre la
              barra.
          - valor: '0.6732'
            mensaje: |
              Es solo la proyección del desplazamiento de C. Una traslación
              no alarga: hay que restar lo que B se mueve en la misma
              dirección, $\Delta L = CC_0' - BB_0'$.
          - valor: '-0.3402'
            mensaje: |
              El valor es ese y el signo no: has restado al revés. Si C se
              aleja de B en la dirección de la barra, la barra se alarga:
              $\Delta L = (\vec{u}_C - \vec{u}_B)\cdot\hat{e}_{BC}$, de B a C.
        pista: |
          $\Delta L = (\vec{u}_C - \vec{u}_B)\cdot\hat{e}_{BC}$, con
          $\hat{e}_{BC} = (\cos30^{\circ},\ \sin30^{\circ})$ (ec. 8.12).
        desarrollo: |
          $\vec{u}_C - \vec{u}_B = (-0{,}3;\ 1{,}2)$ mm, y

          $$
          \Delta L = (-0{,}3\cdot0{,}866 + 1{,}2\cdot0{,}5)\ \text{mm} = (-0{,}2598 + 0{,}6)\ \text{mm} = 0{,}3402\ \text{mm}
          $$
      - tipo: calcular
        titulo: El giro de la barra, en el mismo ejemplo
        pregunta: |
          En el mismo ejemplo, ¿cuánto gira la barra, en $10^{-4}$ rad
          (antihorario positivo)?
        respuesta:
          tipo: numero
          valor: '5.946'
          tolerancia: 0.005
          formato: un número, en diezmilésimas de radián
        distractores:
          - valor: '6.185'
            mensaje: |
              Has dividido el módulo de $\vec{u}_C - \vec{u}_B$ por la
              longitud. El giro solo lo da la componente **perpendicular** a
              la barra; la paralela es el alargamiento.
          - valor: '3.830'
            mensaje: |
              Es solo la componente perpendicular del desplazamiento de C. B
              también se mueve en perpendicular, y lo que gira la barra es la
              diferencia.
        pista: |
          $\beta = (\vec{u}_C - \vec{u}_B)\cdot\hat{n}_{BC}/L$, con
          $\hat{n}_{BC} = (-\sin30^{\circ},\ \cos30^{\circ})$.
        desarrollo: |
          $$
          \beta = \frac{-0{,}3\cdot(-0{,}5) + 1{,}2\cdot0{,}866}{2000} = \frac{1{,}1892}{2000} = 5{,}946\cdot10^{-4}
          $$

          en radianes, antihorario.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Describe el proceso de deformación de una barra articulada y deduce
          su alargamiento, como en el examen.
        rubrica:
          - punto: >-
              Traslación: la barra BC pasa a B′C1, paralela a sí misma, con
              todos sus puntos moviéndose lo mismo que B.
            porque: >-
              Es el primer movimiento de los apuntes. Una traslación no
              cambia la longitud.
            minimo: true
          - punto: >-
              Deformación pura: entre B′C1 y B′C2 la barra se alarga ΔL en su
              propia dirección.
            porque: >-
              Es el único paso que cambia la longitud, y donde entra la ley
              de comportamiento, ΔL = NL/EA + ε0L (ec. 8.9).
            minimo: true
          - punto: >-
              Giro de sólido rígido alrededor de B′: de B′C2 a B′C3, un ángulo
              β pequeño.
            porque: >-
              El giro lleva C a su posición final sin cambiar la longitud.
            minimo: true
          - punto: >-
              El arco C2C3 se sustituye por la tangente, perpendicular a la
              barra, porque β es pequeño.
            porque: >-
              Es lo que convierte el problema en lineal: el giro solo mueve C
              en perpendicular a la barra.
            minimo: true
          - punto: >-
              Proyectando la posición final sobre la inicial (cos β ≈ 1):
              ΔL = B0′C0′ − BC = CC0′ − BB0′, la diferencia de las
              proyecciones de los desplazamientos de los extremos sobre la
              barra (ecs. 8.10 a 8.12).
            porque: >-
              Es la fórmula que se usa en todas las estructuras articuladas
              para escribir la compatibilidad.
            minimo: true
          - punto: >-
              Se dice para qué sirve: con ella cada alargamiento queda en
              función de los desplazamientos de los nudos, y al revés, a
              partir de los alargamientos se construye la posición de un
              nudo (con perpendiculares a las barras).
            porque: >-
              Es como se usa en los problemas del tema 8.
      - tipo: justificar
        pregunta: Ordena el proceso. Una pieza es falsa.
        piezas:
          - texto: >-
              La barra se traslada de BC a B′C1, sin cambiar de longitud ni
              de dirección.
          - texto: >-
              Se alarga $\Delta L$ en su dirección: de B′C1 a B′C2.
          - texto: >-
              Gira como sólido rígido un $\beta$ pequeño alrededor de B′: de
              B′C2 a B′C3.
          - texto: >-
              El arco C2C3 se sustituye por la perpendicular a la barra, y
              proyectando, $\Delta L = CC_0' - BB_0'$.
          - texto: >-
              El alargamiento es el módulo del desplazamiento relativo de los
              extremos, $|\vec{u}_C - \vec{u}_B|$.
            trampa: true
            mensaje: |
              El desplazamiento relativo tiene una parte paralela a la barra,
              que es el alargamiento, y otra perpendicular, que es el giro
              $\beta L$. Solo la paralela cambia la longitud.
    resolucion: |
      **El proceso** (apuntes del tema 8, apartado 8.4, pág. 7, fig. 8.2). En
      una estructura articulada cada barra trabaja a esfuerzo axial y su
      alargamiento sigue la ec. 8.9. Para pasar de la posición inicial BC a
      la final B′C′, la barra hace cuatro cosas:

      1. **Traslación.** BC pasa a B′C1: todos sus puntos se mueven lo mismo
         que B. No cambia ni la longitud ni la dirección.
      2. **Deformación pura.** De B′C1 a B′C2 la barra se alarga $\Delta L$
         en su propia dirección. Es el único paso que cambia la longitud.
      3. **Giro de sólido rígido.** De B′C2 a B′C3 la barra gira un ángulo
         $\beta$ alrededor de B′; C describe un arco.
      4. **La tangente en lugar del arco.** Como $\beta$ es pequeño, el arco
         C2C3 se sustituye por la tangente, perpendicular a la barra, que
         lleva a C′.

      **El alargamiento** (fig. 8.3). Se proyecta la posición final sobre la
      dirección inicial. Como $\beta$ es pequeño, $\cos\beta \approx 1$ y la
      proyección de B′C′ es su longitud (ecs. 8.10 y 8.11):

      $$
      \Delta L = B'C' - BC = B_0'C_0' - BC
      $$

      y escribiendo $B_0'C_0'$ desde la longitud inicial (ec. 8.12):

      $$
      \Delta L = BC - BB_0' + CC_0' - BC = CC_0' - BB_0'
      $$

      El alargamiento es la diferencia de las proyecciones de los
      desplazamientos de los extremos sobre la dirección inicial de la
      barra: $\Delta L = (\vec{u}_C - \vec{u}_B)\cdot\hat{e}_{BC}$. La parte
      perpendicular de $\vec{u}_C - \vec{u}_B$ es el giro,
      $\beta = (\vec{u}_C - \vec{u}_B)\cdot\hat{n}_{BC}/L$.

      **Un ejemplo (nuestro).** Una barra de 2 m a 30°, con
      $\vec{u}_B = (0{,}5;\ -0{,}2)$ mm y $\vec{u}_C = (0{,}2;\ 1{,}0)$ mm:
      $\Delta L = (-0{,}3\cdot0{,}866 + 1{,}2\cdot0{,}5)\ \text{mm} = 0{,}3402\ \text{mm}$ y
      $\beta = 5{,}946\cdot10^{-4}$ rad. El guion lo comprueba con la
      longitud final exacta, $|\overrightarrow{BC} + \vec{u}_C - \vec{u}_B| - L$,
      con desplazamientos cada vez más pequeños: tiende a la proyección.

      **Para qué sirve.** Es la ecuación de compatibilidad de todas las
      estructuras articuladas: cada alargamiento, en función de los
      desplazamientos de los nudos. Y al revés: conocidos los alargamientos
      de dos barras que llegan a un nudo, su posición sale de llevar cada
      alargamiento sobre su barra y trazar perpendiculares.

  # ── Teoría · pregunta 4 · la compatibilidad en el plano.
  - id: exerm1516-1par-4-la-compatibilidad-en-el-plano
    titulo: Las condiciones de compatibilidad de deformaciones en el plano
    fuente: >-
      Pregunta 4 de teoría · Primer parcial de 2015-2016 (hoja de teoría del 9
      de noviembre de 2015) · Elasticidad y Resistencia de Materiales, Escuela
      Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 1 punto. La
      misma pregunta, con las mismas palabras, volvió a caer en el primer
      parcial de 2016-2017, que está resuelto en el sitio; aquí se resuelve
      de nuevo, con otro ejemplo. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 3, apartado 3.8
      (págs. 19 y 20, ecs. 3.61 a 3.63).
    nivel: examen
    enunciado: |
      (1p) Deducir las condiciones de compatibilidad de deformaciones en el
      caso bidimensional.
    pide: >-
      La ecuación εx,yy + εy,xx = γxy,xy, deducida de que los desplazamientos
      y el giro son funciones del punto.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dice la condición de compatibilidad?
        opciones:
          - texto: >-
              Que las tres deformaciones del plano no son independientes:
              salen de dos desplazamientos, y si no cumplen la condición no
              hay $u$, $v$ que las produzcan
            correcta: true
            mensaje: |
              Eso es. Es una condición de integrabilidad: garantiza que al
              integrar las deformaciones el sólido no se abra ni se solape.
          - texto: >-
              Que las deformaciones tienen que ser pequeñas
            mensaje: |
              La teoría ya supone deformaciones pequeñas, pero la
              compatibilidad es otra cosa: una relación entre las derivadas
              de $\varepsilon_x$, $\varepsilon_y$ y $\gamma_{xy}$ que vale
              para cualquier tamaño dentro de la teoría lineal.
          - texto: >-
              Que las deformaciones y las tensiones están relacionadas por la
              ley de Hooke
            mensaje: |
              Eso es el comportamiento del material (tema 4). La
              compatibilidad es pura geometría: vale para cualquier material.
      - tipo: calcular
        titulo: La γxy que hace compatible un campo, en un ejemplo
        pregunta: |
          Un ejemplo nuestro, con las coordenadas en m:

          $$
          \varepsilon_x = 3\cdot10^{-4}\,xy^{2},\qquad \varepsilon_y = 2\cdot10^{-4}\,x^{3},\qquad \gamma_{xy} = c\cdot10^{-4}\,x^{2}y
          $$

          ¿Qué valor de $c$ hace el campo compatible?
        respuesta:
          tipo: numero
          valor: '9'
          tolerancia: 0.01
          formato: un número
        distractores:
          - valor: '4.5'
            mensaje: |
              Has tratado la $\gamma_{xy}$ como la componente del tensor,
              $\varepsilon_{xy}$, en la ecuación que lleva el 2. Con la
              distorsión ingenieril la ec. 3.63 es
              $\varepsilon_{x,yy} + \varepsilon_{y,xx} = \gamma_{xy,xy}$, sin 2.
          - valor: '-9'
            mensaje: |
              El signo: en la ec. 3.63 los dos lados suman, sin ningún menos.
              Sale de igualar las derivadas cruzadas del giro.
        pista: |
          $\varepsilon_{x,yy} + \varepsilon_{y,xx} = \gamma_{xy,xy}$ (ec. 3.63).
        desarrollo: |
          $\varepsilon_{x,yy} = 6\cdot10^{-4}x$, $\varepsilon_{y,xx} = 12\cdot10^{-4}x$
          y $\gamma_{xy,xy} = 2c\cdot10^{-4}x$, así que $2c = 18$ y $c = 9$.
          Ese campo lo dan $u = 1{,}5\cdot10^{-4}x^{2}y^{2}$ y
          $v = 2\cdot10^{-4}x^{3}y$: con ellos
          $\gamma_{xy} = u_{,y} + v_{,x} = (3 + 6)\cdot10^{-4}x^{2}y$.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Deduce la condición de compatibilidad en el plano como en el examen.
        rubrica:
          - punto: >-
              Se plantea el problema: tres deformaciones (εx, εy, γxy) que
              salen de solo dos desplazamientos (u, v).
            porque: >-
              Es el porqué de la pregunta.
            minimo: true
          - punto: >-
              Se escriben las diferenciales de los desplazamientos con la
              deformación pura y el giro: du = εx dx + (½γxy + ωxy) dy y
              dv = (½γxy − ωxy) dx + εy dy (ec. 3.61).
            porque: >-
              Es el punto de partida de los apuntes.
            minimo: true
          - punto: >-
              Se pide que du y dv sean diferenciales exactas, y salen las
              derivadas del giro: ωxy,x = εx,y − ½γxy,x y
              ωxy,y = ½γxy,y − εy,x (ec. 3.62).
            porque: >-
              Que sean exactas quiere decir que u y v dependen del punto y no
              del camino por el que se integra.
            minimo: true
          - punto: >-
              Se pide lo mismo al giro, ωxy,xy = ωxy,yx, y queda
              εx,yy + εy,xx = γxy,xy (ec. 3.63).
            porque: >-
              Es la condición que pide el examen, la única en el plano.
            minimo: true
          - punto: >-
              Se dice la hipótesis: segundas derivadas de las deformaciones
              continuas (teorema de Schwarz).
            porque: >-
              Es lo que permite cruzar las derivadas.
          - punto: >-
              Se comprueba por el camino corto: con εx = u,x, εy = v,y y
              γxy = u,y + v,x, los dos lados valen u,xyy + v,xxy.
            porque: >-
              Enseña que la condición es necesaria; la deducción de los
              apuntes, que además basta.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Hay tres deformaciones y dos desplazamientos: las deformaciones
              tienen que cumplir una condición para que existan $u$ y $v$.
          - texto: >-
              $du = \varepsilon_x\,dx + \left(\tfrac12\gamma_{xy} + \omega_{xy}\right)dy$
              y $dv = \left(\tfrac12\gamma_{xy} - \omega_{xy}\right)dx + \varepsilon_y\,dy$.
          - texto: >-
              Derivadas cruzadas iguales:
              $\omega_{xy,x} = \varepsilon_{x,y} - \tfrac12\gamma_{xy,x}$ y
              $\omega_{xy,y} = \tfrac12\gamma_{xy,y} - \varepsilon_{y,x}$.
          - texto: >-
              Con $\omega_{xy,xy} = \omega_{xy,yx}$:
              $\varepsilon_{x,yy} + \varepsilon_{y,xx} = \gamma_{xy,xy}$.
          - texto: >-
              Cualquier terna de funciones $\varepsilon_x$, $\varepsilon_y$,
              $\gamma_{xy}$ derivables es un campo de deformaciones posible.
            trampa: true
            mensaje: |
              Es justo lo que la compatibilidad niega. Las tres salen de dos
              desplazamientos y están ligadas: con $c \ne 9$, el campo del
              ejemplo no lo produce ningún $u$, $v$.
    resolucion: |
      **El problema.** En el plano hay tres deformaciones, $\varepsilon_x$,
      $\varepsilon_y$ y $\gamma_{xy}$, y solo dos desplazamientos, $u$ y $v$.
      Si se dan tres funciones cualesquiera, en general no existe un campo de
      desplazamientos que las produzca. La condición para que exista es la
      ecuación de compatibilidad (apuntes del tema 3, apartado 3.8,
      págs. 19 y 20).

      **Las diferenciales** (ec. 3.61). El desplazamiento relativo de dos
      puntos próximos es deformación pura más giro:

      $$
      \begin{aligned}
      du &= \varepsilon_x\,dx + \left(\tfrac12\gamma_{xy} + \omega_{xy}\right)dy\\
      dv &= \left(\tfrac12\gamma_{xy} - \omega_{xy}\right)dx + \varepsilon_y\,dy
      \end{aligned}
      $$

      **$u$ y $v$ son funciones del punto.** $du$ y $dv$ tienen que ser
      diferenciales exactas: sus derivadas cruzadas son iguales. De la
      primera, $\varepsilon_{x,y} = \tfrac12\gamma_{xy,x} + \omega_{xy,x}$; de
      la segunda, $\tfrac12\gamma_{xy,y} - \omega_{xy,y} = \varepsilon_{y,x}$.
      Así salen las derivadas del giro (ec. 3.62):

      $$
      \omega_{xy,x} = \varepsilon_{x,y} - \tfrac12\gamma_{xy,x},\qquad
      \omega_{xy,y} = \tfrac12\gamma_{xy,y} - \varepsilon_{y,x}
      $$

      **El giro también.** $\omega_{xy}$ tiene que ser función del punto:
      $\omega_{xy,xy} = \omega_{xy,yx}$. Derivando la primera respecto de $y$
      y la segunda respecto de $x$:

      $$
      \varepsilon_{x,yy} - \tfrac12\gamma_{xy,xy} = \tfrac12\gamma_{xy,xy} - \varepsilon_{y,xx}
      \quad\Longrightarrow\quad
      \varepsilon_{x,yy} + \varepsilon_{y,xx} = \gamma_{xy,xy}
      $$

      que es la ec. 3.63, la condición de compatibilidad en el plano. Para
      cruzar las derivadas hace falta que las segundas derivadas de las
      deformaciones sean continuas (teorema de Schwarz). En el espacio salen
      seis ecuaciones análogas (ec. 3.64).

      **El camino corto.** Con $\varepsilon_x = u_{,x}$,
      $\varepsilon_y = v_{,y}$ y $\gamma_{xy} = u_{,y} + v_{,x}$, los dos
      lados valen $u_{,xyy} + v_{,xxy}$. Ese camino enseña que la condición
      es necesaria; el de los apuntes, que además basta para que existan
      $u$ y $v$.

      **Un ejemplo (nuestro).** Con $\varepsilon_x = 3\cdot10^{-4}xy^{2}$ y
      $\varepsilon_y = 2\cdot10^{-4}x^{3}$, la única
      $\gamma_{xy} = c\cdot10^{-4}x^{2}y$ compatible es la de $c = 9$:
      $6x + 12x = 2c\,x$. El campo $u = 1{,}5\cdot10^{-4}x^{2}y^{2}$,
      $v = 2\cdot10^{-4}x^{3}y$ la produce. El motor del curso lo confirma:
      deformando con ese campo dos aristas $dx$ y $dy$ en el punto (1, 2) y
      midiendo cuánto se cierra el ángulo recto (`gammaDeAristas`), sale
      $\gamma_{xy} = 18\cdot10^{-4} = 9\cdot1^{2}\cdot2\cdot10^{-4}$.

  # ── Problema 1 · la viga rígida ABC, las barras EB y CD y el resorte en E.
  - id: exerm1516-1par-5-la-viga-rigida-con-un-resorte-en-e
    titulo: La viga rígida ABC, las barras EB y CD y un resorte muy blando en E
    fuente: >-
      Ejercicio 1 · Primer parcial de 2015-2016 (hoja de ejercicios del 16 de
      noviembre de 2015) · Elasticidad y Resistencia de Materiales, Escuela
      Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 2 puntos. Es,
      palabra por palabra y con la misma figura, el ejercicio 8.6 de los
      enunciados de clase del tema 8, que no trae resolución. El examen
      tampoco la publica; el desarrollo es nuestro, con el convenio del
      tema 8 (N > 0 tracción).
    nivel: examen
    enunciado: |
      (2 p) En la estructura de la figura la viga ABC es rígida, está
      articulada en el apoyo fijo A y se sustenta por las barras articuladas
      en sus extremos EB y CD. La sección y el módulo de elasticidad de las
      barras es $A$ y $E$ , respectivamente.

      El apoyo D es fijo. En cambio el apoyo E es móvil y está unido a un
      resorte de rigidez $k = EA/(100a)$ en dirección vertical, que está
      fijo en F.

      Si se aplica la carga $P$ en la sección B, determinar:

      a) Ángulo girado por la viga ABC.

      b) Desplazamiento vertical de E.

