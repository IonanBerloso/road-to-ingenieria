      sobre ella.

      </figcaption>
      </figure>

      **Notas nuestras.** La galga c está sobre la hipotenusa (el PDF la
      dibuja torcida; lo explica el pie de la figura). Las galgas están en una superficie libre: es tensión plana. $E$ = 42 MPa es
      un módulo muy bajo, el de un plástico blando o un elastómero; se usa
      tal cual, y las tensiones salen en kPa. Si fuera 42 GPa, los mismos
      números saldrían en MPa: las deformaciones no dependen de $E$.
    pide: >-
      a) εx, εy y γxy; ε1, ε2 (y εz) y el ángulo de la dirección 1 con x.
      b) σn y τn en el plano de normal c, en kPa.
    pasos:
      - tipo: reconocer
        pregunta: |
          Para usar la ec. 3.55 hace falta el ángulo de cada galga medido
          desde $x$, en sentido antihorario. ¿Cuál es el de la galga c?
        opciones:
          - texto: >-
              150°: la hipotenusa sube hacia la izquierda formando 30° con la
              base; −30° es la misma recta y da lo mismo
            correcta: true
            mensaje: |
              Eso es. Una galga mide igual en los dos sentidos de su recta:
              con 150° o con −30°, $\cos^{2}$, $\sin^{2}$ y $\sin\cos$ son los
              mismos.
          - texto: >-
              30°, el ángulo que lleva rotulado la figura
            mensaje: |
              El 30° está medido desde la base en el vértice de la **derecha**,
              hacia arriba y a la izquierda. Una recta a 30° de $x$ subiría
              hacia la derecha. Con 30° el signo de $\gamma_{xy}$ sale al
              revés, y las direcciones principales, giradas.
          - texto: >-
              60°, porque la hipotenusa forma 60° con el cateto vertical
            mensaje: |
              60° es el ángulo con el eje $y$, en el vértice de arriba. En la
              ec. 3.55 el ángulo se mide desde $x$: 90° + 60° = 150°.
      - tipo: calcular
        titulo: La distorsión γxy
        pregunta: |
          ¿Cuánto vale $\gamma_{xy}$, en $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '1558.8'
          tolerancia: 0.5
          formato: un número, en millonésimas
        distractores:
          - valor: '-1558.8'
            mensaje: |
              Es la que sale con c a 30°. A 150°, $\sin\theta\cos\theta = -\sqrt3/4$
              es negativo, y $\varepsilon_c = 200$, por debajo de los 875 que
              darían $\varepsilon_x$ y $\varepsilon_y$ solas, pide una
              $\gamma_{xy}$ positiva.
          - valor: '779.4'
            mensaje: |
              Es $\tfrac12\gamma_{xy}$, la componente del tensor. La ec. 3.55
              lleva la distorsión ingenieril entera:
              $\varepsilon_\theta = \varepsilon_x\cos^{2}\theta + \varepsilon_y\sin^{2}\theta + \gamma_{xy}\sin\theta\cos\theta$.
        pista: |
          $\varepsilon_x = \varepsilon_a$, $\varepsilon_y = \varepsilon_b$, y
          con $\theta_c = 150^{\circ}$:
          $\varepsilon_c = \tfrac34\varepsilon_x + \tfrac14\varepsilon_y - \tfrac{\sqrt3}{4}\gamma_{xy}$.
        desarrollo: |
          $$
          \gamma_{xy} = \frac{\tfrac34\cdot1100 + \tfrac14\cdot200 - 200}{\sqrt3/4} = \frac{675}{0{,}4330} = 1558{,}8
          $$

          en $10^{-6}$, es decir, $900\sqrt3\cdot10^{-6}$.
      - tipo: calcular
        titulo: La deformación principal mayor
        pregunta: |
          ¿Cuánto vale $\varepsilon_1$, en $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '1550'
          tolerancia: 0.5
          formato: un número, en millonésimas
        distractores:
          - valor: '2272.5'
            mensaje: |
              Has puesto $\gamma_{xy}$ entera en el radio. En el círculo de
              Mohr de deformaciones la ordenada es $\tfrac12\gamma$: radio
              $\sqrt{450^{2} + 779{,}4^{2}} = 900$.
          - valor: '900'
            mensaje: |
              Es el radio del círculo. La principal es el centro más el radio:
              $650 + 900 = 1550$.
        pista: |
          Centro $\tfrac{\varepsilon_x + \varepsilon_y}{2}$ y radio
          $\sqrt{\left(\tfrac{\varepsilon_x - \varepsilon_y}{2}\right)^{2} + \left(\tfrac{\gamma_{xy}}{2}\right)^{2}}$.
        desarrollo: |
          Centro 650 y radio $\sqrt{450^{2} + 779{,}4^{2}} = 900$:
          $\varepsilon_1 = 650 + 900 = 1550$ y $\varepsilon_2 = 650 - 900 = -250$,
          en $10^{-6}$.
      - tipo: calcular
        titulo: La dirección principal 1
        pregunta: |
          ¿Qué ángulo forma la dirección de $\varepsilon_1$ con el eje $x$, en
          grados (antihorario positivo)?
        respuesta:
          tipo: numero
          valor: '30'
          tolerancia: 0.1
          formato: un número, en grados
        distractores:
          - valor: '-30'
            mensaje: |
              Es la dirección que sale con c a 30°, con $\gamma_{xy}$ negativa.
              Con $\gamma_{xy} > 0$ la dirección 1 queda en el primer
              cuadrante.
          - valor: '60'
            mensaje: |
              Es $2\theta$, el ángulo en el círculo de Mohr. En el sólido el
              ángulo es la mitad: $\operatorname{tg}2\theta = \gamma_{xy}/(\varepsilon_x - \varepsilon_y) = \sqrt3$.
        pista: |
          $\operatorname{tg}2\theta_1 = \dfrac{\gamma_{xy}}{\varepsilon_x - \varepsilon_y}$,
          con el cuadrante que dan los signos.
        desarrollo: |
          $\operatorname{tg}2\theta_1 = 1558{,}8/900 = 1{,}732 = \sqrt3$, y con
          numerador y denominador positivos $2\theta_1 = 60^{\circ}$:
          $\theta_1 = 30^{\circ}$. La dirección 2 está a 120° (o −60°).
          Comprobación: una galga a 30° leería
          $1100\cdot\tfrac34 + 200\cdot\tfrac14 + 1558{,}8\cdot\tfrac{\sqrt3}{4} = 1550$.
      - tipo: calcular
        titulo: La tercera deformación principal
        pregunta: |
          La tercera dirección principal es $z$, normal a la superficie.
          ¿Cuánto vale $\varepsilon_z$, en $10^{-6}$?
        respuesta:
          tipo: numero
          valor: '-700'
          tolerancia: 0.5
          formato: un número, en millonésimas
        distractores:
          - valor: '0'
            mensaje: |
              En tensión plana la nula es $\sigma_z$, no $\varepsilon_z$. La
              superficie se adelgaza por el efecto Poisson de $\sigma_x$ y
              $\sigma_y$.
          - valor: '-455'
            mensaje: |
              Has hecho $-\nu(\varepsilon_x + \varepsilon_y)$, que mezcla
              deformaciones con un coeficiente de tensiones. En tensión plana,
              $\varepsilon_z = -\tfrac{\nu}{1 - \nu}(\varepsilon_x + \varepsilon_y)$
              (de las ecs. 4.24 y 4.25).
        pista: |
          $\varepsilon_z = -\dfrac{\nu}{1 - \nu}\,(\varepsilon_x + \varepsilon_y)$.
        desarrollo: |
          $\varepsilon_z = -\dfrac{0{,}35}{0{,}65}\cdot1300 = -700$, en $10^{-6}$.
          Ordenadas, las tres principales son 1550, −250 y −700.
      - tipo: calcular
        titulo: La tensión normal en el plano perpendicular a c
        pregunta: |
          En el plano perpendicular a la galga c (su normal es la dirección
          de c, a 150° de $x$), ¿cuánto vale $\sigma_n$, en kPa?
        respuesta:
          tipo: numero
          valor: '28'
          tolerancia: 0.05
          formato: un número, en kPa
        distractores:
          - valor: '8.4'
            mensaje: |
              Es $E\varepsilon_c$, como en una barra. En un estado plano la
              tensión en la dirección de c depende también de la deformación
              transversal: hay que pasar por $\sigma_x$, $\sigma_y$ y
              $\tau_{xy}$ (Hooke en tensión plana) y luego proyectar.
          - valor: '56'
            mensaje: |
              Es la del plano que **contiene** a c, de normal a 60°. El
              enunciado pide el perpendicular a c: su normal es la propia
              dirección de c.
        pista: |
          Primero $\sigma_x$, $\sigma_y$, $\tau_{xy}$ con Hooke en tensión
          plana; luego $\sigma_n = \sigma_x\cos^{2}\theta + \sigma_y\sin^{2}\theta + 2\tau_{xy}\sin\theta\cos\theta$
          con $\theta = 150^{\circ}$.
        desarrollo: |
          Con $E/(1 - \nu^{2}) = 47\,863$ kPa y $G = 15\,556$ kPa:
          $\sigma_x = 56$ kPa, $\sigma_y = 28$ kPa y
          $\tau_{xy} = G\gamma_{xy} = 24{,}25$ kPa. En $\theta = 150^{\circ}$:

          $$
          \sigma_n = \left(56\cdot\tfrac34 + 28\cdot\tfrac14 - 2\cdot24{,}25\cdot\tfrac{\sqrt3}{4}\right)\text{kPa} = (42 + 7 - 21)\ \text{kPa} = 28\ \text{kPa}
          $$
      - tipo: calcular
        titulo: La tensión tangencial en ese plano
        pregunta: |
          En el mismo plano, ¿cuánto vale $\tau_n$, en kPa, con el convenio
          de los apuntes (el vector $\hat{t}$ es $\hat{n}$ girado 90° en
          sentido antihorario)?
        respuesta:
          tipo: numero
          valor: '24.25'
          tolerancia: 0.05
          formato: un número, en kPa
        distractores:
          - valor: '-24.25'
            mensaje: |
              El módulo es ese y el signo no: sale si se toma $\hat{t}$ girado
              90° en sentido horario, o con la galga c a 30° (con la
              $\gamma_{xy}$ cambiada de signo). Con $\hat{n}$ a 150° y
              $\hat{t} = (-\sin\theta,\ \cos\theta)$ sale positivo, y con
              $\hat{n}$ a −30° también: al cambiar de sentido $\hat{n}$
              cambia también $\hat{t}$.
          - valor: '28'
            mensaje: |
              28 kPa es $\sigma_n$, la normal de este plano, no la tangencial.
              Y es también, por casualidad, el radio del círculo de Mohr de
              tensiones en el plano,
              $(\sigma_1 - \sigma_2)/2$: la tangencial máxima, la de los planos
              a 45° de las direcciones principales. El plano normal a c está
              a 120° de la dirección 1 y no es uno de esos.
        pista: |
          $\tau_n = \dfrac{\sigma_y - \sigma_x}{2}\sin2\theta + \tau_{xy}\cos2\theta$,
          con $\theta = 150^{\circ}$.
        desarrollo: |
          $$
          \tau_n = \left[\frac{28 - 56}{2}\left(-\frac{\sqrt3}{2}\right) + 24{,}25\cdot\frac12\right]\text{kPa} = (12{,}12 + 12{,}12)\ \text{kPa} = 24{,}25\ \text{kPa}
          $$

          Y el módulo del vector tensión, $\sqrt{28^{2} + 24{,}25^{2}}\ \text{kPa} = 37{,}04\ \text{kPa}$,
          es el mismo que sale de $\{S\} = [\sigma]\{n\}$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Ángulos de las galgas desde $x$: 0°, 90° y 150°. La ec. 3.55
              da $\varepsilon_x = 1100$, $\varepsilon_y = 200$ y
              $\gamma_{xy} = 1558{,}8$, en $10^{-6}$.
          - texto: >-
              Mohr: centro 650 y radio 900, $\varepsilon_1 = 1550$ a 30° de $x$
              y $\varepsilon_2 = -250$ a 120°; en tensión plana,
              $\varepsilon_z = -700$.
          - texto: >-
              Hooke en tensión plana: $\sigma_x = 56$, $\sigma_y = 28$ y
              $\tau_{xy} = 24{,}25$ kPa.
          - texto: >-
              Con $\hat{n}$ en la dirección de c, a 150°:
              $\sigma_n = 28$ kPa y $\tau_n = 24{,}25$ kPa.
          - texto: >-
              Como en el plano no hay tensión normal a la superficie, la
              tensión en la dirección de c es $E\varepsilon_c = 8{,}4$ kPa.
            trampa: true
            mensaje: |
              $\sigma = E\varepsilon$ solo vale en un estado uniaxial. En
              tensión plana la deformación en una dirección depende de las
              dos tensiones del plano: $\sigma_n$ hay que proyectarla desde
              $\sigma_x$, $\sigma_y$ y $\tau_{xy}$, y sale 28 kPa.
    resolucion: |
      **Las galgas.** La galga a está sobre la base ($\theta_a = 0^{\circ}$),
      la b sobre el cateto vertical ($\theta_b = 90^{\circ}$) y la c sobre la
      hipotenusa, que sube hacia la izquierda a 30° de la base:
      $\theta_c = 150^{\circ}$. Con la ec. 3.55,
      $\varepsilon_\theta = \varepsilon_x\cos^{2}\theta + \varepsilon_y\sin^{2}\theta + \gamma_{xy}\sin\theta\cos\theta$
      (todo en $10^{-6}$):

      $$
      \begin{aligned}
      1100 &= \varepsilon_x\\
      200 &= \varepsilon_y\\
      200 &= \tfrac34\varepsilon_x + \tfrac14\varepsilon_y - \tfrac{\sqrt3}{4}\gamma_{xy}
      \end{aligned}
      \quad\Longrightarrow\quad
      \gamma_{xy} = 900\sqrt3 = 1558{,}8
      $$

      **a/ Deformaciones y direcciones principales.** En el círculo de Mohr
      de deformaciones (abscisa $\varepsilon$, ordenada $\tfrac12\gamma$), el
      centro es $(1100 + 200)/2 = 650$ y el radio,
      $\sqrt{450^{2} + 779{,}4^{2}} = 900$:

      $$
      \varepsilon_1 = 650 + 900 = 1550,\qquad \varepsilon_2 = 650 - 900 = -250
      $$

      La dirección 1 forma $\theta_1$ con $x$, con
      $\operatorname{tg}2\theta_1 = \gamma_{xy}/(\varepsilon_x - \varepsilon_y) = \sqrt3$
      y los dos términos positivos: $\theta_1 = 30^{\circ}$. La dirección 2,
      a 120°. Las galgas están en una superficie libre, así que es tensión
      plana ($\sigma_z = 0$) y $z$ es la tercera dirección principal, con

      $$
      \varepsilon_z = -\frac{\nu}{1 - \nu}\,(\varepsilon_x + \varepsilon_y) = -\frac{0{,}35}{0{,}65}\cdot1300 = -700
      $$

      Ordenadas: $1550$, $-250$ y $-700$, en $10^{-6}$.

      **Las tensiones** (tensión plana, ec. 4.25), con
      $E/(1 - \nu^{2}) = 47\,863$ kPa y $G = E/(2(1 + \nu)) = 15\,556$ kPa:

      $$
      \sigma_x = \frac{E}{1 - \nu^{2}}\,(\varepsilon_x + \nu\varepsilon_y) = 56\ \text{kPa},\qquad
      \sigma_y = \frac{E}{1 - \nu^{2}}\,(\varepsilon_y + \nu\varepsilon_x) = 28\ \text{kPa},\qquad
      \tau_{xy} = G\,\gamma_{xy} = 24{,}25\ \text{kPa}
      $$

      Sus principales, en las mismas direcciones que las deformaciones:
      $\sigma_1 = 70$ kPa a 30° y $\sigma_2 = 14$ kPa a 120°.

      **b/ El plano perpendicular a c.** Su normal es la dirección de c,
      $\hat{n} = (\cos150^{\circ},\ \sin150^{\circ})$, y $\hat{t}$ es
      $\hat{n}$ girado 90° en sentido antihorario:

      $$
      \sigma_n = \frac{\sigma_x + \sigma_y}{2} + \frac{\sigma_x - \sigma_y}{2}\cos2\theta + \tau_{xy}\sin2\theta = (42 + 7 - 21)\ \text{kPa} = 28\ \text{kPa}
      $$

      $$
      \tau_n = \frac{\sigma_y - \sigma_x}{2}\sin2\theta + \tau_{xy}\cos2\theta = (12{,}12 + 12{,}12)\ \text{kPa} = 24{,}25\ \text{kPa}
      $$

      Por las principales sale lo mismo: el plano está a 120° de la
      dirección 1, y
      $(70\cos^{2}120^{\circ} + 14\sin^{2}120^{\circ})\ \text{kPa} = (17{,}5 + 10{,}5)\ \text{kPa} = 28\ \text{kPa}$.

      **Lo que vale la pena ver.** La galga c lee 200, lo mismo que la b,
      pero la tensión normal en su dirección (28 kPa) no es $E\varepsilon_c$
      (8,4 kPa): en un estado plano cada deformación depende de las dos
      tensiones. Y con $E$ = 42 MPa las tensiones son de kilopascales; con
      un acero, de 210 GPa, las mismas galgas darían tensiones 5000 veces
      mayores.

      **Comprobaciones.** El motor del curso (`roseta`, `mohrDeformacion`,
      `tensionPlana` y `planoTension`) da las mismas cifras; las principales
      por Jacobi del tensor plano, 1550 y −250; una galga a 30° leería
      1550; y el módulo del vector tensión,
      $\sqrt{28^{2} + 24{,}25^{2}}\ \text{kPa} = 37{,}04\ \text{kPa}$, coincide con
      el de $[\sigma]\{n\}$.

  # ── Problema 3 · la sección de alas desiguales y M0 a 20° de z: el espesor t.
  - id: exerm1516-1par-7-la-seccion-de-alas-desiguales-a-flexion-esviada
    titulo: Una sección de alas desiguales con el momento inclinado, y el espesor que pide la compresión máxima
    fuente: >-
      Ejercicio 3 · Primer parcial de 2015-2016 (hoja de ejercicios del 16 de
      noviembre de 2015) · Elasticidad y Resistencia de Materiales, Escuela
      Universitaria Politécnica de San Sebastián (UPV/EHU). Vale 2 puntos. El
      examen no publica resolución; el desarrollo es nuestro y sigue los
      apuntes del tema 9, apartado 9.2.1 (ecs. 9.8 a 9.13), con su convenio de
      ejes y de momentos (figs. 9.3 y 9.5).
    nivel: examen
    enunciado: |
      (2p) La sección de la figura tiene espesor $t$ y está sometida al
      momento flector $M_0$. Determinar el espesor $t$ según la máxima
      tensión de compresión.

      Datos: $M_0$ = 4000 m·kg; $\sigma_{adm}$ = 1500 kg/cm²

