      <title id="exerm1516-1par-6-la-roseta-y-el-plano-normal-a-c-fig-t">Las tres galgas sobre los lados de un triángulo rectángulo: a sobre x, b sobre y y c sobre la hipotenusa, a 30° de la base</title>
      <desc id="exerm1516-1par-6-la-roseta-y-el-plano-normal-a-c-fig-d">Un triángulo rectángulo dibujado a trazos, con el ángulo recto abajo a la izquierda. Su base es horizontal y sigue el eje x, que continúa a la derecha del triángulo con una flecha; su cateto vertical sigue el eje y, que continúa por encima con una flecha. La hipotenusa baja desde el vértice de arriba hasta el de abajo a la derecha, donde forma 30º con la base; el ángulo lleva su arco. Sobre cada lado hay una galga extensométrica alineada con él: a sobre la base, b sobre el cateto vertical y c sobre la hipotenusa.</desc>
