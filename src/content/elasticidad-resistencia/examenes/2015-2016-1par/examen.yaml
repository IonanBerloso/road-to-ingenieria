asignatura: elasticidad-resistencia
curso: '2015-2016'
convocatoria: primer-parcial
fecha: 9 y 16 de noviembre de 2015
# El primer parcial de Elasticidad y Resistencia de Materiales de 2015-2016
# («Parte 1» en la cabecera), hecho en dos días: la hoja de TEORÍA, fechada el
# 09-11-2015, con cuatro preguntas de 1 punto, y la de ejercicios, fechada el
# 16-11-2015, con tres de 2 puntos. Dos páginas, solo en castellano, y diez
# puntos que el cuadernillo imprime todos. La cabecera es de la Escuela
# Universitaria Politécnica de San Sebastián.
#
# Se transcribe tal cual, con sus puntos impresos. Lo que hay que saber de
# ese texto, dicho antes de que nadie lo deduzca:
#
# 1. **EL PDF PIERDE TROZOS DE DOS FIGURAS, Y EL WORD LAS TIENE.** El PDF es
#    una conversión del Word original (15-ERM-nov1.docx). En el ejercicio 2
#    pierde las flechas de los ejes x e y (deja sus letras sueltas, lejos del
#    triángulo) y el arco de 30°; en el ejercicio 1, el rayado de los cuatro
#    apoyos (deja los rectángulos vacíos). Las geometrías se han leído del
#    Word: la roseta de su lienzo VML (guiones/vml-svg.py, adaptado de la
#    unidad p2e para los grupos sin lienzo y los giros en «fd») y las figuras
#    de los ejercicios 1 y 3 de sus EMF. Cada pie de figura dice qué faltaba.
#
# 2. **LA GALGA c ESTÁ A 150° DE x.** En el PDF la galga c sale torcida:
#    sube hacia la derecha y cruza la hipotenusa; en el Word está sobre
#    ella, girada con la hipotenusa. La
#    hipotenusa forma 30° con la base en el vértice de la derecha y sube
#    hacia la izquierda: c está a 150° de x (o −30°, la misma recta). Con 30°
#    saldría γxy = −1558,8·10⁻⁶ y la dirección 1 a −30°: son distractores de
#    los pasos de cálculo. La línea de las medidas lleva en el Word una ε
#    repetida, en una fuente sin ese glifo, que el PDF no imprime; no se
#    transcribe.
#
# 3. **E = 42 MPa EN EL EJERCICIO 2.** Es un módulo muy bajo (el de un
#    plástico blando o un elastómero) para unas galgas que leen milésimas.
#    Se usa tal cual, como está impreso, y las tensiones salen en kPa; la
#    nota del ejercicio dice que con 42 GPa saldrían los mismos números en
#    MPa. No se corrige.
#
# 4. **LA SECCIÓN DEL EJERCICIO 3.** p0 la llamaba «en Z»; es una sección
#    con las dos alas hacia el mismo lado, la corta arriba y la larga
#    abajo. Las cotas se leen como las dibuja la figura: 10t y 20t son los
#    anchos totales de las alas desde la cara exterior del alma, y el 20t
#    vertical va entre las caras interiores de las alas (alto total, 22t).
#    Los ejes y, z se toman por el centro de gravedad. M0 es un vector a 20°
#    por encima de +z; con el convenio de las figs. 9.3 y 9.5 de los apuntes
#    del tema 9, Mz = −M0 cos 20° y My = −M0 sen 20°. El EMF lleva a la
#    derecha del ala de abajo una línea suelta, sin rótulo, que no es parte
#    de la sección y no se dibuja. La figura del examen no está a escala; la
#    resolución añade una a escala con el eje neutro.
#
# 5. **ERRATAS Y RAREZAS DEL TEXTO, CONSERVADAS**: «2.10⁵» por 2·10⁵ y
#    «20mm» sin espacio (teoría 2), «εa=» sin espacio y «E = 42 MPa ;»
#    (ejercicio 2), «(2 p)» con espacio y «A y E ,» (ejercicio 1), y la
#    compresión axial, que el texto llama σP y la figura rotula σ con
#    subíndice p’ (teoría 1). La hoja de ejercicios no lleva título de
#    «EJERCICIOS» en la cabecera; la de teoría sí, «TEORÍA».
#
# 6. **DOS NUMERACIONES.** La teoría va de 1 a 4 y los ejercicios vuelven a
#    empezar en 1. Aquí la teoría son n 1 a 4 y los ejercicios n 5, 6 y 7;
#    la `fuente` de cada ejercicio dice el nombre impreso.
#
# 7. **LA PREGUNTA 3 SE PARTE EN DOS.** Imprime «3. Responder a las
#    siguientes preguntas:» y dos mitades, a) y b), de «(0,5p)» cada una y
#    de cosas distintas: la a) pasa una carga por metro de horizontal a qr y
#    qθ en una pieza curva (tema 7) y la b) pide el proceso de deformación
#    de una barra articulada (tema 8). Son dos ejercicios, los dos con n 3;
#    cada uno lleva la frase común, su mitad y una nota que remite a la
#    otra. El 3 no imprime total: el punto de puntosImpresos es la suma de
#    sus dos medios.
#
# 8. **TRES PREGUNTAS YA CONOCIDAS.** La teoría 1 es, con la misma figura y
#    las mismas palabras salvo «el valor», el ejercicio 6.2 de los enunciados
#    de clase del tema 6, y el ejercicio 1, el 8.6 de los del tema 8; ninguno de los dos
#    trae resolución en el material del curso. La teoría 4 es la misma
#    pregunta, con las mismas palabras, que la 4 del primer parcial de
#    2016-2017, ya publicada: se resuelve de nuevo, con otro ejemplo, y su
#    `fuente` lo dice.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso (src/lib/erm) y de un segundo camino
# (fase-p/p6b, guiones/cifras.mjs). El motor no tiene flexión, piezas curvas
# ni el proceso de deformación de una barra suelta: las cifras del ejercicio
# 3 y de la pregunta 3 salen de las fórmulas de los apuntes y se comprueban
# por integración numérica, ejes principales, equilibrio y la geometría
# exacta. Las preguntas 1, 3 y 4 de la teoría no traen números o los traen
# en función de una incógnita: sus pasos de cálculo usan ejemplos nuestros,
# y lo dicen.
pdf: 2015-2016-1par.pdf
puntosImpresos:
  fuente: >-
    Impresos junto a cada pregunta: «(1p)» en las preguntas 1, 2 y 4 de la
    teoría, «(0,5p)» en cada mitad de la 3, que no imprime total, y «(2p)» o
    «(2 p)» en los tres ejercicios; págs. 1 y 2 del cuadernillo.
  reparto:
    - { n: 1, puntos: 1 }
    - { n: 2, puntos: 1 }
    - { n: 3, puntos: 1 }
    - { n: 4, puntos: 1 }
    - { n: 5, puntos: 2 }
    - { n: 6, puntos: 2 }
    - { n: 7, puntos: 2 }

