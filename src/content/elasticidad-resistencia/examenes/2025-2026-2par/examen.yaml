fecha: 16 de enero de 2026
# La segunda parte de Elasticidad y Resistencia de Materiales del 16 de
# enero de 2026: dos hojas impresas «PARTE 2», una de teoría con tres
# cuestiones (1,25, 1,25 y 1,5 puntos) y una de problemas con dos (3,5 y
# 2,5 puntos). Diez puntos en total, y cada pregunta imprime los suyos.
#
# 1. **LA FUENTE SON FOTOS DE MÓVIL.** Llegaron dos fotos, una de cada hoja.
#    Las fotos de exámenes no se publican nunca: no hay PDF, y `sinPdf` lo
#    dice. Las figuras están todas redibujadas. Cada hoja es bilingüe,
#    castellano a la izquierda y euskera a la derecha, y se transcribe
#    **solo la columna en castellano**, tal cual.
#
# 2. **ES LA PARTE 2 DE LA FINAL DEL MISMO DÍA.** El examen final de ese día
#    (`2025-2026-ord`) son dos partes de 10 puntos en hojas separadas, y
#    estas dos hojas son su parte 2: se entiende que quien aprobó el primer
#    parcial hizo solo esta. Las cinco preguntas se resuelven aquí, y la final apunta a
#    estos ids (lección 16: la misma pregunta, con los mismos puntos). Los
#    enunciados de los dos problemas van sin su «(3.5p)» y su «(2.5p)», y
#    cada hoja pinta sus puntos desde `puntosImpresos`; la teoría conserva
#    los suyos al principio del enunciado, como en los parciales de
#    2022-2023.
#
# 3. **LA NUMERACIÓN.** La teoría va de la 1 a la 3 y los problemas vuelven
#    a empezar en 1. Aquí la teoría son **n 1 a 3** y los problemas **n 4 y
#    5**; la `fuente` de cada ejercicio dice el número impreso, que no se
#    copia en el enunciado.
#
# 4. **LO QUE EL TEXTO NO DICE Y LA FIGURA SÍ.** Las lecturas que cambian
#    una cifra van también en la nota de su enunciado; las de dibujo, en el
#    pie de su figura.
#    - Teoría 1: las barras DF y EG son tangentes al disco en D y en E,
#      paralelas entre sí y perpendiculares al eje, como las dibuja la
#      figura; hacen un par puro, y el eje solo trabaja a torsión. La línea
#      de datos (longitudes y E = 2.5G) va escrita junto a la figura, y se
#      pasa al texto. La figura no está a escala.
#    - Teoría 2: A se dibuja igual que D, un punto sobre un techo rayado, y
#      se lee como articulación: el conjunto es isostático y el EA del
#      enunciado no entra (con A empotrado, C no se movería). D está a la
#      altura de A (la línea de puntos de la figura) y CD va a 45°. No se da
#      el coeficiente de dilatación: se llama α.
#    - Problema 1: la figura rotula q lo que el texto llama q0, y la carga
#      se lee en kg/m (la hoja pone «Kg/m²»). Los cuatro apoyos se dibujan
#      iguales. Las tres cotas de 5t de la sección van entre caras, y el ala
#      mide 17t; la de 10t va de la cara de abajo del ala al final de las
#      almas. σadm vale igual a tracción y a compresión. La ecuación de los
#      tres momentos y el triángulo de ayuda van impresos en la hoja, y se
#      transcriben.
#    - Problema 2: AB es vertical y BC va según z, como el triedro de la
#      figura; las dos miden a. «Rígida» se lee como nudo rígido en B: si la
#      barra entera fuera indeformable, no habría nada que calcular. El
#      resorte va en B según x. La flecha de P es indicativa: la dirección
#      la dan sus componentes.
#
# 5. **LO QUE ES DEL ALUMNO Y NO DEL ENUNCIADO.** La foto de la teoría lleva
#    marcas a mano en rojo (un círculo alrededor del «(1.25p)» de la teoría
#    2, y trazos en A y en C de su figura). No se transcriben ni se dibujan.
#
# 6. **GRAFÍAS DEL TEXTO, CONSERVADAS**: «esta solidariamente» sin tilde y
#    «(1,25p)» con coma (teoría 1), «(1.25p)» y «(1.5p)» con punto (teorías
#    2 y 3), «Calcula el espesor t de la sección para los valores de,» y
#    «q0=200Kg/m²» (problema 1), «K=3EI/2a³ .» con el espacio, «la sección
#    en circular» y «(KN)» en la figura (problema 2).
#
# 7. **EL EUSKERA.** Pide lo mismo en las cinco. En el problema 1 escribe
#    «q0 ren funtzio» y deja la τadm sin punto final; en el problema 2 lleva
#    un «duena.v(» suelto. Nada de eso cambia la pregunta.
#
# 8. **PREGUNTAS REPETIDAS.** La teoría 3, «Deduce las tensiones normales en
#    flexión pura.», pide lo mismo que la pregunta 3 del primer parcial de
#    2012-2013 (1,5 puntos) y la cuestión 1 de la segunda parte de enero de
#    2023 (1 punto), con otro texto: ejercicio propio, con otro ejemplo, y
#    su `fuente` lo dice. Las otras cuatro no están en el sitio ni en las
#    entregas de la fase P que se han podido mirar.
#
# 9. **LOS TEMAS.** Teoría 1 al tema 12 (el reparto es por torsión; las
#    barras solo dan la rigidez del disco); teoría 2 al 8; teoría 3 al 9;
#    problema 1 al 11 (los tres momentos; la sección y el espesor son del 9);
#    problema 2 al 13 (Menabrea con un resorte y la fuerza unidad).
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso y de un segundo camino (fase-p/p9k,
# guiones/cifras.mjs). La teoría 3 lleva un ejemplo numérico nuestro, y lo
# dice.
sinPdf: >-
  El enunciado solo ha llegado en fotos de las dos hojas impresas, y las
  fotos de exámenes no se publican: la transcripción de cada pregunta es la
  única versión, y las figuras están redibujadas. Estas dos hojas son
  también la parte 2 del examen final del mismo día.
sinRuta: >-
  Es entera de los temas 8 a 13, que este curso no entran en el parcial, y
  la ruta que la cubriría, la del parcial 2, todavía no está escrita.
puntosImpresos:
  fuente: >-
    Cabecera de cada pregunta: «(1,25p)», «(1.25p)» y «(1.5p)» en la hoja de
    teoría, y «(3.5p)» y «(2.5p)» en la de problemas.
  reparto:
    - { n: 1, puntos: 1.25 }
    - { n: 2, puntos: 1.25 }
    - { n: 3, puntos: 1.5 }
    - { n: 4, puntos: 3.5 }
    - { n: 5, puntos: 2.5 }

