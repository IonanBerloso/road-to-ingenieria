      <figcaption>

      Redibujada de la foto de la hoja. La foto lleva además unas marcas a
      mano en rojo —un círculo alrededor del «(1.25p)» del enunciado y unos
      trazos en A y en C—; no son del enunciado y no se dibujan.

      </figcaption>
      </figure>

      **Notas nuestras.** A y D se toman como articulaciones fijas: la
      figura dibuja las dos igual, un punto sobre un techo rayado. El
      enunciado no nombra el coeficiente de dilatación de la barra, y una
      ΔT solo la alarga a través de él: se llama $\alpha$, y los resultados
      lo llevan junto a ΔT.
    pide: >-
      Los desplazamientos horizontal y vertical del punto C cuando la barra
      CD cambia de temperatura ΔT.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de calcular nada: cuando la barra CD se calienta, ¿qué
          fuerza aparece en ella?
        opciones:
          - texto: >-
              Ninguna: la pieza rígida tiene una articulación en A y la barra
              es el único enlace más; el conjunto es isostático y la barra se
              alarga libremente, arrastrando a ABC, que gira alrededor de A
            correcta: true
            mensaje: |
              Eso es. Tres incógnitas de enlace (dos en A y la barra) para
              tres ecuaciones de equilibrio de ABC, sin cargas: $N = 0$. La
              barra se alarga $\alpha\,\Delta T\,L$ y $EA$ no entra.
          - texto: >-
              Una compresión $N = -EA\,\alpha\,\Delta T$, porque los dos
              extremos de la barra están sujetos
            mensaje: |
              Lo estaría si C no se pudiera mover. C es un punto de la pieza
              ABC, que puede girar alrededor de A: la barra se alarga y la
              pieza gira lo que haga falta, sin que nadie la empuje. Esa
              compresión sería la de A empotrado.
          - texto: >-
              Una fuerza que depende de $EA$, que hay que sacar con la
              compatibilidad
            mensaje: |
              Hace falta compatibilidad cuando hay más enlaces que ecuaciones
              de equilibrio. Aquí no los hay: el $EA$ del enunciado no
              interviene.
      - tipo: calcular
        titulo: El desplazamiento horizontal de C
        pregunta: |
          ¿Cuánto se mueve C en horizontal, en unidades de $a\,\alpha\,\Delta T$
          (positivo hacia la derecha)?
        respuesta:
          tipo: numero
          valor: '-0.6667'
          tolerancia: 0.002
          formato: un número, en a·α·ΔT
        distractores:
          - valor: '0.6667'
            mensaje: |
              El valor es ese y el sentido no. La barra se alarga y empuja C
              alejándolo de D, hacia abajo y a la izquierda: ABC gira en el
              sentido de las agujas del reloj alrededor de A, y C, que está
              debajo de A, va hacia la izquierda.
          - valor: '-1'
            mensaje: |
              Has movido C a lo largo de la barra, lo que se alarga. C no
              puede ir a lo largo de CD: es un punto de la pieza ABC y solo
              se mueve perpendicular a AC. Lo que se alarga la barra es la
              proyección de ese movimiento sobre CD (ec. 8.12).
          - valor: '0'
            mensaje: |
              Saldría girando alrededor de B, con BC horizontal, o con A
              empotrado (entonces C no se mueve y la barra queda comprimida).
              ABC gira alrededor de A, y AC no es horizontal: C baja **y** se
              va a la izquierda.
        pista: |
          C se mueve $\theta\times\overline{AC}$: con $\overline{AC} = (2a, -a)$,
          $u_C = \theta a$ y $v_C = 2\theta a$ ($\theta$ antihorario). La
          proyección de ese movimiento sobre la barra es lo que se alarga,
          $\sqrt{2}\,a\,\alpha\,\Delta T$.
        desarrollo: |
          La barra mide $\sqrt{2}\,a$ y se alarga $\sqrt{2}\,a\,\alpha\,\Delta T$
          (ec. 8.9, p. 7, con $N = 0$). Con D fijo, su alargamiento es la
          proyección del movimiento de C sobre la dirección de D a C,
          $(-1, -1)/\sqrt{2}$:

          $$
          \frac{-u_C - v_C}{\sqrt{2}} = -\frac{3a\,\theta}{\sqrt{2}} = \sqrt{2}\,a\,\alpha\,\Delta T
          \;\Rightarrow\;
          \theta = -\frac{2}{3}\,\alpha\,\Delta T
          $$

          y $u_C = \theta a = -\tfrac{2}{3}\,a\,\alpha\,\Delta T$: hacia la
          izquierda.
      - tipo: calcular
        titulo: El desplazamiento vertical de C
        pregunta: |
          ¿Y en vertical, en unidades de $a\,\alpha\,\Delta T$ (positivo
          hacia arriba)?
        respuesta:
          tipo: numero
          valor: '-1.3333'
          tolerancia: 0.002
          formato: un número, en a·α·ΔT
        distractores:
          - valor: '1.3333'
            mensaje: |
              El valor es ese y el sentido no: la barra, al alargarse, empuja
              C lejos de D, que está arriba a la derecha. C baja.
          - valor: '-1'
            mensaje: |
              Has movido C a lo largo de la barra. C es de la pieza rígida y
              solo se mueve perpendicular a AC; lo que se alarga la barra es
              la proyección de ese movimiento sobre CD.
          - valor: '-2'
            mensaje: |
              Has hecho girar ABC alrededor de B: C solo bajaría, y
              $-v_C/\sqrt{2} = \sqrt{2}\,a\,\alpha\,\Delta T$ da $-2$. El giro
              es alrededor de A, y C se mueve también a la izquierda.
        pista: |
          Con el $\theta$ del paso anterior, $v_C = \theta\cdot2a$ (C está a
          $2a$ a la derecha de A).
        desarrollo: |
          $$
          v_C = \theta\cdot2a = -\frac{4}{3}\,a\,\alpha\,\Delta T
          $$

          C baja. El movimiento total, $\tfrac{2}{3}a\alpha\Delta T\sqrt{5}$,
          es perpendicular a AC, como corresponde a un giro alrededor de A.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              ABC, articulada en A, más la barra CD: tres enlaces y tres
              ecuaciones. Es isostático, $N = 0$, y la barra se alarga
              libremente $\sqrt{2}\,a\,\alpha\,\Delta T$.
          - texto: >-
              ABC solo puede girar alrededor de A: C se mueve $\theta a$ en
              horizontal y $2\theta a$ en vertical.
          - texto: >-
              Lo que se alarga la barra es la proyección del movimiento de C
              sobre CD: $-3a\theta/\sqrt{2} = \sqrt{2}\,a\,\alpha\,\Delta T$, y
              $\theta = -2\alpha\Delta T/3$.
          - texto: >-
              C se mueve $2a\alpha\Delta T/3$ a la izquierda y
              $4a\alpha\Delta T/3$ hacia abajo.
          - texto: >-
              El dato $EA$ hace falta para la fuerza de la barra, que es la
              que mueve C.
            trampa: true
            mensaje: |
              Con un sistema isostático la temperatura no da fuerzas: la
              barra se alarga libremente y la pieza se acomoda. $N = 0$ con
              cualquier $EA$, y C se mueve igual. $EA$ solo entraría si
              hubiera cargas, o si el sistema fuera hiperestático.
    resolucion: |
      **Es isostático.** La pieza ABC es rígida y tiene una articulación en
      A (dos reacciones) y la barra CD (una fuerza): tres incógnitas para las
      tres ecuaciones de equilibrio de ABC. Sin cargas, las tres son nulas:
      $N = 0$. La temperatura no da fuerzas en un sistema isostático; la
      barra se alarga libremente (apuntes del tema 8, ec. 8.3, p. 5, con
      $\varepsilon_0 = \alpha\,\Delta T$, p. 6, y ec. 8.9, p. 7):

      $$
      \Delta L_{CD} = \frac{NL}{EA} + \alpha\,\Delta T\,L = \alpha\,\Delta T\,\sqrt{2}\,a
      $$

      El $EA$ del enunciado no entra.

      **La compatibilidad.** Con origen en A, $x$ a la derecha e $y$ hacia
      arriba: C = $(2a, -a)$ y D = $(3a, 0)$; la barra mide $\sqrt{2}\,a$ y
      va a 45°. ABC solo puede girar alrededor de A un ángulo $\theta$
      (antihorario positivo), y C se mueve

      $$
      u_C = \theta\,a, \qquad v_C = 2\theta\,a
      $$

      Con D fijo, lo que se alarga CD es la proyección del movimiento de C
      sobre la dirección de D a C, $(-1, -1)/\sqrt{2}$ (ecs. 8.10 a 8.12, p.
      8: el arco se sustituye por la tangente):

      $$
      \Delta L_{CD} = \frac{-u_C - v_C}{\sqrt{2}} = -\frac{3a\,\theta}{\sqrt{2}} = \sqrt{2}\,a\,\alpha\,\Delta T
      \quad\Rightarrow\quad
      \theta = -\frac{2}{3}\,\alpha\,\Delta T
      $$

      **El resultado.** ABC gira en el sentido de las agujas del reloj y

      $$
      u_C = -\frac{2}{3}\,a\,\alpha\,\Delta T \ \text{(a la izquierda)},
      \qquad
      v_C = -\frac{4}{3}\,a\,\alpha\,\Delta T \ \text{(hacia abajo)}
      $$

      Si $\Delta T$ fuera negativo (enfriamiento), los dos cambian de
      signo: C subiría y se iría a la derecha.

      **Si A fuera un empotramiento** —no es lo que dibuja la figura—, ABC
      no podría girar: C no se movería, y la barra, sin poder alargarse,
      quedaría comprimida con $N = -EA\,\alpha\,\Delta T$. Es el único caso
      en que el dato $EA$ serviría.

      **Comprobaciones.** El motor del curso (un sólido rígido con una
      articulación y una barra con temperatura) da $N = 0$ con dos $EA$
      distintos y los mismos desplazamientos; la proyección, a mano, también.

  # ── Teoría · cuestión 3 · deducir las tensiones normales en flexión pura.
  #    Impresa «3. (1.5p)». De la familia de la pregunta 3 del parcial 1 de
  #    2012-2013 y de la cuestión 1 de la segunda parte de 2022-2023, con
  #    otro texto y otros puntos: ejercicio propio (lección 16).
  - id: exerm2526-2par-3-las-tensiones-normales-en-flexion-pura
    titulo: Deducir las tensiones normales en flexión pura
    fuente: >-
      Cuestión 3 de teoría · Segunda parte del 16 de enero de 2026 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1,5 puntos. Es la misma hoja que la parte 2
      del examen final de ese día. Transcrita de una foto de la hoja
      impresa. Pide lo mismo, con otras palabras, que la pregunta 3 de
      teoría del primer parcial de 2012-2013 (1,5 puntos) y la cuestión 1
      de la segunda parte de enero de 2023 (1 punto), que están en el
      sitio; aquí va con otro ejemplo. El examen no publica resolución; el
      desarrollo es nuestro y sigue los apuntes del tema 9, apartado 9.2
      (págs. 4 a 12, ecs. 9.1 a 9.13, 9.21 y 9.23). Los pasos de cálculo son
      un ejemplo nuestro.
    nivel: examen
    enunciado: |
      (1.5p) Deduce las tensiones normales en flexión pura.
    pide: >-
      La distribución de las tensiones normales σx en una sección a flexión
      pura, deducida desde sus hipótesis.
    pasos:
      - tipo: reconocer
        pregunta: |
          En la deducción, después de llegar a $\sigma_x = E\,\xi/\rho$,
          ¿qué condiciones de equilibrio de la sección se imponen, y qué
          fija cada una?
        opciones:
          - texto: >-
              Tres: el axil nulo, que lleva el eje neutro por G, y los dos
              flectores, $M_y = \int\sigma_x z\,dA$ y $M_z = \int\sigma_x y\,dA$,
              que dan la orientación del eje neutro y la curvatura
            correcta: true
            mensaje: |
              Eso es (ecs. 9.3, 9.4 y 9.8 a 9.10). $\sigma_x = E\xi/\rho$ tiene
              tres cosas sin fijar —dónde pasa el eje neutro, hacia dónde va y
              cuánto vale $E/\rho$—, y las tres resultantes de las $\sigma_x$
              que en flexión pura se conocen son tres ecuaciones.
          - texto: >-
              Solo la del flector, $M_z = \int\sigma_x\,y\,dA$, que da $E/\rho$
            mensaje: |
              Con eso se da por sabido dónde está el eje neutro. Que pase por
              G lo dice $N = 0$, y hacia dónde va lo dice el otro flector: si
              los ejes no son principales, el eje neutro se tuerce aunque
              $M_y$ sea nulo.
          - texto: >-
              Las seis: $N$, $T_y$, $T_z$, $M_t$, $M_y$ y $M_z$, porque la
              sección está en equilibrio
            mensaje: |
              Las $\sigma_x$ no dan cortantes ni torsor: son normales a la
              sección. Las condiciones que las tocan son las tres de las
              resultantes normales, $N$, $M_y$ y $M_z$.
          - texto: >-
              Ninguna: la ley sale entera de la hipótesis de que las
              secciones siguen planas
            mensaje: |
              La hipótesis da la forma lineal, pero deja sin fijar el eje
              neutro y la curvatura. Sin el equilibrio no se sabe ni dónde
              está la tensión nula ni cuánto vale la tensión en un punto.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la deducción como en el examen, desde las hipótesis hasta
          σx en función de los flectores y el eje neutro.
        rubrica:
          - punto: >-
              Navier-Bernoulli: las secciones siguen planas y perpendiculares
              al eje y giran alrededor del eje neutro; la superficie neutra no
              cambia de longitud, y una fibra a distancia ξ de ella se alarga
              εx = ξ/ρ (ec. 9.1).
            porque: >-
              Es la hipótesis de la que sale que la ley sea lineal.
            minimo: true
          - punto: >-
              Con libertad de deformación en y y en z (σy = σz = 0) y el mismo
              módulo a tracción que a compresión, σx = Eξ/ρ (ec. 9.2).
            porque: >-
              Pasa de deformaciones a tensiones sin más que E.
            minimo: true
          - punto: >-
              N = 0: ∫ξ dA = 0, y el eje neutro pasa por G (ecs. 9.3 y 9.4).
            porque: >-
              Es la condición que sitúa el eje neutro.
            minimo: true
          - punto: >-
              Con ξ = y cos φ + z sen φ (ec. 9.6), σx = C1 y + C2 z (ec. 9.7);
              My = ∫σx z dA y Mz = ∫σx y dA dan My = C1 Iyz + C2 Iy y
              Mz = C1 Iz + C2 Iyz (ecs. 9.8 y 9.9), de donde salen C1 y C2
              (ec. 9.10) y σx en función de los flectores (ecs. 9.11 y 9.12).
            porque: >-
              Es la distribución en unos ejes cualesquiera por G.
            minimo: true
          - punto: >-
              El eje neutro es σx = 0 (ec. 9.13); la tensión máxima está en el
              punto más alejado de él. En ejes principales,
              σx = Mz y/Iz + My z/Iy (ec. 9.21), y con un solo flector,
              σx = Mz y/Iz (ec. 9.23), con M = EI/ρ.
            porque: >-
              Son las formas que se usan, y dicen dónde está la tensión
              máxima.
      - tipo: calcular
        titulo: La tensión en la fibra de abajo, en un ejemplo
        pregunta: |
          Un ejemplo nuestro: una T de acero, con un ala de 100 × 20 mm
          arriba y un alma de 20 × 100 mm debajo (120 mm de canto). La
          sección soporta solo $M_z = 8$ kN·m, positivo con el convenio de
          los apuntes (tracciona la fibra de abajo). ¿Cuánto vale $\sigma_x$
          en la fibra de abajo, en MPa (positiva si es de tracción)?
        respuesta:
          tipo: numero
          valor: '120'
          tolerancia: 0.2
          formato: un número, en MPa
        distractores:
          - valor: '90'
            mensaje: |
              Has puesto el eje neutro a media altura, a 60 mm de la fibra de
              abajo. Pasa por G, que con el ala arriba está a 40 mm de la
              cara de arriba: la fibra de abajo está a 80 mm.
          - valor: '369.23'
            mensaje: |
              Te falta Steiner: $I_z$ es respecto del eje que pasa por G, y
              los dos rectángulos tienen su centro a 30 mm de él.
          - valor: '-120'
            mensaje: |
              El valor es ese y el signo no: $M_z > 0$ tracciona la fibra de
              abajo ($y > 0$ con $y$ hacia abajo).
          - valor: '60'
            mensaje: |
              Es el valor de la fibra de arriba, a 40 mm de G, y allí la
              tensión es de compresión, $-60$ MPa. La de abajo está el doble
              de lejos del eje neutro.
        pista: |
          G, con $y$ hacia abajo desde la cara de arriba:
          $\overline{y} = \sum A_iy_i/\sum A_i$. Después $I_z$ con Steiner y
          $\sigma_x = M_z\,y/I_z$, con $y$ medida desde G.
        desarrollo: |
          Los dos rectángulos tienen 2000 mm² y sus centros a 10 y a 70 mm de
          la cara de arriba. Todo en mm:

          $$
          \overline{y} = \frac{2000\cdot10 + 2000\cdot70}{4000} = 40
          $$

          $$
          I_z = \frac{100\cdot20^{3}}{12} + 2000\cdot30^{2} + \frac{20\cdot100^{3}}{12} + 2000\cdot30^{2} = 5{,}3333\cdot10^{6}
          $$

          en mm⁴.

          La fibra de abajo está a $y = 120 - 40 = 80$ mm de G. Con
          $M_z = 8\cdot10^{6}$ N·mm, en MPa:

          $$
          \sigma_x = \frac{8\cdot10^{6}\cdot80}{5{,}3333\cdot10^{6}} = 120
          $$
      - tipo: calcular
        titulo: El radio de curvatura
        pregunta: |
          Con $E = 200$ GPa, ¿qué radio de curvatura $\rho$ toma la
          superficie neutra, en m?
        respuesta:
          tipo: numero
          valor: '133.33'
          tolerancia: 0.2
          formato: un número, en m
        distractores:
          - valor: '43.333'
            mensaje: |
              Es el radio con el $I_z$ sin Steiner. El momento de inercia de
              la ley $M = EI/\rho$ es respecto del eje neutro, que pasa por G.
          - valor: '0.0075'
            mensaje: |
              Es la curvatura, $1/\rho$, en 1/m. Lo que se pide es su
              inversa.
        pista: |
          De $\sigma_x = E\,\xi/\rho$ en la fibra de abajo, o de
          $M_z = EI_z/\rho$.
        desarrollo: |
          En la fibra de abajo, $\xi = 80$ mm y $\sigma_x = 120$ MPa, y con
          $E = 2\cdot10^{5}$ MPa, en mm:

          $$
          \rho = \frac{E\,\xi}{\sigma_x} = \frac{2\cdot10^{5}\cdot80}{120} = 133333
          $$

          133,33 m. Lo mismo sale de $\rho = EI_z/M_z$.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Las secciones siguen planas y giran alrededor del eje neutro:
              una fibra a distancia $\xi$ de él se alarga $\xi/\rho$.
          - texto: >-
              Sin tensiones en $y$ ni en $z$, Hooke da $\sigma_x = E\,\xi/\rho$.
          - texto: >-
              $N = 0$ obliga a que el momento estático respecto del eje
              neutro sea nulo: el eje neutro pasa por G.
          - texto: >-
              Con $\xi = y\cos\varphi + z\sin\varphi$, los dos flectores dan
              $C_1$ y $C_2$, y con ellos $\sigma_x = C_1y + C_2z$.
          - texto: >-
              En ejes principales y con solo $M_z$, $\sigma_x = M_z\,y/I_z$, y
              la tensión máxima está en la fibra más alejada de G.
          - texto: >-
              El eje neutro pasa por la mitad del canto, porque ahí se
              equilibran las tracciones y las compresiones.
            trampa: true
            mensaje: |
              Las tracciones y las compresiones se equilibran respecto de G,
              no de la mitad del canto: $\int\xi\,dA = 0$. En la T del
              ejemplo, G está a 40 mm de la cara de arriba, no a 60, y la
              fibra de abajo trabaja al doble que la de arriba: 120 MPa de
              tracción frente a 60 de compresión.
    resolucion: |
      **Las hipótesis** (apuntes del tema 9, apartado 9.2.1, p. 4). En
      flexión pura las únicas fuerzas de sección son los flectores $M_y$ y
      $M_z$. Con Navier-Bernoulli, cada sección sigue plana y perpendicular
      al eje deformado, y gira alrededor de una recta suya, el **eje
      neutro**; la superficie que forman los ejes neutros, la superficie
      neutra, no cambia de longitud.

      **Las deformaciones.** Si la superficie neutra se curva con radio
      $\rho$, dos secciones separadas $dx = \rho\,d\theta$ giran $d\theta$
      la una respecto de la otra, y una fibra a distancia $\xi$ de la
      superficie neutra pasa a medir $(\rho + \xi)\,d\theta$:

      $$
      \varepsilon_x = \frac{(\rho + \xi)\,d\theta - \rho\,d\theta}{\rho\,d\theta} = \frac{\xi}{\rho} \qquad (9.1)
      $$

      **Las tensiones.** Con libertad de deformación en $y$ y en $z$
      ($\sigma_y = \sigma_z = 0$) y el mismo módulo a tracción que a
      compresión:

      $$
      \sigma_x = E\,\varepsilon_x = \frac{E}{\rho}\,\xi \qquad (9.2)
      $$

      La ley es lineal, pero tiene tres cosas sin fijar: por dónde pasa el
      eje neutro, hacia dónde va y cuánto vale $E/\rho$. Las fijan las tres
      resultantes de las $\sigma_x$.

      **El eje neutro pasa por G.** No hay axil:

      $$
      N = \int_A \sigma_x\,dA = \frac{E}{\rho}\int_A \xi\,dA = 0 \qquad (9.3,\ 9.4)
      $$

      **Los flectores.** Con $y$ hacia abajo y $\varphi$ el ángulo del eje
      neutro con $z$ (positivo si sube hacia $+z$), la distancia al eje
      neutro es $\xi = y\cos\varphi + z\sin\varphi$ (ec. 9.6), y

      $$
      \sigma_x = \frac{E}{\rho}\,(y\cos\varphi + z\sin\varphi) = C_1\,y + C_2\,z \qquad (9.7)
      $$

      $$
      M_y = \int_A \sigma_x\,z\,dA = C_1\,I_{yz} + C_2\,I_y,
      \qquad
      M_z = \int_A \sigma_x\,y\,dA = C_1\,I_z + C_2\,I_{yz} \qquad (9.8,\ 9.9)
      $$

      $$
      C_1 = \frac{M_y\,I_{yz} - M_z\,I_y}{I_{yz}^{2} - I_y\,I_z},
      \qquad
      C_2 = \frac{M_z\,I_{yz} - M_y\,I_z}{I_{yz}^{2} - I_y\,I_z} \qquad (9.10)
      $$

      y la distribución es $\sigma_x = C_1y + C_2z$ (ec. 9.11), que los
      apuntes escriben también con los momentos equivalentes (ec. 9.12, p.
      8):

      $$
      \sigma_x = \frac{M'_z}{I_z}\,y + \frac{M'_y}{I_y}\,z,
      \qquad
      M'_z = \frac{M_z - M_y\,I_{yz}/I_y}{1 - I_{yz}^{2}/(I_yI_z)},
      \qquad
      M'_y = \frac{M_y - M_z\,I_{yz}/I_z}{1 - I_{yz}^{2}/(I_yI_z)}
      $$

      **El eje neutro**, $\sigma_x = 0$, es la recta por G

      $$
      \frac{y}{z} = -\frac{M'_y\,I_z}{M'_z\,I_y} \qquad (9.13)
      $$

      y las tensiones máximas, de tracción y de compresión, están en los
      puntos más alejados de él.

      **En ejes principales** ($I_{yz} = 0$), $\sigma_x = M_z\,y/I_z + M_y\,z/I_y$
      (ec. 9.21), y con un solo flector $\sigma_x = M_z\,y/I_z$ (ec. 9.23):
      llevada a la ec. 9.2, $M_z = EI_z/\rho$.

      **Un ejemplo nuestro.** Una T de acero con un ala de 100 × 20 mm
      arriba y un alma de 20 × 100 mm, y solo $M_z = 8$ kN·m (tracciona
      abajo). Es simétrica respecto del eje $y$: los ejes son principales.
      G está a $\overline{y} = 40$ mm de la cara de arriba, no a media
      altura, e $I_z = 5{,}3333\cdot10^{6}$ mm⁴ con Steiner. En la fibra de
      abajo, a 80 mm de G, $\sigma_x = 120$ MPa de tracción; en la de arriba,
      a 40 mm, $-60$ MPa. Con $E = 200$ GPa, $\rho = EI_z/M_z = 133{,}33$ m.

      **Comprobaciones.** Las cifras del ejemplo salen del motor del curso
      (propiedades de la sección y tensión en un punto) y, por un segundo
      camino, de Steiner y la ec. 9.23 a mano.

