      - tipo: calcular
        titulo: El mayor flector
        pregunta: |
          Con $a$ = 10 m y $q_0$ = 200 kg/m, ¿cuánto vale el mayor flector
          de la viga en valor absoluto, en kg·m?
        respuesta:
          tipo: numero
          valor: '5000'
          tolerancia: 5
          formato: un número, en kg·m
        distractores:
          - valor: '2062.3'
            mensaje: |
              Es el de B, el mayor de los apoyos interiores. El voladizo hace
              en D $q_0a\cdot a/4 = q_0a^{2}/4$, más del doble.
          - valor: '1725.6'
            mensaje: |
              Es el flector bajo $P$, el mayor positivo de la viga. En D el
              negativo es mucho mayor.
          - valor: '2500'
            mensaje: |
              Es $q_0a^{2}/8$, el de AB como biapoyada. La viga es continua y
              el mayor está en D, por el voladizo.
          - valor: '10000'
            mensaje: |
              Has puesto la fuerza $2P$ en el extremo E, a $a/2$ de D. Está a
              $a/4$ de D: $M_D = q_0a\cdot a/4$.
        pista: |
          Compara el flector de cada apoyo y los máximos de cada vano, con
          $q_0a^{2}$ = 200 · 100 = 20 000 kg·m.
        desarrollo: |
          El mayor en valor absoluto es el de D:

          $$
          |M_D| = \frac{q_0a^{2}}{4} = \frac{200\cdot10^{2}}{4} = 5000
          $$

          en kg·m, de tracción en la fibra de arriba.
      - tipo: calcular
        titulo: El momento de inercia de la sección
        pregunta: |
          ¿Cuánto vale el momento de inercia $I_z$ de la sección respecto del
          eje horizontal que pasa por su centro de gravedad, en $t^{4}$?
        respuesta:
          tipo: numero
          valor: '446.06'
          tolerancia: 0.5
          formato: un número, en t⁴
        distractores:
          - valor: '427.20'
            mensaje: |
              Has tomado el ala de $15t$, sumando las tres cotas de 5t. Las
              cotas van entre caras y dejan fuera las dos almas: el ala mide
              $17t$.
          - valor: '277.97'
            mensaje: |
              Te faltan los momentos de inercia propios de los rectángulos.
              El de las dos almas, $2\cdot t(10t)^{3}/12 = 166{,}67t^{4}$, es
              más de un tercio del total.
          - valor: '598.08'
            mensaje: |
              Has llevado los rectángulos a la mitad del canto, a $5{,}5t$, y
              no al centro de gravedad, que está a $7{,}527t$ de abajo.
        pista: |
          Ala: $17t \times t$ con su centro a $10{,}5t$ de abajo. Almas:
          $2\times(t \times 10t)$ con su centro a $5t$. $\overline{y}$
          desde abajo y Steiner con cada pieza.
        desarrollo: |
          $A = 17t^{2} + 20t^{2} = 37t^{2}$, y desde la parte de abajo de las
          almas

          $$
          \overline{y} = \frac{17\cdot10{,}5 + 20\cdot5}{37}\,t = \frac{278{,}5}{37}\,t = 7{,}527t
          $$

          $$
          I_z = \frac{17}{12}t^{4} + 17t^{2}(2{,}973t)^{2} + 2\cdot\frac{t(10t)^{3}}{12} + 20t^{2}(2{,}527t)^{2} = 446{,}06t^{4}
          $$
      - tipo: calcular
        titulo: El espesor por la tensión normal
        pregunta: |
          ¿Qué espesor $t$ hace falta para que ninguna fibra pase de
          $\sigma_{adm}$ = 1000 kg/cm², en cm?
        respuesta:
          tipo: numero
          valor: '2.0358'
          tolerancia: 0.003
          formato: un número, en cm
        distractores:
          - valor: '1.5731'
            mensaje: |
              Has tomado la fibra de arriba, a $3{,}473t$ de G, que es la que
              tracciona en D. Con la misma admisible a tracción y a
              compresión manda la más alejada, la de abajo de las almas, a
              $7{,}527t$, comprimida.
          - valor: '1.5154'
            mensaje: |
              Has dimensionado con el flector de B. El mayor es el de D,
              $q_0a^{2}/4 = 5000$ kg·m.
          - valor: '0.43860'
            mensaje: |
              Has dejado el flector en kg·m con la tensión en kg/cm². Pasa
              $M$ a kg·cm: $5\cdot10^{5}$.
        pista: |
          $\sigma_{max} = |M|\,y_{max}/I_z$ con $I_z = 446{,}06t^{4}$ e
          $y_{max} = 7{,}527t$: despeja $t^{3}$.
        desarrollo: |
          Con Navier (ec. 9.23, p. 12 del tema 9), en kg y cm:

          $$
          \frac{5\cdot10^{5}\cdot7{,}527t}{446{,}06t^{4}} = 1000
          \;\Rightarrow\;
          t = \sqrt[3]{\frac{5\cdot10^{5}\cdot7{,}527}{446{,}06\cdot1000}} = 2{,}0358
          $$

          en cm.
      - tipo: calcular
        titulo: El espesor por la tensión tangencial
        pregunta: |
          ¿Y qué espesor hace falta para que la tensión tangencial no pase de
          $\tau_{adm}$ = 100 kg/cm², en cm?
        respuesta:
          tipo: numero
          valor: '1.1270'
          tolerancia: 0.002
          formato: un número, en cm
        distractores:
          - valor: '1.5938'
            mensaje: |
              Has tomado el ancho de una sola alma. El corte por el eje
              neutro atraviesa las dos: $b = 2t$.
          - valor: '0.87524'
            mensaje: |
              Has tomado el cortante de B, $0{,}603q_0a$. El mayor es $q_0a$,
              de D a la fuerza $2P$.
          - valor: '0.73521'
            mensaje: |
              Es $V/A$, la tensión media. En una viga la tangencial no es
              uniforme: la máxima está en el eje neutro,
              $\tau = VQ_z/(I_zb)$.
        pista: |
          $\tau_{max} = V\,Q/(I_z\,b)$ en el eje neutro, con $V = q_0a$ =
          2000 kg, $Q$ el momento estático de las dos almas por debajo de G y
          $b = 2t$.
        desarrollo: |
          Por debajo del eje neutro hay dos almas de $t \times 7{,}527t$:

          $$
          Q = 2\cdot7{,}527t\cdot t\cdot\frac{7{,}527t}{2} = 56{,}656t^{3}
          $$

          y con el flujo de la ec. 9.35 (p. 16 del tema 9), repartido por
          igual en el espesor de las dos almas (secciones abiertas de pequeño
          espesor, p. 19), en kg y cm:

          $$
          \frac{2000\cdot56{,}656t^{3}}{446{,}06t^{4}\cdot2t} = 100
          \;\Rightarrow\;
          t = \sqrt{\frac{2000\cdot56{,}656}{446{,}06\cdot2\cdot100}} = 1{,}1270
          $$
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              El voladizo da $M_D = -q_0a^{2}/4$; con $M_A = 0$, la ecuación
              de los tres momentos en B y en C da $M_B = -245q_0a^{2}/2376$ y
              $M_C = 17q_0a^{2}/1188$.
          - texto: >-
              Con los momentos de apoyo, las reacciones y los diagramas: el
              mayor flector es $q_0a^{2}/4$, en D, y el mayor cortante,
              $q_0a$.
          - texto: >-
              La sección: $A = 37t^{2}$, G a $7{,}527t$ de abajo,
              $I_z = 446{,}06t^{4}$.
          - texto: >-
              Por la normal, $t \geq 2{,}036$ cm; por la tangencial,
              $t \geq 1{,}127$ cm. Manda la normal: $t$ = 2,036 cm.
          - texto: >-
              Como el flector de D tracciona arriba, se dimensiona con la
              fibra de arriba, que es la que trabaja a tracción.
            trampa: true
            mensaje: |
              Con la misma admisible a tracción y a compresión manda la fibra
              más alejada de G, sea cual sea su signo: la de abajo, a
              $7{,}527t$, comprimida. Con la de arriba, a $3{,}473t$, saldría
              $t$ = 1,573 cm, y la de abajo pasaría de la admisible.
    resolucion: |
      **a) Los momentos de apoyo.** La viga es continua sobre cuatro apoyos,
      con el voladizo DE. $M_A = 0$ (apoyo extremo), y el voladizo se
      sustituye por su momento en D (apuntes del tema 11, fig. 11.6, p. 7):

      $$
      M_D = -q_0a\cdot\frac{a}{4} = -\frac{q_0a^{2}}{4}
      $$

      Quedan $M_B$ y $M_C$, con la ecuación impresa (ec. 11.4, p. 7, la de
      inercia constante) en B y en C. Los diagramas isostáticos de cada vano
      biapoyado:

      - Vano AB ($L_1 = a$, $q_0$): parábola de área $A_1 = q_0a^{3}/12$,
        centrada: $a_1 = b_1 = a/2$.
      - Vano BC ($L_2 = a$, $P = q_0a/2$ a $2a/3$ de B): triángulo de altura
        $P\cdot(2a/3)(a/3)/a = q_0a^{2}/9$ y área $A_2 = q_0a^{3}/18$; con
        el triángulo de la hoja, su centro está a $a_2 = (a + 2a/3)/3 = 5a/9$
        de B y a $b_2 = (a + a/3)/3 = 4a/9$ de C.
      - Vano CD ($L_3 = a/2$): sin cargas, $A_3 = 0$.

      En B:

      $$
      0 + 2M_B(a + a) + M_C\,a = -6\left[\frac{q_0a^{3}}{12}\cdot\frac{1}{2} + \frac{q_0a^{3}}{18}\cdot\frac{4}{9}\right]
      \;\Rightarrow\;
      4M_B + M_C = -\frac{43}{108}\,q_0a^{2}
      $$

      En C:

      $$
      M_B\,a + 2M_C\Big(a + \frac{a}{2}\Big) + M_D\,\frac{a}{2} = -6\,\frac{q_0a^{3}}{18}\cdot\frac{5}{9}
      \;\Rightarrow\;
      M_B + 3M_C = -\frac{13}{216}\,q_0a^{2}
      $$

      $$
      M_B = -\frac{245}{2376}\,q_0a^{2} \approx -0{,}10311\,q_0a^{2},
      \qquad
      M_C = \frac{17}{1188}\,q_0a^{2} \approx 0{,}014310\,q_0a^{2}
      $$

      **Las reacciones.** Cada vano, con sus cargas y sus dos momentos:

      $$
      R_A = \frac{q_0a}{2} + \frac{M_B}{a} = \frac{943}{2376}\,q_0a \approx 0{,}397\,q_0a,
      \qquad
      R_B = \frac{q_0a}{2} - \frac{M_B}{a} + \frac{P}{3} + \frac{M_C - M_B}{a} \approx 0{,}887\,q_0a
      $$

      $$
      R_C = \frac{2P}{3} - \frac{M_C - M_B}{a} + \frac{M_D - M_C}{a/2} \approx -0{,}313\,q_0a,
      \qquad
      R_D = q_0a - \frac{M_D - M_C}{a/2} \approx 1{,}529\,q_0a
      $$

      Suman $2{,}5\,q_0a$, que es $q_0a + q_0a/2 + q_0a$. $R_C$ sale
      negativa: el apoyo C tiene que tirar de la viga hacia abajo, porque
      el voladizo, al bajar E, levanta el tramo CD.

      **Los diagramas** (los del paso de dibujar). Cortante: de
      $0{,}397q_0a$ en A, recto, a $-0{,}603q_0a$ en B; $0{,}284q_0a$ hasta
      $P$ y $-0{,}216q_0a$ hasta C; $-0{,}529q_0a$ hasta D; $q_0a$ hasta la
      fuerza $2P$ y cero hasta E. Flector: parábola en AB con el máximo,
      $R_A^{2}/(2q_0) \approx 0{,}0788q_0a^{2}$, a $0{,}397a$ de A, y
      $-0{,}1031q_0a^{2}$ en B; $0{,}0863q_0a^{2}$ bajo $P$; $0{,}0143q_0a^{2}$
      en C; $-0{,}25q_0a^{2}$ en D y cero desde la fuerza $2P$. Se anula en
      $0{,}794a$, $1{,}363a$ y $2{,}027a$ desde A.

      **b) El espesor.** Con $a$ = 10 m y $q_0$ = 200 kg/m: el mayor flector
      es $q_0a^{2}/4$ = 5000 kg·m = $5\cdot10^{5}$ kg·cm, en D (tracciona
      arriba), y el mayor cortante, $q_0a$ = 2000 kg, de D a la fuerza $2P$.

      La sección (con las cotas de 5t entre caras, el ala mide 17t):
      $A = 37t^{2}$, G a $7{,}527t$ de la parte de abajo de las almas y a
      $3{,}473t$ de la cara de arriba, e $I_z = 446{,}06t^{4}$.

      Tensión normal (ec. 9.23, p. 12 del tema 9). Con la misma admisible a
      tracción y a compresión manda la fibra más alejada, la de abajo, que
      en D está comprimida:

      $$
      \frac{5\cdot10^{5}\cdot7{,}527t}{446{,}06t^{4}} \leq 1000
      \;\Rightarrow\;
      t \geq 2{,}0358\ \text{cm}
      $$

      Tensión tangencial (ec. 9.35, p. 16, con la tensión uniforme en el
      espesor, p. 19): la máxima, en el eje neutro, cortando las dos almas
      ($b = 2t$), con $Q = 56{,}656t^{3}$:

      $$
      \frac{2000\cdot56{,}656t^{3}}{446{,}06t^{4}\cdot2t} \leq 100
      \;\Rightarrow\;
      t \geq 1{,}1270\ \text{cm}
      $$

      En la unión de las almas con el ala la tangencial es algo menor,
      $113{,}3/t^{2}$ frente a $127{,}0/t^{2}$ en el eje neutro. **Manda la
      normal: $t$ = 2,036 cm.** Con ese $t$, la fibra de arriba de D trabaja
      a $1000\cdot3{,}473/7{,}527 \approx 461$ kg/cm² de tracción.

      **Comprobaciones.** El motor del curso da los momentos de apoyo por
      los tres momentos y, aparte, la viga entera por la elástica
      (compatibilidad de flechas, otro modelo): los dos casan con el sistema
      resuelto a mano en fracciones. La sección, el espesor y la tangencial
      salen del motor y de Steiner y las fórmulas, a mano.

  # ── Problema 2 · la barra quebrada ABC con el resorte en B y la fuerza
  #    oblicua en C. Impreso «2. (2.5p)»; sin el «(2.5p)» (lección 16).
  - id: exerm2526-2par-5-la-barra-quebrada-con-un-resorte-en-b
    titulo: La barra quebrada ABC empotrada en A, con un resorte en B y una fuerza oblicua en C
    fuente: >-
      Problema 2 · Segunda parte del 16 de enero de 2026 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa
      (UPV/EHU). Vale 2,5 puntos. Es la misma hoja que la parte 2 del examen
      final de ese día; el enunciado se transcribe sin su «(2.5p)», y cada
      hoja pone sus puntos. Transcrito de una foto de la hoja impresa. El
      examen no publica resolución; el desarrollo es nuestro, con los
      apuntes del tema 13, y cada cifra sale del motor del curso y de un
      segundo camino.
    nivel: examen
    enunciado: |
      Se tiene la viga ABC rígida y empotrada en A. En el punto B existe un
      resorte posicionado en la dirección X, con una K=3EI/2a³ . (E=2G y la
      sección en circular)

      a) Calcular la fuerza que le llega al resorte.

      b) Desplazamiento vertical del punto C.

