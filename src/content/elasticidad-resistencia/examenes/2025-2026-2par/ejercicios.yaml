      <figcaption>

      Redibujadas de la foto de la hoja: la sección de la viga y, a la
      derecha, el triángulo que acompaña a la ecuación de los tres momentos.

      </figcaption>
      </figure>

      **Notas nuestras.** La carga se lee $q_0$ = 200 kg/m: es una carga
      por unidad de longitud de viga, y el «Kg/m²» de la hoja no casa con
      ella. Las tres cotas de 5t de la sección van entre caras: del borde
      del ala a la primera alma, entre las dos almas y de la segunda alma al
      otro borde, como marcan sus líneas de referencia; el ala mide
      $5t + t + 5t + t + 5t = 17t$. La cota de 10t va de la cara de abajo
      del ala al final de las almas. La hoja da una sola $\sigma_{adm}$: se
      toma igual a tracción y a compresión.
    pide: >-
      Los diagramas de cortantes y de flectores en función de a y q0, y el
      espesor t de la sección con a = 10 m, q0 = 200 kg/m, σadm = 1000 kg/cm²
      y τadm = 100 kg/cm².
    pasos:
      - tipo: reconocer
        pregunta: |
          Para aplicar la ecuación de los tres momentos, ¿qué momentos de
          apoyo son incógnita y qué se hace con el tramo DE?
        opciones:
          - texto: >-
              Son incógnita $M_B$ y $M_C$; $M_A = 0$, y el voladizo DE se
              sustituye por su momento en D, que se conoce por equilibrio,
              $M_D = -qa\cdot a/4$. Se escribe la ecuación en B y en C
            correcta: true
            mensaje: |
              Eso es (apuntes del tema 11, fig. 11.6, p. 7). Un voladizo es
              isostático: su momento en el apoyo sale de sus cargas, y entra
              en la ecuación de C como dato. Dos ecuaciones, dos incógnitas.
          - texto: >-
              Son incógnita $M_B$, $M_C$ y $M_D$, con una ecuación en cada
              uno de los tres apoyos interiores
            mensaje: |
              En D no hace falta incógnita: a la derecha de D solo está el
              voladizo, y su momento en D lo da el equilibrio,
              $-qa\cdot a/4$. Además, en D no se puede escribir la ecuación,
              porque a su derecha no hay otro apoyo.
          - texto: >-
              Son incógnita $M_B$ y $M_C$, y el voladizo no entra porque
              está fuera de los apoyos
            mensaje: |
              Sí entra: su carga hace un momento en D que el tramo CD
              recibe. Con $M_D = 0$, los momentos de B y de C salen otros, y
              el mayor de la viga, que es justo el de D, se pierde.
      - tipo: calcular
        titulo: El momento en B
        pregunta: |
          ¿Cuánto vale el momento flector en el apoyo B, en $q_0a^{2}$
          (positivo si tracciona la fibra de abajo)?
        respuesta:
          tipo: numero
          valor: '-0.10311'
          tolerancia: 0.0003
          formato: un número, en q0·a²
        distractores:
          - valor: '-0.091751'
            mensaje: |
              Es el de la viga sin voladizo, con $M_D = 0$. El voladizo hace
              en D un momento de $-q_0a^{2}/4$ que entra en la ecuación de C
              y, a través de ella, cambia también $M_B$.
          - valor: '-0.11658'
            mensaje: |
              Has puesto $P$ a $a/3$ de B. La cota $a/3$ va de $P$ a C: $P$
              está a $2a/3$ de B, y el centro de gravedad de su triángulo, a
              $5a/9$ de B y a $4a/9$ de C.
          - valor: '0.10311'
            mensaje: |
              El valor es ese y el signo no. Con el convenio de la ecuación
              impresa, un momento de apoyo que tracciona arriba es negativo:
              sobre B la viga es continua y cuelga de los dos lados.
        pista: |
          Vano AB: $A_1 = q_0a^{3}/12$ con su centro a $a/2$. Vano BC: el
          triángulo de altura $P\cdot(2a/3)(a/3)/a$, con su centro a
          $(L + a)/3 = 5a/9$ de B y $(L + b)/3 = 4a/9$ de C. Escribe la
          ecuación en B y en C, con $M_A = 0$ y $M_D = -q_0a^{2}/4$.
        desarrollo: |
          Con $P = q_0a/2$, el triángulo del vano BC tiene
          $A_2 = \tfrac12\,a\cdot q_0a^{2}/9 = q_0a^{3}/18$. En B:

          $$
          4a\,M_B + a\,M_C = -6\left[\frac{q_0a^{3}}{24} + \frac{q_0a^{3}}{18}\cdot\frac{4}{9}\right] = -\frac{43}{108}\,q_0a^{3}
          $$

          En C, con $L_3 = a/2$ y $M_D = -q_0a^{2}/4$:

          $$
          a\,M_B + 3a\,M_C - \frac{q_0a^{3}}{8} = -6\cdot\frac{q_0a^{3}}{18}\cdot\frac{5}{9} = -\frac{5}{27}\,q_0a^{3}
          $$

          De las dos, $M_B = -\tfrac{245}{2376}\,q_0a^{2} \approx -0{,}10311\,q_0a^{2}$.
      - tipo: calcular
        titulo: El momento en C
        pregunta: |
          ¿Y en el apoyo C, en $q_0a^{2}$?
        respuesta:
          tipo: numero
          valor: '0.014310'
          tolerancia: 0.0002
          formato: un número, en q0·a²
        distractores:
          - valor: '-0.031145'
            mensaje: |
              Es el de la viga sin voladizo, con $M_D = 0$. El momento del
              voladizo en D, $-q_0a^{2}/4$, entra en la ecuación de C.
          - valor: '0.031145'
            mensaje: |
              Has puesto $P$ a $a/3$ de B: la cota $a/3$ se mide desde C.
          - valor: '-0.014310'
            mensaje: |
              El valor es ese y el signo no: en C el flector es positivo,
              aunque pequeño. El voladizo tira hacia abajo de D y levanta el
              tramo CD, y eso descarga C.
          - valor: '-0.076599'
            mensaje: |
              Has metido el momento del voladizo con el signo cambiado,
              $+q_0a^{2}/4$. Un voladizo con la carga hacia abajo tracciona
              arriba en el apoyo: $M_D = -q_0a\cdot a/4$.
        pista: |
          Del sistema del paso anterior: $M_B + 3M_C = -13q_0a^{2}/216$.
        desarrollo: |
          $$
          M_C = \frac{17}{1188}\,q_0a^{2} \approx 0{,}014310\,q_0a^{2}
          $$

          (con $M_B$ en la segunda ecuación:
          $-245/2376 + 3\cdot34/2376 = -143/2376 = -13/216$).
      - tipo: dibujar
        consigna: |
          En papel (apartado a): **los diagramas de cortantes y de
          flectores**, alineados bajo la viga, con los valores en los apoyos,
          bajo las cargas y en los máximos ($V$, la suma de las fuerzas hacia
          arriba a la izquierda; $M > 0$ si tracciona la fibra de abajo).
        comprueba:
          - punto: |
              **Reacciones**: $R_A = 943q_0a/2376 \approx 0{,}397q_0a$,
              $R_B \approx 0{,}887q_0a$, $R_C \approx -0{,}313q_0a$ (tira
              hacia abajo) y $R_D \approx 1{,}529q_0a$; suman $2{,}5q_0a$, las
              cargas.
            porque: |
              Cada vano es una viga biapoyada con sus cargas más los momentos
              de sus apoyos: su reacción es la isostática más
              $(M_{der} - M_{izq})/L$.
          - punto: |
              **Cortante**: recto de $0{,}397q_0a$ en A a $-0{,}603q_0a$ en B;
              $0{,}284q_0a$ hasta $P$ y $-0{,}216q_0a$ hasta C; $-0{,}529q_0a$
              de C a D; $q_0a$ de D a la fuerza $2P$, y cero hasta E.
            porque: |
              $dT/dx = -q$ (ec. 7.14, p. 12 del tema 7): baja con la
              repartida y salta en cada fuerza y cada reacción.
          - punto: |
              **Flector**: parábola en AB, con un máximo de
              $0{,}0788q_0a^{2}$ a $0{,}397a$ de A, y $-0{,}1031q_0a^{2}$ en B;
              rectas después: $0{,}0863q_0a^{2}$ bajo $P$, $0{,}0143q_0a^{2}$
              en C, $-q_0a^{2}/4$ en D y cero desde la fuerza $2P$ hasta E.
            porque: |
              $dM/dx = T$ (ec. 7.15): máximo donde se anula el cortante.
          - punto: |
              **El mayor en valor absoluto** es el de D, $q_0a^{2}/4$, y
              tracciona la fibra de arriba. El mayor cortante, $q_0a$, de D a
              la fuerza $2P$.
            porque: |
              Son los que mandan en el apartado b.
        figura: |
