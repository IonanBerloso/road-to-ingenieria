      **Notas nuestras.** «esta» va sin tilde en la hoja. Las barras se
      toman tangentes al disco en E y en D (perpendiculares al radio, en el
      plano del disco), como las dibuja la figura, y articuladas en sus dos
      extremos.
    pide: >-
      El diagrama de momentos torsores del eje ABC en función de M0.
    pasos:
      - tipo: reconocer
        pregunta: |
          El par $M_0$ entra por C. ¿Cómo se reparte en B entre el tramo AB
          del eje y las dos barras?
        opciones:
          - texto: >-
              No lo dice el equilibrio solo: el disco gira lo mismo que la
              sección B del eje, y ese giro tuerce AB y alarga las barras a
              la vez. Cada camino lleva una parte proporcional a su rigidez
              al giro
            correcta: true
            mensaje: |
              Eso es. El equilibrio del disco da una ecuación con dos
              incógnitas, el torsor de AB y el par de las barras; la segunda
              es la compatibilidad, un único giro $\varphi_B$ para el eje y
              para el disco. Son dos resortes de giro en paralelo.
          - texto: >-
              Todo el par va al empotramiento A por el eje, y las barras solo
              impiden que el disco se mueva de sitio
            mensaje: |
              Las barras no sujetan el centro del disco: están enganchadas en
              su borde, a $2a$ del eje, y se alargan en cuanto el disco gira.
              Con la fuerza que eso les da hacen un par sobre el disco, y ese
              par ya no llega a A.
          - texto: >-
              Mitad y mitad: hay dos apoyos, el empotramiento y las barras
            mensaje: |
              El reparto no va por número de apoyos sino por rigideces. Aquí
              son muy distintas: el eje es largo y fino, y las barras, con su
              brazo de $2a$, giran el disco mucho menos por cada unidad de
              par.
          - texto: >-
              Todo el par va a las barras, porque el disco es rígido
            mensaje: |
              Que el disco sea rígido quiere decir que no se deforma él, no
              que no gire. Gira lo que gira la sección B del eje, y ese giro
              tuerce AB, que también lleva su parte.
      - tipo: calcular
        titulo: El torsor del tramo AB
        pregunta: |
          ¿Qué parte de $M_0$ llega al empotramiento por el tramo AB? Da el
          torsor de AB en unidades de $M_0$.
        respuesta:
          tipo: numero
          valor: '0.012123'
          tolerancia: 0.00005
          formato: un número, en M0
        distractores:
          - valor: '1'
            mensaje: |
              Es el reparto sin barras: todo a A. Las barras se alargan en
              cuanto el disco gira y se quedan con casi todo el par, porque
              al giro son unas 80 veces más rígidas que AB.
          - valor: '0.023956'
            mensaje: |
              Has contado una sola barra. Las dos se alargan lo mismo con el
              giro del disco, y las dos hacen par en el mismo sentido: la
              rigidez del disco es $2\cdot EA\,(2a)^{2}/L$.
          - valor: '0.029766'
            mensaje: |
              Has usado $G$ en las barras. Una barra trabaja a axil y su
              rigidez es $EA/L$, con $E = 2{,}5G$; $G$ es la del eje, que
              trabaja a torsión.
          - valor: '0.0030586'
            mensaje: |
              Has tomado como brazo el diámetro del disco, $4a$. Las barras
              están en el borde, a un radio, $2a$, del eje: su alargamiento
              es $2a\,\varphi_B$ y su brazo, $2a$.
          - valor: '0.0060985'
            mensaje: |
              Has usado $I = \pi a^{4}/64$ en lugar del momento de inercia
              polar, $I_p = \pi a^{4}/32$ (p. 7 del tema 12): el eje sale la
              mitad de rígido.
        pista: |
          Rigidez al giro de AB: $GI_p/L_{AB}$, con $I_p = \pi a^{4}/32$. La
          de las barras: si el disco gira $\varphi$, cada una se alarga
          $2a\,\varphi$, lleva $EA\cdot2a\varphi/L$ y hace un par de esa
          fuerza por $2a$.
        desarrollo: |
          Con $I_p = \pi a^{4}/32$ y $E = 2{,}5G$:

          $$
          k_{AB} = \frac{GI_p}{L_{AB}} = \frac{\pi Ga^{3}}{1280},
          \qquad
          k_b = 2\,\frac{EA}{L}\,(2a)^{2} = 2\cdot\frac{2{,}5G\,a^{2}}{100a}\cdot4a^{2} = \frac{Ga^{3}}{5}
          $$

          El par se reparte en proporción a las rigideces:

          $$
          M_{AB} = M_0\,\frac{k_{AB}}{k_{AB} + k_b} = \frac{\pi}{\pi + 256}\,M_0 \approx 0{,}012123\,M_0
          $$
      - tipo: calcular
        titulo: La fuerza de cada barra
        pregunta: |
          ¿Qué fuerza lleva cada barra, en $M_0/a$?
        respuesta:
          tipo: numero
          valor: '0.24697'
          tolerancia: 0.0002
          formato: un número, en M0/a
        distractores:
          - valor: '0.49394'
            mensaje: |
              Es lo que llevaría una barra sola con todo el par de las barras.
              Son dos, cada una con su brazo de $2a$: el par es
              $2\cdot N\cdot2a$.
          - valor: '0.12462'
            mensaje: |
              Has tomado como brazo y como radio el diámetro, $4a$. Las barras
              están a $2a$ del eje.
        pista: |
          El par de las barras es $M_0 - M_{AB}$, y lo hacen dos fuerzas
          iguales con brazo $2a$.
        desarrollo: |
          $$
          M_b = M_0 - M_{AB} = \frac{256}{\pi + 256}\,M_0,
          \qquad
          N = \frac{M_b}{2\cdot2a} = \frac{64}{\pi + 256}\,\frac{M_0}{a} \approx 0{,}24697\,\frac{M_0}{a}
          $$
      - tipo: dibujar
        consigna: |
          En papel: **el diagrama de momentos torsores** a lo largo de A, B y
          C, con su valor en cada tramo en función de $M_0$.
        comprueba:
          - punto: |
              **De B a C**, constante, $M_0$: no hay nada entre B y C que
              cambie el par.
            porque: |
              El torsor en una sección es el par de lo que queda a un lado, y
              a la derecha de cualquier sección de BC solo está $M_0$.
          - punto: |
              **De A a B**, constante, $\pi M_0/(256 + \pi) \approx 0{,}0121M_0$,
              del mismo signo que en BC. El salto en B es el par de las
              barras, $256M_0/(256 + \pi)$.
            porque: |
              Las barras se quedan con casi todo: el eje, largo y fino, es
              muy flexible a torsión; las barras trabajan a axil, con
              $E = 2{,}5G$, y su brazo de $2a$ entra al cuadrado en la
              rigidez del disco.
          - punto: |
              **En A**, la reacción del empotramiento es
              $-\pi M_0/(256 + \pi)$, contraria a $M_0$.
            porque: |
              Con la reacción en A y el par de las barras en B, el eje está
              en equilibrio: $M_0 - 256M_0/(256 + \pi) - \pi M_0/(256 + \pi) = 0$.
        figura: |
          <svg viewBox="0 0 480 228" role="img" width="480" height="228" aria-labelledby="exerm2526-2par-1-el-eje-con-un-disco-y-dos-barras-dib-t exerm2526-2par-1-el-eje-con-un-disco-y-dos-barras-dib-d">
          <title id="exerm2526-2par-1-el-eje-con-un-disco-y-dos-barras-dib-t">El diagrama de momentos torsores del eje ABC</title>
          <desc id="exerm2526-2par-1-el-eje-con-un-disco-y-dos-barras-dib-d">Un diagrama escalonado a lo largo del eje, con líneas verticales en A, B y C. De A a B, un escalón bajo, πM0/(256 + π), unas 0,012 veces M0; de B a C, un escalón alto, M0. Los dos, del mismo signo. A escala en horizontal, no en vertical.</desc>
          <line x1="60" y1="150" x2="460" y2="150" stroke="var(--ink)" stroke-width="1.1"/>
          <line x1="60" y1="30" x2="60" y2="162" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
          <text x="60" y="180" font-size="13" fill="var(--ink)" font-weight="bold" text-anchor="middle">A</text>
          <line x1="364" y1="30" x2="364" y2="162" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
          <text x="364" y="180" font-size="13" fill="var(--ink)" font-weight="bold" text-anchor="middle">B</text>
          <line x1="440" y1="30" x2="440" y2="162" stroke="var(--faint)" stroke-width="0.7" stroke-dasharray="3 3"/>
          <text x="440" y="180" font-size="13" fill="var(--ink)" font-weight="bold" text-anchor="middle">C</text>
          <path d="M60 150 L60 140 L364 140 L364 55 L440 55 L440 150 Z" fill="var(--faint)" fill-opacity=".35" stroke="var(--live)" stroke-width="1.6"/>
          <text x="16" y="110" font-size="14" fill="var(--ink)" font-weight="bold"><tspan font-style="italic">M</tspan><tspan font-size="10" dy="4">t</tspan></text>
          <text x="212" y="132" font-size="12" fill="var(--ink)" text-anchor="middle">πM₀/(256 + π) ≈ 0,0121M₀</text>
          <text x="402" y="47" font-size="12" fill="var(--ink)" text-anchor="middle">M₀</text>
          <text x="12" y="202" font-size="10.5" fill="var(--faint)">A escala en horizontal; en vertical, no.</text>
          <text x="12" y="216" font-size="10.5" fill="var(--faint)">Positivo según la mano derecha sobre A→C.</text>
          </svg>
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              En BC el torsor es $M_0$, y en B el par se reparte entre AB y
              las barras.
          - texto: >-
              La sección B y el disco giran lo mismo, $\varphi_B$: AB se
              tuerce $\varphi_B$ y cada barra se alarga $2a\,\varphi_B$.
          - texto: >-
              AB lleva $k_{AB}\varphi_B$ y las barras $k_b\varphi_B$, con
              $k_{AB} = \pi Ga^{3}/1280$ y $k_b = Ga^{3}/5$; la suma es $M_0$.
          - texto: >-
              Torsor en AB, $\pi M_0/(256 + \pi)$; en BC, $M_0$; cada barra,
              $64M_0/((256 + \pi)a)$.
          - texto: >-
              Una barra se alarga y la otra se acorta, así que sus pares se
              anulan y AB se lleva todo $M_0$.
            trampa: true
            mensaje: |
              E está arriba y D abajo, y sus barras salen hacia lados
              contrarios: al girar el disco, E se mueve hacia un lado y D
              hacia el otro, y las dos barras se alargan (o se acortan) a la
              vez. Sus fuerzas forman un par que se opone al giro.
    resolucion: |
      **El planteamiento.** El eje es un solo empotramiento, pero en B hay
      un segundo camino para el par: el disco, rígido y solidario del eje,
      está sujeto por dos barras. El equilibrio del disco da una ecuación con
      dos incógnitas —el torsor de AB y el par de las barras— y la que falta
      es la compatibilidad: la sección B y el disco giran el mismo ángulo
      $\varphi_B$. Es hiperestático de grado uno.

      **El tramo BC.** A la derecha de cualquier sección de BC solo está
      $M_0$: el torsor de BC es $M_0$, y no depende de nada más.

      **La rigidez al giro de AB** (apuntes del tema 12, ecs. 12.13 y 12.14,
      p. 8). Con $I_p = \pi a^{4}/32$ (p. 7), el giro de B respecto de A con
      un torsor $M_{AB}$ es $M_{AB}L_{AB}/(GI_p)$, y

      $$
      k_{AB} = \frac{GI_p}{L_{AB}} = \frac{G\,\pi a^{4}/32}{40a} = \frac{\pi Ga^{3}}{1280}
      $$

      **La rigidez al giro de las barras** (tema 8, ecs. 8.9 y 8.12, pp. 7
      y 8). Cuando el disco gira $\varphi_B$, E y D se mueven $2a\,\varphi_B$
      según la tangente, que es la dirección de cada barra: cada una se
      alarga $2a\,\varphi_B$ y lleva

      $$
      N = \frac{EA}{L}\,2a\,\varphi_B = \frac{2{,}5G\,a^{2}}{100a}\,2a\,\varphi_B = 0{,}05\,Ga^{2}\varphi_B
      $$

      Las dos fuerzas son iguales y contrarias (E arriba y D abajo, con las
      barras hacia lados opuestos): un par puro, $2N\cdot2a$, que no carga
      el eje a flexión. Así

      $$
      k_b = \frac{2N\cdot2a}{\varphi_B} = 0{,}2\,Ga^{3} = \frac{Ga^{3}}{5}
      $$

      **El reparto.** Equilibrio del disco, $M_{AB} + M_b = M_0$, y
      compatibilidad, $M_{AB}/k_{AB} = M_b/k_b = \varphi_B$:

      $$
      M_{AB} = \frac{k_{AB}}{k_{AB} + k_b}\,M_0 = \frac{\pi/1280}{\pi/1280 + 1/5}\,M_0 = \frac{\pi}{\pi + 256}\,M_0 \approx 0{,}012123\,M_0
      $$

      $$
      M_b = \frac{256}{\pi + 256}\,M_0 \approx 0{,}98788\,M_0,
      \qquad
      N = \frac{M_b}{4a} = \frac{64}{\pi + 256}\,\frac{M_0}{a} \approx 0{,}24697\,\frac{M_0}{a}
      $$

      Las barras se llevan el 98,8 % del par. El giro de B es
      $\varphi_B = M_b/k_b = 1280M_0/((\pi + 256)Ga^{3}) \approx 4{,}939\,M_0/(Ga^{3})$.

      **El diagrama.** Constante a trozos y del mismo signo en los dos:
      $\pi M_0/(256 + \pi)$ de A a B y $M_0$ de B a C. En A, la reacción es
      $-\pi M_0/(256 + \pi)$. Con $M_0$ hacia fuera de C, como en la
      figura, el disco gira de forma que E y D se alejan de G y de F: las
      dos barras trabajan a tracción.

      **Comprobaciones.** El motor del curso da la rigidez de las barras
      (un sólido rígido articulado en su centro con las dos barras y un par
      unidad), la de AB (el eje empotrado con un par en B) y el eje entero
      con el par de las barras en B, cuyo giro casa con el de las barras; las
      fórmulas de arriba, a mano, dan lo mismo.

  # ── Teoría · cuestión 2 · la pieza rígida ABC con la barra CD calentada.
  #    Impresa «2. (1.25p)», con punto decimal. La misma hoja que la final.
  - id: exerm2526-2par-2-la-barra-cd-calentada
    titulo: La pieza rígida ABC articulada en A y la barra CD a 45° que cambia de temperatura
    fuente: >-
      Cuestión 2 de teoría · Segunda parte del 16 de enero de 2026 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1,25 puntos. Es la misma hoja que la parte 2
      del examen final de ese día. Transcrita de una foto de la hoja
      impresa. El examen no publica resolución; el desarrollo es nuestro,
      con los apuntes del tema 8, y cada cifra sale del motor del curso y de
      un segundo camino.
    nivel: examen
    enunciado: |
      (1.25p) Siendo ABC totalmente rígida y si el tramo CD tiene una
      rigidez de EA. Calcula el desplazamiento vertical y horizontal del
      punto C cuando a la barra CD se le aplique un cambio de temperatura de
      ΔT.

