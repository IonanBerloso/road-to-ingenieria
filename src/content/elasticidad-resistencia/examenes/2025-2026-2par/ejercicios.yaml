      <figcaption>

      Redibujada de la foto de la hoja. La hoja pone flechas de vector sobre
      P, i, j y k; la flecha de P es la de la hoja, y su dirección la dan
      sus componentes. La figura llama k a la K del texto. La hoja no
      rotula A, B ni C: se ponen donde los sitúa el texto (A, el
      empotramiento; B, la esquina del resorte; C, el extremo libre, donde
      llega P).

      </figcaption>
      </figure>

      **Notas nuestras.** $\vec{P} = 5\vec{\imath} - 12\vec{\jmath} + 4\vec{k}$,
      en kN, en los ejes de la figura: $x$ a la derecha, $y$ hacia arriba
      y $z$ hacia delante. AB es vertical (según $y$) y BC va según $z$; las
      dos miden $a$. «Rígida» se lee como que el nudo B es rígido (AB y BC
      forman una sola pieza): si la barra entera fuera indeformable, B no
      se movería y no habría nada que calcular.
    pide: >-
      La fuerza que lleva el resorte y el desplazamiento vertical de C.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Cuántas incógnitas hiperestáticas hay, y qué condición cierra el
          problema?
        opciones:
          - texto: >-
              Una, la fuerza $X$ del resorte. Se quita el resorte, se pone su
              fuerza y el desplazamiento de B según $x$ que da la coenergía
              tiene que ser el que deja el resorte, $-X/k$
            correcta: true
            mensaje: |
              Eso es (Menabrea con un resorte, ecs. 13.45 y 13.51, pp. 16 y
              19 del tema 13). El empotramiento da seis reacciones, que bastan
              para un árbol espacial; el resorte es una más.
          - texto: >-
              Una, la fuerza del resorte, con la condición de que B no se
              mueva en $x$
            mensaje: |
              Eso sería un apoyo rígido en B. El resorte se deja acortar
              $X/k$: con $u_B = 0$ se pierde su rigidez, que el enunciado da.
          - texto: >-
              Ninguna: la fuerza del resorte se saca con el equilibrio de
              momentos respecto de A
            mensaje: |
              El empotramiento ya da seis reacciones para las seis
              ecuaciones de equilibrio del espacio; el resorte es una
              incógnita de más, y su fuerza depende de lo que se mueva B.
      - tipo: calcular
        titulo: La fuerza del resorte (apartado a)
        pregunta: |
          ¿Qué fuerza lleva el resorte, en kN (positiva si lo comprime)?
        respuesta:
          tipo: numero
          valor: '1.6667'
          tolerancia: 0.002
          formato: un número, en kN
        distractores:
          - valor: '5'
            mensaje: |
              Es la de un apoyo rígido en B, con $u_B = 0$: entonces la
              fuerza anula entera la componente de 5 kN. El resorte cede, y
              se queda con menos.
          - valor: '2.5'
            mensaje: |
              Has usado $k = 3EI/a^{3}$, sin el 2 del denominador. Con
              $k = 3EI/(2a^{3})$ el resorte es la mitad de rígido que la
              barra AB en B, y lleva un tercio de los 5 kN.
          - valor: '1.3333'
            mensaje: |
              Has tomado la componente según $z$, 4 kN, como si fuera la de
              $x$. La que empuja B según la dirección del resorte es la de
              $x$, 5 kN: en AB da el flector $-5(a - y)$.
          - valor: '-1.6667'
            mensaje: |
              El valor es ese y el sentido no. La componente de 5 kN empuja B
              hacia $+x$, hacia la pared del resorte: el resorte se acorta y
              trabaja a compresión.
        pista: |
          Solo AB cuenta para el movimiento de B. Con la fuerza del resorte
          $X$ sobre B según $+x$, en AB el flector que mueve B según $x$ es
          $M = -(5 + X)(a - y)$; la fuerza unidad en B según $x$ da
          $m = -(a - y)$.
        desarrollo: |
          Con origen en A, $y$ a lo largo de AB:

          $$
          u_B = \int_0^{a}\frac{(5 + X)(a - y)^{2}}{EI}\,dy = \frac{(5 + X)\,a^{3}}{3EI}
          $$

          y el resorte impone $u_B = -X/k$ con $k = 3EI/(2a^{3})$:

          $$
          \frac{(5 + X)\,a^{3}}{3EI} = -\frac{2a^{3}}{3EI}\,X
          \;\Rightarrow\;
          X = -\frac{5}{3}\ \text{kN}
          $$

          El resorte empuja B hacia $-x$ con 5/3 kN: está comprimido 1,6667
          kN. B se mueve $10a^{3}/(9EI)$ hacia la pared.
      - tipo: calcular
        titulo: El desplazamiento vertical de C (apartado b)
        pregunta: |
          ¿Cuánto baja C, en $a^{3}/EI$ (con las fuerzas en kN; positivo
          hacia abajo)?
        respuesta:
          tipo: numero
          valor: '18'
          tolerancia: 0.02
          formato: un número, en a³/EI
        distractores:
          - valor: '14'
            mensaje: |
              Es lo que da AB solo; falta BC, que también se flecta con la
              componente vertical, y aporta $4a^{3}/EI$. Sale también 14 si
              BC se toma hacia $-z$, hacia atrás: en la figura va hacia
              delante, como el eje $z$.
          - valor: '4'
            mensaje: |
              Es lo que da BC solo, como un voladizo de longitud $a$ con
              12 kN. AB también se flecta, y es lo que más aporta.
          - valor: '16'
            mensaje: |
              Has usado solo la componente vertical, 12 kN. La de $z$, 4 kN,
              también flecta AB en el mismo plano, con $4(a - y)$, y aporta
              $2a^{3}/EI$.
          - valor: '-18'
            mensaje: |
              El valor es ese y el sentido no: con $-12$ kN en $y$, C baja.
        pista: |
          Fuerza unidad vertical en C. En AB da $m_x = -a$ y en BC,
          $m_x = -(a - z)$; los flectores de P sobre el mismo eje son
          $4(a - y) + 12a$ en AB y $12(a - z)$ en BC. Ni el resorte ni la
          torsión entran: compruébalo.
        desarrollo: |
          Con la fuerza unidad hacia arriba en C:

          $$
          v_C = \int_0^{a}\frac{\big(4(a - y) + 12a\big)(-a)}{EI}\,dy + \int_0^{a}\frac{12(a - z)\,\big(-(a - z)\big)}{EI}\,dz = -\frac{14a^{3}}{EI} - \frac{4a^{3}}{EI}
          $$

          $v_C = -18a^{3}/EI$ (con P en kN): C baja $18a^{3}/EI$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Se quita el resorte y se pone su fuerza $X$ en B: un árbol
              empotrado en A, con P en C y X en B.
          - texto: >-
              Solo AB se deforma para mover B: $u_B = (5 + X)a^{3}/(3EI)$, y
              con $u_B = -X/k$, $X = -5/3$ kN: el resorte, comprimido.
          - texto: >-
              Con la fuerza unidad vertical en C, AB y BC trabajan a flexión:
              $v_C = -14a^{3}/EI - 4a^{3}/EI$, y C baja $18a^{3}/EI$.
          - texto: >-
              Ni la fuerza del resorte ni la torsión de AB intervienen en el
              descenso de C: la fuerza unidad vertical no da flector en la
              dirección de $X$ ni torsor en ninguna barra.
          - texto: >-
              Con $E = 2G$ y sección circular, $GI_t = EI$, y la torsión de AB,
              $5a$, aporta su parte al descenso de C.
            trampa: true
            mensaje: |
              AB sí está torsionada ($M_t = 5a$, de la componente de 5 kN con
              el brazo $a$ de BC), pero la fuerza unidad vertical en C es
              paralela a AB y no le da torsor: $m_t = 0$, y el producto
              $M_t\,m_t$ es nulo. El dato $E = 2G$ no entra en ninguno de los
              dos apartados.
    resolucion: |
      **La geometría.** Con origen en A y los ejes de la figura: B =
      $(0, a, 0)$ y C = $(0, a, a)$; AB vertical y BC según $z$. P =
      $(5, -12, 4)$ kN en C. Sección circular con $E = 2G$:
      $GI_t = G\cdot2I = EI$.

      **La incógnita.** El empotramiento da seis reacciones, que bastan; el
      resorte es una más: hiperestático de grado uno. Se quita el resorte y
      se pone su fuerza $X$ sobre B según $+x$. Con Menabrea y un resorte
      (apuntes del tema 13, ecs. 13.45 y 13.51, pp. 16 y 19), el
      desplazamiento de B según $x$ es el que deja el resorte, $u_B = -X/k$.

      **Las leyes en AB** (sección a altura $y$; momentos de lo que hay
      por encima):

      $$
      \vec{M} = (0, a - y, a)\times(5, -12, 4) + (0, a - y, 0)\times(X, 0, 0) = \big(4(a - y) + 12a,\ 5a,\ -(5 + X)(a - y)\big)
      $$

      La componente $y$, $5a$, es el torsor de AB; las otras dos, flectores.
      En BC (sección a $z$ de B), $\vec{M} = (12(a - z),\ 5(a - z),\ 0)$: dos
      flectores y ningún torsor.

      **a) El resorte.** La fuerza unidad en B según $x$ solo carga AB, con
      el flector $m = -(a - y)$ sobre el eje $z$ (ec. 13.30, p. 12, y el
      método de la fuerza unitaria, apartado 13.6, pp. 17 y 18):

      $$
      u_B = \int_0^{a}\frac{(5 + X)(a - y)^{2}}{EI}\,dy = \frac{(5 + X)a^{3}}{3EI} = -\frac{X}{k} = -\frac{2a^{3}}{3EI}\,X
      $$

      $$
      X = -\frac{5}{3}\ \text{kN}
      $$

      El resorte empuja B hacia $-x$: **lleva 5/3 kN ≈ 1,667 kN de
      compresión**. B se mueve $u_B = 10a^{3}/(9EI)$ hacia la pared.

      **b) El descenso de C.** Fuerza unidad vertical en C, hacia arriba,
      sobre la estructura ya resuelta. En AB da $(-a, 0, 0)$: un flector
      constante sobre el eje $x$, sin torsor y sin nada sobre el eje $z$
      (por eso $X$ no entra). En BC, $(-(a - z), 0, 0)$:

      $$
      v_C = \int_0^{a}\frac{\big(4(a - y) + 12a\big)(-a)}{EI}\,dy + \int_0^{a}\frac{-12(a - z)^{2}}{EI}\,dz = -\frac{14a^{3}}{EI} - \frac{4a^{3}}{EI} = -\frac{18a^{3}}{EI}
      $$

      **C baja $18a^{3}/EI$** (con P en kN). La torsión de AB, $5a$, no
      entra: la fuerza unidad vertical es paralela a AB y no le da torsor.
      Tampoco el dato $E = 2G$, que solo haría falta para un desplazamiento
      de C según $x$.

      **Comprobaciones.** El motor del curso (la barra quebrada espacial,
      con Menabrea y un resorte, y el desplazamiento por la fuerza unidad)
      da $X = -5/3$ y $v_C = -18$, y lo mismo con otro $GI_t$ y sin resorte
      para el apartado b; las integrales, a mano, también.
