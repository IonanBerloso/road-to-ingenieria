ejercicios:
  # ── Teoría · cuestión 1 · el eje ABC con el disco y las barras DF y EG.
  #    Impresa «1. (1,25p)». La final del mismo día (2025-2026-ord) es la
  #    misma hoja: apunta a este ejercicio.
  - id: exerm2526-2par-1-el-eje-con-un-disco-y-dos-barras
    titulo: El eje ABC empotrado en A, con un disco rígido en B sujeto por dos barras, y un par en C
    fuente: >-
      Cuestión 1 de teoría · Segunda parte del 16 de enero de 2026 ·
      Elasticidad y Resistencia de Materiales, Escuela de Ingeniería de
      Gipuzkoa (UPV/EHU). Vale 1,25 puntos. Es la misma hoja que la parte 2
      del examen final de ese día. Transcrita de una foto de la hoja
      impresa. El examen no publica resolución; el desarrollo es nuestro,
      con los apuntes de los temas 12 y 8, y cada cifra sale del motor del
      curso y de un segundo camino.
    nivel: examen
    enunciado: |
      (1,25p) El sistema mecánico de la figura está formado por un eje
      **ABC** de diámetro $d_{ABC} = a$ empotrado en A al cual esta
      solidariamente unido en B un disco rígido de diámetro
      $d_{disco} = 4a$.

      En los puntos E y D del disco están enganchadas dos barras DF y EG, de
      sección $A = a^{2}$. En C se aplica un momento torsor $M_0$.

      Determinar:

      a) Diagrama de momentos en función de $M_0$.

      $L_{AB} = 40a$; $L_{BC} = 10a$; $L_{DF} = L_{EG} = 100a$; $E = 2.5G$

