asignatura: elasticidad-resistencia
curso: '2020-2021'
convocatoria: ordinaria
fecha: 15 de enero de 2021
# El examen final de enero de Elasticidad y Resistencia de Materiales de
# 2020-2021, fechado el 15/01/2021: cuatro páginas a dos columnas, en
# castellano y en euskera, de la Escuela de Ingeniería de Gipuzkoa, bajo un
# solo rótulo, ARIKETAK / EJERCICIOS. Cuatro preguntas de 1 punto y cuatro
# problemas de 1,5 puntos: diez puntos, y el cuadernillo los imprime todos.
# Ese curso no tiene 2.ª parte en el material.
#
# Se transcribe la columna en castellano, tal cual, con sus puntos
# impresos. Lo que hay que saber de ese texto, dicho antes de que nadie lo
# deduzca:
#
# 1. **DOS FECHAS.** La columna en castellano dice «Examen Final:
#    15/01/2021»; la de euskera, «Azterketa Finala: 2020/01/07», en las
#    cuatro páginas. Es la cabecera de otro año sin cambiar; vale la de
#    castellano.
#
# 2. **DOS NUMERACIONES.** Las preguntas de 1 punto van de «1.(1p)» a
#    «4. (1p)» y los problemas vuelven a empezar en «1. (1,5p)». Aquí las
#    preguntas son n 1 a 4 y los problemas, n 5 a 8; la `fuente` de cada
#    ejercicio dice el número impreso. El problema 1 empieza al pie de la
#    página 1 y sigue en la 2.
#
# 3. **DOS PREGUNTAS REPETIDAS.** La 3 («Teorema del flujo cortante.») y la
#    4 («Calcular la carga crítica de pandeo en una columna biarticulada.»)
#    vuelven palabra por palabra, con el mismo número y el mismo punto, en
#    la extraordinaria del 2 de febrero de 2022, que apunta a estos dos ids
#    (lección 16). Son también las cuestiones 9 del tema 9 y 2 del tema 14
#    de las hojas de autoevaluación, con otras palabras, y el sitio no tiene
#    esas cuestiones. No traen datos: sus pasos de cálculo usan ejemplos
#    nuestros, y lo dicen. Las otras seis no están en el sitio.
#
# 4. **LECTURAS DE LAS FIGURAS.** Cada una va también en la nota de su
#    enunciado.
#    - Problema 1: σx = 100, σy = −35 y τxy = −30 Kp/cm²; la flecha sin
#      rótulo de la cara de arriba es la recíproca de la de 30. e2 está en la
#      cara X, paralela a Z; e1, en la cara Z, a 20° de X hacia +Y.
#    - Problema 2: la perspectiva se redibuja en alzado, sin el jugador ni
#      la flecha sin rótulo junto al tubo. L1 = L − L0 = 3000 mm es la
#      proyección horizontal del tramo a 45°, y el de L0 es horizontal. F y M
#      actúan en el extremo del tubo; M, horario en el alzado, con el sentido
#      de su flecha. P baja lo mismo que ese extremo. R es el radio medio, el
#      de las fórmulas de I y A, y el diámetro de cálculo es 2R (el exterior,
#      2R + t, también se acepta).
#    - Problema 3: la carga q0 de DE, dibujada por debajo con las flechas
#      hacia la viga, se toma hacia arriba.
#    - Problema 4: M0 es horario; la cota de 8t del alma va entre las caras
#      interiores de las alas; cada fila lleva cuatro tornillos arriba y dos
#      abajo, que trabajan a cortadura en un plano. Con una sola separación
#      para toda la viga, manda la menor.
#
# 5. **ERRATAS Y RAREZAS DEL TEXTO, CONSERVADAS**: «rotulas» y «rotula» sin
#    tilde (problemas 3 y 4), «calcula» (problema 4 d), el espacio antes del
#    punto en «σz .» y «e1» sin subíndice en el apartado b del problema 1. La
#    columna en euskera escribe «ττadm» en el problema 4; la de castellano,
#    que es la que se transcribe, «τadm». En el problema 2, «F=2000N y
#    M=10⁶Nmm» va resaltado en amarillo.
#
# El examen no publica resolución: los desarrollos son nuestros, y cada
# cifra sale del motor del curso (src/lib/erm) y de un segundo camino
# (fase-p/p9c, guiones/cifras.mjs). El motor no deduce teoremas: las
# deducciones de las preguntas 1, 3 y 4 siguen los apuntes, y sus ejemplos
# numéricos se comprueban con el motor.
pdf: 2020-2021-ord.pdf
puntosImpresos:
  fuente: >-
    Impresos junto a cada pregunta: «1.(1p)», «2.(1p)», «3. (1p)» y
    «4. (1p)», pág. 1; «1. (1,5p)», «2. (1,5p)», «3. (1,5p)» y «4. (1,5p)»
    en los problemas, págs. 1 a 4. Ningún problema reparte su punto y medio
    entre sus apartados.
  reparto:
    - { n: 1, puntos: 1 }
    - { n: 2, puntos: 1 }
    - { n: 3, puntos: 1 }
    - { n: 4, puntos: 1 }
    - { n: 5, puntos: 1.5 }
    - { n: 6, puntos: 1.5 }
    - { n: 7, puntos: 1.5 }
    - { n: 8, puntos: 1.5 }

