  # ── Cuestión 1 · los dos triángulos a torsión, uno cerrado y otro abierto.
  - id: exerm2021-ord-1-dos-triangulos-a-torsion
    titulo: Dos triángulos de pared delgada a torsión, de espesor e y de espesor t, uno de ellos con una ranura
    fuente: >-
      Cuestión 1 · Examen final del 15 de enero de 2021 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1 punto. Es la primera de las cuatro preguntas de 1 punto, que el
      examen numera aparte de los cuatro problemas. El examen no publica
      resolución; el desarrollo es nuestro, con los apuntes del tema 12.
    nivel: examen
    enunciado: |
      (1p) Calcular la relación entre espesores para obtener la misma tensión
      máxima en el caso de aplicar un momento torsor $M_t$ en las dos secciones
      de la figura. Deducir las expresiones de la tensión máxima en ambos
      casos.

