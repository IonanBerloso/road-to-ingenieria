      - tipo: calcular
        titulo: El centro de gravedad
        pregunta: |
          ¿A qué distancia de la cara de arriba de la platabanda superior está
          el centro de gravedad, en unidades de $t$?
        respuesta:
          tipo: numero
          valor: '4.75'
          tolerancia: 0.005
          formato: un número, en t
        distractores:
          - valor: '6'
            mensaje: |
              Es la mitad del canto, 12t. La sección no es simétrica: las
              piezas de arriba miden 8t y las de abajo 4t, y el centro de
              gravedad sube.
          - valor: '4.1'
            mensaje: |
              Es el de la sección sin platabandas, medido desde la cara de
              arriba del ala. Las platabandas forman parte de la sección: van
              atornilladas y trabajan con ella.
        pista: |
          Cinco rectángulos: dos de $8t\times t$, el alma de $t\times8t$ y dos
          de $4t\times t$. $\overline{y} = \sum A_i y_i/\sum A_i$.
        desarrollo: |
          $A = (8 + 8 + 8 + 4 + 4)\,t^{2} = 32t^{2}$ y
          $\sum A_iy_i = (8\cdot0{,}5 + 8\cdot1{,}5 + 8\cdot6 + 4\cdot10{,}5 + 4\cdot11{,}5)\,t^{3} = 152t^{3}$:
          $\overline{y} = 152/32 = 4{,}75$ (en $t$), desde la cara de arriba.
          La fibra de abajo está a $12 - 4{,}75 = 7{,}25$ (en $t$).
      - tipo: calcular
        titulo: El momento de inercia
        pregunta: |
          ¿Cuánto vale $I_z$, respecto del eje que pasa por el centro de
          gravedad, en $t^{4}$?
        respuesta:
          tipo: numero
          valor: '600.67'
          tolerancia: 0.05
          formato: un número, en t⁴
        distractores:
          - valor: '556'
            mensaje: |
              Te faltan los momentos propios, $bh^{3}/12$, de cada pieza: el
              del alma, $8^{3}/12 = 42{,}67$, no es despreciable.
          - valor: '650.67'
            mensaje: |
              Es el momento respecto de la mitad del canto. Steiner se aplica
              con las distancias al centro de gravedad, a $4{,}75t$ de la cara
              de arriba.
          - valor: '270.47'
            mensaje: |
              Es el de la sección sin platabandas. Van atornilladas y trabajan
              con ella: cuentan, y mucho, porque están lejos del eje.
        pista: |
          Steiner (tema 9): $I_z = \sum\left(\tfrac{1}{12}b_ih_i^{3} + A_i\,d_i^{2}\right)$,
          con $d_i$ la distancia del centro de cada pieza al de la sección.
        desarrollo: |
          Momentos propios: $2\cdot\tfrac{8}{12} + \tfrac{8^{3}}{12} + 2\cdot\tfrac{4}{12} = 44{,}667$.
          Steiner: $8\cdot4{,}25^{2} + 8\cdot3{,}25^{2} + 8\cdot1{,}25^{2} + 4\cdot5{,}75^{2} + 4\cdot6{,}75^{2} = 556$.
          $I_z = 600{,}67$ (en $t^{4}$), es decir, $\tfrac{1802}{3}t^{4}$.
      - tipo: calcular
        titulo: La máxima tracción
        pregunta: |
          ¿Cuánto vale la tensión normal máxima de tracción, en unidades de
          $10^{-3}q_0a^{2}/t^{3}$?
        respuesta:
          tipo: numero
          valor: '7.908'
          tolerancia: 0.005
          formato: un número, en 10⁻³·q0a²/t³
        distractores:
          - valor: '6.035'
            mensaje: |
              Es la de la fibra de abajo en A, con el flector positivo
              $\tfrac{1}{2}q_0a^{2}$. En CD el flector es doble y negativo:
              tracciona la fibra de arriba, que está más cerca del eje, pero
              gana.
          - valor: '12.07'
            mensaje: |
              Es la de la fibra de abajo en CD, y allí el flector negativo
              comprime. Con $M < 0$ la tracción está arriba, a $4{,}75t$ del
              eje.
          - valor: '15.16'
            mensaje: |
              Es la de la sección sin platabandas. Cuentan: van atornilladas.
        pista: |
          $\sigma_x = M_z\,y/I_z$ (ec. 9.23, y hacia abajo desde el centro de
          gravedad). Mira las dos zonas de flector máximo: A, con $+\tfrac{1}{2}q_0a^{2}$,
          y CD, con $-q_0a^{2}$; en cada una, la fibra traccionada.
        desarrollo: |
          En CD, $M = -q_0a^{2}$, y la fibra de arriba está en $y = -4{,}75t$:
          $\sigma = 4{,}75/600{,}67 = 7{,}908\cdot10^{-3}$ (en $q_0a^{2}/t^{3}$).
          En A, la fibra de abajo:
          $0{,}5\cdot7{,}25/600{,}67 = 6{,}035\cdot10^{-3}$, menor. La máxima
          tracción está en la cara de arriba de la platabanda superior, en
          todo el tramo CD.
      - tipo: calcular
        titulo: La máxima compresión
        pregunta: |
          ¿Y la máxima de compresión, con su signo, en
          $10^{-3}q_0a^{2}/t^{3}$?
        respuesta:
          tipo: numero
          valor: '-12.07'
          tolerancia: 0.01
          formato: un número con su signo, en 10⁻³·q0a²/t³
        distractores:
          - valor: '-3.954'
            mensaje: |
              Es la de la fibra de arriba en A. En CD el flector es el doble y
              la fibra de abajo está más lejos del eje.
          - valor: '-7.908'
            mensaje: |
              Has tomado la fibra de arriba, que en CD tracciona. La
              compresión está abajo, a $7{,}25t$ del eje.
          - valor: '-21.81'
            mensaje: |
              Es la de la sección sin platabandas. Van atornilladas y cuentan.
        pista: |
          En CD, la fibra de abajo, a $7{,}25t$ del centro de gravedad.
        desarrollo: |
          $\sigma = -7{,}25/600{,}67 = -12{,}07\cdot10^{-3}$ (en
          $q_0a^{2}/t^{3}$), en la cara de abajo de la platabanda inferior, en
          todo CD.
      - tipo: calcular
        titulo: El flujo bajo la platabanda de arriba
        pregunta: |
          ¿Cuánto vale el flujo cortante máximo entre la platabanda de arriba y
          la sección, en $10^{-3}q_0a/t$?
        respuesta:
          tipo: numero
          valor: '84.91'
          tolerancia: 0.05
          formato: un número, en 10⁻³·q0a/t
        distractores:
          - valor: '28.30'
            mensaje: |
              Has usado $|V| = \tfrac{1}{2}q_0a$, el de AB. El máximo,
              $\tfrac{3}{2}q_0a$, está justo a la izquierda de C.
          - valor: '149.83'
            mensaje: |
              Has tomado como $A_c$ la platabanda y el ala. Lo que se separa
              por la unión atornillada es solo la platabanda: el corte va entre
              ella y el ala.
          - valor: '9.99'
            mensaje: |
              Has medido la distancia del centro de la platabanda a la cara de
              arriba. En $Q_z^{c}$ va la distancia al centro de gravedad de la
              sección: $4{,}75 - 0{,}5 = 4{,}25$ (en $t$).
        pista: |
          $q_c = T_y\,Q_z^{c}/I_z$ (ec. 9.35), con $A_c$ la platabanda y
          $|T_y| = \tfrac{3}{2}q_0a$.
        desarrollo: |
          $Q_z^{c} = 8t^{2}\cdot4{,}25t = 34t^{3}$ y

          $$
          q_c = \frac{1{,}5\cdot34}{600{,}67} = 84{,}91\cdot10^{-3}
          $$

          en $q_0a/t$.
      - tipo: calcular
        titulo: El flujo sobre la platabanda de abajo
        pregunta: |
          ¿Y entre la platabanda de abajo y la sección, en $10^{-3}q_0a/t$?
        respuesta:
          tipo: numero
          valor: '67.43'
          tolerancia: 0.05
          formato: un número, en 10⁻³·q0a/t
        distractores:
          - valor: '22.48'
            mensaje: |
              Has usado $|V| = \tfrac{1}{2}q_0a$. El máximo es
              $\tfrac{3}{2}q_0a$, a la izquierda de C.
          - valor: '124.86'
            mensaje: |
              Has tomado la platabanda y el ala. El corte de la unión va entre
              las dos: $A_c$ es solo la platabanda.
        pista: |
          Lo mismo, con la platabanda de abajo: $4t^{2}$ a
          $11{,}5 - 4{,}75 = 6{,}75$ (en $t$) del centro de gravedad.
        desarrollo: |
          $Q_z^{c} = 4t^{2}\cdot6{,}75t = 27t^{3}$ y
          $q_c = 1{,}5\cdot27/600{,}67 = 67{,}43\cdot10^{-3}$, en $q_0a/t$.
          Es menor que el de arriba, pero abajo hay la mitad de tornillos.
      - tipo: calcular
        titulo: La separación de los tornillos
        pregunta: |
          ¿Qué separación $e$ entre filas de tornillos sirve para toda la
          viga, en unidades de $\tau_{adm}d_0^{2}t/(q_0a)$?
        respuesta:
          tipo: numero
          valor: '23.30'
          tolerancia: 0.02
          formato: un número, en τadm·d0²·t/(q0a)
        distractores:
          - valor: '37.00'
            mensaje: |
              Es la de la platabanda de arriba, con sus cuatro tornillos por
              fila. Abajo hay dos y el flujo es poco menor: allí la separación
              tiene que ser más corta, y es la que manda.
          - valor: '11.65'
            mensaje: |
              Has contado un tornillo por fila abajo. Hay dos, uno a cada lado
              del alma: la fuerza que aguanta la fila es el doble.
          - valor: '93.19'
            mensaje: |
              Te falta el cuarto del área del tornillo:
              $S = \tau_{adm}\pi d_0^{2}/4$ (ec. 9.40).
          - valor: '46.59'
            mensaje: |
              Has contado cuatro tornillos por fila abajo, como arriba. Abajo
              hay dos.
        pista: |
          En una longitud $e$, la fila de $n$ tornillos aguanta lo que pasa
          por la unión: $n\,S = q_c\,e$, con $S = \tau_{adm}\pi d_0^{2}/4$
          (ecs. 9.39 y 9.40). Calcula $e$ arriba y abajo.
        desarrollo: |
          Arriba, $n = 4$:
          $e = \dfrac{4\cdot\pi/4}{0{,}08491} = 37{,}00$. Abajo, $n = 2$:
          $e = \dfrac{2\cdot\pi/4}{0{,}06743} = 23{,}30$ (las dos en
          $\tau_{adm}d_0^{2}t/(q_0a)$). Con una sola separación para toda la
          viga, manda la menor: $e = 23{,}30\,\tau_{adm}d_0^{2}t/(q_0a)$.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Momentos de BCD en B: $R_C = \tfrac{3}{2}q_0a$; la rótula
              transmite $\tfrac{1}{2}q_0a$ y en A el flector es
              $+\tfrac{1}{2}q_0a^{2}$.
          - texto: >-
              $|M|_{\max} = q_0a^{2}$ en CD, negativo, y
              $|V|_{\max} = \tfrac{3}{2}q_0a$ a la izquierda de C.
          - texto: >-
              Centro de gravedad a $4{,}75t$ de la cara de arriba;
              $I_z = 600{,}67t^{4}$.
          - texto: >-
              En CD, tracción arriba ($7{,}908$) y compresión abajo
              ($-12{,}07$), en $10^{-3}q_0a^{2}/t^{3}$.
          - texto: >-
              Flujos de $84{,}91$ y $67{,}43$, en $10^{-3}q_0a/t$, y $e = 23{,}30$,
              la de abajo, con dos tornillos por fila.
          - texto: >-
              La máxima tracción está en A, donde el flector es positivo, en
              la fibra de abajo.
            trampa: true
            mensaje: |
              En A la fibra de abajo da $6{,}035\cdot10^{-3}$. En CD el
              flector es el doble y negativo: tracciona la fibra de arriba,
              más cerca del eje, pero con el doble de momento gana:
              $7{,}908\cdot10^{-3}$.
    resolucion: |
      **a) La estática y los diagramas.** Momentos de BCD respecto de la
      rótula, antihorario positivo:
      $R_C\,a - q_0a\cdot\tfrac{a}{2} - q_0a^{2} = 0$, y
      $R_C = \tfrac{3}{2}q_0a$ hacia arriba. En vertical, la rótula tira de
      BCD hacia abajo con $\tfrac{1}{2}q_0a$ y empuja AB hacia arriba con lo
      mismo; en A, $\tfrac{1}{2}q_0a$ hacia abajo y un par de
      $\tfrac{1}{2}q_0a^{2}$ (horario).

      Con el convenio del tema 7 (V, la suma de las fuerzas hacia arriba a la
      izquierda; M > 0 si tracciona abajo; $dT/dx = -q$ y $dM/dx = T$, ecs.
      7.14 y 7.15, p. 12, con $T$ el cortante):

      - V: $-\tfrac{1}{2}q_0a$ en AB; de $-\tfrac{1}{2}q_0a$ a
        $-\tfrac{3}{2}q_0a$ en BC; cero en CD.
      - M: de $+\tfrac{1}{2}q_0a^{2}$ en A a cero en B, en recta;
        $M = -\tfrac{1}{2}q_0a\,(x - a) - \tfrac{1}{2}q_0(x - a)^{2}$ en BC,
        hasta $-q_0a^{2}$ en C; $-q_0a^{2}$ constante en CD.

      Los dos diagramas, a escala, son los del paso de dibujar.

      **La sección.** Cinco rectángulos de espesor $t$, desde arriba:
      platabanda $8t$, ala $8t$, alma de $8t$ de alto, ala $4t$ y platabanda
      $4t$; $A = 32t^{2}$. El centro de gravedad, a
      $\overline{y} = 152/32 = 4{,}75$ (en $t$) de la cara de arriba, y por
      Steiner $I_z = 44{,}667 + 556 = 600{,}67$ (en $t^{4}$).

      **b) Las tensiones normales máximas.** $\sigma_x = M_z\,y/I_z$ (ec.
      9.23, p. 12 del tema 9), con $y$ hacia abajo desde el centro de
      gravedad. Hay dos candidatos: CD, con $M = -q_0a^{2}$, y A, con
      $M = +\tfrac{1}{2}q_0a^{2}$. En $10^{-3}q_0a^{2}/t^{3}$:

      - CD, fibra de arriba ($y = -4{,}75t$): $+7{,}908$; fibra de abajo
        ($y = 7{,}25t$): $-12{,}07$.
      - A, fibra de abajo: $+6{,}035$; fibra de arriba: $-3{,}954$.

      La **máxima tracción**, $7{,}908\cdot10^{-3}q_0a^{2}/t^{3}$, está en la
      cara de arriba de la platabanda superior, en todo el tramo CD (C
      incluido); la **máxima compresión**,
      $-12{,}07\cdot10^{-3}q_0a^{2}/t^{3}$, en la cara de abajo de la
      platabanda inferior, en el mismo tramo.

      **c) Los flujos.** $q_c = T_y\,Q_z^{c}/I_z$ (ec. 9.35, p. 16), con $A_c$
      cada platabanda y el cortante máximo, $\tfrac{3}{2}q_0a$, a la
      izquierda de C. Arriba, $Q_z^{c} = 8\cdot4{,}25 = 34$ (en $t^{3}$), y
      abajo, $Q_z^{c} = 4\cdot6{,}75 = 27$ (en $t^{3}$):

      $$
      q_{arriba} = \frac{1{,}5\cdot34}{600{,}67} = 0{,}08491,\qquad q_{abajo} = \frac{1{,}5\cdot27}{600{,}67} = 0{,}06743
      $$

      en $q_0a/t$.

      **d) La separación.** En una longitud $e$, la fila de tornillos aguanta
      lo que pasa por la unión: $n\,S = q_c\,e$, con
      $S = \tau_{adm}\pi d_0^{2}/4$ (ecs. 9.39 y 9.40, p. 22). Arriba
      $n = 4$, y $e = 37{,}00$; abajo $n = 2$, y $e = 23{,}30$, en
      $\tau_{adm}d_0^{2}t/(q_0a)$. Con una sola separación, manda la de abajo:

      $$
      e = 23{,}30\,\frac{\tau_{adm}\,d_0^{2}\,t}{q_0a}
      $$

      **Comprobaciones.** El motor del curso da las mismas reacciones, los
      mismos diagramas, el centro de gravedad y la inercia de la sección, las
      tensiones extremas en sus vértices y los dos flujos a través de los
      cortes de las uniones.
