      **Notas nuestras.** Los dos triángulos son equiláteros, y las cotas $a$
      van a los vértices de la línea media, la de trazos. Cada sección tiene
      un espesor uniforme: $e$ la de la izquierda y $t$ la de la derecha.
    pide: >-
      La tensión tangencial máxima de cada sección con el mismo Mt, deducida,
      y la relación entre e y t que las hace iguales.
    pasos:
      - tipo: reconocer
        pregunta: |
          Las dos secciones tienen la misma forma y casi el mismo material.
          ¿Qué las hace distintas a torsión?
        opciones:
          - texto: >-
              La ranura. La cerrada lleva un flujo uniforme alrededor del
              hueco, y su tensión depende del área encerrada; la abierta
              trabaja como un rectángulo largo y estrecho, de longitud $3a$, y
              su tensión depende de $t^{2}$
            correcta: true
            mensaje: |
              Eso es. En la cerrada, $\tau = M_t/(2A_te)$ (ec. 12.24, p. 12),
              con $A_t$ el área que encierra la línea media. En la abierta, por
              la analogía de Prandtl, $\tau_{\max} = M_tt/I_t$ (ec. 12.17,
              p. 10), con $I_t = \tfrac{1}{3}\sum t_i^{3}s_i$. Con los mismos
              números, la cerrada aguanta muchísimo más.
          - texto: >-
              Nada que importe: la ranura es muy estrecha y casi no quita
              material, así que con $e = t$ las dos tienen la misma tensión
            mensaje: |
              La ranura quita poco material, pero corta el camino del flujo.
              En la cerrada el flujo da la vuelta entera y el par lo hace el
              área encerrada; en la abierta el flujo tiene que volver por el
              mismo espesor, y el brazo es del orden de $t$.
          - texto: >-
              Las dos son de pared delgada y se calculan las dos con
              $\tau = M_t/(2A_te)$, cada una con su espesor
            mensaje: |
              Esa fórmula (ec. 12.24) es la de una sección cerrada: sale de que
              el flujo da la vuelta entera al hueco. En la abierta no puede: en
              los dos bordes de la ranura la tensión tangencial a la línea
              media tiene que ser nula.
      - tipo: calcular
        titulo: La tensión de la sección cerrada
        pregunta: |
          ¿Cuánto vale la tensión máxima de la sección cerrada, en unidades de
          $M_t/(a^{2}e)$?
        respuesta:
          tipo: numero
          valor: '1.1547'
          tolerancia: 0.002
          formato: un número, en Mt/(a²e)
        distractores:
          - valor: '2.3094'
            mensaje: |
              Te falta el 2 de $\tau = M_t/(2A_te)$ (ec. 12.24). El par del
              flujo es $q\oint r\,ds$, y $\oint r\,ds$ es el doble del área
              encerrada.
          - valor: '0.5774'
            mensaje: |
              Has tomado como área del triángulo base por altura, sin el
              $\tfrac{1}{2}$. La de un equilátero de lado $a$ es
              $A_t = \tfrac{\sqrt{3}}{4}a^{2}$.
        pista: |
          $\tau = \dfrac{M_t}{2A_te}$ (ec. 12.24), con $A_t$ el área que
          encierra la línea media: un triángulo equilátero de lado $a$.
        desarrollo: |
          $A_t = \tfrac{\sqrt{3}}{4}a^{2} = 0{,}4330\,a^{2}$, y

          $$
          \tau_{cerrada} = \frac{M_t}{2\cdot0{,}4330\,a^{2}e} = \frac{2}{\sqrt{3}}\,\frac{M_t}{a^{2}e} = 1{,}1547\,\frac{M_t}{a^{2}e}
          $$

          Es la misma en toda la pared, porque el espesor es uniforme.
      - tipo: calcular
        titulo: La tensión de la sección abierta
        pregunta: |
          ¿Y la tensión máxima de la sección abierta, en unidades de
          $M_t/(at^{2})$?
        respuesta:
          tipo: numero
          valor: '1'
          tolerancia: 0.002
          formato: un número, en Mt/(at²)
        distractores:
          - valor: '0.3333'
            mensaje: |
              Has tomado $I_t = \sum t_i^{3}s_i$ sin el $\tfrac{1}{3}$. Los
              apuntes la imprimen así (ecs. 12.19 y 12.20, pp. 10-11), y es
              una errata: el propio texto dice que $\beta = \tfrac{1}{3}$ con
              espesor uniforme (p. 10), y $I_t = \tfrac{1}{3}\sum t_i^{3}s_i$.
          - valor: '3'
            mensaje: |
              Has tomado un solo lado, $s = a$. La línea media de la abierta
              da la vuelta entera, de un borde de la ranura al otro: mide
              $3a$.
        pista: |
          $\tau_{\max} = \dfrac{M_tt}{I_t}$ (ec. 12.17), con
          $I_t = \tfrac{1}{3}\sum t_i^{3}s_i$ a lo largo de la línea media.
        desarrollo: |
          $I_t = \tfrac{1}{3}\cdot3a\cdot t^{3} = at^{3}$, y

          $$
          \tau_{abierta} = \frac{M_t\,t}{at^{3}} = \frac{M_t}{at^{2}}
          $$
      - tipo: calcular
        titulo: La relación entre los espesores
        pregunta: |
          ¿Qué espesor $e$ de la cerrada da la misma tensión máxima que la
          abierta de espesor $t$, en unidades de $t^{2}/a$?
        respuesta:
          tipo: numero
          valor: '1.1547'
          tolerancia: 0.002
          formato: un número, e en t²/a
        distractores:
          - valor: '3.4641'
            mensaje: |
              Es el triple: sale con la $I_t$ de la abierta sin el
              $\tfrac{1}{3}$, la errata de las ecs. 12.19 y 12.20. Con la
              $I_t$ el triple, la tensión de la abierta sale la tercera parte,
              y la cerrada parece necesitar más espesor.
          - valor: '2.3094'
            mensaje: |
              Te falta el 2 de la fórmula de la cerrada, $M_t/(2A_te)$.
          - valor: '0.3849'
            mensaje: |
              Has tomado un solo lado en la abierta. Su línea media mide
              $3a$.
        pista: |
          Iguala las dos tensiones y despeja $e$.
        desarrollo: |
          $$
          \frac{2}{\sqrt{3}}\,\frac{M_t}{a^{2}e} = \frac{M_t}{at^{2}}
          \quad\Longrightarrow\quad
          e = \frac{2}{\sqrt{3}}\,\frac{t^{2}}{a} = 1{,}1547\,\frac{t^{2}}{a}
          $$

          Como $t$ es mucho menor que $a$, $e$ es mucho menor que $t$: con
          $a = 20t$, $e = 0{,}0577\,t$.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la respuesta completa, como en el examen, la deducción de la
          tensión máxima de cada sección y la relación entre los espesores.
        rubrica:
          - punto: >-
              En la cerrada, el equilibrio según x de un trozo de pared da que
              el flujo q = τt es el mismo en toda la línea media (ec. 12.21).
            porque: >-
              Es el paso que convierte una distribución desconocida en una
              sola incógnita, el flujo.
            minimo: true
          - punto: >-
              El par del flujo es Mt = q∮r ds = 2Atq (ecs. 12.22 a 12.24), y
              τ = Mt/(2Ate), con At = (√3/4)a² el área que encierra la línea
              media.
            porque: >-
              Es la expresión que pide la pregunta para la cerrada, y el área
              es la de la línea media, no la exterior ni la del hueco.
            minimo: true
          - punto: >-
              En la abierta, por la analogía de Prandtl, la sección trabaja
              como un rectángulo de longitud igual a la de la línea media, 3a,
              y τmax = Mt t/It con It = (1/3)·3a·t³ = at³ (ecs. 12.17 y 12.19).
            porque: >-
              Es la expresión de la abierta, y el ⅓ que los apuntes no imprimen
              en las ecs. 12.19 y 12.20 cambia el resultado al triple.
            minimo: true
          - punto: >-
              Igualando, e = (2/√3)·t²/a, y se comenta que con t mucho menor
              que a la cerrada necesita un espesor mucho menor.
            porque: >-
              Es la relación que pide la primera frase del enunciado, y el
              comentario dice por qué las secciones cerradas son las buenas a
              torsión.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Cerrada: el flujo es uniforme y su par es $2A_tq$, así que
              $\tau = M_t/(2A_te)$, con $A_t = \tfrac{\sqrt{3}}{4}a^{2}$.
          - texto: >-
              Abierta: un rectángulo de longitud $3a$ y espesor $t$, con
              $\tau_{\max} = M_tt/I_t$.
          - texto: >-
              $I_t = \tfrac{1}{3}\cdot3a\cdot t^{3} = at^{3}$, y
              $\tau_{abierta} = M_t/(at^{2})$.
          - texto: >-
              Igualando las dos, $e = \tfrac{2}{\sqrt{3}}\,t^{2}/a$.
          - texto: >-
              En la abierta, $I_t = \sum t_i^{3}s_i = 3at^{3}$, como imprimen
              los apuntes.
            trampa: true
            mensaje: |
              Es la errata de las ecs. 12.19 y 12.20. El texto de la p. 10
              dice que con espesor uniforme $\beta = \tfrac{1}{3}$:
              $I_t = \tfrac{1}{3}\sum t_i^{3}s_i = at^{3}$. Sin el
              $\tfrac{1}{3}$, $e$ sale el triple.
    resolucion: |
      **La sección cerrada.** El equilibrio según x de un trozo de pared, de
      longitud $dx$, entre dos puntos A y B de la línea media da
      $\tau_At_A = \tau_Bt_B$ (ec. 12.21, p. 11): el flujo $q = \tau t$ es el
      mismo en toda la sección. Su par respecto de cualquier punto es
      $M_t = q\oint r\,ds = 2A_tq$ (ecs. 12.22 y 12.23, pp. 11-12), con $A_t$
      el área que encierra la línea media, y de ahí la ec. 12.24 (p. 12):

      $$
      \tau = \frac{M_t}{2A_te}
      $$

      Con el triángulo equilátero de lado $a$,
      $A_t = \tfrac{\sqrt{3}}{4}a^{2} = 0{,}4330\,a^{2}$:

      $$
      \tau_{cerrada} = \frac{2}{\sqrt{3}}\,\frac{M_t}{a^{2}e} = 1{,}1547\,\frac{M_t}{a^{2}e}
      $$

      igual en toda la pared, porque $e$ es uniforme.

      **La sección abierta.** Por la analogía de Prandtl (apartado 12.4,
      p. 10), una sección abierta de pequeño espesor trabaja como un
      rectángulo largo y estrecho, con la tensión lineal en el espesor:
      $\tau_{\max} = M_tt/I_t$ (ec. 12.17), con
      $I_t = \tfrac{1}{3}\sum t_i^{3}s_i$. Los apuntes imprimen las ecs. 12.19
      y 12.20 sin el $\tfrac{1}{3}$; es una errata, porque el texto de la
      misma página dice que, con espesor uniforme, $\beta = \tfrac{1}{3}$. La
      línea media mide $3a$:

      $$
      I_t = \tfrac{1}{3}\cdot3a\cdot t^{3} = at^{3},\qquad \tau_{abierta} = \frac{M_t\,t}{at^{3}} = \frac{M_t}{at^{2}}
      $$

      en las dos caras de la pared.

      **La relación entre espesores.** Igualando:

      $$
      \frac{2}{\sqrt{3}}\,\frac{M_t}{a^{2}e} = \frac{M_t}{at^{2}}
      \quad\Longrightarrow\quad
      e = \frac{2}{\sqrt{3}}\,\frac{t^{2}}{a} = 1{,}1547\,\frac{t^{2}}{a}
      $$

      Como $t$ es mucho menor que $a$, $e$ es mucho menor que $t$: con
      $a = 20t$, la cerrada da la misma tensión con una pared de $0{,}0577\,t$,
      diecisiete veces más fina. En la cerrada el flujo da la vuelta al hueco
      y el brazo de su par es del orden de $a$; en la abierta tiene que volver
      por dentro del mismo espesor, con un brazo del orden de $t$. Es lo que
      dicen los apuntes tras la ec. 12.24 (p. 12): para soportar la tensión,
      lo más importante es el hueco.

      **Comprobaciones.** El motor del curso (torsión de secciones cerradas
      y abiertas de pared delgada, la abierta como tres tramos de lado $a$)
      da las tres expresiones, y con números ($a = 100$, $t = 2$ y su $e$)
      las dos secciones salen con la misma tensión.

  # ── Cuestión 2 · la barra rígida colgada de dos cables.
  - id: exerm2021-ord-2-la-barra-rigida-y-los-dos-cables
    titulo: La barra rígida colgada de dos cables de distinto módulo, y dónde poner P para que baje sin girar
    fuente: >-
      Cuestión 2 · Examen final del 15 de enero de 2021 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1 punto. El examen no publica resolución; el desarrollo es nuestro,
      con los apuntes del tema 8.
    nivel: examen
    enunciado: |
      (1p) Tenemos una barra rígida que está suspendida por dos cables de
      igual diámetro ø, y cuyos módulos de elasticidad son: $E_1$ y $E_2$,
      donde $E_1/E_2 = 3$. La longitud de la barra es $2L$ y la de los cables
      $L$. Se considera despreciable el peso propio de la barra. Dicha barra
      está sometida a una carga puntual $P$.

      Calcular la posición de la fuerza para que los puntos A y B tengan el
      mismo descenso.

      <figure class="figura-examen">
      <svg viewBox="0 0 470 305" role="img" width="470" height="305" aria-labelledby="exerm2021-ord-2-la-barra-rigida-y-los-dos-cables-fig-t exerm2021-ord-2-la-barra-rigida-y-los-dos-cables-fig-d">
      <title id="exerm2021-ord-2-la-barra-rigida-y-los-dos-cables-fig-t">La barra rígida AB colgada de dos cables y la carga P</title>
      <desc id="exerm2021-ord-2-la-barra-rigida-y-los-dos-cables-fig-d">Una barra horizontal AB, de longitud 2L (cota de abajo), cuelga de dos cables verticales que suben hasta el techo, uno en cada extremo; los dos miden L (cota a la derecha). Junto al cable de A se lee ø y E1; junto al de B, ø y E2. Una fuerza P hacia abajo actúa sobre la barra, entre A y B, sin cota de su posición.</desc>
      <line x1="62" y1="50" x2="98" y2="50" stroke="var(--ink)" stroke-width="1.6"/><path d="M68 50 l4.9 -4.9 M74 50 l4.9 -4.9 M80 50 l4.9 -4.9 M86 50 l4.9 -4.9 M92 50 l4.9 -4.9 M98 50 l4.9 -4.9" stroke="var(--faint)" stroke-width="1"/>
      <line x1="362" y1="50" x2="398" y2="50" stroke="var(--ink)" stroke-width="1.6"/><path d="M368 50 l4.9 -4.9 M374 50 l4.9 -4.9 M380 50 l4.9 -4.9 M386 50 l4.9 -4.9 M392 50 l4.9 -4.9 M398 50 l4.9 -4.9" stroke="var(--faint)" stroke-width="1"/>
      <line x1="80" y1="50" x2="80" y2="193" stroke="var(--ink)" stroke-width="1.6"/>
      <line x1="380" y1="50" x2="380" y2="193" stroke="var(--ink)" stroke-width="1.6"/>
      <rect x="78" y="193" width="304" height="14" fill="var(--faint)" fill-opacity=".6" stroke="var(--ink)" stroke-width="1.2"/>
      <text x="58" y="108" font-size="14" fill="var(--ink)">ø</text>
      <text x="90" y="148" font-size="14" fill="var(--ink)" font-style="italic">E<tspan font-size="11" dy="4">1</tspan></text>
      <text x="356" y="108" font-size="14" fill="var(--ink)">ø</text>
      <text x="352" y="148" font-size="14" fill="var(--ink)" font-style="italic">E<tspan font-size="11" dy="4">2</tspan></text>
      <text x="54" y="206" font-size="16" fill="var(--ink)">A</text>
      <text x="392" y="222" font-size="16" fill="var(--ink)">B</text>
      <line x1="161" y1="207" x2="161" y2="254" stroke="var(--live)" stroke-width="1.8"/><polygon points="161,262 157,253 165,253" fill="var(--live)"/>
      <text x="168" y="260" font-size="15" fill="var(--ink)" font-style="italic">P</text>
      <line x1="80" y1="210" x2="80" y2="292" stroke="var(--faint)" stroke-width="0.6"/>
      <line x1="380" y1="210" x2="380" y2="292" stroke="var(--faint)" stroke-width="0.6"/>
      <line x1="80" y1="286" x2="380" y2="286" stroke="var(--ink)" stroke-width="1"/><polygon points="380,286 373,288.6 373,283.4" fill="var(--ink)"/><polygon points="80,286 87,283.4 87,288.6" fill="var(--ink)"/>
      <text x="230" y="280" font-size="15" fill="var(--ink)" font-style="italic" text-anchor="middle">2L</text>
      <line x1="402" y1="50" x2="440" y2="50" stroke="var(--faint)" stroke-width="0.6"/>
      <line x1="390" y1="200" x2="440" y2="200" stroke="var(--faint)" stroke-width="0.6"/>
      <line x1="432" y1="50" x2="432" y2="200" stroke="var(--ink)" stroke-width="1"/><polygon points="432,200 429.4,193 434.6,193" fill="var(--ink)"/><polygon points="432,50 434.6,57 429.4,57" fill="var(--ink)"/>
      <text x="440" y="130" font-size="15" fill="var(--ink)" font-style="italic">L</text>
      </svg>
      <figcaption>

      Redibujada del original, que dibuja P sin cota de su posición.

      </figcaption>
      </figure>

      **Notas nuestras.** El cable de módulo $E_1$ cuelga de A y el de $E_2$,
      de B. La posición de $P$ se da como su distancia $x$ a A.
    pide: >-
      La distancia de P a A para que A y B bajen lo mismo, y la fuerza de cada
      cable.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿Qué dice la condición de que A y B bajen lo mismo?
        opciones:
          - texto: >-
              Que los dos cables se alargan lo mismo; con la misma longitud y
              la misma sección, sus fuerzas están en la proporción de sus
              módulos
            correcta: true
            mensaje: |
              Eso es. Con $\Delta L = NL/(EA)$ (ec. 8.9, p. 7 del tema 8) y la
              misma $L$ y la misma $A$, alargarse lo mismo es
              $N_1/E_1 = N_2/E_2$: el cable más rígido lleva más fuerza.
          - texto: >-
              Que los dos cables llevan la misma fuerza, así que $P$ va en el
              centro de la barra
            mensaje: |
              Con fuerzas iguales los dos cables tendrían la misma tensión,
              pero no el mismo alargamiento: el de A es tres veces más rígido
              y se alargaría la tercera parte. La barra giraría.
          - texto: >-
              Que las fuerzas están en la proporción inversa de los módulos:
              el cable más rígido, que se alarga menos, tiene que llevar menos
            mensaje: |
              Al revés. Para alargarse lo mismo que el otro, el cable más
              rígido necesita **más** fuerza: $\Delta L = NL/(EA)$, y con $E$
              triple hace falta $N$ triple.
      - tipo: calcular
        titulo: La fuerza del cable de B
        pregunta: |
          ¿Qué fuerza lleva el cable de B, en unidades de $P$?
        respuesta:
          tipo: numero
          valor: '0.25'
          tolerancia: 0.002
          formato: un número, en P
        distractores:
          - valor: '0.75'
            mensaje: |
              Es la del cable de A. El de B es el de $E_2$, el menos rígido:
              lleva la tercera parte que el de A.
          - valor: '0.5'
            mensaje: |
              Con fuerzas iguales los alargamientos no lo son: el cable de A
              es tres veces más rígido.
        pista: |
          $N_1/N_2 = E_1/E_2 = 3$ y, en vertical, $N_1 + N_2 = P$.
        desarrollo: |
          $3N_2 + N_2 = P$: $N_2 = \tfrac{1}{4}P$ y $N_1 = \tfrac{3}{4}P$.
      - tipo: calcular
        titulo: La posición de la carga
        pregunta: |
          ¿A qué distancia de A va $P$, en unidades de $L$?
        respuesta:
          tipo: numero
          valor: '0.5'
          tolerancia: 0.002
          formato: un número, la distancia a A en L
        distractores:
          - valor: '1.5'
            mensaje: |
              Es la distancia a B, o la de los cables cambiados. $P$ tiene que
              ir cerca del cable que lleva más, el de A.
          - valor: '1'
            mensaje: |
              Es el centro de la barra, el sitio de $P$ si los cables fueran
              iguales. Aquí el de A lleva tres cuartos de $P$.
        pista: |
          Momentos respecto de A: $P\,x = N_2\cdot2L$.
        desarrollo: |
          $$
          x = \frac{N_2\cdot2L}{P} = \tfrac{1}{4}\cdot2L = \tfrac{1}{2}L
          $$

          medida desde A.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              Mismo descenso en A y B: los dos cables se alargan lo mismo.
          - texto: >-
              $\Delta L = NL/(EA)$, con la misma $L$ y la misma $A$:
              $N_1/N_2 = E_1/E_2 = 3$.
          - texto: >-
              Con $N_1 + N_2 = P$: $N_1 = \tfrac{3}{4}P$ y
              $N_2 = \tfrac{1}{4}P$.
          - texto: >-
              Momentos respecto de A: $P\,x = N_2\cdot2L$, y $x = \tfrac{1}{2}L$.
          - texto: >-
              Para que la barra no gire, los dos cables tienen que llevar la
              misma fuerza.
            trampa: true
            mensaje: |
              Lo que hace falta para que no gire es que se alarguen lo mismo,
              no que tiren lo mismo. Con módulos distintos, la misma fuerza da
              alargamientos distintos.
    resolucion: |
      **Las incógnitas.** Las fuerzas de los dos cables, $N_1$ en A y $N_2$
      en B, y la posición $x$ de $P$, medida desde A. La estática da dos
      ecuaciones; la tercera es la condición del enunciado.

      **El mismo descenso.** La barra es rígida y cuelga de los cables: A
      baja lo que se alarga su cable, y B lo que se alarga el suyo. Con
      $\Delta L = NL/(EA)$ (ec. 8.9, p. 7 del tema 8), la misma $L$ y la misma
      sección, $A = \pi d^{2}/4$ con $d$ el diámetro ø:

      $$
      \frac{N_1L}{E_1A} = \frac{N_2L}{E_2A}
      \quad\Longrightarrow\quad
      \frac{N_1}{N_2} = \frac{E_1}{E_2} = 3
      $$

      **La estática.** En vertical, $N_1 + N_2 = P$, así que

      $$
      N_1 = \tfrac{3}{4}P,\qquad N_2 = \tfrac{1}{4}P
      $$

      Momentos respecto de A: $P\,x = N_2\cdot2L$, de donde

      $$
      x = \tfrac{1}{2}L\ \text{desde A}
      $$

      La barra baja sin girar
      $\delta = N_2L/(E_2A) = PL/(4E_2A)$. Se comprueba con los momentos
      respecto de B: $P\,(2L - x) = \tfrac{3}{2}PL = N_1\cdot2L$.

      **Qué dice.** Con dos cables iguales $P$ iría en el centro. El cable de
      A es tres veces más rígido: para alargarse lo mismo que el otro tiene
      que llevar el triple, y la carga se acerca a él. La carga se reparte en
      proporción a las rigideces $EA/L$, como en cualquier conjunto de
      elementos que se deforman lo mismo.

      **Comprobaciones.** El motor del curso resuelve los dos cables con la
      barra como un sólido rígido, para $P$ en cualquier punto, y busca dónde
      la diferencia entre los descensos de A y de B se anula: en $x = L/2$,
      con las mismas fuerzas y el mismo descenso, $PL/(4E_2A)$.

  # ── Cuestión 3 · el teorema del flujo cortante.
  - id: exerm2021-ord-3-el-teorema-del-flujo-cortante
    titulo: El teorema del flujo cortante, deducido, y un ejemplo en una sección rectangular
    fuente: >-
      Cuestión 3 · Examen final del 15 de enero de 2021 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1 punto. Vuelve igual, con el mismo número y los mismos puntos,
      como cuestión 3 de la extraordinaria del 2 de febrero de 2022, y ya
      había caído igual, con 1 punto, como cuestión 2 de la segunda parte y
      del examen final del 16 de enero de 2019, como cuestión 2 de la
      extraordinaria del 21 de junio de 2019 y como cuestión 1 de la segunda
      parte y cuestión 3 del examen final del 7 de enero de 2020. Es la
      cuestión 9 de la hoja de autoevaluación del tema 9 («Deducción del
      teorema del flujo cortante»), con otras palabras. El examen no publica
      resolución; el desarrollo es nuestro, con los apuntes del tema 9. Los
      números de los pasos de cálculo son un ejemplo nuestro.
    nivel: examen
    enunciado: |
      (1p) Teorema del flujo cortante.
    pide: >-
      El enunciado y la deducción del teorema, y, en un ejemplo nuestro, el
      flujo y la tensión máxima de una sección rectangular.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿De qué equilibrio sale el teorema?
        opciones:
          - texto: >-
              Del equilibrio según x de un trozo de rebanada, de longitud $dx$,
              cuya base $A_c$ es una parte de la sección limitada por una curva
              $c$
            correcta: true
            mensaje: |
              Eso es (apartado 9.3.2, p. 13 del tema 9). Las tensiones normales
              de las dos caras del trozo no son iguales, porque el flector
              cambia a lo largo de la viga, y la diferencia la equilibran las
              tangenciales de su cara lateral, la que corta la curva $c$.
          - texto: >-
              Del equilibrio de fuerzas verticales de la sección entera: las
              tangenciales tienen que sumar el cortante
            mensaje: |
              Eso es verdad, pero da una sola ecuación para toda la sección, y
              no dice cómo se reparten las tangenciales. El teorema aísla una
              **parte** de la sección, y por eso dice cuánto pasa por cada
              curva.
          - texto: >-
              De la ley de Hooke, con la distorsión $\gamma = \tau/G$ de las
              fibras de la sección
            mensaje: |
              El teorema no usa el material: es solo equilibrio. Por eso vale
              igual para cualquier material elástico, y por eso con él solo no
              se sabe cómo se reparte el flujo a lo largo de la curva.
      - tipo: calcular
        titulo: El flujo en una sección rectangular
        pregunta: |
          Un ejemplo nuestro: una sección rectangular de $b = 60$ mm de ancho
          y $h = 120$ mm de canto, con un cortante $T_y = 36$ kN. ¿Cuánto vale
          el flujo cortante a través de la fibra neutra, en N/mm?
        respuesta:
          tipo: numero
          valor: '450'
          tolerancia: 0.5
          formato: un número, en N/mm
        distractores:
          - valor: '900'
            mensaje: |
              Has tomado como brazo de $A_c$ la distancia del borde a la fibra
              neutra, $h/2$. En $Q_z^{c} = A_c\,y_c$ va la distancia del centro
              de gravedad de $A_c$, que está a $h/4$.
          - valor: '300'
            mensaje: |
              Es $T/h$, el cortante repartido por igual en el canto. El flujo
              no es uniforme: es nulo en los bordes y máximo en la fibra
              neutra (ec. 9.36).
        pista: |
          $q_c = T_y\,Q_z^{c}/I_z$ (ec. 9.35), con $A_c$ la mitad de la sección
          por encima de la fibra neutra.
        desarrollo: |
          $I_z = \tfrac{1}{12}\cdot60\cdot120^{3} = 8{,}64\cdot10^{6}$ mm⁴ y
          $Q_z^{c} = 60\cdot60\cdot30 = 1{,}08\cdot10^{5}$ mm³:

          $$
          q_c = \frac{36000\cdot1{,}08\cdot10^{5}}{8{,}64\cdot10^{6}} = 450\ \text{N/mm}
          $$
      - tipo: calcular
        titulo: La tensión tangencial máxima
        pregunta: |
          En la misma sección, ¿cuánto vale la tensión tangencial máxima, en
          MPa?
        respuesta:
          tipo: numero
          valor: '7.5'
          tolerancia: 0.02
          formato: un número, en MPa
        distractores:
          - valor: '5'
            mensaje: |
              Es la media, $T/(bh)$. La distribución es parabólica y su máximo
              es vez y media la media (ec. 9.37).
          - valor: '450'
            mensaje: |
              Es el flujo, en N/mm. La tensión es el flujo repartido en el
              ancho de la curva: $\tau = q_c/b$.
        pista: |
          Con las tensiones uniformes a lo ancho de la fibra neutra,
          $\tau = q_c/b$ (ec. 9.37).
        desarrollo: |
          $\tau_{\max} = 450/60 = 7{,}5$ MPa, que es
          $\tfrac{3}{2}\cdot36000/(60\cdot120) = 7{,}5$ MPa, la fórmula de la
          ec. 9.37 en la fibra neutra.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la respuesta completa, como en el examen, el enunciado del
          teorema del flujo cortante y su deducción.
        rubrica:
          - punto: >-
              Se aísla un trozo de rebanada de longitud dx con base Ac, parte
              de la sección limitada por la curva c, con un dibujo de las
              tensiones de sus caras (figura 9.7).
            porque: >-
              Todo el teorema es el equilibrio de ese trozo, y sin él no se
              sabe qué tensiones entran.
            minimo: true
          - punto: >-
              Equilibrio según x: la diferencia de las normales de las dos
              caras, ∫Ac σx,x dA dx, la equilibran las tangenciales τcx de la
              cara lateral, ∮c τcx ds dx (ecs. 9.26 y 9.27).
            porque: >-
              Es la ecuación de la que sale todo; las normales cambian de una
              cara a otra porque cambia el flector.
            minimo: true
          - punto: >-
              Se define el flujo cortante qc = ∮c τcx ds (ec. 9.28), y queda
              qc = ∫Ac σx,x dA (ec. 9.29).
            porque: >-
              Es el enunciado del teorema en su forma general.
            minimo: true
          - punto: >-
              Con la derivada de la ley de Navier, qc = T′y Qzᶜ/Iz + T′z Qyᶜ/Iy,
              con T′ las cortantes de la ec. 9.31; en ejes principales T′ = T,
              y con solo Ty, qc = Ty Qzᶜ/Iz (ecs. 9.30 a 9.35).
            porque: >-
              Es la forma con la que se calcula, con el momento estático del
              área aislada.
          - punto: >-
              Se dice qué da y qué no da: la suma de las tangenciales a lo
              largo de la curva, nula donde la curva sigue el contorno libre,
              pero no cómo se reparten, que necesita otras hipótesis.
            porque: >-
              Es lo que separa el teorema del cálculo de tensiones de cada
              sección (apartado 9.3.3).
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Se aísla un trozo de longitud $dx$ con base $A_c$, limitada por
              una curva $c$.
          - texto: >-
              Según x, la diferencia de las normales de las dos caras la
              equilibran las tangenciales de la cara lateral.
          - texto: >-
              Con $q_c = \int_c\tau_{cx}\,ds$, queda
              $q_c = \int_{A_c}\sigma_{x,x}\,dA$.
          - texto: >-
              Derivando la ley de Navier, en ejes principales y con solo $T_y$,
              $q_c = T_y\,Q_z^{c}/I_z$.
          - texto: >-
              El teorema da la distribución de las tangenciales a lo largo de
              la curva $c$.
            trampa: true
            mensaje: |
              Da su suma a lo largo de la curva, el flujo, y nada más. Para
              saber cómo se reparten hacen falta otras hipótesis: en el
              rectángulo, que son verticales y uniformes a lo ancho.
    resolucion: |
      **El trozo aislado.** En una viga en flexión simple, se aísla un trozo
      de longitud $dx$ cuya base $A_c$ es una parte de la sección, limitada
      por una curva $c$ (apartado 9.3.2 y figura 9.7, p. 13 del tema 9). En
      sus dos caras actúan tensiones normales: $\sigma_x$ en una y
      $\sigma_x + \sigma_{x,x}\,dx$ en la otra, porque el flector cambia de
      una sección a otra. En su cara lateral, la que corta la curva $c$,
      actúan las tangenciales $\tau_{cx}$, perpendiculares a $c$.

      **El equilibrio según x** (ecs. 9.26 y 9.27, pp. 13-14):

      $$
      \int_{A_c}\sigma_{x,x}\,dA\,dx = \int_c\tau_{cx}\,ds\,dx
      $$

      **El teorema.** Con el flujo cortante definido como
      $q_c = \int_c\tau_{cx}\,ds$ (ec. 9.28):

      $$
      q_c = \int_{A_c}\sigma_{x,x}\,dA
      $$

      (ec. 9.29, p. 14): el flujo de tangenciales que atraviesa la curva $c$
      es igual a lo que cambian, por unidad de longitud, las normales sobre
      el área que encierra. Derivando la ley de Navier con las inercias
      constantes (ec. 9.30), aparecen las cortantes $T'_y$ y $T'_z$ de la
      ec. 9.31; las integrales son los momentos estáticos de $A_c$,
      $Q_z^{c} = y_c\,A_c$ y $Q_y^{c} = z_c\,A_c$ (ecs. 9.32 y 9.33), y
      $q_c = T'_y\,Q_z^{c}/I_z + T'_z\,Q_y^{c}/I_y$ (ec. 9.34, p. 15). En
      ejes principales, $T' = T$, y con solo $T_y$:

      $$
      q_c = \frac{T_y\,Q_z^{c}}{I_z}
      $$

      (ec. 9.35, p. 16). Donde la curva sigue el contorno libre de la pieza,
      el flujo es nulo. El teorema da la **suma** de las tangenciales a lo
      largo de la curva; cómo se reparten necesita otras hipótesis
      (apartado 9.3.3).

      **Un ejemplo con números.** En un rectángulo de $b = 60$ mm por
      $h = 120$ mm con $T_y = 36$ kN, la curva es la fibra neutra y $A_c$ la
      mitad de arriba: $Q_z^{c} = 60\cdot60\cdot30 = 1{,}08\cdot10^{5}$ mm³ e
      $I_z = 8{,}64\cdot10^{6}$ mm⁴, y $q_c = 450$ N/mm. Con las tensiones
      verticales y uniformes a lo ancho (las hipótesis de la p. 17),
      $\tau_{\max} = q_c/b = 7{,}5$ MPa, que es la ec. 9.37,
      $\tfrac{3}{2}T/(bh)$. A 30 mm de la fibra neutra el flujo baja a
      $337{,}5$ N/mm, y en los bordes es nulo: la parábola de la ec. 9.36.

  # ── Cuestión 4 · la carga crítica de Euler.
  - id: exerm2021-ord-4-la-carga-critica-de-euler
    titulo: La carga crítica de pandeo de una columna biarticulada, deducida
    fuente: >-
      Cuestión 4 · Examen final del 15 de enero de 2021 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1 punto. Vuelve igual, con el mismo número y los mismos puntos,
      como cuestión 4 de la extraordinaria del 2 de febrero de 2022. Es la
      cuestión 2 de la hoja de autoevaluación del tema 14 («Carga crítica en
      una columna biarticulada (Euler)»), con otras palabras. El examen no
      publica resolución; el desarrollo es nuestro,
      con los apuntes del tema 14. Los números del paso de cálculo son un
      ejemplo nuestro.
    nivel: examen
    enunciado: |
      (1p) Calcular la carga crítica de pandeo en una columna biarticulada.
    pide: >-
      La deducción de la carga crítica de una columna articulada en los dos
      extremos y, en un ejemplo nuestro, su valor.
    pasos:
      - tipo: reconocer
        pregunta: |
          ¿En qué configuración de la columna se plantea el equilibrio?
        opciones:
          - texto: >-
              En la deformada: se supone la columna flectada por una
              perturbación y se busca la carga con la que esa forma también
              está en equilibrio
            correcta: true
            mensaje: |
              Eso es: es la condición de equilibrio indiferente (apartado
              14.2, p. 4 del tema 14). En la forma flectada, la carga tiene
              brazo, $M = Pv$, y eso es lo que mete $P$ en la ecuación de la
              elástica.
          - texto: >-
              En la recta, como en compresión simple: la carga crítica es la
              que lleva la tensión $P/A$ hasta la admisible
            mensaje: |
              En la columna recta $P$ no tiene brazo y no hay flector: nada
              dice cuándo deja de ser estable. Una columna esbelta pandea con
              tensiones muy por debajo de la admisible.
          - texto: >-
              En la recta, con el flector de $P$ por la excentricidad con la
              que se aplica
            mensaje: |
              Eso es la compresión excéntrica, el final del tema: da una
              flecha para cada carga, no una carga crítica. La de Euler
              supone la carga centrada.
      - tipo: calcular
        titulo: La carga crítica de una columna concreta
        pregunta: |
          Un ejemplo nuestro: una columna biarticulada de 2 m, de acero
          ($E = 210$ GPa), con sección rectangular maciza de 30 mm × 60 mm.
          ¿Cuál es su carga crítica, en kN?
        respuesta:
          tipo: numero
          valor: '69.95'
          tolerancia: 0.05
          formato: un número, en kN
        distractores:
          - valor: '279.80'
            mensaje: |
              Has usado el momento de inercia mayor, el de la flexión según el
              canto de 60 mm, o la longitud de pandeo de una columna empotrada
              en los dos extremos, $0{,}5L$: los dos errores dan lo mismo.
              Pandea según el menor, y biarticulada, $L_p = L$.
          - valor: '17.49'
            mensaje: |
              Has usado $L_p = 2L$, la de una columna empotrada y libre. La
              biarticulada es el caso de partida: $L_p = L$.
          - valor: '22.27'
            mensaje: |
              Has puesto $\pi$ y no $\pi^{2}$. Sale de
              $\alpha_zL = \pi$, con $\alpha_z^{2} = P/(EI_z)$: la carga va con
              el cuadrado.
        pista: |
          $P_{crit} = \pi^{2}EI_{\min}/L^{2}$ (ec. 14.8), con el momento de
          inercia menor de la sección.
        desarrollo: |
          $I_{\min} = \tfrac{1}{12}\cdot60\cdot30^{3} = 1{,}35\cdot10^{5}$ mm⁴, y

          $$
          P_{crit} = \frac{\pi^{2}\cdot210000\cdot1{,}35\cdot10^{5}}{2000^{2}} = 69951\ \text{N}
          $$

          es decir, $69{,}95$ kN: una tensión de $38{,}9$ MPa, muy por debajo
          de la de fluencia de cualquier acero.
      - tipo: redactar
        que: deduccion
        consigna: >-
          Escribe la respuesta completa, como en el examen, la deducción de la
          carga crítica de Euler de una columna biarticulada.
        rubrica:
          - punto: >-
              Se plantea el equilibrio en la configuración deformada tras una
              perturbación (equilibrio indiferente), con un dibujo de la
              columna flectada y sus ejes (figuras 14.1 y 14.2).
            porque: >-
              Es la idea de todo el tema: la carga crítica es la que permite
              una forma flectada en equilibrio.
            minimo: true
          - punto: >-
              El flector a una distancia x es M = Pv (ec. 14.1), y con la
              elástica d²v/dx² = −M/EIz (ec. 14.2) queda
              d²v/dx² + αz²v = 0, con αz² = P/EIz (ecs. 14.3 a 14.5).
            porque: >-
              Es la ecuación que hay que resolver, y la que mete P en la
              elástica.
            minimo: true
          - punto: >-
              La solución es v = C1 sen αz x + C2 cos αz x, y las condiciones
              v(0) = 0 y v(L) = 0 (ec. 14.6) dan C2 = 0 y sen αz L = 0.
            porque: >-
              Son los apoyos de la columna biarticulada, y C1 = 0 sería la
              recta, el equilibrio estable.
            minimo: true
          - punto: >-
              La menor carga es la de αz L = π: Pcrit = π²EIz/L² (ec. 14.7), y
              como lo mismo vale en el plano zx, Pcrit = π²EImin/L² (ec. 14.8).
            porque: >-
              Es el resultado que pide la pregunta, con el momento de inercia
              que manda.
      - tipo: justificar
        pregunta: Ordena la deducción. Una pieza es falsa.
        piezas:
          - texto: >-
              Se supone la columna flectada por una perturbación y en
              equilibrio en esa forma.
          - texto: >-
              $M = Pv$ y $v'' = -M/(EI_z)$: $v'' + \alpha_z^{2}v = 0$, con
              $\alpha_z^{2} = P/(EI_z)$.
          - texto: >-
              $v = C_1\sin\alpha_zx + C_2\cos\alpha_zx$; con $v(0) = 0$,
              $C_2 = 0$.
          - texto: >-
              Con $v(L) = 0$ y $C_1 \neq 0$, $\sin\alpha_zL = 0$, y la menor
              es $\alpha_zL = \pi$.
          - texto: >-
              $P_{crit} = \pi^{2}EI_{\min}/L^{2}$, con el momento de inercia
              menor.
          - texto: >-
              Las condiciones de contorno fijan también $C_1$, la amplitud de
              la flecha.
            trampa: true
            mensaje: |
              $C_1$ queda libre: con $P = P_{crit}$ la columna está en
              equilibrio con cualquier flecha pequeña. Por eso es un
              equilibrio indiferente, y por eso esta teoría da la carga, no la
              flecha.
    resolucion: |
      **El planteamiento.** Una columna articulada en sus dos extremos, de
      longitud $L$, con la carga $P$ centrada. Se le aplica una perturbación
      y se supone que en la forma flectada sigue en equilibrio: si lo está,
      el equilibrio es indiferente, y esa $P$ es la crítica (apartado 14.2,
      pp. 4-5 del tema 14). Por encima, el equilibrio es inestable; por
      debajo, estable.

      **La ecuación.** Con $v$ la flecha a una distancia $x$ del apoyo, el
      flector es

      $$
      M = Pv
      $$

      (ec. 14.1, p. 5), y la ecuación de la elástica,
      $d^{2}v/dx^{2} = -M/(EI_z)$ (ec. 14.2), queda

      $$
      \frac{d^{2}v}{dx^{2}} + \alpha_z^{2}v = 0,\qquad \alpha_z^{2} = \frac{P}{EI_z}
      $$

      (ecs. 14.3 a 14.5). Su solución general es
      $v = C_1\sin\alpha_zx + C_2\cos\alpha_zx$.

      **Las condiciones de contorno** (ec. 14.6, p. 6): $v(0) = 0$ da
      $C_2 = 0$, y $v(L) = 0$ da $C_1\sin\alpha_zL = 0$. Con $C_1 = 0$ la
      columna sigue recta: es el equilibrio estable. Para que haya una forma
      flectada, $\sin\alpha_zL = 0$, es decir, $\alpha_zL = \pi,\ 2\pi,\ \ldots$
      La carga más pequeña es la de $\alpha_zL = \pi$:

      $$
      P = \frac{\pi^{2}EI_z}{L^{2}}
      $$

      (ec. 14.7). El análisis en el plano zx es el mismo, con $I_y$, así que
      la columna pandea en el plano de menor rigidez:

      $$
      P_{crit} = \frac{\pi^{2}EI_{\min}}{L^{2}}
      $$

      (ec. 14.8). $C_1$ queda sin determinar: con la carga crítica, cualquier
      flecha pequeña es de equilibrio. Con otros enlaces se usa la longitud
      de pandeo en lugar de $L$ (ec. 14.9, p. 7).

      **Un ejemplo con números.** Una columna de 2 m de acero
      ($E = 210$ GPa), de sección maciza de 30 mm × 60 mm:
      $I_{\min} = \tfrac{1}{12}\cdot60\cdot30^{3} = 1{,}35\cdot10^{5}$ mm⁴ y
      $P_{crit} = 69{,}95$ kN, con una tensión media de $38{,}9$ MPa. La misma
      columna pandearía con el cuádruple si estuviera empotrada en los dos
      extremos.
  # ── Problema 1 · el cubo con σz desconocida y las dos galgas.
  - id: exerm2021-ord-5-el-cubo-con-dos-galgas
    titulo: Un estado de tensiones con σz desconocida y dos galgas, de la matriz de deformaciones a la dirección de τmax
    fuente: >-
      Problema 1 · Examen final del 15 de enero de 2021 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1,5 puntos, sin reparto por apartados. Empieza al pie de la página
      1 y sigue en la 2, con la línea de los datos y la figura. El examen no
      publica resolución; el desarrollo es nuestro, con los convenios de los
      temas 2, 3 y 4.
    nivel: examen
    enunciado: |
      (1,5p) En el estado de tensiones de la figura no se conoce el valor de
      $\sigma_z$ . Determinar:

      a) La matriz de tensiones y de deformaciones.

      b) Lectura del valor de la galga extensiométrica e1.

      c) Calcular las deformaciones principales.

      d) Calcular el vector unitario en XYZ de las direcciones con la tensión
      tangencial máxima.

      E=7·10⁵ Kp/cm²; G=2.6·10⁵ Kp/cm²; e₂=3.493·10⁻⁴

