      <figcaption>

      Redibujada del original, en la misma perspectiva. La flecha sin rótulo
      de la cara de arriba también está así en el examen.

      </figcaption>
      </figure>

      **Notas nuestras.** Las tensiones de la figura van en Kp/cm², y en las
      caras que no se ven actúan las mismas, con el sentido contrario. La
      galga e1 forma 20° con X, medidos hacia Y. Se conservan el espacio antes
      del punto en «$\sigma_z$ .» y «e1» sin subíndice en el apartado b.
    pide: >-
      a) σz, en Kp/cm², y las componentes εx y εxy de la matriz de
      deformaciones. b) La lectura de e1. c) Las deformaciones principales ε2
      y ε3. d) La tensión tangencial máxima y una de las direcciones en que
      actúa, como vector unitario en XYZ.
    pasos:
      - tipo: reconocer
        pregunta: |
          Antes de nada: ¿de dónde sale $\sigma_z$?
        opciones:
          - texto: >-
              De la galga e2, con la ley de Hooke: con $E$, $\nu$, $\sigma_x$ y
              $\sigma_y$ conocidas, la deformación que mide da una ecuación en
              $\sigma_z$
            correcta: true
            mensaje: |
              Eso es. e2 está pegada en la cara X, paralela a Z: lee
              $\varepsilon_z$. Hooke (ec. 4.2) da
              $\varepsilon_z = \left(\sigma_z - \nu(\sigma_x + \sigma_y)\right)/E$,
              una ecuación con una incógnita. $\nu$ no se da, pero sale de
              $E$ y $G$ (ec. 4.6).
          - texto: >-
              De ninguna parte; el problema no da $\nu$, y sin $\nu$ Hooke no
              se puede usar
            mensaje: |
              $\nu$ no se da, pero no hace falta darla: $E$, $G$ y $\nu$ no
              son independientes. De $G = E/\left(2(1 + \nu)\right)$ (ec. 4.6)
              sale $\nu = E/(2G) - 1$.
          - texto: >-
              De la galga e1, que es la que está pegada en la cara Z
            mensaje: |
              Una galga mide la deformación en la dirección en que está pegada,
              no la de la normal de su cara. e1 está en la cara Z, pero a 20°
              de X: mide una deformación del plano XY, que no depende de
              $\sigma_z$ más que por el efecto Poisson. Se lee con el tensor ya
              resuelto, en el apartado b.
      - tipo: calcular
        titulo: La tensión que falta
        pregunta: |
          ¿Cuánto vale $\sigma_z$, en Kp/cm²?
        respuesta:
          tipo: numero
          valor: '267.01'
          tolerancia: 0.05
          formato: un número con su signo, en Kp/cm²
        distractores:
          - valor: '244.51'
            mensaje: |
              Es $E\varepsilon_z$, sin el efecto Poisson. $\sigma_x$ y
              $\sigma_y$ también cambian la longitud según z:
              $E\varepsilon_z = \sigma_z - \nu(\sigma_x + \sigma_y)$ (ec. 4.2).
          - valor: '222.01'
            mensaje: |
              El signo del término de Poisson. De
              $E\varepsilon_z = \sigma_z - \nu(\sigma_x + \sigma_y)$ se despeja
              $\sigma_z = E\varepsilon_z + \nu(\sigma_x + \sigma_y)$: se suma.
          - valor: '291.24'
            mensaje: |
              Has tomado $\sigma_y = +35$ Kp/cm². En la cara de arriba la
              flecha de 35 empuja hacia la cara, hacia −Y: es una compresión,
              $\sigma_y = -35$ Kp/cm².
          - valor: '332.01'
            mensaje: |
              Has tomado $\nu = E/(2G) = 1{,}346$. De $G = E/\left(2(1 + \nu)\right)$
              (ec. 4.6), $\nu = E/(2G) - 1 = 0{,}3462$. Un $\nu$ mayor que
              $\tfrac{1}{2}$ no es posible (ec. 4.18, p. 8 del tema 4).
        pista: |
          Primero $\nu = E/(2G) - 1$ (ec. 4.6). Después, de Hooke (ec. 4.2),
          $\sigma_z = E\varepsilon_z + \nu(\sigma_x + \sigma_y)$, con
          $\varepsilon_z$ la lectura de e2.
        desarrollo: |
          $\nu = \dfrac{7\cdot10^{5}}{2\cdot2{,}6\cdot10^{5}} - 1 = 0{,}34615$, y con
          $E\varepsilon_z = 7\cdot10^{5}\cdot3{,}493\cdot10^{-4} = 244{,}51$ (en Kp/cm²):

          $$
          \sigma_z = 244{,}51 + 0{,}34615\cdot(100 - 35) = 267{,}01\ \text{Kp/cm}^{2}
          $$

          (el primer sumando ya en Kp/cm²).
      - tipo: calcular
        titulo: La deformación según X
        pregunta: |
          En la matriz de deformaciones, ¿cuánto vale $\varepsilon_x$, en
          millonésimas?
        respuesta:
          tipo: numero
          valor: '28.13'
          tolerancia: 0.05
          formato: un número con su signo, en millonésimas (10⁻⁶)
        distractores:
          - valor: '160.16'
            mensaje: |
              Te has dejado $\sigma_z$ en el término de Poisson. Ahora que se
              conoce, cuenta: $\varepsilon_x = \left(\sigma_x - \nu(\sigma_y + \sigma_z)\right)/E$,
              y $\sigma_z$ es la mayor de las tres.
          - valor: '142.86'
            mensaje: |
              Es $\sigma_x/E$, sin el efecto Poisson. Las tensiones según y y
              según z también acortan o alargan la dirección x (ec. 4.2).
        pista: |
          $\varepsilon_x = \dfrac{\sigma_x - \nu(\sigma_y + \sigma_z)}{E}$ (ec. 4.2).
        desarrollo: |
          $$
          \varepsilon_x = \frac{100 - 0{,}34615\cdot(-35 + 267{,}01)}{7\cdot10^{5}} = 28{,}13\cdot10^{-6}
          $$

          Es pequeña porque el efecto Poisson de $\sigma_z$ casi anula el de
          $\sigma_x$. Del mismo modo,
          $\varepsilon_y = \dfrac{-35 - 0{,}34615\cdot(100 + 267{,}01)}{7\cdot10^{5}} = -231{,}49\cdot10^{-6}$,
          y $\varepsilon_z = 349{,}30\cdot10^{-6}$, la lectura de e2.
      - tipo: calcular
        titulo: El término de fuera de la diagonal
        pregunta: |
          ¿Cuánto vale el término $\varepsilon_{xy}$ de la matriz de
          deformaciones, en millonésimas?
        respuesta:
          tipo: numero
          valor: '-57.69'
          tolerancia: 0.05
          formato: un número con su signo, en millonésimas (10⁻⁶)
        distractores:
          - valor: '-115.38'
            mensaje: |
              Es $\gamma_{xy} = \tau_{xy}/G$, la distorsión entera. En la
              matriz va la mitad: $\varepsilon_{xy} = \tfrac{1}{2}\gamma_{xy}$
              (ec. 3.35).
          - valor: '-21.43'
            mensaje: |
              Has dividido $\tau_{xy}$ por $2E$. La distorsión va con el módulo
              de cortadura: $\gamma_{xy} = \tau_{xy}/G$ (ec. 4.3).
          - valor: '57.69'
            mensaje: |
              El signo. En la cara X la tangencial de 30 va hacia −Y, y en la
              de arriba la recíproca hacia −X: $\tau_{xy} = -30$ Kp/cm².
        pista: |
          $\gamma_{xy} = \tau_{xy}/G$ (ec. 4.3), y en la matriz va
          $\tfrac{1}{2}\gamma_{xy}$ (ec. 3.35).
        desarrollo: |
          $\gamma_{xy} = \dfrac{-30}{2{,}6\cdot10^{5}} = -115{,}38\cdot10^{-6}$ y
          $\varepsilon_{xy} = \tfrac{1}{2}\gamma_{xy} = -57{,}69\cdot10^{-6}$. Como
          $\tau_{yz} = \tau_{zx} = 0$, los demás términos de fuera de la
          diagonal son nulos.
      - tipo: calcular
        titulo: La lectura de la galga e1
        pregunta: |
          ¿Qué lee la galga e1, en millonésimas?
        respuesta:
          tipo: numero
          valor: '-39.33'
          tolerancia: 0.05
          formato: un número con su signo, en millonésimas (10⁻⁶)
        distractores:
          - valor: '-20.78'
            mensaje: |
              Has puesto $\tfrac{1}{2}\gamma_{xy}$ en la fórmula de la galga.
              La ec. 3.55 lleva la distorsión entera:
              $\varepsilon_u = \varepsilon_x u_x^{2} + \varepsilon_y u_y^{2} + \gamma_{xy}u_xu_y$.
          - valor: '-238.20'
            mensaje: |
              Has medido los 20° desde Y. e1 forma 20° con X:
              $u_x = \cos20^{\circ}$ y $u_y = \sin20^{\circ}$.
          - valor: '34.84'
            mensaje: |
              Sale esto con $\tau_{xy} = +30$ o con la galga a −20°, hacia −Y:
              los dos errores dan lo mismo, porque solo cambia el signo del
              término de $\gamma_{xy}$. Aquí $\tau_{xy} = -30$ Kp/cm² y la
              galga sube hacia +Y.
        pista: |
          La ec. 3.55 con $u = (\cos20^{\circ},\ \sin20^{\circ},\ 0)$:
          $\varepsilon_u = \varepsilon_x u_x^{2} + \varepsilon_y u_y^{2} + \gamma_{xy}u_xu_y$.
        desarrollo: |
          Con $\cos^{2}20^{\circ} = 0{,}8830$, $\sin^{2}20^{\circ} = 0{,}1170$ y
          $\sin20^{\circ}\cos20^{\circ} = 0{,}3214$, en millonésimas:

          $$
          e_1 = 28{,}13\cdot0{,}8830 - 231{,}49\cdot0{,}1170 - 115{,}38\cdot0{,}3214 = -39{,}33
          $$
      - tipo: calcular
        titulo: La deformación principal intermedia
        pregunta: |
          ¿Cuánto vale la deformación principal intermedia, $\varepsilon_2$,
          en millonésimas?
        respuesta:
          tipo: numero
          valor: '40.37'
          tolerancia: 0.05
          formato: un número con su signo, en millonésimas (10⁻⁶)
        distractores:
          - valor: '72.00'
            mensaje: |
              Has puesto $\gamma_{xy}$ entera en el radio del círculo de Mohr.
              En el círculo de deformaciones la ordenada es
              $\tfrac{1}{2}\gamma$:
              $R = \sqrt{\left(\tfrac{1}{2}(\varepsilon_x - \varepsilon_y)\right)^{2} + \left(\tfrac{1}{2}\gamma_{xy}\right)^{2}}$.
        pista: |
          Z es dirección principal (no hay distorsiones con z), y su
          $\varepsilon_z$ es una de las tres. Las otras dos salen del círculo
          de Mohr del plano XY, con $\tfrac{1}{2}\gamma_{xy}$ como ordenada
          (similitud de la p. 17 del tema 3). Ordénalas al final.
        desarrollo: |
          Centro $\tfrac{1}{2}(28{,}13 - 231{,}49) = -101{,}68$ y radio
          $\sqrt{129{,}81^{2} + 57{,}69^{2}} = 142{,}05$ (en millonésimas): las
          del plano son $-101{,}68 \pm 142{,}05$, es decir, $40{,}37$ y
          $-243{,}73$. Con $\varepsilon_z = 349{,}30$, ordenadas:
          $\varepsilon_1 = 349{,}30$ (según Z), $\varepsilon_2 = 40{,}37$ y
          $\varepsilon_3 = -243{,}73$, en $10^{-6}$.
      - tipo: calcular
        titulo: La deformación principal menor
        pregunta: |
          ¿Y la menor, $\varepsilon_3$, en millonésimas?
        respuesta:
          tipo: numero
          valor: '-243.73'
          tolerancia: 0.05
          formato: un número con su signo, en millonésimas (10⁻⁶)
        distractores:
          - valor: '-275.36'
            mensaje: |
              Has puesto $\gamma_{xy}$ entera en el radio. En el círculo de
              deformaciones va $\tfrac{1}{2}\gamma_{xy}$.
          - valor: '-231.49'
            mensaje: |
              Es $\varepsilon_y$. Con $\gamma_{xy} \neq 0$, X e Y no son
              direcciones principales: la principal menor es menor que
              $\varepsilon_y$.
        pista: |
          La otra raíz del círculo del plano XY: centro menos radio.
        desarrollo: |
          $\varepsilon_3 = -101{,}68 - 142{,}05 = -243{,}73$ (en $10^{-6}$).
          Por Hooke en ejes principales sale lo mismo: con
          $\sigma_3 = -41{,}37$ Kp/cm² (la del paso siguiente),
          $\varepsilon_3 = \dfrac{-41{,}37 - 0{,}34615\cdot(267{,}01 + 106{,}37)}{7\cdot10^{5}} = -243{,}7\cdot10^{-6}$.
      - tipo: calcular
        titulo: La tensión tangencial máxima
        pregunta: |
          ¿Cuánto vale la tensión tangencial máxima del punto, en Kp/cm²?
        respuesta:
          tipo: numero
          valor: '154.19'
          tolerancia: 0.05
          formato: un número, en Kp/cm²
        distractores:
          - valor: '73.87'
            mensaje: |
              Es el radio del círculo del plano XY. Aquí $\sigma_z$ es la
              mayor de las tres principales, y el círculo mayor es el de
              $\sigma_1 = \sigma_z$ y $\sigma_3$: la máxima es su radio.
          - valor: '80.32'
            mensaje: |
              Es $\tfrac{1}{2}(\sigma_1 - \sigma_2)$. La máxima es el radio del
              círculo mayor, el de $\sigma_1$ y $\sigma_3$.
        pista: |
          Las principales: $\sigma_z$ y las dos del plano XY (centro y radio
          del círculo de Mohr, ec. 2.68). La tangencial máxima es el radio del
          círculo mayor (apartado 2.6.2, p. 27).
        desarrollo: |
          En el plano XY, centro $\tfrac{1}{2}(100 - 35) = 32{,}5$ y radio
          $\sqrt{67{,}5^{2} + 30^{2}} = 73{,}87$ (en Kp/cm²): $106{,}37$ y
          $-41{,}37$. Ordenadas, $\sigma_1 = 267{,}01$ (según Z),
          $\sigma_2 = 106{,}37$ y $\sigma_3 = -41{,}37$ Kp/cm², y

          $$
          \tau_{\max} = \tfrac{1}{2}(267{,}01 + 41{,}37) = 154{,}19\ \text{Kp/cm}^{2}
          $$
      - tipo: calcular
        titulo: Una dirección de la tangencial máxima
        pregunta: |
          De los vectores unitarios pedidos en el apartado d, da el que tiene
          las tres componentes positivas.
        respuesta:
          tipo: vector
          valor: '(0.1468, 0.6917, 0.7071)'
          tolerancia: 0.002
          formato: tres componentes entre paréntesis, separadas por comas, con punto decimal
        distractores:
          - valor: '(0.8385, 0.5449, 0)'
            mensaje: |
              Es una dirección de tangencial máxima del plano XY, a 45° de las
              dos principales del plano. Esa tangencial es el radio del círculo
              pequeño; la máxima del punto está a 45° de la 1 (Z) y de la 3.
          - valor: '(0.6917, -0.1468, 0.7071)'
            mensaje: |
              Has combinado Z con la dirección de $\sigma_2 = 106{,}37$, la de
              $-11{,}98^{\circ}$. La tangencial máxima está entre la 1 y la 3,
              y la 3 es la otra dirección del plano, a $78{,}02^{\circ}$ de X.
          - valor: '(0.2076, 0.9782, 1)'
            mensaje: |
              La dirección es la buena, pero el vector no es unitario: la suma
              de $\vec{n}_1$ y $\vec{n}_3$ mide $\sqrt{2}$, y hay que dividir
              por él.
        pista: |
          En el círculo de $\sigma_1$ y $\sigma_3$, el punto más alto está a
          90° de los dos extremos; en el sólido, a 45° de las dos direcciones,
          en el plano que forman: $\vec{n} = (\vec{n}_1 \pm \vec{n}_3)/\sqrt{2}$.
          La 1 es Z; la 3 sale de $\tan 2\theta = 2\tau_{xy}/(\sigma_x - \sigma_y)$
          (ec. 2.62).
        desarrollo: |
          $\tan 2\theta = -60/135$, $\theta = -11{,}98^{\circ}$; sustituyendo,
          ese ángulo da $106{,}37$, la 2. La 3 está a
          $-11{,}98^{\circ} + 90^{\circ} = 78{,}02^{\circ}$:
          $\vec{n}_3 = (0{,}2076,\ 0{,}9782,\ 0)$. Con $\vec{n}_1 = (0,\ 0,\ 1)$,

          $$
          \vec{n} = \frac{1}{\sqrt{2}}\,(0{,}2076,\ 0{,}9782,\ \pm 1) = (0{,}1468,\ 0{,}6917,\ \pm0{,}7071)
          $$

          y sus opuestos. La de las tres componentes positivas es la del signo
          +.
      - tipo: justificar
        pregunta: Ordena la resolución. Una pieza es falsa.
        piezas:
          - texto: >-
              $\nu = E/(2G) - 1 = 0{,}3462$, y e2, paralela a Z, da
              $\sigma_z = E\varepsilon_z + \nu(\sigma_x + \sigma_y) = 267{,}01$
              Kp/cm².
          - texto: >-
              Hooke da la matriz de deformaciones, con
              $\varepsilon_x = 28{,}13$, $\varepsilon_y = -231{,}49$,
              $\varepsilon_z = 349{,}30$ y $\varepsilon_{xy} = -57{,}69$, en
              $10^{-6}$.
          - texto: >-
              La galga e1, a 20° de X, lee $-39{,}33\cdot10^{-6}$.
          - texto: >-
              Z es principal; el círculo del plano XY da las otras dos, y
              $\varepsilon_1 = 349{,}30$, $\varepsilon_2 = 40{,}37$,
              $\varepsilon_3 = -243{,}73$, en $10^{-6}$.
          - texto: >-
              $\tau_{\max} = 154{,}19$ Kp/cm², a 45° de Z y de la dirección 3:
              $(0{,}1468,\ 0{,}6917,\ \pm0{,}7071)$ y sus opuestos.
          - texto: >-
              e1 está pegada en la cara Z, así que su lectura es
              $\varepsilon_z$ y da $\sigma_z$.
            trampa: true
            mensaje: |
              Una galga mide en la dirección en que está pegada, no según la
              normal de su cara. e1 está a 20° de X, en el plano XY. La que
              lee $\varepsilon_z$ es e2, pegada en la cara X paralela a Z.
    resolucion: |
      **Los datos.** De la figura, en Kp/cm²: $\sigma_x = 100$,
      $\sigma_y = -35$ (la flecha de 35 empuja hacia la cara de arriba) y
      $\tau_{xy} = -30$ (en la cara X la tangencial va hacia −Y; la flecha
      sin rótulo de la cara de arriba es su recíproca, hacia −X);
      $\tau_{yz} = \tau_{zx} = 0$. El coeficiente de Poisson no se da, pero
      sale de $E$ y $G$ (ec. 4.6, p. 5 del tema 4):

      $$
      \nu = \frac{E}{2G} - 1 = \frac{7\cdot10^{5}}{5{,}2\cdot10^{5}} - 1 = 0{,}34615
      $$

      **a) Las matrices.** La galga e2, en la cara X y paralela a Z, lee
      $\varepsilon_z = 349{,}30\cdot10^{-6}$. Hooke (ec. 4.2, p. 4):
      $E\varepsilon_z = \sigma_z - \nu(\sigma_x + \sigma_y)$, de donde

      $$
      \sigma_z = 244{,}51 + 0{,}34615\cdot65 = 267{,}01\ \text{Kp/cm}^{2}
      $$

      (los dos sumandos en Kp/cm²). La matriz de tensiones, en Kp/cm²:

      $$
      [\sigma] = \begin{pmatrix} 100 & -30 & 0 \\ -30 & -35 & 0 \\ 0 & 0 & 267{,}01 \end{pmatrix}
      $$

      Las deformaciones, por Hooke (ecs. 4.2 y 4.3), con
      $\gamma_{xy} = \tau_{xy}/G = -115{,}38\cdot10^{-6}$ y, en la matriz,
      $\tfrac{1}{2}\gamma_{xy}$ (ec. 3.35, p. 12 del tema 3):

      $$
      [\varepsilon] = \begin{pmatrix} 28{,}13 & -57{,}69 & 0 \\ -57{,}69 & -231{,}49 & 0 \\ 0 & 0 & 349{,}30 \end{pmatrix}\cdot10^{-6}
      $$

      **b) La galga e1.** Está en la cara Z, a 20° de X hacia Y. La ec. 3.55
      (p. 17 del tema 3), con la distorsión entera, en millonésimas:

      $$
      e_1 = 28{,}13\cdot0{,}8830 - 231{,}49\cdot0{,}1170 - 115{,}38\cdot0{,}3214 = -39{,}33
      $$

      **c) Las deformaciones principales.** Z es dirección principal, porque
      $\gamma_{yz} = \gamma_{zx} = 0$. En el plano XY, el círculo de Mohr de
      deformaciones (el de tensiones con $\tfrac{1}{2}\gamma$ como ordenada,
      p. 17 del tema 3): centro $-101{,}68$, radio
      $\sqrt{129{,}81^{2} + 57{,}69^{2}} = 142{,}05$, y raíces $40{,}37$ y
      $-243{,}73$. Ordenadas, en $10^{-6}$:

      $$
      \varepsilon_1 = 349{,}30\ \text{(según Z)},\qquad \varepsilon_2 = 40{,}37,\qquad \varepsilon_3 = -243{,}73
      $$

      **d) La tangencial máxima y sus direcciones.** Las principales de
      tensión tienen las mismas direcciones (material isótropo). En XY,
      centro $32{,}5$ y radio $73{,}87$: $106{,}37$ y $-41{,}37$ Kp/cm².
      Con $\sigma_z$, $\sigma_1 = 267{,}01$, $\sigma_2 = 106{,}37$ y
      $\sigma_3 = -41{,}37$ Kp/cm². La tangencial máxima es el radio del
      círculo mayor (apartado 2.6.2, p. 27 del tema 2):

      $$
      \tau_{\max} = \tfrac{1}{2}(267{,}01 + 41{,}37) = 154{,}19\ \text{Kp/cm}^{2}
      $$

      Actúa en los planos a 45° de las direcciones 1 y 3, en el plano que
      forman. La 1 es Z. La 3, en el plano XY (ec. 2.62, p. 23):
      $\tan 2\theta = 2\cdot(-30)/135$, $\theta = -11{,}98^{\circ}$, que es la
      de $106{,}37$; la de $-41{,}37$ está a $78{,}02^{\circ}$ de X,
      $\vec{n}_3 = (0{,}2076,\ 0{,}9782,\ 0)$. Las normales de los planos de
      $\tau_{\max}$:

      $$
      \vec{n} = \frac{\vec{n}_1 \pm \vec{n}_3}{\sqrt{2}} = (0{,}1468,\ 0{,}6917,\ \pm0{,}7071)
      $$

      y sus opuestos. En cada uno de esos planos, la tangencial va según la
      otra: el conjunto de direcciones es el mismo tanto si se leen como
      normales de los planos como si se leen como direcciones de la
      tangencial.

      **Comprobaciones.** El motor del curso (Hooke, la galga, las
      principales de deformación y de tensión por rotaciones de Jacobi y las
      componentes intrínsecas con el tensor completo) da lo mismo que las
      cuentas a mano. En el plano de normal $(0{,}1468,\ 0{,}6917,\ 0{,}7071)$
      la tangencial sale $154{,}19$ Kp/cm² y la normal
      $\tfrac{1}{2}(\sigma_1 + \sigma_3) = 112{,}82$ Kp/cm², como debe.

  # ── Problema 2 · la canasta de baloncesto.
  - id: exerm2021-ord-6-la-canasta-de-baloncesto
    titulo: El tubo que sostiene la canasta, dimensionado por el descenso de P con flexión, axil y cortante
    fuente: >-
      Problema 2 · Examen final del 15 de enero de 2021 · Elasticidad y
      Resistencia de Materiales, Escuela de Ingeniería de Gipuzkoa (UPV/EHU).
      Vale 1,5 puntos. La figura es una perspectiva con un jugador colgado del
      aro; aquí va redibujada en alzado. El examen no publica resolución; el
      desarrollo es nuestro, y cada cifra se ha comprobado con el motor del
      curso y por un segundo camino.
    nivel: examen
    enunciado: |
      (1,5p) Se ha proyectado una sencilla estructura para soportar el tablero
      y la canasta de una pista de baloncesto. Se trata de un tubo de acero
      embebido en un bloque de hormigón a 45º de la horizontal según se indica
      en la figura.

      Se supone que el estado de carga más desfavorable es el que se produce
      cuando un jugador permanece un instante sujeto al aro de la canasta,
      transmitiendo así todo su peso a la estructura en la forma indicada en
      la figura.

      Se estima que el esfuerzo máximo que el jugador puede llegar a
      transmitir al aro es de F=2000N y M=10⁶Nmm.

      La estructura se quiere construir en tubo redondo de acero con espesor
      de pared de t=4 mm.

      a) Calcular el diámetro necesario para que el descenso vertical del
      punto P no exceda los 80 mm.

      Notas importantes:

      \- Considerar la energía de flexión, axial y cortante.

      $I_Z = I_Y = \pi R^{3}t$ ; $A = 2\pi Rt$ ; Factor de cortante $\chi_Y = 2$

      L=4000mm; L₀=1000mm;

      E=2.1·10⁵ MPa; G=8·10⁴ MPa

